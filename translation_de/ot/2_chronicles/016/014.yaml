  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: de
  text: Sie begruben ihn in seiner Grabstätte[a], die er sich in der Davidstadt ausgehauen hatte. Dann betteten sie ihn auf ein Lager[b], das mit Duftstoffen und verschiedenen kunstvoll zubereiteten Mischungen gefüllt worden war. Ihm zu Ehren ließen sie ein sehr großes Feuer brennen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seinen Gräbern“. Gemeint ist wahrscheinlich seine Grabanlage oder Grabstätte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf ein Bett“ beziehungsweise „auf eine Bahre“. Das hebräische Wort bezeichnet einen Ort zum Liegen; hier ist wohl ein Totenlager gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Was verbrannt wurde, sagt der hebräische Text nicht. Wahrscheinlich handelt es sich um einen ehrenvollen Bestattungsbrauch, bei dem Duftstoffe oder andere Materialien verbrannt wurden; eine Einäscherung des Leichnams wird dadurch nicht zwingend behauptet.
    reason: cultural_note
lexical_decisions:
- source_word: בְקִבְרֹתָיו
  choice: in seiner Grabstätte
  rationale: Die hebräische Form ist pluralisch („in seinen Gräbern“), bezeichnet im Zusammenhang aber wahrscheinlich eine zusammengehörige königliche Grabanlage. „Grabstätte“ gibt diesen kollektiven Sinn im natürlichen Deutschen wieder; die Form wird in einer Fußnote offengelegt.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: die er sich … ausgehauen hatte
  rationale: כָּרָה bedeutet graben oder ausheben. Bei einer Grabstätte in der Davidstadt ist „aushauen“ sachlich passend und wahrt den Rückbezug „für sich“.
- source_word: בְּעִיר דָּוִיד
  choice: in der Davidstadt
  rationale: „Davidstadt“ ist die geläufige, klare deutsche Wiedergabe des Ortsnamens.
- source_word: בַּמִּשְׁכָּב
  choice: auf ein Lager
  rationale: מִשְׁכָּב bezeichnet einen Ort zum Liegen, ein Bett oder Lager. „Lager“ bewahrt die lexikalische Breite; im Bestattungskontext ist wahrscheinlich eine Totenbahre oder ein Totenlager gemeint.
- source_word: אֲשֶׁר מִלֵּא
  choice: das … gefüllt worden war
  rationale: Das hebräische Verb steht aktiv mit grammatisch männlichem Subjekt, doch dessen Bezug ist im Zusammenhang nicht sicher. Die deutsche Passivform wahrt den Ergebnissinn, ohne einen Ausführenden festzulegen.
- source_word: בְּשָׂמִים וּזְנִים מְרֻקָּחִים
  choice: mit Duftstoffen und verschiedenartigen … zubereiteten Gewürzmischungen
  rationale: בְּשָׂמִים sind wohlriechende Stoffe. Das seltene וּזְנִים wird wahrscheinlich im Sinn von Arten oder Sorten verstanden; מְרֻקָּחִים bezeichnet fachkundig gemischte Duft- oder Salbstoffe. Die Wiedergabe bleibt verständlich und kennzeichnet die Unsicherheit in einer Fußnote.
- source_word: בְּמִרְקַחַת מַעֲשֶׂה
  choice: nach der Kunst der Salbenmischer
  rationale: Die Wendung beschreibt die fachkundige Arbeit des Mischens beziehungsweise Herstellens von Duft- und Salbstoffen. „Nach der Kunst der Salbenmischer“ bewahrt den handwerklichen Charakter.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: Ihm zu Ehren veranstalteten sie einen überaus großen Brand
  rationale: Die figura etymologica aus שׂרף und שׂרֵפָה wird mit „Brand“ sachlich wiedergegeben. לֹו bezeichnet hier wahrscheinlich die Ehrung des Verstorbenen. Die Formulierung vermeidet es, den Gegenstand des Verbrennens im Haupttext festzulegen.
theological_decisions:
- issue: Bedeutung des großen Brandes bei Asas Bestattung
  choice: Ein zu Asas Ehren veranstalteter Bestattungsbrand, dessen Gegenstand nicht ausdrücklich genannt wird
  alternative: Einäscherung seines Leichnams
  rationale: Der Text berichtet zuerst ausdrücklich von Asas Beisetzung und nennt anschließend einen „Brand für ihn“. Daher wird die Verbrennung nicht als Einäscherung des Leichnams festgelegt. Wahrscheinlich wurden bei der königlichen Trauerfeier Duftstoffe oder andere Materialien verbrannt; diese historische Deutung gehört in die Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Bestattungssprache. „Davidstadt“, „Grabstätte“ und „Lager“ sind geläufig; die seltene Fachvorstellung des Salbenmischens bleibt erkennbar. Die Satzfolge wurde in zwei Hauptsätze gegliedert, um den langen hebräischen Erzählfluss im Deutschen klar wiederzugeben.
