base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: de
  text: Denn die Augen JHWHs durchstreifen die ganze Erde, um die zu stärken, deren Herz ungeteilt auf ihn gerichtet ist.[a] Darin hast du töricht gehandelt; denn von nun an wirst du Kriege haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um sich denen gegenüber als stark zu erweisen, deren Herz ihm ungeteilt zugewandt ist.“'
    reason: Lexikalisch-syntaktische Alternative zu לְהִתְחַזֵּק und עִם.
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
- source_word: עֵינָיו
  choice: die Augen JHWHs
  rationale: Bewahrt das anschauliche anthropomorphe Bild von Gottes Sehen und Aufmerksamkeit.
- source_word: מְשֹׁטְטוֹת
  choice: durchstreifen
  rationale: Gibt die fortwährende, aktive Bewegung des Partizips idiomatisch und bildhaft wieder.
- source_word: בְּכָל הָאָרֶץ
  choice: die ganze Erde
  rationale: Der Ausspruch ist universal formuliert; „Erde“ passt hier besser als das ebenfalls mögliche „Land“.
- source_word: לְהִתְחַזֵּק
  choice: um … zu stärken
  rationale: 'Versteht die Verbform in ihrem kontextuellen, begünstigenden Sinn: JHWH setzt seine Stärke zugunsten der Treuen ein. Die stärker reflexive Lesart wird in der Fußnote bewahrt.'
- source_word: עִם לְבָבָם שָׁלֵם אֵלָיו
  choice: die, deren Herz ungeteilt auf ihn gerichtet ist
  rationale: „Ungeteilt“ bezeichnet uneingeschränkte Loyalität, nicht sündlose Vollkommenheit; die kollektive Einzahl „Herz“ bleibt erhalten.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: Darin hast du töricht gehandelt
  rationale: Gibt den prophetischen Vorwurf in natürlichem, prägnantem Deutsch wieder und verweist auf Asas vorausgehendes Handeln.
- source_word: מֵעַתָּה
  choice: von nun an
  rationale: Natürliche moderne Wiedergabe der zeitlichen Bestimmung.
- source_word: יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: wirst du Kriege haben
  rationale: Die Existenzkonstruktion erhält durch „von nun an“ Zukunftsbezug; die Formulierung wahrt zugleich die Mehrzahl und den Gedanken wiederkehrender Konflikte.
theological_decisions:
- issue: Bedeutung von שָׁלֵם für das auf JHWH gerichtete Herz
  choice: ungeteilte, ganzheitliche Treue
  alternative: Untadeligkeit oder Vollkommenheit
  rationale: Im Zusammenhang geht es um Asas ungeteiltes Vertrauen auf JHWH statt auf menschliche Macht, nicht um moralische Sündlosigkeit.
- issue: Reichweite von הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Die Aussage hat einen allgemeinen, sprichwortartigen Charakter und beschreibt JHWHs weltweite Aufmerksamkeit.
- issue: Aussage von לְהִתְחַזֵּק
  choice: JHWH stärkt die ihm ungeteilt Zugewandten
  alternative: JHWH erweist sich für sie als stark
  rationale: Beide Deutungen sind sprachlich möglich. Der Haupttext bringt die begünstigende Wirkung knapp zum Ausdruck; die Fußnote erhält die reflexivere Nuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache des hebräischen Textes bleibt erhalten; „ungeteilt“ vermeidet die missverständliche Vorstellung sündloser Vollkommenheit.
