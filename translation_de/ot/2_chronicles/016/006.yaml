  text: וְ/אָסָ֣א הַ/מֶּ֗לֶךְ לָקַח֙ אֶת כָּל יְהוּדָ֔ה וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֣בֶן בָּ/הֶ֔ם אֶת גֶּ֖בַע וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: de
  text: Dann bot König Asa ganz Juda auf[a]. Sie schafften die Steine und das Bauholz von Rama fort, mit denen Bascha gebaut hatte[b]. Damit baute Asa Geba und Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nahm ganz Juda“; gemeint ist hier offenbar, dass Asa die Bevölkerung Judas für die Arbeiten aufbot.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: mit den Steinen und dem Bauholz, die Bascha zum Ausbau Ramas verwendet hatte.'
    reason: lexical_clarification
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: bot ganz Juda auf
  rationale: Wörtlich heißt die Wendung „nahm ganz Juda“. Im Zusammenhang bezeichnet sie jedoch die Mobilisierung der Bevölkerung für die Arbeit; „aufbieten“ gibt diesen idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: וַיִּשְׂאוּ
  choice: sie schafften … fort
  rationale: נשׂא bezeichnet hier das Aufnehmen und Wegtransportieren des Baumaterials. „Fortschaffen“ ist im Deutschen präzise und idiomatisch.
- source_word: אַבְנֵי הָרָמָה
  choice: die Steine von Rama
  rationale: Die Status-constructus-Verbindung bezeichnet die Steine der dortigen Anlage. „Von Rama“ kann sowohl ihre Zugehörigkeit als auch ihre Entfernung aus Rama natürlich ausdrücken.
- source_word: עֵצֶיהָ
  choice: sein Bauholz
  rationale: Das Suffix bezieht sich auf Rama beziehungsweise dessen Bauanlage. „Bauholz“ verdeutlicht den Gebrauch des Holzes, ohne eine bestimmte Form wie Balken vorauszusetzen.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: mit denen Bascha gebaut hatte
  rationale: Der Relativsatz bezieht sich im Kontext auf Steine und Holz als das von Bascha verwendete Baumaterial. Die Formulierung wahrt die knappe Aussage, ohne ausdrücklich zu ergänzen, was er damit gebaut hatte.
- source_word: וַיִּבֶן בָּהֶם
  choice: Damit baute Asa
  rationale: Das Singularverb hat Asa als Subjekt, während das Pluralpronomen auf die Baustoffe zurückweist. Der Name wird zur eindeutigen Zuordnung des Subjekts wiederholt.
- source_word: גֶּבַע
  choice: Geba
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Gebräuchliche deutsche Form des Ortsnamens; der hebräische Artikel wird bei deutschen Ortsnamen nicht wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „ganz Juda aufbieten“ macht die Mobilisierung der Bevölkerung verständlich; die wörtliche Form bleibt in der Fußnote erhalten. Der Haupttext ergänzt weder ausdrücklich „befestigen“ noch „ausbauen“, da das hebräische Verb lediglich „bauen“ sagt.
