  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Bezüge des Hebräischen korrekt wieder: Asa mobilisiert ganz Juda, die Materialien werden aus Rama abtransportiert, und Asa baut damit Geba und Mizpa. Die Wiedergabe von לָקַח als „bot ... auf“ ist im Kontext gut begründet und durch die Fußnote transparent gemacht.'
