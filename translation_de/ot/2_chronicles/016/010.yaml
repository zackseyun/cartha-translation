revisions:
- from: Da wurde Asa zornig auf den Seher und ließ ihn ins Gefängnis[a] bringen, denn deswegen war er voller Wut auf ihn. Zu jener Zeit misshandelte Asa auch einige aus dem Volk schwer.[b]
  to: Da wurde Asa zornig auf den Seher und ließ ihn ins Gefängnis[a] bringen, denn er war deshalb wütend auf ihn. Zu jener Zeit misshandelte Asa einige aus dem Volk schwer[b].
  rationale: Die Revision glättet eine redundante deutsche Kausalformulierung, entfernt eine nicht notwendige additive Nuance und formuliert die Fußnote zur schwierigen Haftbezeichnung vorsichtiger. Der Sinn, die Gewalttönung des Verbs רצץ, die partitive Aussage und die begriffliche Unterscheidung „Seher“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:07:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen grundsätzlich treffend wieder: Asas Zorn gegen den Seher, dessen Inhaftierung, der Anlass seines Zorns sowie die gewaltsame Behandlung eines Teils des Volkes. „Seher“ bewahrt רֹאֶה angemessen. Die partitive Wiedergabe „einige aus dem Volk“ ist korrekt. Die Haftbezeichnung bleibt unsicher und sollte daher im Haupttext funktional und in einer vorsichtig formulierten Fußnote erläutert werden.'
  naturalness: „Denn deswegen war er voller Wut auf ihn“ ist im modernen Standarddeutsch unnötig doppelt und stilistisch schwerfällig. „Denn er war deshalb wütend auf ihn“ ist natürlich und behält Intensität sowie Bezug bei. Das unmarkierte „auch“ kann entfallen, da es über die bloße Erzählfortsetzung hinaus eine zusätzliche Nuance einträgt.
  terminology: „Gefängnis“ ist als funktionale Wiedergabe von בֵּית הַמַּהְפֶּכֶת vertretbar, wenn die Fußnote die unsichere, wahrscheinlich mit Stock/Fesselung verbundene Bedeutung wahrt. Die Formulierung „Haus der Fessel“ sollte nicht als wörtliche Übersetzung ausgegeben werden, weil sie den hebräischen Ausdruck zu eng festlegt. „schwer misshandelte“ gibt die gewaltsame Piel-Bedeutung von רצץ gut wieder.
  issues:
  - severity: low
    issue: Redundante und wenig idiomatische Formulierung „denn deswegen war er voller Wut auf ihn“
    rationale: Das Deutsche benötigt nicht zugleich „denn“ und „deswegen“ in dieser Konstruktion. Eine schlankere Formulierung wahrt den kausalen Bezug von עַל זֹאת.
  - severity: low
    issue: Fußnote a bezeichnet „Haus der Fessel“ als mögliche wörtliche Wiedergabe
    rationale: Die Bedeutung von בֵּית הַמַּהְפֶּכֶת ist umstritten; die Fußnote sollte die wahrscheinlichere Verbindung mit dem Stock bzw. einer Fesselvorrichtung als Deutung, nicht als gesicherte wörtliche Übersetzung, kennzeichnen.
  - severity: low
    issue: „auch“ ist nicht ausdrücklich im Ausgangstext markiert
    rationale: Die Konjunktion verbindet die Aussagen; ein deutsches „auch“ ist möglich, aber für eine engere Wiedergabe nicht erforderlich.
