  text: וַ/יִּכְעַ֨ס אָסָ֜א אֶל הָ/רֹאֶ֗ה וַֽ/יִּתְּנֵ֨/הוּ֙ בֵּ֣ית הַ/מַּהְפֶּ֔כֶת כִּֽי בְ/זַ֥עַף עִמּ֖/וֹ עַל זֹ֑את וַ/יְרַצֵּ֥ץ אָסָ֛א מִן הָ/עָ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: de
  text: Da wurde Asa zornig auf den Seher und ließ ihn ins Gefängnis[a] bringen, denn er war deshalb wütend auf ihn. Zu jener Zeit misshandelte Asa einige aus dem Volk schwer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise „in das Haus des Stocks“. Der hebräische Ausdruck bezeichnet wohl einen Haftort, an dem Gefangene gefesselt oder in den Stock gelegt wurden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch mit „zerschlug“, „unterdrückte“ oder „gewaltsam behandelte“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: wurde zornig
  rationale: Das Verb כעס bezeichnet Zorn oder Verärgerung; die ingressiv-narrative Form wird natürlich mit „wurde zornig“ wiedergegeben.
- source_word: הָרֹאֶה
  choice: den Seher
  rationale: רֹאֶה ist eine ältere Bezeichnung für einen prophetischen Seher; „Seher“ bewahrt den spezifischen Ausgangsbegriff.
- source_word: וַיִּתְּנֵהוּ בֵּית הַמַּהְפֶּכֶת
  choice: ließ ihn ins Gefängnis bringen
  rationale: נתן mit Zielangabe bedeutet hier, jemanden an einen Haftort bringen beziehungsweise dort festsetzen zu lassen. Die schwierige Ortsbezeichnung wird im Haupttext funktional und in der Fußnote genauer wiedergegeben.
- source_word: בְזַעַף עִמּוֹ עַל זֹאת
  choice: denn deswegen war er voller Wut auf ihn
  rationale: זַעַף bezeichnet heftigen Zorn; עַל זֹאת verweist auf den unmittelbar zuvor genannten Anlass. Die Formulierung wahrt die Intensität und klingt im Deutschen natürlich.
- source_word: וַיְרַצֵּץ
  choice: misshandelte … schwer
  rationale: Das Piel von רצץ trägt die gewaltsame Grundbedeutung „zerschlagen, zerdrücken“ und bezeichnet bei Menschen hier schwere gewaltsame Behandlung; „schwer misshandeln“ vermittelt dies, ohne ein wörtliches Zerquetschen festzulegen.
- source_word: מִן הָעָם
  choice: einige aus dem Volk
  rationale: Die Präposition מִן ist hier partitiv und bezeichnet einen Teil des Volkes, nicht das gesamte Volk.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Eine natürliche und zugleich würdevolle deutsche Wiedergabe der Zeitangabe.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählstil. Die schwierige Haftbezeichnung und die gewaltsame Bedeutung von רצץ werden im Haupttext verständlich wiedergegeben, während die Fußnoten die lexikalische Unsicherheit und Bildhaftigkeit bewahren.
