base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: de
  text: Als Bascha davon hörte, brach er den Ausbau Ramas[a] ab und stellte seine Arbeit ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rama zu befestigen“. Das Hebräische bezeichnet hier die Bau- oder Befestigungsarbeiten an Rama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … davon hörte
  rationale: Die hebräische Verbindung leitet einen zeitlichen Nebensatz ein. „Als“ gibt dies im heutigen Deutsch natürlich wieder; „davon“ ergänzt idiomatisch den aus dem Zusammenhang erschließbaren Inhalt des Hörens.
- source_word: בַּעְשָׁא
  choice: Bascha
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: hörte er auf, … auszubauen
  rationale: חדל mit מן und Infinitiv bezeichnet das Aufhören mit einer Tätigkeit. „Aufhören, … auszubauen“ ist natürliches Deutsch und lässt im Zusammenhang sowohl weitere Bauarbeiten als auch die Befestigung der Stadt erkennen.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: הָרָמָה ist hier der Ortsname Rama und das direkte Objekt der Bautätigkeit.
- source_word: וַיַּשְׁבֵּת
  choice: und stellte … ein
  rationale: Der Hifil von שבת bedeutet hier, etwas zum Stillstand zu bringen. Mit „Arbeit“ als Objekt ist „stellte … ein“ eine klare und idiomatische Wiedergabe.
- source_word: מְלַאכְתּוֹ
  choice: seine Arbeit
  rationale: מלאכה bezeichnet Arbeit oder ein Arbeitsvorhaben. Die breite Wiedergabe „seine Arbeit“ bewahrt den Wortlaut, während der Kontext die Bauarbeiten näher bestimmt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die leichte Wiederholung „hörte … hörte … auf“ ist grammatisch klar; „ausbauen“ hält den Bezug zur Bautätigkeit fest, ohne die im Kontext naheliegende Befestigung als einzig mögliche Bedeutung festzuschreiben.
