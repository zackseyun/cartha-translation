  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: de
  text: Siehe, die Taten Asas[a], die früheren und die späteren – siehe, sie sind im Buch der Könige von Juda und Israel niedergeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die Angelegenheiten Asas, die ersten und die letzten«. In dieser geschichtlichen Schlussformel kann der Ausdruck Asas Taten und sonstige Begebenheiten seiner Regierung umfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Bewahrt die Aufmerksamkeit weckende Kraft der hebräischen Einleitungsformel, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes zeitliches »nun« einzuführen.
- source_word: דִּבְרֵי אָסָא
  choice: die Taten Asas
  rationale: דְּבָרִים bezeichnet in königlichen Schlussnotizen umfassend die Angelegenheiten beziehungsweise Taten eines Herrschers, nicht nur seine Worte.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: die früheren und die späteren
  rationale: Gibt das substantivisch gebrauchte Adjektivpaar eng am Hebräischen wieder und lässt seinen umfassenden historiografischen Sinn erkennen.
- source_word: הִנָּם כְּתוּבִים
  choice: siehe, sie sind … niedergeschrieben
  rationale: Das zweite deiktische Element wird ausdrücklich beibehalten; »niedergeschrieben« bezeichnet natürlich und genau den fortbestehenden schriftlichen Eintrag.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Bei einem Quellenverweis ist deutsches »im Buch« idiomatisch; »auf dem Buch« wäre unnatürlich.
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: der Könige von Juda und Israel
  rationale: Bleibt transparent beim ausdrücklichen Wortlaut »Könige« und gibt die relationale Funktion von לִ natürlich mit »von« wieder.
