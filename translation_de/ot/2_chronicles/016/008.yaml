source:
  edition: WLC
  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: de
  text: Waren die Kuschiter und die Lubiter nicht ein sehr großes Heer[a], mit überaus vielen Streitwagen und Reitern? Doch als du dich auf Jahwe stütztest, gab er sie in deine Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Äthiopier und die Libyer«. Hier stehen die quellennahen Volksnamen »Kuschiter« und »Lubiter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Waren ... nicht
  rationale: Leitet eine rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird; die deutsche Form bewahrt diese Wirkung.
- source_word: הַכּוּשִׁים וְהַלּוּבִים
  choice: die Kuschiter und die Lubiter
  rationale: Die quellennahen Volksnamen vermeiden eine vorschnelle Gleichsetzung mit heutigen geografischen oder nationalen Bezeichnungen.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: waren ... ein sehr großes Heer
  rationale: חַיִל bezeichnet hier eine militärische Streitmacht, während לָרֹב deren große Stärke beziehungsweise Zahl hervorhebt.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: mit überaus vielen Streitwagen und Reitern
  rationale: Die Formulierung gibt die militärischen Mittel konkret wieder und bewahrt die starke zahlenmäßige Steigerung.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Doch als du dich auf ... stütztest
  rationale: Das deutsche Bild 'sich auf jemanden stützen' wahrt die hebräische Metapher des vertrauenden Sich-Verlassens; 'Doch' verdeutlicht den argumentativen Gegensatz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: gab er sie in deine Hand
  rationale: Die geläufige hebräische Siegesformel bleibt als verständliches Bild erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich; die Wiedergabe als Eigenname erhält diesen sprachlichen und theologischen Charakter.
- issue: Verhältnis von Vertrauen und Sieg
  choice: als du dich auf Jahwe stütztest, gab er sie in deine Hand
  alternative: weil du auf Jahwe vertrautest, gab er sie in deine Hand
  rationale: Die temporale Form bewahrt die grammatische Offenheit der Konstruktion und vermeidet, den Zusammenhang stärker kausal festzulegen, als es die Formulierung verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das konkrete Bild des Sich-Stützens sowie die Wendung »in deine Hand geben« bleiben erhalten.
