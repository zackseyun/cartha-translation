  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: de
  text: Und Asa legte sich zu seinen Vätern[a] und starb im einundvierzigsten Jahr seiner Herrschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »legte sich zu seinen Vätern«; eine übliche hebräische Ausdrucksweise für den Tod und die Bestattung bei den Vorfahren.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt die bildhafte hebräische Todesformel, ohne das unmittelbar folgende ausdrückliche »starb« vorwegzunehmen.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die im Deutschen vertraute Formulierung erhält den familiären und dynastischen Bezug des hebräischen Ausdrucks; »zu seinen Vorfahren« wäre verständlicher, aber weniger formnah.
- source_word: וַיָּמָת
  choice: starb
  rationale: Gibt das ausdrückliche Verb für das Sterben direkt wieder und bewahrt damit die Wiederholung neben der vorausgehenden Todesformel.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: im einundvierzigsten Jahr
  rationale: Natürliche deutsche Wiedergabe der hebräischen Regierungsjahrformel mit ordinalem Sinn.
- source_word: לְמָלְכוֹ
  choice: seiner Herrschaft
  rationale: Im Zusammenhang einer Regierungsdatierung bezeichnet der Ausdruck die Zeit, in der Asa als König herrschte.
- source_word: אָסָא
  choice: Asa
  rationale: Entspricht der etablierten deutschen Namensform.
