id: 2CH.16.4
reference: 2 Chronicles 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: de
  text: Ben-Hadad hörte auf König Asa und sandte seine Heerführer gegen die Städte Israels. Sie schlugen Ijon, Dan, Abel-Majim[a] und alle Vorratsstädte Naftalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht hier Abel-Majim; manche setzen den Ort mit Abel-Bet-Maacha gleich, das aus den Parallelstellen bekannt ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte auf
  rationale: Die Wendung bezeichnet hier nicht nur das Hören, sondern Ben-Hadads zustimmende Reaktion auf Asas Bitte. „Hörte auf“ bewahrt beide Aspekte, ohne ein ausdrückliches Gehorsamsverhältnis zu behaupten.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: seine Heerführer
  rationale: שָׂרֵי bezeichnet militärische Befehlshaber, הַחֲיָלִים die Streitkräfte; אֲשֶׁר לוֹ drückt ihre Zugehörigkeit zu Ben-Hadad aus. „Seine Heerführer“ ist knapp und natürlich.
- source_word: עָרֵי יִשְׂרָאֵל
  choice: die Städte Israels
  rationale: Direkte geografisch-politische Bezeichnung der Städte des Nordreichs Israel.
- source_word: וַיַּכּוּ
  choice: sie schlugen
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Angreifen. „Sie schlugen“ erhält die knappe, kraftvolle Formulierung des Hebräischen, ohne den Ausgang als vollständige Eroberung festzulegen.
- source_word: עִיּוֹן
  choice: Ijon
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Transkription wiedergegeben.
- source_word: אָבֵל מָיִם
  choice: Abel-Majim
  rationale: Die Übersetzung folgt unmittelbar der Lesart des hebräischen Textes und gleicht den Namen nicht stillschweigend an Parallelstellen an.
- source_word: מִסְכְּנוֹת
  choice: Vorratsstädte
  rationale: Das Wort bezeichnet Städte beziehungsweise Anlagen zur Lagerung von Vorräten. „Vorratsstädte“ ist im Deutschen klar und passt zum militärisch-wirtschaftlichen Zusammenhang.
- source_word: עָרֵי נַפְתָּלִי
  choice: Naftalis
  rationale: Die hebräische Genitivverbindung ordnet die Vorratsstädte dem Stammesgebiet Naftali zu; der deutsche Genitiv gibt dies knapp wieder.
theological_decisions: []
