  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: de
  text: Im neununddreißigsten Jahr seiner Herrschaft erkrankte Asa an den Füßen. Seine Krankheit war sehr schwer. Doch selbst in seiner Krankheit suchte er nicht Jahwe, sondern die Ärzte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suchte er nicht Jahwe, sondern Hilfe bei den Ärzten“. Der hebräische Satz ist verkürzt und stellt das Suchen Jahwes dem Sichwenden an Ärzte gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: erkrankte
  rationale: Das Verb חלה bezeichnet das Krank- oder Schwachwerden. „Erkrankte“ ist im modernen Deutschen natürlich und gibt den Eintritt der Erkrankung präzise wieder.
- source_word: בְּרַגְלָיו
  choice: an den Füßen
  rationale: רֶגֶל kann „Fuß“ oder „Bein“ bedeuten. Der Plural und die Angabe des betroffenen Körperbereichs werden mit „an den Füßen“ knapp und natürlich wiedergegeben.
- source_word: עַד לְמַעְלָה
  choice: überaus schwer
  rationale: Die Wendung steigert hier den Schweregrad der Krankheit; eine räumliche Wiedergabe wie „nach oben“ wäre im Deutschen missverständlich.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: seine Krankheit / in seiner Krankheit
  rationale: Die Wiederholung von חֳלִי wird im Deutschen sichtbar bewahrt, ohne unnötig zwischen „Krankheit“ und „Leiden“ zu wechseln.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: suchte er nicht Jahwe
  rationale: דרשׁ bezeichnet in diesem Zusammenhang das Suchen oder Befragen Gottes. „Jahwe suchen“ bewahrt den umfassenderen geistlichen und bundestheologischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: כִּי בָּרֹפְאִים
  choice: sondern die Ärzte
  rationale: Die hebräische Formulierung ist elliptisch, wörtlich etwa „sondern/denn bei den Ärzten“. Die knappe deutsche Fassung erhält den scharfen Gegensatz, während die Fußnote die grammatische Offenheit sichtbar macht.
theological_decisions:
- issue: Ob der Vers medizinische Behandlung an sich verurteilt oder Asas unterlassene Suche nach Gott
  choice: Die Übersetzung stellt Asas Suche nach Ärzten seiner unterlassenen Suche nach Jahwe gegenüber, ohne ärztliche Hilfe grundsätzlich zu verurteilen.
  alternative: Der Vers verurteilt jede Inanspruchnahme von Ärzten.
  rationale: Der unmittelbare Vorwurf richtet sich darauf, dass Asa Jahwe nicht suchte. Aus der elliptischen Gegenüberstellung lässt sich kein allgemeines Verbot medizinischer Behandlung ableiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht den Verlauf klar; „überaus schwer“ wahrt die starke hebräische Intensivierung. Der Gottesname erscheint als „Jahwe“.
