  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: de
  text: 'Da holte Asa Silber und Gold aus den Schatzkammern des Hauses Jahwes und des Königshauses und schickte sie zu Ben-Hadad, dem König von Aram[a], der in Damaskus wohnte, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „König von Aram“; traditionell: „König von Syrien“.'
    reason: „Aram“ gibt den hebräischen Namen אֲרָם unmittelbar wieder; „Syrien“ ist die herkömmliche geografische Wiedergabe.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: holte … heraus
  rationale: Der Hifil von יצא bezeichnet hier das Herausbringen aus den Schatzkammern. Die im Satz getrennte Form „holte … aus“ ist im Deutschen natürlich und gibt die konkrete Handlung wieder.
- source_word: כֶּסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die beiden ausdrücklich genannten Edelmetalle werden wörtlich wiedergegeben und nicht zu „Geld“ oder „Schätzen“ verallgemeinert.
- source_word: מֵאֹצְרוֹת
  choice: aus den Schatzkammern
  rationale: Der hebräische Plural wird bewahrt; „Schatzkammern“ passt zum aufbewahrten Tempel- und Königsvermögen.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete Formulierung des Hebräischen und den Parallelismus mit dem Königshaus; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: und des Königshauses
  rationale: Die Wiedergabe hält die Wiederholung von בית fest, klingt jedoch natürlicher als „Haus des Königs“ und bezeichnet im Zusammenhang den königlichen Palast.
- source_word: וַיִּשְׁלַח
  choice: und schickte es
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus „Silber und Gold“ ergänzt. Das Singularpronomen fasst beides als das zuvor genannte Vermögen zusammen.
- source_word: מֶלֶךְ אֲרָם
  choice: König von Aram
  rationale: „Aram“ gibt den hebräischen Eigennamen wieder; das traditionelle „Syrien“ wird als verständliche Alternative in einer Fußnote genannt.
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: der in Damaskus wohnte
  rationale: Die partizipiale Wendung bezeichnet Ben-Hadad als den in Damaskus residierenden König; „wohnte“ ist klares, gegenwärtiges Standarddeutsch.
- source_word: לֵאמֹר
  choice: 'Er ließ ihm sagen:'
  rationale: Die formelhafte Einleitung der folgenden direkten Rede wird idiomatisch wiedergegeben. Sie wahrt den Übergang zum nächsten Vers, ohne den noch nicht zitierten Inhalt vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen; „der HERR“ wäre die traditionelle Ersatzlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng an der hebräischen Erzählstruktur, während „Er ließ ihm sagen“ die Redeeinleitung idiomatisch gestaltet. Der Fußnotenmarker [a] steht unmittelbar bei „Aram“, auf das die Anmerkung sachlich bezogen ist.
