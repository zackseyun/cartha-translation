source:
  edition: WLC
  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: de
  text: Zwischen mir und dir besteht ein Vertrag[a], ebenso zwischen meinem Vater und deinem Vater. Sieh, ich habe dir Silber und Gold geschickt. Geh und brich deinen Vertrag mit Bascha, dem König von Israel, damit er von mir abzieht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Bund“ oder „ein Bündnis“. Das hebräische Wort בְּרִית bezeichnet hier ein politisches Abkommen zwischen Königen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er möge von mir hinaufziehen“. Die Wendung meint hier wahrscheinlich, dass Bascha seinen militärischen Druck beendet und abzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ gibt den wiederholten hebräischen Begriff einheitlich wieder und ist im Deutschen auch für einen politischen Vertrag zwischen Königen verständlich; die kontextuell präzisere Alternative „Bündnis“ wird in der Fußnote genannt.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: Zwischen mir und dir … ebenso zwischen meinem Vater und deinem Vater
  rationale: Die parallele diplomatische Formel bleibt erhalten; „ebenso“ verbindet die beiden Glieder natürlich, ohne ihren Sinn zu verkürzen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird in würdigem, aber nicht altertümlichem Deutsch wiedergegeben.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: ich habe dir Silber und Gold geschickt
  rationale: Das Perfekt bezeichnet in diesem diplomatischen Zusammenhang eine vollzogene Handlung mit gegenwärtiger Bedeutung.
- source_word: לֵךְ הָפֵר
  choice: Geh und brich
  rationale: Die beiden Imperative werden direkt und kraftvoll wiedergegeben; „einen Bund brechen“ ist im Deutschen idiomatisch.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: deinen Bund mit Bascha
  rationale: Die Vertragsbeziehung zu Bascha wird im Deutschen natürlich mit „mit“ ausgedrückt.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: damit er von mir abzieht
  rationale: „Abziehen“ vermittelt im Kontext knapp den militärisch-politischen Sinn des bildhaften hebräischen Ausdrucks, ohne zusätzlichen Sachverhalt einzutragen.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Der Königstitel wird direkt bewahrt; der deutsche Kasus folgt der Apposition zu „Bascha“.
