source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: de
  text: 'Zu jener Zeit kam Hanani, der Seher, zu Asa, dem König von Juda, und sagte zu ihm: »Weil du dich auf den König von Aram[a] gestützt hast und dich nicht auf Jahwe, deinen Gott, gestützt hast, ist das Heer des Königs von Aram deiner Hand entkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Syrien«. Im Hebräischen steht »Aram«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Natürliche deutsche Zeitangabe; das einleitende ו wird idiomatisch aufgenommen, ohne ein schwerfälliges »Und« zu erzwingen.
- source_word: הָרֹאֶה
  choice: der Seher
  rationale: Bewahrt den besonderen prophetischen Titel רֹאֶה und unterscheidet ihn vom allgemeineren »Propheten«.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Weil du dich ... gestützt hast und dich nicht ... gestützt hast
  rationale: »Sich auf jemanden stützen« gibt sowohl das Bild als auch den Sinn politischen und theologischen Vertrauens wieder; die Wiederholung des hebräischen Verbs bleibt erhalten.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Gibt den hebräischen Eigennamen Aram quellennah wieder; »Syrien« ist eine geläufige, aber weniger formnahe Alternative.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben; die persönliche Bundesformel »dein Gott« bleibt erhalten.
- source_word: נִמְלַט
  choice: ist ... entkommen
  rationale: Das Perfekt bezeichnet hier eine eingetretene Folge von Asas Handeln; »entkommen« passt zum militärischen Zusammenhang.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: das Heer des Königs von Aram
  rationale: חֵיל bezeichnet in diesem Zusammenhang eine militärische Streitmacht; »Heer« ist präzise und würdevoll.
- source_word: מִיָּדֶךָ
  choice: deiner Hand
  rationale: Bewahrt das verständliche biblische Bild für Macht beziehungsweise Zugriff, ohne es erklärend aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird direkt und erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von politischem Vertrauen und Vertrauen auf Gott
  choice: Die parallele Wiederholung »dich ... gestützt hast« bleibt erhalten.
  alternative: Das erste Vorkommen politisch und das zweite geistlich unterschiedlich umschreiben.
  rationale: Die hebräische Wiederholung stellt Asas Bündnispolitik und sein fehlendes Vertrauen auf Jahwe bewusst gegeneinander; die Übersetzung sollte diese theologische Spannung nicht glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ursache-Folge-Zusammenhang; das wiederholte »sich stützen« bewahrt das Leitbild des Ausgangstextes.
