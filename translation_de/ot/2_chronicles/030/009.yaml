  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: de
  text: Denn wenn ihr zu Jahwe zurückkehrt, werden eure Brüder und eure Söhne bei denen, die sie gefangen weggeführt haben, Erbarmen finden[a] und in dieses Land zurückkehren. Denn Jahwe, euer Gott, ist gnädig und barmherzig, und er wird sein Angesicht nicht von euch abwenden[b], wenn ihr zu ihm zurückkehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei denen, die sie gefangen weggeführt haben, auf Erbarmen stoßen“.'
    reason: Die hebräische Konstruktion kann verschieden idiomatisch wiedergegeben werden; gemeint ist, dass ihre Wegführer ihnen Erbarmen erweisen.
  - marker: b
    text: 'Wörtlich: „sein Angesicht nicht von euch wegnehmen“.'
    reason: Die Fußnote macht das hebräische Bild hinter der natürlichen deutschen Wiedergabe sichtbar.
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: wenn ihr zu Jahwe zurückkehrt
  rationale: שׁוב bezeichnet hier die Umkehr und Rückkehr zu erneuerter Bundestreue. „Zurückkehren“ bewahrt sowohl die räumliche Bildlichkeit als auch den Beziehungsaspekt und nimmt die Wiederholung am Versende auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: eure Brüder und eure Söhne
  rationale: Die ausdrücklich männlichen Verwandtschaftsbezeichnungen des hebräischen Textes werden beibehalten und nicht zu einem geschlechtsneutralen Sammelbegriff verallgemeinert.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: bei denen, die sie gefangen weggeführt haben, Erbarmen finden
  rationale: Die Wendung bezeichnet, dass die Weggeführten vor beziehungsweise bei ihren Bezwingern zu Gegenständen des Erbarmens werden. Die deutsche Formulierung ist verständlich und erhält diesen relationalen Sinn.
- source_word: שׁוֹבֵיהֶם
  choice: die sie gefangen weggeführt haben
  rationale: Das Partizip von שבה bezeichnet diejenigen, die Menschen als Gefangene fortgeführt haben. Die Umschreibung ist im Deutschen genauer und natürlicher als das mehrdeutige „Fänger“.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: und in dieses Land zurückkehren
  rationale: Der Infinitiv kann Folge oder Zweck ausdrücken. Die koordinierte Wiedergabe lässt dieses Verhältnis offen und vermeidet es, eine nicht ausdrücklich genannte göttliche oder menschliche Veranlassung einzutragen.
- source_word: חַנּוּן וְרַחוּם
  choice: gnädig und barmherzig
  rationale: Das traditionelle und zugleich allgemein verständliche deutsche Wortpaar bildet die beiden göttlichen Eigenschaften prägnant ab.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: er wird sein Angesicht nicht von euch abwenden
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom Angesicht und damit die Aussage über Gottes persönliche Zuwendung.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: wenn ihr zu ihm zurückkehrt
  rationale: „Zurückkehrt“ nimmt dieselbe hebräische Wurzel wie am Versanfang auf. Das konditionale אִם wird mit „wenn“ natürlich und sachgerecht wiedergegeben.
theological_decisions:
- issue: Umkehrsprache in שׁוּב
  choice: zu Jahwe / zu ihm zurückkehrt
  alternative: euch Jahwe / ihm wieder zuwendet
  rationale: „Zurückkehren“ erhält das Motiv der Wiederherstellung und die Wiederholung derselben hebräischen Wurzel, ohne eine spätere dogmatische Terminologie in den Text einzutragen.
- issue: Männliche Verwandtschaftsbegriffe
  choice: eure Brüder und eure Söhne
  alternative: eure Brüder und eure Kinder
  rationale: Der Ausgangstext verwendet ausdrücklich die männlichen Formen „Brüder“ und „Söhne“. Die Übersetzung wahrt diese Form, ohne über den möglichen Umfang der gemeinten Personengruppe zu entscheiden.
- issue: Gottes Zuwendung im Bild des Angesichts
  choice: sein Angesicht nicht von euch abwenden
  alternative: sich nicht von euch abwenden
  rationale: Das konkrete Bild bleibt erhalten, weil es die persönliche und bundesbezogene Dimension der göttlichen Zuwendung trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Bewegung der Rückkehr wird sprachlich sichtbar gehalten. „Angesicht“ ist bewusst leicht gehoben, weil es das zentrale hebräische Beziehungsbild erhält; der übrige Satzbau bleibt allgemein verständlich.
