source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶל יְחִזְקִיָּ֔הוּ וַ/יִּרְפָּ֖א אֶת הָ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: de
  text: Und Jahwe erhörte Hiskia und heilte das Volk.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hörte auf Hiskia“. Das hebräische Verb kann in dieser Verbindung sowohl „hören“ als auch „auf jemanden hören“ beziehungsweise „jemanden erhören“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Heilte“ kann hier die Beseitigung einer Bedrängnis oder eines Gerichts meinen, das mit dem nicht ordnungsgemäßen rituellen Zustand des Volkes zusammenhing; es muss nicht ausschließlich um körperliche Krankheit gehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: erhörte
  rationale: שׁמע mit אֶל bezeichnet hier im Zusammenhang mit Hiskias Fürbitte (Verse 18–19) nicht nur akustisches Hören, sondern ein wohlwollendes Hören und Reagieren. „Erhörte“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen verwendete Eigenname erhalten bleibt.
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: Verwendet wird die im Deutschen übliche Form des Personennamens.
- source_word: וַיִּרְפָּא
  choice: heilte
  rationale: רפא bedeutet gewöhnlich „heilen“. Diese Wiedergabe bewahrt das hebräische Bild und legt nicht fest, ob ausschließlich körperliche Krankheit oder umfassender die Beseitigung einer Bedrängnis beziehungsweise eines Gerichts gemeint ist.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet hier die versammelte Gemeinschaft Israels; „das Volk“ ist die natürliche und sachlich angemessene deutsche Wiedergabe.
theological_decisions:
- issue: Art der göttlichen Reaktion in „heilte das Volk“
  choice: Die Heilungssprache des Ausgangstextes wird beibehalten, ohne sie auf körperliche Heilung einzugrenzen.
  alternative: „vergab dem Volk“, „verschonte das Volk“ oder „stellte das Volk wieder her“
  rationale: Der Kontext betrifft Menschen, die das Passa ohne vollständige rituelle Reinigung aßen, sowie Hiskias Bitte um Vergebung. Der Vers selbst verwendet jedoch רפא („heilen“). „Heilte“ wahrt diese Spannung und vermeidet eine interpretierende Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erhörte“ bildet den Gebetskontext idiomatisch ab; „heilte“ bewahrt bewusst die offene Bildsprache des Hebräischen. Die Satzstruktur bleibt knapp und nahe am Ausgangstext.
