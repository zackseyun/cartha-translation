base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: de
  text: Dann standen die Priester, die Leviten,[a] auf und segneten das Volk. Ihre Stimme wurde gehört,[b] und ihr Gebet gelangte zu seiner heiligen Wohnstätte, zum Himmel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die levitischen Priester“. Die hebräische Wortfolge kann als Apposition verstanden werden, die die Priester als Leviten näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: Die passive Form lässt unausgesprochen, dass Gott sie hörte.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „zu seiner heiligen Wohnstätte, zu den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: standen ... auf
  rationale: Das Qal wayyiqtol von קום bezeichnet hier das Aufstehen; die deutsche Verbklammer ergibt eine natürliche, konkrete Wiedergabe.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die Priester, die Leviten
  rationale: Die appositionelle Wiedergabe wahrt die wahrscheinlich identifizierende Beziehung beider Substantive, ohne zwei getrennte Gruppen anzunehmen.
- source_word: וַיְבָרֲכוּ אֶת הָעָם
  choice: segneten das Volk
  rationale: ברך bezeichnet hier das Aussprechen des Segens über das versammelte Volk; die knappe Formulierung ist im Deutschen klar und würdig.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: Ihre Stimme wurde erhört
  rationale: Die passive Form wird bewahrt. „Erhört“ gibt zugleich den kontextuellen Sinn göttlicher Annahme wieder, ohne Gott ausdrücklich als grammatisches Subjekt einzusetzen.
- source_word: תְפִלָּתָם
  choice: ihr Gebet
  rationale: Das singularische Substantiv mit Pluralsuffix wird entsprechend dem Hebräischen kollektiv im Singular wiedergegeben.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: zu seiner heiligen Wohnstätte
  rationale: מָעוֹן bezeichnet eine Wohn- oder Aufenthaltsstätte; „Wohnstätte“ erhält das räumliche und sakrale Bild.
- source_word: לַשָּׁמָיִם
  choice: zum Himmel
  rationale: Die Richtungspräposition wird sichtbar wiedergegeben; die nachgestellte Apposition erläutert die heilige Wohnstätte, ohne sie mit der vorherigen Wendung zu verschmelzen.
theological_decisions:
- issue: Ob Gott als ausdrückliches Subjekt des Hörens genannt werden soll
  choice: 'Passive Form: „Ihre Stimme wurde erhört“'
  alternative: „Gott hörte ihre Stimme“
  rationale: Der hebräische Text nennt Gott in diesem Satzteil nicht ausdrücklich als Subjekt. Die passive Wiedergabe erhält diese Zurückhaltung, während „erhört“ die im Zusammenhang naheliegende göttliche Annahme ausdrückt.
- issue: Verhältnis von „Priester“ und „Leviten“
  choice: 'Apposition: „die Priester, die Leviten“'
  alternative: „die levitischen Priester“ oder „die Priester und die Leviten“
  rationale: Die appositionelle Lesart identifiziert die genannten Priester als Leviten und vermeidet, gegen den wahrscheinlichen Sinn zwei Gruppen einzuführen.
- issue: Verhältnis von heiliger Wohnstätte und Himmel
  choice: „zu seiner heiligen Wohnstätte, zum Himmel“
  alternative: „zu seiner heiligen Wohnstätte im Himmel“
  rationale: Die parallelen hebräischen Zielangaben bleiben erhalten. So wird der Himmel als erläuternde Apposition verstanden, ohne die syntaktische Spannung durch eine Lokalangabe aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge des Hebräischen zu verändern. Appositionen und Passivform bewahren die echte syntaktische und theologische Offenheit des Ausgangstextes.
