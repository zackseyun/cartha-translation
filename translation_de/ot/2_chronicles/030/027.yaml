revisions:
- from: Dann standen die Priester, die Leviten,[a] auf und segneten das Volk. Ihre Stimme wurde erhört,[b] und ihr Gebet gelangte zu seiner heiligen Wohnstätte, zum Himmel.[c]
  to: Dann standen die Priester, die Leviten,[a] auf und segneten das Volk. Ihre Stimme wurde gehört,[b] und ihr Gebet gelangte zu seiner heiligen Wohnstätte, zum Himmel.[c]
  rationale: Die einzige sichere Korrektur ersetzt das interpretativ stärkere „erhört“ durch „wurde gehört“ und passt die dazugehörige Fußnote an. Dadurch werden hebräische Passivform und die fehlende explizite Nennung Gottes gewahrt, ohne den naheliegenden Kontext zu bestreiten.
