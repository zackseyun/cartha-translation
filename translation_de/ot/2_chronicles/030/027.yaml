    issue: „erhört“ statt „gehört“
    rationale: Das hebräische וַיִּשָּׁמַע בְּקוֹלָם verwendet eine passive Form von „hören“. Das deutsche „erhören“ kann eine positive Erhörung/Antwort implizieren und verstärkt damit den Aussagegehalt. „wurde gehört“ erhält die Formulierung und ihre Zurückhaltung.
