base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: de
  text: Sie erhoben sich und entfernten die Altäre, die in Jerusalem standen. Auch alle Räucheraltäre[a] entfernten sie und warfen sie in das Kidrontal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Räucherständer“ beziehungsweise „alle Stätten zum Verbrennen von Räucherwerk“. Das hebräische Wort bezeichnet kultische Einrichtungen, die dem Räuchern dienten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „in das Kidrontal“. Das Wort kann ein Wadi oder Bachtal bezeichnen, also ein Tal mit einem zeitweise wasserführenden Bach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da machten sie sich daran
  rationale: Das Verb קום leitet hier erzählerisch eine entschlossene Handlung ein. Die deutsche Wendung gibt diese Funktion natürlich wieder, ohne ein möglicherweise missverständliches körperliches Aufstehen hervorzuheben.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: beseitigten
  rationale: Die Hifil-Form von סור bedeutet wegnehmen oder entfernen. „Beseitigten“ passt zur gezielten Entfernung unerlaubter Kultanlagen und kann an beiden Stellen einheitlich verwendet werden.
- source_word: הַמִּזְבְּחוֹת
  choice: die Altäre
  rationale: מִזְבְּחוֹת ist die gewöhnliche Pluralform von „Altar“. Der Zusammenhang zeigt, dass es sich um unerwünschte Kultanlagen handelt, ohne dass dies im Text ergänzt werden muss.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: die in Jerusalem standen
  rationale: Der Relativsatz und die Ortsangabe werden ausdrücklich bewahrt. „Standen“ ist im Deutschen bei Altären idiomatischer als ein bloßes „waren“.
- source_word: הַמְקַטְּרוֹת
  choice: Räucheraltäre
  rationale: Das vom Stamm קטר („Räucherwerk verbrennen“) abgeleitete Wort bezeichnet kultische Einrichtungen zum Räuchern. „Räucheraltäre“ ist im Kontext klar und knapp; die sachliche Bandbreite wird in einer Fußnote offengehalten.
- source_word: וַיַּשְׁלִיכוּ
  choice: warfen
  rationale: שׁלך bezeichnet ein Werfen oder Schleudern. „Warfen“ ist gegenwärtiges, natürliches Deutsch und erhält die nachdrückliche Art der Entsorgung.
- source_word: לְנַחַל קִדְרוֹן
  choice: in das Kidrontal
  rationale: נחל kann ein Bachtal, Wadi oder einen zeitweise wasserführenden Bach bezeichnen. „Kidrontal“ ist allgemein verständlich und geografisch passend; die Bedeutungsbreite wird in der Fußnote vermerkt.
