  text: וַ/יַּֽעַמְד֤וּ עַל עָמְדָ/ם֙ כְּ/מִשְׁפָּטָ֔/ם כְּ/תוֹרַ֖ת מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֑ים הַ/כֹּֽהֲנִים֙ זֹרְקִ֣ים אֶת הַ/דָּ֔ם מִ/יַּ֖ד הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: de
  text: Sie traten an ihren Platz, wie es für sie vorgeschrieben war, nach der Weisung Moses, des Mannes Gottes. Die Priester sprengten das Blut, das sie aus der Hand der Leviten empfingen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  choice: Sie traten an ihren Platz
  rationale: Die Verbindung bezeichnet, dass die Beteiligten ihre zugewiesene Stellung im geregelten Tempeldienst einnahmen. „An ihren Platz treten“ ist natürlich und bewahrt den positionalen Sinn.
- source_word: כְּמִשְׁפָּטָם
  choice: wie es für sie vorgeschrieben war
  rationale: מִשְׁפָּט bezeichnet hier nicht bloß einen Brauch, sondern die für den Kultdienst geltende Ordnung oder Vorschrift. Die verbale Wiedergabe ist im modernen Deutsch klar und würdig.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: nach der Weisung Moses
  rationale: תּוֹרָה meint hier die durch Mose vermittelte maßgebliche Unterweisung für das Ritual. „Weisung“ wahrt die Bedeutungsbreite besser als eine ausschließlich gesetzliche Verengung.
- source_word: אִישׁ הָאֱלֹהִים
  choice: des Mannes Gottes
  rationale: Der feste biblische Ehrentitel wird formal und erkennbar wiedergegeben.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת הַדָּם
  choice: Die Priester sprengten das Blut
  rationale: זרק bezeichnet bei Opferblut dessen rituelle Anwendung am Altar. „Sprengen“ ist die etablierte, sachgerechte deutsche Kultterminologie.
- source_word: מִיַּד הַלְוִיִּם
  choice: das sie aus der Hand der Leviten empfingen
  rationale: Wörtlich steht „aus der Hand der Leviten“. Das ergänzte „empfingen“ macht die im Hebräischen knappe Übergabe des Blutes im Deutschen verständlich, ohne die Rollen zu verändern.
theological_decisions:
- issue: Bezeichnung der mosaischen תּוֹרָה
  choice: Weisung Moses
  alternative: Gesetz Moses
  rationale: „Weisung“ erhält sowohl den normativen als auch den unterweisenden Charakter von תּוֹרָה und vermeidet eine unnötige Verengung, während der verbindliche kultische Kontext durch „vorgeschrieben“ deutlich bleibt.
- issue: Rituelle Anwendung des Blutes
  choice: sprengten das Blut
  alternative: warfen das Blut
  rationale: Im Opferkontext ist die kultische Anwendung gemeint; „warfen“ wäre im modernen Deutsch missverständlich und klänge beiläufig.
- issue: Ellipse bei מִיַּד הַלְוִיִּם
  choice: das sie aus der Hand der Leviten empfingen
  alternative: aus der Hand der Leviten
  rationale: Das Empfangen ist syntaktisch nicht ausdrücklich genannt, ergibt sich aber aus der Übergabekonstruktion. Die Ergänzung dient allein natürlicher deutscher Verständlichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Ordnung wird klar benannt, ohne konfessionelle Zusatzdeutung. Der Satzbau bleibt nahe am hebräischen Ablauf, vermeidet jedoch unnatürliche Nominalformulierungen.
