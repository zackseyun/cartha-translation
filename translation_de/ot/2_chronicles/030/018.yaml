  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: de
  text: 'Denn ein großer Teil des Volkes, viele aus Ephraim und Manasse, Issachar und Sebulon, hatte sich nicht gereinigt; dennoch aßen sie das Passa nicht so, wie es vorgeschrieben war.[a] Doch Hiskia betete für sie und sagte: »Yahweh, der gut ist, möge Sühne erwirken für –«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nicht gemäß dem Geschriebenen«.'
    reason: lexical_alternative
  - marker: b
    text: Das Gebet wird in Vers 19 fortgesetzt; der hebräische Satz bleibt am Ende dieses Verses unvollständig.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: viele aus dem Volk, zahlreiche Menschen
  rationale: Die doppelte Mengenangabe wird in natürlichem Deutsch wiedergegeben, ohne sie als absolute Mehrheit festzulegen; zugleich bleibt die hebräische Verstärkung hörbar.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: aus Ephraim und Manasse, Issachar und Sebulon
  rationale: Die Stammesnamen und ihre Reihenfolge werden bewahrt; die deutschen Namensformen sind geläufig.
- source_word: לֹא הִטֶּהָרוּ
  choice: hatten sich nicht gereinigt
  rationale: Der reflexive Stamm bezeichnet hier die unterbliebene kultische Reinigung; das Plusquamperfekt verdeutlicht, dass sie vor dem Passa hätte erfolgen müssen.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: aßen das Passa
  rationale: Die Formulierung hält sich eng an den hebräischen Gegenstand und vermeidet die nicht ausdrücklich genannte Ergänzung „Passalamm“.
- source_word: בְּלֹא כַכָּתוּב
  choice: nicht so, wie es vorgeschrieben war
  rationale: Die Wendung bezeichnet ein Handeln, das nicht der schriftlichen Vorschrift entsprach. Die konkrete Bildlichkeit des „Geschriebenen“ wird in einer Fußnote festgehalten.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: betete für sie
  rationale: Verb und Präposition bezeichnen ein Gebet zugunsten der Betroffenen, ohne dass das stärker deutende „trat für sie ein“ nötig ist.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַטּוֹב
  choice: der Gute
  rationale: Das substantivisch beziehungsweise appositionell gebrauchte Adjektiv bleibt als Bezeichnung Yahwehs erhalten; die Formulierung ist knapp und würdevoll.
- source_word: יְכַפֵּר
  choice: möge Sühne erwirken
  rationale: Die kultische Bedeutung des Piel von כפר wird im Zusammenhang von Passa und Reinheit bewahrt; „vergeben“ wäre stärker auslegend.
- source_word: בְּעַד
  choice: für –
  rationale: Die Präposition leitet das erst in Vers 19 folgende Objekt ein. Der Gedankenstrich bewahrt den im vorliegenden Vers bewusst offenen Satz, statt das fehlende Satzglied vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. Seine Transliteration wahrt diese Unterscheidung, ohne einen ersetzenden Hoheitstitel einzuführen.
- issue: Kultische Bedeutung von כפר
  choice: Sühne erwirken
  alternative: vergeben
  rationale: Der Passa- und Reinigungskontext spricht dafür, den kultischen Bedeutungsgehalt zu bewahren, ohne die genaue Wirkungsweise weiter dogmatisch festzulegen.
- issue: Unvollständiger Gebetssatz am Versende
  choice: für –
  alternative: für sie
  rationale: Das Bezugswort der Präposition folgt syntaktisch erst in Vers 19. Eine Ergänzung wie „für sie“ würde die offene hebräische Konstruktion glätten und den Anschluss an den Folgevers verändern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Stammesnamen folgen geläufigen deutschen Bibelformen. Die Wiederholung der Mengenangabe und der syntaktisch offene Versschluss werden bewusst erhalten.
