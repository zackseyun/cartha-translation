  terminology: „Passa“, „sich reinigen“, „Yahweh“ und „Sühne erwirken“ sind hier sachgerecht. Die Fußnote zur Wendung בְּלֹא כַכָּתוּב muss an der betreffenden Aussage stehen, nicht bei „Volk“.
