source:
  edition: WLC
  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: de
  text: Doch einige Männer aus Ascher, Manasse und Sebulon demütigten sich und kamen nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt die Reaktion dieser Männer in einen deutlichen Gegensatz zum Spott und zur Ablehnung im vorausgehenden Vers; „doch“ gibt diesen adversativen Sinn natürlich und knapp wieder.
- source_word: אֲנָשִׁים
  choice: einige Männer
  rationale: Das maskuline Pluralnomen bezeichnet hier im Kontext eine unbestimmte Teilgruppe aus den genannten Stämmen; „einige Männer“ wahrt sowohl die Teilmengenbedeutung als auch die grammatische Geschlechtsangabe.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: aus Ascher, Manasse und Sebulon
  rationale: Die Präpositionen bezeichnen die Herkunft aus den drei Stammesgebieten; die Namen folgen ihren geläufigen deutschen biblischen Formen.
- source_word: נִכְנְעוּ
  choice: demütigten sich
  rationale: Der Niphal von כנע kann das Sich-Demütigen oder Sich-Unterwerfen ausdrücken. Hier legt die freiwillige positive Reaktion auf den Aufruf, gefolgt vom Kommen nach Jerusalem, die reflexive Wiedergabe nahe.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: בוא bezeichnet in der Erzählfolge die Bewegung zum genannten Ziel; „kamen“ ist direkt und entspricht der Perspektive der Darstellung.
- source_word: לִירוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Bei Städtenamen wird die Zielrichtung im modernen Standarddeutsch idiomatisch mit „nach“ ausgedrückt.
theological_decisions:
- issue: Freiwillige Demütigung oder passives Gedemütigtwerden
  choice: demütigten sich
  alternative: wurden gedemütigt / unterwarfen sich
  rationale: Die Niphalform lässt grundsätzlich eine passive oder reflexive Nuance zu. Der Zusammenhang schildert jedoch ihre eigene, zustimmende Antwort auf die Einladung, sodass die reflexive Wiedergabe am besten passt, ohne eine weitergehende theologische Ursache festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper narrativer Satzstruktur. „Doch“ stellt den notwendigen Kontrast her; „demütigten sich“ bewahrt die religiös-ethische Aussage des hebräischen Verbs.
