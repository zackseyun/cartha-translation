base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: de
  text: Und die ganze Versammlung Judas freute sich, ebenso die Priester und Leviten, alle Versammelten, die aus Israel gekommen waren, die ansässigen Fremden[a], die aus dem Land Israel gekommen waren, und die Bewohner Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fremde mit Wohnsitz“. Das hebräische Wort bezeichnet Fremde, die in der Gemeinschaft ansässig waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Da freute sich
  rationale: שׂמח bezeichnet Freude oder Frohsein. Die singularische Form im Deutschen richtet sich natürlich nach dem Kollektivsubjekt „die ganze Versammlung“; „da“ gibt den erzählenden Anschluss wieder.
- source_word: כָּל קְהַל יְהוּדָה
  choice: die ganze Versammlung Judas
  rationale: קהל bezeichnet die versammelte Gemeinschaft. „Versammlung“ vermeidet eine unnötig kirchliche Färbung von „Gemeinde“ und gibt den konkreten Zusammenschluss der Menschen wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgerechte Wiedergabe von כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche Bezeichnung für die von den Priestern unterschiedene levitische Gruppe.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: die ganze Versammlung derer, die aus Israel gekommen waren
  rationale: Die Relativkonstruktion gibt das substantivierte Partizip natürlich wieder. Das Plusquamperfekt macht deutlich, dass ihre Ankunft dem beschriebenen Freudenfest vorausging.
- source_word: הַגֵּרִים
  choice: die ansässigen Fremden
  rationale: גֵּרִים bezeichnet Fremde, die längerfristig unter der Bevölkerung lebten. „Ansässige Fremde“ ist im modernen Deutsch verständlich und bewahrt sowohl Fremdherkunft als auch Wohnstatus.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: die aus dem Land Israel gekommen waren
  rationale: Die Wendung bezeichnet die geografische Herkunft aus dem Land Israel; das Plusquamperfekt entspricht dem vorausliegenden Kommen.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: alle, die in Juda wohnten
  rationale: Das Partizip von ישׁב bezeichnet dauerhaftes Wohnen. Die eigenständige koordinierte Gruppe bleibt erhalten, ohne sie stillschweigend nur auf die zuvor genannten Fremden zu beziehen.
theological_decisions:
- issue: Bezug von הַיּוֹשְׁבִים בִּיהוּדָה
  choice: als weitere koordinierte Personengruppe wiedergegeben
  alternative: 'als nähere Bestimmung der ansässigen Fremden: „die … in Juda wohnten“'
  rationale: Die wiederholte Artikelkonstruktion und das verbindende וְ erlauben am natürlichsten eine weitere Gruppe; die Formulierung lässt jedoch offen, welcher Herkunft diese Bewohner Judas waren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt ordnet die nachfolgenden Gruppen als nähere Entfaltung der gesamten Versammlung ein. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Anmerkung erläutert.
