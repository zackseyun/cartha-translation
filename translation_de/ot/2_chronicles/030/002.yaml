base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: de
  text: Darauf berieten sich der König, seine Obersten und die ganze Versammlung in Jerusalem und beschlossen, das Passa im zweiten Monat zu feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Passa zu tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Da beschlossen
  rationale: Das Nifal von יעץ bezeichnet hier eine gemeinsame Beratung, die zu einem Beschluss führt. „beschlossen“ gibt das Ergebnis in natürlichem Deutsch wieder; die mehreren Subjekte zeigen, dass es ein gemeinsamer Beschluss war.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs. Der Kontext identifiziert den König als Hiskia, doch der hebräische Vers verwendet hier den Titel.
- source_word: וְשָׂרָיו
  choice: seine führenden Männer
  rationale: שָׂרִים bezeichnet hochgestellte Amtsträger oder Führungspersonen. „führende Männer“ ist verständlich und vermeidet die irreführende Vorstellung, es handle sich bei „Fürsten“ um Königssöhne.
- source_word: וְכָל הַקָּהָל
  choice: und die ganze Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft. „Versammlung“ bewahrt den kollektiven Sinn, ohne einen späteren kirchlichen Fachbegriff einzutragen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche lokale Wiedergabe des Ortsnamens.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: das Passafest zu feiern
  rationale: Wörtlich steht „das Passa tun“; gemeint ist, die vorgeschriebene Passafeier abzuhalten. „das Passafest feiern“ ist im heutigen Deutsch natürlich und gibt den kultisch-festlichen Sinn wieder.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: im zweiten Monat
  rationale: Direkte temporale Wiedergabe. Dass das Passa gewöhnlich im ersten Monat stattfand, ist für den Kontext bedeutsam, wird aber hier nicht erklärend ergänzt.
theological_decisions:
- issue: Wiedergabe der hebräischen Wendung für die Passafeier ohne interpretierende Erweiterung
  choice: das Passafest zu feiern
  alternative: das Passa zu halten; das Passa zu begehen; das Passa zu tun
  rationale: Die Wendung bezeichnet die Durchführung der Passafeier. „das Passafest feiern“ ist natürliches modernes Deutsch und bewahrt den festlichen sowie kultischen Sinn, ohne zusätzliche Einzelheiten in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber idiomatisch formuliert. „Da“ führt die Erzählung natürlich fort; „führende Männer“ vermeidet das heute leicht missverständliche „Fürsten“.
