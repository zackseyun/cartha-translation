- from: Und Hiskia sprach allen Leviten Mut zu,[a] die im Dienst für Jahwe gute Einsicht bewiesen. Und sie aßen sieben Tage lang das Festmahl,[b] brachten Heilsopfer dar[c] und dankten Jahwe,[d] dem Gott ihrer Vorfahren.
  to: Und Hiskia sprach allen Leviten Mut zu,[a] die im Dienst für Jahwe gute Einsicht bewiesen. Und sieben Tage lang begingen sie das Fest,[b] brachten Heilsopfer dar[c] und dankten Jahwe,[d] dem Gott ihrer Vorfahren.
  rationale: Die einzige notwendige Änderung ersetzt „Festmahl“ durch „Fest“ und formuliert die siebentägige Teilnahme idiomatisch als Festbegehung. Dadurch wird die Bedeutung von מוֹעֵד gewahrt, ohne die im Hebräischen auffällige Verbindung mit „essen“ in eine im Deutschen irreführende Aussage über ein einzelnes Mahl zu übertragen. Die Fußnote hält die wörtlichere Formulierung und ihre Auslegungsbreite fest. Die übrigen Formulierungen und Fußnoten bleiben inhaltlich erhalten; Fußnote d wird sprachlich präzisiert.
