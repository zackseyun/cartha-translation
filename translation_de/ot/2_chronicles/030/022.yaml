  naturalness: „Sprach ... Mut zu“, „gute Einsicht bewiesen“, „Heilsopfer darbringen“ und „dankten Jahwe“ sind modernes, verständliches Standarddeutsch in angemessen würdigem Register. „Sie begingen das Fest sieben Tage lang“ ist gegenüber „sie aßen ... das Festmahl“ idiomatischer und dem Kontext entsprechend.
  terminology: „Hiskia“, „Leviten“, „Jahwe“, „Heilsopfer“ und „Gott ihrer Vorfahren“ sind sachgerecht. Die Alternativen in den Fußnoten bewahren die lexikalische Spannweite, besonders bei מִתְוַדִּים.
