  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: de
  text: Und Hiskia sprach allen Leviten Mut zu,[a] die im Dienst für Jahwe gute Einsicht bewiesen. Und sieben Tage lang begingen sie das Fest,[b] brachten Heilsopfer dar[c] und dankten Jahwe,[d] dem Gott ihrer Vorfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sprach zum Herzen aller Leviten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „sie aßen das Fest“; gemeint ist die Teilnahme am festgesetzten Fest während dieser Tage.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Friedensopfer“, „Gemeinschaftsopfer“ oder „Wohlergehensopfer“.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Verb kann auch „ein Bekenntnis ablegen“ oder „preisen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: sprach … Mut zu
  rationale: Die hebräische Wendung bedeutet wörtlich „zum Herzen sprechen“ und bezeichnet hier ein ermutigendes, stärkendes Reden. Die deutsche idiomatische Wiedergabe bewahrt diesen Sinn.
- source_word: הַלְוִיִּם
  choice: Leviten
  rationale: Übliche und genaue Bezeichnung der levitischen Kultdiener.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: die im Dienst für Jahwe gute Einsicht bewiesen
  rationale: Die Wortverbindung aus dem Partizip von שׂכל und dem stammverwandten Substantiv betont bewiesene Einsicht oder Sachkunde. „Im Dienst für Jahwe“ gibt den kultischen Bezug des ל wieder, ohne ihn als einzig mögliche Deutung auszugeben.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: sie aßen … das Festmahl
  rationale: Der hebräische Ausdruck verbindet „essen“ mit dem direkten Objekt „Fest/Festzeit“. „Festmahl“ ergibt im Deutschen eine natürliche konkrete Aussage, ohne ein im Text nicht vorhandenes „feiern“ einzusetzen.
- source_word: שִׁבְעַת הַיָּמִים
  choice: sieben Tage lang
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: brachten Heilsopfer dar
  rationale: „Heilsopfer“ ist eine etablierte deutsche Bezeichnung für זִבְחֵי שְׁלָמִים und lässt die Aspekte von Frieden, Wohlergehen und Gemeinschaft anklingen.
- source_word: וּמִתְוַדִּים
  choice: dankten
  rationale: Das Hitpael von ידה kann je nach Zusammenhang „bekennen“, „preisen“ oder „danken“ bedeuten. Im festlichen Opfer- und Gottesdienstkontext ist „danken“ wahrscheinlich, während die Fußnote die Mehrdeutigkeit wahrt.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: dem Gott ihrer Vorfahren
  rationale: „Vorfahren“ gibt die genealogische und bundestheologische Bedeutung natürlich und geschlechtsübergreifend wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, um den im hebräischen Text stehenden Bundesnamen sichtbar zu bewahren.
- issue: Bedeutung von וּמִתְוַדִּים
  choice: dankten
  alternative: bekannten / priesen
  rationale: Der Fest- und Opferkontext spricht für liturgischen Dank; da das Verb auch Bekennen oder Preisen bezeichnen kann, wird diese Spannung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „Mut zusprechen“ ist allgemein verständlich; kultische Fachbegriffe werden knapp durch Fußnoten erläutert. Die Satzstruktur folgt dem hebräischen Ablauf, ohne unnatürlich zu wirken.
