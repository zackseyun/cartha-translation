source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: de
  text: Am vierzehnten Tag des zweiten Monats schlachteten sie das Passahlamm[a]. Da schämten sich die Priester und die Leviten, weihten sich und brachten Brandopfer zum Haus Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Passah“; hier ist das Passahopfer, also das Passahlamm, gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: schlachteten sie
  rationale: שׁחט bezeichnet besonders im Opferkontext das Schlachten eines Tieres. „Schlachten“ bewahrt den konkreten und rituellen Sinn, ohne das Verb allgemein als „töten“ wiederzugeben.
- source_word: הַפֶּסַח
  choice: das Passahlamm
  rationale: Wörtlich steht „das Passah“; hier bezeichnet der Ausdruck jedoch das geschlachtete Passahopfer, konkret das Passahlamm. Die Fußnote bewahrt die wörtliche Ausdrucksweise.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: am vierzehnten Tag des zweiten Monats
  rationale: Die Ergänzung „Tag“ entspricht natürlichem deutschem Kalenderausdruck und ist im Hebräischen sinngemäß vorausgesetzt.
- source_word: נִכְלְמוּ
  choice: schämten sich
  rationale: Der Niphal von כלם drückt Beschämung oder Schande aus. Im Zusammenhang bezeichnet er die beschämte Reaktion der Priester und Leviten.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: weihten sich
  rationale: Die reflexive Form von קדשׁ bezeichnet hier die rituelle Selbstheiligung beziehungsweise Vorbereitung für den Tempeldienst. „Weihten sich“ ist verständlich und kultisch passend.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: brachten Brandopfer
  rationale: עֹלוֹת sind vollständig verbrannte Opfer. „Brandopfer“ ist die etablierte und präzise deutsche Wiedergabe.
- source_word: בֵּית יְהוָה
  choice: zum Haus Jahwes
  rationale: Die Übersetzung bewahrt das hebräische Bild „Haus“ und gibt den Gottesnamen יהוה als „Jahwe“ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn im modernen Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיִּתְקַדְּשׁוּ
  choice: weihten sich
  alternative: heiligten sich
  rationale: Gemeint ist im Kontext die rituelle Vorbereitung für den Dienst, nicht eine umfassende Aussage über moralische Heiligkeit. „Weihten sich“ erhält den kultischen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; „Da“ macht die anschließende Reaktion idiomatisch kenntlich. Der Fußnotenmarker steht unmittelbar bei „Passahlamm“, auf das sich die lexikalische Erläuterung bezieht.
