base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: de
  text: Denn Hiskia, der König von Juda, gab der Versammlung tausend Stiere und siebentausend Stück Kleinvieh[a], und die führenden Männer gaben der Versammlung tausend Stiere und zehntausend Stück Kleinvieh; und Priester heiligten sich in großer Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Kleinvieh als Sammelbegriff und kann sowohl Schafe als auch Ziegen einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und verbindet den Vers natürlich mit seinem Kontext.
- source_word: הֵרִים / הֵרִימוּ
  choice: hatte(n) ... gestiftet
  rationale: Der Hifil von רום bezeichnet hier idiomatisch das Bereitstellen einer Gabe für die gemeinsame Feier; „stiften“ gibt dies wieder, ohne ein buchstäbliches Hochheben oder den eigentlichen Opfervorgang auszudrücken.
- source_word: לַקָּהָל
  choice: der Versammlung
  rationale: קהל ist die versammelte Gemeinschaft; der Dativ gibt לְ hier natürlich als Empfänger- beziehungsweise Nutznießerangabe wieder.
- source_word: פָּרִים
  choice: Rinder
  rationale: פָּרִים bezeichnet männliche Rinder beziehungsweise Opferrinder. „Rinder“ ist im Deutschen hier natürlich und vermeidet eine unnötig enge Altersbestimmung.
- source_word: צֹאן
  choice: Stück Kleinvieh
  rationale: צֹאן ist ein Sammelbegriff für kleinere Herdentiere, besonders Schafe und Ziegen. „Stück Kleinvieh“ bewahrt diese Breite genauer als „Schafe“.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet hochrangige politische oder gesellschaftliche Verantwortungsträger. Die Formulierung ist verständlich und legt weder Erbadel noch ein bestimmtes Amt fest.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: Und ... Priester heiligten sich für ihren Dienst
  rationale: Die reflexive Form von קדשׁ bezeichnet die kultische Selbstheiligung beziehungsweise Vorbereitung der Priester. Der Zusatz „für ihren Dienst“ macht den im Kontext gemeinten Zweck verständlich, ohne den Vorgang auf bloße Reinigung zu reduzieren.
- source_word: לָרֹב
  choice: sehr viele
  rationale: Die Wendung hebt die große Zahl der Priester hervor und lässt sich im Deutschen unmittelbar auf das Subjekt beziehen.
theological_decisions:
- issue: Bedeutung der priesterlichen Selbstheiligung
  choice: heiligten sich für ihren Dienst
  alternative: reinigten sich
  rationale: Der Text verwendet קדשׁ und betont kultische Absonderung beziehungsweise Weihe. „Reinigten sich“ wäre möglich als Bestandteil der Vorbereitung, würde den Bedeutungsumfang jedoch verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die große Zahl wird ausgeschrieben; der Wechsel zu zwei Hauptsätzen verbessert bei der langen Aufzählung die Lesbarkeit. Das Plusquamperfekt macht deutlich, dass die bereitgestellten Tiere die zuvor geschilderte ausgedehnte Feier erklären.
