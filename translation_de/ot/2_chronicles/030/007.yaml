  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: de
  text: Und seid nicht wie eure Väter und wie eure Brüder, die Jahwe, dem Gott ihrer Väter, untreu waren. Er machte sie zum Gegenstand des Entsetzens[a], wie ihr selbst seht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Verwüstung«. Das hebräische Wort kann sowohl Verwüstung als auch den Gegenstand des Entsetzens bezeichnen, den sie hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Und seid nicht
  rationale: אַל mit Imperfekt formuliert ein Verbot; die Kopula וְ wird mit „Und“ wiedergegeben, da der Vers an den vorherigen Aufruf anschließt.
- source_word: כַאֲבוֹתֵיכֶם
  choice: wie eure Väter
  rationale: „Väter“ bewahrt die familiäre und heilsgeschichtliche Ausdrucksweise und steht parallel zu „Brüder“.
- source_word: וְכַאֲחֵיכֶם
  choice: und eure Brüder
  rationale: אָח kann auch weitere Verwandte oder Volksgenossen bezeichnen; „Brüder“ erhält hier die familiäre Bundesrhetorik gegenüber den Angehörigen des Nordreichs.
- source_word: מָעֲלוּ בַּיהוָה
  choice: Jahwe … untreu wurden
  rationale: מעל bezeichnet in diesem Zusammenhang einen Treuebruch gegenüber Gott. „Untreu werden“ gibt diese Bundesbeziehung natürlich und verständlich wieder.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: dem Gott ihrer Väter
  rationale: Die traditionelle Bundesformel wird nah an der hebräischen Form bewahrt und greift „Väter“ aus dem ersten Satzteil wieder auf.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: Er machte sie zum Bild des Entsetzens
  rationale: נתן mit לְשַׁמָּה bezeichnet das Versetzen in einen Zustand beziehungsweise das Preisgeben zu einem erschreckenden Geschick. „Bild des Entsetzens“ lässt sowohl das Unheil als auch seine Wirkung auf Betrachter anklingen.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  choice: wie ihr selbst seht
  rationale: Das ausdrückliche Pronomen אַתֶּם wird durch „selbst“ hervorgehoben; der Satz verweist auf eine gegenwärtig sichtbare Wirklichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Subjekts in וַיִּתְּנֵם
  choice: Er bezieht sich auf Jahwe
  alternative: unpersönliche oder passive Wiedergabe
  rationale: Die maskuline Singularform knüpft natürlich an Jahwe, den Gott ihrer Väter, an und stellt sein Gericht als Handlung dar, ohne über den Text hinaus dessen Zweck näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die familiären Bezeichnungen „Väter“ und „Brüder“ bleiben erhalten. Der Satz wird zur besseren deutschen Lesbarkeit nach „wurden“ geteilt, ohne die hebräische Abfolge oder den Zusammenhang von Untreue und Gericht als ausdrückliche Zweckangabe umzudeuten.
