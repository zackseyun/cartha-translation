  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Das Verbot richtet sich gegen die Nachahmung von Vätern und Brüdern, deren Treuebruch Jahwe gegenüber genannt wird; das Singularsubjekt der folgenden Handlung ist Jahwe. »Untreu wurden« legt jedoch einen im hebräischen Perfekt nicht ausdrücklich markierten Eintritt in die Untreue nahe. »Bild des Entsetzens« ist für לְשַׁמָּה zudem keine präzise oder idiomatische Wiedergabe.'
