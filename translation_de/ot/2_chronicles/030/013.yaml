base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: de
  text: Sehr viele Menschen versammelten sich in Jerusalem, um im zweiten Monat das Fest der ungesäuerten Brote[a] zu feiern[b] – eine überaus große Versammlung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Fest der Mazzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu begehen“ oder „zu halten“; wörtlich: „zu tun/machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Der Niphal von אסף bezeichnet hier das Zusammenkommen beziehungsweise Sichversammeln. Die reflexive Form ist im modernen Deutschen natürlich und gibt den Vorgang klar wieder.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Die im Deutschen eingebürgerte Form des Ortsnamens.
- source_word: עַם רָב
  choice: sehr viele Menschen
  rationale: Die Wendung bezeichnet eine große Zahl von Menschen. Diese Wiedergabe bewahrt den quantitativen Nachdruck und klingt natürlicher als eine wörtliche Formulierung mit „Volk“.
- source_word: לַעֲשׂוֹת
  choice: zu feiern
  rationale: Das Grundverb bedeutet „tun/machen“, bezeichnet mit einem Fest als Objekt jedoch idiomatisch dessen Feier oder Begehung.
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: חַג bezeichnet hier ein religiöses Fest; מַצּוֹת sind ohne Sauerteig zubereitete Brote. Die gewählte Form ist verständlich und in deutschen Bibelübersetzungen etabliert.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: im zweiten Monat
  rationale: Die formnahe Wiedergabe erhält die für den Zusammenhang wichtige Zeitangabe.
- source_word: קָהָל
  choice: Versammlung
  rationale: קָהָל bezeichnet die zusammengekommene Gemeinschaft. „Versammlung“ wahrt den formellen Charakter, ohne unnötig kirchlich zu klingen.
- source_word: לָרֹב מְאֹד
  choice: überaus groß
  rationale: Die hebräische Wendung verstärkt die Aussage über die Größe beziehungsweise Zahl der Versammlung. „Überaus groß“ erhält diesen emphatischen Abschluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abschließende Wiederaufnahme („eine überaus große Versammlung“) bleibt trotz ihrer inhaltlichen Nähe zum ersten Satzteil erhalten, weil sie den Nachdruck des Hebräischen wiedergibt.
