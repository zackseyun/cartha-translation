base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: de
  text: Denn sie konnten es zu jener Zeit nicht feiern, weil sich die Priester nicht hinreichend geheiligt hatten[a] und das Volk nicht in Jerusalem zusammengekommen war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sich nicht genügend Priester geheiligt hatten“. Der hebräische Ausdruck kann sich auf ein ausreichendes Maß der Selbstheiligung oder auf eine ausreichende Zahl geheiligter Priester beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach Jerusalem“. Die hebräische Präposition bezeichnet die Richtung auf Jerusalem zu; im Deutschen wird bei „zusammenkommen“ gewöhnlich der Ort der Versammlung genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: konnten
  rationale: Das Verb bezeichnet Fähigkeit oder Möglichkeit. „Sie konnten nicht“ gibt die verneinte Möglichkeit natürlich und unmittelbar wieder.
- source_word: לַעֲשֹׂתוֹ
  choice: es feiern
  rationale: Das Pronomen verweist im Zusammenhang auf das Passafest. „Es feiern“ ist im Deutschen verständlicher als das formal nähere, aber unbestimmte „es tun“.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Die Wendung bezeichnet den zuvor genannten regulären Zeitpunkt des Passafestes, ohne das im Hebräischen nicht ausdrücklich stehende Wort „festgesetzt“ einzufügen.
- source_word: הִתְקַדְּשׁוּ
  choice: sich geheiligt hatten
  rationale: Der Hitpael bezeichnet hier die kultische Selbstheiligung beziehungsweise Vorbereitung der Priester. „Sich geheiligt hatten“ wahrt den kultischen Gehalt und bleibt in diesem historischen Kontext verständlich.
- source_word: לְמַדַּי
  choice: hinreichend
  rationale: Das knappe Adverb bezeichnet ein ausreichendes Maß oder eine ausreichende Menge. „Hinreichend“ erhält diese Offenheit; eine Fußnote nennt die mögliche zahlenmäßige Deutung.
- source_word: נֶאֶסְפוּ
  choice: zusammengekommen war
  rationale: Der Nifal bezeichnet hier das Sichversammeln des Volkes. „Zusammengekommen“ ist natürliches modernes Deutsch und lässt den Vorgang als gemeinschaftliches Zusammenfinden erkennen.
- source_word: לִירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition לְ ist formal direktional („nach“), doch bei „zusammenkommen“ bezeichnet idiomatisches Deutsch den erreichten Versammlungsort mit „in Jerusalem“. Die direktionale Form wird in der Fußnote kenntlich gemacht.
