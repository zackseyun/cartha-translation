  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: de
  text: jeden, der sein Herz darauf gerichtet hatte, Gott, Jahwe, den Gott seiner Väter, zu suchen, obwohl er nicht entsprechend der Reinheit handelte, die für das Heilige[a] erforderlich war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die für das Heiligtum erforderliche Reinheit“. Das hebräische Wort קֹדֶשׁ kann hier den heiligen beziehungsweise sakralen Bereich, einschließlich des Heiligtums, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: jeden, der sein Herz
  rationale: 'כָּל ist hier distributiv zu verstehen und setzt den Satz aus Vers 18 fort: Gemeint ist jeder Einzelne, dessen Herz entsprechend ausgerichtet war.'
- source_word: הֵכִין
  choice: darauf gerichtet hatte
  rationale: Der Hifil von כון bezeichnet hier das bewusste Ausrichten oder Festmachen des Herzens. Die Formulierung gibt die innere Entschlossenheit natürlich wieder, ohne sie bloß als rituelle Vorbereitung zu deuten.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דרש mit Gott als Objekt umfasst hingebungsvolles Suchen, Verehrung und Befragung; „suchen“ bewahrt diese Bedeutungsbreite.
- source_word: הָאֱלֹהִים יְהוָה
  choice: Gott, Jahwe
  rationale: Die Apposition identifiziert den gesuchten Gott ausdrücklich als Jahwe und bewahrt sowohl אֱלֹהִים als auch den Gottesnamen יְהוָה.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: den Gott seiner Väter
  rationale: Der Singular des Suffixes entspricht der distributiven Aussage über jeden Einzelnen; „seiner Väter“ erhält den Bezug auf die Vorfahren Israels.
- source_word: וְלֹא
  choice: obwohl … nicht
  rationale: 'Die Konjunktion hat im Zusammenhang einen konzessiven Sinn: Das aufrichtige Suchen Gottes steht neben der fehlenden kultischen Reinigung.'
- source_word: כְּטָהֳרַת הַקֹּדֶשׁ
  choice: der für die heilige Stätte vorgeschriebenen Reinigung entsprach
  rationale: כְּ bezeichnet die Übereinstimmung mit einem Maßstab, טָהֳרָה die kultische Reinigung und קֹדֶשׁ wahrscheinlich den heiligen Bereich. Die Formulierung macht den normativen Sinn in idiomatischem Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Herzenshaltung und ritueller Unreinheit
  choice: Beide Aussagen bleiben unaufgelöst nebeneinander stehen.
  alternative: Die rituelle Unreinheit abzuschwächen oder die aufrichtige Suche nach Gott in den Hintergrund zu rücken.
  rationale: Der Vers verbindet die bewusste Hinwendung zu Gott mit der Nichterfüllung des kultischen Reinigungsmaßstabs. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist als syntaktische Fortsetzung von Vers 18 formuliert; daher beginnt er mit „jeden“. „Darauf gerichtet hatte“ ist natürlich und bildet zugleich die hebräische Wendung vom Ausrichten des Herzens erkennbar ab.
