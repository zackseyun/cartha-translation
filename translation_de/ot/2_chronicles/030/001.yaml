source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: de
  text: Dann sandte Hiskia eine Botschaft an ganz Israel und Juda[a]. Auch schrieb er Briefe an Ephraim und Manasse, sie sollten zum Haus Jahwes in Jerusalem kommen und für Jahwe, den Gott Israels, das Passafest feiern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ganz Israel und Juda“. Die hebräische Präposition kann sowohl die Adressaten als auch die räumliche Ausdehnung der Sendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für Jahwe … das Passa tun“. Gemeint ist, das Passafest zu begehen oder zu feiern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte eine Botschaft
  rationale: Das Verb bedeutet wörtlich „senden“. Im Zusammenhang mit einer an Volksgruppen gerichteten Aufforderung gibt „eine Botschaft senden“ die mitgemeinte Mitteilung natürlich wieder, ohne ausdrücklich Boten vorauszusetzen.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: an ganz Israel und Juda
  rationale: עַל bezeichnet hier Ziel beziehungsweise Reichweite der Sendung. „An ganz Israel und Juda“ ist im Deutschen klar und wahrt den Bezug sowohl auf die Bevölkerung als auch auf das Gebiet.
- source_word: אִגְּרוֹת כָּתַב
  choice: schrieb Briefe
  rationale: Direkte und geläufige Wiedergabe der schriftlichen Korrespondenz.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: an Ephraim und Manasse
  rationale: Die Präposition kennzeichnet hier am ehesten die Adressaten beziehungsweise die angesprochenen Stammesgebiete.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: sie sollten zum Haus Jahwes … kommen
  rationale: Der Infinitiv drückt den Inhalt beziehungsweise Zweck der Aufforderung aus. „Haus Jahwes“ bewahrt die konkrete hebräische Bezeichnung und vermeidet die interpretierende Verengung auf „Tempel“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Umschrift „Jahwe“ gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: das Passafest feiern
  rationale: Wörtlich steht „Passa tun/machen“, eine hebräische Wendung für das Begehen des Passafestes. „Feiern“ ist eine natürliche und verständliche deutsche Entsprechung.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das לְ bezeichnet hier die Ausrichtung oder Widmung des Festes. „Für Jahwe“ klingt im Deutschen natürlich und bewahrt diesen Sinn, ohne die Beziehung weiter auszudeuten.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Wörtliche und idiomatische Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ macht dies sichtbar und unterscheidet den Namen von einem bloßen Herrschaftstitel.
- issue: Beziehung des Passafestes zu Jahwe in לַיהוָה
  choice: für Jahwe
  alternative: Jahwe zu Ehren
  rationale: „Für Jahwe“ wahrt die knappe und semantisch offene Dativ-/Widmungsbeziehung. „Jahwe zu Ehren“ wäre verständlich, würde die Beziehung aber stärker als reine Ehrung festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Hebräischen leicht gegliedert, damit die lange Folge von Zielangaben verständlich bleibt. „Haus Jahwes“ erhält die biblische Bildsprache; „Passafest feiern“ gibt die hebräische Redewendung idiomatisch wieder.
