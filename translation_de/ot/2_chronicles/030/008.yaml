source:
  edition: WLC
  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: de
  text: Nun verhärtet euren Nacken nicht wie eure Väter. Gebt dem HERRN eure Hand[a] und kommt in sein Heiligtum, das er für immer geheiligt hat. Dient dem HERRN, eurem Gott, damit sich die Glut seines Zorns von euch abwendet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gebt dem HERRN Hand.“ Die hebräische Wendung kann bedeuten: „Unterwerft euch dem HERRN“ oder „Ergebt euch dem HERRN“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die Glut seines Zorns wird sich von euch abwenden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Das hebräische עַתָּה ist ausdrücklich vorhanden und wird als zeitlich-diskursiver Übergang mit „Nun“ wiedergegeben.
- source_word: אַל תַּקְשׁוּ עָרְפְּכֶם
  choice: verhärtet euren Nacken nicht
  rationale: Die konkrete hebräische Metapher für hartnäckigen Widerstand bleibt erhalten und ist im Deutschen verständlich.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: wie eure Väter
  rationale: „Väter“ entspricht dem maskulinen Plural und bezeichnet hier die früheren Generationen.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Gebt dem HERRN eure Hand
  rationale: Die auffällige hebräische Wendung wird bildhaft bewahrt; ihre Bedeutung als Unterwerfung oder verbindliche Hingabe wird in einer Fußnote erläutert.
- source_word: מִקְדָּשׁוֹ
  choice: sein Heiligtum
  rationale: „Heiligtum“ gibt den heiligen Ort wieder, ohne den Ausdruck unnötig auf einen einzelnen Gebäudeteil zu verengen.
- source_word: אֲשֶׁר הִקְדִּישׁ לְעוֹלָם
  choice: das er für immer geheiligt hat
  rationale: Die Wortverwandtschaft zwischen מִקְדָּשׁ und הִקְדִּישׁ wird durch „Heiligtum“ und „geheiligt“ sichtbar gehalten; לְעוֹלָם wird in seinem naheliegenden Sinn wiedergegeben.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: Dient dem HERRN
  rationale: עבד bezeichnet hier den Dienst für Gott und kann gottesdienstliche Verehrung einschließen; „dienen“ lässt diesen Bedeutungsumfang offen.
- source_word: וְיָשֹׁב מִכֶּם
  choice: damit sich … von euch abwendet
  rationale: Im Anschluss an die Aufforderungen bezeichnet die Form den beabsichtigten beziehungsweise erhofften Ausgang, nicht zwingend eine unbedingte Vorhersage.
- source_word: חֲרוֹן אַפּוֹ
  choice: die Glut seines Zorns
  rationale: Die hebräische Hitze-Metapher für heftigen Zorn wird in natürlichem Deutsch bewahrt.
theological_decisions:
- issue: Bedeutung von תְּנוּ יָד לַיהוָה
  choice: Gebt dem HERRN eure Hand
  alternative: Unterwerft euch dem HERRN; ergebt euch dem HERRN
  rationale: Die Wendung kann Unterwerfung, Ergebung oder verbindliche Loyalität ausdrücken. Das Hauptbild bleibt stehen, während die Fußnote die Deutungsmöglichkeiten nennt.
- issue: Aussagekraft von וְיָשֹׁב im Aufforderungszusammenhang
  choice: damit sich die Glut seines Zorns von euch abwendet
  alternative: und die Glut seines Zorns wird sich von euch abwenden
  rationale: Die Zwecksatzformulierung wahrt den resultativen beziehungsweise jussivischen Zug und vermeidet es, die Aussage als mechanisch-unbedingte Zusage festzulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH; Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen ist im allgemeinen Bibelgebrauch verständlich und kennzeichnet den Eigennamen, ohne eine unsichere Aussprache festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Nacken- und Handmetaphorik des Hebräischen bleibt erhalten. Anders als die englische Konsultationsfassung wird das im WLC ausdrücklich belegte עַתָּה mit „Nun“ übersetzt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
