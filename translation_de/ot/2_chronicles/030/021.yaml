  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: de
  text: Die Israeliten, die sich in Jerusalem befanden, feierten sieben Tage lang das Fest der ungesäuerten Brote mit großer Freude; und die Leviten und die Priester priesen Jahwe Tag für Tag mit kraftvollen Instrumenten für Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit Instrumenten der Stärke für Jahwe“. Die ungewöhnliche hebräische Wendung kann kraftvolle oder laute Instrumente bezeichnen; auch die genaue Beziehung von „für Jahwe“ ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג
  choice: feierten ... das Fest
  rationale: עשה mit חַג bezeichnet idiomatisch das Begehen oder Feiern eines Festes; „feierten“ ist im modernen Deutschen natürlich und gibt den freudigen Kontext treffend wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die Wendung bedeutet hier kollektiv das Volk Israel beziehungsweise dessen anwesende Angehörige. „Die Israeliten“ ist natürlich, präzise und schließt den allgemeinen Personenbezug der hebräischen Wendung ein.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: die sich in Jerusalem eingefunden hatten
  rationale: מצא im Nifal kann wörtlich „sich befinden/gefunden werden“ bedeuten. Im Kontext bezeichnet es diejenigen, die in Jerusalem anwesend beziehungsweise dort zusammengekommen waren; „sich eingefunden hatten“ bewahrt den Ereignisbezug und klingt idiomatisch.
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: Dies ist die etablierte und verständliche deutsche Bezeichnung des israelitischen Festes.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die deutsche Zeitangabe gibt die Dauer natürlich und genau wieder.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: mit großer Freude
  rationale: Direkte, natürliche Wiedergabe der hebräischen Präpositionalphrase.
- source_word: וּמְהַלְלִים
  choice: Und ... priesen
  rationale: Das Partizip beschreibt die fortdauernde Begleithandlung während der Festzeit. Eine finite Verbform ist im Deutschen flüssiger; „und“ bewahrt den Anschluss des hebräischen ו.
- source_word: יוֹם בְּיוֹם
  choice: Tag für Tag
  rationale: Die deutsche Wendung erhält die distributive, fortlaufende Bedeutung des hebräischen Ausdrucks.
- source_word: בִּכְלֵי עֹז
  choice: mit machtvoll klingenden Instrumenten
  rationale: Wörtlich steht „mit Instrumenten der Stärke/Macht“. Im musikalischen Kontext liegt ein kräftiger beziehungsweise machtvoller Klang nahe; die Übersetzung bleibt durch eine Fußnote als Deutung erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ macht diesen transparent, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bezug von לַיהוָה am Versende
  choice: „priesen Jahwe“; das abschließende „für Jahwe/zu Jahwe“ wird nicht nochmals im Haupttext wiederholt
  alternative: „mit Instrumenten der Kraft für Jahwe“ beziehungsweise „spielten Jahwe machtvoll auf Instrumenten“
  rationale: Die hebräische Syntax ist gedrängt und das abschließende לַיהוָה kann die Instrumente beziehungsweise deren Einsatz näher bestimmen. Eine wörtliche Wiederholung des Gottesnamens wäre im Deutschen schwerfällig; die mögliche Zuordnung wird in der Fußnote offengelegt, ohne eine theologische Zusatzdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt erzählerisch klar; ungewöhnliche Quellensprache wird dort idiomatisch wiedergegeben, wo eine formale Nachbildung im Deutschen missverständlich oder schwerfällig wäre. Die echte Unsicherheit bei בִּכְלֵי עֹז לַיהוָה wird in der Fußnote bewahrt.
