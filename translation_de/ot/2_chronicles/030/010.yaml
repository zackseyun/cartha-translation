  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: de
  text: Da zogen die Boten von Stadt zu Stadt im Gebiet von Ephraim und Manasse bis nach Sebulon. Doch man lachte sie aus und verspottete sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen zwei Ausdrücke der Verachtung nebeneinander: Sie lachten die Boten aus und verspotteten sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: die Boten
  rationale: Das substantivierte Partizip von רוץ bezeichnet hier schnell reisende Überbringer einer offiziellen Botschaft. »Boten« ist im heutigen Deutsch natürlich und gibt die Funktion klar wieder; »Läufer« wäre formaler, könnte aber missverständlich wirken.
- source_word: עֹבְרִים
  choice: zogen
  rationale: Das Partizip beschreibt das fortgesetzte Reisen beziehungsweise Durchziehen. »zogen« passt natürlich zur Bewegung von Stadt zu Stadt.
- source_word: מֵעִיר לָעִיר
  choice: von Stadt zu Stadt
  rationale: Die distributive Wendung wird im Deutschen idiomatisch und quellennah wiedergegeben.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: im Gebiet von Ephraim und Manasse bis nach Sebulon
  rationale: »Gebiet« gibt אֶרֶץ in diesem geografischen Zusammenhang natürlich wieder; »bis nach Sebulon« bewahrt die durch וְעַד bezeichnete Ausdehnung der Route.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: lachten sie aus
  rationale: Der Hifil-Ausdruck bezeichnet hier höhnisches Lachen, nicht bloße Heiterkeit. »auslachen« bringt die gegen die Boten gerichtete Verachtung deutlich zum Ausdruck.
- source_word: וּמַלְעִגִים בָּם
  choice: verspotteten sie
  rationale: לעג bezeichnet spöttische Verachtung. Zusammen mit »auslachen« bewahrt »verspotten« die zweifache und steigernde Beschreibung der feindseligen Reaktion.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: So ... Doch die Leute dort
  rationale: Die erste Erzählform führt das Ergebnis des vorausgehenden Auftrags fort; »Doch« macht den sachlichen Gegensatz zwischen dem Weg der Boten und der ablehnenden Reaktion deutlich. Das ergänzte »die Leute dort« klärt den im Hebräischen nur impliziten Subjektwechsel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung folgt der fortschreitenden Handlung des Verses, vermeidet das heute potenziell missverständliche »Läufer« und macht den im Hebräischen kontextuell erschlossenen Subjektwechsel transparent. Der Fußnotenmarker steht unmittelbar nach der zweigliedrigen Wendung, die er erläutert.
