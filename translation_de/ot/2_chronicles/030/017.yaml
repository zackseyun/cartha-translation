  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: de
  text: Denn viele in der Versammlung hatten sich nicht geheiligt[a], und die Leviten waren dafür zuständig, die Passaopfer[b] für jeden zu schlachten, der nicht rein war[c], um sie für Jahwe zu heiligen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatten sich nicht geweiht“. Gemeint ist die kultische Vorbereitung; das Hebräische verwendet jedoch ausdrücklich Heiligungssprache.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Passa“. Gemeint sind die Opfertiere des Passafestes.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: kultisch nicht rein.'
    reason: clarification
  - marker: d
    text: Im Hebräischen steht kein ausdrückliches Objekt. Am nächsten liegt der Bezug auf die Passaopfer; möglich ist auch ein Bezug auf die nicht reinen Personen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: viele in der Versammlung
  rationale: Die Wendung bezeichnet eine große Zahl innerhalb der zum Fest versammelten Gemeinschaft. „Versammlung“ gibt קָהָל im kultischen Zusammenhang klar und gegenwartsnah wieder.
- source_word: הִתְקַדָּשׁוּ
  choice: hatten sich nicht geheiligt
  rationale: Der Hitpael von קדשׁ bezeichnet hier das Sich-Heiligen beziehungsweise die kultische Vorbereitung auf den Gottesdienst. „Geheiligt“ bewahrt die Heiligkeitssprache des Hebräischen, ohne sie auf bloße Reinigung zu verengen.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Übliche deutsche Bezeichnung der levitischen Kultdiener.
- source_word: עַל שְׁחִיטַת
  choice: waren für das Schlachten … zuständig
  rationale: עַל bezeichnet hier Verantwortung für eine Tätigkeit. Die Formulierung gibt diese Funktion in natürlichem modernem Deutsch wieder.
- source_word: הַפְּסָחִים
  choice: die Passaopfer
  rationale: Der Plural bezeichnet hier die zum Passafest geschlachteten Opfertiere. „Passaopfer“ ist genauer als „Passalämmer“, da nach dem Kontext auch Ziegen als Passatiere möglich waren.
- source_word: לְכֹל לֹא טָהוֹר
  choice: für jeden, der nicht rein war
  rationale: טָהוֹר meint in diesem Zusammenhang kultische Reinheit. Die einfache Formulierung bleibt verständlich; eine Fußnote verdeutlicht den kultischen Sinn.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: um sie Jahwe zu heiligen
  rationale: Der Infinitiv bezeichnet den Zweck des Schlachtens. Das ergänzte Pronomen „sie“ bezieht sich am naheliegendsten auf die Passaopfer; dass das Hebräische kein Objekt ausdrückt, wird in einer Fußnote offengelegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Heiligungs- und Reinheitssprache im Passakontext
  choice: 'Die beiden hebräischen Begriffsfelder werden unterschieden: „sich heiligen“ für קדשׁ und „rein“ für טהר.'
  alternative: Beide Ausdrücke auf rituelle Reinigung beziehen und etwa „sich reinigen“ formulieren.
  rationale: Obwohl die unmittelbare Frage die kultische Zulassung betrifft, verwendet der Text ausdrücklich Heiligkeitssprache. Die Unterscheidung bewahrt die theologische Spannung zwischen Heiligung und Reinheit.
- issue: Unausgesprochenes Objekt von לְהַקְדִּישׁ
  choice: Das ergänzte „sie“ auf die Passaopfer beziehen.
  alternative: Die unreinen Personen als unausgesprochenes Objekt verstehen oder den Satz ohne bestimmtes Objekt wiedergeben.
  rationale: Die Passaopfer sind der nächstliegende syntaktische Bezug und werden durch das Schlachten Jahwe geheiligt. Da das Hebräische das Objekt offenlässt, dokumentiert eine Fußnote die verbleibende Mehrdeutigkeit.
- issue: Zusammenhang zwischen fehlender Heiligung und dem Dienst der Leviten
  choice: Das hebräische וְ als „und“ wiedergeben.
  alternative: Die Folgerung mit „deshalb“ ausdrücklich machen.
  rationale: Der kausale Zusammenhang ist aus dem Kontext erkennbar, wird im Hebräischen an dieser Stelle aber nur durch die gewöhnliche Verbindungspartikel ausgedrückt. „Und“ vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachsprache wird dort bewahrt, wo sie für die Unterscheidung von Heiligung und Reinheit wesentlich ist; schwerfällige wörtliche Konstruktionen werden idiomatisch wiedergegeben.
