base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: de
  text: 'So beschlossen sie, in ganz Israel, von Beerscheba bis Dan, einen Aufruf ergehen zu lassen: Man solle nach Jerusalem kommen, um für Jahwe, den Gott Israels, das Passafest zu feiern. Denn sie hatten es nicht in großer Zahl gefeiert, wie es geschrieben steht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist knapp und mehrdeutig. Möglich ist auch: „Denn nicht viele hatten es gefeiert, wie es geschrieben steht.“ לָרֹב bezeichnet wahrscheinlich eine große Zahl bzw. Menge, nicht eine lange Zeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: So beschlossen sie
  rationale: Die Wendung bedeutet wörtlich, eine Sache festzustellen bzw. bestehen zu lassen, und bezeichnet hier einen förmlichen gemeinsamen Beschluss. „Sie beschlossen“ ist im Deutschen natürlich und wahrt den amtlichen Charakter im Zusammenhang.
- source_word: לְהַעֲבִיר קוֹל
  choice: einen Aufruf ergehen zu lassen
  rationale: Wörtlich wird eine Stimme oder Nachricht durch das Land geschickt. Die gewählte Formulierung gibt die öffentliche Bekanntmachung idiomatisch wieder.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: in ganz Israel
  rationale: Die Präpositionalphrase bezeichnet den gesamten räumlichen Geltungsbereich des Aufrufs.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: von Beerscheba bis Dan
  rationale: Die feste geografische Wendung bezeichnet das Land in seiner ganzen Ausdehnung vom Süden bis zum Norden; die Ortsnamen und das Bild bleiben erhalten.
- source_word: לָבוֹא
  choice: Man solle … kommen
  rationale: Der Infinitiv bezeichnet Inhalt und Ziel des Aufrufs. Der deutsche Aufforderungssatz macht diesen Zusammenhang klar, ohne den Personenkreis enger festzulegen.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: das Passafest zu feiern
  rationale: Das hebräische „Passa tun/machen“ ist eine feste Wendung für die Durchführung bzw. Feier des Passafestes. „Feiern“ ist gegenwärtiges, verständliches Deutsch.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Ausrichtung der Feier auf Gott; „für“ ist hier im Deutschen idiomatisch. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Dies ist die direkte und übliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: בִּירוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Da Jerusalem das Ziel des Kommens ist, verbindet das Deutsche den Ortsnamen natürlich mit „nach“; der Ort der Feier bleibt zugleich eindeutig.
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: Denn sie hatten es nicht in großer Zahl so gefeiert, wie es vorgeschrieben ist
  rationale: 'לָרֹב wird primär quantitativ verstanden: Das Passa war nicht von vielen bzw. in großer Zahl gefeiert worden. כַּכָּתוּב verweist auf die schriftliche Vorschrift. Die gedrängte hebräische Syntax lässt den genauen Bezug jedoch offen; diese Unsicherheit wird in der Fußnote kenntlich gemacht.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von כַּכָּתוּב im schwierigen Schlusssatz
  choice: „wie es vorgeschrieben ist“ beschreibt die Passafeier, während לָרֹב die geringe Beteiligung bezeichnet
  alternative: Der gesamte Schlusssatz kann als Aussage verstanden werden, dass nicht viele das Passa vorschriftsgemäß gefeiert hatten
  rationale: Die hebräische Formulierung ist syntaktisch verdichtet. Die Hauptfassung erhält sowohl den quantitativen Sinn von לָרֹב als auch den Maßstab der schriftlichen Vorschrift, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzgliederung durch Doppelpunkt und zwei Sätze löst die lange hebräische Konstruktion behutsam auf. „Passafest“ ist für heutige Leser klarer als das alleinstehende „Passa“; die geografische Formel und der Gottesname bleiben erhalten.
