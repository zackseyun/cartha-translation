  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: de
  text: So herrschte große Freude in Jerusalem; denn seit den Tagen Salomos, des Sohnes Davids, des Königs von Israel, hatte es so etwas in Jerusalem nicht gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: So herrschte
  rationale: Die Wayyiqtol-Form führt die Erzählung fort und kann hier zugleich die Folge der vorausgehenden Ereignisse ausdrücken. „So herrschte“ klingt im Deutschen natürlich und verbindet sich idiomatisch mit „Freude“.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: große Freude
  rationale: Die direkte Wiedergabe bewahrt sowohl die starke emotionale als auch die gemeinschaftliche Bedeutung, ohne das Wort auf eine bloße Feier festzulegen.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Präposition ב ist hier lokal gebraucht; „in Jerusalem“ ist die übliche moderne deutsche Form.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung beziehungsweise Erläuterung der großen Freude ein. „Denn“ wahrt diesen Zusammenhang in würdigem, verständlichem Deutsch.
- source_word: מִימֵי
  choice: seit den Tagen
  rationale: Der Ausdruck bezeichnet den Zeitraum von einer früheren Epoche bis zum berichteten Geschehen. „Seit den Tagen“ gibt diese zeitliche Vergleichsspanne knapp wieder.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomos, des Sohnes Davids
  rationale: Die Konstruktverbindung wird in natürlichem Deutsch als Genitiv mit erklärender Apposition wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Der Titel steht appositionell zu Salomo. Die Kasusangleichung an „Salomos“ macht den Bezug eindeutig und bewahrt die Bezeichnung.
- source_word: לֹא כָזֹאת
  choice: hatte es so etwas … nicht mehr gegeben
  rationale: Wörtlich steht „nicht wie dies“. Die deutsche Formulierung ergänzt nur das im Hebräischen aus dem Zusammenhang erschließbare Geschehen und drückt aus, dass seit jener Zeit nichts Vergleichbares vorgekommen war.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Wiederholung der Ortsangabe wird wie im Hebräischen beibehalten und rahmt die Aussage rhetorisch.
