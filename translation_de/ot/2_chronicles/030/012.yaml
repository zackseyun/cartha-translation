- from: Auch in Juda wirkte die Hand Gottes, sodass sie eines Herzens waren und den Befehl des Königs und der führenden Männer ausführten[a], wie es dem Wort Jahwes entsprach.
  to: Auch in Juda war Gottes Hand am Werk, um sie eines Herzens zu machen, damit sie den Befehl des Königs und der führenden Männer ausführten, gemäß dem Wort Jahwes[a].
  rationale: Die Revision bewahrt die hebräischen Bilder von Gottes „Hand“ und dem „einen Herzen“, stellt die zweckgerichtete Satzstruktur klarer dar und verankert die vorhandene Auslegungsfußnote an der tatsächlich erläuterten Schlussphrase. Sie legt keinen dogmatischen Mechanismus des göttlichen Handelns fest.
