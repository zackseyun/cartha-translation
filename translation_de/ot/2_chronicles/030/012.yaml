  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: de
  text: Auch in Juda war Gottes Hand am Werk, um sie eines Herzens zu machen, damit sie den Befehl des Königs und der führenden Männer ausführten, gemäß dem Wort Jahwes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgrund des Wortes Jahwes“.'
    reason: Die Wendung בִּדְבַר יְהוָה kann sowohl die Übereinstimmung mit Jahwes Wort als auch dessen maßgebliche Veranlassung bezeichnen.
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: Auch in Juda
  rationale: Bewahrt die additive und lokative Bedeutung knapp und natürlich.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: wirkte die Hand Gottes
  rationale: Bewahrt das hebräische Bild der göttlichen Hand und macht zugleich dessen aktive Bedeutung im Deutschen verständlich.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: sodass sie eines Herzens waren
  rationale: Gibt die von Gott bewirkte Einmütigkeit idiomatisch wieder und erhält die Herzmetapher des Hebräischen.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: den Befehl … ausführten
  rationale: Im königlich-administrativen Zusammenhang bezeichnet מִצְוָה einen Befehl; עשה bedeutet hier dessen praktische Ausführung.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: des Königs und der führenden Männer
  rationale: שׂרים bezeichnet hochgestellte Verantwortungsträger; die Formulierung ist gegenwärtig und vermeidet die heute missverständliche Wiedergabe „Fürsten“.
- source_word: בִּדְבַר יְהוָה
  choice: wie es dem Wort Jahwes entsprach
  rationale: Versteht ב als Kennzeichnung der Übereinstimmung des königlichen Befehls mit Jahwes Wort, ohne eine bloß instrumentale Bedeutung festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Art des göttlichen Wirkens durch die „Hand Gottes“
  choice: Gottes aktives Wirken wird als Ursache der gemeinsamen Herzenshaltung ausgesagt.
  alternative: Eine schwächere Hilfeleistung oder eine ausdrücklich unwiderstehliche Verursachung.
  rationale: Der hebräische Satz schreibt die Einmütigkeit eindeutig Gott zu, legt aber keinen späteren dogmatischen Mechanismus fest.
- issue: Verhältnis des königlichen Befehls zum Wort Jahwes
  choice: Der Befehl entspricht dem Wort Jahwes.
  alternative: Der Befehl wurde unmittelbar durch ein Wort Jahwes erteilt.
  rationale: בִּדְבַר kann instrumentale oder normative Beziehung ausdrücken; im Kontext ist die Übereinstimmung wahrscheinlich, doch die Fußnote hält die engere Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metaphern „Hand Gottes“ und „eines Herzens“ bleiben erhalten; syntaktische Glättung sorgt für unmittelbare Verständlichkeit.
