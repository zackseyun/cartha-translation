  - severity: low
    issue: Der Fußnotenanker steht nach „ausführten“, obwohl die Fußnote „aufgrund des Wortes Jahwes“ die Schlussphrase erläutert.
    rationale: Der Anker soll unmittelbar bei „gemäß dem Wort Jahwes“ stehen, damit Bezug und alternative Lesart eindeutig sind.
  - severity: low
