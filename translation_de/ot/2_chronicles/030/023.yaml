source:
  edition: WLC
  text: וַ/יִּוָּֽעֲצוּ֙ כָּל הַ/קָּהָ֔ל לַ/עֲשׂ֕וֹת שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יַּֽעֲשׂ֥וּ שִׁבְעַת יָמִ֖ים שִׂמְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/023.yaml
  text: Then the whole assembly agreed to keep it for another seven days[a], and they kept it for seven days with joy.
translation:
  language: de
  text: Da beschloss die ganze Versammlung, noch weitere sieben Tage zu feiern[a], und sie feierten sieben Tage lang mit Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „noch weitere sieben Tage zu tun … und sie taten sieben Tage“; „tun“ wird hier idiomatisch für das Begehen eines Festes gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲצוּ
  choice: Da beschloss
  rationale: Das Niphal von יעץ bezeichnet hier eine gemeinsame Beratung, die zu einem Beschluss führt. „beschloss“ gibt in natürlichem Deutsch das Ergebnis wieder; der kollektive Sinn folgt aus „die ganze Versammlung“.
- source_word: כָּל הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft; „Versammlung“ ist im Erzählzusammenhang klar und „ganze“ bewahrt כָּל.
- source_word: לַעֲשׂוֹת
  choice: zu feiern
  rationale: עשה bedeutet wörtlich „tun/machen“, wird hier im Festzusammenhang aber idiomatisch für das Begehen beziehungsweise Feiern weiterer Festtage gebraucht. Das bloße „tun“ wäre im Deutschen unverständlich.
- source_word: שִׁבְעַת יָמִים אֲחֵרִים
  choice: noch weitere sieben Tage
  rationale: Die Wendung bezeichnet einen zusätzlichen Zeitraum von sieben Tagen; „noch weitere“ bringt die Verlängerung eindeutig zum Ausdruck.
- source_word: וַיַּעֲשׂוּ
  choice: sie feierten
  rationale: Wie zuvor ist עשה im Zusammenhang mit dem Fest idiomatisch als „feiern“ zu verstehen. Die Wiederholung wahrt die Parallelität des hebräischen Satzes.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer; „lang“ macht diese Funktion in natürlichem Deutsch deutlich.
- source_word: שִׂמְחָה
  choice: mit Freude
  rationale: Das Substantiv bezeichnet Freude oder Fröhlichkeit und beschreibt hier die Art des Feierns.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Feiern“ erschließt den im Zusammenhang gemeinten idiomatischen Gebrauch von עשה, ohne im Haupttext ein im Vers nicht ausdrücklich genanntes Fest einzufügen.
