base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/004.yaml
  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: de
  text: Die Sache erschien dem König und der ganzen Versammlung richtig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Sache war in den Augen des Königs und der ganzen Versammlung richtig.«'
    reason: Die hebräische Wendung kann sowohl als Beurteilung („erschien … richtig“) als auch unmittelbarer („war … richtig“) wiedergegeben werden; die Alternative bewahrt zudem das Bild „in den Augen“.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: erschien … richtig
  rationale: Das Verb ישר bezeichnet hier im Zusammenhang mit בְּעֵינֵי eine positive Beurteilung als richtig oder angemessen. Die Formulierung bewahrt den wertenden Sinn, ohne objektive Richtigkeit ausdrücklich festzulegen.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דבר ist ein weiter Begriff für Sache, Angelegenheit oder Wort. „Die Sache“ verweist natürlich auf den zuvor beratenen Plan und bleibt näher am Wortlaut als „der Vorschlag“.
- source_word: בְּעֵינֵי הַמֶּלֶךְ
  choice: dem König
  rationale: Der hebräische Ausdruck bedeutet wörtlich „in den Augen des Königs“. Im Deutschen gibt der Dativ in Verbindung mit „erschien … richtig“ dieselbe Beurteilung idiomatisch und klar wieder.
- source_word: כָּל הַקָּהָל
  choice: die ganze Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft; „Versammlung“ ist sachlich, verständlich und vermeidet eine unnötig kirchliche Färbung. כָּל wird umfassend mit „die ganze“ wiedergegeben.
