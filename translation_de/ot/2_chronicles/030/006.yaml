revisions:
- from: 'Da zogen die Kuriere mit den Briefen aus der Hand des Königs und seiner führenden Männer durch ganz Israel und Juda. Nach dem Befehl des Königs verkündeten sie: „Ihr Söhne Israels, kehrt um zu Jahwe, dem Gott Abrahams, Isaaks und Israels,[a] damit er sich wieder dem Rest zuwendet, der euch aus der Gewalt der Könige von Assyrien entkommen und übrig geblieben ist.“[b]'
  to: 'Da zogen die Kuriere mit den Briefen aus der Hand des Königs und seiner Beamten durch ganz Israel und Juda. Nach dem Befehl des Königs verkündeten sie: „Ihr Söhne Israels, kehrt um zu Jahwe, dem Gott Abrahams, Isaaks und Israels,[a] damit er sich wieder dem Rest zuwendet, der der Gewalt der Könige von Assyrien entkommen ist und euch noch geblieben ist.“[b]'
  rationale: Die Revision beseitigt die deutsche Mehrdeutigkeit im letzten Relativsatz, indem sie „der Gewalt der Könige von Assyrien entkommen“ und „euch noch geblieben“ eindeutig dem Rest zuordnet. Die Fußnote bewahrt die mögliche, stärker wörtliche Wiedergabe von וְיָשֹׁב („zurückkehrt“), während der Haupttext die im Deutschen natürliche Bedeutung der erneuten göttlichen Zuwendung ausdrückt. Der Gottesname und die nicht harmonisierte Lesart „Israel“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den königlichen Versand der Schreiben, die umfassende Adressierung an Israel und Juda, den Gottesnamen sowie die auffällige Namensfolge „Abraham, Isaak und Israel“ grundsätzlich treffend wieder. Im Schlussteil ist jedoch die Zuordnung von „entkommen“ und „euch geblieben“ im Deutschen nicht klar genug: Der Rest ist der Gewalt der assyrischen Könige entkommen und den Angeredeten geblieben, nicht ihnen entkommen.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Der euch aus der Gewalt ... entkommen und übrig geblieben ist“ ist jedoch syntaktisch mehrdeutig und legt nahe, der Rest sei den Angeredeten entkommen. Die Auflösung in zwei klar zugeordnete Prädikate ist natürlich und präzise.
  terminology: „Jahwe“, „Kuriere“, „Briefe“ und „Rest“ sind angemessen. „Beamten“ ist für שָׂרָיו im administrativen Zusammenhang präziser und im heutigen Deutsch idiomatischer als „führenden Männer“.
  issues:
  - severity: medium
    issue: Mehrdeutige Zuordnung im Schlussteil
    rationale: 'In „der euch aus der Gewalt der Könige von Assyrien entkommen und übrig geblieben ist“ kann „euch entkommen“ verstanden werden. Das Hebräische unterscheidet klar: Der Rest ist „der Hand der Könige von Assyrien“ entkommen und „euch“ verblieben. Die deutsche Fassung muss dies explizit machen.'
  - severity: low
    issue: Wiedergabe von שָׂרָיו
    rationale: „Führende Männer“ ist möglich, aber weniger präzise als „Beamte“ für die hochrangigen königlichen Amtsträger im Kontext der amtlichen Schreiben.
  revised_text: 'Da zogen die Kuriere mit den Briefen aus der Hand des Königs und seiner Beamten durch ganz Israel und Juda. Nach dem Befehl des Königs verkündeten sie: „Ihr Söhne Israels, kehrt um zu Jahwe, dem Gott Abrahams, Isaaks und Israels,[a] damit er sich wieder dem Rest zuwendet, der der Gewalt der Könige von Assyrien entkommen ist und euch noch geblieben ist.“[b]'
