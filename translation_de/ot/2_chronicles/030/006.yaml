source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: de
  text: 'Da zogen die Kuriere mit den Briefen aus der Hand des Königs und seiner Beamten durch ganz Israel und Juda. Nach dem Befehl des Königs verkündeten sie: „Ihr Söhne Israels, kehrt um zu Jahwe, dem Gott Abrahams, Isaaks und Israels,[a] damit er sich wieder dem Rest zuwendet, der der Gewalt der Könige von Assyrien entkommen ist und euch noch geblieben ist.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier „Israel“, nicht das in dieser Namensreihe vertrautere „Jakob“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „damit er zu dem Rest zurückkehrt, der der Gewalt der Könige von Assyrien entkommen ist und euch noch geblieben ist“.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: הָרָצִים
  choice: die Kuriere
  rationale: Wörtlich sind es „Läufer“; im Zusammenhang königlicher Schreiben bezeichnet das Wort amtliche Boten. „Kuriere“ ist dafür im modernen Deutschen präzise und natürlich.
- source_word: בָּאִגְּרוֹת
  choice: mit den Briefen
  rationale: Die Präposition wird instrumental beziehungsweise begleitend verstanden; אִגְּרוֹת sind schriftliche Briefe oder Erlasse.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: aus der Hand des Königs und seiner führenden Männer
  rationale: „Aus der Hand“ bewahrt das anschauliche hebräische Bild unmittelbarer Autorisierung. שָׂרִים bezeichnet hier hochgestellte Amtsträger; „führende Männer“ ist weniger modern-bürokratisch als „Beamte“ und weiter als „Fürsten“.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: durch ganz Israel und Juda
  rationale: „Durch“ bringt die Bewegung der Kuriere im gesamten Gebiet natürlich zum Ausdruck.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: Nach dem Befehl des Königs
  rationale: מִצְוָה bezeichnet hier einen königlichen Auftrag oder Befehl, nicht eigens ein göttliches Gebot.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Ihr Söhne Israels
  rationale: Die direkte Anrede und die männliche Pluralform des Hebräischen werden bewahrt. Das einleitende „Ihr“ macht die Anrede im Deutschen natürlich.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: kehrt um zu Jahwe
  rationale: שׁוּב bezeichnet hier die geistliche und bundesbezogene Umkehr zu Gott. „Umkehren“ ist im Deutschen dafür idiomatischer als das räumlich klingende „zurückkehren“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: dem Gott Abrahams, Isaaks und Israels
  rationale: Der Text nennt ausdrücklich „Israel“, nicht „Jakob“; die vertrautere Formel wird daher nicht harmonisierend eingesetzt.
- source_word: וְיָשֹׁב אֶל
  choice: damit er sich wieder ... zuwendet
  rationale: Das Verb nimmt שׁוּבוּ auf und kann Folge oder Zweck ausdrücken. Da eine wörtliche Wiederholung von „umkehren“ für Gottes Hinwendung im Deutschen missverständlich wäre, gibt „sich wieder zuwenden“ die reziproke Bewegung natürlich wieder.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: dem Rest, der euch ... entkommen und übrig geblieben ist
  rationale: 'Die Formulierung bewahrt beide Aussagen: Es handelt sich um Entkommene (פלט), die als Rest verblieben sind (שׁאר). לָכֶם wird mit „euch“ wiedergegeben.'
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: aus der Gewalt der Könige von Assyrien
  rationale: כַּף („Handfläche/Hand“) ist hier ein Bild für Macht oder Gewalt. Die idiomatische deutsche Wiedergabe macht den Sinn klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen. „Jahwe“ wahrt diese personale und bundesbezogene Benennung, statt sie durch einen Titel zu ersetzen.
- issue: Patriarchenname in אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Gott Abrahams, Isaaks und Israels
  alternative: Gott Abrahams, Isaaks und Jakobs
  rationale: Obwohl „Jakob“ in der geläufigen Formel zu erwarten wäre, steht hier ausdrücklich „Israel“. Diese auffällige Lesart wird bewahrt.
- issue: Beziehung zwischen menschlicher Umkehr und Gottes erneuter Zuwendung
  choice: „kehrt um ... damit er sich wieder ... zuwendet“
  alternative: „kehrt um ... und er wird sich wieder ... zuwenden“
  rationale: Die Verbfolge lässt eine finale beziehungsweise resultative Beziehung zu, ohne eine mechanische Garantie auszusprechen. „Damit“ erhält diese Offenheit und die reziproke Wortbewegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die königliche Botenformel bleibt leicht feierlich, ohne altertümliche Amts- oder Kirchensprache. Die direkte Rede ist klar und eindringlich; auffällige Wiederholungen und Mehrdeutigkeiten des Hebräischen werden soweit möglich bewahrt oder in Fußnoten ausgewiesen.
