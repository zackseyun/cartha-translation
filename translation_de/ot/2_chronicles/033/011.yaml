  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: de
  text: Da brachte Jahwe die Heerführer des Königs von Assyrien gegen sie. Sie nahmen Manasse mit Haken[a] gefangen, legten ihn in bronzene Fesseln und führten ihn nach Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Haken“. Das hebräische Wort kann Haken oder Dornen bezeichnen; möglicherweise ist allgemeiner ein Zwangsmittel für Gefangene gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: brachte ... gegen sie
  rationale: Der Hifil von בוא drückt hier aus, dass Jahwe die assyrischen Heerführer zum feindlichen Vorgehen heranbrachte; „gegen sie“ gibt den militärischen Sinn von עַל natürlich wieder.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: die Heerführer des Königs von Assyrien
  rationale: Die Formulierung gibt sowohl die militärische Leitungsfunktion als auch ihre Zugehörigkeit zum assyrischen König knapp und verständlich wieder.
- source_word: וַיִּלְכְּדוּ אֶת מְנַשֶּׁה
  choice: Sie nahmen Manasse ... gefangen
  rationale: לכד bezeichnet im militärischen Zusammenhang das Ergreifen oder Gefangennehmen.
- source_word: בַּחֹחִים
  choice: mit Haken
  rationale: חֹחִים kann Haken oder Dornen bezeichnen; im Zusammenhang mit einem Gefangenen bewahrt „mit Haken“ das konkrete, harte Bild des hebräischen Textes.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: legten ihn in bronzene Fesseln
  rationale: Die Wendung bezeichnet das Binden mit metallenen Zwangsmitteln; „bronzene Fesseln“ ist präzise und im Deutschen natürlicher als eine Festlegung auf Ketten.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: führten ihn nach Babylon
  rationale: Der Hifil von הלך bezeichnet das Führen beziehungsweise Wegbringen; das Richtungs-He wird mit „nach Babylon“ wiedergegeben.
theological_decisions:
- issue: Göttliches Handeln beim assyrischen Angriff
  choice: Jahwe brachte die assyrischen Heerführer gegen sie.
  alternative: Jahwe ließ zu, dass die assyrischen Heerführer gegen sie vorgingen.
  rationale: Der Hifil von בוא schreibt Jahwe das Heranbringen unmittelbar zu. Die Übersetzung schwächt diese Aussage göttlichen Gerichts nicht zu einem bloßen Zulassen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Abfolge kurzer Hauptsätze wahrt den erzählerischen Nachdruck des Hebräischen. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung „mit Haken“.
