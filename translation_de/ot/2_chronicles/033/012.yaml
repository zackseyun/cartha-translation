  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: de
  text: Als er in Bedrängnis war, suchte er die Gunst Jahwes, seines Gottes,[a] und demütigte sich tief vor dem Gott seiner Väter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „flehte Jahwe, seinen Gott, an“ oder „bat Jahwe, seinen Gott, inständig“; die hebräische Wendung lautet wörtlich etwa „besänftigte das Angesicht von“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „der Gott seiner Väter“; möglich ist auch „der Gott seiner Vorfahren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Als er in Bedrängnis war
  rationale: Die Konstruktion bezeichnet den zeitlichen Umstand; die Form von צר vermittelt Bedrängnis beziehungsweise Not. Die gewählte Fassung ist natürlich und bewahrt die leidvolle Erfahrungsdimension.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: suchte er die Gunst
  rationale: Die hebräische Wendung bedeutet, jemanden anzuflehen beziehungsweise dessen Gunst zu suchen. „Die Gunst suchen“ gibt das bildhafte Beziehungsmoment verständlich wieder, ohne die Wendung wörtlich zu überladen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: 'Das Suffix bezeichnet die Zugehörigkeit: Jahwe ist sein Gott. Der Genitiv fügt sich im Deutschen natürlich an den Gottesnamen an.'
- source_word: וַיִּכָּנַע
  choice: und demütigte sich
  rationale: Der Nifal kann hier im Zusammenhang mit Manasses Reaktion reflexiv verstanden werden. Die Wiedergabe bewahrt den Buß- und Unterwerfungsaspekt.
- source_word: מְאֹד
  choice: tief
  rationale: מְאֹד verstärkt das Verb. Beim deutschen „sich demütigen“ ist „tief“ idiomatischer als „sehr“ und drückt den hohen Grad prägnant aus.
- source_word: מִלִּפְנֵי
  choice: vor
  rationale: Die wörtlich gesichtsbezogene Präposition wird in diesem Zusammenhang idiomatisch mit „vor“, also in der Gegenwart von, wiedergegeben.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: dem Gott seiner Väter
  rationale: Die Wiedergabe erhält die ausdrücklich maskuline und heilsgeschichtlich geprägte Formulierung des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חִלָּה אֶת־פְּנֵי
  choice: suchte die Gunst
  alternative: flehte an
  rationale: Beide Wiedergaben sind lexikalisch möglich. Der Haupttext erhält mit „Gunst suchen“ den relationalen Gehalt des hebräischen Idioms; die stärker gebetsbezogene Alternative wird in der Fußnote genannt.
- issue: Diathese von וַיִּכָּנַע
  choice: demütigte sich
  alternative: wurde gedemütigt
  rationale: Der Kontext beschreibt Manasses Reaktion in der Not und stützt die reflexive Lesart. Die Form lässt sprachlich auch eine passive Wiedergabe zu, doch diese ist hier weniger wahrscheinlich.
- issue: Geschlechtsspezifische Ahnensprache in אֱלֹהֵי אֲבֹתָיו
  choice: Gott seiner Väter
  alternative: Gott seiner Vorfahren
  rationale: „Väter“ bildet die maskuline Form des Ausgangstextes und die traditionelle bundesgeschichtliche Wendung genauer ab; „Vorfahren“ ist als umfassendere deutsche Wiedergabe möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ablauf, während hebräische Idiome verständlich wiedergegeben werden. „Jahwe“ erhält den persönlichen Gottesnamen; „Väter“ bewahrt die konkrete Form des Ausgangstextes.
