  text: Seine Diener verschworen sich gegen ihn und töteten ihn in seinem eigenen Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: verschworen sich gegen ihn
  rationale: Die Verbindung קשר על bezeichnet hier eine gegen jemanden gerichtete Verschwörung, besonders im Zusammenhang mit einem Anschlag auf einen König. Die deutsche Wendung ist idiomatisch und bewahrt den politischen und feindseligen Sinn.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד kann am Königshof Diener oder Amtsträger bezeichnen. „Diener“ gibt den Ausdruck direkt wieder, ohne ihren Rang oder Rechtsstatus über den Text hinaus festzulegen.
- source_word: וַיְמִיתֻהוּ
  choice: töteten ihn
  rationale: Die Hifil-Form von מות bedeutet, jemanden zu Tode zu bringen. „Töteten ihn“ gibt die vollzogene Tötung im Deutschen klar, würdig und natürlich wieder.
- source_word: בְּבֵיתוֹ
  choice: in seinem eigenen Haus
  rationale: ב bezeichnet den Ort, und das Suffix verweist auf sein Haus. „Seinem eigenen Haus“ hebt im Deutschen auf natürliche Weise hervor, dass die Tat in seinem persönlichen Wohnbereich geschah.
