  variant: modern standard German
source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: de
  text: Dann setzte er den Altar Jahwes wieder instand und brachte darauf Heilsopfer[a] und Dankopfer[b] dar. Er forderte Juda auf, Jahwe, dem Gott Israels, zu dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Gemeinschaftsopfer“; traditionell auch „Friedensopfer“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „Dank“; im Opferzusammenhang ist ein Dankopfer gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֵן
  choice: setzte … wieder instand
  rationale: Das Hifil von כון bezeichnet hier im Zusammenhang die Wiederherstellung des zuvor entweihten Altars. Die Formulierung gibt den Kontext deutlicher wieder als ein bloßes „richtete her“.
- source_word: מִזְבַּח יְהוָה
  choice: den Altar Jahwes
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich mit Genitiv wiedergegeben; der Gottesname wird als „Jahwe“ bewahrt.
- source_word: וַיִּזְבַּח עָלָיו
  choice: brachte darauf … dar
  rationale: Die deutsche Opferterminologie „Opfer darbringen“ gibt זבח idiomatisch wieder; „darauf“ bezieht sich eindeutig auf den Altar.
- source_word: זִבְחֵי שְׁלָמִים
  choice: Heilsopfer
  rationale: „Heilsopfer“ ist eine etablierte deutsche Wiedergabe dieser Opfergattung. Eine Fußnote bewahrt die ebenfalls mögliche Bezeichnung „Gemeinschaftsopfer“.
- source_word: וְתוֹדָה
  choice: und Dankopfer
  rationale: תודה bedeutet „Dank“ und kann im Opferkontext ein Dankopfer bezeichnen. Die konkrete Wiedergabe passt zum regierenden Opferverb, ohne den Danksinn zu verlieren.
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Er forderte Juda auf
  rationale: Wörtlich steht „er sagte zu Juda“; zusammen mit dem Infinitiv gibt „forderte … auf“ die idiomatische Funktion im modernen Deutsch wieder, ohne die Aussage unnötig zu einem ausdrücklichen Befehl zu verschärfen.
- source_word: לַעֲבוֹד
  choice: zu dienen
  rationale: עבד umfasst im Verhältnis zu Gott Gottesdienst und umfassenderen Dienst. „Dienen“ erhält diese Bedeutungsbreite besser als das engere „anbeten“.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Apposition wird transparent und idiomatisch wiedergegeben und bewahrt die Bundesbezeichnung Gottes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen. So bleibt der im hebräischen Text ausdrücklich verwendete Bundesname sichtbar.
- issue: Bedeutungsumfang von עבד im Verhältnis zu Gott
  choice: dienen
  alternative: anbeten
  rationale: „Dienen“ bewahrt sowohl den kultischen als auch den umfassenderen bundestreuen Sinn und legt den Ausdruck nicht ausschließlich auf Anbetung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und zugänglich; etablierte Opferbegriffe werden verwendet und weniger eindeutige Alternativen in Fußnoten offengehalten.
