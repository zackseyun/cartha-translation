base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: de
  text: Und Manasse legte sich zu seinen Vätern, und man begrub ihn in seinem Haus[a]. Sein Sohn Amon wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Palast“. Das hebräische Wort bedeutet „Haus“, kann im königlichen Zusammenhang aber auch den Palast oder die Palastanlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die traditionelle hebräische Todesformel und ihr Bild werden bewahrt; die Wendung bezeichnet Manasses Tod, ohne ihn auf das schlichte Verb „sterben“ zu reduzieren.
- source_word: וַיִּקְבְּרֻהוּ
  choice: man begrub ihn
  rationale: Das unbestimmte deutsche „man“ gibt die aktive Pluralform natürlich wieder, ohne nicht genannte Handelnde zu ergänzen.
- source_word: בֵּיתוֹ
  choice: in seinem Haus
  rationale: „Haus“ entspricht dem Grundsinn des hebräischen Wortes; im königlichen Zusammenhang kann damit auch der Palast oder die Palastanlage gemeint sein.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Nachfolgeformel bezeichnet das Verb Amons Herrschaftsantritt; diese Formulierung ist im heutigen Deutsch natürlicher als „regierte“ und vermeidet die mögliche Lesart, seine gesamte Regierungszeit sei gemeint.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung gibt die dynastische Nachfolge präzise und idiomatisch wieder.
