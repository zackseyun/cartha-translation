  to: Er betete zu ihm, und er ließ sich von ihm anflehen[a], hörte sein Flehen und brachte ihn nach Jerusalem und in seine Königsherrschaft zurück[b]. Da erkannte Manasse, dass Jahwe Gott ist.
  rationale: Die Revision ersetzt eine im modernen Standarddeutsch wenig natürliche Wendung durch „ließ sich von ihm anflehen“. Damit bleibt die nicht näher spezifizierte günstige Reaktion Gottes erhalten, ohne sie auf „erhörte“ zu verkürzen oder ein inneres Bewegtsein als Hauptaussage festzulegen. Die koordinierte Rückkehrformulierung verdeutlicht die im Hebräischen nebeneinandergestellten Angaben Jerusalem und Königsherrschaft.
