  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: de
  text: Er betete zu ihm, und er ließ sich von ihm anflehen[a], hörte sein Flehen und brachte ihn nach Jerusalem und in seine Königsherrschaft zurück[b]. Da erkannte Manasse, dass Jahwe Gott ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er ließ sich durch sein Flehen bewegen“ beziehungsweise „er ging gnädig auf seine Bitte ein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu seiner Königsherrschaft“; gemeint ist seine Wiedereinsetzung in die königliche Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Er betete zu ihm
  rationale: Das Hitpael von פלל bedeutet hier gewöhnlich „beten“. Die persönliche Ausrichtung auf Gott wird entsprechend der hebräischen Konstruktion beibehalten.
- source_word: וַיֵּעָתֶר לוֹ
  choice: er ließ sich von ihm erbitten
  rationale: Das Nifal von עתר bezeichnet, dass jemand sich erbitten lässt beziehungsweise auf eine Bitte gnädig eingeht. Die gewählte Formulierung bewahrt die passive Gestalt und die günstige göttliche Reaktion, ohne ein bestimmtes inneres Gefühl Gottes einzutragen.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: hörte sein Flehen
  rationale: תחנה bezeichnet eine inständige Bitte um Gnade oder Erhörung. „Flehen“ ist im modernen Deutschen verständlich und wahrt den ernsten Gebetscharakter.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: brachte ihn nach Jerusalem in seine Königsherrschaft zurück
  rationale: Das Hifil von שוב bedeutet „zurückbringen“. מלכות kann Königreich, Königtum oder Herrschaft bezeichnen; im Kontext geht es um Manasses Wiederherstellung in seine königliche Herrschaft.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Da erkannte Manasse
  rationale: ידע bedeutet „wissen/erkennen“. „Da erkannte“ gibt den narrativen Zusammenhang als Folge der erfahrenen Erhörung natürlich wieder.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: dass Jahwe Gott ist
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Das hervorgehobene הוּא wird im Deutschen idiomatisch durch die prädikative Aussage vermittelt; „allein“ wird nicht ergänzt, da es nicht ausdrücklich im hebräischen Text steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Eigenname wird erkennbar als Gottesname wiedergegeben. „Jahwe“ entspricht der üblichen wissenschaftlichen Rekonstruktion und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Aussage כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: dass Jahwe Gott ist
  alternative: dass Jahwe allein Gott ist
  rationale: Die Formulierung bewahrt das nachdrückliche Bekenntnis, fügt aber das im Hebräischen nicht ausdrücklich vorhandene „allein“ nicht hinzu und löst die theologische Reichweite daher nicht stillschweigend auf.
- issue: Gottes Reaktion in וַיֵּעָתֶר לוֹ
  choice: er ließ sich von ihm erbitten
  alternative: er ließ sich durch sein Flehen bewegen / er erhörte ihn
  rationale: Die gewählte Lesart wahrt die grammatische Passivform und bezeichnet eine günstige Antwort, ohne Gott ausdrücklich eine emotionale Veränderung zuzuschreiben oder die Aussage mit dem folgenden „hörte“ vollständig gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der drei göttlichen Reaktionen folgt dem knappen Erzählfluss des Hebräischen. „Königsherrschaft“ ist präziser als „Königreich“, weil der Kontext die Wiederherstellung Manasses als regierenden König bezeichnet.
