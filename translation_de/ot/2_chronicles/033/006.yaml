revisions:
- from: Er ließ seine Söhne im Tal Ben-Hinnom durchs Feuer gehen[a]. Er betrieb Zeichendeutung, Wahrsagerei und Zauberei und befasste sich mit Totenbeschwörern und Geisterkundigen[b]. Er tat sehr viel, was böse war in den Augen Jahwes, und reizte ihn damit zum Zorn.
  to: Er ließ seine Söhne im Tal Ben-Hinnom durchs Feuer gehen[a]. Er betrieb Zeichendeutung, Wahrsagerei und Zauberei und befasste sich mit Medien und Geisterbeschwörern[b]. Er tat sehr viel Böses in den Augen Jahwes und reizte ihn damit zum Zorn.
  rationale: Die Revision ersetzt den unidiomatischen Ausdruck „Geisterkundige“ durch die im Deutschen verständlichere, weiterhin vorsichtige Formulierung „Medien und Geisterbeschwörer“. Außerdem wird die abschließende Bewertung mit „Er tat sehr viel Böses“ gestrafft. Die hebräische Mehrdeutigkeit des schwierigen Ausdrucks mit אוֹב und יִדְּעוֹנִי bleibt sowohl im Haupttext als auch in der Fußnote gewahrt.
