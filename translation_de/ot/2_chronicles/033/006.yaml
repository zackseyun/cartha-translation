source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: de
  text: Er ließ seine Söhne im Tal Ben-Hinnom durchs Feuer gehen[a]. Er betrieb Zeichendeutung, Wahrsagerei und Zauberei und befasste sich mit Medien und Geisterbeschwörern[b]. Er tat sehr viel Böses in den Augen Jahwes und reizte ihn damit zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: „Er opferte seine Söhne im Feuer.“ Wörtlich heißt es: „Er ließ seine Söhne durchs Feuer gehen.“'
    reason: lexical_alternative
  - marker: b
    text: Die beiden hebräischen Begriffe bezeichnen Personen oder Praktiken im Zusammenhang mit der Befragung von Toten oder Geistern.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: ließ seine Söhne durchs Feuer gehen
  rationale: Bewahrt die hebräische Wendung und damit ihre sprachliche Zurückhaltung; im Zusammenhang bezeichnet sie einen mit Kinderopfern verbundenen Ritus, was die Fußnote erläutert.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: im Tal Ben-Hinnom
  rationale: Behandelt den Ausdruck als Ortsnamen und bewahrt Hinnom in transliterierter Form; das deutsche „Ben-Hinnom“ ist knapper und geläufiger als eine vollständige Auflösung zu „Sohn Hinnoms“.
- source_word: וְעוֹנֵן
  choice: betrieb Zeichendeutung
  rationale: Gibt das Deuten von Zeichen oder Vorzeichen wieder und hält den Ausdruck von dem folgenden נחשׁ unterscheidbar.
- source_word: וְנִחֵשׁ
  choice: Wahrsagerei
  rationale: Bezeichnet eine divinatorische Praxis in natürlichem modernem Deutsch, ohne sie mit Zauberei gleichzusetzen.
- source_word: וְכִשֵּׁף
  choice: Zauberei
  rationale: Gibt magische beziehungsweise bannende Praktiken knapp und würdig wieder.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: befasste sich mit Totenbeschwörern und Geisterkundigen
  rationale: Das schwierige „machte/tat ʾov und yiddeʿoni“ wird bewusst weit wiedergegeben, sodass weder ausschließlich eigenes Praktizieren noch ausschließlich Konsultieren behauptet wird. Die Personenbezeichnungen erschließen den nekromantischen Zusammenhang.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: tat sehr viel
  rationale: Gibt die verstärkende Konstruktion aus רבה im Hifil und Infinitiv in natürlichem Deutsch wieder, ohne die unidiomatische Formulierung „vermehrte es zu tun“.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: was böse war in den Augen Jahwes
  rationale: Bewahrt die hebräische Bewertungsformel nahezu formal und gibt den Gottesnamen direkt wieder.
- source_word: לְהַכְעִיסוֹ
  choice: reizte ihn damit zum Zorn
  rationale: Gibt die kausative Bedeutung sowie den Zweck- oder Ergebnisbezug verständlich wieder; „damit“ bindet den Ausdruck an die zuvor genannten Taten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Ausdrücklichkeit des mit הֶעֱבִיר ... בָּאֵשׁ bezeichneten Ritus
  choice: Die Wendung „ließ seine Söhne durchs Feuer gehen“ bleibt im Haupttext erhalten.
  alternative: Er opferte seine Söhne im Feuer.
  rationale: Der Zusammenhang weist stark auf Kinderopfer hin, doch die Bildsprache des hebräischen Wortlauts bleibt erhalten; die explizitere Deutung steht in der Fußnote.
- issue: Bedeutung von אוֹב und יִדְּעוֹנִי
  choice: Totenbeschwörer und Geisterkundige
  alternative: Geisterbeschwörer und Wahrsager
  rationale: Die gewählte Fassung macht den Bezug zur Befragung von Toten oder Geistern sichtbar, ohne eine präzise Differenz zwischen den beiden alten Fachbegriffen vorzutäuschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultisch-okkulten Fachausdrücke bleiben voneinander unterscheidbar. Der erste Satz bewahrt die konkrete hebräische Wendung; schwierige antike Begriffe werden knapp in Fußnoten erläutert.
