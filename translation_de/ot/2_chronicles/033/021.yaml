lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: war zweiundzwanzig Jahre alt
  rationale: Die hebräische Altersangabe lautet wörtlich „ein Sohn von zweiundzwanzig Jahren“. Die natürliche deutsche Entsprechung ist „war zweiundzwanzig Jahre alt“.
- source_word: אָמֹון
  choice: Amon
  rationale: Der Personenname wird gemäß üblicher deutscher Bibeltradition transliteriert.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition ב mit dem Infinitiv von מלך bezeichnet hier den Zeitpunkt des Regierungsantritts. „Als er König wurde“ gibt dies natürlich und genau wieder.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: zwei Jahre
  rationale: Die Verbindung aus Zahlwort und Substantiv bezeichnet die Dauer seiner Herrschaft.
- source_word: מָלַךְ
  choice: er regierte
  rationale: Das Verb מלך bezeichnet hier die Ausübung der Königsherrschaft über einen bestimmten Zeitraum.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב ist lokal gebraucht und nennt Jerusalem als Ort beziehungsweise Regierungssitz.
