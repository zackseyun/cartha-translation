base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: de
  text: Er tat, was böse war in den Augen Jahwes, genauso wie sein Vater Manasse es getan hatte. Amon opferte allen geschnitzten Götzenbildern[a], die sein Vater Manasse angefertigt hatte, und diente ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kultbilder“. Das hebräische Wort bezeichnet insbesondere geschnitzte oder gehauene Bilder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verehrte sie“. Das hebräische Verb bedeutet wörtlich „dienen“ und wird häufig für religiösen Dienst gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die hebräische Wendung bezeichnet ein als böse bewertetes Handeln. Diese Formulierung ist im modernen Deutsch natürlich und bewahrt die wertende Aussage.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die bildhafte hebräische Wendung für Gottes Urteil lässt sich im Deutschen klar und würdig wörtlich wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: genauso wie ... es getan hatte
  rationale: Die Formulierung bringt den Vergleich und die zeitliche Vorordnung von Manasses Handeln natürlich zum Ausdruck.
- source_word: מְנַשֶּׁה אָבִיו
  choice: sein Vater Manasse
  rationale: Diese deutsche Wortstellung gibt die Beziehung eindeutig und flüssig wieder.
- source_word: הַפְּסִילִים
  choice: Schnitzbilder
  rationale: Das Substantiv bezeichnet konkret geschnitzte oder gemeißelte Kultbilder. „Schnitzbilder“ bewahrt diesen konkreten Sinn besser als das allgemeinere „Götzenbilder“.
- source_word: זִבַּח
  choice: opferte ...
  rationale: Im kultischen Zusammenhang bezeichnet das Verb das Darbringen von Schlachtopfern; der Dativ gibt den Empfänger im Deutschen idiomatisch wieder.
- source_word: וַיַּעַבְדֵם
  choice: und diente ihnen
  rationale: Die Wiedergabe bewahrt den Grundsinn von עבד; im Zusammenhang mit Kultbildern ist religiöse Verehrung klar mitgemeint, ohne sie lexikalisch vorwegzunehmen.
- source_word: אָמֹון
  choice: Amon
  rationale: Der Personenname wird nach geläufiger deutscher Konvention transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Funktion, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Zusammenhang mit Götterbildern
  choice: diente ihnen
  alternative: verehrte sie
  rationale: „Diente“ bleibt näher am Grundsinn des Verbs und bewahrt dessen Bedeutungsbreite; die kultische Verehrung ergibt sich aus dem Zusammenhang.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die konkrete Bildsprache des Hebräischen und die kultische Mehrdeutigkeit von עבד bleiben erhalten.
