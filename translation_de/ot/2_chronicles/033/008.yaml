  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: de
  text: Und ich werde Israel[a] nicht mehr aus dem Land entfernen, das ich euren Vorfahren zugewiesen habe – wenn sie nur sorgfältig alles tun, was ich ihnen geboten habe, gemäß dem ganzen Gesetz, den Satzungen und den Rechtsbestimmungen, die ich durch Mose übermittelt habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Fuß Israels“; gemeint ist Israels Anwesenheit im Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand Moses“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: nicht mehr … vertreiben
  rationale: Die Verbindung aus יסף und הסיר bezeichnet hier, dass Gott Israel künftig nicht erneut aus dem Land entfernen wird. „Nicht mehr vertreiben“ gibt dies im Deutschen natürlich wieder.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: Israel
  rationale: Wörtlich steht „der Fuß Israels“, ein konkretes Bild für Israels Anwesenheit im Land. Im Haupttext wird der idiomatische Sinn wiedergegeben; die Bildsprache bleibt in Fußnote [a] sichtbar.
- source_word: מֵעַל הָאֲדָמָה
  choice: aus dem Land
  rationale: מֵעַל bezeichnet das Entfernen von der Oberfläche beziehungsweise aus dem Bereich des Landes. „Aus dem Land“ entspricht dem Zusammenhang der Landverheißung und klingt im Deutschen natürlich.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: das ich euren Vorfahren zugewiesen habe
  rationale: Das Hifil von עמד drückt hier aus, dass Gott das Land für die Vorfahren bestimmt beziehungsweise bereitgestellt hat. „Zugewiesen“ wahrt die göttliche Bestimmung, ohne die hebräische Konstruktion hölzern nachzubilden.
- source_word: רַק אִם
  choice: wenn sie nur
  rationale: Die Wendung führt eine nachdrückliche, echte Bedingung ein. „Wenn sie nur“ bewahrt sowohl den konditionalen als auch den einschränkenden Ton.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: sorgfältig alles tun
  rationale: שמר mit folgendem Infinitiv bezeichnet achtsames Befolgen. „Sorgfältig … tun“ vermittelt mehr als bloßes Wissen oder formales Bewahren.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: alles tun, was ich ihnen geboten habe
  rationale: Die Gesamtheit des göttlichen Gebots und das pronominale Objekt „ihnen“ werden ausdrücklich erhalten.
- source_word: לְכָל הַתּוֹרָה
  choice: nach dem ganzen Gesetz
  rationale: תורה kann „Weisung“ heißen; in der Aufzählung mit Satzungen und Rechtsbestimmungen ist „Gesetz“ jedoch die klare, kontextgerechte Wiedergabe. „Nach“ gibt die Beziehung des Präfixes ל zur gebotenen Befolgung wieder.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: „Satzungen“ ist eine verständliche rechtliche Bezeichnung und hält den Ausdruck von den benachbarten Rechtsbestimmungen unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Der Ausdruck hat einen deutlich rechtlich-richterlichen Gehalt. „Rechtsbestimmungen“ ist für heutige Leser transparenter als das formnahe „Gerichte“.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose übermittelt
  rationale: Die Wendung bedeutet wörtlich „durch die Hand Moses“ und bezeichnet Mose als Mittler. „Durch Mose übermittelt“ gibt diese Funktion in modernem Deutsch klar wieder.
theological_decisions:
- issue: Bedingtheit von Israels Verbleib im Land
  choice: Die Zusage, Israel nicht erneut aus dem Land zu vertreiben, wird ausdrücklich an sorgfältigen Gehorsam gebunden.
  alternative: Eine uneingeschränkte Zusage dauerhaften Landbesitzes oder eine nur rhetorische, nicht wirkliche Bedingung.
  rationale: רַק אִם leitet grammatisch eine echte und nachdrückliche Bedingung ein. Die Übersetzung bewahrt diese Spannung, ohne weitergehende Lehrfragen zur Dauer oder Gestalt der Bundesverheißungen zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext gibt hebräische Idiome verständlich wieder, während die Fußnoten die konkrete Bildsprache und die Formulierung zur Vermittlung durch Mose dokumentieren. Der Gedankenstrich macht die nachdrückliche Bedingung deutlich, ohne sie vom Versprechen zu lösen.
