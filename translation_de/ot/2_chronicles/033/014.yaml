  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: de
  text: Danach baute er eine äußere Mauer für die Davidstadt, westlich des Gihon im Tal bis zum Eingang des Fischtors. Er zog um den Ofel[a] herum und machte sie sehr hoch. Außerdem setzte er in allen befestigten Städten Judas Heerführer ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Ofel ist ein Gebiet in Jerusalem, wahrscheinlich die Anhöhe südlich des Tempelbergs. Wörtlich: „und er zog um den Ofel herum“; die Aussage kann sich auf den Verlauf der Mauer beziehen.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Gibt die zeitliche Erzählfolge knapp und natürlich wieder.
- source_word: בָּנָה
  choice: baute
  rationale: Der Grundsinn ist „bauen“; eine Wiederherstellung oder ein Wiederaufbau wird vom Verb nicht ausdrücklich bezeichnet.
- source_word: חוֹמָה חִיצוֹנָה
  choice: eine äußere Mauer
  rationale: Bewahrt die Unterscheidung einer außen gelegenen Mauer in natürlichem Deutsch.
- source_word: לְעִיר דָּוִיד
  choice: für die Davidstadt
  rationale: Das לְ wird auf den Zweck beziehungsweise die Zuordnung des Mauerbaus bezogen; „Davidstadt“ ist die geläufige deutsche Ortsbezeichnung.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: westlich vom Gihon im Tal
  rationale: Gibt Richtung beziehungsweise Lage und die topografische Angabe verständlich wieder, ohne נחל unnötig auf „Bachtal“ oder „Wadi“ festzulegen.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: bis zum Eingang des Fischtors
  rationale: Der Ausdruck bezeichnet hier plausibel die räumliche Ausdehnung bis zum Zugang des Tores.
- source_word: וְסָבַב לָעֹפֶל
  choice: Sie umschloss den Ofel
  rationale: Das feminine Pronomen nimmt die Mauer als sinngemäßes Subjekt auf; סבב kann ein Umgeben oder Umschließen bezeichnen.
- source_word: הָעֹפֶל
  choice: der Ofel
  rationale: Der Jerusalemer Ortsname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: er machte sie sehr hoch
  rationale: Das feminine Suffix verweist auf die Mauer; „sehr“ bewahrt die Verstärkung durch מְאֹד.
- source_word: שָׂרֵי חַיִל
  choice: Heerführer
  rationale: Bezeichnet militärische Befehlshaber und ist im Deutschen klar und würdig.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת בִּיהוּדָה
  choice: in allen befestigten Städten Judas
  rationale: Gibt die Verteilung über sämtliche befestigten Städte des Gebietes Juda präzise wieder.
