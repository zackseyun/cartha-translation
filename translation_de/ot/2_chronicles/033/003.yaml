base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: de
  text: Denn er baute die Kulthöhen wieder auf, die sein Vater Hiskia niedergerissen hatte.[a] Er errichtete Altäre für die Baale[b] und fertigte Aschera-Kultbilder an.[c] Er warf sich vor dem ganzen Heer des Himmels nieder[d] und diente ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er kehrte zurück und baute“; die hebräische Verbindung bedeutet hier, dass er wieder aufbaute, was beseitigt worden war.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat den Plural „die Baale“. Gemeint sein können verschiedene lokale Erscheinungsformen oder Kultbilder Baals.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ascheren“. Der hebräische Ausdruck bezeichnet Kultgegenstände oder Symbole, die mit der Göttin Aschera verbunden waren; ihre genaue Gestalt ist nicht sicher.'
    reason: lexical_alternative
  - marker: d
    text: Mit dem „Heer des Himmels“ sind hier die Himmelskörper als Gegenstände der Verehrung gemeint; vergleiche 2. Könige 21,3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: baute … wieder auf
  rationale: Die Verbindung aus שוב und בנה bezeichnet idiomatisch die Wiederherstellung dessen, was zuvor beseitigt worden war, und wird im Deutschen natürlich mit „wieder aufbauen“ wiedergegeben.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: במות bezeichnet hier nicht bloß erhöhte Orte, sondern Kultstätten. „Kulthöhen“ ist präzise, knapp und im modernen Deutschen verständlicher als das missverständliche „Höhen“.
- source_word: נִתַּץ
  choice: niedergerissen hatte
  rationale: Das Verb bezeichnet das gewaltsame Abbrechen oder Zerstören baulicher beziehungsweise kultischer Anlagen.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: sein Vater Hiskia
  rationale: Diese Wortstellung ist im Deutschen natürlich und gibt die hebräische verwandtschaftliche Bestimmung vollständig wieder.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: Er errichtete Altäre für die Baale
  rationale: „Errichten“ entspricht הקים bei Altären. Der Plural „Baale“ bewahrt den hebräischen Plural und damit den möglichen Bezug auf verschiedene lokale Erscheinungsformen oder Kultbilder Baals.
- source_word: אֲשֵׁרוֹת
  choice: Aschera-Kultbilder
  rationale: Der Plural kann Kultgegenstände beziehungsweise Symbole bezeichnen, die mit der Göttin Aschera verbunden waren. „Kultbilder“ vermeidet die zu enge Festlegung auf Pfähle, ohne den gegenständlichen Bezug zu verlieren.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: Die Wiedergabe bewahrt die körperliche Bedeutung des Verbs und unterscheidet sie vom nachfolgenden kultischen „dienen“.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: vor dem ganzen Heer des Himmels
  rationale: Die traditionelle Wendung bewahrt das Bild des hebräischen Ausdrucks; eine Fußnote erläutert, dass hier die Himmelskörper als Gegenstände der Verehrung gemeint sind.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: und diente ihm
  rationale: עבד bedeutet im kultischen Zusammenhang „dienen“ beziehungsweise „verehren“. Das deutsche Singularpronomen bezieht sich grammatisch auf das kollektive „Heer“, während das Hebräische mit einem Pluralpronomen auf dessen einzelne Bestandteile zurückverweist.
theological_decisions:
- issue: Wiedergabe heidnischer Kultbegriffe
  choice: Die konkreten Begriffe „Kulthöhen“, „Baale“ und „Aschera-Kultbilder“ bleiben erhalten.
  alternative: Verallgemeinerungen wie „Götzen“, „falsche Götter“ oder „Götzenbilder“.
  rationale: Der Vers nennt bestimmte Kultformen. Ihre konkrete Wiedergabe bewahrt die historische und religiöse Aussage, ohne sie durch eine theologische Zusammenfassung zu ersetzen.
- issue: Bedeutung von „Heer des Himmels“
  choice: Die bildhafte Formulierung wird im Text bewahrt und in der Fußnote auf die Himmelskörper bezogen.
  alternative: Eine Wiedergabe als Engelheer oder die direkte Übersetzung „alle Himmelskörper“.
  rationale: Im Zusammenhang mit unerlaubter Verehrung bezeichnet der Ausdruck am wahrscheinlichsten Sonne, Mond und Sterne. Die Textfassung bewahrt jedoch das hebräische Bild, während die Fußnote das kontextuelle Verständnis erläutert.
- issue: Numerus beim Rückverweis auf das Himmelsheer
  choice: Das grammatisch deutsche Singularpronomen „ihm“ steht bei dem Kollektiv „Heer“.
  alternative: „ihnen“, mit sinngemäßem Bezug auf die einzelnen Himmelskörper.
  rationale: Im Hebräischen steht ein Pluralpronomen, da das Kollektiv semantisch aus vielen Gliedern besteht. Im Deutschen ist „dem Heer … ihm dienen“ grammatisch natürlicher; die kollektive Vielheit bleibt durch „ganzes Heer“ und die Fußnote erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ und „Aschera-Kultbilder“ machen die kultische Bedeutung für heutige Leser verständlich, ohne die konkreten historischen Begriffe zu verallgemeinern. Die Satzfolge folgt der hebräischen Aufzählung und bewahrt die Unterscheidung zwischen Niederwerfen und Dienen.
