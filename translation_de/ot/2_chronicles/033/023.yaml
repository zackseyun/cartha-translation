source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: de
  text: Aber er demütigte sich nicht vor Jahwe, wie sein Vater Manasse sich gedemütigt hatte[a]; denn er, Amon, häufte Schuld an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklich: „wie sein Vater Manasse sich vor Jahwe gedemütigt hatte“.'
    reason: Das im Vergleich ausgelassene Satzglied „vor Jahwe“ kann im Deutschen ausdrücklich wiederholt werden; inhaltlich bleibt der Bezug derselbe.
lexical_decisions:
- source_word: נִכְנַע
  choice: demütigte sich
  rationale: Das Nifal von כנע hat hier reflexiven Sinn und bezeichnet Amons Weigerung, sich vor Gott zu erniedrigen. „Sich demütigen“ ist im Bußkontext natürlich und wahrt die Verbindung zu Manasses Verhalten.
- source_word: מִלִּפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Präpositionsverbindung bezeichnet das Verhalten in Jahwes Gegenwart. „Vor Jahwe“ ist knapp und idiomatisch; der Gottesname wird als Eigenname wiedergegeben.
- source_word: כְּהִכָּנַע
  choice: wie … sich gedemütigt hatte
  rationale: כְּ mit dem Infinitiv setzt Manasses früheres Handeln als Vergleichsmaßstab. Das Plusquamperfekt verdeutlicht im Deutschen, dass Manasses Demütigung vorausging.
- source_word: מְנַשֶּׁה אָבִיו
  choice: sein Vater Manasse
  rationale: Diese Wortstellung ist im modernen Deutschen natürlich und gibt die Verwandtschaftsbezeichnung eindeutig wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine begründende beziehungsweise erläuternde Feststellung über Amon ein, ohne die genaue logische Beziehung stärker festzulegen.
- source_word: הוּא אָמוֹן
  choice: er, Amon,
  rationale: Die appositionelle Form bewahrt die auffällige Verbindung von Pronomen und Eigenname und damit die nachdrückliche Identifizierung Amons.
- source_word: הִרְבָּה אַשְׁמָה
  choice: häufte immer mehr Schuld auf
  rationale: Das Hifil von רבה bezeichnet eine Zunahme. Die idiomatische Formulierung gibt wieder, dass Amon seine Schuld fortgesetzt und erheblich vergrößerte; אַשְׁמָה meint hier moralische Schuld, nicht ein Schuldopfer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ behandelt es als den offenbarten Eigennamen und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Art von Amons Schuldzunahme
  choice: häufte immer mehr Schuld auf
  alternative: vermehrte Schuld
  rationale: Die Formulierung hält die moralische Bewertung deutlich, ohne eine besondere Art von Vergehen oder eine konfessionelle Lehre über Schuld einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem Kontrast und der emphatischen Nennung Amons im Hebräischen, bleibt aber für heutige Leser flüssig. Das Semikolon trennt Vergleich und begründende Schlussaussage.
