revisions:
- from: Doch das Volk brachte weiterhin Opfer auf den Höhen dar, allerdings nur für Jahwe, seinen Gott.
  to: Doch das Volk brachte weiterhin auf den Höhen nur Jahwe, ihrem Gott, Opfer dar.
  rationale: Die Revision ersetzt die semantisch weniger genaue Präposition „für“ durch die bei Opferhandlungen übliche Dativkonstruktion und bewahrt den pluralischen Personenbezug von „ihr Gott“. Die Einschränkung „nur“ bleibt eindeutig beim Empfänger der Opfer, nicht bei den Höhen.
