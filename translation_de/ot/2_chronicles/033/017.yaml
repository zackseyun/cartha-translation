base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: de
  text: Doch das Volk brachte weiterhin auf den Höhen nur Jahwe, ihrem Gott, Opfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: Doch
  rationale: Gibt den adversativen und konzessiven Übergang zu der trotz der Reform fortbestehenden Praxis natürlich wieder.
- source_word: עוֹד
  choice: weiterhin
  rationale: Bezeichnet das Andauern der Opferpraxis.
- source_word: הָעָם
  choice: das Volk
  rationale: Entspricht der kollektiven Bezeichnung für die Bevölkerung beziehungsweise das Volk.
- source_word: זֹבְחִים
  choice: brachte Opfer dar
  rationale: Gibt das Partizip als fortdauernde, zusammenfassend berichtete Handlung in natürlichem Deutsch wieder.
- source_word: בַּבָּמוֹת
  choice: auf den Höhen
  rationale: Ist die geläufige biblische Bezeichnung für lokale Kultstätten; die Präposition entspricht zugleich dem hebräischen בְּ.
- source_word: רַק
  choice: allerdings nur
  rationale: 'Markiert die einschränkende Korrektur: Nicht der Opferort, sondern der Empfänger der Opfer wird begrenzt.'
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Bewahrt den im Text stehenden Gottesnamen; „für“ bezeichnet idiomatisch den Empfänger beziehungsweise Adressaten der Opfer.
- source_word: אֱלֹהֵיהֶם
  choice: seinen Gott
  rationale: Das Volk ist im Deutschen grammatisch Singular; daher wird der hebräische Pluralsuffix sinngemäß mit „seinen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Einschränkung רַק לַיהוָה אֱלֹהֵיהֶם
  choice: Die Opfer auf den Höhen galten ausschließlich Jahwe.
  alternative: Das Volk opferte nur auf solchen Höhen, die Jahwe geweiht waren.
  rationale: 'Wortstellung und Syntax beziehen „nur“ auf den Empfänger der Opfer. So bleibt die Spannung bestehen: Die Höhen wurden weiter genutzt, obwohl die Opfer keinem fremden Gott galten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höhen“ bleibt als etablierter kultischer Fachausdruck erhalten; die Satzgestaltung macht die Einschränkung des Opferempfängers klar, ohne die fortbestehende Problematik der Kultstätten abzuschwächen.
