id: 2CH.33.2
reference: 2 Chronicles 33:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, entsprechend den abscheulichen Bräuchen der Völker, die Jahwe vor den Israeliten[a] vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen Israels«.'
    reason: Die Fußnote dokumentiert die wörtliche, grammatisch maskuline und familiäre Form der hebräischen Wendung בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Das substantivisch gebrauchte Adjektiv הָרַע wird im Deutschen natürlich mit einem Relativsatz wiedergegeben; der erzählende Vergangenheitswert des Wayyiqtol bleibt erhalten.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Bewertungsformel wird bildhaft und zugleich verständlich wiedergegeben; der Gottesname יְהוָה erscheint als Jahwe.
- source_word: כְּתוֹעֲבוֹת
  choice: entsprechend den abscheulichen Bräuchen
  rationale: כְּ bezeichnet hier Übereinstimmung oder Vergleich. תּוֹעֵבָה hat starke religiös-moralische Bedeutung; „abscheuliche Bräuche“ macht im Kontext deutlich, dass konkrete Praktiken gemeint sind.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: Gemeint sind die nichtisraelitischen Völker des Landes; „Völker“ ist im historischen Zusammenhang präzise und wertneutral.
- source_word: הוֹרִישׁ
  choice: vertrieben hatte
  rationale: Der Hifil von ירשׁ bezeichnet hier das Vertreiben beziehungsweise Enteignen der bisherigen Bewohner. Das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: Die Wendung bedeutet im Zusammenhang des Vertreibens „vor ihnen weg“. „Israeliten“ gibt die kollektive Bedeutung von בְּנֵי יִשְׂרָאֵל in natürlichem modernem Deutsch wieder; die wörtliche Form wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische familiäre Bezeichnung meint hier das Volk Israel als Kollektiv. „Israeliten“ ist im Deutschen natürlich und sachlich genau; die formale Gestalt bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, ohne unnatürliche Hebraismen; „abscheuliche Bräuche“ bewahrt die starke kultisch-moralische Wertung.
