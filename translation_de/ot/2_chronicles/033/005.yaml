  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: de
  text: Er baute in den beiden Höfen des Hauses Jahwes Altäre für das ganze Heer des Himmels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das ganze Himmelsheer“. Der hebräische Ausdruck kann die Himmelskörper oder himmlischen Mächte bezeichnen, die in astralen Kulten verehrt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Qal-Wayyiqtol von בנה führt die Erzählung mit einer vergangenen Handlung Manasses fort. Im natürlichen deutschen Erzählstil kann das vorangestellte וַ ohne ein ausdrückliches „und“ wiedergegeben werden.
- source_word: מִזְבְּחוֹת
  choice: Altäre
  rationale: Der Plural von מזבח bezeichnet hier Kultstätten für Opfer oder Räucherwerk; „Altäre“ ist die direkte und übliche deutsche Entsprechung.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: für das ganze Heer des Himmels
  rationale: צבא השמים bezeichnet die Gesamtheit der Himmelskörper oder himmlischen Mächte im Zusammenhang astraler Verehrung. „Heer des Himmels“ bewahrt die biblische Bildsprache; „für“ gibt לְ bei Altären zu Ehren dieser Größen natürlich wieder.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: in den beiden Vorhöfen
  rationale: שְׁתֵּי bezeichnet ausdrücklich zwei, und חצרות meint im Tempelzusammenhang umschlossene Hofbereiche. „In den beiden Vorhöfen“ ist präzise und im Deutschen architektonisch passend.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die Formulierung bewahrt das hebräische Bild „Haus JHWHs“, statt den Bezug erklärend zu „Tempel“ aufzulösen, und gibt den Gottesnamen als „Jahwe“ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt den offenbarten Gottesnamen im modernen Deutschen direkt wieder, während „der HERR“ eine traditionelle Ersatzlesung wäre.
- issue: Deutung von צְבָא הַשָּׁמַיִם
  choice: Heer des Himmels
  alternative: Himmelsheer
  rationale: Die gewählte Formulierung erhält die Mehrdeutigkeit zwischen Himmelskörpern und als Mächte gedachten himmlischen Wesen, ohne die astralreligiöse Bedeutung im Haupttext einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau stellt den Ort vor das Objekt und klingt dadurch natürlich, ohne Informationen des hebräischen Textes auszulassen. Die traditionelle Tempelarchitektur wird mit „Vorhöfen“ bezeichnet; die echte Bedeutungsbreite von „Heer des Himmels“ bleibt erhalten.
