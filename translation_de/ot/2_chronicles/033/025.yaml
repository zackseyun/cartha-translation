id: 2CH.33.25
reference: 2 Chronicles 33:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: de
  text: Doch das Volk des Landes[a] erschlug alle, die sich gegen König Amon verschworen hatten[b]. Dann machte das Volk des Landes seinen Sohn Josia an seiner Stelle zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Volk des Landes“ ist eine hebräische Bezeichnung für die Bevölkerung des Landes und kann einen sozialpolitischen Beiklang haben.
    reason: cultural_note
  - marker: b
    text: 'Oder: „alle Verschwörer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: erschlug
  rationale: נכה bezeichnet hier ein gewaltsames Schlagen mit tödlichem Ausgang; „erschlug“ gibt dies im deutschen Erzählstil prägnant wieder.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die transparente Wiedergabe bewahrt den möglichen sozialpolitischen Fachklang des hebräischen Ausdrucks, ohne ihn vorschnell als „einfaches Volk“ festzulegen.
- source_word: כָּל הַקֹּשְׁרִים
  choice: alle, die sich … verschworen hatten
  rationale: Das Partizip von קשר bezeichnet die an einer Verschwörung Beteiligten; die Verbalkonstruktion ist im modernen Deutschen natürlich.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: gegen König Amon
  rationale: קשר mit עַל bezeichnet eine Verschwörung gegen eine Person.
- source_word: וַיַּמְלִיכוּ
  choice: machte … zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen; „krönte“ würde eine nicht ausdrücklich genannte Zeremonie eintragen.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: seinen Sohn Josia
  rationale: Die deutsche Wortstellung bezeichnet Josia eindeutig und natürlich als Amons Sohn.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Der Ausdruck kennzeichnet die Nachfolge beziehungsweise Ablösung im Königtum.
- source_word: וַ
  choice: Doch / Dann
  rationale: Das erste Waw markiert im Zusammenhang den Gegensatz zur Ermordung Amons im vorigen Vers; das zweite führt die anschließende Handlung fort.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „das Volk des Landes“ folgt bewusst dem Hebräischen; „erschlug“ wahrt den tödlichen Gewaltgehalt, ohne zusätzliche Hinrichtungsmodalitäten einzutragen.
