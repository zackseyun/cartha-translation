  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die wesentlichen Aussagen zuverlässig wieder: Das Volk des Landes tötet die gegen König Amon Verschwörten und setzt dessen Sohn Josia als König ein. „erschlug“ ist im Kontext angemessen für וַיַּכּוּ, ohne eine zusätzliche gerichtliche oder zeremonielle Deutung einzutragen. Die wiederholte Wiedergabe von עַם הָאָרֶץ bewahrt den möglicherweise technischen sozialpolitischen Ausdruck.'
