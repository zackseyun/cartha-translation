  terminology: „Volk des Landes“, „König“, „verschworen“, „erschlug“ und „zum König machen“ sind terminologisch stimmig. Der Name „Josia“ entspricht dem üblichen deutschen biblischen Gebrauch. Die Fußnoten lassen sowohl die soziale Nuance von עַם הָאָרֶץ als auch die nominale Alternative zu „alle, die sich verschworen hatten“ offen.
