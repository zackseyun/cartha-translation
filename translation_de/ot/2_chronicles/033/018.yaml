id: 2CH.33.18
reference: 2 Chronicles 33:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Manasses, sein Gebet zu seinem Gott und die Worte der Seher, die im Namen Jahwes, des Gottes Israels, zu ihm redeten – all dies ist in den Aufzeichnungen der Könige Israels festgehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch« beziehungsweise »in den Chroniken der Könige Israels«. Die hebräische Quellenformel verweist auf eine schriftliche königliche Quelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: die übrigen Taten Manasses
  rationale: Die königliche Schlussformel bezeichnet die weiteren Geschehnisse und Handlungen der Regierungszeit, nicht lediglich gesprochene Worte.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: sein Gebet zu seinem Gott
  rationale: Bewahrt sowohl das Possessivsuffix bei »Gebet« als auch die persönliche Formulierung »sein Gott«; אֶל wird natürlich mit »zu« wiedergegeben.
- source_word: הַחֹזִים
  choice: die Seher
  rationale: Gibt die besondere prophetische Bezeichnung wieder, ohne sie zum allgemeineren »Propheten« einzuebnen.
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: die … zu ihm redeten
  rationale: Der attributive Partizipialsatz wird in der historischen Zusammenfassung idiomatisch als Relativsatz in der Vergangenheit wiedergegeben.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Bewahrt die feste Wendung und ihren Gedanken prophetischer Bevollmächtigung; der Gottesname wird im Deutschen als »Jahwe« transliteriert.
- source_word: הִנָּם
  choice: all dies ist
  rationale: Nimmt die aufmerksamkeitslenkende und zusammenfassende Funktion des hebräischen Ausdrucks natürlich auf, ohne das heute ungewöhnlich wirkende »siehe« zu erzwingen.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: in den Aufzeichnungen der Könige Israels festgehalten
  rationale: Die Quellenformel verweist auf eine schriftliche königliche Sammlung; »festgehalten« macht die im Hebräischen vorausgesetzte schriftliche Dokumentation verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen; »Jahwe« ist dessen geläufige deutsche Transliteration und ersetzt ihn nicht durch einen Titel.
- issue: Identität der Könige in der Quellenangabe
  choice: Könige Israels
  alternative: Könige Judas
  rationale: Der masoretische Text nennt ausdrücklich Israel. Diese Lesart wird trotz des judäischen Zusammenhangs nicht harmonisierend verändert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Aufzählungssatz folgt der hebräischen Quellenformel, wird aber durch den Gedankenstrich und »all dies« übersichtlich gegliedert. »Jahwe« verwendet die im Deutschen übliche Form des Gottesnamens.
