  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: de
  text: Er entfernte die fremden Götter und das Götzenbild[a] aus dem Haus Jahwes sowie die Altäre, die er auf dem Berg des Hauses Jahwes[b] und in Jerusalem gebaut hatte, und warf sie aus der Stadt hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Bild«. Das hebräische Wort סֶמֶל kann ein Bild oder ein Kultbild bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf dem Tempelberg«; wörtlich: »auf dem Berg des Hauses Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Er entfernte
  rationale: Der Hifil von סור bezeichnet hier das Wegschaffen kultischer Gegenstände; »entfernte« ist präzise und natürlich.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: die fremden Götter
  rationale: Die Wendung bezeichnet nichtjahwistische Gottheiten; »fremde Götter« bewahrt Form und Sinn.
- source_word: הַסֶּמֶל
  choice: das Götzenbild
  rationale: סֶמֶל bezeichnet ein Bild beziehungsweise Kultbild. Im Reformkontext gibt »Götzenbild« die religiöse Funktion wieder, ohne die mögliche Wiedergabe »Bild« zu verschweigen.
- source_word: מִבֵּית יְהוָה
  choice: aus dem Haus Jahwes
  rationale: Die formnahe Wendung bewahrt das hebräische Bild; gemeint ist der Tempel.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: sowie alle Altäre
  rationale: »Sowie« bindet das zweite Objekt im Deutschen klar an »entfernte« an; מִן gilt sinngemäß auch für die Altäre.
- source_word: אֲשֶׁר בָּנָה
  choice: die er ... gebaut hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass der Bau der Altäre ihrer Entfernung vorausging.
- source_word: בְּהַר בֵּית יְהוָה
  choice: auf dem Berg des Hauses Jahwes
  rationale: Die Wiedergabe bleibt nah an הַר und der Genitivverbindung, statt bereits vollständig als »Tempelberg« zu deuten.
- source_word: וּבִירוּשָׁלָם
  choice: und in Jerusalem
  rationale: Die Ortsangabe bezieht weitere Altäre im Stadtgebiet ein.
- source_word: וַיַּשְׁלֵךְ
  choice: und warf sie
  rationale: »Warf« bewahrt die energische, anschauliche Bedeutung von שׁלך; »sie« nimmt die zuvor genannten Gegenstände auf.
- source_word: חוּצָה לָעִיר
  choice: vor die Stadt hinaus
  rationale: Die Formulierung gibt sowohl die gerichtete Bewegung von חוּצָה als auch das Ziel außerhalb der Stadt wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die etablierte deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« macht dies sichtbar, während »der HERR« die traditionelle Ersatzlesung wiedergibt.
- issue: Deutung von הַסֶּמֶל
  choice: Götzenbild
  alternative: Bild / Kultbild
  rationale: Der Zusammenhang der Beseitigung fremder Kulte legt »Götzenbild« nahe; da das Lexem selbst auch allgemeiner »Bild« bedeuten kann, bleibt diese Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Handlungsablauf, wird aber durch »sowie« syntaktisch eindeutig. »Haus Jahwes« und »Berg des Hauses Jahwes« bewahren zentrale Ausgangsbilder; die geläufigere Deutung »Tempelberg« steht in der Fußnote.
