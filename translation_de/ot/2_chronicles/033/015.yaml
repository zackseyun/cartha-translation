  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Begriffe des Hebräischen zuverlässig wieder: das Entfernen der fremden Götter und des Kultbildes, die Altäre an den genannten Orten sowie deren Wegwerfen außerhalb der Stadt. Die Formulierung „vor die Stadt hinaus“ ist im heutigen Deutsch jedoch potenziell missverständlich; sie kann einen Ort vor der Stadt statt die Bewegung aus dem Stadtgebiet heraus bezeichnen.'
  naturalness: „Sowie“ ist hier zwar grammatisch möglich, aber weniger unmittelbar als die einfache Reihung mit „und“. Eine klarere Satzfügung vermeidet zudem, dass „aus dem Haus Jahwes“ scheinbar auch die an verschiedenen Orten errichteten Altäre lokalisiert.
  terminology: „Jahwe“, „fremde Götter“, „Götzenbild“, „Haus Jahwes“ und „Altäre“ sind sachgerecht. Die Fußnoten bewahren die lexikalische Alternative zu סֶמֶל und die transparentere, wörtliche Form von בְּהַר בֵּית־יְהוָה.
