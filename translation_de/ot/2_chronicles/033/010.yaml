source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: de
  text: Und Jahwe redete zu Manasse und zu seinem Volk, doch sie hörten nicht darauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: דבר im Piel mit אֶל bezeichnet hier das Reden zu bestimmten Adressaten. „Redete zu“ ist im Deutschen natürlich und bewahrt den erzählerischen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: עַם mit Suffix der 3. Person Singular bezeichnet Manasses Volk beziehungsweise seine Untertanen; „seinem Volk“ ist direkt und idiomatisch.
- source_word: וְלֹא
  choice: doch … nicht
  rationale: 'Die Konjunktion leitet hier einen deutlichen Gegensatz ein: Jahwe redete, die Angesprochenen reagierten jedoch nicht entsprechend.'
- source_word: הִקְשִׁיבוּ
  choice: hörten nicht darauf
  rationale: קשב im Hiphil bezeichnet aufmerksames Hören beziehungsweise Beachten. „Darauf hören“ drückt im heutigen Deutsch sowohl das Zuhören als auch die erwartete Reaktion aus, ohne ausdrücklich „gehorchen“ festzulegen.
theological_decisions:
- issue: Bezug des pluralischen Subjekts in הִקְשִׁיבוּ
  choice: „sie“ bezieht sich auf Manasse und sein Volk gemeinsam
  alternative: Das Pronomen könnte ausschließlich auf das Volk bezogen werden, während Manasse nur als gesonderter Adressat genannt wäre.
  rationale: Auf die beiden verbundenen Adressaten „Manasse und sein Volk“ folgt ein Verb im Plural. Am naheliegendsten umfasst das pluralische Subjekt beide; das deutsche „sie“ bewahrt die Formulierung, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wendung „hörten nicht darauf“ gibt die aufmerksame und reaktionsbezogene Bedeutung des hebräischen Verbs natürlich wieder; eine Fußnote ist nicht nötig, da die deutsche Formulierung die wesentliche Bedeutungsbreite bereits trägt.
