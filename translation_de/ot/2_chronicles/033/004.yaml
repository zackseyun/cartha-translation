id: 2CH.33.4
reference: 2 Chronicles 33:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: de
  text: 'Er baute Altäre im Haus Jahwes[a], von dem Jahwe gesagt hatte: »In Jerusalem wird mein Name für immer sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Tempel Jahwes«. Wörtlich: »im Haus Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »In Jerusalem wird mein Name für immer sein.« In verwandten biblischen Formulierungen heißt es häufig: »Mein Name wird dort für immer sein.«'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Er baute
  rationale: Das Qal Perfekt 3. Person Singular von בנה bedeutet »bauen«. Das vorangestellte ו wird im flüssigen deutschen Erzählstil nicht eigens mit »und« wiedergegeben.
- source_word: מִזְבְּחוֹת
  choice: Altäre
  rationale: Die Pluralform von מִזְבֵּחַ bezeichnet Opferaltäre und wird direkt und natürlich mit »Altäre« wiedergegeben.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempel. »Haus Jahwes« bewahrt die hebräische Ausdrucksweise; die verständliche Alternative »Tempel Jahwes« steht in der Fußnote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: von dem Jahwe gesagt hatte
  rationale: Das Relativpronomen bezieht sich am natürlichsten auf das Haus. Das Plusquamperfekt verdeutlicht im Deutschen, dass Jahwes Aussage dem berichteten Bau der Altäre vorausging.
- source_word: בִּירוּשָׁלִַם
  choice: In Jerusalem
  rationale: Präposition und Ortsname werden direkt wiedergegeben; die Voranstellung entspricht der hebräischen Wortfolge und Betonung.
- source_word: יִהְיֶה שְּׁמִי
  choice: wird mein Name sein
  rationale: Die Übersetzung bewahrt die auffällige, knappe Formulierung des hebräischen Textes und ergänzt kein dort fehlendes »dort«.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: לְעוֹלָם bezeichnet hier unbegrenzte Dauer; »für immer« ist im modernen Deutschen natürlich und angemessen würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Ob die Wendung »mein Name wird sein« durch »mein Name wird dort sein« zu ergänzen ist
  choice: wird mein Name für immer sein
  alternative: wird mein Name für immer dort sein
  rationale: Im vorliegenden hebräischen Text fehlt ein Wort für »dort«. Die Übersetzung erhält deshalb die ungewöhnlich knappe Formulierung und importiert keine Ergänzung aus Parallelstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die ungewöhnliche Aussage über den Namen wird bewusst nicht geglättet.
