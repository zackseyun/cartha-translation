  text: וּ/תְפִלָּת֣/וֹ וְ/הֵֽעָתֶר ל/וֹ֮ וְ/כָל חַטָּאת֣/וֹ וּ/מַעְל/וֹ֒ וְ/הַ/מְּקֹמ֗וֹת אֲשֶׁר֩ בָּנָ֨ה בָ/הֶ֤ם בָּמוֹת֙ וְ/הֶעֱמִיד֙ הָ/אֲשֵׁרִ֣ים וְ/הַ/פְּסִלִ֔ים לִ/פְנֵ֖י הִכָּנְע֑/וֹ הִנָּ֣/ם כְּתוּבִ֔ים עַ֖ל דִּבְרֵ֥י חוֹזָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: de
  text: Sein Gebet und wie er Erhörung fand, all seine Sünden und seine Treulosigkeit sowie die Orte, an denen er Höhenheiligtümer errichtete und die Aschera-Kultmale[a] und die geschnitzten Götterbilder aufstellte, bevor er sich demütigte – all das ist in den Aufzeichnungen Hosais[b] niedergeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: die Aschera-Pfähle. Der hebräische Ausdruck bezeichnet Kultgegenstände, die mit der Göttin Aschera verbunden waren; ihre genaue Gestalt ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: in den Aufzeichnungen der Seher. Der letzte hebräische Ausdruck kann als Eigenname „Hosai“ oder als Bezeichnung für Seher verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: sein Gebet
  rationale: Die gewöhnliche und im Zusammenhang natürliche Wiedergabe von תְּפִלָּה; sie lässt offen, welche konkrete Form das Gebet hatte.
- source_word: הֵעָתֶר לוֹ
  choice: wie er Erhörung fand
  rationale: Die Form bezeichnet die günstige Beantwortung einer Bitte. Die deutsche Formulierung ist natürlich und setzt im Satz keinen ausdrücklich genannten Handelnden ein.
- source_word: כָל חַטָּאתוֹ
  choice: all seine Sünden
  rationale: Der hebräische Singular kann kollektiv gebraucht sein; der deutsche Plural gibt diesen Gesamtumfang idiomatisch wieder.
- source_word: מַעְלוֹ
  choice: seine Treulosigkeit
  rationale: מעל bezeichnet einen Treuebruch mit religiös-bundestheologischer Färbung; „Treulosigkeit“ wahrt diese Bedeutung ohne unnötige Fachsprache.
- source_word: בָּמוֹת
  choice: Höhenheiligtümer
  rationale: Der Ausdruck bezeichnet lokale Kultstätten, häufig auf Anhöhen, aber nicht ausschließlich; „Höhenheiligtümer“ ist im Deutschen präziser als das missverständliche „Höhen“.
- source_word: הָאֲשֵׁרִים
  choice: Aschera-Kultmale
  rationale: Der maskuline Plural bezeichnet Kultgegenstände, die mit Aschera verbunden waren. „Kultmale“ benennt ihre Funktion, ohne ihre genaue Gestalt als Pfähle festzulegen.
- source_word: הַפְּסִלִים
  choice: die geschnitzten Götterbilder
  rationale: Die Wiedergabe erhält sowohl den konkreten Sinn geschnitzter Bilder als auch ihren kultischen Charakter.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: bevor er sich demütigte
  rationale: Die Form wird am natürlichsten reflexiv beziehungsweise intransitiv verstanden und entspricht dem Erzählzusammenhang.
- source_word: הִנָּם כְּתוּבִים
  choice: all das ist … niedergeschrieben
  rationale: „All das“ nimmt die zuvor genannten Sachverhalte auf; „niedergeschrieben“ gibt den präsentativ-bekräftigenden Abschluss in natürlichem, würdigem Deutsch wieder.
- source_word: דִּבְרֵי חוֹזָי
  choice: die Aufzeichnungen Hosais
  rationale: Die masoretische Vokalisierung חוֹזָי legt den Eigennamen Hosai nahe. דִּבְרֵי bezeichnet hier den schriftlichen Bericht beziehungsweise die Aufzeichnungen.
theological_decisions:
- issue: Art von Manasses Demütigung in הִכָּנְעוֹ
  choice: bevor er sich demütigte
  alternative: bevor er gedemütigt wurde
  rationale: Die hebräische Form unterstützt die reflexive beziehungsweise intransitive Lesart. Sie benennt Manasses Reaktion, ohne eine weitergehende Lehre über seine Umkehr in den Vers hineinzutragen.
- issue: Identität des Verfassers beziehungsweise der Quelle in חוֹזָי
  choice: Hosai als Eigenname
  alternative: die Seher
  rationale: Der vokalisierte masoretische Text lässt sich am direktesten als Eigenname lesen. Da eine Deutung als Bezeichnung für Seher textgeschichtlich und übersetzungstraditionell möglich ist, wird sie in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Aufzählungssatz des Hebräischen bleibt erhalten, wird aber durch „sowie“ und einen Gedankenstrich übersichtlich gegliedert. Fachausdrücke werden nur dort verwendet, wo sie die kultische Bedeutung präzise und verständlich wiedergeben.
