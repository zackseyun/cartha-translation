  terminology: „Treulosigkeit“ gibt מַעְלוֹ treffend wieder; „Höhenheiligtümer“ wahrt den kultischen Charakter von בָּמוֹת; „Aschera-Kultmale“ vermeidet eine unbegründete Festlegung auf Pfähle. Die Fußnote zu Aschera erläutert die historische und lexikalische Unsicherheit ausgewogen. Die Fußnote zu Hosai/Sehern bewahrt die relevante textliche Ambiguität, ohne eine Lesart dogmatisch zu erzwingen.
