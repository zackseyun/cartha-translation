  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: de
  text: Manasse führte Juda und die Bewohner Jerusalems in die Irre und brachte sie dazu, mehr Böses zu tun als die Völker, die Jahwe vor den Israeliten[a] vernichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּתַע
  choice: führte … in die Irre
  rationale: Der Hifil von תעה bezeichnet das Veranlassen zum Irren oder Abweichen. „In die Irre führen“ gibt den kausativen Sinn idiomatisch und deutlich wieder.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Juda und die Bewohner Jerusalems
  rationale: Die beiden gemeinschaftlichen Objekte bleiben ausdrücklich erhalten; „Bewohner Jerusalems“ ist eine natürliche Wiedergabe der Partizipialkonstruktion.
- source_word: לַעֲשׂוֹת רָע
  choice: brachte sie dazu, … Böses zu tun
  rationale: Die Ergänzung „brachte sie dazu“ verbindet den Infinitiv natürlich mit dem vorangehenden kausativen Verb. „Böses tun“ bleibt nah am hebräischen Ausdruck.
- source_word: מִן הַגּוֹיִם
  choice: mehr Böses … als die Völker
  rationale: מִן kennzeichnet hier den Vergleich. Die deutsche Formulierung macht ausdrücklich, dass Judas Handeln das Böse der genannten Völker übertraf.
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: die Jahwe … vernichtet hatte
  rationale: Das Relativpronomen bezieht sich auf die Völker. Das Plusquamperfekt verdeutlicht, dass ihre Vernichtung vor Manasses Handeln lag; „vernichten“ bewahrt die Stärke von השמיד.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: מִפְּנֵי bezeichnet im Landnahmekontext die Beseitigung aus dem Weg beziehungsweise vor dem Heranziehen Israels. „Israeliten“ gibt die kollektiv gebrauchte Wendung בְּנֵי יִשְׂרָאֵל im modernen Deutsch natürlich wieder; die wörtliche Form wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Bundesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektive, grammatisch maskuline Wendung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier das Volk Israel insgesamt. „Die Israeliten“ ist im Deutschen klar und schließt die kollektive Bedeutung ein, während die Fußnote die formale Gestalt des Hebräischen bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält den kausativen Zusammenhang und den Vergleich des hebräischen Textes deutlich fest, ohne die ungewöhnliche Aussage abzuschwächen.
