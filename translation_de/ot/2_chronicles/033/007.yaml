  terminology: „Haus Gottes“, „Gott“, „Salomo“, „geschnitztes Bild“ und „Götzenbild“ sind angemessen. Die Fußnote erklärt die verdoppelnde hebräische Bild-/Götzenterminologie, ohne sie inhaltlich zu harmonisieren.
