  to: 'Er stellte das geschnitzte Bild, das Götzenbild, das er angefertigt hatte, in das Haus Gottes. Von diesem Haus hatte Gott zu David und zu seinem Sohn Salomo gesagt: »In diesem Haus und in Jerusalem, die ich aus allen Stämmen Israels erwählt habe, werde ich meinen Namen für immer setzen.«[a]'
