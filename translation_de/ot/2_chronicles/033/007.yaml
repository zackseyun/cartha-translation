  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: de
  text: 'Er stellte das geschnitzte Bild, das Götzenbild, das er angefertigt hatte, in das Haus Gottes. Von diesem Haus hatte Gott zu David und zu seinem Sohn Salomo gesagt: »In diesem Haus und in Jerusalem, die ich aus allen Stämmen Israels erwählt habe, werde ich meinen Namen für immer setzen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das geschnitzte Bild des Götzen«; im Hebräischen stehen zwei eng verwandte Bezeichnungen für ein Götzenbild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte
  rationale: שׂים bezeichnet hier das Aufstellen bzw. Platzieren eines Kultbildes; „stellte“ ist im Deutschen natürlich und anschaulich.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: das geschnitzte Bild, das Götzenbild
  rationale: Die appositionelle Wiedergabe hält beide eng verwandten hebräischen Bezeichnungen sichtbar und macht zugleich den kultischen Charakter des Bildes deutlich.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er angefertigt hatte
  rationale: Das Plusquamperfekt verdeutlicht natürlich, dass die Anfertigung dem Aufstellen vorausging.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: in das Haus Gottes
  rationale: Die Richtungsbedeutung ergibt sich im Deutschen aus dem Akkusativ nach „in“; „Haus Gottes“ bewahrt die konkrete בית-Terminologie.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: Von diesem Haus hatte Gott ... gesagt
  rationale: Der Bezug des Relativsatzes auf das Haus wird im Deutschen eindeutig und flüssig ausgedrückt.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: zu David und zu seinem Sohn Salomo
  rationale: Die doppelte Präposition wird sinngemäß bewahrt; die natürliche deutsche Wortstellung macht David eindeutig zum Vater Salomos.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: In dieses Haus und nach Jerusalem
  rationale: Beim Verb „setzen“ verlangt das Deutsche für das Ziel eine Richtungsangabe. Die Übersetzung erhält die auffällige Verbindung von Haus und Stadt.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: das ich aus allen Stämmen Israels erwählt habe
  rationale: Das Perfekt gibt die vollzogene Wahl mit fortdauernder Bedeutung wieder; der Singular des Relativpronomens bezieht sich grammatisch auf Jerusalem.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: werde ich meinen Namen ... setzen
  rationale: Die konkrete Bundestheologie-Formulierung wird bewahrt und nicht zu „wohnen lassen“ oder „Gegenwart begründen“ ausgedeutet.
- source_word: לְעֵילֹום
  choice: für immer
  rationale: Zeitgemäße und würdevolle Standardwiedergabe der unbefristeten Dauerangabe.
theological_decisions:
- issue: Gottesbezeichnung
  choice: Gott
  alternative: der HERR
  rationale: Der hebräische Text verwendet אֱלֹהִים und nicht den Gottesnamen יהוה.
- issue: Theologie des göttlichen Namens
  choice: meinen Namen für immer setzen
  alternative: meinen Namen dort für immer wohnen lassen
  rationale: Die Übersetzung bewahrt das hebräische Bild vom Setzen des Namens, ohne seine theologische Bedeutung paraphrasierend festzulegen.
- issue: Bezug der Erwählung
  choice: Jerusalem, das ich ... erwählt habe
  alternative: dieses Haus und Jerusalem, die ich ... erwählt habe
  rationale: Das hebräische Relativpronomen ist formal nicht nach Genus und Numerus markiert; das folgende Verb steht jedoch im Singular. Der nächstliegende grammatische Bezug ist Jerusalem, auch wenn der weitere Zusammenhang Haus und Stadt eng verbindet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Haus Gottes“ und „meinen Namen setzen“ bewahren zentrale hebräische Ausdrucksweisen; die Satzteilung verhindert eine schwer verständliche deutsche Periodenkonstruktion.
