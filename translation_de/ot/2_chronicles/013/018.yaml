id: 2CH.13.18
reference: 2 Chronicles 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: de
  text: So wurden die Israeliten zu jener Zeit unterworfen, die Judäer aber erwiesen sich als stark, weil sie sich auf Jahwe, den Gott ihrer Väter, stützten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: wurden … unterworfen
  rationale: Das Nifal von כנע bezeichnet hier im militärischen Zusammenhang das Unterworfen- bzw. Niedergezwungenwerden, ohne eine vollständige Vernichtung auszusagen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Bezeichnung gibt die Zugehörigkeit zu Israel natürlich wieder; im Kontext ist das Nordreich gemeint.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Natürliche und zugleich würdige Wiedergabe der hebräischen Zeitangabe.
- source_word: וַיֶּאֶמְצוּ
  choice: erwiesen sich als stark
  rationale: Bewahrt die Grundbedeutung von אמץ, stark zu sein bzw. Stärke zu zeigen, und lässt den militärischen Erfolg aus dem Zusammenhang hervorgehen.
- source_word: בְנֵי יְהוּדָה
  choice: die Judäer
  rationale: Idiomatiche moderne Bezeichnung für die Angehörigen Judas und als Gegenstück zu „die Israeliten“ gut verständlich.
- source_word: כִּי
  choice: weil
  rationale: Kennzeichnet klar den im Hebräischen ausgedrückten Grund für Judas Stärke.
- source_word: נִשְׁעֲנוּ עַל
  choice: sich auf … stützten
  rationale: Erhält das Bild des Sich-Anlehnens und gibt zugleich die übertragene Bedeutung des Vertrauens bzw. Sich-Verlassens natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: den Gott ihrer Väter
  rationale: Bewahrt die ausdrücklich männliche, bundestheologisch geprägte Ahnenbezeichnung des Hebräischen in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ macht dies sichtbar, während „der HERR“ ihn traditionell durch einen Titel ersetzt.
- issue: Bedeutung von נִשְׁעֲנוּ עַל
  choice: sich auf … stützten
  alternative: auf … vertrauten
  rationale: Die gewählte Formulierung bewahrt das konkrete hebräische Bild und schließt dessen theologische Bedeutung des Vertrauens ein, ohne sie darauf zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die parallelen Gruppenbezeichnungen werden idiomatisch als „Israeliten“ und „Judäer“ wiedergegeben; die kausale Aussage und das Bild des Sich-Stützens bleiben deutlich erhalten.
