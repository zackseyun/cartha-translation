  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: de
  text: 'Als Juda sich umwandte, siehe: Der Kampf war vor ihnen und hinter ihnen. Da schrien sie zu Jahwe, und die Priester bliesen die Trompeten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ יְהוּדָה
  choice: Als Juda sich umwandte
  rationale: פנה bezeichnet hier angesichts des Hinterhalts eine körperliche Wendung. „Juda“ bleibt wie im Hebräischen eine kollektive Bezeichnung für das Volk beziehungsweise Heer.
- source_word: וְהִנֵּה
  choice: da sahen sie
  rationale: Gibt den Aufmerksamkeit weckenden und überraschenden Charakter von הִנֵּה in natürlichem modernem Deutsch wieder, ohne das altertümliche „siehe“ zu erzwingen.
- source_word: הַמִּלְחָמָה
  choice: der Kampf
  rationale: Gemeint ist die unmittelbar stattfindende militärische Auseinandersetzung, nicht ein länger dauernder Krieg.
- source_word: פָּנִים וְאָחוֹר
  choice: vor ihnen und hinter ihnen
  rationale: Die räumliche Gegenüberstellung wird eng am hebräischen Ausdruck und zugleich verständlich wiedergegeben.
- source_word: וַיִּצְעֲקוּ לַיהוָה
  choice: Da schrien sie zu Jahwe
  rationale: צעק bezeichnet einen dringlichen Hilferuf; die Präposition richtet diesen ausdrücklich an Jahwe.
- source_word: וְהַכֹּהֲנִים מחצצרים בַּחֲצֹצְרוֹת
  choice: und die Priester bliesen die Trompeten
  rationale: Das Partizip מחצצרים schildert die begleitende beziehungsweise andauernde Handlung. חֲצֹצְרוֹת sind die geraden kultischen und militärischen Trompeten; „silbern“ steht in diesem Vers nicht ausdrücklich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den Eigennamen erkennbar wieder und entspricht der vorgelegten Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebhafte Überraschung von וְהִנֵּה wird idiomatisch mit „da sahen sie“ ausgedrückt. Die hebräische Koordination der beiden Reaktionen bleibt durch „und“ erhalten.
