  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: de
  text: Wisst ihr nicht, dass Jahwe, der Gott Israels, David das Königtum über Israel für immer gegeben hat – ihm und seinen Söhnen[a] – durch einen Salzbund[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „seinen Söhnen“ ist hier Davids königliche Linie oder Dynastie gemeint.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „mit einem Salzbund“. Die Wendung bezeichnet wahrscheinlich einen bindenden, dauerhaften Bund; vergleiche 4. Mose 18,19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Wisst ihr nicht
  rationale: Die rhetorische Frage erwartet Zustimmung und spricht mehrere Hörer an. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den vorwurfsvollen Nachdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: נָתַן מַמְלָכָה לְדָוִיד עַל יִשְׂרָאֵל
  choice: David das Königtum über Israel gegeben hat
  rationale: מַמְלָכָה bezeichnet hier besonders die David verliehene Königsherrschaft beziehungsweise das Recht zu regieren; „Königtum“ trifft diesen Bezug genauer als ein rein räumlich verstandenes „Königreich“.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Bewahrt die ausdrückliche Aussage dauernder Geltung in schlichter, gegenwärtiger Sprache.
- source_word: לוֹ וּלְבָנָיו
  choice: ihm und seinen Söhnen
  rationale: Die wörtliche Familienbezeichnung bleibt erhalten; im Zusammenhang der Thronfolge sind damit Davids königliche Nachkommen gemeint.
- source_word: בְּרִית מֶלַח
  choice: durch einen Salzbund
  rationale: Die prägnante hebräische Wendung und ihr kulturell-theologisches Bild bleiben sichtbar; ihre wahrscheinliche Bedeutung wird nicht interpretierend in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
theological_decisions:
- issue: Dauer und Tragweite der David gewährten Herrschaft
  choice: Die Aussage „für immer“ und das Bild des Salzbundes werden unverändert nebeneinandergestellt.
  alternative: Die Wendung deutend als „durch einen dauerhaften Bund“ wiederzugeben.
  rationale: Der hebräische Text betont die Dauer sowohl ausdrücklich mit לְעוֹלָם als auch bildhaft mit בְּרִית מֶלַח. Die Übersetzung bewahrt beides, ohne spätere theologische Folgerungen vorwegzunehmen.
- issue: Bedeutung von „seinen Söhnen“
  choice: Die konkrete Formulierung bleibt im Haupttext stehen; die dynastische Bedeutung wird in der Fußnote erklärt.
  alternative: Im Haupttext „seinen Nachkommen“ oder „seinem Königshaus“ zu schreiben.
  rationale: So bleibt die Form des Ausgangstextes erhalten, während der königliche Nachfolgekontext verständlich gemacht wird.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Anrede im Plural und die rhetorische Schärfe bleiben erhalten. Gedankenstriche heben die nähere Bestimmung „ihm und seinen Söhnen“ lesefreundlich hervor; „Salzbund“ bewahrt das fremdartige, aber wichtige Bild des Hebräischen.
