  text: וַ/יִּשְׁכַּ֨ב אֲבִיָּ֜ה עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בְּ/עִ֣יר דָּוִ֔יד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּ֑י/ו בְּ/יָמָ֛י/ו שָׁקְטָ֥ה הָ/אָ֖רֶץ עֶ֥שֶׂר שָׁנִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: de
  text: Abija legte sich zu seinen Vorfahren, und sie begruben ihn in der Stadt Davids. Sein Sohn Asa wurde an seiner Stelle König. In seinen Tagen hatte das Land zehn Jahre lang Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Land blieb zehn Jahre lang ungestört.“'
    reason: Lexikalische Alternative für שָׁקְטָה; das Verb kann sowohl Ruhe als auch Ungestörtheit beziehungsweise Stille bezeichnen.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Die feste hebräische Todesformel wird mit ihrem Bild bewahrt. „Vorfahren“ gibt den hier gemeinten generationsübergreifenden Sinn von אבות im heutigen Deutsch natürlicher wieder als „Väter“.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: sie begruben ihn
  rationale: Der aktive Plural des Hebräischen mit ungenanntem Subjekt bleibt erhalten; eine deutsche Passivform wäre glatter, aber weniger formnah.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Die Wendung gibt die hebräische Genitivverbindung direkt und als gebräuchliche Ortsbezeichnung wieder.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang einer Thronfolge bezeichnet das Verb Asas Übernahme der Königsherrschaft. Diese Formulierung ist im Deutschen natürlicher als das hier schwerfällige „regierte“ mit einer Stellvertretungsangabe.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Formulierung bewahrt den Gedanken der Nachfolge beziehungsweise Ablösung, ohne lediglich eine zeitliche Abfolge auszudrücken.
- source_word: בְּיָמָיו
  choice: In seinen Tagen
  rationale: Die wörtliche zeitliche Wendung bleibt erhalten und kann im Kontext zugleich Asas Regierungszeit bezeichnen.
- source_word: שָׁקְטָה
  choice: hatte … Ruhe
  rationale: Das Verb bezeichnet Ruhe, Ungestörtheit oder das Ausbleiben von Unruhen. „Ruhe haben“ bewahrt den für die Chronik charakteristischen Gedanken nationaler Ruhe.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Die direkte Wiedergabe lässt offen, ob vor allem das Gebiet, die Bevölkerung oder das Reich als politischer Raum im Blick ist.
- source_word: עֶשֶׂר שָׁנִים
  choice: zehn Jahre lang
  rationale: Die deutsche Zeitdauerformulierung gibt den Umfang von zehn Jahren idiomatisch und präzise wieder.
