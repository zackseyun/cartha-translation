  text: וְ/יָֽרָבְעָ֗ם הֵסֵב֙ אֶת הַ/מַּאְרָ֔ב לָ/ב֖וֹא מֵֽ/אַחֲרֵי/הֶ֑ם וַ/יִּֽהְיוּ֙ לִ/פְנֵ֣י יְהוּדָ֔ה וְ/הַ/מַּאְרָ֖ב מֵ/אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/013.yaml
  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: de
  text: Jerobeam aber hatte den Hinterhalt herumgeführt, um ihnen von hinten zu kommen. So waren sie vor Juda, während der Hinterhalt hinter ihnen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרָבְעָם
  choice: Jerobeam aber
  rationale: Die im Deutschen etablierte Namensform „Jerobeam“ wird verwendet; וְ markiert hier den Gegensatz beziehungsweise den Fortgang der Handlung und wird natürlich mit „aber“ wiedergegeben.
- source_word: הֵסֵב אֶת־הַמַּאְרָב
  choice: hatte den Hinterhalt so herumgeführt
  rationale: הֵסֵב bezeichnet ein Herumführen oder Umgehenlassen; das Plusquamperfekt verdeutlicht die gegenüber der folgenden Lagebeschreibung vorzeitige taktische Bewegung.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: dass er ihnen in den Rücken fiel
  rationale: Wörtlich „um von hinter ihnen zu kommen“; die idiomatische deutsche Wendung beschreibt denselben militärischen Vorgang, ohne zusätzliche Deutung.
- source_word: וַיִּהְיוּ לִפְנֵי יְהוּדָה
  choice: So stand das Heer vor Juda
  rationale: Das maskuline Pluralpronomen ist im Kontext auf Jerobeams Hauptstreitmacht bezogen. „Das Heer“ macht den deutschen Bezug verständlich, während „vor Juda“ die räumliche Gegenüberstellung bewahrt.
- source_word: וְהַמַּאְרָב מֵאַחֲרֵיהֶם
  choice: während der Hinterhalt hinter ihnen war
  rationale: Die knappe hebräische Nominalkonstruktion wird als gleichzeitige Lagebeschreibung wiedergegeben.
