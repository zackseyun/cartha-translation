  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: de
  text: Da sammelten sich Männer ohne Wert, Söhne Belials[a], um ihn und erwiesen sich als stärker als Rehabeam, den Sohn Salomos. Rehabeam aber war jung und zaghaft und behauptete sich ihnen gegenüber nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ruchlose Männer« beziehungsweise »Niederträchtige«; die hebräische Wendung lautet wörtlich »Söhne Belials«.'
    reason: Bewahrt die Mehrdeutigkeit von בְּנֵי בְלִיַּעַל und nennt zugleich die idiomatische Bedeutung.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: sammelten sich … um ihn
  rationale: קבץ mit עַל kann ein Sammeln um jemanden oder gegen ihn bezeichnen. Der Zusammenhang lässt erkennen, dass die Männer sich Jerobeam anschlossen und dadurch gegen Rehabeam standen; die räumlich-politische Bildsprache bleibt erhalten.
- source_word: אֲנָשִׁים רֵקִים
  choice: nichtsnutzige Männer
  rationale: רֵקִים bedeutet wörtlich „leere“, bezeichnet hier aber Menschen ohne Wert, Ansehen oder moralische Substanz. „Nichtsnutzige Männer“ gibt das abwertende Urteil natürlich und deutlich wieder.
- source_word: בְּנֵי בְלִיַּעַל
  choice: Söhne Belials
  rationale: Die wörtliche Wendung bewahrt die mögliche Spannung zwischen einem Eigennamen und einer Bezeichnung für Niedertracht oder Nichtswürdigkeit. Die idiomatische Bedeutung wird in der Fußnote genannt.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: erwiesen sich als stärker als
  rationale: Der Hitpael von אמץ bezeichnet hier, dass die Männer in der Auseinandersetzung Stärke gegen Rehabeam gewannen beziehungsweise zeigten. Die Formulierung gibt die vergleichende Wirkung im Zusammenhang idiomatisch wieder.
- source_word: נַעַר
  choice: jung
  rationale: נַעַר bezeichnet hier keine Kindheit, sondern die Rehabeam rhetorisch zugeschriebene Jugend beziehungsweise Unreife.
- source_word: רַךְ לֵבָב
  choice: zaghaft
  rationale: Wörtlich „weich/zart von Herzen“ meint im politischen Konflikt mangelnde Entschlossenheit, nicht Mitgefühl. „Zaghaft“ ist knapp und kontextgerecht.
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: hatte nicht die Kraft aufgebracht, ihnen entgegenzutreten
  rationale: Die Wendung bedeutet wörtlich, dass Rehabeam sich vor ihnen nicht stark machte. Die deutsche Formulierung wahrt den Bezug auf Stärke und vermittelt zugleich verständlich seine mangelnde Gegenwehr.
theological_decisions:
- issue: Deutung von בְּנֵי בְלִיַּעַל
  choice: Söhne Belials
  alternative: ruchlose Männer / Niederträchtige
  rationale: Die wörtliche Wiedergabe entscheidet nicht vorschnell, ob בְּלִיַּעַל hier als personifizierter Name oder als abstrakte Bezeichnung für Nichtswürdigkeit und Bosheit verstanden werden soll. Eine Fußnote erschließt die idiomatische Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem Hebräischen, ohne schwerfällige Wörtlichkeit. „Nichtsnutzig“ und „zaghaft“ sind allgemein verständlich und bewahren den deutlich wertenden Ton der Rede.
