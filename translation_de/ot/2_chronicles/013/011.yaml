source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: de
  text: Wir bringen Jahwe Morgen für Morgen und Abend für Abend Brandopfer dar und verbrennen wohlriechendes Räucherwerk. Die Brote ordnen wir auf dem reinen Tisch an[a], und die Lampen des goldenen Leuchters lassen wir Abend für Abend brennen. Denn wir erfüllen die Dienstpflicht gegenüber Jahwe, unserem Gott; ihr aber habt ihn verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Schaubrote; die Brote der Gegenwart. Wörtlich: die Anordnung von Brot.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: wir bringen … dar
  rationale: Der Hifil von קטר bezeichnet hier das Verbrennen beziehungsweise Aufsteigenlassen einer Opfergabe auf dem Altar. „Darbringen“ gibt die kultische Handlung in natürlichem Deutsch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der offenbarte Eigenname Gottes wiedergegeben.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Übliche und präzise deutsche Wiedergabe von עֹלָה im Opferkontext.
- source_word: בַּבֹּקֶר בַּבֹּקֶר … בָּעֶרֶב בָּעֶרֶב
  choice: Morgen für Morgen … Abend für Abend
  rationale: Die Wiederholung ist distributiv und bezeichnet den regelmäßigen täglichen Vollzug; zugleich bleibt der hebräische Parallelismus hörbar.
- source_word: וּקְטֹרֶת סַמִּים
  choice: wohlriechendes Räucherwerk
  rationale: סַמִּים bezeichnet aromatische Stoffe beziehungsweise Gewürze; die Formulierung gibt den eigens bereiteten duftenden Weihrauch idiomatisch wieder.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: die Anordnung der Brote
  rationale: Die nahe Wiedergabe bewahrt den Akzent auf der geordneten Auslegung des Brotes, ohne einen traditionellen Fachbegriff zum alleinigen Textsinn zu machen.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: auf dem reinen Tisch
  rationale: „Rein“ bewahrt den kultischen Sinn von טָהוֹר und vermeidet eine bloß hygienische Deutung.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: dass die Lampen des goldenen Leuchters … brennen
  rationale: Die deutsche Satzgestaltung macht die Funktion der Lampen klar und erhält Leuchter, Lampen und ihr regelmäßiges Brennen als einzelne Elemente.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: wir erfüllen den Dienstauftrag Jahwes
  rationale: שמר משמרת ist eine feste Wendung für das gewissenhafte Wahrnehmen einer anvertrauten kultischen Pflicht. „Dienstauftrag erfüllen“ ist verständlich und wahrt den Tempeldienst-Kontext.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: ihr aber habt ihn verlassen
  rationale: Die adversative Gegenüberstellung und der direkte Vorwurf werden knapp und formal nah wiedergegeben.
theological_decisions:
- issue: Bezeichnung der Tempelbrote
  choice: die Anordnung der Brote
  alternative: die Schaubrote; die Brote der Gegenwart
  rationale: Der hebräische Ausdruck bezeichnet wörtlich die Anordnung beziehungsweise Auslegung von Brot. Die Hauptfassung bewahrt diese konkrete Formulierung; die traditionellen, sachlich passenden Bezeichnungen stehen in der Fußnote.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit die im Ausgangstext ausdrücklich verwendete Bundesnamensform erkennbar bleibt.
- issue: Bedeutung von משמרת im kultischen Kontext
  choice: Dienstauftrag
  alternative: Obhut; Vorschrift; Dienstpflicht
  rationale: Die Wendung bezeichnet hier nicht allgemein Bewachung, sondern die von Jahwe anvertraute Verpflichtung des Tempeldienstes. Die Übersetzung konkretisiert nur so weit, wie es der unmittelbare Kontext trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Präzision. Die wiederholten Zeitangaben bleiben zur Wahrung des hebräischen Rhythmus erhalten. Der lange hebräische Satz ist behutsam gegliedert, ohne seine inhaltliche Abfolge zu verändern.
