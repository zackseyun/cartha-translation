source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: de
  text: Jerobeam, der Sohn Nebats, ein Diener Salomos, des Sohnes Davids, erhob sich und rebellierte gegen seinen Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Gebieter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: erhob sich
  rationale: Das Qal-Wayyiqtol von קום leitet Jerobeams Widerstand ein. „Erhob sich“ bewahrt die erzählerische Bildhaftigkeit, ohne die Handlung vorschnell militärisch zu deuten.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Die Namen folgen der etablierten deutschen Bibeltradition; die Abstammungsangabe wird natürlich und wörtlich wiedergegeben.
- source_word: עֶבֶד
  choice: Diener
  rationale: עבד kann „Sklave“ oder „Diener“ bedeuten. Im königlich-administrativen Zusammenhang bezeichnet „Diener“ Jerobeams Unterordnung unter Salomo angemessen, ohne einen rechtlichen Sklavenstatus zu behaupten.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomos, des Sohnes Davids
  rationale: Die Formulierung erhält die dynastisch bedeutsame Abstammungsangabe und fügt sich grammatisch als Apposition in den deutschen Satz ein.
- source_word: וַיִּמְרֹד
  choice: rebellierte
  rationale: מרד bezeichnet den Aufstand gegen eine bestehende Autorität. „Rebellierte“ gibt den politischen Sinn präzise und in modernem Deutsch wieder.
- source_word: עַל אֲדֹנָיו
  choice: gegen seinen Herrn
  rationale: אָדוֹן mit Suffix bezeichnet hier den menschlichen Vorgesetzten Jerobeams, also Salomo. „Seinen Herrn“ bewahrt das ausgedrückte Autoritätsverhältnis; „seinen Gebieter“ bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des auf einen Menschen bezogenen אֲדֹנָיו
  choice: seinen Herrn
  alternative: seinen Gebieter
  rationale: Der Ausdruck bezieht sich auf Salomo, nicht auf Gott. Die Kleinschreibung und das Possessivpronomen machen den menschlichen Bezug deutlich, während „Herrn“ die hierarchische Beziehung wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Abstammungsangaben bleiben sichtbar; „erhob sich und rebellierte“ wahrt sowohl die Bildhaftigkeit von קום als auch die politische Schärfe von מרד.
