source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: de
  text: Die übrigen Taten Abijas, seine Lebensführung und seine Worte sind im Midrasch[a] des Propheten Iddo niedergeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in der Auslegung“, „in der Untersuchung“ beziehungsweise allgemeiner „in der Aufzeichnung“. Das hebräische Wort bezeichnet hier ein schriftliches auslegendes oder untersuchendes Werk, nicht notwendigerweise die später voll entwickelte rabbinische Gattung des Midrasch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: Die übrigen Taten Abijas
  rationale: In der historiografischen Schlussformel bezeichnet דִּבְרֵי nicht nur gesprochene Worte, sondern die Taten und Geschehnisse einer Regierung. „Die übrigen Taten“ gibt diesen Sinn im Deutschen natürlich wieder; וְ wird nicht eigens mit „und“ wiedergegeben, da der deutsche Satzanfang ohne Konjunktion idiomatischer ist.
- source_word: וּדְרָכָיו
  choice: seine Lebensführung
  rationale: Der Plural von דֶּרֶךְ bezeichnet hier Abijas Wege im übertragenen Sinn, also sein Verhalten und seinen Lebenswandel. „Lebensführung“ bewahrt diesen Sinn in klarem, modernem Deutsch.
- source_word: וּדְבָרָיו
  choice: und seine Worte
  rationale: Im Unterschied zu den einleitenden דִּבְרֵי kann דְבָרָיו hier konkreter auf Abijas Äußerungen oder überlieferte Worte bezogen werden. Die wörtliche Wiedergabe lässt zugleich die mögliche weitere Bedeutung „Angelegenheiten“ offen.
- source_word: כְּתוּבִים
  choice: sind … niedergeschrieben
  rationale: Das passive Partizip von כתב bezeichnet, dass diese Dinge schriftlich festgehalten sind. „Niedergeschrieben“ ist im Deutschen natürlich und entspricht der historischen Buchverweisformel.
- source_word: בְּמִדְרַשׁ
  choice: im Midrasch
  rationale: מִדְרָשׁ bezeichnet hier eine untersuchende oder auslegende schriftliche Darstellung. Das deutsche Lehnwort „Midrasch“ erhält den spezifischen hebräischen Ausdruck; eine Fußnote verhindert, dass er vorschnell nur im Sinn der später entwickelten rabbinischen Gattung verstanden wird.
- source_word: הַנָּבִיא עִדּוֹ
  choice: des Propheten Iddo
  rationale: Die Konstruktion ordnet das Werk dem Propheten Iddo zu. Die gewählte Wortstellung ist im Deutschen nach „Midrasch“ natürlich.
theological_decisions: []
