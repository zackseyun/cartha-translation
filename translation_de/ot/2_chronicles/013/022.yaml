  terminology: „Abija“ entspricht der üblichen deutschen Namensform; „Iddo“ und „Midrasch“ sind angemessen. Die Fußnote erläutert den historischen und lexikalischen Umfang von Midrasch ausgewogen, ohne ihn mit der späteren rabbinischen Gattung gleichzusetzen.
