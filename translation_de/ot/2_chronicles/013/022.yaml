  source_fidelity: 'Die Übersetzung gibt die historiographische Formel sachgerecht wieder: „die übrigen Taten“ trifft דִּבְרֵי in diesem Kontext, „seine Lebensführung“ gibt die übertragene Bedeutung von דְּרָכָיו wieder, und „seine Worte“ bewahrt die konkrete wie auch etwas weitere mögliche Bedeutung von דְּבָרָיו. „Sind ... niedergeschrieben“ entspricht כְּתוּבִים, und „im Midrasch des Propheten Iddo“ bildet die hebräische Konstruktion angemessen ab.'
