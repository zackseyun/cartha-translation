  text: וַ/יִּרְדֹּ֣ף אֲבִיָּה֮ אַחֲרֵ֣י יָרָבְעָם֒ וַ/יִּלְכֹּ֤ד מִמֶּ֨/נּוּ֙ עָרִ֔ים אֶת בֵּֽית אֵל֙ וְ/אֶת בְּנוֹתֶ֔י/הָ וְ/אֶת יְשָׁנָ֖ה וְ/אֶת בְּנוֹתֶ֑י/הָ וְ/אֶת עפרון וּ/בְנֹתֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: de
  text: 'Abija verfolgte Jerobeam und eroberte ihm Städte ab: Bethel und seine Tochterstädte, Jeschana und seine Tochterstädte sowie Ephron und seine Tochterstädte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: verfolgte
  rationale: Gibt die militärische Verfolgung Jerobeams natürlich und quellenah wieder.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ עָרִים
  choice: nahm ihm mehrere Städte ab
  rationale: Drückt sowohl die Eroberung als auch den Verlust auf Jerobeams Seite idiomatisch aus; der unbestimmte Plural עָרִים wird mit „mehrere Städte“ wiedergegeben.
- source_word: בְּנוֹתֶיהָ
  choice: Tochterstädte
  rationale: Der wörtliche und historisch passende Ausdruck bezeichnet abhängige Ortschaften im Umfeld einer Hauptstadt.
- source_word: בֵּית אֵל
  choice: Bet-El
  rationale: Transkribiert den hebräischen Ortsnamen transparent und lässt seine Gliederung erkennen.
- source_word: עפרון
  choice: Efron
  rationale: Folgt der masoretischen Konsonantenüberlieferung und der üblichen deutschen Wiedergabe des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die Aufzählung nach dem Doppelpunkt bewahrt die Struktur des Hebräischen; „Tochterstädte“ erhält das antike Siedlungsverhältnis statt es allgemein als umliegende Dörfer aufzulösen.
