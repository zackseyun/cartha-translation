source:
  edition: WLC
  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: de
  text: Da flohen die Israeliten[a] vor Juda, und Gott gab sie in die Gewalt Judas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in ihre Hand“; eine hebräische Wendung für „in ihre Gewalt“. Gemeint ist die Gewalt Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: flohen
  rationale: נוּס bezeichnet hier die Flucht beziehungsweise den Rückzug im Kampf. „Flohen“ ist knapp, natürlich und militärisch passend.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“; als Volksbezeichnung ist im modernen Deutschen „die Israeliten“ klarer und idiomatischer, ohne den historischen Bezug zu verändern.
- source_word: מִפְּנֵי יְהוּדָה
  choice: vor Juda
  rationale: מִפְּנֵי bezeichnet in diesem Kampfzusammenhang das Fliehen vor einem Gegner. „Vor Juda“ bewahrt die kollektive Bezeichnung des hebräischen Textes.
- source_word: וַיִּתְּנֵם
  choice: gab sie
  rationale: Die Form von נתן hat Gott als Subjekt und „sie“ als Objekt. Die direkte Wiedergabe erhält die ausdrücklich ausgesagte göttliche Verursachung des Kampfausgangs.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Text verwendet אֱלֹהִים und nicht den Gottesnamen; deshalb ist „Gott“ die sachgemäße Wiedergabe.
- source_word: בְּיָדָם
  choice: in die Gewalt Judas
  rationale: Wörtlich lautet die hebräische Wendung „in ihre Hand“ und bezeichnet Macht oder Verfügungsgewalt. Die explizite Nennung Judas vermeidet im Deutschen den falschen Eindruck, Gott habe die Israeliten in ihre eigene Hand gegeben.
theological_decisions:
- issue: Göttliches Handeln beim Ausgang der Schlacht
  choice: Gott gab sie in die Gewalt Judas
  alternative: Gott ließ sie in die Gewalt Judas geraten
  rationale: נתן mit Gott als Subjekt schreibt den Ausgang unmittelbar Gottes Handeln zu. Eine bloße Zulassung würde die Aussage unnötig abschwächen.
- issue: Bezeichnung der nördlichen Streitmacht
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: בְנֵי יִשְׂרָאֵל ist hier eine übliche Volksbezeichnung. „Israeliten“ gibt den historischen Gruppenbezug natürlich wieder; die formale Ausdrucksweise wird in der Fußnote dokumentiert.
- issue: Bezug des pluralischen Suffixes in בְּיָדָם
  choice: Juda als kollektiver Bezug
  alternative: ihre Hand
  rationale: Im Kontext bezieht sich das Suffix auf Juda als Kollektiv. Die deutsche Fassung macht diesen Bezug deutlich, während die Fußnote die hebräische Form bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da flohen“ führt die erzählerische Folge natürlich fort. Die kollektive Bezeichnung „Juda“ bleibt erhalten; bei der idiomatischen Wendung wird der Bezug aus Klarheitsgründen ausdrücklich genannt.
