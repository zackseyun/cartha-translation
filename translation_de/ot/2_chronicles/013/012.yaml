  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: de
  text: 'Und seht: Gott ist mit uns an unserer Spitze, und seine Priester sind bei uns, mit den Trompeten für das Kriegssignal, um gegen euch das Signal zu blasen. Ihr Söhne Israels[a], kämpft nicht gegen Jahwe, den Gott eurer Väter; denn ihr werdet keinen Erfolg haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr Israeliten«. Wörtlich: »Söhne Israels«; die maskuline Pluralform dient hier als direkte Anrede an die Israeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und seht
  rationale: Der Aufmerksamkeitsruf wird im Deutschen rhetorisch kräftig und zugleich natürlich wiedergegeben.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: Gott ist mit uns an unserer Spitze
  rationale: Bewahrt sowohl die Aussage der göttlichen Gegenwart als auch das Bild von Gott an der Spitze beziehungsweise als Anführer.
- source_word: וְכֹהֲנָיו
  choice: und seine Priester sind bei uns
  rationale: Das Possessivpronomen bezieht sich auf Gott; das ergänzte Verb macht die koordinierte hebräische Nominalfügung im Deutschen verständlich.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: mit den Trompeten für das Kriegssignal
  rationale: חֲצֹצְרוֹת bezeichnet Trompeten, während תְּרוּעָה hier ein lautes militärisches Signal meint. Die Zweckbestimmung bleibt von der folgenden Verbhandlung unterschieden.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: um gegen euch das Signal zu blasen
  rationale: Gibt den Zweckinfinitiv und die feindlich gegen die Angesprochenen gerichtete Signalhandlung gesondert wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Ihr Söhne Israels
  rationale: Bewahrt die wörtliche maskuline Anrede; eine im Deutschen geläufigere inklusive Wiedergabe steht in der Fußnote.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: kämpft nicht gegen Jahwe
  rationale: Nach dem Verb für kämpfen hat עִם adversative Bedeutung. Das Tetragramm wird als Jahwe wiedergegeben.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: den Gott eurer Väter
  rationale: Bewahrt die traditionelle Bundesformel klar und unmittelbar.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: denn ihr werdet keinen Erfolg haben
  rationale: Das Hifil von צלח bezeichnet Gelingen oder Erfolg; die Formulierung lässt den militärischen Bezug erkennen, ohne die Bedeutung auf Sieg zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Jahwe wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname sichtbar bleibt.
- issue: Geschlechtsspezifische Anrede בְּנֵי יִשְׂרָאֵל
  choice: Ihr Söhne Israels
  alternative: Ihr Israeliten
  rationale: Die Hauptübersetzung bewahrt die grammatisch maskuline Form und ihre direkte rhetorische Wirkung; die geläufigere ethnische Anrede wird als Alternative genannt.
- issue: Gott an der Spitze Judas
  choice: Gott ist mit uns an unserer Spitze
  alternative: Gott ist mit uns als unser Anführer
  rationale: Die bildhafte Ortsangabe בָרֹאשׁ wird nicht auf eine ausschließlich abstrakte Leitungsfunktion reduziert; sowohl Führung als auch Stellung an der Spitze bleiben hörbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt eindringlich und militärisch geprägt. Der Aufmerksamkeitspartikel wird mit »Und seht« statt mit dem heute altertümlichen »siehe« wiedergegeben; die beiden hebräischen Ausdrücke für Kriegssignal und Signalblasen bleiben syntaktisch getrennt.
