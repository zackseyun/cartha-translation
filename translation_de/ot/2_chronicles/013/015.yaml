base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: de
  text: Da erhoben die Männer von Juda das Kriegsgeschrei. Und als die Männer von Juda das Kriegsgeschrei erhoben, schlug Gott Jerobeam und ganz Israel vor Abija und Juda nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: erhoben das Kriegsgeschrei / das Kriegsgeschrei erhoben
  rationale: Das Verb רוע bezeichnet hier im militärischen Zusammenhang einen lauten Kampf- oder Siegesruf. „Kriegsgeschrei“ gibt diesen Kontext klar und idiomatisch wieder und bewahrt die Wiederholung des Hebräischen.
- source_word: אִישׁ יְהוּדָה
  choice: die Männer von Juda
  rationale: Das kollektiv gebrauchte אִישׁ bezeichnet hier die Männer beziehungsweise Kämpfer Judas; die deutsche Pluralform ist natürlich und sachgerecht.
- source_word: נָגַף
  choice: schlug
  rationale: נגף bezeichnet das Schlagen beziehungsweise Niederwerfen eines Gegners. „Schlug“ wahrt die knappe Formulierung und lässt das genaue Ausmaß der Niederlage offen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die räumlich-relationale Wendung bedeutet hier, dass Jerobeam und Israel angesichts beziehungsweise vor Abija und Juda geschlagen wurden. Die formnahe Wiedergabe „vor“ bewahrt diese Relation.
theological_decisions:
- issue: Göttliches Handeln im Ausgang der Schlacht
  choice: „Gott schlug Jerobeam und ganz Israel“ als unmittelbare Aussage beibehalten
  alternative: „Gott ließ Jerobeam und ganz Israel eine Niederlage erleiden“
  rationale: Der hebräische Text nennt Gott ausdrücklich als handelndes Subjekt von נָגַף. Eine bloß mittelbare oder permissive Umschreibung würde diese Aussage abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung des Kriegsgeschreis wurde entsprechend der hebräischen Erzählstruktur erhalten; „ganz Israel“ gibt die kollektive Darstellung des Textes wieder.
