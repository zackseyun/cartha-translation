base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: de
  text: Abija und sein Volk fügten ihnen einen schweren Schlag zu[a], und 500.000 auserlesene Männer Israels fielen erschlagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen großen Schlag“; auch möglich: „einen schweren Schlag“ oder „ein großes Gemetzel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „500.000 ausgewählte Männer Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: brachten ihnen … bei
  rationale: נכה bezeichnet im Kampf ein Schlagen beziehungsweise Besiegen. Zusammen mit מַכָּה ergibt die deutsche Wendung „eine Niederlage beibringen“ eine natürliche Wiedergabe, ohne den anschließenden Bericht über die Gefallenen vorwegzunehmen.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Abija und sein Volk
  rationale: עַם bedeutet wörtlich „Volk“ und bezeichnet hier die Männer, die mit Abija kämpften. „Sein Volk“ bewahrt die Ausdrucksweise des Hebräischen, statt sie auf „Heer“ zu verengen.
- source_word: מַכָּה רַבָּה
  choice: eine schwere Niederlage
  rationale: Die Wendung bedeutet wörtlich „einen großen Schlag“, kann im militärischen Zusammenhang aber eine schwere Niederlage oder ein großes Gemetzel bezeichnen. „Schwere Niederlage“ ist im modernen Deutschen natürlich und erhält die militärische Aussage.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: fielen … als Gefallene
  rationale: 'נפל und חָלָל bilden eine nachdrückliche Kampfformulierung: Sie „fielen“ als Erschlagene. Die Wiedergabe erhält beide hebräischen Elemente, ohne das im Deutschen missverständliche „fielen erschlagen“ zu verwenden.'
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition מן kennzeichnet die Gruppe, aus der die Gefallenen stammten. „Von Israel“ gibt dies knapp wieder.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: '500.000'
  rationale: Die Zahl wird entsprechend dem masoretischen Text unverändert wiedergegeben.
- source_word: אִישׁ בָּחוּר
  choice: ausgewählte Männer
  rationale: בָּחוּר kann einen jungen Mann beziehungsweise einen ausgewählten, kampftüchtigen Mann bezeichnen. Im Kontext einer Truppenstärke trifft „ausgewählte Männer“ den Sinn von ausgesuchten Soldaten, ohne zusätzliche Tapferkeit zu unterstellen.
theological_decisions:
- issue: Außergewöhnlich hohe Zahl der Gefallenen
  choice: Die im hebräischen Text genannte Zahl von 500.000 wird unverändert beibehalten.
  alternative: Die Zahl als rhetorische Übertreibung, als Bezeichnung militärischer Einheiten oder aufgrund einer vermuteten Textänderung geringer wiederzugeben.
  rationale: Der vorliegende masoretische Text nennt die Zahl unmittelbar und enthält kein sprachliches Signal für eine symbolische oder reduzierte Deutung. Historische Fragen werden daher nicht durch die Übersetzung entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Formulierung ist klar und gut verständlich; die ungewöhnlich hohe Zahl und die Spannung zwischen dem allgemeinen Schlagergebnis und den ausdrücklich genannten Gefallenen bleiben erhalten.
