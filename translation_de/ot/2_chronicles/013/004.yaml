  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: de
  text: 'Da stellte sich Abija auf dem Berg Zemaraim, der im Bergland Ephraim liegt,[a] hin und sagte: »Hört mich an, Jerobeam und ganz Israel!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der im Gebirge Ephraim liegt«. Der hebräische Ausdruck kann das ephraimitische Bergland beziehungsweise die gebirgige Region bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stellte sich Abija
  rationale: קום bezeichnet hier das Aufstehen beziehungsweise Sich-Hinstellen vor einer Rede. »Stellte sich« gibt die Szene natürlich wieder, ohne einen ausdrücklich militärischen Sinn hinzuzufügen.
- source_word: מֵעַל לְהַר צְמָרַיִם
  choice: auf den Berg Zemaraim
  rationale: Die ungewöhnliche Präpositionsfolge bezeichnet idiomatisch Abijas Standort auf der Anhöhe. Der Ortsname wird nach üblicher deutscher Form als »Zemaraim« wiedergegeben.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: der im Bergland Ephraim liegt
  rationale: הַר bezeichnet hier wahrscheinlich die gebirgige Region Ephraims und nicht einen einzelnen Berg. »Bergland Ephraim« ist eine natürliche, geografisch passende Wiedergabe.
- source_word: שְׁמָעוּנִי
  choice: Hört mich an
  rationale: Der Imperativ von שמע mit Suffix der ersten Person verlangt direkt zum aufmerksamen Zuhören auf und bewahrt den feierlichen rhetorischen Nachdruck.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jerobeam und ganz Israel
  rationale: Die direkte Anrede und die nationale Bezeichnung werden eng am Hebräischen bewahrt. »Ganz Israel« ist im Deutschen idiomatisch und erhält die umfassende Aussage.
theological_decisions:
- issue: Bezeichnung Israels im Zusammenhang des geteilten Reiches
  choice: ganz Israel
  alternative: alle Israeliten
  rationale: Der hebräische Text verwendet unmittelbar den nationalen und bundesgeschichtlich geprägten Namen יִשְׂרָאֵל. Die Wiedergabe »ganz Israel« bewahrt die politische und theologische Spannung, ohne die Bezeichnung auf ethnische Zugehörigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; Eigennamen folgen gebräuchlichen deutschen Bibelformen.
