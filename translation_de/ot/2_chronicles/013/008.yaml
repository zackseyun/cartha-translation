source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: de
  text: Und nun sagt ihr, ihr wollt euch dem Königreich Jahwes entgegenstellen, das in der Hand der Söhne Davids ist[a], und ihr seid eine große Menge und habt die goldenen Kälber bei euch, die Jerobeam euch als Götter gemacht hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Hand der Söhne Davids“. Die Wendung kann Herrschaft oder Verwaltung durch die Nachkommen Davids bezeichnen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „zu Göttern gemacht“. Das Hebräische steht im Plural und bezeichnet polemisch Jerobeams Kälberbilder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: meint ihr
  rationale: Das Partizip bezeichnet hier die gegenwärtige Auffassung oder Absicht der Angeredeten. „Meint ihr“ gibt die rhetorische Anklage im Deutschen natürlich wieder, ohne sie auf bloßes Sprechen einzuengen.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: ihr könntet euch … entgegenstellen
  rationale: Der Hitpael von חזק bezeichnet ein Sich-stark-Machen; zusammen mit לִפְנֵי liegt im militärischen Zusammenhang die Konfrontation nahe. Die Formulierung bewahrt den Versuch beziehungsweise Anspruch, ohne einen Erfolg vorwegzunehmen.
- source_word: מַמְלֶכֶת יְהוָה
  choice: dem Königreich Jahwes
  rationale: Die Wendung bezeichnet Jahwes Königsherrschaft beziehungsweise Reich in seiner Verbindung mit der davidischen Dynastie. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: das in der Hand der Söhne Davids ist
  rationale: Die wörtliche Bildsprache „in der Hand“ bleibt erhalten und wahrt die Spannung zwischen Jahwes eigenem Königreich und seiner Verwaltung durch die davidische Linie.
- source_word: הָמוֹן רָב
  choice: eine große Menge
  rationale: Die Wendung betont die zahlenmäßige Überlegenheit des Heeres und lässt sich im Deutschen klar und würdig so wiedergeben.
- source_word: עֶגְלֵי זָהָב
  choice: die goldenen Kälber
  rationale: Die geläufige deutsche Bezeichnung identifiziert klar Jerobeams bekannte Kultbilder.
- source_word: לֵאלֹהִים
  choice: zu Göttern
  rationale: Die pluralische Form wird beibehalten und bezeichnet polemisch die Rolle, die Jerobeam den Kälberbildern als verehrten Gottheiten gab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname sichtbar bleibt.
- issue: Verhältnis von Jahwes Königreich und der davidischen Dynastie
  choice: „dem Königreich Jahwes …, das in der Hand der Söhne Davids ist“
  alternative: „Jahwes Königreich unter der Herrschaft der Söhne Davids“
  rationale: Die gewählte Fassung bewahrt die Aussage, dass das Königreich Jahwe gehört und zugleich durch Davids Nachkommen ausgeübt beziehungsweise verwaltet wird, ohne dieses Verhältnis weiter auszudeuten.
- issue: Bezeichnung der goldenen Kälber als אֱלֹהִים
  choice: „zu Göttern gemacht“
  alternative: „als Götter gemacht“
  rationale: Der Plural und die polemische Benennung der Kultbilder bleiben erhalten; die Übersetzung bestätigt damit nicht ihre tatsächliche Göttlichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der polemische Ton der Rede Abijas bleiben erhalten; die hebräische Bildsprache „in der Hand“ wird im Haupttext bewahrt und in der Fußnote erläutert.
