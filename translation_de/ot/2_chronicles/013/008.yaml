revisions:
- from: Und nun meint ihr, ihr könntet euch dem Königreich Jahwes entgegenstellen, das in der Hand der Söhne Davids ist[a]. Ihr seid zwar eine große Menge und habt die goldenen Kälber bei euch, die Jerobeam euch zu Göttern gemacht hat[b].
  to: Und nun sagt ihr, ihr wollt euch dem Königreich Jahwes entgegenstellen, das in der Hand der Söhne Davids ist[a], und ihr seid eine große Menge und habt die goldenen Kälber bei euch, die Jerobeam euch als Götter gemacht hat[b].
  rationale: Die Überarbeitung stellt die Aussagefolge und den rhetorischen Anspruch des Hebräischen genauer dar, entfernt die unbegründete konzessive Nuance und beseitigt die Mehrdeutigkeit der deutschen Wendung „euch zu Göttern gemacht“. Die Spannung, dass das Königreich Jahwe gehört und zugleich „in der Hand der Söhne Davids“ ist, bleibt unverändert erhalten.
