  text: וַ/יֶּאְסֹ֨ר אֲבִיָּ֜ה אֶת הַ/מִּלְחָמָ֗ה בְּ/חַ֨יִל֙ גִּבּוֹרֵ֣י מִלְחָמָ֔ה אַרְבַּע מֵא֥וֹת אֶ֖לֶף אִ֣ישׁ בָּח֑וּר וְ/יָרָבְעָ֗ם עָרַ֤ךְ עִמּ/וֹ֙ מִלְחָמָ֔ה בִּ/שְׁמוֹנֶ֨ה מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ בָּח֖וּר גִּבּ֥וֹר חָֽיִל־־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: de
  text: Abija trat mit einer Streitmacht von 400.000 ausgewählten Männern, kampfstarken Kriegern, zur Schlacht an. Jerobeam stellte sich ihm mit 800.000 ausgewählten Männern, tapferen Kriegern,[a] zum Kampf entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Militärbezeichnung kann auch mit »starken Kriegern« oder »wehrfähigen Männern« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: eröffnete den Kampf
  rationale: Die wörtliche Bedeutung von אסר ist »binden«; zusammen mit מִלְחָמָה liegt jedoch eine militärische Wendung für das Aufnehmen bzw. Beginnen des Kampfes vor. »Eröffnete den Kampf« gibt sie in natürlichem Deutsch wieder, ohne das unverständliche Bild wörtlich nachzubilden.
- source_word: בְּחַיִל
  choice: mit einer Streitmacht
  rationale: חַיִל bezeichnet hier angesichts der folgenden Truppenzahl eine militärische Streitmacht, nicht Tapferkeit oder Besitz.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: kampferprobten Kriegern
  rationale: Die Verbindung bezeichnet starke, bewährte Kriegsmänner. »Kampferprobte Krieger« ist modern und bringt ihre militärische Tüchtigkeit zum Ausdruck.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ בָּחוּר
  choice: 400.000 ausgewählten Männern
  rationale: בָּחוּר bezeichnet hier ausgewählte beziehungsweise erlesene Soldaten; die ausdrückliche Zählung der Männer bleibt erhalten.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: stellte sich ihm ... zur Schlacht
  rationale: ערך bezeichnet im militärischen Zusammenhang das Aufstellen bzw. Ordnen zur Schlacht. Die deutsche Formulierung bewahrt sowohl die Gefechtsaufstellung als auch die Gegnerschaft.
- source_word: בִּשְׁמוֹנֶה מֵאוֹת אֶלֶף אִישׁ בָּחוּר
  choice: mit 800.000 ausgewählten Männern
  rationale: Die Truppenstärke und die Kennzeichnung als ausgewählte Männer werden direkt wiedergegeben.
- source_word: גִּבּוֹר חָיִל
  choice: tüchtigen Kriegern
  rationale: Die geläufige hebräische Militärbezeichnung meint tapfere, leistungsfähige Kämpfer. »Tüchtige Krieger« bewahrt diesen Sinn in verständlichem modernem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärischen Wendungen werden idiomatisch, aber nahe an der hebräischen Bild- und Bedeutungswelt wiedergegeben. Die sehr hohen Truppenzahlen bleiben ohne Harmonisierung oder historische Bewertung stehen.
