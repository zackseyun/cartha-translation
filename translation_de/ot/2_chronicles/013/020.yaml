source:
  edition: WLC
  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: de
  text: Jerobeam hatte zur Zeit Abijas keine Macht mehr. Und Jahwe[a] schlug ihn, und er starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe suchte ihn heim« oder »Jahwe schlug ihn mit einer Plage«. Das hebräische Verb nennt die genaue Art des Schlages nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: blieb … bei Kräften
  rationale: Die Verbindung bezeichnet hier, dass Jerobeam seine Kraft beziehungsweise Macht nicht weiter bewahren konnte. Die deutsche Wendung ist natürlich und lässt offen, ob vor allem persönliche Kraft oder politische und militärische Stärke gemeint ist.
- source_word: עוֹד
  choice: nicht mehr
  rationale: In Verbindung mit der Verneinung gibt עוֹד idiomatisch den Sinn „nicht länger/nicht mehr“ wieder.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: zur Zeit Abijas
  rationale: Die gebräuchliche deutsche Zeitangabe gibt den hebräischen Ausdruck verständlich als Zeitspanne der Herrschaft beziehungsweise Lebenszeit Abijas wieder.
- source_word: וַיִּגְּפֵהוּ
  choice: schlug ihn
  rationale: נגף kann einen göttlichen Schlag, eine Plage oder eine Niederlage bezeichnen. „schlug ihn“ bewahrt die fehlende Spezifizierung des Mittels.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die einfache narrative Folge wird direkt wiedergegeben, ohne ausdrücklich eine engere kausale oder zeitliche Beziehung festzulegen.
theological_decisions:
- issue: Art des göttlichen Handelns in וַיִּגְּפֵהוּ יְהוָה
  choice: Jahwe schlug Jerobeam; anschließend starb er. Das genaue Mittel bleibt unbestimmt.
  alternative: Jahwe ließ ihn durch Krankheit, eine Plage oder einen unmittelbaren Gerichtsschlag sterben.
  rationale: Der hebräische Text schreibt das Geschehen unmittelbar Jahwe zu, nennt aber weder Krankheit noch Schlacht oder ein anderes konkretes Mittel. Die Übersetzung erhält diese Spannung und legt die Abfolge nicht genauer aus als der Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „blieb … bei Kräften“ ist idiomatisch, erhält aber die mögliche Spannweite zwischen persönlicher Kraft und politisch-militärischer Macht. Der Satzbau bildet die hebräische Erzählfolge klar ab.
