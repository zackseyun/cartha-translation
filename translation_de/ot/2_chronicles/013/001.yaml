  text: בִּ/שְׁנַ֛ת שְׁמוֹנֶ֥ה עֶשְׂרֵ֖ה לַ/מֶּ֣לֶךְ יָרָבְעָ֑ם וַ/יִּמְלֹ֥ךְ אֲבִיָּ֖ה עַל יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/001.yaml
  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: de
  text: Im achtzehnten Regierungsjahr des Königs Jerobeam[a] wurde Abija König über Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 1. Könige 15,1 wird Abija „Abijam“ genannt; hier in der Chronik steht „Abija“.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Im achtzehnten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das achtzehnte Jahr der Herrschaft Jerobeams. „Regierungsjahr“ macht den Bezug im Deutschen klar und idiomatisch.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: König Jerobeams
  rationale: Das Präfix ל kennzeichnet in dieser Formel den Herrscher, dessen Regierungsjahre gezählt werden. Der deutsche Genitiv gibt dies natürlich wieder.
- source_word: וַ/יִּמְלֹךְ
  choice: wurde … König
  rationale: Die Verbform bezeichnet hier den Herrschaftsantritt. „Wurde König“ bewahrt diesen ingressiven Sinn klarer als das bloße „regierte“.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: Der Personenname wird entsprechend der hier im Chroniktext stehenden Form אֲבִיָּה in der üblichen deutschen Namensform wiedergegeben.
- source_word: עַל יְהוּדָה
  choice: über Juda
  rationale: Mit מלך bezeichnet עַל das Gebiet beziehungsweise Volk, über das jemand herrscht; „über Juda“ ist die direkte und geläufige deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe chronistische Datierungsformel bleibt erhalten; „Regierungsjahr“ sorgt für unmittelbare Verständlichkeit.
