base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: de
  text: Und Abija erstarkte[a]. Er nahm sich vierzehn Frauen[b] und zeugte zweiundzwanzig Söhne und sechzehn Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde mächtig“ oder „stärkte sich“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „sich Frauen nehmen“ bedeutet hier, sie zu heiraten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: erstarkte
  rationale: Das Hitpael von חזק bezeichnet hier ein Starkwerden oder Sich-Festigen. „Erstarkte“ ist im Deutschen natürlich und lässt offen, ob vor allem politische, militärische oder persönliche Stärke gemeint ist.
- source_word: אֲבִיָּהוּ
  choice: Abija
  rationale: „Abija“ ist die im Deutschen etablierte Form des hebräischen Personennamens.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: Er nahm sich vierzehn Frauen
  rationale: Die Formulierung bleibt nahe am hebräischen Ausdruck und bewahrt die Nuance von לוֹ („sich“). In diesem Zusammenhang ist sie idiomatisch im Sinn einer Eheschließung zu verstehen.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet bei einem männlichen Subjekt das Zeugen von Kindern. „Zeugte“ ist präzise und im Deutschen weiterhin verständlich.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: zweiundzwanzig Söhne
  rationale: Die konkrete Zahl und die geschlechtsspezifische Bezeichnung werden direkt wiedergegeben.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: und sechzehn Töchter
  rationale: Die konkrete Zahl und die geschlechtsspezifische Bezeichnung werden direkt wiedergegeben.
theological_decisions:
- issue: Darstellung der Vielehe
  choice: Die Handlung wird ohne moralischen Zusatz sachlich mit „Er nahm sich vierzehn Frauen“ wiedergegeben.
  alternative: „Er heiratete vierzehn Frauen“ oder eine Übersetzung mit ausdrücklicher ethischer Wertung.
  rationale: Der Vers berichtet Abijas Handeln, ohne es ausdrücklich zu loben oder zu verurteilen. Die Übersetzung bewahrt diese Spannung und fügt keine konfessionelle oder ethische Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erstarkte“ wahrt die Bedeutungsbreite des hebräischen Verbs; „nahm sich … Frauen“ hält die hebräische Ausdrucksweise fest, während die Fußnote ihre idiomatische Bedeutung erklärt.
