source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: de
  text: Habt ihr nicht die Priester Jahwes, die Söhne Aarons und die Leviten vertrieben und euch Priester eingesetzt wie die Völker der Länder? Jeder, der mit einem jungen Stier und sieben Widdern kommt, um sich zum Priesterdienst einsetzen zu lassen[a], wird Priester für Nichtgötter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Hand zu füllen«; eine feste Wendung für die Einsetzung oder Weihe zum Priesterdienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »für das, was keine Götter sind«. Das Hebräische bestreitet ausdrücklich, dass diese verehrten Wesen oder Dinge wirklich Götter sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Habt ihr nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet, und bewahrt ihren vorwurfsvollen Ton.
- source_word: הִדַּחְתֶּם
  choice: vertrieben
  rationale: Das Hifil von נדח bezeichnet ein erzwungenes Entfernen oder Verstoßen; „vertrieben“ ist präzise und natürlich.
- source_word: כֹּהֲנֵי יְהוָה
  choice: die Priester Jahwes
  rationale: Die Status-constructus-Verbindung wird direkt wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: בְּנֵי אַהֲרֹן וְהַלְוִיִּם
  choice: die Söhne Aarons, und die Leviten
  rationale: Bewahrt die ausdrückliche Nennung sowohl der aaronitischen Priesterlinie als auch der Leviten. Das Komma verdeutlicht, dass die Leviten nicht als „Söhne Aarons“ bezeichnet werden.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: und euch Priester eingesetzt
  rationale: עשה bedeutet hier im Zusammenhang die Bestellung in ein Amt; „euch“ bewahrt die selbstbezogene Nuance von לָכֶם.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: wie die Völker der anderen Länder
  rationale: Natürliches Deutsch für den Vergleich mit den umgebenden Völkern, ohne den wertenden Begriff „Heiden“ einzutragen.
- source_word: כָּל הַבָּא
  choice: Jeder, der … kommt
  rationale: Gibt die generische Einzahl und die Kritik am offenen Zugang zum Priesteramt wieder.
- source_word: לְמַלֵּא יָדוֹ
  choice: um sich zum Priesterdienst einsetzen zu lassen
  rationale: Die wörtliche Wendung „seine Hand füllen“ ist ein Fachausdruck für Einsetzung beziehungsweise Weihe. Die Wiedergabe vermittelt die kultische Bedeutung, ohne fälschlich zu behaupten, der Anwärter vollziehe die Einsetzung selbst.
- source_word: בְּפַר בֶּן בָּקָר וְאֵילִם שִׁבְעָה
  choice: mit einem jungen Stier und sieben Widdern
  rationale: Direkte, im Deutschen natürliche Wiedergabe der für das Verfahren mitgebrachten Tiere.
- source_word: וְהָיָה כֹהֵן לְלֹא אֱלֹהִים
  choice: wird Priester für Nicht-Götter
  rationale: „Wird Priester“ drückt den resultierenden Status aus; „Nicht-Götter“ bewahrt die polemische Verneinung ihrer Göttlichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von לְלֹא אֱלֹהִים
  choice: für Nicht-Götter
  alternative: für falsche Götter / für das, was keine Götter sind
  rationale: Die knappe Formulierung hält an der ausdrücklichen Bestreitung wahrer Göttlichkeit fest. „Für“ gibt das לְ wieder, ohne zwischen Dienstzugehörigkeit und Zweckbeziehung enger zu entscheiden.
- issue: Agent der Einsetzung in לְמַלֵּא יָדוֹ
  choice: sich … einsetzen zu lassen
  alternative: seine Hand zu füllen / sich selbst zu weihen
  rationale: Das Hebräische bezeichnet idiomatisch die Einsetzung ins Priesteramt, legt hier aber nicht ausdrücklich fest, dass der Bewerber die Weihe eigenmächtig an sich selbst vollzieht. Die gewählte Form vermeidet diese Überinterpretation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe der Anklage und die polemische Bezeichnung „Nicht-Götter“ bleiben erhalten. Fachsprachlich unverständliches wörtliches Deutsch wird im Haupttext behutsam erschlossen und in der Fußnote dokumentiert.
