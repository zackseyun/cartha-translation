source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: de
  text: 'Wir aber: Jahwe ist unser Gott, und wir haben ihn nicht verlassen. Die Priester, die Jahwe dienen, sind die Söhne Aarons, und die Leviten verrichten ihre Arbeit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und die Leviten bei der Arbeit“; gemeint ist ihr zugewiesener Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Wir aber
  rationale: Das selbstständige Pronomen mit der Konjunktion hebt im Kontext den Gegensatz zum Nordreich hervor; „Wir aber“ gibt diesen Diskurskontrast knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Wegen des singularischen Bezugs auf Jahwe bezeichnet die formal plurale Form hier den Gott Israels im Singular.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: und wir haben ihn nicht verlassen
  rationale: עזב bedeutet „verlassen, im Stich lassen“. Das deutsche Perfekt bringt die bis zur Gegenwart behauptete Treue idiomatisch zum Ausdruck.
- source_word: מְשָׁרְתִים לַיהוָה
  choice: die Jahwe dienen
  rationale: Das Partizip bezeichnet den fortdauernden priesterlichen Dienst; „dienen“ ist im Deutschen natürlich und wahrt den kultischen Zusammenhang.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die formale Wiedergabe bewahrt die Aussage über die erbliche priesterliche Linie; gemeint sind Aarons Nachkommen.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: und die Leviten verrichten ihre Arbeit
  rationale: Der hebräische Nominalsatz besagt, dass die Leviten mit ihrer zugewiesenen Arbeit beziehungsweise ihrem Dienst befasst sind. Die verbale deutsche Formulierung ist verständlich, ohne die Aufgabe enger zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Aussagewert von עֲזַבְנֻהוּ
  choice: wir haben ihn nicht verlassen
  alternative: wir verließen ihn nicht
  rationale: Die Perfektform trägt hier eine bis zur Redesituation fortwirkende Behauptung der Bundestreue; das deutsche Perfekt gibt dies natürlich wieder.
- issue: Bedeutung von בַּמְלָאכֶת
  choice: verrichten ihre Arbeit
  alternative: sind bei ihrem Dienst
  rationale: מְלָאכָה kann Arbeit, Aufgabe oder Dienst bezeichnen. Der Tempelkontext legt zugewiesenen levitischen Dienst nahe, doch die Übersetzung wahrt den allgemeineren Wortlaut; die Fußnote erläutert den Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wir aber“ erhält den rhetorischen Gegensatz; kurze Hauptsätze machen die öffentliche Rede gut verständlich. „Söhne Aarons“ wahrt die formale Abstammungssprache, während die Fußnote die knappe hebräische Wendung zum levitischen Dienst erläutert.
