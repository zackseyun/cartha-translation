base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: de
  text: Drei Jahre regierte er in Jerusalem. Seine Mutter hieß Michaja, eine Tochter Uriels aus Gibea.[a] Und zwischen Abija und Jerobeam herrschte Krieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 1. Könige 15,2 heißt Abijas Mutter Maacha. Das hebräische Wort für „Tochter“ kann auch allgemeiner eine weibliche Nachfahrin bezeichnen; daher könnten den beiden Angaben unterschiedliche Namens- oder Abstammungskonventionen zugrunde liegen.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet das Regieren beziehungsweise Königsein. „Regierte“ ist in einer Königsnotiz natürlich und präzise.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die hebräische Namensformel wird in natürliches modernes Deutsch übertragen, ohne ihren Aussagegehalt zu verändern.
- source_word: מִיכָיָהוּ
  choice: Michaja
  rationale: „Michaja“ ist die geläufige deutsche Wiedergabe dieses hebräischen Personennamens.
- source_word: בַת אוּרִיאֵל
  choice: eine Tochter Uriels
  rationale: Die Konstruktverbindung bezeichnet unmittelbar die Abstammung. Das deutsche „eine Tochter Uriels“ bewahrt diese Aussage.
- source_word: מִן גִּבְעָה
  choice: aus Gibea
  rationale: Die Präposition מִן bezeichnet hier die Herkunft; „aus Gibea“ gibt sie ausdrücklich und idiomatisch wieder.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Und … herrschte Krieg
  rationale: Die schlichte Existenz-Aussage „und Krieg war“ wird natürlich wiedergegeben, ohne einen Beginn oder Verlauf des Krieges hinzuzufügen.
- source_word: בֵּין ... וּבֵין
  choice: zwischen … und …
  rationale: Dies ist die übliche deutsche Entsprechung der hebräischen Paarformel für zwei einander gegenüberstehende Parteien.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: Die Namensform des Chronikbuchs wird beibehalten und nicht an die abweichende Tradition im Königebuch angeglichen.
theological_decisions:
- issue: Abweichende Namens- und Abstammungsangabe zur Mutter Abijas in der Parallelüberlieferung
  choice: 'Im Haupttext bleibt die Angabe des Chroniktextes stehen: „Michaja; sie war eine Tochter Uriels aus Gibea“.'
  alternative: Den Namen an „Maacha“ in 1. Könige 15,2 angleichen oder „Tochter“ ausdrücklich als Enkelin beziehungsweise Nachfahrin deuten.
  rationale: Der masoretische Text wird ohne Harmonisierung übersetzt. בַת kann in genealogischen Zusammenhängen weiter gefasst sein, doch der Vers selbst sagt schlicht „Tochter“; mögliche Erklärungen gehören in die Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle deutsche Schreibung der biblischen Namen wird verwendet. Die beiden hebräischen Sätze werden klar und natürlich wiedergegeben; die abschließende Konjunktion „Und“ bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei der betreffenden genealogischen Angabe.
