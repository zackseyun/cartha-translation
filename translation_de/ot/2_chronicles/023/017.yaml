  text: וַ/יָּבֹ֨אוּ כָל הָ/עָ֤ם בֵּית הַ/בַּ֨עַל֙ וַֽ/יִּתְּצֻ֔/הוּ וְ/אֶת מִזְבְּחֹתָ֥י/ו וְ/אֶת צְלָמָ֖י/ו שִׁבֵּ֑רוּ וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֥י הַֽ/מִּזְבְּחֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: de
  text: Da ging das ganze Volk zum Baalstempel und riss ihn nieder. Sie zerschlugen seine Altäre und seine Götterbilder und töteten Mattan, den Priester des Baal, vor den Altären.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: Baalstempel
  rationale: Wörtlich »Haus des Baal«; im Kontext bezeichnet der Ausdruck das Heiligtum beziehungsweise den Tempel des Baal. »Baalstempel« ist im modernen Deutschen klar und natürlich.
- source_word: וַיִּתְּצֻהוּ
  choice: riss ihn nieder
  rationale: Das Verb bezeichnet hier die Zerstörung beziehungsweise den Abbruch des Baalstempels; »niederreißen« gibt die gewaltsame Handlung treffend wieder.
- source_word: צְלָמָיו
  choice: seine Götterbilder
  rationale: Das Wort bezeichnet kultische Bildwerke. »Götterbilder« macht ihre religiöse Funktion verständlich, ohne näher festzulegen, ob es Statuen oder andere Darstellungen waren.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: vor den Altären
  rationale: Entspricht der räumlichen Grundbedeutung der hebräischen Präposition und bewahrt die knappe Darstellung des Ausgangstextes.
theological_decisions:
- issue: Bezug der Possessivsuffixe bei »seine Altäre« und »seine Götterbilder«
  choice: Die Pronomen beziehen sich auf Baal.
  alternative: Die Pronomen könnten grammatisch auf den Baalstempel bezogen und daher mit »dessen Altäre und Bilder« wiedergegeben werden.
  rationale: Im Hebräischen sind die Suffixe maskulin Singular und nehmen am natürlichsten Baal als Bezugswort auf. Die deutsche Wiedergabe wahrt diese Personifizierung, ohne darüber hinaus eine theologische Aussage einzuführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Kurze Hauptsätze erhalten die energische Abfolge der hebräischen Erzählung; »Baalstempel« vermeidet das im Deutschen missverständliche wörtliche »Haus des Baal«.
