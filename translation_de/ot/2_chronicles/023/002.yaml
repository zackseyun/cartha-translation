  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: de
  text: Sie zogen durch Juda und versammelten die Leviten aus allen Städten Judas sowie die Oberhäupter der Vaterhäuser[a] Israels und kamen nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Oberhäupter der Großfamilien oder Sippen Israels.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ בִּיהוּדָה
  choice: Sie zogen durch Juda
  rationale: סבב bezeichnet hier das Umherziehen durch ein Gebiet zur Erfüllung eines Auftrags. „Durch Juda ziehen“ gibt die Bewegung natürlich und ohne unnötige Ergänzung wieder.
- source_word: וַיִּקְבְּצוּ
  choice: versammelten
  rationale: קבץ bedeutet, Menschen zusammenzubringen. „Versammelten“ passt zum erzählerischen Zusammenhang und zu beiden genannten Personengruppen.
- source_word: אֶת הַלְוִיִּם מִכָּל עָרֵי יְהוּדָה
  choice: die Leviten aus allen Städten Judas
  rationale: Die Formulierung bewahrt sowohl die Herkunftsangabe aus dem gesamten Gebiet als auch die übliche deutsche Bezeichnung „Leviten“.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: und die Oberhäupter der Vaterhäuser
  rationale: Die Wiedergabe erhält die besondere hebräische Verwandtschafts- und Verwaltungsbezeichnung, während „Oberhäupter“ die Leitungsfunktion verständlich ausdrückt.
- source_word: לְיִשְׂרָאֵל
  choice: Israels
  rationale: Das ל bezeichnet hier Zugehörigkeit beziehungsweise Beziehung. „Israels“ bewahrt ausdrücklich den Wortlaut, ohne ihn auf Juda einzuengen.
- source_word: וַיָּבֹאוּ אֶל יְרוּשָׁלִָם
  choice: Dann kamen sie nach Jerusalem
  rationale: בוא mit אֶל bezeichnet das Kommen zu einem Ort. „Nach Jerusalem kommen“ ist die natürliche deutsche Ortskonstruktion; „Dann“ bildet den erzählerischen Fortgang des וַ ab.
theological_decisions:
- issue: Bedeutungsumfang von „Israel“ in einem auf Juda bezogenen Zusammenhang
  choice: Israel im Haupttext unverändert beibehalten
  alternative: Juda; das Volk Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel. Eine Einengung auf Juda oder eine erklärende Umschreibung würde die im Chronikbuch bewusst verwendete theologische und nationale Bezeichnung interpretierend verändern.
- issue: Wiedergabe der Verwandtschaftsbezeichnung הָאָבוֹת
  choice: Vaterhäuser im Haupttext, mit erklärender Fußnote
  alternative: Großfamilien; Sippen; Familien
  rationale: „Vaterhäuser“ bewahrt die kulturell und administrativ geprägte Ausdrucksweise des Ausgangstextes. Die Fußnote erschließt die Bedeutung, ohne sie im Haupttext zu verflachen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Der kultisch-genealogische Fachausdruck „Vaterhäuser“ bleibt erhalten und wird in der Fußnote alltagssprachlich erläutert.
