base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: de
  text: Die Leviten und ganz Juda taten alles, was der Priester Jojada befohlen hatte. Jeder nahm seine Männer, die am Sabbat zum Dienst kamen, zusammen mit denen, die am Sabbat vom Dienst gingen. Denn der Priester Jojada hatte die Dienstabteilungen[a] nicht entlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienstgruppen« beziehungsweise »Schichten«; gemeint sind die planmäßig eingeteilten priesterlichen und levitischen Dienstgruppen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כְּכֹל אֲשֶׁר צִוָּה
  choice: taten alles, was ... befohlen hatte
  rationale: Gibt die umfassende Befolgung des Befehls in natürlichem, würdigem Deutsch wieder.
- source_word: הַלְוִיִּם וְכָל יְהוּדָה
  choice: die Leviten und ganz Juda
  rationale: Bewahrt die kollektive geografische Bezeichnung des Hebräischen, ohne sie unnötig zu erklären.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: der Priester Jojada
  rationale: Verwendet die im Deutschen geläufige Namensform und gibt den Titel ausdrücklich wieder.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Jeder nahm seine Männer zu sich
  rationale: אִישׁ ist distributiv; „seine Männer“ wahrt die Offenheit, ob Gefolgsleute, Wachleute oder unterstelltes Personal gemeint sind.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: sowohl die, die am Sabbat ihren Dienst antraten, als auch die, die am Sabbat ihren Dienst beendeten
  rationale: Macht den im Kontext gemeinten Wechsel der Dienstgruppen verständlich; „sowohl ... als auch“ gibt das gemeinsame Heranziehen beider Gruppen klar wieder.
- source_word: לֹא פָטַר
  choice: hatte ... nicht entlassen
  rationale: Bezeichnet hier das Nichtentlassen aus dem turnusmäßigen Dienst.
- source_word: הַמַּחְלְקוֹת
  choice: die Dienstabteilungen
  rationale: Gibt die organisierten priesterlichen beziehungsweise levitischen Dienstgruppen verständlicher wieder als das bloße „Abteilungen“.
