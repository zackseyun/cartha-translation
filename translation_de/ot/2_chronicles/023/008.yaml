  to: Die Leviten und ganz Juda taten alles, was der Priester Jojada befohlen hatte. Jeder nahm seine Männer, die am Sabbat zum Dienst kamen, zusammen mit denen, die am Sabbat vom Dienst gingen. Denn der Priester Jojada hatte die Dienstabteilungen[a] nicht entlassen.
  rationale: Die Revision entfernt die nicht ausdrücklich belegte Ergänzung „zu sich“ und ersetzt die stärker abschließende Wendung „ihren Dienst beendeten“ durch eine Formulierung, die das hebräische Gegenüber von Kommen und Gehen bei gleichzeitiger Wahrung des Dienstkontexts genauer abbildet. Fußnotenanker und Fußnoteninhalt bleiben erhalten.
