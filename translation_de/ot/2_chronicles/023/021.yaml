base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: de
  text: Und das ganze Volk des Landes freute sich, und die Stadt hatte Ruhe. Und sie töteten Atalja mit dem Schwert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Da freute sich
  rationale: שׂמח bezeichnet Freude oder Frohsein. „Freute sich“ ist im modernen Deutschen natürlich; „da“ gibt hier den erzählerischen Anschluss des Wayyiqtol wieder, ohne eine zusätzliche Begründung einzutragen.
- source_word: כָל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Wendung bezeichnet die Bevölkerung des Landes. Die Übersetzung bewahrt die hebräische Ausdrucksweise und vermeidet die speziellere Deutung „Landbevölkerung“.
- source_word: וְהָעִיר שָׁקָטָה
  choice: und die Stadt hatte Ruhe
  rationale: שׁקט bezeichnet Ruhe und Ungestörtheit nach Unruhen. „Hatte Ruhe“ ist idiomatisch und lässt offen, ob vor allem Stille, Frieden oder politische Beruhigung gemeint ist. Die im Zusammenhang erkennbare Stadt Jerusalem wird nicht ausdrücklich eingesetzt, da der hebräische Text nur „die Stadt“ sagt.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: Denn Atalja hatten sie getötet
  rationale: Der Hifil von מות bedeutet hier „töten“ beziehungsweise „zu Tode bringen“. Das Plusquamperfekt entspricht dem Kontext, da Ataljas Hinrichtung bereits unmittelbar zuvor berichtet wurde; „denn“ versteht die vorangestellte Aussage als Erklärung für die Ruhe der Stadt. Die mögliche bloße Koordination wird in der Fußnote erhalten.
- source_word: בֶחָרֶב
  choice: mit dem Schwert
  rationale: Die Präposition ב ist instrumental gebraucht; „mit dem Schwert“ gibt das konkrete Mittel der Tötung direkt wieder.
theological_decisions:
- issue: Verhältnis zwischen der Ruhe der Stadt und Ataljas Tod
  choice: 'erklärend: „Denn Atalja hatten sie … getötet“'
  alternative: 'koordinierend: „Und Atalja töteten sie …“'
  rationale: Das hebräische וְ kann sowohl schlicht koordinieren als auch im Zusammenhang eine Erklärung einleiten. Da Ataljas Tod schon vor der Freude des Volkes und der Ruhe der Stadt erzählt wurde, ist die erklärende, rückblickende Wiedergabe kontextuell überzeugend; die syntaktisch einfachere Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch. „Volk des Landes“ und „die Stadt“ bewahren die Ausdrucksweise des Ausgangstextes; „hatte Ruhe“ klingt natürlicher und umfasst mehr Bedeutungsnuancen als das engere „war still“.
