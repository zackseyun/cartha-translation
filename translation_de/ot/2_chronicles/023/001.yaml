  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: de
  text: 'Im siebten Jahr stärkte sich Jojada und nahm die Befehlshaber über Hundertschaften mit sich in den Bund auf[a]: Asarja, den Sohn Jerohams, Jischmael, den Sohn Johanans, Asarja, den Sohn Obeds, Maaseja, den Sohn Adajas, und Elischafat, den Sohn Sichris.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schloss mit ihnen einen Bund“. Wörtlich verbindet das Hebräische „nahm“ mit „mit sich“ und „in den Bund“; gemeint ist, dass Jojada diese Befehlshaber für eine verbindliche Vereinbarung gewann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: Im siebten Jahr
  rationale: Die Zeitangabe wird im Deutschen natürlich ohne einleitendes „und“ wiedergegeben; der Sinn bleibt vollständig erhalten.
- source_word: הִתְחַזַּק
  choice: stärkte sich
  rationale: Die reflexive Form des hebräischen Verbs wird unmittelbar abgebildet. Im Zusammenhang bezeichnet sie, dass Jojada Mut und Entschlossenheit gewann, ohne diese Deutung an die Stelle des Wortlauts zu setzen.
- source_word: וַיִּקַּח
  choice: nahm … auf
  rationale: Die Grundbedeutung „nehmen“ bleibt in der deutschen Verbklammer erhalten; zusammen mit der Bundesformulierung ergibt sich idiomatisch „in den Bund aufnehmen“.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: die Befehlshaber über Hundertschaften
  rationale: Die Wendung bezeichnet militärische Führer von Einheiten zu hundert Mann. „Befehlshaber über Hundertschaften“ ist verständlich und vermeidet die römische Assoziation von „Zenturionen“.
- source_word: עִמּוֹ בַבְּרִית
  choice: mit sich in den Bund
  rationale: Die Formulierung bewahrt sowohl עִמּוֹ („mit ihm/sich“) als auch den bestimmten Ausdruck בַבְּרִית („in den Bund“). In Verbindung mit „nahm … auf“ bezeichnet sie die Einbeziehung der Männer in eine bindende Vereinbarung.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Asarja … Jischmael … Asarja … Maaseja … und Elischafat
  rationale: Die Eigennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die Wiederholung des Namens Asarja bleibt wie im Hebräischen erhalten.
- source_word: בֶן
  choice: den Sohn
  rationale: Die patronymische Identifizierung wird standardgemäß mit „Sohn“ ausgedrückt; der Akkusativ folgt der Satzkonstruktion mit „nahm … auf“.
theological_decisions:
- issue: Art und Bezug des Bundes
  choice: nahm … mit sich in den Bund auf
  alternative: schloss mit ihnen einen Bund
  rationale: Der hebräische Ausdruck verbindet „nehmen“ mit „mit ihm“ und „in den Bund“. Die gewählte Fassung bewahrt diese ungewöhnliche Struktur und legt nicht abschließend fest, ob ein neuer Bund geschlossen oder die Männer in einen bereits vorausgesetzten Bund einbezogen wurden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst etwas markante Wendung „stärkte sich“ erhält die reflexive Form des Hebräischen; die Fußnote erläutert die mehrdeutige Bundesformulierung.
