id: 2CH.23.18
reference: 2 Chronicles 23:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: de
  text: Und Jojada übertrug die Aufsicht über das Haus Jahwes den Priestern[a], den Leviten[b], die David für das Haus Jahwes eingeteilt hatte. Sie sollten Jahwe Brandopfer darbringen, wie es im Gesetz des Mose geschrieben steht, mit Freude und Gesang nach Davids Anordnung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand der Priester“; gemeint ist, dass ihnen die Verantwortung übertragen wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den levitischen Priestern“; möglicherweise auch: „den Priestern und den Leviten“. Die hebräische Formulierung lässt mehrere Deutungen zu.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „durch die Hand Davids“; dies kann Davids Anordnung bezeichnen, aber auch mit „durch David“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: übertrug die Aufsicht
  rationale: שׂים bedeutet wörtlich „setzen, legen“; zusammen mit פְּקֻדּוֹת bezeichnet es hier die Einrichtung beziehungsweise Übertragung der Aufsicht und Verantwortung für den Tempeldienst.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild und ist im Deutschen verständlich; „Tempel“ wäre eine erklärende Konkretisierung.
- source_word: בְּיַד
  choice: den Priestern
  rationale: Die wörtliche Wendung „in die Hand“ bezeichnet idiomatisch die Übertragung von Verantwortung. Im deutschen Haupttext wird dieser Verwaltungssinn natürlich wiedergegeben und in Fußnote [a] offengelegt.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: den Priestern, den Leviten
  rationale: Die formnahe Apposition lässt offen, ob „Leviten“ die Priester näher bestimmt oder eine weitere Gruppe bezeichnet.
- source_word: חָלַק
  choice: eingeteilt hatte
  rationale: Das Verb bedeutet „teilen, zuteilen“ und bezeichnet hier Davids Einteilung des Personals für den Dienst am Haus Jahwes.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: Brandopfer darbringen
  rationale: Dies ist die geläufige und sachlich genaue deutsche Bezeichnung für das Hinaufbringen beziehungsweise Opfern der עֹלוֹת.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: wie es im Gesetz des Mose geschrieben steht
  rationale: Die traditionelle Formel gibt den Verweis auf die schriftlich vorliegende Tora des Mose klar und würdig wieder.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: mit Freude und Gesang
  rationale: Die beiden Substantive werden knapp, natürlich und mit liturgischem Klang wiedergegeben.
- source_word: עַל יְדֵי דָוִיד
  choice: nach Davids Anordnung
  rationale: Die Wendung lautet wörtlich „durch die Hand/Hände Davids“ und verweist im Zusammenhang wahrscheinlich auf die von David festgelegte Ordnung; die mögliche Lesart persönlicher Vermittlung wird in Fußnote [c] bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Verhältnis von „Priestern“ und „Leviten“
  choice: die hebräische Ausdrucksweise „den Priestern, den Leviten“ beibehalten
  alternative: „den levitischen Priestern“ oder „den Priestern und den Leviten“
  rationale: Die Konstruktion lässt sowohl eine näher bestimmende als auch eine koordinierende Deutung zu. Der Haupttext entscheidet diese institutionelle Frage nicht; Fußnote [b] nennt beide Möglichkeiten.
- issue: Bedeutung von עַל יְדֵי דָוִיד
  choice: nach Davids Anordnung
  alternative: durch David
  rationale: Im Zusammenhang des von David geordneten Tempeldienstes ist eine Anordnung am wahrscheinlichsten. Da die Wendung grammatisch auch Vermittlung oder Urheberschaft ausdrücken kann, wird diese Spannung in Fußnote [c] erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Hebräische Verwaltungsidiome werden im Haupttext idiomatisch wiedergegeben, während sachlich oder theologisch bedeutsame Mehrdeutigkeiten in Formulierung und Fußnoten erhalten bleiben.
