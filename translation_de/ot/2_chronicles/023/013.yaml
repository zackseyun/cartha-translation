revisions:
- from: 'Da sah sie – und siehe: Der König stand an seiner Säule beim Eingang, und die führenden Männer und die Trompeten waren beim König[a]. Das ganze Volk des Landes freute sich und blies die Trompeten. Die Sänger waren mit den Musikinstrumenten da und leiteten den Lobpreis[b]. Da zerriss Atalja ihre Kleider und rief: »Verschwörung! Verschwörung!«'
  to: 'Sie sah hin, und siehe: der König stand bei seiner Säule am Eingang; die Obersten und die Trompeter standen beim König[a]. Das ganze Volk des Landes freute sich und blies die Trompeten. Die Sänger mit den Musikinstrumenten leiteten den Lobpreis[b]. Da zerriss Atalja ihre Kleider und rief: »Verschwörung! Verschwörung!«'
  rationale: Die Revision beseitigt drei sprachliche Unebenheiten, ohne die Aussage zu erweitern. Die metonymische Wiedergabe „Trompeter“ ist für modernes Deutsch erforderlich und wird durch eine transparente Fußnote abgesichert. Die Fußnote zu den Sängern bewahrt die Auslegungsbreite von וּמוֹדִיעִים לְהַלֵּל.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:08:41Z'
review_pass:
  verdict: revise
  source_fidelity: Die Szenenfolge, der königliche Standort, die öffentliche Freude, das Trompetenblasen, das Zerreißen der Kleider und der doppelte Ausruf sind zutreffend wiedergegeben. Die hebräische Form „die Obersten und die Trompeten“ ist jedoch im Deutschen nicht ohne Weiteres als Aussage über Instrumente neben dem König verständlich. Die naheliegende Metonymie „Trompeter“ sollte im Text verwendet und durch eine Fußnote transparent gemacht werden. Die musikalische Schlussgruppe wird besser ohne die nicht im Hebräischen ausgedrückte Ergänzung „waren ... da“ wiedergegeben.
  naturalness: „Da sah sie – und siehe“ sowie besonders „die Trompeten waren beim König“ und „die Sänger waren mit den Musikinstrumenten da“ wirken im modernen Standarddeutsch unnötig holprig. „Sie sah hin, und siehe“ bewahrt den erzählerischen Marker; „die Trompeter standen beim König“ und eine direkte Zuordnung der Sänger zum Lobpreis sind natürlich und verständlich.
  terminology: „Oberste“ ist für שָׂרִים in diesem höfisch-militärischen Kontext eine etablierte, dennoch nicht übermäßig spezifizierende Wiedergabe. „Trompeter“ macht die im Hebräischen wahrscheinlich metonymisch gebrauchte Bezeichnung der Instrumente idiomatisch lesbar. „Lobpreis“ ist hier als Wiedergabe von לְהַלֵּל vertretbar; die idiomatische Unsicherheit wird weiterhin in der Anmerkung kenntlich gemacht.
  issues:
  - severity: medium
    issue: „die Trompeten waren beim König“
    rationale: Der masoretische Text hat tatsächlich „Trompeten“, doch im Deutschen legt diese Formulierung unplausibel nahe, dass Instrumente als eigenständige Akteure beim König standen. Die im Kontext sehr wahrscheinliche Metonymie für die Trompeter kann im Haupttext wiedergegeben werden, sofern die Fußnote die hebräische Lesart offenlegt.
  - severity: low
    issue: „Die Sänger waren mit den Musikinstrumenten da“
    rationale: „waren ... da“ ist eine nicht quellensprachlich geforderte, inhaltlich blasse Ergänzung. Die Konstruktion kann unmittelbar die Sänger, die Instrumente und ihre Funktion beim Lobpreis verbinden.
  - severity: low
    issue: 'Großschreibung nach dem Doppelpunkt in „und siehe: Der König“'
    rationale: Nach einem bloß ankündigenden Doppelpunkt folgt hier im Deutschen regulär Kleinschreibung.
