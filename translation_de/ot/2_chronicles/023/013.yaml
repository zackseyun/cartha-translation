  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: de
  text: 'Sie sah hin, und siehe: der König stand bei seiner Säule am Eingang; die Obersten und die Trompeter standen beim König[a]. Das ganze Volk des Landes freute sich und blies die Trompeten. Die Sänger mit den Musikinstrumenten leiteten den Lobpreis[b]. Da zerriss Atalja ihre Kleider und rief: »Verschwörung! Verschwörung!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Obersten und die Trompeten beim König“. Wahrscheinlich sind die Trompeten metonymisch als Bezeichnung für die Trompeter genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gaben das Zeichen zum Lobpreis“ beziehungsweise „wiesen zum Lobpreis an“. Der hebräische Ausdruck ist in diesem musikalischen Zusammenhang idiomatisch und in seiner genauen Funktion nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Da sah sie – und siehe
  rationale: „Sah“ gibt ראה direkt wieder; „und siehe“ bewahrt die aufmerksamkeitslenkende, plötzliche Wirkung von הִנֵּה, ohne sie zu glätten.
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: Der König stand
  rationale: Das Partizip schildert die vorgefundene, andauernde Haltung. Im deutschen Erzählstil bringt das Präteritum diese Szenenbeschreibung natürlich zum Ausdruck.
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: an seiner Säule beim Eingang
  rationale: עַל bezeichnet hier wahrscheinlich die räumliche Zuordnung zum zeremoniellen Standplatz, nicht notwendig ein Stehen oben auf der Säule. „Beim Eingang“ gibt den Ort idiomatisch wieder.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שָׂרִים kann militärische Befehlshaber oder allgemein hochgestellte Verantwortliche bezeichnen. Die Wiedergabe bleibt bewusst breit und vermeidet eine unbelegte Festlegung auf rein militärische Ämter.
- source_word: וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: und die Trompeten waren beim König
  rationale: Die gegenständliche Formulierung des masoretischen Textes wird bewahrt; vermutlich stehen die Instrumente metonymisch für die Trompeter. Die ungewöhnliche Ausdrucksweise wird in einer Fußnote erläutert.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ
  choice: Das ganze Volk des Landes freute sich
  rationale: Die feste Wendung bezeichnet die Bevölkerung des Landes; das prädikative Adjektiv beschreibt ihre öffentliche Freude.
- source_word: וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: und blies die Trompeten
  rationale: תקע mit חצוצרות ist die übliche Verbindung für das Blasen beziehungsweise Erschallenlassen von Trompeten.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: Die Sänger waren mit den Musikinstrumenten da
  rationale: „Sänger“ gibt die Personengruppe genau wieder. Die Formulierung vermeidet die nicht ausdrücklich ausgesagte Festlegung, ob die Sänger selbst sämtliche Instrumente spielten.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: und leiteten den Lobpreis
  rationale: Das Hifil von ידע hat in diesem musikalisch-liturgischen Zusammenhang wahrscheinlich den Sinn des Anleitens, Anzeigens oder Signalgebens. „Leiteten den Lobpreis“ gibt die Funktion verständlich wieder, ohne die idiomatische Wendung zu überpräzisieren.
- source_word: וַתִּקְרַע עֲתַלְיָהוּ אֶת בְּגָדֶיהָ
  choice: Da zerriss Atalja ihre Kleider
  rationale: Die deutsche Erzählfolge entspricht dem hebräischen Narrativ; das Zerreißen der Kleider wird als sichtbare Reaktion unverändert wiedergegeben.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Verschwörung! Verschwörung!
  rationale: Die Wiederholung des Ausrufs wird bewahrt und vermittelt Alarm, Anklage und Dringlichkeit.
