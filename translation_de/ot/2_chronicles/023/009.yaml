base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: de
  text: Da gab der Priester Jojada den Hundertschaftsführern die Speere, die Schilde und die großen Schilde[a], die König David gehört hatten und sich im Haus Gottes[b] befanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine weitere Art von Schild; die genaue Form ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist der Tempel Gottes; wörtlich: „Haus Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Da gab
  rationale: Das häufige narrative Verb נתן bezeichnet hier die Übergabe von Gegenständen; „gab“ ist direkt und natürlich. „Da“ gibt den fortlaufenden Erzählzusammenhang wieder.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: der Priester Jojada
  rationale: Der Name wird in der im Deutschen geläufigen Form „Jojada“ wiedergegeben; die vorangestellte Amtsbezeichnung klingt natürlich und bewahrt die Apposition.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: den Hundertschaftsführern
  rationale: Die Wendung bezeichnet militärische Führer von Einheiten zu je hundert. Das deutsche Kompositum ist präzise und vermeidet die römische Nebenbedeutung von „Zenturionen“.
- source_word: הַחֲנִיתִים
  choice: die Speere
  rationale: חנית ist die übliche Bezeichnung für einen Speer; die Wiedergabe ist klar und gegenwartssprachlich.
- source_word: הַמָּגִנּוֹת
  choice: die Schilde
  rationale: מגן bezeichnet allgemein einen Schild.
- source_word: הַשְּׁלָטִים
  choice: die großen Schilde
  rationale: Der Begriff bezeichnet wahrscheinlich eine weitere Schildart und wird so von מגן unterschieden. Die Größenangabe ist eine plausible, aber nicht völlig sichere Verdeutlichung; deshalb wird sie in einer Fußnote kenntlich gemacht.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: die König David gehört hatten
  rationale: Die hebräische Besitzkonstruktion wird idiomatisch wiedergegeben. Das Plusquamperfekt verdeutlicht, dass diese im Heiligtum aufbewahrten Waffen aus Davids Zeit stammten.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: und sich im Haus Gottes befanden
  rationale: Das im Hebräischen ausgelassene Verb wird im Deutschen ergänzt. „Haus Gottes“ bewahrt die konkrete Ausdrucksweise des Chronisten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Hundertschaftsführer“ ist verständlicher und historisch neutraler als ein römisch geprägter Rangtitel. Die Wiederholung „Schilde und große Schilde“ bleibt bewusst stehen, um die zwei verschiedenen hebräischen Waffenbegriffe nicht einzuebnen.
