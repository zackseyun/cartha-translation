source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: de
  text: Dann nahm er die Obersten über Hundert, die Vornehmen[a], die Herrschenden im Volk und das ganze Volk des Landes[b] mit sich. Er führte den König aus dem Haus Jahwes hinab. Sie zogen durch das obere Tor in den Königspalast[c] ein und setzten den König auf den Thron des Königreichs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Mächtigen«. Das hebräische Wort kann einflussreiche, ranghohe oder mächtige Personen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das ganze Volk des Landes«; in Königserzählungen ist dies eine feste Bezeichnung für die Bevölkerung als gesellschaftlich-politische Größe.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »das Haus des Königs«. Gemeint ist der königliche Palast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm er … mit sich
  rationale: לקח bedeutet grundsätzlich »nehmen«; mit dem Zusatz »mit sich« wird im Deutschen natürlich ausgedrückt, dass Jojada die genannten Gruppen führte bzw. begleitete.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: die Obersten über Hundert
  rationale: Die Formulierung bewahrt den hebräischen militärischen Titel und vermeidet die römisch geprägte Bezeichnung »Zenturionen«.
- source_word: הָאַדִּירִים
  choice: die Vornehmen
  rationale: אַדִּירִים bezeichnet hier einflussreiche, ranghohe oder mächtige Personen; »Vornehmen« passt zum gesellschaftlich-politischen Zusammenhang, ohne körperliche Stärke zu unterstellen.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: die Herrscher des Volkes
  rationale: Die Wendung bezeichnet Personen, die innerhalb des Volkes Leitungsgewalt ausüben, und wird eng am Hebräischen wiedergegeben.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Wiedergabe erhält die feste hebräische Bezeichnung als gesellschaftlich-politischen Ausdruck in Königserzählungen.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: Er führte den König … hinab
  rationale: Der Hifil von ירד bezeichnet das Herabführen; »führte … hinab« gibt sowohl die Veranlassung als auch die räumliche Richtung natürlich wieder.
- source_word: מִבֵּית יְהוָה
  choice: aus dem Haus Jahwes
  rationale: »Haus Jahwes« bewahrt die hebräische Ausdrucksweise בית יהוה und gibt den Gottesnamen als Eigennamen wieder.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: durch das obere Tor
  rationale: Bei einer Bewegungsangabe entspricht »durch« idiomatisch dem räumlichen Sinn von בְּתוֹךְ.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Königspalast
  rationale: Das wörtliche »Haus des Königs« bezeichnet in diesem Zusammenhang den königlichen Palast; die Wiedergabe ist im modernen Deutschen eindeutig und natürlich.
- source_word: וַיּוֹשִׁיבוּ
  choice: setzten
  rationale: Die kausative Verbform bedeutet »sitzen lassen/setzen« und bezeichnet hier den feierlichen Akt der Inthronisierung.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: Thron des Königreichs
  rationale: Die Formulierung bewahrt die ausdrückliche Nennung von מַמְלָכָה und bleibt dem hebräischen Wortlaut nahe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Sozialer Umfang von עַם הָאָרֶץ
  choice: Volk des Landes
  alternative: einfaches Volk
  rationale: Die feste Wendung kann eine gesellschaftlich-politische Gruppe bezeichnen, ohne dass ihr Umfang hier abschließend festgelegt wird; die formnahe Wiedergabe erhält diese mögliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem hebräischen Erzählstil, wird aber durch einen Satzwechsel nach der Aufzählung lesbarer. Militärische und politische Titel bleiben möglichst formnah; erläuterungsbedürftige Alternativen stehen in Fußnoten.
