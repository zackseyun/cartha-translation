  source_fidelity: Der Satzbau gibt den Wechsel von Jojadas Handeln im Singular zu den Handlungen der versammelten Gruppe im Plural zutreffend wieder. »führte ... hinab«, »Haus Jahwes«, die militärische Bezeichnung und die Inthronisierung entsprechen dem hebräischen Text. Bei הַמֹּשְׁלִים בָּעָם bezeichnet בָּעָם jedoch eher die Stellung der Regierenden innerhalb des Volkes als ein Herrschen über das Volk; dies sollte im Deutschen erkennbar bleiben.
