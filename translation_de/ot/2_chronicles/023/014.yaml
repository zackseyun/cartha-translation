  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: de
  text: 'Da führte der Priester Jojada die Hundertschaftsführer, die über das Heer eingesetzt waren, hinaus und sagte zu ihnen: „Führt sie hinaus, weg von den Reihen[a]! Wer ihr folgt, soll mit dem Schwert getötet werden.“ Denn der Priester hatte gesagt: „Tötet sie nicht im Haus Jahwes!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer verständlich. Auch möglich: „hinaus zwischen den Reihen“ oder „hinaus, außerhalb der Reihen“. Gemeint ist wahrscheinlich, dass Atalja aus dem Tempelbereich durch oder an aufgestellten Reihen vorbei hinausgeführt werden sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: führte … hinaus
  rationale: Der Hifil von יצא bezeichnet das Veranlassen des Hinausgehens. Die Wiedergabe bleibt nahe an der hebräischen Form und ist im Zusammenhang natürlich.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: Hundertschaftsführer
  rationale: Die Bezeichnung meint militärische Führer über Einheiten von hundert Mann. Das deutsche Kompositum ist prägnant und vermeidet römische Assoziationen von „Zenturionen“.
- source_word: פְּקוּדֵי הַחַיִל
  choice: die über das Heer eingesetzt waren
  rationale: Die Form von פקד kennzeichnet die Männer als Beauftragte beziehungsweise Eingesetzte mit Zuständigkeit für die Streitmacht.
- source_word: הוֹצִיאוּהָ
  choice: Führt sie … hinaus
  rationale: Der pluralische Imperativ im Hifil mit femininem Suffix bezieht sich auf Atalja und drückt aus, dass sie hinausgebracht werden soll.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: zwischen den Reihen hinaus
  rationale: Die schwierige Wendung bezeichnet im Kontext wahrscheinlich das Hinausführen durch beziehungsweise zwischen aufgestellten Reihen. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: Wer ihr folgt
  rationale: Das Partizip mit אַחֲרֶיהָ bezeichnet jeden, der hinter ihr herkommt oder sich ihr anschließt; die knappe Übersetzung bewahrt diese mögliche Bedeutungsbreite.
- source_word: יוּמַת בֶּחָרֶב
  choice: soll mit dem Schwert getötet werden
  rationale: Die passive Form von מות hat hier im Rahmen des Befehls verpflichtenden Charakter. Die Formulierung erhält den förmlichen Ton.
- source_word: לֹא תְמִיתוּהָ
  choice: Tötet sie nicht
  rationale: Der Hifil von מות bedeutet „zu Tode bringen“. Im Deutschen gibt der direkte Imperativ das Verbot klar und würdig wieder.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bildet בֵּית formal ab und bezeichnet hier den Tempel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des Verbots, Atalja im Heiligtum zu töten
  choice: „Tötet sie nicht im Haus Jahwes!“
  alternative: „Sie darf nicht im Haus Jahwes getötet werden.“
  rationale: Die direkte Anrede im Plural entspricht der hebräischen Verbform. Der Text begründet nur den Ort ihrer Herausführung und bewertet die angeordnete Hinrichtung nicht weiter.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Militärische Amtsbezeichnungen werden verständlich wiedergegeben; die ungewöhnliche Ortsangabe bleibt durch eine Fußnote als unsicher erkennbar.
