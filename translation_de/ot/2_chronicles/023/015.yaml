base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: de
  text: Da ergriffen sie sie[a], und sie kam zum Eingang des Pferdetors am Haus des Königs[b]. Dort töteten sie sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie legten Hände an sie.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »am Königspalast«. Wörtlich: »am Haus des Königs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: Da ergriffen sie sie
  rationale: Die Wendung lautet wörtlich etwa »sie legten Hände an sie«. Im Zusammenhang von Festnahme und Tötung gibt »ergriffen« den idiomatischen Sinn natürlich und präzise wieder; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: מְבוֹא
  choice: Eingang
  rationale: Das Substantiv bezeichnet den Zugang beziehungsweise Ort des Hineingehens; »Eingang« ist im Deutschen klar und passend.
- source_word: שַׁעַר הַסּוּסִים
  choice: Pferdetor
  rationale: Die Verbindung bezeichnet wahrscheinlich einen Eigennamen. Die Zusammensetzung »Pferdetor« entspricht natürlichem deutschem Sprachgebrauch.
- source_word: בֵּית הַמֶּלֶךְ
  choice: am Königspalast
  rationale: Wörtlich steht »Haus des Königs«. Im örtlichen Zusammenhang bezeichnet die Wendung den königlichen Palast; »Königspalast« ist eindeutig und natürlich, während die wörtliche Alternative in der Fußnote dokumentiert wird.
- source_word: וַיְמִיתוּהָ
  choice: töteten sie sie
  rationale: Der Hifil von מות bedeutet »sterben lassen, töten«. »Töteten« ist präzise und vermeidet die möglicherweise zu spezielle rechtliche Nuance von »hinrichten«.
- source_word: שָׁם
  choice: Dort
  rationale: Direkte und natürliche Wiedergabe des hebräischen Ortsadverbs.
