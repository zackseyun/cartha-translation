  text: זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ הַ/שְּׁלִשִׁ֨ית מִ/כֶּ֜ם בָּאֵ֣י הַ/שַּׁבָּ֗ת לַ/כֹּֽהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/שֹֽׁעֲרֵ֖י הַ/סִּפִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: de
  text: 'Dies sollt ihr tun: Ein Drittel von euch, die am Sabbat ihren Dienst antreten – von den Priestern und den Leviten –, soll als Torhüter an den Schwellen dienen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll die Schwellen bewachen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Dies sollt ihr tun
  rationale: Gibt die hebräische Einleitungsformel idiomatisch und mit ihrer anweisenden Kraft wieder.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: Ein Drittel von euch
  rationale: 'Bewahrt die partitive Aussage: Ein Drittel wird aus der angesprochenen Gruppe bestimmt.'
- source_word: בָּאֵי הַשַּׁבָּת
  choice: die am Sabbat ihren Dienst antreten
  rationale: Das Partizip bezeichnet die am Sabbat Eintretenden; im Wach- und Tempeldienst ist damit natürlich der Dienstantritt gemeint, ohne den Zeitpunkt weiter festzulegen.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: von den Priestern und den Leviten
  rationale: Erhält den appositionellen beziehungsweise partitiven Bezug auf die zum Sabbatdienst Eintretenden.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: soll die Schwellen bewachen
  rationale: Gibt die Funktion der Torhüter an den Schwellen in natürlichem Deutsch wieder und bewahrt das konkrete Bild der bewachten Eingänge.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parenthese kennzeichnet klar, dass das Drittel aus den Priestern und Leviten besteht. Der Singular „soll“ richtet sich grammatisch nach „ein Drittel“.
