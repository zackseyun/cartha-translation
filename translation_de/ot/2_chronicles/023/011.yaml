base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: de
  text: 'Dann führten sie den Sohn des Königs heraus, setzten ihm die Krone auf und übergaben ihm das Zeugnis[a]. Sie machten ihn zum König; Jojada und seine Söhne salbten ihn und riefen: »Es lebe der König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Gesetz« beziehungsweise »die Bundesurkunde«. Der hebräische Ausdruck meint hier wahrscheinlich das schriftliche Bundeszeugnis, das mit der Herrschaft des Königs verbunden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: führten sie … heraus
  rationale: Der Hifil von יצא bezeichnet das Herausführen oder Herausbringen. »Herausführen« ist im Deutschen natürlich und passt zur feierlichen Vorstellung des Thronerben.
- source_word: בֶּן הַמֶּלֶךְ
  choice: den Sohn des Königs
  rationale: Die hebräische Genitivverbindung wird im Deutschen direkt wiedergegeben und bewahrt die dynastische Kennzeichnung.
- source_word: הַנֵּזֶר
  choice: die Krone
  rationale: נֵזֶר kann ein Diadem beziehungsweise ein Zeichen der Weihe bezeichnen; im Zusammenhang der Königseinsetzung ist »Krone« klar und allgemein verständlich.
- source_word: הָעֵדוּת
  choice: das Zeugnis
  rationale: Die formale Wiedergabe bewahrt die Bedeutung als bezeugendes, wahrscheinlich schriftliches Bundesdokument, ohne den Gegenstand vorschnell auf »Gesetz« festzulegen.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: Sie machten ihn zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum Herrscher beziehungsweise König zu machen. Die Formulierung unterscheidet diesen Akt vom Aufsetzen der Krone.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: salbten ihn
  rationale: »Salben« ist die sachlich und traditionsgeschichtlich passende Wiedergabe von משׁח bei einer Königseinsetzung.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Jojada und seine Söhne
  rationale: Die nachgestellte ausdrückliche Subjektangabe wird im Deutschen vor das Prädikat gestellt und auf das Salben sowie das anschließende Rufen bezogen.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Es lebe der König!
  rationale: Die feste deutsche Akklamationsform gibt den hebräischen Jussiv idiomatisch und mit derselben öffentlichen Ausrufekraft wieder.
theological_decisions:
- issue: Bedeutung von הָעֵדוּת bei der Königseinsetzung
  choice: Im Haupttext steht »das Zeugnis«; eine Fußnote nennt »das Gesetz« und »die Bundesurkunde« als mögliche Sinnbestimmungen.
  alternative: Direkt »das Gesetz« oder »die Bundesurkunde« schreiben.
  rationale: Der hebräische Ausdruck bezeichnet grundsätzlich Zeugnis beziehungsweise Bezeugung und kann hier auf ein schriftliches Dokument mit bundesrechtlichen Verpflichtungen des Königs weisen. Die gewählte Wiedergabe erhält die begriffliche Weite und die Bundesthematik, ohne sie enger festzulegen.
- issue: Subjekt des Salbens
  choice: Jojada und seine Söhne werden als Subjekt von »salbten ihn« und »riefen« wiedergegeben.
  alternative: Das vorherige unbestimmte »sie« auch als Subjekt des Salbens verstehen und Jojada und seine Söhne nur mit dem Ausruf verbinden.
  rationale: Im hebräischen Text folgt וַיִּמְשָׁחֻהוּ unmittelbar die ausdrückliche Subjektgruppe יְהוֹיָדָע וּבָנָיו; grammatisch liegt es daher nahe, sie sowohl auf das Salben als auch auf das folgende pluralische Redeverb zu beziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung macht den Ablauf der Krönung verständlich, erhält aber die hebräische Reihung. »Es lebe der König!« ist die natürliche deutsche Form der königlichen Akklamation.
