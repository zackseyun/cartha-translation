  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: de
  text: ein Drittel beim Haus des Königs, ein Drittel beim Fundamenttor[a] und das ganze Volk in den Vorhöfen des Hauses Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tor des Fundaments“. Der hebräische Ausdruck bezeichnet möglicherweise den Eigennamen eines bestimmten Tores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: ein Drittel
  rationale: Die substantivisch gebrauchte feminine Ordinalzahl bezeichnet hier im Zusammenhang einer Einteilung jeweils ein Drittel der Gruppe. „Ein Drittel“ ist im modernen Deutschen natürlich und genau.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: beim Haus des Königs
  rationale: בֵּית bedeutet wörtlich „Haus“ und bezeichnet hier die königliche Residenz beziehungsweise den Palastbereich. „Beim“ gibt die örtliche Zuweisung passend wieder, ohne den Ausdruck zu stark auszudeuten.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: beim Fundamenttor[a]
  rationale: שַׁעַר bedeutet „Tor“, יְסוֹד „Fundament“ oder „Grundlage“. Der Ausdruck wird wahrscheinlich als Eigenname eines bestimmten Tores gebraucht; die Zusammenschreibung und Großschreibung kennzeichnen dies im Deutschen.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם ist die gewöhnliche Bezeichnung für „Volk“. Die Wiedergabe ist direkt, verständlich und lässt offen, welche Gruppen hier im Einzelnen eingeschlossen sind.
- source_word: בְּחַצְרוֹת
  choice: in den Vorhöfen
  rationale: Der Plural von חָצֵר bezeichnet umschlossene Hofbereiche. „Vorhöfe“ ist im Tempelzusammenhang eine geläufige und präzise deutsche Wiedergabe.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Der hebräische Ausdruck bedeutet wörtlich „Haus JHWHs“ und bezeichnet den Tempelbereich. „Haus“ bewahrt das Bild des Ausgangstextes; „Jahwe“ gibt den Gottesnamen als Namen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als Eigenname, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt entsprechend dem hebräischen und literarischen Zusammenhang als Fortsetzung kleingeschrieben; die wiederholte Verteilung auf Drittel wird knapp und klar wiedergegeben.
