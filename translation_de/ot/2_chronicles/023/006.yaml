source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: de
  text: Niemand darf das Haus Jahwes betreten außer den Priestern und den diensttuenden Leviten; sie dürfen hineingehen, denn sie sind heilig. Das ganze Volk aber soll den Dienstauftrag Jahwes erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das ganze Volk aber soll für Jahwe Wache halten«; auch möglich: »soll Jahwes Anordnung befolgen«.'
    reason: Die Wendung שׁמר משׁמרת kann das Wahrnehmen eines Dienstauftrags, das Befolgen einer Anordnung oder einen konkreten Wachdienst bezeichnen.
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: Niemand darf … betreten
  rationale: אַל mit Jussiv drückt ein Verbot aus. Diese Formulierung gibt die direktive Kraft in natürlichem modernem Deutsch wieder.
- source_word: בֵית יְהוָה
  choice: das Haus Jahwes
  rationale: Bewahrt die konkrete hebräische Wendung; gemeint ist in diesem Zusammenhang der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי אִם הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: außer den Priestern und den Leviten, die dort Dienst tun
  rationale: כִּי אִם führt die Ausnahme ein; das Partizip מְשָׁרְתִים bezeichnet die Leviten in ihrer kultischen Dienstfunktion. „dort“ verdeutlicht den im Kontext gemeinten Dienst am Heiligtum, ohne eine zusätzliche Personengruppe anzunehmen.
- source_word: הֵמָּה יָבֹאוּ
  choice: sie dürfen hineingehen
  rationale: Im Anschluss an das Verbot bezeichnet die Form die den genannten Gruppen gewährte Zutrittsbefugnis.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: denn sie sind heilig
  rationale: Bewahrt den biblischen Begriff der Heiligkeit; im Zusammenhang bezeichnet er ihre kultische Aussonderung und Befähigung zum Zutritt.
- source_word: וְכָל הָעָם
  choice: Das ganze Volk aber
  rationale: Der adversative Anschluss macht den Gegensatz zwischen den zum Eintritt Berechtigten und dem übrigen Volk im Deutschen deutlich.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: soll den Dienstauftrag Jahwes erfüllen
  rationale: Die figura etymologica שמר משמרת bezeichnet das treue Wahrnehmen einer auferlegten Pflicht und kann im Kontext auch das Halten der Wache einschließen. „Dienstauftrag erfüllen“ ist verständliches Deutsch und vermeidet die missverständliche Wendung „Jahwes Wache halten“.
theological_decisions:
- issue: Kultische Heiligkeit der Priester und Leviten
  choice: „heilig“
  alternative: „geweiht“ oder „für den heiligen Dienst ausgesondert“
  rationale: Der Grundtext verwendet קֹדֶשׁ und begründet damit die Zutrittsberechtigung. „Heilig“ erhält die biblische Kategorie, ohne moralische Vollkommenheit zu behaupten.
- issue: Bedeutungsumfang von מִשְׁמֶרֶת יְהוָה
  choice: „den Dienstauftrag Jahwes erfüllen“ mit Fußnote
  alternative: „für Jahwe Wache halten“ oder „Jahwes Anordnung befolgen“
  rationale: Die Wendung kann Pflicht, angeordnete Ordnung oder Wachdienst bezeichnen. Die Hauptfassung wahrt den kultischen Pflichtcharakter; die Fußnote erhält die echte lexikalische Spannweite.
- issue: Wiedergabe des Gottesnamens
  choice: „Jahwe“
  alternative: „der HERR“
  rationale: Der hebräische Text hat den Eigennamen יהוה. Die Transliteration wahrt seinen Charakter als Gottesname.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Jahwes“ bewahrt das hebräische Bild, während „betreten“ und „Dienst tun“ natürlich formuliert sind. Nur die tatsächlich erläuterte Mehrdeutigkeit ist mit [a] markiert.
