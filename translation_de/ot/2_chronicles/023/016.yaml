  terminology: „Jojada“, „Bund“ und „Jahwe“ sind konsistent und fachlich angemessen. „Das Volk Jahwes“ vermittelt die durch לְעָם לַיהוָה ausgedrückte Zugehörigkeit idiomatisch. Die Fußnote bietet die formnähere, wenn auch im Deutschen weniger idiomatische Alternative und ist korrekt verankert.
