  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: de
  text: Dann schloss Jojada einen Bund zwischen sich, dem ganzen Volk und dem König, damit sie das Volk Jahwes seien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit sie ein Volk für Jahwe seien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: Dann schloss ... einen Bund
  rationale: Die hebräische Wendung bedeutet wörtlich „einen Bund schneiden“. „Einen Bund schließen“ ist das natürliche und zugleich präzise deutsche Äquivalent; „Dann“ gibt die narrative Fortführung wieder.
- source_word: בֵּינוֹ וּבֵין כָּל־הָעָם וּבֵין הַמֶּלֶךְ
  choice: zwischen sich, dem ganzen Volk und dem König
  rationale: 'Die drei ausdrücklich genannten Bundesparteien bleiben erhalten: Jojada, das ganze Volk und der König. Das reflexive „sich“ bezieht sich auf Jojada.'
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: damit sie das Volk Jahwes seien
  rationale: Der Infinitiv bezeichnet Ziel beziehungsweise Zweck des Bundesschlusses. „Das Volk Jahwes“ gibt die Zugehörigkeit in natürlichem Deutsch wieder, ohne Jahwe als ausdrücklich genannte vierte Bundespartei darzustellen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext erkennbar bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Bundesparteien und Zweckbestimmung
  choice: Jojada, das ganze Volk und der König sind die genannten Bundesparteien; Ziel ist, dass sie das Volk Jahwes seien.
  alternative: Jahwe als eine der ausdrücklich genannten Bundesparteien verstehen
  rationale: Die syntaktische Reihe nach בֵּין nennt Jojada, das Volk und den König. Jahwe erscheint erst in der Zweckbestimmung als derjenige, dem das Volk zugehört.
- issue: Bestimmtheit von לְעָם
  choice: das Volk Jahwes
  alternative: ein Volk für Jahwe
  rationale: Obwohl עָם keinen Artikel trägt, bezeichnet die Bundesformel hier die besondere Zugehörigkeit zu Jahwe. Die natürlichere deutsche Formulierung wahrt diesen Sinn; die formnähere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einen Bund schließen“ ist eine geläufige biblische und allgemeine Wendung; die Satzstruktur bleibt nahe am Hebräischen, ohne dessen Idiom wörtlich nachzubilden.
