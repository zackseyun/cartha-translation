  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: de
  text: Er stellte die Torhüter an den Toren des Hauses Jahwes auf, damit niemand hineinkäme, der in irgendeiner Hinsicht unrein war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und kein Unreiner soll wegen irgendeiner Sache eintreten“. Gemeint ist jede Art oder Ursache von Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Er stellte … auf
  rationale: Der Hifil von עמד bezeichnet hier das Positionieren von Personen für ihren Dienst; „aufstellen“ ist im Deutschen natürlich und präzise.
- source_word: הַשֹּׁועֲרִים
  choice: die Torhüter
  rationale: Das Substantiv bezeichnet die mit der Bewachung der Eingänge beauftragten Personen; „Torhüter“ passt zum Tempelkontext.
- source_word: עַל שַׁעֲרֵי
  choice: an den Toren
  rationale: עַל bezeichnet in diesem Aufstellungskontext die Position bei den Toren; „an“ ist idiomatisches Deutsch.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: „Haus“ bewahrt die konkrete Ausdrucksweise des Hebräischen, während „Jahwe“ den Gottesnamen wiedergibt.
- source_word: וְלֹא יָבֹא
  choice: damit niemand hineinkam
  rationale: 'Die Verbindung kann im Kontext als Zweckangabe verstanden werden: Die Aufstellung sollte den Zutritt Unreiner verhindern.'
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ ist der übliche Begriff für den kultisch-rituellen Status, der den Zugang zum Heiligtum ausschließt.
- source_word: לְכָל דָּבָר
  choice: in irgendeiner Hinsicht
  rationale: Die idiomatische Wendung umfasst jede Art oder Ursache von Unreinheit, ohne sie näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm; „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Unreinheit
  choice: in irgendeiner Hinsicht unrein
  alternative: wegen irgendeiner Sache unrein
  rationale: Der hebräische Ausdruck bleibt allgemein und kann jede kultisch relevante Ursache umfassen; die Übersetzung grenzt die Unreinheit nicht auf einen bestimmten Fall ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und natürlich; „Haus Jahwes“ bewahrt zugleich die Bildsprache des hebräischen Textes.
