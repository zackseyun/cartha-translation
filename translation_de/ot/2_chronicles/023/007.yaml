base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: de
  text: Die Leviten sollen den König ringsum umgeben, jeder mit seinen Waffen in der Hand. Wer in das Haus[a] hineinkommt, soll getötet werden. Bleibt beim König, wenn er hineingeht und wenn er hinausgeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tempel“. Wörtlich: „in das Haus“; im Chronikbuch ist dies eine häufige Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  choice: Die Leviten sollen den König ringsum umgeben
  rationale: Die Hifil-Form hat im Zusammenhang von Jojadas Anweisungen auffordernden Sinn. „sollen … umgeben“ gibt diesen wieder; „ringsum“ bewahrt die verstärkende Angabe סָבִיב.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: jeder mit seinen Waffen in der Hand
  rationale: אִישׁ wird distributiv verstanden. כֵלָיו bezeichnet im Zusammenhang des bewaffneten Schutzes Waffen und nicht allgemein Geräte oder Gefäße.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: Wer aber in das Haus hineinkommt
  rationale: Das substantivierte Partizip formuliert eine allgemeine Bestimmung. „Wer … hineinkommt“ ist im Deutschen natürlich und wahrt die Richtungsangabe אֶל.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die Grundbedeutung von בַּיִת bleibt im Haupttext erhalten. Im Chronikbuch bezeichnet „das Haus“ in diesem Zusammenhang den Tempel; dies wird in der Fußnote erläutert.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Die Hofal-Form bezeichnet ein veranlasstes Töten im Passiv. Die Wiedergabe wahrt sowohl die passive Form als auch den verbindlichen Charakter der Anordnung.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Bleibt beim König
  rationale: היה mit אֶת bezeichnet hier begleitende beziehungsweise schützende Anwesenheit. Der deutsche Imperativ gibt die an die Leviten gerichtete Aufforderung direkt wieder.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: wenn er hineingeht und wenn er hinausgeht
  rationale: Die gepaarte Wendung wird konkret auf die Bewegungen des Königs bezogen und in natürlichem Deutsch wiedergegeben.
