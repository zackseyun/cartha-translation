    rationale: »Es über die Söhne Davids gesagt« klingt im modernen Deutsch sperrig. Der hebräische Ausdruck meint, dass der HERR hinsichtlich beziehungsweise über Davids Nachkommen gesprochen hat. »über die Nachkommen Davids gesprochen hat« bewahrt diese Bedeutung und ist idiomatischer.
  revised_text: 'Die ganze Versammlung schloss im Haus Gottes einen Bund mit dem König. Dann sagte er zu ihnen: »Seht, der Sohn des Königs wird herrschen, wie der HERR über die Nachkommen Davids gesprochen hat.«'
