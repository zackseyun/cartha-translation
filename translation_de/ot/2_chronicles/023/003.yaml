  text: וַ/יִּכְרֹ֨ת כָּל הַ/קָּהָ֥ל בְּרִ֛ית בְּ/בֵ֥ית הָ/אֱלֹהִ֖ים עִם הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִנֵּ֤ה בֶן הַ/מֶּ֨לֶךְ֙ יִמְלֹ֔ךְ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה עַל בְּנֵ֥י דָוִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: de
  text: 'Die ganze Versammlung schloss im Haus Gottes einen Bund mit dem König. Dann sagte er zu ihnen: »Seht, der Sohn des Königs wird herrschen, wie der HERR über die Nachkommen Davids gesprochen hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַקָּהָל
  choice: die ganze Versammlung
  rationale: Gibt die versammelte Gemeinschaft in diesem konkreten erzählerischen Zusammenhang natürlich und umfassend wieder.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Entspricht der etablierten deutschen Wendung für das hebräische Idiom »einen Bund schneiden«.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: im Haus Gottes
  rationale: Bewahrt die konkrete Bezeichnung des Heiligtums, ohne sie interpretierend durch »Tempel« zu ersetzen.
- source_word: יִמְלֹךְ
  choice: wird herrschen
  rationale: Gibt die Aussage über die bevorstehende Königsherrschaft wieder; das Verb bezeichnet hier das Regieren als König.
- source_word: עַל בְּנֵי דָוִיד
  choice: über die Söhne Davids
  rationale: Bewahrt die semantische Offenheit von עַל als »über/hinsichtlich« und den pluralischen Bezug auf Davids Nachkommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der verbreiteten deutschen Bibeltradition und kennzeichnet den Gottesnamen durch Kapitälchen, ohne eine unsichere Aussprache festzulegen.
- issue: Modalität von יִמְלֹךְ
  choice: wird herrschen
  alternative: soll herrschen
  rationale: Der Kontext stellt die Königsherrschaft des Königssohns als Verwirklichung der göttlichen Zusage dar. Der deutsche Futur wahrt diese Aussage, ohne ausdrücklich einen zusätzlichen Befehlscharakter einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Seht« bewahrt die aufmerksamkeitslenkende Kraft von הִנֵּה, ohne altertümlich zu wirken. Der pronominale Subjektwechsel bleibt wie im Hebräischen unausgeführt; aus dem Kontext ist Jojada als Sprecher erkennbar.
