base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: de
  text: Und er stellte das ganze Volk auf, jeden Mann mit seiner Waffe in der Hand, von der rechten Seite des Hauses bis zur linken Seite des Hauses, beim Altar und beim Haus, rings um den König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Und er stellte … auf
  rationale: Das Hifil von עמד bezeichnet hier das Aufstellen beziehungsweise Positionieren der Menschen.
- source_word: שִׁלְחוֹ
  choice: seiner Waffe
  rationale: שֶׁלַח bezeichnet in diesem militärischen Zusammenhang eine Waffe; die allgemeinere Wiedergabe bewahrt die fehlende Spezifizierung des Waffentyps.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית … עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: von der Südseite des Hauses bis zur Nordseite des Hauses
  rationale: Wörtlich steht ‚von der rechten Seite … bis zur linken Seite‘. Bei einer nach Osten orientierten Perspektive entsprechen rechts und links Süden und Norden; die Himmelsrichtungen machen die räumliche Angabe im Deutschen klar.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: rings um den König
  rationale: Die Wendung beschreibt die schützende Aufstellung im Umkreis des Königs; ‚rings um‘ gibt סָבִיב idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärisch-räumlicher Beschreibung. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen unnatürlich zu wirken.
