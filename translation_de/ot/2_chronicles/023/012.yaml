base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: de
  text: Als Atalja den Lärm des Volkes hörte, das lief und den König pries, kam sie zum Volk in das Haus des HERRN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: Lärm
  rationale: Im Zusammenhang bezeichnet das Wort das weithin hörbare Geräusch der herbeilaufenden und preisenden Menge; „Lärm“ ist hier natürlicher als das allgemeinere „Stimme“ oder „Schall“.
- source_word: הָרָצִים
  choice: das herbeilief
  rationale: Das Partizip beschreibt das Volk in Bewegung. „Herbeilief“ gibt den situativen Sinn idiomatisch wieder, ohne ein Ziel über den Kontext hinaus festzulegen.
- source_word: הַמְהַלְלִים
  choice: den König pries
  rationale: Das Partizip bezeichnet lobendes Preisen; „pries“ bewahrt den feierlichen Ton und passt zur gleichzeitigen Handlung.
- source_word: בֵּית יְהוָה
  choice: Haus des HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit „HERR“ in Kapitälchen wird beibehalten; „Haus“ entspricht der Bildsprache des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: „HERR“ folgt einer etablierten deutschen Bibeltradition und vermeidet eine unsichere Vokalisierung des Namens, ohne den Bezug auf den Gottesnamen zu verwischen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng am Hebräischen, wird jedoch durch Relativsatz und idiomatische Verbwahl natürlich gestaltet.
