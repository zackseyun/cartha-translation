  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: de
  text: Salomo heiligte den mittleren Teil des Vorhofs vor dem Haus Jahwes, denn dort brachte er die Brandopfer und die Fettstücke der Heilsopfer dar. Denn der Bronzealtar, den Salomo gemacht hatte, konnte das Brandopfer, das Speiseopfer und die Fettstücke nicht fassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: heiligte
  rationale: Das Hifil von קדשׁ bezeichnet hier die Aussonderung eines Bereichs für den heiligen, kultischen Gebrauch. „Heiligte“ ist im Deutschen würdig, verständlich und sachlich präzise.
- source_word: תּוֹךְ הֶחָצֵר
  choice: den mittleren Teil des Vorhofs
  rationale: תּוֹךְ bezeichnet die Mitte beziehungsweise das Innere; „den mittleren Teil“ gibt die räumliche Bestimmung wieder, ohne den gesamten Vorhof zu meinen.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: vor dem Haus Jahwes
  rationale: לִפְנֵי ist hier räumlich zu verstehen. „Haus“ bewahrt die konkrete Tempelbezeichnung des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: עָשָׂה שָׁם
  choice: dort brachte er … dar
  rationale: עָשָׂה bedeutet wörtlich „machte/tat“, wird hier aber idiomatisch für das Darbringen von Opfern gebraucht.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: die Brandopfer / das Brandopfer
  rationale: Die erste Form ist Plural, die zweite Singular mit kollektiv-kategorialer Bedeutung; dieser Formunterschied bleibt in der Übersetzung erhalten.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: die Fettstücke der Heilsopfer
  rationale: חֶלֶב meint im Opferkontext die zum Verbrennen bestimmten Fettstücke. „Heilsopfer“ ist eine etablierte deutsche Wiedergabe von שְׁלָמִים, die den umfassenden Gedanken von Heil und Wohlergehen wahrt.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: der Bronzealtar
  rationale: נְחֹשֶׁת bezeichnet im Zusammenhang der Tempelgeräte am natürlichsten Bronze; die Zusammensetzung „Bronzealtar“ ist idiomatisches Deutsch.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: den Salomo hatte anfertigen lassen
  rationale: Beim monumentalen Altar bezeichnet עָשָׂה Salomos veranlasstes Herstellen; die deutsche Kausativform vermeidet die missverständliche Aussage, er habe ihn eigenhändig gefertigt.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: konnte … nicht fassen
  rationale: Die Wendung bezeichnet unzureichendes Fassungsvermögen. „Nicht fassen“ ist knapp und im Deutschen natürlich.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה ist hier der kultische Fachbegriff für ein unblutiges, überwiegend aus Getreide bestehendes Opfer; „Speiseopfer“ ist die geläufige deutsche Bezeichnung.
- source_word: הַחֲלָבִים
  choice: die Fettstücke
  rationale: Der Plural bezeichnet die einzelnen zum Opfer gehörenden Fettteile; „Fettstücke“ ist genauer und natürlicher als „Fette“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Transliteration „Jahwe“ bewahrt den Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer
  rationale: Die Opferbezeichnung umfasst Vorstellungen von Heil, Wohlergehen und Gemeinschaft. „Heilsopfer“ wahrt diese semantische Breite besser als eine einseitige Festlegung auf Frieden oder Gemeinschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger kultischer Terminologie. Die Satzfolge wurde leicht gegliedert, um die doppelte hebräische Begründung mit כִּי klar und natürlich wiederzugeben.
