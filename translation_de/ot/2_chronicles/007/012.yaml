source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: de
  text: 'Da erschien Jahwe Salomo in der Nacht[a] und sagte zu ihm: »Ich habe dein Gebet gehört und diesen Ort für mich als ein Haus für Schlachtopfer[b] erwählt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei Nacht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »als ein Haus des Schlachtopfers«; gemeint ist ein Haus, das dem Opferdienst dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Das Nifal von ראה bezeichnet hier ein Sichzeigen bzw. eine sichtbare Offenbarung; »erschien« ist im Deutschen natürlich und lässt die Art der Erscheinung offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּלָּיְלָה
  choice: in der Nacht
  rationale: Die Wendung gibt die nächtliche Zeitangabe direkt und in natürlichem Deutsch wieder; »bei Nacht« ist ebenfalls möglich.
- source_word: שָׁמַעְתִּי
  choice: Ich habe ... gehört
  rationale: 'Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtiger Bedeutung: Jahwe hat Salomos Gebet vernommen und antwortet nun darauf.'
- source_word: תְּפִלָּתֶךָ
  choice: dein Gebet
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe des Substantivs תְּפִלָּה.
- source_word: וּבָחַרְתִּי
  choice: und ... erwählt
  rationale: Das deutsche Perfekt wird zusammen mit »habe« gebildet und entspricht der abgeschlossenen, fortwirkenden Wahl; »erwählt« bewahrt zudem den biblisch-theologischen Klang von בחר.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Die Formulierung verweist unmittelbar auf den soeben eingeweihten Tempelort.
- source_word: לִי
  choice: für mich
  rationale: Die Dativform bezeichnet Zugehörigkeit bzw. Bestimmung für Jahwe; »für mich« ist präzise und natürlich.
- source_word: לְבֵית זָבַח
  choice: als ein Haus für Schlachtopfer
  rationale: Die Wiedergabe hält die konkrete Bedeutung von זֶבַח als Schlacht- bzw. Opfergabe fest und macht verständlich, dass das Haus dem Opferdienst bestimmt ist, ohne interpretierend »Tempel« einzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְבֵית זָבַח
  choice: als ein Haus für Schlachtopfer
  alternative: als ein Opferhaus
  rationale: Die gewählte Fassung wahrt die kultische Konkretheit von זֶבַח und vermeidet zugleich die mögliche Missdeutung, das Gebäude selbst sei ein zu opferndes Haus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Erzählfluss; die Opferterminologie wird verständlich formuliert, ohne sie durch eine konfessionell geprägte Deutung zu erweitern.
