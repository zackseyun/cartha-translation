  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: de
  text: 'Und sie werden sagen: »Weil sie Jahwe, den Gott ihrer Väter, verlassen haben, der sie aus dem Land Ägypten herausgeführt hat, und an anderen Göttern festhielten[a], sich vor ihnen niederwarfen und ihnen dienten, darum hat er all dieses Unheil[b] über sie gebracht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich an andere Götter klammerten«. Das hebräische Verb bedeutet wörtlich »festhalten, ergreifen« und drückt eine bewusste Bindung an fremde Götter aus.'
    reason: lexical_alternative
  - marker: b
    text: »Unheil« bezeichnet hier eine Katastrophe beziehungsweise ein Strafgericht, nicht moralisch Böses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Und sie werden sagen
  rationale: Das mit וְ verbundene Qal-Perfekt führt in diesem Vorhersagezusammenhang die Zukunftsaussage des vorigen Verses fort.
- source_word: עַל אֲשֶׁר
  choice: Weil
  rationale: Die Verbindung leitet den Grund für die Verwüstung ein; »weil« gibt die kausale Funktion natürlich wieder.
- source_word: עָזְבוּ
  choice: verlassen haben
  rationale: עזב bezeichnet hier die schwerwiegende Abkehr von Jahwe. »Verlassen« ist klar, würdig und im Deutschen weniger altertümlich als »verlassen/aufgegeben« geprägte Alternativen wie »den Rücken gekehrt«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: den Gott ihrer Väter
  rationale: Die Konstruktion bezeichnet den Gott der Vorfahren und betont die geschichtliche und bundesbezogene Kontinuität. »Väter« bewahrt die traditionelle, quellennahe Ausdrucksweise.
- source_word: אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: der sie aus dem Land Ägypten herausgeführt hat
  rationale: Dies gibt die feste Exodusformel und den kausativen Sinn des Hifil von יצא klar wieder.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: und sich an andere Götter hielten
  rationale: חזק mit ב bezeichnet bewusstes Ergreifen beziehungsweise Festhalten. Die reflexive deutsche Wendung vermittelt die entschiedene Bindung, ohne den Sinn auf eine bestimmte theologische Deutung zu verengen.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: sich vor ihnen niederwarfen
  rationale: Die Formulierung bewahrt die konkrete Körperhandlung des Sich-Niederwerfens; der folgende Ausdruck nennt gesondert den Dienst.
- source_word: וַיַּעַבְדוּם
  choice: und ihnen dienten
  rationale: עבד bezeichnet im Blick auf Götter kultischen Dienst. »Dienten« wahrt die lexikalische Unterscheidung zum vorhergehenden Niederwerfen.
- source_word: עַל כֵּן
  choice: darum
  rationale: »Darum« kennzeichnet prägnant die folgende Konsequenz und klingt im modernen Deutschen natürlicher als ein mehrfach verschachteltes »deshalb«.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: hat er ... über sie gebracht
  rationale: Das Perfekt beschreibt die eingetretene Katastrophe, welche die Sprecher erklären; die deutsche Verbindung »über jemanden bringen« entspricht der hebräischen Wendung.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: all dieses Unheil
  rationale: רָעָה bezeichnet hier die erfahrene Katastrophe beziehungsweise das Gericht, nicht moralische Bosheit. »Unheil« wahrt zugleich die Breite des Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. Die Transliteration bewahrt diesen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Verhältnis von Abkehr und Gericht
  choice: Die kausale Folge wird mit »Weil ... darum« ausdrücklich bewahrt.
  alternative: Eine bloße zeitliche oder allgemein folgernde Verknüpfung
  rationale: עַל אֲשֶׁר und עַל כֵּן stellen die Verwüstung als Folge der Abkehr und des Fremdgötterdienstes dar; diese Spannung darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der hebräischen Begründungs- und Folgekonstruktion, bleibt aber gut verständlich. Die drei unterschiedlichen Handlungen gegenüber den fremden Göttern – sich an sie halten, sich niederwerfen und dienen – bleiben getrennt erhalten.
