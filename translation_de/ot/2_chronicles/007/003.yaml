source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: de
  text: 'Als alle Israeliten sahen, wie das Feuer herabkam und die Herrlichkeit Jahwes auf dem Haus[a] ruhte, warfen sie sich auf dem Pflaster mit dem Gesicht zur Erde nieder. Sie beteten an und dankten Jahwe: »Denn er ist gut, denn seine Güte bleibt ewig.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus« ist der Tempel gemeint. Das Hebräische kann auch mit »über dem Haus« wiedergegeben werden.
    reason: Sachhinweis und Bewahrung einer räumlichen Übersetzungsalternative.
  - marker: b
    text: Das hebräische Wort für »Güte« (חֶסֶד) kann auch Gottes beständige Liebe, Gnade, Treue oder Bundestreue bezeichnen.
    reason: Hinweis auf die theologisch bedeutsame Bedeutungsbreite des hebräischen Schlüsselworts.
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Als alle Israeliten
  rationale: Die wörtliche Wendung »alle Söhne Israels« ist hier eine übliche kollektive Bezeichnung für das ganze Volk. »Alle Israeliten« gibt ihre Bedeutung im modernen Deutschen natürlich und inklusiv wieder.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: sahen, wie das Feuer herabkam
  rationale: Das Partizip und die Infinitivkonstruktion bezeichnen das Wahrnehmen des gleichzeitig geschehenden Herabkommens. Die deutsche Nebensatzkonstruktion bildet dies klar und natürlich ab.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: und die Herrlichkeit Jahwes auf dem Haus ruhte
  rationale: כָּבוֹד bezeichnet die sichtbar offenbarte göttliche Herrlichkeit. Das im Deutschen ergänzte »ruhte« macht die elliptische Zuordnung verständlich, ohne die Art der Erscheinung näher festzulegen; »Haus« bewahrt den hebräischen Tempelbegriff.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: knieten sie auf dem Pflaster nieder, das Gesicht zur Erde
  rationale: Die Formulierung gibt sowohl das Niederknien als auch die Haltung der vollständigen Demut wieder. רִצְפָה bezeichnet den gepflasterten Boden beziehungsweise das Pflaster.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: Sie beteten an
  rationale: Da die körperliche Niederwerfung bereits beschrieben wurde, bringt »beteten an« hier den religiösen Sinn des Verbs ohne unnötige Wiederholung zum Ausdruck.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: und dankten Jahwe
  rationale: ידה im Hifil bezeichnet in dieser liturgischen Formel das Danken beziehungsweise lobende Preisen. »Dankten« passt unmittelbar zu dem folgenden Bekenntnis.
- source_word: כִּי טוֹב
  choice: Denn er ist gut
  rationale: Das ausdrücklich fehlende Subjekt ist aus dem Gottesnamen im vorangehenden Satz zu erschließen. »Denn« bewahrt die begründende Kraft von כִּי und die bekannte liturgische Form.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: denn seine Güte bleibt ewig
  rationale: חֶסֶד umfasst beständige Zuwendung, Loyalität, Gnade und Bundestreue. »Güte« ist im Deutschen würdig und verständlich; die Fußnote hält die größere Bedeutungsbreite offen. »Bleibt ewig« ergänzt idiomatisch das im Hebräischen nominal ausgedrückte Fortbestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von חַסְדּוֹ in der liturgischen Formel
  choice: seine Güte
  alternative: seine Gnade; seine bundestreue Liebe; seine Treue
  rationale: Kein einzelnes deutsches Wort deckt die Bedeutungsbreite von חֶסֶד vollständig ab. »Güte« ist verständlich und für die traditionelle Lobpreisformel geeignet; die Fußnote bewahrt die Aspekte beständiger Liebe, Gnade und Bundestreue.
- issue: Bezug von עַל הַבָּיִת
  choice: auf dem Haus
  alternative: über dem Haus; auf dem Tempel
  rationale: Die Präposition עַל kann räumlich »auf« oder »über« bedeuten. Der Haupttext bleibt nahe an der hebräischen Formulierung; »Haus« wird durch eine Fußnote als Tempel kenntlich gemacht, ohne das Bild im Text zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Anredeform und der Gottesname folgen dem unmittelbaren hebräischen Text. »Pflaster«, »Herrlichkeit« und »anbeten« bewahren den kultischen Ton, ohne altertümlich zu wirken.
