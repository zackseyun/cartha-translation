  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: de
  text: Am achten Tag hielten sie eine Festversammlung[a], denn sie hatten die Einweihung des Altars sieben Tage lang begangen[b] und das Fest sieben Tage lang gefeiert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine feierliche Versammlung“ beziehungsweise „eine Abschlussversammlung“. Das hebräische Wort bezeichnet im Zusammenhang eines heiligen Festes eine besondere abschließende Zusammenkunft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „feierten die Einweihung des Altars“. Wörtlich: „machten“ oder „taten die Einweihung des Altars“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  choice: Festversammlung
  rationale: Das Substantiv bezeichnet hier eine besondere abschließende Versammlung im Rahmen eines heiligen Festes. „Festversammlung“ gibt sowohl den Versammlungs- als auch den kultischen Festcharakter natürlich wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Erklärung für die Versammlung am achten Tag ein.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: die Einweihung des Altars
  rationale: Die Wendung bezeichnet die zeremonielle Einweihung beziehungsweise Inbetriebnahme des Altars; „Einweihung“ ist im Deutschen klar und idiomatisch.
- source_word: עָשׂוּ
  choice: hatten sie … gefeiert
  rationale: Das Verb bedeutet wörtlich „tun/machen“, bezeichnet hier aber die Durchführung einer religiösen Feier. Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass die sieben Tage der Einweihung der Versammlung am achten Tag vorausgingen.
- source_word: וְהֶחָג
  choice: und … das Fest
  rationale: Der bestimmte Ausdruck bezeichnet das Fest im unmittelbaren Kontext. Die Übersetzung benennt es nicht ausdrücklich als Laubhüttenfest, da dies im Vers selbst nicht steht.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Diese geläufige deutsche Dauerangabe entspricht dem hebräischen Ausdruck und passt zu beiden parallel genannten Feiern.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Die knappe Wiedergabe folgt dem Hebräischen, ohne „des Festes“ aus dem Kontext hinzuzufügen.
