source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: de
  text: Dann werde ich sie aus meinem Land, das ich ihnen gegeben habe, ausreißen. Und dieses Haus[a], das ich für meinen Namen geheiligt habe, werde ich aus meiner Gegenwart verstoßen[b]; ich werde es bei allen Völkern zum Sprichwort und zum Gespött machen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: dieser Tempel. Hebräisch: „dieses Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von meinem Angesicht wegwerfen“; gemeint ist: aus Gottes Gegenwart.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Spott und zum Hohn“; die beiden hebräischen Wörter können eine sprichwörtliche Redensart und öffentliche Verachtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: Dann werde ich sie … ausreißen
  rationale: נתשׁ bezeichnet ein Heraus- oder Ausreißen, besonders aus dem Boden. „Ausreißen“ bewahrt das Bild der Entwurzelung; וּ wird im Bedingungszusammenhang mit dem vorhergehenden Vers folgernd als „Dann“ wiedergegeben.
- source_word: מֵעַל אַדְמָתִי
  choice: aus meinem Land
  rationale: אֲדָמָה kann Erdboden oder Land bedeuten. Im Zusammenhang mit dem von Gott verliehenen Gebiet ist „Land“ natürlich und bewahrt zugleich den Gedanken göttlichen Eigentums.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: das ich ihnen gegeben habe
  rationale: Die Relativkonstruktion wird direkt wiedergegeben; das Perfekt bezeichnet die vollzogene, weiterhin bedeutsame Gabe.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. Die Wiedergabe bewahrt den biblischen Ausdruck, während eine Fußnote die kontextuelle Bedeutung nennt.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: das ich für meinen Namen geheiligt habe
  rationale: Die Hifil-Form von קדשׁ bezeichnet das Aussondern als heilig. „Für meinen Namen“ erhält die theologisch wichtige Namensformel, ohne sie auszudeuten.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: werde ich aus meinen Augen verbannen
  rationale: Das hebräische Bild lautet wörtlich „von über/vor meinem Angesicht wegwerfen“. Die deutsche Formulierung vermittelt deutlich die Zurückweisung und bewahrt mit „Augen“ einen Teil des Körperbildes.
- source_word: וְאֶתְּנֶנּוּ
  choice: ich werde es … machen
  rationale: נתן mit prädikativer Ergänzung bedeutet hier, etwas in einen bestimmten Zustand zu versetzen oder dazu zu machen.
- source_word: לְמָשָׁל
  choice: zum Sprichwort
  rationale: מָשָׁל kann Sprichwort, Beispielwort oder Spottrede bezeichnen. In der Paarung mit שְׁנִינָה ist „Sprichwort“ eine knappe, offene Wiedergabe.
- source_word: לִשְׁנִינָה
  choice: zum Spottwort
  rationale: שְׁנִינָה bezeichnet eine spöttische Redensart beziehungsweise etwas, das öffentlich verspottet wird. „Spottwort“ bewahrt sowohl den sprachlichen als auch den verächtlichen Aspekt.
- source_word: בְּכָל הָעַמִּים
  choice: bei allen Völkern
  rationale: עַמִּים ist der Plural „Völker“. „Bei allen Völkern“ gibt den weiten öffentlichen Geltungsbereich idiomatisch wieder.
theological_decisions:
- issue: Bezeichnung des Tempels
  choice: dieses Haus
  alternative: dieser Tempel
  rationale: Der hebräische Text sagt „Haus“, eine geläufige Bezeichnung für den Tempel. Diese Form erhält das Ausgangsbild und legt keine zusätzliche Deutung fest.
- issue: Bild für die göttliche Zurückweisung
  choice: aus meinen Augen verbannen
  alternative: von meinem Angesicht wegwerfen
  rationale: Die gewählte Fassung vermittelt die Zurückweisung in natürlichem Deutsch, ohne die Rede vom göttlichen Angesicht metaphysisch zu erklären. Eine Fußnote nennt die wörtlichere Form.
- issue: Bedeutung des Wortpaares מָשָׁל und שְׁנִינָה
  choice: zum Sprichwort und zum Spottwort
  alternative: zum Spott und zum Hohn
  rationale: Die Wahl erhält zwei verschiedene sprachliche Begriffe und bewahrt zugleich die im zweiten Wort deutlich hervortretende öffentliche Verachtung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzrhythmus folgt den drei Gerichtsaussagen des Hebräischen. „Haus“, „für meinen Namen“ und das Entwurzelungsbild bleiben erhalten; weniger geläufige Bedeutungsnuancen werden knapp in Fußnoten erläutert.
