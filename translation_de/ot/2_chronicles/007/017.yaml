source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: de
  text: 'Was dich aber betrifft: Wenn du in meiner Gegenwart lebst, wie dein Vater David in meiner Gegenwart gelebt hat, und alles tust, was ich dir geboten habe, und meine Satzungen und Rechtsbestimmungen[a] einhältst,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtsentscheide“.'
    reason: Lexikalische Alternative für וּמִשְׁפָּטַי; der Ausdruck kann sowohl rechtliche Bestimmungen als auch richterliche Entscheidungen bezeichnen.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Was dich aber betrifft
  rationale: Das vorangestellte Pronomen hebt Salomo hervor und markiert die direkte Hinwendung zu ihm; die Formulierung gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: אִם
  choice: wenn
  rationale: Leitet eindeutig den Bedingungssatz ein.
- source_word: תֵּלֵךְ לְפָנַי
  choice: du deinen Weg vor mir gehst
  rationale: Bewahrt das hebräische Bild des Gehens und vermittelt zugleich verständlich eine Lebensführung in Gottes Gegenwart.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: wie dein Vater David es tat
  rationale: Bezieht sich knapp und eindeutig auf das unmittelbar vorher genannte Gehen vor Gott, ohne im Deutschen eine schwerfällige Wiederholung zu erzeugen.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: dabei alles tust, was ich dir geboten habe
  rationale: „Dabei“ gibt die begleitende Funktion des Infinitivkonstrukts wieder; „alles“ bewahrt den umfassenden Sinn von כְּכֹל.
- source_word: חֻקַּי
  choice: meine Satzungen
  rationale: Gängige, würdige Wiedergabe im rechtlichen und bundesbezogenen Zusammenhang; sie bleibt vom folgenden Begriff unterschieden.
- source_word: וּמִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Gibt den rechtlichen Gehalt von מִשְׁפָּט wieder und ist im heutigen Deutsch verständlicher als das wörtlichere „Gerichte“.
- source_word: תִּשְׁמֹר
  choice: einhältst
  rationale: Drückt im Zusammenhang mit Satzungen und Rechtsbestimmungen die geforderte gehorsame Beachtung idiomatisch aus.
theological_decisions:
- issue: Bundesgehorsam als ausdrückliche Bedingung, ohne eine Verdienstlehre einzutragen
  choice: Die Wenn-Struktur und die umfassende Gehorsamsforderung werden ausdrücklich beibehalten.
  alternative: Die Aussage allgemein als Treue umschreiben oder ihren Bedingungscharakter abschwächen.
  rationale: Der Vers richtet eine reale Bedingung an Salomo. Die Übersetzung bewahrt diese Spannung und fügt keine weitergehende dogmatische Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Deinen Weg vor mir gehen“ bewahrt das biblische Bild, bleibt aber für heutige Leser verständlich. Der Vers endet entsprechend dem hebräischen Satzbau mit einem Komma, da der Bedingungssatz im folgenden Vers fortgeführt wird.
