  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: de
  text: 'Und dieses Haus[a], das so erhaben war – jeder, der daran vorbeikommt, wird entsetzt sein[b] und sagen: »Warum hat Jahwe diesem Land und diesem Haus das angetan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus« ist hier der Tempel gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Dieses Haus, das so erhaben war, wird für jeden, der daran vorbeikommt, zum Entsetzen werden.« Das hebräische Verb kann sowohl Verwüstung als auch das dadurch ausgelöste Entsetzen bezeichnen; sein Satzbezug ist mehrdeutig.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Und über dieses Haus
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempel. Die Präposition »über« macht im Deutschen deutlich, worüber die Vorübergehenden entsetzt sind, ohne »Haus« durch die kontextuelle Deutung »Tempel« zu ersetzen.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: das so erhaben war
  rationale: עֶלְיוֹן bezeichnet hier die frühere Höhe, herausragende Stellung oder Pracht des Hauses. »Erhaben« bewahrt diese Bedeutung besser als das rein räumliche »hoch«; »so« klingt in der rückblickenden Aussage natürlich.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: wird jeder, der daran vorbeikommt, entsetzt sein
  rationale: 'יִשֹּׁם aus שׁמם kann das Erstarren vor Entsetzen bezeichnen. לְכָל עֹבֵר lässt sich als vorangestellte Bezugskonstruktion verstehen: »Was jeden Vorübergehenden betrifft, er wird entsetzt sein.« Die alternative Beziehung auf das verwüstete Haus bleibt in einer Fußnote erhalten.'
- source_word: וְאָמַר
  choice: und sagen
  rationale: Die morphologische Einzahl stimmt mit dem distributiven »jeder« überein. Im Deutschen kann sie natürlich durch die gemeinsame Verbkonstruktion »wird … entsetzt sein und sagen« wiedergegeben werden.
- source_word: בַּמֶּה
  choice: Warum
  rationale: Die wörtliche Frage »Weswegen?« wird im gegenwärtigen Standarddeutsch am natürlichsten mit »Warum?« ausgedrückt.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: hat Jahwe … das angetan
  rationale: Das Perfekt bezeichnet eine bereits vollzogene Handlung mit sichtbaren Folgen. »Das angetan« gibt כָּכָה idiomatisch wieder und passt zur negativen Wirkung des göttlichen Gerichts.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: diesem Land und diesem Haus
  rationale: »Land« bewahrt die übliche und bundestheologisch offene Bedeutung von אֶרֶץ; die Wiederholung von »Haus« entspricht dem Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« ist dessen geläufige deutsche Wiedergabe und ersetzt ihn nicht durch einen Titel.
- issue: Bezug und Bedeutung von יִשֹּׁם
  choice: Jeder Vorübergehende wird über das Haus entsetzt sein
  alternative: Das Haus wird verwüstet daliegen beziehungsweise zum Bild des Entsetzens werden
  rationale: Form und Satzbau erlauben, den distributiv genannten Vorübergehenden als logisches Subjekt zu verstehen. Zugleich umfasst שׁמם sowohl Verwüstung als auch die dadurch ausgelöste Bestürzung; deshalb wird die sachlich und theologisch bedeutsame Alternative nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Einzahl »jeder … wird … sagen« folgt der hebräischen distributiven Einzahl. »Haus« wahrt die Bildsprache des Ausgangstextes; die kontextuelle Bedeutung »Tempel« wird knapp erläutert.
