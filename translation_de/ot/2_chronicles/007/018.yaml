source:
  edition: WLC
  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: de
  text: 'dann werde ich den Thron deiner Königsherrschaft festigen, wie ich mit deinem Vater David einen Bund geschlossen habe mit den Worten: »Es wird dir nicht an einem Mann fehlen[a], der über Israel herrscht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Mann, der über Israel herrscht, wird nicht von dir abgeschnitten werden.«'
    reason: Bewahrt die konkrete hebräische Wendung לֹא יִכָּרֵת לְךָ, während der Haupttext ihren dynastischen Sinn idiomatisch wiedergibt.
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: dann werde ich … festigen
  rationale: Das Hifil von קום bedeutet hier, etwas dauerhaft bestehen zu lassen bzw. zu festigen. Im Bedingungsgefüge mit dem vorhergehenden Vers gibt „dann“ die Folgerung natürlich wieder.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: den Thron deiner Königsherrschaft
  rationale: Die Wiedergabe bewahrt beide Substantive der hebräischen Genitivverbindung. „Königsherrschaft“ bezeichnet dabei sowohl das Königtum als auch die ausgeübte Herrschaft.
- source_word: כָּרַתִּי לְדָוִיד
  choice: wie ich mit … David einen Bund geschlossen habe
  rationale: כרת bezeichnet in diesem Zusammenhang den Abschluss eines Bundes. Im Deutschen muss das im Hebräischen vorausgesetzte Objekt „Bund“ ergänzt werden, damit die feste Wendung verständlich bleibt.
- source_word: לְדָוִיד אָבִיךָ
  choice: mit deinem Vater David
  rationale: „Vater“ wird entsprechend dem hebräischen dynastischen Sprachgebrauch beibehalten; gemeint ist Salomos leiblicher Vater David.
- source_word: לֵאמֹר
  choice: mit den Worten
  rationale: Leitet das folgende Bundeswort in natürlichem, würdigem Deutsch ein.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Es wird dir nie an einem Mann fehlen
  rationale: Die hebräische Wendung lautet wörtlich, ein Mann werde jemandem nicht „abgeschnitten“. Im dynastischen Zusammenhang bedeutet sie idiomatisch, dass es ihm nicht an einem männlichen Herrscher aus seiner Linie fehlen werde. Die Fußnote bewahrt das Bild des Ausgangstextes.
- source_word: מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: der über Israel herrscht
  rationale: Das Partizip beschreibt den Mann als Herrscher; bei משל bezeichnet ב den Herrschaftsbereich und wird im Deutschen idiomatisch mit „über“ wiedergegeben.
theological_decisions:
- issue: Formulierung der dynastischen Zusage
  choice: Es wird dir nie an einem Mann fehlen, der über Israel herrscht.
  alternative: Ein Mann, der über Israel herrscht, wird dir nicht abgeschnitten werden.
  rationale: Die Hauptfassung gibt den Sinn der hebräischen Redewendung verständlich wieder, ohne die Zusage über den Wortlaut hinaus zu systematisieren. Die wörtlichere Alternative in der Fußnote erhält das Bild des Abschneidens und damit die dynastische Spannung des Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Ton. Die Bundesformulierung bleibt ausdrücklich erhalten; die schwer verständliche hebräische Abschneide-Metapher wird im Haupttext idiomatisch und in der Fußnote formal nah wiedergegeben.
