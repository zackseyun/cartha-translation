source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: de
  text: Als Salomo sein Gebet beendet hatte, kam das Feuer vom Himmel herab und verzehrte das Brandopfer und die Schlachtopfer. Und die Herrlichkeit Jahwes erfüllte das Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist der Tempel; wörtlich: „das Haus“.'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: Als Salomo sein Gebet beendet hatte
  rationale: Die temporale Infinitivkonstruktion bezeichnet den Zeitpunkt nach Abschluss des Gebets. Die deutsche Formulierung ist natürlich und bewahrt den zeitlichen Zusammenhang, ohne eine stärkere Unmittelbarkeit auszudrücken, als der hebräische Text verlangt.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: kam das Feuer vom Himmel herab
  rationale: Der bestimmte Artikel wird mit „das Feuer“ wiedergegeben. „Vom Himmel herabkommen“ drückt die vertikale Bewegung von יָרַד idiomatisch aus; das morphologisch plurale שָׁמַיִם wird in dieser deutschen Wendung sachgerecht mit dem Singular „Himmel“ übersetzt.
- source_word: וַתֹּאכַל
  choice: verzehrte
  rationale: Das Verb bedeutet wörtlich „aß“, wird aber mit Feuer als Subjekt im Deutschen treffend und würdig mit „verzehrte“ wiedergegeben.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird; „Brandopfer“ ist der etablierte deutsche Fachausdruck.
- source_word: וְהַזְּבָחִים
  choice: und die Schlachtopfer
  rationale: זְבָחִים bezeichnet geschlachtete Opfer und wird so vom zuvor genannten Brandopfer unterschieden. „Schlachtopfer“ erhält diese kultische Unterscheidung genauer als das allgemeinere „Opfer“.
- source_word: וּכְבוֹד יְהוָה
  choice: Und die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die wahrnehmbare göttliche Herrlichkeit. Der Gottesname יהוה wird als „Jahwe“ transliteriert, der im Deutschen üblichen Form des Namens.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: erfüllte das Haus
  rationale: „Haus“ gibt בַּיִת formal wieder und bewahrt die in den Chronikbüchern geläufige Bezeichnung des Tempels als Gottes Haus. Eine Fußnote klärt den Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen; zugleich entspricht diese Schreibung dem modernen deutschen Sprachgebrauch.
- issue: Bezug von הַבָּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Der hebräische Text sagt wörtlich „das Haus“, gemeint ist im Kontext der von Salomo errichtete Tempel. Die Übersetzung wahrt das Bild des Ausgangstextes und erläutert den eindeutigen Sachbezug in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem erzählenden Fortgang des Hebräischen, ohne unnatürlich hebraisierend zu wirken. Kultische Fachbegriffe werden dort beibehalten, wo sie sachliche Unterschiede des Ausgangstextes tragen.
