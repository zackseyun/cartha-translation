id: 2CH.7.16
reference: 2 Chronicles 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: de
  text: Und nun habe ich dieses Haus[a] erwählt und geheiligt[b], damit mein Name dort für immer sei; meine Augen und mein Herz werden dort alle Tage sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dieses Haus“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Das hebräische Verb bedeutet, etwas als heilig auszusondern; auch: „geweiht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb führt den göttlichen Redegang weiter und markiert zugleich einen Übergang.
- source_word: בָּחַרְתִּי
  choice: habe ich … erwählt
  rationale: Das hebräische Perfekt bezeichnet eine vollzogene göttliche Handlung mit fortdauernder Bedeutung. „Erwählt“ bewahrt zudem den bewussten, zielgerichteten Charakter der Wahl.
- source_word: וְהִקְדַּשְׁתִּי
  choice: und geheiligt
  rationale: Die Hifil-Form von קדשׁ bedeutet hier, etwas als heilig auszusondern. „Geheiligt“ ist im Deutschen verständlich und bewahrt den zentralen Begriff des Ausgangstextes.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: Die wörtliche Bezeichnung „dieses Haus“ bleibt erhalten; aus dem Zusammenhang geht hervor, dass der Tempel gemeint ist.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: damit mein Name dort … sei
  rationale: Die Infinitivkonstruktion bezeichnet Zweck beziehungsweise Ergebnis. Der Ausdruck „mein Name“ wird nicht deutend durch „meine Gegenwart“ ersetzt.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte, fortdauernde Zeit und wird in natürlichem modernem Deutsch mit „für immer“ wiedergegeben.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: meine Augen und mein Herz werden dort … sein
  rationale: 'Die körperhafte Bildsprache des Hebräischen bleibt erhalten: Die Augen drücken aufmerksames Hinsehen, das Herz Zuwendung und Bindung aus.'
- source_word: כָּל הַיָּמִים
  choice: alle Tage
  rationale: Die konkrete hebräische Zeitformel wird bewahrt. „Alle Tage“ ist im Deutschen gehoben, aber verständlich, und vermeidet eine unnötige Verflachung zu „immer“.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Augen und Herz
  choice: Die Bilder „meine Augen und mein Herz“ wörtlich bewahren
  alternative: Als „meine Aufmerksamkeit und Fürsorge“ umschreiben
  rationale: Der Ausgangstext verwendet bewusst menschlich-körperhafte Bilder für Gottes aufmerksame, zugewandte und verbindliche Beziehung. Eine Paraphrase würde diese theologische Bildkraft abschwächen.
- issue: Tempeltheologie in der Aussage über Gottes Namen
  choice: „mein Name“ beibehalten
  alternative: „meine Gegenwart“ oder „ich selbst“ einsetzen
  rationale: Der Name bezeichnet in der alttestamentlichen Tempeltheologie Gottes offenbarte und bundgemäße Gegenwart, ohne sie vollständig zu erklären. Eine interpretierende Ersetzung würde die Spannung des Ausdrucks auflösen.
- issue: Dauer der Erwählung und Heiligung des Hauses
  choice: עַד עוֹלָם mit „für immer“ wiedergeben
  alternative: Die Aussage aufgrund späterer Tempelzerstörung zeitlich einschränken
  rationale: Die Übersetzung gibt die uneingeschränkte Formulierung des Verses wieder und trägt keine harmonisierende Einschränkung in den Text ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll biblischer Sprachfärbung. „Alle Tage“ bewahrt die konkrete hebräische Wendung; das Semikolon gliedert die beiden eng verbundenen göttlichen Aussagen klar.
