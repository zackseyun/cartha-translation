  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: de
  text: Wenn ihr euch aber abwendet, meine Ordnungen und Gebote verlasst, die ich euch vorgelegt habe, und zu anderen Göttern geht und ihnen dient und euch vor ihnen niederwerft,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: ihr euch abwendet
  rationale: Das Verb שׁוב bezeichnet hier im Zusammenhang den Abfall beziehungsweise die Abkehr von Gott; die reflexive deutsche Wendung gibt die Bewegungsrichtung natürlich wieder.
- source_word: חֻקּוֹתַי
  choice: meine Ordnungen
  rationale: חֹק bezeichnet verbindliche Festsetzungen; „Ordnungen“ ist verständlich und unterscheidet den Ausdruck von מִצְוֹתַי.
- source_word: מִצְוֹתַי
  choice: meine Gebote
  rationale: Die übliche und genaue Wiedergabe von מִצְוָה ist „Gebot“.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: die ich euch vorgelegt habe
  rationale: Die Wendung bedeutet wörtlich, etwas „vor euch“ zu geben; „vorgelegt“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: וַעֲבַדְתֶּם
  choice: dient
  rationale: עבד bezeichnet im Kultzusammenhang den religiösen Dienst beziehungsweise die Verehrung anderer Götter.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: euch vor ihnen niederwerft
  rationale: Die körperliche Handlung des Sich-Niederwerfens wird bewahrt und nicht lediglich abstrakt als „anbeten“ wiedergegeben.
theological_decisions:
- issue: Bedingte Warnung und Wechsel zur direkten Anrede Israels
  choice: Die zweite Person Plural und die offene Wenn-Konstruktion bleiben erhalten.
  alternative: Eine verallgemeinernde oder bereits als eingetreten formulierte Abfallsaussage.
  rationale: Der hebräische Text richtet eine bedingte Warnung unmittelbar an die angesprochene Gemeinschaft; diese Spannung darf nicht vorweggenommen werden.
- issue: Verhältnis von „dienen“ und „sich niederwerfen“
  choice: Beide Verben werden eigenständig wiedergegeben.
  alternative: Zusammenfassend nur „anbeten“.
  rationale: Der Ausgangstext nennt sowohl kultischen Dienst als auch die konkrete Huldigungsgeste und verstärkt so die Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als bedingter Vordersatz offen, weil er in Vers 20 fortgeführt wird. „Ordnungen“ und „Gebote“ erhalten die beiden parallelen hebräischen Rechtsbegriffe; „hingeht“ bewahrt den zusätzlichen Bewegungsaspekt von הלך.
