id: 2CH.7.8
reference: 2 Chronicles 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: de
  text: Zu jener Zeit feierte Salomo sieben Tage lang das Fest, und ganz Israel feierte mit ihm – eine überaus große Versammlung von Lebo-Hamat[a] bis zum Bach Ägyptens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Zugang nach Hamat«. Der hebräische Ausdruck kann entweder als Ortsname (»Lebo-Hamat«) oder als beschreibende Grenzangabe verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »bis zum Wadi Ägyptens«. Das hebräische Wort kann einen nur zeitweise wasserführenden Lauf oder ein Bachbett bezeichnen, nicht unbedingt einen großen Fluss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: feierte
  rationale: Das Verb bedeutet wörtlich »tun/machen«, bezeichnet aber in Verbindung mit חָג idiomatisch das Feiern oder Begehen eines Festes.
- source_word: הֶחָג
  choice: das Fest
  rationale: חָג bezeichnet ein Fest, besonders ein Wallfahrtsfest. »Fest« ist im Deutschen natürlich, verständlich und bewahrt den bestimmten Artikel.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die Wendung wird als natürliche zeitliche Einleitung wiedergegeben, ohne sie unnötig zu präzisieren.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Diese Formulierung gibt die Dauer im modernen Deutschen idiomatisch wieder.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: und ganz Israel feierte mit ihm
  rationale: »Ganz Israel« bewahrt den kollektiven nationalen Bezug. Das im Hebräischen elliptische »mit ihm« wird im Deutschen durch die Wiederaufnahme des Verbs verständlich gemacht.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: eine überaus große Versammlung
  rationale: Die Nominalgruppe steht als nähere Beschreibung von »ganz Israel«. »Versammlung« gibt קָהָל sachlich wieder, ohne einen unnötig kirchlichen Beiklang.
- source_word: מִלְּבוֹא חֲמָת
  choice: von Lebo-Hamat
  rationale: Die Wendung kann als Ortsname beziehungsweise feste geografische Bezeichnung der Nordgrenze verstanden werden. Die alternative beschreibende Deutung wird in der Fußnote bewahrt.
- source_word: עַד נַחַל מִצְרָיִם
  choice: bis zum Bach Ägyptens
  rationale: נַחַל kann einen Bach, ein Wadi oder ein zeitweise wasserführendes Flussbett bezeichnen und meint nicht zwingend einen großen Fluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich kennzeichnet die appositionelle Beschreibung von »ganz Israel«. Die Fußnotenmarker stehen unmittelbar bei den Ausdrücken, auf die sich die jeweiligen textlichen Alternativen beziehen.
