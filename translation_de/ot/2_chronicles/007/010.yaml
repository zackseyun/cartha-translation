- from: Und am dreiundzwanzigsten Tag des siebten Monats entließ er das Volk zu seinen Zelten[a]. Sie waren fröhlich und guten Herzens über all das Gute, das Jahwe David, Salomo und seinem Volk Israel erwiesen hatte.[b]
  to: Und am dreiundzwanzigsten Tag des siebten Monats entließ er das Volk zu seinen Zelten[a]. Sie waren fröhlich und guten Herzens über all das Gute, das Jahwe David, Salomo und seinem Volk Israel erwiesen hatte.[b]
  rationale: Die Hauptübersetzung bleibt unverändert, da »das Volk zu seinen Zelten« im Deutschen eine natürliche kollektive Formulierung ist. Die Fußnote stellt jedoch die pluralische hebräische Form präzise als »zu ihren Zelten« heraus. Fußnote b wird sprachlich geglättet, ohne ihren lexikalischen Hinweis zu verändern.
