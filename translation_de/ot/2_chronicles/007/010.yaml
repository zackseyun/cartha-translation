  text: וּ/בְ/י֨וֹם עֶשְׂרִ֤ים וּ/שְׁלֹשָׁה֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י שִׁלַּ֥ח אֶת הָ/עָ֖ם לְ/אָהֳלֵי/הֶ֑ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣יד וְ/לִ/שְׁלֹמֹ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: de
  text: Und am dreiundzwanzigsten Tag des siebten Monats entließ er das Volk zu seinen Zelten[a]. Sie waren fröhlich und guten Herzens über all das Gute, das Jahwe David, Salomo und seinem Volk Israel erwiesen hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach Hause; wörtlich: zu ihren Zelten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: all das Gute, das Jahwe für David, Salomo und sein Volk Israel getan hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Und am dreiundzwanzigsten Tag des siebten Monats
  rationale: Natürliche deutsche Datumsangabe; „Und“ bewahrt den erzählerischen Anschluss.
- source_word: שִׁלַּח
  choice: entließ
  rationale: Im Kontext wird die versammelte Festgemeinde zur Heimkehr entlassen; dies gibt den Piel-Sinn präziser wieder als das allgemeinere „sandte“.
- source_word: לְאָהֳלֵיהֶם
  choice: zu seinen Zelten
  rationale: Bewahrt das konkrete hebräische Bild; der idiomatische Sinn „nach Hause“ wird in der Fußnote genannt.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: Sie waren fröhlich und guten Herzens
  rationale: Gibt sowohl die Freude als auch die wörtliche Herzsprache in verständlichem, würdigem Deutsch wieder.
- source_word: עַל הַטּוֹבָה
  choice: über all das Gute
  rationale: Im Deutschen idiomatischer als das abstrakte „über die Güte“ und passend zu עָשָׂה; die singularische Sammelbezeichnung wird als Gesamtheit des Guten ausgedrückt.
- source_word: עָשָׂה ... לְ
  choice: … erwiesen hatte
  rationale: „Gutes erweisen“ ist eine natürliche deutsche Wendung für wohltätiges Handeln; die wörtlichere Wiedergabe „getan hatte“ bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: David, Salomo und seinem Volk Israel
  rationale: Die Dative bezeichnen die Empfänger des erwiesenen Guten; „seinem Volk Israel“ gibt die Apposition natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; „Jahwe“ macht ihn im deutschen Haupttext kenntlich, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von עַמּוֹ („sein Volk“)
  choice: seinem Volk Israel
  alternative: Israel, seinem Volk
  rationale: Beide Fassungen verstehen das Suffix als auf Jahwe bezogen. Die gewählte Form ist im Deutschen flüssig und bewahrt die Identifikation Israels als sein Volk.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet ein schwerfälliges Partizipialgefüge. Das konkrete Bild „Zelte“ und die Herzsprache bleiben erhalten; idiomatische beziehungsweise wörtlichere Alternativen werden in den Fußnoten ausgewiesen.
