id: 2CH.7.2
reference: 2 Chronicles 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: de
  text: Und die Priester konnten das Haus Jahwes[a] nicht betreten, denn die Herrlichkeit Jahwes erfüllte das Haus Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Haus Jahwes«; gemeint ist der Tempel. Die Übersetzung behält »Haus« bei, um die hebräische Ausdrucksweise wiederzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: Und ... konnten ... nicht
  rationale: Die Verbindung aus וְ, Negation und יכל führt die Erzählung fort und bezeichnet fehlende Fähigkeit beziehungsweise Möglichkeit, ohne die Art des Hindernisses näher festzulegen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgerechte Wiedergabe im Zusammenhang des Tempeldienstes.
- source_word: לָבוֹא אֶל
  choice: betreten
  rationale: בוא mit אֶל bezeichnet hier das Hineingehen in einen Ort; »betreten« ist im Deutschen natürlich und präzise.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung »Haus Jahwes« bewahrt die hebräische Ausdrucksweise und ihre Tempeltheologie, statt sie lediglich mit »Tempel« zu umschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי nennt hier den Grund dafür, dass die Priester nicht eintreten konnten; »denn« verbindet die beiden Aussagen in natürlichem, würdigem Deutsch.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Das Verb bezeichnet, dass Jahwes Herrlichkeit das Haus vollständig einnahm. »Erfüllte« bewahrt den gehobenen biblischen Sprachklang, ohne altertümlich zu sein.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Die Genitivverbindung bildet die hebräische Konstruktverbindung transparent ab und verwendet die etablierte Wiedergabe von כבוד.
- source_word: אֶת בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiederholung derselben Formulierung folgt bewusst der hebräischen Wiederholung, statt stilistisch zwischen »Haus« und »Tempel« zu wechseln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. »Jahwe« gibt diesen Namen in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von »Haus Jahwes«
  choice: Die wörtliche Bezeichnung »Haus Jahwes« bleibt im Vers erhalten.
  alternative: Tempel Jahwes
  rationale: Im Kontext ist der Tempel gemeint; die wörtliche Form bewahrt jedoch die Ausdrucksweise und theologische Bildsprache des Hebräischen. Die Fußnote erläutert den Bezug, ohne ihn in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräische Wiederholung von »Haus Jahwes« wird beibehalten; »denn« gibt den kausalen Zusammenhang flüssig wieder.
