id: 2CH.7.13
reference: 2 Chronicles 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: de
  text: Wenn ich den Himmel verschließe, sodass es nicht regnet[a], oder den Heuschrecken befehle, das Land kahl zu fressen, oder eine Seuche unter mein Volk sende[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Falls ich den Himmel verschließe …“ Die hebräische Anfangspartikel kann auch stärker hervorgehoben mit „siehe, wenn“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Für „Seuche“ ist auch die Wiedergabe „Pest“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Wenn
  rationale: Die Partikel leitet hier ein Bedingungsszenario ein. „Wenn“ ist im Deutschen natürlich und bewahrt den Anschluss an die Bedingung im folgenden Vers.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: ich den Himmel verschließe
  rationale: Die konkrete Bildsprache des hebräischen Idioms bleibt erhalten; der folgende Ergebnissatz erklärt eindeutig, dass Regen ausbleibt.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: sodass es nicht regnet
  rationale: Gibt die resultative Beziehung im natürlichen modernen Deutsch wieder.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: den Heuschrecken befehle
  rationale: חָגָב steht kollektiv. Der deutsche Plural bezeichnet den Schwarm natürlich, ohne einen einzelnen Grashüpfer nahezulegen.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: das Land kahl zu fressen
  rationale: „Kahl fressen“ bringt die zerstörerische Wirkung des Heuschreckenfraßes idiomatisch zum Ausdruck, während הָאָרֶץ im Kontext als „das Land“ verstanden wird.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Bezeichnet eine epidemische Krankheit als Gericht; „Seuche“ ist im heutigen Deutsch klarer und natürlicher als „Pestilenz“.
- source_word: בְּעַמִּי
  choice: unter mein Volk
  rationale: Die Präposition bezeichnet hier das Auftreten innerhalb des Volkes; die feste Verbindung mit „senden“ lautet im Deutschen „unter mein Volk senden“.
theological_decisions:
- issue: Die göttlichen Gerichte als Bedingungsszenarien
  choice: „Wenn … oder … oder …“
  alternative: „Siehe, wenn …“ beziehungsweise eine dreifache Wiederholung von „wenn“
  rationale: Die Formulierung bewahrt Gottes unmittelbare Urheberschaft und stellt die genannten Bundesgerichte als mögliche Fälle dar, ohne die hebräische Partikel unnötig als Ausruf wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „den Himmel verschließen“ erhält die biblische Bildsprache; „kahl fressen“ und „Seuche“ sorgen zugleich für unmittelbare Verständlichkeit.
