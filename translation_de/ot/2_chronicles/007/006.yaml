  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: de
  text: Und die Priester standen auf ihren Dienstposten, und die Leviten standen mit den Instrumenten für den Gesang Jahwes[a], die König David hatte anfertigen lassen, um Jahwe zu danken, denn seine treue Liebe bleibt für immer,[b] während David durch sie Lob darbrachte.[c] Die Priester bliesen ihnen gegenüber die Trompeten, während ganz Israel stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Musikinstrumenten Jahwes“. Die hebräische Wendung kann Instrumente meinen, die Jahwe geweiht waren, oder Instrumente, die für den Gesang zu Jahwe verwendet wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn für immer ist seine treue Liebe.“ Das im Deutschen ergänzte „bleibt“ gibt die hebräische Redewendung idiomatisch wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als David durch sie pries“. Der hebräische Ausdruck ist knapp formuliert und deutet wohl darauf, dass die Leviten Davids Lobpreis ausführten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: ihren Dienstposten
  rationale: Das Substantiv bezeichnet die zugewiesenen Wach- oder Dienststellungen. „Dienstposten“ bewahrt sowohl die geordnete Aufstellung als auch den kultischen Dienstbezug.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: mit den Instrumenten für den Gesang Jahwes
  rationale: Die Wendung verbindet die Instrumente ausdrücklich mit dem auf Jahwe bezogenen Gesang. Die Übersetzung erhält diese Beziehung, ohne vorschnell zwischen Besitz, Widmung und Verwendungszweck zu entscheiden.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: um Jahwe zu danken
  rationale: Das Hifil von ידה kann „danken“ oder „preisen“ bedeuten. Die folgende Dankformel mit כִּי לְעוֹלָם חַסְדּוֹ spricht hier besonders für „danken“.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: Denn seine treue Liebe bleibt für immer
  rationale: חֶסֶד umfasst Güte, Liebe und verlässliche Bundestreue. „Treue Liebe“ hält diese Bedeutungsbreite besser zusammen als das engere „Barmherzigkeit“; „bleibt“ gibt das im Hebräischen elliptische Fortdauern idiomatisch wieder.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: Dabei brachte David durch sie Lob dar
  rationale: Die komprimierte Konstruktion bezeichnet David als Subjekt des Lobens und die Leviten als vermittelnde Ausführende. „Durch sie“ gibt das instrumentale בְּיָדָם natürlich wieder, ohne die genaue Art dieser Vermittlung festzulegen.
- source_word: מחצצרים
  choice: bliesen … die Trompeten
  rationale: Das Verb bezeichnet spezifisch das Erklingenlassen von Trompeten. Die deutsche Formulierung ist konkret und im kultischen Zusammenhang natürlich.
- source_word: נֶגְדָּם
  choice: ihnen gegenüber
  rationale: Die Präposition bezeichnet eine räumliche Stellung vor oder gegenüber einer anderen Gruppe. „Gegenüber“ bewahrt diese räumliche Beziehung ohne zusätzliche zeremonielle Deutung.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip zeichnet eine andauernde, szenische Haltung. Das deutsche Präteritum ist hier erzählerisch natürlich; bei den Leviten wird das im Hebräischen elliptisch fehlende Verb aus dem ersten Satzglied ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte / Barmherzigkeit
  rationale: Die Formulierung soll sowohl liebevolle Zuwendung als auch beständige Verlässlichkeit ausdrücken, ohne den Begriff ausschließlich auf Erbarmen oder auf eine bestimmte Bundestheologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Bildsprache. Das Semikolon ordnet die parallelen Gruppen, während die kurzen Hauptsätze die lange hebräische Satzfolge lesbar machen. Die direkte Dankformel wird als gesprochener beziehungsweise gesungener Lobpreis markiert.
