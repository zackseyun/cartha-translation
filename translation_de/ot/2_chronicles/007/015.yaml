  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: de
  text: Nun werden meine Augen offen und meine Ohren aufmerksam sein auf das Gebet an diesem Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf das Gebet dieses Ortes“; auch möglich: „auf das Gebet von diesem Ort“ oder „auf das Gebet, das mit diesem Ort verbunden ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Jetzt
  rationale: Gibt das temporale Adverb knapp wieder und bezeichnet das nun geltende Ergebnis der vorausgehenden Tempelweihe; „Von nun an“ wäre möglich, aber stärker auslegend.
- source_word: עֵינַי
  choice: meine Augen
  rationale: Bewahrt die konkrete anthropomorphe Bildsprache des Hebräischen, statt sie zu „ich werde sehen“ zu verflachen.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: werden … offen … sein
  rationale: Gibt die mit היה und dem Partizip ausgedrückte zukünftige Zustandsaussage natürlich und nah an der Form des Ausgangstextes wieder.
- source_word: וְאָזְנַי
  choice: und meine Ohren
  rationale: Erhält die wörtliche Parallele zu „meine Augen“ und damit die körperhafte Bildsprache.
- source_word: קַשֻּׁבוֹת
  choice: aufmerksam
  rationale: Bezeichnet hörende, zugewandte Aufmerksamkeit und wahrt die adjektivische Parallelstruktur zu „offen“.
- source_word: לִתְפִלַּת
  choice: für das Gebet
  rationale: Das ל markiert hier die Ausrichtung der Aufmerksamkeit. Im Deutschen ist „aufmerksam sein für“ idiomatisch und vermeidet das schwerfällige „aufmerksam auf das Gebet“.
- source_word: הַמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die hebräische Konstruktion lautet wörtlicher „das Gebet dieses Ortes“. „An diesem Ort“ gibt die naheliegende örtliche Zuordnung im Deutschen natürlich wieder, ohne die echte Deutungsspanne zu verschweigen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: „meine Augen“ und „meine Ohren“ wörtlich beibehalten
  alternative: „Ich werde hinsehen und zuhören“
  rationale: Die körperhafte Bildsprache drückt Gottes zugewandte Aufmerksamkeit aus. Ihre Bewahrung respektiert Form und Beziehungsaussage des hebräischen Textes, ohne sie als Aussage über Gottes körperliche Beschaffenheit auszulegen.
- issue: Bezug des Gebets zum Ort
  choice: „das Gebet an diesem Ort“
  alternative: „das Gebet dieses Ortes“ oder „das Gebet von diesem Ort“
  rationale: 'Der hebräische Genitiv bleibt semantisch offen: Gemeint sein kann ein an diesem Ort gesprochenes, mit ihm verbundenes oder von ihm ausgehendes Gebet. Die Hauptfassung ist im Deutschen am natürlichsten; die Alternativen werden in der Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele anthropomorphe Bildsprache bleibt erhalten; die etwas ungewohnte hebräische Genitivverbindung wird im Haupttext natürlich wiedergegeben und in der Fußnote transparent gemacht.
