  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: de
  text: Wenn mein Volk[a], das nach meinem Namen genannt ist, sich demütigt, betet, mein Angesicht sucht und von seinen bösen Wegen umkehrt, dann werde ich vom Himmel her hören, seine Sünde vergeben und sein Land heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über denen mein Name ausgerufen ist“. Diese hebräische Wendung bezeichnet Menschen, die Gott zugehören und seinen Namen tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: sich demütigt
  rationale: Das Nifal von כנע bezeichnet hier im Bedingungssatz eine selbst vollzogene Demütigung bzw. Unterordnung. „Sich demütigen“ ist im Deutschen natürlich und bewahrt den willentlichen Sinn.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die kollektive Bundesbezeichnung wird im Deutschen sachgemäß als Singular „mein Volk“ wiedergegeben.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: über dem mein Name ausgerufen ist
  rationale: Die Formulierung bleibt nahe am hebräischen Bild und bezeichnet Zugehörigkeit zu Gott sowie das Tragen seines Namens. Eine Fußnote erläutert das Idiom.
- source_word: וְיִתְפַּלְלוּ
  choice: betet
  rationale: Das Hitpael von פלל bedeutet hier „beten“. Ein ausdrückliches Objekt wird nicht ergänzt, da es im Hebräischen nur aus dem Zusammenhang hervorgeht.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: mein Angesicht sucht
  rationale: „Mein Angesicht suchen“ bewahrt das hebräische Bild für die Suche nach Gottes Gegenwart und Zuwendung, ohne es interpretierend zu verflachen.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: von seinen bösen Wegen umkehrt
  rationale: שׁוב bezeichnet die moralische Umkehr. Das Possessivpronomen steht im Deutschen passend zum kollektiven Singular „Volk“, während „Wegen“ den hebräischen Plural und die Lebensführung als Bild wahrt.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: dann werde ich vom Himmel her hören
  rationale: „Dann“ kennzeichnet im Deutschen den Folgesatz der Bedingung. „Vom Himmel her“ gibt מן הַשָּׁמַיִם als Ausgangsbereich des göttlichen Hörens wieder.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: ihre Sünde vergeben
  rationale: Der hebräische Singular חטאת wird bewahrt und kollektiv als die Schuld des Volkes verstanden. Beim Rückbezug auf den Kollektivbegriff „Volk“ ist der Plural im heutigen Deutsch natürlicher als „seine Sünde“.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: ihr Land heilen
  rationale: „Heilen“ bewahrt die Metapher von רפא und Gottes wiederherstellendem Handeln am Land.
theological_decisions:
- issue: Bedingungs- und Folgesatz
  choice: Die vorausgehenden Handlungen des Volkes werden mit „wenn“ als Bedingung gefasst; Gottes Antwort beginnt mit „dann“.
  alternative: Alle Sätze lediglich mit „und“ koordinieren.
  rationale: Obwohl das Hebräische die Glieder durch Konjunktionen verbindet, zeigt der Zusammenhang eine Bedingungs-Folge-Struktur. „Wenn … dann“ macht diese im Deutschen verständlich, ohne den theologischen Gehalt zu erweitern.
- issue: Idiom vom über dem Volk ausgerufenen Namen
  choice: „über dem mein Name ausgerufen ist“ mit erläuternder Fußnote
  alternative: „das nach meinem Namen genannt ist“ oder „das meinen Namen trägt“
  rationale: Die gewählte Form bewahrt die Bildgestalt und die grammatische Passivform des Hebräischen. Die Fußnote erläutert, dass das Idiom Zugehörigkeit und Kennzeichnung durch Gottes Namen ausdrückt, ohne eine einzige Deutung in den Haupttext einzutragen.
- issue: Wechsel zwischen kollektivem Singular und pluralischem Rückbezug
  choice: „mein Volk … sich … seinen“, danach „ihre Sünde … ihr Land“
  alternative: 'Durchgehend singularischer Rückbezug: „seine Sünde … sein Land“'
  rationale: Das Hebräische hat „Volk“ im Singular, verbindet damit jedoch Verben und Suffixe im Plural. Der deutsche Text wahrt den kollektiven Singular, lässt beim gemeinschaftlichen Handeln aber den im Hebräischen angelegten Plural anklingen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur ist flüssig, bleibt aber eng am hebräischen Bedingungsgefüge. „Angesicht“ und „heilen“ bewahren die zentralen Bilder des Ausgangstextes; die Namensformel wird bewusst quellennah formuliert und erläutert.
