  text: וַ/יִּזְבַּ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹה֮ אֶת זֶ֣בַח הַ/בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית הָֽ/אֱלֹהִ֔ים הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: de
  text: Und König Salomo opferte zweiundzwanzigtausend Rinder und hundertzwanzigtausend Schafe[a], und der König und das ganze Volk weihten das Haus Gottes ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kleinvieh“; das hebräische Wort kann Schafe und Ziegen gemeinsam bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: opferte
  rationale: Das Verb זבח bezeichnet in diesem kultischen Zusammenhang das Schlachten beziehungsweise Darbringen als Opfer. „opferte“ ist knapp, natürlich und bewahrt den kultischen Sinn.
- source_word: זֶבַח הַבָּקָר
  choice: Rinder
  rationale: Die Wendung bezeichnet ein Opfer aus Großvieh. „Rinder“ ist im modernen Deutschen ein klarer Sammelbegriff und passt zur großen Zahlenangabe.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: zweiundzwanzigtausend
  rationale: Reguläre moderne Wiedergabe der hebräischen Zahl.
- source_word: וְצֹאן
  choice: Schafe
  rationale: צֹאן bezeichnet Kleinvieh und kann Schafe und Ziegen gemeinsam umfassen. „Schafe“ ist im fortlaufenden deutschen Text geläufig; die weitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: hundertzwanzigtausend
  rationale: Reguläre moderne Wiedergabe der hebräischen Zahl.
- source_word: וַיַּחְנְכוּ
  choice: weihten … ein
  rationale: חנך bezeichnet hier die feierliche Einweihung beziehungsweise Inbetriebnahme des Tempels. „weihten … ein“ ist präzise und im Deutschen idiomatisch.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die wörtliche Wendung „Haus Gottes“ bleibt verständlich und bildet die Ausdrucksweise des Hebräischen genauer ab als das deutende „Tempel Gottes“.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: der König und das ganze Volk
  rationale: Nach der Nennung Salomos nimmt der hebräische Text ihn erneut mit seinem Titel auf. Diese Diskursstruktur wird beibehalten.
theological_decisions: []
