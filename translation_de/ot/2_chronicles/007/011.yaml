base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: de
  text: Und Salomo vollendete das Haus Jahwes und das Haus des Königs[a]. Alles, was Salomo sich im Herzen vorgenommen hatte[b], im Haus Jahwes und in seinem eigenen Haus zu tun, führte er erfolgreich aus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Königspalast“. Wörtlich: „das Haus des Königs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „alles, was auf Salomos Herz kam“; gemeint ist alles, was er beabsichtigte oder zu tun wünschte.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „damit hatte er Erfolg“ beziehungsweise „es gelang ihm“. Das hebräische Verb kann sowohl Erfolg haben als auch etwas zum Erfolg führen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: vollendete
  rationale: Das Verb כלה bezeichnet hier im narrativen Zusammenhang das Zu-Ende-Bringen der beiden Bauwerke. „Vollendete“ ist präzise und stilistisch würdig.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die Wiedergabe mit „Haus“ bewahrt das hebräische בֵּית und dessen Wiederholung im Vers; „Tempel“ wäre eine mögliche, aber stärker deutende Übersetzung. Der Gottesname יְהוָה wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Haus des Königs
  rationale: Diese formnahe Wiedergabe erhält die bewusste Wiederholung von „Haus“. Gemeint ist wahrscheinlich der Königspalast beziehungsweise die Palastanlage.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: alles, was Salomo sich im Herzen vorgenommen hatte
  rationale: Die Formulierung gibt die hebräische Herz-Metaphorik verständlich wieder und bringt zugleich den idiomatischen Sinn einer Absicht oder eines Vorhabens zum Ausdruck.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: „Tun“ entspricht dem breiten Bedeutungsumfang von עשה und passt zu den beabsichtigten Arbeiten und Vorhaben.
- source_word: וּבְבֵיתוֹ
  choice: in seinem eigenen Haus
  rationale: „Eigenen“ verdeutlicht, dass sich das Suffix auf Salomo bezieht, und unterscheidet sein Haus sprachlich vom Haus Jahwes.
- source_word: הִצְלִיחַ
  choice: führte er erfolgreich aus
  rationale: Der Hifil von צלח kann ausdrücken, dass jemand Erfolg hat oder etwas zum Erfolg führt. Im Zusammenhang mit Salomos Bauvorhaben bezeichnet die Form deren erfolgreiche Verwirklichung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen; die im Deutschen übliche Form wird gegenüber der englischen Schreibweise „Yahweh“ verwendet.
- issue: Reichweite von הִצְלִיחַ
  choice: er führte alles erfolgreich aus
  alternative: es gelang ihm; er hatte Erfolg
  rationale: Der Kontext legt die erfolgreiche Durchführung der genannten Vorhaben nahe. Da die Verbform sowohl intransitiven Erfolg als auch das Zum-Erfolg-Führen bezeichnen kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Haus“ und die Herz-Metaphorik des Hebräischen bleiben erhalten, werden jedoch in eine natürliche deutsche Satzführung gebracht. Die mögliche Bedeutungsbreite des Schlussverbs wird nicht dogmatisch verengt, sondern in der Fußnote ausgewiesen.
