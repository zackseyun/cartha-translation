  yaml_path: translation/ot/2_chronicles/007/004.yaml
  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: de
  text: Dann brachten der König und das ganze Volk vor Jahwe Opfer dar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „opferten ein Opfer“; im Hebräischen stehen ein Verb und ein stammverwandtes Substantiv zusammen.'
    reason: Die Fußnote macht die im Deutschen idiomatisch geglättete figura etymologica des hebräischen Textes sichtbar.
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Dann … der König
  rationale: Das וְ führt die Erzählung fort; „Dann“ gibt hier die zeitliche Abfolge im modernen Deutsch natürlich wieder. הַמֶּלֶךְ bedeutet „der König“.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet hier die versammelte Bevölkerung insgesamt; „das ganze Volk“ ist direkt und kontextgerecht.
- source_word: זֹבְחִים זֶבַח
  choice: brachten … Opfer dar
  rationale: Die hebräische Verbindung aus Verb und stammverwandtem Substantiv bedeutet idiomatisch, Opfer darzubringen. Das Partizip beschreibt die damalige Handlung; im deutschen Erzählstil ist das Präteritum natürlich, ohne den Vorgang als punktuell festzulegen.
- source_word: לִפְנֵי
  choice: vor
  rationale: „Vor“ bewahrt knapp den Sinn einer Handlung in Jahwes Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Opfer darbringen“ ist verständlich und dem kultischen Zusammenhang angemessen; die ungewöhnliche hebräische Wortwiederholung wird in der Fußnote dokumentiert.
