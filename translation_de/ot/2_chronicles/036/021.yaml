base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: de
  text: Dies geschah, um das Wort Jahwes zu erfüllen, das durch den Mund Jeremias[a] ergangen war, bis das Land seine Sabbate genossen hatte[b]. Während der ganzen Zeit seiner Verwüstung hielt es Sabbat[c][d], bis siebzig Jahre erfüllt waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch den Mund Jeremias“. Sinngemäß: „durch Jeremia“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „seine Sabbate nachgeholt“ oder „seine Sabbate erhalten hatte“. Gemeint ist, dass das Land die ihm vorenthaltene Sabbatruhe bekam.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „ruhte es“. Im Hebräischen stehen „seine Sabbate“ und „hielt Sabbat“ als bewusstes Wortspiel nebeneinander.'
    reason: lexical_alternative
  - marker: d
    text: Die Formulierung greift die Bundeswarnung auf, nach der das Land während des Exils seine Sabbate genießen würde; siehe 3. Mose 26,34–35.
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: So erfüllte sich
  rationale: Der Infinitiv mit ל bezeichnet hier Zweck bzw. Ergebnis des vorausgehenden Exils. Die finite deutsche Form bindet den Vers natürlich an den vorherigen Zusammenhang an und bewahrt den Erfüllungsgedanken.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ erhält den Bezug auf die prophetische Ankündigung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: das durch den Mund Jeremias ergangen war
  rationale: Die Wendung bewahrt das hebräische Bild vom Mund des Propheten und macht zugleich im Deutschen deutlich, dass Jahwes Wort durch Jeremia verkündet wurde.
- source_word: עַד רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  choice: bis das Land seine Sabbate genossen hatte
  rationale: רצה bezeichnet hier, dass das Land die ihm vorenthaltene Sabbatruhe erhielt. „Genossen hatte“ ist idiomatisch und bewahrt die Anspielung auf Levitikus 26,34–35.
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Während der ganzen Zeit seiner Verwüstung
  rationale: Die zeitliche Gesamtdauer der Verwüstung wird in natürlichem Deutsch ausgedrückt; „seiner“ bezieht sich auf das Land.
- source_word: שָׁבָתָה
  choice: hielt es Sabbat
  rationale: Diese Wiedergabe erhält das Wortspiel und den sachlichen Zusammenhang zwischen שַׁבְּתוֹתֶיהָ („seine Sabbate“) und שָׁבָתָה („hielt Sabbat“).
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: bis siebzig Jahre erfüllt waren
  rationale: Die Formulierung gibt die Vollendung des angekündigten Zeitraums idiomatisch wieder und lässt den wiederholten Erfüllungsgedanken erkennen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Sabbattheologie in שַׁבְּתוֹתֶיהָ und שָׁבָתָה
  choice: seine Sabbate … hielt es Sabbat
  alternative: seine Ruhezeiten … ruhte es
  rationale: Die gewählte Form bewahrt die ausdrückliche lexikalische Verbindung und damit den im Text angelegten Bezug auf die Bundeswarnung über die Sabbatruhe des Landes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Bildsprache „durch den Mund Jeremias“ und das hebräische Sabbat-Wortspiel bleiben erhalten; Fußnoten erläutern idiomatische Alternativen und den intertextuellen Bezug.
