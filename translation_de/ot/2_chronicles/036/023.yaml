  to: 'So spricht Kyrus, der König von Persien: Jahwe[a], der Gott des Himmels, hat mir alle Königreiche der Erde gegeben. Er hat mich beauftragt, ihm in Jerusalem, das in Juda liegt, ein Haus zu bauen. Wer von euch auch immer zu seinem Volk gehört – Jahwe, sein Gott, sei mit ihm[b] –, der ziehe hinauf[c].'
