source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: de
  text: 'So spricht Kyrus, der König von Persien: Jahwe[a], der Gott des Himmels, hat mir alle Königreiche der Erde gegeben. Er hat mich beauftragt, ihm in Jerusalem, das in Juda liegt, ein Haus zu bauen. Wer von euch auch immer zu seinem Volk gehört – Jahwe, sein Gott, sei mit ihm[b] –, der ziehe hinauf[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jahwe ist der Eigenname des Gottes Israels; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: divine_name
  - marker: b
    text: 'Oder als Aussage: „Jahwe, sein Gott, ist mit ihm.“ Die hebräische Form lässt beides zu; im Zusammenhang liegt ein Segenswunsch näher.'
    reason: alternative_reading
  - marker: c
    text: 'Gemeint ist: Er soll nach Jerusalem hinaufziehen. „Hinaufziehen“ ist die herkömmliche biblische Ausdrucksweise für den Weg zur heiligen Stadt.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Boten- und Verkündigungsformel gibt das hebräische Perfekt in der Proklamation idiomatisch präsentisch wieder.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Kyrus, der König von Persien
  rationale: „Kyrus“ ist die etablierte deutsche Namensform; der Königstitel wird als Apposition wiedergegeben.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: אֶרֶץ hat hier den weiten geopolitischen Sinn; „Erde“ bleibt näher am Hebräischen als das stärker deutende „Welt“.
- source_word: נָתַן לִי
  choice: hat mir … gegeben
  rationale: Das deutsche Perfekt bezeichnet eine vergangene Gabe mit gegenwärtigem Ergebnis.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: der Gott des Himmels
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung.
- source_word: וְהוּא פָקַד עָלַי
  choice: Er hat mich beauftragt
  rationale: פָקַד bezeichnet hier die autoritative Übertragung einer Aufgabe; „beauftragt“ ist klar und nicht überbestimmt.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ihm … ein Haus zu bauen
  rationale: „Haus“ bewahrt den Wortlaut und die theologische Bildsprache des Hebräischen; im Zusammenhang ist der Tempel gemeint.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: in Jerusalem, das in Juda liegt
  rationale: Die im Hebräischen ausdrückliche Relativkonstruktion bleibt erhalten und klingt zugleich natürlich.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Wer von euch zu seinem ganzen Volk gehört
  rationale: Die komprimierte partitive Wendung wird verständlich als Zugehörigkeit zu Jahwes Volk ausgedrückt, ohne den Umfang „ganzes Volk“ zu unterschlagen.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: Jahwe, sein Gott, sei mit ihm
  rationale: Im Schlussaufruf liegt ein Segenswunsch nahe; der deutsche Konjunktiv bewahrt knapp dessen volitiven Charakter.
- source_word: וְיָעַל
  choice: und er ziehe hinauf
  rationale: Der Konjunktiv gibt die auffordernde beziehungsweise jussivische Kraft wieder; „hinaufziehen“ bewahrt die biblische Rede vom Aufstieg nach Jerusalem.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ macht den Eigennamen sichtbar, während „der HERR“ ihn durch die traditionelle Ersatzlesung wiedergibt.
- issue: Wiedergabe von בַיִת
  choice: Haus
  alternative: Tempel
  rationale: Sachlich ist der Tempel gemeint, doch der Ausgangstext sagt „Haus“. Die gewählte Fassung erhält diese Bildsprache, ohne den Bezug zu verdunkeln.
- issue: Modalität von יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'Segenswunsch: „Jahwe, sein Gott, sei mit ihm“'
  alternative: 'Aussage: „Jahwe, sein Gott, ist mit ihm“'
  rationale: Der Zusammenhang eines königlichen Aufrufs begünstigt die benediktive Lesart; da die nominale hebräische Form auch indikativisch verstanden werden kann, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königliche Proklamationsformel bleibt feierlich, doch Satzbau und Wortwahl sind für heutige Leser unmittelbar verständlich. Die beiden Konjunktive im Schlussaufruf erhalten den knappen proklamatorischen Ton.
