  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: de
  text: 'Und im ersten Jahr des Kyrus, des Königs von Persien, damit das Wort Jahwes durch den Mund Jeremias[a] erfüllt würde, erweckte Jahwe den Geist des Kyrus, des Königs von Persien. Er ließ in seinem ganzen Königreich eine Bekanntmachung ergehen, auch schriftlich, mit folgendem Wortlaut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch Jeremia; wörtlich: »durch den Mund Jeremias«.'
    reason: Erläutert die hebräische Vermittlungsformel und nennt eine idiomatischere Übersetzungsmöglichkeit.
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: Und im ersten Jahr
  rationale: Die Zeitangabe eröffnet den abschließenden Erzählabschnitt; „Und“ gibt das vorangestellte Waw wieder, ohne ein im Hebräischen nicht vorhandenes „nun“ einzuführen.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: des Kyrus, des Königs von Persien
  rationale: Die deutsche Apposition macht die königliche Titulatur klar und bewahrt die Datierungsformel.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: damit das Wort Jahwes … erfüllt würde
  rationale: Bei einem prophetischen Wort bezeichnet כלה hier dessen vollständige Verwirklichung; die Zwecksatzkonstruktion bewahrt die Funktion des Infinitivs.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: durch den Mund Jeremias
  rationale: Die wörtlich geprägte Formulierung bewahrt das Bild Jeremias als Sprecher und Vermittler des göttlichen Wortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: erweckte Jahwe den Geist des Kyrus
  rationale: „Erweckte“ gibt das Aufrütteln oder In-Bewegung-Setzen wieder; „Geist“ bewahrt die Offenheit von רוּחַ zwischen innerer Haltung und Antrieb.
- source_word: וַיַּעֲבֶר קוֹל
  choice: Darauf ließ er … einen Aufruf ergehen
  rationale: Die hebräische Wendung bezeichnet das öffentliche Verbreiten einer Bekanntmachung; „einen Aufruf ergehen lassen“ ist im Deutschen natürlich und sachlich passend.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: in seinem ganzen Königreich
  rationale: Die Formulierung gibt die reichsweite Ausdehnung der Bekanntmachung wieder.
- source_word: וְגַם בְּמִכְתָּב
  choice: und zwar auch schriftlich
  rationale: Die Wendung hebt hervor, dass die Bekanntmachung zusätzlich schriftlich verbreitet wurde.
- source_word: לֵאמֹר
  choice: 'Er lautete:'
  rationale: Da der Wortlaut des Erlasses im folgenden Vers beginnt, führt diese idiomatische deutsche Formel die direkte Rede klar ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt den Charakter eines Eigennamens und vermeidet die Ersetzung durch einen Herrschaftstitel.
- issue: Bedeutung von רוּחַ bei Kyrus
  choice: Geist
  alternative: Sinn / Entschlusskraft
  rationale: „Geist“ lässt die im Hebräischen vorhandene Mehrdeutigkeit zwischen innerer Haltung, Antrieb und geistiger Dimension bestehen, ohne sie psychologisch oder dogmatisch zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit behutsam gegliedert; der Doppelpunkt hält den Übergang zum Erlass in Vers 23 offen. Der Genitiv „Jeremias“ ist in dieser festen biblischen Namensverbindung verständlich und vermeidet eine schwerfällige Umschreibung.
