  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: de
  text: Und alle Geräte des Hauses Gottes, die großen und die kleinen, dazu die Schätze[a] des Hauses Jahwes und die Schätze des Königs und seiner Obersten[b] — alles brachte er nach Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Schatzkammern“ oder „Vorratshäuser“ bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seiner Fürsten“ beziehungsweise „seiner führenden Beamten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי בֵּית הָאֱלֹהִים
  choice: Und alle Geräte des Hauses Gottes
  rationale: „Geräte“ gibt כְּלֵי in diesem Zusammenhang als Sammelbezeichnung für die verschiedenen Tempelgegenstände wieder; „Haus Gottes“ bewahrt die hebräische Ausdrucksweise.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: die großen und die kleinen
  rationale: Die substantivierten Adjektive beziehen sich auf die Geräte und bewahren die umfassende Paarformel des Hebräischen.
- source_word: וְאֹצְרוֹת בֵּית יְהוָה
  choice: dazu die Schätze des Hauses Jahwes
  rationale: Da das Genannte nach Babylon gebracht wird, sind mit אֹצְרוֹת hier wahrscheinlich die gelagerten Kostbarkeiten gemeint, nicht die Schatzkammern selbst. „Dazu“ verbindet die deutsche Aufzählung natürlich.
- source_word: וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו
  choice: und die Schätze des Königs und seiner Obersten
  rationale: „Oberste“ hält die soziale und amtliche Bedeutung von שָׂרִים bewusst weit und vermeidet die engere Festlegung auf erbliche Prinzen.
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: alles brachte er nach Babylon
  rationale: „Alles“ nimmt die gesamte Aufzählung zusammenfassend wieder auf. Das im Hebräischen nicht ausdrücklich genannte Subjekt bleibt auch im Deutschen als „er“ kontextabhängig; „Babylon“ ist die heutige geläufige Ortsbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Implizites Subjekt von הֵבִיא
  choice: er
  alternative: Nebukadnezar
  rationale: Der Vers nennt den Handelnden nicht erneut. Die bloße Pronomenform bewahrt diesen Textbefund, statt den Namen aus dem Kontext in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater Nähe zur hebräischen Satzstruktur. Die Wiederholungen der Aufzählung bleiben erhalten; der Gedankenstrich macht die zusammenfassende Schlussaussage gut erfassbar.
