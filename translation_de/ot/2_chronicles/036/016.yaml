id: 2CH.36.16
reference: 2 Chronicles 36:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: de
  text: Doch sie verspotteten immer wieder die Boten Gottes[a], verachteten seine Worte und verhöhnten seine Propheten, bis der Zorn Jahwes gegen sein Volk aufstieg und es keine Heilung mehr gab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Engel Gottes«. Hier spricht der Zusammenhang deutlich für menschliche Boten, denn anschließend werden Gottes Propheten genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und es kein Heilmittel mehr gab« beziehungsweise »bis nichts mehr zu heilen war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: sie … immer wieder
  rationale: Das finite Verb mit den folgenden Partizipien beschreibt fortgesetztes beziehungsweise wiederholtes Handeln in der Vergangenheit.
- source_word: מַלְעִבִים
  choice: verspotteten
  rationale: Die Wiedergabe bezeichnet verächtlichen Spott und ist in modernem Standarddeutsch natürlich.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: die Boten Gottes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; die Parallelstelle innerhalb des Satzes mit »seine Propheten« spricht hier stark für menschliche Gesandte Gottes.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: verachteten seine Worte
  rationale: בזה drückt geringschätzige Ablehnung aus; der Plural דְּבָרָיו wird unmittelbar als »seine Worte« bewahrt.
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: verhöhnten seine Propheten
  rationale: »Verhöhnten« wahrt die Bedeutung spöttischer Herabsetzung und vermeidet eine monotone Wiederholung von »verspotteten«.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: bis der Zorn Jahwes … aufstieg
  rationale: Die Konstruktion mit עַד und Infinitiv bezeichnet den erreichten Kulminationspunkt; »aufstieg« bildet das hebräische Bild ab, ohne es auszudeuten.
- source_word: בְּעַמּוֹ
  choice: gegen sein Volk
  rationale: Bei einem Ausdruck des Zorns bezeichnet ב hier dessen Ziel beziehungsweise Gegenstand.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: und es keine Heilung mehr gab
  rationale: מַרְפֵּא bezeichnet wörtlich Heilung, kann aber auch Abhilfe oder Heilmittel meinen. Die gewählte Form bewahrt das Bild und drückt die Endgültigkeit idiomatisch aus.
theological_decisions:
- issue: Bezug von »Boten Gottes«
  choice: menschliche prophetische Boten
  alternative: Engel Gottes
  rationale: Die unmittelbare Parallele »seine Propheten« legt menschliche Beauftragte Gottes nahe. Die lexikalische Alternative bleibt in einer Fußnote sichtbar.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im Ausgangstext ausdrücklich stehende Gottesname erkennbar bleibt.
- issue: Bildhaftigkeit von מַרְפֵּא
  choice: Heilung
  alternative: Abhilfe / Heilmittel
  rationale: »Heilung« bewahrt die Metapher des hebräischen Textes; gemeint ist, dass der Zustand nicht mehr zu beheben beziehungsweise zu heilen war.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Folge »verspotteten – verachteten – verhöhnten« erhält die rhetorische Steigerung. »Immer wieder« macht den fortgesetzten Charakter der Partizipialkonstruktion deutlich. Der zweite Fußnotenmarker steht nach dem gesamten Schlusssatz, auf den sich die Variante bezieht.
