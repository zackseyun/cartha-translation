  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: de
  text: Joahas war dreiundzwanzig Jahre alt, als er König wurde, und er regierte drei Monate in Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שָׁלֹושׁ וְעֶשְׂרִים שָׁנָה
  choice: war dreiundzwanzig Jahre alt
  rationale: Die wörtliche hebräische Wendung „ein Sohn von dreiundzwanzig Jahren“ ist eine feste Altersangabe. Die gewählte Form gibt sie in natürlichem modernem Deutsch genau wieder.
- source_word: יוֹאָחָז
  choice: Joahas
  rationale: „Joahas“ ist die im Deutschen etablierte biblische Namensform.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition mit der Infinitivkonstruktion bezeichnet hier den Zeitpunkt seines Regierungsantritts. Die Formulierung ist klar und entspricht dem Sinn der hebräischen Königsformel.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: und … drei Monate
  rationale: Die Konjunktion wird in der deutschen Satzverbindung beibehalten; Zahlwort und Substantiv werden direkt wiedergegeben.
- source_word: מָלַךְ
  choice: er regierte
  rationale: In einer Königsnotiz bezeichnet das Verb die Dauer der Herrschaft; „regierte“ ist dafür die natürliche und präzise deutsche Entsprechung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition bezeichnet den Ort und wird direkt mit „in“ wiedergegeben.
