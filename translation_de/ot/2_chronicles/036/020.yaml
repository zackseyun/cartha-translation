  text: וַ/יֶּ֛גֶל הַ/שְּׁאֵרִ֥ית מִן הַ/חֶ֖רֶב אֶל בָּבֶ֑ל וַֽ/יִּהְיוּ ל֤/וֹ וּ/לְ/בָנָי/ו֙ לַ/עֲבָדִ֔ים עַד מְלֹ֖ךְ מַלְכ֥וּת פָּרָֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: de
  text: Den Rest, der dem Schwert entkommen war, verschleppte er nach Babylon. Sie wurden ihm und seinen Söhnen zu Sklaven[a], bis das Perserreich die Herrschaft übernahm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienern«. Das hebräische Wort kann sowohl Diener als auch Sklaven bezeichnen; im Zusammenhang von Eroberung und Verschleppung liegt hier »Sklaven« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: verschleppte er
  rationale: Die Hifil-Form von גלה bezeichnet hier die erzwungene Wegführung ins Exil. „Verschleppte“ gibt den gewaltsamen Vorgang im Deutschen knapp und natürlich wieder; das Subjekt ergibt sich aus dem vorhergehenden Vers.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: den Rest, der dem Schwert entkommen war
  rationale: הַשְּׁאֵרִית bezeichnet den übrig gebliebenen Rest. Die Wendung מִן הַחֶרֶב wird idiomatisch als Entkommen vor dem Schwert, also als Überleben des Krieges, wiedergegeben.
- source_word: אֶל בָּבֶל
  choice: nach Babylon
  rationale: Natürliche deutsche Wiedergabe der Richtungsangabe.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: Sie wurden ihm und seinen Söhnen zu Sklaven
  rationale: עֲבָדִים kann Diener oder Sklaven bezeichnen. Im Zusammenhang von Eroberung, Deportation und erzwungener Unterordnung hebt „Sklaven“ den unfreiwilligen Status angemessen hervor.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: bis das Königreich Persien zur Herrschaft kam
  rationale: מְלֹךְ bezeichnet hier den Beginn beziehungsweise das Eintreten der Herrschaft. Die Formulierung gibt den zeitlichen Endpunkt idiomatisch wieder und bewahrt „Königreich Persien“ als Subjekt.
theological_decisions:
- issue: Bezeichnung des unfreien Status der deportierten Überlebenden
  choice: Sklaven
  alternative: Diener
  rationale: Das hebräische עבד umfasst beide Bedeutungen. Der Eroberungs- und Exilkontext spricht für einen erzwungenen, unfreien Status; die alternative lexikalische Möglichkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verschleppte“ macht den Zwang der Exilierung deutlich; die Satzteilung verbessert die Verständlichkeit, ohne die inhaltliche Verbindung aufzulösen.
