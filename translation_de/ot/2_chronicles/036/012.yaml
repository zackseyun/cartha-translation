source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes, seines Gottes, böse war, und demütigte sich nicht vor dem Propheten Jeremia, der aus dem Mund Jahwes sprach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die feste hebräische Wendung bezeichnet ein Tun, das als böse beurteilt wird. Die gewählte Formulierung gibt sie in natürlichem Deutsch wieder.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die bildhafte hebräische Bewertungsformel bleibt im Deutschen verständlich und nah am Ausgangstext.
- source_word: יְהוָה אֱלֹהָיו
  choice: Jahwes, seines Gottes
  rationale: Der Gottesname wird als Jahwe wiedergegeben; das Possessivsuffix in אֱלֹהָיו wird ausdrücklich bewahrt.
- source_word: לֹא נִכְנַע
  choice: demütigte sich nicht
  rationale: Der Niphal wird hier passend reflexiv beziehungsweise medial verstanden und bezeichnet Zedekias verweigerte Demut oder Unterordnung.
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: vor dem Propheten Jeremia
  rationale: Die knappe Formulierung bewahrt sowohl die relationale Präposition als auch Jeremias ausdrücklich genannten prophetischen Auftrag.
- source_word: מִפִּי יְהוָה
  choice: der im Auftrag Jahwes sprach
  rationale: Wörtlich steht „aus dem Mund Jahwes“. Die Haupttextfassung vermittelt die gemeinte göttliche Beauftragung in natürlichem Deutsch; die konkrete Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Art der prophetischen Vermittlung in מִפִּי יְהוָה
  choice: der im Auftrag Jahwes sprach
  alternative: der aus dem Mund Jahwes sprach
  rationale: Die Übersetzung bezeichnet Jeremia klar als von Jahwe autorisierten Sprecher, ohne die ungewöhnliche hebräische Körpermetapher im Haupttext zu glätten, ohne sie zugleich zu verschweigen; sie erscheint in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bewertungsformel „in den Augen“ bleibt erhalten; die sperrige wörtliche Wiedergabe der prophetischen Formel wird in einer Fußnote geboten.
