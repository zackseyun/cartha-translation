source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: de
  text: Da ließ der HERR den König der Chaldäer[a] gegen sie heraufziehen. Dieser tötete ihre jungen Männer mit dem Schwert im Haus ihres Heiligtums und hatte kein Mitleid[b] mit jungem Mann oder Jungfrau[c], mit Altem oder Hochbetagtem. Der HERR gab alles in seine Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den König der Babylonier“; wörtlich: „der Chaldäer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verschonte nicht“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bezeichnet eine Jungfrau, insbesondere eine junge unverheiratete Frau.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: ließ … gegen sie heraufziehen
  rationale: Der Hifil von עלה mit עַל bezeichnet hier das Heranführen eines feindlichen Heeres. Die Formulierung bewahrt den kausativen und militärischen Sinn.
- source_word: מֶלֶךְ כַּשְׂדִּיים
  choice: König der Chaldäer
  rationale: „Chaldäer“ entspricht unmittelbar der hebräischen Volksbezeichnung; „Babylonier“ ist eine verständliche sachliche Alternative.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: im Haus ihres Heiligtums
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Wortfügung und hebt hervor, dass das Töten am geheiligten Ort geschah.
- source_word: וְלֹא חָמַל
  choice: hatte kein Mitleid
  rationale: חמל bezeichnet das Verschonen aus Mitleid. Die gewählte Formulierung gibt die emotionale und moralische Aussage wieder; „verschonte nicht“ bleibt als Alternative möglich.
- source_word: בָּחוּר וּבְתוּלָה
  choice: jungen Männern oder Jungfrauen
  rationale: Die beiden Wörter bezeichnen einen jungen Mann und eine בתולה, das heißt konkret eine junge unverheiratete Frau beziehungsweise Jungfrau.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: Alten oder Hochbetagten
  rationale: Die zwei Altersbezeichnungen werden unterschieden wiedergegeben, sodass die rhetorische Steigerung des Hebräischen erhalten bleibt.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: gab sie alle in seine Hand
  rationale: Die Wendung bezeichnet die Übergabe in die Gewalt eines anderen. „In seine Hand“ bewahrt dabei das hebräische Bild.
theological_decisions:
- issue: Subjekt des ersten und des letzten Verbs
  choice: Der HERR
  alternative: Das im Deutschen nicht näher bestimmte Pronomen „er“
  rationale: Die maskulinen Singularformen führen das Subjekt aus dem vorausgehenden Zusammenhang fort, nämlich den HERRN. Die ausdrückliche Nennung verhindert im Deutschen, dass der König der Chaldäer irrtümlich als Subjekt des letzten Satzes verstanden wird.
- issue: Handelnder beim Töten
  choice: der König der Chaldäer
  alternative: Der HERR als unmittelbares Subjekt aller Verben
  rationale: Der Satzfluss stellt den heraufgeführten König als denjenigen dar, der die jungen Männer tötet, während der HERR ihn heraufführt und alle in seine Hand gibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache und die feierliche Aufzählung der Alters- und Geschlechtsgruppen bleiben erhalten. Die Wiederholung „Der HERR“ dient der eindeutigen Zuordnung des letzten Verbs.
