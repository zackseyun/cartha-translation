revisions:
- from: So ließ der HERR den König der Chaldäer[a] gegen sie heraufziehen. Dieser tötete ihre jungen Männer mit dem Schwert im Haus ihres Heiligtums und hatte kein Mitleid[b] mit jungen Männern oder Jungfrauen[c], mit Alten oder Hochbetagten. Der HERR gab sie alle in seine Hand.
  to: Da ließ der HERR den König der Chaldäer[a] gegen sie heraufziehen. Dieser tötete ihre jungen Männer mit dem Schwert im Haus ihres Heiligtums und hatte kein Mitleid[b] mit jungem Mann oder Jungfrau[c], mit Altem oder Hochbetagtem. Der HERR gab alles in seine Hand.
  rationale: Die Revision glättet den deutschen Satzanschluss, bewahrt die generische Einzahl der hebräischen Aufzählung und lässt הַכֹּל mit „alles“ bewusst offen. Die explizite Wiederaufnahme „der HERR“ bleibt erhalten, weil sie den Wechsel zwischen dem Handeln Gottes und dem Handeln des chaldäischen Königs im Deutschen eindeutig macht.
