  naturalness: „So“ am Satzanfang wirkt hier als englischer Anschluss und ist im modernen Standarddeutsch weniger idiomatisch als „Da“. Die Aufzählung mit Pluralformen ist zwar verständlich, aber die generische Einzahl des Hebräischen lässt sich im Deutschen klar und natürlich bewahren.
  terminology: „Chaldäer“, „Haus ihres Heiligtums“, „Jungfrau“ und „Hochbetagte“ sind sachgerecht. Die Fußnote zu חמל sollte die Alternative enger am Verb als „verschonte nicht“ formulieren, statt das Objekt mit „niemanden“ zu verallgemeinern.
