id: 2CH.36.13
reference: 2 Chronicles 36:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: de
  text: Auch gegen König Nebukadnezar lehnte er sich auf, der ihn bei Gott hatte schwören lassen.[a] Er versteifte seinen Nacken[b] und verhärtete sein Herz, sodass er nicht zu Jahwe, dem Gott Israels, umkehrte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihn durch einen Schwur vor Gott gebunden hatte“. Das Hebräische kann sowohl das Schwörenlassen als auch den feierlichen, auf Gott bezogenen Charakter des Schwurs hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er machte seinen Nacken steif“ – ein hebräisches Bild für hartnäckigen Widerstand.'
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die additive Fortführung der Erzählung knapp und natürlich wieder.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: gegen König Nebukadnezar lehnte er sich auf
  rationale: Die Präposition ב bei מָרַד bezeichnet den Herrscher, gegen den sich die Auflehnung richtet; „sich auflehnen“ bewahrt den politischen Sinn in natürlichem Deutsch.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: der ihn bei Gott hatte schwören lassen
  rationale: Der Hifil von שׁבע bedeutet, jemanden schwören zu lassen. „Bei Gott“ gibt die instrumentale beziehungsweise sakrale Beziehung des Schwurs wieder, ohne die mögliche Nuance „vor Gott“ auszuschließen.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Er versteifte seinen Nacken
  rationale: Die körperliche Metapher für hartnäckigen Widerstand bleibt erhalten und ist im Deutschen verständlich; eine Fußnote erläutert das Bild.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: verhärtete sein Herz
  rationale: אָמֵץ kann „stärken/fest machen“ bedeuten; im Zusammenhang bezeichnet es eine innere Verhärtung, die die Umkehr verhindert.
- source_word: מִשּׁוּב אֶל
  choice: sodass er nicht … umkehrte
  rationale: Die Verbindung von מִן mit dem Infinitiv beschreibt hier das Abhalten beziehungsweise Fernbleiben von der Umkehr. Die resultative Formulierung ist im Deutschen natürlich und vermeidet eine übermäßig starre Kausalbestimmung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Entspricht der hebräischen Genitivverbindung und bewahrt die Identifikation Jahwes als Israels Gott.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text verwendet das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Herzensverhärtung und ausbleibender Umkehr
  choice: sodass er nicht … umkehrte
  alternative: davon, zu Jahwe umzukehren / um nicht zu Jahwe umzukehren
  rationale: Die hebräische Konstruktion mit מִן und Infinitiv kann Trennung, Verhinderung oder Folge ausdrücken. Die gewählte Fassung beschreibt das Ergebnis, ohne eine weitergehende Aussage über Ursache, Absicht oder göttliche Verursachung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber für heutige Leser geglättet. Die anschauliche Nackenmetapher bleibt im Haupttext erhalten; ihre Bedeutung wird in der Fußnote erläutert.
