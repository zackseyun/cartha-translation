id: 2CH.36.1
reference: 2 Chronicles 36:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: de
  text: Da nahm das Volk des Landes[a] Joahas, den Sohn Josias, und machte ihn in Jerusalem zum König anstelle seines Vaters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die einfache Bevölkerung“. Der hebräische Ausdruck „das Volk des Landes“ kann die Bevölkerung des Landes insgesamt und in manchen Zusammenhängen eine bestimmte gesellschaftliche Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahm
  rationale: לקח bedeutet hier am natürlichsten „nehmen“ im Sinn von auswählen bzw. heranziehen; „ergreifen“ würde eine nicht ausdrücklich genannte Gewaltanwendung nahelegen.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die relativ formale Wiedergabe bewahrt die mögliche Mehrdeutigkeit zwischen der Landesbevölkerung allgemein und einer bestimmten gesellschaftlichen Gruppe.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: den Sohn Josias
  rationale: Die Apposition gibt die Abstammungsangabe direkt und idiomatisch wieder.
- source_word: וַיַּמְלִיכֻהוּ
  choice: machte ihn … zum König
  rationale: Der Hifil von מלך bezeichnet das Einsetzen als König. Diese Formulierung wahrt den kausativen Sinn, ohne ein im Text nicht genanntes Krönungsritual hinzuzufügen.
- source_word: תַחַת אָבִיו
  choice: anstelle seines Vaters
  rationale: תחת bezeichnet hier Nachfolge beziehungsweise Ersatz, nicht räumliche Unterordnung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב mit dem Ortsnamen wird natürlich mit „in Jerusalem“ wiedergegeben.
