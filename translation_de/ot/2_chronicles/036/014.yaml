- from: Auch alle führenden Männer der Priester und das Volk häuften Untreue auf Untreue[a], ganz entsprechend den abscheulichen Bräuchen der Völker. Sie entweihten das Haus Jahwes[b], das er in Jerusalem geheiligt hatte.
  to: Auch alle Obersten der Priester und des Volkes häuften Untreue auf Untreue[a], ganz entsprechend den abscheulichen Bräuchen der Völker, und sie entweihten das Haus Jahwes[b], das er in Jerusalem geweiht hatte.
  rationale: Die Revision klärt die Reichweite von „Obersten“ gemäß der hebräischen Gruppenbezeichnung, verbessert die kultische Terminologie bei der Weihe des Hauses und ersetzt die missverständliche Erklärung der intensivierenden hebräischen Wortverbindung. Die Aussage, Reihenfolge und der zurückhaltende Registercharakter des Entwurfs bleiben erhalten.
