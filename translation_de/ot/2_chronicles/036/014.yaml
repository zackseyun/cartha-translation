source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: de
  text: Auch alle Obersten der Priester und des Volkes häuften Untreue auf Untreue[a], ganz entsprechend den abscheulichen Bräuchen der Völker, und sie entweihten das Haus Jahwes[b], das er in Jerusalem geweiht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung wiederholt den Wortstamm und betont so die zunehmende Treulosigkeit.
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder; traditionell steht dafür „der HERR“.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Stellt die Verbindung zum vorausgehenden Zusammenhang her und bewahrt den weiterführenden, leicht verstärkenden Sinn.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: alle führenden Männer der Priester und das Volk
  rationale: שָׂרֵי bezeichnet die Leitenden beziehungsweise Vorsteher der Priester; die Formulierung vermeidet den im Deutschen anders konnotierten Ausdruck „Hohepriester“ und lässt „das Volk“ als zweite Gruppe erkennen.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: häuften Untreue auf Untreue
  rationale: Die Wendung verbindet das Hifil von רבה mit Infinitiv und stammverwandtem Substantiv von מעל. Die deutsche Formulierung gibt sowohl die Vermehrung als auch die intensive, wiederholte Treulosigkeit wieder, ohne sie auf einen rein juristischen Verstoß zu verengen.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: ganz entsprechend den abscheulichen Bräuchen der Völker
  rationale: כְּכֹל bezeichnet Übereinstimmung beziehungsweise Vergleich. „Abscheuliche Bräuche“ macht deutlich, dass תּוֹעֵבוֹת hier verwerfliche religiöse Praktiken meint, und klingt im modernen Deutsch natürlicher als das substantivische „Gräuel“.
- source_word: וַיְטַמְּאוּ
  choice: Sie entweihten
  rationale: Im Tempelkontext bezeichnet das Verb kultische und moralische Verunreinigung. „Entweihten“ gibt die Verletzung der Heiligkeit des Gotteshauses prägnant wieder.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Bezeichnung; der Zusammenhang macht klar, dass der Tempel gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Transkription.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: das er in Jerusalem geheiligt hatte
  rationale: Das Relativpronomen bezieht sich am natürlichsten auf das Haus. „Geheiligt“ bewahrt den Grundgedanken des Absonderns als heilig; das Plusquamperfekt stellt die vorherige Heiligung der späteren Entweihung gegenüber.
theological_decisions:
- issue: Wiedergabe des bundesbezogenen und kultischen Vergehens מָעַל
  choice: Untreue
  alternative: Treulosigkeit; Vergehen; Sakrileg
  rationale: „Untreue“ erfasst den Bruch der Loyalität gegenüber Gott und passt zugleich zum Tempelkontext, ohne die Bedeutung vorschnell auf eine juristische oder ausschließlich kultische Kategorie festzulegen.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Wiedergabe „Jahwe“ wahrt seinen Charakter als Eigenname; eine Fußnote nennt die traditionelle deutsche Ersetzung.
- issue: Bezugswort von אֲשֶׁר הִקְדִּישׁ
  choice: das Haus Jahwes
  alternative: Jerusalem als geheiligter Ort
  rationale: Genus, Satzbau und unmittelbarer Zusammenhang sprechen dafür, dass Gott sein Haus in Jerusalem geheiligt hat. Diese Lesart wird wiedergegeben, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweiteilige Satzführung verbessert die Verständlichkeit, ohne die Abfolge des Hebräischen zu verändern. „Untreue auf Untreue“ erhält die eindringliche Wiederholung des hebräischen Wortstamms; „abscheuliche Bräuche“ vermittelt die religiös-moralische Schwere in allgemein verständlicher Sprache.
