  terminology: »König wurde«, »regierte«, »Jahwe« und »seines Gottes« sind sachgerecht. Die Formulierung vermeidet sowohl eine unnötige dogmatische Zuspitzung als auch einen Ersatz des Gottesnamens durch einen Titel.
