  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: de
  text: Jojakim war fünfundzwanzig Jahre alt, als er König wurde, und regierte elf Jahre lang in Jerusalem. Er tat, was in den Augen Jahwes, seines Gottes, böse war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: war fünfundzwanzig Jahre alt
  rationale: Die übliche hebräische Altersangabe wird in natürlichem modernem Deutsch wiedergegeben, ohne das wörtliche, im Deutschen missverständliche »ein Sohn von fünfundzwanzig Jahren«.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition ב mit der entsprechenden Verbform bezeichnet hier den Zeitpunkt des Regierungsantritts; die Formulierung ist präzise und idiomatisch.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: und regierte elf Jahre lang
  rationale: מָלַךְ bedeutet »König sein, regieren«; »regierte« entspricht der üblichen deutschen Form von Königsnotizen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Ortsangabe wird direkt und eindeutig wiedergegeben.
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Diese Wiedergabe bewahrt sowohl den Handlungscharakter des Verbs als auch die moralische Wertung des substantivierten Ausdrucks הָרַע.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die transparente deutsche Entsprechung bewahrt das hebräische Bild und bezeichnet die Bewertung aus Jahwes Sicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Das maskuline Singularsuffix bezieht sich auf Jojakim. Der Genitiv fügt sich natürlich an »Jahwes« an und wahrt die persönliche Zuordnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. »Jahwe« bewahrt ihn als persönlichen Gottesnamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bezug von אֱלֹהָיו
  choice: Jahwes, seines Gottes
  alternative: Jahwes, seines eigenen Gottes
  rationale: Das Suffix bezeichnet Jahwe als Jojakims Gott und unterstreicht damit seine Verantwortlichkeit. Ein zusätzliches »eigenen« wäre im Hebräischen nicht ausdrücklich vorhanden und würde unnötig verstärken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Struktur der Königsnotiz bleibt erkennbar, während Alters- und Regierungsformeln idiomatisch formuliert sind. Die Wendung »in den Augen« bewahrt bewusst das verständliche hebräische Bild.
