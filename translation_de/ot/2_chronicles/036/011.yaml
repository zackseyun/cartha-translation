lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: war einundzwanzig Jahre alt
  rationale: Die hebräische Altersformel mit בֶּן und einer Zahl wird im modernen Deutschen idiomatisch mit »war … Jahre alt« wiedergegeben.
- source_word: צִדְקִיָּהוּ
  choice: Zidkija
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts; diese Formulierung ist klar und natürlich.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: elf Jahre
  rationale: Die Zahlenangabe bezeichnet die Dauer seiner Herrschaft.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet das Herrschen als König; »regierte« ist im heutigen Deutsch die natürliche knappe Entsprechung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ist lokativ und wird direkt mit »in« wiedergegeben.
