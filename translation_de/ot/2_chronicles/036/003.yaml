  naturalness: „Das Land mit einer Zahlung belegen“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch als „dem Land eine Abgabe auferlegen“. Die Revision verbessert die Satzfügung ohne Bedeutungsverschiebung.
