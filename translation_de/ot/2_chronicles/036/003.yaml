  text: וַ/יְסִירֵ֥/הוּ מֶֽלֶךְ מִצְרַ֖יִם בִּֽ/ירוּשָׁלִָ֑ם וַֽ/יַּעֲנֹשׁ֙ אֶת הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: de
  text: Und der König von Ägypten setzte ihn in Jerusalem ab und auferlegte dem Land eine Abgabe von hundert Talenten Silber und einem Talent Gold[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch allgemeiner bedeuten: »entfernte ihn« oder »führte ihn weg«.'
    reason: alternative_reading
  - marker: b
    text: Ein Talent war eine große antike Gewichtseinheit. Wegen regionaler und zeitlicher Unterschiede wird sie hier nicht in ein modernes Gewicht umgerechnet.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: setzte ihn … ab
  rationale: Das Hifil von סור bedeutet hier, jemanden zu entfernen. Im königlichen Zusammenhang gibt „absetzen“ die Entfernung aus dem Amt natürlich und präzise wieder; die Ortsangabe bleibt ausdrücklich mit Jerusalem verbunden.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe der Status-constructus-Verbindung, ohne den im Vers nicht genannten Eigennamen einzufügen.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Präposition ב bezeichnet hier den Ort; „in Jerusalem“ ist die naheliegende moderne Wiedergabe.
- source_word: וַיַּעֲנֹשׁ
  choice: belegte … mit einer Zahlung
  rationale: ענש bezeichnet hier das Auferlegen einer finanziellen Leistung oder Strafe. Die Formulierung wahrt den Zwangscharakter, ohne die Abgabe enger als „Tribut“ oder als gerichtliches „Bußgeld“ festzulegen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das Herrschaftsgebiet Juda; „das Land“ bewahrt die übliche Bedeutung von אֶרֶץ im historischen Kontext.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: hundert Talenten Silber
  rationale: Die antike Gewichtseinheit כִּכָּר wird als „Talent“ beibehalten, statt eine unsichere moderne Umrechnung in den Haupttext einzutragen.
- source_word: וְכִכַּר זָהָב
  choice: und einem Talent Gold
  rationale: Die ausdrücklich singularische Maßangabe wird parallel und genau wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Setzte … ab“ ist im politischen Zusammenhang idiomatisch; „belegte … mit einer Zahlung“ lässt offen, ob die finanzielle Forderung eher als Strafzahlung oder als Tribut einzuordnen ist. Alle Fußnotenmarker stehen im Haupttext.
