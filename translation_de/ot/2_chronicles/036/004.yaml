base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: de
  text: Der König von Ägypten setzte Eljakim, seinen Bruder Joahas, als König über Juda und Jerusalem ein und änderte seinen Namen in Jojakim. Necho nahm Joahas, seinen Bruder, und brachte ihn nach Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: setzte … als König … ein
  rationale: Der Hifil von מלך ist hier kausativ und bezeichnet die Einsetzung Eljakims zum König durch den ägyptischen König.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Die natürliche deutsche Wiedergabe der Status-constructus-Verbindung bezeichnet einen bestimmten Herrscher.
- source_word: אֶלְיָקִים אָחִיו
  choice: Eljakim, dessen Bruder
  rationale: Das Suffix verweist im Zusammenhang auf Joahas. „Dessen“ macht diesen Rückbezug deutlich, ohne Joahas entgegen der hebräischen Wortfolge vorzeitig zu nennen.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: über Juda und Jerusalem
  rationale: עַל bezeichnet hier das Herrschaftsgebiet; sowohl das Königreich als auch seine Hauptstadt bleiben ausdrücklich genannt.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ יְהוֹיָקִים
  choice: änderte seinen Namen in Jojakim
  rationale: Die Wendung bezeichnet eine Namensänderung; die Formulierung ist im Deutschen klar und bewahrt den ausdrücklich erwähnten Namen.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: Necho nahm dessen Bruder Joahas mit
  rationale: לקח wird schlicht mit „nahm … mit“ wiedergegeben. Das anknüpfende ו wird nicht kontrastiv verstärkt; „dessen“ bezieht den Bruder eindeutig auf Eljakim/Jojakim.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: und brachte ihn nach Ägypten
  rationale: Die Richtungsendung bezeichnet eine Bewegung nach Ägypten; „nach Ägypten“ ist die idiomatische deutsche Form.
- source_word: נְכוֹ
  choice: Necho
  rationale: „Necho“ ist die im Deutschen geläufige biblische Namensform und gibt den hebräischen Namen eindeutig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei hebräischen Sätze werden ohne ein zusätzlich eingeführtes adversatives „aber“ verbunden. Die Bezugskette der zweimaligen Formulierung „sein Bruder“ wird durch „dessen Bruder“ verständlich gehalten.
