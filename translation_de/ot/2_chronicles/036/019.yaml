  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: de
  text: Sie verbrannten das Haus Gottes[a], rissen die Mauer Jerusalems nieder, verbrannten alle ihre Paläste im Feuer und vernichteten alle ihre kostbaren Gegenstände[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tempel Gottes“. Wörtlich: „das Haus Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle ihre kostbaren Geräte“ beziehungsweise „alle ihre Schätze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Sie verbrannten
  rationale: Das Qal-Wayyiqtol von שׂרף bezeichnet das Verbrennen. Das deutsche Präteritum gibt die fortlaufende Erzählung natürlich wieder; das Subjekt „sie“ ist in der hebräischen Verbform enthalten.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die wörtliche Wendung wird bewahrt. Gemeint ist der Tempel, doch „Haus Gottes“ erhält die Bildsprache des Hebräischen.
- source_word: וַיְנַתְּצוּ
  choice: rissen … nieder
  rationale: נתץ bezeichnet das Niederreißen oder Abbrechen eines Bauwerks. Bei einer Stadtmauer ist „niederreißen“ präzise und idiomatisch.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: die Mauer Jerusalems
  rationale: Die hebräische Singularform wird als Bezeichnung der Stadtmauer beibehalten.
- source_word: אַרְמְנוֹתֶיהָ
  choice: alle ihre Paläste
  rationale: אַרְמוֹן kann einen Palast, eine Zitadelle oder ein befestigtes repräsentatives Gebäude bezeichnen. „Paläste“ ist hier die naheliegende Wiedergabe; das feminine „ihre“ bezieht sich im Deutschen auf Jerusalem.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: verbrannten … im Feuer
  rationale: Die ausdrückliche Nennung des Feuers im Hebräischen bleibt erhalten, ebenso die Wiederholung des Verbs „verbrennen“.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: ihre kostbaren Gegenstände
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße; מַחֲמַד bezeichnet Begehrtes oder Kostbares. „Kostbare Gegenstände“ wahrt diese Bedeutungsbreite, ohne die Dinge ausschließlich als Tempelgefäße festzulegen.
- source_word: לְהַשְׁחִית
  choice: vernichteten
  rationale: Der Infinitiv kann Zweck oder Ergebnis ausdrücken. Als koordiniertes finites Verb ergibt er im Deutschen eine klare Erzählfolge und bewahrt den Gedanken vollständiger Zerstörung.
theological_decisions:
- issue: Bezug der kostbaren Gegenstände
  choice: Die Formulierung bleibt allgemein und bezieht das Suffix grammatisch auf Jerusalem.
  alternative: „kostbare Tempelgeräte“
  rationale: Der hebräische Ausdruck nennt die Gegenstände nicht ausdrücklich Tempelgeräte. Eine engere kultische Deutung würde mehr festlegen, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Abfolge und die Wiederholung des Verbrennens folgen dem hebräischen Erzählstil; zugleich werden Genusbezüge und Satzbau idiomatisch deutsch gestaltet.
