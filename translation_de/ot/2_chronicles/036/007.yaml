review_pass:
  verdict: revise
  source_fidelity: 'Der hebräische Text wird im Wesentlichen treffend wiedergegeben: die partitive Wendung („einige von den Geräten“), die Ziel- und Ortsangaben sowie die Zuordnung von „seinem“ zu Nebukadnezar sind korrekt. „Stellte ... auf“ ist jedoch enger als וַיִּתְּנֵם („legte/stellte/platzierte“) und kann eine nicht ausgedrückte Aufstellung suggerieren. Zudem ist die Fußnote syntaktisch falsch an „Babel“ statt an „seinem Tempel“ verankert; die Alternative betrifft הֵיכָלוֹ.'
  naturalness: „Nebukadnezar brachte auch einige von den Geräten des Hauses Jahwes nach Babel und stellte sie in seinem Tempel in Babel auf“ ist verständlich und würdevoll. „brachte ... und brachte sie“ wirkt bei einer neutraleren Wiedergabe von נתן unnötig wiederholend; „brachte ... und legte sie ... nieder“ ist idiomatisch, ohne den Vorgang zu überpräzisieren.
  terminology: „Nebukadnezar“, „Babel“ und „Jahwe“ sind im modernen deutschen Bibelregister etablierte Formen. „Haus Jahwes“ bewahrt die Ausdrucksweise des Hebräischen. „Tempel“ ist kontextuell gut vertretbar; die lexikalische Alternative „Palast“ soll korrekt am betreffenden Wort markiert bleiben.
  issues:
  - severity: medium
    issue: Fußnotenanker steht bei „Babel“ statt bei „seinem Tempel“.
    rationale: Die Fußnote erläutert die Bedeutungsalternative von בְּהֵיכָלוֹ („in seinem Tempel/Palast“), nicht den Ortsnamen Babel. Der Anker muss unmittelbar bei „Tempel“ stehen.
  - severity: low
    issue: „stellte sie ... auf“ ist gegenüber וַיִּתְּנֵם leicht zu spezifisch.
    rationale: נתן bedeutet hier allgemein „legen, setzen, platzieren“. „Aufstellen“ kann eine stehende Anordnung der Gegenstände nahelegen, die der Text nicht ausdrücklich bezeichnet.
  revised_text: Nebukadnezar brachte auch einige von den Geräten des Hauses Jahwes nach Babel und legte sie in seinem Tempel[a] in Babel nieder.
  revised_footnotes:
