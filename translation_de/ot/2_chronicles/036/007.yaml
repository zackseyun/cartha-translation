id: 2CH.36.7
reference: 2 Chronicles 36:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: de
  text: Nebukadnezar brachte auch einige von den Geräten des Hauses Jahwes nach Babel und legte sie in seinem Tempel[a] in Babel nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Palast“. Das hebräische Wort kann je nach Zusammenhang einen Tempel oder einen Palast bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  choice: auch einige von den Geräten
  rationale: 'Die Verbindung aus וּ und dem partitiven מִן bezeichnet hier eine zusätzliche Teilmenge: Nebukadnezar brachte auch einen Teil der Geräte weg. „Geräte“ ist für כְּלִי im Zusammenhang mit dem Heiligtum natürlich und sachlich.'
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus Jahwes“, das im Deutschen verständlich ist und hier den Tempel bezeichnet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: הֵבִיא
  choice: brachte
  rationale: Der Hifil von בוא bedeutet hier, etwas an einen Zielort zu bringen.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Verwendet wird die im Deutschen etablierte Namensform.
- source_word: לְבָבֶל
  choice: nach Babel
  rationale: Das לְ bezeichnet das Ziel der Bewegung; „Babel“ ist die traditionelle und weiterhin verständliche deutsche Form des biblischen Ortsnamens.
- source_word: וַיִּתְּנֵם
  choice: und stellte sie … auf
  rationale: נתן bezeichnet hier das Platzieren beziehungsweise Aufstellen der Geräte an einem bestimmten Ort. Die Formulierung ist im Deutschen anschaulich und nicht unnötig umgangssprachlich.
- source_word: בְּהֵיכָלוֹ
  choice: in seinem Tempel
  rationale: הֵיכָל kann Tempel oder Palast bedeuten. Wegen der zuvor genannten Tempelgeräte ist „Tempel“ im Kontext wahrscheinlicher; das Suffix der dritten Person Singular bezieht sich auf Nebukadnezar.
- source_word: בְּבָבֶל
  choice: in Babel
  rationale: Das בְּ bezeichnet den Ort, an dem die Geräte aufgestellt wurden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Bedeutung von הֵיכָל für Nebukadnezars Gebäude
  choice: Tempel
  alternative: Palast
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Zusammenhang mit den erbeuteten Tempelgeräten spricht eher für ein babylonisches Heiligtum; die echte Mehrdeutigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, ohne unnatürlich zu wirken. „Haus Jahwes“ bewahrt die Bildsprache des Ausgangstextes; die Mehrdeutigkeit von הֵיכָל wird nicht stillschweigend beseitigt, sondern in der Fußnote kenntlich gemacht.
