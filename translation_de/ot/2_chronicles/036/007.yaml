revisions:
- from: Nebukadnezar brachte auch einige von den Geräten des Hauses Jahwes nach Babel[a] und stellte sie in seinem Tempel in Babel auf.
  to: Nebukadnezar brachte auch einige von den Geräten des Hauses Jahwes nach Babel und legte sie in seinem Tempel[a] in Babel nieder.
  rationale: Die Revision setzt den Fußnotenanker an die von der Alternative betroffene Stelle und gibt נתן mit „legte ... nieder“ neutraler wieder. Die partitive Aussage, die Bezeichnung „Haus Jahwes“, die deutschen Eigennamen und die begründete Hauptlesart „Tempel“ bleiben erhalten.
