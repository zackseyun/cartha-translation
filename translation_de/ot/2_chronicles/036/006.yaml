base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/006.yaml
  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: de
  text: Nebukadnezar, der König von Babylon, zog gegen ihn heran und legte ihm bronzene Fesseln an, um ihn nach Babylon zu bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: zog gegen ihn herauf
  rationale: Die militärische Wendung עָלָה עַל bezeichnet ein feindliches Vorrücken gegen jemanden. „Zog gegen ihn herauf“ bewahrt sowohl die Richtungsbildlichkeit als auch den militärischen Sinn, ohne bereits ausdrücklich einen Angriff zu behaupten.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im modernen deutschen Bibel- und Allgemeingebrauch geläufige Namensform.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die Apposition bezeichnet Nebukadnezars königlichen Titel; der bestimmte Artikel entspricht natürlichem deutschem Ausdruck.
- source_word: וַיַּאַסְרֵהוּ
  choice: Er legte ihn in … Fesseln
  rationale: אָסַר bedeutet, jemanden zu binden oder gefangen zu fesseln. Zusammen mit der folgenden Bezeichnung der metallenen Zwangsmittel ist diese deutsche Formulierung klar und idiomatisch.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: in bronzene Fesseln
  rationale: Die Form bezeichnet aus Bronze gefertigte Zwangsmittel, vermutlich paarige Fesseln. „Fesseln“ lässt offen, ob Ketten, Fußfesseln oder Handschellen gemeint sind, und vermeidet eine unbelegte Präzisierung.
- source_word: לְהֹלִיכוֹ
  choice: um ihn … zu bringen
  rationale: Der Hifil von הלך drückt hier aus, dass der Gefangene an einen anderen Ort geführt beziehungsweise gebracht werden sollte.
- source_word: בָּבֶלָה
  choice: nach Babylon
  rationale: Das Richtungs-he kennzeichnet Babylon als Ziel der Bewegung; im Deutschen ist „nach Babylon“ die natürliche Wiedergabe.
