id: 2CH.36.15
reference: 2 Chronicles 36:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: de
  text: Und der HERR, der Gott ihrer Vorfahren, sandte ihnen immer wieder Botschaften durch seine Boten[a], denn er hatte Mitleid mit seinem Volk und seiner Wohnstätte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand seiner Boten“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel als der Ort, an dem Gott unter seinem Volk wohnte.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im modernen deutschen Bibelgebrauch weithin verständliche Wiedergabe des Gottesnamens; die Großschreibung kennzeichnet, dass im Hebräischen JHWH steht.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: der Gott ihrer Vorfahren
  rationale: „Vorfahren“ gibt אָבוֹת in natürlichem Gegenwartsdeutsch wieder und bewahrt den geschichtlichen und bundesbezogenen Rückbezug.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: sandte ihnen ... Botschaften
  rationale: Das Objekt ist im Hebräischen nicht ausdrücklich genannt, wird aber durch die Boten und den Kontext als Mitteilung erschlossen. Der Plural passt zur idiomatisch ausgedrückten Wiederholung.
- source_word: בְּיַד מַלְאָכָיו
  choice: durch seine Boten
  rationale: בְּיַד bezeichnet hier die Vermittlung beziehungsweise das Werkzeug. Natürliches Deutsch gibt dies mit „durch“ wieder; „Boten“ vermeidet die unbegründete Festlegung auf himmlische Engel.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: immer wieder
  rationale: Die Verbindung „früh aufstehen und senden“ ist ein hebräisches Idiom für eifriges, beharrlich wiederholtes Senden. Die Sinnwiedergabe ist im Deutschen klarer als eine wörtliche Nachbildung.
- source_word: כִּי חָמַל
  choice: denn er hatte Mitleid
  rationale: חמל bezeichnet schonendes Erbarmen beziehungsweise Mitleid. „Hatte Mitleid“ bewahrt das Motiv für Gottes wiederholte Warnungen, ohne die Aussage auf „verschonen“ zu verengen.
- source_word: עַל עַמּוֹ
  choice: mit seinem Volk
  rationale: Nach „Mitleid haben“ entspricht „mit“ der natürlichen deutschen Rektion.
- source_word: מְעוֹנוֹ
  choice: seiner Wohnstätte
  rationale: „Wohnstätte“ bewahrt die lexikalische Bedeutung und die theologische Aussage von Gottes Gegenwart, ohne den Bezug im Haupttext ausdrücklich auf den Tempel zu reduzieren.
theological_decisions:
- issue: Identität der Boten
  choice: menschliche, insbesondere prophetische Boten bleiben durch die allgemeine Bezeichnung „Boten“ naheliegend
  alternative: himmlische Engel
  rationale: Der Zusammenhang handelt von Gottes wiederholten Warnungen an Juda; dennoch wird die lexikalische Bezeichnung nicht durch „Propheten“ enger gemacht, als der Vers selbst formuliert.
- issue: Bezug der Wohnstätte
  choice: die metaphorisch-theologische Bezeichnung „Wohnstätte“ bleibt erhalten
  alternative: ausdrückliche Wiedergabe als „Tempel“
  rationale: Der Tempel in Jerusalem ist im Kontext gemeint, doch der hebräische Ausdruck betont zugleich Gottes Wohnen bei seinem Volk.
- issue: Göttliches Mitleid vor dem Gericht
  choice: die Spannung zwischen Gottes beharrlicher Warnung und dem folgenden Gericht bleibt bestehen
  alternative: das Mitleid als bloßen Aufschub oder als endgültige Verschonung auslegen
  rationale: Der Vers nennt Gottes Mitleid als Grund seines wiederholten Sendens, ohne damit das spätere Gericht aufzuheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das schwer nachbildbare hebräische Idiom הַשְׁכֵּם וְשָׁלוֹחַ wird sinngemäß mit „immer wieder“ wiedergegeben. Satzbau und Wortwahl bleiben gut vorlesbar; „Wohnstätte“ erhält bewusst etwas biblische Würde, ohne veraltet zu wirken.
