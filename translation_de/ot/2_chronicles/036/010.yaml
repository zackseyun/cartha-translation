base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: de
  text: Als das Jahr sich wieder wendete[a], sandte König Nebukadnezar ihn nach Babel und ließ ihn zusammen mit den kostbaren Geräten des Hauses Jahwes[b] dorthin bringen. Dann machte er Zedekia, den Bruder Jojachins[c], zum König über Juda und Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bei der Wiederkehr des Jahres«; gemeint ist der Zeitpunkt, an dem das Jahr wieder seinen Umschwung erreicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit den wertvollen Geräten des Hauses Jahwes«.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: »seinen Bruder«; gemeint ist Jojachin. Zedekia war ein naher Verwandter Jojachins, genauer gesagt sein Onkel.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Als das Jahr sich gewendet hatte
  rationale: Gibt die hebräische Wendung vom »Wiederkehren« oder »Sichwenden« des Jahres natürlich wieder, ohne sie auf den Frühling festzulegen.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: ließ ... ihn ... bringen
  rationale: Die Verbindung aus »senden« und dem kausativen »bringen« bezeichnet hier knapp und idiomatisch Nebukadnezars veranlasste Überführung Jojachins.
- source_word: בָבֶלָה
  choice: nach Babel
  rationale: Das Richtungs-he bezeichnet die Bewegung auf Babel zu; »nach Babel« ist die natürliche deutsche Wiedergabe.
- source_word: כְּלֵי חֶמְדַּת
  choice: die kostbaren Geräte
  rationale: כְּלֵי meint Geräte oder Gegenstände, חֶמְדַּת deren Kostbarkeit beziehungsweise Begehrtheit; im Tempelkontext ist »kostbare Geräte« passend.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Bewahrt das hebräische Bild »Haus« und gibt den ausdrücklich stehenden Gottesnamen als »Jahwe« wieder.
- source_word: וַיַּמְלֵךְ
  choice: machte ... zum König
  rationale: Das Hifil bedeutet, jemanden herrschen zu lassen beziehungsweise zum König zu machen.
- source_word: אָחִיו
  choice: seinen Bruder
  rationale: Bewahrt den Wortlaut und seine mögliche weitere Verwendung für einen nahen männlichen Verwandten; die genaue Verwandtschaft wird in der Fußnote erklärt.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: über Juda und Jerusalem
  rationale: עַל kennzeichnet hier den Herrschaftsbereich; die Formulierung umfasst das Reich und seine Hauptstadt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verwandtschaftsbezeichnung אָחִיו
  choice: seinen Bruder, mit erklärender Fußnote
  alternative: seinen Verwandten / seinen Onkel
  rationale: Die Übersetzung lässt die Spannung zur genaueren genealogischen Angabe bestehen und ersetzt die breitere hebräische Verwandtschaftsbezeichnung nicht stillschweigend durch eine Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Babel« folgt der traditionellen deutschen Form des Ortsnamens; »Haus Jahwes« bewahrt die konkrete hebräische Ausdrucksweise. Die Satzfolge wurde für natürliches Deutsch leicht gegliedert, ohne inhaltliche Beziehungen aufzulösen.
