revisions:
- from: Als das Jahr sich gewendet hatte[a], ließ König Nebukadnezar ihn nach Babel bringen, zusammen mit den kostbaren Geräten aus dem Haus Jahwes[b]. Dann machte er Zedekia, seinen Bruder[c], zum König über Juda und Jerusalem.
  to: Als das Jahr sich wieder wendete[a], sandte König Nebukadnezar ihn nach Babel und ließ ihn zusammen mit den kostbaren Geräten des Hauses Jahwes[b] dorthin bringen. Dann machte er Zedekia, den Bruder Jojachins[c], zum König über Juda und Jerusalem.
  rationale: Die Revision vermeidet die überstarke zeitliche Vorordnung durch das Plusquamperfekt und klärt den im Deutschen missverständlichen Bezug der Verwandtschaftsbezeichnung. Die Aussage über Zedekias genaue genealogische Beziehung bleibt, wie im Hebräischen selbst, in einer Fußnote und wird nicht als Ersatz für »Bruder« in den Haupttext gesetzt.
