base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: de
  text: Die übrigen Taten Jojakims, seine abscheulichen Taten und was über ihn ans Licht kam[a] – sie sind im Buch der Könige von Israel und Juda aufgeschrieben. Sein Sohn Jojachin wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was gegen ihn festgestellt wurde“. Die hebräische Wendung kann allgemein das meinen, was über Jojakim ans Licht kam; im negativen Zusammenhang ist auch eine belastende Bedeutung möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: Die übrigen Taten Jojakims
  rationale: דִּבְרֵי bezeichnet in der königlichen Schlussformel nicht nur Worte, sondern die Begebenheiten und Taten einer Regierungszeit. „Die übrigen Taten“ ist im Deutschen natürlich und sachgerecht.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: seine abscheulichen Taten
  rationale: תֹּועֵבָה trägt eine starke moralische beziehungsweise kultische Wertung. Die Wiedergabe vermeidet das im heutigen Deutsch missverständliche Substantiv „Gräuel“, bewahrt aber die deutliche Verurteilung; „Taten“ macht die Verbindung mit עָשָׂה idiomatisch.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: und was über ihn bekannt wurde
  rationale: Das passive נִמְצָא mit עַל kann das bezeichnen, was über oder hinsichtlich Jojakims festgestellt beziehungsweise entdeckt wurde. „Über ihn bekannt wurde“ bewahrt diese Unbestimmtheit, ohne ausdrücklich Anklagen vorauszusetzen.
- source_word: הִנָּם כְּתוּבִים
  choice: sie sind … aufgeschrieben
  rationale: הִנָּם lenkt die Aufmerksamkeit auf den vorhandenen schriftlichen Bericht. Im modernen Deutschen vermittelt die direkte Feststellung diese Funktion natürlicher als „siehe“; „aufgeschrieben“ gibt כְּתוּבִים unmittelbar wieder.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: im Buch der Könige von Israel und Juda
  rationale: Die Formulierung behandelt die Quelle titelartig und folgt der hebräischen Bezeichnung eng.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: Die Verbform meldet die Thronbesteigung Jojachins. „Wurde … König“ ist für diesen punktuellen Herrschaftswechsel natürlicher als „regierte“ und gibt תַּחְתָּיו als Nachfolgeformel wieder.
