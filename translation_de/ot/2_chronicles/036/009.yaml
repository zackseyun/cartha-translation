base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: de
  text: Jojachin war acht Jahre alt, als er König wurde[a], und er regierte drei Monate und zehn Tage in Jerusalem. Er tat, was in den Augen Jahwes böse war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In 2. Könige 24,8 steht statt »acht Jahre alt«: »achtzehn Jahre alt«.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: war acht Jahre alt
  rationale: Die hebräische Altersangabe lautet wörtlich »ein Sohn von acht Jahren«; die gewählte Formulierung gibt diese im modernen Deutschen idiomatisch wieder, ohne die überlieferte Zahl zu verändern.
- source_word: יְהוֹיָכִין
  choice: Jojachin
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts; diese Wiedergabe ist natürlich und entspricht der Funktion der hebräischen Königsformel.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: drei Monate und zehn Tage
  rationale: Direkte und klare Wiedergabe der Regierungsdauer.
- source_word: מָלַךְ
  choice: er regierte
  rationale: Gängige deutsche Wiedergabe des Verbs in einer Königsnotiz.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Ortsangabe wird unmittelbar wiedergegeben.
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Bewahrt den charakteristischen hebräischen Ausdruck für moralisch verwerfliches Handeln und klingt zugleich in modernem Deutsch verständlich.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Bewahrt die Bildsprache des hebräischen Ausdrucks für Gottes Beurteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als im Deutschen geläufige Form des offenbarten Gottesnamens wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Chronologische Spannung zu 2. Könige 24,8, wo Jojachin beim Regierungsantritt achtzehn Jahre alt ist
  choice: Die masoretische Lesart »acht Jahre alt« bleibt im Haupttext erhalten.
  alternative: »achtzehn Jahre alt« entsprechend 2. Könige 24,8
  rationale: Der vorgegebene hebräische Ausgangstext hat »acht«. Die Übersetzung harmonisiert die Parallelstellen nicht stillschweigend, sondern nennt die abweichende Angabe in einer Fußnote.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die knappe Form einer königlichen Regierungsnotiz bleibt erhalten; die hebräische Metapher »in den Augen« wird bewusst bewahrt.
