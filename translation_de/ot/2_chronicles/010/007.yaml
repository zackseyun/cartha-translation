id: 2CH.10.7
reference: 2 Chronicles 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֵלָ֜י/ו לֵ/אמֹ֗ר אִם תִּֽהְיֶ֨ה לְ/ט֜וֹב לְ/הָ/עָ֤ם הַ/זֶּה֙ וּ/רְצִיתָ֔/ם וְ/דִבַּרְתָּ֥ אֲלֵ/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: de
  text: 'Sie sagten zu ihm: »Wenn du gut zu diesem Volk bist, ihnen entgegenkommst[a] und freundlich mit ihnen redest, werden sie dir allezeit dienen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihnen Gunst erweist«. Das hebräische Verb kann sowohl das Gewinnen ihres Wohlgefallens als auch eine ihnen erwiesene Gunst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »werden sie dir alle Tage Diener sein«.'
    reason: literal_rendering
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: du gut zu diesem Volk bist
  rationale: Die Wendung היה + לְ + טוֹב bezeichnet hier ein gutes beziehungsweise wohltätiges Verhalten gegenüber dem Volk. Die Übersetzung bleibt nah am Wortlaut, ohne den Sinn auf bloße Freundlichkeit zu verengen.
- source_word: וּרְצִיתָם
  choice: ihnen entgegenkommst
  rationale: רצה kann hier bedeuten, das Wohlgefallen der Menschen zu gewinnen oder ihnen Gunst zu erweisen. »Entgegenkommen« gibt im politischen Zusammenhang die versöhnliche Haltung natürlich wieder; die mögliche Nuance »ihnen Gunst erweisen« wird in der Fußnote bewahrt.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: freundlich mit ihnen redest
  rationale: Wörtlich steht »gute Worte zu ihnen redest«. Die idiomatische deutsche Formulierung vermittelt denselben Sinn und bewahrt den Gegensatz zur späteren harten Antwort Rehabeams.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: werden sie dir dienen
  rationale: עֲבָדִים bezeichnet hier Untertanen im Dienst des Königs, nicht notwendig Sklaven. Die verbale Wiedergabe ist im Deutschen natürlich und drückt die zugesagte dauerhafte Loyalität aus.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Die idiomatische Zeitangabe bedeutet wörtlich »alle Tage« und bezeichnet fortdauernden Dienst. »Allezeit« ist würdig und prägnant; die wörtlichere Möglichkeit wird in der Fußnote angegeben.
