  edition: WLC
  text: וַ/יַּעֲנֵ֥/ם הַ/מֶּ֖לֶךְ קָשָׁ֑ה וַֽ/יַּעֲזֹב֙ הַ/מֶּ֣לֶךְ רְחַבְעָ֔ם אֵ֖ת עֲצַ֥ת הַ/זְּקֵנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: de
  text: Da antwortete ihnen der König hart[a], und König Rehabeam verwarf[b] den Rat der Ältesten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: streng.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: verließ oder gab auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: antwortete ihnen
  rationale: Das Verb ענה bezeichnet hier das Antworten; das Suffix der 3. Person Plural wird ausdrücklich mit „ihnen“ wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte und im Deutschen natürliche Wiedergabe des bestimmten Substantivs.
- source_word: קָשָׁה
  choice: hart
  rationale: Das formal adjektivische קָשָׁה beschreibt hier die Art der Antwort. „Hart“ bewahrt die Bildlichkeit und wirkt zugleich natürlich.
- source_word: וַיַּעֲזֹב
  choice: verwarf
  rationale: עזב bedeutet grundsätzlich „verlassen, aufgeben“. Im Zusammenhang mit einem Rat bezeichnet es dessen entschiedene Zurückweisung; „verwarf“ gibt diesen Sinn idiomatisch wieder, während eine Fußnote die wörtlichere Bedeutung festhält.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: König Rehabeam
  rationale: Die appositionelle Verbindung identifiziert den König mit Namen; „König Rehabeam“ ist die natürliche deutsche Form.
- source_word: עֲצַת
  choice: den Rat
  rationale: עֵצָה bezeichnet hier den von den Ältesten erteilten Rat beziehungsweise ihre Empfehlung.
- source_word: הַזְּקֵנִים
  choice: der Ältesten
  rationale: Die Bezeichnung meint die anerkannten älteren Ratgeber und Verantwortungsträger, nicht lediglich alte Männer.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Da“ führt die Reaktion im fortlaufenden Bericht natürlich ein; „hart“ hält sich eng an die hebräische Ausdrucksweise. Die Wiederholung von „König“ wird wie im Ausgangstext beibehalten.
