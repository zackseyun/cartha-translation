base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Was ratet ihr, damit wir diesem Volk antworten können, das zu mir gesagt hat: ›Mach das Joch leichter, das dein Vater uns auferlegt hat.‹?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֽוֹעָצִים
  choice: ratet ihr
  rationale: Das Partizip von יעץ bezeichnet hier das Erteilen eines Rates; die deutsche Frageform »Was ratet ihr?« gibt den beratenden Sinn natürlich wieder.
- source_word: וְנָשִׁיב דָּבָר
  choice: was wir … antworten sollen
  rationale: Die Verbindung bezeichnet das Erteilen einer Antwort. Die Konstruktion mit »sollen« fügt sich idiomatisch an die Bitte um Rat an und bewahrt das hebräische »wir«.
- source_word: הָעָם הַזֶּה
  choice: diesem Volk
  rationale: Der kollektive Singular עָם wird als »Volk« wiedergegeben; der Dativ folgt dem deutschen Verb »antworten«.
- source_word: דִּבְּרוּ אֵלַי
  choice: zu mir gesagt hat
  rationale: Im Kontext geht es um den zuvor geäußerten konkreten Wunsch des Volkes; der deutsche Singular richtet sich nach dem Kollektiv »Volk«.
- source_word: לֵאמֹר
  choice: — durch Doppelpunkt und direktes Zitat wiedergegeben
  rationale: Der hebräische Zitateinleiter wird im modernen Deutschen natürlicherweise durch Interpunktion statt durch ein zusätzliches »indem es sagte« ausgedrückt.
- source_word: הָקֵל מִן הָעֹל
  choice: Mach das Joch leichter
  rationale: Die Wiedergabe bewahrt das Bild des Jochs und gibt den Hifil-Imperativ idiomatisch wieder, ohne die im Deutschen unnatürliche wörtliche Verbindung »erleichtere von dem Joch« nachzubilden.
- source_word: נָתַן ... עָלֵינוּ
  choice: uns auferlegt hat
  rationale: »Auferlegen« entspricht der Verbindung von »geben/setzen« und »auf uns« und passt im Deutschen besonders zum bildlich gebrauchten Joch.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Und er sagte zu ihnen
  rationale: Das einleitende »Und« bewahrt den fortlaufenden Erzählanschluss des Wayyiqtol.
