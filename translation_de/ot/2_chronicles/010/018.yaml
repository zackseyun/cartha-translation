  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: de
  text: Da schickte König Rehabeam Hadoram[a], der über die Fronarbeit eingesetzt war. Doch die Israeliten steinigten ihn, sodass er starb. König Rehabeam aber nahm all seine Kraft zusammen, um den Streitwagen zu besteigen und nach Jerusalem zu fliehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht hier »Hadoram«; der Parallelbericht in 1. Könige 12,18 nennt ihn »Adoram«.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »König Rehabeam aber stärkte sich, um auf den Streitwagen zu steigen und nach Jerusalem zu fliehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte
  rationale: Die übliche und natürliche Wiedergabe von שלח im erzählenden Zusammenhang.
- source_word: הֲדֹרָם
  choice: Hadoram
  rationale: Entspricht der Namensform des hebräischen Chroniktextes; die abweichende Form im Parallelbericht wird in einer Fußnote bewahrt.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: der über die Fronarbeit eingesetzt war
  rationale: מַס bezeichnet hier auferlegten Arbeitsdienst. „Fronarbeit“ ist im Deutschen präzise und verständlich; die Formulierung gibt zugleich Had­orams Aufsichtsfunktion wieder.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: steinigten ihn
  rationale: Das deutsche Verb bezeichnet bereits das Töten beziehungsweise Bewerfen mit Steinen. Die hebräische Verbindung aus Verb und Substantiv wird zugunsten natürlichen Deutschen nicht pleonastisch nachgebildet.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Söhne Israels“ ist hier eine idiomatische Volksbezeichnung; „die Israeliten“ gibt ihren Sinn in modernem Deutsch klar wieder.
- source_word: וַיָּמֹת
  choice: sodass er starb
  rationale: Die resultative Verknüpfung macht im Deutschen deutlich, dass sein Tod die Folge der Steinigung war, ohne über den Kontext hinauszugehen.
- source_word: הִתְאַמֵּץ
  choice: raffte sich auf
  rationale: Der Hitpael von אמץ bezeichnet ein Sich-Stärken beziehungsweise entschlossenes Zusammennehmen, nicht unmittelbar Eile. „Raffte sich auf“ bewahrt diesen reflexiven Kraft- und Entschlossenheitsaspekt in natürlichem Deutsch.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: den Streitwagen zu besteigen
  rationale: עלה bezeichnet hier das Hinaufsteigen beziehungsweise Besteigen des Wagens; „besteigen“ ist idiomatisch und präzise.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: nach Jerusalem zu fliehen
  rationale: נוס bedeutet fliehen; die Richtungsform des Ortsnamens wird mit „nach Jerusalem“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Volksbezeichnung „Israeliten“ vermeidet das im Deutschen missverständliche „Söhne Israels“. „Fronarbeit“ benennt auferlegten Arbeitsdienst und nicht bloß eine Steuer. Die ungewöhnliche reflexive Bedeutung von הִתְאַמֵּץ wird im Haupttext natürlich als „raffte sich auf“ wiedergegeben und in der Fußnote formal transparent gemacht.
