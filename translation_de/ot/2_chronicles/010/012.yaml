source:
  edition: WLC
  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: de
  text: 'So kamen Jerobeam und das ganze Volk am dritten Tag zu Rehabeam, genau wie der König gesagt hatte: »Kommt am dritten Tag wieder zu mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kamen
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »ankommen« bedeuten. Mit אֶל רְחַבְעָם ist »kamen … zu Rehabeam« im Deutschen natürlich und sachlich genau.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Der Personenname folgt der etablierten deutschen Bibelnamenform.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet hier die Gesamtheit der Menschen, die mit Jerobeam zurückkehrten, nicht ausdrücklich eine formelle Versammlung.
- source_word: אֶל רְחַבְעָם
  choice: zu Rehabeam
  rationale: אֶל bezeichnet die Bewegung auf eine Person hin; »zu Rehabeam« gibt dies unmittelbar wieder.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Die hebräische Zeitangabe lässt sich idiomatisch und ohne erklärende Ergänzung so wiedergeben.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Formulierung hebt die genaue Übereinstimmung mit der früheren Anweisung des Königs hervor.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: der König gesagt hatte
  rationale: דבר ist hier das gewöhnliche Verb des Sprechens. Das deutsche Plusquamperfekt macht deutlich, dass die Äußerung zuvor erfolgt war, ohne sie zu einem ausdrücklichen Befehl zu verstärken.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Rede-Einleiter wird im natürlichen modernen Deutsch durch einen Doppelpunkt funktional wiedergegeben.
- source_word: שׁוּבוּ אֵלַי
  choice: Kommt … wieder zu mir
  rationale: שׁוב bezeichnet hier die Rückkehr nach der vereinbarten Frist. »Kommt wieder zu mir« ist im direkten deutschen Redezusammenhang natürlicher als das steifere »Kehrt zu mir zurück«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge und die direkte Rede bleiben erkennbar, während לֵאמֹר idiomatisch durch Zeichensetzung statt durch das schwerfällige »indem er sagte« wiedergegeben wird.
