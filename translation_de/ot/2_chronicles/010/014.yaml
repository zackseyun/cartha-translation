  terminology: „Joch“ bewahrt die Metapher, „junge Männer“ trifft die erzählerisch gemeinten jüngeren Berater, und „Skorpione“ wahrt die wörtliche hebräische Bildsprache. Die Fußnote erläutert die wahrscheinliche Bedeutung als Skorpionpeitschen, ohne diese Deutung im Haupttext zwingend festzulegen.
