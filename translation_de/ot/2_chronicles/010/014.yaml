  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אַכְבִּיד֙ אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עָלָ֑י/ו אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּ/עֲקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: de
  text: 'Er redete zu ihnen nach dem Rat der jungen Männer und sagte: „Ich werde euer Joch schwerer machen und noch etwas darauflegen. Mein Vater hat euch mit Peitschen gezüchtigt; ich aber werde euch mit Skorpionen[a] züchtigen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise sind „Skorpionpeitschen“ gemeint, also Peitschen mit scharfen Spitzen oder Widerhaken; wörtlich steht im Hebräischen „mit Skorpionen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Er redete
  rationale: דבר ist das gewöhnliche Verb für „reden/sprechen“. Im Zusammenhang handelt es sich um Rehabeams Antwort, doch „redete“ bleibt näher am hebräischen Ausdruck als das stärker deutende „antwortete“.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: nach dem Rat der jungen Männer
  rationale: עֵצָה bedeutet „Rat“; das Präfix כ bezeichnet hier die Übereinstimmung mit diesem Rat. הַיְלָדִים meint im Erzählzusammenhang nicht kleine Kinder, sondern Rehabeams jüngere Berater.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Ich werde euer Joch schwerer machen
  rationale: Die Hifil-Form von כבד ist kausativ. Da das Joch bereits besteht, gibt „schwerer machen“ die angekündigte Steigerung natürlich wieder und bewahrt zugleich das Bild des Jochs.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: und noch etwas darauflegen
  rationale: יסף mit עַל bezeichnet ein Hinzufügen beziehungsweise Vermehren. Die Formulierung bezieht sich auf das zuvor genannte Joch und klingt im Deutschen natürlicher als das wörtlichere „ich werde darauf hinzufügen“.
- source_word: יִסַּר
  choice: gezüchtigt
  rationale: יסר kann „erziehen, zurechtweisen, züchtigen“ bedeuten. Im Zusammenhang einer königlichen Drohung und in Verbindung mit Peitschen bezeichnet es gewaltsame Strafzucht; „züchtigen“ bewahrt sowohl den Straf- als auch den Disziplinierungsaspekt.
- source_word: בַּשּׁוֹטִים
  choice: mit Peitschen
  rationale: שׁוֹט bezeichnet eine Peitsche oder Geißel. „Peitschen“ ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: בָּעֲקְרַבִּים
  choice: mit Skorpionen
  rationale: Das Substantiv bedeutet wörtlich „Skorpione“. Wahrscheinlich sind besonders schmerzhafte Peitschen gemeint; die bildhafte und möglicherweise bewusst mehrdeutige hebräische Ausdrucksweise bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle und im Deutschen verständliche Bild vom „Joch“ wird beibehalten. „Züchtigen“ ist bewusst kräftig gewählt, da der Kontext körperliche Strafgewalt bezeichnet. Das im zweiten Satzteil des Hebräischen ausgelassene Verb wird im Deutschen zur Verständlichkeit wiederholt.
