  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text zuverlässig: Rehabeam spricht entsprechend dem Rat der jungen Männer, kündigt ein schwereres Joch und zusätzliche Belastung an und kontrastiert die Peitschen seines Vaters mit den „Skorpionen“. Die im Hebräischen im zweiten Glied ausgesparte Verbform wird mit dem zukunftsbezogenen „werde ... züchtigen“ kontextgerecht und ohne Sinnverlust ergänzt.'
