  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: de
  text: 'Und nun: Mein Vater hat euch ein schweres Joch auferlegt; ich aber werde euer Joch noch schwerer machen. Mein Vater hat euch mit Peitschen gezüchtigt, ich aber mit Skorpionen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise sind „Skorpionpeitschen“ gemeint, also Peitschen mit scharfen Spitzen oder Widerhaken. Wörtlich steht im Hebräischen „mit Skorpionen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: hat euch ein schweres Joch auferlegt
  rationale: Das Hifil von עמס bezeichnet das Aufladen einer Last. Die natürliche deutsche Wendung „ein Joch auferlegen“ bewahrt sowohl das Bild als auch den Gedanken einer aufgezwungenen schweren Belastung.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: werde euer Joch noch schwerer machen
  rationale: Wörtlich steht „werde zu eurem Joch hinzufügen“. Die gewählte Formulierung gibt die gemeinte Steigerung in natürlichem Deutsch wieder und hält am Jochbild fest.
- source_word: יִסַּר
  choice: gezüchtigt
  rationale: יסר kann disziplinierende, korrigierende oder strafende Behandlung bezeichnen. „Gezüchtigt“ passt zum konkreten Bild der Peitschen und bewahrt die Härte der Aussage.
- source_word: בַּשּׁוֹטִים
  choice: mit Peitschen
  rationale: שׁוֹט bezeichnet eine Peitsche oder Geißel; „Peitschen“ ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: בָּעֲקְרַבִּים
  choice: mit Skorpionen
  rationale: Das hebräische Substantiv bedeutet wörtlich „Skorpione“. Diese auffällige Bildsprache bleibt im Haupttext erhalten; die mögliche Bezeichnung besonderer Peitschen wird in der Fußnote erläutert.
