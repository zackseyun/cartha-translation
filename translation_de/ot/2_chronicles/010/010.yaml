base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: de
  text: 'Die jungen Männer, die mit ihm aufgewachsen waren, sagten zu ihm: »So sollst du zu dem Volk sagen, das zu dir gesagt hat: ›Dein Vater hat unser Joch schwer gemacht; du aber mach es uns leichter!‹ So sollst du zu ihnen sagen: ›Mein kleiner Finger[a] ist dicker als die Taille[b] meines Vaters.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Meine Kleinigkeit ist dicker«; die ungewöhnliche hebräische Wendung wird gewöhnlich als »mein kleiner Finger« verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Lenden meines Vaters«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: die jungen Männer
  rationale: Das Wort kann Jungen oder junge Leute bezeichnen. Im höfischen Zusammenhang und mit dem Zusatz, dass sie mit Rehabeam aufgewachsen waren, sind seine jüngeren Altersgenossen beziehungsweise Berater gemeint.
- source_word: גָּדְלוּ אִתּוֹ
  choice: die mit ihm aufgewachsen waren
  rationale: Die Wendung bezeichnet eine gemeinsame Kindheit beziehungsweise ein gemeinsames Heranwachsen und wird so im Deutschen natürlich wiedergegeben.
- source_word: כֹּה תֹאמַר
  choice: So sollst du ... sagen
  rationale: Die geläufige Einleitungsformel für eine vorgegebene Rede wird direkt und mit ihrem auffordernden Charakter wiedergegeben.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Dein Vater hat unser Joch schwer gemacht
  rationale: Das konkrete Bild des Jochs bleibt erhalten; הִכְבִּיד bezeichnet dessen Erschwerung.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: mach es uns leichter
  rationale: Das im Hebräischen nicht wiederholte Objekt ergibt sich aus dem zuvor genannten Joch. Die Formulierung gibt die Bitte um Erleichterung in natürlichem Deutsch wieder.
- source_word: קָטָנִּי
  choice: mein kleiner Finger
  rationale: Wörtlich ist die ungewöhnliche Form etwa als »meine Kleinigkeit« oder »mein Kleines« zu verstehen; im Zusammenhang gilt sie als elliptische Bezeichnung des kleinen Fingers. Die idiomatische Wiedergabe steht im Text, die formale Schwierigkeit in der Fußnote.
- source_word: עָבָה
  choice: ist dicker als
  rationale: Das Wort bezeichnet Dicke oder Stärke; der Vergleich wird durch מִן ausgedrückt.
- source_word: מִמָּתְנֵי אָבִי
  choice: als die Hüften meines Vaters
  rationale: מָתְנַיִם bezeichnet den Hüft-, Lenden- oder Taillenbereich. »Hüften« ist modern und verständlich und bewahrt zugleich die körperliche Wucht der prahlerischen Aussage.
