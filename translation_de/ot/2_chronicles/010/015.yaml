source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: de
  text: So hörte der König nicht auf das Volk; denn diese Wendung der Ereignisse[a] kam von Gott, um sein Wort zu bestätigen, das er durch Ahija aus Schilo zu Jerobeam, dem Sohn Nebats, gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn die Ursache war von Gott“. Das hebräische Substantiv kann eine Wendung, einen Umstand oder eine verursachende Entwicklung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: auf … hören
  rationale: Die Verbindung bezeichnet hier, einer Bitte oder Forderung Gehör zu schenken. „Auf das Volk hören“ ist im Deutschen natürlich und legt sich weniger stark als „gehorchen“ auf vollständigen Gehorsam fest.
- source_word: נְסִבָּה
  choice: Wendung der Ereignisse
  rationale: Das seltene Substantiv kann eine Wendung, einen Umstand oder eine verursachende Entwicklung bezeichnen. Die Formulierung gibt den erzählerischen Zusammenhang wieder, ohne die mögliche Bedeutung „Ursache“ auszuschließen.
- source_word: מֵעִם הָאֱלֹהִים
  choice: kam von Gott
  rationale: Die Präposition bezeichnet Ursprung oder Ausgangspunkt. „Kam von Gott“ ist direkt und idiomatisch.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion bewahrt den Zweck- beziehungsweise Zielbezug des folgenden Geschehens.
- source_word: הָקִים
  choice: bestätigte
  rationale: Der Hifil von קום bedeutet hier, ein Wort bestehen zu lassen oder rechtskräftig zu machen. „Bestätigen“ ist verständliches modernes Deutsch und bleibt näher am Bild des Bestandgebens als das stärker deutende „erfüllen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: Die breite Bedeutung des hebräischen Ausdrucks bleibt erhalten; „Verheißung“ oder „Botschaft“ würde den Sinn unnötig einengen.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung bezeichnet die vermittelnde Person. Das deutsche „durch“ gibt diese prophetische Mittlerschaft natürlich wieder.
- source_word: הַשִּׁלוֹנִי
  choice: aus Schilo
  rationale: Die Herkunftsbezeichnung wird in verständlichem, natürlichem Deutsch wiedergegeben.
- source_word: בֶּן נְבָט
  choice: Sohn Nebats
  rationale: Dies ist die übliche deutsche Wiedergabe des hebräischen Patronyms.
theological_decisions:
- issue: Göttliche Verursachung und menschliches Handeln
  choice: diese Wendung der Ereignisse kam von Gott
  alternative: die Ursache kam von Gott
  rationale: Der Text schreibt den Ursprung der Entwicklung Gott zu und schildert zugleich die Weigerung des Königs als dessen wirkliches Handeln. Die Übersetzung bewahrt diese Spannung, ohne Gottes Wirken abzuschwächen oder über den Wortlaut hinaus zu behaupten, Gott habe den König unmittelbar zur Weigerung gezwungen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ macht diesen im Deutschen als Namen erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolonanschluss hält menschliche Entscheidung und göttliche Vorsehung eng zusammen. „Ahija aus Schilo“ ist für heutige Leser natürlicher als die substantivierte Herkunftsbezeichnung „der Schiloniter“.
