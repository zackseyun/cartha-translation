source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: de
  text: Doch er verwarf den Rat der Ältesten, den sie ihm gegeben hatten, und beriet sich mit den jungen Männern, die mit ihm aufgewachsen waren und vor ihm standen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihm aufwarteten“ beziehungsweise „die ihm dienten“. „Vor jemandem stehen“ kann hier eine höfische Wendung für den Dienst am König sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: verwarf
  rationale: עזב bedeutet grundsätzlich „verlassen“ oder „aufgeben“. Im Zusammenhang weist Rehabeam den Rat zugunsten einer anderen Beratung zurück; „verwarf“ gibt diese entschiedene Abkehr im Deutschen natürlich wieder.
- source_word: עֲצַת הַזְּקֵנִים
  choice: den Rat der Ältesten
  rationale: עֵצָה bezeichnet Rat oder Beratung; זְקֵנִים meint hier ältere, erfahrene Ratgeber. „Älteste“ bewahrt sowohl den Altersbezug als auch ihre anerkannte Stellung.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: den sie ihm gegeben hatten
  rationale: Wörtlich steht „mit dem sie ihn beraten hatten“. Da „Rat“ bereits genannt ist, entspricht „den sie ihm gegeben hatten“ natürlichem Deutsch und wahrt den zeitlichen Rückbezug.
- source_word: וַיִּוָּעַץ אֶת
  choice: und beriet sich mit
  rationale: Die Niphalform bezeichnet hier eine Beratung mit anderen. „Sich mit jemandem beraten“ ist die passende gegenwärtige deutsche Wendung.
- source_word: הַיְלָדִים
  choice: den jungen Männern
  rationale: יְלָדִים kann Jungen oder junge Leute bezeichnen. Hier sind gleichaltrige Hofangehörige des Königs gemeint, weshalb „junge Männer“ nicht irreführend kindlich klingt.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: die mit ihm aufgewachsen waren
  rationale: Die Formulierung beschreibt ihre gemeinsame Jugend; das Plusquamperfekt ordnet dies vor die erzählte Beratung ein.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: und vor ihm standen
  rationale: Die Übersetzung bewahrt das hebräische Bild. Da die Wendung im höfischen Zusammenhang auch Dienst oder persönliche Aufwartung ausdrücken kann, wird diese Bedeutung in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den Gegensatz zum zuvor erteilten Rat; „verwarf“ ist klarer und natürlicher als das wörtlichere „verließ“. Die höfische Bildsprache in „vor ihm standen“ bleibt im Haupttext erhalten und wird durch die Fußnote erschlossen.
