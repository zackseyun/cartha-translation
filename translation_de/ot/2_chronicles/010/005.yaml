  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: de
  text: 'Er sagte zu ihnen: »Kommt in drei Tagen wieder zu mir.« Da ging das Volk fort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Er sagte zu ihnen
  rationale: Die Wayyiqtol-Form führt in der hebräischen Erzählfolge die direkte Rede ein. Im Deutschen ist der unmarkierte Anschluss ohne ein zusätzliches »und« natürlich und wahrt den sachlichen Erzählton.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: Wartet noch drei Tage
  rationale: Wörtlich steht »noch drei Tage«. Im Zusammenhang bezeichnet die Wendung eine Frist, nach der die Angesprochenen zurückkommen sollen. Das ergänzte »Wartet« macht diese idiomatische Funktion im Deutschen klar.
- source_word: וְשׁוּבוּ אֵלָי
  choice: und kommt dann wieder zu mir
  rationale: Der pluralische Imperativ von שוב bezeichnet die Rückkehr zum Sprecher. »Kommt wieder zu mir« gibt die deiktische Ausrichtung natürlich wieder; »dann« verdeutlicht die zeitliche Abfolge, die im Hebräischen aus dem Zusammenhang hervorgeht.
- source_word: וַיֵּלֶךְ הָעָם
  choice: Da ging das Volk fort
  rationale: הלך bezeichnet hier das Weggehen nach der Aufforderung. »Da« stellt die erzählerische Folge her; der Singular »ging« entspricht dem deutschen Kollektivsingular »das Volk«.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die knappe Erzählweise des Hebräischen bleibt erhalten; die zeitliche Wendung wird für heutige Leser idiomatisch entfaltet, ohne eine theologische Deutung hinzuzufügen.
