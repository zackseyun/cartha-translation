source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּֽשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: de
  text: Über die Israeliten aber, die in den Städten Judas wohnten, regierte Rehabeam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: die Israeliten aber
  rationale: בְּנֵי יִשְׂרָאֵל ist hier eine geläufige Volksbezeichnung und wird im modernen Deutsch natürlich mit „die Israeliten“ wiedergegeben. Das vorangestellte „aber“ macht den Gegensatz zur Abspaltung Israels im vorherigen Vers deutlich.
- source_word: הַיֹּשְׁבִים
  choice: die … wohnten
  rationale: Das Partizip von ישׁב bezeichnet hier den dauerhaften Wohnsitz; „wohnten“ ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Formulierung bewahrt sowohl die Ortsangabe als auch die Zugehörigkeit der Städte zu Juda.
- source_word: וַיִּמְלֹךְ
  choice: regierte
  rationale: מלך bezeichnet hier die Ausübung der Königsherrschaft; „regierte“ ist im Deutschen idiomatischer als „herrschte als König“ und passt zur Konstruktion mit „über“.
- source_word: עֲלֵיהֶם
  choice: über …
  rationale: Die Präposition עַל mit Suffix bezeichnet die Herrschaft über die genannte Bevölkerungsgruppe. Durch die Voranstellung des Objekts wird das Pronomen im Deutschen nicht eigens wiederholt.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung von „Über die Israeliten aber“ wahrt die hebräische Informationsstruktur und hebt den Gegensatz zum vorherigen Kontext hervor; die idiomatische Volksbezeichnung steht im Haupttext, die formale Wendung in der Fußnote.
