base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: de
  text: 'Als der König nicht auf sie hörte, antwortete ganz Israel dem König: »Was haben wir für einen Anteil an David? Wir haben kein Erbteil am Sohn Isais. Jeder zu deinen Zelten, Israel![a] Kümmere dich nun um dein eigenes Haus, David!« Da ging ganz Israel zu seinen Zelten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Jeder zu deinen Zelten, Israel!« Das Hebräische redet Israel als Kollektiv in der zweiten Person Singular an. »Zu den Zelten« ist eine Aufforderung, an den eigenen Ort beziehungsweise nach Hause zurückzukehren.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht nach dem Kollektiv »ganz Israel« wörtlich »zu seinen Zelten«; gemeint ist, dass die Israeliten jeweils zu ihren eigenen Zelten beziehungsweise nach Hause gingen.
    reason: grammar_note
lexical_decisions:
- source_word: שָׁמַע
  choice: auf sie hörte
  rationale: Das Verb bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten beziehungsweise Erhören der Forderung des Volkes.
- source_word: וַיָּשִׁיבוּ
  choice: antwortete
  rationale: Die Konstruktion bezeichnet idiomatisch das Erteilen einer Antwort; das kollektive Subjekt »ganz Israel« steht im Deutschen natürlich mit dem Singular.
- source_word: חֵלֶק
  choice: Anteil
  rationale: »Anteil« bewahrt das Bild politischer und gemeinschaftlicher Teilhabe in der rhetorischen Lossagung von David.
- source_word: נַחֲלָה
  choice: Erbteil
  rationale: »Erbteil« erhält den familiären und bundesgeschichtlichen Klang eines zugewiesenen Besitz- oder Zugehörigkeitsanteils.
- source_word: בְּבֶן יִשַׁי
  choice: am Sohn Isais
  rationale: Die Formulierung gibt die Zugehörigkeit beziehungsweise Beteiligung an Davids Linie idiomatisch wieder, ohne sie auszudeuten.
- source_word: אִישׁ לְאֹהָלֶיךָ
  choice: Jeder zu seinen Zelten
  rationale: Das maskuline Singularwort ist distributiv gebraucht. »Jeder« bewahrt diese Verteilungsfunktion; »zu seinen Zelten« erhält das hebräische Bild.
- source_word: רְאֵה בֵיתְךָ
  choice: Kümmere dich nun um dein eigenes Haus
  rationale: Die Wendung ist eine schroffe Aufforderung an David, sich um sein eigenes Haus beziehungsweise seine Dynastie zu kümmern.
- source_word: לְאֹהָלָיו
  choice: zu seinen Zelten
  rationale: Der hebräische Singularbezug folgt auf das Kollektiv »ganz Israel«; im Deutschen ist »zu seinen Zelten« grammatisch möglich und bewahrt diese Form.
theological_decisions:
- issue: Politische Lossagungsformel über David und den Sohn Isais
  choice: Was haben wir für einen Anteil an David? Wir haben kein Erbteil am Sohn Isais.
  alternative: Was haben wir mit David zu schaffen? Wir haben nichts mit dem Sohn Isais zu tun.
  rationale: Die gewählte Fassung bewahrt die Metaphorik von Anteil und Erbteil sowie ihre mögliche dynastische und bundestheologische Spannung, statt sie als bloße politische Distanzierung zu paraphrasieren.
- issue: Bedeutung von »Haus« in der Anrede an David
  choice: dein eigenes Haus
  alternative: deine eigene Dynastie
  rationale: »Haus« kann Haushalt, Herrscherhaus und Dynastie anklingen lassen. Die Übersetzung lässt diese Mehrdeutigkeit bestehen.
- issue: Distributives אִישׁ
  choice: Jeder
  alternative: Jeder Mann
  rationale: Im Kontext ist אִישׁ distributiv und die Aufforderung gilt dem versammelten Israel. »Jeder« bildet die Einzelfallverteilung natürlich ab, ohne eine zusätzliche ausdrückliche Beschränkung auf erwachsene Männer einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und schroff. Historische Bilder wie »Anteil«, »Erbteil«, »Haus« und »Zelte« werden bewahrt; Fußnoten erläutern nur die idiomatische beziehungsweise grammatische Besonderheit.
