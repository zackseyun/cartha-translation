base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: de
  text: 'Da beriet sich König Rehabeam mit den Ältesten, die seinem Vater Salomo zu dessen Lebzeiten gedient hatten[a]. Er fragte: »Was ratet ihr mir, diesem Volk zu antworten[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die vor seinem Vater Salomo gestanden hatten«. Die Wendung kann den persönlichen oder amtlichen Dienst bei einem Herrscher bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »diesem Volk ein Wort zurückzugeben«. Gemeint ist, ihm eine Antwort zu erteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: beriet sich … mit
  rationale: Das Nifal von יעץ bezeichnet hier das Einholen von Rat bei anderen. Die deutsche Wendung ist natürlich und gibt den wechselseitigen Beratungsvorgang wieder.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: זקנים bezeichnet hier ältere, ranghohe Männer mit beratender Funktion. »Älteste« wahrt sowohl die Alters- als auch die Amtskomponente.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: die … gedient hatten
  rationale: Das Bild des Stehens vor einem Herrscher ist eine idiomatische Bezeichnung für persönlichen oder amtlichen Dienst. Die Übersetzung gibt die gemeinte Funktion in natürlichem Deutsch wieder; die Bildsprache wird in einer Fußnote dokumentiert.
- source_word: שְׁלֹמֹה אָבִיו
  choice: seinem Vater Salomo
  rationale: Diese Wortstellung ist im modernen Deutschen natürlicher als »Salomo, seinem Vater« und bewahrt die Beziehung eindeutig.
- source_word: בִּהְיוֹתוֹ חַי
  choice: zu dessen Lebzeiten
  rationale: Die Infinitivkonstruktion mit היה und חי bezeichnet die Zeit, in der Salomo lebte. »Zu dessen Lebzeiten« ist knapp, eindeutig und stilistisch angemessen.
- source_word: לֵאמֹר
  choice: 'Er fragte:'
  rationale: Das formelhafte hebräische »indem er sagte« leitet die direkte Rede ein. Im Deutschen gibt »Er fragte« wegen des folgenden Fragesatzes die Diskursfunktion natürlich wieder.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Was ratet ihr mir
  rationale: Die partizipiale Form fragt nach dem Rat der Ältesten. »Was ratet ihr mir« ist idiomatisches modernes Deutsch und macht den im Kontext vorausgesetzten Empfänger des Rates deutlich.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: diesem Volk zu antworten
  rationale: Wörtlich geht es darum, diesem Volk »ein Wort zurückzugeben«. Die gewählte Formulierung gibt die hebräische Antwortformel natürlich und präzise wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die höfische Dienststellung der Ältesten wird idiomatisch ausgedrückt, während die hebräische Bildsprache in der Fußnote erhalten bleibt. Die direkte Frage ist in natürlichem Gegenwartsdeutsch formuliert.
