  register: Modernes, würdiges Standarddeutsch. »Auflehnung« wahrt den politisch-dynastischen Kontext; die Fußnote erhält die aspektuelle Mehrdeutigkeit zwischen dem Aufstand als Ereignis und dem fortdauernden Zustand.
