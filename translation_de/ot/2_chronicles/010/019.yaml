source:
  edition: WLC
  text: וַ/יִּפְשְׁע֤וּ יִשְׂרָאֵל֙ בְּ/בֵ֣ית דָּוִ֔יד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/019.yaml
  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: de
  text: So lehnte sich Israel bis zum heutigen Tag gegen das Haus Davids auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So rebellierte Israel bis zum heutigen Tag gegen das Haus Davids.« Das hebräische Verb kann den Aufstand als vergangenes Ereignis oder, im Zusammenhang mit »bis zum heutigen Tag«, den daraus hervorgegangenen fortdauernden Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: befindet sich … in Auflehnung
  rationale: Das Verb פשע bezeichnet hier politischen Aufruhr beziehungsweise Auflehnung gegen eine Herrschaft. Die Formulierung gibt zusammen mit »bis zum heutigen Tag« den fortdauernden Zustand wieder, ohne das Geschehen auf eine bloße Loslösung zu verengen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier gemeinschaftlich die nördlichen Stämme im Unterschied zum davidischen Herrscherhaus und wird im Haupttext nicht erklärend erweitert.
- source_word: בְּבֵית דָּוִיד
  choice: gegen das Haus Davids
  rationale: Bei פשע kennzeichnet ב die Instanz, gegen die sich die Auflehnung richtet. »Haus Davids« bewahrt den dynastischen Sinn.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die geläufige deutsche Wendung gibt die Fortdauer bis zur Gegenwart des Erzählers wieder.
