base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: de
  text: Als Jerobeam, der Sohn Nebats, davon hörte – denn er war in Ägypten, wohin er vor König Salomo geflohen war –, kehrte er aus Ägypten zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … davon hörte
  rationale: Die Konstruktion aus וַיְהִי und Infinitiv leitet einen zeitlichen Nebensatz ein. „Als“ gibt den Erzählfluss im modernen Deutschen natürlich wieder; das im Hebräischen unausgesprochene Objekt wird durch „davon“ kontextbezogen ergänzt.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Die geläufigen deutschen Namensformen werden verwendet; die Abstammungsangabe wird klar und idiomatisch wiedergegeben.
- source_word: וְהוּא בְמִצְרַיִם
  choice: er war in Ägypten
  rationale: Der Pronomen-Satz liefert eingeschobene Hintergrundinformation und wird deshalb durch Gedankenstriche als Parenthese kenntlich gemacht.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: wohin er vor König Salomo geflohen war
  rationale: אֲשֶׁר bezieht sich auf Ägypten; das zielgerichtete „wohin“ ist im Deutschen passend. מִפְּנֵי wird idiomatisch mit „vor“ wiedergegeben und bewahrt den Gedanken des Fliehens aus Salomos Gegenwart beziehungsweise vor seiner Bedrohung.
- source_word: וַיָּשָׁב … מִמִּצְרָיִם
  choice: kehrte er aus Ägypten zurück
  rationale: שׁוב bezeichnet hier die räumliche Rückkehr. Bei Ländernamen ist deutsches „aus Ägypten“ die natürliche Wiedergabe des Herkunftsausdrucks.
theological_decisions: []
