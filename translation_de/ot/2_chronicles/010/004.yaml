base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: de
  text: Dein Vater hat uns ein hartes Joch auferlegt.[a] Mach nun den harten Dienst deines Vaters und das schwere Joch, das er uns auferlegt hat,[b] leichter; dann werden wir dir dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat unser Joch beschwerlich gemacht“ beziehungsweise „hat unser Joch drückend gemacht“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Dienst“ sind hier auferlegte Arbeitsleistungen oder Verpflichtungen unter der Königsherrschaft gemeint; auch „Arbeit“ ist möglich.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה
  choice: hat … hart gemacht
  rationale: Das Hifil von קשׁה ist kausativ. „Hart gemacht“ bewahrt diese Bedeutung und unterscheidet das Wort vom späteren כָּבֵד („schwer“).
- source_word: עֻלֵּנוּ
  choice: unser Joch
  rationale: עֹל bezeichnet wörtlich ein Joch und bildlich belastende Herrschaft oder Verpflichtung. Das konkrete Bild wird im weiteren Vers erneut aufgenommen.
- source_word: הָקֵל
  choice: Erleichtere
  rationale: Der Imperativ fordert eine Verringerung der auferlegten Last. „Erleichtere“ ist im Deutschen natürlich und erhält den Bezug zum Jochbild.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: den harten Dienst deines Vaters
  rationale: עֲבֹדָה kann Arbeit, Dienst oder auferlegte Arbeitsleistung bezeichnen. „Dienst“ erhält den politischen Bezug auf die Pflichten unter königlicher Herrschaft, ohne die Bedeutung vorschnell auf Fronarbeit zu verengen.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: und das schwere Joch
  rationale: Die wiederholte Jochmetapher bleibt erhalten; כָּבֵד wird ihrem Grundsinn entsprechend mit „schwer“ wiedergegeben.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: das er uns auferlegt hat
  rationale: „Auferlegt“ gibt נתן על im Zusammenhang einer Last idiomatisch wieder und bewahrt den Gedanken einer von königlicher Seite verhängten Belastung.
- source_word: וְנַעַבְדֶךָּ
  choice: dann werden wir dir dienen
  rationale: Das Imperfekt beschreibt die zugesagte Reaktion des Volkes auf eine Erleichterung. „Dann“ macht den im Zusammenhang angelegten Folgesinn im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Jochmetapher und der Unterschied zwischen „hart“ (קשׁה) und „schwer“ (כבד) bleiben erhalten. Der Genitiv „Dienst deines Vaters“ folgt der offenen Formulierung des Hebräischen; die Fußnote erläutert den politischen und arbeitsbezogenen Kontext.
