  rationale: Die erste Aussage wird idiomatischer formuliert, während das konkrete Jochbild und die kausative Bedeutung erhalten bleiben. „Mach ... leichter“ macht den Imperativ הָקֵל im Deutschen klar und bezieht sich syntaktisch eindeutig sowohl auf den Dienst als auch auf das Joch. Die Fußnotenanker und ihre Inhalte bleiben sachgerecht erhalten.
