base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: de
  text: 'Da schickten sie hin und riefen ihn herbei[a]. Jerobeam und ganz Israel kamen und sprachen zu Rehabeam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da sandten sie und ließen ihn rufen.“ Das Hebräische lässt unausgesprochen, was oder wen sie sandten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Da schickten sie hin
  rationale: Das Objekt von שׁלח bleibt im Hebräischen unausgesprochen. „Sie schickten hin“ bewahrt diese Ellipse, ohne ausdrücklich Boten oder eine Nachricht einzuführen.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: ließen ihn rufen
  rationale: קרא mit ל bezeichnet hier das Herbeirufen bzw. Vorladen einer Person. Die Formulierung schließt natürlich an das vorausgehende „schickten sie hin“ an.
- source_word: וַיָּבֹא
  choice: kamen
  rationale: Obwohl das hebräische Verb im Singular steht und sich zunächst an Jerobeam als führendes Subjekt anschließt, verlangt das zusammengesetzte deutsche Subjekt „Jerobeam und ganz Israel“ idiomatisch den Plural.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jerobeam und ganz Israel
  rationale: „Ganz Israel“ bewahrt die nationale und gemeinschaftliche Ausdrucksweise des hebräischen Textes, statt sie auf „alle Israeliten“ zu verengen.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: sprachen zu Rehabeam
  rationale: דבר אל wird in einem würdigen, modernen Erzählregister unmittelbar mit „zu jemandem sprechen“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die direkte Rede im folgenden Vers ein. Im natürlichen Deutschen erfüllt der Doppelpunkt dieselbe Diskursfunktion besser als das schwerfällige „indem sie sagten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Ellipse bei „senden“ und der Ausdruck „ganz Israel“ bleiben erhalten; der Übergang zur direkten Rede wird idiomatisch durch einen Doppelpunkt markiert.
