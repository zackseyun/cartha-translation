  source_fidelity: Die Abfolge „sie sandten“ und „sie riefen ihn herbei“ gibt die beiden hebräischen Verben וַיִּשְׁלְחוּ und וַיִּקְרְאוּ לוֹ unmittelbar wieder. Das Objekt zu „sandten“ bleibt, wie im Hebräischen, unausgedrückt. „Jerobeam und ganz Israel“ sowie der Übergang zur folgenden direkten Rede sind sachgerecht.
  naturalness: „Da schickten sie hin“ ist im erzählenden Register möglich, doch „ließen ihn rufen“ macht aus dem aktiven „sie riefen ihn herbei“ eine Veranlassungskonstruktion und ist weniger unmittelbar. „Riefen ihn herbei“ ist modernes, natürliches Standarddeutsch und bewahrt die aktive Aussage.
  terminology: Die Namensformen Jerobeam und Rehabeam entsprechen dem üblichen deutschen Bibelgebrauch. „Ganz Israel“ erhält die kollektive nationale Bezeichnung des Hebräischen, ohne sie auf einzelne Israeliten einzuengen.
