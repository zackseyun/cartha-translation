base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: de
  text: 'Dann gingen sie zu König Hiskia hinein und sagten: »Wir haben das ganze Haus Jahwes gereinigt, den Brandopferaltar mit all seinen Geräten und den Tisch für die aufgeschichteten Brote[a] mit all seinen Geräten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »Schaubrottisch«; gemeint ist der Tisch für die Brote, die vor Jahwe geordnet aufgelegt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: hinein
  rationale: Das Richtungsadverb bezeichnet eine Bewegung nach innen; zusammen mit »zu König Hiskia« ist »gingen … hinein« im Deutschen natürlich und wahrt den räumlichen Sinn.
- source_word: טִהַרְנוּ
  choice: wir haben … gereinigt
  rationale: Im Tempelzusammenhang bezeichnet das Verb kultische Reinigung. Das Perfekt gibt den abgeschlossenen Vorgang mit gegenwärtigem Ergebnis passend wieder.
- source_word: בֵּית יְהוָה
  choice: das ganze Haus Jahwes
  rationale: »Haus« bewahrt die konkrete hebräische Bezeichnung des Heiligtums; »Tempel« wäre verständlicher, aber weniger formnah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH; »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִזְבַּח הָעוֹלָה
  choice: der Brandopferaltar
  rationale: Die etablierte deutsche Zusammensetzung bezeichnet knapp und eindeutig den Altar für Ganzbrandopfer.
- source_word: כֵּלָיו
  choice: seine Geräte
  rationale: כֵּלִים umfasst die für den kultischen Dienst bestimmten Gefäße und Gerätschaften; »Geräte« ist hier breit genug und gut verständlich.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: der Tisch für die aufgeschichteten Brote
  rationale: מַעֲרֶכֶת bezeichnet die geordnete Aufschichtung beziehungsweise Anordnung. Die Ergänzung »Brote« macht den kultischen Gegenstand im Kontext verständlich, ohne den traditionellen Fachausdruck unkommentiert zu verwenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen ausdrücklich. »Jahwe« bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Bezeichnung des Brottisches שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: Tisch für die aufgeschichteten Brote
  alternative: Schaubrottisch
  rationale: Die gewählte Fassung bildet das geordnete Aufschichten ab und ist für heutige Leser transparenter. Die traditionelle Benennung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Aufzählung, wird aber durch »mit all seinen Geräten« idiomatisch gegliedert. Der kultische Sinn bleibt erhalten, ohne unnötig altertümliche Fachsprache.
