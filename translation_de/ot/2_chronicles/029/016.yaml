  source_fidelity: 'Der Entwurf gibt die Abfolge und die räumliche Bewegung des hebräischen Textes zutreffend wieder: Priester reinigen die inneren Bereiche, bringen das Unreine in den Vorhof, und die Leviten übernehmen es zum Abtransport zum Kidrontal außerhalb. „Bach Kidron“ ist für נחל קדרון im Kontext eine vertretbare traditionelle Wiedergabe. Das ergänzende „dort“ hat jedoch keine ausdrückliche Entsprechung und ist für das Verständnis nicht nötig.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch und gut lesbar. Die Wiederholung von „Haus des HERRN“ entspricht der Vorlage. Ohne „dort“ bleibt der letzte Satz ebenso natürlich und etwas präziser.
  terminology: „HERR“ markiert den Gottesnamen angemessen. „Alles Unreine“ bewahrt die konkrete und zugleich kultisch geprägte Offenheit von כָּל הַטֻּמְאָה. „Tempel“ für הֵיכָל und „Haus des HERRN“ für בֵּית־יְהוָה bilden eine nachvollziehbare, quellentreue Unterscheidung.
