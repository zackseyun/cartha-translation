  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: de
  text: Da gingen die Priester in das Innere des Hauses des HERRN, um es zu reinigen. Alles Unreine, das sie im Tempel des HERRN fanden, brachten sie in den Vorhof des Hauses des HERRN hinaus. Die Leviten nahmen es entgegen und trugen es nach draußen zum Bach Kidron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: in das Innere des Hauses des HERRN
  rationale: לִפְנִימָה bezeichnet die inneren Bereiche des Heiligtums; die Formulierung bleibt räumlich offen und fügt keine genauere Kultzone hinzu.
- source_word: לְטַהֵר
  choice: um es zu reinigen
  rationale: Der Infinitiv bezeichnet den Zweck des Hineingehens; das Pronomen bezieht sich natürlich auf das Haus des HERRN.
- source_word: כָּל הַטֻּמְאָה
  choice: alles Unreine
  rationale: Das kollektive Abstraktum bezeichnet hier konkret das, was als unrein aus dem Tempel entfernt wurde. „Unreinheit“ wäre möglich, klingt im Deutschen in diesem Handlungskontext jedoch weniger natürlich.
- source_word: הֵיכַל יְהוָה
  choice: Tempel des HERRN
  rationale: הֵיכָל bezeichnet hier das Tempelgebäude beziehungsweise dessen heiligen Innenbereich; „Tempel“ ist im modernen Deutschen klar und kontextgerecht.
- source_word: וַיְקַבְּלוּ
  choice: nahmen es dort entgegen
  rationale: Das Verb beschreibt die Übernahme des herausgebrachten Materials durch die Leviten; „dort“ verdeutlicht ohne sachliche Erweiterung den zuvor genannten Vorhof als Übergabepunkt.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: nach draußen zum Bach Kidron
  rationale: נַחַל kann Bach oder Wadi/Tal bezeichnen. Im Jerusalemer Kontext ist „Bach Kidron“ eine geläufige und textnahe Wiedergabe; חוּצָה wird ausdrücklich mit „nach draußen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die erkennbare Besonderheit des Gottesnamens, ohne eine unsichere Aussprache festzulegen.
- issue: Art der Verunreinigung im Tempel
  choice: alles Unreine
  alternative: alle Unreinheit / aller Unrat
  rationale: Der hebräische Ausdruck kann kultische Unreinheit und konkret verunreinigende Gegenstände umfassen. „Alles Unreine“ bewahrt diese Spannung, während „Unrat“ die Bedeutung unnötig auf Abfall verengt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Satzgliederung. „Haus des HERRN“ bleibt als wiederkehrende hebräische Bezeichnung erhalten; הֵיכָל wird zur sinnvollen lexikalischen Unterscheidung mit „Tempel“ wiedergegeben.
