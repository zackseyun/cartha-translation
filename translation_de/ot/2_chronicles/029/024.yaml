base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: de
  text: Die Priester schlachteten sie und brachten ihr Blut an den Altar[a], um für ganz Israel Sühne zu erwirken; denn der König hatte bestimmt, dass das Brandopfer und das Sündopfer[b] für ganz Israel bestimmt waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und reinigten den Altar mit ihrem Blut“. Das hebräische Verb kann den Vollzug eines Reinigungs- oder Sündopferritus bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reinigungsopfer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: sie schlachteten sie
  rationale: שׁחט bezeichnet im Opferkontext das Schlachten von Opfertieren; das Objektsuffix verweist auf die Böcke aus dem vorherigen Vers.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: brachten ihr Blut an den Altar
  rationale: Die Form von חטא bezeichnet hier einen Reinigungs- beziehungsweise Sündopferritus mit dem Blut. Die Formulierung gibt die konkrete rituelle Handlung wieder, ohne das Blut selbst als Opfer zu bezeichnen.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: כפר bezeichnet im Opferzusammenhang das Vollziehen von Sühne. Die deutsche Wendung bewahrt den theologischen und rituellen Gehalt.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: für ganz Israel
  rationale: עַל bezeichnet hier diejenigen, zu deren Gunsten die Sühne vollzogen wird.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung dafür ein, dass die Opfer ganz Israel gelten.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: der König hatte angeordnet, dass … für ganz Israel bestimmt waren
  rationale: Das knappe hebräische אָמַר kann hier im königlichen Kontext eine Anordnung ausdrücken. Die deutsche Satzform macht die rückblickende Begründung und den Geltungsbereich der Opfer natürlich verständlich.
- source_word: הָעוֹלָה
  choice: das Brandopfer
  rationale: Brandopfer ist die etablierte und sachgerechte Wiedergabe des Opferbegriffs עוֹלָה.
- source_word: וְהַחַטָּאת
  choice: und das Sündopfer
  rationale: חַטָּאת bezeichnet im vorliegenden Opferkontext das Sündopfer; die mögliche Betonung der Reinigung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von חטא/חטאת im Opferritus
  choice: Im Haupttext steht „Sündopfer“; die Bluthandlung wird konkret als „brachten ihr Blut an den Altar“ wiedergegeben.
  alternative: „Reinigungsopfer“ beziehungsweise „reinigten den Altar durch ihr Blut“
  rationale: Der traditionelle Begriff „Sündopfer“ ist verständlich und passt zum Opferkontext. Zugleich kann die Wortgruppe den Aspekt ritueller Reinigung hervorheben; diese echte Bedeutungsbreite wird in den Fußnoten offengehalten.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: entsühnen; Reinigung bewirken
  rationale: Die Wiedergabe erhält den kultischen und theologischen Sinn, ohne genauer festzulegen, auf welche Weise die Sühne wirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufigen Opferbegriffe „Brandopfer“, „Sündopfer“ und „Sühne“ bleiben erhalten; mögliche kultische Reinigungsnuancen werden durch Fußnoten sichtbar gemacht.
