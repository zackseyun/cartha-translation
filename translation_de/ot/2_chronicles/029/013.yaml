base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: de
  text: 'und von den Söhnen Elizafans[a]: Schimri und Jeuel[b]; und von den Söhnen Asafs: Sacharja und Mattanja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann hier auch Nachkommen oder Angehörige einer Sippe bezeichnen, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Name lautet hier Jeuel; ähnlich geschriebene Namen werden an anderen Stellen etwa als Jeïel wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: und von
  rationale: Die Verbindung aus ו und מן setzt die Aufzählung des vorangehenden Satzes fort; „und von“ bewahrt diese Listenstruktur.
- source_word: בְּנֵי
  choice: den Söhnen
  rationale: Die Grundbedeutung lautet „Söhne“. In einer genealogischen Liste kann der Ausdruck auch Nachkommen oder Angehörige einer Sippe bezeichnen; diese Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Der Personenname wird in einer im Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: שִׁמְרִי
  choice: Schimri
  rationale: Deutsche, am hebräischen Namen orientierte Umschrift.
- source_word: יעואל
  choice: Jëuel
  rationale: Die Konsonantenfolge stützt Jëuel und wird von ähnlich geschriebenen Namen wie Jëïel unterschieden.
- source_word: בְּנֵי אָסָף
  choice: den Söhnen Asafs
  rationale: Die genealogische beziehungsweise gruppenbezogene Wendung wird formal bewahrt; Asaf bezeichnet den Ahnherrn oder Leiter der Sängergruppe.
- source_word: זְכַרְיָהוּ
  choice: Secharja
  rationale: Im modernen deutschen Bibelgebrauch geläufige Form des hebräischen Personennamens.
- source_word: מַתַּנְיָהוּ
  choice: Mattanja
  rationale: Im Deutschen gebräuchliche, am Hebräischen orientierte Namensform.
theological_decisions: []
