base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: de
  text: Hiskia freute sich, ebenso das ganze Volk, über das, was Gott für das Volk vorbereitet hatte[a]; denn die Sache war plötzlich zustande gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… über Gottes Vorkehrungen für das Volk.“ Das Hebräische nennt nicht, was Gott vorbereitet hatte; die Wendung kann auch im Sinn von „für das Volk etwas bereitgemacht“ verstanden werden.'
    reason: Das nicht ausgedrückte Objekt von הֵכִין und die Bedeutung von לָעָם als Bezug auf das Volk werden transparent gemacht, ohne die Mehrdeutigkeit dogmatisch oder syntaktisch zu verengen.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: freuten sich
  rationale: שׂמח bezeichnet Freude oder Frohsein. Der Plural nimmt im Deutschen natürlich sowohl Hiskia als auch das ganze Volk als Subjekt auf.
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: Der Name wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet hier die versammelte Gemeinschaft Israels; „das ganze Volk“ ist idiomatisch und bewahrt den umfassenden Ausdruck.
- source_word: עַל
  choice: darüber
  rationale: Nach שׂמח bezeichnet עַל den Anlass der Freude. „Darüber“ bewahrt den Bezug auf das folgende Geschehen natürlicher als eine rein kausale Wiedergabe.
- source_word: הֵכִין
  choice: vorbereitet hatte
  rationale: Das Hifil von כון kann „vorbereiten“, „bereit machen“ oder „fest gründen“ bedeuten. Im Zusammenhang der rasch wiederhergestellten Gottesverehrung passt „vorbereiten“ am besten.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Gemeint ist hier der Gott Israels; die übliche deutsche Wiedergabe ist „Gott“.
- source_word: לָעָם
  choice: für das Volk
  rationale: Die Präposition ל bezeichnet hier am ehesten den Begünstigten. Diese Wiedergabe vermeidet die nicht zwingende Deutung, das Volk selbst sei das unmittelbare Objekt des Vorbereitens.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet eine Erklärung für die Freude ein; „denn“ entspricht dieser Funktion im deutschen Erzählstil.
- source_word: בְּפִתְאֹם
  choice: ganz plötzlich
  rationale: Das Adverb bezeichnet ein unerwartet rasches Eintreten. „Ganz plötzlich“ gibt die Nachdrücklichkeit natürlich wieder.
- source_word: הָיָה הַדָּבָר
  choice: dies war … geschehen
  rationale: דָּבָר bezeichnet allgemein die Sache oder das Geschehen. Das deutsche „dies“ verweist flüssig auf die gesamte zuvor geschilderte Wiederherstellung, ohne sie enger festzulegen.
theological_decisions:
- issue: Göttliches Handeln bei der Vorbereitung
  choice: was Gott für das Volk vorbereitet hatte
  alternative: dass Gott das Volk bereit gemacht hatte; dass Gott dies für das Volk gefestigt hatte
  rationale: Der hebräische Ausdruck nennt nach הֵכִין kein ausdrückliches Objekt und kann eine Vorbereitung zugunsten des Volkes, die Bereitung des Volkes selbst oder ein göttliches Festigen des Geschehens bezeichnen. Der Haupttext folgt der Präposition ל als Kennzeichnung des Begünstigten; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Satzstruktur folgt dem Hebräischen, wird aber durch „darüber, was …“ und „dies war … geschehen“ in natürliches Standarddeutsch überführt. Die semantische Offenheit von הֵכִין … לָעָם wird im Haupttext nicht unnötig auf die innere Bereitschaft des Volkes verengt und in der Fußnote ausdrücklich bewahrt.
