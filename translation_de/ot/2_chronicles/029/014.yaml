lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Das vorangestellte ו verbindet den Vers mit der vorausgehenden Aufzählung; „Und von“ bewahrt diesen fortlaufenden, ergänzenden Charakter.
- source_word: בְּנֵי
  choice: den Söhnen
  rationale: Die direkte Wiedergabe passt zur genealogischen Listenform; im Zusammenhang kann der Ausdruck zugleich Angehörige einer Familien- oder Sängerlinie bezeichnen.
- source_word: הֵימָן
  choice: Heman
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: יחואל
  choice: Jehiël
  rationale: Der Personenname wird in einer etablierten deutschen Bibelnamenform wiedergegeben; abweichende Umschriften sind möglich.
- source_word: וְשִׁמְעִי
  choice: und Schimi
  rationale: Die Konjunktion bleibt zur Wahrung der Listenstruktur erhalten; „Schimi“ ist eine gebräuchliche deutsche Bibelnamenform.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Der Personenname wird in der im Deutschen üblichen Form transliteriert.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: „Schemaja“ ist die geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: וְעֻזִּיאֵל
  choice: und Usiël
  rationale: Die Konjunktion des letzten Listeneintrags wird beibehalten; „Usiël“ entspricht einer üblichen deutschen Bibelnamenform.
