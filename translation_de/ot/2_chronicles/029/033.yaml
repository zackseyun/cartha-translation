  text: And the consecrated offerings were six hundred cattle and three thousand sheep[a][b].
translation:
  language: de
  text: Die geweihten Gaben umfassten 600 Rinder und 3.000 Stück Kleinvieh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die heiligen Dinge«; gemeint sind Tiere, die als heilige Opfergaben ausgesondert waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Kleinvieh und kann sowohl Schafe als auch Ziegen einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: Die geweihten Gaben
  rationale: Der substantivierte Plural bezeichnet hier die für den heiligen Opferdienst ausgesonderten Tiere. »Geweihte Gaben« ist verständlich und wahrt den kultischen Bezug, ohne abstrakt von »heiligen Dingen« zu sprechen.
- source_word: בָּקָר
  choice: Rinder
  rationale: Das hebräische Kollektiv bezeichnet Rindvieh, ohne Geschlecht oder Verwendung der Tiere näher festzulegen.
- source_word: שֵׁשׁ מֵאוֹת
  choice: '600'
  rationale: Direkte Wiedergabe der Kardinalzahl in einer übersichtlichen Bestandsangabe.
- source_word: וְצֹאן
  choice: und 3.000 Schafe und Ziegen
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh und kann sowohl Schafe als auch Ziegen umfassen. Die Doppelnennung gibt den Umfang im Deutschen natürlicher und genauer wieder als »Schafe« allein.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: '3.000'
  rationale: Direkte Wiedergabe der Kardinalzahl nach deutscher Schreibkonvention.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Umfassten« verbindet die Sammelbezeichnung idiomatisch mit der anschließenden Aufzählung. Die Zahlen erscheinen zur guten Lesbarkeit als Ziffern.
