id: 2CH.29.9
reference: 2 Chronicles 29:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: de
  text: 'Und seht: Unsere Väter sind durch das Schwert gefallen, und unsere Söhne, unsere Töchter und unsere Frauen sind deshalb in Gefangenschaft.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 'Und seht:'
  rationale: Die aufmerksamkeitslenkende und emphatische Funktion wird in natürlichem modernem Deutsch bewahrt; der einleitende Anschluss וְ bleibt durch „Und“ erhalten.
- source_word: נָפְלוּ
  choice: sind ... gefallen
  rationale: Bewahrt das hebräische Bild des Fallens und bezeichnet im Zusammenhang würdevoll den Tod durch Waffengewalt.
- source_word: אֲבוֹתֵינוּ
  choice: unsere Väter
  rationale: Gibt den ausdrücklich männlichen Verwandtschaftsbegriff wieder, statt ihn zum allgemeineren „Vorfahren“ zu verallgemeinern.
- source_word: בֶּחָרֶב
  choice: durch das Schwert
  rationale: Entspricht der hebräischen Wendung für gewaltsamen Tod durch das Schwert, ohne sie auf den allgemeineren Begriff „im Kampf“ zu reduzieren.
- source_word: וּבָנֵינוּ וּבְנוֹתֵינוּ
  choice: unsere Söhne, unsere Töchter
  rationale: Erhält die im Hebräischen ausdrücklich unterschiedenen Familiengruppen.
- source_word: וְנָשֵׁינוּ
  choice: unsere Frauen
  rationale: Im familiären Zusammenhang sind Ehefrauen gemeint; „unsere Frauen“ ist dafür eine natürliche deutsche Bezeichnung und wahrt zugleich den möglichen weiteren lexikalischen Umfang von נָשִׁים.
- source_word: בַּשְּׁבִי
  choice: sind ... in Gefangenschaft
  rationale: Gibt die nominale Zustandsangabe des Hebräischen direkt und idiomatisch wieder.
- source_word: עַל זֹאת
  choice: deshalb
  rationale: Drückt knapp und klar die Rückverweisung auf das zuvor geschilderte Fehlverhalten als Ursache aus.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbegriffe im Gerichtszusammenhang
  choice: unsere Väter ... unsere Söhne, unsere Töchter und unsere Frauen
  alternative: unsere Vorfahren ... unsere Kinder und unsere Frauen
  rationale: Die einzelnen, geschlechtlich bestimmten Familiengruppen des hebräischen Textes werden nicht zu neutralen Sammelbegriffen eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Seht“ trägt die emphatische Aufforderung natürlicher als das heute altertümliche „siehe“. Die Reihung bleibt nahe an der hebräischen Satzstruktur, wird aber durch deutsche Zeichensetzung lesbar gegliedert.
