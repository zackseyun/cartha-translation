  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des Hebräischen präzise wieder: die anschließende emphatische Aufmerksamkeitspartikel („Und seht“), den Kriegsverlust der Väter „durch das Schwert“, die einzeln genannten Söhne, Töchter und Frauen sowie den Zustand der Gefangenschaft als Folge des zuvor genannten Sachverhalts. „Deshalb“ gibt עַל־זֹאת angemessen kausal wieder, ohne den Bezug unnötig zu spezifizieren.'
  naturalness: Modernes, würdevolles Standarddeutsch. „Und seht:“ ist als aufmerksamkeitslenkende Einleitung verständlich und angemessen; die Aufzählung ist klar gegliedert und der Satz liest sich idiomatisch.
  terminology: „Väter“, „Söhne“, „Töchter“ und „Frauen“ bewahren die im Hebräischen differenzierten Familienbezeichnungen. „Unsere Frauen“ ist im Kontext natürlich als Ehefrauen zu verstehen, ohne einen über den Wortlaut hinausgehenden Sachverhalt einzutragen. „In Gefangenschaft“ entspricht בַּשְּׁבִי treffend.
