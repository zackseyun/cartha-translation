  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die gegenwärtige Entschließung (עתה), die idiomatische innere Absicht (עם לבבי), den Bundesschluss mit Jahwe, die Gottesbezeichnung, sowie die angestrebte Abwendung von Jahwes glühendem Zorn von „uns“. Die Finalübersetzung mit „damit“ ist als idiomatische Wiedergabe der im Kontext erhofften Folge von וְיָשֹׁב vertretbar und behauptet keine stärkere Kausalität als der Text.'
