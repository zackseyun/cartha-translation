id: 2CH.29.10
reference: 2 Chronicles 29:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: de
  text: Nun ist es mein Herzensentschluss, mit Jahwe, dem Gott Israels, einen Bund zu schließen[a], damit sich die Glut seines Zorns von uns abwendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Bund schneiden“.'
    reason: Das hebräische Idiom כרת ברית verwendet das Verb „schneiden“; die Fußnote bewahrt dieses konkrete Bild neben der geläufigen deutschen Wendung.
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Das temporale Adverb kennzeichnet den gegenwärtigen, folgerichtigen Entschluss Hiskias; „Nun“ ist knapp und würdevoll.
- source_word: עִם לְבָבִי
  choice: ist es mein Herzensentschluss
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet eine im Inneren gefasste Absicht. „Herzensentschluss“ bewahrt das Bild des Herzens und macht die beabsichtigte Entschlossenheit im Deutschen deutlich.
- source_word: לִכְרֹת בְּרִית
  choice: einen Bund zu schließen
  rationale: Die übliche deutsche Wendung „einen Bund schließen“ gibt das hebräische Idiom natürlich wieder; dessen wörtliches Bild „einen Bund schneiden“ wird in der Fußnote erhalten.
- source_word: לַיהוָה
  choice: mit Jahwe
  rationale: Das ל kennzeichnet hier den Bundespartner. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Direkte Wiedergabe des Titels; die Apposition bezeichnet Jahwe als den Gott Israels.
- source_word: וְיָשֹׁב
  choice: damit sich ... abwendet
  rationale: Im Zusammenhang bezeichnet die Verbform die erhoffte Folge beziehungsweise den Zweck des Bundesschlusses. „Sich abwenden“ ist bei Zorn natürliches Deutsch.
- source_word: מִמֶּנּוּ
  choice: von uns
  rationale: Die Präposition mit dem Suffix der ersten Person Plural bezeichnet diejenigen, von denen der Zorn abgewendet werden soll.
- source_word: חֲרוֹן אַפּוֹ
  choice: die Glut seines Zorns
  rationale: Die Formulierung bewahrt die hebräische Hitze-Metaphorik und die Intensität des göttlichen Zorns, ohne sie auf das allgemeinere „Zorn“ zu verkürzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Ziel oder bloße Folge des Bundesschlusses
  choice: damit sich die Glut seines Zorns von uns abwendet
  alternative: und die Glut seines Zorns wird sich von uns abwenden
  rationale: Das mit וְ eingeleitete Verb kann eine Folge ausdrücken; im Zusammenhang liegt eine beabsichtigte beziehungsweise erhoffte Folge nahe. „Damit“ gibt diese Beziehung wieder, ohne zu behaupten, der Bundesschluss bewirke sie mechanisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Herzensentschluss“ ist bewusst leicht gehoben, um das hebräische Herzbild und die feste innere Absicht zugleich zu erhalten; Satzbau und übrige Wortwahl bleiben allgemein verständlich.
