  text: וַ/יָּבֵ֥א אֶת הַ/כֹּהֲנִ֖ים וְ/אֶת הַ/לְוִיִּ֑ם וַ/יַּֽאַסְפֵ֖/ם לִ/רְח֥וֹב הַ/מִּזְרָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/004.yaml
  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: de
  text: Dann ließ er die Priester und die Leviten kommen und versammelte sie auf dem östlichen Platz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Platz an der Ostseite“.'
    reason: Die hebräische Verbindung kann entweder einen als „östlich“ bezeichneten Platz oder einen Platz auf der Ostseite meinen.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Dann ließ er … kommen
  rationale: Der Hifil des Verbs בוא bezeichnet das Veranlassen des Kommens. Diese Wiedergabe ist im Deutschen natürlich und bewahrt gegenüber einem bloßen „brachte“ die kausative Form; „Dann“ gibt den erzählerischen Fortgang wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgemäße Wiedergabe von כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche Bezeichnung der levitischen Tempeldiener, die hier von den Priestern unterschieden werden.
- source_word: וַיַּאַסְפֵם
  choice: versammelte sie
  rationale: אסף mit Suffix bedeutet hier, Personen zusammenzubringen; „versammelte“ passt zum öffentlichen und geordneten Vorgang.
- source_word: לִרְחוֹב
  choice: auf dem … Platz
  rationale: רְחוֹב bezeichnet eine breite, offene Fläche beziehungsweise einen Platz, nicht notwendig eine Straße. Die Präposition wird idiomatisch als „auf“ wiedergegeben.
- source_word: הַמִּזְרָח
  choice: östlichen
  rationale: מִזְרָח bezeichnet den Osten beziehungsweise die östliche Lage. „Der östliche Platz“ ist eine mögliche knappe Verbindung; die alternative räumliche Zuordnung wird in der Fußnote bewahrt.
theological_decisions: []
