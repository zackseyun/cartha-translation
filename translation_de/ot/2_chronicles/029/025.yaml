source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: de
  text: Er stellte die Leviten im Haus Jahwes auf, mit Zimbeln, Harfen und Leiern, nach der Anordnung Davids, Gads, des Sehers[a] des Königs, und Nathans, des Propheten. Denn die Anordnung kam von Jahwe durch seine Propheten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seher“ gibt hier das hebräische חֹזֶה wieder, eine Amtsbezeichnung, die mit „Prophet“ verwandt, aber nicht identisch ist.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Denn durch die Hand Jahwes erging die Anordnung, durch die Hand seiner Propheten.“'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Er stellte ... auf
  rationale: Der Hifil von עמד bezeichnet hier, dass Hiskia die Leviten für ihren liturgischen Dienst an ihren Platz stellte. „Aufstellen“ gibt sowohl die Platzierung als auch die geordnete Funktion natürlich wieder.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: Die formale Wendung „Haus Jahwes“ bewahrt das hebräische Bild; „Tempel“ wäre verständlich, aber weniger quellennah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּמְצִלְתַּיִם בִּנְבָלִים וּבְכִנֹּרוֹת
  choice: mit Zimbeln, Harfen und Leiern
  rationale: Das instrumentale ב wird mit „mit“ wiedergegeben. „Harfen“ und „Leiern“ unterscheiden die beiden im Hebräischen genannten Arten von Saiteninstrumenten, deren genaue moderne Entsprechung unsicher ist.
- source_word: בְּמִצְוַת
  choice: nach der Anordnung
  rationale: „Anordnung“ bezeichnet hier die verbindliche Weisung für die gottesdienstliche Ordnung. Es klingt im Deutschen natürlicher als die wiederholte Formulierung „nach dem Gebot“, ohne den verpflichtenden Charakter abzuschwächen.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: Gad, des Sehers des Königs
  rationale: „Seher“ bewahrt den besonderen Titel חֹזֶה und unterscheidet ihn von נָבִיא, „Prophet“. Der Genitiv gibt Gads Verhältnis zum König genau wieder.
- source_word: נָתָן הַנָּבִיא
  choice: des Propheten Nathan
  rationale: Die appositionelle Amtsbezeichnung wird klar und idiomatisch wiedergegeben.
- source_word: כִּי
  choice: Denn
  rationale: 'כִּי leitet hier die Begründung ein: Die zuvor genannte Anordnung hatte ihren letzten Ursprung bei Jahwe.'
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: kam von Jahwe durch seine Propheten
  rationale: Die zweimalige Wendung „durch die Hand“ bezeichnet Ursprung und Vermittlung. Die deutsche Formulierung gibt beides verständlich wieder, während eine Fußnote die wörtliche Bildsprache festhält.
theological_decisions:
- issue: Verhältnis zwischen der davidischen Gottesdienstordnung und göttlicher Autorität
  choice: Die musikalische Ordnung geht letztlich auf Jahwe zurück und wurde durch seine Propheten vermittelt.
  alternative: Sie war lediglich eine königliche Anordnung Davids, der erst nachträglich göttliche Autorität zugeschrieben wurde.
  rationale: Der begründende Schlusssatz erklärt ausdrücklich, dass die Anordnung von Jahwe und durch seine Propheten kam. Die Übersetzung wahrt sowohl die menschliche als auch die göttliche Handlungsebene.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird jedoch zur besseren Lesbarkeit in zwei Sätze gegliedert. Die Instrumentenbezeichnungen sind geläufig, wobei die historische Identifikation der Saiteninstrumente nicht als völlig sicher vorausgesetzt wird.
