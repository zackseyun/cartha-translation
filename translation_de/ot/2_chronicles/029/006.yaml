source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: de
  text: Denn unsere Väter handelten treulos[a] und taten, was in den Augen Yahwehs, unseres Gottes, böse war. Sie verließen ihn, wandten ihre Gesichter von der Wohnstätte Yahwehs ab[b] und kehrten ihr den Rücken zu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begingen einen Treuebruch“ oder „handelten untreu“. Das hebräische Verb bezeichnet häufig Untreue in einem Bundes- oder Heiligtumskontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von der Wohnstätte Yahwehs“. Gemeint ist hier der Tempel als Wohnstätte Yahwehs; das hebräische Wort kann auch das Stiftszelt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „gaben den Nacken“. Die hebräische Redewendung beschreibt eine trotzige oder rebellische Abkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: handelten treulos
  rationale: Das Verb מעל bezeichnet einen Treuebruch, häufig mit bundesbezogenen oder kultischen Untertönen. „Handelten treulos“ gibt diesen aktiven Sinn in natürlichem modernem Deutsch wieder.
- source_word: הָרַע
  choice: was böse war
  rationale: In Verbindung mit עשה bedeutet die feste Wendung „tun, was böse ist“. Die Formulierung bewahrt die moralische Wertung des hebräischen Textes.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Yahwehs
  rationale: Die geläufige hebräische Metapher wird transparent und nahezu formal entsprechend wiedergegeben.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעַזְבֻהוּ
  choice: Sie verließen ihn
  rationale: עזב bezeichnet hier die religiöse und relationale Abkehr von Gott. „Verließen“ ist klar und gegenwärtig, ohne altertümlich zu wirken.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: wandten ihr Gesicht … ab
  rationale: Die Übersetzung bewahrt das konkrete Bild des abgewandten Gesichts und gibt die Richtung im Deutschen idiomatisch wieder.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: von der Wohnstätte Yahwehs
  rationale: מִשְׁכָּן bezeichnet wörtlich eine Wohnstätte. Im Zusammenhang der Tempelreinigung ist der Tempel als Wohnstätte Yahwehs gemeint; „Stiftszelt“ wäre hier missverständlich.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: kehrten ihr den Rücken zu
  rationale: Die hebräische Wendung lautet wörtlich „den Nacken geben“ und bezeichnet eine demonstrative, widersetzliche Abkehr. Die deutsche Wendung bewahrt das Körperbild und seinen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der Text verwendet den Gottesnamen selbst. „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von מִשְׁכָּן im Tempelkontext
  choice: Wohnstätte Yahwehs
  alternative: Stiftszelt Yahwehs / Heiligtum Yahwehs
  rationale: „Wohnstätte“ erhält den lexikalischen und theologischen Gedanken, dass Yahweh dort wohnt, ohne im Kontext der Tempelreinigung fälschlich ausschließlich an das Wüstenheiligtum denken zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Körperbilder von Gesicht und Rücken bleiben erhalten. „Väter“ wurde als geschichtlich-familiäre Bezeichnung des Ausgangstextes beibehalten; die Satzgliederung in zwei Sätze verbessert die Lesbarkeit, ohne die Begründungsfunktion von כִּי („Denn“) aufzugeben.
