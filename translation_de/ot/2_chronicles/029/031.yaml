  to: 'Da ergriff Hiskia das Wort und sagte: »Nun habt ihr euch Jahwe geweiht.[a] Tretet heran und bringt Schlachtopfer und Dankopfer zum Haus Jahwes.« Da brachte die versammelte Gemeinde Schlachtopfer und Dankopfer, und alle, deren Herz dazu bereit war, brachten Brandopfer.'
