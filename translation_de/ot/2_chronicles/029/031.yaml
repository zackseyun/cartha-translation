  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: de
  text: 'Da ergriff Hiskia das Wort und sagte: »Nun habt ihr euch Jahwe geweiht.[a] Tretet heran und bringt Schlachtopfer und Dankopfer zum Haus Jahwes.« Da brachte die versammelte Gemeinde Schlachtopfer und Dankopfer, und alle, deren Herz dazu bereit war, brachten Brandopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Nun habt ihr eure Hand für Jahwe gefüllt«; eine hebräische Wendung für die Weihe oder Einsetzung zum heiligen Dienst.'
    reason: Das hebräische Idiom wäre bei rein wörtlicher Wiedergabe im Deutschen missverständlich; die Fußnote bewahrt seine Bildform.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Da ergriff Hiskia das Wort und sagte
  rationale: Die hebräische Erzählformel lautet wörtlich »antwortete und sagte«, kann aber auch ohne vorausgehende Frage eine Wortmeldung einleiten. »Ergriff das Wort« gibt dies im Deutschen natürlich wieder.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: habt ihr euch für Jahwe zum heiligen Dienst einsetzen lassen
  rationale: Die Wendung bedeutet wörtlich »die Hand füllen« und bezeichnet die Einsetzung beziehungsweise Weihe zum heiligen Dienst. Die gewählte Formulierung vermittelt den idiomatischen Sinn, während die Fußnote den Wortlaut bewahrt.
- source_word: גֹּשׁוּ
  choice: Tretet heran
  rationale: Bewahrt den kultischen Sinn des Sich-Näherns und klingt als Aufforderung würdig und natürlich.
- source_word: זְבָחִים
  choice: Schlachtopfer
  rationale: Bezeichnet Opfer, bei denen ein Tier geschlachtet wird, und unterscheidet sie präzise von den anschließend genannten Brandopfern.
- source_word: תוֹדוֹת
  choice: Dankopfer
  rationale: Gibt die kultische Opferart knapp und verständlich wieder.
- source_word: לְבֵית יְהוָה
  choice: zum Haus Jahwes
  rationale: Bewahrt das hebräische Bild »Haus Jahwes« statt es interpretierend durch »Tempel« zu ersetzen.
- source_word: הַקָּהָל
  choice: die versammelte Gemeinde
  rationale: Bezeichnet die zum Gottesdienst zusammengekommene Gemeinschaft; die Formulierung ist im heutigen Deutsch klarer als das isolierte »Versammlung«.
- source_word: כָל נְדִיב לֵב
  choice: alle, deren Herz dazu bereit war
  rationale: Bewahrt das hebräische Herzmotiv und drückt zugleich aus, dass die Brandopfer freiwillig dargebracht wurden.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Übliche und sachlich genaue Bezeichnung für das vollständig auf dem Altar verbrannte Opfer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, sodass sein Charakter als Gottes Bundesname sichtbar bleibt.
- issue: Deutung der Wendung מִלֵּאתֶם יֶדְכֶם
  choice: Einsetzung zum heiligen Dienst
  alternative: 'wörtlich: »ihr habt eure Hand für Jahwe gefüllt«'
  rationale: Im kultischen Zusammenhang ist dies eine feste Wendung für Weihe beziehungsweise Einsetzung. Die Übersetzung macht diesen Sinn verständlich, ohne eine bestimmte Amtsbezeichnung hinzuzufügen; die genuine Bildsprache steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe werden präzise, aber allgemein verständlich wiedergegeben. Die direkte Rede bleibt feierlich, ohne altertümliche Syntax.
