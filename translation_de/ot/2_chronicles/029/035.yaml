  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: de
  text: Auch Brandopfer gab es in großer Zahl, dazu die Fettstücke der Heilsopfer[a] und die Trankopfer für die Brandopfer. So wurde der Dienst im Haus Yahwehs geordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gemeinschaftsopfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die additive Verbindung zum vorausgehenden Zusammenhang in natürlichem Deutsch wieder.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der morphologische Singular wird kollektiv verstanden; die deutsche Form ist im Singular und Plural gleich und passt zu לָרֹב.
- source_word: לָרֹב
  choice: in großer Zahl
  rationale: Gibt die große Menge idiomatisch wieder und bezieht sich klar auf die Brandopfer.
- source_word: בְּחֶלְבֵי
  choice: dazu die Fettstücke
  rationale: Im Opferkontext bezeichnet חֵלֶב die für die Opferung bestimmten Fettanteile; 'dazu' gibt die begleitende Funktion der Präposition natürlich wieder.
- source_word: הַשְּׁלָמִים
  choice: Heilsopfer
  rationale: Bezeichnet die kultische Opferkategorie, ohne ihre Bedeutung auf Gemeinschaft allein zu verengen; eine geläufige deutsche Alternative wird in der Fußnote genannt.
- source_word: וּבַנְּסָכִים
  choice: und die Trankopfer
  rationale: Standardgemäße und verständliche Wiedergabe der ausgegossenen Flüssigkeitsopfer.
- source_word: לָעֹלָה
  choice: für die Brandopfer
  rationale: Drückt die Zuordnung der Trankopfer zu den kollektiv verstandenen Brandopfern aus.
- source_word: וַתִּכּוֹן
  choice: wurde ... geordnet
  rationale: כּוּן bezeichnet hier das Einrichten beziehungsweise Herstellen eines ordnungsgemäßen Zustands; die Formulierung vermeidet die stärkere, nicht ausdrücklich genannte Aussage einer Wiederherstellung.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: der Dienst im Haus Yahwehs
  rationale: Bewahrt den kultischen Sinn von עֲבוֹדָה und gibt die hebräische Genitivverbindung in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm ausdrücklich; die Umschrift bewahrt den Charakter als Gottesname.
- issue: Kultischer Ausdruck שְׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer
  rationale: '''Heilsopfer'' wahrt die traditionelle Opferkategorie und lässt die Bedeutungsbreite des hebräischen Ausdrucks offen; die mögliche Wiedergabe ''Gemeinschaftsopfer'' wird vermerkt.'
- issue: Bedeutung von וַתִּכּוֹן für den Tempeldienst
  choice: wurde geordnet
  alternative: wurde eingerichtet
  rationale: Die Übersetzung betont, dass der Dienst in einen festen, ordnungsgemäßen Zustand versetzt wurde, ohne eine über den Wortlaut hinausgehende institutionelle oder historische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe bleiben erkennbar, werden aber in einer flüssigen Satzstruktur dargeboten. Der Eigenname Yahweh wird im deutschen Genitiv verwendet.
