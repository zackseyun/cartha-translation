  edition: WLC
  text: וּ/כְ/כַלּ֖וֹת לְ/הַעֲל֑וֹת כָּרְע֗וּ הַ/מֶּ֛לֶךְ וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: de
  text: Als sie das Darbringen beendet hatten[a], gingen der König und alle, die bei ihm waren, auf die Knie und beteten an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Hinaufbringen“ oder „das Aufsteigenlassen“; im Opferzusammenhang ist das Darbringen des Opfers gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warfen sich nieder“. Das hebräische Verb kann die körperliche Gebärde ehrfürchtiger Unterwerfung und, besonders in diesem Tempelzusammenhang, Anbetung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּכְכַלּוֹת
  choice: Als sie … beendet hatten
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitivus constructus von כלה leitet einen temporalen Nebensatz ein. Die Wiedergabe bezeichnet natürlich und klar den Abschluss der vorausgehenden Handlung.
- source_word: לְהַעֲלוֹת
  choice: das Darbringen
  rationale: Der Hifil-Infinitiv von עלה bedeutet wörtlich „hinaufbringen/aufsteigen lassen“ und wird hier im Opferzusammenhang gebraucht. „Das Darbringen“ bewahrt den kultischen Sinn, ohne das im Vers nicht ausdrücklich genannte Objekt „Brandopfer“ einzufügen.
- source_word: כָּרְעוּ
  choice: gingen … auf die Knie
  rationale: כרע bezeichnet das Beugen der Knie beziehungsweise das Niederknien. Die Formulierung ist modernes, verständliches Deutsch und hält die Handlung vom folgenden Sich-Niederwerfen beziehungsweise Anbeten unterscheidbar.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וְכָל הַנִּמְצְאִים אִתּוֹ
  choice: und alle, die bei ihm waren
  rationale: Das Nifal-Partizip von מצא bezeichnet hier idiomatisch die Anwesenden. Die gewählte Formulierung ist im Deutschen natürlich und inhaltlich genau.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: und beteten an
  rationale: Die Verbform von שׁחה bezeichnet ein ehrfürchtiges Sich-Niederwerfen und in kultischem Zusammenhang Anbetung. „Beteten an“ gibt die religiöse Bedeutung wieder; die mögliche körperliche Bedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von שׁחה im kultischen Zusammenhang
  choice: beteten an
  alternative: warfen sich nieder / verneigten sich
  rationale: Der Tempel- und Opferzusammenhang zeigt, dass die Handlung Gottesverehrung ausdrückt. Zugleich bleibt die körperliche Bedeutung des hebräischen Verbs als mögliche Wiedergabe in der Fußnote sichtbar, statt die Spannung zwischen Gebärde und religiöser Bedeutung aufzulösen.
- issue: Nicht ausdrücklich genanntes Opferobjekt bei לְהַעֲלוֹת
  choice: das Darbringen
  alternative: das Brandopfer darbringen
  rationale: Der Zusammenhang bezieht sich auf das Brandopfer, doch der vorliegende hebräische Satz nennt das Objekt nicht erneut. Die Übersetzung macht die Opferhandlung verständlich, ohne „Brandopfer“ stillschweigend in den Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Darbringen“ hält den Opferbezug fest, ohne das im Satz nur vorausgesetzte Brandopfer ausdrücklich zu ergänzen. Die beiden aufeinanderfolgenden Verben werden als Niederknien und Anbeten unterschieden; die körperliche Alternative zum zweiten Verb bleibt in der Fußnote erhalten.
