source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: de
  text: 'Da erhoben sich die Leviten: Aus den Nachkommen Kehats[a] Mahat, Sohn Amasais, und Joel, Sohn Asarjas; aus den Nachkommen Meraris Kisch, Sohn Abdis, und Asarja, Sohn Jehallels; und aus den Gerschonitern[b] Joach, Sohn Simmas, und Eden, Sohn Joachs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Söhnen des Kehatiters“. Die genealogische Ausdrucksweise bezeichnet die genannten Männer als Angehörige beziehungsweise Vertreter dieser levitischen Sippe.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „von der gerschonitischen Sippe“. Im Hebräischen steht hier eine kollektiv gebrauchte Sippenbezeichnung statt der zuvor verwendeten Wendung „von den Söhnen/Nachkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da erhoben sich
  rationale: Das narrative Wayyiqtol von קום leitet die Reaktion auf den vorausgehenden Befehl ein. „Da erhoben sich“ ist würdevoll und bewahrt sowohl die zeitliche Folge als auch den Handlungsbeginn.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Übliche und klare deutsche Bezeichnung der hier handelnden Angehörigen Levis; der bestimmte Artikel wird wiedergegeben.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: von den Nachkommen Kehats
  rationale: Die wörtliche genealogische Wendung „von den Söhnen des Kehatiters“ wäre im heutigen Deutsch missverständlich und schwerfällig. „Nachkommen Kehats“ gibt die Clanzugehörigkeit der genannten Männer natürlich wieder.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: von den Nachkommen Meraris
  rationale: Die wiederholte genealogische Formel wird parallel wiedergegeben und ordnet die Genannten der Sippe Meraris zu.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: und von den Gerschonitern
  rationale: Das substantivierte Gentiliz im Singular mit Artikel ist kollektiv gebraucht. Der deutsche Plural bezeichnet die entsprechende levitische Sippe natürlich.
- source_word: בֶּן
  choice: der Sohn
  rationale: In dieser Namensliste ist die unmittelbare Bedeutung „Sohn“ sachgerecht; der Kontext verlangt keine Verallgemeinerung zu „Nachkomme“.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Mahat; Amasai; Joel; Asarja; Kisch; Abdi; Jehallel; Joach; Simma; Eden
  rationale: Die Personennamen werden nach geläufigen deutschen Bibelnamensformen transliteriert. Bei יְהַלֶּלְאֵל gibt „Jehallel“ die hebräische Form wieder, ohne den Namen zu übersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur der Aufzählung bleibt erkennbar, wird aber durch Doppelpunkte und Semikola lesbar gegliedert. Patronymika werden zur Vermeidung dichter Genitivketten mit „der Sohn“ ausgedrückt; die Sippenformeln werden als „Nachkommen“ natürlich und genealogisch präzise wiedergegeben.
