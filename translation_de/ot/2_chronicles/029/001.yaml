base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: de
  text: Hiskia war fünfundzwanzig Jahre alt, als er König wurde, und regierte neunundzwanzig Jahre in Jerusalem. Seine Mutter hieß Abija; sie war eine Tochter Secharjas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: מָלַךְ
  choice: als er König wurde
  rationale: Das erste Vorkommen bezeichnet im Kontext den Regierungsantritt; die deutsche Altersformel gibt dies natürlich wieder.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: war fünfundzwanzig Jahre alt
  rationale: Idiomatiskorrekte Wiedergabe der hebräischen Altersangabe.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: regierte neunundzwanzig Jahre
  rationale: Das zweite מָלַךְ beschreibt die Dauer seiner Königsherrschaft.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe als Sitz seiner Herrschaft.
- source_word: וְשֵׁם אִמּוֹ אֲבִיָּה
  choice: Seine Mutter hieß Abija
  rationale: Natürliche moderne deutsche Wiedergabe der hebräischen Namensformel.
- source_word: בַּת זְכַרְיָהוּ
  choice: sie war eine Tochter Secharjas
  rationale: Die genealogische Beziehung wird klar und idiomatisch ausgedrückt; die deutsche Genitivform vermeidet eine mögliche Verwechslung mit einem Beinamen.
