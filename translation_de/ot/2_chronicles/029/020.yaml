base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: de
  text: Da machte sich König Hiskia früh am Morgen auf, versammelte die Amtsträger der Stadt und ging zum Haus Jahwes hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: machte sich früh am Morgen auf
  rationale: Der Hifil von שׁכם bezeichnet hier frühes Aufstehen beziehungsweise frühes Tätigwerden. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt die zeitliche Aussage.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: König Hiskia
  rationale: Die hebräische Apposition wird im Deutschen idiomatisch als Titel vor dem Namen wiedergegeben; der Name folgt der geläufigen deutschen Form.
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אסף bedeutet in diesem Zusammenhang, Menschen zusammenzubringen. „Versammelte“ trifft den Vorgang präzise und in angemessenem Register.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: die führenden Männer der Stadt
  rationale: שׂרים bezeichnet hier die maßgeblichen städtischen Amtsträger oder Führungspersonen. „Führende Männer“ gibt ihre Leitungsstellung wieder, ohne erblichen Adel vorauszusetzen.
- source_word: וַיַּעַל
  choice: ging … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. Beim Weg zum Heiligtum gehört dieses Motiv ausdrücklich zur hebräischen Darstellung und wird daher bewahrt.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt sowohl das hebräische Bild als auch den im Ausgangstext ausdrücklich stehenden Gottesnamen; „Tempel“ wäre verständlicher, aber weniger formnah.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und das Motiv des Hinaufgehens bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
