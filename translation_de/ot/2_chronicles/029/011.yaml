id: 2CH.29.11
reference: 2 Chronicles 29:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: de
  text: Meine Söhne, seid jetzt nicht nachlässig[a]! Denn euch hat Jahwe erwählt, vor ihm zu stehen[b], ihm zu dienen, seine Diener zu sein und Räucherwerk darzubringen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „seid jetzt nicht säumig“ oder „lasst es jetzt nicht daran fehlen“.'
    reason: lexical_alternative
  - marker: b
    text: „Vor ihm stehen“ ist hier eine priesterliche Wendung für den Dienst in Gottes Gegenwart.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort kann das Darbringen von Räucherwerk oder allgemeiner das Aufsteigenlassen einer Opfergabe im Rauch bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Meine Söhne
  rationale: Die wörtliche Anrede mit maskulinem Plural und Suffix der 1. Person Singular passt zum unmittelbaren Kontext, in dem Hiskia Priester und Leviten anspricht.
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: seid jetzt nicht nachlässig
  rationale: Die Wendung mahnt davor, die anstehende kultische Pflicht nachlässig oder säumig zu behandeln. Die deutsche Formulierung ist gegenwärtig und erhält die Dringlichkeit von עַתָּה.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: euch hat Jahwe erwählt
  rationale: Die Voranstellung von „euch“ bildet die Hervorhebung des hebräischen בָכֶם ab; „erwählt“ gibt בחר in diesem Berufungskontext angemessen wieder.
- source_word: לַעֲמֹד לְפָנָיו
  choice: vor ihm zu stehen
  rationale: Die konkrete hebräische Wendung bleibt erhalten; im Zusammenhang bezeichnet sie den Dienst in Gottes Gegenwart.
- source_word: לְשָׁרְתוֹ
  choice: ihm zu dienen
  rationale: שרת bezeichnet hier den priesterlich-kultischen Dienst. „Dienen“ ist im Deutschen natürlich und trägt im Kontext die kultische Bedeutung.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: seine Diener zu sein und Räucherwerk darzubringen
  rationale: Die Formulierung gibt sowohl die beständige Dienstfunktion als auch die kultische Tätigkeit des קטר wieder. „Darbringen“ ist natürlicher und kultisch genauer als das bloß technische „verbrennen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von „vor ihm stehen“
  choice: Bildhafte priesterliche Wendung im Haupttext beibehalten
  alternative: vor ihm Dienst tun
  rationale: Die wörtliche Wendung ist verständlich und lässt sowohl das konkrete Stehen in Gottes Gegenwart als auch ihre kultische Dienstbedeutung bestehen; eine Fußnote erläutert den Kontext.
- issue: Bedeutungsumfang von מַקְטִרִים
  choice: Räucherwerk darzubringen
  alternative: Opfer in Rauch aufgehen zu lassen
  rationale: Die Wurzel kann das Aufsteigenlassen von Opfergaben im Rauch bezeichnen. Im Tempeldienst dieses Verses liegt Räucherwerk nahe, doch die Fußnote weist auf den weiteren möglichen Bedeutungsumfang hin.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede bleibt väterlich und eindringlich; der Ausruf nach der Mahnung gibt deren Dringlichkeit natürlich wieder. Kultische Fachsprache wird sparsam verwendet und bei Bedarf in den Fußnoten erläutert.
