source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: de
  text: Dann wiesen König Hiskia und die Obersten die Leviten an, Jahwe mit den Worten Davids und des Sehers Asaf zu loben.[a] Sie lobten ihn voller Freude,[b] verneigten sich und beteten an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach den Worten Davids und des Sehers Asaf«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »bis zur Freude« oder »zur Freude hin«; wahrscheinlich ist gemeint, dass ihr Lob von Freude geprägt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לַלְוִיִּם לְהַלֵּל
  choice: wiesen ... die Leviten an, ... zu loben
  rationale: Die Grundbedeutung von אמר ist »sagen«; die Konstruktion mit Adressat und Infinitiv hat hier jedoch anweisenden Sinn. »Wiesen ... an« gibt dies natürlich wieder, ohne die Stärke eines ausdrücklichen Befehlsverbs einzutragen.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: König ... und die führenden Männer
  rationale: שָׂרִים bezeichnet leitende Personen oder Amtsträger. »Führende Männer« ist im historischen Zusammenhang verständlich und vermeidet die moderne institutionelle Engführung von »Beamte« sowie das missverständliche »Fürsten«.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: mit den Worten Davids und des Sehers Asaf
  rationale: דִּבְרֵי bedeutet wörtlich »Worte«. Die Präposition ב kann hier Mittel oder Norm bezeichnen; der Haupttext wahrt die konkrete instrumentale Lesart, während die alternative Zuordnung in einer Fußnote genannt wird.
- source_word: עַד לְשִׂמְחָה
  choice: voller Freude
  rationale: Die ungewöhnliche Wendung lautet wörtlich etwa »bis zur Freude« bzw. »zur Freude hin«. Im Zusammenhang beschreibt sie wahrscheinlich das von Freude geprägte Lob; die Formnähe und verbleibende Mehrdeutigkeit werden in der Fußnote dokumentiert.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: verneigten sich und beteten an
  rationale: 'Die zwei hebräischen Verben werden als zwei koordinierte Handlungen erhalten: קדד bezeichnet das Niederbeugen, השתחוה hier die kultische Verehrung.'
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Gottesname steht im Ausgangstext ausdrücklich und wird als Name statt durch einen Titel wiedergegeben.
- issue: Verhältnis von Körperhaltung und Anbetung
  choice: 'zwei Handlungen: »verneigten sich und beteten an«'
  alternative: eine zusammengezogene Wendung wie »warfen sich anbetend nieder«
  rationale: Der hebräische Text verwendet zwei verschiedene Verben. Ihre getrennte Wiedergabe bewahrt die körperliche und die kultische Dimension, ohne sie dogmatisch voneinander abzugrenzen.
- issue: Bezug der Worte Davids und Asafs
  choice: 'Mittel des Lobens: »mit den Worten«'
  alternative: 'Norm oder Grundlage: »nach den Worten«'
  rationale: Die Präposition ב lässt beide Nuancen zu. Der Kontext legt liturgische Texte als Mittel des Lobens nahe, doch die alternative Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Führende Männer« ist allgemein verständlich und historisch offen; »Seher« bewahrt den prophetischen Titel. Das Pronomen »ihn« im zweiten Satz verdeutlicht im Deutschen den weiterhin geltenden Bezug auf Jahwe, ohne einen neuen Inhalt hinzuzufügen.
