source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: de
  text: Die Priester aber waren zu wenige und konnten nicht alle Brandopfertiere häuten. Deshalb unterstützten sie ihre Brüder, die Leviten,[a] bis die Arbeit beendet war und die Priester sich geheiligt hatten. Denn die Leviten waren aufrechter im Herzen,[b] wenn es darum ging, sich zu heiligen, als die Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: stärkten sie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: aufrichtiger von Herzen; die hebräische Wendung betont innere Aufrichtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הַכֹּהֲנִים הָיוּ לִמְעָט
  choice: Nur waren die Priester zu wenige
  rationale: רַק hat hier einschränkende beziehungsweise kontrastierende Kraft; לִמְעָט bezeichnet im Zusammenhang eine für die Aufgabe unzureichende Zahl.
- source_word: לְהַפְשִׁיט
  choice: die Haut abziehen
  rationale: Das Verb bezeichnet hier das Abhäuten der Opfertiere. Die Formulierung ist präzise und in modernem Deutsch verständlicher als das fachsprachlichere „häuten“ in dieser Satzkonstruktion.
- source_word: הָעֹלוֹת
  choice: Brandopfer
  rationale: Dies ist die übliche deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wurde.
- source_word: וַיְחַזְּקוּם
  choice: unterstützten sie
  rationale: Das Verb bedeutet wörtlich „stärkten sie“, bezeichnet im Kontext jedoch praktische Hilfe bei der Arbeit; „unterstützten“ bewahrt die Grundvorstellung, ohne im Deutschen unnatürlich zu wirken.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: ihre Brüder, die Leviten
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten und durch die Apposition eindeutig zugeordnet.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: bis die Arbeit beendet war
  rationale: Die Wendung bezeichnet die Dauer bis zum Abschluss der betreffenden Opferarbeit.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: sich geheiligt hatten / sich zu heiligen
  rationale: Der Hitpael bezeichnet die eigene rituelle Heiligung beziehungsweise Vorbereitung für den heiligen Dienst. „Sich heiligen“ erhält den wiederholten hebräischen Schlüsselbegriff.
- source_word: יִשְׁרֵי לֵבָב
  choice: aufrichtiger von Herzen
  rationale: Die Wendung bezeichnet innere Aufrichtigkeit oder Geradheit; das folgende מִן verleiht ihr vergleichende Kraft.
theological_decisions:
- issue: Art des Vergleichs zwischen Leviten und Priestern
  choice: Die Leviten waren hinsichtlich ihrer Selbstheiligung aufrichtiger von Herzen als die Priester.
  alternative: Die Leviten waren eifriger, bereitwilliger oder schneller als die Priester, sich zu heiligen.
  rationale: יִשְׁרֵי לֵבָב hebt primär die innere Aufrichtigkeit hervor. Die Übersetzung bewahrt die kritische Spannung des unmittelbaren Vergleichs, ohne daraus ein allgemeines Urteil über das Priestertum abzuleiten.
- issue: Bedeutung der Heiligung
  choice: Die kultische Selbstheiligung wird mit „sich heiligen“ wiedergegeben.
  alternative: „sich weihen“ oder „sich für den Dienst reinigen“
  rationale: „Sich heiligen“ hält die lexikalische Verbindung zu קדשׁ sichtbar und lässt offen, welche einzelnen vorbereitenden Riten dabei vollzogen wurden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Begriffe „Brandopfer“ und „sich heiligen“ bleiben erhalten; schwer verständliche Wörtlichkeit wird nur dort geglättet, wo der deutsche Ausdruck sonst unnatürlich wäre.
