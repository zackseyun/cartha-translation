source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: de
  text: Sie brachten sieben Stiere, sieben Widder, sieben Lämmer und sieben Ziegenböcke als Sündopfer für das Königreich, für das Heiligtum und für Juda. Dann befahl er den Söhnen Aarons, den Priestern, sie auf dem Altar Jahwes darzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Sie brachten
  rationale: Die Erzählform von בוא bezeichnet hier das Herbeibringen der Opfertiere; „brachten“ ist schlicht und ohne zusätzliche Deutung.
- source_word: פָרִים
  choice: Stiere
  rationale: Im Opferkontext bezeichnet פָרִים männliche Rinder; das Alter wird in diesem Vers nicht ausdrücklich angegeben.
- source_word: אֵילִים
  choice: Widder
  rationale: Übliche deutsche Wiedergabe für männliche Schafe im Opferkontext.
- source_word: כְבָשִׂים
  choice: Lämmer
  rationale: Natürliche und sachgerechte Wiedergabe des gebräuchlichen Opferbegriffs; das Geschlecht muss im Deutschen hier nicht eigens ergänzt werden.
- source_word: צְפִירֵי עִזִּים
  choice: Ziegenböcke
  rationale: Die Wortverbindung bezeichnet ausdrücklich männliche Ziegen; „Ziegenböcke“ ist präzise und modernes Standarddeutsch.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet hier die kultische Opferart, nicht lediglich die abstrakte Sünde.
- source_word: עַל הַמַּמְלָכָה
  choice: für das Königreich
  rationale: עַל hat im Opferzusammenhang stellvertretenden beziehungsweise zugunsten von geltenden Sinn; „für“ gibt dies knapp und natürlich wieder.
- source_word: הַמִּקְדָּשׁ
  choice: das Heiligtum
  rationale: „Heiligtum“ bewahrt den kultischen Gehalt von מִקְדָּשׁ genauer als das allgemeinere „Tempel“.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: den Söhnen Aarons, den Priestern
  rationale: Die familiäre Bezeichnung und die appositionelle Kennzeichnung als Priester bleiben erhalten.
- source_word: לְהַעֲלוֹת
  choice: darzubringen
  rationale: Im Opferkontext bezeichnet עלה das Darbringen auf dem Altar. „Darbringen“ ist im Deutschen idiomatisch und bildet die Handlung ab, ohne die wörtliche Aufwärtsbewegung unnötig hervorzuheben.
- source_word: מִזְבַּח יְהוָה
  choice: dem Altar Jahwes
  rationale: Die hebräische Genitivverbindung wird natürlich wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- issue: Kultische Bedeutung von חַטָּאת
  choice: Sündopfer
  alternative: Opfer für die Sünde
  rationale: Im Zusammenhang einer Opferliste bezeichnet das Wort eine bestimmte Opfergattung. „Sündopfer“ bewahrt diese kultische Kategorie, ohne sie weiter theologisch auszudeuten.
- issue: Bezug des infinitivischen לְהַעֲלוֹת
  choice: sie ... darzubringen
  alternative: darzubringen
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus der unmittelbar vorausgehenden Tierliste erschlossen und für natürliches Deutsch mit „sie“ ausgedrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Opferterminologie. Die Aufzählung und die dreifache Wendung „für“ bleiben zur Wahrung der hebräischen Struktur erhalten.
