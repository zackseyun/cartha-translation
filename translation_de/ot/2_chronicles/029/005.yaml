  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Hört mir zu, ihr Leviten! Heiligt euch jetzt und heiligt das Haus Jahwes, des Gottes eurer Väter. Schafft die Verunreinigung[a] aus dem Heiligtum[b] hinaus!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Unreinheit“; das hebräische Wort bezeichnet hier das, was das Heiligtum verunreinigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus dem heiligen Bereich“; gemeint ist hier der heilige Tempelbereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Hört mir zu
  rationale: Der Imperativ von שׁמע mit Suffix der 1. Person Singular ist eine unmittelbare Aufforderung. „Hört mir zu“ ist im modernen Deutsch natürlich und bewahrt den nachdrücklichen Aufruf.
- source_word: הַלְוִיִּם
  choice: ihr Leviten
  rationale: Der bestimmte Gruppenname steht als direkte Anrede. Das ergänzte „ihr“ kennzeichnet diese Anrede im Deutschen klar und idiomatisch.
- source_word: עַתָּה
  choice: jetzt
  rationale: Das Temporaladverb fordert zum gegenwärtigen, unmittelbaren Handeln auf, ohne zwingend die stärkere Bedeutung „sofort“ zu verlangen.
- source_word: הִתְקַדְּשׁוּ
  choice: Heiligt euch
  rationale: Der reflexive Hitpael-Imperativ von קדש bezeichnet hier die kultische Vorbereitung der Leviten. „Heiligt euch“ bewahrt sowohl den reflexiven Sinn als auch den Zusammenhang mit dem folgenden Verb desselben Stammes.
- source_word: וְקַדְּשׁוּ
  choice: und heiligt
  rationale: Der Piel-Imperativ von קדש bezieht sich auf das Haus Jahwes. Die Wiederholung von „heiligt“ bildet die Wiederholung desselben hebräischen Wortstamms ab.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus Jahwes“ wird beibehalten; „Tempel Jahwes“ wäre verständlich, würde die konkrete hebräische Ausdrucksweise jedoch stärker auslegen.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: des Gottes eurer Väter
  rationale: Die traditionelle Bundesformel wird eng am Hebräischen wiedergegeben. „Vorfahren“ wäre möglich, gibt den Wortlaut aber weniger unmittelbar wieder.
- source_word: וְהוֹצִיאוּ
  choice: Schafft ... hinaus
  rationale: Der Hiphil-Imperativ von יצא hat hier den kausativen Sinn, etwas aus dem heiligen Bereich herauszubringen. Die deutsche Wendung ist anschaulich und natürlich.
- source_word: הַנִּדָּה
  choice: die Verunreinigung
  rationale: נִדָּה bezeichnet hier das, was den Tempel kultisch verunreinigt. „Verunreinigung“ wahrt den kultischen Bezug, ohne den Ausdruck vorschnell auf bloßen Schmutz oder bestimmte Gegenstände zu verengen.
- source_word: מִן הַקֹּדֶשׁ
  choice: aus dem Heiligtum hinaus
  rationale: קֹדֶשׁ bezeichnet in diesem Zusammenhang den heiligen Tempelbereich. „Heiligtum“ ist im Deutschen die natürliche kultische Ortsbezeichnung; „hinaus“ verdeutlicht zusammen mit מִן und dem Verb die Entfernung aus diesem Bereich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Wiedergabe und bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קדש bei Personen und Tempel
  choice: heiligt euch / heiligt das Haus
  alternative: weiht euch / weiht das Haus
  rationale: Die einheitliche Wiedergabe bewahrt die Verbindung der beiden unmittelbar aufeinanderfolgenden Formen desselben hebräischen Stammes. Der Kontext macht deutlich, dass kultische Absonderung und Reinigung gemeint sind, ohne eine weitergehende dogmatische Definition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und eindringlicher Rede. Die Wiederholung „heiligt euch und heiligt“ bildet den hebräischen Wortstamm קדש bewusst ab. „Haus Jahwes“ hält die konkrete Quellformulierung fest, während „Heiligtum“ für den örtlich verstandenen Ausdruck הַקֹּדֶשׁ natürliches Deutsch bietet.
