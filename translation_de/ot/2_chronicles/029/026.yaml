  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: de
  text: Da stellten sich die Leviten mit den Instrumenten Davids[a] auf und die Priester mit den Trompeten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Davids Instrumenten“. Die hebräische Verbindung kann Instrumente bezeichnen, die David gehörten, von ihm bestimmt wurden oder mit ihm verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die im Gottesdienst von den Priestern verwendeten Trompeten. An anderen Stellen werden solche Trompeten ausdrücklich als silbern bezeichnet; hier steht diese Angabe jedoch nicht.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Da stellten sich … auf
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da“ gibt diese Abfolge natürlich wieder; „sich aufstellen“ passt zum Einnehmen der vorgesehenen Stellung im Kult.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche und genaue Bezeichnung der levitischen Kultdiener; der bestimmte Artikel bleibt erhalten.
- source_word: בִּכְלֵי דָוִיד
  choice: mit den Instrumenten Davids
  rationale: כְּלִי bezeichnet allgemein ein Gerät oder Instrument, im musikalischen Tempelkontext jedoch Instrumente. Die Genitivverbindung mit David bleibt bewusst offen für Besitz, Beauftragung oder sonstige Zuordnung.
- source_word: וְהַכֹּהֲנִים
  choice: und die Priester
  rationale: Direkte Wiedergabe der koordinierten zweiten Gruppe einschließlich Konjunktion und bestimmtem Artikel.
- source_word: בַּחֲצֹצְרוֹת
  choice: mit den Trompeten
  rationale: חֲצֹצְרוֹת bezeichnet die von Priestern verwendeten Kulttrompeten. Dass sie aus Silber waren, wird an dieser Stelle nicht ausdrücklich gesagt und daher nicht in den Haupttext aufgenommen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die elliptische Satzstruktur des Hebräischen wird im Deutschen durch das gemeinsame Prädikat „stellten sich … auf“ natürlich wiedergegeben, ohne zusätzliche Handlung einzuführen.
