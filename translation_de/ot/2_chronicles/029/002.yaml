source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes recht war, ganz so, wie es sein Vater David[a] getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Vorfahr David“ beziehungsweise „sein Ahnherr David“. „Vater“ bezeichnet hier die dynastische Abstammung, nicht den unmittelbaren Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Qal-Wayyiqtol von עשה führt die Erzählung fort. Im natürlichen deutschen Erzählstil kann das einleitende וַ ohne ein ausdrückliches „und“ wiedergegeben werden.
- source_word: הַיָּשָׁר
  choice: was … recht war
  rationale: Das substantivierte Adjektiv bezeichnet das Rechte beziehungsweise Richtige. „Was … recht war“ ist im Deutschen idiomatisch und bewahrt den wertenden Charakter der Königsformel.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die hebräische Perspektivmetapher wird wörtlich und zugleich verständlich beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Wendung bezeichnet umfassende Übereinstimmung mit Davids Handeln. „Ganz so, wie“ gibt sowohl den Vergleich als auch die durch כֹל ausgedrückte Gesamtheit natürlich wieder.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Davids Handeln zeitlich vorausliegt und als Vergleichsmaßstab dient.
- source_word: דָּוִיד
  choice: David
  rationale: Übliche deutsche Form des Personennamens.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird in der dynastischen Formel beibehalten; der hier gemeinte weitere Sinn „Vorfahr“ wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname bewahrt diese Unterscheidung, ohne es durch einen Titel zu ersetzen.
- issue: Bedeutung von „sein Vater David“ bei Hiskia
  choice: Die dynastische Formulierung „sein Vater David“ bleibt im Haupttext erhalten.
  alternative: sein Vorfahr David
  rationale: אָב kann neben dem unmittelbaren Vater auch einen Ahnherrn bezeichnen. Hier ist David Hiskias dynastischer Vorfahr; die wörtliche Ausdrucksweise bleibt erhalten, während die Fußnote einem Missverständnis unmittelbarer Vaterschaft vorbeugt.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die traditionelle Königsformel und die hebräische Metapher „in den Augen“ bleiben erkennbar; Satzbau und Zeitform sind zugleich natürlich deutsch.
