source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: de
  text: Im ersten Jahr seiner Regierung, im ersten Monat, öffnete er die Türen des Hauses Jahwes und setzte sie instand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und machte sie wieder fest; auch möglich: und verstärkte sie.'
    reason: Die Grundbedeutung von וַיְחַזְּקֵם ist „sie stark/fest machen“. Im Zusammenhang kann damit das Instandsetzen der Türen gemeint sein, doch die konkretere Art der Arbeit bleibt offen.
lexical_decisions:
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen nimmt das Subjekt im Erzählfluss wieder auf; im Deutschen genügt das natürliche „er“, ohne eine möglicherweise überstarke Hervorhebung durch „er selbst“.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: im ersten Jahr seiner Regierung
  rationale: Die Zeitangabe bezeichnet idiomatisch das erste Regierungsjahr und wird im Deutschen klar und sachgerecht wiedergegeben.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Dies ist die direkte und natürliche Wiedergabe der hebräischen Zeitangabe.
- source_word: פָּתַח
  choice: öffnete
  rationale: Das Verb bezeichnet hier schlicht das Öffnen der Tempeltüren.
- source_word: דַּלְתוֹת
  choice: die Türen
  rationale: דֶּלֶת bezeichnet Türen beziehungsweise Türflügel; „Türen“ ist hier die natürliche deutsche Formulierung.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild und ist im Zusammenhang als Bezeichnung für den Tempel verständlich; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַיְחַזְּקֵם
  choice: und setzte sie instand
  rationale: Der Piel-Stamm bedeutet grundsätzlich „stärken, fest machen“. Bei beschädigten oder vernachlässigten Türen bezeichnet er im Zusammenhang der Tempelerneuerung wahrscheinlich ihre Wiederherstellung; „setzte sie instand“ gibt diesen praktischen Sinn idiomatisch wieder, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die beiden Zeitangaben zusammen und bleibt gut lesbar. „Haus Jahwes“ bewahrt die Ausdrucksweise des Hebräischen, ohne das verständlichere, aber interpretierendere „Tempel“ in den Haupttext zu setzen.
