source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲטוּ֙ הַ/בָּקָ֔ר וַ/יְקַבְּל֤וּ הַ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וַֽ/יִּזְרְק֖וּ הַ/מִּזְבֵּ֑חָ/ה וַ/יִּשְׁחֲט֣וּ הָ/אֵלִ֗ים וַ/יִּזְרְק֤וּ הַ/דָּם֙ הַ/מִּזְבֵּ֔חָ/ה וַֽ/יִּשְׁחֲטוּ֙ הַ/כְּבָשִׂ֔ים וַ/יִּזְרְק֥וּ הַ/דָּ֖ם הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: de
  text: Dann schlachteten sie die Rinder[a]. Die Priester nahmen das Blut auf und sprengten es an den Altar[b]. Danach schlachteten sie die Widder und sprengten das Blut an den Altar. Ebenso schlachteten sie die Lämmer und sprengten das Blut an den Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stiere“. Das hebräische Wort ist eine Sammelbezeichnung für Rinder und bestimmt ihr Geschlecht hier nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „schleuderten das Blut gegen den Altar“ oder „spritzten das Blut an den Altar“. Das hebräische Verb bezeichnet ein kräftiges rituelles Aufbringen des Blutes, nicht ein leichtes Besprengen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: sie schlachteten
  rationale: שׁחט bezeichnet hier das rituelle Schlachten von Opfertieren und nicht lediglich ein Töten.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בקר ist eine Sammelbezeichnung für Rindvieh und legt das Geschlecht der Tiere nicht ausdrücklich fest.
- source_word: וַיְקַבְּלוּ
  choice: nahmen ... auf
  rationale: קבל bedeutet grundsätzlich „empfangen/annehmen“; beim Opfervorgang ist gemeint, dass die Priester das Blut zur weiteren rituellen Verwendung auffingen beziehungsweise aufnahmen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und eindeutige Wiedergabe von כהנים.
- source_word: הַדָּם
  choice: das Blut
  rationale: Direkte Wiedergabe des hebräischen Ausdrucks für das Opferblut.
- source_word: וַיִּזְרְקוּ
  choice: sprengten
  rationale: זרק bezeichnet im Opferkontext eine gezielte, kräftige Anwendung des Blutes am Altar. „Sprengten“ ist der etablierte deutsche Ritualausdruck; eine Fußnote verhindert das Missverständnis eines bloß leichten Besprengens.
- source_word: הַמִּזְבֵּחָה
  choice: an den Altar
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Altar hin; im Zusammenhang wird das Blut auf dessen Fläche beziehungsweise Seite aufgebracht.
- source_word: הָאֵלִים
  choice: die Widder
  rationale: אילים bezeichnet hier eindeutig männliche Schafe, also Widder.
- source_word: הַכְּבָשִׂים
  choice: die Lämmer
  rationale: כבשים bezeichnet in Opferlisten gewöhnlich Lämmer beziehungsweise junge Schafe.
