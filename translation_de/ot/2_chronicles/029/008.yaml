  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: de
  text: So kam der Zorn Jahwes über Juda und Jerusalem. Er machte sie zum Gegenstand des Grauens[a], zur Verwüstung und zum höhnischen Pfeifen[b], wie ihr mit eigenen Augen seht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Schrecken“. Das hebräische Wort bezeichnet etwas, das Erschrecken oder Schauder hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Pfeifen ist hier die höhnische Reaktion auf die Verwüstung; sinngemäß auch: „zum Gespött“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: Zorn
  rationale: Gibt die Heftigkeit des göttlichen Gerichts deutlicher wieder als das allgemeinere „Ärger“ und ist im modernen Standarddeutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Eigennamen Gottes als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְהִי ... עַל
  choice: kam ... über
  rationale: Bewahrt die hebräische Vorstellung, dass der Zorn Juda und Jerusalem als Gericht ereilte.
- source_word: וַיִּתְּנֵם
  choice: er machte sie
  rationale: Die Konstruktion mit ל bezeichnet hier den Zustand beziehungsweise die öffentliche Wirkung, zu der Juda und Jerusalem gemacht wurden.
- source_word: לְזוֹעָה
  choice: zum Schreckensbild
  rationale: Das seltene Wort bezeichnet etwas, das Erschrecken, Grauen oder Schauder auslöst; „Schreckensbild“ drückt diese Wirkung auf Betrachter knapp und anschaulich aus.
- source_word: לְשַׁמָּה
  choice: zur Verwüstung
  rationale: Gibt den sichtbaren Zustand der Zerstörung als Folge des Gerichts wieder, ohne die mögliche Nebenbedeutung des Entsetzens dogmatisch festzulegen.
- source_word: וְלִשְׁרֵקָה
  choice: zum Anlass für höhnisches Pfeifen
  rationale: Bewahrt das konkrete Bild des Pfeifens und macht zugleich deutlich, dass es sich um die spöttische Reaktion der Betrachter handelt.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: wie ihr mit eigenen Augen seht
  rationale: Erhält die emphatische Berufung auf das unmittelbar Sichtbare in natürlichem Deutsch.
theological_decisions:
- issue: Unabgeschwächte Wiedergabe des göttlichen Gerichts
  choice: Der Zorn Jahwes kam über Juda und Jerusalem, und er machte sie zum Schreckensbild, zur Verwüstung und zum Anlass für höhnisches Pfeifen.
  alternative: Jahwe war über Juda und Jerusalem zornig und gab sie dem Grauen, der Verwüstung und dem Spott preis.
  rationale: Die gewählte Fassung bewahrt sowohl die Schärfe des göttlichen Zorns als auch die öffentlich sichtbaren und beschämenden Folgen des Gerichts, ohne eine zusätzliche theologische Erklärung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten Gerichtsbilder bleiben erhalten; seltene hebräische Begriffe werden im Haupttext verständlich und in den Fußnoten mit ihren möglichen Bedeutungsnuancen wiedergegeben.
