base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: de
  text: Und die ganze Versammlung warf sich nieder, während das Lied gesungen wurde[a] und die Trompeten erklangen. Das alles dauerte, bis das Brandopfer vollständig dargebracht war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Lied sang“; im Hebräischen steht „das Lied“ mit einem Partizip des Verbs „singen“. Die passive Wiedergabe ist im Deutschen natürlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: Versammlung
  rationale: Bezeichnet die zum Gottesdienst versammelte Gemeinschaft; „Versammlung“ ist im modernen Deutschen verständlich und wahrt den gemeinschaftlichen Sinn.
- source_word: מִשְׁתַּחֲוִים
  choice: warf sich nieder
  rationale: Das Verb bezeichnet eine körperliche Gebärde des Niederwerfens bzw. tiefen Verneigens; die Wiedergabe bewahrt den konkreten Vorgang, statt ihn nur allgemein als Anbetung zu deuten.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: das Lied gesungen wurde
  rationale: Wörtlich steht „das Lied“ mit einem Partizip von „singen“; die passive Form gibt den hebräischen Sinn im Deutschen natürlich wieder.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: die Trompeten erklangen
  rationale: Die Konstruktion beschreibt das fortdauernde Blasen bzw. Ertönen der kultischen Trompeten. „Erklangen“ ist idiomatisch, ohne das nicht ausdrücklich genannte Material zu ergänzen.
- source_word: הַכֹּל
  choice: Das alles
  rationale: Die Wendung fasst die zuvor genannten gottesdienstlichen Handlungen zusammen.
- source_word: עַד לִכְלוֹת
  choice: bis ... vollendet war
  rationale: Der Infinitiv bezeichnet den Endpunkt der fortdauernden Handlungen; ein deutscher Nebensatz gibt dies natürlich wieder.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das Opfer, das auf dem Altar vollständig verbrannt wurde.
theological_decisions: []
