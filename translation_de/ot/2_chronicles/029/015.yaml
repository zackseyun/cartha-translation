base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: de
  text: Sie versammelten ihre Brüder, heiligten sich und kamen auf Befehl des Königs, entsprechend den Worten Jahwes,[a] um das Haus Jahwes[b] zu reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie kamen gemäß dem Befehl des Königs und nach den Worten Jahwes.“ Wörtlich: „gemäß dem Befehl des Königs, in/mit den Worten Jahwes“.'
    reason: Die Präpositionalphrase בְּדִבְרֵי יְהוָה kann die königliche Anordnung näher bestimmen oder zusätzlich die Grundlage ihres Handelns angeben.
  - marker: b
    text: 'Das heißt: den Tempel Jahwes.'
    reason: „Haus Jahwes“ ist die wörtliche Formulierung; im Zusammenhang bezeichnet sie den Tempel.
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת אֲחֵיהֶם
  choice: Sie versammelten ihre Brüder
  rationale: אסף bedeutet hier „versammeln“; אֲחֵיהֶם ist wörtlich „ihre Brüder“ und bezeichnet im Zusammenhang ihre männlichen levitischen Amtsbrüder, ohne dass diese Präzisierung im Text selbst ausdrücklich steht.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: heiligten sich
  rationale: Der Hitpael von קדשׁ bezeichnet hier die rituelle Selbstheiligung beziehungsweise Weihe für den Tempeldienst. „Heiligten sich“ bewahrt die Wortverbindung zu „heilig“, ohne unnatürlich zu wirken.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: Die Grundbedeutung von בוא ist „kommen“. Ein ausdrückliches Objekt oder „hineingehen“ sollte nicht ergänzt werden.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: gemäß dem Befehl des Königs
  rationale: Die Wendung bezeichnet die Übereinstimmung ihres Handelns mit dem königlichen Befehl und wird in würdigem, natürlichem Deutsch wiedergegeben.
- source_word: בְּדִבְרֵי יְהוָה
  choice: der auf den Worten Jahwes beruhte
  rationale: Die Wiedergabe wahrt den Plural „Worte“ und versteht die Präpositionalphrase als nähere Bestimmung des königlichen Befehls. Da die syntaktische Zuordnung nicht völlig eindeutig ist, wird eine alternative Deutung in der Fußnote genannt.
- source_word: לְטַהֵר
  choice: um ... zu reinigen
  rationale: Das Piel von טהר bezeichnet im Tempelzusammenhang kultische Reinigung. „Reinigen“ ist verständlich und bewahrt diesen Sinn.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bleibt erhalten; gemeint ist der Tempel, was die Fußnote erläutert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bezug von בְּדִבְרֵי יְהוָה
  choice: Der Befehl des Königs beruhte auf den Worten Jahwes.
  alternative: Sie kamen auf den Befehl des Königs hin und nach den Worten Jahwes.
  rationale: Die Präpositionalphrase kann eng auf den königlichen Befehl bezogen oder als zusätzliche Norm ihres Kommens verstanden werden. Der Haupttext wählt die im Zusammenhang plausible enge Zuordnung, die Fußnote bewahrt die echte Mehrdeutigkeit.
- issue: Brüder als geschlechtsspezifische Bezeichnung
  choice: ihre Brüder
  alternative: ihre levitischen Amtsbrüder
  rationale: Der hebräische Text verwendet die maskuline Verwandtschaftsbezeichnung; im Kontext sind männliche Leviten gemeint. Die Übersetzung ergänzt die kontextuelle Identifikation nicht in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Handlungsablauf, glättet jedoch die schwerfällige Folge der Präpositionalangaben. „Jahwe“ wird als im Deutschen geläufige Form des Gottesnamens verwendet.
