source:
  edition: WLC
  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: de
  text: Die Zahl der Brandopfertiere, die die Versammlung brachte, betrug siebzig Rinder, hundert Widder und zweihundert Lämmer. Alle diese waren als Brandopfer für den HERRN bestimmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: Brandopfertiere / als Brandopfer
  rationale: Der erste Beleg bezeichnet im Zusammenhang die für das Brandopfer gebrachten Tiere; die konkrete Wiedergabe vermeidet die missverständliche Aussage, die Opfer selbst hätten Tiere gezählt. Der zweite Beleg benennt ihre kultische Bestimmung.
- source_word: הַקָּהָל
  choice: die Versammlung
  rationale: Gibt die zusammengekommene Gemeinschaft sachlich und ohne unnötige institutionelle Festlegung wieder.
- source_word: בָּקָר
  choice: Rinder
  rationale: Der hebräische Kollektivbegriff bezeichnet Großvieh bzw. Rinder und legt hier nicht ausdrücklich nur männliche Tiere fest.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit HERR in Kapitälchen entspricht dem würdigen Bibelregister und der englischen Konsultationsschicht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die konventionelle deutsche Ersatzlesung wird verwendet, ohne eine unsichere Aussprache des Namens festzuschreiben.
- issue: Geschlecht der siebzig Rinder
  choice: Rinder
  alternative: Stiere
  rationale: בקר ist ein Gattungs- bzw. Kollektivbegriff; eine Einschränkung auf männliche Tiere wäre hier stärker als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die inhaltliche Einheit oder die abschließende Zusammenfassung des hebräischen Satzes zu verändern.
