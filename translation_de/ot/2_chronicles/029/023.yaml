  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: de
  text: Dann brachten sie die Ziegenböcke für das Sündopfer vor den König und die versammelte Gemeinde. Der König und die versammelte Gemeinde legten ihre Hände auf sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und sie legten ihre Hände auf sie.“ Das Subjekt bezieht sich am ehesten auf den König und die versammelte Gemeinde; möglicherweise handelten sie durch Vertreter.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: brachten sie … vor
  rationale: Der Hifil von נגשׁ bezeichnet ein Heranbringen oder Darbringen. In Verbindung mit לִפְנֵי gibt „vor … bringen“ sowohl die konkrete Bewegung als auch die kultische Präsentation natürlich wieder.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: die Ziegenböcke für das Sündopfer
  rationale: שְׂעִירֵי bezeichnet männliche Ziegen; חַטָּאת meint hier aufgrund des Opferkontexts das Sündopfer, nicht die abstrakte Sünde.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier das Bringen in die Gegenwart beziehungsweise vor das Angesicht des Königs und der versammelten Gemeinde.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: den König und die versammelte Gemeinde
  rationale: קָהָל bezeichnet die zusammengekommene Gemeinschaft. „Versammelte Gemeinde“ ist verständlich, würdig und macht den kollektiven Charakter deutlich, ohne eine bestimmte kirchliche Struktur vorauszusetzen.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: Diese legten ihre Hände
  rationale: סמך mit ידים bezeichnet im Opferzusammenhang das rituelle Auflegen der Hände. Das Demonstrativpronomen „Diese“ macht den naheliegenden Rückbezug auf König und Gemeinde im Deutschen deutlich, ohne die mögliche Vertretung näher festzulegen.
- source_word: עֲלֵיהֶם
  choice: auf sie
  rationale: Das männliche Pluralpronomen verweist auf die Ziegenböcke; „auf sie“ ist die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Sünde
  rationale: Die Tiere werden herbeigebracht, und Hände werden auf sie gelegt. Dieser kultische Zusammenhang zeigt, dass חַטָּאת hier die Opferart bezeichnet.
- issue: Subjekt von „sie legten ihre Hände auf sie“
  choice: Rückbezug auf den König und die versammelte Gemeinde, möglicherweise durch Vertreter
  alternative: Die Priester legten den Ziegenböcken die Hände auf
  rationale: Die nächstliegenden Bezugsgrößen sind der König und die Gemeinde; auch „ihre Hände“ weist natürlich auf sie zurück. Ob alle selbst oder Vertreter handelten, sagt der hebräische Text nicht ausdrücklich, weshalb dies in einer Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sündopfer“ bewahrt den kultischen Fachsinn; „versammelte Gemeinde“ vermeidet eine unnötig konfessionelle Färbung. Die Aufteilung in zwei Sätze und „Diese“ verhindern im Deutschen eine irreführende Zuordnung des zweiten Verbs zu den zuerst genannten, nicht näher bestimmten Überbringern.
