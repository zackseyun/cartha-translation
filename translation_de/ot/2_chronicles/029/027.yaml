  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: de
  text: Da ordnete Hiskija an, das Brandopfer auf dem Altar darzubringen. Als die Darbringung des Brandopfers begann, begann auch das Lied Jahwes[a], mit den Trompeten und mithilfe der Instrumente Davids, des Königs von Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Lied für Jahwe“. Wörtlich: „das Lied Jahwes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: ordnete ... an, ... darzubringen
  rationale: אמר mit folgendem ל-Infinitiv hat hier im königlichen Kontext die Kraft einer Anweisung. „Ordnete an“ gibt diese Konstruktion in natürlichem Deutsch wieder; „darbringen“ ist der übliche kultische Ausdruck für das Hiphil von עלה.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte und verständliche deutsche Entsprechung.
- source_word: לַמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die Präposition bezeichnet hier den Ort der Opferdarbringung.
- source_word: וּבְעֵת הֵחֵל ... הֵחֵל
  choice: Als ... begann, begann auch
  rationale: Die Wiederholung von החל wird beibehalten und stellt den zeitgleichen Beginn von Opfer und Gesang heraus.
- source_word: שִׁיר יְהוָה
  choice: das Lied Jahwes
  rationale: Die hebräische Genitivverbindung bleibt bewusst offen; sie kann Zugehörigkeit oder Ausrichtung des Liedes ausdrücken. Die alternative Deutung wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַחֲצֹצְרוֹת
  choice: die Trompeten
  rationale: חֲצֹצְרוֹת bezeichnet die im Kult verwendeten Trompeten; das Material wird im Vers nicht genannt.
- source_word: וְעַל יְדֵי
  choice: mithilfe
  rationale: Die Wendung bezeichnet hier das instrumentale Mittel, durch das der Gesang musikalisch ausgeführt beziehungsweise begleitet wurde.
- source_word: כְּלֵי דָּוִיד
  choice: die Instrumente Davids
  rationale: כְּלִים ist allgemein „Geräte/Instrumente“, bezeichnet in diesem musikalisch-liturgischen Zusammenhang jedoch Musikinstrumente, die mit David verbunden sind.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Der Königstitel wird als Apposition zu David beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Transliteration wahrt den Charakter als Eigenname.
- issue: Sinn von שִׁיר יְהוָה
  choice: das Lied Jahwes
  alternative: das Lied für Jahwe
  rationale: Der Genitiv kann Besitz beziehungsweise Zugehörigkeit oder die Ausrichtung des Liedes auf Jahwe bezeichnen. Der Haupttext erhält die formale Mehrdeutigkeit; die Fußnote nennt die naheliegende alternative Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „begann“ spiegelt die auffällige Wiederholung im Hebräischen. „Mit den Trompeten und mithilfe der Instrumente“ bewahrt den Wechsel der hebräischen Verknüpfungen, ohne zusätzliche Angaben wie „silbern“ oder „Lobgesang“ einzuführen.
