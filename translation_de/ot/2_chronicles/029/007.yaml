  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: de
  text: Sie verschlossen auch die Türen der Vorhalle[a], löschten die Lampen, brachten keinen Weihrauch dar und brachten im Heiligtum[b] dem Gott Israels keine Brandopfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Eingangshalle«; das hebräische Wort bezeichnet die Vorhalle am Eingang des Tempels.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »im heiligen Bereich«; der hebräische Ausdruck bezeichnet einen geheiligten Bereich des Tempels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Das Wort fügt diese Verfehlungen den zuvor genannten an und bewahrt so die steigernde Aufzählung.
- source_word: סָגְרוּ
  choice: verschlossen
  rationale: Bei Türen bezeichnet das Verb ein Schließen; „verschlossen“ gibt zugleich die bewusste Stilllegung des Zugangs natürlich wieder.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: die Türen der Vorhalle
  rationale: אוּלָם bezeichnet die Eingangshalle des Tempels. „Vorhalle“ ist im Deutschen präzise, verständlich und architektonisch passend.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: löschten die Lampen
  rationale: Die Formulierung bezeichnet das Auslöschen der für den Tempeldienst bestimmten Lampen und bewahrt das konkrete Bild.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: verbrannten keinen Weihrauch
  rationale: Das Hifil von קטר mit קְטֹרֶת bezeichnet das rituelle Verbrennen beziehungsweise Darbringen von Weihrauch. „verbrannten“ bildet den konkreten Vorgang ab.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: brachten … keine Brandopfer dar
  rationale: עֹלָה ist der Fachausdruck für das Brandopfer; „darbringen“ gibt den kultischen Gebrauch des Hifil von עלה idiomatisch wieder.
- source_word: בַקֹּדֶשׁ
  choice: im Heiligtum
  rationale: Der Ausdruck bezeichnet hier den heiligen Bereich des Tempels, ohne im Kontext eindeutig einen enger abgegrenzten Raum festzulegen.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Der Dativ gibt die Ausrichtung und Widmung der Opfer an Gott im Deutschen natürlich wieder.
theological_decisions:
- issue: Terminologie des Tempelkults
  choice: Die konkreten Bezeichnungen „Weihrauch“, „Brandopfer“ und „Heiligtum“ werden beibehalten.
  alternative: Die Einzelhandlungen unter einem allgemeinen Ausdruck wie „Gottesdienst halten“ oder „Opfer darbringen“ zusammenfassen.
  rationale: Der Vers nennt bestimmte Versäumnisse im Tempeldienst. Die konkrete Terminologie bewahrt die historische und theologische Aussage, ohne sie konfessionell auszudeuten.
- issue: Bezug von בַקֹּדֶשׁ
  choice: „im Heiligtum“ wird unmittelbar mit dem Darbringen der Brandopfer verbunden.
  alternative: Den Ausdruck weiter fassen oder auch auf das Verbrennen des Weihrauchs beziehen.
  rationale: Die hebräische Wortstellung stellt בַקֹּדֶשׁ in den Satzteil über das Brandopfer. Zugleich bleibt durch eine Fußnote kenntlich, dass קֹדֶשׁ auch enger als „heiliger Bereich“ verstanden werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die kultischen Fachbegriffe bleiben erhalten; veraltete oder unnötig technische Formulierungen werden vermieden.
