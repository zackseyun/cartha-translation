revisions:
- from: Und alle Geräte, die König Ahas während seiner Herrschaft beiseitegestellt hatte[a], als er treulos handelte[b], haben wir hergerichtet und geheiligt. Nun stehen sie vor dem Altar Jahwes.
  to: Und alle Geräte, die König Ahas während seiner Herrschaft in seinem Treuebruch beiseitegeworfen hatte[a], haben wir hergerichtet und geheiligt. Und siehe, sie befinden sich nun vor dem Altar Jahwes.
  rationale: „Beiseitegeworfen“ gibt die aktive Abwendung in הִזְנִיחַ genauer wieder. Die Präpositionalform „in seinem Treuebruch“ folgt dem hebräischen בְּמַעֲלוֹ eng und bleibt im Deutschen verständlich. „Und siehe, sie befinden sich nun“ erhält die demonstrative Kraft von וְהִנָּם und vermeidet die bei Gegenständen weniger natürliche Aussage, sie „stünden“. Die Fußnote b ist inhaltlich weiterhin sinnvoll, hat aber im revidierten Text keinen Anker; deshalb wird sie nicht in den Text eingebunden und sollte nur übernommen werden, wenn ein Anker bei „Treuebruch“ gesetzt wird.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:31Z'
review_pass:
