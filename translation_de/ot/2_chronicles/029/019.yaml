  naturalness: Die Syntax und der würdige moderne Register sind gelungen. „Und siehe, sie befinden sich nun vor dem Altar Jahwes“ ist idiomatisch und gibt die demonstrative Feststellung des Hebräischen natürlicher wieder als „Nun stehen sie“ bei unbelebten Geräten.
  terminology: „Geräte“, „Herrschaft“, „Treuebruch“, „geheiligt“ und „Jahwe“ sind im Kontext angemessen. „Beiseitegeworfen“ trifft das aktive Preisgeben der Tempelgeräte präziser, ohne über eine tatsächliche Zerstörung zu entscheiden.
  issues:
  - severity: medium
    issue: „beiseitegestellt hatte“ ist für הִזְנִיחַ zu abgeschwächt.
    rationale: Das Verb beschreibt hier, dass Ahas die Gegenstände verwarf bzw. aussonderte. „Beiseitegestellt“ kann eine bloß vorläufige, neutrale Ablage bezeichnen.
