base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: de
  text: Und alle Geräte, die König Ahas während seiner Herrschaft in seinem Treuebruch beiseitegeworfen hatte[a], haben wir hergerichtet und geheiligt. Und siehe, sie befinden sich nun vor dem Altar Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vernachlässigt“ oder „verworfen hatte“. Das hebräische Wort kann aktives Beiseitewerfen oder Vernachlässigen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: Der Ausdruck bezeichnet Gegenstände oder Gerätschaften; im Tempelzusammenhang ist „Geräte“ ein natürlicher, hinreichend weiter Sammelbegriff.
- source_word: הִזְנִיחַ
  choice: beiseitegestellt hatte
  rationale: Das Verb bezeichnet hier ein aktives Beiseiteschieben oder Verwerfen. „Beiseitegestellt“ wahrt diese Bedeutung, ohne eine endgültige Vernichtung der Tempelgeräte anzudeuten.
- source_word: בְּמַלְכוּתוֹ
  choice: während seiner Herrschaft
  rationale: Die Präposition ist temporal zu verstehen; die Formulierung gibt den Zeitraum von Ahas’ Königsherrschaft idiomatisch wieder.
- source_word: בְּמַעֲלוֹ
  choice: als er treulos handelte
  rationale: מַעַל bezeichnet einen Treuebruch, besonders gegenüber Gott. Die verbale Wiedergabe klingt im Deutschen natürlich und erhält den religiös-moralischen Gehalt.
- source_word: הֵכַנּוּ
  choice: haben wir hergerichtet
  rationale: Das Hifil von כון bedeutet bereitmachen oder in den erforderlichen Zustand bringen. „Hergerichtet“ passt zur Wiederherstellung der Tempelgeräte.
- source_word: וְהִקְדָּשְׁנוּ
  choice: und geheiligt
  rationale: Das Hifil von קדשׁ bezeichnet das Aussondern für den heiligen Gebrauch. „Geheiligt“ ist verständlich und bewahrt den kultischen Sinn.
- source_word: וְהִנָּם
  choice: Nun stehen sie
  rationale: Die hebräische HinweispPartikel lenkt die Aufmerksamkeit auf den gegenwärtigen Ort und Zustand der Geräte. „Nun stehen sie“ vermittelt dies in natürlichem Deutsch.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: vor dem Altar Jahwes
  rationale: לִפְנֵי bedeutet hier räumlich „vor“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von מַעַל als religiöser Treuebruch
  choice: als er treulos handelte
  alternative: in seinem Treuebruch / in seiner Untreue
  rationale: Die gewählte Formulierung bewahrt den Gedanken eines Treuebruchs gegenüber Gott, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den persönlichen Gottesnamen im Deutschen direkt wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen, wird jedoch durch zwei deutsche Hauptsätze gut lesbar gemacht. „Nun stehen sie“ gibt die deiktische Wirkung von וְהִנָּם natürlicher wieder als das archaisch wirkende „siehe“.
