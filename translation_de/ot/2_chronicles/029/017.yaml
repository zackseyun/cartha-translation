source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: de
  text: Am ersten Tag des ersten Monats begannen sie mit der Heiligung. Am achten Tag des Monats kamen sie zur Vorhalle Jahwes[a]. Acht Tage lang heiligten sie das Haus Jahwes, und am sechzehnten Tag des ersten Monats waren sie damit fertig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zum Vorbau; auch: zur Eingangshalle Jahwes.'
    reason: אוּלָם kann den vorgelagerten Hallen- oder Vorbaubereich des Tempels bezeichnen.
lexical_decisions:
- source_word: וַיָּחֵלּוּ ... לְקַדֵּשׁ
  choice: begannen sie mit der Heiligung
  rationale: Gibt den Beginn des kultischen Heiligungs- und Reinigungswerks natürlich wieder, ohne ein im Hebräischen unausgesprochenes Objekt einzufügen.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: am ersten Tag des ersten Monats
  rationale: Die hebräische Datumsformel wird in geläufigem modernem Deutsch wiedergegeben.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: gelangten sie zur Vorhalle Jahwes
  rationale: אוּלָם bezeichnet den vorgelagerten Hallen- oder Portikusbereich des Tempels. „Gelangten ... zur“ bewahrt die Richtungsangabe, ohne einen weitergehenden Eintritt zu behaupten.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: heiligten sie das Haus Jahwes
  rationale: Bewahrt die Wiederholung der Wurzel קדשׁ und die traditionelle biblische Bezeichnung „Haus Jahwes“; im Zusammenhang schließt das Heiligen die kultische Reinigung ein.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: acht Tage lang
  rationale: Gibt die bezeichnete Dauer klar und idiomatisch wieder.
- source_word: כִּלּוּ
  choice: waren sie damit fertig
  rationale: Natürliches Deutsch für den Abschluss des zuvor beschriebenen Werks; „damit“ stellt den Bezug eindeutig her.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner weithin gebräuchlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt den Eigennamecharakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von קדשׁ im Tempelkontext
  choice: heiligen / Heiligung
  alternative: reinigen / Reinigung
  rationale: Der unmittelbare Kontext umfasst kultische Reinigung, doch קדשׁ bezeichnet ausdrücklich das Heiligen. Die Übersetzung bewahrt diesen weiteren und theologisch spannungsreichen Ausdruck, statt ihn auf Reinigung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Datumsangaben sind idiomatisch formuliert; die kultische Sprache bleibt bewusst erhalten. Der Fußnotenmarker wurde bei „Vorhalle Jahwes“ gesetzt, da er sich auf אוּלָם bezieht.
