source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: de
  text: Und jeder, der den HERRN, den Gott Israels, nicht suchen würde, sollte getötet werden – vom Geringen bis zum Großen[a], vom Mann bis zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Kleinsten bis zum Größten“. Die hebräische Wendung schließt die gesamte Gemeinschaft ohne Rücksicht auf Rang oder Bedeutung ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Und jeder, der
  rationale: Die umfassende Relativkonstruktion bezeichnet ausnahmslos jeden, auf den die folgende Bedingung zutrifft.
- source_word: לֹא יִדְרֹשׁ
  choice: nicht suchen würde
  rationale: דרשׁ bezeichnet im religiösen Sprachgebrauch der Chronik das ernsthafte Suchen nach bzw. die Hinwendung zu Gott. Der deutsche Konjunktiv gibt im Kontext des Eides den bedingenden Charakter wieder.
- source_word: לַיהוָה
  choice: den HERRN
  rationale: Der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Genitivverbindung identifiziert JHWH als Israels Gott.
- source_word: יוּמָת
  choice: sollte getötet werden
  rationale: Der Hofal von מות ist kausativ-passiv und bezeichnet ausdrücklich das Getötetwerden. In der erzählenden Wiedergabe der Eidesbestimmung bewahrt „sollte“ deren verbindlichen Rechtscharakter.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: vom Geringen bis zum Großen
  rationale: Die Wendung drückt die vollständige soziale Reichweite aus; „gering“ und „groß“ vermeiden eine unbegründete Beschränkung auf das Lebensalter.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: vom Mann bis zur Frau
  rationale: Die singuläre Paarform des Hebräischen wird bewahrt und ergänzt die Aussage umfassender Geltung.
theological_decisions:
- issue: Wiedergabe der schweren Bundesstrafe
  choice: Die ausdrückliche Tötungsbestimmung bleibt mit „sollte getötet werden“ ungemildert erhalten.
  alternative: „sollte sterben“ oder eine Deutung als Ausschluss aus der Gemeinschaft
  rationale: יוּמָת bezeichnet im Hofal nicht bloß das Sterben, sondern das Getötetwerden. Eine symbolische oder abgeschwächte Wiedergabe wäre sprachlich nicht begründet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-feierliche Sprache des berichteten Bundeseides bleibt erhalten; die Härte der Aussage wird weder abgeschwächt noch erläutert. Die Wiederholung „vom … bis …“ bildet die umfassenden hebräischen Paarformeln nach.
