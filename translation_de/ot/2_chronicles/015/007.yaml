  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: de
  text: Ihr aber seid stark, und lasst eure Hände nicht schlaff werden[a]; denn für euer Tun gibt es Lohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bild von schlaff werdenden Händen meint, dass Kraft, Entschlossenheit oder Mut nachlassen.
    reason: Erläuterung eines hebräischen Idioms
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt die Angesprochenen kontrastierend hervor. „Ihr aber“ gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: חִזְקוּ
  choice: seid stark
  rationale: Der pluralische Imperativ fordert zu Stärke und Standhaftigkeit auf. „Seid stark“ ist direkt und wahrt die Form des hebräischen Ausdrucks.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: und lasst eure Hände nicht schlaff werden
  rationale: Die Wendung bezeichnet idiomatisch das Nachlassen von Kraft, Entschlossenheit oder Mut. Die bildhafte Rede von den Händen bleibt erhalten und ist im Deutschen verständlich.
- source_word: כִּי יֵשׁ
  choice: denn … gibt es
  rationale: כִּי begründet die Ermahnung, und יֵשׁ ist eine Existenzpartikel. Die Wiedergabe bewahrt den begründenden Zusammenhang, ohne ausdrücklich eine Zukunftsform einzuführen.
- source_word: שָׂכָר
  choice: Lohn
  rationale: Das Substantiv kann Lohn, Belohnung oder Vergeltung bezeichnen. „Lohn“ ist prägnant und lässt die Art der zugesagten Entlohnung offen.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: für euer Tun
  rationale: פְעֻלָּה bezeichnet Tätigkeit, Werk oder Arbeit. „Euer Tun“ ist im Deutschen natürlich und umfasst sowohl Arbeit als auch konkrete Taten, ohne den Sinn unnötig einzuengen.
theological_decisions:
- issue: Art der Vergeltungs- beziehungsweise Lohnsprache
  choice: denn für euer Tun gibt es Lohn
  alternative: denn eure Arbeit wird belohnt
  rationale: Der Text nennt Lohn als Motivation für treues Handeln, legt aber weder dessen genaue Gestalt noch eine umfassende Lehre von Verdienst fest. Die existentielle Formulierung des Hebräischen und die theologische Offenheit bleiben gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das Körperbild des Hebräischen bleiben erhalten; der Satz ist zugleich für heutige Leser unmittelbar verständlich.
