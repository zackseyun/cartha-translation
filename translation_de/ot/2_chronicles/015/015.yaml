base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: de
  text: Und ganz Juda freute sich über den Schwur; denn sie hatten mit ihrem ganzen Herzen geschworen und ihn mit ihrem ganzen Willen gesucht. Er ließ sich von ihnen finden[a], und Jahwe gab ihnen ringsum Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Er wurde von ihnen gefunden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: Und ganz Juda freute sich
  rationale: Die kollektive Bezeichnung „ganz Juda“ meint das Volk beziehungsweise das Königreich Juda; „freute sich“ gibt שמח natürlich und würdig wieder.
- source_word: עַל הַשְּׁבוּעָה
  choice: über den Schwur
  rationale: עַל bezeichnet hier bei einem Verb der Freude deren Gegenstand beziehungsweise Anlass. „Über den Schwur“ ist im Deutschen idiomatisch.
- source_word: כִּי בְכָל־לְבָבָם נִשְׁבָּעוּ
  choice: denn sie hatten mit ihrem ganzen Herzen geschworen
  rationale: כִּי begründet die Freude. Das Plusquamperfekt verdeutlicht, dass der Schwur der zuvor vollzogene Grund dafür war; „mit ihrem ganzen Herzen“ bewahrt das hebräische Bild.
- source_word: וּבְכָל־רְצוֹנָם בִּקְשֻׁהוּ
  choice: und ihn mit ihrem ganzen Willen gesucht
  rationale: רָצוֹן kann Wille, Verlangen oder Wohlgefallen bezeichnen. „Mit ihrem ganzen Willen“ bewahrt die substantivische Form, die Parallelität zu „mit ihrem ganzen Herzen“ und die bewusste, ungeteilte Hinwendung.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Er ließ sich von ihnen finden
  rationale: Der Niphal von מצא kann formal „wurde gefunden“ heißen; im Zusammenhang des Suchens nach Gott bringt „ließ sich finden“ die relationale und theologische Nuance idiomatisch zum Ausdruck, ohne die wörtlichere Möglichkeit zu verschweigen.
- source_word: וַיָּנַח יְהוָה לָהֶם מִסָּבִיב
  choice: und Jahwe gab ihnen ringsum Ruhe
  rationale: Der Hiphil von נוח bedeutet hier, Ruhe zu geben beziehungsweise zu verschaffen. „Ringsum“ gibt מִסָּבִיב knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen.
- issue: Bedeutung des Niphal וַיִּמָּצֵא לָהֶם
  choice: Er ließ sich von ihnen finden
  alternative: Er wurde von ihnen gefunden
  rationale: Die gewählte Formulierung gibt im Zusammenhang Gottes zugängliche Antwort auf ihr Suchen wieder. Die grammatisch wörtlichere Passivform bleibt in der Fußnote erhalten, sodass die Spannung nicht verdeckt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der kollektive Ausdruck „ganz Juda“ und das Herzbild bleiben erhalten; das Semikolon und die Satzteilung vermeiden einen überladenen deutschen Satz.
