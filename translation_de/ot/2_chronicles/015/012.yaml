  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: de
  text: Und sie traten in den Bund ein, um Jahwe, den Gott ihrer Väter, mit ganzem Herzen und mit ganzer Seele zu suchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: sie traten in den Bund ein
  rationale: Die Verbindung von בוא mit בַבְּרִית bezeichnet hier den Eintritt in eine verbindliche Bundesverpflichtung. „In den Bund eintreten“ ist im Deutschen natürlich und wahrt das Bild des hebräischen Ausdrucks.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דרש bezeichnet im religiösen Zusammenhang die bewusste Hinwendung zu Gott und das Verlangen, nach seinem Willen zu leben; „suchen“ gibt dies knapp und sachgerecht wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: den Gott ihrer Väter
  rationale: Die Formulierung bewahrt die ausdrücklich männliche Bezeichnung אבות und den Bezug auf den von den Vorvätern verehrten Bundesgott.
- source_word: בְּכָל לְבָבָם
  choice: von ganzem Herzen
  rationale: Der etablierte deutsche Ausdruck vermittelt die vollständige innere Ausrichtung von Wille, Denken und Gesinnung.
- source_word: וּבְכָל נַפְשָׁם
  choice: und mit ganzer Seele
  rationale: „Seele“ wahrt die traditionelle Bundesformel und lässt die Bedeutungsbreite von נפש — Leben, Person, Selbst — anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als persönlicher Bundesname.
- issue: Geschlechtsspezifische Sprache in אֲבוֹתֵיהֶם
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: „Väter“ entspricht der maskulinen Pluralform des Ausgangstextes und erhält zugleich den biblischen Ausdruck „Gott der Väter“.
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: Seele
  alternative: ganzem Leben / ganzem Sein
  rationale: Im Parallelismus mit „Herz“ bezeichnet das Wort die ganze Person in ihrer lebendigen Hingabe. „Seele“ wahrt die vertraute Formulierung, ohne eine technisch-dualistische Anthropologie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, klingt jedoch idiomatisch. Keine Fußnote ist nötig, da „in den Bund eintreten“ die hebräische Wendung unmittelbar und verständlich wiedergibt.
