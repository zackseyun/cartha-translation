  text: וּ/מִלְחָמָ֖ה לֹ֣א הָיָ֑תָה עַ֛ד שְׁנַת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ לְ/מַלְכ֥וּת אָסָֽא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: de
  text: Und es gab keinen Krieg bis zum fünfunddreißigsten Jahr der Regierung Asas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Jahr fünfunddreißig der Regierung Asas“. Manche Ausleger beziehen diese Zahl auf ein umfassenderes chronologisches System und nicht ausschließlich auf Asas eigene Regierungsjahre, um sie mit verwandten Stellen in Einklang zu bringen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: Und es gab keinen Krieg
  rationale: Die Verbindung aus מִלְחָמָה, Negation und der hier existenziell gebrauchten Form von היה wird im modernen Deutschen natürlich mit „es gab keinen Krieg“ wiedergegeben; das vorangestellte וּ bleibt als „Und“ erhalten.
- source_word: עַד
  choice: bis zum
  rationale: עַד bezeichnet den zeitlichen Endpunkt der kriegsfreien Zeit. Zusammen mit der Jahresangabe ist „bis zum“ die natürliche deutsche Form.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: fünfunddreißigsten Jahr
  rationale: Die Konstruktverbindung mit der Kardinalzahl bezeichnet in dieser Regierungsjahrformel ordinal das fünfunddreißigste Jahr.
- source_word: לְמַלְכוּת
  choice: der Herrschaft
  rationale: מַלְכוּת bezeichnet hier Asas königliche Herrschaft beziehungsweise Regierungszeit. „Herrschaft“ bewahrt den Bezug auf sein Königtum und klingt in der Jahresformel natürlich.
- source_word: אָסָא
  choice: Asas
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form „Asa“ wiedergegeben; der Genitiv lautet „Asas“.
theological_decisions:
- issue: Chronologische Angabe im Verhältnis zu den übrigen Berichten über Asa
  choice: Die hebräische Regierungsjahrformel wird unmittelbar als „bis zum fünfunddreißigsten Jahr der Herrschaft Asas“ übersetzt.
  alternative: Die Zahl auf ein umfassenderes chronologisches System beziehen oder sie zur Harmonisierung mit verwandten Stellen ändern.
  rationale: Der masoretische Text nennt ausdrücklich das fünfunddreißigste Jahr und verbindet es mit Asas Herrschaft. Die Übersetzung bewahrt diese Aussage und die daraus entstehende chronologische Spannung, ohne sie im Haupttext harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schlichte hebräische Existenzkonstruktion wird idiomatisch wiedergegeben; die chronologische Spannung bleibt gewahrt.
