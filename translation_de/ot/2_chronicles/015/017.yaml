source:
  edition: WLC
  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: de
  text: Die Höhenheiligtümer wurden jedoch nicht aus Israel entfernt; Asas Herz war dennoch sein Leben lang ungeteilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: Höhenheiligtümer
  rationale: Bezeichnet kultische Stätten auf Anhöhen oder sogenannte Höhen; „Höhenheiligtümer“ macht die kultische Bedeutung im modernen Deutsch deutlich.
- source_word: לֵבָב ... שָׁלֵם
  choice: Herz ... ungeteilt
  rationale: שָׁלֵם bedeutet hier ganz, vollständig beziehungsweise ungeteilt. Die Formulierung bewahrt das Bild des Herzens und drückt ungeteilte Loyalität aus, ohne ausdrücklich „vollkommen“ oder „sündlos“ zu behaupten.
- source_word: כָּל־יָמָיו
  choice: sein Leben lang
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Wendung „alle seine Tage“.
theological_decisions:
- issue: Spannung zwischen den nicht entfernten Höhenheiligtümern und Asas ungeteiltem Herzen
  choice: Die beiden Aussagen ohne Harmonisierung nebeneinander stehen lassen
  alternative: Asas Herz als „vollkommen“ oder ausdrücklich „dem HERRN völlig ergeben“ bezeichnen
  rationale: Der hebräische Text stellt das Fortbestehen der Höhenheiligtümer und die Ganzheit von Asas Herz bewusst nebeneinander. „Ungeteilt“ wahrt diese Spannung und vermeidet sowohl den Gedanken moralischer Sündlosigkeit als auch eine nicht ausdrücklich genannte Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höhenheiligtümer“ ist verständlicher als das missverständliche bloße „Höhen“; „ungeteilt“ gibt die theologische Aussage knapp wieder und bewahrt ihre Spannung.
