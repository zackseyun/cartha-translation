  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: de
  text: Ein Volk wurde von einem anderen zerschlagen und eine Stadt von einer anderen; denn Gott brachte sie durch Bedrängnis jeder Art in Verwirrung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn Gott stürzte sie in allerlei Bedrängnis.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: wurde … zerschlagen
  rationale: Das Pual Perfekt von כתת bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. Die singularischen Kollektiva »Volk« und »Stadt« werden im Deutschen jeweils mit dem Singular wiedergegeben.
- source_word: גוֹי בְּגוֹי
  choice: ein Volk … von einem anderen
  rationale: Die Präposition בְּ bezeichnet hier die feindliche Einwirkung eines Volkes auf ein anderes. Die Formulierung macht die Beziehung im natürlichen Deutschen deutlich, ohne sie über den hebräischen Sinn hinaus auszudeuten.
- source_word: וְעִיר בְּעִיר
  choice: eine Stadt von einer anderen
  rationale: Die parallele Formulierung bewahrt die knappe Struktur und bezeichnet den Konflikt zwischen einzelnen Städten.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für die zuvor beschriebene Verwüstung ein.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Form bezeichnet hier aufgrund des singularischen Prädikats den einen Gott.
- source_word: הֲמָמָם
  choice: stürzte sie
  rationale: Das Verb המם bezeichnet das Versetzen in Unruhe, Verwirrung oder Bestürzung. Zusammen mit »in allerlei Bedrängnis« ergibt sich eine natürliche deutsche Wiedergabe, die Gottes aktive Verursachung wahrt.
- source_word: בְּכָל צָרָה
  choice: in allerlei Bedrängnis
  rationale: Die Wendung umfasst Bedrängnis jeder Art. »Allerlei« gibt die umfassende Kraft von כָּל idiomatisch wieder.
theological_decisions:
- issue: Urheberschaft des Unheils
  choice: Gott stürzte sie in allerlei Bedrängnis
  alternative: Gott ließ zu, dass sie in Bedrängnis gerieten
  rationale: Im Hebräischen ist Gott das ausdrückliche Subjekt eines aktiven Verbs. Die Übersetzung bewahrt diese göttliche Urheberschaft und schwächt sie nicht zu bloßer Zulassung ab.
- issue: Bedeutungsbreite von הֲמָמָם
  choice: Bedrängnis als Folge göttlich verursachter Erschütterung
  alternative: Gott brachte sie durch allerlei Not in Verwirrung
  rationale: Das Verb kann Unruhe, Verwirrung oder Bestürzung bezeichnen. Der Haupttext bleibt knapp und natürlich; die Fußnote erhält die mögliche ausdrückliche Verwirrungskomponente.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zerschlagen« bewahrt die Gewalt des hebräischen Verbs; »allerlei Bedrängnis« ist verständlich und gibt den umfassenden Ausdruck knapp wieder.
