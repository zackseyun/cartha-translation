- from: Ein Volk wurde von einem anderen zerschlagen und eine Stadt von einer anderen; denn Gott stürzte sie in allerlei Bedrängnis.[a]
  to: Ein Volk wurde von einem anderen zerschlagen und eine Stadt von einer anderen; denn Gott brachte sie durch Bedrängnis jeder Art in Verwirrung.[a]
  rationale: Der revidierte Haupttext bringt die Verwirrungsbedeutung von המם ausdrücklich zum Ausdruck und versteht בכל צרה als die umfassende Bedrängnis, durch die Gott sie in Verwirrung brachte. Die bisherige Lesart, die den Akzent auf das Hineinstürzen in Not legt, bleibt als zulässige lexikalische Alternative in der Fußnote erhalten.
