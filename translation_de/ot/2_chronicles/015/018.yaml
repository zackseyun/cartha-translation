  text: וַ/יָּבֵ֞א אֶת קָדְשֵׁ֥י אָבִ֛י/ו וְ/קָֽדָשָׁ֖י/ו בֵּ֣ית הָ/אֱלֹהִ֑ים כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: de
  text: 'Er brachte die heiligen Gaben seines Vaters und seine eigenen heiligen Gaben in das Haus Gottes: Silber, Gold und Geräte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי / קָדָשָׁיו
  choice: heilige Gaben
  rationale: Die Ausdrücke bezeichnen hier für Gott ausgesonderte und dem Heiligtum übergebene Wertgegenstände. „Heilige Gaben“ gibt sowohl ihre Weihe als auch ihren Charakter als dargebrachter Besitz natürlich wieder.
- source_word: כֵלִים
  choice: Geräte
  rationale: Der Sammelbegriff kann Gefäße, Gerätschaften oder andere Gegenstände bezeichnen. „Geräte“ bewahrt diese Bedeutungsbreite im Zusammenhang des Tempelschatzes.
theological_decisions:
- issue: Bezug des Suffixes in וְקָדָשָׁיו
  choice: seine eigenen heiligen Gaben
  alternative: dessen heilige Gaben
  rationale: Das Suffix bezieht sich im natürlichen Satzverlauf auf das handelnde Subjekt Asa und steht im Gegensatz zu den Gaben seines Vaters. „Eigenen“ macht diesen Kontrast im Deutschen deutlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung nach dem Doppelpunkt folgt der hebräischen Apposition und bezeichnet die heiligen Gaben näher.
