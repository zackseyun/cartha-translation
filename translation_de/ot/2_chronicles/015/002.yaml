base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: de
  text: 'Er ging Asa entgegen und sagte zu ihm: „Hört mir zu, Asa und ganz Juda und Benjamin! Jahwe ist mit euch, solange ihr mit ihm seid. Wenn ihr ihn sucht, wird er sich von euch finden lassen[a]; wenn ihr ihn aber verlasst, wird er euch verlassen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: „wird er von euch gefunden werden“.'
    reason: Lexikalisch-formale Alternative für das Nifal יִמָּצֵא.
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Er ging Asa entgegen
  rationale: Die Bewegungsangabe mit לִפְנֵי bezeichnet hier idiomatisch das Entgegengehen; die knappe deutsche Form bleibt nah am hebräischen Erzählstil.
- source_word: שְׁמָעוּנִי
  choice: Hört mir zu
  rationale: Der Pluralimperativ mit Suffix richtet sich trotz der ersten Anrede an Asa sowie Juda und Benjamin; „Hört mir zu“ ist natürlich und bewahrt den eindringlichen prophetischen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: mit euch ... mit ihm
  rationale: Die wiederholte Präposition wird beibehalten, um die rhetorische Gegenseitigkeit des Hebräischen sichtbar zu machen.
- source_word: בִּהְיוֹתְכֶם
  choice: solange ihr ... seid
  rationale: Die Infinitivkonstruktion mit בְּ drückt hier eine zeitlich-konditionale Beziehung aus; „solange“ gibt deren fortdauernden Charakter idiomatisch wieder.
- source_word: תִּדְרְשֻׁהוּ
  choice: ihn sucht
  rationale: דרש bezeichnet im religiösen und bundestheologischen Zusammenhang das ernsthafte Suchen nach Gott.
- source_word: יִמָּצֵא לָכֶם
  choice: wird er sich von euch finden lassen
  rationale: Diese idiomatische deutsche Wiedergabe wahrt die passive/reflexive Form des Nifal und vermeidet, den Satz aktiv zu „ihr werdet ihn finden“ umzudeuten; die formal knappere Möglichkeit steht in der Fußnote.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: wenn ihr ihn ... verlasst, wird er euch verlassen
  rationale: Die Wiederholung desselben Verbs erhält die auffällige Gegenseitigkeit und das Wortspiel des Ausgangstextes.
theological_decisions:
- issue: Bedingte Gegenseitigkeit der Bundesaussage
  choice: Jahwes Mitsein wird ausdrücklich damit verbunden, dass das Volk mit ihm ist; Suchen und Verlassen haben entsprechende Folgen.
  alternative: Die Aussagen lediglich als Beschreibung menschlichen Erlebens abzuschwächen.
  rationale: Der hebräische Text verwendet klare Bedingungssätze und bewusst wechselseitige Formulierungen. Die Übersetzung bewahrt diese Spannung, ohne daraus ein weitergehendes Lehrsystem abzuleiten.
- issue: Göttliches Gefundenwerden
  choice: „wird er sich von euch finden lassen“
  alternative: „wird er von euch gefunden werden“ oder „ihr werdet ihn finden“
  rationale: Die gewählte Formulierung bildet das Nifal idiomatisch ab und lässt sowohl Gottes Zugänglichkeit als auch das vorausgehende menschliche Suchen stehen, ohne deren Verhältnis dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem prophetischem Ton. Die Anrede bleibt im Plural, und die parallelen Formulierungen des Hebräischen werden nach Möglichkeit erhalten.
