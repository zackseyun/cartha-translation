  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: de
  text: Und in jenen Zeiten gab es keinen Frieden für den, der hinausging, und für den, der hereinkam[a], denn zahlreiche Unruhen lasteten auf allen Bewohnern der Länder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »hinausgehen und hereinkommen« ist eine hebräische Redensart für gewöhnliche Bewegung im Alltag, besonders für Reisen oder öffentliche Tätigkeit.
    reason: cultural_note
  - marker: b
    text: 'Oder: »denn große Wirren kamen über alle Bewohner der Länder«. Das hebräische Wort kann Unruhe, Verwirrung oder Panik bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: Und in jener Zeit
  rationale: Die Wendung bezeichnet die damalige geschichtliche Lage. Das kollektive deutsche Singularidiom „in jener Zeit“ gibt den Sinn des hebräischen Plurals natürlich wieder.
- source_word: אֵין שָׁלוֹם
  choice: gab es keinen Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Sicherheit. „Keinen Frieden“ bewahrt die Bedeutungsbreite; der folgende Zusammenhang macht die konkrete Unsicherheit deutlich.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: für den, der hinausging, und für den, der hereinkam
  rationale: Die substantivierten Partizipien sind generisch. Die wörtlich erhaltene Paarformel bezeichnet alltägliche Bewegungsfreiheit, besonders Reisen und öffentliche Tätigkeit.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für den fehlenden Frieden ein; „denn“ ist im gehobenen, aber heutigen Erzählstil natürlich.
- source_word: מְהוּמֹת רַבּוֹת
  choice: große Unruhen
  rationale: מְהוּמָה kann Aufruhr, Verwirrung oder Panik bezeichnen. Zusammen mit רַבּוֹת ist „große Unruhen“ idiomatisch und lässt die genaue Art der Erschütterung offen.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: lasteten auf allen Bewohnern der Länder
  rationale: „Lasteten auf“ bewahrt das hebräische Bild von Unruhen, die auf Menschen liegen oder sie bedrängen. Der Plural „der Länder“ entspricht הָאֲרָצוֹת und verweist auf mehrere Gebiete.
theological_decisions: []
