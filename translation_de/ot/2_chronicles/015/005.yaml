  register: Modernes, würdiges Standarddeutsch. Die hebräische Paarformel und das Bild der auf den Bewohnern lastenden Unruhen bleiben erhalten; erklärungsbedürftige Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
