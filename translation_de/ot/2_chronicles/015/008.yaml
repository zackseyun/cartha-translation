source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: de
  text: Als Asa diese Worte und die Prophezeiung des Propheten Oded[a] hörte, fasste er Mut. Er beseitigte die abscheulichen Dinge aus dem ganzen Land Juda und Benjamin sowie aus den Städten, die er im Bergland Ephraim eingenommen hatte. Er erneuerte auch den Altar Jahwes, der vor der Vorhalle Jahwes stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Prophezeiung des Propheten Oded“. Im Zusammenhang wird die prophetische Botschaft Asarja, dem Sohn Odeds, zugeschrieben; daher wird die Stelle teils entsprechend gedeutet oder textkritisch anders eingeordnet.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: Als … hörte
  rationale: Die Präposition mit Infinitiv leitet einen temporalen Nebensatz ein; „Als Asa … hörte“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann „Worte“ oder „Dinge/Angelegenheiten“ bedeuten. Der unmittelbare Bezug auf die zuvor verkündete Botschaft spricht hier für „Worte“.
- source_word: וְהַנְּבוּאָה
  choice: und die Prophezeiung
  rationale: „Prophezeiung“ wahrt den formalen Bezug auf eine prophetisch vermittelte Botschaft, ohne ihren Inhalt weiter festzulegen.
- source_word: עֹדֵד הַנָּבִיא
  choice: des Propheten Oded
  rationale: Die hebräische Verbindung wird als Zugehörigkeitsangabe verstanden. Der masoretische Text nennt Oded; die Spannung zum Kontext wird nicht harmonisiert, sondern in einer Fußnote kenntlich gemacht.
- source_word: הִתְחַזַּק
  choice: fasste er Mut
  rationale: Der Hitpael bezeichnet hier, dass Asa sich durch das Gehörte stärken beziehungsweise ermutigen ließ. „Fasste Mut“ ist idiomatisch und bewahrt den reflexiven Sinn.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: Er beseitigte die abscheulichen Götzenbilder
  rationale: שִׁקּוּצִים bezeichnet in diesem kultischen Zusammenhang verabscheute, mit Götzendienst verbundene Gegenstände. „Götzenbilder“ macht den konkreten Bezug verständlich; „abscheulich“ bewahrt die wertende Kraft des Ausdrucks.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: im ganzen Land Juda und Benjamin
  rationale: אֶרֶץ bezeichnet hier das gesamte Herrschafts- beziehungsweise Stammesgebiet. Nach „beseitigen“ ist im Deutschen die Ortsangabe mit „in“ natürlicher als eine wörtliche Herkunftsangabe mit „aus“.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: sowie in den Städten, die er im Bergland Ephraim erobert hatte
  rationale: לכד bedeutet „erobern/einnehmen“. מֵהַר אֶפְרָיִם wird geografisch auf die Lage der Städte im Bergland Ephraim bezogen; das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: וַיְחַדֵּשׁ
  choice: erneuerte er
  rationale: Das Piel von חדשׁ bedeutet „erneuern/wiederherstellen“. „Erneuerte“ bewahrt die lexikalische Weite und beschränkt den Vorgang nicht auf eine bloße Reparatur.
- source_word: מִזְבַּח יְהוָה
  choice: den Altar Jahwes
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben; der Gottesname steht als Eigenname.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Tetragrammaton wird als Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: der vor der Vorhalle Jahwes stand
  rationale: אוּלָם bezeichnet die Vorhalle des Tempels. „Vor“ erhält die räumliche Beziehung von לִפְנֵי; „stand“ ergänzt im Deutschen idiomatisch das im Hebräischen vorausgesetzte Prädikat.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Eigennamen. „Jahwe“ bewahrt diesen Charakter und ist die im Deutschen übliche wissenschaftliche Transkription.
- issue: Textliche und kontextuelle Spannung bei „Oded, der Prophet“
  choice: Der masoretische Text wird im Haupttext als „des Propheten Oded“ wiedergegeben.
  alternative: „Asarja, der Sohn des Propheten Oded“ beziehungsweise eine andere Angleichung an den Kontext
  rationale: Der vorgelegte WLC-Text lautet עֹדֵד הַנָּבִיא. Eine Harmonisierung mit Asarja, dem Sohn Odeds, würde den überlieferten Wortlaut ersetzen. Die kontextuelle Spannung wird daher in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Kultische Fachbegriffe werden verständlich wiedergegeben; „Vorhalle“ bleibt architektonisch präzise und allgemein zugänglich. Der Gottesname erscheint einheitlich als „Jahwe“.
