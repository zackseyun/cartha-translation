source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: de
  text: Auch Maacha, die Mutter König Asas, setzte er als Königsmutter ab, weil sie für Aschera[b] ein abscheuliches Kultbild[a] angefertigt hatte. Asa hieb ihr Kultbild um, zermalmte es und verbrannte es im Kidrontal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »ein Schreckbild«, »ein abscheuliches Bild« oder »ein grässliches Ding«. Das hebräische Wort bezeichnet einen abstoßenden oder erschreckenden Kultgegenstand.'
    reason: lexical_alternative
  - marker: b
    text: »Aschera« kann die Göttin oder das mit ihr verbundene Kultsymbol bezeichnen; ältere Übersetzungen geben den Ausdruck bisweilen mit »Hain« wieder.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »am Bach Kidron« oder »im Wadi Kidron«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Kennzeichnet die Ausweitung von Asas Reform sogar auf eine enge Angehörige des Königshauses, ohne den Nachdruck im Deutschen künstlich zu verstärken.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: die Mutter König Asas
  rationale: Gibt die hebräische Verwandtschaftsangabe direkt und in natürlicher deutscher Wortstellung wieder.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: setzte er als Königsmutter ab
  rationale: Im judäischen Königshaus bezeichnet גְּבִירָה den anerkannten Rang der Königsmutter; „absetzen“ bringt die Entfernung aus dieser Stellung knapp zum Ausdruck.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: weil sie für Aschera … angefertigt hatte
  rationale: Die Relativkonstruktion nennt hier den Grund für ihre Absetzung. „Für Aschera“ bewahrt die mögliche Beziehung zur Göttin beziehungsweise zu ihrem Kultsymbol.
- source_word: מִפְלָצֶת
  choice: ein abscheuliches Kultbild
  rationale: Das seltene Substantiv bezeichnet einen abstoßenden oder erschreckenden Kultgegenstand. „Kultbild“ erschließt den sachlichen Zusammenhang, während „abscheulich“ die wertende Bedeutung wahrt.
- source_word: וַיִּכְרֹת
  choice: hieb … um
  rationale: Das Verb bedeutet abschneiden oder niederhauen; bei einem offenbar stehenden Kultgegenstand ist „umhauen“ idiomatisch.
- source_word: וַיָּדֶק
  choice: zermalmte es
  rationale: Das Verb beschreibt das Zerkleinern bis zu kleinen Stücken oder Staub und ist stärker als ein bloßes Zerbrechen.
- source_word: וַיִּשְׂרֹף
  choice: verbrannte es
  rationale: Direkte Wiedergabe des Verbs für das Verbrennen.
- source_word: בְּנַחַל קִדְרוֹן
  choice: im Kidrontal
  rationale: נַחַל kann Bach, Wadi oder Talrinne bezeichnen; „Kidrontal“ ist geografisch verständlich und lässt die genaue Wasserführung offen.
theological_decisions:
- issue: Bedeutung von אֲשֵׁרָה
  choice: Aschera als Eigenname mit erläuternder Fußnote
  alternative: Aschera-Pfahl; heiliger Pfahl; Hain
  rationale: Der Ausdruck kann die kanaanäische Göttin oder das mit ihr verbundene Kultsymbol bezeichnen. Die Transliteration bewahrt diese Mehrdeutigkeit, statt die genaue Gestalt des Gegenstands festzulegen.
- issue: Königlicher Titel גְּבִירָה
  choice: Königsmutter
  alternative: Herrin; große Dame
  rationale: Im judäischen Hofkontext bezeichnet der Titel am ehesten den offiziellen Rang der Mutter oder einer in dieser Funktion stehenden älteren Angehörigen des Königs.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe erzählerische Abfolge der drei Zerstörungshandlungen bleibt erhalten; historische Kultbegriffe werden nicht konfessionell ausgedeutet.
