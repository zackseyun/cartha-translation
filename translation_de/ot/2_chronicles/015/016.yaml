  source_fidelity: 'Der deutsche Text gibt den hebräischen Satzbau und Inhalt zuverlässig wieder: die hervorgehobene Einbeziehung Maachas, ihre Absetzung aus dem Rang der Königsmutter, der begründende Relativsatz, die dreigliedrige Zerstörungsfolge sowie die Ortsangabe. „Für Aschera“ wahrt die im Hebräischen vorhandene Auslegungsfrage, ob der Bezug unmittelbar der Gottheit oder dem Kultsymbol gilt.'
  naturalness: Modernes, gut lesbares Standarddeutsch in angemessen würdigem Erzählregister. „setzte er als Königsmutter ab“, „hieb … um“, „zermalmte“ und „im Kidrontal“ sind idiomatisch und präzise.
  terminology: „Königsmutter“ trifft גְּבִירָה im königlichen Kontext. „Aschera“ ist als nicht vorschnell spezifizierender Kultbegriff sinnvoll beibehalten. „abscheuliches Kultbild“ gibt die pejorative Bedeutung von מִפְלָצֶת wieder, ohne eine über die Quelle hinausgehende konkrete Objektform zu behaupten. Die Fußnoten sind korrekt verankert und inhaltlich passend.
