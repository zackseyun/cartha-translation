  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Bezüge des Hebräischen zutreffend wieder: kollektive Bedrängnis, Rückkehr zu Jahwe, Suche nach ihm und sein Sich-finden-Lassen für sie. „in ihrer Bedrängnis“ ist als idiomatische kollektivische Wiedergabe des Singularsuffixes vertretbar und wird transparent erläutert.'
