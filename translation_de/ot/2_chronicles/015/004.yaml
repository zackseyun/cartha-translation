id: 2CH.15.4
reference: 2 Chronicles 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: de
  text: Doch in ihrer Bedrängnis[a] kehrten sie zu Jahwe, dem Gott Israels, zurück. Sie suchten ihn, und er ließ sich von ihnen finden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in seiner Bedrängnis“; der Singular bezieht sich kollektiv auf Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er wurde von ihnen gefunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrten sie … zurück
  rationale: שׁוב bezeichnet hier die erneute Hinwendung zu Gott. Das deutsche „zurückkehren“ bewahrt sowohl den Bewegungssinn als auch den Gedanken der Wiederherstellung der Beziehung.
- source_word: בַּצַּר לוֹ
  choice: in ihrer Bedrängnis
  rationale: Wörtlich steht ein Singular („in seiner Bedrängnis“), der sich kollektiv auf Israel bezieht. Der Plural entspricht den unmittelbar folgenden Pluralformen und ist im modernen Deutsch klarer.
- source_word: עַל יְהוָה
  choice: zu Jahwe
  rationale: עַל bezeichnet mit שׁוב hier das Ziel der erneuten Hinwendung. „Zu … zurückkehren“ ist die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Namen und einem Titel wie „der HERR“.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die direkte Wiedergabe der hebräischen Genitivverbindung erhält die Identifikation Jahwes als Israels Gott.
- source_word: וַיְבַקְשֻׁהוּ
  choice: Sie suchten ihn
  rationale: בקשׁ mit Gott als persönlichem Objekt bezeichnet das bewusste Suchen seiner Nähe und Hilfe; „suchen“ ist knapp, natürlich und lässt die inhaltliche Weite bestehen.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: er ließ sich von ihnen finden
  rationale: Der Nifal von מצא bedeutet wörtlich „gefunden werden“, kann in dieser auf Gott bezogenen Wendung aber idiomatisch seine zugängliche, antwortende Haltung ausdrücken. Die Formulierung klingt im Deutschen nicht nach einem zufälligen Auffinden.
theological_decisions:
- issue: Kollektiver Singular und anschließender Plural
  choice: Der kollektive Bezug auf Israel wird im Haupttext durchgehend pluralisch wiedergegeben.
  alternative: „Doch in seiner Bedrängnis kehrte es … zurück“
  rationale: Das Hebräische beginnt mit Singularformen und wechselt danach zum Plural. Der Plural macht den kollektiven Bezug im Deutschen verständlich; die formnähere Lesart bleibt in der Fußnote erhalten.
- issue: Göttliche Mitwirkung in וַיִּמָּצֵא לָהֶם
  choice: „er ließ sich von ihnen finden“
  alternative: „er wurde von ihnen gefunden“
  rationale: Die gewählte idiomatische Wiedergabe verhindert den unbeabsichtigten Eindruck einer zufälligen Entdeckung und wahrt Gottes personale Beteiligung. Die grammatisch direkte Passivübersetzung wird als echte Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze machen den Wechsel vom Umkehren zum Suchen deutlich. „Bedrängnis“ bewahrt den ernsten Ton von צַר, ohne altertümlich zu wirken.
