source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: de
  text: Lange Zeit war Israel ohne den wahren Gott[a], ohne einen Priester, der lehrte, und ohne Weisung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Gott der Wahrheit« oder »einen wahrhaftigen Gott«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gesetz«, »Unterweisung« oder »Lehre«; das hebräische Wort Tora kann je nach Zusammenhang diese Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Lange Zeit
  rationale: Die Zeitangabe bedeutet idiomatisch eine lange Dauer; das einleitende וְ wird im deutschen Satzfluss nicht eigens wiedergegeben.
- source_word: לְיִשְׂרָאֵל
  choice: war Israel
  rationale: Das לְ bezeichnet hier den Zustand Israels; im Deutschen wird dafür eine Kopulakonstruktion gebraucht.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: ohne den wahren Gott
  rationale: Die Wendung bezeichnet wahrscheinlich den wahrhaftigen beziehungsweise zuverlässigen Gott; die bestimmte Form ist im Blick auf Israel kontextuell angemessen.
- source_word: כֹּהֵן מוֹרֶה
  choice: einen Priester, der lehrte
  rationale: מוֹרֶה ist ein Partizip von ירה und beschreibt die lehrende Aufgabe des Priesters. Der Relativsatz klingt im modernen Deutsch natürlicher als »lehrender Priester«.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: תּוֹרָה kann Gesetz, Unterweisung oder Lehre bedeuten. »Weisung« bewahrt hier die Breite des Begriffs und den Bezug zur priesterlichen Lehrtätigkeit.
theological_decisions:
- issue: Bedeutung von אֱלֹהֵי אֱמֶת
  choice: der wahre Gott
  alternative: ein Gott der Wahrheit / ein wahrhaftiger Gott
  rationale: Die Wiedergabe bezeichnet idiomatisch Israels Gott im Gegensatz zu unwahrer Gottesverehrung, ohne die mögliche Bedeutung der Wahrhaftigkeit oder Treue zu verschweigen.
- issue: Bedeutung von תּוֹרָה
  choice: Weisung
  alternative: Gesetz / Unterweisung / Lehre
  rationale: Der hebräische Ausdruck ist nicht zwingend auf einen Gesetzeskodex verengt. »Weisung« erhält die sachliche und lehrhafte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Konstruktion mit »ohne« bewahrt den hebräischen Parallelismus; »Lange Zeit« ist natürlicher als das wörtliche »viele Tage«.
