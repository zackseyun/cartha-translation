  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: de
  text: Und er versammelte ganz Juda und Benjamin sowie die bei ihnen lebenden Fremden aus Ephraim, Manasse und Simeon. Denn viele aus Israel waren zu ihm übergetreten[a], als sie sahen, dass Jahwe, sein Gott, mit ihm war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatten sich ihm angeschlossen“; wörtlich: „waren auf ihn gefallen“. Die hebräische Wendung bezeichnet hier den Wechsel der Zugehörigkeit zu Asa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: er versammelte
  rationale: Das Qal von קבץ bezeichnet das Zusammenbringen beziehungsweise Versammeln von Menschen. „Versammelte“ ist im Deutschen natürlich und passt zum erzählerischen Zusammenhang.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: ganz Juda und Benjamin
  rationale: Die Stammes- und Gebietsnamen stehen für deren Bevölkerung. Die knappe metonymische Form entspricht dem Hebräischen und ist im Deutschen verständlich.
- source_word: הַגָּרִים עִמָּהֶם
  choice: die bei ihnen lebenden Fremden
  rationale: גרים bezeichnet hier Menschen, die nicht zur einheimischen Bevölkerung gehören, aber unter ihr wohnen. Die Formulierung gibt sowohl den Aufenthaltsstatus als auch עמהם wieder, ohne einen modernen Rechtsbegriff aufzudrängen.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: aus Ephraim, Manasse und Simeon
  rationale: Die Präposition מן bezeichnet ihre Herkunft; „aus“ ist dafür die natürliche deutsche Entsprechung.
- source_word: נָפְלוּ עָלָיו
  choice: waren zu ihm übergetreten
  rationale: Die Wendung bedeutet in einem politischen Zusammenhang, die bisherige Bindung aufzugeben und sich Asa anzuschließen. „Übergetreten“ wahrt den Wechsel der Zugehörigkeit, ohne die im Deutschen unverständliche wörtliche Bildsprache in den Haupttext zu setzen.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: viele aus Israel
  rationale: לרב bezeichnet eine große Anzahl. Die knappe deutsche Wendung gibt diesen adverbialen Sinn idiomatisch wieder.
- source_word: בִּרְאֹתָם
  choice: als sie sahen
  rationale: Der Infinitiv mit ב bezeichnet hier den zeitlichen Umstand, der zugleich den Anlass für ihren Übertritt erkennen lässt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: sein Gott, mit ihm war
  rationale: Die Formulierung bewahrt die Aussage von Gottes Gegenwart und Beistand, ohne sie stärker auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ erhält seinen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Gottes Mitsein
  choice: Jahwe, sein Gott, war mit ihm
  alternative: Jahwe, sein Gott, stand auf seiner Seite
  rationale: „Mit ihm“ lässt offen, wie sich die göttliche Gegenwart und Unterstützung konkret auswirkte, und vermeidet eine weitergehende parteipolitische Deutung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert. Stammesnamen bleiben in der knappen hebräischen Form stehen; erläuternde Zusätze werden vermieden.
