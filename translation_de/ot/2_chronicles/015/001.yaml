source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: de
  text: Der Geist Gottes kam über Asarja, den Sohn Odeds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Geist Gottes war auf Asarja, dem Sohn Odeds.“'
    reason: Die hebräische Wendung הָיְתָה עָלָיו kann sowohl ereignishaft als „kam über ihn“ als auch statischer als „war auf ihm“ verstanden werden.
lexical_decisions:
- source_word: וַעֲזַרְיָהוּ
  choice: Asarja
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form wiedergegeben. Das vorangestellte וַ führt die Erzählung weiter; im isolierten Vers ist dafür kein eigenes deutsches Bindewort nötig.
- source_word: בֶּן עוֹדֵד
  choice: den Sohn Odeds
  rationale: בֶּן bezeichnet hier am natürlichsten die unmittelbare Sohnschaft. Der Genitiv ist im modernen Deutschen klar und idiomatisch.
- source_word: הָיְתָה עָלָיו
  choice: kam über
  rationale: Wörtlich steht „war auf/über ihm“. Im prophetischen Zusammenhang kann die Wendung das Eintreten göttlicher Befähigung bezeichnen; „kam über“ gibt diesen möglichen ereignishaften Sinn natürlich wieder.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Die Konstruktverbindung bezeichnet in diesem prophetischen Zusammenhang Gottes Geist. Obwohl רוּחַ keinen Artikel trägt, ist die Verbindung ihrer Bedeutung nach bestimmt.
theological_decisions:
- issue: Ob רוּחַ אֱלֹהִים unpersönlich als „ein göttlicher Geist“ oder als „der Geist Gottes“ wiederzugeben ist
  choice: der Geist Gottes
  alternative: ein Geist Gottes / ein göttlicher Geist
  rationale: Die Formel führt hier die prophetische Inspiration und Befähigung Asarjas ein. „Der Geist Gottes“ entspricht dem wahrscheinlichsten Sinn, ohne weitergehende dogmatische Aussagen in den Vers hineinzutragen.
- issue: Ob הָיְתָה עָלָיו statisch oder ereignishaft wiederzugeben ist
  choice: kam über
  alternative: war auf ihm / ruhte auf ihm
  rationale: Der Zusammenhang legt den Beginn prophetischer Befähigung nahe. Da die hebräische Formulierung selbst auch statisch verstanden werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und gut verständlich; die echte Mehrdeutigkeit der hebräischen Wendung wird durch die Fußnote erhalten.
