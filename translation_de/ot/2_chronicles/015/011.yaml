  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: de
  text: 'An jenem Tag brachten sie Jahwe Schlachtopfer dar, und zwar von der Beute[a], die sie herbeigebracht hatten: 700 Rinder und 7.000 Schafe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort meint Beute, die im Krieg erlangt wurde.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Kleinvieh und kann Schafe wie auch Ziegen umfassen.
    reason: lexical_scope
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: brachten sie … Schlachtopfer dar
  rationale: זבח bezeichnet im kultischen Zusammenhang das Schlachten beziehungsweise Darbringen von Tieropfern. „Schlachtopfer darbringen“ gibt den rituellen Sinn präzise und in würdigem, verständlichem Deutsch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger der Opfer; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Bestimmung mit Rückbezug auf den erzählten Tag.
- source_word: מִן הַשָּׁלָל
  choice: von der Beute
  rationale: שָׁלָל bezeichnet im Krieg erbeutetes Gut. „Beute“ ist im modernen Deutsch klar und bewahrt den Zusammenhang.
- source_word: הֵבִיאוּ
  choice: die sie herbeigebracht hatten
  rationale: Das Perfekt bezeichnet hier sinnvollerweise eine bereits vor dem Opfer vollzogene Handlung; das Plusquamperfekt macht diese zeitliche Beziehung im Deutschen deutlich.
- source_word: בָּקָר
  choice: Rinder
  rationale: בָּקָר ist eine Kollektivbezeichnung für Rindvieh; „Rinder“ ist breit genug und enger als die unpassend spezifische Wiedergabe „Ochsen“.
- source_word: שְׁבַע מֵאוֹת
  choice: '700'
  rationale: Direkte Wiedergabe der Kardinalzahl in gut lesbarer deutscher Zahlenschreibung.
- source_word: וְצֹאן
  choice: und Schafe und Ziegen
  rationale: צֹאן bezeichnet Kleinvieh beziehungsweise Herdentiere und kann sowohl Schafe als auch Ziegen einschließen. Die ausgeschriebene Doppelbezeichnung macht den Umfang im Haupttext verständlich, ohne ihn auf Schafe zu verengen.
- source_word: שִׁבְעַת אֲלָפִים
  choice: '7.000'
  rationale: Direkte Wiedergabe der Kardinalzahl nach deutscher Zahlenschreibung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Wendung „Schlachtopfer darbringen“ wahrt die spezifische Bedeutung von זבח. Zahlen stehen zur schnellen Erfassbarkeit in Ziffern; der Satzbau macht deutlich, dass die Tiere aus der zuvor herbeigebrachten Kriegsbeute stammten.
