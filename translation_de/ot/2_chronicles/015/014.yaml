  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: de
  text: Und sie schworen Yahweh mit lauter Stimme, unter lautem Geschrei, mit Trompeten und Hörnern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Schofarhörner“ oder „Widderhörner“; sie werden hier von den unmittelbar zuvor genannten Trompeten unterschieden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: sie schworen
  rationale: Der Niphal von שׁבע bezeichnet hier das Ablegen eines Eides. „Sie schworen“ ist knapp, natürlich und bewahrt den verbindlichen Charakter.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition bezeichnet den, dem der Eid gilt; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: בְּקוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die Wendung bezeichnet lautes Sprechen und lässt sich im Deutschen idiomatisch mit „mit lauter Stimme“ wiedergeben.
- source_word: וּבִתְרוּעָה
  choice: unter Jubelrufen
  rationale: תְּרוּעָה bezeichnet einen lauten gemeinschaftlichen Ruf oder eine Akklamation. Im feierlichen Zusammenhang sind „Jubelrufe“ natürlich, ohne eine kriegerische Bedeutung einzutragen.
- source_word: וּבַחֲצֹצְרוֹת
  choice: begleitet von Trompeten
  rationale: חֲצֹצְרוֹת sind gerade Metalltrompeten, die bei Gottesdienst und Versammlungen verwendet wurden; „Trompeten“ ist die übliche verständliche Wiedergabe.
- source_word: וּבְשׁוֹפָרוֹת
  choice: und Hörnern
  rationale: שׁוֹפָרוֹת bezeichnet Horninstrumente, die von den zuvor genannten Metalltrompeten unterschieden werden. „Hörner“ wahrt diese Unterscheidung, ohne das Material unnötig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Yahweh“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten hebräischen Instrumentalbestimmungen werden durch „unter“ und „begleitet von“ natürlich verbunden; die Unterscheidung zwischen Trompeten und Hörnern bleibt erhalten.
