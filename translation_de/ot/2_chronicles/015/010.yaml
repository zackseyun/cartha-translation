  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: de
  text: Da versammelten sie sich im dritten Monat, im fünfzehnten Jahr der Herrschaft Asas, in Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: So versammelten sie sich
  rationale: Das Nifal-Wayyiqtol von קבץ bezeichnet hier im Erzählverlauf das Zusammenkommen der zuvor genannten Menschen. Die reflexive deutsche Form ist natürlich und gibt den kollektiven Sinn angemessen wieder; „So“ stellt den Folgezusammenhang her.
- source_word: יְרוּשָׁלִַם
  choice: in Jerusalem
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben. Obwohl im Hebräischen keine Präposition steht, verlangt das Deutsche bei der Ortsangabe idiomatisch „in“.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: im dritten Monat
  rationale: Die bestimmte Zeitangabe wird formal nah und zugleich idiomatisch wiedergegeben.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: im fünfzehnten Jahr
  rationale: ל mit „Jahr“ gehört hier zu einer Datierungsformel und wird im Deutschen idiomatisch mit „im“ übersetzt.
- source_word: לְמַלְכוּת אָסָא
  choice: der Regierung Asas
  rationale: מַלְכוּת bezeichnet in dieser chronologischen Formel Asas Regierungszeit. „Regierung“ ist in einer Jahresdatierung natürlich und wahrt den Bezug auf seine Königsherrschaft.
theological_decisions: []
translation_notes:
