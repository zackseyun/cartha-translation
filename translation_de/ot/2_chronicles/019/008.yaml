revisions:
- from: Auch in Jerusalem setzte Joschafat einige von den Leviten, den Priestern und den Oberhäuptern der israelitischen Großfamilien ein, damit sie im Auftrag Jahwes Recht sprachen[a] und Streitfälle entschieden. Dann kehrten sie nach Jerusalem zurück.[b]
  to: Auch in Jerusalem setzte Joschafat einige aus den Leviten, Priestern und den Familienoberhäuptern Israels für die Rechtsprechung Jahwes[a] und für Rechtsstreitigkeiten ein; und sie kehrten nach Jerusalem zurück.[b]
  rationale: Die Revision bildet die beiden mit לְ eingeleiteten Aufgaben parallel und nominal ab, statt eine bestimmte Deutung als Handeln „im Auftrag“ zu wählen. Sie verbessert zugleich die deutsche Idiomatik und ordnet den ersten Fußnotenanker dem erläuterten Ausdruck zu. Die auffällige masoretische Lesart „sie kehrten nach Jerusalem zurück“ bleibt im Haupttext und wird weiterhin transparent erläutert.
