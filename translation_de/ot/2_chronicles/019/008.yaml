source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: de
  text: Auch in Jerusalem setzte Joschafat einige aus den Leviten, Priestern und den Familienoberhäuptern Israels für die Rechtsprechung Jahwes[a] und für Rechtsstreitigkeiten ein; und sie kehrten nach Jerusalem zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für das Recht Jahwes“. Gemeint sein können auch Rechtsfälle, die nach Jahwes Gesetz zu entscheiden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text lautet: „Und sie kehrten nach Jerusalem zurück.“ Wegen der im Zusammenhang überraschenden Formulierung verstehen manche den Text anders, etwa: „Und sie wohnten in Jerusalem.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: Auch in Jerusalem
  rationale: Gibt die additive Kraft von וְגַם und die Ortsangabe natürlich und knapp wieder.
- source_word: הֶעֱמִיד
  choice: setzte ... ein
  rationale: Der Hifil von עמד bezeichnet hier die Einsetzung in eine amtliche richterliche Aufgabe.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: einige von den Leviten, den Priestern und den Oberhäuptern der israelitischen Großfamilien
  rationale: „Einige von“ verdeutlicht den partitiven Gebrauch von מִן/מֵ. „Großfamilien“ vermittelt die soziale Einheit der אָבוֹת im heutigen Deutsch verständlicher als das wörtliche „Vaterhäuser“.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: damit sie im Auftrag Jahwes Recht sprachen
  rationale: Die Formulierung bewahrt den Bezug des Rechts zu Jahwe, ohne ihn ausschließlich als Urheber, Gegenstand oder Gesetzgeber festzulegen; die genitivische Breite wird zusätzlich in der Fußnote ausgewiesen.
- source_word: וְלָרִיב
  choice: und Streitfälle entschieden
  rationale: רִיב bezeichnet im gerichtlichen Zusammenhang einen Rechtsstreit oder Streitfall. Die verbale Wiedergabe ist im Deutschen natürlich und passt syntaktisch zur übertragenen Aufgabe.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Dann kehrten sie nach Jerusalem zurück
  rationale: Dies ist die unmittelbare Bedeutung des masoretisch überlieferten וַיָּשֻׁבוּ, obwohl der Satz nach der anfänglichen Ortsangabe überraschend wirkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als solchen wieder und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von לְמִשְׁפַּט יְהוָה
  choice: im Auftrag Jahwes Recht sprechen
  alternative: über Rechtsfälle nach dem Gesetz Jahwes entscheiden / für das Gericht Jahwes
  rationale: Die gewählte Fassung lässt offen, ob vor allem göttliche Beauftragung, göttliches Recht oder Jahwe betreffende Rechtssachen gemeint sind; die Fußnote nennt die weitere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Amts- und Rechtssprache bleibt verständlich; „Großfamilien“ bildet die gesellschaftliche Struktur Israels funktional ab. Beide Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
