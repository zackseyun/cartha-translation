  naturalness: Die Revision bleibt modernes, verständliches Standarddeutsch. „Familienoberhäupter Israels“ ist idiomatischer und weniger sozialgeschichtlich spezifizierend als „Oberhäupter der israelitischen Großfamilien“.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Rechtsprechung Jahwes“ erhält die offene Genitivverbindung; „Rechtsstreitigkeiten“ entspricht dem gerichtlichen רִיב. Die Fußnotenanker werden an die tatsächlich erläuterten Ausdrücke gesetzt.
