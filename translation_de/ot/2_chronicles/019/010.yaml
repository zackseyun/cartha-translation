reference: 2 Chronicles 19:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: de
  text: Und bei jedem Streitfall, der von euren Brüdern, die in ihren Städten wohnen, vor euch gebracht wird – ob zwischen Blut und Blut[a], zwischen Weisung und Gebot, Satzungen und Rechtsbestimmungen –, sollt ihr sie warnen, damit sie sich nicht gegenüber Jahwe schuldig machen; sonst kommt Zorn über euch und eure Brüder. Handelt so, dann werdet ihr nicht schuldig werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen Blut und Blut“; wahrscheinlich sind unterschiedliche Fälle von Tötung oder Blutschuld gemeint.'
    reason: Die hebräische Wendung ist knapp und vermutlich rechtstechnisch; die wörtliche Form bleibt im Text erhalten, während die Fußnote den wahrscheinlichen Sachbezug nennt.
lexical_decisions:
- source_word: רִיב
  choice: Streitfall
  rationale: Das Wort bezeichnet im vorliegenden richterlichen Zusammenhang eine rechtlich zu entscheidende Auseinandersetzung. „Streitfall“ ist präzise, ohne bereits eine bestimmte Prozessform vorauszusetzen.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: vor euch gebracht wird
  rationale: 'Die räumliche Wendung hat hier gerichtlichen Sinn: Ein Fall gelangt vor die zuständigen Richter. Die passive deutsche Formulierung gibt diesen Sinn natürlich wieder.'
- source_word: מֵאֲחֵיכֶם
  choice: von euren Brüdern
  rationale: Die verwandtschaftliche Bundes- und Gemeinschaftssprache des Hebräischen bleibt erhalten; gemeint sind die Angehörigen des eigenen Volkes.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: die in ihren Städten wohnen
  rationale: Eine direkte und in modernem Deutsch verständliche Wiedergabe des Partizipialsatzes.
- source_word: בֵּין דָּם לְדָם
  choice: zwischen Blut und Blut
  rationale: Die knappe, vermutlich rechtstechnische und nicht völlig eindeutige hebräische Wendung wird im Haupttext bewahrt; eine Fußnote erläutert den wahrscheinlichen Bezug auf Tötungs- oder Blutschuldfälle.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: zwischen Weisung und Gebot, Satzungen und Rechtsbestimmungen
  rationale: „Weisung“ gibt תּוֹרָה in diesem Rechtskontext wieder, ohne alle vier Begriffe zu einem allgemeinen Wort für Gesetz einzuebnen. Die weiteren Ausdrücke bewahren die unterschiedlichen Kategorien rechtlicher Anordnung.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: sollt ihr sie warnen
  rationale: Der Hifil von זהר bezeichnet hier das nachdrückliche Warnen, das Schuld verhindern soll.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: sie nicht an Jahwe schuldig werden
  rationale: אשׁם bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld; לַיהוָה bezeichnet dabei die Verantwortlichkeit gegenüber Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קֶצֶף
  choice: Zorn
  rationale: Das Substantiv bezeichnet hier den göttlichen Zorn als Folge schuldhaften Handelns. „Zorn“ ist im Deutschen gewichtig und zugleich natürlich.
- source_word: כֹּה תַעֲשׂוּן
  choice: Handelt so
  rationale: Die kurze Aufforderung fasst das zuvor verlangte richterliche Vorgehen zusammen.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: dann werdet ihr nicht schuldig werden
  rationale: Die Wiedergabe greift denselben Schuldbegriff wie zuvor auf und macht den Folgezusammenhang in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Verwandtschaftssprache für die Bundesgemeinschaft
  choice: von euren Brüdern
  alternative: von euren Volksgenossen
  rationale: Das Hebräische verwendet ausdrücklich das männliche Verwandtschaftswort אֲחֵיכֶם. „Brüder“ bewahrt dieses Bild, während der Zusammenhang erkennen lässt, dass Angehörige des Volkes gemeint sind.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Tetragrammaton als Gottes persönlichen Namen verwendet, wird er als „Jahwe“ wiedergegeben und nicht durch einen Herrschaftstitel ersetzt.
- issue: Logischer Bezug von Schuld und Zorn
  choice: damit sie nicht an Jahwe schuldig werden; sonst kommt Zorn über euch und eure Brüder
  alternative: damit sie nicht an Jahwe schuldig werden und Zorn über euch und eure Brüder kommt
  rationale: Die Warnung soll Schuld und den daraus folgenden göttlichen Zorn verhindern. „Sonst“ macht den im Zusammenhang vorausgesetzten negativen Folgesinn verständlich, ohne den Zorn von der genannten Schuld zu lösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit juristisch erkennbarem Kontext. Die Satzstruktur wurde für gute Lesbarkeit gegliedert, während die auffälligen hebräischen Rechtskategorien und die Verwandtschaftssprache bewahrt bleiben.
