  terminology: „Streitfall“, „Weisung“, „Gebot“, „Satzungen“, „Rechtsbestimmungen“, „Zorn“ und „Jahwe“ sind für den Kontext geeignet. Die Fußnote wahrt die begründete Unbestimmtheit der rechtstechnischen Formel.
