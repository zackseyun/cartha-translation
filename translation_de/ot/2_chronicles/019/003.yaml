source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: de
  text: Doch es ist Gutes an dir gefunden worden, denn du hast die Aschera-Kultmale[a] aus dem Land beseitigt und dein Herz darauf ausgerichtet[b], Gott zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die Ascherot«; gemeint sind Kultgegenstände, die mit der Göttin Aschera verbunden waren.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »und dein Herz bereitgemacht, Gott zu suchen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Doch
  rationale: Kennzeichnet knapp und würdevoll den zugestehenden Gegensatz zur unmittelbar vorausgehenden Zurechtweisung.
- source_word: דְּבָרִים טוֹבִים
  choice: Gutes
  rationale: Bewahrt die breite Bedeutung der Wendung, ohne sie nur auf gute Taten oder Eigenschaften einzuengen.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: ist … an dir gefunden worden
  rationale: Gibt die passive Feststellung und den auf Joschafat bezogenen wertenden Sinn in natürlichem Deutsch wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der positiven Feststellung ein und fügt sich natürlich in den deutschen Satzfluss.
- source_word: בִעַרְתָּ
  choice: hast … beseitigt
  rationale: Drückt die entschiedene Entfernung der Kultgegenstände aus, ohne ein bestimmtes Verfahren wie Verbrennen festzulegen.
- source_word: הָאֲשֵׁרוֹת
  choice: die Aschera-Kultmale
  rationale: Bezeichnet die mit der Göttin Aschera verbundenen Kultgegenstände, ohne ihre historisch nicht völlig sichere Gestalt vorschnell auf Pfähle oder Bilder festzulegen.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Gibt die Entfernung aus dem betreffenden Herrschaftsgebiet direkt und idiomatisch wieder.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: und dein Herz darauf ausgerichtet
  rationale: Vermittelt die bewusste innere Ausrichtung; die wörtlichere Möglichkeit „dein Herz bereitgemacht“ wird in einer Fußnote bewahrt.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: Gott zu suchen
  rationale: Bewahrt das für die Chronik wichtige Motiv der hingebungsvollen Hinwendung zu Gott und verengt es nicht auf das Einholen einer Auskunft.
theological_decisions:
- issue: Wiedergabe von הָאֲשֵׁרוֹת
  choice: Aschera-Kultmale
  alternative: Aschera-Pfähle; Aschera-Bilder; die Ascherot
  rationale: Der Ausdruck verweist auf Kultgegenstände der Aschera-Verehrung. „Kultmale“ macht den kultischen Bezug verständlich, lässt aber die konkrete Gestalt offen.
- issue: Wiedergabe von לִדְרֹשׁ הָאֱלֹהִים
  choice: Gott suchen
  alternative: Gott befragen
  rationale: 'Im chronistischen Sprachgebrauch bezeichnet die Wendung mehr als eine punktuelle Anfrage: Sie umfasst die innere Hinwendung und das ernsthafte Verlangen nach Gott.'
- issue: Innere Haltung in וַהֲכִינוֹתָ לְבָבְךָ
  choice: dein Herz darauf ausgerichtet
  alternative: dein Herz bereitgemacht; dein Herz gefestigt
  rationale: Die Formulierung wahrt den Willens- und Entschlossenheitsaspekt, ohne eine besondere Lehre über das Verhältnis von menschlichem Wollen und göttlichem Wirken einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satz bleibt nahe an der hebräischen Struktur, vermeidet jedoch unnatürliche Wort-für-Wort-Wiedergaben. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Wendung.
