source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: de
  text: 'Und er gebot ihnen: „So sollt ihr handeln: in Ehrfurcht vor Jahwe[a], in Treue[b] und mit ungeteiltem Herzen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „in der Furcht Jahwes“. Gemeint ist ehrfürchtige Gottesfurcht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Zuverlässigkeit“ beziehungsweise „treu“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von ganzem Herzen“ beziehungsweise „mit aufrichtigem Herzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: Und er gebot ihnen
  rationale: צוה mit על bezeichnet hier das Erteilen eines verbindlichen Auftrags. „Er gebot ihnen“ ist im Deutschen idiomatisch; das formelhafte לֵאמֹר wird durch den anschließenden Doppelpunkt natürlich wiedergegeben.
- source_word: כֹּה תַעֲשׂוּן
  choice: So sollt ihr handeln
  rationale: עשה ist breit und kann „tun“ oder „handeln“ bedeuten. Im Zusammenhang der richterlichen Pflichten trifft „handeln“ den Sinn, während „so“ das כֹּה bewahrt und „sollt“ den Weisungscharakter ausdrückt.
- source_word: בְּיִרְאַת יְהוָה
  choice: in Ehrfurcht vor Jahwe
  rationale: יִרְאָה umfasst hier Gottesfurcht beziehungsweise ehrfürchtige Scheu. „Ehrfurcht vor“ ist natürliches modernes Deutsch und verliert den Ernst des Ausdrucks nicht; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בֶּאֱמוּנָה
  choice: in Treue
  rationale: אֱמוּנָה bezeichnet in dieser richterlichen Weisung zuverlässiges, loyales und gewissenhaftes Handeln, nicht vorrangig inneren Glauben. „In Treue“ bewahrt die substantivische Ausdrucksweise.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: und mit ungeteiltem Herzen
  rationale: לֵבָב שָׁלֵם bezeichnet ein vollständiges, uneingeschränkt ausgerichtetes Herz. „Ungeteiltes Herz“ bewahrt das hebräische Herzbild und macht die gemeinte Ganzheit im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֱמוּנָה in der richterlichen Ermahnung
  choice: Treue
  alternative: Glaube; Zuverlässigkeit; Rechtschaffenheit
  rationale: Der Kontext betrifft die Ausübung eines richterlichen Auftrags. Daher steht vertrauenswürdiges, gewissenhaftes Verhalten im Vordergrund; „Glaube“ würde den Ausdruck unnötig auf eine andere theologische Bedeutung festlegen.
- issue: Bedeutung von לֵבָב שָׁלֵם
  choice: mit ungeteiltem Herzen
  alternative: von ganzem Herzen; mit aufrichtigem Herzen
  rationale: Die Formulierung lässt sowohl Ganzherzigkeit als auch innere Lauterkeit anklingen. „Mit ungeteiltem Herzen“ erhält das Bild und legt den Ausdruck nicht ausschließlich moralisch aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt ersetzt das im Deutschen schwerfällige „indem er sprach“. Die parallelen Präpositionalgruppen bleiben erhalten. „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms.
