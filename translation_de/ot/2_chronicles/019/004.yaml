source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: de
  text: Joschafat wohnte in Jerusalem. Dann zog er wieder[a] unter das Volk, von Beerscheba bis zum Bergland Ephraims, und führte die Menschen zu Jahwe[b], dem Gott ihrer Väter, zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann kehrte er zurück und zog hinaus.“ Gemeint ist wahrscheinlich, dass Joschafat nach seiner Rückkehr nach Jerusalem diese Tätigkeit wieder aufnahm.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: Das Verb ישׁב bezeichnet hier im Zusammenhang mit der Ortsangabe einen festen Aufenthalt, nicht das körperliche Sitzen.
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: zog wieder hinaus
  rationale: Die Wiederholung der Wurzel שׁוב wird im Deutschen natürlich als Wiederaufnahme seiner Tätigkeit wiedergegeben; die wörtlichere Struktur bleibt in der Fußnote sichtbar.
- source_word: וַיֵּצֵא בָעָם
  choice: zog … unter das Volk
  rationale: Die Präposition ב bezeichnet hier seine Bewegung innerhalb beziehungsweise durch die Bevölkerung, nicht nur ein Zugehen auf sie.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: von Beerscheba bis zum Bergland Ephraim
  rationale: הַר אֶפְרַיִם bezeichnet die gebirgige Landschaft Ephraims; „Bergland“ ist eine natürliche geografische Wiedergabe.
- source_word: וַיְשִׁיבֵם
  choice: führte die Menschen … zurück
  rationale: Der Hifil von שׁוב drückt aus, dass Joschafat ihre Rückkehr bewirkte. „führte … zurück“ wahrt diese kausative Bedeutung, ohne eine bestimmte Bekehrungslehre einzutragen.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition bezeichnet das Ziel der Rückkehr; der Gottesname יהוה wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: dem Gott ihrer Väter
  rationale: Die traditionelle biblische Wendung bewahrt den Bezug auf den Gott, dem bereits ihre Vorfahren angehörten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Bedeutung von וַיְשִׁיבֵם אֶל יְהוָה
  choice: führte die Menschen zu Jahwe zurück
  alternative: bekehrte sie zu Jahwe
  rationale: Die gewählte Formulierung gibt die verursachte Rückkehr wieder, ohne den Text auf einen späteren theologischen Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Satzführung; „unter das Volk“ bewahrt den Gedanken einer Reise durch die Bevölkerung, während „die Menschen“ im Folgesatz eine schwerfällige Wiederholung von „Volk“ vermeidet.
