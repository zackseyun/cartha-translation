  text: וַ/יַּעֲמֵ֨ד שֹֽׁפְטִ֜ים בָּ/אָ֗רֶץ בְּ/כָל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת לְ/עִ֥יר וָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: de
  text: Und er setzte im Land[a] Richter ein, in allen befestigten Städten Judas, Stadt für Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im ganzen Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: setzte … ein
  rationale: Der Hifil von עמד bezeichnet hier die Einsetzung von Personen in ein Amt; „setzte … ein“ ist im Deutschen natürlich und administrativ präzise.
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: Das Substantiv bezeichnet hier eindeutig Amtsträger mit richterlicher Aufgabe.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Die Wendung lokalisiert die Einsetzung im Gebiet Judas. Die räumlich-distributive Nuance bleibt als Alternative in der Fußnote erhalten.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: in allen befestigten Städten Judas
  rationale: Die Formulierung bewahrt die Gesamtheit und die präpositionale Struktur; das nachfolgende Adjektiv wird im Deutschen unmittelbar dem Substantiv zugeordnet.
- source_word: הַבְּצֻרוֹת
  choice: befestigten
  rationale: Das Adjektiv beschreibt die Städte als militärisch gesichert oder befestigt; „befestigt“ ist die übliche und genaue Wiedergabe.
- source_word: לְעִיר וָעִיר
  choice: Stadt für Stadt
  rationale: Die distributive hebräische Wiederholungsform betont die einzelne Einsetzung in jeder Stadt; „Stadt für Stadt“ erhält diese Wirkung knapp und idiomatisch.
