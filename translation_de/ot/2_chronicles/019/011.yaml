  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: de
  text: 'Und sieh: Amarja, der oberste Priester,[a] steht euch in jeder Angelegenheit Jahwes vor, und Sebadja, der Sohn Ismaëls, der Oberste des Hauses Juda, in jeder Angelegenheit des Königs. Als Amtsträger stehen euch die Leviten zur Seite. Seid stark und handelt! Und Jahwe sei mit dem, der Gutes tut.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Hohepriester“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder formnäher: „Jahwe sei mit dem Guten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Diskursmarker, klingt im heutigen Deutschen aber natürlicher als „und siehe“.
- source_word: כֹהֵן הָרֹאשׁ
  choice: der oberste Priester
  rationale: Gibt wörtlich den führenden Priester wieder, ohne vorschnell ausschließlich den technischen Amtstitel „Hohepriester“ festzulegen.
- source_word: עֲלֵיכֶם
  choice: steht euch … vor
  rationale: Drückt die Aufsichts- und Leitungsfunktion in diesem richterlich-administrativen Zusammenhang idiomatisch aus.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: in jeder Angelegenheit Jahwes
  rationale: דבר bezeichnet hier eine Angelegenheit oder Rechtssache; die Wendung wahrt den breiten Bezug und die Zuständigkeitssphäre.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: der Oberste des Hauses Juda
  rationale: נָגִיד bezeichnet einen Leiter oder Obersten. „Haus Juda“ erhält die formale Gestalt des Hebräischen.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: in jeder Angelegenheit des Königs
  rationale: Bewahrt die syntaktische Parallele zur Angelegenheit Jahwes und bezeichnet die königliche Zuständigkeit.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Als Amtsträger stehen euch die Leviten zur Seite
  rationale: שֹׁטְרִים sind administrative Amtsträger. „Zur Seite stehen“ gibt לִפְנֵיכֶם in diesem Dienst- und Unterstützungskontext natürlich wieder.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Seid stark und handelt
  rationale: Gibt die knappe Aufforderung wieder, die übertragene Aufgabe entschlossen auszuführen.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: Und Jahwe sei mit dem, der Gutes tut
  rationale: „Sei“ wahrt den jussivischen Segenswunsch. Das substantivierte הַטּוֹב kann den guten Menschen oder denjenigen bezeichnen, der gut handelt; die gewählte Form ist im Deutschen verständlich, während die alternative Deutung in der Fußnote bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der geläufigen deutschen Form wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כֹהֵן הָרֹאשׁ
  choice: oberster Priester
  alternative: Hohepriester
  rationale: Die hebräische Formulierung bedeutet wörtlich „Priester, der Oberste“. Die Übersetzung hält die Möglichkeit eines Amtstitels offen, ohne mehr technische Festlegung einzutragen, als der Ausdruck selbst verlangt.
- issue: Bezug von הַטּוֹב
  choice: der, der Gutes tut
  alternative: der Gute / das Gute
  rationale: Die Form ist substantiviert und bleibt semantisch knapp. Im Kontext der Aufforderung zum Handeln liegt der personale und ethische Bezug nahe; die formnähere Alternative wird ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Amts- und Zuständigkeitsformeln bleiben parallel; „Und sieh“ bewahrt die Hervorhebung, ohne den stark altertümlichen Klang von „siehe“. Die Eigennamen folgen geläufigen deutschen Bibelformen.
