  source_fidelity: 'Die Übersetzung trifft Erzählhandlung, Titel »Seher«, Gottesnamen und die Pluralform von »die Jahwe hassen« grundsätzlich gut. Die hebräische Schlussaussage ist jedoch ein Nominalsatz: wörtlich etwa »und deswegen [ist] Zorn über dir, von Jahwe her«. »ist ... über dich gekommen« fügt das nicht im Text stehende Verb bzw. Ereignismoment »gekommen« hinzu. Außerdem steht הָרָשָׁע im Singular und bestimmt; »dem Gottlosen« bildet dies genauer ab als der indefinite Dativ.'
  naturalness: »Ging ihm ... entgegen« und »Jahwe« sind modernes, würdiges Standarddeutsch. »Willst du ...?« ist als vorwurfsvolle rhetorische Frage idiomatisch und direkt. »Von Jahwe her« gibt die Herkunftsnuance von מִלִּפְנֵי יְהוָה natürlich wieder, ohne eine künstliche räumliche Formulierung zu erzwingen.
  terminology: »Seher« bewahrt den spezifischen Titel חֹזֶה. »Jahwe« gibt den Gottesnamen konsistent wieder. »Zorn« ist für קֶצֶף passend. Die Formulierung »diejenigen, die Jahwe hassen« erhält die pluralische, verbale Bezeichnung des Hebräischen.
