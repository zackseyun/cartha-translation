base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: de
  text: 'Da ging ihm Jehu, der Seher, ein Sohn Hananis, entgegen und sagte zu König Joschafat: »Willst du dem Gottlosen helfen und diejenigen lieben, die Jahwe hassen? Deshalb ist Zorn über dir von Jahwe her.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: ging ihm … entgegen
  rationale: Die Wendung bedeutet im Zusammenhang, dass Jehu hinausging, um Joschafat zu begegnen. Die deutsche Formulierung gibt das Idiom natürlich wieder.
- source_word: הַחֹזֶה
  choice: der Seher
  rationale: חֹזֶה ist eine besondere prophetische Amtsbezeichnung. »Seher« bewahrt diese Nuance gegenüber dem allgemeineren »Prophet«.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Solltest du einem Gottlosen helfen
  rationale: Die Frage ist ein tadelnder Vorwurf. Der substantivierte Singular רָשָׁע kann hier auf den konkreten gottlosen König verweisen, ohne ihn ausdrücklich zu nennen.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: und die lieben, die Jahwe hassen
  rationale: Die Wiedergabe erhält sowohl die Mehrzahl als auch die verbale Aussage des Partizips שֹׂנְאֵי und vermeidet die stärker deutende Verkürzung »Jahwes Feinde«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: וּבָזֹאת
  choice: Deswegen
  rationale: Die Wendung verweist kausal auf Joschafats soeben gerügtes Verhalten zurück.
- source_word: עָלֶיךָ קֶּצֶף
  choice: ist Zorn … über dich gekommen
  rationale: Dies bewahrt das Bild eines gegen Joschafat gerichteten göttlichen Zorns und ist zugleich idiomatisches Deutsch.
- source_word: מִלִּפְנֵי יְהוָה
  choice: von Jahwe
  rationale: Die hebräische Wendung bezeichnet Jahwe als Ursprung des Zorns. Das knappe »von Jahwe« gibt diese Funktion im Deutschen natürlich wieder, ohne eine räumliche Vorstellung zu erzwingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen; die Übersetzung bewahrt ihn als Eigennamen.
- issue: Bezug von הָרָשָׁע
  choice: einem Gottlosen
  alternative: den Gottlosen
  rationale: Der Singular kann im historischen Zusammenhang konkret auf Ahab weisen, während die moralische Kennzeichnung erhalten bleibt. Der Name wird nicht in den Text hineingetragen.
- issue: Bedeutung von מִלִּפְנֵי יְהוָה
  choice: von Jahwe
  alternative: aus der Gegenwart Jahwes
  rationale: Die Wendung benennt den göttlichen Ursprung des Zorns. Eine wörtlich-räumliche Formulierung wäre im modernen Deutschen schwerfällig und könnte unbeabsichtigt eine besondere räumliche Aussage nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt als scharfe rhetorische Zurechtweisung erhalten; altertümliche Satzstellung und unnötig technische Formulierungen werden vermieden.
