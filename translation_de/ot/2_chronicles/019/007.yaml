  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: de
  text: 'Nun denn: Die Furcht vor Jahwe sei über euch. Seid achtsam und handelt! Denn bei Jahwe, unserem Gott, gibt es kein Unrecht, keine Parteilichkeit[a] und keine Annahme von Bestechungsgeld.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Erheben des Gesichts“; eine hebräische Redewendung für das Ansehen der Person oder Parteilichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun also
  rationale: Die Wendung leitet eine folgernde Ermahnung ein; „Nun also“ gibt sowohl den Übergang als auch die Schlussfolgerung natürlich wieder.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: soll die Furcht vor Jahwe auf euch sein
  rationale: Die Jussivform wird als Aufforderung wiedergegeben. „Furcht vor Jahwe“ bewahrt die ehrfürchtige, zugleich ernst mahnende Bedeutung von פַחַד.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: Gebt acht und handelt!
  rationale: שׁמר fordert hier zu Wachsamkeit und Sorgfalt im richterlichen Handeln auf; עשׂה verlangt die entsprechende konkrete Ausführung.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: Denn bei Jahwe, unserem Gott, gibt es kein
  rationale: „Bei“ bewahrt die hebräische Konstruktion mit עִם und bezeichnet, was in Gottes Wesen und Handeln keinen Platz hat.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Im Zusammenhang richterlicher Pflichten umfasst das Wort moralisches Unrecht und Rechtsbeugung, ohne es unnötig auf nur eine Erscheinungsform zu verengen.
- source_word: מַשֹּׂא פָנִים
  choice: Parteilichkeit
  rationale: Die wörtliche Wendung „Erheben des Gesichts“ ist ein Idiom für bevorzugende Behandlung aufgrund der Person.
- source_word: מִקַּח שֹׁחַד
  choice: Annahme von Bestechungsgeld
  rationale: Die Nominalverbindung bezeichnet das Annehmen einer Bestechung; diese Wiedergabe bleibt eng am Hebräischen und ist im Deutschen eindeutig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; „Jahwe“ bewahrt diesen als Namen.
- issue: Bedeutung der Gottesfurcht
  choice: Furcht vor Jahwe
  alternative: Ehrfurcht vor Jahwe
  rationale: „Furcht“ erhält die volle Spannung des Ausdrucks zwischen ehrfürchtiger Achtung und ernster Rechenschaft; eine Beschränkung auf bloße Ehrfurcht wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Aufforderungen spiegeln den eindringlichen Charakter der richterlichen Mahnung. Der Fußnotenmarker steht bei dem Ausdruck, den die Anmerkung tatsächlich erläutert.
