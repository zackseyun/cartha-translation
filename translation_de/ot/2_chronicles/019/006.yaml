source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: de
  text: 'Er sagte zu den Richtern: „Achtet darauf, was ihr tut! Denn ihr richtet nicht für Menschen[a], sondern für Jahwe, und er ist bei euch in der Rechtsprechung[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für einen Menschen“ beziehungsweise „für den Menschen“. Das hebräische אָדָם steht in der Einzahl und bezeichnet hier Menschen allgemein im Gegensatz zu Jahwe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einer Rechtssache“ beziehungsweise „wenn ihr ein Urteil fällt“. Die hebräische Wendung kann die richterliche Tätigkeit allgemein oder eine konkrete Gerichtsentscheidung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: die Richter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet hier die eingesetzten Amtsträger, die Recht sprechen.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Achtet darauf, was ihr tut!
  rationale: Die Wendung ist eine eindringliche Aufforderung, das eigene richterliche Handeln sorgfältig zu bedenken; diese Formulierung ist im Deutschen natürlich und bewahrt den Imperativ.
- source_word: לְאָדָם
  choice: für Menschen
  rationale: אָדָם steht generisch für den Menschen beziehungsweise die Menschheit und bildet den Gegensatz zu Jahwe. Der deutsche Plural gibt diese generische Bedeutung natürlich wieder; die hebräische Einzahl wird in einer Fußnote kenntlich gemacht.
- source_word: תִּשְׁפְּטוּ
  choice: ihr richtet
  rationale: Das Verb bezeichnet das Ausüben richterlicher Tätigkeit. „Richten“ wahrt die knappe juristische Ausdrucksweise des Hebräischen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet, dass die Richter ihre Aufgabe für Jahwe und unter seiner Autorität wahrnehmen. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְעִמָּכֶם
  choice: und er ist bei euch
  rationale: Das Hebräische sagt die Gegenwart Jahwes bei den Richtern aus. Das im Deutschen erforderliche Subjekt „er“ bezieht sich auf Jahwe.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: in der Rechtsprechung
  rationale: דָּבָר kann eine Sache oder Angelegenheit und מִשְׁפָּט Gericht, Urteil oder Recht bezeichnen. „In der Rechtsprechung“ ist verständlich, juristisch passend und lässt den Bezug auf die richterliche Tätigkeit bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Generischer Singular אָדָם im Gegensatz zu Jahwe
  choice: Menschen
  alternative: den Menschen
  rationale: Gemeint ist menschliche Autorität beziehungsweise die Menschheit allgemein, nicht ein bestimmter Mann. Der natürliche deutsche Plural bewahrt diesen generischen Sinn; die formale Einzahl wird in der Fußnote genannt.
- issue: Göttliche Gegenwart beim Richten
  choice: er ist bei euch in der Rechtsprechung
  alternative: er ist bei euch, wenn ihr ein Urteil fällt
  rationale: Die Formulierung bewahrt die ausdrückliche Aussage, dass Jahwe bei den Richtern ist, ohne näher zu bestimmen, ob בִּדְבַר מִשְׁפָּט die einzelne Entscheidung oder die Rechtsprechung allgemein bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und knapp; der juristische Wortschatz ist verständlich, ohne den hebräischen Ausdruck unnötig auszudeuten.
