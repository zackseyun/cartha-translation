source:
  edition: WLC
  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: de
  text: Joschafat, der König von Juda, kehrte wohlbehalten in sein Haus in Jerusalem zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in Frieden«. Die hebräische Wendung kann auch eine sichere, unversehrte Rückkehr bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Das Verb שׁוב bezeichnet die Rückkehr; die deutsche Verbklammer »kehrte … zurück« ist im erzählenden Zusammenhang natürlich und präzise.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Die Namensform entspricht der etablierten deutschen Bibeltradition und gibt den hebräischen Namen verständlich wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: der König von Juda
  rationale: Die Apposition bezeichnet Joschafats königliches Amt. Der bestimmte Artikel ist im Deutschen natürlich.
- source_word: אֶל בֵּיתוֹ
  choice: in sein Haus
  rationale: בַּיִת bezeichnet hier das Haus als Ziel der Rückkehr. Wegen des deutschen Verbs »zurückkehren« steht idiomatisch »in sein Haus«.
- source_word: בְּשָׁלוֹם
  choice: wohlbehalten
  rationale: Die Wendung bezeichnet in diesem Rückkehrbericht vor allem eine sichere, unversehrte Heimkehr. »Wohlbehalten« gibt dies natürlich wieder, während die Fußnote die wörtlichere und weiter gefasste Bedeutung bewahrt.
- source_word: לִירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Obwohl לְ eine Zielrichtung ausdrückt, wird Jerusalem im Deutschen nach »in sein Haus« idiomatisch als Standort des Hauses angegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Joschafat und sein Amt eng zusammen; »wohlbehalten« vermeidet eine missverständliche Verengung auf die Abwesenheit von Krieg, während die Fußnote das hebräische Bild »in Frieden« sichtbar erhält.
