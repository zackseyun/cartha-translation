source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: de
  text: Ahasja war zweiundvierzig Jahre alt, als er König wurde[a], und er regierte ein Jahr in Jerusalem. Seine Mutter hieß Atalja[b]; sie war eine Tochter Omris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »zweiundvierzig Jahre alt«. In der Parallelstelle 2. Könige 8,26 steht »zweiundzwanzig Jahre alt«. Daher sehen manche hier ein Problem der Textüberlieferung oder nehmen eine andere Berechnung der Zahl an.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »eine Nachfahrin Omris«. Das hebräische Wort für »Tochter« kann mitunter auch eine weibliche Nachfahrin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: war zweiundvierzig Jahre alt
  rationale: Die hebräische Altersformel bedeutet idiomatisch, dass jemand ein bestimmtes Alter hatte. Die im WLC überlieferte Zahl »zweiundvierzig« bleibt erhalten.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion mit ב und Infinitiv bezeichnet hier den Zeitpunkt des Regierungsantritts; die gewählte Formulierung ist natürliches modernes Deutsch.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: und er regierte ein Jahr
  rationale: Die Übersetzung gibt die ausdrücklich genannte Dauer der Herrschaft knapp und genau wieder.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Standardmäßige lokale Wiedergabe der Präposition ב beim Ortsnamen.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliche deutsche Wiedergabe der formelhaften hebräischen Wendung »der Name seiner Mutter war«.
- source_word: עֲתַלְיָהוּ
  choice: Atalja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: בַּת עָמְרִי
  choice: eine Tochter Omris
  rationale: בַּת bedeutet zunächst »Tochter«. Der mögliche weitere Sinn »Nachfahrin« wird wegen der genealogischen Spannung in einer Fußnote offengehalten.
theological_decisions:
- issue: Chronologische Spannung beim Alter Ahasjas bei seinem Regierungsantritt
  choice: Die masoretische Lesart »zweiundvierzig Jahre« steht im Haupttext.
  alternative: »zweiundzwanzig Jahre« entsprechend 2. Könige 8,26; oder eine andere Berechnung der Zahl.
  rationale: Der vorgelegte hebräische Text hat »zweiundvierzig«. Die Übersetzung emendiert oder harmonisiert ihn nicht stillschweigend, sondern nennt die Parallelüberlieferung in einer Fußnote.
- issue: Genealogische Bedeutung von »Tochter Omris«
  choice: Im Haupttext steht die unmittelbare Wiedergabe »eine Tochter Omris«.
  alternative: »eine Nachfahrin Omris«
  rationale: Das hebräische Wort ist der gewöhnliche Ausdruck für »Tochter«, kann in genealogischen Zusammenhängen aber auch eine weibliche Nachfahrin bezeichnen. Diese Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem erzählerischem Stil. Die königliche Notiz bleibt knapp; echte textliche und genealogische Spannungen werden nicht im Haupttext aufgelöst, sondern transparent in Fußnoten ausgewiesen.
