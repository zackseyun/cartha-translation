  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: de
  text: 'Er suchte nach Ahasja, und sie ergriffen ihn, als er sich in Samaria versteckte. Sie brachten ihn zu Jehu und töteten ihn.[a] Dann begruben sie ihn, denn sie sagten: »Er ist ein Sohn Joschafats, der Jahwe von ganzem Herzen suchte.« Das Haus Ahasjas aber hatte keine Kraft, die Königsherrschaft zu behaupten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sie verursachten seinen Tod«; die hebräische Verbform ist kausativ.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Das Haus Ahasjas hatte keine Stärke, das Königtum festzuhalten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: Er suchte nach
  rationale: בקש bezeichnet hier die gezielte Suche nach Ahasja. Die Einzahl des hebräischen Verbs bleibt erhalten; der nicht ausdrücklich genannte Handelnde ergibt sich aus dem Zusammenhang.
- source_word: וַיִּלְכְּדֻהוּ
  choice: sie ergriffen ihn
  rationale: לכד bezeichnet das Fangen oder Ergreifen einer Person. Die Mehrzahl des hebräischen Verbs wird bewahrt.
- source_word: מִתְחַבֵּא
  choice: als er sich ... versteckte
  rationale: Das Hitpael-Partizip beschreibt Ahasja während seines fortdauernden Verbergens.
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: Sie brachten ihn zu Jehu
  rationale: Die Hifil-Form von בוא bedeutet hier schlicht, jemanden zu einer Person zu bringen.
- source_word: וַיְמִתֻהוּ
  choice: töteten ihn
  rationale: Die kausative Form von מות bedeutet, jemanden sterben zu lassen beziehungsweise zu töten. Die schlichte deutsche Formulierung ist natürlich, ohne eine förmliche Hinrichtung vorauszusetzen.
- source_word: אֲשֶׁר דָּרַשׁ אֶת־יְהוָה
  choice: der Jahwe ... suchte
  rationale: דרש bezeichnet in Verbindung mit Gott hingebungsvolles Suchen und die Ausrichtung auf ihn; „suchte“ erhält zugleich die lexikalische Verbindung zum ersten Satz.
- source_word: בְּכָל־לְבָבוֹ
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt das hebräische Bild umfassender innerer Hingabe natürlich wieder.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: Das Haus Ahasjas aber hatte keine Kraft, die Königsherrschaft zu behaupten
  rationale: Die Formulierung bewahrt das dynastische „Haus“, die fehlende Kraft und den Bezug auf die Herrschaft, ohne festzulegen, ob insbesondere eine geeignete Einzelperson fehlte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ ist die im modernen Deutschen geläufige Wiedergabe und ersetzt den Namen nicht durch einen Titel.
- issue: Bedeutung des Schlusssatzes über das Haus Ahasjas
  choice: dynastische Unfähigkeit, die Königsherrschaft zu behaupten
  alternative: Im Haus Ahasjas war niemand imstande, das Königtum zu übernehmen
  rationale: Der hebräische Wortlaut spricht vom Haus Ahasjas, fehlender Kraft und dem Königtum. Die gewählte Fassung wahrt diese Spannung und ergänzt nicht ausdrücklich eine im Text nur möglicherweise vorausgesetzte Einzelperson.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Der auffällige Wechsel vom Singular („er suchte“) zum Plural („sie ergriffen“) wurde entsprechend dem hebräischen Text beibehalten. Die Fußnotenmarker stehen an den jeweils erläuterten Aussagen.
