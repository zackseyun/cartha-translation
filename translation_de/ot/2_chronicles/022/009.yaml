    issue: Fußnote a erklärt die hebräische Kausativform missverständlich.
    rationale: „Ließen ihn sterben“ bedeutet im modernen Deutsch häufig, dass man jemanden nicht rettete. וַיְמִתֻהוּ bedeutet hier aktiv „sie ließen/ließen ihn sterben“ nur im streng kausativen Sinn, besser erläutert als „sie bewirkten seinen Tod“ oder „sie verursachten seinen Tod“.
