base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: de
  text: Die Einwohner Jerusalems setzten an seiner Stelle Ahasja, seinen jüngsten Sohn, als König ein; denn die Streifschar, die mit den Arabern[a] ins Heerlager gekommen war, hatte alle älteren Söhne getötet. So wurde Ahasja, der Sohn Jorams, König von Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die unter den Arabern ins Heerlager gekommen war“. Die hebräische Präposition bei „Arabern“ kann hier unterschiedlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: setzten … als König ein
  rationale: Die Hifil-Form bezeichnet die Einsetzung zum König; die deutsche Wendung gibt den kausativen Sinn natürlich und präzise wieder.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Gibt die substantivierte Partizipialverbindung sachlich und in angemessenem Register wieder.
- source_word: בְנוֹ הַקָּטֹן
  choice: seinen jüngsten Sohn
  rationale: קָטֹן kann „klein/jung“ bedeuten; der Gegensatz zu den anschließend genannten älteren Söhnen legt hier den Superlativ nahe.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Bezeichnet bei der Thronfolge die Nachfolge beziehungsweise Stellvertretung.
- source_word: כָל הָרִאשֹׁנִים
  choice: alle älteren Söhne
  rationale: Wörtlich „alle früheren/ersten“; aus dem unmittelbaren Zusammenhang ergibt sich, dass die älteren Söhne Jorams gemeint sind.
- source_word: הַגְּדוּד
  choice: die Streifschar
  rationale: גְּדוּד bezeichnet hier eine bewaffnete Schar beziehungsweise einen plündernden Trupp; „Streifschar“ bewahrt diese militärische Konnotation.
- source_word: הַבָּא בָעַרְבִים
  choice: die mit den Arabern … gekommen war
  rationale: Die Präposition ב wird im Haupttext komitativ verstanden; da auch eine lokale Zuordnung möglich ist, wird die Mehrdeutigkeit in einer Fußnote ausgewiesen.
- source_word: לַמַּחֲנֶה
  choice: ins Heerlager
  rationale: Die Präposition bezeichnet die Bewegung zum beziehungsweise in das Lager; „Heerlager“ verdeutlicht den militärischen Kontext.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Die Form fasst den Regierungsantritt zusammen. Die ingressiv formulierte Wiedergabe vermeidet eine möglicherweise durative Lesart von „regierte“.
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: Ahasja, der Sohn Jorams, König von Juda
  rationale: Die Apposition identifiziert Ahasja durch Abstammung und Königswürde; die deutsche Zeichensetzung verhindert, dass „König von Juda“ irrtümlich allein auf Joram bezogen wird.
