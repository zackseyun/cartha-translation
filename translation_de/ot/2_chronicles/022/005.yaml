  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: de
  text: Auch er folgte ihrem Rat[a] und zog mit Jehoram, dem Sohn Ahabs, dem König von Israel, in den Krieg gegen Hasaël, den König von Aram[b], bei Ramot-Gilead. Die Aramäer verwundeten Joram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Auch nach ihrem Rat ging er.« Gemeint ist, dass er sein Handeln nach ihrem Rat ausrichtete.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch »Aram«; traditionell wird dafür auch »Syrien« verwendet. Entsprechend werden die »Aramäer« traditionell auch »Syrer« genannt.
    reason: alternative_reading
  - marker: c
    text: Der hebräische Text verwendet zuvor die Namensform »Jehoram«, hier aber die verwandte Kurzform »Joram«; beide bezeichnen denselben König von Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Kennzeichnet die Fortsetzung des Gedankens aus dem vorherigen Zusammenhang.
- source_word: בַּעֲצָתָם הָלַךְ
  choice: er folgte ihrem Rat
  rationale: Die hebräische Wendung lautet bildlich, dass er in bzw. nach ihrem Rat »ging«. Die gewählte Form gibt idiomatisch wieder, dass ihr Rat sein Handeln bestimmte.
- source_word: וַיֵּלֶךְ אֶת
  choice: er zog mit
  rationale: Die Konstruktion bezeichnet das gemeinsame Mitziehen; im militärischen Zusammenhang ist »zog mit« natürlich und präzise.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Jehoram ... Joram
  rationale: Die unterschiedlichen, miteinander verwandten Namensformen des hebräischen Textes werden auch im Deutschen unterschieden.
- source_word: לַמִּלְחָמָה עַל
  choice: um gegen ... Krieg zu führen
  rationale: Gibt den Zweck des Zuges und die feindliche Ausrichtung klar und idiomatisch wieder.
- source_word: אֲרָם / הָרַמִּים
  choice: Aram / Aramäer
  rationale: Bewahrt die historischen Bezeichnungen des hebräischen Textes statt der traditionellen Wiedergabe »Syrien / Syrer«.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: nach Ramot in Gilead
  rationale: Im Zusammenhang mit dem militärischen Zug bezeichnet die Ortsangabe dessen Ziel bzw. den Ort des Kampfes; »Ramot in Gilead« ist im Deutschen verständlich.
- source_word: וַיַּכּוּ
  choice: verwundeten
  rationale: Das Verb bedeutet grundsätzlich »schlagen«; der folgende Vers zeigt, dass Joram dabei verwundet wurde.
theological_decisions:
- issue: Wiedergabe des Landesnamens אֲרָם und der Volksbezeichnung הָרַמִּים
  choice: Aram / Aramäer
  alternative: Syrien / Syrer
  rationale: Die Wahl folgt der historischen Bezeichnung des hebräischen Ausgangstextes und vermeidet die spätere geografische Gleichsetzung mit Syrien.
- issue: Unterschiedliche Namensformen für den König von Israel
  choice: Jehoram ... Joram
  alternative: beide Vorkommen einheitlich als Joram oder Jehoram
  rationale: Der hebräische Text verwendet innerhalb des Verses die verwandten Formen יְהוֹרָם und יוֹרָם. Die Übersetzung bewahrt diese formale Spannung, ohne daraus zwei Personen zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte hebräische Rats-Wendung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht. Historische Eigennamen und die beiden hebräischen Namensformen bleiben erhalten.
