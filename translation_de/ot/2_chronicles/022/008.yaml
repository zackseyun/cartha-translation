source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: de
  text: Und es geschah, als Jehu Gericht über das Haus Ahabs vollstreckte[a], da fand er die führenden Männer Judas und die Söhne der Brüder Ahasjas, die Ahasja dienten[b], und tötete sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Jehu über das Haus Ahabs Gericht hielt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne der Brüder Ahasjas“; das heißt, Ahasjas Neffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: als … Gericht vollstreckte
  rationale: Der mit כְּ eingeleitete temporale Infinitiv des Verbs שׁפט bezeichnet hier Jehus gerichtliches Vorgehen. „Gericht vollstreckte“ bewahrt den Rechts- und Strafcharakter, ohne ausdrücklich eine göttliche Billigung jeder einzelnen Tötung zu behaupten.
- source_word: עִם בֵּית אַחְאָב
  choice: am Haus Ahabs
  rationale: עִם bezeichnet hier den von Jehus feindlich-gerichtlichem Handeln betroffenen Personenkreis. „Am Haus Ahabs Gericht vollstrecken“ ist im Deutschen idiomatisch und bewahrt „Haus“ als familiär-dynastischen Ausdruck.
- source_word: שָׂרֵי יְהוּדָה
  choice: die führenden Männer Judas
  rationale: שָׂרִים kann Fürsten, Amtsträger oder andere hochgestellte Männer bezeichnen. „Führende Männer“ wahrt diese Bedeutungsbreite, ohne eine präzise Amtsstellung festzulegen.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: die Söhne der Brüder Ahasjas
  rationale: Die Wiedergabe folgt der ausdrücklich formulierten Verwandtschaftsbezeichnung des Hebräischen; gemeint sind Ahasjas Neffen.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: die Ahasja dienten
  rationale: Das Partizip bezeichnet ihre fortdauernde Tätigkeit im Dienst Ahasjas. „Dienten“ bleibt offen für höfischen oder amtlichen Dienst und vermeidet kultische Nebenbedeutungen.
- source_word: וַיַּהַרְגֵם
  choice: und tötete sie
  rationale: הרג bedeutet direkt „töten“. Die schlichte Formulierung ist klar und weder beschönigend noch unnötig dramatisierend.
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die traditionelle, im Deutschen weiterhin verständliche Erzählformel bildet den Fortgang der hebräischen Erzählung würdig und knapp ab.
theological_decisions:
- issue: Charakter von Jehus Handeln in der Gerichtssprache
  choice: שׁפט wird mit gerichtlicher Aussagekraft als „Gericht vollstreckte“ wiedergegeben, ohne eine ausdrückliche göttliche Billigung hinzuzufügen.
  alternative: „richtete“ oder stärker deutend „bestrafte“
  rationale: Der Vers beschreibt Jehus Vorgehen mit gerichtlicher Sprache, bewertet hier aber nicht ausdrücklich jede einzelne Tötung theologisch. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter biblischer Erzählformel. Die relationale Verwandtschaftsangabe und die gerichtliche Sprache des Ausgangstextes bleiben sichtbar; die Satzfügung ist für heutige Leser klar.
