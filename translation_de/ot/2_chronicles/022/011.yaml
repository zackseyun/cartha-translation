source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: de
  text: Doch Joschabat, die Tochter des Königs, nahm Joasch, den Sohn Ahasjas, und brachte ihn heimlich aus der Mitte der Königssöhne weg, die getötet werden sollten.[a] Sie brachte ihn und seine Amme in die Schlafkammer.[b] So verbarg Joschabat, die Tochter des Königs Joram und Frau des Priesters Jojada – sie war nämlich Ahasjas Schwester –, ihn vor Atalja, und diese tötete ihn nicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gerade getötet wurden“; auch möglich: „die getötet worden waren“. Das hebräische Partizip lässt den genauen zeitlichen Bezug offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Zimmer der Betten“.'
    reason: lexical_alternative
  - marker: c
    text: Das feminine Subjekt des hebräischen Schlussverbs wird nicht ausdrücklich genannt. Gemeint ist im Zusammenhang wahrscheinlich Atalja; grammatisch wäre auch ein Bezug auf Joschabat möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: nahm
  rationale: Das gewöhnliche Erzählverb לקח wird formal mit „nahm“ wiedergegeben; die rettende Wirkung ergibt sich aus dem Zusammenhang.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: brachte ihn heimlich … weg
  rationale: גנב bezeichnet wörtlich ein Stehlen, hier aber das heimliche Wegbringen des Kindes. Die Formulierung bewahrt den verborgenen Charakter der Handlung, ohne im Deutschen eine Entführung zu suggerieren.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: aus der Mitte der Königssöhne …, die getötet werden sollten
  rationale: Das passive Partizip bezeichnet die Königssöhne als zur Tötung bestimmt bzw. von der Tötung betroffen. Der Kontext verlangt nicht, dass alle bereits tot waren.
- source_word: מֵינִקְתּוֹ
  choice: seine Amme
  rationale: Das Substantiv bezeichnet die Frau, die das Kind stillte. „Amme“ ist im Deutschen präzise, verständlich und dem historischen Kontext angemessen.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: in die Schlafkammer
  rationale: Wörtlich „in das Zimmer der Betten“. „Schlafkammer“ gibt die Funktion natürlich und mit angemessenem historischem Register wieder.
- source_word: וַתַּסְתִּירֵהוּ
  choice: verbarg … ihn
  rationale: סתר bedeutet „verbergen, verstecken“; „verbarg“ passt zum würdigen Erzählstil.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: sie war nämlich Ahasjas Schwester
  rationale: כִּי führt hier die erklärende Begründung für ihr Handeln ein. „Nämlich“ bildet diesen Zusammenhang im Deutschen natürlich ab.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: vor Atalja
  rationale: מִפְּנֵי kann „vor, aus der Gegenwart von“ bedeuten. Im Zusammenhang heißt es, dass Joasch Ataljas Zugriff entzogen wurde.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: sodass diese ihn nicht tötete
  rationale: Die Folgeformulierung macht den kontextuell wahrscheinlichen Bezug des femininen Subjekts auf Atalja verständlich, während eine Fußnote die grammatische Mehrdeutigkeit wahrt.
theological_decisions:
- issue: Subjekt des Schlussverbs וְלֹא הֱמִיתָתְהוּ
  choice: 'Atalja ist im Haupttext das implizite Subjekt: „sodass diese ihn nicht tötete“.'
  alternative: 'Grammatisch könnte sich das feminine Subjekt auch auf Joschabat beziehen: „und sie tötete ihn nicht“.'
  rationale: Der unmittelbare Satzteil „sie verbarg ihn vor Atalja“ legt nahe, dass Atalja ihn infolge des Verbergens nicht tötete. Da das Hebräische das Subjekt jedoch nur durch die feminine Verbform anzeigt, wird die verbleibende Mehrdeutigkeit in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Erzählfluss. Die Eigennamen folgen geläufigen deutschen Bibelformen. Der Haupttext übersetzt idiomatisch, während die Fußnoten die zeitliche Unschärfe des Partizips, das hebräische Bild der Schlafkammer und die syntaktische Mehrdeutigkeit des Schlussverbs dokumentieren.
