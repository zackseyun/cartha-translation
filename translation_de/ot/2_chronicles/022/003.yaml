  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: de
  text: Auch er folgte den Wegen des Hauses Ahab, denn seine Mutter beriet ihn, Böses zu tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הוּא
  choice: Auch er
  rationale: 'Bewahrt die additive und leicht hervorhebende Kraft: Auch dieser König folgte demselben Muster.'
- source_word: הָלַךְ בְּדַרְכֵי
  choice: lebte nach den Wegen
  rationale: Gibt die ethische Bedeutung des hebräischen Bildes verständlich wieder und lässt zugleich die Weg-Metapher erkennen.
- source_word: בֵּית אַחְאָב
  choice: das Haus Ahabs
  rationale: Bewahrt den familiären und dynastischen Sinn von בֵּית, ohne ihn auf den engeren Begriff »Dynastie« festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Leitet hier die Begründung für seinen Lebenswandel natürlich und eindeutig ein.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Direkte und unzweideutige Wiedergabe.
- source_word: הָיְתָה יֹעַצְתּוֹ
  choice: beriet ihn dazu
  rationale: Die hebräische Konstruktion bezeichnet ihre fortdauernde beratende Einflussnahme; die verbale deutsche Fassung ist natürlicher als »war seine Beraterin«.
- source_word: לְהַרְשִׁיעַ
  choice: gottlos zu handeln
  rationale: Gibt die ausdrücklich negative moralische Wertung des Hifil-Infinitivs wieder, ohne zusätzliche Motive oder konkrete Taten einzutragen.
theological_decisions:
- issue: Moralische Bewertung seines Handelns unter dem Einfluss seiner Mutter
  choice: Die Aussage, dass seine Mutter ihn zu gottlosem Handeln beriet, bleibt ausdrücklich erhalten.
  alternative: »Seine Mutter ermutigte ihn, Böses zu tun.«
  rationale: Der hebräische Text fällt mit לְהַרְשִׁיעַ ein klares moralisches Urteil. »Beriet« wahrt zugleich die Rolle der Mutter als Ratgeberin und vermeidet die zusätzliche psychologische Nuance von »ermutigte«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »lebte nach den Wegen« bewahrt bewusst einen milden biblischen Klang, bleibt aber allgemein verständlich. Keine Fußnote ist nötig, da die syntaktische Alternative den Sinn nicht wesentlich verändert.
