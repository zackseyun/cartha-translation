  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die sechsjährige Dauer klar heraus; „Haus Gottes“ bewahrt die hebräische Ausdrucksweise, während die Fußnote den kulturellen Bezug erläutert.
