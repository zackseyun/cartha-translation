source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: de
  text: Er hielt sich sechs Jahre bei ihnen im Haus Gottes[a] verborgen[b], während Atalja über das Land herrschte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist der Tempelbereich; wörtlich: „das Haus Gottes“.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „verbarg sich“. Das hebräische Partizip kann reflexiv verstanden werden oder in diesem Zusammenhang seinen verborgenen Zustand beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: Er hielt sich … bei ihnen
  rationale: Die Form von היה führt die Erzählung fort und beschreibt Joaschs andauernden Aufenthalt bei den Menschen, die ihn verborgen hielten. „Hielt sich bei ihnen“ ist im Deutschen natürlicher als das formalere „war bei ihnen“.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: im Haus Gottes
  rationale: Die wörtliche Wendung „Haus Gottes“ bleibt erhalten; im Zusammenhang ist damit der Tempel beziehungsweise dessen Bereich gemeint.
- source_word: מִתְחַבֵּא
  choice: verborgen
  rationale: Das Hitpael-Partizip kann reflexiv als „sich verbergend“ oder zustandsbezogen als „verborgen“ verstanden werden. Die Verbindung „hielt sich … verborgen“ gibt die reflexive beziehungsweise mediale Nuance natürlich wieder, ohne auszuschließen, dass andere ihn verbargen.
- source_word: שֵׁשׁ שָׁנִים
  choice: sechs Jahre
  rationale: Die Zeitdauer wird im Deutschen idiomatisch ohne zusätzliche Präposition in die Verbkonstruktion eingefügt.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: während Atalja … herrschte
  rationale: Das Partizip bezeichnet die gleichzeitig andauernde Herrschaft Ataljas; „während“ macht dieses zeitliche Verhältnis im Deutschen deutlich.
- source_word: עַל הָאָרֶץ
  choice: über das Land
  rationale: הָאָרֶץ bezeichnet hier das Herrschaftsgebiet Juda. „Das Land“ bleibt nah am Hebräischen, ohne ausdrücklich „Reich“ einzutragen.
