source:
  edition: WLC
  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: de
  text: Da kehrte er nach Jesreel zurück, um sich von den Wunden zu erholen, die man ihm in Rama zugefügt hatte, als er gegen Hasaël, den König von Aram, kämpfte. Und Asarja[a], der Sohn Jorams und König von Juda, zog hinab, um Joram, den Sohn Ahabs, in Jesreel zu sehen[b], denn er war krank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier steht im hebräischen Text der Chronik der Name Asarja; derselbe König wird an anderen Stellen Ahasja genannt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: um Joram zu besuchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא בְיִזְרְעֶאל
  choice: Da kehrte er nach Jesreel zurück, um sich ... zu erholen
  rationale: Der Wayyiqtol führt die Erzählung fort; שוב bezeichnet die Rückkehr. Das Hitpael von רפא beschreibt hier die Genesung von Verletzungen. Bei der Bewegungsrichtung wird בְיִזְרְעֶאל im Deutschen natürlich mit „nach Jesreel“ wiedergegeben.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: von den Wunden, die man ihm ... zugefügt hatte
  rationale: מַכִּים bezeichnet hier die empfangenen Schläge beziehungsweise deren Folgen, also Wunden. Das unbestimmte pluralische Subjekt von הִכֻּהוּ wird idiomatisch durch „man“ wiedergegeben.
- source_word: בָרָמָה
  choice: in Rama
  rationale: Die Präposition ב markiert den Ort, an dem ihm die Wunden beigebracht wurden. Die deutsche Namensform lautet „Rama“.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: als er gegen Hasaël, den König von Aram, kämpfte
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Begleitumstand. לחם mit אֶת wird im Deutschen eindeutig als „gegen ... kämpfen“ ausgedrückt.
- source_word: וַעֲזַרְיָהוּ
  choice: Und Asarja
  rationale: Der masoretische Text dieses Verses hat ausdrücklich den Namen Asarja. Er wird nicht stillschweigend an die sonst übliche Namensform Ahasja angeglichen.
- source_word: בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: der Sohn Jorams und König von Juda
  rationale: Die Apposition „König von Juda“ bezieht sich syntaktisch am natürlichsten auf Asarja, das Subjekt des Satzes. Die deutsche Bibelnamenform „Joram“ gibt יְהוֹרָם wieder.
- source_word: יָרַד
  choice: zog hinab
  rationale: Die Richtungsbedeutung von ירד bleibt erhalten; „zog hinab“ ist in historischer Erzählprosa natürlich und würdevoll.
- source_word: לִרְאוֹת
  choice: um ... zu sehen
  rationale: Die Grundbedeutung von ראה bleibt im Haupttext erhalten. Im Kontext kann die Wendung idiomatisch einen Krankenbesuch bezeichnen; diese Möglichkeit steht in der Fußnote.
- source_word: כִּי חֹלֶה הוּא
  choice: denn er war krank
  rationale: כִּי gibt den Grund des Besuchs an. חֹלֶה beschreibt seinen durch die Verwundung beeinträchtigten Zustand; „krank“ wahrt die allgemeine Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Namensvariante des judäischen Königs
  choice: Asarja im Haupttext
  alternative: Ahasja
  rationale: Die Lesart des WLC wird bewahrt, ohne sie mit Parallelstellen oder der geläufigeren Benennung dieses Königs zu harmonisieren. Die Identität mit dem andernorts Ahasja genannten König wird transparent in einer Fußnote erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller Erzählprosa. Historische Namensformen folgen gängigem deutschem Bibelgebrauch. Die wörtliche Bewegungsangabe „zog hinab“ und die genuine Namensvariante „Asarja“ bleiben erhalten; potenziell missverständliche oder idiomatische Alternativen werden in Fußnoten offengelegt.
