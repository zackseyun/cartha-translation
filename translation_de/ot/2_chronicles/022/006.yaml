  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem erzählerischem Register. „Sich von den Wunden zu erholen“, „zog hinab“ und „zu sehen“ sind idiomatisch bzw. bewusst quellennah; die Besuchsbedeutung wird hilfreich in der Fußnote genannt.
  terminology: Die Namensformen Jesreel, Rama, Hasaël, Aram, Asarja, Joram und Ahab sind konsistent und im deutschen Bibelregister gut vertretbar. Die Fußnote zu Asarja bewahrt die abweichende Namensform des hebräischen Chroniktextes, ohne harmonisierend in den Haupttext einzugreifen.
