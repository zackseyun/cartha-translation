- from: Ahasjas Untergang[a] kam von Gott, als er zu Joram ging. Denn als er angekommen war, zog er mit Joram zu Jehu, dem Sohn Nimschis, hinaus. Ihn hatte Jahwe gesalbt, um das Haus Ahabs auszurotten.
  to: Ahasjas Untergang[a] durch sein Kommen zu Joram kam von Gott. Als er dort ankam, zog er mit Jehoram zu Jehu, dem Sohn Nimschis, hinaus[b], den Jahwe gesalbt hatte, um das Haus Ahabs auszurotten.
  rationale: Die Revision entfernt eine nicht im Ausgangstext ausgedrückte kausale Verknüpfung, bewahrt die hebräische Variation Joram/Jehoram und ergänzt eine Fußnote an der mehrdeutigen Bewegungsangabe zu Jehu. Die Aussage, dass Ahasjas Untergang von Gott kam, bleibt ohne weitergehende Festlegung der Art göttlicher Verursachung erhalten.
