source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: de
  text: Ahasjas Untergang[a] durch sein Kommen zu Joram kam von Gott. Als er dort ankam, zog er mit Jehoram zu Jehu, dem Sohn Nimschis, hinaus[b], den Jahwe gesalbt hatte, um das Haus Ahabs auszurotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Niederlage« beziehungsweise »Verderben«.'
    reason: Das hebräische Wort תְּבוּסָה umfasst das Zertretenwerden, die Niederlage und den daraus folgenden Untergang.
  - marker: b
    text: 'Oder: »gegen Jehu hinaus« oder »Jehu entgegen«. Wörtlich: »zu Jehu«; der Zusammenhang lässt eine feindliche Begegnung erwarten.'
    reason: Die Präposition אֶל bedeutet zunächst »zu«, kann im Kontext eines militärischen Ausziehens aber eine Bewegung gegen jemanden oder zu einer Begegnung hin bezeichnen.
lexical_decisions:
- source_word: וּמֵאֱלֹהִים הָיְתָה תְּבוּסַת אֲחַזְיָהוּ
  choice: Ahasjas Untergang kam von Gott
  rationale: מִן bezeichnet Gott als Ursprung beziehungsweise Ursache. „Kam von Gott“ bewahrt diese Aussage, ohne die Art der göttlichen Verursachung näher festzulegen. תְּבוּסָה bezeichnet Niederlage, Verderben oder Untergang; im Zusammenhang ist „Untergang“ natürlich und umfassend.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: als er zu Joram ging
  rationale: Der Infinitiv mit ל verbindet Ahasjas Gang zu Joram mit seinem Untergang. Die zeitlich-umständliche Wiedergabe ist im Deutschen verständlich, ohne eine mechanische Kausalität stärker zu behaupten als der hebräische Text.
- source_word: וּבְבֹאוֹ
  choice: Denn als er angekommen war
  rationale: ב mit Infinitiv und Suffix hat temporale Bedeutung. Das Plusquamperfekt verdeutlicht natürlich, dass die Ankunft dem gemeinsamen Ausziehen vorausging; „Denn“ macht den erläuternden Fortgang des Satzes im Deutschen sichtbar.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: zog er mit Joram zu Jehu hinaus
  rationale: יָצָא kann besonders bei militärischen Bewegungen „ausziehen“ bedeuten. אֶל heißt zunächst „zu“; deshalb bleibt der Haupttext neutral, während mögliche feindliche beziehungsweise begegnende Nuancen in der Fußnote stehen.
- source_word: יוֹרָם / יְהוֹרָם
  choice: Joram / Joram
  rationale: Die beiden hebräischen Namensformen bezeichnen hier denselben König. Im Deutschen wird die geläufige einheitliche Form „Joram“ verwendet, da eine künstliche Variation zu „Jehoram“ leicht zwei Personen vermuten ließe.
- source_word: אֲשֶׁר מְשָׁחוֹ יְהוָה
  choice: Ihn hatte Jahwe gesalbt
  rationale: Die abgeschlossene Handlung liegt vor der erzählten Begegnung; das deutsche Plusquamperfekt gibt dieses Verhältnis klar wieder. Das Tetragramm wird als persönlicher Name „Jahwe“ wiedergegeben.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: um das Haus Ahabs auszurotten
  rationale: Das Hifil von כרת bedeutet hier beseitigen beziehungsweise vernichten. „Ausrotten“ gibt das umfassende Gericht über Ahabs Dynastie idiomatisch und deutlich wieder; „Haus“ bewahrt den dynastischen Ausdruck.
theological_decisions:
- issue: Göttliche Verursachung von Ahasjas Untergang
  choice: „Ahasjas Untergang kam von Gott“
  alternative: „Gott hatte Ahasjas Untergang bestimmt“ oder „Gott ließ Ahasjas Untergang zu“
  rationale: Der hebräische Text führt den Untergang auf Gott zurück, legt aber nicht ausdrücklich fest, ob dies als unmittelbare Bestimmung, als Vorsehung oder als Zulassung zu verstehen ist. Die Übersetzung bewahrt diese Spannung.
- issue: Zweck der Salbung Jehus
  choice: „um das Haus Ahabs auszurotten“
  alternative: „um das Haus Ahabs abzuschneiden“
  rationale: Der Zwecksatz schreibt Jehus Salbung ausdrücklich das Gericht über Ahabs Dynastie zu. Die gewählte Formulierung wahrt den harten Gerichtscharakter, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze entlasten die im Hebräischen dichte Syntax. „Jahwe“ gibt den Gottesnamen wieder; „Haus Ahabs“ bleibt als dynastische Wendung erhalten. Die Fußnotenmarke [a] steht unmittelbar bei „Untergang“.
