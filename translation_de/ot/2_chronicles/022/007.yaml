  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. Der Relativsatz bei Jehu vermeidet das etwas lose anknüpfende „Ihn hatte Jahwe gesalbt“, und der Fortgang wird ohne das unnötig begründende „Denn“ klarer.
  terminology: „Jahwe“, „Haus Ahabs“ und „ausrotten“ geben den Gottesnamen, den dynastischen Ausdruck und den harten Charakter von לְהַכְרִית angemessen wieder. „Untergang“ bleibt für תְּבוּסָה passend. Die wechselnden Formen Joram/Jehoram werden quellentreu bewahrt.
