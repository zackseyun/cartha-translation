  - severity: low
    issue: Harmonisierung von יוֹרָם und יְהוֹרָם zu „Joram“
    rationale: Der hebräische Vers verwendet nacheinander zwei Namensformen für denselben König. Die Variation kann im Deutschen als Joram/Jehoram bewahrt werden; der Kontext verhindert eine Verwechslung mit zwei Personen.
  - severity: medium
