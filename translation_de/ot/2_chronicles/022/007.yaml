    rationale: „Zu Jehu hinausziehen“ ist als Haupttext möglich, doch die Konstruktion kann im Kontext auch ein Ausziehen gegen bzw. zur Begegnung mit Jehu nahelegen. Eine Fußnote wahrt diese offene Nuance.
