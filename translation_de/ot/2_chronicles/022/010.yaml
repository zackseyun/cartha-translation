  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: de
  text: Atalja, die Mutter Ahasjas, sah, dass ihr Sohn tot war. Da erhob sie sich und vernichtete[a] die gesamte königliche Nachkommenschaft des Hauses Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Verbform ist hier schwierig und bedeutet ihrer gewöhnlichen Form nach wörtlich »und sie redete«. Der Zusammenhang und die Parallelstelle in 2 Könige 11,1 stützen jedoch den Sinn »vernichtete« oder »tötete«.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Als Atalja
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Bibeltradition als »Atalja« wiedergegeben. Das vorangestellte Waw verbindet die Erzählung; zusammen mit dem folgenden Wahrnehmungssatz wird der zeitliche Zusammenhang im Deutschen natürlich durch »Als« ausgedrückt, ohne ein nicht vorhandenes »nun« einzuführen.
- source_word: אֵם אֲחַזְיָהוּ
  choice: die Mutter Ahasjas
  rationale: Die Status-constructus-Verbindung wird als klare appositionelle Zuordnung wiedergegeben; »Ahasjas« ist die natürliche deutsche Genitivform.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: sah, dass ihr Sohn tot war
  rationale: רָאָה mit כִּי bezeichnet die Wahrnehmung eines Sachverhalts. »tot war« bewahrt den stativen Ausdruck des Hebräischen.
- source_word: וַתָּקָם
  choice: machte sie sich daran
  rationale: קוּם leitet hier entschlossenes Handeln ein. Die idiomatische Wendung vermittelt diese Funktion natürlicher als das im Deutschen missverständliche wörtliche »stand sie auf«.
- source_word: וַתְּדַבֵּר
  choice: vernichtete
  rationale: Die masoretische Form sieht wie eine Form von דבר, »reden«, aus; mit dem direkten Objekt ist dieser Sinn jedoch schwierig. Der Zusammenhang und 2 Könige 11,1 stützen den Sinn »vernichten/töten«. Die Schwierigkeit wird in der Fußnote offengelegt.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: die gesamte königliche Nachkommenschaft
  rationale: זֶרַע bedeutet wörtlich »Same« und bezeichnet hier die dynastische Nachkommenschaft. »Königliche Nachkommenschaft« wahrt diesen Bezug besser als das breitere »Königshaus«.
- source_word: לְבֵית יְהוּדָה
  choice: des Hauses Juda
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit der Nachkommenschaft zum dynastischen Haus Juda. Die Genitivverbindung ist im Deutschen klar und würdevoll.
theological_decisions:
- issue: Wiedergabe der schwierigen Verbform וַתְּדַבֵּר
  choice: vernichtete
  alternative: redete gegen sie / ließ sie töten
  rationale: Eine wörtliche Ableitung von דבר (»reden«) ergibt mit »die gesamte königliche Nachkommenschaft« als direktem Objekt keinen überzeugenden Sinn. Der unmittelbare Zusammenhang sowie die Parallele in 2 Könige 11,1 sprechen für eine Tötungs- bzw. Vernichtungsbedeutung. Da dies eine textlich-lexikalische Schwierigkeit ist, wird sie nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Machte sie sich daran« gibt den entschlossenen Handlungsbeginn idiomatisch wieder. Der Fußnotenmarker steht unmittelbar nach der textkritisch schwierigen Aussage.
