source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: de
  text: Er tat, was böse war in den Augen Jahwes, wie das Haus Ahabs; denn nach dem Tod seines Vaters waren sie seine Ratgeber – zu seinem Verderben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinem Untergang“ oder „um ihn zu vernichten“. Die hebräische Wendung kann sowohl die Folge ihres Rates als auch dessen zerstörerische Absicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die geläufige hebräische Bewertungsformel wird in natürliches modernes Deutsch übertragen; der erzählende Anschluss mit וַ wird nicht eigens durch „und“ wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher der göttlichen Beurteilung bleibt erhalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כְּבֵית אַחְאָב
  choice: wie das Haus Ahabs
  rationale: כְּ bezeichnet einen Vergleich; „Haus Ahabs“ bewahrt den Bezug auf Familie beziehungsweise Dynastie.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der vorausgehenden Beurteilung ein und fügt sich hier natürlich in den Satzfluss ein.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: sie waren seine Ratgeber
  rationale: Die nominale Aussage und der Rückbezug auf das Haus Ahabs werden knapp und verständlich bewahrt.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: nach dem Tod seines Vaters
  rationale: Die zeitliche Angabe wird formal nah und zugleich idiomatisch wiedergegeben.
- source_word: לְמַשְׁחִית לוֹ
  choice: zu seinem Verderben
  rationale: Die knappe hebräische Wendung kann Ergebnis oder Zweck ausdrücken. Die Hauptübersetzung bewahrt diese Offenheit eher als die explizite Form „um ihn zu vernichten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Absicht oder Ergebnis des verderblichen Rates
  choice: zu seinem Verderben
  alternative: um ihn zu vernichten
  rationale: Die לְ-Konstruktion lässt sowohl eine Folge als auch eine destruktive Zielrichtung zu; die Übersetzung legt die Absicht der Ratgeber nicht unnötig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Wendung „in den Augen“ und der dynastische Ausdruck „Haus Ahabs“ bleiben erhalten; die syntaktische Ambiguität des Versschlusses wird nicht aufgelöst.
