source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: de
  text: Auch seine Amtsträger steuerten eine freiwillige Gabe für das Volk, die Priester und die Leviten bei. Hilkija, Secharja und Jehiël, die Vorsteher des Hauses Gottes, gaben den Priestern 2.600 Passahopfer[a] und 300 Rinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „für die Passahopfer“. Gemeint sind die Tiere, die für die Passahfeier bestimmt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: Auch seine Amtsträger
  rationale: שָׂרִים bezeichnet hier hochgestellte Verantwortliche im Umfeld des Königs. „Amtsträger“ ist modern und vermeidet die stärker aristokratische Bedeutung von „Fürsten“; „auch“ verbindet ihren Beitrag natürlich mit dem vorangehenden Vers.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: steuerten eine freiwillige Gabe ... bei
  rationale: נְדָבָה bezeichnet eine freiwillige Gabe, während der Hifil von רום hier das Leisten eines Beitrags ausdrückt. Die Formulierung bewahrt den nominalen Charakter der Gabe und klingt im Deutschen natürlich.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: für das Volk, die Priester und die Leviten
  rationale: Das wiederholte ל kennzeichnet die Empfänger beziehungsweise Begünstigten. Im Deutschen muss die Präposition nicht vor jedem Glied wiederholt werden.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilkija, Secharja und Jehiël
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen und geben die drei hebräischen Personennamen eindeutig wieder.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: die Vorsteher des Hauses Gottes
  rationale: נְגִידֵי bezeichnet leitende Verantwortliche; „Vorsteher“ passt zur administrativen Funktion im Tempel. „Haus Gottes“ bewahrt die traditionelle und im Kontext klare Tempelbezeichnung.
- source_word: לַפְּסָחִים
  choice: Passahopfer
  rationale: Der hebräische Plural bezeichnet hier die für die Passahfeier bestimmten Opfertiere beziehungsweise Opfer. „Passahopfer“ ist zählbar, kultisch passend und legt die Tierart nicht unnötig fest.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: 2.600 Passahopfer und 300 Rinder
  rationale: Die Zahlen werden lesefreundlich als Ziffern wiedergegeben. בָּקָר ist eine Kollektivbezeichnung für Rinder und wird daher nicht enger als „Ochsen“ übersetzt.
theological_decisions:
- issue: Bezeichnung des Tempels als „Haus Gottes“
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: Die wörtliche Metapher בֵּית הָאֱלֹהִים bleibt erhalten, da sie im Deutschen verständlich ist und nicht durch eine interpretierende Sachbezeichnung ersetzt werden muss.
translation_notes:
  register: Moderne, würdige Standardsprache. „Amtsträger“, „steuerten ... bei“ und „Vorsteher“ sind allgemein verständlich, ohne den kultischen und administrativen Kontext zu verflachen. Die Satzfolge und die Empfängergruppen des Hebräischen bleiben erhalten.
