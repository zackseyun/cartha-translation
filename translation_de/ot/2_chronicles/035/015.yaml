base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: de
  text: Und die Sänger, die Söhne Asafs, standen an ihren Plätzen nach dem Gebot Davids, Asafs, Hemans und Jedutuns, des Sehers des Königs; und die Torhüter standen an jedem Tor. Sie brauchten ihren Dienst nicht zu verlassen[a], denn ihre Brüder, die Leviten, bereiteten das Nötige für sie vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollten ihren Dienst nicht verlassen.“ Das Hebräische kann stärker verstanden werden; der folgende Begründungssatz spricht jedoch eher dafür, dass sie ihren Dienst nicht verlassen mussten, weil die Leviten das Nötige für sie vorbereiteten.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: die Sänger
  rationale: Das Partizip von שׁיר bezeichnet hier die mit dem Singen Beauftragten; „Sänger“ ist genauer als das breitere „Musiker“.
- source_word: בְּנֵי אָסָף
  choice: die Söhne Asafs
  rationale: Die formale Wendung bezeichnet die Nachkommen beziehungsweise Sängergruppe Asafs. Die historisch erkennbare Ausdrucksweise „Söhne Asafs“ bleibt erhalten.
- source_word: עַל מַעֲמָדָם
  choice: standen an ihren Plätzen
  rationale: מַעֲמָד bezeichnet den zugewiesenen Standort oder Dienstplatz. Die deutsche Formulierung gibt zugleich die Zuständigkeit im geordneten Tempeldienst wieder.
- source_word: כְּמִצְוַת
  choice: nach dem Gebot
  rationale: מִצְוָה bezeichnet eine verbindliche Anordnung; „Gebot“ wahrt ihre Autorität und ist in diesem Kontext idiomatisch.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: des Sehers des Königs
  rationale: חוֹזֶה ist die historische Amtsbezeichnung „Seher“. Der Ausdruck wird aufgrund seiner unmittelbaren Stellung auf Jedutun bezogen.
- source_word: הַשֹּׁעֲרִים
  choice: die Torhüter
  rationale: Im Tempelzusammenhang sind damit die an den Toren eingesetzten Amtsträger gemeint; „Torhüter“ ist präzise und gebräuchlich.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: an jedem Tor
  rationale: Die distributive hebräische Wendung weist die Torhüter den einzelnen Toren zu.
- source_word: אֵין לָהֶם לָסוּר
  choice: Sie brauchten … nicht zu verlassen
  rationale: אֵין mit ל und Infinitiv drückt hier am ehesten fehlende Notwendigkeit aus. Der folgende Begründungssatz erklärt, weshalb sie ihren Dienstplatz nicht verlassen mussten.
- source_word: מֵעַל עֲבֹדָתָם
  choice: ihren Dienst
  rationale: עֲבֹדָה bezeichnet hier den kultischen Dienst und nicht bloß allgemein eine Arbeit.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: ihre Brüder, die Leviten
  rationale: Die ausdrückliche Verwandtschafts- beziehungsweise Gruppensprache des Hebräischen wird beibehalten; „die Leviten“ steht erläuternd dazu.
- source_word: הֵכִינוּ לָהֶם
  choice: bereiteten für sie alles vor
  rationale: הכין bedeutet „bereitmachen, vorbereiten“. Das ergänzte „alles“ macht die im Deutschen erforderliche, aber im Hebräischen unausgesprochene Objektvorstellung natürlich, ohne konkrete Speisen oder Gegenstände festzulegen.
theological_decisions:
- issue: Syntaktischer Bezug von „Seher des Königs“
  choice: 'Die Bezeichnung wird auf Jedutun bezogen: „Jedutun, der Seher des Königs“.'
  alternative: Die Bezeichnung könnte lockerer auf die vorausgehende Namensreihe bezogen werden.
  rationale: Die singularische Bezeichnung חוֹזֵה הַמֶּלֶךְ folgt unmittelbar auf den singularischen Eigennamen Jedutun und ist daher am natürlichsten als dessen Apposition zu verstehen.
- issue: Bedeutungsstärke von אֵין לָהֶם לָסוּר
  choice: 'Der Satz bezeichnet fehlende Notwendigkeit: „Sie brauchten … nicht zu verlassen“.'
  alternative: 'Stärker beziehungsweise vorschreibend: „Sie durften/sollten ihren Dienst nicht verlassen.“'
  rationale: Die Konstruktion kann unterschiedlich stark verstanden werden. Der anschließende Kausalsatz – die Leviten bereiteten für sie vor – stützt die Aussage, dass kein Verlassen des Dienstes nötig war, mehr als ein Verbot.
translation_notes:
  register: Moderne, würdige Standardsprache mit kultisch-historisch passenden Begriffen. Die Satzstruktur bleibt dem hebräischen Ablauf nahe, ohne im Deutschen schwerfällig zu wirken. Der Genitiv „des Sehers des Königs“ ist formal eindeutig, wenn auch gehoben; er bewahrt den unmittelbaren Bezug auf Jedutun.
