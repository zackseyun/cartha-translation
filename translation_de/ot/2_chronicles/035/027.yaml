  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: de
  text: Seine Taten[a], die früheren und die späteren – siehe, sie sind im Buch der Könige von Israel und Juda aufgezeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Worte« oder »seine Angelegenheiten«. Das hebräische Wort kann Worte, Angelegenheiten oder Taten bezeichnen; in dieser königlichen Schlussformel sind wohl seine Taten und Regierungsgeschäfte gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: Seine Taten
  rationale: דבר kann »Wort«, »Angelegenheit« oder »Tat« bedeuten. In dieser königlichen Schlussformel bezeichnet es am ehesten die berichteten Taten und Angelegenheiten Josias.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: die früheren und die späteren
  rationale: Die Wendung umfasst die gesamte Regierungszeit; diese Wiedergabe ist im modernen Deutschen natürlicher als »die ersten und die letzten«.
- source_word: הִנָּם
  choice: sind
  rationale: Das hebräische Aufmerksamkeitssignal ist in die feststellende deutsche Satzform einbezogen; ein ausdrückliches »siehe« wäre hier merklich altertümlich.
- source_word: כְּתוּבִים
  choice: aufgezeichnet
  rationale: Das Partizip bedeutet wörtlich »geschrieben«; »aufgezeichnet« gibt den Sinn in einer Quellenangabe idiomatisch wieder.
- source_word: עַל סֵפֶר
  choice: in der Schrift über
  rationale: על ist wörtlich »auf/über«. Zusammen mit ספר bezeichnet die Formulierung die schriftliche Quelle; »Schrift über« bewahrt zugleich die mögliche sachliche Beziehung des Titels.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: die Könige von Israel und Juda
  rationale: Die Genitivverbindung benennt den Gegenstand beziehungsweise Titel der zitierten Quelle.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die archaische Interjektion »siehe« wurde nicht eigens wiedergegeben, da die deutsche Feststellung die hervorhebende Funktion von הִנָּם ausreichend trägt. Der Quellenname bleibt als beschreibende Bezeichnung formuliert, weil die genaue Identität und Titelform des Werkes nicht sicher festzulegen ist.
