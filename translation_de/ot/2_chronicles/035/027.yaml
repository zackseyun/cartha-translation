  - severity: medium
    issue: „in der Schrift über die Könige von Israel und Juda“ gibt die Quellbezeichnung ungenau wieder.
    rationale: Die hebräische Verbindung nennt das Buch als „Buch der Könige von Israel und Juda“, nicht eine Schrift, die lediglich von den Königen handelt. Die Präposition ist im Deutschen idiomatisch mit „im Buch“ wiederzugeben.
  revised_text: Seine Taten[a], die früheren und die späteren – siehe, sie sind im Buch der Könige von Israel und Juda aufgezeichnet.
