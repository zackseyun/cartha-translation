  source_fidelity: Die Wiedergabe von דְבָרָיו als „Taten“ und von „den früheren und den späteren“ trifft den Sinn der königlichen Schlussformel. Jedoch wird הִנָּם, ein ausdrücklich hervorhebendes Partikel, im Entwurf nicht wiedergegeben. Außerdem bezeichnet עַל סֵפֶר hier die Eintragung in einem als „Buch der Könige von Israel und Juda“ bezeichneten Werk; „Schrift über die Könige“ verschiebt die Konstruktion zu einer bloßen Schrift über deren Gegenstand.
  naturalness: „Siehe“ ist in modernem Standarddeutsch zwar markiert, in dieser knappen formelhaften Quellenangabe aber verständlich und angemessen. Die Gedankenstriche erlauben eine natürliche, würdige Satzführung.
  terminology: „Buch der Könige von Israel und Juda“ gibt die Quellbezeichnung sachgerecht wieder. „Aufgezeichnet“ ist für כְּתוּבִים idiomatisch und quellentextlich passend.
