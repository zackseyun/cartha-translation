  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: de
  text: Danach bereiteten sie für sich selbst und für die Priester[a] zu; denn die Priester, die Söhne Aarons, waren bis zur Nacht damit beschäftigt, das Brandopfer und die Fettstücke darzubringen. So bereiteten die Leviten für sich selbst und für die Priester, die Söhne Aarons, zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für sie« an beiden Stellen, an denen »für sich selbst« steht. Das hebräische Pronomen ist nicht ausdrücklich reflexiv; der Zusammenhang legt jedoch nahe, dass die Leviten sowohl für die eigene Versorgung als auch für die Priester zubereiteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Kennzeichnet die zeitliche Abfolge gegenüber dem vorhergehenden Geschehen knapp und natürlich.
- source_word: הֵכִינוּ
  choice: bereiteten ... alles vor
  rationale: Das Hifil von כון bedeutet hier »vorbereiten/bereitmachen«. »Alles« bildet im Deutschen das aus dem Zusammenhang erschließbare Objekt natürlich ab, ohne es ausdrücklich auf Speisen einzuengen.
- source_word: לָהֶם
  choice: für sich selbst
  rationale: Das Pronomen ist formal nicht reflexiv, bezieht sich im Kontext aber am wahrscheinlichsten auf die handelnden Leviten und ihre eigene Versorgung; die mögliche nichtreflexive Lesart wird in der Fußnote bewahrt.
- source_word: וְלַכֹּהֲנִים
  choice: und für die Priester
  rationale: Gibt die Dativbestimmung direkt wieder und nennt die weitere Gruppe, für die etwas vorbereitet wurde.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb die Leviten auch für die Priester vorbereiteten.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: die Priester, die Söhne Aarons
  rationale: Bewahrt die appositionelle und genealogische Ausdrucksweise des Hebräischen.
- source_word: בְּהַעֲלוֹת
  choice: waren ... damit beschäftigt, ... darzubringen
  rationale: Bringt die andauernde kultische Tätigkeit zum Ausdruck, die die Priester an eigener Vorbereitung hinderte.
- source_word: הָעוֹלָה
  choice: das Brandopfer
  rationale: Etablierte und sachlich genaue deutsche Bezeichnung für עֹלָה im Opferkontext.
- source_word: וְהַחֲלָבִים
  choice: und die Fettstücke
  rationale: Bezeichnet die für den Altar bestimmten Fettteile der Opfertiere präziser als das allgemeine »Fett«.
- source_word: עַד לָיְלָה
  choice: bis in die Nacht
  rationale: Natürliches Deutsch, das eine Tätigkeit ausdrückt, die bis zur Nacht andauerte.
- source_word: וְהַלְוִיִּם
  choice: Deshalb ... die Leviten
  rationale: Das deutsche Folgewort verdeutlicht den aus der Begründung hervorgehenden Zusammenhang, während »die Leviten« das im Hebräischen ausdrücklich wiederaufgenommene Subjekt bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe »Priester«, »Brandopfer« und »Fettstücke« bleiben erhalten. Die Satzstruktur bildet Begründung und Folgerung klar ab; die Wiederholung am Versende wird entsprechend dem Hebräischen bewahrt.
