source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: de
  text: Stellt euch im Heiligtum auf, geordnet nach den Abteilungen der Sippen eurer Brüder, der Angehörigen des Volkes[a], und nach der Abteilung einer Sippe für die Leviten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne des Volkes«; gemeint sind hier die nichtlevitischen Israeliten im Unterschied zu den Leviten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: Stellt euch auf
  rationale: Der Qal-Imperativ Plural von עמד fordert die Leviten unmittelbar auf, ihre vorgesehenen Plätze einzunehmen; „stellt euch auf“ gibt dies im Deutschen natürlicher wieder als bloßes „steht“.
- source_word: בַקֹּדֶשׁ
  choice: im Heiligtum
  rationale: Präposition und bestimmter Artikel weisen auf den heiligen Bereich hin. „Heiligtum“ bewahrt den konkreten kultischen Ortsbezug, ohne einen bestimmten Raum festzulegen.
- source_word: לִפְלֻגּוֹת
  choice: geordnet nach den Abteilungen
  rationale: פלגה bezeichnet organisatorische Gruppen oder Abteilungen; das präfigierte ל drückt hier die maßgebliche Einteilung aus.
- source_word: בֵּית הָאָבוֹת
  choice: Sippen
  rationale: Der Ausdruck bezeichnet väterliche Großfamilien beziehungsweise genealogisch organisierte Hausverbände. „Sippen“ ist im modernen Deutschen verständlich und vermeidet das missverständliche wörtliche „Vaterhäuser“.
- source_word: לַאֲחֵיכֶם
  choice: eurer Brüder
  rationale: Die verwandtschaftliche Bundes- und Volkszugehörigkeit der übrigen Israeliten zu den Leviten bleibt ausdrücklich erhalten.
- source_word: בְּנֵי הָעָם
  choice: der Angehörigen des Volkes
  rationale: Wörtlich „Söhne des Volkes“; gemeint sind hier die nichtlevitischen Israeliten im Unterschied zu den Leviten. „Angehörige des Volkes“ gibt die soziale Zuordnung idiomatisch wieder, während eine Fußnote die Abgrenzung erläutert.
- source_word: וַחֲלֻקַּת בֵּית אָב לַלְוִיִּם
  choice: und nach der jeweiligen Abteilung einer levitischen Sippe
  rationale: Die knappe hebräische Nominalfügung koordiniert offenbar jeder Abteilung der nichtlevitischen Sippen eine Abteilung aus einem levitischen Hausverband. „jeweiligen“ macht den distributiven Zusammenhang verständlich, ohne eine weitergehende Zuordnung festzulegen.
theological_decisions:
- issue: Abgrenzung zwischen nichtlevitischen Israeliten und Leviten
  choice: „Angehörige des Volkes“ im Haupttext, mit erläuternder Fußnote
  alternative: „Söhne des Volkes“ oder „Laien“
  rationale: „Söhne des Volkes“ wäre im Deutschen unklar, während „Laien“ spätere religiöse Kategorien eintragen könnte. Die gewählte Formulierung wahrt die innerisraelitische Unterscheidung, ohne eine konfessionelle Amtslehre vorauszusetzen.
- issue: Verwandtschaftliche Bezeichnung לַאֲחֵיכֶם
  choice: „eurer Brüder“
  alternative: „eurer israelitischen Mitbürger“
  rationale: Die direkte Verwandtschaftssprache des Hebräischen trägt zur Darstellung Israels als verbundenes Volk bei und sollte nicht unnötig neutralisiert werden.
translation_notes:
  register: Moderne, würdige Standardsprache. „Sippen“ bezeichnet die genealogischen Hausverbände verständlicher als das formalere „Vaterhäuser“. Die parallele, im Hebräischen knappe Einteilungsstruktur wird lesbar gemacht, ohne die genaue organisatorische Zuordnung über den Text hinaus zu bestimmen.
