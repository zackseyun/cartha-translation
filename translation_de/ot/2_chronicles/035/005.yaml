    rationale: Die Formulierung ist kontextuell plausibel, wandelt die Präpositionalfügung „für die Leviten“ aber in ein adjektivisches Merkmal der Sippe um. Die relationale Formulierung kann im Deutschen ohne Einbuße beibehalten werden.
