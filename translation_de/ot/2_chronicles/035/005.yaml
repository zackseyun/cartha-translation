  verdict: revise
  source_fidelity: Die Übersetzung trifft Imperativ, kultischen Ort und die Gliederung nach Familienverbänden grundsätzlich gut. Im letzten Satzglied fügt „jeweiligen“ jedoch eine ausdrückliche Zuordnung/Korrespondenz hinzu, die im knappen hebräischen Text nicht bezeichnet ist. Zudem macht „levitischen Sippe“ die relationale Wendung לַלְוִיִּם stärker attributiv, als es nötig ist.
  naturalness: „Stellt euch im Heiligtum auf“ und „geordnet nach“ sind modernes, angemessen würdiges Deutsch. „Sippen“ ist hier als Bezeichnung genealogischer Hausverbände verständlich. Die bereinigte Schlussformulierung bleibt lesbar und bewahrt zugleich die knappe organisatorische Formulierung des Ausgangstextes.
  terminology: „Heiligtum“, „Abteilungen“, „Sippen“, „Brüder“ und „Leviten“ sind sachgerecht. „Angehörige des Volkes“ ist als idiomatische Wiedergabe von בני העם vertretbar, sofern die Fußnote die wörtliche und kontextuelle Bedeutung festhält. Die Fußnote ist korrekt verankert und inhaltlich angemessen.
