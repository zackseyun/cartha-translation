base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: de
  text: So wurde der Dienst vorbereitet[a], und die Priester standen an ihren Plätzen[b] und die Leviten nach ihren Abteilungen[c], gemäß dem Befehl des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde geordnet“ beziehungsweise „wurde eingerichtet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an ihrem Stand(platz)“; gemeint sind ihre zugewiesenen Dienstplätze.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in ihren Abteilungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: wurde vorbereitet
  rationale: Das Verb כון bezeichnet hier das Bereitmachen beziehungsweise geordnete Einrichten des Passahdienstes. „Wurde vorbereitet“ ist im Deutschen natürlich und wahrt den passivischen Sinn.
- source_word: הָעֲבוֹדָה
  choice: der Dienst
  rationale: Im Tempelzusammenhang meint עֲבוֹדָה den geordneten Kult- beziehungsweise Gottesdienst. „Der Dienst“ bewahrt diesen sakralen Bezug ohne spätere liturgische Fachsprache einzutragen.
- source_word: וַיַּעַמְדוּ
  choice: traten an
  rationale: עמד bedeutet wörtlich „stehen“; zusammen mit den folgenden Orts- und Ordnungsangaben bezeichnet es hier das Einnehmen der zugewiesenen Stellung. „Traten an“ gibt dies idiomatisch wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und sachlich genaue deutsche Wiedergabe im kultischen Zusammenhang.
- source_word: עַל עָמְדָם
  choice: an ihre Plätze
  rationale: Die Wendung bezeichnet wörtlich ihren Stand beziehungsweise Standplatz und meint die zugewiesenen Dienstplätze.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche Wiedergabe der Stammes- und Amtsbezeichnung.
- source_word: עַל מַחְלְקוֹתָם
  choice: zu ihren Abteilungen
  rationale: מַחְלְקוֹת bezeichnet die organisierten Dienstabteilungen. „Zu ihren Abteilungen“ passt zur verbalen Formulierung „traten an“ und macht die Zuordnung verständlich.
- source_word: כְּמִצְוַת הַמֶּלֶךְ
  choice: wie der König befohlen hatte
  rationale: Die hebräische Präpositionalfügung bedeutet „gemäß dem Befehl des Königs“. Die verbale Wiedergabe ist natürliches modernes Deutsch und erhält den Bezug auf eine konkrete königliche Anordnung.
theological_decisions:
- issue: Kultische Bedeutung von עֲבוֹדָה
  choice: der Dienst
  alternative: der Gottesdienst; die Tempeldienste; die Arbeit
  rationale: „Dienst“ lässt den konkreten Umfang der kultischen Tätigkeit offen und vermeidet sowohl eine Verengung auf eine moderne Gottesdienstform als auch die zu allgemeine Bedeutung „Arbeit“.
- issue: Organisatorische Stellung der Priester und Leviten
  choice: an ihre Plätze … zu ihren Abteilungen
  alternative: an ihren Standplätzen … nach ihren Abteilungen
  rationale: Die gewählte Formulierung gibt die geordnete Zuweisung wieder, ohne zusätzliche Aussagen über Rang, Amt oder konkrete liturgische Funktionen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber mit „traten an“ und einer verbalen Schlusswendung idiomatisch gestaltet. Alle echten lexikalischen Alternativen werden in Fußnoten kenntlich gemacht.
