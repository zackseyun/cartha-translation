base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: de
  text: Im achtzehnten Jahr der Regierungszeit Josias wurde dieses Passa gefeiert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde dieses Passa begangen“; wörtlich: „wurde dieses Passa getan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Im achtzehnten Jahr
  rationale: Die Verbindung von ב mit der Zahl und שָׁנָה ist eine Zeitangabe. „Im achtzehnten Jahr“ gibt sie im Deutschen natürlich und genau wieder.
- source_word: לְ/מַלְכוּת יֹאשִׁיָּהוּ
  choice: der Herrschaft Josias
  rationale: מַלְכוּת bezeichnet hier den Zeitraum königlicher Herrschaft; der deutsche Genitiv fügt sich natürlich in die Datierungsformel ein.
- source_word: נַעֲשָׂה
  choice: wurde … gefeiert
  rationale: Das Nifal von עשה bedeutet wörtlich „wurde getan/ausgeführt“. In Verbindung mit dem Passa bezeichnet es idiomatisch dessen Durchführung oder Feier.
- source_word: הַ/פֶּסַח
  choice: dieses Passafest
  rationale: פֶּסַח kann das Passa beziehungsweise die Passafeier bezeichnen. „Passafest“ macht im Deutschen deutlich, dass hier die begangene Feier gemeint ist.
- source_word: הַ/זֶּה
  choice: dieses
  rationale: Das Demonstrativpronomen verweist auf das zuvor ausführlich beschriebene Passa zurück.
