  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: de
  text: 'Doch er schickte Boten zu ihm und ließ ihm sagen: »Was habe ich mit dir zu schaffen, König von Juda? Nicht gegen dich ziehe ich heute, sondern gegen das Haus, mit dem ich Krieg führe.[a] Gott hat zu mir gesagt, ich solle mich beeilen. Hör auf, dich Gott entgegenzustellen, der mit mir ist, damit er dich nicht vernichtet!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer verständlich. Möglich sind auch: »gegen den Ort, an dem ich Krieg führe« oder »gegen das Haus/Königreich, mit dem ich Krieg führe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Abgesandte Nechos gemeint; »Boten« ist im Deutschen klar und natürlich.
- source_word: מַה לִּי וָלָךְ
  choice: Was habe ich mit dir zu schaffen?
  rationale: Die deutsche Wendung gibt die semitische Distanzierungsformel wieder, ohne sie als persönliche Feindschaft zu überdeuten.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Nicht gegen dich ziehe ich heute
  rationale: Der hebräische Satz ist elliptisch. »ziehen« ergänzt im militärischen Zusammenhang den vorausgesetzten Vorgang und bewahrt durch die Voranstellung den Nachdruck auf »nicht gegen dich«.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: gegen das Haus, mit dem ich Krieg führe
  rationale: Die schwierige Wendung wird verständlich wiedergegeben, ohne die Bildsprache von »Haus« eindeutig als Ort, Dynastie oder Reich festzulegen; Alternativen stehen in der Fußnote.
- source_word: וֵאלֹהִים
  choice: Gott
  rationale: Das zugehörige Verb אָמַר steht im Singular. Auch der Fortgang in Vers 22 behandelt Nechos Worte als eine von Gott kommende Warnung.
- source_word: לְבַהֲלֵנִי
  choice: ich solle mich beeilen
  rationale: Die Form bezeichnet das Antreiben zu dringlicher Eile. Die indirekte Rede ist natürliches modernes Deutsch und erhält den Inhalt von Gottes Aufforderung.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Hör auf, dich Gott entgegenzustellen
  rationale: Das wörtlich schwer verständliche »Lass ab von Gott« fordert Josia im Kontext dazu auf, Gottes Handeln nicht länger zu widerstehen.
- source_word: אֲשֶׁר עִמִּי
  choice: der mit mir ist
  rationale: Die knappe relative Aussage bleibt erhalten, ohne Art und Umfang des göttlichen Beistands näher zu bestimmen.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: damit er dich nicht vernichtet
  rationale: Nach der vorausgehenden Aufforderung drückt die Klausel die abzuwendende Folge aus; »vernichten« wahrt die Schärfe der Warnung.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Nechos Rede
  choice: Singular »Gott«
  alternative: »ein Gott« oder »die Götter«
  rationale: Das singularische Verb spricht grammatisch für einen einzelnen Referenten. Vers 22 bestätigt innerhalb der Erzählung, dass die Warnung als Wort aus Gottes Mund verstanden wird; die Übersetzung bewertet darüber hinaus weder Nechos Glauben noch seine Gotteserkenntnis.
- issue: Deutung von בֵּית מִלְחַמְתִּי
  choice: Die Haus-Metapher im Haupttext beibehalten
  alternative: »Ort meines Krieges«, »Königreich/Dynastie, mit der ich Krieg führe«
  rationale: Die hebräische Formulierung ist ungewöhnlich und ihr konkreter Bezug unsicher. Der Haupttext wahrt diese Offenheit, während die Fußnote die wichtigsten Deutungsmöglichkeiten nennt.
- issue: Gottes Beistand für Necho
  choice: »Gott, der mit mir ist« ohne erklärende Einschränkung
  alternative: »Gott, der in dieser Sache auf meiner Seite ist«
  rationale: Die Übersetzung bewahrt die theologische Spannung der ausdrücklichen Aussage, ohne daraus eine allgemeine Billigung Nechos oder seines Handelns abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und militärisch geprägt. Ungebräuchliches »Lass ab von Gott« wird zugunsten des verständlichen »Hör auf, dich Gott entgegenzustellen« vermieden; die schwer deutbare Wendung mit »Haus« bleibt dagegen bewusst sichtbar.
