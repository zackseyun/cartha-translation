    rationale: הַכֹּל bezieht sich natürlich auf die zuvor genannten Tiere; לְכָל הַנִּמְצָא benennt die anwesenden Personen. Eine Fußnote ist weder zur Verständlichkeit noch zur Wahrung einer echten textlichen Unentschiedenheit erforderlich.
  revised_text: 'Josia stellte den Angehörigen des Volkes Kleinvieh zur Verfügung: Lämmer und junge Ziegen, insgesamt dreißigtausend Tiere, alle als Passahopfer für die Anwesenden, dazu dreitausend Rinder. Diese Tiere stammten aus dem Besitz des Königs.'
