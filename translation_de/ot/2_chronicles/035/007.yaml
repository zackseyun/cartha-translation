source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: de
  text: 'Josia stellte den Angehörigen des Volkes Kleinvieh zur Verfügung: Lämmer und junge Ziegen, insgesamt dreißigtausend Tiere, alle als Passahopfer für die Anwesenden, dazu dreitausend Rinder. Diese Tiere stammten aus dem Besitz des Königs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: stellte … zur Verfügung
  rationale: Der Hifil von רום bezeichnet hier eine Zuwendung beziehungsweise Bereitstellung aus königlichem Besitz, nicht ein buchstäbliches Erheben und auch nicht Josias eigene Darbringung der Opfer.
- source_word: לִבְנֵי הָעָם
  choice: den Angehörigen des Volkes
  rationale: Die Wendung bedeutet wörtlich »den Söhnen des Volkes«. Die gewählte Form bewahrt den Bezug auf die Bevölkerung beziehungsweise die nichtlevitischen Teilnehmenden, ohne im heutigen Deutsch ausschließlich männliche Personen nahezulegen.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: 'Kleinvieh: Lämmer und junge Ziegen'
  rationale: צֹאן ist der Sammelbegriff für Kleinvieh; die folgenden Wörter bestimmen es näher als Lämmer und junge Ziegen.
- source_word: הַכֹּל לַפְּסָחִים
  choice: für die Passahopfer
  rationale: Der Plural פְּסָחִים bezeichnet hier wahrscheinlich kollektiv die für das Passah bestimmten Opfertiere. »Passahopfer« gibt diese kultische Funktion knapp und verständlich wieder.
- source_word: לְכָל הַנִּמְצָא
  choice: aller Anwesenden
  rationale: Das Nifal-Partizip von מצא bezeichnet in diesem Zusammenhang die beim Fest versammelten beziehungsweise anwesenden Personen.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: insgesamt dreißigtausend Tiere
  rationale: Die Zahl bezieht sich auf das zuvor genannte Kleinvieh. »Tiere« verdeutlicht den Bezug, ohne eine zusätzliche Tierart einzuführen.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: dazu dreitausend Rinder
  rationale: בָּקָר ist eine Kollektivbezeichnung für Rinder; die Übersetzung legt weder Geschlecht noch besondere Verwendung fest.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Diese Tiere stammten aus dem Besitz des Königs
  rationale: רְכוּשׁ bezeichnet Besitz oder Vermögen. Der ergänzte Rückverweis »Tiere« macht den deutschen Satz eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Reihung wurde maßvoll gegliedert. »Passah« folgt der im Deutschen etablierten biblischen Schreibweise; »zur Verfügung stellen« vermeidet die missverständliche Aussage, Josia habe alle Tiere selbst geopfert.
