source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: de
  text: Sie sonderten die Brandopfer aus, um sie den Angehörigen des Volkes[a] nach den Abteilungen ihrer Familienverbände zu geben, damit diese sie Jahwe darbrachten, wie es im Buch des Mose geschrieben steht. Ebenso verfuhren sie mit den Rindern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „den Söhnen des Volkes“; die Wendung bezeichnet hier die Bevölkerung im Unterschied zu den Priestern und Leviten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Dann sonderten sie … aus
  rationale: Der Hifil von סור bezeichnet hier das Herausnehmen beziehungsweise Absondern der für die weitere Verteilung bestimmten Opferteile. „Aussondern“ passt zum kultischen Arbeitsablauf, ohne ein darüber hinausgehendes Verfahren vorauszusetzen.
- source_word: הָעֹלָה
  choice: die Brandopfer
  rationale: עֹלָה steht morphologisch im Singular, kann hier aber kollektiv gebraucht sein. Der Plural entspricht dem Zusammenhang, in dem zahlreiche Opfertiere zubereitet werden.
- source_word: לְתִתָּם לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: um sie … nach den Abteilungen ihrer Großfamilien zu geben
  rationale: Die Zweckangabe לְתִתָּם wird mit „um … zu geben“ wiedergegeben. מִפְלַגּוֹת bezeichnet geordnete Gruppen oder Abteilungen; בֵית אָבוֹת ist ein verwandtschaftlich-organisatorischer Begriff, für den „Großfamilien“ im heutigen Deutsch verständlicher ist als das wörtliche „Vaterhäuser“.
- source_word: לִבְנֵי הָעָם
  choice: den Angehörigen des Volkes[a]
  rationale: Wörtlich steht „den Söhnen des Volkes“. Die idiomatische Wiedergabe bezeichnet hier die allgemeine Bevölkerung im Unterschied zu Priestern und Leviten; die Fußnote bewahrt die hebräische Ausdrucksform und ihre mögliche soziale Abgrenzung.
- source_word: לְהַקְרִיב לַיהוָה
  choice: damit diese sie Jahwe darbrachten
  rationale: הקריב bezeichnet im Opferzusammenhang das Darbringen. „Diese“ macht im Deutschen den naheliegenden Bezug auf die Angehörigen des Volkes deutlich, ohne den kultischen Sinn zu erweitern.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: wie es im Buch des Mose geschrieben steht
  rationale: Die feste Formel verweist auf eine schriftlich überlieferte Weisung des Mose und wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: וְכֵן לַבָּקָר
  choice: Ebenso verfuhren sie mit den Rindern
  rationale: Die knappe hebräische Ellipse überträgt das zuvor beschriebene Verfahren auch auf die Rinder. Das ergänzte Verb macht dies im Deutschen verständlich, ohne eine neue Handlung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Soziale und geschlechtliche Bedeutung von לִבְנֵי הָעָם
  choice: Angehörige des Volkes mit wörtlicher Form in der Fußnote
  alternative: Söhne des Volkes
  rationale: Die Wendung ist grammatisch maskulin, fungiert hier jedoch als gruppenbezogene Bezeichnung der allgemeinen Bevölkerung gegenüber den kultischen Amtsträgern. Die Haupttextform ist im modernen Deutsch natürlich; die Fußnote erhält die formale Gestalt und mögliche Abgrenzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe wie „Brandopfer“ bleiben erhalten; alte Verwaltungsbegriffe wie „Vaterhäuser“ werden verständlich als „Großfamilien“ wiedergegeben. Die knappe Ellipse am Versende wird behutsam vervollständigt.
