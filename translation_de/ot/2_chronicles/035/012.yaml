  to: Sie sonderten die Brandopfer aus, um sie den Angehörigen des Volkes[a] nach den Abteilungen ihrer Familienverbände zu geben, damit diese sie Jahwe darbrachten, wie es im Buch des Mose geschrieben steht. Ebenso verfuhren sie mit den Rindern.
