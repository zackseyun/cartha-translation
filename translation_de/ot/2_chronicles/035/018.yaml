source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: de
  text: Kein Passafest wie dieses war in Israel seit den Tagen des Propheten Samuel gefeiert worden[a]. Auch keiner der Könige Israels hatte ein Passafest gefeiert wie das, das Josia feierte, zusammen mit den Priestern, den Leviten, ganz Juda, den anwesenden Israeliten[b] und den Einwohnern Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein solches Passafest war in Israel seit den Tagen des Propheten Samuel begangen worden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das anwesende Israel“; gemeint sind die Israeliten, die bei der Feier zugegen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: war gefeiert worden / hatte gefeiert / feierte
  rationale: עשה in Verbindung mit פסח bedeutet idiomatisch, das Passa zu begehen bzw. zu feiern. „Feiern“ ist im modernen Deutschen natürlich und umfasst hier die gesamte Festbegehung.
- source_word: פֶסַח
  choice: Passafest
  rationale: Im Kontext bezeichnet פסח die gesamte Passafeier, nicht nur das Opfertier. „Passafest“ macht diesen umfassenden Sinn im Deutschen deutlich.
- source_word: כָּמֹהוּ
  choice: wie dieses
  rationale: Das Suffix bezieht sich auf das zuvor genannte Passafest; „wie dieses“ verweist natürlich auf Josias soeben geschilderte Feier.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition ist hier räumlich beziehungsweise korporativ zu verstehen; „in Israel“ bewahrt den nationalen Bezugsrahmen.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: seit den Tagen des Propheten Samuel
  rationale: מן mit „Tagen“ bezeichnet den zeitlichen Ausgangspunkt des Rückblicks. Die Formulierung ist würdig und im Deutschen gut verständlich.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא עָשׂוּ
  choice: Auch keiner der Könige Israels hatte ... gefeiert
  rationale: Die hebräische Verbindung „alle ... nicht“ wird idiomatisch als vollständige Verneinung wiedergegeben. „Keiner der Könige“ vermeidet ein missverständliches „nicht alle“.
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  choice: wie das, das Josia ... feierte
  rationale: Die Wiedergabe erhält den relativen Vergleich und nennt Josia als maßgeblichen Handelnden.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: zusammen mit den Priestern, den Leviten
  rationale: Die nach Josia genannten Gruppen sind Mitwirkende an der Feier. „Zusammen mit“ macht diese syntaktische Beziehung natürlich deutlich, ohne die Beteiligung der Gruppen abzuschwächen.
- source_word: וְכָל יְהוּדָה
  choice: ganz Juda
  rationale: Die kollektive Landes- beziehungsweise Volksbezeichnung wird knapp und idiomatisch wiedergegeben.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: den anwesenden Israeliten
  rationale: הנמצא bezeichnet den Teil Israels, der sich dort befand beziehungsweise verfügbar war. Die personale Mehrzahl ist im Deutschen natürlicher als das wörtliche kollektive „das anwesende Israel“.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: und den Einwohnern Jerusalems
  rationale: Dies ist eine direkte und geläufige Wiedergabe der substantivierten Partizipialform für die Bewohner der Stadt.
theological_decisions:
- issue: Historischer Vergleich mit früheren Passafeiern
  choice: Der Wortlaut erklärt Josias Feier für seit Samuels Tagen unvergleichlich und ergänzt, dass kein König Israels ein solches Passafest gefeiert hatte.
  alternative: Die Aussage könnte als absoluter historischer Ausschluss jeder vergleichbaren Feier zwischen Samuel und Josia verstanden oder als qualitative Hervorhebung gelesen werden.
  rationale: Die Übersetzung bewahrt die starke Vergleichsaussage des Hebräischen, ohne sie mit Blick auf andere berichtete Passafeiern, etwa unter Hiskia, abzuschwächen oder ausdrücklich zu harmonisieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Passafest feiern“ gibt die hebräische Wendung idiomatisch wieder. Die Wiederholung von „feiern“ wurde beibehalten, weil sie die wiederholte hebräische Wurzel עשה und die Vergleichsstruktur transparent macht.
