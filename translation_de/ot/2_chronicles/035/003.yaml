  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: de
  text: 'Er sagte zu den Leviten, die ganz Israel unterwiesen[a] und Jahwe geweiht waren: »Stellt die heilige Lade in das Haus[b], das Salomo, der Sohn Davids, der König Israels, gebaut hat. Ihr habt keine Last mehr auf der Schulter zu tragen.[c] Dient nun Jahwe, eurem Gott, und seinem Volk Israel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganz Israel Einsicht vermittelten“, „die für ganz Israel verständig waren“ oder „die für ganz Israel unterwiesen waren“. Das hebräische Partizip kann sowohl Einsicht bzw. Unterweisung als auch das Vermitteln von Einsicht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist hier der von Salomo gebaute Tempel gemeint.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „Für euch gibt es keine Last auf der Schulter.“ Im Zusammenhang ist das Tragen der Lade gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּבוֹנִים לְכָל יִשְׂרָאֵל
  choice: die ganz Israel unterwiesen
  rationale: Das Partizip von בין kann hier das Vermitteln von Einsicht bzw. Unterweisung oder auch das Verfügen über Einsicht bezeichnen. Im chronistischen Zusammenhang ist die unterweisende Aufgabe der Leviten wahrscheinlich; die Mehrdeutigkeit wird in Fußnote [a] offengelegt.
- source_word: הַקְּדוֹשִׁים לַיהוָה
  choice: die Jahwe geheiligt waren
  rationale: Die Formulierung bezeichnet den heiligen, Jahwe zugeordneten Status der Leviten. „Geheiligt“ bewahrt die kultische Aussage, ohne sie auf eine bestimmte Amtslehre zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תְּנוּ אֶת אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: Stellt die heilige Lade in das Haus
  rationale: נתן bezeichnet hier das Setzen oder Stellen der Lade an einen Ort. „Haus“ wahrt das hebräische Bild; aus dem Zusammenhang ist der von Salomo errichtete Tempel gemeint.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: Ihr habt keine Last mehr auf der Schulter zu tragen
  rationale: Die Wiedergabe erhält das Bild der auf der Schulter getragenen Last. „Mehr“ macht den durch עַתָּה markierten Übergang zur nun geforderten anderen Dienstaufgabe im Deutschen verständlich.
- source_word: עַתָּה עִבְדוּ
  choice: Dient nun
  rationale: עבד kann im kultischen Zusammenhang dienen oder Dienst verrichten bedeuten. „Dient“ bleibt weit genug für den Dienst an Gott und seinem Volk.
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: und seinem Volk Israel
  rationale: Die Formulierung bewahrt sowohl die Zugehörigkeit Israels zu Jahwe als auch die parallelen Objekte des Dienstes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen. Die Umschrift „Jahwe“ bewahrt dessen Charakter als Eigenname.
- issue: Bedeutung der Bezeichnung הַמְּבוֹנִים für die Leviten
  choice: die ganz Israel unterwiesen
  alternative: die für ganz Israel Einsicht hatten; die ganz Israel Einsicht vermittelten; die für ganz Israel unterrichtet waren
  rationale: Die Form kann auf eigene Einsicht oder auf das Vermitteln von Einsicht weisen. Die unterweisende Funktion passt gut zum Kontext, wird wegen der sprachlichen Mehrdeutigkeit jedoch nicht als einzig mögliche Deutung ausgegeben.
- issue: Bezug der Schulterlast
  choice: keine Last mehr auf der Schulter zu tragen
  alternative: die Lade nicht mehr auf den Schultern tragen
  rationale: Im Zusammenhang liegt die Bundeslade als gemeinte Last nahe. Da das Hebräische sie in diesem Satzteil jedoch nicht ausdrücklich als Objekt wiederholt, bleibt die Hauptübersetzung beim allgemeineren Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Vorlesbarkeit leicht gegliedert; kultische Schlüsselbegriffe wie „heilige Lade“, „geheiligt“ und „dienen“ bleiben erhalten. Die Mehrdeutigkeit der Levitenbezeichnung und der nicht ausdrücklich genannten Schulterlast wird nicht stillschweigend beseitigt, sondern durch Fußnoten kenntlich gemacht.
