source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: de
  text: So wurde an jenem Tag der gesamte Dienst für Jahwe vorbereitet, um das Passafest zu feiern und Brandopfer auf Jahwes Altar darzubringen, nach dem Gebot des Königs Josia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: wurde vorbereitet
  rationale: Das Nifal von כון bezeichnet hier, dass der gesamte kultische Dienst ordnungsgemäß bereitgemacht wurde. „Wurde vorbereitet“ bewahrt den passiv-resultativen Sinn und klingt im Deutschen natürlich.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: der gesamte Dienst für Jahwe
  rationale: עֲבוֹדָה bezeichnet im kultischen Zusammenhang den mit dem Gottesdienst verbundenen Dienst. „Für Jahwe“ gibt die sachliche Beziehung natürlich wieder, ohne den Ausdruck auf priesterliche Tätigkeiten zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung gibt die zeitliche Angabe samt demonstrativer Hervorhebung idiomatisch wieder.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: um das Passafest zu feiern
  rationale: Die hebräische Wendung „das Passa tun“ bedeutet, das Passa rituell zu begehen. „Das Passafest feiern“ ist die klare und natürliche deutsche Entsprechung.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: und Brandopfer darzubringen
  rationale: Der Hifil von עלה mit עֹלוֹת ist die übliche Opferformel für das Darbringen von Brandopfern.
- source_word: עַל מִזְבַּח יְהוָה
  choice: auf Jahwes Altar
  rationale: Die knappe Genitivverbindung gibt den Altar als den Jahwe zugehörigen beziehungsweise geweihten Opferaltar wieder.
- source_word: כְּמִצְוַת
  choice: nach dem Gebot
  rationale: מִצְוָה bezeichnet hier die verbindliche Anordnung des Königs. „Gebot“ bewahrt den kräftigen Verpflichtungscharakter des Ausdrucks.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: des Königs Josia
  rationale: Diese Wortstellung entspricht natürlichem, würdevollem Standarddeutsch und erhält Titel und Namen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die kultischen Begriffe „Passafest“, „Brandopfer“ und „Altar“ bleiben präzise erhalten; unnötig altertümliche Wendungen werden vermieden.
