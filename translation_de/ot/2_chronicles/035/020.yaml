  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: de
  text: Nach all diesem, nachdem Josia das Haus[a] hergerichtet hatte, zog Necho, der König von Ägypten, hinauf, um bei Karkemisch am Euphrat zu kämpfen. Da zog Josia ihm entgegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus« ist hier der Tempel gemeint.
    reason: referent_clarification
  - marker: b
    text: '»Ihm entgegen« kann in diesem militärischen Zusammenhang auch bedeuten: »gegen ihn«.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: hergerichtet hatte
  rationale: Das Hifil von כון kann »vorbereiten«, »bereitmachen«, »fest einrichten« oder »in Ordnung bringen« bedeuten. »Herrichten« gibt hier natürlich wieder, dass Josia den Tempel für seinen geordneten Dienst vorbereitet hatte, ohne den Vorgang auf bauliche Reparaturen zu beschränken.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Wörtlich steht »das Haus«; im chronistischen Zusammenhang ist damit der Tempel gemeint. Die Übersetzung bewahrt die Ausdrucksweise des Hebräischen, während die Fußnote den Bezug erläutert.
- source_word: עָלָה
  choice: zog … hinauf
  rationale: עלה bezeichnet zunächst das Hinaufziehen. »Zog hinauf« passt zu einer militärischen Bewegung, ohne ein im Ausgangstext nicht ausdrücklich genanntes Marschieren oder Angreifen einzutragen.
- source_word: לְהִלָּחֵם
  choice: um … zu kämpfen
  rationale: Die Infinitivform von לחם bezeichnet das Kämpfen beziehungsweise die Teilnahme an einer Schlacht. Die schlichte Wiedergabe lässt offen, gegen wen Necho kämpfen wollte.
- source_word: בְּכַרְכְּמִישׁ
  choice: bei Karkemisch
  rationale: Die Präposition ב wird hier am besten lokal verstanden. »Bei Karkemisch« bezeichnet den Schauplatz, ohne einen Angriff auf die Stadt selbst zu behaupten.
- source_word: עַל פְּרָת
  choice: am Euphrat
  rationale: Die Wendung bezeichnet die Lage Karkemischs am Euphrat. »Am Euphrat« ist im Deutschen die natürliche geografische Formulierung.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: Da zog Josia ihm entgegen
  rationale: לקראת bezeichnet eine Bewegung zur Begegnung hin und kann in einem militärischen Zusammenhang auch konfrontativen Sinn haben. »Ihm entgegenziehen« bewahrt diese Spannung besser als eine ausdrücklich feindselige Wiedergabe.
theological_decisions:
- issue: Zielrichtung von Josias Entgegenziehen
  choice: ihm entgegen
  alternative: gegen ihn
  rationale: Der militärische Zusammenhang legt eine Konfrontation nahe, doch die Wendung לִקְרָאתוֹ bedeutet nicht zwingend bereits »gegen ihn«. Die Übersetzung bewahrt die im Hebräischen vorhandene Offenheit; die Fußnote nennt die konfrontative Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, wird aber durch einen neuen Hauptsatz nach »kämpfen« lesbarer. »Haus« bewahrt die Bildsprache des Ausgangstextes; »ihm entgegen« erhält die mögliche Spannung zwischen Begegnung und feindlicher Konfrontation.
