base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: de
  text: Sie schlachteten die Passatiere[a], und die Priester sprengten das Blut aus den Händen der Schlachtenden[b], während die Leviten den Tieren die Haut abzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Passaopfer“. Gemeint sind die für das Passa geschlachteten Opfertiere.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus ihrer Hand“. Der hebräische Ausdruck bezeichnet wahrscheinlich die Hände derer, die die Tiere schlachteten; das Blut wird im Hebräischen nur vorausgesetzt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: sie schlachteten
  rationale: שׁחט bezeichnet hier das rituelle Schlachten von Opfertieren; „schlachten“ bewahrt diesen kultischen Sinn.
- source_word: הַפָּסַח
  choice: die Passatiere
  rationale: פֶּסַח bezeichnet in diesem Zusammenhang die für das Passa geschlachteten Tiere. Der Plural gibt den kollektiven Singular im Kontext mehrerer Opfer natürlich wieder, ohne die Tiere ausschließlich als Lämmer zu bestimmen.
- source_word: וַיִּזְרְקוּ
  choice: sprengten das Blut
  rationale: זרק ist der übliche kultische Ausdruck für das Werfen beziehungsweise Sprengen von Blut am Altar. Das im Hebräischen nicht ausdrücklich genannte Objekt „das Blut“ ergibt sich eindeutig aus dem Opferkontext.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֲנִים im Tempeldienst.
- source_word: מִיָּדָם
  choice: das sie aus ihrer Hand empfingen
  rationale: Wörtlich steht „aus ihrer Hand“. „Empfingen“ macht die im Kontext vorausgesetzte Übergabe des Blutes an die Priester verständlich; der Bezug des Pronomens bleibt in einer Fußnote erläutert.
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: und die Leviten zogen den Tieren die Haut ab
  rationale: Der Partizipialausdruck beschreibt die gleichzeitig fortlaufende Tätigkeit der Leviten. פשט bedeutet hier das Abziehen der Haut geschlachteter Tiere.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Passatiere“ vermeidet die sachlich mögliche Verengung auf Lämmer; „sprengten“ wahrt die kultische Fachbedeutung, bleibt aber allgemein verständlich.
