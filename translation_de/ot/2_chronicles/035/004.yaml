  text: וְ/הָכִ֥ונוּ לְ/בֵית אֲבוֹתֵי/כֶ֖ם כְּ/מַחְלְקוֹתֵי/כֶ֑ם בִּ/כְתָ֗ב דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וּ/בְ/מִכְתַּ֖ב שְׁלֹמֹ֥ה בְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: de
  text: Ordnet euch nach euren Vaterhäusern[a] und nach euren Abteilungen[b], wie es in der Aufzeichnung Davids, des Königs von Israel, und in der Aufzeichnung seines Sohnes Salomo vorgeschrieben ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vaterhäuser“ bezeichnet angestammte, über die väterliche Linie gegliederte Haus- oder Familienverbände.
    reason: lexical_alternative
  - marker: b
    text: „Abteilungen“ kann auch „Dienstgruppen“ bedeuten, besonders im Zusammenhang mit der Organisation von Priestern und Leviten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Ordnet euch
  rationale: Der Hifil-Imperativ von כון fordert hier im organisatorischen Zusammenhang dazu auf, sich bereitzumachen beziehungsweise geordnet aufzustellen. „Ordnet euch“ gibt diesen aktiven und gruppenbezogenen Sinn natürlich wieder.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: nach euren Sippen
  rationale: בֵית אָבוֹת bezeichnet väterliche beziehungsweise angestammte Hausverbände. „Sippen“ ist im modernen Deutschen verständlich und bildet die soziale Gruppierung ab, ohne moderne Kleinfamilien anzunehmen.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: und euren Abteilungen
  rationale: מַחְלְקוֹת bezeichnet die eingeteilten Dienstgruppen, besonders im priesterlichen und levitischen Zusammenhang. Das zweite „nach“ ist im Deutschen elliptisch mitzudenken; „Abteilungen“ bleibt allgemein verständlich.
- source_word: בִּכְתָב
  choice: wie es in der Schrift ... vorgeschrieben ist
  rationale: כְּתָב bedeutet Schriftstück oder schriftliche Anordnung; ב markiert hier die maßgebliche schriftliche Grundlage. Die Formulierung macht deren normativen Zusammenhang deutlich.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: Davids, des Königs von Israel
  rationale: Die Apposition und der Königstitel werden in natürlichem deutschem Kasus wiedergegeben.
- source_word: וּבְמִכְתַּב
  choice: und in der Niederschrift
  rationale: מִכְתָּב bezeichnet ebenfalls ein Schriftstück. „Niederschrift“ wahrt die leichte lexikalische Unterscheidung zum vorhergehenden כְּתָב, ohne einen sachlichen Unterschied zu überzeichnen.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: seines Sohnes Salomo
  rationale: Das Possessivpronomen bezieht sich auf David; die im Deutschen natürliche Wortstellung macht diese Beziehung deutlich.
