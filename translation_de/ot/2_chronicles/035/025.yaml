base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: de
  text: Und Jeremia erhob eine Totenklage über Josia. Alle Sänger und Sängerinnen besingen Josia bis heute in ihren Klageliedern. Man machte sie zu einer festen Ordnung in Israel. Siehe, sie sind in den Klageliedern[a] aufgezeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist eine bestimmte Sammlung mit dem Titel »Klagelieder« gemeint; die hebräische Formulierung kann aber auch allgemein auf Klagelieder verweisen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: stimmte ein Klagelied … an
  rationale: Das Verb קונן bezeichnet das Vortragen oder Anstimmen einer Totenklage. Die Wiedergabe ist im Deutschen natürlich und legt nicht fest, ob Jeremia das Lied auch verfasste.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: über Josia
  rationale: Bei einer Totenklage gibt „über“ den Gegenstand der Klage idiomatisch und sachlich genau an.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: alle Sänger und Sängerinnen
  rationale: Die beiden Formen bezeichnen ausdrücklich männliche und weibliche Singende; diese Unterscheidung bleibt erhalten.
- source_word: וַיֹּאמְרוּ … בְּקִינוֹתֵיהֶם
  choice: singen … in ihren Klageliedern von Josia
  rationale: אמר bedeutet wörtlich „sagen“, bezeichnet hier im Zusammenhang mit Sängern und Klageliedern jedoch deren gesungenen Vortrag. „Von Josia singen“ ist natürliches Deutsch.
- source_word: עַד הַיּוֹם
  choice: bis heute
  rationale: Die Wendung bezeichnet einen Brauch, der bis in die Gegenwart des Erzählers fortbestand; deshalb steht im Deutschen passend das Präsens.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Man machte sie zu einem festen Brauch in Israel
  rationale: חֹק kann eine Satzung, Festsetzung oder verbindliche Gewohnheit bezeichnen. „Fester Brauch“ passt hier zur fortdauernden Pflege der Klagelieder, ohne eine staatliche Rechtsnorm zu unterstellen. Das Pronomen „sie“ bezieht sich wahrscheinlich auf die Klagelieder.
- source_word: וְהִנָּם
  choice: Siehe, sie sind
  rationale: „Siehe“ bewahrt die hervorhebende und hinweisende Funktion von הִנֵּה in einem würdigen biblischen Register.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: in den Klageliedern aufgezeichnet
  rationale: Die Formulierung lässt offen, ob eine bestimmte Sammlung von Klageliedern oder Klagelieder im Allgemeinen gemeint sind; die Fußnote weist ausdrücklich auf diese Ambiguität hin.
theological_decisions: []
