- from: Und Jeremia stimmte ein Klagelied über Josia an. Alle Sänger und Sängerinnen singen bis heute in ihren Klageliedern von Josia. Man machte sie zu einem festen Brauch in Israel. Siehe, sie sind in den Klageliedern[a] aufgezeichnet.
  to: Und Jeremia erhob eine Totenklage über Josia. Alle Sänger und Sängerinnen besingen Josia bis heute in ihren Klageliedern. Man machte sie zu einer festen Ordnung in Israel. Siehe, sie sind in den Klageliedern[a] aufgezeichnet.
  rationale: Die Überarbeitung beschränkt sich auf zwei sichere stilistisch-semantische Präzisierungen. Sie erhält die Gegenwartsform mit »bis heute«, die ausdrückliche Nennung von Sängern und Sängerinnen, die wahrscheinliche Rückbeziehung von »sie« auf die Klagelieder sowie die Ambiguität der abschließenden Quellenangabe.
