base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: de
  text: Da nahmen ihn seine Diener aus dem Streitwagen und setzten ihn auf den zweiten Wagen, der ihm gehörte.[a] Sie brachten ihn nach Jerusalem. Er starb und wurde in den Gräbern seiner Vorfahren bestattet. Ganz Juda und Jerusalem trauerten um Josia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „auf den Wagen des Zweiten“. Die nicht ganz eindeutige Wendung kann Josias zweiten oder als Ersatz bereitgehaltenen Wagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: hoben ihn … vom Streitwagen
  rationale: Der Hifil von עבר bezeichnet hier das Weg- bzw. Hinüberbringen aus einem Fahrzeug. Die Formulierung gibt den körperlichen Transfer des verwundeten Königs natürlich wieder.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד kann Diener, Gefolge oder Amtsträger bezeichnen. Im Zusammenhang sind die Begleiter des Königs gemeint; „Diener“ bleibt angemessen weit.
- source_word: הַמֶּרְכָּבָה
  choice: der Streitwagen
  rationale: מרכבה bezeichnet hier den im Kampf verwendeten Wagen. „Streitwagen“ macht den militärischen Kontext im Deutschen knapp deutlich.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: setzten ihn auf
  rationale: Der Hifil von רכב bedeutet, jemanden aufsteigen oder fahren zu lassen. Beim verwundeten Josia ist „setzten ihn auf“ idiomatisch und vermeidet den Eindruck, er sei selbst aufgestiegen.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: den zweiten Wagen
  rationale: Die hebräische Wendung lautet wörtlich etwa „den Wagen des Zweiten“ und ist nicht völlig eindeutig. „Der zweite Wagen“ wahrt die formale Aussage; eine mögliche Deutung als Ersatzwagen steht in der Fußnote.
- source_word: אֲשֶׁר לוֹ
  choice: der ihm gehörte
  rationale: Die Relativkonstruktion bezeichnet den Wagen als Josias Eigentum.
- source_word: וַיּוֹלִיכֻהוּ
  choice: Sie brachten ihn
  rationale: Der Hifil von הלך kann „führen“ oder „bringen“ bedeuten. Da der verwundete König befördert und ein Ziel genannt wird, ist „bringen“ passend.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: in den Gräbern seiner Vorfahren
  rationale: אבות bezeichnet hier die Ahnen bzw. dynastischen Vorfahren. „Vorfahren“ ist im heutigen Deutsch klarer als das missverständliche wörtliche „Väter“.
- source_word: מִתְאַבְּלִים
  choice: trauerten
  rationale: Das Partizip bezeichnet die trauernde Gemeinschaft bzw. anhaltende Trauer. Im deutschen Erzählfluss gibt „trauerten“ dies natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze sorgen für einen natürlichen Erzählfluss. „Vorfahren“ vermeidet die im heutigen Deutsch mögliche Verengung von אבות auf leibliche Väter; die Mehrzahl „Gräber“ bleibt erhalten.
