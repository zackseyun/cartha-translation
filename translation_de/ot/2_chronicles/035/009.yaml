base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: de
  text: Konanja und seine Brüder Schemaja und Netanel sowie Haschabja, Jëiël und Josabad, die Obersten der Leviten, gaben den Leviten für die Passahopfer fünftausend Stück Kleinvieh[a] und fünfhundert Rinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen fehlt bei »fünftausend« die Tierbezeichnung. Dem Zusammenhang nach ist Kleinvieh gemeint; wörtlich heißt es: »fünftausend und fünfhundert Rinder«.'
    reason: textual_ellipsis
lexical_decisions:
- source_word: כונניהו
  choice: Konanja
  rationale: Der Personenname wird entsprechend der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: שְׁמַעְיָהוּ
  choice: Schemaja
  rationale: Etablierte deutsche biblische Namensform.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Nahe Umschrift des hebräischen Personennamens in einer im Deutschen gebräuchlichen Form.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Bewahrt die konkrete Verwandtschaftsbezeichnung des Hebräischen; eine weitere Bedeutung wie »Verwandte« ist möglich, aber nicht ausdrücklich angezeigt.
- source_word: חֲשַׁבְיָהוּ
  choice: Haschabja
  rationale: Etablierte deutsche biblische Namensform.
- source_word: יעיאל
  choice: Jëiël
  rationale: Die Trema-Schreibung macht die getrennte Aussprache der Vokale in der deutschen Namensform deutlich.
- source_word: יוֹזָבָד
  choice: Josabad
  rationale: Etablierte deutsche biblische Namensform.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: die führenden Männer der Leviten
  rationale: Gibt die Leitungsfunktion von שׂרים natürlich und würdevoll wieder, ohne den missverständlichen Rangtitel »Fürsten« einzuführen.
- source_word: הֵרִימוּ
  choice: stifteten
  rationale: Der Hifil von רום bezeichnet hier eine bereitgestellte Abgabe beziehungsweise Spende; »stifteten« passt zum Kontext der Versorgung des Festes.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Der Dativ gibt die Empfänger der Stiftung im Deutschen idiomatisch wieder.
- source_word: לַפְּסָחִים
  choice: für die Passahopfer
  rationale: Der hebräische Plural bezeichnet im Kontext die für die Passahfeier bestimmten Opfertiere, nicht mehrere Passahfeste.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: fünftausend Stück Kleinvieh und fünfhundert Rinder
  rationale: Das erste Zahlwort hat im Hebräischen kein wiederholtes Substantiv; aus dem unmittelbaren Parallelvers und der Gegenüberstellung zu בָקָר ergibt sich als ausgelassene Tiergattung Kleinvieh. Die Ergänzung ist für verständliches Deutsch nötig und wird durch eine Fußnote kenntlich gemacht.
