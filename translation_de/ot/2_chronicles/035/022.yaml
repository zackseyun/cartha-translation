source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: de
  text: Doch Josia wandte sich nicht von ihm ab[a], sondern verkleidete sich, um gegen ihn zu kämpfen. Er hörte nicht auf Nechos Worte, die aus dem Mund Gottes kamen[b], und kam, um in der Ebene von Megiddo zu kämpfen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wandte sein Gesicht nicht von ihm ab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „aus dem Mund Gottes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im Tal von Megiddo“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: wandte sich nicht von ihm ab
  rationale: Die Wendung bezeichnet ein Abwenden oder Zurückziehen. Die natürliche deutsche Form bewahrt den Sinn; die wörtlichere Bildsprache wird in der Fußnote genannt.
- source_word: כִּי
  choice: sondern
  rationale: Im Zusammenhang markiert כִּי den Gegensatz zu Josias verweigertem Abwenden und leitet sein tatsächliches Handeln ein.
- source_word: לְהִלָּחֵם בּוֹ
  choice: um gegen ihn zu kämpfen
  rationale: Der Infinitiv mit לְ drückt den Zweck aus; בּוֹ bezeichnet hier aufgrund des militärischen Zusammenhangs den Gegner.
- source_word: הִתְחַפֵּשׂ
  choice: verkleidete sich
  rationale: Der Hitpael bezeichnet das Verkleiden beziehungsweise Auftreten in Verkleidung.
- source_word: שָׁמַע אֶל
  choice: hörte nicht auf
  rationale: Die deutsche Wendung kann sowohl das Hören als auch das Nichtbeachten umfassen und legt nicht unnötig fest, ob ausdrücklich Ungehorsam gemeint ist.
- source_word: דִּבְרֵי נְכוֹ
  choice: Nechos Worte
  rationale: Dies gibt die hebräische Genitivverbindung knapp und unmittelbar wieder, ohne sie interpretierend als Botschaft zu paraphrasieren.
- source_word: מִפִּי אֱלֹהִים
  choice: die aus dem Mund Gottes kamen
  rationale: Die idiomatische Bildsprache des Hebräischen wird bewahrt und syntaktisch eindeutig auf Nechos Worte bezogen.
- source_word: וַיָּבֹא לְהִלָּחֵם
  choice: zog zum Kampf
  rationale: Im militärischen Erzählzusammenhang ist dies eine natürliche deutsche Wiedergabe von 'er kam, um zu kämpfen'.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: in die Ebene von Megiddo
  rationale: בִּקְעָה bezeichnet eine breite Talebene. Wegen des Bewegungsverbs ist im Deutschen die Richtungsangabe mit Akkusativ natürlich; 'Tal von Megiddo' bleibt möglich.
theological_decisions:
- issue: Ob Nechos Worte tatsächlich von Gott stammen
  choice: Der Haupttext stellt Nechos Worte als aus dem Mund Gottes kommend dar.
  alternative: Man könnte allgemeiner 'Worte Nechos von Gott' oder 'Gottes Auftrag' formulieren oder Nechos Behauptung als fraglich behandeln.
  rationale: Der Chronist selbst führt die Worte in diesem Vers auf Gott zurück. Die Übersetzung bewahrt diese Aussage und die damit verbundene theologische Spannung, ohne die Art der Offenbarung näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber für natürliche Lesbarkeit geglättet. Die Gottesherkunft von Nechos Worten wird ausdrücklich und ohne konfessionelle Zusatzdeutung wiedergegeben.
