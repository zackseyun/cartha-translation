base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: de
  text: 'Die übrigen Taten Josias und seine Treuebeweise[a], wie es im Gesetz Jahwes geschrieben steht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine treuen Taten«, »seine Taten der Loyalität« oder »seine Guttaten«. Das hebräische Wort kann Güte, Loyalität oder Bundestreue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: In der königlichen Schlussformel bezeichnet דִּבְרֵי nicht nur »Worte«, sondern die Taten und Ereignisse einer Regierungszeit. וְיֶתֶר wird knapp mit »die übrigen« wiedergegeben; ein nicht ausdrücklich vorhandenes »nun« wird nicht ergänzt.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: וַחֲסָדָיו
  choice: und seine Werke der Treue
  rationale: חֶסֶד umfasst Güte, Loyalität und bundestreue Hingabe. »Werke der Treue« passt zur Bewertung Josias nach dem Gesetz Jahwes, ohne die mögliche Bedeutungsbreite im Haupttext durch eine ausdrücklich dogmatische Festlegung auf »Bundestreue« zu verengen.
- source_word: כַּכָּתוּב
  choice: wie sie … aufgezeichnet sind
  rationale: Die Wendung bedeutet »wie geschrieben« beziehungsweise »entsprechend dem Geschriebenen«. »Aufgezeichnet« ist in dieser historiografischen Schlussformel natürlich und macht den Bezug auf beide zuvor genannten Gruppen von Taten deutlich.
- source_word: בְּתוֹרַת
  choice: im Gesetz
  rationale: תּוֹרָה bezeichnet hier die maßgebliche schriftliche Weisung Jahwes; »Gesetz« ist im deutschen alttestamentlichen Zusammenhang die geläufige Wiedergabe.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als Eigenname »Jahwe« wiedergegeben und wegen der deutschen Genitivkonstruktion zu »Jahwes« flektiert.
theological_decisions:
- issue: Bedeutung von חֶסֶד in Bezug auf Josia
  choice: Werke der Treue
  alternative: Guttaten; Taten der Loyalität; Werke der Bundestreue
  rationale: Der Ausdruck würdigt Josias loyales und frommes Handeln, kann aber Güte, Loyalität oder Bundestreue bezeichnen. Die Hauptübersetzung bewahrt den theologischen Gehalt, während die Fußnote die echte lexikalische Spannweite offenlegt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung bleibt als einleitende Zusammenfassung mit Doppelpunkt offen, da der Gedanke im folgenden Vers fortgeführt wird. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
