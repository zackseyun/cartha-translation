  naturalness: „Werke der Treue“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch als „Treuebeweise“. „Wie es im Gesetz Jahwes geschrieben steht“ ist zugleich natürlicher und näher am Singular des Ausgangstextes.
  terminology: „Josias“, „Gesetz“ und „Jahwe/Jahwes“ sind passende etablierte bzw. projektkonforme Wiedergaben. „Treuebeweise“ gibt חֲסָדָיו als konkrete, von Treue geprägte Handlungen wieder, ohne die Bedeutung auf „Bundestreue“ festzulegen; die Fußnote dokumentiert die verbleibende lexikalische Spannweite.
