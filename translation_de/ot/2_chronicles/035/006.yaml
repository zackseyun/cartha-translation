source:
  edition: WLC
  text: וְ/שַׁחֲט֖וּ הַ/פָּ֑סַח וְ/הִתְקַדְּשׁוּ֙ וְ/הָכִ֣ינוּ לַ/אֲחֵי/כֶ֔ם לַ/עֲשׂ֥וֹת כִּ/דְבַר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: de
  text: Schlachtet das Passahlamm[a], heiligt euch und trefft für eure Brüder Vorbereitungen, damit sie nach dem Wort Jahwes handeln können, das Jahwe durch Mose[b] gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Passa“. Der hebräische Ausdruck kann das Passaopfer insgesamt bezeichnen; hier ist das Tier gemeint, das geschlachtet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „durch die Hand Moses“. Gemeint ist, dass Jahwe seine Weisung durch Mose vermittelt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Schlachtet
  rationale: שׁחט bezeichnet besonders im Opferzusammenhang das fachgerechte Schlachten eines Tieres; „schlachten“ bewahrt diesen kultischen Sinn.
- source_word: הַפָּסַח
  choice: das Passahlamm
  rationale: Der Ausdruck bezeichnet hier konkret das zu schlachtende Passaopfer. „Passahlamm“ macht den im Zusammenhang vorausgesetzten Opfergegenstand verständlich; die wörtlichere Wiedergabe steht in der Fußnote.
- source_word: וְהִתְקַדְּשׁוּ
  choice: heiligt euch
  rationale: Die reflexive Form bezeichnet die rituelle Heiligung beziehungsweise Vorbereitung für den heiligen Dienst. „Heiligt euch“ ist knapp und wahrt die kultische Aussage.
- source_word: וְהָכִינוּ לַאֲחֵיכֶם
  choice: trefft für eure Brüder Vorbereitungen
  rationale: כון im Hifil bedeutet „vorbereiten, bereitmachen“; da das Objekt im Hebräischen unausgesprochen bleibt, vermeidet diese deutsche Formulierung ein ergänztes Objekt. „Brüder“ gibt die maskuline Pluralform genau wieder.
- source_word: לַעֲשׂוֹת כִּדְבַר יְהוָה
  choice: um nach dem Wort Jahwes zu handeln
  rationale: Die Infinitivkonstruktion verbindet die Vorbereitungen mit der Ausführung der göttlichen Weisung. „Wort“ bewahrt die hebräische Ausdrucksweise, ohne ihren verpflichtenden Charakter abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: das durch Mose ergangen ist
  rationale: Die Wendung bezeichnet Mose als Vermittler des göttlichen Wortes. Die idiomatische deutsche Wiedergabe vermittelt diesen Sinn; die konkrete hebräische Metapher wird in der Fußnote genannt.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung in לַאֲחֵיכֶם
  choice: für eure Brüder
  alternative: für eure Geschwister; für eure israelitischen Brüder und Schwestern
  rationale: Der hebräische Text verwendet ausdrücklich die maskuline Pluralform „Brüder“. Obwohl im Zusammenhang die weitere Gemeinschaft mitgemeint sein kann, wird die sprachliche Form des Ausgangstextes nicht stillschweigend erweitert.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug des Infinitivs לַעֲשׂוֹת
  choice: um … zu handeln, bezogen auf die angeredeten Leviten
  alternative: damit die Brüder … handeln
  rationale: Die vorausgehenden Aufforderungen stehen durchgehend in der zweiten Person Plural, sodass der Infinitiv natürlich als Zweck ihres Vorbereitens gelesen werden kann. Die knappe hebräische Konstruktion lässt den logischen Handlungsträger jedoch nicht ausdrücklich erkennen; eine Beziehung auf die Brüder bleibt grammatisch erwägenswert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Begriffe „schlachten“ und „heiligt euch“ bleiben erhalten. „Trefft … Vorbereitungen“ vermeidet ein im Hebräischen nicht genanntes Objekt. Der Satzbau ist für heutige Leser geglättet, ohne die Vermittlerrolle Moses oder den verpflichtenden Charakter des Wortes Jahwes aufzugeben.
