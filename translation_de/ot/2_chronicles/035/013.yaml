source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: de
  text: Sie garten das Passahlamm im Feuer nach der Vorschrift[a]. Die heiligen Gaben kochten sie in Töpfen, Kesseln und Schüsseln und brachten sie schnell zum ganzen Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: „Sie brieten das Passahlamm im Feuer.“ Das hebräische Verb kann allgemein „garen“ bedeuten; nach der Passahvorschrift musste das Opfer jedoch gebraten und durfte nicht gekocht werden (vgl. 2. Mose 12,8–9).'
    reason: Lexikalische Alternative und Erläuterung der vorgeschriebenen Zubereitungsart.
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: sie garten
  rationale: Das Verb בשׁל kann allgemein die Zubereitung durch Erhitzen oder enger das Kochen bezeichnen. „Garen“ bewahrt hier den weiteren Sinn; „im Feuer“ und der rechtliche Zusammenhang bestimmen die Zubereitungsart näher.
- source_word: הַפֶּסַח
  choice: das Passahlamm
  rationale: Im Zusammenhang des Garens bezeichnet „Passah“ konkret das Passahopfer beziehungsweise dessen Tier. „Passahlamm“ macht diesen gemeinten Gegenstand im Deutschen verständlich.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die direkte Wiedergabe wahrt die Formulierung des Hebräischen und kennzeichnet die Zubereitung anders als das Kochen in Gefäßen.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die vorgeschriebene kultische Verfahrensweise. „Nach der Vorschrift“ ist gegenwärtiges, klares Deutsch mit normativem Sinn.
- source_word: וְהַקֳּדָשִׁים
  choice: die heiligen Gaben
  rationale: Gemeint sind geweihte Opfergaben, die vom Passahopfer unterschieden werden. „Heilige Gaben“ ist verständlich und bewahrt den kultischen Charakter.
- source_word: בִּשְּׁלוּ
  choice: kochten sie
  rationale: Bei den anschließend genannten Gefäßen liegt die engere Bedeutung „kochen“ nahe und bildet den sachlichen Gegensatz zur Zubereitung des Passahlamms im Feuer.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: in Töpfen, Kesseln und Schüsseln
  rationale: Die drei geläufigen deutschen Gefäßbezeichnungen geben die unterschiedlichen Koch- und Ausgabegefäße natürlich wieder; die genaue Form des letzten Gefäßtyps bleibt unsicher.
- source_word: וַיָּרִיצוּ
  choice: brachten sie schnell
  rationale: Die kausative Verbform vermittelt rasche Weiterbeförderung. „Schnell bringen“ gibt Bewegung und Eile idiomatisch wieder.
- source_word: לְכָל בְּנֵי הָעָם
  choice: zum ganzen Volk
  rationale: Die wörtliche Wendung „zu allen Söhnen des Volkes“ bezeichnet idiomatisch die Gesamtheit der anwesenden Bevölkerung; „zum ganzen Volk“ ist natürliches Deutsch.
theological_decisions:
- issue: Spannung zwischen בשׁל und der Vorschrift, das Passahopfer am Feuer zu braten
  choice: Das erste Verb wird mit dem weiteren „garen“ wiedergegeben; „im Feuer nach der Vorschrift“ bezeichnet die rechtmäßige Methode.
  alternative: Ausdrücklich „braten“ oder beide Vorkommen einheitlich mit „kochen“ übersetzen.
  rationale: Der Vers selbst unterscheidet die Zubereitung des Passahopfers im Feuer von der Zubereitung der übrigen heiligen Gaben in Kochgefäßen. So bleibt sowohl der weitere lexikalische Sinn des Verbs als auch die gesetzlich vorausgesetzte Unterscheidung erkennbar.
- issue: Bezug von וְהַקֳּדָשִׁים
  choice: Die Formulierung bezeichnet andere geweihte Opfergaben als das Passahopfer.
  alternative: Sie als umfassende Bezeichnung aller heiligen Speisen einschließlich des Passahopfers verstehen.
  rationale: Satzbau und unterschiedliche Zubereitungsweisen stellen das Passah und die heiligen Gaben einander gegenüber.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Garen“ ist allgemeinverständlich und vermeidet eine scheinbare Kollision mit der Passahvorschrift; „nach der Vorschrift“ ist natürlicher als das feierlichere „nach der Satzung“. Die knappe Satzfolge bewahrt den zügigen Erzählstil.
