source:
  edition: WLC
  text: וַ/יֹּרוּ֙ הַ/יֹּרִ֔ים לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לַ/עֲבָדָי/ו֙ הַעֲבִיר֔וּ/נִי כִּ֥י הָחֳלֵ֖יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: de
  text: 'Da schossen die Bogenschützen auf König Josia. Der König sagte zu seinen Dienern: »Bringt mich fort, denn ich bin schwer verwundet[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ich bin sehr geschwächt.« Das hebräische Verb kann krank, schwach oder schwer verletzt sein bedeuten; im Zusammenhang der Schlacht liegt »verwundet« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: Da schossen die Bogenschützen
  rationale: ירה im Hifil bezeichnet im militärischen Zusammenhang das Schießen; das substantivierte Partizip הַיֹּרִים meint hier idiomatisch Bogenschützen.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: auf König Josia
  rationale: Die Präposition ל markiert hier das Ziel des Schießens. Im Deutschen ist »auf König Josia schießen« natürlich und bewahrt, anders als ein direktes Objekt, eine mögliche Unbestimmtheit darüber, ob bereits dieser Satz das Treffen ausdrückt.
- source_word: הַעֲבִירוּנִי
  choice: Bringt mich fort
  rationale: Der Hifil von עבר bedeutet hier, Josia vom Ort des Kampfes wegzubringen, ohne ausdrücklich festzulegen, ob er getragen oder auf andere Weise fortgebracht wird.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für Josias Aufforderung ein; »denn« passt zum würdigen Ton der direkten Rede.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: ich bin schwer verwundet
  rationale: חלה kann grundsätzlich krank, schwach oder schwer beeinträchtigt sein bedeuten. Nach dem Beschuss im Kampf bezeichnet es hier am natürlichsten eine schwere Verwundung; מְאֹד wird durch »schwer« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Diener« hält die soziale Bezeichnung des Hebräischen offen; »Bringt mich fort« vermeidet die nicht ausdrücklich genannte Annahme, Josia müsse getragen werden.
