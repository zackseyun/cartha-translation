  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: de
  text: Er wies den Priestern ihre Dienstposten zu[a] und stärkte sie[b] für den Dienst im Haus Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellte die Priester an ihre Dienstabteilungen“; wörtlicher: „über ihre Dienstwachen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ermutigte sie“ beziehungsweise „unterstützte sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Er wies … zu
  rationale: Der Hifil von עמד bezeichnet hier das Einsetzen oder Aufstellen in einer zugewiesenen Funktion. „Wies … zu“ gibt den organisatorischen Vorgang im Deutschen natürlich wieder.
- source_word: הַכֹּהֲנִים
  choice: den Priestern
  rationale: Standardwiedergabe von כהנים; der bestimmte Artikel bleibt erhalten. Der Dativ ergibt sich aus der deutschen Konstruktion „jemandem etwas zuweisen“.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: ihre Dienstposten
  rationale: מִשְׁמָרוֹת kann Wachen, Abteilungen oder zugewiesene Posten bezeichnen. „Dienstposten“ bewahrt den konkreten organisatorischen Sinn im Zusammenhang des Tempeldienstes.
- source_word: וַיְחַזְּקֵם
  choice: und stärkte sie
  rationale: Der Piel von חזק kann „stärken“, „ermutigen“ oder „unterstützen“ bedeuten. „Stärkte“ erhält die lexikalische Grundbedeutung und lässt die Art der Stärkung offen.
- source_word: לַעֲבוֹדַת
  choice: für den Dienst
  rationale: עֲבוֹדָה bezeichnet Arbeit oder Dienst, hier speziell den Tempeldienst. „Dienst“ ist im Deutschen klar und angemessen.
- source_word: בֵּית יְהוָה
  choice: am Haus Jahwes
  rationale: „Haus Jahwes“ bewahrt die hebräische Bezeichnung für den Tempel. Die Verbindung mit „am“ gibt den Tätigkeitsbereich des Dienstes idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der organisatorischen Bildsprache des Hebräischen, ohne unnatürlich wörtlich zu wirken; die mögliche Bedeutungsbreite von חזק wird in einer Fußnote erhalten.
