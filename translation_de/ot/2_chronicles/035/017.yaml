id: 2CH.35.17
reference: 2 Chronicles 35:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: de
  text: Die Israeliten, die anwesend waren, feierten zu jener Zeit das Passafest und sieben Tage lang das Fest der ungesäuerten Brote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: feierten
  rationale: Das sonst allgemein mit „tun/machen“ wiedergegebene Verb bezeichnet mit einem Fest als Objekt idiomatisch dessen Begehung. „Feierten“ ist im modernen Deutschen natürlich und passt zu beiden genannten Festen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Der Ausdruck ist hier die kollektive Volksbezeichnung; „die Israeliten“ gibt ihn im modernen Standarddeutsch treffend wieder.
- source_word: הַנִּמְצְאִים
  choice: die anwesend waren
  rationale: Das Partizip bezeichnet in diesem Zusammenhang diejenigen, die sich dort befanden beziehungsweise zugegen waren. Eine wörtliche Wiedergabe als „die gefunden wurden“ wäre missverständlich.
- source_word: הַפֶּסַח
  choice: das Passafest
  rationale: Der Begriff bezeichnet hier die Passafeier insgesamt, nicht ausschließlich das Opfertier. „Passafest“ ist eindeutig und geläufig.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Die Wendung ist eine schlichte Zeitangabe. „Zu jener Zeit“ bewahrt den rückverweisenden Charakter von הַהִיא, ohne eine ausdrücklich festgesetzte Zeit in den Text hineinzulesen.
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: Dies ist die geläufige deutsche Bezeichnung des Festes und bildet sowohl חַג als auch הַמַּצּוֹת präzise ab.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Formulierung gibt die Dauer im Deutschen klar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch die Stellung von „sieben Tage lang“ eindeutig und flüssig gestaltet. Es sind keine Fußnoten erforderlich.
