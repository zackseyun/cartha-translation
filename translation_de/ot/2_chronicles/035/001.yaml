source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: de
  text: Josia feierte in Jerusalem das Passafest für Jahwe, und am vierzehnten Tag des ersten Monats schlachtete man das Passaopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Passa“; hier ist das zum Passa geschlachtete Opfertier gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... פֶּסַח
  choice: feierte ... das Passafest
  rationale: עשה mit פסח bezeichnet idiomatisch das Begehen oder Feiern des Passas. „Feierte das Passafest“ ist im heutigen Deutsch natürlich und gibt hier die gesamte Feier wieder.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise Widmung der Feier; „für Jahwe“ ist im Deutschen idiomatischer als „Jahwe“ mit Dativ oder „zu Jahwe“.
- source_word: בִירוּשָׁלַםִ
  choice: in Jerusalem
  rationale: Schlichte Ortsangabe.
- source_word: וַיִּשְׁחֲטוּ
  choice: schlachtete man
  rationale: שׁחט bezeichnet das Schlachten des Opfertiers. Das unbestimmte pluralische Subjekt wird im Deutschen natürlich mit „man“ wiedergegeben, ohne eine bestimmte Personengruppe einzutragen.
- source_word: הַפֶּסַח
  choice: das Passaopfer
  rationale: Beim zweiten Vorkommen bezeichnet פסח metonymisch das geschlachtete Passatier. „Passaopfer“ macht den konkreten Bezug verständlich, ohne das im Hebräischen nicht ausdrücklich genannte Tier als Lamm festzulegen.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: am vierzehnten Tag des ersten Monats
  rationale: Natürliche deutsche Datumsform, die die Zuordnung des Tages zum ersten Monat bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von פסח beim Schlachten
  choice: Passaopfer
  alternative: Passa / Passalamm
  rationale: Der Ausdruck bezeichnet hier das Passatier beziehungsweise -opfer. „Passaopfer“ wahrt die kultische Bedeutung und vermeidet die nicht ausdrücklich im Vers stehende Eingrenzung auf ein Lamm.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Passafest“ unterscheidet die Feier beim ersten Vorkommen von dem konkreten „Passaopfer“ beim zweiten. Der Satzbau folgt natürlichem Deutsch, ohne die inhaltliche Reihenfolge des Hebräischen aufzugeben.
