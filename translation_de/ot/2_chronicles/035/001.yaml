  source_fidelity: 'Der Entwurf gibt die beiden unterschiedlichen Verwendungen von פֶּסַח sachgerecht wieder: zunächst die Passafeier („das Passafest“), dann das zum Schlachten bestimmte Passaopfer. „Feierte“ entspricht der idiomatischen Verbindung עשה פסח. Die Datierung und die Ortsangabe sind vollständig erhalten. Das unbestimmte „man“ ist eine idiomatische deutsche Wiedergabe des hebräischen Plurals, ohne einen nicht genannten Täterkreis festzulegen.'
