  to: Da sandte der HERR einen Engel, der im Lager des Königs von Assyrien alle tapferen Krieger, Anführer und Obersten vernichtete. So kehrte der König mit beschämtem Gesicht in sein Land zurück. Als er den Tempel seines Gottes betrat, erschlugen ihn dort einige seiner eigenen Söhne[a] mit dem Schwert.
  rationale: Die Revision glättet zwei stilistisch schwere Formulierungen und bildet die dreigliedrige militärische Aufzählung klarer ab. Die kontextgemäße Benennung der Täter als Söhne bleibt bestehen, während die Fußnote die wörtliche hebräische Abstammungsformel sichert. Die Aussage des Verses und seine Ambiguität über die im Wortlaut nicht namentlich genannten Täter werden nicht verändert.
