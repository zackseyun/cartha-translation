base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: de
  text: Da sandte der HERR einen Engel, der im Lager des Königs von Assyrien alle tapferen Krieger, Anführer und Obersten vernichtete. So kehrte der König mit beschämtem Gesicht in sein Land zurück. Als er den Tempel seines Gottes betrat, erschlugen ihn dort einige seiner eigenen Söhne[a] mit dem Schwert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: einige, die aus seinem eigenen Leib hervorgegangen waren.'
    reason: Bewahrt die anschauliche hebräische Abstammungsformel hinter der kontextgemäßen Wiedergabe „Söhne“.
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist würdevoll, allgemein verständlich und entspricht hier der konsultierten englischen Fassung.
- source_word: מַלְאָךְ
  choice: einen Engel
  rationale: Im Zusammenhang bezeichnet das Wort einen übermenschlichen Boten Gottes; „Engel“ ist die natürliche deutsche Entsprechung.
- source_word: כָּל גִּבּוֹר חַיִל
  choice: alle kampfstarken Krieger
  rationale: Die Wendung bezeichnet bewährte, wehrfähige Kämpfer; die Übersetzung erhält sowohl den militärischen Bezug als auch den Gedanken besonderer Stärke.
- source_word: וְנָגִיד וְשָׂר
  choice: Befehlshaber und Heerführer
  rationale: Beide Ausdrücke bezeichnen militärische Führungspersonen. Die differenzierte Wiedergabe wahrt die Reihung, ohne eine unsichere genaue Rangordnung vorzutäuschen.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: mit Schande im Gesicht
  rationale: Die bildhafte hebräische Formulierung wird bewusst erhalten und ist im Deutschen verständlich.
- source_word: מֵעָיו
  choice: seiner eigenen Söhne
  rationale: Wörtlich bezeichnet die Wendung Menschen, die aus seinem Inneren beziehungsweise Leib hervorgegangen waren; im historischen Kontext sind seine leiblichen Söhne gemeint.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: erschlugen ihn ... mit dem Schwert
  rationale: Die idiomatische deutsche Formulierung gibt das gewaltsame Töten mit dem Schwert präzise wieder.
theological_decisions:
- issue: Bezeichnung des assyrischen Kultortes
  choice: Tempel seines Gottes
  alternative: Haus seines Gottes
  rationale: בֵּית אֱלֹהָיו meint hier das Heiligtum der von ihm verehrten Gottheit. „Tempel“ macht die kultische Bedeutung im Deutschen natürlich deutlich, ohne diese Gottheit mit dem HERRN gleichzusetzen.
- issue: Identität der Täter
  choice: einige seiner eigenen Söhne mit Fußnote zur wörtlichen Form
  alternative: einige, die aus seinem eigenen Leib hervorgegangen waren
  rationale: Der hebräische Ausdruck ist ein Abstammungsidiom. Die Hauptübersetzung nennt den im Kontext gemeinten Verwandtschaftsgrad klar; die Fußnote bewahrt das Körperbild des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Aufzählung und das Bild „mit Schande im Gesicht“ bleiben erhalten. Zur eindeutigen Bezugnahme wird im zweiten Satz „der König“ statt eines bloßen Pronomens verwendet.
