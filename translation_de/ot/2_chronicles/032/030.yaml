  terminology: »Stadt Davids«, »verschloss«, »leitete« und »bei allem, was er unternahm, Erfolg« sind angemessen. Die Fußnoten bewahren die lexikalische Offenheit bei Quelle/Austrittsstelle und bei der Art des Leitens.
