  text: וְ/ה֣וּא יְחִזְקִיָּ֗הוּ סָתַם֙ אֶת מוֹצָ֞א מֵימֵ֤י גִיחוֹן֙ הָֽ/עֶלְי֔וֹן וַֽ/יַּישְּׁרֵ֥/ם לְ/מַֽטָּה מַּעְרָ֖בָ/ה לְ/עִ֣יר דָּוִ֑יד וַ/יַּצְלַ֥ח יְחִזְקִיָּ֖הוּ בְּ/כָֽל מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: de
  text: Hiskia war es, der die obere Austrittsstelle des Wassers des Gihon verschloss[a] und es nach unten, westwärts zur Stadt Davids leitete[b]. Hiskia hatte bei allem, was er unternahm, Erfolg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die obere Quelle des Gihon«. Das hebräische Wort kann die Stelle bezeichnen, an der das Wasser austritt, oder weiter gefasst die Quelle beziehungsweise den Ausfluss selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ließ es in gerader Bahn fließen« beziehungsweise »führte es durch einen Kanal«. Das hebräische Verb deutet darauf hin, dass das Wasser in einen ausgerichteten Verlauf gelenkt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Er war es, Hiskia, der
  rationale: Die vorangestellte Pronomen-Namens-Verbindung hebt Hiskia ausdrücklich hervor; die deutsche Spaltsatzkonstruktion gibt diese Betonung natürlich wieder.
- source_word: סָתַם
  choice: verschloss
  rationale: Das Verb bezeichnet das Schließen oder Blockieren einer Öffnung und passt hier zum wasserbaulichen Zusammenhang.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: den oberen Ausfluss des Gihonwassers
  rationale: Die Wiedergabe wahrt die Konstruktion mit »Wasser« und lässt erkennen, dass die obere Austrittsstelle gemeint ist, ohne die genaue Beschaffenheit der Anlage festzulegen.
- source_word: וַיַּישְּׁרֵם
  choice: leitete das Wasser
  rationale: Die kausative Form von ישר bezeichnet hier das Lenken des Wassers auf einen bestimmten beziehungsweise geraden Verlauf; »leitete« ist klar und im Deutschen idiomatisch.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: nach unten, westwärts zur Stadt Davids
  rationale: Die Formulierung erhält sowohl die abwärts gerichtete als auch die westliche Bewegung. Das ל vor »Stadt Davids« wird in seiner natürlichen direktionalen Bedeutung mit »zur« wiedergegeben.
- source_word: וַיַּצְלַח
  choice: hatte … Erfolg
  rationale: Das Verb bezeichnet Gelingen beziehungsweise Erfolg; diese Formulierung ist gegenwärtiges, natürliches Deutsch und vermeidet eine unnötige materielle Verengung von »prosperieren«.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: bei allem, was er unternahm
  rationale: Der kollektive Singular bezeichnet Hiskias gesamtes Tun beziehungsweise seine Unternehmungen; die idiomatische Wendung bildet diesen umfassenden Sinn ab.
