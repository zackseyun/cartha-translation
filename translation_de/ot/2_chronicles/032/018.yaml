base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: de
  text: Und sie riefen dem Volk Jerusalems, das auf der Mauer war, mit lauter Stimme auf Judäisch zu, um ihm Angst einzujagen und es in Schrecken zu versetzen, damit sie die Stadt einnehmen könnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: auf Judäisch
  rationale: Bezeichnet die Sprache bzw. den judäischen Dialekt; die adverbiale Wendung ist im Deutschen natürlich und wahrt den historischen Bezug.
- source_word: עַל עַם יְרוּשָׁלִַם
  choice: den Bewohnern Jerusalems … zu
  rationale: עַל steht hier beim Zurufen und wird idiomatisch mit dem Dativ wiedergegeben; עַם bezeichnet in diesem Zusammenhang die Bevölkerung bzw. die Leute Jerusalems.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: um ihnen Angst einzujagen und sie in Schrecken zu versetzen
  rationale: 'Die beiden kausativen Verben werden unterschieden wiedergegeben: Furcht hervorrufen und bestürzen bzw. in Schrecken versetzen.'
- source_word: יִלְכְּדוּ
  choice: sie … einnehmen könnten
  rationale: לכד bezeichnet bei einer Stadt deren Eroberung oder Einnahme; der deutsche Konjunktiv gibt den mit לְמַעַן ausgedrückten Zweck natürlich wieder.
