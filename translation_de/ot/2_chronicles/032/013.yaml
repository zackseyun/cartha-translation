  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: de
  text: Wisst ihr nicht, was ich und meine Väter[a] mit allen Völkern der Länder getan haben? Konnten die Götter der Nationen der Länder überhaupt ihr Land aus meiner Hand retten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorfahren“. Das Hebräische verwendet eine familiär-dynastische Bezeichnung, die auch königliche Vorgänger einschließen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Wisst ihr nicht
  rationale: Die verneinte Frage erwartet Zustimmung und wird im Deutschen natürlich und mit ihrer rhetorischen Kraft wiedergegeben.
- source_word: מֶה עָשִׂיתִי
  choice: was ich … angetan habe
  rationale: Im Zusammenhang der feindseligen Prahlrede bezeichnet עשה das Vorgehen gegen die Völker; „angetan“ macht diese relationale und schädigende Bedeutung im Deutschen idiomatisch deutlich.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: ich und meine Väter
  rationale: Bewahrt die familiär-dynastische Ausdrucksweise des Hebräischen; gemeint sein können die königlichen Vorgänger beziehungsweise Vorfahren.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: allen Völkern der Länder
  rationale: Bewahrt den Plural „Länder“ und gibt עמים als „Völker“ wieder; nach „angetan“ ist die Präposition im Deutschen nicht eigens auszudrücken.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: Konnten etwa
  rationale: Infinitivus absolutus und finite Verbform verstärken die rhetorische Frage. „Etwa“ vermittelt die erwartete negative Antwort idiomatisch, ohne eine zusätzliche Behauptung einzufügen.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: die Götter der Nationen jener Länder
  rationale: Gibt die Genitivkette verständlich wieder. „Jener“ verhindert im Deutschen eine schwerfällige Wiederholung, ohne den Bezug auf die zuvor genannten Länder aufzugeben.
- source_word: לְהַצִּיל
  choice: retten
  rationale: נצל bezeichnet hier die Rettung beziehungsweise Befreiung aus militärischer Gewalt; „retten“ ist im modernen Deutsch klar und würdig.
- source_word: אֶת אַרְצָם
  choice: ihr Land
  rationale: Bewahrt den kollektiven Singular des hebräischen Ausdrucks.
- source_word: מִיָדִי
  choice: aus meiner Hand
  rationale: Erhält das transparente biblische Bild für Macht und Gewalt, ohne es interpretierend zu „aus meiner Gewalt“ aufzulösen.
theological_decisions:
- issue: Bezeichnung der Gottheiten in Sanheribs Prahlrede
  choice: „Götter“ ohne wertende Ergänzung
  alternative: „sogenannte Götter“
  rationale: Der Text gibt die Rhetorik des Sprechers wieder. Eine Qualifizierung würde die theologische Bewertung in seine Worte eintragen und die Spannung zu seiner Gleichsetzung dieser Gottheiten mit dem Gott Judas vorwegnehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorischen Fragen und das Machtbild „aus meiner Hand“ bleiben erhalten; die Prahlrede wird nicht durch theologische Zusätze entschärft oder kommentiert.
