  text: וַ/יִּקָּבְצ֣וּ עַם רָ֔ב וַֽ/יִּסְתְּמוּ֙ אֶת כָּל הַ/מַּעְיָנ֔וֹת וְ/אֶת הַ/נַּ֛חַל הַ/שּׁוֹטֵ֥ף בְּ/תוֹךְ הָ/אָ֖רֶץ לֵ/אמֹ֑ר לָ֤/מָּה יָב֨וֹאוּ֙ מַלְכֵ֣י אַשּׁ֔וּר וּ/מָצְא֖וּ מַ֥יִם רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: de
  text: 'Da versammelten sich viele Menschen. Sie verstopften alle Quellen und den Bach, der mitten durch das Land floss,[a] und sagten: »Warum sollen die Könige von Assyrien kommen und reichlich Wasser finden?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Wadi, der durch das Land strömte«; נַחַל kann einen Bach oder ein zeitweise wasserführendes Trockental bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Könige von Assyrien«. Der Plural kann die assyrische Königsmacht oder Dynastie bezeichnen; im unmittelbaren Zusammenhang übersetzen manche mit »der König von Assyrien«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: Da versammelten sich viele Menschen
  rationale: Die Nifalform bezeichnet das Zusammenkommen bzw. Versammeltwerden; aktiv-reflexives Deutsch ist hier natürlich. עַם רָב meint in diesem Zusammenhang eine große Zahl von Menschen.
- source_word: וַיִּסְתְּמוּ אֶת כָּל הַמַּעְיָנוֹת
  choice: Sie verstopften alle Quellen
  rationale: סתם bezeichnet das Verschließen oder Blockieren; bei Quellen gibt »verstopften« die konkrete Maßnahme knapp und verständlich wieder.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: den Bach, der ... floss
  rationale: נַחַל bezeichnet einen Bach oder ein zeitweise wasserführendes Tal; zusammen mit שׁטף steht hier der tatsächlich fließende Wasserlauf im Vordergrund. »Bach« ist im Haupttext allgemein verständlich.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: mitten durch das Land
  rationale: Die Wendung beschreibt den Verlauf innerhalb des Landes; »mitten durch« ist natürliches Deutsch und bewahrt die räumliche Aussage.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Der übliche hebräische Redeindikator wird im Deutschen idiomatisch als Einleitung der direkten Rede wiedergegeben.
- source_word: יָבֹאוּ מַלְכֵי אַשּׁוּר
  choice: sollen die Könige von Assyrien kommen
  rationale: Der Plural »Könige« wird gemäß dem masoretischen Text beibehalten; die rhetorische Frage erhält durch »sollen« ihre abwehrende, deliberative Kraft.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: und reichlich Wasser finden
  rationale: מַיִם רַבִּים bezeichnet eine große, strategisch bedeutsame Wassermenge; »reichlich Wasser« ist prägnant und idiomatisch.
theological_decisions:
- issue: Plural מַלְכֵי אַשּׁוּר im historischen Zusammenhang
  choice: Könige von Assyrien
  alternative: König von Assyrien
  rationale: Der hebräische Plural bleibt erhalten, auch wenn im unmittelbaren historischen Zusammenhang ein einzelner assyrischer Herrscher im Blick stehen kann. Die Übersetzung löst diese Spannung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze machen die Abfolge der Maßnahmen klar. Der seltenere Begriff »Wadi« wird nur in der Fußnote genannt; der auffällige hebräische Plural »Könige« bleibt im Haupttext erhalten.
