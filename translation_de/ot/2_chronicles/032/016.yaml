  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: de
  text: Und seine Diener redeten weiter gegen Jahwe, Gott, und gegen Hiskia, seinen Diener[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „redeten weiter über Jahwe, Gott, und über Hiskia, seinen Diener“. Die hebräische Präposition kann auch neutral „über“ bedeuten; hier spricht der Zusammenhang jedoch für den feindseligen Sinn „gegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: noch weiter
  rationale: Die Verbindung aus Konjunktion und Adverb führt die Erzählung fort und bezeichnet eine zusätzliche, sich steigernde Äußerung.
- source_word: דִּבְּרוּ
  choice: redeten
  rationale: Das Piel von דבר bedeutet hier allgemein „reden“; zusammen mit עַל trägt es im Kontext den Sinn feindseliger Rede.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד bezeichnet hier die Beauftragten des assyrischen Königs. „Diener“ bewahrt die Breite des hebräischen Ausdrucks, ohne ihren Status vorschnell auf „Beamte“ oder „Sklaven“ festzulegen.
- source_word: עַל / וְעַל
  choice: gegen / und gegen
  rationale: עַל kann bei דבר neutral „über“ oder kontextuell „gegen“ bedeuten. Der Zusammenhang der Lästerung und Einschüchterung spricht hier für die feindselige Bedeutung; die Wiederholung erhält den Parallelismus.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Jahwe, den Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Den Gott“ bildet den bestimmten appositionellen Ausdruck הָאֱלֹהִים ab und vermeidet, den Artikel ganz zu übergehen.
- source_word: יְחִזְקִיָּהוּ עַבְדּוֹ
  choice: Hiskia, seinen Diener
  rationale: Die geläufige deutsche Namensform „Hiskia“ wird verwendet. „Diener“ gibt עבד in seiner königlich-theologischen Bedeutung wieder; das Possessivpronomen bezieht sich im Kontext auf Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד für Hiskia
  choice: Diener
  alternative: Sklave
  rationale: Hiskia wird als der Gott zugehörige und ihm dienende König bezeichnet. „Sklave“ würde hier eine soziale Nuance hervorheben, die der Kontext nicht verlangt.
- issue: Feindselige oder neutrale Bedeutung von עַל bei דבר
  choice: gegen
  alternative: über
  rationale: Der weitere Zusammenhang schildert die Worte der assyrischen Gesandten als Lästerung und Angriff. Die grundsätzlich mögliche neutralere Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die Wiederholung von „gegen“ erhalten den hebräischen Parallelismus. Die Apposition „Jahwe, den Gott“ ist bewusst markiert und spiegelt den bestimmten hebräischen Ausdruck wider.
