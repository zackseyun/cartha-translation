base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: de
  text: So rettete Jahwe Hiskia und die Einwohner Jerusalems aus der Hand Sanheribs, des Königs von Assyrien, und aus der Hand aller[a] und führte sie ringsumher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und aus der Hand aller«. Das Hebräische nennt nicht ausdrücklich, wer mit »allen« gemeint ist; im Zusammenhang können weitere Gegner oder feindliche Mächte gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und er leitete sie ringsumher«. Manche verstehen die Wendung weiter gefasst als Hinweis darauf, dass er ihnen ringsum Ruhe oder Sicherheit verschaffte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: rettete
  rationale: Das Verb ישׁע bezeichnet Rettung oder Befreiung. »Rettete« ist im heutigen Deutsch natürlich und bewahrt das Gewicht des göttlichen Eingreifens, ohne den Sinn auf einen militärischen Sieg zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, damit der im Ausgangstext stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: »Hiskia« ist die im Deutschen etablierte Namensform.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet die in Jerusalem Wohnenden. »Die Einwohner Jerusalems« ist klar, natürlich und würdevoll.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet die Befreiung aus der Macht oder Gewalt eines anderen. Das im Deutschen verständliche Bild der »Hand« bleibt erhalten.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sanherib, des Königs von Assyrien
  rationale: Die geläufige deutsche Namensform wird mit dem appositionellen Königstitel verbunden; der Genitiv fügt sich natürlich in die Wendung »aus der Hand« ein.
- source_word: וּמִיַּד כֹּל
  choice: und aus der Hand aller anderen
  rationale: כֹּל steht ohne ausdrücklich genanntes Bezugswort. »Aller anderen« bewahrt diese Ellipse weitgehend, lässt im Zusammenhang aber erkennen, dass weitere feindliche Mächte oder Gegner gemeint sein können.
- source_word: וַיְנַהֲלֵם
  choice: und er leitete sie
  rationale: נהל bedeutet grundlegend »führen, leiten«. »Leitete« erhält diesen lexikalischen Sinn und vermeidet es, die Aussage unmittelbar als Gewährung von Ruhe oder Sicherheit auszudeuten.
- source_word: מִסָּבִיב
  choice: ringsumher
  rationale: Das Adverb bezeichnet die Umgebung auf allen Seiten. »Ringsumher« bewahrt die räumliche Offenheit der hebräischen Formulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Vers steht der Gottesname selbst. Die Transliteration »Jahwe« bewahrt den persönlichen Namen, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Sinn von וַיְנַהֲלֵם מִסָּבִיב
  choice: und er leitete sie ringsumher
  alternative: und er verschaffte ihnen ringsum Ruhe
  rationale: Der masoretische Wortlaut unterstützt unmittelbar das Führen oder Leiten. Die im Kontext mögliche Vorstellung umfassender Sicherheit wird nicht in den Haupttext eingetragen, sondern als Auslegungsalternative in der Fußnote genannt.
- issue: Unausgesprochenes Bezugswort bei כֹּל
  choice: aller anderen
  alternative: aller
  rationale: Das Hebräische lässt offen, auf wen oder was sich »alle« bezieht. Die Übersetzung macht lediglich die Gegenüberstellung zu Sanherib deutlicher, ohne ausdrücklich »Feinde« oder »Mächte« in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache »aus der Hand« bleibt erhalten. Die ungewöhnliche Schlussformulierung wird bewusst nicht zu einer eindeutigen Aussage über Ruhe oder Sicherheit geglättet; die wichtigsten Verständnismöglichkeiten stehen in der Fußnote.
