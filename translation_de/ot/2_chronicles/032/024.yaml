source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: de
  text: In jener Zeit wurde Hiskia todkrank. Er betete zu Jahwe, und dieser antwortete ihm[a] und gab ihm ein Zeichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er sagte zu ihm“. Gemeint ist Jahwes Antwort auf Hiskias Gebet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wunderzeichen“ oder „Vorzeichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jener Zeit
  rationale: Die hebräische Zeitangabe bedeutet wörtlich „in jenen Tagen“. „In jener Zeit“ gibt die Wendung in natürlichem modernem Deutsch wieder.
- source_word: חָלָה ... עַד לָמוּת
  choice: wurde ... todkrank
  rationale: חלה beschreibt das Erkranken; עַד לָמוּת bezeichnet eine Krankheit bis an die Schwelle des Todes. „Wurde todkrank“ ist knapp, verständlich und bewahrt die Schwere der Aussage.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Er betete zu Jahwe
  rationale: Das Verb ist die übliche Bezeichnung für Beten. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיֹּאמֶר לוֹ
  choice: dieser antwortete ihm
  rationale: Wörtlich steht „und er sagte zu ihm“. Im Zusammenhang bezeichnet das Sagen Jahwes seine Reaktion auf Hiskias Gebet; „antwortete“ gibt diese Funktion natürlich wieder, während die wörtliche Form in einer Fußnote erhalten bleibt.
- source_word: מוֹפֵת
  choice: Zeichen
  rationale: מוֹפֵת kann ein Zeichen, Wunderzeichen oder Vorzeichen bezeichnen. Hier bestätigt ein außergewöhnliches Zeichen Gottes Zusage an Hiskia; „Zeichen“ wahrt die semantische Breite.
- source_word: נָתַן לוֹ
  choice: gab ihm
  rationale: Direkte und natürliche Wiedergabe von נתן mit dem indirekten Objekt „ihm“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt von וַיֹּאמֶר und נָתַן
  choice: Jahwe ist der Handelnde, durch „dieser“ wieder aufgenommen
  alternative: Das Subjekt nur durch „er“ wiedergeben
  rationale: Der nächstliegende grammatische Bezug und die Parallelberichte zeigen, dass Jahwe Hiskia antwortet und ihm das Zeichen gibt. „Dieser“ verhindert im Deutschen eine mögliche Verwechslung mit Hiskia.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die Formulierung vermeidet archaische Wendungen; echte lexikalische Alternativen werden in den Fußnoten bewahrt.
