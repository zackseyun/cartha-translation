base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: de
  text: Hiskia besaß sehr großen Reichtum und hohes Ansehen, und er errichtete Schatzkammern[a] für Silber und Gold, für Edelsteine und Duftstoffe, für Schilde und für alle kostbaren Gegenstände[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorratsräume«. Das hebräische Wort kann sowohl allgemeine Lagerräume als auch königliche Schatzkammern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »alle begehrenswerten Gegenstände«. Der hebräische Ausdruck ist weit gefasst und kann unterschiedliche wertvolle oder luxuriöse Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: Hiskia besaß
  rationale: Die hebräische Besitzkonstruktion »es war dem Hiskia« wird im modernen Deutschen natürlich mit »besaß« wiedergegeben.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: sehr großen Reichtum und hohes Ansehen
  rationale: »Reichtum« bezeichnet den materiellen Besitz; כָּבוֹד meint im königlichen Zusammenhang gesellschaftliches Gewicht, Ehre und Rang. »Hohes Ansehen« ist hier natürlicher als das theologisch stärker besetzte »Herrlichkeit« und bewahrt die starke Intensivierung.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Er ließ sich Schatzkammern anlegen
  rationale: אֹצָרוֹת kann Schatzkammern oder allgemein Lagerräume bezeichnen. Angesichts der aufgezählten Wertgegenstände passt »Schatzkammern« gut; »anlegen« gibt עָשָׂה wieder, ohne zwingend einen bestimmten Bauvorgang zu behaupten. »Sich« bewahrt לוֹ.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: für Silber und Gold
  rationale: Die Stoffbezeichnungen stehen im Deutschen idiomatisch im Singular; die Präposition eröffnet die Aufzählung der eingelagerten Güter.
- source_word: וּלְאֶבֶן יְקָרָה
  choice: für Edelsteine
  rationale: Der hebräische Singular kann kollektiv verstanden werden; der deutsche Plural ist in einer Bestandsliste natürlich.
- source_word: וְלִבְשָׂמִים
  choice: Duftstoffe
  rationale: Das Wort bezeichnet wohlriechende aromatische Stoffe. »Duftstoffe« hält die Bedeutung weiter als »Parfüm« und ist im Deutschen weniger auf Speisezutaten verengt als »Gewürze«.
- source_word: וּלְמָגִנִּים
  choice: für Schilde
  rationale: מָגִנִּים bezeichnet konkret Schilde und nicht allgemein Waffen oder Rüstung.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: für allerlei kostbare Gegenstände
  rationale: כְּלֵי ist ein weiter Begriff für Geräte, Gefäße oder Gegenstände; חֶמְדָּה bezeichnet Begehrenswertes beziehungsweise Kostbares. Die Übersetzung wahrt diese sachliche Breite.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition »für« erhält etwas vom aufzählenden Rhythmus des Hebräischen, ohne die deutsche Satzmelodie unnötig zu belasten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
