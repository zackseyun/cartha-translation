source:
  edition: WLC
  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: de
  text: 'Er setzte Heerführer über das Volk, versammelte sie bei sich auf dem Platz am Stadttor und redete ihnen zu[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „redete zu ihrem Herzen“; gemeint ist eine ermutigende und stärkende Ansprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er setzte … über
  rationale: Das Verb bedeutet wörtlich „geben/setzen“, bezeichnet hier mit עַל aber die Einsetzung in eine Leitungsfunktion.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: Heerführer
  rationale: Die Wendung bezeichnet militärische Befehlshaber; „Heerführer“ ist knapp, würdig und im modernen Deutsch verständlich.
- source_word: עַל הָעָם
  choice: über das Volk
  rationale: עַל bezeichnet bei der Einsetzung die Autoritäts- und Aufsichtsbeziehung.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: versammelte sie bei sich
  rationale: Die Formulierung gibt sowohl das Zusammenrufen als auch אֵלָיו, die Ausrichtung auf Hiskia, natürlich wieder.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: auf dem Platz am Stadttor
  rationale: רְחוֹב bezeichnet einen offenen Platz; die deutsche Formulierung bewahrt den öffentlichen Ort beim Stadttor.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: redete ihnen zu
  rationale: Die hebräische Wendung lautet bildlich „zu/auf ihr Herz reden“ und bezeichnet hier eine ermutigende, stärkende Ansprache. „Redete ihnen zu“ gibt die idiomatische Funktion natürlich wieder; die Fußnote bewahrt das Bild.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen die unmittelbar folgende direkte Rede natürlicher ein als ein zusätzliches „und sagte“.
