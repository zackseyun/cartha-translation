base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: de
  text: Er beriet sich mit seinen Obersten und seinen Kriegshelden, um die Quellen außerhalb der Stadt zu verstopfen[a], und sie halfen ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er beriet sich mit seinen Obersten und seinen Kriegshelden darüber, die Quellen außerhalb der Stadt zu verstopfen.'
    reason: Der hebräische Infinitiv kann sowohl das Ziel als auch den Inhalt der Beratung ausdrücken.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: er beriet sich
  rationale: Der Niphal von יעץ bezeichnet hier das gemeinsame Beraten beziehungsweise Ratnehmen. „Er beriet sich“ ist im modernen Deutschen natürlich und bewahrt den gemeinschaftlichen Sinn.
- source_word: שָׂרָיו
  choice: seine führenden Männer
  rationale: שַׂר kann Amtsträger, Anführer, Befehlshaber oder Fürst bedeuten. „Führende Männer“ lässt im administrativ-militärischen Zusammenhang die genaue Funktion offen und vermeidet die dynastische Nebenbedeutung von „Fürsten“.
- source_word: גִבֹּרָיו
  choice: seine Kriegshelden
  rationale: גִּבּוֹר bezeichnet häufig einen kampferprobten, besonders tüchtigen Krieger. „Kriegshelden“ bewahrt die militärische Färbung und den gehobenen biblischen Ton.
- source_word: לִסְתּוֹם
  choice: darüber, … zu sperren
  rationale: Der Infinitiv kann den Inhalt oder den Zweck der Beratung angeben. Die Formulierung mit „darüber“ gibt im Haupttext den Inhalt idiomatisch wieder; die Zwecknuance wird in der Fußnote bewahrt. „Sperren“ bezeichnet das Unterbinden des Wasserflusses beziehungsweise des Zugangs dazu, ohne eine bestimmte technische Maßnahme festzulegen.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: das Wasser der Quellen
  rationale: Die Wendung gibt die hebräische Konstruktverbindung genau und zugleich verständlich wieder. „Quellen“ ist in diesem geografischen Zusammenhang natürlicher als „Brunnen“.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: außerhalb der Stadt
  rationale: Die knappe Ortsangabe gibt den Relativsatz idiomatisch wieder und bezeichnet eindeutig das Gebiet jenseits der Stadtgrenze.
- source_word: וַיַּעְזְרֻהוּ
  choice: und sie halfen ihm
  rationale: עזר mit dem Suffix der dritten Person Singular bedeutet unmittelbar, dass die zuvor genannten Männer ihm Hilfe leisteten.
