  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: de
  text: Er baute sich auch Städte und besaß Schaf- und Rinderherden in großer Menge, denn Gott hatte ihm sehr großen Besitz gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Vermögen, Reichtum.'
    reason: Lexikalische Alternative für רְכוּשׁ („Besitz“).
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Er legte sich auch Städte an
  rationale: Die Wendung bezeichnet, dass Hiskia Städte zu seinem Nutzen beziehungsweise als eigenen Besitz schuf oder ausbaute. „legte sich … an“ gibt עָשָׂה לוֹ natürlich wieder, ohne das im Hebräischen allgemeinere Verb unnötig auf „bauen“ festzulegen.
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: und erwarb Schafe und Rinder
  rationale: מִקְנֶה bezeichnet Viehbestand beziehungsweise Viehbesitz; mit den nachfolgenden Tierbezeichnungen lässt sich die nominale Konstruktion im Deutschen idiomatisch verbal wiedergeben. צֹאן umfasst Kleinvieh, besonders Schafe und Ziegen; „Schafe“ ist verständlich, während die mögliche Einbeziehung von Ziegen in der Fußnote kenntlich bleibt. בָּקָר bezeichnet Rinder.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung drückt eine sehr große Anzahl beziehungsweise Fülle des Viehs aus.
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: denn Gott hatte ihm … gegeben
  rationale: כִּי führt die Begründung für Hiskias umfangreichen Besitz ein. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Gottes Gabe seinem Wohlstand zugrunde lag.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: sehr großen Besitz
  rationale: רְכוּשׁ bezeichnet materiellen Besitz oder Vermögen. „Besitz“ bleibt näher am konkreten Bedeutungsumfang als das abstraktere „Reichtum“; רַב מְאֹד wird mit „sehr groß“ wiedergegeben.
theological_decisions:
- issue: Ursprung von Hiskias Wohlstand
  choice: Der Vers führt Hiskias sehr großen Besitz ausdrücklich auf Gottes Gabe zurück.
  alternative: Die Aussage zu einer allgemeinen Lehre materiellen Wohlstands auszuweiten.
  rationale: כִּי נָתַן לוֹ אֱלֹהִים nennt unmittelbar Gottes Handeln als Ursache, macht aber keine allgemeine Aussage darüber, dass Gottes Gunst stets materiellen Wohlstand bewirke.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung folgt der hebräischen Kausalstruktur, vermeidet unnötige Fachsprache und bewahrt bei עָשָׂה die Offenheit zwischen Anlegen, Errichten und Ausbauen von Städten.
