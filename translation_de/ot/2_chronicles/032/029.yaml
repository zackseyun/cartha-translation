  - severity: low
    issue: Die Fußnote bündelt zwei Worterklärungen, ist aber nur am Satzende nach „Besitz“ verankert.
    rationale: Die Bedeutungsbreite von צֹאן sollte entweder direkt bei der betreffenden Übersetzung markiert oder nicht in derselben Fußnote behandelt werden. Eine auf רְכוּשׁ beschränkte Fußnote ist eindeutig verankert.
