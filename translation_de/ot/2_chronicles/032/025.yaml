base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: de
  text: Aber Hiskia erwiderte die ihm erwiesene Wohltat nicht in angemessener Weise[a], denn sein Herz wurde stolz. Darum kam Zorn über ihn sowie über Juda und Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reagierte nicht so, wie es der ihm erwiesenen Güte entsprochen hätte“. Die hebräische Wendung bezeichnet allgemein eine angemessene Erwiderung auf empfangenes Gutes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: der Wohltat, die ihm erwiesen worden war, entsprechend
  rationale: גְּמוּל bezeichnet je nach Zusammenhang Erweisung, Vergeltung oder empfangene Wohltat. Im Kontext von Heilung und Rettung ist die Hiskia erwiesene Wohltat gemeint; die Formulierung bewahrt zugleich den Vergleich mit כִּ.
- source_word: הֵשִׁיב
  choice: vergalt ... nicht
  rationale: Der Hifil von שׁוב bedeutet hier zusammen mit גְּמוּל, eine angemessene Gegenleistung oder Antwort auf empfangenes Gutes zu geben. „Vergelten“ ist im Deutschen knapp und lässt die konkrete Form dieser Erwiderung offen.
- source_word: גָבַהּ לִבּוֹ
  choice: sein Herz wurde hochmütig
  rationale: Die hebräische Wendung sagt wörtlich, dass sein Herz hoch wurde, und bezeichnet Stolz oder Überheblichkeit. „Sein Herz wurde hochmütig“ erhält den inneren Bezug und klingt zugleich natürlich.
- source_word: קֶצֶף
  choice: Zorn
  rationale: קֶצֶף bezeichnet heftigen Zorn, im Kontext erkennbar Gottes Gericht. „Zorn“ wahrt die Schwere, ohne den im Satz nicht ausdrücklich genannten Urheber einzufügen.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: Darum kam Zorn über ihn
  rationale: Die hebräische Existenzkonstruktion beschreibt den Eintritt der Gerichtsfolge. „Kam Zorn über ihn“ gibt dies idiomatisch wieder und lässt den Handelnden wie im Ausgangstext unausgesprochen.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Juda und Jerusalem
  rationale: Dies sind die im modernen deutschen Bibelgebrauch etablierten Formen der Ortsnamen.
theological_decisions:
- issue: Art von Hiskias Versagen angesichts der empfangenen Wohltat
  choice: Hiskia erwiderte die empfangene Wohltat nicht in angemessener Weise, ohne die fehlende Reaktion auf bloßen Dank zu verengen.
  alternative: Hiskia dankte nicht für die ihm erwiesene Wohltat.
  rationale: Das Hebräische spricht allgemein davon, dass Hiskia keine der Wohltat entsprechende Erwiderung gab. „Vergalt“ bewahrt diese moralische Bewertung und legt keine einzelne Form der Dankbarkeit fest.
- issue: Urheber des Zorns
  choice: Der Urheber bleibt im Satz unausgesprochen.
  alternative: Der Zorn des HERRN kam über ihn.
  rationale: Aus dem Zusammenhang ist Gottes Zorn gemeint, doch dieser Vers nennt den HERRN in der betreffenden Klausel nicht ausdrücklich. Die Übersetzung erhält diese grammatische Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wohltat“ und „vergelten“ bewahren die Breite der hebräischen Wendung; „hochmütig“ erschließt das Bild vom hohen Herzen, ohne dessen inneren Bezug aufzugeben.
