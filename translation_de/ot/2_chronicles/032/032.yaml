  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: de
  text: Die übrigen Taten Hiskias und seine Taten der Treue[a] – siehe[b], sie sind niedergeschrieben in der Vision des Propheten Jesaja, des Sohnes des Amoz, im Buch der Könige von Juda und Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „loyale Taten“, „gute Taten“ oder „Taten der Bundestreue“. Das hebräische Wort kann loyale, treue Zuwendung bzw. entsprechendes Handeln bezeichnen.'
    reason: lexikalische Alternativen zu חֲסָדָיו
  - marker: b
    text: 'Wörtlich: „siehe, sie sind niedergeschrieben“. Der hebräische Ausdruck lenkt die Aufmerksamkeit auf die folgende Quellenangabe.'
    reason: Diskursfunktion von הִנָּם
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: In der königlichen Schlussformel bezeichnet דִּבְרֵי die Taten oder Angelegenheiten des Königs; וְיֶתֶר führt das noch übrige Material an.
- source_word: וַחֲסָדָיו
  choice: und seine treuen Werke
  rationale: חֶסֶד bezeichnet hier auf Hiskia bezogene, von Loyalität und Treue geprägte Taten. „Treue Werke“ bewahrt diese Bedeutung, ohne den Bundesgedanken im Haupttext zu verstärken.
- source_word: הִנָּם כְּתוּבִים
  choice: sie sind ja niedergeschrieben
  rationale: הִנָּם lenkt präsentierend die Aufmerksamkeit auf die folgende Quellenangabe. Das deutsche „ja“ erhält diesen Hinweischarakter natürlicher als das altertümliche „siehe“; „niedergeschrieben“ gibt כְּתוּבִים wieder.
- source_word: בַּחֲזוֹן
  choice: in der Schau
  rationale: חָזוֹן bedeutet primär eine prophetische Schau oder Vision. „Schau“ ist in diesem Zusammenhang würdig und bewahrt den prophetischen Charakter des Ausdrucks.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: des Propheten Jesaja, des Sohnes des Amoz
  rationale: Die Formulierung gibt Name, Abstammung und prophetisches Amt vollständig und in natürlicher deutscher Wortstellung wieder.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: im Buch der Könige von Juda und Israel
  rationale: עַל verbindet hier bibliografisch die genannte prophetische Schau mit dem Quellenwerk. „Im Buch“ ist im Deutschen natürlicher als ein wörtliches „auf dem Buch“.
theological_decisions:
- issue: Bedeutungsnuance von חֶסֶד für Hiskias Handeln
  choice: treue Werke
  alternative: Taten der Bundestreue; loyale Taten; Wohltaten
  rationale: Der Ausdruck umfasst loyales und treues Verhalten. Da er hier von einem menschlichen König ausgesagt wird, bleibt die Übersetzung offen für die relationale beziehungsweise bundesbezogene Nuance, ohne diese als technische Aussage festzulegen.
- issue: Verhältnis der „Schau Jesajas“ zum „Buch der Könige“
  choice: in der Schau … im Buch
  alternative: in der Schau … über das Buch; in der Aufzeichnung … im Buch
  rationale: Die hebräische Konstruktion kann das genaue literarische Verhältnis der Quellenangaben offenlassen. Die Übersetzung folgt der naheliegenden bibliografischen Einordnung, ohne die „Schau“ in eine bloße Chronik umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die chronistische Schlussformel bleibt erkennbar; altertümliches „siehe“ wird im Haupttext durch das natürliche präsentierende „ja“ ersetzt. Der Fußnotenmarker [a] steht im Haupttext.
