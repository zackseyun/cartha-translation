  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: de
  text: Wer unter all den Göttern dieser Völker, die meine Väter der Vernichtung weihten[a], konnte sein Volk aus meiner Hand retten? Wie sollte da euer Gott euch aus meiner Hand retten können?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Bann belegten“. Das hebräische Verb bezeichnet, dass etwas der Vernichtung preisgegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Wer unter all den Göttern dieser Völker
  rationale: מִי eröffnet eine rhetorische Herausforderung; בְּכָל wird hier partitiv mit „unter all“ wiedergegeben. „Götter“ und „Völker“ entsprechen der unkommentierten Ausdrucksweise des Sprechers.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: die meine Väter der Vernichtung weihten
  rationale: Das Hifil von חרם bezeichnet das Bannweihen beziehungsweise die vollständige Preisgabe zur Vernichtung und ist stärker als ein bloßes „vernichteten“. Das Relativpronomen lässt im Deutschen wie im Hebräischen den unmittelbaren Bezug im Satzgefüge bestehen.
- source_word: אֲבוֹתַי
  choice: meine Väter
  rationale: Die wörtliche Wiedergabe ist in diesem königlichen Sprachgebrauch verständlich und kann Vorfahren beziehungsweise Vorgänger einschließen.
- source_word: יָכוֹל לְהַצִּיל אֶת עַמּוֹ
  choice: konnte sein Volk … retten
  rationale: יָכוֹל bezeichnet Fähigkeit, und נצל im Hifil die Rettung aus fremder Gewalt. Der Singular „sein Volk“ entspricht dem rhetorisch jeweils einzeln betrachteten Gott.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die transparente hebräische Machtmetapher wird bewahrt und in beiden Satzteilen gleich wiedergegeben.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: Wie sollte da euer Gott … retten können?
  rationale: Die eigenständige deutsche Frage gibt die spöttische Folgerung und den Ausdruck des Unglaubens natürlich wieder; das Imperfekt יוּכַל wird modal mit „sollte … können“ erfasst.
theological_decisions:
- issue: Bedeutung von חרם im assyrischen Spottwort
  choice: der Vernichtung weihten
  alternative: vernichteten; mit dem Bann belegten
  rationale: Die Formulierung bewahrt den Gedanken der Bestimmung zur Vernichtung, ohne ihn auf gewöhnliches Zerstören zu reduzieren oder mit schwer verständlicher Fachsprache zu belasten.
- issue: Bezeichnung fremder Gottheiten
  choice: Götter
  alternative: sogenannte Götter; Götzen
  rationale: Der Sprecher sagt ausdrücklich אֱלֹהֵי. Die Übersetzung fügt keine wertende Erläuterung hinzu und ersetzt den Ausdruck nicht durch eine theologisch deutende Bezeichnung.
- issue: Rhetorische Behauptung über den Gott Judas
  choice: Wie sollte da euer Gott euch aus meiner Hand retten können?
  alternative: dass euer Gott euch aus meiner Hand retten könnte?
  rationale: Die deutsche Form bewahrt die anmaßende rhetorische Schlussfolgerung des Sprechers, ohne ihr sachlich zuzustimmen oder sie abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wendung „aus meiner Hand retten“ bewahrt die Wiederholung und Machtmetapher des Hebräischen; die Aufteilung in zwei Fragen sorgt für natürliche deutsche Syntax, ohne die rhetorische Spannung zu glätten.
