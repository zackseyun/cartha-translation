  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Hiskias Entschluss, die Wiederherstellung der durchbrochenen Mauer, die bewusst zurückhaltend wiedergegebene schwierige Wendung zu den Türmen, die zusätzliche äußere Mauer, die Befestigung des Millo sowie die Anfertigung von Waffen und Schilden in großer Zahl. „Er fasste Mut“ ist eine natürliche, kontextuell angemessene Wiedergabe des reflexiven וַיִּתְחַזַּק, ohne eine theologische Deutung einzutragen.'
