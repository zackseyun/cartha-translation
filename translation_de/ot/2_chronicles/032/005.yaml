source:
  edition: WLC
  text: וַ/יִּתְחַזַּ֡ק וַ/יִּבֶן֩ אֶת כָּל הַ/חוֹמָ֨ה הַ/פְּרוּצָ֜ה וַ/יַּ֣עַל עַל הַ/מִּגְדָּל֗וֹת וְ/לַ/ח֨וּצָ/ה֙ הַ/חוֹמָ֣ה אַחֶ֔רֶת וַ/יְחַזֵּ֥ק אֶת הַ/מִּלּ֖וֹא עִ֣יר דָּוִ֑יד וַ/יַּ֥עַשׂ שֶׁ֛לַח לָ/רֹ֖ב וּ/מָגִנִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: de
  text: Er fasste Mut und baute die ganze Mauer wieder auf, die Breschen hatte. Er erhöhte sie bis zu den Türmen und baute außerhalb eine weitere Mauer. Auch befestigte er den Millo der Stadt Davids[a] und ließ Waffen[b] und Schilde in großer Menge anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Millo“ war vermutlich eine aufgeschüttete oder terrassenartige Stützanlage beziehungsweise Befestigung in Jerusalem; der genaue Bezug des hebräischen Ausdrucks ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Geschosse, Wurfspieße. Das hebräische Wort kann unterschiedliche Waffen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Er fasste Mut
  rationale: Der Hitpael von חזק bezeichnet hier Hiskias entschlossenes Handeln angesichts der Bedrohung. „Er fasste Mut“ gibt dies im Deutschen natürlich wieder; das wörtlichere „er stärkte sich“ wäre unidiomatisch.
- source_word: וַיִּבֶן אֶת כָּל־הַחוֹמָה הַפְּרוּצָה
  choice: baute die ganze Mauer wieder auf, die Breschen hatte
  rationale: בנה bezeichnet im Zusammenhang die Wiederherstellung der beschädigten Befestigung. הפרוצה wird konkret als eine Mauer mit Durchbrüchen verstanden; „Breschen“ ist präzise und verständlich.
- source_word: וַיַּעַל עַל־הַמִּגְדָּלוֹת
  choice: Er erhöhte sie bis zu den Türmen
  rationale: Die hebräische Formulierung ist knapp und mehrdeutig. Die Übersetzung nimmt die Mauer aus dem vorherigen Satz als erschlossenes Objekt auf und vermeidet die stärker rekonstruierende Alternative „errichtete Türme darauf“.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: baute außerhalb eine weitere Mauer
  rationale: Der Bauvorgang ist aus dem Kontext zu ergänzen. „Außerhalb“ bewahrt die räumliche Aussage, ohne genauer festzulegen, auf welcher Seite oder in welchem Abstand die zusätzliche Mauer verlief.
- source_word: וַיְחַזֵּק אֶת־הַמִּלּוֹא עִיר דָּוִיד
  choice: befestigte den Millo der Stadt Davids
  rationale: חזק hat im Befestigungskontext den Sinn „verstärken/befestigen“. Der technische Ausdruck מִלּוֹא bleibt transliteriert, weil sein genauer baulicher Bezug unsicher ist.
- source_word: שֶׁלַח
  choice: Waffen
  rationale: Der Ausdruck kann allgemein Waffen oder enger Geschosse beziehungsweise Wurfwaffen bezeichnen. Der Oberbegriff wahrt die lexikalische Breite; die Alternativen stehen in der Fußnote.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung bezeichnet eine sehr große Anzahl und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: וּמָגִנִּים
  choice: und Schilde
  rationale: מָגֵן ist die übliche Bezeichnung für einen Schild; eine engere oder altertümliche Wiedergabe ist nicht erforderlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, wird aber zur besseren Lesbarkeit gegliedert. Die schwierige Wendung zu Mauer und Türmen wird bewusst nicht zu „Türme darauf errichten“ vereindeutigt; „Millo“ bleibt als historischer Fachausdruck erhalten.
