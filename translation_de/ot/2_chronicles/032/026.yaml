  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: de
  text: Doch Hiskia demütigte sich wegen des Hochmuts seines Herzens, ebenso die Einwohner Jerusalems. Daher kam der Zorn Jahwes in den Tagen Hiskias nicht über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: demütigte sich
  rationale: 'Der Nifal wird im Zusammenhang reflexiv bzw. medial verstanden: Hiskia reagiert auf seine Verfehlung, indem er sich selbst demütigt.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: wegen des Hochmuts seines Herzens
  rationale: גֹבַהּ bezeichnet wörtlich »Höhe« oder »Erhabenheit« und meint in Verbindung mit »Herz« inneren Hochmut. Die Präposition בְּ lässt hier eine kausale bzw. bezügliche Deutung zu; die Alternative wird in der Fußnote bewahrt.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: er und die Einwohner Jerusalems
  rationale: Das ausdrückliche Pronomen hebt hervor, dass sowohl Hiskia als auch die Bevölkerung Jerusalems sich demütigten.
- source_word: קֶצֶף יְהוָה
  choice: der Zorn Jahwes
  rationale: קֶצֶף bezeichnet hier den göttlichen Zorn im Zusammenhang mit drohendem Gericht; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: kam ... nicht über sie
  rationale: Die hebräische Wendung בוא על beschreibt, dass etwas – hier göttliches Gericht – über Menschen kommt.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: in den Tagen Hiskias
  rationale: Die traditionelle Zeitangabe bleibt erhalten und bezeichnet Hiskias Lebens- bzw. Regierungszeit, ohne zwischen beiden enger zu entscheiden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Demütigung und ausbleibendem Gericht
  choice: Deshalb kam der Zorn Jahwes ... nicht über sie
  alternative: Und der Zorn Jahwes kam ... nicht über sie
  rationale: Das וְ verbindet im Kontext die Demütigung mit dem Ausbleiben des Gerichts. »Deshalb« macht den naheliegenden Folgezusammenhang verständlich, ohne weitergehende Aussagen über das Verhältnis von Reue und Gnade einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Doch« stellt den Gegensatz zum vorausgehenden Hochmut heraus; »demütigte sich« und »Zorn« bewahren die gewichtige Sprache des Ausgangstextes. Der etwas gehobene Ausdruck »in den Tagen Hiskias« entspricht der biblischen Zeitformel.
