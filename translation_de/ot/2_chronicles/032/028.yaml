  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: de
  text: Vorratshäuser für den Ertrag an Getreide, jungem Wein[a] und Öl, Ställe für alle Arten von Vieh und Pferche für die Herden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Junger Wein“ übersetzt תִירוֹשׁ, einen Ausdruck, der in landwirtschaftlichen Aufzählungen häufig von allgemeineren Wörtern für Wein unterschieden wird.
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch mit „Gehege“ oder „Hürden“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: Vorratshäuser
  rationale: Im Zusammenhang mit landwirtschaftlichen Erzeugnissen bezeichnet das Wort Lagereinrichtungen. „Vorratshäuser“ ist im modernen Deutsch klar und wahrt den konkreten Sinn.
- source_word: תְבוּאַת
  choice: Ertrag an
  rationale: Das Konstrukt bezeichnet den landwirtschaftlichen Ertrag; „Ertrag an“ verbindet sich natürlich mit der folgenden Dreierliste.
- source_word: דָּגָן
  choice: Getreide
  rationale: Übliche und sachlich genaue Bezeichnung für die in solchen Agrarlisten gemeinten Getreideerzeugnisse.
- source_word: תִירוֹשׁ
  choice: junger Wein
  rationale: Die Wiedergabe erhält die lexikalische Unterscheidung von allgemeineren hebräischen Wörtern für Wein, ohne einen unvergorenen Zustand festzulegen.
- source_word: יִצְהָר
  choice: Öl
  rationale: In der festen Agrartriade ist Öl, gewöhnlich Olivenöl, gemeint; „Öl“ entspricht der knappen Form des Hebräischen.
- source_word: אֻרָוֹת
  choice: Ställe
  rationale: Das Wort bezeichnet Unterbringungs- oder Futterplätze für Tiere; „Ställe“ ist hier verständlich und passt zum Vieh.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: für alle Arten von Vieh
  rationale: Die auffällige Wiederholung des Kollektivbegriffs hat distributive Wirkung. Die deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: עֲדָרִים
  choice: Herden
  rationale: Der Ausdruck bezeichnet Tierverbände, häufig Schaf- und Ziegenherden; „Herden“ vermeidet eine unbegründete Einschränkung.
- source_word: אֲוֵרוֹת
  choice: Pferche
  rationale: Gemeint sind eingefriedete Plätze für Herden. „Pferche“ ist im Deutschen präzise und verständlich.
theological_decisions: []
