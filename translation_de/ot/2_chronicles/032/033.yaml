  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: de
  text: Und Hiskia legte sich zu seinen Vätern, und sie begruben ihn im oberen Bereich der Gräber der Söhne Davids.[a] Ganz Juda und die Bewohner Jerusalems erwiesen ihm bei seinem Tod Ehre. Und sein Sohn Manasse wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gräber der Nachkommen Davids“; mit den „Söhnen Davids“ ist hier die davidische Königslinie gemeint.'
    reason: lexikalische Alternative und Erklärung des dynastischen Sprachgebrauchs
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die herkömmliche königliche Todesformel wird als hebräisches Bild bewahrt. „Legte sich“ entspricht dem Verb, während „zu seinen Vätern“ den dynastisch-ancestralen Ausdruck erhält; der anschließende Begräbnissatz macht den Tod eindeutig.
- source_word: וַיִּקְבְּרֻהוּ
  choice: sie begruben ihn
  rationale: Das hebräische Verb steht aktiv in der 3. Person Plural. Die deutsche Wiedergabe bewahrt diese Form, ohne ein nicht genanntes Subjekt zu ergänzen.
- source_word: בְּמַעֲלֵה
  choice: im oberen Bereich
  rationale: מַעֲלֵה kann einen Aufstieg, eine Anhöhe oder einen höher gelegenen Bereich bezeichnen. Die Formulierung gibt den wahrscheinlichen topografischen Sinn wieder, ohne eine bestimmte bauliche Anlage vorauszusetzen.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: der Gräber der Söhne Davids
  rationale: Die wörtliche dynastische Bezeichnung bleibt im Haupttext erhalten; ihr weiterer Sinn als davidische Nachkommenschaft wird in der Fußnote erklärt.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: erwiesen ihm Ehre
  rationale: Dies ist eine natürliche und zugleich würdevolle deutsche Wiedergabe der hebräischen Wendung „ihm Ehre erweisen/tun“.
- source_word: בְּמוֹתוֹ
  choice: bei seinem Tod
  rationale: Die knappe Zeitangabe gibt den commemorativen Zusammenhang präzise wieder.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Ganz Juda und die Bewohner Jerusalems
  rationale: Die Formulierung wahrt den umfassenden öffentlichen Charakter der Ehrung und gibt das substantivierte Partizip natürlich wieder.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: Die deutsche Nachfolgeformel gibt sowohl den Regierungsantritt als auch die dynastische Ablösung klar und idiomatisch wieder.
theological_decisions:
- issue: Todesverhüllende königliche Formel
  choice: Die Wendung „legte sich zu seinen Vätern“ bleibt erhalten.
  alternative: „starb“ oder „entschlief“
  rationale: Die wörtlich-bildhafte Formel schafft literarische Kontinuität mit den Königsberichten. Sie wird nicht auf die bloße Aussage „starb“ reduziert und auch nicht durch „entschlief“ stärker theologisch aufgeladen.
- issue: Bedeutungsumfang von „Söhne Davids“
  choice: „Söhne Davids“ steht im Haupttext; die dynastische Bedeutung wird in einer Fußnote erläutert.
  alternative: „Nachkommen Davids“ im Haupttext
  rationale: So bleibt die konkrete hebräische Ausdrucksweise sichtbar, ohne den kontextuell weiteren Bezug auf die davidische Königslinie zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel wird verständlich, aber nicht modernisierend aufgelöst. Satzbau und Wortwahl bleiben für eine öffentliche Bibellesung gut zugänglich.
