base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: de
  text: Da beteten König Hiskia und der Prophet Jesaja, der Sohn des Amoz, wegen dieser Sache und schrien zum Himmel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Himmeln“; das hebräische Wort steht der Form nach im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Da beteten
  rationale: Das Hitpael von פלל bedeutet gewöhnlich „beten“. Obwohl das hebräische Verb zunächst im Singular steht, umfasst der zusammengesetzte Satzgegenstand Hiskia und Jesaja; das folgende Verb steht ausdrücklich im Plural. Im Deutschen ist daher bei beiden Verben der Plural natürlich.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: König Hiskia
  rationale: Bewahrt Namen und Königstitel in natürlicher deutscher Wortstellung.
- source_word: וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: der Prophet Jesaja, der Sohn des Amoz
  rationale: Erhält sowohl den ausdrücklich genannten Prophetentitel als auch die genealogische Zuordnung.
- source_word: עַל־זֹאת
  choice: wegen dieser Sache
  rationale: על mit dem Demonstrativpronomen bezeichnet hier am ehesten den Anlass des Gebets. Die Formulierung bleibt konkreter als bloßes „deswegen“ und lässt den Bezug auf die vorausgehende Bedrohung offen.
- source_word: וַיִּזְעֲקוּ
  choice: und schrien
  rationale: זעק bezeichnet einen dringlichen Hilferuf; „schrien“ bewahrt dessen Intensität.
- source_word: הַשָּׁמָיִם
  choice: zum Himmel
  rationale: Nach dem Verb des Rufens wird das unmarkierte Ziel im Deutschen idiomatisch mit „zum“ ausgedrückt. „Himmel“ ist im Deutschen die übliche singularische Bezeichnung, während die hebräische Form morphologisch pluralisch ist.
theological_decisions:
- issue: Zielrichtung des Hilferufs in הַשָּׁמָיִם
  choice: zum Himmel
  alternative: zu den Himmeln
  rationale: Die Wendung bezeichnet die Ausrichtung des Hilferufs auf den himmlischen Bereich, ohne eine bestimmte Kosmologie oder zusätzliche Aussage über Gott einzutragen. Der formale Plural bleibt in der Fußnote sichtbar.
- issue: Verhältnis von Gebet und Anlass in עַל־זֹאת
  choice: wegen dieser Sache
  alternative: darüber / in dieser Sache
  rationale: Der Zusammenhang legt einen durch die assyrische Bedrohung veranlassten Hilferuf nahe. Die gewählte Fassung gibt den Anlass wieder, ohne den Inhalt des Gebets näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Appositionen sind klar gegliedert; die Dringlichkeit des Hilferufs und die hebräische Pluralform von „Himmel“ bleiben erhalten.
