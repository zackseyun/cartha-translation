  text: וַ/יַּרְא֙ יְחִזְקִיָּ֔הוּ כִּי בָ֖א סַנְחֵרִ֑יב וּ/פָנָ֕י/ו לַ/מִּלְחָמָ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/002.yaml
  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: de
  text: Als Hiskia sah, dass Sanherib gekommen war und entschlossen war, gegen Jerusalem Krieg zu führen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sein Angesicht war zum Krieg gegen Jerusalem“; damit ist seine feste Absicht gemeint, die Stadt anzugreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Hiskia sah
  rationale: ראה wird in der fortlaufenden Erzählung mit „sah“ wiedergegeben; die Satzstellung mit „als“ ergibt im Deutschen einen natürlichen einleitenden Temporalsatz, während כִּי weiterhin den Inhalt des Wahrnehmens einführt.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Hiskia wahrnahm.
- source_word: בָא
  choice: gekommen war
  rationale: Das Plusquamperfekt macht deutlich, dass Sanheribs Kommen der Wahrnehmung Hiskias vorausging.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: וּפָנָיו
  choice: entschlossen war
  rationale: Wörtlich steht „und sein Angesicht“; zusammen mit לַמִּלְחָמָה bezeichnet die Wendung seine feste kriegerische Absicht. Die idiomatische Bedeutung wird im Text verständlich wiedergegeben, die Bildsprache in der Fußnote bewahrt.
- source_word: לַמִּלְחָמָה
  choice: Krieg zu führen
  rationale: מִלְחָמָה bezeichnet Krieg beziehungsweise Kampf; im Zusammenhang mit der Absicht ist „Krieg zu führen“ natürliches und präzises Deutsch.
- source_word: עַל
  choice: gegen
  rationale: Die Präposition bezeichnet hier die feindliche Ausrichtung auf Jerusalem.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
