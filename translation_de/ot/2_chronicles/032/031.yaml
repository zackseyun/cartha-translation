source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: de
  text: Und ebenso ließ Gott ihn im Fall der Gesandten der Fürsten von Babylon, die zu ihm gesandt worden waren, um sich nach dem Zeichen[a] zu erkundigen, das sich im Land ereignet hatte, allein, um ihn zu prüfen und alles zu erkennen[b], was in seinem Herzen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunderzeichen“ oder „Vorzeichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um alles zu erkennen, was in seinem Herzen war“. Damit bleibt die Spannung der Aussage bestehen; manche verstehen den Sinn als „um offenbar zu machen“ oder „um aufzudecken“, was in seinem Herzen war.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Und ebenso
  rationale: Die Wendung verbindet diesen Fall mit dem vorausgehenden Bericht und führt einen weiteren entsprechenden Umstand ein.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: in der Sache mit den Gesandten … der Fürsten von Babylon
  rationale: מְלִיצִים bezeichnet hier diplomatische Mittelsmänner beziehungsweise Gesandte. Die mit ב eingeleitete Wendung nennt den Anlass oder Bereich, in dem Gott Hiskia allein ließ.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: die die Fürsten von Babylon zu ihm geschickt hatten
  rationale: 'Die hebräische Form ist aktiv und im Plural. Die deutsche Umformung macht die naheliegende Beziehung deutlich: Die Fürsten schickten die genannten Gesandten zu Hiskia. Damit wird die aktive Form stärker berücksichtigt als durch eine rein passive Wiedergabe.'
- source_word: לִדְרֹשׁ
  choice: nach … fragen
  rationale: דרש bezeichnet hier ein gezieltes Erkundigen oder Nachforschen. Im diplomatischen Zusammenhang ist „nach … fragen“ natürlich und verständlich.
- source_word: הַמּוֹפֵת
  choice: das Zeichen
  rationale: מוֹפֵת kann ein Zeichen, Wunderzeichen oder Vorzeichen bezeichnen. „Zeichen“ bewahrt die Bedeutungsbreite; Alternativen stehen in der Fußnote.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: das sich im Land ereignet hatte
  rationale: Die ereignishafte Bedeutung von היה wird im Deutschen natürlich mit „sich ereignen“ ausgedrückt.
- source_word: עֲזָבוֹ הָאֱלֹהִים
  choice: ließ Gott ihn … allein
  rationale: עזב bedeutet verlassen beziehungsweise allein lassen. „Ließ … allein“ wahrt den zeitweiligen, prüfenden Zusammenhang, ohne eine endgültige Verwerfung anzudeuten.
- source_word: לְנַסּוֹתוֹ
  choice: stellte Gott ihn auf die Probe
  rationale: נסה bezeichnet das Prüfen oder Erproben einer Person. Die idiomatische deutsche Wendung gibt diesen Sinn klar wieder.
- source_word: לָדַעַת
  choice: um zu erkennen
  rationale: Die direkte Zweckangabe „um zu erkennen“ bewahrt den Wortlaut und die theologische Spannung des Hebräischen.
- source_word: כָּל בִּלְבָבוֹ
  choice: was alles in seinem Herzen war
  rationale: „Herz“ bezeichnet im hebräischen Sprachgebrauch das innere Denken, Wollen und die Beweggründe. Das deutsche Bild bleibt verständlich und quellennah.
theological_decisions:
- issue: Gottes Prüfung und sein Erkennen des menschlichen Herzens
  choice: So stellte Gott ihn auf die Probe, um zu erkennen, was alles in seinem Herzen war.
  alternative: So stellte Gott ihn auf die Probe, um offenbar zu machen, was alles in seinem Herzen war.
  rationale: Der hebräische Text sagt ausdrücklich „um zu erkennen“. Die Übersetzung behält diese Formulierung und die damit verbundene Spannung bei, statt sie durch „offenbar machen“ oder „aufdecken“ stillschweigend aufzulösen.
- issue: Gott ließ Hiskia allein
  choice: ließ Gott ihn … allein
  alternative: zog Gott sich von ihm zurück / überließ Gott ihn sich selbst
  rationale: Die gewählte Formulierung bleibt nahe bei עזב. „Zog sich zurück“ deutet die Art des göttlichen Handelns näher aus, während „überließ ihn sich selbst“ einen im Ausgangstext nicht ausdrücklich genannten Zusatz einführt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der lange hebräische Satz ist zur besseren Verständlichkeit in drei Sätze gegliedert; die logischen Beziehungen und Zweckangaben bleiben erhalten. „Fürsten“, „Zeichen“, „Herz“ und „auf die Probe stellen“ bewahren den biblischen Ton, ohne altertümlich zu wirken.
