base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: de
  text: 'Danach sandte Sanherib, der König von Assyrien, seine Diener nach Jerusalem, um gegen Hiskia, den König von Juda, und gegen alle Judäer in Jerusalem eine Botschaft auszurichten, während er selbst mit seiner ganzen Macht[a] vor Lachisch lag:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Herrschaft“, „Herrschaftsgewalt“ oder „Macht“ bedeuten. Im militärischen Zusammenhang kann es auch die gesamte ihm unterstehende Streitmacht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Danach
  rationale: Eine natürliche zeitliche Überleitung, die die Abfolge knapp und genau wiedergibt.
- source_word: שָׁלַח
  choice: sandte
  rationale: Entspricht der Grundbedeutung; zusammen mit »ließ ihnen sagen« wird die Satzverknüpfung im Deutschen klar.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Bewahrt die lexikalische Form; im königlichen Zusammenhang können damit Beauftragte oder Hofbeamte gemeint sein.
- source_word: יְרוּשָׁלַיְמָה
  choice: nach Jerusalem
  rationale: Gibt das hebräische Richtungszeichen idiomatisch wieder.
- source_word: וְהוּא עַל לָכִישׁ
  choice: Er selbst lag … vor Lachisch
  rationale: »Vor Lachisch liegen« ist im Deutschen eine natürliche militärische Wendung und erhält die feindliche Stellung, ohne eine ausdrückliche Belagerung in den Text hineinzulesen.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: mit seiner ganzen Streitmacht
  rationale: מֶמְשָׁלָה bezeichnet Herrschaft oder Herrschaftsgewalt; in diesem militärischen Zusammenhang ist konkret die unter seinem Befehl stehende Macht gemeint. Die mögliche weitere Bedeutung wird in der Fußnote offengehalten.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: gegen Hiskia … und gegen alle Judäer
  rationale: Das wiederholte עַל hat hier angesichts des feindlichen Zusammenhangs adversative Bedeutung.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: die sich in Jerusalem befanden
  rationale: Bezieht die Angabe klar auf die Judäer, die damals in Jerusalem waren.
- source_word: לֵאמֹר
  choice: und ließ ihnen sagen
  rationale: Leitet die direkte Rede des folgenden Verses idiomatisch ein und macht deutlich, dass Sanherib durch seine gesandten Diener spricht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzperiode wurde zur besseren Verständlichkeit in drei Sätze gegliedert. »Vor Lachisch liegen« bewahrt den militärischen Sinn von עַל, während »Streitmacht« die kontextuelle Bedeutung von מֶמְשָׁלָה wiedergibt; deren lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
