revisions:
- from: Danach sandte Sanherib, der König von Assyrien, seine Diener nach Jerusalem. Er selbst lag mit seiner ganzen Streitmacht vor Lachisch. Er sandte sie gegen Hiskia, den König von Juda, und gegen alle Judäer, die sich in Jerusalem befanden, und ließ ihnen sagen:[a]
  to: 'Danach sandte Sanherib, der König von Assyrien, seine Diener nach Jerusalem, um gegen Hiskia, den König von Juda, und gegen alle Judäer in Jerusalem eine Botschaft auszurichten, während er selbst mit seiner ganzen Macht[a] vor Lachisch lag:'
  rationale: Die Revision stellt die einmalige Sendung und die Funktion von לֵאמֹר als Einleitung der folgenden Rede klar dar. Sie bewahrt die feindliche Ausrichtung durch „gegen“, die militärische Stellung bei Lachisch durch „vor Lachisch lag“ und die lexikalische Offenheit von מֶמְשַׁלְתּוֹ durch „Macht“ mit gezielter Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Gliederung in drei Sätze und besonders die Wiederaufnahme „Er sandte sie“ lösen die hebräische Konstruktion unnötig auf. „ließ ihnen sagen“ ist zudem referenziell missverständlich und gibt לֵאמֹר nicht treffend wieder: Die Diener sollen die folgende Rede überbringen, nicht den Empfängern etwas sagen lassen. Die militärische Nuance von עַל לָכִישׁ wird mit „vor Lachisch lag“ gut wiedergegeben. Für מֶמְשַׁלְתּוֹ ist „Streitmacht“ als alleinige Textlesart zu eng; „Macht“ erhält die Bedeutung von Herrschaftsgewalt und lässt im Kontext die militärische Konkretisierung zu.'
  naturalness: Die Revision bildet einen flüssigen modernen deutschen Satz. „Mit der Botschaft:“ ist eine idiomatische Einführung der folgenden direkten Rede; „um ... eine Botschaft auszurichten“ macht die Funktion der Gesandten klar, ohne eine zweite Sendung zu behaupten.
  terminology: Sanherib, Hiskia, Assyrien, Juda und Judäer sind konsistent und standardsprachlich. „Diener“ ist für עֲבָדָיו angemessen, ohne die mögliche Bedeutung königlicher Amtsträger einzuengen. Die Fußnote ist an „Macht“ verankert und behandelt ausschließlich die lexikalische Spannweite von מֶמְשָׁלָה.
  issues:
  - severity: medium
    issue: Doppelte Sendung und missverständliches „ließ ihnen sagen“
    rationale: Der hebräische Text hat nur ein Verb für das Senden. לֵאמֹר leitet die folgende Botschaft ein; die Formulierung „ließ ihnen sagen“ kann im Deutschen nahelegen, dass Sanherib den Empfängern etwas sagen ließ, statt dass die Diener die Rede ausrichten sollen.
  - severity: medium
    issue: „Streitmacht“ verengt מֶמְשַׁלְתּוֹ
    rationale: Das Wort bezeichnet primär Herrschaft, Herrschaftsgewalt oder Herrschaftsbereich. Der militärische Kontext ermöglicht zwar die Deutung als die ihm unterstehende Streitmacht, diese sollte aber nicht ohne eine im Text selbst offenere Wiedergabe festgelegt werden.
  - severity: low
    issue: Fußnote erklärt eine ungenaue wörtliche Formulierung
    rationale: לֵאמֹר bedeutet nicht wörtlich „und sprach“, sondern ist die übliche Formel „indem er sagte/mit den Worten“. Die bisherige Anmerkung ist deshalb sprachlich unpräzise und bündelt zwei unabhängige Fragen an einem ungeeigneten Anker.
  revised_text: 'Danach sandte Sanherib, der König von Assyrien, seine Diener nach Jerusalem, um gegen Hiskia, den König von Juda, und gegen alle Judäer in Jerusalem eine Botschaft auszurichten, während er selbst mit seiner ganzen Macht[a] vor Lachisch lag:'
  revised_footnotes:
