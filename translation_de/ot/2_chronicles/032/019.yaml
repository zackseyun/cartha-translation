  terminology: „Gott Jerusalems“, „Götter“, „Völker der Erde“ und „von Menschenhand gemacht“ sind terminologisch passend. Die Formulierung vermeidet eine unnötig konfessionelle Zuspitzung und bewahrt den textlichen Kontrast zwischen dem Gott Jerusalems und menschengemachten Göttern.
