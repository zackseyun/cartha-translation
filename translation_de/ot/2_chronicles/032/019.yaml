id: 2CH.32.19
reference: 2 Chronicles 32:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: de
  text: Und sie redeten gegen den Gott Jerusalems wie gegen die Götter der Völker der Erde, die von Menschenhand gemacht sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Werk der Hände des Menschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: sie redeten
  rationale: דבר im Piel bedeutet hier schlicht »reden«; die feindselige Bedeutung ergibt sich aus Präposition und Kontext.
- source_word: אֶל
  choice: gegen
  rationale: אֶל bedeutet gewöhnlich »zu«, bezeichnet hier im Zusammenhang der Lästerrede aber idiomatisch die feindselige Ausrichtung des Redens.
- source_word: אֱלֹהֵי יְרוּשָׁלִָם
  choice: den Gott Jerusalems
  rationale: Die formal pluralische Konstruktform bezeichnet hier Israels einen Gott und steht im Gegensatz zu den menschengemachten Göttern der Völker.
- source_word: כְּעַל
  choice: wie gegen
  rationale: Die Wiedergabe erhält sowohl den Vergleich als auch die gegen Gott gerichtete Rede.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: die Götter der Völker der Erde
  rationale: אֱלֹהֵי ist hier pluralisch; »Völker der Erde« gibt die breite Bedeutung der Wendung nah am Hebräischen wieder.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: die von Menschenhand gemacht sind
  rationale: Die natürliche deutsche Relativkonstruktion macht deutlich, dass sich die Apposition auf die Götter der Völker bezieht, und bewahrt den Gegensatz zwischen Gott und menschengemachten Göttern.
theological_decisions:
- issue: Ob die Rede »zu« oder »gegen« den Gott Jerusalems gerichtet ist
  choice: gegen
  alternative: zu
  rationale: Der unmittelbare Kontext beschreibt spöttische und lästerliche Rede. »Gegen« gibt diese kontextuelle Kraft idiomatisch wieder, ohne dem Verb selbst zusätzliche Bedeutung aufzubürden.
- issue: Ob אֱלֹהֵי יְרוּשָׁלִָם singularisch oder pluralisch wiederzugeben ist
  choice: der Gott Jerusalems
  alternative: die Götter Jerusalems
  rationale: אֱלֹהִים und seine Konstruktform können Israels einen Gott bezeichnen; der Gegensatz zu den ausdrücklich menschengemachten Göttern verlangt hier den Singular.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Von Menschenhand gemacht« gibt die hebräische Apposition verständlich wieder; der Fußnotenmarker steht unmittelbar nach der zugehörigen Aussage.
