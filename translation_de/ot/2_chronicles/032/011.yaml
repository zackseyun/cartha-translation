base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: de
  text: 'Führt Hiskia euch nicht in die Irre[a], um euch durch Hunger und Durst dem Tod preiszugeben, indem er sagt: »Jahwe, unser Gott, wird uns aus der Hand des Königs von Assyrien retten«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verführt euch Hiskia nicht?« beziehungsweise: »Überredet euch Hiskia nicht?« Das hebräische Verb kann bedeuten, jemanden vom richtigen Weg abzubringen oder ihn zu etwas Falschem zu bewegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Verführt ... nicht?
  rationale: Bewahrt die rhetorische Frage, die Zustimmung erwartet, und ihren anklagenden Ton.
- source_word: מַסִּית
  choice: verführt
  rationale: Das Hifil von סות bezeichnet hier ein Irreführen oder falsches Überreden. »Verführt« lässt diese Bedeutungsbreite bestehen; mögliche Alternativen werden in der Fußnote genannt.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: sodass er euch dem Tod ... preisgibt
  rationale: Gibt die resultative beziehungsweise zweckhafte Verbindung natürlich wieder und bewahrt das Bild, Menschen einem tödlichen Schicksal auszuliefern.
- source_word: בְּרָעָב וּבְצָמָא
  choice: durch Hunger und Durst
  rationale: Die Präposition bezeichnet die Mittel beziehungsweise Umstände des Todes. Im Deutschen ist »durch Hunger und Durst« idiomatisch und passt zur Belagerungslage.
- source_word: לֵאמֹר
  choice: wenn er sagt
  rationale: Führt die zitierte Behauptung Hiskias ein und verbindet sie im Deutschen klar mit dem Vorwurf des Verführens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יַצִּילֵנוּ
  choice: wird uns ... retten
  rationale: Das Hifil von נצל bezeichnet Befreiung oder Rettung aus der Gewalt eines Feindes; »retten« ist im modernen Deutsch natürlich und militärisch wie theologisch offen.
- source_word: מִכַּף מֶלֶךְ אַשּׁוּר
  choice: aus der Hand des Königs von Assyrien
  rationale: Bewahrt die verständliche hebräische Metapher für Macht oder Gewalt und gibt die Status-constructus-Verbindung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussage über Gottes Rettung
  choice: als wörtlich zitierte Behauptung Hiskias innerhalb der assyrischen Anklage
  alternative: als direkte Aussage des Erzählers
  rationale: Die Syntax mit לֵאמֹר kennzeichnet die Worte als von Hiskia berichtete Rede; der Vers selbst bewertet ihre Wahrheit nicht neu, sondern gibt die polemische Darstellung des Sprechers wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe der assyrischen Rede bleibt erhalten. »Preisgeben« ist idiomatisch, ohne den Zweck- beziehungsweise Folgesinn der hebräischen Konstruktion endgültig festzulegen; die ungewöhnliche Doppelung der Mittel wird im Deutschen knapp als »durch Hunger und Durst« wiedergegeben.
