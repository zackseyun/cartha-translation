  terminology: „Jahwe“, „Hiskia“, „Assyrien“, „retten“ und „aus der Hand des Königs“ sind angemessen. „in die Irre führen“ ist für מַסִּית idiomatischer und semantisch weniger missverständlich als „verführen“, das im heutigen Deutsch häufig eine sexuelle Konnotation hat. Die Fußnote bewahrt die lexikalische Spannweite.
