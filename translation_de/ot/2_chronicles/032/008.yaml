  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: de
  text: Bei ihm ist ein Arm aus Fleisch[a], bei uns aber ist Jahwe, unser Gott, um uns zu helfen und unsere Kämpfe zu führen. Da vertraute das Volk auf die Worte Hiskias, des Königs von Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „menschliche Kraft“. Wörtlich steht hier „ein Arm aus Fleisch“ als Bild für bloß menschliche Macht im Gegensatz zu Jahwes Hilfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: bei ihm
  rationale: Bewahrt die Zuordnung und die Parallelität zum folgenden וְעִמָּנוּ („bei uns“).
- source_word: זְרוֹעַ בָּשָׂר
  choice: nur ein Arm aus Fleisch
  rationale: Erhält das hebräische Bild für bloß menschliche Macht; „nur“ verdeutlicht den im Kontext liegenden Gegensatz, ohne die Metapher aufzulösen.
- source_word: וְעִמָּנוּ
  choice: bei uns aber
  rationale: Das adversative „aber“ gibt den deutlichen rhetorischen Gegensatz zwischen menschlicher Macht und Gottes Beistand natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Direkte und natürliche Wiedergabe der hebräischen Bundesformel.
- source_word: לְעָזְרֵנוּ
  choice: um uns zu helfen
  rationale: Gibt den finalen Sinn des Infinitivs mit לְ idiomatisch wieder.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: und unsere Kämpfe zu führen
  rationale: Bewahrt die Verbindung von Verb und stammverwandtem Substantiv in natürlichem Deutsch; „unsere“ gibt das Suffix wieder, ohne ein zusätzliches „für uns“ einzutragen.
- source_word: וַיִּסָּמְכוּ
  choice: Da vertraute
  rationale: Der Stamm סמך bezeichnet bildlich das Sich-Stützen auf etwas und hier das Vertrauen auf Hiskias Zuspruch; „da“ nimmt die erzählerische Folge auf.
- source_word: עַל דִּבְרֵי
  choice: auf die Worte
  rationale: Entspricht der Konstruktion „auf etwas vertrauen“ und bewahrt den Plural von דְּבָרִים.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hiskias, des Königs von Juda
  rationale: Verwendet die geläufige deutsche Namensform und gibt Amt sowie Herrschaftsgebiet vollständig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt dessen Funktion und ersetzt ihn nicht durch einen Titel.
- issue: Gegensatz zwischen menschlicher und göttlicher Hilfe
  choice: „bei uns aber“ sowie „nur ein Arm aus Fleisch“
  alternative: 'rein koordinierend: „und bei uns“'
  rationale: Der Satzbau stellt die begrenzte menschliche Macht des Gegners dem Beistand Jahwes gegenüber. Die deutsche adversative Form macht diese rhetorische Spannung deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher „Arm aus Fleisch“ bleibt im Haupttext erhalten; die sinngemäße Alternative wird in der Fußnote geboten. Der Nachsatz wird als erzählerische Folge formuliert.
