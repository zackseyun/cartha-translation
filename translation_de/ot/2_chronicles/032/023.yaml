source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: de
  text: Und viele brachten eine Opfergabe für Jahwe nach Jerusalem[a] und kostbare Geschenke für Hiskia, den König von Juda[b]. Danach genoss er bei allen Völkern hohes Ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Jerusalem«. Die hebräische Präposition kann hier das Ziel oder den Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ausgesuchte Gaben«; gemeint sind wertvolle Geschenke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: viele
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet viele Menschen, ohne dass »Menschen« ausdrücklich ergänzt werden muss.
- source_word: מְבִיאִים
  choice: brachten
  rationale: Das Partizip beschreibt hier im erzählenden Rückblick ein fortgesetztes oder wiederholtes Bringen; im natürlichen deutschen Erzählstil kann dies knapp mit dem Präteritum wiedergegeben werden.
- source_word: מִנְחָה
  choice: eine Opfergabe
  rationale: Da Jahwe der Empfänger ist, liegt die religiöse Bedeutung »Opfergabe« näher als das sonst mögliche »Tribut«.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als Empfänger beziehungsweise Bestimmungsadressaten der Gabe; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: לִירוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Die Präposition לְ bezeichnet formal die Richtung beziehungsweise das Ziel. Da im Zusammenhang auch ein lokatives Verständnis möglich ist, wird die Alternative in einer Fußnote bewahrt.
- source_word: מִגְדָּנוֹת
  choice: kostbare Geschenke
  rationale: Das Wort bezeichnet wertvolle oder ausgesuchte Gaben. »Kostbare Geschenke« ist natürlich und legt die Art der Gegenstände nicht unnötig fest.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: für Hiskia, den König von Juda
  rationale: Hiskia ist der Empfänger der Geschenke; der Königstitel steht als Apposition.
- source_word: וַיִּנַּשֵּׂא
  choice: genoss er hohes Ansehen
  rationale: Der Niphal bezeichnet hier eine Erhöhung in Rang oder öffentlicher Wertschätzung. Die idiomatische deutsche Formulierung gibt den kontextuellen Sinn wieder, ohne eine körperliche Erhebung nahezulegen.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: bei allen Völkern
  rationale: Die Wendung »in den Augen aller Völker« bezeichnet ihre öffentliche Wahrnehmung und Wertschätzung; »bei allen Völkern« ist dafür natürliches modernes Deutsch.
- source_word: מֵאַחֲרֵי כֵן
  choice: danach
  rationale: Die Wendung markiert die zeitliche Folge nach den zuvor geschilderten Ereignissen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיִּנַּשֵּׂא
  choice: genoss er hohes Ansehen
  alternative: wurde er erhöht
  rationale: Im Zusammenhang der Geschenke und der Wahrnehmung durch die Völker ist eine Erhöhung des Ansehens gemeint. Die Übersetzung vermeidet zugleich die Behauptung, Gott sei ausdrücklich das handelnde Subjekt, da dieses im Satz nicht genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde für natürliche deutsche Lesbarkeit in zwei Hauptsätze gegliedert. Die Richtungs-/Ortsambiguität bei Jerusalem bleibt durch Fußnote [a] erhalten; die semantische Spannweite der Geschenke wird in [b] angezeigt.
