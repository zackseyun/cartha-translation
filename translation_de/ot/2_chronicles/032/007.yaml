  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֣וּ וְ/אַל תֵּחַ֗תּוּ מִ/פְּנֵי֙ מֶ֣לֶךְ אַשּׁ֔וּר וּ/מִ/לִּ/פְנֵ֖י כָּל הֶ/הָמ֣וֹן אֲשֶׁר עִמּ֑/וֹ כִּֽי עִמָּ֥/נוּ רַ֖ב מֵ/עִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: de
  text: Seid stark und mutig! Fürchtet euch nicht und lasst euch nicht entmutigen angesichts des Königs von Assyrien und der ganzen Menge, die bei ihm ist[a]. Denn bei uns ist mehr als bei ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ganzen Streitmacht, die bei ihm ist“. Das hebräische Wort kann hier eine große Menge oder eine Masse von Truppen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn bei uns ist mehr als bei ihm.“ Der knappe Vergleich wird im folgenden Vers näher erklärt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Seid stark und mutig
  rationale: Die beiden pluralischen Imperative bilden eine feste Aufforderungsformel. Die natürliche deutsche Wiedergabe bewahrt sowohl Stärke als auch Mut.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Fürchtet euch nicht und lasst euch nicht entmutigen
  rationale: ירא bezeichnet das Sichfürchten; חתת im Nifal kann Erschrecken, Zerschmettertsein oder Mutlosigkeit ausdrücken. Im Kontext einer militärischen Bedrohung gibt „lasst euch nicht entmutigen“ die Wirkung idiomatisch wieder.
- source_word: מִפְּנֵי ... וּמִלִּפְנֵי
  choice: angesichts ... und
  rationale: Die Wendung bedeutet wörtlich „vor dem Angesicht von“, bezeichnet hier aber den Anlass beziehungsweise die bedrohliche Gegenwart. „Angesichts“ ist im Deutschen natürlich und bewahrt das Bild besser als ein bloß kausales „wegen“.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Direkte und transparente Wiedergabe der hebräischen Genitivverbindung.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: der ganzen Menge, die bei ihm ist
  rationale: הָמוֹן bezeichnet eine große Menge oder ein Gewimmel und kann im militärischen Zusammenhang die Truppenmasse meinen. „Menge“ erhält die lexikalische Breite.
- source_word: כִּי עִמָּנוּ רַב מֵעִמּוֹ
  choice: Denn bei uns ist mehr als bei ihm
  rationale: Die bewusst knappe Form folgt der elliptischen hebräischen Vergleichskonstruktion. Sie vermeidet es, bereits in Vers 7 Personen, Truppen oder göttlichen Beistand ausdrücklich einzusetzen; Vers 8 erläutert den Sinn.
theological_decisions:
- issue: Elliptischer Vergleich im Schlusssatz
  choice: „Bei uns ist mehr als bei ihm“
  alternative: „Mit uns sind mehr als mit ihm“ oder „Der bei uns ist, ist größer als der bei ihm“
  rationale: Das Hebräische nennt das verglichene Subjekt nicht ausdrücklich. Die gewählte Form bewahrt diese Offenheit und greift weder der Erklärung in Vers 8 vor noch übernimmt sie eine aus anderen biblischen Formulierungen bekannte personale Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärische Ermutigungsruf bleibt prägnant; die Ellipse des letzten Satzes wird bewusst erhalten. Alle Fußnotenmarker stehen im Haupttext.
