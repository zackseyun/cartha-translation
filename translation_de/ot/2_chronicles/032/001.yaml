  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: de
  text: Nach diesen Ereignissen und dieser Treue[a] kam Sanherib, der König von Assyrien, nach Juda und drang dort ein. Er schlug sein Lager vor den befestigten Städten auf und beabsichtigte, sie gewaltsam für sich einzunehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und diese Taten der Treue“; das hebräische אֱמֶת kann „Wahrheit“, „Zuverlässigkeit“ oder „Treue“ bedeuten und bezieht sich hier wahrscheinlich auf Hiskias zuvor geschildertes treues Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und er sagte, sie für sich aufzubrechen“. Die hebräische Wendung beschreibt Sanheribs Absicht, die Städte gewaltsam zu öffnen und für sich einzunehmen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Nach diesen Ereignissen
  rationale: דְּבָרִים bezeichnet hier im erzählenden Zusammenhang die zuvor berichteten Vorgänge. „Ereignisse“ ist im modernen Deutschen natürlicher als das wörtliche „Dinge“.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: und dieser Treue
  rationale: אֱמֶת kann „Wahrheit“, „Zuverlässigkeit“ oder „Treue“ bedeuten. Im Rückblick auf Hiskias vorausgehendes Handeln liegt „Treue“ nahe, ohne die lexikalische Alternative zu verschweigen.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sanherib, der König von Assyrien
  rationale: Der Eigenname wird in der etablierten deutschen Form wiedergegeben; der Königstitel wird zur natürlichen deutschen Apposition erweitert.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: kam ... nach Juda und drang dort ein
  rationale: בּוֹא mit ב bezeichnet hier das Eindringen in das Gebiet. Die Formulierung bewahrt sowohl die Bewegungsfolge als auch den feindlichen Einfall.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: Er schlug sein Lager vor den befestigten Städten auf
  rationale: חנה mit עַל beschreibt das Lagern gegen beziehungsweise vor einem Ziel. „Belagerte“ wäre möglich, würde den ausdrücklich genannten Vorgang jedoch stärker ausdeuten.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: und nahm sich vor, in sie einzudringen und sie an sich zu bringen
  rationale: וַיֹּאמֶר bezeichnet hier idiomatisch einen Entschluss. בקע trägt die Vorstellung des Aufbrechens oder gewaltsamen Eindringens; אֵלָיו weist auf den eigenen Vorteil beziehungsweise die Aneignung hin.
