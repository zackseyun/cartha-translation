  naturalness: Modernes Standarddeutsch und der erzählende Registerton sind gelungen. „Sie gewaltsam für sich einzunehmen“ ist im Deutschen flüssiger und präziser als die doppelte Formulierung „in sie einzudringen und sie an sich zu bringen“.
  terminology: „Sanherib“, „Assyrien“, „Juda“ und „befestigte Städte“ sind angemessen. „Treue“ ist im Kontext eine vertretbare Wiedergabe von אֱמֶת; die Fußnote wahrt die lexikalische Bandbreite.
