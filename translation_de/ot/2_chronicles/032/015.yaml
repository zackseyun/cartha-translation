source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: de
  text: 'Und nun: Lasst euch von Hiskia nicht täuschen und lasst euch von ihm nicht auf diese Weise überreden. Glaubt ihm nicht! Denn kein Gott irgendeines Volkes oder Königreichs hat sein Volk aus meiner Hand und aus der Hand meiner Vorfahren retten können.[a] Wie viel weniger wird euer Gott euch aus meiner Hand retten![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hand“ steht hier bildlich für Macht oder Gewalt. Mit den „Vorfahren“ sind die früheren assyrischen Herrscher gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Erst recht wird euer Gott euch nicht aus meiner Hand retten!“ Die hebräische Wendung verstärkt hier die negative Schlussfolgerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den fortführenden und zugleich rhetorisch überleitenden Charakter der Wendung in natürlichem Deutsch.
- source_word: יַשִּׁיא
  choice: täuschen
  rationale: Gibt das Irreführen oder Täuschen direkt wieder und passt zur Anschuldigung gegen Hiskia.
- source_word: יַסִּית
  choice: überreden
  rationale: Bezeichnet hier den Versuch, die Angesprochenen durch Worte zu beeinflussen; „überreden“ hält den Sinn vom vorangehenden „täuschen“ unterscheidbar.
- source_word: כָּזֹאת
  choice: auf diese Weise
  rationale: Bewahrt den demonstrativen Bezug auf die Art beziehungsweise den Inhalt von Hiskias Einflussnahme.
- source_word: תַּאֲמִינוּ לוֹ
  choice: Glaubt ihm nicht
  rationale: Im Kontext geht es darum, ob Hiskias Zusagen für wahr gehalten werden; „glauben“ ist daher präziser als das breitere „vertrauen“.
- source_word: לֹא יוּכַל
  choice: hat ... retten können
  rationale: Das deutsche Perfekt bringt den Rückblick des Sprechers auf angebliche historische Erfahrungen angemessen zum Ausdruck.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: kein Gott irgendeines Volkes oder Königreichs
  rationale: Gibt die umfassende Behauptung über die jeweiligen Götter der Völker und Königreiche klar und idiomatisch wieder.
- source_word: לְהַצִּיל
  choice: retten
  rationale: Passt natürlich zum militärischen Bedrohungskontext und bezeichnet die Befreiung aus feindlicher Gewalt.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: aus meiner Hand und aus der Hand meiner Vorfahren
  rationale: Erhält die wiederholte hebräische Metapher „Hand“ für Macht oder Gewalt; „Vorfahren“ ist im Deutschen weiter und hier passender als „Väter“.
- source_word: אַף כִּי
  choice: Wie viel weniger
  rationale: Bewahrt die argumentative Steigerung des höhnischen Schlusses, ohne sie zu einer bloßen Aussage zu verflachen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die morphologisch plurale Form bezeichnet im Kontext eindeutig den einen Gott Judas beziehungsweise Israels.
theological_decisions:
- issue: Numerus und Bezug von אֱלֹהֵיכֶם
  choice: Singular „euer Gott“ als Bezeichnung für den Gott Judas
  alternative: Formal pluralisch „eure Götter“
  rationale: Obwohl die hebräische Form äußerlich pluralisch ist, wird אֱלֹהִים regelmäßig für den einen Gott Israels gebraucht; der Zusammenhang richtet den Spott gegen diesen Gott.
- issue: Status der Behauptung über die Macht Gottes
  choice: Als direkte höhnische Behauptung des assyrischen Sprechers wiedergegeben
  alternative: Durch erklärende Zusätze theologisch korrigieren oder relativieren
  rationale: Der Vers gibt die Rede des Gegners wieder. Die Spannung zur Erzählperspektive darf nicht durch Zusätze im Haupttext aufgelöst werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die imperativische Dringlichkeit und der höhnische Ton der assyrischen Rede bleiben erhalten. Kurze Satzglieder vermeiden einen schwerfälligen Periodenbau; die Metapher der „Hand“ wird wegen ihrer rhetorischen Wiederholung bewahrt.
