  terminology: „Hiskia“, „Gott“, „retten“ und die beibehaltene Metapher „Hand“ sind terminologisch stimmig. „Vorfahren“ ist für אֲבוֹתַי als Bezug auf frühere Herrscher bzw. dynastische Vorgänger vertretbar; die Fußnote erläutert dies angemessen, ohne den Haupttext unnötig festzulegen.
