  source_fidelity: Der Text gibt die Abfolge der drei negierten Aufforderungen, die universale prahlerische Behauptung über die Götter der Völker und Königreiche, die zweimalige Hand-Metapher sowie den verstärkten negativen Schluss mit אַף כִּי zuverlässig wieder. „Euer Gott“ trifft im Kontext die singuläre Referenz von אֱלֹהֵיכֶם. Die Aussage bleibt erkennbar Teil der höhnischen Feindrede.
