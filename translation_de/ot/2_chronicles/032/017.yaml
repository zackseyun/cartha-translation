  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: de
  text: 'Er schrieb auch Briefe, um Jahwe[a], den Gott Israels, zu verhöhnen und gegen ihn zu reden: »Wie die Götter der Völker der Länder ihr Volk nicht aus meiner Hand retteten, so wird der Gott Hiskias sein Volk nicht aus meiner Hand retten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu schmähen« beziehungsweise »herauszufordern«. Das hebräische Verb bezeichnet beleidigendes, verächtliches oder trotzig herausforderndes Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Er schrieb auch Briefe
  rationale: סְפָרִים bezeichnet hier schriftliche Botschaften; »Briefe« ist im Erzählzusammenhang die natürliche Wiedergabe. Das ו führt die Handlung weiter und wird idiomatisch mit »auch« ausgedrückt.
- source_word: לְחָרֵף
  choice: zu verhöhnen
  rationale: חרף bezeichnet ein schmähendes, beleidigendes oder herausforderndes Reden. »verhöhnen« gibt die feindselige Handlung in natürlichem modernem Deutsch wieder, ohne sie auf bloßen Spott zu verengen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, sodass der im hebräischen Text verwendete Eigenname erkennbar bleibt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Jahwe als den Gott Israels.
- source_word: וְלֵאמֹר עָלָיו
  choice: und gegen ihn zu reden
  rationale: עַל hat in diesem feindseligen Zusammenhang adversative Bedeutung; »gegen ihn reden« bewahrt diese Stoßrichtung.
- source_word: לֵאמֹר
  choice: Darin sagte er
  rationale: Die Formel leitet das Zitat ein. »Darin« macht im Deutschen natürlich deutlich, dass der folgende Wortlaut in den Briefen stand.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Ebenso wie die Götter der Völker in den anderen Ländern
  rationale: כְּ leitet den Vergleich ein. Die Formulierung gibt den Plural הָאֲרָצוֹת wieder und macht den Bezug auf die Länder der zuvor besiegten Völker verständlich; »anderen« ist kontextuell verdeutlichend.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: ihr Volk nicht ... retten konnten
  rationale: נצל im Hifil bedeutet »retten/befreien«. Die Vergangenheitsform entspricht den behaupteten bisherigen Niederlagen; »konnten« bringt die im Spott vorausgesetzte Unfähigkeit idiomatisch zum Ausdruck.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die Wendung bezeichnet Macht oder Gewalt. Das deutsche Bild »aus meiner Hand« bewahrt die hebräische Metapher.
- source_word: כֵּן לֹא יַצִּיל
  choice: wird auch ... nicht ... retten
  rationale: כֵּן bildet den zweiten Teil des Vergleichs. »auch« und die Wiederholung von »retten« erhalten den rhetorischen Parallelismus.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: der Gott Hiskias
  rationale: Die knappe Genitivkonstruktion bewahrt die herabsetzende Einordnung Jahwes als Hiskias Gott innerhalb der Rede des assyrischen Königs.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Das Suffix bezieht sich auf den Gott Hiskias; die mögliche Referenz bleibt wie im Hebräischen durch das Pronomen ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Vers steht ausdrücklich das Tetragramm. »Jahwe« kennzeichnet es als Gottes Eigenname und unterscheidet es von dem Titel »Herr«.
- issue: Spannung zwischen Jahwe und den Göttern der Völker in der zitierten Lästerrede
  choice: Die Gleichsetzung bleibt als Behauptung des Briefschreibers unverändert stehen
  alternative: Die Aussage durch eine erklärende Zurückweisung im Vers relativieren
  rationale: Der hebräische Text zitiert die provokante Behauptung, ohne sie innerhalb dieses Verses kommentierend aufzulösen. Die Übersetzung bewahrt diese erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die zweimalige Wendung »aus meiner Hand retten« bewahrt den rhetorischen Parallelismus. »Jahwe« erhält den Eigennamen; die Fußnote dokumentiert die Bedeutungsbreite von חרף.
