  to: 'Er schrieb auch Briefe, um Jahwe[a], den Gott Israels, zu verhöhnen und gegen ihn zu reden: »Wie die Götter der Völker der Länder ihr Volk nicht aus meiner Hand retteten, so wird der Gott Hiskias sein Volk nicht aus meiner Hand retten.«'
  rationale: Die Revision entfernt die nicht ausgedrückte Einschränkung »anderen« und die modale Erweiterung »konnten«. Sie gestaltet die Einleitung zugleich so, dass die feindselige Aussage gegen Jahwe und das anschließende Zitat enger an der hebräischen Satzführung bleiben. Der Vergleich wird mit dem deutschen Paar »wie … so« klar und ohne Bedeutungsverlust wiedergegeben.
