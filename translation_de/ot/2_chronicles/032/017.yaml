  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend: Sennacherib schrieb Briefe, um Jahwe zu verhöhnen und gegen ihn zu reden; der Vergleich der fremden Götter mit dem Gott Hiskias sowie die Wiederholung von »aus meiner Hand« sind erhalten. Zwei Zusätze gehen jedoch über den hebräischen Wortlaut hinaus: »anderen« ist bei הָאֲרָצוֹת nicht vorhanden, und »retten konnten« macht aus der einfachen Verneinung des Rettens eine ausdrückliche Unfähigkeitsbehauptung.'
