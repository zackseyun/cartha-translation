  terminology: »Jahwe«, »Gott Israels«, »Gott Hiskias«, »verhöhnen« und »aus meiner Hand retten« sind angemessen. Die Fußnote gibt die lexikalische Spannweite von חרף brauchbar wieder; »herauszufordern« ist als mögliche kontextuelle Nuance vertretbar.
