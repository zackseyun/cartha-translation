source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: de
  text: 'Hat nicht Hiskia selbst seine Kulthöhen und seine Altäre beseitigt und zu Juda und Jerusalem gesagt: »Vor einem einzigen Altar sollt ihr euch niederwerfen, und auf ihm sollt ihr Rauchopfer darbringen[a]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und auf ihm sollt ihr Räucherwerk verbrennen«.'
    reason: 'Lexikalische Alternative: קטר kann spezifisch das Verbrennen von Räucherwerk bezeichnen.'
lexical_decisions:
- source_word: הֲלֹא
  choice: Hat nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet, und passt zum vergangenen Geschehen.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: Hiskia selbst
  rationale: Das selbstständige Pronomen vor dem Namen ist emphatisch; „selbst“ gibt diese Hervorhebung natürlich wieder.
- source_word: הֵסִיר
  choice: beseitigt
  rationale: Gibt den Hifil von סור im Zusammenhang mit der Abschaffung von Kultstätten präzise und idiomatisch wieder.
- source_word: בָּמֹתָיו
  choice: seine Kulthöhen
  rationale: „Kulthöhen“ bezeichnet lokale Kultstätten und wahrt den ausdrücklichen Possessivsuffix; die Zuordnung gibt die polemische Sicht des Sprechers wieder.
- source_word: מִזְבְּחֹתָיו
  choice: seine Altäre
  rationale: Bewahrt den hebräischen Possessivsuffix und damit die Perspektive des assyrischen Sprechers.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: und zu Juda und Jerusalem gesagt
  rationale: Natürliches modernes Deutsch; das redundante לֵאמֹר muss neben der anschließenden direkten Rede nicht mit „indem er sagte“ nachgebildet werden.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: Vor einem einzigen Altar
  rationale: „Vor“ bildet לִפְנֵי ab; „einem einzigen“ macht den kontrastiven Zahlbegriff אֶחָד im Vorwurf der Kultzentralisierung deutlich.
- source_word: תִּשְׁתַּחֲווּ
  choice: sollt ihr euch niederwerfen
  rationale: Bewahrt die konkrete körperliche Bedeutung des Verbs, die hier zugleich kultische Verehrung ausdrückt.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: und auf ihm sollt ihr Opfer in Rauch aufgehen lassen
  rationale: קטר kann das Verbrennen von Räucherwerk oder das Aufsteigenlassen von Opfergaben in Rauch bezeichnen; die weitere Formulierung vermeidet eine unnötige Verengung.
theological_decisions:
- issue: Sprecherperspektive bei den Possessivsuffixen an „Kulthöhen“ und „Altären“
  choice: „seine Kulthöhen und seine Altäre“ beibehalten
  alternative: „die Kulthöhen und die Altäre“
  rationale: Die Suffixe sind im Hebräischen ausdrücklich vorhanden. Ihre Wiedergabe bewahrt die polemische Darstellung des assyrischen Sprechers, ohne sie als Urteil des Erzählers zu bestätigen.
- issue: Darstellung der Kultzentralisierung
  choice: Den Befehl mit „einem einzigen Altar“ wiedergeben, ohne Hiskias Reform im Haupttext zu erklären
  alternative: Als ausschließliche Anbetung am Tempelaltar paraphrasieren
  rationale: Der Vers gibt einen gegnerischen Vorwurf wieder. Die Übersetzung soll die Spannung stehen lassen, statt sie im Haupttext theologisch aufzulösen.
- issue: Bedeutungsumfang von קטר
  choice: Im Haupttext allgemein von Opfern sprechen, die in Rauch aufgehen
  alternative: „Räucherwerk verbrennen“
  rationale: Das Verb kann kultisches Rauchopfer beziehungsweise das Verbrennen von Opfergaben bezeichnen. Die allgemeinere Wiedergabe bewahrt die lexikalische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe des assyrischen Sprechers bleibt erhalten. „Kulthöhen“ ist fachlich präzise, aber auch für heutige Leser verständlich; „einem einzigen“ verdeutlicht den im Kontext betonten Gegensatz.
