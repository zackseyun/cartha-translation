  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: de
  text: Und das Haus, das ich baue, wird groß sein[a]; denn unser Gott ist größer als alle Götter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und der Tempel, den ich baue, wird groß sein.“ Hebräisch wörtlich: „das Haus, das ich baue“; gemeint ist das Heiligtum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Denn unser Gott ist groß über allen Göttern.“ Das Hebräische verbindet „groß“ mit der Präposition „als“ in einer Vergleichskonstruktion.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Und das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier das Heiligtum. „Haus“ bewahrt sowohl den hebräischen Wortlaut als auch die Vorstellung vom Haus Gottes; „Tempel“ ist die mögliche kontextuelle Wiedergabe.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: das ich baue
  rationale: Das Partizip בוֹנֶה bezeichnet das gegenwärtig betriebene oder unmittelbar anstehende Bauen. Die deutsche Präsensform ist natürlich und lässt diese aspektuelle Weite bestehen.
- source_word: גָּדוֹל
  choice: wird groß sein
  rationale: Das Adjektiv umfasst räumliche Größe sowie Bedeutung und Rang. Wegen des auf das Bauvorhaben bezogenen Zusammenhangs wird der hebräische Nominalsatz im Deutschen idiomatisch zukunftsbezogen wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Größe des Hauses ein. „Denn“ gibt diesen Zusammenhang in würdigem, gegenwärtigem Deutsch wieder.
- source_word: גָדוֹל אֱלֹהֵינוּ מִכָּל הָאֱלֹהִים
  choice: unser Gott ist größer als alle Götter
  rationale: Obwohl גָדוֹל keine eigene Komparativform trägt, bildet die Verbindung mit מִן einen Vergleich. „Größer als“ ist dafür die natürliche deutsche Formulierung.
- source_word: הָאֱלֹהִים
  choice: Götter
  rationale: Im Vergleich bezeichnet אֱלֹהִים andere Gottheiten beziehungsweise als Götter bezeichnete Wesen. „Götter“ bewahrt die offene, polemische Aussage des Textes, ohne sie als Götzen, falsche Götter oder Himmelswesen näher zu bestimmen.
theological_decisions:
- issue: Vergleich des Gottes Israels mit anderen Göttern
  choice: unser Gott ist größer als alle Götter
  alternative: unser Gott ist groß über alle Götter
  rationale: Die Übersetzung gibt die durch גָדוֹל mit מִן ausgedrückte Überordnung als idiomatischen Vergleich wieder. Sie erklärt nicht zusätzlich, welchen ontologischen Status die „Götter“ haben, und bewahrt damit die theologische Spannung des Ausgangstextes.
- issue: Bezeichnung des Heiligtums
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ erhält die konkrete und theologisch bedeutsame Ausdrucksweise des Hebräischen. Die Fußnote nennt „Tempel“ als kontextuell eindeutige Alternative, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. „Haus“ hält sich eng an die Bildsprache des Hebräischen; „wird groß sein“ und „größer als“ sorgen zugleich für natürliche deutsche Syntax.
