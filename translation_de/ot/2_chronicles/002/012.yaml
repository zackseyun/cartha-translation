source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: de
  text: Und nun habe ich einen weisen Mann gesandt, der Einsicht besitzt, Huram-Abi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Huram-Abi. Der zweite Namensbestandteil bedeutet wörtlich »mein Vater«, ist hier aber wahrscheinlich ein Ehrentitel oder Teil der Bezeichnung des Kunsthandwerkers; vergleiche auch »Huram, sein Vater« in 2. Chronik 4,16.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb führt den nächsten Schritt in der Antwort des Königs ein und bewahrt den fortlaufenden Zusammenhang.
- source_word: שָׁלַחְתִּי
  choice: habe ich … gesandt
  rationale: Das hebräische Perfekt bezeichnet hier eine vollzogene Sendung mit gegenwärtiger Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: אִישׁ חָכָם
  choice: einen weisen Mann
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann; חָכָם bedeutet grundsätzlich „weise“, kann im handwerklichen Zusammenhang jedoch auch besondere Befähigung einschließen.
- source_word: יוֹדֵעַ בִּינָה
  choice: der Einsicht besitzt
  rationale: Die Wiedergabe bewahrt die eigenständige Aussage über Einsicht und vermeidet die unnatürliche wörtliche Formulierung „Einsicht kennt“; im Kontext schließt sie praktische Sachkunde ein.
- source_word: לְחוּרָם אָבִי
  choice: Huram-Abi
  rationale: Die schwierige Wendung dient hier wahrscheinlich als Name oder ehrende Bezeichnung des Kunsthandwerkers. Die Transliteration bewahrt diese Offenheit, ohne eine leibliche Vaterbeziehung oder eine bestimmte Amtsbezeichnung festzulegen.
theological_decisions:
- issue: Bedeutung von אָבִי in der Bezeichnung לְחוּרָם אָבִי
  choice: 'Als Bestandteil des Namens oder der Ehrenbezeichnung wiedergegeben: „Huram-Abi“'
  alternative: „Huram, mein Vater“ oder „Huram, mein Meister“
  rationale: אָבִי bedeutet wörtlich „mein Vater“, kann aber auch ehrend für einen Meister, Ratgeber oder hochgestellten Amtsträger gebraucht werden. Da der Kontext keine leibliche Verwandtschaft nahelegt und die genaue Funktion offenbleibt, erhält die Transliteration die Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und gut verständlich; „Einsicht besitzt“ bewahrt die kognitive Aussage des Hebräischen, ohne dessen handwerklichen Kontext auszuschließen.
