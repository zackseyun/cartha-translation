  naturalness: Die Sprache ist überwiegend modernes, würdiges Deutsch. „Er versteht sich darauf“ ist idiomatisch, erzeugt hier aber gerade die nicht gedeckte Referenzfestlegung. Eine Satzfügung mit „dessen Vater, ein Tyrer, kundig war“ bildet die hebräische Anschlussstelle natürlicher und enger ab.
  terminology: „Tyrer“, „Bronze“, „Karmesin“, „Gravuren“ und „mein Herr David“ sind angemessen. „Kunsthandwerker“ ist im Bau- und Kunsthandwerkskontext für חכמים plausibel. „Blauer Purpur“ bewahrt die Unterscheidung von אַרְגָּמָן und תְּכֵלֶת; die genaue Farbnuance wird nicht überbestimmt.
