source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: de
  text: Ein Sohn einer Frau aus den Töchtern Dans[a], dessen Vater ein Tyrer war, kundig darin, Gold und Silber, Bronze und Eisen, Stein und Holz, Purpur, blauen Purpur, feines Leinen und Karmesin[b] zu verarbeiten, jede Art von Gravur auszuführen und jeden Entwurf zu gestalten, der ihm aufgetragen wird, zusammen mit deinen Kunsthandwerkern und den Kunsthandwerkern meines Herrn David, deines Vaters.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aus den Töchtern Dans“ bedeutet wahrscheinlich, dass seine Mutter aus dem Stamm Dan stammte.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Scharlach“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort für „kundig“ steht unmittelbar nach der Angabe über den tyrischen Vater und kann sich grammatisch auf ihn beziehen; im weiteren Zusammenhang wird der genannte Sohn als Kunsthandwerker vorgestellt.
    reason: ambiguity_note
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: der Sohn einer Frau aus den Töchtern Dans
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Abstammungsformel. „Aus den Töchtern Dans“ bezeichnet wahrscheinlich die Zugehörigkeit der Mutter zum Stamm Dan, ohne diese Deutung in den Haupttext einzutragen.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: Sein Vater war ein Tyrer
  rationale: צֹרִי bezeichnet einen Mann aus Tyrus. „Ein Tyrer“ ist im heutigen Deutsch knapp, natürlich und geografisch eindeutig.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: Er versteht sich darauf, … zu verarbeiten
  rationale: Die Verbindung bezeichnet praktisches Können und handwerkliche Erfahrung, nicht bloß theoretisches Wissen.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: Gold und Silber, Bronze und Eisen, Stein und Holz zu verarbeiten
  rationale: Die Präposition ב bezeichnet hier die Werkstoffe. „Verarbeiten“ verbindet die Materialliste idiomatisch mit der handwerklichen Fähigkeit.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: Purpur, blauen Purpur, feines Leinen und Karmesin
  rationale: Die Farbstoff- beziehungsweise Textilbezeichnungen werden verständlich und zugleich unterscheidbar wiedergegeben. תְּכֵלֶת bezeichnet einen blauen bis blauvioletten Purpurfarbstoff; כַּרְמִיל einen kräftig roten Farbstoff beziehungsweise so gefärbtes Material.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: Gravuren jeder Art auszuführen
  rationale: Das hebräische Wortspiel aus Verb und verwandtem Substantiv betont die Fähigkeit zu eingravierter oder eingeschnittener Arbeit. Im Deutschen vermeidet „Gravuren … auszuführen“ eine schwerfällige Wiederholung.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: Entwürfe jeder Art zu gestalten
  rationale: חשב bezeichnet im kunsthandwerklichen Zusammenhang das Planen und Gestalten kunstvoller Arbeiten, nicht lediglich abstraktes Denken.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: die ihm aufgetragen werden
  rationale: Wörtlich heißt es „die ihm gegeben werden“. Im Zusammenhang mit auszuführenden Entwürfen gibt „aufgetragen“ den gemeinten Arbeitsauftrag natürlich wieder.
- source_word: חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: deinen Kunsthandwerkern und den Kunsthandwerkern meines Herrn David, deines Vaters
  rationale: חכמים bezeichnet hier aufgrund des handwerklichen Zusammenhangs fachkundige Kunsthandwerker. אֲדֹנִי ist eine respektvolle Anrede für den menschlichen Herrn David.
theological_decisions:
- issue: Bezug von יוֹדֵעַ („kundig/vertraut“)
  choice: Ein neuer Satz mit „Er“ bezieht die handwerkliche Befähigung auf den entsandten Kunsthandwerker, den Sohn der Daniterin.
  alternative: Das Partizip unmittelbar auf den zuvor genannten tyrischen Vater beziehen.
  rationale: Die Wortstellung lässt formal einen Bezug auf den Vater erwägen. Der größere Zusammenhang stellt jedoch den entsandten Sohn als den vielseitig befähigten Kunsthandwerker vor; die Satzgliederung macht diesen Diskursbezug deutlich, während eine Fußnote die grammatische Nähe zum Vater offenlegt.
- issue: Wiedergabe von חֲכָמֶיךָ als Personenbezeichnung
  choice: Kunsthandwerker
  alternative: Weise; kundige Männer
  rationale: Im unmittelbaren Kontext geht es um fachliche Zusammenarbeit bei Kunst- und Bauarbeiten. „Kunsthandwerker“ gibt die kontextuelle Bedeutung wieder, ohne eine Aussage über geistliche Weisheit einzutragen.
- issue: Höflichkeitstitel אֲדֹנִי
  choice: mein Herr David
  alternative: mein Gebieter David
  rationale: Der Ausdruck ist hier ein menschlicher höfischer Ehrentitel und keine Gottesbezeichnung. „Mein Herr“ bewahrt die respektvolle Anrede in natürlichem Deutsch.
translation_notes:
  register: Moderne, würdige Standardsprache mit handwerklich präzisem Wortschatz. Der Vers setzt syntaktisch die Vorstellung des in Vers 12 genannten Kunsthandwerkers fort; deshalb beginnt die Übersetzung entsprechend fragmentarisch mit „der Sohn“. Die misszugeordneten Fußnotenmarker der englischen Konsultationsschicht wurden nach ihrem Inhalt berichtigt und um eine Ambiguitätsnote ergänzt.
