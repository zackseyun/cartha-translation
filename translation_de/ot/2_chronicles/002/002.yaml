revisions:
- from: 'Da ließ Salomo Huram, dem König von Tyrus,[a] sagen: »Wie du an meinem Vater David gehandelt und ihm Zedernholz geschickt hast, damit er sich ein Haus baute, in dem er wohnen konnte …[b]«'
  to: 'Da ließ Salomo Huram, dem König von Tyrus,[a] sagen: »Wie du mit meinem Vater David gehandelt und ihm Zedernholz geschickt hast, um sich ein Haus zum Wohnen zu bauen …[b]«'
  rationale: Die Revision ersetzt die im modernen Deutsch missverständliche Verbindung „an ... gehandelt“ durch „mit ... gehandelt“ und entfernt die nicht ausgedrückte Modalität in „wohnen konnte“. Das offene Satzende, die Namen und die vorhandenen Fußnoten bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:06:01Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf bewahrt zutreffend die chronologische Erzählfortführung, die chronistische Namensform „Huram“, den Titel „König von Tyrus“ sowie die im Hebräischen über den Vers hinaus offene Vergleichskonstruktion. Die offene Wiedergabe mit Auslassungszeichen ist gegenüber einer Ergänzung wie „so handle auch an mir“ quellentreuer. Allerdings ist „an meinem Vater David gehandelt“ im heutigen Deutsch nicht die passende idiomatische Entsprechung von עָשָׂה עִם und kann unerwünscht negativ klingen. Ferner fügt „wohnen konnte“ eine Möglichkeit/יכולת hinzu, die לָשֶׁבֶת בּוֹ nicht ausdrückt.
  naturalness: „ließ Salomo Huram ... sagen“ ist verständlich und als Botenformel möglich. „Wie du mit meinem Vater David gehandelt hast“ ist jedoch deutlich natürlicher als „an meinem Vater David gehandelt hast“. Die zweifache Zweckangabe lässt sich ohne den modalen Zusatz „konnte“ idiomatisch als „um sich ein Haus zum Wohnen zu bauen“ wiedergeben.
  terminology: „Salomo“, „Huram“, „Tyrus“ und „Zedernholz“ sind angemessen. Die Fußnote zur abweichenden, aus den Königsbüchern vertrauten Namensform Hiram ist sachlich und korrekt.
  issues:
  - severity: medium
    issue: „an meinem Vater David gehandelt“
    rationale: Die deutsche Verbindung „an jemandem handeln“ ist hier unidiomatisch und kann eine Handlung zu dessen Nachteil nahelegen. Das hebräische עשה עם ist mit „mit jemandem handeln“ bzw. kontextuell „jemandem gegenüber handeln“ wiederzugeben.
  - severity: low
    issue: „in dem er wohnen konnte“
    rationale: „konnte“ bringt eine im Hebräischen nicht vorhandene Modalität ein. Der Infinitiv לָשֶׁבֶת bezeichnet den Wohnzweck des Hauses.
