base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: de
  text: 'Da ließ Salomo Huram, dem König von Tyrus,[a] sagen: »Wie du mit meinem Vater David gehandelt und ihm Zedernholz geschickt hast, um sich ein Haus zum Wohnen zu bauen …[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huram ist die hebräische Namensform an dieser Stelle; im parallelen Bericht der Königsbücher steht gewöhnlich Hiram.
    reason: alternative_reading
  - marker: b
    text: Der hebräische Satz bleibt am Versende offen und wird im folgenden Vers fortgeführt.
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: Da ließ Salomo … sagen
  rationale: Die deutsche Botenformel gibt das Senden einer Mitteilung natürlich wieder; „Da“ führt die Erzählung entsprechend dem narrativen וַ weiter.
- source_word: חוּרָם
  choice: Huram
  rationale: Die Namensform folgt unmittelbar der in der Chronik überlieferten hebräischen Form חוּרָם; die geläufigere Parallelform „Hiram“ wird in einer Fußnote genannt.
- source_word: מֶלֶךְ צֹר
  choice: dem König von Tyrus
  rationale: Die Apposition bezeichnet Hurams Herrschertitel und Herrschaftsort; „Tyrus“ ist die etablierte deutsche Namensform.
- source_word: כַּאֲשֶׁר עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: Wie du an meinem Vater David gehandelt hast
  rationale: עשה עם bezeichnet hier ein Handeln gegenüber einer Person. „an … gehandelt“ wahrt die Weite der Wendung, die durch den folgenden Satzteil näher bestimmt wird.
- source_word: אֲרָזִים
  choice: Zedernholz
  rationale: Der Plural „Zedern“ bezeichnet im Bauzusammenhang das gelieferte Bauholz. „Zedernholz“ ist im modernen Deutschen klarer, ohne eine bestimmte Form wie Balken oder Stämme hinzuzufügen.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: damit er sich ein Haus baute
  rationale: Die Formulierung bringt sowohl den Zweck als auch David als Nutznießer des Baus zum Ausdruck.
- source_word: לָשֶׁבֶת בּוֹ
  choice: in dem er wohnen konnte
  rationale: ישב bedeutet hier „wohnen“. Die Wiedergabe verbindet den Wohnzweck idiomatisch mit dem Haus.
- source_word: Versende nach לָשֶׁבֶת בּוֹ
  choice: …
  rationale: Der hebräische Vers endet mit einem noch nicht abgeschlossenen Vergleichssatz. Die Auslassungspunkte bewahren diesen Anschluss an den folgenden Vers, statt einen im Ausgangstext nicht vorhandenen Nachsatz einzufügen.
theological_decisions:
- issue: Nicht ausdrücklich formulierter Nachsatz zum mit כַּאֲשֶׁר eingeleiteten Vergleich
  choice: Den Satz am Versende offenlassen und mit Auslassungspunkten kennzeichnen
  alternative: „So handle auch an mir“ ergänzen
  rationale: Der masoretische Text enthält in diesem Vers keinen solchen Nachsatz; der Gedankengang wird im folgenden Vers fortgeführt. Die offene Form bewahrt die Syntax und vermeidet eine harmonisierende Ergänzung aus der Parallelüberlieferung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Botenformel „ließ … sagen“ bleibt gut verständlich. Das syntaktisch offene Versende des Hebräischen wird sichtbar bewahrt; eine aus dem Zusammenhang erschlossene Bitte wird nicht in Vers 2 eingefügt.
