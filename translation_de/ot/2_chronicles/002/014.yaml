source:
  edition: WLC
  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: de
  text: Und nun sende mein Herr seinen Dienern den Weizen und die Gerste, das Öl[a] und den Wein, von denen er gesprochen hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Öl“ ist in diesem Zusammenhang wahrscheinlich Olivenöl gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die er erwähnt hat“. Das Hebräische sagt nicht ausdrücklich: „die er versprochen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von ו als auch die Funktion von עתה als Übergang zur konkreten Bitte.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: den Weizen und die Gerste
  rationale: Natürliche deutsche Stoffbezeichnungen; die bestimmten Artikel geben die im Hebräischen bezeichneten, bereits besprochenen Liefergüter wieder.
- source_word: הַשֶּׁמֶן
  choice: das Öl
  rationale: Gibt den allgemeinen hebräischen Ausdruck wieder, ohne ihn im Haupttext vorschnell auf Olivenöl einzuengen.
- source_word: וְהַיַּיִן
  choice: und den Wein
  rationale: Direkte und idiomatische Wiedergabe des genannten Versorgungsguts.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Höfliche Anrede Hurams an Salomo; die Formulierung bezeichnet hier einen menschlichen Ranghöheren, nicht Gott.
- source_word: יִשְׁלַח
  choice: sende
  rationale: Der Jussivcharakter des Yiqtol wird als höfliche Aufforderung wiedergegeben.
- source_word: לַעֲבָדָיו
  choice: seinen Dienern
  rationale: Die Formulierung bildet Präposition, Substantiv und Possessivsuffix eng ab; im Zusammenhang sind Hurams Arbeiter beziehungsweise Bedienstete gemeint.
- source_word: אֲשֶׁר אָמַר
  choice: von denen er gesprochen hat
  rationale: Bezieht den Relativsatz natürlich auf die aufgezählten Güter und vermeidet die stärkere, vom Verb אמר nicht geforderte Bedeutung „versprochen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der höfische Ton der Bitte bleibt durch „mein Herr“ und den Aufforderungskonjunktiv „sende“ erhalten. Die Fußnotenmarker [a] und [b] stehen jeweils an der sachlich passenden Stelle im Haupttext.
