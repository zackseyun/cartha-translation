revisions:
- from: Und siehe, den Holzfällern, die die Bäume schlagen, gebe ich für deine Diener 20.000 Kor Weizen als Nahrung[a], 20.000 Kor Gerste, 20.000 Bat Wein und 20.000 Bat Öl.[b]
  to: Und siehe, deinen Dienern, den Holzfällern, die die Bäume fällen, habe ich 20.000 Kor zerstoßenen Weizen[a], 20.000 Kor Gerste, 20.000 Bat Wein und 20.000 Bat Öl gegeben.[b]
  rationale: Die schwierige Wendung für den Weizen wird im Haupttext näher am hebräischen Wortlaut wiedergegeben und ihre Alternativen werden in der Fußnote erhalten. Die Umstellung verbindet die Holzfäller eindeutig mit den Dienern des Adressaten und bewahrt zugleich die doppelte hebräische Bezeichnung für die Arbeiter. Mengen, Einheiten und alle vier Versorgungsgüter bleiben unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:06:03Z'
review_pass:
  verdict: revise
  source_fidelity: Die vorliegende Fassung gibt die Mengen, Güter und Maße korrekt wieder. Doch die Satzgliederung trennt „den Holzfällern“ und „deine Diener“ unnötig voneinander und lässt „für deine Diener“ wie einen zusätzlichen Zweck neben den Holzfällern erscheinen. Im Hebräischen sind die Arbeiter als „deine Diener“ näher bestimmt. Außerdem ist „Weizen als Nahrung“ eine interpretierende Harmonisierung mit dem Paralleltext und nicht die sicherste Wiedergabe der schwierigen Wendung חִטִּים מַכּוֹת.
  naturalness: Die Revision bleibt modernes, würdiges Standarddeutsch. „Den Holzfällern, die die Bäume fällen“ ist zwar bewusst leicht redundant, gibt aber die zwei nahezu synonymen hebräischen Ausdrücke verständlich wieder. Das Perfekt „habe ich ... gegeben“ entspricht der im Briefkontext formulierten geleisteten bzw. verbindlich zugesagten Bereitstellung.
  terminology: „Kor“ und „Bat“ sind als nicht umgerechnete antike Maße angemessen. „Zerstoßener Weizen“ gibt die übliche, jedoch nicht völlig sichere Deutung von מַכּוֹת direkter wieder; die Fußnote bewahrt die verbleibende lexikalische Unsicherheit.
  issues:
  - severity: medium
    issue: „Weizen als Nahrung“ ist im Haupttext zu interpretierend.
    rationale: Die ungewöhnliche hebräische Wendung lautet wörtlich etwa „geschlagener/zerstoßener Weizen“. Die Bedeutung „als Nahrung“ wird teils unter Einfluss des Paralleltexts vertreten, ist aber nicht die explizite Aussage dieses Wortlauts und sollte nicht ohne Kennzeichnung die Hauptübersetzung bestimmen.
  - severity: medium
    issue: Die Zuordnung von Holzfällern und „deinen Dienern“ ist syntaktisch missverständlich.
    rationale: Die Fassung „den Holzfällern ... gebe ich für deine Diener“ kann zwei verschiedene Empfänger- bzw. Bezugsgruppen nahelegen. Die Revision macht deutlich, dass die Holzfäller die Diener des Adressaten sind.
  revised_text: Und siehe, deinen Dienern, den Holzfällern, die die Bäume fällen, habe ich 20.000 Kor zerstoßenen Weizen[a], 20.000 Kor Gerste, 20.000 Bat Wein und 20.000 Bat Öl gegeben.[b]
