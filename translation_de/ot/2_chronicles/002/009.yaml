base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: de
  text: Und siehe, deinen Dienern, den Holzfällern, die die Bäume fällen, habe ich 20.000 Kor zerstoßenen Weizen[a], 20.000 Kor Gerste, 20.000 Bat Wein und 20.000 Bat Öl gegeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche hebräische Wendung kann auch „Weizen als Nahrung“ oder „geschlagenen Weizen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Kor ist ein antikes Trockenmaß, Bat ein antikes Flüssigkeitsmaß. Ihre genaue Größe lässt sich nicht sicher bestimmen.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt sowohl die hebräische Verknüpfung als auch das aufmerksamkeitslenkende הִנֵּה in einer würdevollen, im Bibelstil verständlichen Form.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: den Holzfällern, die die Bäume schlagen
  rationale: Gibt beide nahezu synonymen Partizipialausdrücke wieder, formuliert ihre Apposition im Deutschen jedoch als Relativsatz, damit der Satz natürlich verständlich bleibt.
- source_word: נָתַתִּי
  choice: gebe ich
  rationale: Das hebräische Perfekt kann im Briefkontext eine verbindlich zugesagte Bereitstellung ausdrücken. Das deutsche Präsens gibt diese gegenwärtig geltende Zusage natürlicher wieder als ein missverständliches Perfekt.
- source_word: חִטִּים מַכּוֹת
  choice: Weizen als Nahrung
  rationale: מַכּוֹת ist in dieser ungewöhnlichen Verbindung textlich und lexikalisch unsicher. Die Wiedergabe folgt der im Paralleltext 1 Könige 5,25 bezeugten Versorgung mit Nahrung, ohne die mögliche Bedeutung ‚zerstoßener Weizen‘ zu verschweigen.
- source_word: לַעֲבָדֶיךָ
  choice: für deine Diener
  rationale: Das zweite ל wird als Nutznießerangabe verstanden. ‚Diener‘ wahrt die Grundbedeutung von עֲבָדִים, obwohl hier Arbeitskräfte gemeint sind.
- source_word: כֹּרִים
  choice: Kor
  rationale: Die antike Trockenmaßeinheit wird transliteriert, weil eine Umrechnung in moderne Maße unsicher wäre; im Deutschen bleibt der Einheitenname nach der Zahl unverändert.
- source_word: בַּתִּים
  choice: Bat
  rationale: Die antike Flüssigmaßeinheit wird transliteriert; im Deutschen bleibt der Einheitenname nach der Zahl unverändert.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und kontextgemäße Wiedergabe.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Bewahrt die allgemeine Bezeichnung des Hebräischen und fügt nicht ausdrücklich ‚Olivenöl‘ hinzu.
- source_word: עֶשְׂרִים אֶלֶף
  choice: '20.000'
  rationale: Die Mengenangabe wird bei allen vier Versorgungsgütern genau beibehalten und nach moderner deutscher Schreibkonvention dargestellt.
