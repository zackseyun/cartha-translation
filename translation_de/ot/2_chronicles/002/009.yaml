  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „Und siehe“ erhält den Diskursmarker des Hebräischen; ansonsten ist der Satz für heutige Leser syntaktisch geglättet. Die Maßeinheiten werden nicht spekulativ umgerechnet.
