source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: de
  text: Doch wer hat die Kraft, ihm ein Haus zu bauen? Denn die Himmel, ja die höchsten Himmel[a], können ihn nicht fassen. Und wer bin ich, dass ich ihm ein Haus bauen sollte – außer um vor ihm Rauchopfer darzubringen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Himmel und die Himmel der Himmel“; eine steigernde Wendung für die höchsten Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um vor ihm Räucherwerk zu verbrennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: hat die Kraft
  rationale: Die Verbindung bezeichnet ausreichende Kraft oder Fähigkeit. „Hat die Kraft“ gibt die rhetorische Frage natürlich wieder, ohne sie auf bloßes technisches Können zu verengen.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ihm ein Haus zu bauen
  rationale: בַּיִת bedeutet wörtlich „Haus“. Der Kontext macht den Tempelbau deutlich; „Haus“ bewahrt jedoch die Bildsprache des Hebräischen.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: der Himmel und der höchste Himmel
  rationale: Die wörtliche Wendung „der Himmel und die Himmel der Himmel“ ist eine steigernde Konstruktion. Die gewählte Fassung erhält die Zweigliedrigkeit und gibt die Steigerung verständlich wieder.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: können ihn nicht fassen
  rationale: Das Verb bezeichnet hier, dass selbst die Himmel Gott nicht aufnehmen oder enthalten können. „Nicht fassen“ ist im Deutschen natürlich und wahrt sowohl die räumliche Aussage als auch den Gedanken göttlicher Unermesslichkeit.
- source_word: וּמִי אֲנִי
  choice: Und wer bin ich
  rationale: Die schlichte Konjunktion und die demütige rhetorische Frage werden unmittelbar beibehalten.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: dass ich ihm ein Haus bauen sollte
  rationale: „Sollte“ bringt im Deutschen die in der Frage ausgedrückte Unangemessenheit und Demut besser zum Ausdruck als ein bloßes Futur.
- source_word: כִּי אִם
  choice: außer um
  rationale: 'Die Wendung schränkt den Zweck des Hauses ein: Es kann Gott nicht fassen, sondern dient dem Gottesdienst vor ihm.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: vor ihm Rauchopfer darzubringen
  rationale: הקטיר bezeichnet das Aufsteigenlassen einer Opfergabe im Rauch und kann je nach Kontext besonders auf Räucherwerk bezogen werden. „Rauchopfer darzubringen“ bewahrt die kultische Bedeutungsbreite; die engere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Gottes Transzendenz und seine Beziehung zum Tempel
  choice: Das Haus wird nicht als Behältnis Gottes dargestellt, sondern als Ort, an dem vor ihm geopfert wird.
  alternative: Das Haus als Wohnort, der Gott räumlich in sich fasst.
  rationale: Die ausdrückliche Aussage, dass selbst der höchste Himmel Gott nicht fassen kann, bestimmt das Verständnis des Hauses. Zugleich bleibt durch „vor ihm“ seine reale Beziehung zum dort vollzogenen Gottesdienst erhalten.
- issue: Bedeutungsumfang von לְהַקְטִיר
  choice: „Rauchopfer darzubringen“ im Haupttext
  alternative: „Räucherwerk zu verbrennen“
  rationale: Das hebräische Verb kann allgemein das Aufsteigenlassen einer Opfergabe im Rauch bezeichnen und wird häufig für Räucherwerk gebraucht. Da kein Gegenstand ausdrücklich genannt ist, vermeidet der Haupttext eine unnötige Verengung und dokumentiert die geläufige engere Deutung in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen und das Tempelbild „Haus“ bleiben erhalten. „Rauchopfer darbringen“ ist kultisch präzise, aber noch allgemein verständlich; eine geläufigere, engere Wiedergabe steht in der Fußnote.
