  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: de
  text: Siehe, ich baue ein Haus[a] für den Namen Jahwes, meines Gottes, um es ihm zu weihen, vor ihm wohlriechendes Räucherwerk zu verbrennen, die Brote regelmäßig auszulegen und Brandopfer darzubringen, und zwar morgens und abends, an den Sabbaten, an den Neumonden und zu den Festzeiten Jahwes, unseres Gottes. Dies ist Israel für immer auferlegt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit dem „Haus“ ist der Tempel gemeint. Wörtlich heißt es: „ein Haus für den Namen Jahwes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Für immer ist dies Israel auferlegt.“ Gemeint ist eine bleibende Verpflichtung Israels.'
    reason: syntax_clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der Aufmerksamkeitsruf eröffnet feierlich die königliche Erklärung; „Siehe“ bewahrt diese gehobene, aber verständliche Wirkung.
- source_word: בּוֹנֶה
  choice: ich baue
  rationale: Das Partizip bezeichnet hier ein gegenwärtiges beziehungsweise unmittelbar bevorstehendes Vorhaben; die präsentische Wiedergabe erhält diese Offenheit.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: ein Haus für den Namen Jahwes
  rationale: „Haus“ und „für den Namen“ bewahren die prägnante hebräische Tempel- und Namenstheologie, ohne sie im Haupttext erklärend aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift des göttlichen Eigennamens gibt das Tetragramm als Namen statt durch einen Titel wieder.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: um es ihm zu heiligen
  rationale: Die Form von קדשׁ bezeichnet das Absondern für den heiligen Gebrauch; das Pronomen „es“ nimmt das Haus auf.
- source_word: קְטֹרֶת סַמִּים
  choice: wohlriechendes Räucherwerk
  rationale: Die Wendung bezeichnet aromatisches, kultisch verwendetes Räucherwerk und wird so natürlich und anschaulich wiedergegeben.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: beständig die Brote auszulegen
  rationale: Der Ausdruck meint im Tempelkontext die regelmäßig vor Gott angeordneten Brote. „Brote“ ist kontextuell ergänzt; eine Fußnote macht die knappe hebräische Formulierung transparent.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Dies ist die etablierte und sachlich genaue deutsche Bezeichnung für das vollständig verbrannte Opfer.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי
  choice: an den Sabbaten, an den Neumonden und zu den Festzeiten
  rationale: Die Wiedergabe erhält die drei kultischen Zeitangaben und unterscheidet Sabbate, Monatsanfänge und festgesetzte Feste.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Das obliegt Israel für immer
  rationale: „Obliegt“ gibt die Verpflichtungskonstruktion mit עַל knapp wieder, während „für immer“ den zeitlich starken Ausdruck unverändert stehen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher kenntlich gemacht; die übliche deutsche Form „Jahwe“ vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von בַּיִת im Tempelkontext
  choice: Haus
  alternative: Tempel
  rationale: Obwohl der Tempel gemeint ist, erhält „Haus“ die theologisch bedeutsame Ausgangsformulierung „Haus für den Namen Jahwes“.
- issue: Explizierung von מַעֲרֶכֶת תָּמִיד
  choice: beständig die Brote auszulegen
  alternative: die beständige Anordnung aufzustellen
  rationale: Der hebräische Text nennt die Brote nicht ausdrücklich, setzt sie im Kultzusammenhang jedoch voraus. Die Ergänzung ermöglicht verständliches Deutsch; die Fußnote bewahrt die formale Kürze und die traditionelle Zuordnung.
- issue: Dauer der Verpflichtung für Israel
  choice: Das obliegt Israel für immer
  alternative: Dies ist eine ewige Ordnung für Israel
  rationale: Die gewählte Fassung bewahrt sowohl die Verpflichtung als auch die unbeschränkte Zeitangabe, ohne deren spätere theologische Einordnung im Vers selbst vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Auftakt. Kultische Fachbegriffe wie „Brandopfer“, „Sabbat“ und „Neumond“ bleiben erhalten; weniger geläufige Einzelheiten werden in Fußnoten erklärt. Die Satzstruktur folgt dem hebräischen Zweck- und Aufzählungsgefüge, wurde aber für flüssiges Deutsch leicht gegliedert.
