  source_fidelity: 'Der Entwurf gibt die hebräischen Bestandteile insgesamt zuverlässig wieder: das „Haus für den Namen Jahwes“, die Weihung, das Räucherwerk, die Brotordnung, die Brandopfer zu den genannten Zeiten und die dauerhafte Israel auferlegte Verpflichtung. Die kontextuelle Ergänzung „Brote“ bei מַעֲרֶכֶת תָּמִיד ist vertretbar und wird transparent erläutert. Die englische Audit-Fassung bestätigt diese Deutung, auch wenn deren Fußnotenanker offenbar nicht sachgerecht gesetzt sind; die deutschen Anker sind sinnvoll platziert.'
  naturalness: „Es ihm zu heiligen“ ist zwar verständlich, aber im modernen deutschen Kult- und Weihesprachgebrauch weniger idiomatisch als „es ihm zu weihen“. Außerdem sollte die Reihung der Opferzeiten syntaktisch enger an „Brandopfer darzubringen“ gebunden werden, damit sie nicht missverständlich auch das Auslegen der Brote bestimmt.
  terminology: „Jahwe“, „Räucherwerk“, „Brandopfer“, „Sabbate“, „Neumonde“ und „Festzeiten“ sind sachgerecht und registerangemessen. „Brote“ bleibt als kontextuelle Explizierung durch die Fußnote abgesichert. „Dies ist Israel für immer auferlegt“ gibt die verpflichtende Nuance von עַל יִשְׂרָאֵל natürlicher und unmittelbarer wieder als das etwas verwaltungsnahe „Das obliegt Israel“.
