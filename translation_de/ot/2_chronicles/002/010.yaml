  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: de
  text: 'Da antwortete Huram[a], der König von Tyrus, in einem Schreiben, das er Salomo sandte: „Weil Jahwe sein Volk liebt, hat er dich als König über sie eingesetzt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Huram; traditionell auch Hiram.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da antwortete
  rationale: Das Verb bedeutet grundsätzlich „sagen“; im Zusammenhang mit Salomos vorausgegangener Anfrage gibt „antwortete“ die Funktion der Äußerung natürlich wieder. „Da“ führt die Erzählung fort.
- source_word: חוּרָם
  choice: Huram
  rationale: Dies entspricht der hebräischen Namensform חוּרָם; die traditionelle Variante „Hiram“ wird in der Fußnote genannt.
- source_word: מֶלֶךְ צֹר
  choice: der König von Tyrus
  rationale: Die Status-constructus-Verbindung bezeichnet Hurams Amt und Herrschaftsgebiet; „Tyrus“ ist die etablierte deutsche Form.
- source_word: בִּכְתָב וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: in einem Schreiben, das er Salomo sandte
  rationale: בכתב bezeichnet etwas Schriftliches bzw. ein Schriftstück. Die Relativkonstruktion verbindet die beiden hebräischen Verben idiomatisch, ohne die Tatsache des Sendens auszulassen.
- source_word: בְּאַהֲבַת יְהוָה אֶת עַמּוֹ
  choice: Weil Jahwe sein Volk liebt
  rationale: Die Präposition ב bei dem Abstraktnomen אַהֲבָה kann hier kausal verstanden werden. Die verbale deutsche Fassung ist klar und bewahrt den Zusammenhang zwischen Jahwes Liebe und Salomos Einsetzung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Transkription.
- source_word: נְתָנְךָ עֲלֵיהֶם מֶלֶךְ
  choice: hat er dich als König über sie eingesetzt
  rationale: נתן heißt wörtlich „geben“, bezeichnet mit einer Person und dem Königsamt aber idiomatisch deren Einsetzung. „Über sie“ bewahrt den Herrschaftsbezug von עֲלֵיהֶם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Befund, statt ihn durch den traditionellen Ersatztitel zu ersetzen.
- issue: Ursache von Salomos Königtum
  choice: Jahwes Liebe zu seinem Volk ist der genannte Grund für Salomos Einsetzung
  alternative: „Aus Jahwes Liebe zu seinem Volk“
  rationale: Beide Fassungen verstehen בְּאַהֲבַת kausal. Die gewählte Form macht die Aussage in natürlichem Deutsch verständlich, ohne eine weitergehende theologische Erklärung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schreiben“ passt zu einer königlichen Korrespondenz, bleibt aber allgemein verständlich. Die Syntax ist natürlich, während alle wesentlichen Aussageelemente des Hebräischen erhalten bleiben.
