id: 2CH.2.11
reference: 2 Chronicles 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: de
  text: 'Da sagte Huram[a]: »Gepriesen sei Jahwe, der Gott Israels, der den Himmel und die Erde gemacht und König David einen weisen Sohn gegeben hat, der Einsicht und Verständnis besitzt[b]. Er wird ein Haus für Jahwe und ein Haus für sein Königtum[c] bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 1. Könige lautet der Name Hiram; die Chronik verwendet hier die hebräische Form Huram.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »der Einsicht und Verständnis kennt«; auch möglich: »der Umsicht und Urteilsvermögen besitzt«.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein Haus für seine königliche Herrschaft, möglicherweise der Palast beziehungsweise die Palastanlage.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: חוּרָם
  choice: Huram
  rationale: Folgt der Namensform חוּרָם im hebräischen Text der Chronik, ohne sie an die Form Hiram im parallelen Königsbericht anzugleichen.
- source_word: בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  rationale: Natürliche und würdevolle Wiedergabe der hebräischen Segensformel; der Gottesname wird als Jahwe wiedergegeben.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: der den Himmel und die Erde gemacht hat
  rationale: Bewahrt die biblische Schöpfungsformel; der hebräische Plural שָׁמַיִם wird idiomatisch mit dem deutschen Kollektivsingular »Himmel« wiedergegeben.
- source_word: בֵּן חָכָם
  choice: einen weisen Sohn
  rationale: Gibt חָכָם klar und breit genug wieder, einschließlich praktischer Weisheit.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: der Einsicht und Verständnis besitzt
  rationale: Das Partizip יוֹדֵעַ bezeichnet hier eine vorhandene Fähigkeit. »Besitzt« klingt im Deutschen natürlicher als das wörtliche »kennt«, während die beiden verwandten Begriffe unterschieden bleiben.
- source_word: בַּיִת לַיהוָה
  choice: ein Haus für Jahwe
  rationale: Bewahrt das hebräische Bild »Haus«, obwohl sachlich der Tempel gemeint ist.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: ein Haus für sein Königtum
  rationale: Gibt מַלְכוּת formal als »Königtum« wieder und lässt offen, ob vor allem der Palast beziehungsweise die königliche Herrschaftssphäre gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen direkt. »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in לְמַלְכוּתוֹ
  choice: sein Königtum, auf den königlichen Sohn bezogen
  alternative: Jahwes Königsherrschaft
  rationale: Der nächste grammatische Bezugspunkt ist der weise königliche Sohn; zugleich bleibt die ungewöhnliche Wendung durch die formale Wiedergabe »Königtum« erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. »Haus« bleibt als biblisches Leitwort erhalten; »Königtum« wahrt die sachliche und theologische Offenheit von מַלְכוּת.
