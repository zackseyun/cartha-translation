base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: de
  text: Dann zählte Salomo alle ansässigen Fremden, die im Land Israel lebten[a], und zwar im Anschluss an die Zählung, die sein Vater David unter ihnen vorgenommen hatte. Es wurden 153.600 ermittelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ansässigen Nichtisraeliten“ oder „die Beisassen“. Das hebräische Wort bezeichnet Nichtisraeliten, die innerhalb des israelitischen Gebiets lebten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: zählte
  rationale: Das Verb bezeichnet hier das Zählen beziehungsweise zahlenmäßige Erfassen von Personen. „Zählte“ ist natürlich und bleibt näher an der einfachen Verbform als „führte eine Volkszählung durch“.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: alle ansässigen Fremden
  rationale: גֵּרִים bezeichnet Fremde, die dauerhaft oder längerfristig im israelitischen Gebiet lebten, nicht bloß Durchreisende. „Ansässige Fremde“ gibt diese soziale Kategorie verständlich wieder.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: im Land Israel lebten
  rationale: „Land Israel“ wahrt den territorialen Sinn von אֶרֶץ. Das ergänzende „lebten“ ergibt sich im Deutschen natürlich aus der Bezeichnung als ansässige Fremde.
- source_word: אַחֲרֵי הַסְּפָר
  choice: im Anschluss an die Zählung
  rationale: Die Wendung verweist auf eine frühere Erfassung. „Im Anschluss an“ bewahrt primär die zeitliche Bedeutung von אַחֲרֵי, ohne einen bloßen Abgleich mit einem Verzeichnis festzulegen.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: die sein Vater David unter ihnen vorgenommen hatte
  rationale: Im Deutschen wird eine Zählung idiomatisch „vorgenommen“. Das Pronomen „ihnen“ nimmt die ansässigen Fremden auf.
- source_word: וַיִּמָּצְאוּ
  choice: Es wurden … ermittelt
  rationale: Diese Formulierung bewahrt den passiven, resultativen Sinn des Niphal und klingt bei einem Zählergebnis natürlich.
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: '153.600'
  rationale: Die Ziffernschreibweise gibt die exakte Gesamtzahl übersichtlich und nach deutscher Konvention wieder.
