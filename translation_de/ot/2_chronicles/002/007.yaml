base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: de
  text: 'Schick mir Zedern-, Zypressen[a]- und Algumholz[b] vom Libanon; denn ich weiß, dass deine Diener es verstehen, die Bäume des Libanon zu fällen. Und sieh: Meine Diener werden mit deinen Dienern sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wacholder“ beziehungsweise „Tanne“; welche Baumart mit dem hebräischen Wort berosch gemeint ist, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Auch „Almugholz“; manche halten es für Sandelholz, doch die genaue Holzart ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Schick mir
  rationale: Der Imperativ wird direkt und gegenwartssprachlich wiedergegeben. Das vorangestellte וּ־ trägt hier lediglich den Fortgang des Zusammenhangs und erfordert kein zusätzliches „nun“.
- source_word: עֲצֵי אֲרָזִים
  choice: Zedernholz
  rationale: Im Zusammenhang der angeforderten Baumaterialien bezeichnet die Wendung Holz von Zedern; in der koordinierten deutschen Form erscheint sie als „Zedern-“ vor „-holz“.
- source_word: בְּרוֹשִׁים
  choice: Zypressen
  rationale: „Zypresse“ ist eine verbreitete Wiedergabe, doch die genaue Baumart bleibt unsicher; dies wird in einer Fußnote kenntlich gemacht.
- source_word: וְאַלְגּוּמִּים
  choice: Algumholz
  rationale: Die botanische Bestimmung ist unsicher. Die lautnahe Bezeichnung „Algum“ vermeidet eine spekulative Gleichsetzung mit Sandelholz.
- source_word: מֵהַלְּבָנוֹן
  choice: vom Libanon
  rationale: Natürliche deutsche Bezeichnung der Herkunftsregion; der hebräische Artikel wird im Deutschen nicht eigens abgebildet.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: denn ich weiß
  rationale: Das Perfekt bezeichnet im Kontext einen bestehenden Wissensstand und wird idiomatisch im Präsens wiedergegeben.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: dass deine Diener es verstehen, … zu fällen
  rationale: Die Formulierung gibt sowohl das Wissen beziehungsweise Können als auch den Infinitiv des Baumfällens natürlich wieder.
- source_word: עֲצֵי לְבָנוֹן
  choice: die Bäume des Libanon
  rationale: Die formal naheliegende Wiedergabe bewahrt das Bild der stehenden Bäume, die gefällt werden sollen.
- source_word: וְהִנֵּה
  choice: 'Und sieh:'
  rationale: „Sieh“ bewahrt die aufmerksamkeitslenkende Funktion von הִנֵּה in einem würdigen, aber verständlichen Register.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: Meine Diener werden bei deinen Dienern sein
  rationale: Da der hebräische Nominalsatz kein ausdrückliches Verb enthält, ergänzt das Deutsche „werden … sein“. Der Zukunftsbezug ergibt sich aus der geplanten Arbeitsordnung, ohne die Beziehung näher als „Zusammenarbeit“ auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular bei „du/dein“. Botanische Unsicherheiten werden nicht im Haupttext aufgelöst, sondern durch unmittelbar zugeordnete Fußnoten bewahrt.
