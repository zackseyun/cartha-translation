base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: de
  text: Salomo zählte siebzigtausend Lastträger, achtzigtausend Steinhauer im Bergland und dreitausendsechshundert Aufseher über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: zählte
  rationale: ספר bezeichnet hier im narrativen Zusammenhang das Zählen beziehungsweise Erfassen der königlichen Arbeitskräfte; „zählte“ ist direkt und natürlich.
- source_word: אִישׁ ... סַבָּל
  choice: Männer als Lastträger
  rationale: אִישׁ bezeichnet die Männer, סַבָּל ihre Tätigkeit als Träger schwerer Lasten. Die Formulierung bewahrt sowohl die Personenangabe als auch die Arbeitskategorie.
- source_word: חֹצֵב בָּהָר
  choice: Steinhauer im Bergland
  rationale: חצב bedeutet „hauen, behauen“ und bezeichnet im Baukontext plausibel Steinhauer; בָּהָר benennt ihren Arbeitsort im Berg beziehungsweise Bergland. Die im Hebräischen nicht ausdrücklich genannte Sache, die behauen wird, wird kontextgemäß als Stein verstanden.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: Aufseher über sie
  rationale: Der Partizip von נצח bezeichnet in diesem administrativen Zusammenhang Männer, die die Arbeiten leiten oder beaufsichtigen; „über sie“ gibt עֲלֵיהֶם ausdrücklich wieder.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: '3.600'
  rationale: Die Zahl wird in moderner deutscher Schreibweise knapp und eindeutig wiedergegeben.
- source_word: אִישׁ
  choice: Männer
  rationale: Das maskuline אִישׁ bezieht sich hier auf die männlichen Angehörigen der königlichen Arbeiterschaft und wird daher nicht geschlechtsneutralisiert.
