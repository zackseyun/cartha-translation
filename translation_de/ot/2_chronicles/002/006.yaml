  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: de
  text: Und nun sende mir einen kundigen Mann, der Gold, Silber, Bronze, Eisen, Purpur, Karmesin[a] und Blau verarbeitet und sich darauf versteht, Gravuren anzufertigen[b]. Er soll mit den kundigen Männern zusammenarbeiten, die bei mir in Juda und Jerusalem sind und die mein Vater David bereitgestellt hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Scharlach“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Eingravierungen einzugravieren“; im Hebräischen stehen ein Verb und ein verwandtes Substantiv nebeneinander.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eingesetzt“ beziehungsweise „vorbereitet“. Das hebräische Verb kann je nach Zusammenhang das Bereitmachen oder die Einsetzung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus וְ und עַתָּה enthält ausdrücklich sowohl den Anschluss als auch die zeitliche bzw. folgernde Wendung „und nun“.
- source_word: אִישׁ חָכָם
  choice: einen kundigen Mann
  rationale: חָכָם bezeichnet hier im handwerklichen Zusammenhang fachliche Befähigung; „kundig“ bewahrt zugleich die Verbindung zu den später genannten kundigen Männern.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: der Gold, Silber, Bronze und Eisen verarbeitet
  rationale: Das Verb mit ב bezeichnet die Arbeit in beziehungsweise mit den genannten Werkstoffen. „Verarbeitet“ ist im Deutschen natürlich und umfasst verschiedene Handwerkstechniken; נְחֹשֶׁת wird im historischen Sachzusammenhang als „Bronze“ wiedergegeben.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: Purpur, Karmesin und Blau
  rationale: Die hebräischen Begriffe bezeichnen kostbare gefärbte Materialien beziehungsweise Farbtöne. Da der Vers kein ausdrückliches Wort für Garn oder Stoff enthält, bleiben die Farbbezeichnungen kompakt.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: sich darauf versteht, Gravuren anzufertigen
  rationale: Die Wendung beschreibt fachliche Fähigkeit zu eingravierter oder eingeschnittener Zierarbeit. Natürliches Deutsch ersetzt die hebräische figura etymologica durch „Gravuren anzufertigen“, während die Fußnote die Form des Hebräischen dokumentiert.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: mit den kundigen Männern zusammenarbeiten, die bei mir sind
  rationale: עִם drückt Zusammenarbeit beziehungsweise Gemeinschaft aus; אֲשֶׁר עִמִּי wird ohne eine nicht ausdrücklich genannte Rangordnung als „die bei mir sind“ wiedergegeben.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: die mein Vater David bereitgestellt hat
  rationale: Der Relativsatz bezieht sich am naheliegendsten auf die kundigen Männer. „Bereitgestellt“ gibt das Vorbereiten und Verfügbar-Machen wieder, ohne die mögliche Nuance einer Einsetzung auszuschließen.
theological_decisions:
- issue: Bezugswort des Relativsatzes אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: Bezug auf die kundigen Männer
  alternative: Bezug auf allgemeine Vorbereitungen oder Arbeitsmittel
  rationale: Genus und Numerus des Relativpronomens lassen formal mehrere nicht markierte Bezüge zu, doch syntaktische Nähe und Sinnzusammenhang sprechen dafür, dass David die zuvor genannten Fachleute bereitgestellt beziehungsweise eingesetzt hatte. Die Übersetzung macht diesen wahrscheinlichsten Bezug sichtbar, ohne daraus eine theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt knapp und handwerklich geprägt. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die inhaltlichen Beziehungen bleiben erhalten.
