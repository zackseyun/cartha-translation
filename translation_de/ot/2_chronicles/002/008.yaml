  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: de
  text: und mir Holz in großer Menge bereitzustellen; denn das Haus[a], das ich baue, ist groß und wunderbar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Tempel«; wörtlich: »das Haus«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »groß und außergewöhnlich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: und … bereitzustellen
  rationale: Der Infinitiv mit Konjunktion und Präposition führt die Bitte aus dem vorherigen Zusammenhang fort. »Bereitzustellen« gibt den zweckgerichteten Sinn im Deutschen natürlich wieder.
- source_word: לִי
  choice: mir
  rationale: Die Präposition mit Suffix bezeichnet den Empfänger beziehungsweise Nutznießer; im Deutschen ist der Dativ »mir« idiomatisch.
- source_word: עֵצִים
  choice: Holz
  rationale: Im Baukontext ist Bauholz gemeint. »Holz« ist im modernen Deutschen natürlicher als das fachsprachlichere »Bauholz«, ohne den Sinn unnötig einzuengen.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung bezeichnet eine große Quantität; diese Wiedergabe ist klar und bewahrt die nominale Ausdrucksweise.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein; »denn« passt zum gehobenen, aber heutigen Erzählstil.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die hebräische Formulierung lautet wörtlich »das Haus«. Der Bezug auf den Tempel wird in einer Fußnote erläutert, statt ihn im Haupttext explizit einzusetzen.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: das ich baue
  rationale: Das Partizip bezeichnet die als gegenwärtig beziehungsweise unmittelbar bevorstehend dargestellte Bautätigkeit. Das deutsche Präsens lässt diese zeitliche Offenheit bestehen.
- source_word: גָּדוֹל
  choice: groß
  rationale: »Groß« kann sowohl Ausmaß als auch Bedeutung und Erhabenheit ausdrücken und entspricht damit der Spannweite des hebräischen Wortes.
- source_word: וְהַפְלֵא
  choice: und wunderbar
  rationale: Die Form aus der Wurzel פלא bezeichnet etwas Außergewöhnliches oder Staunenswertes. »Wunderbar« bewahrt den feierlichen Ton und die semantische Spannung, ohne die Aussage bloß auf Größe oder Pracht zu reduzieren.
theological_decisions:
- issue: Bezeichnung des geplanten Heiligtums
  choice: Haus
  alternative: Tempel
  rationale: Der Haupttext bewahrt die konkrete hebräische Bezeichnung »Haus«. Dass damit der Tempel gemeint ist, wird als sachliche Verständnisalternative in der Fußnote genannt, ohne die biblische Bildsprache aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Satz bleibt als Fortsetzung des vorausgehenden Verses syntaktisch offen. Das Semikolon gliedert Bitte und Begründung; die Konstruktion mit »soll … werden« ergibt im Deutschen eine natürliche Aussage über den beabsichtigten Charakter des noch zu bauenden Hauses.
