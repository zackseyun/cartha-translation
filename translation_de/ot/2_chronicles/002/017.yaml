  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: de
  text: Von ihnen setzte er 70.000 als Lastträger ein, 80.000 als Steinhauer im Bergland[a] und 3.600 als Aufseher, um das Volk arbeiten zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hauer im Berg“ oder „im Bergland“. Was sie hieben, wird im Hebräischen nicht ausdrücklich genannt; im Zusammenhang sind wahrscheinlich Steine gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Von ihnen setzte er … ein
  rationale: Die Wendung bezeichnet hier die Auswahl und Einsetzung von Personen aus der zuvor genannten Gruppe. „Setzte er … ein“ gibt die Funktion im heutigen Deutsch natürlicher wieder als das wörtliche „machte er aus ihnen“.
- source_word: סַבָּל
  choice: Lastträger
  rationale: Das Substantiv bezeichnet jemanden, der Lasten trägt. „Lastträger“ ist präzise und im Baukontext verständlich.
- source_word: חֹצֵב בָּהָר
  choice: Steinbrecher im Bergland
  rationale: חצב bedeutet „hauen, brechen“ und bezieht sich im Zusammenhang des Tempelbaus wahrscheinlich auf Stein. Das Objekt steht im Hebräischen jedoch nicht ausdrücklich da; die Fußnote hält diese Ergänzung transparent. בָּהָר wird räumlich als „im Bergland“ wiedergegeben.
- source_word: מְנַצְּחִים
  choice: Aufseher
  rationale: In diesem administrativen Arbeitskontext bezeichnet das Partizip Personen, die andere anleiten und beaufsichtigen. „Aufseher“ ist knapp, würdig und sachlich.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: die das Volk zur Arbeit anhalten sollten
  rationale: Der Hifil von עבד drückt aus, dass jemand zum Arbeiten gebracht oder bei der Arbeit eingesetzt wird. Die Formulierung bewahrt den kausativen und beaufsichtigenden Sinn, ohne „das Volk“ zu „Arbeitern“ umzudeuten.
- source_word: הָעָם
  choice: das Volk
  rationale: Der hebräische Text hat den allgemeinen Ausdruck „das Volk“. Die Übersetzung erhält ihn, statt ihn kontextuell zu „Arbeitskräften“ zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit sachlich-würdigem Ton. Die großen Zahlen werden zur besseren Lesbarkeit mit Punkten gegliedert. Der Fußnotenmarker steht unmittelbar bei „Steinbrecher im Bergland“, da die Anmerkung diese Wendung erläutert.
