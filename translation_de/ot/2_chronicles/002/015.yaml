source:
  edition: WLC
  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: de
  text: Und wir werden dir aus dem Libanon so viel Holz schlagen, wie du brauchst, und es dir zu Flößen gebunden über das Meer nach Joppe[a] bringen; du wirst es dann nach Jerusalem hinaufbringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joppe ist die Hafenstadt, die später auch Jaffa genannt wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Du wirst sie nach Jerusalem hinaufbringen.“ Das „hinauf“ verweist auf die höhere Lage Jerusalems.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת עֵצִים
  choice: Bauholz schlagen
  rationale: כרת bezeichnet bei Bäumen das Fällen oder Schlagen; עֵצִים meint im Zusammenhang der Tempelbau-Lieferung Holz als Baumaterial. „Bauholz schlagen“ gibt beides natürlich und präzise wieder.
- source_word: מִן הַלְּבָנוֹן
  choice: vom Libanon
  rationale: Die Wendung bezeichnet das bekannte Wald- und Gebirgsgebiet; im modernen Deutschen ist „vom Libanon“ idiomatisch.
- source_word: כְּכָל צָרְכֶּךָ
  choice: so viel …, wie du brauchst
  rationale: Die Formulierung drückt aus, dass die Menge dem gesamten Bedarf Salomos entsprechen soll.
- source_word: וּנְבִיאֵם לְךָ
  choice: und es dir … bringen
  rationale: Das hebräische Suffix ist pluralisch und bezieht sich auf die Holzstücke. Da „Bauholz“ im Deutschen als Kollektivsingular gebraucht wird, ist „es“ natürlich.
- source_word: רַפְסֹדוֹת
  choice: in Flößen
  rationale: Das Wort bezeichnet zusammengebundenes, schwimmendes Holz. „In Flößen“ wahrt die mögliche instrumentale bzw. gestaltbezogene Aussage, ohne sie unnötig festzulegen.
- source_word: עַל יָם יָפוֹ
  choice: auf dem Seeweg nach Jafo
  rationale: Die knappe hebräische Verbindung beschreibt den Transport über das Meer mit Jafo als Ziel; die deutsche Fassung macht diese Beziehung idiomatisch deutlich.
- source_word: יָפוֹ
  choice: Jafo
  rationale: „Jafo“ ist die im modernen Deutschen gebräuchliche Form des Ortsnamens und entspricht dem heutigen Jaffa.
- source_word: תַּעֲלֶה אֹתָם
  choice: Du sollst es dann … hinaufbringen
  rationale: עלה bewahrt die Aufwärtsrichtung nach Jerusalem, das deutlich höher liegt als der Hafen. „sollst“ gibt hier die dem Empfänger zufallende Aufgabe im Zukunftszusammenhang natürlich wieder.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Dies ist die etablierte deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Kollektivsingular „Bauholz“ sorgt für natürlichen Ausdruck; die Fußnote bewahrt beim Verb die wörtliche Pluralform. Die Aufwärtsrichtung nach Jerusalem bleibt ausdrücklich erhalten.
