    issue: „in Flößen“ ist für רַפְסֹדוֹת ungenau.
    rationale: Gemeint ist nicht eine Beförderung innerhalb von Flößen, sondern Holz, das selbst zu Flößen bzw. schwimmenden Holzverbänden gebunden ist.
  - severity: low
