  naturalness: Die Revision verwendet idiomatisches modernes Standarddeutsch. „Holz schlagen“ ist für das Fällen/Schlagen von Holz natürlich; der Kollektivsingular erlaubt weiterhin „es“.
  terminology: „Joppe“ ist die etablierte deutsche biblische Namensform für יָפוֹ. „Holz“ wahrt gegenüber dem engeren „Bauholz“ die Breite von עֵצִים, ohne den Lieferkontext zu verlieren.
