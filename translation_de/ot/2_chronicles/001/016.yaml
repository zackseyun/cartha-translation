  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕א סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ מִ/קְוֵ֥א יִקְח֖וּ בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: de
  text: Und die Herkunft der Pferde Salomos war Ägypten und Kue[a]; die Händler des Königs erwarben sie aus Kue gegen Bezahlung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und aus einer Sammelstelle“ oder „und aus einem Depot“; das schwierige hebräische Wort מִקְוֵא kann statt als Ortsname Kue auch als Bezeichnung für eine Sammelstelle oder ein Depot verstanden werden. Dann wäre der Vers sinngemäß zu übersetzen: „Die Herkunft der Pferde Salomos war Ägypten und eine Sammelstelle; die Händler des Königs kauften sie dort gegen Bezahlung.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצָא
  choice: Und die Herkunft
  rationale: מוֹצָא bezeichnet hier den Ursprung beziehungsweise die Bezugsquelle. „Herkunft“ wahrt diese Bedeutung, ohne bereits den technischeren Begriff „Einfuhr“ vorauszusetzen.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: der Pferde Salomos
  rationale: Die Verbindung mit לְ drückt hier Zugehörigkeit aus; der deutsche Genitiv ist knapp und natürlich.
- source_word: מִמִּצְרָיִם
  choice: Ägypten
  rationale: Die Präposition מִן ist in die deutsche Herkunftskonstruktion aufgenommen.
- source_word: וּמִקְוֵא
  choice: und Kue[a]
  rationale: מִקְוֵא wird wahrscheinlich als Ortsname Kue verstanden, parallel zu Ägypten. Da die Deutung umstritten ist, wird die alternative appellativische Auffassung in einer Fußnote genannt.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: die Händler des Königs
  rationale: Das substantivierte Partizip bezeichnet Händler beziehungsweise Kaufleute; „Händler“ ist im Handelskontext klar und gegenwärtig.
- source_word: מִקְוֵא יִקְחוּ
  choice: erwarben sie aus Kue
  rationale: לקח bedeutet wörtlich „nehmen“, bezeichnet hier im Zusammenhang mit בִּמְחִיר aber den geschäftlichen Erwerb. Das wiederholte מִקְוֵא wird konsistent als Ortsname wiedergegeben.
- source_word: בִּמְחִיר
  choice: gegen Bezahlung
  rationale: Die Wendung bezeichnet den entgeltlichen Charakter des Erwerbs; „gegen Bezahlung“ ist natürlich und vermeidet die im Deutschen missverständliche Formulierung „für einen Preis“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe nominale Satzform des Hebräischen bleibt erkennbar; zur besseren deutschen Lesbarkeit trennt ein Semikolon die beiden Handelsangaben. Die umstrittene Deutung von מִקְוֵא wird nicht im Haupttext aufgelöst, sondern transparent in der Fußnote dokumentiert.
