source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: de
  text: Und Salomo beschloss[a], ein Haus für den Namen Jahwes und ein Haus für seine Königsherrschaft zu bauen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sagte“. Die hebräische Verbindung kann hier auch bedeuten, dass Salomo sich vornahm oder anordnete, die Häuser zu bauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß: „einen Tempel für den Namen Jahwes und einen Palast für seine Königsherrschaft“. Im Hebräischen steht an beiden Stellen dasselbe Wort für „Haus“.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: beschloss
  rationale: Das häufige Verb bedeutet wörtlich „sagen“. Mit dem folgenden Infinitiv bezeichnet die Konstruktion hier jedoch am ehesten einen gefassten Entschluss; „beschloss“ ist im Deutschen natürlich, während „sagte zu bauen“ missverständlich wäre. Die wörtliche und die mögliche befehlende Lesart bleiben in der Fußnote erhalten.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Der Infinitiv von בנה bedeutet unmittelbar „bauen“ und lässt sich im Deutschen als Infinitiv mit „zu“ wiedergeben.
- source_word: בַּיִת … וּבַיִת
  choice: ein Haus … und ein Haus
  rationale: Die Wiederholung desselben hebräischen Substantivs wird bewahrt. Aus den Ergänzungen ergibt sich, dass das erste Haus der Tempel und das zweite der königliche Palast ist.
- source_word: לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  rationale: Die Formulierung bewahrt die für den Tempel bedeutsame Rede vom Namen Gottes und vermeidet die Vorstellung, Gott selbst werde von einem Gebäude umfasst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Umschrift gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְמַלְכוּתוֹ
  choice: für sein Königtum
  rationale: מַלְכוּת kann „Königtum“, „Königsherrschaft“ oder „Königreich“ bedeuten. „Königtum“ bezeichnet hier knapp Salomos königliche Herrschaft, der das zweite Haus dienen soll, ohne die Bedeutung auf ein Staatsgebiet zu verengen.
theological_decisions:
- issue: Tempelformel mit dem göttlichen Namen
  choice: für den Namen Jahwes
  alternative: für den Namen des HERRN
  rationale: Der hebräische Text nennt das Tetragramm und spricht bewusst von einem Haus für Gottes Namen. Die Übersetzung erhält sowohl den Eigennamen als auch diese theologisch bedeutsame Ausdrucksweise.
- issue: Bedeutung der beiden Vorkommen von בַּיִת
  choice: ein Haus … und ein Haus
  alternative: einen Tempel … und einen Palast
  rationale: Die gleiche Wiedergabe erhält die auffällige Wortwiederholung des Ausgangstextes. Die konkreten Funktionen werden nicht bestritten, sondern in einer Fußnote erläutert.
- issue: Art von Salomos Äußerung
  choice: beschloss
  alternative: sagte / befahl
  rationale: Die Verbindung von וַיֹּאמֶר mit einem Infinitiv kann im Zusammenhang einen Entschluss oder einen Auftrag ausdrücken. Der Haupttext bietet die im Deutschen natürlichste kontextuelle Lesart, während die Fußnote die formale und sachliche Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist natürlich deutsch, wahrt aber die Wiederholung „ein Haus … ein Haus“ und die Namensformel des Hebräischen. „Königtum“ ist leicht gehoben, jedoch präzise und im biblisch-historischen Zusammenhang gut verständlich.
