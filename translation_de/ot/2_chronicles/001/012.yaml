  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: de
  text: Weisheit und Erkenntnis sind dir gegeben. Dazu werde ich dir Reichtum, Besitz und Ehre geben, wie sie kein König vor dir gehabt hat und kein König nach dir haben wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie es bei den Königen, die vor dir waren, nicht so gewesen ist, und nach dir wird es nicht so sein“.'
    reason: Die Fußnote bewahrt die unpersönliche und in ihrem Bezug etwas offenere Ausdrucksweise des Hebräischen.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgemäße Wiedergabe von חָכְמָה; der bestimmte Artikel wird bei dem abstrakten Begriff im Deutschen natürlich nicht ausgedrückt.
- source_word: הַמַּדָּע
  choice: Erkenntnis
  rationale: מַדָּע bezeichnet Wissen beziehungsweise Erkenntnis. „Erkenntnis“ bildet ein natürliches, würdiges Begriffspaar mit „Weisheit“, ohne den Sinn auf bloße Sachkenntnis einzuengen.
- source_word: נָתוּן לָךְ
  choice: sind dir gegeben
  rationale: Das passive Partizip bezeichnet den durch Gottes Gewährung bestehenden Zustand. Im Deutschen richtet sich das Verb natürlich nach dem zusammengesetzten Subjekt „Weisheit und Erkenntnis“.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: עֹשֶׁר bezeichnet materiellen Wohlstand; „Reichtum“ ist im heutigen Deutsch klar und für den königlichen Zusammenhang angemessen.
- source_word: נְכָסִים
  choice: Besitz
  rationale: נְכָסִים meint Besitz beziehungsweise Vermögen. „Besitz“ unterscheidet den Begriff hinreichend vom vorangehenden „Reichtum“ und vermeidet den technischen Klang von „Vermögenswerten“.
- source_word: כָבוֹד
  choice: Ehre
  rationale: כָבוֹד kann „Ehre“, „Ansehen“ oder „Herrlichkeit“ bedeuten. Im Zusammenhang königlicher Gaben trifft „Ehre“ den sozialen und herrscherlichen Sinn, ohne göttliche Herrlichkeit anzudeuten.
- source_word: אֶתֶּן לָךְ
  choice: werde ich dir ... geben
  rationale: Der Imperfekt von נתן drückt hier Gottes zukünftige Zusage aus. Die deutsche Futurform gibt dies eindeutig und natürlich wieder.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: wie es sie bei den Königen vor dir nicht gegeben hat
  rationale: Die idiomatische Formulierung bewahrt den Vergleich mit den früheren Königen und bezieht ihn im Kontext auf die genannten Gaben, ohne eine absolute Aussage über jeden Aspekt Salomos zu machen.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: und nach dir nicht geben wird
  rationale: Die Wendung setzt den zeitlichen Vergleich fort. Das im Hebräischen unpersönliche „so wird es nicht sein“ wird im Deutschen auf die genannten Gaben bezogen, während die wörtlichere Struktur in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Reichweite des Vergleichs mit den Königen vor und nach Salomo
  choice: Der Vergleich wird auf die im Vers genannten Gaben bezogen.
  alternative: Salomo selbst sei in jeder Hinsicht unvergleichlich mit allen früheren und späteren Königen.
  rationale: Grammatisch und kontextuell folgt der Relativsatz auf die Aufzählung der verliehenen Gaben. Die Übersetzung beschränkt die Aussage daher auf diesen Zusammenhang und erweitert sie nicht zu einer absoluten Bewertung von Salomos Person oder Herrschaft.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Dazu“ macht den Übergang von der bereits gewährten Weisheit und Erkenntnis zu den zusätzlich verheißenen königlichen Gaben natürlich deutlich. Der Fußnotenmarker steht unmittelbar nach der Vergleichsaussage, auf die sich die Anmerkung bezieht.
