  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: de
  text: 'Und Gott sagte zu Salomo: „Weil dir dies am Herzen lag und du weder um Reichtum noch um Besitz noch um Ehre, auch nicht um das Leben derer, die dich hassen,[a] noch um viele Tage[b] gebeten hast, sondern dir Weisheit und Erkenntnis erbeten hast, damit du mein Volk richten kannst, über das ich dich zum König gemacht habe,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Leben deiner Feinde“; wörtlich: „das Leben derer, die dich hassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ein langes Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Gibt die kausale Funktion der hebräischen Verbindung klar und natürlich wieder.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: dir dies am Herzen lag
  rationale: Bewahrt das Bild des Herzens in einer natürlichen deutschen Wendung und bezeichnet Salomos innere Absicht.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: Reichtum, Besitz noch Ehre
  rationale: Unterscheidet Reichtum von konkretem Besitz und gibt כָבוֹד im königlichen Zusammenhang als gesellschaftliche Ehre wieder.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: das Leben derer, die dich hassen
  rationale: Folgt dem Singular נֶפֶשׁ und dem substantivierten Partizip eng, ohne es vorschnell zu „Feinde“ zu glätten.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Bewahrt die konkrete hebräische Ausdrucksweise; idiomatisch ist damit ein langes Leben gemeint.
- source_word: חָכְמָה וּמַדָּע
  choice: Weisheit und Erkenntnis
  rationale: Erhält die begriffliche Unterscheidung beider hebräischen Wörter.
- source_word: לְךָ
  choice: dir
  rationale: Gibt den Dativ wieder und kennzeichnet Salomo als Empfänger der erbetenen Befähigung, ohne eine eigennützige Bedeutung einzutragen.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: damit du ... richten kannst
  rationale: Gibt die Zweckbeziehung natürlich wieder und behält die richterliche Bedeutung von שׁפט bei.
- source_word: הִמְלַכְתִּיךָ עָלָיו
  choice: über das ich dich zum König gemacht habe
  rationale: Gibt Gottes Einsetzung Salomos und dessen Herrschaft über das Volk unmittelbar wieder.
theological_decisions:
- issue: Bezeichnung des göttlichen Sprechers אֱלֹהִים
  choice: Gott
  alternative: der HERR
  rationale: Im Vers steht אֱלֹהִים und nicht der Gottesname JHWH; daher ist „Gott“ quellentreu.
- issue: Königliche Aufgabe mit שׁפט
  choice: richten
  alternative: regieren
  rationale: „Richten“ bewahrt die ausdrückliche Bedeutung des Verbs und lässt zugleich dessen weiter gefasste königliche Funktion offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Satzstruktur und die offene Fortsetzung des Verses werden beibehalten; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
