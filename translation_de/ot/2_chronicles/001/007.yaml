  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נִרְאָ֥ה אֱלֹהִ֖ים לִ/שְׁלֹמֹ֑ה וַ/יֹּ֣אמֶר ל֔/וֹ שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: de
  text: 'In jener Nacht erschien Gott Salomo und sagte zu ihm: „Bitte um das, was ich dir geben soll.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: In jener Nacht
  rationale: Die Wendung gibt den bestimmten zeitlichen Rückbezug idiomatisch und zugleich quellennah wieder.
- source_word: נִרְאָה
  choice: erschien
  rationale: Das Nifal von ראה bezeichnet hier eine Erscheinung; „erschien“ ist natürlich und fügt gegenüber dem Hebräischen keine nähere Deutung hinzu.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht hier mit einem Verb im Singular und bezeichnet im Erzählzusammenhang den einen Gott.
- source_word: לִשְׁלֹמֹה
  choice: Salomo
  rationale: Mit „erschien“ wird die durch ל markierte Person im Deutschen idiomatisch ohne Präposition angeschlossen.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: Dies bildet sowohl das fortführende ו als auch אמר mit seinem indirekten Objekt direkt und natürlich ab.
- source_word: שְׁאַל
  choice: Bitte
  rationale: Das deutsche „bitten“ kann wie das hebräische שׁאל eine erbetene Gabe zum Gegenstand haben; der Imperativ bleibt direkt und offen.
- source_word: מָה אֶתֶּן לָךְ
  choice: was ich dir geben soll
  rationale: Der abhängige Fragesatz ist im modernen Deutschen nach „Bitte“ idiomatisch; „soll“ bewahrt die offene Frage nach der gewünschten Gabe.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים im Kontext einer Gotteserscheinung
  choice: Gott
  alternative: Götter
  rationale: Die singularische Verbform und der Erzählzusammenhang bestimmen den Referenten eindeutig als Singular, ohne dass weitere dogmatische Aussagen ergänzt werden.
- issue: Modalität in מָה אֶתֶּן לָךְ
  choice: was ich dir geben soll
  alternative: was ich dir geben werde
  rationale: „Soll“ erhält den Charakter der offenen Aufforderung, eine Gabe zu nennen; „werde“ könnte die Äußerung stärker als bloße Zukunftsaussage verstehen lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die direkte Rede des hebräischen Textes bleiben erhalten.
