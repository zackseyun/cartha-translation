base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: de
  text: 'Und Salomo sprach[a] zu ganz Israel: zu den Befehlshabern über Tausend und über Hundert, zu den Richtern und zu allen Oberhäuptern in ganz Israel, den Familienoberhäuptern[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sagte zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Häupter der Väter“; gemeint sind Oberhäupter von Sippen oder Vaterhäusern, also von Verwandtschaftsverbänden gemeinsamer Abstammung.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sprach
  rationale: Das Verb bedeutet grundsätzlich „sagen“. In der Verbindung mit mehreren durch לְ eingeführten Adressaten gibt „sprach zu“ die öffentliche Ansprache natürlich und zugleich eng am Hebräischen wieder.
- source_word: לְכָל יִשְׂרָאֵל
  choice: zu ganz Israel
  rationale: Die kollektive Bezeichnung des Volkes bleibt erhalten; „ganz Israel“ ist im Deutschen idiomatischer als „alles Israel“.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: die Befehlshaber über Tausend und über Hundert
  rationale: שָׂרִים bezeichnet hier militärisch-administrative Amtsträger. „Über Tausend und über Hundert“ bewahrt die Einteilung in entsprechende Einheiten, ohne sie spekulativ genauer zu bestimmen.
- source_word: וְלַשֹּׁפְטִים
  choice: zu den Richtern
  rationale: Die übliche Amtsbezeichnung aus der Wurzel שׁפט wird direkt und verständlich wiedergegeben.
- source_word: וּלְכֹל נָשִׂיא
  choice: und zu allen führenden Männern
  rationale: נָשִׂיא kann „Fürst“, „Oberhaupt“ oder „Anführer“ bedeuten. Im administrativen Zusammenhang bezeichnet „führende Männer“ den Personenkreis klar, ohne einen modernen dynastischen Fürstentitel nahezulegen; der Singular mit כֹל wird im Deutschen distributiv als Plural wiedergegeben.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die hebräische Kurzform bezeichnet die Leiter patrilinear gegliederter Vaterhäuser beziehungsweise Großfamilien. Die Wiedergabe ist für heutige Leser verständlich und erhält durch „Oberhäupter“ die historische Leitungsstruktur.
theological_decisions:
- issue: Wiedergabe der verwandtschaftlich-administrativen Bezeichnung רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter der Großfamilien
  alternative: Oberhäupter der Vaterhäuser
  rationale: Die Formulierung bezeichnet keine Kleinfamilien, sondern größere, von gemeinsamen Vorfahren her gedachte Verwandtschaftsverbände. „Großfamilien“ vermittelt die soziale Funktion im heutigen Deutsch; eine Fußnote bewahrt die wörtlichere, männlich markierte Ausdrucksweise des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählungsstruktur des Hebräischen bleibt durch den Doppelpunkt und die wiederholten Präpositionen sichtbar. Die abschließende Wendung wird als Apposition zu den führenden Männern verstanden, ohne die administrative Gliederung über den Ausgangstext hinaus festzulegen.
