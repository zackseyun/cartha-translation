id: 2CH.1.4
reference: 2 Chronicles 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: de
  text: Doch David hatte die Lade Gottes aus Kirjat-Jearim an den Ort hinaufgebracht, den er für sie vorbereitet hatte[a]; denn er hatte in Jerusalem ein Zelt für sie aufgeschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zu dem, was David für sie vorbereitet hatte“. Die hebräische Formulierung ist knapp; gemeint ist der Ort, den David für die Lade bereitgemacht hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Doch
  rationale: Markiert den Gegensatz zum bronzenen Altar in Gibeon, von dem im vorigen Vers die Rede ist.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Entspricht der hebräischen Genitivverbindung und der geläufigen deutschen biblischen Bezeichnung.
- source_word: הֶעֱלָה
  choice: hatte ... hinaufgebracht
  rationale: Das Hifil von עלה bezeichnet hier das Hinaufbringen der Lade; das Plusquamperfekt gibt die vorausliegende Handlung im erzählerischen Zusammenhang wieder.
- source_word: מִקִּרְיַת יְעָרִים
  choice: aus Kirjat-Jearim
  rationale: Verwendet eine geläufige deutsche Umschrift des Ortsnamens und gibt die Herkunft mit מִן wieder.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: an den Ort, den er für sie vorbereitet hatte
  rationale: Die hebräische Wendung ist knapp beziehungsweise elliptisch. Die Ergänzung „Ort“ macht das gemeinte Ziel im Deutschen verständlich, ohne die Aussage inhaltlich auszuweiten.
- source_word: כִּי
  choice: denn
  rationale: Leitet die erklärende Begründung dafür ein, inwiefern David den Ort vorbereitet hatte.
- source_word: נָטָה לוֹ אֹהֶל
  choice: er hatte ... ein Zelt für sie aufgeschlagen
  rationale: נטה in Verbindung mit אֹהֶל bedeutet idiomatisch, ein Zelt aufzuschlagen. Das feminine Pronomen bezieht sich im Deutschen natürlich auf „Lade“.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den Gegensatz zum vorausgehenden Vers; das Plusquamperfekt verdeutlicht die zeitliche Rückblende. Die Lade wird entsprechend dem grammatischen Geschlecht im Deutschen mit „sie“ aufgenommen.
