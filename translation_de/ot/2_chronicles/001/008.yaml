source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: de
  text: 'Und Salomo sagte zu Gott: »Du hast meinem Vater David große Güte[a] erwiesen und hast mich an seiner Stelle zum König gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »große beständige Liebe« oder »große Bundestreue«. Das hebräische Wort חֶסֶד bezeichnet oft loyale Liebe, Güte oder Treue, besonders innerhalb einer verbindlichen Beziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Narrativ-Waw führt die Handlung fort; »Und … sagte« gibt dies in würdigem, natürlichem Deutsch wieder.
- source_word: לֵאלֹהִים
  choice: zu Gott
  rationale: אֱלֹהִים bezeichnet hier eindeutig den Gott, an den Salomo sich wendet.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: hast … große Bundestreue erwiesen
  rationale: Die Verbindung עשה עם + חֶסֶד bezeichnet loyale, verlässliche Güte in einer Beziehung. Im Zusammenhang mit David bewahrt »Bundestreue« das bundestheologische Gewicht; die Fußnote hält die breitere Bedeutungsweite offen.
- source_word: דָּוִיד אָבִי
  choice: meinem Vater David
  rationale: Diese Wortstellung ist im modernen Deutschen natürlicher als »David, meinem Vater«, ohne den Sinn zu verändern.
- source_word: וְהִמְלַכְתַּנִי
  choice: und hast mich … zum König gemacht
  rationale: 'Der Hifil von מלך ist kausativ: Gott hat Salomo zum König eingesetzt beziehungsweise gemacht. Die gewählte Formulierung ist klar und bewahrt Gottes Handeln als Ursache.'
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: 'תחת bezeichnet hier die Nachfolge im Königtum: Salomo wurde König an Davids Stelle, ohne dass eine gewaltsame Verdrängung angedeutet wird.'
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Zusammenhang mit David
  choice: Bundestreue
  alternative: große Güte; beständige Liebe
  rationale: Der Kontext von Gottes Handeln an David legt die loyale und bundeshafte Dimension nahe. Da חֶסֶד zugleich ein breites Bedeutungsspektrum besitzt, werden weniger spezifische Wiedergaben in der Fußnote genannt.
- issue: Göttliches Handeln bei der Thronfolge
  choice: hast mich an seiner Stelle zum König gemacht
  alternative: hast mich nach ihm herrschen lassen
  rationale: Die Formulierung bewahrt sowohl den kausativen Sinn des hebräischen Verbs als auch die Aussage, dass Salomo David im Königtum nachfolgt, ohne darüber hinausgehende dogmatische Folgerungen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede folgt der hebräischen Struktur, während die Wortstellung idiomatisch deutsch gestaltet ist.
