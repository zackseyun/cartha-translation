  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: de
  text: Salomo, der Sohn Davids, erstarkte in seiner Königsherrschaft[a]. Jahwe[b], sein Gott, war mit ihm und machte ihn überaus groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wurde in seiner Königsherrschaft stark“ oder „festigte seine Herrschaft über sein Königreich“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat hier den Gottesnamen JHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: erstarkte
  rationale: Das Hitpael von חזק kann reflexiv oder intransitiv ausdrücken, dass Salomo sich stärkte beziehungsweise stark wurde. „Erstarkte“ ist im Deutschen natürlich und wahrt die mögliche Eigenaktivität, ohne eine rein passive Einsetzung zu behaupten.
- source_word: עַל מַלְכוּתוֹ
  choice: in seiner Königsherrschaft
  rationale: עַל bezeichnet hier Salomos Stellung gegenüber seinem Königtum beziehungsweise Herrschaftsbereich. „In seiner Königsherrschaft“ gibt den Herrschaftsbezug idiomatisch wieder; die wörtlichere Alternative „über seinem Königreich“ wird in der Fußnote kenntlich gemacht.
- source_word: בֶן דָּוִיד
  choice: der Sohn Davids
  rationale: Die direkte Sohnesbezeichnung bewahrt den vom Chronisten hervorgehobenen dynastischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Die Possessivkonstruktion wird direkt wiedergegeben und bewahrt den persönlichen Bundesbezug.
- source_word: עִמּוֹ
  choice: war mit ihm
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Wendung für Gottes Gegenwart und Beistand.
- source_word: וַיְגַדְּלֵהוּ
  choice: machte ihn ... groß
  rationale: Der Piel-Stamm von גדל mit Objektsuffix bezeichnet das Großmachen oder Erhöhen einer Person. Die gewählte Form bewahrt die ausdrückliche göttliche Verursachung.
- source_word: לְמָעְלָה
  choice: überaus
  rationale: לְמָעְלָה dient hier adverbial zur Verstärkung. „Überaus“ gibt diese intensive Bedeutung prägnant und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Handlungsträgerschaft bei Salomos Aufstieg
  choice: Sowohl Salomos Erstarken als auch Gottes aktives Großmachen bleiben stehen.
  alternative: Salomos Erstarken ausschließlich passiv als göttliches Handeln oder ausschließlich als eigene Leistung darstellen.
  rationale: Der Vers nennt zunächst Salomos Erstarken und danach ausdrücklich Jahwes Gegenwart und Wirken. Die Übersetzung wahrt dieses Nebeneinander, ohne die Spannung zugunsten nur eines Handlungsträgers aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Königsherrschaft“ bewahrt den Bezug sowohl auf das Reich als auch auf die königliche Herrschaft; „erstarkte“ lässt die reflexive beziehungsweise intransitive Nuance des Hebräischen offen.
