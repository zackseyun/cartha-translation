  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: de
  text: Dort ging Salomo zu dem bronzenen Altar hinauf, der vor Jahwe beim Zelt der Begegnung stand, und brachte auf ihm tausend Brandopfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: ging dort ... hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. Die Formulierung bewahrt diese Richtung, ohne den missverständlichen Eindruck zu erwecken, Salomo sei auf den Altar selbst gestiegen.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: der bronzene Altar
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; im Zusammenhang mit dem Heiligtum ist »bronzener Altar« die geläufige und sachgerechte Wiedergabe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier die Stellung beziehungsweise Gegenwart vor Gott; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: der beim Zelt der Begegnung stand
  rationale: Die knappe hebräische Zuordnung mit ל wird hier lokativ verstanden. »Beim Zelt der Begegnung« ist natürliches Deutsch und lässt den Altar räumlich dem Zelt zugeordnet sein.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: brachte darauf ... Brandopfer dar
  rationale: עלה wird in dieser Verbindung als kultischer Ausdruck für das Darbringen eines Opfers verwendet. »Brandopfer darbringen« ist die übliche deutsche Wiedergabe.
- source_word: עֹלוֹת אָלֶף
  choice: tausend Brandopfer
  rationale: עֹלָה bezeichnet ein vollständig verbranntes Opfer; אָלֶף gibt eindeutig die Zahl tausend an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zuordnung des bronzenen Altars zum Zelt der Begegnung
  choice: der beim Zelt der Begegnung stand
  alternative: der zum Zelt der Begegnung gehörte
  rationale: Die Präposition ל erlaubt eine räumliche oder eine zuordnende Deutung. Die gewählte räumliche Formulierung passt zum Zusammenhang, ohne eine weitergehende Besitz- oder Zugehörigkeitsaussage ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zelt der Begegnung« gibt אֹהֶל מוֹעֵד verständlich und nah am hebräischen Ausdruck wieder; »Brandopfer darbringen« entspricht dem etablierten kultischen Sprachgebrauch.
