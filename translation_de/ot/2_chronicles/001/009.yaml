  variant: modern standard German
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: de
  text: Nun, Jahwe, Gott, möge dein Wort an David, meinen Vater, bestätigt werden; denn du hast mich zum König über ein Volk eingesetzt, das so zahlreich ist wie der Staub der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Möge deine Zusage an David, meinen Vater, sich erfüllen.“'
    reason: „Wort“ kann in diesem Zusammenhang eine Zusage meinen; יֵאָמֵן kann auch das Sich-Erfüllen beziehungsweise Sich-Bewahrheiten des Wortes bezeichnen.
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Leitet Salomos Bitte als zeitlichen und zugleich gliedernden Ausdruck natürlich ein.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Gibt den Gottesnamen יְהוָה als „Jahwe“ wieder und versteht אֱלֹהִים als nachgestellte Bezeichnung beziehungsweise Anrede.
- source_word: יֵאָמֵן
  choice: lass … Bestand haben
  rationale: Das Nifal von אמן bezeichnet hier den Wunsch, Gottes Wort möge sich als fest und verlässlich erweisen. „Bestand haben“ bewahrt diesen Grundgedanken und passt zu einer Gebetsbitte.
- source_word: דְּבָרְךָ
  choice: dein Wort
  rationale: Bewahrt die wörtliche Ausdrucksweise des Hebräischen, ohne die im Kontext naheliegende Bedeutung „Zusage“ bereits in den Haupttext einzutragen.
- source_word: עִם דָּוִיד אָבִי
  choice: das du David, meinem Vater, gegeben hast
  rationale: Die wörtliche Verbindung „dein Wort mit David“ wäre im Deutschen missverständlich. Die relative Formulierung gibt idiomatisch wieder, dass das Wort an David erging.
- source_word: כִּי
  choice: denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für Salomos Bitte.
- source_word: הִמְלַכְתַּנִי
  choice: du hast mich zum König … gemacht
  rationale: Gibt die kausative Bedeutung des Hifil von מלך klar und idiomatisch wieder.
- source_word: עַל עַם רַב
  choice: über ein Volk … so zahlreich
  rationale: רַב kann „groß“ oder „zahlreich“ bedeuten; der anschließende Vergleich mit dem Staub legt hier die zahlenmäßige Bedeutung nahe.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: wie der Staub der Erde
  rationale: Bewahrt das hebräische Bild für eine unübersehbar große Zahl in einer vertrauten deutschen Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Die Umschrift „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Ob דְּבָרְךָ ausdrücklich als Verheißung bezeichnet werden soll
  choice: dein Wort
  alternative: deine Zusage
  rationale: Im Zusammenhang ist eine göttliche Zusage gemeint; der Haupttext erhält jedoch die allgemeinere hebräische Formulierung und bewahrt damit deren sprachliche Offenheit.
- issue: Bedeutung von יֵאָמֵן im Blick auf Gottes Wort
  choice: Bestand haben
  alternative: sich erfüllen / bestätigt werden
  rationale: Die Form kann das Festwerden, Bestätigtwerden oder zuverlässige Eintreffen des Wortes ausdrücken. „Bestand haben“ vermeidet eine unnötige Einengung auf nur einen dieser Aspekte.
translation_notes:
  register: Moderne, würdige Gebetssprache. „Nun“ und „denn“ erhalten den gedanklichen Zusammenhang; die Satzstellung bleibt klar und gut vorlesbar. Der Gottesname wird als „Jahwe“ wiedergegeben.
