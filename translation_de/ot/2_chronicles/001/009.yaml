  to: Nun, Jahwe, Gott, möge dein Wort an David, meinen Vater, bestätigt werden; denn du hast mich zum König über ein Volk eingesetzt, das so zahlreich ist wie der Staub der Erde.[a]
  rationale: Die Revision vermeidet die zusätzliche Aussage, das Wort sei David „gegeben“ worden, und gibt die Wunschform von יֵאָמֵן mit einer im Deutschen natürlichen passiven Form wieder. Die Fußnote bewahrt die promissive und erfüllungsbezogene Deutungsmöglichkeit, ohne sie dem Haupttext aufzuzwingen.
