source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: de
  text: So gingen Salomo und die ganze Versammlung mit ihm zu der Kulthöhe in Gibeon, denn dort befand sich das Zelt der Begegnung Gottes, das Mose, der Diener Jahwes, in der Wüste angefertigt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: So gingen
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Gingen“ gibt הלך ohne eine im Verb nicht ausdrücklich enthaltene Richtungsangabe wieder; „so“ markiert den erzählerischen Anschluss.
- source_word: הַקָּהָל
  choice: die ganze Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft. „Versammlung“ ist im historischen Zusammenhang klar und weniger konfessionell geprägt als „Gemeinde“.
- source_word: לַבָּמָה
  choice: zu der Kulthöhe
  rationale: במה bezeichnet hier eine erhöhte Kultstätte. „Kulthöhe“ macht die gottesdienstliche Funktion verständlich, ohne in diesem Zusammenhang eine negative Wertung einzutragen.
- source_word: בְּגִבְעוֹן
  choice: in Gibeon
  rationale: Die Ortsangabe wird im Deutschen idiomatisch mit „in“ wiedergegeben; der Ortsname bleibt transliteriert.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für den Gang nach Gibeon ein. „Denn“ bewahrt den erzählenden Satzfluss und die kausale Beziehung.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wiedergabe bildet beide Bestandteile des hebräischen Heiligtumsbegriffs transparent ab und vermeidet den weniger unmittelbar verständlichen Traditionsausdruck „Stiftshütte“.
- source_word: הָאֱלֹהִים
  choice: Gottes
  rationale: Der Genitiv gibt die Zugehörigkeitsbeziehung zwischen dem Zelt der Begegnung und Gott natürlich wieder.
- source_word: עָשָׂה
  choice: angefertigt hatte
  rationale: Das Plusquamperfekt kennzeichnet die Herstellung als vorzeitig gegenüber dem erzählten Gang nach Gibeon; „angefertigt“ passt zum Bau beziehungsweise zur Herstellung des Zeltes.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: Bei Mose ist עבד eine ehrenvolle Bezeichnung seines Dienstverhältnisses. „Diener“ gibt diese Funktion angemessen wieder, ohne unnötig die mögliche Bedeutung „Sklave“ in den Vordergrund zu rücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die natürliche deutsche Wiedergabe für מדבר im Zusammenhang mit Israels Wüstenzeit.
theological_decisions:
- issue: במה im Zusammenhang legitimer Gottesverehrung vor dem Tempelbau
  choice: Kulthöhe
  alternative: Höhe; Höhenheiligtum
  rationale: Die Übersetzung benennt die kultische Funktion, ohne die an anderen Stellen mögliche negative Bewertung von Höhenheiligtümern in diesen Vers hineinzutragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer historischer Erzählweise. Traditionell schwer verständliche Kirchensprache wie „Stiftshütte“ wird vermieden; zugleich bleiben die kultischen und theologischen Begriffe des Ausgangstextes erkennbar.
