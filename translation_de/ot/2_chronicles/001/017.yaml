  text: וַֽ֠/יַּעֲלוּ וַ/יּוֹצִ֨יאוּ מִ/מִּצְרַ֤יִם מֶרְכָּבָה֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַֽ/חִתִּ֛ים וּ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יוֹצִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: de
  text: Sie bezogen aus Ägypten einen Streitwagen für sechshundert Schekel Silber[a] und ein Pferd für hundertfünfzig Schekel. Ebenso führten sie durch ihre Vermittlung[b] Streitwagen und Pferde an alle Könige der Hethiter und die Könige von Aram[c] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie brachten aus Ägypten herauf und heraus.“ Die gewöhnlichen Bewegungsverben stehen hier in einem Handelszusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch ihre Hand“. Das Idiom kann Vermittlung oder Ausführung durch die beteiligten Personen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Traditionell wird „Aram“ auch mit „Syrien“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Sie bezogen aus Ägypten
  rationale: Die beiden Bewegungsverben bedeuten wörtlich etwa „sie brachten hinauf und heraus“. Im Zusammenhang von Waren und Preisen gibt „bezogen aus Ägypten“ den Handelsvorgang natürlich wieder, ohne die im Deutschen missverständliche Perspektive von „importierten“ festzulegen.
- source_word: מֶרְכָּבָה
  choice: einen Streitwagen
  rationale: Das Substantiv bezeichnet hier den als einzelne Handelseinheit berechneten Streitwagen.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: für sechshundert Schekel Silber
  rationale: Der hebräische Text nennt sechshundert Einheiten Silber; „Schekel“ ergänzt die im Kontext vorausgesetzte Gewichtseinheit.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: und ein Pferd für hundertfünfzig Schekel
  rationale: סוּס ist das allgemeine Wort für „Pferd“. Die zuvor vorausgesetzte Einheit Schekel wird zur Klarheit auch beim zweiten Preis genannt.
- source_word: וְכֵן
  choice: Ebenso
  rationale: Die Wendung führt denselben Handelsvorgang in Bezug auf weitere Könige fort.
- source_word: בְּיָדָם
  choice: durch ihre Vermittlung
  rationale: Die Wendung „durch ihre Hand“ bezeichnet hier die beteiligten Händler oder Beauftragten als Vermittler des Geschäfts.
- source_word: יוֹצִיאוּ
  choice: führten ... aus
  rationale: Das Verb bezeichnet im zweiten Satzteil das Weiterliefern aus dem eigenen Handelsbereich an ausländische Könige; „ausführen“ bewahrt sowohl die Bewegungs- als auch die Handelsbedeutung.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: für alle Könige der Hetiter und die Könige von Aram
  rationale: Die Präposition לְ wird als Ziel beziehungsweise Empfängerkreis mit „für“ wiedergegeben. אֲרָם bleibt als Eigenname „Aram“ erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bezogen“ und „führten ... aus“ machen den Handelszusammenhang verständlich; die Fußnoten bewahren die wörtlichere Bewegungsformulierung und das hebräische Vermittlungsidiom.
