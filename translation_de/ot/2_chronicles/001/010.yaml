base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: de
  text: Gib mir nun Weisheit und Erkenntnis, damit ich vor diesem Volk aus- und eingehen kann[a]. Denn wer könnte dieses große Volk, dein Volk, richten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor diesem Volk hinausgehen und hineingehen“; eine Wendung für die Ausübung öffentlicher Führung.'
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: nun
  rationale: Das Wort leitet Salomos Bitte als folgernden beziehungsweise zeitlichen Übergang ein; „nun“ ist im Deutschen knapp und natürlich.
- source_word: חָכְמָה וּמַדָּע
  choice: Weisheit und Erkenntnis
  rationale: Die beiden unterschiedlichen Begriffe bleiben als Begriffspaar erhalten. „Erkenntnis“ gibt מַדָּע angemessen wieder, ohne es mit „Weisheit“ gleichzusetzen.
- source_word: תֶּן לִי
  choice: Gib mir
  rationale: Die direkte Bitte entspricht dem hebräischen Imperativ und ist klarer als das gehobenere „gewähre mir“.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: damit ich ... aus- und eingehen kann
  rationale: Die Kohortative bezeichnen hier den Zweck der Bitte. Die hebräische Bildsprache für die Ausübung öffentlicher beziehungsweise königlicher Führung bleibt erhalten.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: vor diesem Volk
  rationale: לִפְנֵי bedeutet wörtlich „vor“ beziehungsweise „vor den Augen von“; in Verbindung mit dem folgenden Idiom geht es um Führung an der Spitze des Volkes.
- source_word: מִי יִשְׁפֹּט
  choice: wer könnte ... richten
  rationale: Das Verb bezeichnet das Richten und schließt im königlichen Zusammenhang Rechtsprechung und Regierung ein. Der Konjunktiv gibt die rhetorische Frage nach der Befähigung natürlich wieder.
- source_word: עַמְּךָ ... הַגָּדוֹל
  choice: dieses dein großes Volk
  rationale: Die Formulierung bewahrt sowohl den Demonstrativbezug „dieses“ als auch die Zugehörigkeit zu Gott und lässt „groß“ seine mögliche Bedeutung von zahlreich und bedeutend behalten.
theological_decisions:
- issue: Führungsidiom in Salomos Bitte
  choice: Die Wendung „vor diesem Volk aus- und eingehen“ wird im Haupttext beibehalten.
  alternative: „dieses Volk führen“ oder „dieses Volk regieren“
  rationale: Die wörtlich nachvollziehbare Wendung bewahrt das Bild des Ausgangstextes und seine königliche Führungsnuance. Die Fußnote erklärt die Funktion, ohne sie im Haupttext auf eine einzige Paraphrase zu verengen.
- issue: Bedeutungsumfang von יִשְׁפֹּט
  choice: „richten“
  alternative: „regieren“
  rationale: Im Kontext eines Königs kann das Verb umfassenderes Regieren einschließen, bezeichnet aber ausdrücklich das Richten. Die Übersetzung erhält diese theologisch und sachlich wichtige Verbindung von Herrschaft und Rechtsprechung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Formulierung „dieses dein großes Volk“ folgt der hebräischen Wortfolge und hält Demonstrativbezug sowie Zugehörigkeit zusammen; die ungewöhnliche Führungswendung wird durch eine Fußnote erläutert.
