  rationale: Die Revision glättet die possessive Nominalgruppe zu modernem, würdigem Deutsch, ohne den Demonstrativbezug, die Gottesansprache oder „groß“ preiszugeben. Die nicht belastbare Alternativfußnote wird entfernt; die idiomatische Fußnote bleibt am zutreffenden Anker erhalten.
