reference: 2 Chronicles 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֨א שְׁלֹמֹ֜ה לַ/בָּמָ֤ה אֲשֶׁר בְּ/גִבְעוֹן֙ יְר֣וּשָׁלִַ֔ם מִ/לִּ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַ/יִּמְלֹ֖ךְ עַל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: de
  text: Dann kam Salomo von der Kulthöhe bei Gibeon nach Jerusalem[a], aus dem Bereich vor dem Zelt der Begegnung[b], und herrschte über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satzbau ist ungewöhnlich gedrängt und lautet formal etwa: »kam … zur Kulthöhe bei Gibeon, Jerusalem«. Aus dem Zusammenhang ergibt sich die hier wiedergegebene Bewegung von Gibeon nach Jerusalem.'
    reason: textual_syntax
  - marker: b
    text: 'Wörtlich: »von vor dem Zelt der Begegnung«; gemeint ist das Verlassen des Bereichs vor dem Heiligtum.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא kann je nach räumlichem Blickpunkt »kommen«, »gehen« oder »eintreten« bedeuten. »Kam … nach Jerusalem« gibt die im Zusammenhang erkennbare Bewegung natürlich wieder, ohne ausdrücklich das im Verb nicht enthaltene »kehrte zurück« einzufügen.
- source_word: לַבָּמָה
  choice: von der Kulthöhe
  rationale: במה bezeichnet hier eine für den Gottesdienst genutzte Höhe. Obwohl die Präposition formal »zur« lautet, verlangt der gedrängte Satzbau im Zusammenhang die Herkunftsangabe; diese syntaktische Schwierigkeit wird in der Fußnote offengelegt.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: bei Gibeon
  rationale: Die knappe Ortsangabe wird idiomatisch wiedergegeben und ordnet Gibeon eindeutig der Kulthöhe zu.
- source_word: יְרוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Jerusalem ist nach dem Kontext das Ziel von Salomos Bewegung. Die deutsche Wortstellung macht diese Beziehung deutlich.
- source_word: מִלִּפְנֵי
  choice: aus dem Bereich vor
  rationale: Die Wendung bedeutet wörtlich »von vor« und bezeichnet hier das Verlassen des Bereichs vor dem Heiligtum. Die gewählte Formulierung ist räumlich präzise und im Deutschen verständlich.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe bewahrt die beiden Bestandteile der hebräischen Bezeichnung und ist transparenter als das stärker traditionsgeprägte »Stiftshütte«.
- source_word: וַיִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: und herrschte über Israel
  rationale: מלך im Qal bezeichnet das Herrschen als König. Da Salomo bereits König ist, passt »herrschte« besser als »wurde König«.
theological_decisions:
- issue: Beziehung Jerusalems zur gedrängten hebräischen Satzfolge
  choice: Jerusalem wird als Ziel der Bewegung, die Kulthöhe bei Gibeon als Ausgangspunkt verstanden.
  alternative: Die hebräische Wortfolge könnte formal näher als »kam zur Kulthöhe bei Gibeon, Jerusalem« gespiegelt werden.
  rationale: Der unmittelbare Erzählzusammenhang berichtet zuvor von Salomos Aufenthalt in Gibeon und legt anschließend seine Bewegung nach Jerusalem nahe. Die Übersetzung macht diesen Sinn lesbar, während die Fußnote die ungewöhnliche Form des Hebräischen sichtbar hält.
- issue: Einordnung der Kulthöhe bei Gibeon
  choice: Der Ort wird neutral als »Kulthöhe« bezeichnet.
  alternative: Eine wertende Bezeichnung wie »unerlaubtes Höhenheiligtum« oder die erklärende Wiedergabe »Heiligtum auf der Höhe« wäre möglich.
  rationale: Der Vers verbindet diesen Ort mit dem Zelt der Begegnung und äußert hier keine Verurteilung. Deshalb wird weder eine negative noch eine konfessionell geprägte Deutung hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Kulthöhe« ist fachlich präzise, aber noch allgemein verständlich; »Zelt der Begegnung« hält die hebräische Benennung transparent. Die Satzstellung wurde für natürliches Deutsch geordnet, ohne die syntaktische Spannung des Ausgangstextes zu verschweigen.
