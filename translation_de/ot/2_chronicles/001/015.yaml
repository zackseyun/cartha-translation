base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: de
  text: Der König machte Silber und Gold in Jerusalem so gewöhnlich wie Steine[a] und machte die Zedern so reichlich wie die Maulbeerfeigenbäume in der Schefela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie Steine“. Der hebräische Vergleich beschreibt außergewöhnliche Fülle.'
    reason: lexical_alternative
  - marker: b
    text: Die Schefela ist das judäische Hügelland zwischen dem Bergland und der Küstenebene.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: machte ... so gewöhnlich / so reichlich
  rationale: 'נתן bedeutet meist „geben“ oder „setzen“, hat hier mit dem Akkusativobjekt und dem Vergleich jedoch resultativ-kausativen Sinn: Der König sorgte dafür, dass diese Güter in großer Menge vorhanden waren.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: Silber und Gold
  rationale: Im Deutschen werden Stoff- und Sammelbezeichnungen in dieser Aussage natürlich ohne Artikel gebraucht; die bestimmten hebräischen Formen bezeichnen die betreffenden Edelmetalle als Güter.
- source_word: כָּאֲבָנִים
  choice: so gewöhnlich wie Steine
  rationale: Wörtlich „wie Steine“. Der Vergleich drückt aus, dass Silber und Gold außerordentlich häufig und leicht verfügbar waren, nicht dass sie stofflich Steinen glichen.
- source_word: הָאֲרָזִים
  choice: Zedernholz
  rationale: Der Plural kann Zedern beziehungsweise das von ihnen gewonnene Baumaterial bezeichnen. Im Kontext königlichen Reichtums und von Bauressourcen ist „Zedernholz“ im Deutschen eindeutig und natürlich.
- source_word: כַשִּׁקְמִים
  choice: wie die Maulbeerfeigenbäume
  rationale: שׁקמה bezeichnet den in der Region verbreiteten Maulbeerfeigenbaum (Ficus sycomorus), nicht die Platane, die im Deutschen oft „Sykomore“ genannt wird.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: im Hügelland
  rationale: Die Schefela ist das niedrige Hügelland zwischen dem judäischen Bergland und der Küstenebene. „Hügelland“ gibt die Landschaftsform verständlich wieder; die genauere geografische Bezeichnung steht in der Fußnote.
- source_word: לָרֹב
  choice: so reichlich
  rationale: לָרֹב bezeichnet große Menge oder Fülle. Die Wiedergabe wird natürlich in den Vergleich einbezogen.
