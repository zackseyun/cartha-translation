revisions:
- from: Und der bronzene Altar, den Bezalel, der Sohn Uris, des Sohnes Hurs, gemacht hatte, stand dort vor der Wohnung Jahwes. Salomo und die Versammlung suchten ihn dort auf.[a]
  to: Und der bronzene Altar, den Bezalel, der Sohn Uris, des Sohnes Hurs, gemacht hatte, stand vor der Stiftshütte Jahwes. Salomo und die Versammlung suchten ihn auf.[a]
  rationale: Die Revision wahrt die im Hebräischen vorhandene Mehrdeutigkeit des maskulinen Suffixes, ohne im Haupttext durch „dort“ oder die stark personale Wendung „dort aufsuchen“ eine Deutung unnötig zu bevorzugen. „Stiftshütte“ benennt מִשְׁכָּן im konkreten kultischen Kontext präzise und in modernem Standarddeutsch verständlich. Die Fußnote dokumentiert beide möglichen Bezüge, ohne eine theologische Entscheidung zu erzwingen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:05:58Z'
review_pass:
  verdict: revise
  source_fidelity: Der Text gibt Altar, Abstammungsangabe, Standort und die versammelte Gruppe zutreffend wieder. Beim Suffix in וַיִּדְרְשֵׁהוּ ist der Bezug jedoch nicht sicher entscheidbar; der unmittelbar vorher genannte Altar ist der naheliegende grammatische Bezug, während ein Bezug auf Jahwe aufgrund des Verbs und des kultischen Kontexts möglich bleibt. Der Haupttext darf diese Mehrdeutigkeit nicht durch die spezifisch personale Nuance von „aufsuchen“ einengen.
  naturalness: „Stand dort vor der Wohnung Jahwes“ ist verständlich, aber „dort“ ist nicht eigens im Hebräischen ausgedrückt und wirkt zusammen mit „vor“ redundant. „Vor der Stiftshütte Jahwes“ bezeichnet den konkreten kultischen Gegenstand idiomatischer und präziser. „Suchten ihn dort auf“ legt im heutigen Deutsch eher eine Person als Ziel nahe.
  terminology: „Bronzener Altar“, „Salomo“ und „Versammlung“ sind passend. Für מִשְׁכָּן ist „Stiftshütte“ als etablierte Bezeichnung des Heiligtumszelts genauer als das zu allgemeine „Wohnung“. Die Fußnote muss sprachlich korrekt formulieren und klarstellen, dass die deutsche Formulierung beide maskulinen Bezugswörter abbildet.
  issues:
  - severity: medium
    issue: Die Wendung „suchten ihn dort auf“ bevorzugt pragmatisch einen persönlichen Bezug.
    rationale: „Jemanden aufsuchen“ ist im modernen Deutsch die normale Lesart; für den Altar ist die Wendung weniger naheliegend. Da das hebräische Suffix mehrdeutig ist, sollte der Haupttext neutraler formuliert sein.
  - severity: low
    issue: „dort“ bei der Standortangabe des Altars ist eine unnötige explizite Ergänzung.
    rationale: שָׂם beschreibt das Aufgestelltsein; die präzise Ortsbestimmung folgt mit „vor der Stiftshütte Jahwes“. Ein zusätzliches „dort“ ist nicht erforderlich.
  - severity: low
    issue: Die Fußnote enthält eine grammatisch missglückte Formulierung und wiederholt als Alternative denselben deutschen Wortlaut ohne dessen unterschiedliche Referenz deutlich zu erläutern.
    rationale: Nicht „‚Ihn‘ kann sich ... beziehen“, sondern „Das Suffix/Pronomen kann sich ... beziehen“. Die beiden möglichen Referenten müssen explizit benannt werden.
  revised_text: Und der bronzene Altar, den Bezalel, der Sohn Uris, des Sohnes Hurs, gemacht hatte, stand vor der Stiftshütte Jahwes. Salomo und die Versammlung suchten ihn auf.[a]
  revised_footnotes:
  - marker: a
    text: Das hebräische Objektsuffix ist mehrdeutig. Es kann sich auf den bronzenen Altar beziehen; wegen der Verwendung von „suchen“ im kultischen Zusammenhang ist auch ein Bezug auf Jahwe möglich.
    reason: alternative_reading
  revision_rationale: Die Revision wahrt die im Hebräischen vorhandene Mehrdeutigkeit des maskulinen Suffixes, ohne im Haupttext durch „dort“ oder die stark personale Wendung „dort aufsuchen“ eine Deutung unnötig zu bevorzugen. „Stiftshütte“ benennt מִשְׁכָּן im konkreten kultischen Kontext präzise und in modernem Standarddeutsch verständlich. Die Fußnote dokumentiert beide möglichen Bezüge, ohne eine theologische Entscheidung zu erzwingen.
