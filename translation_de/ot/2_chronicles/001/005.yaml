source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: de
  text: Und der bronzene Altar, den Bezalel, der Sohn Uris, des Sohnes Hurs, gemacht hatte, stand vor der Stiftshütte Jahwes. Salomo und die Versammlung suchten ihn auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Objektsuffix ist mehrdeutig. Es kann sich auf den bronzenen Altar beziehen; wegen der Verwendung von „suchen“ im kultischen Zusammenhang ist auch ein Bezug auf Jahwe möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: Und der bronzene Altar
  rationale: מִזְבֵּחַ bezeichnet einen Altar; נְחֹשֶׁת wird bei diesem Kultgerät sachgemäß mit „Bronze“ wiedergegeben. Das וּ führt die Erzählung fort.
- source_word: אֲשֶׁר עָשָׂה
  choice: den … gemacht hatte
  rationale: Der Relativsatz bestimmt den Altar näher; das Plusquamperfekt macht deutlich, dass seine Herstellung vor der erzählten Situation lag.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezalel, der Sohn Uris, des Sohnes Hurs
  rationale: Die Abstammungsfolge wird vollständig bewahrt und in natürliches, würdiges Deutsch gefasst.
- source_word: שָׂם
  choice: stand dort
  rationale: Wörtlich liegt ein Setzen oder Aufstellen vor; in Bezug auf den Altar beschreibt „stand dort“ idiomatisch den daraus entstandenen Zustand, ohne einen nicht genannten Handelnden einzuführen.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: vor der Wohnung Jahwes
  rationale: לִפְנֵי ist hier räumlich „vor“. מִשְׁכָּן bedeutet „Wohnung/Wohnstätte“ und bezeichnet das Heiligtumszelt; „Wohnung“ bewahrt das zugrunde liegende Bild. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: suchten ihn dort auf
  rationale: דרשׁ mit Objektsuffix kann „suchen/aufsuchen“ oder „befragen“ bedeuten. Das maskuline Suffix kann auf Jahwe bezogen werden; „dort“ stellt den räumlichen Zusammenhang her. Die mögliche Beziehung auf den Altar bleibt in der Fußnote sichtbar.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Salomo und die Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft; „Versammlung“ ist im öffentlichen Gottesdienst klar und gegenwärtig verständlich.
theological_decisions:
- issue: Bezugswort des Suffixes in וַיִּדְרְשֵׁהוּ
  choice: 'Das Suffix wird auf Jahwe bezogen: „Salomo und die Versammlung suchten ihn dort auf.“'
  alternative: 'Das Suffix kann auf den bronzenen Altar bezogen werden: „Salomo und die Versammlung suchten ihn dort auf“, wobei „ihn“ dann den Altar meint; möglich ist auch sinngemäß „suchten ihn dort“ beziehungsweise „wandten sich dort an ihn“ mit Jahwe als Bezug.'
  rationale: דרשׁ hat häufig Gott als persönliches Objekt, und die unmittelbar vorausgehende Nennung der Wohnung Jahwes stützt diesen Bezug. Grammatisch ist jedoch auch der maskuline Altar ein mögliches Bezugswort. Die Übersetzung entscheidet sich im Haupttext für Jahwe, dokumentiert die echte Mehrdeutigkeit aber ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch Satzteilung lesbarer. „Wohnung“ gibt מִשְׁכָּן transparent wieder; „Jahwe“ folgt der vorgelegten Namensform. Die Mehrdeutigkeit des maskulinen Suffixes wird nicht verschwiegen.
