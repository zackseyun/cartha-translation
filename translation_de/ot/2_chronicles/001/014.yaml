  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: de
  text: Salomo sammelte Streitwagen und Reiter[a] und hatte 1.400 Streitwagen und 12.000 Reiter. Er stationierte sie in den Streitwagenstädten[b] und beim König in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kavallerie“. Das hebräische Wort bezeichnet berittene Kämpfer; „Reiter“ ist die unmittelbarere Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: Das heißt, eigens dafür bestimmte Städte, in denen Streitwagen untergebracht oder Streitwageneinheiten als Garnisonen stationiert waren.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: sammelte
  rationale: אסף bedeutet gewöhnlich „sammeln“ oder „zusammentragen“; „sammelte“ gibt das Anhäufen militärischer Mittel knapp und ohne zusätzliche Deutung wieder.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: רכב kann kollektiv die Streitwagentruppe bezeichnen; wegen der ausdrücklichen Zahl von 1.400 ist hier die konkrete Wiedergabe „Streitwagen“ am klarsten.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Substantiv bezeichnet berittene Männer beziehungsweise Reiter, nicht bloß die Pferde. „Reiter“ ist im heutigen Deutsch natürlich und weniger modern-militärisch geprägt als „Kavallerie“.
- source_word: וַיְהִי לוֹ
  choice: er besaß
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich „es war ihm“; „er besaß“ gibt sie idiomatisch wieder und vermeidet eine mögliche Verwechslung mit der zuvor beschriebenen Tätigkeit des Sammelns.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 Streitwagen
  rationale: Die exakte Zahl wird in gebräuchlicher deutscher Zahlenschreibung wiedergegeben.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 Reiter
  rationale: Die exakte Zahl wird in gebräuchlicher deutscher Zahlenschreibung wiedergegeben.
- source_word: וַיַּנִּיחֵם
  choice: er stationierte sie
  rationale: Die Kausativform bezeichnet hier das Unterbringen beziehungsweise Platzieren militärischer Kräfte an zugewiesenen Orten; „stationierte“ trifft den Kontext.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: in den Wagenstädten
  rationale: Die Genitivverbindung bezeichnet eigens mit Streitwagen verbundene Lager- oder Garnisonsstädte. „Wagenstädte“ ist knapp; die genauere kulturelle Einordnung steht in der Fußnote.
- source_word: וְעִם הַמֶּלֶךְ
  choice: und beim König
  rationale: Das Hebräische sagt schlicht „und mit/beim König“. „Beim König“ bezeichnet hier den Standort, ohne das nur implizierte „einen Teil davon“ in den Haupttext einzufügen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche deutsche Namensform und natürliche Wiedergabe der Präposition.
theological_decisions: []
