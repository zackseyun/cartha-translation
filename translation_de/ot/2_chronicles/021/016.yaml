  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: de
  text: Und Jahwe stachelte den Geist der Philister und der Araber, die nahe bei den Kuschitern lebten, gegen Joram auf.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weckte“ beziehungsweise „reizte … auf“. Das hebräische Verb beschreibt, dass Jahwe diese Völker zu feindlichem Vorgehen gegen Joram veranlasste.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die neben den Kuschitern waren“. Die Relativklausel bezieht sich auf die Araber und bezeichnet wahrscheinlich ihre geografische Nähe zu den Kuschitern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: stachelte … auf
  rationale: Das Verb bezeichnet hier das Hervorrufen beziehungsweise Anfachen feindlichen Handelns. „stachelte … auf“ gibt die aktive Verursachung durch Jahwe natürlich und deutlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל יְהוֹרָם
  choice: gegen Joram
  rationale: עַל bezeichnet in diesem feindlichen Zusammenhang die Ausrichtung gegen Joram.
- source_word: רוּחַ
  choice: den Geist
  rationale: „Geist“ bewahrt die Bildsprache und Mehrdeutigkeit von רוּחַ als antreibende innere Haltung beziehungsweise Impuls, ohne sie auf „Feindseligkeit“ zu verengen.
- source_word: הַפְּלִשְׁתִּים וְהָעַרְבִים
  choice: der Philister und der Araber
  rationale: Übliche deutsche Bezeichnungen der antiken Volksgruppen; beide Genitive hängen gemeinsam von „Geist“ ab.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: die in der Nähe der Kuschiter lebten
  rationale: עַל־יַד hat hier am ehesten eine räumliche Bedeutung („neben, nahe bei“). Das ergänzte „lebten“ macht den geografischen Bezug im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Göttliche Verursachung des feindlichen Vorgehens gegen Joram
  choice: Jahwe stachelte den Geist der Völker aktiv auf.
  alternative: Jahwe ließ lediglich eine schon vorhandene Feindseligkeit zu.
  rationale: Das hebräische Verb schreibt Jahwe unmittelbar das Aufstacheln zu. Die Übersetzung erhält diese theologische Spannung und schwächt die Aussage nicht zu bloßer Zulassung ab.
- issue: Bedeutung von רוּחַ
  choice: „Geist“ als bewusst offene Wiedergabe
  alternative: „Feindseligkeit“ oder „Gesinnung“
  rationale: Der Kontext weist auf einen feindlichen Antrieb, doch das konkrete Wort „Geist“ sollte nicht durch eine engere Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wurde gegenüber dem Hebräischen leicht geglättet; „Geist“ bleibt als prägnante hebräische Bildsprache erhalten. Die Relativklausel bezieht sich grammatisch und sachlich auf die Araber.
