  register: Würdevoller, knapper Stil einer königlichen Todes- und Thronfolgenotiz. Das hebräische Sterbeidiom bleibt im Haupttext erkennbar, wird aber durch „Vorfahren“ für heutige Leser verständlicher formuliert.
