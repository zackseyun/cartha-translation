base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: de
  text: Joschafat legte sich zu seinen Vorfahren[a] und wurde mit seinen Vorfahren in der Stadt Davids begraben. Sein Sohn Jehoram wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das ist eine hebräische Umschreibung für seinen Tod; wörtlich: »legte sich zu seinen Vätern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Bewahrt das hebräische Sterbeidiom und seinen würdevollen, formelhaften Ton. „Vorfahren“ ist im heutigen Deutsch natürlicher und sachlich genauer als „Väter“.
- source_word: וַיִּקָּבֵר
  choice: wurde ... begraben
  rationale: Direkte und natürliche Wiedergabe der passiven Verbform.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Bewahrt die geläufige biblische Ortsbezeichnung.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb den Regierungsantritt; diese Formulierung klingt im modernen Deutsch natürlicher als „regierte an seiner Stelle“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt die Nachfolgebeziehung eng und idiomatisch wieder.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: יְהוֹרָם
  choice: Joram
  rationale: Verwendet die im deutschen Bibelgebrauch geläufige Form für יְהוֹרָם; sie ist von der ebenfalls möglichen Form „Jehoram“ zu unterscheiden.
theological_decisions: []
