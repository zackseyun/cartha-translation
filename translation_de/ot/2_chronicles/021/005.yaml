- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition בְּ mit dem Infinitiv und Suffix bezeichnet hier den Zeitpunkt seines Regierungsantritts.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: und regierte acht Jahre
  rationale: מָלַךְ bezeichnet das Herrschen als König; zusammen mit der Zeitangabe ergibt sich die natürliche deutsche Wendung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ ist hier lokal und bezeichnet Jerusalem als Ort beziehungsweise Regierungssitz.
