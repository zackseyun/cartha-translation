  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: de
  text: Und nach all dem schlug Jahwe ihn in seinen Eingeweiden mit einer unheilbaren Krankheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחֲרֵי כָּל זֹאת
  choice: Und nach all dem
  rationale: Bewahrt den hebräischen Anschluss וְ und den zusammenfassenden Rückverweis auf die vorausgehenden Ereignisse in natürlichem Deutsch.
- source_word: נְגָפ/וֹ
  choice: schlug ihn
  rationale: Gibt die kraftvolle Aussage eines von Gott ausgehenden Schlages wieder, ohne die genaue Wirkungsweise über den Text hinaus festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt es durch einen Titel zu ersetzen.
- source_word: בְּ/מֵעָי/ו
  choice: im Darm
  rationale: מֵעֶה bezeichnet hier die inneren Organe, besonders den Darm; die Formulierung ist anatomisch verständlich und modernes Deutsch.
- source_word: לָ/חֳלִי
  choice: mit einer Krankheit
  rationale: Drückt den durch den Schlag herbeigeführten Krankheitszustand idiomatisch aus.
- source_word: לְ/אֵין מַרְפֵּא
  choice: unheilbaren
  rationale: Gibt die Wendung »ohne Heilung« prägnant wieder und bezieht sie natürlich auf die Krankheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den persönlichen Gottesnamen; die Transliteration erhält diese Unterscheidung gegenüber einem bloßen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Satzstruktur folgt dem hebräischen Erzählfluss; »im Darm« vermeidet das heute missverständliche oder altertümliche »in den Eingeweiden«.
