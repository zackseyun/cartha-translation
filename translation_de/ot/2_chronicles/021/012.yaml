source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: de
  text: 'Da kam ein Brief von dem Propheten Elia zu ihm. Darin stand: »So spricht Jahwe, der Gott deines Vaters David: Weil du weder auf den Wegen deines Vaters Joschafat noch[a] auf den Wegen Asas, des Königs von Juda, gegangen bist,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »und«. Nach einer Verneinung gibt das Deutsche die Verbindung hier natürlich mit »weder … noch« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Da kam ein Brief ... zu ihm
  rationale: Das Verb steht im Singular und hat מִכְתָּב als nachgestelltes Subjekt. Die Formulierung bildet die hebräische Satzstruktur natürlich im Deutschen ab; »Da« gibt das narrative וַ wieder.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: von dem Propheten Elia
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; der Titel wird direkt übersetzt.
- source_word: לֵאמֹר
  choice: Darin stand
  rationale: Da ein Brief die folgende Botschaft vermittelt, ist dies im Deutschen natürlicher als das wörtliche »indem er sagte«, ohne dem Inhalt etwas hinzuzufügen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in ihrer geläufigen, würdigen deutschen Form wiedergegeben. Das Tetragramm erscheint als Gottes Eigenname »Jahwe«.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: der Gott deines Vaters David
  rationale: Die deutsche Wortstellung ist natürlich und lässt »Vater« entsprechend dem dynastischen Zusammenhang auch im weiteren Sinn von Vorfahr verstehen.
- source_word: תַּחַת אֲשֶׁר
  choice: Weil
  rationale: Die Wendung führt hier den Grund für das anschließend angekündigte Gericht ein; »weil« gibt diese kausale Funktion klar und gegenwärtig wieder.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: du weder auf den Wegen ... noch auf den Wegen ... gegangen bist
  rationale: »Gehen auf den Wegen« bewahrt das hebräische Bild für Lebensführung. Die deutsche Verbindung »weder ... noch« gibt die verneinte Koordination idiomatisch wieder.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: deines Vaters Joschafat
  rationale: »Joschafat« ist die etablierte deutsche Namensform; אָבִיךָ wird ausdrücklich beibehalten.
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Der Titel wird als deutsche Apposition wiedergegeben und der Name entsprechend dem deutschen Kasus flektiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אָבִיךָ bei David
  choice: deines Vaters David
  alternative: deines Vorfahren David
  rationale: Die wörtliche Wiedergabe bewahrt die dynastische und verwandtschaftliche Ausdrucksweise des Textes, ohne sie auf unmittelbare Vaterschaft zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Weg-Metaphorik und der geläufigen prophetischen Formel »So spricht …«. Der abschließende Beistrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
