  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: de
  text: Als Joram die Herrschaft über das Königreich seines Vaters angetreten und seine Stellung gefestigt hatte, tötete er alle seine Brüder mit dem Schwert und auch einige der Obersten Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige der Amtsträger Israels“ oder „einige der Befehlshaber Israels“. Das hebräische Wort bezeichnet hochrangige Herrscher, Befehlshaber oder Verwaltungsbeamte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: die Herrschaft über das Königreich seines Vaters angetreten hatte
  rationale: Die Wendung bezeichnet im königlichen Zusammenhang den Herrschaftsantritt. Diese Wiedergabe drückt sowohl den Übergang zur Herrschaft als auch die durch עַל bezeichnete Autorität über das Königreich idiomatisch aus.
- source_word: וַיִּתְחַזַּק
  choice: seine Stellung gefestigt hatte
  rationale: Der Hitpael bezeichnet hier reflexives Erstarken. Im Zusammenhang der Thronbesteigung gibt die Formulierung die Konsolidierung seiner Macht natürlich wieder, ohne sie ausschließlich militärisch zu deuten.
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: tötete er alle seine Brüder mit dem Schwert
  rationale: Die Wiedergabe ist klar, modern und bewahrt sowohl den ausdrücklichen Bezug auf männliche Geschwister als auch den instrumentalen Sinn von בֶּחָרֶב.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: und auch einige von den führenden Männern Israels
  rationale: Das präfigierte מִן wird partitiv als „einige von“ ausgedrückt. שָׂרִים bezeichnet hochrangige Amtsträger oder Führungspersonen; „führende Männer“ ist im Deutschen verständlich und lässt die genaue Amtsstellung offen.
theological_decisions:
- issue: Bezugsbereich von „Israel“
  choice: Israel unverändert beibehalten
  alternative: Juda; das Volk
  rationale: Der Chronist kann „Israel“ auch in einem weiteren bundesgeschichtlichen oder dynastischen Sinn verwenden. Die Übersetzung löst diese historische Spannung nicht durch eine Einengung auf Juda auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Joram“ folgt der im Deutschen geläufigen Namensform. Die zeitliche Unterordnung mit „Als … hatte“ bildet die Ereignisfolge natürlich ab; ein nicht ausdrücklich vorhandenes „Nun“ wurde nicht ergänzt.
