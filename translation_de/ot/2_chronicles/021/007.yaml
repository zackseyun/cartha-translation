source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: de
  text: 'Doch Jahwe wollte das Haus Davids nicht vernichten, um des Bundes willen, den er mit David geschlossen hatte, und wie er gesagt hatte: Er werde ihm und seinen Söhnen[c] eine Leuchte[a] für alle Zeiten[b] geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Licht“. Das hebräische Bild bezeichnet hier wahrscheinlich den Fortbestand der Linie oder Herrschaft Davids.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle Tage“; die Wendung kann in diesem Zusammenhang auch mit „für immer“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher gegliedert: „ihm eine Leuchte und seinen Söhnen“. Die hebräische Formulierung nennt David und seine Söhne als Empfänger der Leuchte.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Doch … wollte … nicht
  rationale: אָבָה bezeichnet Willen oder Bereitschaft. „Wollte … nicht“ gibt diesen volitionalen Sinn natürlich wieder; „Doch“ markiert den Gegensatz zum vorausgehenden Gerichtsgeschehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift bewahrt den Gottesnamen als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: לְהַשְׁחִית
  choice: vernichten
  rationale: Der Hifil von שׁחת bezeichnet hier die vollständige Zerstörung des davidischen Hauses. „Vernichten“ ist im Deutschen klar und dem Ernst des Zusammenhangs angemessen.
- source_word: בֵּית דָּוִיד
  choice: das Haus Davids
  rationale: Die biblische dynastische Wendung bleibt erhalten; „Dynastie Davids“ wäre bereits eine erklärende Auflösung des Bildes.
- source_word: לְמַעַן הַבְּרִית
  choice: um des Bundes willen
  rationale: Die Formulierung gibt Grund und Beweggrund wieder und bewahrt zugleich den feierlichen, bündischen Sprachklang.
- source_word: כָּרַת ... לְדָוִיד
  choice: mit David geschlossen hatte
  rationale: Das hebräische Idiom „einen Bund schneiden“ wird im Deutschen sachgerecht mit „einen Bund schließen“ wiedergegeben; לְדָוִיד bezeichnet hier David als Bundespartner.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: und entsprechend dem, was er gesagt hatte
  rationale: Die Wiedergabe hält sich an „gesagt“ und macht den Satzanschluss im Deutschen verständlich, ohne das Wort ausdrücklich zu „versprochen“ zu verstärken.
- source_word: לָתֵת לוֹ נִיר
  choice: er werde ihm … eine Leuchte geben
  rationale: Die indirekte Rede fügt sich natürlich an „gesagt hatte“ an. „Leuchte“ bewahrt das dynastische Bild von נִיר, ohne es als „Herrschaft“ oder „Dynastie“ auszudeuten.
- source_word: וּלְבָנָיו
  choice: und seinen Söhnen
  rationale: Die konkrete Bezeichnung „Söhne“ bleibt erhalten; die weiterreichende dynastische Bedeutung wird nicht in den Haupttext eingetragen.
- source_word: כָּל הַיָּמִים
  choice: für alle Zeiten
  rationale: Die deutsche Wendung gibt das wörtliche „alle Tage“ idiomatisch wieder, ohne die zeitliche Aussage unnötig zu präzisieren.
theological_decisions:
- issue: Dynastisches Bild נִיר im Zusammenhang des Davidbundes
  choice: Leuchte
  alternative: Licht; fortbestehende Dynastie
  rationale: „Leuchte“ erhält das biblische Bild für das Fortbestehen von Davids Linie und Herrschaft und vermeidet, seine theologische Tragweite im Haupttext erklärend festzulegen.
- issue: Zeitliche Reichweite von כָּל הַיָּמִים
  choice: für alle Zeiten
  alternative: für immer; alle Tage
  rationale: Die gewählte Formulierung lässt die idiomatische Weite der Aussage stehen. „Für immer“ könnte stärker als ausdrückliche metaphysische Unendlichkeit verstanden werden, während „alle Tage“ im heutigen Deutsch weniger natürlich klingt.
- issue: Empfänger der verheißenen Leuchte
  choice: ihm und seinen Söhnen
  alternative: ihm eine Leuchte und seinen Söhnen
  rationale: Die natürliche deutsche Koordination versteht David und seine Söhne gemeinsam als Empfänger. Die elliptische Form des Hebräischen wird in einer Fußnote kenntlich gemacht, ohne daraus eine abweichende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem Hebräischen erkennbar nahe, wird aber durch Doppelpunkt und indirekte Rede lesbar gegliedert. Bündische und dynastische Schlüsselbilder („Bund“, „Haus Davids“, „Leuchte“) werden nicht interpretierend aufgelöst.
