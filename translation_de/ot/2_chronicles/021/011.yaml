source:
  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: de
  text: Auch er errichtete Kulthöhen im Bergland von Juda, verleitete die Einwohner Jerusalems zur Prostitution[a] und führte Juda in die Irre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verleitete die Einwohner Jerusalems zur Untreue“. Das Hebräische gebraucht die Sprache der Prostitution auch als Bild für religiöse Untreue und Abfall.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „trieb Juda weg“; gemeint ist im Zusammenhang die Abkehr vom HERRN.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Auch er
  rationale: Bewahrt sowohl die additive als auch die hervorhebende Funktion der hebräischen Wendung.
- source_word: עָשָׂה בָמוֹת
  choice: errichtete Kulthöhen
  rationale: עָשָׂה bezeichnet hier das Anlegen oder Errichten; „Kulthöhen“ ist im Deutschen die verständliche Bezeichnung für solche Höhenheiligtümer und macht ihre kultische Funktion deutlich.
- source_word: בְּהָרֵי יְהוּדָה
  choice: im Bergland von Juda
  rationale: הָרִים kann Berge, Hügel oder eine Bergregion bezeichnen; hier passt die geografische Regionsbezeichnung „Bergland“.
- source_word: וַיֶּזֶן
  choice: verleitete … zur Untreue
  rationale: Die kausative Form von זנה bedeutet, jemanden zur Hurerei beziehungsweise Prostitution zu bringen. Im Zusammenhang mit Kulthöhen trägt sie zugleich die bildhafte Bedeutung religiöser und bundesbezogener Untreue; „Untreue“ bewahrt diese Spannung ohne eine ausschließlich sexuelle Deutung festzulegen.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Gibt die substantivierte Partizipialkonstruktion präzise und in natürlichem Deutsch wieder.
- source_word: וַיַּדַּח אֶת יְהוּדָה
  choice: führte Juda in die Irre
  rationale: Die Hifil-Form von נדח kann „wegtreiben“ oder „irreführen“ bedeuten. Im Kontext bezeichnet sie das Verleiten Judas zum Abfall.
theological_decisions:
- issue: Sexuelle oder religiöse Bedeutung von זנה
  choice: Im Haupttext „zur Untreue“; die konkrete Prostitutionsmetapher in der Fußnote
  alternative: „zur Prostitution“ oder „zur Hurerei“
  rationale: Der kultische Kontext legt religiöse Untreue nahe, doch das hebräische Wort behält seine sexuelle Bildwelt. Haupttext und Fußnote bewahren gemeinsam beide Ebenen.
- issue: Ob das Ziel des Abirrens ausdrücklich als Abkehr vom HERRN benannt wird
  choice: „führte Juda in die Irre“ ohne ergänztes Objekt
  alternative: „trieb Juda vom HERRN weg“
  rationale: Die Abkehr vom HERRN ist sachlich mitgemeint, wird im hebräischen Vers jedoch nicht ausdrücklich genannt; deshalb wird sie nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ ist verständlicher und sachlich genauer als das missverständliche „Höhen“. Die Formulierungen lassen die knappe Satzstruktur und die theologische Spannung des Hebräischen bestehen.
