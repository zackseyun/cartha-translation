  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: de
  text: Zu seiner Zeit lehnte sich Edom gegen die Herrschaft Judas auf und setzte einen König über sich ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Edom rebellierte von unter der Hand Judas und setzte einen König über sich ein.“ „Unter der Hand“ ist eine hebräische Bildformel für Herrschaft oder Kontrolle.'
    reason: Die Fußnote bewahrt die konkrete hebräische Herrschaftsmetapher und erläutert sie in verständlichem Deutsch.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Die temporale Wendung bezeichnet die Regierungszeit Jorams. „Zu seiner Zeit“ ist im modernen Deutschen natürlich und bewahrt den Bezug auf die betreffende Epoche.
- source_word: פָּשַׁע
  choice: lehnte sich … auf
  rationale: Das Verb bezeichnet hier im politischen Zusammenhang den Aufstand beziehungsweise die Lossagung von Judas Oberherrschaft, nicht eine abstrakte sittliche Übertretung.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Die herkömmliche deutsche Wiedergabe des Orts- und Volksnamens wird beibehalten.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: gegen die Herrschaft Judas
  rationale: Wörtlich steht „unter der Hand Judas“. Gemeint ist Judas Herrschaft oder Verfügungsgewalt; die deutsche Formulierung gibt den politischen Sinn klar wieder.
- source_word: וַיַּמְלִיכוּ
  choice: setzte … ein
  rationale: Der Hifil von מלך bedeutet hier, jemanden zum König zu machen beziehungsweise als König einzusetzen.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: einen eigenen König
  rationale: Wörtlich heißt es „einen König über sich“. „Einen eigenen König“ drückt im Kontext knapp und idiomatisch aus, dass die Edomiter für sich selbst einen König einsetzten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die politische Aussage wird idiomatisch wiedergegeben; die hebräische Metapher „unter der Hand“ bleibt in der Fußnote sichtbar.
