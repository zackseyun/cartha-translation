base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: de
  text: 'Ihr Vater gab ihnen viele Geschenke: Silber, Gold und Kostbarkeiten[a] sowie befestigte Städte in Juda. Das Königreich aber gab er Joram, denn er war der Erstgeborene.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgewählte Dinge“ oder „kostbare Gaben“. Das hebräische Wort kann allgemein wertvolle oder besonders ausgewählte Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: Ihr Vater gab ihnen
  rationale: Die einfache Vergangenheitsform gibt die hebräische Erzählfolge natürlich wieder; die Wortstellung hebt den Vater als Geber hervor.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: viele Geschenke
  rationale: Bewahrt den quantitativen Sinn von רַבּוֹת und ist in modernem Deutsch idiomatisch.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: Silber, Gold
  rationale: Das לְ führt hier die Arten beziehungsweise Bestandteile der Geschenke an; nach einem Doppelpunkt ist die knappe Aufzählung natürlich.
- source_word: וּלְמִגְדָּנוֹת
  choice: und Kostbarkeiten
  rationale: מִגְדָּנוֹת bezeichnet wertvolle oder ausgewählte Dinge. „Kostbarkeiten“ passt zum königlichen Kontext, ohne den Ausdruck unnötig auf Speisen zu verengen.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: sowie befestigte Städte in Juda
  rationale: „Sowie“ drückt aus, dass die Städte zusätzlich zu den beweglichen Geschenken gegeben wurden; die Ortsangabe bleibt unmittelbar bei den Städten.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: Das Königreich aber gab er Joram
  rationale: Das formal verbindende וְ trägt im Zusammenhang einen deutlichen Gegensatz. „Aber“ macht diesen Diskurskontrast im Deutschen sichtbar.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: denn er war der Erstgeborene
  rationale: כִּי begründet die Übergabe des Königreichs; „der Erstgeborene“ bewahrt den familiären und erbrechtlichen Status.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt erschließt die folgende Aufzählung als Inhalt der Geschenke; „aber“ wahrt den Kontrast zwischen den Gaben an die Brüder und dem Königreich für Joram.
