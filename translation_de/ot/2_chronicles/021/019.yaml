  source_fidelity: Die zeitliche Abfolge und die drastische Aussage über das Austreten der Eingeweide sind zutreffend erfasst. „Unter qualvollen Leiden“ gibt jedoch die pluralische Krankheitsbezeichnung תַּחֲלֻאִים רָעִים weniger präzise wieder als „an schweren Krankheiten“. Die Formulierung zum verweigerten Bestattungsritus sollte den im Hebräischen wiederholten Vergleichsgegenstand ausdrücklich nennen.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Er starb an schweren Krankheiten“ ist idiomatischer und zugleich quellennäher. Die explizite Wiederaufnahme von „Totenfeuer“ im Vergleich verhindert eine zu weitgehende deutsche Ellipse.
  terminology: „Eingeweide“ wahrt die konkrete, harte Bildlichkeit von מֵעָיו. „Totenfeuer“ ist als kontextuelle Bezeichnung vertretbar, sofern die Fußnote klarstellt, dass wahrscheinlich eine Ehrenverbrennung und nicht die Einäscherung des Körpers gemeint ist. Die Fußnote sollte nicht zu bestimmt von „wohlriechenden Stoffen“ sprechen, da dies eine plausible, aber nicht im Vers ausdrücklich genannte Ausgestaltung ist.
