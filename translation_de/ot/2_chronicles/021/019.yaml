  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: de
  text: Nach einiger Zeit, als nach zwei Jahren das Ende nahte, traten infolge seiner Krankheit seine Eingeweide aus[a], und er starb an schweren Krankheiten. Sein Volk aber entzündete ihm kein Totenfeuer wie das Totenfeuer für seine Väter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine inneren Organe“; gemeint sind besonders die Gedärme.'
    reason: lexical_alternative
  - marker: b
    text: Das Totenfeuer war wahrscheinlich eine besondere Bestattungsehre, möglicherweise das Verbrennen wohlriechender Stoffe, nicht die Einäscherung des Leichnams.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: Nach einiger Zeit
  rationale: Die idiomatische Wendung bezeichnet den Ablauf einer unbestimmten Zeitspanne; die deutsche Formulierung ist natürlich und verständlich.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: als nach zwei Jahren das Ende nahte
  rationale: Die Formulierung bewahrt sowohl die Zeitangabe von zwei Jahren als auch den im Hebräischen ausdrücklich genannten nahenden Endpunkt.
- source_word: יָצְאוּ מֵעָיו
  choice: traten ... seine Eingeweide aus
  rationale: מֵעָיו bezeichnet die inneren Organe, besonders die Gedärme; יצא wird in seinem konkreten Sinn wiedergegeben, ohne die drastische Aussage abzumildern.
- source_word: עִם חָלְיוֹ
  choice: infolge seiner Krankheit
  rationale: עִם bezeichnet hier wahrscheinlich den begleitenden beziehungsweise ursächlichen Zusammenhang; „infolge“ gibt diesen in natürlichem Deutsch wieder.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: unter qualvollen Leiden
  rationale: Die Konstruktion beschreibt schwere, schmerzhafte Krankheitsleiden. Die Wiedergabe erhält die Intensität und vermeidet das im Deutschen unnatürliche „an schlimmen Krankheiten“ nach der bereits genannten Krankheit.
- source_word: שְׂרֵפָה
  choice: Totenfeuer
  rationale: Das Kompositum bezeichnet im Kontext ein zu Ehren des Verstorbenen entzündetes Feuer und vermeidet eher als „Verbrennung“ den unmittelbaren Eindruck einer Einäscherung.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: wie seinen Vorfahren
  rationale: Die verkürzte Vergleichsform ist im Deutschen natürlich; das vorangehende „Totenfeuer“ bleibt als Vergleichsgegenstand eindeutig.
theological_decisions:
- issue: Art der שְׂרֵפָה im königlichen Bestattungskontext
  choice: Totenfeuer als versagte Bestattungsehre
  alternative: Einäscherung des Leichnams oder nicht näher bestimmter Verbrennungsritus
  rationale: Der Zusammenhang stellt die Jehoram verweigerte Ehre derjenigen gegenüber, die seinen Vorfahren erwiesen wurde. Der Haupttext benennt ein Totenfeuer, während die Fußnote die wahrscheinliche kulturelle Bedeutung erklärt, ohne völlige Gewissheit zu behaupten.
- issue: Bedeutung von הַקֵּץ nach zwei Jahren
  choice: das nahende Ende
  alternative: bloßes Ende der Zweijahresfrist
  rationale: הַקֵּץ kann im Satz den Endpunkt der Frist bezeichnen, doch im Erzählzusammenhang schwingt Jehorams Lebensende mit. Die Formulierung bewahrt diese Spannung, ohne sie ausdrücklich auf den Tod festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Krankheitsbeschreibung wird nicht beschönigt. „Totenfeuer“ ist verständlicher als eine wörtliche „Verbrennung“ und wird wegen der kulturgeschichtlichen Unsicherheit durch eine vorsichtig formulierte Fußnote erläutert.
