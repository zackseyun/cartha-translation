revisions:
- from: Nach einiger Zeit, als nach zwei Jahren das Ende nahte, traten infolge seiner Krankheit seine Eingeweide aus[a], und er starb unter qualvollen Leiden. Sein Volk aber entzündete ihm kein Totenfeuer wie seinen Vorfahren[b].
  to: Nach einiger Zeit, als nach zwei Jahren das Ende nahte, traten infolge seiner Krankheit seine Eingeweide aus[a], und er starb an schweren Krankheiten. Sein Volk aber entzündete ihm kein Totenfeuer wie das Totenfeuer für seine Väter[b].
  rationale: Die Revision stellt die pluralische Aussage über die schweren Krankheiten wieder her, macht den Vergleich beim verweigerten Totenfeuer explizit und formuliert die kulturgeschichtliche Erklärung zurückhaltender. Zeitangabe, Bildlichkeit und der nicht beschönigte Krankheitsverlauf bleiben erhalten.
