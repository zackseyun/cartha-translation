    rationale: „wie seinen Vorfahren“ ist verständlich, lässt aber das wiederholte שְׂרֵפָה unausgedrückt. „wie das Totenfeuer für seine Väter“ ist eindeutiger und näher am hebräischen Vergleich.
  - severity: low
    issue: Die kulturgeschichtliche Fußnote ist in der konkreten Beschreibung des Brennmaterials etwas zu festgelegt.
    rationale: Der Kontext legt eine Bestattungsehre nahe, doch der Vers nennt keine bestimmten Stoffe. Eine vorsichtiger formulierte Erläuterung bewahrt die historische Unsicherheit.
