review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Bewegungsverb, militärische Begleitung, nächtliches Aufstehen und das Schlagen treffend wieder. „Noch in der Nacht“ fügt jedoch einen zeitlichen Akzent („bereits/früher noch“) hinzu, den לַיְלָה nicht verlangt. Auch das Plusquamperfekt „umzingelt hatten“ legt eine abgeschlossene Vorzeitigkeit nahe, während das hebräische Partizip die Umzingelung als andauernden Begleitumstand darstellen kann.
  naturalness: Die überarbeitete Fassung ist modernes, flüssiges Standarddeutsch. „Da“ ist im erzählenden Register natürlicher als das einleitende „So“, und „in der Nacht erhob er sich“ ist zugleich idiomatisch und näher am hebräischen Ausdruck.
  terminology: „Befehlshaber“ gibt שָׂר sachgerecht wieder. Für שָׂרֵי הָרֶכֶב ist „Befehlshaber der Streitwagen“ weniger missverständlich als „Streitwagenführer“, das im Deutschen primär die Lenker einzelner Wagen bezeichnen kann. Die Wiedergabe von kollektivem „Edom“ als „die Edomiter“ bleibt mit einer Fußnote transparent.
  issues:
  - severity: medium
    issue: „Noch in der Nacht“
    rationale: Die Formulierung kann eine nicht im Ausgangstext enthaltene Vorzeitigkeit oder besondere zeitliche Dringlichkeit vermitteln. לַיְלָה bedeutet hier schlicht „in/bei Nacht“.
  - severity: medium
    issue: „die ihn umzingelt hatten“
    rationale: Das Plusquamperfekt stellt die Umzingelung als vor dem Aufstehen abgeschlossene Handlung dar. Das Partizip הַסּוֹבֵב beschreibt natürlicher einen fortdauernden Zustand bzw. ein gleichzeitig stattfindendes Umringen.
  - severity: low
    issue: „Streitwagenführer“
    rationale: Der Ausdruck kann Wagenlenker meinen; שָׂרֵי הָרָכֶב bezeichnet eher die führenden Offiziere bzw. Befehlshaber der Streitwagen(-truppe).
  revised_text: Da zog Joram mit seinen Befehlshabern und allen Streitwagen, die bei ihm waren, hinüber. In der Nacht erhob er sich und schlug die Edomiter,[a] die ihn umringten, sowie die Befehlshaber der Streitwagen.
