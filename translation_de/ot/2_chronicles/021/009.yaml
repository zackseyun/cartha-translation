  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: de
  text: Da zog Joram mit seinen Befehlshabern und allen Streitwagen, die bei ihm waren, hinüber. In der Nacht erhob er sich und schlug die Edomiter,[a] die ihn umringten, sowie die Befehlshaber der Streitwagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Edom“. Gemeint ist hier die edomitische Streitmacht.'
    reason: Die kollektive Bezeichnung des hebräischen Textes wird im Haupttext für natürliches Deutsch als Personenbezeichnung wiedergegeben.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog … hinüber
  rationale: Das Verb עבר bezeichnet ein Hinüberziehen oder Überschreiten. Die Wiedergabe wahrt die konkrete Bewegung, ohne ein im Text nicht genanntes Ziel oder Manöver zu ergänzen.
- source_word: שָׂרָיו
  choice: seine Befehlshaber
  rationale: שַׂר kann Fürsten, Amtsträger oder militärische Führer bezeichnen. Im Zusammenhang des Feldzugs ist „Befehlshaber“ sachlich und verständlich.
- source_word: וְכָל־הָרֶכֶב עִמּוֹ
  choice: und allen Streitwagen, die er bei sich hatte
  rationale: רֶכֶב bezeichnet hier kollektiv die Streitwagen beziehungsweise die Streitwagentruppe. Die Formulierung bleibt nahe am Bild des Hebräischen und klingt im Deutschen natürlich.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Noch in der Nacht machte er sich auf
  rationale: Die Konstruktion mit ויהי und dem Partizip führt die nächtliche Handlung erzählerisch weiter. „Machte er sich auf“ gibt קָם idiomatisch wieder, ohne zusätzliche taktische Einzelheiten einzutragen.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bedeutet allgemein schlagen oder angreifen. „Schlug“ bewahrt die Offenheit des Verbs und behauptet nicht ausdrücklich einen vollständigen Sieg.
- source_word: אֶת־אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: die Edomiter, die ihn umzingelt hatten
  rationale: Das Hebräische nennt kollektiv „Edom“. Im Deutschen bezeichnet „die Edomiter“ natürlich die hier handelnde Streitmacht; der Partizipialsatz wird kontextgerecht als bereits bestehende Umzingelung wiedergegeben.
- source_word: שָׂרֵי הָרָכֶב
  choice: die Streitwagenführer
  rationale: Die Genitivverbindung bezeichnet die Führer beziehungsweise Befehlshaber der Streitwagentruppe. „Streitwagenführer“ ist knapp und lässt offen, ob einzelne Wagenlenker oder höherrangige Offiziere gemeint sind.
