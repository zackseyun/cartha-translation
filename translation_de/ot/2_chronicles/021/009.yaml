revisions:
- from: So zog Joram mit seinen Befehlshabern und allen Streitwagen, die er bei sich hatte, hinüber. Noch in der Nacht machte er sich auf und schlug die Edomiter,[a] die ihn umzingelt hatten, sowie die Streitwagenführer.
  to: Da zog Joram mit seinen Befehlshabern und allen Streitwagen, die bei ihm waren, hinüber. In der Nacht erhob er sich und schlug die Edomiter,[a] die ihn umringten, sowie die Befehlshaber der Streitwagen.
  rationale: Die Revision beseitigt zwei nicht erforderliche zeitliche Präzisierungen und verdeutlicht die militärische Funktion der שָׂרֵי הָרָכֶב, ohne über die im Hebräischen offene genaue Organisationsform der Streitwagentruppe hinauszugehen. Der Fußnotenanker bleibt korrekt an der kollektiv verstandenen Volksbezeichnung gesetzt.
