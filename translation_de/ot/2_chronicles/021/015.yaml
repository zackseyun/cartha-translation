source:
  edition: WLC
  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: de
  text: Du selbst aber wirst an vielen Krankheiten leiden sowie an einer Krankheit deiner Eingeweide[a], bis deine Eingeweide infolge der Krankheit herauskommen – Tag um Tag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner inneren Organe“; das hebräische Wort kann die inneren Organe bezeichnen, besonders den Darm.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Tage auf Tage“; gemeint sein kann „Tag um Tag“ oder „über viele Tage hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du selbst aber
  rationale: Das selbstständige Pronomen hebt Joram persönlich hervor; „selbst“ bewahrt diesen Nachdruck. „Aber“ gibt den direkten, kontrastierenden Übergang natürlich wieder.
- source_word: בָּחֳלָיִם רַבִּים
  choice: wirst an vielen Krankheiten leiden
  rationale: Die Präposition ב bezeichnet hier den Zustand beziehungsweise die Heimsuchung. Die deutsche Wendung ist natürlich und bewahrt den Plural von חֳלָיִם.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: darunter an einer Krankheit deiner Eingeweide
  rationale: Die zweite Krankheitsangabe erläutert die allgemeine Aussage näher. „Eingeweide“ gibt מֵעֶה hinreichend breit wieder, ohne es ausschließlich anatomisch auf den Darm festzulegen.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: bis deine Eingeweide … heraustreten
  rationale: יצא bedeutet schlicht „hinausgehen/herauskommen“. Die drastische Aussage des Hebräischen wird nicht abgeschwächt.
- source_word: מִן הַחֹלִי
  choice: infolge der Krankheit
  rationale: 'מן ist hier kausal zu verstehen: Das Heraustreten geschieht als Folge der Krankheit.'
- source_word: יָמִים עַל יָמִים
  choice: Tag um Tag
  rationale: Die wörtliche Fügung „Tage auf Tage“ bezeichnet einen fortdauernden Verlauf über aufeinanderfolgende Tage. „Tag um Tag“ ist eine natürliche, knappe deutsche Entsprechung.
