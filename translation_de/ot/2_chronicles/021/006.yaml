source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: de
  text: Er ging auf dem Weg der Könige Israels, wie es das Haus Ahabs getan hatte, denn Ahabs Tochter war seine Frau. Er tat, was in den Augen Jahwes böse war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Er ging auf dem Weg
  rationale: Die Verbindung von הלך und דרך beschreibt bildhaft den Lebenswandel. Die deutsche Wiedergabe bewahrt dieses verständliche Wegmotiv.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die Genitivverbindung bezeichnet die Herrscher des Nordreichs, deren Verhalten als Vorbild für Jorams Handeln erscheint.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: wie es das Haus Ahabs getan hatte
  rationale: „Haus Ahabs“ bewahrt den hebräischen Ausdruck und lässt sowohl an die königliche Familie als auch an die Dynastie denken. Das Plusquamperfekt gibt den rückblickenden Vergleich natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für Jorams Orientierung am Haus Ahabs ein.
- source_word: בַּת אַחְאָב
  choice: eine Tochter Ahabs
  rationale: Die relationale Bezeichnung des Verses wird beibehalten, ohne die Frau durch eine aus dem weiteren Kontext ergänzte Namensangabe zu identifizieren.
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: war seine Frau
  rationale: Die Konstruktion bezeichnet den bestehenden Ehestand und nicht den Zeitpunkt der Eheschließung.
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die Formulierung gibt das substantivierte הָרַע ausdrücklich wieder und entspricht natürlichem modernem Deutsch.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Bewertungsformel und ihr bildhafter Charakter bleiben erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Transkription gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ würde daraus einen Titel machen.
- issue: Bedeutung von „Haus Ahabs“
  choice: Haus Ahabs
  alternative: Dynastie Ahabs
  rationale: Der hebräische Ausdruck kann Familie, königliches Haus oder Dynastie bezeichnen. Die wörtlich-natürliche Formulierung bewahrt diese Bedeutungsbreite, ohne sie vorschnell einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wegmotiv sowie die Formel „in den Augen Jahwes“ werden bewusst bewahrt, weil beide im Hebräischen zentrale Bilder für Lebensführung und göttliche Bewertung sind.
