revisions:
- from: So löste sich Edom von der Herrschaft Judas und ist bis zum heutigen Tag unabhängig.[a] Damals löste sich auch Libna von seiner Herrschaft, weil er Jahwe, den Gott seiner Väter, verlassen hatte.[b]
