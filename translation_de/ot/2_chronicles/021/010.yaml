  rationale: Die Revision bewahrt den politischen Charakter von פשע und die Bedeutung der Herrschaftsidiomatik, ohne die Aussage als moderne Unabhängigkeitsbehauptung auszuweiten. Sie verbessert den deutschen Anschluss, klärt den Bezug des hebräischen Possessivsuffixes als Joram und ersetzt die unidiomatische Fußnotenparaphrase durch eine sachliche Erklärung.
