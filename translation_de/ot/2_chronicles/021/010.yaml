source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: de
  text: Da rebellierte Edom gegen Juda und entzog sich dessen Herrschaft bis zum heutigen Tag.[a] Damals rebellierte auch Libna gegen die Herrschaft Jorams, weil Joram Jahwe, den Gott seiner Väter, verlassen hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Edom rebellierte von unter der Hand Judas ... bis zu diesem Tag.« »Unter der Hand« bezeichnet Unterordnung unter Herrschaft oder Macht. Auch möglich: »Edom fiel von Juda ab«.'
    reason: lexical_alternative
  - marker: b
    text: Die Begründung kann sich auf die geschilderten Aufstände insgesamt oder enger nur auf den Aufstand Libnas beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: löste sich … von der Herrschaft
  rationale: Im politischen Zusammenhang bezeichnet פשע Auflehnung und Loslösung von einer Herrschaft. Die Formulierung gibt den Vorgang in natürlichem modernem Deutsch wieder, ohne den politischen Sinn abzuschwächen.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: von der Herrschaft Judas / von seiner Herrschaft
  rationale: Das hebräische Bild »unter der Hand« bezeichnet Unterordnung unter Macht oder Herrschaft. Eine idiomatische Wiedergabe ist im Deutschen klarer als die missverständliche wörtliche Formulierung »unter der Hand«.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Bewahrt die hebräische Zeitformel und zeigt, dass der Zustand bis in die Gegenwart des Erzählers fortbestand.
- source_word: אָז
  choice: Damals
  rationale: Gibt die zeitliche Verknüpfung knapp und natürlich wieder.
- source_word: כִּי
  choice: weil
  rationale: Markiert den im Text ausdrücklich genannten ursächlichen Zusammenhang, ohne dessen genaue Reichweite festzulegen.
- source_word: עָזַב
  choice: verlassen hatte
  rationale: »Verlassen« ist eine natürliche und zugleich gewichtige Wiedergabe der Abkehr Jorams von seinem Gott; das Plusquamperfekt zeigt, dass diese Abkehr den geschilderten Ereignissen vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: den Gott seiner Väter
  rationale: Entspricht eng der hebräischen Wendung und bewahrt ihren familiären sowie heilsgeschichtlichen Bezug.
theological_decisions:
- issue: Reichweite der Begründung durch Jorams Verlassen Jahwes
  choice: Die weil-Klausel bleibt unmittelbar nach beiden Aufständen stehen und wird nicht ausdrücklich nur auf einen davon bezogen.
  alternative: Die Klausel kann enger als Begründung allein für den Aufstand Libnas verstanden werden.
  rationale: Der Satzbau ermöglicht einen unmittelbaren Bezug auf Libna, während der größere Zusammenhang des Chronisten Jorams politische Not insgesamt als Folge seiner Untreue verstehen lässt. Die Übersetzung entscheidet diese Spannung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das schwer verständliche hebräische Herrschaftsbild »unter der Hand« wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt. »Jahwe« bewahrt den Gottesnamen; »Gott seiner Väter« bleibt bewusst nah am Ausgangstext.
