  source_fidelity: Die Wiedergabe von פשע als politische Loslösung trifft den Grundsinn, doch »ist ... unabhängig« macht aus der bis zur Gegenwart des Erzählers fortdauernden Aussage eine unnötig explizite gegenwärtige Unabhängigkeitsbehauptung. Die Revision gibt Rebellion und Entzug der Herrschaft wieder. Das Pronomen in »seiner Herrschaft« ist im Deutschen nicht eindeutig genug; »Jorams Herrschaft« verdeutlicht den im Hebräischen durch das maskuline Suffix bestimmten Bezug.
  naturalness: »So löste sich« ist in modernem Standarddeutsch ein unnatürlicher Anschluss. »Da rebellierte« und »Damals rebellierte auch« sind klar und flüssig. Die Formulierung »entzog sich dessen Herrschaft« gibt die hebräische Herrschaftsidiomatik idiomatisch wieder.
  terminology: »Jahwe« und »der Gott seiner Väter« sind angemessen und quellennah. »Joram« bezeichnet den im Kontext gemeinten König und vermeidet eine missverständliche deutsche Pronomenreferenz.
