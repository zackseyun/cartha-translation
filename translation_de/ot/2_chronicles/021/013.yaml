source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: de
  text: sondern bist den Weg der Könige Israels gegangen und hast Juda und die Einwohner Jerusalems dazu gebracht, sich zu prostituieren[a], wie es das Haus Ahabs[b] getan hat. Außerdem hast du deine Brüder aus dem Haus deines Vaters getötet, die besser waren als du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »hast Juda und die Einwohner Jerusalems dazu gebracht, sich wie Prostituierte zu verhalten«. Das prophetische Bild bezeichnet Untreue gegenüber Gott, die sich häufig im Götzendienst zeigt.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Haus Ahabs« ist Ahabs Herrscherhaus, also seine Dynastie, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: bist den Weg … gegangen
  rationale: Bewahrt das hebräische Weg-Bild für eine übernommene Lebens- und Herrschaftsweise und klingt zugleich in modernem Deutsch natürlich.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die formale Wiedergabe erhält den historisch bedeutsamen Gegensatz zwischen den Königen Judas und Israels.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלִַם
  choice: hast Juda und die Einwohner Jerusalems dazu gebracht, sich zu prostituieren
  rationale: Die kausative Form und das drastische Bild von זנה werden bewahrt. Im Zusammenhang bezeichnet das Bild vor allem religiöse und bund bezogene Untreue, ohne dass die Übersetzung es vorschnell auf ‚Götzendienst‘ verengt.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: wie das Haus Ahabs sie dazu gebracht hat
  rationale: Die Vergleichskonstruktion und der kausative Sinn werden aufgenommen; die Wiederholung verweist klar auf das vorausgehende Bild, ohne das Deutsche unnötig schwerfällig zu machen.
- source_word: בֵּית אַחְאָב
  choice: das Haus Ahabs
  rationale: ‚Haus‘ bewahrt den biblischen Ausdruck für Familie und Herrscherdynastie; eine Fußnote erläutert die gemeinte dynastische Bedeutung.
- source_word: וְגַם
  choice: Außerdem
  rationale: Gibt die steigernde Hinzufügung eines weiteren Anklagepunkts in natürlichem Deutsch wieder.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: deine Brüder aus dem Haus deines Vaters
  rationale: Verbindet die Brüder eindeutig mit dem väterlichen beziehungsweise königlichen Haus und erhält die familiäre Schwere der Anklage.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: die besser waren als du
  rationale: Gibt den knappen hebräischen Vergleich wieder, ohne die Art ihrer Überlegenheit interpretierend festzulegen.
- source_word: הָרָגְתָּ
  choice: hast … getötet
  rationale: Entspricht dem allgemeinen Verb für Töten. ‚Ermordet‘ wäre im Kontext möglich, würde aber die lexikalische Aussage stärker rechtlich-moralisch bestimmen.
theological_decisions:
- issue: Bildhafte Bedeutung von זנה im Zusammenhang königlicher Apostasie
  choice: Das Prostitutionsbild ausdrücklich bewahren und seine übertragene Bedeutung in einer Fußnote erläutern.
  alternative: Direkt mit ‚zum Götzendienst/zur Untreue verleitet‘ übersetzen.
  rationale: Der hebräische Text verwendet bewusst ein drastisches sexuelles Bild für religiöse beziehungsweise bund bezogene Untreue. Eine direkte Deutung als ‚Götzendienst‘ wäre verständlich, würde aber die Metapher verengen und ihre Spannung beseitigen.
- issue: Bewertung der getöteten Brüder durch הַטּוֹבִים מִמְּךָ
  choice: „die besser waren als du“
  alternative: „die würdiger waren als du“
  rationale: Die offene Wertung des Hebräischen bleibt erhalten; die Übersetzung legt nicht fest, ob besonders moralische Güte, Herrschaftseignung oder beides gemeint ist.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Das Weg-Bild und die bewusst anstößige Prostitutionsmetapher bleiben erhalten; altertümliche Wörter wie „Hurerei“ werden vermieden. „Sondern“ nimmt den Gegensatz des unmittelbaren Kontexts auf.
