source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: de
  text: Zweiunddreißig Jahre alt war er, als er König wurde, und acht Jahre regierte er in Jerusalem. Dann ging er dahin, ohne dass man ihn vermisste[a]. Man begrub ihn in der Stadt Davids, aber nicht in den Gräbern der Könige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ohne Verlangen“; auch möglich: „ohne dass man nach ihm verlangte“ oder „ohne Bedauern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: Zweiunddreißig Jahre alt
  rationale: Die hebräische Wendung ist die übliche Altersangabe. Die idiomatische deutsche Wiedergabe vermittelt ihren Sinn klar.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Form bezeichnet in dieser Königsformel den Zeitpunkt des Herrschaftsantritts; die gewählte Formulierung ist natürlich und präzise.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: acht Jahre regierte er
  rationale: מָלַךְ bedeutet hier „regieren“ beziehungsweise „König sein“; „regierte“ entspricht der üblichen deutschen Königsformel.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte Ortsangabe.
- source_word: וַיֵּלֶךְ
  choice: Dann ging er dahin
  rationale: Das Verb „gehen“ dient im Nachruf als verhüllende Bezeichnung des Todes. „ging dahin“ bewahrt diesen Euphemismus, ohne ausdrücklich „starb“ einzusetzen.
- source_word: בְּלֹא חֶמְדָּה
  choice: ohne dass man ihn vermisste
  rationale: חֶמְדָּה kann Verlangen, Wohlgefallen oder Kostbarkeit bezeichnen. Im Zusammenhang drückt die Wendung wahrscheinlich aus, dass sein Tod keine Zuneigung oder Verlustempfindung auslöste; die Fußnote bewahrt die ungewöhnliche und mehrdeutige Bildsprache.
- source_word: וַיִּקְבְּרֻהוּ
  choice: Man begrub ihn
  rationale: Der hebräische Plural ohne ausdrücklich genanntes Subjekt wird im Deutschen natürlich mit dem unpersönlichen „man“ wiedergegeben.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Übliche deutsche Wiedergabe der Ortsbezeichnung.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: aber nicht in den Gräbern der Könige
  rationale: קִבְרוֹת bezeichnet Gräber oder Grabstätten; „Gräber“ ist im Deutschen klar und wahrt den Gegensatz zur königlichen Begräbnisstätte.
theological_decisions:
- issue: Bedeutung von בְּלֹא חֶמְדָּה im königlichen Nachruf
  choice: ohne dass man ihn vermisste
  alternative: ohne dass man nach ihm verlangte; ohne Bedauern; ohne Ehre
  rationale: Die Übersetzung gibt den wahrscheinlichen kontextuellen Sinn wieder, legt aber weder eine bestimmte Trauerpraxis noch ein ausdrückliches göttliches Urteil in den Text hinein. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, aber weiterhin verständliche Wendung „ging dahin“ erhält den hebräischen Todeseuphemismus. Der ungewöhnliche Ausdruck בְּלֹא חֶמְדָּה wird im Haupttext verständlich wiedergegeben und in der Fußnote nicht vorschnell vereindeutigt.
