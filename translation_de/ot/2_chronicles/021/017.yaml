source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: de
  text: Sie zogen gegen Juda herauf, drangen dort ein und führten den gesamten Besitz fort, der sich im Königspalast befand, ebenso seine Söhne und seine Frauen, sodass ihm kein Sohn blieb außer Joahas[a], dem jüngsten seiner Söhne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joahas ist wahrscheinlich dieselbe Person, die an anderen Stellen Ahasja genannt wird (vgl. 2. Könige 8,24–26; 2. Chronik 22,1).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Sie zogen gegen Juda herauf
  rationale: עלה mit ב bezeichnet hier im militärischen Zusammenhang den feindlichen Zug nach Juda hinein. „Gegen Juda heraufziehen“ bewahrt sowohl die Bewegungsrichtung als auch den Angriffssinn.
- source_word: וַיִּבְקָעוּהָ
  choice: und drangen in das Land ein
  rationale: בקע bedeutet grundsätzlich „spalten, aufbrechen, durchbrechen“. Auf Juda bezogen ist das gewaltsame Eindringen gemeint; „in das Land eindringen“ gibt dies in natürlichem Deutsch wieder, ohne eine bestimmte Art von Befestigung vorauszusetzen.
- source_word: וַיִּשְׁבּוּ
  choice: Sie führten … fort, ebenso …
  rationale: שבה bezeichnet das Wegführen als Beute beziehungsweise in Gefangenschaft. Die Formulierung kann im Deutschen sowohl den Besitz als auch die Angehörigen des Königs umfassen und erhält so die gemeinsame Verbstruktur des Hebräischen.
- source_word: כָּל הָרְכוּשׁ
  choice: den gesamten Besitz
  rationale: רכוש bezeichnet Habe, Güter oder beweglichen Besitz. „Der gesamte Besitz“ ist umfassend und im Kontext des Königshauses natürlich.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: der sich im Königspalast befand
  rationale: נמצא bezeichnet das Vorhandensein; בית המלך meint in diesem Zusammenhang den königlichen Palast. Die Wiedergabe ist sachlich präzise und für heutige Leser eindeutig.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: ebenso seine Söhne und seine Frauen
  rationale: גם erweitert die Aufzählung nachdrücklich. „Ebenso“ bewahrt diesen additiven Sinn ohne unnötige Verstärkung.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: So blieb ihm kein Sohn
  rationale: Das Niphal von שׁאר bezeichnet das Verbleiben. „So“ macht die im Zusammenhang liegende Folge deutlich und bleibt knapp.
- source_word: כִּי אִם
  choice: außer
  rationale: כִּי אִם führt hier die einzige Ausnahme ein. „Außer“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Der masoretische Text bietet hier den Namen יְהוֹאָחָז. Die deutsche Bibelnamenform „Joahas“ folgt diesem Text; die mögliche Gleichsetzung mit Ahasja wird transparent in einer Fußnote genannt.
- source_word: קְטֹן בָּנָיו
  choice: dem jüngsten seiner Söhne
  rationale: קטן bezeichnet im familiären Zusammenhang den Altersrang. „Der jüngste seiner Söhne“ gibt die Konstruktion genau und natürlich wieder.
theological_decisions:
- issue: Namensform des überlebenden Sohnes Jorams
  choice: Joahas im Haupttext beibehalten
  alternative: Ahasja nach den Parallelstellen 2. Könige 8,24–26 und 2. Chronik 22,1
  rationale: Die Namensfrage ist eine textliche und erzählerische Identifikationsfrage. Der Haupttext folgt dem vorliegenden masoretischen Wortlaut; die wahrscheinliche Gleichsetzung mit Ahasja wird in der Fußnote offengelegt, ohne den hebräischen Text stillschweigend zu ändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Königspalast“ verdeutlicht die kontextuelle Bedeutung von „Haus des Königs“. Der Satzbau wurde für gute Lesbarkeit in drei Sätze gegliedert; die Abfolge und der Aussagegehalt des Hebräischen bleiben erhalten.
