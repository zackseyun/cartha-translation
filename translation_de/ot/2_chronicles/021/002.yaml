id: 2CH.21.2
reference: 2 Chronicles 21:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: de
  text: 'Und er hatte Brüder, die Söhne Joschafats: Asarja, Jehiël, Secharja, Asarjahu[b], Michael und Schefatja. Sie alle waren Söhne Joschafats, des Königs von Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Hebräischen: »König von Israel«. Joschafat wird sonst als König von Juda bezeichnet; hier kann »Israel« das Bundesvolk in einem weiteren Sinn bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Der vierte Name ist im Hebräischen anders geschrieben als der erste Name Asarja; die Form »Asarjahu« macht diesen Unterschied sichtbar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֽ/וֹ
  choice: Und er hatte
  rationale: Die hebräische Besitzkonstruktion bedeutet wörtlich »und ihm waren«; im heutigen Deutsch gibt »Und er hatte« den Sinn natürlich wieder und bewahrt den erzählerischen Anschluss.
- source_word: אַחִים
  choice: Brüder
  rationale: Im genealogischen Zusammenhang bezeichnet das Wort männliche Geschwister, nicht allgemein Verwandte.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: die Söhne Joschafats
  rationale: Die Wiedergabe mit »Söhne« erhält den genealogischen Stil des hebräischen Textes.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: וִֽ/יחִיאֵל
  choice: Jehiël
  rationale: Die Form lehnt sich an die hebräische Namensgestalt an und ist im Deutschen gut lesbar; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: וּ/זְכַרְיָהוּ
  choice: Secharja
  rationale: Geläufige deutsche Bibelnamenform.
- source_word: וַ/עֲזַרְיָהוּ
  choice: Asarjahu
  rationale: Die Endung -jahu bewahrt den im Hebräischen vorhandenen Unterschied zum ersten Namen עֲזַרְיָה, statt beide Brüder gleich zu benennen.
- source_word: וּ/מִיכָאֵל
  choice: Michael
  rationale: Geläufige deutsche Form des Namens.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: Schefatja
  rationale: Die deutsche Umschrift gibt den hebräischen Personennamen verständlich und erkennbar wieder.
- source_word: כָּל אֵלֶּה
  choice: Sie alle
  rationale: Die resumptive Wendung wird im Deutschen natürlich wiedergegeben und nimmt sämtliche zuvor genannten Brüder auf.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  rationale: Dies entspricht ausdrücklich dem masoretischen Text und vermeidet eine harmonisierende Änderung zu »König von Juda«.
theological_decisions:
- issue: Joschafats Titel als מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  alternative: König von Juda
  rationale: Der hebräische Text nennt Joschafat »König von Israel«. Obwohl er historisch gewöhnlich als König von Juda bezeichnet wird, darf die Übersetzung die Formulierung des Chronisten und deren möglichen weiteren bundesgeschichtlichen Sinn nicht stillschweigend harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer genealogischer Satzstruktur. Die traditionellen deutschen Formen der biblischen Namen werden verwendet; beim zweiten Asarja-Namen bleibt die abweichende hebräische Form bewusst erkennbar. Die Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Stellen.
