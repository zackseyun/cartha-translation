id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: de
  text: Siehe[a], Jahwe wird dein Volk, deine Söhne, deine Frauen und deinen ganzen Besitz mit einer schweren Plage schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, Jahwe schlägt dein Volk … mit einem schweren Schlag/einer schweren Heimsuchung.“ Das hebräische Partizip kann eine unmittelbar bevorstehende oder eine gegenwärtig dargestellte Handlung bezeichnen; מַגֵּפָה kann sowohl eine Plage als auch einen schweren, von Gott verhängten Schlag meinen.'
    reason: Bewahrt die zeitliche Mehrdeutigkeit des Partizips und die Bedeutungsbreite von מַגֵּפָה.
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die feierliche, Aufmerksamkeit fordernde Kraft der prophetischen Ankündigung; das modernere „Schau“ wäre hier zu umgangssprachlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נֹגֵף
  choice: wird … schlagen
  rationale: Das Partizip in Verbindung mit הִנֵּה kann eine unmittelbar bevorstehende prophetisch angekündigte Handlung bezeichnen. Das deutsche Futur klingt natürlich und lässt die im Hebräischen mögliche Zukunftsbedeutung erkennen.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: mit einer schweren Plage
  rationale: מַגֵּפָה kann eine Plage oder einen von Gott verhängten schweren Schlag bezeichnen. „Schwere Plage“ ist im Deutschen idiomatisch und gibt גְדוֹלָה dem Sinn nach wieder.
- source_word: בְּעַמֶּךָ
  choice: dein Volk
  rationale: Die Präposition ב markiert hier bei נֹגֵף die vom Schlag betroffene Größe; im Deutschen wird das direkte Objekt verwendet.
- source_word: וּבְבָנֶיךָ
  choice: deine Söhne
  rationale: בָּנִים ist ausdrücklich maskuliner Plural und bezeichnet in dieser Aufzählung die Söhne.
- source_word: וּבְנָשֶׁיךָ
  choice: deine Frauen
  rationale: נָשִׁים bezeichnet mit Possessivsuffix in diesem Kontext die Ehefrauen; „deine Frauen“ ist eine natürliche und kontextuell eindeutige deutsche Wiedergabe.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: deinen ganzen Besitz
  rationale: רְכוּשׁ bezeichnet Habe, Vermögen oder Besitz; „deinen ganzen Besitz“ gibt auch die umfassende Bedeutung von כָּל prägnant wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Kraft des Partizips נֹגֵף
  choice: 'unmittelbar bevorstehende Zukunft: „wird … schlagen“'
  alternative: 'gegenwärtiger Verlauf: „schlägt gerade“ beziehungsweise imminente Umschreibung: „ist im Begriff zu schlagen“'
  rationale: הִנֵּה mit Partizip kann im prophetischen Redekontext eine bevorstehende Handlung lebhaft ankündigen. Die Fußnote hält die echte aspektuelle und lexikalische Mehrdeutigkeit offen.
- issue: Bedeutungsbreite von מַגֵּפָה
  choice: Plage
  alternative: schwerer Schlag beziehungsweise Heimsuchung
  rationale: „Plage“ passt zum Gerichtskontext, doch das Substantiv ist nicht zwingend auf eine Seuche beschränkt; deshalb wird die weitere Bedeutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ erhält den feierlichen prophetischen Ton; Satzbau und Wortwahl bleiben für heutige Leser klar. Die Übersetzung folgt optimaler Äquivalenz und dokumentiert echte Mehrdeutigkeiten in der Fußnote.
