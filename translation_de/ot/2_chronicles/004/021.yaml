  text: וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּר֛וֹת וְ/הַ/מֶּלְקַחַ֖יִם זָהָ֑ב ה֖וּא מִכְל֥וֹת זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/021.yaml
  text: the flowers[a], the lamps[b], and the tongs of gold—pure gold.
translation:
  language: de
  text: dazu die Blüten, die Lampen und die Dochtzangen aus Gold – aus reinem Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Gold – es war Vollendungen des Goldes.« Die schwierige Wendung bezeichnet wahrscheinlich besonders reines oder vollkommen verarbeitetes Gold.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: die Blüten
  rationale: פֶּרַח bezeichnet wörtlich eine Blüte. Hier ist der Singular wahrscheinlich kollektiv zu verstehen und meint die blütenförmigen Verzierungen der Leuchter.
- source_word: וְהַנֵּרוֹת
  choice: die Lampen
  rationale: נֵרוֹת ist die übliche Bezeichnung für Lampen und passt zum Zusammenhang der Tempelgeräte.
- source_word: וְהַמֶּלְקַחַיִם
  choice: die Dochtzangen
  rationale: מֶלְקַחַיִם bezeichnet ein zangenartiges Gerät; bei Leuchtern liegt eine Zange zum Fassen oder Richten der Dochte nahe. Die spezifische Wiedergabe ist im Deutschen verständlicher als das allgemeine »Zangen«.
- source_word: זָהָב
  choice: aus Gold
  rationale: Das erste זָהָב bezeichnet das Material der genannten Gegenstände.
- source_word: מִכְלוֹת זָהָב
  choice: aus vollkommenem Gold
  rationale: Die ungewöhnliche Wendung bezeichnet wohl Gold, das hinsichtlich Reinheit oder Verarbeitung zur Vollendung gebracht wurde. Die Wiedergabe bewahrt den Begriff der Vollkommenheit, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Superlativ einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Inventarsprache. »dazu« macht den fortlaufenden Listencharakter des Versfragments deutlich. Der Gedankenstrich bildet die nachgestellte Hervorhebung der Goldqualität ab; die schwierige hebräische Formulierung wird in der Fußnote offengelegt.
