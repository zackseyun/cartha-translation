  text: וַ/יַּ֣עַשׂ שֻׁלְחָנוֹת֮ עֲשָׂרָה֒ וַ/יַּנַּח֙ בַּֽ/הֵיכָ֔ל חֲמִשָּׁ֥ה מִ/יָּמִ֖ין וַ/חֲמִשָּׁ֣ה מִ/שְּׂמֹ֑אול וַ/יַּ֛עַשׂ מִזְרְקֵ֥י זָהָ֖ב מֵאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: de
  text: Er fertigte zehn Tische an und stellte sie im Tempel auf, fünf auf der rechten und fünf auf der linken Seite. Außerdem fertigte er hundert goldene Schalen[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Becken“ oder „goldene Sprengschalen“; das hebräische Wort bezeichnet Gefäße, die beim Tempeldienst verwendet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: Tische
  rationale: Das Substantiv bezeichnet gewöhnlich Tische; diese schlichte Wiedergabe passt zum Zusammenhang der Tempelausstattung, ohne ihre Funktion näher festzulegen.
- source_word: וַיַּנַּח
  choice: stellte … auf
  rationale: Das Verb bezeichnet hier das Platzieren beziehungsweise Aufstellen der Tische. Die Formulierung ist im Deutschen natürlich und gibt die konkrete Anordnung wieder.
- source_word: בַּהֵיכָל
  choice: im Tempel
  rationale: הֵיכָל bezeichnet in diesem kultischen Zusammenhang das Tempelgebäude beziehungsweise Heiligtum, nicht einen Königspalast.
- source_word: מִיָּמִין … מִשְּׂמֹאול
  choice: auf der rechten … auf der linken Seite
  rationale: Die räumlichen Angaben werden unmittelbar wiedergegeben. Eine Deutung als Süd- und Nordseite wird vermieden, da die Himmelsrichtungen nicht ausdrücklich genannt sind.
- source_word: מִזְרְקֵי זָהָב
  choice: goldene Schalen
  rationale: מִזְרָק bezeichnet ein schalen- oder beckenförmiges Gefäß, das im Tempeldienst verwendet wurde. „Goldene Schalen“ ist klar und lässt die genauere rituelle Funktion offen.
- source_word: מֵאָה
  choice: hundert
  rationale: Die Zahl wird direkt und in einer für deutsche Inventarangaben natürlichen Form wiedergegeben.
