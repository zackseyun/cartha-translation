base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: de
  text: Und er machte den Vorhof der Priester und den großen Vorhof sowie Türen[a] für den Vorhof; ihre[b] Türen überzog er mit Bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tore«. Das hebräische Wort bezeichnet gewöhnlich Türen oder Türflügel, kann hier aber die Türen eines Tores meinen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen die Mehrzahl »ihre Türen«. Der Bezug ist nicht ganz eindeutig; sinngemäß könnte auch »dessen Türen« gemeint sein.
    reason: grammatical_ambiguity
  - marker: c
    text: 'Oder: »Kupfer«. Das hebräische Wort kann sowohl Kupfer als auch Bronze beziehungsweise eine andere Kupferlegierung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er legte … an
  rationale: עָשָׂה ist ein allgemeines Verb für »machen« oder »herstellen«. Bei der Anlage von Vorhöfen ist die deutsche Wendung »anlegen« natürlich; für die Türen wird derselbe Satzbau mit »dazu« fortgeführt, ohne eine besondere Bauweise festzulegen.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: den Vorhof der Priester
  rationale: חָצֵר bezeichnet hier einen Hof im Tempelbezirk. »Vorhof« ist im Deutschen die geläufige und würdige Bezeichnung für einen solchen Tempelhof; die Genitivverbindung gibt den hebräischen Status constructus transparent wieder.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: und den großen Vorhof
  rationale: עֲזָרָה bezeichnet im Tempelzusammenhang einen Hof beziehungsweise einen umgrenzten Bereich. »Großer Vorhof« wahrt die architektonische Bedeutung und gibt גְּדוֹלָה unmittelbar wieder.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: dazu Türen für den Vorhof
  rationale: דֶּלֶת bedeutet gewöhnlich »Tür« oder »Türflügel«. »Türen« bleibt deshalb im Haupttext stehen; »Tore« ist im monumentalen Bauzusammenhang ebenfalls möglich und wird in der Fußnote genannt.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: ihre Türen
  rationale: Das hebräische Suffix steht formal in der 3. Person maskulin Plural. »Ihre« bewahrt diese Form, obwohl der Bezug im Deutschen nicht völlig eindeutig ist und sinngemäß auch »dessen« verstanden werden kann.
- source_word: צִפָּה
  choice: überzog er
  rationale: צִפָּה bezeichnet hier das Überziehen oder Verkleiden eines Gegenstands mit Metall. »Überziehen« ist in einer architektonischen Beschreibung klar und idiomatisch.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen. »Bronze« ist für Tempelausstattung die übliche kontextgerechte Wiedergabe, ohne die metallurgische Unschärfe zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Vorhof« wahrt den etablierten tempelarchitektonischen Sprachgebrauch. Die knappe Reihung des Hebräischen bleibt erkennbar, wird aber durch »dazu« und die deutsche Wortstellung lesbar gestaltet.
