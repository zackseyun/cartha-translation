  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: de
  text: 'Und Salomo fertigte alle Geräte für das Haus Gottes an: den goldenen Altar, die Tische und darauf das Brot der Gegenwart[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Schaubrot“. Hebräisch: „Brot des Angesichts“ oder „Brot der Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fertigte … an
  rationale: Das häufige Verb עשה bedeutet „machen/herstellen“. Bei kunsthandwerklich hergestellten Tempelgeräten ist „anfertigen“ im Deutschen natürlich und präzise.
- source_word: כָּל הַכֵּלִים
  choice: alle Geräte
  rationale: כֵּלִים bezeichnet hier die für den Gottesdienst bestimmten Geräte und Ausstattungsstücke. „Geräte“ ist im deutschen Tempelkontext verständlich und weniger missverständlich als „Gefäße“, da auch Altar und Tische folgen.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: für das Haus Gottes
  rationale: Die knappe hebräische Konstruktion bezeichnet die zum Gotteshaus gehörende beziehungsweise für es bestimmte Ausstattung. „Für das Haus Gottes“ gibt diesen Bezug wieder, ohne nur einen Standort auszudrücken.
- source_word: מִזְבַּח הַזָּהָב
  choice: den goldenen Altar
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich durch ein Adjektiv wiedergegeben.
- source_word: הַשֻּׁלְחָנוֹת
  choice: die Tische
  rationale: Der Plural wird direkt bewahrt und bezeichnet die Tische, auf denen das heilige Brot lag.
- source_word: וַעֲלֵיהֶם
  choice: und darauf
  rationale: „Darauf“ nimmt im Deutschen knapp und eindeutig auf die unmittelbar zuvor genannten Tische Bezug.
- source_word: לֶחֶם הַפָּנִים
  choice: das Brot vor dem Angesicht Gottes
  rationale: Die Wendung bedeutet wörtlich etwa „Brot des Angesichts/der Gegenwart“. Die gewählte Formulierung macht verständlich, dass das Brot beständig vor Gott dargebracht beziehungsweise aufgelegt war, und vermeidet das heute wenig transparente Fachwort „Schaubrot“ im Haupttext.
theological_decisions:
- issue: Wiedergabe von בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: „Haus Gottes“ bewahrt die hebräische Bezeichnung und ist im Kontext klar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Wiedergabe von לֶחֶם הַפָּנִים
  choice: Brot vor dem Angesicht Gottes
  alternative: Schaubrot; Brot der Gegenwart
  rationale: Die Formulierung bewahrt das theologisch bedeutsame Motiv der göttlichen Gegenwart, macht den Bezug auf Gott für heutige Leser verständlich und vermeidet zugleich die mögliche Fehlbedeutung von „Gegenwart“ als Zeitbegriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten; erklärungsbedürftige kultische Terminologie wird transparent formuliert und in der Fußnote mit der traditionellen Bezeichnung verbunden.
