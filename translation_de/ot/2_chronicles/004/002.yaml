base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: de
  text: Er machte das Meer aus gegossenem Metall[a]. Es maß zehn Ellen von Rand zu Rand, war ringsum rund und fünf Ellen hoch. Eine Messschnur von dreißig Ellen umspannte es ringsum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gegossene Meer“. „Meer“ ist hier die Bezeichnung für das große Becken unter den Tempelgeräten.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text beschreibt den Umfang mithilfe einer dreißig Ellen langen Messschnur. Eine Elle war ein antikes Längenmaß, das je nach Maßsystem ungefähr 45 bis 52 Zentimetern entsprach.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: das Meer
  rationale: Die wörtliche Bezeichnung wird als Name des großen Beckens unter den Tempelgeräten beibehalten; das grammatische Geschlecht ist im Deutschen sächlich.
- source_word: מוּצָק
  choice: aus gegossenem Metall
  rationale: Das Partizip bezeichnet einen durch Gießen hergestellten Gegenstand; die Ergänzung „Metall“ macht den Herstellungssinn im Deutschen natürlich deutlich, ohne eine bestimmte Legierung einzutragen.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: zehn Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; die folgende Angabe „von Rand zu Rand“ kennzeichnet das gemessene Maß.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: von Rand zu Rand
  rationale: שָׂפָה bedeutet wörtlich „Lippe“ und bei einem Gefäß dessen Rand; „Rand“ ist die natürliche deutsche Entsprechung.
- source_word: עָגוֹל סָבִיב
  choice: ringsum rund
  rationale: Die Formulierung bewahrt sowohl die Aussage über die runde Form als auch das verstärkende סָבִיב.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: fünf Ellen hoch
  rationale: 'Die knappe deutsche Maßangabe gibt die wörtliche Aussage „seine Höhe: fünf Ellen“ idiomatisch wieder.'
- source_word: וְקָו
  choice: eine Messschnur
  rationale: קַו bezeichnet hier die Schnur beziehungsweise Linie, mit der gemessen wird; „Messschnur“ erhält das konkrete Bild.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: umspannte es ringsum
  rationale: Das Verb beschreibt das vollständige Herumgehen beziehungsweise Umschließen der Messschnur und wird im Deutschen prägnant wiedergegeben.
