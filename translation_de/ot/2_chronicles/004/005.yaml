source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: de
  text: Seine Wand war eine Handbreit[a] dick, und sein Rand war wie der Rand eines Bechers gearbeitet, wie eine Lilienblüte. Es fasste dreitausend Bat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Handbreit war ein kleines Längenmaß von etwa 7 bis 10 Zentimetern.
    reason: cultural_note
  - marker: b
    text: Das Bat war ein althebräisches Flüssigkeitsmaß. In 1. Könige 7,26 wird das Fassungsvermögen mit zweitausend Bat angegeben. Die Differenz kann auf Gesamt- gegenüber Nutzvolumen oder auf einer Abweichung der Textüberlieferung beruhen; sicher entscheiden lässt sich das nicht.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ טֶפַח
  choice: Seine Wand war eine Handbreit dick
  rationale: עָבְיוֹ bezeichnet hier die Wandstärke des gegossenen Beckens. Die deutsche Formulierung macht den sachlichen Bezug natürlich verständlich; טֶפַח ist die Maßeinheit „Handbreit“.
- source_word: שְׂפָתוֹ
  choice: sein Rand
  rationale: שָׂפָה bezeichnet bei einem Gefäß dessen Lippe oder Rand. „Rand“ ist im Deutschen für ein großes Becken idiomatisch.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: war wie der Rand eines Bechers gearbeitet
  rationale: Die Wendung beschreibt die gestaltete Form des Beckenrandes. „Gearbeitet“ gibt מַעֲשֵׂה wieder, ohne eine übermäßig technische Vorstellung einzutragen.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: wie eine Lilienblüte
  rationale: Die Nominalfügung vergleicht die Form des Randes anschaulich mit einer Lilienblüte.
- source_word: מַחֲזִיק ... יָכִיל
  choice: Es fasste
  rationale: Partizip und Verb bezeichnen zusammen das Fassungsvermögen. Eine einzige natürliche deutsche Verbform vermeidet eine schwerfällige Wiederholung.
- source_word: בַּתִּים שְׁלֹשֶׁת אֲלָפִים
  choice: dreitausend Bat
  rationale: Die Zahl wird unverändert wiedergegeben; „Bat“ bewahrt die althebräische Maßeinheit, statt eine unsichere moderne Umrechnung in den Haupttext einzutragen.
theological_decisions:
- issue: Abweichende Angabe des Fassungsvermögens gegenüber 1. Könige 7,26
  choice: Die Lesart des masoretischen Textes von 2. Chronik 4,5 („dreitausend Bat“) bleibt im Haupttext stehen und die Abweichung wird in einer Fußnote offengelegt.
  alternative: Die Angabe an 1. Könige 7,26 („zweitausend Bat“) angleichen oder beide Angaben durch eine bestimmte Erklärung harmonisieren.
  rationale: Die vorliegende hebräische Textgrundlage bezeugt eindeutig dreitausend. Ob die Differenz auf Gesamt- gegenüber Nutzvolumen oder auf eine Abweichung der Textüberlieferung zurückgeht, lässt sich nicht sicher entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gegenständliche Beschreibung bleibt anschaulich und nah am Hebräischen; die Maßeinheiten werden beibehalten und knapp erläutert.
