lexical_decisions:
- source_word: עַמּוּדִים
  choice: Säulen
  rationale: Der Ausdruck bezeichnet hier die beiden freistehenden Tempelsäulen; „Säulen“ ist der übliche und klare deutsche Architekturbegriff.
- source_word: גֻּלּוֹת
  choice: kugelförmige Aufsätze
  rationale: Das Wort bezeichnet offenbar gerundete Bauteile im Bereich der Säulenkapitelle. „Kugelförmige Aufsätze“ gibt die wahrscheinliche Form verständlich wieder, ohne die genaue, unsichere Gestalt als sicher auszugeben.
- source_word: כֹּתָרוֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang sind die verzierten oberen Abschlüsse der Säulen gemeint; „Kapitelle“ ist der präzise moderne Fachausdruck.
- source_word: רֹאשׁ
  choice: oben auf
  rationale: Das wörtliche „Kopf“ bezeichnet bei einem Bauwerk dessen oberen Bereich; „oben auf“ ist im Deutschen natürlich und sachgerecht.
- source_word: שְּׂבָכוֹת
  choice: Gitterwerke
  rationale: Gemeint sind netz- oder flechtartig gestaltete Zierelemente. „Gitterwerke“ bewahrt den konkreten architektonischen Sinn.
- source_word: לְכַסּוֹת
  choice: die … bedeckten
  rationale: Der Infinitiv kann den Zweck oder die Funktion ausdrücken. Im deutschen Inventarsatz gibt ein Relativsatz die Funktion flüssig wieder.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: beiden / zwei
  rationale: Die wiederholten Zahlwörter werden beibehalten, weil der hebräische Text die Bauteile einzeln und genau aufzählt.
