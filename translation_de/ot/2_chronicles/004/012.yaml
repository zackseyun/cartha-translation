  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: de
  text: die beiden Säulen, die beiden Schalen[a] und die beiden Kapitelle oben auf den Säulen sowie die beiden Gitterwerke[b] zum Bedecken der beiden Schalen der Kapitelle, die oben auf den Säulen waren;
