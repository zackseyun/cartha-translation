base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: de
  text: und die vierhundert Granatäpfel für die beiden Gitterwerke[a], je zwei Reihen Granatäpfel für jedes Gitterwerk, um die beiden schalenförmigen Aufsätze der Kapitelle zu bedecken, die oben auf den Säulen waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Netzgeflechte“. Das hebräische Wort bezeichnet netzartiges Zierwerk an den Kapitellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die beiden Schalen der Kapitelle“. Gemeint sind die gerundeten, schalenförmigen oberen Teile der Kapitelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: Granatäpfel
  rationale: Die konkrete Grundbedeutung bleibt erhalten; im Zusammenhang sind dekorative Granatapfelformen gemeint.
- source_word: אַרְבַּע מֵאוֹת
  choice: vierhundert
  rationale: Die Kardinalzahl wird direkt wiedergegeben.
- source_word: שְּׂבָכוֹת
  choice: Gitterwerke
  rationale: Das Wort bezeichnet netz- oder gitterartiges Zierwerk an den Kapitellen; „Gitterwerke“ ist im Deutschen anschaulich und sachgerecht.
- source_word: שְׁנַיִם טוּרִים
  choice: je zwei Reihen
  rationale: טוּרִים bezeichnet geordnete Reihen; „je“ verdeutlicht zusammen mit dem folgenden Ausdruck die distributive Zuordnung zu beiden Gitterwerken.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: für jedes Gitterwerk
  rationale: Wörtlich steht der Singular „für das eine Gitterwerk“, doch im Zusammenhang ist er distributiv auf beide Gitterwerke bezogen.
- source_word: לְכַסּוֹת
  choice: um … zu bedecken
  rationale: Der Infinitiv drückt hier den Zweck aus; „bedecken“ gibt die Grundbedeutung unmittelbar wieder.
- source_word: גֻּלּוֹת
  choice: Schalen
  rationale: Das Substantiv bezeichnet gerundete, schalenartige Teile. Die konkrete Bildsprache des Hebräischen bleibt damit erhalten.
- source_word: כֹּתָרוֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang sind die oberen Abschlüsse der Säulen gemeint.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: oben auf den Säulen
  rationale: Die räumliche Wendung bezeichnet im Zusammenhang mit den Kapitellen deren Lage auf den Säulen; die Formulierung ist natürlich und vermeidet das irreführende „vor den Säulen“.
