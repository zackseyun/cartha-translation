lexical_decisions:
- source_word: הַיָּם
  choice: das Meer
  rationale: יָם bedeutet wörtlich »Meer«, bezeichnet hier aber das große gegossene Wasserbecken des Tempels. »das Meer« bewahrt die gegenständliche Bezeichnung und bleibt eng am Hebräischen.
- source_word: אֶחָד
  choice: das eine
  rationale: Das Zahlwort bestimmt »Meer« näher und erhält den knappen Inventarstil des Zusammenhangs.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר ist eine Sammelbezeichnung für Rindvieh. Hier sind die zwölf Rinderfiguren gemeint, die das Meer trugen; »Rinder« gibt den Ausdruck wieder, ohne ein bestimmtes Geschlecht vorauszusetzen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe des zusammengesetzten Zahlworts.
- source_word: תַּחְתָּיו
  choice: darunter
  rationale: Die Präposition mit maskulinem Singularsuffix bezieht sich auf »das Meer«; »darunter« ist im Deutschen knapp und natürlich.
- source_word: אֶת ... וְאֶת
  choice: nicht gesondert wiedergegeben
  rationale: אֶת kennzeichnet die direkten Objekte und hat im Deutschen keine eigenständige Entsprechung; seine Funktion wird durch den Satzbau ausgedrückt.
