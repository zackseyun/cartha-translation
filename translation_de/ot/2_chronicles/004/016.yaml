  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: de
  text: Huram-Abi[a] fertigte auch die Töpfe, die Schaufeln, die Gabeln und alle dazugehörigen Geräte im Auftrag König Salomos für das Haus Jahwes aus polierter[b] Bronze an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Huram-Abi“; auch möglich: „Huram, sein Vater“. Hier ist wahrscheinlich der Name oder Titel des Kunsthandwerkers gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „blanker Bronze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: die Töpfe
  rationale: סִירוֹת bezeichnet hier Gefäße beziehungsweise Töpfe; „Töpfe“ ist in der Aufzählung der Tempelgeräte klar und sachgerecht.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: יָעִים sind Geräte zum Entfernen von Asche oder zum Bewegen von Glut; „Schaufeln“ ist die übliche und passende deutsche Wiedergabe.
- source_word: הַמִּזְלָגוֹת
  choice: die Gabeln
  rationale: מִזְלָגוֹת bezeichnet gabelartige Geräte. „Gabeln“ bewahrt die Formvorstellung, ohne ihren nicht ausdrücklich genannten Verwendungszweck festzulegen.
- source_word: כָּל כְּלֵיהֶם
  choice: alle dazugehörigen Geräte
  rationale: Das Suffix in כְּלֵיהֶם bezieht die weiteren Geräte auf die zuvor genannten Gegenstände. „Dazugehörigen“ gibt diesen Zusammenhang im Deutschen natürlicher wieder als das missverständliche „ihre Geräte“.
- source_word: חוּרָם אָבִיו
  choice: Huram-Abi
  rationale: Die Wortfolge wird im Zusammenhang am besten als Bezeichnung oder Name des Kunsthandwerkers verstanden; die Bindestrichform bewahrt beide hebräischen Bestandteile und vermeidet eine vorschnelle genealogische Deutung.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: für König Salomo
  rationale: Die Präposition לְ bezeichnet hier den Empfänger beziehungsweise Auftraggeber der Arbeit.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild und bezeichnet in diesem Zusammenhang den Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- source_word: נְחֹשֶׁת מָרוּק
  choice: aus polierter Bronze
  rationale: נְחֹשֶׁת bezeichnet im Kontext der Tempelausstattung Bronze, während מָרוּק eine geglättete beziehungsweise glänzend bearbeitete Oberfläche beschreibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ erhält seinen Charakter als Eigenname.
- issue: Deutung von חוּרָם אָבִיו
  choice: Huram-Abi als Name oder Bezeichnung des Kunsthandwerkers
  alternative: Huram, sein Vater
  rationale: Der Kontext und die chronistische Verwendung sprechen für eine zusammengesetzte Bezeichnung. Da die hebräische Form formal auch anders aufgefasst werden kann, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den Handwerker an den Anfang und hält die vollständige Aufzählung gut lesbar. „Haus Jahwes“ bewahrt die konkrete hebräische Ausdrucksweise; „dazugehörigen Geräte“ vermeidet im Deutschen eine unklare pronominale Zuordnung.
