lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: die Leuchter
  rationale: מְנוֹרָה bezeichnet einen Lampenständer beziehungsweise Leuchter. „Leuchter“ ist im deutschen Tempelkontext verständlich und würdig, ohne eine Transliteration zu benötigen.
- source_word: וְנֵרֹתֵיהֶם
  choice: und die dazugehörigen Lampen
  rationale: נֵר bezeichnet gewöhnlich eine Lampe oder deren Flamme. „Die dazugehörigen Lampen“ macht den Bezug des Suffixes auf die Leuchter im natürlichen Deutschen deutlich.
- source_word: לְבַעֲרָם
  choice: die … brennen sollten
  rationale: Der Infinitiv mit Suffix drückt hier den Zweck aus, die Lampen brennen zu lassen. Die deutsche Zweckbeschreibung mit „sollten“ fügt sich natürlich in den fortlaufenden Aufzählungssatz ein.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Ordnung. „Nach der Vorschrift“ bewahrt diesen verbindlichen Sinn in geläufigem Deutsch.
- source_word: לִפְנֵי הַדְּבִיר
  choice: vor dem inneren Heiligtum
  rationale: דְּבִיר bezeichnet den innersten beziehungsweise inneren Heiligtumsraum des Tempels. Die gewählte Formulierung bleibt nah am räumlichen Ausdruck und vermeidet eine unnötig festgelegte Fachbezeichnung.
- source_word: זָהָב סָגוּר
  choice: aus reinem Gold
  rationale: Die Verbindung bezeichnet hochwertiges, geläutertes Gold. „Reines Gold“ ist die natürliche deutsche Wiedergabe; „geläutertes Gold“ bleibt als Alternative in der Fußnote erhalten.
- source_word: וְאֶת
  choice: die
  rationale: Die Konjunktion mit dem Akkusativzeichen führt die Aufzählung des vorangehenden Verses weiter. Im Deutschen wird das Akkusativzeichen nicht eigens wiedergegeben; der fortlaufende Listencharakter bleibt durch die Satzform erhalten.
