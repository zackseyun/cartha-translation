  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe »Brandopfer«, »Priester« und »das Meer« bleiben erhalten. Die elliptische hebräische Wendung מַעֲשֵׂה הָעוֹלָה wird behutsam verständlich gemacht und ihre wörtliche Form in einer Fußnote dokumentiert.
