  text: וַ/יַּ֣עַשׂ כִּיּוֹרִים֮ עֲשָׂרָה֒ וַ֠/יִּתֵּן חֲמִשָּׁ֨ה מִ/יָּמִ֜ין וַ/חֲמִשָּׁ֤ה מִ/שְּׂמֹאול֙ לְ/רָחְצָ֣ה בָ/הֶ֔ם אֶת מַעֲשֵׂ֥ה הָ/עוֹלָ֖ה יָדִ֣יחוּ בָ֑/ם וְ/הַ/יָּ֕ם לְ/רָחְצָ֥ה לַ/כֹּהֲנִ֖ים בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: de
  text: Er machte zehn Becken[a] und stellte fünf rechts und fünf links auf, um darin zu waschen; darin spülte man ab, was zum Brandopfer gehörte[b]. Das Meer aber war zum Waschen für die Priester bestimmt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Waschkessel«. Gemeint sind große Becken für den Tempeldienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Werk des Brandopfers«; gemeint sind wahrscheinlich die Gegenstände oder Materialien, die zur Zubereitung des Brandopfers gehörten.'
    reason: lexical_alternative
  - marker: c
    text: »Das Meer« war der große bronzene Wasserbehälter des Tempels; es war für die Waschungen der Priester bestimmt.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: Becken
  rationale: Das Wort bezeichnet hier große Waschgefäße für den Tempeldienst. »Becken« ist im heutigen Deutsch klar und sachlich; »Waschkessel« ist als mögliche traditionellere Wiedergabe in der Fußnote vermerkt.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: auf die rechte / auf die linke Seite
  rationale: Die Formulierung gibt die räumliche Anordnung natürlich und eindeutig wieder.
- source_word: לְרָחְצָה
  choice: Sie dienten zum Waschen
  rationale: Der Infinitiv drückt den Zweck aus. Im Deutschen macht ein eigener Satz den Bezug auf die Becken klar.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: die Dinge, die für das Brandopfer bestimmt waren
  rationale: Wörtlich steht »das Werk des Brandopfers«. Die hebräische Wendung ist elliptisch und bezieht sich im Zusammenhang wahrscheinlich auf Gegenstände oder Materialien, die bei der Zubereitung des Brandopfers verwendet wurden.
- source_word: יָדִיחוּ
  choice: spülte man ... ab
  rationale: Die Hifil-Form bezeichnet das Ab- oder Ausspülen. Das deutsche unpersönliche »man« gibt den gewohnheitsmäßigen Gebrauch wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Subjekt festzulegen.
- source_word: וְהַיָּם
  choice: Das Meer
  rationale: »Das Meer« ist die feste Bezeichnung des großen bronzenen Wasserbehälters und bewahrt das charakteristische Bild des Ausgangstextes.
- source_word: לַכֹּהֲנִים
  choice: den Priestern
  rationale: 'Der Dativ bezeichnet hier Zweck beziehungsweise Gebrauch: Das Meer war zum Waschen für die Priester bestimmt.'
