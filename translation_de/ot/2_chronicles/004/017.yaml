base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: de
  text: In der Jordanebene goss der König sie in festem Lehmboden, zwischen Sukkot und Zeredata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 1. Könige 7,46 heißt der zweite Ort Zaretan. Zeredata ist vermutlich eine abweichende Form desselben Ortsnamens.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: in der Jordanebene
  rationale: כִּכָּר bezeichnet hier die Ebene beziehungsweise Auenlandschaft am Jordan. „Jordanebene“ ist geografisch klar und im modernen Deutschen natürlich.
- source_word: יְצָקָם
  choice: goss … sie
  rationale: יצק bezeichnet im Zusammenhang mit den bronzenen Tempelgeräten das Gießen von Metall; das Suffix wird mit „sie“ wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Bezeichnung verweist im Zusammenhang auf Salomo und wird ohne erklärenden Zusatz wiedergegeben.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: in festem Lehmboden
  rationale: עֲבִי bezeichnet Dicke oder Dichte; zusammen mit אֲדָמָה ist dichter, lehmiger Boden gemeint, der für den Metallguss genutzt wurde. Die Wiedergabe bleibt knapp, ohne ausdrücklich Formen in den Text einzutragen.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: zwischen Sukkot und Zeredata
  rationale: Die Ortsnamen werden nach der hebräischen Form transliteriert. „Zeredata“ bildet die in Chronik vorliegende Form צְרֵדָתָה ab und unterscheidet sie von der Form im Paralleltext.
theological_decisions: []
