source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: de
  text: 'Es stand auf zwölf Rindern: Drei waren nach Norden gerichtet, drei nach Westen, drei nach Süden und drei nach Osten. Das Meer ruhte oben auf ihnen, und ihre Hinterteile waren alle nach innen gerichtet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹמֵד
  choice: Es stand
  rationale: Das Qal-Partizip beschreibt prädikativ die Stellung des zuvor genannten Meeres; eine finite Verbform ist im Deutschen natürlich.
- source_word: בָּקָר
  choice: Rindern
  rationale: Der Sammelbegriff bezeichnet die zwölf Rinderfiguren, ohne ihr Geschlecht über den hebräischen Wortlaut hinaus als Stiere festzulegen.
- source_word: פֹנִים
  choice: waren … gerichtet
  rationale: Die wörtliche Vorstellung des Gesicht-Zuwendens bezeichnet hier idiomatisch die räumliche Ausrichtung der Figuren.
- source_word: צָפוֹנָה / יָמָּה / נֶגְבָּה / מִזְרָחָה
  choice: nach Norden / nach Westen / nach Süden / nach Osten
  rationale: Die Richtungsformen werden in der architektonischen Beschreibung natürlich wiedergegeben; יָמָּה bedeutet in diesem Zusammenhang idiomatisch »nach Westen«.
- source_word: הַיָּם
  choice: das Meer
  rationale: »Meer« bewahrt die kultische Bezeichnung des großen Tempelbeckens aus dem Kontext.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: ruhte oben auf ihnen
  rationale: Die Formulierung gibt sowohl die erhöhte Lage als auch die tragende Beziehung zu den Rinderfiguren wieder.
- source_word: אֲחֹרֵיהֶם
  choice: ihre Hinterteile
  rationale: Das Wort bezeichnet die rückwärtigen Körperteile der Rinderfiguren; die Wiedergabe ist genau und im Deutschen sachlich.
- source_word: בָּיְתָה
  choice: nach innen gerichtet
  rationale: Die Richtungsform bedeutet hier nach innen, also zum Zentrum unter dem Becken hin.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die kultische Objektbezeichnung »Meer« bleibt erhalten; die vier Himmelsrichtungen und die räumliche Anordnung werden klar und ohne zusätzliche Deutung formuliert.
