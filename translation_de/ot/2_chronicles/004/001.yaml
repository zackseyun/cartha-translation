source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: de
  text: Er machte einen Altar aus Bronze[a], zwanzig Ellen lang, zwanzig Ellen breit und zehn Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus Kupfer«. Das hebräische נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; bei Tempelgegenständen wird es gewöhnlich mit »Bronze« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה führt die Erzählung mit einer Handlung in der Vergangenheit fort. Im Deutschen kann die einleitende Konjunktion für einen natürlichen Stil unausgedrückt bleiben.
- source_word: מִזְבַּח
  choice: Altar
  rationale: Dies ist die übliche und sachlich genaue deutsche Wiedergabe der Opferstätte.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: In Texten über Stiftszelt und Tempel bezeichnet נְחֹשֶׁת Kupfer oder eine Kupferlegierung; bei Kultgegenständen ist »Bronze« die geläufige moderne Wiedergabe.
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: zwanzig Ellen lang
  rationale: Die adjektivische Maßangabe klingt im modernen Deutschen natürlicher als »zwanzig Ellen war seine Länge« und bewahrt Einheit und Maßzahl.
- source_word: וְעֶשְׂרִים אַמָּה רָחְבּוֹ
  choice: zwanzig Ellen breit
  rationale: Die Formulierung gibt die Breite knapp und idiomatisch wieder.
- source_word: וְעֶשֶׂר אַמּוֹת קוֹמָתוֹ
  choice: und zehn Ellen hoch
  rationale: Im baulichen Zusammenhang bezeichnet קוֹמָה die Höhe; die deutsche Maßkonstruktion ist klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antike Maßeinheit »Elle« bleibt erhalten; die drei Maße werden in einer natürlichen deutschen Parallelkonstruktion wiedergegeben.
