  text: וְ/הַֽ/מְזַמְּר֧וֹת וְ/הַ/מִּזְרָק֛וֹת וְ/הַ/כַּפּ֥וֹת וְ/הַ/מַּחְתּ֖וֹת זָהָ֣ב סָג֑וּר וּ/פֶ֣תַח הַ֠/בַּיִת דַּלְתוֹתָ֨י/ו הַ/פְּנִימִיּ֜וֹת לְ/קֹ֣דֶשׁ הַ/קֳּדָשִׁ֗ים וְ/דַלְתֵ֥י הַ/בַּ֛יִת לַ/הֵיכָ֖ל זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: de
  text: die Dochtscheren, die Sprengschalen, die Schalen und die Feuerpfannen aus reinem Gold sowie den Eingang des Hauses samt seinen inneren Türen zum Allerheiligsten und den Türen des Hauses zum Tempelraum, aus Gold.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: Dochtscheren
  rationale: Im Zusammenhang mit den Tempelgeräten bezeichnet das Wort Werkzeuge zum Kürzen der Lampendochte; »Dochtscheren« ist im Deutschen klarer als das altertümliche »Lichtschneuzen«.
- source_word: מִּזְרָקוֹת
  choice: Sprengschalen
  rationale: Das Wort bezeichnet Schalen, die insbesondere zum Auffangen oder Sprengen von Opferblut dienten. Die Wiedergabe unterscheidet sie von den nachfolgend genannten allgemeinen Schalen.
- source_word: כַּפּוֹת
  choice: Schalen
  rationale: Das Wort bezeichnet hier kleinere Gefäße oder Schalen; die allgemeine Wiedergabe bewahrt die Unterscheidung zu den Sprengschalen.
- source_word: מַּחְתּוֹת
  choice: Feuerpfannen
  rationale: Gemeint sind Gefäße zum Tragen von Glut oder Feuer. »Feuerpfannen« legt anders als »Räucherpfannen« keine ausschließliche Verwendung für Räucherwerk fest.
- source_word: זָהָב סָגוּר
  choice: reines Gold
  rationale: Die feste Verbindung bezeichnet hochwertiges, geläutertes Gold; »reines Gold« ist eine natürliche und etablierte deutsche Wiedergabe.
- source_word: פֶּתַח הַבַּיִת
  choice: den Eingang des Hauses
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. Der Akkusativ führt die in den vorangehenden Versen begonnene Aufzählung der angefertigten Gegenstände weiter.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: seine inneren Türen
  rationale: Der Plural bezeichnet die inneren Türen beziehungsweise Türflügel und wahrt den Gegensatz zu den anschließend genannten Türen des Tempelhauses.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: zum Allerheiligsten
  rationale: »Allerheiligstes« gibt den hebräischen Superlativ idiomatisch wieder und ist im Deutschen allgemein verständlich.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: und die Türen des Hauses zum Tempelraum
  rationale: הֵיכָל bezeichnet hier den Hauptraum des Tempels im Unterschied zum inneren Allerheiligsten. »Tempelraum« ist verständlicher und sachlich genauer als das kirchenbaulich geprägte »Langhaus«.
- source_word: זָהָב
  choice: aus Gold
  rationale: Das abschließende Nomen bestimmt das Material der Türen; die deutsche Präpositionalfügung gibt diese knappe nominale Aussage natürlich wieder.
theological_decisions:
- issue: Bezeichnung des innersten Heiligtums
  choice: Allerheiligstes
  alternative: Heiligstes der Heiligen
  rationale: Die idiomatische deutsche Superlativform bewahrt die Bedeutung der hebräischen Steigerungsform, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Abgrenzung von הֵיכָל gegenüber dem Allerheiligsten
  choice: Tempelraum
  alternative: Heiligtum
  rationale: »Tempelraum« verdeutlicht den räumlichen Gegensatz zum inneren Allerheiligsten; »Heiligtum« könnte im Deutschen auch den gesamten Tempelkomplex oder gerade den heiligsten Bereich bezeichnen.
translation_notes:
  register: Moderner, würdiger Inventarstil. Die elliptische Satzform und der Akkusativ werden beibehalten, weil Vers 22 die in den vorhergehenden Versen begonnene Aufzählung fortsetzt. Der Doppelpunkt macht verständlich, dass die folgenden Türen den Eingang näher bestimmen, ohne die knappe Struktur des Hebräischen unnötig aufzulösen.
