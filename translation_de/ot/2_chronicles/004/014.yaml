base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: de
  text: Er fertigte die Gestelle[a] und die Becken auf den Gestellen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Untergestelle“; das hebräische Wort bezeichnet hier die tragenden Konstruktionen für die Becken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: die Gestelle
  rationale: מְכוֹנוֹת bezeichnet hier die kunstvoll gefertigten tragenden Konstruktionen für die Becken. „Gestelle“ ist im heutigen Deutsch konkret und funktional; „Untergestelle“ ist ebenfalls möglich.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: עשה bedeutet allgemein „machen, herstellen“. Im Zusammenhang mit kunsthandwerklich hergestellten Tempelgeräten gibt „anfertigen“ den Sinn natürlich wieder, ohne eine besondere Herstellungstechnik hinzuzufügen.
- source_word: הַכִּיֹּרוֹת
  choice: die Becken
  rationale: כִּיּוֹר bezeichnet hier Becken, die zum Tempelinventar gehörten. „Becken“ ist die klare, gegenwärtige deutsche Bezeichnung; altertümliche Fachwörter sind unnötig.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier die räumliche Anordnung der Becken auf den Gestellen.
- source_word: וְאֶת ... וְאֶת
  choice: und … und
  rationale: Die wiederholte Verbindung gliedert die beiden angefertigten Bestandteile. Im Deutschen wird dies durch die Koordination der beiden Aussagen wiedergegeben.
