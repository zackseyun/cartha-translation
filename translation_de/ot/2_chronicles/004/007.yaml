  text: וַ֠/יַּעַשׂ אֶת מְנֹר֧וֹת הַ/זָּהָ֛ב עֶ֖שֶׂר כְּ/מִשְׁפָּטָ֑/ם וַ/יִּתֵּן֙ בַּֽ/הֵיכָ֔ל חָמֵ֥שׁ מִ/יָּמִ֖ין וְ/חָמֵ֥שׁ מִ/שְּׂמֹֽאול־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: de
  text: Er fertigte zehn goldene Leuchter nach der für sie geltenden Vorschrift[a] an und stellte sie in den Tempelraum[b], fünf auf die rechte und fünf auf die linke Seite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der für sie festgelegten Ordnung“ beziehungsweise „nach ihrer Vorlage“. Das hebräische Wort kann eine verbindliche Regel, festgelegte Ausführung oder Form bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier das eigentliche Tempelgebäude oder dessen Hauptraum, nicht den gesamten Tempelbezirk.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „fünf rechts und fünf links“. Je nach zugrunde gelegter Blickrichtung können damit die Süd- und die Nordseite gemeint sein.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Qal-Wayyiqtol von עשה bezeichnet hier das Herstellen der Tempelausstattung. „Fertigte … an“ ist im Deutschen präziser und natürlicher als das allgemeinere „machte“.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: zehn goldene Leuchter
  rationale: מְנוֹרָה bezeichnet einen Leuchter beziehungsweise Lampenständer, nicht nur eine einzelne Lampe. „Leuchter“ ist im Kontext biblischer Heiligtumsausstattung verständlich und idiomatisch; הַזָּהָב wird attributiv mit „goldene“ wiedergegeben.
- source_word: כְּמִשְׁפָּטָם
  choice: nach der für sie geltenden Vorschrift
  rationale: מִשְׁפָּט kann eine festgelegte Regel, Ordnung oder Ausführungsvorgabe bezeichnen. Die Formulierung bewahrt den normativen Sinn und legt sich nicht unnötig auf eine rein bauliche „Vorlage“ fest.
- source_word: וַיִּתֵּן
  choice: und stellte sie
  rationale: נתן bedeutet grundsätzlich „geben, setzen, stellen“. Bei der räumlichen Anordnung von Einrichtungsgegenständen ist „stellte“ die natürliche deutsche Entsprechung.
- source_word: בַּהֵיכָל
  choice: in den Tempelraum
  rationale: הֵיכָל bezeichnet hier das eigentliche Tempelgebäude beziehungsweise dessen Hauptraum, nicht den gesamten Tempelbezirk. „Tempelraum“ hält diese Eingrenzung im Haupttext fest.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: fünf auf die rechte und fünf auf die linke Seite
  rationale: Die hebräischen Ausdrücke nennen wörtlich die rechte und linke Seite. Diese Perspektive wird bewahrt, statt sie deutend in Süd- und Nordseite umzuwandeln.
theological_decisions: []
