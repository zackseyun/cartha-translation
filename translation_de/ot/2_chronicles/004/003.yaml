base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: de
  text: Unter dem Meer befanden sich ringsum Rinderfiguren[a], die es umgaben, zehn auf jede Elle[b]. In zwei Reihen umschlossen sie das Meer. Die Rinderfiguren waren in einem Guss mit dem Meer gegossen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Abbilder von Rindern“; das Hebräische bezeichnet dargestellte Rinderformen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „zehn auf die Elle“; wahrscheinlich sind zehn Figuren je Elle des Umfangs gemeint.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „in seinem Guss“; die Figuren wurden beim Guss als Teil desselben Werkstücks geformt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: Rinderfiguren
  rationale: דְּמוּת bezeichnet Gestalt, Abbild oder Darstellung; gemeint sind keine lebenden Tiere, sondern plastische Rinderformen. „Rinderfiguren“ ist präzise und in modernem Deutsch natürlich.
- source_word: תַּחַת לוֹ
  choice: unter ihm
  rationale: Die Wendung bezeichnet die räumliche Lage unterhalb des als „Meer“ bezeichneten Beckens.
- source_word: סָבִיב סָבִיב
  choice: ringsum
  rationale: Die hebräische Wiederholung verstärkt die Vorstellung einer vollständigen Umfassung; „ringsum“ gibt dies idiomatisch wieder.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: zehn auf jede Elle
  rationale: Die Formulierung bewahrt das Verhältnis zwischen Anzahl und Längenmaß und lässt erkennen, dass entlang des Umfangs auf jede Elle zehn Figuren kamen.
- source_word: הַיָּם
  choice: das »Meer«
  rationale: „Meer“ ist die überlieferte Bezeichnung für das große gegossene Tempelbecken; Anführungszeichen kennzeichnen es verständlich als Namen eines Gegenstands.
- source_word: שְׁנַיִם טוּרִים
  choice: in zwei Reihen
  rationale: טוּרִים bezeichnet geordnete Reihen; die Formulierung beschreibt die Anordnung der Figuren klar.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: zusammen mit ihm in einem Guss gegossen
  rationale: Die Metallurgieformulierung besagt, dass Rinderfiguren und Becken beim selben Guss entstanden und nicht nachträglich angebracht wurden.
