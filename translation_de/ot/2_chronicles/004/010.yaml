  text: וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֧תֶף הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: de
  text: Und das Meer stellte er an der Südostseite auf[a], dem Süden zugewandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an der rechten Seite ostwärts, gegenüber dem Süden“. Bei der im Hebräischen üblichen räumlichen Orientierung nach Osten entspricht die rechte Seite dem Süden; zusammen weist die Formulierung auf die Südostseite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Und das
  rationale: וְ verbindet die Ortsangabe mit dem vorhergehenden Zusammenhang; אֵת kennzeichnet das vorangestellte bestimmte Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: הַיָּם
  choice: Meer
  rationale: Gemeint ist das große bronzene Becken der Tempelausstattung. Die wörtliche, traditionsreiche Bezeichnung „Meer“ bleibt erhalten.
- source_word: נָתַן
  choice: stellte … auf
  rationale: Im Zusammenhang mit einem Einrichtungsgegenstand gibt „aufstellen“ das gezielte Platzieren idiomatisch wieder.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: an der Südostseite
  rationale: כָּתֵף bezeichnet in räumlicher Verwendung die Seite; „rechts“ entspricht bei der üblichen Orientierung nach Osten dem Süden, während קֵדְמָה die östliche Richtung hinzufügt. Zusammen ergibt sich die südöstliche Lage.
- source_word: מִמּוּל נֶגְבָּה
  choice: gegen Süden
  rationale: מִמּוּל bezeichnet ein Gegenüber beziehungsweise eine Ausrichtung, und נֶגְבָּה die Richtung Süden. „Gegen Süden“ bewahrt diese räumliche Relation, ohne die genaue bauliche Anordnung stärker festzulegen.
theological_decisions: []
