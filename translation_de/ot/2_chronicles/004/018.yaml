base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: de
  text: Salomo fertigte alle diese Geräte in sehr großer Menge an, denn das Gewicht der Bronze wurde nicht ermittelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ließ sich nicht ermitteln. Das hebräische Verb kann sowohl das tatsächliche Ausbleiben einer Feststellung als auch die Unmöglichkeit ausdrücken, das Gewicht festzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fertigte … an
  rationale: Das häufige Verb עשה bezeichnet hier die Herstellung der zuvor genannten Tempelgegenstände. „Fertigte … an“ ist im Deutschen konkret und natürlich.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: alle diese Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Gegenstände, Gerätschaften oder Gefäße. „Geräte“ umfasst die verschiedenen Tempelgegenstände des Zusammenhangs, ohne sie auf Gefäße im engeren Sinn zu beschränken.
- source_word: לָרֹב מְאֹד
  choice: in sehr großer Menge
  rationale: Die Wendung bezeichnet eine außerordentlich große Menge; „sehr“ gibt die Verstärkung durch מְאֹד wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine begründende Erklärung ein. „Denn“ verbindet die beiden Aussagen in einem würdigen, natürlichen Erzählstil.
- source_word: לֹא נֶחְקַר
  choice: ließ sich nicht ermitteln
  rationale: Das Nifal von חקר bedeutet, dass etwas nicht erforscht beziehungsweise festgestellt wurde. Im Zusammenhang mit dem Gewicht drückt „ließ sich nicht ermitteln“ verständlich aus, dass keine Gewichtsangabe feststand; die weniger modale Lesart wird in der Fußnote bewahrt.
- source_word: מִשְׁקַל הַנְּחֹשֶׁת
  choice: das Gewicht der Bronze
  rationale: מִשְׁקַל bezeichnet konkret das Gewicht. נְחֹשֶׁת wird bei den metallenen Tempelgeräten sachgerecht mit „Bronze“ wiedergegeben.
