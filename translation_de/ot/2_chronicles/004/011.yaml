base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: de
  text: 'Huram fertigte die Töpfe, die Schaufeln und die Schalen an. Und Hiram[a] vollendete die Arbeit, die er für König Salomo im Haus Gottes ausführte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zu Beginn des Verses „Huram“, hier jedoch die Namensform „Hiram“.
    reason: Die beiden Schreibformen חוּרָם und חירם erscheinen im selben Vers; die Fußnote macht den Wechsel transparent.
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Huram / Hiram
  rationale: 'Der masoretische Text verwendet im selben Vers zwei Namensformen: zuerst חוּרָם (Huram), danach חירם (Hiram). Die Übersetzung bildet diesen tatsächlichen Wechsel ab, statt ihn stillschweigend zu vereinheitlichen.'
- source_word: הַסִּירוֹת
  choice: die Töpfe
  rationale: סִירוֹת bezeichnet Töpfe oder größere Gefäße; „Töpfe“ ist konkret, verständlich und legt ihre genaue Funktion nicht unnötig fest.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: יָעִים bezeichnet Geräte zum Schaufeln, besonders im Zusammenhang mit dem Altar; „Schaufeln“ ist die übliche sachgerechte Wiedergabe.
- source_word: הַמִּזְרָקוֹת
  choice: die Schalen
  rationale: מִזְרָקוֹת sind für den Kult bestimmte Schalen. „Schalen“ wahrt den Gegenstandsbezug, ohne ihre konkrete rituelle Verwendung in den Text hineinzulesen.
- source_word: וַיְכַל
  choice: vollendete
  rationale: כלה bezeichnet hier das Abschließen einer Arbeit. „Vollendete“ gibt den erzählerischen und handwerklichen Zusammenhang würdig und natürlich wieder.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: die Arbeit, die er … ausführte
  rationale: Die Wiederholung von עשה wird im Deutschen durch „Arbeit“ und „ausführte“ idiomatisch wiedergegeben, ohne den Inhalt zu verändern.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: am Haus Gottes
  rationale: בְּ kann hier lokal („im“) oder auf das Bauwerk als Gegenstand der Arbeit bezogen verstanden werden. „am Haus Gottes“ ist im Deutschen natürlich und bewahrt den räumlich-sachlichen Bezug, ohne das hebräische „Haus Gottes“ durch „Tempel“ zu ersetzen.
