  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: de
  text: und zur Eintragung aller ihrer kleinen Kinder[a], ihrer Frauen, ihrer Söhne und ihrer Töchter in den Registern der ganzen Versammlung; denn in ihrer Treue[b] heiligten sie sich in Heiligkeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Eintragung aller ihrer Kinder in die Geschlechtsregister“. Das hebräische Verb bezeichnet die Aufnahme in Familien- oder Geschlechtsregister.'
    reason: lexical_alternative
  - marker: b
    text: „Treue“ meint hier wahrscheinlich Verlässlichkeit und gewissenhafte Pflichterfüllung, nicht in erster Linie einen inneren Glaubensakt.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht hier eine betonte Wiederholung des Heiligkeitsbegriffs. Möglich sind auch: „sie weihten sich in Heiligkeit“ oder „sie hielten sich heilig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: und für die Eintragung
  rationale: Das Hitpael von יחס bezeichnet in den Chronikbüchern die Aufnahme in Geschlechts- oder Familienregister. „Eintragung“ ist im Deutschen natürlich und bewahrt den Verwaltungssinn; die genealogische Nuance wird in der Fußnote erläutert.
- source_word: בְּכָל טַפָּם
  choice: aller ihrer kleinen Kinder
  rationale: טַף bezeichnet besonders die kleinen Kinder. Die Wiedergabe ist genauer als das allgemeinere „Kinder“ und idiomatischer als „ihre Kleinen“ in dieser Aufzählung.
- source_word: נְשֵׁיהֶם
  choice: ihrer Frauen
  rationale: Im Zusammenhang der Familienaufzählung sind die Ehefrauen gemeint; „Frauen“ ist im modernen Deutschen die natürliche Bezeichnung.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihrer Söhne und ihrer Töchter
  rationale: Die ausdrückliche Unterscheidung des hebräischen Textes bleibt erhalten.
- source_word: לְכָל קָהָל
  choice: der ganzen Versammlung
  rationale: קָהָל bezeichnet die gesamte Gemeinschaft. Die Genitiv-Apposition ist im Deutschen flüssiger als eine mechanische Wiederholung von „für“ und lässt den genauen syntaktischen Anschluss offen.
- source_word: בֶאֱמוּנָתָם
  choice: in ihrer Treue
  rationale: אֱמוּנָה meint hier im kultisch-administrativen Zusammenhang vor allem Verlässlichkeit und pflichtgetreue Loyalität, nicht vorrangig inneren Glauben.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: heiligten sie sich als heilig
  rationale: Die bewusst markierte Formulierung bewahrt die hebräische Wiederholung desselben Bedeutungsfeldes von קדש, ohne sie auf den Dienst am Heiligtum oder auf heilige Gaben festzulegen.
theological_decisions:
- issue: Bedeutung von אֱמוּנָה im kultisch-administrativen Kontext
  choice: Treue beziehungsweise Verlässlichkeit bei heiligen Pflichten
  alternative: Glaube im innerlichen oder religiös-vertrauensvollen Sinn
  rationale: Der Zusammenhang handelt von der Erfassung und Versorgung priesterlicher und levitischer Haushalte. Daher liegt pflichtgetreue Zuverlässigkeit näher; die Übersetzung schließt eine religiöse Dimension jedoch nicht grundsätzlich aus.
- issue: Verhältnis von יִתְקַדְּשׁוּ und קֹדֶשׁ
  choice: reflexive Heiligung mit ausdrücklich bewahrter Heiligkeitsaussage
  alternative: „sie weihten sich dem Heiligen“ oder „sie hielten sich heilig“
  rationale: Der hebräische Wortlaut ist knapp und ungewöhnlich. Die Hauptfassung wahrt seine emphatische Doppelung, während die Fußnote glattere syntaktische Deutungen nennt, ohne eine davon dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Familienaufzählung bleibt vollständig erhalten. Die Schlusswendung ist bewusst leicht fremdartig, weil auch das Hebräische die Heiligkeitswurzel in Verb und Substantiv wiederholt; die Fußnote erschließt natürlichere Alternativen.
