translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die administrative Sprache des Abschnitts bleibt erkennbar; mögliche Bezüge von „Groß und Klein“ auf Rang oder Alter werden nicht einseitig festgelegt.
