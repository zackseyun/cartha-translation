base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: de
  text: Unter seiner Aufsicht standen in den Städten der Priester Eden[a], Minjamin, Jeschua, Schemaja, Amarja und Schechanja, um ihren Brüdern[b] nach den Abteilungen[c] zuverlässig zuzuteilen, an Groß und Klein gleichermaßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihm zur Seite standen“ beziehungsweise „Unter seiner Verantwortung standen“; die hebräische Wendung kann Mitwirkung, Zuständigkeit oder Aufsicht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Brüder“ sind hier ihre Mitbrüder innerhalb der priesterlichen Gemeinschaft gemeint.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort bezeichnet geordnete Dienstabteilungen; gemeint ist die Zuteilung entsprechend diesen Abteilungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Unter seiner Aufsicht standen
  rationale: Die Wendung עַל־יָד kann Zuständigkeit, Beauftragung oder Unterordnung ausdrücken. Im administrativen Zusammenhang gibt „unter seiner Aufsicht“ den Bezug auf den zuvor genannten Verantwortlichen natürlich wieder.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Eden, Minjamin, Jeschua, Schemaja, Amarja und Schechanja
  rationale: Die Personennamen werden in geläufiger deutscher Bibelnamensform wiedergegeben.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: In den Städten der Priester
  rationale: Die Genitivverbindung wird direkt und verständlich wiedergegeben.
- source_word: בֶּאֱמוּנָה
  choice: zuverlässig
  rationale: אֱמוּנָה bezeichnet hier die treue und verlässliche Ausführung einer Verwaltungsaufgabe.
- source_word: לָתֵת
  choice: verteilten sie die Gaben
  rationale: Wörtlich bedeutet das Verb „geben“. Im Zusammenhang der geregelten Zuteilung bezeichnet es das Verteilen; „die Gaben“ nimmt den Gegenstand aus dem unmittelbaren Kontext auf, ohne eine bestimmte Art von Anteil festzulegen.
- source_word: לַאֲחֵיהֶם
  choice: an ihre Brüder
  rationale: Die konkrete Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des Hebräischen bleibt erhalten; gemeint sind ihre Amts- und Gemeinschaftsbrüder.
- source_word: בְּמַחְלְקוֹת
  choice: geordnet nach ihren Abteilungen
  rationale: מַחְלְקוֹת bezeichnet die eingerichteten Dienstabteilungen beziehungsweise Ordnungsgruppen. Die Formulierung macht den administrativen Bezug deutlich.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: an Groß und Klein gleichermaßen
  rationale: Die paarige Wendung schließt unterschiedslos alle ein. Da sie Rang, Alter oder Bedeutung bezeichnen kann, bleibt die deutsche Formulierung entsprechend offen.
