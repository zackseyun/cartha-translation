  source_fidelity: Der Entwurf trifft die Zeitangaben und die Vorstellung von Haufen grundsätzlich. „aufzuschichten“ gibt jedoch nur den allgemeinen Vorgang wieder und lässt לְיִסּוֹד („zu gründen/den Grund zu legen“) unberücksichtigt. Außerdem ist „waren sie damit fertig“ weniger direkt als das transitive „sie vollendeten sie“.
