base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: de
  text: Im dritten Monat begannen sie, die Haufen anzulegen,[a] und im siebten Monat vollendeten sie sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sie begannen, die Haufen zu gründen“. Gemeint ist, dass sie die Haufen von ihrer Grundlage her anzulegen begannen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: Im dritten Monat
  rationale: חֹדֶשׁ bezeichnet in dieser Zeitangabe einen Monat; die Präposition ב wird idiomatisch mit „im“ wiedergegeben.
- source_word: הֵחֵלּוּ
  choice: begannen sie
  rationale: Die Form bezeichnet hier den Beginn einer Tätigkeit.
- source_word: הָעֲרֵמוֹת לְיִסּוֹד
  choice: die Haufen aufzuschichten
  rationale: Die ungewöhnliche Konstruktion bedeutet wörtlich etwa, dass sie begannen, die Haufen zu gründen bzw. deren Grund zu legen. „Aufzuschichten“ gibt den konkreten Vorgang im Deutschen natürlich wieder, ohne aus den Haufen abstrakte Bauwerke zu machen.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: und im siebten Monat
  rationale: Die Verbindung setzt die chronologische Angabe unmittelbar fort.
- source_word: כִּלּוּ
  choice: waren sie damit fertig
  rationale: Das Verb bedeutet „vollenden/beenden“; „damit“ nimmt die zuvor genannte Tätigkeit auf, deren Objekt im Hebräischen unausgesprochen bleibt.
