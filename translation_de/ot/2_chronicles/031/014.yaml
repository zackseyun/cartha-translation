  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: de
  text: Kore, der Sohn Jimnas, der Levit, der Torhüter an der Ostseite, war für die freiwilligen Gaben Gottes zuständig, um die Abgabe für Jahwe sowie die hochheiligen Gaben auszuteilen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „geben“; hier ist das Austeilen dessen gemeint, was Gott geweiht worden war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die hochheiligen Dinge“. Gemeint sind Dinge von besonderem Heiligkeitsgrad, nicht der Tempelraum, der „das Allerheiligste“ genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: Kore, der Sohn Jimnas
  rationale: Der Eigenname wird in geläufiger deutscher Form wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten. Das vorangestellte וְ wird im Deutschen nicht eigens wiedergegeben, da es hier den fortlaufenden Bericht verbindet.
- source_word: הַלֵּוִי הַשּׁוֹעֵר
  choice: der Levit und Torhüter
  rationale: Beide bestimmten Amts- beziehungsweise Standesbezeichnungen werden klar und in heutiger Standardsprache wiedergegeben.
- source_word: לַמִּזְרָחָה
  choice: an der Ostseite
  rationale: Die Form bezeichnet die östliche Lage. Eine ausdrückliche Ergänzung wie „am Osttor“ wäre möglich, würde aber ein im hebräischen Ausdruck nicht genanntes Tor eintragen.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: war für die freiwilligen Gaben Gottes verantwortlich
  rationale: עַל bezeichnet im administrativen Zusammenhang Zuständigkeit. „Freiwillige Gaben“ gibt den kultischen Sinn von נִדְבוֹת verständlich wieder; der Genitiv „Gottes“ bewahrt die knappe Form des Ausgangstextes.
- source_word: לָתֵת
  choice: austeilen
  rationale: Wörtlich bedeutet der Infinitiv „geben“. Im Zusammenhang mit Kores Aufsicht über eingegangene Gaben bezeichnet er deren Ausgabe beziehungsweise Verteilung.
- source_word: תְּרוּמַת יְהוָה
  choice: die Abgabe Jahwes
  rationale: תְּרוּמָה bezeichnet eine ausgesonderte Abgabe oder einen Beitrag. Der deutsche Genitiv bildet die hebräische Status-constructus-Verbindung eng ab, ohne einseitig festzulegen, ob Zugehörigkeit oder Bestimmung im Vordergrund steht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: sowie die hochheiligen Gaben
  rationale: Die hebräische Steigerungsform bezeichnet Dinge von höchster Heiligkeit. „Gaben“ entspricht dem Zusammenhang ihrer Austeilung und vermeidet eine Verwechslung mit dem Allerheiligsten als Raum.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der Eigenname Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von קָדְשֵׁי הַקֳּדָשִׁים
  choice: die hochheiligen Gaben
  alternative: die hochheiligen Dinge; das Allerheiligste
  rationale: Im Zusammenhang der Austeilung sind geheiligte Gaben oder Gegenstände gemeint, nicht der innerste Tempelraum. Die Formulierung wahrt den höchsten Heiligkeitsgrad, ohne einen Ort zu bezeichnen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. Kultische Fachbegriffe werden verständlich formuliert, ohne die Zugehörigkeitsbeziehungen des hebräischen Textes unnötig festzulegen.
