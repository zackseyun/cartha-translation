  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: de
  text: 'Asarja, der oberste Priester aus dem Haus Zadok, antwortete ihm: »Seit man begonnen hat, die Abgabe[a] in das Haus Jahwes zu bringen, haben wir gegessen und sind satt geworden, und reichlich ist übrig geblieben. Denn Jahwe hat sein Volk gesegnet; was noch übrig ist, ist diese große Menge.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Opfergabe“; das hebräische Wort bezeichnet eine Abgabe, die für den heiligen Gebrauch ausgesondert wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: der führende Priester
  rationale: Bewahrt den Sinn eines Priesters in leitender Stellung, ohne den späteren feststehenden Titel „Hohepriester“ in den hebräischen Ausdruck hineinzulesen.
- source_word: לְבֵית צָדוֹק
  choice: aus dem Haus Zadok
  rationale: Gibt die Zugehörigkeit zur zadokidischen Priesterfamilie in natürlichem Deutsch wieder.
- source_word: מֵהָחֵל
  choice: Seit man begonnen hat
  rationale: Die Konstruktion bezeichnet den zeitlichen Ausgangspunkt; das unpersönliche „man“ lässt das im Hebräischen nicht ausdrücklich genannte Subjekt offen.
- source_word: הַתְּרוּמָה
  choice: die Abgabe
  rationale: Bezeichnet hier eine für den heiligen Gebrauch ausgesonderte und zum Tempel gebrachte Gabe; „Abgabe“ passt zum Zusammenhang der gesammelten Vorräte.
- source_word: לָבִיא בֵית יְהוָה
  choice: in das Haus Jahwes zu bringen
  rationale: Gibt die gerichtete Bewegung zum beziehungsweise in den Tempelbereich wieder.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: haben wir gegessen und sind satt geworden
  rationale: Die idiomatische deutsche Form bewahrt sowohl das Essen als auch die ausdrücklich genannte Sättigung.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: und reichlich ist übrig geblieben
  rationale: Vermittelt den großen Überschuss, ohne ihn mit dem anschließenden Ausdruck für die vorhandene Menge zusammenzuziehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Umschrift wieder.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: hat sein Volk gesegnet
  rationale: Das Perfekt begründet den gegenwärtigen Überfluss mit Jahwes bereits wirksam gewordenem Segen.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: was noch übrig ist, ist diese große Menge
  rationale: Versteht הַנּוֹתָר substantivisch und bezieht הֶהָמוֹן im Sachzusammenhang auf die große Menge der verbliebenen Vorräte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich; seine Umschrift bewahrt dies, statt ihn durch einen Titel zu ersetzen.
- issue: Amtsbezeichnung הַכֹּהֵן הָרֹאשׁ
  choice: der führende Priester
  alternative: der Hohepriester
  rationale: Die gewählte Fassung bewahrt die hierarchische Bedeutung von רֹאשׁ, ohne den Ausdruck vorschnell mit dem technischen Amtstitel gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich, während „Haus Jahwes“ und „Haus Zadok“ die biblischen Haus-Bezeichnungen bewahren. Das unbestimmte Subjekt in „Seit man begonnen hat“ erhält die Offenheit des hebräischen Textes.
