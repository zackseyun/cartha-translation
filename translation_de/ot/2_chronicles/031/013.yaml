  text: וִֽ/יחִיאֵ֡ל וַ֠/עֲזַזְיָהוּ וְ/נַ֨חַת וַ/עֲשָׂהאֵ֜ל וִֽ/ירִימ֤וֹת וְ/יוֹזָבָד֙ וֶ/אֱלִיאֵ֣ל וְ/יִסְמַכְיָ֔הוּ וּ/מַ֖חַת וּ/בְנָיָ֑הוּ פְּקִידִ֗ים מִ/יַּ֤ד כונניהו וְ/שִׁמְעִ֣י אָחִ֔י/ו בְּ/מִפְקַד֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/עֲזַרְיָ֖הוּ נְגִ֥יד בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: de
  text: Jehiël, Asasja, Nahat, Asaël, Jerimot, Josabad, Eliël, Jismachja, Mahat und Benaja waren Beauftragte unter der Leitung[a] Konanjas und seines Bruders Schimi, gemäß dem Auftrag[b] des Königs Hiskija und Asarjas, des Vorstehers des Hauses Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus der Hand Konanjas und seines Bruders Schimi«; gemeint sein können ihre Leitung, Aufsicht oder Zuständigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf Anordnung« beziehungsweise »unter der Aufsicht« des Königs Hiskija und Asarjas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: Beauftragte
  rationale: Das Substantiv bezeichnet eingesetzte Amtsträger mit Verwaltungsverantwortung. »Beauftragte« passt zum organisatorischen Zusammenhang, ohne einen bestimmten Rang oder eine priesterliche Hierarchie vorauszusetzen.
- source_word: מִיַּד
  choice: unter der Leitung
  rationale: Wörtlich steht »von/aus der Hand«. Die Wendung bezeichnet hier Zuständigkeit oder Aufsicht; »unter der Leitung« gibt diese administrative Unterordnung natürlich wieder.
- source_word: אָחִיו
  choice: seines Bruders
  rationale: Die einfache Verwandtschaftsbezeichnung bezieht sich auf Schimi als Bruder Konanjas.
- source_word: בְּמִפְקַד
  choice: gemäß dem Auftrag
  rationale: Das Wort kann Auftrag, Anordnung oder Aufsicht bezeichnen. »Gemäß dem Auftrag« bewahrt die formelle Bevollmächtigung, ohne die Mehrdeutigkeit unnötig auf eine königliche Anordnung oder bloße Aufsicht einzuengen.
- source_word: נְגִיד
  choice: Vorsteher
  rationale: Der Ausdruck bezeichnet einen Leiter oder führenden Amtsträger. »Vorsteher« ist im Tempelzusammenhang verständlich und vermeidet das missverständliche »Fürst«.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche und im Deutschen geläufige Bezeichnung bleibt erhalten; im Zusammenhang ist damit der Tempel gemeint.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Jehiël, Asasja, Nahat, Asaël, Jerimot, Josabad, Eliël, Jismachja, Mahat, Benaja, Konanja, Schimi, Hiskija, Asarja
  rationale: Die Namen folgen etablierten deutschen Bibelformen beziehungsweise einer lesbaren deutschen Umschrift der hebräischen Formen.
theological_decisions:
- issue: Charakter der Verwaltungsämter am Tempel
  choice: Gewöhnliche administrative Begriffe verwenden, ohne eine weitergehende sakrale Rangordnung einzutragen.
  alternative: Titel wie »Fürsten«, »Herrscher« oder spezifisch priesterliche Amtsbezeichnungen verwenden.
  rationale: Der Vers beschreibt vor allem Beauftragte und ihre Zuständigkeitsordnung. Die hebräischen Begriffe verlangen keine weitergehende Aussage über einen besonderen geistlichen oder monarchischen Rang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Namensliste und die Verwaltungskette bleiben syntaktisch klar; »Beauftragte«, »Leitung«, »Auftrag« und »Vorsteher« vermeiden altertümliche oder übermäßig hierarchische Amtsbegriffe.
