  naturalness: Modernes Standarddeutsch und ein angemessen würdevoller Erzählton sind weitgehend erreicht. „Jeder zu seinem Grundbesitz, in ihre Städte“ ist allerdings wegen des Wechsels von distributivem Singular zu pluralischem Possessiv im Deutschen holprig. „in seine jeweilige Stadt“ löst dies idiomatisch, ohne den kollektiven Plural des Hebräischen inhaltlich zu verändern.
  terminology: „Steinmale“, „Kulthöhen“, „Altäre“ und „Grundbesitz“ sind angemessen. Für אֲשֵׁרִים ist „Aschera-Kultgegenstände“ in der Hauptzeile sachgerechter als „Aschera-Kultmale“, wenn die konkrete Gestalt offenbleiben soll. Die Fußnote bietet weiterhin die geläufige Deutung „Aschera-Pfähle“ an.
