    rationale: „Umhieben“ deutet auf Pfähle oder Bäume, während „Kultmale“ die Objektform bewusst offenlässt. Eine neutrale Hauptwiedergabe bewahrt die lexikalische Unsicherheit besser; die Fußnote kann die konkrete Alternative nennen.
