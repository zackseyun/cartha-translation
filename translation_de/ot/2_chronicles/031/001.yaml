source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: de
  text: Als dies alles beendet war, zogen alle Israeliten, die anwesend waren, hinaus in die Städte Judas. Sie zertrümmerten die Steinmale, zerstörten die Aschera-Kultgegenstände[a] und rissen die Kulthöhen und die Altäre in ganz Juda und Benjamin sowie in Efraim und Manasse nieder, bis sie alles vollständig beseitigt hatten. Dann kehrten alle Söhne Israels zurück, jeder zu seinem Grundbesitz, in seine jeweilige Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aschera-Pfähle“. Das hebräische Wort kann Kultgegenstände bezeichnen, die mit Aschera verbunden waren, oft wohl hölzerne Pfähle oder Bäume.'
    reason: Lexikalische Alternative; die genaue Gestalt der bezeichneten Kultobjekte ist nicht sicher.
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Als dies alles beendet war
  rationale: Die Konstruktion mit כְּ und Infinitivus constructus bildet einen temporalen Nebensatz. Die passivische Wiedergabe vermeidet es, ein im Hebräischen nicht genanntes Subjekt einzuführen.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: alle Israeliten, die dort anwesend waren
  rationale: הַנִּמְצְאִים bezeichnet die Anwesenden. „Alle Israeliten“ gibt den kollektiven Ausdruck כָּל יִשְׂרָאֵל in natürlichem modernem Deutsch wieder; „dort“ verdeutlicht den kontextuellen Bezug, ohne einen neuen Ort einzuführen.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: Sie zertrümmerten die Steinmale
  rationale: מַצֵּבוֹת sind aufgerichtete kultische Steine oder Male. „Steinmale“ ist konkreter als „Säulen“, während „zertrümmerten“ die Kraft von שׁבר ausdrückt.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: hieben die Aschera-Kultmale[a] um
  rationale: אֲשֵׁרִים bezeichnet mit Aschera verbundene Kultobjekte, deren genaue Gestalt nicht immer sicher ist. „Kultmale“ lässt diese Unbestimmtheit bestehen; „hieben … um“ entspricht dem Verb גדע und dem wahrscheinlich hölzernen Charakter.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: בָּמוֹת sind lokale erhöhte beziehungsweise als „Höhen“ bezeichnete Kultstätten. „Kulthöhen“ ist verständlich und macht die religiöse Funktion deutlich.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: in ganz Juda und Benjamin sowie in Efraim und Manasse
  rationale: Die Wendung beschreibt den umfassenden räumlichen Bereich der Beseitigung. Das Deutsche verwendet ein gemeinsames „in“ idiomatisch, ohne die hebräische Variation der Präpositionen künstlich nachzuahmen.
- source_word: עַד לְכַלֵּה
  choice: bis sie alles vollständig beseitigt hatten
  rationale: Der Infinitiv bezeichnet die Vollendung der Aktion. „Alles“ greift die zuvor genannten Kultgegenstände und Kultstätten auf; „beseitigt“ deckt sowohl Zerstörung als auch Entfernung ab.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל
  choice: Dann kehrten alle Söhne Israels zurück
  rationale: „Söhne Israels“ bewahrt die traditionelle und formal genaue Wiedergabe des ausdrücklich maskulinen Ethnonyms בְּנֵי יִשְׂרָאֵל.
- source_word: אִישׁ לַאֲחֻזָּתוֹ
  choice: jeder zu seinem Grundbesitz
  rationale: אִישׁ wird distributiv mit „jeder“ wiedergegeben. אֲחֻזָּה bezeichnet einen festen, häufig erblichen Landbesitz; „Grundbesitz“ trifft dies genauer als das allgemeinere „Besitz“.
- source_word: לְעָרֵיהֶם
  choice: in ihre Städte
  rationale: Der Plural mit Suffix wird kollektiv wiedergegeben und schließt an die Rückkehrbewegung an.
theological_decisions:
- issue: Maskulines Ethnonym und distributive Einzelform
  choice: alle Söhne Israels … jeder zu seinem Grundbesitz
  alternative: alle Israeliten … jeder zu seinem Besitz
  rationale: Die Wiedergabe bewahrt die ausdrücklich maskulinen Formen בְּנֵי und אִישׁ, ohne daraus eine Aussage über den Ausschluss von Frauen aus der Gemeinschaft abzuleiten.
- issue: Bezeichnung der Aschera-Objekte
  choice: Aschera-Kultmale
  alternative: Aschera-Pfähle oder Ascheren
  rationale: Die genaue materielle Gestalt der אֲשֵׁרִים ist nicht in jedem Zusammenhang eindeutig. Die Hauptübersetzung vermeidet eine übermäßige Festlegung; die Fußnote nennt die geläufige konkrete Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge ist durch kurze, klare Hauptsätze gegliedert. Fachbegriffe wie „Kulthöhen“ und „Aschera-Kultmale“ bleiben verständlich und bewahren zugleich die historische und kultische Eigenart des Textes.
