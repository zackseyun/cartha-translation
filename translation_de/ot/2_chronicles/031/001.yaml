revisions:
- from: Als dies alles beendet war, zogen alle Israeliten, die dort anwesend waren, in die Städte Judas hinaus. Sie zertrümmerten die Steinmale, hieben die Aschera-Kultmale[a] um und rissen die Kulthöhen und die Altäre in ganz Juda und Benjamin sowie in Efraim und Manasse nieder, bis sie alles vollständig beseitigt hatten. Dann kehrten alle Söhne Israels zurück, jeder zu seinem Grundbesitz, in ihre Städte.
  to: Als dies alles beendet war, zogen alle Israeliten, die anwesend waren, hinaus in die Städte Judas. Sie zertrümmerten die Steinmale, zerstörten die Aschera-Kultgegenstände[a] und rissen die Kulthöhen und die Altäre in ganz Juda und Benjamin sowie in Efraim und Manasse nieder, bis sie alles vollständig beseitigt hatten. Dann kehrten alle Söhne Israels zurück, jeder zu seinem Grundbesitz, in seine jeweilige Stadt.
  rationale: Die Revision entfernt eine nicht erforderliche Ortsergänzung, bewahrt bei den Aschera-Objekten die sachliche Unbestimmtheit des Hebräischen und glättet die deutsche Rückkehrformulierung. Die Bedeutung, Reihenfolge und historische Terminologie des Ausgangstextes bleiben erhalten.
