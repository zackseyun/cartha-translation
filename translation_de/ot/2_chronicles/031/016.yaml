source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: de
  text: Außer der genealogischen Erfassung der Männer ab drei Jahren[a] erhielten alle, die in das Haus Jahwes kamen, entsprechend dem täglichen Bedarf[b] Zuteilungen für ihren Dienst in ihren Dienstschichten[c] gemäß ihren Abteilungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer ihrer genealogischen Erfassung als Männer ab drei Jahren“.'
    reason: Die hebräische Konstruktion ist nominal; die genaue Verknüpfung mit dem vorausgehenden Satz bleibt wegen der fortlaufenden Syntax offen.
  - marker: b
    text: 'Hebräisch wörtlich: „für die Angelegenheit eines Tages an seinem Tag“, das heißt: entsprechend dem, was an jedem einzelnen Tag erforderlich war.'
    reason: Die Fußnote bewahrt die konkrete hebräische Tagesformel hinter der idiomatischen Übersetzung.
  - marker: c
    text: 'Oder: „in ihren Wachen“ beziehungsweise „in ihren turnusmäßigen Diensten“.'
    reason: מִשְׁמָרוֹת kann Wachen, Dienstbereiche oder Dienstschichten bezeichnen.
lexical_decisions:
- source_word: מִלְּבַד
  choice: außer
  rationale: Gibt den abgrenzenden Sinn wieder, ohne abschließend festzulegen, ob die genannte Gruppe ausgenommen oder als zusätzliche Kategorie genannt wird.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: den männlichen Personen, die … in den Geschlechtsregistern eingetragen waren
  rationale: Das Hitpael von יחס bezeichnet die genealogische Registrierung; לִזְכָרִים benennt ausdrücklich männliche Personen.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: vom Alter von drei Jahren an
  rationale: Natürliche deutsche Wiedergabe der hebräischen Altersgrenze einschließlich der Dreijährigen.
- source_word: לְכָל הַבָּא
  choice: allen, die … kamen
  rationale: Der substantivierte Partizipialausdruck ist kollektiv und bezeichnet alle regelmäßig oder jeweils Eintretenden.
- source_word: לְבֵית יְהוָה
  choice: in das Haus Jahwes
  rationale: Bewahrt das biblische Bild vom Tempel als Haus und gibt den Gottesnamen יהוה als Jahwe wieder.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: wie es die tägliche Aufgabe erforderte
  rationale: Gibt die administrative Wendung verständlich wieder; die wörtliche Tagesformel bleibt in der Fußnote sichtbar.
- source_word: לַעֲבוֹדָתָם
  choice: um ihren Dienst … zu verrichten
  rationale: עֲבוֹדָה bezeichnet hier den Tempeldienst; die deutsche Verbfügung ist natürlich und wahrt den Zweckbezug.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: in ihren Dienstschichten
  rationale: מִשְׁמָרוֹת bezeichnet zugewiesene Wachen beziehungsweise turnusmäßige Dienste; „Dienstschichten“ macht die organisatorische Bedeutung deutlich.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: gemäß ihren Abteilungen
  rationale: Bezeichnet die geordneten priesterlichen beziehungsweise levitischen Abteilungen.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung des Tempelpersonals
  choice: männliche Personen
  alternative: Personen / Angehörige
  rationale: Das Hebräische nennt mit זְכָרִים ausdrücklich männliche Personen; eine Neutralisierung würde eine Aussage des Ausgangstextes auslassen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Verhältnis der genealogisch Registrierten zu den in das Haus Jahwes Kommenden
  choice: Die syntaktische Spannung wird durch Gedankenstrich und Dativanschluss bewahrt
  alternative: „zusätzlich zu“ oder eine eindeutige Gleichsetzung beider Gruppen
  rationale: מִלְּבַד und der anschließende Dativ lassen im fortlaufenden Satz unterschiedliche Abgrenzungen zu; der deutsche Text soll diese nicht dogmatisch oder administrativ überbestimmen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers setzt syntaktisch den vorausgehenden Zusammenhang fort; deshalb bleibt der deutsche Text als anschließendes Satzglied formuliert. Verwaltungsbegriffe wie „Geschlechtsregister“, „Dienstschichten“ und „Abteilungen“ bilden die organisatorische Sprache des Tempeldienstes ab, ohne kirchliche Fachsprache späterer Zeiten einzutragen.
