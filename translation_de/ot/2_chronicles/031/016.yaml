  verdict: revise
  source_fidelity: Die nominale Form הִתְיַחְשָׂם bezeichnet die genealogische Erfassung/Registrierung, nicht unmittelbar „die Personen, die ... eingetragen waren“. Der vorliegende Entwurf verschiebt dies zudem in eine grammatisch und sachlich unklare Gegenüberstellung von „außer den ... Personen“ und „allen“. Die revidierte Fassung bewahrt den an V. 15 anschließenden Charakter des hebräischen Satzglieds, indem sie die dort vorausgesetzte Zuteilung ausdrücklich ergänzt. „Entsprechend dem täglichen Bedarf“ gibt לִדְבַר יוֹם בְּיוֹמוֹ idiomatisch wieder; die konkrete Tagesformel bleibt in der Fußnote erhalten.
  naturalness: „Männliche Personen“ und „in den Geschlechtsregistern eingetragen“ wirken in diesem Kontext unnötig bürokratisch und führen zu einer sperrigen Konstruktion. „Genealogische Erfassung der Männer“ ist modernes, verständliches Deutsch und gibt die administrative Funktion des Ausdrucks präziser wieder. Die Ergänzung eines finiten Verbs macht den deutschen Vers als selbstständigen Text lesbar, ohne den Sinn des aus dem Kontext fortgesetzten Hebräisch zu verändern.
  terminology: „Jahwe“, „Haus Jahwes“, „Dienst“, „Dienstschichten“ und „Abteilungen“ sind angemessen. „Männer“ gibt זְכָרִים geschlechtsspezifisch wieder. „Zuteilungen“ ist aufgrund des unmittelbar vorausgehenden Kontextes (V. 15) eine sachgerechte explizite Ergänzung und vermeidet eine unbestimmte oder kirchlich gefärbte Terminologie.
