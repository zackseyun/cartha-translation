    rationale: Der Gedankenstrich verbindet zwei nicht parallel gebaute Dativgruppen. Das Hebräische ist ein Anschluss an den vorherigen Vers; im selbstständig präsentierten deutschen Vers darf die dort vorausgesetzte Zuteilung knapp ergänzt werden.
