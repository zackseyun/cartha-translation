source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: de
  text: Auch die Israeliten und Judäer, die in den Städten Judas wohnten, brachten den Zehnten von Rindern und Kleinvieh[a] sowie den Zehnten von den heiligen Gaben[b], die Jahwe, ihrem Gott, geweiht waren. Sie schichteten sie Haufen um Haufen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Kleinvieh und kann sowohl Schafe als auch Ziegen umfassen.
    reason: lexical_scope
  - marker: b
    text: 'Oder: „von den geheiligten Dingen“. Gemeint sind Dinge oder Gaben, die Gott als heilig vorbehalten waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: die Israeliten und Judäer
  rationale: בני bezeichnet hier kollektiv die Angehörigen der beiden Bevölkerungsgruppen, nicht ausschließlich männliche Nachkommen. Die Wiedergabe ist knapp und im historischen Zusammenhang verständlich.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: die in den Städten Judas wohnten
  rationale: Das Partizip von ישב bezeichnet den dauerhaften Wohnsitz; עָרֵי wird sachgerecht mit „Städten“ wiedergegeben.
- source_word: גַּם הֵם
  choice: Auch
  rationale: Die vorangestellte Formulierung bringt natürlich zum Ausdruck, dass diese Bewohner sich ebenfalls beteiligten.
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: den Zehnten von Rindern und Kleinvieh
  rationale: מַעְשַׂר ist der kultische Zehnte. בָּקָר bezeichnet Rinder, während צֹאן als Sammelbegriff Schafe und Ziegen umfassen kann; „Kleinvieh“ bewahrt diese Breite.
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: sowie den Zehnten von den heiligen Gaben
  rationale: קָדָשִׁים meint hier wahrscheinlich Gott vorbehaltene oder geweihte Dinge. „Heilige Gaben“ ist verständlich, ohne die genaue Art der Gegenstände festzulegen.
- source_word: הַמְקֻדָּשִׁים
  choice: die … geweiht waren
  rationale: Das passive Partizip von קדש bezeichnet Dinge, die für Gott ausgesondert und ihm geweiht worden waren.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: Jahwe, ihrem Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; das ל wird im Deutschen idiomatisch durch die Konstruktion „jemandem geweiht“ ausgedrückt.
- source_word: הֵבִיאוּ
  choice: brachten
  rationale: Das Hifil von בוא bedeutet hier schlicht „bringen“.
- source_word: וַיִּתְּנוּ
  choice: Sie schichteten alles … auf
  rationale: נתן hat die weite Bedeutung „geben, setzen, legen“. Zusammen mit „Haufen“ bezeichnet es hier das Ablegen beziehungsweise Aufschichten der Gaben.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: zu Haufen auf, Haufen um Haufen
  rationale: Die Wiederholung des Substantivs betont die Vielzahl der Haufen. Die deutsche Wiederholung erhält diese rhetorische Wirkung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der קָדָשִׁים
  choice: heilige Gaben
  alternative: geheiligte Dinge
  rationale: Der Ausdruck bezeichnet Gott vorbehaltene Güter, lässt ihre genaue kultische Kategorie jedoch offen. „Heilige Gaben“ wahrt diese Offenheit und den Zusammenhang mit dem Bringen des Zehnten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. „Haufen um Haufen“ bewahrt die markante hebräische Wiederholung, während „Kleinvieh“ die sachliche Breite des Sammelbegriffs צֹאן erhält.
