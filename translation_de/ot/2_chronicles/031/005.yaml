  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: de
  text: Als die Sache bekannt wurde, brachten die Söhne Israels[a] reichlich Erstlingsgaben von Getreide, neuem Wein, Öl, Honig[b] und allem Ertrag des Feldes. Auch den Zehnten von allem brachten sie in großer Menge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „das Volk Israel“. Die hebräische Wendung „Söhne Israels“ ist eine übliche Bezeichnung für die Gemeinschaft Israels.'
    reason: lexical_alternative
  - marker: b
    text: „Honig“ kann hier auch einen süßen Fruchtsirup, etwa Dattelsirup, bezeichnen und muss nicht ausschließlich Bienenhonig meinen.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ
  choice: Als sich ... verbreitete
  rationale: Die Verbindung mit dem Infinitiv von פרץ ist zeitlich zu verstehen. „Sich verbreiten“ gibt das rasche Bekanntwerden idiomatisch wieder, ohne die Wendung auf einen einzigen möglichen Sinn festzulegen.
- source_word: הַ/דָּבָר
  choice: die Sache
  rationale: דבר kann hier die Anordnung, die Nachricht davon oder die ganze Angelegenheit bezeichnen. „Sache“ bewahrt diese Bedeutungsbreite.
- source_word: הִרְבּוּ
  choice: brachten ... reichlich
  rationale: Der Hifil von רבה bezeichnet hier die große Menge der beigesteuerten Erzeugnisse. Die verbale Ergänzung „brachten“ wird durch das ausdrückliche הֵבִיאוּ am Satzende gestützt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale hebräische Bezeichnung wird beibehalten; sie bezeichnet in diesem Zusammenhang das Volk Israel als Gemeinschaft.
- source_word: רֵאשִׁית
  choice: Erstlingsgaben
  rationale: Im kultischen Zusammenhang bezeichnet ראשית den zuerst genommenen und Gott geweihten Anteil der Ernte. „Erstlingsgaben“ ist im Deutschen präzise und verständlich.
- source_word: דָּגָן
  choice: Getreide
  rationale: Gemeint sind Getreideerzeugnisse allgemein; „Getreide“ ist die natürliche moderne Wiedergabe.
- source_word: תִּירוֹשׁ
  choice: junger Wein
  rationale: תירוש bezeichnet häufig frisch erzeugten Wein beziehungsweise Most. „Junger Wein“ bewahrt den landwirtschaftlichen Zusammenhang, ohne ihn eindeutig auf unvergorenen Traubensaft festzulegen.
- source_word: יִצְהָר
  choice: Öl
  rationale: Das Wort bezeichnet gewöhnlich frisches Öl, besonders Olivenöl. „Öl“ bleibt knapp und vermeidet eine unnötige Präzisierung.
- source_word: דְבַשׁ
  choice: Honig
  rationale: דבש kann Bienenhonig oder einen süßen Fruchtsirup bezeichnen. Die traditionelle allgemeine Wiedergabe steht im Haupttext; die sachliche Unsicherheit wird in einer Fußnote erläutert.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: und allem Ertrag des Feldes
  rationale: תבואה bezeichnet den landwirtschaftlichen Ertrag oder die Erzeugnisse. „Ertrag des Feldes“ gibt die agrarische Bedeutung natürlich wieder.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: Auch den Zehnten von allem
  rationale: מעשר ist der feststehende Ausdruck für den Zehnten. Das vorangestellte „Auch“ macht im Deutschen den Anschluss des weiteren Satzglieds deutlich.
- source_word: לָ/רֹב
  choice: in großer Menge
  rationale: Die Wendung betont die außergewöhnlich große Menge des abgelieferten Zehnten.
theological_decisions:
- issue: Korporative, grammatisch männliche Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die formale Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar. Eine Fußnote erklärt, dass hier die israelitische Gemeinschaft insgesamt gemeint ist, damit die Formulierung nicht irrtümlich auf männliche Einzelpersonen beschränkt wird.
- issue: Art des mit תִּירוֹשׁ bezeichneten Getränks
  choice: junger Wein
  alternative: Most / neuer Wein
  rationale: Die Übersetzung wahrt den Bezug zu einem frischen Weinerzeugnis, legt aber weder den Gärungsgrad noch eine besondere kultische Deutung fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzbau wurde für gute deutsche Lesbarkeit leicht gegliedert, während die Wiederholung des reichlichen Bringens und die Bedeutungsbreite von „die Sache“ erhalten bleiben. Kultische Begriffe wie „Erstlingsgaben“ und „Zehnter“ werden wegen ihrer Präzision verwendet.
