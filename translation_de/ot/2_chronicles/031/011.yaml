base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: de
  text: Dann ordnete Hiskia an[a], im Haus Jahwes Räume[b] herzurichten, und sie richteten sie her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann sagte Hiskia, man solle im Haus Jahwes Räume herrichten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kammern“; dem Zusammenhang nach dienten sie als Lagerräume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordnete … an
  rationale: Das Verb bedeutet wörtlich „sagte“, doch mit dem folgenden Infinitiv gibt es hier die Anweisung des Königs wieder. „Ordnete an“ drückt diese Funktion im Deutschen natürlich aus.
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: Gebräuchliche deutsche Namensform.
- source_word: לְהָכִין
  choice: herzurichten
  rationale: Der Hifil von כון bezeichnet hier das Bereitmachen der Räume. „Herrichten“ passt zum baulichen beziehungsweise praktischen Kontext und lässt den genauen Umfang offen.
- source_word: לְשָׁכוֹת
  choice: Räume
  rationale: Das Substantiv bezeichnet Nebenräume oder Kammern im Tempelkomplex. „Räume“ ist heute verständlich und legt ihre Funktion nicht vorschnell auf Lagerung fest.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom „Haus“ und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Im modernen deutschen Bibelkontext ist „Jahwe“ die geläufige wissenschaftliche Transkription des Tetragramms und bewahrt dessen Charakter als Gottesname.
- source_word: וַיָּכִינוּ
  choice: und sie richteten sie her
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen aus „Räume“ aufgenommen. Die Wiederholung entspricht dem knappen Vollzugsbericht des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst, nicht einen Titel. „Jahwe“ erhält diese Unterscheidung, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Stärke der königlichen Äußerung
  choice: ordnete an
  alternative: sagte, man solle
  rationale: Die Infinitivkonstruktion bezeichnet den Inhalt einer praktischen königlichen Anweisung. Die Übersetzung gibt ihre kommunikative Funktion wieder, während die Fußnote die wörtlichere Möglichkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Jahwes“ bewahrt die Bildsprache des Hebräischen; „Räume“ ist allgemeinverständlich und vermeidet eine übermäßige Funktionsfestlegung. Die Marker stehen unmittelbar nach der betroffenen Wendung.
