  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: de
  text: Und in jedem Werk, das er im Dienst am Haus Gottes sowie im Gesetz[a] und im Gebot begann, um seinen Gott zu suchen[b], handelte er von ganzem Herzen und hatte Erfolg[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Weisung“. Das hebräische Wort Tora kann sowohl Weisung als auch Gesetz bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Gott zu befragen“. Das hebräische Verb kann sowohl das Suchen als auch das Befragen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und es gelang ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה
  choice: Und bei jedem Werk
  rationale: מַעֲשֶׂה bezeichnet ein Werk, Tun oder Vorhaben. „Bei jedem Werk“ bewahrt die Präposition und die zusammenfassende Aussage, ohne den Begriff unnötig einzuengen.
- source_word: אֲשֶׁר הֵחֵל
  choice: das er … begann
  rationale: Die Hifil-Form von חלל bedeutet hier schlicht „beginnen“. Die direkte Wiedergabe erhält die einfache Ausdrucksweise des Hebräischen.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: im Dienst am Haus Gottes
  rationale: עֲבוֹדָה kann Arbeit oder Dienst, auch im kultischen Bereich, bezeichnen. „Dienst am Haus Gottes“ umfasst die Tempelarbeit, ohne sie ausschließlich auf priesterliche Rituale zu beschränken.
- source_word: וּבַתּוֹרָה
  choice: sowie im Gesetz
  rationale: תּוֹרָה bezeichnet Weisung beziehungsweise Gesetz. Im Zusammenhang von Hiskias Reformen ist „Gesetz“ im Haupttext sachgerecht; die weitere Bedeutung „Weisung“ bleibt in einer Fußnote sichtbar.
- source_word: וּבַמִּצְוָה
  choice: und im Gebot
  rationale: Der hebräische Singular מִצְוָה wird als Singular wiedergegeben. Er kann dabei zusammenfassende Bedeutung haben.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: um seinen Gott zu suchen
  rationale: דרשׁ mit Gott als Bezug kann „suchen“, „befragen“ oder „sich an ihn wenden“ bedeuten. „Seinen Gott suchen“ bewahrt das wiederkehrende Motiv der Chronik und lässt die beratende Nuance per Fußnote offen.
- source_word: בְּכָל לְבָבוֹ
  choice: von ganzem Herzen
  rationale: Die feste Wendung bezeichnet ungeteilte, aufrichtige Hingabe und wird im Deutschen natürlich mit „von ganzem Herzen“ wiedergegeben.
- source_word: עָשָׂה
  choice: handelte er
  rationale: עָשָׂה ist ein weit gefasstes Verb für Tun und Handeln. „Handelte er“ vermeidet ein im Hebräischen nicht ausdrücklich stehendes Objekt und ist im deutschen Satz verständlich.
- source_word: וְהִצְלִיחַ
  choice: und hatte Erfolg
  rationale: Die Hifil-Form von צלח kann intransitiv „Erfolg haben“, „gelingen“ oder „gedeihen“ bedeuten. „Hatte Erfolg“ ist klar und lässt offen, worin sich der Erfolg konkret zeigte.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Zusammenhang der Reformen
  choice: Gesetz
  alternative: Weisung
  rationale: Der Kontext verbindet Hiskias Handeln mit der verbindlichen Tora und der Ordnung des Tempeldienstes. „Gesetz“ gibt diesen Bezug wieder, während „Weisung“ als echte Bedeutungsalternative in der Fußnote erhalten bleibt.
- issue: Bedeutung von לִדְרֹשׁ לֵאלֹהָיו
  choice: seinen Gott suchen
  alternative: seinen Gott befragen
  rationale: In der Chronik bezeichnet die Wendung häufig die bewusste Hinwendung zu Gott, kann aber zugleich das Befragen Gottes einschließen. Der Haupttext wahrt das umfassendere Motiv; die Fußnote dokumentiert die engere Möglichkeit.
- issue: Zuordnung von בְּכָל לְבָבוֹ
  choice: „von ganzem Herzen“ auf sein Handeln bezogen
  alternative: auf das Suchen Gottes bezogen
  rationale: 'Der masoretische Akzent Athnach nach לֵאלֹהָיו trennt „seinen Gott zu suchen“ von der folgenden Wendung und stützt die Zuordnung zu עָשָׂה: Er handelte von ganzem Herzen. Wegen der möglichen inhaltlichen Nähe zum Suchen Gottes wird die Aussage nicht weiter dogmatisch zugespitzt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung des hebräischen Satzes bleibt erkennbar, wird aber durch „sowie“ lesbarer gestaltet. Schlüsselbegriffe wie „Haus Gottes“, „Gesetz“, „Gebot“ und „von ganzem Herzen“ werden bewusst schlicht und traditionsnah formuliert.
