source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: de
  text: Er sagte auch dem Volk, den Bewohnern Jerusalems, es solle den Priestern und Leviten den ihnen zustehenden Anteil geben, damit sie sich fest an das Gesetz Jahwes halten konnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie im Gesetz Jahwes gestärkt würden“; möglicherweise auch: „damit sie sich dem Gesetz Jahwes widmen konnten“.'
    reason: Das Verb חזק kann hier Standhaftigkeit beziehungsweise Festigkeit im Gesetz ausdrücken. Im Zusammenhang der materiellen Versorgung ist auch die Deutung möglich, dass Priester und Leviten zur ungeteilten Hingabe an das Gesetz befähigt werden.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er befahl auch
  rationale: אמר bedeutet grundsätzlich „sagen“; mit dem folgenden Infinitiv und im königlichen Reformkontext hat die Äußerung jedoch anweisenden Charakter. „Befahl“ gibt diese pragmatische Kraft knapp wieder; „auch“ markiert den Erzählfortgang des Waw-Konsekutivs.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: dem Volk, den Bewohnern Jerusalems
  rationale: Die zweite Wendung erläutert appositionell, welches Volk hier gemeint ist. Die Formulierung bleibt nahe am Hebräischen und ist im Deutschen verständlich.
- source_word: מְנָת הַכֹּהֲנִים וְהַלְוִיִּם
  choice: den Priestern und den Leviten den ihnen zustehenden Anteil
  rationale: מְנָה bezeichnet einen zugewiesenen Anteil. Die deutsche Wortstellung macht die Empfänger eindeutig; „zustehend“ bringt den Gedanken einer festgesetzten Zuteilung zum Ausdruck.
- source_word: יֶחֶזְקוּ
  choice: sie … festhalten könnten
  rationale: חזק im Qal kann „stark sein/werden“ oder „festhalten“ bezeichnen. „Festhalten“ bewahrt die aktive Bedeutungsnuance und vermeidet die stärker deutende Paraphrase „sich widmen“; die Alternative „gestärkt werden“ wird in der Fußnote genannt.
- source_word: בְּתוֹרַת יְהוָה
  choice: am Gesetz Jahwes
  rationale: תּוֹרָה bezeichnet hier die maßgebliche göttliche Weisung im kultisch-bundestheologischen Zusammenhang. „Gesetz“ ist die geläufige Entsprechung; בְּ wird passend zur Verbindung „festhalten an“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ transliteriert statt durch einen Titel ersetzt.
theological_decisions:
- issue: Sinn von חזקו בתורת יהוה
  choice: damit sie am Gesetz Jahwes festhalten könnten
  alternative: damit sie im Gesetz Jahwes gestärkt würden; damit sie sich dem Gesetz Jahwes widmen könnten
  rationale: Die hebräische Wendung lässt sowohl das Festhalten als auch ein Gestärktwerden zu. Der Haupttext wahrt mit „festhalten“ die lexikalische Nähe; die Fußnote erhält die echte Mehrdeutigkeit und weist auf die kontextuell mögliche Deutung materieller Entlastung für den Dienst hin.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt diesen Unterschied gegenüber einem göttlichen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Präzisierung „dem Volk, den Bewohnern Jerusalems“ und der Zweckzusammenhang des Hebräischen bleiben erhalten; die semantische Offenheit von חזק wird nicht stillschweigend aufgelöst.
