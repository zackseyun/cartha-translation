base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: de
  text: Hiskia tat dies in ganz Juda und tat, was gut, recht und treu[a] war vor Jahwe, seinem Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wahr“. Das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bezeichnen; hier beschreibt es wahrscheinlich treues und integres Handeln.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: So handelte
  rationale: Die Wendung fasst Hiskias zuvor geschilderte Maßnahmen zusammen. „So handelte“ gibt diesen rückverweisenden Sinn im Deutschen natürlich wieder.
- source_word: בְּכָל יְהוּדָה
  choice: in ganz Juda
  rationale: Die Präposition mit כָּל und dem Ortsnamen bezeichnet den gesamten räumlichen Wirkungsbereich.
- source_word: הַטּוֹב
  choice: was gut … war
  rationale: Das mit Artikel substantivierte Adjektiv bezeichnet das Gute beziehungsweise gutes Handeln; die deutsche Konstruktion mit „was“ gibt dies idiomatisch wieder.
- source_word: הַיָּשָׁר
  choice: recht
  rationale: יָשָׁר bezeichnet im ethischen Zusammenhang das moralisch Rechte oder Aufrichtige. „Recht“ fügt sich natürlich in die Dreierreihe ein.
- source_word: הָאֱמֶת
  choice: treu
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Im Zusammenhang einer Beschreibung des Handelns gibt „treu“ den Aspekt verlässlicher, integerer Lebensführung gut wieder, während die Fußnote die echte Bedeutungsbreite offenhält.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier Handeln in Gottes Gegenwart und unter seinem Urteil. „Vor Jahwe“ bewahrt beide Aspekte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: seinem Gott
  rationale: Das maskuline Singularsuffix bezieht sich auf Hiskia und bringt seine persönliche Beziehung zu Gott zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den Gottesnamen selbst; „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Bedeutung von הָאֱמֶת in der ethischen Dreierreihe
  choice: treu
  alternative: wahr / wahrhaftig
  rationale: Im Blick auf Hiskias Handeln liegt Verlässlichkeit oder Treue nahe. Da das Wort zugleich „Wahrheit“ beziehungsweise „wahr“ bedeuten kann, wird diese Spannung nicht dogmatisch aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei kurzen Sätze bilden den zusammenfassenden Charakter des Verses ab; die Dreierreihe „gut, recht und treu“ bleibt prägnant erhalten.
