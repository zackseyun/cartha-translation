  source_fidelity: 'Die Grundbedeutungen sind weitgehend richtig wiedergegeben: תרומה als „Abgabe“, מעשר als „Zehnten“, die geweihten Gegenstände, die verlässliche Ausführung sowie Konanja und Schimi in einer Rangordnung. „Als Leiter eingesetzt“ fügt jedoch die ausdrückliche Vorstellung einer Einsetzung hinzu, die נָגִיד hier nicht selbst aussagt. Zudem ist „Leiter über sie“ im Deutschen bei sachlichen Bezugsgrößen weniger idiomatisch als eine Verantwortlichkeitsformulierung.'
  naturalness: Der Entwurf ist insgesamt modernes Standarddeutsch. „Gewissenhaft hineinbringen“ klingt allerdings leicht unidiomatisch, und die Stellung „war als Leiter über sie eingesetzt“ ist unnötig schwerfällig. Eine knappere administrative Formulierung ist klarer.
