  to: Sie brachten die Abgabe, den Zehnten und die heiligen Dinge[a] zuverlässig hinein. Für sie war Konanja, der Levit, verantwortlich, und sein Bruder Schimi war sein Stellvertreter[b].
  rationale: Die Revision entfernt die nicht ausgedrückte Einsetzungsnuance, formuliert die administrative Aufsicht idiomatischer und bewahrt bei „heilige Dinge“ den offenen Umfang des hebräischen Ausdrucks. Die Rangbeziehung Schimis bleibt mit „Stellvertreter“ klar und quellentreu wiedergegeben.
