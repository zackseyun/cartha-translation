base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: de
  text: Sie brachten die Abgabe, den Zehnten und die heiligen Dinge[a] zuverlässig hinein. Für sie war Konanja, der Levit, verantwortlich, und sein Bruder Schimi war sein Stellvertreter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die geweihten Gaben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: stand an zweiter Stelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: sie brachten … hinein
  rationale: Der Hifil von בוא bedeutet „bringen/hineinbringen“. Im Zusammenhang der Vorratsräume gibt „hineinbringen“ die Ablieferung natürlich wieder, ohne das Ziel ausdrücklich in den Text einzutragen.
- source_word: הַתְּרוּמָה
  choice: die Abgabe
  rationale: תְּרוּמָה bezeichnet eine für den heiligen Zweck ausgesonderte Abgabe. „Abgabe“ ist im Deutschen verständlich und vermeidet den hier unnötig technischen Ausdruck „Hebopfer“.
- source_word: הַמַּעֲשֵׂר
  choice: den Zehnten
  rationale: מַעֲשֵׂר ist der übliche Ausdruck für den Gott zustehenden zehnten Teil; „der Zehnte“ ist die etablierte präzise deutsche Wiedergabe.
- source_word: הַקֳּדָשִׁים
  choice: die geheiligten Gaben
  rationale: Der Plural von קֹדֶשׁ bezeichnet hier für den heiligen Gebrauch ausgesonderte Dinge. „Geheiligte Gaben“ ist natürlich und kontextgerecht; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: בֶּאֱמוּנָה
  choice: gewissenhaft
  rationale: אֱמוּנָה bezeichnet in einem Verwaltungskontext Treue, Zuverlässigkeit und Vertrauenswürdigkeit. „Gewissenhaft“ beschreibt die verlässliche Art, in der die Güter eingebracht beziehungsweise verwaltet wurden.
- source_word: וַעֲלֵיהֶם
  choice: über sie
  rationale: על mit Pronominalsuffix bezeichnet hier Aufsicht oder Zuständigkeit. Das Pronomen kann sich auf die zuvor genannten Gaben beziehungsweise deren Verwaltung beziehen; diese Offenheit bleibt erhalten.
- source_word: נָגִיד
  choice: als Leiter eingesetzt
  rationale: נָגִיד bezeichnet einen Beauftragten oder führenden Amtsträger. „Leiter“ vermittelt im Tempelverwaltungskontext die Aufsichtsfunktion, ohne königliche Herrschaft anzudeuten.
- source_word: כונניהו
  choice: Konanja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition als „Konanja“ wiedergegeben.
- source_word: הַלֵּוִי
  choice: der Levit
  rationale: Der hebräische Artikel ist vorhanden und kennzeichnet Konanja durch seine bekannte levitische Zugehörigkeit.
- source_word: אָחִיהוּ
  choice: sein Bruder
  rationale: אָח bezeichnet ohne gegenteiligen Kontexthinweis gewöhnlich einen leiblichen Bruder; eine Abschwächung zu „Verwandter“ ist nicht erforderlich.
- source_word: מִשְׁנֶה
  choice: Stellvertreter
  rationale: מִשְׁנֶה bezeichnet einen Amtsträger zweiten Ranges beziehungsweise einen Stellvertreter. „Stellvertreter“ ist in modernem Deutsch klarer als das isolierte „der Zweite“.
