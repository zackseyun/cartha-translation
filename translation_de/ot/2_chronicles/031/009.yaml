  text: Da fragte Hiskia die Priester und die Leviten nach den Haufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ
  choice: Da fragte
  rationale: דרשׁ bedeutet hier im Zusammenhang mit עַל, dass Hiskia sich bei den Priestern und Leviten nach den aufgehäuften Gaben erkundigte. „Fragte“ gibt dies natürlich und ohne unnötige Zuspitzung wieder.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Die mit עַל markierten Personen sind diejenigen, an die Hiskia seine Frage richtet; im natürlichen Deutschen verlangt „fragen“ hier den Akkusativ.
- source_word: עַל הָעֲרֵמוֹת
  choice: nach den Haufen
  rationale: עֲרֵמוֹת bezeichnet die zuvor erwähnten Haufen der Gaben. „Nach“ entspricht der deutschen Konstruktion „jemanden nach etwas fragen“, während „Haufen“ das konkrete Bild des Ausgangstextes bewahrt.
