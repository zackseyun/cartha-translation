  to: 'Der Anteil des Königs aus seinem eigenen Besitz war für die Brandopfer bestimmt: die Brandopfer am Morgen und am Abend sowie die Brandopfer an den Sabbaten, Neumonden[a] und Festzeiten[b], wie es in der Weisung Jahwes[c] geschrieben steht.'
  rationale: 'Die Revision glättet ausschließlich deutsche Stil- und Terminologiefragen: Sie verwendet die kultisch präzisere Bezeichnung „Neumonde“, vermeidet die Tautologie „festgesetzten Festzeiten“ und formt die Aufzählung nach dem Doppelpunkt idiomatischer. Umfang, Wiederholung der Brandopfer und die schriftgemäße Begründung des hebräischen Textes bleiben erhalten.'
