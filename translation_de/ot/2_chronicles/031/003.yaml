  - severity: low
    issue: Die Wiederholung von „für“ nach dem Doppelpunkt ist im Deutschen unnötig holprig.
    rationale: Der Doppelpunkt leitet bereits die Spezifizierung der Brandopfer ein. Eine nominale Aufzählung bewahrt die epexegetische Beziehung ohne Bedeutungsverlust.
