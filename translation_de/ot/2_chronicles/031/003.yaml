source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: de
  text: 'Der Anteil des Königs aus seinem eigenen Besitz war für die Brandopfer bestimmt: die Brandopfer am Morgen und am Abend sowie die Brandopfer an den Sabbaten, Neumonden[a] und Festzeiten[b], wie es in der Weisung Jahwes[c] geschrieben steht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „Neumonden“ sind die monatlichen Feiern zu Beginn eines neuen Monats im israelitischen Gottesdienstkalender gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „festgesetzten Zeiten“ beziehungsweise „Festen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im Gesetz Jahwes“ beziehungsweise „in der Tora Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: Der Anteil des Königs
  rationale: מְנָה bezeichnet einen zugewiesenen Anteil. „Anteil“ ist im Deutschen natürlich und lässt offen, ob eine Zuteilung oder ein festgelegter Beitrag gemeint ist.
- source_word: מִן רְכוּשׁוֹ
  choice: aus seinem eigenen Besitz
  rationale: רְכוּשׁ umfasst Besitz, Eigentum oder Vermögen. „Eigenen“ verdeutlicht idiomatisch, dass der König persönlich dafür aufkam.
- source_word: לָעֹלוֹת
  choice: für die Brandopfer bestimmt
  rationale: עֹלָה ist das vollständig verbrannte Opfer. „Bestimmt“ macht die Zweckangabe des ל im deutschen Satz klar, ohne zusätzliche inhaltliche Festlegung.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: für die Brandopfer am Morgen und am Abend
  rationale: Die Wiedergabe bewahrt die ausdrückliche Wiederholung von „Brandopfer“ und gibt die beiden regelmäßigen Tageszeiten verständlich wieder.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: sowie für die Brandopfer an den Sabbaten, Neumondtagen und festgesetzten Festzeiten
  rationale: שַׁבָּתוֹת bezeichnet die Sabbate; חֳדָשִׁים meint im kultischen Kalender die Neumondtage; מוֹעֲדִים sind festgesetzte Zeiten und hier kalendarische Feste. „Festzeiten“ bewahrt die Verbindung von festgesetztem Termin und Festcharakter.
- source_word: כַּכָּתוּב
  choice: wie es ... geschrieben steht
  rationale: Die geläufige Schriftformel gibt die Übereinstimmung mit der schriftlichen Vorschrift natürlich wieder.
- source_word: בְּתוֹרַת יְהוָה
  choice: in der Weisung Jahwes
  rationale: תּוֹרָה bedeutet Weisung oder Gesetz; „Weisung“ bewahrt die lexikalische Breite. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen Standarddeutsch direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz / Tora
  rationale: „Weisung“ wahrt den weiteren hebräischen Bedeutungsumfang, während der Kontext zugleich klar auf schriftlich festgelegte Opferbestimmungen verweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die epexegetische Wiederholung der Brandopfer bleibt erkennbar, wird aber durch Doppelpunkt und „sowie“ flüssig gegliedert. Kultische Fachbegriffe werden beibehalten und bei Bedarf knapp erläutert.
