  text: וַ/יָּבֹ֨אוּ֙ יְחִזְקִיָּ֣הוּ וְ/הַ/שָּׂרִ֔ים וַ/יִּרְא֖וּ אֶת הָ/עֲרֵמ֑וֹת וַֽ/יְבָרֲכוּ֙ אֶת יְהוָ֔ה וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: de
  text: Als Hiskia und die Amtsträger kamen und die Haufen[a] sahen, priesen sie Jahwe und segneten sein[b] Volk Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die aufgeschichteten Mengen“. Gemeint sind hier vermutlich die angesammelten Erzeugnisse oder Abgaben.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise bezieht sich „sein“ auf Hiskia; dann wäre zu verstehen: „sein Volk, Israel“. Wahrscheinlicher ist der Bezug auf Jahwe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Das Verb בוא bezeichnet hier im fortlaufenden Erzählstil ihr Kommen beziehungsweise Eintreffen; „kamen“ ist knapp und natürlich.
- source_word: יְחִזְקִיָּהוּ
  choice: Hiskia
  rationale: Der Personenname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וְהַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet hochgestellte Verantwortungs- oder Amtsträger. „Die führenden Männer“ ist modern verständlich und passt zum politischen und administrativen Zusammenhang.
- source_word: וַיִּרְאוּ
  choice: sahen
  rationale: ראה bezeichnet hier unmittelbar das Wahrnehmen mit den Augen; „sahen“ gibt dies schlicht wieder.
- source_word: הָעֲרֵמוֹת
  choice: die Haufen
  rationale: Das Substantiv bezeichnet aufgeschichtete oder angesammelte Mengen, im Kontext offenbar eingebrachte Erzeugnisse beziehungsweise Abgaben. „Haufen“ bewahrt das konkrete Bild.
- source_word: וַיְבָרֲכוּ
  choice: priesen sie … und segneten
  rationale: ברך regiert im Hebräischen sowohl Jahwe als auch Israel. Bei Gott bedeutet es hier „preisen“, bei Menschen „segnen“ beziehungsweise ihnen Segen zusprechen. Die zweigliedrige deutsche Wiedergabe macht beide kontextbedingten Bedeutungen natürlich verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: sein Volk Israel
  rationale: Das Suffix „sein“ bezieht sich am naheliegendsten auf Jahwe und bezeichnet Israel als sein Volk. Die grammatisch mögliche Beziehung auf Hiskia wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezugswort des Possessivsuffixes in עַמּוֹ („sein Volk“)
  choice: 'Das Suffix wird auf Jahwe bezogen: „sein Volk Israel“.'
  alternative: 'Das Suffix kann grammatisch auf Hiskia bezogen werden: „sein Volk, Israel“.'
  rationale: Jahwe ist der nächstliegende Bezugspunkt, und die Bezeichnung Israels als sein Volk entspricht dem üblichen biblischen Sprachgebrauch. Da der hebräische Satz den Bezug jedoch nicht ausdrücklich festlegt, bleibt die andere Möglichkeit in der Fußnote erhalten.
- issue: Bedeutung von ברך bei zwei unterschiedlichen Objekten
  choice: Bei Jahwe „preisen“, bei Israel „segnen“.
  alternative: 'Das eine hebräische Verb könnte formal einheitlich mit „segnen“ wiedergegeben werden: „sie segneten Jahwe und sein Volk Israel“.'
  rationale: Im Hebräischen kann ברך mit Gott als Objekt das lobende Preisen und mit Menschen als Objekt das Zusprechen von Segen bezeichnen. Eine mechanisch einheitliche Wiedergabe wäre im heutigen Deutsch bei „Jahwe segnen“ missverständlich; die geteilte Form wahrt den Sinn beider Verwendungen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Satzbau bleibt nahe an der hebräischen Abfolge, während die kontextabhängigen Bedeutungen von ברך im Deutschen ausdrücklich unterschieden werden.
