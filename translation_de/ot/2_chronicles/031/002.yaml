  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: de
  text: 'Und Hiskia setzte die Abteilungen der Priester und der Leviten nach ihren Abteilungen ein[a], jeden entsprechend seinem Dienst: die Priester und die Leviten für Brandopfer und Friedensopfer[b], um Dienst zu tun, zu danken und zu loben an den Toren der Lager Jahwes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienstgruppen«. Gemeint sind die geordneten Gruppen der Priester und Leviten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gemeinschaftsopfer«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »der Lager Jahwes«; manche verstehen die ungewöhnliche Wendung sinngemäß als »der Vorhöfe Jahwes«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die offizielle Einsetzung beziehungsweise Zuweisung zu geordneten Aufgaben, nicht nur ein körperliches Hinstellen.
- source_word: מַחְלְקוֹת … עַל מַחְלְקוֹתָם
  choice: Abteilungen … nach ihrer jeweiligen Einteilung
  rationale: מַחְלְקוֹת bezeichnet die organisierten Dienstgruppen der Priester und Leviten. Die Variation zwischen „Abteilungen“ und „Einteilung“ bewahrt die Wiederholung des hebräischen Wortstamms, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: jeden entsprechend seinem Dienst
  rationale: Die distributive maskuline Einzahl wird bewahrt; im historischen Zusammenhang sind die priesterlichen und levitischen Amtsträger gemeint.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: die Priester wie die Leviten
  rationale: Die Wendung greift beide zuvor genannten Gruppen erläuternd wieder auf. „Wie“ gibt die Einbeziehung beider Gruppen idiomatisch wieder.
- source_word: לְעֹלָה וְלִשְׁלָמִים
  choice: für die Brandopfer und die Friedensopfer
  rationale: Die Singularform עֹלָה bezeichnet hier kollektiv die Opferart. „Friedensopfer“ ist eine direkte, etablierte Wiedergabe der Opferkategorie שְׁלָמִים.
- source_word: לְשָׁרֵת וּלְהוֹדוֹת וּלְהַלֵּל
  choice: zum Dienst, zum Danken und zum Loben
  rationale: Die parallele substantivierte Infinitivkonstruktion bildet die drei gleichgeordneten kultischen Tätigkeiten knapp und würdig ab.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: an den Toren der Lager Jahwes
  rationale: Die Pluralformen „Tore“ und „Lager“ werden entsprechend dem Hebräischen bewahrt. „An den Toren“ ist im Deutschen räumlich natürlich; die ungewöhnliche Lager-Metaphorik wird nicht zu „Vorhöfen“ geglättet.
theological_decisions:
- issue: Distributive maskuline Einzahl אִישׁ im priesterlich-levitischen Zusammenhang
  choice: jeden entsprechend seinem Dienst
  alternative: jeden entsprechend der ihm zugewiesenen Aufgabe
  rationale: Die grammatische Einzahl und der historische Bezug auf männliche Amtsträger bleiben sichtbar, ohne das zusätzliche Wort „Mann“ stilistisch zu erzwingen.
- issue: Wiedergabe von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer
  rationale: „Friedensopfer“ bleibt näher an der traditionellen und lexikalischen Bezeichnung der Opferart; „Gemeinschaftsopfer“ würde deren mögliche Funktion stärker auslegen.
- issue: Ungewöhnliche Wendung מַחֲנוֹת יְהוָה
  choice: Lager Jahwes
  alternative: Vorhöfe Jahwes
  rationale: Der eindeutige Plural und das Bild der „Lager“ werden erhalten. Die kontextuell naheliegende Deutung als Tempelvorhöfe wird nur in der Fußnote genannt, nicht in den Haupttext eingetragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt wegen der administrativ-kultischen Aufzählung relativ formal, wird aber durch idiomatische Wortwahl lesbar gehalten. Die im Hebräischen ungewöhnliche Formulierung „Lager Jahwes“ und der Plural werden bewusst bewahrt.
