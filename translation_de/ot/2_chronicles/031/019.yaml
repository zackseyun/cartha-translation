  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Informationsstruktur, wird jedoch durch die Stellung von „gab es“ und die distributive Wendung „Stadt für Stadt“ idiomatisch lesbar gehalten. Genealogische und verwaltungssprachliche Nuancen bleiben sichtbar.
