  text: וְ/לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֜ים בִּ/שְׂדֵ֨י מִגְרַ֤שׁ עָרֵי/הֶם֙ בְּ/כָל עִ֣יר וָ/עִ֔יר אֲנָשִׁ֕ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לָ/תֵ֣ת מָנ֗וֹת לְ/כָל זָכָר֙ בַּ/כֹּ֣הֲנִ֔ים וּ/לְ/כָל הִתְיַחֵ֖שׂ בַּ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: de
  text: Und für die Söhne Aarons[a], die Priester, gab es auf den Weideflächen bei ihren Städten[b], in jeder einzelnen Stadt[c], Männer, die namentlich bezeichnet waren[d], um jedem männlichen Angehörigen der Priester und jedem, der unter den Leviten in das Geschlechtsregister eingetragen war[e], Anteile zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachkommen Aarons“. Das Hebräische sagt wörtlich „Söhne Aarons“, eine genealogische Bezeichnung, die auch spätere Nachkommen einschließen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „auf dem Gemeindeland“ oder „auf den Freiflächen bei ihren Städten“. Gemeint ist das offene Land im Umkreis der Städte, das häufig als Weideland genutzt wurde.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „in jeder Stadt und Stadt“; eine hebräische Ausdrucksweise mit der Bedeutung „in jeder einzelnen Stadt“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „namentlich aufgeführt“ oder „namentlich eingesetzt“. Das Hebräische bezeichnet Männer, die in offizieller Weise ausdrücklich mit Namen identifiziert waren.'
    reason: lexical_alternative
  - marker: e
    text: 'Das heißt: jeder, der unter den Leviten in genealogische Verzeichnisse eingetragen war.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: für die Söhne Aarons, die Priester
  rationale: „Söhne Aarons“ bewahrt die genealogische Ausdrucksweise des Hebräischen; die Apposition „die Priester“ bleibt erhalten. Gemeint sein können auch spätere Nachkommen.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: auf den Weideflächen ihrer Städte
  rationale: מִגְרָשׁ bezeichnet das offene Umland beziehungsweise Gemeindeland bei den Städten, das häufig als Weideland diente. „Weideflächen“ gibt diesen konkreten Gebrauch natürlich wieder.
- source_word: בְּכָל עִיר וָעִיר
  choice: Stadt für Stadt
  rationale: Die distributive Wiederholung „Stadt und Stadt“ wird als natürliche deutsche Wendung wiedergegeben und betont, dass jede einzelne Stadt einbezogen war.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: Männer, die namentlich bestimmt waren
  rationale: Die Formulierung bezeichnet Männer, die in offizieller Weise ausdrücklich mit Namen bezeichnet beziehungsweise eingesetzt waren, ohne eindeutig nur eine Ernennung oder nur eine Auflistung zu meinen.
- source_word: לָתֵת מָנוֹת
  choice: Anteile zu geben
  rationale: מָנוֹת sind zugeteilte Portionen oder Anteile an den bereitgestellten Gaben. „Anteile“ passt zum Verteilungskontext des Kapitels.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: jedem männlichen Angehörigen der Priester
  rationale: זָכָר bezeichnet ausdrücklich eine männliche Person; die deutsche Formulierung wahrt dies und gibt die partitive Zugehörigkeit idiomatisch wieder.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: jedem, der unter den Leviten in das Geschlechtsregister eingetragen war
  rationale: Das Hitpael von יחס bezeichnet die genealogische Registrierung. Die Formulierung macht den verwaltungsmäßigen und genealogischen Sinn für heutige Leser deutlich.
theological_decisions: []
