base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: de
  text: Die Priester wurden nach ihren Vaterhäusern[a] in die Geschlechtsregister eingetragen, ebenso die Leviten im Alter von zwanzig Jahren an, nach ihren Dienstaufgaben und ihren Abteilungen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vaterhäuser“; gemeint sind Abstammungsverbände beziehungsweise Großfamilien, die der amtlichen Eintragung und Diensteinteilung dienten.'
    reason: cultural_note
  - marker: b
    text: 'Der hebräische Satz ist stark verkürzt. Möglich ist auch: „und die genealogisch eingetragenen Leviten im Alter von zwanzig Jahren an, nach ihren Dienstaufgaben und ihren Abteilungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: in die Geschlechtsregister eingetragen
  rationale: Das Verb bezeichnet die genealogische Erfassung beziehungsweise Eintragung nach Abstammung. Die verbale Wiedergabe macht den stark verkürzten hebräischen Satz im Deutschen verständlich.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: nach ihren Stammhäusern
  rationale: Gemeint sind väterlich bestimmte Großfamilien beziehungsweise Abstammungsverbände, die der amtlichen Erfassung und Diensteinteilung dienten. „Stammhäuser“ ist würdig und im Kontext verständlich.
- source_word: וְהַלְוִיִּם מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: ebenso die Leviten im Alter von zwanzig Jahren an
  rationale: Die Ellipse führt die genealogische Eintragung aus dem ersten Satzteil fort; „ebenso“ verdeutlicht diese Parallele. Die Altersformel wird idiomatisch und genau wiedergegeben.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: nach ihren Dienstaufgaben
  rationale: מִשְׁמֶרֶת kann Wache, Auftrag oder zugewiesenen Dienst bezeichnen. Hier passt der umfassendere administrative Sinn „Dienstaufgaben“.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: und ihren Abteilungen
  rationale: Das Wort bezeichnet die organisierten Dienstgruppen oder Abteilungen. Da beide Schlussglieder mit derselben hebräischen Präposition stehen, werden sie im Deutschen gleichgeordnet.
