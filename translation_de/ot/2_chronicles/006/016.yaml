revisions:
- from: 'Und nun, HERR, Gott Israels, halte deinem Diener David, meinem Vater, was du ihm zugesagt hast: »Es soll dir vor meinem Angesicht nie an einem Mann fehlen, der auf dem Thron Israels sitzt – wenn nur deine Söhne auf ihren Weg achten und nach meinem Gesetz leben, so wie du vor meinem Angesicht gelebt hast.«'
  to: 'Und nun, HERR, Gott Israels, erfülle deinem Diener David, meinem Vater, die Zusage, die du ihm gegeben hast: »Nie soll dir ein Mann fehlen, der vor mir auf dem Thron Israels sitzt, wenn nur deine Söhne auf ihren Weg achten, indem sie nach meinem Gesetz leben, so wie du vor mir gelebt hast.«'
  rationale: Die Revision ordnet „vor mir“ dem auf dem Thron sitzenden Mann zu und ersetzt die im Deutschen unübliche Konstruktion „halte ... was“ durch eine natürliche Bitte um Erfüllung der göttlichen Zusage. Die Bedingung des hebräischen רַק אִם und die Weg-/Gesetzesmetaphorik bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:06:26Z'
review_pass:
  verdict: revise
  source_fidelity: Die dynastische Zusage und ihre ausdrücklich bedingte Einschränkung sind im Entwurf grundsätzlich zutreffend wiedergegeben. Jedoch steht לְפָנַי im Hebräischen bei dem Mann, der auf Israels Thron sitzt („vor mir“), nicht bei der Wendung „an einem Mann fehlen“. Außerdem ist שְׁמֹר ... אֵת אֲשֶׁר דִּבַּרְתָּ am natürlichsten als Bitte um Erfüllung bzw. Bewahrung der an David ergangenen Zusage wiederzugeben.
  naturalness: „Halte deinem Diener David ... was du ihm zugesagt hast“ ist im modernen Standarddeutsch nicht idiomatisch. Eine Formulierung mit „erfülle ... die Zusage“ ist klar, würdig und natürlich.
  terminology: „HERR“, „Gott Israels“, „Diener“, „Gesetz“ und „vor mir“ sind angemessene, traditionsbewusste Wiedergaben. Die idiomatische Formel „nie ein Mann fehlen“ gibt לֹא יִכָּרֵת לְךָ אִישׁ verständlich wieder, ohne die dynastische Aussage übermäßig auszudeuten.
  issues:
