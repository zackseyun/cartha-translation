  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: de
  text: 'Und nun, HERR, Gott Israels, erfülle deinem Diener David, meinem Vater, die Zusage, die du ihm gegeben hast: »Nie soll dir ein Mann fehlen, der vor mir auf dem Thron Israels sitzt, wenn nur deine Söhne auf ihren Weg achten, indem sie nach meinem Gesetz leben, so wie du vor mir gelebt hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר
  choice: halte
  rationale: Bewahrt die Verbindung zum deutschen Ausdruck „jemandem sein Wort halten“ und gibt den Imperativ im Kontext einer göttlichen Zusage natürlich wieder.
- source_word: דִּבַּרְתָּ
  choice: zugesagt hast
  rationale: Das allgemeine „reden“ bezeichnet hier inhaltlich eine feierliche Verheißung; „zugesagt“ macht diese Funktion im Deutschen klar.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Es soll dir nie an einem Mann fehlen
  rationale: Gibt die hebräische dynastische Formel idiomatisch wieder, ohne ihren Sinn auf eine bestimmte Nachfolgetheorie einzuengen.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: auf ihren Weg achten
  rationale: Bewahrt das Bild des Weges und den Sinn sorgfältiger Lebensführung.
- source_word: בְּתוֹרָתִי
  choice: nach meinem Gesetz
  rationale: „Gesetz“ ist in diesem königlichen Gehorsamskontext eine klare und etablierte Wiedergabe von תּוֹרָה.
- source_word: לְפָנַי
  choice: vor meinem Angesicht
  rationale: Erhält die personale und bundestheologische Bildsprache des Hebräischen an beiden Stellen.
theological_decisions:
- issue: Bedingtheit der davidischen Thronfolge
  choice: „wenn nur deine Söhne auf ihren Weg achten“
  alternative: Die Zusage ohne ausdrückliche Bedingung formulieren
  rationale: רַק אִם führt ausdrücklich eine Bedingung ein; die Spannung zwischen göttlicher Zusage und menschlichem Gehorsam bleibt erhalten.
- issue: Dynastische Aussage „nicht abgeschnitten werden“
  choice: „Es soll dir nie an einem Mann fehlen“
  alternative: „Ein Mann soll dir nicht abgeschnitten werden“
  rationale: Die gewählte deutsche Formel vermittelt den dynastischen Sinn verständlich, ohne eine weitergehende christologische oder konfessionelle Deutung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname wird entsprechend der deutschen Bibeltradition mit „HERR“ wiedergegeben. Die direkte Rede bleibt feierlich, aber für heutige Leser verständlich; das wiederholte „vor meinem Angesicht“ bewahrt die Bildsprache des Ausgangstextes.
