  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: de
  text: Wenn dein Volk gegen seine Feinde in den Krieg zieht, auf dem Weg, auf den du sie schickst, und sie zu dir beten in Richtung dieser Stadt[a], die du erwählt hast, und des Hauses, das ich für deinen Namen gebaut habe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Richtung des Weges dieser Stadt“; gemeint ist die Gebetsausrichtung auf Jerusalem und das Haus.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist der von Salomo für den Namen des HERRN erbaute Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier innerhalb von Salomos Gebet einen möglichen Fall ein. „Wenn“ gibt diese konditionale Funktion natürlich wieder.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: dein Volk … in den Krieg zieht
  rationale: Die Wendung bezeichnet das Ausziehen zum Krieg. „In den Krieg ziehen“ ist im Deutschen idiomatisch und bewahrt den militärischen Sinn.
- source_word: עַל אֹיְבָיו
  choice: gegen seine Feinde
  rationale: Das singularische Suffix stimmt mit dem Kollektivum „Volk“ überein; daher ist im Deutschen „seine Feinde“ sowohl formal als auch natürlich.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: auf dem Weg, auf den du sie sendest
  rationale: דֶּרֶךְ bezeichnet den Weg oder die Route; die Formulierung erhält zugleich den Gedanken, dass Gott das Volk aussendet.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: und sie zu dir beten
  rationale: Die Präposition אֶל kennzeichnet die Ausrichtung des Gebets auf den Angeredeten. „Zu dir beten“ ist die übliche deutsche Wendung.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: dieser Stadt zugewandt
  rationale: דֶּרֶךְ bezeichnet hier die räumliche Gebetsrichtung. Die gewählte Formulierung ist natürlich und erhält die konkrete Ausrichtung auf Jerusalem.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: die du erwählt hast
  rationale: Die feminine Form bezieht sich auf die Stadt; „erwählt“ wahrt den im Kontext wichtigen Gedanken der göttlichen Wahl.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: und dem Haus, das ich für deinen Namen gebaut habe
  rationale: „Haus“ bildet בַּיִת transparent ab, während „für deinen Namen“ die Tempelwidmung wiedergibt, ohne die Namensvorstellung näher auszudeuten.
theological_decisions:
- issue: Gebetsrichtung auf Jerusalem und den Tempel
  choice: Die konkrete räumliche Ausrichtung auf die erwählte Stadt und das Haus bleibt erhalten.
  alternative: Die Aussage abstrakt als Gebet mit Bezug auf Jerusalem oder den Tempel wiederzugeben.
  rationale: Der hebräische Text verwendet ausdrücklich Richtungssprache. Sie gehört zur historischen und theologischen Gestalt von Salomos Tempelgebet und sollte weder vergeistigt noch durch spätere Lehrvorstellungen ergänzt werden.
- issue: „Haus“ und Gottes Name
  choice: Das Heiligtum wird textnah „Haus“ genannt und als für Gottes Namen gebaut beschrieben.
  alternative: „Tempel“ zu schreiben oder die Wendung als unmittelbaren Wohnort Gottes auszudeuten.
  rationale: „Haus“ bewahrt die Ausdrucksweise des Hebräischen; die Formulierung „für deinen Namen“ lässt die im Text vorhandene theologische Spannung unangetastet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Konditionalsatz bleibt wie im hebräischen Text offen, da die Bitte erst im folgenden Vers fortgesetzt wird. Das kollektive „Volk“ wird zunächst singularisch aufgenommen („seine Feinde“), während das hebräische pluralische Verb und Objekt anschließend mit „sie“ wiedergegeben werden.
