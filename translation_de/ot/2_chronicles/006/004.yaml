  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: de
  text: 'Und er sagte: »Gepriesen sei Jahwe, der Gott Israels, der durch seinen Mund zu David, meinem Vater, geredet und es durch seine Hand erfüllt hat, indem er sagte:[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… der mit seinem Mund zu David, meinem Vater, gesprochen und es mit seiner Hand erfüllt hat, indem er sagte«. Das Hebräische bewahrt eine bewusste Parallele zwischen Gottes Reden und Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Der narrative Wayyiqtol führt Salomos Rede ein; die Wendung bewahrt den hebräischen Erzählfluss.
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die gehobene, aber verständliche Segens- und Lobformel gibt den partizipialen Ausruf natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Jahwe in seiner Beziehung zu Israel.
- source_word: דִּבֶּר בְּפִיו
  choice: mit seinem Mund ... gesprochen
  rationale: Die ausdrückliche anthropomorphe Formulierung bleibt erhalten und bildet die beabsichtigte Parallele zu Gottes Handeln mit seiner Hand.
- source_word: אֵת דָּוִיד אָבִי
  choice: zu meinem Vater David
  rationale: Im Zusammenhang bezeichnet אֵת bei דִּבֶּר den Adressaten der göttlichen Zusage.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: und es mit seiner Hand erfüllt hat
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen mit »es« ergänzt; »erfüllt« passt zur Erfüllung einer göttlichen Zusage und wahrt die Mund-Hand-Parallele.
- source_word: לֵאמֹר
  choice: als er sagte
  rationale: Die quotative Infinitivform leitet den im folgenden Vers wiedergegebenen Inhalt der göttlichen Rede ein; die deutsche Fassung bindet sie idiomatisch an das vorherige Sprechen an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Rede von Gottes Mund und Hand
  choice: mit seinem Mund ... mit seiner Hand
  alternative: gesprochen ... selbst erfüllt
  rationale: Die konkrete Bildsprache und der theologisch bedeutsame Gegensatz zwischen Gottes Wort und seiner ausführenden Tat werden nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gepriesen sei« entspricht der feierlichen Segensformel; »Mund« und »Hand« bleiben trotz ihrer anthropomorphen Wirkung erhalten. Der Doppelpunkt steht vor dem durch לֵאמֹר angekündigten Zitat, das in Vers 5 folgt.
