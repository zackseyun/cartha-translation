  terminology: „Jahwe“, „der Gott Israels“, „Mund“ und „Hand“ sind sachgerecht. Die anthropomorphe Bildsprache wird bewahrt. „Durch seinen Mund / durch seine Hand“ ist im Deutschen eine natürliche instrumentale Wiedergabe und erhält die bewusste Parallelität.
