- from: 'Und er sagte: »Gepriesen sei Jahwe, der Gott Israels, der mit seinem Mund zu meinem Vater David gesprochen und es mit seiner Hand erfüllt hat, als er sagte:[a]«'
  to: 'Und er sagte: »Gepriesen sei Jahwe, der Gott Israels, der durch seinen Mund zu David, meinem Vater, geredet und es durch seine Hand erfüllt hat, indem er sagte:[a]«'
  rationale: Die Änderung von „als er sagte“ zu „indem er sagte“ verdeutlicht die einleitende Funktion von לֵאמֹר für den folgenden Wortlaut. Die Instrumentalpräposition „durch“ ist im modernen Standarddeutsch idiomatisch und bewahrt die im Hebräischen durch dieselbe Präposition markierte Mund-Hand-Parallele. Die Fußnote wurde so gefasst, dass sie eine echte Übersetzungsalternative bietet und keine unzutreffende Wörtlichkeitsbehauptung macht.
