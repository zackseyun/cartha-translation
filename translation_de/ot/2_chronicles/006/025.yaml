source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: de
  text: dann höre du vom Himmel her[a], vergib die Sünde deines Volkes Israel und bring sie zurück in das Land, das du ihnen und ihren Vätern[b] gegeben hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dann wirst du vom Himmel her hören“. Die hebräische Verbform kann hier als Bitte oder als Zukunftsaussage verstanden werden.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „ihren Vorfahren“. Wörtlich: „ihren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: höre du
  rationale: Im Zusammenhang des Gebets gibt die deutsche Bitte „höre du“ den möglichen volitiven Sinn des hebräischen Imperfekts natürlich wieder; das aufmerksame Hören mit erwarteter Antwort bleibt dabei unausgesprochen.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Der hebräische Plural bezeichnet hier Gottes himmlischen Wohnbereich. Der deutsche Singular ist idiomatisch; „her“ verdeutlicht die Richtung des Hörens.
- source_word: סָלַחְתָּ
  choice: vergib
  rationale: סלח ist das übliche Verb für göttliche Vergebung. In der fortlaufenden Gebetsbitte ist der deutsche Imperativ natürlich.
- source_word: לְחַטַּאת
  choice: die Sünde
  rationale: Der Singular bezeichnet hier zusammenfassend Israels Verfehlung und wird formal bewahrt.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: deines Volkes Israel
  rationale: Die Formulierung bewahrt sowohl die Bundesbezeichnung „dein Volk“ als auch den Eigennamen in natürlichem Deutsch.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: bring sie zurück
  rationale: 'Der Hifil von שוב ist kausativ: Gott bewirkt ihre Rückkehr. „Bring sie zurück“ gibt diesen Sinn klar und idiomatisch wieder.'
- source_word: אֶל הָאֲדָמָה
  choice: in das Land
  rationale: Im Zusammenhang der göttlichen Landgabe bezeichnet אֲדָמָה das Israel gegebene Land, nicht bloß Erdboden oder Ackerboden.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: das du ihnen und ihren Vätern gegeben hast
  rationale: Die Wiedergabe erhält die zweifache Dativbeziehung und die Verbindung der gegenwärtigen Generation mit den Vätern.
theological_decisions:
- issue: Aussage oder Bitte bei תִּשְׁמַע und den folgenden Verbformen
  choice: 'Gebetsbitte: „höre du … vergib … und bring … zurück“'
  alternative: 'Zukunftsaussage: „dann wirst du … hören und … vergeben und … zurückbringen“'
  rationale: Das hebräische Imperfekt kann in diesem Gebetszusammenhang volitiv oder zukünftig verstanden werden. Die Hauptfassung folgt dem bittenden Charakter von Salomos Gebet; eine Fußnote bewahrt die mögliche Zukunftslesart.
- issue: Wiedergabe von אֲבֹתֵיהֶם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: Der hebräische Ausdruck lautet wörtlich „ihren Vätern“ und unterstreicht die generationenübergreifende Landverheißung. Die weitere Bedeutung „Vorfahren“ wird als lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gebetsbitte wird durch „höre du“ hervorgehoben; „vom Himmel her“ und „in das Land“ sind idiomatisch und zugleich eng am hebräischen Bild- und Bedeutungsgehalt.
