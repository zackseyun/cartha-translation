  terminology: „sündigt“, „Nächster“, „Altar“ und „Haus“ sind sachgerecht. „Flucheid“ bewahrt die Sanktion eines eidlichen Fluchs, ohne die Alternative „Eid“ auszuschließen. Die Wiederaufnahme mit „dieser Eid“ hält den Zusammenhang klar und vermeidet eine unnötig sperrige Wiederholung.
