base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: de
  text: Wenn jemand gegen seinen Nächsten sündigt und ihm ein Flucheid[a] auferlegt wird, damit er schwört, und dieser Eid vor deinen Altar in diesem Haus kommt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Flucheid“ ist ein Eid, bei dem für einen falschen Schwur ein Fluch angerufen wird; das hebräische Wort kann je nach Zusammenhang auch mit „Eid“ oder „Fluch“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: Wenn jemand gegen seinen Mitmenschen sündigt
  rationale: Die Bedingung und der moralisch-religiöse Gehalt von חטא bleiben erhalten. „Jemand“ gibt אִישׁ im Deutschen natürlich als unbestimmte Einzelperson wieder; „Mitmensch“ bezeichnet רֵעַ als Person im sozialen Nahbereich.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: und ihm ein Fluch-Eid auferlegt wird
  rationale: Die passive Verpflichtung wird ausdrücklich wiedergegeben. „Fluch-Eid“ bewahrt, dass אָלָה einen Eid mit angedrohter beziehungsweise angerufener Fluchfolge bezeichnen kann.
- source_word: לְהַאֲלֹתוֹ
  choice: um ihn schwören zu lassen
  rationale: Die kausative Bedeutung des Hifil-Infinitivs wird eigenständig wiedergegeben und nicht mit der vorhergehenden Wendung verschmolzen.
- source_word: וּבָא אָלָה
  choice: und der Eid … kommt
  rationale: Die ungewöhnliche hebräische Konstruktion, in der אָלָה Subjekt von וּבָא ist, bleibt erhalten; sie kann auf das Vorbringen beziehungsweise Aussprechen des Eides am Altar weisen.
- source_word: לִפְנֵי מִזְבַּחֲךָ בַּבַּיִת הַזֶּה
  choice: vor deinen Altar in dieses Haus
  rationale: Die Bewegungsrichtung des Verbs „kommt“ wird durch den Akkusativ natürlich ausgedrückt. בַּיִת wird wörtlich und theologisch resonant als „Haus“ wiedergegeben.
theological_decisions:
- issue: Gerichtlicher Sinn von אָלָה
  choice: Im ersten Vorkommen „Fluch-Eid“, danach lesefreundlich „der Eid“
  alternative: „Eid“ an beiden Stellen oder „Fluch“ an beiden Stellen
  rationale: אָלָה verbindet in diesem gerichtlichen Zusammenhang Schwur und Fluchsanktion. Nur „Eid“ schwächt diese Nuance ab, nur „Fluch“ verdeckt den Schwurvorgang. Die gewählte Form bewahrt beides, ohne den Satz unnötig zu belasten.
- issue: Subjekt und Bewegung in וּבָא אָלָה
  choice: „der Eid … kommt“
  alternative: „er kommt und spricht den Eid“
  rationale: Der masoretische Wortlaut stellt אָלָה grammatisch als Subjekt zu „kommt“. Eine Umformung mit der Person als Subjekt wäre verständlicher, würde aber eine Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechts- und Kultsprache bleibt erkennbar, zugleich wird die genuine Mehrdeutigkeit von אָלָה offengelegt. Der Vers ist syntaktisch unvollständig, weil der Bedingungssatz im folgenden Vers fortgesetzt wird; daher endet die Übersetzung mit einem Komma.
