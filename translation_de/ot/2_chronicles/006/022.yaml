revisions:
- from: Wenn jemand gegen seinen Mitmenschen sündigt und ihm ein Fluch-Eid[a] auferlegt wird, um ihn schwören zu lassen, und der Eid vor deinen Altar in dieses Haus kommt,
  to: Wenn jemand gegen seinen Nächsten sündigt und ihm ein Flucheid[a] auferlegt wird, damit er schwört, und dieser Eid vor deinen Altar in diesem Haus kommt,
  rationale: Die Ortsangabe wird als „in diesem Haus“ wiedergegeben, entsprechend dem hebräischen בַּ. „Nächsten“ ersetzt das allgemeinere „Mitmenschen“. Die zwei aufeinanderfolgenden hebräischen Konstruktionen – das Auferlegen eines Flucheids und das Veranlassen zum Schwur – bleiben getrennt erkennbar. Die im Hebräischen mögliche und im Entwurf bewusst bewahrte Form, dass der Eid selbst vor den Altar kommt, wird nicht zugunsten einer stärker interpretierenden Umformung verändert.
