  source_fidelity: 'Die Grundbedeutung ist zutreffend: Salomo erklärt, ein erhabenes Haus als Ort für Gottes bleibendes Wohnen gebaut zu haben. Doch מָכוֹן bezeichnet spezifischer einen festen bzw. dauerhaft eingerichteten Ort; dieser Aspekt fehlt bei »Stätte«. Das deutsche »sollst« verleiht dem Infinitiv לְשִׁבְתְּךָ eine unnötig verpflichtende oder bloß zukünftige Nuance.'
  naturalness: Die Fassung ist würdig und gut verständlich. »eine feste Stätte, damit du für immer darin wohnst« ist ebenso natürlich und stellt den Bezug von »darin« auf das Haus eindeutig her.
  terminology: »Erhabenes Haus« gibt בֵּית זְבֻל angemessen wieder und entspricht dem englischen Audit-Trail »lofty house«. »Feste Stätte« gibt מָכוֹן präziser wieder, ohne über die Bedeutung hinauszugehen. »Für immer« ist eine passende moderne Wiedergabe von עוֹלָמִים.
