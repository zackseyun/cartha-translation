  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: de
  text: Doch ich habe dir ein erhabenes Haus gebaut, eine feste Stätte, damit du für immer darin wohnst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: ein erhabenes Haus
  rationale: זְבֻל bezeichnet hier wahrscheinlich eine hohe beziehungsweise erhabene Wohnstätte. Die Wiedergabe wahrt das räumliche und würdevolle Bedeutungsfeld, ohne die Wendung auf eine bloß »prächtige« Ausstattung zu verengen.
- source_word: מָכוֹן
  choice: eine Stätte
  rationale: Das Wort bezeichnet einen fest eingerichteten oder bestimmten Ort; »Stätte« klingt im Deutschen würdig und lässt den Gedanken eines festen Wohnsitzes erkennen.
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: an der du für immer wohnen sollst
  rationale: Der Infinitiv mit לְ wird als Zweck beziehungsweise Bestimmung wiedergegeben. עוֹלָמִים bezeichnet hier eine unbegrenzte, dauerhafte Zeitspanne.
theological_decisions:
- issue: Gottes Wohnen im Tempel
  choice: eine Stätte, an der du für immer wohnen sollst
  alternative: eine Stätte, an der du ewig wohnst
  rationale: Die Formulierung gibt Salomos Aussage über die Bestimmung des Tempels wieder, ohne die Spannung zu 2. Chronik 6,18 vorwegnehmend aufzulösen oder Gottes Gegenwart räumlich zu begrenzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Doch« bildet den Kontrast zum vorausgehenden Vers ab; »erhabenes Haus« bewahrt die ungewöhnliche Bildsprache des Hebräischen.
