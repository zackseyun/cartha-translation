source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: de
  text: Und nun, Jahwe, Gott Israels, möge sich dein Wort, das du zu deinem Diener David gesprochen hast, als wahr erweisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Möge dein Wort Bestand haben«; auch: »möge dein Wort bestätigt werden«. Sinngemäß: »Möge sich deine Zusage erfüllen«.'
    reason: Lexikalische Alternativen für יֵאָמֵן und die kontextuelle Bedeutung von דְּבָרְךָ.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus וְ und dem Zeitadverb עַתָּה leitet Salomos nächste Bitte ein; »Und nun« bildet sowohl den Anschluss als auch den zeitlich-diskursiven Übergang natürlich ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Die Status-constructus-Verbindung wird transparent und idiomatisch wiedergegeben.
- source_word: יֵאָמֵן
  choice: möge sich … bestätigen
  rationale: Der Nifal von אמן bezeichnet hier in bittender Bedeutung, dass sich Gottes gesprochenes Wort als fest und wahr erweisen beziehungsweise in Erfüllung bestätigen soll.
- source_word: דְּבָרְךָ
  choice: dein Wort
  rationale: Die wörtliche Bedeutung bleibt erhalten. Im Zusammenhang handelt es sich um eine Zusage, doch »Wort« bewahrt die Ausdrucksweise des Hebräischen.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: das du … gesprochen hast
  rationale: Die Formulierung bildet den Relativsatz und die lexikalische Verbindung zwischen »Wort« und »gesprochen« direkt ab.
- source_word: לְעַבְדְּךָ
  choice: zu deinem Diener
  rationale: לְ kennzeichnet bei דבר den Adressaten. »Diener« passt zum königlich-bundestheologischen Zusammenhang besser als das im Deutschen stärker sozialrechtlich geprägte »Sklave«.
- source_word: לְדָוִיד
  choice: David
  rationale: Der Personenname wird nach der üblichen deutschen Namensform wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt diesen als Namen und verwendet die im modernen Deutschen geläufige Umschrift.
- issue: Bedeutungsumfang von דְּבָרְךָ
  choice: dein Wort
  alternative: deine Zusage; dein Versprechen
  rationale: Im Kontext ist Gottes Wort an David eine Zusage. Die Übersetzung »Wort« vermeidet jedoch, die kontextuelle Bedeutung bereits im Substantiv enger festzulegen.
- issue: Deutung von יֵאָמֵן
  choice: möge sich … bestätigen
  alternative: möge Bestand haben; möge sich als wahr erweisen
  rationale: Die gewählte Formulierung wahrt den bittenden Charakter und die Spannung zwischen Festigkeit, Verlässlichkeit und tatsächlicher Erfüllung, ohne nur eine dieser Nuancen absolut zu setzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsanrede bleibt knapp und feierlich; der Satzbau folgt dem Hebräischen, ohne im Deutschen unnatürlich zu wirken.
