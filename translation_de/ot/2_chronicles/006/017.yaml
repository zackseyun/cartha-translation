  source_fidelity: 'Der Entwurf gibt alle Bestandteile des hebräischen Textes zutreffend wieder: die anschließende Bitte (וְעַתָּה), die Anrede an Jahwe als Gott Israels, Gottes an David gerichtetes Wort sowie den jussivisch-bittenden Nifal יֵאָמֵן. Die Wiedergabe von לְ als „zu“ bei „zu deinem Diener David“ ist sachgerecht.'
