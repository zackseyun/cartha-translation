  terminology: „Jahwe“, „Gott Israels“, „dein Wort“ und „deinem Diener David“ sind angemessen, quellentreu und im würdevollen Gebetsregister natürlich. „Wort“ wahrt gegenüber der kontextuell möglichen Einengung auf „Zusage“ die Offenheit des hebräischen דָּבָר.
