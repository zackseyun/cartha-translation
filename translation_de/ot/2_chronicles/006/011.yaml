id: 2CH.6.11
reference: 2 Chronicles 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: de
  text: Und dort habe ich die Lade aufgestellt, in der sich der Bund Jahwes befindet, den er mit den Söhnen Israels[a] geschlossen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „den Kindern Israels“. Wörtlich steht im Hebräischen „den Söhnen Israels“; die feste Bezeichnung meint hier das Volk Israel als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: habe ich … aufgestellt
  rationale: שׂוּם bedeutet „setzen, stellen, legen“. Das deutsche Perfekt gibt die abgeschlossene Handlung mit ihrer fortdauernden Bedeutung im Zusammenhang von Salomos Rede natürlich wieder; „aufgestellt“ passt zur Lade als heiligem Gegenstand.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist unmittelbar auf den zuvor genannten Ort im Tempel.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: „Lade“ ist im Deutschen die etablierte und sachlich passende Bezeichnung für die Bundeslade; der bestimmte Artikel entspricht dem Hebräischen.
- source_word: אֲשֶׁר שָׁם
  choice: in der sich … befindet
  rationale: Die Formulierung gibt die räumliche Aussage des Relativsatzes in natürlichem Deutsch wieder, ohne die im Hebräischen bestehende Zuordnung des Bundes zur Lade näher auszudeuten.
- source_word: בְּרִית יְהוָה
  choice: der Bund Jahwes
  rationale: בְּרִית wird als „Bund“ wiedergegeben; der Genitiv bewahrt die transparente Verbindung mit dem Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Umschrift gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲשֶׁר כָּרַת
  choice: den er … geschlossen hat
  rationale: Das hebräische Idiom „einen Bund schneiden“ wird idiomatisch deutsch mit „einen Bund schließen“ wiedergegeben. Das Relativpronomen bezieht sich klar auf „Bund“.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet hier die Bundespartner und wird unmittelbar mit „mit“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Wiedergabe bleibt nahe an der grammatisch maskulinen hebräischen Form. Eine Fußnote erklärt, dass die feste Bezeichnung das Volk Israel als Ganzes meint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen des Ausgangstextes; die traditionelle Ersetzung durch den Titel „der HERR“ würde diesen Unterschied verdecken.
- issue: Bedeutungsumfang von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels / das Volk Israel
  rationale: Die Hauptfassung bildet die hebräische Form genau ab. Da die Wendung zugleich eine feste Gesamtbezeichnung für das Bundesvolk ist, wird dieser umfassende Sinn in der Fußnote offengelegt.
- issue: Der Bund befindet sich in der Lade
  choice: in der sich der Bund Jahwes befindet
  alternative: in der die Tafeln des Bundes Jahwes liegen
  rationale: Der hebräische Text nennt ausdrücklich den „Bund“, wahrscheinlich metonymisch mit Blick auf die Bundestafeln. Die Übersetzung ergänzt „Tafeln“ nicht und bewahrt so Ausdruck und theologische Dichte des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am hebräischen Gedankengang, wird jedoch durch „in der sich … befindet“ und das deutsche Bundesidiom flüssig und allgemein verständlich gestaltet.
