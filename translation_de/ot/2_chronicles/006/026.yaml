base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: de
  text: Wenn der Himmel verschlossen bleibt und kein Regen fällt, weil sie gegen dich gesündigt haben, und sie zu diesem Ort hin beten, deinen Namen bekennen und sich von ihrer Sünde abkehren, weil du sie demütigst[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil du ihnen antwortest« oder »weil du sie erhörst«. Die Verbform wird unterschiedlich gedeutet; im Zusammenhang mit der Dürre ist auch »weil du sie bedrängst« möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Wenn der Himmel verschlossen ist
  rationale: Der substantivierte Singular „Himmel“ bezeichnet im Deutschen natürlich den regenbringenden Himmel; „verschlossen“ bewahrt das konkrete Bild des hebräischen Niphal von עצר.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: und es nicht regnet
  rationale: Eine natürliche deutsche Wiedergabe der hebräischen Existenzkonstruktion, ohne deren schlichten Sinn zu verändern.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: weil sie gegen dich gesündigt haben
  rationale: כִּי ist hier kausal; לָךְ bezeichnet Gott als den, gegen den sich die Sünde richtet.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: und sie zu diesem Ort hin beten
  rationale: אֶל bezeichnet hier die Gebetsrichtung, nicht den Ort als Adressaten des Gebets.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennen
  rationale: ידה im Hiphil kann danken, preisen oder bekennen bedeuten. Im Zusammenhang von Sünde, Gebet und Umkehr ist „bekennen“ passend und lässt die Anerkennung von Gottes Namen anklingen.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: und sich von ihrer Sünde abkehren
  rationale: שוב mit מן bezeichnet eine Umkehr weg von etwas; die Formulierung bewahrt das Bewegungsbild, statt es lediglich mit „bereuen“ wiederzugeben.
- source_word: כִּי תַעֲנֵם
  choice: weil du sie erhörst
  rationale: Die unpunktierte Konsonantenfolge kann mit ענה „antworten/erhören“ verbunden werden. „Erhören“ passt im Deutschen zum Gebetskontext und zur kausalen Verknüpfung.
theological_decisions:
- issue: Bedeutung von תַעֲנֵם im Schlusssatz
  choice: weil du sie erhörst
  alternative: weil du sie demütigst / bedrängst
  rationale: Der Gebetskontext stützt die Deutung als „antworten, erhören“. Da dieselbe Konsonantenfolge auch auf „demütigen, bedrängen“ bezogen werden kann und dies die Umkehr als Folge göttlicher Züchtigung versteht, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange konditionale Satz bleibt entsprechend dem hebräischen Gebetsstil offen und wird durch das folgende Versglied fortgesetzt. „Zu diesem Ort hin“ macht die räumliche Ausrichtung des Gebets eindeutig.
