source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: de
  text: Dann stand er vor dem Altar Jahwes, vor der ganzen Versammlung Israels, und breitete seine Hände aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Handflächen«; gemeint ist das Ausbreiten der Hände zum Gebet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Dann trat er
  rationale: Das Wayyiqtol führt die Erzählung weiter. Im Zusammenhang bezeichnet עמד das Einnehmen einer stehenden Position; „trat er“ klingt im Deutschen natürlich und vermeidet das missverständliche statische „stand er“.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: vor den Altar Jahwes
  rationale: לִפְנֵי bezeichnet hier die räumliche Stellung vor dem Altar; der Konstruktus wird transparent wiedergegeben, und der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: vor die ganze Versammlung Israels
  rationale: נֶגֶד beschreibt seine Position gegenüber den Versammelten. קהל bezeichnet die als Gemeinschaft zusammengekommene Versammlung Israels.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: und breitete seine Hände aus
  rationale: Wörtlich sind die „Handflächen“ gemeint; die deutsche Wendung „die Hände ausbreiten“ gibt die Gebetsgeste natürlich und genau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn im modernen Standarddeutsch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die doppelte Präposition „vor“ bildet die zwei räumlichen Beziehungen des Hebräischen verständlich ab: vor dem Altar und zugleich gegenüber der Versammlung.'
