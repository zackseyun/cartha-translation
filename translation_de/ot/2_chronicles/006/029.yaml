base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: de
  text: Jedes Gebet, jedes Flehen, das von irgendeinem Menschen oder von deinem ganzen Volk Israel dargebracht wird, wenn jeder seine eigene Plage und seinen eigenen Schmerz erkennt und seine Hände zu diesem Haus hin ausbreitet –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: Jedes Gebet, jedes Flehen
  rationale: Die Wiederholung von כָּל wird bewahrt. „Flehen“ gibt den eindringlichen, auf Gnade zielenden Charakter von תְּחִנָּה in natürlichem, würdigem Deutsch wieder.
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: das von irgendeinem Menschen oder von deinem ganzen Volk Israel kommen mag
  rationale: „Kommen mag“ gibt das offene אֲשֶׁר יִהְיֶה idiomatisch wieder, ohne eine ausdrücklich nicht genannte Handlung zu stark festzulegen. Das ל bezeichnet hier die Zuordnung zum einzelnen Betenden beziehungsweise zum ganzen Volk; „oder“ verdeutlicht die distributive Alternative.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: wenn jeder … erkennt
  rationale: 'אִישׁ ist distributiv: Jeder Einzelne kennt beziehungsweise erkennt seine persönliche Not. „Wenn“ fügt sich natürlich in den fortlaufenden Bedingungssatz ein, dessen Hauptsatz in Vers 30 folgt.'
- source_word: נִגְעוֹ וּמַכְאֹבוֹ
  choice: seine eigene Plage und seinen eigenen Schmerz
  rationale: נֶגַע kann Plage, Schlag oder Leiden bezeichnen; „Plage“ wahrt die konkrete und zugleich offene Bedeutung. מַכְאוֹב wird unterscheidbar als „Schmerz“ wiedergegeben. „Eigene“ macht die pronominalen Suffixe und den persönlichen Bezug deutlich.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: und seine Hände … ausbreitet
  rationale: Die feste Gebetsgeste wird im Deutschen idiomatisch mit „die Hände ausbreiten“ ausgedrückt; כַּפָּיו bezeichnet wörtlich seine Handflächen, im Ausdruck jedoch die Hände.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: zu diesem Haus hin
  rationale: Die Formulierung bewahrt die räumliche Ausrichtung des Gebets auf den Tempel, ohne zu unterstellen, das Gebet werde an das Gebäude selbst gerichtet.
theological_decisions:
- issue: Generischer Gebrauch von הָאָדָם
  choice: irgendeinem Menschen
  alternative: irgendeinem Mann
  rationale: אָדָם bezeichnet hier im generischen Singular einen beliebigen einzelnen Angehörigen des Volkes, nicht eigens eine männliche Person. „Mensch“ gibt diese Reichweite im modernen Deutschen präzise wieder.
- issue: Bedeutungsumfang von נֶגַע
  choice: Plage
  alternative: Leiden
  rationale: „Plage“ erhält die mögliche konkrete Bedeutung eines Schlages oder einer Erkrankung, ohne den Ausdruck darauf zu beschränken. Die Verbindung mit „Schmerz“ bewahrt die Spannung zwischen äußerer Heimsuchung und persönlich erfahrenem Leid.
- issue: Syntaktischer Anschluss an Vers 30
  choice: offener Bedingungssatz mit Gedankenstrich am Ende
  alternative: abgeschlossener Aussagesatz
  rationale: Vers 29 bildet syntaktisch die Voraussetzung für die Bitte in Vers 30. Der abschließende Gedankenstrich signalisiert, dass der Satz weitergeführt wird, ohne den noch folgenden Hauptsatz vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Die hebräische Wiederholung und die individuelle wie gemeinschaftliche Reichweite bleiben erhalten. Keine Fußnote ist erforderlich.
