  source_fidelity: 'Die Übersetzung gibt die Konditionalsatzstruktur und die Abfolge des Hebräischen zuverlässig wieder: Niederlage vor einem Feind aufgrund der Sünde, Umkehr, Bekenntnis des Namens, Gebet und eindringliche Bitte vor Gott in diesem Haus. „Geschlagen wird“ trifft יִנָּגֵף im militärischen Zusammenhang, ohne stärker als nötig zu interpretieren. Das grammatische Singularpronomen bei „Volk“ ist im Deutschen idiomatisch und sachlich unproblematisch.'
