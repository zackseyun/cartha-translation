  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: de
  text: Wenn dein Volk Israel vor einem Feind geschlagen wird, weil es gegen dich gesündigt hat, dann aber umkehrt[a], deinen Namen bekennt[b], in diesem Haus vor dir betet und um Gnade fleht[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückkehrt“; das hebräische Verb kann im Zusammenhang des Bundes auch die Umkehr zu Gott bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deinen Namen preist“ oder „deinem Namen dankt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „um Erbarmen bittet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  choice: geschlagen wird
  rationale: Das Nifal bezeichnet hier im militärischen Zusammenhang, dass Israel vor einem Feind eine Niederlage erleidet. „Geschlagen wird“ bewahrt die passive Ausdrucksweise des Hebräischen.
- source_word: לִפְנֵי אוֹיֵב
  choice: vor einem Feind
  rationale: Die Formulierung gibt das hebräische Bild wörtlich und im Deutschen verständlich wieder; אוֹיֵב ist hier nicht notwendig bestimmt.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: weil es gegen dich gesündigt hat
  rationale: כִּי nennt hier den Grund der Niederlage. Der Singular „es“ bezieht sich im Deutschen auf das Kollektiv „Volk“.
- source_word: וְשָׁבוּ
  choice: dann aber umkehrt
  rationale: שׁוב kann sowohl die Rückkehr als auch die innere Umkehr im Bundesverhältnis bezeichnen. „Umkehrt“ lässt beide Aspekte anklingen, ohne einen theologischen Fachbegriff aufzuzwingen.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennt
  rationale: ידה im Hifil kann bekennen, preisen oder danken bedeuten. Im Zusammenhang von Sünde, Umkehr und Bitte um Wiederherstellung ist „bekennen“ sachgemäß, während eine Fußnote die lexikalische Breite wahrt.
- source_word: וְהִתְפַּלְלוּ
  choice: betet
  rationale: Schlichte und direkte Wiedergabe des Hitpael von פלל.
- source_word: וְהִתְחַנְּנוּ
  choice: um Gnade fleht
  rationale: Das Hitpael von חנן bezeichnet eindringliches Bitten um Gunst oder Erbarmen. „Um Gnade flehen“ ist gegenwärtiges, verständliches Deutsch und bewahrt die Intensität.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die geläufige hebräische Wendung für das Beten in Gottes Gegenwart lässt sich im Deutschen ebenso knapp wiedergeben.
- source_word: בַּבַּיִת הַזֶּה
  choice: in diesem Haus
  rationale: בַּ bezeichnet hier den Ort, und בַּיִת wird bewusst als „Haus“ wiedergegeben; „Tempel“ wäre eine erklärende Präzisierung.
theological_decisions:
- issue: Bedeutungsumfang von וְשָׁבוּ
  choice: umkehrt
  alternative: zurückkehrt; Buße tut
  rationale: Der Zusammenhang schließt Reue und erneute Hinwendung zu Gott ein, doch das hebräische Verb bewahrt zugleich das konkrete Bild der Rückkehr. „Umkehrt“ erhält diese Spannung.
- issue: Bedeutungsumfang von וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennt
  alternative: deinen Namen preist; deinem Namen dankt
  rationale: Im Kontext der Umkehr nach begangener Sünde liegt das anerkennende Bekennen von Gottes Namen nahe. Da ידה jedoch auch Lob und Dank ausdrücken kann, werden diese Möglichkeiten nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konditionale Satzstruktur bleibt offen, da der Satz im folgenden Vers fortgesetzt wird. „Haus“ wahrt die Bildsprache des Tempelweihgebets, und die Fußnoten machen echte lexikalische Mehrdeutigkeit sichtbar.
