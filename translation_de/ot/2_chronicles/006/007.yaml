id: 2CH.6.7
reference: 2 Chronicles 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: de
  text: David, mein Vater,[a] hatte es im Herzen, ein Haus für den Namen Jahwes,[b] des Gottes Israels, zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Vater David«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »ein Haus für den Namen Jahwes«; eine feste Wendung für den Tempel als den Ort, der mit Gottes Namen verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: hatte es im Herzen
  rationale: Die hebräische Konstruktion bezeichnet eine im Herzen getragene Absicht. Die deutsche Wendung ist natürlich und bewahrt zugleich das biblische Herz-Motiv.
- source_word: דָּוִיד אָבִי
  choice: David, mein Vater
  rationale: Folgt der hebräischen Wortfolge und ist mit Apposition im Deutschen gut verständlich; die geläufigere Alternative wird in einer Fußnote genannt.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Gibt den Infinitiv von בנה direkt und idiomatisch wieder.
- source_word: בַּיִת
  choice: ein Haus
  rationale: Bewahrt das konkrete hebräische Wort und die theologisch bedeutsame Tempelmetaphorik, ohne vorschnell mit »Tempel« zu präzisieren.
- source_word: לְשֵׁם
  choice: für den Namen
  rationale: Erhält die für Deuteronomium und Chronik charakteristische Namensformel, statt sie als »zu Ehren« auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im modernen deutschen Bibelregister wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Natürliche und genaue Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Tempelbezogene Wendung בַּיִת לְשֵׁם יְהוָה
  choice: ein Haus für den Namen Jahwes
  alternative: einen Tempel für Jahwe; ein Haus zu Ehren Jahwes
  rationale: Die Übersetzung bewahrt sowohl »Haus« als auch »Name« und damit die eigene Spannung des Textes hinsichtlich des Verhältnisses von Gottes Gegenwart, seinem Namen und dem Heiligtum.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hatte es im Herzen« ist idiomatisch, ohne die Absicht bloß rational als Plan wiederzugeben. Die Satzstellung vermeidet unnötige Altertümlichkeit und erhält die hebräische Namens- und Haus-Terminologie.
