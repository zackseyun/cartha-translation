  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: de
  text: 'Dann höre du vom Himmel her, handle und richte deine Diener: Lass den Weg des Frevlers auf seinen eigenen Kopf zurückfallen[a] und gib dem Gerechten Recht[b], indem du ihm nach seiner Gerechtigkeit vergiltst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seinen Weg auf seinen Kopf geben«. Das hebräische Bild besagt, dass die Folgen des eigenen Handelns im Gericht auf den Täter zurückfallen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »den Gerechten für gerecht erklären«. Das hebräische Verb ist ein Rechtsbegriff und bedeutet, jemanden für gerecht beziehungsweise im Recht zu erklären oder ihn entsprechend zu behandeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: höre du vom Himmel her
  rationale: Das Gebetswort שׁמע bezeichnet hier ein Hören, das eine Antwort einschließt. Das hervorgehobene Pronomen אַתָּה wird durch „du“ bewahrt; „vom Himmel her“ gibt die hebräische Wendung natürlich wieder.
- source_word: וְעָשִׂיתָ
  choice: und handle
  rationale: Das breite Verb עשׂה meint in diesem Zusammenhang Gottes wirksames Eingreifen; „handle“ ist knapp und wahrt die Offenheit des Ausdrucks.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Sprich deinen Dienern Recht
  rationale: שׁפט ist durch die folgenden gegensätzlichen Urteile forensisch bestimmt. Die deutsche Wendung bringt den Gerichtskontext idiomatisch zum Ausdruck, ohne ausdrücklich ein bloßes Entscheiden zwischen zwei Parteien einzutragen.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: Lass ... des Schuldigen ... zurückfallen
  rationale: Die Konstruktion bezeichnet vergeltende Rückkehr der eigenen Lebensführung. „Schuldiger“ passt zum gerichtlichen Gegensatz mit dem Gerechten und vermeidet eine rein charakterliche Deutung von רשע.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: das Handeln ... auf seinen eigenen Kopf zurückfallen
  rationale: דֶּרֶךְ bedeutet hier die Lebensführung bzw. das Handeln. Die Wiedergabe erhält das hebräische Bild, macht aber seinen Sinn im Deutschen verständlich.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: und sprich den Gerechten gerecht
  rationale: 'Die Hifilform von צדק ist forensisch: jemanden als im Recht erklären oder entsprechend behandeln. Die bewusst rechtssprachliche Formulierung bewahrt den Wortstamm und die Spannung des Originals.'
- source_word: לָתֵת לוֹ כְּצִדְקָתוֹ
  choice: indem du ihm nach seiner Gerechtigkeit vergiltst
  rationale: „Vergelten“ macht den parallelen Gedanken gerichtlicher Zumessung deutlich; „nach seiner Gerechtigkeit“ bleibt nahe an der hebräischen Formulierung und legt die Art des Ergehens nicht genauer fest.
theological_decisions:
- issue: Forensischer Charakter des göttlichen Handelns
  choice: Gott spricht seinen Dienern Recht, lässt das Tun des Schuldigen auf ihn zurückfallen und spricht den Gerechten gerecht.
  alternative: Gott regiert seine Diener oder greift allgemein ein.
  rationale: שׁפט, רשע, הצדיק und צדיק bilden zusammen eindeutig eine Gerichtsszene. Die Übersetzung wahrt diesen Rahmen, ohne spätere dogmatische Kategorien einzuführen.
- issue: Bedeutung von וּלְהַצְדִּיק צַדִּיק
  choice: sprich den Gerechten gerecht
  alternative: rechtfertige den Gerechten; bestätige das Recht des Gerechten
  rationale: Die gewählte Fassung erhält die forensische Erklärung, vermeidet aber, den Ausdruck ausschließlich mit einer späteren theologischen Fachbedeutung von „Rechtfertigung“ zu verbinden.
- issue: Bezeichnung רשע
  choice: der Schuldige
  alternative: der Gottlose; der Böse
  rationale: Im unmittelbaren Gerichtsrahmen hebt רשע die Person hervor, die im Unrecht bzw. schuldig ist. „Gottloser“ könnte den Sinn unnötig auf persönliche Religionslosigkeit verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit Gebetston. Die Satzglieder bleiben eng parallel. „Sprich ... Recht“ und „sprich ... gerecht“ bewahren den gerichtlichen Wortlaut; die Fußnoten erläutern das hebräische Vergeltungsbild und die forensische Bedeutung.
