  source_fidelity: Der Entwurf gibt die Abfolge von Hören, Handeln und richterlichem Entscheiden sowie die gegensätzliche Vergeltung für Frevler und Gerechte im Wesentlichen zutreffend wieder. „Sprich deinen Dienern Recht“ ist jedoch für שׁפט problematisch, da es bereits ein günstiges Urteil für alle Diener ausdrückt, während der hebräische Satz das Gericht erst durch die folgenden beiden, gegensätzlichen Infinitive entfaltet.
  naturalness: „Sprich den Gerechten gerecht“ ist zwar eng am hebräischen Wortspiel, im heutigen Standarddeutsch aber deutlich unidiomatisch und ohne Fußnote schwer verständlich. „Gib dem Gerechten Recht“ ist eine natürliche gerichtssprachliche Wiedergabe und wahrt den forensischen Sinn.
  terminology: „Frevler“ trifft רשע im rechtlich-moralischen Gegensatz zu צדיק präziser als „Schuldiger“, das im Deutschen leicht nur eine formell angeklagte oder überführte Person bezeichnet. „Gerechtigkeit“ und die Vergeltung nach ihr bleiben erhalten.
  issues:
  - severity: medium
    issue: „Sprich deinen Dienern Recht“ übersetzt שׁפט zu einseitig.
    rationale: Die Wendung bedeutet im Deutschen, jemandem Recht zu geben. Der Ausgangstext sagt zunächst allgemein, Gott solle seine Diener richten; erst danach werden das Ergehen des Frevlers und die Rechtserweisung für den Gerechten unterschieden.
  - severity: medium
    issue: „Sprich den Gerechten gerecht“ ist im modernen Deutschen nicht ausreichend idiomatisch.
    rationale: Die Formulierung bildet den hebräischen Stamm nach, wirkt aber wie eine unklare Wiederholung. Die rechtliche Bedeutung von הצדיק wird mit „gib dem Gerechten Recht“ klar und ohne dogmatische Aufladung wiedergegeben.
  - severity: low
    issue: „Schuldiger“ verengt רשע leicht auf prozessuale Schuld.
    rationale: רשע bezeichnet hier den Menschen, der im Unrecht handelt; „Frevler“ bewahrt den gerichtlichen und ethischen Kontrast zu „dem Gerechten“.
