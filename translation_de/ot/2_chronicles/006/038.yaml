  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: de
  text: und sie mit ganzem Herzen und mit ganzer Seele zu dir umkehren[a] im Land ihrer Gefangenschaft, in das man sie als Gefangene verschleppt hat, und zu ihrem Land hin beten, das du ihren Vorfahren gegeben hast, und zu der Stadt, die du erwählt hast, und zu dem Haus, das ich für deinen Namen gebaut habe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dir zurückkehren“; die Wendung kann in einem Bundeszusammenhang auch den Sinn von Umkehr und Reue haben.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: und sie ... zu dir umkehren
  rationale: שׁוּב mit אֶל bezeichnet die Rückkehr beziehungsweise Umkehr zu jemandem. „Zu dir umkehren“ bewahrt das konkrete Bild und lässt zugleich den bundestheologischen Sinn der Reue mitschwingen, ohne ihn ausdrücklich festzulegen.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: mit ganzem Herzen und mit ganzer Seele
  rationale: Die vertraute Paarung gibt die hebräische Wendung für ungeteilte innere Hingabe eng und im Deutschen natürlich wieder.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: im Land ihrer Gefangenschaft
  rationale: Die Formulierung folgt der hebräischen Konstruktverbindung und bezeichnet das Land, in dem sie sich als Gefangene befinden.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: wohin man sie gefangen weggeführt hat
  rationale: Das aktive hebräische Verb שׁבה mit Objektsuffix beschreibt ihre Verschleppung durch nicht ausdrücklich genannte Feinde. Das unpersönliche „man“ wahrt diese Unbestimmtheit; „wohin“ gibt den räumlichen Bezug im Deutschen klar wieder.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: und in Richtung ihres Landes beten
  rationale: דֶּרֶךְ bezeichnet hier die Gebetsausrichtung. „In Richtung“ ist in modernem Deutsch eindeutiger und natürlicher als „gegen ... hin“.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: das du ihren Vorfahren gegeben hast
  rationale: אָבוֹת bezeichnet hier die früheren Generationen Israels. „Vorfahren“ ist gegenwärtig, verständlich und schließt die genealogische Bedeutung ein.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: und in Richtung der Stadt, die du erwählt hast
  rationale: „Erwählt“ wahrt den theologischen Gehalt von בחר; das Perfekt „hast erwählt“ unterstreicht die fortbestehende Bedeutung der Wahl.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: und des Hauses, das ich für deinen Namen gebaut habe
  rationale: „Haus“ bewahrt die Bezeichnung בַּיִת für den Tempel und ihre theologische Resonanz. „Für deinen Namen“ erhält die hebräische Widmungsformel, statt sie auszudeuten.
theological_decisions:
- issue: Bedeutung von שׁוּב אֵלֶיךָ zwischen Rückkehr und Reue
  choice: „zu dir umkehren“
  alternative: „zu dir zurückkehren“ oder ausdrücklich „vor dir bereuen“
  rationale: Das Verb bezeichnet grundsätzlich ein Zurückkehren beziehungsweise Sich-Zuwenden und trägt hier einen Sinn von Reue und Bundeserneuerung. „Umkehren“ lässt diese Dimension erkennen, ohne die konkrete und relationale Bedeutung auf einen rein inneren Bußakt zu verengen.
- issue: Das „Haus“ und Gottes Name
  choice: „das Haus, das ich für deinen Namen gebaut habe“
  alternative: „der Tempel, den ich dir gebaut habe“
  rationale: 'Die wörtlichere Wendung bewahrt die biblische Spannung: Das Haus wird für Gottes Namen gebaut, ohne damit schlicht zu behaupten, Gott selbst sei räumlich darin eingeschlossen.'
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers bleibt als abhängiger Teil von Salomos längerem Konditionalsatz offen und endet daher mit einem Komma. Wiederholungen der Gebetsrichtung werden soweit nötig beibehalten; beim letzten Glied wird „in Richtung“ idiomatisch mitgedacht.
