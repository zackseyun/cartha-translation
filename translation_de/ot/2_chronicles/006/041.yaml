  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: de
  text: Und nun erhebe dich, Jahwe, Gott, zu deinem Ruheort, du und die Lade deiner Macht.[a] Deine Priester, Jahwe, Gott, sollen sich mit Rettung bekleiden, und deine Getreuen[b] sollen sich am Guten freuen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lade deiner Stärke“ beziehungsweise „die Lade deiner Kraft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Frommen“ beziehungsweise „deine Heiligen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sollen sich an deiner Güte freuen“. Im Hebräischen steht wörtlich nur „am Guten“ beziehungsweise „an der Güte“, ohne ausdrückliches Possessivpronomen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה קוּמָה
  choice: Und nun steh auf
  rationale: Bewahrt den Anschluss durch וְ, den zeitlich-folgernden Charakter von עַתָּה und den Gebetsimperativ von קוּמָה in natürlichem, würdigem Deutsch.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Gibt den Gottesnamen יְהוָה als „Jahwe“ wieder und wahrt die direkte Anrede mit אֱלֹהִים.
- source_word: לְנוּחֶךָ
  choice: komm zu deinem Ruheort
  rationale: Das Ziel der Bewegung wird im Deutschen durch „komm zu“ natürlich ausgedrückt; „Ruheort“ gibt sowohl Ruhe als auch den Gedanken eines bleibenden Ortes wieder. Das ergänzte Bewegungsverb macht die hebräische Zielangabe nach „steh auf“ idiomatisch verständlich.
- source_word: אֲרוֹן עֻזֶּךָ
  choice: die Lade deiner Macht
  rationale: Bewahrt die attributive Beziehung und gibt עֹז mit dem natürlichen und kontextgemäßen „Macht“ wieder; „Stärke“ und „Kraft“ bleiben mögliche Alternativen.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: sollen mit Rettung bekleidet sein
  rationale: Erhält das Kleidungsbild und den jussivischen Gebetscharakter. „Rettung“ bildet das Bedeutungsspektrum von תְּשׁוּעָה verständlich ab, ohne es auf Sieg oder geistliches Heil einzuengen.
- source_word: חֲסִידֶיךָ
  choice: deine Getreuen
  rationale: Bezeichnet Menschen, die durch Treue, Loyalität und Frömmigkeit gekennzeichnet sind, ohne spätere kirchliche Nebenbedeutungen von „Heilige“ einzutragen.
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: sollen sich am Guten freuen
  rationale: Gibt das substantivierte „Gute“ ohne einen im Hebräischen nicht ausdrücklich vorhandenen Possessivzusatz wieder und klingt zugleich natürlich auf Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בַטּוֹב
  choice: am Guten
  alternative: an deiner Güte
  rationale: Im Hebräischen steht kein ausdrücklicher Possessivsuffix. Die Übersetzung bewahrt diese Offenheit; der Zusammenhang erlaubt jedoch, das Gute als Gottes Güte zu verstehen.
- issue: Bedeutungsumfang von תְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ wahrt den konkreten wie theologischen Bedeutungsumfang, ohne die Aussage ausschließlich heilsgeschichtlich oder ausschließlich politisch-militärisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht liturgischem Ton. Die Gebetsform wird durch Imperativ und Soll-Sätze gewahrt. „Ruheort“ vermeidet die im heutigen Deutsch oft mit einem Grab verbundene Nebenbedeutung von „Ruhestätte“.
