  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: de
  text: Doch wird Gott wirklich bei den Menschen auf der Erde wohnen? Siehe, selbst der Himmel und der Himmel der Himmel können dich nicht fassen – wie viel weniger dieses Haus, das ich gebaut habe!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: wirklich
  rationale: Leitet eine staunende rhetorische Frage ein; „wirklich“ ist im modernen Deutschen natürlich und bewahrt den nachdrücklichen Sinn.
- source_word: יֵשֵׁב
  choice: wohnen
  rationale: Gibt hier den Sinn dauernder Gegenwart bzw. des Wohnens wieder, nicht das wörtliche Sitzen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der grammatische und sachliche Zusammenhang verlangt die singularische Bedeutung.
- source_word: אֶת הָאָדָם
  choice: bei den Menschen
  rationale: אֵת bezeichnet hier Gemeinschaft („bei/mit“); הָאָדָם meint die Menschheit kollektiv. „Bei den Menschen“ ist inklusiv, verständlich und bewahrt den Gegensatz zwischen Gott und den Menschen.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Natürliche locative Wiedergabe.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden, feierlichen Charakter des Gebets.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: der Himmel und der Himmel der Himmel
  rationale: Bewahrt die markante hebräische Steigerungsform, statt sie ausschließlich als „höchster Himmel“ auszulegen.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: können dich nicht fassen
  rationale: „Fassen“ bezeichnet hier die fehlende räumliche Kapazität und klingt im Deutschen natürlicher als „enthalten“.
- source_word: אַף כִּי
  choice: wie viel weniger
  rationale: Gibt den Schluss vom Größeren auf das Kleinere klar und würdig wieder.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: Bewahrt das konkrete hebräische Wort „Haus“ und damit das Tempel-Haus-Motiv.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: das ich gebaut habe
  rationale: Gibt die vollendete Handlung mit fortdauernder Relevanz im Deutschen natürlich wieder.
theological_decisions:
- issue: Bedeutung von הָאָדָם im Gegenüber zu Gott
  choice: bei den Menschen
  alternative: bei dem Menschen / bei der Menschheit
  rationale: Der Ausdruck bezeichnet den Menschen kollektiv beziehungsweise die Menschheit. Der deutsche Plural macht den umfassenden Bezug natürlich deutlich, ohne ihn auf einen einzelnen Mann einzuengen.
- issue: Transzendenz Gottes gegenüber dem Tempel
  choice: können dich nicht fassen
  alternative: können dich nicht enthalten
  rationale: Die Formulierung wahrt die Aussage, dass weder die Himmel noch der Tempel Gott räumlich umfassen können, ohne daraus eine weitergehende dogmatische Erklärung abzuleiten.
- issue: שְׁמֵי הַשָּׁמַיִם als hebräische Steigerungsform
  choice: Himmel der Himmel
  alternative: höchster Himmel
  rationale: Die formnahe Wiedergabe erhält sowohl das Bild als auch eine mögliche superlativische Lesart, statt die Wendung vollständig auf eine einzige Auslegung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die feierliche Gebetssprache bleiben erhalten; die Satzstruktur ist dennoch unmittelbar verständlich.
