base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: de
  text: Doch du sollst das Haus[a] nicht bauen, sondern dein Sohn, der von dir abstammt[b], wird das Haus für meinen Namen bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Tempel«. Hebräisch: »das Haus«, eine gebräuchliche Bezeichnung für den Tempel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der aus deinen Lenden hervorgehen wird«; eine Redewendung für einen direkten leiblichen Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Die Partikel schränkt die vorausgehende Zustimmung ein und setzt einen deutlichen Gegensatz; »Doch« gibt diese adversative Kraft natürlich wieder.
- source_word: תִבְנֶה הַבָּיִת
  choice: sollst das Haus nicht bauen
  rationale: Der Artikel bezeichnet das bestimmte Haus, hier den Tempel. »Haus« bewahrt den hebräischen Ausdruck; die Modalform passt zur göttlichen Festlegung im Kontext.
- source_word: כִּי
  choice: sondern
  rationale: Nach der Verneinung leitet כִּי die kontrastierende positive Aussage ein; im Deutschen ist »sondern« dafür die klare und idiomatische Entsprechung.
- source_word: בִנְךָ
  choice: dein Sohn
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der zweiten Person Singular.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: der aus deinem eigenen Leib hervorgehen wird
  rationale: Die Wendung bedeutet wörtlich das Hervorgehen aus den Lenden und bezeichnet einen direkten leiblichen Nachkommen. Die gewählte Form ist modern und wahrt die körperliche Abstammung.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen ist hervorgehoben. Die Wiederaufnahme durch »er« erhält diesen Nachdruck, auch wenn sie im Deutschen markiert klingt.
- source_word: יִבְנֶה הַבַּיִת
  choice: wird das Haus bauen
  rationale: Das Imperfekt bezeichnet hier die angekündigte künftige Handlung; die Wiederholung von »das Haus« erhält die Struktur des Ausgangstextes.
- source_word: לִשְׁמִי
  choice: für meinen Namen
  rationale: Die wörtlich-nahe Form bewahrt die theologisch bedeutsame Namensformel und bezeichnet die Widmung des Hauses an Gottes Namen.
theological_decisions:
- issue: Bezeichnung des Tempels
  choice: das Haus
  alternative: der Tempel
  rationale: Der hebräische Text sagt »das Haus«, eine geläufige Bezeichnung des Tempels. Die Übersetzung bewahrt diesen Sprachgebrauch und erklärt ihn in einer Fußnote.
- issue: Abstammungsformel
  choice: aus deinem eigenen Leib hervorgehen
  alternative: aus deinen Lenden hervorgehen
  rationale: Die Formulierung bezeichnet direkte körperliche Abstammung, ohne weitere Aussagen über die Art der Sohnschaft einzutragen.
- issue: Nachdruck auf dem Sohn
  choice: dein Sohn … er wird
  alternative: dein Sohn … wird
  rationale: Das ausdrücklich gesetzte הוּא wird durch die pronominale Wiederaufnahme sichtbar gemacht; so bleibt der Kontrast zwischen David und seinem Sohn erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wiederaufnahme »dein Sohn … er« bewahrt den Nachdruck des hebräischen selbstständigen Pronomens. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
