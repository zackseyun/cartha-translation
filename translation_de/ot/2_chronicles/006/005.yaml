  source_fidelity: 'Die Übersetzung bildet die hebräische Satzstruktur und die zentralen Aussagen zuverlässig ab: den seit dem Exodus gesetzten Zeitrahmen, die Wahl keiner Stadt aus den Stämmen Israels, den Bau eines „Hauses“ und das Sein des Namens Gottes dort sowie die Nichtwahl eines Mannes als נָגִיד über Israel. Die deutsche Perfektkonstruktion mit „Seit dem Tag“ gibt die fortwirkende Perspektive der hebräischen Perfekte angemessen wieder.'
