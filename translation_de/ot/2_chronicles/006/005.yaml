id: 2CH.6.5
reference: 2 Chronicles 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: de
  text: Seit dem Tag, an dem ich mein Volk aus dem Land Ägypten herausgeführt habe, habe ich aus keinem der Stämme Israels eine Stadt erwählt, um dort ein Haus zu bauen, damit mein Name dort sei[a]; und ich habe keinen Mann erwählt, der Fürst über mein Volk Israel sein sollte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ ist hier das Heiligtum gemeint. Wörtlich steht „Haus“; ebenso heißt es wörtlich „damit mein Name dort sei“, nicht „wohne“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Herrscher“ beziehungsweise „Anführer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Seit dem Tag, an dem
  rationale: Die Wendung bezeichnet den Ausgangspunkt eines bis zur Sprechgegenwart reichenden Zeitraums. „Seit“ gibt diese fortdauernde zeitliche Beziehung im Deutschen natürlich wieder.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: ich mein Volk aus dem Land Ägypten herausgeführt habe
  rationale: Der Hifil von יצא ist kausativ. „Herausgeführt“ bewahrt sowohl den Exodusbezug als auch die räumliche Bewegung aus Ägypten.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: habe ich aus keinem der Stämme Israels eine Stadt erwählt
  rationale: Im negierten Satz gibt „aus keinem“ die distributive Bedeutung von מִכֹּל klar wieder; ב bei בחר kennzeichnet das Erwählte. „Erwählt“ entspricht dem würdevollen biblischen Kontext, ohne veraltet zu wirken.
- source_word: לִבְנוֹת בַּיִת
  choice: um dort ein Haus zu bauen
  rationale: בַּיִת bedeutet wörtlich „Haus“. Der Ortsbezug „dort“ ist im Deutschen zur eindeutigen Verknüpfung mit der erwählten Stadt ergänzt, ohne den Sinn zu verändern.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: damit mein Name dort sei
  rationale: Die Übersetzung wahrt das schlichte Verb היה („sein“) und vermeidet die interpretierende Erweiterung „wohnen“. So bleibt die Aussage über Gottes Namen bewusst in ihrer eigenen theologischen Sprachform stehen.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: und ich habe keinen Mann erwählt
  rationale: אִישׁ ist hier ein männlicher Singular und bezeichnet einen konkreten männlichen Herrscher; „Mann“ bewahrt diese Form.
- source_word: נָגִיד
  choice: Fürst
  rationale: נָגִיד bezeichnet einen von Gott eingesetzten Menschen in leitender Herrschaftsstellung. „Fürst“ bewahrt den besonderen herrschaftlichen Titel; mögliche Wiedergaben sind auch „Herrscher“ oder „Anführer“.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: „Über“ bewahrt das Autoritätsverhältnis, während „mein Volk Israel“ die Bundesbezeichnung in natürlicher deutscher Wortfolge wiedergibt.
theological_decisions:
- issue: Terminologie für das Heiligtum und die Gegenwart des göttlichen Namens
  choice: „Haus“ und „damit mein Name dort sei“
  alternative: „Tempel“ und „damit mein Name dort wohne“
  rationale: Der hebräische Text verwendet das gewöhnliche Wort „Haus“ sowie das Verb „sein“. Die gewählte Fassung bewahrt die Spannung der Namenstheologie, statt sie durch eine ausdrückliche Aussage über das Wohnen der göttlichen Gegenwart auszulegen.
- issue: Wiedergabe von אִישׁ
  choice: „Mann“
  alternative: „Mensch“ oder „jemand“
  rationale: Der männliche Singular passt zum historischen Bezug auf einen männlichen Regenten und sollte nicht ohne textlichen Grund neutralisiert werden.
- issue: Amtsbezeichnung נָגִיד
  choice: „Fürst“
  alternative: „Herrscher“ oder „Anführer“
  rationale: „Fürst“ hält den Charakter eines besonders eingesetzten Regenten offen, ohne den Begriff auf eine bestimmte spätere Staats- oder Amtslehre festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seit-Konstruktion mit Perfekt bildet den vom damaligen Zeitpunkt bis zur Gegenwart reichenden Sinn natürlich ab. „Haus“ und die ungewohntere Formulierung „mein Name dort sei“ wurden bewusst beibehalten, um die hebräische Ausdrucksweise und ihre theologische Offenheit zu wahren.
