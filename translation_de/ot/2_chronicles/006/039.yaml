base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: de
  text: Dann höre vom Himmel her, von dem Ort, an dem du wohnst, ihr Gebet und ihr Flehen. Verhilf ihnen zu ihrem Recht[a] und vergib deinem Volk, das gegen dich gesündigt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Führe ihren Rechtsfall« oder »Übe Recht für sie.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: Dann höre
  rationale: Das Qal Perfekt 2. Person maskulin Singular steht im Gebetszusammenhang als Bitte an Gott. „Dann“ nimmt die vorausgehende Bedingungsfolge auf.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Der formal plurale hebräische Ausdruck bezeichnet idiomatisch den Himmel; „her“ verdeutlicht die Richtung des Hörens.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: von dem Ort, an dem du wohnst
  rationale: מָכוֹן bezeichnet einen festen Ort, שִׁבְתְּךָ Gottes Wohnen. Die Formulierung gibt beide Elemente natürlich wieder.
- source_word: תְּפִלָּתָם
  choice: ihr Gebet
  rationale: Der kollektive Singular des hebräischen Textes bleibt erhalten.
- source_word: תְּחִנֹּתֵיהֶם
  choice: ihr Flehen
  rationale: Das Wort bezeichnet inständige Bitten um Gnade und wird von „Gebet“ unterscheidbar wiedergegeben.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: Verhilf ihnen zu ihrem Recht
  rationale: Die wörtliche Wendung „ihren Rechtsfall/ihr Recht tun“ meint, ihren Fall gerecht zu behandeln beziehungsweise ihnen Recht zu verschaffen. Die deutsche Formulierung bewahrt den forensischen Sinn, ohne unverständlich zu wirken.
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: und vergib deinem Volk
  rationale: סלח bezeichnet in diesem Zusammenhang Gottes Vergebung; der Dativ entspricht der natürlichen deutschen Rektion von „vergeben“.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: das gegen dich gesündigt hat
  rationale: לְ bei חטא bezeichnet hier die gegen Gott gerichtete Verfehlung. Der Singular „das“ nimmt das Kollektiv „Volk“ grammatisch auf.
theological_decisions:
- issue: Gerichtliche Bedeutung von מִשְׁפָּטָם
  choice: Verhilf ihnen zu ihrem Recht
  alternative: Führe ihren Rechtsfall; übe Recht für sie; verschaffe ihnen Recht
  rationale: Die Wendung bittet Gott um gerechtes Handeln in der Sache seines Volkes. Sie wird weder auf Verurteilung noch ausschließlich auf Rechtfertigung verengt; der rechtliche Charakter bleibt erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bitte wird direkt und verständlich formuliert; der kollektive Singular bei „Gebet“ und „Volk“ sowie die rechtliche Spannung von מִשְׁפָּט bleiben erhalten.
