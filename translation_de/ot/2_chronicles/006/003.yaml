  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עוֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: de
  text: Da wandte sich der König um und segnete die ganze Versammlung Israels, während die ganze Versammlung Israels stand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: wandte sich ... um
  rationale: Die Wendung bedeutet wörtlich, dass der König sein Gesicht wendet, beschreibt hier aber idiomatisch eine körperliche Kehrtwende. „Sich umwenden“ gibt den Vorgang im modernen Deutschen natürlich und genau wieder.
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: ברך bezeichnet hier den Segen, den der König der versammelten Gemeinschaft zuspricht. „Segnete“ ist knapp, geläufig und sachlich passend.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: die ganze Versammlung Israels
  rationale: קהל bezeichnet die einberufene oder versammelte Gemeinschaft. „Versammlung“ ist im Deutschen verständlich und bewahrt den öffentlichen Charakter des Geschehens, ohne eine konfessionell geprägte Bezeichnung einzuführen.
- source_word: עוֹמֵד
  choice: dastand
  rationale: Das Partizip beschreibt die fortdauernde Haltung der Versammlung während des Segens. „Dastand“ vermittelt diesen begleitenden Zustand idiomatisch.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: während die ganze Versammlung Israels dastand
  rationale: Das וְ leitet hier sinnvoll einen Begleitumstand ein. „Während“ verdeutlicht diese Beziehung, ohne den Inhalt zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Hebräischen wiederholte Bezeichnung „die ganze Versammlung Israels“ bleibt erhalten. Die konkrete hebräische Wendung „sein Gesicht wenden“ wird idiomatisch als „sich umwenden“ wiedergegeben.
