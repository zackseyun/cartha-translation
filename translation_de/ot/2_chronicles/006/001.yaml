base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: de
  text: 'Da sagte Salomo: »Jahwe hat gesagt, er wolle im dichten Dunkel wohnen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der dunklen Wolke«. Das hebräische Wort kann eine dichte Wolke, düstere Finsternis oder tiefes Dunkel bezeichnen, besonders im Zusammenhang mit einer Erscheinung Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Kennzeichnet den nächsten Schritt im Erzählverlauf; „Da“ ist im modernen Deutschen knapp und natürlich.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: sagte Salomo
  rationale: Gibt die gewöhnliche Redeeinleitung direkt und ohne zusätzliche Deutung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Bewahrt den im Hebräischen stehenden Gottesnamen in seiner im Deutschen üblichen Form, statt ihn durch einen Titel zu ersetzen.
- source_word: אָמַר
  choice: hat gesagt
  rationale: Das Perfekt gibt die vorangegangene, für Salomos Aussage weiterhin maßgebliche Äußerung Jahwes idiomatisch wieder.
- source_word: לִשְׁכּוֹן
  choice: er wolle ... wohnen
  rationale: Der Infinitiv mit ל bezeichnet hier den Inhalt der vorausgesetzten göttlichen Aussage. Der Konjunktiv I kennzeichnet im Deutschen die indirekte Rede; „wohnen“ wahrt den Gedanken göttlicher Gegenwart.
- source_word: בָּעֲרָפֶל
  choice: im tiefen Dunkel
  rationale: Gibt die Vorstellung undurchdringlicher Dunkelheit natürlich wieder und wahrt zugleich die mit göttlicher Erscheinung verbundene Verborgenheit; die mögliche Wolkenbedeutung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die Übersetzung bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildgehalt von עֲרָפֶל bei der göttlichen Gegenwart
  choice: im tiefen Dunkel
  alternative: in der dunklen Wolke
  rationale: „Tiefes Dunkel“ bewahrt die Spannung zwischen Gottes Gegenwart und seiner Verborgenheit. Da das hebräische Wort auch eine dichte, dunkle Wolke bezeichnen kann, wird diese Lesart nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig, der Konjunktiv I markiert indirekte Rede, und „wohnen“ erhält die theologische Aussage von Gottes Gegenwart ohne konfessionelle Zusatzdeutung.
