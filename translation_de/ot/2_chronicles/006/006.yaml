source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: de
  text: Doch ich habe Jerusalem erwählt, damit mein Name dort sei[a], und ich habe David erwählt, damit er über meinem Volk Israel stehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch ich erwählte Jerusalem, damit mein Name dort sei, und ich erwählte David …“ Die hebräischen Verbformen können als einfache Vergangenheit wiedergegeben werden. Das Perfekt im Haupttext hebt hervor, dass Gottes getroffene Wahl weiterhin gilt.'
    reason: lexikalische und aspektuelle Übersetzungsalternative
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: ich habe … erwählt
  rationale: בחר bezeichnet das Auswählen oder Erwählen. Das deutsche Perfekt gibt hier natürlich eine vollzogene Wahl mit fortdauernder Geltung wieder; beide Vorkommen werden parallel übersetzt.
- source_word: בִּירוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: לִהְיוֹת
  choice: damit … sei / damit er … stehe
  rationale: Der Infinitiv von היה drückt hier Zweck oder Ergebnis aus. Die beiden kontextgemäßen deutschen Formulierungen bewahren diese Funktion, ohne den Satz unnötig zu verholzen.
- source_word: שְׁמִי
  choice: mein Name
  rationale: Die wörtliche Wendung wird bewahrt. Im Zusammenhang mit dem Tempel trägt sie theologische Bedeutung, die nicht durch eine erklärende Paraphrase vorweggenommen werden soll.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird ausdrücklich wiedergegeben und erhält die räumliche Betonung des Hebräischen.
- source_word: בְּדָוִיד
  choice: David
  rationale: Die Präposition ב nach בחר gehört zur hebräischen Rektion; idiomatisches Deutsch verwendet bei „erwählen“ hier keine entsprechende Präposition.
- source_word: עַל
  choice: über meinem Volk … stehe
  rationale: עַל bezeichnet Davids Stellung und Autorität über dem Volk. „über … stehen“ bleibt nahe am Wortlaut und ergänzt weder „König“ noch ausdrücklich „herrschen“.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: Die covenantale Bezeichnung und der appositionelle Eigenname werden knapp und natürlich beibehalten.
- source_word: וָ־
  choice: Doch / und
  rationale: Am Versanfang bringt „Doch“ den Gegensatz zur vorhergehenden Verneinung zum Ausdruck; zwischen den beiden positiven Aussagen entspricht „und“ der natürlichen Satzverknüpfung.
theological_decisions:
- issue: Tempeltheologie in der Wendung „damit mein Name dort sei“
  choice: Die Rede vom dort seienden Namen Gottes bleibt im Haupttext erhalten.
  alternative: „damit meine Gegenwart dort sei“ oder „als den Ort, an dem ich verehrt werde“
  rationale: Der hebräische Text spricht bewusst vom Namen Gottes. Eine Auflösung in „Gegenwart“ oder „Verehrung“ würde eine theologische Deutung in den Wortlaut eintragen und die biblische Ausdrucksweise verengen.
- issue: Davids Stellung „über“ Israel
  choice: „damit er über meinem Volk Israel stehe“
  alternative: „damit er König über mein Volk Israel sei“ oder „damit er über mein Volk Israel herrsche“
  rationale: Der Kontext betrifft das Königtum, doch der Vers selbst nennt weder das Wort „König“ noch ein ausdrückliches Verb für „herrschen“. Die gewählte Formulierung bewahrt die allgemeinere Aussage von Autorität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erwählen“ und der Konjunktiv „sei/stehe“ bewahren den feierlichen Charakter der göttlichen Rede, bleiben aber allgemein verständlich. Die Parallelität der beiden Erwählungsaussagen und die Spannung der hebräischen Namenstheologie werden erhalten.
