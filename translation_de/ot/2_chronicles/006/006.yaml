  source_fidelity: Der Entwurf gibt die beiden parallelen hebräischen Erwählungsaussagen sachgerecht wieder. „Doch“ bildet den Kontrast zu V. 5 angemessen ab. „damit mein Name dort sei“ bewahrt die hebräische Namensformel einschließlich des Lokaladverbs, ohne sie theologisch zu paraphrasieren. „damit er über meinem Volk Israel stehe“ entspricht לִהְיוֹת עַל und lässt die im Hebräischen nicht ausdrücklich genannte Königstitulatur unergänzt. Das Perfekt „ich habe ... erwählt“ ist im Kontext einer fortgeltenden göttlichen Erwählung vertretbar; die Fußnote dokumentiert die mögliche Präteritumswiedergabe.
