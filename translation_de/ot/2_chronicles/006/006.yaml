  terminology: „erwählt“, „mein Name“, „mein Volk Israel“ und „über ... stehen“ sind terminologisch treffend. Insbesondere wird die theologisch gewichtige, aber im Text selbst nicht erläuterte Wendung vom Namen Gottes weder abgeschwächt noch ausgelegt.
