revisions:
- from: 'Und er sagte: »Yahweh, Gott Israels, keinen Gott gibt es wie dich im Himmel oder auf der Erde. Du bewahrst den Bund und die beständige Liebe[a] für deine Diener, die mit ganzem Herzen vor dir leben.«'
  to: 'Und er sagte: »Yahweh, Gott Israels, keinen Gott gibt es wie dich im Himmel oder auf der Erde, der den Bund hält und deinen Dienern beständige Liebe[a] erweist, die mit ganzem Herzen vor dir wandeln.«'
  rationale: 'Die Revision beseitigt die unidiomatische deutsche Verknüpfung „Liebe bewahren“, ohne den Sinn von שֹׁמֵר הַבְּרִית וְהַחֶסֶד einzuschränken: Gottes fortdauerndes Halten des Bundes und seine gegenüber den Dienern erwiesene beständige Liebe werden ausdrücklich wiedergegeben. „Wandeln“ erhält die hebräische Metapher von treuem Lebenswandel vor Gott. Der Fußnotenanker bleibt unmittelbar bei der mehrdeutigen Wiedergabe von חֶסֶד.'
