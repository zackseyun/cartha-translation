  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: de
  text: 'Und er sagte: »Yahweh, Gott Israels, keinen Gott gibt es wie dich im Himmel oder auf der Erde, der den Bund hält und deinen Dienern beständige Liebe[a] erweist, die mit ganzem Herzen vor dir wandeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bundestreue«.'
    reason: Lexikalische Alternative für חֶסֶד im ausdrücklichen Bundeszusammenhang.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Das narrative Wayyiqtol führt Salomos Gebet ein; die schlichte Wiedergabe erhält den hebräischen Erzählfluss.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Natürliche deutsche Wiedergabe der Status-constructus-Verbindung.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: keinen Gott gibt es wie dich
  rationale: Bewahrt die Aussage von Yahwehs Unvergleichlichkeit und klingt im Deutschen innerhalb der Anrede natürlich.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: im Himmel oder auf der Erde
  rationale: In der verneinten Vergleichsaussage gibt „oder“ den umfassenden Sinn der hebräischen Paarformel idiomatisch wieder.
- source_word: שֹׁמֵר
  choice: Du bewahrst
  rationale: Das Partizip bezeichnet Gottes kennzeichnendes, fortdauerndes Handeln; ein selbstständiger deutscher Satz ist klar und würdig.
- source_word: הַבְּרִית
  choice: den Bund
  rationale: „Bund“ ist die etablierte und sachlich genaue Wiedergabe von בְּרִית.
- source_word: וְהַחֶסֶד
  choice: und die beständige Liebe
  rationale: „Beständige Liebe“ hält Zuneigung und verlässliche, bundestreue Zuwendung zusammen, ohne den Bedeutungsreichtum auf einen technischen Begriff zu verengen.
- source_word: לַעֲבָדֶיךָ
  choice: für deine Diener
  rationale: Die Präposition bezeichnet hier die Empfänger beziehungsweise Begünstigten von Gottes Bundestreue.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: die … vor dir leben
  rationale: „Vor dir leben“ gibt die hebräische Wegmetapher in verständlichem Deutsch wieder und bewahrt den Gedanken eines Lebens in Gottes Gegenwart.
- source_word: בְּכָל לִבָּם
  choice: mit ganzem Herzen
  rationale: Die deutsche Wendung drückt die im Hebräischen gemeinte ungeteilte Hingabe natürlich aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; die Transliteration bewahrt den persönlichen Bundesnamen.
- issue: Bedeutungsumfang von חֶסֶד im Zusammenhang mit dem Bund
  choice: beständige Liebe
  alternative: Bundestreue; Güte; Barmherzigkeit
  rationale: Die gewählte Formulierung lässt sowohl liebevolle Zuwendung als auch dauerhafte Loyalität erkennen. Die Fußnote nennt die stärker bundestheologisch zugespitzte Möglichkeit, ohne sie in den Haupttext einzutragen.
- issue: אֱלֹהִים in der Unvergleichlichkeitsaussage
  choice: keinen Gott gibt es wie dich
  alternative: unter den Göttern gibt es keinen wie dich
  rationale: Die Syntax erlaubt eine Aussage über keinen vergleichbaren Gott, ohne dass der Vers hier ausdrücklich über den ontologischen Status anderer Götter entscheidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt schlicht; die ungewöhnlichere Bundesformulierung wird bewusst nahe am Hebräischen gehalten. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wendung.
