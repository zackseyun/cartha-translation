  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: de
  text: Du hast gehalten, was du deinem Diener David, meinem Vater, zugesagt hast[a]. Mit deinem Mund hast du es ausgesprochen, und mit deiner Hand hast du es erfüllt[b], wie es heute zu sehen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »was du zu ihm geredet hast«; aus dem Zusammenhang ergibt sich der Sinn einer Zusage.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit deinem Mund … und mit deiner Hand«; die hebräische Bildsprache stellt Gottes gesprochenes Wort seinem wirksamen Handeln gegenüber.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: hast ... gehalten
  rationale: In diesem Zusage- und Erfüllungszusammenhang bedeutet שׁמר, einer Zusage treu zu bleiben und sie einzuhalten. Die deutsche Wendung „jemandem halten, was man zugesagt hat“ gibt dies natürlich wieder.
- source_word: לְעַבְדְּךָ
  choice: deinem Diener
  rationale: ל bezeichnet hier den Empfänger, dem gegenüber die Zusage eingehalten wurde. „Diener“ entspricht dem königlichen Gebetsstil und stellt nicht den rechtlichen Sklavenstatus in den Vordergrund.
- source_word: דָּוִיד אָבִי
  choice: David, meinem Vater
  rationale: Die Apposition bewahrt die hebräische Reihenfolge und ist in modernem Deutsch klar.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: was du ihm zugesagt hast
  rationale: Wörtlich steht „was du zu ihm geredet hast“. Der folgende Erfüllungssatz zeigt, dass das Gesagte Zusagecharakter hat; „zugesagt“ macht diesen im Deutschen notwendigen Zusammenhang deutlich, ohne den Inhalt näher festzulegen.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Mit deinem Mund hast du es ausgesprochen
  rationale: Die konkrete Rede vom Mund bleibt erhalten und bildet das beabsichtigte Gegenstück zur Hand. „Ausgesprochen“ ist im Deutschen natürlicher als „mit deinem Mund geredet“.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: und mit deiner Hand hast du es erfüllt
  rationale: מלא bezeichnet hier das vollständige Ausführen beziehungsweise Erfüllen. „Mit deiner Hand“ bewahrt das Bild wirksamen göttlichen Handelns.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute zu sehen ist
  rationale: Die feste Wendung verweist auf die gegenwärtig erkennbare Erfüllung. Diese Wiedergabe ist in modernem Deutsch klarer als das wörtliche „wie an diesem Tag“.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes „Mund“ und „Hand“
  choice: Beide Bilder im Haupttext bewahren
  alternative: Dynamisch mit „du hast es gesagt und vollbracht“ wiedergeben
  rationale: Die Gegenüberstellung von gesprochenem Wort und wirksamer Tat prägt die Aussage des Verses. Die bildhafte Sprache wird beibehalten, ohne über die Formulierung des Ausgangstextes hinaus eine Aussage über Gottes Körperlichkeit zu machen.
- issue: Zusagecharakter von דִּבַּרְתָּ
  choice: Im Haupttext „zugesagt“ verwenden und die wörtliche Bedeutung in einer Fußnote nennen
  alternative: Im Haupttext formal „zu ihm geredet“ oder „ihm gesagt“ wiedergeben
  rationale: Der Erfüllungskontext verleiht dem Verb hier klaren Zusagecharakter. Die Fußnote wahrt zugleich die lexikalische Transparenz und die mögliche Spannung zwischen Rede und Verheißung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut vorlesbar; die zentralen hebräischen Bilder „Mund“ und „Hand“ werden bewahrt. Die idiomatische Schlussformel wird verständlich als gegenwärtig sichtbare Erfüllung wiedergegeben.
