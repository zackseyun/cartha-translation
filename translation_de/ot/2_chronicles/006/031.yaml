source:
  edition: WLC
  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: de
  text: damit sie dich fürchten[a] und auf deinen Wegen gehen, solange sie in dem Land leben, das du unseren Vätern gegeben hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht vor dir haben“. Das hebräische Wort für „fürchten“ schließt hier ehrfürchtigen Gehorsam ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „alle Tage, die sie auf der Oberfläche des Landes leben“.'
    reason: literal_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die beabsichtigte Folge ein und ist im modernen Deutsch natürlich.
- source_word: יִירָאוּךָ
  choice: sie dich fürchten
  rationale: 'Bewahrt die breite biblische Bedeutung von ירא: Gottesfurcht, die Ehrfurcht und Gehorsam einschließt, ohne sie auf bloße Angst zu verengen.'
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: und auf deinen Wegen gehen
  rationale: Gibt das hebräische Bild verständlich wieder. Der Infinitiv bezeichnet hier das mit der Gottesfurcht verbundene Verhalten; die Beiordnung klingt im Deutschen natürlich und lässt den Zusammenhang offen.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: solange sie … leben
  rationale: Vermittelt die gesamte Lebensdauer idiomatisch; die wörtlichere Formulierung ‚alle Tage, die sie leben‘ wäre im heutigen Deutsch schwerfällig.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: in dem Land
  rationale: Im Kontext ist das den Vorfahren gegebene Land gemeint. Die hebräische Wendung ‚auf der Oberfläche des Landes‘ ist idiomatisch und muss im Deutschen nicht nachgebildet werden.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: das du unseren Vätern gegeben hast
  rationale: Bewahrt die Bundes- und Verheißungsbeziehung zu Israels Vorfahren; das Perfekt ist im Deutschen für die fortwirkende Gabe angemessen.
theological_decisions:
- issue: Bedeutung der Gottesfurcht im Verhältnis zum Gehorsam
  choice: „dich fürchten“ im Haupttext; Ehrfurcht und Gehorsam werden durch den folgenden Weg-Gedanken mitgetragen
  alternative: „dich verehren“ oder „Ehrfurcht vor dir haben“
  rationale: „Fürchten“ erhält das theologische Gewicht und den Bedeutungsumfang von ירא. Die Fortsetzung macht deutlich, dass nicht nur Schrecken, sondern eine das Leben prägende Ehrfurcht gemeint ist.
- issue: Bezug von הָאֲדָמָה
  choice: „das Land“
  alternative: „die Erde“ oder „der Erdboden“
  rationale: Der Relativsatz bezeichnet es als das den Vätern gegebene Gebiet; daher ist das verheißene Land und nicht die gesamte Erde gemeint.
- issue: Verhältnis von Gottesfurcht und Gehen auf Gottes Wegen
  choice: mit „und“ beigeordnet
  alternative: „indem sie auf deinen Wegen gehen“ oder „um auf deinen Wegen zu gehen“
  rationale: Der hebräische Infinitiv kann die praktische Ausgestaltung beziehungsweise Folge der Gottesfurcht ausdrücken. Die Beiordnung ist natürlich und vermeidet eine unnötig enge Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „auf deinen Wegen gehen“ bleibt wegen ihrer Verständlichkeit und des hebräischen Leitbilds erhalten; „unseren Vätern“ wahrt den historischen Bundesbezug.
