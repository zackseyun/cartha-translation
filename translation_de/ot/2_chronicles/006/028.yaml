source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: de
  text: Wenn im Land eine Hungersnot ausbricht, wenn eine Seuche, Getreidebrand oder Vergilbung auftritt, wenn Heuschrecken oder andere gefräßige Insekten[a] einfallen, wenn seine Feinde ihn im Land seiner Tore[b] bedrängen – welche Plage oder Krankheit es auch sei –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet ein erntevernichtendes Insekt; die genaue Art ist unsicher. Möglich ist auch: »Fressheuschrecken«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Land seiner Tore«. Mit den Toren sind die befestigten Städte oder Ortschaften des Landes gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: Hungersnot
  rationale: Im Zusammenhang einer landesweiten Katastrophe bezeichnet das Wort nicht gewöhnlichen Hunger, sondern eine Hungersnot.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Das Wort bezeichnet eine schwere, sich ausbreitende Krankheit; »Seuche« ist im modernen Deutschen klar und angemessen.
- source_word: שִׁדָּפוֹן
  choice: Getreidebrand
  rationale: Gemeint ist eine verheerende Schädigung der Feldfrüchte, möglicherweise durch sengenden Wind; »Getreidebrand« gibt den landwirtschaftlichen Zusammenhang prägnant wieder.
- source_word: יֵרָקוֹן
  choice: Vergilbung
  rationale: Das Wort beschreibt das Gelb- oder Bleichwerden von Pflanzen. »Vergilbung« wahrt diese konkrete Bedeutung, ohne eine bestimmte Pflanzenkrankheit vorauszusetzen.
- source_word: אַרְבֶּה
  choice: Heuschrecken
  rationale: In Katastrophenlisten bezeichnet das Wort Schwarmheuschrecken, die Ernten verwüsten.
- source_word: חָסִיל
  choice: andere gefräßige Insekten
  rationale: Die genaue zoologische Art ist unsicher; sicher ist vor allem die erntevernichtende Wirkung. Die Wiedergabe unterscheidet den Ausdruck von אַרְבֶּה, ohne eine unbelegte Artbestimmung vorzunehmen.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: wenn seine Feinde es … bedrängen
  rationale: Die Verbform bezeichnet feindliches Bedrängen oder Einschließen. Das Pronomen wird im Deutschen auf »das Land« bezogen, ohne den militärischen Sinn unnötig auf eine formale Belagerung einzelner Städte einzuengen.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: im Land seiner Tore
  rationale: Die ungewöhnliche hebräische Formulierung wird im Text bewahrt; »Tore« steht metonymisch für die befestigten Städte des Landes und wird in einer Fußnote erläutert.
- source_word: כָּל נֶגַע וְכָל מַחֲלָה
  choice: welche Plage oder Krankheit es auch sei
  rationale: Die umfassende Doppelformel wird idiomatisch wiedergegeben; נֶגַע ist die allgemeinere schwere Heimsuchung, מַחֲלָה die Krankheit.
theological_decisions:
- issue: Bezug der maskulinen Suffixe in »seine Feinde … seine Tore«
  choice: Im Deutschen wird das bedrängte Objekt als »das Land« ausgedrückt, während die possessive Form »seiner Tore« der hebräischen Bildsprache folgt.
  alternative: »wenn seine Feinde ihn im Land seiner Tore belagern«
  rationale: Der hebräische Text verwendet maskuline Suffixe, deren genauer Bezug innerhalb des isolierten Verses nicht ausdrücklich genannt wird. Die deutsche Fassung vermeidet ein unverständliches persönliches »ihn«, ohne die Metonymie der Tore aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Reihung und der offene Satzschluss des hebräischen Gebets werden bewahrt. Fachlich unsichere zoologische und pflanzenkundliche Bestimmungen werden nicht überpräzisiert; die ungewöhnliche Wendung »Land seiner Tore« bleibt aus Gründen der Textnähe stehen und wird erläutert.
