- from: Wenn sie gegen dich sündigen – denn es gibt keinen Menschen, der nicht sündigt – und du über sie zornig wirst, sie einem Feind preisgibst und ihre Bezwinger sie gefangen in ein fernes oder nahes Land führen,
  to: Wenn sie gegen dich sündigen – denn es gibt keinen Menschen, der nicht sündigt – und du über sie zornig wirst, sie einem Feind preisgibst und ihre Gefangennehmer sie in ein fernes oder nahes Land wegführen,
  rationale: Die Übersetzung wird nur bei der Bezeichnung der Akteure von וְשָׁבוּם שׁוֹבֵיהֶם und bei der deutschen Satzflüssigkeit angepasst. „Gefangennehmer“ bewahrt die spezifische Bedeutung des hebräischen Partizips; „wegführen“ macht die Deportation deutlich. Die parataktische hebräische Abfolge, die generische Aussage über den Menschen und die syntaktische Offenheit zum folgenden Vers bleiben erhalten.
