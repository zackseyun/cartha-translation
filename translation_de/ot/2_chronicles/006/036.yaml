  - severity: low
    issue: Wortstellung „ihre Bezwinger sie gefangen in ein fernes oder nahes Land führen“
    rationale: Die Wortgruppe „sie gefangen ... führen“ klingt im modernen Standarddeutsch schwerfällig. „sie ... wegführen“ ist natürlicher und die Gefangenschaft wird bereits durch „Gefangennehmer“ klar bezeichnet.
