  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: de
  text: Wenn sie gegen dich sündigen – denn es gibt keinen Menschen, der nicht sündigt – und du über sie zornig wirst, sie einem Feind preisgibst und ihre Gefangennehmer sie in ein fernes oder nahes Land wegführen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Wenn sie gegen dich sündigen
  rationale: Das einleitende כִּי bezeichnet hier im Gebetszusammenhang einen erwartbaren Fall; „wenn“ ist natürlich und wird durch die folgende Aussage über die allgemeine Sündhaftigkeit gestützt. חטא mit ל bezeichnet eine gegen jemanden gerichtete Sünde.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: denn es gibt keinen Menschen, der nicht sündigt
  rationale: אָדָם bezeichnet hier den Menschen allgemein. „Keinen Menschen“ bewahrt den generischen Singular und klingt im modernen Deutschen natürlich, ohne die Aussage auf Männer zu beschränken.
- source_word: וְאָנַפְתָּ בָם
  choice: und du über sie zornig wirst
  rationale: אנף bezeichnet das Entbrennen beziehungsweise Vorhandensein von Zorn. „Über sie zornig werden“ gibt die Zustandsänderung und den Bezug idiomatisch wieder.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: sie einem Feind preisgibst
  rationale: נתן לפני אויב meint, jemanden in die Gewalt eines Feindes zu geben. „Preisgeben“ drückt diese Auslieferung knapp und idiomatisch aus; אוֹיֵב ist singularisch und unbestimmt.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: und ihre Bezwinger sie gefangen führen
  rationale: Die figura etymologica aus שׁבה und dem zugehörigen Partizip bezeichnet Gefangennahme und Wegführung. „Bezwinger“ vermeidet im Deutschen die schwerfällige Wiederholung von „gefangen“ bei „Gefangennehmer“, während „gefangen führen“ die Deportation ausdrückt.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: in ein fernes oder nahes Land
  rationale: Die knappe Gegenüberstellung von רְחוֹקָה und קְרוֹבָה wird direkt als „fern oder nah“ bewahrt.
theological_decisions:
- issue: Generisches אָדָם in der Aussage über die allgemeine menschliche Sündhaftigkeit
  choice: keinen Menschen, der nicht sündigt
  alternative: niemanden, der nicht sündigt
  rationale: „Mensch“ entspricht dem generischen אָדָם und erhält die konkrete anthropologische Ausdrucksweise, ohne im Deutschen eine geschlechtliche Einschränkung nahezulegen.
- issue: Zusammenhang von menschlicher Sünde, Gottes Zorn und Auslieferung an den Feind
  choice: parataktische Abfolge mit „und“
  alternative: kausale oder finale Verdeutlichung, etwa „sodass“
  rationale: Der hebräische Text reiht die Handlungen mit וְ aneinander. Die Übersetzung fügt keine ausdrücklich nicht markierte Zweck- oder Folgerelation hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Nebensatz offen, weil Vers 36 syntaktisch in den folgenden Versen fortgeführt wird. Gedankenstriche kennzeichnen die begründende Einschaltung.
