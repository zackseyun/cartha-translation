source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: de
  text: Dann höre du vom Himmel her, von der Stätte, an der du wohnst, und handle nach allem, worum der Fremde dich bittet. So sollen alle Völker der Erde deinen Namen kennen und dich fürchten, wie dein Volk Israel es tut. Sie sollen erkennen, dass dein Name über diesem Haus, das ich gebaut habe, genannt worden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „dass dieses Haus deinen Namen trägt“. Wörtlich heißt es im Hebräischen: „dass dein Name über diesem Haus genannt worden ist“.'
    reason: lexikalische Alternative und Erklärung einer hebräischen Wendung
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: höre du vom Himmel her
  rationale: שׁמע bezeichnet im Gebetszusammenhang ein aufmerksames Hören, das auf Antwort zielt. Das betonte „du“ gibt das ausdrücklich gesetzte hebräische Pronomen wieder; „vom Himmel her“ entspricht im Deutschen natürlich dem räumlichen Ausgangspunkt.
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: von der Stätte, an der du wohnst
  rationale: מכון bezeichnet einen festen, bestimmten Ort. „Stätte“ wahrt den würdevollen Ton, während der Relativsatz die Wendung in verständliches modernes Deutsch überträgt.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: und handle ganz so, wie … dich bittet
  rationale: עשה bleibt mit „handle“ bewusst weit gefasst. קרא אל bezeichnet hier das an Gott gerichtete Rufen im Gebet; „bittet“ macht den kontextuell klaren Bittcharakter natürlich verständlich, ohne eine bestimmte Art der Erhörung festzulegen.
- source_word: הַנָּכְרִי
  choice: der Fremde
  rationale: נכרי bezeichnet hier einen Menschen, der nicht zu Israel gehört. „Der Fremde“ ist knapp, verständlich und vermeidet die moderne verwaltungsrechtliche Färbung von „Ausländer“.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: Der universale Zusammenhang spricht für „Erde“ statt für ein bestimmtes Land; der Plural „Völker“ bewahrt die verschiedenen Volksgemeinschaften.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: und dich fürchten
  rationale: ירא umfasst gegenüber Gott ehrfürchtige Furcht. „Fürchten“ bewahrt die biblische Spannung und schwächt sie nicht zu bloßer Verehrung ab.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: dass dein Name über diesem Haus … ausgerufen ist
  rationale: Die Formulierung hält das hebräische Bild fest, nach dem Gottes Name über dem Haus ausgerufen beziehungsweise genannt ist. Eine idiomatischere Deutung wird in der Fußnote angeboten, nicht stillschweigend in den Text eingesetzt.
theological_decisions:
- issue: Gottes Wohnort und das Verhältnis zwischen Himmel und Tempel
  choice: Die Aussage „vom Himmel her, von der Stätte, an der du wohnst“ bleibt erhalten, während der Tempel als das Haus bezeichnet wird, über dem Gottes Name ausgerufen ist.
  alternative: Die räumliche Sprache als „aus deiner himmlischen Gegenwart“ zu umschreiben.
  rationale: Der Vers unterscheidet selbst zwischen Gottes himmlischer Wohnstätte und dem irdischen Haus. Die Übersetzung bewahrt diese Unterscheidung, ohne zusätzliche Aussagen darüber einzuführen, wie Gottes Gegenwart räumlich zu verstehen ist.
- issue: Die Gottesfurcht der Völker
  choice: „dich fürchten“
  alternative: „dich verehren“ oder „Ehrfurcht vor dir haben“
  rationale: „Fürchten“ erhält die volle Bedeutungsbreite und theologische Spannung des hebräischen ירא; eine mildere Umschreibung würde den Ausdruck vorab deuten.
- issue: Die Namensformel über dem Tempel
  choice: Das hebräische Bild wird im Haupttext als Ausrufen des Namens über dem Haus wiedergegeben.
  alternative: 'Direkt zu formulieren: „dass dieses Haus deinen Namen trägt“.'
  rationale: Die bildhafte, theologisch gewichtige Rede vom göttlichen Namen soll nicht vollständig in eine moderne Besitz- oder Benennungsformel aufgelöst werden. Die verständlichere Deutung steht als Fußnote bereit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem langen hebräischen Satz in drei Sätze gegliedert, ohne die Zweckbeziehungen aufzulösen. „So sollen“ gibt die mit לְמַעַן und den folgenden Infinitiven ausgedrückte Zielsetzung wieder. Die altertümliche Form „Hause“ wurde vermieden; die ungewöhnliche Namensformel bleibt bewusst sichtbar und wird durch eine Fußnote erläutert.
