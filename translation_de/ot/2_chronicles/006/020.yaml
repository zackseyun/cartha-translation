base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: de
  text: damit deine Augen Tag und Nacht[a] offen auf dieses Haus gerichtet seien, auf den Ort, von dem du gesagt hast, dass du deinen Namen dort setzen willst[b], und damit du das Gebet hörst, das dein Diener zu diesem Ort hin betet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „damit deine Augen Tag und Nacht zu diesem Haus hin offen seien“; dies ist ein Bild für wachsame Aufmerksamkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deinen Namen dort setzen“. Die Wendung ist ein Tempelidiom für Gottes erwählte Verbindung mit diesem Ort; sie besagt nicht, dass Gott räumlich auf den Tempel begrenzt wäre.'
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: damit deine Augen … auf … gerichtet seien
  rationale: Der Infinitiv führt im Zusammenhang den Inhalt der Bitte fort. Die konkrete Rede von Gottes Augen bleibt erhalten; „gerichtet seien“ gibt das hebräische Bild geöffneter, einem Ziel zugewandter Augen im Deutschen natürlich wieder.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: auf dieses Haus
  rationale: אֶל bezeichnet hier die Ausrichtung der göttlichen Aufmerksamkeit. Mit „die Augen auf etwas gerichtet“ wird diese Richtung im Deutschen idiomatisch ausgedrückt.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die feste Wortverbindung bewahrt den Merismus und bezeichnet fortwährende Aufmerksamkeit.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: von dem du gesagt hast, dass du deinen Namen dort wohnen lassen willst
  rationale: לָשׂוּם bedeutet grundsätzlich „setzen, legen, anbringen“. Im Zusammenhang mit Gottes Namen an der erwählten Kultstätte gibt „wohnen lassen“ die etablierte Tempelvorstellung verständlich wieder, ohne Gott selbst räumlich im Gebäude einzuschließen; eine wörtlichere Alternative wird in der Fußnote genannt.
- source_word: לִשְׁמוֹעַ אֶל הַתְּפִלָּה
  choice: damit du auf das Gebet hörst
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise weiteren Inhalt der Bitte. „Auf das Gebet hören“ bewahrt die biblische Redeweise und klingt im Deutschen natürlich.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: das dein Diener … betet
  rationale: Das Imperfekt lässt sich in diesem Relativsatz als gegenwärtige beziehungsweise wiederholbare Handlung wiedergeben. „Diener“ entspricht der demütigen Selbstbezeichnung Salomos im Gebet.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: zu diesem Ort hin
  rationale: 'Die Richtungsbedeutung von אֶל wird ausdrücklich bewahrt: Gemeint ist ein Gebet, das auf den Tempelort ausgerichtet ist.'
theological_decisions:
- issue: Anthropomorphe Rede von Gottes offenen Augen
  choice: Das körperhafte Bild der Augen wird bewahrt und als „auf dieses Haus gerichtet“ formuliert.
  alternative: „Achte Tag und Nacht auf dieses Haus“ oder wörtlicher „deine Augen seien … offen zu diesem Haus hin“.
  rationale: So bleibt die Bildsprache göttlicher Aufmerksamkeit erkennbar, ohne durch eine rein abstrakte Umschreibung ersetzt zu werden.
- issue: Tempeltheologie in der Aussage über Gottes Namen
  choice: „deinen Namen dort wohnen lassen“ im Haupttext, mit wörtlicherer Alternative in der Fußnote.
  alternative: „deinen Namen dort einzusetzen/anzubringen“.
  rationale: Die Formulierung bezeichnet Gottes erwählte Verbindung mit dem Ort. Sie darf weder als räumliche Einschließung Gottes noch bloß als Hinweis auf seinen Ruf verstanden werden; die Fußnote wahrt die lexikalische Spannweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängige Fortsetzung des vorausgehenden Gebets formuliert. Die anthropomorphe Bildsprache und die räumliche Ausrichtung des Gebets werden gewahrt; schwer verständliche Wörtlichkeit wird in den Fußnoten zugänglich gemacht.
