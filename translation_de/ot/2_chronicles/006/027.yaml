revisions:
- from: Dann höre du im Himmel[a] und vergib die Sünde deiner Knechte und deines Volkes Israel. Weise ihnen den guten Weg, auf dem sie gehen sollen, und lass Regen auf dein Land fallen, das du deinem Volk als Erbbesitz gegeben hast.
  to: Dann höre du im Himmel[a] und vergib die Sünde deiner Diener und deines Volkes Israel; denn du lehrst sie den guten Weg, auf dem sie gehen sollen. Lass Regen auf dein Land fallen, das du deinem Volk als Erbbesitz gegeben hast.
  rationale: 'Die Revision stellt die durch כִּי gekennzeichnete Aussagebeziehung wieder her: Gott „lehrt“ sein Volk den guten Weg, statt dass eine zusätzliche, im Hebräischen nicht ausdrücklich koordinierte Bitte formuliert wird. „Denn“ gibt die naheliegende begründende Lesart wieder; die Formulierung behauptet keine weitergehende dogmatische Deutung. „Diener“ modernisiert lediglich das Register.'
