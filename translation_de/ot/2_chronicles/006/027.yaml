  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: de
  text: Dann höre du im Himmel[a] und vergib die Sünde deiner Diener und deines Volkes Israel; denn du lehrst sie den guten Weg, auf dem sie gehen sollen. Lass Regen auf dein Land fallen, das du deinem Volk als Erbbesitz gegeben hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »höre vom Himmel her«. Wörtlich steht im Hebräischen ungewöhnlich: »höre den Himmel/die Himmel«; gemeint ist Gottes Hören in beziehungsweise aus seiner himmlischen Wohnstätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: höre du im Himmel
  rationale: Der hebräische Wortlaut lautet ungewöhnlich knapp »höre den Himmel/die Himmel« und ist im Zusammenhang als Hören Gottes in seiner himmlischen Wohnstätte zu verstehen. »Im Himmel« bewahrt die Ortsvorstellung; die mögliche Wiedergabe »vom Himmel her« wird in der Fußnote genannt.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: und vergib die Sünde
  rationale: חַטָּאת bezeichnet hier die Sünde beziehungsweise Schuld. »Die Sünde vergeben« ist direkt, verständlich und dem Gebetsstil angemessen.
- source_word: עֲבָדֶיךָ
  choice: deiner Knechte
  rationale: עֶבֶד bezeichnet hier Menschen in Gottes Dienst und unter seiner Herrschaft. »Knechte« wahrt den würdevollen biblischen Gebetsstil, ohne in diesem Zusammenhang primär einen rechtlichen Sklavenstatus hervorzuheben.
- source_word: כִּי תוֹרֵם אֶל־הַדֶּרֶךְ הַטּוֹבָה
  choice: Weise ihnen den guten Weg
  rationale: Der Hifil von ירה mit אֶל kann ein Unterweisen beziehungsweise Hinweisen auf einen Weg ausdrücken. Die koordinierte deutsche Bitte gibt den Zusammenhang von Vergebung, Führung und Regen natürlich wieder, ohne כִּי mit einer eindeutig kausalen Aussage zu überladen.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: auf dem sie gehen sollen
  rationale: Das Gehen auf einem Weg ist ein Bild für die Lebensführung; »sollen« bringt die im Kontext vorausgesetzte richtige Lebensweise zum Ausdruck.
- source_word: וְנָתַתָּה מָטָר עַל־אַרְצְךָ
  choice: und lass Regen auf dein Land fallen
  rationale: Wörtlich steht »gib Regen auf dein Land«. Die gewählte Formulierung ist im modernen Deutschen natürlich, bewahrt Gottes aktives Gewähren des Regens und behält das ausdrückliche »dein Land« bei.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet den von Gott zugewiesenen, bleibenden Besitz. »Erbbesitz« erhält diesen land- und bundestheologischen Sinn prägnant.
theological_decisions:
- issue: Verhältnis von göttlicher Vergebung, Unterweisung und Regen in der mit כִּי eingeleiteten Wendung
  choice: 'Die Unterweisung wird als weitere Bitte wiedergegeben: »Weise ihnen den guten Weg«.'
  alternative: »Denn du weist ihnen den guten Weg« oder »wenn du ihnen den guten Weg weist«.
  rationale: כִּי kann hier kausal oder umstandsbezogen verstanden werden; zugleich passt die Verbform syntaktisch zur fortlaufenden Gebetsbitte. Die koordinierte Wiedergabe wahrt den Gebetsfluss und vermeidet die Festlegung, Gottes Unterweisung sei entweder Ursache oder bloße zeitliche Bedingung der Vergebung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetstypischer Anrede. »Knechte« und »Erbbesitz« bewahren den biblischen und bundesbezogenen Ton; die Satzstruktur bleibt für heutige Leser klar.
