  yaml_path: translation/ot/2_chronicles/006/035.yaml
  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: de
  text: dann höre du vom Himmel ihr Gebet und ihr Flehen und verschaffe ihnen Recht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tue ihr Recht/Urteil“; auch möglich: „führe ihre Rechtssache“ oder „vollstrecke ihr Urteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: dann höre du
  rationale: Das Qal Perfekt 2. Person maskulin Singular hat im Gebetszusammenhang auffordernden beziehungsweise bittenden Sinn. „Dann“ macht die Verknüpfung mit dem vorausgehenden Bedingungszusammenhang deutlich; „du“ hebt die an Gott gerichtete Bitte natürlich hervor.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel
  rationale: Das formal plurale הַשָּׁמַיִם bezeichnet in dieser Gebetsformel idiomatisch den Himmel als Gottes Wohnort; der deutsche Singular ist natürlich und sachgerecht.
- source_word: תְּפִלָּתָם
  choice: ihr Gebet
  rationale: תְּפִלָּה ist der allgemeine Ausdruck für Gebet. Der Singular mit Suffix wird kollektiv als „ihr Gebet“ wiedergegeben.
- source_word: תְּחִנָּתָם
  choice: ihr Flehen
  rationale: תְּחִנָּה bezeichnet eine inständige Bitte um Gnade oder Gunst. „Flehen“ ist im modernen Deutschen verständlich, knapp und dem würdevollen Gebetsregister angemessen.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: und verschaffe ihnen Recht
  rationale: Wörtlich steht „und tue ihr Recht/Urteil“. Die deutsche Wendung „jemandem Recht verschaffen“ bewahrt den forensischen Sinn und drückt idiomatisch aus, dass Gott zu ihren Gunsten Recht üben soll.
theological_decisions:
- issue: Gottes Antwort auf das Gebet in gerichtlicher Sprache
  choice: verschaffe ihnen Recht
  alternative: führe ihre Rechtssache; vollstrecke ihr Urteil
  rationale: מִשְׁפָּט kann Urteil, Recht, Gerechtigkeit oder Rechtssache bedeuten. Die gewählte Formulierung bewahrt die gerichtliche Dimension, ohne festzulegen, ob vor allem Rechtsprechung, Rechtfertigung oder Vollstreckung gemeint ist.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die doppelte Formulierung „Gebet und Flehen“ bildet die beiden hebräischen Begriffe ab; die Schlusswendung bleibt bewusst forensisch und bewahrt die Bedeutungsbreite von מִשְׁפָּט.
