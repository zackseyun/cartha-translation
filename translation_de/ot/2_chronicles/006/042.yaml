source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: de
  text: HERR, Gott, weise deinen Gesalbten[a][b] nicht ab! Denk an die Gnadenerweise für David, deinen Diener.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wende das Gesicht deines Gesalbten nicht ab.“ Gemeint ist: Weise ihn nicht ab.'
    reason: lexical_alternative
  - marker: b
    text: „Deinen Gesalbten“ kann in diesem königlichen Zusammenhang auch mit „deinen König“ wiedergegeben werden; das hebräische Wort ist zugleich die Grundlage der Bezeichnung „Messias“.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Denk an deine beständige Güte gegenüber David, deinem Diener.“ Die knappe hebräische Formulierung kann auch als „die Gnadenerweise Davids“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: HERR, Gott
  rationale: Der Gottesname JHWH wird nach verbreiteter deutscher Bibelkonvention als „HERR“ wiedergegeben; אֱלֹהִים ist in der Anrede der Titel „Gott“.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: weise … nicht ab
  rationale: Die hebräische Wendung lautet wörtlich „wende das Gesicht … nicht zurück“. Im Deutschen gibt „weise … nicht ab“ ihre Bedeutung in der Gebetssprache natürlich wieder; die Bildsprache bleibt in der Fußnote sichtbar.
- source_word: מְשִׁיחֶךָ
  choice: deinen Gesalbten
  rationale: „Gesalbter“ bewahrt den königlichen Sinn im unmittelbaren Kontext und lässt zugleich eine weitergehende messianische Resonanz offen, ohne sie ausdrücklich festzulegen.
- source_word: זָכְרָה
  choice: Denk an
  rationale: Der Imperativ von זכר fordert Gott auf, etwas wirksam zu berücksichtigen. „Denk an“ ist klares, heutiges Deutsch und passt zur direkten Anrede.
- source_word: לְחַסְדֵי דָּוִיד
  choice: die Gnadenerweise für David
  rationale: Der Plural חֲסָדִים bezeichnet hier Taten beständiger, bundestreuer Güte. „Für David“ versteht David als Empfänger, ohne den Ausdruck auf ein abstraktes Gefühl zu reduzieren.
- source_word: עַבְדֶּךָ
  choice: deinen Diener
  rationale: „Diener“ bezeichnet Davids Stellung im Dienst Gottes und ist im heutigen Deutsch in diesem königlichen und theologischen Zusammenhang natürlich.
theological_decisions:
- issue: Königliche und mögliche messianische Bedeutung von מְשִׁיחֶךָ
  choice: deinen Gesalbten
  alternative: deinen Messias; deinen König
  rationale: Im unmittelbaren Zusammenhang ist der davidische König gemeint. „Gesalbter“ erhält die hebräische Bezeichnung und ihre kanonische Resonanz, ohne den Vers vorschnell als ausschließlich direkte Christusbezeichnung festzulegen.
- issue: Bezug von חַסְדֵי דָּוִיד
  choice: die Gnadenerweise für David
  alternative: die Gnadenerweise Davids; deine Bundestreue gegenüber David
  rationale: Die knappe hebräische Verbindung kann unterschiedlich bezogen werden. Im Gebets- und Bundeskontext liegt Gottes loyale Güte gegenüber David nahe; eine Fußnote hält die grammatisch mögliche andere Zuordnung offen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die direkte Anrede bleibt knapp und eindringlich. „HERR“ folgt der etablierten deutschen Kennzeichnung des Gottesnamens; „Gesalbter“ und die Fußnoten bewahren die königliche Bildwelt sowie die echte Mehrdeutigkeit des hebräischen Textes.
