source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: de
  text: 'und wenn sie es sich in dem Land, in das sie gefangen weggeführt wurden, zu Herzen nehmen[a], umkehren und in dem Land ihrer Gefangenschaft zu dir flehen und sagen: »Wir haben gesündigt, wir haben verkehrt gehandelt und Böses getan«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »es zu ihrem Herzen zurückbringen«; gemeint ist, dass sie sich innerlich besinnen und es sich zu Herzen nehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: es sich zu Herzen nehmen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild vom Zurückbringen ins Herz und vermittelt zugleich innere Besinnung und Einsicht.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: in dem Land, in das sie gefangen weggeführt wurden
  rationale: Das Nifal von שׁבה bezeichnet das Gefangennehmen; die Formulierung ist im Deutschen natürlich und macht die Verschleppung in ein fremdes Land deutlich.
- source_word: וְשָׁבוּ
  choice: umkehren
  rationale: Umkehren wahrt sowohl die räumliche als auch die geistliche Bedeutung von שׁוב und legt den Ausdruck nicht vorschnell ausschließlich als Buße aus.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: zu dir flehen
  rationale: Das Hitpael von חנן bezeichnet ein inständiges Bitten um Gnade; flehen gibt Dringlichkeit und Gebetsrichtung knapp wieder.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: in dem Land ihrer Gefangenschaft
  rationale: Die Wiedergabe hält die konkrete Bedeutung von שְׁבִי fest und entspricht dem Exilkontext.
- source_word: לֵאמֹר
  choice: und sagen
  rationale: Natürliche deutsche Einleitung der wörtlichen Rede.
- source_word: חָטָאנוּ
  choice: Wir haben gesündigt
  rationale: Direkte und etablierte Wiedergabe der Bekenntnisformel.
- source_word: הֶעֱוִינוּ
  choice: wir haben verkehrt gehandelt
  rationale: Die Wendung vermittelt die Vorstellung moralischer Verkehrtheit beziehungsweise Verkrümmung, ohne im heutigen Deutsch unnötig altertümlich zu wirken.
- source_word: וְרָשָׁעְנוּ
  choice: Böses getan
  rationale: Die Formulierung gibt die aktive verbale Aussage von רשע verständlich wieder und bildet den Abschluss der dreifachen Schuldbenennung.
theological_decisions:
- issue: Umkehrsprache im Zusammenhang des Exils
  choice: שׁוב mit „umkehren“ wiedergeben
  alternative: zurückkehren; Buße tun
  rationale: Der Zusammenhang umfasst innere Besinnung, Hinwendung zu Gott, Flehen und Schuldbekenntnis. „Umkehren“ erhält die Spannung zwischen räumlicher Rückkehr und geistlicher Umkehr, ohne sie auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Schuldbekundung bleibt erhalten, wird aber idiomatisch abgestuft. Der Versanfang und das abschließende Komma zeigen, dass der Satz im Kontext weitergeführt wird.
