source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: de
  text: 'Und auch was den Ausländer betrifft, der nicht zu deinem Volk Israel gehört, sondern aus einem fernen Land kommt wegen deines großen Namens, deiner starken Hand und deines ausgestreckten Arms: Wenn sie[a] kommen und in Richtung dieses Hauses beten[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst der Singular (»der Ausländer … kommt«), danach aber der Plural (»sie kommen und beten«). Der einzelne Ausländer dient wohl als repräsentativer Fall.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »zu diesem Haus«. In diesem Gebetszusammenhang bezeichnet die hebräische Präposition wahrscheinlich die Richtung: »in Richtung dieses Hauses«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: der Ausländer
  rationale: נָכְרִי bezeichnet hier einen Menschen aus einem anderen Volk, der nicht zu Israel gehört. »Ausländer« gibt diese ethnische und gemeinschaftliche Abgrenzung im heutigen Deutsch klar wieder; »Fremder« könnte lediglich einen unbekannten Menschen bezeichnen.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: der nicht zu deinem Volk Israel gehört
  rationale: Die Formulierung gibt die ausdrücklich genannte Nichtzugehörigkeit zu Israel natürlich wieder und bewahrt zugleich die Bezeichnung Israels als Gottes Volk.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: sondern aus einem fernen Land kommt
  rationale: Nach der verneinten Zugehörigkeitsaussage drückt »sondern« den sachlichen Gegensatz im Deutschen flüssig aus. »Ein fernes Land« entspricht אֶרֶץ רְחוֹקָה.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: wegen deines großen Namens
  rationale: לְמַעַן bezeichnet hier den Beweggrund seines Kommens. »Großer Name« bewahrt die biblische Rede von Gottes Ansehen und offenbarter Identität.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: deiner starken Hand
  rationale: Die konkrete anthropomorphe Wendung für Gottes machtvolles Handeln wird beibehalten. חֲזָקָה wird unmittelbar mit »stark« wiedergegeben.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: deines ausgestreckten Arms
  rationale: Die traditionelle biblische Bildsprache für Gottes wirksame Macht bleibt erhalten.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: Wenn sie kommen und … beten
  rationale: Die pluralischen Verben werden trotz des zuvor singularischen »Ausländers« als Plural wiedergegeben. »Wenn« fügt die Bedingung natürlich in das fortlaufende Gebet ein.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: in Richtung dieses Hauses
  rationale: אֶל hat hier im Zusammenhang des Gebets eine räumliche Ausrichtung. »Haus« bewahrt die hebräische Benennung des Tempels und deren theologischen Klang.
theological_decisions:
- issue: Numeruswechsel vom singularischen Ausländer zu pluralischen Verben
  choice: 'Der Wechsel wird sichtbar bewahrt: »der … kommt« – »wenn sie kommen und … beten«.'
  alternative: 'Durchgehend Singular: »wenn er kommt und betet«; oder durchgehend Plural: »wenn Ausländer kommen und beten«.'
  rationale: Der hebräische Text wechselt ausdrücklich vom Singular הַנָּכְרִי / וּבָא zum Plural וּבָאוּ / וְהִתְפַּלְלוּ. Die Übersetzung glättet diesen Wechsel nicht, sondern erläutert ihn in einer Fußnote als möglichen Übergang vom repräsentativen Einzelfall zur allgemeinen Gruppe.
- issue: Anthropomorphe Sprache für Gottes Macht
  choice: »deine starke Hand und dein ausgestreckter Arm«
  alternative: »deine große Macht«
  rationale: Die konkrete, an Exodus- und Bundessprache erinnernde Bildlichkeit des Hebräischen wird nicht in eine abstrakte Aussage aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Der Satz bleibt wie im Ausgangstext zum folgenden Vers hin offen. Die konkrete biblische Bildsprache und der auffällige Numeruswechsel werden bewahrt; die Richtungsangabe beim Gebet wird idiomatisch formuliert.
