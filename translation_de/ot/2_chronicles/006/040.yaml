base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: de
  text: Nun, mein Gott, mögen doch deine Augen offen sein und deine Ohren aufmerksam für das Gebet dieses Ortes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gebet, das an diesem Ort gesprochen wird“, oder: „das Gebet von diesem Ort aus“. Wörtlicher: „das Gebet dieses Ortes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Das temporale und zugleich gliedernde Signal leitet Salomos abschließende Bitte ein. „Nun“ ist in einem feierlichen Gebet natürlich und bewahrt den Übergangscharakter.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular dient hier als persönliche Anrede. „Mein Gott“ gibt sie ohne altertümliches Anredepartikel wieder.
- source_word: יִהְיוּ נָא
  choice: lass doch … sein
  rationale: Die Jussivform zusammen mit נָא drückt eine ehrerbietige Bitte aus. „Lass doch“ wahrt sowohl den Wunschcharakter als auch den bittenden Ton.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: deine Augen offen
  rationale: Die konkrete anthropomorphe Bildsprache für Gottes wachsame Zuwendung bleibt erhalten und wird nicht erklärend paraphrasiert.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: deine Ohren aufmerksam
  rationale: קַשֻּׁבוֹת bezeichnet aufmerksames, hörbereites Zugewandtsein. Die Formulierung bewahrt das Bild der Ohren und ist im Deutschen verständlich.
- source_word: לִתְפִלַּת
  choice: für das Gebet
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung göttlicher Aufmerksamkeit. Im Deutschen verbindet sich „aufmerksam sein“ idiomatisch mit „für“.
- source_word: הַמָּקוֹם הַזֶּה
  choice: dieses Ortes
  rationale: Der Genitiv bleibt entsprechend der knappen hebräischen Konstruktion im Haupttext erhalten, ohne „dargebracht“ oder „von“ stillschweigend hinzuzufügen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Augen und Ohren
  choice: 'Die konkrete Bildsprache wird beibehalten: „deine Augen offen und deine Ohren aufmerksam“'
  alternative: Deutende Paraphrase wie „wache darüber und höre“
  rationale: Der hebräische Text beschreibt Gottes Zuwendung zum Gebet mit körperbezogenen Bildern. Ihre Beibehaltung wahrt die literarische und theologische Spannung, ohne eine Aussage über Gottes Körperlichkeit daraus abzuleiten.
- issue: Bezug von „Gebet“ und „diesem Ort“
  choice: Die formale Mehrdeutigkeit wird als „das Gebet dieses Ortes“ bewahrt
  alternative: „das Gebet, das an diesem Ort gesprochen wird“ oder „das Gebet von diesem Ort aus“
  rationale: Die hebräische Genitivverbindung legt die genaue Beziehung nicht ausdrücklich fest. Der Kontext weist auf das mit dem Tempel verbundene Gebet, entscheidet aber nicht zwingend zwischen Ort des Betens und Ausgangspunkt des Gebets.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Gebetssprache. „Lass doch“ gibt die höfliche Bitte wieder; die konkrete Bildsprache und die mehrdeutige Genitivverbindung bleiben erhalten.
