  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: de
  text: Doch wende dich dem Gebet deines Dieners und seinem Flehen um Gnade zu, Jahwe, mein Gott, um den Hilferuf und das Gebet zu hören, das dein Diener vor dir betet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Doch wende dich … zu
  rationale: פנה bezeichnet wörtlich ein Sich-Zuwenden; im Gebetskontext bittet Salomo um Gottes wohlwollende Aufmerksamkeit. „Doch“ gibt den kontextuellen Gegensatz wieder.
- source_word: תְּפִלַּת
  choice: dem Gebet
  rationale: תפלה wird mit dem üblichen deutschen Begriff „Gebet“ wiedergegeben und von תחנה unterschieden.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: „Diener“ entspricht der demütigen Selbstbezeichnung des Königs vor Gott und ist hier natürlicher als „Sklave“.
- source_word: תְּחִנָּתוֹ
  choice: seinem Flehen um Gnade
  rationale: תחנה bezeichnet eine eindringliche Bitte um Gunst oder Erbarmen; „Flehen um Gnade“ macht diese Nuance verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Direkte und natürliche Wiedergabe der Possessivform in der Anrede.
- source_word: לִשְׁמֹעַ
  choice: und höre auf
  rationale: Der Infinitiv bezeichnet das Ziel des Sich-Zuwendens. Im Deutschen stellt die koordinierte Bitte den Zusammenhang natürlich dar.
- source_word: הָרִנָּה
  choice: den Hilferuf
  rationale: רנה kann einen lauten oder schallenden Ruf bezeichnen; im Gebetskontext ist wahrscheinlich ein Ruf um Hilfe gemeint.
- source_word: הַתְּפִלָּה
  choice: das Gebet
  rationale: Die Wiederholung von תפלה bleibt erhalten und bewahrt den Parallelismus.
- source_word: מִתְפַּלֵּל
  choice: betet
  rationale: Das Partizip beschreibt das gegenwärtige Beten; im Deutschen ist das Präsens hier natürlich und ausreichend.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die feste Wendung bedeutet „vor dir“ beziehungsweise „in deiner Gegenwart“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des Sich-Zuwendens und die Wiederholung von „Gebet“ bleiben erhalten; „Hilferuf“ verdeutlicht den wahrscheinlichen Gebetskontext von רנה, ohne den Ausdruck als bloß innerliche Bitte abzuschwächen.
