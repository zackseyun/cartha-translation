  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: de
  text: dann höre du vom Himmel her, deiner Wohnstätte, und vergib. Gib jedem nach allen seinen Wegen, dessen Herz du kennst; denn du allein kennst das Herz aller Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Herz der Söhne des Menschen«; die hebräische Wendung bezeichnet die Menschen insgesamt.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksform und erläutert ihren umfassenden Sinn.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: höre du
  rationale: Das Imperfekt steht im Gebetszusammenhang als Bitte; die Formulierung wahrt den bittenden Charakter und betont zugleich das angesprochene »du«.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Der hebräische Plural wird im Deutschen idiomatisch als Singular wiedergegeben; »her« verdeutlicht die Herkunft des Hörens.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: der Stätte, an der du wohnst
  rationale: מָכוֹן bezeichnet einen festen Ort; die Wendung ist würdevoll, verständlich und bildet die Apposition zum Himmel natürlich ab.
- source_word: וְסָלַחְתָּ
  choice: und vergib
  rationale: Das Perfekt mit Waw führt im Gebet die erbetene Handlung fort.
- source_word: וְנָתַתָּה לָאִישׁ
  choice: Vergilt jedem
  rationale: נתן bedeutet grundsätzlich »geben«, hat hier mit »nach seinen Wegen« jedoch einen vergeltenden beziehungsweise zumessenden Sinn. »Jedem« gibt den distributiven Gebrauch von אִישׁ natürlich wieder.
- source_word: כְּכָל דְּרָכָיו
  choice: nach allen seinen Wegen
  rationale: Die Weg-Metapher für Lebensführung und Verhalten bleibt erhalten.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: denn du kennst sein Herz
  rationale: אֲשֶׁר kann hier begründend beziehungsweise erläuternd verstanden werden. Diese Wiedergabe ist im Deutschen klar und vermeidet einen missverständlichen Relativanschluss an »jedem«.
- source_word: לְבָב
  choice: Herz
  rationale: »Herz« bewahrt die biblische Bezeichnung für das innere Wesen einschließlich Denken und Wollen.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: denn du allein kennst
  rationale: Die Formulierung gibt sowohl die Begründung als auch die Exklusivität von לְבַדְּךָ wieder; das hebräische Perfekt bezeichnet hier einen bestehenden Sachverhalt.
- source_word: בְּנֵי הָאָדָם
  choice: aller Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne des Menschen/Adams«, bezeichnet im Kontext aber die gesamte Menschheit. »Aller Menschen« macht diesen Umfang im modernen Deutsch klar; die wörtliche Bildform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Umfang und Formulierung von בְּנֵי הָאָדָם
  choice: aller Menschen
  alternative: der Menschensöhne / der Kinder der Menschen
  rationale: Gemeint sind Menschen beiderlei Geschlechts insgesamt. Die natürliche deutsche Kollektivform gibt den Referenzumfang wieder, ohne aus der maskulinen hebräischen Repräsentativform eine Einschränkung abzuleiten; die konkrete Ausgangsform bleibt per Fußnote sichtbar.
- issue: Göttliche Kenntnis des Herzens
  choice: du allein kennst das Herz aller Menschen
  alternative: du allein hast das Herz der Menschensöhne erkannt
  rationale: Das hebräische Perfekt drückt hier Gottes ausschließlich ihm eigene, fortbestehende Kenntnis aus. Das Präsens ist daher im Deutschen sachgerecht, ohne die theologische Aussage abzuschwächen oder auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarem Gebetsstil. Die Weg- und Herzmetaphorik bleibt erhalten; schwer verständliche hebräische Repräsentativformen werden im Haupttext natürlich wiedergegeben und in der Fußnote offengelegt.
