source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: de
  text: Höre auf das Flehen[a] deines Dieners und deines Volkes Israel, wenn sie zu diesem Ort hin beten. Höre du von deiner Wohnstätte, vom Himmel her; höre und vergib!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die inständigen Bitten.'
    reason: Lexikalische Alternative zu תַּחֲנוּנֵי; sie verdeutlicht den Charakter des Flehens als Bitte um Gnade.
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: höre / höre du / höre
  rationale: Die dreifache Wiederholung von שׁמע prägt den Vers und wird im Deutschen bewahrt. Im Gebetszusammenhang haben die Verbformen auffordernd-bittenden Sinn.
- source_word: תַּחֲנוּנֵי
  choice: das Flehen
  rationale: Das Wort bezeichnet dringliche, auf Gnade hoffende Bitten. „Flehen“ gibt sowohl den Ernst als auch die emotionale Kraft in verständlichem, würdigem Deutsch wieder.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: In Salomos Gebet ist עבד eine demütige Selbstbezeichnung gegenüber Gott; „Diener“ ist daher sachlich und kontextuell angemessen.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: und deines Volkes Israel
  rationale: Der Genitiv wird parallel zu „deines Dieners“ wiederholt und macht deutlich, dass das Flehen von beiden ausgeht.
- source_word: יִתְפַּלְלוּ
  choice: sie beten
  rationale: Das Verb bedeutet „beten“; die Richtung wird durch die folgende Präpositionalfügung ausgedrückt.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: zu diesem Ort hin
  rationale: Die Formulierung wahrt den Richtungssinn von אֶל und bezeichnet das Gebet in Richtung des Tempels, ohne Gott dort räumlich festzulegen.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: von deiner Wohnstätte
  rationale: Die Wendung bezeichnet den Ort, an dem Gott wohnt. „Wohnstätte“ ist präzise, würdig und im heutigen Deutsch verständlich.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Das morphologisch plurale שׁמים wird im Deutschen idiomatisch als „Himmel“ wiedergegeben; „her“ verdeutlicht die Herkunftsrichtung.
- source_word: וְסָלָחְתָּ
  choice: und vergib
  rationale: Im Gebetszusammenhang hat die Verbform auffordernd-bittenden Sinn. „Vergib“ ist die klare und theologisch unverengte Entsprechung.
theological_decisions:
- issue: Gottes Transzendenz und die Bedeutung des Tempels
  choice: Das Volk betet zum Tempel hin, während Gott von seiner Wohnstätte im Himmel hört.
  alternative: Gott wird im Tempel räumlich lokalisiert oder der Tempelbezug wird rein symbolisch verstanden.
  rationale: Der hebräische Text hält beide Aussagen ausdrücklich zusammen. Die Übersetzung bewahrt diese Spannung, ohne eine Seite abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter Wiederholung von „hören“. Das verstärkende „Ja“ macht den erneuten petitionären Einsatz natürlich kenntlich, ohne den Aussagegehalt zu erweitern.
