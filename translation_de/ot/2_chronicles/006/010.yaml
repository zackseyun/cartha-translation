source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: de
  text: Und Jahwe hat sein Wort erfüllt, das er gesprochen hatte[a]. Ich bin an die Stelle meines Vaters David getreten und sitze auf dem Thron Israels, wie Jahwe es gesagt hatte. Und ich habe das Haus für den Namen Jahwes[b], des Gottes Israels, gebaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Wort bestätigt“ oder „sein Wort ausgeführt“. Das hebräische Verb bedeutet wörtlich, dass Jahwe sein Wort „aufrecht stehen“ oder „bestehen“ ließ.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist der Tempel gemeint. Der hebräische Text bewahrt die prägnante Wendung „Haus für den Namen Jahwes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: hat … erfüllt
  rationale: Das Hifil von קום bezeichnet hier, dass Jahwe sein gesprochenes Wort Bestand haben lässt beziehungsweise verwirklicht. „Erfüllt“ ist im Deutschen bei einer göttlichen Zusage natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Namen JHWH und einem Titel wie „Herr“.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: sein Wort …, das er gesprochen hatte
  rationale: „Wort“ erhält die Wiederholung des hebräischen Wortfelds דבר. Das Plusquamperfekt macht im Deutschen deutlich, dass das Sprechen der nun berichteten Erfüllung vorausging.
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: Ich bin an die Stelle meines Vaters David getreten
  rationale: תחת bezeichnet hier die Nachfolge beziehungsweise das Einnehmen der bisherigen Stellung Davids. Die deutsche Wendung ist natürlich und vermeidet die mögliche feindselige Färbung von „anstelle“.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: und sitze auf dem Thron Israels
  rationale: Das Präsens gibt den aus der Thronbesteigung hervorgegangenen, zur Zeit der Rede fortbestehenden Zustand idiomatisch wieder.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Obwohl damit der Tempel gemeint ist, bewahrt „Haus“ die konkrete hebräische Bezeichnung und die feste Verbindung „Haus für den Namen Jahwes“.
- source_word: לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  rationale: Die formnahe Wiedergabe erhält die theologisch bedeutsame Aussage, dass das Haus für Gottes Namen errichtet wurde, ohne sie zu „zu Ehren Jahwes“ aufzulösen.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den göttlichen Eigennamen. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Heiligtums als הַבַּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: „Das Haus“ lässt die biblische Ausdrucksweise und ihre Verbindung mit dem Namen Jahwes sichtbar; eine Fußnote erläutert den konkreten Bezug auf den Tempel.
- issue: Deutung von לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  alternative: zu Ehren Jahwes
  rationale: Die formnahe Fassung bewahrt die Spannung der Namenstheologie und legt die Wendung nicht vorschnell ausschließlich als Ehrbezeugung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, wird aber durch Satzteilung und „Auch“ flüssig lesbar. „An die Stelle … getreten“ gibt die dynastische Nachfolge natürlich wieder; die wiederholte Redeformel und die Namenstheologie bleiben erkennbar.
