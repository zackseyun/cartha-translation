  naturalness: '„Du hast gut daran getan, dass es dir am Herzen lag“ ist im modernen Standarddeutsch syntaktisch und idiomatisch unerquicklich: Nach „gut daran tun“ wird gewöhnlich ein Infinitiv oder eine Nominalgruppe erwartet, nicht ein dass-Satz. „Du hast gut daran getan, diesen Wunsch im Herzen zu tragen“ ist idiomatisch und bewahrt die Billigung der Absicht.'
  terminology: „Jahwe“, „mein Vater David“ und „Haus für meinen Namen“ sind registergerecht und quellennah. „Haus“ sollte im Haupttext bleiben; „Tempel“ eignet sich als Fußnotenalternative.
