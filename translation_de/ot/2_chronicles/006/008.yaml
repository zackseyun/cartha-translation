- from: 'Doch Jahwe sagte zu meinem Vater David: »Weil es dir am Herzen lag, meinem Namen ein Haus zu bauen[a], hast du gut daran getan, dass es dir am Herzen lag.[b]«'
  to: 'Doch Jahwe sagte zu meinem Vater David: »Weil es dir am Herzen lag, ein Haus für meinen Namen zu bauen[a], hast du gut daran getan, diesen Wunsch im Herzen zu tragen.[b]«'
  rationale: Die Revision beseitigt eine im Deutschen unübliche dass-Konstruktion und stellt die präpositionale Beziehung von לִשְׁמִי mit „für meinen Namen“ klarer dar. „Diesen Wunsch im Herzen zu tragen“ expliziert lediglich den im unmittelbar vorangehenden Infinitivsatz genannten Bauwunsch und gibt die wiederholte hebräische Aussage über Davids innere Absicht idiomatisch wieder. Die Fußnote dokumentiert die wörtlichere, im Deutschen weniger glatte Satzfügung.
