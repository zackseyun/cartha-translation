source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: de
  text: 'Doch Jahwe sagte zu meinem Vater David: »Weil es dir am Herzen lag, ein Haus für meinen Namen zu bauen[a], hast du gut daran getan, diesen Wunsch im Herzen zu tragen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Tempel für meinen Namen zu bauen«. Wörtlich steht im Hebräischen »Haus«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Du hast gut daran getan, denn es war in deinem Herzen.«'
    reason: source_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in der etablierten wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Natürliche deutsche Wiedergabe des erzählenden wayyiqtol von אמר.
- source_word: דָּוִיד אָבִי
  choice: meinem Vater David
  rationale: Die deutsche Wortstellung ist idiomatischer als »David, meinem Vater« und bewahrt die direkte Kindesbezeichnung Salomos.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet die Begründung knapp und idiomatisch ein.
- source_word: הָיָה עִם לְבָבְךָ
  choice: es dir am Herzen lag
  rationale: Bewahrt das Herzbild in natürlichem modernem Deutsch und bezeichnet Davids inneren Wunsch beziehungsweise Entschluss.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: meinem Namen ein Haus zu bauen
  rationale: Bewahrt sowohl das konkrete Wort »Haus« als auch die theologisch bedeutsame Wendung »meinem Namen«; die deutsche Wortfolge ist natürlich.
- source_word: הֱטִיבוֹתָ
  choice: hast du gut daran getan
  rationale: Drückt die göttliche Billigung idiomatisch aus, ohne aus der beabsichtigten Tat eine bereits vollzogene Handlung zu machen.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: dass es dir am Herzen lag
  rationale: Erhält die auffällige Wiederholung des hebräischen Herzmotivs; כִּי wird nach der deutschen Wendung »gut daran tun« passend mit »dass« wiedergegeben.
theological_decisions:
- issue: Wiedergabe von בַּיִת לִשְׁמִי
  choice: meinem Namen ein Haus zu bauen
  alternative: einen Tempel für meinen Namen zu bauen
  rationale: »Haus« entspricht dem hebräischen Wortlaut und hält die Namenstheologie sichtbar. »Tempel« verdeutlicht zwar den Bezug, legt die Metapher aber stärker aus.
- issue: Wiederholung von הָיָה עִם לְבָבְךָ
  choice: Wiederholung mit »es dir am Herzen lag«
  alternative: 'flüssiger: »du hast mit diesem Wunsch gut gehandelt«'
  rationale: Die Wiederholung ist im Hebräischen ausdrücklich vorhanden und unterstreicht, dass Gott Davids innere Absicht billigt; sie wird trotz der gewissen Redundanz nicht beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung »am Herzen liegen« bewahrt das hebräische Herzmotiv. Die bewusste Wiederholung bleibt stehen, da sie die Billigung von Davids Absicht hervorhebt.
