source:
  edition: WLC
  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: de
  text: Denn Salomo hatte ein bronzenes Podest[a] angefertigt und mitten in den Vorhof gestellt. Es war fünf Ellen lang, fünf Ellen breit und drei Ellen hoch. Er stellte sich darauf, kniete vor der ganzen Versammlung Israels nieder und breitete seine Hände zum Himmel aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort כִּיּוֹר bedeutet gewöhnlich „Becken“ oder „Waschbecken“. Hier weisen jedoch die Maße und Salomos Stehen darauf auf eine erhöhte bronzene Konstruktion hin; daher „Podest“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier eine erläuternde Hintergrundangabe zu Salomos Standort und Körperhaltung ein.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: ein bronzenes Podest
  rationale: כִּיּוֹר bezeichnet gewöhnlich ein Becken, doch die Maße und die Aussage, dass Salomo darauf stand, weisen hier auf eine erhöhte bronzene Konstruktion. Die ungewöhnliche Wortverwendung wird in einer Fußnote offengelegt.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: mitten in den Vorhof
  rationale: עֲזָרָה bezeichnet den Tempelvorhof; „mitten in“ gibt die räumliche Bedeutung von בְּתוֹךְ natürlich wieder.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: fünf Ellen lang, fünf Ellen breit und drei Ellen hoch
  rationale: Die alte Maßeinheit wird beibehalten, während die Maßangaben in geläufigem Deutsch formuliert werden.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Er stellte sich darauf
  rationale: Die Formulierung gibt die erzählerische Handlung und den Bezug auf das Podest knapp und natürlich wieder.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: kniete ... nieder
  rationale: ברך bedeutet in diesem Stamm und Zusammenhang „knien“; עַל בִּרְכָּיו bezeichnet die körperliche Haltung auf den Knien.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: vor der ganzen Versammlung Israels
  rationale: „Versammlung“ entspricht dem öffentlichen, gottesdienstlichen Kontext von קָהָל; „vor“ gibt נֶגֶד idiomatisch wieder.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: und breitete seine Hände zum Himmel aus
  rationale: Die Wendung bewahrt die Gebetsgeste und die durch die Richtungsendung ausgedrückte Ausrichtung zum Himmel.
theological_decisions:
- issue: Bedeutung von כִּיּוֹר an dieser Stelle
  choice: Kontextbezogen als „Podest“ wiedergegeben
  alternative: „Becken“ oder „Gestell“
  rationale: Obwohl das Wort sonst meist ein Becken bezeichnet, zeigen Salomos Stehen darauf und die angegebenen Maße, dass hier eine erhöhte Konstruktion gemeint ist. Die Fußnote bewahrt die lexikalische Auffälligkeit, ohne die Szene irreführend als Waschbecken darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Erzählgang; altertümliche Wendungen werden vermieden. „Vorhof“ verdeutlicht den Tempelkontext, und die Maßeinheit „Elle“ bleibt aus Gründen der historischen Genauigkeit erhalten.
