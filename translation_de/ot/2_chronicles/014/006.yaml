source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: de
  text: 'Er sagte zu Juda: »Lasst uns diese Städte bauen und sie mit einer Mauer und Türmen, Toren und Riegeln umgeben, solange das Land noch vor uns liegt.[a] Denn wir haben Jahwe, unseren Gott, gesucht. Wir haben ihn gesucht, und er hat uns ringsum Ruhe verschafft.« So bauten sie und hatten Erfolg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »solange das Land noch vor uns ist«. Gemeint sein kann, dass ihnen das Land weiterhin ungehindert offensteht oder dass die Gelegenheit zum Bauen noch besteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Er sagte zu Juda
  rationale: „Juda“ bezeichnet metonymisch das Volk beziehungsweise das Königreich. Die knappe hebräische Ausdrucksweise bleibt erhalten und ist im Deutschen verständlich.
- source_word: נִבְנֶה אֶת הֶעָרִים הָאֵלֶּה
  choice: Lasst uns diese Städte bauen
  rationale: Die Kohortativform drückt eine Aufforderung beziehungsweise einen gemeinsamen Entschluss aus. „Bauen“ vermeidet die im Verb nicht ausdrücklich enthaltene Festlegung auf „wiederaufbauen“.
- source_word: וְנָסֵב חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: und sie mit einer Mauer und Türmen, Toren und Riegeln umgeben
  rationale: Das Verb bezeichnet ein Umgeben oder Umschließen. חוֹמָה steht singularisch; דְּלָתַיִם meint im Zusammenhang der Stadtbefestigung Tore, und בְּרִיחִים deren Verschlussriegel.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: solange das Land noch vor uns liegt
  rationale: Die Wiedergabe bewahrt sowohl den zeitlichen Sinn von „noch“ als auch das bildhafte „vor uns“, ohne eindeutig festzulegen, ob Verfügbarkeit, ungehinderter Besitz oder eine fortbestehende Gelegenheit gemeint ist.
- source_word: דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ דָּרַשְׁנוּ
  choice: wir haben Jahwe, unseren Gott, gesucht. Wir haben ihn gesucht
  rationale: דרשׁ bezeichnet hier die Hinwendung zu Gott und das vertrauensvolle Suchen nach ihm. Die betonte Wiederholung des Hebräischen wird beibehalten.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: und er hat uns ringsum Ruhe verschafft
  rationale: Die Form bezeichnet gewährte Ruhe beziehungsweise Entlastung; „ringsum“ gibt מִסָּבִיב wieder, ohne nicht ausdrücklich genannte Feinde einzufügen.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: So bauten sie und hatten Erfolg
  rationale: Der Schlusssatz berichtet die erfolgreiche Ausführung. „Hatten Erfolg“ gibt צלח klar und idiomatisch wieder, ohne den Sinn auf materiellen Wohlstand zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Form „Jahwe“ gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Gottesname; die deutsche Schreibform ist geläufig und entspricht der Aussprachetradition.
- issue: Bedeutung von דרשׁ in der Beziehung zu Gott
  choice: gesucht
  alternative: befragt
  rationale: Der Zusammenhang beschreibt umfassende Hinwendung und Vertrauen auf Gott, nicht nur das Einholen einer Auskunft. „Gesucht“ lässt diese geistliche Bedeutung bestehen, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Satzführung. Die Wiederholung von „gesucht“ und die bildhafte Wendung vom Land „vor uns“ bleiben zur Wahrung der hebräischen Betonung und Mehrdeutigkeit erhalten.
