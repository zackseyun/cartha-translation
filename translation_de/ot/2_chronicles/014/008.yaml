source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: de
  text: Da zog Serach, der Kuschit[b], mit einem Heer von tausendmal tausend Mann[a] und dreihundert Streitwagen gegen sie aus. Er kam bis nach Marescha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tausend Tausende“; das kann auch mit „eine Million“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: '„Kuschit“ ist die hebräische ethnogeografische Bezeichnung; traditionell: „Äthiopier“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: zog … gegen sie aus
  rationale: יצא bezeichnet im militärischen Zusammenhang den Auszug zum Kampf; אֲלֵיהֶם erhält durch den Kontext die feindliche Bedeutung „gegen sie“.
- source_word: זֶרַח הַכּוּשִׁי
  choice: der Kuschit Serach
  rationale: „Kuschit“ bewahrt die hebräische ethnogeografische Bezeichnung genauer als das traditionelle „Äthiopier“; der Name wird in der im Deutschen üblichen biblischen Form „Serach“ wiedergegeben.
- source_word: בְּחַיִל
  choice: mit einem Heer
  rationale: חַיִל bezeichnet hier eine militärische Streitmacht. „Heer“ ist im historischen Erzählkontext natürlich und präzise.
- source_word: אֶלֶף אֲלָפִים
  choice: tausendmal tausend Mann
  rationale: Die Wiedergabe bleibt nahe an der ungewöhnlichen hebräischen Zahlenformel und vermeidet es, sie im Haupttext stillschweigend als exakt „eine Million“ auszulegen. „Mann“ verdeutlicht idiomatisch, dass die Zahl die Heeresstärke bezeichnet.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: und dreihundert Streitwagen
  rationale: „Streitwagen“ gibt den militärischen Sinn von מַרְכָּבוֹת in diesem Kontext eindeutiger wieder als das allgemeinere „Wagen“.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: Er kam bis nach Marescha
  rationale: „Bis nach“ bewahrt die durch עַד bezeichnete Bewegung bis zu einem Ort, ohne mehr über den genauen Endpunkt des Vormarschs auszusagen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzteilung erhöht die Lesbarkeit; die markante hebräische Zahlenformel bleibt im Haupttext erkennbar. „Kuschit“ wird ohne Fußnote beibehalten, da es die direkte und im Deutschen verständliche ethnogeografische Wiedergabe ist.
