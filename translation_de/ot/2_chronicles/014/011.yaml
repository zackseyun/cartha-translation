  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: de
  text: Und Jahwe schlug die Kuschiter[a] vor Asa und vor Juda, und die Kuschiter flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Äthiopier“. Das hebräische Ethnonym lautet „Kuschiter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: schlug
  rationale: Das Verb נָגַף bezeichnet im militärischen Zusammenhang ein Schlagen beziehungsweise Besiegen. „Schlug“ bewahrt die Bildhaftigkeit und die unmittelbare göttliche Handlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הַכּוּשִׁים
  choice: die Kuschiter
  rationale: „Kuschiter“ gibt das hebräische Ethnonym direkt wieder und vermeidet die vorschnelle Gleichsetzung mit dem späteren Äthiopien.
- source_word: לִפְנֵי
  choice: vor
  rationale: Im Schlachtbericht bezeichnet לִפְנֵי das Zurückweichen beziehungsweise Unterliegen angesichts von Asa und Juda; „vor“ erhält die knappe hebräische Wendung.
- source_word: אָסָא
  choice: Asa
  rationale: Übliche deutsche Form des Personennamens.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Hier bezeichnet der Name das Volk beziehungsweise Heer Judas; die kollektive Bedeutung ergibt sich aus dem Zusammenhang.
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: נוּס bedeutet „fliehen“; „flohen“ ist präzise und entspricht dem würdigen Erzählstil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt den persönlichen Namen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die zweimalige Nennung der Kuschiter und die Parallelformulierung „vor Asa und Juda“ bleiben entsprechend dem Hebräischen erhalten.
