source:
  edition: WLC
  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: de
  text: Er beseitigte die fremden Altäre und die Kulthöhen, zertrümmerte die Kultsteine und hieb die Ascherim[a] um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Aschera-Pfähle«. Der hebräische Ausdruck bezeichnet Kultobjekte, die mit der Verehrung der Aschera verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Er beseitigte
  rationale: Die Hifil-Form von סור bezeichnet hier das Entfernen oder Wegschaffen. »Beseitigte« gibt die entschlossene Reformmaßnahme natürlich wieder, ohne sie als förmlichen Rechtsakt zu deuten.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: die fremden Altäre
  rationale: נֵכָר bezeichnet hier wahrscheinlich Altäre, die mit fremdem beziehungsweise nichtisraelitischem Kult verbunden waren, nicht lediglich Altäre im Besitz von Ausländern.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: בָּמוֹת bezeichnet kultisch genutzte Höhen oder Heiligtumsstätten. »Kulthöhen« ist im Deutschen präziser und verständlicher als das wörtlichere »Höhen«.
- source_word: וַיְשַׁבֵּר
  choice: zertrümmerte
  rationale: שׁבר beschreibt ein gewaltsames Zerbrechen und unterstreicht die vollständige Zerstörung.
- source_word: הַמַּצֵּבוֹת
  choice: die Kultsteine
  rationale: מַצֵּבוֹת sind aufgerichtete Steine oder Steinmale mit kultischer Funktion. »Kultsteine« vermittelt diese Funktion knapp und vermeidet die mögliche Vorstellung gewöhnlicher Säulen.
- source_word: וַיְגַדַּע
  choice: hieb ... um
  rationale: גדע bedeutet abhauen oder umhauen und passt zu den vermutlich hölzernen Kultobjekten.
- source_word: הָאֲשֵׁרִים
  choice: die Ascherim
  rationale: Der hebräische Ausdruck kann verschiedene mit Aschera verbundene Kultobjekte bezeichnen. Die übernommene Fachbezeichnung bewahrt diese Unbestimmtheit; eine verständliche Deutungsmöglichkeit steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von אֲשֵׁרִים im Zusammenhang der Kultreform
  choice: die Ascherim
  alternative: die Aschera-Pfähle; die Ascheren
  rationale: Ob damit Holzpfähle, stilisierte Bäume oder andere Kultsymbole der Aschera gemeint sind, ist nicht sicher. »Ascherim« wahrt die historische und sachliche Offenheit, ohne eine bestimmte Gestalt der Objekte vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung kräftiger Verben bildet den entschlossenen Charakter der Reform ab. Kultische Fachbegriffe werden verständlich wiedergegeben; die sachliche Ungewissheit bei »Ascherim« bleibt erhalten.
