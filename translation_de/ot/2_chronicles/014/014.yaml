  text: וְ/גַם אָהֳלֵ֥י מִקְנֶ֖ה הִכּ֑וּ וַ/יִּשְׁבּ֨וּ צֹ֤אן לָ/רֹב֙ וּ/גְמַלִּ֔ים וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: de
  text: Auch die Zelte mit Vieh[a] griffen sie an. Sie erbeuteten[c] Schafe[b] in großer Zahl und Kamele. Dann kehrten sie nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Zelte des Viehs« oder »die Zelte des Viehbestands«. Gemeint können Zelte oder Lager mit Vieh sein, möglicherweise auch Weide- oder Hirtenlager.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Kleinvieh insgesamt bezeichnen, also Schafe und Ziegen, oder auch »Herden« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bedeutet häufig »gefangen nehmen«. Bei Tieren ist hier gemeint, dass sie als Beute weggeführt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt den additiven Anschluss an die vorausgehenden Ereignisse knapp und natürlich wieder.
- source_word: אָהֳלֵי מִקְנֶה
  choice: die Hirtenlager
  rationale: Die wörtliche Verbindung »Zelte des Viehs/Viehbestands« bezeichnet wahrscheinlich Zeltlager, die der Viehhaltung dienten. »Hirtenlager« ist im Deutschen verständlich, ohne die konkrete Vorstellung eines nomadischen Lagers aufzugeben; die wörtlichere Lesart wird in der Fußnote bewahrt.
- source_word: הִכּוּ
  choice: griffen sie an
  rationale: נכה bedeutet grundsätzlich »schlagen« und bezeichnet im militärischen Zusammenhang häufig einen Angriff oder das Niederschlagen eines Gegners. Bei Lagern ist »angreifen« im modernen Deutschen idiomatisch und vermeidet die unklare Wendung »Zelte schlagen«.
- source_word: וַיִּשְׁבּוּ
  choice: Sie erbeuteten
  rationale: שבה kann »gefangen nehmen« bedeuten. Da Tiere das Objekt sind, bringt »erbeuten« den Sinn des Wegführens als Beute natürlich zum Ausdruck; die Grundbedeutung bleibt in einer Fußnote sichtbar.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh und kann Schafe sowie Ziegen umfassen. »Schafe« ist eine geläufige Wiedergabe, während die größere Bedeutungsbreite in der Fußnote genannt wird.
- source_word: לָרֹב
  choice: in großer Zahl
  rationale: Gibt die Mengenangabe idiomatisch wieder und betont den großen Umfang der Beute.
- source_word: וּגְמַלִּים
  choice: und Kamele
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Nomens.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Dann kehrten sie nach Jerusalem zurück
  rationale: »Dann« verdeutlicht den erzählerischen Fortgang der Wayyiqtol-Form; »nach Jerusalem zurückkehren« ist natürliches Standarddeutsch.
theological_decisions: []
