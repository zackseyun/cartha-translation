  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die schwer wörtlich wiederzugebende Verbindung אָהֳלֵי מִקְנֶה wird idiomatisch als »Hirtenlager« übersetzt; ihre konkrete Form und semantische Offenheit werden durch die Fußnote bewahrt.
