  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: de
  text: Er sagte zu Juda, den HERRN, den Gott ihrer Vorfahren, zu suchen und das Gesetz und das Gebot zu befolgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er gebot
  rationale: Im Kontext bezeichnet אָמַר nicht nur ein Sagen, sondern eine an Juda gerichtete verbindliche Anweisung; „gebot“ gibt diese Funktion knapp und natürlich wieder.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דָּרַשׁ bezeichnet hier die bewusste Hinwendung zu und das Fragen nach Gott; „suchen“ bewahrt die etablierte, inhaltlich offene Ausdrucksweise.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die deutsche Bibelkonvention „HERR“ kennzeichnet den Gottesnamen, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: den Gott ihrer Vorfahren
  rationale: „Vorfahren“ gibt אָבוֹת in inklusivem, heutigem Deutsch wieder und meint hier die früheren Generationen des Volkes.
- source_word: לַעֲשׂוֹת
  choice: zu befolgen
  rationale: Wörtlich „zu tun“; in Verbindung mit Gesetz und Gebot bedeutet es, danach zu handeln. „Befolgen“ ist im Deutschen idiomatisch und erhält den Gehorsamsaspekt.
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: das Gesetz und das Gebot
  rationale: Die beiden bestimmten Singularformen werden getrennt wiedergegeben; ihre rhetorische Paarung wird nicht zu einem allgemeinen Plural eingeebnet.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ folgt einer verbreiteten deutschen Übersetzungskonvention und wahrt zugleich die besondere Kennzeichnung des Gottesnamens.
- issue: Verhältnis von Gesetz und Gebot
  choice: beide Begriffe im Singular beibehalten
  alternative: die Gebote des Gesetzes
  rationale: Der hebräische Text stellt תּוֹרָה und מִצְוָה koordiniert nebeneinander; eine Zusammenfassung würde diese formale und möglicherweise theologisch bedeutsame Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „gebot“ und „befolgen“ die jeweilige Funktion im Deutschen natürlich ausdrücken.
