  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: de
  text: Asa hatte ein Heer von 300.000 Mann aus Juda, die Langschilde und Speere trugen, und 280.000 Mann aus Benjamin, die Schilde trugen und den Bogen spannten. Sie alle waren tapfere Krieger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kampfstarke Männer“. Die hebräische Wendung גִּבּוֹרֵי חָיִל ist eine feste Bezeichnung für starke, tapfere und bewährte Kämpfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: Heer
  rationale: Im Zusammenhang dieser militärischen Aufstellung bezeichnet das Wort die Asa zur Verfügung stehende Streitmacht; „Heer“ ist im Deutschen klar und dem gehobenen Erzählstil angemessen.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: die Langschilde und Speere trugen
  rationale: צִנָּה bezeichnet einen großen, den Körper stärker deckenden Schild. „Langschild“ bewahrt den Unterschied zu מָגֵן im folgenden Satzteil, ohne die Form des Schildes unnötig festzulegen.
- source_word: מִיהוּדָה
  choice: aus Juda
  rationale: Die Präposition מִן bezeichnet hier Herkunft beziehungsweise Stammeszugehörigkeit.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300.000 Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ macht im Deutschen deutlich, dass gezählte Soldaten gemeint sind.
- source_word: נֹשְׂאֵי מָגֵן
  choice: die Schilde trugen
  rationale: מָגֵן ist der allgemeinere beziehungsweise kleinere Schild und bleibt daher im Unterschied zum vorherigen צִנָּה schlicht „Schild“.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: und den Bogen spannten
  rationale: Die hebräische Wendung bezeichnet das Spannen beziehungsweise Handhaben des Bogens und damit Bogenschützen. Die Formulierung bewahrt das konkrete Bild und ist im Deutschen verständlich.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280.000 Mann
  rationale: Direkte Wiedergabe der Zahl; „Mann“ bezeichnet die in der militärischen Aufstellung erfassten Soldaten.
- source_word: כָּל אֵלֶּה
  choice: Sie alle
  rationale: Natürliche deutsche Zusammenfassung der beiden zuvor genannten Truppengruppen.
- source_word: גִּבּוֹרֵי חָיִל
  choice: tapfere Krieger
  rationale: Die feste militärische Bezeichnung meint kampfstarke, bewährte und mutige Männer. „Tapfere Krieger“ gibt diesen Sinn natürlich und würdig wieder.
theological_decisions:
- issue: Geschlechtsspezifische militärische Bezeichnung in גִּבּוֹרֵי חָיִל
  choice: tapfere Krieger
  alternative: kampfkräftige Männer; Helden von Stärke
  rationale: Der Kontext ist eine antike Heeresaufstellung männlicher Soldaten. „Krieger“ wahrt diesen konkreten Bezug, ohne eine darüber hinausgehende lehrmäßige Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Schildbegriffe werden durch „Langschilde“ und „Schilde“ unterschieden. Ziffern halten die sehr großen Truppenzahlen übersichtlich; „Mann“ verdeutlicht, dass es sich um gezählte Soldaten handelt.
