  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: de
  text: Er entfernte aus allen Städten Judas die Kulthöhen und die Räucheraltäre[a], und das Königreich hatte unter ihm Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Sonnenpfeiler“. Das hebräische Wort bezeichnet Kultgegenstände, die in manchen Zusammenhängen mit der Sonnenverehrung verbunden sein können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Er entfernte
  rationale: Das Hifil von סור bezeichnet hier das Beseitigen kultischer Einrichtungen. „Entfernte“ gibt die konkrete Handlung wieder, ohne sie als förmlichen Erlass zu deuten.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: aus allen Städten Judas
  rationale: Die Formulierung gibt den räumlichen Umfang der Reform direkt und idiomatisch wieder.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: במות bezeichnet kultische Stätten, häufig auf Anhöhen. „Kulthöhen“ ist im Deutschen verständlicher und sachlich präziser als das bloße „Höhen“, ohne sie allgemein zu „Heiligtümern“ umzudeuten.
- source_word: הַחַמָּנִים
  choice: die Räucheraltäre
  rationale: Der seltene Ausdruck bezeichnet kultische Gegenstände, deren genaue Art unsicher ist. „Räucheraltäre“ ist im Zusammenhang plausibel; die mögliche Deutung als mit Sonnenkult verbundene Pfeiler bleibt in der Fußnote erhalten.
- source_word: וַתִּשְׁקֹט
  choice: hatte … Ruhe
  rationale: שקט beschreibt einen ungestörten, ruhigen Zustand. Die Wendung nimmt zugleich das wiederkehrende Motiv politischer Ruhe im Chronikbuch auf.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: Dies ist die direkte und im Kontext natürliche Entsprechung von ממלכה.
- source_word: לְפָנָיו
  choice: unter seiner Herrschaft
  rationale: Wörtlich bedeutet die Wendung „vor ihm“. Hier bezeichnet sie idiomatisch die Zeit beziehungsweise den Bereich seiner Herrschaft; die deutsche Formulierung vermeidet das missverständliche „vor ihm“.
theological_decisions:
- issue: Art der von Asa beseitigten Kultgegenstände
  choice: במות und חמנים werden als konkrete Kultstätten beziehungsweise Kultgegenstände wiedergegeben, ohne deren religiöse Funktion über das sprachlich Gesicherte hinaus festzulegen.
  alternative: חמנים ausdrücklich als Sonnenpfeiler oder Sonnenmale deuten.
  rationale: Der Vers beschreibt Asas Vorgehen gegen unerlaubte Kultstätten und -gegenstände. Da die genaue Bedeutung von חמנים umstritten ist, wird eine plausible Hauptübersetzung gewählt und die spezifisch solare Deutung als Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ und „Räucheraltäre“ sind für heutige Leser verständlich und bewahren den historischen Kultzusammenhang. „Unter seiner Herrschaft“ gibt לְפָנָיו idiomatisch wieder.
