source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: de
  text: Er baute befestigte Städte in Juda, denn im Land herrschte Ruhe, und in jenen Jahren war er in keinen Krieg verwickelt[a], denn Jahwe gewährte ihm Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es wurde kein Krieg gegen ihn geführt.“ Die hebräische Wendung kann allgemeiner das Fehlen eines Krieges bezeichnen, an dem Asa beteiligt oder von dem er betroffen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Wayyiqtol von בנה führt die Erzählung mit einer vergangenen Handlung Asas fort; im Deutschen ist kein einleitendes „Und“ nötig.
- source_word: עָרֵי מְצוּרָה
  choice: befestigte Städte
  rationale: Die Constructusverbindung bezeichnet Städte, die durch Befestigungsanlagen geschützt waren; dies ist die natürliche deutsche Wiedergabe.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition ist lokal gebraucht und bezeichnet das Gebiet Juda.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: im Land herrschte Ruhe
  rationale: שׁקט bezeichnet Ruhe und Ungestörtheit. Die Formulierung ist im Deutschen natürlich und bewahrt zugleich die Verbindung zum abschließenden Motiv der von Jahwe gewährten Ruhe.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: er hatte keinen Krieg
  rationale: Die hebräische Wendung besagt, dass Asa von keinem Krieg betroffen war, ohne eindeutig festzulegen, ob ein Krieg gegen ihn oder unter seiner Beteiligung gemeint ist. Die knappe deutsche Formulierung bewahrt diese Offenheit.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: in jenen Jahren
  rationale: Die Zeitangabe verweist auf den in der Erzählung behandelten Zeitraum.
- source_word: הֵנִיחַ
  choice: Ruhe verschafft hatte
  rationale: Der Hifil von נוח bedeutet hier, jemanden zur Ruhe kommen zu lassen beziehungsweise ihm Ruhe vor Konflikten zu gewähren. Das Plusquamperfekt macht im Deutschen deutlich, dass Jahwes Handeln die vorausgehende Friedenszeit begründet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לוֹ
  choice: ihm
  rationale: Das Suffix bezeichnet Asa als den Empfänger der von Jahwe gewährten Ruhe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Ursache der politischen Ruhe
  choice: weil Jahwe ihm Ruhe verschafft hatte
  alternative: denn Jahwe gab ihm Ruhe
  rationale: Der Kausalsatz schreibt die Ruhe ausdrücklich Jahwes Handeln zu. Das Plusquamperfekt bildet die begründende Vorzeitigkeit natürlich ab, ohne die theologische Aussage zu verstärken oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Im Land herrschte Ruhe“ ist natürlicher als das wörtlichere „das Land war ruhig“; die Wiederaufnahme von „Ruhe“ am Versende bewahrt das hebräische Motiv. Die Formulierung „hatte er keinen Krieg“ lässt die Beteiligungsrichtung bewusst offen.
