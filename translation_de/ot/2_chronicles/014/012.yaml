base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: de
  text: Asa und das Volk, das bei ihm war, verfolgten sie bis nach Gerar. Von den Kuschitern[a] fielen so viele, dass keiner von ihnen am Leben blieb; denn sie wurden vor Jahwe und vor seinem Heer[b] zerschmettert. Dann trugen sie überaus viel Beute davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Äthiopier“. Im Hebräischen steht „Kuschiter“, also Menschen aus Kusch.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor seinem Heerlager“. Das hebräische Wort kann „Heerlager“ oder „Heer“ bedeuten. Das Suffix kann auf Asa bezogen werden; manche verstehen es als Hinweis auf Jahwes Heer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: verfolgten sie
  rationale: רדף bezeichnet hier die militärische Verfolgung eines fliehenden Gegners; „verfolgten“ ist im Deutschen präzise und natürlich.
- source_word: עַד לִגְרָר
  choice: bis nach Gerar
  rationale: עַד gibt die räumliche Ausdehnung der Verfolgung an. Bei einem Ortsnamen ist „bis nach Gerar“ idiomatisches Deutsch.
- source_word: מִכּוּשִׁים
  choice: von den Kuschitern
  rationale: כּוּשִׁים bezeichnet Menschen aus Kusch. „Kuschiter“ bewahrt den historischen und geografischen Bezug besser als das traditionell verwendete „Äthiopier“.
- source_word: וַיִּפֹּל מִכּוּשִׁים לְאֵין לָהֶם מִחְיָה
  choice: Von den Kuschitern fielen so viele, dass keiner von ihnen am Leben blieb
  rationale: Die Konstruktion mit נפל und מן beschreibt Gefallene aus der Gruppe; לְאֵין לָהֶם מִחְיָה bezeichnet das völlige Ausbleiben Überlebender. Die deutsche Formulierung gibt den Sinn verständlich wieder, ohne ein zusätzliches Subjekt einzuführen.
- source_word: נִשְׁבְּרוּ
  choice: wurden … zerschmettert
  rationale: Das passive שבר schildert die vernichtende Niederlage mit dem Bild des Zerbrechens. „Zerschmettert“ erhält dieses kräftige Bild und passt zum militärischen Zusammenhang.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird als „vor“ wiedergegeben und bewahrt so die räumlich-theologische Ausdrucksweise; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: und vor Asas Heer
  rationale: מַחֲנֶה kann ein Heerlager oder die dort versammelte Streitmacht bezeichnen. Im Kampfzusammenhang ist „Heer“ natürlich; der pronominale Rückbezug wird im Haupttext auf Asa bezogen, während die bestehende Mehrdeutigkeit in der Fußnote offengelegt wird.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: Dann trugen sie überaus viel Beute davon
  rationale: נשא mit שׁלל bedeutet, erbeutete Güter wegzutragen. „Beute davontragen“ ist eine geläufige deutsche Wendung; „überaus viel“ bildet die starke Steigerung הַרְבֵּה מְאֹד ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in מַחֲנֵהוּ
  choice: Asas Heer
  alternative: Jahwes Heer beziehungsweise sein Heerlager
  rationale: Im Erzählzusammenhang bezeichnet das Suffix plausibel Asas Streitmacht und stellt Gottes Wirken und das menschliche Heer nebeneinander. Da Grammatik und Wortbedeutung auch andere Deutungen zulassen, werden diese in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Erzählweise. Historische Bezeichnungen und die Bildkraft des Hebräischen bleiben erhalten; echte lexikalische und referenzielle Mehrdeutigkeiten werden durch Fußnoten kenntlich gemacht.
