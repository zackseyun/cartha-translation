id: 2CH.14.9
reference: 2 Chronicles 14:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א אָסָ֖א לְ/פָנָ֑י/ו וַ/יַּֽעַרְכוּ֙ מִלְחָמָ֔ה בְּ/גֵ֥יא צְפַ֖תָה לְ/מָרֵשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: de
  text: Da zog Asa ihm entgegen[a], und sie stellten sich im Tal Zefata bei Marescha zum Kampf auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor ihn“ oder „ihm gegenüber“; auch möglich: „gegen ihn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie ordneten die Schlachtreihen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da zog … entgegen
  rationale: יצא bezeichnet hier im militärischen Erzählzusammenhang das Ausziehen einer Streitmacht. „zog … entgegen“ ist natürliches modernes Deutsch und nimmt den durch לְפָנָיו angezeigten Konfrontationszusammenhang auf.
- source_word: לְפָנָיו
  choice: ihm entgegen
  rationale: Wörtlich bedeutet die Wendung „vor ihn/ihm gegenüber“. Im Zusammenhang bezeichnet sie Asas Vorrücken zur Begegnung mit dem feindlichen Heer; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: sie stellten sich … zum Kampf auf
  rationale: ערך mit מלחמה bezeichnet das Ordnen beziehungsweise Aufstellen zum Kampf. Diese Wiedergabe ist verständlich, militärisch präzise und nicht altertümlich.
- source_word: בְּגֵיא
  choice: im Tal
  rationale: גיא bezeichnet ein Tal oder eine Schlucht; „Tal“ ist hier die geläufigste geographische Bezeichnung.
- source_word: צְפַתָה
  choice: Zefata
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form wiedergegeben.
- source_word: לְמָרֵשָׁה
  choice: bei Marescha
  rationale: לְ vor dem Ortsnamen bezeichnet hier die räumliche Zuordnung des Tals zu Marescha. „bei“ vermeidet die unzutreffende Gleichsetzung des Tals mit der Stadt selbst.
