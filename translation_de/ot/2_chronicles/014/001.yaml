source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: de
  text: Asa tat, was gut und recht war in den Augen Jahwes, seines Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Augen Jahwes“; eine hebräische Wendung im Sinn von „nach dem Urteil Jahwes“.'
    reason: Erläuterung der hebräischen Redewendung
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה bezeichnet in dieser wertenden Wendung das Tun beziehungsweise Verhalten; „tat“ ist im Deutschen natürlich und verbindet sich gut mit „was gut und recht war“.
- source_word: אָסָא
  choice: Asa
  rationale: Der Personenname wird nach geläufiger deutscher Konvention als „Asa“ wiedergegeben.
- source_word: הַטּוֹב
  choice: was gut war
  rationale: Der substantivierte Ausdruck bezeichnet hier moralisch gutes Handeln; die Relativsatzform ist in modernem Deutsch natürlicher als „das Gute“.
- source_word: וְהַיָּשָׁר
  choice: und recht
  rationale: יָשָׁר bezeichnet im ethischen Zusammenhang das Rechte beziehungsweise Aufrichtige; „recht“ bewahrt die knappe Paarung mit „gut“.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die hebräische Perspektiv- und Bewertungsmetapher wird transparent und idiomatisch bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname in der im Deutschen etablierten Form „Jahwe“ wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: אֱלֹהִים ist hier trotz seiner Form singularisch auf Israels Gott bezogen; das Possessivsuffix wird mit „seines“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen modernen deutschen Transkription.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Metapher „in den Augen“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
