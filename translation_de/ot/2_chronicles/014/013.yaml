source:
  edition: WLC
  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: de
  text: Und sie schlugen alle Städte im Umkreis von Gerar, denn der Schrecken Jahwes lag auf ihnen. Sie plünderten alle diese Städte, denn in ihnen gab es reiche Beute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: sie schlugen
  rationale: Das Hifil von נכה bezeichnet im militärischen Zusammenhang ein gewaltsames Schlagen beziehungsweise Besiegen. „Sie schlugen“ bewahrt die Bildsprache und lässt offen, ob vor allem die Bewohner, die Verteidiger oder die Städte als militärische Einheiten gemeint sind.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: alle Städte im Umkreis von Gerar
  rationale: „Im Umkreis von Gerar“ gibt סְבִיבוֹת idiomatisch und räumlich klar wieder; עָרִים wird als „Städte“ übersetzt.
- source_word: פַּחַד יְהוָה
  choice: der Schrecken Jahwes
  rationale: פַּחַד bezeichnet hier keine ehrfürchtige Gottesfurcht, sondern lähmenden Schrecken, der von Jahwe ausgeht oder mit ihm verbunden ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲלֵיהֶם
  choice: lag auf ihnen
  rationale: Die Formulierung bildet die Konstruktion mit היה und על natürlich ab und bewahrt zugleich die mögliche Beziehung auf die Städte beziehungsweise deren Bewohner.
- source_word: וַיָּבֹזּוּ
  choice: sie plünderten
  rationale: בזז bezeichnet im Krieg das Wegnehmen von Gütern als Beute; „plünderten“ ist im modernen Deutschen präzise und geläufig.
- source_word: בִּזָּה רַבָּה
  choice: reiche Beute
  rationale: בִּזָּה ist Kriegsbeute; „reiche Beute“ gibt die große Menge idiomatisch wieder und vermeidet eine schwerfällige Formulierung.
- source_word: בָהֶם
  choice: in ihnen
  rationale: Der pronominale Rückverweis auf die Städte wird ausdrücklich bewahrt, ohne ihn zu „dort“ zu verallgemeinern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ macht diesen Namen im Deutschen sichtbar, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von פַּחַד יְהוָה
  choice: der Schrecken Jahwes
  alternative: die Furcht vor Jahwe
  rationale: Der Zusammenhang schildert eine militärische Niederlage der umliegenden Städte. Daher bezeichnet die Wendung überwältigenden, von Jahwe ausgehenden Schrecken und nicht ehrfürchtige Frömmigkeit.
translation_notes:
  register: Natürliches, würdevolles Standarddeutsch mit leicht biblischem Erzählton. Die zweimalige Nennung der Städte folgt der hebräischen Wiederholung; „diese Städte“ sorgt im zweiten Satz für einen klaren Rückbezug. Keine Fußnoten erforderlich.
