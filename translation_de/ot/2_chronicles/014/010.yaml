    rationale: Im Kontext beschreibt die schwierige Wendung am ehesten die Unabhängigkeit göttlicher Hilfe von vielen/starken gegenüber kraftlosen Streitkräften. Deutsch „zwischen X und Y helfen“ bezeichnet dagegen eine Vermittlung zwischen zwei Parteien und ist daher weder natürlich noch hinreichend quellentreu.
  - severity: low
