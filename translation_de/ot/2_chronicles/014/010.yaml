source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: de
  text: 'Und Asa rief zu Jahwe, seinem Gott, und sagte: »Jahwe, nur du kannst helfen, ob durch viele oder durch Kraftlose.[a] Hilf uns, Jahwe, unser Gott! Denn auf dich stützen wir uns, und in deinem Namen sind wir gegen diese Menge gezogen. Jahwe, du bist unser Gott. Lass keinen Sterblichen gegen dich bestehen!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe, außer dir ist niemand, der helfen kann, ob bei Mächtigen oder Kraftlosen.« Der hebräische Satz ist äußerst knapp; רַב kann große Zahl oder große Stärke bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Lass keinen Sterblichen dich zurückhalten« beziehungsweise »gegen dich die Oberhand behalten«. Das hier verwendete Verb ist in diesem Zusammenhang mehrdeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief zu
  rationale: קרא אל bezeichnet im Gebetskontext einen dringlichen Ruf an Gott; „rief zu“ ist natürlich und bewahrt die Intensität, ohne ein Schreien zwingend vorauszusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: seinem Gott / unser Gott
  rationale: Die Possessivverbindungen werden direkt wiedergegeben und bewahren die persönliche Gebetssprache.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: außer dir ist keiner, der helfen kann
  rationale: Die schwierige Wendung wird als Aussage über die Einzigartigkeit göttlicher Hilfe verstanden; eine alternative syntaktische Deutung wird in der Fußnote berücksichtigt.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: zwischen einem Mächtigen und einem Kraftlosen
  rationale: Die knappe Gegenüberstellung bleibt erhalten, ohne רַב eindeutig nur auf Anzahl oder nur auf Stärke festzulegen.
- source_word: עָזְרֵנוּ
  choice: Hilf uns
  rationale: Direkte, knappe Wiedergabe des Imperativs mit Objektsuffix.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: Denn auf dich stützen wir uns
  rationale: Bewahrt das Bild des Sich-Anlehnens und klingt zugleich in modernem Deutsch verständlich.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: in deinem Namen sind wir ... gezogen
  rationale: „In deinem Namen“ bewahrt die biblische Vorstellung des Handelns in Gottes Vollmacht und im Vertrauen auf ihn; „gezogen“ entspricht dem militärischen Kontext.
- source_word: הֶהָמוֹן הַזֶּה
  choice: diese Menge
  rationale: הָמוֹן bezeichnet eine große Menschenmenge und erhält im Zusammenhang von selbst militärischen Sinn, ohne durch „Heer“ überbestimmt zu werden.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: Lass keinen sterblichen Menschen gegen dich bestehen
  rationale: עצר ist hier schwierig; „bestehen“ gibt im Kampfkontext das Widerstehen oder Sich-Behaupten wieder. „Sterblicher Mensch“ bildet die menschliche Begrenztheit von אֱנוֹשׁ ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה; die Transliteration „Jahwe“ bewahrt ihn als Namen.
- issue: Mehrdeutigkeit von אֵין עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ
  choice: Außer Jahwe kann keiner zwischen Mächtigem und Kraftlosem helfen
  alternative: Für Jahwe macht es keinen Unterschied, mit vielen oder mit Kraftlosen zu helfen
  rationale: Die Syntax ist außergewöhnlich knapp und textlich schwierig. Der Haupttext bewahrt die Vorstellung exklusiver göttlicher Hilfe; die Fußnote nennt die verbreitete alternative Deutung, ohne die Spannung zu beseitigen.
- issue: Bezug von אַתָּה
  choice: „du bist unser Gott“ als eigener Satz
  alternative: „Jahwe, unser Gott, du ...“ ohne ergänztes Prädikat
  rationale: Das isolierte Pronomen kann emphatisch sein. Die gewählte deutsche Fassung macht die im Gebetszusammenhang naheliegende Aussage explizit, ohne einen zusätzlichen theologischen Titel einzuführen.
- issue: Bedeutung von עצר in der Schlussbitte
  choice: gegen dich bestehen
  alternative: dich zurückhalten; gegen dich die Oberhand behalten
  rationale: Die genaue Nuance des Verbs ist umstritten. Im Kampfgebet liegt Widerstand oder Behauptung gegen Gott nahe; die Fußnote hält andere Möglichkeiten offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetssprache. Die parallelen Anreden und die Dringlichkeit der Imperative bleiben erhalten. Der Haupttext vermeidet unnötige militärische Ergänzungen und kennzeichnet die beiden erheblichen hebräischen Mehrdeutigkeiten durch Fußnoten.
