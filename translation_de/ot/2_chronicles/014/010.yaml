revisions:
- from: 'Und Asa rief zu Jahwe, seinem Gott, und sagte: »Jahwe, außer dir ist keiner, der helfen kann zwischen einem Mächtigen und einem Kraftlosen.[a] Hilf uns, Jahwe, unser Gott! Denn auf dich stützen wir uns, und in deinem Namen sind wir gegen diese Menge gezogen. Jahwe, du bist unser Gott. Lass keinen sterblichen Menschen gegen dich bestehen!«[b]'
  to: 'Und Asa rief zu Jahwe, seinem Gott, und sagte: »Jahwe, nur du kannst helfen, ob durch viele oder durch Kraftlose.[a] Hilf uns, Jahwe, unser Gott! Denn auf dich stützen wir uns, und in deinem Namen sind wir gegen diese Menge gezogen. Jahwe, du bist unser Gott. Lass keinen Sterblichen gegen dich bestehen!«[b]'
  rationale: 'Die erste schwierige Klausel wird so umgestellt, dass sie im Deutschen verständlich ist und die im Hebräischen wahrscheinlich gemeinte Alternative ausdrückt: Gottes Hilfe hängt weder von vielen bzw. Starken noch von Kraftlosen ab. Da die genaue syntaktische Zuordnung und die Nuance von רַב umstritten bleiben, dokumentiert Fußnote a die alternative, stärker exklusive Lesung. Die Schlussbitte bleibt bewusst bei „gegen dich bestehen“; Fußnote b bewahrt die lexikalischen Alternativen zu עצר. Die Änderung zu „Sterblicher“ ist stilistisch, nicht inhaltlich.'
