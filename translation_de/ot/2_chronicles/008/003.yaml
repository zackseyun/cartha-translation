  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: de
  text: Dann zog Salomo nach Hamat-Zoba und brachte es unter seine Herrschaft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewann die Oberhand darüber“ oder „brachte es unter seine Kontrolle“. Die hebräische Wendung bedeutet wörtlich etwa: „er wurde ihm gegenüber stark“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog
  rationale: הלך bezeichnet zunächst das Gehen; im Zusammenhang eines königlichen Feldzugs gibt „zog“ die Bewegung natürlich wieder, ohne dem Verb selbst ausdrücklich eine feindliche Bedeutung aufzuzwingen.
- source_word: חֲמָת צוֹבָה
  choice: Hamat-Zoba
  rationale: Die beiden Ortsnamen werden hier als zusammengesetzte geografische Bezeichnung verstanden. Die Bindestrichform wahrt die knappe hebräische Namensstruktur.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: brachte es unter seine Herrschaft
  rationale: Die Wendung חזק על bedeutet wörtlich etwa „stark werden über/gegen“ und bezeichnet hier, im militärisch-politischen Zusammenhang, das Erlangen der Oberhand beziehungsweise Kontrolle. Die gewählte Formulierung ist im Deutschen klar, ohne den Ausgangstext unnötig auszudeuten.
