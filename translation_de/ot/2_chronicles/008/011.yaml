  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: de
  text: 'Und Salomo brachte die Tochter des Pharao aus der Stadt Davids hinauf in das Haus, das er für sie gebaut hatte; denn er sagte: »Keine meiner Frauen soll im Haus Davids, des Königs von Israel, wohnen; denn die Orte[a], zu denen die Lade Jahwes gekommen ist, sind heilig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn heilig sind sie, zu denen die Lade Jahwes gekommen ist«; das im Hebräischen vorausgesetzte pluralische Bezugswort ist hier mit »die Orte« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: ließ … hinaufziehen
  rationale: Der Hifil von עלה bezeichnet hier das Hinaufbringen bzw. Hinaufziehenlassen. Die Formulierung bewahrt sowohl die Veranlassung durch Salomo als auch die Richtungsangabe.
- source_word: מֵעִיר דָּוִיד
  choice: aus der Stadt Davids
  rationale: Die geografische Herkunftsangabe wird direkt und im Deutschen idiomatisch wiedergegeben.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: in das Haus, das er für sie gebaut hatte
  rationale: בַּיִת wird lexikalisch transparent mit »Haus« wiedergegeben; das Plusquamperfekt verdeutlicht natürlich, dass der Bau dem Umzug vorausging.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Eine Frau von mir soll nicht … wohnen
  rationale: Die Wendung bewahrt die mögliche Spannung von אִשָּׁה zwischen »Frau« und »Ehefrau« und gibt לִי eng mit »von mir« wieder, ohne den Satz zu einem allgemeinen Verbot für Frauen auszuweiten.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: im Haus Davids, des Königs von Israel
  rationale: »Haus« hält die lexikalische Verbindung zu בַּיִת fest; die Apposition wird in natürlichem, würdigem Deutsch gestaltet.
- source_word: קֹדֶשׁ הֵמָּה
  choice: heilig sind die Orte
  rationale: Die Heiligkeitsaussage und der Plural von הֵמָּה bleiben erhalten; der im Hebräischen nur vorausgesetzte Bezug wird als »Orte« kenntlich gemacht.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: zu denen die Lade Jahwes gekommen ist
  rationale: Die Relativkonstruktion wird eng am Hebräischen wiedergegeben. »Jahwe« gibt den Gottesnamen יְהוָה als Eigennamen wieder.
theological_decisions:
- issue: Nicht ausdrücklich genanntes pluralisches Bezugswort in der Begründung der Heiligkeit
  choice: »die Orte« wird als sinngemäß ergänztes Bezugswort verwendet
  alternative: 'Wörtlicher und schwer verständlich: »denn heilig sind sie, zu denen die Lade Jahwes gekommen ist«; oder singularisch auf das Haus beziehen'
  rationale: הֵמָּה und אֲלֵיהֶם sind pluralisch. »Die Orte« erklärt die Ellipse, ohne die Heiligkeit abstrakt auf die Dynastie oder nur auf ein einzelnes Gebäude zu beziehen; die Fußnote macht die Ergänzung transparent.
- issue: Bedeutung von אִשָּׁה לִי
  choice: »Eine Frau von mir«
  alternative: »Meine Frau« oder »Keine meiner Frauen«
  rationale: Der Kontext bezeichnet die Tochter des Pharaos als Salomos Frau, doch die hebräische Formulierung bleibt etwas offener. »Eine Frau von mir« bewahrt diese Eigenart und vermeidet sowohl eine unnötige Singularfestlegung als auch die ausdrückliche Einführung der Mehrzahl.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die leicht markierte Wendung »Eine Frau von mir« dient der Nähe zur mehrdeutigen hebräischen Formulierung; die elliptische Pluralkonstruktion wird im Text verständlich gemacht und in der Fußnote offengelegt.
