id: 2CH.8.12
reference: 2 Chronicles 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: de
  text: Damals brachte Salomo auf dem Altar Jahwes, den er vor der Vorhalle[a] gebaut hatte, Brandopfer für Jahwe dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Säulenhalle“ beziehungsweise „Eingangshalle“. Gemeint ist die Vorhalle am Eingang des Tempels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Der temporale Erzählmarker leitet den nächsten Vorgang ein; „Damals“ ist natürlich und kann sowohl zeitliche Einordnung als auch Erzählfolge ausdrücken.
- source_word: הֶעֱלָה
  choice: brachte … dar
  rationale: Der Hifil von עלה bezeichnet mit einem Opfer als Objekt das Darbringen auf dem Altar; die deutsche Wendung „Opfer darbringen“ gibt den kultischen Sinn idiomatisch wieder.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Etablierte deutsche Wiedergabe für das Opfer, das vollständig auf dem Altar verbrannt wird; der Numerus ist im Deutschen bei der formgleichen Pluralform aus dem Kontext ersichtlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier die Widmung beziehungsweise den Empfänger des Opfers; „für Jahwe“ ist im Deutschen eindeutig und natürlich.
- source_word: עַל מִזְבַּח יְהוָה
  choice: auf dem Altar Jahwes
  rationale: Gibt sowohl die räumliche Präposition als auch die hebräische Genitivverbindung knapp und transparent wieder.
- source_word: אֲשֶׁר בָּנָה
  choice: den er … gebaut hatte
  rationale: Der Relativsatz bezieht sich auf den Altar; das Plusquamperfekt verdeutlicht, dass dessen Bau dem Opfer vorausging.
- source_word: לִפְנֵי הָאוּלָם
  choice: vor der Vorhalle
  rationale: לִפְנֵי ist räumlich mit „vor“ wiedergegeben; אוּלָם bezeichnet die Eingangshalle beziehungsweise den Vorbau des Tempels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in einer im modernen Deutschen gebräuchlichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Altar und zugehörigen Relativsatz zusammen; „Brandopfer darbringen“ wahrt den kultischen Sprachgebrauch, ohne unnötig altertümlich zu klingen.
