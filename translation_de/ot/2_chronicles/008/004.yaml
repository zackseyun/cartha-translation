  text: וַ/יִּ֥בֶן אֶת תַּדְמֹ֖ר בַּ/מִּדְבָּ֑ר וְ/אֵת֙ כָּל עָרֵ֣י הַֽ/מִּסְכְּנ֔וֹת אֲשֶׁ֥ר בָּנָ֖ה בַּ/חֲמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: de
  text: Er baute Tadmor in der Wüste[a] und alle Vorratsstädte, die er in Hamat baute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tadmor wird traditionell mit Palmyra gleichgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Wayyiqtol von בנה bezeichnet eine vergangene Handlung in der Erzählfolge. Das deutsche Präteritum gibt dies natürlich wieder; die verbindende Nuance muss nicht ausdrücklich mit „und“ oder „dann“ wiedergegeben werden.
- source_word: תַּדְמֹר
  choice: Tadmor
  rationale: Der Ortsname wird transliteriert. Die spätere griechisch-lateinische Bezeichnung „Palmyra“ wird nicht in den Haupttext eingesetzt, sondern in einer Fußnote erläutert.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Wildnis- oder Wüstengebiet. „Wüste“ ist hier eine knappe, geografisch passende und im modernen Deutsch natürliche Wiedergabe.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: alle Vorratsstädte
  rationale: Die Konstruktverbindung bezeichnet Städte, die der Lagerung von Vorräten oder Versorgungsgütern dienten. „Vorratsstädte“ ist präzise und verständlich.
- source_word: אֲשֶׁר בָּנָה
  choice: die er … baute
  rationale: Der Relativsatz bezieht sich unmittelbar auf die Vorratsstädte und wird im Deutschen entsprechend wiedergegeben.
- source_word: בַּחֲמָת
  choice: in Hamat
  rationale: Die Präposition ב wird räumlich mit „in“ wiedergegeben. Diese Formulierung lässt offen, ob die Stadt Hamat selbst oder ihr Gebiet gemeint ist.
theological_decisions: []
translation_notes:
