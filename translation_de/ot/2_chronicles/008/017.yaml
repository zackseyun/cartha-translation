source:
  edition: WLC
  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: de
  text: Dann ging Salomo nach Ezjon-Geber und nach Elot[a], an der Küste des Meeres im Land Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elot wird auch Elat oder Elath genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Der zeitliche Erzählmarker leitet das nächste Geschehen ein; „Dann“ gibt den fortlaufenden Erzählzusammenhang natürlich wieder.
- source_word: הָלַךְ
  choice: ging
  rationale: Das Verb bezeichnet hier allgemein das Sichbegeben oder Reisen zu einem Ort. „Ging“ ist im deutschen Erzählstil die schlichte, passende Wiedergabe, ohne eine Fortbewegung zu Fuß festzulegen.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: nach Ezjon-Geber
  rationale: Bei Ortsnamen entspricht „nach“ dem deutschen Sprachgebrauch; der Name wird nahe am Hebräischen transliteriert und als zusammengesetzter Ortsname mit Bindestrich geschrieben.
- source_word: וְאֶל אֵילוֹת
  choice: und nach Elot
  rationale: Die Präposition wird bei einem Ortsziel idiomatisch mit „nach“ wiedergegeben. „Elot“ folgt der masoretischen Form אֵילוֹת; gebräuchliche deutsche Namensvarianten werden in der Fußnote genannt.
- source_word: עַל שְׂפַת הַיָּם
  choice: an der Küste des Meeres
  rationale: שְׂפַת bezeichnet wörtlich den Rand beziehungsweise das Ufer. Im geografischen Zusammenhang ist „Küste“ natürlich und bewahrt die räumliche Aussage.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Die ausdrückliche Nennung von אֶרֶץ („Land“) bleibt erhalten; „Edom“ ist die etablierte deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdevoller deutscher Erzählstil. Die Ortsnamen werden quellennah transliteriert; die alternative Schreibung von Elot wird knapp dokumentiert.
