source:
  edition: WLC
  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: de
  text: 'und zwar nach dem, was für jeden Tag vorgeschrieben war[a]: Er brachte Opfer dar, wie Mose es geboten hatte, an den Sabbaten, an den Neumondtagen und an den festgesetzten Festen dreimal im Jahr: am Fest der Ungesäuerten Brote, am Wochenfest[b] und am Laubhüttenfest[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach der Sache eines Tages an seinem Tag«; gemeint ist die jeweils für den Tag geltende Vorschrift.'
    reason: lexical_alternative
  - marker: b
    text: Das Wochenfest wurde später nach griechischem Sprachgebrauch »Pfingsten« genannt.
    reason: cross_reference
  - marker: c
    text: 'Wörtlich: »Fest der Hütten«; traditionell auch »Fest der Laubhütten« beziehungsweise »Laubhüttenfest« genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: und zwar nach dem, was für jeden Tag vorgeschrieben war
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »nach der Sache eines Tages an seinem Tag« und bezeichnet hier die für den jeweiligen Tag geltende Opferordnung. Die Wiedergabe ist natürliches Deutsch und bewahrt den administrativ-kultischen Sinn.
- source_word: לְהַעֲלוֹת
  choice: Er brachte Opfer dar
  rationale: Der Hifil von עלה bezeichnet im Opferkontext das Darbringen, besonders von Brandopfern. »Opfer darbringen« gibt den kultischen Sinn verständlich wieder, ohne die Opferart enger festzulegen, als es der Vers selbst tut.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: wie Mose es geboten hatte
  rationale: Die Formulierung gibt die mosaische Anordnung idiomatisch wieder und bewahrt Mose als Urheber beziehungsweise Vermittler des Gebots.
- source_word: לַשַּׁבָּתוֹת
  choice: an den Sabbaten
  rationale: Die Präposition bezeichnet hier die Zeitpunkte, zu denen die Opfer dargebracht wurden. Im Deutschen ist »an« bei kalendarischen Anlässen natürlich.
- source_word: וְלֶחֳדָשִׁים
  choice: an den Neumondtagen
  rationale: חֳדָשִׁים bezeichnet in diesem kultischen Kalenderzusammenhang die Neumondfeiern. »Neumondtage« ist im modernen Deutsch klarer als das substantivierte »Neumonde«.
- source_word: וְלַמּוֹעֲדוֹת
  choice: an den festgesetzten Festen
  rationale: מוֹעֲדִים sind bestimmte beziehungsweise festgesetzte Zeiten; hier werden sie durch die drei folgenden Wallfahrtsfeste konkretisiert. Die Wiedergabe erhält sowohl den Termin- als auch den Festcharakter.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: dreimal im Jahr
  rationale: Direkte, idiomatische Wiedergabe des hebräischen Zeitausdrucks.
- source_word: בְּחַג הַמַּצּוֹת
  choice: am Fest der Ungesäuerten Brote
  rationale: Transparente und im Deutschen etablierte Bezeichnung des im Hebräischen genannten Festes.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: am Wochenfest
  rationale: Die Bezeichnung folgt unmittelbar dem hebräischen Namen »Fest der Wochen« und vermeidet im Haupttext die spätere griechische Benennung Pfingsten.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: am Laubhüttenfest
  rationale: »Laubhüttenfest« ist die geläufige deutsche Wiedergabe und bewahrt das konkrete Bild der hebräischen סֻכּוֹת, der Hütten.
theological_decisions:
- issue: Benennung der drei israelitischen Wallfahrtsfeste
  choice: Fest der Ungesäuerten Brote / Wochenfest / Laubhüttenfest
  alternative: Passafest / Pfingsten / Fest der Hütten
  rationale: Der Haupttext übersetzt die im Hebräischen ausdrücklich genannten Festnamen transparent und vermeidet, das Wochenfest durch die spätere griechisch-christliche Bezeichnung zu ersetzen. Geläufige Alternativbezeichnungen werden, soweit hilfreich, in Fußnoten erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Anschluss »und zwar« trägt dem syntaktisch abhängigen Versanfang Rechnung. Die Opferhandlung wird als eigener Satz formuliert, um den langen hebräischen Satz verständlich zu gliedern. Sämtliche Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
