  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: de
  text: Von ihren Nachkommen, die nach ihnen im Land übrig geblieben waren und die die Israeliten nicht vernichtet hatten[a], ließ Salomo bis zum heutigen Tag Frondienst leisten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die die Söhne Israels nicht vernichtet hatten«. »Söhne Israels« ist eine übliche Bezeichnung für die Israeliten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu verpflichtender Arbeitsleistung«. Das hebräische Wort bezeichnet eine staatlich auferlegte Arbeitsabgabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Von ihren Nachkommen
  rationale: בְּנֵיהֶם bedeutet wörtlich »von ihren Söhnen/Kindern«, bezeichnet hier aber die späteren Nachkommen der zuvor genannten Völker.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: die nach ihnen ... übrig geblieben waren
  rationale: Die Formulierung bewahrt sowohl den resultativen Sinn von נותר als auch die zeitliche Beziehung von אַחֲרֵיהֶם.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: »Im Land« ist im geschichtlichen Kontext die natürliche und traditionsnahe Wiedergabe.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: die die Israeliten nicht vernichtet hatten
  rationale: כלה im Piel bezeichnet hier das vollständige Beseitigen oder Vernichten. »Die Israeliten« gibt die übliche nationale Bezeichnung בְּנֵי יִשְׂרָאֵל in natürlichem modernem Deutsch wieder.
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: zog Salomo Menschen zum Frondienst heran
  rationale: In Verbindung mit לְמַס bezeichnet das Hifil von עלה die staatliche Heranziehung zu einer Arbeitsabgabe. Das ergänzte »Menschen« verhindert, dass das deutsche Pronomen missverständlich auf die früheren Generationen bezogen wird.
- source_word: לְמַס
  choice: zum Frondienst
  rationale: מַס bezeichnet hier verpflichtende staatliche Arbeitsleistung; »Frondienst« ist prägnant und im Deutschen allgemein verständlich.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: und so ist es bis heute
  rationale: Die Wendung bezeichnet das Fortbestehen des Zustands bis zur Gegenwart des Verfassers; die deutsche Fassung macht diesen Anschluss idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die langen Relativanschlüsse des Hebräischen bleiben erkennbar, werden jedoch syntaktisch geglättet. »Frondienst« wahrt den Zwangscharakter, ohne den technischeren Ausdruck »Korvée« zu verwenden.
