  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt eng am hebräischen Satzbau, wird aber durch »sowie« und einen Gedankenstrich lesbarer gegliedert. Militärisch-administrative Komposita werden knapp wiedergegeben; echte lexikalische Alternativen stehen in den Fußnoten.
