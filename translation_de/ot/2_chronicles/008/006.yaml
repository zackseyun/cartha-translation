id: 2CH.8.6
reference: 2 Chronicles 8:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֗ת וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ כָּל עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת כָּל חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירֽוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: de
  text: und Baalat sowie alle Vorratsstädte[a], die Salomo gehörten, alle Wagenstädte und die Reiterstädte[b] und alles, was Salomo zu bauen wünschte[c] – in Jerusalem, im Libanon und im ganzen Gebiet seiner Herrschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Speicherstädte« oder »Versorgungsstädte«, möglicherweise »Schatzstädte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Städte für Reiter«; möglicherweise sind Städte für Pferde gemeint, doch das hebräische Wort bezeichnet gewöhnlich Reiter oder Kavalleristen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »alles Begehren Salomos, das er zu bauen begehrte«; die Verbindung stammverwandter Wörter betont Salomos Wunsch oder Gefallen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Der Ortsname wird nach seiner hebräischen Form ins Deutsche übertragen und nicht übersetzt.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: Vorratsstädte
  rationale: Die Wendung bezeichnet Städte zur Lagerung von Vorräten oder Versorgungsgütern; »Vorratsstädte« ist im Deutschen klar und prägnant.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: die Salomo gehörten
  rationale: Gibt die hebräische Besitzkonstruktion natürlich und genau wieder.
- source_word: עָרֵי הָרֶכֶב
  choice: Wagenstädte
  rationale: Bewahrt die knappe hebräische Konstruktion und bezeichnet Städte, die den Streitwagen beziehungsweise ihrem Unterhalt dienten.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: Reiterstädte
  rationale: פָּרָשִׁים bezeichnet gewöhnlich Reiter beziehungsweise Kavalleristen; die Übersetzung vermeidet eine vorschnelle Gleichsetzung mit bloßen Pferdestädten.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: alles, was Salomo zu bauen wünschte
  rationale: Gibt die Aussage idiomatisch wieder; die im Hebräischen betonte Verbindung von Substantiv und stammverwandtem Verb wird in einer Fußnote kenntlich gemacht.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Das Verb bedeutet hier schlicht »bauen«; der Text selbst verlangt nicht »wiederaufbauen«.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: וּבַלְּבָנוֹן
  choice: im Libanon
  rationale: Übliche deutsche Form der geografischen Bezeichnung.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: im ganzen Gebiet seiner Herrschaft
  rationale: Bewahrt sowohl den territorialen Bezug von אֶרֶץ als auch den Aspekt von Herrschaft beziehungsweise Regierungsgewalt in מֶמְשָׁלָה.
theological_decisions: []
