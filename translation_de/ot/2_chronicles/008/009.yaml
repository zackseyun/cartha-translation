source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: de
  text: Von den Israeliten[a] jedoch setzte Salomo keinen als Sklaven für seine Arbeiten ein[b]; denn sie waren Krieger, seine Offiziere[c], die Befehlshaber seiner Streitwagen und seine Reiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „machte Salomo keinen zum Sklaven für seine Arbeit“. Der hebräische Ausdruck bezeichnet die Zuweisung zur Sklavenarbeit.'
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete hebräische Wort bezeichnet vermutlich ranghohe militärische Amtsträger oder Adjutanten; auch „Hauptleute“ ist als Wiedergabe möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: Von den Israeliten jedoch
  rationale: Die Verbindung aus וּ und מִן stellt einen Gegensatz zum vorangehenden Vers her. „Israeliten“ gibt die hebräische Wendung „Söhne Israels“ in natürlichem modernem Deutsch wieder.
- source_word: לֹא נָתַן ... לַעֲבָדִים
  choice: setzte ... keinen als Sklaven ... ein
  rationale: Die Konstruktion bezeichnet die Zuweisung zum Sklavenstand beziehungsweise zur Sklavenarbeit. „Sklaven“ wahrt die Schärfe des hebräischen Ausdrucks und vermeidet die abschwächende Wiedergabe „Diener“.
- source_word: לִמְלַאכְתּוֹ
  choice: für seine Arbeiten
  rationale: מְלָאכָה bezeichnet hier die von Salomo veranlassten Arbeiten; der deutsche Plural klingt in diesem Zusammenhang natürlich und umfasst die verschiedenen staatlichen Bau- und Arbeitsvorhaben.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: Krieger
  rationale: „Krieger“ gibt die idiomatische Bedeutung von „Männer des Krieges“ klar und würdig wieder.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: seine Offiziere
  rationale: שָׁלִישׁ ist eine schwierige Bezeichnung für einen ranghohen militärischen Amtsträger oder Adjutanten. „Offiziere“ bewahrt die militärische Funktion, ohne eine genauere Rangstufe vorzutäuschen.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: die Befehlshaber seiner Streitwagen
  rationale: Die Wendung bezeichnet Amtsträger, die über Salomos Streitwagen beziehungsweise Streitwagentruppe gesetzt waren.
- source_word: וּפָרָשָׁיו
  choice: seine Reiter
  rationale: פָרָשִׁים bezeichnet berittene Soldaten; „Reiter“ ist die geläufige und kontextgerechte deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die adversative Verbindung zum vorangehenden Vers wird durch „jedoch“ deutlich. Der schwierige militärische Rangtitel bleibt mit „Offiziere“ bewusst allgemein; die soziale Härte von עֲבָדִים wird mit „Sklaven“ nicht abgeschwächt.
