source:
  edition: WLC
  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: de
  text: So wurde das ganze Werk Salomos vom Tag der Grundlegung des Hauses Jahwes an bis zu seiner Vollendung fertiggestellt.[a] Damit war das Haus Jahwes vollendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So wurde das ganze Werk Salomos vom Tag der Grundlegung des Hauses Jahwes an bis zu seiner Vollendung geordnet, gefestigt oder bereitgemacht.« Das hebräische Verb kann je nach Zusammenhang auch das feste Einrichten oder Ordnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: wurde … planmäßig ausgeführt
  rationale: Das Nifal von כון bezeichnet hier, dass Salomos gesamtes Bauvorhaben geordnet bzw. fest eingerichtet zur Ausführung kam. Die Formulierung bewahrt den resultativen Sinn und klingt im Deutschen natürlicher als »wurde gegründet«.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: das ganze Werk Salomos
  rationale: מְלָאכָה bezeichnet Arbeit, Werk oder Vorhaben; im Kontext umfasst es das gesamte königliche Bauprojekt.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: vom Tag der Grundlegung des Hauses Jahwes an bis zu seiner Vollendung
  rationale: Die Konstruktion beschreibt den Zeitraum von der Grundlegung bis zur Fertigstellung. Das Suffix in כְּלֹתוֹ kann sich auf das Haus beziehungsweise dessen Vollendung beziehen; die substantivische Wiedergabe erhält diese leichte Offenheit.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Bezeichnung »Haus« bleibt erhalten; gemeint ist der Tempel. Der Gottesname יהוה wird als Jahwe wiedergegeben.
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: Damit war das Haus Jahwes vollendet
  rationale: שָׁלֵם bezeichnet hier den erreichten Zustand des vollständigen, fertiggestellten Hauses. »Damit« gibt den zusammenfassenden Abschluss natürlich wieder, ohne eine stärkere Kausalität zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von כְּלֹתוֹ
  choice: bis zu seiner Vollendung
  alternative: bis er es vollendet hatte / bis zu dessen Vollendung
  rationale: Das maskuline Suffix kann syntaktisch unterschiedlich aufgefasst werden. Die deutsche Formulierung bezieht es naheliegend auf das Haus bzw. das Bauwerk, ohne einen handelnden Vollender ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus Jahwes« bewahrt die konkrete hebräische Bildsprache; »planmäßig ausgeführt« macht den geordneten und resultativen Sinn von וַתִּכֹּן verständlich. Die Wiederholung von »Haus Jahwes« bleibt als feierlicher Abschluss erhalten.
