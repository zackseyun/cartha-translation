base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: de
  text: Und er baute Ober-Bet-Horon und Unter-Bet-Horon als befestigte Städte[a] mit Mauern, Türen[b] und Riegeln[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Festungsstädte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Türen«; gemeint sind wahrscheinlich die Türen der Stadttore.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch mit »Querbalken« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Und er baute
  rationale: Das Verb בנה bezeichnet hier zunächst schlicht das Bauen. Ob bereits vorhandene Orte ausgebaut oder wiederaufgebaut wurden, wird durch das Verb allein nicht ausdrücklich gesagt.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Ober-Bet-Horon
  rationale: Der Ortsname wird transliteriert; הָעֶלְיוֹן kennzeichnet idiomatisch den höher gelegenen der beiden Orte.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Unter-Bet-Horon
  rationale: Parallel zu Ober-Bet-Horon bezeichnet הַתַּחְתּוֹן den tiefer gelegenen Ort.
- source_word: עָרֵי מָצוֹר
  choice: als befestigte Städte
  rationale: Die Konstruktverbindung bezeichnet Städte mit Verteidigungsanlagen. Die Formulierung fügt sich natürlich als nähere Bestimmung zum Verb „baute“ ein.
- source_word: חוֹמוֹת
  choice: mit Mauern
  rationale: Die Mauern werden zusammen mit den folgenden Bauteilen als Kennzeichen der Befestigung aufgezählt.
- source_word: דְּלָתַיִם
  choice: Torflügeln
  rationale: Das hebräische Wort bedeutet wörtlich „Türen“ beziehungsweise eine zweiflügelige Tür. Im Zusammenhang befestigter Städte sind die Türflügel der Stadttore gemeint; „Torflügel“ wahrt diese Unterscheidung besser als das allgemeinere „Tore“.
- source_word: וּבְרִיחַ
  choice: und Riegeln
  rationale: בְּרִיחַ bezeichnet einen Quer- oder Verschlussriegel, mit dem Türen beziehungsweise Torflügel gesichert wurden. Der hebräische Singular kann in der deutschen Aufzählung natürlich kollektiv als Plural wiedergegeben werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen werden in der im Deutschen gut verständlichen Form „Ober-Bet-Horon“ und „Unter-Bet-Horon“ wiedergegeben. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten, wird aber durch „als“ und „mit“ idiomatisch verbunden.
