source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: de
  text: 'Nach der Ordnung seines Vaters David[a] setzte er die Abteilungen der Priester für ihren Dienst ein und die Leviten für ihre Dienstaufgaben: Sie sollten Lob darbringen und vor den Priestern Dienst tun, je nach der Aufgabe des jeweiligen Tages[b]. Auch die Torhüter setzte er in ihren Abteilungen an den einzelnen Toren ein. Denn so lautete das Gebot Davids, des Mannes Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „David, sein Vater“. Das hebräische Wort für „Vater“ kann auch einen Vorfahren bezeichnen; hier ist jedoch Salomos Vater David gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach der Sache eines Tages an seinem Tag“, das heißt: je nach der für den jeweiligen Tag festgelegten Aufgabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: setzte er … ein
  rationale: Der Hifil von עמד bezeichnet hier das Einsetzen beziehungsweise Aufstellen von Personen für bestimmte Aufgaben. „Einsetzen“ passt zum administrativen Zusammenhang und bewahrt den kausativen Sinn.
- source_word: כְּמִשְׁפַּט
  choice: nach der Ordnung
  rationale: מִשְׁפָּט bezeichnet hier keine gerichtliche Entscheidung, sondern eine verbindlich festgelegte Ordnung für den Tempeldienst.
- source_word: דָּוִיד אָבִיו
  choice: seines Vaters David
  rationale: Dies gibt die hebräische Formulierung direkt und natürlich wieder. David war zugleich tatsächlich Salomos Vater; die weiter gefasste Bedeutung „Vorfahr“ ist daher hier nicht erforderlich.
- source_word: מַחְלְקוֹת
  choice: Abteilungen
  rationale: Gemeint sind die organisierten Dienstgruppen der Priester, Leviten und Torhüter. „Abteilungen“ ist im modernen Deutschen verständlich und sachlich passend.
- source_word: עַל עֲבֹדָתָם
  choice: für ihren Dienst
  rationale: Die Wendung weist den Priestern ihren jeweiligen Bereich des Tempeldienstes zu.
- source_word: מִשְׁמְרוֹתָם
  choice: ihre Dienstaufgaben
  rationale: מִשְׁמֶרֶת kann Wachdienst, Zuständigkeit oder übertragene Aufgabe bedeuten. Bei den Leviten fasst „Dienstaufgaben“ den Zusammenhang verständlich, ohne ihn auf bloße Wachschichten zu verengen.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: Lob darbringen und … Dienst tun
  rationale: הלל bezeichnet das Loben, während שרת im kultischen Zusammenhang einen geordneten heiligen Dienst meint. „Lob darbringen“ vermeidet im Deutschen ein unnatürliches intransitives „loben“, ohne ein ausdrückliches Objekt in den Haupttext einzufügen.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: vor den Priestern
  rationale: נֶגֶד bedeutet „vor“, „gegenüber“ oder „in der Gegenwart von“. Die formalere Wiedergabe „vor den Priestern“ bewahrt die räumlich-funktionale Offenheit besser als das deutendere „an der Seite der Priester“.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: wie es für jeden einzelnen Tag vorgeschrieben war
  rationale: Die idiomatische Wendung meint die für den jeweiligen Tag festgelegte Aufgabe oder Vorschrift. Die deutsche Formulierung gibt den Sinn natürlich wieder; die wörtlichere Gestalt wird in einer Fußnote dokumentiert.
- source_word: הַשּׁוֹעֲרִים
  choice: die Torhüter
  rationale: Gemeint sind die für die Tempeltore zuständigen Wächter und Diener. „Torhüter“ ist die klare heutige Bezeichnung.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: an den einzelnen Toren
  rationale: 'Die hebräische Wiederholung hat distributiven Sinn: Die Gruppen waren jeweils bestimmten Toren zugeordnet.'
- source_word: מִצְוַת
  choice: Gebot
  rationale: Das Wort bezeichnet eine autoritative Anweisung. „Gebot“ bewahrt diesen verbindlichen Charakter und klingt zugleich natürlich.
theological_decisions:
- issue: Bezeichnung Davids als Salomos „Vater“
  choice: Die direkte Bezeichnung „Vater“ bleibt im Haupttext erhalten.
  alternative: „Vorfahr“ oder „Stammvater“
  rationale: אָב kann im Hebräischen auch einen Vorfahren bezeichnen, doch David war in diesem Zusammenhang tatsächlich Salomos Vater. Eine interpretierende Erweiterung zu „Vorfahr“ ist daher weder sprachlich noch sachlich nötig.
- issue: Bezug des Lobpreises
  choice: „Lob darbringen“ ohne ausdrücklich genanntes Objekt
  alternative: „Gott loben“
  rationale: Gott ist im Tempelkontext als Gegenstand des Lobes vorausgesetzt, im hebräischen Satz aber nicht ausdrücklich als Objekt genannt. Die gewählte Formulierung ist idiomatisch und vermeidet zugleich eine unnötige Ergänzung.
- issue: Verhältnis der Leviten zu den Priestern
  choice: „vor den Priestern Dienst tun“
  alternative: „den Priestern dienen“ oder „an der Seite der Priester dienen“
  rationale: Die Präposition נֶגֶד bezeichnet zunächst eine räumliche oder relationale Gegenüberstellung. Die Übersetzung soll weder ein direktes Dienstverhältnis zu den Priestern noch eine gleichrangige Zusammenarbeit stärker festlegen, als es der Wortlaut tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die kultisch-administrativen Begriffe bleiben erkennbar, werden aber ohne veraltete Amtsbezeichnungen wiedergegeben. Der lange hebräische Satz ist zur besseren Verständlichkeit in drei Sätze gegliedert; seine sachlichen Zuordnungen bleiben erhalten.
