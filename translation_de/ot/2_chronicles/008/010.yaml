  text: וְ/אֵ֨לֶּה שָׂרֵ֤י ה/נציבים אֲשֶׁר לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם הָ/רֹדִ֖ים בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: de
  text: 'Dies waren die obersten Beamten König Salomos: zweihundertfünfzig, die über das Volk herrschten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die das Volk beaufsichtigten“ oder „die für das Volk verantwortlich waren“. Das hebräische Verb kann im Verwaltungskontext die Ausübung amtlicher Autorität bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Das waren
  rationale: Die Formulierung führt innerhalb der historischen Erzählung zusammenfassend eine Gruppe ein; das deutsche Präteritum entspricht diesem Erzählzusammenhang.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: die obersten Beamten
  rationale: שָׂרֵי bezeichnet hier ranghohe Verantwortliche, während נְצִיבִים königlich eingesetzte Amtsträger meint. „Oberste Beamte“ gibt das Rang- und Verwaltungsverhältnis natürlich wieder, ohne einen militärischen Rang vorauszusetzen.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomos
  rationale: Die Wendung bezeichnet die Zugehörigkeit beziehungsweise Zuordnung zu Salomo und lässt sich im Deutschen knapp durch den Genitiv ausdrücken.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: '250'
  rationale: Entspricht der hebräischen Zahl „zweihundertfünfzig“; die Ziffer ist in einer modernen deutschen Ausgabe gut lesbar.
- source_word: הָרֹדִים
  choice: die … geboten
  rationale: Das Partizip von רדה bezeichnet die Ausübung von Herrschaft oder Amtsgewalt. „Über jemanden gebieten“ bewahrt den Autoritätsaspekt, ohne unnötig eine harte oder tyrannische Herrschaft zu unterstellen.
- source_word: בָּעָם
  choice: über das Volk
  rationale: Die Präposition ב markiert mit רדה den Bereich beziehungsweise die Menschen, über die Autorität ausgeübt wird. „Volk“ bleibt beim ausdrücklichen Wortlaut und verengt die Aussage nicht auf Arbeitskräfte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberste Beamte“ macht die Verwaltungshierarchie verständlich; „geboten“ erhält zugleich den stärkeren Bedeutungsgehalt des hebräischen Verbs. Die Fußnoten bewahren die möglichen administrativen Nuancen.
