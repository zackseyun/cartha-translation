  rationale: Die Revision glättet ausschließlich die deutsche kollektive Satzführung und präzisiert die Kennzeichnung der wörtlichen Fußnotenformulierung. Sinn, historische Bezeichnungen, syntaktische Offenheit und die im Hebräischen mögliche Nuance von מִן bleiben erhalten.
