review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt כָּל הָעָם הַנּוֹתָר, die fünf Volksbezeichnungen und die abschließende Abgrenzung von Israel inhaltlich zutreffend wieder. Die offene Satzführung mit Gedankenstrich entspricht der Fortsetzung in Vers 8. Die Umstellung auf einen pluralischen deutschen Relativsatz bildet die kollektiv gemeinten Menschen aus den genannten Völkern klarer ab.
  naturalness: „Das ganze Volk, das von den Hetitern … übrig geblieben war“ ist grammatisch möglich, wirkt im Deutschen bei einer Aufzählung mehrerer Völker jedoch unnötig wie ein einzelnes Volk. „Alle Menschen, die … übrig geblieben waren“ ist idiomatischer und erhält den kollektiven Sinn.
  terminology: Die Volksnamen Hetiter, Amoriter, Perisiter, Hiwiter und Jebusiter sind geläufig und angemessen. „Aus Israel stammen“ gibt מִיִּשְׂרָאֵל zurück, ohne die Aussage über das vom Hebräischen Erforderliche hinaus festzulegen.
  issues:
  - severity: low
    issue: Kollektivsingular „das ganze Volk“ mit mehreren genannten Völkern
    rationale: Der hebräische Singular עָם ist kollektiv. Im modernen Deutschen ist ein pluralischer Bezug („alle Menschen … waren/stammten“) bei dieser konkreten Völkeraufzählung klarer und natürlicher.
  - severity: low
    issue: Fußnotenformulierung „und nicht aus Israel war“
    rationale: Als deutsche Wiedergabe ist sie elliptisch und unnatürlich. Als ausdrücklich gekennzeichnete wörtliche hebräische Formulierung ist sie verständlich; die Fußnote sollte dies kenntlich machen.
