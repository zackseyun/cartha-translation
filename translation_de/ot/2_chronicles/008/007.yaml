base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: de
  text: Was alle Menschen betrifft, die von den Hetitern, den Amoritern, den Perisitern, den Hiwitern und den Jebusitern übrig geblieben waren und nicht aus Israel stammten[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nicht zu Israel gehörten“. Hebräisch wörtlich: „die nicht aus Israel waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die Verbindung bezeichnet die Gesamtheit der hier betrachteten, verbliebenen nichtisraelitischen Bevölkerung. „Das ganze Volk“ bewahrt den kollektiven Singular des Hebräischen.
- source_word: הַנּוֹתָר
  choice: das … übrig geblieben war
  rationale: Das Nifal-Partizip bezeichnet die Menschen, die als Rest verblieben waren. Im deutschen Relativsatz gibt das Plusquamperfekt den rückblickenden Zusammenhang natürlich wieder.
- source_word: מִן
  choice: von
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit zu beziehungsweise Herkunft aus den anschließend genannten Völkern.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: den Hetitern, den Amoritern, den Perisitern, den Hiwitern und den Jebusitern
  rationale: Die hebräischen Singularformen sind kollektiv gebraucht; im Deutschen sind die geläufigen pluralischen Volksnamen idiomatisch und genau.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: und nicht aus Israel stammte
  rationale: Die Wiedergabe bewahrt die Herkunftsangabe mit מִן und formuliert sie in natürlichem Deutsch, ohne die Aussage unnötig auf eine bestimmte ethnische Definition festzulegen.
