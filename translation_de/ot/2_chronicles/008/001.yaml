source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: de
  text: 'Und es geschah nach Ablauf von zwanzig Jahren, in denen Salomo das Haus Jahwes und sein eigenes Haus[a] gebaut hatte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Palast“. Wörtlich steht im Hebräischen: „sein Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Erzählform leitet eine neue Entwicklung ein; die Wendung wahrt den hebräischen Erzählstil und bleibt im Deutschen verständlich und würdevoll.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: nach Ablauf von zwanzig Jahren
  rationale: Die Formulierung bezeichnet den erreichten Endpunkt eines Zeitraums und ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „am Ende von“.
- source_word: אֲשֶׁר
  choice: in denen
  rationale: Das Relativwort verknüpft den Zeitraum von zwanzig Jahren mit Salomos Bautätigkeit, ohne mehr als die zeitliche Beziehung auszudrücken.
- source_word: בָּנָה
  choice: gebaut hatte
  rationale: Das Plusquamperfekt zeigt, dass die Bautätigkeit beim genannten Zeitpunkt abgeschlossen war.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Ausdrucksweise; „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּיתוֹ
  choice: sein eigenes Haus
  rationale: „Eigenes“ verdeutlicht den Kontrast zu Jahwes Haus; das lexikalisch mögliche kontextuelle Verständnis als Palast wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bibelsprachlichem Erzählauftakt. Der Doppelpunkt wahrt, dass der Vers syntaktisch in Vers 2 weitergeführt wird.
