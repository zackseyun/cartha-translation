source:
  edition: WLC
  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: de
  text: Sie wichen in keiner Angelegenheit vom Gebot des Königs hinsichtlich der Priester und der Leviten ab, auch nicht hinsichtlich der Schatzkammern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorratsräume“. Das hebräische Wort kann Schatzkammern oder Vorratsräume bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: wichen … ab
  rationale: Das Verb סור bedeutet hier, von einer Anordnung abzuweichen. Die deutsche Wendung bewahrt das hebräische Bild und ist im Zusammenhang von Gehorsam natürlich.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: von dem Gebot des Königs
  rationale: מִצְוָה bezeichnet ein Gebot oder eine Anordnung. „Gebot“ bleibt quellennah und passt zur durchgehenden chronistischen Darstellung.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: über die Priester und die Leviten
  rationale: עַל kann hier den Gegenstandsbereich des königlichen Gebots bezeichnen. „Über“ bewahrt die knappe Formulierung und lässt offen, ob das Gebot die Gruppen selbst oder ihre Aufgaben betrifft.
- source_word: לְכָל דָּבָר
  choice: in keiner Angelegenheit
  rationale: Im Zusammenspiel mit der Verneinung bedeutet die Wendung, dass in keinem Punkt abgewichen wurde. Diese Wiedergabe ist idiomatisch und erhält den umfassenden Sinn.
- source_word: וְלָאֹצָרוֹת
  choice: auch nicht hinsichtlich der Schatzkammern
  rationale: Die Fortführung mit וְ wird im Deutschen an die negative Aussage angepasst. אֹצָרוֹת kann Schatzkammern oder Vorratsräume bezeichnen; im tempeladministrativen Kontext ist „Schatzkammern“ naheliegend, ohne die Alternative zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung stellt die umfassende Befolgung des königlichen Gebots heraus; beide Amtsgruppen werden entsprechend den hebräischen Artikeln ausdrücklich genannt.
