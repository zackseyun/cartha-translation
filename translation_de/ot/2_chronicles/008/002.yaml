source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: de
  text: 'Was die Städte betrifft, die Huram[a] Salomo gegeben hatte: Salomo baute sie wieder auf[b] und siedelte dort Israeliten an[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Huram; traditionell Hiram.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „baute sie“. Das hebräische Verb kann „bauen“ bedeuten, im Zusammenhang aber auch den Wiederaufbau oder die Wiederherstellung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: Was die Städte betrifft
  rationale: Die Konstruktion führt im erzählerischen Rückblick einen neuen Gegenstand ein; die deutsche Wendung gibt diese thematische Hervorhebung natürlich wieder.
- source_word: אֲשֶׁר נָתַן
  choice: die … gegeben hatte
  rationale: Der Relativsatz bezeichnet eine gegenüber Salomos Bautätigkeit vorausliegende Handlung; das Plusquamperfekt macht diese zeitliche Beziehung im Deutschen deutlich.
- source_word: חוּרָם
  choice: Huram
  rationale: Die Namensform folgt unmittelbar dem hebräischen חוּרָם; die traditionelle Form „Hiram“ wird in einer Fußnote genannt.
- source_word: לִשְׁלֹמֹה
  choice: Salomo
  rationale: Der Name bezeichnet mit der Präposition ל den Empfänger der Städte; im Deutschen steht das indirekte Objekt hier ohne Präposition.
- source_word: בָּנָה
  choice: baute sie wieder auf
  rationale: Das Grundverb bedeutet „bauen“. Da bereits bestehende Städte übergeben worden waren, legt der Zusammenhang Wiederaufbau oder Wiederherstellung nahe; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וַיּוֹשֶׁב
  choice: siedelte … an
  rationale: 'Die Hifil-Form ist kausativ: Salomo veranlasste, dass Menschen dort wohnten. „ansiedeln“ gibt dies idiomatisch und knapp wieder.'
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf die zuvor genannten Städte.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Wörtlich steht „die Söhne Israels“; im Zusammenhang bezeichnet die Wendung Angehörige des Volkes Israel allgemein. „Israeliten“ ist im modernen Deutsch natürlich und umfasst den korporativen Bezug.
