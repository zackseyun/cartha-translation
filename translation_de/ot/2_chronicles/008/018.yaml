  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: de
  text: Und Huram sandte ihm durch seine Diener[a] Schiffe und Diener, die sich auf dem Meer auskannten[b]. Sie kamen zusammen mit Salomos Dienern nach Ofir, holten von dort 450 Talente[c] Gold und brachten es König Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand seiner Diener“; die Wendung bezeichnet die Ausführung oder Vermittlung durch seine Diener.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „seefahrene Diener“ beziehungsweise „Seeleute“. Wörtlich: „Diener, die das Meer kannten“.'
    reason: lexical_alternative
  - marker: c
    text: Ein Talent war eine antike Gewichtseinheit, deren genauer Wert je nach Zeit und Ort schwankte.
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die übliche und kontextgerechte Wiedergabe von שלח in erzählender Prosa.
- source_word: חוּרָם
  choice: Huram
  rationale: Folgt der hebräischen Namensform an dieser Stelle; „Hiram“ ist eine geläufige Variante.
- source_word: בְּיַד עֲבָדָיו
  choice: durch seine Diener
  rationale: Gibt die hebräische Wendung wörtlich „durch die Hand seiner Diener“ in natürlichem modernem Deutsch als Vermittlung beziehungsweise Ausführung durch seine Diener wieder.
- source_word: אֳנִיּוֹת
  choice: Schiffe
  rationale: Bezeichnet hier seetüchtige Fahrzeuge für die Fahrt nach Ofir.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: Diener, die sich auf dem Meer auskannten
  rationale: Bewahrt sowohl die ausdrückliche Bezeichnung als Diener als auch ihre maritime Erfahrung, ohne sie enger als „Seeleute“ festzulegen.
- source_word: אוֹפִירָה
  choice: nach Ofir
  rationale: Das Richtungs-he bezeichnet die Bewegung auf Ofir zu.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: holten von dort
  rationale: Gibt לקח im Zusammenhang einer Expedition idiomatisch wieder, ohne die Art des Erwerbs näher zu bestimmen.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: 450 Talente Gold
  rationale: Behält die historische Gewichtseinheit bei und vermeidet eine unsichere Umrechnung in moderne Maße.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: und brachten es König Salomo
  rationale: Das Pronomen bezieht sich im Deutschen natürlich auf das als Stoffbezeichnung im Singular stehende „Gold“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung bleibt nahe am hebräischen Satzbau, löst die Wendung „durch die Hand“ jedoch idiomatisch auf. „Ofir“ folgt der im Deutschen üblichen biblischen Schreibweise.
