  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: de
  text: Dann brachten die Priester die Lade des Bundes Jahwes an ihren Platz, in den innersten Raum des Hauses, in das Allerheiligste, unter die Flügel der Cherubim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ הַכֹּהֲנִים
  choice: Dann brachten die Priester
  rationale: Das Hifil von בוא bedeutet hier „bringen“. „Dann“ gibt die fortlaufende Erzählung natürlich wieder, ohne zusätzliche Bewegungsdetails einzutragen.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe folgt der hebräischen Status-constructus-Verbindung eng, hält den Bundesbezug ausdrücklich fest und gibt den Gottesnamen als persönlichen Namen wieder.
- source_word: מְקוֹמוֹ
  choice: an ihren Platz
  rationale: Das Suffix bezieht sich auf die im Deutschen feminine „Lade“. „An ihren Platz“ bezeichnet knapp den für sie bestimmten Standort, ohne „bestimmt“ ausdrücklich hinzuzufügen.
- source_word: דְּבִיר הַבַּיִת
  choice: in den innersten Raum des Hauses
  rationale: דְּבִיר bezeichnet den innersten Tempelraum. „Innerster Raum“ ist verständlich und lässt die folgende nähere Bestimmung „das Allerheiligste“ ihre erklärende Funktion behalten; בַּיִת wird als „Haus“ bewahrt.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: in das Allerheiligste
  rationale: Die hebräische Steigerung wird mit der geläufigen, würdigen deutschen Bezeichnung für den heiligsten Tempelraum wiedergegeben.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: unter die Flügel der Kerubim
  rationale: Wegen des Bewegungsverbs ist im Deutschen der Akkusativ idiomatisch. „Kerubim“ ist die etablierte Transliteration des hebräischen Plurals.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die gestufte Ortsangabe des Hebräischen bleibt erhalten. Keine Fußnote ist erforderlich; die im englischen Konsultationstext angegebene Fußnote ist offenbar falsch platziert, da ihre Alternative zu קֹדֶשׁ הַקְּדָשִׁים und nicht zu מְקוֹמוֹ gehört, und „Allerheiligstes“ die Bedeutung im Deutschen bereits klar ausdrückt.
