  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: de
  text: König Salomo und die ganze Gemeinde Israels, die sich bei ihm versammelt hatte[a], opferten vor der Lade Kleinvieh und Rinder, die wegen ihrer großen Menge weder gezählt noch erfasst werden konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich um ihn versammelt hatte“. Die hebräische Wendung kann eine Versammlung bei Salomo oder um ihn herum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: die ganze Gemeinde Israels
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ ist im Deutschen verständlich und bewahrt den gemeinschaftlichen Sinn; „ganz“ gibt כָּל wieder.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: die sich bei ihm versammelt hatte
  rationale: Der Nifal von יעד bezeichnet das Zusammenkommen zu einer Versammlung. עָלָיו kann hier die Versammlung bei oder um Salomo bezeichnen. Wegen des grammatisch singularischen Bezugsworts „Gemeinde“ steht der Relativsatz im Singular.
- source_word: לִפְנֵי הָאָרוֹן
  choice: vor der Lade
  rationale: Die bestimmte „Lade“ ist aus dem Zusammenhang eindeutig; die Wiedergabe vermeidet die Einfügung von „Bund“, das in diesem Vers nicht ausdrücklich steht.
- source_word: מְזַבְּחִים
  choice: opferten
  rationale: Das Partizip schildert die gleichzeitig stattfindende Opferhandlung. Das deutsche Präteritum fügt sich natürlich in die Erzählung ein.
- source_word: צֹאן וּבָקָר
  choice: Kleinvieh und Rinder
  rationale: צֹאן ist der Oberbegriff für Kleinvieh, insbesondere Schafe und Ziegen, während בָּקָר Rinder bezeichnet. „Kleinvieh“ wahrt den größeren Bedeutungsumfang des Hebräischen.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: die wegen ihrer großen Menge weder gezählt noch erfasst werden konnten
  rationale: Die beiden nahezu synonymen Verben werden zur hebräischen Verstärkung getrennt wiedergegeben; מֵרֹב nennt den Grund der Unzählbarkeit.
theological_decisions: []
