source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: de
  text: So wurde das ganze Werk vollendet, das Salomo für das Haus Yahwehs ausgeführt hatte. Dann brachte Salomo die heiligen Gaben seines Vaters David[a] sowie das Silber, das Gold und alle Geräte hinein. Er legte sie in die Schatzkammern des Hauses Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von seinem Vater David geweihten Dinge“; auch: „die geweihten Gaben seines Vaters David“.'
    reason: Das hebräische קָדְשֵׁי kann heilige beziehungsweise für Gott ausgesonderte Gegenstände bezeichnen und lässt sich im Zusammenhang ausdrücklich als von David geweihte Dinge verstehen.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: So wurde … vollendet
  rationale: Die Form von שלם bezeichnet hier den Abschluss des gesamten Bau- und Ausstattungswerks; „wurde vollendet“ bewahrt den resultativen Sinn und den feierlichen Erzählton.
- source_word: כָּל הַמְּלָאכָה
  choice: das ganze Werk
  rationale: מְלָאכָה umfasst hier das gesamte Arbeits- und Bauvorhaben. „Das ganze Werk“ ist im Deutschen natürlich und wahrt den umfassenden Sinn.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Yahwehs
  rationale: „Haus“ erhält das hebräische Bild für den Tempel; die Präposition לְ wird kontextgemäß mit „für“ wiedergegeben. Der Gottesname wird als „Yahweh“ transliteriert.
- source_word: וַיָּבֵא
  choice: brachte … hinein
  rationale: Der Hifil von בוא bedeutet hier, Gegenstände in den Tempel beziehungsweise dessen Schatzräume hineinzubringen.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: die heiligen Gaben seines Vaters David
  rationale: קָדְשֵׁי bezeichnet Dinge, die für den heiligen Gebrauch ausgesondert oder geweiht wurden. „Heilige Gaben“ ist verständlich und gegenständlich, während eine Fußnote die engeren Alternativen nennt.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: das Silber, das Gold
  rationale: Die getrennte Nennung mit wiederholtem Artikel wird bewahrt und erhält den aufzählenden Rhythmus des Hebräischen.
- source_word: כָּל הַכֵּלִים
  choice: alle Geräte
  rationale: כֵּלִים ist ein breiter Ausdruck für Gegenstände oder Gerätschaften. „Geräte“ ist im modernen Deutsch verständlicher als „Gefäße“ und legt nicht fest, dass sämtliche Gegenstände Behälter waren.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: Er legte sie in die Schatzkammern
  rationale: נתן bedeutet in diesem Kontext „legen/unterbringen“; אֹצְרוֹת steht im Plural und bezeichnet mehrere Räume oder Verwahrorte für Schätze.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die Wiedergabe mit „Haus Gottes“ bewahrt sowohl das Tempelbild als auch den Wechsel von יהוה zu אֱלֹהִים im selben Vers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, statt ihn durch einen Titel zu ersetzen. So bleibt der Unterschied zu אֱלֹהִים („Gott“) im zweiten Satzteil sichtbar.
- issue: Unterschied zwischen בֵּית יְהוָה und בֵּית הָאֱלֹהִים
  choice: „Haus Yahwehs“ und „Haus Gottes“ unterscheiden
  alternative: beide Ausdrücke einheitlich mit „Tempel“ wiedergeben
  rationale: Die wechselnden Gottesbezeichnungen und das gemeinsame Bild des Hauses werden entsprechend dem Ausgangstext erhalten.
- issue: Bedeutung von קָדְשֵׁי
  choice: heilige Gaben
  alternative: die von David geweihten Dinge; Davids geweihte Gaben
  rationale: Der Ausdruck kann den Status der Gegenstände als heilig oder ihre Weihung durch David hervorheben. Der Haupttext lässt den Besitz- beziehungsweise Zuordnungsbezug stehen; die Fußnote bewahrt die ausdrücklichere Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Tempelmetapher „Haus“ und die unterschiedlichen Gottesbezeichnungen werden bewahrt. Die Satzteilung macht den langen hebräischen Inventarsatz gut verständlich, ohne seine Aufzählungsstruktur einzuebnen.
