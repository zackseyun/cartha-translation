base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: de
  text: Und alle levitischen Sänger – Asaf, Heman und Jedutun sowie ihre Söhne und ihre Brüder – waren in feines Leinen gekleidet und standen mit Zimbeln, Harfen[a] und Leiern östlich vom Altar[b]. Bei ihnen waren 120 Priester, die Trompeten bliesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »harfenartige Instrumente«. Die genaue Unterscheidung der hier genannten antiken Saiteninstrumente ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf der Ostseite des Altars«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: die Leviten, die Sänger
  rationale: Gibt die bestimmte Gruppenbezeichnung und die attributive Rollenangabe knapp und natürlich wieder.
- source_word: לְכֻלָּם
  choice: sie alle
  rationale: Betont, dass die gesamte anschließend näher bezeichnete Sängergruppe gemeint ist.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asaf, Heman und Jedutun
  rationale: Die Personennamen werden in ihren im Deutschen üblichen biblischen Formen wiedergegeben.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: sowie ihre Söhne und ihre Brüder
  rationale: Bewahrt die konkreten Verwandtschaftsbezeichnungen; im kultischen Zusammenhang können die Brüder zugleich männliche Gruppen- oder Sippenangehörige sein.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: waren in feines Leinen gekleidet
  rationale: Gibt das passive Partizip und den hochwertigen Leinenstoff in natürlichem, würdigem Deutsch wieder.
- source_word: בִּמְצִלְתַּיִם
  choice: mit Zimbeln
  rationale: Zimbeln ist die etablierte Bezeichnung für das Schlaginstrument.
- source_word: וּבִנְבָלִים
  choice: Harfen
  rationale: Konventionelle deutsche Wiedergabe von נבל; die genaue Bauart des antiken Saiteninstruments bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: וְכִנֹּרוֹת
  choice: Leiern
  rationale: Unterscheidet כִּנּוֹר von נבל entsprechend einer verbreiteten modernen instrumentenkundlichen Zuordnung.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: standen östlich vom Altar
  rationale: Gibt die adverbiale Ortsangabe präzise und in natürlicher deutscher Wortstellung wieder.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: Bei ihnen waren 120 Priester
  rationale: Ergänzt die im Deutschen erforderliche Kopula und bewahrt Zahl und Begleitverhältnis.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: die Trompeten bliesen
  rationale: Gibt die Tätigkeit der Priester idiomatisch wieder; חֲצֹצְרוֹת bezeichnet kultische Metalltrompeten.
