  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: de
  text: Als die Priester aus dem Heiligtum herauskamen – denn alle anwesenden Priester hatten sich geheiligt, ohne sich an die Abteilungen zu halten[a] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die üblichen, turnusmäßig dienenden Priesterabteilungen.
    reason: Erläuterung des institutionellen Sinns von מַחְלְקוֹת und der ungewöhnlichen Nichtbeachtung dieser Einteilung bei diesem Anlass.
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Als … herauskamen
  rationale: Die Verbindung leitet einen zeitlichen Nebensatz in der fortlaufenden Erzählung ein. Die deutsche Formulierung ist natürlich und bewahrt den noch nicht abgeschlossenen Satzbau des Verses.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Übliche und sachlich genaue Wiedergabe.
- source_word: מִן הַקֹּדֶשׁ
  choice: aus dem Heiligtum
  rationale: Im Tempelzusammenhang bezeichnet הַקֹּדֶשׁ den heiligen Tempelraum. „Heiligtum“ ist im Deutschen würdig und verständlich, ohne die genaue räumliche Zuordnung stärker festzulegen als der hebräische Ausdruck.
- source_word: כִּי
  choice: denn
  rationale: Kennzeichnet die folgende erläuternde Einschaltung.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: alle anwesenden Priester
  rationale: הַנִּמְצְאִים meint hier idiomatisch diejenigen, die zugegen bzw. verfügbar waren.
- source_word: הִתְקַדָּשׁוּ
  choice: hatten sich geheiligt
  rationale: Die reflexive Form bezeichnet die kultische Vorbereitung der Priester. „Sich heiligen“ bewahrt den Wortstamm und ist in diesem Tempelkontext verständlich.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: ohne sich an die Abteilungen zu halten
  rationale: Die Wendung besagt, dass bei diesem Anlass die gewöhnliche Einteilung der Priester nicht beachtet wurde. „Abteilungen“ gibt מַחְלְקוֹת institutionell wieder; die Fußnote erläutert den Bezug.
theological_decisions:
- issue: Kultische Vorbereitung der Priester
  choice: hatten sich geheiligt
  alternative: hatten sich geweiht
  rationale: „Sich geheiligt“ hält die Verbindung zum hebräischen Stamm קדש sichtbar und bezeichnet im Kontext rituelle Vorbereitung, ohne daraus eine Aussage über moralische Vollkommenheit zu machen.
- issue: Priesterliche Abteilungen
  choice: ohne sich an die Abteilungen zu halten
  alternative: ohne die Dienstgruppen zu beachten
  rationale: Die Übersetzung bewahrt die institutionelle, aber im Vers knapp gehaltene Bezeichnung. Die genauere Erklärung der turnusmäßigen Priestergruppen steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die erklärende Einschaltung ab; das abschließende Komma bewahrt den syntaktischen Anschluss an Vers 12. Die Formulierung vermeidet konfessionelle Sonderterminologie.
