  source_fidelity: 'Die Wiedergabe trifft den Sinn des Hebräischen insgesamt: Die Priester waren wegen der Wolke nicht imstande zu stehen bzw. ihren Dienst zu versehen; die Herrlichkeit Jahwes erfüllte das Haus Gottes. „Dastehen“ ist jedoch für לַעֲמֹד im Deutschen zu umgangssprachlich und bezeichnet nicht klar das dienstliche Stehen.'
  naturalness: „Nicht stehen, um Dienst zu tun“ ist modernes, würdiges und zugleich knappes Standarddeutsch. Es bewahrt die Verbindung von Stehen und priesterlichem Dienst besser als „nicht dastehen, um ihren Dienst zu verrichten“.
  terminology: „Jahwe“, „Herrlichkeit“ und „Haus Gottes“ sind sachgerecht. Die Fußnote bietet mit „Tempel Gottes“ die kontextuelle Alternative, ohne den hebräischen Wortlaut im Haupttext aufzugeben.
