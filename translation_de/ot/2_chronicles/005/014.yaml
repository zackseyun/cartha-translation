    rationale: Die possessive Ergänzung ist im Ausgangstext nicht ausdrücklich vorhanden, und die längere Formulierung schwächt die knappe infinitivische Verbindung „stehen, um zu dienen“ ab. „Dienst tun“ ist natürlich und präzise.
