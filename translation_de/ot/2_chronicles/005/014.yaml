base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: de
  text: Und die Priester konnten wegen der Wolke nicht stehen, um Dienst zu tun; denn die Herrlichkeit Jahwes erfüllte das Haus Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tempel Gottes“. Wörtlich: „das Haus Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: konnten
  rationale: Das Verb bezeichnet Fähigkeit oder Möglichkeit; zusammen mit לֹא ergibt sich idiomatisch „konnten nicht“.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe des bestimmten Plurals im Tempelkontext.
- source_word: לַעֲמוֹד
  choice: dastehen
  rationale: Bewahrt das konkrete Bild des Stehens und bezeichnet hier das Stehenbleiben beziehungsweise Verharren am Ort des Dienstes.
- source_word: לְשָׁרֵת
  choice: um ihren Dienst zu verrichten
  rationale: Im priesterlichen Kontext bezeichnet שׁרת den kultischen Dienst; die Formulierung ist im modernen Deutschen klar und würdig.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition drückt hier den Grund für die Unfähigkeit der Priester aus.
- source_word: הֶעָנָן
  choice: der Wolke
  rationale: Schlichte Wiedergabe des bestimmten Substantivs ohne erklärende Erweiterung.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die vorhergehende Aussage ein.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Gibt das finite Verb im erzählenden Zusammenhang natürlich wieder und bewahrt das Bild des vollständigen Erfüllens.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Die Constructusverbindung wird direkt wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Transliteriert den im hebräischen Text ausdrücklich stehenden Gottesnamen statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Bewahrt die wörtliche Metapher des Hebräischen; im Kontext ist der Tempel gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel „Herr“.
- issue: Deutung von בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: „Haus Gottes“ folgt der hebräischen Formulierung, während „Tempel Gottes“ die kontextuell richtige Bedeutung explizit macht; die Fußnote nennt diese Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch „wegen“ und „um ihren Dienst zu verrichten“ idiomatisch gestaltet. Das Semikolon markiert die mit כִּי eingeleitete Begründung.
