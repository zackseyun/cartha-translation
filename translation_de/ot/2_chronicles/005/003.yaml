  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: de
  text: So versammelten sich alle Männer Israels vor dem König zum Fest. Es war der siebte Monat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: Da versammelten sich
  rationale: Gibt die narrative Fortführung des וַ־ und die Bedeutung des Nifal von קהל natürlich wieder.
- source_word: אֶל הַמֶּלֶךְ
  choice: beim König
  rationale: Im Zusammenhang des Sichversammelns bezeichnet אֶל die Ausrichtung beziehungsweise den Versammlungsort beim König; „beim König“ ist im Deutschen idiomatisch.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Bewahrt die distributive, männlich bezeichnete Formulierung des Hebräischen, ohne sie zu verallgemeinern.
- source_word: בֶּחָג
  choice: zum Fest
  rationale: Die Präposition ב bezeichnet hier den Zeitpunkt beziehungsweise Anlass der Versammlung; „zum Fest“ ist natürlich und kontextgerecht.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: das im siebten Monat stattfindet
  rationale: Das Hebräische identifiziert beziehungsweise erläutert den Zeitpunkt des Festes knapp. Diese Wiedergabe vermeidet die im Deutschen missverständliche Gleichsetzung eines Festes mit einem Monat.
