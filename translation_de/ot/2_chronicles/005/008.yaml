  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: de
  text: Die Cherubim hielten ihre Flügel über dem Ort der Lade ausgebreitet[a], und die Cherubim bedeckten die Lade und ihre Tragstangen von oben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Cherubim spannten ihre Flügel über dem Ort der Lade aus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: breiteten ... aus
  rationale: Die Verbindung von היה mit dem Partizip beschreibt hier die anhaltende Haltung beziehungsweise Ausbreitung der Flügel; im natürlichen Deutschen gibt das Präteritum mit trennbarem Verb den Zustand im Erzählzusammenhang angemessen wieder.
- source_word: הַכְּרוּבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Bezeichnung für diese geflügelten himmlischen Wesen und bewahrt die kultische Würde des Zusammenhangs.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: breiteten ihre Flügel ... aus
  rationale: פרשׂ bezeichnet das Ausbreiten oder Ausspannen; das ergänzte Possessivpronomen ist im Deutschen natürlich und sachlich eindeutig.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: über dem Platz der Lade
  rationale: מָקוֹם wird ausdrücklich als „Platz“ wiedergegeben, statt die Wendung auf „über der Lade“ zu verkürzen; so bleibt die Unterscheidung zur folgenden ausdrücklichen Nennung der Lade erhalten.
- source_word: וַיְכַסּוּ
  choice: bedeckten
  rationale: כסה bedeutet gewöhnlich „bedecken“; die Wiedergabe vermeidet die stärker deutende Alternative „überschatteten“.
- source_word: בַּדָּיו
  choice: ihre Tragstangen
  rationale: Gemeint sind die Stangen zum Tragen der Lade. „Tragstangen“ ist präzise und in modernem Deutsch verständlicher als das bloße „Stangen“.
- source_word: מִלְמָעְלָה
  choice: von oben
  rationale: Die Form bezeichnet die räumliche Richtung beziehungsweise Lage der Bedeckung und wird unmittelbar wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „die Kerubim“ bleibt entsprechend dem Hebräischen erhalten; „Lade“ setzt den unmittelbaren Tempelkontext voraus. Die ungewöhnliche Formulierung „Platz der Lade“ wird bewusst bewahrt und durch eine lexikalische Alternative erläutert.
