- from: Die Kerubim breiteten ihre Flügel über dem Platz der Lade aus[a], und die Kerubim bedeckten die Lade und ihre Tragstangen von oben.
  to: Die Cherubim hielten ihre Flügel über dem Ort der Lade ausgebreitet[a], und die Cherubim bedeckten die Lade und ihre Tragstangen von oben.
  rationale: Die Revision stellt die anhaltende Körperhaltung der hebräischen Konstruktion mit היה und Partizip deutlicher dar, verwendet die im modernen deutschen Bibelgebrauch etablierte Bezeichnung „Cherubim“ und glättet „Platz“ zu „Ort“, ohne die ausdrücklich beibehaltene Unterscheidung zwischen dem Ort der Lade und der Lade selbst aufzugeben. Der Fußnotenanker bleibt am entsprechenden Ausdruck erhalten.
