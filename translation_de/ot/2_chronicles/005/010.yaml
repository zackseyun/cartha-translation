source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: de
  text: In der Lade befand sich nichts außer den beiden Tafeln, die Mose am Horeb hineingelegt hatte.[a] Dort schloss Jahwe mit den Israeliten[b] einen Bund, als sie aus Ägypten zogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Mose am Horeb gab«. Das hebräische Verb bedeutet gewöhnlich »geben«, bezeichnet hier aber das Hineinlegen der Tafeln in die Lade.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: In der Lade befand sich nichts außer
  rationale: Die deutsche Konstruktion »nichts außer« gibt die hebräische Verneinung mit der einschränkenden Partikel רַק idiomatisch und genau wieder.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: die beiden Tafeln
  rationale: »Tafeln« ist hier eindeutig; dass sie aus Stein waren, wird in diesem Vers nicht ausdrücklich gesagt und daher nicht ergänzt.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: die Mose … hineingelegt hatte
  rationale: נָתַן bedeutet grundsätzlich »geben«, bezeichnet in diesem räumlichen Zusammenhang aber das Hineinlegen der Tafeln in die Lade. Das Plusquamperfekt verdeutlicht den vorzeitigen Vorgang im Deutschen.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Der hebräische Ortsname Horeb bleibt erhalten und wird nicht mit Sinai harmonisiert.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: Dort schloss Jahwe mit … einen Bund
  rationale: כָּרַת ist Teil der üblichen Wendung für das Schließen eines Bundes. Obwohl בְּרִית im Satz nur mitgedacht ist, muss »einen Bund« im Deutschen ergänzt werden. »Dort« bezieht den Relativsatz natürlich auf den Horeb.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, der im modernen Deutschen üblichen Form des Tetragramms.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die Wendung bedeutet kollektiv das Volk Israel; »Israeliten« ist im modernen Deutschen natürlich und präzise.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: als sie aus Ägypten zogen
  rationale: Die temporale Infinitivkonstruktion wird idiomatisch mit »als« wiedergegeben; »aus Ägypten zogen« bewahrt den Bezug auf den Exodus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Ergänzung des im Hebräischen unausgesprochenen Bundesbegriffs
  choice: schloss … einen Bund
  alternative: schloss sich mit den Israeliten zusammen
  rationale: Die Verbindung von כָּרַת mit עִם in diesem Horeb-Kontext setzt den Bund als Gegenstand voraus. Die ausdrückliche Ergänzung im Deutschen macht die hebräische Bundesformel verständlich, ohne ihren theologischen Gehalt zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. »Jahwe« bewahrt den Gottesnamen; »Horeb« bleibt als Ortsname unverändert. Die Fußnoten dokumentieren die wörtlicheren hebräischen Formulierungen.
