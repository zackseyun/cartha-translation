  text: וַֽ/יַּאֲרִיכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הָ/אָרוֹן֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַֽ/יְהִי שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: de
  text: Die Tragstangen wurden so weit herausgezogen, dass ihre Enden von der Bundeslade her vor dem innersten Heiligtum[a] sichtbar waren; von außen aber waren sie nicht sichtbar. Dort blieben sie bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Allerheiligsten“.'
    reason: דְּבִיר kann als Bezeichnung des innersten Tempelraums traditionell mit „Allerheiligstes“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: Man zog … so weit heraus
  rationale: 'Der Hifil von ארך hat hier kausative Bedeutung: Die Stangen wurden lang gemacht beziehungsweise weit herausgezogen. Die unpersönliche Form mit „man“ bewahrt das nicht ausdrücklich genannte Subjekt und ergibt im Deutschen eine natürliche räumliche Beschreibung.'
- source_word: הַבַּדִּים
  choice: die Tragstangen
  rationale: בַּדִּים bezeichnet die zum Tragen der Bundeslade bestimmten Stangen. „Tragstangen“ ist eindeutig, modern und präziser als das allgemeinere „Stangen“.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: ihre Enden
  rationale: רָאשֵׁי bedeutet wörtlich „Köpfe“, bezeichnet bei Gegenständen aber deren Enden oder Spitzen. „Enden“ ist im Deutschen die natürliche Sachbezeichnung.
- source_word: מִן הָאָרוֹן
  choice: von der Bundeslade aus
  rationale: מִן bezeichnet den räumlichen Ausgangspunkt. Die ungewöhnliche Formulierung des Chroniktextes wird beibehalten, ohne sie nach der Parallele in 1. Könige 8,8 zu harmonisieren.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: vor dem innersten Heiligtum
  rationale: עַל־פְּנֵי wird räumlich mit „vor“ wiedergegeben. דְּבִיר bezeichnet den innersten Tempelraum; „innerstes Heiligtum“ ist verständlich und bewahrt den architektonisch-kultischen Sinn.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: von draußen aber waren sie nicht zu sehen
  rationale: Die Formulierung gibt den Gegensatz zwischen der Sichtbarkeit im Inneren und der fehlenden Sichtbarkeit nach außen idiomatisch wieder.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: Dort blieben sie bis zum heutigen Tag
  rationale: Obwohl das hebräische Verb formal im Singular steht, bezieht sich die Aussage dem Zusammenhang nach auf die Tragstangen. „Bis zum heutigen Tag“ bewahrt den zeitlichen Standpunkt des Erzählers.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz folgt der räumlichen Abfolge des Hebräischen, glättet jedoch die Satzverknüpfung für verständliches Deutsch. Die ungewöhnliche Lesart „von der Bundeslade aus“ wird gegenüber der Parallelstelle nicht harmonisiert.
