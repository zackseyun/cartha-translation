  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: de
  text: Da kamen alle Ältesten Israels, und die Leviten trugen die Lade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Bundeslade, wie aus dem Zusammenhang hervorgeht.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol von בוא führt das nächste Ereignis der Erzählung ein. „Da kamen“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: כֹּל
  choice: alle
  rationale: Das Wort bezieht sich auf die folgende Verbindung „Ältesten Israels“ und bezeichnet diese Gruppe umfassend.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: Ältesten Israels
  rationale: Die Status-constructus-Verbindung bezeichnet die anerkannten führenden Vertreter Israels. „Älteste Israels“ ist im Deutschen verständlich und sachlich genau.
- source_word: וַיִּשְׂאוּ
  choice: trugen
  rationale: נשׂא kann „heben“ oder „tragen“ bedeuten; im Zusammenhang mit dem Transport der Lade bezeichnet „trugen“ die konkrete Handlung am klarsten.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: „Leviten“ ist die geläufige und genaue deutsche Bezeichnung für die hier genannte kultische beziehungsweise stammesbezogene Gruppe.
- source_word: אֶת הָאָרוֹן
  choice: die Lade
  rationale: Im Tempelzusammenhang bezeichnet אָרוֹן die Bundeslade. Da der hebräische Vers selbst nur „die Lade“ sagt, bleibt die nähere Bestimmung aus dem Haupttext heraus und wird in einer Fußnote erläutert.
theological_decisions:
- issue: Identität der Lade
  choice: Im Haupttext steht lediglich „die Lade“.
  alternative: „die Bundeslade“ beziehungsweise „die Lade des Bundes“
  rationale: Der unmittelbare hebräische Wortlaut enthält nur הָאָרוֹן („die Lade“). Der Zusammenhang macht den Bezug auf die Bundeslade eindeutig, doch die Übersetzung bewahrt die knappe Ausdrucksweise des Ausgangstextes.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Da kamen“ bildet die fortschreitende hebräische Erzählfolge idiomatisch ab; „trugen“ ist klarer und gegenwärtiger als das gehobenere „trugen empor“ oder „nahmen auf“.
