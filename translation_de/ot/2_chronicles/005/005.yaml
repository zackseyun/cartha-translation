source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: de
  text: Sie brachten die Lade, das Zelt der Begegnung und alle heiligen Geräte, die im Zelt waren, hinauf; die levitischen Priester[a] brachten sie hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Priester, die Leviten«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: brachten hinauf
  rationale: Die Hifil-Form von עלה bezeichnet hier das Hinaufbringen der heiligen Gegenstände zum Tempel. Die Wiederholung im Hebräischen bleibt auch im Deutschen erhalten.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der Ausgangstext sagt knapp „die Lade“ und verwendet nicht die ausführlichere Bezeichnung „Bundeslade“.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung gibt beide Bestandteile des hebräischen Ausdrucks verständlich und nah am Wortlaut wieder.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: alle heiligen Geräte
  rationale: כְּלִים bezeichnet allgemein Geräte oder Gegenstände. „Geräte“ ist im Deutschen umfassender und hier natürlicher als „Gefäße“.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: die im Zelt waren
  rationale: Der Relativsatz bezeichnet den Ort der heiligen Geräte; „Zelt“ greift die unmittelbar zuvor verwendete Bezeichnung konsistent auf.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die Formulierung gibt die appositionelle hebräische Wendung in natürlichem Deutsch wieder, ohne alle Leviten zu Priestern zu erklären. Der wörtlichere Ausdruck wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Deutung von הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  alternative: die Priester, die Leviten
  rationale: Die Hauptübersetzung versteht „die Leviten“ als nähere Bestimmung der Priester. Da der hebräische Wortlaut auch als Apposition wiedergegeben werden kann und die Abgrenzung der Gruppen berührt, bleibt die wörtlichere Form in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Formulierung „brachten … hinauf“ bewahrt die auffällige Wiederholung und Richtungsangabe des hebräischen Textes; das Semikolon bildet die nachgestellte ausdrückliche Subjektnennung klar ab.
