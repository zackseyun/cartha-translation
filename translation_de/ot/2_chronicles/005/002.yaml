source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: de
  text: Damals versammelte Salomo die Ältesten Israels und alle Oberhäupter der Stämme, die Anführer der Vaterhäuser der Söhne Israels, in Jerusalem, um die Lade des Bundes Jahwes aus der Stadt Davids, das heißt Zion, heraufzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Leitet den nächsten Vorgang in der Erzählfolge ein und klingt im Deutschen natürlich und würdevoll.
- source_word: יַקְהֵיל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet das Veranlassen einer Versammlung; die transitive Form ist hier präzise und idiomatisch.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Bewahrt die übliche Bezeichnung für die anerkannte Führungsgruppe Israels.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: alle Oberhäupter der Stämme
  rationale: מַטּוֹת bezeichnet hier die Stämme; „Oberhäupter“ gibt die Leitungsfunktion von רָאשֵׁי wieder, ohne sie mit den folgenden Anführern gleichförmig zu übersetzen.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: die Anführer der Vaterhäuser
  rationale: נְשִׂיאֵי bezeichnet führende Repräsentanten; „Vaterhäuser“ wahrt die ausdrücklich väterlich-genealogische Sozialstruktur des Hebräischen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Bewahrt die genealogische und bundesgeschichtliche Ausdrucksweise des Ausgangstextes, statt sie zu einer bloßen Volksbezeichnung einzuebnen.
- source_word: אֶל יְרוּשָׁלָם
  choice: in Jerusalem
  rationale: Bei „versammeln“ bezeichnet die Präposition das Ziel beziehungsweise den Ort der Zusammenkunft; „in Jerusalem“ ist natürliches modernes Deutsch.
- source_word: לְהַעֲלוֹת
  choice: heraufzubringen
  rationale: Bewahrt die gerichtete Aufwärtsbewegung der Lade von der Davidsstadt zum Tempelbereich.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Gibt die hebräische Status-constructus-Verbindung transparent wieder und erhält den Bundesbezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: מֵעִיר דָּוִיד
  choice: aus der Stadt Davids
  rationale: Direkte und klare Wiedergabe der Herkunftsangabe.
- source_word: הִיא צִיּוֹן
  choice: das heißt Zion
  rationale: Versteht die Nominalkonstruktion als identifizierende Erläuterung zur Stadt Davids.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Umschrift wahrt den Charakter als Gottes Eigenname.
- issue: Darstellung der Verwandtschafts- und Leitungsstruktur Israels
  choice: „Vaterhäuser der Söhne Israels“ beibehalten
  alternative: „Sippen der Israeliten“
  rationale: Die formell-genealogische Struktur ist für die Zusammensetzung der versammelten Führung bedeutsam und wird daher nicht neutralisierend verallgemeinert.
- issue: Bezug von נְשִׂיאֵי הָאָבוֹת
  choice: als nähere Bestimmung der Stammesoberhäupter
  alternative: als zusätzliche, eigenständige Führungsgruppe
  rationale: Die asyndetische Stellung legt eine appositionelle Erläuterung nahe; die deutsche Kommasetzung bewahrt dies, ohne die syntaktische Beziehung übermäßig festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen erzählerischen Register. Die institutionellen Begriffe „Älteste“, „Oberhäupter“ und „Vaterhäuser“ erhalten die formelle Leitungs- und Verwandtschaftsstruktur des hebräischen Textes; unnötige Archaismen werden vermieden.
