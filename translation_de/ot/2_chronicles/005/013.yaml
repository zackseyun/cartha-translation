  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: de
  text: 'Und es geschah, als die Trompeter und Sänger eins[a] waren, um mit einer Stimme Jahwe zu loben und ihm zu danken, und als sie ihre Stimme mit Trompeten, Zimbeln und Musikinstrumenten erhoben und Jahwe lobten: »Denn er ist gut, denn seine treue Liebe[b] bleibt für immer«, da erfüllte eine Wolke das Haus, das Haus Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: »wie einer«; das heißt: einmütig bzw. im Einklang.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine verlässliche, beständige und oft bundestreue Zuwendung; traditionell wird es auch mit »Güte« oder »Barmherzigkeit« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Gibt die hebräische Eröffnung der Ereignisschilderung knapp und würdig wieder, ohne die altertümliche Wendung »es begab sich« zu verwenden.
- source_word: כְאֶחָד
  choice: wie einer
  rationale: Bewahrt das Bild gemeinschaftlichen Handelns und verbindet es mit dem unmittelbar folgenden »einzigen Klang«.
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: mit einem einzigen Klang
  rationale: Gibt den konkreten akustischen Gedanken eines einheitlichen Klangs idiomatisch wieder; der Zweck wird mit »um ... zu loben und ... zu danken« ausgedrückt.
- source_word: וּכְהָרִים קוֹל
  choice: als sie ... ihre Stimme erhoben
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Wendung; der hebräische Singular קוֹל wird als kollektive Stimme verstanden.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: mit Trompeten, Zimbeln und Musikinstrumenten
  rationale: Benennt die Instrumentengruppen klar; »Musikinstrumente« ist im Deutschen natürlicher als eine wörtliche Form wie »Instrumente des Liedes«.
- source_word: וּבְהַלֵּל לַיהוָה
  choice: 'und Jahwe lobten:'
  rationale: Bewahrt die verbale, begleitende Handlung. Der Doppelpunkt leitet den Inhalt des Lobpreises ein, ohne ein im Hebräischen nicht ausdrücklich vorhandenes »sie sagten« einzufügen.
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  choice: Denn er ist gut, denn seine treue Liebe bleibt für immer
  rationale: Gibt die liturgische Formel in natürlichem Deutsch wieder. »Treue Liebe« trägt sowohl der Zuwendung als auch der Verlässlichkeit von חֶסֶד Rechnung.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: da wurde das Haus, das Haus Jahwes, von einer Wolke erfüllt
  rationale: Erhält die betonte Apposition mit der Wiederholung von »Haus« und gibt die unbestimmte Wolke des hebräischen Textes wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im Ausgangstext ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Barmherzigkeit; beständige Liebe
  rationale: »Treue Liebe« bewahrt die Verbindung von liebevoller Zuwendung und dauerhafter Verlässlichkeit, ohne den Begriff ausschließlich auf Gefühl, Erbarmen oder eine dogmatische Kategorie einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange, feierlich ansteigende Satzbau des Hebräischen bleibt erkennbar, wird aber durch Doppelpunkt und klare temporale Gliederung lesbar gemacht. Die Wiederholung »das Haus, das Haus Jahwes« wurde bewusst erhalten.
