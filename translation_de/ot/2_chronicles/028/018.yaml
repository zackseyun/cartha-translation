  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: de
  text: Auch die Philister waren in die Städte der Schefela und des Negev von Juda eingefallen und hatten Bet-Schemesch, Ajalon, Gederot, Socho und seine Ortschaften, Timna und seine Ortschaften sowie Gimso und seine Ortschaften erobert; sie ließen sich dort nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Auch die Philister
  rationale: Die Konjunktion verbindet den Vers mit den zuvor genannten Angriffen; »Auch« gibt diese additive Fortführung im Deutschen natürlich wieder.
- source_word: פָּשְׁטוּ
  choice: waren ... eingefallen
  rationale: Das Verb bezeichnet hier einen militärischen Einfall oder Beutezug. Das Plusquamperfekt markiert den Hintergrund vor der anschließenden Aufzählung der Eroberungen.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: in die Städte der Schefela und des Negev von Juda
  rationale: Schefela und Negev werden als geografische Regionsnamen bewahrt; לִיהוּדָה bezeichnet ihre Zugehörigkeit zu Juda.
- source_word: וַיִּלְכְּדוּ
  choice: Sie eroberten
  rationale: Im Zusammenhang mit der Einnahme befestigter Orte ist »eroberten« präzise und idiomatisch.
- source_word: בֵּית שֶׁמֶשׁ / אַיָּלוֹן / הַגְּדֵרוֹת / שׂוֹכוֹ / תִּמְנָה / גִּמְזוֹ
  choice: Bet-Schemesch / Ajalon / Gederot / Socho / Timna / Gimso
  rationale: Die Ortsnamen werden in einer geläufigen deutschsprachigen Transliteration wiedergegeben.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: samt den jeweils dazugehörigen Ortschaften
  rationale: Wörtlich »ihre Töchter« ist eine feste Bezeichnung für abhängige kleinere Siedlungen. Die zusammengezogene Form vermeidet im Deutschen schwerfällige Wiederholungen, ohne den Bezug auf jeden der drei Hauptorte aufzugeben.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: und ließen sich dort nieder
  rationale: Das Verb bezeichnet hier nach der Eroberung nicht nur vorübergehenden Aufenthalt, sondern Ansiedlung beziehungsweise dauerhafte Besetzung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Geografische Fachnamen bleiben erhalten; der hebräische Siedlungsidiom wird verständlich wiedergegeben. Keine Fußnote ist nötig, da die abweichende englische Fußnote zu »Soco« offenbar nicht zur markierten Stelle im englischen Haupttext passt und lediglich eine orthografische Namensvariante betrifft.
