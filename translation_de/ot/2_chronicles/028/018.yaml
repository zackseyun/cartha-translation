  to: Auch die Philister waren in die Städte der Schefela und des Negev von Juda eingefallen und hatten Bet-Schemesch, Ajalon, Gederot, Socho und seine Ortschaften, Timna und seine Ortschaften sowie Gimso und seine Ortschaften erobert; sie ließen sich dort nieder.
