  text: וְ/עַתָּ֣ה שְׁמָע֔וּ/נִי וְ/הָשִׁ֨יבוּ֙ הַ/שִּׁבְיָ֔ה אֲשֶׁ֥ר שְׁבִיתֶ֖ם מֵ/אֲחֵי/כֶ֑ם כִּ֛י חֲר֥וֹן אַף יְהוָ֖ה עֲלֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: de
  text: Hört nun auf mich und bringt die Gefangenen zurück, die ihr aus der Mitte eurer Brüder gefangen genommen habt[a]; denn der glühende Zorn Jahwes liegt auf euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus euren israelitischen Volksgenossen“. Wörtlich steht im Hebräischen „aus euren Brüdern“; die Verwandtschaftssprache bezeichnet hier Angehörige desselben Bundesvolkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: nun
  rationale: Leitet im direkten Redekontext einen dringlichen Übergang ein; „nun“ ist im Deutschen natürlich und bewahrt den auffordernden Ton.
- source_word: שְׁמָעוּנִי
  choice: Hört ... auf mich
  rationale: Der Imperativ von שׁמע mit Suffix verlangt aufmerksames, gehorsames Hören. „Hört auf mich“ gibt diese Aufforderung im heutigen Deutsch idiomatisch wieder.
- source_word: וְהָשִׁיבוּ
  choice: bringt ... zurück
  rationale: Der Hifil von שוב bedeutet hier, jemanden zurückkehren zu lassen bzw. zurückzubringen. Die deutsche Wendung passt natürlich zu den Gefangenen als Objekt.
- source_word: הַשִּׁבְיָה
  choice: die Gefangenen
  rationale: Das Kollektiv bezeichnet in diesem Zusammenhang die im Krieg gefangen genommenen Menschen, nicht abstrakt den Zustand der Gefangenschaft.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: die ihr ... weggeführt habt
  rationale: Die Relativkonstruktion bezeichnet diejenigen, welche die Angeredeten gefangen genommen haben. „Weggeführt“ vermeidet die schwerfällige Wiederholung „Gefangene, die ihr gefangen genommen habt“ und macht die konkrete Folge der Gefangennahme deutlich.
- source_word: מֵאֲחֵיכֶם
  choice: von euren Brüdern
  rationale: Bewahrt die verwandtschaftliche Ausdrucksweise des Hebräischen. Im Kontext sind damit Angehörige desselben Bundesvolkes gemeint; diese weitere Bedeutung wird in der Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Führt die Begründung für die vorausgehende Aufforderung ein und gibt den argumentativen Zusammenhang knapp wieder.
- source_word: חֲרוֹן אַף
  choice: der glühende Zorn
  rationale: Bewahrt das hebräische Bild von Hitze bzw. Brennen und zugleich die Intensität des Zorns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֲלֵיכֶם
  choice: liegt auf euch
  rationale: Bewahrt das räumliche Bild der Präposition על und bringt zugleich zum Ausdruck, dass sich der Zorn gegen die Angeredeten richtet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ wahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von „Brüder“
  choice: wörtliche Verwandtschaftssprache im Text, gemeinschaftliche Bedeutung in der Fußnote
  alternative: eure israelitischen Volksgenossen
  rationale: Die Formulierung bezeichnet hier Mitglieder desselben Bundesvolkes, verwendet dafür aber bewusst Verwandtschaftssprache. Die Übersetzung bewahrt beides, ohne die Zugehörigkeit ausschließlich biologisch zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Pluralimperativ bleibt deutlich und dringlich. Die leicht bildhafte Formulierung „der glühende Zorn ... liegt auf euch“ wahrt die Intensität und Metaphorik des Hebräischen.
