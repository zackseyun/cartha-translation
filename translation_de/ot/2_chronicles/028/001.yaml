id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: de
  text: Ahas war zwanzig Jahre alt, als er König wurde, und regierte sechzehn Jahre lang in Jerusalem. Er tat nicht, was in den Augen Jahwes recht war, wie es sein Vater David[a] getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater“ bedeutet hier königlicher Vorfahr; David war nicht der unmittelbare Vater von Ahas.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: war zwanzig Jahre alt
  rationale: Die hebräische Altersformel wird so im modernen Deutschen natürlich und genau wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt des Regierungsantritts; diese Formulierung ist idiomatisches modernes Deutsch.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: und regierte sechzehn Jahre lang
  rationale: מָלַךְ bezeichnet das Ausüben der Königsherrschaft; „Jahre lang“ verdeutlicht im Deutschen die Zeitdauer.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe und des Regierungssitzes.
- source_word: וְלֹא עָשָׂה הַיָּשָׁר
  choice: Er tat nicht, was … recht war
  rationale: Bewahrt die übliche moralische Bewertungsformel der Chronik in natürlichem Deutsch.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die bildhafte hebräische Wendung wird erhalten und als göttliche Beurteilung verständlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen mit der etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כְּדָוִיד אָבִיו
  choice: wie es sein Vater David getan hatte
  rationale: Der Vergleich wird durch die aus dem vorherigen Satzteil erschlossene Verbform natürlich ausgedrückt; „Vater“ bewahrt die dynastische Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Form.
- issue: Bedeutung von אָבִיו bei David
  choice: sein Vater David, mit Fußnotenerklärung
  alternative: sein Vorfahr David
  rationale: „Vater“ erhält die königlich-dynastische Ausdrucksweise und die Nähe zum hebräischen Wortlaut; die Fußnote verhindert das Missverständnis, David sei Ahas’ unmittelbarer Vater gewesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle regnalische Form bleibt klar erkennbar; der hebräische Gottesname und die Wendung „in den Augen“ werden bewahrt.
