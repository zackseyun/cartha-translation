  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: de
  text: Ahas sammelte die Geräte des Hauses Gottes ein und zerlegte die Geräte des Hauses Gottes in Stücke. Er verschloss die Türen des Hauses des HERRN und errichtete sich an jeder Ecke Jerusalems Altäre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: sammelte … ein
  rationale: Gibt das Einsammeln beziehungsweise Zusammenbringen der Tempelgeräte natürlich und präzise wieder.
- source_word: וַיְקַצֵּץ
  choice: zerschlug
  rationale: Das Verb bezeichnet hier ein gewaltsames Zerteilen oder Zerstören; „zerschlug“ ist im Zusammenhang mit Geräten idiomatisch, ohne die genaue Art der Zerlegung unnötig festzulegen.
- source_word: כְּלֵי
  choice: Geräte
  rationale: „Geräte“ ist die übliche, verständliche Bezeichnung für die kultischen Gegenstände beziehungsweise Gerätschaften des Tempels.
- source_word: בְּכָל־פִּנָּה
  choice: an jeder Straßenecke
  rationale: „Ecke“ meint im städtischen Kontext naheliegend Straßenecken; die Wiedergabe macht das Bild im modernen Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERRN
  alternative: JHWH
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen bewahrt die Unterscheidung zum Titel „Herr“, ohne eine unsichere Aussprache festzuschreiben.
- issue: Wiederholung von „die Geräte des Hauses Gottes“
  choice: vollständig beibehalten
  alternative: im zweiten Satzteil durch ein Pronomen ersetzen
  rationale: Die markante Wiederholung des Hebräischen wird bewahrt und unterstreicht Ahas’ gezieltes Vorgehen gegen den Tempel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge der Handlungen zu verändern. Die Wiederholung des Ausgangstextes bleibt erhalten.
