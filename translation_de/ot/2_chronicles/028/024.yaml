revisions:
- from: Ahas sammelte die Geräte des Hauses Gottes ein und zerschlug die Geräte des Hauses Gottes. Er verschloss die Türen des Hauses des HERRN und errichtete sich Altäre an jeder Straßenecke Jerusalems.
  to: Ahas sammelte die Geräte des Hauses Gottes ein und zerlegte die Geräte des Hauses Gottes in Stücke. Er verschloss die Türen des Hauses des HERRN und errichtete sich an jeder Ecke Jerusalems Altäre.
  rationale: Die Revision ersetzt zwei vermeidbare Konkretisierungen durch Formulierungen, die die Bedeutung und Wiederholung des hebräischen Textes genauer bewahren. Satzteilung, Register und die traditionelle Gottesnamenswiedergabe bleiben bestehen.
