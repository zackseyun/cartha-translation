id: 2CH.28.19
reference: 2 Chronicles 28:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: de
  text: Denn Jahwe demütigte Juda wegen Ahas, des Königs von Israel[a]; denn er hatte in Juda zügellos gehandelt[b] und schwere Untreue gegen Jahwe begangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Hebräischen: „Ahas, König von Israel“. Ahas war König von Juda; die Formulierung des Chronisten wird hier nicht angeglichen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „hatte in Juda alle Zügel schießen lassen“ oder „hatte in Juda Unordnung verursacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: demütigte
  rationale: Das Hifil von כנע bezeichnet hier, dass Jahwe Juda erniedrigte beziehungsweise in eine niedrige Lage brachte. „Demütigte“ wahrt den kausativen und theologischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּעֲבוּר
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund für Judas Erniedrigung; „wegen“ ist im Deutschen knapp und eindeutig kausal.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  rationale: Der masoretische Text nennt Ahas ausdrücklich „König von Israel“. Diese spannungsvolle Formulierung wird nicht historisch harmonisiert.
- source_word: הִפְרִיעַ
  choice: hatte zügellos gehandelt
  rationale: Das Hifil von פרע kann ungehemmtes, ordnungsauflösendes Handeln oder das Loslassen von Zügeln bezeichnen. „Zügellos gehandelt“ ist natürliches Deutsch, während eine Fußnote die kausativere Deutungsmöglichkeit offenhält.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: ב bezeichnet den Bereich, in dem Ahas handelte.
- source_word: וּמָעוֹל מַעַל
  choice: und schwere Untreue … begangen
  rationale: Die Verbindung von Infinitivus absolutus und finiter Form desselben Stammes verstärkt מעל, das besonders den treulosen Bruch einer Bindung bezeichnet. „Schwere Untreue begangen“ gibt sowohl die Intensivierung als auch den Bundesbezug verständlich wieder.
- source_word: בַּיהוָה
  choice: gegen Jahwe
  rationale: Bei מעל bezeichnet ב die Person, gegen die sich der Treuebruch richtet; im Deutschen ist „gegen“ idiomatisch.
theological_decisions:
- issue: Ahas wird als „König von Israel“ bezeichnet
  choice: Die Lesart des masoretischen Textes bleibt im Haupttext unverändert erhalten.
  alternative: Historisch harmonisierend „König von Juda“ übersetzen.
  rationale: Ahas regierte zwar Juda, doch der hebräische Text lautet ausdrücklich „König von Israel“. Die möglicherweise rhetorische oder theologisch bedeutsame Spannung darf nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der begründenden Doppelstruktur des Hebräischen. „Zügellos gehandelt“ vermeidet eine unnatürliche wörtliche Wendung; die genuine Bedeutungsbreite des Verbs wird in der Fußnote bewahrt.
