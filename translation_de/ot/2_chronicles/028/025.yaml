base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: de
  text: Und in jeder einzelnen Stadt Judas errichtete er Kulthöhen, um anderen Göttern Rauchopfer darzubringen, und er reizte Jahwe, den Gott seiner Vorfahren, zum Zorn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: Und in jeder einzelnen Stadt Judas
  rationale: Die Wiederholung עִיר וָעִיר hat distributive und nachdrückliche Kraft. „In jeder einzelnen Stadt“ gibt diese umfassende Bedeutung natürlich wieder; לִיהוּדָה bezeichnet die Zugehörigkeit der Städte zu Juda.
- source_word: עָשָׂה בָמוֹת
  choice: errichtete er Kulthöhen
  rationale: עשה ist allgemein „machen“, bezeichnet bei Anlagen aber idiomatisch ihr Errichten. „Kulthöhen“ gibt den religiösen Sinn von בָּמוֹת klar wieder, ohne eine tatsächliche Höhenlage jedes Heiligtums vorauszusetzen.
- source_word: לְקַטֵּר
  choice: um … Opferrauch aufsteigen zu lassen
  rationale: Das Piel von קטר kann sowohl das Verbrennen von Räucherwerk als auch das Aufsteigenlassen von Opferrauch bezeichnen. Die gewählte Formulierung bewahrt diese weitere kultische Bedeutung.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Wörtliche und natürliche Wiedergabe; „fremden Göttern“ würde eine zusätzliche ethnische Nuance eintragen.
- source_word: וַיַּכְעֵס אֶת יְהוָה
  choice: So reizte er Jahwe … zum Zorn
  rationale: Das Hifil von כעס bedeutet, jemanden zum Zorn zu reizen. „So“ bringt den Folgezusammenhang des וַ־ idiomatisch zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: den Gott seiner Vorfahren
  rationale: „Vorfahren“ ist im modernen Deutschen natürlich und umfasst die genealogische Bedeutung von אָבוֹת, ohne den Sinn auf die unmittelbaren Väter einzuengen.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Kultische Bedeutung von לְקַטֵּר
  choice: Opferrauch aufsteigen zu lassen
  alternative: Räucherwerk zu verbrennen
  rationale: Das Verb kann Räucherwerk bezeichnen, ist aber nicht zwingend darauf beschränkt. Die weitere Wiedergabe vermeidet eine unbegründete Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nachdrückliche distributive Wiederholung des Hebräischen wird mit „jeder einzelnen Stadt“ idiomatisch bewahrt. „Kulthöhen“ ist fachlich präzise, aber für heutige Leser verständlich; „Vorfahren“ wirkt natürlicher als das missverständliche „Väter“.
