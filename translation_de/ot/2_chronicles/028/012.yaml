  terminology: „Ephraim“ statt „Ephraimiten“ im Haupttext folgt der hebräischen Gruppenbezeichnung ebenso gut und ist in der Verbindung mit „führenden Männern“ idiomatischer. Die etablierten deutschen Namensformen Asarja, Berechja, Hiskia und Amasa sind passend. Die Fußnote bewahrt die wörtliche hebräische Formulierung und ihr Anker ist korrekt.
