  text: וַ/יָּקֻ֨מוּ אֲנָשִׁ֜ים מֵ/רָאשֵׁ֣י בְנֵֽי אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן יְהֽוֹחָנָן֙ בֶּרֶכְיָ֣הוּ בֶן מְשִׁלֵּמ֔וֹת וִֽ/יחִזְקִיָּ֨הוּ֙ בֶּן שַׁלֻּ֔ם וַ/עֲמָשָׂ֖א בֶּן חַדְלָ֑י עַל הַ/בָּאִ֖ים מִן הַ/צָּבָֽא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: de
  text: 'Da traten einige der führenden Männer Ephraims[a] denen entgegen, die vom Heer kamen: Asarja, der Sohn Johanans, Berechja, der Sohn Meschillemots, Hiskia, der Sohn Schallums, und Amasa, der Sohn Hadlais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer von den Häuptern der Söhne Ephraims“.'
    reason: Bewahrt die wörtliche hebräische Formulierung hinter der idiomatischen Wiedergabe „führende Männer Ephraims“.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da traten ... entgegen
  rationale: Das narrative Qal wayyiqtol von קום bezeichnet hier ein entschlossenes Auftreten; zusammen mit עַל gibt „entgegentreten“ die kontextuelle Konfrontation natürlich wieder.
- source_word: אֲנָשִׁים
  choice: einige Männer
  rationale: Der unbestimmte Plural führt eine Teilgruppe innerhalb der ephraimitischen Führung ein.
- source_word: מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: von den führenden Männern der Ephraimiten
  rationale: רָאשֵׁי bezeichnet anerkannte Häupter beziehungsweise führende Personen; „Ephraimiten“ gibt die ethnische Wendung בְנֵי אֶפְרַיִם in natürlichem modernem Deutsch wieder.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Asarja ... Berechja ... Hiskia ... Amasa
  rationale: Die Personennamen werden nach etablierten deutschen Bibelnamensformen wiedergegeben.
- source_word: בֶן
  choice: der Sohn
  rationale: Übliche deutsche Wiedergabe der patronymischen Angabe.
- source_word: עַל
  choice: entgegen
  rationale: Mit קום drückt עַל in diesem Zusammenhang Widerstand beziehungsweise Konfrontation aus; die verbale Fügung „jemandem entgegentreten“ ist präziser und natürlicher als ein isoliertes „gegen“.
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: die vom Heer zurückkamen
  rationale: Das substantivierte Partizip bezeichnet die vom Feldzug herankommenden Soldaten. „Zurückkamen“ macht die im Kontext erkennbare Rückkehr deutlich, während „Heer“ צָבָא als militärische Streitmacht wiedergibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt übersichtlich; traditionelle deutsche Formen der biblischen Eigennamen werden verwendet. Die Konfrontation wird idiomatisch durch „entgegentreten“ ausgedrückt.
