  source_fidelity: 'Die Konfrontation wird zutreffend wiedergegeben: וַיָּקֻמוּ ... עַל bedeutet hier, dass die genannten Ephraimiter den vom Heer Kommenden entgegentraten. Die vier Namen und Patronymika sind vollständig. „Zurückkamen“ ist jedoch gegenüber הַבָּאִים מִן־הַצָּבָא etwas spezifischer, da das Hebräische lediglich „die vom Heer Kommenden“ sagt; der Kontext legt Rückkehr nahe, doch der Vers selbst formuliert sie nicht ausdrücklich.'
