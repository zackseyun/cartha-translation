  text: וַ/יֵּ֕לֶךְ בְּ/דַרְכֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֧ם מַסֵּכ֛וֹת עָשָׂ֖ה לַ/בְּעָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: de
  text: Er ging auf den Wegen der Könige Israels und fertigte auch Gussbilder[a] für die Baale[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Bilder, die durch Gießen hergestellt wurden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „für die Baale“. Der hebräische Text verwendet den Plural; gemeint sein können verschiedene örtliche Erscheinungsformen oder kultische Darstellungen des Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Er ging
  rationale: Die wörtliche Bewegungsaussage gehört hier zur hebräischen Metapher für Lebensführung. „Er ging“ bewahrt dieses Bild und verbindet sich im Deutschen natürlich mit „auf den Wegen“.
- source_word: בְּדַרְכֵי
  choice: auf den Wegen
  rationale: Der Plural bezeichnet bildhaft die Verhaltensweisen und religiösen Praktiken der Könige Israels; die deutsche Wendung erhält die Metapher.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die Genitivverbindung gibt den historischen Bezug knapp und eindeutig wieder.
- source_word: וְגַם
  choice: und … auch
  rationale: Die Partikel kennzeichnet das Anfertigen der Bilder als zusätzlichen Vorwurf.
- source_word: מַסֵּכוֹת
  choice: Gussbilder
  rationale: Das Wort bezeichnet durch Gießen hergestellte Bilder. „Gussbilder“ ist präzise, verständlich und vermeidet die unspezifische Wiedergabe „Götzenbilder“.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: Im Zusammenhang mit Gussbildern bezeichnet das Verb deren Herstellung; „anfertigen“ ist im modernen Deutschen idiomatischer als das allgemeinere „machen“.
- source_word: לַבְּעָלִים
  choice: für die Baale
  rationale: Die Wiedergabe bewahrt sowohl die Präposition als auch den ausdrücklichen Plural des hebräischen Textes.
theological_decisions:
- issue: Plural von בְּעָלִים
  choice: die Baale
  alternative: Baal; die Baalsgötter
  rationale: Der hebräische Plural wird nicht zum Singular vereinheitlicht. So bleibt offen, ob verschiedene örtliche Erscheinungsformen, Kultgestalten oder Darstellungen des Baal gemeint sind.
- issue: Weg-Metapher für die Lebensführung
  choice: Er ging auf den Wegen der Könige Israels
  alternative: Er folgte den Praktiken der Könige Israels
  rationale: Die im Hebräischen erkennbare moralische Weg-Metapher bleibt erhalten, ohne ihre Bedeutung durch eine erklärende Paraphrase festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter biblischer Weg-Metapher. „Gussbilder“ ist fachlich präzise und dennoch allgemein verständlich; der ungewohnte Plural „Baale“ wird durch eine Fußnote erläutert.
