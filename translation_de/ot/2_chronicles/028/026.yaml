base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: de
  text: Seine übrigen Taten und alle seine Wege, die früheren wie die späteren – siehe, sie sind im Buch der Könige von Juda und Israel aufgeschrieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Die übrigen Taten von ihm
  rationale: יֶתֶר bezeichnet das noch verbleibende Material; דְּבָרִים meint in der königlichen Schlussformel die Taten beziehungsweise Angelegenheiten des Königs, nicht bloß seine Worte. „Von ihm“ vermeidet im Deutschen eine missverständliche Zuordnung des Possessivpronomens zu den Taten.
- source_word: וְכָל דְּרָכָיו
  choice: und sein ganzer Lebensweg
  rationale: דֶּרֶךְ bezeichnet bildlich den Lebenswandel oder die Lebensführung. Der Singular „Lebensweg“ gibt die hebräische Wegmetapher natürlich und umfassend wieder.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: die früheren wie die späteren
  rationale: Die beiden Adjektive beziehen sich auf Taten und Lebensführung in den früheren und späteren Abschnitten seiner Herrschaft. Diese Wiedergabe bewahrt die chronologische Gegenüberstellung, ohne das im Deutschen missverständliche „die ersten und die letzten“.
- source_word: הִנָּם כְּתוּבִים
  choice: sind … aufgeschrieben
  rationale: הִנָּם weist nachdrücklich auf die vorhandene schriftliche Überlieferung hin. In der deutschen Quellenformel vermittelt „sind … aufgeschrieben“ dies natürlich; ein zusätzliches „siehe“ wäre hier schwerfällig.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich „auf/über“ bedeuten kann, verlangt die bibliografische Formel im Deutschen idiomatisch „im Buch“. סֵפֶר kann Buch oder Schriftrolle bezeichnen; „Buch“ ist hier die verständliche konventionelle Wiedergabe.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: der Könige von Juda und Israel
  rationale: Die Genitivfügung bezeichnet die angeführte Geschichtsquelle. Die Großschreibung von „Buch“ folgt der Behandlung als Werktitel.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die historiografische Schlussformel bleibt erkennbar, wird aber ohne archaisches „siehe“ oder unnatürliches „die ersten und die letzten“ formuliert.
