- from: Die übrigen Taten von ihm und sein ganzer Lebensweg, die früheren wie die späteren, sind im Buch der Könige von Juda und Israel aufgeschrieben.
  to: Seine übrigen Taten und alle seine Wege, die früheren wie die späteren – siehe, sie sind im Buch der Könige von Juda und Israel aufgeschrieben.
  rationale: Die Revision ergänzt die im Hebräischen ausdrücklich gesetzte Hinweispartikel, ersetzt eine unidiomatische deutsche Possessivfügung und bewahrt den Plural sowie die Metapher von דְּרָכָיו. Die chronologische Merismusformel und die bibliografische Quellenangabe bleiben erhalten.
