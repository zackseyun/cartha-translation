source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: de
  text: So gab Jahwe, sein Gott, ihn in die Hand des Königs von Aram[a]. Die Aramäer schlugen ihn, nahmen eine große Zahl Gefangener von ihm mit und brachten sie nach Damaskus. Er wurde auch in die Hand des Königs von Israel gegeben, der ihm eine schwere Niederlage beibrachte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Königs von Syrien“; hebräisch: „Aram“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der ihm einen großen Schlag versetzte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: gab ihn in die Hand
  rationale: Die Verbindung נתן mit בְּיַד bezeichnet die Auslieferung in die Gewalt eines anderen. Die deutsche Wendung bewahrt das hebräische Bild und bleibt verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Die Possessivverbindung wird direkt wiedergegeben; dadurch bleibt die Beziehungsaussage auch im Gerichtszusammenhang erhalten.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Aram gibt den hebräischen Eigennamen wieder; die geläufige Alternative „Syrien“ wird in einer Fußnote genannt.
- source_word: וַיַּכּוּ בוֹ
  choice: Die Aramäer schlugen ihn
  rationale: Das pluralische Subjekt ist sinngemäß das Heer beziehungsweise die Leute des Königs von Aram. Die explizite Wiederaufnahme vermeidet im Deutschen einen unklaren Numeruswechsel.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: nahmen eine große Zahl Gefangener von ihm mit
  rationale: שִׁבְיָה kann Gefangenschaft oder die Menge der Gefangenen bezeichnen. Die konkrete Wiedergabe passt zum anschließenden Transport nach Damaskus.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: brachten sie nach Damaskus
  rationale: Das im Hebräischen unausgedrückte Objekt wird aus dem unmittelbaren Kontext als die Gefangenen ergänzt.
- source_word: נִתָּן ... בְּיַד
  choice: wurde ... in die Hand ... gegeben
  rationale: Das Passiv bewahrt den Rückbezug auf Gottes zuvor ausdrücklich genannte Urheberschaft und zugleich die hebräische Wiederholung von נתן.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: brachte ihm eine schwere Niederlage bei
  rationale: מַכָּה גְדוֹלָה bezeichnet im militärischen Zusammenhang einen verheerenden Schlag beziehungsweise eine schwere Niederlage. Natürliches Deutsch erhält den Sinn besser als die wörtliche Formulierung „schlug ihn mit einem großen Schlag“.
theological_decisions:
- issue: Göttliche Urheberschaft der Niederlage
  choice: Die erste Klausel nennt Jahwe ausdrücklich als den, der ihn in die Gewalt des Königs von Aram gibt; das folgende Passiv bleibt stehen.
  alternative: Die Ereignisse ausschließlich als politische oder militärische Niederlagen formulieren.
  rationale: Die zweimalige Verwendung von נתן rahmt die Niederlagen als göttliches Gericht. Diese Kausalität darf nicht abgeschwächt, aber auch nicht über den Wortlaut hinaus erläutert werden.
- issue: Bezug des Singularpronomens „ihn“
  choice: Der Singular des hebräischen Textes bleibt erhalten.
  alternative: Explizit „Ahas“ oder „Juda“ einsetzen.
  rationale: Der unmittelbare Kontext identifiziert den Bezug, doch der Vers selbst nennt ihn nicht erneut. Die Übersetzung bewahrt daher die anaphorische Form und vermeidet eine unnötige Festlegung.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: יְהוָה steht als persönlicher Gottesname im Ausgangstext; „Jahwe“ bewahrt diesen Namenscharakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden für klare Referenzen behutsam gegliedert. Das hebräische Bild „in die Hand geben“ bleibt erhalten; die unidiomatische figura etymologica am Versende wird sinngemäß als schwere militärische Niederlage wiedergegeben.
