source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: de
  text: Er verbrannte auch Räucherwerk im Tal Ben-Hinnom und verbrannte seine Söhne im Feuer[a], entsprechend den abscheulichen Bräuchen der Völker, die Jahwe vor den Israeliten vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ seine Söhne durchs Feuer gehen“. Wörtlicher sagt der hebräische Text hier: „verbrannte seine Söhne im Feuer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: verbrannte Räucherwerk
  rationale: Der Hifil von קטר bezeichnet das Aufsteigenlassen von Opferrauch, häufig durch das Verbrennen von Räucherwerk. Die Formulierung ist im kultischen Zusammenhang klar und natürlich, ohne eine bestimmte Art von Opfergabe stärker festzulegen als nötig.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: im Tal Ben-Hinnom
  rationale: Die Wendung ist ein Ortsname. „Ben-Hinnom“ bewahrt den hebräischen Namen; „Gehenna“ würde spätere Vorstellungen in den historischen Zusammenhang eintragen.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: und verbrannte seine Söhne im Feuer
  rationale: בער im Hifil bezeichnet zusammen mit „im Feuer“ am unmittelbarsten ein tatsächliches Verbrennen. „Söhne“ gibt den maskulinen Plural בָּנָיו genau wieder. Die mögliche traditionelle Deutung als ein Hindurchgehenlassen durch das Feuer wird in der Fußnote erhalten.
- source_word: כְּתוֹעֲבוֹת
  choice: entsprechend den abscheulichen Bräuchen
  rationale: תועבות bezeichnet Abscheuliches beziehungsweise verwerfliche Praktiken. „Abscheuliche Bräuche“ gibt die moralische Wertung wieder und klingt im Deutschen natürlicher als das substantivische „gemäß den Gräueln“.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: Im historischen Zusammenhang sind die Völker gemeint, die zuvor das Land bewohnten. „Völker“ ist sachlich und vermeidet die mögliche religiöse Engführung von „Heiden“.
- source_word: הֹרִישׁ
  choice: vertrieben hatte
  rationale: Der Hifil von ירש bezeichnet hier, dass Jahwe die früheren Bewohner aus ihrem Besitz beziehungsweise aus dem Land verdrängte. „Vertrieben hatte“ gibt zudem die Vorzeitigkeit gegenüber Ahas' Handeln idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: Die hebräische Wendung bezeichnet die Vertreibung aus der Gegenwart beziehungsweise vor dem Vorrücken der Israeliten. „Vor den Israeliten“ ist präzise und im modernen Deutschen natürlicher als „vor den Söhnen Israels“.
theological_decisions:
- issue: Ob die Beschreibung des Kinderopfers zu einer weniger ausdrücklichen Formulierung abgeschwächt werden soll
  choice: 'Der Haupttext sagt: „verbrannte seine Söhne im Feuer“.'
  alternative: „ließ seine Söhne durchs Feuer gehen“
  rationale: Hier steht בער und nicht die andernorts gebräuchliche Formel העביר באש. Deshalb bewahrt der Haupttext die stärkere, unmittelbarere Aussage; die verbreitete alternative Wiedergabe wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der hebräischen Struktur, verwendet aber mit „abscheulichen Bräuchen“ und „Israeliten“ natürliche heutige Ausdrucksweisen. Die Wiederholung von „verbrannte“ wird bewusst beibehalten, weil sie die beiden unterschiedlichen, aber im Hebräischen eng aufeinanderfolgenden Verbrennungshandlungen markant wiedergibt.
