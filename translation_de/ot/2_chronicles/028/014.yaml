source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב הֶֽ/חָל֗וּץ אֶת הַ/שִּׁבְיָה֙ וְ/אֶת הַ/בִּזָּ֔ה לִ/פְנֵ֥י הַ/שָּׂרִ֖ים וְ/כָל הַ/קָּהָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: de
  text: Da ließen die bewaffneten Männer die Gefangenen und die Beute vor den führenden Männern und der ganzen Versammlung zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: ließen … zurück
  rationale: עזב bedeutet hier, dass die bewaffneten Männer die Gefangenen und die Beute aus ihrer Gewalt entließen beziehungsweise den Verantwortlichen überließen. „Zurücklassen“ gibt die konkrete Handlung natürlich wieder, ohne ein endgültiges Verlassen zu unterstellen.
- source_word: הֶחָלוּץ
  choice: die bewaffneten Männer
  rationale: Die substantivische Form bezeichnet die zum Kampf ausgerüsteten Männer. Diese Wiedergabe ist verständlich und wahrt den militärischen Zusammenhang.
- source_word: הַשִּׁבְיָה
  choice: die Gefangenen
  rationale: Das Substantiv kann abstrakt „Gefangenschaft“ bedeuten, bezeichnet hier jedoch konkret die im Krieg gefangen genommenen Menschen.
- source_word: הַבִּזָּה
  choice: die Beute
  rationale: Das Wort bezeichnet im Krieg erbeutete Güter. „Beute“ ist im modernen Deutschen die geläufige und sachlich passende Entsprechung.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition kann sowohl die räumliche Lage als auch das Handeln in Gegenwart der Verantwortlichen ausdrücken; „vor“ bewahrt diese Offenheit knapp.
- source_word: הַשָּׂרִים
  choice: den führenden Männern
  rationale: שׂרים bezeichnet hier anerkannte Autoritätspersonen. „Führende Männer“ ist kontextgerecht und vermeidet die mögliche Fehlvorstellung königlicher Söhne bei „Fürsten“ oder ausschließlich militärischer Amtsträger.
- source_word: כָל הַקָּהָל
  choice: der ganzen Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft. „Die ganze Versammlung“ ist neutral, verständlich und gibt כָל idiomatisch wieder.
theological_decisions: []
