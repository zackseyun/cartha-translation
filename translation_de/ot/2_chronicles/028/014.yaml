  source_fidelity: 'Der deutsche Text gibt die hebräische Satzstruktur und sämtliche Sinnelemente zuverlässig wieder: Die bewaffneten Männer lassen sowohl die Gefangenen als auch die Beute vor den Amtsträgern und der gesamten Versammlung zurück. „Vor“ bewahrt die räumliche wie auch die öffentliche Nuance von לִפְנֵי. Die konkrete Wiedergabe von הַשִּׁבְיָה als „die Gefangenen“ ist im Kontext zutreffend.'
  naturalness: „Da ließen die bewaffneten Männer die Gefangenen und die Beute vor den führenden Männern und der ganzen Versammlung zurück“ ist verständliches, modernes Standarddeutsch und dem würdevoll-narrativen Register angemessen. Die Wortstellung ist leicht hebraisierend, aber im Deutschen völlig idiomatisch und dient der transparenten Satzentsprechung.
  terminology: „Bewaffnete Männer“, „Gefangene“, „Beute“ und „Versammlung“ sind treffende und neutrale Wiedergaben. „Führende Männer“ gibt שָׂרִים als männliche Autoritätspersonen angemessen wieder, ohne die Rolle unzulässig auf Fürsten oder militärische Befehlshaber einzuengen. Es liegen keine besonderen theologischen Fachbegriffe vor.
