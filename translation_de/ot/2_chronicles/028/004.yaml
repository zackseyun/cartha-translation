  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: de
  text: Er brachte Opfer dar und ließ Rauch aufsteigen auf den Höhen[a], auf den Hügeln und unter jedem grünen Baum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an den Kulthöhen. Das hebräische Wort bezeichnet örtliche Kultstätten, die häufig auf Anhöhen lagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Er brachte Opfer dar
  rationale: Das Piel von זבח bezeichnet das Darbringen von Schlachtopfern. „brachte Opfer dar“ ist im modernen Deutschen natürlich und gibt den kultischen Vorgang klar wieder.
- source_word: וַיְקַטֵּר
  choice: und ließ Rauch aufsteigen
  rationale: Das Piel von קטר kann das Verbrennen von Räucherwerk oder allgemeiner das Aufsteigenlassen von Opferrauch bezeichnen. Die Wiedergabe bewahrt diese im Kontext echte Bedeutungsbreite.
- source_word: בַּבָּמוֹת
  choice: auf den Höhen
  rationale: במות bezeichnet örtliche Kultstätten, häufig auf Anhöhen. „Höhen“ erhält den traditionellen kultischen Fachausdruck und unterscheidet ihn von den anschließend genannten gewöhnlichen Hügeln.
- source_word: וְעַל הַגְּבָעוֹת
  choice: auf den Hügeln
  rationale: גבעות ist die gewöhnliche Bezeichnung für Hügel; die direkte Wiedergabe erhält die räumliche Reihung des Hebräischen.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: und unter jedem grünen Baum
  rationale: רענן bezeichnet frisches, üppiges Grün. „grüner Baum“ bewahrt die feste alttestamentliche Wendung und ihre Bildsprache, ohne sie ausdeutend zu paraphrasieren.
theological_decisions:
- issue: Kultische Ortsbezeichnungen für unerlaubte beziehungsweise götzendienerische Verehrung
  choice: Die herkömmlichen Wendungen „auf den Höhen“ und „unter jedem grünen Baum“ werden beibehalten.
  alternative: 'Deutender: „an heidnischen Kultstätten“ beziehungsweise „unter jedem dicht belaubten Baum“.'
  rationale: Der Vers benennt die Orte, ohne sie hier ausdrücklich mit einem wertenden Zusatz zu versehen. Die formelhafte Sprache und ihre innerbiblischen Bezüge bleiben so erhalten.
- issue: Gegenstand des Verbrennens bei וַיְקַטֵּר
  choice: „ließ Rauch aufsteigen“
  alternative: „verbrannte Räucherwerk“ oder „brachte Rauchopfer dar“
  rationale: Das hebräische Verb kann sich auf Räucherwerk oder auf das Verbrennen anderer Opfergaben beziehen. Die gewählte Formulierung vermeidet eine unnötige Festlegung und erhält die kultische Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der knappen hebräischen Reihung. „Höhen“ dient als kultischer Fachausdruck; die Fußnote klärt ihn für heutige Leser. Die Formulierung „ließ Rauch aufsteigen“ ist bewusst quellennah und erhält die Bedeutungsbreite von קטר.
