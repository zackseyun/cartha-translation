base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: de
  text: 'Und er brachte den Göttern von Damaskus, die ihn geschlagen hatten,[a] Schlachtopfer dar und sagte: »Weil die Götter der Könige von Aram ihnen helfen, will ich ihnen Schlachtopfer darbringen, damit sie mir helfen.« Doch sie brachten ihn und ganz Israel zu Fall.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ihn immer wieder schlugen« beziehungsweise »die ihn besiegten«.'
    reason: Das hebräische Partizip kann eine fortdauernde oder charakteristische Handlung bezeichnen.
  - marker: b
    text: 'Wörtlich etwa: »Sie waren ihm zum Sturz und ganz Israel.« Die hebräische Formulierung bezeichnet sie als Ursache seines Sturzes; bei »ganz Israel« ist die entsprechende Aussage elliptisch ergänzt.'
    reason: Die hebräische Wendung verwendet einen Infinitiv mit Suffix für Ahas und lässt den parallelen Bezug auf ganz Israel verkürzt stehen.
lexical_decisions:
- source_word: וַיִּזְבַּח לֵאלֹהֵי דַרְמֶשֶׂק
  choice: er brachte den Göttern von Damaskus Schlachtopfer dar
  rationale: זבח bezeichnet das Darbringen kultischer Schlachtopfer. Die Formulierung ist im Deutschen natürlich und macht den Opfercharakter deutlicher als das mehrdeutige „opfern“.
- source_word: הַמַּכִּים בּוֹ
  choice: die ihn geschlagen hatten
  rationale: Der attributive Partizipialausdruck bezeichnet die Götter als diejenigen, die ihn nach seiner eigenen Deutung geschlagen hatten. Das Plusquamperfekt fügt sich in den Erzählzusammenhang; die mögliche durative Bedeutung bleibt in der Fußnote erhalten.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die von Ahas gegebene Begründung ein. „Denn“ bewahrt diesen argumentativen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: die Götter der Könige von Aram
  rationale: Die Übersetzung bewahrt sowohl den Plural „Götter“ als auch den auffälligen Plural „Könige“.
- source_word: מַעְזְרִים אוֹתָם
  choice: helfen ihnen
  rationale: Das Partizip kann gegenwärtige oder charakteristische Hilfe ausdrücken. Das deutsche Präsens lässt diese Nuance offen.
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: Darum will ich ihnen Schlachtopfer darbringen, damit sie mir helfen
  rationale: „will ich“ gibt die Absicht des Imperfekts wieder; „damit“ bringt den im Zusammenhang naheliegenden Zweck zum Ausdruck.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: Doch sie brachten ihn und ganz Israel zu Fall
  rationale: Die Hifil-Konstruktion von כשׁל bedeutet „zum Straucheln/Fall bringen“. Die aktive deutsche Wendung ist klar und bewahrt den gemeinsamen Bezug auf Ahas und ganz Israel; „Doch“ macht den kontextuellen Gegensatz sichtbar.
theological_decisions:
- issue: Verantwortlichkeit der Götter von Damaskus für die Niederlage
  choice: Die Aussage wird als Bestandteil von Ahas’ eigener Begründung wiedergegeben, ohne einen erklärenden Zusatz in den Bibeltext einzufügen.
  alternative: Durch eine Paraphrase ausdrücklich kennzeichnen, dass dies nur Ahas’ heidnische Deutung war.
  rationale: Der hebräische Text berichtet Ahas’ Schlussfolgerung und widerlegt sie erzählerisch durch den abschließenden Hinweis auf den Untergang. Die Übersetzung soll weder die reale Wirksamkeit fremder Götter behaupten noch die im Text vorhandene Ironie durch dogmatische Erläuterung ersetzen.
- issue: Bedeutung von וְיַעְזְרוּנִי
  choice: 'als Zweck: „damit sie mir helfen“'
  alternative: 'als erwartete Folge: „und sie werden mir helfen“'
  rationale: Der Zusammenhang stellt Ahas’ beabsichtigtes Ziel heraus. Die Zweckfassung ist syntaktisch plausibel, ohne zu behaupten, dass die erhoffte Hilfe tatsächlich eintreten werde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schlachtopfer darbringen“ bewahrt die kultische Präzision; direkte Rede und Satzbau bleiben für heutige Leser klar. Die ungewöhnliche Mehrzahl „Könige von Aram“ wird bewusst nicht geglättet.
