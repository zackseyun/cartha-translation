  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: de
  text: Und nun sagt ihr, ihr wollt die Menschen aus Juda und Jerusalem[a] unterwerfen und zu euren Sklaven und Sklavinnen machen[b]. Habt ihr nicht auch Schuld vor Jahwe, eurem Gott?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Judas und Jerusalems“. Die männliche Pluralform bezeichnet hier die Menschen beziehungsweise die Bevölkerung insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Menschen aus Juda und Jerusalem als Sklaven und Sklavinnen für euch zu unterwerfen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Wortlaut der Schlussfrage ist knapp und mehrdeutig; annähernd wörtlich: „Sind nicht gerade bei euch Schuldvergehen vor/gegen Jahwe, eurem Gott?“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Wiedergabe bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlichen und überleitenden Charakter von עַתָּה.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: die Menschen aus Juda und Jerusalem
  rationale: Wörtlich steht „die Söhne Judas und Jerusalems“. Gemeint ist hier jedoch die Bevölkerung beziehungsweise die Gefangenen aus Juda und Jerusalem; „Menschen aus“ gibt diesen korporativen Sinn natürlich und nicht unnötig männlich-exklusiv wieder.
- source_word: אַתֶּם אֹמְרִים
  choice: sagt ihr, ihr wollt
  rationale: Das Pronomen mit Partizip bezeichnet die gegenwärtig geäußerte Absicht. Die Formulierung erhält das konkrete „Sagen“ und macht zugleich den folgenden Infinitiv im Deutschen verständlich.
- source_word: לִכְבֹּשׁ
  choice: unterwerfen
  rationale: כָּבַשׁ bezeichnet gewaltsames Unterwerfen oder Unter-die-eigene-Gewalt-Bringen. Das nachfolgende Sklavereivokabular präzisiert hier das beabsichtigte Ergebnis.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת לָכֶם
  choice: zu euren Sklaven und Sklavinnen machen
  rationale: Der militärische Kontext spricht für tatsächliche Versklavung, nicht bloß für einen freiwilligen Dienst. Die beiden Substantive unterscheiden männliche und weibliche Versklavte; לָכֶם drückt ihre vorgesehene Zugehörigkeit zu den Angeredeten aus.
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: Habt nicht auch ihr Schuld auf euch
  rationale: Die hebräische Frage ist stark verdichtet. „Auch ihr“ gibt den emphatischen Rückverweis auf die Schuld der Angeredeten wieder; „Schuld auf euch haben“ bewahrt den Gedanken einer bei ihnen liegenden, zurechenbaren Schuld.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: vor Jahwe, eurem Gott
  rationale: Das ל bezeichnet hier die Beziehung der Schuld zu Gott beziehungsweise die Verantwortlichkeit in seinem Angesicht. „Jahwe“ gibt den Gottesnamen יהוה als Namen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die gebräuchliche deutsche Form „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Status der Gefangenen in עֲבָדִים וְשְׁפָחוֹת
  choice: Sklaven und Sklavinnen
  alternative: Knechte und Mägde
  rationale: Im Zusammenhang mit Kriegsgefangenen und erzwungener Unterwerfung steht unfreiwillige Versklavung im Vordergrund. Die moderne Formulierung macht diese Härte deutlich und verharmlost den Status nicht.
- issue: Sinn der abschließenden Schuldfrage
  choice: Habt nicht auch ihr Schuld auf euch vor Jahwe?
  alternative: Sind nicht gerade bei euch Schuldvergehen gegen Jahwe?
  rationale: Die genaue Funktion von רַק in der komprimierten Konstruktion ist umstritten. Die Hauptfassung bewahrt die rhetorische Gegenanklage und den Gedanken eigener Schuld, ohne die schwierige Partikel übermäßig festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, direktem Mahnton. „Sklaven und Sklavinnen“ benennt die erzwungene Unfreiheit klar; „Menschen aus Juda und Jerusalem“ vermeidet ein im heutigen Deutsch missverständliches, männlich-exklusiv klingendes „Söhne“.
