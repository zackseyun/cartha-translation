source:
  edition: WLC
  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: de
  text: Und Sichri, ein tapferer Mann aus Ephraim, tötete Maaseja, den Sohn des Königs, Asrikam, den Vorsteher des Palastes[a], und Elkana, den Zweiten nach dem König[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „des Hauses“; im königlichen Zusammenhang ist wahrscheinlich der Palast oder der königliche Haushalt gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Stellvertreter des Königs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: tötete
  rationale: הרג bezeichnet hier eindeutig das Töten; „tötete“ ist im modernen Deutschen klar und dem erzählenden Kontext angemessen.
- source_word: זִכְרִי
  choice: Sichri
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: ein tapferer Mann aus Ephraim
  rationale: גִּבּוֹר kann einen starken, tapferen Mann, Helden oder Krieger bezeichnen. Die gewählte Form wahrt die Bedeutungsbreite und drückt die Zugehörigkeit zu Ephraim natürlich aus.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaseja
  rationale: Der Personenname wird in einer deutschen Transkriptionsform wiedergegeben.
- source_word: בֶּן הַמֶּלֶךְ
  choice: den Sohn des Königs
  rationale: Die Konstruktion bezeichnet den königlichen Sohn; die bestimmte Wiedergabe entspricht der Form des hebräischen Ausdrucks.
- source_word: עַזְרִיקָם
  choice: Asrikam
  rationale: Der Personenname wird in deutscher Transkription wiedergegeben.
- source_word: נְגִיד הַבָּיִת
  choice: den Vorsteher des Palastes
  rationale: נְגִיד bezeichnet einen leitenden Amtsträger. הַבַּיִת meint im königlichen Zusammenhang wahrscheinlich den Palast oder königlichen Haushalt; „Palast“ macht diesen Bezug verständlich, ohne das Amt enger festzulegen.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der Personenname wird in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: den Zweiten nach dem König
  rationale: מִשְׁנֶה bezeichnet den im Rang Zweiten. Die Wiedergabe erhält die hierarchische Aussage, ohne einen späteren technischen Amtstitel einzutragen.
