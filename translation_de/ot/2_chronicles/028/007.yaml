  source_fidelity: Der Vers gibt die hebräische Satzstruktur und alle drei von Sichri Getöteten zutreffend wieder. „tötete“ entspricht וַיַּהֲרֹג; „ein tapferer Mann aus Ephraim“ ist eine angemessene, nicht überengte Wiedergabe von גִּבּוֹר אֶפְרַיִם. Die Amtsbezeichnungen erfassen נְגִיד הַבַּיִת und מִשְׁנֵה הַמֶּלֶךְ sachgerecht.
