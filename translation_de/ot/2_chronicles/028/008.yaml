  text: וַ/יִּשְׁבּוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל מֵֽ/אֲחֵי/הֶ֜ם מָאתַ֣יִם אֶ֗לֶף נָשִׁים֙ בָּנִ֣ים וּ/בָנ֔וֹת וְ/גַם שָׁלָ֥ל רָ֖ב בָּזְז֣וּ מֵ/הֶ֑ם וַ/יָּבִ֥יאוּ אֶת הַ/שָּׁלָ֖ל לְ/שֹׁמְרֽוֹן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: de
  text: Und die Israeliten nahmen von ihren Brüdern zweihunderttausend Frauen, Söhne und Töchter gefangen.[a] Außerdem nahmen sie ihnen viel Beute ab und brachten die Beute nach Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihren Verwandten“ oder „von ihren israelitischen Volksgenossen“. Im Hebräischen steht „von ihren Brüdern“; dies betont die gemeinsame Verwandtschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: führten ... gefangen weg
  rationale: Das Verb שבה bezeichnet im Krieg das Gefangennehmen und Wegführen von Menschen. Die deutsche Formulierung gibt sowohl den militärischen Vorgang als auch den resultierenden Gefangenenstatus natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Die Israeliten“ ist die natürliche moderne deutsche Bezeichnung. Die im Zusammenhang wichtige Verwandtschaft wird durch „ihre Brüder“ ausdrücklich bewahrt.
- source_word: מֵאֲחֵיהֶם
  choice: von ihren Brüdern
  rationale: אָח kann Verwandte oder Volksgenossen bezeichnen. „Brüder“ bewahrt hier bewusst die familiäre Sprache und die ethische Spannung eines innerisraelitischen Konflikts.
- source_word: מָאתַיִם אֶלֶף
  choice: zweihunderttausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: Frauen, Söhne und Töchter
  rationale: Die drei ausdrücklich genannten Gruppen werden beibehalten, ohne „Söhne und Töchter“ interpretierend zu „Kinder“ zusammenzufassen.
- source_word: וְגַם
  choice: Außerdem
  rationale: Gibt den additiven Fortgang der Erzählung in natürlichem Deutsch wieder.
- source_word: שָׁלָל רָב
  choice: viel Beute
  rationale: שָׁלָל bezeichnet Kriegsbeute. Die knappe Wiedergabe ermöglicht zugleich, die Wiederholung des Substantivs im nächsten Satzteil zu erhalten.
- source_word: בָּזְזוּ
  choice: erbeuteten
  rationale: Das Verb bezeichnet das gewaltsame Nehmen als Kriegsbeute. „Erbeuteten“ ist idiomatisches Deutsch und vermeidet die schwerfällige Verbindung „Beute plündern“.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: und brachten die Beute nach Samaria
  rationale: Direkte und natürliche Wiedergabe der Ortsbewegung; „Samaria“ ist die übliche deutsche Namensform.
theological_decisions:
- issue: Verwandtschaftssprache in einem innerisraelitischen Krieg
  choice: von ihren Brüdern
  alternative: von ihren Verwandten / von ihren israelitischen Volksgenossen
  rationale: Die wörtliche Verwandtschaftsbezeichnung macht deutlich, dass die Gefangenen keine fremden Feinde waren, und bewahrt damit die ethische und theologische Spannung des hebräischen Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Aufzählung „Frauen, Söhne und Töchter“ sowie die Wiederholung von „Beute“ folgen bewusst der Gestalt des hebräischen Textes.
