  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: de
  text: Und Ahas starb, und man begrub ihn in der Stadt Jerusalem, denn man brachte ihn nicht in die Gräber der Könige Israels.[a] Sein Sohn Hiskia wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Könige Israels«. Da Ahas König von Juda war, verstehen manche dies als Hinweis auf die Königsgräber der davidischen Könige oder erwarten hier »der Könige Judas«.'
    reason: Bewahrt die masoretische Lesart und nennt zugleich die durch den historischen Zusammenhang entstehende Deutungsfrage.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die königliche Todesformel wird in ihrer bildhaften Gestalt bewahrt, ohne sie ausdrücklich zu „starb“ aufzulösen. „Väter“ erhält zugleich den wiederkehrenden dynastischen Ausdruck.
- source_word: וַיִּקְבְּרֻהוּ
  choice: man begrub ihn
  rationale: Das unbestimmte „man“ gibt die aktive Verbform der 3. Person Plural im natürlichen Deutschen wieder.
- source_word: בָעִיר בִּירוּשָׁלִָם
  choice: in der Stadt, in Jerusalem
  rationale: Beide Ortsangaben des Hebräischen bleiben erhalten; die Wiederaufnahme hebt hervor, dass Ahas zwar innerhalb Jerusalems, aber nicht in den Königsgräbern bestattet wurde.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für den genannten Bestattungsort ein.
- source_word: לֹא הֱבִיאֻהוּ לְקִבְרֵי
  choice: man brachte ihn nicht in die Gräber
  rationale: Die konkrete Bewegungsbedeutung des Hifil von בוא bleibt erhalten und wird nicht zur bloßen Aussage „bestattete ihn nicht“ verengt.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die ausdrückliche Lesart des masoretischen Textes „Israel“ wird beibehalten und nicht aufgrund des historischen Kontexts zu „Juda“ geändert.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: Diese natürliche deutsche Nachfolgeformel gibt sowohl den Regierungsantritt als auch das Nachfolgeverhältnis klar wieder.
theological_decisions:
- issue: Soll „Könige Israels“ aus historischen Gründen zu „Könige Judas“ normalisiert werden?
  choice: „Könige Israels“ bleibt im Haupttext stehen.
  alternative: „Könige Judas“ oder eine Deutung auf die davidischen Königsgräber.
  rationale: Der masoretische Text nennt ausdrücklich Israel. Da „Israel“ in den Chronikbüchern auch weiter gefasst gebraucht werden kann, darf die vorhandene Spannung nicht durch eine stillschweigende Textänderung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Todesformel bleibt bildhaft, während die Nachfolgeformel idiomatisch und unmittelbar verständlich formuliert ist. Der Fußnotenmarker steht direkt bei der erklärungsbedürftigen Wendung „Könige Israels“.
