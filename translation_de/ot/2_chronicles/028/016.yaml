base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: de
  text: Zu jener Zeit sandte König Ahas zu den Königen von Assyrien um Hilfe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „die Könige von Assyrien“ (Plural). Manche Übersetzungen geben „den König von Assyrien“ wieder und gleichen den Text damit an die historische Situation an.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige deutsche Zeitangabe gibt die narrative Einordnung natürlich und würdevoll wieder.
- source_word: שָׁלַח
  choice: wandte sich
  rationale: Wörtlich bedeutet das Verb „sandte“. Da kein ausdrückliches Objekt genannt wird und das Senden hier auf ein Hilfegesuch zielt, gibt „wandte sich“ die elliptische Wendung im Deutschen verständlich wieder, ohne Boten ausdrücklich hinzuzufügen.
- source_word: הַמֶּלֶךְ אָחָז
  choice: König Ahas
  rationale: Die deutsche Verbindung von Titel und Eigenname entspricht der hebräischen Apposition und ist idiomatisch.
- source_word: עַל
  choice: an
  rationale: In Verbindung mit dem Verb bezeichnet die Präposition hier die Adressaten, an die Ahas sich wendet, nicht eine feindliche Bewegung gegen sie.
- source_word: מַלְכֵי אַשּׁוּר
  choice: die Könige von Assyrien
  rationale: Der masoretische Text hat eindeutig die Pluralform „Könige“. Sie wird trotz der historisch naheliegenden Einzahl im Haupttext bewahrt.
- source_word: לַעְזֹר לוֹ
  choice: damit sie ihm halfen
  rationale: Der Infinitiv bezeichnet den Zweck des Hilfegesuchs. Die finite Zweckkonstruktion ist in modernem Deutsch natürlich und macht den Bezug des Suffixes „ihm“ klar.
theological_decisions:
- issue: Soll der hebräische Plural „Könige von Assyrien“ an die historisch erwartete Einzahl angeglichen werden?
  choice: Der masoretische Plural bleibt im Haupttext erhalten.
  alternative: „der König von Assyrien“
  rationale: Die Ausgangstexttreue hat Vorrang vor einer historischen Harmonisierung. Da viele Übersetzungen die Einzahl bieten, wird diese Abweichung in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die elliptische hebräische Aussage „sandte an“ wird idiomatisch als „wandte sich an“ wiedergegeben; die textlich auffällige Mehrzahl bleibt sichtbar und wird erläutert.
