  text: וּ/בְ/עֵת֙ הָצֵ֣ר ל֔/וֹ וַ/יּ֖וֹסֶף לִ/מְע֣וֹל בַּ/יהוָ֑ה ה֖וּא הַ/מֶּ֥לֶךְ אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: de
  text: Als er in Bedrängnis war, setzte er seine Untreue gegen Jahwe fort[a] – er, König Ahas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fügte er hinzu, treulos zu handeln“; die hebräische Wendung bedeutet, dass er mit seiner Untreue fortfuhr oder noch weiter darin ging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: Als er in Bedrängnis war
  rationale: Die Wendung bezeichnet die Zeit, in der Ahas bedrängt beziehungsweise schwer unter Druck war. Die finite deutsche Formulierung ist natürlich und gibt den zeitlichen Bezug klar wieder.
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: setzte er seine Untreue … fort
  rationale: יסף mit Infinitiv bedeutet idiomatisch, eine Handlung fortzusetzen oder weiterzutreiben. מעל bezeichnet einen schweren Treuebruch, hier gegenüber Gott.
- source_word: בַּיהוָה
  choice: gegen Jahwe
  rationale: Die Präposition bezeichnet bei מעל denjenigen, gegen den sich der Treuebruch richtet. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: er, König Ahas
  rationale: Das selbstständige Pronomen הוּא hebt die Identität des Handelnden nachdrücklich hervor. Die durch Gedankenstrich abgesetzte Apposition bewahrt diesen auffälligen Nachdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מעל
  choice: Untreue gegen Jahwe
  alternative: sich an Jahwe versündigen
  rationale: „Untreue“ bewahrt den Gedanken des Treue- beziehungsweise Bundesbruchs, ohne die Aussage auf eine allgemeinere Sünde zu reduzieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnlich nachdrückliche Schlusswendung des Hebräischen bleibt bewusst erhalten.
