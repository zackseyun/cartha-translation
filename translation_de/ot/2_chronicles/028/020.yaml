  source_fidelity: „zog … gegen ihn heran“ gibt וַיָּבֹא עָלָיו im feindlich-militärischen Kontext treffend wieder. „bedrängte ihn“ bildet וַיָּצַר לוֹ angemessen breit ab, ohne die engere, nicht zwingende Bedeutung „belagerte ihn“ festzulegen. „stärkte ihn aber nicht“ entspricht וְלֹא חֲזָקוֹ unmittelbar und bewahrt die zwei hebräischen Prädikate samt ihrem Kontrast.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und zugleich erzählerisch knapp. Die Wortstellung und das adversative „aber“ sind idiomatisch.
  terminology: „Tiglat-Pileser“ ist die geläufige deutsche Namensform; „König von Assyrien“ ist sachlich und sprachlich passend. „bedrängte“ und „stärkte“ sind registergerecht und theologisch nicht überdeutet.
