  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: de
  text: Da zog Tiglat-Pileser, der König von Assyrien, gegen ihn heran und bedrängte ihn, stärkte ihn aber nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: zog gegen ihn heran
  rationale: Die Verbindung בוא על hat in diesem militärisch-politischen Zusammenhang feindlichen Sinn. „Gegen ihn heran“ gibt diesen wieder, ohne die Bewegung des Verbs einzuebnen.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Tiglat-Pileser
  rationale: Dies ist die im modernen Deutschen übliche Namensform des assyrischen Königs.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung im geopolitischen Sinn.
- source_word: וַיָּצַר לוֹ
  choice: bedrängte ihn
  rationale: Das Verb bezeichnet feindliches Bedrängen oder das Versetzen in Not. „Bedrängte“ bewahrt die Bedeutungsbreite und legt sich nicht auf eine förmliche Belagerung fest.
- source_word: וְלֹא חֲזָקוֹ
  choice: stärkte ihn aber nicht
  rationale: „Stärken“ entspricht חזק eng. Das deutsche „aber“ macht den im Zusammenhang erkennbaren Gegensatz zur erhofften Unterstützung deutlich, ohne eine zusätzliche Handlung wie „helfen“ einzutragen.
