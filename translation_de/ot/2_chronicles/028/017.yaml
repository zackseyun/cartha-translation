base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/017.yaml
  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: de
  text: Auch die Edomiter kamen, schlugen in Juda zu und führten Gefangene weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie schlugen in Juda zu und nahmen Gefangene gefangen.“ Im Hebräischen steht das übliche militärische Verb für „schlagen“; für das Gefangennehmen verbindet der Text ein Verb mit einem stammverwandten Substantiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Auch
  rationale: Die Wendung fügt den Angriff der Edomiter als weiteres Unglück in die Reihe der feindlichen Angriffe ein.
- source_word: אֲדוֹמִים
  choice: die Edomiter
  rationale: Der pluralische Volksname bezeichnet die Angehörigen Edoms, nicht das Land.
- source_word: בָּאוּ
  choice: waren gekommen
  rationale: Das Plusquamperfekt fügt sich in den deutschen Erzählzusammenhang und kennzeichnet den Einfall als bereits geschehenes weiteres Ereignis.
- source_word: וַיַּכּוּ
  choice: hatten … angegriffen
  rationale: נכה bedeutet wörtlich „schlagen“, bezeichnet im militärischen Zusammenhang aber häufig einen Angriff. „Angegriffen“ ist verständlich und behauptet keinen ausdrücklich genannten vollständigen Sieg.
- source_word: בִיהוּדָה
  choice: Juda
  rationale: 'Die Präposition ב kann hier beim militärischen Verb idiomatisch durch ein direktes Objekt wiedergegeben werden: „Juda angreifen“.'
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: Gefangene weggeführt
  rationale: Die hebräische Verbindung aus dem Verb „gefangen nehmen“ und dem verwandten Substantiv „Gefangenschaft/Gefangene“ wird natürlich wiedergegeben, ohne ihren militärischen Sinn zu verlieren.
