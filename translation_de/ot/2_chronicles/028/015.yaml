source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: de
  text: Da standen die Männer auf, die namentlich bestimmt worden waren, nahmen sich der Gefangenen an und bekleideten alle unter ihnen, die unbekleidet waren, mit Kleidern aus der Beute. Sie kleideten sie ein, zogen ihnen Sandalen an, gaben ihnen zu essen und zu trinken und salbten sie mit Öl. Alle, die nicht mehr weiterkonnten, ließen sie auf Eseln reiten. So brachten sie sie nach Jericho, der Palmenstadt, zu ihren Brüdern[a]. Dann kehrten sie nach Samaria zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Verwandten; beziehungsweise: ihren israelitischen Volksgenossen.'
    reason: 'Lexikalische Alternative: אֲחֵיהֶם kann über leibliche Brüder hinaus Angehörige derselben verwandten Volksgemeinschaft bezeichnen.'
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: namentlich bestimmt worden waren
  rationale: Das Nifal von נקב mit בְשֵׁמוֹת bezeichnet eine ausdrückliche namentliche Bestimmung; die deutsche Formulierung ist präzise und natürlich.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: nahmen sich der Gefangenen an
  rationale: החזיק ב kann ein Ergreifen, Festhalten oder Unterstützen bezeichnen. Im Zusammenhang fürsorglicher Versorgung gibt die Wendung die Übernahme von Verantwortung wieder, ohne einen erneuten feindlichen Zugriff anzudeuten.
- source_word: מַעֲרֻמֵּיהֶם
  choice: alle unter ihnen, die unbekleidet waren
  rationale: Die Form bezeichnet die Entkleideten beziehungsweise Nackten innerhalb der Gruppe. „Unbekleidet“ ist im Deutschen würdig und kontextgerecht.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: bekleideten … mit Kleidern aus der Beute
  rationale: Die Präposition מן nennt die Beute als Herkunft des zum Bekleiden Verwendeten. Die Ergänzung „mit Kleidern“ macht den deutschen Satz verständlich, ohne zusätzliche Sachinformation einzuführen.
- source_word: וַיַּלְבִּשׁוּם
  choice: Sie kleideten sie ein
  rationale: Die Wiederholung des Bekleidens wird entsprechend dem hebräischen Nachdruck beibehalten.
- source_word: וַיַּנְעִלוּם
  choice: zogen ihnen Sandalen an
  rationale: Das Verb bezeichnet das Versehen mit Schuhwerk; „Sandalen“ ist für den antiken Zusammenhang anschaulich und geläufig.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: gaben ihnen zu essen und zu trinken
  rationale: Die beiden Kausativformen werden als idiomatisches deutsches Wortpaar wiedergegeben, ohne die Art des Getränks festzulegen.
- source_word: וַיְסֻכוּם
  choice: salbten sie mit Öl
  rationale: סוך meint hier das Einreiben beziehungsweise Salben mit Öl zur Pflege und Erquickung. „Mit Öl“ verdeutlicht den konkreten, nicht notwendig kultischen Vorgang.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: Alle, die nicht mehr weiterkonnten, führten sie auf Eseln
  rationale: כּוֹשֵׁל bezeichnet wörtlich einen Strauchelnden oder Schwachen. Die Formulierung vermittelt die körperliche Erschöpfung; נהל bleibt mit „führten“ bildnah erhalten.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Jericho, der Palmenstadt
  rationale: Der bekannte Beiname wird knapp und natürlich als Apposition wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von אֲחֵיהֶם im gemeinschaftlichen Verwandtschaftskontext
  choice: ihren Brüdern
  alternative: ihren Verwandten / ihren israelitischen Volksgenossen
  rationale: Das maskuline Pluralwort bedeutet formal „ihre Brüder“, kann hier aber die Angehörigen des verwandten Bundesvolkes beziehungsweise des Südreichs umfassen. Der Haupttext bewahrt die konkrete Verwandtschaftsbezeichnung; die Fußnote nennt den weiteren kontextuellen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der fürsorglichen Handlungen und die hebräische Wiederholung des Bekleidens bleiben erhalten. „Salbten sie mit Öl“ verhindert, dass der hier wahrscheinlich pflegerische Vorgang ausschließlich kultisch verstanden wird.
