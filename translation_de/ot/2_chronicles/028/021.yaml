  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: de
  text: Denn Ahas plünderte[a] das Haus Jahwes, das Haus des Königs und die führenden Männer[b] aus und gab alles dem König von Assyrien. Doch es half ihm nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch wörtlich: „teilte“ oder „verteilte“. Im Zusammenhang ist gemeint, dass Ahas diesen Orten und Personen Wertgegenstände wegnahm.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Fürsten“ beziehungsweise „die hohen Beamten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorherigen Aussage ein und bewahrt den Zusammenhang mit dem vorausgehenden Vers.
- source_word: חָלַק
  choice: plünderte … aus
  rationale: Das Verb bedeutet grundsätzlich „teilen“ oder „zuteilen“; im Zusammenhang nahm Ahas jedoch Wertgegenstände aus Tempel, Königshaus und dem Besitz der führenden Männer, um sie Assyrien zu geben. „ausplündern“ gibt diesen kontextuellen Sinn in natürlichem Deutsch wieder, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Bewahrt die konkrete hebräische Ausdrucksweise und die Parallele zu „Haus des Königs“; „Tempel Jahwes“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Bewahrt die Parallelstruktur des hebräischen Textes. „Königspalast“ wäre idiomatischer, legt die Bedeutung aber enger fest.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: Bezeichnet die maßgeblichen Männer beziehungsweise Amtsträger des Reiches. Die Formulierung ist im modernen Deutsch verständlicher als „Fürsten“, ohne zwingend ein bestimmtes Amt anzunehmen.
- source_word: וַיִּתֵּן
  choice: und gab alles
  rationale: Das ergänzte „alles“ nimmt die zuvor genannten geplünderten Güter zusammen und macht den im Hebräischen aus dem Zusammenhang erschließbaren Gegenstand im Deutschen verständlich.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: dem König von Assyrien
  rationale: Direkte und natürliche Wiedergabe des Empfängers.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: Doch es half ihm nicht
  rationale: Gibt die knappe Ergebnisaussage idiomatisch wieder; „es“ bezieht sich auf die Übergabe beziehungsweise den Tribut als Ganzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ der traditionellen Ersatzlesung entspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Haus Jahwes, Haus des Königs“ erhält die Parallelität des Hebräischen; „plünderte … aus“ vermittelt den kontextuellen Sinn natürlich. Der abschließende kurze Satz bewahrt die pointierte Feststellung, dass der Tribut Ahas keinen Nutzen brachte.
