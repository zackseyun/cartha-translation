  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: de
  text: 'Dort war ein Prophet des HERRN namens Oded. Er ging dem Heer entgegen, das nach Samaria kam, und sagte zu ihnen: »Seht, im Zorn über Juda hat der HERR, der Gott eurer Vorfahren, sie in eure Hand gegeben. Ihr aber habt sie in einem Zorn getötet, der bis zum Himmel reicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבִיא לַיהוָה
  choice: ein Prophet des HERRN
  rationale: Die Zugehörigkeitsbeziehung wird im Deutschen natürlich mit »des HERRN« ausgedrückt; das Tetragramm erscheint traditionsgemäß als HERR.
- source_word: עֹדֵד שְׁמוֹ
  choice: namens Oded
  rationale: Knappes, natürliches Deutsch für »sein Name war Oded« ohne Bedeutungsverlust.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  choice: Er ging dem Heer entgegen
  rationale: Im Zusammenhang bezeichnet לִפְנֵי das Hinaustreten vor beziehungsweise Entgegentreten des ankommenden Heeres.
- source_word: הִנֵּה
  choice: Seht
  rationale: Bewahrt den aufmerksamkeitslenkenden und eindringlichen Charakter des hebräischen Ausdrucks.
- source_word: בַּחֲמַת ... עַל יְהוּדָה
  choice: im Zorn über Juda
  rationale: Gibt Ursache und Gegenstand des göttlichen Zorns idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: בְּזַעַף עַד לַשָּׁמַיִם הִגִּיעַ
  choice: mit einem Grimm ..., der bis zum Himmel reicht
  rationale: Erhält das starke Bild eines maßlosen, himmelschreienden Grimms und folgt der singularischen Form des hebräischen Relativgedankens.
theological_decisions:
- issue: Göttliche Übergabe Judas und menschliche Schuld Israels
  choice: »hat ... sie in eure Hand gegeben. Ihr aber habt sie ... getötet«
  alternative: Die beiden Handlungen lediglich mit »und« verbinden
  rationale: 'Das kontrastive »aber« macht die im Kontext ausgesprochene Spannung deutlich: Gottes Gericht erklärt den Sieg, rechtfertigt jedoch nicht die maßlose Tötungswut. Es fügt keine konfessionelle Deutung hinzu.'
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: Jahwe
  rationale: Die deutsche Bibeltradition kennzeichnet das Tetragramm weithin durch HERR; die Großschreibung signalisiert, dass ein Eigenname zugrunde liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die direkte Rede bleibt eindringlich; das Bild »bis zum Himmel« und die Spannung zwischen göttlichem Gericht und menschlicher Verantwortung werden bewahrt.
