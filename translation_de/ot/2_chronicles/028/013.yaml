  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: de
  text: 'Und sie sagten zu ihnen: „Bringt die Gefangenen nicht hierher! Denn ihr wollt uns vor Jahwe schuldig machen, indem ihr unsere Sünden und unsere Schuld noch vermehrt.[a] Denn unsere Schuld ist groß, und glühender Zorn richtet sich gegen Israel.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn Schuld gegenüber Jahwe lastet auf uns“. Die hebräische Wendung ist knapp und kann die Schuldhaftung vor Jahwe oder Schuld in der Beziehung zu Jahwe hervorheben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ein Brennen des Zorns“; eine hebräische Wendung für heftigen Zorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: die Gefangenen
  rationale: 'Das Substantiv kann den Zustand der Gefangenschaft oder die Gesamtheit der Gefangenen bezeichnen. Das Verb „bringen“ verlangt hier die konkrete Bedeutung: die gefangen genommenen Menschen.'
- source_word: הֵנָּה
  choice: hierher
  rationale: Das deiktische Adverb bezeichnet eine Bewegung zum Standort der Sprecher; „hierherbringen“ gibt dies im Deutschen idiomatisch wieder.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: Schuld von Jahwe über uns zu bringen
  rationale: Die knappe hebräische Wendung ist mehrdeutig. Die Hauptfassung versteht sie als Schuld beziehungsweise daraus folgende Haftung vor dem göttlichen Gericht; die mögliche relationale Deutung „Schuld vor/gegen Jahwe“ wird in Fußnote [a] bewahrt.
- source_word: אַתֶּם אֹמְרִים
  choice: ihr habt vor
  rationale: Wörtlich steht „ihr sagt“, doch im Zusammenhang bezeichnet die Wendung eine beabsichtigte Handlung. „Ihr habt vor“ ist natürliches modernes Deutsch.
- source_word: לְהֹסִיף עַל
  choice: noch zu vermehren
  rationale: Die Konstruktion bezeichnet das Hinzufügen zu einer bereits bestehenden Belastung. „Noch“ macht den kumulativen Zusammenhang deutlich, ohne den Sinn zu verändern.
- source_word: חַטֹּאתֵינוּ
  choice: unsere Sünden
  rationale: Der Plural bezeichnet die begangenen Verfehlungen und wird gegenüber dem nachfolgenden Ausdruck für Schuld unterschieden.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: unsere Schuld / Unsere Schuld ist doch schon groß
  rationale: Der Ausdruck betont Schuld und Haftung, nicht nur einzelne Taten. „Doch schon“ bildet im zweiten Satz den begründenden Gedankengang natürlich ab.
- source_word: וַחֲרוֹן אָף
  choice: glühender Zorn
  rationale: Die hebräische Wendung lautet bildhaft „Glut/Brennen des Zorns“. „Glühender Zorn“ bewahrt sowohl das Bild als auch seine Intensität.
- source_word: עַל יִשְׂרָאֵל
  choice: gegen Israel
  rationale: Bei Zorn bezeichnet עַל dessen Ziel. Der Eigenname „Israel“ bleibt erhalten und wird nicht deutend auf das Nordreich oder Ephraim verengt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. Die geläufige deutsche Form „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Mehrdeutigkeit von לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: Schuld von Jahwe über uns zu bringen
  alternative: Schuld vor/gegen Jahwe liegt auf uns
  rationale: Die Hauptfassung hebt die durch Jahwes Gericht auferlegte Schuldhaftung hervor. Da die kompakte Konstruktion ebenso die Schuldbeziehung zu Jahwe betonen kann, wird diese Spannung nicht aufgelöst, sondern in Fußnote [a] offengelegt.
- issue: Bezeichnung Israel im historischen Zusammenhang
  choice: Israel
  alternative: Ephraim / das Nordreich
  rationale: Der Ausgangstext nennt Israel. Eine historische Präzisierung im Haupttext würde die kanonische Bezeichnung interpretierend verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und eindringlicher Rede. „Bringt … nicht hierher!“ gibt das Verbot natürlich wieder. Die parallelen Begriffe „Sünden“ und „Schuld“ bleiben unterschieden; die schwierige Gottesnamensformulierung wird im Haupttext lesbar wiedergegeben, ihre echte Mehrdeutigkeit jedoch durch Fußnote [a] bewahrt.
