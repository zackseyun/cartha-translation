  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: de
  text: Und Pekach, der Sohn Remaljas, tötete in Juda an einem einzigen Tag[a] 120.000 Menschen. Sie alle waren tapfere Männer, weil sie Jahwe, den Gott ihrer Väter, verlassen hatten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an einem Tag«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »als sie Jahwe, den Gott ihrer Väter, verließen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: tötete
  rationale: Das Verb הרג bezeichnet unmittelbar das Töten. „Tötete“ ist klar, gegenwärtig und weniger interpretierend als „erschlug“.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition bezeichnet hier den Ort des Geschehens; „Juda“ ist die übliche Bezeichnung für das damalige Königreich beziehungsweise Gebiet.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: 120.000 Menschen
  rationale: Die Zahl wird direkt wiedergegeben. „Menschen“ verdeutlicht im Deutschen das nicht ausdrücklich genannte Bezugswort, ohne die nachfolgende nähere Bestimmung vorwegzunehmen.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Formulierung gibt wörtlich „an einem Tag“ wieder und hebt idiomatisch das erschütternde Ausmaß innerhalb dieses kurzen Zeitraums hervor.
- source_word: הַכֹּל בְּנֵי חָיִל
  choice: Sie alle waren tapfere Krieger
  rationale: הַכֹּל bezieht sich zusammenfassend auf die Getöteten. בְּנֵי חָיִל bedeutet wörtlich „Söhne der Kraft/Tüchtigkeit“ und bezeichnet hier kampffähige, tapfere Männer; „Krieger“ passt zum militärischen Zusammenhang.
- source_word: בְּעָזְבָם
  choice: weil sie ... verlassen hatten
  rationale: Die Präposition ב am Infinitiv kann kausal oder temporal verstanden werden. Im Zusammenhang ist die kausale Wiedergabe gut begründet; das Plusquamperfekt bezeichnet die vorausgehende Abkehr.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: den Gott ihrer Väter
  rationale: Die traditionelle Bundesformel bleibt eng am hebräischen Wortlaut und bewahrt den familiären sowie heilsgeschichtlichen Bezug.
theological_decisions:
- issue: Bedeutung von בְּעָזְבָם im Verhältnis zur Niederlage
  choice: 'kausal: „weil sie ... verlassen hatten“'
  alternative: 'temporal: „als sie ... verließen“'
  rationale: Die kausale Lesart entspricht der deutenden Geschichtsdarstellung des Chronisten, doch die grammatisch mögliche temporale Lesart wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die langen hebräischen Satzglieder wurden zur besseren Verständlichkeit auf drei Sätze verteilt. Die kausale Deutung bleibt im Haupttext, während die echte temporale Möglichkeit in der Fußnote erhalten ist.
