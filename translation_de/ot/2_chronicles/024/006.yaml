  text: וַ/יִּקְרָ֣א הַ/מֶּלֶךְ֮ לִֽ/יהוֹיָדָ֣ע הָ/רֹאשׁ֒ וַ/יֹּ֣אמֶר ל֗/וֹ מַדּ֨וּעַ֙ לֹֽא דָרַ֣שְׁתָּ עַל הַ/לְוִיִּ֔ם לְ/הָבִ֞יא מִֽ/יהוּדָ֣ה וּ/מִֽ/ירוּשָׁלִַ֗ם אֶת מַשְׂאַת֙ מֹשֶׁ֣ה עֶֽבֶד יְהוָ֔ה וְ/הַ/קָּהָ֖ל לְ/יִשְׂרָאֵ֑ל לְ/אֹ֖הֶל הָ/עֵדֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: de
  text: 'Da rief der König Jojada, den Obersten, zu sich und sagte zu ihm: „Warum hast du die Leviten nicht dazu angehalten, die Abgabe des Mose, des Dieners des HERRN, und der Versammlung Israels für das Zelt des Zeugnisses aus Juda und Jerusalem einzubringen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Verbindung ist knapp und syntaktisch schwierig. Sie kann die Abgabe Mose, dem Diener des HERRN, und der Versammlung Israels zuordnen; im Zusammenhang mit Vers 9 wird sie auch als die von Mose für Israel festgesetzte Abgabe verstanden.
    reason: Bewahrt die im Hebräischen bestehende syntaktische und semantische Offenheit, ohne im Haupttext eine bestimmte Erklärung als sicher auszugeben.
lexical_decisions:
- source_word: יְהוֹיָדָע הָרֹאשׁ
  choice: den Oberpriester Jojada
  rationale: Wörtlich steht „Jojada, das Oberhaupt/der Hauptmann“. Im Kontext ist Jojada der führende Priester; „Oberpriester“ gibt seine Funktion in natürlichem Deutsch wieder, ohne das sonst übliche Wort für „Hoher Priester“ einzusetzen.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: hast du die Leviten nicht angewiesen
  rationale: Die Wendung bedeutet hier, von den Leviten etwas nachdrücklich zu verlangen beziehungsweise ihnen den Auftrag dazu zu erteilen.
- source_word: מַשְׂאַת
  choice: Abgabe
  rationale: Das Wort bezeichnet hier eine erhobene beziehungsweise einzubringende Leistung. „Abgabe“ ist gegenüber „Steuer“ weiter und passt zur kultischen Erhebung.
- source_word: אֹהֶל הָעֵדוּת
  choice: Zelt des Zeugnisses
  rationale: Formale Wiedergabe des kultischen Ausdrucks; sie bewahrt den Bezug auf das Zeugnis, statt ihn als bloße Bezeichnung der Stiftshütte zu glätten.
theological_decisions:
- issue: Zuordnung der Abgabe zu Mose und zur Versammlung Israels
  choice: „die Mose ... und die Versammlung Israels ... auferlegt hatten“
  alternative: „die Abgabe des Mose ... und der Versammlung Israels“
  rationale: Der hebräische Genitiv ist knapp und kann Zugehörigkeit oder Urheberschaft ausdrücken. Die gewählte Form macht den im Kontext naheliegenden Auftragssinn verständlich; eine Fußnote hält die formalere Alternative offen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen entspricht dem jüdischen Lesebrauch und ist für eine allgemein verständliche Bibelausgabe geeignet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und nachdrücklich; kultische Fachsprache wird dort bewahrt, wo sie textlich prägend ist.
