source:
  edition: WLC
  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: de
  text: Joasch war sieben Jahre alt, als er König wurde, und regierte vierzig Jahre in Jerusalem. Seine Mutter hieß Zibja und stammte aus Beerscheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: war sieben Jahre alt
  rationale: Die hebräische Altersformel lautet wörtlich „ein Sohn von sieben Jahren“; die gewählte Form gibt ihren Sinn idiomatisch und genau wieder.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts. Die Formulierung ist im Deutschen natürlich und unterscheidet diesen Zeitpunkt von der anschließend genannten Regierungsdauer.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: und regierte vierzig Jahre
  rationale: מָלַךְ bezeichnet das Regieren beziehungsweise Königsein; „regierte“ bewahrt hier die verbale Aussage der königlichen Rahmennotiz.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב ist hier eindeutig lokal gebraucht.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der hebräischen Namensformel „und der Name seiner Mutter war“.
- source_word: צִבְיָה
  choice: Zibja
  rationale: Der Personenname wird entsprechend der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מִבְּאֵר שָׁבַע
  choice: stammte aus Beerscheba
  rationale: Das Präfix מִן bezeichnet die Herkunft. Durch „stammte aus“ wird deutlich, dass sich die Herkunftsangabe auf die Mutter bezieht.
theological_decisions: []
