  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: de
  text: Da freuten sich alle führenden Amtsträger und das ganze Volk. Sie brachten ihre Gaben und warfen sie in die Truhe, bis sie damit fertig waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis die Truhe voll war“. Der hebräische Ausdruck bezeichnet allgemein das Abschließen oder Zu-Ende-Bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: freuten sich
  rationale: Das Verb שׂמח bezeichnet Freude beziehungsweise Frohsein; „freuten sich“ ist im modernen Deutschen natürlich und bewahrt die aktive gemeinschaftliche Reaktion.
- source_word: כָל הַשָּׂרִים
  choice: alle führenden Amtsträger
  rationale: שָׂרִים bezeichnet hier Personen in leitender öffentlicher Stellung. „Führende Amtsträger“ vermeidet das heute missverständliche „Fürsten“, das an Angehörige eines Herrscherhauses denken lassen könnte.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: Die Wiedergabe erhält den umfassenden kollektiven Sinn des Hebräischen.
- source_word: וַיָּבִיאוּ
  choice: Sie brachten ihre Gaben
  rationale: Das hebräische Verb bedeutet „sie brachten“, lässt das Objekt aber unausgesprochen. „Ihre Gaben“ ergänzt dieses im unmittelbaren Zusammenhang der Sammlung liegende Objekt idiomatisch.
- source_word: וַיַּשְׁלִיכוּ
  choice: warfen sie
  rationale: שלך bedeutet konkret „werfen“ oder „hineinwerfen“. Die Wiedergabe bewahrt die anschauliche Kraft des Verbs.
- source_word: לָאָרוֹן
  choice: in die Truhe
  rationale: אָרוֹן bezeichnet hier den Sammelbehälter für die Abgaben, nicht die Bundeslade; „Truhe“ ist daher kontextuell eindeutig.
- source_word: עַד לְכַלֵּה
  choice: bis sie voll war
  rationale: כלה bezeichnet das Erreichen eines Endes oder Abschlusses. Im Sammlungskontext ist die Füllung der Truhe eine plausible konkrete Deutung; die allgemeinere personenbezogene Deutung wird in der Fußnote erhalten.
