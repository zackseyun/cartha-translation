base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: de
  text: So führten die Arbeiter die Arbeit aus, und die Instandsetzung machte unter ihren Händen Fortschritte.[a] Sie stellten das Haus Gottes in seiner vorgesehenen Gestalt wieder her[b] und festigten es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Für die Arbeit stieg Wiederherstellung/Heilung auf, durch ihre Hand.« Das hebräische Wort אֲרוּכָה kann Heilung oder Wiederherstellung bedeuten und bezeichnet hier die Instandsetzung des Bauwerks.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie richteten das Haus Gottes nach seiner festgelegten Form auf«; auch »nach seinem Maßstab« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: So gingen die Arbeiter ans Werk
  rationale: Die wörtliche Wiederholung »die Ausführenden der Arbeit arbeiteten« wäre im Deutschen schwerfällig. Die idiomatische Formulierung gibt den aktiven Beginn beziehungsweise die Ausführung der Arbeit natürlich wieder.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: die Ausbesserung schritt voran
  rationale: אֲרוּכָה bezeichnet Heilung oder Wiederherstellung und wird hier bildlich auf die bauliche Instandsetzung bezogen; zusammen mit עלה liegt der Sinn eines erfolgreichen Fortschreitens nahe.
- source_word: בְּיָדָם
  choice: durch ihre Hand
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild und bezeichnet zugleich die Arbeiter als die Handelnden, durch die die Instandsetzung vorankam.
- source_word: וַיַּעֲמִידוּ
  choice: sie stellten … wieder her
  rationale: Der Hifil von עמד bedeutet grundlegend »zum Stehen bringen«; im Zusammenhang der Tempelreparatur ist damit die Wiederherstellung des Bauwerks gemeint.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die direkte Wiedergabe bleibt verständlich und bewahrt die übliche hebräische Bezeichnung für den Tempel.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: in seinem ursprünglichen Zustand
  rationale: מַתְכֹּנֶת kann die festgelegte Gestalt, Anordnung oder den ordnungsgemäßen Zustand bezeichnen. Im Reparaturkontext ist wahrscheinlich die Wiederherstellung der vorgesehenen beziehungsweise früheren Gestalt gemeint; die Alternative wird in einer Fußnote offengehalten.
- source_word: וַיְאַמְּצֻהוּ
  choice: und festigten es
  rationale: Der Piel von אמץ bedeutet »stärken, fest machen«. »Festigten« passt präzise zum baulichen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus Gottes« und »durch ihre Hand« bewahren zentrale Bilder des Hebräischen; idiomatisch schwerfällige Wiederholungen werden natürlich wiedergegeben. Die mögliche Bedeutungsbreite von אֲרוּכָה und מַתְכֻּנְתּוֹ bleibt in den Fußnoten sichtbar.
