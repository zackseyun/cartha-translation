source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: de
  text: Doch er sandte Propheten unter sie, um sie zu Jahwe zurückzubringen. Diese warnten sie eindringlich[a], aber sie hörten nicht darauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie legten Zeugnis gegen sie ab.« Das hebräische Verb kann sowohl feierliches Warnen als auch ein Zeugnis gegen jemanden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: er sandte
  rationale: Die übliche und im erzählenden Kontext natürliche Wiedergabe von שׁלח.
- source_word: בָּהֶם
  choice: unter sie
  rationale: Bei einem Verb des Sendens kann ב das Hineinsenden in die Mitte einer Gruppe bezeichnen; gemeint ist, dass Propheten in ihrem Umfeld auftraten.
- source_word: נְבִאִים
  choice: Propheten
  rationale: Direkte und etablierte deutsche Entsprechung.
- source_word: לַהֲשִׁיבָם
  choice: um sie … zurückzubringen
  rationale: Der Hifil von שׁוב drückt ein Veranlassen zur Rückkehr aus; die Formulierung bewahrt sowohl die kausative Bedeutung als auch die Beziehungsausrichtung.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben; אֶל bezeichnet hier die Rückkehr zu ihm.
- source_word: וַיָּעִידוּ בָם
  choice: Diese warnten sie eindringlich
  rationale: Der Hifil von עוד kann feierliches Warnen, Ermahnen oder Zeugnisablegen gegen jemanden ausdrücken. Im natürlichen Deutschen gibt »eindringlich warnen« die prophetische Dringlichkeit wieder; die forensische Alternative bleibt in der Fußnote erhalten.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: aber sie hörten nicht darauf
  rationale: Die Wendung bezeichnet aufmerksames Hören beziehungsweise Beherzigen. »Nicht darauf hören« ist idiomatisch und lässt offen, ob Unwilligkeit oder bloße Nichtbeachtung im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« gibt den Eigennamen erkennbar wieder und folgt der für das Projekt angegebenen Behandlung des Tetragramms.
- issue: Bedeutung von וַיָּעִידוּ בָם
  choice: sie warnten sie eindringlich
  alternative: sie legten Zeugnis gegen sie ab
  rationale: Das Verb trägt sowohl den Sinn feierlicher Warnung als auch einen forensischen Beiklang. Die Hauptfassung ist im modernen Deutschen verständlich; die Fußnote bewahrt die mögliche gerichtliche Nuance.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. »Doch« stellt den Gegensatz zum vorausgehenden Abfall heraus. Der zweite Satz vermeidet eine missverständliche Wiederholung des Pronomens und wahrt durch die Fußnote die Bedeutungsbreite des hebräischen Verbs.
