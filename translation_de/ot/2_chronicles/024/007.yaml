  terminology: „Atalja“ ist die geläufige deutsche Namensform. „Frevlerin“ wahrt die feminine Bezeichnung הַמִּרְשַׁעַת, „Söhne“ die ausdrücklich männliche Pluralform. „Jahwe“ gibt den Gottesnamen wieder, und „die Baale“ erhält den hebräischen Plural, ohne dessen genaue kultische Referenz einzuengen.
