source:
  edition: WLC
  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: de
  text: Denn Atalja, die Frevlerin, und ihre Söhne waren in das Haus Gottes eingebrochen und hatten sogar alle heiligen Gegenstände des Hauses Jahwes für die Baale verwendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für die Baale gemacht“. Das hebräische Verb kann „machen“ oder „tun“ bedeuten; hier ist wahrscheinlich gemeint, dass die heiligen Gegenstände für den Baalskult eingesetzt oder diesem zugeführt wurden.'
    reason: lexikalische Alternative und Bewahrung der Bedeutungsbreite
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anordnung ein und gibt die erklärende Funktion der Konjunktion natürlich wieder.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: Atalja, die Frevlerin
  rationale: „Atalja“ entspricht der geläufigen deutschen Namensform. Das feminine הַמִּרְשַׁעַת bezeichnet sie ausdrücklich als eine schuldhaft böse handelnde Frau; „die Frevlerin“ ist knapp, würdevoll und geschlechtsgenau.
- source_word: בָּנֶיהָ
  choice: ihre Söhne
  rationale: Bewahrt die ausdrückliche maskuline Pluralform des Hebräischen.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: waren in das Haus Gottes eingebrochen
  rationale: פרץ bezeichnet hier das gewaltsame Eindringen beziehungsweise Aufbrechen und die Verletzung des Heiligtums. Die deutsche Wendung vermittelt den gewaltsamen und unrechtmäßigen Zugriff, ohne über den genauen Umfang der Beschädigung hinauszugehen.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: alle heiligen Gegenstände des Hauses Jahwes
  rationale: קָדְשֵׁי meint die dem Heiligtum zugehörigen geheiligten Dinge. „Gegenstände“ macht den konkreten kultischen Bezug im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: für die Baale verwendet
  rationale: Das allgemeine Verb עשה bedeutet wörtlich „machen/tun“, bezeichnet mit ל in diesem Zusammenhang aber wahrscheinlich die Zweckentfremdung der heiligen Gegenstände für den Baalskult. Der Plural „Baale“ bewahrt בְּעָלִים.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen Jahwe und den Baalen.
- issue: Plural בְּעָלִים
  choice: die Baale
  alternative: Baal / die Baalsbilder
  rationale: Der hebräische Text hat den Plural. „Die Baale“ wahrt diese Mehrzahl, ohne festzulegen, ob verschiedene Erscheinungsformen, Bilder oder lokale Kulte gemeint sind.
- issue: Bedeutung von עָשׂוּ לַבְּעָלִים
  choice: für die Baale verwendet
  alternative: für die Baale gemacht
  rationale: Die kontextuelle Wiedergabe beschreibt die wahrscheinliche kultische Zweckentfremdung, während die Fußnote die formal nähere und offenere Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Gottes“ und „Haus Jahwes“ bewahren die parallelen hebräischen Wendungen; „Tempel“ wurde deshalb nicht eingesetzt. Das Plusquamperfekt stellt den erklärenden Rückblick im Zusammenhang klar heraus.
