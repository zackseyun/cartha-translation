  source_fidelity: Der Text gibt die syntaktische Verbindung von Atalja und ihren Söhnen als handelndes Subjekt zutreffend wieder. „Denn“ bewahrt die begründende Funktion von כִּי. „waren in das Haus Gottes eingebrochen“ vermittelt פרצוּ angemessen als gewaltsames, unrechtmäßiges Eindringen, ohne eine bestimmte Art der Beschädigung zu behaupten. „alle heiligen Gegenstände des Hauses Jahwes“ trifft כָּל־קָדְשֵׁי בֵית־יְהוָה. Die kontextuelle Wiedergabe von עָשׂוּ לַבְּעָלִים mit „für die Baale verwendet“ ist vertretbar; die Fußnote hält die nähere formale Wiedergabe „gemacht“ transparent vor.
