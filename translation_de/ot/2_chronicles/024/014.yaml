  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: de
  text: 'Nachdem sie fertig waren, brachten sie den Rest des Silbers[a] vor den König und Jojada. Er fertigte daraus[b] Geräte für das Haus Jahwes an: Geräte für den Dienst und für das Darbringen[c], Schalen sowie Geräte aus Gold und Silber. Während der ganzen Lebenszeit Jojadas brachten sie im Haus Jahwes beständig Brandopfer dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl „Silber“ als auch „Geld“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Und er machte es“. Das Verb steht im Singular, doch das Subjekt wird nicht ausdrücklich genannt. Das Objektsuffix bezieht sich auf das restliche Silber.'
    reason: grammatical_ambiguity
  - marker: c
    text: Wörtlich steht hier „für das Hinaufbringen/Darbringen“; was dargebracht wurde, wird an dieser Stelle nicht ausdrücklich gesagt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Nachdem sie fertig waren
  rationale: Die temporale Infinitivkonstruktion bezeichnet den Abschluss der zuvor erwähnten Arbeit. Die knappe deutsche Formulierung lässt das im Hebräischen ebenfalls unausgesprochene Objekt offen.
- source_word: שְׁאָר הַכֶּסֶף
  choice: den Rest des Silbers
  rationale: שְׁאָר bezeichnet den verbleibenden Rest; כֶּסֶף kann Geld oder Silber bedeuten. Da daraus Kultgeräte aus Gold und Silber hergestellt werden, steht hier der Materialaspekt im Vordergrund.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Er fertigte daraus
  rationale: Das Verb und das Objektsuffix stehen im Singular; das Suffix verweist auf das restliche Silber. „Fertigte daraus“ ist im Zusammenhang mit Tempelgeräten natürlich, ohne den Vorgang unnötig auszumalen.
- source_word: כֵלִים
  choice: Geräte
  rationale: כֵלִים ist eine breite Bezeichnung für Gegenstände, Geräte oder Gefäße. „Geräte“ eignet sich für unterschiedliche kultische Gegenstände.
- source_word: כְּלֵי שָׁרֵת
  choice: Geräte für den Dienst
  rationale: שָׁרֵת bezeichnet hier den kultischen Dienst. Die Formulierung ist verständlich und bewahrt den sakralen Zusammenhang.
- source_word: וְהַעֲלוֹת
  choice: für das Darbringen
  rationale: Der Infinitiv von עלה bezeichnet ein Hinaufbringen beziehungsweise Darbringen. Da das Objekt nicht genannt wird, ergänzt die Übersetzung weder „Opfer“ noch „Brandopfer“.
- source_word: וְכַפּוֹת
  choice: Schalen
  rationale: כַּפּוֹת bezeichnet hier kultische Behältnisse; ihre genaue Form ist nicht sicher. „Schalen“ ist eine gebräuchliche, hinreichend offene Wiedergabe.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: brachten sie ... beständig Brandopfer dar
  rationale: Die Konstruktion beschreibt eine fortdauernde beziehungsweise regelmäßig wiederkehrende Praxis. „Beständig“ wahrt diesen durativen Sinn, ohne ein ununterbrochenes Geschehen zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt diesen in der im Deutschen geläufigen Form als Namen wieder.
- issue: Nicht genanntes Objekt bei וְהַעֲלוֹת
  choice: für das Darbringen
  alternative: zum Darbringen von Opfern / Brandopfern
  rationale: Der Text nennt an dieser Stelle kein Objekt. Erst später im Vers werden Brandopfer ausdrücklich erwähnt; diese Verbindung wird daher nicht vorweggenommen.
- issue: Dauer der Opferpraxis
  choice: beständig ... während der ganzen Lebenszeit Jojadas
  alternative: sie brachten Brandopfer dar
  rationale: Die hebräische Verlaufsform zusammen mit תָּמִיד und der Zeitangabe hebt die anhaltende beziehungsweise regelmäßige Praxis hervor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Jahwes“ bewahrt die hebräische Ausdrucksweise, während „Geräte“, „Dienst“ und „Darbringen“ den kultischen Zusammenhang verständlich und ohne konfessionelle Zusätze wiedergeben.
