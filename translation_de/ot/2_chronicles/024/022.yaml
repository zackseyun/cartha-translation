base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: de
  text: 'Doch König Joasch erinnerte sich nicht an die Güte, die Jojada, sein Vater, ihm erwiesen hatte[a], sondern tötete dessen Sohn. Als dieser im Sterben lag, sagte er: »Jahwe möge es sehen und Rechenschaft dafür fordern.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Güte“ kann hier auch „Loyalität“ oder „treue Verbundenheit“ bedeuten. Jojada war nicht Joaschs leiblicher Vater; die Bezeichnung beschreibt wahrscheinlich seine väterliche Rolle als Beschützer und Förderer.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Die hebräische Formulierung ist knapp: „Jahwe möge sehen und es einfordern.“ Beim zweiten Verb ist das Objekt nicht ausdrücklich genannt. Es kann sich auf das Unrecht beziehungsweise die Blutschuld beziehen; das Verb kann bedeuten, ein Unrecht zu untersuchen und die Verantwortlichen dafür zur Rechenschaft zu ziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא זָכַר
  choice: erinnerte sich nicht
  rationale: Bewahrt die direkte Bedeutung des hebräischen Verbs, ohne die darin mitschwingende Undankbarkeit ausdrücklich in den Text hineinzudeuten.
- source_word: הַחֶסֶד
  choice: die Güte
  rationale: חֶסֶד bezeichnet hier eine gewichtige, loyal erwiesene Wohltat. „Güte“ ist im Deutschen natürlich und lässt zugleich Raum für die Bedeutungsnuancen von Loyalität und treuer Verbundenheit.
- source_word: יְהוֹיָדָע אָבִיו
  choice: Jojada, sein Vater
  rationale: Das Hebräische nennt Jojada Joaschs Vater. Da keine biologische Vaterschaft gemeint sein muss, bleibt die wörtliche Vaterbezeichnung erhalten und wird in einer Fußnote erläutert.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: sondern tötete dessen Sohn
  rationale: „Dessen“ macht im Deutschen eindeutig, dass der Sohn Jojadas gemeint ist. „Sondern“ gibt den scharfen inhaltlichen Gegensatz zur zuvor erwiesenen Güte idiomatisch wieder.
- source_word: וּכְמוֹתוֹ
  choice: Als dieser im Sterben lag
  rationale: Die Wendung wird temporal und durativ verstanden. „Dieser“ identifiziert den Sterbenden eindeutig als Jojadas Sohn.
- source_word: יֵרֶא יְהוָה
  choice: Jahwe möge es sehen
  rationale: Die Jussivform wird als Wunsch beziehungsweise Appell wiedergegeben; der Gottesname יהוה bleibt als „Jahwe“ erhalten.
- source_word: וְיִדְרֹשׁ
  choice: und Rechenschaft dafür fordern
  rationale: דרש kann in einem gerichtlichen Zusammenhang das Untersuchen und Einfordern von Verantwortung bezeichnen. Die Formulierung wahrt den richterlichen Sinn, ohne ihn auf unmittelbare Rache einzuengen.
theological_decisions:
- issue: Jojadas Bezeichnung als Joaschs Vater
  choice: Die Vaterbezeichnung im Haupttext beibehalten
  alternative: Jojada als Beschützer, Pflegevater oder väterlichen Förderer bezeichnen
  rationale: Der hebräische Text sagt ausdrücklich „sein Vater“. Eine Erklärung als väterliche Rolle ist plausibel, sollte die offene Bezeichnung des Ausgangstextes jedoch nicht ersetzen.
- issue: Der letzte Appell des sterbenden Sohnes
  choice: Bitte an Jahwe, das Unrecht wahrzunehmen und dafür Rechenschaft zu fordern
  alternative: Ausdrückliche Bitte um Rache oder bloße Feststellung, dass Jahwe es sehen werde
  rationale: Die beiden Jussivformen tragen den Charakter eines Appells. „Rechenschaft fordern“ erhält die gerichtliche Spannung, ohne eine bestimmte Art der Vergeltung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzbezüge wurden zur Vermeidung von Mehrdeutigkeit durch „dessen“ und „dieser“ verdeutlicht. Der Gottesname wird als „Jahwe“ wiedergegeben; die gerichtliche Aussage bleibt bewusst offen und wird nicht zu einer ausdrücklichen Racheforderung verschärft.
