    rationale: „Für“ kann im Deutschen einen Zweck oder ein Handeln zugunsten bzw. im Auftrag Jahwes nahelegen. Der hebräische Dativ-/Richtungsbezug wird klarer durch „Jahwe die Abgabe zu bringen“ wiedergegeben.
  - severity: low
    issue: Formulierung der Fußnotenbegründung
    rationale: Die Aussage, die knappe Formulierung lasse offen, „wie ausdrücklich das Auferlegen hervorgehoben ist“, ist unpräzise. Die Alternative betrifft vor allem die Einordnung der knappen Wortgruppe; der Haupttext kann die von עַל gestützte Lesart als auferlegte Abgabe beibehalten.
