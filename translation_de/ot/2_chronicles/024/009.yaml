  verdict: revise
  source_fidelity: Die Wiedergabe trifft den öffentlichen Ausruf, die verpflichtende Abgabe sowie den Bezug auf Mose, Israel und die Wüstenzeit gut. Das durch עַל יִשְׂרָאֵל gestützte Verständnis als Israel auferlegte Abgabe ist sachlich gut vertretbar. לַיהוָה bezeichnet jedoch am unmittelbarsten den Adressaten/Empfänger der zu bringenden Abgabe; im Deutschen ist der Dativ „Jahwe ... zu bringen“ dafür genauer als „für Jahwe ... bringen“.
  naturalness: „Sie ließen in Juda und Jerusalem ausrufen“ und der folgende Inhaltssatz sind modernes, verständliches Standarddeutsch. Die Umstellung zu „Jahwe die Abgabe zu bringen“ ist zugleich idiomatischer und eindeutiger als „für Jahwe die Abgabe bringen“.
  terminology: „Jahwe“, „Abgabe“ und „Diener Gottes“ sind angemessen. „Abgabe“ bewahrt gegenüber „Steuer“ die historische und semantische Offenheit von מַשְׂאַת. Die Fußnote sollte die alternative syntaktische Auffassung benennen, ohne den im Haupttext begründeten Charakter einer auferlegten Leistung unnötig zu relativieren.
