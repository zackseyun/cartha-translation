  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: de
  text: Und sie ließen in Juda und Jerusalem ausrufen, man solle Jahwe die Abgabe bringen, die Mose, der Diener Gottes, Israel in der Wüste auferlegt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Beitrag des Mose, des Dieners Gottes, für Israel in der Wüste“. Das hebräische Wort kann eine festgesetzte Abgabe oder einen Beitrag bezeichnen. Die knappe Wortgruppe kann auch enger als Bezeichnung der mit Mose verbundenen Abgabe verstanden werden; „Israel auferlegt“ gibt den Sinn von „auf Israel“ im Zusammenhang wieder.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: sie ließen … ausrufen
  rationale: Die Wendung bedeutet wörtlich „sie gaben eine Stimme/einen Ruf“ und bezeichnet hier eine öffentliche Bekanntmachung. Die deutsche Formulierung gibt den amtlich-öffentlichen Charakter natürlich wieder.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִַם
  choice: in Juda und Jerusalem
  rationale: Direkte Ortsangabe, die den räumlichen Umfang des Aufrufs wahrt.
- source_word: לְהָבִיא
  choice: man solle … bringen
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise Inhalt des öffentlichen Aufrufs. Im Deutschen fügt sich ein mit „man solle“ eingeleiteter abhängiger Satz natürlich an „ausrufen“ an.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kann den Empfänger beziehungsweise Bestimmungszweck der Abgabe bezeichnen. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מַשְׂאַת
  choice: die Abgabe
  rationale: Das Substantiv bezeichnet hier eine verpflichtende oder festgesetzte Leistung. „Abgabe“ wahrt diesen Sinn, ohne sie auf eine moderne Steuerform festzulegen.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: die Mose, der Diener Gottes, … auferlegt hatte
  rationale: Die knappe hebräische Verbindung wird als Bezug auf die von Mose angeordnete Abgabe verstanden. Der Titel „Diener Gottes“ bleibt unverändert erhalten.
- source_word: עַל יִשְׂרָאֵל
  choice: Israel … auferlegt hatte
  rationale: עַל kann bei einer Abgabe ausdrücken, dass sie Israel auferlegt war. Diese Wiedergabe macht den verpflichtenden Charakter idiomatisch deutlich; die mögliche allgemeinere Lesart wird in der Fußnote genannt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Übliche deutsche Wiedergabe für den Aufenthaltsraum Israels zur Zeit Moses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Bedeutung von מַשְׂאַת מֹשֶׁה … עַל יִשְׂרָאֵל
  choice: die Abgabe, die Mose … Israel … auferlegt hatte
  alternative: die Abgabe des Mose … für Israel
  rationale: Die gewählte Lesart verbindet den verpflichtenden Sinn von מַשְׂאַת mit עַל („auf/über“). Da die knappe Syntax auch allgemeiner verstanden werden kann, wird diese Spannung nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. „Ausru­fen“ wahrt den öffentlichen Charakter, „Abgabe“ den verpflichtenden Sinn, ohne moderne Verwaltungssprache übermäßig einzutragen.
