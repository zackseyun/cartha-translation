source:
  edition: WLC
  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: de
  text: Nach Jojadas Tod kamen die führenden Männer Judas[a] und verneigten sich vor dem König. Darauf hörte der König auf sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fürsten Judas“ oder „die führenden Amtsträger Judas“.'
    reason: lexical_alternative
  - marker: b
    text: '„Hörte auf sie“ kann hier auch bedeuten: „schenkte ihnen Gehör“ oder „folgte ihrem Rat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי מוֹת יְהוֹיָדָע
  choice: Nach Jojadas Tod
  rationale: Die zeitliche Abfolge wird in natürlichem Deutsch knapp wiedergegeben; das einleitende וְ muss nicht eigens mit „und“ übersetzt werden.
- source_word: יְהוֹיָדָע
  choice: Jojada
  rationale: Gebräuchliche deutsche Namensform des hebräischen Personennamens.
- source_word: בָּאוּ
  choice: kamen
  rationale: Die gewöhnliche Bewegungsbedeutung wird ohne unnötige Präzisierung des Zielortes wiedergegeben.
- source_word: שָׂרֵי יְהוּדָה
  choice: die führenden Männer Judas
  rationale: שָׂרִים bezeichnet hochgestellte politische Amtsträger oder Führungspersonen. Die Formulierung ist modern verständlich und vermeidet die mögliche Fehlvorstellung, es handle sich um Königssöhne.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: und verneigten sich vor dem König
  rationale: Die Wendung bezeichnet eine körperliche Ehrerbietung vor einem Höhergestellten. „Sich verneigen“ bewahrt die Handlung, ohne sie als Anbetung zu deuten.
- source_word: אָז
  choice: Darauf
  rationale: Kennzeichnet den unmittelbar anschließenden und wohl folgerichtigen nächsten Handlungsschritt.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: hörte der König auf sie
  rationale: שׁמע אל bedeutet hier nicht nur akustisches Hören, sondern auf jemanden hören; zugleich lässt die Formulierung offen, wie weit Zustimmung oder Befolgung reichte.
theological_decisions:
- issue: Art der Ehrerbietung gegenüber dem König
  choice: verneigten sich vor dem König
  alternative: warfen sich vor dem König nieder; huldigten dem König
  rationale: Das hebräische Verb kann je nach Zusammenhang Niederwerfung, Huldigung oder Anbetung bezeichnen. Da ein menschlicher König das Gegenüber ist, würde „anbeten“ die Aussage theologisch überbestimmen; „verneigten sich“ gibt die respektvolle körperliche Geste wieder.
- issue: Reaktion des Königs auf die führenden Männer
  choice: hörte auf sie
  alternative: schenkte ihnen Gehör; folgte ihrem Rat
  rationale: Die hebräische Verbindung kann sowohl aufmerksames Zuhören als auch Befolgen meinen. „Hörte auf sie“ bewahrt diese Bedeutungsbreite, ohne die im folgenden Kontext erkennbare Einflussnahme schon vollständig auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Die Formulierungen vermeiden sowohl altertümliches Amtsvokabular als auch eine theologisch überdeutete Wiedergabe der Verneigung.
