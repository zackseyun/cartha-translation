review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge und die Altersangabe des Hebräischen zutreffend wieder. Die Wendung וַיִּשְׂבַּע יָמִים ist jedoch eine idiomatische Aussage über ein erfülltes bzw. vollständiges Leben; die sehr traditionelle Formulierung „der Tage satt“ ist im heutigen Standarddeutsch leicht missverständlich, da „satt“ auch ein Überdrusssein nahelegen kann.
  naturalness: „Jojada wurde alt“ und „hundertdreißig Jahre alt“ sind natürlich. „War der Tage satt“ sowie „bei seinem Tod“ wirken dagegen deutlich archaisch bzw. weniger idiomatisch. Die Revision wahrt einen würdevollen biblischen Ton in modernem Standarddeutsch.
  terminology: „Jojada“ ist die gebräuchliche deutsche biblische Namensform. Die idiomatische Wiedergabe „hatte ein erfülltes Leben“ vermittelt den Sinn von „voll an Tagen“ ohne eine konfessionelle Deutung; die Fußnote erhält die hebräische Bildsprache.
  issues:
  - severity: medium
    issue: „war der Tage satt“ ist im modernen Deutsch missverständlich und stark veraltet.
    rationale: Die Wendung spiegelt zwar formal die hebräische Idiomatik, kann heute aber fälschlich den Eindruck erwecken, Jojada sei seiner Tage überdrüssig gewesen. Eine idiomatische Haupttextwiedergabe mit wörtlicher Fußnote ist hier klarer und zugleich quellennah.
  - severity: low
    issue: „Bei seinem Tod“ ist weniger natürlich als eine Altersangabe mit „im Alter von“.
    rationale: Die hebräische Präpositionalfügung bezeichnet den Zeitpunkt der Todesangabe. „Er starb im Alter von …“ gibt dies im Deutschen flüssig und präzise wieder.
  revised_text: Jojada wurde alt und hatte ein erfülltes Leben[a]. Dann starb er im Alter von hundertdreißig Jahren.
