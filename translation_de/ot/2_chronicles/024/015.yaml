base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: de
  text: Jojada wurde alt und hatte ein erfülltes Leben[a]. Dann starb er im Alter von hundertdreißig Jahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „war der Tage satt“ bzw. „war voll von Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: wurde alt
  rationale: Das Verb זקן bezeichnet hier im fortlaufenden Erzählzusammenhang das Altwerden; „wurde alt“ bewahrt den prozesshaften Sinn.
- source_word: יְהוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Namensform wiedergegeben.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: war der Tage satt
  rationale: Die traditionelle, noch verständliche deutsche Wendung bewahrt das hebräische Bild eines erfüllten und vollständigen Lebensalters, ohne es interpretierend aufzulösen.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: „Starb“ gibt מות direkt wieder; „dann“ macht die narrative Abfolge im natürlichen Deutschen deutlich.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: hundertdreißig Jahre alt
  rationale: Die hebräische Altersformel mit wörtlich „Sohn von“ wird entsprechend natürlichem modernem Deutsch als Altersangabe formuliert.
- source_word: בְּמוֹתוֹ
  choice: bei seinem Tod
  rationale: Die Präposition ב mit „Tod“ und Suffix bezeichnet hier den Zeitpunkt, auf den sich die Altersangabe bezieht.
