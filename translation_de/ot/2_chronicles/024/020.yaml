  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Satzbau und Inhalt weitgehend zuverlässig: Gottes Geist ist das handelnde Subjekt der Kleidungsmetapher; die Übertretung der Gebote, das Ausbleiben des Erfolgs und die wechselseitige Struktur von »verlassen« sind erhalten. »Erhöht« geht jedoch über die räumliche Angabe מֵעַל hinaus, die lediglich eine Position oberhalb des Volkes bezeichnet.'
