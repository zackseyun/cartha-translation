  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: de
  text: 'Da bekleidete der Geist Gottes Sacharja, den Sohn des Priesters Jojada,[a] und er stellte sich oberhalb des Volkes auf und sagte zu ihnen: »So spricht Gott: Warum übertretet ihr die Gebote Jahwes, sodass ihr keinen Erfolg habt?[b] Weil ihr Jahwe verlassen habt, hat auch er euch verlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da kam der Geist Gottes über Sacharja«; wörtlich: »bekleidete Sacharja«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und ihr werdet keinen Erfolg haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Im Zusammenhang prophetischer Bevollmächtigung bezeichnet die Wendung am natürlichsten Gottes Geist als handelnde göttliche Macht.
- source_word: לָבְשָׁה אֶת
  choice: bekleidete
  rationale: Die ungewöhnliche, anschauliche Kleidungsmetapher des hebräischen Verbs לבשׁ bleibt erhalten; die geläufigere Sinnwiedergabe wird in der Fußnote genannt.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: Secharja, den Sohn des Priesters Jojada
  rationale: Die hebräische Konstruktion bezeichnet Jojada als den Priester; die deutsche Wortstellung macht diesen Bezug eindeutig.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: er stellte sich erhöht über das Volk hin
  rationale: Die Formulierung bewahrt den räumlichen Sinn von מֵעַל und deutet eine erhöhte Position beim öffentlichen Reden an, ohne einen bestimmten Ort vorauszusetzen.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: So spricht Gott
  rationale: Dies entspricht der feierlichen prophetischen Botenformel in natürlichem, würdigem Deutsch.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֹת יְהוָה
  choice: Warum übertretet ihr die Gebote Jahwes
  rationale: עבר bezeichnet hier das Übertreten beziehungsweise Verletzen von Geboten; „übertretet“ wahrt den rechtlich-bundeshaften Ton.
- source_word: וְלֹא תַצְלִיחוּ
  choice: sodass ihr keinen Erfolg habt
  rationale: Die Wiedergabe versteht die Verknüpfung als Folge der Übertretung. Die ebenfalls mögliche koordinierte beziehungsweise zukünftige Lesart bleibt in einer Fußnote erhalten.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Weil ihr Jahwe verlassen habt, hat auch er euch verlassen
  rationale: Die Wiederholung von עזב und die wechselseitige Struktur werden im Deutschen bewusst bewahrt.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bezeichnung רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  alternative: ein Geist von Gott
  rationale: Der bestimmte und im Kontext handelnde göttliche Geist ist die naheliegende Lesart; die Übersetzung vermeidet darüber hinausgehende dogmatische Präzisierungen.
- issue: Gegenseitigkeit beim Verlassen
  choice: hat auch er euch verlassen
  alternative: und er verließ euch
  rationale: „Auch“ macht die im wiederholten Verb angelegte Entsprechung natürlich sichtbar, ohne die Aussage abzuschwächen oder ihre theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Kleidungsmetapher und die räumliche Aussage über Secharjas erhöhte Stellung bleiben erhalten. Die direkte prophetische Rede ist klar und feierlich, ohne unnötig altertümliche Formen.
