source:
  edition: WLC
  text: וַ/יִּקְשְׁר֣וּ עָלָ֔י/ו וַ/יִּרְגְּמֻ֥/הוּ אֶ֖בֶן בְּ/מִצְוַ֣ת הַ/מֶּ֑לֶךְ בַּ/חֲצַ֖ר בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: de
  text: Da verschworen sie sich gegen ihn und steinigten ihn auf Befehl des Königs im Vorhof des Hauses Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Hof des Hauses Jahwes“; gemeint ist der Tempelvorhof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: Da verschworen sie sich gegen ihn
  rationale: קשר mit עַל bezeichnet hier ein gemeinsames feindliches Komplott. „Sich gegen ihn verschwören“ gibt die Wendung idiomatisch und präzise wieder.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: steinigten ihn
  rationale: רגם bezeichnet die Steinigung; das instrumentale אֶבֶן ist im Deutschen bereits im Verb enthalten. „Steinigten ihn“ macht zudem den Hinrichtungscharakter deutlich.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: auf Befehl des Königs
  rationale: מִצְוָה bezeichnet hier eine autoritative Anordnung. Die Formulierung wahrt die im Text hervorgehobene Verantwortung des Königs.
- source_word: בַּחֲצַר
  choice: im Vorhof
  rationale: חָצֵר bezeichnet einen Hof beziehungsweise Vorhof; im Zusammenhang des Heiligtums ist „Vorhof“ die natürliche deutsche Bezeichnung.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt sowohl das hebräische Bild als auch den ausdrücklich gebrauchten Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ gibt ihn im Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; „Da“ stellt den erzählerischen Anschluss her. Das im deutschen Verb „steinigen“ bereits enthaltene Mittel wird nicht redundant als „mit einem Stein/mit Steinen“ wiederholt.
