  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: de
  text: Da befahl der König, und sie fertigten eine Truhe[a] an und stellten sie draußen am Tor des Hauses Jahwes auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische sagt wörtlich „eine Truhe“; „eine einzige Truhe“ ist ebenfalls möglich und kann die Bestimmung eines einzelnen Behälters hervorheben.
    reason: Bewahrt die mögliche numerische beziehungsweise hervorhebende Nuance von אֶחָד, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: befahl
  rationale: Das Verb bedeutet wörtlich „sagte“, hat hier aber angesichts der unmittelbar ausgeführten königlichen Anweisung den pragmatischen Sinn „befahl“.
- source_word: וַיַּעֲשׂוּ
  choice: sie fertigten … an
  rationale: Gibt das Herstellen eines konkreten Gegenstands natürlich wieder; das ungenannte Subjekt bleibt wie im Hebräischen unbestimmt.
- source_word: אֲרוֹן אֶחָד
  choice: eine einzige Truhe
  rationale: אֲרוֹן bezeichnet hier einen Behälter beziehungsweise eine Truhe, nicht die Bundeslade. „Eine einzige“ bildet אֶחָד ab und lässt die wahrscheinliche Betonung eines einzigen vorgesehenen Sammelbehälters erkennen.
- source_word: וַיִּתְּנֻהוּ
  choice: stellten sie … auf
  rationale: נתן hat hier den konkreten Sinn des Aufstellens beziehungsweise Platzierens der Truhe.
- source_word: בְּשַׁעַר
  choice: am Tor
  rationale: Die Präposition bezeichnet hier die Lage bei beziehungsweise an dem Tor.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die formnahe Wiedergabe bewahrt das biblische Bild vom Tempel als Haus Jahwes.
- source_word: חוּצָה
  choice: draußen
  rationale: Das Richtungs- beziehungsweise Ortsadverb kennzeichnet den Standort außerhalb.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den im hebräischen Text ausdrücklich stehenden Eigennamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Truhe“ vermeidet die irreführende Assoziation mit der Bundeslade; „fertigten … an“ und „stellten … auf“ sind idiomatisch und zugleich nah am konkreten Vorgang.
