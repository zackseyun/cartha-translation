source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: de
  text: Und sie begruben ihn in der Stadt Davids bei den Königen[a], denn er hatte Gutes getan in Israel sowie für Gott und sein Haus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: mit den Königen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: für Gott und für Gottes Haus, den Tempel. Die hebräische Formulierung vor „Gott“ kann wörtlich auch mit „mit Gott“ wiedergegeben werden.'
    reason: textual_explanation
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: Und sie begruben ihn
  rationale: Die aktive Verbform im Plural mit Objektsuffix der 3. Person Singular wird unmittelbar wiedergegeben; das unbestimmte Subjekt bleibt wie im Hebräischen ungenannt.
- source_word: בְעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Die geläufige deutsche Form der Ortsbezeichnung wahrt die hebräische Konstruktion.
- source_word: עִם הַמְּלָכִים
  choice: bei den Königen
  rationale: עִם bedeutet grundsätzlich „mit“; im Bestattungskontext bezeichnet „bei den Königen“ natürlich und präzise die ehrenvolle Beisetzung an ihrer Seite, ohne eine wörtlich schwerfällige Formulierung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die ehrenvolle Bestattung ein; „denn“ ist im Deutschen klar und stilistisch passend.
- source_word: עָשָׂה טוֹבָה
  choice: er hatte Gutes getan
  rationale: Die Wendung bezeichnet gutes beziehungsweise förderliches Handeln. Das Plusquamperfekt verdeutlicht den Rückblick auf sein vorausgegangenes Wirken.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition wird als Angabe des Bereichs wiedergegeben, in dem sein gutes Handeln geschah.
- source_word: וְעִם הָאֱלֹהִים
  choice: sowie für Gott
  rationale: Das erneute עִם ist syntaktisch ungewöhnlich, wenn es rein komitativ verstanden wird. „Für Gott“ gibt in diesem wertenden Zusammenhang die Ausrichtung seines guten Wirkens natürlich wieder, ohne eine Gemeinschaftsaussage zu unterstellen.
- source_word: וּבֵיתוֹ
  choice: und sein Haus
  rationale: Das Suffix bezieht sich am naheliegendsten auf Gott; die pronominale Form bleibt erhalten, während eine Fußnote das Haus als Tempel erläutert.
theological_decisions:
- issue: Bezugswort von „sein Haus“
  choice: „sein Haus“ bezeichnet Gottes Haus, den Tempel
  alternative: „sein Haus“ bezeichnet Jojadas eigenes Haus beziehungsweise seine Familie
  rationale: Das unmittelbar vorausgehende Bezugswort ist „Gott“, und der Erzählzusammenhang hebt Jojadas Wirken für den Tempel hervor. Die Übersetzung bewahrt dennoch das Pronomen statt die Deutung ausdrücklich in den Haupttext einzutragen.
- issue: Verhältnis des guten Handelns zu Gott
  choice: „für Gott“
  alternative: „mit Gott“ beziehungsweise „Gott gegenüber“
  rationale: Die Wiedergabe versteht die Präpositionalfügung als Ausrichtung des guten Wirkens auf Gott. Die Fußnote hält die ungewöhnliche, wörtlichere Alternative sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber idiomatisch gestaltet. „Haus“ wird als traditionelle Bezeichnung des Tempels beibehalten und in der Fußnote erläutert.
