base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: de
  text: Jojada nahm für ihn zwei Ehefrauen[a], und er zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „ihn“ und das folgende „er“ beziehen sich wahrscheinlich auf Joasch: Jojada verschaffte Joasch zwei Ehefrauen, und Joasch zeugte Söhne und Töchter. Weniger wahrscheinlich kann Jojada im ganzen Vers als Handelnder verstanden werden: Er nahm sich zwei Ehefrauen und zeugte Söhne und Töchter.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: nahm
  rationale: נשׂא mit אשה/נשים bezeichnet häufig das Nehmen einer Frau zur Ehe. Zusammen mit לּוֹ gibt „nahm für ihn“ die knappe hebräische Form wieder und lässt erkennen, dass Jojada die Ehen für Joasch arrangierte.
- source_word: ל֥וֹ
  choice: für ihn
  rationale: Die Präposition mit Pronominalsuffix bezeichnet hier am ehesten den Begünstigten der Handlung. Die Wiedergabe bewahrt zugleich die im Hebräischen vorhandene Bezugsoffenheit.
- source_word: יְהוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: נָשִׁים שְׁתָּיִם
  choice: zwei Frauen
  rationale: Im Zusammenhang ist von Ehefrauen die Rede. „Zwei Frauen“ klingt in der Verbindung mit „nahm“ natürlich und bewahrt die ausdrückliche Zahl.
- source_word: וַיּוֹלֶד
  choice: und er zeugte
  rationale: Die Hifil-Form von ילד mit männlichem Subjekt bedeutet „zeugen“. Das Pronomen „er“ bewahrt die mögliche syntaktische Mehrdeutigkeit des nicht ausdrücklich genannten Subjekts.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Der hebräische Text nennt männliche und weibliche Nachkommen ausdrücklich; diese Unterscheidung bleibt erhalten.
theological_decisions:
- issue: Bezug der Pronomen und Verben im Vers
  choice: Jojada nahm für Joasch zwei Frauen, und Joasch zeugte Söhne und Töchter; die Namensergänzung wird jedoch nicht in den Haupttext aufgenommen.
  alternative: Jojada selbst nahm zwei Frauen und zeugte Söhne und Töchter.
  rationale: Der größere Erzählzusammenhang handelt von Joasch, und לּוֹ („für ihn“) spricht dafür, dass Jojada in Joaschs Interesse handelte. Beim folgenden Verb kann weiterhin Joasch gemeint sein, obwohl Jojada das nächststehende ausdrücklich genannte Subjekt ist. Haupttext und Fußnote erhalten diese echte Bezugsspannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Satzstruktur und die Mehrdeutigkeit des Subjektbezugs werden gewahrt; die alternative Deutung wird in der Fußnote genannt.
