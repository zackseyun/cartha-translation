  terminology: „Joasch“ ist die übliche deutsche Namensform. „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. Die Fußnoten erläutern sachgerecht sowohl die Tempelreferenz als auch den Bedeutungsumfang von „erneuern“.
