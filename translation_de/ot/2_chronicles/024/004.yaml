  source_fidelity: „Danach“ gibt וַיְהִי אַחֲרֵי כֵן angemessen wieder. „nahm sich Joasch vor“ ist eine natürliche idiomatische Wiedergabe der hebräischen Herzenswendung und wahrt deren Bedeutung als Absicht. „das Haus Jahwes“ entspricht בֵּית יְהוָה; „zu erneuern“ deckt לְחַדֵּשׁ im gegebenen Baukontext zuverlässig ab.
