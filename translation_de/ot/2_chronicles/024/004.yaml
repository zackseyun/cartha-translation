  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: de
  text: Danach nahm sich Joasch vor, das Haus Jahwes[a] zu erneuern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: den Tempel Jahwes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wiederherzustellen; auch: auszubessern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung markiert den zeitlichen Übergang zu einem neuen Abschnitt der Erzählung. „Danach“ gibt dies in natürlichem, knappem Deutsch wieder.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: nahm sich Joasch vor
  rationale: Die hebräische Herzenswendung bezeichnet Joaschs innere Absicht. „Nahm sich … vor“ ist im modernen Deutsch verständlich und vermeidet eine unnatürliche wörtliche Wiedergabe.
- source_word: לְחַדֵּשׁ
  choice: zu erneuern
  rationale: Das Verb bedeutet, etwas wieder neu zu machen. „Erneuern“ bewahrt die Bedeutungsbreite; im Zusammenhang kann damit die Wiederherstellung beziehungsweise Ausbesserung des Tempels gemeint sein.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus Jahwes“ bewahrt die Bildsprache des Hebräischen; gemeint ist der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen geläufige Umschrift des göttlichen Namens und gibt das Tetragramm als Eigennamen statt durch einen Titel wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Namen; „der HERR“ wäre die traditionelle ersetzende Lesung.
- issue: Stärke von Joaschs innerer Absicht
  choice: nahm sich vor
  alternative: fasste den festen Entschluss
  rationale: Der hebräische Ausdruck bezeichnet eine innere Absicht, ohne zwingend den stärkeren Nachdruck eines ausdrücklich festen Entschlusses zu tragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Herzenswendung wird idiomatisch wiedergegeben; „Haus Jahwes“ bleibt als quellennahes Bild erhalten und wird in einer Fußnote erläutert.
