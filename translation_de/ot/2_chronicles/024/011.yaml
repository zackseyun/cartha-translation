source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: de
  text: Immer wenn die Leviten die Truhe zur Aufsicht des Königs brachten[a] und man sah, dass viel Geld darin war, kamen der Schreiber des Königs und der Beauftragte des Oberpriesters. Sie leerten die Truhe, hoben sie auf und stellten sie wieder an ihren Platz. So machten sie es Tag für Tag und sammelten sehr viel Geld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung kann auch im Sinn von »zur amtlichen Kontrolle des Königs« verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Silber«; hier ist damit das gesammelte Geld gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: die Truhe
  rationale: Im Zusammenhang bezeichnet das Wort den für die Gaben bestimmten Sammelbehälter, nicht die Bundeslade. »Truhe« ist im Deutschen natürlich und vermeidet diese Verwechslung.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: zur Aufsicht des Königs
  rationale: פְּקֻדָּה bezeichnet hier wahrscheinlich die königliche Aufsicht beziehungsweise amtliche Kontrolle. Die knappe Wiedergabe bewahrt die administrative Bedeutung, ohne einen nicht ausdrücklich genannten Ort einzuführen.
- source_word: בְּיַד הַלְוִיִּם
  choice: die Leviten … brachten
  rationale: Die Wendung mit בְּיַד kennzeichnet hier die Leviten als handelnde Vermittler; im Deutschen wird dies natürlich durch ein aktives Verb ausgedrückt.
- source_word: וְכִרְאוֹתָם
  choice: und man sah
  rationale: Das hebräische Suffix ist pluralisch, doch sein genauer Bezug ist im Satz nicht eindeutig. Die unpersönliche Form wahrt diese Offenheit.
- source_word: רַב הַכֶּסֶף
  choice: dass viel Geld darin war
  rationale: כֶּסֶף kann »Silber« oder »Geld« bedeuten. Im Zusammenhang einer Sammlung ist »Geld« sachlich und idiomatisch; »darin« verdeutlicht den aus dem Kontext erschlossenen Bezug zur Truhe.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: der Schreiber des Königs
  rationale: Die traditionelle Amtsbezeichnung »Schreiber« bewahrt den historischen Charakter, ohne die Funktion enger als »Sekretär« festzulegen.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: der Beauftragte des Oberpriesters
  rationale: Die Konstruktverbindung bezeichnet am ehesten einen Amtsträger unter der Verantwortung des Oberpriesters. »Beauftragter« lässt dessen genauen Rang offen.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: Sie leerten die Truhe
  rationale: Das Verb bezeichnet hier das Entfernen ihres Inhalts; »leeren« ist die sachgerechte und natürliche deutsche Formulierung.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: trugen sie fort und brachten sie wieder an ihren Platz
  rationale: נשׂא bezeichnet das Aufnehmen beziehungsweise Tragen, während die Hifilform von שׁוב die Rückkehr an den ursprünglichen Platz ausdrückt. »fort« macht die Abfolge im Deutschen verständlich, ohne ein Ziel zu ergänzen.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: So machten sie es Tag für Tag
  rationale: Die Formulierung gibt den wiederholten täglichen Vorgang idiomatisch und mit seiner iterativen Bedeutung wieder.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: und sammelten sehr viel Geld
  rationale: Die Wiedergabe erfasst sowohl das Sammeln als auch die durch לָרֹב hervorgehobene große Menge in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde für bessere Verständlichkeit in mehrere Sätze gegliedert. Die Amtsbezeichnungen bleiben historisch geprägt, während unklare Einzelheiten wie der genaue Bezug von »sie sahen« und der Rang des priesterlichen Amtsträgers nicht unnötig festgelegt werden.
