source:
  edition: WLC
  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: de
  text: 'Da rief er die Priester und die Leviten zusammen und sagte zu ihnen: »Zieht hinaus in die Städte Judas und sammelt Jahr für Jahr von ganz Israel Silber[a], um das Haus eures Gottes instand zu setzen[b]. Beeilt euch damit!« Doch die Leviten beeilten sich nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geld«. Das Hebräische verwendet das konkrete Wort »Silber« auch als Bezeichnung für Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »zu stärken«; bei einem Gebäude ist damit gemeint, es auszubessern oder wiederherzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rief … zusammen
  rationale: Das Qal von קבץ bezeichnet hier das Versammeln von Personen. »Zusammenrufen« ist im Deutschen natürlich und passt zur anschließenden Anrede.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Zieht hinaus in die Städte Judas
  rationale: »Zieht hinaus« gibt den Imperativ von יצא mit seiner Richtungsnuance wieder; »in die Städte Judas« bezeichnet das Ziel.
- source_word: וְקִבְצוּ מִכָּל יִשְׂרָאֵל כֶּסֶף
  choice: und sammelt … von ganz Israel Silber
  rationale: קבץ bedeutet mit einem Zahlungsmittel als Objekt »sammeln/einsammeln«. כֶּסֶף heißt konkret »Silber«, kann aber zugleich als Geldbezeichnung dienen. »Ganz Israel« bewahrt den kollektiven Ausdruck des Hebräischen.
- source_word: לְחַזֵּק אֶת בֵּית אֱלֹהֵיכֶם
  choice: um das Haus eures Gottes instand zu setzen
  rationale: חזק bedeutet grundsätzlich »stärken«; bei einem Gebäude bezeichnet es dessen bauliche Sicherung oder Ausbesserung. »Instand setzen« vermittelt diesen Sinn, während »Haus eures Gottes« die Ausdrucksweise des Ausgangstextes bewahrt.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wendung bezeichnet eine regelmäßig jährlich wiederkehrende Sammlung.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: Beeilt euch damit! Doch die Leviten beeilten sich nicht.
  rationale: Die Wiederholung von מהר wird im Deutschen durch »beeilen« in Aufforderung und Feststellung hörbar bewahrt; »doch« gibt den Gegensatz wieder.
theological_decisions:
- issue: Umfang von מִכָּל יִשְׂרָאֵל („von ganz Israel“)
  choice: von ganz Israel
  alternative: von allen Israeliten
  rationale: Der kollektive Name »Israel« bleibt erhalten und wird nicht auf Juda eingeengt. So bleibt die historische und theologische Reichweite der Formulierung des Chronisten offen.
- issue: Bezeichnung des Heiligtums als בֵּית אֱלֹהֵיכֶם
  choice: das Haus eures Gottes
  alternative: der Tempel eures Gottes
  rationale: »Haus« folgt der konkreten theologischen Ausdrucksweise des Hebräischen, ohne sie durch die kontextuell zutreffende, aber erklärende Bezeichnung »Tempel« zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und nachdrücklich; die Wiederholung von »beeilen« bildet die bewusste Wiederholung des hebräischen Verbs ab. »Silber« und »Haus eures Gottes« bewahren die konkrete Bildsprache des Ausgangstextes.
