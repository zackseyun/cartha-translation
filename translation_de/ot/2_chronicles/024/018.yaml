source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: de
  text: Sie verließen das Haus Jahwes, des Gottes ihrer Väter, und dienten den Ascheren[a] und den Götzen. Da kam Zorn über Juda und Jerusalem wegen dieser ihrer Schuld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Aschera-Pfähle. Der hebräische Ausdruck bezeichnet Aschera-Kultgegenstände und kann zugleich an die Göttin Aschera erinnern.'
    reason: Lexikalische Alternative; die genaue Art des bezeichneten Kultgegenstands ist nicht eindeutig.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie verließen
  rationale: עזב bedeutet verlassen oder im Stich lassen. „Verließen“ ist gegenwärtiges, natürliches Deutsch und lässt den Zusammenhang die darin liegende Untreue verdeutlichen.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt den hebräischen Ausdruck und ist im Zusammenhang als Tempel verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ gibt den göttlichen Eigennamen im modernen deutschen Bibelstil erkennbar wieder.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: der Gott ihrer Väter
  rationale: Die Formulierung erhält den familiären und bundestheologischen Klang des hebräischen Ausdrucks.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד bezeichnet hier religiösen Dienst beziehungsweise Verehrung. „Dienten“ bleibt näher am Hebräischen, ohne den Begriff unnötig einzuengen.
- source_word: הָאֲשֵׁרִים
  choice: die Ascheren
  rationale: Der eingedeutschte, vom Hebräischen abgeleitete Plural wahrt die mögliche Beziehung sowohl zu Aschera-Kultgegenständen als auch zur Göttin Aschera; die Fußnote nennt die verbreitete konkretere Deutung.
- source_word: הָעֲצַבִּים
  choice: die Götzen
  rationale: Der Ausdruck bezeichnet kultische Bilder beziehungsweise Götzen und trägt eine abwertende Färbung, die „Götzen“ klar wiedergibt.
- source_word: וַיְהִי קֶצֶף
  choice: da kam Zorn
  rationale: Die knappe Folgeformel gibt den Zorn als eintretende Konsequenz wieder, ohne seinen im Kontext klaren göttlichen Urheber ausdrücklich hinzuzufügen.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: über Juda und Jerusalem
  rationale: „Zorn kam über“ entspricht der hebräischen Konstruktion mit עַל und bezeichnet das hereinbrechende Gericht.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: wegen dieser ihrer Schuld
  rationale: Die Präposition ist kausal; die Formulierung bewahrt sowohl den Demonstrativbezug „dieser“ als auch den possessiven Nachdruck „ihrer“.
theological_decisions:
- issue: Urheber des Zorns
  choice: Der Zorn bleibt im Haupttext ohne ausdrücklichen Zusatz als göttlicher Zorn erkennbar.
  alternative: „Da kam der Zorn Gottes/Jahwes über Juda und Jerusalem.“
  rationale: Der Zusammenhang macht den göttlichen Ursprung deutlich, doch im Hebräischen steht lediglich „Zorn“. Die Übersetzung fügt daher keinen ausdrücklichen Besitzer hinzu.
- issue: Bedeutung von אֲשֵׁרִים
  choice: Im Haupttext steht der hebräisch abgeleitete Ausdruck „Ascheren“.
  alternative: „Aschera-Pfähle“ oder „Aschera-Kultbilder“.
  rationale: Der Ausdruck kann kultische Aschera-Gegenstände bezeichnen und zugleich die Göttin Aschera anklingen lassen. Die Beibehaltung des Fachbegriffs vermeidet eine vorschnelle Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper hebräischer Erzählstruktur. Kulturspezifische Mehrdeutigkeit wird im Haupttext bewahrt und in der Fußnote knapp erläutert.
