  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Elemente des Hebräischen zuverlässig wieder: Joaschs Söhne, die schwierige Wendung רֹב הַמַּשָּׂא עָלָיו, die Grundlegung des Hauses Gottes, den Verweis auf den Midrasch des Buches der Könige sowie Amazjas Thronfolge. „Zahlreichen Aussprüche gegen ihn“ ist eine vertretbare kontextuelle Deutung der umstrittenen Wendung; die Fußnote bewahrt die wesentlichen Alternativen. „Grundlegung“ ist dem Wortlaut von יסוד näher als „Wiederaufbau“ und legt keine über den Text hinausgehende historische Rekonstruktion fest.'
  naturalness: Modernes, verständliches und zugleich angemessen würdiges Standarddeutsch. Die Aufzählung mit Gedankenstrich und „siehe“ bildet die emphatische Vorlage gut ab. „Wurde an seiner Stelle König“ ist eine natürliche deutsche Wiedergabe der Thronfolgeformel.
  terminology: „Haus Gottes“ bewahrt die hebräische Benennung, „Midrasch“ ist als bewusst nicht überpräzisierende Transkription sinnvoll und wird sachgerecht erläutert. „Amazja“ ist die übliche deutsche Namensform. Die Fußnotenmarker sind korrekt an den beiden erläuterungsbedürftigen Stellen verankert.
