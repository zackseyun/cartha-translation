  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָנָ֞י/ו ו/רב הַ/מַּשָּׂ֣א עָלָ֗י/ו וִ/יסוֹד֙ בֵּ֣ית הָ/אֱלֹהִ֔ים הִנָּ֣/ם כְּתוּבִ֔ים עַל מִדְרַ֖שׁ סֵ֣פֶר הַ/מְּלָכִ֑ים וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: de
  text: Seine Söhne, die zahlreichen Aussprüche gegen ihn[a] und die Grundlegung des Hauses Gottes – siehe, sie sind im Midrasch zum Buch der Könige[b] niedergeschrieben. Und sein Sohn Amazja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Möglich sind auch: „die Größe der Last auf ihm“, „die Fülle des Ausspruchs gegen ihn“ oder sogar „die schwere Abgabe, die ihm auferlegt wurde“. Das Wort מַשָּׂא kann „Last“, „Ausspruch“ und in manchen Zusammenhängen eine auferlegte Last oder Abgabe bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Midrasch“ bezeichnet hier wahrscheinlich eine auslegende Aufzeichnung, Darlegung oder Kommentierung zum Buch der Könige.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Seine Söhne
  rationale: Gibt das Substantiv im Plural mit dem Suffix der 3. Person Singular direkt wieder; die einleitende Konjunktion wird im natürlichen deutschen Satzbau nicht eigens ausgedrückt.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: die zahlreichen Aussprüche gegen ihn
  rationale: מַשָּׂא kann eine Last oder einen prophetischen Ausspruch bezeichnen. „Aussprüche“ wahrt hier den möglichen Bezug auf Worte des Gerichts, ohne die schwierige Wendung zu stark festzulegen; רֹב wird als große Zahl beziehungsweise Fülle verstanden. Andere mögliche Deutungen stehen in der Fußnote.
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: die Grundlegung des Hauses Gottes
  rationale: „Grundlegung“ gibt die Ableitung von יסד genauer wieder als das kontextuell naheliegende, aber stärker deutende „Wiederaufbau“. „Haus Gottes“ bewahrt die hebräische Ausdrucksweise, während der Zusammenhang den Tempel erkennen lässt.
- source_word: הִנָּם כְתוּבִים
  choice: siehe, sie sind … niedergeschrieben
  rationale: „Siehe“ erhält die hervorhebende, hinweisende Funktion von הִנָּם; „niedergeschrieben“ gibt das passive Partizip idiomatisch wieder.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: im Midrasch zum Buch der Könige
  rationale: Die Transliteration „Midrasch“ vermeidet eine vorschnelle Festlegung der Gattung; „zum“ gibt den Bezug auf das Buch der Könige in natürlichem Deutsch wieder. Eine Erläuterung folgt in der Fußnote.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַּחְתָּיו
  choice: Und sein Sohn Amazja wurde an seiner Stelle König
  rationale: Natürliche deutsche Wiedergabe der üblichen Formel für die Thronfolge; sie bewahrt sowohl die Sohnschaft als auch das Nachfolgeverhältnis.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwierige hebräische Wendung wird im Haupttext lesbar wiedergegeben, ihre echte lexikalische Mehrdeutigkeit jedoch in der Fußnote offengehalten. „Siehe“ und „Haus Gottes“ bewahren bewusst den leicht feierlichen Ton und die Bildsprache der Vorlage.
