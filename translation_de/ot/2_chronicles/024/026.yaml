base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: de
  text: 'Und dies waren die Männer, die sich gegen ihn verschworen: Sabad, der Sohn der Ammoniterin Schimat, und Jehosabad, der Sohn der Moabiterin Schimrit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies waren
  rationale: Die Formulierung leitet in der rückblickenden Erzählung die namentliche Identifizierung der Verschwörer ein; das Präteritum entspricht natürlichem deutschem Erzählstil.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: die Männer, die sich gegen ihn verschworen
  rationale: Das Hitpael-Partizip von קשר bezeichnet hier ein gemeinsames Komplott; עָלָיו kennzeichnet die Zielperson. Die Wiedergabe ist idiomatisch und erhält den Bezug auf eine konkrete Personengruppe.
- source_word: זָבָד
  choice: Sabad
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen hebräischen Umschrift wiedergegeben.
- source_word: שִׁמְעָת
  choice: Schimat
  rationale: Der Personenname wird entsprechend deutscher Laut- und Schreibkonvention transliteriert.
- source_word: הָעַמּוֹנִית
  choice: der Ammoniterin
  rationale: Die feminine Singularform bezeichnet Schimat als ammonitische Frau; die deutsche Form bewahrt sowohl Herkunft als auch Geschlecht.
- source_word: וִיהוֹזָבָד
  choice: und Jehosabad
  rationale: Der Personenname wird transliteriert und die vorangestellte Konjunktion ausdrücklich wiedergegeben.
- source_word: שִׁמְרִית
  choice: Schimrit
  rationale: Der Personenname wird entsprechend deutscher Laut- und Schreibkonvention transliteriert.
- source_word: הַמּוֹאָבִית
  choice: der Moabiterin
  rationale: Die feminine Singularform bezeichnet Schimrit als moabitische Frau; die Wiedergabe ist präzise und natürlich.
