source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: de
  text: Joasch tat, was in den Augen Jahwes richtig war, solange der Priester Jojada lebte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Tage des Priesters Jojada“.'
    reason: Die Fußnote dokumentiert die konkrete hebräische Zeitformel, während der Haupttext sie in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עָשָׂה bedeutet gewöhnlich „tun/machen“. Zusammen mit הַיָּשָׁר ergibt sich im Deutschen natürlich „tat, was … richtig war“.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: יָשָׁר bezeichnet hier das Rechte beziehungsweise Richtige. Die substantivisch gebrauchte Form wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die hebräische Perspektivformel wird bildgetreu und im Deutschen verständlich als „in den Augen“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: כָּל יְמֵי
  choice: solange … lebte
  rationale: Wörtlich „alle Tage [Jojadas]“ bezeichnet die gesamte Lebenszeit Jojadas. Die deutsche Wendung macht den zeitlichen Umfang natürlich und eindeutig deutlich.
- source_word: יְהוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenform wiedergegeben.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die Apposition kennzeichnet Jojadas Amt und wird ohne Erweiterung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Begrenzung von Joaschs richtigem Handeln
  choice: solange der Priester Jojada lebte
  alternative: alle Tage des Priesters Jojada
  rationale: Die Formulierung bewahrt die im Vers ausgesagte Bindung an Jojadas Lebenszeit, ohne darüber hinaus eine Ursache für Joaschs Verhalten zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute hebräische Bildrede „in den Augen“ bleibt erhalten; die Zeitangabe wird idiomatisch formuliert. Der Gottesname erscheint als „Jahwe“.
