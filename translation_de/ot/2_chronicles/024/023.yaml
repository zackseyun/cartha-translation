base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: de
  text: Zur Wende des Jahres[a] zog das Heer Arams[b] gegen ihn herauf. Sie kamen nach Juda und Jerusalem und vernichteten alle Obersten des Volkes aus der Mitte des Volkes[c]. Ihre gesamte Beute[d] schickten sie dem König von Damaskus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Am Ende des Jahres“. Die hebräische Wendung bezeichnet die Wende beziehungsweise den Umlauf des Jahres.'
    reason: lexical_alternative
  - marker: b
    text: Aram ist der hebräische Name für das Gebiet, das häufig als „Syrien“ bezeichnet wird.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht die ungewöhnliche Formulierung: „alle Obersten des Volkes aus dem Volk“.'
    reason: source_ambiguity
  - marker: d
    text: 'Oder: „ihr gesamtes Plündergut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: Als das Jahr sich wendete
  rationale: תְּקוּפָה bezeichnet einen Umlauf oder Wendepunkt. Die Formulierung gibt den jahreszeitlichen Übergang wieder, ohne ihn vorschnell auf ein bestimmtes Kalendersystem festzulegen.
- source_word: עָלָה עָלָיו
  choice: zog ... gegen ihn herauf
  rationale: עלה mit עַל ist hier militärisch gebraucht. „Gegen ihn heraufziehen“ bewahrt sowohl die Angriffsrichtung als auch die anschauliche hebräische Ausdrucksweise.
- source_word: חֵיל אֲרָם
  choice: das Heer Arams
  rationale: חֵיל bezeichnet in diesem Zusammenhang eine Streitmacht. Der historische Name „Aram“ wird beibehalten und nicht durch die spätere Bezeichnung „Syrien“ ersetzt.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Sie kamen nach Juda und Jerusalem
  rationale: בוא bedeutet gewöhnlich „kommen“ oder „hineingehen“. Der militärische Zusammenhang ist bereits durch das Heer und das Vorgehen gegen den König deutlich.
- source_word: וַיַּשְׁחִיתוּ
  choice: vernichteten
  rationale: Das Hifil von שׁחת kann „vernichten“ oder „zugrunde richten“ bedeuten. Da Menschen das Objekt sind, gibt „vernichteten“ die tödliche Gewalt klar und würdig wieder.
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: alle führenden Männer des Volkes aus der Mitte des Volkes
  rationale: שָׂרִים meint führende Männer, Machthaber oder Amtsträger. Die ungewöhnliche Wiederholung von עָם und die absondernde Bedeutung von מִן werden bewusst bewahrt, statt die schwierige Formulierung stillschweigend zu glätten.
- source_word: וְכָל שְׁלָלָם
  choice: Ihre gesamte Beute
  rationale: שָׁלָל bezeichnet im Krieg erbeutetes Gut. Das Possessivpronomen bezieht sich im Satz am natürlichsten auf die von den Aramäern zusammengetragene Beute.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: schickten sie dem König von Damaskus
  rationale: Die Wendung bezeichnet den in Damaskus herrschenden König. Der deutsche Dativ nach „schicken“ ist natürlich und entspricht der Zielangabe mit לְ.
