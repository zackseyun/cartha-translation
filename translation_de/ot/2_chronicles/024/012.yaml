source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: de
  text: Der König und Jojada übergaben es denen, die die Arbeiten für den Dienst am Haus Jahwes ausführten.[a] Sie stellten Steinmetze und Handwerker ein, um das Haus Jahwes wiederherzustellen, und außerdem Handwerker für Eisen und Bronze,[b] um das Haus Jahwes zu verstärken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen „es“ bezieht sich im Zusammenhang auf das eingesammelte Geld.
    reason: referent_clarification
  - marker: b
    text: Hebräisch „Kupfer“ oder „Bronze“; im damaligen Handwerkskontext ist wahrscheinlich Bronze gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: übergaben es
  rationale: Das Verb נתן mit maskulinem Objektsuffix verweist im Zusammenhang auf das eingesammelte Geld. „Übergaben es“ gibt die Weitergabe an die für die Arbeiten zuständigen Personen natürlich wieder, ohne das Bezugswort in den Text einzufügen.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: denen, die für die Arbeiten am Haus Jahwes verantwortlich waren
  rationale: Die hebräische Formulierung ist verdichtet und geschichtet. Die deutsche Wiedergabe bezeichnet die mit der Ausführung beziehungsweise Organisation der Tempelarbeiten betrauten Personen, ohne eine bestimmte Amtsbezeichnung einzuführen.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus Jahwes“ bildet בית יהוה formal transparent ab; im Kontext ist damit der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Diese stellten … ein
  rationale: Die Verbindung von היה mit Partizip beschreibt hier die Tätigkeit des Anwerbens beziehungsweise Beschäftigens. „stellten … ein“ ist idiomatisches modernes Deutsch.
- source_word: חֹצְבִים
  choice: Steinmetze
  rationale: Im Zusammenhang der Wiederherstellung eines Gebäudes bezeichnet das Wort Arbeiter, die Steine behauen; „Steinmetze“ ist präzise und allgemein verständlich.
- source_word: חָרָשִׁים
  choice: Handwerker
  rationale: חרש kann allgemein einen fachkundigen Handwerker bezeichnen. Die Übersetzung vermeidet die unbelegte Einschränkung auf Zimmerleute.
- source_word: לְחַדֵּשׁ
  choice: wiederherzustellen
  rationale: Das Piel von חדש bezeichnet hier das Erneuern des beschädigten Gebäudes. „wiederherstellen“ umfasst sowohl Ausbesserung als auch Erneuerung.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: Eisen- und Bronzearbeiter
  rationale: Die Formulierung bezeichnet fachkundige Bearbeiter dieser Metalle. Das Kompositum ist im Deutschen knapp und lässt offen, welche einzelnen Metallarbeiten sie ausführten.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im antiken Bau- und Handwerkskontext ist „Bronze“ die naheliegende Wiedergabe; lexikalisch ist auch „Kupfer“ möglich.
- source_word: לְחַזֵּק
  choice: zu verstärken
  rationale: Das Verb חזק bedeutet hier, das Gebäude baulich fest beziehungsweise stabil zu machen. „verstärken“ passt zum konkreten Baukontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche Übersetzungskonvention.
- issue: Bedeutung von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: Die formnahe Wiedergabe wahrt das biblische Bild vom „Haus“ Gottes; aus dem Zusammenhang ist eindeutig, dass der Tempel gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verdichtete erste Tätigkeitsbezeichnung wurde für natürliche Verständlichkeit moderat entfaltet. „Haus Jahwes“ bewahrt die wiederholte hebräische Wendung, während „wiederherstellen“ und „verstärken“ die unterschiedlichen Verben erkennbar halten.
