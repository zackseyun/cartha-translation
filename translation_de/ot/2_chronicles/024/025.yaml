source:
  edition: WLC
  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: de
  text: Als sie von ihm abzogen – sie ließen ihn schwer krank zurück –, verschworen sich seine Diener gegen ihn wegen des Blutes der Söhne des Priesters Jojada[a]. Sie töteten ihn auf seinem Bett, und er starb. Man begrub ihn in der Stadt Davids, aber nicht in den Gräbern der Könige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen des Blutes der Söhne des Priesters Jojada“. Im Zusammenhang kann besonders das Blut Sacharjas gemeint sein, des Sohnes Jojadas (Verse 20–22).'
    reason: Der masoretische Text hat den Plural „Söhne“, während der vorausgehende Bericht ausdrücklich einen Sohn, Sacharja, nennt.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Als sie von ihm abzogen
  rationale: Die Präposition ב mit dem Infinitivus constructus bezeichnet hier den Zeitpunkt; „abzogen“ passt zum Rückzug des aramäischen Heeres.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: sie ließen ihn schwer krank zurück
  rationale: כִּי erläutert hier den Umstand des Abzugs. מַחֳלָיִם steht im Plural für Krankheiten oder schwere Leiden; idiomatisches Deutsch gibt die Intensität mit „schwer krank“ wieder, ohne ausdrücklich „verwundet“ in den Text einzutragen.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: verschworen sich seine Diener gegen ihn
  rationale: Das Hitpael von קשר bezeichnet eine Verschwörung. עֲבָדָיו kann am Königshof Diener oder Amtsträger meinen; „Diener“ ist die direkte, im Deutschen verständliche Wiedergabe.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: wegen des Blutes der Söhne des Priesters Jojada
  rationale: בְּ wird kausal wiedergegeben. „Blut“ bewahrt die konkrete Sprache des Hebräischen und ihren Bezug auf die Blutschuld; der masoretische Plural „Söhne“ bleibt im Haupttext erhalten.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Sie töteten ihn auf seinem Bett, und er starb
  rationale: הרג bedeutet gewöhnlich „töten“. Die ausdrückliche Angabe seines Todes und der Ort der Tötung werden beibehalten.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: Man begrub ihn in der Stadt Davids, aber nicht in den Gräbern der Könige
  rationale: Der unbestimmte Subjektwechsel wird im Deutschen natürlich mit „man“ ausgedrückt. Der Gegensatz zwischen einer Bestattung in der Stadt Davids und dem Ausschluss aus den Königsgräbern bleibt deutlich.
theological_decisions:
- issue: Masoretischer Plural „Söhne Jojadas“ gegenüber dem Kontext, der ausdrücklich Secharja, den Sohn Jojadas, nennt
  choice: Im Haupttext steht quellentreu „Söhne des Priesters Jojada“.
  alternative: „Sohn des Priesters Jojada“, konkret Secharja
  rationale: Der vorliegende hebräische Text hat eindeutig den Plural. Der unmittelbare Erzählzusammenhang in 2. Chronik 24,20–22 legt jedoch besonders Secharja nahe. Diese Spannung wird nicht stillschweigend harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Der Gedankenstrich gibt die erläuternde כִּי-Klausel natürlich wieder. Der Gottesname kommt in diesem Vers nicht vor. Die Namensform „Jojada“ folgt dem geläufigen deutschen Bibelgebrauch.
