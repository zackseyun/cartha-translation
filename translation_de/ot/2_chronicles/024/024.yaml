base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: de
  text: Denn das Heer Arams kam mit nur wenigen Männern[a]. Doch Jahwe gab ein überaus großes Heer in ihre Gewalt[b], weil sie Jahwe, den Gott ihrer Väter, verlassen hatten. Und an Joasch vollzogen sie Strafgerichte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einer geringen Zahl von Männern«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in ihre Hand«; eine hebräische Wendung für »in ihre Gewalt«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »vollzogen sie Gerichte an Joasch«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: mit nur wenigen Männern
  rationale: Die Wendung bezeichnet eine geringe Zahl und stellt sie dem überaus großen gegnerischen Heer gegenüber.
- source_word: חֵיל אֲרָם
  choice: das Heer Arams
  rationale: חֵיל bezeichnet hier eindeutig eine militärische Streitmacht; »Aram« wahrt den hebräischen Eigennamen.
- source_word: נָתַן בְּיָדָם
  choice: gab ... in ihre Gewalt
  rationale: Die hebräische Wendung »in ihre Hand geben« bedeutet, jemanden der Macht eines anderen auszuliefern. Die deutsche Fassung gibt den Sinn natürlich wieder; die Fußnote bewahrt das Bild.
- source_word: חַיִל לָרֹב מְאֹד
  choice: ein überaus großes Heer
  rationale: חַיִל bezeichnet auch hier ein Heer; לָרֹב מְאֹד hebt dessen außerordentliche Größe hervor.
- source_word: עָזְבוּ
  choice: verlassen hatten
  rationale: »Verlassen« ist im Deutschen verständlich und bewahrt in diesem Zusammenhang den ernsten Gedanken der Abkehr von Gott.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: den Gott ihrer Väter
  rationale: Die Formulierung bewahrt die genealogische und bundestheologische Sprache des Ausgangstextes.
- source_word: עָשׂוּ שְׁפָטִים
  choice: vollzogen ... Strafgerichte
  rationale: Der hebräische Plural bezeichnet richterliche, zugleich strafende Maßnahmen. »Strafgerichte vollziehen« bewahrt sowohl die gerichtliche als auch die vergeltende Dimension.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt diesen als persönlichen Namen.
- issue: Sieg der Aramäer als Gericht an Joasch
  choice: Auch an Joasch vollzogen sie Strafgerichte
  alternative: Und an Joasch vollzogen sie Gerichte
  rationale: Die Formulierung stellt die Handlungen der Aramäer als gerichtliche Strafmaßnahmen an Joasch dar, ohne über die Aussage des hebräischen Textes hinaus den genauen Vollzug zu erklären.
translation_notes:
  register: Moderne, würdige Standardsprache. Kurze Satzglieder verdeutlichen den scharfen Gegensatz zwischen der kleinen aramäischen Truppe und dem sehr großen Heer Judas. Der Gottesname erscheint in der geläufigen deutschen Form »Jahwe«; das hebräische Hand-Idiom wird im Haupttext verständlich wiedergegeben und in der Fußnote dokumentiert.
