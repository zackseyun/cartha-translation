  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: de
  text: 'Da versammelte der König von Israel die Propheten, vierhundert Mann, und fragte sie: »Sollen wir nach Ramot-Gilead zum Kampf ziehen, oder soll ich davon absehen?« Sie antworteten: »Zieh hinauf! Gott wird es in die Hand des Königs geben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand des Königs«; eine hebräische Wendung für »in die Macht des Königs«. Der hebräische Text sagt »des Königs«, nicht »in deine Hand«, und lässt den Bezug damit unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: קבץ bezeichnet das Zusammenbringen beziehungsweise Versammeln von Personen; „versammelte“ ist im Deutschen natürlich und präzise.
- source_word: הַנְּבִאִים
  choice: die Propheten
  rationale: נביאים ist die übliche Bezeichnung für Propheten; der Kontext verlangt keine Umschreibung.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: vierhundert Mann
  rationale: Das Hebräische nennt nach der Zahl ausdrücklich אִישׁ. „Vierhundert Mann“ erhält diese Formulierung in idiomatischem Deutsch.
- source_word: הֲנֵלֵךְ
  choice: Sollen wir ... ziehen
  rationale: Die Verbform steht in der ersten Person Plural und wird als beratende Frage wiedergegeben.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot in Gilead
  rationale: Der Ortsname wird in einer im Deutschen gebräuchlichen Form wiedergegeben; die Verbindung mit Gilead wird transparent ausgedrückt.
- source_word: לַמִּלְחָמָה
  choice: in den Kampf
  rationale: Die Präpositionalfügung bezeichnet hier das Ziel beziehungsweise den Zweck des Hinaufziehens; „in den Kampf ziehen“ ist natürliches modernes Deutsch.
- source_word: אִם אֶחְדָּל
  choice: oder soll ich davon absehen
  rationale: חדל bedeutet aufhören, unterlassen oder ablassen. Der Wechsel vom Plural „wir“ zum Singular „ich“ bleibt ausdrücklich erhalten.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: עלה bedeutet wörtlich „hinaufziehen“ und hat hier einen militärischen Zusammenhang. Die Wiedergabe bewahrt das Bild, ohne es vorschnell als „angreifen“ zu deuten.
- source_word: וְיִתֵּן
  choice: wird es ... geben
  rationale: Das nicht ausdrücklich genannte Objekt wird im Deutschen durch „es“ ergänzt und verweist kontextuell auf das umkämpfte Ziel beziehungsweise den Ausgang des Unternehmens.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Das singularische Verb weist hier auf einen singularischen Referenten; daher ist „Gott“ sachgemäß.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Die feste hebräische Wendung bezeichnet Übergabe in Macht oder Gewalt. Die weitgehend formale Wiedergabe ist im Deutschen verständlich und bewahrt zugleich den Wortlaut.
theological_decisions:
- issue: Bezug von „des Königs“ in der Antwort der Propheten
  choice: Die unbestimmtere hebräische Formulierung „des Königs“ wird beibehalten.
  alternative: „in deine Hand“ oder ausdrücklich „in die Hand des Königs von Israel“
  rationale: Der masoretische Text sagt nicht „in deine Hand“, sondern „in die Hand des Königs“. Die Übersetzung legt den Bezug daher nicht eindeutiger fest als die Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede ist direkt und gut verständlich; der auffällige Wechsel von „wir“ zu „ich“ sowie die nicht näher bestimmte Bezeichnung „des Königs“ bleiben erhalten.
