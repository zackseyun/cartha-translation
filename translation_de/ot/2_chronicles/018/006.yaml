source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: de
  text: 'Doch Joschafat sagte: „Gibt es hier nicht noch einen Propheten Jahwes, den wir befragen können?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; „doch“ gibt zugleich den inhaltlichen Gegensatz zum vorherigen Prophetenkonsens natürlich wieder.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: הַאֵין
  choice: Gibt es … nicht
  rationale: Die Verbindung aus Fragepartikel und Verneinung bildet eine rhetorische beziehungsweise bestätigungssuchende Frage.
- source_word: פֹּה
  choice: hier
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
- source_word: נָבִיא לַיהוָה
  choice: einen Propheten Jahwes
  rationale: Der Singular bleibt erhalten; das ל bezeichnet hier die Zugehörigkeit beziehungsweise Beziehung zu Jahwe.
- source_word: עוֹד
  choice: noch
  rationale: „Noch“ bewahrt die Mehrdeutigkeit zwischen fortdauernder Verfügbarkeit und einem zusätzlichen Propheten.
- source_word: וְנִדְרְשָׁה מֵאֹתוֹ
  choice: durch den wir ihn befragen können
  rationale: Die Kohortativform bezeichnet den vorgeschlagenen gemeinsamen Vollzug. Im Kontext wird Jahwe mittels des Propheten befragt; die deutsche Formulierung macht diese vermittelnde Funktion natürlich deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezugswort des Befragens
  choice: Jahwe durch den Propheten befragen
  alternative: den Propheten befragen
  rationale: דרשׁ bezeichnet in diesem Zusammenhang die Befragung Gottes; מֵאֹתוֹ kann grammatisch auf den Propheten als vermittelnde Instanz bezogen werden. Die Formulierung erhält beide Rollen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und alltagstauglich, ohne den rhetorischen Charakter der Frage oder die vermittelnde Rolle des Propheten einzuebnen.
