    issue: Der Bezug von „ihn“ in „durch den wir ihn befragen können“ ist nicht quellentextnah eindeutig.
    rationale: מֵאֹתוֹ bedeutet hier „von ihm“ bzw. idiomatisch „ihn befragen“ und verweist auf den genannten Propheten. Die Ergänzung, dass Jahwe befragt werde, ist eine plausible Kontextdeutung, sollte aber nicht in den Haupttext eingebracht werden, wenn die direkte Formulierung dies nicht verlangt.
