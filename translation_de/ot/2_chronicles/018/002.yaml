id: 2CH.18.2
reference: 2 Chronicles 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּרֶד֩ לְ/קֵ֨ץ שָׁנִ֤ים אֶל אַחְאָב֙ לְ/שֹׁ֣מְר֔וֹן וַ/יִּֽזְבַּֽח ל֨/וֹ אַחְאָ֜ב צֹ֤אן וּ/בָקָר֙ לָ/רֹ֔ב וְ/לָ/עָ֖ם אֲשֶׁ֣ר עִמּ֑/וֹ וַ/יְסִיתֵ֕/הוּ לַ/עֲל֖וֹת אֶל רָמ֥וֹת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: de
  text: Nach einigen Jahren zog er zu Ahab nach Samaria hinab. Ahab schlachtete für ihn und für das Volk, das bei ihm war, Schafe und Rinder in großer Menge. Dann drängte er ihn[a], gegen Ramot-Gilead hinaufzuziehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verleitete ihn“ beziehungsweise „stachelte ihn an“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach Ramot-Gilead hinaufzuziehen“; im Zusammenhang ist ein militärischer Zug gegen die Stadt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: zog … hinab
  rationale: Bewahrt die Richtungsangabe des hebräischen Verbs, ohne im Deutschen steif zu klingen.
- source_word: לְקֵץ שָׁנִים
  choice: Nach einigen Jahren
  rationale: Gibt die hebräische Zeitangabe idiomatisch wieder, ohne eine bestimmte Anzahl von Jahren festzulegen.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: zu Ahab nach Samaria
  rationale: Macht sowohl die besuchte Person als auch das Reiseziel klar.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Ahab schlachtete für ihn
  rationale: זבח kann opfern oder schlachten bedeuten; hier steht die königliche Bewirtung im Vordergrund, nicht ausdrücklich eine kultische Opferhandlung.
- source_word: צֹאן וּבָקָר
  choice: Schafe und Rinder
  rationale: Konkrete und allgemein verständliche Wiedergabe der beiden Viehgruppen.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Gibt den Gedanken einer außerordentlich großen Menge natürlich wieder.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: für das Volk, das bei ihm war
  rationale: Bewahrt das breite עָם, statt die Gruppe unbegründet auf Soldaten oder Bedienstete einzuengen.
- source_word: וַיְסִיתֵהוּ
  choice: drängte er ihn
  rationale: Vermittelt nachdrückliches Einwirken, ohne die im Verb mögliche negative Nuance zwingend festzuschreiben; stärkere Möglichkeiten werden in der Fußnote genannt.
- source_word: לַעֲלוֹת
  choice: hinaufzuziehen
  rationale: Bewahrt das räumliche Bild von עלה und passt zugleich zum militärischen Zusammenhang.
- source_word: אֶל רָמוֹת גִּלְעָד
  choice: gegen Ramot-Gilead
  rationale: Das wörtliche „nach/zu Ramot-Gilead“ bezeichnet im Zusammenhang einen militärischen Zug gegen die Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert. „Volk“ hält die Referenzgruppe bewusst offen; „drängte“ wahrt die mögliche Spannung zwischen nachdrücklichem Zureden und negativem Anstiften.
