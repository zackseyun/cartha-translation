  source_fidelity: 'Die Hauptübersetzung gibt den durch Syntax und unmittelbaren Kontext am besten begründeten Sprecherbezug wieder: Der König von Israel kündigt an, sich selbst zu verkleiden, während Joschafat sichtbar gekleidet bleiben soll. הִתְחַפֵּשׂ und וָבֹא sind formal knapp und können isoliert anders analysiert werden; die Fußnote weist diese Möglichkeit angemessen aus. Der anschließende Erzählsatz bestätigt die kontextuelle erste Person. „In die Schlacht ziehen“ gibt בוא במלחמה idiomatisch und sachgerecht wieder; der Plural „sie zogen“ bezieht sich korrekt auf beide Könige.'
