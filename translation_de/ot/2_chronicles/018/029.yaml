base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: de
  text: 'Da sagte der König von Israel zu Joschafat: „Ich werde mich verkleiden und in die Schlacht ziehen[a]; du aber zieh deine Gewänder an.“ Der König von Israel verkleidete sich, und sie zogen in die Schlacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und in der Form mehrdeutig: „Sich verkleiden und in die Schlacht ziehen.“ Die knappe hebräische Form kann auch wie eine Aufforderung verstanden werden: „Verkleide dich und geh in die Schlacht.“ Der folgende Satz zeigt jedoch, dass sich der König von Israel selbst verkleidete.'
    reason: Die hebräischen Verbformen sind formal knapp beziehungsweise mehrdeutig; die Fußnote bewahrt diese Ambiguität, ohne den durch den Zusammenhang nahegelegten Sinn im Haupttext unklar zu lassen.
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבוֹא
  choice: Ich werde mich verkleiden und in die Schlacht ziehen
  rationale: Die beiden knappen Verbformen können formal als aneinandergereihte Infinitive absoluta verstanden werden. Im Zusammenhang kündigt der König von Israel damit sein eigenes Vorgehen an, wie der folgende Erzählsatz ausdrücklich bestätigt. Die deutsche Fassung macht diesen kontextuellen Sinn verständlich, während die Fußnote die formale Mehrdeutigkeit bewahrt.
- source_word: וְאַתָּה
  choice: du aber
  rationale: 'Das ausdrücklich gesetzte Pronomen markiert einen Gegensatz: Der König von Israel verkleidet sich, Joschafat soll dagegen seine eigenen Gewänder anziehen.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: zieh deine Gewänder an
  rationale: Dies gibt den allgemeinen Ausdruck für Kleidung ohne die nicht ausdrücklich im Hebräischen enthaltene Präzisierung „königliche Gewänder“ wieder. Der Zusammenhang lässt erkennen, dass Joschafats erkennbare Kleidung gemeint ist.
- source_word: בַמִּלְחָמָה
  choice: in die Schlacht
  rationale: In Verbindung mit בוא gibt die deutsche Richtungsangabe das Hineinziehen in das Kampfgeschehen natürlich wieder.
- source_word: וַיָּבֹאוּ
  choice: sie zogen
  rationale: Der Plural bezieht sich auf beide Könige. „Zogen in die Schlacht“ ist im Deutschen eine natürliche und dem militärischen Zusammenhang angemessene Wiedergabe.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Sprecherbezug der knappen Formen הִתְחַפֵּשׂ וָבוֹא
  choice: Als Ankündigung des Königs von Israel in der ersten Person wiedergegeben
  alternative: „Verkleide dich und geh in die Schlacht“ als Aufforderung an Joschafat
  rationale: Die Formen sind formal knapp und lassen isoliert auch eine imperative Auffassung zu. Doch der Gegensatz „du aber zieh deine Gewänder an“ und der anschließende Bericht, dass sich der König von Israel verkleidete, sprechen deutlich dafür, dass er sein eigenes Vorhaben ankündigt. Die abweichende formale Möglichkeit wird nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; unnötig altertümliche Wendungen und eine über den hebräischen Wortlaut hinausgehende Kennzeichnung der Gewänder als königlich wurden vermieden.
