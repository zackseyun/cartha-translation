  terminology: „König von Israel“, „Joschafat“, „sich verkleiden“ und „Gewänder“ sind konsistent und sachlich. Die deutsche Namensform Joschafat ist gebräuchlich. Der englische Audit-Haupttext mit der Aufforderung „Disguise yourself“ folgt dem Zusammenhang weniger gut; die deutsche Fassung muss dieser auditbedingten Fehlentscheidung nicht folgen.
