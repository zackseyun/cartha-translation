source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: de
  text: 'Da sagte der König von Israel zu Joschafat: „Habe ich dir nicht gesagt, dass er über mich nichts Gutes prophezeien wird, sondern nur Unheil?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung fort; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Direkte und im Deutschen übliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֶל יְהוֹשָׁפָט
  choice: zu Joschafat
  rationale: Die Präposition bezeichnet den Adressaten der Rede; der hebräische Text nennt Joschafat hier ohne Titel.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: Habe ich dir nicht gesagt
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; die deutsche Perfektform ist in direkter Rede natürlich.
- source_word: לֹא יִתְנַבֵּא
  choice: dass er … nichts … prophezeien wird
  rationale: Der Imperfekt bezeichnet aus Sicht der früheren Äußerung erwartetes bzw. typisches zukünftiges Verhalten; der deutsche dass-Satz gibt die indirekt zitierte Aussage idiomatisch wieder.
- source_word: עָלַי
  choice: über mich
  rationale: עַל bezeichnet hier den Gegenstand der Prophetie; „über mich“ ist im Deutschen klar und vermeidet die mögliche Nutzenbedeutung von „für mich“.
- source_word: טוֹב
  choice: etwas Gutes
  rationale: Das substantivisch gebrauchte Adjektiv wird im Deutschen natürlich als „etwas Gutes“ wiedergegeben.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die Verbindung drückt nach der Verneinung eine ausschließende Gegenüberstellung aus.
- source_word: לְרָע
  choice: Unheil
  rationale: Im Kontext geht es um eine ungünstige, verhängnisvolle Weissagung, nicht um moralische Bosheit; „Unheil“ bewahrt den starken Gegensatz, ohne die Aussage metaphysisch aufzuladen.
theological_decisions:
- issue: Art der angekündigten Botschaft
  choice: „etwas Gutes … sondern nur Unheil“
  alternative: „Gutes … sondern nur Böses“
  rationale: Ahabs Klage betrifft Michas stets negative Vorhersagen über ihn. „Unheil“ gibt die kontextuelle Bedeutung von רָע präzise wieder, während „Böses“ im heutigen Deutsch leicht moralisches Fehlverhalten nahelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe der Klage bleibt erhalten; zugleich wird der Gegensatz idiomatisch und ohne konfessionelle Zusatzdeutung formuliert.
