source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: de
  text: 'Da sagte der König von Israel zu Joschafat: »Es gibt noch einen Mann, durch den wir Jahwe befragen können.[a] Aber ich hasse ihn, denn er weissagt über mich nie Gutes, sondern sein Leben lang nur Unheil. Es ist Micha, der Sohn Jimlas.« Joschafat erwiderte: »So soll der König nicht reden!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei dem wir Jahwe befragen können«.'
    reason: Die Präposition in מֵאֹתוֹ kann im Deutschen sowohl vermittelnd (»durch ihn«) als auch als Bezeichnung der konsultierten Person (»bei ihm«) wiedergegeben werden.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: Es gibt noch einen Mann
  rationale: עֹוד bezeichnet hier eine noch verbleibende Möglichkeit. Die Formulierung ist im modernen Deutschen natürlich und bewahrt zugleich die Betonung, dass nur noch ein weiterer Mann zur Verfügung steht.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: durch den wir Jahwe befragen können
  rationale: דרשׁ mit Jahwe als Objekt bedeutet in diesem prophetischen Zusammenhang »Jahwe befragen«. מֵאֹתוֹ kennzeichnet den Propheten als Vermittler; »durch den« gibt dies knapp und verständlich wieder.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: Aber ich hasse ihn
  rationale: Das Perfekt beschreibt hier eine bestehende, gefestigte Haltung. Das adversative »aber« entspricht dem Gegensatz im Redefluss, ohne die Aussage abzuschwächen.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: denn er weissagt über mich nie Gutes
  rationale: Die negierte Partizipialform beschreibt ein für den Propheten charakteristisches Verhalten. »nie« bringt diesen wiederholten beziehungsweise gewohnheitsmäßigen Sinn idiomatisch zum Ausdruck; »über mich« wahrt den Bezug von עָלַי.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: sondern sein Leben lang nur Unheil
  rationale: Wörtlich heißt die Wendung »sondern alle seine Tage zum Unheil«. »sein Leben lang« bewahrt den zeitlichen Nachdruck von כָל־יָמָיו. »Unheil« bezeichnet hier eine ungünstige prophetische Botschaft und vermeidet die mögliche moralische Fehlbedeutung von »Böses«.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Micha, der Sohn Jimlas
  rationale: Die Namen werden in ihren geläufigen deutschen biblischen Formen wiedergegeben. Die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: So soll der König nicht reden!
  rationale: אַל mit dem Imperfekt ist eine verneinte Aufforderung. Die Rede in der dritten Person bewahrt Joschafats respektvolle, indirekte Zurechtweisung des Königs und klingt zugleich in heutigem Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Bedeutung von לְרָעָה in Ahabs Vorwurf
  choice: Unheil
  alternative: Böses
  rationale: Im Zusammenhang beklagt Ahab ungünstige Weissagungen über sein Geschick. »Unheil« hält diesen Bezug fest, ohne dem Propheten selbst moralisch böses Reden zuzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, gut verständlicher Rede. Joschafats höfliche Anrede in der dritten Person wurde bewahrt. Der zeitliche Nachdruck »sein Leben lang« folgt der gegenüber 1. Könige 22,8 charakteristischen Formulierung des Chroniktextes.
