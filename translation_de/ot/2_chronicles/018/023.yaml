base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: de
  text: 'Da trat Zedekia, der Sohn Kenaanas, heran, schlug Michaja auf die Wange und sagte: »Auf welchem Weg ist der Geist Jahwes von mir fortgegangen, um zu dir zu reden?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat … heran
  rationale: נגשׁ bezeichnet das Herantreten; die Wendung ist im Deutschen natürlich und bewahrt die körperliche Annäherung vor dem Schlag.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia, der Sohn Kenaanas
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; der Genitiv bewahrt die Abstammungsangabe idiomatisch.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: schlug Michaja auf die Wange
  rationale: נכה ist ein allgemeines Verb für schlagen; לֶחִי kann Wange oder Kiefer bezeichnen. »Wange« passt zum wahrscheinlichen Gestus öffentlicher Demütigung, ohne die Art des Schlags enger festzulegen.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Auf welchem Weg
  rationale: Die Formulierung bewahrt das räumliche Bild und leitet im Deutschen die spöttische Frage idiomatisch ein.
- source_word: עָבַר
  choice: ist … fortgegangen
  rationale: עבר bezeichnet das Hinüber- oder Vorübergehen. »fortgegangen« macht die von Zedekia unterstellte Bewegung des Geistes von ihm zu Michaja verständlich, ohne das Bild aufzulösen.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: Im prophetischen Zusammenhang ist Gottes Geist gemeint. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: מֵאִתִּי
  choice: von mir
  rationale: Die Präposition bezeichnet hier den Ausgangspunkt der sarkastisch behaupteten Bewegung.
- source_word: לְדַבֵּר אֹתָךְ
  choice: um mit dir zu reden
  rationale: דבר mit אֵת kann »mit jemandem reden« bedeuten. Diese Wiedergabe bildet die ungewöhnliche Konstruktion gut ab; sachlich möglich ist auch »zu dir reden«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den Eigennamen und folgt der vorgegebenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Referenz von רוּחַ יהוה
  choice: der Geist Jahwes
  alternative: der Wind Jahwes / der Geist des HERRN
  rationale: Der unmittelbare Kontext handelt vom göttlichen Wirken in prophetischer Rede; daher ist »Geist« sachlich geboten. Die Aussage bleibt als Zedekias spöttische Behauptung stehen und wird nicht theologisch bestätigt oder korrigiert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge bleibt nahe am hebräischen Erzählstil, während »trat … heran« und »fortgegangen« natürliches Deutsch ergeben. Die spöttische räumliche Metapher der Frage wird bewahrt.
