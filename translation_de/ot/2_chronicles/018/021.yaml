  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: de
  text: 'Und er sagte: »Ich will hinausgehen und zu einem Lügengeist[a] im Mund all seiner Propheten werden.« Da sagte er: »Du wirst ihn verleiten[b], und es wird dir auch gelingen. Geh hinaus und tu es!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geist der Falschheit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Du wirst ihn täuschen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Ich will hinausgehen
  rationale: Die Form bezeichnet hier die beabsichtigte Handlung des Sprechers. »Hinausgehen« bewahrt die Bewegungsrichtung und ist zugleich natürliches modernes Deutsch.
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  choice: und zu einem Lügengeist werden
  rationale: Die Verbindung von היה mit לְ kann den Eintritt in eine Rolle oder einen Zustand ausdrücken. »Werden« gibt diesen Übergang idiomatisch wieder; »Lügengeist« bezeichnet einen Geist, der durch Falschheit beziehungsweise Lüge gekennzeichnet ist.
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: im Mund all seiner Propheten
  rationale: Die konkrete hebräische Bildsprache wird beibehalten. Gemeint ist, dass die irreführende Rede durch die Propheten ausgesprochen wird; das Possessivpronomen verweist im Zusammenhang auf Ahab.
- source_word: תְּפַתֶּה
  choice: Du wirst ihn verleiten
  rationale: Das Piel von פתה kann ein verlockendes, überredendes oder täuschendes Einwirken bezeichnen. »Verleiten« wahrt diese Bedeutungsbreite, während das im Hebräischen unausgesprochene Objekt aus dem Kontext ergänzt wird.
- source_word: וְגַם תּוּכָל
  choice: und es wird dir auch gelingen
  rationale: יכל bezeichnet hier nicht nur Fähigkeit, sondern den erfolgreichen Ausgang des Vorhabens. Die unpersönliche deutsche Wendung gibt diesen Sinn natürlich wieder und berücksichtigt auch וגם.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: Geh hinaus und tu es!
  rationale: Der Imperativ »Geh hinaus« nimmt das zuvor verwendete Verb erneut auf. »Tu es« gibt עשה כן knapp und idiomatisch wieder.
theological_decisions:
- issue: Göttliche Erlaubnis beziehungsweise Beauftragung einer täuschenden Sendung innerhalb der Vision
  choice: Die zustimmende Aufforderung an den Geist wird ohne Abschwächung wiedergegeben.
  alternative: Die Aussage durch weniger direkte Formulierungen von göttlicher Beteiligung an Täuschung distanzieren.
  rationale: Der hebräische Text schildert unverhüllt den Plan des Geistes und die bestätigende Antwort. Die Übersetzung bewahrt diese theologische Spannung, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Bildsprache »im Mund« bleibt erhalten; »verleiten« und die Fußnote bewahren die Bedeutungsbreite von פתה.
