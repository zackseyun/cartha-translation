base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: de
  text: 'Und Ahab, der König von Israel, sagte zu Joschafat, dem König von Juda: „Ziehst du mit mir nach Ramot-Gilead?“ Er antwortete ihm: „Ich bin wie du, und mein Volk ist wie dein Volk[a]; ich bin mit dir im Kampf[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und wie dein Volk mein Volk“. Gemeint sein kann auch: „Dein Volk ist mein Volk.“'
    reason: Die verblos-elliptische Vergleichsformel lässt sich im Deutschen entweder vergleichend oder als idiomatische Solidaritätserklärung wiedergeben.
  - marker: b
    text: 'Wörtlich: „und mit dir im Kampf“. Im Hebräischen fehlen Subjekt und Verb.'
    reason: Die knappe hebräische Schlussphrase ist elliptisch; die Übersetzung ergänzt ihren im Zusammenhang naheliegenden Sinn.
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Ziehst du mit mir
  rationale: Die Fragepartikel הֲ und הלך mit עִם bilden eine direkte Bitte um Begleitung. „Ziehst du mit mir“ ist im militärischen Zusammenhang natürlich und bewahrt das Bewegungsverb.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, quellennahen Form transliteriert und durch den Bindestrich als zusammengehöriges Toponym kenntlich gemacht.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Ich bin wie du
  rationale: Die knappe Vergleichsformel drückt Gleichstellung und Solidarität aus. Die deutsche Formulierung erhält den Vergleich, ohne ihn zu einer vollständigen Identitätsaussage zu verstärken.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: und mein Volk ist wie dein Volk
  rationale: Die verblos-elliptische hebräische Parallelkonstruktion wird im Deutschen durch „ist“ vervollständigt; Vergleich und Wortfolge bleiben erkennbar.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: wir stehen an deiner Seite im Kampf
  rationale: 'Die hebräische Schlussphrase ist elliptisch: wörtlich „und mit dir im Kampf“. Aus dem Parallelismus ist das eigene Volk als mit eingeschlossen naheliegend; die gewählte Form gibt die zugesagte Unterstützung idiomatisch wieder, während die Fußnote die Ellipse offenlegt.'
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: sagte ... antwortete
  rationale: Beim ersten Vorkommen bleibt das gewöhnliche Redeverb erhalten; beim zweiten macht „antwortete“ die Gesprächsfunktion im Deutschen klar, ohne den Inhalt zu erweitern.
