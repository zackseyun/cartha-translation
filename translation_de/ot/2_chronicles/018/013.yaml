id: 2CH.18.13
reference: 2 Chronicles 18:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: de
  text: 'Doch Michaja sagte: »So wahr Jahwe lebt[a]: Was mein Gott sagt, das werde ich verkünden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe lebt! Was mein Gott sagt, das werde ich verkünden.«'
    reason: Die hebräische Wortfolge kann formal als Aussage »Jahwe lebt« mit anschließendem Inhalt verstanden werden; im Zusammenhang liegt jedoch die übliche Schwurformel »So wahr Jahwe lebt« nahe.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative וַ leitet Michajas kontrastierende Antwort auf die Aufforderung des Boten in Vers 12 ein. »Doch« gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Die im Deutschen gebräuchliche biblische Namensform gibt den hebräischen Personennamen angemessen wieder.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Die feste hebräische Schwurformel wird durch die entsprechende natürliche deutsche Schwurformel wiedergegeben; der Gottesname bleibt als »Jahwe« erhalten.
- source_word: אֵת אֲשֶׁר יֹאמַר אֱלֹהַי
  choice: Was mein Gott sagt
  rationale: Die Verbindung aus Objektmarker und Relativpartikel bezeichnet umfassend den Inhalt der göttlichen Rede. Das Präsens ist in diesem offenen Relativsatz idiomatisch und bewahrt, dass Michaja nur Gottes Botschaft weitergeben will.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: das werde ich verkünden
  rationale: »Das« nimmt den zuvor genannten Inhalt wieder auf. »Verkünden« gibt דּבר im Zusammenhang prophetischer Rede natürlich und würdig wieder, ohne den Sinn übermäßig auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Schwurformel
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den göttlichen Eigennamen. »Jahwe« bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verbindlichkeit von Michajas prophetischer Rede
  choice: Was mein Gott sagt, das werde ich verkünden
  alternative: Was mein Gott sagen wird, werde ich sagen
  rationale: Die Formulierung erhält Michajas feierliche Bindung an Gottes Rede, ohne den Zeitpunkt oder die Art der Offenbarung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und feierlich; »Doch« macht den Gegensatz zum Druck des Boten deutlich, und »verkünden« entspricht dem prophetischen Kontext.
