source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: de
  text: 'Als die Befehlshaber der Streitwagen Joschafat sahen, sagten sie: »Das ist der König von Israel!«[a] Da wandten sie sich gegen ihn, um mit ihm zu kämpfen. Doch Joschafat schrie laut auf, und Jahwe half ihm; Gott lenkte sie von ihm ab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Er ist der König von Israel!«'
    reason: Der hebräische Nominalsatz kann im Deutschen sowohl mit »Das ist …« als auch mit »Er ist …« wiedergegeben werden.
  - marker: b
    text: 'Auch möglich: »Gott brachte sie von ihm ab.« Das hebräische Verb kann hier bedeuten, jemanden von einem Ziel wegzulenken oder wegzubewegen.'
    reason: Die Bedeutung des seltenen Verbs lässt mehrere eng verwandte deutsche Wiedergaben zu.
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … sahen
  rationale: Die hebräische Erzählungsformel leitet das Geschehen ein. Im modernen Deutschen gibt die zeitliche Konstruktion mit »als« den Zusammenhang natürlich wieder, ohne die schwerfällige Wendung »Und es geschah, als«.
- source_word: שָׂרֵי הָרֶכֶב
  choice: die Befehlshaber der Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Führer oder ranghohe Verantwortliche; הָרֶכֶב bestimmt sie als Befehlshaber der Streitwagentruppe.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Das ist der König von Israel
  rationale: Der Nominalsatz identifiziert Joschafat irrtümlich als den gesuchten König. »Das ist …« ist in dieser Situation natürliches Deutsch; »Er ist …« bleibt ebenfalls möglich.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: Da wandten sie sich gegen ihn
  rationale: סבב kann ein Sich-Wenden oder Umringen bezeichnen. Hier richtet die Streitwagentruppe ihre feindliche Bewegung gegen Joschafat, ohne dass der Text zwingend eine vollständige Einkreisung behauptet.
- source_word: לְהִלָּחֵם
  choice: um mit ihm zu kämpfen
  rationale: Der Infinitiv bezeichnet den Zweck ihrer Bewegung. Das ergänzte »mit ihm« macht im Deutschen den Bezug auf Joschafat deutlich, ohne über den Sinn des hebräischen Verbs hinauszugehen.
- source_word: וַיִּזְעַק
  choice: schrie laut auf
  rationale: זעק bezeichnet einen eindringlichen Schrei, oft aus Not. Die Wiedergabe bewahrt die Intensität, nennt aber keinen im Satz nicht ausdrücklich angegebenen Adressaten.
- source_word: וַיהוָה עֲזָרוֹ
  choice: und Jahwe half ihm
  rationale: עזר bedeutet unmittelbar »helfen«. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Gott lenkte sie von ihm ab
  rationale: Die Hifil-Form von סות bezeichnet hier, dass Gott die Angreifer von Joschafat weg- beziehungsweise ablenkte. Die Formulierung erhält Gottes ausdrückliche Urheberschaft und vermeidet die moralische Nebenbedeutung von »verführen«.
theological_decisions:
- issue: Wiedergabe von יהוה und אֱלֹהִים im selben Vers
  choice: Jahwe … Gott
  alternative: der HERR … Gott
  rationale: Der hebräische Text verwendet zunächst den persönlichen Gottesnamen יהוה und danach die Bezeichnung אֱלֹהִים. Die Übersetzung bildet diesen bewussten Wechsel mit »Jahwe … Gott« ab.
- issue: Ob Joschafats Schrei ausdrücklich als Gebet oder Hilferuf zu Gott bezeichnet werden soll
  choice: Joschafat schrie laut auf
  alternative: Joschafat schrie zu Jahwe / um Hilfe
  rationale: Der unmittelbare hebräische Satz nennt weder einen Adressaten noch den Inhalt des Schreis. Dass Jahwe anschließend hilft, legt einen Hilferuf nahe, macht ihn sprachlich aber nicht ausdrücklich zu einem Gebet.
- issue: Art des göttlichen Eingreifens in וַיְסִיתֵם
  choice: Gott lenkte sie von ihm ab
  alternative: Gott trieb sie von ihm weg
  rationale: Die gewählte Fassung wahrt die göttliche Initiative, legt jedoch nicht genauer als der hebräische Text fest, auf welche Weise die Befehlshaber von Joschafat abgebracht wurden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die einleitende hebräische Erzählungsformel wurde idiomatisch gestrafft. Militärische Begriffe bleiben konkret; Joschafats Schrei und die Art des göttlichen Eingreifens werden nicht über den Wortlaut hinaus präzisiert.
