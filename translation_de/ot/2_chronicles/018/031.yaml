  terminology: Die Namensform »Joschafat« ist im Deutschen etabliert. »Jahwe« gibt den Tetragrammaton wieder; »Gott« entspricht anschließend אֱלֹהִים. Die Fußnoten sind korrekt verankert und erläutern tatsächliche, eng begrenzte Übersetzungsalternativen.
