base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: de
  text: 'Da machte sich Zedekia, der Sohn Kenaanas, eiserne Hörner und sagte: »So spricht Jahwe: Mit diesen wirst du Aram niederstoßen[a], bis du sie vernichtet hast.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegstoßen« beziehungsweise »mit den Hörnern stoßen«; das hebräische Verb bezeichnet den Stoß eines gehörnten Tieres.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Suffix in »sie« ist Plural. Es kann sich auf die Aramäer beziehungsweise die aramäischen Streitkräfte beziehen; Aram bezeichnet je nach Zusammenhang das Reich oder dessen Volk.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Da machte sich
  rationale: 'Das לֹו kann hier idiomatisch reflexiv verstanden werden: Zedekia fertigt die Hörner für den eigenen prophetischen Zeichenakt an.'
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia, der Sohn Kenaanas
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die hebräische Patronymform bleibt erhalten.
- source_word: קַרְנֵי בַרְזֶל
  choice: eiserne Hörner
  rationale: Die natürliche deutsche Form bewahrt das konkrete Bild der aus Eisen gefertigten Hörner.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die traditionelle deutsche Botenformel gibt die hebräische Prophetenformel knapp und würdig wieder; der Gottesname wird als Jahwe wiedergegeben.
- source_word: בְּאֵלֶּה
  choice: Mit diesen
  rationale: Die Präposition bezeichnet die Hörner als Mittel des folgenden Stoßens.
- source_word: תְּנַגַּח
  choice: niederstoßen
  rationale: נגח bezeichnet das Stoßen mit Hörnern. „Niederstoßen“ erhält dieses Bild im Deutschen und passt zugleich zur angekündigten militärischen Überwältigung.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Die historische Bezeichnung des Landes beziehungsweise Volkes wird beibehalten, statt sie mit dem späteren Namen Syrien zu ersetzen.
- source_word: עַד כַּלּוֹתָם
  choice: bis du es vernichtet hast
  rationale: כלה bezeichnet hier die vollständige Beseitigung. Das maskuline Pluralsuffix kann sich sinngemäß auf die Aramäer beziehen; im Haupttext wird Aram als Kollektiv beziehungsweise Reich mit singularischem Pronomen aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Status der Prophetenrede
  choice: Die Aussage wird ohne bestätigenden Zusatz als Zitat wiedergegeben
  alternative: Kennzeichnung als falsche Prophezeiung im Vers selbst
  rationale: Der Vers berichtet Zedekias Anspruch mit der Botenformel, bestätigt jedoch an dieser Stelle nicht dessen Wahrheit. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdiger prophetischer Rede. „So spricht Jahwe“ bewahrt die feierliche Botenformel; Satzbau und Wortwahl bleiben zugleich natürlich.
