base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: de
  text: 'Da kam er zum König, und der König fragte ihn: »Micha, sollen wir nach Ramot-Gilead zum Kampf ziehen, oder soll ich davon absehen?« Er antwortete: »Zieht hinauf und habt Erfolg! Sie werden euch in die Hand gegeben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Michas Antwort ist angesichts des Zusammenhangs wahrscheinlich ironisch oder sarkastisch gemeint; der hebräische Wortlaut kennzeichnet die Ironie jedoch nicht ausdrücklich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam er
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung fort; »Da kam er« gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: מִיכָה
  choice: Micha
  rationale: Die im Deutschen übliche Namensform für den Propheten Micha, den Sohn Jimlas; der Zusammenhang unterscheidet ihn vom gleichnamigen Schriftpropheten.
- source_word: הֲנֵלֵךְ
  choice: sollen wir … ziehen
  rationale: Die Frageform der ersten Person Plural drückt eine erwogene Handlung aus; »sollen wir« ist dafür idiomatisches modernes Deutsch.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot in Gilead
  rationale: Die Ortsbezeichnung wird verständlich und in einer im deutschen Bibelgebrauch geläufigen Form wiedergegeben.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präposition ל bezeichnet hier den Zweck des Hinaufziehens; »zum Kampf« bewahrt den militärischen Sinn knapp und natürlich.
- source_word: אִם אֶחְדָּל
  choice: oder soll ich davon absehen
  rationale: חדל bedeutet aufhören, unterlassen oder Abstand nehmen. Der Wechsel vom Plural zur ersten Person Singular wird entsprechend dem Hebräischen bewahrt.
- source_word: עֲלוּ
  choice: Zieht hinauf
  rationale: עלה bezeichnet wörtlich das Hinaufziehen und wird häufig für den militärischen Zug zu einem Ort verwendet.
- source_word: וְהַצְלִיחוּ
  choice: und habt Erfolg
  rationale: Der Hifil von צלח bezeichnet hier das erfolgreiche Gelingen des Feldzugs. Die Wendung ist modern, würdig und gibt den militärischen Zusammenhang klar wieder.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: Sie werden in eure Hand gegeben werden
  rationale: Die passive Pluralform wird nicht zu einem singularischen Objekt geglättet. Das Bild »in eure Hand gegeben« bewahrt die hebräische Redeweise für die Übergabe in fremde Gewalt.
theological_decisions:
- issue: Ob Michas Antwort im Haupttext ausdrücklich als ironisch oder sarkastisch gekennzeichnet werden soll
  choice: Die oberflächlich positive Aussage bleibt ohne ausdrückliches Ironiesignal stehen; eine Fußnote erläutert den Kontext.
  alternative: Durch ein Adverb, Anführungszeichen oder eine freiere Formulierung die Ironie ausdrücklich markieren.
  rationale: Der weitere Erzählzusammenhang legt Ironie beziehungsweise Sarkasmus nahe, doch der hebräische Wortlaut kennzeichnet sie nicht ausdrücklich. So bleiben Mehrdeutigkeit und erzählerische Spannung erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der auffällige Wechsel von »wir« zu »ich« sowie der passive Plural im letzten Satz bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach der gesamten Antwort, auf die sich die Anmerkung bezieht.
