  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קְחוּ֙ אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֻ֖/הוּ אֶל אָמ֣וֹן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: de
  text: 'Da sagte der König von Israel: „Nehmt Michaja und führt ihn zurück zu Amon, dem Obersten der Stadt[a], und zu Joasch, dem Sohn des Königs[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dem Befehlshaber der Stadt“. Der hebräische Amtstitel kann einen zivilen oder militärischen Amtsträger bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „dem Königssohn“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Bezeichnung wird entsprechend dem Hebräischen als Titel wiedergegeben; der im Kontext gemeinte Ahab wird nicht ausdrücklich eingesetzt.
- source_word: קְחוּ
  choice: Nehmt
  rationale: Der Pluralimperativ von לקח bedeutet hier schlicht „nehmen“; „ergreift“ wäre unnötig schärfer.
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: וַהֲשִׁיבֻהוּ
  choice: und führt ihn zurück
  rationale: Der Hifil von שוב bezeichnet das Veranlassen einer Rückkehr. „Führt ihn zurück“ ist idiomatisches Deutsch und bewahrt die Rückkehrbedeutung.
- source_word: אָמ֣וֹן
  choice: Amon
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: שַׂר הָעִיר
  choice: dem Obersten der Stadt
  rationale: שַׂר bezeichnet einen leitenden Amtsträger und kann eine zivile oder militärische Funktion meinen. „Oberster der Stadt“ bewahrt diese Offenheit besser als das eindeutig zivile „Statthalter“.
- source_word: וְאֶל יוֹאָשׁ
  choice: und zu Joasch
  rationale: Die wiederholte Präposition אֶל wird wiedergegeben und kennzeichnet Joasch als zweiten Adressaten der Überstellung.
- source_word: בֶּן הַמֶּלֶךְ
  choice: dem Sohn des Königs
  rationale: Die relationale Formulierung des Hebräischen wird unmittelbar und natürlich wiedergegeben, ohne sie zum Titel „Prinz“ umzudeuten.
