base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: de
  text: 'Doch ein Mann spannte den Bogen aufs Geratewohl[a] und traf den König von Israel zwischen den Rüstungsteilen und dem Panzer[b]. Da sagte der König zum Wagenlenker: »Wende deine Hand[c] und bring mich aus dem Heerlager heraus[d], denn ich bin verwundet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne zu zielen“; wörtlich möglicherweise auch: „in seiner Arglosigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bezeichnung der Rüstungsteile ist unsicher. Gemeint ist offenbar eine Lücke zwischen Teilen der Rüstung und dem Körperpanzer.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „Wende deine Hand.“ Gemeint ist wohl, dass der Wagenlenker wenden oder den Wagen aus dem Kampfbereich herausmanövrieren soll.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „aus dem Lager“. Das Wort kann auch „Heerlager“ oder „Heer“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Doch ein Mann
  rationale: Das וְ führt das nächste, überraschend gegenläufige Ereignis der Erzählung ein; אִישׁ bezeichnet einen nicht näher bestimmten Mann.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: spannte den Bogen
  rationale: Die hebräische Wendung bezeichnet das Spannen beziehungsweise Abschießen eines Bogens; „den Bogen spannen“ ist im Deutschen idiomatisch und bleibt nah am Bild des Ausgangstextes.
- source_word: לְתֻמּוֹ
  choice: aufs Geratewohl
  rationale: Im Kampfzusammenhang ist am ehesten gemeint, dass der Schütze kein bestimmtes Ziel anvisierte. Die mögliche Grundbedeutung von Schlichtheit oder Arglosigkeit bleibt in der Fußnote sichtbar.
- source_word: וַיַּךְ
  choice: traf
  rationale: נכה bezeichnet hier das Treffen oder Schlagen durch den Pfeil. Die Verwundung als Folge wird erst am Versende ausdrücklich genannt.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: zwischen den Verbindungsstücken und dem Panzer
  rationale: דְּבָקִים bezeichnet wahrscheinlich aneinandergefügte Teile, Verbindungsstellen oder Fugen der Rüstung; שִׁרְיָן ist ein Körperpanzer beziehungsweise Panzerhemd. Die konkrete Rüstungsbauart ist unsicher und wird daher nicht stärker festgelegt.
- source_word: לָרַכָּב
  choice: zum Wagenlenker
  rationale: Gemeint ist in diesem Zusammenhang der Mann, der den Streitwagen lenkt.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Wende deine Hand
  rationale: Die hebräische Körpermetapher wird im Haupttext bewahrt. Gemeint ist wahrscheinlich, dass der Lenker den Wagen wenden oder aus dem Kampfbereich herausmanövrieren soll.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: und bring mich aus dem Kampf heraus
  rationale: מַחֲנֶה kann Lager, Heerlager oder das aufgestellte Heer bezeichnen. Da die Szene mitten in der Schlacht spielt, gibt „aus dem Kampf heraus“ die situationsbezogene Bedeutung natürlich wieder; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- source_word: כִּי הָחֳלֵיתִי
  choice: denn ich bin verwundet
  rationale: Die Hophal-Form von חלה bezeichnet hier infolge des Pfeiltreffers das Verwundet- beziehungsweise Geschwächtsein. Der Ausgangstext verlangt nicht eindeutig den zusätzlichen Intensitätsgrad „schwer“.
