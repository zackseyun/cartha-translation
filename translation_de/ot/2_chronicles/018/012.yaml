source:
  edition: WLC
  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: de
  text: 'Der Bote, der gegangen war, um Micha zu rufen, sagte zu ihm: »Sieh, die Worte der Propheten sind wie aus einem Mund[a] günstig für den König. Lass doch dein Wort wie das eines von ihnen sein und rede Gutes!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit einem Mund“; gemeint ist: völlig übereinstimmend oder wie mit einer Stimme.'
    reason: Die Fußnote erläutert die hebräische Redewendung פֶּה אֶחָד und bewahrt zugleich ihr Bild im Haupttext.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im Erzählzusammenhang ist ein menschlicher Abgesandter gemeint, der Micha holen soll; daher ist „Bote“ treffender als „Engel“.
- source_word: לִקְרֹא
  choice: um … zu rufen
  rationale: Das Verb bezeichnet hier die Aufforderung, vor dem König zu erscheinen. „Rufen“ bleibt nah am Hebräischen und ist im Zusammenhang eindeutig.
- source_word: לְמִיכָיְהוּ
  choice: Micha
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: sagte zu ihm
  rationale: Die hebräische Redeeinleitung wird in natürlichem modernem Deutsch wiedergegeben, ohne das formelhafte „sprach … und sagte“ nachzuahmen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ bewahrt die aufmerksamkeitslenkende Funktion und klingt würdig, ohne so altertümlich wie „siehe“ zu wirken.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: die Worte der Propheten
  rationale: Die Pluralform und die konkrete Redeweise des Ausgangstextes bleiben erhalten.
- source_word: פֶּה אֶחָד
  choice: wie aus einem Mund
  rationale: Die hebräische Metapher wird durch die entsprechende geläufige deutsche Redewendung bewahrt.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: günstig für den König
  rationale: „Günstig“ bezeichnet hier den positiven, dem König genehmen Inhalt der prophetischen Aussagen.
- source_word: וִיהִי נָא
  choice: Lass doch … sein
  rationale: „Doch“ gibt die höflich-drängende Partikel נָא zusammen mit der auffordernden Verbform natürlich wieder.
- source_word: דְבָרְךָ
  choice: dein Wort
  rationale: Der Singular bleibt erhalten und bezeichnet Michas prophetische Aussage als Einheit.
- source_word: כְּאַחַד מֵהֶם
  choice: wie das eines von ihnen
  rationale: Die Formulierung bezieht den Vergleich eindeutig auf das zuvor genannte „Wort“ und wahrt zugleich den singularischen Ausdruck.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: und rede Gutes
  rationale: Die Wiederaufnahme von טוֹב wird sichtbar gehalten; „Gutes reden“ ist verständlich und gibt die Aufforderung zu einer positiven Weissagung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache „mit einem Mund“ wird in der natürlichen deutschen Wendung „wie aus einem Mund“ erhalten; unnötig altertümliche Redeformeln werden vermieden.
