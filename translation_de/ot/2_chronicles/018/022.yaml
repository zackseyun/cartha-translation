source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: de
  text: 'Und nun, sieh: Der HERR hat einen Lügengeist in den Mund dieser deiner Propheten gelegt, und der HERR hat Unheil gegen dich angekündigt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Und nun sieh
  rationale: Gibt sowohl den Übergang „nun“ als auch den aufmerksamkeitslenkenden Ausruf הִנֵּה in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Entspricht der etablierten deutschen Bibelkonvention für das Tetragramm und bewahrt dessen Charakter als Gottes Eigenname durch Kapitälchen-Schreibweise.
- source_word: רוּחַ שֶׁקֶר
  choice: einen Lügengeist
  rationale: Bewahrt die konkrete und theologisch spannungsreiche Formulierung des Hebräischen, ohne sie als bloße Täuschung abzuschwächen.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: diesen deinen Propheten … in den Mund
  rationale: Die deutsche Wortstellung macht die Zugehörigkeit zu dem angesprochenen König und den deiktischen Bezug auf die anwesenden Propheten deutlich.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: hat Unheil über dich angekündigt
  rationale: רָעָה bezeichnet hier drohendes Unheil; „angekündigt“ gibt דִּבֶּר idiomatisch wieder, ohne eine bereits vollzogene Tat zu behaupten.
theological_decisions:
- issue: Gottes Verhältnis zum Lügengeist
  choice: „Der HERR hat … einen Lügengeist … gelegt“
  alternative: „Der HERR hat zugelassen, dass …“
  rationale: Der hebräische Text schreibt die Handlung unmittelbar JHWH zu. Eine bloße Zulassungsformel würde die Aussage abschwächen und die erzählerische sowie theologische Spannung vorzeitig auflösen.
- issue: Bedeutung von רָעָה
  choice: „Unheil“
  alternative: „Böses“ oder „Verderben“
  rationale: Im Kontext bezeichnet das Wort das angekündigte Gericht beziehungsweise Unglück über Ahab, nicht moralische Bosheit Gottes. „Unheil“ wahrt diesen Sinn ohne unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Warnrede und ihre direkte Anrede bleiben erhalten; keine Fußnote ist für das Verständnis erforderlich.
