  source_fidelity: 'Der Haupttext gibt die emphatische Bedingung אִם שׁוֹב תָּשׁוּב, בְּשָׁלוֹם sowie den instrumentalen Sinn von דִבֶּר ... בִּי zutreffend wieder. Der Plural in עַמִּים כֻּלָּם bleibt erhalten, und „Jahwe“ entspricht dem Tetragramm. Die vorhandene Fußnote ist jedoch missverständlich: „in mir“ ist zwar eine formnahe Wiedergabe der Präposition, beschreibt hier aber nicht die gemeinte deutsche Aussage und kann als innere Rede verstanden werden.'
