base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: de
  text: 'Michaja sagte: „Wenn du tatsächlich in Frieden zurückkehrst, dann hat Jahwe nicht durch mich[a] gesprochen.“ Dann sagte er: „Hört, all ihr Völker!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe hat nicht durch mich geredet.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Die im Deutschen gebräuchliche, quellennah transkribierte Form des Personennamens; Eigennamen werden nicht übersetzt.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Wenn du tatsächlich … zurückkehrst
  rationale: Der Infinitivus absolutus neben dem finiten Verb verstärkt die Bedingung. „Tatsächlich“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die direkte deutsche Entsprechung bewahrt die hebräische Wendung und kann hier zugleich eine sichere, unversehrte Rückkehr bezeichnen.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: dann hat Jahwe nicht durch mich gesprochen
  rationale: „Durch mich“ gibt den instrumentalen Sinn von בִּי idiomatisch wieder; „dann“ macht die Folgerung des Bedingungssatzes im Deutschen klar, ohne sie inhaltlich zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ wird knapp und mit dem feierlichen Ton eines prophetischen Aufrufs wiedergegeben.
- source_word: עַמִּים כֻּלָּם
  choice: ihr Völker alle
  rationale: Der Plural „Völker“ bleibt erhalten; die Anredeform und das nachgestellte „alle“ entsprechen der breiten prophetischen Aufforderung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname wahrt diese Form.
- issue: Sprecher des abschließenden Satzes
  choice: 'Michaja bleibt der Sprecher: „Dann sagte er …“'
  alternative: Der Sprecher bleibt unbestimmt oder wechselt.
  rationale: Das hebräische וַיֹּאמֶר nennt kein neues Subjekt; der nächstliegende ausdrücklich genannte Sprecher ist Michaja.
- issue: Tragweite der abschließenden Anrede
  choice: „ihr Völker alle“
  alternative: „ihr alle“ beziehungsweise „das ganze Volk“
  rationale: Der hebräische Plural עַמִּים bezeichnet ausdrücklich „Völker“ und soll nicht auf die unmittelbar anwesende Gruppe verengt werden.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und prophetisch zugespitzt; der Plural „Völker“ sowie die Spannung der Bedingung werden bewahrt.
