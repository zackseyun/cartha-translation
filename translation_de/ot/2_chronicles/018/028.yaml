  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: de
  text: Da zogen der König von Israel und Joschafat, der König von Juda, nach Ramot-Gilead hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Da zogen … hinauf
  rationale: עלה bezeichnet wörtlich das Hinaufgehen. Im Zusammenhang eines gemeinsamen militärischen Unternehmens ist „hinaufziehen“ im Deutschen natürlich, ohne über das Verb hinaus Einzelheiten wie einen Angriff auszudrücken.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die geläufige deutsche Wiedergabe des hebräischen Königstitels ist klar und entspricht dem bestimmten Bezug im Kontext.
- source_word: וִיהוֹשָׁפָט
  choice: und Joschafat
  rationale: Die Konjunktion wird additiv wiedergegeben; die etablierte deutsche Namensform lautet „Joschafat“.
- source_word: מֶלֶךְ יְהוּדָה
  choice: der König von Juda
  rationale: Die Apposition wird im modernen Deutsch zur eindeutigen Zuordnung mit Kommas und bestimmtem Artikel formuliert.
- source_word: אֶל
  choice: nach
  rationale: Bei der Bewegung zu einem Ortsnamen ist „nach“ die idiomatische deutsche Entsprechung.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot in Gilead
  rationale: „Ramot“ folgt der hebräischen Namensform; „in Gilead“ macht die geografische Bestimmung des zusammengesetzten Ortsnamens für heutige Leser transparent.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Satzstellung bewahrt den gemeinsamen Aufbruch beider Könige; „zogen … hinauf“ hält sowohl die Bewegungsrichtung als auch den militärischen Kontext fest, ohne diesen auszuschmücken.
