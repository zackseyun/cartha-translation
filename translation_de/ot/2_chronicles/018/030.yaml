source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: de
  text: 'Der König von Aram hatte den Befehlshabern seiner Streitwagen befohlen: „Kämpft weder gegen Klein noch Groß, sondern allein gegen den König von Israel.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Der König von Aram
  rationale: Die Konjunktion verbindet den Satz mit dem Zusammenhang, muss im Deutschen bei diesem Wechsel zu einer Hintergrundangabe aber nicht eigens wiedergegeben werden. אֲרָם wird als Eigenname „Aram“ beibehalten.
- source_word: צִוָּה
  choice: hatte ... befohlen
  rationale: Das Verb bedeutet „befehlen, anordnen“. Das Plusquamperfekt macht deutlich, dass der Befehl vor dem anschließend erzählten Kampfgeschehen ergangen war.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: den Befehlshabern seiner Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Führer; הָרֶכֶב kann die Streitwagen beziehungsweise die Streitwagentruppe meinen. Die deutsche Fügung gibt zugleich אֲשֶׁר לוֹ („die ihm gehörten/unterstanden“) knapp und natürlich wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das formelhafte „indem er sagte/folgendermaßen“ wird im modernen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt.
- source_word: לֹא תִּלָּחֲמוּ
  choice: Kämpft ... nicht / weder
  rationale: Die Verbform hat im direkten Befehl prohibitive Kraft. In Verbindung mit dem folgenden Gegensatz ist „weder ... noch“ die natürliche deutsche Wiedergabe.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: gegen Klein noch Groß
  rationale: Die feste Gegenüberstellung bezeichnet Menschen unabhängig von Rang oder Bedeutung. Die bildhafte, umfassende Formulierung bleibt erhalten, statt sie vollständig zu „niemandem“ aufzulösen.
- source_word: כִּי אִם
  choice: sondern
  rationale: Die Konstruktion führt nach der Verneinung die ausschließliche Ausnahme ein; „sondern“ trägt diese Kontrastfunktion im Deutschen.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: allein gegen den König von Israel
  rationale: „Gegen“ ergänzt idiomatisch das Ziel des Kampfes. לְבַדּוֹ schränkt den Angriff ausdrücklich auf den König von Israel als einziges Ziel ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Sprache bleibt klar, und die hebräische Merismus-Formel „Klein ... Groß“ wird bewahrt, ohne ihre Aussage konfessionell oder interpretierend einzuengen.
