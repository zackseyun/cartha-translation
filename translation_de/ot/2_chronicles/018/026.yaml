base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: de
  text: 'und sagt: »So spricht der König: Bringt diesen Mann ins Gefängnis und gebt ihm karges Brot und karges Wasser[a], bis ich in Frieden zurückkehre.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brot der Bedrängnis und Wasser der Bedrängnis«; gemeint sind wohl knappe Rationen unter den entbehrungsreichen Bedingungen der Haft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: und sagt
  rationale: Die Verbform setzt den königlichen Befehl an mehrere Angesprochene imperativisch fort; »und sagt« ist im Deutschen natürlich und präzise.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die feststehende Botenformel wird in einer amtlichen Mitteilung idiomatisch im Präsens wiedergegeben.
- source_word: שִׂימוּ זֶה
  choice: Bringt diesen Mann
  rationale: Das deiktische זֶה bezeichnet Micha ausdrücklich und wohl leicht geringschätzig. »Diesen Mann« macht den Bezug klar, ohne zusätzliche Verachtung einzutragen; »bringen« passt idiomatisch zum Ziel »ins Gefängnis«.
- source_word: בֵּית הַכֶּלֶא
  choice: ins Gefängnis
  rationale: Die wörtliche Wendung »Haus der Gefangenschaft« bezeichnet idiomatisch das Gefängnis.
- source_word: וְהַאֲכִלֻהוּ
  choice: und gebt ihm
  rationale: Der Kausativ bedeutet »lasst ihn essen / ernährt ihn«. Zusammen mit Brot und Wasser ist »gebt ihm« natürlich; »nur« verdeutlicht den durch לַחַץ bezeichneten kargen Charakter der Ration.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: nur kärgliches Brot und kärgliches Wasser
  rationale: לַחַץ kann Bedrängnis, Not oder bedrückende Knappheit ausdrücken. Im Gefängniskontext sind knappe, entbehrungsreiche Rationen gemeint; die Wiederholung von »kärglich« bewahrt den hebräischen Parallelismus.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: bis ich wohlbehalten zurückkehre
  rationale: בְשָׁלוֹם bezeichnet hier die sichere, unversehrte Rückkehr aus der Schlacht. »Wohlbehalten« ist heutiges, natürliches Deutsch und erhält die Ironie des Zusammenhangs.
