  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: de
  text: An jenem Tag wurde der Kampf immer heftiger. Der König von Israel hielt sich im Streitwagen Aram gegenüber bis zum Abend aufrecht[a]. Als die Sonne unterging, starb er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wurde … aufrecht gehalten.'
    reason: Die kausative Verbform kann im Zusammenhang auch so verstanden werden, dass der verwundete König im Streitwagen aufrecht gehalten beziehungsweise gestützt wurde.
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: wurde der Kampf immer heftiger
  rationale: עלה bedeutet wörtlich „hinaufgehen“, bezeichnet mit „Kampf“ als Subjekt jedoch idiomatisch dessen zunehmende Heftigkeit.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die geläufige deutsche Zeitangabe gibt Präposition, Artikel und Demonstrativ natürlich wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Constructusverbindung wird unmittelbar und eindeutig wiedergegeben.
- source_word: הָיָה מַעֲמִיד
  choice: hielt sich … aufrecht
  rationale: Die Verbindung von היה mit dem Partizip beschreibt einen fortdauernden Zustand beziehungsweise eine fortdauernde Handlung. Die Hifil-Form von עמד hat kausative Bedeutung; die reflexive deutsche Form passt zum König als grammatischem Subjekt, ohne ausdrücklich eine nicht genannte Hilfsperson einzuführen.
- source_word: בַּמֶּרְכָּבָה
  choice: im Streitwagen
  rationale: „Streitwagen“ ist die präzise, im historischen Zusammenhang natürliche Wiedergabe von מֶרְכָּבָה.
- source_word: נֹכַח אֲרָם
  choice: Aram gegenüber
  rationale: נֹכַח bezeichnet die Ausrichtung gegenüber einer anderen Seite. Der Eigenname Aram bleibt erhalten; die Streitkräfte Arams sind im Kontext mitgemeint.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die zeitliche Grenze und der bestimmte Artikel werden natürlich wiedergegeben.
- source_word: וַיָּמָת
  choice: starb er
  rationale: Die knappe Erzählfortführung wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: Als die Sonne unterging
  rationale: Die Wendung bezeichnet den Zeitpunkt des Sonnenuntergangs. Der deutsche Nebensatz bewahrt den verbalen Charakter von בּוֹא und liest sich natürlicher als eine wörtliche Nominalkonstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Kurze Sätze vermeiden eine schwerfällige Reihung; der Eigenname „Aram“ bleibt entsprechend dem hebräischen Text erhalten. Die mögliche Mehrdeutigkeit der Form מַעֲמִיד wird nicht dogmatisch aufgelöst, sondern in einer Fußnote ausgewiesen.
