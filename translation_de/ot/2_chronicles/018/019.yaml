source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: de
  text: 'Und Jahwe sagte: »Wer wird Ahab, den König von Israel, dazu verleiten[a], hinaufzuziehen und bei Ramot-Gilead zu fallen?« Da sagte der eine dies und der andere das.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »überreden« oder »täuschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יְפַתֶּה
  choice: dazu verleiten
  rationale: Das Piel von פתה kann je nach Kontext »verleiten«, »überreden« oder »täuschen« bedeuten. »Dazu verleiten« bewahrt hier sowohl das gezielte Bewegen zum Handeln als auch die moralische Spannung, ohne das Mittel bereits im Haupttext eindeutig als Täuschung festzulegen.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Ahab, den König von Israel
  rationale: Die Apposition wird im Deutschen durch Kommas kenntlich gemacht und bleibt zugleich eng am hebräischen Ausdruck.
- source_word: וְיַעַל וְיִפֹּל
  choice: hinaufzuziehen und … zu fallen
  rationale: Die Infinitivkonstruktion nach »dazu verleiten« gibt den Zweck beziehungsweise das beabsichtigte Ergebnis der hebräischen Imperfektformen natürlich wieder. »Fallen« bewahrt das Bild des Ausgangstextes und lässt den Zusammenhang Tod beziehungsweise Niederlage anzeigen.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: bei Ramot-Gilead
  rationale: »Bei« ist im Zusammenhang einer Schlacht an einem Ort idiomatisch; der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: Da sagte der eine dies und der andere das
  rationale: Die deutsche Wendung bildet die parallele Gegenüberstellung verschiedener Vorschläge knapp und natürlich ab.
theological_decisions:
- issue: Göttliche Beteiligung an Ahabs Untergang
  choice: Jahwe fragt unmittelbar, wer Ahab verleiten wird.
  alternative: Die göttliche Beteiligung durch Formulierungen wie »beeinflussen« oder »sich verleiten lassen« abschwächen.
  rationale: Der hebräische Text stellt Jahwe als denjenigen dar, der die Beratung eröffnet. Diese unmittelbare Darstellung und ihre theologische Spannung werden nicht abgeschwächt.
- issue: Moralische Bedeutungsbreite von פתה
  choice: Im Haupttext steht »verleiten«.
  alternative: »überreden« oder »täuschen«
  rationale: Der Zusammenhang führt zu irreführendem Rat und Ahabs Tod, doch das Verb selbst lässt mehrere Nuancen zu. Die Fußnote hält diese Bedeutungsbreite offen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp; »Da sagte der eine dies und der andere das« gibt die formelhafte Beratungsszene verständlich wieder. Der Fußnotenmarker [a] steht unmittelbar bei dem mehrdeutigen Verb.
