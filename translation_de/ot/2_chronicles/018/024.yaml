  verdict: revise
  source_fidelity: Die Vorhersageform von הִנְּךָ רֹאֶה ist mit „Du wirst … sehen“ angemessen wiedergegeben. Die Fassung „in das innerste Zimmer zurückziehst“ legt jedoch sowohl einen Superlativ als auch einen geordneten Rückzug nahe, die der hebräische Ausdruck חֶדֶר בְּחֶדֶר nicht eindeutig fordert. Die Wiederholung mit Präposition kann eine Bewegung von Raum zu Raum bzw. weiter in die Räume hinein bezeichnen.
  naturalness: „Wenn du von Zimmer zu Zimmer gehst, um dich zu verstecken“ ist modernes, klares Standarddeutsch und bewahrt den bedrängten Kontext. „Du wirst es … sehen“ ist zwar idiomatisch, doch das ergänzte Objekt „es“ ist im Deutschen nicht nötig.
  terminology: „Michaja“ ist eine etablierte deutsche Namensform. „Zimmer“ ist für חֶדֶר in diesem Kontext passend; die Fußnote dokumentiert die wörtliche Form sowie die alternative Deutung als innerer Raum.
  issues:
  - severity: medium
    issue: „in das innerste Zimmer zurückziehst“ ist zu stark festgelegt.
    rationale: Das Hebräische enthält weder einen ausdrücklichen Superlativ („innerste“) noch ein Verb für „sich zurückziehen“. Die Wendung חֶדֶר בְּחֶדֶר ist mehrdeutig und kann auch Bewegung von Raum zu Raum ausdrücken.
  - severity: low
    issue: Das Objekt „es“ in „Du wirst es … sehen“ ist ergänzt.
    rationale: Die Ergänzung ist nicht sinnentstellend, aber „Du wirst … sehen“ gibt die offene hebräische Form unmittelbarer wieder.
  revised_text: 'Michaja sagte: „Du wirst an jenem Tag sehen, wenn du von Zimmer zu Zimmer gehst, um dich zu verstecken.“[a]'
