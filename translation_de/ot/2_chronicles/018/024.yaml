  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: de
  text: 'Michaja sagte: „Du wirst an jenem Tag sehen, wenn du von Zimmer zu Zimmer gehst, um dich zu verstecken.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zimmer in Zimmer“; möglicherweise: „in ein inneres Zimmer“.'
    reason: Die knappe hebräische Wendung חֶדֶר בְּחֶדֶר kann eine Bewegung durch mehrere Räume oder das Vordringen in einen inneren Raum bezeichnen.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Die im Deutschen gebräuchliche biblische Namensform gibt den hebräischen Eigennamen angemessen wieder.
- source_word: הִנְּךָ רֹאֶה
  choice: Du wirst es sehen
  rationale: הִנְּךָ mit Partizip hat hier voraussagende Kraft. Die Wendung kündigt an, dass Zedekia die Wahrheit von Michajas Aussage selbst erfahren wird; ein gesondertes „Siehe“ wäre im modernen Deutschen unnötig steif.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche und zugleich quellennah formulierte Wiedergabe der hebräischen Zeitangabe.
- source_word: אֲשֶׁר תָּבוֹא
  choice: wenn du dich … zurückziehst
  rationale: Die Konstruktion bezeichnet den Umstand, unter dem sich die Vorhersage erfüllt. „Sich zurückziehen“ bringt im Zusammenhang die Bewegung in ein Versteck natürlich zum Ausdruck.
- source_word: חֶדֶר בְּחֶדֶר
  choice: in das innerste Zimmer
  rationale: Die idiomatische Verbindung bezeichnet wahrscheinlich den am weitesten innen gelegenen, besonders geschützten Raum. Die wörtlichere und möglicherweise dynamische Lesart bleibt in der Fußnote erhalten.
- source_word: לְהֵחָבֵא
  choice: um dich zu verstecken
  rationale: Der Niphal-Infinitiv bezeichnet hier das Sichverbergen des angeredeten Zedekia; die reflexive deutsche Form ist eindeutig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt knapp und eindringlich; auf das altertümliche Aufmerksamkeitssignal „Siehe“ wird zugunsten einer natürlichen deutschen Zukunftsaussage verzichtet.
