base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: de
  text: 'Da rief der König von Israel einen Hofbeamten[a] und sagte: »Hol schnell Micha, den Sohn Jimlas!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »einen Eunuchen« oder »einen königlichen Amtsträger«; das hebräische Wort kann sowohl einen Eunuchen im wörtlichen Sinn als auch allgemeiner einen königlichen Beamten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief
  rationale: Das narrative Wayyiqtol führt die nächste Handlung ein. »Da rief« ist im Deutschen natürlich und gibt den unmittelbaren Fortgang der Erzählung wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Status-constructus-Verbindung bezeichnet den Sprecher; die bestimmte Wiedergabe entspricht dem Kontext und natürlichem Deutsch.
- source_word: אֶל סָרִיס אֶחָד
  choice: einen Hofbeamten[a]
  rationale: סָרִיס kann einen Eunuchen im wörtlichen Sinn oder allgemeiner einen königlichen Amtsträger bezeichnen. Hier steht seine Funktion als beauftragter Bediensteter im Vordergrund; die mögliche wörtliche Bedeutung wird in der Fußnote bewahrt.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Schlichte, idiomatische Wiedergabe des üblichen hebräischen Redeverbs.
- source_word: מַהֵר
  choice: Hol schnell
  rationale: Der Imperativ von מהר drückt Dringlichkeit aus. Im Kontext ergänzt das Deutsche idiomatisch das auszuführende Holen, das im knappen Hebräisch vorausgesetzt ist.
- source_word: מיכהו
  choice: Michaja
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בֶן יִמְלָא
  choice: den Sohn Jimlas
  rationale: Direkte und idiomatische Wiedergabe der patronymischen Bezeichnung.
