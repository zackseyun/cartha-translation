id: 2CH.18.11
reference: 2 Chronicles 18:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: de
  text: 'Und alle Propheten weissagten ebenso: „Zieh hinauf nach Ramot-Gilead und sei erfolgreich! Jahwe wird es in die Hand des Königs geben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: Und alle Propheten
  rationale: Die hebräische Koordination und die Gesamtheit der Propheten werden unmittelbar und natürlich wiedergegeben.
- source_word: נִבְּאִים כֵּן
  choice: weissagten ebenso
  rationale: Das Partizip beschreibt die gleichzeitig fortdauernde prophetische Rede; im Deutschen trägt das Präteritum im Erzählzusammenhang diesen Verlauf ausreichend. כֵּן bezeichnet hier die übereinstimmende Art ihrer Aussagen.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die hebräische Redeformel wird im natürlichen modernen Deutsch durch die direkte Rede nach einem Doppelpunkt ausgedrückt.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: Bewahrt die Grundbedeutung von עלה und passt zugleich zum militärischen Aufbruch gegen die Stadt.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Gebräuchliche deutsche Transliteration des zusammengesetzten Ortsnamens.
- source_word: וְהַצְלַח
  choice: und sei erfolgreich
  rationale: Gibt den Imperativ mit der Bedeutung „Erfolg haben“ klar und idiomatisch wieder, ohne den Ausgang stärker auszudeuten.
- source_word: וְנָתַן יְהוָה
  choice: Jahwe wird es geben
  rationale: Im Anschluss an die Imperative bezeichnet die Verbform hier eine als gewiss angekündigte zukünftige Handlung. Die deutsche Zukunftsform wahrt diesen prophetischen Zuspruch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Die hebräische Wendung für das Übergeben in jemandes Gewalt bleibt als verständliches Bild erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Zeitbezug von וְנָתַן in prophetischer Rede
  choice: wird geben
  alternative: hat gegeben
  rationale: Die Form stellt den künftigen Sieg als gewiss in Aussicht. „Wird geben“ macht den Zeitbezug im Deutschen klar; „hat gegeben“ könnte die prophetische Gewissheit stärker hervorheben, aber fälschlich wie eine bereits vollzogene Handlung klingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weissagten“ hält den prophetischen Charakter fest; „Zieh hinauf“ bewahrt das räumlich-militärische Bild. Die redundante hebräische Redeformel wird im Deutschen syntaktisch durch den Doppelpunkt vertreten.
