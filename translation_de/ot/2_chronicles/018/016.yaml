source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: de
  text: 'Und er sagte: »Ich sah ganz Israel auf den Bergen zerstreut, wie Schafe, die keinen Hirten haben. Und Jahwe sagte: ›Diese haben keine Herren[a]. Jeder soll in Frieden in sein Haus zurückkehren.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Diese haben keine Herren.« Die Mehrzahl kann sich auf fehlende führende Herren oder Befehlshaber beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: zerstreut
  rationale: Das passive Partizip beschreibt Israel als auseinandergetrieben und über das Gelände verteilt; »zerstreut« bewahrt sowohl das militärische als auch das pastorale Bild.
- source_word: עַל הֶהָרִים
  choice: auf den Bergen
  rationale: Die direkte Ortsangabe gibt die erhöhte Landschaft des hebräischen Textes ohne unnötige Präzisierung wieder.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: wie Schafe, die keinen Hirten haben
  rationale: Die vollständige Vergleichs- und Relativkonstruktion folgt dem Hebräischen eng und klingt zugleich natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens erhält den Unterschied zwischen dem Tetragramm und einem bloßen Titel.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Diese haben keinen Herrn
  rationale: 'Der Singular ist im Deutschen idiomatisch und entspricht dem kollektiven Sinn: Das Volk ist nach dem Verlust seines Königs führungslos. Die morphologische Mehrzahl des hebräischen Wortes wird in einer Fußnote offengelegt.'
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Jeder soll in sein Haus zurückkehren
  rationale: »Jeder« gibt das distributive אִישׁ natürlich wieder; »soll … zurückkehren« erfasst den auffordernden Gebrauch der Verbform.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die feste Wendung bewahrt den umfassenden Sinn von שָׁלוֹם und die Spannung, dass ein geschlagenes Heer dennoch unversehrt heimkehren soll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Numerus und Sinn von אֲדֹנִים
  choice: keinen Herrn
  alternative: keine Herren
  rationale: Die Aussage bezieht sich im Kontext auf den fehlenden königlichen Führer. Der idiomatische deutsche Singular gibt diesen Sinn wieder; die hebräische Pluralform bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Bildfolge und Satzbau des Hebräischen. Die direkte Rede wird klar abgestuft; unnötig altertümliche Formulierungen werden vermieden.
