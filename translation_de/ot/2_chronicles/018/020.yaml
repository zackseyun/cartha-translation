  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: de
  text: 'Da trat der Geist hervor und stand vor Jahwe. Er sagte: »Ich werde ihn verführen[a].« Jahwe fragte ihn: »Womit?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde ihn überreden«; oder: »Ich werde ihn täuschen.« Das hebräische Verb kann je nach Zusammenhang verführen, überreden oder täuschen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: der Geist
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Da die Gestalt hervortritt, vor Jahwe steht und spricht, ist hier ein persönliches Geistwesen gemeint.
- source_word: וַיֵּצֵא
  choice: trat vor
  rationale: יצא bedeutet wörtlich hinausgehen oder hervorkommen. In der dargestellten himmlischen Ratsversammlung gibt »trat vor« die Bewegung in die Gegenwart Jahwes natürlich wieder.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: stellte sich vor
  rationale: Die Wendung bezeichnet hier das formelle Hintreten und Stehen vor einer höherrangigen Person. Die Übersetzung bewahrt sowohl die Bewegung als auch den Audienzcharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen deutschen Sprachgebrauch als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: אֲפַתֶּנּוּ
  choice: Ich werde ihn verführen
  rationale: Das Piel von פתה kann je nach Zusammenhang verführen, überreden oder täuschen bedeuten. »Verführen« erhält die Mehrdeutigkeit und nimmt die im folgenden Vers genannte Methode nicht vorweg.
- source_word: בַּמָּה
  choice: Womit?
  rationale: Die Frage zielt knapp auf das Mittel oder die Art der beabsichtigten Verführung. »Womit?« entspricht der Kürze des Hebräischen und ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt, dass der hebräische Text den Gottesnamen und nicht einen Titel verwendet; »Jahwe« ist die übliche moderne deutsche Form.
- issue: Moralische und theologische Nuance von פתה in der himmlischen Ratsversammlung
  choice: Ich werde ihn verführen
  alternative: Ich werde ihn überreden; Ich werde ihn täuschen
  rationale: Der Vers nennt zunächst nur den Vorschlag des Geistes; erst der folgende Vers beschreibt das täuschende Mittel. Die Hauptübersetzung bewahrt diese Spannung, während die Fußnote den Bedeutungsumfang offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Rede und der formelle Charakter der himmlischen Ratsversammlung bleiben erhalten.
