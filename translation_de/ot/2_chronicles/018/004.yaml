  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: de
  text: 'Da sagte Joschafat zum König von Israel: »Bitte erkundige dich heute nach dem Wort Jahwes.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die fortlaufende hebräische Erzählform in natürlichem modernem Deutsch wieder, ohne eine stärkere zeitliche oder logische Beziehung einzutragen.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: zum König von Israel
  rationale: Direkte und natürliche Wiedergabe der Präpositionalverbindung und der königlichen Amtsbezeichnung.
- source_word: דְּרָשׁ נָא
  choice: Befrage doch
  rationale: דרש bezeichnet hier das Einholen göttlicher Auskunft; die Modalpartikel »doch« gibt die höflich auffordernde Funktion von נָא idiomatisch wieder.
- source_word: כַיּוֹם
  choice: heute
  rationale: Die Wendung wird adverbial gebraucht und drängt auf eine gegenwärtige beziehungsweise unmittelbare Befragung.
- source_word: אֶת דְּבַר יְהוָה
  choice: Jahwe
  rationale: Bei דרש kann das hebräische Objekt metonymisch die göttliche Auskunft bezeichnen; »Jahwe befragen« ist im Deutschen die natürliche prophetische Fachwendung. Die formnähere Alternative wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm; »Jahwe« bewahrt den persönlichen Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Gegenstand der prophetischen Befragung
  choice: Jahwe befragen
  alternative: nach dem Wort Jahwes fragen
  rationale: Die knappe deutsche Wendung gibt den im Kontext gemeinten Vorgang idiomatisch wieder; die alternative, formal nähere Analyse von דְּבַר יְהוָה bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Befrage doch« ist verständlich und bewahrt den höflichen Aufforderungston; die Fußnote erhält die formnähere prophetische Wendung.
