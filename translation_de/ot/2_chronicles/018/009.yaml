  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: beide Könige, die distributive Angabe „jeder auf seinem Thron“, ihre Kleidung, den Dreschplatz am Tor von Samaria sowie die prophetische Tätigkeit in ihrer Gegenwart. Die Wiederholung von „saßen“ bildet die zweimalige Verwendung von יָשַׁב angemessen ab.'
