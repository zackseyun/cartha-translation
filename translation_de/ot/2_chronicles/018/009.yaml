  variant: modern standard German
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: de
  text: Der König von Israel und Joschafat, der König von Juda, saßen, jeder auf seinem Thron, in Gewänder gekleidet. Sie saßen auf dem Dreschplatz am Eingang des Tores von Samaria, und alle Propheten weissagten vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Der König von Israel
  rationale: Das einleitende ו verbindet die Szene mit dem Kontext; im Deutschen muss es hier nicht eigens mit „und“ oder „nun“ wiedergegeben werden.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: und Joschafat, der König von Juda
  rationale: Der Name wird in der gebräuchlichen deutschen Form wiedergegeben; der Königstitel steht als verständliche Apposition.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: saßen ... Sie saßen
  rationale: Die Wiederholung von ישׁב wird bewahrt, zugleich werden die verschachtelten hebräischen Partizipialkonstruktionen in zwei natürliche deutsche Sätze gegliedert.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: jeder auf seinem Thron
  rationale: אִישׁ ist distributiv gebraucht; im königlichen Zusammenhang bezeichnet כִּסֵּא einen Thron.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: in Gewänder gekleidet
  rationale: Die sachliche, nahezu wörtliche Formulierung wahrt, dass der hebräische Text weder ausdrücklich königliche noch zeremonielle Gewänder nennt.
- source_word: בְּגֹרֶן
  choice: auf dem Dreschplatz
  rationale: גֹּרֶן bezeichnet den Platz, auf dem Getreide gedroschen wird; bei einer Fläche ist „auf“ im Deutschen die natürliche Ortsangabe.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: am Eingang des Tores von Samaria
  rationale: Die hebräische Genitivkette wird eng und verständlich wiedergegeben, ohne die räumliche Beziehung genauer festzulegen, als es der Ausgangstext tut.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: weissagten vor ihnen
  rationale: Das Hitpael beschreibt hier prophetisches Reden beziehungsweise Auftreten; „vor ihnen“ wahrt die räumliche und repräsentative Bedeutung von לִפְנֵיהֶם.
theological_decisions:
- issue: Status und Wahrhaftigkeit der auftretenden Propheten
  choice: neutral als „Propheten“ und „weissagten“ wiedergegeben
  alternative: „falsche Propheten“ oder „gaben sich als Propheten aus“
  rationale: Der Vers selbst qualifiziert ihre prophetische Tätigkeit noch nicht ausdrücklich als wahr oder falsch; diese Spannung darf nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung von „sitzen“ bleibt durch die Satzteilung erkennbar; unnötig schwerfällige Verschachtelung wird vermieden. Keine Fußnoten erforderlich.
