  terminology: „Joschafat“, „Juda“, „Thron“, „Dreschplatz“ und „Propheten“ sind konsistent und sachgerecht. „Weissagten“ bleibt hinsichtlich der Bewertung dieser Propheten neutral und greift den weiteren Erzählverlauf nicht vor.
