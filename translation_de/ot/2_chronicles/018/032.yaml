id: 2CH.18.32
reference: 2 Chronicles 18:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: de
  text: Als die Befehlshaber der Streitwagen sahen, dass er nicht der König von Israel war, kehrten sie um und verfolgten ihn nicht weiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „kehrten sie von hinter ihm um“; gemeint ist, dass sie aufhörten, ihm zu folgen oder ihn zu verfolgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … sahen
  rationale: Die Verbindung aus וַיְהִי und dem mit כְּ eingeleiteten Infinitiv bezeichnet hier den Zeitpunkt des folgenden Geschehens. Die deutsche Temporalkonstruktion gibt dies natürlich wieder, ohne die erzählerische Formel unnötig wörtlich abzubilden.
- source_word: שָׂרֵי הָרֶכֶב
  choice: die Befehlshaber der Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Führer; הָרֶכֶב meint hier die Streitwagen beziehungsweise die Streitwagentruppe. Die Formulierung bleibt nahe an der hebräischen Struktur und ist in modernem Deutsch verständlich.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: dass er nicht der König von Israel war
  rationale: Im Hebräischen fehlt ein ausdrückliches Subjekt. Das Suffix in מֵאַחֲרָיו verweist jedoch auf den zuvor verfolgten Mann. Im Deutschen wird dieser Bezug mit „er“ ausdrücklich gemacht.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: kehrten sie um und verfolgten ihn nicht weiter
  rationale: שׁוּב bedeutet „umkehren/zurückkehren“; מֵאַחֲרָיו lautet wörtlich „von hinter ihm“ und bezeichnet im Zusammenhang das Ablassen von der Verfolgung. Die Wiedergabe erhält sowohl die Umkehrbewegung als auch den Sinn des Idioms.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Befehlshaber“ ist gegenüber dem heute missverständlichen „Fürsten“ militärisch präziser; „verfolgten ihn nicht weiter“ macht das hebräische Idiom verständlich, ohne den Vorgang auszudeuten.
