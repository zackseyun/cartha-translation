source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: de
  text: 'Und er sagte: »Darum hört das Wort Jahwes: Ich sah Jahwe auf seinem Thron sitzen, und das ganze Heer des Himmels[a] stand zu seiner Rechten und zu seiner Linken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ganze himmlische Heer«; traditionell auch: »alle Heerscharen des Himmels«.'
    reason: Lexikalische Alternativen für die kollektive Wendung כָל צְבָא הַשָּׁמַיִם.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang von der vorausgehenden Auseinandersetzung zur prophetischen Botschaft; im Deutschen ist »darum« zugleich klar und nachdrücklich.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ Plural fordert die Anwesenden unmittelbar auf, der prophetischen Rede Aufmerksamkeit zu schenken.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Formel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das einfache Präteritum entspricht dem Bericht über Michas Vision und klingt in deutscher Erzählprosa natürlich.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: auf seinem Thron sitzen
  rationale: Gibt das Partizip und das königliche Thronbild direkt und ohne zusätzliche Deutung wieder.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  rationale: Bewahrt den kollektiven und militärisch-höfischen Bedeutungsumfang von צָבָא; eine Fußnote nennt eine geläufige alternative Formulierung.
- source_word: עֹמְדִים
  choice: stand
  rationale: Das hebräische Partizip bezeichnet die Haltung der himmlischen Versammlung; im Deutschen verlangt das kollektive Singularsubjekt »Heer« den Singular.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: zu seiner Rechten und zu seiner Linken
  rationale: Gibt die wiederholte räumliche Zuordnung würdig und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der prophetischen Formel und in der Vision
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet an beiden Stellen ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne die Aussage der Vision abzuschwächen oder umzudeuten.
- issue: Identität und Funktion von צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  alternative: alle himmlischen Heerscharen
  rationale: Die Übersetzung hält die kollektive Bezeichnung offen und legt nicht näher fest, aus welchen Wesen die himmlische Ratsversammlung besteht.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter prophetischer Rede. Die Formulierungen bleiben verständlich, bewahren aber die Würde der Thronvision und die Bildsprache des himmlischen Hofstaats.
