id: 2CH.18.1
reference: 2 Chronicles 18:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֧י לִֽ/יהוֹשָׁפָ֛ט עֹ֥שֶׁר וְ/כָב֖וֹד לָ/רֹ֑ב וַ/יִּתְחַתֵּ֖ן לְ/אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: de
  text: Joschafat besaß großen Reichtum und hohes Ansehen und ging mit Ahab eine Heiratsverbindung ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verschwägerte sich mit Ahab; oder: schloss mit Ahab ein Heiratsbündnis.'
    reason: Lexikalische Alternativen für וַיִּתְחַתֵּן, das eine durch Heirat begründete verwandtschaftliche oder dynastische Verbindung bezeichnet.
lexical_decisions:
- source_word: וַיְהִי
  choice: besaß
  rationale: Die Erzählform von היה eröffnet eine neue Entwicklung; im modernen Deutschen wird sie ohne die formelhafte Wendung „Und es geschah“ idiomatisch in den Satz integriert.
- source_word: לִיהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname folgt der im Deutschen gebräuchlichen biblischen Schreibweise.
- source_word: עֹשֶׁר
  choice: großen Reichtum
  rationale: Das Substantiv bezeichnet materiellen Wohlstand; zusammen mit לָרֹב gibt „großen Reichtum“ die außergewöhnliche Fülle natürlich wieder.
- source_word: וְכָבוֹד
  choice: hohes Ansehen
  rationale: כָּבוֹד bezeichnet hier den gesellschaftlichen Rang und das Prestige des Königs, nicht sichtbare Herrlichkeit.
- source_word: לָרֹב
  choice: großen … hohes
  rationale: Die Wendung kennzeichnet Reichtum und Ansehen als überaus reichlich; die abgestimmten deutschen Adjektive geben dies idiomatisch wieder.
- source_word: וַיִּתְחַתֵּן
  choice: ging … eine Heiratsverbindung ein
  rationale: Der Hitpael von חתן bezeichnet hier das Eingehen einer verwandtschaftlichen beziehungsweise dynastischen Verbindung durch Heirat, nicht zwingend eine persönliche Eheschließung Joschafats.
- source_word: לְאַחְאָב
  choice: mit Ahab
  rationale: Bei einer wechselseitigen Verbindung entspricht „mit“ dem natürlichen deutschen Sprachgebrauch und gibt die relationale Bedeutung der hebräischen Konstruktion wieder.
theological_decisions:
- issue: Art der Beziehung Joschafats zu Ahab in וַיִּתְחַתֵּן לְאַחְאָב
  choice: ging mit Ahab eine Heiratsverbindung ein
  alternative: verschwägerte sich mit Ahab
  rationale: Die Formulierung bezeichnet eine dynastische oder politische Verbindung durch Heirat, ohne zu behaupten, Joschafat selbst habe Ahab oder ein Mitglied seines Hauses geheiratet. Die genaue familiäre Anordnung wird nicht über den Vers hinaus festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erzählerische Anschluss wird ohne ein nicht ausdrücklich vorhandenes „Nun“ oder das archaische „Und es geschah“ wiedergegeben. Die Heiratsverbindung bleibt bewusst allgemein formuliert.
