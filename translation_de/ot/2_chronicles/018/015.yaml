source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: de
  text: 'Da sagte der König zu ihm: »Wie oft muss ich dich noch beschwören, mir im Namen Jahwes nichts als die Wahrheit zu sagen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Entspricht dem bestimmten hebräischen Titel, ohne den im Vers nicht genannten Eigennamen zu ergänzen.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Wie oft ... noch
  rationale: Die idiomatische Wendung drückt ungeduldige Wiederholung aus; »noch« gibt die im Hebräischen angelegte Verärgerung natürlich wieder.
- source_word: מַשְׁבִּיעֶךָ
  choice: muss ich dich ... beschwören
  rationale: Der Hifil von שבע bezeichnet das eindringliche Verpflichten unter Eid. »Beschwören« ist würdig, verständlich und passt zur rhetorischen Frage.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: mir ... nichts als die Wahrheit zu sagen
  rationale: Nach dem Verb des Beschwörens bezeichnet die negierte Konstruktion mit רַק den Inhalt der Verpflichtung. Die deutsche Wendung wahrt Exklusivität und Adressatenbezug natürlich.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die Präposition bezeichnet hier Autorität beziehungsweise feierlichen Bezug; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. »Jahwe« bewahrt diesen Namenscharakter; die traditionelle Ersetzung durch einen Titel wird nicht in den Haupttext übernommen.
- issue: Art der Verpflichtung durch מַשְׁבִּיעֶךָ
  choice: beschwören
  alternative: unter Eid stellen
  rationale: Der Kontext enthält eine förmliche, eindringliche Verpflichtung zur Wahrheit. »Beschwören« wahrt dies, ohne ein detailliertes Rechtsverfahren einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »nichts als die Wahrheit« ist idiomatisch, ohne den Sinn zu erweitern.
