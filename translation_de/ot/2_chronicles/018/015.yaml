  terminology: »Jahwe« ist eine sachgerechte Wiedergabe von יהוה und entspricht der dokumentierten Namensentscheidung. »König«, »beschwören« und »Wahrheit« sind kontextgerecht. Keine Fußnoten sind für lexikalische oder textkritische Unsicherheiten erforderlich.
