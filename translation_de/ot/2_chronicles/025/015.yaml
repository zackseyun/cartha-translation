  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: de
  text: 'Da entbrannte Jahwes Zorn gegen Amazja. Er sandte einen Propheten zu ihm, der zu ihm sagte: »Warum hast du die Götter dieses Volkes gesucht[a], die ihr eigenes Volk nicht aus deiner Hand gerettet haben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: befragt; oder: dich an die Götter dieses Volkes gewandt.'
    reason: Lexikalische Alternativen für דרש im religiösen Zusammenhang.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Da entbrannte Jahwes Zorn
  rationale: Bewahrt das anschauliche hebräische Zornesidiom in einer natürlichen und würdevollen deutschen Form.
- source_word: בַּאֲמַצְיָהוּ
  choice: gegen Amazja
  rationale: Die Präposition bezeichnet bei einem Verb des Zorns die Person, gegen die sich der Zorn richtet.
- source_word: נָבִיא
  choice: einen Propheten
  rationale: Übliche und genaue Wiedergabe der Bezeichnung für einen prophetischen Boten.
- source_word: דָרַשְׁתָּ
  choice: hast du ... gesucht
  rationale: Das Verb kann im religiösen Zusammenhang »suchen«, »befragen« oder »sich an jemanden wenden« bedeuten. »Gesucht« erhält die Bedeutungsbreite, ohne Befragung oder Verehrung einseitig festzulegen.
- source_word: אֱלֹהֵי הָעָם
  choice: die Götter dieses Volkes
  rationale: »Dieses Volkes« verweist im Deutschen natürlich auf das zuvor im Kontext genannte besiegte Volk.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: die ... nicht ... gerettet haben
  rationale: Gibt die festgestellte Nichtrettung wieder, ohne interpretierend ein Unvermögen ausdrücklich zu behaupten.
- source_word: עַמָּם
  choice: ihr eigenes Volk
  rationale: »Eigenes« verdeutlicht im Deutschen die possessive Beziehung und die im Satz liegende Ironie, ohne den Sachgehalt zu verändern.
- source_word: מִיָּדֶךָ
  choice: aus deiner Hand
  rationale: Erhält das konkrete hebräische Bild für Gewalt beziehungsweise Macht; die Wendung ist im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. »Jahwe« gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Handlungsweise gegenüber den fremden Göttern
  choice: gesucht
  alternative: befragt / sich an sie gewandt
  rationale: Das hebräische דרש lässt offen, ob hier vor allem Befragung, religiöse Hinwendung oder beides im Blick ist; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und pointiert; das Bild »aus deiner Hand« wird bewusst bewahrt.
