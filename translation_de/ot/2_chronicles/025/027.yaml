source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: de
  text: Von der Zeit an, als Amazja sich von der Nachfolge Jahwes abwandte[a], verschworen sie sich in Jerusalem gegen ihn. Er floh nach Lachisch; doch sie schickten ihm nach Lachisch nach und töteten ihn dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sich von hinter Jahwe abwandte“; ein hebräisches Idiom dafür, aufzuhören, Jahwe nachzufolgen.'
    reason: Das hebräische Idiom verbindet die Abkehr mit dem Gedanken der Nachfolge; die deutsche Hauptfassung gibt dies idiomatisch wieder.
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: Von der Zeit an, als
  rationale: Gibt den zeitlichen Ausgangspunkt der folgenden Verschwörung natürlich und genau wieder; das vorangestellte Waw braucht im Deutschen keinen eigenen Erzählmarker.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: sich davon abwandte, Jahwe nachzufolgen
  rationale: Bewahrt sowohl die Abkehrbewegung von סָר als auch das hebräische Nachfolgeidiom מֵאַחֲרֵי, ohne die religiöse Abkehr abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen in der im Deutschen geläufigen Form wieder.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: verschworen sie sich gegen ihn
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet das Anzetteln einer Verschwörung; die deutsche idiomatische Wendung erfasst dies ohne schwerfällige Wiederholung.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Er floh nach Lachisch
  rationale: Das Verb bezeichnet die Flucht vor Gefahr; die Richtungsendung wird natürlich mit „nach“ wiedergegeben.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: doch sie schickten ihm Leute nach Lachisch hinterher
  rationale: „Leute“ ist als im Deutschen nötiges, im Hebräischen implizites Objekt ergänzt. „Doch“ macht den kontextuellen Gegensatz zwischen Flucht und Verfolgung deutlich.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: und ließen ihn dort töten
  rationale: Der Hifil von מות ist kausativ; die Formulierung lässt offen, ob die Verschwörer selbst oder die von ihnen Gesandten die Tötung ausführten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese Unterscheidung.
- issue: Art von Amazjas Abkehr
  choice: sich davon abwandte, Jahwe nachzufolgen
  alternative: Jahwe verließ
  rationale: Die gewählte Fassung bewahrt das Nachfolgeidiom und beschreibt religiöse Abkehr, ohne zusätzliche Aussagen über eine vollständige oder endgültige Lossagung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die zeitliche und erzählerische Abfolge zu verändern. „Jahwe“ folgt der im Deutschen üblichen Form des Gottesnamens; „Leute“ verdeutlicht das im Verb „schicken“ implizierte menschliche Objekt.
