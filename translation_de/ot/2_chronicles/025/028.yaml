  text: וַ/יִּשָּׂאֻ֖/הוּ עַל הַ/סּוּסִ֑ים וַֽ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: de
  text: Sie trugen ihn auf den Pferden[a] und begruben ihn bei seinen Vätern in der Stadt Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Pferden“. Im Hebräischen steht ausdrücklich der Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Sie trugen ihn
  rationale: נשׂא bezeichnet hier im Kontext des Leichentransports das Tragen bzw. Befördern; „trugen“ ist natürlich und wahrt die konkrete Aussage.
- source_word: עַל הַסּוּסִים
  choice: auf den Pferden
  rationale: Die Wiedergabe folgt der hebräischen Formulierung mit Präposition, Artikel und Plural, ohne ein nicht genanntes Transportmittel wie Wagen oder Bahre einzufügen.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: und begruben ihn
  rationale: Direkte und idiomatische Wiedergabe von קבר mit dem männlichen Objekt.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vätern
  rationale: „Bei seinen Vätern“ gibt die traditionelle Bestattungsformel im Deutschen natürlicher wieder als das räumlich missverständliche „mit seinen Vätern“ und bewahrt zugleich das Bild der Väter.
- source_word: בְּעִיר יְהוּדָה
  choice: in der Stadt Juda
  rationale: Die masoretische Lesart „Stadt Juda“ wird unmittelbar wiedergegeben und nicht an die geläufigere Formulierung „Stadt Davids“ angeglichen.
theological_decisions:
- issue: Bestattungsformel und Ortsangabe
  choice: „bei seinen Vätern in der Stadt Juda“ entsprechend dem masoretischen Text
  alternative: „bei seinen Vorfahren in der Stadt Davids“ oder allgemein „in Juda“
  rationale: Die konkrete, ungewöhnliche Ortsangabe des Ausgangstextes bleibt stehen; weder wird harmonisiert noch eine erwartbarere Lesart eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die ungewöhnliche ausdrückliche Erwähnung mehrerer Pferde bleiben erhalten.
