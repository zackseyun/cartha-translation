  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes richtig war, jedoch nicht mit ganzem Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht mit ganzem/vollständigem Herzen“. Auch möglich: „nicht von ganzem Herzen“ oder „nicht mit vollkommenem Herzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Waw mit Imperfekt führt die Erzählung in der Vergangenheit fort. Im Deutschen ist ein einleitendes „Und“ hier nicht nötig.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: Das substantivierte Adjektiv bezeichnet das moralisch Richtige; die Formulierung ist natürlich und bewahrt die wertende Aussage.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Bewertungsformel wird unter Beibehaltung ihres verständlichen Bildes wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: רַק
  choice: jedoch
  rationale: Hier schränkt das Wort die vorausgehende positive Aussage adversativ ein.
- source_word: בְּלֵבָב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: Die Wendung bezeichnet die fehlende Ganzheit oder Vollständigkeit der inneren Hingabe. „Ungeteilt“ vermittelt dies im Deutschen natürlich, ohne Sündlosigkeit zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. Die Wiedergabe als „Jahwe“ wahrt seinen Charakter als Eigenname.
- issue: Art der unvollständigen Hingabe Amazjas
  choice: nicht mit ungeteiltem Herzen
  alternative: nicht mit vollkommenem Herzen / nicht von ganzem Herzen
  rationale: Die Übersetzung bewahrt die Spannung zwischen äußerlich richtigem Handeln und nicht vollständiger innerer Hingabe, ohne stärkere Motive wie Heuchelei in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute hebräische Metapher „in den Augen“ bleibt erhalten; „ungeteiltes Herz“ gibt die innere, aber unvollständige Hingabe klar wieder.
