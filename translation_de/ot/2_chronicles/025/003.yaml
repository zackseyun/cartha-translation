  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: de
  text: Als seine Herrschaft gefestigt war[a], tötete er seine Diener, die seinen Vater, den König, erschlagen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Als er seine Herrschaft fest unter seiner Kontrolle hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die Erzählformel leitet den Zeitpunkt des folgenden Geschehens ein; im modernen Deutschen gibt „Als“ dies natürlich und ohne einen nicht ausdrücklich vorhandenen Diskursmarker wieder.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: seine Herrschaft fest in seiner Hand war
  rationale: ממלכה kann hier Reich, Königtum oder Herrschaft bezeichnen. Im Zusammenhang geht es um die Festigung der königlichen Gewalt. „Fest in seiner Hand“ bewahrt das konkrete Herrschaftsbild und klingt im Deutschen idiomatisch.
- source_word: וַיַּהֲרֹג
  choice: ließ er ... töten
  rationale: הרג bedeutet töten. Da ein König die Hinrichtung seiner Diener üblicherweise anordnet und nicht zwingend eigenhändig vollzieht, gibt die deutsche Kausativform die Handlung natürlich wieder, ohne die Verantwortung des Königs abzuschwächen.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד bezeichnet im königlichen Umfeld Menschen im Dienst des Königs; „Diener“ wahrt die Breite des Ausdrucks besser als das engere „Beamte“ oder das statusbetonte „Sklaven“.
- source_word: הַמַּכִּים
  choice: die ... erschlagen hatten
  rationale: Das Partizip von נכה bezeichnet hier diejenigen, die den Vater getötet hatten. „Erschlagen“ bewahrt die gewaltsame Nuance und vermeidet die unmittelbare Wiederholung von „töten“.
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: seinen Vater, den König
  rationale: Die Apposition wird in natürlicher deutscher Wortfolge wiedergegeben; sowohl die Vaterbeziehung als auch der königliche Rang bleiben ausdrücklich erhalten.
