base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: de
  text: 'Doch deren Söhne ließ er nicht töten, denn wie im Gesetz, im Buch des Mose, geschrieben steht, das Jahwe geboten hat: »Väter sollen nicht für ihre Söhne getötet werden und Söhne nicht für ihre Väter, sondern jeder soll für seine eigene Sünde sterben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם לֹא הֵמִית
  choice: Doch deren Söhne ließ er nicht töten
  rationale: Das einleitende וְ setzt die Handlung in Kontrast zur Hinrichtung der Attentäter im vorigen Vers. בְּנֵיהֶם bezeichnet ausdrücklich deren Söhne; der Hifil von מות wird kausativ und im gerichtlichen Zusammenhang mit »töten lassen« wiedergegeben.
- source_word: כִּי כַכָּתוּב
  choice: denn so steht ... geschrieben
  rationale: Die Formulierung führt die schriftliche Begründung für Amazjas Vorgehen ein und klingt im Deutschen natürlich, ohne den kausalen Zusammenhang aufzugeben.
- source_word: בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: im Gesetz, im Buch Moses
  rationale: »Gesetz« gibt תּוֹרָה in diesem rechtlichen Schriftzitat verständlich wieder; die appositionelle Wendung »im Buch Moses« bleibt erhalten.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: in dem Jahwe geboten hat
  rationale: Der Relativsatz wird auf das Buch Moses bezogen; der Doppelpunkt übernimmt im Deutschen die Funktion der hebräischen Zitateinleitung לֵאמֹר.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: Väter sollen nicht für ihre Söhne getötet werden und Söhne nicht für ihre Väter
  rationale: Die gerichtliche Bedeutung des rechtlichen Verbots wird mit »getötet werden« verdeutlicht. עַל bezeichnet hier die Haftung für das Vergehen eines anderen und wird mit »für« wiedergegeben; die parallele Satzform bleibt gewahrt.
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: vielmehr soll jeder für seine eigene Sünde sterben
  rationale: אִישׁ hat distributiven Sinn, den »jeder« idiomatisch ausdrückt. Das formal pluralische Verb bezieht sich sinngemäß auf die einzelnen Personen; »seine eigene Sünde« bewahrt die persönliche Verantwortlichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Persönliche Verantwortung im angeführten Gesetz
  choice: Jeder stirbt für seine eigene Sünde
  alternative: Jeder wird für seine eigene Sünde hingerichtet
  rationale: Die Schlussklausel verwendet מות ohne kausative Form. Daher bleibt »sterben« stehen; zugleich wird durch den Kontext die rechtliche Anwendung erkennbar, ohne die Aussage enger festzulegen als der hebräische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Rechtszitat, wird jedoch durch einen Doppelpunkt und natürliche deutsche Wortstellung lesbar gehalten. »Söhne« und »Väter« bewahren die konkreten Verwandtschaftsbezeichnungen des Ausgangstextes.
