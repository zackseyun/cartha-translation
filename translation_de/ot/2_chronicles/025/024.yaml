base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: de
  text: Er nahm alles Gold und Silber und alle Geräte, die sich im Haus Gottes bei Obed-Edom[a] befanden, dazu die Schätze des Königshauses und die Geiseln[b]. Dann kehrte er nach Samaria zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter der Obhut Obed-Edoms“; wörtlich steht im Hebräischen „bei Obed-Edom“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die Söhne der Bürgschaften“; gemeint sind wahrscheinlich Menschen, die als Sicherheit festgehalten wurden, also Geiseln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַזָּהָב וְהַכֶּסֶף
  choice: alles Gold und Silber
  rationale: Bewahrt die umfassende Aussage von כָל und nennt beide Edelmetalle; im Deutschen ist die artikellose Verbindung natürlich.
- source_word: כָל הַכֵּלִים
  choice: alle Geräte
  rationale: כֵּלִים bezeichnet allgemein Gegenstände, Geräte oder Gefäße. „Geräte“ ist im Zusammenhang des Gotteshauses verständlich und hinreichend weit.
- source_word: הַנִּמְצְאִים
  choice: die sich … befanden
  rationale: Das Partizip bezeichnet hier die dort vorhandenen Gegenstände; die Formulierung ist im Deutschen natürlicher als „die gefunden wurden“.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Gibt die hebräische Wendung formal nah wieder, ohne sie interpretierend durch „Tempel“ zu ersetzen.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: bei Obed-Edom
  rationale: עִם bedeutet wörtlich „mit/bei“. „Bei“ wahrt die knappe räumlich-assoziative Formulierung; die mögliche Bedeutung der Verwahrung wird in einer Fußnote genannt.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: die Schätze des Königshauses
  rationale: אֹצְרוֹת kann Schätze oder Schatzkammern bezeichnen. Da er Beute mitnimmt, passt „Schätze“; „Königshaus“ hält die Bildsprache des Hebräischen fest.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: die Geiseln
  rationale: Die schwierige Wendung bedeutet wörtlich etwa „Söhne der Bürgschaften/Pfänder“ und bezeichnet wahrscheinlich Menschen, die als Sicherheit festgehalten wurden.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: Dann kehrte er nach Samaria zurück
  rationale: Die Wayyiqtol-Form führt die Erzählung fort. Das im Deutschen nötige Subjekt wird aus dem Zusammenhang ergänzt.
theological_decisions:
- issue: Funktion Obed-Edoms bei den Tempelgeräten
  choice: Die mehrdeutige Orts- bzw. Zuordnungsangabe „bei Obed-Edom“ bleibt im Haupttext erhalten.
  alternative: „unter der Obhut Obed-Edoms“
  rationale: Der hebräische Text nennt mit עִם zunächst nur ein Bei-/Mitverhältnis; eine ausdrückliche Verwahrungsfunktion wäre plausibel, aber stärker deutend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tempelsprache bleibt quellennah, während die schwierige Geiselbezeichnung im Haupttext verständlich und in der Fußnote transparent wiedergegeben wird. Der im hebräischen Vers elliptisch vorausgesetzte Vorgang des Nehmens wird aus dem unmittelbaren Erzählzusammenhang ergänzt.
