source:
  edition: WLC
  text: וַ/יַּ֨עַל יוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: de
  text: Da zog Joasch, der König von Israel, hinauf, und er und Amazja, der König von Juda, traten einander bei Bet-Schemesch gegenüber, das zu Juda gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: עלה bezeichnet in der Erzählung das Hinaufziehen. „Zog hinauf“ bewahrt die räumliche Ausdrucksweise des Hebräischen und lässt zugleich den militärischen Zusammenhang erkennen, ohne ihn stärker auszudeuten.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: traten einander gegenüber
  rationale: Die Wendung bedeutet wörtlich etwa „sie sahen [einander ins] Gesicht“. Im Kampfzusammenhang gibt „traten einander gegenüber“ die persönliche Konfrontation natürlich und präzise wieder.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: er und Amazja
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und hebt beide beteiligten Könige hervor; der Bezug von „er“ auf Joasch ist unmittelbar klar.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: bei Bet-Schemesch
  rationale: Die Präposition bezeichnet hier den Ort der Begegnung. „Bei“ ist im Deutschen für eine militärische Konfrontation an einem Ort idiomatisch.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: das zu Juda gehört
  rationale: Die Konstruktion mit ל drückt territoriale Zugehörigkeit aus. Diese Wiedergabe erhält mehr als die bloße Ortsangabe „in Juda“.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: der König von Israel / der König von Juda
  rationale: Die Königstitel werden unmittelbar und in üblichem modernem Deutsch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen den im Deutschen geläufigen biblischen Formen Joasch, Amazja und Bet-Schemesch. Der Satzbau bleibt nahe am hebräischen Erzählfluss, ohne unnatürlich zu wirken.
