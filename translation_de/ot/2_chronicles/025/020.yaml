  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: de
  text: Doch Amazja hörte nicht darauf, denn dies kam von Gott, um sie in die Gewalt ihrer Feinde[a] zu geben, weil sie die Götter Edoms gesucht hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in eine Hand“. Die hebräische Wendung bedeutet, in die Gewalt eines anderen ausgeliefert zu werden; „ihrer Feinde“ ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hörte nicht darauf
  rationale: Das Verb bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten einer Warnung. „Darauf hören“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: dies kam von Gott
  rationale: Das feminine Pronomen verweist wahrscheinlich auf den geschilderten Vorgang beziehungsweise Amazjas Weigerung. Die Formulierung wahrt die ausdrückliche göttliche Verursachung, ohne den Bezug enger festzulegen.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die deutsche Zweckkonstruktion gibt die finale Bedeutung knapp und eindeutig wieder.
- source_word: תִּתָּם בְּיָד
  choice: sie in die Gewalt ihrer Feinde zu geben
  rationale: Die Wendung mit „Hand“ bezeichnet die Auslieferung in die Macht eines anderen. „Gewalt“ vermittelt das hebräische Bild idiomatisch; „ihrer Feinde“ wird aus dem unmittelbaren Erzählzusammenhang ergänzt und in der Fußnote kenntlich gemacht.
- source_word: דָרְשׁוּ
  choice: gesucht hatten
  rationale: דרשׁ bezeichnet bei einer Gottheit das religiöse Suchen oder Sich-an-sie-Wenden. „Gesucht“ bleibt bewusst weit und bewahrt die Mehrdeutigkeit.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: die Götter Edoms
  rationale: Die Genitivverbindung gibt die edomitischen Gottheiten klar und würdig wieder.
theological_decisions:
- issue: Göttliche Verursachung von Amazjas Weigerung und Niederlage
  choice: Der Text sagt ausdrücklich, dass Amazjas Nicht-Hören von Gott kam und auf ihre Auslieferung zielte.
  alternative: Die Aussage als bloße göttliche Zulassung abschwächen.
  rationale: מֵהָאֱלֹהִים und לְמַעַן drücken göttliche Herkunft und Zweck aus. Die Übersetzung erhält diese theologische Spannung, ohne sie durch eine zusätzliche Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hörte nicht darauf“ ist verständlich und bringt das Nichtbeachten der Warnung zum Ausdruck. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen schwerfällig zu wirken.
