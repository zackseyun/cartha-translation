  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: de
  text: Amazja versammelte Juda und gliederte die Männer nach ihren Großfamilien; in ganz Juda und Benjamin unterstellte er sie den Obersten über Tausend und den Obersten über Hundert. Dann musterte er sie, von zwanzig Jahren an aufwärts, und stellte fest, dass es 300.000 ausgewählte Männer[a] waren, die zum Kriegsdienst auszogen[b] und Speer und Langschild[c] trugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „junge Männer“. Das hebräische Wort בָּחוּר kann das Alter bezeichnen, in diesem militärischen Zusammenhang aber auch ausgesuchte oder besonders geeignete Männer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die zum Heer auszogen“; eine hebräische Wendung für Männer, die zum Kriegsdienst bereit oder dafür eingeteilt waren.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische צִנָּה bezeichnet einen großen Schild, der einen beträchtlichen Teil des Körpers deckte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: קבץ bezeichnet das Sammeln oder Zusammenrufen von Menschen; „versammelte“ ist im militärisch-administrativen Zusammenhang natürlich und quellennah.
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: gliederte die Männer nach ihren Großfamilien
  rationale: Die Hifilform von עמד bedeutet hier, die Männer geordnet aufzustellen beziehungsweise einzugliedern. בֵּית אָבוֹת bezeichnet väterliche Sippen- oder Großfamilienverbände; „Großfamilien“ vermittelt diese soziale Einheit verständlicher als das wörtliche „Vaterhäuser“.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: unterstellte er sie den Obersten über Tausend und den Obersten über Hundert
  rationale: שׂרים sind hier militärische Befehlshaber. Die traditionelle Größenbezeichnung bleibt erhalten, ohne vorauszusetzen, dass jede Einheit stets exakt diese Mannzahl hatte.
- source_word: לְכָל יְהוּדָה וּבִנְיָמִן
  choice: in ganz Juda und Benjamin
  rationale: Die Präposition mit כָּל bezeichnet hier den umfassenden Geltungsbereich der organisatorischen Einteilung.
- source_word: וַיִּפְקְדֵם
  choice: musterte er sie
  rationale: פקד bezeichnet in diesem militärischen Kontext eine Erfassung und Überprüfung der dienstfähigen Männer; „mustern“ gibt beides knapp wieder.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Die übliche Altersformel und ihre untere Grenze werden eng am Hebräischen wiedergegeben.
- source_word: וַיִּמְצָאֵם שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: Es fanden sich 300.000
  rationale: מצא führt hier das Ergebnis der Musterung ein. Die unpersönliche deutsche Formulierung ist natürlich und bewahrt den Befundcharakter.
- source_word: בָּחוּר
  choice: ausgewählte Männer
  rationale: בָּחוּר kann sowohl einen jungen Mann als auch einen ausgesuchten beziehungsweise besonders geeigneten Mann bezeichnen. Im Zusammenhang der Heeresmusterung ist „ausgewählte Männer“ plausibel, während die mögliche Altersnuance in einer Fußnote erhalten bleibt.
- source_word: יוֹצֵא צָבָא
  choice: die zum Kriegsdienst auszogen
  rationale: Die Formulierung bedeutet wörtlich „zum Heer/Krieg hinausziehend“ und ist eine militärische Dienstformel. Die Übersetzung erhält das Bild des Ausziehens, verdeutlicht aber dessen idiomatische Funktion.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: Speer und Langschild führen konnten
  rationale: אחז heißt wörtlich „ergreifen/halten“, bezeichnet hier aber die Fähigkeit, die Waffen zu führen. צִנָּה ist ein großer Schild und wird daher spezifischer mit „Langschild“ übersetzt.
