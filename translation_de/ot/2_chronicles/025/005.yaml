translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher militärischer Terminologie. „Großfamilien“ vermeidet das im heutigen Deutsch missverständliche „Vaterhäuser“. Die Satzgliederung löst die lange hebräische Kette behutsam auf, ohne Informationen zu verschieben. Die Partizipialfolge am Versende wird idiomatisch als Relativsatz wiedergegeben.
