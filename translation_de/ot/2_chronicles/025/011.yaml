base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: de
  text: Da machte Amazja sich stark, führte sein Volk und zog ins Salztal. Dort schlug er zehntausend Söhne Seïrs[a] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leute/Nachkommen Seïrs“. Wörtlich steht im Hebräischen „Söhne Seïrs“, eine ethnisch-genealogische Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: machte sich stark
  rationale: Die reflexive Bedeutung des Hitpael wird bewahrt, ohne sie enger als bloßen Mut oder militärische Stärke auszulegen.
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: führte sein Volk
  rationale: Im militärischen Zusammenhang bezeichnet נהג hier das Führen oder Leiten; die deutsche Form bleibt klar, ohne eine bestimmte Truppenordnung vorauszusetzen.
- source_word: גֵּיא הַמֶּלַח
  choice: Salztal
  rationale: Die geläufige, knappe deutsche Wiedergabe des Ortsnamens gibt beide hebräischen Bestandteile wieder.
- source_word: וַיַּךְ
  choice: schlug … nieder
  rationale: Die Formulierung entspricht der militärischen Bedeutung von נכה und lässt die im Verb mögliche Spannung zwischen Besiegen und Töten bestehen.
- source_word: בְּנֵי שֵׂעִיר
  choice: Söhne Seïrs
  rationale: Die ethnisch-genealogische Ausdrucksweise des Hebräischen wird erhalten; eine Fußnote erläutert die gemeinte Personengruppe.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: zehntausend
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Zahlphrase.
- source_word: וַאֲמַצְיָהוּ
  choice: Da … Amazja
  rationale: „Da“ gibt die fortlaufende Erzählfolge des Waw natürlich wieder.
