base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: de
  text: Doch die Männer der Truppe, die Amazja davon zurückgeschickt hatte, mit ihm in den Krieg zu ziehen, überfielen die Städte Judas von Samaria bis Bet-Horon. Sie erschlugen[a] dreitausend von ihnen und machten reiche Beute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Wortlaut: »Sie schlugen dreitausend von ihnen nieder.« Im Zusammenhang ist ein tödlicher Ausgang gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: die Männer der Truppe
  rationale: Die wörtliche Wendung »Söhne der Truppe« bezeichnet idiomatisch die Angehörigen eines militärischen Verbandes. »Männer der Truppe« gibt diesen Sinn natürlich und sachlich wieder.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: die Amazja zurückgeschickt hatte
  rationale: Der Hifil von שוב bedeutet hier, dass Amazja die Truppe zur Rückkehr veranlasste beziehungsweise entließ.
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: sodass sie nicht mit ihm in den Krieg zogen
  rationale: Die deutsche Folgekonstruktion gibt verständlich wieder, dass Amazjas Zurückschicken ihre Teilnahme am Feldzug verhinderte.
- source_word: וַיִּפְשְׁטוּ
  choice: überfielen
  rationale: פשט bezeichnet in militärischem Zusammenhang einen feindlichen Einfall oder Raubzug. »Überfielen« passt zur anschließenden Tötung und Plünderung.
- source_word: בְּעָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: עָרִים kann Städte oder Ortschaften bezeichnen; »Städte« ist hier eine klare und traditionsnahe Wiedergabe.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: von Samaria bis Bet-Horon
  rationale: Die Konstruktion מן ... ועד kennzeichnet die räumliche Ausdehnung des Überfalls. Die Ortsnamen werden in geläufiger deutscher Form wiedergegeben.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: Sie erschlugen dreitausend von ihnen
  rationale: נכה bedeutet grundsätzlich »schlagen«, bezeichnet in einem militärischen Überfall mit zahlenmäßiger Opferangabe jedoch naheliegend tödliches Niederschlagen. »Von ihnen« bewahrt den Rückbezug des hebräischen Textes, dessen gemeinte Einwohner nur implizit sind.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: und machten reiche Beute
  rationale: Die hebräische Verbindung aus Verb und stammverwandtem Substantiv verstärkt den Gedanken des Plünderns. Die deutsche feste Wendung gibt dies natürlich wieder.
