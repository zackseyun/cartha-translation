base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: de
  text: 'Du hast gesagt: »Sieh, du hast Edom geschlagen, und dein Herz hat dich erhoben, damit du Ruhm erlangst.[a]« Bleib jetzt zu Hause! Warum forderst du Unheil heraus, sodass du zu Fall kommst – du und Juda mit dir?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und dein Herz hat dich erhoben, um dich zu rühmen«; möglich ist auch: »und dein Herz hat dich stolz gemacht, damit du dich selbst verherrlichst«. Der hebräische Ausdruck beschreibt eine Selbsterhöhung nach einem Sieg; die genaue Nuance von Ruhm, Ehre oder Prahlen ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Du hast gesagt
  rationale: Das Qal-Perfekt 2. Person Singular leitet die wiedergegebene Haltung beziehungsweise Aussage ein; das deutsche Perfekt ist in heutiger Sprache natürlich.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel setzt einen nachdrücklichen Akzent; »Sieh« bewahrt diesen, ohne altertümlich zu wirken.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: du hast Edom geschlagen
  rationale: Die Form von נכה bezeichnet hier militärisches Schlagen beziehungsweise Besiegen. »Geschlagen« wahrt sowohl die Nähe zum Hebräischen als auch den militärischen Sinn.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: dein Herz hat dich überheblich gemacht
  rationale: Die wörtliche Metapher vom Herzen, das jemanden erhebt, bezeichnet im Kontext den nach dem Sieg entstandenen Hochmut. Die Formulierung ist im modernen Deutschen klar und bewahrt das Herz als handelndes Subjekt.
- source_word: לְהַכְבִּיד
  choice: sodass du dich rühmst
  rationale: Der Infinitiv von כבד kann hier Ruhm, Ehre oder Selbstverherrlichung ausdrücken. Im tadelnden Zusammenhang gibt »sich rühmen« die Folge des überheblichen Herzens natürlich wieder, ohne die Mehrdeutigkeit ganz zu verdecken.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Bleib jetzt zu Hause!
  rationale: Der Imperativ mit »in deinem Haus« fordert idiomatisch dazu auf, daheim zu bleiben und nicht in den Krieg zu ziehen.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Warum willst du Unheil heraufbeschwören
  rationale: Das Hitpael von גרה bezeichnet das Anfachen oder Provozieren einer Auseinandersetzung; רעה meint hier deren verhängnisvolle Folge. »Unheil heraufbeschwören« bildet die Warnung idiomatisch ab.
- source_word: וְנָפַלְתָּ
  choice: sodass du zu Fall kommst
  rationale: Das Perfekt mit ו beschreibt nach der rhetorischen Frage die drohende Folge. »Zu Fall kommen« passt sowohl zur militärischen Niederlage als auch zum persönlichen Sturz.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: du und Juda mit dir
  rationale: Die knappe Form bewahrt den Nachdruck darauf, dass der König mit seinem Handeln auch Juda ins Verderben zieht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Warnung bleibt knapp und eindringlich; die ungewöhnliche Verbindung von erhobenem Herzen, Ruhm und Ehre wird im Haupttext verständlich wiedergegeben und in der Fußnote in ihrer lexikalischen Spannweite offengehalten.
