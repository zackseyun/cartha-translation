source:
  edition: WLC
  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: de
  text: 'Da beriet sich Amazja, der König von Juda. Dann sandte er zu Joasch, dem Sohn des Joahas, des Sohnes Jehus, dem König von Israel, und ließ ihm sagen: »Komm, wir wollen einander gegenübertreten!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Wir wollen einander ins Angesicht sehen.“ Die hebräische Wendung kann eine persönliche Begegnung bezeichnen und hat hier wahrscheinlich den Sinn einer direkten Konfrontation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Da beriet sich Amazja
  rationale: Der Niphal von יעץ bezeichnet hier ein Beraten oder Abwägen vor dem Handeln. „Beriet sich“ bewahrt diesen Vorgang, ohne ausdrücklich Ratgeber einzuführen, die im Hebräischen nicht genannt werden.
- source_word: וַיִּשְׁלַח אֶל
  choice: Dann sandte er zu
  rationale: Die schlichte Formulierung folgt dem hebräischen „sandte zu“. Boten oder eine Botschaft sind sachlich vorausgesetzt, werden aber nicht ausdrücklich in den Text eingefügt.
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Joasch, dem Sohn des Joahas, des Sohnes Jehus, dem König von Israel
  rationale: Die vollständige Abstammungsangabe und der Königstitel werden beibehalten. Die deutschen Namensformen entsprechen dem geläufigen bibeldeutschen Gebrauch.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die deutsche Erzählform gibt die hebräische Einleitung direkter Rede natürlich wieder. Das Pronomen „ihm“ macht lediglich den bereits genannten Empfänger im Deutschen deutlich.
- source_word: לְךָ
  choice: Komm
  rationale: Der Imperativ leitet hier eine herausfordernde Aufforderung ein; „Komm“ ist knapp und im Deutschen idiomatisch.
- source_word: נִתְרָאֶה פָנִים
  choice: wir wollen einander gegenübertreten
  rationale: Die Wendung spricht wörtlich vom gegenseitigen Sehen des Angesichts, bezeichnet im Zusammenhang aber eine direkte Begegnung mit konfrontativem Unterton. „Einander gegenübertreten“ wahrt diesen Sinn in natürlichem Deutsch; die Bildsprache wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung nach dem ersten Teilsatz entlastet die lange hebräische Satzfolge, ohne ihre zeitliche Abfolge zu verändern. Die direkte Rede ist bewusst knapp und herausfordernd formuliert.
