base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: de
  text: 'Da sandte Joasch, der König von Israel, Amazja, dem König von Juda, folgende Botschaft: »Der Dornstrauch[a] im Libanon sandte der Zeder im Libanon die Botschaft: ›Gib meinem Sohn deine Tochter zur Frau!‹ Da zog ein wildes Tier des Feldes im Libanon vorbei und zertrat den Dornstrauch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Distel« oder »Dornengestrüpp«. Das hebräische Wort bezeichnet eine dornige Pflanze; die genaue Art ist ungewiss.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: der Dornstrauch
  rationale: חוֹחַ bezeichnet eine dornige Pflanze, deren genaue Art ungewiss ist. »Dornstrauch« ist im modernen Deutschen natürlich und bewahrt den Gegensatz zur hohen, mächtigen Zeder.
- source_word: הָאֶרֶז
  choice: die Zeder
  rationale: אֶרֶז bezeichnet hier eindeutig die Zeder und trägt das Bild von Größe und Stärke.
- source_word: בַּלְּבָנוֹן
  choice: im Libanon
  rationale: Die Ortsangabe bezieht sich auf die Pflanzen und das Tier; »im Libanon« ist idiomatisch und quellennah.
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: sandte ... folgende Botschaft
  rationale: Im Deutschen macht diese Wiedergabe das im Hebräischen implizite Nachrichtenobjekt verständlich, ohne den Inhalt auszuweiten.
- source_word: שָׁלַח ... לֵאמֹר
  choice: sandte ... und ließ ihr sagen
  rationale: Die Formulierung bewahrt den wiederholten Sendungs- und Redevorgang innerhalb des Gleichnisses und klingt zugleich natürlich.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Gib meinem Sohn deine Tochter zur Frau
  rationale: Die deutsche Wortstellung ist natürlich und gibt die Formel für eine Heiratsverbindung präzise wieder.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ein wildes Tier
  rationale: Die Wendung bezeichnet allgemein ein wild lebendes Landtier. »Ein wildes Tier« ist klar und vermeidet das heute unnatürliche »Tier des Feldes«.
- source_word: וַתַּעֲבֹר
  choice: kam ... vorbei
  rationale: Die Formulierung gibt die beiläufige Vorüberbewegung im Kontext natürlich wieder.
- source_word: וַתִּרְמֹס
  choice: zertrat
  rationale: רמס bezeichnet das Niedertreten mit den Füßen; »zertrat« ist knapp und anschaulich.
