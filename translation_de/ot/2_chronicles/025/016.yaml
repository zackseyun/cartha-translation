base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: de
  text: 'Während er noch zu ihm redete, sagte der König zu ihm: „Haben wir dich zum Berater des Königs eingesetzt?[a] Hör auf! Warum sollten sie dich schlagen?[b]“ Da hörte der Prophet auf und sagte: „Ich weiß, dass Gott beschlossen hat,[c] dich zu vernichten, weil du das getan und nicht auf meinen Rat gehört hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haben wir dich zum Ratgeber des Königs gemacht?“'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt die Handelnden nur durch eine unbestimmte Mehrzahl; wahrscheinlich sind diejenigen gemeint, die auf Befehl des Königs gegen ihn vorgehen würden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „dass Gott geplant hat, dich zu vernichten.“ Das hebräische Verb bezeichnet eigentlich das Beraten, Planen oder Beschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Haben wir dich zum Berater des Königs eingesetzt?
  rationale: Die Konstruktion wird als rhetorische Frage mit interrogativem הֲ verstanden. „Eingesetzt“ gibt נתן in diesem Amtskontext natürlich wieder; „Berater des Königs“ ist klares, modernes Deutsch.
- source_word: חֲדַל
  choice: Hör auf!
  rationale: Der knappe Imperativ beendet unmittelbar die Rede des Propheten und bewahrt den schroffen Ton.
- source_word: לָמָּה יַכּוּךָ
  choice: Warum sollen sie dich erschlagen?
  rationale: Die unbestimmte dritte Person Plural bleibt durch „sie“ erhalten. „Erschlagen“ vermittelt in diesem Drohkontext die mögliche tödliche Gewalt von נכה, ohne die Handelnden näher zu bestimmen.
- source_word: יָעַץ אֱלֹהִים
  choice: Gott beschlossen hat
  rationale: יעץ bezeichnet Rat, Planen oder Beschließen. Mit Gott als Subjekt und dem folgenden Vernichtungsziel gibt „beschlossen“ die feste göttliche Absicht idiomatisch wieder, während eine Fußnote die Planungsmetapher offenhält.
- source_word: לְהַשְׁחִיתֶךָ
  choice: dich zu vernichten
  rationale: Der Hifil-Infinitiv von שׁחת bezeichnet hier das Herbeiführen von Verderben oder Vernichtung; „vernichten“ ist direkt und würdevoll.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: und nicht auf meinen Rat gehört hast
  rationale: Die Wendung wahrt sowohl den Sinn des Hörens als auch den des Befolgens und greift mit „Rat“ das Wortfeld von יעץ und עצה auf.
theological_decisions:
- issue: Gottes Absicht in יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Gott beschlossen hat, dich zu vernichten
  alternative: Gott geplant hat, dich zu vernichten
  rationale: Der Text stellt Gottes Vernichtungsgericht als feststehende Absicht dar. Die Übersetzung lässt diese theologische Spannung bestehen und schwächt sie nicht ab; die alternative Wiedergabe des Beratungs- und Planungsverbs wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und scharf. Die im Hebräischen unbestimmte Mehrzahl bei der Drohung sowie das Bedeutungsfeld von יעץ werden nicht stillschweigend vereindeutigt.
