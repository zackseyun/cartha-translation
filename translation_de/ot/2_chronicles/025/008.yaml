source:
  edition: WLC
  text: כִּ֚י אִם בֹּ֣א אַתָּ֔ה עֲשֵׂ֖ה חֲזַ֣ק לַ/מִּלְחָמָ֑ה יַכְשִֽׁילְ/ךָ֤ הָֽ/אֱלֹהִים֙ לִ/פְנֵ֣י אוֹיֵ֔ב כִּ֥י יֶשׁ כֹּ֛חַ בֵּ/אלֹהִ֖ים לַ/עְז֥וֹר וּ/לְ/הַכְשִֽׁיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: de
  text: Doch wenn du wirklich hingehst, dann handle entschlossen im Kampf! Gott wird dich vor dem Feind zu Fall bringen[a]; denn Gott hat die Macht, zu helfen und zu Fall zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht hier dasselbe Verb wie am Versende: Gott hat die Macht, sowohl „zu helfen“ als auch „zu Fall zu bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch wenn
  rationale: Die Partikelverbindung führt einen bedingten Gegensatz zur vorausgehenden Weisung ein.
- source_word: בֹּא אַתָּה
  choice: du wirklich hingehst
  rationale: Das ausdrückliche Pronomen verstärkt die Anrede; „wirklich“ gibt diese Hervorhebung in natürlichem Deutsch wieder.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: dann handle entschlossen im Kampf
  rationale: Die ungewöhnliche Verbindung von „tun“ und „stark“ ist eine Aufforderung zu entschlossenem Handeln; „im Kampf“ gibt den militärischen Bezug idiomatisch wieder.
- source_word: יַכְשִׁילְךָ
  choice: wird dich … zu Fall bringen
  rationale: Der Hifil von כשל bezeichnet das Verursachen von Straucheln oder Fallen. „Zu Fall bringen“ ist im militärischen Zusammenhang natürlich und lässt sich bei der Wiederholung desselben Stammes beibehalten.
- source_word: לִפְנֵי אוֹיֵב
  choice: vor dem Feind
  rationale: Die Wendung bezeichnet eine Niederlage in der Gegenwart beziehungsweise angesichts des Feindes.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: Gott hat die Macht
  rationale: Diese deutsche Konstruktion gibt den Sinn des hebräischen Existenzsatzes klar und natürlich wieder, ohne die Aussage abzuschwächen.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: zu helfen und zu Fall zu bringen
  rationale: Die parallelen Infinitive bleiben erhalten; „zu Fall bringen“ wiederholt bewusst die Wiedergabe von יַכְשִׁילְךָ.
theological_decisions:
- issue: Göttliches Handeln bei einer militärischen Niederlage
  choice: Gott wird direkt als derjenige bezeichnet, der zu Fall bringt.
  alternative: Die Niederlage nur als von Gott zugelassen oder indirekt verursacht darzustellen.
  rationale: Der hebräische Text formuliert Gottes Verursachung ausdrücklich und stellt seine Macht zu helfen seiner Macht, zu Fall zu bringen, gegenüber. Diese Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausrufesatz bewahrt den nachdrücklichen Aufforderungscharakter; die direkte Aussage über Gottes Handeln bleibt unverändert stark.
