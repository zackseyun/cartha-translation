  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: de
  text: Joasch, der König von Israel, nahm Amazja, den König von Juda, den Sohn Joaschs und Enkel des Joahas, bei Bet-Schemesch gefangen und brachte ihn nach Jerusalem. Dann riss er die Mauer Jerusalems vom Ephraimtor bis zum Ecktor[a] auf einer Länge von vierhundert Ellen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis zu dem Tor, das sich wendet“ oder „das zugewandt ist“. „Ecktor“ folgt der wahrscheinlichen Identifizierung mit dem so bezeichneten Tor im Parallelbericht in 2. Könige 14,13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: nahm … gefangen
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang das Ergreifen beziehungsweise Gefangennehmen einer Person. Die deutsche Wendung ist klar und idiomatisch.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: bei Bet-Schemesch
  rationale: Die Präposition ב bezeichnet hier den Ort der Gefangennahme. „Bei“ lässt sowohl den Ort selbst als auch dessen unmittelbare Umgebung offen.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: den Sohn Joaschs und Enkel des Joahas
  rationale: Die beiden Abstammungsglieder werden vollständig bewahrt; „Enkel“ gibt die Beziehung im natürlichen modernen Deutsch eindeutig wieder.
- source_word: וַיְבִיאֵהוּ
  choice: brachte ihn
  rationale: Der Hifil von בוא bedeutet gewöhnlich „bringen“; die Wiedergabe spezifiziert die Art der Überführung nicht unnötig.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: riss er die Mauer Jerusalems … nieder
  rationale: פרץ bezeichnet hier das Aufbrechen beziehungsweise Niederreißen eines Mauerabschnitts. Die Formulierung ist im Deutschen natürlich und entspricht dem militärischen Kontext.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: vom Ephraimtor bis zum Ecktor
  rationale: Das erste Tor ist als Eigenname klar. Beim zweiten ist der hebräische Ausdruck wörtlich ungewöhnlich („das sich wendende/zugewandte Tor“); „Ecktor“ folgt der wahrscheinlichen Identifizierung durch den Parallelbericht in 2. Könige 14,13, während die Unsicherheit in einer Fußnote erhalten bleibt.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: auf einer Länge von vierhundert Ellen
  rationale: Der hebräische Text nennt unmittelbar das Maß. Der Zusatz „auf einer Länge von“ macht im Deutschen klar, dass der niedergerissene Mauerabschnitt gemeint ist, ohne den Aussagegehalt zu verändern.
theological_decisions: []
