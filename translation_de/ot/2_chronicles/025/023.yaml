  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Erzählablauf, wird aber durch idiomatische deutsche Verwandtschafts- und Maßangaben geglättet. Die abweichende, schwer deutbare Torbezeichnung des Chroniktextes wird nicht verschwiegen, sondern in der Fußnote ausgewiesen.
