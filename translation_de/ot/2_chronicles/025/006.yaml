base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: de
  text: Und er heuerte aus Israel hunderttausend tapfere Krieger für hundert Talente Silber an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tüchtige Kämpfer“ oder „starke Krieger“. Der hebräische Ausdruck bezeichnet fähige und tapfere Männer für den Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: er warb … an
  rationale: Das Qal von שׂכר bezeichnet hier das Anwerben gegen Bezahlung. „Anwerben“ ist im militärischen Zusammenhang natürlich und vermeidet den interpretierenden Zusatz „Söldner“.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition מן bezeichnet Herkunft beziehungsweise Quelle; gemeint ist hier Israel, das Nordreich.
- source_word: מֵאָה אֶלֶף
  choice: hunderttausend
  rationale: Die Zahl wird direkt und idiomatisch wiedergegeben.
- source_word: גִּבּוֹר חָיִל
  choice: kampferprobte Krieger
  rationale: Die Wendung bezeichnet tüchtige, starke und tapfere Männer für den Kampf. Die gewählte Formulierung gibt die militärische Bedeutung in natürlichem modernem Deutsch wieder; mögliche Alternativen werden in der Fußnote genannt.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: für hundert Talente Silber
  rationale: ב bezeichnet hier den Preis beziehungsweise die Bezahlung. Die antike Maßeinheit „Talent“ bleibt erhalten, ohne eine unsichere moderne Umrechnung in den Haupttext einzutragen.
