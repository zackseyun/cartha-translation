base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: de
  text: Sind nicht die übrigen Taten Amazjas[a], von Anfang bis Ende, im Buch[b] der Könige von Juda und Israel aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Worte/Angelegenheiten Amazjas“; in dieser Geschichtsformel sind damit seine Taten und die Ereignisse seiner Regierungszeit gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch wörtlich „auf dem Buch“; dem deutschen Sprachgebrauch entsprechend steht im Text „im Buch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: Die übrigen Taten Amazjas
  rationale: יֶתֶר bezeichnet das Übrige beziehungsweise den verbleibenden Stoff. דִּבְרֵי bedeutet wörtlich „Worte“ oder „Angelegenheiten“, bezeichnet in dieser königlichen Schlussformel aber die Taten und Ereignisse der Regierungszeit.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: von Anfang bis Ende
  rationale: Die Paarung „die ersten und die letzten“ umfasst den gesamten zeitlichen Verlauf. Die deutsche Wendung gibt diesen Sinn natürlich und prägnant wieder.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: sind sie nicht ... aufgeschrieben?
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. הִנָּם verstärkt die Aussage, ohne dass im Deutschen ein zusätzliches „siehe“ nötig ist.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: עַל heißt grundsätzlich „auf/über“, doch bei einem schriftlichen Quellenverweis ist „im Buch“ die natürliche deutsche Formulierung. סֵפֶר kann ein Buch beziehungsweise eine Schriftrolle oder schriftliche Aufzeichnung bezeichnen.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: der Könige von Juda und Israel
  rationale: Die Reihenfolge der beiden Reiche wird entsprechend dem Hebräischen bewahrt; die ganze Verbindung bezeichnet die angeführte königliche Geschichtsquelle.
