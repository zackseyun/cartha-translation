source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ אֲמַצְיָ֔הוּ וְ/עֶשְׂרִ֣ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְהוֹעַדָּ֖ן מִ/ירוּשָׁלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: de
  text: Amazja war fünfundzwanzig Jahre alt, als er König wurde,[a] und regierte neunundzwanzig Jahre in Jerusalem. Seine Mutter hieß Joaddan und stammte aus Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »war ein Sohn von fünfundzwanzig Jahren, als er König wurde«; gemeint ist sein Alter beim Regierungsantritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: war fünfundzwanzig Jahre alt
  rationale: Die wörtliche hebräische Wendung »ein Sohn von fünfundzwanzig Jahren« ist eine übliche Altersangabe; die gewählte Formulierung gibt sie in natürlichem modernem Deutsch wieder.
- source_word: מָלַךְ
  choice: als er König wurde
  rationale: Beim ersten Vorkommen bezeichnet das Verb im Zusammenhang mit der Altersformel den Regierungsantritt.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: regierte neunundzwanzig Jahre
  rationale: Beim zweiten Vorkommen bezeichnet מָלַךְ die Dauer der Königsherrschaft; »regierte« ist dafür die natürliche deutsche Wiedergabe.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ bezeichnet hier den Ort der Regierung.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die hebräische Namensformel wird knapp und idiomatisch wiedergegeben, ohne Bedeutungsverlust.
- source_word: יְהוֹעַדָּן
  choice: Joaddan
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen biblischen Namensform wiedergegeben.
- source_word: מִירוּשָׁלָיִם
  choice: stammte aus Jerusalem
  rationale: Die Präposition מִן bezeichnet Herkunft; die verbale Formulierung ist im Deutschen natürlicher als ein bloß nachgestelltes »aus Jerusalem«.
