source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲמַצְיָ֨הוּ֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וּ/מַֽה לַּ/עֲשׂוֹת֙ לִ/מְאַ֣ת הַ/כִּכָּ֔ר אֲשֶׁ֥ר נָתַ֖תִּי לִ/גְד֣וּד יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָֽ/אֱלֹהִ֔ים יֵ֚שׁ לַֽ/יהוָ֔ה לָ֥/תֶת לְ/ךָ֖ הַרְבֵּ֥ה מִ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: de
  text: 'Amazja sagte zu dem Mann Gottes: „Aber was soll mit den hundert Talenten[a] geschehen, die ich den Truppen Israels gegeben habe?“ Der Mann Gottes antwortete: „Jahwe kann dir viel mehr als das geben.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur „die hundert Talente“; nach dem vorherigen Vers sind Silbertalente gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Jahwe hat genug, um dir viel mehr als das zu geben.“ Die hebräische Wendung betont Jahwes Fähigkeit und seine Mittel, dir zu geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Bewahrt die geläufige hebräische Bezeichnung für einen von Gott beauftragten Boten, ohne seine Funktion enger als „Prophet“ festzulegen.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Aber was soll ... geschehen?
  rationale: Gibt die Frage nach dem nun nötigen Vorgehen idiomatisch wieder; „aber“ nimmt Amazjas Einwand im Kontext auf.
- source_word: מְאַת הַכִּכָּר
  choice: die hundert Talente
  rationale: כִּכָּר bezeichnet hier eine Gewichtseinheit. Dass es sich um Silber handelt, steht im vorherigen Vers und wird deshalb nur in der Fußnote erläutert.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: die Truppen Israels
  rationale: Passt natürlich zum Kontext der angeworbenen israelitischen Soldaten und bewahrt den kollektiven militärischen Sinn.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Jahwe kann dir ... geben
  rationale: Die hebräische Existenzkonstruktion betont Jahwes Fähigkeit beziehungsweise seine ausreichenden Mittel; die deutsche Formulierung gibt dies klar und idiomatisch wieder.
- source_word: הַרְבֵּה מִזֶּה
  choice: viel mehr als das
  rationale: Gibt den komparativen Sinn der Wendung knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Aussage der Konstruktion יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Jahwe kann dir viel mehr als das geben
  alternative: Jahwe hat genug, um dir viel mehr als das zu geben
  rationale: Beide Wiedergaben erfassen Jahwes Fähigkeit und Ressourcen. Der Haupttext formuliert idiomatisch, während die Fußnote die stärker ressourcenbezogene Lesart bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Talente“ bleibt als historische Gewichtseinheit stehen; die im Deutschen mögliche Verwechslung mit Begabungen wird durch Kontext und Fußnote begrenzt. Die direkte Rede ist flüssig formuliert, ohne die knappe hebräische Aussage auszudeuten.
