translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Gewalt des Ausgangstextes wird nicht abgeschwächt. Die hebräische parataktische Handlungsfolge bleibt erhalten; das Semikolon macht dabei keine über das einfache »und« hinausgehende Zweck- oder Folgerelation geltend.
