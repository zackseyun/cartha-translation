base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: de
  text: Die Männer von Juda nahmen zehntausend von ihnen lebend gefangen, brachten sie auf die Spitze der Felsenklippe[a] und warfen sie von der Spitze der Felsenklippe hinab; sie alle wurden zerschmettert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Felsens« beziehungsweise »des Felsgrats« (hebräisch selaʿ).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wurden gespalten« oder »wurden auseinandergebrochen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: nahmen … gefangen
  rationale: Das Verb bezeichnet hier im Zusammenhang mit חַיִּים die Gefangennahme im Krieg. Die deutsche Wendung ist natürlich und präzise.
- source_word: חַיִּים
  choice: lebend
  rationale: Das Wort wird prädikativ beziehungsweise adverbial gebraucht und besagt, dass die zehntausend nicht im Kampf getötet, sondern lebend gefangen genommen wurden.
- source_word: בְּנֵי יְהוּדָה
  choice: die Männer von Juda
  rationale: Wörtlich steht »Söhne Judas«. Im militärischen Erzählzusammenhang bezeichnet die Wendung die Männer beziehungsweise Krieger Judas; »Männer von Juda« ist im modernen Deutsch verständlich, ohne die Zugehörigkeit zu verwischen.
- source_word: וַיְבִיאוּם
  choice: Sie brachten sie
  rationale: Die Hifil-Form von בוא bedeutet gewöhnlich »bringen«. Der neue Satz bewahrt die Handlungsfolge und vermeidet eine schwerfällige Reihung.
- source_word: לְרֹאשׁ
  choice: auf die Spitze
  rationale: רֹאשׁ bedeutet bei einer Geländeformation idiomatisch deren Spitze oder höchsten Punkt.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: der Felsenklippe
  rationale: סֶלַע bezeichnet einen Felsen oder eine felsige Steilformation. Wegen des Hinabstürzens von ihrer Spitze gibt »Felsenklippe« die räumliche Vorstellung klar wieder, während die Fußnote die allgemeineren Alternativen wahrt.
- source_word: וַיַּשְׁלִיכוּם מֵרֹאשׁ הַסֶּלַע
  choice: stürzten sie von dort hinab
  rationale: שלך bedeutet »werfen« oder »schleudern«. »Hinabstürzen« gibt in diesem Kontext die Bewegung von der Spitze der Klippe natürlich wieder; »von dort« nimmt den unmittelbar zuvor genannten Ort auf, ohne Information auszulassen.
- source_word: וְכֻלָּם
  choice: sie alle
  rationale: Die Form betont ausdrücklich die Gesamtheit der Gefangenen.
- source_word: נִבְקָעוּ
  choice: wurden zerschmettert
  rationale: Der Nifal von בקע bedeutet wörtlich »gespalten/aufgebrochen werden«. Nach dem Sturz von einer Klippe drückt »zerschmettert werden« das Ergebnis im Deutschen idiomatisch und ohne Abschwächung aus.
