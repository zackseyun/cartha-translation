lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: wurde besiegt
  rationale: Das Nifal von נָגַף bezeichnet hier im militärischen Zusammenhang eine Niederlage; „wurde besiegt“ gibt den Sinn klar und natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im Deutschen übliche Form des Namens für das Südreich.
- source_word: לִפְנֵי
  choice: von
  rationale: Wörtlich bedeutet die Wendung „vor Israel“; im deutschen Schlachtenbericht bezeichnet „von Israel besiegt“ eindeutig den Gegner und klingt natürlicher.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Die im Deutschen übliche Form des Namens für das Nordreich.
- source_word: וַיָּנֻסוּ
  choice: floh
  rationale: נוּס bedeutet „fliehen“; die Singularform entspricht dem distributiven Subjekt „jeder“.
- source_word: אִישׁ
  choice: jeder
  rationale: Der distributive Singular bezeichnet jeden einzelnen der beteiligten Männer; „jeder“ ist knapp und idiomatisch.
- source_word: לְאֹהָלָיו
  choice: zu seinem Zelt
  rationale: Die Form bedeutet wörtlich „zu seinen Zelten“, wird hier aber distributiv mit singularischem Sinn gebraucht. Die Übersetzung bewahrt das hebräische Bild und erläutert dessen idiomatische Bedeutung in der Fußnote.
