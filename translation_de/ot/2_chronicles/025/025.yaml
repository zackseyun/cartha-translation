id: 2CH.25.25
reference: 2 Chronicles 25:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַחֲרֵ֣י מ֔וֹת יוֹאָ֥שׁ בֶּן יְהוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: de
  text: Amazja, der Sohn des Joasch und König von Juda, lebte nach dem Tod Joaschs, des Sohnes Joahas’ und Königs von Israel, noch fünfzehn Jahre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lebte nach dem Tod Joaschs … fünfzehn Jahre“. Gemeint ist, dass Amazja den israelitischen König Joasch um fünfzehn Jahre überlebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: Das Verb חיה bezeichnet hier das Fortleben über einen bestimmten Zeitraum. Die Verbindung „lebte … noch“ gibt den chronologischen Sinn natürlich wieder, ohne das stärker deutende „überlebte“ in den Haupttext zu setzen.
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Gebräuchliche deutsche Namensform.
- source_word: בֶן יוֹאָשׁ
  choice: der Sohn des Joasch
  rationale: Die genealogische Zuordnung wird im Deutschen klar und idiomatisch wiedergegeben.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Direkte Wiedergabe der Amts- und Herrschaftsbezeichnung.
- source_word: אַחֲרֵי מוֹת
  choice: nach dem Tod
  rationale: Bewahrt die nominale Konstruktion des Hebräischen und klingt im modernen Deutschen natürlich.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Gebräuchliche deutsche Namensform.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  rationale: Direkte Wiedergabe der Amts- und Herrschaftsbezeichnung.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: fünfzehn Jahre
  rationale: Unmittelbare und natürliche Wiedergabe der Zeitangabe.
