base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: de
  text: Nachdem Amazja die Edomiter geschlagen hatte und zurückgekehrt war, brachte er die Götter der Söhne Seïrs[a] mit. Er stellte sie für sich als Götter auf, warf sich vor ihnen nieder[b] und verbrannte ihnen Räucherwerk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Götter des Volkes von Seïr«. Wörtlich: »die Götter der Söhne Seïrs«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beugte sich vor ihnen nieder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: Nachdem ... zurückgekehrt war
  rationale: Die Konstruktion leitet den nächsten Erzählabschnitt ein und bezeichnet die Zeit nach Amazjas Ankunft. Im Deutschen gibt „zurückgekehrt“ die durch den Zusammenhang erkennbare Rückkehr idiomatisch wieder; ein zusätzliches „Und es geschah“ wäre schwerfällig.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: vom Kampf gegen die Edomiter
  rationale: Das Verb נכה bezeichnet hier das Schlagen beziehungsweise Niederschlagen der Edomiter. „Vom Kampf gegen“ bewahrt den kriegerischen Vorgang, ohne das Ausmaß der Tötung über den Text hinaus festzulegen.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: die Götter der Söhne Seïrs
  rationale: אֱלֹהֵי ist wegen der heidnischen Gottheiten pluralisch zu verstehen. „Söhne Seïrs“ wahrt im Haupttext die hebräische Verwandtschaftsbezeichnung; die idiomatische Bedeutung wird in der Fußnote genannt.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: Er stellte sie für sich als Götter auf
  rationale: Der Hifil von עמד bezeichnet das Aufstellen oder Einsetzen. Die Formulierung lässt sowohl die konkrete Aufstellung von Kultbildern als auch ihre Annahme als Götter erkennen.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: warf sich vor ihnen nieder
  rationale: השתחוה bezeichnet eine körperliche Niederwerfung, hier eindeutig als Kulthandlung. Die Übersetzung bewahrt das konkrete Bild, statt nur abstrakt „betete sie an“ zu sagen.
- source_word: וְלָהֶם יְקַטֵּר
  choice: verbrannte ihnen Räucherwerk
  rationale: קטר im Piel bezeichnet das Verbrennen von Räucherwerk beziehungsweise ein Rauchopfer. „Verbrannte ihnen Räucherwerk“ erhält Handlung und Empfängerbezug.
theological_decisions:
- issue: Wiedergabe von אֱלֹהֵי/אֱלֹהִים bei heidnischen Gottheiten
  choice: Götter
  alternative: Gottheiten
  rationale: Der Zusammenhang handelt von den verehrten Göttern Seïrs. „Götter“ ist die direkte und natürliche Wiedergabe und lässt die im Bericht enthaltene Kritik an Amazjas Abfall ungeschmälert stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit in drei Hauptaussagen gegliedert. „Seïr“ trägt ein Trema, damit die getrennte Aussprache der Vokale erkennbar bleibt.
