  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: de
  text: 'Doch ein Mann Gottes kam zu ihm und sagte: »König, lass das Heer Israels nicht mit dir ziehen, denn Jahwe ist nicht mit Israel, nämlich mit allen Söhnen Ephraims.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »allen Ephraimitern«. Wörtlich: »allen Söhnen Ephraims«.'
    reason: Die Fußnote bietet die idiomatische Volksbezeichnung, während der Haupttext die familiäre Ausdrucksweise des Hebräischen bewahrt.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ein Mann Gottes
  rationale: Die feste Bezeichnung meint einen von Gott beauftragten Boten; die unbestimmte Form entspricht der Neueinführung dieser Person.
- source_word: בָּא אֵלָיו
  choice: kam zu ihm
  rationale: בוא mit אֶל bezeichnet hier die Bewegung auf eine Person zu.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die übliche hebräische Redeeinleitung wird in natürlichem modernem Deutsch verbal wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Der bestimmte Artikel steht hier in einer direkten Anrede; Deutsch verwendet dafür schlicht den Titel ohne Artikel.
- source_word: אַל יָבֹא עִמְּךָ צְבָא יִשְׂרָאֵל
  choice: lass das Heer Israels nicht mit dir ziehen
  rationale: Die mit אַל gebildete verneinte Aufforderung richtet sich an den König. Im Zusammenhang eines Feldzugs gibt „mit dir ziehen“ den Sinn natürlicher wieder als das wörtliche „mit dir kommen“.
- source_word: צְבָא יִשְׂרָאֵל
  choice: das Heer Israels
  rationale: צָבָא bezeichnet hier die für den Feldzug aufgebotene Streitmacht.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: denn Jahwe ist nicht mit Israel
  rationale: כִּי leitet die Begründung ein; die Wendung „mit jemandem sein“ bleibt als theologisch bedeutsame Aussage über Gottes Beistand erhalten.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: mit all den Söhnen Ephraims
  rationale: Die Wiedergabe bewahrt die familiäre Gruppenbezeichnung des Hebräischen und versteht die Schlusswendung als nähere Bestimmung des hier gemeinten Israel; das „mit“ wird aus dem vorausgehenden Satzglied aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „Jahwe ist nicht mit Israel“
  choice: Die Formulierung bleibt wörtlich und offen
  alternative: Jahwe unterstützt Israel nicht
  rationale: „Mit jemandem sein“ kann göttlichen Beistand und Gegenwart bezeichnen. Die direkte Form wahrt die theologische Spannung und legt die Aussage nicht unnötig auf eine bloß militärische Unterstützung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „König“ ist natürlicher als das altertümliche „O König“. Die leicht markierte Schlussfügung bewahrt die enge Verbindung von „Israel“ und „allen Söhnen Ephraims“, ohne sie über den hebräischen Wortlaut hinaus auszudeuten.
