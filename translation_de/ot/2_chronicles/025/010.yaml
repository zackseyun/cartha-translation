    issue: Die Übersetzung fügt mit „schickte sie … zurück“ eine eigenständige kausative Handlung hinzu.
    rationale: Der hebräische Text sagt, dass Amazja sie absonderte/entließ, damit sie an ihren Ort gingen; er verwendet kein eigenes Verb für „schicken“.
  - severity: low
    issue: „Heimatort“ konkretisiert לִמְקוֹמָם unnötig.
    rationale: „Ihr Ort“ kann im Kontext den Herkunfts- oder Aufenthaltsort meinen, ohne dass „Heimat“ ausdrücklich bezeichnet wird.
  revised_text: Da entließ Amazja die Truppen, die aus Ephraim zu ihm gekommen waren, damit sie an ihren Ort gingen. Sie aber wurden sehr zornig auf Juda und kehrten in glühendem Zorn an ihren Ort zurück.
