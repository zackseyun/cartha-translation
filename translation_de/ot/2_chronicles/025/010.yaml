  to: Da entließ Amazja die Truppen, die aus Ephraim zu ihm gekommen waren, damit sie an ihren Ort gingen. Sie aber wurden sehr zornig auf Juda und kehrten in glühendem Zorn an ihren Ort zurück.
  rationale: Die Revision gibt die kontextuelle Bedeutung des ersten Verbs mit „entließ“ wieder, ohne durch „schickte“ eine zusätzliche Handlung einzutragen. „An ihren Ort“ bewahrt die offene Formulierung des Hebräischen. Die starke, gegen Juda gerichtete Verärgerung und ihr Rückkehrmodus bleiben erhalten.
