base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: de
  text: Da entließ Amazja die Truppen, die aus Ephraim zu ihm gekommen waren, damit sie an ihren Ort gingen. Sie aber wurden sehr zornig auf Juda und kehrten in glühendem Zorn an ihren Ort zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: sonderte … aus und schickte sie … zurück
  rationale: בדל bedeutet zunächst „absondern/trennen“. Im Zusammenhang geht es darum, die ephraimitischen Truppen aus dem Heer auszusondern und heimzuschicken; die kombinierte Wiedergabe bewahrt das Bild und macht die praktische Folge deutlich.
- source_word: לְהַגְּדוּד
  choice: die Truppen
  rationale: גְּדוּד bezeichnet hier einen militärischen Trupp beziehungsweise eine Streitmacht; „die Truppen“ ist gegenwärtig, verständlich und sachlich passend.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: die aus Ephraim zu ihm gekommen waren
  rationale: Der Relativsatz bestimmt die Truppen näher; das Plusquamperfekt gibt die Vorzeitigkeit im Deutschen natürlich wieder.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: an ihren Heimatort zurück
  rationale: Wörtlich steht „zu ihrem Ort gehen“. „Heimatort“ gibt den gemeinten eigenen Ort verständlich wieder; „zurück“ ergibt sich aus der vorherigen Ankunft bei Amazja.
- source_word: וַיִּחַר אַפָּם מְאֹד
  choice: wurden sie sehr zornig
  rationale: Die hebräische Wendung beschreibt wörtlich ein starkes Entbrennen des Zorns. Die deutsche Formulierung gibt den idiomatischen Sinn klar wieder.
- source_word: בִּיהוּדָה
  choice: auf Juda
  rationale: Die Präposition kennzeichnet Juda als Ziel des Zorns. „Zornig auf Juda“ ist im modernen Deutschen idiomatisch und wahrt die feindselige Ausrichtung.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: kehrten … an ihren Heimatort zurück
  rationale: שׁוב bedeutet „umkehren/zurückkehren“. Die Wiedergabe bewahrt sowohl die Rückbewegung als auch das Ziel.
- source_word: בָּחֳרִי אָף
  choice: in glühendem Zorn
  rationale: Die Wendung bezeichnet die Glut beziehungsweise Hitze des Zorns. „Glühender Zorn“ bewahrt die Bildhaftigkeit und klingt zugleich natürlich und würdig.
