base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: de
  text: Doch als er mächtig geworden war, wurde sein Herz hochmütig – zu seinem Verderben. Er brach Jahwe, seinem Gott, die Treue und betrat den Tempel Jahwes, um auf dem Räucheraltar Räucherwerk darzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Doch als er mächtig geworden war
  rationale: כְּ mit dem Ausdruck „seine Stärke“ ist hier temporal zu verstehen. „Mächtig geworden“ gibt sowohl den Machtzuwachs als auch den Übergang zur folgenden Reaktion natürlich wieder.
- source_word: גָּבַהּ לִבּוֹ
  choice: wurde sein Herz hochmütig
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sein Herz hoch wurde. „Sein Herz wurde hochmütig“ bewahrt das Bild teilweise und vermittelt zugleich den moralischen Sinn verständlich.
- source_word: עַד לְהַשְׁחִית
  choice: zu seinem Verderben
  rationale: Die knappe Wendung bezeichnet hier die verderbliche Folge beziehungsweise das Ergebnis seines Hochmuts. Sie lässt offen, ob der Akzent stärker auf Selbstverderben oder auf dem daraus entstehenden Unheil liegt.
- source_word: וַיִּמְעַל
  choice: Er handelte treulos
  rationale: מעל bezeichnet besonders im kultisch-bundestheologischen Zusammenhang einen Treuebruch. „Treulos handeln“ ist gegenwärtig, verständlich und weniger eng als „sich versündigen“.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: an Jahwe, seinem Gott
  rationale: Bei מעל bezeichnet ב die Person, an der Treuebruch begangen wird. Im Deutschen ist „treulos handeln an“ eine passende, wenn auch gehobene Verbindung; „gegenüber“ wäre glatter, aber weniger prägnant.
- source_word: הֵיכַל יְהוָה
  choice: den Tempel Jahwes
  rationale: הֵיכָל bezeichnet in diesem Kontext das Tempelgebäude beziehungsweise Heiligtum. „Tempel“ ist die klare und übliche deutsche Entsprechung.
- source_word: לְהַקְטִיר
  choice: um … Räucherwerk zu verbrennen
  rationale: Der Hifil von קטר bezeichnet im Kult das Verbrennen beziehungsweise Darbringen von Räucherwerk. Die Formulierung macht die konkrete Handlung deutlich.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: dem Räucheraltar
  rationale: „Räucheraltar“ ist die etablierte, knappe deutsche Bezeichnung für den zum Räucheropfer bestimmten Altar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des Vergehens in וַיִּמְעַל
  choice: handelte treulos an Jahwe
  alternative: versündigte sich gegen Jahwe
  rationale: Die Übersetzung bewahrt den Gedanken des Treuebruchs und legt die Tat nicht ausschließlich als allgemeine Sünde oder bloße Übertretung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung nach „Verderben“ verbessert die Lesbarkeit, ohne den engen sachlichen Zusammenhang zu lösen. Der Gottesname wird als „Jahwe“ wiedergegeben.
