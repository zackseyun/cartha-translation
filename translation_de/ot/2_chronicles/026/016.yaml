  source_fidelity: Der Entwurf gibt den zeitlichen Einstieg, den Hochmut mit seiner verderblichen Folge, den Treuebruch gegenüber Jahwe sowie das Eintreten in den Tempel zum Räucheropfer sachgerecht wieder. „Zu seinem Verderben“ ist für עַד לְהַשְׁחִית eine vertretbare, den resultativen Sinn wahrende Wiedergabe.
  naturalness: „An Jahwe ... treulos handeln“ ist im modernen Standarddeutsch deutlich weniger idiomatisch. „Jahwe ... die Treue brechen“ ist eine natürliche, würdige Formulierung und erhält den bundesbezogenen Sinn. „Darbringen“ ist für kultisches Räucherwerk im Deutschen idiomatischer als „Räucherwerk verbrennen“, ohne die Opferhandlung abzuschwächen.
  terminology: „Jahwe“, „Tempel Jahwes“ und „Räucheraltar“ sind konsistent und sachlich passend. „Die Treue brechen“ gibt מעל in diesem Kontext präzise wieder, ohne es auf eine bestimmte dogmatische Deutung zu verengen.
