source:
  edition: WLC
  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: de
  text: König Usija blieb bis zu seinem Tod von Aussatz befallen[a]. Als Aussätziger lebte er in einem abgesonderten Haus[b], denn er war vom Haus Jahwes abgeschnitten. Sein Sohn Jotam stand dem Königshaus vor und sprach dem Volk des Landes Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der biblische Begriff „Aussatz“ bezeichnet verschiedene auffällige Hautkrankheiten und ist nicht ohne Weiteres mit der heute so genannten Lepra gleichzusetzen.
    reason: lexical_scope
  - marker: b
    text: 'Wörtlicher möglicherweise: „im Haus der Freiheit“. Der schwierige hebräische Ausdruck meint hier wahrscheinlich eine Unterkunft, in der Usija wegen seiner Erkrankung abgesondert lebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: von Aussatz befallen / Aussätziger
  rationale: Die traditionelle Wiedergabe ist knapp und im biblischen Zusammenhang verständlich. Eine Fußnote stellt klar, dass צָרַעַת nicht ohne Weiteres mit einer bestimmten modernen Krankheit gleichgesetzt werden darf.
- source_word: בֵּית הַחפשות
  choice: ein abgesondertes Haus
  rationale: Der schwierige Ausdruck bezeichnet im Zusammenhang wahrscheinlich eine vom normalen höfischen und kultischen Leben getrennte Unterkunft. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: vom Haus Jahwes abgeschnitten
  rationale: „Abgeschnitten“ erhält die Stärke von נִגְזַר und lässt sowohl räumliche Ausgrenzung als auch den Verlust des Tempelzugangs erkennen, ohne den Ausdruck abzuschwächen.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus“ und gibt den Gottesnamen יְהוָה als „Jahwe“ wieder.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: stand dem Königshaus vor
  rationale: Die Formulierung bezeichnet Jotams Aufsicht über den königlichen Haushalt beziehungsweise Palast, ohne sein Amt genauer festzulegen, als es der Text erlaubt.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: sprach dem Volk des Landes Recht
  rationale: Diese Wendung erhält den Grundsinn von שׁפט, lässt aber den im Kontext möglichen weiteren Leitungs- und Regierungsauftrag offen.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die nahe Wiedergabe vermeidet es, den möglicherweise gesellschaftlichen oder politischen Ausdruck vorschnell auf „das einfache Volk“ einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Art von Usijas Ausschluss vom Heiligtum
  choice: vom Haus Jahwes abgeschnitten
  alternative: aus dem Haus Jahwes ausgeschlossen
  rationale: Die gewählte Fassung bewahrt das kräftige Bild des hebräischen Verbs und legt nicht genauer fest, ob ausschließlich ein räumlich-rechtlicher Ausschluss oder eine darüber hinausgehende Trennung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Blieb … befallen“ gibt den fortdauernden Zustand natürlich wieder; „stand dem Königshaus vor“ und „sprach … Recht“ bewahren die Verwaltungs- und Rechtssprache des Ausgangstextes, ohne Jotams Stellung vorschnell als formelle Mitregentschaft zu bestimmen.
