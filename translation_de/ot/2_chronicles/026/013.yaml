  text: וְ/עַל יָדָ/ם֩ חֵ֨יל צָבָ֜א שְׁלֹ֧שׁ מֵא֣וֹת אֶ֗לֶף וְ/שִׁבְעַ֤ת אֲלָפִים֙ וַ/חֲמֵ֣שׁ מֵא֔וֹת עוֹשֵׂ֥י מִלְחָמָ֖ה בְּ/כֹ֣חַ חָ֑יִל לַ/עְזֹ֥ר לַ/מֶּ֖לֶךְ עַל הָ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: de
  text: Unter ihrem Befehl stand ein Heer von 307.500 Mann[a], das mit großer Kampfkraft Krieg führte, um dem König gegen den Feind beizustehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Unter ihrer Hand war eine Heeresmacht: 307.500 Kriegführende.« Der Haupttext gibt die hebräischen militärischen Wendungen in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Ihnen unterstand
  rationale: Die Wendung עַל יַד mit Suffix bezeichnet hier im militärischen Verwaltungszusammenhang Aufsicht beziehungsweise Befehlsgewalt, nicht eine buchstäbliche Tätigkeit »durch ihre Hand«.
- source_word: חֵיל צָבָא
  choice: ein Heer
  rationale: Die Wortverbindung bezeichnet eine organisierte Streitmacht. »Heer« gibt dies knapp und idiomatisch wieder.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307.500 Mann
  rationale: Die Zahl entspricht unmittelbar der Summe der hebräischen Zahlwörter. »Mann« verdeutlicht natürlich, dass die Stärke des Heeres gezählt wird.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: die … Krieg führten
  rationale: Die wörtliche Bedeutung »Krieg Tuende/Führende« wird direkt wiedergegeben, ohne die Wendung stärker als im Hebräischen als Ausbildung oder bloße Kampfbereitschaft auszulegen.
- source_word: בְּכֹחַ חָיִל
  choice: mit gewaltiger Kampfkraft
  rationale: Die Verbindung von כֹּחַ (Kraft, Macht) und חַיִל (Stärke, Tüchtigkeit, militärische Macht) betont die große kriegerische Leistungsfähigkeit.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: um dem König … beizustehen
  rationale: עזר bedeutet helfen oder beistehen; »beistehen« passt natürlich zum militärischen Zusammenhang.
- source_word: עַל הָאוֹיֵב
  choice: gegen den Feind
  rationale: עַל bezeichnet zusammen mit »helfen/beistehen« in diesem militärischen Kontext die Gegenseite.
