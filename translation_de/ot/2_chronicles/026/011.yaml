  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Militärische Fachbegriffe wurden so gewählt, dass keine anachronistischen modernen Truppenstärken oder Dienstränge vorausgesetzt werden.
