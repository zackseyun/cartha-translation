base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: de
  text: Usija hatte ein kriegstüchtiges Heer. Es zog abteilungsweise in den Kampf, gemäß der Zahl ihrer Musterung, unter der Leitung des Schreibers Jeïel[a] und des Amtsträgers Maaseja, unter Hananjas Aufsicht, eines der Befehlshaber des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird im hebräischen Text hier יעואל geschrieben; er wird auch als Jeuel oder Jeiel wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: ein kriegstüchtiges Heer
  rationale: חַיִל bezeichnet im Zusammenhang eine Streitmacht; die Partizipialfügung עֹשֵׂה מִלְחָמָה beschreibt sie als zum Kriegführen befähigt. „Kriegstüchtiges Heer“ gibt dies knapp und natürlich wieder.
- source_word: יוֹצְאֵי צָבָא
  choice: Es zog … in den Kampf
  rationale: Die Wendung bezeichnet das Ausrücken zum Heeres- beziehungsweise Kriegsdienst. Im unmittelbaren Zusammenhang eines kriegstüchtigen Heeres ist „in den Kampf ziehen“ verständlich und militärisch passend.
- source_word: לִגְדוּד
  choice: abteilungsweise
  rationale: גְּדוּד bezeichnet hier die gegliederten militärischen Einheiten. „Abteilungsweise“ bewahrt den organisatorischen Sinn, ohne moderne Großverbände wie Divisionen vorauszusetzen.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: nach der Zahl der Gemusterten
  rationale: פְּקֻדָּה meint hier die amtliche Erfassung beziehungsweise Musterung der Soldaten. Die gewählte Formulierung gibt sowohl den Zählvorgang als auch dessen militärischen Rahmen verständlich wieder.
- source_word: בְּיַד
  choice: unter der Leitung
  rationale: Die idiomatische Wendung bezeichnet hier die administrative Zuständigkeit von Jeïel und Maaseja, nicht buchstäblich ihre Hand.
- source_word: הַסּוֹפֵר
  choice: der Schreiber
  rationale: סֹפֵר ist ein amtlicher Schreiber oder Sekretär. „Schreiber“ bleibt transparent und lässt die genaue Ausgestaltung des Amtes offen.
- source_word: הַשּׁוֹטֵר
  choice: der Amtmann
  rationale: שֹׁטֵר bezeichnet einen mit Verwaltungs- oder Aufsichtsbefugnissen betrauten Funktionsträger. „Amtmann“ unterscheidet diese Funktion vom militärischen Befehlshaber, ohne sie zu eng festzulegen.
- source_word: עַל יַד
  choice: unter der Aufsicht
  rationale: Die Wendung kennzeichnet Hananjas übergeordnete Aufsicht über die zuvor genannten Verantwortlichen und die Truppe.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: einer der Befehlshaber des Königs
  rationale: שַׂר kann Fürst, Oberster, Amtsträger oder Befehlshaber bedeuten. Der militärische Zusammenhang legt „Befehlshaber“ nahe, ohne einen modernen Dienstrang einzutragen.
