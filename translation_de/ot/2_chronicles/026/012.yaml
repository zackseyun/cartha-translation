  text: כֹּ֠ל מִסְפַּ֞ר רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/גִבּ֣וֹרֵי חָ֔יִל אַלְפַּ֖יִם וְ/שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/012.yaml
  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: de
  text: Die Gesamtzahl der Oberhäupter der Familienverbände bei den tüchtigen Kriegern betrug 2.600.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter der Großfamilien
  rationale: Die Wendung bezeichnet die führenden Männer der väterlich gegliederten Sippenverbände; „Großfamilien“ ist im heutigen Deutsch verständlicher als das missverständliche „Vaterhäuser“.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: die den kampfstarken Männern vorstanden
  rationale: Das לְ markiert hier wahrscheinlich die Zuordnung der Oberhäupter zu den kriegstüchtigen Männern. Die verbale Wiedergabe macht diese Beziehung natürlich verständlich, ohne die Männer selbst mit den Oberhäuptern gleichzusetzen.
- source_word: גִבּוֹרֵי חָיִל
  choice: kampfstarke Männer
  rationale: Im militärischen Kontext bezeichnet die Wortgruppe tüchtige und leistungsfähige Krieger; „kampfstark“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: '2.600'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise knapp und eindeutig wiedergegeben.
theological_decisions:
- issue: Beziehung zwischen den Sippenoberhäuptern und den kampfstarken Männern
  choice: Die Oberhäupter standen den kampfstarken Männern vor.
  alternative: „Oberhäupter der Großfamilien unter den kampfstarken Männern“ oder wörtlicher „für die kampfstarken Männer“
  rationale: Die Präposition לְ lässt die genaue Beziehung knapp und etwas offen. Im Zusammenhang mit der militärischen Organisation in den folgenden Versen liegt eine Leitungs- beziehungsweise Zuordnungsfunktion nahe; es wird keine weitergehende theologische Aussage eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung vermeidet das heute ungebräuchliche „Vaterhäuser“ und die altertümliche Wendung „Helden der Tapferkeit“, bewahrt aber den militärisch-organisatorischen Sinn des hebräischen Textes.
