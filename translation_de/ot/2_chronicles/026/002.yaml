  text: ה֚וּא בָּנָ֣ה אֶת אֵיל֔וֹת וַ/יְשִׁיבֶ֖/הָ לִֽ/יהוּדָ֑ה אַחֲרֵ֥י שְׁכַֽב הַ/מֶּ֖לֶךְ עִם אֲבֹתָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: de
  text: Er baute Elot und gewann es für Juda zurück,[a] nachdem der König sich zu seinen Vätern gelegt hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachte es zu Juda zurück«; gemeint ist die erneute Zugehörigkeit zu Juda.'
    reason: lexical_alternative
  - marker: b
    text: »Sich zu seinen Vätern legen« ist eine hebräische Umschreibung für den Tod.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: baute
  rationale: Das Verb bedeutet gewöhnlich »bauen«. Ein Wiederaufbau mag im Zusammenhang vorausgesetzt sein, wird durch das Verb selbst aber nicht ausdrücklich bezeichnet.
- source_word: אֵילוֹת
  choice: Elot
  rationale: Der Ortsname wird in einer dem hebräischen Bibelnamen entsprechenden deutschen Form transliteriert.
- source_word: וַיְשִׁיבֶהָ
  choice: brachte es wieder zurück
  rationale: Der Hifil von שוב mit femininem Suffix bezeichnet hier die Rückführung Elots unter die Herrschaft Judas. Die Formulierung bewahrt die Rückkehr-Bedeutung, ohne die politische Nuance unnötig auszudeuten.
- source_word: לִיהוּדָה
  choice: zu Juda
  rationale: Die Präposition ל bezeichnet das Ziel beziehungsweise den Empfänger der Rückführung.
- source_word: אַחֲרֵי שְׁכַב
  choice: nachdem … sich … gelegt hatte
  rationale: Die hebräische königliche Todesformel wird als würdiger deutscher Euphemismus wiedergegeben, statt sie direkt mit »gestorben war« aufzulösen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der Ausgangstext nennt keinen Eigennamen, sondern sagt ausdrücklich »der König«.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vorfahren
  rationale: »Vorfahren« gibt אבות in dieser Todesformel im heutigen Deutsch verständlich wieder; zusammen mit »sich legen« bleibt der idiomatische Charakter erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Todesumschreibung bleibt erhalten, wird jedoch mit »Vorfahren« verständlicher formuliert. Das grammatisch sächliche Pronomen »es« richtet sich im Deutschen nach dem als Ortsnamen verstandenen Elot.
