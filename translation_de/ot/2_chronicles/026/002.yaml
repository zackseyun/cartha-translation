    rationale: Die deutsche biblische Formel lautet üblicherweise »sich zu seinen Vätern legen«; sie ist näher an עִם אֲבֹתָיו und bewahrt den Registercharakter besser.
  - severity: low
    issue: Fußnote a enthält die ebenfalls unnatürliche Alternative »führte es zu Juda zurück«
    rationale: Die Alternative sollte als verständliches, semantisch nahes Deutsch formuliert werden.
