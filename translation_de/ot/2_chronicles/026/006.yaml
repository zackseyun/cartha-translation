base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: de
  text: Er zog aus und kämpfte gegen die Philister. Er durchbrach die Mauer von Gat, die Mauer von Jabne und die Mauer von Aschdod[a]. Dann baute er Städte im Gebiet von Aschdod[b] und unter den Philistern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlug Breschen in die Mauer von Gat, die Mauer von Jabne und die Mauer von Aschdod«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in Aschdod«; der Name kann hier die Stadt oder das zu ihr gehörende Gebiet bezeichnen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Er zog aus
  rationale: יצא bedeutet grundsätzlich »hinausgehen«. Im militärischen Zusammenhang ist »ausziehen« im Deutschen natürlich, ohne die zusätzliche Bedeutung von »marschieren« einzutragen.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: kämpfte gegen die Philister
  rationale: לחם im Nifal bezeichnet das Kämpfen oder Kriegführen; mit der Präposition ist »gegen« hier die natürliche deutsche Wiedergabe.
- source_word: וַיִּפְרֹץ אֶת חוֹמַת
  choice: riss die Mauer … nieder
  rationale: פרץ kann beim Angriff auf eine Mauer das Durchbrechen, Breschenschlagen oder Niederreißen bezeichnen. »Niederreißen« ist verständlich und passt zum dreifachen Objekt »Mauer«, während die Fußnote die weitere Bedeutungsnuance bewahrt.
- source_word: חוֹמַת גַּת … חוֹמַת יַבְנֵה … חוֹמַת אַשְׁדּוֹד
  choice: die Mauer von Gat, die Mauer von Jabne und die Mauer von Aschdod
  rationale: Der hebräische Singular wird bei jedem einzelnen Städtenamen ausdrücklich wiederholt und daher auch im Deutschen beibehalten.
- source_word: וַיִּבְנֶה עָרִים
  choice: baute er Städte
  rationale: בנה bedeutet »bauen«; der Text sagt nicht ausdrücklich »wiederaufbauen«. עָרִים wird hier entsprechend als »Städte« wiedergegeben.
- source_word: בְּאַשְׁדּוֹד
  choice: im Gebiet von Aschdod
  rationale: Da mehrere Städte nicht sinnvoll innerhalb der Stadt Aschdod gebaut werden konnten, bezeichnet Aschdod hier wahrscheinlich das zugehörige Gebiet. Die Fußnote weist auf die formnähere Alternative hin.
- source_word: וּבַפְּלִשְׁתִּים
  choice: unter den Philistern
  rationale: Die hebräische Form nennt das Volk und nicht ausdrücklich das Land. »Unter den Philistern« bewahrt diese Ausdrucksweise und lässt offen, ob vor allem ihr Siedlungsgebiet oder ihre Bevölkerung gemeint ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. »Er zog aus« trägt dem militärischen Zusammenhang Rechnung, ohne unnötig auszudeuten. Die Wiederholung von »die Mauer« folgt der Struktur des Hebräischen. Die Satzteilung macht die lange hebräische Verbfolge im Deutschen gut verständlich.
