revisions:
- from: In Jerusalem ließ er kunstvoll entworfene Vorrichtungen[a] an den Türmen und Ecken anbringen, um Pfeile und große Steine abzuschießen. Sein Ruf verbreitete sich bis in weite Ferne[b], denn ihm wurde auf wunderbare Weise geholfen[c], sodass er mächtig wurde.
  to: In Jerusalem ließ er Vorrichtungen[a] anfertigen, die ein kundiger Erfinder entworfen hatte; sie sollten auf den Türmen und an den Ecken stehen, um Pfeile abzuschießen und große Steine zu schleudern. Sein Ruf verbreitete sich bis in weite Ferne[b], denn ihm wurde auf wunderbare Weise geholfen[c], bis er stark wurde.
  rationale: Die Revision gibt die ausdrückliche Kennzeichnung der Vorrichtungen als Entwurf eines kundigen Erfinders wieder, ohne die nicht näher bestimmte Technik zu konkretisieren. „Stark wurde“ bleibt beim Grundsinn von חָזָק. Die passive Wendung zur Hilfe und ihre Fußnote erhalten die textliche Nichtnennung des Helfenden.
