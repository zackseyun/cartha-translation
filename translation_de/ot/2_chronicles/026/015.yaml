  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: de
  text: In Jerusalem ließ er Vorrichtungen[a] anfertigen, die ein kundiger Erfinder entworfen hatte; sie sollten auf den Türmen und an den Ecken stehen, um Pfeile abzuschießen und große Steine zu schleudern. Sein Ruf verbreitete sich bis in weite Ferne[b], denn ihm wurde auf wunderbare Weise geholfen[c], bis er stark wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kriegsmaschinen“ beziehungsweise „Konstruktionen“. Die genaue Bauart der Vorrichtungen wird nicht beschrieben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sein Name ging hinaus bis in die Ferne.“'
    reason: lexical_alternative
  - marker: c
    text: Wer ihm half, wird hier nicht ausdrücklich genannt; der Zusammenhang legt Gottes Hilfe nahe.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת מַחֲשֶׁבֶת חוֹשֵׁב
  choice: kunstvoll entworfene Vorrichtungen
  rationale: חִשְּׁבֹנוֹת bezeichnet hier erdachte Vorrichtungen oder Mechanismen; die verwandte Wortgruppe מַחֲשֶׁבֶת חוֹשֵׁב hebt die planvolle Arbeit eines kundigen Konstrukteurs hervor. Die Formulierung bleibt hinsichtlich der genauen Bauart bewusst offen.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: an den Türmen und Ecken
  rationale: „Türme“ ist eindeutig; „Ecken“ bewahrt das konkrete Bild von פִּנּוֹת, ohne es vorschnell als Zinnen, Bollwerke oder Ecktürme zu deuten.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: um Pfeile und große Steine abzuschießen
  rationale: Der Infinitiv gibt den Zweck an. יָרָה kann das Schießen beziehungsweise Schleudern bezeichnen; das gemeinsame Verb für Pfeile und Steine wird in einer kompakten deutschen Formulierung wiedergegeben.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: Sein Ruf verbreitete sich bis in weite Ferne
  rationale: Die wörtliche Wendung „sein Name ging hinaus“ ist ein Idiom für die weite Verbreitung seines Ansehens oder Ruhmes.
- source_word: כִּי הִפְלִיא לְהֵעָזֵר
  choice: denn ihm wurde auf wunderbare Weise geholfen
  rationale: Die passive Konstruktion von עזר lässt den Helfenden ungenannt; פלא bezeichnet das Außergewöhnliche oder Wunderbare dieser Hilfe.
- source_word: עַד כִּי חָזָק
  choice: sodass er mächtig wurde
  rationale: Die Wendung beschreibt die erreichte Folge beziehungsweise das Ausmaß der Hilfe. „Mächtig“ passt im Kontext zur militärischen und politischen Stärke des Königs.
theological_decisions:
- issue: Ungenannter Urheber der Hilfe
  choice: 'Der Urheber bleibt im Haupttext ungenannt: „ihm wurde ... geholfen“.'
  alternative: „Der HERR half ihm auf wunderbare Weise.“
  rationale: Obwohl der Zusammenhang göttliche Hilfe nahelegt, nennt der hebräische Satz den Helfenden nicht ausdrücklich. Die passive Form bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorrichtungen“ vermeidet eine anachronistisch genaue technische Festlegung; „anbringen“ gibt die vorgesehene Aufstellung auf den Befestigungen natürlich wieder. Alle im Text gesetzten Fußnotenmarker sind erläutert.
