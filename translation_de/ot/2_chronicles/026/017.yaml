  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: de
  text: Der Priester Asarja ging nach ihm hinein, zusammen mit achtzig Priestern Jahwes, tapferen Männern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tüchtige Männer“ oder „starke Männer“. Die hebräische Wendung kann Männer bezeichnen, die sich durch Kraft, Tüchtigkeit oder Tapferkeit auszeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: ging hinter ihm hinein
  rationale: בוא kann je nach Perspektive „kommen“, „gehen“ oder „hineingehen“ bedeuten; zusammen mit אַחֲרָיו bezeichnet es hier Asarjas Nachgehen in den betreffenden Bereich, ohne diesen im Vers ausdrücklich zu benennen.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: der Priester Asarja
  rationale: Natürliche deutsche Wortstellung für den Eigennamen mit seiner bestimmten Amtsbezeichnung.
- source_word: וְעִמּוֹ
  choice: und mit ihm waren
  rationale: Die hebräische Begleitungsphrase enthält kein ausdrückliches Verb; „waren“ wird im Deutschen zur flüssigen Wiedergabe ergänzt.
- source_word: כֹּהֲנִים לַיהוָה
  choice: Priester Jahwes
  rationale: Das ל kennzeichnet Zugehörigkeit beziehungsweise Dienstbeziehung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שְׁמוֹנִים
  choice: achtzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: בְּנֵי חָיִל
  choice: mutige Männer
  rationale: Die idiomatische Wendung bezeichnet Männer, die durch Kraft, Tüchtigkeit oder Tapferkeit gekennzeichnet sind; im Zusammenhang hebt „mutige Männer“ ihre Bereitschaft zur Konfrontation hervor, ohne die mögliche Bedeutungsbreite zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im Deutschen als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Männliche Form von בְּנֵי חָיִל
  choice: mutige Männer
  alternative: mutige Leute
  rationale: Die Form ist grammatisch männlich und bezeichnet im Kontext männliche Priester; die Übersetzung bewahrt diese Referenz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzfolge, während „waren“ für natürliche deutsche Lesbarkeit ergänzt wird. Die Fußnote bewahrt die Bedeutungsbreite von בְּנֵי חָיִל.
