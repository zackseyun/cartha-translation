    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: war sechzehn Jahre alt
  rationale: Die hebräische Altersangabe wird im modernen Deutschen idiomatisch wiedergegeben.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die mit ב gebildete Wendung bezeichnet hier den Zeitpunkt des Herrschaftsantritts; die Formulierung ist natürlich und präzise.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: er regierte zweiundfünfzig Jahre
  rationale: Dies gibt die chronologische Königsformel in geläufigem modernem Deutsch wieder.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition bezeichnet den Ort seiner Herrschaft.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliche deutsche Wiedergabe der hebräischen Namensformel.
- source_word: יכיליה
  choice: Jecholja
  rationale: Eine am Hebräischen orientierte und im Deutschen gut lesbare Umschrift des Eigennamens; die unpunktierte Namensform erlaubt abweichende Transliterationen.
- source_word: מִן יְרוּשָׁלִָם
  choice: stammte aus Jerusalem
  rationale: מִן bezeichnet Herkunft; im Zusammenhang mit einer Person ist „stammte aus“ idiomatischer als eine wörtlichere Konstruktion.
