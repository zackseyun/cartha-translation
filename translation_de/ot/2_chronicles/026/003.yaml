base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: de
  text: Usija war sechzehn Jahre alt, als er König wurde[a], und er regierte zweiundfünfzig Jahre in Jerusalem. Seine Mutter hieß Jekolja[b] und stammte aus Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
