  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: de
  text: 'Asarja, der oberste Priester, wandte sich ihm zu, ebenso alle Priester. Und siehe: Er hatte einen Aussatz an der Stirn.[a] Da trieben sie ihn eilig von dort hinaus,[b] und auch er selbst wurde gedrängt hinauszugehen,[c] denn Jahwe hatte ihn geschlagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Aussatz“ übersetzte hebräische Wort bezeichnet eine schwere Hauterscheinung im Zusammenhang der priesterlichen Reinheitsvorschriften; sie ist nicht ohne Weiteres mit der heutigen medizinischen Diagnose Lepra gleichzusetzen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Da brachten sie ihn hastig von dort weg.“ Das hebräische Verb kann sowohl das eilige Entfernen als auch ein erschrecktes Antreiben hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und auch er selbst beeilte sich hinauszugehen.“ Die hebräische Form ist passivisch und kann ausdrücken, dass er zum Hinausgehen gedrängt wurde; im Zusammenhang kann sie auch sein eigenes dringliches Hinausstreben einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: wandte sich ihm zu
  rationale: פנה mit אֶל bezeichnet hier eine körperliche Hinwendung; die deutsche Wendung gibt dies natürlich und präzise wieder.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: Asarja, der oberste Priester
  rationale: כֹהֵן הָרֹאשׁ bedeutet wörtlich der führende beziehungsweise oberste Priester. Diese Wiedergabe vermeidet, einen stärker festgelegten Amtstitel einzutragen.
- source_word: וְכָל הַכֹּהֲנִים
  choice: ebenso alle Priester
  rationale: Die Formulierung bezieht die übrigen Priester in dieselbe Hinwendung und Wahrnehmung ein; „ebenso“ gibt die additive Verbindung idiomatisch wieder.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה hebt die plötzliche Wahrnehmung erzählerisch hervor; „siehe“ bewahrt diese markierte, würdige Ausdrucksweise.
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: Er hatte einen Aussatz an der Stirn
  rationale: מְצֹרָע bezeichnet einen von צָרַעַת Betroffenen. „Aussatz“ wahrt den Bezug zu den priesterlichen Reinheitsbestimmungen, während eine Fußnote die fehlende exakte Gleichsetzung mit moderner Lepra erläutert.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: Da trieben sie ihn eilig von dort hinaus
  rationale: Der Hifil von בהל drückt aus, dass die Priester ihn in Eile versetzten beziehungsweise hastig entfernten. Die Übersetzung bewahrt sowohl ihre aktive Einwirkung als auch die Dringlichkeit.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: und auch er selbst drängte hinauszugehen
  rationale: Das Nifal von דחף kann ein Getrieben- oder Gedrängtwerden bezeichnen, im Zusammenhang aber auch sein eigenes dringliches Hinausstreben. Die Formulierung lässt diese Spannung bestehen.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: denn Jahwe hatte ihn geschlagen
  rationale: נגע bezeichnet in diesem Strafzusammenhang nicht bloß eine neutrale Berührung, sondern einen göttlichen Schlag beziehungsweise eine Heimsuchung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen.
- issue: Amtstitel כֹהֵן הָרֹאשׁ
  choice: der oberste Priester
  alternative: der Hohepriester
  rationale: Die hebräische Formulierung lautet wörtlich „der Priester, das Haupt/der Oberste“. Die gewählte Übersetzung vermeidet eine unnötige Festlegung auf den technischen Titel „Hohepriester“.
- issue: Art der göttlichen Einwirkung in נִגְּעוֹ יְהוָה
  choice: Jahwe hatte ihn geschlagen
  alternative: Jahwe hatte ihn heimgesucht
  rationale: Im Zusammenhang ist die Hauterscheinung als unmittelbare göttliche Strafhandlung dargestellt. „geschlagen“ gibt die Schärfe des Verbs wieder, ohne die Art der Erkrankung medizinisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Und siehe“ erhält die markierte narrative Plötzlichkeit des Hebräischen. Die Satzfolge bleibt eng am Ausgangstext, während deutsche Wortstellung und Zeichensetzung für unmittelbare Verständlichkeit sorgen.
