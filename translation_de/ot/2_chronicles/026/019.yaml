revisions:
- from: Da wurde Usija zornig. Dabei hielt er das Räuchergefäß in der Hand, um Räucherwerk darzubringen. Und während er über die Priester zornig war, brach auf seiner Stirn vor den Augen der Priester eine aussätzige Hautkrankheit[a] aus – im Haus Jahwes, neben dem Räucheraltar.
  to: Da wurde Usija zornig; er hielt ein Räuchergefäß in der Hand, um Räucherwerk darzubringen. Während er den Priestern zürnte, brach auf seiner Stirn eine Hautkrankheit[a] aus, vor den Augen der Priester im Haus Jahwes, neben dem Räucheraltar.
  rationale: Die Revision ersetzt die unidiomatische Verbindung »aussätzige Hautkrankheit« durch das neutrale »Hautkrankheit« und belässt die traditionelle Bezeichnung sowie die diagnostische Unschärfe in der Fußnote. Außerdem wird die Beziehung von Usijas Zorn zu den Priestern idiomatischer formuliert. Die räumlich verdichtete, nicht völlig eindeutige Wendung beim Räucheraltar bleibt mit »neben dem Räucheraltar« vorsichtig wiedergegeben.
