  terminology: »Usija«, »Räuchergefäß«, »Räucherwerk«, »Haus Jahwes«, »Räucheraltar« und »Jahwe« sind angemessen. Die Fußnote sollte ausdrücklich verdeutlichen, dass keine moderne Diagnose, insbesondere nicht zwingend Hansen-Krankheit, behauptet wird.
