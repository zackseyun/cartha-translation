  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: de
  text: Da wurde Usija zornig; er hielt ein Räuchergefäß in der Hand, um Räucherwerk darzubringen. Während er den Priestern zürnte, brach auf seiner Stirn eine Hautkrankheit[a] aus, vor den Augen der Priester im Haus Jahwes, neben dem Räucheraltar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort wird traditionell mit »Aussatz« wiedergegeben. Es bezeichnet keine eindeutige moderne Diagnose, sondern kann unterschiedliche Hautleiden meinen, die im biblischen Gesetz kultisch unrein machten; die Hansen-Krankheit ist daher nicht zwingend gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: Da wurde … zornig
  rationale: Das Verb bezeichnet Zorn oder Entrüstung; die Form schildert das Einsetzen dieses Zustands. Die Wiedergabe ist natürlich und überzeichnet die Intensität nicht.
- source_word: עֻזִּיָּהוּ
  choice: Usija
  rationale: Gebräuchliche deutsche Namensform.
- source_word: מִקְטֶרֶת
  choice: Räuchergefäß
  rationale: Bezeichnet ein Gefäß, das zum Darbringen von Räucherwerk verwendet wurde; die Übersetzung ist verständlich und kultisch passend.
- source_word: לְהַקְטִיר
  choice: um Räucherwerk darzubringen
  rationale: Der Infinitiv drückt den Zweck aus. Im kultischen Zusammenhang trifft „darbringen“ sowohl das Verbrennen als auch den Opfercharakter der Handlung.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: während er über die Priester zornig war
  rationale: Die Wendung beschreibt den begleitenden Umstand und richtet Usijas Zorn gegen die Priester, ohne eine stärkere Intensität in den Text einzutragen.
- source_word: הַצָּרַעַת
  choice: eine aussätzige Hautkrankheit
  rationale: צָרַעַת bezeichnet eine kultisch verunreinigende Hauterkrankung, lässt sich aber nicht sicher mit der modernen Hansen-Krankheit gleichsetzen. Die Formulierung wahrt den traditionellen Bezug zu „Aussatz“ und vermeidet eine falsche medizinische Präzisierung.
- source_word: זָרְחָה
  choice: brach … aus
  rationale: Wörtlich kann das Verb „aufstrahlen/hervorleuchten“ bedeuten; hier bezeichnet es das plötzlich sichtbare Auftreten der Erkrankung.
- source_word: בְמִצְחוֹ
  choice: auf seiner Stirn
  rationale: Direkte und natürliche Wiedergabe der Körperstelle.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: vor den Augen der Priester
  rationale: Macht deutlich, dass die Priester das Auftreten wahrnahmen; dies entspricht der räumlich-präsentischen Bedeutung von לִפְנֵי.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt die hebräische Bezeichnung „Haus“ für den Tempel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Transkription des Tetragramms als persönlicher Gottesname.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: neben dem Räucheraltar
  rationale: Die verdichtete Präpositionsverbindung lokalisiert das Geschehen beim Räucheraltar; „neben“ gibt den räumlichen Sinn klar wieder, ohne eine unsichere Bewegungsrichtung zu ergänzen.
theological_decisions:
- issue: Wiedergabe von צָרַעַת
  choice: eine aussätzige Hautkrankheit
  alternative: Aussatz; Hautkrankheit
  rationale: Der hebräische Begriff ist weiter als die moderne Diagnose Lepra/Hansen-Krankheit und bezeichnet im biblischen Zusammenhang eine ernsthafte, kultisch relevante Erkrankung. Die gewählte Form wahrt beide Aspekte, ohne sie medizinisch festzulegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Quelltext enthält den Eigennamen. „Jahwe“ bewahrt ihn und verwendet die im Deutschen geläufige Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Satzglieder lösen die lange hebräische Ereignisfolge lesbar auf. Kultische Begriffe bleiben erkennbar, werden aber allgemein verständlich formuliert.
