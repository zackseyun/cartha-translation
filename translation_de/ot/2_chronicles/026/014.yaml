source:
  edition: WLC
  text: וַ/יָּכֶן֩ לָ/הֶ֨ם עֻזִּיָּ֜הוּ לְ/כָל הַ/צָּבָ֗א מָגִנִּ֤ים וּ/רְמָחִים֙ וְ/כ֣וֹבָעִ֔ים וְ/שִׁרְיֹנ֖וֹת וּ/קְשָׁת֑וֹת וּ/לְ/אַבְנֵ֖י קְלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: de
  text: Und Usija ließ für sie, für das ganze Heer, Schilde, Speere, Helme, Panzer, Bogen und Schleudersteine[a] bereitstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Steine der Schleudern; auch: Steine für Schleudern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: ließ … bereitstellen
  rationale: Der Hifil von כון bezeichnet hier, dass Usija die Ausrüstung für das Heer verfügbar beziehungsweise einsatzbereit machte; die Formulierung vermeidet die unbelegte Aussage, er habe sie selbst hergestellt.
- source_word: לָהֶם
  choice: für sie
  rationale: Bewahrt den hebräischen Rückverweis; der unmittelbar folgende Ausdruck erklärt, dass das Heer gemeint ist.
- source_word: לְכָל הַצָּבָא
  choice: für das ganze Heer
  rationale: צָבָא bezeichnet im Zusammenhang die militärische Streitmacht. „Heer“ ist eine geläufige, würdige deutsche Entsprechung.
- source_word: מָגִנִּים
  choice: Schilde
  rationale: Die übliche Bezeichnung für militärische Schutzschilde.
- source_word: רְמָחִים
  choice: Speere
  rationale: Eine natürliche und allgemein verständliche Wiedergabe der hier genannten Stangenwaffe.
- source_word: כּוֹבָעִים
  choice: Helme
  rationale: Im Zusammenhang einer Rüstungsliste bezeichnet das Wort schützende Kopfbedeckungen.
- source_word: שִׁרְיֹנוֹת
  choice: Panzer
  rationale: Bezeichnet eine Schutzrüstung für den Oberkörper; „Panzer“ ist im historischen militärischen Kontext prägnant und legt anders als „Kettenhemden“ keine bestimmte Machart fest.
- source_word: קְשָׁתוֹת
  choice: Bogen
  rationale: Direkte Wiedergabe des Plurals; im Deutschen steht „Bogen“ nach einer Aufzählung von Ausrüstungsarten idiomatisch ebenfalls im Plural.
- source_word: אַבְנֵי קְלָעִים
  choice: Schleudersteine
  rationale: Die hebräische Genitivverbindung bedeutet wörtlich „Steine der Schleudern“ und bezeichnet zum Schleudern bestimmte Steine.
