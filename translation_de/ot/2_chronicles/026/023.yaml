base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: de
  text: 'Usija entschlief zu seinen Vätern. Man begrub ihn bei seinen Vätern auf dem Begräbnisfeld, das den Königen gehörte; denn man sagte: »Er ist aussätzig[a].« Sein Sohn Jotam wurde an seiner Stelle König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat eine Hautkrankheit.« Der hebräische Ausdruck bezeichnet einen Menschen, der von צָרַעַת betroffen ist; diese biblische Kategorie kann weiter gefasst sein als die moderne Lepra (Hansen-Krankheit).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: entschlief zu seinen Vätern
  rationale: Die Wiedergabe bewahrt die formelhafte Rede vom Tod und die Verbindung mit den Vätern, ohne sie auf das schlichte »starb« zu reduzieren. »Entschlief« ist im Deutschen als würdevolle Todesumschreibung verständlich.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Man begrub ihn
  rationale: Das unbestimmte »man« gibt das aktive Verb im Plural wieder, dessen handelnde Personen im Hebräischen nicht näher bezeichnet werden.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vätern
  rationale: Im Bestattungssatz bezeichnet die Wendung die Zuordnung zur königlichen Begräbnisstätte, ohne zwingend dasselbe Grab zu behaupten. »Bei« ist dafür im Deutschen natürlicher als eine mechanische Wiederholung von »mit«.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: auf dem Begräbnisfeld
  rationale: »Begräbnisfeld« bewahrt das konkrete Bild von שָׂדֶה und ist zugleich verständliches Deutsch.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: das den Königen gehörte
  rationale: Die Formulierung gibt die durch ל ausgedrückte Zugehörigkeit knapp und idiomatisch wieder, ohne genauer festzulegen, ob rechtlicher Besitz oder vorgesehene Nutzung gemeint ist.
- source_word: כִּי אָמְרוּ
  choice: denn man sagte
  rationale: כִּי führt hier die Begründung für die besondere Bestattungssituation ein. Das unbestimmte Subjekt des hebräischen Plurals wird natürlich mit »man« wiedergegeben.
- source_word: מְצוֹרָע
  choice: aussätzig
  rationale: Die traditionelle Bezeichnung ist prägnant und entspricht der Aussage über eine von צָרַעַת betroffene Person. Da die hebräische Kategorie nicht genau mit moderner Lepra beziehungsweise der Hansen-Krankheit gleichzusetzen ist, erläutert eine Fußnote die weitere Bedeutung.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Nachfolgeformel bezeichnet das Verb den Herrschaftsantritt. »Wurde König« ist im modernen Deutschen natürlicher als »regierte« und macht den Übergang deutlich.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die dynastische Nachfolge und bewahrt stärker als »nach ihm« den Gedanken des Eintretens an die Stelle des Vorgängers.
theological_decisions:
- issue: Wiedergabe von מְצוֹרָע als rituell-medizinische Bezeichnung
  choice: Er ist aussätzig
  alternative: Er hat eine Hautkrankheit
  rationale: מְצוֹרָע bezeichnet einen Menschen, der von צָרַעַת betroffen ist. Diese biblische Kategorie kann verschiedene Hauterscheinungen umfassen und darf nicht unbesehen mit der modernen Hansen-Krankheit gleichgesetzt werden. Der Haupttext wahrt die traditionelle knappe Formulierung; die Fußnote erhält die sachlich weitere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll bewahrter biblischer Formelsprache. Die Todesformel bleibt erkennbar, während »man begrub« und »wurde König« natürlich und allgemein verständlich formuliert sind. Der Fußnotenmarker steht unmittelbar bei »aussätzig«, auf das die Anmerkung sachlich Bezug nimmt.
