  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: de
  text: Da nahm das ganze Volk von Juda Usija[a] – er war sechzehn Jahre alt[b] – und machte ihn anstelle seines Vaters Amazja zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „wählte Usija aus“. Das hebräische Verb bedeutet wörtlich „nahm“, bezeichnet hier aber die Handlung des Volkes bei seiner Erhebung zum König.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und er war sechzehn Jahre alt“. Die hebräische Konjunktion verbindet die Aussagen, ohne eindeutig einen Gegensatz im Sinn von „obwohl“ auszudrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: nahm
  rationale: לקח bedeutet wörtlich „nehmen“. Die Formulierung bewahrt dieses konkrete Verb; im Zusammenhang bezeichnet es die Wahl beziehungsweise Erhebung Usijas zum König.
- source_word: כָּל עַם יְהוּדָה
  choice: das ganze Volk von Juda
  rationale: Gibt sowohl כָּל („ganz“) als auch עַם („Volk“) ausdrücklich wieder und bezeichnet die Bevölkerung Judas als handelnde Gemeinschaft.
- source_word: עֻזִּיָּהוּ
  choice: Usija
  rationale: Entspricht der hier überlieferten Namensform עֻזִּיָּהוּ; die verwandte Namensform Asarja steht in diesem Vers nicht.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: er war sechzehn Jahre alt
  rationale: Die hebräische Altersangabe lautet wörtlich „er war ein Sohn von sechzehn Jahren“. Die deutsche Wendung ist idiomatisch und lässt die Konjunktion neutral, ohne einen nicht zwingenden Gegensatz wie „obwohl“ einzutragen.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: machte ihn … zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. „Krönte ihn“ würde eine Zeremonie voraussetzen, die der Vers nicht ausdrücklich nennt.
- source_word: תַּחַת
  choice: anstelle
  rationale: In einem Zusammenhang der Thronfolge bezeichnet תַּחַת die Nachfolge an der Stelle eines anderen.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: seines Vaters Amazja
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Verwandtschaftsbezeichnung und des Eigennamens.
