id: 2CH.26.4
reference: 2 Chronicles 26:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes[a] recht war, ganz so, wie sein Vater Amazja es getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem HERRN«.'
    reason: Traditionelle alternative Wiedergabe des Gottesnamens und der Wendung בְּעֵינֵי.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Wayyiqtol von עשה führt die erzählte Handlung fort. Im natürlichen Deutschen kann das einleitende ו ohne ausdrückliches „Und“ wiedergegeben werden.
- source_word: הַיָּשָׁר
  choice: was … recht war
  rationale: In Verbindung mit עשה bezeichnet יָשָׁר das moralisch Richtige. Die deutsche Wendung „tun, was recht ist“ gibt das Idiom natürlich und präzise wieder.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die bildhafte hebräische Wendung bezeichnet die Beurteilung aus jemandes Sicht und lässt sich im Deutschen transparent bewahren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen etablierten Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Formulierung drückt umfassende Übereinstimmung mit dem Vorbild aus; „ganz so, wie“ bewahrt sowohl den Vergleich als auch die verstärkende Kraft von כֹל.
- source_word: עָשָׂה
  choice: es getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Amazjas Handeln dem hier beschriebenen Handeln vorausging; „es“ nimmt „was … recht war“ auf.
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Dies ist die gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Im unmittelbaren geschichtlichen Zusammenhang ist Amazja der leibliche Vater Usijas; daher ist „Vater“ die genaue Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen; die traditionelle Titelwiedergabe wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Perspektivmetapher „in den Augen“ bleibt erhalten; der Satzbau ist zugleich flüssig und allgemein verständlich.
