  source_fidelity: Die Wiedergabe von יֶתֶר דִּבְרֵי als „die übrigen Taten“ trifft die chronistische Formel gut. „schrieb ... auf“ gibt כָּתַב angemessen wieder; die nicht eigens übersetzte einleitende Konjunktion ist im deutschen Satz unproblematisch. Die Formulierung „die früheren und die späteren“ ist jedoch keine idiomatische Wiedergabe der hebräischen Merismusformel und kann unnötig bestimmte frühere bzw. spätere Einzelereignisse nahelegen.
