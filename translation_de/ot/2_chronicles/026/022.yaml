  terminology: „Usijas“ ist als Genitiv zu „Usija“ korrekt; die Grundform des Namens ist im deutschen Text damit erkennbar. „Der Prophet Jesaja, der Sohn des Amoz“ bewahrt Titel und Patronym. Die Fußnote soll die wörtliche Entsprechung der korrigierten Merismusformel verwenden.
