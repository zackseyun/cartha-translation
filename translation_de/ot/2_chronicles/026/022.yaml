  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: de
  text: Die übrigen Taten Usijas[a], von Anfang bis Ende, schrieb der Prophet Jesaja, der Sohn des Amoz, auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die übrigen Worte Usijas, die ersten und die letzten«. »Worte« ist hier eine hebräische Ausdrucksweise aus der Geschichtsschreibung und bezeichnet die Ereignisse oder Taten seiner Regierungszeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Die übrigen
  rationale: יֶתֶר bezeichnet das, was noch übrig ist. Die eröffnende Konjunktion wird im Deutschen nicht eigens wiedergegeben, da der Zusammenhang bereits den Anschluss herstellt.
- source_word: דִּבְרֵי
  choice: Taten
  rationale: Wörtlich bedeutet das Wort »Worte« oder »Angelegenheiten«; in der königlichen Annalenformel bezeichnet es jedoch die Begebenheiten und Taten einer Regierungszeit.
- source_word: עֻזִּיָּהוּ
  choice: Usijas
  rationale: Dies ist die im Deutschen gebräuchliche Form des hier stehenden Namens; die andernorts verwendete Namensform Asarja wird nicht eingesetzt.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: die früheren und die späteren
  rationale: Die Wiedergabe bleibt nahe an der paarigen hebräischen Formulierung und umfasst damit die gesamte Regierungszeit, ohne sie zu einer freieren deutschen Redewendung umzuformen.
- source_word: כָּתַב
  choice: schrieb … auf
  rationale: Das Verb bedeutet »schreiben«; der trennbare Zusatz »auf« verdeutlicht im Deutschen natürlich die Funktion des schriftlichen Festhaltens.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: der Prophet Jesaja, der Sohn des Amoz
  rationale: Der Name, die Abstammungsangabe und der bestimmte Amtstitel werden vollständig und in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Bedeutung von דִּבְרֵי in der königlichen Annalenformel
  choice: Taten
  alternative: Worte; Begebenheiten
  rationale: Die Formel verweist auf den geschichtlichen Stoff der Regierungszeit. Die Fußnote bewahrt zugleich den wörtlicheren Ausdruck und macht die Auslegung sichtbar.
- issue: Umfang von הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: die früheren und die späteren
  alternative: von Anfang bis Ende; die ersten und die letzten
  rationale: Die gewählte Fassung erhält die Zweiteilung des Hebräischen und lässt offen, ob damit zeitliche Abschnitte oder die Gesamtheit der Taten hervorgehoben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung setzt den Verfasser vor die Herkunftsangabe und verwendet »aufschreiben« als natürliche deutsche Entsprechung, ohne den Inhalt über »schreiben« hinaus auszudeuten.
