base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: de
  text: Er suchte Gott beständig zur Zeit Secharjas, der in göttlichen Visionen Einsicht hatte[a]. Und solange er Jahwe suchte[b], gab Gott ihm Erfolg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der in der Furcht Gottes unterwies“. Der hebräische Ausdruck ist schwierig; der masoretische Text lautet wörtlicher etwa: „der beim Sehen Gottes Einsicht hatte“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „und in den Tagen, in denen er Jahwe suchte“.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Er suchte Gott beständig
  rationale: Die Verbindung von היה mit dem Infinitiv bezeichnet hier eine fortdauernde Haltung oder Praxis. „Beständig suchen“ gibt diesen durativen Sinn in natürlichem Deutsch wieder; דרש bezeichnet in diesem Zusammenhang die hingebungsvolle Ausrichtung auf Gott, nicht nur eine Anfrage.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: zur Zeit Secharjas
  rationale: Die idiomatische deutsche Wendung gibt die zeitliche Bedeutung von „in den Tagen Secharjas“ klar wieder, ohne den Sinn zu erweitern.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: der Einsicht in die Visionen Gottes hatte
  rationale: מֵבִין bezeichnet Einsicht oder Verständnis. Die masoretische Lesung von רְאֹת weist auf Sehen beziehungsweise visionäre Schau; „Visionen Gottes“ bewahrt diesen schwierigen Sinn, ohne ihn zur verbreiteten Alternativlesung „Gottesfurcht“ umzudeuten.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: Und solange er Jahwe suchte
  rationale: Die Zeitangabe bezeichnet den Zeitraum, der durch sein Suchen nach Jahwe geprägt war. „Solange“ bringt den durativen Zusammenhang mit dem folgenden Erfolg idiomatisch zum Ausdruck, ohne eine streng logische Bedingung ausdrücklich hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: gab Gott ihm Erfolg
  rationale: Der Hifil von צלח bezeichnet verursachten Erfolg oder Gelingen. Die Formulierung ist im Deutschen natürlich und wahrt Gott als den Handelnden.
theological_decisions:
- issue: Bedeutung von בִּרְאֹת הָאֱלֹהִים
  choice: Secharja hatte Einsicht in Visionen beziehungsweise Offenbarungsschau Gottes.
  alternative: Secharja unterwies in der Furcht Gottes beziehungsweise hatte darin Einsicht.
  rationale: Die masoretische Punktierung stützt eine Deutung im Bereich von „sehen“, auch wenn der Ausdruck ungewöhnlich ist. Die Hauptfassung wahrt diese textliche Schwierigkeit; die verbreitete Lesart mit „Furcht“ wird als echte Alternative in der Fußnote genannt.
- issue: Zeitlicher oder bedingender Sinn von וּבִימֵי דָּרְשׁוֹ
  choice: „solange er Jahwe suchte“ als durative Zeitangabe
  alternative: „in den Tagen, als er Jahwe suchte“
  rationale: „Solange“ gibt den Zeitraum und den erkennbaren Zusammenhang mit Gottes Gewährung von Erfolg wieder, ohne die Aussage zu einer abstrakten Heilsregel auszubauen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Zur Zeit“ und „gab ihm Erfolg“ vermeiden unnötig altertümliche oder schwerfällige Wendungen. Der schwierige hebräische Ausdruck bleibt in der Hauptfassung sichtbar und wird nicht konfessionell harmonisiert.
