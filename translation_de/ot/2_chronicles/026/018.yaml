  to: 'Sie traten König Usija entgegen[a] und sagten zu ihm: »Es steht dir nicht zu, Usija, dem HERRN Räucherwerk darzubringen. Das steht vielmehr den Priestern zu, den Söhnen Aarons, die geweiht sind, Räucherwerk darzubringen. Verlass das Heiligtum, denn du hast treulos gehandelt[b]. Das wird dir keine Ehre vom HERRN, Gott, einbringen[c].«'
