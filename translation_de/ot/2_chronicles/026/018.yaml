source:
  edition: WLC
  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: de
  text: 'Sie traten König Usija entgegen[a] und sagten zu ihm: »Es steht dir nicht zu, Usija, dem HERRN Räucherwerk darzubringen. Das steht vielmehr den Priestern zu, den Söhnen Aarons, die geweiht sind, Räucherwerk darzubringen. Verlass das Heiligtum, denn du hast treulos gehandelt[b]. Das wird dir keine Ehre vom HERRN, Gott, einbringen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie widersetzten sich König Usija« beziehungsweise »Sie stellten ihn zur Rede«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du hast dich vergangen«. Das hebräische Verb bezeichnet häufig treuloses Handeln, besonders einen schweren Verstoß im heiligen oder bundesbezogenen Bereich.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »und nicht dir zur Ehre vom HERRN, Gott«. Der hebräische Ausdruck ist verkürzt und besagt, dass diese Tat Usija keine vom HERRN, Gott, kommende Ehre bringen wird.'
    reason: textual_clarity
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: Sie traten ... entgegen
  rationale: Die Wendung bezeichnet hier ein entschiedenes Auftreten gegen den König, nicht bloß ein Stehen in seiner Nähe. »Entgegentreten« gibt diesen Widerstand natürlich und präzise wieder.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: König Usija
  rationale: Die im Deutschen natürliche Stellung des Titels vor dem Namen bewahrt den Referenten und den königlichen Rang.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Es steht dir nicht zu ... Räucherwerk darzubringen
  rationale: Die Konstruktion bestreitet Usija das Recht beziehungsweise die Zuständigkeit für diese kultische Handlung, ohne moderne Verwaltungssprache einzuführen.
- source_word: לְהַקְטִיר
  choice: Räucherwerk darzubringen
  rationale: Das Hifil von קטר bezeichnet in diesem Zusammenhang das Verbrennen beziehungsweise Darbringen von Räucherwerk. »Darbringen« hebt den Opfercharakter hervor.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit »HERR« in Kapitälchen ist würdig und allgemein verständlich.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: Das steht vielmehr den Priestern zu, den Söhnen Aarons
  rationale: Das Hebräische weist die Aufgabe ausschließlich den aaronitischen Priestern zu. Die Wiederaufnahme von »steht ... zu« macht den elliptischen Gegensatz im Deutschen klar.
- source_word: הַמְקֻדָּשִׁים
  choice: die geheiligt sind
  rationale: Das passive Partizip beschreibt Menschen, die für den heiligen Dienst ausgesondert beziehungsweise geweiht wurden. »Geheiligt« bewahrt die sakrale Bedeutung.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Verlass das Heiligtum
  rationale: Die direkte Aufforderung klingt im Deutschen natürlich; »Heiligtum« bezeichnet den heiligen Tempelbereich, ohne ihn unnötig auf einen bestimmten Innenraum einzuengen.
- source_word: מָעַלְתָּ
  choice: du hast treulos gehandelt
  rationale: מעל bezeichnet besonders im kultischen und bundesbezogenen Zusammenhang einen schweren Treuebruch oder ein Vergehen am Heiligen, nicht nur einen Verfahrensfehler.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: Das wird dir keine Ehre von Gott, dem HERRN, einbringen
  rationale: Der hebräische Satz ist elliptisch. Die Wiedergabe macht verständlich, dass Usijas Tat ihm keine von Gott kommende Ehre verschaffen wird, ohne ausdrücklich eine im Text nicht genannte Schande hinzuzufügen.
theological_decisions:
- issue: Ausschließliche Zuständigkeit der aaronitischen Priester für das Räucheropfer
  choice: Das Darbringen von Räucherwerk wird hier den geheiligten Priestern, den Söhnen Aarons, vorbehalten.
  alternative: Eine allgemeine Aussage über geistliche Leitung oder über das Verhältnis von Königtum und Priestertum.
  rationale: Der Vers behandelt konkret das Räucheropfer im Heiligtum. Die Übersetzung bewahrt diese kultische Begrenzung, ohne daraus eine umfassendere Lehre abzuleiten.
- issue: Gewicht von מָעַלְתָּ
  choice: Usija hat durch sein Handeln einen schweren Treuebruch im heiligen Bereich begangen.
  alternative: Usija hat lediglich einen formalen oder verfahrensmäßigen Fehler gemacht.
  rationale: Das Verb מעל trägt in kultischen Zusammenhängen den Sinn von Untreue, Veruntreuung oder sakralem Vergehen. »Treulos gehandelt« erhält diesen Ernst, ohne eine spätere dogmatische Kategorie einzuführen.
- issue: Herkunft der Ehre im letzten Satzteil
  choice: Die Tat wird Usija keine von Gott kommende Ehre verschaffen.
  alternative: Die Aussage bedeute ausdrücklich, Gott werde Usija aktiv Schande zufügen.
  rationale: Der hebräische Wortlaut verneint die Ehre, nennt aber nicht ausdrücklich eine aktive Zufügung von Schande. Die Übersetzung wahrt diese Begrenzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. »Räucherwerk darbringen«, »Heiligtum« und »geheiligt« bewahren den kultischen Ton, ohne altertümliche Satzformen zu verwenden. Der Gottesname wird als »HERR« in Kapitälchen wiedergegeben.
