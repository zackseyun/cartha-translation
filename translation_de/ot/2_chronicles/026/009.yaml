base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: de
  text: Usija baute in Jerusalem Türme am Ecktor, am Taltor und am Winkel[a] und befestigte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Ecke“. Das hebräische Wort bezeichnet einen Winkel, eine Ecke oder einen Wendepunkt in einer Befestigungsanlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: בנה bedeutet hier schlicht „bauen“; „baute“ ist im Deutschen natürlich und entspricht dem Erzählstil.
- source_word: עֻזִּיָּהוּ
  choice: Usija
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Namensform wiedergegeben.
- source_word: מִגְדָּלִים
  choice: Türme
  rationale: מִגְדָּלִים bezeichnet Türme; eine zusätzliche militärische Bestimmung ist im Substantiv selbst nicht ausgedrückt.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Die Präposition בְּ ist hier lokal zu verstehen; „in Jerusalem“ ist direkt und idiomatisch.
- source_word: עַל
  choice: am
  rationale: Bei Toren und Befestigungsanlagen bezeichnet עַל hier den Standort. „Am“ ist natürlicher als ein wörtliches „auf“ und vermeidet die Vorstellung, die Türme hätten oben auf den Toren gestanden.
- source_word: שַׁעַר הַפִּנָּה
  choice: Ecktor
  rationale: Die Constructusverbindung benennt ein Stadttor; „Ecktor“ ist eine klare, knappe deutsche Wiedergabe.
- source_word: שַׁעַר הַגַּיְא
  choice: Taltor
  rationale: גַּיְא bedeutet „Tal“; als Torname ist „Taltor“ idiomatisch.
- source_word: הַמִּקְצוֹעַ
  choice: Mauerwinkel
  rationale: Das Substantiv bezeichnet einen Winkel, eine Ecke oder einen Wendepunkt einer baulichen Anlage. „Mauerwinkel“ verdeutlicht den topografisch-architektonischen Sinn und unterscheidet die Stelle vom zuvor genannten Ecktor.
- source_word: וַיְחַזְּקֵם
  choice: und befestigte sie
  rationale: חזק im Piel bedeutet „stärken“ oder „befestigen“. Im Zusammenhang mit Türmen und Stadtverteidigung gibt „befestigte“ den Sinn treffend wieder; das Suffix bezieht sich am natürlichsten auf die Türme.
