source:
  edition: WLC
  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: de
  text: Die Ammoniter entrichteten Usija Tribut, und sein Ruhm breitete sich bis zum Zugang nach Ägypten aus[a], denn er war überaus mächtig geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Zugang nach Ägypten« kann die Anmarschroute nach Ägypten oder dessen Grenzgebiet bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: die Ammoniter
  rationale: Die übliche und klare deutsche Bezeichnung für das Volk Ammon.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im politischen Zusammenhang bezeichnet das Wort eine Abgabe an einen König, nicht eine kultische Opfergabe oder ein gewöhnliches Geschenk.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: sein Ruhm breitete sich aus
  rationale: Die wörtliche Wendung »sein Name ging« bezeichnet idiomatisch die Ausbreitung seines Rufs oder Ruhms.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: bis zum Zugang nach Ägypten
  rationale: Bewahrt das hebräische Bild eines Zugangs beziehungsweise der Grenz- oder Anmarschregion Ägyptens, ohne es vorschnell auf eine bestimmte geografische Linie festzulegen.
- source_word: הֶחֱזִיק
  choice: war mächtig geworden
  rationale: Die Hifil-Form beschreibt hier, dass Usija große Stärke beziehungsweise Macht erlangt hatte.
- source_word: עַד לְמָעְלָה
  choice: überaus
  rationale: Die Wendung verstärkt das vorausgehende Verb und bezeichnet ein außergewöhnlich hohes Maß.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wiedergabe »sein Ruhm breitete sich aus« vermittelt den Sinn von »sein Name ging«, während die geografisch nicht völlig eindeutige Formulierung »Zugang nach Ägypten« erhalten bleibt.
