id: 2CH.26.7
reference: 2 Chronicles 26:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: de
  text: Gott half ihm gegen die Philister, gegen die Araber, die in Gur-Baal wohnten, und gegen die Meuniter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Maoniter«. Der hebräische Volksname kann eine verwandte Gruppe oder eine abweichende Form des Namens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: half ihm
  rationale: Das Verb עזר mit dem Suffix der 3. Person Singular bedeutet hier unmittelbar „half ihm“; die deutsche Erzählform bewahrt Gott als handelndes Subjekt.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Trotz des hebräischen Artikels ist dies in der Erzählung die übliche Bezeichnung für Israels Gott; modernes Deutsch verwendet idiomatisch „Gott“.
- source_word: עַל
  choice: gegen
  rationale: In Verbindung mit „helfen“ bezeichnet עַל hier im militärischen Zusammenhang die Gegner, gegen die Ussija Unterstützung erhielt.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung der Volksgruppe.
- source_word: הערביים
  choice: die Araber
  rationale: Der Ausdruck bezeichnet arabische Volksgruppen; „Araber“ ist im heutigen Standarddeutsch natürlicher als „Arabier“ und wird hier historisch, nicht modern-politisch, gebraucht.
- source_word: הַיֹּשְׁבִים
  choice: die … wohnten
  rationale: Das Partizip von ישב bezeichnet dauerhaftes Wohnen oder Ansässigsein; „wohnten“ ist klar und idiomatisch.
- source_word: בְּגוּר בָּעַל
  choice: in Gur-Baal
  rationale: Der Ortsname wird transkribiert; ב wird bei einem Wohnort natürlich mit „in“ wiedergegeben.
- source_word: הַמְּעוּנִים
  choice: die Meuniter
  rationale: „Meuniter“ gibt die Konsonantenform מעונים als Volksnamen wieder; da die genaue Identifikation unsicher ist und eine Verbindung zu Maon erwogen wird, bleibt die Alternative in einer Fußnote erhalten.
theological_decisions: []
