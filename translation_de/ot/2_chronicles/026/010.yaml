  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: de
  text: Er baute Türme[a] in der Steppe und hieb viele Zisternen aus; denn er hatte viel Vieh in der Schefela[b] und in der Ebene sowie Ackerbauern und Winzer im Bergland und im fruchtbaren Land[c], denn er liebte den Ackerboden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wachtürme“.'
    reason: lexical_alternative
  - marker: b
    text: Die Schefela ist das westlich des judäischen Berglands gelegene Hügelland.
    reason: cultural_note
  - marker: c
    text: 'Oder: „am Karmel“, wenn das Wort als Ortsname und nicht als Bezeichnung für fruchtbares Land verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: Türme
  rationale: Das Substantiv bezeichnet allgemein Türme. „Wachtürme“ ist im gegebenen Zusammenhang möglich, würde ihre Funktion aber stärker festlegen als der hebräische Text.
- source_word: בַּמִּדְבָּר
  choice: in der Steppe
  rationale: מִדְבָּר kann unbesiedeltes Weide- oder Steppenland bezeichnen. „Steppe“ passt zum genannten Viehbestand und vermeidet die im Deutschen oft mit völliger Trockenheit verbundene Vorstellung von „Wüste“.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: hieb viele Zisternen aus
  rationale: חצב bezeichnet das Aushauen oder Ausmeißeln; בּוֹרוֹת meint hier am ehesten Sammelgruben für Wasser. Die Formulierung gibt die Anlage von Zisternen präzise wieder.
- source_word: מִקְנֶה רַב
  choice: viel Vieh
  rationale: מִקְנֶה ist eine kollektive Bezeichnung für den Tierbestand und wird nicht unnötig auf Rinder oder bestimmte Herden eingeengt.
- source_word: שְׁפֵלָה
  choice: Schefela
  rationale: Hier ist die konkrete judäische Hügellandregion gemeint. Die eingebürgerte geografische Bezeichnung bewahrt diesen Bezug; eine Fußnote erläutert sie.
- source_word: מִישׁוֹר
  choice: Ebene
  rationale: Das Wort bezeichnet ebenes oder flaches Land; „Ebene“ ist eine klare und nicht übermäßig spezifizierende deutsche Wiedergabe.
- source_word: אִכָּרִים
  choice: Ackerbauern
  rationale: Das Wort bezeichnet Bearbeiter des Bodens. „Ackerbauern“ ist präziser als das umfassendere „Bauern“.
- source_word: כֹרְמִים
  choice: Weingärtner
  rationale: Gemeint sind Menschen, die Weinberge beziehungsweise Reben pflegen. „Weingärtner“ ist im modernen Deutsch natürlich und spezifisch.
- source_word: בֶּהָרִים
  choice: im Bergland
  rationale: Der Plural kann Berge oder gebirgiges Gelände bezeichnen. „Bergland“ passt als regionale Geländeangabe zur parallelen Aufzählung.
- source_word: בַּכַּרְמֶל
  choice: im fruchtbaren Land
  rationale: כַּרְמֶל kann als Gattungsbegriff fruchtbares, garten- oder obstbaumreiches Land bezeichnen. Der landwirtschaftliche Zusammenhang stützt diese Deutung, ohne die mögliche Lesart als Ortsname zu verschweigen.
- source_word: אֹהֵב אֲדָמָה
  choice: er liebte den Ackerboden
  rationale: Die konkrete Bedeutung von אֲדָמָה als Erde oder Boden bleibt erhalten. „Ackerboden“ verdeutlicht im Zusammenhang den landwirtschaftlichen Bezug, ohne den Ausdruck vollständig zu „er liebte den Ackerbau“ zu abstrahieren.
