  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: de
  text: Der König fertigte einen großen Thron aus Elfenbein an und überzog ihn mit reinem Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen großen Thron aus Zahn“; „Zahn“ bezeichnet hier Elfenbein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ließ … anfertigen
  rationale: Das Verb עשה bedeutet hier „machen/anfertigen“. Die deutsche Kausativform klingt bei einem königlichen Bauauftrag natürlich, ohne auszuschließen, dass der König als Auftraggeber bezeichnet wird.
- source_word: הַמֶּלֶךְ
  choice: Der König
  rationale: Der bestimmte Titel wird direkt wiedergegeben; obwohl im Zusammenhang Salomo gemeint ist, nennt der hebräische Text hier nicht seinen Namen.
- source_word: כִּסֵּא
  choice: Thron
  rationale: כִּסֵּא bezeichnet in diesem königlichen Zusammenhang den Herrschersitz, daher ist „Thron“ präziser als „Sitz“.
- source_word: שֵׁן
  choice: aus Elfenbein
  rationale: שֵׁן bedeutet wörtlich „Zahn“, bezeichnet in dieser Materialangabe jedoch Elfenbein. „Aus Elfenbein“ gibt die hebräische Nominalverbindung verständlich wieder, lässt die genaue Konstruktion des Thrones aber entsprechend dem Ausgangstext offen.
- source_word: גָּדוֹל
  choice: großen
  rationale: גָּדוֹל kann Größe, Bedeutung oder Pracht ausdrücken. „groß“ bewahrt diese Bedeutungsbreite besser als eine stärker festlegende Wiedergabe wie „gewaltig“ oder „prächtig“.
- source_word: וַיְצַפֵּהוּ
  choice: überzog ihn
  rationale: Das Piel von צפה bezeichnet hier das Überziehen beziehungsweise Verkleiden eines Gegenstands mit einem Material. „überzog ihn“ ist im Deutschen sachlich und idiomatisch.
- source_word: זָהָב טָהוֹר
  choice: reinem Gold
  rationale: Die feste Verbindung wird direkt und natürlich wiedergegeben; טָהוֹר beschreibt beim Gold dessen Reinheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und erzählerisch natürlich; „groß“ bewahrt die mögliche Spannung zwischen räumlicher Größe und königlicher Pracht.
