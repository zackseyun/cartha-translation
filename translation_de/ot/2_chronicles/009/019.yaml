- from: Und zwölf Löwen standen dort auf den sechs Stufen, auf dieser und auf jener Seite.[a] Nichts dergleichen war für irgendein Königreich angefertigt worden.
  to: Und zwölf Löwen standen dort auf den sechs Stufen, auf beiden Seiten.[a] Für kein Königreich war je etwas Vergleichbares angefertigt worden.
  rationale: Die räumliche Formel wird idiomatisch mit „auf beiden Seiten“ wiedergegeben, ohne die genaue Zuordnung der Löwen im Haupttext festzulegen. Die Fußnote korrigiert die distributive Alternative, sodass sie eindeutig zwölf Löwen auf sechs Stufen ergibt. Der Schlusssatz wird natürlich formuliert und behält die vergleichende, passive Aussage des Hebräischen bei.
