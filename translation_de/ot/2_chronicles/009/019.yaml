  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָי֗וֹת עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: de
  text: Und zwölf Löwen standen dort auf den sechs Stufen, auf beiden Seiten.[a] Für kein Königreich war je etwas Vergleichbares angefertigt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zwölf Löwen standen dort auf den sechs Stufen, je einer auf jeder Seite jeder Stufe.“'
    reason: Die hebräische Ortsangabe kann allgemein die beiden Seiten bezeichnen oder distributiv so verstanden werden, dass auf jeder Seite jeder der sechs Stufen ein Löwe stand.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר
  choice: Und zwölf
  rationale: Die Kardinalzahl führt ein weiteres Merkmal des Throns ein; וּ wird im fortlaufenden Beschreibungstext natürlich mit „Und“ wiedergegeben.
- source_word: אֲרָיוֹת
  choice: Löwen
  rationale: Der Plural bezeichnet die Löwenfiguren am Thron.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip beschreibt den anhaltenden Standort der Figuren; „standen“ ist im Deutschen idiomatisch und bewahrt den anschaulichen Charakter.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf die zuvor beschriebene Thronanlage.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: auf den sechs Stufen
  rationale: מַעֲלוֹת bezeichnet hier die zum Thron hinaufführenden Stufen; עַל wird räumlich eng mit „auf“ wiedergegeben.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf dieser und auf jener Seite
  rationale: Die distributive Ortsangabe bezeichnet beide Seiten der Treppe. Die bewusst nahe Wiedergabe erhält die räumliche Symmetrie, ohne die genaue Verteilung im Haupttext stärker festzulegen als der hebräische Wortlaut.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Nichts dergleichen war … angefertigt worden
  rationale: Die passive Konstruktion mit כֵן drückt aus, dass nichts Vergleichbares hergestellt worden war; „angefertigt“ passt zu dem kunstvoll gestalteten Thron.
- source_word: לְכָל מַמְלָכָה
  choice: für irgendein Königreich
  rationale: Im Bereich der Negation hat כָל den Sinn „irgendein/kein“; לְ bezeichnet hier, für wen ein vergleichbares Werk angefertigt worden wäre.
