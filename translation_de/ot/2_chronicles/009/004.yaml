base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: de
  text: die Speisen auf seinem Tisch, die Sitzordnung seiner Diener, das Aufwarten seiner Bediensteten und ihre Kleidung, seine Mundschenken und ihre Kleidung sowie den Aufgang, auf dem er zum Haus Jahwes hinaufging[a] – da blieb ihr kein Atem mehr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach der Parallelstelle in 1. Könige 10,5: „das Brandopfer, das er im Haus Jahwes darbrachte“. Der vorliegende hebräische Text bedeutet am natürlichsten „der Aufgang, auf dem er hinaufging“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Da war kein Atem mehr in ihr“ – eine bildhafte Wendung für überwältigtes Erstaunen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: die Speisen auf seinem Tisch
  rationale: מַאֲכָל bezeichnet Nahrung oder Speisen. Die Formulierung ist konkret, natürlich und bewahrt das Bild der königlichen Tafel.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: die Sitzordnung seiner Diener
  rationale: מוֹשָׁב kann den Sitz, Sitzplatz oder die Anordnung der Sitzplätze bezeichnen. Im höfischen Zusammenhang gibt „Sitzordnung“ die sichtbar geordnete Aufstellung treffend wieder; עֲבָדָיו bezeichnet hier königliche Diener beziehungsweise Hofbeamte.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: das Aufwarten seiner Bediensteten
  rationale: מַעֲמַד bezeichnet wörtlich Stand oder Aufstellung und hier wahrscheinlich den geordneten Dienst der am Hof Aufwartenden. „Bedienstete“ unterscheidet מְשָׁרְתָיו von den zuvor genannten עֲבָדָיו, ohne einen modernen politischen Ministerbegriff einzutragen.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: ihre Kleidung
  rationale: Das Wort bezeichnet Kleidung oder Gewänder. „Kleidung“ ist gegenwärtiges, klares Standarddeutsch.
- source_word: מַשְׁקָיו
  choice: seine Mundschenken
  rationale: Im königlichen Umfeld sind damit die für den Getränkedienst zuständigen Amtsträger gemeint. „Mundschenken“ ist die präzise etablierte deutsche Bezeichnung.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: die Treppe, auf der er zum Haus Jahwes hinaufging
  rationale: Der masoretische Text bezeichnet am natürlichsten einen Aufgang beziehungsweise eine Treppe, auf der Salomo zum Heiligtum hinaufging. Die abweichende Lesart der Parallelstelle wird in einer Fußnote erhalten.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: בֵּית wird als „Haus“ wiedergegeben und der Gottesname יְהוָה als „Jahwe“, sodass die hebräische Bezeichnung transparent bleibt.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: da blieb ihr kein Atem mehr
  rationale: רוּחַ kann Atem, Geist oder Wind bedeuten. Die Formulierung bewahrt das körperliche Bild des hebräischen Ausdrucks und ist zugleich im Deutschen als überwältigtes Erstaunen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, um den im Ausgangstext stehenden Bundesnamen sichtbar zu erhalten.
- issue: Bedeutung von רוּחַ in der abschließenden Wendung
  choice: Atem
  alternative: Geist
  rationale: Im Kontext beschreibt die Wendung die überwältigende Reaktion der Königin. „Atem“ bewahrt das konkrete Bild, ohne den Ausdruck als Aussage über ihren inneren Geist theologisch zu überladen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der höfische Charakter der Aufzählung bleibt erhalten; zugleich werden unnötig altertümliche Wendungen vermieden. Der Gedankenstrich macht den Übergang von der langen Aufzählung zur Reaktion der Königin lesbar.
