  text: וַ/יַּגֶּד לָ֥/הּ שְׁלֹמֹ֖ה אֶת כָּל דְּבָרֶ֑י/הָ וְ/לֹֽא נֶעְלַ֤ם דָּבָר֙ מִ/שְּׁלֹמֹ֔ה אֲשֶׁ֧ר לֹ֦א הִגִּ֖יד לָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: de
  text: Und Salomo beantwortete alle ihre Fragen[a]; nichts war Salomo verborgen, das er ihr nicht erklärte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und Salomo teilte ihr alle ihre Worte“; „Worte“ kann hier auch „Angelegenheiten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „das er ihr nicht mitteilte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: beantwortete
  rationale: נגד bedeutet grundsätzlich „mitteilen/sagen“. Zusammen mit den von der Königin vorgebrachten schwierigen Fragen bezeichnet es hier idiomatisch Salomos Antwort; „beantwortete“ gibt diesen Zusammenhang natürlich wieder.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: alle ihre Fragen
  rationale: דְּבָרֶיהָ heißt wörtlich „ihre Worte/Sachen“. Im unmittelbaren Kontext sind damit die schwierigen Fragen beziehungsweise Anliegen der Königin gemeint.
- source_word: נֶעְלַם ... מִשְּׁלֹמֹה
  choice: war Salomo verborgen
  rationale: Der Niphal von עלם bezeichnet das Verborgensein; מן kennzeichnet die Person, vor der etwas verborgen ist. Die Formulierung bewahrt das Bild des hebräischen Textes.
- source_word: דָּבָר
  choice: nichts
  rationale: Das singularische דָּבָר ergibt mit der Verneinung idiomatisch „nichts“ beziehungsweise „keine Sache“.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: das er ihr nicht erklärte
  rationale: Das erneut verwendete נגד heißt wörtlich „sagen/mitteilen“. „Erklärte“ macht im Kontext schwieriger Fragen deutlich, dass Salomo ihr die betreffenden Sachverhalte erschloss; die wörtlichere Möglichkeit wird in der Fußnote genannt.
