source:
  edition: WLC
  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: de
  text: Auch die Diener Hirams[c] und die Diener Salomos, die Gold aus Ofir brachten, brachten Algumholz[a] und Edelsteine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Almugholz“; welche Baumart mit dem hebräischen Wort genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „kostbarer Stein“; die Einzahl ist wahrscheinlich kollektiv gemeint.'
    reason: lexical_alternative
  - marker: c
    text: In der Chronik wird der Name in manchen Übersetzungstraditionen auch „Huram“ wiedergegeben; hier steht im hebräischen Text die Form „Hiram“.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die additive und zugleich fortführende Funktion wird im Deutschen natürlich durch „Auch“ wiedergegeben; ein zusätzliches „und“ wäre möglich, aber stilistisch schwerfälliger.
- source_word: עַבְדֵי
  choice: Diener
  rationale: Im königlich-administrativen Zusammenhang bezeichnet עבד hier Personen im Dienst eines Königs, ohne dass ihr genauer rechtlicher Status festgelegt wird.
- source_word: חירם
  choice: Hiram
  rationale: Die masoretische Form in diesem Vers wird als „Hiram“ wiedergegeben.
- source_word: וְעַבְדֵי שְׁלֹמֹה
  choice: und die Diener Salomos
  rationale: Die Wiedergabe wahrt die Parallelität zur vorangehenden Wortgruppe.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: die Gold aus Ofir brachten
  rationale: Der Relativsatz bezeichnet die Diener näher. Das einfache Präteritum gibt den hebräischen Satz natürlich wieder, ohne eine Vorzeitigkeit festzulegen.
- source_word: הֵבִיאוּ
  choice: brachten
  rationale: Das Hifil von בוא bedeutet „bringen“; „importieren“ wäre stärker wirtschaftlich deutend.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: Algumholz
  rationale: Die botanische Art ist unsicher. Eine zurückhaltende lautnahe Wiedergabe vermeidet die nicht gesicherte Bestimmung als Sandelholz.
- source_word: וְאֶבֶן יְקָרָה
  choice: und Edelsteine
  rationale: Das formal singularische אֶבֶן kann kollektiv gebraucht sein; in einer Aufzählung von Handelsgütern ist der deutsche Plural idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „brachten“ bleibt erhalten, weil sie die Struktur des hebräischen Satzes abbildet. „Algumholz“ bewahrt die lexikalische Unsicherheit, statt eine bestimmte Holzart vorauszusetzen.
