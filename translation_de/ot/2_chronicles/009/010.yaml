  terminology: „Diener“ wahrt den im Kontext nicht näher bestimmten Status von עבד. Die Namen Hiram und Salomo sowie der Ortsname Ofir sind konsistent. „Algumholz“ vermeidet eine ungesicherte botanische Identifizierung; die Fußnote nennt „Almugholz“ korrekt als Alternative. Die Fußnotenanker stehen jeweils bei dem einschlägigen Ausdruck.
