  source_fidelity: 'Der deutsche Text gibt die hebräische Satzstruktur und den Sinn zuverlässig wieder: die beiden Gruppen von Dienern werden durch den Relativsatz näher bestimmt, und die Wiederholung von „brachten“ entspricht dem zweimaligen הֵבִיאוּ. „Gold aus Ofir“, „Algumholz“ und „Edelsteine“ sind sachgerecht. Die pluralische Wiedergabe von וְאֶבֶן יְקָרָה ist als kollektiver Singular gut begründet.'
