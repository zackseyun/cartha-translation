  source_fidelity: 'Der deutsche Text gibt sämtliche Sinnelemente des Hebräischen zutreffend wieder: die Kunde von Salomo, die Reise nach Jerusalem zum Zweck der Prüfung durch Rätsel, das sehr große Gefolge, die mit Gewürzen, reichlich Gold und kostbaren Steinen beladenen Kamele sowie das Gespräch über alles, was die Königin bewegte. Die Aufteilung der hebräischen Satzfolge in kurze deutsche Sätze verändert den Sinn nicht.'
