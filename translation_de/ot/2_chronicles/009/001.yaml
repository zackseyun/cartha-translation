source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: de
  text: Die Königin von Saba hörte von Salomos Ruhm[a]. Sie kam mit einem sehr großen Gefolge nach Jerusalem, um Salomo mit Rätseln[b] auf die Probe zu stellen. Ihre Kamele trugen Gewürze, Gold in großer Menge und kostbare Steine. Als sie zu Salomo kam, sprach sie mit ihm über alles, was sie auf dem Herzen hatte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hörte den Bericht über Salomo“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit schwierigen Fragen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „alles, was in ihrem Herzen war“; gemeint sind ihre Gedanken, Fragen und Anliegen.'
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: Ruhm
  rationale: Die Wendung bezeichnet das, was über Salomo bekannt geworden war. „Ruhm“ gibt den idiomatischen Sinn natürlich wieder; „Bericht“ bleibt als mögliche, stärker wörtliche Alternative in der Fußnote erhalten.
- source_word: לְנַסּוֹת
  choice: auf die Probe zu stellen
  rationale: Das Verb bezeichnet hier das Prüfen von Salomos Weisheit beziehungsweise Fähigkeit und wird im Deutschen idiomatisch mit „auf die Probe stellen“ wiedergegeben.
- source_word: בְחִידוֹת
  choice: mit Rätseln
  rationale: Das hebräische Wort bezeichnet Rätsel oder schwer zu lösende, rätselhafte Fragen. „Rätsel“ wahrt die konkrete Bildlichkeit des Ausdrucks.
- source_word: בִּירוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Bei einem Bewegungsverb bezeichnet die Präposition hier das Ziel; modernes Deutsch verwendet dafür natürlich „nach Jerusalem“.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: mit einem sehr großen Gefolge
  rationale: חַיִל kann Streitmacht, Vermögen oder eine größere Personengruppe bezeichnen. Im Zusammenhang der königlichen Reise mit Kamelen und kostbaren Gütern ist „Gefolge“ am wahrscheinlichsten, ohne einen militärischen Zug vorauszusetzen.
- source_word: בְּשָׂמִים
  choice: Gewürze
  rationale: Der Plural bezeichnet wohlriechende Gewürze beziehungsweise Aromastoffe. „Gewürze“ ist in diesem Geschenkkontext verständlich und üblich.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung hebt die außergewöhnlich große Menge des Goldes hervor und wird so klar und natürlich wiedergegeben.
- source_word: אֶבֶן יְקָרָה
  choice: kostbare Steine
  rationale: Der singularische hebräische Ausdruck kann kollektiv gebraucht sein. Der deutsche Plural passt natürlich zur Aufzählung der mitgebrachten Kostbarkeiten.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: sprach sie mit ihm
  rationale: דבר mit עִם bezeichnet ein Sprechen mit jemandem und lässt einen Austausch erkennen, nicht nur eine einseitige Ansprache.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: über alles, was sie auf dem Herzen hatte
  rationale: Die hebräische Herzenswendung umfasst Gedanken, Fragen und Anliegen. Die deutsche Redewendung bewahrt das Herzmotiv und vermittelt zugleich den idiomatischen Sinn.
theological_decisions: []
