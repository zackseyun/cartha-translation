source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: de
  text: Der König machte Silber in Jerusalem so gewöhnlich wie Steine, und Zedern machte er so zahlreich wie die Maulbeerfeigenbäume im Hügelland[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Schefela«, dem judäischen Hügelland westlich des zentralen Berglands.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: machte
  rationale: Das Verb bedeutet wörtlich »gab« oder »setzte«, bezeichnet hier aber idiomatisch, dass der König etwas in einen Zustand großer Verfügbarkeit beziehungsweise Menge versetzte. »Machte« bewahrt diesen bewirkenden Sinn.
- source_word: הַכֶּסֶף
  choice: Silber
  rationale: Das Substantiv bezeichnet hier das Edelmetall, nicht ausdrücklich Münzgeld.
- source_word: כָּאֲבָנִים
  choice: so gewöhnlich wie Steine
  rationale: Der Vergleich betrifft die alltägliche Verfügbarkeit beziehungsweise Häufigkeit; »so gewöhnlich wie« drückt die im knappen hebräischen Vergleich vorausgesetzte Fülle natürlich aus.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte Ortsangabe.
- source_word: הָאֲרָזִים
  choice: Zedern
  rationale: Der Plural kann Zedern beziehungsweise Zedernholz als verfügbares Gut bezeichnen. Die knappe Wiedergabe erhält das Bild des Ausgangstextes.
- source_word: כַּשִּׁקְמִים
  choice: wie die Maulbeerfeigenbäume
  rationale: שִׁקְמִים bezeichnet die Maulbeerfeige (Ficus sycomorus), nicht die im heutigen Sprachgebrauch ebenfalls »Sykomore« genannten Ahornarten. Die botanisch eindeutige Bezeichnung verhindert ein modernes Missverständnis.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: im Hügelland
  rationale: שְׁפֵלָה bezeichnet hier die Schefela, das westlich des judäischen Berglands gelegene niedrige Hügelland. Die verständliche Sachbezeichnung steht im Text, der regionale Eigenname in der Fußnote.
- source_word: לָרֹב
  choice: so zahlreich
  rationale: Die abschließende Wendung betont die große Menge und wird idiomatisch in den Vergleich der Zedern mit den Maulbeerfeigenbäumen integriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung von »machte« erhält die Struktur des Hebräischen; die Vergleichsformulierungen geben dessen gemeinte große Häufigkeit ausdrücklich und natürlich wieder.
