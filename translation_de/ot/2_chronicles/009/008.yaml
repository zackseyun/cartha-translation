    rationale: לְהַעֲמִידוֹ לְעוֹלָם ist ein finaler Infinitiv („um es für immer zu erhalten/zu festigen“), nicht das lexikalisch ausgedrückte Verb „wollen“. Die Formulierung verändert die Satzbeziehung und reduziert die überlieferte Mehrdeutigkeit.
