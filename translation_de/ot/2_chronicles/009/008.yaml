language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: de
  text: Gepriesen sei der HERR, dein Gott,[a] der Gefallen an dir hatte und dich auf seinen Thron setzte als König für den HERRN, deinen Gott. Weil dein Gott Israel liebte – um es für immer zu erhalten –, hat er dich als König über sie eingesetzt, damit du für Recht und Gerechtigkeit sorgst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der HERR, dein Gott, sei gesegnet.“'
    reason: Die Segensformel kann im Deutschen sowohl als Lobpreis („Gepriesen sei“) als auch näher am Passiv („sei gesegnet“) wiedergegeben werden.
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die Jussivkonstruktion mit dem passiven Adjektiv bildet eine Segensformel. „Gepriesen sei“ ist im Deutschen würdig, verständlich und bewahrt den formelhaften Charakter.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die Unterscheidung des Gottesnamens und ist im deutschsprachigen Bibelgebrauch breit verständlich.
- source_word: חָפֵץ בְּךָ
  choice: Gefallen an dir hatte
  rationale: Die Formulierung gibt Freude, Wohlgefallen und erwählende Zuwendung wieder, ohne eine zusätzliche theologische Deutung einzutragen.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: dich auf seinen Thron setzte
  rationale: Die Wendung bezeichnet die Einsetzung in die Königsherrschaft und bewahrt ausdrücklich das theologisch markante Possessivpronomen „seinen“.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: damit du als König für den HERRN, deinen Gott, regierst
  rationale: „Für den HERRN“ erhält die repräsentative Beziehung der Königsherrschaft zu Gott; „regierst“ macht die im Hebräischen elliptische Rollenangabe in natürlichem Deutsch verständlich.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Weil dein Gott Israel liebt
  rationale: Die Präposition wird kausal verstanden. Das Präsens entspricht der fortdauernden, im Kontext ausgesagten Liebe Gottes zu Israel.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: es für immer bestehen lassen will
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf Israel als kollektive Größe. Die Wiedergabe wahrt den finalen Sinn des Infinitivs und vermeidet das nicht ausdrücklich vorhandene Verb „wünschen“.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: hat er dich als König über sie eingesetzt
  rationale: Im Inthronisationskontext bedeutet das wörtliche „geben“ die königliche Einsetzung; „über sie“ folgt dem pluralischen Suffix und nimmt die Menschen Israels auf.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: damit du für Recht und Gerechtigkeit sorgst
  rationale: Die deutsche Paarformel bringt die Aufgabe königlicher Rechtspflege natürlich zum Ausdruck und erhält beide hebräischen Begriffe unterscheidbar.
theological_decisions:
- issue: כִּסְאוֹ („sein Thron“) und Salomos Königtum
  choice: „seinen Thron“, auf den HERRN bezogen
  alternative: „den Thron“ als bloß dynastische Bezeichnung
  rationale: 'Das Pronomen sollte nicht abgeschwächt werden: Der Chronist stellt das davidisch-salomonische Königtum als Herrschaft unter Gottes Autorität und in seinem Auftrag dar.'
- issue: Bezug des Singularsuffixes in לְהַעֲמִידוֹ
  choice: „es“, auf Israel als kollektive Größe bezogen
  alternative: sinngemäß pluralisch „sie“, auf die Menschen Israels bezogen
  rationale: Die Singularform des hebräischen Suffixes wird im Haupttext sichtbar gehalten, während das spätere Pluralsuffix mit „sie“ die Bevölkerung Israels bezeichnet.
- issue: Verhältnis von Gottes Liebe, Israels Bestand und Salomos Einsetzung
  choice: Der finale Infinitiv wird eng mit Gottes Liebe zu Israel verbunden
  alternative: Der Infinitiv kann als weiterer Zweck der Einsetzung Salomos verstanden werden
  rationale: Die hebräische Syntax lässt die Zuordnung nicht völlig spannungsfrei erkennen. Die Hauptfassung folgt der naheliegenden Verbindung mit Gottes Liebe, während eine Fußnote die alternative Satzgliederung bewahrt.
- issue: מִשְׁפָּט וּצְדָקָה als königliche Formel
  choice: „Recht und Gerechtigkeit“
  alternative: „gerechtes Recht“ oder „Recht und Rechtschaffenheit“
  rationale: Die beiden Begriffe bleiben als zusammengehörige, aber unterscheidbare Aspekte guter Königsherrschaft erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Gottesnamenkonvention. Die Satzstruktur wurde behutsam geglättet, ohne das Gottesprädikat „sein Thron“, den Wechsel zwischen kollektivem Singular und personalem Plural bei Israel oder die mögliche syntaktische Mehrdeutigkeit zu beseitigen.
