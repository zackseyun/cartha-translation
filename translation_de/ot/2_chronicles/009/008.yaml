  revised_text: Gepriesen sei der HERR, dein Gott,[a] der Gefallen an dir hatte und dich auf seinen Thron setzte als König für den HERRN, deinen Gott. Weil dein Gott Israel liebte – um es für immer zu erhalten –, hat er dich als König über sie eingesetzt, damit du für Recht und Gerechtigkeit sorgst.
