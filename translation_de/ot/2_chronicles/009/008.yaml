  terminology: „der HERR“, „Thron“, „Recht und Gerechtigkeit“ und die Unterscheidung zwischen kollektivem „Israel/es“ und personalem „sie“ sind angemessen. „Gepriesen sei“ ist als deutsche Benediktionsformel passend. Das Präteritum „liebte“ fügt sich in die erzählte Rede der Königin ein und entspricht dem rückblickenden Kontext besser als ein gegenwartsbezogenes „liebt“.
