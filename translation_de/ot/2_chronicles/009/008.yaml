revisions:
- from: Gepriesen sei der HERR, dein Gott,[a] der Gefallen an dir hatte und dich auf seinen Thron setzte, damit du als König für den HERRN, deinen Gott, regierst. Weil dein Gott Israel liebt und es für immer bestehen lassen will,[b] hat er dich als König über sie eingesetzt, damit du für Recht und Gerechtigkeit sorgst.
  to: Gepriesen sei der HERR, dein Gott,[a] der Gefallen an dir hatte und dich auf seinen Thron setzte als König für den HERRN, deinen Gott. Weil dein Gott Israel liebte – um es für immer zu erhalten –, hat er dich als König über sie eingesetzt, damit du für Recht und Gerechtigkeit sorgst.
  rationale: Die Revision entfernt das nicht ausdrücklich vorhandene „will“, wahrt den finalen Charakter von לְהַעֲמִידוֹ und erhält durch die Satzgestaltung samt Fußnote die mögliche unterschiedliche Anbindung des Infinitivs. Zugleich wird die knappe Rollenangabe des Hebräischen bei der Einsetzung auf Gottes Thron unmittelbarer wiedergegeben.
