  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שׁ מֵאוֹת֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בְּ/בֵ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: de
  text: Außerdem fertigte er dreihundert Schilde aus gehämmertem Gold[a] an. Auf jeden Schild kamen dreihundert Schekel[b] Gold. Der König brachte sie in das Haus des Libanonwaldes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus breitgeschlagenem Gold“ beziehungsweise „aus dünn gehämmertem Gold“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht wörtlich nur „dreihundert Gold“; „Schekel“ ist als wahrscheinlich gemeinte Gewichtseinheit ergänzt, wie im Parallelbericht in 1. Könige 10,17.
    reason: lexical_alternative
  - marker: c
    text: Das „Haus des Libanonwaldes“ war der Name eines königlichen Gebäudes; möglich ist auch die erklärende Wiedergabe „Palast des Libanonwaldes“.
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: Schilde
  rationale: מָגֵן bezeichnet einen Schild. „Schilde“ ist die klare, allgemein verständliche Wiedergabe; eine genauere Festlegung auf einen bestimmten Schildtyp gibt der hebräische Ausdruck hier nicht zwingend vor.
- source_word: זָהָב שָׁחוּט
  choice: gehämmertes Gold
  rationale: שָׁחוּט beschreibt hier bearbeitetes, vermutlich dünn gehämmertes Gold. „Gehämmertes Gold“ gibt den handwerklichen Sinn knapp und natürlich wieder.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: dreihundert Schekel Gold
  rationale: Im Hebräischen steht wörtlich nur „dreihundert Gold“; die Gewichtseinheit bleibt unausgesprochen. Aufgrund des Paralleverses 1. Könige 10,17 und des üblichen antiken Sprachgebrauchs wird „Schekel“ zur Verständlichkeit ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: יַעֲלֶה עַל
  choice: kamen auf
  rationale: Die Formulierung bewahrt das konkrete Bild des Hebräischen, wonach die genannte Goldmenge auf jeden Schild kam, ohne den Vorgang unnötig genauer zu bestimmen.
- source_word: הַמָּגֵן הָאֶחָת
  choice: jeden Schild
  rationale: 'Die formal singularische Wendung „den einen Schild“ hat im Zusammenhang distributiven Sinn: Die Menge gilt für jeden einzelnen der dreihundert Schilde.'
- source_word: וַיִּתְּנֵם
  choice: brachte sie
  rationale: נתן kann bei einer Ortsangabe „stellen“, „legen“ oder „bringen“ bedeuten. „Brachte sie“ ist hier natürlich und lässt offen, wie die Schilde im Gebäude aufbewahrt oder ausgestellt wurden.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: das Haus des Libanonwaldes
  rationale: Die Wendung ist der Name eines königlichen Gebäudes. Die formnahe Übersetzung bewahrt den Eigennamencharakter; „Palast“ wäre eine erklärende Deutung.
