  naturalness: „Das Gewicht des Goldes, das zu Salomo kam, betrug in einem Jahr 666 Talente Gold“ ist modernes, verständliches Standarddeutsch. Die Stellung von „in einem Jahr“ beim Verb „betrug“ kann jedoch geringfügig nahelegen, das Gewicht selbst habe sich innerhalb eines Jahres verändert; die Zuordnung zum Goldzufluss ist vor „zu Salomo kam“ klarer.
