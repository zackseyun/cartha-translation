base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: de
  text: Das Gewicht des Goldes, das in einem Jahr zu Salomo kam,[a] betrug 666 Talente Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das zu Salomo gebracht wurde“. Wörtlich heißt es im Hebräischen: „das zu Salomo kam“; wer es brachte, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: betrug
  rationale: Die Erzählform von היה leitet die Mengenangabe ein; „betrug“ verbindet das Gewicht im Deutschen natürlich mit der Zahl, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: מִשְׁקַל הַזָּהָב
  choice: das Gewicht des Goldes
  rationale: מִשְׁקַל bezeichnet ausdrücklich das Gewicht; der bestimmte Artikel bei „Gold“ wird mit „des Goldes“ wiedergegeben.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: das Salomo … zukam
  rationale: „Zukam“ gibt die Bewegung beziehungsweise den Empfang idiomatisch wieder, ohne einen Handelnden zu nennen, den der hebräische Text offenlässt.
- source_word: בְּשָׁנָה אֶחָת
  choice: in einem Jahr
  rationale: Die Wendung bezeichnet die innerhalb eines Jahres eingegangene Menge; „in einem Jahr“ ist genau und natürlich.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: '666'
  rationale: Die Ziffernschreibung vermittelt die genaue Zahl unmittelbar und vermeidet keine ihrer möglichen Assoziationen, deutet sie aber auch nicht aus.
- source_word: כִּכְּרֵי זָהָב
  choice: Talente Gold
  rationale: כִּכָּר ist eine große Gewichtseinheit, traditionell und verständlich als „Talent“ wiedergegeben; „Talente Gold“ ist im Deutschen eine knappe Gewichtsangabe.
theological_decisions:
- issue: Mögliche symbolische Bedeutung der Zahl 666
  choice: Die Zahl wird ohne interpretierenden Hinweis als historische Gewichtsangabe wiedergegeben.
  alternative: Durch Formulierung oder Anmerkung eine Verbindung zu späteren biblischen Vorkommen der Zahl hervorheben.
  rationale: Der Vers selbst deutet die Zahl nicht symbolisch. Eine solche Verbindung würde eine Auslegung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und bewahrt zugleich die unbestimmte Urheberschaft des Goldzuflusses.
