  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: de
  text: 'Und sie brachten Jahr für Jahr, jeder seine Gabe[a]: Gegenstände aus Silber und Gegenstände aus Gold, Gewänder[b], Waffen[c], Gewürze, Pferde und Maultiere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Tribut“ beziehungsweise „sein Geschenk“. Das hebräische Wort kann eine Gabe oder Abgabe bezeichnen; im königlichen Zusammenhang ist auch „Tribut“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kleidungsstücke“ beziehungsweise „Prachtgewänder“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Rüstungen“ beziehungsweise allgemeiner „militärische Ausrüstung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם מְבִיאִים
  choice: Und jeder von ihnen brachte Jahr für Jahr
  rationale: Das Partizip bezeichnet im Zusammenhang eine regelmäßig wiederkehrende Handlung. Die deutsche Formulierung verbindet diese mit der abschließenden Zeitangabe, ohne einen bloß einmaligen Vorgang nahezulegen.
- source_word: אִישׁ מִנְחָתוֹ
  choice: jeder von ihnen … seine Gabe
  rationale: אִישׁ ist distributiv gebraucht. מִנְחָה bezeichnet hier eine einem König überreichte Gabe; „Gabe“ bewahrt die mögliche Bedeutungsspanne zwischen Geschenk und Tribut.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: Gegenstände aus Silber und Gold
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gefäß oder Gerät. „Gegenstände“ vermeidet eine unbegründete Beschränkung auf Gefäße.
- source_word: וּשְׂלָמוֹת
  choice: Gewänder
  rationale: Das Wort bezeichnet Kleidungsstücke, wahrscheinlich wertvolle Oberbekleidung; „Gewänder“ passt zum königlichen Gabenkontext, ohne eine bestimmte Form festzulegen.
- source_word: נֵשֶׁק
  choice: Waffen
  rationale: נֵשֶׁק kann Waffen oder allgemeiner militärische Ausrüstung bezeichnen. „Waffen“ ist im Deutschen klar und kontextgemäß.
- source_word: וּבְשָׂמִים
  choice: Gewürze
  rationale: Der Ausdruck bezeichnet kostbare Gewürz- oder Duftstoffe. „Gewürze“ ist in königlichen Geschenkelisten eine natürliche, hinreichend breite Wiedergabe.
- source_word: סוּסִים וּפְרָדִים
  choice: Pferde und Maultiere
  rationale: Direkte und eindeutige deutsche Entsprechungen.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die hebräische Wendung bezeichnet die regelmäßige jährliche Wiederkehr.
