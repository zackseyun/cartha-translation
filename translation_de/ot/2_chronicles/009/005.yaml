  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage treffend wieder: Die Königin bestätigt die Wahrheit dessen, was sie in ihrem Land über den König gehört hatte. „Da sagte sie“ bildet den erzählenden Fortgang von וַתֹּאמֶר angemessen ab; „zum König“, „in meinem Land“ und „deine Weisheit“ entsprechen dem Ausgangstext direkt. Die idiomatische Wiedergabe von אֱמֶת הַדָּבָר mit „Es stimmt, was …“ ist sachgerecht.'
