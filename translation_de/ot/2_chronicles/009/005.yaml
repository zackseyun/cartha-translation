source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: de
  text: 'Da sagte sie zum König: »Es stimmt, was ich in meinem Land über deine Worte[a] und deine Weisheit gehört habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über deine Angelegenheiten« bzw. »über dein Wirken«.'
    reason: Das hebräische דְּבָרֶיךָ kann sowohl die Worte des Königs als auch seine Angelegenheiten oder sein Wirken bezeichnen.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein; „Da sagte sie“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: אֶל־הַמֶּלֶךְ
  choice: zum König
  rationale: Die Präpositionalphrase bezeichnet unmittelbar den Adressaten.
- source_word: אֱמֶת הַדָּבָר אֲשֶׁר שָׁמַעְתִּי
  choice: Es stimmt, was ich … gehört habe
  rationale: Die hebräische Nominalkonstruktion bestätigt, dass das Gehörte wahr ist. Diese deutsche Fassung ist idiomatisch und bewahrt die Aussage, ohne דָּבָר unnötig auf „Bericht“ festzulegen.
- source_word: בְּאַרְצִי
  choice: in meinem Land
  rationale: Bewahrt das Substantiv „Land“ und das Suffix der ersten Person Singular in würdigem, natürlichem Deutsch.
- source_word: עַל־דְּבָרֶיךָ
  choice: über deine Worte
  rationale: דְּבָרֶיךָ kann „deine Worte“, „deine Angelegenheiten“ oder weiter gefasst „dein Wirken“ bedeuten. „Deine Worte“ ist die unmittelbarste Wiedergabe; die echte Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: und deine Weisheit
  rationale: Direkte Wiedergabe des Nomens mit Suffix der zweiten Person Singular; Weisheit ist ein Leitmotiv des Zusammenhangs.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die idiomatische Konstruktion „Es stimmt, was …“ vermeidet eine schwerfällige Nachbildung der hebräischen Nominalphrase; die Mehrdeutigkeit von דְּבָרֶיךָ bleibt durch die Fußnote sichtbar.
