  text: וַ/יְהִ֥י מוֹשֵׁ֖ל בְּ/כָל הַ/מְּלָכִ֑ים מִן הַ/נָּהָר֙ וְ/עַד אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֥וּל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: de
  text: Und er herrschte über alle Könige vom Strom[a] bis zum Land der Philister und bis zur Grenze Ägyptens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Strom“ ist wahrscheinlich der Euphrat gemeint, wie häufig bei dieser geografischen Bezeichnung im Alten Testament.
    reason: Querverweis und geografische Erläuterung
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: Und er herrschte
  rationale: Die Verbindung von וַיְהִי mit dem Partizip מוֹשֵׁל beschreibt einen andauernden Zustand beziehungsweise die Ausübung von Herrschaft in der Vergangenheit. Die finite Form ist im modernen Deutschen natürlich und wahrt den politischen Sinn.
- source_word: בְּכָל הַמְּלָכִים
  choice: über alle Könige
  rationale: Bei משל bezeichnet ב hier die Personen, über die Herrschaft ausgeübt wird. „Über alle Könige“ gibt die Oberherrschaft über untergeordnete Herrscher klar wieder.
- source_word: מִן הַנָּהָר
  choice: vom Strom
  rationale: Die bestimmte Bezeichnung הַנָּהָר meint in dieser geografisch-politischen Formel gewöhnlich den Euphrat. Der Haupttext bewahrt die Ausdrucksweise des Hebräischen; eine Fußnote erläutert den wahrscheinlichen Bezug.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: bis zum Land der Philister
  rationale: Die Wendung bezeichnet die räumliche Ausdehnung der Herrschaft. „Land der Philister“ ist transparent und bleibt näher am Hebräischen als der interpretierende geografische Name „Philistäa“.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: und bis zur Grenze Ägyptens
  rationale: גְּבוּל bezeichnet eine Grenze oder ein Grenzgebiet. Die Formulierung gibt den südwestlichen Endpunkt sachlich und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe geografische Formel und die Wiederholung von „bis“ bleiben erhalten; „der Strom“ bewahrt die genuine Ausdrucksweise des hebräischen Textes und wird in der Fußnote erläutert.
