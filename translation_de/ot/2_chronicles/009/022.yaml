  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: de
  text: König Salomo übertraf alle Könige der Erde an Reichtum und Weisheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: übertraf
  rationale: Das Verb גדל bezeichnet hier mit der Vergleichspräposition מִן eine Überlegenheit gegenüber anderen. „Übertraf“ gibt diesen Vergleichssinn im Deutschen natürlich und prägnant wieder.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die Verbindung aus Titel und Eigenname wird im modernen Standarddeutsch am natürlichsten als „König Salomo“ wiedergegeben.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: alle Könige der Erde
  rationale: אָרֶץ kann „Land“ oder „Erde“ bedeuten. Der internationale Zusammenhang und der umfassende Vergleich sprechen hier für „Erde“.
- source_word: לְעֹשֶׁר
  choice: an Reichtum
  rationale: Das לְ bezeichnet den Bereich, in dem Salomo die anderen Könige übertraf. Nach „übertreffen“ ist „an Reichtum“ idiomatisches Deutsch.
- source_word: וְחָכְמָה
  choice: und Weisheit
  rationale: חָכְמָה bedeutet „Weisheit“. Die Präposition „an“ gilt im Deutschen natürlich für beide verbundenen Substantive.
