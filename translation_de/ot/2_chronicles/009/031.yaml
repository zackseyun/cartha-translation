  naturalness: „Man begrub ihn“ und „wurde an seiner Stelle König“ sind modernes, würdiges Standarddeutsch. Die geänderte Stellung „in der Stadt Davids, seines Vaters“ ist trotz der formelhaften Apposition klarer und genauer als die vorliegende Fassung.
  terminology: „Vorfahren“ ist als moderne Wiedergabe von „Väter“ in der Todesformel vertretbar; die Fußnote bewahrt die wörtliche Formulierung. Die Erläuterung sollte die Formel nicht zu eng als Aussage über eine Bestattung bei den Vorfahren definieren, da die Wendung primär eine konventionelle Todesformel ist und die konkrete Bestattung anschließend eigens genannt wird.
