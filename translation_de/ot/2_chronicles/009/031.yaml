base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: de
  text: Und Salomo legte sich zu seinen Vorfahren[a], und man begrub ihn in der Stadt Davids, seines Vaters. Sein Sohn Rehabeam wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich zu seinen Vätern“; eine gebräuchliche hebräische Todesformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Die traditionelle hebräische Todesformel wird bildhaft bewahrt. „Vorfahren“ gibt אָבוֹת in diesem Zusammenhang im heutigen Deutsch verständlicher wieder als das missverständliche „Väter“.
- source_word: וַיִּקְבְּרֻהוּ
  choice: man begrub ihn
  rationale: Die unbestimmte handelnde Personengruppe des aktiven Plurals wird natürlich deutsch mit „man“ wiedergegeben, ohne die Bestattenden näher zu bestimmen.
- source_word: בְּעִיר דָּוִיד אָבִיו
  choice: in der Stadt seines Vaters David
  rationale: Die Formulierung erhält sowohl die Ortsbezeichnung „Stadt Davids“ als auch die ausdrücklich genannte Beziehung Davids zu Salomo; die deutsche Wortstellung vermeidet die schwerfällige Folge „in der Stadt Davids, seines Vaters“.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb den Regierungsantritt. „Wurde König“ ist im modernen Deutsch natürlicher als das isolierte „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet Rehabeams Nachfolge und entspricht der räumlich-substitutiven Bedeutung des hebräischen Ausdrucks.
theological_decisions:
- issue: Bedeutung der Todesformel
  choice: Die hebräische Bildrede wird im Haupttext bewahrt und in einer Fußnote als Ausdruck für Tod und Bestattung erklärt.
  alternative: Die Formel unmittelbar mit „starb“ wiedergeben.
  rationale: So bleiben der traditionelle Wortlaut und seine innerbiblischen Bezüge erhalten, ohne modernen Lesern die Bedeutung vorzuenthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Sprache des königlichen Todes- und Nachfolgeberichts bleibt erkennbar, wird aber syntaktisch natürlich wiedergegeben.
