base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: de
  text: Salomo hatte viertausend Stallungen[a] für Pferde und Streitwagen und zwölftausend Reiter[b]. Er stationierte sie in den Wagenstädten und beim König in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stallplätze“. Das hebräische Wort bezeichnet Unterbringungseinheiten für Pferde.'
    reason: lexical_alternative
  - marker: b
    text: In der Parallelstelle 1. Könige 5,6 steht „vierzigtausend Stallungen“, während hier in Chronik „viertausend“ steht.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomo hatte
  rationale: Die hebräische Konstruktion היה + ל bezeichnet Besitz beziehungsweise Verfügbarkeit; „Salomo hatte“ gibt sie im Deutschen natürlich wieder.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: viertausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אֻרְיוֹת
  choice: Stallplätze
  rationale: Das seltene Substantiv bezeichnet Unterbringungseinheiten beziehungsweise Standplätze für Pferde. „Stallplätze“ bewahrt diese Bedeutung besser als das ganze Gebäude bezeichnende „Ställe“.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: für Pferde und Streitwagen
  rationale: Die Wendung benennt, wofür die Stallplätze bestimmt waren. „Streitwagen“ macht im militärischen Zusammenhang die Funktion der Wagen deutlich.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: und zwölftausend
  rationale: Direkte Wiedergabe der Zahlphrase.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Wort bezeichnet berittene Männer; „Reiter“ ist im modernen Deutschen direkt und weniger anachronistisch als „Kavalleristen“.
- source_word: וַיַּנִּיחֵם
  choice: Er brachte sie … unter
  rationale: Das Verb bedeutet hier, dass Salomo die genannten Bestände beziehungsweise Truppen an bestimmten Orten platzierte. „Unterbringen“ passt sowohl zu Tieren und Wagen als auch zu Reitern, ohne das Pronomen enger festzulegen als der hebräische Text.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: in den Wagenstädten
  rationale: Die knappe Zusammensetzung gibt den hebräischen Constructus für Städte wieder, die als Standorte der Streitwagenverbände dienten.
- source_word: וְעִם הַמֶּלֶךְ
  choice: und beim König
  rationale: Die wörtliche Ortsangabe „beim König“ wahrt die knappe Formulierung und lässt offen, welcher Anteil dort untergebracht war.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche deutsche Wiedergabe des Ortsnamens mit Präposition.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die traditionelle militärische Bezeichnung „Wagenstädte“ bleibt erhalten; „Stallplätze“ präzisiert die seltene hebräische Sachbezeichnung. Die Verszählung der Parallelstelle folgt der in vielen deutschen Bibeln üblichen Zählung; sie entspricht 1. Könige 4,26 in abweichender englischer Zählung.
