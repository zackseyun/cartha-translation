  source_fidelity: 'Der deutsche Text gibt den hebräischen Satzbau und Sinngehalt zuverlässig wieder: Die Königin glaubte den Berichten erst nach eigener Anschauung; weniger als die Hälfte der Fülle/Größe Salomos Weisheit war ihr mitgeteilt worden; die Wirklichkeit übertraf den zuvor gehörten Bericht. „Fülle deiner Weisheit“ ist für מַרְבִּית חָכְמָתֶךָ eine tragfähige Wiedergabe.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und wahrt einen angemessen würdigen Ton. „Und siehe“ ist leicht bibelsprachlich markiert, aber als Wiedergabe von וְהִנֵּה vertretbar.
  terminology: „glaubte ihren Worten nicht“, „mit eigenen Augen“, „Bericht“ und „übertroffen“ sind treffend. Die zweite Fußnote sollte jedoch keine irreführend als wörtlich bezeichnete Paraphrase bieten; eine echte idiomatische Übersetzungsalternative ist klarer.
