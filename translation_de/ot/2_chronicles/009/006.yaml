  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: de
  text: 'Doch ich glaubte ihren Worten nicht, bis ich selbst kam und es mit eigenen Augen sah. Und siehe: Nicht einmal die Hälfte der Fülle deiner Weisheit war mir berichtet worden.[a] Du hast den Bericht, den ich gehört hatte, noch übertroffen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Größe deiner Weisheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Du hast den Bericht, den ich gehört hatte, überstiegen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: ich glaubte … nicht
  rationale: Das Hifil von אמן bezeichnet hier, etwas für wahr oder glaubwürdig zu halten. „Glauben“ passt zu ihrer anfänglichen Reaktion auf die Berichte.
- source_word: לְדִבְרֵיהֶם
  choice: ihren Worten
  rationale: דברים bezeichnet hier die Aussagen anderer. „Ihren Worten“ bleibt nah am Hebräischen und ist im Deutschen natürlich.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: es mit eigenen Augen sah
  rationale: Die hebräische Wendung lautet wörtlich „meine Augen sahen“. Die deutsche Formulierung bewahrt die Betonung der persönlichen Anschauung.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה lenkt mit Nachdruck und Staunen die Aufmerksamkeit auf die folgende Feststellung. „Und siehe“ erhält diese Funktion in würdigem biblischem Deutsch.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: die Fülle deiner Weisheit
  rationale: מַרְבִּית kann Fülle, Menge, Zunahme oder Größe bezeichnen. „Fülle“ gibt den Gedanken außerordentlicher Reichhaltigkeit wieder, ohne ihn auf bloße Wertung zu verengen.
- source_word: הֻגַּד לִי
  choice: war mir berichtet worden
  rationale: Das Hofal von נגד bezeichnet passives Mitteilen oder Berichten. Das Plusquamperfekt ordnet den früheren Bericht zeitlich vor ihrer eigenen Wahrnehmung ein.
- source_word: יָסַפְתָּ עַל
  choice: du hast … noch übertroffen
  rationale: יסף mit על bezeichnet hier ein Hinausgehen über das zuvor Gehörte. „Noch übertroffen“ ist idiomatisch und lässt zugleich die Grundidee des Hinzufügens anklingen.
- source_word: הַשְּׁמוּעָה
  choice: der Bericht
  rationale: שְׁמוּעָה bezeichnet eine Nachricht oder einen Bericht, also etwas, das man gehört hat. „Bericht“ ist neutraler als „Gerücht“.
