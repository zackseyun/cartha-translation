  register: Modernes, würdevolles Standarddeutsch. Die räumliche Beschreibung wurde in kurze, gut verständliche Sätze gegliedert. Die im Hebräischen bestehende Unsicherheit bei כֶּבֶשׁ bleibt durch eine Fußnote sichtbar; „Löwen“ wird nicht deutend zu „Löwenfiguren“ erweitert.
