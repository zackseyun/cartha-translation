source:
  edition: WLC
  text: וְ/שֵׁ֣שׁ מַעֲל֣וֹת לַ֠/כִּסֵּא וְ/כֶ֨בֶשׁ בַּ/זָּהָ֤ב לַ/כִּסֵּא֙ מָאֳחָזִ֔ים וְ/יָד֛וֹת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה עַל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: de
  text: Sechs Stufen führten zum Thron hinauf. Ein goldener Fußschemel[a] war am Thron befestigt. Auf beiden Seiten des Sitzes waren Armlehnen, und neben den Armlehnen standen zwei Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „eine goldene Rampe/ein goldener Aufgang“. Das hebräische Wort כֶּבֶשׁ kann unterschiedlich verstanden werden; im Zusammenhang mit dem Thron passt „Fußschemel“ jedoch gut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: Stufen
  rationale: Im Zusammenhang mit dem erhöhten Thron bezeichnet das Wort die Stufen, die zu ihm hinaufführten. „Stufen“ ist im modernen Deutsch klar und natürlich.
- source_word: כֶּבֶשׁ
  choice: Fußschemel
  rationale: Im Zusammenhang mit einem Thron liegt ein stützendes Element vor dem Sitz nahe. Die seltene Formulierung kann jedoch auch eine Rampe oder einen Aufgang bezeichnen; diese echte lexikalische Unsicherheit wird in der Fußnote bewahrt.
- source_word: מָאֳחָזִים
  choice: war … befestigt
  rationale: Das passive Partizip beschreibt den goldenen Fußschemel als fest mit dem Thron verbunden. Die deutsche Singularform richtet sich nach „Fußschemel“.
- source_word: יָדוֹת
  choice: Armlehnen
  rationale: Wörtlich „Hände“; bei einem Sitzmöbel sind damit die seitlichen Teile gemeint, auf denen die Arme oder Hände ruhen.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf beiden Seiten
  rationale: Die Wendung bezeichnet die Anordnung auf der einen und der anderen Seite und wird so knapp und idiomatisch wiedergegeben.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: des Sitzes
  rationale: Die wörtliche Wendung „Ort des Sitzens“ bezeichnet hier die Sitzfläche beziehungsweise den Sitzbereich des Thrones.
- source_word: אֲרָיוֹת
  choice: Löwen
  rationale: Direkte Wiedergabe des Plurals. Obwohl im Zusammenhang wahrscheinlich Löwenfiguren gemeint sind, wird dies im Hebräischen nicht ausdrücklich gesagt.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip beschreibt die Löwen als aufrecht beziehungsweise fest positioniert; „standen“ bewahrt die schlichte bildhafte Aussage.
- source_word: אֵצֶל
  choice: neben
  rationale: Die Präposition bezeichnet unmittelbare räumliche Nähe und wird im Deutschen natürlich mit „neben“ wiedergegeben.
theological_decisions: []
