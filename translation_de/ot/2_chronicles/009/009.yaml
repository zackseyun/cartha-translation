base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: de
  text: Und sie gab dem König 120 Talente Gold[a], Gewürze in sehr großer Menge und Edelsteine. Nie zuvor hatte es Gewürze wie jene gegeben, die die Königin von Saba König Salomo gab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war ein antikes Gewichtsmaß. Sein genauer Wert unterschied sich je nach Zeit und Region; hier handelt es sich insgesamt um mehrere Tonnen Gold.
    reason: Maßangabe für heutige Leser erläutern, ohne eine unbelegbar exakte Umrechnung in den Haupttext einzutragen.
  - marker: b
    text: 'Oder: »Später gab es nie wieder Gewürze wie jene, die die Königin von Saba König Salomo gab.« Das Hebräische kann sich auf die Zeit bis zu diesem Ereignis beziehen oder allgemeiner eine unübertroffene Gabe bezeichnen.'
    reason: Die zeitliche Reichweite der hebräischen Aussage ist mehrdeutig.
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Und sie gab
  rationale: Das Wayyiqtol führt die Erzählung weiter; »Und sie gab« bewahrt den Anschluss und klingt im Deutschen natürlich.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 120 Talente Gold
  rationale: כִּכָּר bezeichnet hier ein antikes Gewichtsmaß; »Talent« ist die etablierte deutsche Wiedergabe.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: Gewürze in sehr großer Menge
  rationale: בְּשָׂמִים umfasst wohlriechende Gewürze bzw. Aromastoffe; לָרֹב מְאֹד betont ihre außergewöhnlich große Menge.
- source_word: וְאֶבֶן יְקָרָה
  choice: und Edelsteine
  rationale: Der hebräische Singular kann kollektiv gebraucht sein; in dieser Aufzählung ist der deutsche Plural idiomatisch.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Nie zuvor hatte es Gewürze wie jene gegeben
  rationale: Die Formulierung gibt den Vergleich und die Nichtexistenz bis zum erzählten Zeitpunkt wieder, ohne die Qualität oder die Menge als alleinigen Vergleichspunkt festzulegen.
- source_word: מַלְכַּת שְׁבָא
  choice: die Königin von Saba
  rationale: »Saba« ist die im Deutschen etablierte Form des Orts- bzw. Reichsnamens.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die Verbindung aus Titel und Eigenname wird im modernen Deutschen natürlich so wiedergegeben.
theological_decisions: []
