  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber für heutige Leser geglättet. »Gewürze« ist allgemeinverständlich und lässt die genaue Art der wohlriechenden Aromastoffe offen.
