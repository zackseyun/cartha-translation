review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle Bestandteile des Hebräischen zutreffend wieder: die umfassende Aussage über die Könige, das idiomatische »das Angesicht suchen«, den Zweck des Hörens sowie die von Gott in Salomos Herz gegebene Weisheit. »Der Erde« ist im internationalen Kontext angemessen; die Wendung beansprucht dabei keine mathematisch ausnahmslose Universalität.'
  naturalness: »Salomos Angesicht suchen« ist im heutigen Standarddeutsch ohne Erklärung unnötig fremd und wirkt stärker wörtlich als die englische Audit-Vorlage. »Die Gegenwart Salomos suchen« ist natürlich, bewahrt den Sinn der hebräischen Idiomatik und kann mit einer knappen Fußnote transparent auf das hebräische Bild zurückverweisen. »Ins Herz gelegt hatte« ist zudem die im Deutschen idiomatische Verbindung für eine Gabe bzw. Einsicht im Inneren eines Menschen.
  terminology: Die Namenform »Salomo«, »Gott«, »Weisheit« und »Herz« sind passend. »Herz« wahrt die hebräische Ausdrucksweise und sollte nicht zu »Verstand« oder »Sinn« eingeengt werden.
  issues:
  - severity: medium
    issue: Die Haupttextformulierung »suchten Salomos Angesicht« ist im modernen Standarddeutsch unidiomatisch.
    rationale: Sie bildet zwar die hebräische Redewendung formal ab, erfordert aber die Fußnote, um überhaupt verständlich zu sein. Die Bedeutung ist hier »Zugang zu bzw. Gegenwart/Audienz bei Salomo suchen«. Eine idiomatische Wiedergabe im Haupttext bei Erhalt einer Fußnote zur wörtlichen Form ist quellennäher im Sinnverständnis und natürlicher.
  - severity: low
    issue: »Gott ihm ins Herz gegeben hatte« ist verständlich, aber weniger idiomatisch als »Gott ihm ins Herz gelegt hatte«.
    rationale: Das Hebräische verbindet נתן mit »in seinem Herzen«. »Ins Herz legen« gibt diese Verbindung im Deutschen natürlich wieder, ohne den göttlichen Ursprung oder die Metapher des Herzens zu verändern.
  revised_text: Und alle Könige der Erde suchten die Gegenwart Salomos[a], um seine Weisheit zu hören, die Gott ihm ins Herz gelegt hatte.
