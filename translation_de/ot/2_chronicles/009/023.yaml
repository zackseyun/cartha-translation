revisions:
- from: Und alle Könige der Erde suchten Salomos Angesicht[a], um seine Weisheit zu hören, die Gott ihm ins Herz gegeben hatte.
  to: Und alle Könige der Erde suchten die Gegenwart Salomos[a], um seine Weisheit zu hören, die Gott ihm ins Herz gelegt hatte.
  rationale: Die Revision ersetzt zwei im Deutschen unnötig wörtliche bzw. weniger idiomatische Formulierungen. Sie erhält den gesamten Sinngehalt des Hebräischen, einschließlich der Bildsprache vom Herzen, und dokumentiert die wörtliche Gestalt der Redewendung weiterhin in der Fußnote.
