  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: de
  text: Und alle Könige der Erde suchten die Gegenwart Salomos[a], um seine Weisheit zu hören, die Gott ihm ins Herz gelegt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „suchten Salomos Angesicht“; eine hebräische Redewendung für das Suchen seiner Gegenwart oder einer Audienz bei ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: Und alle Könige der Erde
  rationale: Die Wendung führt die Erzählung fort. הָאָרֶץ kann „des Landes“ oder „der Erde“ bedeuten; im internationalen Zusammenhang von Salomos Ruhm ist „der Erde“ die naheliegende, zugleich formnahe Wiedergabe.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: suchten Salomos Angesicht
  rationale: Die hebräische Redewendung bedeutet, Zugang zu Salomo beziehungsweise eine Audienz bei ihm zu suchen. Die formnahe Wendung bewahrt das Bild des Ausgangstextes; eine Fußnote erläutert den idiomatischen Sinn. Das deutsche Präteritum gibt die im Kontext fortdauernde beziehungsweise wiederholte Handlung natürlich wieder.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: um seine Weisheit zu hören
  rationale: Der Infinitiv bezeichnet den Zweck. „Hören“ entspricht שׁמע unmittelbar und bleibt in Verbindung mit „Weisheit“ verständlich.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: die Gott ihm ins Herz gegeben hatte
  rationale: נתן wird grundsätzlich mit „geben“ wiedergegeben; בְּלִבּוֹ bleibt als „ins Herz“ erhalten. Das Plusquamperfekt verdeutlicht, dass die göttliche Gabe dem Besuch der Könige vorausging. Das ergänzte „ihm“ macht im Deutschen den Empfänger der Gabe natürlich kenntlich, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Göttlicher Ursprung von Salomos Weisheit
  choice: die Gott ihm ins Herz gegeben hatte
  alternative: die Gott in sein Herz gelegt hatte
  rationale: Die Übersetzung schreibt Salomos Weisheit ausdrücklich Gottes Handeln zu und bewahrt mit „Herz“ die hebräische Vorstellung vom inneren Menschen. „Gegeben“ hält zugleich die Grundbedeutung von נתן fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche, aber verständliche Formulierung „Salomos Angesicht suchen“ bewahrt bewusst das hebräische Bild und wird durch die Fußnote erschlossen.
