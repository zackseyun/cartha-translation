source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: de
  text: Wie glücklich sind deine Männer[a], und wie glücklich sind diese deine Diener, die ständig vor dir stehen[b] und deine Weisheit hören!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie gesegnet sind deine Männer“ beziehungsweise „Wie gut haben es deine Männer“. Das hebräische Wort kann einen glücklichen, beneidenswerten oder gesegneten Zustand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Vor dir stehen“ ist eine höfische Wendung für den Dienst in der Gegenwart eines Königs.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: wie glücklich sind
  rationale: Die Wendung bezeichnet einen beneidenswerten, glücklichen oder gesegneten Zustand. „Wie glücklich sind“ gibt hier den ausrufenden Ton des höfischen Lobes natürlich wieder, ohne eine ausdrücklich von Gott vollzogene Segnung vorauszusetzen.
- source_word: אֲנָשֶׁיךָ
  choice: deine Männer
  rationale: אֲנָשִׁים bezeichnet gewöhnlich Männer. Im Hofkontext sind wohl männliche Angehörige oder Amtsträger des Königs gemeint; die Übersetzung bewahrt jedoch die allgemeinere Formulierung des Hebräischen.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עֶבֶד kann Knecht, Sklave, Diener oder Amtsträger bezeichnen. Im königlichen Hofkontext ist „Diener“ eine natürliche Wiedergabe, ohne den rechtlichen Status genauer festzulegen als der Kontext.
- source_word: אֵלֶּה
  choice: diese
  rationale: Das Demonstrativpronomen weist ausdrücklich auf die anwesenden Diener hin und wird daher beibehalten.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: die vor dir stehen
  rationale: Die wörtliche Wendung bezeichnet im Hofsprachgebrauch Personen, die dem König in seiner Gegenwart aufwarten. Das konkrete Bild bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: תָּמִיד
  choice: ständig
  rationale: Das Adverb bezeichnet regelmäßige, fortdauernde Anwesenheit. „Ständig“ ist im modernen Deutsch klar und muss nicht mathematisch lückenlos verstanden werden.
- source_word: וְשֹׁמְעִים
  choice: und hören
  rationale: שׁמע bedeutet hören beziehungsweise aufmerksam zuhören. Mit „deine Weisheit hören“ bleibt die knappe, ungewöhnliche Formulierung des Hebräischen erhalten.
- source_word: חָכְמָתֶךָ
  choice: deine Weisheit
  rationale: Das Substantiv bezeichnet Salomos Weisheit, wie sie seinen Hofleuten zugänglich und in seinen Worten wahrnehmbar ist; die direkte Formulierung entspricht dem Ausgangstext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit ausrufendem Ton. Die zweimalige Formulierung „wie glücklich“ bildet die parallele Lobpreisung des Hebräischen ab. Sämtliche Fußnotenmarker stehen an der jeweils erläuterten Stelle im Haupttext.
