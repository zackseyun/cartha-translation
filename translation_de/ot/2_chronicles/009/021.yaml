  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: de
  text: Denn der König hatte Schiffe, die mit Hurams Dienern nach Tarschisch segelten. Alle drei Jahre kamen die Tarschisch-Schiffe und brachten Gold und Silber, Elfenbein, Affen und Pfauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Papageien. Welches Tier mit dem hebräischen Wort gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet im Zusammenhang eine begründende Erläuterung zu Salomos Reichtum ein.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: der König hatte Schiffe
  rationale: Die hebräische Wendung bedeutet wörtlich »Schiffe für/zu dem König«; im Deutschen wird das Besitzverhältnis natürlich mit »hatte« ausgedrückt.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: die … nach Tarschisch fuhren
  rationale: Das Partizip mit dem Ortsnamen wird hier am naheliegendsten als Bewegung beziehungsweise Fahrtroute verstanden.
- source_word: עִם עַבְדֵי חוּרָם
  choice: mit Hurams Dienern
  rationale: עֲבָדִים bezeichnet hier das königliche Dienstpersonal Hurams; »Diener« gibt dies direkt wieder, ohne einen Sklavenstatus zu unterstellen.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Einmal in drei Jahren
  rationale: Die distributive Zeitangabe wird idiomatisch und eng am Hebräischen wiedergegeben.
- source_word: תָּבֹאנָה
  choice: kamen
  rationale: Das Imperfekt bezeichnet in diesem erzählenden Zusammenhang eine regelmäßig wiederkehrende Handlung.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: die Tarschisch-Schiffe
  rationale: Die nominale Verbindung kann Schiffe der Tarschisch-Route beziehungsweise große Handelsschiffe bezeichnen; die knappe traditionelle Benennung bewahrt diese Offenheit.
- source_word: נֹשְׂאוֹת
  choice: brachten
  rationale: Das Partizip beschreibt die regelmäßig beförderte und am Ziel eintreffende Ladung.
- source_word: זָהָב וָכֶסֶף
  choice: Gold und Silber
  rationale: Direkte Wiedergabe der beiden Edelmetalle.
- source_word: שֶׁנְהַבִּים
  choice: Elfenbein
  rationale: Die konventionelle und im Warenverzeichnis natürliche deutsche Bezeichnung.
- source_word: וְקוֹפִים
  choice: Affen
  rationale: Der Tiername bezeichnet Affen; das Deutsche muss nicht zwischen Menschenaffen und anderen Affen unterscheiden.
- source_word: וְתוּכִּיִּים
  choice: Pfauen
  rationale: »Pfauen« ist die verbreitete Deutung, doch die genaue Identifikation des seltenen Tiernamens bleibt unsicher und wird deshalb in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »Tarschisch« und der Wechsel von der verbalen Formulierung »nach Tarschisch fuhren« zu »Tarschisch-Schiffe« folgen der unterschiedlichen hebräischen Syntax. Der Fußnotenmarker steht unmittelbar beim unsicheren letzten Tiernamen.
