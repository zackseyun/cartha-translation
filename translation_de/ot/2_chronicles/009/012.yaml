source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַ֖ד אֲשֶׁר הֵבִ֣יאָה אֶל הַ/מֶּ֑לֶךְ וַֽ/תַּהֲפֹ֛ךְ וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: de
  text: Und König Salomo gab der Königin von Saba alles, was sie begehrte, worum sie auch bat, zusätzlich zu dem, was sie dem König gebracht hatte.[a] Dann wandte sie sich um und zog in ihr Land, sie und ihre Diener.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abgesehen von dem, was sie dem König gebracht hatte“. Die hebräische Wendung kann eine Ausnahme oder eine Hinzufügung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Dann kehrte sie zurück und zog in ihr Land.“ Wörtlich heißt es: „Dann wandte sie sich um und ging“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: gab
  rationale: Die übliche und natürliche Wiedergabe für eine Übergabe beziehungsweise Schenkung.
- source_word: מַלְכַּת שְׁבָא
  choice: der Königin von Saba
  rationale: Der Titel wird übersetzt, der Ortsname in seiner im Deutschen eingebürgerten Form wiedergegeben.
- source_word: כָּל חֶפְצָהּ
  choice: alles, was sie begehrte
  rationale: חֵפֶץ kann den Wunsch oder das Gewünschte bezeichnen; die Formulierung ist idiomatisch und bewahrt den gehobenen Erzählton.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: worum sie auch bat
  rationale: Die Wendung erläutert den Inhalt ihres Begehrens und gibt zugleich die umfassende Aussage des Relativsatzes natürlich wieder.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: zusätzlich zu dem, was sie dem König gebracht hatte
  rationale: מִלְּבַד kann Ausnahme oder Hinzufügung markieren. Im Kontext liegt die additive Bedeutung nahe; die mögliche Schwierigkeit der Aussage wird in der Fußnote kenntlich gemacht.
- source_word: וַתַּהֲפֹךְ
  choice: Dann wandte sie sich um
  rationale: Bewahrt das konkrete Bild des hebräischen Verbs, ohne es stillschweigend nur als Rückkehr zu deuten.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: und zog in ihr Land
  rationale: „Zog“ ist eine natürliche, würdige Wiedergabe des Aufbruchs und der Reise in ihre Heimat.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: sie und ihre Diener
  rationale: Im Zusammenhang bezeichnet עֲבָדִים das königliche Begleitpersonal; „Diener“ wahrt die lexikalische Breite, ohne einen rechtlichen Status festzulegen.
