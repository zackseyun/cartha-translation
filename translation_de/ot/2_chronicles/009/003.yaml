  yaml_path: translation/ot/2_chronicles/009/003.yaml
  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: de
  text: Als die Königin von Saba Salomos Weisheit und das Haus sah, das er gebaut hatte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Palast, den er gebaut hatte“. Im Hebräischen steht „das Haus“, womit in diesem königlichen Zusammenhang insbesondere Salomos Palastanlage gemeint sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als ... sah
  rationale: Die waw-konsekutive Verbform führt die Erzählung fort. Da der Satz in den folgenden Vers hineinführt, gibt „Als ... sah“ die zeitliche Beziehung im Deutschen natürlich wieder.
- source_word: מַלְכַּת שְׁבָא
  choice: die Königin von Saba
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Herrscherin nach ihrem Reich beziehungsweise Herkunftsort; „Königin von Saba“ ist die geläufige deutsche Form.
- source_word: אֵת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigene lexikalische Entsprechung; seine Funktion zeigt sich in der Satzstruktur.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: Salomos Weisheit
  rationale: Die Status-constructus-Verbindung wird idiomatisch durch den deutschen Genitiv wiedergegeben. „Weisheit“ umfasst hier Einsicht, Urteilsvermögen und kundiges Handeln.
- source_word: וְהַבַּיִת
  choice: und das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“. Im königlichen Zusammenhang kann damit Salomos Palast beziehungsweise Palastanlage gemeint sein; der Haupttext bewahrt jedoch die allgemeinere Ausdrucksweise des Hebräischen.
- source_word: אֲשֶׁר בָּנָה
  choice: das er gebaut hatte
  rationale: Der Relativsatz bezieht sich auf „Haus“. Das Plusquamperfekt macht im Deutschen deutlich, dass der Bau bereits vor dem Besuch der Königin abgeschlossen war.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzöffnung mit „Als“ wahrt den Anschluss an die Fortsetzung; „Haus“ erhält die lexikalische Offenheit des hebräischen Ausdrucks.
