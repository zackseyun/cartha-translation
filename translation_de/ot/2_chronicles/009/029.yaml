  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: de
  text: Die übrigen Taten Salomos[a], die ersten wie die letzten, sind sie nicht in den Aufzeichnungen des Propheten Natan, in der Weissagung Ahijas aus Schilo und in den Visionen des Sehers Jedo[b] über Jerobeam, den Sohn Nebats, niedergeschrieben?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Worte« oder »Angelegenheiten Salomos«. In diesem Zusammenhang bezeichnet der hebräische Ausdruck wahrscheinlich seine Taten beziehungsweise seine Geschichte.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Name wird hier »Jedo« gelesen; er wird traditionell auch mit »Iddo« wiedergegeben.
    reason: textual_name_alternative
  - marker: c
    text: Das mit »über« übersetzte hebräische Wort kann je nach Zusammenhang auch »gegen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Die übrigen Taten Salomos
  rationale: שְׁאָר bezeichnet den Rest; דִּבְרֵי meint in der königlichen Schlussformel nicht nur Worte, sondern die Taten, Angelegenheiten oder Geschichte des Herrschers. »Taten« ist im Deutschen klar und dem historiografischen Zusammenhang angemessen.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: die früheren wie die späteren
  rationale: Die Formulierung umfasst den gesamten zeitlichen Verlauf und bewahrt zugleich die Zweiteilung des Hebräischen.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … niedergeschrieben?
  rationale: Die rhetorische Frage und das Motiv schriftlicher Überlieferung werden formal erhalten.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: in den Aufzeichnungen des Propheten Nathan
  rationale: In einer Quellenangabe kann דִּבְרֵי eine schriftliche Darstellung bezeichnen. »Aufzeichnungen« gibt diesen dokumentarischen Sinn natürlich wieder; עַל wird mit der im Deutschen idiomatischen Konstruktion »in … niedergeschrieben« ausgedrückt.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: in der Weissagung Ahijas aus Schilo
  rationale: נְבוּאָה bedeutet »Weissagung/Prophetie«. Das Gentiliz הַשִּׁילוֹנִי wird für heutige Leser verständlich als Herkunftsangabe »aus Schilo« wiedergegeben.
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: in den Visionen des Sehers Jedo
  rationale: חֲזוֹת bezeichnet Visionen; חֹזֶה wird als »Seher« übersetzt und so vom Titel נָבִיא unterschieden. »Jedo« folgt der masoretischen Lesetradition des hier überlieferten Namens; die traditionelle Form »Iddo« wird in einer Fußnote genannt.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: über Jerobeam, den Sohn Nebats
  rationale: עַל bezeichnet hier am wahrscheinlichsten den Gegenstand der Visionen. Die mögliche adversative Bedeutung »gegen« bleibt durch eine Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die annalistische Schlussformel bleibt als rhetorische Frage erkennbar. Geläufige biblische Eigennamen werden verwendet; »aus Schilo« ist verständlicher als das wenig gebräuchliche »der Schiloniter«. Die Satzstellung bleibt trotz der langen Quellenliste lesbar.
