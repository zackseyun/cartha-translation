base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: de
  text: König Salomo fertigte zweihundert Großschilde aus gehämmertem Gold an. Für jeden Schild wurden sechshundert Schekel[a] an gehämmertem Gold verwendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „Sechshundert gehämmertes Gold [kamen] auf den einen Schild.“ Eine Gewichtseinheit wird nicht genannt; „Schekel“ ist zur Verdeutlichung ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fertigte … an
  rationale: Das häufige Verb עשה bedeutet „machen, herstellen“. In diesem handwerklichen Zusammenhang gibt „anfertigen“ den Sinn natürlich und präzise wieder, ohne ein besonderes Herstellungsverfahren hinzuzufügen.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die Verbindung von Titel und Name entspricht natürlichem modernem Deutsch.
- source_word: מָאתַיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: צִנָּה
  choice: Großschilde
  rationale: צִנָּה bezeichnet wahrscheinlich einen großen, den Körper deckenden Schild und unterscheidet sich damit von Bezeichnungen für kleinere Schilde.
- source_word: זָהָב שָׁחוּט
  choice: gehämmertes Gold
  rationale: שָׁחוּט bezeichnet hier bearbeitetes, vermutlich dünn gehämmertes Gold. Die Formulierung bleibt verständlich und legt die genaue technische Ausführung nicht übermäßig fest.
- source_word: שֵׁשׁ מֵאוֹת
  choice: sechshundert
  rationale: Direkte Wiedergabe der Zahl; die im Hebräischen nicht genannte Gewichtseinheit wird als „Schekel“ ergänzt und durch eine Fußnote kenntlich gemacht.
- source_word: יַעֲלֶה עַל
  choice: wurden … verwendet
  rationale: Wörtlich heißt die Wendung, dass die Goldmenge „auf“ den jeweiligen Schild kam. „Verwendet“ gibt im Deutschen den mengenbezogenen Sinn natürlich wieder, ohne vollständige Bedeckung zu behaupten.
- source_word: הַצִּנָּה הָאֶחָת
  choice: für jeden Schild
  rationale: Das wörtliche „für den einen Schild“ hat hier distributiven Sinn; modernes Deutsch drückt dies idiomatisch mit „für jeden Schild“ aus.
- source_word: '[implizite Gewichtseinheit nach שֵׁשׁ מֵאוֹת]'
  choice: Schekel
  rationale: Der masoretische Text nennt nach „sechshundert“ keine Einheit, setzt jedoch im Zusammenhang eine Gewichtsangabe voraus. „Schekel“ macht dieses Verständnis lesbar, während die Fußnote die Auslassung im Hebräischen offenlegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Großschilde“ bewahrt die wahrscheinliche Unterscheidung zwischen dem großen Körperschild und kleineren Schildarten. Die zwei hebräischen Satzteile werden zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert; die sachlich-inventarartige Erzählweise bleibt erhalten.
