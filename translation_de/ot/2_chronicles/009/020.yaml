source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: de
  text: Alle Trinkgefäße König Salomos waren aus Gold, und alle Geräte des Hauses des Libanonwaldes[a] waren aus reinem Gold.[b] Silber galt in den Tagen Salomos als nichts.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Palastes des Libanonwaldes«; dies ist der Name eines königlichen Gebäudes.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »verschlossenes Gold«; eine Wendung, die gewöhnlich als »reines« oder »geläutertes Gold« verstanden wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Silber wurde in den Tagen Salomos für völlig wertlos gehalten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: Trinkgefäße
  rationale: Die Verbindung bezeichnet Gegenstände, die zum Trinken dienen. »Trinkgefäße« bleibt konkret, ohne die Bedeutung unnötig auf Becher einzuengen.
- source_word: זָהָב
  choice: Gold
  rationale: Die gewöhnliche Materialbezeichnung wird an beiden Stellen entsprechend dem hebräischen Wortlaut beibehalten.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Haus des Libanonwaldes
  rationale: Die Wiedergabe folgt dem hebräischen Namen eines bestimmten königlichen Gebäudes und bewahrt בֵּית als »Haus«; »Palast« wäre eine mögliche, aber deutendere Übersetzung.
- source_word: זָהָב סָגוּר
  choice: reines Gold
  rationale: Die feste Verbindung bezeichnet hochwertiges beziehungsweise geläutertes Gold. »Reines Gold« gibt den idiomatischen Sinn verständlich wieder; die wörtliche Vorstellung von »verschlossenem Gold« wäre im Deutschen unklar.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: Silber galt ... als nichts
  rationale: Die Formulierung bewahrt die starke Aussage des Hebräischen über die damalige Bedeutungslosigkeit des Silbers, ohne sie ausdrücklich auf einen bestimmten Wertbegriff festzulegen.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: in den Tagen Salomos
  rationale: Die geläufige biblisch-historische Wendung entspricht dem hebräischen Ausdruck und vermeidet die zusätzliche Festlegung auf »während Salomos Regierungszeit«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Ton. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, während die im Hebräischen fehlende Kopula im Deutschen natürlich ergänzt wird.
