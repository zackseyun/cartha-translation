  yaml_path: translation/ot/2_chronicles/009/028.yaml
  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: de
  text: Und man führte für Salomo Pferde aus Ägypten und aus allen Ländern ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich »herausbringen« bzw. »hinausführen«. Im Zusammenhang des Pferdehandels bezeichnet es hier die Einfuhr als Handelsvorgang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: man führte … ein
  rationale: Das Hifil-Partizip von יצא bedeutet wörtlich »hinausführen/herausbringen«. Im Zusammenhang des Pferdehandels bezeichnet es die Einfuhr. Das unbestimmte deutsche »man« gibt den nicht näher bezeichneten pluralischen Handlungsträger natürlich wieder.
- source_word: סוּסִים
  choice: Pferde
  rationale: Direkte Wiedergabe des pluralischen Substantivs.
- source_word: מִ/מִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מן kennzeichnet Herkunft oder Ausgangspunkt.
- source_word: לִ/שְׁלֹמֹה
  choice: für Salomo
  rationale: ל kann Ziel oder Begünstigten bezeichnen; im Handelszusammenhang ist »für Salomo« idiomatisch und bewahrt beide Nuancen angemessen.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: und aus allen Ländern
  rationale: Die Formulierung gibt die Vielzahl der Herkunftsgebiete natürlich wieder; »Länder« entspricht hier dem Plural von אֶרֶץ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Handelsbezeichnung »einführen« steht im Haupttext; die wörtlichere Bewegungsbedeutung des hebräischen Verbs bleibt in der Fußnote sichtbar.
