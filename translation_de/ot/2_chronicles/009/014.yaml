  text: לְ/בַ֞ד מֵ/אַנְשֵׁ֧י הַ/תָּרִ֛ים וְ/הַ/סֹּחֲרִ֖ים מְבִיאִ֑ים וְ/כָל מַלְכֵ֤י עֲרַב֙ וּ/פַח֣וֹת הָ/אָ֔רֶץ מְבִיאִ֛ים זָהָ֥ב וָ/כֶ֖סֶף לִ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: de
  text: Abgesehen von dem, was die Händler und Kaufleute brachten, brachten auch alle Könige Arabiens und die Statthalter des Landes Salomo Gold und Silber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: Händler
  rationale: Wörtlich etwa »Männer der Umherziehenden«; im Zusammenhang bezeichnet die Wendung reisende Händler. Das schlichte »Händler« ist im Deutschen natürlich und sachgerecht.
- source_word: הַסֹּחֲרִים
  choice: Kaufleute
  rationale: Bewahrt neben »Händler« die zwei parallelen Handelsbezeichnungen des Hebräischen, ohne einen spekulativen Bedeutungsunterschied festzuschreiben.
- source_word: מַלְכֵי עֲרַב
  choice: Könige Arabiens
  rationale: עֲרַב wird hier als geografische Bezeichnung verstanden; »Arabiens« ist idiomatisch und entspricht dem Kontext tributbringender Herrscher.
- source_word: פַחוֹת הָאָרֶץ
  choice: Statthalter des Landes
  rationale: פַחוֹת bezeichnet regionale Verwaltungsbeamte beziehungsweise Gouverneure; »Statthalter« ist eine geläufige, historisch angemessene Wiedergabe.
- source_word: מְבִיאִים
  choice: brachten
  rationale: Das Partizip kann fortlaufendes oder wiederholtes Bringen ausdrücken. Im deutschen Erzählzusammenhang gibt das Präteritum den Vorgang natürlich wieder, ohne eine einmalige Handlung zu behaupten.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Vers setzt syntaktisch den Betrag aus Vers 13 fort; deshalb beginnt die Übersetzung bewusst mit dem kleingeschriebenen Anschluss »abgesehen von …« und markiert danach einen neuen Satz, um die beiden Lieferantengruppen klar zu gliedern.
