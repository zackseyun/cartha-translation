  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: de
  text: Und der König machte aus dem Algummimholz Aufgänge[a] für das Haus Jahwes und für das Haus des Königs sowie Leiern und Harfen für die Sänger. Etwas Derartiges hatte man zuvor im Land Juda noch nie gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aufgänge“ kann auch „Treppen“ oder „angelegte Zugangswege“ bedeuten. Die genaue Art dieser Bauelemente ist nicht sicher. Das hier „Algummimholz“ genannte kostbare Holz heißt in der Parallelstelle 1. Könige 10,12 „Almuggimholz“; die Baumart ist unbekannt.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: Algummimholz
  rationale: Die seltene Holzbezeichnung wird nach der Form in der Chronik transliteriert, da die genaue Baumart unbekannt ist; die abweichende Form im Königsbuch wird in der Fußnote genannt.
- source_word: מְסִלּוֹת
  choice: Aufgänge
  rationale: Das Wort bezeichnet grundsätzlich erhöhte oder angelegte Wege. Im architektonischen Zusammenhang gibt „Aufgänge“ die Zugänge zu den Gebäuden wieder, ohne eindeutig Treppen vorauszusetzen.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: für das Haus Jahwes und für den Palast des Königs
  rationale: „Haus Jahwes“ bewahrt die hebräische Bezeichnung des Heiligtums; beim königlichen Haus macht „Palast“ die gemeinte Gebäudefunktion in natürlichem Deutsch deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: Leiern und Harfen
  rationale: Die beiden verschiedenen Saiteninstrumente werden mit geläufigen deutschen Näherungsbezeichnungen unterschieden; ihre genaue Bauart ist nicht sicher bestimmbar.
- source_word: לַשָּׁרִים
  choice: für die Sänger
  rationale: Die Form gehört zum Verb „singen“ und bezeichnet hier unmittelbar die Sänger.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים בְּאֶרֶץ יְהוּדָה
  choice: Etwas Derartiges hatte man zuvor im Land Juda noch nie gesehen
  rationale: Die natürliche deutsche Formulierung bewahrt den Sinn, dass solche Gegenstände in Juda bis dahin beispiellos waren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ erhält ihn als Eigennamen, statt ihn durch einen Hoheitstitel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ließ … anfertigen“ gibt die königliche Veranlassung idiomatisch wieder. Die seltene Holzart bleibt transliteriert, und die Mehrdeutigkeit der architektonischen Bezeichnung wird durch „Aufgänge“ samt Fußnote erhalten.
