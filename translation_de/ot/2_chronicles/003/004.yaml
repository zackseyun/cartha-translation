  text: וְ/הָ/אוּלָ֡ם אֲשֶׁר֩ עַל פְּנֵ֨י הָ/אֹ֜רֶךְ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/הַ/גֹּ֖בַהּ מֵאָ֣ה וְ/עֶשְׂרִ֑ים וַ/יְצַפֵּ֥/הוּ מִ/פְּנִ֖ימָה זָהָ֥ב טָהֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: de
  text: Die Vorhalle vor dem Haus war zwanzig Ellen lang, entsprechend der Breite des Hauses, und hundertzwanzig Ellen hoch.[a] Er überzog ihr Inneres mit reinem Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt für die Höhe der Vorhalle „hundertzwanzig“; die Maßeinheit wird aus dem Zusammenhang verstanden. Die parallele Beschreibung in 1. Könige 6,3 nennt Länge und Breite der Vorhalle, aber nicht diese Höhe. Deshalb vermuten manche hier ein Textproblem; die Übersetzung folgt dem überlieferten masoretischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: die Vorhalle
  rationale: אוּלָם bezeichnet die dem Hauptgebäude vorgelagerte Eingangs- oder Hallenstruktur. „Vorhalle“ ist im Deutschen natürlich, architektonisch passend und allgemein verständlich.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: an der Vorderseite
  rationale: Die Wendung beschreibt die räumliche Lage vor dem Haus. „An der Vorderseite“ gibt diesen Sinn idiomatisch wieder, ohne eine bestimmte Ausrichtung hinzuzufügen.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: zwanzig Ellen lang, entsprechend der Breite des Hauses
  rationale: Die knappe hebräische Formulierung setzt die Länge der Vorhalle zur Breite des Hauses in Beziehung. „Entsprechend“ macht diesen Zusammenhang verständlich, ohne über den Ausgangstext hinauszugehen.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: zwanzig Ellen
  rationale: „Elle“ ist die übliche deutsche Wiedergabe des antiken Längenmaßes; eine moderne Umrechnung würde eine nicht ausdrücklich gegebene Genauigkeit nahelegen.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: und hundertzwanzig Ellen hoch
  rationale: Die Maßeinheit wird aus dem Zusammenhang ergänzt, wie es im Deutschen für eine klare Höhenangabe erforderlich ist. Die Zahl folgt dem masoretischen Text.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Er überzog ihr Inneres
  rationale: צפה bezeichnet hier das Überziehen oder Verkleiden mit einem Material; מִפְּנִימָה bestimmt die Innenseite. Das feminine Pronomen bezieht sich natürlich auf die Vorhalle.
- source_word: זָהָב טָהוֹר
  choice: reinem Gold
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Materialangabe.
