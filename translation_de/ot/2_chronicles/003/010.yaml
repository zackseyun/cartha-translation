translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform des Hebräischen bleibt erhalten; der auffällige Numeruswechsel vom singularischen Handeln des Königs zum pluralischen Überziehen durch nicht näher genannte Ausführende wird nicht eingeebnet.
