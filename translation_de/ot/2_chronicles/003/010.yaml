lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Im Allerheiligsten
  rationale: Die wörtliche Konstruktion bezeichnet idiomatisch den innersten, heiligsten Raum des Tempels. „Im Allerheiligsten“ ist die geläufige, präzise deutsche Wiedergabe.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: zwei Kerubim
  rationale: „Kerubim“ ist die im Deutschen etablierte, dem Hebräischen entsprechende Pluralform und passt zum sakralarchitektonischen Zusammenhang.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: als Bildhauerarbeit
  rationale: Die seltene und unsichere Wendung beschreibt hier wahrscheinlich die Art der handwerklichen Ausführung beziehungsweise ein plastisches Kunstwerk, nicht eindeutig den Handwerker. „Als Bildhauerarbeit“ gibt diesen Sinn natürlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: und überzog sie mit Gold
  rationale: צפה bezeichnet in diesem baulichen und kultischen Zusammenhang das Belegen beziehungsweise Überziehen eines Gegenstands mit Metall. Der Wechsel vom Singular „er fertigte“ zum Plural „sie überzogen“ wird entsprechend dem hebräischen Text bewahrt.
