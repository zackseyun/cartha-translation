  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: de
  text: Im Allerheiligsten fertigte er zwei Kerubim, ein Werk der Bildhauerkunst[a], an, und man überzog sie mit Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schnitzwerk“, „plastische Arbeit“ oder „Kunstwerk“. Die Bedeutung des seltenen hebräischen Ausdrucks ist unsicher.'
