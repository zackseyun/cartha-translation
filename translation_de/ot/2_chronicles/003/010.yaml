  naturalness: „Fertigte ... als Bildhauerarbeit an“ ist verständlich, aber stilistisch schwerfällig und syntaktisch weniger idiomatisch. „Ein Werk der Bildhauerkunst“ ist modernes, würdevolles Deutsch. Für den nicht näher bestimmten pluralischen Ausführer ist das deutsche unpersönliche „man überzog sie“ natürlich; eine wörtliche Übernahme des Numeruswechsels ergäbe im Deutschen einen missverständlichen oder ungrammatischen Satz.
  terminology: „Allerheiligsten“ und „Kerubim“ sind angemessen. „Werk der Bildhauerkunst“ wahrt den Bezug auf plastisch-künstlerische Herstellung, ohne den seltenen hebräischen Ausdruck übermäßig festzulegen.
