lexical_decisions:
- source_word: וַיָּחֶל לִבְנוֹת
  choice: Er begann … mit dem Bau
  rationale: Die Verbindung aus וַיָּחֶל und dem Infinitiv לִבְנוֹת bezeichnet den Beginn des Bauens. Die deutsche Wendung „mit dem Bau beginnen“ ist natürlich und gibt den Sinn präzise wieder; das erzählende וַ wird im Deutschen nicht eigens mit „und“ wiedergegeben.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: des zweiten Monats
  rationale: Die Zeitangabe bezeichnet den Monat, in dem der Bau begann. In Verbindung mit dem ergänzten Tag ist „am zweiten Tag des zweiten Monats“ idiomatisches Standarddeutsch.
- source_word: בַּשֵּׁנִי
  choice: am zweiten Tag
  rationale: Das wiederholte Ordinalzahlwort steht im Hebräischen elliptisch und wird gewöhnlich als Angabe des zweiten Tages verstanden. „Tag“ wird zur Verständlichkeit ergänzt; die wörtliche Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: im vierten Jahr
  rationale: Dies ist die übliche deutsche Wiedergabe einer Datierung nach Regierungsjahren.
- source_word: לְמַלְכוּתוֹ
  choice: seiner Herrschaft
  rationale: Das Wort bezeichnet hier die Königsherrschaft als zeitlichen Bezugspunkt. „Seiner Herrschaft“ ist in einer Datierungsformel natürlich und sachlich.
