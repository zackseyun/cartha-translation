base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: de
  text: Er machte das Allerheiligste[a]. Seine Länge entsprach der Breite des Tempelhauses und betrug zwanzig Ellen; auch seine Breite betrug zwanzig Ellen. Er überzog es mit hochwertigem Gold im Gewicht von sechshundert Talenten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Haus des Allerheiligsten; auch übersetzbar: das Allerheiligste.'
    reason: lexical_alternative
  - marker: b
    text: Ein Talent war eine große Gewichtseinheit; sein genauer Wert war je nach Zeit und Region unterschiedlich.
    reason: measurement_clarification
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: den Raum des Allerheiligsten
  rationale: Die Konstruktion bezeichnet den innersten Heiligtumsraum. »Raum des Allerheiligsten« ist im modernen Deutsch verständlich, bewahrt den räumlichen Bezug von בֵּית und gibt die hebräische Superlativwendung angemessen wieder.
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  choice: Seine Länge entsprach der Breite des Tempelhauses
  rationale: עַל־פְּנֵי beschreibt hier die räumliche Zuordnung beziehungsweise Erstreckung entlang der Hausbreite. »Entsprach« vermittelt im architektonischen Zusammenhang klar, dass die Raumlänge mit der Breite des Tempelgebäudes übereinstimmte.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: zwanzig Ellen
  rationale: Die historische Maßeinheit wird quellentreu beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: auch seine Breite betrug zwanzig Ellen
  rationale: Die Ergänzung »betrug« ergibt einen natürlichen deutschen Maßsatz; »auch« verdeutlicht ohne sachliche Erweiterung die identische zweite Abmessung.
- source_word: וַיְחַפֵּהוּ
  choice: Er überzog ihn
  rationale: חפה bezeichnet beim Tempelbau das Belegen einer Oberfläche mit einem Material. »Überziehen« ist dafür im Deutschen präzise und idiomatisch.
- source_word: זָהָב טוֹב
  choice: hochwertigem Gold
  rationale: טוֹב bezeichnet hier die Güte des Goldes. »Hochwertig« vermeidet sowohl das unnatürliche »gutes Gold« als auch die möglicherweise zu enge Aussage »reines Gold«.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: mit sechshundert Talenten
  rationale: Die Präposition לְ kennzeichnet hier wahrscheinlich die verwendete Gesamtmenge. Die Einbindung mit »mit« ergibt zusammen mit »überzog« einen knappen, natürlichen deutschen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historische Maßeinheit »Elle« sowie die Gewichtseinheit »Talent« bleiben erhalten. Der lange hebräische Satz wird zur besseren Verständlichkeit in drei Sätze gegliedert; die architektonische Beziehung der Maße bleibt ausdrücklich gewahrt.
