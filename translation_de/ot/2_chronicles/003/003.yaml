base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: de
  text: 'Und dies ist die Grundlage, die Salomo für den Bau des Hauses Gottes legte: Die Länge in Ellen[a] betrug nach dem früheren Maß sechzig Ellen[b], die Breite zwanzig Ellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle war ein antikes Längenmaß, das ungefähr der Länge eines Unterarms entsprach. Die genaue Länge konnte je nach Maßstandard variieren.
    reason: cultural_note
  - marker: b
    text: „Nach dem früheren Maß“ kann sich auf einen älteren Ellenstandard beziehen. Der hebräische Ausdruck lässt den genauen historischen Bezug offen.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: die Grundlagen, die … legte
  rationale: Die schwierige Form von יסד bezeichnet hier am ehesten das Grundlegen beziehungsweise die grundlegenden Vorgaben für den Bau. Die deutsche Wendung bewahrt den Bezug zum Legen einer Grundlage, ohne die Stelle vorschnell nur als Bauplan zu deuten.
- source_word: לִבְנוֹת
  choice: für den Bau
  rationale: Der Infinitiv mit ל drückt den Zweck aus; „für den Bau“ ist natürliches Deutsch und gibt diesen Sinn knapp wieder.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die Wiedergabe bleibt nah am hebräischen Tempelidiom und vermeidet die stärker deutende Übersetzung „Tempel Gottes“.
- source_word: אַמּוֹת
  choice: Ellen
  rationale: Die antike Maßeinheit wird beibehalten statt modern umgerechnet; „Elle“ ist die übliche deutsche Bezeichnung.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: nach dem früheren Maß
  rationale: Die Formulierung bleibt nahe am Hebräischen und lässt offen, auf welchen älteren Maßstandard genau verwiesen wird.
- source_word: הָאֹרֶךְ … וְרֹחַב
  choice: die Länge … die Breite
  rationale: Übliche und klare deutsche Begriffe für architektonische Abmessungen.
