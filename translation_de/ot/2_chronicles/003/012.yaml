  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: de
  text: Der eine Flügel des einen Kerubs war fünf Ellen lang und reichte bis an die Wand des Hauses[a]; der andere Flügel war ebenfalls fünf Ellen lang und berührte den Flügel des anderen Kerubs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist hier das Tempelgebäude gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כְנַף
  choice: Flügel
  rationale: Im Zusammenhang mit den Kerubfiguren ist die konkrete Bedeutung „Flügel“ eindeutig.
- source_word: כְּרוּב
  choice: Kerub
  rationale: Das hebräische Substantiv steht im Singular; „Kerub“ gibt Zahl und Bezeichnung korrekt wieder.
- source_word: אַמּוֹת חָמֵשׁ
  choice: fünf Ellen lang
  rationale: Die antike Maßeinheit wird aus Genauigkeits- und Konsistenzgründen beibehalten; „lang“ macht die Maßangabe im Deutschen natürlich verständlich.
- source_word: מַגִּיעַ
  choice: reichte bis an
  rationale: Die Form bezeichnet hier das räumliche Heranreichen des Flügels bis zur Wand.
- source_word: קִיר הַבָּיִת
  choice: die Wand des Hauses
  rationale: Die wörtliche Bezeichnung „Haus“ bleibt erhalten; im Kontext ist damit das Tempelgebäude gemeint.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: der andere Flügel
  rationale: Dies ist die natürliche deutsche Wiedergabe des Adjektivs „andere“, das sich auf den Flügel bezieht.
- source_word: דְּבֵקָה
  choice: berührte
  rationale: Das Verb beschreibt engen Kontakt. „Berührte“ passt zur architektonischen Anordnung, ohne eine nicht ausdrücklich genannte feste Verbindung zu behaupten.
- source_word: הַכְּרוּב הָאַחֵר
  choice: der andere Kerub
  rationale: Bewahrt die Paarbeziehung und gibt das hebräische „andere“ unmittelbar wieder.
