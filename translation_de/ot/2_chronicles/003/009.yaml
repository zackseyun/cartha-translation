  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: de
  text: Das Gewicht der Nägel betrug fünfzig Schekel Gold, und die oberen Räume[a] überzog er mit Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Obergemächer“; das hebräische Wort kann allgemeiner obere Gebäudeteile oder Räume des Tempels bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: Das Gewicht
  rationale: מִשְׁקָל bezeichnet das Gewicht beziehungsweise die gewogene Menge. Das einleitende ו wird im Deutschen nicht eigens mit „und“ wiedergegeben, da der Satzanschluss auch ohne Konjunktion natürlich erkennbar bleibt.
- source_word: לְמִסְמְרוֹת
  choice: der Nägel
  rationale: מִסְמְרוֹת kann Nägel oder Pflöcke bezeichnen. Im Zusammenhang des Tempelbaus ist „Nägel“ die naheliegende und zugleich hinreichend allgemeine Wiedergabe; die Präposition ל wird entsprechend der Gewichtskonstruktion idiomatisch als Genitiv ausgedrückt.
- source_word: לִשְׁקָלִים חֲמִשִּׁים
  choice: betrug fünfzig Schekel
  rationale: Die Wendung nennt die gemessene Menge. „betrug“ bildet die im Hebräischen nominal formulierte Gewichtsangabe in natürlichem Deutsch ab.
- source_word: זָהָב
  choice: Gold
  rationale: זָהָב bezeichnet das Material beziehungsweise die Gewichtseinheit in Gold. „fünfzig Schekel Gold“ ist im Deutschen knapp und eindeutig.
- source_word: וְהָעֲלִיּוֹת
  choice: die Obergemächer
  rationale: עֲלִיּוֹת bezeichnet erhöhte Räume, Oberkammern oder allgemeiner obere Gebäudeteile. „Obergemächer“ wahrt den architektonischen und räumlichen Sinn; die Unsicherheit über den genauen Bezug wird in der Fußnote vermerkt.
- source_word: חִפָּה
  choice: überzog er
  rationale: חפה bezeichnet hier das Bedecken beziehungsweise Verkleiden einer baulichen Oberfläche mit einem Material. „mit Gold überziehen“ ist dafür die übliche deutsche Formulierung.
- source_word: זָהָב
  choice: mit Gold
  rationale: In Verbindung mit חִפָּה nennt זָהָב den Stoff des Überzugs; „mit Gold“ entspricht natürlichem deutschem Sprachgebrauch.
