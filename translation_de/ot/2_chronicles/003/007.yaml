  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: de
  text: Er überzog das Haus[a] – die Balken[b], die Schwellen[c], seine Wände und seine Türen – mit Gold und schnitzte Kerubim in die Wände[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempel. Hebräisch steht wörtlich „das Haus“, eine übliche Bezeichnung für den Tempel.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Dachsparren“. Das hebräische Wort bezeichnet Bauhölzer beziehungsweise Balken.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Türpfosten“ beziehungsweise „die Türschwellen“. Der genaue architektonische Sinn des hebräischen Ausdrucks ist nicht sicher.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „er gravierte“. Das hebräische Verb kann das Schnitzen beziehungsweise Eingravieren eines Bildmotivs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: er überzog
  rationale: Das Verb bezeichnet hier das Bedecken eines Bauwerks mit einer Materialschicht; „überziehen“ ist im architektonischen Zusammenhang natürlich und präzise.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die wörtliche Bezeichnung „das Haus“ bleibt erhalten; aus dem Zusammenhang ist klar, dass der Tempel gemeint ist.
- source_word: הַקֹּרוֹת
  choice: die Balken
  rationale: Das Substantiv bezeichnet tragende Bauhölzer; „Balken“ wahrt die allgemeinere Bedeutung, ohne sie unnötig auf Dachsparren einzuengen.
- source_word: הַסִּפִּים
  choice: die Schwellen
  rationale: Der Ausdruck kann Bauteile im Türbereich bezeichnen. „Schwellen“ ist hier eine plausible architektonische Wiedergabe, während „Türpfosten“ ebenfalls möglich bleibt.
- source_word: קִירוֹתָיו
  choice: seine Wände
  rationale: Der maskuline Singularsuffix bezieht sich auf das Haus; die schlichte Wiedergabe ist idiomatisch und genau.
- source_word: דַלְתוֹתָיו
  choice: seine Türen
  rationale: Das Wort bezeichnet Türen beziehungsweise Türflügel; „Türen“ ist im modernen Deutsch klar und ausreichend genau.
- source_word: זָהָב
  choice: mit Gold
  rationale: Das nachgestellte Material wird im Deutschen idiomatisch mit „mit“ an das Verb „überziehen“ angeschlossen.
- source_word: וּפִתַּח
  choice: und er schnitzte
  rationale: Das Verb bezeichnet das Einschneiden oder Eingravieren eines Bildmotivs. „Schnitzte“ passt zu ornamentaler Arbeit im Tempel, ohne das Trägermaterial ausdrücklich festzulegen.
- source_word: כְּרוּבִים
  choice: Kerubim
  rationale: „Kerubim“ bewahrt den biblischen Fachbegriff und die hebräische Pluralform.
- source_word: עַל הַקִּירוֹת
  choice: an die Wände
  rationale: Bei einem Verb des Anbringens oder Einschneidens gibt „an die Wände“ die Lage des Bildwerks natürlich wieder; „auf den Wänden“ wäre ebenfalls denkbar.
