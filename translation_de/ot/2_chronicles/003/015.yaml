base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: de
  text: Vor dem Haus errichtete er zwei Säulen, fünfunddreißig Ellen lang[a]. Der Säulenaufsatz oben auf jeder Säule[b] maß fünf Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fünfunddreißig Ellen an Länge“. In 1. Könige 7,15 wird jede Säule mit achtzehn Ellen angegeben. Daher verstehen manche die Zahl hier als Gesamtlänge beider Säulen; möglicherweise liegt auch eine Textschwierigkeit vor.'
    reason: cross_reference
  - marker: b
    text: 'Hebräisch: „auf seiner Spitze“. Das singularische Fürwort bezieht sich wahrscheinlich verteilend auf jede der beiden Säulen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: vor dem Haus
  rationale: Bewahrt die räumliche Bedeutung von לִפְנֵי und gibt הַבַּיִת entsprechend dem hebräischen Tempelwortlaut als „Haus“ wieder.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: zwei Säulen
  rationale: „Säulen“ ist in diesem architektonischen Zusammenhang die geläufige und genaue deutsche Entsprechung.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: fünfunddreißig Ellen lang
  rationale: Gibt אֹרֶךְ formal als Längenangabe wieder und erhält die antike Maßeinheit; eine Deutung als Höhe wird nicht stillschweigend in den Haupttext eingetragen.
- source_word: הַצֶּפֶת
  choice: der Säulenaufsatz
  rationale: Bezeichnet hier das obere architektonische Zierstück; „Säulenaufsatz“ ist für heutige Leser verständlicher als der Fachausdruck „Kapitell“.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: oben auf jeder Säule
  rationale: רֹאשׁ wird bei einem Gegenstand idiomatisch mit „oben“ wiedergegeben. Das singularische Suffix wird im Zusammenhang mit den zwei Säulen distributiv verstanden; die formale Singularität wird in einer Fußnote kenntlich gemacht.
- source_word: אַמּוֹת חָמֵשׁ
  choice: fünf Ellen hoch
  rationale: Die Maßangabe wird mit der antiken Einheit bewahrt; „hoch“ verdeutlicht natürlich die vertikale Ausdehnung des Säulenaufsatzes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus“ bewahrt das Tempelmotiv des hebräischen Wortlauts; „Säulenaufsatz“ vermeidet unnötig technisches Vokabular. Die problematische Maßangabe und der singularische Rückbezug werden nicht harmonisiert, sondern in Fußnoten transparent gemacht.
