source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: de
  text: Er stellte die Säulen vor der Tempelhalle[a] auf, eine rechts und eine links. Die rechte nannte er Jachin, die linke Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Haupthalle des Tempels“. Das hebräische Wort bezeichnet hier die Haupthalle des Tempelgebäudes, nicht unbedingt die gesamte Tempelanlage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: stellte … auf
  rationale: Der Hifil von קום bezeichnet hier das Aufrichten beziehungsweise Aufstellen der Säulen; die gewählte Formulierung ist im Deutschen natürlich und baulich präzise.
- source_word: הָעַמּוּדִים
  choice: die Säulen
  rationale: עַמּוּדִים bezeichnet hier die beiden markanten Säulen am Tempel; „Säulen“ ist der geläufige deutsche Architekturbegriff.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: vor der Tempelhalle
  rationale: עַל־פְּנֵי gibt die Lage vor etwas an. הֵיכָל bezeichnet in diesem Zusammenhang die Haupthalle des Tempelgebäudes und nicht ohne Weiteres die gesamte Tempelanlage.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: eine rechts und eine links
  rationale: Die Übersetzung bewahrt die gewöhnlichen Richtungsangaben des Hebräischen, ohne sie als Himmelsrichtungen auszudeuten.
- source_word: וַיִּקְרָא שֵׁם
  choice: nannte
  rationale: Das knappe deutsche Benennungsverb gibt die hebräische Wendung idiomatisch und ohne Bedeutungsverlust wieder.
- source_word: הַיְמִינִי … הַשְּׂמָאלִי
  choice: die rechte … die linke
  rationale: Die substantivierten Adjektive beziehen sich eindeutig auf die zuvor genannten Säulen und ergeben im Deutschen eine klare, parallele Formulierung.
- source_word: יָכִין
  choice: Jachin
  rationale: Die überlieferte deutsche Namensform wird beibehalten.
- source_word: בֹּעַז
  choice: Boas
  rationale: „Boas“ ist die etablierte deutsche Wiedergabe des hebräischen Eigennamens.
