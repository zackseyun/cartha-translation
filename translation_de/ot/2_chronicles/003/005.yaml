  text: וְ/אֵ֣ת הַ/בַּ֣יִת הַ/גָּד֗וֹל חִפָּה֙ עֵ֣ץ בְּרוֹשִׁ֔ים וַ/יְחַפֵּ֖/הוּ זָהָ֣ב ט֑וֹב וַ/יַּ֧עַל עָלָ֛י/ו תִּמֹרִ֖ים וְ/שַׁרְשְׁרֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: de
  text: Das große Haus verkleidete er mit Zypressenholz[a], überzog es mit feinem Gold und brachte darauf Palmen und Ketten an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wacholderholz« oder »Tannenholz«. Welche Baumart בְּרוֹשׁ genau bezeichnet, ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Palmen und Ketten«; wahrscheinlich sind dekorative Palmenmotive und kettenartige Verzierungen gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: das große Haus
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die architektonische Bezeichnung des Hebräischen; aus dem Zusammenhang ist ersichtlich, dass ein Hauptraum des Tempels gemeint ist.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: verkleidete ... mit Zypressenholz
  rationale: חפה bezeichnet ein Bedecken oder Überziehen. Bei Holz als Material gibt »verkleiden« den Bauvorgang im Deutschen natürlich und präzise wieder.
- source_word: עֵץ בְּרוֹשִׁים
  choice: Zypressenholz
  rationale: »Zypresse« ist eine verbreitete Wiedergabe von בְּרוֹשׁ, dessen genaue botanische Bestimmung jedoch umstritten ist.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: überzog es mit feinem Gold
  rationale: »Überziehen« passt zum Vergolden einer bereits holzverkleideten Fläche; זָהָב טוֹב bezeichnet hochwertiges, feines Gold.
- source_word: וַיַּעַל עָלָיו
  choice: brachte darauf ... an
  rationale: Die Hifil-Form von עלה bezeichnet hier das Aufbringen dekorativer Elemente auf eine Oberfläche.
- source_word: תִּמֹרִים
  choice: Palmen
  rationale: Die direkte Wiedergabe wahrt die knappe Ausdrucksweise des Hebräischen; im architektonischen Zusammenhang sind wahrscheinlich Palmenmotive gemeint.
- source_word: שַׁרְשְׁרוֹת
  choice: Ketten
  rationale: Das Wort bezeichnet Ketten oder kettenartige Verzierungen. »Ketten« ist die formal nächste deutsche Entsprechung.
