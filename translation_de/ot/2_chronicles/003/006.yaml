  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: de
  text: Er überzog das Haus mit kostbaren Steinen zur Pracht.[a] Das Gold war Gold aus Parwajim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er überzog das Haus mit kostbarem Stein zur Pracht.“ „Das Haus“ ist in der Chronik eine übliche Bezeichnung für den Tempel.'
    reason: lexical_alternative
  - marker: b
    text: Parwajim ist ein nicht sicher identifizierter Ortsname. Die Wendung kann auch mit „Gold von Parwajim“ oder „Parwajim-Gold“ wiedergegeben werden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: Er verkleidete
  rationale: צפה bezeichnet hier das Überziehen bzw. Verkleiden eines Bauwerks mit einem dekorativen Material. „Verkleidete“ ist im deutschen Baukontext natürlich und lässt die genaue technische Ausführung offen.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Der hebräische Text sagt wörtlich „das Haus“; in diesem Zusammenhang ist damit der Tempel gemeint. Die Wiedergabe bewahrt die für die Chronik typische Bezeichnung.
- source_word: אֶבֶן יְקָרָה
  choice: mit kostbaren Steinen
  rationale: Der Singular אֶבֶן kann kollektiv gebraucht sein. Der deutsche Plural bezeichnet das dekorative Baumaterial idiomatisch.
- source_word: לְתִפְאָרֶת
  choice: um ihm Glanz zu verleihen
  rationale: Die Präposition לְ drückt hier Zweck oder Ergebnis aus; תִפְאָרֶת bezeichnet Schönheit, Pracht oder schmückenden Glanz. Die Formulierung ist natürlich und erhält den ästhetischen Sinn.
- source_word: וְהַזָּהָב
  choice: Das Gold aber
  rationale: Die Wendung leitet eine nähere Bestimmung des verwendeten Goldes ein. „Aber“ markiert den leichten thematischen Übergang, ohne einen starken Gegensatz zu behaupten.
- source_word: זְהַב פַּרְוָיִם
  choice: Gold aus Parwajim
  rationale: Die Status-constructus-Verbindung bezeichnet wahrscheinlich Herkunft oder Zuordnung. „Aus Parwajim“ gibt die mutmaßliche Herkunft klar wieder, obwohl der Ort nicht sicher identifiziert ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die für die Chronik charakteristische Bezeichnung „das Haus“ bleibt erhalten; die Fußnote erklärt den Tempelbezug. Die Formulierung vermeidet eine unnötig technische Festlegung bei צפה und bewahrt die Unsicherheit über Parwajim.
