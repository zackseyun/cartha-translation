source:
  edition: WLC
  text: וְ/כַנְפֵי֙ הַ/כְּרוּבִ֔ים אָרְכָּ֖/ם אַמּ֣וֹת עֶשְׂרִ֑ים כְּנַ֨ף הָ/אֶחָ֜ד לְ/אַמּ֣וֹת חָמֵ֗שׁ מַגַּ֨עַת֙ לְ/קִ֣יר הַ/בַּ֔יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֕יעַ לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: de
  text: 'Die Flügel der Kerubim waren zusammen zwanzig Ellen lang: Der eine Flügel war fünf Ellen lang und reichte bis an die Wand des Hauses[a]; der andere Flügel war ebenfalls fünf Ellen lang und reichte bis an den Flügel des anderen Kerubs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ bezeichnet hier das Tempelgebäude. „Bis an“ kann im Hebräischen auch bedeuten, dass der Flügel die Wand beziehungsweise den anderen Flügel tatsächlich berührte.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: Die Flügel der Kerubim
  rationale: Der Konstruktplural wird natürlich wiedergegeben. Das einleitende ו wird im Deutschen nicht eigens übersetzt, da der Vers als selbstständiger Satz vorliegt. „Kerubim“ bewahrt die herkömmliche Bezeichnung der himmlischen Wesen.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: waren zusammen zwanzig Ellen lang
  rationale: 'Wörtlich steht „ihre Länge: zwanzig Ellen“. „Zusammen“ verdeutlicht aus den folgenden Maßangaben, dass die Gesamtspannweite beider Flügel jedes Kerubs gemeint ist, ohne moderne Maße einzuführen.'
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: Der eine Flügel war fünf Ellen lang
  rationale: Die elliptische hebräische Maßangabe wird durch „war … lang“ idiomatisch ergänzt.
- source_word: מַגַּעַת לְקִיר הַבַּיִת
  choice: reichte bis an die Wand des Hauses
  rationale: נגע kann hier sowohl das Heranreichen als auch die tatsächliche Berührung bezeichnen. „Bis an“ wahrt diese Spannung besser als eine eindeutige Festlegung auf bloße Ausdehnung oder Kontakt.
- source_word: וְהַכָּנָף הָאַחֶרֶת אַמּוֹת חָמֵשׁ
  choice: der andere Flügel war ebenfalls fünf Ellen lang
  rationale: „Andere“ entspricht אַחֶרֶת; „ebenfalls“ macht die parallele, im Hebräischen elliptische Maßangabe im Deutschen klar.
- source_word: מַגִּיעַ לִכְנַף הַכְּרוּב הָאַחֵר
  choice: reichte bis an den Flügel des anderen Kerubs
  rationale: Die gleiche Verbalwurzel wird parallel wiedergegeben. Der Singular „Kerub“ entspricht הַכְּרוּב; der deutsche Akkusativ lautet „Kerub“.
theological_decisions: []
