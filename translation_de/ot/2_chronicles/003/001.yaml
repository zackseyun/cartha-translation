source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: de
  text: Dann begann Salomo, das Haus Jahwes in Jerusalem auf dem Berg Morija zu bauen, wo Jahwe seinem Vater David erschienen war[a] – an der Stelle, die David vorbereitet hatte, auf der Tenne Ornans, des Jebusiters[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen bleibt das Subjekt von »erschienen war« unausgesprochen; aus dem Zusammenhang ist Jahwe zu ergänzen. Auch eine auf den Berg bezogene Wiedergabe ist möglich: »der David, seinem Vater, gezeigt worden war«.'
    reason: alternative_reading
  - marker: b
    text: In den Chronikbüchern lautet der Name Ornan; in 2. Samuel 24,16.18 steht die Namensform Arauna.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Dann begann
  rationale: Die Erzählform führt das nächste Geschehen ein; »Dann« gibt die Abfolge natürlich wieder, und »begann« entspricht dem Verb in Verbindung mit dem folgenden Infinitiv.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Der Infinitiv mit ל ergänzt »begann« und wird im Deutschen natürlich als Infinitiv mit »zu« wiedergegeben.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: »Haus« bewahrt das hebräische Bild und bezeichnet hier den Tempel; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: auf dem Berg Morija
  rationale: Die Wortgruppe bezeichnet den konkreten Berg Morija; »auf« ist im Deutschen die natürliche lokale Präposition.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: wo Jahwe seinem Vater David erschienen war
  rationale: Nifal von ראה bezeichnet in diesem Zusammenhang eine Erscheinung. Das grammatische Subjekt ist nicht ausdrücklich genannt; Jahwe ist kontextuell naheliegend und wird zur Verständlichkeit ergänzt, während die formale Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: an der Stelle, die David vorbereitet hatte
  rationale: Der hebräische Ausdruck ist gedrängt. הכין bedeutet hier »vorbereiten/bereitmachen«; die deutsche Satzfügung macht den Bezug auf die von David vorbereitete Tempelstätte verständlich.
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: auf der Tenne des Jebusiters Ornan
  rationale: »Tenne« ist die sachlich genaue, geläufige Bezeichnung; »Ornan« folgt der Namensform des Chroniktextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt von נִרְאָה
  choice: 'Jahwe als aus dem Zusammenhang ergänztes Subjekt: »wo Jahwe … erschienen war«'
  alternative: »der seinem Vater David gezeigt worden war«
  rationale: Die göttliche Erscheinung ist im Erzählzusammenhang die wahrscheinlichste Deutung. Da das Hebräische das Subjekt unausgesprochen lässt und eine auf den Berg bezogene passive Auffassung formal möglich ist, wird diese Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus Jahwes« wahrt das Tempel-als-Haus-Bild; der Gedankenstrich gliedert die doppelte Ortsbestimmung, ohne die gedrängte hebräische Syntax unnötig aufzulösen.
