  text: וַ/יַּ֤עַשׂ שַׁרְשְׁרוֹת֙ בַּ/דְּבִ֔יר וַ/יִּתֵּ֖ן עַל רֹ֣אשׁ הָ/עַמֻּדִ֑ים וַ/יַּ֤עַשׂ רִמּוֹנִים֙ מֵאָ֔ה וַ/יִּתֵּ֖ן בַּֽ/שַּׁרְשְׁרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: de
  text: Er fertigte Ketten[a] im inneren Heiligtum[b] an und brachte sie oben an den Säulen an. Außerdem fertigte er hundert Granatäpfel an und brachte sie an den Ketten an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kettenwerk“ beziehungsweise „Girlanden“ als Zierwerk.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im inneren Raum“; traditionell: „im Allerheiligsten“. Das hebräische Wort bezeichnet das innere Heiligtum des Tempels; manche beziehen die Wendung hier allgemeiner auf die Zierarbeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: Ketten
  rationale: Das Substantiv bezeichnet kettenartige Zierarbeit. „Ketten“ gibt den konkreten Sinn wieder und passt zur Wiederholung am Versende; „Kettenwerk“ oder „Girlanden“ bleiben mögliche Alternativen.
- source_word: בַּדְּבִיר
  choice: im inneren Heiligtum
  rationale: דְּבִיר bezeichnet gewöhnlich den innersten Raum des Tempels. „Inneres Heiligtum“ ist verständlich und bewahrt den architektonischen Bezug, ohne die traditionelle Deutung „Allerheiligstes“ zwingend festzuschreiben.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: oben an den Säulen
  rationale: Wörtlich steht „auf den Köpfen der Säulen“. Die idiomatische deutsche Ortsangabe „oben an den Säulen“ gibt die räumliche Bedeutung natürlich wieder.
- source_word: רִמּוֹנִים
  choice: Granatäpfel
  rationale: Gemeint sind granatapfelförmige Schmuckelemente. Die konkrete Bezeichnung entspricht dem Hebräischen und ist im Zusammenhang verständlich.
- source_word: מֵאָה
  choice: hundert
  rationale: Die Zahl wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: brachte sie an den Ketten an
  rationale: Die Präposition bezeichnet hier am ehesten die Befestigung an der kettenartigen Zierarbeit. Die Formulierung lässt offen, auf welche genaue Weise die Schmuckstücke darin eingefügt waren.
theological_decisions:
- issue: Bezeichnung des דְּבִיר
  choice: inneres Heiligtum
  alternative: innerer Raum; Allerheiligstes
  rationale: Die gewählte Formulierung wahrt den üblichen Tempelbezug, ohne die stärker traditionsgebundene Bezeichnung „Allerheiligstes“ in den Haupttext zu setzen; die echte Bedeutungsbreite wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „anfertigen“ und „anbringen“ bildet den sachlich-inventarartigen Stil des hebräischen Textes ab; die Satzteilung verbessert die Lesbarkeit, ohne Inhalte hinzuzufügen.
