  source_fidelity: 'Der Entwurf gibt alle hebräischen Bestandteile zutreffend wieder: den Trennvorhang, die drei gefärbten Textilmaterialien, feines Leinen und die darauf angebrachten Cherubim. Die Wiedergabe der ungewöhnlichen Wendung וַיַּעַל עָלָיו in der Fußnote wahrt die wörtliche Grundlage und erläutert den kontextuellen Sinn ohne die Herstellungstechnik festzulegen.'
