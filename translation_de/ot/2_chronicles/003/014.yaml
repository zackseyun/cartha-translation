  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: de
  text: Er fertigte den Vorhang[a] aus blauem, purpurfarbenem und karmesinrotem Stoff sowie feinem Leinen an und arbeitete Cherubim in ihn ein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schleier«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »Er ließ Cherubim auf ihm hinaufkommen«; gemeint ist, dass er den Vorhang mit Cherubimfiguren verzierte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: den Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Trennvorhang des Heiligtums. »Vorhang« ist im modernen Deutschen klar und natürlich; »Schleier« bleibt als mögliche traditionelle Alternative in der Fußnote erhalten.
- source_word: תְּכֵלֶת
  choice: blauem … Stoff
  rationale: Das Wort bezeichnet blau beziehungsweise blauviolett gefärbtes Textilmaterial. Die Ergänzung »Stoff« macht deutlich, dass hier nicht bloß eine abstrakte Farbe gemeint ist.
- source_word: אַרְגָּמָן
  choice: purpurfarbenem Stoff
  rationale: Die Wiedergabe bezeichnet das kostbare purpurgefärbte Material und fügt sich natürlich in die Aufzählung der Textilien ein.
- source_word: כַרְמִיל
  choice: Karmesin
  rationale: כַרְמִיל bezeichnet ein intensiv rot gefärbtes Material. »Karmesin« bewahrt die Farbbezeichnung knapp; »Scharlach« ist eine geläufige Alternative.
- source_word: בּוּץ
  choice: feinem Leinen
  rationale: בּוּץ meint hochwertiges feines Leinen und nicht Leinen im Allgemeinen.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: arbeitete Cherubim in ihn ein
  rationale: Die Wendung lautet wörtlich etwa »er ließ Cherubim darauf hinaufkommen« und beschreibt hier die kunsthandwerkliche Verzierung des Vorhangs. »Arbeitete … ein« gibt den Sinn natürlich wieder, ohne eine bestimmte Technik wie Stickerei festzulegen.
- source_word: כְּרוּבִים
  choice: Cherubim
  rationale: »Cherubim« ist die etablierte biblische Bezeichnung und passt zur Bildwelt des Tempels.
