  text: כַּנְפֵי֙ הַ/כְּרוּבִ֣ים הָ/אֵ֔לֶּה פֹּֽרְשִׂ֖ים אַמּ֣וֹת עֶשְׂרִ֑ים וְ/הֵ֛ם עֹמְדִ֥ים עַל רַגְלֵי/הֶ֖ם וּ/פְנֵי/הֶ֥ם לַ/בָּֽיִת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: de
  text: Die Flügel dieser Cherubim waren zwanzig Ellen weit ausgebreitet, und sie standen auf ihren Füßen, ihre Gesichter dem Haus zugewandt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Tempel zugewandt«. Hebräisch: »dem Haus zugewandt«; »das Haus« ist eine geläufige Bezeichnung für das Tempelgebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: Die Flügel dieser Kerubim
  rationale: Gibt die hebräische Genitivverbindung und den Demonstrativ natürlich wieder; »Kerubim« bewahrt den etablierten biblischen Ausdruck.
- source_word: פֹּרְשִׂים אַמּוֹת עֶשְׂרִים
  choice: waren zwanzig Ellen weit ausgebreitet
  rationale: Das Partizip beschreibt den Zustand der Flügel. »weit« verdeutlicht idiomatisch die angegebene Ausdehnung, ohne eine bestimmte zusätzliche Maßrichtung festzulegen.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: und sie standen auf ihren Füßen
  rationale: Der ausdrückliche Plural des Pronomens richtet den Blick von den Flügeln auf die Kerubim selbst und beschreibt ihre aufrechte Haltung.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: ihre Gesichter dem Haus zugewandt
  rationale: Bewahrt »Haus« als wörtliche, im Chronikbuch geläufige Bezeichnung für das Tempelgebäude und gibt die räumliche Ausrichtung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von בַּיִת im Kontext des Tempelbaus
  choice: dem Haus zugewandt
  alternative: dem Tempel zugewandt
  rationale: Der hebräische Text verwendet das gewöhnliche Wort »Haus«, das hier den Tempel bezeichnet. Die Hauptübersetzung bewahrt diese Ausdrucksweise; die Fußnote klärt den Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Beschreibungsgang, klingt aber natürlich; »Ellen« bewahrt das antike Maß.
