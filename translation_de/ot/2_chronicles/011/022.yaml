  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: de
  text: Und Rehabeam setzte Abija, den Sohn Maachas, als Oberhaupt und Anführer unter seinen Brüdern[a] ein, denn er wollte ihn zum König machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über seine Brüder“. Die hebräische Präposition kann seinen Vorrang ihnen gegenüber bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: setzte … ein
  rationale: Das Hifil von עמד bezeichnet hier die Einsetzung in eine hervorgehobene Stellung. „setzte … ein“ ist im Deutschen natürlich und sachlich.
- source_word: לָרֹאשׁ
  choice: als Obersten
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und bezeichnet übertragen den Vorrang oder die leitende Stellung. „als Obersten“ gibt diesen Rang prägnant wieder.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Abija, den Sohn Maachas
  rationale: Die Namen werden in geläufiger deutscher Bibelform wiedergegeben; die hebräische Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: לְנָגִיד
  choice: in der Wendung „als Obersten“ mitgedacht
  rationale: נָגִיד bezeichnet einen Führenden beziehungsweise designierten Herrscher. Zusammen mit לָרֹאשׁ bildet es hier eine eng verbundene Rangbezeichnung; eine doppelte Wiedergabe wie „als Obersten, als Anführer“ wäre im Deutschen schwerfällig und möglicherweise redundant.
- source_word: בְּאֶחָיו
  choice: unter seinen Brüdern
  rationale: Die Präposition ב kann die Stellung innerhalb einer Gruppe oder den Vorrang gegenüber ihr ausdrücken. „unter seinen Brüdern“ bewahrt diese Offenheit; die mögliche hierarchische Lesart wird in der Fußnote genannt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Rehabeams Maßnahme ein. „denn“ verbindet die Sätze in würdigem, natürlichem Deutsch.
- source_word: לְהַמְלִיכוֹ
  choice: er wollte ihn zum König machen
  rationale: Der Infinitiv mit לְ drückt Zweck beziehungsweise Absicht aus. „wollte ihn zum König machen“ gibt die beabsichtigte Inthronisierung idiomatisch wieder.
theological_decisions:
- issue: Status Abijas vor seiner Inthronisierung
  choice: Die Formulierung unterscheidet seine vorherige Einsetzung als Obersten von der beabsichtigten Königserhebung.
  alternative: נָגִיד unmittelbar mit „Herrscher“ oder „Fürst“ wiederzugeben.
  rationale: Der Vers beschreibt zunächst eine Vorrangstellung und anschließend Rehabeams Absicht, Abija zum König zu machen. Die Übersetzung soll diese zeitliche und sachliche Spannung nicht einebnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Rehabeam“, „Abija“ und „Maacha“ folgen geläufigen deutschen Namensformen. Die knappe hebräische Verbindung von רֹאשׁ und נָגִיד wird ohne schwerfällige Verdoppelung wiedergegeben; die relationale Mehrdeutigkeit von בְּאֶחָיו bleibt durch die Fußnote sichtbar.
