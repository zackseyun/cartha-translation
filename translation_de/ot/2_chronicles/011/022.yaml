  terminology: „Oberhaupt“ gibt רֹאשׁ als führende Stellung wieder, „Anführer“ bewahrt zusätzlich נָגִיד als Bezeichnung einer leitenden bzw. designierten Herrscherrolle. Die geläufigen deutschen Namensformen Rehabeam, Abija und Maacha sind angemessen.
