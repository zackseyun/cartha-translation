  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: de
  text: Denn die Leviten verließen ihr Weideland[a] und ihren Besitz und gingen nach Juda und Jerusalem, weil Jerobeam und seine Söhne sie vom Priesterdienst für Jahwe ausgeschlossen hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr offenes Land“ oder „ihre Weideflächen“. Gemeint ist das unbebaute, oft als Weide genutzte Land, das zu ihren Städten gehörte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil Jerobeam und seine Söhne sie verworfen hatten, sodass sie Jahwe nicht mehr als Priester dienen konnten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: ihr Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, häufig als Weide genutzte Land bei einer Stadt, hier bei den Levitenstädten. „Weideland“ ist konkret und im Deutschen gut verständlich; eine Fußnote hält den weiteren Sinn offen.
- source_word: אֲחֻזָּתָם
  choice: ihren Besitz
  rationale: אֲחֻזָּה bezeichnet einen Besitz beziehungsweise Landbesitz. „Besitz“ gibt dies natürlich wieder, ohne den im Kontext nicht ausdrücklich bezeichneten Gedanken eines Erbteils einzutragen.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: und gingen nach Juda und Jerusalem
  rationale: הלך mit ל bezeichnet die Bewegung auf ein Ziel zu; „gingen nach“ entspricht der hebräischen Erzählperspektive.
- source_word: הִזְנִיחָם
  choice: sie … ausgeschlossen hatten
  rationale: Das Hifil von זנח kann verwerfen, abweisen oder ausschließen bedeuten. Zusammen mit מִכַּהֵן bezeichnet es hier wirksam die Entfernung vom Priesterdienst.
- source_word: מִכַּהֵן
  choice: vom Priesterdienst
  rationale: מִן mit dem Infinitiv von כהן drückt die Verhinderung beziehungsweise den Ausschluss vom priesterlichen Dienst aus. Die substantivische deutsche Wendung ist knapp und idiomatisch.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Bei „Priesterdienst“ gibt „für“ die Ausrichtung des Dienstes auf יהוה in natürlichem Deutsch wieder.
- source_word: כִּי ... כִּי
  choice: Denn … weil
  rationale: Das erste כִּי begründet die vorausgehende Aussage, das zweite nennt den Grund für den Weggang der Leviten. Die unterschiedliche Wiedergabe macht diese Satzbeziehungen klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Entfernung der Leviten aus dem Priesterdienst
  choice: vom Priesterdienst ausgeschlossen
  alternative: verworfen, sodass sie Jahwe nicht mehr als Priester dienen konnten
  rationale: Der Zusammenhang spricht für einen institutionellen Ausschluss; zugleich besitzt זנח die stärkere Nuance des Verwerfens. Die Hauptfassung gibt die kontextuelle Wirkung wieder, die Fußnote bewahrt die mögliche persönliche Wertung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale Struktur des hebräischen כִּי … כִּי bleibt durch „Denn … weil“ erkennbar. „Priesterdienst“ vermeidet eine schwerfällige Infinitivkonstruktion, ohne den kultischen Sinn abzuschwächen.
