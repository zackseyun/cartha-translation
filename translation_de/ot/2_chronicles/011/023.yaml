base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: de
  text: Und er handelte klug[a] und verteilte einige seiner Söhne über alle Gebiete Judas und Benjamins hinweg, in alle befestigten Städte[b]. Er gab ihnen reichlich Verpflegung und suchte für sie zahlreiche Frauen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er zeigte Einsicht“ oder „Er handelte umsichtig“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich, dass er einige seiner Söhne über die befestigten Städte verteilte beziehungsweise dort einsetzte, nicht dass jeder Sohn an jeden Ort geschickt wurde.
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint ist wahrscheinlich, dass er für seine Söhne Ehen arrangierte. Wörtlich: „und er suchte eine Menge Frauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: er handelte klug
  rationale: Das Hifil von בין bezeichnet hier im Zusammenhang königlicher Planung ein verständiges bzw. umsichtiges Handeln. Die Formulierung gibt den Sinn natürlich wieder, ohne das Verb auf bloßes intellektuelles Verstehen zu verengen.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: verteilte einige seiner Söhne
  rationale: פרץ beschreibt hier angesichts der folgenden Ortsangaben eine räumliche Verteilung. Die partitive Formulierung mit מן wird durch „einige seiner Söhne“ wiedergegeben; die Fußnote hält fest, dass nicht jeder Sohn an jeden Ort kam.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: über alle Gebiete Judas und Benjamins
  rationale: אֲרָצוֹת bezeichnet hier die territorialen Gebiete oder Regionen innerhalb Judas und Benjamins, nicht eigenständige Länder.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: auf alle befestigten Städte
  rationale: עָרֵי הַמְּצֻרוֹת sind befestigte bzw. als Festungen ausgebaute Städte. „Auf … Städte verteilen“ ist im Deutschen eine natürliche räumlich-administrative Formulierung.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Er gab ihnen reichlich Verpflegung
  rationale: מָזוֹן meint Nahrung oder Versorgung; לָרֹב bezeichnet deren Fülle. „Verpflegung“ passt zum administrativen Zusammenhang und bleibt konkret verständlich.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: und suchte ihnen zahlreiche Frauen
  rationale: שׁאל bedeutet fragen, erbitten oder suchen. Im Zusammenhang ist wahrscheinlich gemeint, dass Rehabeam für seine Söhne viele Eheverbindungen anbahnte; „ihnen“ wird aus dem vorhergehenden Bezug erschlossen und die wörtlichere Form in der Fußnote vermerkt.
