base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: de
  text: 'Und sie gebar ihm Söhne: Jeusch, Schemarja und Saham.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Und sie gebar
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung fort. „Gebar“ ist in einem genealogischen Zusammenhang knapp und würdevoll und bewahrt das weibliche Subjekt.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet in dieser Geburtsformel den Vater; im Deutschen ist „sie gebar ihm“ eine natürliche und genaue Wiedergabe.
- source_word: בָּנִים
  choice: Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich männliche Nachkommen, die anschließend namentlich genannt werden.
- source_word: יְעוּשׁ
  choice: Jeusch
  rationale: Der Personenname wird nach gängiger deutscher Bibelkonvention transliteriert.
- source_word: שְׁמַרְיָה
  choice: Schemarja
  rationale: Diese Form gibt den hebräischen Namen in einer im Deutschen geläufigen biblischen Transkription wieder.
- source_word: זָהַם
  choice: Saham
  rationale: Der Personenname wird entsprechend deutscher Transkriptionskonvention wiedergegeben.
theological_decisions: []
translation_notes:
