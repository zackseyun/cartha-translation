  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: de
  text: 'So spricht Jahwe: Zieht nicht hinauf und kämpft nicht gegen eure Brüder.[a] Kehrt um, jeder in sein Haus; denn diese Sache ist von mir ausgegangen.[b] Da hörten sie auf die Worte Jahwes, kehrten um und zogen nicht gegen Jerobeam.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ sind die anderen Israeliten gemeint, gegen die sie kämpfen wollten.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „denn diese Angelegenheit kommt von mir“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „zu Jerobeam zu ziehen“; im Zusammenhang geht es um einen Kriegszug gegen ihn.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feierliche prophetische Botenformel in natürlichem, würdigem Deutsch und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Zieht nicht hinauf und kämpft nicht
  rationale: „Hinaufziehen“ erhält das Bewegungsbild von עלה, das hier zugleich einen militärischen Aufbruch bezeichnet; der koordinierte deutsche Imperativ entspricht den beiden hebräischen Verboten.
- source_word: עִם אֲחֵיכֶם
  choice: gegen eure Brüder
  rationale: Im Kampfzusammenhang ist עִם idiomatisch mit „gegen“ wiederzugeben. „Brüder“ bewahrt die betonte Verwandtschaft der gegnerischen Israeliten.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Kehrt um, jeder in sein Haus
  rationale: Gibt שוב als Umkehrbefehl und אִישׁ distributiv wieder, ohne die maskuline Form des Ausgangstextes zu verallgemeinern.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: denn diese Sache ist von mir ausgegangen
  rationale: Bewahrt die ausdrückliche Herkunft beziehungsweise Verursachung „von mir“, ohne die Aussage zu einer umfassenderen Vorsehungslehre auszubauen.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Da hörten sie auf die Worte Jahwes
  rationale: „Auf jemanden hören“ verbindet im Deutschen das Hören mit dem Befolgen und spiegelt damit die Bedeutungsbreite von שׁמע sowie die anschließende Reaktion.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: und kehrten davon um, gegen Jerobeam zu ziehen
  rationale: Der militärische Zusammenhang rechtfertigt „gegen“; eine Fußnote hält die wörtlichere Richtungsangabe „zu Jerobeam“ offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen, und folgt der angegebenen Projektentscheidung.
- issue: Göttliche Verursachung in מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: diese Sache ist von mir ausgegangen
  alternative: diese Sache kommt von mir
  rationale: Die gewählte Fassung erhält den perfektiven Charakter von נִהְיָה und die theologische Spannung, dass die politische Entwicklung ausdrücklich auf Gott zurückgeführt wird, ohne deren Art näher zu definieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlich-biblischem Ton. Die Botenformel und das Bild des Hinaufziehens bleiben erhalten; schwer verständliche Hebraismen werden behutsam idiomatisiert. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Aussagen.
