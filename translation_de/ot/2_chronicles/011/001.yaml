base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: de
  text: 'Als Rehabeam nach Jerusalem kam, versammelte er das Haus Juda und Benjamin: 180.000 ausgewählte Krieger[a]. Sie sollten gegen Israel kämpfen, um das Königtum an Rehabeam zurückzugeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „180.000 ausgewählte, wehrfähige Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: als … gekommen war
  rationale: Das Qal-Wayyiqtol von בוא beschreibt Rehabeams Eintreffen in Jerusalem; im deutschen Erzählfluss gibt der vorzeitige Nebensatz die Abfolge natürlich wieder.
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Das Hifil von קהל bezeichnet hier das Zusammenrufen beziehungsweise Aufbieten einer militärischen Streitmacht.
- source_word: בֵּית יְהוּדָה וּבִנְיָמִן
  choice: das Haus Juda und Benjamin
  rationale: Die bewusst nahe Wiedergabe bewahrt die korporative Bezeichnung des südlichen Herrschaftsgebiets, ohne sie auf Haushalt oder Familie einzuengen.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: ausgewählte Krieger
  rationale: בָּחוּר bezeichnet im militärischen Zusammenhang ausgewählte beziehungsweise wehrfähige Männer; עֹשֵׂה מִלְחָמָה wird im Deutschen knapp und idiomatisch mit „Krieger“ wiedergegeben.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: gegen Israel kämpfen
  rationale: Obwohl עִם wörtlich „mit“ heißen kann, zeigt der feindliche Zusammenhang eindeutig den Kampf gegen Israel an.
- source_word: לְהָשִׁיב אֶת הַמַּמְלָכָה לִרְחַבְעָם
  choice: das Königreich für Rehabeam zurückzugewinnen
  rationale: Das Hifil von שוב drückt die beabsichtigte Wiederherstellung von Rehabeams Herrschaft aus. „Für Rehabeam zurückzugewinnen“ ist natürliches Deutsch und lässt das Königreich als Objekt stehen.
theological_decisions:
- issue: Bezug von „Israel“ nach der Reichsteilung
  choice: Israel
  alternative: das Nordreich; die nördlichen Stämme
  rationale: Der hebräische Text nennt die gegnerische politische Größe schlicht Israel. Diese Benennung bleibt ohne wertende oder erklärende Erweiterung erhalten.
- issue: Bedeutung von „Königreich“
  choice: Königreich
  alternative: Königsherrschaft
  rationale: מַמְלָכָה kann sowohl das Reich als auch die Herrschaft bezeichnen. „Königreich“ wahrt diese im Kontext bestehende Breite besser als eine einseitige Festlegung auf das Königsamt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korporative hebräische Wendung „das Haus Juda und Benjamin“ wurde bewusst bewahrt; die lange Satzkette wurde zur besseren Verständlichkeit in zwei Sätze gegliedert.
