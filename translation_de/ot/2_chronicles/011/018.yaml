base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: de
  text: Rehabeam nahm sich Machalat zur Frau. Sie war die Tochter Jerimots, eines Sohnes Davids, und Abihajils, der Tochter Eliabs, des Sohnes Isais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier stark verkürzt und syntaktisch auffällig; wörtlich etwa: „Machalat, Sohn Jerimots, Sohn Davids, Abihajil, Tochter Eliabs, Sohn Isais.“ Wahrscheinlich werden Machalats väterliche und mütterliche Abstammung genannt: Jerimot war ein Sohn Davids, Abihajil eine Tochter Eliabs. Seltener wird Abihajil als zweite Frau Rehabeams verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: nahm sich … zur Frau
  rationale: Gibt die hebräische Heiratsformel nah und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: מָחֲלַת
  choice: Machalat
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: בן יְרִימוֹת
  choice: Tochter Jerimots
  rationale: Im überlieferten Konsonantentext steht zwar wörtlich „Sohn Jerimots“, doch die feminine Person Machalat und der genealogische Zusammenhang verlangen hier sehr wahrscheinlich die Bedeutung „Tochter Jerimots“; die Formulierung wird in der Fußnote offengelegt.
- source_word: יְרִימוֹת בֶּן דָּוִיד
  choice: Jerimots, eines Sohnes Davids
  rationale: Bewahrt die genealogische Zuordnung und macht im Deutschen eindeutig, dass Jerimot ein Sohn Davids war.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב
  choice: Abihajils, einer Tochter Eliabs
  rationale: Fasst Abihajil als Machalats Mutter und als Tochter Eliabs auf; der Genitiv bindet sie natürlich an „Tochter … und …“ zurück.
- source_word: אֱלִיאָב בֶּן יִשָׁי
  choice: Eliabs, des Sohnes Isais
  rationale: Gibt die zweite genealogische Linie eindeutig und idiomatisch wieder.
theological_decisions:
- issue: Syntaktische Zuordnung der Namen in der komprimierten Genealogie
  choice: Machalat ist die eine hier genannte Frau Rehabeams, Tochter Jerimots und Abihajils.
  alternative: Abihajil kann als weiterer Name innerhalb der Familienangabe oder, weniger wahrscheinlich, als zweite Frau verstanden werden.
  rationale: Der Singular „eine Frau“ und die genealogische Struktur sprechen am stärksten dafür, dass die väterliche und die mütterliche Abstammung Machalats genannt werden. Da der hebräische Wortlaut ungewöhnlich knapp und mehrdeutig ist, wird die Unsicherheit nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Aufteilung in zwei Sätze entlastet die dichte Genealogie, ohne Informationen hinzuzufügen; die echte textliche und syntaktische Schwierigkeit bleibt in der Fußnote sichtbar.
