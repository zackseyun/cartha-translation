base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: de
  text: Er verstärkte die befestigten Orte und versah sie mit Befehlshabern sowie mit Vorräten an Lebensmitteln, Öl und Wein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: Er verstärkte
  rationale: Das Piel von חזק bezeichnet hier das Verstärken oder Sichern; »verstärkte« gibt die Handlung wieder, ohne die Befestigung im Objekt unnötig zu wiederholen.
- source_word: הַמְּצֻרוֹת
  choice: die befestigten Orte
  rationale: Der Ausdruck bezeichnet befestigte Plätze oder Festungen. »Befestigte Orte« bewahrt die etwas größere Bedeutungsbreite des hebräischen Plurals.
- source_word: וַיִּתֵּן בָּהֶם
  choice: und setzte dort ... ein
  rationale: נתן mit ב bezeichnet hier das Einsetzen beziehungsweise Platzieren in den befestigten Orten. Im Deutschen ist »setzte dort ... ein« für Amtsträger natürlich und lässt ihre genaue Funktion offen.
- source_word: נְגִידִים
  choice: Befehlshaber
  rationale: נָגִיד kann Leiter, Herrscher oder Amtsträger bezeichnen. Im Zusammenhang befestigter Orte ist »Befehlshaber« sachgerecht, ohne einen königlichen Rang zu unterstellen.
- source_word: וְאֹצְרוֹת
  choice: Außerdem legte er Vorräte an
  rationale: אֹצָרוֹת kann Vorratsräume oder eingelagerte Bestände bezeichnen. Die Formulierung gibt hier den naheliegenden Sinn reservierter Versorgungsgüter idiomatisch wieder, ohne zwischen Räumen und Beständen unnötig festzulegen.
- source_word: מַאֲכָל
  choice: Lebensmitteln
  rationale: מַאֲכָל bezeichnet Nahrung beziehungsweise Verpflegung; »Lebensmittel« passt natürlich zur Wendung »Vorräte an«.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Die übliche Wiedergabe; vermutlich ist Olivenöl gemeint, doch der hebräische Text spezifiziert dies nicht.
- source_word: יָיִן
  choice: Wein
  rationale: Direkte und kontextgerechte Wiedergabe von יָיִן.
theological_decisions: []
