source:
  edition: WLC
  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: de
  text: Nach ihr nahm er Maacha, die Tochter Absaloms,[a] zur Frau. Sie gebar ihm Abija, Attai, Sisa und Schelomit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Tochter Absaloms“; die Bezeichnung kann gelegentlich auch eine entferntere weibliche Nachfahrin meinen. Daher verstehen manche sie als „Enkelin Absaloms“.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Nach ihr
  rationale: Die Präposition mit dem Suffix der 3. Person Singular feminin verweist auf die zuvor genannte Frau. „Nach ihr“ gibt diesen Bezug knapp und unmittelbar wieder.
- source_word: לָקַח
  choice: nahm er … zur Frau
  rationale: Das Verb bedeutet wörtlich „nehmen“, bezeichnet in diesem Zusammenhang aber die Aufnahme einer Frau in die Ehe. Die deutsche Wendung bewahrt das Bild des Hebräischen und macht den ehelichen Sinn eindeutig.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: בַּת אַבְשָׁלוֹם
  choice: die Tochter Absaloms
  rationale: Die hebräische Genitivverbindung bezeichnet Maacha ausdrücklich als „Tochter Absaloms“. Ein möglicherweise weiterer genealogischer Sinn wird nicht in den Haupttext eingetragen, sondern in einer Fußnote offengehalten.
- source_word: וַתֵּלֶד לוֹ
  choice: Sie gebar ihm
  rationale: Dies ist eine natürliche und zugleich formnahe deutsche Wiedergabe des Verbs ילד mit indirektem Objekt.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: Abija, Attai, Sisa und Schelomit
  rationale: Die Personennamen werden in gebräuchlichen deutschen biblischen Namensformen wiedergegeben; die wiederholte Objektmarkierung אֶת wird im Deutschen nicht eigens abgebildet.
theological_decisions:
- issue: Genealogische Bezeichnung Maachas als „Tochter Absaloms“
  choice: Die wörtliche Bezeichnung „die Tochter Absaloms“ bleibt im Haupttext erhalten.
  alternative: „Enkelin Absaloms“ oder allgemeiner „Nachfahrin Absaloms“
  rationale: בַּת bedeutet hier ausdrücklich „Tochter“, kann in genealogischen Zusammenhängen jedoch mitunter eine entferntere weibliche Nachfahrin bezeichnen. Die Übersetzung bewahrt den Wortlaut und lässt die genealogische Reichweite in der Fußnote offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die eheliche Bedeutung von לָקַח wird idiomatisch durch „zur Frau nehmen“ ausgedrückt; die mögliche genealogische Mehrdeutigkeit von בַּת bleibt durch die Fußnote erhalten.
