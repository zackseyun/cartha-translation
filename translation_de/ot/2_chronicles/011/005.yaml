source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב רְחַבְעָ֖ם בִּ/ירוּשָׁלִָ֑ם וַ/יִּ֧בֶן עָרִ֛ים לְ/מָצ֖וֹר בִּ/יהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: de
  text: Rehabeam wohnte in Jerusalem und baute in Juda Städte zur Verteidigung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: befestigte Städte; auch: Städte als Festungen oder Städte zur Befestigung.'
    reason: Die hebräische Wendung לְמָצוֹר kann eine Verteidigungs- oder Befestigungsfunktion bezeichnen. Die Alternativen machen die mögliche konkretere Lesart sichtbar, ohne eine einzelne Deutung als wörtlich festzulegen.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise seinen dauerhaften Aufenthalt in Jerusalem. „Wohnte“ ist im modernen Deutsch natürlich und setzt keinen im Text nicht ausdrücklich genannten Wechsel voraus.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ wird lokativ wiedergegeben; der Ortsname folgt der üblichen deutschen Form.
- source_word: וַיִּבֶן
  choice: baute
  rationale: בנה bedeutet „bauen“. Die militärische Bestimmung wird durch die folgende Wendung ausgedrückt und sollte nicht bereits in das Verb hineingelesen werden.
- source_word: עָרִים
  choice: Städte
  rationale: עִיר wird in diesem verwaltungs- und militärgeschichtlichen Zusammenhang angemessen mit „Stadt“ wiedergegeben.
- source_word: לְמָצוֹר
  choice: zur Verteidigung
  rationale: Die Wendung bezeichnet hier den Verteidigungs- beziehungsweise Befestigungszweck der Städte. „Zur Verteidigung“ ist verständlich und bewahrt die Zweckkonstruktion des Hebräischen; konkretere Wiedergaben werden in der Fußnote genannt.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präpositionalphrase bezeichnet das Gebiet, in dem Rehabeam die Städte baute; „Juda“ ist die übliche deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählstil; „zur Verteidigung“ gibt die militärische Zweckangabe klar wieder, ohne das Verb „baute“ interpretierend durch „befestigte“ zu ersetzen.
