  text: וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֖ר בְּ/כָל יִשְׂרָאֵ֑ל הִֽתְיַצְּב֥וּ עָלָ֖י/ו מִ/כָּל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: de
  text: Und die Priester und die Leviten, die in ganz Israel waren, stellten sich ihm aus allen ihren Gebieten zur Seite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „traten vor ihn“ oder „stellten sich bei ihm ein“. Die hebräische Wendung kann sowohl das Erscheinen vor Rehabeam als auch die Parteinahme für ihn bezeichnen; der Zusammenhang spricht eher für loyale Unterstützung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: Und die Priester
  rationale: Die Konjunktion und die bestimmte Pluralform werden beibehalten; „Und“ wahrt den erzählerischen Anschluss.
- source_word: וְהַלְוִיִּם
  choice: und die Leviten
  rationale: Natürliche und sachlich genaue Wiedergabe der koordinierten bestimmten Pluralform.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: die in ganz Israel waren
  rationale: Die Relativkonstruktion bezeichnet die Priester und Leviten, die über das gesamte Gebiet Israels verteilt lebten.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: stellten sich zu ihm
  rationale: Die Form von יצב bezeichnet ein bewusstes Sich-Hinstellen beziehungsweise Sich-Einfinden; zusammen mit עָלָיו kann die Wendung hier auch die Parteinahme für Rehabeam ausdrücken. „Stellten sich zu ihm“ bewahrt beide Aspekte möglichst natürlich.
- source_word: מִכָּל גְּבוּלָם
  choice: aus allen ihren Gebieten
  rationale: גְּבוּל bezeichnet hier eher die jeweiligen Gebiete oder Landesteile als bloße Grenzlinien. Die Formulierung bewahrt zudem das distributive „allen“.
theological_decisions:
- issue: Bedeutung der Wendung הִתְיַצְּבוּ עָלָיו
  choice: stellten sich zu ihm
  alternative: traten vor ihn / stellten sich auf seine Seite
  rationale: Der unmittelbare Zusammenhang legt loyale Unterstützung für Rehabeam nahe, doch die hebräische Wendung kann zugleich das konkrete Erscheinen oder Sich-Hinstellen bei ihm bezeichnen. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebiete“ ist im Deutschen idiomatischer als das hier missverständliche „Grenzen“; die Satzstruktur bleibt eng am Hebräischen.
