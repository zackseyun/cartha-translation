base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: de
  text: Er versah jede Stadt mit Schilden und Speeren und verstärkte sie außerordentlich. Juda und Benjamin gehörten zu ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר
  choice: in jede Stadt
  rationale: Die Wiederholung עִיר וָעִיר hat distributive Funktion und meint jede einzelne Stadt. Natürliches modernes Deutsch gibt dies mit „in jede Stadt“ wieder.
- source_word: צִנּוֹת
  choice: Schilde
  rationale: Der Begriff bezeichnet militärische Schilde, möglicherweise größere Langschilde. „Schilde“ ist präzise, verständlich und vermeidet eine nicht zwingende Spezifizierung.
- source_word: וּרְמָחִים
  choice: und Speere
  rationale: רְמָחִים bezeichnet gewöhnlich Speere; dies ist die natürliche moderne Entsprechung.
- source_word: וַיְחַזְּקֵם לְהַרְבֵּה מְאֹד
  choice: So machte er die Städte überaus stark
  rationale: Das Suffix „sie“ bezieht sich im Kontext am ehesten auf die Städte. „Überaus“ bewahrt die starke Intensivierung durch לְהַרְבֵּה מְאֹד, während „machte ... stark“ das Verb חזק transparent wiedergibt.
- source_word: וַיְהִי לוֹ יְהוּדָה וּבִנְיָמִן
  choice: Juda und Benjamin standen auf seiner Seite
  rationale: Die Zugehörigkeitskonstruktion ויהי לו drückt hier politische Herrschaft beziehungsweise Gefolgschaft aus. „Standen auf seiner Seite“ ist im Deutschen natürlich und vermeidet den missverständlichen Eindruck persönlichen Eigentums.
theological_decisions:
- issue: Art der Zugehörigkeit Judas und Benjamins zu Rehabeam
  choice: standen auf seiner Seite
  alternative: gehörten ihm
  rationale: Der Kontext betrifft politische Loyalität und Herrschaft, nicht persönliches Eigentum. Die gewählte Formulierung wahrt diesen Sinn, ohne eine weitergehende staatsrechtliche oder theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parataktische Struktur des Hebräischen bleibt erkennbar, wird jedoch durch „So“ natürlich verbunden. Die distributive Wiederholung „Stadt und Stadt“ wird idiomatisch wiedergegeben.
