id: 2CH.11.17
reference: 2 Chronicles 11:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: de
  text: So festigten sie das Königreich Juda und stärkten Rehabeam, den Sohn Salomos, drei Jahre lang; denn drei Jahre lang gingen sie auf dem Weg Davids und Salomos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: festigten sie
  rationale: Das Piel von חזק bezeichnet hier ein Festmachen oder Stärken. „Festigten“ passt natürlich zum politischen Bestand des Königreichs und vermeidet eine militärische Überdeutung.
- source_word: מַלְכוּת יְהוּדָה
  choice: das Königreich Juda
  rationale: מַלְכוּת kann Königsherrschaft oder Königreich bedeuten; im Zusammenhang steht das politische Gemeinwesen Juda im Vordergrund.
- source_word: וַיְאַמְּצוּ
  choice: stärkten
  rationale: Das Piel von אמץ bedeutet stark machen oder stärken. Da Rehabeam das direkte Objekt ist, gibt „stärkten“ den Sinn knapp und natürlich wieder.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Rehabeam, den Sohn Salomos
  rationale: Die geläufigen deutschen Namensformen werden verwendet; die Apposition macht die Abstammungsangabe im Deutschen klar.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: drei Jahre lang
  rationale: Die Dauerangabe wird idiomatisch wiedergegeben und an beiden Stellen beibehalten, weil ihre Wiederholung im Hebräischen den zeitlich begrenzten Zusammenhang betont.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die zuvor genannte Festigung und Stärkung ein.
- source_word: הָלְכוּ
  choice: gingen
  rationale: Die wörtliche Wiedergabe bewahrt zusammen mit „Weg“ die hebräische Metapher für Lebensführung.
- source_word: בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  choice: auf dem Weg Davids und Salomos
  rationale: Der Singular „Weg“ wird bewahrt und bezeichnet das von beiden Königen verkörperte Verhaltensmuster, ohne es ausdeutend zu paraphrasieren.
theological_decisions:
- issue: Bewertung des „Weges Davids und Salomos“
  choice: Das Bild vom Weg wird ohne erläuternde Erweiterung beibehalten und ausdrücklich auf drei Jahre begrenzt.
  alternative: „Sie lebten dem HERRN treu, wie David und Salomo es getan hatten.“
  rationale: Der Vers bewertet ihr Verhalten während dieses begrenzten Zeitraums positiv, rechtfertigt aber weder eine Aussage über lebenslange Treue noch eine umfassendere theologische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Festigten“ und „stärkten“ bilden das verwandte, aber nicht identische hebräische Verbpaar ab. Die zweimalige Angabe „drei Jahre lang“ bleibt als bewusste Wiederholung erhalten.
