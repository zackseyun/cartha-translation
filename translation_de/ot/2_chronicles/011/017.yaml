  terminology: Die etablierten deutschen Namensformen Rehabeam und Salomo sind korrekt. „Königreich Juda“ und „Weg Davids und Salomos“ sind konventionell, sachgerecht und ohne unnötige theologische Ausdeutung formuliert.
