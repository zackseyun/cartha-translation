  source_fidelity: 'Die Übersetzung gibt beide hebräischen Piel-Verben angemessen differenziert wieder: וַיְחַזְּקוּ als „festigten“ für das Königreich und וַיְאַמְּצוּ als „stärkten“ für Rehabeam. „Königreich Juda“, die Abstammungsangabe, die zweimalige Dauerangabe und die kausale Verbindung durch „denn“ entsprechen dem hebräischen Text. Das Bild „auf dem Weg Davids und Salomos“ bewahrt den Singular und die Metapher von הלך בדרך.'
