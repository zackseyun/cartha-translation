  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמַֽעְיָ֥הוּ אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Schemaja, den Mann Gottes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die narrative Folgeform von היה führt das nächste Ereignis ein. Die im Deutschen geläufige prophetische Formel „Da erging das Wort …“ gibt den Erzählungsfortgang natürlich wieder, ohne ein zusätzliches adversatives Verhältnis einzutragen.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Wendung und die hebräische Genitivbeziehung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: an
  rationale: In der deutschen Fügung „das Wort erging an jemanden“ ist „an“ die natürliche Entsprechung für die Bezeichnung des Empfängers.
- source_word: שְׁמַעְיָהוּ
  choice: Schemaja
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: אִישׁ הָאֱלֹהִים
  choice: den Mann Gottes
  rationale: Der bestimmte Ausdruck bezeichnet Schemaja mit dem bekannten prophetischen Titel „Mann Gottes“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das hebräische לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formale „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „Da erging das Wort Jahwes an …“ klingt bibelsprachlich, bleibt aber allgemein verständlich. Der Doppelpunkt bereitet die in Vers 3 folgende direkte Rede idiomatisch vor.
