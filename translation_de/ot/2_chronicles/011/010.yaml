  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: de
  text: und Zora, Ajalon und Hebron, die in Juda und Benjamin liegen – befestigte Städte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: Zora
  rationale: Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אַיָּלוֹן
  choice: Ajalon
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibelkonvention transliteriert.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Die etablierte deutsche Namensform wird beibehalten.
- source_word: אֲשֶׁר
  choice: die … liegen
  rationale: Das Relativpronomen leitet eine geografische Ortsangabe ein; „liegen“ ergänzt das im Hebräischen nicht ausdrücklich gesetzte Verb natürlich.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: in Juda und Benjamin
  rationale: Die Formulierung bezeichnet die geografische beziehungsweise stammesgebietsbezogene Lage, ohne ein Besitzverhältnis hineinzulesen.
- source_word: עָרֵי מְצֻרוֹת
  choice: befestigte Städte
  rationale: Die Konstruktverbindung bezeichnet Städte, die durch Befestigungen gesichert sind; dies ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: und …, … und …
  rationale: Die Objektmarker bleiben unübersetzt; die Konjunktionen führen die Ortsliste aus dem vorherigen Vers fort und werden in natürlicher deutscher Aufzählungsform wiedergegeben.
