  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: de
  text: Und nach ihnen kamen aus allen Stämmen Israels diejenigen, die ihr Herz darauf richteten[a], Jahwe, den Gott Israels, zu suchen, nach Jerusalem[b], um Jahwe, dem Gott ihrer Väter, Opfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die ihr Herz gaben«; die hebräische Wendung meint, dass sie ihr Herz bewusst darauf ausrichteten oder sich innerlich dazu entschlossen, Jahwe zu suchen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gingen nach Jerusalem«. Das hebräische Verb kann je nach Erzählstandpunkt sowohl »kommen« als auch »gehen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: Und nach ihnen
  rationale: Bewahrt sowohl die Satzverknüpfung durch וְ als auch die zeitliche beziehungsweise nachfolgende Bedeutung von אַחֲרֵי.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: מִן bezeichnet hier die Herkunft; die Formulierung gibt zugleich den umfassenden Bezug auf alle Stämme wieder.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: die ihr Herz darauf richteten
  rationale: Die wörtliche Wendung »ihr Herz geben« bezeichnet eine bewusste innere Ausrichtung oder Hingabe. Die gewählte Formulierung ist im Deutschen natürlich und wahrt das Bild des Herzens.
- source_word: לְבַקֵּשׁ
  choice: zu suchen
  rationale: בקש bezeichnet in diesem religiösen Zusammenhang die bewusste Hinwendung zu Gott und das Verlangen nach ihm.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: kamen … nach Jerusalem
  rationale: בוא kann je nach Erzählstandpunkt »kommen« oder »gehen« bedeuten. »Kamen« entspricht dem auf Juda und Jerusalem gerichteten Blickpunkt des Zusammenhangs; eine Fußnote hält die Alternative offen.
- source_word: לִזְבּוֹחַ
  choice: um … Opfer darzubringen
  rationale: Der Infinitiv mit לְ drückt den Zweck aus. »Opfer darbringen« ist im Deutschen klarer und würdiger als das mögliche, aber hier missverständliche »opfern«.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: dem Gott ihrer Väter
  rationale: Bewahrt die ausdrücklich männliche Pluralform und den traditionellen Klang der bundesgeschichtlichen Wendung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration »Jahwe« bewahrt den Unterschied zwischen dem persönlichen Namen und einem bloßen Titel.
- issue: Bundesgeschichtliche Wendung אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: der Gott ihrer Väter
  alternative: der Gott ihrer Vorfahren
  rationale: »Väter« entspricht der grammatischen Form und bewahrt die traditionelle, bundesgeschichtliche Ausdrucksweise, ohne sie zu verallgemeinern.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit verständlicher Satzführung. Das Herzbild, der persönliche Gottesname und die bundesgeschichtliche Formel »Gott ihrer Väter« bleiben erhalten; echte lexikalische Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
