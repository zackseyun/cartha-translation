lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das Qal wayyiqtol von בנה bedeutet gewöhnlich „bauen“. Im Zusammenhang kann damit auch der Ausbau dieser Orte zu befestigten Städten gemeint sein; „befestigte“ würde diese kontextuelle Aussage jedoch stärker in den Vers hineintragen, als das Verb selbst verlangt.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine eigenständige Entsprechung.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Für den Ortsnamen wird die im Deutschen fest etablierte Form verwendet.
- source_word: עֵיטָם
  choice: Etam
  rationale: Der Ortsname wird in einer geläufigen deutschen Umschrift wiedergegeben.
- source_word: תְּקוֹעַ
  choice: Tekoa
  rationale: Der Ortsname wird in der im Deutschen gebräuchlichen Form „Tekoa“ wiedergegeben.
- source_word: וְ...וְ...וְ
  choice: Und ... , ... und ...
  rationale: Die einleitende Satzverknüpfung bleibt erhalten; innerhalb der Aufzählung entspricht eine Kommareihe mit abschließendem „und“ natürlichem modernem Deutsch.
