  register: 'Schlichtes, würdiges modernes Standarddeutsch. Die knappe hebräische Erzählweise bleibt erhalten. Keine Fußnote ist nötig: Die englische Fußnote zu „Tekoah“ betrifft nur eine englische Transliteration und stellt keine sachliche oder textliche Variante dar.'
