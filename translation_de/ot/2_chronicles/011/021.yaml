  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: de
  text: Rehabeam liebte Maacha, die Tochter Absaloms,[a] mehr als alle seine Frauen und Nebenfrauen. Denn er hatte achtzehn Frauen und sechzig Nebenfrauen genommen und achtundzwanzig Söhne und sechzig Töchter gezeugt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „eine Nachfahrin Absaloms“. Das hebräische Wort für „Tochter“ kann in genealogischen Zusammenhängen mitunter weiter gefasst gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: liebte
  rationale: אהב bezeichnet hier Liebe beziehungsweise Zuneigung; der Vergleich wird durch מִכָּל ausgedrückt.
- source_word: בַת אַבְשָׁלוֹם
  choice: die Tochter Absaloms
  rationale: בַּת bedeutet gewöhnlich „Tochter“. Ein weiterer genealogischer Sinn bleibt aufgrund des möglichen Sprachgebrauchs in einer Fußnote offen.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: mehr als alle seine anderen Frauen und Nebenfrauen
  rationale: מִכָּל kennzeichnet den Vergleich. „anderen“ verdeutlicht im Deutschen natürlich, dass Maacha selbst zu seinen Frauen gehörte; „Nebenfrauen“ bewahrt die soziale Unterscheidung von פִּילַגְשִׁים.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier eine erläuternde Hintergrundangabe ein.
- source_word: נָשִׁים ... נָשָׂא
  choice: hatte achtzehn Frauen ... genommen
  rationale: נשא mit נָשִׁים ist eine Wendung für das Nehmen beziehungsweise Heiraten von Frauen. Das Plusquamperfekt gibt den erklärenden Rückblick angemessen wieder.
- source_word: פִּילַגְשִׁים
  choice: Nebenfrauen
  rationale: „Nebenfrauen“ ist im modernen Deutschen verständlich und erhält die vom Hebräischen bezeichnete, von Ehefrauen unterschiedene soziale Stellung.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Verbform bezeichnet beim männlichen Subjekt das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist präzise und im genealogischen Kontext angemessen.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: achtundzwanzig Söhne
  rationale: Direkte und natürliche Wiedergabe der Zahl und des Substantivs.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: sechzig Töchter
  rationale: Direkte und natürliche Wiedergabe der Zahl und des Substantivs.
theological_decisions:
- issue: Genealogische Bezeichnung Maachas als „Tochter Absaloms“
  choice: Die wörtliche Bezeichnung „Tochter Absaloms“ bleibt im Haupttext stehen.
  alternative: „Nachfahrin Absaloms“ beziehungsweise, je nach genealogischer Einordnung, „Enkelin Absaloms“.
  rationale: Der hebräische Wortlaut bezeichnet Maacha als „Tochter“. Da בַּת in genealogischen Zusammenhängen mitunter weiter gefasst sein kann, wird die mögliche größere Verwandtschaftsdistanz nicht im Haupttext festgelegt, sondern in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet einen überlangen deutschen Satz. „Nebenfrauen“ ist verständlicher und natürlicher als das fachsprachlichere „Konkubinen“, ohne die soziale Unterscheidung des hebräischen Textes einzuebnen.
