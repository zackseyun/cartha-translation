  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: de
  text: '„Sprich zu Rehabeam, dem Sohn Salomos, dem König von Juda, und zu ganz Israel in Juda und Benjamin:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Sprich
  rationale: Der Imperativ von אמר fordert zur Übermittlung einer Botschaft auf. „Sprich zu“ gibt die direkte Befehlsform natürlich und genau wieder.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet die Adressaten der Rede; im Deutschen ist „zu jemandem sprechen“ idiomatisch.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Gebräuchliche deutsche Namensform.
- source_word: בֶּן שְׁלֹמֹה
  choice: dem Sohn Salomos
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Rehabeams Abstammung; die deutsche Apposition erfordert hier den Dativ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: dem König von Juda
  rationale: Der Königstitel steht als weitere Apposition zu Rehabeam. „König von Juda“ ist modernes, klares Deutsch.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: und zu ganz Israel
  rationale: „Israel“ bleibt als nationale und bundestheologische Bezeichnung erhalten, statt in „alle Israeliten“ umgeformt zu werden.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: in Juda und Benjamin
  rationale: 'Die Präposition ב bezeichnet hier den Ort: Gemeint ist Israel, soweit es sich in Juda und Benjamin befindet.'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet den im nächsten Vers folgenden Wortlaut ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als die formelhafte Wiedergabe „und sprich“ oder „indem du sagst“.
theological_decisions:
- issue: Bezeichnung der angesprochenen Bevölkerung als „ganz Israel“
  choice: Die nationale Bezeichnung „ganz Israel“ wird beibehalten.
  alternative: „alle Israeliten“ oder „alle Israeliten aus Juda und Benjamin“
  rationale: Der hebräische Text bezeichnet die Adressaten ausdrücklich als כָּל יִשְׂרָאֵל. Die Übersetzung soll die mögliche geschichtliche und theologische Spannung dieser Bezeichnung nicht durch eine erklärende Umformung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Apposition bildet die hebräische Zuordnung klar ab. Der abschließende Doppelpunkt verbindet den Vers unmittelbar mit der folgenden Botschaft.
