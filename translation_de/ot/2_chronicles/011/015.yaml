id: 2CH.11.15
reference: 2 Chronicles 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: de
  text: 'Er setzte für sich Priester ein: für die Kulthöhen, für die Bocksdämonen[a] und für die Kälber, die er gemacht hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Böcke“ beziehungsweise „bocksgestaltige Wesen“. Das hebräische Wort kann im Zusammenhang mit unerlaubter Verehrung bocksähnliche Wesen oder entsprechende Kultbilder bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: setzte … ein
  rationale: Im Zusammenhang mit Priestern bezeichnet das Verb ihre Einsetzung in ein Amt, nicht nur ein Aufstellen.
- source_word: לּוֹ
  choice: für sich
  rationale: Der Dativ bringt zum Ausdruck, dass Jerobeam die Priester für sein eigenes Kultsystem einsetzte.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung für das kultische Amt.
- source_word: לַבָּמוֹת
  choice: für die Kulthöhen
  rationale: בָּמוֹת bezeichnet örtliche Kultstätten, oft auf Anhöhen; „Kulthöhen“ ist im Deutschen prägnant und macht die religiöse Funktion deutlich.
- source_word: לַשְּׂעִירִים
  choice: für die Bocksdämonen
  rationale: In diesem kultischen Zusammenhang meint שְׂעִירִים wahrscheinlich bocksgestaltige übernatürliche Wesen oder entsprechende Götzenbilder, nicht gewöhnliche Böcke. Die Fußnote bewahrt die lexikalische Spannweite.
- source_word: וְלָעֲגָלִים
  choice: und für die Kälber
  rationale: Das einfache Substantiv wird beibehalten; dass es sich um Kultbilder handelt, ergibt sich aus dem Zusammenhang.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er gemacht hatte
  rationale: Das Plusquamperfekt verdeutlicht natürlich, dass die Herstellung der Kälber der Einsetzung der Priester vorausging.
theological_decisions:
- issue: Bedeutung von שְׂעִירִים im unerlaubten Kult
  choice: Bocksdämonen
  alternative: Böcke; bocksgestaltige Wesen
  rationale: Die Aufzählung von Kultstätten und Kultobjekten legt einen dämonischen oder götzendienerischen Bezug nahe. „Bocksdämonen“ gibt den wahrscheinlichen Sinn wieder, während die Fußnote die echte Mehrdeutigkeit des hebräischen Ausdrucks offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen der hebräischen Aufzählung; der Doppelpunkt macht die Zuordnung der Priester zu den drei Kultbereichen im Deutschen klar. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck.
