  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Bet-Zur … Socho … Adullam«. Die Schreibweise dieser Ortsnamen ist in deutschen Übersetzungen unterschiedlich; für »Socho« findet sich auch »Soko« oder »Sokho«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: und
  rationale: וְ verbindet die Ortsnamen mit der in Vers 6 begonnenen Aufzählung; den Akkusativmarker אֶת gibt das Deutsche nicht eigens wieder.
- source_word: בֵּית צ֥וּר
  choice: Bet-Zur
  rationale: Der Ortsname wird nach gängiger deutscher Bibelschreibweise transkribiert und nicht seiner wörtlichen Bedeutung nach übersetzt.
- source_word: שׂוֹכ֖וֹ
  choice: Socho
  rationale: Der Ortsname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben; abweichende Transkriptionen sind möglich.
- source_word: עֲדֻלָּֽם
  choice: Adullam
  rationale: Für den judäischen Ort wird die im Deutschen etablierte Namensform verwendet.
