source:
  edition: WLC
  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: de
  text: 'Als Jahwe sah, dass sie sich gedemütigt hatten, erging das Wort Jahwes an Schemaja: „Sie haben sich gedemütigt. Ich werde sie nicht vernichten, sondern ihnen ein wenig Rettung gewähren[a], und mein Zorn wird nicht durch Schischak über Jerusalem ausgegossen werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen ein Entkommen ermöglichen“ oder „einige Überlebende bewahren“. Die hebräische Wendung ist knapp und kann eine begrenzte Rettung statt völliger Vernichtung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת יְהוָה
  choice: Als Jahwe sah
  rationale: Die Präposition ב mit dem Infinitiv constructus von ראה bildet einen temporalen Nebensatz. „Als … sah“ gibt die zeitliche Abfolge natürlich wieder; יְהוָה wird als persönlicher Gottesname „Jahwe“ wiedergegeben.
- source_word: נִכְנָעוּ
  choice: sie sich gedemütigt hatten / sie haben sich gedemütigt
  rationale: Der Niphal von כנע bezeichnet hier die demütige Unterordnung als Reaktion auf die prophetische Zurechtweisung. Die reflexive Wiedergabe passt zum Kontext; im einleitenden Rückblick steht das Plusquamperfekt, in der direkten Rede das Perfekt.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: erging das Wort Jahwes an
  rationale: Die geläufige prophetische Formel bleibt in einer im Deutschen würdigen und verständlichen Form erhalten, ohne sie auf ein allgemeines „Jahwe sprach“ zu verkürzen.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Ich werde sie nicht vernichten
  rationale: Der Hiphil von שׁחת bedeutet in diesem Gerichtskontext „vernichten“ oder „zugrunde richten“. „Vernichten“ ist klar und sachgerecht.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: sondern ihnen ein wenig Rettung gewähren
  rationale: Die knappe hebräische Wendung kann eine begrenzte Rettung, ein Entkommen oder einige Entronnene bezeichnen. „Ein wenig Rettung“ wahrt die ungewöhnliche Begrenzung, während „sondern“ den sachlichen Gegensatz zur angekündigten Nichtvernichtung ausdrückt.
- source_word: תִתַּךְ חֲמָתִי
  choice: mein Zorn wird sich nicht … ergießen
  rationale: נתך wird beim Zorn idiomatisch für „ausgießen“ gebraucht. Die reflexive deutsche Form bewahrt das Bild und klingt natürlicher als ein schwerfälliges Passiv.
- source_word: בְּיַד שִׁישָׁק
  choice: durch die Hand Schischaks
  rationale: Die hebräische Wendung bezeichnet das handelnde Werkzeug. Die formnahe Wiedergabe bleibt im Deutschen verständlich und bewahrt das Bild der vermittelten Gerichtsausführung.
- source_word: שְׁמַעְיָה / שִׁישָׁק
  choice: Schemaja / Schischak
  rationale: Die Personennamen werden nach geläufiger deutscher Transliterationskonvention wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der zugesagten Rettung
  choice: ein wenig Rettung
  alternative: ein Entkommen; einige Entronnene
  rationale: Die mehrdeutige Wendung כִּמְעַט לִפְלֵיטָה wird nicht auf vollständige Rettung oder ausschließlich auf überlebende Personen festgelegt. Die begrenzte Milderung des Gerichts bleibt erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater Nähe zur prophetischen Ausdrucksweise. Die Formel „das Wort Jahwes erging an“ und das Bild vom sich ergießenden Zorn bleiben erhalten; ungewöhnliche oder mehrdeutige Einzelheiten werden nicht geglättet.
