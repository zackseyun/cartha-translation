id: 2CH.12.14
reference: 2 Chronicles 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: de
  text: Und er tat, was böse war, denn er hatte sein Herz nicht darauf ausgerichtet, Jahwe zu suchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er tat
  rationale: Das Qal-Wayyiqtol führt die Erzählung fort; „Und er tat“ gibt sowohl die Handlung als auch die narrative Verknüpfung direkt wieder.
- source_word: הָרָע
  choice: was böse war
  rationale: Die substantivierte Form mit Artikel bezeichnet im Zusammenhang das moralisch Böse; „was böse war“ ist natürliches modernes Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet das vorausgehende Urteil. „Denn“ bewahrt den erklärenden, leicht feierlichen Ton; auch „weil“ wäre sachlich möglich.
- source_word: לֹא הֵכִין
  choice: hatte … nicht darauf ausgerichtet
  rationale: Das Hifil von כון bedeutet hier, etwas innerlich festzumachen, vorzubereiten oder auszurichten. In Verbindung mit „Herz“ und dem folgenden Infinitiv drückt die Wendung eine fehlende bewusste Entschlossenheit aus.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: „Herz“ bewahrt die hebräische Vorstellung vom inneren Menschen einschließlich Willen, Denken und Absicht.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דרשׁ mit Gott als Objekt bezeichnet im chronistischen Sprachgebrauch das bewusste Suchen nach Gott, einschließlich Hinwendung und Befragung.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Der direkte Objektmarker bleibt unübersetzt; der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der Eigenname erkennbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des nicht ausgerichteten Herzens
  choice: fehlende bewusste innere Ausrichtung
  alternative: bloß fehlende Vorbereitung
  rationale: הֵכִין לִבּוֹ kann sowohl Vorbereitung als auch Festigung beziehungsweise Ausrichtung ausdrücken. Die Übersetzung wahrt den Willens- und Absichtsaspekt, ohne eine weitergehende Lehraussage über Rehabeams inneren Zustand einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper chronistischer Erzählweise. Die Formulierung „sein Herz darauf ausrichten“ ist verständlich und bildet die hebräische Rede vom inneren Willen natürlicher ab als eine rein wörtliche Wiedergabe mit „vorbereiten“.
