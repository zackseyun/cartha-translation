  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: de
  text: So ließ König Rehabeam an ihrer Stelle bronzene Schilde anfertigen und vertraute sie den Befehlshabern der Leibwache[a] an, die den Eingang des Königshauses bewachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Läufer“. Gemeint ist hier offenbar eine königliche Truppe, die als Leib- oder Palastwache diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ließ … anfertigen
  rationale: Das hebräische עשה bedeutet hier „machen/herstellen“. Die deutsche Konstruktion mit „ließ“ passt natürlich zu einem König als Auftraggeber, ohne auszuschließen, dass unter seiner Verantwortung gehandelt wurde.
- source_word: תַּחְתֵּיהֶם
  choice: an ihrer Stelle
  rationale: תחת mit Suffix bezeichnet hier Ersatz beziehungsweise Stellvertretung und verweist auf die im vorigen Vers geraubten goldenen Schilde.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: bronzene Schilde
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; bei Waffen und Rüstung ist „Bronze“ kontextuell die wahrscheinlichere und im Deutschen übliche Wiedergabe.
- source_word: וְהִפְקִיד עַל יַד
  choice: vertraute … an
  rationale: Das Hifil von פקד zusammen mit על יד bezeichnet die Übergabe in die Obhut oder Verantwortung einer Person. „Anvertrauen“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: שָׂרֵי הָרָצִים
  choice: den Befehlshabern der Leibwache
  rationale: שָׂרֵי bezeichnet leitende Amtsträger beziehungsweise Befehlshaber. הָרָצִים heißt wörtlich „die Läufer“, bezeichnet im königlichen Umfeld jedoch offenbar eine als Palastwache eingesetzte Truppe.
- source_word: הַשֹּׁמְרִים
  choice: die … bewachte
  rationale: Das Partizip beschreibt die fortdauernde Wachaufgabe. Der Relativsatz bezieht sich grammatisch am natürlichsten auf die kollektiv verstandene Leibwache.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: den Eingang des Königshauses
  rationale: Die Wiedergabe bleibt nahe bei „Eingang des Hauses des Königs“ und bezeichnet verständlich den Zugang zur königlichen Residenz.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater formaler Nähe zum Hebräischen. „Königshaus“ hält die Bildlichkeit von בֵּית הַמֶּלֶךְ fest; „Leibwache“ vermittelt die kontextuelle Funktion von הָרָצִים, während die wörtliche Bedeutung in der Fußnote erhalten bleibt.
