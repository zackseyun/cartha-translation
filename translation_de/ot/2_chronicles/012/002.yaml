  - severity: low
    issue: Fußnotenalternative präzisieren
    rationale: „Sich am HERRN vergangen“ kann im Deutschen breiter oder missverständlich wirken und bildet den besonderen Sinn von מעל als Treuebruch weniger klar ab.
