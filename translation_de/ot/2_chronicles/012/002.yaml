  source_fidelity: Der Entwurf gibt die Regierungsdatierung, den feindlichen Zug Schischaks gegen Jerusalem und die mit כִּי eingeleitete Begründung zutreffend wieder. „treulos gehandelt“ trifft מעל im Sinn eines Treue- bzw. Bundesbruchs angemessen; „dem HERRN gegenüber“ gibt die durch ב markierte Bezugsrichtung natürlich wieder. „zog ... gegen Jerusalem herauf“ wahrt, ohne einen bereits vollzogenen Angriff zu behaupten, die militärische Bewegung von עלה על.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Die Regierungsdatierung „Im fünften Jahr König Rehabeams“ ist jedoch im heutigen Standarddeutsch nicht die übliche Genitivkonstruktion und wirkt syntaktisch verkürzt. „Im fünften Jahr des Königs Rehabeam“ ist idiomatisch und ebenso quellennah.
  terminology: „Schischak“, „Ägypten“ und die deutsche Bibelkonvention „HERR“ sind passend. Die Fußnotenalternative „sich am HERRN vergangen“ ist zwar als mögliche Umschreibung denkbar, ist aber weniger präzise für מעל und im modernen Deutsch semantisch unnötig unscharf. Eine Alternative mit „treulos/untreu“ bewahrt den Kern besser.
