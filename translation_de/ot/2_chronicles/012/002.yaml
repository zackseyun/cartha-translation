  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: de
  text: Im fünften Jahr des Königs Rehabeam zog Schischak, der König von Ägypten, gegen Jerusalem herauf, weil sie dem HERRN gegenüber treulos gehandelt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „weil sie dem HERRN untreu geworden waren“ oder „weil sie dem HERRN gegenüber einen Treuebruch begangen hatten“. Das hebräische Verb bezeichnet einen Treuebruch, besonders die Verletzung eines Bundes- oder Loyalitätsverhältnisses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Im fünften Jahr …
  rationale: Die hebräische narrative Einleitung wird im Deutschen durch die vorangestellte Zeitangabe natürlich aufgenommen; ein zusätzliches „Und es geschah“ wäre hier unnötig schwerfällig.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: Im fünften Jahr König Rehabeams
  rationale: Dies ist eine idiomatische und zugleich quellennah formulierte deutsche Regierungsdatierung.
- source_word: עָלָה … עַל יְרוּשָׁלִָם
  choice: zog … gegen Jerusalem herauf
  rationale: Die Formulierung bewahrt sowohl die Aufwärtsbewegung von עלה als auch die feindliche Ausrichtung von עַל, ohne bereits einen vollzogenen Angriff ausdrücklich zu behaupten.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: Schischak, der König von Ägypten
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben; die Apposition macht die Zuordnung natürlich verständlich.
- source_word: כִּי
  choice: weil
  rationale: כִּי nennt hier ausdrücklich den theologischen Grund für den Zug gegen Jerusalem.
- source_word: מָעֲלוּ
  choice: treulos gehandelt hatten
  rationale: מעל bezeichnet einen Treuebruch, besonders im Verhältnis zu Gott. „Treulos gehandelt“ erhält sowohl den aktiven verbalen Sinn als auch die Beziehungsebene.
- source_word: בַּיהוָה
  choice: dem HERRN gegenüber
  rationale: Die Präposition bezeichnet bei מעל denjenigen, dem gegenüber der Treuebruch begangen wird. Der Gottesname wird nach deutscher Bibelkonvention als „HERR“ wiedergegeben.
theological_decisions:
- issue: Bundesbezogene Deutung des Feldzugs Schischaks
  choice: weil sie dem HERRN gegenüber treulos gehandelt hatten
  alternative: weil sie sich am HERRN vergangen hatten
  rationale: Der Kausalzusammenhang des hebräischen Textes bleibt ausdrücklich erhalten. Die gewählte Formulierung macht den Treuebruch sichtbar, ohne die Art der Verfehlung über den Text hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Wendung bleibt bildhaft und quellennah; die theologische Begründung wird weder abgeschwächt noch konfessionell erweitert.
