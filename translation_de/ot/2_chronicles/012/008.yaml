base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: de
  text: Denn sie werden seine Sklaven sein, damit sie meinen Dienst[a] und den Dienst für die Königreiche der Länder kennenlernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Dienst für mich“. Das hebräische Wort kann Gottesverehrung, Dienst, Arbeit oder Dienstbarkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das unmittelbar zuvor angekündigte göttliche Handeln ein.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: sie sollen seine Knechte werden
  rationale: Die Konstruktion mit היה und ל bezeichnet ein Werden. „Knechte“ bewahrt hier sowohl den Gedanken des Dienstes als auch den der politischen Unterwerfung, ohne durch „Sklaven“ die Bedeutung unnötig zu verengen.
- source_word: וְיֵדְעוּ
  choice: damit sie … kennenlernen
  rationale: Das Imperfekt mit ו kann hier Ziel beziehungsweise Folge ausdrücken. „Kennenlernen“ gibt den erfahrungsbezogenen, pädagogischen Sinn von ידע in diesem Zusammenhang natürlich wieder.
- source_word: עֲבוֹדָתִי
  choice: meinen Dienst
  rationale: „Dienst“ bewahrt die Bedeutungsbreite von עֲבוֹדָה zwischen Gottesverehrung, Gehorsam und Dienstbarkeit.
- source_word: וַעֲבוֹדַת מַמְלְכוֹת הָאֲרָצוֹת
  choice: und den Dienst unter den Königreichen der Länder
  rationale: Die Wiederholung von „Dienst“ spiegelt den hebräischen Gegensatz. „Unter“ macht im Deutschen deutlich, dass es um die belastende Unterwerfung unter fremde Reiche geht, nicht um einen Dienst, den diese Reiche selbst leisten.
theological_decisions:
- issue: Ob עֲבוֹדָה in Bezug auf Gott ausschließlich als Gottesverehrung wiederzugeben ist
  choice: meinen Dienst
  alternative: meine Verehrung / den Gottesdienst für mich
  rationale: Der Vers stellt den Dienst für den HERRN der Unterwerfung unter irdische Königreiche gegenüber. „Dienst“ erhält sowohl die religiöse als auch die politische Dimension und bewahrt die Spannung des hebräischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Knechte“ ist leicht gehoben, aber im historischen Zusammenhang verständlich und ermöglicht die sprachliche Verbindung zu „Dienst“. Die etwas formelle Wendung „Königreiche der Länder“ bewahrt den Plural und die politische Bildwelt des Hebräischen.
