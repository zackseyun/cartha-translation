source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: de
  text: 'Da kam der Prophet Schemaja zu Rehabeam und den führenden Männern Judas, die sich wegen Schischaks[a] in Jerusalem versammelt hatten, und sagte zu ihnen: »So spricht Jahwe: Ihr habt mich verlassen; darum habe auch ich euch der Hand Schischaks überlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor Schischak« beziehungsweise »vor dem Angesicht Schischaks«; gemeint ist: wegen seiner Bedrohung oder aus Furcht vor ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: Da kam der Prophet Schemaja
  rationale: Das einleitende ו führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder. Der Titel mit bestimmtem Artikel bleibt erhalten.
- source_word: וְשָׂרֵי יְהוּדָה
  choice: und den führenden Männern Judas
  rationale: שָׂרִים bezeichnet hochgestellte politische oder militärische Verantwortungsträger. „Führende Männer“ ist verständlich, würdig und vermeidet das im Deutschen möglicherweise dynastisch missverständliche „Fürsten“.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: die sich ... in Jerusalem versammelt hatten
  rationale: Das Niphal wird hier idiomatisch reflexiv wiedergegeben. Der resultierende Versammlungsort wird im Deutschen natürlich mit „in Jerusalem“ bezeichnet.
- source_word: מִפְּנֵי שִׁישָׁק
  choice: wegen Schischaks
  rationale: מִפְּנֵי bedeutet wörtlich „vor dem Angesicht von“, bezeichnet hier aber den durch Schischaks Vormarsch verursachten Anlass beziehungsweise die Bedrohung. Eine Fußnote bewahrt die konkretere Bildlichkeit und mögliche Furchtnuance.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die traditionelle deutsche Wiedergabe bewahrt die feste prophetische Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: Ihr habt mich verlassen; darum habe auch ich euch ... überlassen
  rationale: Das deutsche Wortspiel „verlassen/überlassen“ bewahrt die Wiederholung desselben hebräischen Verbs und macht zugleich die unterschiedliche Ergänzung idiomatisch verständlich. „Darum ... auch ich“ gibt die vergeltende Entsprechung von וְאַף אֲנִי wieder.
- source_word: בְּיַד שִׁישָׁק
  choice: der Hand Schischaks
  rationale: Die hebräische Hand-Metapher für Macht und Verfügungsgewalt bleibt erhalten. Zusammen mit „überlassen“ ergibt sich natürliches Deutsch, ohne die gerichtliche Aussage abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Entsprechendes göttliches Gericht im zweimaligen עזב
  choice: verlassen ... der Hand Schischaks überlassen
  alternative: verlassen ... verlassen
  rationale: Die Wiederkehr desselben Verbs und damit die theologische Entsprechung zwischen menschlichem Abfall und göttlichem Gericht werden durch den gemeinsamen Wortstamm hörbar gehalten; zugleich verhindert „überlassen“ mit der Hand-Metapher unnatürliches oder missverständliches Deutsch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Rede. Namen sind in geläufiger deutscher Bibelschreibung wiedergegeben. Die Bildrede von der „Hand“ und die rhetorische Entsprechung des hebräischen Verbs עזב bleiben soweit möglich erhalten.
