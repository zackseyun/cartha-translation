  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: de
  text: Und als er sich demütigte, wandte sich Yahwehs Zorn von ihm ab, sodass Yahweh ihn nicht völlig vernichtete; auch in Juda gab es Gutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gute Dinge“; der hebräische Ausdruck ist weit gefasst und kann sich auf gute Zustände, Taten oder andere Angelegenheiten in Juda beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Und als er sich demütigte
  rationale: Die Präposition ב am Infinitiv vermittelt hier einen temporalen Sinn. Der Hitpael von כנע ist reflexiv und bezeichnet Rehabeams eigenes Sich-Demütigen.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: wandte sich Yahwehs Zorn von ihm ab
  rationale: שׁוב mit מִן beschreibt, dass der Zorn sich von Rehabeam abwendet. Die Formulierung wahrt die Bewegungsmetapher und vermeidet das stärker deutende „Yahweh ließ sich umstimmen“.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: sodass er ihn nicht völlig vernichtete
  rationale: Die Infinitivfügung drückt hier Folge beziehungsweise Zweck aus; לְכָלָה verstärkt die Vernichtung im Sinn von vollständig oder völlig. Das Objekt „ihn“ wird aus dem Kontext ergänzt.
- source_word: וְגַם בִּיהוּדָה
  choice: außerdem gab es auch in Juda
  rationale: וְגַם hat additive Kraft. „Außerdem … auch“ ist im Deutschen verständlich und bildet beide Bestandteile ab, ohne einen kausalen Zusammenhang einzuführen.
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: gab es Gutes
  rationale: דְּבָרִים ist breit und kann Dinge, Angelegenheiten, Zustände oder Taten bezeichnen. Das substantivierte „Gutes“ bewahrt diese Offenheit natürlicher als „gute Dinge“.
theological_decisions:
- issue: Göttliches Gericht und dessen Milderung
  choice: Yahwehs Zorn wandte sich von ihm ab, sodass er ihn nicht völlig vernichtete
  alternative: Yahweh ließ sich umstimmen und vernichtete ihn nicht vollständig
  rationale: Die gewählte Fassung bewahrt sowohl die Realität des göttlichen Zorns als auch dessen Milderung als Reaktion auf die Demütigung, ohne zu behaupten, sämtliche Folgen seien aufgehoben worden.
- issue: Bedeutungsumfang des Schlusses über Juda
  choice: in Juda gab es Gutes
  alternative: in Juda herrschten gute Verhältnisse
  rationale: Der hebräische Ausdruck bleibt allgemein. Die Übersetzung legt nicht fest, ob gute Taten, Zustände, Haltungen oder andere positive Gegebenheiten gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich demütigen“ entspricht dem reflexiven hebräischen Verb und ist in biblisch-theologischem Zusammenhang weiterhin allgemein verständlich. Die Satzstruktur bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
