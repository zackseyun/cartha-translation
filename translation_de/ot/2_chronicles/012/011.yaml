id: 2CH.12.11
reference: 2 Chronicles 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: de
  text: Und sooft der König in das Haus Jahwes kam, kamen die Wächter[a], trugen sie[b] und brachten sie danach wieder in die Kammer[c] der Wächter zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Läufer«; gemeint ist die königliche Wache.'
    reason: lexical_alternative
  - marker: b
    text: »Sie« bezieht sich auf die bronzenen Schilde aus Vers 10.
    reason: cross_reference
  - marker: c
    text: 'Oder: »Raum« beziehungsweise »Wachraum«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: sooft … kam
  rationale: Die Verbindung מִדֵּי mit dem Infinitiv bezeichnet einen regelmäßig wiederkehrenden Vorgang. „Sooft“ gibt diesen iterativen Sinn knapp und natürlich wieder.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel; die hebräische Ausdrucksweise bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, entsprechend dem Tetragramm im hebräischen Text.
- source_word: הָרָצִים
  choice: die Wächter
  rationale: Wörtlich sind dies die „Läufer“; im königlichen Zusammenhang bezeichnet der Ausdruck jedoch die Leib- oder Palastwache. „Wächter“ vermittelt die Funktion verständlich.
- source_word: וּנְשָׂאוּם
  choice: trugen sie
  rationale: Das angehängte Pronomen verweist auf die bronzenen Schilde aus Vers 10. „Trugen“ entspricht dem konkreten Transport der Schilde.
- source_word: וֶהֱשִׁיבוּם
  choice: brachten sie … wieder … zurück
  rationale: Der Hifil von שׁוב drückt hier aus, dass die Schilde nach ihrem Gebrauch an ihren Aufbewahrungsort zurückgebracht wurden.
- source_word: תָּא
  choice: Kammer
  rationale: תָּא bezeichnet einen abgegrenzten Nebenraum oder eine Kammer; „Kammer“ bewahrt die räumliche Bedeutung ohne unnötige Präzisierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diesen Befund, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der wiederholte Ablauf wird mit „sooft“ ausgedrückt. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch „danach“ und die natürliche deutsche Wortstellung flüssig lesbar.
