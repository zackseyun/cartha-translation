  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: de
  text: Die Taten Rehabeams, die ersten und die letzten, sind sie nicht in den Aufzeichnungen des Propheten Schemaja und des Sehers Iddo zur genealogischen Eintragung aufgezeichnet?[a] Zwischen Rehabeam und Jerobeam gab es alle ihre Tage hindurch Kriege.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Möglich sind auch: „in den Geschlechtsregistern“ oder „zum Zweck der Eintragung in ein Geschlechtsregister“. Sie kann die Form oder den Zweck des mit Iddo verbundenen Quellenmaterials bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: die Geschichte Rehabeams
  rationale: דִבְרֵי bezeichnet in der königlichen Schlussformel die Taten, Ereignisse und Angelegenheiten einer Regierungszeit; „Geschichte“ gibt diesen historiografischen Sinn im Deutschen natürlich wieder.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: die frühere und die spätere
  rationale: Bewahrt die zweigliedrige hebräische Form und bezeichnet die gesamte Regierungszeit, ohne sie unnötig als chronologische Gesamtschau auszudeuten.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ist sie nicht … niedergeschrieben
  rationale: Erhält die rhetorische Frage der üblichen Quellenformel und passt den Numerus idiomatisch an das deutsche Sammelwort „Geschichte“ an.
- source_word: בְּדִבְרֵי
  choice: in den Aufzeichnungen
  rationale: Im Kontext verweist דִבְרֵי auf schriftliches Quellenmaterial; „Aufzeichnungen“ ist sachlich und historiografisch passend.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Standardentsprechung für נָבִיא.
- source_word: הַחֹזֶה
  choice: der Seher
  rationale: Bewahrt den vom Titel „Prophet“ verschiedenen Ausdruck חֹזֶה.
- source_word: לְהִתְיַחֵשׂ
  choice: im Zusammenhang mit dem Geschlechtsregister
  rationale: Das Hitpael von יחס betrifft genealogische Zuordnung oder Eintragung. Die offene Formulierung erhält die schwierige syntaktische Beziehung, ohne eindeutig Form, Inhalt oder Zweck der Quelle festzulegen.
- source_word: וּמִלְחֲמוֹת
  choice: Zwischen … herrschte Krieg
  rationale: Macht die im hebräischen Nominalsatz implizite Aussage in natürlichem Deutsch ausdrücklich.
- source_word: כָּל הַיָּמִים
  choice: solange sie lebten
  rationale: Gibt die hebräische Wendung „alle ihre Tage“ idiomatisch wieder und bezieht sie entsprechend dem Kontext auf beide Könige.
