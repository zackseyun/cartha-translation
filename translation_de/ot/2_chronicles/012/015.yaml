- from: Die Geschichte Rehabeams, die frühere und die spätere, ist sie nicht in den Aufzeichnungen des Propheten Schemaja und des Sehers Iddo niedergeschrieben, im Zusammenhang mit dem Geschlechtsregister?[a] Zwischen Rehabeam und Jerobeam herrschte Krieg, solange sie lebten.
  to: Die Taten Rehabeams, die ersten und die letzten, sind sie nicht in den Aufzeichnungen des Propheten Schemaja und des Sehers Iddo zur genealogischen Eintragung aufgezeichnet?[a] Zwischen Rehabeam und Jerobeam gab es alle ihre Tage hindurch Kriege.
  rationale: Die Revision stellt die pluralische königliche Quellenformel mit „Taten … die ersten und die letzten“ wieder her, verbessert die Satzidiomatik und bewahrt bei der genealogischen Wendung die notwendige Offenheit. „Alle ihre Tage hindurch“ gibt die hebräische Zeitformel wieder, ohne sie auf die Lebenszeit der beiden Könige zu beschränken.
