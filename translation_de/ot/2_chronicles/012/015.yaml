review_pass:
  verdict: revise
  source_fidelity: Die Vorlage gibt die Quellenformel, die beiden prophetischen Titel und die fortdauernden Konflikte grundsätzlich wieder. „Solange sie lebten“ legt כָּל־הַיָּמִים jedoch stärker auf die gesamte Lebenszeit fest; „alle ihre Tage hindurch“ bewahrt die hebräische Formel und ihre mögliche Ausrichtung auf die gemeinsame Regierungszeit besser. Die pluralische Form von מִלְחֲמוֹת sollte zudem im Deutschen sichtbar bleiben.
  naturalness: „Die Geschichte Rehabeams, die frühere und die spätere, ist sie nicht …“ ist im modernen Standarddeutsch syntaktisch schwerfällig und wegen des Singulars „Geschichte“ mit den pluralischen Gliedern der Formel weniger gelungen. „Die Taten Rehabeams, die ersten und die letzten, sind sie nicht …?“ ist natürlich, würdig und formelnah.
  terminology: „Taten“ trifft דִבְרֵי in einer königlichen Abschlussformel präziser als das sehr weit gefasste „Geschichte“. „Prophet“ und „Seher“ sind richtig und erhalten die unterschiedliche hebräische Titulatur. Die schwierige genealogische Wendung wird als „zur genealogischen Eintragung“ knapp wiedergegeben und durch die Fußnote angemessen abgesichert.
  issues:
  - severity: medium
    issue: Singuläre und stilistisch holprige Wiedergabe der Quellenformel
    rationale: Das hebräische דִבְרֵי sowie הָרִאשֹׁנִים וְהָאַחֲרוֹנִים stehen pluralisch. Die Umformung zu „Die Geschichte … die frühere und die spätere, ist sie“ wirkt unidiomatisch und schwächt die etablierte Formel für die Taten bzw. Begebenheiten einer Herrschaft.
  - severity: medium
    issue: „solange sie lebten“ verengt כָּל־הַיָּמִים
    rationale: Die hebräische Wendung lautet wörtlich „alle ihre Tage“ und kann im königlichen Kontext die gesamte Dauer ihres Konflikts beziehungsweise ihrer Regierungszeit meinen. Die deutsche Formulierung sollte diese Reichweite nicht auf die biologische Lebenszeit festlegen.
  - severity: low
    issue: Plural von מִלְחֲמוֹת nicht abgebildet
    rationale: „herrschte Krieg“ ist zwar idiomatisch, aber das Hebräische nennt „Kriege“. Eine pluralische Wiedergabe wahrt die Textform, ohne den Sinn zu verändern.
