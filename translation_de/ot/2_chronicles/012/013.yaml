  terminology: „Jahwe“, „Rehabeam“, „Naama“ und „die Ammoniterin“ sind angemessen. Die Gottesnamenformel soll konkret bleiben und nicht zu einer Aussage über das Wohnen des Namens bzw. Gottes ausgeweitet werden.
