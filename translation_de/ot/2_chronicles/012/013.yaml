source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: de
  text: So festigte König Rehabeam seine Stellung in Jerusalem und regierte.[a] Rehabeam war einundvierzig Jahre alt, als er König wurde, und regierte siebzehn Jahre in Jerusalem, der Stadt, die Jahwe aus allen Stämmen Israels erwählt hatte, um dort seinen Namen zu setzen.[b] Seine Mutter hieß Naama, die Ammoniterin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde stark in Jerusalem und regierte“. Das hebräische Verb kann sowohl ein Erstarken als auch ein Sich-Festigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um dort seinen Namen zu setzen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: festigte … seine Stellung
  rationale: Das Hitpael von חזק bezeichnet hier ein Erstarken bzw. Sich-Festigen. Im politischen Zusammenhang gibt die Wendung die Konsolidierung von Rehabeams Herrschaft natürlich und präzise wieder.
- source_word: וַיִּמְלֹךְ
  choice: und regierte
  rationale: Die Erzählform führt die Handlung fort, ohne eigens den Beginn der Herrschaft auszudrücken.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Der Infinitiv mit בְּ bezeichnet im Königsformular den Zeitpunkt des Herrschaftsantritts.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird im Deutschen als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  rationale: Diese im Deutschen geläufige biblische Wendung bewahrt die konkrete Namenstheologie des hebräischen Ausdrucks; wörtlicher steht allerdings „seinen Namen dorthin zu setzen“, weshalb eine Fußnote die Formulierung absichert.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: מִן bezeichnet die Auswahl aus der Gesamtheit der israelitischen Stämme.
- source_word: הָעַמֹּנִית
  choice: die Ammoniterin
  rationale: Das feminine Herkunftswort wird mit der natürlichen deutschen Volksbezeichnung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; seine Wiedergabe wahrt den Unterschied zwischen Name und Titel.
- issue: Formel vom Niederlegen des göttlichen Namens
  choice: um dort seinen Namen wohnen zu lassen
  alternative: um seinen Namen dort niederzulegen
  rationale: Die Hauptfassung ist verständliches, würdevolles Deutsch und bewahrt die Namenstheologie, ohne sie als allgemeine Aussage über Gottes Gegenwart auszudeuten. Die wörtlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle Königsformular wird flüssig wiedergegeben; politische Konsolidierung und die konkrete Rede vom göttlichen Namen bleiben erkennbar.
