  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: de
  text: 'Da demütigten sich die führenden Männer Israels[a] und der König und sagten: »Yahweh ist gerecht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht »die führenden Männer Israels«. Im Zusammenhang wird dies teilweise speziell auf die führenden Männer Judas unter Rehabeam bezogen; der Text selbst sagt jedoch »Israel«.
    reason: Bewahrung der auslegungsrelevanten Spannung zwischen dem Wortlaut „Israel“ und dem historischen Zusammenhang; der Anker steht unmittelbar bei dem erläuterten Ausdruck.
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: demütigten sich
  rationale: Der Niphal von כנע bezeichnet hier die selbst vollzogene Demütigung beziehungsweise Unterordnung als Reaktion auf die prophetische Zurechtweisung.
- source_word: שָׂרֵי
  choice: führenden Männer
  rationale: שָׂרִים meint ranghohe Amtsträger oder Fürsten. »Führende Männer« ist im historischen Zusammenhang natürlich und vermeidet den im modernen Deutsch engeren dynastischen Sinn von »Fürsten«.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel. Trotz des Zusammenhangs im Reich Juda wird diese Bezeichnung nicht harmonisierend ersetzt.
- source_word: וְהַמֶּלֶךְ
  choice: und der König
  rationale: Die koordinierte Nominalgruppe unterscheidet den König von den zuvor genannten führenden Männern.
- source_word: וַיֹּאמְרוּ
  choice: und sagten
  rationale: Die Form setzt die Erzählfolge fort; das gemeinsame Subjekt ergibt sich eindeutig aus dem vorangehenden Satzteil.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Prädikatsadjektiv bezeichnet Yahwehs Gerechtigkeit beziehungsweise Rechtmäßigkeit in seinem Gericht. »Gerecht« bewahrt die theologische Tragweite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Im Ausgangstext steht das Tetragramm יְהוָה. Die Transliteration bewahrt den offenbarten Eigennamen statt ihn durch einen Titel zu ersetzen.
- issue: Israel oder Juda
  choice: Israel
  alternative: Juda
  rationale: Obwohl der historische Zusammenhang Rehabeam und Juda betrifft, lautet der überlieferte Text »Israel«. Diese Spannung wird bewahrt und in einer Fußnote erläutert.
- issue: Bedeutung von צַדִּיק als Aussage über Yahweh
  choice: gerecht
  alternative: im Recht
  rationale: »Gerecht« kann sowohl die moralische Gerechtigkeit als auch die Rechtmäßigkeit des angekündigten Gerichts ausdrücken, ohne die Aussage auf eine einzige Nuance zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Da« gibt die unmittelbare erzählerische Folge wieder. Die Satzstruktur bleibt nahe am Hebräischen, ohne im Deutschen unnatürlich zu wirken.
