source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: de
  text: Da zog Schischak, der König von Ägypten, gegen Jerusalem. Er nahm die Schätze aus dem Haus Jahwes[a] und die Schätze aus dem Haus des Königs[b]. Alles nahm er mit, auch die goldenen Schilde, die Salomo gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus dem Tempel Jahwes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: aus dem Königspalast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: zog ... gegen Jerusalem
  rationale: עלה mit עַל bezeichnet in diesem militärischen Zusammenhang den Zug gegen eine Stadt. Die deutsche Formulierung bewahrt das Bewegungsbild und macht den feindlichen Zusammenhang deutlich.
- source_word: שִׁישַׁק
  choice: Schischak
  rationale: Der Personenname wird in einer im Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Die Apposition bezeichnet Schischaks Amt und Herrschaftsgebiet eindeutig.
- source_word: אֹצְרוֹת
  choice: Schätze
  rationale: אֹצָר kann sowohl den Vorrats- oder Schatzraum als auch dessen Bestand bezeichnen. Da die Beute weggenommen wird, ist »Schätze« im Deutschen die natürliche kontextuelle Wiedergabe; »Schatzkammern« könnte missverständlich so klingen, als seien die Räume selbst fortgebracht worden.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung bleibt erhalten; im Kontext bezeichnet sie den Tempel. Eine verständlichere Deutung wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Haus des Königs
  rationale: Die Formulierung bewahrt den Parallelismus zum »Haus Jahwes«; gemeint ist der Königspalast.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Alles nahm er mit
  rationale: Der zusammenfassende Nachsatz unterstreicht den vollständigen Umfang der Plünderung. »Mitnehmen« klingt im Deutschen bei fortgeschaffter Beute natürlich.
- source_word: מָגִנֵּי הַזָּהָב
  choice: die goldenen Schilde
  rationale: Die Formulierung gibt die Materialangabe idiomatisch und eindeutig wieder.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: die Salomo hatte anfertigen lassen
  rationale: Die Vorzeitigkeit wird durch das Plusquamperfekt ausgedrückt. »Anfertigen lassen« bezeichnet in natürlichem Deutsch die königliche Veranlassung, ohne zu behaupten, Salomo habe die Schilde eigenhändig hergestellt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als Gottes Eigennamen. »Jahwe« bewahrt diese Funktion, statt den Namen durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der wiederholte Ausdruck »Haus« erhält den Parallelismus des Hebräischen; die Fußnoten bieten die im Kontext gemeinten institutionellen Bezeichnungen. Der resumptive Satz »Alles nahm er mit« bleibt zur Wahrung der hebräischen Betonung eigenständig.
