  terminology: »Jahwe« gibt den Gottesnamen angemessen als Eigenname wieder. »Haus Jahwes« und »Haus des Königs« bewahren den hebräischen Parallelismus; die Fußnoten nennen die kontextuell naheliegenden Alternativen. »Goldene Schilde« ist idiomatisch und genau.
