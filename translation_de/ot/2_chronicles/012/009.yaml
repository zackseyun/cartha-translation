  source_fidelity: 'Der Zug Schischaks gegen Jerusalem, die Wegnahme der Schätze aus dem Haus Jahwes und dem Königshaus sowie die hervorgehobene Wegnahme der goldenen Schilde sind sachgerecht wiedergegeben. »hatte anfertigen lassen« ist jedoch stärker als das hebräische עָשָׂה („machte“): Der Text sagt nicht ausdrücklich, dass Salomo die Herstellung in Auftrag gab.'
