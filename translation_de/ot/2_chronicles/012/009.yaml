    rationale: Nach »aus dem Haus ...« müssen die Alternativen »aus dem Tempel Jahwes« bzw. »aus dem Königspalast« lauten. Die vorhandenen Formen im Dativ sind keine vollständigen, direkt einsetzbaren Alternativen.
