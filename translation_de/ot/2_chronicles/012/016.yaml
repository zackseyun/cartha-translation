  text: וַ/יִּשְׁכַּ֤ב רְחַבְעָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: de
  text: Und Rehabeam legte sich zu seinen Vätern[a] und wurde in der Stadt Davids begraben. Sein Sohn Abija wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »legte sich zu seinen Vätern«; eine übliche Wendung für den Tod und die Aufnahme in die Reihe der Vorfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt zusammen mit »zu seinen Vätern« die feste hebräische Königsformel für den Tod, ohne sie vorschnell auf das allgemeinere »starb« zu reduzieren.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die im Deutschen eingebürgerte formelhafte Wendung gibt die dynastische Aussage des Hebräischen angemessen wieder; »zu seinen Vorfahren« wäre verständlicher, aber weniger formelgetreu.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Gibt die passive hebräische Verbform direkt und in natürlichem Deutsch wieder.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Entspricht der hebräischen Ortsbezeichnung und ihrer üblichen deutschen Wiedergabe.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang einer Thronfolge bezeichnet das Verb hier den Regierungsantritt; diese Formulierung klingt im heutigen Deutsch natürlicher als »regierte an seiner Stelle«.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: Gibt die hier im Chronikbuch bezeugte Namensform אֲבִיָּה wieder; die anderswo vorkommende Form Abijam wird nicht eingetragen.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Schlichte und genaue Wiedergabe der verwandtschaftlichen Bezeichnung.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Bewahrt die räumliche Bildlichkeit des Ausdrucks und bezeichnet im Kontext eindeutig die königliche Nachfolge.
