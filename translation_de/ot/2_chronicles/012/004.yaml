id: 2CH.12.4
reference: 2 Chronicles 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּלְכֹּ֛ד אֶת עָרֵ֥י הַ/מְּצֻר֖וֹת אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יָּבֹ֖א עַד יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: de
  text: Er nahm die befestigten Städte ein, die zu Juda gehörten, und kam bis nach Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und rückte bis nach Jerusalem vor“. Wörtlich heißt es im Hebräischen „und kam bis nach Jerusalem“. Damit wird betont, dass er nach der Einnahme der befestigten Städte Judas Jerusalem erreichte; ob er in die Stadt eindrang, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: nahm … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme von Städten. „Einnehmen“ ist im Deutschen natürlich und präzise.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: die befestigten Städte
  rationale: Die Wendung bezeichnet ausdrücklich befestigte städtische Orte; „Festungen“ wäre weniger genau, da der hebräische Text von Städten spricht.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: die zu Juda gehörten
  rationale: Die Präposition ל drückt hier Zugehörigkeit aus. Die Formulierung wahrt den politischen Bezug, ohne ihn auf eine rein geografische Lage zu verengen.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: und kam bis nach Jerusalem
  rationale: בוא mit עַד bezeichnet das Gelangen bis zu einem Ziel oder Grenzpunkt. „Bis nach Jerusalem“ lässt offen, ob er in die Stadt eindrang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bedeutung von לכד wird idiomatisch mit „einnehmen“ wiedergegeben; bei בוא עד bleibt die im Hebräischen vorhandene Offenheit hinsichtlich eines Eindringens in Jerusalem erhalten.
