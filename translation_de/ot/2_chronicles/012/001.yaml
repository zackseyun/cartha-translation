source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: de
  text: Als Rehabeams Königsherrschaft gefestigt war und er stark geworden war, verließ er das Gesetz Jahwes[a] – und ganz Israel mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Weisung Jahwes«. Das hebräische Wort Tora kann je nach Zusammenhang »Gesetz« oder »Weisung« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: Als … gefestigt war
  rationale: Die Konstruktion leitet einen zeitlichen Umstand ein. כון bezeichnet hier die Festigung beziehungsweise Konsolidierung der Herrschaft; die deutsche Formulierung gibt dies natürlich wieder, ohne ein unnötiges »es geschah« einzufügen.
- source_word: מַלְכוּת רְחַבְעָם
  choice: Rehabeams Königsherrschaft
  rationale: מַלְכוּת kann sowohl das Königreich als auch die Königsherrschaft bezeichnen. Da die Aussage von ihrer Festigung und anschließend von Rehabeams Erstarken handelt, passt »Königsherrschaft« besonders gut und vermeidet, das Wort ausschließlich territorial zu verstehen.
- source_word: וּכְחֶזְקָתוֹ
  choice: und er erstarkt war
  rationale: חזק bezeichnet das Erlangen von Stärke, Macht oder Sicherheit. »Erstarkt war« bewahrt diese Bedeutungsbreite und ist im Deutschen knapp und idiomatisch.
- source_word: עָזַב
  choice: verließ
  rationale: Das Verb bezeichnet das Aufgeben oder Verlassen. »Verließ« ist deutlich und würdevoll; der Gegenstand, Jahwes Gesetz, macht den schwerwiegenden Bundesbruch erkennbar.
- source_word: אֶת תּוֹרַת יְהוָה
  choice: das Gesetz Jahwes
  rationale: תּוֹרָה kann »Gesetz« oder allgemeiner »Weisung« bedeuten. Im bundestheologischen Zusammenhang ist »Gesetz« eine verständliche Hauptwiedergabe; eine Fußnote bewahrt die lexikalische Alternative. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: – und ganz Israel mit ihm
  rationale: Die knappe elliptische Form des Hebräischen wird beibehalten. Der Gedankenstrich markiert, dass ganz Israel sich Rehabeams Handeln anschloss, ohne den Umfang von »Israel« interpretierend einzugrenzen.
theological_decisions:
- issue: Bedeutung von »ganz Israel« zur Zeit des geteilten Reiches
  choice: ganz Israel
  alternative: ganz Juda; sein ganzes Volk
  rationale: Der hebräische Text nennt ausdrücklich Israel. Die Übersetzung bewahrt diese Bezeichnung und lässt offen, welchen genauen Umfang sie im chronistischen Sprachgebrauch an dieser Stelle hat.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: »Gesetz« passt zum historischen und bundestheologischen Kontext, doch תּוֹרָה ist nicht auf ein modernes juristisches Gesetzesverständnis beschränkt. Die Fußnote hält daher die mögliche Wiedergabe »Weisung« sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zeitliche Satzfügung folgt dem hebräischen Zusammenhang, während »Königsherrschaft« und »erstarkt« die politische Konsolidierung prägnant ausdrücken. Der Gedankenstrich erhält die zugespitzte, elliptische Schlusswendung.
