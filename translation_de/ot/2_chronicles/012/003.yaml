translation_notes:
  register: Moderne, würdige Standardsprache. Der Versanfang bleibt wegen des syntaktischen Anschlusses an Vers 2 kleingeschrieben. „Volk“ bewahrt die Offenheit des hebräischen עָם, obwohl im Zusammenhang militärische Begleittruppen gemeint sind.
