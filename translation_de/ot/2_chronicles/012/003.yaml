source:
  edition: WLC
  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: de
  text: 'mit 1.200 Streitwagen und 60.000 Reitern. Das Volk, das mit ihm aus Ägypten kam, war nicht zu zählen[a]: Libyer, Sukkiter[b] und Kuschiter[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Für das Volk gab es keine Zahl.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Identität der Sukkiter ist unsicher; der hebräische Volksname wird auch als „Sukkiim“ wiedergegeben.
    reason: cultural_note
  - marker: c
    text: Traditionell auch „Äthiopier“; „Kuschiter“ gibt die hebräische ethnisch-geografische Bezeichnung unmittelbarer wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: mit 1.200 Streitwagen
  rationale: Das Präfix ב bezeichnet hier im Rahmen der militärischen Aufzählung die mitgeführte Streitmacht. רֶכֶב kann kollektiv die Streitwagenmacht meinen; nach einer Zahl ist im Deutschen der Plural „Streitwagen“ natürlich und präzise.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: und 60.000 Reitern
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer. „Reiter“ ist im Deutschen klar, knapp und für einen historischen Bericht angemessen.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: Das Volk … war nicht zu zählen
  rationale: Die hebräische Wendung besagt wörtlich, dass es für das Volk keine Zahl gab. „War nicht zu zählen“ gibt den idiomatischen Sinn wieder, ohne das allgemeinere עָם vorschnell als „Heer“ festzulegen.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: das mit ihm aus Ägypten kam
  rationale: Die Relativkonstruktion und die Herkunftsangabe werden direkt und in natürlicher deutscher Wortfolge wiedergegeben.
- source_word: לוּבִים
  choice: Libyer
  rationale: Die Volksbezeichnung wird herkömmlich mit den Libyern verbunden; „Libyer“ ist die geläufige deutsche Form.
- source_word: סֻכִּיִּים
  choice: Sukkiter
  rationale: Die genaue Identität dieser Volksgruppe ist unsicher. „Sukkiter“ gibt den hebräischen Namen in einer verständlichen deutschen Form wieder, ohne eine unbelegte Identifizierung vorzunehmen.
- source_word: וְכוּשִׁים
  choice: und Kuschiter
  rationale: „Kuschiter“ bewahrt den historischen und geografischen Namen Kusch und vermeidet die möglicherweise anachronistische Gleichsetzung mit heutigen Äthiopiern.
