base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: de
  text: Joschafat und sein Volk kamen, um ihre Beute zu nehmen. Sie fanden bei ihnen eine große Menge an Besitz, Leichen[a] und kostbaren Gegenständen. Sie nahmen sich so viel davon, dass sie es nicht tragen konnten. Drei Tage lang plünderten sie die Beute, denn es war sehr viel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Leichen“. Einige alte Textzeugen und Übersetzungen setzen hier offenbar eine Lesart wie „Kleider“ voraus oder lassen das Wort aus; der masoretische Text lautet jedoch „Leichen“.'
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: um ihre Beute zu plündern
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens; „Beute plündern“ bewahrt den militärischen Sinn und gibt das Possessivsuffix wieder.
- source_word: בָהֶם
  choice: bei ihnen
  rationale: Die Wendung kann „unter ihnen“, „bei ihnen“ oder „an ihnen“ bedeuten. „Bei ihnen“ bleibt im Deutschen räumlich offen und passt zu den gefallenen Feinden und deren Habe.
- source_word: לָרֹב וּרְכוּשׁ
  choice: eine große Menge an Besitz
  rationale: לָרֹב betont die große Menge, רְכוּשׁ bezeichnet Habe beziehungsweise beweglichen Besitz.
- source_word: פְגָרִים
  choice: Leichen
  rationale: Der masoretische Konsonantentext bezeichnet eindeutig tote Körper; die direkte Wiedergabe wahrt den schwierigen überlieferten Wortlaut.
- source_word: כְלֵי חֲמֻדוֹת
  choice: kostbare Gegenstände
  rationale: כְּלִי kann verschiedenartige Geräte oder Gegenstände bezeichnen, während חֲמֻדוֹת ihren begehrenswerten beziehungsweise wertvollen Charakter ausdrückt.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: Sie nahmen so viel für sich
  rationale: Das Piel von נצל kann hier das Wegnehmen beziehungsweise Ausplündern ausdrücken; לָהֶם bezeichnet den eigenen Nutzen. Die Formulierung verbindet sich natürlich mit der folgenden Mengenangabe.
- source_word: לְאֵין מַשָּׂא
  choice: dass sie es nicht tragen konnten
  rationale: Die wörtlich knappe Wendung bezeichnet eine Menge, die nicht mehr fortgetragen werden konnte.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Drei Tage lang plünderten sie
  rationale: Die deutsche Dauerangabe gibt die fortgesetzte Tätigkeit idiomatisch und präzise wieder.
- source_word: כִּי רַב הוּא
  choice: denn es war sehr viel
  rationale: Der Begründungssatz erklärt die dreitägige Dauer durch die außergewöhnliche Menge der Beute.
theological_decisions: []
