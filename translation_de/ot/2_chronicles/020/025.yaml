  register: Modernes, würdevolles Standarddeutsch. Der schwierige masoretische Wortlaut „Leichen“ bleibt im Haupttext erhalten; die textliche Abweichung wird transparent in der Fußnote genannt. Kurze Hauptsätze sorgen für gute Verständlichkeit, ohne die sachliche Erzählweise zu verflachen.
