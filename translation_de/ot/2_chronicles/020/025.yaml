revisions:
- from: Joschafat und sein Volk kamen, um ihre Beute zu plündern. Sie fanden bei ihnen eine große Menge an Besitz, Leichen[a] und kostbaren Gegenständen. Sie nahmen so viel für sich, dass sie es nicht tragen konnten. Drei Tage lang plünderten sie die Beute, denn es war sehr viel.
  to: Joschafat und sein Volk kamen, um ihre Beute zu nehmen. Sie fanden bei ihnen eine große Menge an Besitz, Leichen[a] und kostbaren Gegenständen. Sie nahmen sich so viel davon, dass sie es nicht tragen konnten. Drei Tage lang plünderten sie die Beute, denn es war sehr viel.
  rationale: 'Die Revision beschränkt sich auf zwei stilistisch und semantisch sichere Verbesserungen: Die Zweckangabe wird im modernen Deutschen idiomatisch gefasst, und das unbestimmte Objekt des Wegnehmens wird mit „davon“ kohärent auf die genannte Beute bezogen. Der schwierige masoretische Wortlaut „Leichen“ und die zugehörige textkritische Fußnote bleiben unverändert erhalten.'
