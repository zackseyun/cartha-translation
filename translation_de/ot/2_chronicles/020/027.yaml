    issue: Unnatürliche und pleonastische Wiedergabe der Rückkehrbewegung
    rationale: Die Formulierung „kehrten ... um, um ... zurückzukehren“ verdoppelt im Deutschen nahezu dieselbe Aussage. Die Wiederholung von שוב ist im Hebräischen syntaktisch bedingt und muss nicht in einer unidiomatischen deutschen Infinitivkonstruktion gespiegelt werden.
  - severity: low
    issue: Fußnotenalternative ist im Deutschen semantisch weniger klar
    rationale: „Wegen ihrer Feinde froh gemacht“ kann nahelegen, die Feinde selbst seien der Grund der Freude. Der Kontext meint vielmehr die von Jahwe bewirkte Freude im Blick auf die besiegten Feinde.
  revised_text: Da kehrten alle Männer aus Juda und Jerusalem mit Joschafat an ihrer Spitze voller Freude nach Jerusalem zurück, denn Jahwe hatte sie über ihre Feinde erfreut.
