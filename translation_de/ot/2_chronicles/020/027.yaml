base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: de
  text: Da kehrten alle Männer aus Juda und Jerusalem mit Joschafat an ihrer Spitze voller Freude nach Jerusalem zurück, denn Jahwe hatte sie über ihre Feinde erfreut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: kehrten ... um, um ... zurückzukehren
  rationale: Die Wiedergabe erhält die zweimalige Verwendung der Wurzel שׁוב und unterscheidet zugleich natürlich zwischen dem Aufbruch vom Schlachtfeld und der Rückkehr nach Jerusalem.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלִַם
  choice: alle Männer von Juda und Jerusalem
  rationale: Das distributive Singularidiom bedeutet kollektiv die Männer der beiden Gemeinschaften; die deutsche Form ist natürlich und wahrt die ausdrücklich männliche Bezeichnung אִישׁ.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: mit Joschafat an ihrer Spitze
  rationale: Bewahrt das hebräische Bild einer anführenden beziehungsweise vorne befindlichen Person in idiomatischem Deutsch.
- source_word: בְּשִׂמְחָה
  choice: voller Freude
  rationale: Gibt das Substantiv שִׂמְחָה natürlich und würdevoll wieder.
- source_word: שִׂמְּחָם יְהוָה מֵאוֹיְבֵיהֶם
  choice: Jahwe hatte ihnen Freude über ihre Feinde geschenkt
  rationale: Das Piel von שׂמח wird kausativ wiedergegeben. „Über ihre Feinde“ erhält die kontextuell naheliegende triumphale Beziehung, während eine Fußnote die mögliche Nuance der Präposition מן nennt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen; „Jahwe“ bewahrt diese Form.
- issue: Bezug von מֵאֹיְבֵיהֶם
  choice: über ihre Feinde
  alternative: wegen ihrer Feinde / von ihren Feinden weg
  rationale: Im Zusammenhang ist der Sieg über die Feinde der Anlass der Freude. Da מן semantisch mehrdeutig sein kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der hebräischen Wurzel שׁוב bleibt erkennbar, ohne einen unnatürlichen deutschen Satz zu erzeugen; der idiomatische Kollektivausdruck wird als „alle Männer“ wiedergegeben.
