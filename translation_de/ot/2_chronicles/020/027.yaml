  rationale: Die Revision stellt eine idiomatische deutsche Satzführung her, ohne den Sinn zu verändern. „Zurückkehren“ trägt die Rückkehrbewegung; die durch das hebräische שוב ... לשוב hervorgehobene Heimkehr bleibt im Kontext erhalten, ohne eine deutsche Tautologie zu erzeugen. Die Fußnote wird entfernt, weil die gewählte Formulierung die kausative Aussage und den Kontext hinreichend klar wiedergibt und die angebotene Alternative missverständlich ist.
