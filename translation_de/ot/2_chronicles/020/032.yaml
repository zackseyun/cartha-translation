    rationale: Der neue Hauptsatz „Er tat“ ist nicht falsch, lockert aber die im Hebräischen bestehende modale bzw. erläuternde Verknüpfung. „Indem er tat“ macht diese Beziehung sichtbar.
  - severity: low
    issue: Idiomatizität der Wegmetapher und Formel
    rationale: „Den Weg ... gehen“ und „was ... recht war“ sind im heutigen deutschen Bibelregister natürlicher, ohne den Sinn zu verändern.
  revised_text: Er ging den Weg seines Vaters Asa und wich nicht davon ab, indem er tat, was in den Augen Jahwes recht war.
