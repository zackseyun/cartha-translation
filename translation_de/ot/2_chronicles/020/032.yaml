source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: de
  text: Er ging den Weg seines Vaters Asa und wich nicht davon ab, indem er tat, was in den Augen Jahwes recht war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Er ging auf dem Weg
  rationale: Die Verbindung beschreibt bildhaft die Lebensführung. „Auf dem Weg gehen“ bewahrt die hebräische Metapher und ist im Deutschen verständlich.
- source_word: אָבִיו אָסָא
  choice: seines Vaters Asa
  rationale: Die Konstruktion bezeichnet Asa als den Vater Joschafats; die gewählte Wortstellung ist natürliches modernes Deutsch.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: und wich nicht davon ab
  rationale: סור מן bezeichnet das Abweichen von einem Weg. „Davon“ bezieht sich eindeutig auf den zuvor genannten Weg und erhält das Bild.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: Er tat, was … richtig war
  rationale: Der Infinitiv bezeichnet hier die entsprechende Handlung beziehungsweise Folge; ein neuer deutscher Hauptsatz gibt den Sinn klar und würdig wieder. הַיָּשָׁר ist substantiviert und meint das moralisch Richtige.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die Formulierung bewahrt das hebräische Bild göttlicher Beurteilung. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den Eigennamen im modernen deutschen Bibelkontext direkt und erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Charakter der königlichen Beurteilung
  choice: was in den Augen Jahwes richtig war
  alternative: was Jahwe gefiel
  rationale: Die konkrete Aussage über das moralisch Richtige wird bewahrt; die freiere Alternative könnte den Maßstab auf bloßes Gefallen verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Weg-Metapher und die bildhafte Wendung „in den Augen“ bleiben erhalten; der lange hebräische Satz wird zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
