  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: de
  text: 'Sie wohnten darin[a] und bauten dir darin ein Heiligtum für deinen Namen[b] und sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie ließen sich darin nieder.«'
    reason: lexical_alternative
  - marker: b
    text: Ein »Heiligtum für deinen Namen« ist ein heiliger Ort, der dem Namen des HERRN geweiht ist – also seiner offenbarten Gegenwart und Ehre.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: sie wohnten
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise dauerhafte Ansässigsein im Land. »Wohnten« ist modern, klar und lässt offen, ob der Beginn der Ansiedlung oder der fortdauernde Aufenthalt betont wird.
- source_word: בָהּ
  choice: darin
  rationale: Das feminine Suffix bezieht sich auf das zuvor erwähnte Land. »Darin« ist im Deutschen natürlich und vermeidet eine unnötige Personifizierung.
- source_word: וַיִּבְנוּ
  choice: sie bauten
  rationale: Die schlichte Wiedergabe entspricht der gewöhnlichen Bedeutung von בנה und dem erzählenden Stil.
- source_word: לְךָ
  choice: dir
  rationale: Der Dativ gibt die Widmung und Bestimmung für Gott im Deutschen knapp und idiomatisch wieder.
- source_word: מִקְדָּשׁ
  choice: ein Heiligtum
  rationale: »Heiligtum« bewahrt den sakralen Sinn des Ausdrucks, ohne ihn stärker als der hebräische Wortlaut auf den institutionellen Begriff »Tempel« festzulegen.
- source_word: לְשִׁמְךָ
  choice: für deinen Namen
  rationale: Die Formulierung bewahrt die biblische Rede von Gottes Namen als Ausdruck seiner offenbarten Gegenwart und Ehre. »In deinem Namen« würde dagegen eher Bevollmächtigung ausdrücken.
- source_word: לֵאמֹר
  choice: 'Sie sagten:'
  rationale: Der Ausdruck leitet den Inhalt der Aussage im folgenden Vers ein. Ein Doppelpunkt stellt diese Verbindung in natürlichem modernem Deutsch her.
theological_decisions:
- issue: Bedeutung von »ein Heiligtum für deinen Namen«
  choice: Ein Gott geweihtes Heiligtum, das mit seinem Namen, seiner offenbarten Gegenwart und seiner Ehre verbunden ist
  alternative: Ein Tempel, in dem Gott räumlich wohnt; oder lediglich ein Bauwerk zu Gottes Ansehen
  rationale: 'Die direkte Formulierung bewahrt die alttestamentliche Spannung: Das Heiligtum ist Gottes Namen geweiht und mit seiner Gegenwart verbunden, ohne zu behaupten, Gott sei räumlich darin eingeschlossen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »darin« folgt der hebräischen Struktur und macht den Bezug auf das Land deutlich. Die Fußnotenmarker wurden den jeweils erklärten Ausdrücken zugeordnet.
