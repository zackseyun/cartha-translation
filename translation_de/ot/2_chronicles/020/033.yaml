reference: 2 Chronicles 20:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: de
  text: Doch die Kulthöhen wurden nicht beseitigt, und das Volk hatte sein Herz noch nicht auf den Gott seiner Vorfahren ausgerichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte sein Herz noch nicht für den Gott seiner Vorfahren bereitgemacht.“'
    reason: Das hebräische הֵכִינוּ לְבָבָם kann sowohl das Ausrichten beziehungsweise Festmachen des Herzens als auch dessen Vorbereitung bezeichnen.
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den Gegensatz zwischen der zuvor positiven Beurteilung Joschafats und dem verbleibenden Mangel.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: Bezeichnet die erhöhten Kultstätten und ist im Deutschen verständlicher als das bloße „Höhen“, ohne pauschal über ihre jeweilige Rechtmäßigkeit zu entscheiden.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: Das hebräische Verb lautet wörtlich „wichen nicht“, meint hier aber idiomatisch, dass die Kultstätten bestehen blieben. Die deutsche Passivform gibt den Sinn natürlich wieder.
- source_word: וְעוֹד
  choice: noch nicht
  rationale: Drückt zusammen mit der Verneinung den Fortbestand des ungelösten Zustands aus.
- source_word: הָעָם
  choice: das Volk
  rationale: Gibt das kollektive Substantiv direkt wieder.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: hatte sein Herz noch nicht … ausgerichtet
  rationale: Der Hifil von כון mit „Herz“ kann vorbereiten, festmachen oder ausrichten bedeuten. „Das Herz ausrichten“ bewahrt den Gedanken einer bewussten inneren Hinwendung; der Singular entspricht sowohl dem hebräischen Ausdruck als auch dem deutschen Kollektiv „Volk“.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: auf den Gott seiner Vorfahren
  rationale: „Auf“ bringt die durch ל bezeichnete Ausrichtung zum Ausdruck. „Vorfahren“ ist heute natürlich und schließt die gesamte Ahnengeneration ein, ohne den heilsgeschichtlichen Bezug zu verlieren.
theological_decisions:
- issue: Art des Mangels beim Volk
  choice: Der Vers verbindet eine unvollendete äußere Kultreform mit einer noch fehlenden inneren Ausrichtung auf den Gott der Vorfahren.
  alternative: Das Volk hatte sich innerlich noch nicht für den Gott seiner Vorfahren bereitgemacht.
  rationale: Die Übersetzung bewahrt die Verbindung von äußerem Kultzustand und innerer Herzenshaltung, ohne den Mangel auf Gefühle, bloße Gottesdienstvorbereitung oder eine spätere konfessionelle Kategorie zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ vermittelt den historischen Sinn verständlicher als „Höhen“; „sein Herz“ erhält die kollektive Perspektive des hebräischen Textes. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wendung.
