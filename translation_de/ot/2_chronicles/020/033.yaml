  source_fidelity: Die Übersetzung gibt den adversativen Anschluss von אַךְ („Doch“), das Fortbestehen der Kulthöhen und die weiterhin nicht erfolgte Ausrichtung des Volkes auf den Gott seiner Vorfahren treffend wieder. „wurden nicht beseitigt“ ist eine idiomatische deutsche Wiedergabe der hebräischen Wendung, und „noch nicht“ erfasst die fortdauernde Negation von וְעוֹד ... לֹא.
  naturalness: Modernes, würdiges Standarddeutsch. „Kulthöhen“ und „sein Herz ... auf ... ausrichten“ sind verständlich und dem sachlich-biblischen Register angemessen. Der kollektive Singular „das Volk ... sein Herz“ ist im Kontext gut verständlich.
  terminology: „Kulthöhen“ wahrt den historischen Kultbegriff ohne deren konkrete Bewertung vorwegzunehmen. „der Gott seiner Vorfahren“ gibt אֱלֹהֵי אֲבֹתֵיהֶם angemessen wieder. Die Fußnote bildet die lexikalische Spannweite von הֵכִינוּ לְבָבָם sinnvoll ab, ohne eine Auslegung festzulegen.
