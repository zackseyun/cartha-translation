  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: de
  text: Unser Gott, willst du sie nicht richten? Denn wir haben keine Kraft gegenüber dieser großen Menge, die gegen uns heranzieht. Wir wissen nicht, was wir tun sollen; doch auf dich sind unsere Augen gerichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher beziehungsweise formaler: „denn auf dich sind unsere Augen gerichtet“.'
    reason: Bewahrt die mögliche kausale Wiedergabe von כִּי neben der im Haupttext gewählten adversativen Sinnbeziehung.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Unser Gott
  rationale: Die Gebetsanrede wird ohne das heute gehoben oder altertümlich wirkende „O“ natürlich und unmittelbar wiedergegeben.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: willst du sie nicht richten?
  rationale: שׁפט bezeichnet hier Gottes richterliches Eingreifen gegen die feindlichen Völker. „Richten“ bewahrt sowohl den juristischen Sinn als auch den Gedanken der Abhilfe, ohne ihn auf bloße Bestrafung zu verengen.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: wir haben keine Kraft
  rationale: Die Formulierung gibt das Eingeständnis völliger eigener Unfähigkeit klar wieder; כֹּחַ kann Kraft, Stärke oder Vermögen bezeichnen.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: gegenüber dieser großen Menge
  rationale: „Gegenüber“ bewahrt das Bild des unmittelbaren Konfrontiertseins; „große Menge“ gibt הָמוֹן wieder, ohne ausdrücklich „Heer“ in den Text einzutragen.
- source_word: הַבָּא עָלֵינוּ
  choice: die gegen uns heranzieht
  rationale: Das Partizip beschreibt die gegenwärtig herannahende Bedrohung. „Heranzieht“ ist im militärischen Zusammenhang natürlich, ohne die Menge ausdrücklich als Armee zu bestimmen.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Wir wissen nicht, was wir tun sollen
  rationale: Die schlichte, dringliche Aussage der Ratlosigkeit wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: doch auf dich sind unsere Augen gerichtet
  rationale: Die hebräische Blickmetapher für erwartungsvolle Abhängigkeit bleibt erhalten. „Doch“ verdeutlicht im Deutschen den inhaltlichen Gegensatz zwischen eigener Ratlosigkeit und dem Vertrauen auf Gott.
theological_decisions:
- issue: Beziehung des abschließenden כִּי-Satzes zum vorherigen Eingeständnis der Ratlosigkeit
  choice: Als inhaltlichen Gegensatz mit „doch“ wiedergeben
  alternative: 'Formal-kausal: „denn auf dich sind unsere Augen gerichtet“'
  rationale: כִּי kann „denn/weil“ bedeuten; hier bildet der Satz zugleich den Höhepunkt des Gebets und stellt der eigenen Hilflosigkeit das erwartungsvolle Vertrauen auf Gott gegenüber. Die Hauptfassung macht diesen pragmatischen Gegensatz deutlich, während die Fußnote die formal nähere Möglichkeit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. Die hebräische Metapher der auf Gott gerichteten Augen bleibt bewusst erhalten; militärische Einzelheiten werden nicht über den Wortlaut hinaus präzisiert.
