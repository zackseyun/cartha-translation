source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: de
  text: So kamen sie mit Harfen[a], Leiern und Trompeten nach Jerusalem zum Haus Jahwes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lauten«; die genaue Bauart des mit נְבָלִים bezeichneten antiken Saiteninstruments ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zum Tempel Jahwes«; wörtlich: »zum Haus Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: So kamen sie
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „So kamen sie“ gibt die Ereignisfolge im Deutschen natürlich wieder, ohne das Bewegungsverb unnötig als „betraten“ zu präzisieren.
- source_word: יְרוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Bei einer Bewegung zu einer Stadt wird das zielgerichtete בוא im Deutschen idiomatisch mit „nach Jerusalem kommen“ wiedergegeben.
- source_word: בִּנְבָלִים
  choice: mit Harfen
  rationale: נֵבֶל bezeichnet ein harfen- oder lautenartiges Saiteninstrument. „Harfen“ ist verständlich und traditionell, während die Unsicherheit über die genaue Bauart in einer Fußnote erhalten bleibt.
- source_word: וּבְכִנֹּרוֹת
  choice: Leiern
  rationale: כִּנּוֹר wird gewöhnlich als „Leier“ wiedergegeben. Die eigene Benennung hält es von נֵבֶל als einem anderen Instrumententyp auseinander.
- source_word: וּבַחֲצֹצְרוֹת
  choice: Trompeten
  rationale: חֲצֹצְרָה bezeichnet eine Trompete, besonders ein im Gottesdienst verwendetes Blasinstrument. „Silber“ wird nicht ergänzt, da es in diesem Vers nicht ausdrücklich steht.
- source_word: אֶל בֵּית יְהוָה
  choice: zum Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus Jahwes“ und drückt mit „zum“ das Ziel der Bewegung aus. „Tempel Jahwes“ ist kontextuell zutreffend, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ würde stattdessen einen Titel verwenden.
- issue: Wiedergabe von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus Jahwes“ entspricht der konkreten hebräischen Formulierung. Dass damit der Tempel gemeint ist, ergibt sich aus dem Zusammenhang, wird aber nicht stillschweigend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt zunächst die musikalische Begleitung und danach das Ziel heraus. Die beiden unterschiedlichen hebräischen Saiteninstrumente werden terminologisch auseinandergehalten; genuine instrumentenkundliche Unsicherheit wird in der Fußnote offengelegt.
