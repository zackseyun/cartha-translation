  terminology: „Joschafat“, „Ahasja“, „König von Juda“ und „König von Israel“ entsprechen dem geläufigen deutschen Bibelgebrauch. „Böses tun“ gibt die moralische Wertung von הרשיע angemessen wieder, ohne sie konfessionell einzuengen.
