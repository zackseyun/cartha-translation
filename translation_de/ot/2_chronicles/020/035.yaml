source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: de
  text: Danach verbündete sich Joschafat, der König von Juda, mit Ahasja, dem König von Israel. Dieser tat Böses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Pronomen kann auch auf Joschafat bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und natürlich wieder.
- source_word: אֶתְחַבַּר
  choice: verbündete sich
  rationale: Der Hitpael von חבר bezeichnet hier das Eingehen einer Verbindung; im königlichen Kontext trifft „sich verbünden“ den politischen Sinn.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Im modernen deutschen Bibelgebrauch geläufige Umschrift des Personennamens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: der König von Juda
  rationale: Natürliche und direkte Wiedergabe des hebräischen Königstitels.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: mit Ahasja, dem König von Israel
  rationale: Gibt Präpositionalfügung und nachgestellten Königstitel klar wieder.
- source_word: הוּא
  choice: Dieser
  rationale: Nimmt in der Hauptlesart den unmittelbar zuvor genannten Ahasja auf, ohne die bestehende Bezugsmöglichkeit auf Joschafat zu verschweigen; diese wird in der Fußnote genannt.
- source_word: הִרְשִׁיעַ
  choice: handelte … gottlos
  rationale: Bewahrt die starke moralisch-religiöse Wertung des Hiphil von רשע und klingt im Deutschen würdig und verständlich.
- source_word: לַעֲשׂוֹת
  choice: dabei
  rationale: Die knappe Infinitivfügung wird idiomatisch auf das soeben genannte Handeln beziehungsweise Bündnis bezogen, ohne ein nicht ausdrücklich genanntes Objekt einzuführen.
theological_decisions:
- issue: Bezug des Pronomens הוּא
  choice: „Dieser“ bezieht sich im Haupttext auf Ahasja.
  alternative: Das Pronomen kann auf Joschafat bezogen werden, sodass dessen Bündnis als gottlos beurteilt wird.
  rationale: Ahasja ist der unmittelbar vorausgehende mögliche Bezugspunkt. Da beide Könige grammatisch und sachlich als Bezug infrage kommen und der hebräische Satz dies nicht eindeutig entscheidet, wird die andere Lesart ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Appositionen werden zur besseren Lesbarkeit durch Kommas abgesetzt; die echte Mehrdeutigkeit des Pronomens bleibt durch die Fußnote erhalten.
