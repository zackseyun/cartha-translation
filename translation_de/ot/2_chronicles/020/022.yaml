  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: de
  text: Und als sie mit Jubelgesang und Lobpreis begannen, legte Jahwe Hinterhalte[a] gegen die Ammoniter, Moab und das Gebirge Seïr, die gegen Juda heranzogen[b], und sie wurden geschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ Leute im Hinterhalt aufstellen“. Das hebräische Wort kann Personen bezeichnen, die im Hinterhalt liegen; die genaue Art der Hinterhalte wird im Text nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „die nach Juda heranzogen“. Im Zusammenhang ist die Bewegung feindlich gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: Und als sie … begannen
  rationale: Die temporale Konstruktion bezeichnet den Zeitpunkt, an dem Jahwes Eingreifen einsetzt. Im Deutschen gibt „als“ dies natürlich wieder; das einleitende וּ bleibt durch „Und“ erhalten.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: mit Jubelgesang und Lobpreis
  rationale: רִנָּה kann einen Jubelruf oder freudigen Gesang bezeichnen. „Jubelgesang“ bewahrt beide Aspekte, während „Lobpreis“ תְהִלָּה im gottesdienstlichen Zusammenhang angemessen wiedergibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: נָתַן … מְאָרְבִים
  choice: legte … Hinterhalte
  rationale: Die Verbindung von נתן mit מְאָרְבִים bezeichnet das Einrichten beziehungsweise Bereitstellen von Hinterhalten. Die Form מְאָרְבִים kann zugleich konkret die im Hinterhalt Liegenden meinen; diese Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: die Ammoniter, die Moabiter und die Bewohner des Gebirges Seïr
  rationale: „Söhne Ammons“ wird idiomatisch als „Ammoniter“ wiedergegeben. Da im Zusammenhang Heere beziehungsweise Völker betroffen sind, werden auch Moab und das Gebirge Seïr als Bezeichnungen ihrer Bewohner verstanden.
- source_word: הַבָּאִים לִיהוּדָה
  choice: die gegen Juda heranzogen
  rationale: Die Präposition ל kann rein räumlich „nach/zu“ bedeuten; der militärische Zusammenhang zeigt hier jedoch eine feindliche Bewegung an. „Heranzogen“ passt zum Aufmarsch eines Heeres.
- source_word: וַיִּנָּגֵפוּ
  choice: und sie wurden geschlagen
  rationale: Das Nifal von נגף bezeichnet, dass sie einen Schlag erlitten beziehungsweise besiegt wurden. Die passive Form bleibt erhalten, ohne ausdrücklich zu behaupten, dass alle getötet wurden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname bewahrt diese Besonderheit, statt sie durch einen Titel zu ersetzen.
- issue: Urheberschaft und Art der Hinterhalte
  choice: Jahwe legte Hinterhalte
  alternative: Jahwe ließ Männer aus dem Hinterhalt angreifen
  rationale: Der Text schreibt das Geschehen unmittelbar Jahwe zu, benennt aber die Identität der im Hinterhalt Liegenden nicht eindeutig. Die Übersetzung vermeidet es deshalb, menschliche oder übernatürliche Akteure festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jubelgesang“ und „Lobpreis“ passen zum gottesdienstlichen Zusammenhang, während „heranzogen“ den militärischen Rahmen erkennen lässt. Die Satzstruktur bleibt nahe am hebräischen Erzählfluss, ohne unnötig altertümlich zu wirken.
