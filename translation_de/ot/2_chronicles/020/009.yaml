source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: de
  text: Wenn Unglück über uns kommt – Schwert, Strafgericht[a], Pest oder Hungersnot –, dann werden wir vor diesem Haus und vor dir stehen; denn dein Name ist in diesem Haus[b]. Wir werden in unserer Not zu dir schreien, und du wirst uns hören und retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche hebräische Wortverbindung kann auch als „das Schwert des Gerichts“ verstanden werden.
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: „Denn dein Name ist über diesem Haus“, das heißt: Dieses Haus trägt deinen Namen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: Unglück
  rationale: Das Wort bezeichnet hier eine schädliche Katastrophe, nicht moralisch Böses. „Unglück“ leitet die folgenden konkreten Formen der Not natürlich ein.
- source_word: חֶרֶב שְׁפוֹט
  choice: Schwert, Strafgericht
  rationale: Die beiden Ausdrücke werden als Glieder der Aufzählung verstanden. „Strafgericht“ verdeutlicht den Unheilscharakter von שְׁפוֹט, ohne die mögliche Verbindung der Wörter zu verschweigen; diese wird in der Fußnote genannt.
- source_word: דֶבֶר
  choice: Pest
  rationale: „Pest“ ist im Deutschen die geläufige, prägnante Bezeichnung für eine epidemische Heimsuchung in diesem Kontext.
- source_word: רָעָב
  choice: Hungersnot
  rationale: Gemeint ist eine umfassende Versorgungskrise, nicht nur persönlicher Hunger.
- source_word: נַעַמְדָה
  choice: dann werden wir … treten
  rationale: Der Kohortativ erhält im Bedingungssatz Zukunfts- und Entschlossenheitscharakter. „Treten“ klingt mit „vor“ im Deutschen natürlicher als „stehen“ und bewahrt den Gedanken des Erscheinens vor Haus und Gott.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה וּלְפָנֶיךָ
  choice: vor dieses Haus und vor dich
  rationale: 'Die Parallelität wird erhalten: Das Volk tritt beim Heiligtum zugleich vor Gott. „Haus“ gibt הַבַּיִת unmittelbar wieder, ohne es erklärend durch „Tempel“ zu ersetzen.'
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: denn dein Name ist in diesem Haus
  rationale: Die hebräische Namensformel bleibt bewusst stehen und wird nicht auf nur eine Aussage über Gegenwart, Eigentum oder Benennung festgelegt.
- source_word: וְנִזְעַק אֵלֶיךָ מִצָּרָתֵנוּ
  choice: Wir werden in unserer Not zu dir schreien
  rationale: „Schreien“ vermittelt die Dringlichkeit des Hilferufs. Das hebräische מִן bezeichnet hier den Ausgangspunkt beziehungsweise die Lage, aus der gerufen wird; idiomatisch deutsch ist „in unserer Not“.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: und du wirst uns hören und retten
  rationale: Beide Verben bleiben gesondert und direkt. Das im Deutschen ergänzte „uns“ macht das Objekt von „retten“ eindeutig, ohne den Sinn einzuengen.
theological_decisions:
- issue: Die Namensgegenwart Gottes im Heiligtum
  choice: Die Formulierung „dein Name ist in diesem Haus“ bleibt im Haupttext erhalten.
  alternative: „Dein Name ist über diesem Haus ausgerufen“ oder „dieses Haus trägt deinen Namen“.
  rationale: Die wörtlich nahe Form wahrt die theologische Spannung zwischen Gottes Gegenwart, seinem Anspruch auf das Heiligtum und dessen Benennung, ohne diese Aspekte gleichzusetzen.
- issue: Verhältnis von Schwert und Gericht in חֶרֶב שְׁפוֹט
  choice: „Schwert, Strafgericht“ als zwei eng aufeinanderfolgende Unheilsbegriffe.
  alternative: „das Schwert des Gerichts“ beziehungsweise „ein richtendes Schwert“.
  rationale: Die ungewöhnliche hebräische Fügung lässt unterschiedliche syntaktische Deutungen zu. Der Haupttext folgt der Aufzählungsdeutung, während die Fußnote die mögliche Wortverbindung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber dem langen hebräischen Satz leicht gegliedert, damit der Vers mündlich wie schriftlich verständlich bleibt. „Haus“, „Name“ und „retten“ bewahren den biblisch-theologischen Wortlaut, ohne altertümlich zu wirken.
