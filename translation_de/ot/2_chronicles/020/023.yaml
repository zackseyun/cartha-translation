base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: de
  text: Da erhoben sich die Ammoniter und Moabiter gegen die Bewohner des Berglands Seïr, um sie dem Untergang zu weihen[a] und vollständig zu vernichten. Als sie mit den Bewohnern Seïrs fertig waren, half einer dem anderen bei ihrer gegenseitigen Vernichtung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie mit dem Bann belegen“; gemeint ist, sie zur Vernichtung zu weihen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... עַל
  choice: Da erhoben sich ... gegen
  rationale: עמד mit עַל bezeichnet hier im militärischen Zusammenhang ein feindliches Vorgehen. „Sich gegen jemanden erheben“ ist im Deutschen natürlich und bewahrt diese adversative Bedeutung.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: die Ammoniter und Moabiter
  rationale: Die deutschen Volksbezeichnungen geben die kollektiv gemeinten „Söhne Ammons“ und „Moab“ verständlich und idiomatisch wieder.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: die Bewohner des Berglands Seïr
  rationale: הַר kann einen Berg oder ein Bergland bezeichnen. Im Zusammenhang mit den Bewohnern Seïrs ist „Bergland Seïr“ eine natürliche geografische Wiedergabe.
- source_word: לְהַחֲרִים
  choice: sie dem Untergang zu weihen
  rationale: חרם im Hifil bezeichnet das Vollstrecken des Banns, also die unwiderrufliche Aussonderung zur Vernichtung. Die Formulierung bewahrt sowohl den kultisch-theologischen Gehalt als auch die tödliche Folge.
- source_word: וּלְהַשְׁמִיד
  choice: und vollständig zu vernichten
  rationale: שׁמד bezeichnet umfassende Vernichtung. „Vollständig vernichten“ unterscheidet den Ausdruck vom vorausgehenden חרם und gibt seine Intensität wieder.
- source_word: וּכְכַלּוֹתָם
  choice: Als sie ... fertig waren
  rationale: כ mit dem Infinitivus constructus ist temporal zu verstehen. Die Formulierung stellt den Abschluss der ersten Vernichtung vor dem folgenden gegenseitigen Angriff dar.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ לְמַשְׁחִית
  choice: halfen sie einander, sich gegenseitig zu vernichten
  rationale: Die distributive Wendung „einer seinem Nächsten“ drückt wechselseitiges Handeln aus. Der Kontext legt nahe, dass die verbündeten Gruppen nun gegeneinander vorgingen; „sich gegenseitig“ macht das im Deutschen erforderliche Objekt deutlich.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם im Kriegskontext
  choice: dem Untergang weihen
  alternative: mit dem Bann belegen / dem Bann zur Vernichtung übergeben
  rationale: Der Ausdruck meint mehr als gewöhnliches Töten und trägt den Gedanken einer unwiderruflichen, religiös bestimmten Aussonderung zur Vernichtung. „Dem Untergang weihen“ erhält diese Spannung in verständlichem Deutsch; die formalere Bannterminologie steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die starke Vernichtungssprache des hebräischen Textes wird nicht abgeschwächt; zugleich erklärt die Fußnote den kultisch geprägten Begriff חרם ohne konfessionelle Zusatzdeutung.
