source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: de
  text: Joschafat herrschte über Juda. Er war fünfunddreißig Jahre alt, als er König wurde, und regierte fünfundzwanzig Jahre in Jerusalem. Seine Mutter hieß Asuba; sie war eine Tochter Schilhis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: herrschte
  rationale: Das Verb מלך eröffnet die Königsnotiz. „Herrschte“ gibt die Ausübung der Königsherrschaft natürlich und präzise wieder, während בְּמָלְכוֹ anschließend eigens den Regierungsantritt bezeichnet.
- source_word: עַל יְהוּדָה
  choice: über Juda
  rationale: Bei מלך bezeichnet עַל gewöhnlich das beherrschte Reich oder Volk; „über Juda“ entspricht dieser Konstruktion.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: fünfunddreißig Jahre alt
  rationale: Die hebräische Altersformel wird im modernen Deutschen idiomatisch mit „Jahre alt“ wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: ב mit dem Infinitiv constructus und Suffix bezeichnet hier den Zeitpunkt des Regierungsantritts. „Als er König wurde“ ist klar und natürlich.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: regierte fünfundzwanzig Jahre
  rationale: Die Dauerangabe mit מלך wird im Deutschen idiomatisch mit „regierte“ ausgedrückt.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Die Ortsangabe bezeichnet in der üblichen Königsformel den Regierungssitz.
- source_word: וְשֵׁם אִמּוֹ עֲזוּבָה
  choice: Seine Mutter hieß Asuba
  rationale: Diese natürliche deutsche Namensformel gibt den Sinn vollständig wieder, ohne die hebräische Wortstellung unnötig nachzuahmen.
- source_word: בַּת שִׁלְחִי
  choice: sie war eine Tochter Schilhis
  rationale: בַּת bezeichnet die Abstammungsbeziehung. Der eigene Satzteil vermeidet im Deutschen die mögliche Fehllektüre, Asuba sei selbst der Name „Tochter Schilhis“.
