  source_fidelity: 'Die Übersetzung gibt die Abfolge und die beiden unterschiedlichen Verben angemessen wieder: Joschafat verneigt sich mit dem Gesicht zur Erde; Juda und die Einwohner Jerusalems werfen sich vor Jahwe nieder. Die abschließende Infinitivkonstruktion drückt den Zweck der Handlung zutreffend aus. Die zweimalige Nennung des Gottesnamens entspricht dem Hebräischen.'
