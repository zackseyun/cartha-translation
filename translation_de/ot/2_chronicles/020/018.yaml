source:
  edition: WLC
  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: de
  text: Da verneigte sich Joschafat mit dem Gesicht zur Erde, und ganz Juda und die Bewohner Jerusalems warfen sich vor Jahwe nieder, um Jahwe anzubeten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: Da verneigte sich
  rationale: קָדַד bezeichnet ein ehrfürchtiges Sichbeugen oder Verneigen. „Verneigte sich“ gibt die konkrete Geste natürlich wieder, ohne Knien ausdrücklich vorauszusetzen.
- source_word: אַפַּיִם אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die Wendung beschreibt eine tiefe Verneigung bis zum Boden. Die gewählte Formulierung bewahrt das Körperbild des Hebräischen und klingt im Deutschen würdevoll.
- source_word: וְכָל יְהוּדָה
  choice: ganz Juda
  rationale: „Juda“ steht metonymisch für die Gemeinschaft des Landes beziehungsweise Volkes. „Ganz Juda“ erhält diese knappe kollektive Ausdrucksweise.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die in Jerusalem wohnen. „Bewohner Jerusalems“ ist präzise und modern.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: warfen sich vor Jahwe nieder
  rationale: נפל bedeutet wörtlich „fallen“, bezeichnet hier aber im Zusammenhang der Verehrung ein bewusstes Niederwerfen. Die deutsche reflexive Wendung macht die Handlung natürlich verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: um ... anzubeten
  rationale: Der Hitpael von שׁחה kann das Sichniederwerfen zur Verehrung bezeichnen. Da die Körperbewegung bereits genannt ist, bringt „anzubeten“ ihren Zweck klar zum Ausdruck.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Wiederholung des Gottesnamens im hebräischen Text bleibt erhalten, statt durch ein Pronomen ersetzt zu werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet zweimal ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen und erhält seine Wiederholung.
- issue: Verhältnis von Körperhaltung und Anbetung
  choice: „warfen sich ... nieder, um ... anzubeten“
  alternative: „fielen ... nieder, um sich ... niederzuwerfen“
  rationale: Die Übersetzung unterscheidet die sichtbare Handlung von ihrem religiösen Zweck, ohne die im Text eng verbundene körperliche und kultische Dimension voneinander zu lösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, während „warfen sich nieder“ die kultische Handlung idiomatisch ausdrückt. Die Wiederholung „Jahwe ... Jahwe“ wurde bewusst beibehalten.
