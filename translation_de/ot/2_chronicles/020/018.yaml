  terminology: „Joschafat“, „Juda“, „Bewohner Jerusalems“ und „Jahwe“ sind sachgerecht. „Jahwe“ bewahrt den Gottesnamen und seine Wiederholung. „Anbeten“ ist für להשתחוות in diesem kultischen Kontext eine passende, nicht überdeutende Wiedergabe.
