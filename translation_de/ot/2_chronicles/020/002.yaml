base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: de
  text: 'Da kamen Leute und berichteten Joschafat: »Eine große Menge zieht gegen dich heran, von jenseits des Meeres, aus Aram.[a] Nun sind sie in Hazezon-Tamar, das ist En-Gedi.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Aram. Wegen des südlichen Schauplatzes und des Zusammenhangs wird mitunter Edom vermutet; diese Lesart beruht jedoch auf einer Textkorrektur.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: Da kamen Leute und berichteten
  rationale: Die aufeinanderfolgenden Wayyiqtol-Formen führen die Erzählung weiter. Das unbestimmte Subjekt wird im Deutschen natürlich mit „Leute“ wiedergegeben; „berichteten“ entspricht dem Hifil von נגד im Zusammenhang einer dringenden Nachricht an den König.
- source_word: בָּא
  choice: zieht … heran
  rationale: Das Qatal bezeichnet hier bei kollektivem Subjekt eine bereits eingesetzte, unmittelbar drohende Bewegung. „Zieht … heran“ gibt dies im Deutschen idiomatisch wieder.
- source_word: הָמוֹן רָב
  choice: eine große Menge
  rationale: הָמוֹן bezeichnet eine große Menschenmenge oder Schar. „Menge“ bewahrt die Breite des Ausdrucks, ohne ihn ausdrücklich als reguläres Heer festzulegen.
- source_word: עָלֶיךָ
  choice: gegen dich
  rationale: Die Präposition על bezeichnet im militärisch-feindlichen Zusammenhang die gegen Joschafat gerichtete Bewegung.
- source_word: מֵעֵבֶר לַיָּם
  choice: von jenseits des Meeres
  rationale: Die räumliche Wendung wird eng am Hebräischen und zugleich verständlich wiedergegeben; welches Meer gemeint ist, wird im Text nicht ausdrücklich benannt.
- source_word: מֵאֲרָם
  choice: aus Aram
  rationale: Der masoretische Text nennt ausdrücklich Aram. Die geografische Spannung zum Kontext wird nicht stillschweigend durch eine Konjektur zu „Edom“ beseitigt, sondern in einer Fußnote kenntlich gemacht.
- source_word: וְהִנָּם
  choice: Sie sind schon
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die gegenwärtige Lage. Das natürliche deutsche „schon“ vermittelt hier die Dringlichkeit besser als das altertümliche „siehe“.
- source_word: בְּחַצְצוֹן תָּמָר הִיא עֵין גֶּדִי
  choice: in Hazezon-Tamar, das ist En-Gedi
  rationale: Die Ortsnamen werden transliteriert; „das ist“ gibt die erklärende Identifikation des ersten Ortes mit En-Gedi klar wieder.
theological_decisions: []
