  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt knapp und dringlich. Ortsnamen folgen einer hebraisch orientierten Transkription; die geografisch-textkritische Schwierigkeit bei „Aram“ wird transparent bewahrt.
