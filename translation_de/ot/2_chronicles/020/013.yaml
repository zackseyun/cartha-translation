  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: de
  text: Und ganz Juda stand vor Jahwe – auch ihre kleinen Kinder, ihre Frauen und ihre Söhne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Kinder“. Das hebräische Wort kann je nach Zusammenhang speziell „Söhne“ oder allgemeiner „Kinder“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Und ganz
  rationale: וְ verbindet den Vers mit dem vorausgehenden Bericht; כָל bezeichnet die Gesamtheit. „Und ganz“ bewahrt beides knapp und natürlich.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname steht hier kollektiv für die versammelte Bevölkerung Judas.
- source_word: עֹמְדִים
  choice: stand
  rationale: Das Partizip beschreibt den andauernden Zustand des Versammeltseins. Das deutsche Präteritum ist im Erzählzusammenhang natürlich; beim kollektiven Subjekt „ganz Juda“ steht der Singular.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Wendung bezeichnet das Stehen in jemandes Gegenwart; „vor“ ist die knappe, feierliche Standardentsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: גַּם
  choice: auch
  rationale: גַּם hebt hervor, dass die anschließend genannten Angehörigen ebenfalls anwesend waren.
- source_word: טַּפָּם
  choice: ihre kleinen Kinder
  rationale: טַף bezeichnet die abhängigen kleinen Kinder einer Gemeinschaft oder Familie; „kleine Kinder“ ist im heutigen Deutsch klarer als „die Kleinen“.
- source_word: נְשֵׁיהֶם
  choice: ihre Frauen
  rationale: Im familiären Zusammenhang sind die Ehefrauen gemeint. „Ihre Frauen“ ist eine natürliche deutsche Wiedergabe, ohne das Possessivverhältnis abzuschwächen.
- source_word: וּבְנֵיהֶם
  choice: und ihre Söhne
  rationale: בנים bedeutet zunächst „Söhne“, kann aber je nach Zusammenhang auch „Kinder“ bezeichnen. Da טַף bereits die kleinen Kinder nennt, wird die konkretere Bedeutung im Haupttext bewahrt und die breitere Möglichkeit in einer Fußnote angegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בְנֵיהֶם
  choice: ihre Söhne
  alternative: ihre Kinder
  rationale: Die konkretere lexikalische Bedeutung bleibt im Haupttext erhalten; zugleich wird die mögliche allgemeinere Bedeutung nicht ausgeschlossen, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die umfassende Anwesenheit der Familien hervor. Das kollektive „ganz Juda“ wird mit einem Verb im Singular verbunden.
