base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: de
  text: Und er verbündete sich mit ihm, um Schiffe für die Fahrt nach Tarschisch zu bauen[a]. Sie bauten Schiffe in Ezjon-Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Schiffe zu bauen, die nach Tarschisch fahren“. Manche verstehen die Verbindung mit Tarschisch in Zusammenhängen der Schifffahrt allgemeiner als Bezeichnung eines Schiffstyps oder einer Fernhandelsfahrt; hier bezeichnet der hebräische Wortlaut am ehesten das Reiseziel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ
  choice: verbündete er sich mit ihm
  rationale: Der Hifil von חבר bezeichnet hier das Eingehen einer Verbindung oder Partnerschaft. „Sich verbünden“ gibt die politische und wirtschaftliche Zusammenarbeit im Kontext natürlich wieder.
- source_word: לַעֲשׂוֹת
  choice: zu bauen
  rationale: עשה bedeutet allgemein „machen“; bei Schiffen ist im Deutschen „bauen“ die natürliche und sachlich genaue Verbindung.
- source_word: אֳנִיּוֹת
  choice: Schiffe
  rationale: Das Substantiv bezeichnet seetüchtige Schiffe und passt zum Zusammenhang einer Handelsfahrt.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: die nach Tarschisch fahren sollten
  rationale: Die Konstruktion bezeichnet am natürlichsten das Ziel der Fahrt. Der deutsche Relativsatz macht deutlich, dass dies der Zweck der zu bauenden Schiffe war.
- source_word: תַּרְשִׁישׁ
  choice: Tarschisch
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַיַּעֲשׂוּ
  choice: Sie bauten
  rationale: Der Plural beschreibt das gemeinsame Handeln der beiden Partner; „bauten“ ist bei Schiffen idiomatischer als „machten“.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: in Ezjon-Geber
  rationale: ב bezeichnet hier den Ort des Schiffbaus. „In“ ist bei einem Ortsnamen im Deutschen natürlich.
