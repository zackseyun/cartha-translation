translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verbündete“ bewahrt den Charakter einer förmlichen Verbindung; „Schiffe bauen“ ist im Deutschen natürlicher als die formal nähere Wiedergabe „Schiffe machen“. Die Wiederholung von „Schiffe“ folgt der klaren Erzählweise des Hebräischen.
