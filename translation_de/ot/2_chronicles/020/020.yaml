  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: de
  text: 'Am frühen Morgen machten sie sich auf und zogen in die Wüste von Tekoa. Als sie auszogen, stellte sich Joschafat hin und sagte: »Hört mich an, Juda und ihr Bewohner Jerusalems! Glaubt an Jahwe[c], euren Gott, dann werdet ihr festen Bestand haben[a]. Glaubt seinen Propheten[b], dann wird es euch gelingen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht ein Wortspiel mit אמן: »Glaubt … dann werdet ihr festen Bestand haben.« Möglich ist auch: »Vertraut auf Jahwe, euren Gott, dann werdet ihr feststehen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Vertraut seinen Propheten.« Dasselbe hebräische Verb wie in »Glaubt an Jahwe« wird zur rhetorischen Verstärkung wiederholt.'
    reason: lexical_alternative
  - marker: c
    text: »Jahwe« gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit »der HERR« wiedergegeben wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Am frühen Morgen machten sie sich auf
  rationale: Die Hifil-Form von שׁכם bezeichnet das frühe Aufstehen beziehungsweise Aufbrechen. Die deutsche Formulierung verbindet Zeitangabe und Reisebeginn natürlich.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: in die Wüste von Tekoa
  rationale: מִדְבָּר bezeichnet hier das unbesiedelte, trockene Gebiet bei Tekoa, nicht zwingend eine Sandwüste. »Wüste« ist die geläufige geografische Wiedergabe.
- source_word: וּבְצֵאתָם
  choice: Als sie auszogen
  rationale: Die Präposition mit Infinitivus constructus und Suffix bildet einen temporalen Nebensatz. »Als sie auszogen« gibt diesen knapp und idiomatisch wieder.
- source_word: עָמַד
  choice: trat Joschafat vor
  rationale: Wörtlich heißt עמד »stand« beziehungsweise »stellte sich hin«. Im Zusammenhang einer öffentlichen Ansprache drückt »trat vor« die erkennbare Funktion der Handlung in natürlichem Deutsch aus, ohne sie auszuschmücken.
- source_word: שְׁמָעוּנִי
  choice: Hört mich an
  rationale: Der Imperativ von שמע mit Objektsuffix ist ein unmittelbarer Aufruf zum Zuhören. »Hört mich an« wahrt den würdevollen öffentlichen Ton.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: Juda und ihr Bewohner Jerusalems
  rationale: Juda wird kollektiv angeredet; die ergänzte Anredepartikel »ihr« macht die koordinierte deutsche Anrede klar und flüssig.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Glaubt an Jahwe, euren Gott
  rationale: Das Hifil von אמן mit ב bezeichnet gläubiges Vertrauen. »Glaubt an« bewahrt zugleich die Wiederholung desselben hebräischen Verbs in der folgenden Aufforderung.
- source_word: וְתֵאָמֵנוּ
  choice: dann werdet ihr festen Bestand haben
  rationale: Das Nifal von אמן bezeichnet Festigkeit oder Beständigkeit und bildet ein Wortspiel mit הַאֲמִינוּ. »Festen Bestand haben« gibt die Folge verständlich wieder und erhält das Motiv der Festigkeit.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: Glaubt seinen Propheten
  rationale: Dasselbe Verb אמן wird rhetorisch wiederholt. Die knappe Konstruktion bewahrt diese Wiederholung; gemeint ist, den prophetischen Worten Vertrauen zu schenken.
- source_word: וְהַצְלִיחוּ
  choice: dann wird es euch gelingen
  rationale: Das Hifil von צלח kann Erfolg beziehungsweise Gelingen bezeichnen. Die unpersönliche deutsche Wendung ist natürlich und lässt den genauen Umfang des verheißenen Erfolgs offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« gibt ihn in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung und Wortspiel von אמן
  choice: Glaubt … dann werdet ihr festen Bestand haben; glaubt …
  alternative: Vertraut … dann werdet ihr feststehen; vertraut …
  rationale: Die gewählte Fassung bewahrt die zweimalige Aufforderung mit demselben Verb und lässt zugleich in der Folgeaussage das hebräische Motiv von Festigkeit erkennen. Sie legt »Glauben« nicht auf eine spätere dogmatische Fachbedeutung fest.
- issue: Verhältnis zu den Propheten
  choice: Glaubt seinen Propheten
  alternative: Vertraut seinen Propheten
  rationale: Die Formulierung folgt der Wiederholung von אמן und meint im Kontext Vertrauen in die durch die Propheten übermittelte Botschaft, ohne den Propheten eine von Gott unabhängige Autorität zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer öffentlicher Anrede. Die Erzählung bleibt knapp; das hebräische Wortspiel und die semantische Spannung zwischen Glauben, Vertrauen und Festigkeit werden im Text und in den Fußnoten sichtbar gehalten.
