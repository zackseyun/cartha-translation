source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: de
  text: 'und sagte: »Yahweh, Gott unserer Väter[a], bist nicht du Gott im Himmel, und herrschst du nicht über alle Königreiche der Völker? In deiner Hand sind Kraft und Macht, und niemand kann dir standhalten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott unserer Vorfahren«. Wörtlich steht im Hebräischen: »Gott unserer Väter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und niemand kann sich dir entgegenstellen« beziehungsweise »gegen dich bestehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Verbform führt die Erzählung fort; das Subjekt ist aus dem Zusammenhang erschließbar und muss im Deutschen hier nicht wiederholt werden.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Gott unserer Väter
  rationale: Bewahrt die konkrete maskuline Bezeichnung und den traditionellen bundesgeschichtlichen Ausdruck; »Vorfahren« bleibt als verständliche Alternative vermerkt.
- source_word: הֲלֹא אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: bist nicht du Gott im Himmel?
  rationale: Die Formulierung erhält die rhetorische Frage, die Zustimmung erwartet, und gibt das betonte Pronomen durch »du« wieder.
- source_word: מוֹשֵׁל
  choice: herrschst
  rationale: Das Partizip bezeichnet Yahwehs fortdauernde souveräne Herrschaft; das deutsche Präsens gibt dies natürlich wieder.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: die Königreiche der Völker
  rationale: Gibt beide Nomina unmittelbar wieder; »Völker« ist in diesem Kontext idiomatisch und vermeidet eine unnötige moderne politische Engführung von גּוֹיִם.
- source_word: וּבְיָדְךָ
  choice: In deiner Hand
  rationale: Bewahrt das anschauliche hebräische Bild für Gottes wirksame Verfügungsgewalt.
- source_word: כֹּחַ וּגְבוּרָה
  choice: Kraft und Macht
  rationale: Das Wortpaar bezeichnet Fähigkeit beziehungsweise Stärke und machtvolle Durchsetzung; die deutsche Paarformel ist klar und würdevoll.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: und niemand kann dir standhalten
  rationale: Im Zusammenhang bezeichnet התיצב das widerstehende Antreten gegen Gott. »Standhalten« ist im modernen Deutsch prägnant und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Quelltext nennt das Tetragramm ausdrücklich. Die Transliteration wahrt den Charakter als offenbarter Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Bundessprache in אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: »Väter« entspricht der maskulinen Pluralform des Hebräischen und bewahrt die überlieferte bundesgeschichtliche Wendung; die inhaltlich mögliche allgemeinere Wiedergabe wird in der Fußnote genannt.
- issue: Reichweite der rhetorischen Frage הֲלֹא
  choice: Die erste Aussage als rhetorische Frage, die folgende Herrschaftsaussage als bekräftigender Aussagesatz
  alternative: 'Beide Aussagen unter die rhetorische Frage fassen: »… und herrschst du nicht …?«'
  rationale: הֲלֹא leitet sicher eine rhetorische Frage ein; ob ihre Reichweite auch die mit וְאַתָּה beginnende nächste Aussage umfasst, ist syntaktisch nicht völlig eindeutig. Die gewählte Zeichensetzung liest den zweiten Satz als parallele Bekräftigung, ohne seinen Aussagegehalt zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt feierlich, aber gut verständlich. Das hebräische Bild »in deiner Hand« wird nicht abstrahiert. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Formulierung.
