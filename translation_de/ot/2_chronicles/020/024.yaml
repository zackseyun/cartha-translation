  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: de
  text: 'Als Juda zu dem Aussichtspunkt über der Wüste kam, wandten sie sich der Menge zu. Und siehe: Da lagen Leichen am Boden[a], und keiner war entkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Leichen, zur Erde gefallen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  choice: Juda
  rationale: Der Eigenname bezeichnet hier kollektiv das judäische Aufgebot. Die anschließende Mehrzahl im Hebräischen wird auch im Deutschen durch „sie“ bewahrt.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: zu dem Aussichtspunkt über der Wüste
  rationale: מִצְפֶּה bezeichnet einen Beobachtungs- oder Aussichtspunkt; die Präpositionalverbindung beschreibt hier naheliegend einen erhöhten Ort mit Blick über die Wüste.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: wandten sie sich der Menge zu
  rationale: פנה bezeichnet das Sichwenden, während הָמוֹן eine große Menge oder Schar meint. „Menge“ wahrt die Breite des Ausdrucks, ohne ausdrücklich „Heer“ einzutragen.
- source_word: וְהִנָּם
  choice: 'Und siehe: Da lagen'
  rationale: „Und siehe“ erhält das deiktische Überraschungsmoment; „da lagen“ führt im Deutschen natürlich in den vorgefundenen Anblick ein.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: Leichen am Boden
  rationale: פֶּגֶר bedeutet Leiche oder toter Körper. Die Wendung beschreibt wörtlich Leichen, die zur Erde gefallen sind; „am Boden lagen“ gibt den sichtbaren Resultatszustand idiomatisch wieder.
- source_word: וְאֵין פְּלֵיטָה
  choice: und keiner war entkommen
  rationale: פְּלֵיטָה kann die Entronnenen beziehungsweise das Entrinnen bezeichnen. Im Zusammenhang drückt die Klausel aus, dass niemand dem Tod durch Flucht entkommen war.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kollektive „Juda“ mit anschließendem Plural bewahrt den auffälligen Numeruswechsel des hebräischen Textes. „Und siehe“ erhält bewusst den biblisch-narrativen Signalruf, ohne den übrigen Satzbau altertümlich zu gestalten.
