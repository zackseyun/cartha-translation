  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: de
  text: 'Und sieh: So vergelten sie es uns, indem sie kommen, um uns aus deinem Besitz zu vertreiben, den du uns als Erbe gegeben hast.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus deinem Erbe, das du uns hast erben lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung leitet einen nachdrücklichen Hinweis auf die gegenwärtige Lage ein. „Sieh“ ist modern, würdig und bewahrt den auffordernden Diskurswert.
- source_word: הֵם
  choice: sie
  rationale: Das selbstständige Pronomen wird beibehalten und durch die deutsche Satzstellung hervorgehoben; der Vorwurf richtet sich ausdrücklich gegen diese Gegner.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: So vergelten sie es uns
  rationale: גמל bezeichnet hier eine Erwiderung beziehungsweise Vergeltung für früheres Handeln. Die Formulierung gibt den bitteren, ironischen Vorwurf natürlich wieder.
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: Sie kommen, um uns … zu vertreiben
  rationale: Die Infinitive bezeichnen das Kommen und dessen Absicht. Ein eigener deutscher Satz macht die Beziehung klar und bewahrt den Nachdruck.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: aus deinem Besitz
  rationale: יְרֻשָּׁה kann Erbbesitz oder Besitz bezeichnen. „Dein Besitz“ hält fest, dass das Land letztlich Gott gehört, und vermeidet eine schwerfällige Wiederholung von „Erbe“.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: den du uns als Erbe gegeben hast
  rationale: Der Hifil von ירשׁ bedeutet, jemanden in Besitz beziehungsweise Erbe gelangen zu lassen. Die gewählte Formulierung ist idiomatisch und stellt Gottes Gewährung des Landes heraus.
theological_decisions:
- issue: Gottes Eigentum am Land und Israels davon abgeleitetes Erbe
  choice: aus deinem Besitz, den du uns als Erbe gegeben hast
  alternative: aus deinem Erbe, das du uns hast erben lassen
  rationale: Die Übersetzung wahrt sowohl Gottes bleibenden Anspruch auf das Land als auch die Tatsache, dass Israel es von ihm als Erbe empfing. Die lexikalische Mehrdeutigkeit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gebetsregister. Der Ausruf nach „sieh“ und der kurze Folgesatz bewahren die Eindringlichkeit des hebräischen Vorwurfs; die Anrede Gottes bleibt kleingeschrieben nach heutiger Standardschreibung.
