  text: וַ/יִּקָּבְצ֣וּ יְהוּדָ֔ה לְ/בַקֵּ֖שׁ מֵֽ/יְהוָ֑ה גַּ֚ם מִ/כָּל עָרֵ֣י יְהוּדָ֔ה בָּ֖אוּ לְ/בַקֵּ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: de
  text: Juda versammelte sich, um bei Jahwe Hilfe zu suchen[a]. Auch aus allen Städten Judas kamen sie, um Jahwe zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die Wendung: „von Jahwe suchen“; was gesucht wird, nennt der hebräische Text nicht ausdrücklich. Im Zusammenhang ist Hilfe oder Rettung gemeint. Im zweiten Satzteil steht eine andere Konstruktion: Dort ist Jahwe selbst das direkte Objekt des Suchens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Juda versammelte sich
  rationale: Die Niphalform von קבץ bezeichnet das Sichversammeln. יְהוּדָה steht hier kollektiv für die Bevölkerung beziehungsweise das Gemeinwesen Juda; die knappe personifizierende Formulierung entspricht dem Hebräischen und ist im Deutschen verständlich.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: um bei Jahwe Hilfe zu suchen
  rationale: 'Wörtlich steht hier בקש mit מן: „von Jahwe zu suchen“. Was gesucht wird, bleibt unausgesprochen; im Zusammenhang ist Hilfe oder Rettung gemeint. Die gewählte Formulierung macht diesen Sinn idiomatisch verständlich, während die Fußnote die formale Offenheit des Hebräischen festhält.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Tetragramms als Eigenname bewahrt den Unterschied zwischen dem Gottesnamen und einem Titel wie „der Herr“.
- source_word: גַּם מִכָּל עָרֵי יְהוּדָה
  choice: Auch aus allen Städten Judas
  rationale: גַּם hebt die umfassende Beteiligung hervor; „auch“ ist hier natürlich und gibt die Ausweitung auf sämtliche Städte wieder.
- source_word: בָּאוּ לְבַקֵּשׁ אֶת יְהוָה
  choice: kamen sie, um Jahwe zu suchen
  rationale: בוא wird schlicht mit „kommen“ wiedergegeben. In dieser zweiten Wendung kennzeichnet אֶת Jahwe ausdrücklich als direktes Objekt, weshalb „Jahwe zu suchen“ die gegenüber dem ersten Satzteil veränderte Konstruktion bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als solcher wiedergegeben, ohne ihn durch einen Titel zu ersetzen. „Jahwe“ ist die geläufige moderne deutsche Form.
- issue: Verhältnis der beiden Wendungen mit בקש
  choice: Die erste Wendung wird als Suche nach Hilfe bei Jahwe, die zweite als Suche nach Jahwe selbst wiedergegeben.
  alternative: Beide Wendungen gleichlautend mit „Jahwe suchen“ wiedergeben.
  rationale: Der hebräische Text verwendet zunächst בקש + מן und danach בקש + אֶת. Die unterschiedliche Wiedergabe erhält diese sprachliche und mögliche inhaltliche Spannung, ohne die zweite Wendung auf bloße Hilfesuche zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Kollektivbezeichnung „Juda“ bleibt erhalten; die beiden unterschiedlichen hebräischen Konstruktionen werden im Haupttext unterscheidbar wiedergegeben und in der Fußnote erläutert.
