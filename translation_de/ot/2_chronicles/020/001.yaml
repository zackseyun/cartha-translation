  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: de
  text: Danach kamen die Moabiter und die Ammoniter, und mit ihnen Meuniter[a], gegen Joschafat, um Krieg zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht: »von/aus den Ammonitern«. Da die Ammoniter bereits genannt sind, verstehen viele Ausleger aufgrund des Zusammenhangs und einiger alter Übersetzungen die Bezeichnung als Hinweis auf die Meuniter oder eine ähnliche verbündete Volksgruppe.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die hebräische Erzählformel leitet zu einem späteren Ereignis über. »Danach« gibt die zeitliche Abfolge knapp und natürlich wieder, ohne die im Deutschen schwerfällige Wendung »Und es geschah nach diesem«.
- source_word: בָּאוּ
  choice: kamen
  rationale: Das gewöhnliche Bewegungsverb bleibt bewusst allgemein; die feindliche Absicht wird durch den folgenden Ausdruck für den Krieg deutlich.
- source_word: בְנֵי מוֹאָב
  choice: die Moabiter
  rationale: Die wörtliche Form »Söhne Moabs« bezeichnet hier ein Volk. »Moabiter« ist die natürliche deutsche Volksbezeichnung.
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die hebräische Wendung ist eine Volksbezeichnung und wird im Deutschen idiomatisch als »Ammoniter« wiedergegeben.
- source_word: וְעִמָּהֶם
  choice: zusammen mit
  rationale: Die Formulierung macht klar, dass die zusätzliche Gruppe die Moabiter und Ammoniter begleitete.
- source_word: מֵהָעַמּוֹנִים
  choice: einigen Meunitern
  rationale: Der masoretische Text lautet wörtlich »einige von den Ammonitern«, wiederholt damit jedoch unmittelbar die bereits genannten Ammoniter. Aufgrund des Zusammenhangs und alter Textzeugen wird häufig eine ähnlich geschriebene Bezeichnung für die Meuniter beziehungsweise eine verbündete Gruppe angenommen. Die Abweichung vom masoretischen Wortlaut wird in der Fußnote offengelegt.
- source_word: עַל יְהוֹשָׁפָט
  choice: gegen Joschafat
  rationale: Bei einer feindlichen Bewegung bezeichnet עַל hier das Ziel des Angriffs.
- source_word: לַמִּלְחָמָה
  choice: um … Krieg zu führen
  rationale: Die hebräische Zweckangabe wird als natürlicher deutscher Finalsatz wiedergegeben und bewahrt den militärischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Volksbezeichnungen werden idiomatisch wiedergegeben; die hebräische Erzählformel wird nicht unnötig wörtlich nachgebildet. Die textliche Unsicherheit bei der dritten Volksgruppe bleibt durch die Fußnote sichtbar.
