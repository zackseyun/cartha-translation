    rationale: Das Präfix מִן bezeichnet primär Herkunft/Zuordnung („von/aus den Ammonitern“). Eine partitive Bedeutung ist möglich, aber nicht die einzige und sollte in einer textkritischen Fußnote nicht als zwingend dargestellt werden.
  - severity: low
    issue: Die Fußnote beschreibt die Evidenz aus Zusammenhang und alten Textzeugen zu bestimmt.
    rationale: Die Identifikation mit den Meunitern ist eine plausible und weithin vertretene Deutung; die abweichende Lesart bzw. Rekonstruktion ist jedoch nicht unmittelbar und eindeutig durch alle alten Versionen belegt. Eine vorsichtigere Formulierung wahrt die Textunsicherheit.
