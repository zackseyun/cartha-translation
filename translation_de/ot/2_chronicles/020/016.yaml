  text: מָחָר֙ רְד֣וּ עֲלֵי/הֶ֔ם הִנָּ֥/ם עֹלִ֖ים בְּ/מַעֲלֵ֣ה הַ/צִּ֑יץ וּ/מְצָאתֶ֤ם אֹתָ/ם֙ בְּ/ס֣וֹף הַ/נַּ֔חַל פְּנֵ֖י מִדְבַּ֥ר יְרוּאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: de
  text: Morgen zieht gegen sie hinab! Seht, sie kommen den Anstieg von Ziz herauf. Ihr werdet sie am Ende des Trockentals[a] finden, vor der Wildnis von Jeruël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Schlucht«, »Bachtal« oder »Wadi«; das hebräische Wort נחל kann ein Tal beziehungsweise einen nur zeitweise wasserführenden Wasserlauf bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Morgen
  rationale: Das Zeitadverb bezeichnet den Tag der befohlenen Handlung; eine genauere Angabe wie »morgen früh« steht nicht im Hebräischen.
- source_word: רְדוּ עֲלֵיהֶם
  choice: zieht gegen sie hinab
  rationale: Der pluralische Imperativ von ירד bewahrt die abwärts gerichtete Bewegung; על hat im militärischen Zusammenhang feindliche Bedeutung.
- source_word: הִנָּם
  choice: Seht
  rationale: Die hinweisende Partikel lenkt die Aufmerksamkeit auf die unmittelbar folgende Lagebeschreibung. »Seht« ist gegenwärtig und würdevoll, ohne archaisch zu wirken.
- source_word: עֹלִים
  choice: sie kommen ... herauf
  rationale: Das Partizip beschreibt eine gegenwärtige oder unmittelbar bevorstehende Aufwärtsbewegung aus der Perspektive des Sprechers beziehungsweise der Angesprochenen.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: am Anstieg von Ziz
  rationale: מַעֲלֶה bezeichnet einen Aufstieg oder ansteigenden Weg; הַצִּיץ wird als Ortsname Ziz wiedergegeben.
- source_word: וּמְצָאתֶם אֹתָם
  choice: Ihr werdet sie ... finden
  rationale: Die Form bezeichnet hier die Folge beziehungsweise Zukunft nach dem vorausgehenden Befehl; »finden« gibt מצא unmittelbar wieder.
- source_word: בְּסוֹף הַנַּחַל
  choice: am Ende des Trockentals
  rationale: סוֹף bezeichnet das Ende oder äußerste Ende. נחל kann ein Tal mit einem nur zeitweise wasserführenden Bachbett bezeichnen; »Trockental« vermittelt diese Landschaftsform verständlicher als das Fremdwort »Wadi«.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: vor der Wildnis von Jeruël
  rationale: פְּנֵי ist räumlich als »vor« zu verstehen. מִדְבָּר meint häufig unbesiedeltes Weide- oder Steppenland und nicht zwingend eine Sandwüste; »Wildnis« hält diese Bedeutungsbreite offen.
