  source_fidelity: Der Entwurf gibt die rhetorische שאלת הֲלֹא mit erwarteter Bejahung angemessen wieder. „Hast nicht du“ bewahrt die durch אַתָּה hervorgehobene Gottesanrede; „vertrieben“, „Bewohner dieses Landes“, „vor deinem Volk Israel“, „der Nachkommenschaft Abrahams“ und „für immer“ entsprechen dem hebräischen Sinn und den Bezügen der Suffixe. Das Land ist durch „es“ korrekt als Objekt von „gegeben“ aufgenommen.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und in einer Gebetsrede idiomatisch. Die vorangestellte Verneinung in „Hast nicht du“ ist leicht gehoben, aber gerade in diesem rhetorischen Kontext natürlich und betont das göttliche Handeln passend.
  terminology: „Nachkommenschaft“ gibt den kollektiven Singular זֶרַע gut wieder. „Deines Freundes“ ist als etablierte relationale Wiedergabe von אֹהַבְךָ vertretbar, ohne die Form zu überdehnen, weil die Fußnote die aktiv-partizipiale Lesart („der dich liebt“ bzw. kontextuell „liebte“) transparent ausweist. Die Fußnotenmarkierung steht am einschlägigen Ausdruck.
