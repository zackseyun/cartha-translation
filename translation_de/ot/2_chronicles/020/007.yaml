  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: de
  text: Hast nicht du, unser Gott, die Bewohner dieses Landes vor deinem Volk Israel vertrieben und es der Nachkommenschaft Abrahams, deines Freundes[a], für immer gegeben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der dich liebt“; im Zusammenhang auch: „der dich liebte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אַתָּה
  choice: Hast nicht du
  rationale: Die Partikel הֲלֹא leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Das ausdrücklich gesetzte Pronomen אַתָּה wird durch das betonte „du“ wiedergegeben.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form bezeichnet in diesem Gebet die direkte Anrede und wird ohne das im Hebräischen nicht ausdrücklich vorhandene „o“ natürlich wiedergegeben.
- source_word: הוֹרַשְׁתָּ
  choice: vertrieben
  rationale: Der Hifil von ירשׁ bezeichnet hier, dass die bisherigen Bewohner ihr Land räumen mussten. „Vertrieben“ ist gegenwärtiges, klares Deutsch und erhält den Sinn der gewaltsamen Verdrängung.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: die Bewohner dieses Landes
  rationale: Die Wendung bedeutet wörtlich „die in diesem Land Wohnenden“. „Bewohner“ ist präzise und idiomatisch.
- source_word: מִלִּפְנֵי עַמְּךָ יִשְׂרָאֵל
  choice: vor deinem Volk Israel
  rationale: מִלִּפְנֵי beschreibt hier die Entfernung der Bewohner vor dem heranrückenden beziehungsweise gegenwärtigen Volk Israel. Die knappe deutsche Fassung bewahrt das räumliche Bild.
- source_word: וַתִּתְּנָהּ
  choice: und es … gegeben
  rationale: Das Suffix bezieht sich auf das Land. Zusammen mit „Hast nicht du“ bildet „gegeben“ eine natürliche deutsche Perfektkonstruktion innerhalb der rhetorischen Frage.
- source_word: לְזֶרַע אַבְרָהָם
  choice: der Nachkommenschaft Abrahams
  rationale: זֶרַע ist ein kollektiver Singular. „Nachkommenschaft“ erhält diesen kollektiven Charakter besser als der Plural „Nachkommen“ und ist im modernen Standarddeutsch verständlich.
- source_word: אֹהַבְךָ
  choice: deines Freundes
  rationale: Das aktive Partizip von אהב bedeutet formal „der dich liebt/liebte“, dient hier jedoch als Bezeichnung Abrahams und kann relational als „dein Freund“ verstanden werden. Die wörtlichere Bedeutung wird in der Fußnote offengelegt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier eine unbegrenzte beziehungsweise dauerhafte Zeitspanne. „Für immer“ ist klar und dem feierlichen Zusammenhang angemessen.
theological_decisions:
- issue: Bezeichnung Abrahams durch אֹהַבְךָ
  choice: deines Freundes
  alternative: der dich liebte; der dich liebt
  rationale: „Dein Freund“ gibt die im biblischen Zusammenhang etablierte relationale Bezeichnung Abrahams natürlich wieder. Da die hebräische Form grammatisch ein Liebender ist und für sich keine eindeutige Zeitstufe festlegt, bewahrt die Fußnote die wörtlichere Lesart und ihre zeitliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. Die rhetorische Frage und die Betonung des göttlichen Handelns bleiben erhalten; archaische Formen wie „Same“ werden vermieden.
