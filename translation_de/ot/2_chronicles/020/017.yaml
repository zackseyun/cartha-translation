  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: de
  text: Ihr müsst in dieser Schlacht nicht kämpfen. Nehmt eure Stellung ein, bleibt stehen und seht die Rettung Jahwes bei euch[a], Juda und Jerusalem! Fürchtet euch nicht und verliert nicht den Mut. Zieht ihnen morgen entgegen; Jahwe ist mit euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »seht die Rettung Jahwes mit euch«. Die knappe hebräische Verbindung kann die Rettung bezeichnen, die euch zuteilwird, oder Jahwes Gegenwart bei euch hervorheben.'
    reason: Bewahrt die syntaktische und semantische Offenheit der hebräischen Verbindung von »Rettung Jahwes« und »mit euch«.
  - marker: b
    text: 'Oder: »Jahwe wird mit euch sein.« Der hebräische Satz hat kein ausdrücklich genanntes Verb und kann als gegenwärtige oder auf den kommenden Kampf bezogene Zusage verstanden werden.'
    reason: Bewahrt die zeitliche Offenheit des hebräischen Nominalsatzes.
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Nicht ihr müsst in diesem Kampf kämpfen
  rationale: 'Die hebräische Wendung bedeutet wörtlich etwa: »Nicht an euch ist es, in diesem zu kämpfen.« Die gewählte Formulierung gibt die Entlastung Judas natürlich wieder, ohne daraus ein bloßes Kampfverbot zu machen.'
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Tretet an, bleibt stehen
  rationale: 'Die beiden Imperative werden unterschieden: Zuerst sollen sie ihre Stellung einnehmen, dann dort standhalten beziehungsweise stehen bleiben.'
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  choice: und seht die Rettung Jahwes
  rationale: יְשׁוּעָה bezeichnet hier konkret die Rettung aus militärischer Gefahr, behält aber zugleich seine breitere heilsgeschichtliche Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמָּכֶם
  choice: der mit euch ist / ist mit euch
  rationale: Die Präposition bezeichnet Jahwes Gegenwart und Beistand. Im ersten Vorkommen wird sie zur natürlichen deutschen Anbindung als Relativsatz formuliert; im letzten Satz unmittelbar wiedergegeben.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Fürchtet euch nicht und verliert nicht den Mut
  rationale: Die beiden Verbote bleiben als getrennte Aussagen erhalten. »Verliert nicht den Mut« gibt die Vorstellung wieder, innerlich erschüttert oder verzagt zu werden.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Zieht ihnen morgen entgegen
  rationale: Im militärischen Zusammenhang bezeichnet לִפְנֵיהֶם das Ausziehen vor beziehungsweise gegen den Feind. »Entgegenziehen« ist im Deutschen natürlich und bewahrt den räumlichen Grundgedanken.
- source_word: וַיהוָה עִמָּכֶם
  choice: Jahwe ist mit euch
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. Das Präsens formuliert Jahwes bereits bestehende Gegenwart; ein Zukunftsbezug im Blick auf den folgenden Tag bleibt möglich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration wahrt seinen Charakter als persönlichen Namen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: Im unmittelbaren Zusammenhang geht es um Befreiung aus einer militärischen Bedrohung. »Rettung« bewahrt diesen konkreten Sinn, ohne die weiter reichende theologische Bedeutung des Wortes auszuschließen.
- issue: Zeitbezug des abschließenden Nominalsatzes
  choice: Jahwe ist mit euch
  alternative: Jahwe wird mit euch sein
  rationale: Da im Hebräischen kein Verb steht, sind gegenwärtige Zusicherung und zukünftige Anwendung möglich. Der Haupttext wahrt die unmittelbare Zusage; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Anrede. Militärische Bildsprache wird beibehalten, unnötig altertümliche Wendungen werden vermieden. Die Anrede »Juda und Jerusalem« wird ohne das heute unnatürliche vokativische »o« formuliert.
