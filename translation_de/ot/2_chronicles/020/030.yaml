  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: de
  text: So hatte Joschafats Königreich Frieden[a], und sein Gott verschaffte ihm ringsum Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So hatte Joschafats Königreich Ruhe.“'
    reason: Lexikalische Alternative für שׁקט, das sowohl Frieden als auch einen ruhigen, ungestörten Zustand ausdrücken kann.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: hatte Frieden
  rationale: שׁקט bezeichnet einen ruhigen, ungestörten Zustand. Bezogen auf ein Königreich ist „hatte Frieden“ im modernen Deutschen natürlich und gibt den politischen Frieden treffend wieder.
- source_word: מַלְכוּת יְהוֹשָׁפָט
  choice: Joschafats Königreich
  rationale: מַלְכוּת bezeichnet hier das Reich beziehungsweise Herrschaftsgebiet Joschafats. Der deutsche Genitiv ist klar und idiomatisch.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: וַיָּנַח לוֹ
  choice: verschaffte ihm Ruhe
  rationale: Die Hifil-Form von נוח drückt aus, dass Gott bewirkte, dass Joschafat Ruhe hatte. „Verschaffte ihm Ruhe“ bewahrt diese kausative Bedeutung in natürlichem Deutsch.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Die Form bedeutet im Kontext eindeutig „sein Gott“ und bezieht sich auf Joschafat.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Der Ausdruck bezeichnet Ruhe gegenüber Bedrohungen aus allen umliegenden Richtungen. „Ringsum“ ist knapp, idiomatisch und wahrt den räumlichen Gesamtsinn.
- source_word: וַ
  choice: und
  rationale: Die zweite waw-Verbindung wird formal als „und“ wiedergegeben. Dadurch bleibt offen, ob die zweite Aussage lediglich anschließt oder zugleich den Grund für den Frieden erläutert.
theological_decisions:
- issue: Göttliches Wirken als Grundlage des Friedens
  choice: Die beiden Aussagen werden mit „und“ verbunden; zugleich bleibt ausdrücklich, dass Gott Joschafat ringsum Ruhe verschaffte.
  alternative: „Denn sein Gott verschaffte ihm ringsum Ruhe“, wodurch die zweite Aussage ausdrücklich als Begründung der ersten markiert würde.
  rationale: Das Hebräische koordiniert die Sätze mit waw. Die göttliche Urheberschaft der Ruhe ist eindeutig, doch die logische Beziehung zur ersten Aussage sollte nicht stärker festgelegt werden, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hatte Frieden“ vermeidet die unnatürliche Formulierung „war still“, während „verschaffte ihm … Ruhe“ den kausativen Sinn des hebräischen Verbs bewahrt. Die Satzverbindung bleibt bewusst koordinierend.
