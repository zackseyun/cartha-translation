source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: de
  text: Da kam mitten in der Versammlung der Geist Jahwes über Jahasiel, den Sohn Sacharjas, den Sohn Benajas, den Sohn Jehiels, den Sohn Mattanjas, den Leviten aus den Nachkommen Asafs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: Da ... Jahasiël
  rationale: Das וְ verbindet den Vers mit der Erzählung; im Deutschen gibt „Da“ den einsetzenden Vorgang natürlich wieder. Der Personenname wird transliteriert.
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: den Sohn Secharjas, des Sohnes Benajas, des Sohnes Jëiëls, des Sohnes Mattanjas
  rationale: Die viergliedrige Abstammungsangabe mit wiederholtem בֶּן bleibt vollständig erhalten; die deutsche Kasusfolge macht die genealogische Zuordnung verständlich.
- source_word: הַלֵּוִי
  choice: den Leviten
  rationale: Der bestimmte Artikel und die appositionelle Kennzeichnung werden durch die bestimmte Form wiedergegeben.
- source_word: מִן בְּנֵי אָסָף
  choice: aus den Nachkommen Asafs
  rationale: בְּנֵי bezeichnet hier die zu Asaf gehörende Abstammungsgruppe; „Nachkommen“ ist im heutigen Deutsch natürlicher als das wörtliche „Söhne“ und vermeidet die falsche Beschränkung auf unmittelbare Söhne.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: kam ... der Geist Jahwes über [ihn]
  rationale: Die Konstruktion bezeichnet hier ereignishaft das Kommen des göttlichen Geistes zur prophetischen Rede. Die deutsche Wortstellung nennt Jahasiël zuerst und nimmt ihn gedanklich als Bezug von „über“ auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als göttlicher Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתוֹךְ הַקָּהָל
  choice: mitten in der Versammlung
  rationale: Die Formulierung bewahrt sowohl die räumliche Bedeutung von בְּתוֹךְ als auch den öffentlichen Charakter des versammelten קָהָל.
theological_decisions:
- issue: Bezug von רוּחַ יְהוָה
  choice: der Geist Jahwes
  alternative: der Geist des HERRN / ein Geist Jahwes
  rationale: Der bestimmte Gottesname in der Genitivverbindung bezeichnet Jahwes wirksame Gegenwart, die Jahasiël zur folgenden prophetischen Rede befähigt. Die Großschreibung entspricht im Deutschen der personalen Gottesbezeichnung, ohne die grammatische Spannung des hebräischen Ausdrucks weiter auszudeuten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Die direkte Wiedergabe als Eigenname erhält den im hebräischen Text ausdrücklich gebrauchten Bundesnamen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Genealogie wird vollständig bewahrt, aber durch deutsche Kasusführung lesbar gestaltet. Die Satzstellung stellt das zentrale Ereignis („der Geist Jahwes kam“) klar heraus.
