base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: de
  text: Da stand Joschafat in der Versammlung von Juda und Jerusalem im Haus Jahwes vor dem neuen Hof[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem neuen Vorhof“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Da stellte sich … hin
  rationale: Die narrative Verbform bezeichnet hier, dass Joschafat seinen Platz einnahm beziehungsweise sich hinstellte. Die Formulierung ist im Deutschen natürlicher als das bloße „stand“, ohne eine Rede ausdrücklich in das Verb hineinzulesen.
- source_word: בִּקְהַל
  choice: in der Versammlung von
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft. „Versammlung“ ist gegenwärtig, verständlich und bewahrt die Präposition ב als „in“.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Juda und Jerusalem
  rationale: Die koordinierte Bezeichnung der versammelten Bevölkerung aus Juda und Jerusalem wird ohne erklärende Erweiterung wiedergegeben.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die wörtliche hebräische Wendung „Haus Jahwes“ bleibt verständlich und bewahrt das biblische Bild; „Tempel Jahwes“ wäre eine mögliche kontextuelle Verdeutlichung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier eine räumliche Position und wird knapp und direkt wiedergegeben.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: dem neuen Vorhof
  rationale: חָצֵר bezeichnet einen Hofbereich des Tempelkomplexes. „Vorhof“ ist im deutschen Tempelkontext klar; „Hof“ bleibt als weniger spezifizierende Alternative möglich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch den Titel „der HERR“ wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen; „Da“ kennzeichnet den narrativen Fortgang. „Haus Jahwes“ bewahrt die hebräische Ausdrucksweise, und „Vorhof“ macht den Tempelkontext verständlich.
