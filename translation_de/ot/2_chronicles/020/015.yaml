source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: de
  text: 'Er sagte: »Hört zu, ganz Juda, ihr Bewohner Jerusalems und du, König Joschafat! So spricht Jahwe zu euch: Fürchtet euch nicht und verliert nicht den Mut angesichts dieser großen Menge! Denn der Kampf gehört nicht euch, sondern Gott.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Hört zu
  rationale: Der Imperativ Plural fordert zu aufmerksamem Hören auf. „Hört zu“ ist im modernen Deutsch natürlich und bewahrt die nachdrückliche Aufforderung.
- source_word: כָל יְהוּדָה
  choice: ganz Juda
  rationale: Die knappe kollektive Bezeichnung bleibt erhalten, ohne ausdrücklich „Volk“ zu ergänzen.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: ihr Bewohner Jerusalems
  rationale: Das substantivierte Partizip bezeichnet die in Jerusalem Wohnenden; das ergänzte „ihr“ verdeutlicht die direkte Anrede.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: und du, König Joschafat
  rationale: Die direkte Anrede des Königs neben Juda und den Bewohnern Jerusalems wird im Deutschen durch „du“ klar und idiomatisch wiedergegeben.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feierliche prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אַל תִּירְאוּ
  choice: Fürchtet euch nicht
  rationale: Direkte und registergerechte Wiedergabe des ersten Verbots.
- source_word: וְאַל תֵּחַתּוּ
  choice: und verliert nicht den Mut
  rationale: חתת bezeichnet hier im militärischen Zusammenhang das Erschrecken, Verzagen oder innerliche Zusammenbrechen. Die Formulierung ist natürlich und hält dieses zweite Verbot vom Fürchten unterscheidbar.
- source_word: מִפְּנֵי
  choice: angesichts
  rationale: Gibt die situationsbezogene Bedeutung „vor/wegen“ knapp wieder und passt zur Konfrontation mit der feindlichen Menge.
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: dieser großen Menge
  rationale: הָמוֹן bezeichnet eine große Menschenmenge oder Schar. „Menge“ wahrt die lexikalische Offenheit, ohne den Ausdruck ausdrücklich als „Heer“ oder wertend als „Horde“ festzulegen.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: Denn der Kampf gehört nicht euch, sondern Gott
  rationale: Die hebräische Zugehörigkeitskonstruktion und ihr scharfer Kontrast werden in natürlichem Deutsch wiedergegeben; das zweite כִּי hat im Zusammenhang adversative Kraft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Zugehörigkeit des Kampfes
  choice: Der Kampf gehört nicht euch, sondern Gott
  alternative: Der Kampf ist nicht euer, sondern Gottes
  rationale: Die Formulierung bewahrt die Aussage über Gottes Zuständigkeit beziehungsweise Verfügung in diesem konkreten Konflikt, ohne daraus eine weitergehende systematische Lehre abzuleiten.
translation_notes:
  register: Moderne, würdevolle direkte Rede mit prophetischem Ton. Die zweifache Verneinung des Hebräischen bleibt als zwei verbundene, inhaltlich unterschiedene Aufforderungen erhalten. Keine Fußnote ist erforderlich; die im englischen Konsultationstext angegebene Fußnote ist inhaltlich der Schlussklausel zugeordnet, obwohl ihr Marker dort nicht steht, und bietet für die deutsche Fassung keine notwendige Zusatzinformation.
