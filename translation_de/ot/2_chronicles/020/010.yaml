  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: de
  text: 'Und nun sieh: Da sind die Ammoniter, die Moabiter und die Bewohner des Gebirges Seïr[a]. Du hast Israel nicht erlaubt, gegen sie zu ziehen[b], als es aus dem Land Ägypten kam. Denn Israel wich ihnen aus und vernichtete sie nicht –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Ammons und Moab und das Gebirge Seïr«; gemeint sind die Ammoniter, die Moabiter und die Bevölkerung des Gebirges Seïr.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »die du Israel nicht gegeben hast, in sie hinein beziehungsweise gegen sie zu kommen«; im Zusammenhang ist gemeint, dass Gott Israel einen militärischen Zug gegen sie nicht gestattete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Und nun sieh
  rationale: Bewahrt sowohl den fortführenden Charakter von וְעַתָּה als auch die hinweisende, nachdrückliche Funktion von הִנֵּה in natürlichem, würdigem Deutsch.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: die Ammoniter, die Moabiter und die Bewohner des Gebirges Seïr
  rationale: בְנֵי עַמּוֹן bezeichnet idiomatisch die Ammoniter. In der koordinierten Aufzählung stehen auch Moab und das Gebirge Seïr metonymisch für die dortigen Bevölkerungsgruppen; dies wird im Deutschen zur Klarheit ausgedrückt.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: Du hast Israel nicht erlaubt, gegen sie zu ziehen
  rationale: Die Konstruktion mit נתן und בוא drückt hier aus, dass Gott Israel den militärisch verstandenen Zug gegen diese Völker nicht gestattete. „Gegen sie zu ziehen“ erhält den Richtungssinn, ohne die mögliche Bedeutung unnötig auf „einmarschieren“ zu verengen.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: als es aus dem Land Ägypten kam
  rationale: Das Suffix bezieht sich auf Israel als Kollektiv; der deutsche Singular nimmt diesen Bezug eindeutig und natürlich auf.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: Deshalb wich Israel ihnen aus
  rationale: כִּי führt hier die Folgerung beziehungsweise nähere Erläuterung des göttlichen Verbots ein. סור מעל bezeichnet, dass Israel seinen Weg von ihnen weglenkte und eine Konfrontation vermied.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: und vernichtete sie nicht
  rationale: Das Hifil von שׁמד bezeichnet im Kriegskontext vollständiges Vernichten; „vernichten“ gibt die Stärke des Verbs angemessen wieder.
theological_decisions:
- issue: Direkte Anrede Gottes
  choice: Du hast Israel nicht erlaubt
  alternative: Der HERR erlaubte Israel nicht
  rationale: Der Vers gehört zu einem direkt an Gott gerichteten Gebet. Die zweite Person des hebräischen Textes bleibt daher erhalten; ein Gottesname wird nicht ergänzt.
- issue: Grad der militärischen Explizitheit
  choice: gegen sie zu ziehen
  alternative: in ihr Gebiet einzudringen / sie anzugreifen
  rationale: Der Zusammenhang ist militärisch, doch die hebräische Formulierung lautet wörtlich „in/gegen sie hineingehen“. Die gewählte Wiedergabe macht den Kontext verständlich, ohne eine engere Handlung als ausdrücklich gesagt festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ erhält den nachdrücklichen Gebetston, ohne das heute altertümlich wirkende „siehe“. Der Gedankenstrich am Ende bewahrt den syntaktischen Anschluss an den folgenden Vers.
