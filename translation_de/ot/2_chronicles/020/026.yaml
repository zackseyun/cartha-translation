source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: de
  text: Am vierten Tag versammelten sie sich im Tal Beracha[a], denn dort priesen sie Jahwe. Darum nannten sie diesen Ort »Tal Beracha«. So heißt er bis heute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beracha bedeutet »Segen«; der Name nimmt das im folgenden Satz verwendete hebräische Wort für »preisen/segnen« auf.
    reason: Wortspiel und Bedeutung des Ortsnamens
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: versammelten sie sich
  rationale: Das Nifal von קהל bezeichnet hier das Zusammenkommen der Menschen; die reflexive deutsche Form ist natürlich und quellennah.
- source_word: עֵמֶק בְּרָכָה
  choice: Tal Beracha
  rationale: עֵמֶק bedeutet »Tal«; בְּרָכָה wird als Bestandteil des Ortsnamens transliteriert. Die Fußnote erschließt die für das Wortspiel wichtige Bedeutung.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: denn dort priesen sie Jahwe
  rationale: כִּי begründet die Namensgebung. ברך bedeutet in Bezug auf Gott, ihn segnend zu loben beziehungsweise zu preisen; »priesen« ist im heutigen Deutsch verständlicher als »segneten«, während die Verbindung zu בְּרָכָה durch die Fußnote sichtbar bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen etablierte Form.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: nannten sie diesen Ort
  rationale: Die wörtliche hebräische Namensformel »sie nannten den Namen jenes Ortes« wird idiomatisch und ohne Bedeutungsverlust ins Deutsche übertragen.
- source_word: עַד הַיּוֹם
  choice: So heißt er bis heute
  rationale: Die hebräische Wendung bezeichnet das Fortbestehen des Ortsnamens bis in die Gegenwart des Erzählers; im Deutschen wird der Bezug auf die Namensgebung ausdrücklich und natürlich formuliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. Seine Wiedergabe als »Jahwe« bewahrt diesen Unterschied gegenüber einem ersetzenden Titel.
- issue: Bedeutung von בֵּרֲכוּ bei Gott als Objekt
  choice: priesen
  alternative: segneten
  rationale: Das Hebräische verwendet dasselbe Wortfeld wie im Ortsnamen בְּרָכָה. Da »Gott segnen« im modernen Deutsch leicht missverstanden wird, gibt »priesen« die kontextuelle Bedeutung klar wieder; die Fußnote bewahrt das Wortspiel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ortsname wird transliteriert, seine Bedeutung in einer Fußnote erklärt. Die knappe Erzählweise des Hebräischen bleibt erhalten; die abschließende Namensformel wird idiomatisch formuliert.
