  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Joschafats, die früheren und die späteren – siehe, sie sind in den Aufzeichnungen Jehus, des Sohnes Hananis,[a] niedergeschrieben, die er in das Buch der Könige Israels aufnahm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Siehe, sie sind in den Worten Jehus, des Sohnes Hananis, geschrieben.“ „Worte“ kann hier eine schriftliche Darstellung oder Aufzeichnungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz lautet wörtlich etwa: „die er auf das Buch der Könige Israels hinaufbrachte“. Das Singularverb legt Jehu als Handelnden nahe; ein ausdrückliches Objekt fehlt. Wahrscheinlich ist gemeint, dass seine Aufzeichnungen in dieses größere Geschichtswerk aufgenommen wurden, doch der knappe Wortlaut lässt das genaue Verhältnis der beiden Schriften offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Die übrigen Taten Joschafats
  rationale: In der königlichen Schlussformel bezeichnet דִּבְרֵי die Taten und Angelegenheiten eines Königs, nicht nur seine Worte. Das vorangestellte וְ hat hier verbindende beziehungsweise fortführende Funktion und muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: die früheren und die späteren
  rationale: Die formelhafte Paarung umfasst die gesamte Regierungszeit. Diese Wiedergabe ist quellennah und im Deutschen natürlicher als „die ersten und die letzten“.
- source_word: הִנָּם כְּתוּבִים
  choice: sind … niedergeschrieben
  rationale: Das deiktische הִנָּם unterstreicht, dass die erwähnten Taten schriftlich vorliegen. Im heutigen Deutschen vermittelt „sind … niedergeschrieben“ diese Feststellung würdig und natürlich, ohne ein altertümliches „siehe“ zu erzwingen.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: in den Aufzeichnungen Jehus, des Sohnes Hananis
  rationale: דִּבְרֵי bezeichnet hier eine schriftliche Quelle. „Aufzeichnungen“ macht den dokumentarischen Sinn deutlich, ohne die Gattung enger als der hebräische Text festzulegen.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: Diese hat er in das Buch der Könige Israels aufgenommen
  rationale: Das Hifil von עלה bedeutet wörtlich „hinaufbringen/hinaufgehen lassen“. Im Zusammenhang einer Quellenangabe liegt die Aufnahme der Aufzeichnungen in ein umfassenderes Königsbuch nahe. Der Singular des Verbs lässt Jehu als Subjekt verstehen; „Diese“ nimmt sinngemäß seine Aufzeichnungen auf.
