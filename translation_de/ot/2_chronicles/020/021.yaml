source:
  edition: WLC
  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: de
  text: 'Nachdem er sich mit dem Volk beraten hatte, setzte er Sänger für Jahwe ein, die in heiliger Pracht[a] priesen, als sie vor der Vorhut[b] auszogen und riefen:


    »Dankt Jahwe,

    denn seine treue Liebe[c] bleibt für immer!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Pracht der Heiligkeit“, „die Schönheit der Heiligkeit“ oder „in heiligem Schmuck“. Die hebräische Wendung kann sowohl die Weise des Preisens als auch dessen Gegenstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „vor den vorausziehenden Truppen“, „vor den zum Kampf Gerüsteten“ oder „vor der vordersten Schlachtreihe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „seine beständige Liebe“, „seine Güte“ oder „sein Erbarmen“. Das hebräische חֶסֶד bezeichnet verlässliche, tätige und oft bundestreue Liebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: Nachdem er sich mit dem Volk beraten hatte
  rationale: Das Niphal von יעץ bezeichnet hier eine Beratung unter Beteiligung des Volkes. Die temporale Formulierung gibt die Abfolge im Deutschen natürlich wieder.
- source_word: וַיַּעֲמֵד
  choice: stellte er … auf
  rationale: Der Hiphil von עמד kann „hinstellen“, „aufstellen“, „einsetzen“ oder „bestellen“ bedeuten. „Aufstellen“ bewahrt sowohl den Gedanken der Beauftragung als auch die konkrete Positionierung vor dem Heer.
- source_word: מְשֹׁרֲרִים לַיהוָה
  choice: Sänger für Jahwe
  rationale: מְשֹׁרֲרִים bezeichnet ausdrücklich Sänger. Das ל kann ihre Ausrichtung beziehungsweise ihren Dienst für Jahwe angeben.
- source_word: וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ
  choice: Sie priesen die heilige Pracht
  rationale: Die Partizipialform beschreibt die Tätigkeit der Sänger. הַדְרַת קֹדֶשׁ lässt sich als „heilige Pracht“, „Pracht der Heiligkeit“ oder „heiliger Schmuck“ verstehen; die knappe Hauptübersetzung wahrt den poetischen Charakter.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: während sie vor der Vorhut auszogen
  rationale: ב mit dem Infinitiv bezeichnet eine gleichzeitige Handlung. הֶחָלוּץ meint die ausgerüstete, vorausziehende Kampftruppe und nicht notwendig das gesamte Heer.
- source_word: וְאֹמְרִים
  choice: und riefen
  rationale: Wörtlich steht „und sagten“. Im Zusammenhang eines gesungenen öffentlichen Lobpreises ist „riefen“ natürlich, ohne den Inhalt näher festzulegen.
- source_word: הוֹדוּ לַיהוָה
  choice: Dankt Jahwe
  rationale: ידה im Hiphil bedeutet im gottesdienstlichen Zusammenhang „danken“ oder „preisen“. Der folgende Begründungssatz spricht für „danken“.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: denn seine treue Liebe bleibt für immer
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und Erbarmen. „Treue Liebe“ hält die Beziehungs- und Verlässlichkeitsebene offen; „bleibt“ ergänzt im Deutschen das im Hebräischen fehlende Verb.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Gottesnamen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Erbarmen; beständige Liebe
  rationale: Die Übersetzung soll weder den Bundesbezug überbetonen noch die emotionale und tätige Güte verengen. Die Alternativen werden in einer Fußnote sichtbar gehalten.
- issue: Bezug von לְהַדְרַת־קֹדֶשׁ
  choice: die heilige Pracht
  alternative: die Pracht der Heiligkeit; in heiligem Schmuck
  rationale: Die knappe hebräische Wendung lässt offen, ob Gottes heilige Pracht, die Schönheit der Heiligkeit oder heiliger Festschmuck gemeint ist. Die Hauptfassung entscheidet dies nicht dogmatisch; die Fußnote bewahrt die sprachliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist als poetischer Ruf gesetzt. „Vorhut“ ist verständlich und knapp; die militärische Bedeutungsbreite wird in der Fußnote erläutert. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
