  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: de
  text: Da erhoben sich die Leviten aus den Reihen der Kehatiter und der Korachiter, um Jahwe, den Gott Israels, mit überaus lauter Stimme zu loben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da erhoben sich
  rationale: Das Qal-Wayyiqtol von קום bezeichnet das konkrete Aufstehen; „Da erhoben sich“ führt die folgende Handlung in würdigem, natürlichem Deutsch fort.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung der kultischen Stammesgruppe; der bestimmte Artikel bleibt erhalten.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: aus den Reihen der Kehatiter
  rationale: בני bezeichnet hier die Angehörigen beziehungsweise Nachkommen der Sippe. „Aus den Reihen der Kehatiter“ gibt Zugehörigkeit und partitive מן-Konstruktion verständlich wieder, ohne im Deutschen die missverständliche Wendung „Söhne der Kehatiter“ zu verwenden.
- source_word: וּמִן בְּנֵי הַקָּרְחִים
  choice: und der Korachiter
  rationale: Parallel zur vorigen Wendung; die Präposition und „aus den Reihen“ gelten elliptisch auch für diese zweite Gruppe.
- source_word: לְהַלֵּל
  choice: um … zu loben
  rationale: Der Infinitiv mit לְ drückt den Zweck ihres Aufstehens aus. „Loben“ bleibt bewusst weiter als „Loblieder singen“, da kein ausdrückliches Verb des Singens steht.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und dadurch als Eigenname erkennbar gehalten.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und appositionell zu „Jahwe“ übersetzt.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: mit überaus lauter Stimme
  rationale: קוֹל גָּדוֹל bezeichnet eine laute Stimme; לְמָעְלָה wirkt im Zusammenhang verstärkend. „Überaus laut“ bildet diese Intensivierung idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, ohne einen Titel an seine Stelle zu setzen.
- issue: Art des Lobpreises
  choice: loben
  alternative: Loblieder singen
  rationale: הלל bezeichnet Lobpreis, legt hier aber für sich genommen nicht eindeutig fest, dass dieser gesungen wurde. Die Übersetzung vermeidet daher eine unnötige Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Sippenbezeichnungen „Kehatiter“ und „Korachiter“ entsprechen geläufigen deutschen biblischen Namensformen. Die ungewöhnliche hebräische Verstärkung am Versende wird ohne schwer verständlichen räumlichen Ausdruck natürlich als „überaus laut“ wiedergegeben.
