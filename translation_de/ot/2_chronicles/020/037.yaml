    rationale: Das hebräische וַיִּשָּׁבְרוּ besagt, dass die Schiffe zerbrachen bzw. zu Bruch gingen; es nennt weder Felsen noch einen Zusammenstoß. »Zerschellten« kann einen solchen Hergang implizieren.
  - severity: low
    issue: Die Fußnote nennt ein »Schiffbau- und Handelsunternehmen«.
    rationale: Der unmittelbare Kontext stützt das Schiffsunternehmen; »Handelsunternehmen« ist eine weitergehende historische Einordnung und sollte nicht als gemeinter Textsinn behauptet werden.
  - severity: low
    issue: Namensform »Eliëser«.
    rationale: »Elieser« ist im modernen deutschen Bibelgebrauch die üblichere Schreibweise und entspricht der sonst gewählten deutschen Namensform.
