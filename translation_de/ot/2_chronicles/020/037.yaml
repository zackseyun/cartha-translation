revisions:
- from: 'Da weissagte Eliëser, der Sohn Dodawahus, aus Marescha gegen Joschafat: »Weil du dich mit Ahasja verbündet hast, hat Jahwe dein Unternehmen zunichtegemacht.[a]« Daraufhin zerschellten die Schiffe und konnten nicht nach Tarschisch fahren.[b]'
  to: 'Da sprach Elieser, der Sohn Dodawahus, aus Marescha prophetisch gegen Joschafat und sagte: »Weil du dich mit Ahasja verbündet hast, hat Jahwe dein Unternehmen zunichtegemacht.[a]« Die Schiffe gingen zu Bruch und konnten nicht nach Tarschisch fahren.[b]'
  rationale: Die Revision beseitigt eine unnötig konkrete Vorstellung vom Zerschellen und entfernt die unbelegte Präzisierung auf Handel. Die prophetische Rede wird zugleich in natürlichem modernem Deutsch formuliert. Die Aussage über die Schiffe und ihr Ausbleiben in Tarschisch bleibt eng am hebräischen Text; die mögliche Nuance des Gehindertwerdens bleibt als Fußnotenalternative erhalten.
