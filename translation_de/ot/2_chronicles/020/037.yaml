  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Text insgesamt eng: Eliesers Gerichtsprophetie richtet sich gegen Joschafat; dessen Verbindung mit Ahasja wird als Grund genannt; Jahwe vereitelt sein Vorhaben; die Schiffe werden beschädigt und erreichen Tarschisch nicht. »Zerschellten« legt jedoch einen konkreten Unfallhergang nahe, den שבר nicht bezeichnet. Die Fußnote erweitert den Kontext zudem unnötig zu einem Handelsunternehmen.'
  naturalness: Modernes, verständliches Standarddeutsch. »Da weissagte« ist möglich, aber »sprach prophetisch ... und sagte« wirkt gegenwärtig etwas natürlicher, ohne den Sinn abzuschwächen. »Die Schiffe gingen zu Bruch« ist idiomatisch und vermeidet die unnötige Bildlichkeit von »zerschellten«.
  terminology: Die Namensformen Joschafat, Ahasja, Marescha, Tarschisch und Jahwe sind konsistent und im Deutschen gebräuchlich. »Elieser« ist die geläufigere deutsche Form. »Unternehmen« gibt den kontextuellen Bezug von »deine Werke« angemessen wieder; die Fußnote wahrt die wörtliche Form.
