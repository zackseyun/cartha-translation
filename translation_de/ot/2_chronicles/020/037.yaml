base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: de
  text: 'Da sprach Elieser, der Sohn Dodawahus, aus Marescha prophetisch gegen Joschafat und sagte: »Weil du dich mit Ahasja verbündet hast, hat Jahwe dein Unternehmen zunichtegemacht.[a]« Die Schiffe gingen zu Bruch und konnten nicht nach Tarschisch fahren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hat Jahwe deine Werke zerbrochen«. Gemeint ist hier Joschafats Schiffsunternehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wurden daran gehindert, nach Tarschisch zu fahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: weissagte
  rationale: Der Hitpael von נבא bezeichnet hier prophetisches Reden; »weissagte« ist die natürliche und formnahe deutsche Entsprechung.
- source_word: עַל
  choice: gegen
  rationale: Die an Joschafat gerichtete prophetische Gerichtsrede ist eine Zurechtweisung; daher gibt »gegen« die kontextuelle Stoßrichtung von עַל treffend wieder.
- source_word: מִמָּרֵשָׁה
  choice: aus Marescha
  rationale: Die Präposition מִן bezeichnet Herkunft; »aus Marescha« ist im Deutschen idiomatisch.
- source_word: כְּהִתְחַבֶּרְךָ
  choice: Weil du dich mit … verbündet hast
  rationale: Der Hitpael von חבר drückt ein Sichverbinden mit jemandem aus. Im Zusammenhang des gemeinsamen Schiffsunternehmens ist »sich verbünden« natürlich, ohne die genaue Rechtsform der Verbindung festzulegen.
- source_word: פָּרַץ
  choice: hat … zunichtegemacht
  rationale: פרץ bedeutet grundsätzlich auf- oder durchbrechen; mit dem Vorhaben als direktem Objekt bezeichnet es hier dessen Zerstörung beziehungsweise Vereitelung. Die Wiedergabe formuliert diesen kontextuellen Sinn verständlich.
- source_word: מַעֲשֶׂיךָ
  choice: dein Unternehmen
  rationale: Wörtlich steht der Plural »deine Werke/Taten«; im Zusammenhang ist damit Joschafats Schiffbau- und Handelsunternehmen gemeint. Der Singular »dein Unternehmen« bildet den konkreten Bezug natürlich ab.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Daraufhin zerschellten die Schiffe
  rationale: Die Nifalform beschreibt, dass die Schiffe zerbrachen. »Zerschellten« ist für Schiffe idiomatisch und gibt die eingetretene Zerstörung prägnant wieder.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: und konnten nicht … fahren
  rationale: עצר bezeichnet in dieser Konstruktion ein Nichtvermögen oder Gehindertsein. Bei Schiffen ist »konnten nicht fahren« natürlich; die mögliche Nuance des Gehindertwerdens wird in einer Fußnote bewahrt.
- source_word: תַּרְשִׁישׁ
  choice: Tarschisch
  rationale: Der Ortsname wird in der im Deutschen etablierten Transliteration wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Namen, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit geläufigen deutschen Namensformen. Die prophetische Gerichtsrede bleibt knapp und direkt; kontextbedingte Verdeutlichungen werden durch Fußnoten transparent gemacht.
