  text: וַ/יִּרָ֕א וַ/יִּתֵּ֧ן יְהוֹשָׁפָ֛ט אֶת פָּנָ֖י/ו לִ/דְר֣וֹשׁ לַ/יהוָ֑ה וַ/יִּקְרָא צ֖וֹם עַל כָּל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: de
  text: Da bekam Joschafat Angst[a]. Er nahm sich fest vor, Jahwe zu suchen[b], und rief in ganz Juda ein Fasten aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da fürchtete sich Joschafat.« Die hebräische Erzählform kann hier das Einsetzen der Furcht hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Er richtete sein Angesicht darauf, Jahwe zu suchen.« Die hebräische Wendung bezeichnet eine feste, bewusste Entschlossenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: bekam Angst
  rationale: Das Verb ירא bezeichnet hier Joschafats unmittelbare Furcht angesichts der Bedrohung. »Bekam Angst« gibt im Deutschen natürlich wieder, dass die Furcht an diesem Punkt der Erzählung einsetzt.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: nahm sich fest vor
  rationale: Die hebräische Wendung »sein Angesicht setzen/geben« drückt eine bewusste, entschlossene Ausrichtung auf ein Ziel aus. Die gewählte Formulierung gibt diese Entschlossenheit in modernem Deutsch wieder; das konkrete hebräische Bild bleibt in der Fußnote sichtbar.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דרש bezeichnet in Verbindung mit Gott das ernsthafte Suchen nach ihm, seiner Hilfe oder Weisung. »Suchen« bewahrt den umfassenden Sinn und verengt ihn nicht auf eine bloße Anfrage.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext ausdrücklich stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: וַיִּקְרָא צוֹם
  choice: rief ... ein Fasten aus
  rationale: Die Wortverbindung bezeichnet die öffentliche Anordnung oder Bekanntmachung eines Fastens. »Ein Fasten ausrufen« ist dafür eine klare und gebräuchliche deutsche Formulierung.
- source_word: עַל כָּל יְהוּדָה
  choice: in ganz Juda
  rationale: Die Präposition עַל bezeichnet hier den Geltungsbereich der öffentlichen Ausrufung. »In ganz Juda« vermittelt verständlich, dass das Fasten das gesamte Land beziehungsweise Volk Juda betraf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im Hebräischen verwendete Bundesname als Name erkennbar bleibt und nicht durch einen Titel ersetzt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau wurde für natürliches Deutsch in zwei Sätze gegliedert; die Bildsprache des hebräischen Idioms wird in einer Fußnote dokumentiert.
