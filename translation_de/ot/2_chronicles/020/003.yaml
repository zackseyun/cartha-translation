  terminology: »Jahwe« gibt den ausdrücklich verwendeten Gottesnamen יהוה konsistent wieder. »Juda«, »Fasten« und »suchen« sind sachgerecht; insbesondere bewahrt »Jahwe zu suchen« die Weite von לִדְרוֹשׁ, ohne es auf bloßes Befragen zu verengen.
