source:
  edition: WLC
  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: de
  text: Da kam Furcht vor Gott über alle Königreiche der Länder, als sie hörten, dass Jahwe gegen die Feinde Israels gekämpft hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schrecken von Gott“. Der hebräische Ausdruck kann Furcht angesichts von Gottes Gegenwart oder Handeln sowie einen von Gott ausgehenden Schrecken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Form führt den eintretenden Folgezustand ein. „Da kam“ bewahrt die erzählerische Bewegung und klingt im Deutschen natürlicher als ein bloßes „war“.
- source_word: פַּחַד אֱלֹהִים
  choice: Furcht vor Gott
  rationale: Die Wiedergabe hält den Gottesbezug der hebräischen Konstruktverbindung fest und bezeichnet im Kontext die Furcht, die durch Gottes machtvolles Eingreifen ausgelöst wird. Da auch die Deutung als von Gott ausgehender Schrecken möglich ist, wird diese in der Fußnote genannt.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: über alle Königreiche der Länder
  rationale: „Über … kommen“ entspricht dem hebräischen Ausdruck idiomatisch. Der Plural „Länder“ bleibt erhalten und verweist wahrscheinlich auf die umliegenden Herrschaftsgebiete, nicht notwendig auf die ganze Erde.
- source_word: בְּשָׁמְעָם כִּי
  choice: als sie hörten, dass
  rationale: Die Präposition mit Infinitiv und Suffix bezeichnet den Zeitpunkt; כִּי leitet hier den Inhalt dessen ein, was gehört wurde.
- source_word: נִלְחַם
  choice: gekämpft hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jahwes abgeschlossenes Eingreifen anschließend den Königreichen bekannt wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in seiner geläufigen deutschen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: gegen die Feinde Israels
  rationale: Bei dem Verb „kämpfen“ bezeichnet עִם hier die gegnerische Partei. Im Deutschen gibt „gegen“ den Zusammenhang eindeutig und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Deutung von פַּחַד אֱלֹהִים
  choice: Furcht vor Gott
  alternative: Schrecken von Gott
  rationale: Die Hauptfassung bewahrt die Vorstellung der Furcht angesichts von Gottes Handeln. Weil die hebräische Verbindung zugleich einen von Gott ausgehenden Schrecken bezeichnen kann, bleibt diese Möglichkeit ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die echte Mehrdeutigkeit der Gottesfurcht beziehungsweise des von Gott kommenden Schreckens wird nicht eingeebnet.
