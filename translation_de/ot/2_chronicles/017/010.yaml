  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: de
  text: Und der Schrecken Jahwes[a] kam über alle Königreiche der Länder rings um Juda, und sie führten keinen Krieg gegen Joschafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Schrecken vor Jahwe“ oder „von Jahwe bewirkter Schrecken“. Die hebräische Genitivverbindung kann Furcht bezeichnen, die mit Jahwe verbunden ist; in diesem Zusammenhang ist wahrscheinlich ein von ihm ausgelöster Schrecken unter den umliegenden Königreichen gemeint.'
    reason: lexikalische und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Verbindung mit dem abstrakten Substantiv פַּחַד bezeichnet hier natürlich das Eintreten eines Zustands; „Da kam“ gibt sowohl den Erzählfortgang als auch den Beginn des Schreckens wieder.
- source_word: פַּחַד יְהוָה
  choice: der Schrecken Jahwes
  rationale: פַּחַד bezeichnet Furcht, Schrecken oder Entsetzen. Der Genitiv bleibt bewusst offen für Schrecken vor Jahwe beziehungsweise von Jahwe bewirkten Schrecken; im militärischen Kontext liegt Letzteres nahe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den Eigennamen des hebräischen Textes erkennbar zu erhalten.
- source_word: עַל
  choice: über
  rationale: Mit einem Ausdruck des Schreckens bezeichnet עַל diejenigen, die davon erfasst werden; „über … kommen“ ist im Deutschen idiomatisch.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: alle Königreiche der Länder
  rationale: Die Wiedergabe bewahrt beide hebräischen Substantive und damit die umfassende geografisch-politische Formulierung.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: rings um Juda
  rationale: Die knappe deutsche Ortsangabe gibt die umliegende Lage der betreffenden Länder natürlich wieder.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: sodass sie keinen Krieg gegen … führten
  rationale: Das Verb bezeichnet Kämpfen beziehungsweise Kriegführen. „Sodass“ macht die im Zusammenhang erkennbare Folge deutlich, ohne eine zusätzliche Ursache einzuführen.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von פַּחַד יְהוָה
  choice: Die Formulierung „der Schrecken Jahwes“ bleibt im Haupttext genitivisch offen; der Kontext deutet auf von Jahwe bewirkten Schrecken.
  alternative: „Schrecken vor Jahwe“ als ausdrücklich objektiver Genitiv oder „Schrecken von Jahwe“ als ausdrücklich ursächlicher Genitiv.
  rationale: Der militärisch-politische Zusammenhang spricht für göttlich verursachten Schrecken, doch die hebräische Genitivverbindung legt die genaue Beziehung nicht ausdrücklich fest. Haupttext und Fußnote bewahren diese Spannung.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Schrecken“ passt zum militärischen Kontext besser als das mildere „Furcht“. Die Namen „Jahwe“, „Juda“ und „Joschafat“ folgen geläufigen deutschen Formen.
