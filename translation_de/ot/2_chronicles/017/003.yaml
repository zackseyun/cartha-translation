  text: וַ/יְהִ֥י יְהוָ֖ה עִם יְהוֹשָׁפָ֑ט כִּ֣י הָלַ֗ךְ בְּ/דַרְכֵ֞י דָּוִ֤יד אָבִי/ו֙ הָ/רִ֣אשֹׁנִ֔ים וְ/לֹ֥א דָרַ֖שׁ לַ/בְּעָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: de
  text: Und Jahwe war mit Joschafat, denn er ging auf den früheren[a] Wegen seines Vaters David und suchte nicht die Baale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den ersten Wegen seines Vaters David«. Gemeint ist wahrscheinlich Davids frühere Lebensführung im Unterschied zu seinen späteren Verfehlungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: וַיְהִי ... עִם
  choice: war mit
  rationale: Die geläufige deutsche Wendung bewahrt die Aussage von Jahwes Gegenwart und Beistand.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion kennzeichnet hier den begründenden Zusammenhang, ohne ihn im Deutschen unnötig stark kausal festzulegen.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: ging auf den … Wegen
  rationale: So bleibt das hebräische Bild für Lebensführung erhalten und klingt zugleich natürlich und würdig.
- source_word: דָּוִיד אָבִיו
  choice: seines Vaters David
  rationale: »Vater« bewahrt die dynastische Ausdrucksweise des Hebräischen; David ist hier als Vorfahr Joschafats bezeichnet.
- source_word: הָרִאשֹׁנִים
  choice: früheren
  rationale: Die Wiedergabe bezeichnet Davids frühere Lebensführung und vermeidet das im Deutschen missverständliche »ersten«.
- source_word: דָרַשׁ
  choice: suchte
  rationale: Das Verb kann im Blick auf eine Gottheit religiöses Suchen, Befragen oder Sich-an-sie-Wenden bezeichnen; »suchte« erhält diese Bedeutungsbreite.
- source_word: לַבְּעָלִים
  choice: die Baale
  rationale: Der deutsche Plural bewahrt die ausdrücklich pluralische Form und verweist auf verschiedene Baalskulte beziehungsweise Erscheinungsformen.
theological_decisions:
- issue: David als Vorbild trotz seiner späteren Verfehlungen
  choice: auf den früheren Wegen seines Vaters David
  alternative: auf den ersten Wegen seines Vaters David
  rationale: Die Formulierung beschränkt den Vergleich auf Davids frühere Lebensführung, ohne näher auszuführen, welche späteren Verfehlungen den Gegensatz bilden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das Weg-Motiv des Hebräischen bleibt erhalten; ungebräuchliche oder konfessionell geprägte Ersatzformulierungen werden vermieden.
