  text: וּ/מִ֨ן בִּנְיָמִ֔ן גִּבּ֥וֹר חַ֖יִל אֶלְיָדָ֑ע וְ/עִמּ֛/וֹ נֹֽשְׁקֵי קֶ֥שֶׁת וּ/מָגֵ֖ן מָאתַ֥יִם אָֽלֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: de
  text: 'Und aus Benjamin: Eljada, ein tapferer Krieger, und mit ihm 200.000 Mann, die mit Bogen und Schild bewaffnet waren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: Und aus Benjamin
  rationale: Die Konjunktion und die Präposition führen im fortlaufenden Verzeichnis ein weiteres Stammeskontingent ein. Die knappe Form wahrt den additiven Listenstil.
- source_word: גִּבּוֹר חַיִל
  choice: ein tapferer Krieger
  rationale: Die feste Wortverbindung bezeichnet hier einen tüchtigen, mutigen Kriegsmann. „Tapferer Krieger“ gibt den militärischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: אֶלְיָדָע
  choice: Eljada
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenkonvention transkribiert.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Die Konjunktion bleibt erhalten und verbindet den genannten Befehlshaber mit dem ihm zugeordneten Truppenkontingent.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: die mit Bogen und Schild bewaffnet waren
  rationale: Das Partizip von נשק beschreibt Männer, die mit den anschließend genannten Waffen ausgerüstet sind. Der deutsche Relativsatz stellt den Bezug zur Truppenzahl klar und klingt natürlich.
- source_word: מָאתַיִם אָלֶף
  choice: 200.000 Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ verdeutlicht idiomatisch, dass es sich um die Stärke des Truppenkontingents handelt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem militärischem Listenstil. Die Waffenbezeichnungen stehen wie im Hebräischen kollektiv im Singular. Die syntaktische Mehrdeutigkeit des Partizips wird ohne sachliche Erweiterung als Ausrüstung der 200.000 Männer ausgedrückt.
