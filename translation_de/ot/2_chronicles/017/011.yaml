  text: וּ/מִן פְּלִשְׁתִּ֗ים מְבִיאִ֧ים לִֽ/יהוֹשָׁפָ֛ט מִנְחָ֖ה וְ/כֶ֣סֶף מַשָּׂ֑א גַּ֣ם הָֽ/עַרְבִיאִ֗ים מְבִיאִ֥ים ל/וֹ֙ צֹ֕אן אֵילִ֔ים שִׁבְעַ֤ת אֲלָפִים֙ וּ/שְׁבַ֣ע מֵא֔וֹת וּ/תְיָשִׁ֕ים שִׁבְעַ֥ת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: de
  text: 'Von den Philistern wurden Joschafat Tribut und eine Last Silber[a] gebracht. Auch die Araber brachten ihm Kleinvieh: 7.700 Widder und 7.700 Ziegenböcke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Silber, eine Last“. Die Wendung kann eine als Tribut herbeigebrachte Menge Silber bezeichnen.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: Und von den Philistern
  rationale: Die Präposition מִן bezeichnet zunächst die Herkunft. Die Wiedergabe bewahrt diese im Hebräischen naheliegende Bedeutung, ohne festzulegen, ob nur ein Teil der Philister gemeint ist.
- source_word: מְבִיאִים
  choice: brachte man / brachten
  rationale: Das Partizip kann eine fortdauernde oder wiederholte Handlung ausdrücken. Im modernen deutschen Erzählstil gibt das Präteritum den Vorgang natürlich wieder; die unpersönliche Form im ersten Satzteil entspricht der Herkunftskonstruktion.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im politischen Zusammenhang fremder Völker und eines Königs bezeichnet מִנְחָה hier am ehesten eine Tributzahlung und nicht ein kultisches Opfer.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: und Silber als Last
  rationale: Die konkrete hebräische Formulierung verbindet Silber mit מַשָּׂא, einer Last beziehungsweise Traglast. Die Übersetzung bewahrt dieses ungewöhnliche Bild; die Fußnote erläutert den Sinn.
- source_word: גַּם הָעַרְבִיאִים
  choice: Auch die Araber
  rationale: Gibt sowohl die additive Bedeutung von גַּם als auch die Volksbezeichnung in natürlichem modernem Deutsch wieder.
- source_word: ל/וֹ צֹאן
  choice: ihm Kleinvieh
  rationale: צֹאן ist ein Sammelbegriff für kleinere Herdentiere, vor allem Schafe und Ziegen. „Kleinvieh“ passt zu den anschließend genannten Widdern und Ziegenböcken.
- source_word: אֵילִים
  choice: Widder
  rationale: Dies ist die übliche und genaue deutsche Bezeichnung für ausgewachsene männliche Schafe.
- source_word: וּ/תְיָשִׁים
  choice: Ziegenböcke
  rationale: תְּיָשִׁים bezeichnet ausdrücklich männliche Ziegen; „Ziegenböcke“ ist eindeutig und geläufig.
- source_word: שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: '7.700'
  rationale: Ziffern machen die großen, zweimal genannten Mengen im modernen deutschen Satz leicht erfassbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herkunftsformulierung „von den Philistern“ bewahrt die lexikalische Offenheit des Hebräischen. Die ungewöhnliche Wendung „Silber als Last“ bleibt im Text sichtbar und wird knapp erläutert.
