  - severity: low
    issue: „Silber als Last“
    rationale: Die Wendung ist im Deutschen semantisch unklar; „eine Last Silber“ bildet die Bezeichnung einer getragenen Menge idiomatischer ab, ohne die hebräische Bildlichkeit aufzugeben.
