  text: וְ/עַל יָד֖/וֹ יְהוֹחָנָ֣ן הַ/שָּׂ֑ר וְ/עִמּ֕/וֹ מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/015.yaml
  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: de
  text: Unter seinem Befehl stand der Befehlshaber Jehohanan[a], und bei ihm waren 280.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über/auf seiner Hand“; die hebräische Wendung kann hier auch „unter seiner Vollmacht“ oder „ihm zur Seite“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Unter seinem Befehl
  rationale: Die hebräische Wendung bedeutet in dieser militärischen Aufzählung, dass Jehohanan der Leitung oder Befehlsgewalt des zuvor genannten Befehlshabers unterstand; eine wörtlich-räumliche Wiedergabe wäre im Deutschen missverständlich.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Der Personenname wird entsprechend seiner hebräischen Form transliteriert.
- source_word: הַשַּׂר
  choice: der Befehlshaber
  rationale: שַׂר bezeichnet allgemein einen führenden Amtsträger; im unmittelbaren militärischen Zusammenhang ist „Befehlshaber“ sachlich und natürlich.
- source_word: וְעִמּוֹ
  choice: und bei ihm waren
  rationale: Die Wendung führt die Jehohanan zugeordneten Truppen an. Das ergänzte Verb ist im Deutschen für einen vollständigen und klaren Satz erforderlich.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280.000 Mann
  rationale: Die Zahl lautet genau zweihundertachtzigtausend. „Mann“ verdeutlicht im Kontext der Truppenliste die gemeinte Zählgröße, ohne die Anzahl zu verändern.
