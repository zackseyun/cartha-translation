  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: de
  text: Er stationierte Truppen in allen befestigten Städten Judas und richtete im Land Juda sowie in den Städten Ephraims, die sein Vater Asa erobert hatte, Garnisonen[a] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Statthalter«, »Amtsträger« oder »militärische Posten«. Das hebräische Wort kann eingesetzte Amtsträger ebenso wie militärische Garnisonen bezeichnen; der militärische Zusammenhang legt hier »Garnisonen« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: Er stationierte Truppen
  rationale: נתן bedeutet wörtlich »geben/setzen«, bezeichnet mit חַיִל und einer Ortsangabe hier aber idiomatisch die Stationierung militärischer Kräfte. »Truppen« gibt den militärischen Sinn von חַיִל natürlich wieder.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: in allen befestigten Städten Judas
  rationale: Die Wendung bezeichnet sämtliche befestigten Städte im Gebiet Juda; die deutsche Genitivform ist präzise und flüssig.
- source_word: וַיִּתֵּן נְצִיבִים
  choice: setzte … Statthalter ein
  rationale: נְצִיבִים kann eingesetzte Amtsträger oder militärische Besatzungen bezeichnen. Das Verb »einsetzen« passt zur möglichen administrativen Bedeutung, ohne den militärischen Zusammenhang auszublenden.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: in das Land Juda
  rationale: Bei »einsetzen« ist im Deutschen die zielgerichtete Formulierung mit Akkusativ natürlich; אֶרֶץ bezeichnet das Territorium Juda über die zuvor genannten Städte hinaus.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: und in die Städte Ephraims
  rationale: Die Wiedergabe bewahrt den stammesgeografischen Bezug und parallelisiert die Ortsangabe mit »in das Land Juda«.
- source_word: אֲשֶׁר לָכַד
  choice: die … erobert hatte
  rationale: לכד bezeichnet bei Städten deren militärische Einnahme. Das Plusquamperfekt verdeutlicht, dass Asas Eroberung zeitlich vorausging.
- source_word: אָסָא אָבִיו
  choice: sein Vater Asa
  rationale: Die natürliche deutsche Wortstellung identifiziert Asa eindeutig als Joschafats Vater.
theological_decisions:
- issue: Bedeutung von נְצִיבִים
  choice: Statthalter im Haupttext
  alternative: Besatzungen / Garnisonen
  rationale: Das Substantiv bezeichnet häufig eingesetzte Amtsträger oder Bevollmächtigte, kann in diesem militärisch-territorialen Zusammenhang aber auch Besatzungen meinen. Der Haupttext folgt der personal-administrativen Grundbedeutung; die Fußnote erhält die echte Kontextmehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch idiomatische Verben und deutsche Kasusführung natürlich gestaltet. Die Mehrdeutigkeit von נְצִיבִים wird nicht stillschweigend zugunsten einer ausschließlich militärischen Deutung aufgelöst.
