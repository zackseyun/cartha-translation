  terminology: „Garnisonen“ entspricht dem militärischen Zusammenhang und der englischen Prüfdokumentation besser. Da נְצִיבִים auch eingesetzte Amtsträger bezeichnen kann, wird „Statthalter“ als Fußnotenalternative bewahrt, ohne die kontextuell vorrangige militärische Lesart als einzige Möglichkeit auszugeben.
