  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: de
  text: So festigte Jahwe das Königtum in seiner Hand, und ganz Juda gab Joschafat eine Abgabe[a]. Er besaß Reichtum und Ehre in Fülle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Geschenk, eine Gabe oder einen Tribut. Das hebräische Wort mincha bezeichnet je nach Zusammenhang auch eine Opfergabe; hier spricht der königliche Kontext für eine Abgabe an den König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: festigte
  rationale: Das Hiphil von כון bedeutet hier »fest machen, sichern, festigen«. »Festigte« gibt die Sicherung der königlichen Herrschaft natürlich wieder, ohne sie auf militärische Stärke zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen wissenschaftlichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמַּמְלָכָה
  choice: das Königtum
  rationale: מַמְלָכָה kann sowohl das Königreich als Gebiet als auch Königtum beziehungsweise Königsherrschaft bezeichnen. Zusammen mit »in seiner Hand« steht hier die gesicherte Herrschaft Joschafats im Vordergrund.
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Die konkrete hebräische Metapher bleibt erhalten; sie bezeichnet Verfügung und gesicherte Kontrolle und ist auch im Deutschen verständlich.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: und ganz Juda gab
  rationale: נתן bedeutet schlicht »geben«; »ganz Juda« bezeichnet kollektiv die Bevölkerung beziehungsweise das Gemeinwesen Juda.
- source_word: מִנְחָה
  choice: eine Abgabe
  rationale: מִנְחָה kann Gabe, Geschenk, Opfergabe oder Tribut bezeichnen. Im königlichen Zusammenhang ist eine dem König geleistete Abgabe gemeint; »Abgabe« ist im modernen Deutsch natürlicher als das möglicherweise zwischenstaatlich verstandene »Tribut«.
- source_word: לִיהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: וַיְהִי לוֹ
  choice: Er besaß
  rationale: Die hebräische Besitzkonstruktion »es war ihm« wird idiomatisch mit »er besaß« wiedergegeben.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: עֹשֶׁר bezeichnet materiellen Wohlstand; »Reichtum« entspricht dem würdigen erzählerischen Register.
- source_word: וְכָבוֹד
  choice: und Ehre
  rationale: כָבוֹד meint hier den Rang und das öffentliche Ansehen des Königs, nicht spezifisch göttliche Herrlichkeit.
- source_word: לָרֹב
  choice: in Fülle
  rationale: Die Wendung drückt ein sehr großes Maß aus; »in Fülle« ist knapp, natürlich und stilistisch gehoben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Seine Wiedergabe als »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Gegenstand der göttlichen Festigung
  choice: das Königtum
  alternative: das Königreich
  rationale: Der Ausdruck kann Reich oder Königsherrschaft meinen. Der Kontext der Herrschaft »in seiner Hand« legt den Akzent auf Joschafats gesichertes Königtum, ohne die sachliche Nähe zum Reich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Hand-Metapher bleibt erhalten. Kurze Hauptsätze bewahren den erzählerischen Rhythmus; die Fußnote macht die Bedeutungsbreite von מִנְחָה sichtbar.
