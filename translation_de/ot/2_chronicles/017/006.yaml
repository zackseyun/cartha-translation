base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: de
  text: Sein Herz fasste Mut, den Wegen Jahwes zu folgen[a]. Außerdem beseitigte er die Höhenheiligtümer und die Aschera-Kultgegenstände[b] aus Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sein Herz wurde hoch/erhoben auf den Wegen Jahwes.“ Die hebräische Wendung kann ein erhobenes oder mutig gewordenes Herz bezeichnen; hier ist sie im Zusammenhang positiv gemeint, nicht als Hochmut.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Ascheren“ beziehungsweise „die Aschera-Pfähle“. Gemeint sind Kultobjekte, die mit der Verehrung der Göttin Aschera verbunden waren; ihre genaue Form ist nicht immer sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Sein Herz wurde mutig
  rationale: Das Verb גבהּ bezeichnet wörtlich ein Hoch- oder Erhobensein. In Verbindung mit dem Herzen kann die Wendung Stolz, aber auch Mut und entschlossene Zuversicht ausdrücken. Der positive Zusammenhang spricht hier für Mut; die Wiedergabe mit „Herz“ bewahrt zugleich das hebräische Bild.
- source_word: בְּדַרְכֵי יְהוָה
  choice: auf den Wegen Jahwes
  rationale: Der Plural von דֶּרֶךְ bezeichnet bildhaft Lebensführung und Verhalten. „Auf den Wegen“ erhält dieses im Deutschen verständliche Bild; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וְעוֹד
  choice: Außerdem
  rationale: עוֹד fügt hier eine weitere Handlung hinzu. „Außerdem“ gibt diese additive Funktion natürlich und knapp wieder.
- source_word: הֵסִיר
  choice: beseitigte
  rationale: Die Hifil-Form von סור bedeutet hier, etwas zu entfernen. „Beseitigte“ passt zum Zusammenhang der Kultreform, ohne eine vollständige oder endgültige Vernichtung ausdrücklich zu behaupten.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: בָּמוֹת bezeichnet kultische Opfer- und Verehrungsstätten, häufig auf Anhöhen. „Kulthöhen“ ist für heutige Leser deutlicher als das missverständliche bloße „Höhen“.
- source_word: הָאֲשֵׁרִים
  choice: die Aschera-Kultmale
  rationale: Der Ausdruck bezeichnet Kultobjekte, die mit Aschera verbunden waren; ihre genaue Gestalt ist nicht in jedem Beleg sicher. „Kultmale“ wahrt diese gegenständliche, aber formal offene Bedeutung besser als das engere „Pfähle“.
- source_word: מִיהוּדָה
  choice: aus Juda
  rationale: Die Präposition מִן kennzeichnet den Bereich, aus dem die Kultstätten und Kultobjekte entfernt wurden.
theological_decisions:
- issue: Ob וַיִּגְבַּהּ לִבּוֹ Hochmut oder mutige Entschlossenheit bezeichnet
  choice: positive Ermutigung bzw. Entschlossenheit auf den Wegen Jahwes
  alternative: Sein Herz erhob sich / wurde stolz auf den Wegen Jahwes
  rationale: Die Wendung kann andernorts negativ gebraucht werden. Hier weisen jedoch die nähere Bestimmung „auf den Wegen Jahwes“ und die anschließende Beseitigung fremder Kultstätten auf eine positive Aussage. Die Fußnote hält die bildhafte und grundsätzlich mehrdeutige Ausdrucksweise sichtbar.
- issue: Wie genau הָאֲשֵׁרִים zu bestimmen ist
  choice: Aschera-Kultmale
  alternative: Ascheren; Aschera-Pfähle; heilige Pfähle
  rationale: Der Text spricht von Kultobjekten, die mit Aschera verbunden waren, legt aber ihre genaue Form nicht eindeutig fest. Die gewählte Wiedergabe ist verständlich, ohne die Objekte vorschnell auf Pfähle zu beschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das hebräische Herzbild und die Wegmetapher bleiben erhalten. „Kulthöhen“ und „Aschera-Kultmale“ vermeiden unverständliche Fachsprache, während die Fußnoten echte lexikalische Mehrdeutigkeit dokumentieren.
