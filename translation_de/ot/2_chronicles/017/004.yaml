  source_fidelity: 'Der Text gibt die zentralen Elemente des Hebräischen zutreffend wieder: das kontrastierende bzw. begründende כִּי wird im Kontext sinnvoll mit „sondern“ aufgenommen; „suchte den Gott seines Vaters“, die Lebensführung „nach seinen Geboten“ und die Abgrenzung von Israels Tun bleiben erhalten. „Israel“ wird im Haupttext nicht interpretierend erweitert.'
