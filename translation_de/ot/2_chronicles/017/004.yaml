reference: 2 Chronicles 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: de
  text: sondern[a] er suchte den Gott seines Vaters und lebte nach seinen Geboten, nicht nach dem Tun Israels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er suchte den Gott seines Vaters.“ Das hebräische Bindewort kann auch „denn“ oder „weil“ bedeuten; „sondern“ hebt hier den Gegensatz zum vorhergehenden Vers hervor.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Israel“ ist hier wahrscheinlich das Nordreich im Gegensatz zu Juda gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: sondern
  rationale: Im Zusammenhang steht der Satz im Gegensatz zur vorausgehenden Aussage, dass Joschafat nicht die Baale suchte. Das adversative „sondern“ gibt diesen Zusammenhang im Deutschen natürlich wieder; die häufigere kausale Bedeutung wird in einer Fußnote bewahrt.
- source_word: לֵאלֹהֵי אָבִיו
  choice: den Gott seines Vaters
  rationale: Die Präposition לְ kennzeichnet bei דָּרַשׁ das Objekt der Suche und wird im Deutschen nicht eigens wiedergegeben. Der Singular „seines Vaters“ bleibt erhalten.
- source_word: דָּרָשׁ
  choice: suchte
  rationale: Das Verb bezeichnet hier die hingebungsvolle Hinwendung zu Gott und nicht lediglich das Einholen einer Auskunft.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: lebte nach seinen Geboten
  rationale: Wörtlich steht „ging in seinen Geboten“. Die gewählte Formulierung gibt die hebräische Metapher für die Lebensführung in natürlichem, modernem Deutsch wieder.
- source_word: כְּמַעֲשֵׂה
  choice: nach dem Tun
  rationale: מַעֲשֶׂה bezeichnet hier das Handeln beziehungsweise die Lebenspraxis. „Tun“ bleibt nah am Hebräischen und passt zur Wendung „nach … leben“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt schlicht „Israel“. Eine Präzisierung als Nordreich wäre kontextuell plausibel, würde aber die Auslegung in den Haupttext verlagern.
theological_decisions:
- issue: Bezug von „Israel“
  choice: „Israel“ ohne erläuternden Zusatz im Haupttext
  alternative: „das Nordreich Israel“ oder „das Haus Ahabs“
  rationale: Wahrscheinlich ist hier das Nordreich im Gegensatz zu Juda gemeint. Da der Ausgangstext den Bezug jedoch nicht ausdrücklich ausführt, bleibt die mögliche Spannung im Haupttext erhalten und wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Lebte nach“ vermeidet das im heutigen Deutsch unnatürliche „ging in“, bewahrt aber den Sinn der hebräischen Lebenswandel-Metapher. Die Satzform bleibt knapp und folgt der Struktur des Ausgangstextes.
