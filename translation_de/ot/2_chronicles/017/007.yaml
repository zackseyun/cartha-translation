  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: de
  text: Im dritten Jahr seiner Herrschaft sandte er seine Amtsträger[a] Ben-Hajil, Obadja, Sacharja, Netanel und Michaja aus, um in den Städten Judas zu lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Fürsten“ beziehungsweise „seine führenden Männer“. Das hebräische Wort kann königliche oder administrative Amtsträger und andere Führungspersonen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Im dritten Jahr seiner Herrschaft
  rationale: Die Zeitangabe wird im Deutschen natürlich ohne einleitendes „Und“ wiedergegeben. „Seiner Herrschaft“ bezeichnet idiomatisch die Zeit seines Regierens.
- source_word: שָׁלַח
  choice: sandte ... aus
  rationale: Das trennbare Verb „aussenden“ gibt die Beauftragung der namentlich genannten Vertreter in natürlichem Deutsch wieder.
- source_word: לְשָׂרָיו
  choice: seine Amtsträger
  rationale: שַׂר kann Fürst, führender Mann oder königlicher beziehungsweise administrativer Amtsträger bedeuten. Im Zusammenhang einer königlichen Lehrmission bezeichnet „Amtsträger“ ihre Funktion klar, ohne eine königliche Abstammung vorauszusetzen.
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Ben-Hajil, Obadja, Sacharja, Netanel und Michaja
  rationale: Die Personennamen werden nach geläufigen deutschen beziehungsweise hebräisch nahen Namensformen wiedergegeben.
- source_word: לְלַמֵּד
  choice: um ... zu lehren
  rationale: Der Piel-Infinitiv von למד bedeutet hier „lehren“; die deutsche Finalkonstruktion gibt den Zweck des Aussendens wieder.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Präposition bezeichnet den Ort. Die Formulierung bewahrt den schlichten Sinn, ohne das nur mögliche verteilende „in allen Städten“ hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensreihe steht als Apposition zu „Amtsträger“. Der Fußnotenmarker wurde unmittelbar an das mehrdeutige Wort gesetzt, auf das sich die Anmerkung bezieht.
