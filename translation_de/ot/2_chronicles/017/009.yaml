  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: de
  text: Sie lehrten in Juda, und das Buch des Gesetzes Jahwes[a] war bei ihnen. Sie zogen durch alle Städte Judas und lehrten das Volk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schriftrolle des Gesetzes Jahwes«. Das hebräische Wort kann ein schriftliches Dokument in Rollenform bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »lehrten unter dem Volk«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: sie lehrten
  rationale: Der Piel von למד bedeutet hier »lehren« oder »unterweisen«. »Lehrten« gibt das wiederholte Verb knapp und natürlich wieder.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition bezeichnet zunächst den Ort. Der folgende Satz entfaltet dann, dass sie durch sämtliche Städte Judas zogen.
- source_word: וְעִמָּהֶם סֵפֶר תּוֹרַת יְהוָה
  choice: und sie hatten das Buch des Gesetzes Jahwes bei sich
  rationale: 'Die hebräische Nominalkonstruktion bedeutet wörtlich etwa: »und bei ihnen [war] das Buch …«. Die deutsche Fassung bewahrt den Begleitsinn in natürlicher Satzform.'
- source_word: סֵפֶר
  choice: Buch
  rationale: סֵפֶר bezeichnet ein Schriftstück beziehungsweise Buch und kann im historischen Kontext auch eine Schriftrolle meinen; die geläufige Wiedergabe »Buch« bleibt im Text, die Alternative steht in der Fußnote.
- source_word: תּוֹרַת
  choice: des Gesetzes
  rationale: תּוֹרָה kann allgemein »Weisung« bedeuten, bezeichnet in dieser Verbindung jedoch die maßgebliche göttliche Gesetzesüberlieferung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּסֹבּוּ
  choice: sie zogen durch
  rationale: סבב beschreibt hier das Umherziehen von Ort zu Ort; zusammen mit den Städten ist »zogen durch« idiomatisches Deutsch.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: durch alle Städte Judas
  rationale: Beim Bewegungsverb gibt »durch« den Rundgang durch die Städte passend wieder. Der Genitiv von »Juda« lautet »Judas«.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: und lehrten unter dem Volk
  rationale: 'Die Präposition ב wird sichtbar bewahrt: Das Lehren geschieht unter beziehungsweise innerhalb des Volkes, auch wenn sinngemäß zugleich das Volk unterrichtet wird.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt es als persönlichen Gottesnamen, statt es durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: »Gesetz« entspricht in der festen Verbindung »Buch des Gesetzes Jahwes« dem Bezug auf die schriftlich überlieferte göttliche Norm. Die grundsätzlich weitere Bedeutung »Weisung« wird dadurch nicht bestritten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzfolge des Hebräischen bleibt erhalten; die elliptische Nominalklausel wird für natürliches Deutsch verbal ausgedrückt. »Unter dem Volk« bewahrt bewusst die Präposition und damit eine leichte Mehrdeutigkeit zwischen Ort und Adressatenkreis.
