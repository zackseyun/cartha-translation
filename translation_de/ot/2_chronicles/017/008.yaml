source:
  edition: WLC
  text: וְ/עִמָּ/הֶ֣ם הַ/לְוִיִּ֗ם שְֽׁמַֽעְיָ֡הוּ וּ/נְתַנְיָ֡הוּ וּ/זְבַדְיָ֡הוּ וַ/עֲשָׂהאֵ֡ל ו/שמרימות וִֽ/יהוֹנָתָן֩ וַ/אֲדֹ֨נִיָּ֧הוּ וְ/טֽוֹבִיָּ֛הוּ וְ/ט֥וֹב אֲדוֹנִיָּ֖ה הַ/לְוִיִּ֑ם וְ/עִמָּ/הֶ֛ם אֱלִישָׁמָ֥ע וִֽ/יהוֹרָ֖ם הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: de
  text: Mit ihnen waren die Leviten Schemaja, Netanja, Sebadja, Asaël, Schemiramot, Jehonatan[a], Adonija, Tobija[b] und Tob-Adonija[c]; und mit ihnen waren die Priester Elischama und Joram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Jehonatan, die längere Form des Namens; häufig wird auch die kürzere Form Jonatan verwendet.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Tobijahu; Tobija ist die gebräuchliche deutsche Namensform.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch »Tob Adonija«, wahrscheinlich ein einziger zusammengesetzter Personenname.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Mit ihnen waren
  rationale: Die Präpositionalphrase bezeichnet die begleitenden Personen; das im Hebräischen unausgesprochene Verb wird für natürliches Deutsch ergänzt.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Der bestimmte Artikel und die institutionelle Bezeichnung werden ausdrücklich wiedergegeben.
- source_word: שְׁמַעְיָהוּ
  choice: Schemaja
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: נְתַנְיָהוּ
  choice: Netanja
  rationale: Im Deutschen gebräuchliche Wiedergabe des hebräischen Personennamens.
- source_word: זְבַדְיָהוּ
  choice: Sebadja
  rationale: Konventionelle deutsche Namensform.
- source_word: עֲשָׂהאֵל
  choice: Asaël
  rationale: Die Trema-Schreibung macht die getrennte Aussprache der Vokale im Deutschen deutlich.
- source_word: שמרימות
  choice: Schemiramot
  rationale: Transliteration des im Konsonantentext überlieferten Personennamens in einer im Deutschen gut lesbaren Form.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Die längere hebräische Namensform wird bewahrt und nicht zur geläufigeren Kurzform Jonatan verkürzt.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: טוֹבִיָּהוּ
  choice: Tobija
  rationale: Gebräuchliche deutsche Form, die den theophoren Namensbestandteil in konventioneller Weise wiedergibt.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tob-Adonija
  rationale: Die zwei graphisch getrennten Bestandteile werden als wahrscheinlich zusammengehöriger Personenname mit Bindestrich wiedergegeben, ohne die Form des Hebräischen zu verdecken.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die abschließende Apposition kennzeichnet Elischama und Joram ausdrücklich als eigene Gruppe von Priestern.
theological_decisions:
- issue: Unterscheidung zwischen Leviten und Priestern
  choice: Die zuerst genannten Personen werden als Leviten, Elischama und Joram gesondert als Priester bezeichnet.
  alternative: Alle genannten Personen ohne gesonderte Zuordnung als Leviten auffassen.
  rationale: Die wiederholte Wendung וְעִמָּהֶם und die abschließende Bezeichnung הַכֹּהֲנִים unterscheiden im hebräischen Satz klar zwischen den beiden Gruppen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des Hebräischen bleibt erhalten; nur das für einen vollständigen deutschen Satz notwendige Verb »waren« wird ergänzt. Die Fußnoten stehen jeweils unmittelbar bei dem Namen, auf den sie sich beziehen.
