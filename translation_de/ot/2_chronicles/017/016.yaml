  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: de
  text: Unter seinem Befehl stand Amasja, der Sohn Sichris, der sich freiwillig Jahwe zur Verfügung stellte,[a] und mit ihm waren 200.000 tapfere Krieger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der sich Jahwe freiwillig darbrachte«. Das hebräische Partizip betont die freiwillige Selbsthingabe; die Präposition kann eine Hingabe an Jahwe oder einen Dienst für ihn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Unter seinem Befehl stand
  rationale: Die Wendung עַל יָד mit Suffix bezeichnet in dieser militärischen Aufstellung die Unterstellung unter die zuvor genannte Führungsperson. Die deutsche Formulierung gibt diese Funktion natürlich wieder.
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: Amasja, der Sohn Sichris
  rationale: Die Personennamen werden in geläufiger deutscher Bibelnamensform wiedergegeben; בֶן bezeichnet das Sohnverhältnis.
- source_word: הַמִּתְנַדֵּב
  choice: der sich freiwillig … zur Verfügung stellte
  rationale: Das Hitpael-Partizip von נדב bezeichnet eine freiwillige Selbsthingabe oder Selbstverpflichtung. Die reflexive Formulierung bewahrt diesen Akzent und klingt im Deutschen natürlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet Ziel oder Widmung der freiwilligen Selbstverpflichtung; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: וְעִמּוֹ מָאתַיִם אֶלֶף
  choice: und mit ihm waren 200.000
  rationale: וְעִמּוֹ führt die Amasja zugeordneten Truppen ein; das im Hebräischen fehlende Verb wird für idiomatisches Deutsch ergänzt.
- source_word: גִּבּוֹר חָיִל
  choice: kampferprobte Männer
  rationale: Die feste militärische Wendung bezeichnet leistungsfähige, tüchtige und tapfere Krieger. »Kampferprobte Männer« vermittelt dies verständlich und würdig, ohne die altertümliche Formulierung »Helden der Tapferkeit«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich stehende Bundesname erkennbar bleibt.
- issue: Bedeutung der freiwilligen Hingabe Amasjas
  choice: der sich freiwillig Jahwe zur Verfügung stellte
  alternative: der sich Jahwe freiwillig darbrachte
  rationale: Die Übersetzung bewahrt die freiwillige Selbstverpflichtung, legt aber nicht unnötig fest, ob eine kultische Darbringung oder vor allem die freiwillige Übernahme des militärischen Dienstes gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärisch-administrative Beziehung wird klar ausgedrückt; die mögliche kultische Färbung der freiwilligen Selbsthingabe bleibt in der Fußnote sichtbar.
