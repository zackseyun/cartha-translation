base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: de
  text: 'Und dies war ihre Heeresaufstellung[a] nach ihren Großfamilien: Für Juda: Adna, der Befehlshaber über Tausendschaften, und mit ihm 300.000 tapfere Krieger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Musterung“, „ihre Zahl“ oder „ihre Einteilung“. Das hebräische Wort kann die Erfassung der Truppen, deren Zahl oder ihre daraus hervorgehende Gliederung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: ihre Heeresaufstellung
  rationale: Das von פקד abgeleitete Substantiv kann im militärischen Zusammenhang die Musterung, die dabei ermittelte Zahl oder die daraus hervorgehende Gliederung bezeichnen. „Heeresaufstellung“ passt zur anschließenden Liste von Befehlshabern und Truppenstärken, ohne den Ausdruck auf eine bloße Zahl zu verengen.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: nach ihren Großfamilien
  rationale: Die Wendung bezeichnet die genealogisch-administrative Ordnung nach Vaterhäusern. „Großfamilien“ gibt diese soziale Einheit in verständlichem modernem Deutsch wieder.
- source_word: לִיהוּדָה
  choice: für Juda
  rationale: Die Präposition leitet hier den zu Juda gehörenden Teil des militärischen Verzeichnisses ein.
- source_word: שָׂרֵי אֲלָפִים
  choice: die Befehlshaber über Tausendschaften
  rationale: Der Ausdruck bezeichnet militärische Führer von Einheiten, die als Tausendschaften gegliedert oder gezählt wurden. Die Wiedergabe bleibt funktional und vermeidet einen zu modernen spezifischen Dienstgrad.
- source_word: עַדְנָה הַשָּׂר
  choice: der Befehlshaber Adna
  rationale: Der Titel שׂר kennzeichnet Adna als militärischen Führer; die deutsche Wortstellung ist natürlich und bewahrt den Titel.
- source_word: גִּבּוֹרֵי חַיִל
  choice: kampfstarke Männer
  rationale: Die feste militärische Wendung bezeichnet tüchtige, kräftige und bewährte Kämpfer. „Kampfstarke Männer“ ist gegenwärtig, klar und weniger altertümlich als „tapfere Helden“.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: '300.000'
  rationale: Die hebräische Kardinalzahl wird direkt und in der im modernen Deutschen üblichen Ziffernschreibweise wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Militärische Verwaltungsbegriffe werden verständlich wiedergegeben; „Tausendschaften“ wahrt zugleich den antiken Charakter der Einheiten. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen hebräischen Ausdruck.
