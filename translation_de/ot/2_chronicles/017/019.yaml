  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch. „Diese standen im Dienst des Königs“ und „in den befestigten Städten in ganz Juda“ lesen sich klar und angemessen würdig.
  terminology: „Befestigte Städte“ gibt עָרֵי הַמִּבְצָר treffend wieder. „Im Dienst des Königs stehen“ ist für מְשָׁרְתִים natürlich und vermeidet unangemessen kultische Terminologie. „Zusätzlich zu“ bildet מִלְּבַד als additive Abgrenzung angemessen ab.
