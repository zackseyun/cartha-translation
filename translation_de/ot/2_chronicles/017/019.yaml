base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: de
  text: Diese standen im Dienst des Königs, zusätzlich zu denen, die der König in den befestigten Städten in ganz Juda stationiert hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese alle
  rationale: Das Demonstrativpronomen weist zusammenfassend auf die zuvor aufgezählten Befehlshaber und Truppen zurück; „alle“ verdeutlicht im Deutschen diese rückbezügliche Zusammenfassung, ohne eine neue Gruppe einzuführen.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: standen im Dienst des Königs
  rationale: Das Partizip von שׁרת bezeichnet Dienst beziehungsweise Aufwartung, oft in offizieller Funktion. Die Formulierung ist im militärisch-administrativen Zusammenhang natürlich und bewahrt den fortdauernden Dienstcharakter.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Wendung grenzt die zuvor genannten Kräfte von einer weiteren, ebenfalls dem König unterstehenden Gruppe ab. „Zusätzlich zu“ macht den hier additiven Sinn klar.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: die der König … eingesetzt hatte
  rationale: נתן bedeutet grundlegend „geben, setzen, stellen“. Im Zusammenhang militärischer Besatzungen bezeichnet es ihre Zuweisung an befestigte Städte; „eingesetzt“ bleibt etwas allgemeiner als „stationiert“ und gibt die Funktion passend wieder.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: in den befestigten Städten
  rationale: Die Konstruktverbindung bezeichnet zur Verteidigung befestigte Städte. „Befestigte Städte“ ist die geläufige und sachlich genaue deutsche Wiedergabe.
- source_word: בְּכָל יְהוּדָה
  choice: in ganz Juda
  rationale: ב mit כל bezeichnet hier die umfassende räumliche Verteilung über das Gebiet Judas; die deutsche Wendung ist präzise und idiomatisch.
