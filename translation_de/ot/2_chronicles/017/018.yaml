  text: וְ/עַל יָד֖/וֹ יְהוֹזָבָ֑ד וְ/עִמּ֛/וֹ מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/018.yaml
  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: de
  text: Und an seiner Seite stand Jehosabad,[a] und bei ihm waren 180.000 zum Krieg gerüstete Männer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an seiner Hand“; die Wendung kann auch eine Stellung unter seiner Leitung oder unmittelbar neben ihm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „180.000 für den Heeresdienst ausgerüstete Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Und an seiner Seite stand
  rationale: Die Wendung bedeutet wörtlich „an seiner Hand“ und bezeichnet hier wahrscheinlich die Zuordnung beziehungsweise Stellung neben dem zuvor genannten Befehlshaber. „An seiner Seite“ bewahrt diese Offenheit besser als das stärker deutende „unter seinem Befehl“.
- source_word: יְהוֹזָבָד
  choice: Jehosabad
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וְעִמּוֹ
  choice: und bei ihm waren
  rationale: עִם bezeichnet Begleitung oder Zuordnung; „bei ihm“ klingt in der Aufzählung natürlich und legt keine genauere Rangordnung fest.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: '180.000'
  rationale: Die eindeutige Zahl wird in einer militärischen Aufstellung zur schnellen Erfassbarkeit mit Ziffern geschrieben.
- source_word: חֲלוּצֵי צָבָא
  choice: zum Krieg gerüstete Männer
  rationale: חֲלוּצֵי bezeichnet ausgerüstete beziehungsweise kampfbereit aufgestellte Männer, während צָבָא den militärischen Einsatz oder Krieg bezeichnet. Die Formulierung bildet beide Bestandteile ab, ohne mehr als Bewaffnung und Einsatzbereitschaft zu behaupten.
