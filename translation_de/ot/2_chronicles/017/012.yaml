base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: de
  text: Joschafat gewann immer mehr an Größe. Er baute in Juda Festungen[a] und Vorratsstädte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zitadellen«. Das hebräische Wort bezeichnet befestigte Anlagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Lagerstädte« beziehungsweise »Versorgungsstädte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: wurde immer mächtiger
  rationale: Die Verbindung aus וַיְהִי und den Partizipien הֹלֵךְ וְגָדֵל bezeichnet eine fortschreitende Zunahme; עַד לְמָעְלָה verstärkt sie. Im Zusammenhang ist damit Joschafats Macht und Stellung gemeint. Die deutsche Formulierung gibt den fortdauernden Aufstieg natürlich und knapp wieder.
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Die übliche, direkte Wiedergabe von בנה im erzählenden Zusammenhang.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präpositionalverbindung bezeichnet den Ort der Bautätigkeit.
- source_word: בִּירָנִיּוֹת
  choice: Festungen
  rationale: Das seltene Wort bezeichnet befestigte Anlagen oder starke Wehrbauten. „Festungen“ ist im modernen Deutsch klar und vermeidet die mittelalterlichen Nebenbedeutungen von „Burgen“.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: Vorratsstädte
  rationale: Die Wendung bezeichnet Städte, die der Lagerung von Vorräten beziehungsweise Versorgungsgütern dienten. „Vorratsstädte“ ist verständlich und bewahrt den administrativ-logistischen Sinn.
