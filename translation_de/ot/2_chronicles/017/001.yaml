  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: de
  text: Und sein Sohn Joschafat wurde an seiner Stelle König. Er stärkte sich gegen Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Gibt den Regierungsantritt im Deutschen natürlich und genau wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Entspricht der Nachfolgeformel und wahrt den Bezug auf den vorherigen König.
- source_word: וַיִּתְחַזֵּק
  choice: stärkte seine Stellung
  rationale: Das reflexive Verb bezeichnet hier ein Sich-Festigen beziehungsweise die Stärkung der eigenen Machtposition.
- source_word: עַל יִשְׂרָאֵל
  choice: gegenüber Israel
  rationale: עַל kann in diesem Zusammenhang feindlich ‚gegen‘ bedeuten, lässt aber auch die allgemeinere relationale Nuance ‚gegenüber‘ zu; die Formulierung bewahrt diese mögliche Spannung.
theological_decisions:
- issue: Verhältnis Joschafats zum Nordreich Israel
  choice: gegenüber Israel
  alternative: gegen Israel
  rationale: Der Kontext kann militärische Sicherung gegen Israel nahelegen. Der hebräische Vers selbst nennt jedoch keine konkrete Kampfhandlung; daher wird die Relation nicht stärker zugespitzt als nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz folgt der deutschen Erzählweise; der zweite vermeidet das unnatürliche ‚stärkte sich‘ und macht die gemeinte Festigung der königlichen Stellung deutlich.
