  text: וּ/מְלָאכָ֥ה רַבָּ֛ה הָ֥יָה ל֖/וֹ בְּ/עָרֵ֣י יְהוּדָ֑ה וְ/אַנְשֵׁ֧י מִלְחָמָ֛ה גִּבּ֥וֹרֵי חַ֖יִל בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/013.yaml
  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: de
  text: In den Städten Judas hatte er umfangreiche Arbeiten[a]. In Jerusalem hatte er Kriegsleute, tapfere Krieger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: viel Arbeit; das hebräische Wort kann Arbeit, Tätigkeit oder Werk bezeichnen.'
    reason: Die genaue Art und syntaktische Auffassung der מְלָאכָה wird im Vers nicht ausdrücklich festgelegt.
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: umfangreiche Arbeiten
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder ein ausgeführtes Werk. Im Zusammenhang mit den befestigten Städten gibt „umfangreiche Arbeiten“ den naheliegenden Sinn wieder, ohne die Tätigkeit näher zu bestimmen, als es der hebräische Text tut.
- source_word: הָיָה לוֹ
  choice: Er ließ … ausführen / hatte er
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich „ihm war“. Bei den Arbeiten ist die natürliche deutsche Wiedergabe „er ließ … ausführen“; bei den Männern entspricht ihr „hatte er“.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: Kriegsmänner
  rationale: Die formnahe Wiedergabe bewahrt die Bezeichnung für zum Krieg bestimmte beziehungsweise erfahrene Männer und unterscheidet sie von der folgenden Charakterisierung.
- source_word: גִּבּוֹרֵי חַיִל
  choice: tapfere Krieger
  rationale: Die feste Verbindung bezeichnet kampfstarke, tüchtige oder tapfere Männer. „Tapfere Krieger“ ist im Deutschen verständlich und wahrt den militärischen Kontext.
