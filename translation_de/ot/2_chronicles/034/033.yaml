source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: de
  text: Josia beseitigte alle Gräuel aus sämtlichen Gebieten, die den Israeliten gehörten,[a] und er veranlasste alle, die sich in Israel befanden, Jahwe, ihrem Gott, zu dienen.[b] Solange Josia lebte, wandten sie sich nicht davon ab, Jahwe, dem Gott ihrer Väter, zu folgen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus allen Ländern, die den Söhnen Israels gehörten«; gemeint sind die israelitischen Gebiete.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und er brachte alle, die sich in Israel befanden, dazu, Jahwe, ihrem Gott, zu dienen«. Das hebräische Verb steht in einer kausativen Form.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »alle seine Tage«. Das Einzahlpronomen bezieht sich auf Josia: Während seiner Lebenszeit beziehungsweise Herrschaft wich das Volk nicht von der Nachfolge Jahwes ab.'
    reason: referent_clarification
lexical_decisions:
- source_word: וַיָּסַר
  choice: beseitigte
  rationale: Das Hifil von סור bedeutet hier »entfernen/beseitigen«. »Beseitigte« bezeichnet Josias aktives Vorgehen im Reformkontext klar und natürlich.
- source_word: הַתּוֹעֵבוֹת
  choice: Gräuel
  rationale: תּוֹעֵבוֹת bezeichnet Abscheuliches, hier besonders götzendienerische Gegenstände oder Praktiken. »Gräuel« bewahrt die starke kultische und bundestheologische Wertung.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: aus sämtlichen Gebieten, die den Israeliten gehörten
  rationale: Der Plural אֲרָצוֹת meint hier Länder beziehungsweise Gebiete. Die Zugehörigkeitskonstruktion mit ל wird verständlich wiedergegeben, ohne das im Deutschen missverständliche »Söhne Israels« zu erzwingen.
- source_word: וַיַּעֲבֵד
  choice: er veranlasste … zu dienen
  rationale: Das Hifil von עבד ist kausativ. »Veranlasste« wahrt Josias aktive, obrigkeitliche Einwirkung, ohne eine ausdrücklich gewaltsame Nötigung zu behaupten.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: alle, die sich in Israel befanden
  rationale: Das Nifal-Partizip von מצא lautet wörtlich »die Gefundenen«, bezeichnet hier aber idiomatisch alle, die sich im Land befanden. Die deutsche Formulierung ist quellennah und vermeidet die falsche Vorstellung einer Suche.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: Jahwe, ihrem Gott, zu dienen
  rationale: עבד umfasst im Bezug auf Gott kultische Verehrung und umfassenden Bundesdienst. »Dienen« erhält diese Bedeutungsbreite besser als nur »anbeten«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: כָּל יָמָיו
  choice: Solange Josia lebte
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf Josia. Die idiomatische Wiedergabe macht den Bezug im Deutschen eindeutig, ohne über den hebräischen Sinn hinauszugehen.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: wandten sie sich nicht davon ab, Jahwe … zu folgen
  rationale: Die Verbindung von סור und מֵאַחֲרֵי bezeichnet das Abweichen von der Nachfolge. Die Formulierung bewahrt sowohl das Bewegungsbild als auch den Gedanken der Bundestreue.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: dem Gott ihrer Väter
  rationale: Die traditionelle Bundesformel wird entsprechend dem ausdrücklich männlichen אֲבוֹת als »Gott ihrer Väter« bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. Die Transliteration bewahrt diesen als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Stärke der kausativen Aussage וַיַּעֲבֵד
  choice: er veranlasste alle … zu dienen
  alternative: er zwang alle … zu dienen
  rationale: Der Kausativ zeigt, dass Josia den Dienst an Jahwe aktiv durchsetzte. »Veranlasste« erhält diese Verantwortlichkeit, legt aber keine im Verb nicht ausdrücklich bezeichnete Art des Zwangs fest.
- issue: Bezugsgröße von כָּל יָמָיו
  choice: Solange Josia lebte
  alternative: Während all ihrer Tage
  rationale: Das Suffix ist maskulin Singular und verweist grammatisch auf Josia; das folgende Subjekt »sie« bleibt plural. Die Übersetzung macht diese Spannung transparent und bezieht die Aussage nicht fälschlich auf die gesamte Lebenszeit des Volkes.
- issue: Familienformel אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Gott ihrer Väter
  alternative: Gott ihrer Vorfahren
  rationale: »Väter« wahrt die konkrete patriarchale Bundesformel des Hebräischen; »Vorfahren« wäre inklusiver, aber weniger formal genau.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit moderat gegliedert. »Gräuel«, »Jahwe« und »Gott ihrer Väter« erhalten die starke kultische beziehungsweise bundestheologische Sprache; schwerfällige Hebraismen werden in den Fußnoten dokumentiert.
