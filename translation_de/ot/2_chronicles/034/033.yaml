  terminology: »Jahwe«, »Gräuel«, »dienen« und »Gott ihrer Väter« sind quellentreu und im gewählten Register passend. »Israeliten« ist hier eine natürliche deutsche Wiedergabe von בני ישראל und verzichtet ohne Sinnverlust auf eine im Deutschen unnötig sperrige Familienformel.
