  source_fidelity: 'Die Übersetzung gibt die hebräischen Aussagen vollständig und sachgerecht wieder: Josias Entfernen der תּוֹעֵבוֹת, die Gebiete Israels, sein kausatives Veranlassen zum Dienst für Jahwe sowie die an Josias Lebenszeit gebundene anhaltende Treue des Volkes. »Solange Josia lebte« trifft כָּל־יָמָיו idiomatisch und verdeutlicht den Singularbezug angemessen.'
