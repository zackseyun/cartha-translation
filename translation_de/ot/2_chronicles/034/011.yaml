  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: de
  text: Und sie gaben es den Handwerkern und den Bauleuten zum Kauf von Steinen aus dem Steinbruch[a] und Bauholz für die Verbindungen[b] und zum Decken[c] der Gebäude, die die Könige von Juda beschädigt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „behauene Steine“. Die hebräische Wendung bezeichnet Steine aus einem Steinbruch, die für Bauarbeiten bestimmt waren.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck ist unsicher. Gemeint sein können Verbindungen, Verbindungsstücke oder Teile des Tragwerks.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Einziehen von Balken“ beziehungsweise „zum Überdecken“. Das hebräische Verb kann das Decken eines Bauwerks mit Balken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: sie gaben es
  rationale: נתן bedeutet „geben“. Das im Hebräischen unausgesprochene Objekt wird aus dem vorangehenden Zusammenhang als das Geld beziehungsweise die Mittel ergänzt; im Deutschen ist dies für einen natürlichen Satz erforderlich.
- source_word: חָרָשִׁים
  choice: Handwerker
  rationale: Das Wort bezeichnet qualifizierte Facharbeiter verschiedener Gewerke. „Handwerker“ wahrt diese Breite, ohne sie auf Zimmerleute oder Steinmetze einzuengen.
- source_word: בֹּנִים
  choice: Bauleute
  rationale: Das substantivierte Partizip von בנה bezeichnet Menschen, die mit dem Bauen beschäftigt sind. „Bauleute“ ist direkt und unterscheidet sie natürlich von den Handwerkern.
- source_word: לִקְנוֹת
  choice: damit sie … kauften
  rationale: Der Infinitiv von קנה drückt hier den Zweck der Geldübergabe aus. Ein deutscher Finalsatz ist an dieser Stelle flüssiger als „um … zu kaufen“ mit einem potenziell unklaren Subjekt.
- source_word: אַבְנֵי מַחְצֵב
  choice: Bruchsteine
  rationale: Die Wendung bezeichnet aus einem Steinbruch gewonnenes Baumaterial. „Bruchsteine“ ist im Deutschen ein geläufiger bautechnischer Ausdruck; ob die Steine bereits weiter behauen waren, bleibt offen.
- source_word: עֵצִים
  choice: Bauholz
  rationale: Im Bauzusammenhang bezeichnet das allgemeine Wort für Holz hier Holz als Konstruktionsmaterial. „Bauholz“ gibt diese Funktion präzise und natürlich wieder.
- source_word: לַמְחַבְּרוֹת
  choice: für die Verbindungsarbeiten
  rationale: Der seltene und unsichere Ausdruck hängt mit dem Verb „verbinden“ zusammen und dürfte Verbindungen, Gefüge oder entsprechende Bauteile bezeichnen. Die Wiedergabe bleibt bewusst funktional und vermeidet eine nicht gesicherte architektonische Festlegung.
- source_word: וּלְקָרוֹת
  choice: zum Decken
  rationale: Das Verb קרה bezeichnet beim Bauen das Bedecken beziehungsweise das Einziehen von Balken oder eines Daches. „Zum Decken“ erhält den Handlungssinn und lässt die genaue Konstruktion offen.
- source_word: הַבָּתִּים
  choice: die Gebäude
  rationale: בית kann „Haus“ heißen, bezeichnet hier im Zusammenhang der Tempelreparatur aber bauliche Anlagen. „Gebäude“ vermeidet die Vorstellung gewöhnlicher Wohnhäuser, ohne ausdrücklich „Tempelgebäude“ in den Text einzutragen.
- source_word: הִשְׁחִיתוּ
  choice: hatten verfallen lassen
  rationale: Der Hifil von שחת kann „zerstören“, „verderben“ oder „zugrunde richten“ bedeuten. Im Reparaturzusammenhang gibt „verfallen lassen“ die von früheren Königen verursachte Verwahrlosung wieder, ohne eine völlige Zerstörung zu behaupten.
- source_word: מַלְכֵי יְהוּדָה
  choice: die Könige von Juda
  rationale: Direkte und im modernen Deutschen übliche Wiedergabe der hebräischen Genitivverbindung.
