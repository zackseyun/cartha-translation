  verdict: revise
  source_fidelity: 'Der Sinn des Verses ist insgesamt getroffen. Zwei Formulierungen sollten jedoch näher am Hebräischen bleiben: Der Finalsatz mit „damit sie ... kauften“ ist grammatisch und referenziell weniger klar als eine nominale Zweckangabe; außerdem legt „hatten verfallen lassen“ ein bloßes Zulassen von Verfall nahe, während הִשְׁחִיתוּ eine aktiv verursachte Schädigung bzw. Zerrüttung bezeichnet.'
  naturalness: „Bauleute“, „Bauholz“ und „zum Decken der Gebäude“ sind in modernem Standarddeutsch gut verständlich. „Zum Kauf von“ ist hier idiomatischer und klarer als der bisherige Finalsatz. „Steine aus dem Steinbruch“ ist transparenter als das fachsprachlich enger verstandene „Bruchsteine“.
  terminology: „Handwerker“, „Bauleute“, „Juda“ und „Gebäude“ sind angemessen. Für לַמְחַבְּרוֹת wahrt „für die Verbindungen“ die architektonische Unsicherheit besser als „für die Verbindungsarbeiten“, das ausdrücklich Arbeitsvorgänge einträgt. „beschädigt hatten“ gibt שחת im Reparaturkontext angemessen wieder, ohne vollständige Zerstörung oder bloße Vernachlässigung zu behaupten.
