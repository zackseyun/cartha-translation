    issue: „damit sie ... kauften“
    rationale: Der finale Nebensatz steht mit indikativischem Präteritum und kann syntaktisch weniger klar wirken. Die hebräische Infinitivkonstruktion lässt sich präzise und natürlich mit „zum Kauf von“ wiedergeben.
  - severity: medium
    issue: „hatten verfallen lassen“ für הִשְׁחִיתוּ
    rationale: Die deutsche Wendung betont unterlassene Pflege. Der Hifil von שחת beschreibt dagegen ein verursachtes Verderben bzw. Beschädigen; die aktivere, aber nicht übersteigerte Wiedergabe „beschädigt hatten“ passt besser.
  - severity: low
    issue: „Bruchsteine“
    rationale: Der Ausdruck kann speziell unregelmäßig gebrochene Natursteine bezeichnen. „Steine aus dem Steinbruch“ gibt die Grundbedeutung von אַבְנֵי מַחְצֵב ohne zusätzliche Aussage über Form oder Bearbeitung wieder.
  - severity: low
    issue: „Verbindungsarbeiten“
    rationale: Der seltene hebräische Plural bezeichnet wahrscheinlich Verbindungen oder Bauelemente, doch die genaue Referenz ist unsicher. „Verbindungen“ bewahrt diese Offenheit besser als eine Festlegung auf Arbeiten.
