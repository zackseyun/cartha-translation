- from: Und sie gaben es den Handwerkern und den Bauleuten, damit sie Bruchsteine[a] und Bauholz für die Verbindungsarbeiten[b] und zum Decken[c] der Gebäude kauften, die die Könige von Juda hatten verfallen lassen.
  to: Und sie gaben es den Handwerkern und den Bauleuten zum Kauf von Steinen aus dem Steinbruch[a] und Bauholz für die Verbindungen[b] und zum Decken[c] der Gebäude, die die Könige von Juda beschädigt hatten.
