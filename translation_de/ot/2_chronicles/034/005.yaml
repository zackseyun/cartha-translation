  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: de
  text: Er verbrannte die Gebeine der Priester auf ihren Altären[a] und reinigte Juda und Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Altären“. Die hebräische Form ist hier ungewöhnlich; gemeint ist offenbar, dass Josia die Gebeine der Priester auf den mit ihnen verbundenen Altären verbrannte.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: die Gebeine der Priester
  rationale: עַצְמוֹת ist der Konstruktplural von עֶצֶם und bezeichnet hier wörtlich Knochen. „Gebeine“ ist im Deutschen für die sterblichen Überreste Verstorbener natürlich und würdig. Das einleitende וְ wird nicht eigens mit „und“ wiedergegeben, da der Versausschnitt im Deutschen so flüssiger beginnt.
- source_word: שָׂרַף
  choice: verbrannte
  rationale: Das Qal Perfekt 3. Person maskulin Singular bedeutet „verbrennen“. Das Präteritum entspricht dem deutschen Erzählstil.
- source_word: עַל מזבחותים
  choice: auf ihren Altären
  rationale: עַל bedeutet hier „auf“. Die ungewöhnliche Form מזבחותים wird entsprechend ihrem wahrscheinlichen pronominalen Sinn als „ihren Altären“ wiedergegeben; die formale Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: וַ/יְטַהֵר
  choice: und reinigte
  rationale: Das Piel von טהר bezeichnet hier die Beseitigung kultischer Verunreinigung. „Reinigte“ bewahrt diese kultisch-moralische Bedeutung, ohne sie auf bloßes Säubern oder eine spätere theologische Kategorie einzuengen.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Juda und Jerusalem
  rationale: Die beiden mit אֶת markierten direkten Objekte werden mit ihren üblichen deutschen Namensformen wiedergegeben.
theological_decisions:
- issue: Art der Reinigung
  choice: kultisch-moralische Reinigung Judas und Jerusalems von der Verunreinigung durch unerlaubten Kult
  alternative: rein zeremonielle Reinigung oder lediglich physische Säuberung und Zerstörung
  rationale: Im Zusammenhang von Josias Reform bezeichnet טהר die Beseitigung kultischer Verunreinigung. „Reinigte“ erhält die Bedeutungsbreite, ohne eine engere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebeine“ ist in diesem Bestattungs- und Entweihungskontext idiomatischer als das sachlichere „Knochen“. Die knappe Satzstruktur des Hebräischen bleibt erhalten.
