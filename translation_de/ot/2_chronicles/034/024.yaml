  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: de
  text: 'So spricht JHWH: Siehe, ich bringe Unheil über diesen Ort und seine Bewohner: all die Flüche[a], die in dem Buch[b] geschrieben stehen, das sie vor dem König von Juda vorgelesen haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all die Eidflüche«; gemeint sind die im Gesetzbuch angedrohten Sanktionen des Bundes.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch eine Schriftrolle bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Gibt den in der hebräischen Vorlage ausdrücklich stehenden Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige, würdige deutsche Wiedergabe der prophetischen Botenformel.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Bewahrt die hinweisende und feierliche Kraft der hebräischen Ankündigungsformel.
- source_word: מֵבִיא רָעָה
  choice: bringe Unheil
  rationale: רָעָה bezeichnet hier das als Gericht kommende Verderben, nicht moralische Bosheit; »Unheil« ist im Deutschen prägnant und kontextgerecht.
- source_word: הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Entspricht der demonstrativen Wendung, ohne den im Vers nicht ausdrücklich genannten Ort näher festzulegen.
- source_word: יוֹשְׁבָיו
  choice: seine Bewohner
  rationale: Natürliche moderne Wiedergabe des substantivierten Partizips mit Possessivsuffix.
- source_word: אֵת כָּל הָאָלוֹת
  choice: all die Flüche
  rationale: אָלָה bezeichnet hier die im Bundesgesetz ausgesprochenen Fluchandrohungen; »Flüche« bleibt verständlich und eng am Wortlaut.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: die in dem Buch geschrieben stehen
  rationale: Idiomatatisches Deutsch für die im Schriftstück festgehaltenen Flüche; סֵפֶר kann sowohl ein Buch als auch eine Schriftrolle bezeichnen.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: das sie vor … vorgelesen haben
  rationale: Bewahrt das aktive Verb im Plural und gibt לִפְנֵי in diesem Vorlesekontext natürlich wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: dem König von Juda
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Bedeutung von רָעָה als von Gott angekündigtes Gericht
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im Zusammenhang bezeichnet das Wort die verheerende Folge des Bundesgerichts. »Unheil« wahrt die Härte der Aussage, ohne Gott moralische Bosheit zuzuschreiben.
- issue: Bundesrechtliche Färbung von אָלָה
  choice: Flüche im Haupttext mit erläuternder Fußnote
  alternative: Eidflüche; Fluchandrohungen
  rationale: »Flüche« ist allgemein verständlich; die Fußnote bewahrt die mögliche besondere Bedeutung als eidlich bekräftigte Sanktionen des Bundes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton der prophetischen Rede. Die Satzstruktur bleibt nah am Hebräischen, ohne unnatürlich zu wirken; der aktive Plural »sie … vorgelesen haben« wird nicht auf eine namentlich genannte Person eingeengt.
