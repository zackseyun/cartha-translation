base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: de
  text: Dann befahl der König Hilkija, Ahikam, dem Sohn Schafans, Abdon, dem Sohn Michas,[a] Schafan, dem Schreiber, und Asaja, dem Diener des Königs:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der masoretische Text lautet „Abdon, der Sohn Michas“. In der Parallelstelle 2. Könige 22,12 steht „Achbor, der Sohn Michajas“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Asaja, dem königlichen Beamten“. Wörtlich steht im Hebräischen „Diener des Königs“; der Ausdruck kann einen Amtsträger am Königshof bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Dann befahl
  rationale: Das Verb צוה bezeichnet hier einen verbindlichen königlichen Befehl. „Dann“ gibt die fortschreitende Erzählung des Waw-Konsekutivs natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck bezieht sich im Zusammenhang auf König Josia.
- source_word: חִלְקִיָּהוּ
  choice: Hilkija
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam, dem Sohn Schafans
  rationale: בן bezeichnet die Abstammung; die Kasusform „Schafans“ ist natürliches, knappes Deutsch.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdon, dem Sohn Michas
  rationale: Die Wiedergabe folgt dem masoretischen Text der Chronik und lässt die Abweichung von der Königsparallele in einer Fußnote erkennen.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: dem Schreiber Schafan
  rationale: סֹפֵר kann einen Schreiber beziehungsweise königlichen Sekretär bezeichnen. „Schreiber“ bewahrt die lexikalische Breite und ist verständlich.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaja, dem Diener des Königs
  rationale: עֶבֶד bedeutet wörtlich „Diener“, kann am Königshof jedoch auch einen Amtsträger bezeichnen; diese Möglichkeit wird in der Fußnote festgehalten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel kündigt die im folgenden Vers einsetzende direkte Rede an. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion ohne das schwerfällige „indem er sagte“.
