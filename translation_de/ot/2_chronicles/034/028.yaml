base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: de
  text: Siehe, ich werde dich zu deinen Vätern versammeln[a], und du wirst in Frieden[b] zu deinen Gräbern[c] versammelt werden. Deine Augen werden all das Unheil nicht sehen, das ich über diesen Ort und seine Bewohner bringe.« Und sie brachten dem König Nachricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinen Vorfahren“. „Zu seinen Vätern versammelt werden“ ist eine hebräische Wendung für den Tod und die Verbindung mit den verstorbenen Vorfahren.'
    reason: lexical_alternative
  - marker: b
    text: „In Frieden“ bedeutet hier wahrscheinlich, dass Josia das angekündigte Unheil nicht mehr miterleben wird, wie der folgende Satz erklärt. Die Wendung muss nicht besagen, dass er ohne Gewalt sterben würde.
    reason: theological_tension
  - marker: c
    text: Der hebräische Text hat wörtlich den Plural „zu deinen Gräbern“, möglicherweise mit Blick auf die Gräber der Vorfahren oder die gemeinsame Begräbnisstätte.
    reason: source_form
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe, ich werde
  rationale: „Siehe“ bewahrt den hervorgehobenen hebräischen Redehinweis; zusammen mit dem Partizip wird die feststehende bevorstehende Handlung im Deutschen natürlich mit dem Futur ausgedrückt.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: dich zu deinen Vätern versammeln
  rationale: Die Formulierung erhält das hebräische Bild und die geläufige Todesmetapher; „Vorfahren“ wird als verständliche Alternative erläutert.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: du wirst zu deinen Gräbern versammelt werden
  rationale: Das Passiv und die lexikalische Verbindung zum vorausgehenden Verb bleiben erhalten. Der ungewöhnliche Plural entspricht dem hebräischen Text und kann auf die Gräber beziehungsweise die Begräbnisstätte der Familie weisen.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die Wendung bleibt bewusst weit genug, um den folgenden Satz als nähere Erklärung zuzulassen, ohne einen gewaltlosen Tod zu behaupten.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Deine Augen werden … nicht sehen
  rationale: Die ausdrückliche Körpermetapher und ihre Hervorhebung werden bewahrt.
- source_word: בְּכֹל הָרָעָה
  choice: all das Unheil
  rationale: רָעָה bezeichnet im Gerichtszusammenhang drohendes Unglück beziehungsweise Verderben, nicht primär moralische Bosheit.
- source_word: אֲשֶׁר אֲנִי מֵבִיא
  choice: das ich … bringe
  rationale: Das deutsche Präsens gibt die im hebräischen Partizip als feststehend beziehungsweise im Anbruch befindlich dargestellte Handlung knapp wieder.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Und sie überbrachten dem König die Antwort
  rationale: Die idiomatische Wendung bezeichnet das Zurückbringen der erbetenen Auskunft; „die Antwort überbringen“ ist im modernen Deutschen natürlich.
theological_decisions:
- issue: Bedeutung der Zusage „in Frieden“ angesichts von Josias späterem Tod im Kampf
  choice: Die Formulierung bleibt als „in Frieden“ stehen und wird durch den folgenden Satz inhaltlich darauf bezogen, dass Josia das angekündigte Unheil nicht mehr sehen wird.
  alternative: Die Aussage als ausdrückliche Verheißung eines gewaltlosen Todes oder ausschließlich einer friedlichen Bestattung verstehen.
  rationale: Der unmittelbare Kontext erklärt die zugesagte Verschonung damit, dass Josias Augen das kommende Unheil nicht sehen werden. Die Spannung zu seinem späteren Tod wird nicht künstlich aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Redeeröffnung „Siehe“ und die wiederholte Versammlungsmetapher bewahren die Feierlichkeit und Bildsprache des Hebräischen; idiomatisch unklare Punkte werden knapp in Fußnoten erläutert.
