  text: וּ/בְ/עָרֵ֨י מְנַשֶּׁ֧ה וְ/אֶפְרַ֛יִם וְ/שִׁמְע֖וֹן וְ/עַד נַפְתָּלִ֑י ב/הר בתי/הם סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: de
  text: und in den Städten Manasses, Ephraims und Simeons, bis hin nach Naftali, in ihren Ruinen ringsum.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist in der Schlusswendung schwierig; die masoretische Vokalisierung ergibt „in ihren Ruinen ringsum“.
    reason: textual_variant
  - marker: b
    text: 'Oder, bei anderer Vokalisierung derselben Konsonanten: „mit ihren Schwertern ringsum“. Im Zusammenhang ist jedoch die Lesung „in ihren Ruinen“ vorzuziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: und in den Städten
  rationale: Die Konjunktion und die Präposition werden wiedergegeben. עָרִים bezeichnet Städte oder Ortschaften; „Städte“ passt zum historischen Erzählstil.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manasses, Ephraims und Simeons
  rationale: Die Stammes- und Gebietsnamen stehen als abhängige Genitive zu „Städten“; die deutsche Form ist natürlich und bewahrt die Aufzählung.
- source_word: וְ/עַד נַפְתָּלִי
  choice: bis hin nach Naftali
  rationale: עַד bezeichnet die räumliche Ausdehnung bis zu einem Endpunkt. „bis hin nach“ gibt diese Reichweite idiomatisch wieder.
- source_word: ב/הר בתי/הם
  choice: in ihren Ruinen
  rationale: Die überlieferte Form ist schwierig. Obwohl die Konsonanten von בתיהם auch als „ihre Häuser“ verstanden werden könnten, sprechen Zusammenhang und Parallelüberlieferung für verwüstete oder zerfallene Orte. Die Unsicherheit wird in den Fußnoten offengelegt.
- source_word: סָבִיב
  choice: ringsum
  rationale: סָבִיב bezeichnet die umliegende beziehungsweise gesamte umgebende Gegend; „ringsum“ ist knapp, modern und bewahrt den adverbialen Charakter.
theological_decisions: []
