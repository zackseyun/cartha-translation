  to: Im achtzehnten Jahr seiner Herrschaft, als er das Land und das Haus[a] gereinigt hatte, sandte er Schafan, den Sohn Azaljas, Maaseja, den Stadtobersten, und Joach, den Sohn Joahas, den Schreiber, aus, um das Haus Jahwes, seines Gottes, instand zu setzen[b].
