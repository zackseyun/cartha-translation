source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: de
  text: Im achtzehnten Jahr seiner Herrschaft, als er das Land und das Haus[a] gereinigt hatte, sandte er Schafan, den Sohn Azaljas, Maaseja, den Stadtobersten, und Joach, den Sohn Joahas, den Schreiber, aus, um das Haus Jahwes, seines Gottes, instand zu setzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist hier der Tempel gemeint.
    reason: lexical_clarification
  - marker: b
    text: 'Wörtlich: zu stärken; bei einem Gebäude bedeutet dies, es auszubessern oder wiederherzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: Im achtzehnten Jahr seiner Herrschaft
  rationale: Die deutsche Regierungsjahrformel gibt die Zeitangabe natürlich wieder; das einleitende ו wird als narrative Verknüpfung nicht eigens mit „und“ ausgedrückt.
- source_word: לְטַהֵר
  choice: als er … gereinigt hatte
  rationale: Der Infinitiv mit ל wird im Zusammenhang mit der vorausgehenden Reinigung temporal verstanden. Das Plusquamperfekt macht deutlich, dass die Reinigung dieser Beauftragung vorausging.
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: das Land und das Haus
  rationale: Die wörtliche Wiedergabe bewahrt die Verbindung zum später ausdrücklich genannten „Haus Jahwes“; „Haus“ bezeichnet hier den Tempel.
- source_word: שָׁלַח
  choice: beauftragte er
  rationale: Wörtlich „sandte er“. Da die drei Männer mit einer konkreten Aufgabe entsandt werden, gibt „beauftragte“ die Funktion im Deutschen flüssig wieder.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ
  choice: Schafan, den Sohn Asaljas
  rationale: Die Namen werden nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: מַעֲשֵׂיָהוּ שַׂר הָעִיר
  choice: Maaseja, den obersten Beamten der Stadt
  rationale: שַׂר bezeichnet einen leitenden Amtsträger; die Formulierung vermeidet die möglicherweise militärische Engführung von „Stadthauptmann“.
- source_word: יוֹאָח בֶּן יוֹאָחָז הַמַּזְכִּיר
  choice: Joach, den Sohn des Joahas, den königlichen Schreiber
  rationale: הַמַּזְכִּיר ist die Amtsbezeichnung eines hohen königlichen Beamten, der für Aufzeichnungen beziehungsweise staatliche Schriftstücke zuständig war. „Königlicher Schreiber“ ist verständlich, ohne sein Amt zu eng festzulegen.
- source_word: לְחַזֵּק
  choice: instand zu setzen
  rationale: Das Verb bedeutet grundsätzlich „stärken“; auf ein Gebäude bezogen bezeichnet es dessen Ausbesserung oder Wiederherstellung.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: das Haus Jahwes, seines Gottes
  rationale: „Haus“ wahrt die hebräische Ausdrucksweise für den Tempel, und der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt diesen im modernen Deutschen direkt und in geläufiger Form wieder.
- issue: Zeitliches oder finales Verständnis von לְטַהֵר
  choice: als er … gereinigt hatte
  alternative: um … zu reinigen
  rationale: Der vorausgehende Erzählzusammenhang berichtet bereits von Josias Reinigung des Landes. Daher bezeichnet die Wendung hier am ehesten den erreichten Zeitpunkt, nicht den Zweck der Entsendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am hebräischen Satz, wird jedoch durch Appositionen und die idiomatische Wendung „instand zu setzen“ für heutige Leser klar gestaltet.
