  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: de
  text: 'Da brachte Schafan dem König das Buch und erstattete dem König außerdem Bericht: „Alles, was deinen Dienern anvertraut wurde, führen sie aus.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: brachte
  rationale: Der Hifil von בוא bezeichnet hier, dass Schafan das Buch zum König brachte.
- source_word: הַסֵּפֶר
  choice: das Buch
  rationale: סֵפֶר kann Buch, Schriftstück oder Schriftrolle bezeichnen. „Das Buch“ ist im Erzählzusammenhang natürlich und legt die materielle Form nicht unnötig fest.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: erstattete dem König außerdem Bericht
  rationale: Die Wendung bezeichnet das Überbringen einer Rückmeldung; עוֹד wird mit „außerdem“ wiedergegeben. Die natürliche deutsche Formulierung bewahrt den Sinn, ohne die hebräische Syntax nachzuahmen.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die hebräische Einleitungsformel wird im modernen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: Alles, was deinen Dienern anvertraut wurde
  rationale: נתן ביד ist eine idiomatische Wendung für das Übertragen oder Anvertrauen einer Aufgabe. Diese Wiedergabe vermittelt den Sinn klar, ohne das im Deutschen unnatürliche Bild „in die Hand gegeben“ erzwingen zu müssen.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: Im königlichen Kontext sind damit Personen im Dienst des Königs gemeint. „Diener“ bewahrt die soziale Beziehung, während „Beamte“ stärker deutet und „Sklaven“ den Kontext verengt.
- source_word: הֵם עֹשִׂים
  choice: führen sie aus
  rationale: Pronomen und Partizip bezeichnen die fortlaufende Ausführung des zuvor Anvertrauten. „Ausführen“ ergänzt kein sachfremdes Objekt, sondern nimmt den im Relativsatz genannten Auftrag idiomatisch auf.
