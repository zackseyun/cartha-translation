base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: de
  text: Dann verpflichtete er alle, die sich in Jerusalem und Benjamin befanden,[a] und die Einwohner Jerusalems handelten nach dem Bund Gottes, des Gottes ihrer Vorfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann stellte er alle, die sich in Jerusalem und Benjamin befanden, hin“ oder „ließ sie stehen“. Im Zusammenhang der Bundeserneuerung ist wahrscheinlich gemeint, dass er sie auf den Bund verpflichtete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: verpflichtete
  rationale: Der Hifil von עמד bedeutet wörtlich „stehen lassen/hinstellen“. Im Zusammenhang der Bundeserneuerung bezeichnet er hier wahrscheinlich, dass Josia die Anwesenden auf den Bund verpflichtete. Die deutsche Wiedergabe macht diesen kontextuellen Sinn natürlich verständlich; die Fußnote bewahrt das Bild des Stehens.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: alle, die sich … befanden
  rationale: Gibt die Gesamtheit und das passive Partizip נמצא eng, aber in natürlichem modernem Deutsch wieder.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: in Jerusalem und Benjamin
  rationale: Die Ortsbezeichnungen werden entsprechend der knappen hebräischen Form beibehalten. „Benjamin“ meint im Zusammenhang wahrscheinlich das Stammesgebiet.
- source_word: וַיַּעֲשׂוּ
  choice: handelten
  rationale: עשה mit der Vergleichs- bzw. Entsprechungspartikel כ bei „Bund“ bedeutet, entsprechend dem Bund zu handeln oder ihn auszuführen.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Klare und gebräuchliche Wiedergabe der substantivierten Partizipialkonstruktion.
- source_word: כִּבְרִית
  choice: nach dem Bund
  rationale: Das Präfix כ bezeichnet hier die Übereinstimmung mit dem Bund; „nach dem Bund handeln“ ist im Deutschen prägnant und verständlich.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Gottes, des Gottes ihrer Vorfahren
  rationale: Bewahrt die hebräische Apposition und die wiederholte Gottesbezeichnung. „Vorfahren“ ist heute inklusiver und natürlicher als das traditionelle „Väter“, ohne den Bezug auf die vorangegangenen Generationen zu verändern.
theological_decisions:
- issue: Bedeutung von Josias Handlung bei der Bundeserneuerung
  choice: Josia verpflichtete die Anwesenden auf den Bund
  alternative: Josia ließ alle Anwesenden lediglich körperlich dastehen bzw. Stellung beziehen
  rationale: Der unmittelbare Bundeskontext legt eine verbindliche Beteiligung nahe. Da das hebräische Verb selbst jedoch das Bild des Stehens trägt und den Bund nicht ausdrücklich als Ergänzung nennt, wird die wörtlichere Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung gibt den wahrscheinlich gemeinten Bundessinn idiomatisch wieder; die Fußnote erhält die konkrete Bildsprache und syntaktische Offenheit des Hebräischen.
