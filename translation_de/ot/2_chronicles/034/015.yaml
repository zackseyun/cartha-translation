  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: de
  text: 'Da antwortete Hilkija und sagte zu dem Schreiber Schafan: »Ich habe das Buch des Gesetzes[a] im Haus Jahwes gefunden.« Und Hilkija gab Schafan das Buch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schriftrolle der Weisung«; das hebräische Wort für »Buch« kann auch ein Schriftstück oder eine Schriftrolle bezeichnen, und das Wort für »Gesetz« bedeutet ebenfalls »Weisung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete und sagte
  rationale: Die beiden hebräischen Redeverben werden bewahrt. Obwohl keine ausdrückliche Frage vorausgeht, ist »antwortete und sagte« eine übliche narrative Redeformel und lässt den Anschluss an die Situation offen.
- source_word: הַסּוֹפֵר
  choice: der Schreiber
  rationale: סֹפֵר kann einen Schreiber oder Verwaltungsbeamten bezeichnen. »Schreiber« wahrt die lexikalische Breite, ohne Schafans Amt genauer festzulegen, als es der Text tut.
- source_word: סֵפֶר הַתּוֹרָה
  choice: das Buch des Gesetzes
  rationale: סֵפֶר kann Buch, Schriftstück oder Schriftrolle bedeuten; תּוֹרָה bezeichnet Weisung und in diesem Zusammenhang das Bundesgesetz. Die traditionelle und verständliche Wendung »Buch des Gesetzes« passt zum Kontext, während die materielle Form in einer Fußnote offengehalten wird.
- source_word: מָצָאתִי
  choice: ich habe ... gefunden
  rationale: Das deutsche Perfekt gibt die abgeschlossene Entdeckung mit ihrer unmittelbaren Bedeutung für die gegenwärtige Mitteilung natürlich wieder.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: »Haus« bewahrt die hebräische Ausdrucksweise für den Tempel; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: gab Schafan das Buch
  rationale: Die Formulierung gibt נתן schlicht und idiomatisch wieder und bewahrt sowohl Empfänger als auch Gegenstand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. »Jahwe« macht den Bundesnamen im Haupttext sichtbar; »der HERR« wäre die traditionelle ehrfürchtige Ersatzlesung, würde aber den Eigennamen weniger direkt wiedergeben.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: »Gesetz« entspricht hier der wahrscheinlichen Bezeichnung einer maßgeblichen bundesrechtlichen Schrift. »Weisung« ist lexikalisch breiter, könnte den konkreten Bezug in dieser Erzählung jedoch abschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Namen folgen den im Deutschen geläufigen Formen Hilkija und Schafan. Die hebräische Doppelredeformel bleibt erkennbar; unnötig altertümliche Syntax wird vermieden.
