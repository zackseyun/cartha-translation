base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: de
  text: Im achten Jahr seiner Herrschaft, als er noch ein Jugendlicher war, begann er, den Gott seines Vorfahren David[a] zu suchen. Im zwölften Jahr begann er, Juda und Jerusalem von den Kulthöhen, den Aschera-Symbolen[b], den geschnitzten Bildern und den gegossenen Bildern zu reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Gott Davids, seines Vaters“. „Vater“ bezeichnet hier einen Vorfahren in der königlichen Abstammungslinie.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Kultsymbole, die mit Aschera verbunden sind, möglicherweise heilige Pfähle oder Bäume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: Im achten Jahr seiner Herrschaft
  rationale: Die Zeitangabe bezeichnet das achte Regierungsjahr Josias. „Herrschaft“ ist im Deutschen natürlich und gibt den königlichen Bezugsrahmen präzise wieder.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: als er noch ein Jugendlicher war
  rationale: נַעַר bezeichnet hier einen jungen Menschen; Josia war zu diesem Zeitpunkt etwa sechzehn Jahre alt. „Jugendlicher“ vermeidet sowohl das zu kindliche „Junge“ als auch das unbestimmtere „jung“.
- source_word: הֵחֵל לִדְרוֹשׁ
  choice: begann er, ... zu suchen
  rationale: דרשׁ bezeichnet in Verbindung mit Gott hingebungsvolles Suchen und Ausrichten auf ihn, nicht bloßes Erkundigen.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: den Gott seines Vaters David
  rationale: „Vater“ bewahrt die im Hebräischen übliche dynastische Bezeichnung für einen Vorfahren. Eine Fußnote erklärt, dass David nicht Josias unmittelbarer Vater war.
- source_word: הֵחֵל לְטַהֵר
  choice: begann er, ... zu reinigen
  rationale: טהר bezeichnet hier die Beseitigung kultischer Verunreinigung. „Reinigen“ bewahrt diesen religiösen Sinn und bleibt allgemein verständlich.
- source_word: מִן הַבָּמוֹת
  choice: von den Kulthöhen
  rationale: במות sind örtliche Kultstätten, häufig auf Anhöhen. „Kulthöhen“ ist im Deutschen prägnanter und sachlich klarer als das bloße „Höhen“.
- source_word: וְהָאֲשֵׁרִים
  choice: den Aschera-Symbolen
  rationale: Der Plural kann hölzerne Kultpfähle, Bäume oder andere mit Aschera verbundene Kultsymbole bezeichnen. „Aschera-Symbole“ legt die konkrete Gestalt nicht unnötig fest.
- source_word: וְהַפְּסִלִים
  choice: den geschnitzten Götterbildern
  rationale: פסילים bezeichnet durch Schnitzen oder Behauen hergestellte Kultbilder. Die Wiedergabe benennt sowohl ihre Funktion als auch ihre Herstellungsart.
- source_word: וְהַמַּסֵּכוֹת
  choice: den gegossenen Götterbildern
  rationale: מסכות sind durch Metallguss hergestellte Bilder. „Gegossene Götterbilder“ ist genauer als das allgemeinere „Metallbilder“ und im modernen Deutsch verständlich.
theological_decisions:
- issue: Dynastische Bedeutung von אָבִיו („sein Vater“)
  choice: „seines Vaters David“ im Haupttext beibehalten
  alternative: „seines Vorfahren David“
  rationale: Der hebräische Text verwendet die gewöhnliche biblische Abstammungs- und Königssprache. Die wörtlichere Form erhält die literarische Verbindung zur davidischen Dynastie; die Fußnote verhindert das Missverständnis, David sei Josias unmittelbarer Vater.
- issue: Konkrete Gestalt der אֲשֵׁרִים
  choice: „Aschera-Symbole“
  alternative: „Aschera-Pfähle“ oder „Ascheren“
  rationale: Die genaue materielle Gestalt ist nicht in jedem Zusammenhang sicher. Die gewählte Form bewahrt diese sachliche Offenheit, ohne die Verbindung zum Aschera-Kult zu verschleiern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar. Fachlich notwendige Begriffe werden verständlich formuliert; echte sachliche Unbestimmtheit wird in der Übersetzung und den Fußnoten bewahrt.
