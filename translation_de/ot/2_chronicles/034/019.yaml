  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: de
  text: Als der König die Worte des Gesetzes[a] hörte, zerriss er seine Kleider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Weisung“. Das hebräische Wort Tora kann allgemein eine Weisung bezeichnen; hier bezieht es sich auf das vor dem König verlesene Bundesgesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … hörte
  rationale: Die Verbindung aus וַיְהִי und der mit כְּ gebildeten Infinitivkonstruktion bezeichnet hier den zeitlichen Umstand. Im modernen Deutschen gibt „Als … hörte“ den Erzählablauf natürlich wieder, ohne die archaische Formel „Und es geschah“ eigens auszudrücken.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Titulierung wird direkt wiedergegeben. Obwohl im Kontext Josia gemeint ist, nennt der hebräische Vers hier nur den Titel.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Der Constructus Plural von דָּבָר bezeichnet hier den verlesenen Inhalt. „Worte“ ist direkt, verständlich und wahrt die sprachliche Gestalt des Ausgangstextes.
- source_word: הַתּוֹרָה
  choice: des Gesetzes
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten; in diesem Zusammenhang bezeichnet es jedoch den vor dem König verlesenen bundesrechtlichen Inhalt. „Gesetz“ ist die geläufige und kontextuell passende Wiedergabe, während die Fußnote die weitere Bedeutung offenhält.
- source_word: וַיִּקְרַע
  choice: zerriss
  rationale: קָרַע bezeichnet das Zerreißen von Kleidung als Ausdruck tiefer Bestürzung, Trauer oder Reue. „Zerriss“ ist im Deutschen präzise und würdevoll.
- source_word: בְּגָדָיו
  choice: seine Kleider
  rationale: בֶּגֶד ist eine allgemeine Bezeichnung für Kleidung. „Seine Kleider“ ist natürlich und weniger spezifisch als „seine Gewänder“ oder „seine königlichen Roben“.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Zusammenhang mit Josias Reform
  choice: das Gesetz
  alternative: die Weisung; die Tora
  rationale: Der Zusammenhang weist auf den bundesrechtlichen Inhalt des gefundenen Buches. „Das Gesetz“ vermittelt diesen Sinn idiomatisch, ohne תּוֹרָה grundsätzlich auf Gesetzesbestimmungen zu verengen; die lexikalische Breite wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe hebräische Satzfolge bleibt erhalten; unnötig archaische Formulierungen werden vermieden.
