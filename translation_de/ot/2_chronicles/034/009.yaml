source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: de
  text: Dann kamen sie zum Hohepriester Hilkija und übergaben das Geld, das in das Haus Gottes gebracht worden war. Die Leviten, die Hüter der Schwelle[a], hatten es von Manasse und Efraim, vom ganzen Rest Israels, von ganz Juda und Benjamin sowie von den Einwohnern Jerusalems eingesammelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „die Türhüter“ beziehungsweise „die Torhüter“; wörtlich: „die Hüter der Schwelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: zum Hohepriester Hilkija
  rationale: „Hohepriester“ ist die etablierte deutsche Bezeichnung für dieses priesterliche Amt; der Personenname folgt der üblichen deutschen Form.
- source_word: וַיִּתְּנוּ אֶת־הַכֶּסֶף
  choice: und übergaben das Geld
  rationale: „Übergaben“ bezeichnet in diesem Zusammenhang die Aushändigung der gesammelten Mittel genauer als das allgemeinere „gaben“; כֶּסֶף meint hier funktional Geld, auch wenn das Wort wörtlich „Silber“ heißen kann.
- source_word: הַמּוּבָא בֵית אֱלֹהִים
  choice: das in das Haus Gottes gebracht worden war
  rationale: Die passive Partizipialform bezeichnet einen vorausgehenden Vorgang. „Haus Gottes“ bewahrt die konkrete hebräische Ausdrucksweise, statt sie zu „Tempel“ zu glätten.
- source_word: שֹׁמְרֵי הַסַּף
  choice: die Hüter der Schwelle
  rationale: Die Übersetzung erhält das Bild des hebräischen Ausdrucks. Die funktionalen Wiedergaben „Türhüter“ und „Torhüter“ stehen in der Fußnote.
- source_word: מִיַּד
  choice: von
  rationale: Die Wendung „aus der Hand von“ bezeichnet hier die Herkunft der eingesammelten Mittel; schlichtes „von“ ist im Deutschen idiomatisch.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: Rest Israels
  rationale: „Rest“ gibt שְׁאֵרִית direkt wieder und lässt sowohl die geschichtliche Bedeutung der Übriggebliebenen als auch einen möglichen theologischen Nachklang offen.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: sowie von den Einwohnern Jerusalems
  rationale: Die Konstruktverbindung bezeichnet die Bewohner Jerusalems; „sowie“ bindet die letzte Herkunftsgruppe im Deutschen klar an die Aufzählung an.
theological_decisions:
- issue: Möglicher theologischer Gehalt von שְׁאֵרִית („Rest“)
  choice: vom ganzen Rest Israels
  alternative: vom ganzen übrigen Israel
  rationale: „Rest“ bewahrt die mögliche heilsgeschichtliche oder bundestheologische Resonanz, ohne zu behaupten, dass sie hier zwingend im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Relativsatz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne die zeitliche Abfolge oder die Zuordnung der Handelnden zu verändern.
