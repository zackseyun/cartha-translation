  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סּוֹפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖הוּ הַ/כֹּהֵ֑ן וַ/יִּקְרָא ב֥/וֹ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: de
  text: 'Dann berichtete der Schreiber Schafan dem König: »Der Priester Hilkija hat mir ein Buch[a] gegeben.« Und Schafan las dem König daraus vor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Schriftrolle«. Das hebräische Wort kann allgemein ein Schriftstück oder Buch bezeichnen; in dieser Zeit hatte es häufig die Form einer Rolle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Das Hifil von נגד bedeutet hier »mitteilen/berichten«. »Berichtete« passt natürlich zur Mitteilung eines königlichen Schreibers und überhöht die Förmlichkeit nicht.
- source_word: הַסּוֹפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet einen Schreiber und kann im königlichen Umfeld zugleich einen Sekretär bzw. Beamten meinen. »Schreiber« bewahrt die historische Amtsbezeichnung.
- source_word: סֵפֶר
  choice: ein Buch
  rationale: סֵפֶר ist eine allgemeine Bezeichnung für ein Schriftstück oder Buch und legt die materielle Form nicht eindeutig fest. »Buch« ist im Deutschen die natürliche, umfassende Wiedergabe; »Schriftrolle« bleibt als Alternative in der Fußnote erhalten.
- source_word: נָתַן לִי
  choice: hat mir … gegeben
  rationale: Das deutsche Perfekt bezeichnet die abgeschlossene, für die gegenwärtige Situation relevante Übergabe idiomatisch.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: der Priester Hilkija
  rationale: Der Personenname wird in einer geläufigen deutschen Form wiedergegeben und der Titel übersetzt. Die deutsche Wortstellung mit vorangestelltem Titel klingt natürlich.
- source_word: וַיִּקְרָא בוֹ
  choice: las … daraus vor
  rationale: בּוֹ bezeichnet den Text, aus dem gelesen wird. »Daraus« bildet die Präposition ab; »vorlesen« entspricht der hörbaren Lesung in Gegenwart des Königs.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: dem König … vor
  rationale: Die Konstruktion mit »vorlesen« gibt die Lesung in Gegenwart und für die Ohren des Königs idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Rolle Schafans bleibt mit »Schreiber« sichtbar; die direkte Rede und das idiomatische »daraus vorlesen« sorgen zugleich für einen natürlichen Satzfluss.
