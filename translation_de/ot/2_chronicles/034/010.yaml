source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: de
  text: Sie übergaben es den Arbeitern, die für die Arbeiten am Haus Jahwes[a] eingesetzt waren. Die Arbeiter, die am Haus Jahwes arbeiteten, verwendeten es dazu, das Haus auszubessern und zu verstärken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus Jahwes“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „das Haus wiederherzustellen und zu befestigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ ... עַל יַד
  choice: sie übergaben es den Arbeitern
  rationale: נתן bezeichnet hier die Übergabe, und עַל־יַד drückt aus, dass etwas der Verfügungsgewalt anderer anvertraut wird. Natürliches Deutsch gibt den Sinn besser mit „übergeben“ als mit dem wörtlichen Bild „auf die Hand“ wieder.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: den Arbeitern
  rationale: Der singularisch formulierte Ausdruck hat hier kollektiven Sinn und bezeichnet die mit den Bauarbeiten befassten Personen.
- source_word: הַמֻּפְקָדִים בְּבֵית יְהוָה
  choice: die beim Haus Jahwes als Aufseher eingesetzt waren
  rationale: Der passive Partizipialausdruck bezeichnet eine übertragene Aufsichtsverantwortung. „Beim Haus“ lässt die Präposition ב und den institutionellen Bezug offen, während „als Aufseher eingesetzt“ Funktion und Passivform wiedergibt.
- source_word: אֹתוֹ
  choice: es
  rationale: Das Pronomen verweist im Kontext auf das zuvor erwähnte Geld; der Vers selbst nennt das Bezugswort jedoch nicht ausdrücklich, daher bleibt die pronominale Form erhalten.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: Die Arbeiter, die ... tätig waren
  rationale: Die wiederholte Wurzel עשה wird in flüssigem Deutsch durch „Arbeiter“ und „tätig waren“ erkennbar wiedergegeben, ohne schwerfällige Doppelung.
- source_word: לִבְדּוֹק
  choice: auszubessern
  rationale: בדק kann grundsätzlich mit Prüfen oder Untersuchen verbunden sein, bezeichnet in diesem Tempelbaukontext aber die Behebung baulicher Schäden. „Ausbessern“ trifft diesen konkreten Sinn.
- source_word: וּלְחַזֵּק
  choice: und zu verstärken
  rationale: חזק im Kausativ bezeichnet hier das Fest- oder Stabilmachen des Gebäudes; „verstärken“ ist im baulichen Zusammenhang präzise und natürlich.
- source_word: בֵּית יְהוָה / הַבָּיִת
  choice: Haus Jahwes / das Haus
  rationale: „Haus“ bewahrt die wiederholte hebräische Bezeichnung und meint im Kontext den Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form der wissenschaftlichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
- issue: Bedeutung von בֵּית יְהוָה
  choice: Haus Jahwes, mit Erläuterung „Tempel“
  alternative: Tempel Jahwes
  rationale: Die wörtliche Metapher „Haus“ wird im Haupttext bewahrt, während die Fußnote den kulturell-kontextuellen Bezug eindeutig macht.
- issue: Bedeutung von לִבְדּוֹק im Baukontext
  choice: auszubessern
  alternative: zu untersuchen; wiederherzustellen
  rationale: Der unmittelbare Zusammenhang mit חזק und dem Gebäude spricht für bauliche Instandsetzung. Die Fußnote bewahrt die mögliche Nuance „wiederherstellen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Ablauf der beiden Übergaben zu verändern. „Arbeiter“ ist inklusiv und gegenwärtig; „Haus Jahwes“ bewahrt die Bildsprache des Hebräischen.
