revisions:
- from: Die Männer führten die Arbeit gewissenhaft aus. Als Verantwortliche über sie waren die Leviten Jahat und Obadja von den Nachkommen Meraris sowie Secharja und Meschullam von den Kehatitern eingesetzt, um die Arbeit zu beaufsichtigen[a]. Hinzu kamen die Leviten, die sich alle auf Musikinstrumente verstanden[b].
  to: Die Männer arbeiteten zuverlässig an der Arbeit. Über ihnen waren die Leviten Jahat und Obadja, von den Nachkommen Meraris, sowie Secharja und Meschullam, von den Kehatitern, als Aufseher eingesetzt, um die Aufsicht zu führen[a]; sie waren alle kundig im Spiel von Musikinstrumenten[b].
  rationale: Die Revision entfernt die unbelegte Ergänzung „Hinzu kamen“, formuliert die Einsetzung der Aufseher idiomatischer und bindet den elliptischen Schlussteil vorsichtig an die zuvor genannten Leviten an. Die Wiedergabe bewahrt damit die Aussage, ohne eine besondere liturgische Funktion oder eine zusätzliche Gruppe einzutragen.
