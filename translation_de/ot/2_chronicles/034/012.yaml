base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: de
  text: Die Männer arbeiteten zuverlässig an der Arbeit. Über ihnen waren die Leviten Jahat und Obadja, von den Nachkommen Meraris, sowie Secharja und Meschullam, von den Kehatitern, als Aufseher eingesetzt, um die Aufsicht zu führen[a]; sie waren alle kundig im Spiel von Musikinstrumenten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu leiten“; das hebräische Verb kann leitende und beaufsichtigende Verantwortung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle, die Einsicht in Instrumente des Gesangs hatten“, das heißt, alle, die im Umgang mit Musikinstrumenten sachkundig waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: gewissenhaft
  rationale: Das Substantiv אֱמוּנָה wird hier adverbial gebraucht und bezeichnet die Zuverlässigkeit und Pflichttreue, mit der die Männer arbeiteten, nicht subjektiven Glauben.
- source_word: בַּמְּלָאכָה
  choice: die Arbeit
  rationale: מְלָאכָה bezeichnet hier die laufenden Arbeiten zur Instandsetzung des Tempels. Die deutsche Wendung „die Arbeit ausführen“ gibt den Sinn natürlich wieder.
- source_word: מֻפְקָדִים
  choice: waren als Verantwortliche eingesetzt
  rationale: Das Hophal-Partizip von פקד bezeichnet die Einsetzung in eine verantwortliche Aufgabe und bewahrt hier die passive Aussageform.
- source_word: מִן בְּנֵי מְרָרִי
  choice: von den Nachkommen Meraris
  rationale: Die Wiedergabe drückt die genealogische beziehungsweise sippenbezogene Zugehörigkeit idiomatisch und transparent aus.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: von den Kehatitern
  rationale: הַקְּהָתִים ist eine Sippenbezeichnung. „Von den Kehatitern“ vermeidet im Deutschen die schwerfällige wörtliche Form „von den Söhnen der Kehatiter“.
- source_word: לְנַצֵּחַ
  choice: um die Arbeit zu beaufsichtigen
  rationale: Im Zusammenhang der Tempelinstandsetzung bezeichnet נצח leitende beziehungsweise beaufsichtigende Verantwortung. Das ergänzte Objekt „die Arbeit“ ergibt sich aus dem unmittelbaren Kontext.
- source_word: כָּל מֵבִין בִּכְלֵי שִׁיר
  choice: die sich alle auf Musikinstrumente verstanden
  rationale: מֵבִין bezeichnet praktische Sachkunde; die deutsche Wendung gibt „jeder, der Verständnis für Musikinstrumente hatte“ klar und idiomatisch wieder.
