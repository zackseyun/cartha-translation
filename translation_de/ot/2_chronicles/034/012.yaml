    rationale: וְהַלְוִיִּם כָּל־מֵבִין בִּכְלֵי־שִׁיר ist ein knapper, syntaktisch elliptischer Nachsatz. Er rechtfertigt nicht die Aussage, musikalisch kundige Leviten seien zusätzlich hinzugekommen.
  - severity: low
    issue: „Als Verantwortliche über sie waren ... eingesetzt“ ist syntaktisch schwerfällig.
    rationale: Die passive Einsetzung über die Arbeiter lässt sich im Deutschen natürlicher mit „Über ihnen waren ... als Aufseher eingesetzt“ ausdrücken.
  - severity: low
