  text: וַ/יֵּ֨לֶךְ חִלְקִיָּ֜הוּ וַ/אֲשֶׁ֣ר הַ/מֶּ֗לֶךְ אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תוקהת בֶּן חַסְרָה֙ שׁוֹמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יוֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַ/יְדַבְּר֥וּ אֵלֶ֖י/הָ כָּ/זֹֽאת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: de
  text: 'Da gingen Hilkija und die Männer, die der König gesandt hatte, zu der Prophetin Hulda. Sie war die Frau Schallums, des Sohnes Tokhats, des Sohnes Hasras. Schallum verwahrte die Kleider.[a] Sie wohnte in Jerusalem im zweiten Stadtviertel.[b] Und sie sprachen folgendermaßen mit ihr:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Hüter der Garderobe“. Wörtlich: „der Hüter der Kleider“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Mischne; wahrscheinlich die Bezeichnung eines Stadtbezirks Jerusalems. Traditionell wird der Ausdruck als „zweites Stadtviertel“ wiedergegeben.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da gingen
  rationale: Das narrative Wayyiqtol wird als fortschreitende Handlung der Erzählung wiedergegeben; der Singular richtet sich im Hebräischen nach Hilkija, während im Deutschen wegen der nachfolgenden Gruppe der Plural natürlich ist.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: und die Männer, die der König gesandt hatte
  rationale: Die hebräische Formulierung ist elliptisch und verweist im Zusammenhang auf die vom König beauftragte Gesandtschaft. Die Ergänzung „gesandt hatte“ macht den vorausgesetzten Bezug im Deutschen verständlich.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: zu der Prophetin Hulda
  rationale: Die feminine Bezeichnung wird ausdrücklich mit „Prophetin“ wiedergegeben; der Name folgt der geläufigen deutschen Form.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: Sie war die Frau Schallums
  rationale: Die eheliche Beziehung wird direkt ausgedrückt; ein eigener Satz vermeidet eine schwerfällige deutsche Appositionskette.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: des Sohnes Tokhats, des Sohnes Hasras
  rationale: Die genealogische Abfolge bleibt vollständig erhalten, die Namen werden deutsch lesbar transliteriert.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: der die Kleider verwahrte
  rationale: Die Formulierung bleibt nahe am wörtlichen Sinn, ohne das möglicherweise amtliche Aufgabenfeld vorschnell als „Garderobe“ festzulegen.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: Sie wohnte
  rationale: Das Partizip bezeichnet hier den fortdauernden Wohnsitz; „wohnte“ ist dafür natürliches modernes Deutsch.
- source_word: בַּמִּשְׁנֶה
  choice: im zweiten Stadtviertel
  rationale: מִשְׁנֶה bezeichnet hier wahrscheinlich einen benannten zweiten Bezirk Jerusalems; „Stadtviertel“ verdeutlicht den örtlichen Bezug.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'Und sie sprachen folgendermaßen mit ihr:'
  rationale: Die Wendung leitet die folgende direkte Rede ein und bewahrt mit „folgendermaßen“ die demonstrative Bedeutung von כָּזֹאת in würdigem, natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Bezeichnung der königlichen Gesandtschaft wird zum Verständnis behutsam ergänzt. Die mögliche Amtsbezeichnung bei der Aufbewahrung der Kleider und die Bedeutung von Mischne werden in Fußnoten offengehalten.
