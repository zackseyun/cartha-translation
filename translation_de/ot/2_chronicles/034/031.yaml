source:
  edition: WLC
  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: de
  text: Dann stand der König an seinem Platz und schloss vor Jahwe den Bund, Jahwe zu folgen und seine Gebote, seine Zeugnisse und seine Satzungen mit seinem ganzen Herzen und seiner ganzen Seele zu halten und die Worte des Bundes, die in diesem Buch[a] geschrieben standen, in die Tat umzusetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder historisch genauer: „in dieser Schriftrolle“. Das hebräische Wort kann ein schriftliches Dokument in Rollenform bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד עַל־עָמְדוֹ
  choice: trat an seinen Platz
  rationale: Die Verbindung bezeichnet, dass der König seinen vorgesehenen Platz oder Standort einnahm. Die Wiedergabe ist im Deutschen natürlich und legt weder ein Podest noch eine bestimmte zeremonielle Einrichtung fest.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: schloss den Bund
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. Der bestimmte Artikel bleibt erhalten und weist im Kontext auf die feierliche Bundeserneuerung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Formulierung bezeichnet ein feierliches Handeln in Jahwes Gegenwart und bewahrt den Gottesnamen des hebräischen Textes.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: Jahwe folgen
  rationale: Wörtlich steht hier „hinter Jahwe hergehen“. „Jahwe folgen“ gibt die Bundesmetapher in natürlichem modernem Deutsch wieder, ohne sie in eine bloß abstrakte Loyalitätserklärung aufzulösen.
- source_word: לִשְׁמוֹר
  choice: halten
  rationale: Im rechtlich-bundestheologischen Zusammenhang bedeutet שמר, Gebote aufmerksam zu bewahren und zu befolgen. „Halten“ ist die etablierte und verständliche deutsche Wiedergabe.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: seine Gebote, seine Zeugnisse und seine Satzungen
  rationale: Die drei verschiedenen Rechtstermini werden nicht zu einem Oberbegriff eingeebnet. „Zeugnisse“ bewahrt die besondere Bundes- und Offenbarungsnuance von עֵדוֹת, während „Satzungen“ die festgesetzten Vorschriften von חֻקִּים bezeichnet.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: mit ganzem Herzen und mit ganzer Seele
  rationale: Die deuteronomische Bundesformel und ihre anthropologische Bildsprache bleiben erhalten.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: die Worte des Bundes in die Tat umsetzen
  rationale: Die wörtliche Verbindung „die Worte tun“ klingt im heutigen Deutsch unnatürlich. „In die Tat umsetzen“ drückt den Vollzug beziehungsweise Gehorsam aus und bewahrt zugleich „die Worte des Bundes“.
- source_word: הַסֵּפֶר
  choice: Buch
  rationale: סֵפֶר bezeichnet ein Schriftstück oder Buch und kann im historischen Kontext insbesondere eine Schriftrolle meinen. Im Haupttext steht die geläufige Bezeichnung; die konkrete materielle Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundesmetapher in לָלֶכֶת אַחֲרֵי יְהוָה
  choice: Jahwe folgen
  alternative: hinter Jahwe hergehen
  rationale: Die gewählte Fassung erhält das Bild persönlicher Nachfolge in idiomatischem Deutsch. Die streng wörtliche Alternative wäre verständlich, klänge hier jedoch unnötig sperrig.
- issue: Infinitivfolge als Inhalt der Bundesverpflichtung
  choice: Er wollte … folgen … halten und … umsetzen
  alternative: um … zu folgen … zu halten und … umzusetzen
  rationale: Die Infinitive beschreiben Ziel und Inhalt der vom König übernommenen Bundesverpflichtung. Die deutsche Satzgestaltung macht diesen Verpflichtungscharakter deutlich, ohne eine direkte Rede oder ein förmliches Gelübde einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarem bundesrechtlichem Ton. Traditionelle Schlüsselbegriffe wie „Bund“, „Zeugnisse“, „Herz“ und „Seele“ bleiben wegen ihrer textlichen und theologischen Bezüge erhalten; unnötig hölzerne hebräische Wendungen werden idiomatisch wiedergegeben.
