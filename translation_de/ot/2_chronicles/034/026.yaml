source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: de
  text: 'Doch dem König von Juda, der euch gesandt hat, Jahwe zu befragen[a], sollt ihr Folgendes sagen: »So spricht Jahwe, der Gott Israels: Was die Worte betrifft, die du gehört hast –«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe zu suchen« beziehungsweise »bei Jahwe Rat einzuholen«. Das hebräische Verb kann sowohl das Suchen als auch das Befragen im Zusammenhang mit einer prophetischen Auskunft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: Doch dem
  rationale: Die Verbindung aus ו und אֶל führt nach der vorausgehenden Botschaft eine abgesetzte, kontrastierende Anrede ein. „Doch dem“ wahrt sowohl den Übergang als auch die Zielrichtung.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich und genau mit „König von Juda“ wiedergegeben.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: der euch gesandt hat
  rationale: Das substantivierte Partizip bestimmt den König näher. Im Kontext liegt die Entsendung der Abordnung bereits vor, daher ist das Perfekt im Deutschen idiomatisch.
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: Jahwe zu befragen
  rationale: דרשׁ mit ב bezeichnet hier das Aufsuchen göttlicher Auskunft im prophetischen Zusammenhang. „Befragen“ trifft die konkrete Handlung, während die mögliche Bedeutung „suchen“ in der Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: sollt ihr Folgendes sagen
  rationale: Die Botenformel und ihr Anweisungscharakter werden in natürlichem modernem Deutsch bewahrt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird mit der im Deutschen würdigen und geläufigen Form „So spricht“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Constructus-Verbindung wird unmittelbar und idiomatisch übersetzt.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Was die Worte betrifft, die du gehört hast –
  rationale: Die Formulierung bildet die Voranstellung des hebräischen Satzgegenstands ab und lässt den syntaktisch erst im nächsten Vers fortgeführten Gedanken bewusst offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von דרשׁ ב bei der Hinwendung an Gott
  choice: Jahwe befragen
  alternative: Jahwe suchen
  rationale: Der unmittelbare Kontext handelt von einer entsandten Abordnung, die eine göttliche Antwort einholen soll. „Befragen“ passt daher am besten, ohne die weitere Bedeutung „suchen“ auszuschließen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die traditionelle prophetische Formel „So spricht Jahwe“ bleibt erhalten. Der Gedankenstrich am Versende zeigt an, dass der vorangestellte und syntaktisch offene Satzgegenstand erst im folgenden Vers weitergeführt wird.
