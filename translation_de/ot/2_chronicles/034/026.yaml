  source_fidelity: 'Die Übersetzung gibt die hebräische Konstruktion und den Gedankengang zuverlässig wieder: die an den König von Juda gerichtete Botschaft, seine Entsendung der Boten zur Befragung Jahwes, die Botenformel und die bewusst offen gehaltene Voranstellung von „den Worten, die du gehört hast“. „Doch dem“ ist als kontextuelle, leicht kontrastierende Wiedergabe von וְאֶל vertretbar.'
