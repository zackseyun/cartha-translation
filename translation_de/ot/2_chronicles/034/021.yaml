source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: de
  text: Geht und befragt Jahwe für mich und für die Übriggebliebenen in Israel und Juda wegen der Worte des Buches[a], das gefunden worden ist. Denn groß ist Jahwes Zorn, der sich über uns ergossen hat, weil unsere Väter[b] Jahwes Wort nicht befolgt haben, um nach allem zu handeln, was in diesem Buch geschrieben steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Schriftrolle“. Das hebräische Wort kann ein Buch beziehungsweise eine Schriftrolle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere Vorfahren“. Wörtlich steht im Hebräischen „unsere Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: befragt Jahwe
  rationale: Im Kontext des königlichen Auftrags bezeichnet דרשׁ die Einholung göttlicher Auskunft; „befragen“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: und für den Rest in Israel und Juda
  rationale: הנשאר bezeichnet die Übriggebliebenen. „Der Rest“ bewahrt den möglichen heilsgeschichtlichen Klang, ohne ihn auszudeuten.
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: wegen der Worte des Buches
  rationale: Die Formulierung bezeichnet den Anlass beziehungsweise Gegenstand der Befragung und bleibt zugleich nahe am hebräischen Wortlaut.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: des Buches, das gefunden worden ist
  rationale: סֵפֶר kann Buch oder Schriftrolle bedeuten. „Buch“ ist im modernen deutschen Haupttext natürlicher; die sachlich mögliche Alternative steht in der Fußnote.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: groß ist Jahwes Zorn
  rationale: Die vorangestellte Aussage „groß“ bildet die hebräische Hervorhebung ab; „Zorn“ gibt חמה würdig und verständlich wieder.
- source_word: נִתְּכָה בָנוּ
  choice: der sich über uns ergossen hat
  rationale: Die Passivform von נתך beschreibt den Zorn bildhaft als über die Betroffenen ausgegossen.
- source_word: אֲבוֹתֵינוּ
  choice: unsere Väter
  rationale: Dies entspricht der ausdrücklich maskulinen hebräischen Bezeichnung; „Vorfahren“ bleibt als mögliche kontextuelle Wiedergabe vermerkt.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: Jahwes Wort nicht befolgt haben
  rationale: שמר mit „Wort“ meint hier nicht bloß Bewahren, sondern gehorsames Beachten. „Befolgt“ ist im heutigen Deutsch idiomatisch und wird durch den folgenden Handlungssatz erläutert.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב עַל־הַסֵּפֶר הַזֶּה
  choice: indem sie nicht nach allem handelten, was in diesem Buch geschrieben steht
  rationale: Die Wiedergabe macht den Infinitiv als Erläuterung des Nichtbefolgens verständlich und bewahrt den umfassenden Bezug von כְּכָל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַנִּשְׁאָר
  choice: der Rest
  alternative: die Übriggebliebenen
  rationale: „Der Rest“ erhält die knappe kollektive Form und ihre mögliche theologische Resonanz, ohne festzulegen, ob hier ein technisch-theologischer Restbegriff vorliegt.
- issue: Wiedergabe von אֲבוֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die grammatisch und lexikalisch maskuline Form wird im Haupttext erhalten; die Alternative zeigt den möglichen umfassenderen Bezug auf frühere Generationen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der Satzbau folgt der hebräischen Hervorhebung bei „groß ist Jahwes Zorn“, vermeidet aber unnötige Altertümlichkeit. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
