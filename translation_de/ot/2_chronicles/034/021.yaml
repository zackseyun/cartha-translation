  to: Geht und befragt Jahwe für mich und für die Übriggebliebenen in Israel und Juda wegen der Worte des Buches[a], das gefunden worden ist. Denn groß ist Jahwes Zorn, der sich über uns ergossen hat, weil unsere Väter[b] Jahwes Wort nicht befolgt haben, um nach allem zu handeln, was in diesem Buch geschrieben steht.
