  register: Modernes, würdiges Standarddeutsch. Die Ergänzung „Boten“ schafft einen natürlichen deutschen Satz, ohne den Zweck des Sendens näher festzulegen; die formale Offenheit des Hebräischen bleibt durch die Fußnote sichtbar.
