base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: de
  text: Darauf sandte der König und versammelte alle Ältesten Judas und Jerusalems.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … Boten aus
  rationale: שׁלח bedeutet wörtlich „senden“. Da das Hebräische nicht ausdrücklich nennt, wen oder was der König sandte, ergänzt die deutsche Fassung „Boten“, um den Satz natürlich und verständlich wiederzugeben; die wörtlichere, offene Form wird in der Fußnote genannt.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Titulatur wird direkt wiedergegeben. Obwohl aus dem Zusammenhang Josia gemeint ist, nennt der Vers hier keinen Eigennamen.
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אָסף bezeichnet hier das Zusammenbringen einer Personengruppe; „versammelte“ ist im Deutschen präzise und idiomatisch.
- source_word: אֶת כָּל
  choice: alle
  rationale: אֶת markiert das bestimmte Objekt und bleibt unübersetzt; כָּל wird umfassend mit „alle“ wiedergegeben.
- source_word: זִקְנֵי
  choice: Ältesten
  rationale: Der Ausdruck bezeichnet anerkannte führende Vertreter der Gemeinschaft, nicht lediglich alte Männer. „Älteste“ ist dafür die sachlich passende deutsche Bezeichnung.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Judas und Jerusalems
  rationale: Der deutsche Genitiv gibt die Zugehörigkeit der Ältesten zu Juda und Jerusalem knapp und eindeutig wieder.
