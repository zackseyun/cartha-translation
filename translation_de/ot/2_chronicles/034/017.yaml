  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: de
  text: Sie haben das Silber, das im Haus Jahwes[b] gefunden wurde, ausgeschüttet[a] und es den Aufsehern und denen, die die Arbeit ausführten, ausgehändigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgeleert“ beziehungsweise „ausgezahlt“. Das hebräische Verb kann hier das Ausschütten oder Ausgeben des Geldes bezeichnen; ein wörtliches Einschmelzen ist in diesem Zusammenhang weniger wahrscheinlich.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus Jahwes“ ist der Tempel.
    reason: clarification
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: sie haben … ausgeschüttet
  rationale: Das Verb kann ein Ausgießen, Ausleeren oder Auszahlen bezeichnen. Im Zusammenhang mit der anschließenden Übergabe des Silbers ist „ausgeschüttet“ anschaulich und wahrt die mögliche Vorstellung, dass Geld aus einem Behälter geleert wurde; ein Einschmelzen ist hier weniger wahrscheinlich.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann auch Geld bedeuten. „Silber“ bewahrt die konkrete Ausdrucksweise des Hebräischen und passt zu den Tempelgeldern.
- source_word: הַנִּמְצָא
  choice: das … gefunden wurde
  rationale: Das Nifal-Partizip bezeichnet das vorgefundene beziehungsweise aufgefundene Silber. Der deutsche Relativsatz gibt dies klar wieder.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus Jahwes“ entspricht der hebräischen Tempelbezeichnung formal; eine Fußnote erläutert, dass damit der Tempel gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Tetragramms als Eigenname bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתְּנוּהוּ
  choice: sie haben es … ausgehändigt
  rationale: Das Grundverb bedeutet „geben“. Zusammen mit עַל יַד bezeichnet es hier die Übergabe in die Verfügungsgewalt beziehungsweise Verantwortung anderer; „aushändigen“ ist dafür idiomatisches Deutsch.
- source_word: עַל יַד
  choice: den … ausgehändigt
  rationale: Die Wendung bedeutet wörtlich „auf/an die Hand“, idiomatisch aber die Übergabe an jemanden oder in dessen Obhut. Eine wörtliche Wiedergabe mit „in die Hand“ wäre im Deutschen bei den beiden Personengruppen schwerfällig.
- source_word: הַמֻּפְקָדִים
  choice: den Aufsehern
  rationale: Das passive Partizip bezeichnet die mit Aufsicht oder Verantwortung Beauftragten. „Aufseher“ gibt ihre Funktion knapp wieder.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: denen, die die Arbeit ausführten
  rationale: Die Formulierung bleibt so weit wie das Hebräische und schränkt die Beteiligten nicht unnötig auf einen bestimmten Handwerksberuf ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; „der HERR“ wäre die traditionelle ersetzende Lesung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwaltungs- und Übergabesprache bleibt verständlich, ohne den hebräischen Ausdruck unnötig zu verengen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
