id: 2CH.34.2
reference: 2 Chronicles 34:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes[a] recht war, und ging auf den Wegen seines Vorfahren David[b]. Er wich weder nach rechts noch nach links ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem HERRN«.'
    reason: Lexikalische und traditionelle Wiedergabe der hebräischen Wendung בְּעֵינֵי יְהוָה und des Gottesnamens.
  - marker: b
    text: 'Wörtlich: »seines Vaters David«; »Vater« bezeichnet hier den dynastischen Vorfahren.'
    reason: Kulturell-genealogische Erläuterung des erweiterten hebräischen Vaterbegriffs.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Er tat, was … recht war
  rationale: Die substantivierte Form הַיָּשָׁר bezeichnet hier im Rahmen der königlichen Beurteilungsformel das moralisch Rechte; die deutsche Wendung ist natürlich und sinngenau.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild der göttlichen Beurteilung und gibt den Gottesnamen יְהוָה als Jahwe wieder.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: und ging auf den Wegen
  rationale: Die Wegmetaphorik für Lebensführung und Verhalten bleibt erhalten; „auf den Wegen gehen“ ist im Deutschen verständlich und würdevoll.
- source_word: דָּוִיד אָבִיו
  choice: seines Vorfahren David
  rationale: אָב bezeichnet hier nicht den unmittelbaren Vater Josias, sondern David als dynastischen Ahnherrn. Die Haupttextfassung verhindert ein sachliches Missverständnis, während die Fußnote die wörtliche Form nennt.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: Er wich weder nach rechts noch nach links ab
  rationale: Die feste hebräische Wendung bezeichnet ein Abweichen in keiner der beiden Richtungen; „weder … noch“ ist im modernen Deutschen idiomatisch und bewahrt das Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ macht diesen sichtbar; die traditionelle Wiedergabe „der HERR“ wird als Alternative in der Fußnote genannt.
- issue: Bedeutung von אָבִיו bei David
  choice: Vorfahre
  alternative: Vater
  rationale: David war Josias dynastischer Vorfahr, nicht sein unmittelbarer Vater. „Vorfahre“ gibt den gemeinten genealogisch-dynastischen Bezug eindeutig wieder, ohne eine besondere konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die hebräische Augen-, Weg- und Richtungsmetaphorik bleibt weitgehend erhalten; ein mögliches Missverständnis beim dynastischen Gebrauch von »Vater« wird im Haupttext vermieden und in der Fußnote dokumentiert.
