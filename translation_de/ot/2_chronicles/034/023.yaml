source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ/הֶ֔ם כֹּה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: de
  text: 'Da sagte sie zu ihnen: »So spricht Jahwe[a], der Gott Israels: Sagt dem Mann, der euch zu mir geschickt hat:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit »der HERR« wiedergegeben.'
    reason: Erläuterung des Gottesnamens und der traditionellen Übersetzungsweise.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein. „Da sagte sie“ gibt den Fortgang im Deutschen natürlich wieder, ohne eine stärkere zeitliche Festlegung einzutragen.
- source_word: לָהֶם
  choice: zu ihnen
  rationale: Die Präposition ל mit Suffix der 3. Person maskulin Plural bezeichnet die Adressaten von Hulda.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die feststehende prophetische Botenformel. Das deutsche Präsens „spricht“ entspricht ihrem gegenwärtigen Verkündigungscharakter und ist idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn im Haupttext durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird direkt, klar und natürlich wiedergegeben.
- source_word: אִמְרוּ
  choice: Sagt
  rationale: Der Imperativ Plural richtet sich an die Gesandtschaft und bewahrt Zahl und Aufforderungscharakter des Hebräischen.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: אִישׁ steht ausdrücklich im maskulinen Singular und bezeichnet hier den Mann, der die Abgesandten geschickt hat.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: der euch zu mir geschickt hat
  rationale: Der Relativsatz identifiziert den Mann durch seine Handlung. „Geschickt hat“ ist in modernem Standarddeutsch natürlich und bewahrt die Richtung von אֵלַי.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ macht den Eigennamen im Haupttext sichtbar; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt, ohne sie stillschweigend einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel „So spricht“ bleibt bewusst formelhaft. Der abschließende Doppelpunkt und das öffnende Zitatzeichen zeigen, dass die direkte Rede im folgenden Vers fortgesetzt wird.
