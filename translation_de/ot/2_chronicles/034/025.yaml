source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: de
  text: Weil sie mich verlassen und für andere Götter[a] Räucherwerk verbrannt haben, um mich durch alle Werke ihrer Hände[b] zum Zorn zu reizen, wird sich mein Zorn über diesen Ort ergießen und nicht erlöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fremden Göttern“. Wörtlich steht im Hebräischen „anderen Göttern“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Werke ihrer Hände“ können umfassend das bezeichnen, was sie hergestellt oder getan haben, besonders von Menschen gemachte Götzenbilder und die damit verbundenen Handlungen.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Weil
  rationale: Die Wendung leitet den Grund für das angekündigte Gericht ein; „weil“ gibt die kausale Bedeutung natürlich und präzise wieder.
- source_word: עֲזָבוּנִי
  choice: sie mich verlassen
  rationale: עזב bedeutet hier „verlassen, aufgeben“ und bezeichnet im religiösen Zusammenhang Israels Abkehr von Gott.
- source_word: וַיַּקְטִירוּ
  choice: Räucheropfer dargebracht haben
  rationale: קטר im Hifil bezeichnet häufig das Verbrennen von Räucherwerk beziehungsweise das Darbringen eines Rauchopfers; „Räucheropfer darbringen“ ist im Deutschen klar und kultisch passend.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: אֲחֵרִים heißt wörtlich „andere“; die Wiedergabe bewahrt die geläufige Bundesformulierung gegen Götzendienst.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: um mich … zum Zorn zu reizen
  rationale: Die Konstruktion kann Zweck oder Folge ausdrücken. Die deutsche Formulierung erhält diese Spannung und gibt den Hifil von כעס angemessen wieder.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: durch alle Werke ihrer Hände
  rationale: Die hebräische Bildrede bleibt sichtbar und kann sowohl von Menschen hergestellte Gegenstände, besonders Götzenbilder, als auch ihre entsprechenden Taten umfassen.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: wird sich mein Grimm … ergießen
  rationale: נתך zeichnet das Ausgießen, während חֵמָה heftigen göttlichen Zorn im Gericht bezeichnet. „Grimm“ erhält Intensität und Bildsprache.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: über diesen Ort
  rationale: Zusammen mit „ergießen“ bezeichnet die Präposition das Ziel des Gerichts; „über diesen Ort“ ist idiomatisches Deutsch.
- source_word: וְלֹא תִכְבֶּה
  choice: und nicht erlöschen
  rationale: כבה bezeichnet das Erlöschen beziehungsweise Löschen eines Feuers. Die Formulierung bewahrt das mit dem Grimm verbundene Feuerbild.
theological_decisions:
- issue: Sprache des göttlichen Gerichts
  choice: wird sich mein Grimm über diesen Ort ergießen und nicht erlöschen
  alternative: wird mein Zorn über diesen Ort ausgegossen und nicht gelöscht werden
  rationale: Die Übersetzung lässt Gottes Gerichtsaussage in ihrer Schärfe stehen, ohne sie durch spätere dogmatische Kategorien zu erweitern; zugleich bewahrt sie die Bilder des Ausgießens und Erlöschens.
- issue: Bezug auf Gott in der direkten Rede
  choice: mich / mein
  alternative: den HERRN / der Zorn des HERRN
  rationale: Die hebräischen Suffixe stehen in der ersten Person. Die direkte Rede wird daher ohne erklärende Ersetzung beibehalten.
- issue: Zweck oder Folge von לְמַעַן
  choice: um mich … zum Zorn zu reizen
  alternative: sodass sie mich … zum Zorn reizten
  rationale: לְמַעַן kann Zweck oder Ergebnis bezeichnen. Die gewählte traditionelle Zweckform ist grammatisch möglich, ohne zu behaupten, die innere Absicht der Handelnden sei damit vollständig erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der Begründung und Gerichtsankündigung des Hebräischen; traditionelle religiöse Begriffe werden nur verwendet, wo sie verständlich und sachlich präzise sind.
