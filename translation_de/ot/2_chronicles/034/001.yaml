lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: war acht Jahre alt
  rationale: Die hebräische Wendung bedeutet wörtlich „ein Sohn von acht Jahren“ und ist eine übliche Altersangabe; die natürliche deutsche Entsprechung lautet „war acht Jahre alt“.
- source_word: יֹאשִׁיָּהוּ
  choice: Josia
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts. „Als er König wurde“ ist im heutigen Deutsch klar und natürlich.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: einunddreißig Jahre
  rationale: Die Angabe bezeichnet die Dauer seiner Herrschaft und wird in üblicher deutscher Zahlenform wiedergegeben.
- source_word: מָלַךְ
  choice: er regierte
  rationale: Das Verb bezeichnet hier die Ausübung der Königsherrschaft; „regierte“ ist eine direkte und idiomatische deutsche Wiedergabe.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition wird ihrem einfachen örtlichen Sinn entsprechend mit „in“ wiedergegeben.
