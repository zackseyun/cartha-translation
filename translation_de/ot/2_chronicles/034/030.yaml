source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: de
  text: Da ging der König zum Haus Jahwes[a] hinauf. Mit ihm gingen auch alle Männer Judas[b], die Einwohner Jerusalems, die Priester, die Leviten und das ganze Volk, vom Großen bis zum Kleinen, hinauf. Er las ihnen alle Worte des Buches des Bundes vor, das im Haus Jahwes gefunden worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jahwe gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder Mann Judas“; die hebräische Einzahl wird hier distributiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ging … hinauf
  rationale: Bewahrt die Richtungsangabe des Verbs עלה und passt zum Aufstieg zum Heiligtum.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Gibt die hebräische Wendung wörtlich und verständlich wieder; „Tempel Jahwes“ wäre eine mögliche, aber stärker deutende Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen JHWH als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָל אִישׁ יְהוּדָה
  choice: alle Männer Judas
  rationale: Das distributive „jeder Mann Judas“ wird in natürlichem Deutsch kollektiv wiedergegeben, wobei die ausdrücklich männliche Form des Ausgangstextes erhalten bleibt.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Natürliche kollektive Wiedergabe des Partizips „die in Jerusalem Wohnenden“.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Entspricht den üblichen Bezeichnungen der kultischen Gruppen.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Bewahrt die umfassende Aussage der hebräischen Wendung.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: vom Großen bis zum Kleinen
  rationale: Nahe Wiedergabe der hebräischen Merismusformel, die Menschen aller gesellschaftlichen Ränge umfasst.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Er las ihnen … vor
  rationale: Im Zusammenhang mit einem Buch bezeichnet קרא das laute Lesen; die Wendung „in ihren Ohren“ wird idiomatisch durch „ihnen vorlesen“ wiedergegeben.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: alle Worte des Bundesbuches
  rationale: Bewahrt die textbezogene Betonung von „allen Worten“ und die Genitivverbindung „Buch des Bundes“.
- source_word: הַנִּמְצָא בֵּית יְהוָה
  choice: das im Haus Jahwes gefunden worden war
  rationale: Das Partizip wird im erzählerischen Zusammenhang als vorzeitiges Passiv wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ macht diesen sichtbar; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt, ohne den Namen im Haupttext durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Formulierung in כָל אִישׁ יְהוּדָה
  choice: alle Männer Judas
  alternative: alle aus Juda
  rationale: אִישׁ ist ausdrücklich maskulin und wird daher nicht geschlechtsneutral eingeebnet. Zugleich nennt der folgende Ausdruck „das ganze Volk“ die umfassendere Versammlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder der Aufzählung bleiben klar erkennbar, während „las ihnen … vor“ die hebräische Hörformel natürlich wiedergibt. „Haus Jahwes“ erhält das Bild des Ausgangstextes und vermeidet eine unnötige Konkretisierung zu „Tempel“.
