  terminology: „Jahwe“, „Haus Jahwes“, „Priester“, „Leviten“ und „alle Männer Judas“ sind angemessen und quellentreu. Die Fußnoten sind korrekt an die betreffenden Ausdrücke angehängt und erklären sowohl den Gottesnamen als auch den distributiven maskulinen Singular. Die traditionelle deutsche Wiedergabe „der HERR“ wird nur als Alternative genannt.
