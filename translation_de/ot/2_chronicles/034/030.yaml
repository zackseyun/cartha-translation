  source_fidelity: 'Der Entwurf gibt die zentralen hebräischen Elemente zutreffend wieder: das Hinaufgehen zum Haus Jahwes, die umfassende Aufzählung der Anwesenden, den Merismus „vom Großen bis zum Kleinen“, das öffentliche Vorlesen und das zuvor im Haus Jahwes gefundene Buch. „Zusammen mit“ ist verständlich, kann die koordinierte Aussage jedoch leicht zu einer bloßen Begleitung des Königs abschwächen. Eine explizite zweite Verbhandlung gibt besser wieder, dass die genannten Gruppen ebenfalls hinaufgingen.'
