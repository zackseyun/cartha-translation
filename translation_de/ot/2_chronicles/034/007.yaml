  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: de
  text: Er riss die Altäre und die Aschera-Kultgegenstände[a] nieder, zermalmte die Schnitzbilder zu Staub und hieb alle Sonnensäulen[b] im ganzen Land Israel um. Dann kehrte er nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Aschera-Pfähle«. Das hebräische Wort bezeichnet Kultgegenstände, die mit der Göttin Aschera verbunden waren; ihre genaue Gestalt kann je nach Zusammenhang verschieden gewesen sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: »Räucheraltäre«. Das hebräische Wort bezeichnet kultische Gegenstände, wahrscheinlich im Zusammenhang mit dem Sonnenkult; ihre genaue Art ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: er riss ... nieder
  rationale: נתץ bezeichnet das Niederreißen oder Zerstören baulicher Anlagen; „niederreißen“ ist im Deutschen natürlich und passt zu Altären und Kultgegenständen.
- source_word: הַמִּזְבְּחוֹת
  choice: die Altäre
  rationale: Die übliche und genaue deutsche Wiedergabe von מִזְבְּחוֹת.
- source_word: הָאֲשֵׁרִים
  choice: die Aschera-Kultgegenstände
  rationale: Der Ausdruck bezeichnet mit Aschera verbundene Kultobjekte, deren konkrete Gestalt nicht in jedem Zusammenhang sicher bestimmbar ist. Die Formulierung wahrt diese Unbestimmtheit.
- source_word: הַפְּסִלִים
  choice: die Schnitzbilder
  rationale: פְּסִילִים sind geschnitzte beziehungsweise behauene Kultbilder; „Schnitzbilder“ ist präziser als das allgemeinere „Götzenbilder“.
- source_word: כִּתַּת לְהֵדַק
  choice: zermalmte ... zu Staub
  rationale: Die Wortverbindung beschreibt ein Zerschlagen oder Zermalmen bis zu feinen Partikeln.
- source_word: הַחַמָּנִים
  choice: die Sonnensäulen
  rationale: חַמָּנִים bezeichnet kultische Gegenstände, die wahrscheinlich mit dem Sonnenkult verbunden waren. Ihre genaue Beschaffenheit bleibt umstritten und wird in der Fußnote offengehalten.
- source_word: גִּדַּע
  choice: hieb ... um
  rationale: גדע bedeutet abhauen oder umhauen und passt zu aufrecht stehenden Kultobjekten.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: im ganzen Land Israel
  rationale: Gibt die umfassende räumliche Ausdehnung der Handlung knapp und idiomatisch wieder.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Dann kehrte er nach Jerusalem zurück
  rationale: „Dann“ bildet den Fortgang der hebräischen Erzählung in natürlichem Deutsch ab.
theological_decisions:
- issue: Wiedergabe der mit fremdem Kult verbundenen Gegenstände
  choice: 'Die einzelnen Kultgegenstände werden konkret benannt: „Aschera-Kultgegenstände“, „Schnitzbilder“ und „Sonnensäulen“.'
  alternative: Zusammenfassende Wiedergabe als „Götzen und Heiligtümer“ oder Deutung von חַמָּנִים als „Räucheraltäre“.
  rationale: Die konkrete Begrifflichkeit des Hebräischen bleibt erhalten, ohne sämtliche Gegenstände unter einem allgemeinen theologischen Begriff zusammenzufassen. Bei den unsicher identifizierten Objekten wird die lexikalische Spannung durch Fußnoten kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verben „niederreißen“, „zermalmen“ und „umhauen“ bewahren die kräftige Abfolge der Zerstörungshandlungen. Fachlich unsichere Kultbegriffe werden verständlich wiedergegeben und durch Fußnoten abgesichert.
