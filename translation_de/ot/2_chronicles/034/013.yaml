  text: וְ/עַ֣ל הַ/סַּבָּלִ֗ים וּֽ/מְנַצְּחִים֙ לְ/כֹל֙ עֹשֵׂ֣ה מְלָאכָ֔ה לַ/עֲבוֹדָ֖ה וַ/עֲבוֹדָ֑ה וּ/מֵֽ/הַ/לְוִיִּ֔ם סוֹפְרִ֥ים וְ/שֹׁטְרִ֖ים וְ/שׁוֹעֲרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: de
  text: Sie waren über die Lastträger gesetzt und leiteten alle an, die bei den verschiedenen Diensten[a] arbeiteten. Einige von den Leviten waren Schreiber, Amtsträger und Torhüter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Dienst und Dienst“. Die Wiederholung bezeichnet wahrscheinlich die verschiedenen einzelnen Dienstbereiche.'
    reason: Die ungewöhnliche hebräische Wiederholung wird im Haupttext idiomatisch wiedergegeben, bleibt aber in der Fußnote sichtbar.
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: Sie waren über die Lastträger gesetzt
  rationale: עַל bezeichnet hier administrative Aufsicht; סַבָּלִים sind speziell diejenigen, die Lasten tragen. Die Formulierung wahrt den Anschluss an den vorherigen Vers.
- source_word: וּמְנַצְּחִים
  choice: und leiteten … an
  rationale: Das Partizip bezeichnet in diesem Zusammenhang leitende oder beaufsichtigende Tätigkeit. „Leiteten … an“ ist natürliches modernes Deutsch und unterscheidet diese Aufgabe von den später genannten Amtsträgern.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: alle …, die … arbeiteten
  rationale: Die Wendung schließt sämtliche an der Arbeit Beteiligten ein und gibt den partizipialen Ausdruck verständlich wieder.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: bei den verschiedenen Diensten
  rationale: Die Wiederholung von עֲבוֹדָה hat wahrscheinlich verteilende Bedeutung und verweist auf die einzelnen Arbeits- oder Dienstbereiche. Die idiomatische Wiedergabe wird durch eine Fußnote zur hebräischen Ausdrucksweise ergänzt.
- source_word: וּמֵהַלְוִיִּם
  choice: Einige von den Leviten waren
  rationale: 'מִן ist hier partitiv: Ein Teil der Leviten nahm die anschließend genannten Aufgaben wahr.'
- source_word: סוֹפְרִים
  choice: Schreiber
  rationale: Der Ausdruck bezeichnet Schreiber beziehungsweise mit Schriftstücken und Aufzeichnungen betraute Personen; „Schreiber“ ist die direkte und etablierte Entsprechung.
- source_word: שֹׁטְרִים
  choice: Amtsträger
  rationale: שֹׁטְרִים bezeichnet Funktionsträger mit administrativer oder aufsichtsführender Verantwortung. „Amtsträger“ bleibt bewusst allgemein und vermeidet eine zu enge moderne Amtsbezeichnung.
- source_word: שׁוֹעֲרִים
  choice: Torhüter
  rationale: Das Wort bezeichnet Personen, die an den Toren Dienst tun; „Torhüter“ ist die übliche und genaue Wiedergabe.
