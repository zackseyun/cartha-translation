- from: Weil dein Herz weich geworden ist[a] und du dich vor Gott gedemütigt hast, als du seine Worte gegen diesen Ort und gegen seine Bewohner hörtest, und weil du dich vor mir gedemütigt, deine Kleider zerrissen und vor mir geweint hast, darum habe auch ich dich erhört, spricht Jahwe.
  to: Weil dein Herz weich war und du dich vor Gott gedemütigt hast, als du seine Worte gegen diesen Ort und gegen seine Bewohner hörtest, und dich vor mir gedemütigt, deine Kleider zerrissen und vor mir geweint hast, habe auch ich gehört, spricht Jahwe.
  rationale: 'Die Übersetzung wird an zwei Stellen quellennäher gefasst: „weich war“ vermeidet die ungesicherte Aussage eines Wandels, und „habe auch ich gehört“ bewahrt die semantische und syntaktische Offenheit von שָׁמַע. Die Fußnote bleibt inhaltlich passend; ihr Anker [a] steht nach „weich war“.'
