  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: de
  text: Weil dein Herz weich war und du dich vor Gott gedemütigt hast, als du seine Worte gegen diesen Ort und gegen seine Bewohner hörtest, und dich vor mir gedemütigt, deine Kleider zerrissen und vor mir geweint hast, habe auch ich gehört, spricht Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: Weil … darum
  rationale: Die eröffnende Kausalpartikel begründet Gottes Antwort. Die deutsche Korrespondenz „weil … darum“ hält den langen Satz verständlich und bildet die Ursache-Folge-Struktur deutlich ab.
- source_word: רַךְ לְבָבְךָ
  choice: dein Herz weich geworden ist
  rationale: רַךְ bedeutet wörtlich „weich/zart“. Zusammen mit „Herz“ bezeichnet es hier eine empfängliche, demütige innere Haltung. „Weich geworden“ ist im Deutschen idiomatisch und lässt die Bildsprache bestehen.
- source_word: וַתִּכָּנַע
  choice: du dich … gedemütigt hast
  rationale: Der Niphal von כנע beschreibt hier Josias Selbsterniedrigung beziehungsweise demütige Unterordnung. Beide Vorkommen werden gleich wiedergegeben, um die Wiederholung zu bewahren.
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: vor Gott
  rationale: Die Wendung bezeichnet ein demütiges Verhalten in Gottes Gegenwart; „vor Gott“ ist knapp, natürlich und quellennah.
- source_word: בְּשָׁמְעֲךָ
  choice: als du … hörtest
  rationale: ב mit dem Infinitivus constructus hat hier temporale Bedeutung. „Als du … hörtest“ gibt diese Beziehung natürlich wieder.
- source_word: דְּבָרָיו
  choice: seine Worte
  rationale: Das Suffix bezieht sich im Kontext am natürlichsten auf Gott. „Worte“ wahrt die konkrete Mehrzahl und vermeidet die Verengung auf „Botschaft“.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: gegen diesen Ort und gegen seine Bewohner
  rationale: Im Gerichtskontext hat עַל adversative Kraft. Die Wiederholung von „gegen“ erhält den Nachdruck des Hebräischen.
- source_word: לְפָנַי
  choice: vor mir
  rationale: In der direkten Gottesrede ist „vor mir“ persönlich und prägnant. Die zweimalige Formulierung im Satz bewahrt die rhetorische Wiederholung des Ausgangstextes.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: deine Kleider zerrissen
  rationale: Das Zerreißen der Kleider ist ein sichtbares Zeichen von Trauer und Reue. „Kleider“ ist modernes Standarddeutsch und bewahrt die konkrete Handlung.
- source_word: וַתֵּבְךְּ
  choice: geweint hast
  rationale: „Weinen“ gibt den Ausdruck feierlicher Trauer genauer wieder als das mehrdeutige „schreien“.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: darum habe auch ich dich erhört
  rationale: Das Hebräische nennt kein ausdrückliches Objekt. Im Kontext bedeutet Gottes „Hören“ ein annehmendes Reagieren auf Josias Demut und Weinen; „dich erhört“ ist natürliches Deutsch, macht diese pragmatische Bedeutung deutlich und wird durch eine theologische Entscheidung dokumentiert.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird würdig und idiomatisch wiedergegeben. יְהוָה erscheint als der Eigenname „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes Eigennamen. „Jahwe“ gibt den Namen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Gottes Hören in וְגַם אֲנִי שָׁמַעְתִּי
  choice: habe auch ich dich erhört
  alternative: habe auch ich gehört
  rationale: Ein ausgesprochenes Objekt fehlt im Hebräischen. Der Zusammenhang legt nahe, dass Gott Josias Weinen beziehungsweise ihn selbst hört und darauf eingeht. „Erhört“ ist im Deutschen verständlicher, ohne eine bestimmte konkrete Bitte in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Die hebräischen Wiederholungen („gegen“, „gedemütigt“, „vor“) bleiben erhalten. Die lange Kausalstruktur wird durch „Weil … darum“ für heutige Leser übersichtlich gemacht.
