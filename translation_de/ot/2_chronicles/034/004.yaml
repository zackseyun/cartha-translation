source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: de
  text: Vor seinen Augen riss man die Altäre der Baale nieder, und er hieb die Sonnensäulen[a] ab, die sich über ihnen befanden. Die Ascheren[b], die geschnitzten Bilder und die gegossenen Bilder zerbrach und zermalmte er; dann streute er ihre Überreste auf die Gräber derer, die ihnen Opfer dargebracht hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Räucheraltäre. Der hebräische Ausdruck ist unsicher und kann Kultmale bezeichnen, die möglicherweise mit der Sonnenverehrung verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Aschera-Pfähle. Gemeint sind Kultgegenstände, die mit der Göttin Aschera verbunden waren; ihre genaue Gestalt ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: riss man ... nieder
  rationale: Der hebräische Plural bezeichnet nicht näher genannte Ausführende. Das deutsche unpersönliche „man“ bewahrt dies natürlicher als ein unbelegtes „sie“.
- source_word: לְפָנָיו
  choice: vor seinen Augen
  rationale: Gibt die Handlung in Josias Gegenwart anschaulich und idiomatisch wieder.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: die Altäre der Baale
  rationale: Der Plural wird bewahrt und verweist auf verschiedene lokale Erscheinungsformen oder Kultrepräsentationen.
- source_word: הַחַמָּנִים
  choice: die Sonnensäulen
  rationale: Der unsichere Kultbegriff bezeichnet wahrscheinlich der Sonne zugeordnete Kultmale; eine alternative Deutung wird in der Fußnote genannt.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: die sich über ihnen befanden
  rationale: Die Relativkonstruktion wird auf die unmittelbar vorausgehenden Sonnensäulen bezogen, ohne ihre genaue räumliche Anordnung stärker festzulegen.
- source_word: גִּדֵּעַ
  choice: hieb ... ab
  rationale: Das Verb bezeichnet ein gewaltsames Abhauen oder Abtrennen und passt zu den erhöhten Kultmalen.
- source_word: הָאֲשֵׁרִים
  choice: die Ascheren
  rationale: Die eingedeutschte Transliteration hält offen, ob Kultpfähle, Kultbäume oder andere mit Aschera verbundene Gegenstände gemeint sind.
- source_word: הַפְּסִלִים
  choice: die geschnitzten Bilder
  rationale: Bezeichnet präzise durch Schnitzen hergestellte Kultbilder.
- source_word: הַמַּסֵּכוֹת
  choice: die gegossenen Bilder
  rationale: Gibt die Herstellung als gegossene, gewöhnlich metallene Kultbilder genauer wieder als das allgemeinere „Metallbilder“.
- source_word: שִׁבַּר וְהֵדַק
  choice: zerbrach und zermalmte
  rationale: Die Verbenfolge bewahrt die Steigerung vom Zerbrechen bis zur Zerkleinerung.
- source_word: וַיִּזְרֹק
  choice: dann streute er ihre Überreste
  rationale: Im Kontext sind die zerkleinerten Reste gemeint; „streute“ entspricht dem Verteilen über den Gräbern.
- source_word: הַזֹּבְחִים לָהֶם
  choice: derer, die ihnen Opfer dargebracht hatten
  rationale: Das Partizip bezeichnet die früheren Verehrer; das Plusquamperfekt stellt ihre Opferhandlungen natürlich vor die geschilderte Zerstörung.
theological_decisions:
- issue: Bedeutung von הַחַמָּנִים
  choice: Sonnensäulen
  alternative: Räucheraltäre
  rationale: Der seltene Ausdruck ist lexikalisch unsicher und wird häufig mit Sonnenkult verbunden. Die Hauptfassung wahrt diese wahrscheinliche kultische Zuordnung; die kontextuell mögliche Deutung als Räucheraltäre bleibt in der Fußnote sichtbar.
- issue: Bedeutung von הָאֲשֵׁרִים
  choice: Ascheren
  alternative: Aschera-Pfähle
  rationale: Die Transliteration vermeidet eine unnötige Festlegung auf Pfähle, da der Ausdruck verschiedene mit Aschera verbundene Kultgegenstände bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt den Wechsel vom unbestimmten Plural der Helfer zu Josia als handelnder Einzelperson. Seltene Kultbegriffe werden knapp und verständlich wiedergegeben, während echte lexikalische Unsicherheiten durch Fußnoten offengehalten werden.
