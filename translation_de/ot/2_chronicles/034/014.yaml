  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: de
  text: Als sie das Silber herausbrachten, das in das Haus Jahwes gebracht worden war, fand der Priester Hilkija das Buch des Gesetzes Jahwes, das durch Mose übermittelt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung im Sinn von „durch Mose“ oder „durch Mose übermittelt“.'
    reason: Lexikalische Alternative und Erklärung einer hebräischen Redewendung.
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Als sie … herausbrachten
  rationale: Die Präposition mit dem Infinitivus constructus und dem Suffix der 3. Person Plural bildet einen temporalen Nebensatz. „Als sie … herausbrachten“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף kann sowohl „Silber“ als auch „Geld“ bedeuten. „Silber“ bewahrt die konkrete Ausdrucksweise des Hebräischen, obwohl im Zusammenhang die eingesammelten Geldmittel gemeint sind.
- source_word: הַמּוּבָא
  choice: das … gebracht worden war
  rationale: Das passive Hofal-Partizip von בוא bezeichnet etwas, das hineingebracht wurde. Das deutsche Plusquamperfekt verdeutlicht, dass dies dem Herausbringen vorausging.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ entspricht dem hebräischen בֵּית und bleibt näher am Ausgangstext als „Tempel“. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: der Priester Hilkija
  rationale: Diese deutsche Apposition ist natürlich; der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: das Buch mit dem Gesetz Jahwes
  rationale: סֵפֶר kann Buch, Schriftstück oder Schriftrolle bezeichnen; „Buch“ ist hier verständlich und traditionsnah. תּוֹרָה umfasst Weisung und Gesetz. „Gesetz“ passt zum bundestheologischen Zusammenhang, während „mit dem“ im Deutschen klarstellt, dass der folgende Relativsatz inhaltlich auf das Gesetz bezogen ist.
- source_word: בְּיַד מֹשֶׁה
  choice: das durch Mose übermittelt worden war
  rationale: Wörtlich steht „durch die Hand Moses“. Die Wendung bezeichnet hier Vermittlung oder Beauftragung. „Durch Mose übermittelt“ gibt den idiomatischen Sinn wieder, ohne genauer festzulegen, ob Niederschrift, Übergabe oder Verkündigung im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: „Gesetz“ ist in diesem Zusammenhang die geläufige Bezeichnung für die durch Mose vermittelte Tora. Die breitere Bedeutung „Weisung“ bleibt als mögliche lexikalische Nuance bestehen, wird aber nicht zur alleinigen Deutung erhoben.
- issue: Vermittlung durch Mose in בְּיַד מֹשֶׁה
  choice: durch Mose übermittelt
  alternative: durch die Hand Moses
  rationale: Die idiomatische Wiedergabe benennt Mose als Vermittler, ohne eine weitergehende Aussage über die genaue Art der Autorschaft oder Überlieferung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Ablauf, vermeidet jedoch die im Deutschen missverständliche wörtliche Wendung „durch die Hand Moses“ im Haupttext.
