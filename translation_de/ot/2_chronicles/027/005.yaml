source:
  edition: WLC
  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: de
  text: Er führte Krieg gegen den König der Ammoniter und gewann die Oberhand über sie. In jenem Jahr gaben ihm die Ammoniter hundert Talente Silber, zehntausend Kor Weizen und zehntausend Kor Gerste.[a] Dasselbe entrichteten ihm die Ammoniter auch im zweiten und im dritten Jahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Kor war ein antikes Hohlmaß; seine genaue Größe lässt sich nicht sicher bestimmen.
    reason: historical_measure
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: führte Krieg gegen
  rationale: Die Verbindung bezeichnet hier eine kriegerische Auseinandersetzung; im Deutschen gibt „gegen“ die feindliche Beziehung eindeutig und natürlich wieder.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: König der Ammoniter
  rationale: בני עמון ist die übliche Volksbezeichnung; „Ammoniter“ ist die geläufige deutsche Wiedergabe.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: gewann die Oberhand über sie
  rationale: חזק mit על bezeichnet im militärischen Zusammenhang das Überwältigen beziehungsweise Obsiegen und nicht nur körperliche Stärke.
- source_word: וַיִּתְּנוּ לוֹ
  choice: gaben ihm
  rationale: Die Grundbedeutung von נתן bleibt erhalten; aus dem Zusammenhang ergibt sich, dass es sich um eine Tributzahlung handelt.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: hundert Talente Silber
  rationale: ככר ist eine Gewichtseinheit; „Talent“ ist die etablierte historische Bezeichnung, ohne eine unsichere moderne Umrechnung einzutragen.
- source_word: כֹּרִים
  choice: Kor
  rationale: Kor bezeichnet ein antikes Hohlmaß. Die transliterierte Maßeinheit bewahrt die historische Spezifität.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: und zehntausend Kor Gerste
  rationale: Obwohl „Kor“ im Hebräischen nicht wiederholt wird, ist die Maßeinheit aus der parallelen Formulierung eindeutig mitzudenken und wird für klares Deutsch ergänzt.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: Dasselbe entrichteten ihm
  rationale: השיב bedeutet wörtlich „zurückbringen“; im Zusammenhang wiederholter Tributzahlungen gibt „entrichten“ die funktionale Bedeutung natürlich wieder.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: auch im zweiten und im dritten Jahr
  rationale: Die Formulierung bezeichnet dieselbe Leistung in jedem der beiden Folgejahre; „auch“ macht die Wiederholung im Deutschen deutlich.
