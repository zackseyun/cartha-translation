  register: Modernes, würdevolles Standarddeutsch. Die königliche Schlussformel bleibt knapp; ein altertümliches »siehe« wurde vermieden, seine hervorhebende Funktion jedoch durch den Gedankenstrich und die Satzstellung angedeutet.
