base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: de
  text: Die übrigen Taten Jotams[a], alle seine Kriege und seine Wege[b] – siehe, sie sind im Buch der Könige von Israel und Juda aufgezeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die übrigen Worte Jotams«; die hebräische Wendung meint hier den Bericht über seine Taten oder Angelegenheiten.'
    reason: lexical_alternative
  - marker: b
    text: »Seine Wege« kann hier auch seinen Lebenswandel oder sein Verhalten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Die übrigen Taten Jotams
  rationale: In der königlichen Schlussformel bezeichnet דִּבְרֵי nicht nur »Worte«, sondern die Taten beziehungsweise Angelegenheiten des Königs. »Die übrigen Taten« gibt die historiografische Wendung natürlich wieder.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: alle seine Kriege
  rationale: מִלְחָמוֹת bezeichnet hier die kriegerischen Auseinandersetzungen des Königs; »Kriege« ist direkt und unaufdringlich.
- source_word: וּדְרָכָיו
  choice: und sein Lebenswandel
  rationale: דְּרָכָיו bedeutet wörtlich »seine Wege«, bezeichnet in diesem Zusammenhang aber seine Lebensführung beziehungsweise sein Verhalten. »Lebenswandel« bewahrt den ethischen Sinn in würdigem, verständlichem Deutsch.
- source_word: הִנָּם כְּתוּבִים
  choice: sie sind … aufgezeichnet
  rationale: הִנָּם hebt den Hinweis auf den vorhandenen Bericht hervor. Eine Wiedergabe mit »siehe« wäre im Deutschen hier schwerfällig; die hervorgehobene Nachstellung nach dem Gedankenstrich wahrt die Hinweisfunktion. »Aufgezeichnet« entspricht dem archivalischen Zusammenhang von כְּתוּבִים.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: im Buch der Könige von Israel und Juda
  rationale: Das hebräische עַל wird bei einem schriftlichen Quellenverweis idiomatisch mit »im« wiedergegeben. Die Formulierung bezeichnet den Titel beziehungsweise die Art des angeführten königlichen Geschichtswerks.
theological_decisions: []
