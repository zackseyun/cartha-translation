base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: de
  text: Und Jotam legte sich zu seinen Vätern[a], und man begrub ihn in der Stadt Davids. Sein Sohn Ahas wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutender: »starb«. Wörtlich steht im Hebräischen: »legte sich zu seinen Vätern«; dies ist eine feste königliche Todesformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt zusammen mit »zu seinen Vätern« die bildhafte hebräische Königsformel für den Tod, ohne sie im Haupttext ausschließlich mit »starb« auszudeuten.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die im Deutschen vertraute biblische Wendung gibt die dynastische Todesformel natürlich wieder; »Vorfahren« wäre deutlicher, aber weniger formnah.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: man begrub ihn
  rationale: Das unbestimmte deutsche »man« entspricht dem nicht näher genannten pluralischen Subjekt des aktiven hebräischen Verbs.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Gängige und transparente Wiedergabe der Ortsbezeichnung.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang einer Thronfolge bezeichnet das Verb hier den Herrschaftsantritt; diese Formulierung ist im modernen Deutsch natürlicher als »regierte an seiner Stelle«.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt den Gedanken der Nachfolge beziehungsweise Ablösung genau wieder.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: אָחָז
  choice: Ahas
  rationale: Im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Die ausdrücklich genannte verwandtschaftliche Beziehung bleibt in der Nachfolgeformel erhalten.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: Die hebräische Bildsprache »legte sich zu seinen Vätern« bleibt im Haupttext erhalten.
  alternative: »starb wie seine Vorfahren«
  rationale: Die wörtlichere Fassung bewahrt die traditionelle Metapher und legt keine weitergehende Aussage über den Zustand der Toten fest; die Bedeutung im Kontext wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel wird beibehalten, während »man begrub ihn« und »wurde … König« natürliches heutiges Deutsch bieten.
