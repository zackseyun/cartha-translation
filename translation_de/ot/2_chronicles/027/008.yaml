- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: sechzehn Jahre
  rationale: Die Zahl und die Zeiteinheit werden direkt und idiomatisch wiedergegeben.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet das Regieren als König; „regierte“ ist im Deutschen die knappe, übliche Entsprechung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition bezeichnet hier den Ort; die direkte Entsprechung lautet „in Jerusalem“.
