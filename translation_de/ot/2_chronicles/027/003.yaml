source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: de
  text: Er baute das obere Tor des Hauses Jahwes, und an der Mauer des Ofel baute er viel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: An der Mauer des Ofel führte er umfangreiche Bauarbeiten aus.'
    reason: Die knappe hebräische Wendung לָרֹב kann sowohl formal mit „viel“ als auch idiomatischer als Hinweis auf umfangreiche Bautätigkeit wiedergegeben werden.
lexical_decisions:
- source_word: בָּנָה
  choice: baute
  rationale: Die Grundbedeutung ist „bauen, errichten“. Der unmittelbare Zusammenhang verlangt nicht die spezifischere Wiedergabe „wiederaufbauen“.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: das obere Tor am Haus Jahwes
  rationale: „Oberes Tor“ gibt הָעֶלְיוֹן attributiv wieder. „Am Haus Jahwes“ bezeichnet in natürlichem Deutsch die Zugehörigkeit beziehungsweise Lage des Tores, ohne das konkretere Wort „Tempel“ in den Text einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; im Genitiv steht hier die im Deutschen natürliche Form „Jahwes“.
- source_word: וּבְחוֹמַת
  choice: und an der Mauer
  rationale: Die Präposition ב bezeichnet hier den Ort beziehungsweise Gegenstand der Bauarbeiten. Bei Arbeiten an einem Bauwerk ist „an der Mauer“ im Deutschen idiomatisch.
- source_word: הָעֹפֶל
  choice: des Ofel
  rationale: Ofel ist die Bezeichnung des erhöhten, befestigten Stadtbereichs Jerusalems und wird daher als Eigenname transkribiert.
- source_word: לָרֹב
  choice: viel
  rationale: Die Wendung bezeichnet das große Ausmaß der Bautätigkeit. „Er baute viel“ bleibt eng am Hebräischen; eine idiomatisch freiere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen; die Wiederholung von „baute“ wird bewusst bewahrt. „Haus Jahwes“ erhält das hebräische Bild, während „Ofel“ als Ortsbezeichnung unübersetzt bleibt.
