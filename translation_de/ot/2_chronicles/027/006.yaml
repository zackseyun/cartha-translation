  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: de
  text: So wurde Jotam stark, denn er richtete seine Wege vor dem HERRN, seinem Gott, aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: So wurde … stark
  rationale: Das Hitpael von חזק bezeichnet hier ein Erstarken bzw. Festwerden. „Wurde stark“ gibt den Vorgang knapp und natürlich wieder.
- source_word: הֵכִין דְּרָכָיו
  choice: er richtete seine Wege … aus
  rationale: הכין bedeutet im Hifil „fest machen, bereiten, ausrichten“; zusammen mit „Wege“ ist eine bewusste und beständige Lebensausrichtung gemeint. „Richtete … aus“ bewahrt das Wegbild und vermeidet die missverständliche Vorstellung bloßen Ordnens.
- source_word: לִפְנֵי יְהוָה
  choice: vor dem HERRN
  rationale: לִפְנֵי wird formal mit „vor“ wiedergegeben; der Gottesname יהוה erscheint gemäß verbreiteter deutscher Bibelkonvention als „der HERR“.
theological_decisions:
- issue: Verhältnis zwischen Jotams Erstarken und seiner Lebensführung
  choice: „denn“ bewahrt die ausdrücklich mit כִּי markierte Begründung.
  alternative: „weil“ wäre ebenfalls möglich.
  rationale: Der Text stellt einen ursächlichen Zusammenhang her, ohne näher zu bestimmen, auf welche Weise Jotams Ausrichtung vor Gott zu seiner Stärke führte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das biblische Bild der „Wege“ bleibt erhalten; „vor dem HERRN“ bewahrt die relationale und theologische Spannung des hebräischen Ausdrucks.
