  text: וְ/עָרִ֥ים בָּנָ֖ה בְּ/הַר יְהוּדָ֑ה וּ/בֶ/חֳרָשִׁ֣ים בָּנָ֔ה בִּֽירָנִיּ֖וֹת וּ/מִגְדָּלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: de
  text: Er baute Städte im Bergland von Juda und errichtete in den Waldgebieten[a] Festungen[b] und Türme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bewaldeten Gebieten“ oder „Dickichten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zitadellen“ oder „Befestigungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: Städte
  rationale: Der Plural bezeichnet bewohnte städtische Siedlungen; „Städte“ ist im Zusammenhang königlicher Bautätigkeit die übliche und natürliche Wiedergabe.
- source_word: בָּנָה
  choice: baute / errichtete
  rationale: Das Verb bedeutet schlicht „bauen“. Die stilistische Variation „baute“ und „errichtete“ ergibt im Deutschen einen natürlichen Satz, ohne den Bedeutungsgehalt zu verändern.
- source_word: בְּהַר יְהוּדָה
  choice: im Bergland von Juda
  rationale: הַר kann einen Berg oder eine gebirgige Region bezeichnen. Hier ist die geografische Regionsbezeichnung „Bergland von Juda“ gemeint.
- source_word: חֳרָשִׁים
  choice: Waldgebieten
  rationale: Das Substantiv bezeichnet bewaldete Flächen, Wälder oder Dickichte. „Waldgebiete“ gibt den landschaftlichen Sinn idiomatisch wieder und lässt die Ausdehnung offen.
- source_word: בִּירָנִיּוֹת
  choice: Festungen
  rationale: Der seltene Plural bezeichnet befestigte Bauwerke. „Festungen“ passt zum militärisch-defensiven Zusammenhang und vermeidet die stärker mittelalterliche Färbung von „Burgen“.
- source_word: מִגְדָּלִים
  choice: Türme
  rationale: Das Substantiv bedeutet regelmäßig „Türme“ und bezeichnet hier wahrscheinlich Verteidigungs- oder Wachtürme.
