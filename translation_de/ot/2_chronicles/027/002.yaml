source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes richtig war, ganz so, wie es sein Vater Usija getan hatte. Nur betrat er den Tempel Jahwes nicht.[a] Das Volk aber handelte weiterhin verderblich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage bildet wahrscheinlich einen Gegensatz zu Usija, der eigenmächtig in den Tempel gegangen war; siehe 2. Chronik 26,16–21.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: „Das Volk richtete weiterhin Verderben an“ oder „Das Volk verdarb sich weiterhin.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Er tat, was … richtig war
  rationale: Die substantivierte Adjektivform הַיָּשָׁר bezeichnet das moralisch Richtige. Die deutsche Wiedergabe ist klar und bewahrt die Wertung des hebräischen Textes.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Bewertungsformel wird bildnah und im Deutschen verständlich wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: ganz so, wie es sein Vater Usija getan hatte
  rationale: Die Formulierung gibt die umfassende Übereinstimmung mit dem Vorbild des Vaters idiomatisch wieder; das Plusquamperfekt macht den zeitlichen Bezug deutlich.
- source_word: רַק
  choice: Nur
  rationale: רַק schränkt den vorausgehenden Vergleich ein. „Nur“ bewahrt diese knappe Einschränkung, ohne sie stärker auszudeuten.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: betrat er den Tempel Jahwes nicht
  rationale: בוא אֶל bezeichnet hier das Hineingehen; „betreten“ ist prägnant. הֵיכָל meint in diesem Zusammenhang den Tempel beziehungsweise das Heiligtum.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Das Volk jedoch handelte weiterhin verdorben
  rationale: וְעוֹד drückt das Fortbestehen eines Zustands aus. Das Hifil-Partizip von שׁחת kann verderbliches oder verdorbenes Handeln bezeichnen; die Übersetzung wahrt den fortdauernden moralisch-religiösen Sinn, ohne ein nicht genanntes Objekt einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Einschränkung auf Usijas Tempelgang
  choice: Der Haupttext bleibt knapp; der wahrscheinliche geschichtliche Kontrast wird in einer Fußnote erläutert.
  alternative: Den unerlaubten Tempelgang Usijas ausdrücklich in den Vers einfügen.
  rationale: Der Vers selbst sagt nur, dass Jotam den Tempel nicht betrat. Der Zusammenhang in 2. Chronik 26,16–21 legt einen Kontrast zu Usija nahe, doch diese Deutung soll den Wortlaut nicht ersetzen.
- issue: Bedeutung von מַשְׁחִיתִים
  choice: handelte weiterhin verdorben
  alternative: richtete weiterhin Verderben an / verdarb sich weiterhin
  rationale: Die Form kann sowohl verderbliches Handeln als auch ein Sich-Verderben nahelegen. Die gewählte Formulierung hält den moralischen Sinn fest, ohne die nicht ausdrücklich genannte Zielrichtung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bildnaher Wiedergabe der hebräischen Bewertungsformel. Die Sätze bleiben leicht verständlich; Mehrdeutigkeiten werden nicht dogmatisch aufgelöst, sondern bei Bedarf in Fußnoten ausgewiesen.
