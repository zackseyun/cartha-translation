base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: de
  text: Ich werde ihn mit deiner Tunika bekleiden und ihm deine Schärpe fest umbinden. Deine Herrschaftsgewalt werde ich in seine Hand legen, und er wird den Bewohnern Jerusalems und dem Haus Juda ein Vater[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bild bezeichnet fürsorgliche, verantwortliche Leitung, nicht leibliche Vaterschaft.
    reason: Erläuterung der direkten Vatermetapher
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: Ich werde ihn … bekleiden
  rationale: Der Hifil von לבש mit Objektsuffix bezeichnet das Bekleiden einer Person. „Bekleiden“ ist würdig und passt zum Einsetzungsvorgang.
- source_word: כֻּתָּנְתֶּךָ
  choice: mit deinem Untergewand
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes, tunikaartiges Gewand. „Untergewand“ gibt die Art des Kleidungsstücks im Deutschen verständlich wieder.
- source_word: וְאַבְנֵטְךָ
  choice: deine Schärpe
  rationale: אַבְנֵט ist ein gürtendes Band, häufig als Teil einer Amtskleidung. „Schärpe“ bewahrt hier den feierlich-amtlichen Charakter.
- source_word: אֲחַזְּקֶנּוּ
  choice: ihm … fest umbinden
  rationale: Der Piel von חזק bedeutet fest oder stark machen. Auf die Schärpe bezogen ist das feste Umbinden die naheliegende konkrete Bedeutung.
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: deine Herrschaftsgewalt
  rationale: מֶמְשָׁלָה bezeichnet Herrschaft beziehungsweise Regierungsgewalt. „Herrschaftsgewalt“ drückt die übertragene amtliche Autorität aus, ohne sie auf eine bestimmte Amtslehre einzuengen.
- source_word: אֶתֵּן בְּיָדוֹ
  choice: werde ich in seine Hand legen
  rationale: Die konkrete hebräische Wendung vom Geben in die Hand wird bewahrt und bezeichnet zugleich die Übertragung von Verantwortung und Gewalt.
- source_word: וְהָיָה לְאָב
  choice: er wird … ein Vater sein
  rationale: Die direkte Vatermetapher bleibt erhalten. Die Konstruktion beschreibt den neuen Status infolge seiner Einsetzung; das deutsche Futur gibt dies natürlich wieder.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: den Bewohnern Jerusalems
  rationale: Das singularische Partizip ist hier kollektiv zu verstehen. Der deutsche Plural gibt diesen Bezug idiomatisch wieder.
- source_word: וּלְבֵית יְהוּדָה
  choice: dem Haus Juda
  rationale: „Haus Juda“ bewahrt die biblische Bezeichnung für das Volk beziehungsweise das Königreich Juda.
theological_decisions:
- issue: Die metaphorische Bezeichnung eines politischen Amtsträgers als Vater
  choice: Die direkte Metapher „ein Vater sein“ steht im Haupttext.
  alternative: „wie ein Vater sein“ oder „ein Beschützer sein“
  rationale: לְאָב enthält keinen ausdrücklichen Vergleich. Die direkte Wiedergabe bewahrt das Bild verantwortlicher, fürsorglicher Leitung, ohne es durch spätere politische oder kirchliche Vorstellungen auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Investiturszene bleibt durch die konkreten Bilder von Kleidung, Schärpe und Hand anschaulich; die Vatermetapher wird nicht paraphrasiert. Der Fußnotenmarker steht bei der tatsächlich erläuterten Metapher.
