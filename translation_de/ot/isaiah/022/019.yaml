source:
  edition: WLC
  text: וַ/הֲדַפְתִּ֖י/ךָ מִ/מַּצָּבֶ֑/ךָ וּ/מִ/מַּעֲמָֽדְ/ךָ֖ יֶהֶרְסֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: de
  text: Ich werde dich aus deinem Amt stoßen, und aus deiner Stellung wird er dich stürzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt die Rede von „Ich werde dich … stoßen“ zu „er wird dich stürzen“. Manche Übersetzungen gleichen den zweiten Satzteil zu „ich werde dich stürzen“ an.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: Ich werde dich … stoßen
  rationale: Das Verb הדף bezeichnet ein kraftvolles Weg- oder Fortstoßen. Die Form hat im prophetischen Zusammenhang Zukunftssinn. „Stoßen“ bewahrt das körperliche Bild einer gewaltsamen Entfernung.
- source_word: מִמַּצָּבֶךָ
  choice: aus deinem Amt
  rationale: מַצָּב kann einen Standplatz, Posten oder eine amtliche Stellung bezeichnen. Im Zusammenhang mit Schebnas Enthebung gibt „Amt“ die institutionelle Bedeutung klar und natürlich wieder.
- source_word: וּמִמַּעֲמָדְךָ
  choice: aus deiner Stellung
  rationale: מַעֲמָד bezeichnet Stand, Stellung oder Dienstplatz. „Stellung“ wahrt den Parallelismus zu „Amt“, ohne beide Ausdrücke gleich wiederzugeben.
- source_word: יֶהֶרְסֶךָ
  choice: wird er dich stürzen
  rationale: הרס bedeutet gewöhnlich „niederreißen“ oder „zerstören“. Bei einer Person als Objekt bezeichnet es hier bildhaft deren Sturz aus einer einflussreichen Stellung. „Stürzen“ ist im Deutschen idiomatisch und erhält das Bild des Herabsetzens; die dritte Person Singular bleibt sichtbar.
theological_decisions:
- issue: Wechsel des Subjekts im zweiten Satzglied
  choice: Der Wechsel von der ersten Person („Ich werde“) zur dritten Person Singular („er wird“) bleibt erhalten.
  alternative: 'Beide Satzglieder auf die erste Person angleichen: „Ich werde dich … stoßen und dich … stürzen“; oder unpersönlich-passiv übersetzen: „du wirst gestürzt werden“.'
  rationale: Der masoretische Text enthält einen auffälligen Personenwechsel. Ob „er“ Gott in einem Wechsel der Redeweise oder einen nicht näher bezeichneten Vollstrecker meint, wird nicht ausdrücklich geklärt. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und das Bild einer gewaltsamen Amtsenthebung werden bewahrt; der ungewöhnliche Subjektwechsel wird nicht geglättet.
