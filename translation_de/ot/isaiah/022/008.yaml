  text: וַ/יְגַ֕ל אֵ֖ת מָסַ֣ךְ יְהוּדָ֑ה וַ/תַּבֵּט֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֶל נֶ֖שֶׁק בֵּ֥ית הַ/יָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: de
  text: Und er nahm die Hülle Judas weg[a], und an jenem Tag blicktest du auf die Waffen des Hauses des Waldes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judas Schutz“ beziehungsweise „Judas Verteidigung“. Wörtlich steht im Hebräischen „die Hülle Judas“ – ein Bild für das, was Juda bedeckte und schützte.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus des Waldes“ bezeichnet wahrscheinlich das königliche Waffenhaus oder den Palast, der andernorts „Libanonwaldhaus“ genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: er nahm … weg
  rationale: Die Hifil-Form von גלה bezeichnet hier das Entfernen beziehungsweise Aufdecken. „Nahm … weg“ ist im modernen Deutsch natürlich und bewahrt die konkrete Handlung, ohne den im Hebräischen nicht ausdrücklich genannten männlichen Bezug näher zu bestimmen.
- source_word: מָסַךְ
  choice: Hülle
  rationale: Das Substantiv bezeichnet eine Bedeckung, einen Schirm oder Vorhang. „Hülle“ erhält das konkrete Schutzbild; die mögliche militärische Bedeutung wird in der Fußnote erläutert.
- source_word: יְהוּדָה
  choice: Judas
  rationale: Der Genitiv „Judas“ ist die im Deutschen übliche Form des Orts- und Volksnamens Juda.
- source_word: וַתַּבֵּט
  choice: du blicktest
  rationale: Die zweite Person maskulin Singular bleibt erhalten und gibt die prophetische Anrede an das personifizierte Jerusalem beziehungsweise Juda wieder. Mit אֶל bezeichnet das Verb den gerichteten Blick.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitangabe.
- source_word: נֶשֶׁק
  choice: Waffen
  rationale: Das Wort bezeichnet Waffen beziehungsweise Kriegsgerät; „Waffen“ ist im heutigen Deutsch klar und vermeidet die mögliche Verengung auf Rüstung.
- source_word: בֵּית הַיָּעַר
  choice: Haus des Waldes
  rationale: Die wörtliche Bezeichnung bleibt als Eigenname erhalten. Die wahrscheinliche Identifikation mit dem königlichen Waffenhaus beziehungsweise dem Libanonwaldhaus wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
theological_decisions:
- issue: Bildhafte Bedeutung der „Hülle Judas“
  choice: Das konkrete Bild „Hülle Judas“ bleibt im Haupttext erhalten.
  alternative: „Judas Schutz“ oder „Judas Verteidigung“
  rationale: Der hebräische Text benennt eine Bedeckung und lässt deren genaue historische oder militärische Entsprechung offen. Eine direkte Wiedergabe als „Verteidigung“ würde die Metapher vorschnell auflösen.
- issue: Adressat der zweiten Person
  choice: Singular „du“ als prophetische Anrede
  alternative: Pluralische oder unpersönliche Wiedergabe
  rationale: וַתַּבֵּט ist zweite Person maskulin Singular. Diese Form bewahrt die rhetorische Personifikation Jerusalems beziehungsweise Judas, ohne den Adressaten im Text ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, bleibt aber idiomatisch. Die konkrete Schutzmetapher und die singularische prophetische Anrede werden bewusst bewahrt.
