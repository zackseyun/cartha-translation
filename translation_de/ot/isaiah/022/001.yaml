  text: מַשָּׂ֖א גֵּ֣יא חִזָּי֑וֹן מַה לָּ֣/ךְ אֵפ֔וֹא כִּֽי עָלִ֥ית כֻּלָּ֖/ךְ לַ/גַּגּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: de
  text: 'Ein Ausspruch über das Tal der Vision[a]: Was ist denn mit dir los, dass bei dir alle auf die Dächer gestiegen sind?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Tal der Vision“ ist wahrscheinlich eine poetische Bezeichnung für Jerusalem; der Vers selbst sagt das jedoch nicht ausdrücklich.
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Verkündigung. „Ausspruch“ gibt diese Funktion würdig und ohne die mögliche, hier aber nicht zwingende Bedeutung „Last“ wieder.
- source_word: גֵּיא חִזָּיוֹן
  choice: Tal der Vision
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben und als poetische Bezeichnung beibehalten, ohne ihren geografischen Bezug im Haupttext festzulegen.
- source_word: מַה לָּךְ אֵפוֹא
  choice: Was ist denn mit dir los
  rationale: Die deutsche Wendung gibt die idiomatische Frage nach dem Anlass des auffälligen Verhaltens wieder; „denn“ trägt die rhetorische Hervorhebung von אֵפוֹא.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Sachverhalt ein, auf den sich die rhetorische Frage richtet.
- source_word: עָלִית כֻּלָּךְ
  choice: du vollzählig … gestiegen bist
  rationale: Die feminine Singularanrede an die personifizierte Stadt bleibt erhalten; „vollzählig“ bringt zugleich die kollektive Bedeutung von כֻּלָּךְ zum Ausdruck.
- source_word: לַגַּגּוֹת
  choice: auf die Dächer
  rationale: Gemeint sind die zugänglichen Flachdächer der Häuser. „Auf die Dächer“ ist im Deutschen die natürliche Richtungsangabe zu עלה.
theological_decisions:
- issue: Bezug der Bezeichnung „Tal der Vision“
  choice: Die Bezeichnung wird im Haupttext wörtlich beibehalten.
  alternative: Sie unmittelbar als poetischen Namen für Jerusalem wiederzugeben.
  rationale: Der Vers selbst nennt Jerusalem nicht ausdrücklich. Die wahrscheinliche Zuordnung wird deshalb in einer Fußnote erläutert, statt interpretierend in den Text aufgenommen zu werden.
- issue: Singularische Stadtanrede und kollektiver Sinn
  choice: Die Stadt wird weiterhin im Singular angeredet; „vollzählig“ macht ihre Bewohner als Gesamtheit hörbar.
  alternative: In den Plural „ihr alle“ zu wechseln oder ausdrücklich „alle deine Bewohner“ einzufügen.
  rationale: So bleibt die Personifikation des hebräischen Textes erhalten, ohne die kollektive Aussage von כֻּלָּךְ zu verlieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht poetische Formulierung „du vollzählig“ bewahrt bewusst die personifizierende Singularanrede des Hebräischen und deren kollektiven Bezug.
