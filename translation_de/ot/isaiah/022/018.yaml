base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: de
  text: Er wird dich fest zusammenrollen[a] und dich wie einen Ball in ein weites Land schleudern.[b] Dort wirst du sterben, und dort werden die Wagen deines Ruhmes sein.[c] Du Schande des Hauses deines Dienstherrn!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Er wird dich fest umwinden« oder »Er wird dich fest zusammenwickeln«. Im Hebräischen verstärken ein Infinitiv absolutus, ein finites Verb und ein stammverwandtes Substantiv denselben Wortgedanken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in ein Land, weit an Händen«; dies ist eine bildhafte Wendung für ein weites oder geräumiges Land.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »deine prächtigen Wagen« oder »die Wagen, die dein Ruhm waren«. Gemeint sein können die Wagen, auf die er stolz war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: Er wird dich ganz fest zusammenwickeln
  rationale: Die Verbindung aus Infinitivus absolutus, finitem Verb und stammverwandtem Substantiv verstärkt denselben Wortgedanken. »Ganz fest zusammenwickeln« gibt diese Intensivierung verständlich wieder, ohne das Bild vorschnell auf einen Turban oder ein bestimmtes Bündel festzulegen.
- source_word: כַּדּוּר
  choice: zu einem Ball
  rationale: Das Wort bezeichnet hier einen ballförmigen Gegenstand. »Ball« ist im heutigen Deutsch natürlich und bewahrt das anschauliche Vergleichsbild.
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: in ein weites Land
  rationale: Wörtlich steht »in ein Land, weit an Händen«. Die idiomatische Wendung bezeichnet ein ausgedehntes, geräumiges Land; »weites Land« gibt den Sinn knapp und natürlich wieder.
- source_word: שָׁמָּה
  choice: Dort … dort
  rationale: Das Ortsadverb wird im Hebräischen wiederholt. Die Wiederholung bleibt erhalten, um den Nachdruck auf dem Ort von Tod und Wagen zu bewahren.
- source_word: תָמוּת
  choice: wirst du sterben
  rationale: Das einfache Futur gibt die direkte prophetische Ankündigung in modernem Deutsch angemessen wieder.
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: die Wagen deines Ruhmes
  rationale: Die komprimierte Genitivverbindung bleibt bewusst erhalten. Sie kann Wagen bezeichnen, die prächtig waren, Ansehen verliehen oder auf die der Angesprochene stolz war.
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: Du Schande des Hauses deines Herrn!
  rationale: Die Wendung wird als anklagende Apposition beziehungsweise Anrede verstanden. »Herr« bezeichnet hier den menschlichen Dienstherrn des Beamten; »Haus« kann dessen Haushalt oder Herrscherhaus meinen.
theological_decisions:
- issue: Bezug von אֲדֹנֶיךָ
  choice: deines Herrn
  alternative: deines Gebieters / deines Dienstherrn
  rationale: Im Zusammenhang ist der menschliche Vorgesetzte beziehungsweise König gemeint. Die Schreibung und der Kontext verlangen hier keinen göttlichen Titel; »Herr« bewahrt zugleich die soziale Rangbeziehung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Schärfe. Die auffällige, im Hebräischen elliptische Bewegung »zu einem Ball, in ein weites Land« wird nicht durch ein zusätzliches Verb wie »schleudern« oder »werfen« vereindeutigt. Die Wiederholung von »dort« und die anklagende Schlussanrede bleiben erhalten.
