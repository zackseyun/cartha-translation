  source_fidelity: Die Bewegungsrichtung »in ein weites Land« ist im Hebräischen an das Bild des Balles gebunden. Die vorliegende elliptische Formulierung »zusammenwickeln, zu einem Ball, in ein weites Land« ist im Deutschen syntaktisch und semantisch zu schwer nachvollziehbar. Das Verb »schleudern« macht die durch die Ball-Metapher und die Richtungsangabe ausgedrückte Verbringung explizit, ohne eine sachfremde Einzelheit hinzuzufügen.
  naturalness: Der Revisionsvorschlag ergibt einen natürlichen, prophetisch zugespitzten deutschen Satz. »Wie einen Ball« ist idiomatischer als »zu einem Ball«; »Dienstherr« verhindert die im Deutschen mögliche falsche Assoziation eines Gottesnamens bei »Herr«.
  terminology: »Wagen deines Ruhmes« bewahrt die verdichtete hebräische Genitivverbindung und ihre Mehrdeutigkeit. Die Anrede »du Schande des Hauses deines Dienstherrn« gibt die schmähende Apposition/Vokativform angemessen wieder. Die Fußnoten sind an den jeweiligen Ausdrücken verankert und inhaltlich angepasst.
