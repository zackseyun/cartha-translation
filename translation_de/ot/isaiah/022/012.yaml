source:
  edition: WLC
  text: וַ/יִּקְרָ֗א אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בַּ/יּ֣וֹם הַ/ה֑וּא לִ/בְכִי֙ וּ/לְ/מִסְפֵּ֔ד וּ/לְ/קָרְחָ֖ה וְ/לַ/חֲגֹ֥ר שָֽׂק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/012.yaml
  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: de
  text: An jenem Tag rief der Herr, Yahweh der Heerscharen, zum Weinen und Klagen auf, zum Kahlscheren[a] und dazu, sich Sacktuch umzugürten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Kahlheit“. Gemeint ist das Kahlscheren des Kopfes als Trauerzeichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … auf
  rationale: קרא bezeichnet hier einen Aufruf zu den nachfolgend genannten Trauerhandlungen; die deutsche Wendung „zu etwas aufrufen“ gibt diese Funktion natürlich und quellennah wieder.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr Yahweh, der Heerscharen befehligt
  rationale: „Herr Yahweh“ bewahrt beide Bestandteile des Gottesnamens. Die prädikative Wiedergabe von צְבָאוֹת als „der Heerscharen befehligt“ ist im modernen Deutsch klarer als das missverständliche „Herr der Heerscharen“ direkt nach „Herr Yahweh“ und lässt den umfassenden Bezug der Heerscharen offen.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: לִבְכִי וּלְמִסְפֵּד
  choice: zum Weinen und Klagen
  rationale: 'Die beiden Trauerbegriffe bleiben unterschieden: בְּכִי bezeichnet das Weinen, מִסְפֵּד die Toten- oder Trauerklage.'
- source_word: וּלְקָרְחָה
  choice: zum Kahlscheren
  rationale: Das Substantiv bezeichnet wörtlich eine Kahlstelle beziehungsweise Kahlheit, meint hier aber die als Trauerzeichen herbeigeführte Kahlheit. „Kahlscheren“ macht die konkrete Handlung verständlich, ohne ihre kultische Bedeutung auszudeuten.
- source_word: וְלַחֲגֹר שָׂק
  choice: dazu, sich Sacktuch umzubinden
  rationale: חגר bezeichnet das Umgürten oder Umbinden; „sich Sacktuch umzubinden“ erhält das konkrete Bild der hebräischen Formulierung und benennt den traditionellen groben Trauerstoff.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR / der Herr HERR
  rationale: Die Wiedergabe „Yahweh“ kennzeichnet das Tetragramm als Eigennamen und bewahrt zusammen mit „Herr“ beide Elemente des hebräischen Titels, ohne die ungewöhnliche Doppelung „Herr HERR“.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: der Heerscharen befehligt
  alternative: der Herr der Heerscharen / der Allmächtige
  rationale: Die Übersetzung bewahrt das militärisch-kosmische Bild, ohne es auf irdische Armeen oder himmlische Wesen einzuengen und ohne es durch den theologischen Deutebegriff „der Allmächtige“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Die parallele Folge der Trauerhandlungen bleibt hörbar; konkrete kulturelle Bilder wie Sacktuch und Kahlscheren werden bewahrt und knapp erläutert.
