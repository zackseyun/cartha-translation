  text: עַל כֵּ֥ן אָמַ֛רְתִּי שְׁע֥וּ מִ/נִּ֖י אֲמָרֵ֣ר בַּ/בֶּ֑כִי אַל תָּאִ֣יצוּ לְ/נַֽחֲמֵ֔/נִי עַל שֹׁ֖ד בַּת עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: de
  text: 'Darum sagte ich: »Schaut weg von mir! Ich will bitterlich weinen. Drängt nicht darauf, mich wegen der Verwüstung der Tochter meines Volkes[a] zu trösten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Die Tochter meines Volkes« ist eine prophetisch-poetische Bezeichnung für mein Volk, das als Tochter personifiziert wird.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: Schaut weg von mir
  rationale: Der pluralische Imperativ von שעה bezeichnet hier wahrscheinlich das Abwenden des Blicks oder das In-Ruhe-Lassen; die Wendung bewahrt die visuelle Nuance und passt zur Trauer des Sprechers.
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: Lasst mich bitterlich weinen
  rationale: Die intensive Form von מרר zusammen mit בַּבֶּכִי beschreibt von Bitterkeit geprägtes Weinen. Die deutsche Formulierung ist idiomatisch und gibt zugleich den Wunsch wieder, ungestört trauern zu dürfen.
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: Drängt nicht darauf, mich … hinwegzutrösten
  rationale: Das Hifil von אוץ kann ein Drängen oder Antreiben ausdrücken. »Drängt nicht darauf« wahrt den Gedanken unerwünschter, beharrlicher Tröstungsversuche; »hinwegtrösten« verbindet den Trost natürlich mit dem Anlass der Trauer.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: Das Substantiv bezeichnet gewaltsame Zerstörung oder Verheerung. »Verwüstung« vermittelt sowohl das Ereignis als auch dessen verheerendes Ergebnis.
- source_word: בַּת עַמִּי
  choice: Tochter meines Volkes
  rationale: Die prophetische Personifikation wird beibehalten, statt sie deutend mit Jerusalem, Juda oder schlicht dem Volk gleichzusetzen.
theological_decisions:
- issue: Deutung der Wendung בַּת עַמִּי
  choice: Die Tochter meines Volkes
  alternative: mein Volk; Tochter Zion; Jerusalem
  rationale: Der hebräische Text personifiziert das Volk als Tochter. Die wörtlich-poetische Wiedergabe erhält die Bildsprache und legt die im Vers nicht ausdrücklich genannte konkrete Identität nicht vorschnell fest.
- issue: Subjektgeschlecht in der direkten Rede
  choice: Keine geschlechtsspezifische Ergänzung
  alternative: Kennzeichnung des Sprechers als männlich oder weiblich
  rationale: Die Verbformen der ersten Person markieren kein Geschlecht. Die Übersetzung lässt diese grammatisch nicht festgelegte Einzelheit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung und der klagende Ton bleiben erhalten. »Bitterlich weinen« ist bewusst gehoben, aber allgemein verständlich; die poetische Personifikation wird nicht geglättet.
