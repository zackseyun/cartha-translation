base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: de
  text: Du Stadt, erfüllt von Lärm,[a] du lärmende Stadt, du jubelnde Stadt! Deine Erschlagenen sind nicht vom Schwert Erschlagene und nicht im Krieg Gefallene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erfüllt von Getöse … du brausende Stadt … du ausgelassene Stadt“. Im Hebräischen werden mehrere sinnverwandte Ausdrücke für den lauten, festlichen Trubel der Stadt gehäuft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת מְלֵאָה
  choice: erfüllt von Lärm
  rationale: Die Wortgruppe beschreibt die Stadt als von lautem Getöse oder Geschrei erfüllt. „Lärm“ ist natürliches modernes Deutsch und lässt offen, ob festlicher Jubel oder allgemeiner Aufruhr im Vordergrund steht.
- source_word: עִיר הוֹמִיָּה
  choice: du lärmende Stadt
  rationale: הוֹמִיָּה bezeichnet eine geräuschvolle, brausende oder unruhige Stadt. „Lärmend“ bewahrt die akustische Bildsprache und die poetische Häufung.
- source_word: קִרְיָה עַלִּיזָה
  choice: du jubelnde Stadt
  rationale: עַלִּיזָה drückt ausgelassene Freude oder Frohlocken aus. Die Wiederholung von „Stadt“ gibt das hebräische Synonym קִרְיָה verständlich wieder, ohne einen sachlich unbegründeten Größenunterschied durch „Ortschaft“ oder „Städtchen“ einzuführen.
- source_word: חֲלָלַיִךְ
  choice: deine Erschlagenen
  rationale: Das Substantiv bezeichnet hier Getötete beziehungsweise Erschlagene und leitet die folgende Aussage über ihre ungewöhnliche Todesart ein.
- source_word: לֹא חַלְלֵי חֶרֶב
  choice: wurden weder mit dem Schwert erschlagen
  rationale: Die Formulierung hält die Wortwiederholung zwischen חֲלָלַיִךְ und חַלְלֵי so weit wie im Deutschen natürlich aufrecht und bezeichnet den Tod durch eine Waffe.
- source_word: וְלֹא מֵתֵי מִלְחָמָה
  choice: noch sind sie im Kampf gefallen
  rationale: „Im Kampf gefallen“ ist eine natürliche deutsche Wiedergabe für Kriegstote und wahrt den militärischen Gegensatz, ohne eine konkrete Todesursache hinzuzufügen.
