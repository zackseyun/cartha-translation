  naturalness: Die Anrede ist modernes, würdiges Deutsch. Die revidierte Fassung klingt flüssiger und wahrt zugleich die poetische Wiederholung.
  terminology: „Getöse“, „lärmend“ und „jubelnd“ geben die Häufung von lautem Treiben und Freude angemessen wieder. „Vom Schwert Erschlagene“ bewahrt die Wortwiederholung zu „deine Erschlagenen“; „im Krieg Gefallene“ entspricht מֵתֵי מִלְחָמָה weiter und genauer als „im Kampf Gefallene“.
