source:
  edition: WLC
  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: de
  text: Ihr saht, dass die Breschen der Stadt Davids zahlreich waren, und ihr sammeltet das Wasser des unteren Beckens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihr sammeltet das Wasser des unteren Reservoirs“. Das hebräische Wort kann sowohl ein Becken als auch ein Reservoir bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: Breschen
  rationale: Das Substantiv bezeichnet Brüche oder Öffnungen. Im Zusammenhang der Stadtverteidigung gibt „Breschen“ beschädigte Stellen in der Befestigung präzise und natürlich wieder.
- source_word: עִיר דָּוִד
  choice: die Stadt Davids
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die mit David verbundene Stadt; „die Stadt Davids“ ist die geläufige historische Bezeichnung.
- source_word: רְאִיתֶם
  choice: ihr saht
  rationale: Das Qal Perfekt von ראה bedeutet zunächst „sehen“; hier schließt es das Wahrnehmen des Zustands der Befestigung ein, ohne ausdrücklich eine Inspektion zu behaupten.
- source_word: כִּי רָבּוּ
  choice: dass ... viele ... hatte
  rationale: כִּי leitet hier wahrscheinlich den Inhalt des Wahrgenommenen ein, während רָבּוּ die große Zahl der Breschen ausdrückt. Im Deutschen ist die Konstruktion mit „hatte“ natürlicher als „die Breschen waren viele“.
- source_word: וַתְּקַבְּצוּ
  choice: und ihr sammeltet
  rationale: קבץ bedeutet „sammeln, zusammenbringen“. Zusammen mit Wasser bezeichnet es dessen gezieltes Sammeln und bleibt eng am hebräischen Ausdruck.
- source_word: מֵי הַבְּרֵכָה הַתַּחְתּוֹנָה
  choice: das Wasser des unteren Beckens
  rationale: מֵי ist formal eine Plural- bzw. Konstruktform, wird im Deutschen bei Wasser jedoch idiomatisch als Singular wiedergegeben. בְּרֵכָה kann ein Becken oder Reservoir bezeichnen; „Becken“ passt als neutraler Ausdruck für eine Anlage zur Wasserspeicherung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural wird mit „ihr“ wiedergegeben. Die Satzfolge und die beiden Handlungen bleiben eng an der hebräischen Struktur; unnatürliche hebräische Numeruskongruenz wird idiomatisch ins Deutsche übertragen.
