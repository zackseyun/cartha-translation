base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: de
  text: 'Und der HERR der Heerscharen hat mir zu Ohren offenbart: »Diese Schuld wird euch gewiss nicht gesühnt werden, bis ihr sterbt«, spricht der Herr, der HERR der Heerscharen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה בְאָזְנָי
  choice: Da offenbarte sich … vor meinen Ohren
  rationale: Gibt die ungewöhnliche wörtliche Wendung der hörbaren Offenbarung wieder, ohne sie zum bloßen Hören abzuschwächen.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe wahrt sowohl den Gottesnamen in der Form HERR als auch das militärisch-kosmische Bild von צבאות.
- source_word: אִם יְכֻפַּר
  choice: wird … gewiss nicht gesühnt werden
  rationale: Die Schwurformel mit אִם drückt hier eine nachdrückliche Verneinung aus; das Passiv und der Sühnebegriff bleiben erhalten.
- source_word: הֶעָוֹן הַזֶּה לָכֶם
  choice: Diese Schuld wird euch … nicht gesühnt werden
  rationale: לָכֶם wird ausdrücklich mit „euch“ wiedergegeben; עָוֹן bezeichnet hier die schuldhafte Verfehlung beziehungsweise Schuld.
- source_word: עַד תְּמֻתוּן
  choice: bis ihr sterbt
  rationale: Entspricht direkt der zeitlichen Formulierung des Hebräischen und lässt ihre ernste Spannung bestehen.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr, der HERR der Heerscharen
  rationale: Unterscheidet אֲדֹנָי („Herr“) typografisch von יהוה („HERR“) und bewahrt die vollständige Gottesbezeichnung.
theological_decisions:
- issue: Bedeutung der Sühneverweigerung bis zum Tod
  choice: Die Aussage wird zeitlich wörtlich als „bis ihr sterbt“ wiedergegeben.
  alternative: Eine endgültige, auch über den Tod hinausreichende Unvergebbarkeit ausdrücklich formulieren.
  rationale: Der hebräische Text setzt die Grenze „bis ihr sterbt“, erklärt aber nicht ausdrücklich, was danach gilt. Diese Spannung darf die Übersetzung nicht auflösen.
- issue: Unpersönliches Passiv von כפר
  choice: „wird … nicht gesühnt werden“ ohne ausdrücklich genannten Handelnden
  alternative: „Gott wird euch diese Schuld nicht vergeben“
  rationale: Das göttliche Passiv und der kultisch-theologische Begriff der Sühne sollen nicht in eine engere Aussage über Vergebung umgedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Offenbarungsformel und die doppelte Gottesbezeichnung bleiben bewusst erhalten; die direkte Rede ist klar und ohne konfessionelle Zusatzdeutung formuliert.
