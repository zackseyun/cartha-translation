- from: 'Da offenbarte sich der HERR der Heerscharen vor meinen Ohren: »Diese Schuld wird euch gewiss nicht gesühnt werden, bis ihr sterbt«, spricht der Herr, der HERR der Heerscharen.'
  to: 'Und der HERR der Heerscharen hat mir zu Ohren offenbart: »Diese Schuld wird euch gewiss nicht gesühnt werden, bis ihr sterbt«, spricht der Herr, der HERR der Heerscharen.'
  rationale: Die Revision beschränkt sich auf die Offenbarungsformel am Satzanfang. Sie gibt das hebräische Passiv mit der idiomatischen deutschen Wendung „mir zu Ohren offenbart“ wieder und vermeidet eine Aussage über ein Erscheinen Gottes. Die Sühneformel einschließlich „euch“ und „bis ihr sterbt“ bleibt unverändert, damit weder Handelnder noch Reichweite der Sühneverweigerung über den Text hinaus bestimmt werden.
