source:
  edition: WLC
  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: de
  text: Und ich werde den Schlüssel zum Haus Davids auf seine Schulter legen. Er wird öffnen[a], und niemand wird schließen; er wird schließen, und niemand wird öffnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom Öffnen und Schließen als Sinnbild unbestreitbarer Vollmacht wird in Offenbarung 3,7 aufgegriffen.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … legen
  rationale: נתן kann „geben, setzen, legen“ bedeuten. Zusammen mit „auf seine Schulter“ gibt „legen“ die konkrete Handlung natürlich wieder.
- source_word: מַפְתֵּחַ בֵּית דָּוִד
  choice: den Schlüssel zum Haus Davids
  rationale: „Schlüssel“ ist die Grundbedeutung; die bestimmte Form passt zu dem durch „Haus Davids“ näher bezeichneten Amts- und Herrschaftssymbol. „Zum Haus Davids“ ist im Deutschen natürlicher als „des Hauses Davids“, ohne die Zugehörigkeitsbeziehung aufzulösen.
- source_word: בֵּית דָּוִד
  choice: Haus Davids
  rationale: Die knappe Form wahrt den möglichen dynastischen und administrativen Sinn, ohne ihn durch „Königshaus“ erklärend festzulegen.
- source_word: עַל שִׁכְמוֹ
  choice: auf seine Schulter
  rationale: Dies entspricht dem unmittelbaren Sinn des Hebräischen. Ein mögliches Amts- oder Autoritätssymbol wird nicht in den Haupttext hineinerklärt.
- source_word: וּפָתַח
  choice: Er wird öffnen
  rationale: Die Form setzt die Zukunfts- bzw. Folgesequenz der göttlichen Ankündigung fort und bezeichnet wirksame, nicht rückgängig zu machende Vollmacht.
- source_word: וְאֵין סֹגֵר
  choice: und niemand wird schließen
  rationale: Die Konstruktion verneint, dass jemand seine Handlung umkehren kann. Die Wiedergabe ist idiomatisch und bewahrt den Parallelismus.
- source_word: וְסָגַר
  choice: er wird schließen
  rationale: Die parallele Formulierung zu „Er wird öffnen“ erhält die ausgewogene Struktur und rhetorische Kraft des Hebräischen.
- source_word: וְאֵין פֹּתֵחַ
  choice: und niemand wird öffnen
  rationale: Die Wiedergabe spiegelt die vorherige Klausel und drückt aus, dass auch sein Schließen von niemandem aufgehoben werden kann.
theological_decisions:
- issue: Ob die messianische beziehungsweise neutestamentliche Aufnahme im Haupttext ausdrücklich gemacht werden soll
  choice: Der Haupttext bleibt auf der unmittelbaren historischen und literarischen Ebene und fügt keine ausdrückliche messianische Deutung ein.
  alternative: Die Formulierung könnte ihre spätere Aufnahme in Offenbarung 3,7 hervorheben oder „Haus Davids“ als „Königshaus Davids“ ausdeuten.
  rationale: In Jesaja bezeichnet der Vers zunächst übertragene Vollmacht im Zusammenhang mit dem Haus Davids. Die spätere kanonische Aufnahme ist bedeutsam, sollte aber nicht rückwirkend in den Wortlaut des Haupttextes eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der symmetrische Satzbau des Hebräischen bleibt erhalten; „niemand“ gibt die idiomatische Kraft der hebräischen Existenzverneinung wieder. Der Punkt nach dem ersten Satz gliedert die lange Aussage lesefreundlich, ohne ihren Zusammenhang zu verändern.
