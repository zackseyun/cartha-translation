base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: de
  text: 'Und an jenem Tag wird es geschehen: Ich werde meinen Diener Eljakim, den Sohn Hilkijas, berufen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rufen« beziehungsweise »herbeirufen«. Das hebräische Verb kann hier das Rufen zu einer Aufgabe oder Einsetzung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: An jenem Tag werde ich …
  rationale: Die hebräische Zukunftsformel wird im Deutschen zusammen mit der Zeitangabe natürlich wiedergegeben; ein zusätzliches „es wird geschehen“ wäre schwerfällig.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Entspricht der prophetischen Zeitformel und ist in modernem Standarddeutsch idiomatisch.
- source_word: וְקָרָאתִי
  choice: werde ich … berufen
  rationale: קרא mit ל bezeichnet hier das Rufen zu einer Aufgabe oder Einsetzung. „Berufen“ bildet diesen Zusammenhang natürlich ab; die allgemeinere Alternative „rufen“ bleibt in der Fußnote sichtbar.
- source_word: לְעַבְדִּי
  choice: meinen Diener
  rationale: Im höfischen und prophetischen Zusammenhang bezeichnet עבד einen Gott unterstellten und von ihm beauftragten Diener; „Sklaven“ würde den sozialen Status unangemessen in den Vordergrund rücken.
- source_word: אֶלְיָקִים
  choice: Eljakim
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: den Sohn Hilkijas
  rationale: Natürliche deutsche Wiedergabe des hebräischen Patronymikons in Apposition.
theological_decisions:
- issue: Göttliche Bezeichnung Eljakims
  choice: meinen Diener
  alternative: meinen Sklaven
  rationale: Die Formulierung kennzeichnet Eljakim als Gott unterstellt und von ihm beauftragt, ohne spätere messianische oder typologische Deutungen in den Wortlaut einzutragen.
- issue: Bedeutungsumfang des göttlichen Rufens
  choice: berufen
  alternative: rufen / herbeirufen
  rationale: Der Kontext legt eine Berufung zu einem Amt nahe. Die Fußnote bewahrt die allgemeinere lexikalische Möglichkeit, ohne die genaue Art des Rufens dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Satzform vermeidet eine unnatürliche Nachbildung der hebräischen Ereignisformel, bewahrt aber die prophetische Zeitangabe. Der Fußnotenmarker steht unmittelbar nach dem Satz.
