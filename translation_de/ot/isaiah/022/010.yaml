id: ISA.22.10
reference: Isaiah 22:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: de
  text: Und die Häuser Jerusalems habt ihr gezählt[a], und ihr habt die Häuser niedergerissen, um die Mauer zu befestigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Häuser Jerusalems erfasst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: um die Mauer zu verstärken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Und die Häuser Jerusalems
  rationale: אֵת kennzeichnet hier das vorangestellte Objekt; die deutsche Wortstellung bewahrt diese Hervorhebung, während „Und“ den Erzählfluss wiedergibt.
- source_word: בָּתֵּי יְרוּשָׁלִַם
  choice: die Häuser Jerusalems
  rationale: Die Status-constructus-Verbindung bezeichnet die Häuser der Stadt Jerusalem; der bestimmte Sinn ergibt sich aus dem Kontext.
- source_word: סְפַרְתֶּם
  choice: habt ihr gezählt
  rationale: Das Qal von ספר bedeutet hier unmittelbar „zählen“ beziehungsweise „die Zahl feststellen“.
- source_word: וַ/תִּתְֿצוּ
  choice: und ihr habt … niedergerissen
  rationale: נתץ bezeichnet das Niederreißen oder Abbrechen von Bauwerken; „niedergerissen“ ist anschaulich und im militärischen Zusammenhang natürlich.
- source_word: הַ/בָּתִּים
  choice: die Häuser
  rationale: Der bestimmte Artikel wird wiedergegeben; die Wiederholung entspricht dem Hebräischen und verbindet die abgebrochenen Häuser mit den zuvor gezählten.
- source_word: לְ/בַצֵּר
  choice: um … zu befestigen
  rationale: בצר bezeichnet hier das Sichern beziehungsweise Befestigen; die Infinitivkonstruktion mit לְ gibt den Zweck des Niederreißens an.
- source_word: הַ/חוֹמָה
  choice: die Mauer
  rationale: חוֹמָה meint im Kontext die Verteidigungsmauer Jerusalems; „die Mauer“ wahrt die knappe Ausdrucksweise des Hebräischen.
