lexical_decisions:
- source_word: עֵילָם
  choice: Elam
  rationale: Eigenname eines Volkes beziehungsweise Landes; in der im Deutschen üblichen Form wiedergegeben.
- source_word: נָשָׂא
  choice: trug
  rationale: Gibt das Aufnehmen beziehungsweise Mitführen militärischer Ausrüstung knapp und unmittelbar wieder.
- source_word: אַשְׁפָּה
  choice: den Köcher
  rationale: Bezeichnet einen Behälter für Pfeile; der bestimmte Artikel entspricht hier der militärischen Bildsprache des Hebräischen.
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  choice: mit bemannten Streitwagen und Reitern
  rationale: Die stark verdichtete hebräische Truppenangabe wird in natürlichem Deutsch wiedergegeben. „Bemannt“ lässt אָדָם erkennbar werden, ohne daraus sicher eine dritte, selbstständige Truppengattung zu machen; die syntaktische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: פָּרָשִׁים
  choice: Reitern
  rationale: Bezeichnet berittene Kämpfer und entspricht der konkreten militärischen Darstellung besser als das kollektivere „Kavallerie“.
- source_word: קִיר
  choice: Kir
  rationale: Eigenname eines Volkes beziehungsweise Landes; transliteriert.
- source_word: עֵרָה
  choice: entblößte
  rationale: Bewahrt das konkrete Bild des Freilegens oder Abdeckens; die wahrscheinliche militärische Bedeutung wird nicht in den Haupttext eingetragen.
- source_word: מָגֵן
  choice: den Schild
  rationale: Der hebräische Singular bleibt als gegenständliches beziehungsweise kollektiv-repräsentatives Bild erhalten.
