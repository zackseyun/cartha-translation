translation:
  language: de
  text: Und Elam trug den Köcher mit Streitwagen, Männern und Reitern[a], und Kir entblößte den Schild[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit Streitwagen von Männern und Reitern“ oder „auf Streitwagen, mit Männern und Reitern“. Die hebräische Truppenaufzählung ist stark verdichtet; wie „Streitwagen“, „Männer“ und „Reiter“ genau zusammengehören, ist unsicher.'
