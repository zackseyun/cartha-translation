  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: de
  text: Sieh, Jahwe wird dich mit Wucht fortschleudern, du Mann, und dich fest einwickeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieh, Jahwe wird dich gewiss mit gewaltigem Wurf fortschleudern, starker Mann, und dich ganz umhüllen.“ Der hebräische Wortlaut ist knapp und schwierig; גָּבֶר kann als „Mann/starker Mann“ verstanden werden und muss nicht unbedingt eine direkte Anrede sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Leitet eine nachdrückliche prophetische Ankündigung ein und bewahrt den hinweisenden Charakter in verständlichem modernem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: wird dich mit Wucht fortschleudern
  rationale: Das Pilpel und der stammverwandte Akkusativ verstärken die Vorstellung eines gewaltsamen Wegschleuderns; „mit Wucht“ gibt die Intensivierung natürlich wieder.
- source_word: גָּבֶר
  choice: du Mann
  rationale: Gibt das maskuline Substantiv als mögliche direkte Anrede wieder, ohne die Bedeutung „starker Mann“ im Haupttext festzuschreiben.
- source_word: וְעֹטְךָ עָטֹה
  choice: und dich fest einwickeln
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus verstärkt die Handlung; „fest“ bildet diese Intensität ab, während „einwickeln“ die Grundbedeutung des Verbs wahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Syntaktische Funktion von גָּבֶר
  choice: 'direkte Anrede: „du Mann“'
  alternative: 'adverbiale oder appositionelle Deutung: „wie einen starken Mann“ beziehungsweise „mit gewaltigem Wurf“'
  rationale: Der knappe hebräische Satz ist syntaktisch schwierig. Der Haupttext folgt einer plausiblen Anrede, während die Fußnote die andere Deutungsmöglichkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Bildsprache und die syntaktische Spannung des Hebräischen bleiben erhalten; die ungewöhnliche Wendung wird nicht konfessionell oder auslegungsspezifisch geglättet.
