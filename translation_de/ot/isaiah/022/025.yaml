  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תָּמוּשׁ֙ הַ/יָּתֵ֔ד הַ/תְּקוּעָ֖ה בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/נִגְדְּעָ֣ה וְ/נָפְלָ֗ה וְ/נִכְרַת֙ הַ/מַּשָּׂ֣א אֲשֶׁר עָלֶ֔י/הָ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: de
  text: An jenem Tag, so lautet der Ausspruch Jahwes, des Herrn der Heerscharen, wird der Pflock[a], der an einer festen Stelle eingeschlagen ist, nachgeben. Er wird abgehauen werden und fallen, und die Last, die an ihm hing, wird abgeschnitten werden[b]. Denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Nagel“ beziehungsweise „der Zapfen“. Das hebräische Wort bezeichnet einen Pflock oder einen fest eingeschlagenen Gegenstand.'
    reason: lexical_alternative
  - marker: b
    text: „Last“ kann auch „Bürde“ bedeuten und meint hier das, was der Pflock trug.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird im Deutschen natürlich und nah am Hebräischen wiedergegeben.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: so lautet der Ausspruch Jahwes, des Herrn der Heerscharen
  rationale: נְאֻם bezeichnet eine feierliche prophetische Kundgabe. „Ausspruch“ bewahrt den nominalen Charakter; „Jahwe“ gibt den Gottesnamen wieder, und „Herr der Heerscharen“ vermittelt den traditionellen Titel verständlich.
- source_word: תָּמוּשׁ
  choice: wird ... nachgeben
  rationale: מוּשׁ kann ein Weichen oder Sichlösen bezeichnen. Bei einem eingeschlagenen, belasteten Pflock trifft „nachgeben“ das Bild natürlich.
- source_word: הַיָּתֵד
  choice: der Pflock
  rationale: יָתֵד kann einen Pflock, Zapfen oder großen Nagel bezeichnen. „Pflock“ wahrt das tragende Bild, ohne es auf einen Zeltpflock festzulegen.
- source_word: הַתְּקוּעָה בְּמָקוֹם נֶאֱמָן
  choice: der an einer festen Stelle eingeschlagen ist
  rationale: תקע bezeichnet hier das Einschlagen oder feste Einsetzen; נֶאֱמָן beschreibt in diesem räumlichen Bild Festigkeit und Verlässlichkeit.
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: Er wird abgehauen werden und fallen
  rationale: גדע bezeichnet ein gewaltsames Abhauen oder Abtrennen; die Abfolge mit dem anschließenden Fallen bleibt erhalten.
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: und die Last, die an ihm hing, wird beseitigt werden
  rationale: מַשָּׂא ist hier die vom Pflock getragene Last. כרת bedeutet wörtlich „abschneiden“ und kann daraus folgend „beseitigen, vernichten“ ausdrücken; „beseitigt“ ist im Deutschen für eine Last idiomatisch, während die Fußnote die konkretere Bildsprache festhält.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: Denn Jahwe hat gesprochen
  rationale: Die prophetische Schlussformel bekräftigt die Gewissheit des angekündigten Geschehens und wird eng am Wortlaut wiedergegeben.
theological_decisions:
- issue: Bezug des Pflockbildes
  choice: Der Bezug wird in der Übersetzung nicht ausdrücklich bestimmt.
  alternative: Den Pflock ausdrücklich mit Eljakim, seinem Haus oder seiner Dynastie gleichzusetzen.
  rationale: Der hebräische Vers nennt den Bezugspunkt des Bildes nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Spannung zu den vorangehenden Zusagen, statt sie durch eine interpretierende Identifikation aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das tragende Pflockbild und die Abfolge des Gerichts bleiben deutlich; schwer verständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo eine Fußnote die konkrete hebräische Ausdrucksweise dokumentiert.
