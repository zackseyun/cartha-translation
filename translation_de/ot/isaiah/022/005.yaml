base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: de
  text: 'Denn es ist ein Tag des Getümmels, des Niedertrampelns und der Verwirrung, der vom Herrn Jahwe der Heerscharen kommt,[a] im Tal der Schau: ein Einreißen der Mauer[b] und Geschrei zum Berg.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tag für den Herrn Jahwe der Heerscharen“ oder „ein Tag, der dem Herrn Jahwe der Heerscharen gehört“. Die hebräische Präposition kann außer dem Ursprung auch eine Beziehung oder Zugehörigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „ein Einreißen der Mauer“. Die hebräische Verbform ist schwierig und kann auch im Sinn von „Niederreißen“, „Aufbrechen“ oder „Zerstören“ verstanden werden.'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: 'Oder: „und Geschrei zum Berg hin“ oder „und ein Schrei zum Berg hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Klage ein und entspricht dem hebräischen Zusammenhang natürlich.
- source_word: מְהוּמָה
  choice: Getümmel
  rationale: Bezeichnet lärmende Unruhe und chaotische Bewegung; das Wort bewahrt den öffentlichen, nicht nur innerlich-psychologischen Charakter.
- source_word: מְבוּסָה
  choice: Zertreten
  rationale: Bewahrt das konkrete Bild des Niedertretens und fügt sich als substantivierter Infinitiv in die dreigliedrige Reihe ein.
- source_word: מְבוּכָה
  choice: Verwirrung
  rationale: Gibt Orientierungslosigkeit und Unordnung wieder, ohne deren Ursache näher festzulegen.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: der vom Herrn Jahwe der Heerscharen kommt
  rationale: Deutet ל als Kennzeichnung von Ursprung beziehungsweise Urheberschaft. אֲדֹנָי wird mit „Herr“, der Gottesname יְהוָה mit „Jahwe“ und צְבָאוֹת bedeutungsnah mit „der Heerscharen“ wiedergegeben.
- source_word: בְּגֵיא חִזָּיוֹן
  choice: im Tal der Schau
  rationale: Gibt die titelartige Ortsbezeichnung wörtlich wieder und lässt ihre symbolische oder geografische Zuordnung offen.
- source_word: מְקַרְקַר קִר
  choice: Die Mauer wird niedergerissen
  rationale: Die schwierige Verbform wird im Zusammenhang als zerstörerisches Einreißen der Befestigung verstanden. Die passive Form ist im Deutschen klar und vermeidet die unbelegte Benennung eines Täters.
- source_word: וְשׁוֹעַ אֶל הָהָר
  choice: und ein Hilferuf dringt zum Berg
  rationale: שׁוֹעַ wird als Hilferuf verstanden; אֶל behält seine gerichtete Bedeutung. „dringt“ macht die knappe hebräische Nominalfügung im Deutschen lesbar, ohne das Ziel näher zu bestimmen.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR; Herr, der Ewige
  rationale: Der Titel אֲדֹנָי und der Gottesname יְהוִה werden beide sichtbar wiedergegeben. „Jahwe“ wahrt den persönlichen Gottesnamen, statt ihn durch einen weiteren Titel zu ersetzen.
- issue: Beziehung des Gerichtstags zu Gott durch ל
  choice: 'Ursprung: „der vom Herrn Jahwe … kommt“'
  alternative: 'Bestimmung oder Zugehörigkeit: „für den Herrn Jahwe“ beziehungsweise „ein Tag des Herrn Jahwe“'
  rationale: Der Kontext erlaubt die Deutung als göttlich verursachtes Gericht, doch die weitere relationale Bedeutung der Präposition wird wegen der echten Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die dreigliedrige Unheilsreihe und die knappen Zerstörungsbilder bleiben erhalten; echte sprachliche Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
