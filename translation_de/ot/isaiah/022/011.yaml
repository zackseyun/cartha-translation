  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: de
  text: Ihr habt zwischen den beiden Mauern ein Sammelbecken für das Wasser des alten Teiches angelegt. Doch ihr habt nicht auf den geblickt, der es gemacht hat, und den, der es vor langer Zeit geformt hat, habt ihr nicht gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von fern“. Der hebräische Ausdruck kann räumliche Entfernung bezeichnen; hier ist wahrscheinlich eine zeitliche Bedeutung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  choice: Sammelbecken
  rationale: Im Zusammenhang mit Wasserbau und Befestigung bezeichnet das Wort einen angelegten Ort zum Sammeln von Wasser. „Sammelbecken“ gibt diese technische Funktion natürlich wieder.
- source_word: בֵּין הַחֹמֹתַיִם
  choice: zwischen den beiden Mauern
  rationale: Die hebräische Dualform bezeichnet ausdrücklich zwei Mauern.
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: für das Wasser des alten Teiches
  rationale: מֵי kann im Deutschen idiomatisch als Singular „Wasser“ wiedergegeben werden; „Teich“ unterscheidet die vorhandene בְּרֵכָה vom neu angelegten Sammelbecken.
- source_word: הִבַּטְתֶּם אֶל
  choice: auf den geblickt
  rationale: Die Wendung bezeichnet sowohl das Hinsehen als auch die bewusste Hinwendung oder Beachtung und bewahrt so die bildhafte Aussage.
- source_word: עֹשֶׂיהָ
  choice: der es gemacht hat
  rationale: Die verbale Form mit femininem Suffix wird eng nachgebildet, ohne den nicht völlig eindeutigen Bezug des Pronomens festzulegen.
- source_word: יֹצְרָהּ
  choice: der es ... geformt hat
  rationale: „Geformt“ bewahrt die Vorstellung absichtsvollen Gestaltens und die Parallele zu „gemacht“.
- source_word: מֵרָחוֹק
  choice: vor langer Zeit
  rationale: Im Zusammenhang mit Gottes vorausgehendem Gestalten ist die zeitliche Bedeutung wahrscheinlich; die räumliche Möglichkeit wird in der Fußnote erhalten.
- source_word: לֹא רְאִיתֶם
  choice: habt ihr nicht gesehen
  rationale: „Gesehen“ erhält die hebräische Parallele zu „geblickt“ und lässt zugleich die Bedeutung mangelnder Einsicht anklingen.
theological_decisions:
- issue: Bezug von „der es gemacht hat“ und „der es geformt hat“
  choice: Gott ist gemeint; das Objekt bleibt durch „es“ unbestimmt.
  alternative: Das Suffix kann sich näher auf den Teich, das Sammelbecken beziehungsweise die Wasseranlage oder umfassender auf Jerusalem beziehen.
  rationale: Der Kontext tadelt das Vertrauen auf menschliche Verteidigungsmaßnahmen bei gleichzeitiger Missachtung von Gottes Wirken. Da der genaue Bezug des femininen Suffixes offen ist, wird er nicht ausdrücklich festgelegt.
- issue: Bedeutung von מֵרָחוֹק
  choice: 'zeitlich: „vor langer Zeit“'
  alternative: 'räumlich: „von fern“'
  rationale: Die zeitliche Deutung passt zur Vorstellung von Gottes lange zuvor gefasstem Plan beziehungsweise vollzogenem Gestalten; die echte lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sammelbecken“ ist sachlich und verständlich; die Wiederholung „gemacht/geformt“ wahrt den Parallelismus. Der Fußnotenmarker steht am Satzende, weil die Anmerkung die unmittelbar vorausgehende Wendung „vor langer Zeit“ erläutert.
