  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת לֶךְ בֹּא֙ אֶל הַ/סֹּכֵ֣ן הַ/זֶּ֔ה עַל שֶׁבְנָ֖א אֲשֶׁ֥ר עַל הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr der Heerscharen: Geh[a] zu diesem Verwalter, zu Schebna, der über das Haus gesetzt ist[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen zwei Aufforderungen: „Geh, komm“. Zusammen können sie idiomatisch „Geh hin“ oder „Geh hinein“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Über das Haus gesetzt“ bezeichnet einen hohen Hofbeamten, einen Verwalter des königlichen Hauses beziehungsweise Palastes.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird knapp, würdevoll und im Deutschen idiomatisch wiedergegeben.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  rationale: „Herr“ gibt אֲדֹנָי wieder, während „Jahwe“ den Gottesnamen ausdrücklich bewahrt. „Der Heerscharen“ erhält die traditionelle Breite von צְבָאוֹת.
- source_word: לֶךְ בֹּא
  choice: Geh
  rationale: Die beiden Bewegungsimperative bilden hier wahrscheinlich eine gemeinsame idiomatische Aufforderung. Der flüssige Haupttext bündelt sie; die formale Doppelung wird in Fußnote [a] offengelegt.
- source_word: הַסֹּכֵן הַזֶּה
  choice: diesem Verwalter
  rationale: סֹכֵן bezeichnet hier einen hohen Amtsträger mit anvertrauter Verwaltungsgewalt. „Verwalter“ ist im modernen Deutsch klarer als das altertümliche „Hofmeister“.
- source_word: עַל שֶׁבְנָא
  choice: zu Schebna
  rationale: Die ungewöhnliche Konstruktion identifiziert den genannten Verwalter appositionell als Schebna; sie wird nicht ohne zwingenden Grund feindselig als „gegen Schebna“ verstanden.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: der über das Haus gesetzt ist
  rationale: Die hebräische Amtsbezeichnung wird weitgehend formal bewahrt. Der Kontext meint den obersten Verwalter des königlichen Hauses beziehungsweise Palastes.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form unterscheidet אֲדֹנָי vom ausdrücklich geschriebenen Gottesnamen יהוה und vermeidet zugleich die missverständliche Verdoppelung „Herr HERR“.
- issue: Bedeutung von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ lässt offen, ob himmlische oder irdische Mächte im Vordergrund stehen, und verengt den Titel daher nicht unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachrhythmus. Die abrupte Fortsetzung wird durch den Doppelpunkt bewahrt, da der folgende Vers den Auftrag weiterführt. Archaische Amtswörter wurden vermieden; die kulturelle Bedeutung der wörtlich erhaltenen Wendung wird in einer Fußnote erläutert.
