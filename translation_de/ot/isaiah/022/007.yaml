  yaml_path: translation/ot/isaiah/022/007.yaml
  text: And your choicest valleys were filled with chariots[a], and the horsemen took their positions at the gate.
translation:
  language: de
  text: Deine erlesensten Täler füllten sich mit Streitwagen, und die Reiter bezogen am Tor Stellung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellten sich zum Tor hin auf“. Das Hebräische verstärkt das Verb „aufstellen“ durch die Verbindung von Infinitivus absolutus und finitem Verb; die Form von „Tor“ kann auch eine Richtung zum Tor hin bezeichnen.'
    reason: Die Anmerkung erläutert sowohl die emphatische hebräische Verbkonstruktion als auch die mögliche Richtungsnuance, ohne die kontextuelle Hauptübersetzung aufzugeben.
lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  choice: die besten deiner Täler
  rationale: מִבְחַר bezeichnet die Auswahl beziehungsweise das Beste aus einer Gesamtheit. Die partitive Formulierung gibt die Konstruktion mit dem folgenden Plural natürlich und präzise wieder.
- source_word: מָלְאוּ רָכֶב
  choice: waren … voller Streitwagen
  rationale: Das Verb beschreibt hier einen erfüllten Zustand; רֶכֶב ist eine kollektive Bezeichnung für Wagen beziehungsweise Streitwagen. Der deutsche Plural macht die militärische Szene unmittelbar verständlich.
- source_word: הַפָּרָשִׁים
  choice: die Reiter
  rationale: Der Ausdruck bezeichnet berittene Truppen. „Reiter“ ist im Deutschen klar und lässt offen, ob einzelne Reiter oder die Reiterei als Verband im Blick sind.
- source_word: שֹׁת שָׁתוּ
  choice: bezogen … Stellung
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb hebt das gezielte Aufstellen hervor. „Stellung beziehen“ gibt den militärischen Sinn idiomatisch wieder.
- source_word: הַשָּׁעְרָה
  choice: am Tor
  rationale: Das direktionale He kann eine Bewegung zum Tor hin anzeigen; zusammen mit dem Verb des Aufstellens ergibt sich im Kontext die Positionierung am Tor.
