  source_fidelity: 'Der Grundsinn ist zutreffend: Die ausgewählten/besten Täler werden von Streitwagen gefüllt, und die Reiter nehmen am Tor Stellung. Allerdings gibt „Da waren“ die hebräische Erzählform וַיְהִי unnötig unbestimmt wieder; „Da“ kann zudem lokal wirken. „Die besten deiner Täler“ ist verständlich, aber die Konstruktion meint eher die vorzüglichsten/erlesensten Täler als eine partitive Auswahl. Die Richtungsnuance von הַשָּׁעְרָה sollte nicht in eine alternative deutsche Formulierung mit unklarem „zum Tor hin“ gedrängt werden.'
