  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die Bildsprache des Hebräischen zuverlässig wieder: Das gesamte כבוד des Vaterhauses wird „an ihn“ gehängt; Nachkommen/Sprösslinge und die kleinen Gefäße bleiben in der bewusst verdichteten Zusammenstellung des Ausgangstextes. „Ehre“ ist für כָּבוֹד in diesem sozialen Kontext vertretbar, ohne eine theologische Bedeutung einzutragen. „Schalen“ für אַגָּנוֹת und „Krüge“ für נְבָלִים sind angemessen weit gefasst.'
  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. „An ihn hängen“ bewahrt die absichtlich konkrete, im Kontext bildhafte Ausdrucksweise; die anschließende Aufzählung ist klar lesbar.
  terminology: Die Familienbezeichnungen „Nachkommen und Sprösslinge“ bewahren die Paarform des Hebräischen, ohne die nur schwer exakt bestimmbare Differenz der beiden Ausdrücke zu überdeuten. „Alle kleinen Gefäße“ erhält die Gefäßmetaphorik von כְּלֵי הַקָּטָן. Die Begriffe stimmen zudem sachgerecht mit der englischen Audit-Fassung („offspring and offshoots“, „small vessel“, „bowls“, „jars“) überein.
