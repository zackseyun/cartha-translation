source:
  edition: WLC
  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: de
  text: 'Und sie werden die ganze Ehre seines Vaterhauses an ihn hängen: die Nachkommen und die Sprösslinge, alle kleinen Gefäße, von den Schalen bis zu sämtlichen Krügen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבוֹד
  choice: Ehre
  rationale: Im Zusammenhang bezeichnet das Wort das Ansehen beziehungsweise die gesellschaftliche Bedeutung des Vaterhauses; „Ehre“ gibt dies natürlicher wieder als das stärker religiös geprägte „Herrlichkeit“.
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: die Nachkommen und die Sprösslinge
  rationale: Die beiden verwandten Bezeichnungen werden als bildhafte Paarung bewahrt. „Sprösslinge“ lässt die mögliche Nuance jüngerer oder entfernter Familienglieder offen.
- source_word: כְּלֵי הַקָּטָן
  choice: alle kleinen Gefäße
  rationale: Die wörtliche Gefäßmetaphorik bleibt erhalten und wird nicht ausdrücklich auf rangniedrige Angehörige festgelegt.
- source_word: אַגָּנוֹת
  choice: Schalen
  rationale: Bezeichnet schalen- oder beckenartige Gefäße; „Schalen“ ist hier verständlich und hinreichend offen.
- source_word: נְּבָלִים
  choice: Krüge
  rationale: Bezeichnet größere Behälter beziehungsweise Krüge; die konkrete Gefäßsprache des Bildes wird beibehalten.
theological_decisions:
- issue: Bezug der an ihn gehängten Gefäße
  choice: Die Gefäßmetapher wird ohne erklärende Identifikation wiedergegeben.
  alternative: Die Gefäße ausdrücklich als geringe und bedeutende Angehörige des Vaterhauses deuten.
  rationale: Der hebräische Text verbindet Familienangehörige mit Gefäßbezeichnungen, erklärt die genaue Zuordnung aber nicht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „alle/die ganze“ spiegelt die umfassende Aussage des Hebräischen, ohne den Satz unnötig schwer zu machen.
