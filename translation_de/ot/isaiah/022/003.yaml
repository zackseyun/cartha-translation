translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede richtet sich im Kontext an Jerusalem und bleibt feminin-singular im hebräischen Ausgangstext, was im Deutschen bei den possessiven Formen nicht eigens sichtbar wird. Die zweimalige Gefangennahme wird zur Wahrung der hebräischen Wiederholung gleichartig formuliert.
