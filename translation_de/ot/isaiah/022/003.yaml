base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: de
  text: Alle deine Anführer sind gemeinsam geflohen; ohne den Bogen wurden sie gefangen genommen.[a] Alle von den Deinen, die man fand, wurden gemeinsam gefangen genommen; sie waren weit weg geflohen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich etwa: „vom Bogen her/ohne den Bogen wurden sie gebunden“. Gemeint sein kann, dass sie ohne Einsatz von Pfeil und Bogen gefangen genommen wurden oder dass sie keinen Bogen bei sich hatten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Alle von den Deinen, die man fand, wurden gemeinsam gebunden; aus der Ferne waren sie geflohen.“ Der hebräische Satzschluss ist knapp und lässt unterschiedliche syntaktische Zuordnungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: deine Anführer
  rationale: קָצִין kann einen Amtsträger, Befehlshaber oder Herrscher bezeichnen. „Anführer“ hält den zivil-militärischen Bezug offen und klingt im modernen Deutschen natürlich.
- source_word: נָדְדוּ
  choice: sind … geflohen
  rationale: נדד kann „umherziehen“ oder „fliehen“ bedeuten; im Zusammenhang von Belagerung und Gefangennahme ist „fliehen“ sachlich am wahrscheinlichsten.
- source_word: יַחַד
  choice: gemeinsam
  rationale: Das Adverb bezeichnet das gemeinschaftliche Handeln der Anführer.
- source_word: מִקֶּשֶׁת
  choice: ohne Bogen
  rationale: 'Die Präposition מִן lässt sich hier privativ verstehen: Die Gefangennahme geschah ohne Einsatz des Bogens beziehungsweise ohne bewaffneten Widerstand. Die mögliche Trennungsvorstellung bleibt in der Fußnote sichtbar.'
- source_word: אֻסָּרוּ
  choice: wurden … gefangen genommen
  rationale: אָסַר bedeutet wörtlich „binden“; im militärischen Kontext bezeichnet das Passiv die Gefangennahme beziehungsweise das Binden als Gefangene.
- source_word: נִמְצָאַיִךְ
  choice: alle von dir, die man fand
  rationale: Die Form bedeutet wörtlich „deine Gefundenen“ beziehungsweise „die von dir, die gefunden wurden“. Die Wiedergabe vermeidet es, den im Hebräischen nicht ausdrücklich bezeichneten Personenkreis als Männer oder Flüchtlinge festzulegen.
- source_word: אֻסְּרוּ יַחְדָּו
  choice: wurden miteinander gefangen genommen
  rationale: Die wiederholte Verbform wird konsistent wiedergegeben; יַחְדָּו unterstreicht die gemeinsame Gefangennahme.
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: sie waren weit weg geflohen
  rationale: ברח bedeutet „fliehen“; מֵרָחוֹק bezeichnet räumliche Ferne, lässt syntaktisch jedoch verschiedene Zuordnungen zu. Das Plusquamperfekt macht die naheliegende zeitliche Folge verständlich, ohne sie als einzig mögliche Analyse auszugeben.
