  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: de
  text: Ich werde ihn wie einen Pflock an einem festen Ort einschlagen[a], und er wird für das Haus seines Vaters zu einem Thron der Ehre werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn wie einen Pflock an einer sicheren Stelle befestigen“.'
    reason: lexical_alternative
  - marker: b
    text: „Thron der Ehre“ kann auch mit „herrlicher Thron“ oder „Ehrensitz“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: Ich werde ihn … einschlagen
  rationale: תקע bezeichnet bei einem Pflock das Hineintreiben beziehungsweise feste Anbringen. „Einschlagen“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: יָתֵד
  choice: Pflock
  rationale: יתד bezeichnet einen Pflock, Zapfen oder großen Nagel, der eingeschlagen wird und Last tragen kann. „Pflock“ erhält das tragende Bild, das im folgenden Vers weitergeführt wird.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: an einer sicheren Stelle
  rationale: נֶאֱמָן beschreibt hier Festigkeit, Verlässlichkeit oder Sicherheit. „An einer sicheren Stelle“ gibt den räumlichen und funktionalen Sinn idiomatisch wieder, ohne das Adjektiv unpassend mit „treu“ zu übersetzen.
- source_word: וְהָיָה
  choice: und er wird … werden
  rationale: היה kann „sein“ oder „werden“ bedeuten. Hier bezeichnet es die Folge der vorausgehenden Einsetzung; daher passt im Deutschen „werden“.
- source_word: לְכִסֵּא כָבוֹד
  choice: zu einem Thron der Ehre
  rationale: כִּסֵּא bedeutet „Thron“ oder „Sitz“, כָבוֹד „Ehre“, „Herrlichkeit“ oder „Ansehen“. „Thron der Ehre“ bewahrt beide Bestandteile und die auffällige Metapher.
- source_word: לְבֵית אָבִיו
  choice: für das Haus seines Vaters
  rationale: Das לְ drückt hier Beziehung beziehungsweise Nutzen aus. „Für das Haus seines Vaters“ bezeichnet verständlich seine väterliche Großfamilie oder Sippe.
theological_decisions:
- issue: Metaphorische Darstellung von Eljakims Stellung
  choice: Die Bilder vom eingeschlagenen Pflock und vom Thron bleiben unverändert stehen.
  alternative: Die Bilder als politische Festigkeit und als Ehre für seine Familie erklärend umschreiben.
  rationale: Der hebräische Text verbindet zwei konkrete Metaphern, ohne ihr Verhältnis vollständig zu erklären. Ihre Beibehaltung wahrt die literarische Spannung und vermeidet eine konfessionell oder historisch verengende Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des Hebräischen bleibt erhalten; ungewöhnliche, aber bedeutungstragende Formulierungen werden nicht vorschnell geglättet.
