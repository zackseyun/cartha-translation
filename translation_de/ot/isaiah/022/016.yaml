- from: Was hast du hier, und wen hast du hier, dass du dir hier ein Grab ausgehauen hast – der sein Grab auf der Höhe aushauen, der sich im Felsen eine Wohnstätte ausmeißeln lässt?[a]
  to: Was hast du hier, und wen hast du hier, dass du dir hier ein Grab ausgehauen hast – er haut sein Grab in der Höhe aus und meißelt sich im Felsen eine Wohnstätte aus?[a]
  rationale: Die Revision beseitigt die unbegründete kausative Lesart und die deutsche Satzstörung. Sie bewahrt im Haupttext den auffälligen Wechsel von „du“ zu „er“, einschließlich der Suffixe „sein Grab“ und „sich“, ohne ihn zu harmonisieren. Die Fußnote bietet lediglich eine stilistisch flüssigere, direkt anredende Alternative und kennzeichnet den hebräischen Personenwechsel ausdrücklich.
