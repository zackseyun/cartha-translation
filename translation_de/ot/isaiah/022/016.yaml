base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: de
  text: Was hast du hier, und wen hast du hier, dass du dir hier ein Grab ausgehauen hast – er haut sein Grab in der Höhe aus und meißelt sich im Felsen eine Wohnstätte aus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Flüssiger, mit durchgehend direkter Anrede: „… dass du dir hier ein Grab ausgehauen hast – dein Grab in der Höhe aushauend und dir im Felsen eine Wohnstätte ausmeißelnd.“ Im Hebräischen wechselt die Anrede in diesen Satzteilen von der zweiten zur dritten Person.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: Was hast du hier
  rationale: Die knappe, konfrontative Frage bleibt erhalten, ohne sie deutend zu „Welches Recht hast du hier?“ zu erweitern.
- source_word: וּמִי לְךָ פֹה
  choice: und wen hast du hier
  rationale: Die parallele Frage zielt wahrscheinlich auf persönliche oder familiäre Bindungen; die offene Formulierung bewahrt diese Möglichkeit.
- source_word: כִּי
  choice: dass
  rationale: „Dass“ verbindet die rhetorischen Fragen natürlich mit dem vorwurfsvoll beschriebenen Handeln, ohne das Verhältnis enger als nötig festzulegen.
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: dass du dir hier ein Grab ausgehauen hast
  rationale: „Aushauen“ gibt die Bearbeitung des Gesteins präzise und in natürlichem Deutsch wieder.
- source_word: חֹצְבִי מָרוֹם קִבְרוֹ
  choice: der sein Grab auf der Höhe aushauen lässt
  rationale: Die masoretische Vokalisierung der Partizipien als Hifil wird kausativ mit „aushauen lässt“ wiedergegeben; zugleich bleibt der auffällige Wechsel von der zweiten zur dritten Person sichtbar.
- source_word: חֹקְקִי בַסֶּלַע מִשְׁכָּן לוֹ
  choice: der sich im Felsen eine Wohnstätte ausmeißeln lässt
  rationale: „Ausmeißeln lässt“ wahrt die kausative Form und das konkrete Felsbild. „Wohnstätte“ erhält die ironische Bezeichnung des Grabes als bleibenden Aufenthaltsort.
theological_decisions:
- issue: Wechsel von der zweiten zur dritten Person in den Partizipialklauseln
  choice: 'Den Wechsel beibehalten: „der sein Grab … der sich …“'
  alternative: 'Alle Bezüge an die direkte Anrede angleichen: „du lässt dein Grab … und dir …“'
  rationale: Der masoretische Text wechselt nach der direkten Anrede zu Formen und Suffixen der dritten Person. Die Übersetzung glättet diesen Wechsel nicht stillschweigend; eine flüssigere Angleichung steht in der Fußnote.
- issue: Kausative Bedeutung der Hifil-Partizipien חֹצְבִי und חֹקְקִי
  choice: „aushauen lässt … ausmeißeln lässt“
  alternative: 'Aktivisch: „aushauend … ausmeißelnd“'
  rationale: Die masoretische Vokalisierung weist auf Hifil hin und wird deshalb kausativ wiedergegeben. Damit bleibt möglich, dass der Angeredete die Arbeiten veranlasst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „hier“ und die schroffe rhetorische Form wurden als Stilmerkmale bewahrt. Der Gedankenstrich markiert den abrupten Übergang zur distanzierenden Beschreibung in der dritten Person.
