  text: וְ/הִנֵּ֣ה שָׂשׂ֣וֹן וְ/שִׂמְחָ֗ה הָרֹ֤ג בָּקָר֙ וְ/שָׁחֹ֣ט צֹ֔אן אָכֹ֥ל בָּשָׂ֖ר וְ/שָׁת֣וֹת יָ֑יִן אָכ֣וֹל וְ/שָׁת֔וֹ כִּ֥י מָחָ֖ר נָמֽוּת׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: de
  text: 'Und siehe: Jubel und Freude, Rinder werden getötet und Schafe geschlachtet, Fleisch wird gegessen und Wein getrunken: »Lasst uns essen und trinken[a], denn morgen sterben wir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und knapper: »Essen und trinken«; die hebräischen Formen wirken hier wie ein kurzer Zuruf oder Wahlspruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Gibt die aufmerksamkeitslenkende, anschauliche Funktion wieder und bewahrt mit „und“ den Anschluss an den Kontext; „siehe“ entspricht dem würdevollen prophetischen Register.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Jubel und Freude
  rationale: Bewahrt die zwei sich überschneidenden Begriffe für ausgelassene Festfreude, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: הָרֹג בָּקָר וְשָׁחֹט צֹאן
  choice: Rinder werden getötet und Schafe geschlachtet
  rationale: Die passive Formulierung bildet die knappe Reihung festlicher Tätigkeiten natürlich ab. „Schlachten“ wahrt bei צֹאן den Kontext der Fleischzubereitung, ohne ein kultisches Opfer ausdrücklich vorauszusetzen.
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: Fleisch wird gegessen und Wein getrunken
  rationale: Gibt die konkreten Tätigkeiten idiomatisch wieder und führt die parallele Reihung fort.
- source_word: אָכוֹל וְשָׁתוֹ
  choice: Lasst uns essen und trinken
  rationale: Die Infinitivabsoluta haben hier den Charakter eines knappen Zurufs oder Wahlspruchs. Die inklusive Aufforderung passt zum anschließenden „wir sterben“.
- source_word: כִּי מָחָר נָמוּת
  choice: denn morgen sterben wir
  rationale: Bewahrt die prägnante, sprichwortartige Form und den fatalistischen Ton; das deutsche Präsens kann wie das Hebräische auf die nahe Zukunft verweisen.
theological_decisions:
- issue: Ob die ausgelassene Feier im Vers selbst ausdrücklich moralisch bewertet werden soll
  choice: Die Tätigkeiten werden ohne hinzugefügte verurteilende Adjektive beschrieben.
  alternative: Ausdrücke wie „sündiges Gelage“ oder „zügellose Feier“ ergänzen.
  rationale: Die prophetische Verurteilung ergibt sich aus dem Zusammenhang; dieser Vers beschreibt das Verhalten, ohne es durch solche Zusätze ausdrücklich zu qualifizieren.
- issue: Ob das abschließende Motto als Aussage oder als Aufforderung wiederzugeben ist
  choice: 'Als inklusive Aufforderung: „Lasst uns essen und trinken“.'
  alternative: 'Nominal bzw. wörtlich knapp: „Essen und trinken“; oder direkter Imperativ: „Esst und trinkt“.'
  rationale: Die hebräischen Infinitivabsoluta bleiben formal knapp, funktionieren im Zusammenhang jedoch als Zuruf; die erste Person Plural im Folgesatz stützt die inklusive deutsche Formulierung, ohne die alternative Form zu verschweigen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Klang. Die Reihung und der abrupte Übergang zum zitierten Motto bleiben erhalten; die Ausrufeform unterstreicht dessen zugespitzten Charakter, ohne eine zusätzliche moralische Wertung einzuführen.
