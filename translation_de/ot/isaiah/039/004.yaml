base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: de
  text: 'Er fragte: „Was haben sie in deinem Haus[a] gesehen?“ Hiskia antwortete: „Sie haben alles gesehen, was in meinem Haus ist. Es gab nichts, was ich ihnen in meinen Schatzkammern nicht gezeigt hätte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in deinem Palast“. Wörtlich steht im Hebräischen „in deinem Haus“; im königlichen Zusammenhang kann damit der Palast gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: Was haben sie … gesehen?
  rationale: Das Fragewort מָה wird direkt mit „was“ wiedergegeben; das deutsche Perfekt bezeichnet im lebendigen Dialog natürlich die abgeschlossene Besichtigung mit gegenwärtiger Bedeutung.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: in deinem Haus / in meinem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und kann im königlichen Zusammenhang auch den Palast bezeichnen. „Haus“ bewahrt die Bildsprache und lässt die kontextuelle Bedeutung offen.
- source_word: חִזְקִיָּהוּ
  choice: Hiskija
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: alles …, was in meinem Haus ist
  rationale: Die Wiedergabe bringt die durch כָּל ausgedrückte Vollständigkeit klar und idiomatisch zum Ausdruck.
- source_word: לֹא הָיָה דָבָר
  choice: Es gab nichts
  rationale: Natürliche deutsche Wiedergabe der hebräischen verneinten Existenzaussage; die umfassende Verneinung bleibt erhalten.
- source_word: הִרְאִיתִים
  choice: ich ihnen … gezeigt hätte
  rationale: Der Hifil von ראה bedeutet „sehen lassen, zeigen“; das Suffix der 3. Person Plural wird mit „ihnen“ wiedergegeben. Der Konjunktiv II ist im deutschen Relativsatz nach der verneinten Aussage idiomatisch.
- source_word: בְּאוֹצְרֹתָי
  choice: in meinen Schatzkammern
  rationale: אוֹצָר kann einen Schatz oder einen Vorrats- beziehungsweise Schatzraum bezeichnen. Im königlichen Kontext passt „Schatzkammern“ zur vorgeführten Habe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Er fragte“ gibt die Funktion von וַיֹּאמֶר im Fragesatz natürlicher wieder als das formal mögliche „Er sagte“. Die Wiederholung von „Haus“ und „gesehen“ bleibt entsprechend dem Hebräischen erhalten.
