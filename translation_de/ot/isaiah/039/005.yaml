source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: de
  text: 'Da sagte Jesaja zu Hiskija: „Höre das Wort Jahwes[a], des Herrn der Heerscharen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: Wörtlicher lässt sich der Titel mit „Jahwe der Heerscharen“ oder „Jahwe der Heere“ wiedergeben. Gemeint ist Jahwe als Herrscher über himmlische und irdische Scharen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw mit der Verbform führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אֶל חִזְקִיָּהוּ
  choice: zu Hiskija
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten; „Hiskija“ ist die übliche deutsche Namensform.
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ Singular wird unmittelbar wiedergegeben und bewahrt den feierlichen Nachdruck der prophetischen Aufforderung.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Botenformel bezeichnet דָּבָר die von Gott kommende Botschaft; „das Wort“ bewahrt diese geläufige biblische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den traditionellen Ersatztitel „der HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: Heerscharen
  rationale: Der Plural bezeichnet geordnete Scharen beziehungsweise Heere und lässt im göttlichen Titel die mögliche himmlische wie irdische Reichweite offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ macht dies sichtbar; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Wiedergabe und syntaktische Deutung des Titels יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  alternative: Jahwe der Heere / Jahwe Zebaot
  rationale: Die appositionelle deutsche Form bringt die im festen Titel ausgedrückte Herrschaft verständlich zur Geltung. „Heerscharen“ bewahrt zugleich die Breite von צְבָאוֹת, ohne sie ausschließlich auf menschliche Armeen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höre das Wort“ wahrt den feierlichen prophetischen Ton; „Heerscharen“ ist bewusst gehoben, wird aber durch die Fußnote erläutert.
