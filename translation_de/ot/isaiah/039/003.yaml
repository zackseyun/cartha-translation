base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: de
  text: 'Da kam der Prophet Jesaja zu König Hiskia und sagte zu ihm: »Was haben diese Männer gesagt, und woher sind sie zu dir gekommen?« Hiskia antwortete: »Sie sind aus einem fernen Land zu mir gekommen, aus Babylon.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Gibt die erzählerische Fortführung der Wayyiqtol-Form natürlich wieder, ohne eine stärkere zeitliche Folgerung als im Hebräischen auszudrücken.
- source_word: מָה אָמְרוּ
  choice: Was haben … gesagt
  rationale: Entspricht der direkten Frage und klingt im modernen Standarddeutsch natürlich.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: und woher sind sie zu dir gekommen?
  rationale: Bewahrt sowohl die Herkunftsfrage מֵאַיִן als auch das Ziel אֵלֶיךָ; das deutsche Perfekt ist in direkter Rede idiomatisch.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: aus einem fernen Land
  rationale: Formnahe und natürliche Wiedergabe; der unbestimmte Artikel entspricht der nicht näher bestimmten Formulierung.
- source_word: מִבָּבֶל
  choice: aus Babylon
  rationale: Gibt die präzisierende Herkunftsangabe knapp und eindeutig wieder.
