source:
  edition: WLC
  text: וַ/יִּשְׂמַ֣ח עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת בֵּ֣ית נכת/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת הַ/שֶּׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ כָּל בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֹֽצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: de
  text: 'Hiskia freute sich über sie[a] und zeigte ihnen sein Schatzhaus[b]: das Silber, das Gold, die Gewürze, das kostbare Öl, sein ganzes Waffenlager[c] und alles, was sich in seinen Vorratshäusern[d] befand. Es gab nichts in seinem Haus oder in seinem ganzen Herrschaftsbereich[e], was Hiskia ihnen nicht zeigte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freute sich ihretwegen“ oder „hatte Gefallen an ihnen“. Die hebräische Wendung kann die Freude über die Gesandten beziehungsweise ihre Gaben oder eine ihnen zugewandte Freude bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Haus seiner Kostbarkeiten“; traditionell als Schatzhaus oder Schatzkammer verstanden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „sein ganzes Gerätehaus“. Im Zusammenhang und nach der Parallele in 2. Könige 20,13 wird der Ausdruck häufig als Waffen- oder Ausrüstungslager verstanden.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „Schatzkammern“.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „Herrschaftsgebiet“, „Reich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: freute sich über sie
  rationale: Die Verbindung שׂמח + עַל kann Freude über bzw. wegen der Gesandten oder ihrer Gaben ausdrücken. Die deutsche Wendung bewahrt diese leichte Mehrdeutigkeit.
- source_word: וַיַּרְאֵם
  choice: zeigte ihnen
  rationale: Der Hifil von ראה bedeutet hier natürlich „sehen lassen“, also „zeigen“.
- source_word: בֵּית נכתה
  choice: sein Schatzhaus
  rationale: Der Ausdruck bezeichnet ein Haus bzw. einen Raum für Kostbarkeiten. „Schatzhaus“ passt zum folgenden Verzeichnis wertvoller Güter.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: das Silber, das Gold
  rationale: Im Zusammenhang eines königlichen Bestandsverzeichnisses sind die Edelmetalle gemeint, nicht Geld im allgemeinen Sinn.
- source_word: הַבְּשָׂמִים
  choice: die Gewürze
  rationale: Das Wort bezeichnet aromatische Stoffe; „Gewürze“ ist verständlich und lässt ihre genaue Art offen.
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: das kostbare Öl
  rationale: Wörtlich steht „das gute Öl“. Im Kontext königlicher Kostbarkeiten gibt „kostbar“ die gemeinte hohe Qualität und den Wert natürlich wieder.
- source_word: כָּל בֵּית כֵּלָיו
  choice: sein ganzes Waffenlager
  rationale: Wörtlich ist von einem „Haus seiner Geräte“ die Rede. Im königlichen Kontext und nach der Parallele in 2. Könige 20,13 liegt ein Waffen- oder Ausrüstungslager nahe; die Fußnote bewahrt die offenere Formulierung.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: alles, was sich in seinen Vorratshäusern befand
  rationale: אֹצָר kann Schatzkammer oder Vorratshaus bedeuten. „Vorratshäuser“ vermeidet eine unnötige Wiederholung von „Schatzhaus“.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Es gab nichts …, was Hiskia ihnen nicht zeigte
  rationale: Die doppelte Verneinung wird im Deutschen auf natürliche Weise beibehalten und betont die Vollständigkeit.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Dies entspricht dem hebräischen Wortlaut; im königlichen Zusammenhang kann damit der Palast gemeint sein.
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: oder in seinem ganzen Herrschaftsbereich
  rationale: מֶמְשָׁלָה bezeichnet den Bereich seiner Herrschaft und kann räumlich wie administrativ verstanden werden.
