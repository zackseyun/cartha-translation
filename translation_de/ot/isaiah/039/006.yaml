source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: de
  text: Sieh, es kommen Tage, da wird alles, was in deinem Haus ist und was deine Väter bis zum heutigen Tag aufbewahrt haben, nach Babel weggetragen werden. Nichts wird übrig bleiben, spricht Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende und feierlich ankündigende Kraft der prophetischen Einleitung in knapper, verständlicher Form.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die geläufige prophetische Wendung und die hebräische Partizipialkonstruktion eng und natürlich wieder.
- source_word: וְנִשָּׂא
  choice: wird … weggetragen werden
  rationale: Das Nifal ist passiv; »weggetragen« bezeichnet im Zusammenhang die Verbringung von Besitz als Beute nach Babel.
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: alles, was in deinem Haus ist
  rationale: »Haus« wird entsprechend dem Hebräischen beibehalten, ohne es deutend auf Palast oder Besitz zu verengen.
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: und was deine Väter … angehäuft haben
  rationale: אָצַר bezeichnet das Ansammeln beziehungsweise Aufspeichern von Schätzen oder Vorräten; »angehäuft« passt zum über Generationen zusammengetragenen Besitz.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Gibt den ausdrücklich maskulinen hebräischen Verwandtschaftsbegriff formal wieder; gemeint sind die Vorväter Hiskias.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Natürliche deutsche Wiedergabe für eine Ansammlung, die sich bis in die Gegenwart erstreckt.
- source_word: בָּבֶל
  choice: Babel
  rationale: Traditionelle und im deutschen Bibelstil weiterhin verständliche Wiedergabe des hebräischen Ortsnamens.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Nichts wird übrig bleiben
  rationale: Bringt die nachdrückliche vollständige Verneinung idiomatisch und prägnant zum Ausdruck.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: »Spricht« entspricht der etablierten deutschen prophetischen Botenformel; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Geschlechtsspezifischer historischer Begriff אֲבֹתֶיךָ
  choice: deine Väter
  alternative: deine Vorfahren
  rationale: Die Übersetzung wahrt den ausdrücklich maskulinen Plural und lässt zugleich den generationenübergreifenden Zusammenhang erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem prophetischem Ton. Der Satzbau bleibt quellennah, ohne unnatürlich zu wirken; »Babel« und »spricht Jahwe« entsprechen einem gehobenen, aber allgemein verständlichen Bibelregister.
