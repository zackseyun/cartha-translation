  to: Sieh, es kommen Tage, da wird alles, was in deinem Haus ist und was deine Väter bis zum heutigen Tag aufbewahrt haben, nach Babel weggetragen werden. Nichts wird übrig bleiben, spricht Jahwe.
  rationale: Die einzige Änderung ersetzt »angehäuft« durch »aufbewahrt«, um die Bedeutung von אָצַר genauer wiederzugeben, ohne den gehobenen prophetischen Registerton oder die Aussage des Verses zu verändern.
