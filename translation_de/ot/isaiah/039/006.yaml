  naturalness: Der prophetische Ton ist modernes, gut verständliches Standarddeutsch. Die Formulierung »Sieh, es kommen Tage, da« ist idiomatisch und angemessen.
  terminology: »Haus«, »deine Väter«, »Babel« und »Jahwe« sind konsistent und quellennah. »Jahwe« gibt den Gottesnamen als Eigennamen wieder. Für אָצַר ist »aufbewahrt« die präzisere, zugleich natürliche Wahl.
