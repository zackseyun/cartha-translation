id: ISA.39.1
reference: Isaiah 39:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡וא שָׁלַ֡ח מְרֹדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ וַ/יִּשְׁמַ֕ע כִּ֥י חָלָ֖ה וַֽ/יֶּחֱזָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
translation:
  language: de
  text: Zu jener Zeit sandte Merodach-Baladan, der Sohn Baladans, der König von Babylon, Briefe und ein Geschenk an Hiskia; denn er hatte gehört, dass Hiskia krank gewesen war und sich wieder erholt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wieder stark geworden war«; die hebräische Wendung bezeichnet hier die Genesung von einer Krankheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Zu jener Zeit
  rationale: Die übliche, würdevolle deutsche Zeitangabe gibt den erzählerischen Rahmen natürlich wieder.
- source_word: שָׁלַח
  choice: sandte
  rationale: Die einfache und kontextgerechte Wiedergabe für das Senden diplomatischer Schreiben und eines Geschenks.
- source_word: מְרֹדַךְ בַּלְאֲדָן
  choice: Merodach-Baladan
  rationale: Die Form folgt der im Deutschen vertrauten biblischen Umschrift des Namens und bleibt eng an der hebräischen Lautgestalt.
- source_word: בֶּן בַּלְאֲדָן
  choice: der Sohn Baladans
  rationale: Die Abstammungsangabe wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Der Herrschertitel wird unmittelbar und idiomatisch übersetzt.
- source_word: סְפָרִים
  choice: Briefe
  rationale: Im diplomatischen Zusammenhang bezeichnet das Wort schriftliche Mitteilungen und nicht allgemein Bücher oder Schriftstücke.
- source_word: וּמִנְחָה
  choice: und ein Geschenk
  rationale: Hier ist ein diplomatisches Präsent gemeint, keine kultische Opfergabe.
- source_word: אֶל חִזְקִיָּהוּ
  choice: an Hiskia
  rationale: Die Präposition bezeichnet Hiskia als Empfänger der Briefe und des Geschenks.
- source_word: וַיִּשְׁמַע
  choice: denn er hatte gehört
  rationale: Die kausale Verbindung macht im Deutschen natürlich deutlich, weshalb der babylonische König die Sendung veranlasste.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Merodach-Baladan gehört hatte.
- source_word: חָלָה
  choice: krank gewesen war
  rationale: Die Vorzeitigkeit der Erkrankung gegenüber dem Senden wird im deutschen Tempusgefüge klar ausgedrückt.
- source_word: וַיֶּחֱזָק
  choice: sich wieder erholt hatte
  rationale: Das Verb bedeutet wörtlich, stark zu werden; nach einer Krankheit bezeichnet es idiomatisch die Genesung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »Hiskia« vermeidet eine missverständliche Pronomenfolge. Das Fußnotenzeichen steht bei der Genesungsaussage, auf die sich die Anmerkung tatsächlich bezieht.
