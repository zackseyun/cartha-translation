  source_fidelity: 'Der Entwurf gibt die partitive Aussage („einige deiner Söhne“), die Wegnahme, den babylonischen Königshof und die lexikalische Mehrdeutigkeit von סָרִיסִים grundsätzlich zutreffend wieder. „Von dir abstammen“ schwächt jedoch die doppelte, zukunftsbezogene genealogische Formulierung des Hebräischen ab: Der Text spricht von Söhnen, die „aus dir hervorgehen“ und die Hiskia zeugen wird.'
  naturalness: Der Satz ist überwiegend modernes, verständliches Standarddeutsch. Eine behutsame Umstellung zu „die aus dir hervorgehen, die du zeugen wirst“ bewahrt die hebräische Wiederholung klarer, ohne unnatürlich zu werden. Die Passivform „werden weggeführt werden“ entspricht dem hebräischen Passiv und vermeidet das weniger quellentreue deutsche unpersönliche „man“.
  terminology: „Eunuchen“ ist als Haupttext für סָרִיסִים vertretbar; die Fußnote wahrt sachgerecht die mögliche Bedeutung „Hofbeamte“. „Palast des Königs von Babylon“ trifft הֵיכָל und die Genitivverbindung angemessen.
  issues:
