- from: Und einige von deinen Söhnen, die von dir abstammen und die du zeugen wirst, wird man fortführen. Sie werden Eunuchen[a] im Palast des Königs von Babylon sein.
  to: Und einige deiner Söhne, die aus dir hervorgehen, die du zeugen wirst, werden weggeführt werden. Sie werden Eunuchen[a] im Palast des Königs von Babylon sein.
  rationale: Die Revision bewahrt die zwei im Hebräischen aufeinanderfolgenden genealogischen Bestimmungen einschließlich ihrer Zukunftsperspektive und gibt das passive יִקָּחוּ direkt wieder. Die vorsichtige Haupttext-/Fußnotenlösung für סָרִיסִים bleibt unverändert, damit die lexikalische Ambiguität nicht dogmatisch aufgelöst wird.
