source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: de
  text: Und einige deiner Söhne, die aus dir hervorgehen, die du zeugen wirst, werden weggeführt werden. Sie werden Eunuchen[a] im Palast des Königs von Babylon sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Hofbeamte. Das hebräische Wort kann sowohl Eunuchen als auch königliche Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Und einige von deinen Söhnen
  rationale: Das partitive מִן bezeichnet hier einen Teil der Söhne. „Einige von deinen Söhnen“ gibt dies im modernen Deutsch natürlich wieder und bewahrt die konkrete Verwandtschaftsbezeichnung.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: die von dir abstammen
  rationale: Die Wendung bezeichnet Menschen, die aus Hiskias eigener Linie hervorgehen. „Von dir abstammen“ vermittelt den genealogischen Sinn idiomatisch, ohne eine bestimmte Generation festzulegen.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: die du zeugen wirst
  rationale: Der Hifil von ילד bezeichnet bei einem männlichen Subjekt das Zeugen von Kindern. „Zeugen“ ist im Deutschen präzise und in diesem feierlich-prophetischen Zusammenhang verständlich.
- source_word: יִקָּחוּ
  choice: wird man fortführen
  rationale: Das aktive Verb hat ein unbestimmtes Subjekt. Die deutsche man-Konstruktion bewahrt diese Unbestimmtheit; „fortführen“ macht im Zusammenhang die erzwungene Wegnahme verständlich, ohne einen Täter zu ergänzen.
- source_word: וְהָיוּ
  choice: Sie werden … sein
  rationale: היה mit einem Prädikatsnomen kann „sein“ oder „werden“ bedeuten. Das futurische „werden … sein“ wahrt diese Offenheit besser als die ausdrücklich verändernde Formulierung „werden zu“.
- source_word: סָרִיסִים
  choice: Eunuchen
  rationale: „Eunuchen“ ist die direkte und historisch naheliegende Bedeutung. Da das Wort in königlichen Zusammenhängen auch Hofbeamte bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: בְּהֵיכַל
  choice: im Palast
  rationale: הֵיכָל bezeichnet hier aufgrund des folgenden königlichen Bezugs eindeutig den Palast beziehungsweise die königliche Residenz, nicht einen Tempel.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Die Formulierung gibt die hebräische Genitivverbindung klar und konventionell wieder.
theological_decisions:
- issue: Bedeutung von סָרִיסִים in der Prophetie über den babylonischen Königshof
  choice: Eunuchen im Haupttext
  alternative: Hofbeamte
  rationale: Das hebräische Wort kann sowohl buchstäbliche Eunuchen als auch, in erweitertem Gebrauch, königliche Amtsträger bezeichnen. Der Haupttext verwendet die direkte Bedeutung, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Relativsätze bewahren die genealogische Zuspitzung des Hebräischen; die man-Konstruktion erhält das unbestimmte Handlungssubjekt. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck „Eunuchen“.
