    issue: Die beiden genealogischen Relativsätze sind nicht vollständig quellentreu wiedergegeben.
    rationale: „Die von dir abstammen“ ist im Deutschen eher eine allgemeine Abstammungsaussage und enthält weder die Zukunftsnuance von יֵצְאוּ noch die bildhafte Formulierung „aus dir hervorgehen“. Die nachfolgende Aussage „die du zeugen wirst“ sollte daneben stehen bleiben, da beide hebräischen Relativsätze vorhanden sind.
  - severity: low
    issue: Die Wiedergabe von יִקָּחוּ mit „wird man fortführen“ wechselt vom Passiv zu einer man-Konstruktion.
    rationale: Die Konstruktion ist verständlich, aber „werden weggeführt werden“ bildet das hebräische Passiv unmittelbarer ab und belässt den nicht genannten Handelnden ebenso offen.
