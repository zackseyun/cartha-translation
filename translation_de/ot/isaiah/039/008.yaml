source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר כִּ֥י יִהְיֶ֛ה שָׁל֥וֹם וֶ/אֱמֶ֖ת בְּ/יָמָֽ/י־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: de
  text: 'Da sagte Hiskija zu Jesaja: »Das Wort des HERRN, das du gesprochen hast, ist gut.« Und er sagte: »Denn zu meinen Lebzeiten wird Frieden und Beständigkeit[a] herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wahrheit; auch: Treue, Zuverlässigkeit.'
    reason: Das hebräische אֱמֶת hat ein breites Bedeutungsspektrum. Die Fußnote bewahrt die lexikalische Mehrdeutigkeit neben der kontextbezogenen Wiedergabe „Beständigkeit“.
lexical_decisions:
- source_word: טוֹב (ṭôḇ)
  choice: gut
  rationale: Die schlichte Wertung des hebräischen Textes bleibt erhalten, ohne Hiskijas Haltung näher zu deuten.
- source_word: דְבַר יְהוָה (dəḇar YHWH)
  choice: das Wort des HERRN
  rationale: „Wort“ gibt דָּבָר im prophetischen Zusammenhang angemessen wieder; „HERR“ entspricht der geläufigen deutschen Wiedergabe des Gottesnamens.
- source_word: שָׁלוֹם (šālôm)
  choice: Frieden
  rationale: Im Zusammenhang bezeichnet der Ausdruck eine ungestörte, friedliche Lage.
- source_word: אֱמֶת (ʾĕmeṯ)
  choice: Beständigkeit
  rationale: Neben „Wahrheit“ und „Treue“ kann das Wort hier die Dauerhaftigkeit und Verlässlichkeit friedlicher Verhältnisse bezeichnen; „Beständigkeit“ passt zur Verbindung mit שָׁלוֹם, ohne den Begriff auf bloße politische Sicherheit zu verengen.
- source_word: בְּיָמָי (bəyāmāy)
  choice: zu meinen Lebzeiten
  rationale: Die idiomatische deutsche Form gibt wörtlich „in meinen Tagen“ verständlich und präzise wieder.
theological_decisions:
- issue: 'Hiskijas zweite Äußerung: gesprochen oder nur gedacht'
  choice: „Und er sagte“ als ausdrückliche zweite Redehandlung
  alternative: „Denn er dachte“
  rationale: Der masoretische Text verwendet erneut וַיֹּאמֶר („und er sagte“). Die Übersetzung bewahrt diese explizite Aussage und deutet sie nicht als unausgesprochenen Gedanken um.
- issue: Bewertung von Hiskijas Reaktion
  choice: Keine zusätzliche moralische oder psychologische Bewertung
  alternative: Die Äußerung ausdrücklich als selbstsüchtig, erleichtert oder fromm kennzeichnen
  rationale: Der Vers berichtet Hiskijas Worte, lässt ihre Motivation aber offen. Diese Spannung soll bestehen bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Bericht; „zu meinen Lebzeiten“ ist gegenüber dem wörtlichen „in meinen Tagen“ idiomatischer. Die direkte Rede wird nicht psychologisierend in einen inneren Gedanken umgewandelt.
