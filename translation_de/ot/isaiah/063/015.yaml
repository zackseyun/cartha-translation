    issue: Satzanschluss der zweiten Ortsbestimmung
    rationale: Die Formulierung „und sieh, von deiner heiligen und herrlichen Wohnstätte aus“ trennt die Ortsbestimmung durch ein Komma vom Imperativ und klingt im Deutschen unvollständig bzw. parenthetisch. Ohne Komma und direkt beim Verb ist der Satz klar und dem Hebräischen entsprechend.
  - severity: low
    issue: Unpräzise Fußnote zu הֲמוֹן מֵעֶיךָ
    rationale: „Das Erregen deiner Eingeweide“ ist kein geläufiges Deutsch und trifft הֲמוֹן nicht gut. „Das Aufgewühltsein deiner Eingeweide“ erklärt die Wendung als innere Erregung, ohne eine überpräzise physiologische oder theologische Aussage zu machen.
  - severity: low
