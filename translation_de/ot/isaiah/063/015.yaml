base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: de
  text: Blicke vom Himmel herab und sieh von deiner heiligen und herrlichen Wohnstätte aus. Wo sind dein Eifer[a] und deine Machttaten? Die Regung deines Innersten[b] und dein Erbarmen halten sich mir gegenüber zurück[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Eifersucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: das Aufgewühltsein deiner Eingeweide; ein hebräisches Bild für tiefes inneres Bewegtsein und Mitgefühl.'
    reason: cultural_note
  - marker: c
    text: 'Oder: werden mir gegenüber zurückgehalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: Blicke vom Himmel herab und sieh
  rationale: Die beiden Imperative bleiben erhalten; „herab“ verdeutlicht natürlich die im Blick vom Himmel aus enthaltene Richtung.
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: von deiner heiligen und herrlichen Wohnstätte aus
  rationale: זְבֻל bezeichnet hier Gottes erhabenen Wohnort. Die Substantive „Heiligkeit“ und „Herrlichkeit“ werden für ein natürliches Deutsch adjektivisch wiedergegeben.
- source_word: קִנְאָתְךָ
  choice: dein Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang der Bitte um Gottes Eingreifen ist „Eifer“ im Haupttext verständlicher; die andere Bedeutung bleibt in einer Fußnote sichtbar.
- source_word: גְבוּרֹתֶיךָ
  choice: deine Machttaten
  rationale: Der Plural bezeichnet machtvolle Erweise beziehungsweise Taten, nicht lediglich abstrakte Kraft.
- source_word: הֲמוֹן מֵעֶיךָ
  choice: die Regung deines Innersten
  rationale: הֲמוֹן bezeichnet hier das innere Bewegtsein; מֵעִים benennt wörtlich die inneren Organe als Sitz tiefen Empfindens. Die Wiedergabe bewahrt das verkörperte Bild in verständlichem Deutsch.
- source_word: רַחֲמֶיךָ
  choice: dein Erbarmen
  rationale: Der hebräische Plural kann die Fülle des Erbarmens ausdrücken. Der deutsche Kollektivsingular ist hier natürlicher und behält den Sinn.
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: halten sich von mir zurück
  rationale: Der Hitpael von אפק drückt ein Sich-zurückhalten aus. Die reflexive Form wahrt dies genauer als eine rein passive Wiedergabe; אֵלַי wird im deutschen Zusammenhang idiomatisch mit „von mir“ verbunden.
theological_decisions:
- issue: Körperlich-emotionale Rede von Gottes tiefem Empfinden
  choice: „die Regung deines Innersten“ mit erklärender Fußnote
  alternative: „dein tiefes Mitgefühl“ oder „die Regung deiner Eingeweide“
  rationale: Die Übersetzung erhält die anthropopathische Bildsprache, ohne sie zu einer Aussage über Gottes Körperlichkeit zu machen oder sie vollständig in einen abstrakten Begriff aufzulösen.
- issue: Bedeutung von קִנְאָה bei Gott
  choice: „Eifer“ im Haupttext
  alternative: „Eifersucht“
  rationale: Der Kontext beklagt das scheinbare Ausbleiben von Gottes leidenschaftlichem, machtvollem Eingreifen. „Eifer“ trägt diesen Sinn im heutigen Deutsch, während eine Fußnote die echte lexikalische Alternative festhält.
- issue: Scheinbares Zurückhalten des göttlichen Erbarmens
  choice: „halten sich von mir zurück“
  alternative: „werden mir vorenthalten“
  rationale: Die Formulierung bewahrt die Spannung der Klage und behauptet nicht, eine äußere Macht halte Gottes Erbarmen zurück.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blicke“ und „Wohnstätte“ geben der Klage einen leicht gehobenen, aber gut verständlichen Ton. „Innerstes“ vermeidet das heute missverständliche oder grobe „Eingeweide“, während die Fußnote das hebräische Körperbild offenlegt. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
