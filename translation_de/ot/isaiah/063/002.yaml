  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: de
  text: Warum ist deine Kleidung rot[a], und warum sind deine Gewänder wie die eines Keltertreters[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerötet“ beziehungsweise „scharlachrot“. Im Hebräischen steht schlicht „rot“; wodurch die Färbung verursacht ist, erklärt erst der Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist jemand, der Trauben in einer Kelter mit den Füßen tritt und dessen Gewänder dabei vom Saft rot gefärbt werden.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das direkte Frageadverb wird im modernen Standarddeutsch natürlich und präzise mit „Warum“ wiedergegeben.
- source_word: אָדֹם
  choice: rot
  rationale: Das Adjektiv bezeichnet schlicht die Farbe Rot. „Rot“ bewahrt die offene Bildsprache und nimmt die im folgenden Kontext erklärte Ursache nicht vorweg.
- source_word: לִלְבוּשֶׁךָ
  choice: deine Kleidung
  rationale: לְבוּשׁ bezeichnet allgemein Kleidung oder Bekleidung. „Kleidung“ ist modern und engt den Bezug nicht auf ein einzelnes Kleidungsstück ein.
- source_word: וּבְגָדֶיךָ
  choice: und deine Gewänder
  rationale: בֶּגֶד bezeichnet ein Kleidungsstück oder Gewand. „Gewänder“ erhält die poetische Parallelität zu „Kleidung“ in würdigem, weiterhin verständlichem Deutsch.
- source_word: כְּדֹרֵךְ
  choice: wie die eines Menschen, der … tritt
  rationale: כְּ kennzeichnet den Vergleich, und das Partizip דֹרֵךְ bezeichnet jemanden beim Treten. Wegen des deutschen Numerus wird der Bezug auf „Gewänder“ mit „wie die eines Menschen“ ausdrücklich und natürlich formuliert.
- source_word: בְּגַת
  choice: in der Kelter
  rationale: גַּת bezeichnet eine Wein- beziehungsweise Traubenkelter. „Kelter“ ist die knappe, bildkräftige und im biblischen Zusammenhang verständliche deutsche Entsprechung.
theological_decisions:
- issue: Ob die Blut- und Gerichtssymbolik der roten Kleidung ausdrücklich gemacht werden soll
  choice: Die wörtliche Farbangabe „rot“ bleibt ohne interpretierenden Zusatz stehen.
  alternative: „blutbefleckt“ oder „blutrot“
  rationale: Der hebräische Vers spricht zunächst nur von roter Kleidung und vergleicht die Gewänder mit denen eines Keltertreters. Erst der folgende Kontext klärt die Gerichtsbildsprache; die Übersetzung soll diese Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. „Kelter“ bewahrt die knappe historische Bildwelt; die Fußnote erläutert sie für heutige Leser. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
