    text: 'Oder: „Da errang mein Arm für mich den Sieg.“ Das hebräische Verb gehört zu einer Wortwurzel, die häufig mit „retten“ oder „befreien“ wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: Ich blickte hin
  rationale: Die Hifil-Form von נבט bezeichnet ein gerichtetes Schauen. „Ich blickte hin“ gibt dies knapp und natürlich wieder, ohne ein Objekt hinzuzufügen.
- source_word: עֹזֵר
  choice: niemand, der half
  rationale: Das Partizip von עזר bezeichnet einen Helfenden. Die Relativkonstruktion ist im Deutschen idiomatisch und bewahrt den persönlichen Bezug.
- source_word: וְאֶשְׁתּוֹמֵם
  choice: ich war entsetzt
  rationale: Die reflexive Verbform von שמם kann fassungsloses Erstaunen, Erstarrung oder Entsetzen ausdrücken. „Entsetzt“ entspricht dem Zusammenhang des Gerichts, ohne die lexikalische Spannweite zu verschweigen.
- source_word: סוֹמֵךְ
  choice: der mich stützte
  rationale: Das Partizip von סמך bedeutet stützen oder beistehen. „Stützte“ wahrt die Verbindung zum späteren finiten Verb derselben Wurzel.
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: Da brachte mir mein eigener Arm Rettung
  rationale: Die Form von ישׁע mit לִי beschreibt, dass der Arm des Sprechers für ihn Rettung beziehungsweise Sieg bewirkt. „Mein eigener Arm“ hebt im Kontext das Handeln ohne fremde Hilfe hervor.
- source_word: חֲמָתִי
  choice: mein Zorn
  rationale: חֵמָה bezeichnet brennenden Zorn oder Grimm. „Zorn“ ist im prophetischen Gerichtskontext gewichtig und allgemein verständlich.
- source_word: הִיא סְמָכָתְנִי
  choice: er stützte mich
  rationale: Das feminine Pronomen greift das feminine Substantiv חֲמָתִי auf. Im Deutschen richtet sich das Pronomen nach dem maskulinen „Zorn“. Die Wiederholung von „stützte“ bildet die Wiederholung der hebräischen Wurzel סמך ab.
theological_decisions:
- issue: Göttliche Selbstrettung in anthropomorpher Bildsprache
  choice: Da brachte mir mein eigener Arm Rettung
  alternative: Da errang mein Arm für mich den Sieg
  rationale: Die Formulierung bewahrt das Bild, nach dem die eigene Macht des göttlichen Sprechers ohne menschliche Unterstützung Rettung bewirkt. „Rettung“ hält die Verbindung zur Wurzel ישׁע offen und verengt den Sinn nicht ausschließlich auf militärischen Sieg.
- issue: Der Zorn als stützende Kraft
  choice: und mein Zorn – er stützte mich
  alternative: und mein Grimm hielt mich aufrecht
  rationale: Der Satz lässt die theologische Spannung bestehen, dass der göttliche Zorn den Sprecher bei seinem Gerichtshandeln stützt. Der Gedankenstrich hebt die im Hebräischen ausdrücklich wiederaufnehmende Pronomenkonstruktion hervor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität von „da war niemand“ sowie die Wiederholung von „stützte“ bilden die hebräische Struktur ab. Der Gedankenstrich markiert die betonte Wiederaufnahme von „mein Zorn“ durch das Pronomen.
