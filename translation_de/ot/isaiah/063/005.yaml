  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: de
  text: Ich blickte, doch da war niemand, der half; ich war entsetzt[a], doch da war niemand, der mich stützte. Da brachte mir mein eigener Arm Rettung[b], und mein Zorn – er stützte mich.
  philosophy: optimal-equivalence
  footnotes:
