source:
  edition: WLC
  text: כִּ֛י י֥וֹם נָקָ֖ם בְּ/לִבִּ֑/י וּ/שְׁנַ֥ת גְּאוּלַ֖/י בָּֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
translation:
  language: de
  text: Denn der Tag der Rache war in meinem Herzen, und das Jahr meiner Erlösten[a] war gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Erlösung“. Die hebräische Form bezeichnet am ehesten die vom Sprecher Erlösten; im Zusammenhang kann die Wendung zugleich auf sein Erlösungshandeln und die dafür bestimmte Zeit bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die im vorausgehenden Zusammenhang geschilderte Handlung. „Denn“ gibt diese erklärende Verknüpfung im Deutschen natürlich wieder.
- source_word: יוֹם נָקָם
  choice: Tag der Rache
  rationale: Die direkte Wiedergabe bewahrt sowohl das konkrete Zeitwort „Tag“ als auch den Sinn göttlicher Vergeltung beziehungsweise Ahndung.
- source_word: בְּלִבִּי
  choice: in meinem Herzen
  rationale: Die hebräische Wendung bezeichnet den inneren Entschluss oder Vorsatz. Das entsprechende deutsche Bild bleibt verständlich und sollte nicht auf „in meinen Gedanken“ verengt werden.
- source_word: וּשְׁנַת גְּאוּלַי
  choice: und das Jahr meiner Erlösten
  rationale: גְּאוּלַי ist der Form nach am naheliegendsten als „meine Erlösten“ zu verstehen. Der Genitiv bewahrt die knappe Konstruktion und lässt offen, ob das Jahr besonders ihnen gilt oder durch ihre Erlösung gekennzeichnet ist.
- source_word: בָּאָה
  choice: war gekommen
  rationale: Das feminine Verb stimmt mit „Jahr“ überein. Das Plusquamperfekt bezeichnet im erzählerischen Rückblick den bereits eingetretenen Zeitpunkt.
theological_decisions:
- issue: Bezug von גְּאוּלַי auf Gottes Gericht und Rettung
  choice: meiner Erlösten
  alternative: meiner Erlösung
  rationale: Die vokalisierte hebräische Form spricht vorrangig von Personen, die dem Sprecher als Erlöste zugehören. Die Fußnote bewahrt die im Parallelismus mögliche ereignisbezogene Deutung, ohne Gericht und Rettung voneinander zu lösen oder die Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Rede vom Herzen und die Parallelstruktur „Tag … Jahr …“ bleiben erhalten; „Rache“ ist bewusst nicht durch einen abstrakteren Rechtsbegriff ersetzt.
