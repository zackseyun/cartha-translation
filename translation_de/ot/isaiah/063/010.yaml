id: ISA.63.10
reference: Isaiah 63:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: de
  text: Doch sie rebellierten und betrübten seinen Heiligen Geist[a]. Da wurde er ihnen zum Feind; er selbst kämpfte gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen heiligen Geist“; wörtlicher: „den Geist seiner Heiligkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Doch sie
  rationale: Die Verbindung aus Konjunktion und ausdrücklich genanntem Pronomen bildet einen Gegensatz zu Gottes vorausgehenden Heilstaten. „Doch sie“ gibt diesen Kontrast im Deutschen knapp und natürlich wieder.
- source_word: מָרוּ
  choice: rebellierten
  rationale: מרה bezeichnet hier den bewussten Aufstand beziehungsweise Widerstand gegen Gott. „Rebellierten“ bewahrt diese deutliche Aussage.
- source_word: וְעִצְּבוּ
  choice: betrübten
  rationale: Das Piel von עצב bezeichnet das Zufügen von Schmerz oder Kummer. „Betrübten“ ist im Zusammenhang mit dem Geist persönlich-relational und zugleich würdig formuliert.
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: seinen Heiligen Geist
  rationale: Die Wendung lautet formal „den Geist seiner Heiligkeit“ und kann idiomatisch als „seinen heiligen Geist“ verstanden werden. Die gewählte Schreibung gibt den naheliegenden persönlichen Bezug wieder; die echte sprachliche Alternative wird in der Fußnote offengehalten.
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  choice: Da wurde er ihnen zum Feind
  rationale: Die Form bezeichnet einen Umschlag der Beziehung oder Haltung. Die deutsche Wendung gibt das hebräische „ihnen zum Feind“ eng, klar und ohne unnötige Ergänzung wieder.
- source_word: הוּא
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck. „Er selbst“ erhält diese Betonung.
- source_word: נִלְחַם בָּם
  choice: kämpfte gegen sie
  rationale: לחם mit ב bezeichnet hier feindliches Kämpfen gegen jemanden. „Gegen sie“ verhindert das mögliche Missverständnis eines gemeinsamen Kampfes.
theological_decisions:
- issue: Wiedergabe von רוּחַ קָדְשׁוֹ
  choice: seinen Heiligen Geist
  alternative: seinen heiligen Geist; den Geist seiner Heiligkeit
  rationale: Der Kontext beschreibt den Geist als betrübbar und legt einen persönlichen Referenten nahe. Zugleich enthält das Hebräische formal eine Genitivverbindung, deren wörtlichere und weniger terminologisch festgelegte Wiedergaben in der Fußnote erhalten bleiben.
- issue: Bezug des Subjekts in וַיֵּהָפֵךְ und נִלְחַם
  choice: Das Pronomen „er“ bleibt ohne erläuternde Namensnennung stehen.
  alternative: Gott wurde ihnen zum Feind; Gott selbst kämpfte gegen sie.
  rationale: Das Hebräische nennt an dieser Stelle keinen Namen, sondern verwendet verbale Formen und anschließend das betonte Pronomen הוּא. Die Übersetzung vermeidet daher eine auslegende Explizierung und bewahrt den Textverlauf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Semikolon-Satz erhält die enge Verbindung zwischen dem relationalen Umschlag und dem anschließenden Kampf; die emphatische Wiederaufnahme „er selbst“ bleibt erhalten.
