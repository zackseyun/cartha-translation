source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: de
  text: 'Denn er sagte: „Gewiss, sie sind mein Volk, Kinder, die nicht betrügerisch handeln werden[a].“ So wurde er ihnen zum Retter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nicht lügen werden“; auch möglich: „die sich nicht als falsch erweisen werden“.'
    reason: 'Lexikalische Alternative: שׁקר kann Lügen beziehungsweise täuschendes oder falsches Handeln und, je nach Kontext, ein Sich-als-falsch-Erweisen bezeichnen.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Denn er sagte
  rationale: Das narrative וַ wird im Zusammenhang erklärend verstanden; „Denn“ stellt den Bezug zum vorausgehenden Rückblick her, während „er sagte“ die Redeeinleitung schlicht wiedergibt.
- source_word: אַךְ
  choice: Gewiss
  rationale: אַךְ dient hier als nachdrückliche Bekräftigung, nicht als Einschränkung. „Gewiss“ wahrt diesen emphatischen Ton in würdigem, heutigem Deutsch.
- source_word: עַמִּי הֵמָּה
  choice: sie sind mein Volk
  rationale: „Mein Volk“ bewahrt den kollektiven und bundesbezogenen Ausdruck; das selbstständige Pronomen הֵמָּה wird durch das ausdrückliche „sie“ wiedergegeben.
- source_word: בָּנִים
  choice: Kinder
  rationale: Der maskuline Plural bezeichnet hier das ganze Volk in seiner Kindschaft gegenüber Gott und ist nicht auf männliche Nachkommen beschränkt.
- source_word: לֹא יְשַׁקֵּרוּ
  choice: die nicht treulos handeln werden
  rationale: Das Piel von שׁקר kann über eine unwahre Aussage hinaus falsches, täuschendes oder treuloses Verhalten bezeichnen. „Treulos handeln“ erhält diese ethische und relationale Weite.
- source_word: וַיְהִי לָהֶם
  choice: So wurde er ihr
  rationale: „So“ gibt den im Zusammenhang liegenden Folgezusammenhang natürlich wieder; „wurde er ihr“ bewahrt die Aussage einer entstandenen Beziehung.
- source_word: לְמוֹשִׁיעַ
  choice: Retter
  rationale: Das substantivisch gebrauchte Partizip von ישׁע bezeichnet den, der rettet oder befreit. „Retter“ ist im Deutschen natürlich und bewahrt das theologische Gewicht, ohne zusätzliche dogmatische Festlegungen einzutragen.
theological_decisions:
- issue: Göttliche Bezeichnung לְמוֹשִׁיעַ
  choice: Retter
  alternative: Befreier
  rationale: Der Vers beschreibt Gott als denjenigen, der seinem Volk Rettung verschafft. „Retter“ erhält den personalen und theologischen Gehalt des Ausdrucks.
- issue: Geschlechtliche Wiedergabe von בָּנִים
  choice: Kinder
  alternative: Söhne
  rationale: Im Kontext umfasst der maskuline Plural das Volk als Ganzes. „Kinder“ gibt die Beziehung zu Gott genau wieder, ohne den Bezug unnötig auf Männer zu verengen.
- issue: Reichweite von לֹא יְשַׁקֵּרוּ
  choice: die nicht treulos handeln werden
  alternative: die nicht lügen werden / die sich nicht als treulos erweisen werden
  rationale: Die Formulierung lässt sowohl unwahrhaftiges Handeln als auch das Sich-als-falsch-oder-treulos-Erweisen zu. Der Haupttext wahrt die relationale Spannung, die Alternativen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und nachdrücklich; „Gewiss“ trägt die Emphase von אַךְ, ohne altertümlich zu wirken.
