source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: de
  text: 'Da erinnerte er sich an die Tage der Vorzeit, an Mose und an sein Volk: »Wo ist der, der sie aus dem Meer heraufführte, zusammen mit den Hirten seiner Herde[a]? Wo ist der, der seinen heiligen Geist in ihn legte[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »mit den Hirten seiner Herde«. Manche lesen im Singular: »mit dem Hirten seiner Herde«; damit wäre wahrscheinlich Mose gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische hat ein maskulines Singularsuffix: »in ihm«. Sein Bezug ist umstritten; gemeint sein können Mose, das als Einheit verstandene Volk oder die Mitte des Volkes. Daher wird auch »in ihnen« oder »mitten unter ihnen« übersetzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Da erinnerte er sich
  rationale: Das Wayyiqtol von זכר führt den Gedankengang fort. »Da« gibt die zeitlich-folgernde Verbindung natürlich wieder; das maskuline Singularpronomen bleibt erhalten, ohne den im Hebräischen nicht ausdrücklich genannten Bezug näher festzulegen.
- source_word: יְמֵי עוֹלָם
  choice: die längst vergangenen Tage
  rationale: Die Wendung bezeichnet hier die weit zurückliegende Zeit der grundlegenden Rettungstaten Gottes. Die Formulierung ist gegenwärtiges Deutsch und vermeidet die mögliche Fehlvorstellung, עוֹלָם bedeute hier »ewig«.
- source_word: מֹשֶׁה עַמּוֹ
  choice: an Mose und sein Volk
  rationale: Die hebräische Wortfolge ist stark verdichtet und syntaktisch umstritten. Diese Wiedergabe versteht Mose und sein Volk gemeinsam als Inhalt der Erinnerung und folgt damit einer möglichen direkten Lesart, ohne zusätzliche Satzteile einzuführen.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die zweimalige Frage wird als rhetorische Gegenwartsfrage beibehalten und trägt so den klagenden, suchenden Ton des Abschnitts.
- source_word: הַמַּעֲלֵם מִיָּם
  choice: der sie aus dem Meer heraufführte
  rationale: עלה bedeutet in diesem Exoduszusammenhang »heraufführen«; das pluralische Objektsuffix wird mit »sie« wiedergegeben. »Aus dem Meer« bringt den Ausgangspunkt der Rettung präzise zum Ausdruck.
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: zusammen mit den Hirten seiner Herde
  rationale: Die masoretische Punktierung liest das Substantiv im Plural. »Zusammen mit« gibt die begleitende Funktion von אֵת verständlich wieder; die mögliche Singularlesart wird in einer Fußnote genannt.
- source_word: הַשָּׂם
  choice: der … legte
  rationale: Das Partizip von שׂים steht parallel zu הַמַּעֲלֵם und bezeichnet den, der etwas hineinlegt oder einsetzt. Das Präteritum fügt sich natürlich in die rückblickende Frage ein.
- source_word: בְּקִרְבּוֹ
  choice: in seine Mitte
  rationale: Das maskuline Singularsuffix wird durch »seine« formal gewahrt. »Mitte« lässt offen, ob Mose, das kollektiv verstandene Volk oder dessen Mitte gemeint ist; die tatsächliche Mehrdeutigkeit wird zusätzlich erklärt.
- source_word: רוּחַ קָדְשׁוֹ
  choice: seinen heiligen Geist
  rationale: Die markante Verbindung bezeichnet Gottes eigenen heiligen Geist. Die übliche deutsche Schreibung wahrt sowohl den possessiven Bezug als auch die theologische Bedeutung, ohne über den hebräischen Ausdruck hinauszugehen.
theological_decisions:
- issue: Subjekt von »erinnerte sich«
  choice: Das maskuline Singularpronomen »er« wird beibehalten; im Zusammenhang liegt Gott beziehungsweise der HERR als Bezug nahe.
  alternative: »Sein Volk erinnerte sich« beziehungsweise »Da erinnerte sich sein Volk an die längst vergangenen Tage, an Mose«.
  rationale: Die verdichtete Folge וַיִּזְכֹּר … מֹשֶׁה עַמּוֹ erlaubt unterschiedliche syntaktische Zuordnungen. Der Singular des Verbs stützt die gewählte Wiedergabe, doch die Formulierung vermeidet eine ausdrückliche Gottesbezeichnung, die im Vers selbst nicht steht.
- issue: Bezug des Singularsuffixes in בְּקִרְבּוֹ
  choice: Die Singularform wird als »in seine Mitte« bewahrt.
  alternative: »in sie hinein« oder »mitten unter sie«; möglich ist auch ein unmittelbarer Bezug auf Mose.
  rationale: Der hebräische Text hat ein maskulines Singularsuffix, dessen Bezugswort umstritten ist. Die Übersetzung löst die für das Verständnis des Wirkens des heiligen Geistes bedeutsame Spannung nicht stillschweigend auf.
- issue: Zahl von רֹעֵי
  choice: 'Plural: »die Hirten seiner Herde«.'
  alternative: 'Singular: »der Hirte seiner Herde«, wahrscheinlich als Bezeichnung für Mose.'
  rationale: Die masoretische Punktierung ist pluralisch und wird deshalb im Haupttext wiedergegeben. Die kontextuell plausible Singularauffassung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Fragen und die Exodusbildsprache bleiben deutlich hörbar. Verdichtete oder mehrdeutige hebräische Formen werden im Haupttext möglichst bewahrt und nicht konfessionell oder dogmatisch vereindeutigt.
