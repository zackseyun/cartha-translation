id: ISA.63.12
reference: Isaiah 63:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מוֹלִיךְ֙ לִ/ימִ֣ין מֹשֶׁ֔ה זְר֖וֹעַ תִּפְאַרְתּ֑/וֹ בּ֤וֹקֵֽעַ מַ֨יִם֙ מִ/פְּנֵי/הֶ֔ם לַ/עֲשׂ֥וֹת ל֖/וֹ שֵׁ֥ם עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/012.yaml
  text: who led his glorious arm at the right hand of Moses, who split the waters before them to make for himself an everlasting name,
translation:
  language: de
  text: der seinen herrlichen Arm zur Rechten Moses führte, der vor ihnen das Wasser spaltete, um sich einen ewigen Namen zu machen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: führte
  rationale: Das Hifil-Partizip bezeichnet hier ein Führen bzw. Geleiten; die deutsche Vergangenheitsform fügt sich natürlich in den rückblickenden Kontext ein.
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: seinen herrlichen Arm
  rationale: Bewahrt das poetische Bild des göttlichen Arms als Ausdruck wirksamer Macht und gibt תִּפְאֶרֶת idiomatisch als „herrlich“ wieder.
- source_word: לִימִין מֹשֶׁה
  choice: zur Rechten Moses
  rationale: Gibt die räumliche Wendung eng am Hebräischen wieder, ohne festzulegen, ob der Arm neben Mose wirkte oder durch ihn.
- source_word: בּוֹקֵעַ מַיִם
  choice: der … das Wasser spaltete
  rationale: בקע bezeichnet das Aufspalten oder Durchbrechen; der deutsche Singular „das Wasser“ ist in der Exodus-Anspielung natürlich und kollektiv zu verstehen.
- source_word: שֵׁם עוֹלָם
  choice: einen ewigen Namen
  rationale: Die formnahe Wiedergabe erhält das biblische Motiv eines dauerhaft berühmten und geehrten Namens.
theological_decisions:
- issue: Bezug und Funktion von „seinem herrlichen Arm“
  choice: Gottes Arm wird als von ihm zur Rechten Moses geführt dargestellt.
  alternative: Gott ließ seinen herrlichen Arm zur Rechten Moses einhergehen.
  rationale: Die Übersetzung wahrt die Personifikation und den syntaktischen Bezug, ohne den „Arm“ ausdrücklich mit einer Person, Mose selbst oder einem bestimmten Heilsakteur gleichzusetzen.
- issue: Zweck des Spaltens des Wassers
  choice: „um sich einen ewigen Namen zu machen“
  alternative: „um ihm einen ewigen Namen zu machen“
  rationale: Das pronominale לוֹ bezieht sich im Zusammenhang am natürlichsten auf Gott; zugleich bleibt die Aussage als Zweckangabe erhalten und wird nicht zu einem bloßen Ergebnis abgeschwächt.
translation_notes:
  register: Poetisch, würdevoll und nah an der hebräischen Bildsprache. „Zur Rechten Moses“ ist bewusst etwas gehoben, aber im modernen Standarddeutsch verständlich und bewahrt die genuine syntaktische Offenheit.
