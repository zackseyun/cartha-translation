revisions:
- from: In all ihrer Bedrängnis war er nicht bedrängt[a], und der Engel seiner Gegenwart rettete sie. In seiner Liebe und seinem Erbarmen erlöste er sie; er nahm sie auf und trug sie alle Tage der Vorzeit.
  to: In all ihrer Bedrängnis war er kein Gegner[a], und der Engel seiner Gegenwart rettete sie. In seiner Liebe und seinem Erbarmen erlöste er sie; er nahm sie auf und trug sie an allen Tagen der Vorzeit.
  rationale: Die Revision gibt die auffällige masoretische Lesart לֹא צָר als „war er kein Gegner“ wieder, statt sie zu einer Aussage über Gottes eigenes Bedrängtsein umzuformen. Die alte, textgeschichtlich bedeutsame Alternativlesart bleibt unmittelbar am betreffenden Ausdruck verankert. Außerdem wurde die abschließende Zeitangabe idiomatischer formuliert, ohne den rückblickenden Sinn von עוֹלָם zu verändern.
