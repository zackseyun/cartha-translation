  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: de
  text: In all ihrer Bedrängnis war er kein Gegner[a], und der Engel seiner Gegenwart rettete sie. In seiner Liebe und seinem Erbarmen erlöste er sie; er nahm sie auf und trug sie an allen Tagen der Vorzeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine alte Alternativlesart lautet: „In all ihrer Bedrängnis war er bedrängt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: In all ihrer Bedrängnis
  rationale: Die Wendung bezeichnet umfassend die Notlage des Volkes. „Bedrängnis“ wahrt den situativen und emotionalen Gehalt von צָרָה.
- source_word: לא צָר
  choice: war er nicht bedrängt
  rationale: Der Haupttext folgt der vorgelegten masoretischen Schreibung לֹא („nicht“) und bewahrt die auffällige Spannung des hebräischen Wortlauts, statt stillschweigend der alten Alternativlesart zu folgen.
- source_word: וּמַלְאַךְ פָּנָיו
  choice: und der Engel seiner Gegenwart
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten; hier ist „Engel“ kontextuell angemessen. פָּנָיו bezeichnet wörtlich sein Angesicht und idiomatisch seine persönliche Gegenwart.
- source_word: הוֹשִׁיעָם
  choice: rettete sie
  rationale: Die Hifil-Form von ישׁע bezeichnet wirksame Rettung oder Befreiung; „rettete“ ist prägnant und theologisch nicht einengend.
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: In seiner Liebe und seinem Erbarmen
  rationale: Die Präposition ב bezeichnet hier den begleitenden Beweggrund. „Erbarmen“ gibt חֶמְלָה in würdigem, geläufigem Deutsch wieder.
- source_word: הוּא גְאָלָם
  choice: er erlöste sie
  rationale: גאל bezeichnet das Loskaufen beziehungsweise befreiende Zurückgewinnen; „erlöste“ bewahrt den charakteristischen Gehalt des Verbs.
- source_word: וַיְנַטְּלֵם וַיְנַשְּׂאֵם
  choice: er nahm sie auf und trug sie
  rationale: 'Die beiden Verben werden unterschieden: נטל bezeichnet das Aufnehmen oder Hochheben, נשׂא das Tragen.'
- source_word: כָּל יְמֵי עוֹלָם
  choice: alle Tage der Vorzeit
  rationale: Im rückblickenden Zusammenhang bezeichnet עוֹלָם die ferne Vergangenheit, nicht notwendig die Ewigkeit.
theological_decisions:
- issue: Deutung von לא צָר
  choice: „war er nicht bedrängt“ nach der masoretischen Schreibung לֹא
  alternative: „war er bedrängt“ beziehungsweise „litt er mit ihnen“ nach der alten Alternativlesart לוֹ
  rationale: Die vorgelegte WLC-Schreibung enthält לֹא („nicht“). Da die abweichende Lesart alt, verbreitet und theologisch bedeutsam ist, wird sie nicht in den Haupttext übernommen, aber ausdrücklich in einer Fußnote dokumentiert.
- issue: Identität des מַלְאַךְ פָּנָיו
  choice: „der Engel seiner Gegenwart“ ohne weitergehende Identifizierung
  alternative: Eine ausdrückliche Gleichsetzung mit einer bestimmten göttlichen Person
  rationale: Der Text spricht vom Engel beziehungsweise Boten der göttlichen Gegenwart, legt aber keine weitergehende dogmatische Identifizierung ausdrücklich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung „Bedrängnis … bedrängt“ bildet das hebräische Wortspiel und seine inhaltliche Spannung bewusst ab; die Satzstruktur bleibt klar und gut vorlesbar.
