source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: de
  text: Denn du bist unser Vater, auch wenn Abraham uns nicht kennt und Israel uns nicht anerkennt. Du, Jahwe, bist unser Vater; unser Erlöser von alters her ist dein Name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Israel“ meint hier im Parallelismus mit Abraham wahrscheinlich den Erzvater Jakob. Statt „von alters her“ kann מֵעוֹלָם auch „von Ewigkeit her“ bedeuten.
    reason: Mehrdeutigkeit und wahrscheinlicher Bezug des hebräischen Textes
lexical_decisions:
- source_word: כִּי
  choice: Denn … ja
  rationale: Das erste כִּי begründet die vorausgehende Bitte und wird mit „Denn“ wiedergegeben; das zweite verstärkt den Gegensatz und klingt im Deutschen mit „ja“ natürlich.
- source_word: אָבִינוּ
  choice: unser Vater
  rationale: Die Anrede bezeichnet Gott in einer persönlichen und gemeinschaftlichen Beziehung, nicht bloß als Ahnherrn.
- source_word: יְדָעָנוּ
  choice: kennt uns nicht
  rationale: Die Grundbedeutung von ידע bleibt erhalten und bezeichnet hier fehlende persönliche Kenntnis beziehungsweise Anerkennung.
- source_word: יַכִּירָנוּ
  choice: erkennt uns nicht an
  rationale: Der Hifil von נכר bezeichnet Erkennen oder Anerkennen. „Erkennt … nicht an“ bewahrt gegenüber „kennt“ die feine Unterscheidung der parallelen Verben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name bleibt unaufgelöst; im Parallelismus mit Abraham ist wahrscheinlich der Erzvater Jakob gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גֹּאֲלֵנוּ
  choice: unser Erlöser
  rationale: גאל bezeichnet das rettende Einlösen oder Befreien und kann verwandtschaftliche Pflichten mitschwingen lassen; „Erlöser“ ist hier die knappe, natürliche Entsprechung.
- source_word: מֵעוֹלָם
  choice: seit alters her
  rationale: Die Wendung kann ferne Vorzeit oder immerwährende Dauer bezeichnen. „Seit alters her“ wahrt die zeitliche Tiefe, ohne die stärkere Lesart „von Ewigkeit her“ festzuschreiben.
- source_word: שְׁמֶךָ
  choice: ist dein Name
  rationale: Die hebräische Nominalklausel wird im Deutschen mit der Kopula ausgedrückt; „Name“ umfasst Benennung, Ruf und offenbarte Identität.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Bedeutung von מֵעוֹלָם
  choice: seit alters her
  alternative: von Ewigkeit her
  rationale: עוֹלָם kann sowohl unabsehbare Vorzeit als auch ewige Dauer ausdrücken. Der Haupttext entscheidet sich für die kontextuell zurückhaltendere Formulierung; die stärkere traditionelle Lesart wird in der Fußnote bewahrt.
- issue: Bezug von „Israel“
  choice: Der Name bleibt im Haupttext unkommentiert
  alternative: Jakob
  rationale: Der Parallelismus mit Abraham legt den Erzvater Jakob nahe, doch der Text sagt „Israel“. Die Übersetzung bewahrt den Wortlaut und erläutert den wahrscheinlichen Bezug in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Gebetsklang. Die Wiederholung „unser Vater“ bleibt als rhetorische Struktur erhalten. Die Anführungszeichen markieren die prädikative Namensaussage und erleichtern das Verständnis, ohne den Sinn festzulegen.
