  text: פּוּרָ֣ה דָּרַ֣כְתִּי לְ/בַדִּ֗/י וּ/מֵֽ/עַמִּים֙ אֵֽין אִ֣ישׁ אִתִּ֔/י וְ/אֶדְרְכֵ֣/ם בְּ/אַפִּ֔/י וְ/אֶרְמְסֵ֖/ם בַּ/חֲמָתִ֑/י וְ/יֵ֤ז נִצְחָ/ם֙ עַל בְּגָדַ֔/י וְ/כָל מַלְבּוּשַׁ֖/י אֶגְאָֽלְתִּי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: de
  text: Die Kelter habe ich allein getreten, und von den Völkern war kein Mann bei mir[a]. Ich trat sie in meinem Zorn und zerstampfte sie in meinem Grimm. Ihr Lebenssaft spritzte auf meine Gewänder[b], und ich befleckte alle meine Kleider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand war bei mir.“ Wörtlich steht im Hebräischen: „Kein Mann war bei mir.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr Blut spritzte auf meine Gewänder.“ Der hebräische Ausdruck kann im Bild der Kelter an ausfließenden Traubensaft erinnern und zugleich das Blut der Gerichteten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוּרָה
  choice: Kelter
  rationale: Bezeichnet die Vorrichtung beziehungsweise den Ort zum Austreten von Trauben; „Kelter“ bewahrt das Weinbild knapp und würdig.
- source_word: דָּרַכְתִּי
  choice: habe ich … getreten
  rationale: Das Perfekt beschreibt die vollzogene Handlung; „treten“ entspricht dem Keltervorgang und lässt sich beim späteren Verb derselben Wurzel wiederholen.
- source_word: לְבַדִּי
  choice: allein
  rationale: Gibt die betonte, unbegleitete Handlung natürlich und präzise wieder.
- source_word: וּמֵעַמִּים
  choice: und von den Völkern
  rationale: Bewahrt sowohl die Präposition מן als auch den Plural von עַם, ohne ihn vorschnell als „Nationen“ zu deuten.
- source_word: אֵין אִישׁ אִתִּי
  choice: war kein Mann bei mir
  rationale: Gibt das konkrete אִישׁ formal wieder; die im Deutschen idiomatischere Möglichkeit „niemand“ steht in der Fußnote.
- source_word: וְאֶדְרְכֵם
  choice: Ich trat sie
  rationale: Wiederholt entsprechend dem Hebräischen dieselbe Wurzel wie beim Treten der Kelter und macht so die Völker zum Gegenstand des Kelterbildes.
- source_word: בְּאַפִּי
  choice: in meinem Zorn
  rationale: אַף bezeichnet idiomatisch Zorn; die Wiedergabe ist natürlich und bewahrt die persönliche Intensität.
- source_word: וְאֶרְמְסֵם
  choice: und zerstampfte sie
  rationale: רמס steigert das Bild des Niedertretens; „zerstampfen“ ist kräftig und unterscheidet sich vom vorausgehenden „treten“.
- source_word: בַּחֲמָתִי
  choice: in meinem Grimm
  rationale: „Grimm“ bewahrt den heftigen, glühenden Charakter von חֵמָה und variiert gegenüber „Zorn“.
- source_word: וְיֵז
  choice: spritzte
  rationale: Das Verb bezeichnet das Herausspritzen einer Flüssigkeit und passt sowohl zum Traubensaft als auch zum Blutbild.
- source_word: נִצְחָם
  choice: ihr Lebenssaft
  rationale: Der seltene Ausdruck kann im Kelterbild den ausfließenden Saft anklingen lassen und zugleich auf das Blut der Gerichteten verweisen; „Lebenssaft“ erhält diese Doppelwirkung.
- source_word: בְּגָדַי / מַלְבּוּשַׁי
  choice: meine Gewänder / alle meine Kleider
  rationale: Die beiden deutschen Begriffe bilden den hebräischen Wechsel natürlich ab und wahren den gehobenen poetischen Ton.
- source_word: אֶגְאָלְתִּי
  choice: ich befleckte
  rationale: Das Verb bezeichnet hier das Verunreinigen oder Beflecken der Kleidung durch die verspritzte Flüssigkeit.
theological_decisions:
- issue: Bild des göttlichen Kriegers und Gerichts
  choice: Die Ich-Rede sowie das gewaltsame Kelterbild und die Zornessprache bleiben ungemildert erhalten.
  alternative: Das Bild lediglich als abstrakten Sieg wiederzugeben oder die persönliche Zornessprache abzuschwächen.
  rationale: Der hebräische Text schildert das einsame Gericht in bewusst drastischer Bildsprache. Die Übersetzung bewahrt diese theologische Spannung, ohne eine konfessionelle oder christologische Deutung einzutragen.
- issue: Masculines Singularwort אִישׁ
  choice: Im Haupttext steht „kein Mann“.
  alternative: „niemand“
  rationale: „Kein Mann“ bildet die konkrete Form des Ausgangstextes ab; die idiomatische, geschlechtsübergreifende Wiedergabe wird als echte Übersetzungsalternative in der Fußnote genannt.
- issue: Mehrdeutigkeit von נִצְחָם
  choice: „Lebenssaft“ erhält die Überlagerung von Traubensaft und Blut.
  alternative: „Blut“ oder „Saft“
  rationale: Eine eindeutige Festlegung würde entweder das Kelterbild oder dessen gewaltsamen Gerichtsbezug verflachen. Die Fußnote macht die Alternative ausdrücklich.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Kraft. Die Satzfolge folgt der hebräischen Parallelstruktur; „Kelter“, „Gewänder“ und „Grimm“ halten den gehobenen Ton, ohne altertümliche Formen zu verwenden.
