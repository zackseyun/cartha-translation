translation:
  language: de
  text: Er führte sie durch die Tiefen[a]. Sie stolperten nicht wie ein Pferd in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch die tiefen Wasser«. Im Hebräischen steht »durch die Tiefen«; die Formulierung erinnert an den Durchzug beim Auszug aus Ägypten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיכָם
  choice: Er führte sie
  rationale: Das Hifil-Partizip von הלך mit dem Suffix der 3. Person Plural beschreibt die fortdauernde Führung in der Rückschau. Im deutschen Satzzusammenhang gibt ein finites Präteritum den vergangenen Vorgang natürlich und klar wieder.
- source_word: בַּתְּהֹמוֹת
  choice: durch die Tiefen
  rationale: Der Plural von תְּהוֹם bezeichnet Tiefen, häufig Wassertiefen. „Durch“ bringt in Verbindung mit dem Verb der Bewegung den Weg durch diese Tiefen zum Ausdruck, ohne „Meer“ ausdrücklich in den Text einzutragen.
- source_word: כַּסּוּס
  choice: Wie ein Pferd
  rationale: Das singularische סוּס mit vergleichendem כ wird im Deutschen idiomatisch mit einem unbestimmten Singular wiedergegeben.
- source_word: בַּמִּדְבָּר
  choice: in der Steppe
  rationale: מִדְבָּר bezeichnet unbewohntes, offenes und oft trockenes Land. „Steppe“ macht das Bild eines Pferdes auf freiem, ebenem Gelände im modernen Deutsch anschaulich, ohne ausschließlich eine Sandwüste nahezulegen.
- source_word: לֹא יִכָּשֵׁלוּ
  choice: stolperten sie nicht
  rationale: Das Nifal von כשל bedeutet „stolpern, straucheln“. Die selbstständige Aussage wahrt die hebräische Satzform und fügt keine ausdrücklich markierte Folgebeziehung hinzu.
theological_decisions:
- issue: Bild des Weges beim Exodus durch das Meer
  choice: „durch die Tiefen“ ohne ausdrückliche Ergänzung von „Meer“
  alternative: „durch das Meer“ oder „durch die tiefen Wasser“
  rationale: Der Kontext erinnert deutlich an den Auszug aus Ägypten und die Meerquerung. Das hebräische תְּהוֹמוֹת ist jedoch weiter gefasst; die gewählte Formulierung bewahrt sowohl den Exodus-Anklang als auch die Bildweite des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzfolge wahrt die poetische Bewegung. „Steppe“ ist hier natürlicher und bildlich präziser als das möglicherweise an Sanddünen denken lassende „Wüste“.
