  variant: modern standard German
source:
  edition: WLC
  text: לָ֣/מָּה תַתְעֵ֤/נוּ יְהוָה֙ מִ/דְּרָכֶ֔י/ךָ תַּקְשִׁ֥יחַ לִבֵּ֖/נוּ מִ/יִּרְאָתֶ֑/ךָ שׁ֚וּב לְמַ֣עַן עֲבָדֶ֔י/ךָ שִׁבְטֵ֖י נַחֲלָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: de
  text: Warum bringst du uns, Jahwe, von deinen Wegen ab[a] und verhärtest unser Herz, sodass wir dich nicht fürchten? Kehre zurück[b] um deiner Diener willen, der Stämme, die dein Erbbesitz sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „führst du uns von deinen Wegen weg“ oder „lässt du zu, dass wir abirren“. Das hebräische Verb ist kausativ und lässt die Spannung zwischen Gottes souveränem Handeln und dem Abirren des Volkes stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Wende dich wieder zu“. Gemeint ist die Bitte, dass Gott sich seinem Volk erneut zuwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Gibt die unmittelbare Klagefrage schlicht und ohne zusätzliche Verstärkung wieder.
- source_word: תַתְעֵנוּ
  choice: lässt du uns … abirren
  rationale: Das Hifil ist kausativ. Die deutsche Konstruktion mit „lassen“ kann tatsächliches Verursachen wie auch Zulassen bezeichnen und bewahrt damit die im Kontext bestehende Spannung, ohne Gottes Handeln als moralische Irreführung zu formulieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִדְּרָכֶיךָ
  choice: von deinen Wegen
  rationale: Die Präposition מן bezeichnet hier die Entfernung beziehungsweise Abwendung von Gottes Wegen.
- source_word: תַּקְשִׁיחַ
  choice: verhärtest
  rationale: Entspricht dem kausativen Sinn „hart machen“ und ist für das Herz im Deutschen idiomatisch.
- source_word: לִבֵּנוּ
  choice: unser Herz
  rationale: Bewahrt den hebräischen kollektiven Singular und stellt das Volk als Gemeinschaft dar.
- source_word: מִיִּרְאָתֶךָ
  choice: sodass wir dich nicht fürchten
  rationale: Gibt die durch die Verhärtung entstehende Entfernung von der Gottesfurcht in natürlichem Deutsch wieder.
- source_word: שׁוּב
  choice: Kehre zurück
  rationale: Bewahrt die direkte Bitte an Gott, sich seinem Volk wieder zuzuwenden.
- source_word: לְמַעַן
  choice: um … willen
  rationale: Drückt den Beweggrund der Bitte aus und passt zum gehobenen Gebetsregister.
- source_word: עֲבָדֶיךָ
  choice: deiner Diener
  rationale: „Diener“ entspricht dem Bundes- und Gebetskontext besser als „Sklaven“.
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  choice: der Stämme deines Erbbesitzes
  rationale: Gibt die israelitischen Stämme und ihre Zugehörigkeit zu Jahwe als seinem zugeteilten Besitz eng am Hebräischen wieder.
theological_decisions:
- issue: Göttliche Verursachung beim Abirren und bei der Verhärtung
  choice: Die direkte Anrede und Zuschreibung an Jahwe bleibt erhalten.
  alternative: 'Permissiv abschwächen: „Warum erlaubst du, dass wir abirren und unser Herz hart wird?“'
  rationale: Beide hebräischen Verben stehen im Hifil. Die Klage schreibt das Geschehen kühn Gott zu; eine rein permissive Umschreibung würde die theologische Spannung vorschnell auflösen. „lässt … abirren“ bleibt im Deutschen bewusst offen zwischen Veranlassen und Zulassen, während „verhärtest“ die zweite Kausativform ausdrücklich wiedergibt.
- issue: Kollektiver Singular „unser Herz“
  choice: Singular beibehalten
  alternative: „unsere Herzen“
  rationale: לִבֵּנוּ ist morphologisch Singular mit pluralischem Possessivsuffix. Der Singular unterstreicht die gemeinsame innere Haltung des Volkes.
- issue: Bedeutung der Rückkehr Gottes
  choice: „Kehre zurück“ ohne erklärenden Zusatz
  alternative: „Wende dich uns wieder gnädig zu“
  rationale: Der knappe Imperativ bewahrt sowohl das Bild räumlicher Rückkehr als auch die bundesbezogene Bitte um erneute Zuwendung.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Gottesname wird als „Jahwe“ wiedergegeben. Der kollektive Singular „unser Herz“ ist bewusst quellentreu; die Wiederholung „um … willen“ macht die appositionale Schlusswendung im Deutschen klar und rhythmisch.
