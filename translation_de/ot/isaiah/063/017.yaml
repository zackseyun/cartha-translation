  to: Warum bringst du uns, Jahwe, von deinen Wegen ab[a] und verhärtest unser Herz, sodass wir dich nicht fürchten? Kehre zurück[b] um deiner Diener willen, der Stämme, die dein Erbbesitz sind.
  rationale: Die erste Verbform wird eindeutig kausativ wiedergegeben, ohne die im hebräischen Klagegebet bestehende theologische Spannung zu erklären oder abzuschwächen. Die Schlussphrase wird als im Hebräischen vorliegende Apposition formuliert; dadurch entfällt die nicht vorhandene zweite Präposition, und die Beziehung der Stämme zu Gottes Erbbesitz wird verständlich ausgedrückt. Die Fußnote zu [a] wird an die neue Hauptformulierung angepasst.
