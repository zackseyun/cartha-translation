source:
  edition: WLC
  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: de
  text: Ich will von der beständigen Liebe Jahwes erzählen, von den Ruhmestaten[a] Jahwes, entsprechend allem, was Jahwe uns erwiesen hat[b], und von der großen Güte gegenüber dem Haus Israel, die er ihnen erwiesen hat – gemäß seinem Erbarmen und der Fülle seiner beständigen Liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Lobpreisungen Jahwes“. Das hebräische Wort kann sowohl Lobpreisungen als auch Taten bezeichnen, die Lob verdienen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was Jahwe uns Gutes getan hat“ beziehungsweise „wie reich Jahwe uns beschenkt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: beständige Liebe
  rationale: חסד bezeichnet hier verlässliche, loyale und oft bundestreue Liebe. „Beständige Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Dauerhaftigkeit und lässt die Mehrzahl im Hebräischen als Sammelbegriff natürlich deutsch erscheinen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אַזְכִּיר
  choice: ich will … erzählen
  rationale: Der Hifil von זכר meint im Lobkontext nicht nur inneres Erinnern, sondern das erwähnende, verkündende Vergegenwärtigen.
- source_word: תְּהִלֹּת
  choice: Ruhmestaten
  rationale: Der Plural kann Lobpreisungen oder das Lob hervorrufende Taten bezeichnen. „Ruhmestaten“ passt zu den anschließend entfalteten Wohltaten und ist im Deutschen natürlicher als „Lobpreisungen“.
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: entsprechend allem, was
  rationale: Die schwierige Verbindung bezeichnet Maß beziehungsweise Grundlage des Erzählens und Lobens; die Wiedergabe hält diese Nuance offen.
- source_word: גְּמָלָנוּ / גְּמָלָם
  choice: uns / ihnen erwiesen hat
  rationale: גמל bezeichnet kontextabhängig ein Vergelten, Handeln oder Erweisen. Wegen des eindeutig wohltätigen Zusammenhangs ist „erweisen“ treffend, ohne den Begriff unnötig zu verengen.
- source_word: וְרַב טוּב
  choice: die große Güte
  rationale: Die Formulierung bewahrt die Intensität von רַב und gibt טוּב natürlich als Gottes wohltätige Güte wieder.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: gegenüber dem Haus Israel
  rationale: „Haus Israel“ bleibt als kollektive Bundesbezeichnung erhalten; „gegenüber“ verbindet sich idiomatisch mit der erwiesenen Güte.
- source_word: כְּרַחֲמָיו
  choice: gemäß seinem Erbarmen
  rationale: רחמים bezeichnet tiefes, zugewandtes Mitgefühl beziehungsweise Erbarmen; der deutsche Singular ist als Kollektivbegriff natürlich.
- source_word: וּכְרֹב חֲסָדָיו
  choice: und der Fülle seiner beständigen Liebe
  rationale: רֹב hebt die große Menge beziehungsweise Fülle hervor; die erneute Wiedergabe von חסד mit „beständige Liebe“ erhält die lexikalische Verbindung innerhalb des Verses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Transliteration bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חסד
  choice: beständige Liebe
  alternative: Gnade; Bundestreue; Barmherzigkeit
  rationale: „Beständige Liebe“ wahrt die relationale, loyale und dauerhafte Bedeutung, ohne den Ausdruck ausschließlich auf einen einzelnen theologischen Aspekt festzulegen.
- issue: Deutung von תְּהִלֹּת
  choice: Ruhmestaten
  alternative: Lobpreisungen
  rationale: Der Kontext nennt Gottes wohltätiges Handeln als Gegenstand des Erzählens. „Ruhmestaten“ ist daher wahrscheinlich, während die mögliche Bedeutung „Lobpreisungen“ in einer Fußnote erhalten bleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Satzfluss. Die auffällige Verschiebung von „uns“ zu „ihnen“ im hebräischen Text bleibt erhalten. Wiederholungen zentraler Begriffe werden weitgehend bewahrt; die Mehrzahlformen von חסד und רחמים werden idiomatisch als deutsche Kollektivsingulare wiedergegeben.
