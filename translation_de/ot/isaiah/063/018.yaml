base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: de
  text: Dein heiliges Volk besaß es[b] nur kurze Zeit[a]; unsere Feinde zertraten dein Heiligtum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für kurze Zeit“ beziehungsweise „in geringem Maß“. Der hebräische Ausdruck kann Kürze oder einen geringen Umfang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht bei „besaß“ kein Objekt. Gemeint ist dem Zusammenhang nach wahrscheinlich das Land oder Erbteil, nicht zwingend das im nächsten Satzteil genannte Heiligtum.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: nur kurze Zeit
  rationale: מִצְעָר bezeichnet etwas Geringes oder Kurzes; mit לְ ist die Wendung hier am natürlichsten temporal zu verstehen. „Nur kurze Zeit“ gibt die Kürze und den klagenden Ton idiomatisch wieder, ohne die ebenfalls mögliche Vorstellung eines geringen Maßes zu verschweigen.
- source_word: יָרְשׁוּ
  choice: nahm … es in Besitz
  rationale: ירשׁ kann „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten. Der Kontext blickt auf die begrenzte Inbesitznahme des Landes beziehungsweise Erbteils; „in Besitz nehmen“ ist im Deutschen natürlich, während das ergänzte „es“ den im Hebräischen unausgedrückten Gegenstand offenhält.
- source_word: עַם קָדְשֶׁךָ
  choice: dein heiliges Volk
  rationale: Die Konstruktion bedeutet wörtlich „das Volk deiner Heiligkeit“. „Dein heiliges Volk“ bewahrt sowohl die Zugehörigkeit zu Gott als auch die Heiligung des Volkes in klarem modernem Deutsch.
- source_word: צָרֵינוּ
  choice: unsere Feinde
  rationale: צַר bezeichnet einen Gegner oder Feind. „Feinde“ ist verständlich, prägnant und entspricht dem feindlichen Handeln im zweiten Halbvers.
- source_word: בּוֹסְסוּ
  choice: zertraten
  rationale: בוס bezeichnet das Treten oder Niedertrampeln. „Zertraten“ vermittelt sowohl die gewaltsame Verwüstung als auch die Entweihung des heiligen Ortes.
- source_word: מִקְדָּשֶׁךָ
  choice: dein Heiligtum
  rationale: מִקְדָּשׁ ist ein heiliger Ort beziehungsweise ein Heiligtum. „Heiligtum“ wahrt die räumlich-sakrale Bedeutung, ohne den Ausdruck unnötig auf einen bestimmten architektonischen Begriff zu verengen.
theological_decisions:
- issue: Unausgedrücktes Objekt von יָרְשׁוּ
  choice: Das im Deutschen nötige Pronomen „es“ wird ergänzt und durch eine Fußnote als Ergänzung kenntlich gemacht; sein Bezug bleibt beim Land beziehungsweise Erbteil.
  alternative: „Dein heiliges Volk besaß dein Heiligtum nur kurze Zeit“ oder eine im Deutschen unvollständige Konstruktion ohne Objekt.
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Das anschließend eigens genannte Heiligtum sollte daher nicht ohne Kennzeichnung zum Objekt des ersten Halbverses gemacht werden. Das neutrale „es“ ergibt einen verständlichen deutschen Satz und bewahrt die kontextuelle Offenheit.
- issue: Bedeutung von לַמִּצְעָר
  choice: 'Temporal: „nur kurze Zeit“.'
  alternative: 'Quantitativ: „in geringem Maß“ oder allgemeiner „nur wenig“.'
  rationale: Die zeitliche Deutung passt am besten zur Klage darüber, dass das heilige Volk seinen Besitz nur kurz innehatte, bevor die Feinde das Heiligtum zertraten. Die mögliche Bedeutung eines geringen Maßes wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Klagegebet mit klarer Syntax. Das Präteritum hält die beiden abgeschlossenen Handlungen knapp zusammen; „Heiligtum“ bewahrt den sakralen Ton. Die Fußnoten machen sowohl die semantische Spannweite von לַמִּצְעָר als auch das im Hebräischen fehlende Objekt sichtbar.
