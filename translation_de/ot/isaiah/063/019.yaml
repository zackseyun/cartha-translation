  rationale: Die Revision ersetzt allein die missverständliche und wenig natürliche Wiedergabe der hebräischen Namensformel und glättet den damit verbundenen Relativsatz. Die zeitliche Verdichtung des ersten Satzes bleibt durch „nie“ im Haupttext und die alternative Lesemöglichkeit in der Fußnote erhalten. Das Theophanie-Bild und die offene, nicht kausal explizierte Beziehung des Schlusssatzes bleiben unverändert.
