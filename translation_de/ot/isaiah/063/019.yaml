  source_fidelity: 'Die Wiedergabe des ersten Satzes als gegenwärtig-resultativer Klagezustand ist möglich und die Wunschform im zweiten Satz trifft לוּא gut. „Zerfließen“ gibt נָזֹלּוּ als poetisches Bild angemessen wieder. Die Formulierung „dein Name ... ausgerufen wurde“ ist jedoch im Deutschen für die hebräische Namensformel missverständlich: Sie legt eine öffentliche Proklamation nahe, während die Formel hier Benennung bzw. Zugehörigkeit bezeichnet.'
