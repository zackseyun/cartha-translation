  terminology: „Nach deinem Namen genannt“ ist die etablierte und verständliche deutsche Entsprechung für die Namensformel, ohne eine konfessionelle Deutung einzutragen. Die Fußnote kann die wörtlichere Konstruktion und den möglichen Zugehörigkeitssinn dokumentieren.
