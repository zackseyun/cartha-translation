base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: de
  text: Wir sind wie solche geworden, über die du nie geherrscht hast,[a] die nie nach deinem Namen genannt wurden.[b] Ach, würdest du doch den Himmel aufreißen und herabkommen! Vor dir würden die Berge zerfließen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist verkürzt und kann auch wörtlicher verstanden werden: „Wir waren seit jeher solche, über die du nicht geherrscht hast.“'
    reason: textual_ambiguity
  - marker: b
    text: 'Wörtlich: „über die dein Name nicht ausgerufen wurde“. Die Formel kann auch ihre Benennung oder Zugehörigkeit zu Gott ausdrücken.'
    reason: idiom
  - marker: c
    text: 'Oder: „schmelzen“; sinngemäß auch: „erbeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ מֵעוֹלָם לֹא מָשַׁלְתָּ בָּם
  choice: Wir sind wie Menschen geworden, über die du nie geherrscht hast
  rationale: Der hebräische Satz ist stark verdichtet. „Sind ... geworden“ gibt den aus der Vergangenheit hervorgegangenen gegenwärtigen Zustand wieder; „wie Menschen“ macht den im Vergleich vorausgesetzten Bezug verständlich. מֵעוֹלָם wird zusammen mit der Verneinung idiomatisch durch „nie“ wiedergegeben.
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: über denen dein Name nie ausgerufen wurde
  rationale: Die Formulierung bleibt nahe beim hebräischen Passiv und bewahrt sowohl die Vorstellung der Benennung als auch die damit verbundene Zugehörigkeit, ohne diese im Haupttext auszudeuten.
- source_word: לוּא קָרַעְתָּ שָׁמַיִם יָרַדְתָּ
  choice: Ach, würdest du doch den Himmel aufreißen und herabkommen!
  rationale: לוּא leitet einen dringlichen Wunsch ein. „Aufreißen“ bewahrt das kräftige Bild von קרע, während die deutsche Wunschform die modale Funktion der hebräischen Perfektformen ausdrückt.
- source_word: מִפָּנֶיךָ
  choice: Vor dir
  rationale: Die knappe Wiedergabe entspricht dem räumlich-präsentischen Bild von Gottes Angesicht beziehungsweise Gegenwart und lässt den genauen Wirkungszusammenhang offen.
- source_word: הָרִים נָזֹלּוּ
  choice: die Berge zerfließen
  rationale: נזל bezeichnet grundsätzlich Fließen. „Zerfließen“ bewahrt das poetische Bild vom Auflösen oder Schmelzen der Berge genauer als die interpretierende Wiedergabe „erbeben“.
theological_decisions:
- issue: Zugehörigkeit durch das Ausrufen des göttlichen Namens
  choice: Das hebräische Bild im Haupttext als „über denen dein Name ... ausgerufen wurde“ bewahren
  alternative: „die nie nach deinem Namen genannt wurden“
  rationale: Die wörtlichere Form lässt offen, ob Benennung, Inanspruchnahme oder Bundeszugehörigkeit im Vordergrund steht, und legt keine einzelne theologische Ausdeutung fest.
- issue: Reaktion der Berge auf Gottes Herabkommen
  choice: „zerfließen“
  alternative: „erbeben“ oder „schmelzen“
  rationale: Die Grundbedeutung des Verbs und das eindringliche Theophanie-Bild werden bewahrt; mögliche bildhafte Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klagendem Gebetston. Die starke Wunschform wird durch „Ach, würdest du doch ...“ natürlich wiedergegeben. Die verdichtete Syntax des ersten Halbverses wird vorsichtig entfaltet; die poetische Bildsprache des Schlusses bleibt erhalten.
