base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
translation:
  language: de
  text: Ich zertrat Völker in meinem Zorn; ich machte sie trunken in meinem Grimm und brachte ihren Lebenssaft[a] zur Erde hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes ist hier unsicher; möglich sind auch „ihr Blut“, „ihr Saft“, „ihre Kraft“ oder „ihre Herrlichkeit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּס
  choice: ich zertrat
  rationale: Das Verb בוס bezeichnet das Niedertreten oder Zertreten. „Zertrat“ bewahrt das gewaltsame Bild und klingt im Deutschen natürlich.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural von עַם bezeichnet hier Völker; „Völker“ ist im Deutschen idiomatisch und meint keine modernen Nationalstaaten.
- source_word: בְּאַפִּי
  choice: in meinem Zorn
  rationale: אַף bedeutet wörtlich „Nase/Nüstern“, bezeichnet idiomatisch jedoch Zorn.
- source_word: וַאֲשַׁכְּרֵם
  choice: ich machte sie trunken
  rationale: Der Piel von שׁכר bedeutet „betrunken/trunken machen“ und führt zugleich die Keltermetaphorik fort.
- source_word: בַּחֲמָתִי
  choice: in meinem Grimm
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm. „Grimm“ unterscheidet den Ausdruck von אַף und erhält den gehobenen Ton.
- source_word: וְאוֹרִיד
  choice: und ließ ... zur Erde fließen
  rationale: Der Hifil von ירד bedeutet wörtlich „hinabbringen“. Mit dem als Flüssigkeit verstandenen Objekt gibt „ließ ... zur Erde fließen“ die Bewegung idiomatisch wieder, ohne das Kelterbild aufzugeben.
- source_word: לָאָרֶץ
  choice: zur Erde
  rationale: לָאָרֶץ bezeichnet die Richtung zur Erde beziehungsweise zum Boden.
- source_word: נִצְחָם
  choice: ihren Lebenssaft
  rationale: נִצְחָם ist an dieser Stelle unsicher. „Lebenssaft“ wahrt die Überlagerung von ausgepresstem Saft und Blut im Gerichtsbild, ohne die Mehrdeutigkeit vollständig auf eine einzige Bedeutung festzulegen.
theological_decisions:
- issue: Gewaltsames göttliches Gericht in der Keltermetaphorik
  choice: Das Niedertreten, Trunkenmachen und Herabfließen des Lebenssaftes wird als zusammenhängendes Gerichtsbild wiedergegeben.
  alternative: „Ihr Blut“ würde das Ergebnis des Gerichts eindeutiger benennen; „ihren Saft“ würde das Kelterbild enger abbilden.
  rationale: Der hebräische Text verbindet Kelter- und Blutvergießensbilder. Die Übersetzung erhält diese Spannung, ohne das Gericht abzuschwächen oder zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus „Zorn/Grimm“ bleibt erhalten; „trunken“ und „Lebenssaft“ tragen den poetischen Ton und die Keltermetaphorik.
