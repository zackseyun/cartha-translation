- from: Ich zertrat Völker in meinem Zorn; ich machte sie trunken in meinem Grimm und ließ ihren Lebenssaft[a] zur Erde fließen.
  to: Ich zertrat Völker in meinem Zorn; ich machte sie trunken in meinem Grimm und brachte ihren Lebenssaft[a] zur Erde hinab.
  rationale: Die Revision ersetzt nur die interpretativ stärkere Wendung „ließ … fließen“ durch „brachte … hinab“. Dadurch wird die kausative Bewegungsbedeutung von ירד und die Richtungsangabe „zur Erde“ genauer wiedergegeben, ohne die im Kontext naheliegende Kelter- und Blutbildlichkeit oder die lexikalische Unsicherheit von נִצְחָם aufzulösen.
