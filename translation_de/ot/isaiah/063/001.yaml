revisions:
- from: Wer ist dieser, der aus Edom kommt, aus Bozra, dessen Kleider rot gefärbt sind[a]? Dieser, prächtig in seinem Gewand, der in der Fülle seiner Kraft einherschreitet[b]? »Ich bin es, der in Gerechtigkeit[c] redet, mächtig zu retten.«
  to: Wer ist dieser, der aus Edom kommt, mit rot gefärbten Kleidern aus Bozra[a], prächtig in seinem Gewand, einherschreitend in der Fülle seiner Kraft[b]? »Ich bin es, der in Gerechtigkeit[c] redet, mächtig zu retten.«
  rationale: Die Revision stellt die hebräische Verbindung der rot gefärbten Kleider mit Bozra klar heraus und glättet die Frage zu einer im modernen Deutschen natürlichen, dennoch feierlichen Einheit. Die Identität des Sprechers bleibt ebenso unausgesprochen wie im Ausgangstext. Die Fußnoten bewahren lexikalische und semantische Alternativen, ohne eine Ursache der roten Färbung oder eine theologische Deutung vorwegzunehmen.
