source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: de
  text: Wer ist dieser, der aus Edom kommt, mit rot gefärbten Kleidern aus Bozra[a], prächtig in seinem Gewand, einherschreitend in der Fülle seiner Kraft[b]? »Ich bin es, der in Gerechtigkeit[c] redet, mächtig zu retten.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit rot befleckten Kleidern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: der in großer Kraft voranschreitet.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: der in Rechtschaffenheit redet; auch: der gerecht redet.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: חֲמוּץ בְּגָדִים
  choice: dessen Kleider rot gefärbt sind
  rationale: Die Wendung beschreibt die Kleidung als rot geworden oder rot gefärbt. Die Formulierung bewahrt das Farbbild, ohne in diesem Vers bereits festzulegen, wodurch die Färbung verursacht wurde.
- source_word: מֵאֱדוֹם
  choice: aus Edom
  rationale: Der Eigenname bezeichnet das Land Edom und wird beibehalten.
- source_word: מִבָּצְרָה
  choice: aus Bozra
  rationale: Der Eigenname der edomitischen Stadt wird in geläufiger deutscher Form wiedergegeben.
- source_word: הָדוּר בִּלְבוּשׁוֹ
  choice: prächtig in seinem Gewand
  rationale: „Prächtig“ gibt die sichtbare, würdevolle Herrlichkeit wieder; „Gewand“ entspricht dem gehobenen prophetischen Register, ohne altertümlich zu wirken.
- source_word: צֹעֶה
  choice: einherschreitet
  rationale: Das seltene und schwierige Wort bezeichnet hier wahrscheinlich eine eindrucksvolle Bewegung. „Einherschreitet“ passt zum Bild der machtvollen Gestalt, ohne die genaue Bewegungsart zu stark festzulegen.
- source_word: בְּרֹב כֹּחוֹ
  choice: in der Fülle seiner Kraft
  rationale: Die Wiedergabe erhält sowohl den Gedanken der Größe oder Fülle als auch den der Kraft und bewahrt den feierlichen Parallelismus.
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: der in Gerechtigkeit redet
  rationale: Die Formulierung bewahrt die Präposition und die breite Bedeutung von צְדָקָה, die moralische Richtigkeit und gerichtliche Gerechtigkeit umfassen kann.
- source_word: רַב לְהוֹשִׁיעַ
  choice: mächtig zu retten
  rationale: Die idiomatische deutsche Wendung drückt die im Hebräischen bezeichnete große Fähigkeit und Macht zum Retten aus.
theological_decisions:
- issue: Identität des antwortenden Sprechers
  choice: Die Identität bleibt im Text unausgesprochen.
  alternative: Der HERR als göttlicher Krieger; eine messianische Gestalt; eine prophetische Personifikation
  rationale: Der hebräische Vers gestaltet einen dramatischen Dialog, nennt den Antwortenden aber nicht ausdrücklich. Die Übersetzung ergänzt daher keine bestimmte Identifikation.
- issue: Bedeutungsumfang von צְדָקָה
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: „Gerechtigkeit“ wahrt den breiten moralischen, gemeinschaftlichen und gerichtlichen Bedeutungsumfang. Die stärker forensische Nuance wird in einer Fußnote offengehalten.
translation_notes:
  register: Feierlicher, bildkräftiger und zugleich moderner prophetischer Stil. Die Frage-und-Antwort-Struktur bleibt erhalten. Seltene oder mehrdeutige Ausdrücke werden im Haupttext natürlich wiedergegeben und in den Fußnoten offengehalten.
