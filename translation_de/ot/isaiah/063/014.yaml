base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: de
  text: Wie Vieh, das in die Talebene hinabsteigt, brachte der Geist Jahwes[a] es zur Ruhe[b]. So hast du dein Volk geführt, um dir einen herrlichen Namen zu machen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Wind Jahwes“ beziehungsweise „der Atem Jahwes“. Das hebräische Wort רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb hat ein singularisches Suffix: „ihn zur Ruhe bringen“. Gemeint ist wahrscheinlich Israel als kollektiv verstandenes Volk; daher steht im Deutschen „es“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „einen Namen der Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: Wie Vieh
  rationale: בְּהֵמָה ist hier kollektiv gebraucht. „Vieh“ gibt den Vergleich im Deutschen natürlich wieder, ohne wilde Tiere nahezulegen.
- source_word: בַּבִּקְעָה
  choice: in die Talebene
  rationale: בִּקְעָה bezeichnet ein breites Tal oder eine Talebene. Zusammen mit ירד drückt „in die Talebene“ die Abwärtsbewegung aus.
- source_word: תֵרֵד
  choice: das … hinabzieht
  rationale: Das Imperfekt beschreibt im Vergleich den typischen Vorgang. „Hinabzieht“ ist für eine Viehherde natürlich und bewahrt die Bewegungsrichtung.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten; im Zusammenhang göttlicher Führung und Ruhe ist „Geist“ am wahrscheinlichsten. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: תְּנִיחֶנּוּ
  choice: brachte … es zur Ruhe
  rationale: Der Hifil von נוח bedeutet „zur Ruhe bringen“ oder „Ruhe verschaffen“. Das singularische Suffix wird durch „es“ bewahrt und auf das kollektiv verstandene Volk bezogen.
- source_word: כֵּן
  choice: So
  rationale: כֵּן leitet die Anwendung des vorausgehenden Vergleichs ein; „So“ ist knapp und idiomatisch.
- source_word: נִהַגְתָּ
  choice: hast du … geführt
  rationale: נהג bezeichnet hier das Führen oder Leiten und passt zum Rückblick auf Gottes Führung seines Volkes.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet im Bundeszusammenhang Gottes Volk und wird im Deutschen natürlich mit „Volk“ wiedergegeben.
- source_word: לַעֲשׂוֹת לְךָ
  choice: um dir … zu machen
  rationale: Die Infinitivkonstruktion bezeichnet Zweck oder Ergebnis; „um dir … zu machen“ bewahrt diese Offenheit hinreichend und folgt dem Dativ לְךָ.
- source_word: שֵׁם תִּפְאָרֶת
  choice: einen herrlichen Namen
  rationale: Die Konstruktverbindung bezeichnet einen durch Herrlichkeit, Pracht oder Ruhm gekennzeichneten Namen. „Einen herrlichen Namen“ ist verständlich und würdevoll.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: „der Geist Jahwes“
  alternative: „der Wind Jahwes“ oder „der Atem Jahwes“
  rationale: Das Wort רוּחַ bleibt lexikalisch mehrdeutig. Der Zusammenhang von göttlicher Führung und gewährter Ruhe legt hier „Geist“ nahe, ohne die anderen möglichen Bedeutungen zu verschweigen.
- issue: Bezug des singularischen Suffixes in תְּנִיחֶנּוּ
  choice: Das Singularpronomen wird als kollektiver Bezug auf Israel beziehungsweise das Volk bewahrt.
  alternative: 'Sinngemäße Pluralisierung: „brachte sie zur Ruhe“'
  rationale: Das hebräische Suffix steht eindeutig im Singular, während der Zusammenhang vom Volk als Gesamtheit spricht. Das deutsche Neutrum „es“ kann sich natürlich auf „Volk“ beziehen und bewahrt zugleich die Form des Ausgangstextes.
- issue: Zweck oder Ergebnis in לַעֲשׂוֹת לְךָ
  choice: 'Als Zweck formuliert: „um dir … zu machen“'
  alternative: 'Als Ergebnis: „sodass du dir … machtest“'
  rationale: Der Infinitiv kann Zweck oder Ergebnis ausdrücken. Die Zweckangabe passt syntaktisch gut, erhebt aber keinen weitergehenden dogmatischen Anspruch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Satzbau. „Jahwe“ bewahrt den persönlichen Gottesnamen. Die kollektive Bildsprache und die grammatische Singularform werden erhalten, während Fußnoten echte lexikalische Alternativen ausweisen.
