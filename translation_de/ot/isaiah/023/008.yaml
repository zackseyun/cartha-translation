base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: de
  text: Wer hat dies gegen Tyrus, die Kronenverleiherin[a], beschlossen, deren Kaufleute Fürsten sind, deren Händler[b] zu den Angesehenen der Erde gehören?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Kronen Verleihende“. Gemeint sein kann, dass Tyrus Herrschern oder seinen Kolonien königlichen Rang beziehungsweise Reichtum verschaffte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deren Kanaaniter“. Das hebräische Wort kann in diesem Zusammenhang auch „Händler“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet die rhetorische Frage ein.
- source_word: יָעַץ
  choice: hat beschlossen
  rationale: Das Verb bezeichnet beraten, planen oder einen Entschluss fassen; „beschlossen“ gibt hier den zielgerichteten Plan gegen Tyrus natürlich und prägnant wieder.
- source_word: זֹאת
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf das zuvor angekündigte Gericht über Tyrus.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang des Gerichts bezeichnet die Präposition die feindliche Ausrichtung des Beschlusses.
- source_word: צֹר
  choice: Tyrus
  rationale: Eingebürgerte deutsche Form des Stadtnamens.
- source_word: הַמַּעֲטִירָה
  choice: die Kronenverleiherin
  rationale: Das feminine Partizip von עטר stellt Tyrus als eine dar, die Kronen verleiht. Die ungewöhnliche, aber verständliche Wiedergabe bewahrt die aktive Metapher des Hebräischen.
- source_word: סֹחֲרֶיהָ
  choice: deren Kaufleute
  rationale: Bezeichnet die im Handel tätigen Angehörigen von Tyrus; „Kaufleute“ passt zum gehobenen wirtschaftlichen Bild.
- source_word: שָׂרִים
  choice: Fürsten waren
  rationale: שָׂרִים bezeichnet Fürsten oder hochgestellte Amtsträger. Das ergänzte „waren“ macht die nominale Aussage im Deutschen natürlich.
- source_word: כִּנְעָנֶיהָ
  choice: deren Händler
  rationale: Wörtlich „ihre Kanaaniter“; im Handelskontext kann כְּנַעֲנִי metonymisch „Händler“ bedeuten. Die Fußnote bewahrt die formale ethnische Lesart.
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: zu den Geehrten der Erde gehörten
  rationale: Die Wendung bezeichnet angesehene, gesellschaftlich gewichtige Menschen. „Erde“ unterstreicht die überregionale Bedeutung von Tyrus; die verbale Fassung ergibt natürliches Deutsch.
