  terminology: „Yahweh“ gibt יהוה konsequent wieder. „Handelsertrag“ ist gegenüber „Handelsgewinn“ die etwas weniger einengende Wiedergabe von סַחְרָהּ und wahrt den Bezug sowohl auf Handel als auch auf dessen Ertrag. „Lohn“ ist für אֶתְנַנָּהּ möglich; die mögliche prostitutionsbezogene Konnotation gehört in die Fußnote. Die Fußnotenanker sollen unmittelbar bei den jeweils erläuterten Ausdrücken stehen.
