  text: וְ/הָיָ֨ה סַחְרָ֜/הּ וְ/אֶתְנַנָּ֗/הּ קֹ֚דֶשׁ לַֽ/יהוָ֔ה לֹ֥א יֵֽאָצֵ֖ר וְ/לֹ֣א יֵֽחָסֵ֑ן כִּ֣י לַ/יֹּשְׁבִ֞ים לִ/פְנֵ֤י יְהוָה֙ יִֽהְיֶ֣ה סַחְרָ֔/הּ לֶ/אֱכֹ֥ל לְ/שָׂבְעָ֖ה וְ/לִ/מְכַסֶּ֥ה עָתִֽיק׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: de
  text: 'Und ihr Handelsertrag und ihr Lohn[a] werden Yahweh heilig sein. Sie werden weder angesammelt noch gehortet; denn ihr Handelsertrag wird für die sein, die vor Yahweh wohnen: zum Essen bis zur Sättigung und für dauerhafte Kleidung[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Lohn“ kann auch „Hurenlohn“ bedeuten und greift möglicherweise das Bild von Tyrus als Prostituierter in den vorhergehenden Versen auf.
    reason: lexical_alternative
  - marker: b
    text: 'Die letzte Wendung ist unsicher; auch möglich: „für kostbare Kleidung“, „für prächtige Kleidung“ oder „für reichliche Bedeckung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַחְרָהּ
  choice: ihr Handelsgewinn
  rationale: Das Substantiv bezeichnet Handel, Handelsware oder den daraus stammenden Ertrag. Im Zusammenhang mit Tyrus umfasst „Handelsgewinn“ sowohl die kommerzielle Tätigkeit als auch deren Erlös und passt als etwas, das angesammelt werden könnte.
- source_word: אֶתְנַנָּהּ
  choice: ihr Lohn
  rationale: אֶתְנַן bezeichnet eine Vergütung und kann besonders Hurenlohn meinen. „Lohn“ bewahrt die Anspielung auf die in Vers 15–17 verwendete Prostitutionsmetaphorik, ohne sie im Haupttext stärker auszudeuten als der Ausdruck selbst.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Yahweh heilig
  rationale: Die Wendung bezeichnet etwas, das Yahweh als heilig geweiht beziehungsweise vorbehalten ist. Die knappe Formulierung erhält den kultischen Gehalt; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: weder angesammelt noch gehortet
  rationale: Die beiden parallelen Verben beschreiben das Ansammeln und Verwahren von Besitz. Die differenzierte Wiedergabe erhält sowohl den Parallelismus als auch den Gedanken, dass der Ertrag nicht zurückgelegt wird.
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: denen zugutekommen, die vor Yahweh wohnen
  rationale: ישב bedeutet hier „wohnen/sich aufhalten“, während „vor Yahweh“ die räumliche oder kultische Nähe offenlässt. „zugutekommen“ gibt die durch ל markierte Bestimmung des Handelsgewinns natürlich wieder.
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: damit sie sich satt essen
  rationale: Die Wendung bezeichnet Essen bis zur Sättigung. Die idiomatische deutsche Form ist klar und erhält den Zweckgedanken.
- source_word: לִמְכַסֶּה עָתִיק
  choice: sich in kostbare Gewänder kleiden können
  rationale: מכסה bezeichnet eine Bedeckung oder Kleidung. Das seltene עתיק ist hier unsicher und kann auf vorzügliche beziehungsweise kostbare, reichliche oder dauerhafte Kleidung weisen. Die Haupttextfassung folgt der im Kontext von Versorgung und Wohlstand plausiblen Qualitätsbedeutung; die Unsicherheit bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter des Handelsertrags
  choice: Yahweh heilig
  alternative: für Yahweh bestimmt
  rationale: קֹדֶשׁ hat ausdrücklich sakralen Gehalt. Die Übersetzung bewahrt die Aussage, dass der Ertrag geheiligt ist, und reduziert sie nicht auf eine bloße wirtschaftliche Umverteilung.
- issue: Identität derer, die vor Yahweh wohnen
  choice: nicht näher bestimmt
  alternative: Priester oder Tempeldiener
  rationale: Die Formulierung kann an Menschen im kultischen Dienst denken lassen, benennt sie jedoch nicht ausdrücklich. Der Haupttext bewahrt daher die offene Bezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Hebräischen leicht geglättet, der Parallelismus von Ansammeln und Horten jedoch bewahrt. Die schwierige Schlusswendung wird lesbar übersetzt und zugleich durch eine Fußnote als textlich beziehungsweise lexikalisch unsicher gekennzeichnet.
