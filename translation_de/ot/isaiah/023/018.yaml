  source_fidelity: 'Der Entwurf gibt die Grundstruktur und den Sinn des hebräischen Textes weitgehend zutreffend wieder: Handels-/Erwerbsertrag und Lohn werden Yahweh geweiht, nicht zurückgelegt, sondern den „vor Yahweh Wohnenden“ zur Versorgung gegeben. Die Schlusswendung לִמְכַסֶּה עָתִיק ist jedoch lexikalisch unsicher; „kostbare Gewänder“ legt die umstrittene Qualitätsbedeutung zu stark fest und erweitert „Bedeckung/Kleidung“ zu „Gewändern“. Auch „damit sie ... können“ fügt eine modale Zwecknuance hinzu, die der knappen hebräischen Bestimmungsangabe nicht entspricht.'
