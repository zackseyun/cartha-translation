    text: 'Oder: „Jahwe wird Tyrus heimsuchen“. Das hebräische Verb kann je nach Zusammenhang ein strafendes oder ein wiederherstellendes Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Hurenlohn“ bezeichnet den Lohn einer Prostituierten. Damit wird das Bild von Tyrus als Prostituierter unter den Völkern fortgeführt.
    reason: cultural_note
  - marker: c
    text: 'Im Hebräischen stehen hier zwei verwandte, aber unterschiedliche Wörter: zunächst „Erde/Land“, danach „Erdboden“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ersetzt die im Deutschen unidiomatische Wendung „nach Tyrus sehen“ durch eine neutrale, quellensprachlich offene Formulierung. Sie vermeidet außerdem die zusätzliche Nuance von „Dann“ und ordnet die abschließende Orts-/Umfangsbestimmung so, dass ihre Beziehung zu den Königreichen deutlicher wird. Die Umstellung im letzten Satzteil ist allerdings stilistisch schwerfällig und folgt zu eng einer möglichen hebräischen Zuordnung; die sachlich und sprachlich bessere Lösung ist daher unten noch einmal abzuwägen.
