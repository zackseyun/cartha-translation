source:
  edition: WLC
  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: de
  text: 'Und am Ende von siebzig Jahren wird es geschehen: Jahwe wird nach Tyrus sehen[a]. Dann wird sie zu ihrem Hurenlohn[b] zurückkehren und sich mit allen Königreichen der Erde auf dem Erdboden[c] prostituieren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird Tyrus heimsuchen“ beziehungsweise „sich Tyrus zuwenden“. Das hebräische Verb kann je nach Zusammenhang ein strafendes oder ein wiederherstellendes Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Hurenlohn“ bezeichnet den Lohn einer Prostituierten. Damit wird das Bild von Tyrus als Prostituierter unter den Völkern fortgeführt.
    reason: cultural_note
  - marker: c
    text: 'Im Hebräischen stehen hier zwei verwandte, aber unterschiedliche Wörter: zunächst „Erde/Land“, danach „Erdboden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird es geschehen
  rationale: Die geläufige prophetische Zukunftsformel wird in natürlichem, zugleich würdevollem Deutsch wiedergegeben.
- source_word: מִקֵּץ שִׁבְעִים שָׁנָה
  choice: am Ende von siebzig Jahren
  rationale: מִקֵּץ bezeichnet das Ende beziehungsweise den Ablauf des festgelegten Zeitraums genauer als ein bloßes „nach“.
- source_word: יִפְקֹד
  choice: wird nach … sehen
  rationale: Die Formulierung bezeichnet Jahwes aufmerksames Eingreifen, ohne den mehrdeutigen hebräischen Ausdruck vorschnell auf Strafe oder Wiederherstellung festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צֹר
  choice: Tyrus
  rationale: Dies ist die etablierte deutsche Namensform der phönizischen Stadt.
- source_word: וְשָׁבָה
  choice: Dann wird sie … zurückkehren
  rationale: Das feminine Verb nimmt die als Frau personifizierte Stadt Tyrus auf; „sie“ erhält diese Personifikation.
- source_word: לְאֶתְנַנָּה
  choice: zu ihrem Hurenlohn
  rationale: אֶתְנַן bezeichnet hier ausdrücklich den Lohn einer Prostituierten und trägt die wirtschaftlich-sexuelle Metapher des Orakels.
- source_word: וְזָנְתָה
  choice: und sich … prostituieren
  rationale: Die direkte moderne Formulierung bewahrt die personifizierende Prostitutionsmetapher, ohne sie abzuschwächen.
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: mit allen Königreichen der Erde
  rationale: Im Zusammenhang mit זנה bezeichnet אֵת die Beteiligten; der universale Umfang von „allen Königreichen“ spricht hier für „Erde“ statt „Land“.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf dem Erdboden
  rationale: Die Wiedergabe bleibt verständlich und unterscheidet אֲדָמָה lexikalisch von dem zuvor gebrauchten אֶרֶץ, auch wenn die deutsche Wiederholung bewusst auffällig bleibt.
theological_decisions:
- issue: Bedeutungsweite des göttlichen Eingreifens in יִפְקֹד
  choice: Jahwe wird nach Tyrus sehen
  alternative: Jahwe wird Tyrus heimsuchen / Jahwe wird sich Tyrus zuwenden
  rationale: Der Zusammenhang zeigt ein entscheidendes Handeln Jahwes an Tyrus, doch das Verb legt nicht eindeutig fest, ob Strafe, fürsorgliche Zuwendung oder Wiederherstellung im Vordergrund steht. Die gewählte Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch mit prophetisch-würdevollem Ton. Die weibliche Personifikation von Tyrus und die bewusst harte Prostitutionsmetapher bleiben erhalten. Die Wiederholung „Erde … Erdboden“ spiegelt den lexikalischen Wechsel des Hebräischen, ohne die Wendung unnötig auszuschmücken.
