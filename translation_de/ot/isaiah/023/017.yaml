review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des hebräischen Textes wird im Wesentlichen getroffen: der Abschluss der siebzig Jahre, das mehrdeutige Eingreifen Jahwes, die weibliche Personifikation von Tyrus, der Hurenlohn und die weltweite Ausdehnung bleiben erhalten. „Dann“ fügt jedoch eine stärker abgesetzte zeitliche Stufe hinzu, die das einfache וְ weniger genau abbildet. Zudem ist die Stellung von „auf dem Erdboden“ in Verbindung mit „sich prostituieren“ im Deutschen missverständlich, weil sie den Ort der Handlung statt den Umfang der Königreiche nahelegt.'
  naturalness: „Jahwe wird nach Tyrus sehen“ ist im heutigen Standarddeutsch als Wiedergabe eines entscheidenden Eingreifens nicht idiomatisch genug und kann fürsorgliches Beaufsichtigen nahelegen. „Jahwe wird sich Tyrus zuwenden“ ist natürlich und wahrt die semantische Offenheit von פקד. Die umgestellte Schlussphrase macht den Satz klarer, ohne den lexikalischen Kontrast zwischen Erde und Erdboden aufzugeben.
  terminology: „Jahwe“, „Tyrus“, „Hurenlohn“ und die Prostitutionsmetapher sind sachgerecht. „Hurenlohn“ ist hart, aber für אֶתְנַן treffend und im Kontext angemessen. Die Anmerkungen sind inhaltlich zutreffend; Anmerkung a wird auf die revidierte Hauptlesart abgestimmt.
  issues:
  - severity: medium
    issue: „wird nach Tyrus sehen“ ist für יִפְקֹד zu unidiomatisch und semantisch unscharf.
    rationale: Die deutsche Wendung kann bloßes Beobachten oder Fürsorge bezeichnen und vermittelt nicht zuverlässig ein göttliches Sich-Zuwenden bzw. Eingreifen. „Sich Tyrus zuwenden“ bleibt neutral zwischen strafendem und wiederherstellendem Handeln.
  - severity: low
    issue: „Dann“ verstärkt die Abfolge gegenüber dem einfachen hebräischen וְ.
    rationale: Die Verbindung der beiden Zukunftsaussagen wird mit „und“ enger und quellennäher wiedergegeben.
  - severity: medium
    issue: Die gegenwärtige Stellung von „auf dem Erdboden“ ist syntaktisch missverständlich.
    rationale: Sie kann sich auf die Art bzw. den Ort des Sichprostituierens beziehen. Die Umstellung verdeutlicht, dass die Wendung die Gesamtheit der Königreiche weltweit qualifiziert.
  revised_text: 'Und am Ende von siebzig Jahren wird es geschehen: Jahwe wird sich Tyrus zuwenden[a], und sie wird zu ihrem Hurenlohn[b] zurückkehren und sich mit allen Königreichen auf dem Erdboden, den Königreichen der Erde[c], prostituieren.'
  revised_footnotes:
