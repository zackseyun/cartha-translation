  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Tyrus wird für siebzig Jahre vergessen sein; die Zeitspanne wird mit den Tagen eines Königs verglichen; danach trifft Tyrus zu, was das Lied der Prostituierten besagt. Die Formulierung „so lange, wie die Tage eines einzigen Königs dauern“ entfaltet den Vergleich jedoch stärker als der hebräische Text und hebt „einen einzigen“ unnötig hervor. Die Schlusswendung darf den Bezug auf das folgende Lied idiomatisch verdeutlichen, sollte aber als Vergleich kenntlich bleiben.'
  naturalness: Das Deutsch ist insgesamt flüssig und würdig. „Wie die Tage eines Königs“ ist im Deutschen verständlich und näher am bewusst knappen hebräischen Vergleich. „Wie es im Lied der Prostituierten heißt“ ist als idiomatische, erklärende Alternative natürlich.
  terminology: „Tyrus“ ist die übliche deutsche Namensform. „Prostituierte“ ist modern, sachlich und gibt זונה ohne Abschwächung oder Archaisierung wieder. Die Fußnote zur möglichen Lebens- oder Regierungszeit muss als mögliche Deutung und nicht als festgelegte Bedeutung formuliert werden.
