revisions:
- from: Und an jenem Tag wird Tyrus siebzig Jahre lang vergessen sein, so lange, wie die Tage eines einzigen Königs dauern.[a] Nach Ablauf von siebzig Jahren wird es Tyrus ergehen, wie es im Lied der Prostituierten heißt:[b]
  to: Und an jenem Tag wird Tyrus siebzig Jahre lang vergessen sein, wie die Tage eines Königs.[a] Nach Ablauf von siebzig Jahren wird es Tyrus ergehen wie im Lied der Prostituierten:[b]
  rationale: Die Revision bewahrt die knappe Vergleichsform des Hebräischen und damit die offene Frage, was mit den „Tagen eines Königs“ genau gemeint ist. Die zweite Aussage bleibt idiomatisch verständlich und stellt zugleich den Vergleich mit dem in Vers 16 folgenden Lied klar heraus. Beide vorhandenen Fußnotenanker bleiben erhalten und sind inhaltlich stimmig formuliert.
