  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: de
  text: Und an jenem Tag wird Tyrus siebzig Jahre lang vergessen sein, wie die Tage eines Königs.[a] Nach Ablauf von siebzig Jahren wird es Tyrus ergehen wie im Lied der Prostituierten:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Lebenszeit eines Königs“ beziehungsweise „für die Regierungszeit eines Königs“. Wörtlich: „wie die Tage eines Königs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dann wird es für Tyrus sein wie das Lied der Prostituierten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird … sein
  rationale: Die prophetische Zukunftsaussage wird im Deutschen idiomatisch mit dem Futur wiedergegeben; „Und“ bewahrt den Anschluss an den Kontext.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der festen prophetischen Zeitformel, ohne ihren besonderen Zukunftsbezug abzuschwächen.
- source_word: וְנִשְׁכַּחַת
  choice: wird … vergessen sein
  rationale: 'Das Nifal bezeichnet hier einen passiven beziehungsweise resultativen Zustand: Tyrus ist dem öffentlichen Bewusstsein entfallen.'
- source_word: צֹר
  choice: Tyrus
  rationale: Eingebürgerte deutsche Namensform der phönizischen Stadt.
- source_word: שִׁבְעִים שָׁנָה
  choice: siebzig Jahre lang
  rationale: „Lang“ kennzeichnet im Deutschen klar die Dauer des Vergessenseins.
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: so lange, wie die Tage eines einzigen Königs dauern
  rationale: Die Vergleichsform und das konkrete Wort „Tage“ bleiben erkennbar; die Ergänzung „dauern“ macht den hebräischen Nominalsatz im Deutschen verständlich, ohne „König“ als Dynastie oder Reich umzudeuten.
- source_word: מִקֵּץ
  choice: Nach Ablauf von
  rationale: Bezeichnet den Zeitpunkt nach dem Ende des genannten Zeitraums und klingt im Deutschen natürlich.
- source_word: יִהְיֶה לְצֹר
  choice: wird es Tyrus ergehen
  rationale: Gibt die unpersönliche hebräische Wendung idiomatisch wieder, ohne das folgende Geschehen näher festzulegen.
- source_word: כְּשִׁירַת
  choice: wie es im Lied … heißt
  rationale: Leitet natürlich das in Vers 16 folgende Lied ein. Die wörtlichere Vergleichsform „wie das Lied“ bleibt in der Fußnote sichtbar.
- source_word: הַזּוֹנָה
  choice: der Prostituierten
  rationale: Sachlich, modern und genau; die scharfe prophetische Metapher wird weder archaisiert noch abgeschwächt.
theological_decisions:
- issue: Bildliche Darstellung von Tyrus als Prostituierte
  choice: Die Metapher wird ausdrücklich mit „Prostituierte“ beibehalten.
  alternative: Dirne; sexuell freizügige Frau
  rationale: Der Text verbindet Tyrus’ Handel und erneute öffentliche Beachtung mit dem Lied einer Prostituierten. Eine Abschwächung würde die rhetorische Wirkung und den Zusammenhang mit dem folgenden Vers verdecken.
- issue: Bedeutung der siebzig Jahre im Vergleich mit den Tagen eines Königs
  choice: Der Vergleich bleibt als „Tage eines einzigen Königs“ stehen.
  alternative: die Lebenszeit oder Regierungszeit eines Königs
  rationale: Der hebräische Text bestimmt nicht ausdrücklich, ob Lebens- oder Regierungszeit gemeint ist. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch oder historisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel und die auffällige Zeitangabe bleiben eng am Hebräischen; nur die Schlusswendung wird für einen verständlichen Übergang zum folgenden Lied idiomatisch entfaltet.
