  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
translation:
  language: de
  text: Verstummt, ihr Bewohner des Küstenlandes[a]! Sidons Händler, die das Meer überqueren, haben dich gefüllt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Insel“. Das hebräische Wort אִי kann eine Insel oder ein Küstengebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im wirtschaftlichen Zusammenhang kann die Wendung auch bedeuten: „haben dich beliefert“; möglicherweise ist auch der Sinn „waren dein Ertrag“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  choice: Verstummt
  rationale: Der Qal-Imperativ Plural von דמם fordert hier angesichts des Gerichts zu betroffenem Schweigen auf. „Verstummt“ bewahrt die Dringlichkeit, ohne ausdrücklich Trauer hineinzulesen.
- source_word: יֹשְׁבֵי אִי
  choice: ihr Bewohner der Küste
  rationale: Das substantivierte Partizip wird als direkte Anrede natürlich wiedergegeben. אִי bezeichnet im prophetischen Sprachgebrauch häufig ein Küstengebiet, kann aber auch eine Insel meinen; „Küste“ passt zum phönizischen Zusammenhang und ermöglicht den folgenden femininen Singularbezug „dich“.
- source_word: סֹחֵר צִידוֹן
  choice: Sidons Händler
  rationale: סֹחֵר steht formal im Singular, kann aber kollektiv die sidonische Händlerschaft bezeichnen. Das pluralische Verb מִלְאוּךְ stützt hier im Deutschen die kollektive Wiedergabe als „Händler“.
- source_word: עֹבֵר יָם
  choice: die das Meer überqueren
  rationale: Das Partizip beschreibt die fortlaufende Seefahrt der sidonischen Händler. Der Relativsatz ist im Deutschen natürlich und erhält das maritime Bild.
- source_word: מִלְאוּךְ
  choice: haben dich versorgt
  rationale: Die Form bezeichnet ein vollendetes Handeln mit einem femininen Singular als Objekt. Im Handelskontext gibt „versorgt“ den wahrscheinlichen wirtschaftlichen Sinn idiomatisch wieder; die wörtlichere und weitere wirtschaftliche Deutung wird in der Fußnote offengehalten.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der Wechsel von „ihr Bewohner“ zu „dich“ bewahren die hebräische rhetorische Bewegung: Zuerst werden die Bewohner angesprochen, dann die Küste als feminine Einheit. Das formal singularische, kollektiv gebrauchte סֹחֵר wird wegen des pluralischen Prädikats als „Händler“ wiedergegeben.'
