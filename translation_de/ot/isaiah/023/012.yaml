source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: de
  text: 'Er sagte: »Du wirst nicht länger jauchzen[a], du unterdrückte Jungfrau, Tochter Sidons. Steh auf und setz nach Kittim[b] über! Auch dort wirst du keine Ruhe finden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst dich nicht länger freuen.“'
    reason: lexical_alternative
  - marker: b
    text: Kittim bezeichnet wahrscheinlich Zypern und kann darüber hinaus westliche Gebiete jenseits des Meeres einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Das narrative Wayyiqtol von אמר wird im modernen Deutschen natürlich ohne einleitendes „und“ wiedergegeben; das im Kontext erschließbare Subjekt bleibt als Pronomen erhalten.
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  choice: Du wirst nicht länger jauchzen
  rationale: Die verneinte Form von יסף zusammen mit עוֹד bezeichnet das Aufhören einer Handlung. „Jauchzen“ gibt die überschwängliche Freude von עלז und den gehobenen prophetischen Ton wieder.
- source_word: הַמְעֻשָּׁקָה
  choice: unterdrückte
  rationale: Das passive Partizip von עשׁק bezeichnet jemanden, der Unterdrückung ausgesetzt ist; „unterdrückte“ ist direkt und im Deutschen verständlich.
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: jungfräuliche Tochter Sidons
  rationale: Die prophetische Personifikation der Stadt beziehungsweise ihres Volkes bleibt erhalten, ohne sie erklärend aufzulösen.
- source_word: כתיים / כִּתִּים
  choice: Kittim
  rationale: Der überlieferte geografische Eigenname wird transliteriert; die wahrscheinliche Zuordnung zu Zypern und weiteren westlichen Seegebieten gehört in eine Fußnote.
- source_word: קוּמִי עֲבֹרִי
  choice: Steh auf und setz … über
  rationale: Die beiden femininen Singularimperative werden als dringliche, an die personifizierte Tochter Sidons gerichtete Aufforderung wiedergegeben. „Übersetzen“ passt zur Flucht über das Meer.
- source_word: גַּם שָׁם לֹא יָנוּחַ לָךְ
  choice: Auch dort wirst du keine Ruhe finden
  rationale: „Auch dort“ bewahrt die emphatische Ausweitung auf den Zufluchtsort. Die hebräische Wendung wird im Deutschen idiomatisch wiedergegeben, ohne die Aussage über die ausbleibende Ruhe abzuschwächen.
theological_decisions:
- issue: Personifikation Sidons als jungfräuliche Tochter
  choice: Das Bild wird wörtlich als Anrede beibehalten.
  alternative: Die Stadt oder ihre Bevölkerung ausdrücklich benennen.
  rationale: Der hebräische Text verbindet Verletzlichkeit, Würde und kollektive Identität in einer prophetischen Personifikation; eine Auflösung würde diese Spannung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Die Stadtpersonifikation und der Eigenname bleiben erhalten; syntaktisch sperrige hebräische Wendungen werden maßvoll idiomatisiert.
