  text: הֲ/זֹ֥את לָ/כֶ֖ם עַלִּיזָ֑ה מִֽ/ימֵי קֶ֤דֶם קַדְמָתָ/הּ֙ יֹבִל֣וּ/הָ רַגְלֶ֔י/הָ מֵֽ/רָח֖וֹק לָ/גֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/007.yaml
  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: de
  text: Ist das eure jubelnde Stadt, deren Ursprung aus den Tagen der Vorzeit stammt[a], deren Füße sie weit forttrugen, um in der Fremde zu wohnen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Alter aus den Tagen der Vorzeit stammt“.'
    reason: Das seltene קַדְמָתָהּ kann hier sowohl den Ursprung als auch das Alter der Stadt bezeichnen.
lexical_decisions:
- source_word: הֲזֹאת לָכֶם
  choice: Ist das eure
  rationale: Die Fragepartikel und das feminine Demonstrativpronomen eröffnen eine rhetorische Frage über Tyrus; לָכֶם wird im Deutschen idiomatisch possessiv wiedergegeben.
- source_word: עַלִּיזָה
  choice: jubelnde Stadt
  rationale: Das feminine Adjektiv bezeichnet ausgelassene, stolze Freude. „Stadt“ wird aus dem Kontext ergänzt, um den Bezug auf Tyrus im Deutschen klar und natürlich auszudrücken.
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: deren Ursprünge bis in uralte Tage zurückreichen
  rationale: Die Wendung betont das hohe Alter beziehungsweise die weit zurückliegenden Anfänge der Stadt. Die Formulierung bewahrt den zeitlichen Nachdruck in natürlichem Deutsch.
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: deren Füße sie weit forttrugen
  rationale: Der Hifil von יבל kann „führen“, „bringen“ oder „forttragen“ bedeuten. „Forttrugen“ passt zum Bild der personifizierten Stadt, die sich auf ihren eigenen Füßen bewegt.
- source_word: מֵרָחוֹק לָגוּר
  choice: um in der Fremde zu wohnen
  rationale: גור bezeichnet häufig den Aufenthalt als Fremder oder Beisasse. „In der Fremde wohnen“ bewahrt diese Nuance, ohne das im Kontext nicht eindeutig festgelegte Maß der Dauer zu bestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die weibliche Personifikation der Stadt bleiben erhalten; die Satzglieder werden wie im Hebräischen zu einer einzigen zugespitzten Frage verbunden.
