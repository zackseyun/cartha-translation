  text: כַּֽ/אֲשֶׁר שֵׁ֖מַע לְ/מִצְרָ֑יִם יָחִ֖ילוּ כְּ/שֵׁ֥מַע צֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/005.yaml
  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
translation:
  language: de
  text: Wenn die Nachricht Ägypten erreicht, werden sie sich bei der Nachricht über Tyrus vor Qual winden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sie zittern“, „werden sie in Angst geraten“ oder „werden sie Schmerzen leiden“.'
    reason: Das hebräische Verb kann Winden, Zittern sowie heftige Angst oder Schmerz bezeichnen.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wenn
  rationale: Die Konjunktion leitet hier am natürlichsten einen temporalen Nebensatz ein; „als“ oder „so wie“ wäre möglich, doch der Zusammenhang spricht eher für „wenn“.
- source_word: שֵׁמַע
  choice: die Nachricht
  rationale: Das Substantiv bezeichnet eine Nachricht oder Kunde. Die erste hebräische Wendung ist verkürzt und ohne ausdrückliches Verb; „Ägypten erreicht“ gibt den naheliegenden Richtungssinn idiomatisch wieder.
- source_word: לְמִצְרָיִם
  choice: Ägypten erreicht
  rationale: 'Die Präposition לְ wird als Richtungsangabe verstanden: Die Nachricht gelangt nach Ägypten. Möglich, aber im Kontext weniger wahrscheinlich, wäre ein Bezug auf eine Nachricht über Ägypten.'
- source_word: יָחִילוּ
  choice: werden sie sich … vor Qual winden
  rationale: Das Verb חול kann körperliches Winden, Zittern oder geburtswehenartige Angst und Qual ausdrücken. Die Formulierung bewahrt das starke körperliche Bild und klingt im Deutschen vollständig.
- source_word: כְּשֵׁמַע
  choice: bei der Nachricht
  rationale: כְּ bezeichnet hier den Anlass der Reaktion. Die Wiederholung von „Nachricht“ erhält die Wiederholung von שֵׁמַע im Hebräischen.
- source_word: צֹר
  choice: Tyrus
  rationale: „Tyrus“ ist die übliche deutsche Namensform der phönizischen Stadt צֹר.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Nachricht“ bildet die hebräische Parallelstruktur ab; das im Hebräischen nicht ausdrücklich genannte Verb des ersten Satzteils wird mit „erreicht“ natürlich ergänzt.
