  text: וּ/בְ/מַ֤יִם רַבִּים֙ זֶ֣רַע שִׁחֹ֔ר קְצִ֥יר יְא֖וֹר תְּבֽוּאָתָ֑/הּ וַ/תְּהִ֖י סְחַ֥ר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
translation:
  language: de
  text: Auf vielen Wassern war das Getreide des Schihor[a], die Ernte des Nils, ihr Ertrag; und sie wurde zum Handelsgewinn der Völker.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Schihor bezeichnet wahrscheinlich den Nil oder einen seiner Arme; möglich ist auch die Wiedergabe: „das Getreide des Nils“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Handel der Völker“ beziehungsweise „zur Handelsware der Völker“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: Über viele Wasser hinweg
  rationale: Die Wiedergabe bewahrt das maritime Bild und macht im Deutschen verständlich, dass die ägyptischen Erzeugnisse auf dem Seeweg nach Tyrus gelangten, ohne die Präposition unnötig eng festzulegen.
- source_word: זֶרַע
  choice: Saat
  rationale: Im Zusammenhang mit Ernte und Handel bezeichnet das Wort landwirtschaftlichen Ertrag; „Saat“ bleibt nahe am hebräischen Bild und ist im Kontext verständlich.
- source_word: שִׁחֹר
  choice: Schihor
  rationale: Der Eigenname wird transliteriert. Seine wahrscheinlich auf den Nil oder einen Nilarm bezogene Bedeutung wird in einer Fußnote erläutert.
- source_word: קְצִיר יְאֹר
  choice: die Ernte des Nils
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang den Nil. Die Formulierung gibt die Genitivverbindung natürlich wieder und steht als erläuternde Apposition zur „Saat des Schihor“.
- source_word: תְּבוּאָתָהּ
  choice: als ihr Ertrag
  rationale: Das Nomen kann Erzeugnis, Ertrag oder Einkünfte bezeichnen. „Ertrag“ wahrt die Verbindung von landwirtschaftlicher Ware und wirtschaftlichem Gewinn; das feminine Suffix bezieht sich auf Tyrus.
- source_word: וַתְּהִי
  choice: so wurde sie
  rationale: Die feminine Form nimmt die als weiblich vorgestellte Stadt Tyrus auf. „So wurde“ drückt den resultierenden Zustand aus.
- source_word: סְחַר גּוֹיִם
  choice: zum Handelsplatz der Völker
  rationale: סְחַר kann Handel, Handelsware oder einen Ort beziehungsweise Mittelpunkt des Handels bezeichnen. Im Kontext charakterisiert die Wendung Tyrus als internationales Handelszentrum; die lexikalische Mehrdeutigkeit wird in einer Fußnote offengehalten.
