revisions:
- from: Über viele Wasser hinweg kam die Saat des Schihor[a], die Ernte des Nils, als ihr Ertrag; so wurde sie zum Handelsplatz der Völker.[b]
  to: Auf vielen Wassern war das Getreide des Schihor[a], die Ernte des Nils, ihr Ertrag; und sie wurde zum Handelsgewinn der Völker.[b]
  rationale: Die Revision entfernt den nicht ausgedrückten Vorgang „kam“, ersetzt den zu engen Ortsbegriff „Handelsplatz“ durch die dem hebräischen סְחַר nähere wirtschaftliche Aussage „Handelsgewinn“ und verwendet für זֶרַע im vorliegenden Kontext „Getreide“. Die knappe, leicht elliptische Satzform bewahrt den Charakter des hebräischen Nominalsatzes. Beide Fußnotenanker bleiben an den betreffenden Ausdrücken stehen.
