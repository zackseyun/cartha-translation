  naturalness: Der Satz ist in der revidierten Form bewusst knapp und poetisch, aber im modernen Standarddeutsch verständlich. „Getreide“ ist in diesem wirtschaftlich-agrarischen Zusammenhang natürlicher und präziser als „Saat“.
