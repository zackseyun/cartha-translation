  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: de
  text: Nimm eine Leier[a], zieh durch die Stadt, du vergessene Prostituierte! Spiele gekonnt, sing viele Lieder, damit man sich an dich erinnert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Harfe“. Das hebräische Wort bezeichnet ein antikes Saiteninstrument (kinnor).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי
  choice: Nimm
  rationale: Der Qal-Imperativ 2. Person Feminin Singular von לקח fordert unmittelbar dazu auf, das Instrument zu nehmen; „Nimm“ ist knapp und natürlich.
- source_word: כִנּוֹר
  choice: eine Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument; „Leier“ ist sachlich genauer als das traditionell ebenfalls mögliche „Harfe“.
- source_word: סֹבִּי עִיר
  choice: zieh durch die Stadt
  rationale: סבב bezeichnet hier das Umherziehen in beziehungsweise durch die Stadt. Die Wiedergabe ist im Deutschen idiomatisch, ohne einen ausdrücklich fehlenden hebräischen Richtungsbegriff unnötig zu präzisieren.
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: du vergessene Prostituierte
  rationale: זוֹנָה bezeichnet ausdrücklich eine Prostituierte, und נִשְׁכָּחָה beschreibt sie als vergessen. Das eingefügte „du“ macht die direkte Anrede im Deutschen klar.
- source_word: הֵיטִיבִי נַגֵּן
  choice: Spiele gekonnt
  rationale: הֵיטִיבִי bestimmt das Spielen adverbial im Sinn von gut oder kunstfertig; „gekonnt“ klingt natürlich und bewahrt die Aufforderung zur Kunstfertigkeit.
- source_word: הַרְבִּי שִׁיר
  choice: sing viele Lieder
  rationale: Wörtlich wird zum Vermehren des Liedes aufgefordert. Der deutsche Plural gibt den kollektiven beziehungsweise distributiven Sinn idiomatisch wieder.
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: damit man sich wieder an dich erinnert
  rationale: לְמַעַן drückt den Zweck aus; der Niphal von זכר bedeutet, dass sie in Erinnerung gebracht beziehungsweise erinnert wird. Die unpersönliche deutsche Konstruktion bildet den passiven Sinn natürlich ab; „wieder“ entspricht im Kontext der zuvor Vergessenen dem erneuten Erinnern.
theological_decisions:
- issue: Metaphorische Bezeichnung von Tyrus als Prostituierte
  choice: Die ausdrückliche Metapher „du vergessene Prostituierte“ bleibt im Haupttext erhalten.
  alternative: „du vergessene Hure“ oder eine abschwächende Umschreibung der Metapher
  rationale: Jesaja 23 personifiziert Tyrus als Prostituierte, die erneut Aufmerksamkeit gewinnen will. „Prostituierte“ bewahrt die Aussage klar und in modernem, würdigem Deutsch, ohne sie zu verschärfen oder abzuschwächen.
- issue: Bedeutung von תִּזָּכֵרִי
  choice: „damit man sich wieder an dich erinnert“
  alternative: „damit du wieder in Erinnerung kommst“
  rationale: Der Niphal lässt eine passive beziehungsweise resultative Wiedergabe zu. Die gewählte Form bewahrt den Gedanken, dass andere die personifizierte Stadt erneut wahrnehmen, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, verständliches und zugleich prophetisch-würdiges Standarddeutsch. Die direkte Anrede und die Imperative bleiben prägnant; die anstößige Metapher wird weder archaisiert noch beschönigt.
