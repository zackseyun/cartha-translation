lexical_decisions:
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Der Imperativ Plural bezeichnet einen lauten Klage- oder Notruf. „Jammert“ gibt dies in natürlichem, würdigem Deutsch wieder; „Heult“ wäre als Alternative möglich, klingt jedoch härter.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: ihr Tarschisch-Schiffe
  rationale: אֳנִיּוֹת bedeutet schlicht „Schiffe“; die feste Verbindung mit dem Eigennamen wird als „Tarschisch-Schiffe“ wiedergegeben. Das Anredepronomen „ihr“ verdeutlicht den deutschen Vokativ, ohne den Sinn zu erweitern.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Klage ein. „Denn“ passt zum prophetischen Register und bleibt klar.
- source_word: שֻׁדַּד
  choice: ist zerstört
  rationale: Das passive Perfekt von שדד bezeichnet gewaltsame Verwüstung oder Zerstörung. „Ist zerstört“ ist prägnant und wahrt die Stärke der Aussage.
- source_word: מָעֻזְּכֶן
  choice: eure Zuflucht
  rationale: מָעוֹז kann „Festung“, „Zuflucht“ oder „sicherer Ort“ bedeuten. Der feminine Pluralsuffix bezieht sich auf die Schiffe. „Zuflucht“ bewahrt die metaphorische Breite und passt zu Tyrus als ihrem Ort der Sicherheit, ohne ausdrücklich einen Hafen in den Text einzutragen.
