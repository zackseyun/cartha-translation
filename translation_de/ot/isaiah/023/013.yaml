source:
  edition: WLC
  text: הֵ֣ן אֶ֣רֶץ כַּשְׂדִּ֗ים זֶ֤ה הָ/עָם֙ לֹ֣א הָיָ֔ה אַשּׁ֖וּר יְסָדָ֣/הּ לְ/צִיִּ֑ים הֵקִ֣ימוּ בחיני/ו עֹרְרוּ֙ אַרְמְנוֹתֶ֔י/הָ שָׂמָ֖/הּ לְ/מַפֵּלָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: de
  text: Sieh, das Land der Chaldäer! Das ist das Volk, das nicht war[a]. Assyrien gründete es für Wüstentiere[b]. Sie errichteten ihre Belagerungstürme[c], legten seine Paläste bloß[d] und machten es zu einem Trümmerhaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieses Volk gab es nicht« oder »dieses Volk galt nichts«. Der hebräische Satz ist knapp und schwer zu deuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Assur gründete es für Wüstenbewohner«. Der Ausdruck kann wilde Tiere der Wüste oder Menschen bezeichnen, die in der Wüste leben.'
    reason: lexical_alternative
  - marker: c
    text: Das zugrunde liegende hebräische Wort ist unsicher; möglich sind auch »Wachtürme« oder »Festungswerke«.
    reason: textual_variant
  - marker: d
    text: 'Oder: »entblößten seine Paläste«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird knapp und würdevoll wiedergegeben.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: das Land der Chaldäer
  rationale: Bewahrt sowohl den geografischen als auch den ethnischen Bezug der hebräischen Genitivverbindung.
- source_word: זֶה הָעָם לֹא הָיָה
  choice: Das ist das Volk, das nicht war
  rationale: Die bewusst formale Wiedergabe erhält die ungewöhnliche Kürze und Mehrdeutigkeit der schwierigen hebräischen Aussage.
- source_word: אַשּׁוּר יְסָדָהּ לְצִיִּים
  choice: Assyrien hat es den Wüstenbewohnern bestimmt
  rationale: „Assyrien“ bezeichnet hier am ehesten die politische Macht; „bestimmt“ gibt die kontextuelle Funktion von יסד wieder, ohne die schwer verständliche Aussage auf eine Gründung festzulegen.
- source_word: לְצִיִּים
  choice: den Wüstenbewohnern
  rationale: Der Ausdruck kann Wüstentiere oder menschliche Wüstenbewohner bezeichnen; die Hauptlesart bleibt durch eine Fußnote ausdrücklich offen.
- source_word: הֵקִימוּ בחיניו
  choice: Sie errichteten ihre Belagerungstürme
  rationale: Die schwierige Textform wird im Zusammenhang der militärischen Zerstörung als Bezeichnung für Belagerungsbauten verstanden.
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: legten seine Paläste bloß
  rationale: Die Wendung beschreibt hier wahrscheinlich das Freilegen beziehungsweise Entblößen der Paläste; „bloßlegen“ wahrt dieses Bild.
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: machten es zu einem Trümmerhaufen
  rationale: Gibt das Ergebnis des Einsturzes beziehungsweise der Verwüstung natürlich und anschaulich wieder; der Plural wird als Fortsetzung der vorausgehenden Handelnden verstanden.
theological_decisions:
- issue: Identität und einstiger Status des Volkes in זֶה הָעָם לֹא הָיָה
  choice: Die rätselhafte Formulierung „das Volk, das nicht war“ bleibt im Haupttext erhalten.
  alternative: „Dieses Volk gab es nicht“ oder „dieses Volk galt nichts“.
  rationale: Der hebräische Satz ist knapp und umstritten; eine eindeutige historische oder wertende Deutung würde die vorhandene Spannung unzulässig auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, prophetisch-würdevoller Diktion. Die wechselnden grammatischen Geschlechter des Hebräischen werden im Deutschen auf das sächliche Bezugswort „Land“ abgestimmt. Die schwer verständliche Satzstruktur und die lexikalischen Unsicherheiten werden nicht stillschweigend harmonisiert, sondern im Haupttext beziehungsweise in Fußnoten sichtbar gehalten.
