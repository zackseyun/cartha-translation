  source_fidelity: 'Die Übersetzung bewahrt die schwierige, elliptische Aussage »das Volk, das nicht war« angemessen. Bei יְסָדָהּ ist jedoch »bestimmt« keine sichere Wiedergabe: יסד bedeutet primär »gründen/errichten«. Die dadurch historisch oder bildlich schwer verständliche Verbindung mit לְצִיִּים sollte im Haupttext nicht durch eine kontextuelle Umdeutung geglättet werden. לְצִיִּים ist im Kontext der Verwüstung am natürlichsten als Wüstentiere zu verstehen; die menschliche Deutung gehört in die Anmerkung.'
