revisions:
- from: Sieh das Land der Chaldäer! Das ist das Volk, das nicht war[a]. Assyrien hat es den Wüstenbewohnern[b] bestimmt. Sie errichteten ihre Belagerungstürme[c], legten seine Paläste bloß[d] und machten es zu einem Trümmerhaufen.
  to: Sieh, das Land der Chaldäer! Das ist das Volk, das nicht war[a]. Assyrien gründete es für Wüstentiere[b]. Sie errichteten ihre Belagerungstürme[c], legten seine Paläste bloß[d] und machten es zu einem Trümmerhaufen.
  rationale: Die Revision stellt die Grundbedeutung von יסד mit »gründete« wieder her und wählt für צִיִּים die im Bild einer Einöde naheliegende Hauptlesart »Wüstentiere«. Die alternative menschliche Lesart und die Namensform »Assur« bleiben als Fußnote erhalten. Die Fußnote zu עוררו wird semantisch an das im Haupttext gewählte »bloßlegen« angepasst. Weitere Unklarheiten des hebräischen Textes, besonders die Aussage über das Volk und die unsichere Bezeichnung der Türme, bleiben ausdrücklich sichtbar.
