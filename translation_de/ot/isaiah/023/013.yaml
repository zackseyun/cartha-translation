  terminology: »Chaldäer«, »Assyrien«, »Belagerungstürme«, »Paläste« und »Trümmerhaufen« sind passend. Die Fußnote zu »bloß« muss eine echte alternative Formulierung bieten und darf nicht stattdessen die deutlich stärkere Bedeutung »niederreißen« einführen.
