source:
  edition: WLC
  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: de
  text: 'Schäme dich, Sidon! Denn das Meer, die Festung des Meeres[a], hat gesprochen: »Ich habe weder Wehen gehabt[b] noch ein Kind geboren; ich habe keine jungen Männer herangezogen und keine Jungfrauen[c] großgezogen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Meeresfestung«. Der Ausdruck kann das mächtige Meer personifizieren oder auf Tyrus als befestigte Seemacht anspielen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Ich habe mich nicht in Geburtswehen gewunden.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder weniger spezifisch: »Mädchen« oder »junge Frauen«. Das hebräische Wort bezeichnet gewöhnlich Jungfrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: Schäme dich
  rationale: Der feminine Singular des Imperativs richtet sich an die als weiblich vorgestellte Stadt Sidon. Die Wiedergabe bewahrt sowohl die Aufforderung als auch das Scham-Motiv.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Gebräuchliche deutsche Namensform der phönizischen Stadt.
- source_word: יָם
  choice: das Meer
  rationale: Das Meer wird entsprechend dem hebräischen Bild personifiziert und als sprechend dargestellt.
- source_word: מָעוֹז הַיָּם
  choice: die Festung des Meeres
  rationale: מָעוֹז bezeichnet eine Festung beziehungsweise einen befestigten Zufluchtsort. Die Genitivverbindung wahrt das Bild und lässt offen, ob sie das Meer näher beschreibt oder auf die Seefestung Tyrus anspielt.
- source_word: לֹא חַלְתִּי
  choice: Ich habe keine Wehen gehabt
  rationale: Das Verb bezeichnet hier Wehen beziehungsweise das Sichwinden bei einer Geburt. Die Formulierung ist im modernen Deutsch natürlich und führt die Geburtsmetaphorik klar ein.
- source_word: וְלֹא יָלַדְתִּי
  choice: und nicht geboren
  rationale: Die knappe Wiedergabe folgt der parallelen Verneinung des Hebräischen und bezeichnet unmittelbar das Gebären.
- source_word: וְלֹא גִדַּלְתִּי בַּחוּרִים
  choice: ich habe keine jungen Männer herangezogen
  rationale: גִדַּלְתִּי meint im Zusammenhang mit Nachkommen deren Aufziehen; בַּחוּרִים bezeichnet junge Männer, nicht ausdrücklich Söhne.
- source_word: רוֹמַמְתִּי בְתוּלוֹת
  choice: keine Jungfrauen großgezogen
  rationale: רוֹמַמְתִּי bedeutet wörtlich erhöhen oder emporheben, bezeichnet im Parallelismus aber wahrscheinlich das Aufziehen. »großgezogen« wahrt den Zusammenhang, ohne das Verb mit dem vorangehenden Ausdruck völlig gleich wiederzugeben; בְתוּלוֹת wird präzise als »Jungfrauen« wiedergegeben.
theological_decisions:
- issue: Identität der sprechenden Größe
  choice: »das Meer, die Festung des Meeres« als mehrdeutige Apposition beibehalten
  alternative: Tyrus ausdrücklich als die sprechende Seefestung benennen
  rationale: Der hebräische Wortlaut lässt das Meer sprechen und fügt מָעוֹז הַיָּם hinzu. Eine ausdrückliche Gleichsetzung mit Tyrus würde eine wahrscheinliche Anspielung zur eindeutigen Deutung machen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter prophetischer Anrede. Die Geburts- und Erziehungsmetaphorik sowie die Mehrdeutigkeit von »Festung des Meeres« bleiben erhalten; die deutsche Zeichensetzung gliedert die poetischen Parallelzeilen klar.
