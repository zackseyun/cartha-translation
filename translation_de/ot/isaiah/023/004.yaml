  naturalness: Der gehobene prophetische Ton ist natürlich. Eine paarige Verneinung mit »weder … noch …« bildet den hebräischen Parallelismus besonders klar ab. »hat gesprochen« passt bei personifizierter direkter Rede etwas besser als das umgangssprachlichere »hat gesagt«.
