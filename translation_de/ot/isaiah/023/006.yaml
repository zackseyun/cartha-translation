  yaml_path: translation/ot/isaiah/023/006.yaml
  text: Cross over to Tarshish; wail[a], inhabitants of the coastland.
translation:
  language: de
  text: Zieht hinüber nach Tarschisch! Klagt laut, ihr Bewohner des Küstenlandes[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Insel“. Das hebräische Wort kann eine Insel oder ein Küstenland beziehungsweise eine maritime Region bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ
  choice: Zieht hinüber
  rationale: Der Imperativ Plural bezeichnet eine Bewegung hinüber beziehungsweise über etwas hinweg. „Zieht hinüber“ bewahrt diese Bedeutung, ohne das Verkehrsmittel oder die näheren Umstände festzulegen.
- source_word: תַּרְשִׁישָׁה
  choice: nach Tarschisch
  rationale: Das direktionale He am Ortsnamen gibt die Bewegung auf Tarschisch zu an; im Deutschen wird dies idiomatisch mit „nach Tarschisch“ wiedergegeben.
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Der Imperativ bezeichnet lautes Klagen aus Trauer oder Not. „Jammert“ ist gegenwärtiges, verständliches Deutsch und bewahrt die emotionale Intensität.
- source_word: יֹשְׁבֵי
  choice: ihr Bewohner
  rationale: Das substantivisch gebrauchte Partizip im Constructus bezeichnet die dort Wohnenden. Die Anrede mit „ihr Bewohner“ gibt die direkte Aufforderung natürlich wieder.
- source_word: אִי
  choice: des Küstenlandes
  rationale: Das hebräische Wort kann eine Insel oder ein maritimes Küstengebiet bezeichnen. Im Zusammenhang des Seehandels von Tyrus und Tarschisch ist „Küstenland“ passend, ohne die maritime Bedeutung zu verlieren; die echte lexikalische Alternative wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden pluralischen Imperative werden als eindringliche prophetische Aufforderungen wiedergegeben. Die Zeichensetzung gliedert die zwei knappen Befehle klar; die Anrede „ihr Bewohner“ macht den Bezug des zweiten Imperativs transparent.
