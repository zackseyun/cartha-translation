  text: מַשָּׂ֖א צֹ֑ר הֵילִ֣ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ כִּֽי שֻׁדַּ֤ד מִ/בַּ֨יִת֙ מִ/בּ֔וֹא מֵ/אֶ֥רֶץ כִּתִּ֖ים נִגְלָה לָֽ/מוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: de
  text: 'Ausspruch über Tyrus:


    Wehklagt, ihr Tarschisch-Schiffe! Denn es ist verwüstet, ohne Haus, ohne Zugang.[a] Aus dem Land Kittim[b] erfahren sie davon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von Haus, von Eingang/Zugang“. Gemeint sein kann, dass nach der Verwüstung weder Unterkunft noch eine Möglichkeit zur Einfahrt oder zum Zugang geblieben ist.'
    reason: lexical_alternative
  - marker: b
    text: Kittim bezeichnet hier wahrscheinlich Zypern oder westlich gelegene Küstengebiete.
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort häufig eine göttliche Gerichtsankündigung. „Ausspruch“ gibt diese Gattungsfunktion verständlich wieder, ohne die mögliche Grundbedeutung „Last“ unpassend zu vergegenständlichen.
- source_word: צֹר
  choice: Tyrus
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Der Imperativ Plural fordert zu lautem Klagen auf. „Jammert“ ist im heutigen Deutsch eindringlich, aber weniger missverständlich als das wörtlichere „heult“.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: Tarschisch-Schiffe
  rationale: Die Zusammensetzung bewahrt die offene Zuordnung zu Tarschisch; gemeint sein können große Handelsschiffe beziehungsweise Schiffe mit Herkunft, Ziel oder Verbindung zu Tarschisch.
- source_word: שֻׁדַּד
  choice: es ist verwüstet
  rationale: Das Passiv bezeichnet Zerstörung beziehungsweise Verheerung, möglicherweise infolge von Plünderung. „Verwüstet“ hält diesen Bedeutungsumfang besser offen als das endgültiger klingende „vernichtet“.
- source_word: מִבַּיִת מִבּוֹא
  choice: Kein Haus und keine Hafenzufahrt sind mehr da
  rationale: Die beiden mit מִן gebildeten Ausdrücke werden im Kontext privativ verstanden. „Hafenzufahrt“ erschließt den maritimen Zusammenhang, während die Fußnote die wörtlichere Alternative festhält.
- source_word: מֵאֶרֶץ כִּתִּים
  choice: Aus dem Land Kittim
  rationale: Die hebräische geografische Bezeichnung bleibt erhalten, da sie historisch Zypern und möglicherweise weitere westliche Küstengebiete bezeichnen kann.
- source_word: נִגְלָה לָמוֹ
  choice: wurde es ihnen bekannt
  rationale: Die passive Form besagt hier, dass die Nachricht beziehungsweise der Sachverhalt ihnen zur Kenntnis gelangt. Die unbestimmte Referenz des hebräischen „es“ bleibt gewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Anrede und die knappe prophetische Form bleiben erhalten. „Tarschisch-Schiffe“ und „Kittim“ bewahren geografische Offenheit; erklärende Präzisierungen stehen nur dort, wo der maritime Kontext sie nahelegt.
