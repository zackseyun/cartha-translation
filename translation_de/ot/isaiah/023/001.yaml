revisions:
- from: 'Ausspruch über Tyrus:

    Jammert, ihr Tarschisch-Schiffe! Denn es ist verwüstet: Kein Haus und keine Hafenzufahrt sind mehr da.[a] Aus dem Land Kittim[b] wurde es ihnen bekannt.'
  to: 'Ausspruch über Tyrus:


    Wehklagt, ihr Tarschisch-Schiffe! Denn es ist verwüstet, ohne Haus, ohne Zugang.[a] Aus dem Land Kittim[b] erfahren sie davon.'
  rationale: Die Revision vermeidet die im Haupttext zu enge Festlegung von מִבּוֹא auf eine Hafenzufahrt, verbessert den Ton des Imperativs und glättet die abschließende Aussage. Die Fußnote zu [a] dokumentiert die syntaktisch und semantisch schwierige Formulierung, ohne ihre genaue Deutung zu entscheiden.
