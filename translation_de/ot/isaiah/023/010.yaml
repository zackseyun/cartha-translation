  yaml_path: translation/ot/isaiah/023/010.yaml
  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
translation:
  language: de
  text: Zieh durch dein Land wie der Nil, Tochter Tarschisch; es gibt keine Bindung mehr.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Breite dich über dein Land aus wie der Nil“ beziehungsweise „Überflute dein Land wie der Nil“. Das hebräische Verb bedeutet gewöhnlich „hinübergehen“ oder „durchqueren“; der Vergleich mit dem Nil kann zugleich eine ungehinderte, überschwemmende Ausbreitung nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort ist unsicher. Es kann etwas Bindendes oder Festhaltendes bezeichnen; vorgeschlagen werden auch „Schranke“, „Gürtel“, „Hafen“ oder „Vertäuung“. Die Wiedergabe „Bindung“ ist daher als weiter gefasste Deutung zu verstehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: Durchziehe
  rationale: Der feminine Singular des Imperativs von עבר bezeichnet zunächst ein Hinübergehen oder Durchqueren. „Durchziehe“ bewahrt diese Grundbedeutung und lässt den anschließenden Nilvergleich die Art der Bewegung als ungehinderte Ausbreitung bestimmen.
- source_word: אַרְצֵךְ
  choice: dein Land
  rationale: ארץ mit Suffix der 2. Person feminin Singular bedeutet hier natürlich „dein Land“ und entspricht der personifizierenden Anrede.
- source_word: כיאור
  choice: wie der Nil
  rationale: יאר bezeichnet im biblischen Hebräisch häufig den Nil beziehungsweise einen Nilarm. Der bestimmte Flussname trägt hier das Bild seiner weithin ausgreifenden Überschwemmung.
- source_word: בת תרשיש
  choice: Tochter Tarschisch
  rationale: Die prophetische Personifikation wird erhalten, statt sie deutend zu „Bewohner von Tarschisch“ aufzulösen.
- source_word: אין
  choice: Es gibt keine
  rationale: Gibt die hebräische Existenzverneinung idiomatisch und klar wieder.
- source_word: מזח
  choice: Fessel
  rationale: Das seltene und unsichere Wort scheint etwas Bindendes, Festhaltendes oder Sicherndes zu bezeichnen. „Fessel“ bewahrt dieses breite Bild besser als engere Deutungen wie „Hafen“ oder „Mooring“.
- source_word: עוד
  choice: mehr
  rationale: Zusammen mit der Verneinung bedeutet עוד „nicht mehr“ und zeigt das Ende der bisherigen Bindung an.
