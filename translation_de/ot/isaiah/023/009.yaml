id: ISA.23.9
reference: Isaiah 23:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: de
  text: Jahwe der Heerscharen hat es beschlossen:[a] den Stolz aller Pracht[b] zu entweihen und alle Angesehenen der Erde gering zu machen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat dies gegen sie beschlossen“; das feminine Suffix kann sich ausdrücklich auf Tyrus beziehen.'
    reason: alternative_reading
  - marker: b
    text: „Pracht“ kann auch mit „Schönheit“ oder „Herrlichkeit“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu erniedrigen“ beziehungsweise „herabzusetzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Der Heerscharen“ bewahrt die traditionelle Weite des Titels, ohne ihn ausschließlich auf menschliche Armeen einzuengen.
- source_word: יְעָצָהּ
  choice: hat es beschlossen
  rationale: יעץ bezeichnet hier ein festes Planen oder Beschließen. Das neutrale „es“ lässt den Bezug des femininen Suffixes auf das angekündigte Gericht offen; der mögliche unmittelbare Bezug auf Tyrus wird in der Fußnote genannt.
- source_word: לְחַלֵּל
  choice: zu entweihen
  rationale: Das Piel von חלל bedeutet entweihen, entheiligen oder der Ehre berauben. „Entweihen“ erhält die kräftige Bildsprache, ohne sie auf einen rein kultischen Vorgang festzulegen.
- source_word: גְּאוֹן כָּל צְבִי
  choice: den Stolz aller Pracht
  rationale: גאון kann Stolz, Hoheit oder Erhabenheit bezeichnen; im Gerichtszusammenhang passt „Stolz“. צבי bezeichnet Pracht, Schönheit oder Herrlichkeit; „Pracht“ ergibt im Deutschen eine natürliche und zugleich gehobene Wendung.
- source_word: לְהָקֵל
  choice: gering zu machen
  rationale: Das Hifil von קלל kann „gering machen“, „erniedrigen“ oder „verächtlich behandeln“ bedeuten. „Gering zu machen“ wahrt den Bezug zum Grundgedanken des Leicht- beziehungsweise Unbedeutendmachens.
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: alle Angesehenen der Erde
  rationale: נכבדים sind gewichtige, geehrte oder hochgestellte Menschen. „Angesehene“ ist weit genug, nicht nur Adlige zu bezeichnen; „Erde“ erhält den wahrscheinlich umfassenden Horizont.
theological_decisions:
- issue: Bezug des femininen Objektsuffixes in יְעָצָהּ
  choice: „hat es beschlossen“, bezogen auf das angekündigte Vorhaben beziehungsweise Gericht
  alternative: „hat dies gegen sie beschlossen“, wobei „sie“ Tyrus bezeichnet
  rationale: Der Haupttext wahrt einen natürlichen deutschen Satz und lässt die im Hebräischen mögliche Bezugsweite bestehen. Die spezifische Beziehung auf die als feminin gedachte Stadt Tyrus wird nicht ausgeschlossen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Infinitivgruppen des Hebräischen bleiben sichtbar. „Angesehene“ ist allgemeinverständlich und vermeidet die unbelegte Verengung auf einen bestimmten gesellschaftlichen Rang.
