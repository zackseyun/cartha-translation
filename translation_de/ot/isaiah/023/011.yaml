- from: Er hat seine Hand über das Meer ausgestreckt[a], er hat Königreiche erzittern lassen. Jahwe hat über Kanaan[b] befohlen, ihre Festungen[c] zu zerstören.
  to: Er hat seine Hand über das Meer ausgestreckt[a], er hat Königreiche erzittern lassen. Jahwe hat verfügt, dass Kanaans Festungen[c] zerstört werden[b].
  rationale: Die Änderung ersetzt allein die unidiomatische Konstruktion „hat über Kanaan befohlen“. Die Verfügung über die Zerstörung gibt צִוָּה mit dem anschließenden Infinitiv לְהַשְׁמִיד idiomatisch wieder. „Kanaans Festungen“ macht im Deutschen den Bezug klar; Fußnote [c] dokumentiert zugleich das feminine Suffix und dessen offene personifizierende Referenz. Die alternativen Deutungen und die historische Erläuterung bleiben erhalten.
