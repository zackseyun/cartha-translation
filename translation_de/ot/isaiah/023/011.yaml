source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: de
  text: Er hat seine Hand über das Meer ausgestreckt[a], er hat Königreiche erzittern lassen. Jahwe hat verfügt, dass Kanaans Festungen[c] zerstört werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen das Meer“. Die hebräische Präposition lässt hier mehrere Deutungen zu.'
    reason: alternative_reading
  - marker: b
    text: „Kanaan“ bezeichnet hier wahrscheinlich das phönizische Gebiet, zu dem Tyrus gehörte.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht ein feminines Suffix: „ihre Festungen“. Gemeint sein können die Festungen des personifizierten Landes oder der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ נָטָה
  choice: Er hat seine Hand … ausgestreckt
  rationale: Bewahrt das konkrete anthropomorphe Bild zielgerichteter Macht und gibt das Verb natürlich im Deutschen wieder.
- source_word: עַל הַיָּם
  choice: über das Meer
  rationale: עַל kann hier „über“, „auf“ oder „gegen“ bedeuten. „Über“ wahrt das Bild von Jahwes souveräner Reichweite; die mögliche feindliche Stoßrichtung wird in Fußnote [a] genannt.
- source_word: הִרְגִּיז מַמְלָכוֹת
  choice: er hat Königreiche erzittern lassen
  rationale: Der Hifil von רגז bezeichnet das Verursachen von Beben, Unruhe oder Zittern; „erzittern lassen“ passt zum Gerichtskontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: צִוָּה אֶל כְּנַעַן
  choice: hat über Kanaan befohlen
  rationale: Das ungewöhnliche אֶל nach צוה bezeichnet hier wahrscheinlich das Ziel beziehungsweise den Gegenstand des Befehls. „Über Kanaan“ hält diese Beziehung offen, ohne Kanaan ausdrücklich zum Empfänger zu machen.
- source_word: לַשְׁמִיד
  choice: zu zerstören
  rationale: Gibt den Zweckinfinitiv direkt und mit der erforderlichen Stärke wieder, ohne die Aussage unnötig zu verschärfen.
- source_word: מָעֻזְנֶיהָ
  choice: ihre Festungen
  rationale: מָעוֹז bezeichnet einen befestigten Ort oder Stützpunkt. Das feminine Singularsuffix wird mit „ihre“ bewahrt und kann auf das personifizierte Land beziehungsweise die Stadt bezogen werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration wahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Geografische Deutung von כְּנַעַן
  choice: Kanaan im Haupttext
  alternative: Phönizien
  rationale: Der überlieferte Text nennt Kanaan. Im Zusammenhang von Jesaja 23 ist damit wahrscheinlich das phönizische Gebiet um Tyrus gemeint; diese Einordnung gehört in die Fußnote und ersetzt nicht den Quellbegriff.
- issue: Bezug des femininen Suffixes in מָעֻזְנֶיהָ
  choice: ihre Festungen
  alternative: dessen Festungen
  rationale: Die feminine Form wird sichtbar erhalten. Sie kann das personifizierte Kanaan beziehungsweise die im Kontext angesprochene Stadt oder Region bezeichnen, ohne dass der Haupttext dies abschließend festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die parallelen Verbformen und das konkrete Bild der ausgestreckten Hand bleiben erhalten. Alle Fußnotenmarker stehen unmittelbar bei ihrem Bezug; ihre Reihenfolge wurde gegenüber der englischen Vorlage zur natürlichen deutschen Zuordnung geordnet.
