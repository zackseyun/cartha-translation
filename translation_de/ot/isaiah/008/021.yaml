  text: וְ/עָ֥בַר בָּ֖/הּ נִקְשֶׁ֣ה וְ/רָעֵ֑ב וְ/הָיָ֨ה כִֽי יִרְעַ֜ב וְ/הִתְקַצַּ֗ף וְ/קִלֵּ֧ל בְּ/מַלְכּ֛/וֹ וּ/בֵ/אלֹהָ֖י/ו וּ/פָנָ֥ה לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: de
  text: Und er wird hindurchziehen, bedrängt und hungrig. Wenn er Hunger leidet, wird er in Zorn geraten und seinen König und seinen Gott verfluchen. Dann wird er sich nach oben wenden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach oben blicken. Wörtlich: sich nach oben wenden.'
    reason: Die hebräische Wendung bezeichnet zunächst eine Aufwärtswendung; der Zusammenhang kann ein Aufwärtsrichten des Blickes nahelegen, ohne es ausdrücklich zu sagen.
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: Und er wird darin umherziehen
  rationale: עבר mit ב und femininem Suffix bezeichnet hier das Durchqueren beziehungsweise Umherziehen in dem zuvor genannten Land. Das maskuline Singularsubjekt bleibt entsprechend der hebräischen Grammatik erhalten.
- source_word: נִקְשֶׁה וְרָעֵב
  choice: bedrängt und hungrig
  rationale: נִקְשֶׁה beschreibt einen Menschen in schwerer Bedrängnis; „bedrängt“ ist knapp, natürlich und deutet die Art der Not nicht unnötig aus. רָעֵב bedeutet schlicht „hungrig“.
- source_word: וְהָיָה כִּי יִרְעַב
  choice: Wenn er Hunger leidet
  rationale: Die Konstruktion führt den zeitlichen Umstand des folgenden Geschehens ein. „Hunger leiden“ gibt die wiederholte Hungerangabe im Deutschen idiomatisch wieder, ohne sie zu verstärken.
- source_word: וְהִתְקַצָּף
  choice: wird er in Zorn geraten
  rationale: Die Hitpael-Form bezeichnet das Eintreten in einen Zustand heftigen Zorns. „In Zorn geraten“ bewahrt diesen inchoativen Zug.
- source_word: וְקִלֵּל בְּמַלְכּוֹ וּבֵאלֹהָיו
  choice: und seinen König und seinen Gott verfluchen
  rationale: Bei קלל kennzeichnet ב die Objekte des Fluchens. אֱלֹהָיו wird im Kontext als Singular wiedergegeben, ohne die Identität dieses Gottes weiter festzulegen.
- source_word: וּפָנָה לְמָעְלָה
  choice: Dann wird er nach oben blicken
  rationale: פנה bedeutet grundsätzlich „sich wenden“, kann in Verbindung mit einer Richtungsangabe aber das Richten des Blickes ausdrücken. „Nach oben blicken“ ist im Deutschen natürlich und bildet den Kontrast zum Blick auf die Erde im Folgevers ab.
theological_decisions:
- issue: Repräsentativer maskuliner Singular im Gerichtszusammenhang
  choice: Die singularischen Formen werden durchgehend mit „er“ wiedergegeben.
  alternative: Unpersönliches „man“ oder generisches „sie“.
  rationale: Das Hebräische verwendet konsequent maskuline Singularformen. Die Wiedergabe mit „er“ bewahrt die grammatische Gestalt; der Betroffene kann dabei repräsentativ gemeint sein.
- issue: Bezug von אֱלֹהָיו („sein Gott/seine Götter“)
  choice: „seinen Gott“
  alternative: „seine Götter“ oder eine ausdrückliche Identifikation mit dem HERRN.
  rationale: Im unmittelbaren Zusammenhang liegt der Singular „sein Gott“ näher. Die Übersetzung legt weder die religiöse Zugehörigkeit des Betroffenen noch die genaue Identität Gottes über den Wortlaut hinaus fest.
- issue: Bedeutung der abschließenden Aufwärtswendung
  choice: „nach oben blicken“ im Haupttext, mit formaler Alternative in der Fußnote.
  alternative: „sich nach oben wenden“.
  rationale: Der Zusammenhang mit dem Blick zur Erde in Vers 22 spricht für eine Blickrichtung. Die wörtlichere Möglichkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für gute Verständlichkeit gegliedert; Wiederholung, Zorn und Fluch bleiben deutlich. Keine konfessionelle Deutung wurde ergänzt.
