  text: וְ/אָעִ֣ידָה לִּ֔/י עֵדִ֖ים נֶאֱמָנִ֑ים אֵ֚ת אוּרִיָּ֣ה הַ/כֹּהֵ֔ן וְ/אֶת זְכַרְיָ֖הוּ בֶּ֥ן יְבֶרֶכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: de
  text: 'Und ich will mir zuverlässige Zeugen hinzuziehen[a]: Uria, den Priester, und Secharja, den Sohn Jeberechjas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch im Sinn von »zu Zeugen bestellen« oder »als Zeugen auftreten lassen« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָעִידָה
  choice: Und ich will … Zeugen hinzuziehen
  rationale: Der Hifil von עוד bezeichnet hier das formelle Heranziehen bzw. Bestellen von Zeugen zur Bezeugung. „Hinzuziehen“ ist im Deutschen natürlich und bewahrt den rechtlich-dokumentarischen Sinn; das Präfix וְ wird mit „Und“ wiedergegeben.
- source_word: לִּי
  choice: mir
  rationale: Die Präposition mit Suffix der 1. Person Singular bezeichnet Jesajas persönliche Beteiligung bzw. sein Interesse. „Mir“ gibt dies knapp und idiomatisch wieder.
- source_word: עֵדִים נֶאֱמָנִים
  choice: zuverlässige Zeugen
  rationale: עֵדִים ist der übliche Ausdruck für Personen, die etwas bezeugen. נֶאֱמָנִים hebt ihre Verlässlichkeit und Vertrauenswürdigkeit hervor; „zuverlässig“ trifft diesen Sinn im heutigen Deutsch genauer als das mehrdeutige „treu“.
- source_word: אֵת
  choice: ':'
  rationale: Der Akkusativmarker wird nicht lexikalisch übersetzt. Der Doppelpunkt führt die Namen der zuvor genannten Zeugen natürlich ein.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: den Priester Uria
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form „Uria“ wiedergegeben; der bestimmte Amtstitel wird als Apposition vorangestellt.
- source_word: וְאֶת זְכַרְיָהוּ
  choice: und Secharja
  rationale: Die Konjunktion verbindet den zweiten Zeugen mit dem ersten; der Akkusativmarker wird durch die deutsche Satzstruktur abgebildet. „Secharja“ ist die gängige deutsche biblische Namensform.
- source_word: בֶּן יְבֶרֶכְיָהוּ
  choice: den Sohn Jeberechjas
  rationale: Die Patronymik wird im Deutschen mit „den Sohn“ plus Genitiv ausgedrückt. „Jeberechja“ folgt einer deutschsprachigen Transliteration des hebräischen Namens.
theological_decisions:
- issue: Art der Einsetzung der Zeugen
  choice: hinzuziehen
  alternative: als Zeugen auftreten lassen / zu Zeugen bestellen
  rationale: Das Verb lässt sowohl das Heranziehen als auch das formelle Bestellen oder Bezeugenlassen anklingen. „Hinzuziehen“ wahrt den rechtlichen Zusammenhang, ohne eine bestimmte Verfahrensweise festzulegen; die Alternativen werden in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt eng am Hebräischen, wird aber durch „hinzuziehen“ und die deutschen Namensformen idiomatisch gestaltet. Die genuine Bedeutungsbreite des Verbs wird nicht im Haupttext überladen, sondern in einer Fußnote bewahrt.
