base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: de
  text: Zerbrecht[a], ihr Völker, und verzagt! Hört zu, ihr fernen Enden der Erde! Rüstet euch und verzagt! Rüstet euch[b] und verzagt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erste hebräische Aufforderung ist schwer zu deuten. Möglich sind auch: „Erhebt das Kriegsgeschrei, ihr Völker“ oder „Schließt euch zusammen, ihr Völker“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Gürtet euch“; das hebräische Wort bezeichnet das Bereitmachen, hier wahrscheinlich zum Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: Zerbrecht
  rationale: Die Form ist schwierig und unterschiedlich gedeutet. Im unmittelbaren Zusammenhang unterstützt das dreimalige וָחֹתּוּ eine ironische Aufforderung, die den feindlichen Völkern ihren Zusammenbruch ankündigt. Die echte Mehrdeutigkeit bleibt in Fußnote [a] sichtbar.
- source_word: עַמִּים
  choice: Völker
  rationale: „Völker“ gibt den Plural und die direkte Anrede mehrerer auswärtiger Gemeinschaften natürlich und poetisch wieder.
- source_word: וָחֹתּוּ
  choice: und zerbrecht
  rationale: חתת kann Zusammenbrechen, Zerschmettertwerden oder Erschrecken bezeichnen. „Zerbrecht“ bewahrt hier das Bild vollständiger Niederlage und lässt die eindringliche Wiederholung hörbar werden.
- source_word: וְהַאֲזִינוּ
  choice: Hört zu
  rationale: Die Hifil-Aufforderung verlangt aufmerksames Hören. „Hört zu“ ist gegenwärtig, klar und kräftig.
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: all ihr fernen Gegenden der Erde
  rationale: Die Wendung bezeichnet die weit entfernten Bereiche der Erde und spricht sie poetisch an. Das ergänzte „ihr“ macht diese Anrede im Deutschen deutlich.
- source_word: הִתְאַזְּרוּ
  choice: Rüstet euch
  rationale: Das Hitpael von אזר bedeutet, sich zu gürten beziehungsweise sich bereitzumachen, im Kontext wohl zum Kampf. „Rüstet euch“ vermittelt dies knapp und idiomatisch, ohne den Kampf ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung der schwierigen Anfangsaufforderung רֹעוּ
  choice: 'Eine ironische Gerichtsaufforderung an die Völker: „Zerbrecht“'
  alternative: „Erhebt das Kriegsgeschrei“ oder „Schließt euch zusammen“
  rationale: Die wiederholte Ankündigung des Zusammenbruchs feindlicher Völker stützt die gewählte Lesart. Da die hebräische Form lexikalisch und textlich schwierig bleibt, werden konkurrierende Deutungen nicht ausgeschlossen, sondern in Fußnote [a] offengelegt.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit kurzen Imperativen und bewahrter dreifacher Wiederholung. „Zerbrecht“ ist bewusst eindringlich; die strittige Anfangslesart sowie das konkrete Bild des Sich-Gürtens werden in den Fußnoten dokumentiert.
