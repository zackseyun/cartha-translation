base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: de
  text: 'Und er wird auf die Erde[a] blicken, und siehe: Bedrängnis und Finsternis, Düsternis der Not; in tiefes Dunkel wird er verstoßen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf das Land«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische ist stark verdichtet. Die Schlussworte lauten etwa: »und tiefes Dunkel – ein Verstoßener«. Sie können so verstanden werden, dass der Blickende in tiefes Dunkel verstoßen wird.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶרֶץ
  choice: Erde
  rationale: אֶרֶץ kann »Erde« oder »Land« bedeuten. Im Zusammenhang mit dem vorausgehenden Blick nach oben und dem anschließenden Blick nach unten gibt »Erde« den räumlichen Gegensatz natürlich wieder; »Land« bleibt möglich.
- source_word: יַבִּיט
  choice: wird … blicken
  rationale: Das Hifil von נבט bezeichnet ein gerichtetes Schauen. »Blicken« ist im Deutschen natürlich und bewahrt den bewussten Blick auf die Erde.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die hinweisende Partikel lenkt feierlich die Aufmerksamkeit auf das Wahrgenommene. »Und siehe« bewahrt diese Funktion und den prophetisch-poetischen Ton.
- source_word: צָרָה
  choice: Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Drangsal. »Bedrängnis« passt zur knappen poetischen Reihung und zum folgenden Angstmotiv.
- source_word: חֲשֵׁכָה
  choice: Finsternis
  rationale: Das Wort bezeichnet Dunkelheit. »Finsternis« wahrt den gehobenen, aber verständlichen Ton und lässt Raum für die Steigerung durch אֲפֵלָה.
- source_word: מְעוּף צוּקָה
  choice: Dunkel der Angst
  rationale: 'Die seltene, komprimierte Verbindung wird wahrscheinlich als Konstruktverbindung verstanden: ein Dunkel beziehungsweise eine Düsternis, die von Angst oder Bedrängnis geprägt ist. Die knappe Nominalfügung erhält die poetische Verdichtung.'
- source_word: אֲפֵלָה
  choice: tiefes Dunkel
  rationale: אֲפֵלָה bezeichnet besonders dichte oder tiefe Finsternis. »Tiefes Dunkel« bringt die Intensivierung gegenüber חֲשֵׁכָה zum Ausdruck, ohne unnötig altertümlich zu wirken.
- source_word: מְנֻדָּח
  choice: wird er verstoßen
  rationale: Das passive Partizip im Maskulin Singular bezeichnet jemanden, der fortgetrieben oder verstoßen ist. Der im Hebräischen nur implizite Personenbezug wird im Deutschen mit »er« aufgenommen; אֲפֵלָה wird dabei als Ziel beziehungsweise Bereich des Verstoßens verstanden.
theological_decisions:
- issue: Bezug und syntaktische Funktion von מְנֻדָּח im Schlussglied
  choice: 'Die maskuline Singularform wird auf die zuvor blickende Person bezogen: »in tiefes Dunkel wird er verstoßen«.'
  alternative: 'Die Schlusswörter können aufgrund der stark komprimierten Syntax auch nominaler und weniger explizit wiedergegeben werden, etwa: »und tiefes Dunkel – ein Verstoßener«; eine Beziehung von מְנֻדָּח auf das feminine אֲפֵלָה ist grammatisch schwierig.'
  rationale: מְנֻדָּח ist maskulin Singular, während אֲפֵלָה feminin ist. Daher liegt ein impliziter männlicher Personenbezug näher als die Aussage, das Dunkel selbst werde vertrieben. Die zielgerichtete Wiedergabe mit »in« entspricht der verbreiteten adverbialen Deutung von אֲפֵלָה, wird wegen der elliptischen Syntax aber in einer Fußnote als unsicher kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knapper, nominaler Bildfolge. »Und siehe« erhält den feierlichen Hinweischarakter des Hebräischen; die seltene Schlusskonstruktion wird lesbar gemacht, ohne ihre Unsicherheit zu verschweigen.
