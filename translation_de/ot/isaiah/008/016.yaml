source:
  edition: WLC
  text: צ֖וֹר תְּעוּדָ֑ה חֲת֥וֹם תּוֹרָ֖ה בְּ/לִמֻּדָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: de
  text: Binde das Zeugnis zusammen; versiegle die Weisung unter meinen Schülern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter denen, die von mir unterwiesen sind“. Das hebräische Wort bezeichnet Menschen, die vom Sprecher belehrt worden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: Binde … zusammen
  rationale: Der Imperativ bezeichnet das Zusammenbinden beziehungsweise sichere Verwahren. Die Formulierung bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: תְּעוּדָה
  choice: das Zeugnis
  rationale: Das Wort bezeichnet ein Zeugnis oder eine Bezeugung und bezieht sich im Zusammenhang wahrscheinlich auf die zuvor ergangene prophetische Botschaft.
- source_word: חֲת֥וֹם
  choice: versiegle
  rationale: Der Imperativ meint das Versiegeln eines Schriftstücks und bewahrt sowohl das konkrete Bild als auch den Gedanken sicherer Verwahrung.
- source_word: תּוֹרָ֖ה
  choice: die Weisung
  rationale: תורה kann hier weiter gefasste prophetische Unterweisung bezeichnen und muss nicht auf einen Gesetzeskodex beschränkt werden. „Weisung“ ist würdig, verständlich und hält die Bedeutungsbreite offen.
- source_word: בְּ/לִמֻּדָֽ/י
  choice: unter meinen Schülern
  rationale: Das substantivierte Wort bezeichnet vom Sprecher Unterwiesene. „Schüler“ gibt diese Beziehung im modernen Deutschen natürlich wieder; ב wird als „unter“ im Sinn des Kreises dieser Unterwiesenen verstanden.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im prophetischen Zusammenhang
  choice: die Weisung
  alternative: das Gesetz; die Lehre
  rationale: „Weisung“ vermeidet eine unbegründete Verengung auf Gesetzesbestimmungen und lässt den wahrscheinlichen Bezug auf prophetische Unterweisung erkennen.
- issue: Bezug von „meinen“ in בְּלִמֻּדָי
  choice: meinen Schülern
  alternative: den von mir Unterwiesenen; meinen Unterwiesenen
  rationale: Der Possessivsuffix wird unmittelbar wiedergegeben, ohne die Identität des Sprechers über den hebräischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Imperative und das dokumentarische Bild des Bindens und Versiegelns bleiben erhalten. Die Stellung der Fußnote unmittelbar nach „Schülern“ kennzeichnet die betroffene Wendung.
