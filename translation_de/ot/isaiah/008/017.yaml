id: ISA.8.17
reference: Isaiah 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חִכִּ֨יתִי֙ לַ/יהוָ֔ה הַ/מַּסְתִּ֥יר פָּנָ֖י/ו מִ/בֵּ֣ית יַעֲקֹ֑ב וְ/קִוֵּ֖יתִֽי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: de
  text: Und ich will auf Jahwe warten, der sein Angesicht vor dem Haus Jakobs verbirgt[a], und auf ihn hoffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Partizip kann auch im Sinn von „der sein Angesicht fortwährend verbirgt“ oder „der sein Angesicht verborgen hat“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: Und ich will … warten
  rationale: חכה bezeichnet erwartungsvolles Warten. Die deutsche Wendung „auf … warten“ gibt die Ausrichtung auf Jahwe natürlich wieder, ohne den Zusatz „geduldig“ einzutragen.
- source_word: לַיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ל kennzeichnet hier den, auf den das Warten gerichtet ist. „Jahwe“ ist die im Deutschen geläufige Wiedergabe des Gottesnamens יהוה.
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: der sein Angesicht … verbirgt
  rationale: Die traditionelle, weiterhin verständliche Wendung bewahrt das hebräische Bild göttlicher Abwendung. Das Partizip wird präsentisch wiedergegeben, kann aber auch andauerndes oder charakteristisches Handeln bezeichnen.
- source_word: מִבֵּית יַעֲקֹב
  choice: vor dem Haus Jakob
  rationale: Bei „das Angesicht verbergen“ entspricht מִן im Deutschen idiomatisch „vor“. „Haus Jakob“ bewahrt die korporative biblische Bezeichnung für Jakobs Nachkommen.
- source_word: וְקִוֵּיתִי
  choice: und … hoffen
  rationale: קוה verbindet erwartungsvolles Warten mit Hoffnung. „hoffen“ unterscheidet die zweite Aussage von חכה und erhält zugleich den poetischen Parallelismus.
- source_word: לוֹ
  choice: auf ihn
  rationale: Die wörtliche Richtung „zu/für ihn“ wird im Deutschen mit dem Verb „hoffen“ idiomatisch durch „auf ihn“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen; die deutsche Form entspricht der üblichen Lautung.
- issue: Göttliches Verbergen des Angesichts
  choice: Das Bild „sein Angesicht verbergen“ bleibt erhalten.
  alternative: sich abwenden / seine Gunst entziehen
  rationale: Eine erklärende Umschreibung würde die im hebräischen Bild liegende bundestheologische Spannung bereits auslegen. Die Übersetzung bewahrt daher die Metapher.
- issue: Zeitlicher Aspekt des Partizips הַמַּסְתִּיר
  choice: 'Präsentisch: „verbirgt“'
  alternative: „verborgen hat“ oder „gerade verbirgt“
  rationale: Das hebräische Partizip kann gegenwärtiges, fortdauerndes oder charakteristisches Handeln ausdrücken. Das schlichte deutsche Präsens bewahrt diese Offenheit am besten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ und „Haus Jakob“ bewahren zentrale hebräische Bilder und die biblische Ausdrucksweise, ohne den Satz unnötig zu veralten.
