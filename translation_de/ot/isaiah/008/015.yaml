  text: וְ/כָ֥שְׁלוּ בָ֖/ם רַבִּ֑ים וְ/נָפְל֣וּ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: de
  text: Viele unter ihnen werden stolpern[a]; sie werden fallen und zerbrechen, in die Schlinge geraten und gefangen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Viele werden an ihnen stolpern“ beziehungsweise sinngemäß „Viele werden daran stolpern“, wenn sich das Pronomen auf die unmittelbar zuvor genannten Bilder vom Stein und von der Falle zurückbezieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: werden stolpern
  rationale: כשל bezeichnet hier im Zusammenhang mit dem Stein des Anstoßes ein Stolpern. Das Futur gibt die angekündigte Folge im Deutschen natürlich wieder.
- source_word: בָם
  choice: unter ihnen
  rationale: Die Präposition ב mit dem Suffix der 3. Person Plural kann hier auf Personen bezogen und idiomatisch mit „unter ihnen“ wiedergegeben werden. Der mögliche Rückbezug auf die unmittelbar zuvor genannten Bilder bleibt in einer Fußnote erhalten.
- source_word: רַבִּים
  choice: Viele
  rationale: רַבִּים steht substantivisch und bedeutet schlicht „viele“; die gemeinten Menschen ergeben sich aus dem Zusammenhang.
- source_word: וְנָפְלוּ
  choice: sie werden fallen
  rationale: נפל ist das gewöhnliche Verb für „fallen“. Das erneut gesetzte Pronomen macht die Abfolge im Deutschen klar.
- source_word: וְנִשְׁבָּרוּ
  choice: zerbrechen
  rationale: Der Nifal von שבר bezeichnet das Gebrochenwerden. Nach „fallen“ ist das deutsche „zerbrechen“ natürlich und bewahrt das konkrete Bild.
- source_word: וְנוֹקְשׁוּ
  choice: in die Schlinge geraten
  rationale: Der Nifal von יקשׁ bezeichnet das Verstrickt- oder Gefangenwerden in einer Schlinge. Die Formulierung hält das Fallenbild konkret und unterscheidet es vom folgenden Gefangenwerden.
- source_word: וְנִלְכָּדוּ
  choice: gefangen werden
  rationale: לכד bedeutet „fangen, ergreifen“. „Gefangen werden“ bildet den abschließenden Schritt der hebräischen Folge ab.
theological_decisions:
- issue: Bildhafte Gerichtssprache im Zusammenhang mit dem Stein des Anstoßes
  choice: Die konkrete Folge von Stolpern, Fallen, Zerbrechen, In-die-Schlinge-Geraten und Gefangenwerden bleibt erhalten.
  alternative: Die Aussage verallgemeinernd als Untergang oder geistlichen Fall wiederzugeben.
  rationale: Der Vers führt die konkreten Bilder des unmittelbaren Zusammenhangs weiter. Eine abstrakte Umschreibung würde die Bildkraft und die theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, rhythmische Abfolge des Hebräischen bleibt gewahrt; ungebräuchliche oder konfessionell geprägte Formulierungen werden vermieden.
