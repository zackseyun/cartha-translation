source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י וְ/הַ/יְלָדִים֙ אֲשֶׁ֣ר נָֽתַן לִ֣/י יְהוָ֔ה לְ/אֹת֥וֹת וּ/לְ/מוֹפְתִ֖ים בְּ/יִשְׂרָאֵ֑ל מֵ/עִם֙ יְהוָ֣ה צְבָא֔וֹת הַ/שֹּׁכֵ֖ן בְּ/הַ֥ר צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: de
  text: Siehe, ich und die Kinder, die Jahwe mir gegeben hat, sind als Zeichen und Wunder in Israel, von Jahwe der Heerscharen[a], der auf dem Berg Zion wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Jahwe Zebaot“; sinngemäß: „Jahwe der Heere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die traditionelle, weiterhin verständliche Aufmerksamkeitspartikel bewahrt den deiktischen und prophetischen Nachdruck.
- source_word: אָנֹכִי וְהַיְלָדִים
  choice: ich und die Kinder
  rationale: Das selbstständige Pronomen hebt Jesaja hervor; „Kinder“ gibt יְלָדִים im familiären Zusammenhang angemessen und ohne unnötige Verengung wieder.
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: die Jahwe mir gegeben hat
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortdauernder Bedeutung; „Jahwe“ gibt den Gottesnamen wieder.
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: sind Zeichen und Wunder
  rationale: Die beiden ל-Präpositionen bezeichnen Funktion bzw. Bestimmung. Im Deutschen drückt die prädikative Formulierung dies natürlicher aus als „sind zu Zeichen und Wundern“.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition wird am naheliegendsten lokal beziehungsweise im Sinn von „innerhalb Israels“ verstanden.
- source_word: מֵעִם
  choice: die von … kommen
  rationale: מֵעִם bezeichnet Herkunft von einer Person. Der Relativsatz macht im Deutschen klar, dass Zeichen und Wunder ihren Ursprung bei Jahwe haben, und vermeidet die missverständliche Folge „in Israel von Jahwe“.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Heerscharen“ gibt צְבָאוֹת als festen Gottesbeiname würdig und im Deutschen vertraut wieder, ohne den Eigennamen durch „HERR“ zu ersetzen.
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  choice: der auf dem Berg Zion wohnt
  rationale: Das Partizip bezeichnet ein fortdauerndes, charakteristisches Wohnen; bei einem Berg ist „auf“ im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von מֵעִם יְהוָה צְבָאוֹת
  choice: Die Zeichen und Wunder kommen von Jahwe der Heerscharen.
  alternative: Jesaja und die Kinder sind von Jahwe her Zeichen und Wunder.
  rationale: Beide Deutungen laufen sachlich eng zusammen. Der Relativsatz bindet die Herkunft im Deutschen klar an „Zeichen und Wunder“, ohne die Aussage über Jesaja und seine Kinder als deren Träger aufzulösen.
- issue: Bedeutung von אֹתוֹת וּמוֹפְתִים
  choice: Zeichen und Wunder
  alternative: Zeichen und Mahnmale
  rationale: Die feste Wortverbindung kann außergewöhnliche Zeichen oder Vorzeichen bezeichnen. „Wunder“ erhält die semantische Weite und legt nicht ausschließlich Warnung oder ein spektakuläres Mirakel fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält bewusst den prophetischen Aufmerksamkeitsruf. Die Satzstellung wurde leicht expliziert, damit die Herkunftsangabe מֵעִם im Deutschen eindeutig und flüssig ist.
