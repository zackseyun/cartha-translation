source:
  edition: WLC
  text: וְ/הָיָ֖ה לְ/מִקְדָּ֑שׁ וּ/לְ/אֶ֣בֶן נֶ֠גֶף וּ/לְ/צ֨וּר מִכְשׁ֜וֹל לִ/שְׁנֵ֨י בָתֵּ֤י יִשְׂרָאֵל֙ לְ/פַ֣ח וּ/לְ/מוֹקֵ֔שׁ לְ/יוֹשֵׁ֖ב יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: de
  text: Und er wird zum Heiligtum werden,[a] aber für die beiden Häuser Israels zum Stein, an den man stößt, und zum Felsen, über den man stolpert, zur Falle und zur Schlinge für die Bewohner Jerusalems.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem heiligen Ort“. „Heiligtum“ kann hier neben dem kultischen Sinn auch Schutz und Zuflucht anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „für den Bewohner Jerusalems“; die Einzahl hat hier kollektiven Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und er wird … werden
  rationale: Die Form trägt im prophetischen Zusammenhang Zukunftssinn. „Werden“ gibt den Übergang in die nachfolgend genannten Rollen natürlich wieder.
- source_word: לְמִקְדָּשׁ
  choice: zum Heiligtum
  rationale: „Heiligtum“ bewahrt sowohl den kultisch-heiligen als auch den im Kontext mitschwingenden schützenden Sinn, ohne auf „Zuflucht“ verengt zu werden.
- source_word: אֶבֶן נֶגֶף
  choice: zum Stein, an den man stößt
  rationale: Die Formulierung gibt den verursachten Anstoß konkret wieder und unterscheidet ihn vom folgenden מִכְשׁוֹל, das ausdrücklich als Stolpern wiedergegeben wird.
- source_word: צוּר מִכְשׁוֹל
  choice: zum Felsen, über den man stolpert
  rationale: Die konkrete Felsenmetapher und der Sinn eines Hindernisses, das zum Stolpern bringt, bleiben erhalten.
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: für die beiden Häuser Israels
  rationale: Die Wendung bewahrt die ausdrückliche Zweizahl und den historischen Bezug auf die beiden israelitischen Reiche beziehungsweise Häuser.
- source_word: לְפַח
  choice: zur Falle
  rationale: פַּח bezeichnet eine Falle, häufig eine Vogelfalle; „Falle“ ist im modernen Deutsch klar und allgemein verständlich.
- source_word: וּלְמוֹקֵשׁ
  choice: zum Fangnetz
  rationale: „Fangnetz“ unterscheidet den Ausdruck von פַּח und bewahrt das Bild eines einfangenden beziehungsweise verstrickenden Fanggeräts.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: für die Bewohner Jerusalems
  rationale: Das singularische Partizip wird kollektiv gebraucht. Der natürliche deutsche Plural macht diesen Kollektivsinn verständlich, ohne den Umfang der Aussage zu verändern.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in וְהָיָה
  choice: Das deutsche Pronomen „er“ verweist im unmittelbaren Kontext auf den HERRN aus Jesaja 8,13.
  alternative: Ein unpersönlicher oder abstrakter Bezug auf die prophetische Botschaft.
  rationale: Der HERR der Heerscharen ist der nächstliegende kontextuelle Bezug. Die Übersetzung setzt dennoch nicht erklärend „der HERR“ ein, sondern wahrt mit „er“ die Ausdrucksweise und ihre Kontextabhängigkeit.
- issue: Spannung zwischen Schutz und Gericht
  choice: „Heiligtum“ wird der Reihe von Stein, Felsen, Falle und Fangnetz mit „aber“ gegenübergestellt.
  alternative: „Heiligtum“ als „Zuflucht“ auslegen und die übrigen Bilder als bloße menschliche Reaktion abschwächen.
  rationale: Der Text verbindet beim selben Handelnden Schutz beziehungsweise Heiligkeit und gerichtliches Verhängnis. Diese theologische Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen konkreten Bilder bleiben erhalten; „aber“ macht die im Zusammenhang erkennbare Spannung zwischen Heiligtum und Gericht verständlich. Die Satzstellung ordnet „für die beiden Häuser Israels“ eindeutig den Stein- und Felsenbildern zu, während „für die Bewohner Jerusalems“ Falle und Fangnetz zugeordnet bleibt.
