source:
  edition: WLC
  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: de
  text: 'Da näherte ich mich der Prophetin. Sie wurde schwanger und gebar einen Sohn. Darauf sagte Jahwe zu mir: »Gib ihm den Namen Maher-Schalal-Hasch-Bas[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Name bedeutet wahrscheinlich etwa: »Schnell zur Beute, rasch zum Raub.«'
    reason: Der symbolische Name trägt eine für den Zusammenhang wesentliche Bedeutung, deren genaue syntaktische Nuance im Hebräischen nicht völlig eindeutig ist.
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: Da näherte ich mich
  rationale: קרב bedeutet »sich nähern/herantreten«. Im Zusammenhang ist die Formulierung eine zurückhaltende Umschreibung für ehelichen Verkehr; die Übersetzung bewahrt diese indirekte Ausdrucksweise.
- source_word: הַנְּבִיאָה
  choice: der Prophetin
  rationale: Das feminine Substantiv bezeichnet ausdrücklich eine weibliche prophetische Person; »Prophetin« ist die natürliche deutsche Entsprechung.
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: הרה kann »empfangen« oder »schwanger werden« bedeuten. »Sie wurde schwanger« ist im heutigen Deutsch klar und natürlich.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: Die knappe Formulierung bildet die hebräische Erzählfolge präzise und in würdigem Deutsch ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: קְרָא שְׁמוֹ
  choice: Gib ihm den Namen
  rationale: Die hebräische Namengebungsformel lautet wörtlich »Rufe seinen Namen«. Die gewählte deutsche Wendung gibt ihre Funktion natürlich und genau wieder.
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: Maher-Schalal-Hasch-Bas
  rationale: Die Wortfolge dient als symbolischer Eigenname und wird deshalb im Haupttext transliteriert; ihre sinngemäße Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Soll der sexuelle Sinn von וָאֶקְרַב ausdrücklich gemacht werden?
  choice: Die zurückhaltende Formulierung »näherte ich mich« bleibt erhalten.
  alternative: »Ich schlief mit der Prophetin« oder »Ich hatte Verkehr mit der Prophetin«
  rationale: Der Zusammenhang weist auf ehelichen Verkehr, doch der hebräische Text spricht nur vom Sich-Nähern. Eine ausdrückliche Paraphrase würde die Zurückhaltung des Ausgangstextes aufheben.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname יהוה. Die Transliteration wahrt den Unterschied zwischen Name und Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge wird durch »Da« und »Darauf« flüssig gestaltet; die knappen Sätze vermeiden schwerfällige Reihungen. Die verhüllende Ausdrucksweise des Hebräischen bleibt erhalten.
