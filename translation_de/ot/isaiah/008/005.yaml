  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Und Jahwe fügte hinzu, weiter zu mir zu reden, und sagte.“ Die hebräische Wendung bedeutet hier: „Jahwe sprach erneut zu mir.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... עוֹד
  choice: noch einmal
  rationale: Die Verbindung bezeichnet eine erneute Handlung. „Noch einmal“ gibt die Wiederholung im heutigen Deutsch natürlich wieder, ohne das hebräische Idiom wörtlich nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: דַּבֵּר אֵלַי
  choice: sprach ... zu mir
  rationale: דבר mit אֶל bezeichnet hier das an den Propheten gerichtete Reden; „zu mir sprechen“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Der Infinitiv leitet die in Vers 6 folgende direkte Rede ein. Im Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion und entspricht der üblichen deutschen Transkription.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der Doppelpunkt weist voraus auf die direkte Rede im folgenden Vers.
