base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: „Nimm dir eine große Tafel und schreibe darauf mit einem gewöhnlichen Griffel[a]: »Maher-Schalal-Hasch-Bas[b]«.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Griffel eines Menschen“, „mit einem allgemein gebräuchlichen Griffel“ oder „in allgemein lesbarer Schrift“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch Maher-Schalal-Hasch-Bas, wahrscheinlich: „Schnell zur Beute, rasch zum Raub.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Transkription.
- source_word: גִּלָּיוֹן גָּדוֹל
  choice: eine große Tafel
  rationale: גִּלָּיוֹן bezeichnet hier eine größere Schreibfläche; „Tafel“ passt zum öffentlichen, deutlich sichtbaren Beschriften, ohne das Material näher festzulegen.
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Die reflexive Nuance von לְךָ wird in natürlichem Deutsch knapp bewahrt.
- source_word: וּכְתֹב עָלָיו
  choice: und schreibe darauf
  rationale: Direkte und idiomatische Wiedergabe des Imperativs mit der Präpositionalverbindung.
- source_word: בְּחֶרֶט אֱנוֹשׁ
  choice: mit einem gewöhnlichen Griffel
  rationale: חֶרֶט ist ein Schreib- oder Ritzgerät; אֱנוֹשׁ kann in dieser Verbindung auf allgemein menschlichen beziehungsweise gewöhnlichen Gebrauch weisen. Da die genaue Bedeutung unsicher ist, werden Alternativen in einer Fußnote genannt.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Maher-Schalal-Hasch-Bas
  rationale: Die Wortfolge dient im Zusammenhang als symbolischer Eigenname und wird deshalb im Haupttext transkribiert; ihre Bedeutung wird in einer Fußnote erschlossen.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Da sagte ... zu mir
  rationale: „Da“ gibt den erzählerischen Fortgang des Waw-Konsekutivs in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese Unterscheidung.
- issue: Übersetzung oder Transkription von לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Transkription als symbolischer Eigenname im Haupttext
  alternative: „Schnell zur Beute, rasch zum Raub“ im Haupttext
  rationale: Im folgenden Zusammenhang wird die Wortfolge als Name verwendet. Die Transkription wahrt diese Funktion, während die Fußnote den bedeutungsvollen Wortlaut sichtbar macht.
- issue: Bedeutung von אֱנוֹשׁ in בְּחֶרֶט אֱנוֹשׁ
  choice: gewöhnlich/allgemein menschlich
  alternative: wörtlicher „mit dem Griffel eines Menschen“ oder funktional „in allgemein lesbarer Schrift“
  rationale: Die Wendung ist mehrdeutig. Der Haupttext bietet eine plausible idiomatische Deutung, ohne die anderen Möglichkeiten durch Verschweigen auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am hebräischen Erzählstil, klingt aber natürlich. Die Deutung der unsicheren Wendung בְּחֶרֶט אֱנוֹשׁ und die Bedeutung des symbolischen Namens werden in Fußnoten offengehalten beziehungsweise erläutert.
