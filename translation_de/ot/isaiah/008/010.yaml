id: ISA.8.10
reference: Isaiah 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֻ֥צוּ עֵצָ֖ה וְ/תֻפָ֑ר דַּבְּר֤וּ דָבָר֙ וְ/לֹ֣א יָק֔וּם כִּ֥י עִמָּ֖/נוּ אֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: de
  text: Fasst einen Plan, und er wird vereitelt; sprecht ein Wort, und es wird keinen Bestand haben, denn Gott ist mit uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn mit uns ist Gott“. Das klingt an den Namen Immanuel („Gott mit uns“) in Jesaja 7,14 und 8,8 an.'
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: Fasst einen Plan
  rationale: Die Verbindung aus Imperativ und dem verwandten Substantiv bezeichnet das Planen beziehungsweise Beschließen. „Einen Plan fassen“ ist im modernen Deutschen natürlich und bewahrt den herausfordernden Ton gegenüber den Gegnern.
- source_word: וְתֻפָר
  choice: und er wird vereitelt
  rationale: Der Nifal von פרר bezeichnet hier, dass der Plan zunichtegemacht oder unwirksam wird. „Vereitelt“ passt idiomatisch zu „Plan“.
- source_word: דַּבְּרוּ דָבָר
  choice: sprecht ein Wort
  rationale: Die Wiedergabe erhält die Wortfigur aus dem Verb דבר und dem Substantiv דָבָר sowie den Parallelismus zur ersten Vershälfte.
- source_word: וְלֹא יָקוּם
  choice: und es wird keinen Bestand haben
  rationale: קום bedeutet hier, dass etwas Bestand gewinnt oder sich durchsetzt. Die Formulierung ist natürlich und lässt offen, ob an einen Ausspruch, Beschluss oder dessen Verwirklichung gedacht ist.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für das Scheitern der feindlichen Pläne und Worte ein.
- source_word: עִמָּנוּ אֵל
  choice: Gott ist mit uns
  rationale: Die hebräische Nominalklausel lautet wörtlich „mit uns [ist] Gott“. Die deutsche Satzform gibt ihren Sinn klar wieder und erhält ihr theologisches Gewicht.
theological_decisions:
- issue: Beziehung von עִמָּנוּ אֵל zum Immanuel-Motiv in Jesaja 7–8
  choice: Im Haupttext als Aussage „Gott ist mit uns“ wiedergeben und den Anklang an Immanuel in einer Fußnote kenntlich machen.
  alternative: „denn Immanuel“ oder „denn mit uns ist Gott“
  rationale: Der Ausdruck greift deutlich den Namen Immanuel aus Jesaja 7,14 und 8,8 auf, steht hier im Hebräischen jedoch als Wortgruppe עִמָּנוּ אֵל und nicht als zusammengeschriebener Eigenname. Daher wird die Aussage übersetzt, ohne sie im Haupttext zum Namen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Befehlsstruktur und der herausfordernde Ton des hebräischen Verses bleiben erhalten; die Satzglieder sind knapp und rhythmisch formuliert.
