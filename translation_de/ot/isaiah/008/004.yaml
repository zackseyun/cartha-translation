    rationale: „Tragen“ ist semantisch möglich, doch bei geraubten Gütern, die zum König gebracht werden, ist „bringen“ im modernen Deutschen die natürlichere allgemeine Entsprechung. Das unpersönliche „man“ bleibt als Wiedergabe des nicht benannten Handlungsträgers erhalten.
