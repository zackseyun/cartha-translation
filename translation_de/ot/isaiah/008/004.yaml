source:
  edition: WLC
  text: כִּ֗י בְּ/טֶ֨רֶם֙ יֵדַ֣ע הַ/נַּ֔עַר קְרֹ֖א אָבִ֣/י וְ/אִמִּ֑/י יִשָּׂ֣א אֶת חֵ֣יל דַּמֶּ֗שֶׂק וְ/אֵת֙ שְׁלַ֣ל שֹׁמְר֔וֹן לִ/פְנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: de
  text: Denn bevor der Junge »Mein Vater« und »Meine Mutter« zu sagen weiß, wird man den Reichtum von Damaskus und die Beute Samarias vor den König von Assyrien bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Zeichens ein.
- source_word: בְּטֶרֶם
  choice: noch bevor
  rationale: Bezeichnet klar, dass das angekündigte Ereignis vor dem genannten Entwicklungsschritt des Kindes eintreten wird.
- source_word: יֵדַע ... קְרֹא
  choice: rufen kann
  rationale: Die Verbindung von ידע mit dem Infinitiv bezeichnet hier die Fähigkeit, die Eltern mit diesen Worten anzurufen; die knappe deutsche Form ist natürlich und bewahrt den Sinn.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Bewahrt Genus und bestimmten Artikel; der Kontext zeigt, dass ein noch sehr junges Kind gemeint ist, ohne den Referenten im Vers ausdrücklich festzulegen.
- source_word: אָבִי וְאִמִּי
  choice: »Mein Vater« und »Meine Mutter«
  rationale: Gibt die ausdrücklich possessiven hebräischen Formen genau wieder, ohne sie durch familiärere Ausdrücke wie »Papa« und »Mama« auszudeuten.
- source_word: יִשָּׂא
  choice: wird man ... tragen
  rationale: Die aktive Form hat einen unbestimmten menschlichen Handlungsträger. Das deutsche unpersönliche »man« bewahrt dies besser als ein Passiv und ergänzt keinen ausdrücklich genannten Akteur.
- source_word: חֵיל
  choice: Reichtum
  rationale: Im Parallelismus mit der Kriegsbeute bezeichnet das mehrdeutige Wort hier am ehesten Vermögen oder wertvolle Ressourcen, nicht das Heer.
- source_word: שְׁלַל
  choice: Beute
  rationale: Natürliche moderne Bezeichnung für im Krieg weggenommene Güter.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: vor den König von Assyrien
  rationale: Mit dem Bewegungsverb »tragen« gibt »vor den König« die räumlich-direktionale Wendung idiomatisch wieder und lässt offen, ob eine förmliche Übergabe gemeint ist.
theological_decisions:
- issue: Identität des Jungen
  choice: Im Text steht lediglich »der Junge«.
  alternative: Ausdrückliche Identifikation als Jesajas Sohn Maher-Schalal-Hasch-Bas oder als umfassenderes prophetisches Zeichen.
  rationale: Der unmittelbare Zusammenhang legt Jesajas Sohn nahe, doch der Vers selbst nennt nur »den Jungen«. Die Übersetzung soll diese Identifikation nicht in den Wortlaut eintragen.
- issue: Träger der Beute
  choice: Ein unbestimmtes »man« bleibt Subjekt.
  alternative: Ausdrückliche Benennung des Königs von Assyrien oder seiner Truppen als Handelnde.
  rationale: Die hebräische Verbform ist aktiv, nennt aber keinen konkreten Täter. Obwohl der Zusammenhang Assyrien nahelegt, wird diese Folgerung nicht als ausdrückliche Angabe in den Text aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig, bleibt aber eng am hebräischen Aufbau. Die wörtlichen Kindesworte werden mit deutschen Anführungszeichen markiert; unnötig altertümliche Wörter werden vermieden.
