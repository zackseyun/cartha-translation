source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֧ר יְהוָ֛ה אֵלַ֖/י כְּ/חֶזְקַ֣ת הַ/יָּ֑ד וְ/יִסְּרֵ֕/נִי מִ/לֶּ֛כֶת בְּ/דֶ֥רֶךְ הָֽ/עָם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: de
  text: 'Denn so sprach Jahwe zu mir, während seine Hand machtvoll auf mir lag[a] und er mich eindringlich anwies[b], nicht auf dem Weg dieses Volkes zu gehen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „bei der Stärke der Hand“. Gemeint sein kann, dass Jahwes Hand machtvoll auf dem Propheten lag oder ihn mit Nachdruck ergriff.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch „zurechtweisen“, „unterweisen“, „erziehen“ oder „warnen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so sprach
  rationale: כִּי führt hier eine Begründung bzw. Erläuterung ein; כֹה אָמַר ist die übliche prophetische Redeformel. „Denn so sprach“ bewahrt Zusammenhang und Würde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּחֶזְקַת הַיָּד
  choice: während seine Hand machtvoll auf mir lag
  rationale: Die Formulierung bewahrt das Handbild und bringt die nachdrückliche, überwältigende Einwirkung zum Ausdruck, ohne sie auf bloße körperliche Gewalt zu verengen.
- source_word: וְיִסְּרֵנִי
  choice: und er mich eindringlich anwies
  rationale: יסר umfasst Zurechtweisung, Unterweisung, Erziehung und Warnung. Im Zusammenhang leitet das Verb ein Verbot ein; „eindringlich anwies“ hält sowohl den unterweisenden als auch den mahnenden Sinn offen.
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: nicht auf dem Weg … zu gehen
  rationale: Die Konstruktion bezeichnet das Abhalten von einem Verhalten. „Weg“ und „gehen“ erhalten das hebräische Bild für Lebensweise und Handeln.
- source_word: הָעָם הַזֶּה
  choice: dieses Volkes
  rationale: Der kollektive Singular und die demonstrative Distanz des Hebräischen werden direkt bewahrt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt zeigt an, dass der Inhalt der göttlichen Weisung im folgenden Vers einsetzt; ein zusätzliches „indem er sagte“ wäre im Deutschen schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Einwirkung in כְּחֶזְקַת הַיָּד
  choice: während seine Hand machtvoll auf mir lag
  alternative: mit starker Hand
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen machtvoller prophetischer Ergriffenheit, Zwang und Bekräftigung. Die genauere Nuance des knappen hebräischen Ausdrucks bleibt in der Fußnote offen.
- issue: Bedeutungsumfang von יסר
  choice: eindringlich anwies
  alternative: warnte / züchtigte / unterwies
  rationale: Der Kontext enthält ein Verbot, doch das Verb kann zugleich erzieherische Zurechtweisung oder Unterweisung bezeichnen. Die Übersetzung vermeidet eine unnötige Festlegung auf Strafzüchtigung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Bild von Hand, Weg und Gehen bleibt erhalten. Der abschließende Doppelpunkt berücksichtigt, dass die direkte Rede erst in Vers 12 folgt.
