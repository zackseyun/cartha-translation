  text: יַ֗עַן כִּ֤י מָאַס֙ הָ/עָ֣ם הַ/זֶּ֔ה אֵ֚ת מֵ֣י הַ/שִּׁלֹ֔חַ הַ/הֹלְכִ֖ים לְ/אַ֑ט וּ/מְשׂ֥וֹשׂ אֶת רְצִ֖ין וּ/בֶן רְמַלְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: de
  text: Weil dieses Volk das Wasser von Schiloach, das sanft dahinfließt,[a] verworfen hat und sich über Rezin und den Sohn Remaljas freut,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schiloach ist die hebräische Namensform; in der griechischen Überlieferung lautet der Name Siloam.
    reason: lexical_alternative
  - marker: b
    text: 'Oder, nach einer schwierigen Deutung: „und vor Rezin und dem Sohn Remaljas zittert“. Der hebräische Text lautet „sich freut“; aufgrund des Zusammenhangs wird die Stelle teilweise anders verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Die Verbindung leitet den Grund für das im folgenden Vers angekündigte Gericht ein; „weil“ gibt die kausale Funktion natürlich und präzise wieder.
- source_word: מָאַס
  choice: verworfen hat
  rationale: Das Verb bezeichnet entschiedene Zurückweisung. „Verworfen hat“ bewahrt die deutliche Aussage, ohne den emotionalen Aspekt von „verachtet“ überzubetonen.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die singularische hebräische Wendung und der prophetische Sprachgebrauch werden unmittelbar bewahrt.
- source_word: מֵי הַשִּׁלֹחַ
  choice: das Wasser von Schiloach
  rationale: Der hebräische Name wird direkt als „Schiloach“ wiedergegeben. Der kollektive Singular „Wasser“ klingt im Deutschen bei einer Wasserquelle natürlicher als „die Wasser“.
- source_word: הַהֹלְכִים לְאַט
  choice: das sanft dahinfließt
  rationale: Wörtlich geht das Wasser langsam oder leise; „sanft dahinfließt“ ist idiomatisch und wahrt den Kontrast zum mächtigen Strombild des nächsten Verses.
- source_word: וּמְשׂוֹשׂ
  choice: und sich über … freut
  rationale: Der masoretische Text weist auf die Wurzel שׂושׂ, „sich freuen/jubeln“. Die natürliche deutsche Verbindung „sich über jemanden freuen“ bewahrt diese Lesart, ohne die kontextbedingte Schwierigkeit zu verdecken.
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: über Rezin und den Sohn Remaljas
  rationale: Die Personennamen werden aus dem Hebräischen wiedergegeben. „Der Sohn Remaljas“ erhält die distanzierende hebräische Bezeichnung Pekachs, ohne den Namen erklärend einzusetzen.
theological_decisions:
- issue: Deutung von וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ im schwierigen Kontext
  choice: Den masoretischen Text als „und sich über Rezin und den Sohn Remaljas freut“ wiedergeben.
  alternative: „und vor Rezin und dem Sohn Remaljas zittert“ beziehungsweise „in Furcht vergeht“
  rationale: Die überlieferte hebräische Form wird am naheliegendsten von שׂושׂ („sich freuen, jubeln“) abgeleitet. Eine negative Deutung kann den Kontext glätten, ersetzt aber die vorliegende Lesart durch eine unsichere Umdeutung; deshalb steht sie nur in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Begründungssatz offen, da er syntaktisch in den folgenden Vers hineinführt. Die Fußnotenmarker stehen jeweils unmittelbar nach der zugehörigen Aussage.
