  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Bewegungs- und Flutverben sachgerecht wieder: das Vordringen nach Juda, Überfluten, Durchziehen und Erreichen bis an den Hals. Auch der abrupte Bildwechsel zu den ausgebreiteten Flügeln bleibt erhalten. »Immanuel« ist vertretbar als direkte Anrede und bewahrt den Bezug zu Jesaja 7,14, ohne die referenzielle bzw. theologische Spannung aufzulösen.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Satzgliederung mit Semikolon bildet den poetisch-prophetischen Duktus natürlich ab. »Die Ausbreitung seiner Flügel« ist etwas gehoben, aber im Register passend und präzise.
  terminology: »Juda«, »Immanuel« und die Namensfußnote sind konsistent. »Bis an den Hals« bewahrt die bildhafte Aussage einer existenziellen Bedrohung, ohne eine vollständige Vernichtung hineinzulesen. Die Fußnotenmarke ist korrekt am Namen verankert.
