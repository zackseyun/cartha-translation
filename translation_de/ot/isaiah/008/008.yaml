id: ISA.8.8
reference: Isaiah 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: de
  text: Er wird nach Juda vordringen, es überfluten und durchziehen; bis an den Hals wird er reichen. Die Ausbreitung seiner Flügel wird die ganze Breite deines Landes füllen, Immanuel[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Immanuel bedeutet »Gott ist mit uns«.
    reason: Bedeutung des hebräischen Namens
lexical_decisions:
- source_word: וְחָלַף בִּיהוּדָה
  choice: Er wird nach Juda vordringen
  rationale: Im Bild des über die Ufer tretenden Stromes bezeichnet das Verb eine vorwärtsgerichtete Bewegung. »Nach Juda vordringen« gibt die Richtungsbedeutung der Präposition und die bedrohliche Bewegung natürlich wieder.
- source_word: שָׁטַף וְעָבַר
  choice: es überfluten und durchziehen
  rationale: 'Die beiden Verben führen das Flutbild fort: Der Strom überschwemmt Juda und zieht durch das Land. Das Pronomen »es« macht im Deutschen den Bezug auf Juda deutlich.'
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: bis an den Hals wird er reichen
  rationale: Die Formulierung bewahrt das Bild einer beinahe vollständigen Überflutung und damit äußerster Gefahr, ohne völlige Vernichtung auszusagen.
- source_word: מֻטּוֹת כְּנָפָיו
  choice: die Ausbreitung seiner Flügel
  rationale: Die Wendung bezeichnet das Ausstrecken beziehungsweise die Spannweite der Flügel. »Ausbreitung« erhält den Wechsel vom Flut- zum Flügelbild und die Vorstellung umfassender Ausdehnung.
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: wird die ganze Breite deines Landes füllen
  rationale: Die Wiedergabe folgt dem räumlichen Bild des hebräischen Textes und vermeidet die stärker deutende Paraphrase »dein ganzes Land bedecken«.
- source_word: עִמָּנוּ אֵל
  choice: Immanuel
  rationale: Die Wendung wird als Name und direkte Anrede verstanden, in literarischer Verbindung zu Jesaja 7,14. Der Name wird transliteriert; seine Bedeutung steht in der Fußnote.
theological_decisions:
- issue: Ob עִמָּנוּ אֵל als Eigenname oder als Aussage »Gott ist mit uns« wiederzugeben ist
  choice: Im Haupttext als direkte Anrede mit dem Namen »Immanuel«
  alternative: »Gott ist mit uns« beziehungsweise »Gott-mit-uns«
  rationale: Jesaja 7,14 hat die Wendung bereits als Namen eingeführt. Die Namensform wahrt diesen literarischen Zusammenhang und lässt zugleich die Spannung offen, wer hier angeredet wird; die Namensbedeutung wird in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kraftvolle Flutbild und der anschließende Wechsel zum Flügelbild bleiben erhalten. Die direkte Anrede wird ohne das im heutigen Deutsch unnatürliche vokativische »O« formuliert.
