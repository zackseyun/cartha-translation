    rationale: Die Fußnote ist nicht falsch, aber für die Textverständlichkeit nicht nötig und ihr Anker an „gegen sie heraufkommen“ ist weniger präzise als die Apposition selbst. Die notwendige geographische Erläuterung zu „dem Strom“ bleibt erhalten.
