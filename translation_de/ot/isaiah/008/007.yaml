    rationale: Die Formulierung deutet „viele/reiche“ als Art des Strömens und ergänzt damit einen Aspekt, den die zwei Adjektive nicht ausdrücklich enthalten. „Mächtige und viele“ bewahrt Kraft und Menge getrennt.
  - severity: low
    issue: „Pracht“ für כָּל־כְּבוֹדוֹ
    rationale: „Pracht“ kann passen, ist aber stärker auf sichtbaren Glanz beschränkt. „Herrlichkeit“ entspricht dem breiteren Umfang von כבוד, einschließlich königlicher Machtentfaltung.
  - severity: low
