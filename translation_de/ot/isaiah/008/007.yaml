source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: de
  text: 'Darum, siehe: Der Herr lässt die mächtigen und vielen Wasser des Stromes[a] gegen sie heraufkommen – den König von Assyrien und seine ganze Herrlichkeit. Und er wird über alle seine Flussrinnen steigen und über alle seine Ufer treten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »dem Strom« ist wahrscheinlich der Euphrat gemeint, der große, mit Assyrien verbundene Strom.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der zuvor geschilderten Zurückweisung der sanft fließenden Wasser von Schiloach.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden und vergegenwärtigenden Charakter des prophetischen Ausdrucks in würdigem, verständlichem Deutsch.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den hier verwendeten Herrschertitel wieder; im Hebräischen steht nicht der Gottesname JHWH.
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: lässt ... gegen sie heraufkommen
  rationale: Der Partizipialausdruck schildert das Handeln als unmittelbar bevorstehend oder bereits im Gang; zugleich bleibt das Bild des steigenden Wassers erhalten.
- source_word: מֵי הַנָּהָר
  choice: die ... Wasser des Stromes
  rationale: Der bestimmte Ausdruck »der Strom« bleibt erhalten, ohne den im Kontext wahrscheinlichen Euphrat ausdrücklich in den Haupttext einzutragen.
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: die mächtigen und reichlich strömenden Wasser
  rationale: Die Wiedergabe unterscheidet Kraft und Fülle der Wasser und formuliert zugleich natürliches Deutsch.
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: den König von Assyrien und seine ganze Pracht
  rationale: Die Apposition deutet das Hochwasserbild auf den assyrischen König und die volle Entfaltung seiner imperialen Macht; »Pracht« gibt כבוד in diesem königlichen Zusammenhang natürlich wieder.
- source_word: אֲפִיקָיו
  choice: seine Flussrinnen
  rationale: Bezeichnet die Rinnen beziehungsweise natürlichen Wasserläufe, die der anschwellende Strom ausfüllt und überschreitet.
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: über alle seine Ufer treten
  rationale: Gibt das Bild eines Stromes wieder, der seine gewöhnlichen Grenzen überschreitet.
theological_decisions:
- issue: Identität der heraufkommenden Wasser
  choice: Die Wasser bleiben als Hochwasserbild stehen und werden durch die hebräische Apposition mit dem König von Assyrien und seiner Pracht identifiziert.
  alternative: Das Bild ausschließlich als wörtliche Flussbeschreibung oder ausschließlich als direkte Benennung des assyrischen Heeres wiederzugeben.
  rationale: Der Ausgangstext verbindet Bild und Deutung ausdrücklich; die Übersetzung bewahrt beides, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Bezug des männlichen Singularpronomens in וְעָלָה
  choice: »er« bewahrt den männlichen Singular und damit den möglichen Bezug sowohl auf den Strom als Bildträger als auch auf den unmittelbar genannten König.
  alternative: »Die Flut wird steigen« oder »die Wasser werden steigen«, wodurch der Bezug eindeutig auf das Wasser festgelegt würde.
  rationale: Die hebräische Form folgt auf die Apposition »der König von Assyrien« und steht zugleich im fortgesetzten Flussbild. Die deutsche Formulierung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem »siehe«. Das Hochwasserbild bleibt anschaulich; die Apposition wird durch einen Gedankenstrich hervorgehoben. Alle Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
