  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: de
  text: 'Und wenn sie zu euch sagen: »Befragt die Totenbeschwörer[a] und die Wahrsager, die zwitschern und murmeln[b]«, sollte ein Volk nicht seinen Gott befragen? Sollte ein Volk für die Lebenden die Toten befragen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Totengeister« beziehungsweise »die Medien«. Das hebräische Wort kann die angerufenen Geister oder die Menschen bezeichnen, die als Mittler zu ihnen auftreten.'
    reason: lexical_alternative
  - marker: b
    text: Das erste hebräische Verb kann ein hohes, vogelähnliches Piepsen oder Zwitschern bezeichnen; gemeint sind die eigentümlichen Laute bei der Totenbefragung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Leitet eine erwartete oder mögliche Situation ein und wahrt zugleich den Anschluss an den vorhergehenden Zusammenhang.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: sie zu euch sagen
  rationale: Gibt das Verb in der 3. Person Plural und das pluralische Gegenüber ohne nähere Bestimmung der Sprecher wieder.
- source_word: דִּרְשׁוּ
  choice: Befragt
  rationale: דרש bezeichnet hier das Einholen von Auskunft oder Führung; »befragen« passt sowohl zum mantischen Zusammenhang als auch zur späteren Gegenüberstellung.
- source_word: הָאֹבוֹת
  choice: die Totenbeschwörer
  rationale: Die kontextuell wahrscheinliche Bedeutung sind Menschen, die als Mittler zu den Toten auftreten. Die mögliche Deutung als Totengeister wird in der Fußnote offengehalten.
- source_word: הַיִּדְּעֹנִים
  choice: die Wahrsager
  rationale: Bezeichnet okkulte Auskunftspersonen. »Wahrsager« ist im heutigen Deutsch verständlich und vermeidet die irreführenden Fantasie-Assoziationen von »Zauberer«.
- source_word: הַמְצַפְצְפִים וְהַמַּהְגִּים
  choice: die wispern und murmeln
  rationale: Gibt die hohen, eigentümlichen und die tiefen, undeutlichen Laute idiomatisch wieder; der vogelähnliche Klang des ersten Verbs wird in der Fußnote erläutert.
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: sollte ein Volk nicht seinen Gott befragen?
  rationale: Bewahrt die rhetorische Frage und den Kontrast zwischen der Befragung Gottes und der Befragung okkulter Quellen; »seinen Gott« entspricht dem Suffix bei dem kollektiv verstandenen »Volk«.
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  choice: Sollte man etwa für die Lebenden die Toten befragen?
  rationale: Ergänzt das im Hebräischen elliptisch vorausgesetzte Verb, erhält den pointierten Gegensatz von Lebenden und Toten und gibt בְּעַד knapp mit »für« wieder.
theological_decisions:
- issue: Gegensatz zwischen der Befragung Gottes und der Befragung der Toten
  choice: Der Vers tadelt die Suche nach Führung bei Totenbeschwörern beziehungsweise den Toten statt bei Gott.
  alternative: Der Vers könnte vor allem die Widersinnigkeit verspotten, für Lebende die Toten zu befragen, oder eine umfassendere Aussage über den Zustand der Toten voraussetzen.
  rationale: Die Übersetzung hält sich an die unmittelbare rhetorische Gegenüberstellung und leitet daraus keine weitergehende Lehre über den Zustand oder die Fähigkeiten der Toten ab.
- issue: Bezug von אֹבוֹת
  choice: Im Haupttext als nekromantische Praktizierende verstanden.
  alternative: Das Wort kann hier auch die angerufenen Totengeister selbst bezeichnen.
  rationale: Der Zusammenhang mit der Aufforderung zum Befragen und dem folgenden Ausdruck für okkulte Auskunftspersonen begünstigt die personale Berufsbezeichnung; die echte lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede wird klar gegliedert; »wispern und murmeln« bewahrt die klangliche Wirkung, ohne altertümlich zu wirken. Die abschließende Ellipse des Hebräischen wird für natürliches Deutsch als rhetorische Frage mit ergänzt wiedergegeben.
