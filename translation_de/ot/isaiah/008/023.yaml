base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: de
  text: Denn für das bedrängte Land wird es keine Finsternis geben.[a] In früherer Zeit brachte er Schmach über das Land Sebulon und das Land Naftali; doch in späterer Zeit wird er den Weg am Meer, jenseits des Jordan, Galiläa der Völker zu Ehren bringen.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut am Versanfang ist schwierig. Statt „Finsternis“ sind auch Wiedergaben wie „Dunkelheit“ oder „Düsternis“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird … schwer/gewichtig machen“; hier im Sinn von „wird … ehren“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Galiläa der Nichtjuden“. Wörtlich steht im Hebräischen „Galiläa der Völker“. Matthäus 4,15–16 führt diese Gegend im Zusammenhang mit dem Beginn des öffentlichen Wirkens Jesu an.'
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: dunkel
  rationale: Das seltene und schwierige Wort bezeichnet hier am ehesten bedrückende Finsternis oder Düsternis. „Dunkel“ ist im Deutschen natürlich und hält den Gegensatz zur folgenden Hoffnung offen.
- source_word: מוּצָק
  choice: bedrängt
  rationale: Das Wort bezeichnet Druck und Bedrängnis. Die Formulierung „das Land, das bedrängt ist“ macht den wahrscheinlich personifizierten geografischen Bezug verständlich, ohne eine bestimmte Art des Leidens festzulegen.
- source_word: הֵקַל
  choice: brachte Schmach über
  rationale: Das Verb steht im Gegensatz zum folgenden הִכְבִּיד und bezeichnet hier Erniedrigung beziehungsweise Geringschätzung, nicht bloß ein Leichtermachen.
- source_word: הִכְבִּיד
  choice: wird … zu Ehren bringen
  rationale: Wörtlich bedeutet das Verb „schwer/gewichtig machen“. Im Gegensatz zur früheren Schmach bezeichnet es hier eine Wiederherstellung von Gewicht und Ehre.
- source_word: דֶּרֶךְ הַיָּם
  choice: der Weg am Meer
  rationale: Die relativ formale Wiedergabe bewahrt den geografischen Ausdruck des Hebräischen, ohne ihn vorschnell mit einer bestimmten historischen Straße gleichzusetzen.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: das Gebiet jenseits des Jordan
  rationale: „Jenseits des Jordan“ lässt wie das Hebräische den geografischen Blickpunkt unausgesprochen; „das Gebiet“ verdeutlicht die Reihung von Landschaften.
- source_word: גְּלִיל הַגּוֹיִם
  choice: Galiläa der Völker
  rationale: „Völker“ ist die breite, unmittelbare Bedeutung von גּוֹיִם. „Galiläa“ wahrt den als Regionsbezeichnung verstandenen Namen und seine erkennbare spätere Rezeption.
- source_word: כִּי לֹא
  choice: Denn … wird es nicht
  rationale: Die Wendung leitet die Umkehr gegenüber der vorausgehenden Finsternis ein. Die deutsche Zukunftsform bringt die im Zusammenhang erwartete Wende natürlich zum Ausdruck.
theological_decisions:
- issue: Ob der letzte Satz weitere Bedrückung oder künftige Ehrung bezeichnet
  choice: 'Künftige Ehrung: „wird … zu Ehren bringen“'
  alternative: 'Fortgesetztes Gericht: „machte … schwer“ beziehungsweise „bedrückte“'
  rationale: Der Gegensatz zwischen הֵקַל und הִכְבִּיד sowie die Bewegung des Zusammenhangs von Dunkelheit zu Hoffnung sprechen für Erniedrigung gegenüber Ehrung. Die Übersetzung folgt diesem Kontext, ohne die neutestamentliche Deutung in den Wortlaut einzutragen.
- issue: Bezug der femininen Form in לָהּ
  choice: Das bedrängte Land als Bezug ausdrücklich genannt
  alternative: „für sie, die bedrängt war“
  rationale: Der unmittelbare Zusammenhang nennt die Länder Sebulon und Naftali. „Das Land“ macht die im Hebräischen nur durch das feminine Pronomen angedeutete Personifikation im Deutschen verständlich, ohne eine individuelle Frau als Bezug nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geografischen Bezeichnungen bleiben nah am Hebräischen; erklärungsbedürftige Mehrdeutigkeit wird in den Fußnoten offengelegt. Die Semikolon-Struktur bewahrt den scharfen Gegensatz zwischen früherer Schmach und späterer Ehrung.
