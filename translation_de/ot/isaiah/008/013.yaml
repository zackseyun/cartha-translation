id: ISA.8.13
reference: Isaiah 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: de
  text: Jahwe der Heerscharen[b] – ihn sollt ihr als heilig anerkennen[a]. Er soll der sein, den ihr fürchtet, und er der, vor dem euch graut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ihn sollt ihr heiligen“. Gemeint ist, Jahwe als heilig anzuerkennen und zu behandeln, nicht ihn erst heilig zu machen.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder. „Heerscharen“ kann himmlische oder irdische Heere beziehungsweise Scharen bezeichnen.
    reason: translation_clarity
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, inhaltlich offene Wiedergabe bewahrt, dass mit den „Scharen“ sowohl himmlische als auch irdische Heere verbunden sein können, ohne dies im Haupttext festzulegen.
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: ihn sollt ihr als heilig anerkennen
  rationale: Das Hifil von קדשׁ fordert hier dazu auf, Jahwe als heilig anzuerkennen und entsprechend zu behandeln; die Formulierung vermeidet den missverständlichen Eindruck, Menschen machten Gott erst heilig.
- source_word: מוֹרַאֲכֶם
  choice: der sein, den ihr fürchtet
  rationale: Die personenbezogene Formulierung gibt Jahwe als Gegenstand der Furcht natürlich wieder und bewahrt den Nachdruck des selbstständigen Pronomens הוּא.
- source_word: מַעֲרִצְכֶם
  choice: der, vor dem euch graut
  rationale: „Grauen“ gibt die gegenüber מוֹרָא gesteigerte, intensive Furcht wieder und erhält den Parallelismus, ohne beide Begriffe gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen / Jahwe der Heere
  rationale: Die gewählte Fassung bewahrt den persönlichen Gottesnamen und lässt den Umfang von צְבָאוֹת bewusst offen.
- issue: Bedeutung des Gebots, Jahwe zu „heiligen“
  choice: ihn als heilig anerkennen
  alternative: ihn heiligen / ihn als heilig behandeln
  rationale: Die Formulierung macht deutlich, dass Jahwes Heiligkeit anerkannt und im Verhalten ernst genommen wird, nicht dass Menschen ihm Heiligkeit verleihen.
- issue: Aussageform von וְהוּא ... וְהוּא
  choice: Er soll der sein ... und er der ...
  alternative: Er ist eure Furcht und euer Schrecken
  rationale: Der Hebräische Text enthält Nominalsätze, deren genaue modale Nuance im Zusammenhang offen ist. Das deutsche „soll“ nimmt den auffordernden Kontext auf, während die wiederholte Hervorhebung „er“ erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Wendung „Jahwe der Heerscharen“ bewahrt den alttestamentlichen Titel; die beiden parallelen Aussagen werden zugleich in natürlichem Deutsch personenbezogen formuliert.
