  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: de
  text: Nennt nicht alles »Verschwörung«, was dieses Volk »Verschwörung« nennt.[a] Fürchtet nicht, was es fürchtet,[b] und geratet nicht in Schrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sagt nicht bei allem, wovon dieses Volk sagt: ›Eine Verschwörung!‹: ›Eine Verschwörung!‹«'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch kann sowohl die Furcht des Volkes selbst als auch das bezeichnen, wovor es sich fürchtet.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: Verschwörung
  rationale: Das Substantiv bezeichnet eine verschwörerische Verbindung oder ein Komplott. »Verschwörung« bewahrt den politischen und gesellschaftlichen Sinn und gibt die auffällige Wiederholung im Hebräischen wieder.
- source_word: תֹאמְרוּן
  choice: nennt
  rationale: Wörtlich steht »sagt«; in Verbindung mit der Bezeichnung קֶשֶׁר gibt »nennt« im Deutschen den Vorgang des Benennens idiomatisch wieder.
- source_word: לְכֹל אֲשֶׁר יֹאמַר הָעָם הַזֶּה
  choice: alles …, was dieses Volk … nennt
  rationale: Die Formulierung gibt den Bezug auf alles wieder, worüber dieses Volk »Verschwörung« sagt, und bildet die gemeinte Benennung in natürlichem Deutsch ab.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die wörtliche Wendung kann Distanz oder Tadel ausdrücken. »Dieses Volk« bewahrt diesen markierten Ton besser als eine Auflösung in »diese Leute«.
- source_word: מוֹרָאוֹ
  choice: was es fürchtet
  rationale: Das Suffix bezieht sich wahrscheinlich auf das kollektiv verstandene »Volk«. Der Ausdruck kann die Furcht selbst oder ihren Gegenstand bezeichnen; »was es fürchtet« gibt den kontextuellen Sinn verständlich wieder, ohne den konkreten Gegenstand festzulegen.
- source_word: תִירְאוּ
  choice: fürchtet
  rationale: Die direkte Wiedergabe bewahrt die Wortverbindung mit מוֹרָאוֹ sowie den knappen Parallelismus.
- source_word: תַעֲרִיצוּ
  choice: lasst euch davon nicht in Schrecken versetzen
  rationale: Die Hifil-Form von ערץ bezeichnet ein Erschrecken oder das Empfinden von etwas als furchterregend. Die Formulierung erhält die Steigerung gegenüber »fürchten« und klingt zugleich in modernem Deutsch natürlich.
theological_decisions:
- issue: Bezug und Tragweite des Verbots der Furcht
  choice: Der Vers verbietet den Angesprochenen, die ängstliche Einschätzung und Panik des Volkes zu übernehmen.
  alternative: Der Vers verbietet ausschließlich die Beteiligung an einer tatsächlichen politischen Verschwörung oder primär die Furcht vor dem Volk selbst.
  rationale: Die Wiederholung von קֶשֶׁר und die parallelen Verbote weisen darauf, dass die Angesprochenen weder die Deutung des Volkes nachsprechen noch dessen Furcht teilen sollen. Die Übersetzung lässt den geschichtlichen Gegenstand bewusst unbestimmt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von »Verschwörung« und »fürchtet« bildet die hebräische Rhetorik nach; die Schlusswendung macht die poetische Steigerung idiomatisch deutlich.
