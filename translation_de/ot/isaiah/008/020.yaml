source:
  edition: WLC
  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: de
  text: Zur Weisung[a] und zum Zeugnis! Wenn sie nicht diesem Wort gemäß sprechen, gibt es für sie keine Morgenröte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zum Gesetz und zum Zeugnis!« Das hebräische Wort Tora kann sowohl »Weisung« als auch »Gesetz« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist sehr knapp und kann auch enger mit dem Vorhergehenden verbunden werden, etwa: »Wenn sie nicht gemäß diesem Wort sprechen, für das es keine Morgenröte gibt.«'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: zur Weisung
  rationale: תּוֹרָה bezeichnet hier die maßgebliche göttliche Unterweisung und kann auch mit »Gesetz« wiedergegeben werden. »Weisung« bewahrt die weitere Bedeutung des hebräischen Wortes und klingt im prophetischen Aufruf natürlich.
- source_word: וְלִתְעוּדָה
  choice: und zum Zeugnis
  rationale: תְּעוּדָה bezeichnet ein autoritatives Zeugnis oder eine Bezeugung. »Zeugnis« wahrt die knappe Parallelstellung zu »Weisung«.
- source_word: אִם לֹא
  choice: wenn … nicht
  rationale: Die Wendung wird in ihrem naheliegenden konditionalen Sinn wiedergegeben, ohne eine mögliche bekräftigende Nuance ausdrücklich einzutragen.
- source_word: יֹאמְרוּ
  choice: sie … sprechen
  rationale: אָמַר bedeutet gewöhnlich »sagen«; im Zusammenhang gegensätzlicher religiöser Auskünfte gibt »sprechen« den weiteren kommunikativen Sinn angemessen wieder.
- source_word: כַּדָּבָר הַזֶּה
  choice: diesem Wort gemäß
  rationale: דָּבָר kann »Wort«, »Aussage«, »Sache« oder »Botschaft« bedeuten. »Diesem Wort gemäß« bewahrt die Formulierung als Maßstab einer autoritativen Aussage und ist idiomatisches Deutsch.
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: gibt es für sie keine Morgenröte
  rationale: שַׁחַר bedeutet »Morgenröte«. Die Wiedergabe erhält das hebräische Bild, statt es zu »Licht« oder »Hoffnung« auszudeuten. Das singularische לוֹ wird im Bezug auf die zuvor genannte Gruppe idiomatisch mit »für sie« wiedergegeben; die syntaktische Mehrdeutigkeit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Bezug und Aussagekraft des Schlusssatzes
  choice: Der Schlusssatz warnt, dass es für diejenigen, die nicht gemäß der offenbarten Weisung sprechen, keine Morgenröte gibt.
  alternative: 'Die Worte können enger an »dieses Wort« angeschlossen werden: »wenn sie nicht gemäß diesem Wort sprechen, für das es keine Morgenröte gibt« beziehungsweise sinngemäß: »In einem solchen Wort ist keine Morgenröte.«'
  rationale: Der Kontext stellt die göttliche Offenbarung widerstreitenden Auskünften gegenüber. Die personenbezogene Wiedergabe ergibt einen verständlichen Warnsatz, ohne das Bild der Morgenröte dogmatisch als eine bestimmte Heilslehre auszulegen; die knappe hebräische Syntax bleibt durch die Fußnote als mehrdeutig erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische prophetische Aufruf »Zur Weisung und zum Zeugnis!« bleibt in seiner gedrängten Form erhalten. »Morgenröte« bewahrt das konkrete poetische Bild des Hebräischen.
