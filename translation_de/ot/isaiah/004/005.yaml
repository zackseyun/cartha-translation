source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: de
  text: Dann wird Jahwe über der ganzen Stätte auf dem Berg Zion und über ihren Versammlungen[a] am Tag eine Wolke und Rauch erschaffen und bei Nacht den Glanz eines flammenden Feuers[b][c]; denn über aller Herrlichkeit wird eine Überdachung[d] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren einberufenen Zusammenkünften“. Das hebräische Wort kann festgesetzte oder eigens einberufene Versammlungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Schein eines lodernden Feuers bei Nacht“.'
    reason: lexical_alternative
  - marker: c
    text: Die Bilder erinnern an Jahwes Wolke und Feuer während der Wüstenwanderung (zum Beispiel 2. Mose 13,21–22).
    reason: cross_reference
  - marker: d
    text: 'Oder: „ein Baldachin“. Das hebräische Wort kann auch einen Hochzeitsbaldachin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: Dann wird … erschaffen
  rationale: Das Qal-Perfekt mit vorangestellter Konjunktion steht im Zusammenhang einer prophetischen Zukunftsverheißung. „Erschaffen“ bewahrt die Aussagekraft von ברא; „Dann“ gibt den Fortgang der Rede natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gebräuchliche deutsche Wiedergabe des göttlichen Eigennamens.
- source_word: מְכוֹן
  choice: Stätte
  rationale: Bezeichnet hier einen festen Ort beziehungsweise Standort. „Stätte“ passt zum Berg Zion, ohne die Bedeutung vorschnell auf einen Wohnort einzuengen.
- source_word: מִקְרָאֶיהָ
  choice: ihren Versammlungen
  rationale: מִקְרָא kann eine einberufene Versammlung oder Zusammenkunft bezeichnen. Das feminine Suffix bezieht sich auf Zion.
- source_word: עָנָן יוֹמָם וְעָשָׁן
  choice: am Tag eine Wolke und Rauch
  rationale: Die beiden sichtbaren Erscheinungen bleiben ausdrücklich nebeneinandergestellt; zugleich bleibt die Anspielung auf die Wüstenwanderung erkennbar.
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: in der Nacht den Glanz eines flammenden Feuers
  rationale: „Glanz“ gibt נֹגַהּ wieder, während „flammendes Feuer“ sowohl אֵשׁ als auch לֶהָבָה abbildet.
- source_word: כָּבוֹד
  choice: die ganze Herrlichkeit
  rationale: „Herrlichkeit“ wahrt die mögliche Beziehung auf Gottes herrliche Gegenwart und vermeidet eine Verengung auf menschliche Ehre.
- source_word: חֻפָּה
  choice: Schutzdach
  rationale: Das Wort bezeichnet eine Überdachung oder einen Baldachin. „Schutzdach“ vermittelt in gegenwärtigem Deutsch die Schutzfunktion, ohne mögliche hochzeitliche Anklänge im Haupttext festzuschreiben.
theological_decisions:
- issue: Prophetischer Zeitbezug von וּבָרָא
  choice: Zukunftsverheißung („wird … erschaffen“)
  alternative: Vergangenheitsaussage („erschuf“)
  rationale: Der Zusammenhang blickt auf die künftige Wiederherstellung Zions. Die Zukunftsform gibt die Funktion des prophetischen Perfekts im Deutschen angemessen wieder.
- issue: Anklänge an Exodus und Neuschöpfung
  choice: Die Bilder von Wolke und Feuer werden ohne ausdrückliche typologische Auslegung beibehalten.
  alternative: Erweiterung zu „Wolkensäule“ und „Feuersäule“ oder ausdrückliche messianische beziehungsweise ekklesiologische Deutung
  rationale: Die Bildsprache erinnert deutlich an Gottes Gegenwart während der Wüstenwanderung, doch solche theologischen Bezüge sollen aus dem Wortlaut hervorgehen und nicht in ihn hineingeschrieben werden.
- issue: Bedeutungsumfang von חֻפָּה
  choice: Schutzbild im Haupttext, mögliche hochzeitliche Konnotation in der Fußnote
  alternative: „Brautbaldachin“ im Haupttext
  rationale: Der hebräische Ausdruck kann eine allgemeine Überdachung und auch einen Hochzeitsbaldachin bezeichnen. Die Übersetzung bewahrt diese Spannung, ohne den Kontext eindeutig hochzeitlich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Aufbau des Hebräischen, wird jedoch durch die Stellung der Zeitangaben natürlich lesbar gemacht. „Stätte“, „Herrlichkeit“ und „Schutzdach“ sind allgemein verständlich und bewahren zugleich den feierlichen prophetischen Ton.
