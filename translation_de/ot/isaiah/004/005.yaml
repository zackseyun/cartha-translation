revisions:
- from: Dann wird Jahwe über der gesamten Stätte des Berges Zion und über ihren Versammlungen[a] am Tag eine Wolke und Rauch erschaffen und in der Nacht den Glanz eines flammenden Feuers[b][c]; denn über der ganzen Herrlichkeit wird ein Schutzdach[d] sein.
  to: Dann wird Jahwe über der ganzen Stätte auf dem Berg Zion und über ihren Versammlungen[a] am Tag eine Wolke und Rauch erschaffen und bei Nacht den Glanz eines flammenden Feuers[b][c]; denn über aller Herrlichkeit wird eine Überdachung[d] sein.
  rationale: Die Revision korrigiert den Umfang von כָּל כָּבוֹד mit „über aller Herrlichkeit“, ersetzt das interpretierende „Schutzdach“ durch das neutralere „Überdachung“ und glättet die Ortsformulierung. Die Bildsprache und ihre bewusst offene mögliche Hochzeitskonnotation bleiben erhalten.
