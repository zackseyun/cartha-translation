base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: de
  text: 'An jenem Tag werden sieben Frauen einen einzigen Mann ergreifen und sagen: »Unser eigenes Brot wollen wir essen und unsere eigene Kleidung tragen. Nur lass uns deinen Namen tragen.[a] Nimm unsere Schande von uns!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass deinen Namen über uns genannt werden.“ Oder: „Lass uns nach deinem Namen genannt werden.“ Gemeint ist wahrscheinlich eine eheliche oder rechtlich-soziale Zugehörigkeit zu dem Mann.'
    reason: lexical_alternative
  - marker: b
    text: Die „Schande“ bezeichnet einen gesellschaftlichen Makel; im Zusammenhang ist wohl die beschämende Lage gemeint, nach der zuvor beschriebenen Verwüstung ohne den Namen und die Stellung eines Ehemanns zu sein.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: werden … ergreifen
  rationale: Der Hifil von חזק mit ב bezeichnet ein festes Ergreifen. „Ergreifen“ bewahrt die Dringlichkeit und Körperlichkeit, ohne unnötig Gewalt anzudeuten.
- source_word: שֶׁבַע נָשִׁים בְּאִישׁ אֶחָד
  choice: sieben Frauen einen einzigen Mann
  rationale: „Frauen“ ist gegenüber „Ehefrauen“ vorzuziehen, da ein eheliches Verhältnis erst durch die folgende Bitte angedeutet wird. „Einen einzigen“ gibt den starken zahlenmäßigen Gegensatz natürlich wieder.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitformel, die den Zusammenhang mit dem vorausgehenden Gerichtsgeschehen wahrt.
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: Unser eigenes Brot wollen wir essen
  rationale: Das Possessivsuffix bezeichnet „unser Brot“; „eigenes“ verdeutlicht im Deutschen die kontextuelle Zusage, selbst für den Unterhalt aufzukommen.
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: unsere eigenen Kleider tragen
  rationale: „Kleider“ gibt das konkrete hebräische שִׂמְלָה verständlich wieder. „Eigenen“ hebt parallel zum Brot die Selbstversorgung hervor.
- source_word: רַק יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: Nur lass deinen Namen über uns ausgerufen werden
  rationale: Die Formulierung bewahrt das ungewöhnliche hebräische Bild und seine rechtlich-soziale Tragweite, ohne es ausdrücklich auf „heirate uns“ zu verengen.
- source_word: אֱסֹף חֶרְפָּתֵנוּ
  choice: Nimm unsere Schande von uns
  rationale: אָסַף hat hier idiomatisch den Sinn von wegnehmen oder beseitigen. „Schande“ bezeichnet verständlich den sozialen Makel, ohne dessen genaue Ursache im Haupttext festzulegen.
theological_decisions:
- issue: Angedeutete eheliche oder soziale Zuordnung durch den Namen des Mannes
  choice: Das hebräische Namensidiom bleibt im Haupttext erhalten.
  alternative: „Lass uns nach deinem Namen genannt werden“ oder ausdrücklich „Heirate uns“.
  rationale: Die Aussage deutet wahrscheinlich auf Ehe beziehungsweise eine rechtlich-soziale Zugehörigkeit, verwendet aber kein ausdrückliches Verb für „heiraten“. Die bildhafte Formulierung bewahrt diese Offenheit.
- issue: Bedeutung der Schande
  choice: Allgemein als „unsere Schande“ wiedergegeben.
  alternative: „die Schande, unverheiratet zu sein“ oder „die Schande der Kinderlosigkeit“.
  rationale: Der Zusammenhang legt einen gesellschaftlichen Makel wegen fehlender ehelicher und familiärer Zuordnung nahe, bestimmt ihn jedoch nicht eindeutig als Ehelosigkeit oder Kinderlosigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; das bewusst ungewöhnliche Namensidiom bleibt erhalten, damit die soziale und möglicherweise eheliche Bedeutung nicht vorschnell vereindeutigt wird.
