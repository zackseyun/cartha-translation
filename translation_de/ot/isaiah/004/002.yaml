  source_fidelity: 'Die Grundstruktur und die zentralen Ausdrücke werden zutreffend wiedergegeben: „An jenem Tag“, „der Spross Jahwes“, „die Frucht des Landes“ und „die Überlebenden Israels“ entsprechen dem Hebräischen gut. Die mögliche Doppeldeutigkeit von צֶמַח bleibt angemessen offen. Für גָאוֹן ist „Stolz“ jedoch im modernen Deutschen zu leicht als persönliche, gegebenenfalls negative Haltung zu verstehen und gibt den hier eindeutig rühmenden Parallelismus weniger treffend wieder.'
