  to: An jenem Tag wird der Spross Jahwes zur Zierde und zur Herrlichkeit[a] und die Frucht des Landes zum Glanz und zur Pracht für die Überlebenden Israels[b].
  rationale: Die Revision ersetzt allein „Stolz“ durch „Glanz“. Damit wird der im Kontext positive Sinn von גָאוֹן klarer und idiomatischer getroffen; Bedeutung, Parallelismus, Ambiguität von „Spross“ und die vorhandenen Fußnoten bleiben erhalten.
