  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: de
  text: An jenem Tag wird der Spross Jahwes zur Zierde und zur Herrlichkeit[a] und die Frucht des Landes zum Glanz und zur Pracht für die Überlebenden Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Wuchs Jahwes“ oder „was Jahwe sprießen lässt“. Das Hebräische kann sowohl die erneuerte Fruchtbarkeit des Landes als auch das später in der Prophetie vorkommende Bild vom „Spross“ anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „für den Rest Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben, ohne den Zeitpunkt näher festzulegen.
- source_word: צֶמַח יְהוָה
  choice: der Spross Jahwes
  rationale: צֶמַח kann das Hervorsprießende, den Wuchs oder einen Spross bezeichnen. „Spross“ bewahrt das konkrete Pflanzenbild und lässt sowohl die Vorstellung erneuerter Fruchtbarkeit als auch eine mögliche königlich-messianische Resonanz offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: לִצְבִי
  choice: zur Zierde
  rationale: צְבִי bezeichnet hier Schönheit, Anmut oder etwas Schmuckvolles. „Zierde“ passt zum positiven poetischen Parallelismus und unterscheidet sich von כָבוֹד.
- source_word: וּלְכָבוֹד
  choice: und zur Herrlichkeit
  rationale: כָבוֹד umfasst Herrlichkeit, Ehre und Würde. „Herrlichkeit“ erhält den feierlichen Ton.
- source_word: וּפְרִי הָאָרֶץ
  choice: und die Frucht des Landes
  rationale: „Frucht“ gibt פְרִי direkt wieder; „Land“ entspricht dem landwirtschaftlichen und auf Israel bezogenen Kontext besser als „Erde“.
- source_word: לְגָאוֹן
  choice: zum Stolz
  rationale: גָאוֹן kann sowohl Hochmut als auch positive Hoheit beziehungsweise Stolz bezeichnen. Im Zusammenhang der lobenden Parallelbegriffe ist hier der positive Sinn gemeint; „Stolz“ bewahrt zugleich die lexikalische Spannung.
- source_word: וּלְתִפְאֶרֶת
  choice: und zum Schmuck
  rationale: תִפְאֶרֶת bezeichnet Pracht, Schönheit oder Schmuck. „Schmuck“ bildet mit „Stolz“ ein verständliches positives Wortpaar und vermeidet eine Wiederholung von „Herrlichkeit“.
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: für die Überlebenden Israels
  rationale: פְלֵיטָה bezeichnet Entkommene beziehungsweise Überlebende. Diese Formulierung ist im heutigen Deutsch transparent; die traditionsreiche Alternative „der Rest Israels“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Ob צֶמַח יְהוָה ausdrücklich messianisch oder ausschließlich landwirtschaftlich wiederzugeben ist
  choice: der Spross Jahwes
  alternative: der Wuchs Jahwes; was Jahwe sprießen lässt
  rationale: Der Haupttext bewahrt mit „Spross“ das Bild und seine mögliche personhafte beziehungsweise messianische Resonanz, legt es aber nicht durch Großschreibung oder eine erklärende Paraphrase fest. Die landwirtschaftliche Deutung bleibt in der Fußnote sichtbar.
- issue: Ob לִפְלֵיטַת יִשְׂרָאֵל mit dem theologischen Fachausdruck „Rest“ wiederzugeben ist
  choice: für die Überlebenden Israels
  alternative: für den Rest Israels
  rationale: Der hebräische Ausdruck hebt zunächst das Entkommen beziehungsweise Überleben hervor. Die verständliche Haupttextfassung vermeidet eine vorschnelle dogmatische Festlegung; die traditionelle Rest-Terminologie bleibt als Alternative erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. Die vier positiven Prädikatsbegriffe werden differenziert wiedergegeben, ohne die Mehrdeutigkeit des zentralen Pflanzenbildes aufzulösen.
