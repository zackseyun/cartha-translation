id: ISA.4.4
reference: Isaiah 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: de
  text: wenn der Herr den Schmutz der Töchter Zions abgewaschen und die Blutschuld Jerusalems aus ihrer Mitte weggespült hat – durch einen Geist des Gerichts und durch einen Geist des Brennens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Geist des Gerichts und durch den Geist des Brennens“. Das hebräische Wort kann auch „Wind“ oder „Atem“ bedeuten. „Blutschuld“ kann hier auch das vergossene Blut beziehungsweise die Blutflecken Jerusalems bezeichnen.'
    reason: Bewahrt die lexikalische und theologische Mehrdeutigkeit von רוּחַ sowie des hebräischen Blut-Plurals.
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Im Zusammenhang bezeichnet אִם den Zeitpunkt beziehungsweise die Bedingung, unter der die vorausgehende Verheißung Wirklichkeit wird. „Wenn“ bewahrt diese Schwebe natürlicher als ein rein zeitliches „nachdem“.
- source_word: רָחַץ
  choice: abgewaschen
  rationale: Das Verb bedeutet „waschen“. Mit „Schmutz“ als Objekt gibt „abgewaschen“ sowohl den Reinigungsvorgang als auch die Beseitigung wieder.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Hier steht der Gottestitel Adonaj, nicht das Tetragramm; daher ist „der Herr“ die angemessene Wiedergabe.
- source_word: צֹאַת
  choice: Schmutz
  rationale: Das Wort bezeichnet starken, sogar kotartigen Schmutz. „Schmutz“ wahrt die abstoßende Bildlichkeit in würdigem, allgemein verständlichem Deutsch.
- source_word: בְּנוֹת צִיּוֹן
  choice: die Töchter Zions
  rationale: Die wörtliche Wendung erhält die prophetische Gruppenbezeichnung und die Verbindung zur personifizierten Stadt.
- source_word: דְּמֵי יְרוּשָׁלִַם
  choice: die Blutschuld Jerusalems
  rationale: Der Plural „Blut“ kann vergossenes Blut und die dadurch entstandene Schuld bezeichnen. Im Zusammenhang der moralischen Reinigung bringt „Blutschuld“ diese Spannung prägnant zum Ausdruck.
- source_word: יָדִיחַ
  choice: weggespült
  rationale: Die Kausativform bezeichnet hier das Ab- oder Wegspülen. „Weggespült“ unterscheidet den Ausdruck vom vorherigen „abgewaschen“ und bewahrt zugleich das Reinigungsbild.
- source_word: מִקִּרְבָּהּ
  choice: aus ihrer Mitte
  rationale: Das feminine Suffix bezieht sich auf das personifizierte Jerusalem. „Aus ihrer Mitte“ erhält sowohl den räumlichen Sinn als auch die Personifikation.
- source_word: בְּרוּחַ
  choice: durch einen Geist
  rationale: רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten. Die indefinite Wiedergabe vermeidet eine nicht ausdrücklich markierte Gleichsetzung mit dem Heiligen Geist und lässt die instrumentale Kraft der Formulierung erkennen.
- source_word: מִשְׁפָּט
  choice: Gericht
  rationale: Im Zusammenhang der strafenden und reinigenden Tätigkeit des Herrn ist „Gericht“ näher an der gerichtlichen Handlung als „Gerechtigkeit“, ohne deren rechtsetzenden Aspekt auszuschließen.
- source_word: בָּעֵר
  choice: Brennen
  rationale: Die Form von בער bezeichnet brennendes beziehungsweise verzehrendes Wirken. „Brennen“ erhält die markante und bewusst offene Metapher.
theological_decisions:
- issue: Bedeutung von רוּחַ in den parallelen Wendungen
  choice: „durch einen Geist des Gerichts und durch einen Geist des Brennens“
  alternative: „durch den Geist des Gerichts und durch den Geist des Brennens“ oder „durch einen Wind des Gerichts und einen Gluthauch“
  rationale: Der hebräische Ausdruck kann Geist, Wind oder Atem bezeichnen und identifiziert den Handelnden nicht ausdrücklich als den Heiligen Geist. Der Haupttext wahrt daher die Unbestimmtheit; die semantischen und theologischen Alternativen werden in der Fußnote offengelegt.
- issue: Deutung von דְּמֵי יְרוּשָׁלִַם
  choice: „die Blutschuld Jerusalems“
  alternative: „das vergossene Blut Jerusalems“ oder „die Blutflecken Jerusalems“
  rationale: Der hebräische Blut-Plural kann sowohl Blutvergießen als auch daraus erwachsene Schuld ausdrücken. „Blutschuld“ passt zur gerichtlichen Reinigung, soll aber die anderen möglichen Bildrichtungen nicht verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als abhängiger Anschluss an den vorausgehenden Zusammenhang erhalten. Die kräftigen Reinigungs- und Feuerbilder werden nicht geglättet; ungewöhnliches „Geist des Brennens“ ist bewusst beibehalten, um die Offenheit des Hebräischen zu wahren.
