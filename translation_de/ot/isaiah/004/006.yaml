base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: de
  text: Und eine Hütte[a] wird tagsüber Schatten vor der Hitze[b] bieten, eine Zuflucht und ein Versteck vor Unwetter[c] und Regen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Laube“; das hebräische Wort bezeichnet eine einfache, häufig vorübergehende überdachte Schutzstätte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor sengender Hitze“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „vor Wolkenbruch“, „vor Sturzflut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: Hütte
  rationale: Das Substantiv bezeichnet eine einfache, überdachte und oft vorübergehende Schutzstätte. „Hütte“ bewahrt dieses konkrete Bild; die Schutzfunktion ergibt sich aus dem Zusammenhang.
- source_word: תִּהְיֶה
  choice: wird … bieten
  rationale: Wörtlich steht „wird sein“. Im Deutschen verbindet „wird … bieten“ die Hütte natürlich mit ihren Funktionen als Schattenspender, Zuflucht und Versteck, ohne den Sinn zu verändern.
- source_word: לְצֵל
  choice: Schatten
  rationale: Im Zusammenhang mit dem Schutz vor Hitze bezeichnet צֵל wohltuenden Schatten, nicht lediglich einen optischen Schattenwurf.
- source_word: יוֹמָם
  choice: tagsüber
  rationale: Das Adverb gibt die Tageszeit an; „tagsüber“ ist knapp, modern und idiomatisch.
- source_word: מֵחֹרֶב
  choice: vor der Hitze
  rationale: חֹרֶב kann sengende Hitze oder Trockenheit bezeichnen. Im Zusammenhang einer schattenspendenden Hütte ist „Hitze“ die naheliegende Bedeutung.
- source_word: מַחְסֶה
  choice: Zuflucht
  rationale: Das Wort bezeichnet einen Ort des Schutzes. „Zuflucht“ erhält diese Bedeutung und bleibt von den benachbarten Schutzbildern unterscheidbar.
- source_word: מִסְתּוֹר
  choice: Versteck
  rationale: Das Substantiv bezeichnet einen verborgenen oder bergenden Ort. „Versteck“ bewahrt diesen besonderen Bildgehalt neben „Zuflucht“.
- source_word: זֶרֶם
  choice: Unwetter
  rationale: זֶרֶם kann einen heftigen Regenguss, eine Sturzflut oder ein stürmisches Wetterereignis bezeichnen. „Unwetter“ gibt die bedrohliche Wettergewalt wieder und unterscheidet den Ausdruck vom folgenden „Regen“.
- source_word: מָטָר
  choice: Regen
  rationale: Dies ist die gewöhnliche und im Parallelismus passende Bedeutung des Wortes.
theological_decisions:
- issue: Deutung des Schutzbildes
  choice: Der Haupttext beschreibt eine konkrete, vor Hitze und Unwetter schützende Hütte, ohne ihren theologischen Bezug ausdrücklich festzulegen.
  alternative: Die Hütte unmittelbar als Zion, Gottes Gegenwart oder messianischen Schutz auszuweisen.
  rationale: Der hebräische Vers entfaltet ein poetisches Schutzbild. Der weitere Zusammenhang kann ihm göttliche oder endzeitliche Bedeutung geben, doch der Vers selbst benennt den Träger dieser Deutung nicht ausdrücklich; diese Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die konkrete Wetter- und Schutzmetaphorik bleibt erhalten; altertümliche oder konfessionell aufgeladene Begriffe werden vermieden.
