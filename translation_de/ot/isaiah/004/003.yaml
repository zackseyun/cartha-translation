- from: 'Und es wird geschehen: Wer in Zion übrig geblieben ist und wer in Jerusalem zurückgeblieben ist, wird heilig genannt werden – jeder, der in Jerusalem zum Leben verzeichnet ist.[a][b]'
  to: 'Und es wird geschehen: Wer in Zion übrig bleibt und wer in Jerusalem übrig bleibt, wird heilig genannt werden – jeder, der in Jerusalem zum Leben eingeschrieben ist.[a][b]'
  rationale: Die Revision beseitigt die mögliche Fehlassoziation von »zurückgeblieben« und macht die beiden parallelen hebräischen Rest-Bezeichnungen im Deutschen gleichartig sichtbar. »Eingeschrieben« ist für einen schriftlichen Registereintrag präziser; die bewusst knappe Formel »zum Leben« und beide Deutungsmöglichkeiten bleiben erhalten.
