  text: וְ/הָיָ֣ה הַ/נִּשְׁאָ֣ר בְּ/צִיּ֗וֹן וְ/הַ/נּוֹתָר֙ בִּ/יר֣וּשָׁלִַ֔ם קָד֖וֹשׁ יֵאָ֣מֶר ל֑/וֹ כָּל הַ/כָּת֥וּב לַ/חַיִּ֖ים בִּ/ירוּשָׁלִָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: de
  text: 'Und es wird geschehen: Wer in Zion übrig bleibt und wer in Jerusalem übrig bleibt, wird heilig genannt werden – jeder, der in Jerusalem zum Leben eingeschrieben ist.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeder, der unter den Lebenden in Jerusalem eingeschrieben ist«.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »zum Leben eingeschrieben« kann sich auf ein amtliches Verzeichnis der zum Weiterleben Verschonten beziehen; zugleich klingt das breitere biblische Motiv an, dass Menschen in Gottes Buch des Lebens eingetragen sind.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die prophetische Zukunftsformel und gibt sie in würdigem, geläufigem Deutsch wieder.
- source_word: הַנִּשְׁאָר בְּצִיּוֹן
  choice: Wer in Zion übrig geblieben ist
  rationale: Das substantivierte Nifal-Partizip bezeichnet allgemein denjenigen, der bleibt beziehungsweise ein Gericht überlebt; die Wer-Konstruktion bewahrt diesen generischen Sinn.
- source_word: וְהַנּוֹתָר בִּירוּשָׁלִַם
  choice: und wer in Jerusalem zurückgeblieben ist
  rationale: Gibt den parallelen Ausdruck natürlich wieder und lässt durch die leichte Variation die synonyme Parallelität erkennen.
- source_word: קָדוֹשׁ יֵאָמֶר לוֹ
  choice: wird heilig genannt werden
  rationale: Entspricht der idiomatischen Bedeutung der passiven Form mit prädikativem קָדוֹשׁ, ohne die Heiligkeit näher auszudeuten.
- source_word: כָּל הַכָּתוּב
  choice: jeder, der … verzeichnet ist
  rationale: Das passive Partizip von כתב bezeichnet hier eine schriftliche Eintragung; „verzeichnet“ lässt sowohl ein konkretes Register als auch eine weitergehende theologische Resonanz zu.
- source_word: לַחַיִּים
  choice: zum Leben
  rationale: Die knappe Wiedergabe erhält die Mehrdeutigkeit zwischen einer Eintragung mit Bestimmung zum Weiterleben und einer Eintragung unter den Lebenden.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Der Ortsname und die lokative Bestimmung werden ausdrücklich beibehalten.
theological_decisions:
- issue: Bezeichnet der Vers nur die geschichtlich Überlebenden oder einen von Gott geheiligten Rest?
  choice: Der Text verbindet das Überleben mit der Bezeichnung als heilig und mit der Eintragung zum Leben.
  alternative: Entweder ausschließlich die nach einem Gericht körperlich Überlebenden oder ausdrücklich die in Gottes Lebensbuch Eingetragenen.
  rationale: Der hebräische Wortlaut hält Überleben, Heiligkeit und schriftliche Verzeichnung zusammen, entwickelt jedoch keine dieser Deutungen allein vollständig. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wer-Sätze bilden die generische Aussage der hebräischen Partizipien ab. „Zum Leben verzeichnet“ bleibt bewusst knapp, damit weder eine rein verwaltungsmäßige noch eine ausschließlich eschatologische Deutung festgeschrieben wird.
