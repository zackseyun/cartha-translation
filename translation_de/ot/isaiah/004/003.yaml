  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: ein in Zion bzw. Jerusalem verbleibender Rest wird als heilig bezeichnet, und die Aussage wird durch die Eintragung »zum Leben« näher bestimmt. »Zurückgeblieben« kann im heutigen Deutsch jedoch nahelegen, dass jemand lediglich nicht mitgegangen ist, statt dass er nach dem Gericht übrig geblieben ist; die parallelen hebräischen Rest-Begriffe sollten daher gleichartig als »übrig bleibt« wiedergegeben werden. »Eingeschrieben« bildet das schriftbezogene Partizip הַכָּתוּב klarer und idiomatischer ab als »verzeichnet«.'
  naturalness: Die Zukunftsformel ist würdig und verständlich. Mit Präsens in den generischen Wer-Sätzen (»übrig bleibt«) ist die Satzfügung in Abhängigkeit von »es wird geschehen« flüssig. »Zum Leben eingeschrieben« ist im Deutschen eine etablierte, registergerechte Verbindung.
  terminology: »Heilig« bewahrt die sachlich-theologische Bedeutung von קָדוֹשׁ. »Zum Leben eingeschrieben« erhält die knappe, nicht abschließend festgelegte Bedeutung von לַחַיִּים; sie legt weder bloßes physisches Überleben noch eine ausgearbeitete Lehre vom Buch des Lebens zwingend fest. Die Fußnote benennt die mögliche Resonanz ausdrücklich nur als solche.
  issues:
  - severity: medium
    issue: »zurückgeblieben ist« für וְהַנּוֹתָר
    rationale: Im modernen Deutsch bezeichnet »zurückbleiben« häufig das Nicht-Mitgehen bzw. das Zurückgelassenwerden. Im hebräischen Parallelismus geht es wie bei הַנִּשְׁאָר um den verbleibenden/übrig gebliebenen Rest. Eine parallele Formulierung mit »übrig bleibt« ist genauer.
  - severity: low
    issue: »verzeichnet« für הַכָּתוּב
    rationale: Die Wiedergabe ist möglich, aber »eingeschrieben« bringt den passiven schriftlichen Eintrag und den registerartigen Kontext in Verbindung mit »zum Leben« klarer und idiomatischer zum Ausdruck.
