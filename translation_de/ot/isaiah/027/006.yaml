source:
  edition: WLC
  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: de
  text: In den kommenden Tagen wird Jakob Wurzeln schlagen[a]; Israel wird knospen und blühen, und sie werden den Erdkreis mit Frucht[b] erfüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Kommenden: Jakob wird Wurzeln schlagen.“ Der hebräische Anfang lautet wörtlicher „die Kommenden“, ist hier aber wahrscheinlich als Zeitangabe zu verstehen.'
    reason: alternative_reading
  - marker: b
    text: „Frucht“ kann auch mit „Ertrag“ oder „Erzeugnis“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: In den kommenden Tagen
  rationale: Der substantivierte Partizipialausdruck ist elliptisch. Im Zusammenhang dient er am ehesten als Zeitangabe mit Zukunftsbezug; die Übersetzung bewahrt diesen Sinn in natürlichem Deutsch.
- source_word: יַשְׁרֵשׁ
  choice: wird ... Wurzeln schlagen
  rationale: Obwohl die Hifil-Form grundsätzlich kausativ verstanden werden kann, hat sie hier im Bild vom Pflanzenwachstum wahrscheinlich intransitive Bedeutung. „Wurzeln schlagen“ ist dafür die natürliche deutsche Wendung.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname bleibt erhalten und bezeichnet im poetischen Parallelismus kollektiv das Volk.
- source_word: יָצִיץ וּפָרַח
  choice: wird knospen und blühen
  rationale: Die beiden Verben beschreiben aufeinander bezogene Stadien pflanzlichen Wachstums. „Knospen und blühen“ erhält die konkrete Bildsprache und die Doppelung.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten und steht parallel zu „Jakob“ für das Volk als Ganzes.
- source_word: וּמָלְאוּ
  choice: und sie werden ... erfüllen
  rationale: Das pluralische Verb betrachtet das zuvor im Singular personifizierte Volk nun als Vielheit. Das ausdrückliche „sie“ bildet diesen Numeruswechsel im Deutschen ab.
- source_word: פְנֵי תֵבֵל
  choice: den Erdkreis
  rationale: תֵבֵל bezeichnet die bewohnte Welt; פְנֵי bedeutet wörtlich deren Angesicht beziehungsweise Oberfläche. „Den Erdkreis“ gibt den umfassenden räumlichen Sinn würdig und idiomatisch wieder.
- source_word: תְּנוּבָה
  choice: Frucht
  rationale: Das Substantiv kann Frucht, Ertrag oder Erzeugnis bedeuten. „Frucht“ passt zur Pflanzenmetaphorik, ohne deren möglichen übertragenen Sinn festzulegen.
theological_decisions:
- issue: Kollektive Identität von Jakob und Israel im Wachstumsbild
  choice: Die Namen „Jakob“ und „Israel“ werden unverändert als personifizierte Bezeichnungen des Volkes wiedergegeben.
  alternative: Eine erklärende Erweiterung wie „die Nachkommen Jakobs“ oder eine ausschließlich auf die Stammväter bezogene Lesart.
  rationale: Der hebräische Parallelismus nennt die Namen unmittelbar. Ihre Beibehaltung wahrt die poetische und theologische Spannung, ohne die kollektive Bedeutung interpretierend auszuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer botanischer Bildsprache. „Erdkreis“ ist leicht gehoben, aber allgemein verständlich und für prophetische Poesie angemessen. Die Mehrdeutigkeit des hebräischen Versanfangs und von תְּנוּבָה wird in Fußnoten bewahrt.
