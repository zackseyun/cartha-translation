  yaml_path: translation/ot/isaiah/027/002.yaml
  text: 'In that day: “A pleasant vineyard”—sing of it![a][b]'
translation:
  language: de
  text: 'An jenem Tag: »Ein lieblicher Weinberg![a] Singt von ihm![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Weinberg der Wonne!« Das hebräische Wort bezeichnet etwas Begehrenswertes, Liebliches oder Erfreuliches.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Singt ihm zu!« oder »Singt über ihn!« Das hebräische Verb kann ein Antworten oder Anstimmen im Gesang bezeichnen. Das feminine Pronomen im Hebräischen bezieht sich auf den Weinberg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die übliche prophetische Zeitformel wird im Deutschen natürlich und zugleich feierlich wiedergegeben.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: Das Substantiv bezeichnet einen Weinberg, nicht einen einzelnen Weinstock, und passt zum Bildfeld des Zusammenhangs.
- source_word: חֶמֶד
  choice: prächtig
  rationale: חֶמֶד bezeichnet etwas Begehrenswertes, Erfreuliches oder Kostbares. »Prächtig« ist als attributive Beschreibung eines Weinbergs idiomatisch; die formalere Alternative »Weinberg der Wonne« bleibt in der Fußnote erhalten.
- source_word: עַנּוּ
  choice: Singt
  rationale: Der pluralische Imperativ von ענה kann im musikalisch-liturgischen Gebrauch ein Antworten beziehungsweise Anstimmen im Gesang bezeichnen. »Singt« gibt diesen Sinn knapp und verständlich wieder.
- source_word: לָהּ
  choice: von ihm
  rationale: Das feminine Suffix bezieht sich auf den im Hebräischen femininen כֶּרֶם. Mit ענה kann die Präposition eine Ausrichtung auf den Weinberg oder ein Singen über ihn ausdrücken; im Deutschen ist »von ihm« natürlich.
