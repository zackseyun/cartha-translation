  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: de
  text: Und an jenem Tag wird ein großes Horn geblasen werden, und die Verlorenen[a] im Land Assur und die Vertriebenen[b] im Land Ägypten werden kommen und den HERRN auf dem heiligen Berg in Jerusalem anbeten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Umkommenden“ beziehungsweise „die dem Untergang Entgegengehenden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Verbannten“ beziehungsweise „die Verstoßenen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „sich vor dem HERRN niederwerfen“ oder „sich vor ihm zu Boden werfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Die prophetische Zeitformel wird in natürlichem, würdigem Deutsch wiedergegeben; der Zukunftsbezug ergibt sich aus dem folgenden Futur.
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: wird ein großes Horn geblasen werden
  rationale: Das Nifal wird passiv wiedergegeben. „Horn“ bezeichnet das Schofar verständlich, ohne das Material als Widderhorn enger festzulegen, als es der Ausdruck verlangt; „groß“ bewahrt sowohl die konkrete als auch die bedeutungsmäßige Dimension.
- source_word: הָאֹבְדִים
  choice: die Verlorenen
  rationale: Die substantivierte Form bewahrt im Deutschen die mögliche Bedeutung von Verlorenheit, während die Fußnote die ebenfalls mögliche Bedeutung des Umkommens nennt.
- source_word: בְּאֶרֶץ אַשּׁוּר
  choice: im Land Assur
  rationale: Das ausdrücklich genannte „Land“ bleibt erhalten; „Assur“ ist die geläufige deutsche biblische Bezeichnung für das assyrische Reich beziehungsweise Gebiet.
- source_word: וְהַנִּדָּחִים
  choice: die Vertriebenen
  rationale: Die passive Bedeutung des Partizips und das Exilmotiv werden knapp und natürlich ausgedrückt.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Das im Hebräischen ausdrücklich vorhandene „Land“ wird parallel zu Assur beibehalten.
- source_word: וְהִשְׁתַּחֲווּ
  choice: anbeten
  rationale: Beim HERRN als Bezugspunkt bezeichnet das körperliche Niederwerfen einen Akt der Verehrung; „anbeten“ gibt diesen Sinn idiomatisch wieder, während die Fußnote die konkrete Körperhandlung festhält.
- source_word: לַיהוָה
  choice: den HERRN
  rationale: Der Gottesname JHWH wird nach der üblichen ehrfürchtigen Bibelkonvention als „der HERR“ wiedergegeben.
- source_word: בְּהַר הַקֹּדֶשׁ בִּירוּשָׁלִָם
  choice: auf dem heiligen Berg in Jerusalem
  rationale: Die örtliche und kultische Bildsprache wird direkt und idiomatisch bewahrt.
theological_decisions:
- issue: Zeitlicher Horizont der Sammlung
  choice: Die künftige Sammlung aus Assur und Ägypten bleibt ohne nähere zeitliche Festlegung stehen.
  alternative: Ausschließlich eine geschichtliche Rückkehr oder ausschließlich eine endzeitliche Sammlung.
  rationale: Die Formel „an jenem Tag“ und das Wiederherstellungsbild können mehrere prophetische Horizonte umfassen; die Übersetzung legt den Vers nicht auf nur einen davon fest.
- issue: Wiedergabe des Gottesnamens JHWH
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe wahrt den eindeutigen Bezug auf den Bundesnamen, ohne eine bestimmte Aussprache als sicher vorauszusetzen.
- issue: Art der Verehrung
  choice: anbeten, mit Hinweis auf das Niederwerfen
  alternative: sich niederwerfen
  rationale: Der religiöse Sinn ist im Zusammenhang eindeutig, doch die konkrete körperliche Bildhaftigkeit des hebräischen Verbs wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzteilung nach dem Passivsatz vermeidet einen überladenen deutschen Satz, ohne den inhaltlichen Zusammenhang zu lösen. Die Parallelität von „im Land Assur“ und „im Land Ägypten“ bleibt sichtbar.
