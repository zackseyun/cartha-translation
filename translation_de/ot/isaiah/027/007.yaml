base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: de
  text: Hat er ihn nach dem Schlag dessen geschlagen, der ihn schlug? Oder ist er getötet worden, wie seine Erschlagenen erschlagen wurden?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hat er ihn so geschlagen wie der Schlag dessen, der ihn schlug?“'
    reason: lexical_alternative
  - marker: b
    text: Wahrscheinlich kontrastiert der Zusammenhang die Züchtigung Jakobs beziehungsweise Israels mit dem Gericht über dessen Schläger oder Feinde. Die Pronomen und die Beziehung in „seine Erschlagenen“ bleiben im Hebräischen jedoch knapp und nicht ausdrücklich aufgelöst.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: Hat er ihn so geschlagen, wie …?
  rationale: Das vorangestellte הֲ mit כְּ leitet eine rhetorische Vergleichsfrage ein. „so … wie“ gibt diese Verbindung im heutigen Deutsch natürlich wieder.
- source_word: מַכֵּהוּ
  choice: der ihn geschlagen hatte
  rationale: Das Hifil-Partizip von נכה mit Suffix bezeichnet den, der ihn schlug. Das Plusquamperfekt macht im Deutschen verständlich, dass dieser Schlag dem verglichenen Handeln vorausliegt.
- source_word: הִכָּהוּ
  choice: Hat er ihn … geschlagen
  rationale: Das Perfekt wird als rhetorische Frage im Perfekt wiedergegeben; das Objektpronomen bleibt wie im Hebräischen unbestimmt.
- source_word: אִם
  choice: Oder
  rationale: אִם eröffnet hier die parallele zweite Frage und hat disjunktive Funktion.
- source_word: כְּהֶרֶג
  choice: so getötet, wie
  rationale: Die substantivische Wendung mit הֶרֶג wird idiomatisch verbal wiedergegeben, wobei der Vergleich erhalten bleibt.
- source_word: הֲרֻגָיו
  choice: seine Erschlagenen
  rationale: Die knappe possessive Form bewahrt die im Hebräischen nicht ausdrücklich aufgelöste Beziehung besser als „die von ihm Erschlagenen“.
- source_word: הֹרָג
  choice: wurde er … getötet
  rationale: Die passive Verbform wird als deutsches Passiv wiedergegeben und wahrt den Kontrast zwischen Schlagen und Töten.
theological_decisions:
- issue: Bezug der Pronomen im Vergleich
  choice: Die Pronomen und die knappe Bezeichnung „seine Erschlagenen“ bleiben im Haupttext erhalten.
  alternative: Jakob beziehungsweise Israel und dessen Schläger oder Feinde im Haupttext ausdrücklich nennen.
  rationale: Der hebräische Vers nennt die Beteiligten nicht ausdrücklich. Der Kontext legt einen Vergleich zwischen dem Schlagen Jakobs und dem Gericht an dessen Schlägern nahe, doch eine explizite Benennung würde die vorhandene Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Parallelfragen und die Wiederholung von „geschlagen“ beziehungsweise „getötet“ bilden die Struktur des Hebräischen nach, ohne die mehrdeutigen Pronomen durch Deutungen zu ersetzen.
