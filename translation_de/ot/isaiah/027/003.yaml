  text: אֲנִ֤י יְהוָה֙ נֹֽצְרָ֔/הּ לִ/רְגָעִ֖ים אַשְׁקֶ֑/נָּה פֶּ֚ן יִפְקֹ֣ד עָלֶ֔י/הָ לַ֥יְלָה וָ/י֖וֹם אֶצֳּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: de
  text: Ich, Yahweh, bin ihr Hüter. Jeden Augenblick[a] bewässere ich sie. Damit niemand sie angreift,[b] behüte ich sie Nacht und Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von Augenblick zu Augenblick“; möglich ist ebenso der Sinn „fortwährend“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit niemand sie bestraft“, „gegen sie vorgeht“ oder „sie heimsucht“. Das hebräische Verb kann ein feindliches Einschreiten oder eine strafende Heimsuchung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹצְרָהּ / אֶצֳּרֶנָּה
  choice: behüte ihn
  rationale: Beide Formen gehen auf נצר zurück und bezeichnen wachsames Hüten und Bewahren. Das deutsche Pronomen richtet sich nach dem grammatischen Geschlecht von „Weinberg“ im Kontext.
- source_word: לִרְגָעִים
  choice: jeden Augenblick
  rationale: Die Wendung bezeichnet eine fortwährend wiederholte Fürsorge; die relativ formnahe Wiedergabe bewahrt zugleich das Bild einzelner Augenblicke.
- source_word: אַשְׁקֶנָּה
  choice: bewässere ich ihn
  rationale: Der Hifil von שקה bedeutet „zu trinken geben“; bei einem Weinberg ist „bewässern“ die natürliche deutsche Entsprechung.
- source_word: פֶּן
  choice: damit niemand
  rationale: פֶּן leitet hier einen vorbeugenden Zweck beziehungsweise eine verhinderte Möglichkeit ein. Die Konstruktion mit „damit niemand“ ist im modernen Deutsch natürlicher als „auf dass nicht“.
- source_word: יִפְקֹד עָלֶיהָ
  choice: ihn angreift
  rationale: פקד mit על kann ein feindliches Einschreiten oder eine strafende Heimsuchung ausdrücken. Im Bild des bewachten Weinbergs passt „angreifen“, ohne die mögliche gerichtliche Nuance als einzig richtige festzulegen.
- source_word: לַיְלָה וָיוֹם
  choice: Nacht und Tag
  rationale: Die feste Paarformel bezeichnet ununterbrochene Wachsamkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Yahweh“ bewahrt seinen Charakter als Eigenname.
- issue: Unausgesprochenes Subjekt von יִפְקֹד
  choice: niemand
  alternative: er; ein Feind
  rationale: Das hebräische Verb steht in der dritten Person Singular, ohne dass ein bestimmtes Subjekt genannt wird. Ein unbestimmtes „niemand“ gibt die offene Bedrohung wieder, ohne einen konkreten Angreifer in den Text einzutragen.
- issue: Bedeutung von פקד על im Schutzmotiv
  choice: angreifen
  alternative: bestrafen; heimsuchen; gegen ihn einschreiten
  rationale: Der Kontext betont Yahwehs Schutz des Weinbergs. „Angreifen“ bringt die feindliche Handlung klar zum Ausdruck; die mögliche strafende oder gerichtliche Bedeutung bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den feierlichen Nachdruck des hebräischen Ich-Wortes. „Behüten“ wird an beiden Stellen verwendet, um die Wiederholung derselben hebräischen Wurzel sichtbar zu halten.
