revisions:
- from: 'Darum wird dadurch Jakobs Schuld gesühnt, und dies ist die ganze Frucht davon, dass seine Sünde beseitigt wird: Er macht alle Altarsteine wie zertrümmerte Kalksteine; keine Aschera-Pfähle und Sonnensäulen bleiben stehen.[a]'
  to: 'Darum wird die Schuld Jakobs dadurch gesühnt, und darin besteht das volle Ergebnis der Beseitigung seiner Sünde: Wenn er alle Steine des Altars wie zertrümmerte Kalksteine macht, werden Aschera-Pfähle und Sonnensäulen nicht stehen bleiben.[a]'
  rationale: Die Revision glättet die deutsche Syntax, bewahrt die Bildsprache und gibt den Zusammenhang wieder, dass die Zerschlagung des Altars und das Nichtbestehen der Kultobjekte das volle Ergebnis der Beseitigung von Jakobs Sünde kennzeichnen. Das nicht ausdrücklich bezeichnete Subjekt des hebräischen Suffixes bleibt durch „er“ offen. Die Fußnote wurde terminologisch parallelisiert und hält die lexikalische Unsicherheit weiterhin knapp fest.
