  naturalness: „Darum wird dadurch“ und besonders „dies ist die ganze Frucht davon, dass seine Sünde beseitigt wird“ wirken im modernen Deutschen unnötig schwerfällig. Eine syntaktisch glattere Fassung kann die Aussage bewahren, ohne die Ambiguität des Subjekts von בְּשׂוּמוֹ aufzulösen.
  terminology: „Aschera-Pfähle“ und „Sonnensäulen“ sind als behutsame, verständliche Bezeichnungen vertretbar. Die Fußnote wahrt angemessen die Unsicherheit hinsichtlich der genauen materiellen Gestalt der Kultobjekte. „Kalksteine“ gibt גיר vertretbar wieder.
