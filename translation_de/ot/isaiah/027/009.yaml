source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: de
  text: 'Darum wird die Schuld Jakobs dadurch gesühnt, und darin besteht das volle Ergebnis der Beseitigung seiner Sünde: Wenn er alle Steine des Altars wie zertrümmerte Kalksteine macht, werden Aschera-Pfähle und Sonnensäulen nicht stehen bleiben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aschera-Kultobjekte und Sonnenkultobjekte“. Die genaue Gestalt dieser antiken Kultgegenstände ist nicht sicher.'
    reason: Die genaue Bedeutung und materielle Form von אֲשֵׁרִים und חַמָּנִים ist nicht in allen Einzelheiten gesichert; die Fußnote erläutert dies, ohne die Hauptübersetzung zu überladen.
lexical_decisions:
- source_word: יְכֻפַּר עֲוֺן
  choice: Schuld gesühnt
  rationale: Das passive כפר bezeichnet hier Sühne beziehungsweise die Beseitigung von Schuld; עון umfasst sowohl Verfehlung als auch die daraus erwachsende Schuld.
- source_word: כָּל־פְּרִי
  choice: die ganze Frucht
  rationale: Bewahrt das konkrete hebräische Bild und bezeichnet das vollständige Ergebnis der Sündenbeseitigung.
- source_word: הָסִר חַטָּאתוֹ
  choice: dass seine Sünde beseitigt wird
  rationale: Gibt den Infinitiv הָסִר als Beseitigung wieder, ohne genauer festzulegen, wer handelt.
- source_word: אַבְנֵי־גִר מְנֻפָּצוֹת
  choice: zertrümmerte Kalksteine
  rationale: גִר bezeichnet kalkartiges Material; מְנֻפָּצוֹת beschreibt zerschlagene beziehungsweise zertrümmerte Steine.
- source_word: אֲשֵׁרִים
  choice: Aschera-Pfähle
  rationale: Bezeichnet Kultobjekte im Zusammenhang mit Aschera; die verständliche traditionelle Wiedergabe vermeidet eine Gleichsetzung mit der Gottheit selbst.
- source_word: חַמָּנִים
  choice: Sonnensäulen
  rationale: Der Ausdruck bezeichnet wahrscheinlich kultische Sonnensäulen oder Sonnenbilder; die gewählte Wiedergabe wahrt den solaren Bezug.
theological_decisions:
- issue: Verhältnis von Sühne und Zerstörung des Götzendienstes
  choice: Der Vers lässt die Zerstörung der Kultobjekte als Frucht beziehungsweise Kennzeichen der Beseitigung von Jakobs Sünde erscheinen.
  alternative: Die Zerstörung der Altäre selbst als Mittel verstehen, durch das Sühne bewirkt wird.
  rationale: בזאת und זה כל־פרי lassen mehrere syntaktische Nuancen zu. Die Formulierung bewahrt die Spannung, ohne die Sühne mechanisch an menschliche Bilderzerstörung zu binden.
- issue: Subjekt von בְּשׂוּמוֹ
  choice: „Er macht“ bleibt ohne ausdrücklich benanntes Bezugswort.
  alternative: Explizit „Jakob macht“ oder „Gott macht“ schreiben.
  rationale: Das maskuline Singularsuffix kann im Kontext unterschiedlich bezogen werden; der deutsche Text soll diese echte Unbestimmtheit nicht dogmatisch auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von „Frucht“ und „Kalksteinen“ bleibt erhalten; seltene Kultbegriffe werden verständlich wiedergegeben und in einer knappen Fußnote qualifiziert.
