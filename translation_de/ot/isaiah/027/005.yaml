  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: de
  text: Oder er halte sich an meine Schutzmacht[a]; er schließe Frieden mit mir, Frieden schließe er mit mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »meine Schutzfestung«, »meine Stärke« oder »meinen Schutz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Oder
  rationale: Leitet als Alternative zum zuvor angekündigten Gericht die Möglichkeit ein, bei Gott Zuflucht und Frieden zu suchen.
- source_word: יַחֲזֵק בְּמָעוּזִּי
  choice: er suche Zuflucht bei mir
  rationale: Die Verbindung bezeichnet ein entschlossenes Ergreifen der von Gott gewährten Schutzmacht. Eine wörtliche Wiedergabe wie »meine Stärke ergreifen« wäre im Deutschen ungewöhnlich; »Zuflucht bei mir suchen« bewahrt die Schutzbedeutung von מָעוֹז und gibt die Wendung natürlich wieder.
- source_word: יַעֲשֶׂה שָׁלוֹם לִי
  choice: er schließe Frieden mit mir
  rationale: עָשָׂה שָׁלוֹם mit לְ bezeichnet hier das Herstellen eines Friedensverhältnisses. »Frieden schließen mit« ist die natürliche deutsche Entsprechung.
- source_word: שָׁלוֹם יַעֲשֶׂה לִּי
  choice: Frieden schließe er mit mir
  rationale: Die Wiederholung und die vorangestellte Stellung von שָׁלוֹם werden zur Betonung beibehalten, ohne den deutschen Satz unnötig schwerfällig zu machen.
theological_decisions:
- issue: Bezug der Pronomen der ersten Person
  choice: Gott ist der Sprecher; angeboten werden Zuflucht bei ihm und Frieden mit ihm.
  alternative: Eine unpersönlichere Deutung, die den unmittelbaren Gottesbezug abschwächt.
  rationale: Der Zusammenhang von Jesaja 27 weist die Rede Gott zu. Die Übersetzung wahrt die direkte Einladung, ohne darüber hinausgehende lehrmäßige Folgerungen einzutragen.
- issue: Verhältnis von Schutz und Versöhnung
  choice: 'Die beiden Aussagen bleiben als eng verbundene, aber unterscheidbare Bilder stehen: Zuflucht bei Gott und Frieden mit Gott.'
  alternative: Beide Aussagen zu einer einzigen abstrakten Aussage über Versöhnung zusammenziehen.
  rationale: Der hebräische Text verbindet das konkrete Schutzbild von מָעוֹז mit der zweimaligen Friedensaussage; diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der jussivische Aufforderungscharakter wird mit dem Konjunktiv I wiedergegeben. Die markante Wiederholung von »Frieden« bleibt erhalten.
