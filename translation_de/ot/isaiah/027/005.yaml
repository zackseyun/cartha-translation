  source_fidelity: Die Wiedergabe von אוֹ sowie der zweimaligen Friedensformel ist treffend; auch der auffordernde Charakter wird angemessen durch Konjunktiv I ausgedrückt. »Zuflucht bei mir suchen« gibt jedoch die Schutzrichtung wieder, ersetzt aber die konkrete Metapher von יַחֲזֵק בְּמָעוּזִּי (sich an Gottes Schutzmacht/Schutzfestung halten) durch eine freiere Umschreibung.
