  terminology: „Jahwe“, „Leviatan“, „Schlange“ und „Seeungeheuer“ sind für eine moderne, gehobene deutsche Bibelübersetzung angemessen. „Seeungeheuer“ bewahrt bei תַּנִּין die poetisch-mythische Offenheit besser als eine eindeutige Identifikation als „Drache“.
