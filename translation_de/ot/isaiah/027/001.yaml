  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: de
  text: An jenem Tag wird Jahwe mit seinem harten, großen und starken Schwert Leviatan, die flüchtige Schlange[a], und Leviatan, die gewundene Schlange[b], zur Rechenschaft ziehen; er wird das Seeungeheuer[c] töten, das im Meer ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die schnelle Schlange“ beziehungsweise „die dahingleitende Schlange“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die sich windende Schlange“ beziehungsweise „die krumme Schlange“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Drache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird im modernen Deutschen natürlich und zugleich feierlich wiedergegeben.
- source_word: יִפְקֹד ... עַל
  choice: wird ... zur Rechenschaft ziehen
  rationale: Im Gerichtskontext bezeichnet פקד mit עַל ein strafendes Einschreiten. Die Formulierung bewahrt den richterlichen Sinn, ohne das weitere Bedeutungsspektrum des Verbs unnötig zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּחַרְבוֹ הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: mit seinem harten, großen und starken Schwert
  rationale: Das instrumentale ב wird mit „mit“ wiedergegeben. Die drei aufeinanderfolgenden Adjektive und das konkrete Bild des Schwertes bleiben erhalten; קָשֶׁה bedeutet grundlegend „hart“ und kann hier zugleich die Unerbittlichkeit der Waffe ausdrücken.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Der Name der mythisch-poetischen Gestalt wird in seiner etablierten deutschen Form transliteriert.
- source_word: נָחָשׁ בָּרִחַ
  choice: die flüchtige Schlange
  rationale: „Schlange“ gibt נָחָשׁ unmittelbar wieder; „flüchtig“ bewahrt die wahrscheinliche Bedeutung von בָּרִחַ, lässt aber die mögliche Nuance „schnell dahingleitend“ offen.
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: die gewundene Schlange
  rationale: „Gewunden“ erfasst das Krumme, Sich-Windende des seltenen Ausdrucks und passt zum poetischen Schlangenbild.
- source_word: וְהָרַג
  choice: und er wird ... töten
  rationale: Das Waw mit Perfekt setzt in der prophetischen Folge die Zukunftsaussage fort; „töten“ ist klar, würdig und nicht archaisch.
- source_word: הַתַּנִּין
  choice: das Seeungeheuer
  rationale: תַּנִּין bezeichnet hier ein großes, schlangen- oder drachenartiges Ungeheuer. „Seeungeheuer“ bewahrt die Chaoswesen-Metaphorik und harmoniert mit der ausdrücklichen Verortung im Meer, ohne vorschnell das moderne Bild eines Drachen festzulegen.
- source_word: אֲשֶׁר בַּיָּם
  choice: das im Meer ist
  rationale: Die schlichte Relativkonstruktion und die Ortsangabe werden eng am Hebräischen wiedergegeben.
theological_decisions:
- issue: Mythisch-poetische Bildwelt von Leviatan und תַּנִּין
  choice: Die Gestalten werden als Leviatan und Seeungeheuer innerhalb des prophetischen Bildes stehen gelassen.
  alternative: Sie ausdrücklich mit Satan, dem Chaos oder einem bestimmten Reich gleichzusetzen.
  rationale: Der Vers benennt die Bildgestalten, bestimmt aber ihren konkreten historischen oder theologischen Bezug nicht. Eine ausdrückliche Identifikation würde die im Text verbleibende Deutungsspannung auflösen.
- issue: Bezug des Strafhandelns und Stellung der Schwertangabe
  choice: Das Schwert steht vor beiden parallelen Leviatan-Beschreibungen; „zur Rechenschaft ziehen“ regiert beide mit „und“ verbundenen Objekte.
  alternative: Die Schwertangabe zwischen die beiden Leviatan-Beschreibungen zu stellen oder nur auf die erste zu beziehen.
  rationale: Die hebräische Syntax nennt zunächst Jahwes Werkzeug und danach zwei mit עַל koordinierte Bezeichnungen. Die deutsche Stellung macht deutlich, dass dasselbe Gerichtshandeln beiden gilt, ohne festzulegen, ob zwei Gestalten oder zwei Beschreibungen derselben Gestalt gemeint sind.
translation_notes:
  register: Moderne, würdevolle prophetische Sprache. Die Häufung „harten, großen und starken“ wahrt den Nachdruck des Hebräischen, wird im Deutschen jedoch mit Kommas statt wiederholtem „und“ natürlich gestaltet. Die beiden Leviatan-Zeilen bleiben parallel; die Semikolonstruktur markiert den abschließenden, weiterführenden Tötungssatz.
