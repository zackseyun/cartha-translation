source:
  edition: WLC
  text: כִּ֣י עִ֤יר בְּצוּרָה֙ בָּדָ֔ד נָוֶ֕ה מְשֻׁלָּ֥ח וְ/נֶעֱזָ֖ב כַּ/מִּדְבָּ֑ר שָׁ֣ם יִרְעֶ֥ה עֵ֛גֶל וְ/שָׁ֥ם יִרְבָּ֖ץ וְ/כִלָּ֥ה סְעִפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: de
  text: Denn die befestigte Stadt liegt einsam, eine Wohnstätte[a], aufgegeben und verlassen wie die Wüste. Dort weidet ein Kalb, dort lagert es und frisst ihre Zweige kahl.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Weide“. Das hebräische Wort kann sowohl einen Wohnort als auch einen Weideplatz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und verzehrt ihre Zweige vollständig“. Worauf sich „ihre“ genau bezieht, bleibt im poetischen Bild offen; gemeint sein kann der Bewuchs der verlassenen Stadt.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung oder Erläuterung ein, ohne die mögliche Aussagefunktion unnötig zu verstärken.
- source_word: עִיר בְּצוּרָה
  choice: die befestigte Stadt
  rationale: Gibt die verteidigte, befestigte Stadt idiomatisch wieder. Der bestimmte Artikel ist im Hebräischen nicht ausdrücklich gesetzt, wird aber durch den wahrscheinlichen Bezug im Kontext nahegelegt.
- source_word: בָּדָד
  choice: liegt einsam
  rationale: Das prädikative „einsam“ bezeichnet die isolierte, menschenleere Lage; „liegt“ ergänzt im Deutschen natürlich den Zustand einer Stadt.
- source_word: נָוֶה
  choice: eine Wohnstätte
  rationale: Bewahrt die Grundbedeutung eines bewohnten Ortes, ohne die ebenfalls mögliche Weidebedeutung im Haupttext festzulegen.
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: aufgegeben und verlassen
  rationale: Die beiden passiven Ausdrücke zeichnen gemeinsam einen preisgegebenen, menschenleeren Ort. Die Doppelung bleibt als poetische Verstärkung erhalten.
- source_word: כַּמִּדְבָּר
  choice: wie die Wüste
  rationale: „Wüste“ bezeichnet hier allgemein unbewohntes, unbestelltes Land und passt zum Bild der verwilderten Stadt.
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: Dort weidet ein Kalb
  rationale: Gibt das pastorale Bild klar und unmittelbar wieder; der Singular „ein Kalb“ bleibt erhalten.
- source_word: וְשָׁם יִרְבָּץ
  choice: dort lagert es
  rationale: „Lagern“ ist eine natürliche, leicht gehobene Bezeichnung für das Niederlegen eines Weidetiers und führt das Kalb als Subjekt fort.
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: und frisst ihre Zweige kahl
  rationale: Macht die vollständige Verzehrung durch כלה anschaulich, während „ihre“ den femininen Rückbezug des hebräischen Suffixes bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Satzführung. Das Präsens stellt die Verwüstung anschaulich vor Augen; die hebräischen Imperfektformen könnten im Zusammenhang auch zukünftig verstanden werden. Die zwei Ausdrücke für das Verlassensein sowie der feminine Rückbezug in „ihre Zweige“ wurden nicht eingeebnet.
