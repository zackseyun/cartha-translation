base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: de
  text: Mit Maß[a] führtest du mit ihr Streit, indem du sie fortschicktest.[b] Er trieb sie fort mit seinem heftigen Wind am Tag des Ostwinds.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit Zurückhaltung“ oder „nach genauem Maß“. Das seltene hebräische Wort deutet wahrscheinlich darauf hin, dass das Gericht begrenzt war und nicht auf völlige Vernichtung hinauslief.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet das weibliche Pronomen „sie“. Der Bezug ist wahrscheinlich Zion, Israel oder das in weiblicher Gestalt personifizierte Volk.
    reason: alternative_reading
  - marker: c
    text: Der Ostwind ist ein geläufiges Bild für einen heißen, zerstörerischen Wind aus der Wüste.
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: Mit Maß
  rationale: Der seltene Ausdruck wird wahrscheinlich adverbial gebraucht und bezeichnet ein abgemessenes, begrenztes Gericht. „Mit Maß“ bewahrt sowohl die Kürze als auch das Bild des Hebräischen.
- source_word: בְּשַׁלְחָהּ
  choice: als du sie fortschicktest
  rationale: Die Form von שׁלח mit Suffix der 3. Person Femininum Singular bezeichnet das Fortsenden der weiblich personifizierten Größe. Die temporale Wiedergabe ist im Deutschen natürlich und lässt offen, ob konkret an Verbannung oder Vertreibung gedacht ist.
- source_word: תְּרִיבֶנָּה
  choice: strittest du mit ihr
  rationale: ריב kann Streit, Rechtsstreit oder ein gerichtliches Vorgehen bezeichnen. „Strittest du mit ihr“ hält die gerichtliche Färbung als mögliche Bedeutung offen, ohne sie ausdrücklich festzulegen.
- source_word: הָגָה
  choice: Er trieb sie fort
  rationale: Im Zusammenhang mit dem heftigen Wind bezeichnet das Verb ein entschiedenes Entfernen oder Vertreiben. „Trieb sie fort“ gibt die Bewegung wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: בְּרוּחוֹ
  choice: mit seinem … Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten; die Verbindung mit dem Ostwind spricht hier klar für den konkreten Wind.
- source_word: הַקָּשָׁה
  choice: heftigen
  rationale: Das Adjektiv bezeichnet Härte oder Strenge. „Heftig“ verbindet sich im modernen Deutschen natürlich mit „Wind“ und vermittelt dessen zerstörerische Stärke.
- source_word: בְּיוֹם קָדִים
  choice: am Tag des Ostwinds
  rationale: קָדִים bezeichnet den aus Osten kommenden, häufig heißen und zerstörerischen Wüstenwind. Die knappe Wiedergabe wahrt das Bild; seine kulturelle Konnotation wird in der Fußnote erläutert.
theological_decisions:
- issue: Bezug der weiblichen Suffixe
  choice: Das feminine Pronomen „sie/ihr“ bleibt im Haupttext erhalten.
  alternative: Israel, Zion oder das als Frau personifizierte Gottesvolk ausdrücklich nennen.
  rationale: Der Vers selbst bestimmt den Bezug nicht ausdrücklich. Die feminine Personifikation zu bewahren verhindert eine unnötige Verengung.
- issue: Wechsel von der zweiten zur dritten Person
  choice: Der Wechsel zwischen „du …“ und „Er …“ wird beibehalten.
  alternative: Beide Satzteile einheitlich mit „du“ formulieren.
  rationale: Der auffällige Personenwechsel steht im hebräischen Text. Eine Glättung würde dessen poetische Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Struktur, die feminine Personifikation und der unvermittelte Wechsel von der zweiten zur dritten Person bleiben erhalten. Schwierige lexikalische Alternativen werden in den Fußnoten offengelegt.
