source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: de
  text: Und an jenem Tag wird Jahwe vom Strombett des Stromes[a] bis zum Wadi Ägyptens[b] dreschen; und ihr werdet einer nach dem anderen aufgelesen werden[c], ihr Söhne Israels[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Strom“ ist wahrscheinlich der Euphrat gemeint.
    reason: cross_reference
  - marker: b
    text: Auch „Bach Ägyptens“. Das hebräische Wort bezeichnet häufig ein zeitweise wasserführendes Flussbett, nicht den Nil.
    reason: lexical_alternative
  - marker: c
    text: Das Verb bezeichnet das Auflesen von Erntegut und lässt an eine Sammlung Stück für Stück denken.
    reason: cultural_note
  - marker: d
    text: 'Auch „Kinder Israels“; wörtlich: „Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, würdigem Deutsch wiedergegeben, ohne die hebräische Kopularkonstruktion unnötig nachzubilden.
- source_word: יַחְבֹּט
  choice: wird … die Früchte abschlagen
  rationale: חבט bezeichnet das Ausschlagen bzw. Abklopfen von Erntegut. Die Formulierung bewahrt das landwirtschaftliche Bild und passt zur anschließenden Vorstellung des einzelnen Auflesens, ohne voreilig nur Getreidedreschen anzunehmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der verbreiteten wissenschaftlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: vom Stromlauf des großen Stromes
  rationale: שׁבלת bezeichnet hier im geografischen Zusammenhang am ehesten den Lauf bzw. die Strömung eines Flusses; הנהר wird als titelartige Bezeichnung des großen Stromes beibehalten.
- source_word: עַד נַחַל מִצְרָיִם
  choice: bis zum Bach Ägyptens
  rationale: נחל kann ein Wadi bzw. saisonales Flussbett bezeichnen. „Bach Ägyptens“ ist als geografische Bezeichnung im Deutschen verständlich; die genauere Beschaffenheit wird in der Fußnote erläutert.
- source_word: תְּלֻקְּטוּ
  choice: werdet … aufgelesen werden
  rationale: Das Passiv von לקט erinnert an das Auflesen von Erntegut und verbindet so Sammlung und landwirtschaftliches Bild enger als das allgemeinere „gesammelt werden“.
- source_word: לְאַחַד אֶחָד
  choice: einzeln … einer nach dem anderen
  rationale: Die distributive Wendung betont, dass jede Person einzeln gesammelt wird; die deutsche Doppelung macht diesen Nachdruck natürlich verständlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  rationale: Die wörtliche männliche Pluralform und die direkte Anrede werden bewahrt; eine Fußnote nennt die im Deutschen geläufige kollektive Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; seine Wiedergabe bewahrt den persönlichen Bundesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des Erntebildes in יַחְבֹּט und תְּלֻקְּטוּ
  choice: Früchte abschlagen und einzeln auflesen
  alternative: dreschen und sammeln
  rationale: Der Text lässt das konkrete Erntegut unausgesprochen. Die gewählte Fassung erhält das Bild des Ausschlagens und Auflesens, ohne die Metapher ausschließlich auf Getreide festzulegen.
- issue: Personenbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels / Israeliten
  rationale: Die grammatisch männliche, traditionelle Bundesbezeichnung bleibt sichtbar, während die Fußnote eine natürliche kollektive Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das landwirtschaftliche Leitbild wird durch „Früchte abschlagen“ und „aufgelesen“ erhalten. Die geografischen Bezeichnungen bleiben quellennah; wahrscheinliche Identifikationen und lexikalische Alternativen stehen in den Fußnoten.
