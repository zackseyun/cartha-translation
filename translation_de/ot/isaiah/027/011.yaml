  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its branches[a] dry up, they are broken; women come and set them on fire. For this is a people without understanding; therefore its Maker will not have compassion on it, and the one who formed it will show it no favor.
translation:
  language: de
  text: Wenn ihre Zweige[a] vertrocknen, werden sie abgebrochen; Frauen kommen und zünden sie an. Denn dies ist ein Volk ohne Einsicht. Darum wird sein Schöpfer sich seiner nicht erbarmen, und der es geformt hat, wird ihm keine Gnade erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht bei „werden … abgebrochen“ eine Pluralform, beim anschließenden Entzünden jedoch ein feminines Singularobjekt. Die Zweige beziehungsweise das Pflanzenmaterial werden dort offenbar als Gesamtheit aufgefasst.
    reason: Grammatik und genuine Numerusspannung des hebräischen Textes
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: wenn … vertrocknen
  rationale: Die Präposition ב mit der Verbform wird temporal wiedergegeben. „Vertrocknen“ passt zum Bild dürrer, anschließend abgebrochener und verbrannter Pflanzenteile.
- source_word: קְצִירָהּ
  choice: ihre Zweige
  rationale: Obwohl קציר gewöhnlich „Ernte“ oder „Abgeschnittenes“ bezeichnet, verlangt der Zusammenhang hier trockenes Pflanzenmaterial, das abgebrochen und verbrannt wird. „Zweige“ gibt das konkrete Bild im Deutschen natürlich wieder.
- source_word: תִּשָּׁבַרְנָה
  choice: werden sie abgebrochen
  rationale: Die feminine Pluralform bezieht sich auf die trockenen Zweige beziehungsweise Pflanzenteile. „Abgebrochen“ verdeutlicht den Vorgang, ohne zusätzliche Handlungsträger einzuführen.
- source_word: נָשִׁים בָּאוֹת
  choice: Frauen kommen
  rationale: Schlichte, unmittelbare Wiedergabe der folgenden Handlung.
- source_word: מְאִירוֹת אוֹתָהּ
  choice: verbrennen sie
  rationale: Das Verb beschreibt das Entzünden beziehungsweise Verbrennen des dürren Pflanzenmaterials. Die deutsche Pluralform folgt dem ausdrücklich genannten Bezugswort „Zweige“; die abweichende hebräische Numerusführung wird in der Fußnote festgehalten.
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: dies ist ein Volk ohne Einsicht
  rationale: Die Formulierung gibt das Fehlen von Verständnis klar und idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: עַל כֵּן
  choice: darum
  rationale: Natürliche inferentielle Verknüpfung zwischen der fehlenden Einsicht des Volkes und dem angekündigten Gericht.
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: wird … sich seiner nicht erbarmen
  rationale: רחם bezeichnet Erbarmen beziehungsweise Mitgefühl. Die gehobene, aber geläufige Wendung „sich seiner erbarmen“ passt zum würdevollen Register und bezieht sich auf das Volk als Kollektiv.
- source_word: עֹשֵׂהוּ
  choice: sein Schöpfer
  rationale: Die partizipiale Gottesbezeichnung wird knapp und theologisch offen wiedergegeben. „Schöpfer“ bewahrt die Aussage, dass Gott dieses Volk gemacht hat.
- source_word: וְיֹצְרוֹ
  choice: der es geformt hat
  rationale: יצר bezeichnet das Formen oder Gestalten. Die verbale Wiedergabe erhält den Unterschied zum vorhergehenden עשה und zugleich den Parallelismus.
- source_word: לֹא יְחֻנֶּנּוּ
  choice: wird ihm keine Gnade erweisen
  rationale: חנן bedeutet, Gunst oder Gnade zu erweisen. Die Formulierung ist verständlich und bewahrt die Aussage verweigerter gnädiger Zuwendung.
theological_decisions:
- issue: Referenz und Numerus im Pflanzenbild
  choice: „Zweige“ und die dazu passenden deutschen Pluralformen verwenden; den hebräischen Wechsel zum femininen Singular in einer Fußnote dokumentieren.
  alternative: „Ernte“ beziehungsweise „Abgeschnittenes“ kollektiv im Singular wiedergeben.
  rationale: Der Kontext beschreibt trockenes Pflanzenmaterial, das abgebrochen und verbrannt wird. Der hebräische Text wechselt jedoch zwischen femininem Plural und femininem Singular; diese Spannung darf nicht stillschweigend als eindeutig ausgegeben werden.
- issue: Parallele Gottesbezeichnungen im Gerichtswort
  choice: עשה als „Schöpfer“ und יצר als „der es geformt hat“ unterscheidbar wiedergeben.
  alternative: Beide Ausdrücke zu einer einzigen Bezeichnung wie „Gott“ zusammenziehen.
  rationale: Die zwei hebräischen Schöpfungsbegriffe sind bewusst parallel gesetzt. Ihre Bewahrung erhält die Spannung, dass derjenige, der das Volk geschaffen und geformt hat, ihm wegen seiner fehlenden Einsicht Erbarmen und Gnade versagt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, allgemein verständlichem Ton. „Sich seiner erbarmen“ ist leicht gehoben und entspricht dem prophetischen Register; Satzbau und Wortwahl bleiben dennoch zugänglich.
