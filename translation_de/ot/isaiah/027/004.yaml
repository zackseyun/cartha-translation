base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: de
  text: Zorn habe ich nicht. Wer stellte mir Dornen und Disteln im Kampf entgegen?[a] Ich würde gegen sie vorgehen[b] und sie allesamt verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Wer gäbe mir Dornen und Disteln im Kampf?“ Die Wendung kann als Herausforderung oder als Wunsch verstanden werden, solche Gegner vor sich zu haben.'
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Verb bezeichnet hier ein Schreiten oder Vorrücken gegen etwas. Die hebräischen Fürwörter stehen in der weiblichen Einzahl und beziehen sich zusammenfassend auf „Dornen und Disteln“; im Deutschen steht dafür der Plural „sie“.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה אֵין לִי
  choice: Zorn hege ich nicht
  rationale: Die vorangestellte Aussage bewahrt die Betonung des Hebräischen. „Zorn“ gibt die starke Bedeutung von חֵמָה wieder; „hege ich nicht“ formuliert die hebräische Existenz- und Besitzkonstruktion natürlich, ohne die Aussage über ihren unmittelbaren Zusammenhang hinaus zu erweitern.
- source_word: מִי יִתְּנֵנִי
  choice: Wer stellte mir … entgegen?
  rationale: Wörtlich heißt die Wendung etwa „Wer gäbe mir …?“. Im Zusammenhang hat sie die Kraft einer Herausforderung oder eines Wunsches nach Gegnern; der Konjunktiv „stellte“ erhält diesen offenen, irrealen Ton.
- source_word: שָׁמִיר שַׁיִת
  choice: Dornen und Disteln
  rationale: Das feste Wortpaar bezeichnet dorniges, zum Verbrennen bestimmtes Gestrüpp. Die geläufige deutsche Paarformel bewahrt das Bild.
- source_word: בַּמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präpositionalfügung bezeichnet hier die feindliche Konfrontation. „Zum Kampf entgegenstellen“ ist im Deutschen natürlicher als eine rein örtliche Wiedergabe mit „im Kampf“.
- source_word: אֶפְשְׂעָה בָהּ
  choice: Ich würde gegen sie anstürmen
  rationale: Das Verb vermittelt hier ein entschlossenes Schreiten beziehungsweise Vorrücken im Kampf. „Anstürmen“ bewahrt Bewegung und Kampfkontext, ohne die Bildsprache auf ein bloßes „angreifen“ zu reduzieren.
- source_word: אֲצִיתֶנָּה יָּחַד
  choice: und sie allesamt verbrennen
  rationale: Die Kausativform bezeichnet das Anzünden oder Inbrandsetzen; im Zusammenhang ist die vollständige Verbrennung gemeint. „Allesamt“ gibt den umfassenden Nachdruck von יַחַד idiomatisch wieder.
theological_decisions:
- issue: Gottes Haltung gegenüber dem Weinberg
  choice: Die unqualifizierte Aussage „Zorn hege ich nicht“ bleibt auf den unmittelbaren Zusammenhang des von JHWH behüteten Weinbergs bezogen.
  alternative: 'Man könnte sie absolut als allgemeine Aussage verstehen, dass Gott keinen Zorn habe, oder ausdrücklich ergänzen: „Auf ihn bin ich nicht zornig.“'
  rationale: Der hebräische Text nennt kein ausdrückliches Objekt. Deshalb wird weder „auf den Weinberg“ ergänzt noch eine allgemeine Lehraussage formuliert; die Spannung zwischen dem fehlenden Zorn und der anschließenden Kampfansage bleibt erhalten.
- issue: Dornen und Disteln als Gegner
  choice: Die Pflanzenbilder bleiben unbestimmt und werden nicht ausdrücklich als Menschen, Völker oder Sünden gedeutet.
  alternative: Die Dornen und Disteln könnten aus dem weiteren Kontext symbolisch auf feindliche Mächte oder auf unfruchtbare Angehörige des Volkes bezogen werden.
  rationale: Der Vers selbst identifiziert die Bildträger nicht. Eine konkrete theologische Zuordnung würde die genuine Offenheit des Bildes vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, kraftvoller Satzführung. Die Anfangsstellung von „Zorn“ spiegelt den Nachdruck des Hebräischen; der Konjunktiv erhält den herausfordernden beziehungsweise irrealen Charakter der folgenden Aussage.
