  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: de
  text: Mit Freude werdet ihr Wasser schöpfen aus den Quellen des Heils[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus den Brunnen des Heils«.'
    reason: lexical_alternative
  - marker: b
    text: »Heil« kann hier auch mit »Rettung« oder »Befreiung« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: werdet ihr schöpfen
  rationale: Das Qal Perfekt 2. Person maskulin Plural mit vorangestelltem ו wird im prophetischen Zusammenhang natürlich futurisch wiedergegeben. Das einleitende ו bleibt unübersetzt, da der Vers im Deutschen keinen ausdrücklichen Anschluss mit »und« benötigt.
- source_word: מַיִם
  choice: Wasser
  rationale: Die hebräische Pluralform bezeichnet hier Wasser als Stoff und wird im Deutschen idiomatisch mit dem Singular wiedergegeben.
- source_word: בְּ/שָׂשׂוֹן
  choice: mit Freude
  rationale: Die Verbindung aus Präposition und Substantiv bezeichnet die begleitende Haltung. »Mit Freude« bewahrt den nominalen Ausdruck und klingt zugleich natürlich.
- source_word: מִ/מַּעַיְנֵי
  choice: aus den Quellen
  rationale: מַעְיָן bezeichnet gewöhnlich eine Quelle oder einen natürlichen Wasseraustritt. »Quellen« passt zur Bildsprache und ist im heutigen Deutsch natürlicher als »Quellbrunnen«.
- source_word: הַ/יְשׁוּעָה
  choice: des Heils
  rationale: יְשׁוּעָה kann Rettung, Befreiung oder Heil bezeichnen. »Heil« erhält sowohl den unmittelbaren Gedanken göttlicher Rettung als auch die weitere theologische Tragweite des Jesajabuchs.
theological_decisions:
- issue: Ob יְשׁוּעָה eng als zeitgeschichtliche »Rettung« oder mit weiterem theologischem Klang als »Heil« wiederzugeben ist
  choice: Heil
  alternative: Rettung
  rationale: Jesaja 12 feiert Gottes rettendes Handeln in einer Sprache, die geschichtliche Befreiung und umfassenderes Heil zusammenhält. »Heil« bewahrt diese Spannung, ohne spätere dogmatische Einzelheiten in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung »Mit Freude« hebt wie im Hebräischen die freudige Weise des Schöpfens hervor. Die Anrede im Plural wird mit »ihr« bewahrt.
