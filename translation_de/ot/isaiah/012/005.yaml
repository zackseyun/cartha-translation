id: ISA.12.5
reference: Isaiah 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: de
  text: Singt Jahwe Lob, denn er hat Herrliches vollbracht![a] Das soll auf der ganzen Erde bekannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er hat majestätisch gehandelt“; auch: „denn er hat Vortreffliches getan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Singt … Lob
  rationale: Der Piel-Imperativ Plural von זמר bezeichnet musikalisches Loben. Die deutsche Wendung „jemandem Lob singen“ gibt sowohl das Singen als auch dessen lobpreisende Ausrichtung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aufforderung; „denn“ ist dafür im Deutschen knapp und idiomatisch.
- source_word: גֵאוּת עָשָׂה
  choice: er hat Herrliches vollbracht
  rationale: גֵאוּת bezeichnet Hoheit, Erhabenheit oder Vortrefflichkeit. In Verbindung mit עשה gibt „Herrliches vollbracht“ die vollendete, Gottes Hoheit offenbarende Tat natürlich wieder, ohne den abstrakten Singular in mehrere ausdrücklich genannte Taten aufzulösen.
- source_word: מוּדַעַת זֹאת
  choice: Das soll … bekannt werden
  rationale: Die Form wird im Zusammenhang der hymnischen Aufforderungen als passive Aufforderung beziehungsweise Wunsch verstanden. „Das“ verweist auf das soeben genannte herrliche Handeln Jahwes.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Der Kontext zielt auf weltweite Bekanntmachung; אָרֶץ ist daher hier als „Erde“ und nicht nur als ein bestimmtes „Land“ zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von גֵאוּת עָשָׂה
  choice: er hat Herrliches vollbracht
  alternative: er hat majestätisch gehandelt
  rationale: Die Formulierung kann das majestätische beziehungsweise erhabene Handeln selbst oder dessen herrliche Taten bezeichnen. Die Hauptfassung wahrt den abstrakten Charakter mit „Herrliches“, während die Fußnote die adverbiale Deutung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit hymnischem Klang. Der erste Satz bewahrt die Aufforderung zum musikalischen Lob; der zweite gibt die passive beziehungsweise jussivische Aussage als natürliche deutsche Soll-Konstruktion wieder.
