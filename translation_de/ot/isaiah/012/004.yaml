source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: de
  text: 'Und an jenem Tag werdet ihr sagen: »Dankt Jahwe[a], ruft seinen Namen an! Macht unter den Völkern seine Taten bekannt; verkündet, dass sein Name erhaben ist.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell wiedergegeben mit »der HERR«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Verkündet, denn sein Name ist erhaben.« Das hebräische Bindewort kann statt des Inhalts auch die Begründung der Aufforderung einleiten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Und … werdet ihr sagen
  rationale: Die Verbform setzt die prophetische Rede fort und bezeichnet hier angemessen ein zukünftiges Sprechen; „und“ bewahrt den Anschluss an den vorherigen Vers.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der festen prophetischen Zeitangabe.
- source_word: הוֹדוּ לַיהוָה
  choice: Dankt Jahwe
  rationale: Der Hifil-Imperativ von ידה mit ל fordert zum Dank beziehungsweise Lob gegenüber JHWH auf. „Dankt“ ist prägnant und idiomatisch.
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: ruft seinen Namen an
  rationale: קרא mit בְּשֵׁם bezeichnet häufig die Anrufung unter Verwendung des Namens; die deutsche Formulierung bewahrt diesen gottesdienstlichen Sinn.
- source_word: הוֹדִיעוּ בָעַמִּים עֲלִילֹתָיו
  choice: Macht unter den Völkern seine Taten bekannt
  rationale: Der Hifil von ידע bedeutet „bekannt machen“. עֲלִילוֹת bezeichnet Taten oder Handlungen, ohne dass „mächtig“ ausdrücklich im Substantiv enthalten wäre.
- source_word: הַזְכִּירוּ
  choice: verkündet
  rationale: Der Hifil von זכר kann wörtlich „in Erinnerung bringen“ oder „erwähnen“ bedeuten. Im poetischen Zusammenhang geht es um eine öffentliche Bekanntmachung; „verkündet“ gibt diese Funktion natürlich wieder.
- source_word: נִשְׂגָּב שְׁמוֹ
  choice: sein Name erhaben ist
  rationale: נשׂגב bezeichnet hier Hoheit beziehungsweise Erhabenheit. „Erhaben“ bewahrt die majestätische Aussage ohne zusätzliche Deutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
- issue: Funktion von כִּי nach הַזְכִּירוּ
  choice: 'Inhaltssatz: „verkündet, dass sein Name erhaben ist“'
  alternative: 'Begründungssatz: „verkündet es, denn sein Name ist erhaben“'
  rationale: כִּי kann sowohl den Inhalt der Verkündigung als auch deren Begründung einleiten. Der Haupttext folgt der gut passenden Inhaltssatz-Lesart, während die kausale Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Imperativen. Der poetische Aufforderungscharakter und die Abfolge der Aussagen bleiben erhalten; unnötig altertümliche Wendungen wurden vermieden.
