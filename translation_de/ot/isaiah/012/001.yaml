  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: de
  text: 'An jenem Tag wirst du sagen: »Ich preise dich[a], Jahwe! Denn du warst zwar zornig auf mich, doch dein Zorn wird sich abwenden[b], und du wirst mich trösten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich danke dir«. Das hebräische Verb kann sowohl Danken als auch lobpreisendes Loben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Dein Zorn wird umkehren.« Das hebräische Wort für »Zorn« bedeutet wörtlich »Nase«. Die Verbformen können je nach Zusammenhang auch wunschförmig verstanden werden: »Möge dein Zorn sich abwenden, und mögest du mich trösten.«'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: wirst du sagen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht im prophetischen Zusammenhang zukunftsbezogen; die deutsche Futurform gibt dies natürlich wieder.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist die geläufige und zugleich würdige deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: אוֹדְךָ
  choice: Ich preise dich
  rationale: Das Hifil von ידה kann sowohl Danken als auch kultisches Preisen bezeichnen. Im Zusammenhang des folgenden Lobgesangs bringt „preise“ den gottesdienstlichen Klang gut zum Ausdruck; die Alternative wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Transkription.
- source_word: כִּי אָנַפְתָּ בִּי
  choice: Du warst zwar zornig auf mich
  rationale: כִּי leitet den Grund des Lobpreises ein, während der Zusammenhang zugleich einen einräumenden Gegensatz erkennen lässt. „zwar … doch“ macht diesen Zusammenhang in natürlichem Deutsch sichtbar.
- source_word: יָשֹׁב אַפְּךָ
  choice: dein Zorn hat sich abgewandt
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet hier aber idiomatisch den Zorn. Das Perfekt beschreibt verständlich den eingetretenen Umschwung, ohne das Bild unnötig wörtlich nachzuahmen.
- source_word: וּתְנַחֲמֵנִי
  choice: und du hast mich getröstet
  rationale: Das Piel von נחם bedeutet „trösten“. Das deutsche Perfekt passt zur rückblickenden Aussage über den Übergang vom Zorn zum Trost.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht den Titel אֲדֹנָי. Die Wiedergabe als Eigenname wahrt diesen Unterschied.
- issue: Zeit- beziehungsweise Modalwert von יָשֹׁב und וּתְנַחֲמֵנִי
  choice: als eingetretene Abwendung des Zorns und erfolgten Trost wiedergegeben
  alternative: „Möge dein Zorn sich abwenden, und mögest du mich trösten“ beziehungsweise futurische Wiedergabe
  rationale: Die Formen können formal zukünftig oder modal verstanden werden. Im Zusammenhang des dankbaren Lobes liegt eine rückblickend-resultative Deutung nahe; die grammatische Offenheit wird in der Fußnote kenntlich gemacht.
- issue: Einräumender Zusammenhang bei כִּי
  choice: „zwar … doch“
  alternative: 'rein begründend: „denn du warst zornig auf mich“'
  rationale: Ein eigener hebräischer Ausdruck für „obwohl“ fehlt, doch die Abfolge von Zorn, Abwendung und Trost ergibt einen klaren Gegensatz. Die gewählte Form macht diesen Sinnzusammenhang deutlich, ohne einen theologischen Zusatz einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetisch-poetischem Klang. „An jenem Tag“ bewahrt die biblische Zeitformel; „Jahwe“ gibt den Gottesnamen als Eigennamen wieder. Die direkte Rede ist rhythmisch knapp gehalten.
