source:
  edition: WLC
  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: de
  text: Jauchze laut und juble vor Freude[a], du Bewohnerin Zions[b]! Denn groß ist in deiner Mitte der Heilige Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jauchze laut und singe vor Freude.“ Der zweite Imperativ kann sowohl jubelndes Rufen als auch freudiges Singen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Bewohnerin Zions“, im Femininum Singular; Zion wird als Frau personifiziert und unmittelbar angesprochen.
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: Jauchze laut
  rationale: Der Imperativ in der 2. Person Femininum Singular bezeichnet einen lauten, jubelnden Ruf. „Jauchze laut“ bewahrt sowohl die hörbare Kraft als auch den freudigen Charakter.
- source_word: וָרֹנִּי
  choice: und juble vor Freude
  rationale: רנן kann einen klingenden Freudenruf und auch freudiges Singen bezeichnen. „Juble vor Freude“ gibt den weiten Bedeutungsumfang wieder, ohne die mögliche Nuance des Singens auszuschließen.
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: du Bewohnerin Zions
  rationale: Das feminine singularische Partizip spricht Zion personifiziert als Frau an. Die Formulierung erhält diese direkte Anrede und ersetzt sie nicht durch den im Hebräischen hier nicht stehenden Ausdruck „Tochter Zion“.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehenden Aufforderungen ein.
- source_word: גָדוֹל
  choice: groß
  rationale: Das prädikative Adjektiv bezeichnet die Größe des Heiligen Israels, ohne diese einseitig als Macht oder Stärke auszulegen.
- source_word: בְּקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Die feminine Singularendung entspricht der personifizierten Zion. „In deiner Mitte“ wahrt den räumlichen Sinn und die direkte Anrede.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feste Gottesbezeichnung im Jesajabuch wird transparent und in ihrer theologischen Prägnanz wiedergegeben.
theological_decisions:
- issue: Zion als weibliche singularische Adressatin
  choice: Die direkte Anrede wird mit „Bewohnerin Zions“ und „deiner Mitte“ im Femininum Singular beibehalten.
  alternative: Die Gemeinschaft kollektiv als „Bewohner Zions“ oder „Volk von Zion“ anreden.
  rationale: Alle betreffenden hebräischen Formen stehen im Femininum Singular. Die Bewahrung dieser Form erhält die poetische Personifikation und glättet sie nicht zu einer allgemeinen Mehrzahl.
- issue: Gottesbezeichnung קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  alternative: Israels Heiliger
  rationale: Die gewählte Form gibt den charakteristischen jesajanischen Titel genau und ohne zusätzliche konfessionelle Deutung wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Direktheit. Die beiden annähernd parallelen Freudenrufe bleiben unterscheidbar; die feminine Personifikation Zions und der traditionelle Gottesname „der Heilige Israels“ werden bewahrt.
