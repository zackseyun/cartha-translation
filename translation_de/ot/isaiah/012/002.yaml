  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: de
  text: Siehe, Gott ist meine Rettung! Ich vertraue und fürchte mich nicht; denn Jah, Jahwe,[a] ist meine Stärke und mein Lied,[b] und er ist mir zur Rettung geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Jah, Jahwe“ (יָהּ יְהוָה). „Jah“ ist eine poetische Kurzform des Gottesnamens „Jahwe“; beide Formen stehen hier betont nebeneinander.'
    reason: Die ungewöhnliche doppelte Gottesbezeichnung bedarf einer knappen sprachlichen Erklärung.
  - marker: b
    text: 'Auch möglich: „mein Lobgesang“. Die Zeile greift fast wörtlich Exodus 15,2 auf.'
    reason: Die Fußnote bewahrt eine mögliche Bedeutungsnuance und weist auf den bewussten literarischen Rückbezug hin.
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die hinweisende Interjektion lenkt nachdrücklich die Aufmerksamkeit auf das folgende Bekenntnis. „Siehe“ bewahrt den gehobenen poetischen Ton und ist im Deutschen weiterhin verständlich.
- source_word: אֵל
  choice: Gott
  rationale: Die poetische Gottesbezeichnung wird hier ohne einen zusätzlichen, im Hebräischen nicht ausdrücklich vorhandenen Bedeutungsakzent wiedergegeben.
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: meine Rettung / zur Rettung
  rationale: „Rettung“ deckt den Sinn von Befreiung und Heil ab. Die Wiederholung am Anfang und Ende des Verses bleibt erkennbar, während לִי לִישׁוּעָה idiomatisch als „mir zur Rettung“ wiedergegeben wird.
- source_word: אֶבְטַח וְלֹא אֶפְחָד
  choice: Ich vertraue und fürchte mich nicht
  rationale: Die beiden Imperfektformen können gegenwärtige Zuversicht oder einen festen Entschluss ausdrücken. Das deutsche Präsens passt zu einem bekennenden Lied und lässt den zeitlichen Bezug offen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das zuvor ausgesprochene Vertrauen ein.
- source_word: עָזִּי
  choice: meine Stärke
  rationale: Dies ist die direkte Bedeutung und bewahrt zugleich den Anklang an Exodus 15,2.
- source_word: וְזִמְרָת
  choice: und mein Lied
  rationale: „Lied“ entspricht der traditionellen und kontextuell naheliegenden Deutung des poetischen Ausdrucks. Die mögliche Nuance „Lobgesang“ wird in der Fußnote genannt.
- source_word: יָהּ יְהוָה
  choice: Jah, Jahwe
  rationale: Die kurze und die volle Form des Gottesnamens stehen im Hebräischen unmittelbar nebeneinander. Die Transliteration bewahrt diese ungewöhnliche poetische Doppelung, ohne sie erklärend aufzulösen.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: und er ist mir zur Rettung geworden
  rationale: Das Perfekt mit waw wird hier als eingetretenes, bis in die Gegenwart bedeutsames Ergebnis verstanden. „Mir zur Rettung“ bildet die hebräische Konstruktion genauer ab als eine bloße Wiederholung von „meine Rettung“.
theological_decisions:
- issue: Wiedergabe der doppelten Gottesbezeichnung יָהּ יְהוָה
  choice: Jah, Jahwe
  alternative: der HERR, der HERR selbst
  rationale: Der Ausgangstext enthält zwei unterschiedliche, verwandte Formen des Gottesnamens. Ihre Wiedergabe als „Jah, Jahwe“ erhält sowohl den Namen als auch die poetische Verdichtung und vermeidet eine nicht ausdrücklich vorhandene Ergänzung wie „selbst“.
- issue: Gott als „Lied“
  choice: Die bildhafte Aussage bleibt wörtlich erhalten
  alternative: Gott ist mein Lobgesang / der Grund meines Liedes
  rationale: Die knappe poetische Formulierung bezeichnet Gott unmittelbar als Stärke und Lied. Eine erklärende Umschreibung würde die Spannung des Bildes auflösen und über den Wortlaut hinausgehen.
- issue: Zeitlicher bzw. modaler Wert von אֶבְטַח וְלֹא אֶפְחָד
  choice: 'Präsentisches Bekenntnis: „Ich vertraue und fürchte mich nicht“'
  alternative: 'Entschluss oder Zukunft: „Ich will vertrauen und mich nicht fürchten“'
  rationale: Der hebräische Imperfekt lässt hier sowohl fortdauernde Zuversicht als auch entschlossene Zukunftsausrichtung zu. Im Liedkontext ist das deutsche Präsens natürlich und legt die Aussage nicht unnötig auf eine Zukunftsform fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst poetischer Satzführung. „Siehe“ erhält den feierlichen Aufmerksamkeitsruf; ansonsten vermeidet die Fassung unnötig altertümliche Formen. Die Bildsprache und die Doppelung des Gottesnamens werden nicht geglättet.
