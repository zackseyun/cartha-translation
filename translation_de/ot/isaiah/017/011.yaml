base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: de
  text: Am Tag deiner Pflanzung lässt du sie üppig wachsen, und am Morgen lässt du deine Saat sprossen. Doch am Tag der Krankheit und des unheilbaren Schmerzes wird die Ernte zu einem Haufen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist schwierig. Wörtlich steht etwa: „ein Haufen Ernte“. נֵד kann „Haufen“ bedeuten; andere Deutungen verstehen die Wendung als das Fortgerissenwerden oder Verschwinden der Ernte. „Tag der Krankheit“ kann auch „Tag des Leidens“ oder „Tag der Bedrängnis“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: deiner Pflanzung
  rationale: Die substantivische Form mit Suffix wird im Deutschen formal und zugleich natürlich als „deiner Pflanzung“ wiedergegeben.
- source_word: תְּשַׂגְשֵׂגִי
  choice: lässt du sie üppig wachsen
  rationale: Die Verbform bezeichnet üppiges Gedeihen; das Pronomen „sie“ nimmt die Pflanzung auf und macht die kausative Aussage im Deutschen verständlich.
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: lässt du deine Saat sprossen
  rationale: Der Hifil von פרח ist kausativ. „Sprossen“ passt zum Bild der Saat und bewahrt die Vorstellung raschen Wachstums.
- source_word: נֵד קָצִיר
  choice: die Ernte schwindet dahin
  rationale: נֵד ist an dieser Stelle schwierig. Im Gerichtszusammenhang lässt es sich als plötzliches Verschwinden der erhofften Ernte verstehen; die wörtlich naheliegende Deutung „Erntehaufen“ wird in der Fußnote bewahrt.
- source_word: בְּיוֹם נַחֲלָה
  choice: an einem Tag des Leidens
  rationale: נַחֲלָה wird hier im Parallelismus mit unheilbarem Schmerz als Leiden, Krankheit oder Bedrängnis verstanden. „Leiden“ wahrt die semantische Breite.
- source_word: וּכְאֵב אָנֽוּשׁ
  choice: und unheilbaren Schmerzes
  rationale: כאב bezeichnet Schmerz; אנושׁ beschreibt ihn als schwer, verzweifelt beziehungsweise unheilbar. Die Formulierung gibt die Hoffnungslosigkeit des prophetischen Gerichtsworts wieder.
