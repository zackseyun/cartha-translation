  register: Modernes, würdiges Standarddeutsch. Die weiblichen Singularformen der hebräischen Anrede lassen sich im Deutschen ohne einen ausdrücklich genannten weiblichen Bezug nicht sichtbar machen. Die schwierige Wendung נֵד קָצִיר wird im Haupttext kontextuell wiedergegeben und in der Fußnote mit ihrer wörtlicheren Alternative offengehalten.
