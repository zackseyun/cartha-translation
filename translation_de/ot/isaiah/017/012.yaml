base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: de
  text: Ach[a], das Tosen vieler Völker – sie tosen wie das Tosen der Meere; das Brausen von Nationen – sie brausen wie das Brausen mächtiger Wasser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wehe, das Tosen vieler Völker …“ Das hebräische Wort kann einen Klage- oder Warnruf, aber auch einen Ausruf der Aufmerksamkeit einleiten.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen werden in beiden Vershälften jeweils verwandte Klangwörter wiederholt. So wird das chaotische Getöse der Völker mit dem Tosen von Meeren und mächtigen Wassern verglichen.
    reason: literary_feature
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion kann Klage, Warnung oder einen aufmerksamkeitheischenden Ausruf einleiten. Im prophetischen Kontext ist „Wehe“ die nächstliegende, würdige Wiedergabe, ohne die mögliche Nuance eines bloßen Ausrufs zu verschweigen.
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: das Tosen vieler Völker
  rationale: הֲמוֹן kann eine Menge oder deren lärmendes Getöse bezeichnen. Wegen des folgenden Vergleichs mit den Meeren und des verwandten Verbs הָמָה steht hier die akustische Bedeutung im Vordergrund; „Tosen“ passt zugleich zum Bild der Meere.
- source_word: כַּהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: Sie tosen wie das Tosen der Meere
  rationale: Die Wiederholung des hebräischen Wortstamms wird durch „Tosen/tosen“ bewahrt. Der Plural יַמִּים erscheint entsprechend als „Meere“.
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: Und das Brausen von Nationen
  rationale: שָׁאוֹן bezeichnet lautes Getöse oder Brausen. „Brausen“ wahrt die Klangwirkung und unterscheidet diesen parallelen Ausdruck leicht vom vorherigen „Tosen“; לְאֻמִּים wird zur Wahrung der lexikalischen Variation mit „Nationen“ wiedergegeben.
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: Sie brausen wie das Brausen gewaltiger Wasser
  rationale: „Brausen/brausen“ bildet die Wiederholung von שָׁאוֹן und dem zugehörigen Verb nach. „Gewaltige Wasser“ gibt die Kraft und Größe von מַיִם כַּבִּירִים natürlich und poetisch wieder.
theological_decisions:
- issue: Funktion der einleitenden Interjektion הוֹי
  choice: Wehe
  alternative: Ha! / Ach!
  rationale: „Wehe“ lässt den im prophetischen Sprachgebrauch möglichen Klage- oder Warnruf hörbar werden. Da הוֹי hier auch als bloßer Ausruf der Aufmerksamkeit verstanden werden kann, wird diese Offenheit in einer Fußnote erhalten.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallele Satzstruktur und die hörbare Wiederholung der Klangwörter werden bewahrt. Ausrufezeichen markieren die beiden nominalen Ausrufe, ohne zusätzliche Deutung einzutragen.
