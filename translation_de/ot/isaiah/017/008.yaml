  text: וְ/לֹ֣א יִשְׁעֶ֔ה אֶל הַֽ/מִּזְבְּח֖וֹת מַעֲשֵׂ֣ה יָדָ֑י/ו וַ/אֲשֶׁ֨ר עָשׂ֤וּ אֶצְבְּעֹתָי/ו֙ לֹ֣א יִרְאֶ֔ה וְ/הָ/אֲשֵׁרִ֖ים וְ/הָ/חַמָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: de
  text: 'Und er wird sich nicht den Altären zuwenden, dem Werk seiner Hände; und was seine Finger gemacht haben, wird er nicht beachten: die Ascheren[a] und die Chammānîm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Aschera-Pfähle“. Das hebräische Wort bezeichnet Kultgegenstände, die mit der Verehrung der Göttin Aschera verbunden waren; ihre genaue Form ist nicht in jedem Fall sicher.
    reason: lexical_alternative
  - marker: b
    text: Die Bedeutung des hebräischen Wortes ist unsicher. Gemeint sind wahrscheinlich heidnische Kultgegenstände, möglicherweise Sonnensäulen oder Sonnenbilder; auch „Räucheraltäre“ wird als Deutung vertreten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: wird sich … zuwenden
  rationale: Das Verb bezeichnet hier nicht nur ein Sehen, sondern das aufmerksame, vertrauensvolle oder verehrende Hinwenden zu etwas. „Sich zuwenden“ gibt diesen relationalen Sinn im Deutschen natürlich wieder.
- source_word: הַמִּזְבְּחוֹת
  choice: den Altären
  rationale: מִזְבְּחוֹת bezeichnet eindeutig Altäre; eine nähere Bestimmung ist nicht nötig, da der folgende Ausdruck sie als von Menschen geschaffene Kultgegenstände kennzeichnet.
- source_word: מַעֲשֵׂה יָדָיו
  choice: dem Werk seiner Hände
  rationale: Die formnahe Wendung bewahrt das hebräische Bild und die prophetische Kritik an menschengemachten Kultgegenständen.
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: Was seine Finger gemacht haben
  rationale: Die Formulierung erhält das anschauliche Bild der mit den eigenen Fingern angefertigten Gegenstände und klingt zugleich in modernem Deutsch natürlich.
- source_word: יִרְאֶה
  choice: wird … beachten
  rationale: Das wörtliche „sehen“ steht parallel zu יִשְׁעֶה und meint hier ein beachtendes, anerkennendes Hinsehen. „Beachten“ erhält diese Bedeutung, ohne die erste Verbform unnötig zu wiederholen.
- source_word: הָאֲשֵׁרִים
  choice: die Aschera-Kultmale
  rationale: Der Ausdruck bezeichnet Kultgegenstände, die mit der Verehrung Ascheras verbunden waren. „Kultmale“ lässt ihre genaue Gestalt offen; die Fußnote nennt die geläufige konkretere Wiedergabe.
- source_word: הַחַמָּנִים
  choice: die Sonnensäulen
  rationale: Der schwierige Kultbegriff wird häufig mit sonnenbezogenen Kultsäulen oder -bildern verbunden. „Sonnensäulen“ ist knapp und verständlich, während die Fußnote die sachliche Unsicherheit und weitere mögliche Deutungen festhält.
theological_decisions:
- issue: Wiedergabe heidnischer Kultgegenstände in der prophetischen Kritik
  choice: Die konkreten Kultgegenstände werden benannt, ohne sie im Haupttext pauschal durch „Götzen“ oder „Götzenbilder“ zu ersetzen.
  alternative: Die Gegenstände zusammenfassend und deutend als „Götzen“ oder „Götzenbilder“ wiedergeben.
  rationale: So bleibt die konkrete Bildsprache des hebräischen Textes erhalten. Die Kritik an der Hinwendung zu menschengemachten Kultobjekten ergibt sich aus dem Vers selbst, ohne zusätzliche konfessionelle oder dogmatische Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Aussagen und die Bilder von Händen und Fingern bleiben erhalten. Der Doppelpunkt macht deutlich, dass die beiden folgenden Kultgegenstände Beispiele beziehungsweise nähere Bestimmungen dessen sind, was die Finger gemacht haben, ohne die lexikalische Unsicherheit zu verdecken.
