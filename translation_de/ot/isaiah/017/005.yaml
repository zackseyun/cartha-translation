  text: וְ/הָיָ֗ה כֶּֽ/אֱסֹף֙ קָצִ֣יר קָמָ֔ה וּ/זְרֹע֖/וֹ שִׁבֳּלִ֣ים יִקְצ֑וֹר וְ/הָיָ֛ה כִּ/מְלַקֵּ֥ט שִׁבֳּלִ֖ים בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: de
  text: Es wird sein wie bei der Ernte, wenn man das stehende Getreide einholt und sein Arm die Ähren abschneidet; es wird sein, wie wenn man Ähren im Tal Refaïm nachliest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Refaïm ist hier ein Ortsname. Der Name wird bisweilen mit „Riesen“ in Verbindung gebracht.
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף
  choice: wie … wenn man … einholt
  rationale: Der Infinitiv mit vorangestelltem כ bezeichnet einen Vergleich. Die unpersönliche Form mit „man“ gibt die allgemeine Ernteszene im Deutschen natürlich wieder.
- source_word: קָצִיר
  choice: bei der Ernte
  rationale: קָצִיר bezeichnet hier den Erntezusammenhang; die Wendung lässt zugleich offen, ob stärker an die Ernte oder an den Erntenden gedacht ist.
- source_word: קָמָה
  choice: das stehende Getreide
  rationale: Das Substantiv meint die noch auf dem Feld stehende Getreidepflanzung.
- source_word: וּזְרֹעוֹ
  choice: und sein Arm
  rationale: Die ausdrückliche Körperteilmetapher des Hebräischen bleibt erhalten und macht die Erntearbeit anschaulich.
- source_word: שִׁבֳּלִים
  choice: die Ähren
  rationale: שִׁבֳּלִים bezeichnet Getreideähren beziehungsweise Ährenköpfe; „Ähren“ ist im Deutschen präzise und geläufig.
- source_word: יִקְצוֹר
  choice: abschneidet
  rationale: Das Verb bezeichnet das Ernten beziehungsweise Schneiden des Getreides. Bei den Ähren gibt „abschneidet“ den konkreten Vorgang natürlich wieder.
- source_word: כִּמְלַקֵּט
  choice: wie beim Auflesen
  rationale: לקט bezeichnet das einzelne Aufsammeln beziehungsweise Nachlesen. „Auflesen“ bewahrt das Bild, ohne stärker als der Vers selbst festzulegen, ob es sich um rechtlich geregelte Nachlese handelt.
- source_word: בְּעֵמֶק רְפָאִים
  choice: im Tal Refaïm
  rationale: רְפָאִים wird als Bestandteil eines geografischen Namens transliteriert; die im Deutschen übliche Trema-Schreibung „Refaïm“ macht die Silbentrennung sichtbar.
theological_decisions:
- issue: Wiedergabe von רְפָאִים im geografischen Namen
  choice: Tal Refaïm
  alternative: Tal der Riesen
  rationale: Im Vers steht ein Ortsname. Die Transliteration vermeidet es, die mögliche Namensbedeutung als unmittelbare Aussage über Bewohner des Tals auszugeben.
translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulichem Erntewortschatz. Die zweimalige Vergleichsformel des Hebräischen bleibt erhalten; das Semikolon bildet die Parallelität der beiden Bilder ab.
