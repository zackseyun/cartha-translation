source:
  edition: WLC
  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: de
  text: Die Völker tosen wie das Tosen mächtiger Wasser[a]. Doch er bedroht es, und es flieht weit fort[b]; es wird dahingejagt wie Spreu auf den Bergen vor dem Wind und wie wirbelnder Staub[c] vor dem Sturm[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Nationen tosen wie das Tosen vieler Wasser.“'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen hier Singularformen („er bedroht es … es flieht“). Die vielen Völker beziehungsweise ihr Getöse werden offenbar als eine einzige Masse betrachtet.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „wie etwas Wirbelndes“; möglicherweise ist rollendes, vom Wind getriebenes Pflanzenmaterial gemeint.'
    reason: lexical_alternative
  - marker: d
    text: „Sturm“ kann auch mit „Wirbelsturm“ oder „Unwetter“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere ethnische oder nationale Gruppen. „Völker“ bewahrt den kollektiven menschlichen Sinn und klingt hier weniger staatspolitisch als „Nationen“.
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  choice: tosen wie das Tosen mächtiger Wasser
  rationale: שָׁאוֹן und das zugehörige Verb bezeichnen lautes Brausen oder Tosen. „Mächtige Wasser“ gibt sowohl die Menge als auch die Gewalt von מַיִם רַבִּים natürlich wieder.
- source_word: וְגָעַר בּוֹ
  choice: doch er fährt es an
  rationale: גּער bezeichnet ein machtvolles Schelten oder Zurückweisen. „Fährt es an“ ist im Deutschen lebendig und wahrt das maskuline Singularsuffix, ohne den nicht ausdrücklich genannten Handelnden als Gott zu benennen.
- source_word: וְנָס מִמֶּרְחָק
  choice: und es flieht weit fort
  rationale: Das singularische Verb setzt die Betrachtung des Völkergetöses als einer einzigen Masse fort. מִמֶּרְחָק bezeichnet hier die Entfernung in weite Ferne.
- source_word: וְרֻדַּף
  choice: es wird dahingejagt
  rationale: Die passive Verbform beschreibt, dass die fliehende Masse von einer Kraft verfolgt oder fortgetrieben wird. „Dahingejagt“ verbindet beide Aspekte anschaulich.
- source_word: כְּמֹץ הָרִים לִפְנֵי רוּחַ
  choice: wie Spreu auf den Bergen vor dem Wind
  rationale: מֹץ ist leichte Spreu, die vom Wind fortgetragen wird. Die knappe Verbindung mit „Berge“ wird als Spreu in exponierter Höhenlage verstanden; die hebräische Bildsprache bleibt erhalten.
- source_word: וּכְגַלְגַּל
  choice: und wie wirbelnder Staub
  rationale: גַּלְגַּל kann etwas Rollendes oder Wirbelndes, möglicherweise leichtes Pflanzenmaterial, bezeichnen. „Wirbelnder Staub“ vermittelt die Bewegung, ohne das Bild zu eng botanisch festzulegen.
- source_word: לִפְנֵי סוּפָה
  choice: vor dem Sturm
  rationale: סוּפָה bezeichnet einen heftigen Sturm, häufig mit Wirbelwirkung. „Sturm“ ist verständlich und lässt die genauere Art des Unwetters offen.
theological_decisions:
- issue: Bezug der Singularformen nach dem pluralischen „Völker“
  choice: Die Singularformen werden mit „es“ wiedergegeben und beziehen sich auf das Völkergetöse als einheitliche Masse.
  alternative: 'Sinngemäß pluralisch: „er fährt sie an, und sie fliehen“.'
  rationale: בּוֹ, וְנָס und וְרֻדַּף stehen im Singular, während zuvor die Völker und ihr Tosen pluralisch erscheinen. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt ihn grammatisch zu glätten.
- issue: Identität desjenigen, der das Getöse anfährt
  choice: Das Subjekt bleibt mit „er“ unausgesprochen bestimmt.
  alternative: Den Handelnden ausdrücklich als „der HERR“ bezeichnen.
  rationale: Der Zusammenhang legt Gottes Handeln nahe, doch der Gottesname steht in diesem Vers nicht. Deshalb wird er nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftigen Laut- und Bewegungsbildern. Der auffällige Wechsel vom Plural zum Singular bleibt erhalten. „Fährt es an“ vermeidet altertümliches „schilt“, während „Spreu“ als verständliches biblisches Bild beibehalten wird.
