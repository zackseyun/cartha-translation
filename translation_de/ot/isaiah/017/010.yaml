source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: de
  text: Denn du hast den Gott deiner Rettung vergessen und nicht an den Fels deiner Zuflucht gedacht. Darum legst du liebliche Pflanzungen an[a] und besäst sie mit einem fremden Rebschössling[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begehrenswerte Pflanzungen“. Möglicherweise sind Pflanzen gemeint, die in fremden religiösen Bräuchen verwendet wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen fremden Rebzweig“ beziehungsweise „einen fremdartigen Trieb“.'
    reason: lexical_alternative
  - marker: c
    text: Die landwirtschaftlichen Bilder können darauf hindeuten, dass man sich auf fremde Kulte oder Bündnisse statt auf den HERRN verlässt; ausdrücklich sagt der hebräische Text dies jedoch nicht.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: du hast … vergessen
  rationale: Das Qal Perfekt 2. Person Feminin Singular bezeichnet eine vollzogene Handlung mit Folgen für die Gegenwart; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: den Gott deiner Rettung
  rationale: Die wörtliche Wiedergabe der Constructusverbindung bewahrt das Substantiv יֵשַׁע und lässt offen, ob Rettung als erfahrene Hilfe oder als Wesenskennzeichen Gottes verstanden wird.
- source_word: צוּר מָעֻזֵּךְ
  choice: den Fels deiner Zuflucht
  rationale: „Fels“ erhält das Gottesbild als Metapher für Beständigkeit und Schutz; „Zuflucht“ gibt die Schutz- und Stärkevorstellung von מָעוֹז wieder, ohne sie unnötig zu militarisieren.
- source_word: לֹא זָכָרְתְּ
  choice: nicht … gedacht
  rationale: „An jemanden denken“ ist im Deutschen die natürliche Entsprechung zu זכר mit implizitem Bezug und bildet den Gegensatz zu „vergessen“ klar ab.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die geläufige Folgerungsformel kennzeichnet die anschließende Handlung als Konsequenz des Vergessens.
- source_word: תִּטְּעִי נִטְעֵי נַעֲמָנִים
  choice: legst du liebliche Pflanzungen an
  rationale: Die Formulierung erhält sowohl das landwirtschaftliche Bild als auch den Sinn von נַעֲמָנִים als angenehm, lieblich oder begehrenswert; „anlegen“ ist bei Pflanzungen idiomatisches Deutsch.
- source_word: זְמֹרַת זָר
  choice: einem fremden Rebschössling
  rationale: זְמֹרָה bezeichnet einen Trieb oder Zweig, besonders einer Rebe; „Rebschössling“ wahrt das konkrete Bild besser als das allgemeinere „fremde Rebe“.
- source_word: תִּזְרָעֶנּוּ
  choice: besäst sie damit
  rationale: Die Wiedergabe bewahrt die Grundbedeutung von זרע („säen“). Das deutsche Pronomen bezieht sich sinngemäß auf die Pflanzungen; die hebräische Formulierung ist verdichtet und verbindet das Säen ungewöhnlich mit einem Rebtrieb.
theological_decisions:
- issue: Ob die landwirtschaftlichen Bilder im Haupttext ausdrücklich als Götzendienst oder als Abhängigkeit von fremden Mächten zu deuten sind
  choice: Die landwirtschaftliche Bildsprache bleibt im Haupttext ohne ausdrückliche kultische oder politische Deutung stehen.
  alternative: „Liebliche Pflanzungen“ und der „fremde Rebschössling“ könnten als Anspielung auf fremde Kulte, Götzendienst oder politische Bündnisse erklärt werden.
  rationale: Der Zusammenhang stellt die Handlung dem Vergessen Gottes gegenüber und legt daher eine religiöse oder politische Fehlorientierung nahe. Der hebräische Wortlaut selbst benennt jedoch weder einen Kult noch ein Bündnis ausdrücklich; die Spannung wird deshalb bewahrt und die mögliche Deutung nur in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede in der femininen Singularform, entsprechend den hebräischen Verbformen. Die Gottesmetapher „Fels deiner Zuflucht“ bleibt bewusst bildhaft. Die ungewöhnliche Verbindung von Säen und Rebschössling wurde nicht geglättet, damit die verdichtete Ausdrucksweise des Hebräischen erkennbar bleibt.
