  naturalness: Der Satz ist würdiges, verständliches modernes Standarddeutsch. „Liebliche Pflanzungen“ ist leicht gehoben, aber in prophetisch-biblischem Register noch natürlich. Die ungewöhnliche landwirtschaftliche Verbindung darf nicht durch eine stärker glättende Umschreibung verdeckt werden.
