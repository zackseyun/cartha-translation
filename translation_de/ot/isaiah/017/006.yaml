  terminology: „Jahwe“ ist eine angemessene Wiedergabe von יהוה. „Oliven“, „fruchttragenden Zweigen“ und „Ausspruch Jahwes“ sind sachlich und im Register passend. Die Wiedergabe vermeidet eine über den Bildwortlaut hinausgehende Deutung des Restes.
