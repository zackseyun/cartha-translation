source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: de
  text: 'Doch wird darin eine Nachlese zurückbleiben, wie beim Abschlagen eines Olivenbaums: zwei oder drei Oliven auf dem obersten Zweig, vier oder fünf an seinen fruchttragenden Zweigen – Ausspruch Jahwes, des Gottes Israels.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁאַר בּוֹ
  choice: Doch darin bleiben … zurück
  rationale: Das Nifal von שׁאר bezeichnet das Zurückbleiben; „doch“ gibt den Gegensatz zum vorausgehenden Gericht wieder. „Darin“ bewahrt den Rückbezug von בּוֹ, ohne dessen Bezugsgröße unnötig festzulegen.
- source_word: עֹלֵלֹת
  choice: Nachlesefrüchte
  rationale: Das Wort bezeichnet nach der Ernte zurückgebliebene Früchte. Die Wiedergabe erhält sowohl das Erntebild als auch den Gedanken eines kleinen Restes.
- source_word: כְּנֹקֶף זַיִת
  choice: wie beim Abschlagen eines Olivenbaums
  rationale: נֹקֶף bezeichnet hier das Schlagen beziehungsweise Abschlagen des Baums bei der Olivenernte; die deutsche Nominalfügung ist natürlich und bildgetreu.
- source_word: גַּרְגְּרִים
  choice: Oliven
  rationale: Das Wort bezeichnet einzelne kleine Früchte oder Beeren. Im ausdrücklich genannten Olivenbaum-Kontext ist „Oliven“ im Deutschen eindeutig und natürlich.
- source_word: בְּרֹאשׁ אָמִיר
  choice: ganz oben im Wipfel
  rationale: רֹאשׁ bezeichnet die Spitze, אָמִיר den obersten Zweig beziehungsweise Wipfelbereich. Die Formulierung gibt die schwer erreichbare höchste Stelle des Baums knapp wieder.
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: an seinen fruchttragenden Zweigen
  rationale: סְעִפִים sind Zweige oder Äste; פֹּרִיָּה beschreibt sie beziehungsweise den Baum als fruchtbar. „Fruchttragend“ erhält das konkrete Baumbild.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird würdevoll und quellennah wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die Constructusverbindung wird direkt wiedergegeben und bewahrt die vollständige Identifikation Jahwes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bild des verbleibenden Restes
  choice: Konkretes Erntebild ohne ausdrückliche theologische Deutung
  alternative: Deutende Wiedergabe als „ein Rest von Menschen“
  rationale: Der Vers schildert den Rest mittels zurückgelassener Oliven. Die Übersetzung bewahrt dieses Bild und lässt seine Anwendung im Kontext erkennbar werden, ohne sie in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Ton. Die knappe Zahlenfolge und das anschauliche Olivenerntebild des Hebräischen bleiben erhalten; unnötige Explizierungen wurden vermieden.
