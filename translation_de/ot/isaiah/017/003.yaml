id: ISA.17.3
reference: Isaiah 17:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: de
  text: Die Festung wird aus Ephraim verschwinden und die Königsherrschaft aus Damaskus. Der Rest Arams wird wie die Herrlichkeit[a] der Söhne Israels sein.[b] Das verkündet Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pracht“ oder „Ehre“. Das hebräische Wort umfasst diese Bedeutungsnuancen.'
    reason: lexical_alternative
  - marker: b
    text: Der Vergleichspunkt wird im Hebräischen nicht ausdrücklich genannt. Gemeint sein kann, dass Aram dieselbe bevorstehende Minderung erfährt wie Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: wird … verschwinden
  rationale: Das Nifal von שׁבת bezeichnet hier das Aufhören beziehungsweise Beseitigtwerden. „Verschwinden“ gibt das Ende der Festung natürlich wieder, ohne ausdrücklich eine bestimmte Art ihrer Vernichtung festzulegen.
- source_word: מִבְצָר
  choice: die Festung
  rationale: Das Substantiv bezeichnet einen befestigten Ort oder eine Festung. Der Singular und der konkrete militärische Sinn bleiben erhalten.
- source_word: מֵאֶפְרַיִם
  choice: aus Ephraim
  rationale: Der hebräische Stammes- und Gebietsname wird beibehalten und nicht deutend durch „Israel“ oder „Nordreich“ ersetzt.
- source_word: וּמַמְלָכָה
  choice: und die Königsherrschaft
  rationale: מַמְלָכָה kann Reich, Königtum oder Herrschaft bezeichnen. „Königsherrschaft“ passt zur parallelen Aussage über deren Ende und bezeichnet die politische Herrschaft, ohne zwingend das gesamte Gebiet zu meinen.
- source_word: מִדַּמֶּשֶׂק
  choice: aus Damaskus
  rationale: Direkte Wiedergabe des Ortsnamens mit der vorangestellten Präposition.
- source_word: וּשְׁאָר אֲרָם
  choice: Der Rest Arams
  rationale: שְׁאָר bedeutet „Rest“ oder „Übriggebliebenes“. „Aram“ bewahrt den hebräischen Eigennamen und „Rest“ den prophetischen Sprachklang.
- source_word: כִּכְבוֹד
  choice: wie die Herrlichkeit
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Pracht bedeuten. „Herrlichkeit“ wahrt die Bedeutungsbreite und das Gewicht des prophetischen Ausdrucks; eine Fußnote nennt naheliegende Alternativen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die ausdrücklich maskuline Form בְּנֵי wird formal als „Söhne“ wiedergegeben; der traditionelle Volksname bleibt damit eng am Ausgangstext.
- source_word: יִהְיוּ
  choice: wird … sein
  rationale: Die deutsche Singularform richtet sich natürlich nach dem kollektiven Subjekt „der Rest Arams“, während das hebräische Verb im Plural die darin zusammengefassten Übriggebliebenen aufgreifen kann.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Das verkündet Jahwe der Heerscharen
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. „Das verkündet“ ist gegenwärtiges, würdevolles Deutsch; der Gottesname יהוה wird als „Jahwe“ wiedergegeben, und „der Heerscharen“ bewahrt die herkömmliche offene Bedeutung des Titels צְבָאוֹת.
theological_decisions:
- issue: Sinn des Vergleichs zwischen dem Rest Arams und der Herrlichkeit der Söhne Israels
  choice: Der Vergleich bleibt im Haupttext formal offen.
  alternative: Der Satz könnte ausdrücklich als Ankündigung verstanden werden, dass Arams Rest dieselbe bevorstehende Minderung oder Erniedrigung wie Israels Herrlichkeit erfährt.
  rationale: Der hebräische Text nennt den genauen Vergleichspunkt nicht. Der Zusammenhang legt eine gemeinsame Minderung nahe, doch dies wird im Vers nicht ausdrücklich gesagt. Die offene Formulierung bewahrt diese exegetische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem prophetischem Parallelismus. Die Formulierung bleibt nah an der hebräischen Bild- und Vergleichssprache, vermeidet jedoch unnötig altertümliche Syntax.
