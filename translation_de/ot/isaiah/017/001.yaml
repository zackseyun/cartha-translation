source:
  edition: WLC
  text: מַשָּׂ֖א דַּמָּ֑שֶׂק הִנֵּ֤ה דַמֶּ֨שֶׂק֙ מוּסָ֣ר מֵ/עִ֔יר וְ/הָיְתָ֖ה מְעִ֥י מַפָּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
translation:
  language: de
  text: 'Ausspruch über Damaskus:

    Seht, Damaskus hört auf, eine Stadt zu sein, und wird zu einem Trümmerhaufen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu einem Haufen des Einsturzes“.'
    reason: Die Fußnote macht das konkrete, ungewöhnliche Bild der hebräischen Konstruktverbindung transparent.
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet מַשָּׂא eine gewichtige, häufig gerichtliche Botschaft. „Ausspruch“ ist im modernen Deutschen würdig und verständlich; „Last“ wäre zwar formal möglich, könnte aber irreführend konkret verstanden werden.
- source_word: דַּמָּשֶׂק
  choice: Damaskus
  rationale: Die geläufige deutsche Form des Ortsnamens.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden und vergegenwärtigenden Charakter der prophetischen Ankündigung natürlich wieder.
- source_word: מוּסָר מֵעִיר
  choice: hört auf, eine Stadt zu sein
  rationale: Die passive Form von סור mit מִן beschreibt die bevorstehende Entfernung aus dem Zustand beziehungsweise Status einer Stadt. Die deutsche Wendung gibt diesen Sinn klar wieder, ohne eine räumliche Entfernung nahezulegen.
- source_word: וְהָיְתָה
  choice: und wird zu
  rationale: 'היה hat hier angesichts des angekündigten Zustandswechsels resultativen Sinn: Damaskus wird zu etwas anderem.'
- source_word: מְעִי מַפָּלָה
  choice: einem Trümmerhaufen
  rationale: Die Konstruktverbindung bezeichnet einen durch Einsturz oder Verwüstung entstandenen Haufen. „Trümmerhaufen“ bewahrt das konkrete Bild in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle prophetische Sprache. Die Überschrift bleibt knapp; „Seht“ erhält die eindringliche Ankündigungsfunktion von הִנֵּה. Der idiomatische Haupttext wird durch eine kurze Fußnote zur wörtlicheren Bildsprache ergänzt.
