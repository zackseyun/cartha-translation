  source_fidelity: Der Text gibt die hebräische Überschrift מַשָּׂא angemessen als „Ausspruch“ wieder. „Seht“ vermittelt die aufmerksamkeitslenkende Kraft von הִנֵּה in natürlichem, würdigem Deutsch. „Damaskus hört auf, eine Stadt zu sein“ trifft die Aussage von מוּסָר מֵעִיר idiomatisch und vermeidet zu Recht das Missverständnis einer bloß räumlichen Verlegung. Der resultative Ausdruck „wird zu einem Trümmerhaufen“ entspricht וְהָיְתָה מְעִי מַפָּלָה.
