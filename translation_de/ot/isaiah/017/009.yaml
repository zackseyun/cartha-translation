  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: de
  text: An jenem Tag werden seine befestigten Städte wie die verlassenen Stätten des Waldes und des Baumwipfels[a] sein, die man vor den Israeliten verließ[b]; und es wird zur Einöde werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Dickichts und des obersten Zweiges“. Das seltene hebräische Wort bezeichnet den obersten Teil eines Baumes; die gesamte Bildfolge ist schwer zu deuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die man wegen der Israeliten verließ“. Der hebräische Ausdruck kann ein Zurückweichen vor ihrer Gegenwart oder den daraus folgenden Grund bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben.
- source_word: עָרֵי מָעֻזּוֹ
  choice: seine befestigten Städte
  rationale: מָעוֹז bezeichnet einen Ort der Stärke oder eine Festung. Die adjektivische Wiedergabe ist im Deutschen natürlich; das Suffix der 3. Person Singular bleibt als „seine“ erhalten.
- source_word: כַּעֲזוּבַת הַחֹרֶשׁ וְהָאָמִיר
  choice: wie die verlassenen Stätten des Waldes und des Baumwipfels
  rationale: Die schwierige Konstruktion wird eng am masoretischen Text wiedergegeben. עֲזוּבָה bezeichnet den Zustand beziehungsweise Ort des Verlassenseins, חֹרֶשׁ Wald oder dichtes Gehölz und אָמִיר den obersten Teil eines Baumes.
- source_word: אֲשֶׁר עָזְבוּ
  choice: die man … verließ
  rationale: Das hebräische Verb steht aktiv im Plural, ohne dass das Subjekt ausdrücklich genannt wird. Das unpersönliche „man“ bewahrt diese Unbestimmtheit und vermeidet einen unbegründeten Bezug des deutschen Pronomens „sie“.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: מִפְּנֵי kann räumlich „vor/aus der Gegenwart von“ und daraus folgend auch kausal „wegen“ bedeuten. „Vor“ erhält die Vorstellung eines Zurückweichens vor ihrer Gegenwart; „Israeliten“ ist die natürliche deutsche Wiedergabe des üblichen hebräischen Volksnamens בְּנֵי יִשְׂרָאֵל.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: alles wird zur Einöde werden
  rationale: שְׁמָמָה bezeichnet einen verwüsteten, menschenleeren Zustand. „Zur Einöde werden“ gibt sowohl das Ergebnis als auch den Übergang wieder; „alles“ nimmt im Deutschen den angekündigten Gesamtzustand auf, ohne eine neue handelnde Größe einzuführen.
theological_decisions:
- issue: Bezug und Bedeutung von מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  alternative: wegen der Israeliten
  rationale: Der Ausdruck kann die Flucht oder Räumung angesichts Israels bezeichnen und zugleich kausalen Sinn tragen. Der Haupttext bewahrt mit „vor“ die räumlich-präsentische Bildlichkeit; die kausale Möglichkeit wird in der Fußnote ausdrücklich genannt.
- issue: Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Hier fungiert die wörtlich männliche Wendung als feststehender Volksname. „Israeliten“ ist im modernen Standarddeutsch genau und natürlich, ohne eine Aussage über ausschließlich männliche Personen einzutragen.
- issue: Bildfolge חֹרֶשׁ וְאָמִיר
  choice: Wald und Baumwipfel
  alternative: bewaldete Höhe und Gipfel
  rationale: Der masoretische Wortlaut enthält Baum- und Waldbegriffe. Eine Umdeutung zu Landschaftsbezeichnungen oder Volksnamen wird nicht in den Haupttext aufgenommen; die echte lexikalische Schwierigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Die schwer verständliche Bildfolge des masoretischen Textes wird nicht durch eine glättende historische oder geografische Deutung ersetzt. Das Semikolon erhält die zweigliedrige Satzbewegung, während „alles wird zur Einöde werden“ den abschließenden Verwüstungszustand idiomatisch ausdrückt.
