id: ISA.17.7
reference: Isaiah 17:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִשְׁעֶ֥ה הָ/אָדָ֖ם עַל עֹשֵׂ֑/הוּ וְ/עֵינָ֕י/ו אֶל קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: de
  text: An jenem Tag[a] wird der Mensch[b] auf den schauen, der ihn gemacht hat, und seine Augen werden auf den Heiligen Israels blicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „An diesem Tag“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Mensch“ steht hier in der Einzahl stellvertretend für die Menschen allgemein.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die prophetische Zeitformel wird im Deutschen natürlich und ohne zusätzliche zeitliche Deutung wiedergegeben.
- source_word: יִשְׁעֶה
  choice: wird … schauen
  rationale: Das Verb bezeichnet das aufmerksame Hinsehen beziehungsweise die Ausrichtung auf jemanden. „Schauen“ wahrt diese Bedeutung, ohne ausdrücklich „vertrauen“ oder „umkehren“ einzutragen.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der bestimmte Singular steht repräsentativ für die Menschheit. „Der Mensch“ bewahrt im Deutschen sowohl die grammatische Form als auch den allgemeinen Sinn.
- source_word: עַל עֹשֵׂהוּ
  choice: auf den …, der ihn gemacht hat
  rationale: Die Wiedergabe folgt dem Partizip von עשה mit Suffix eng und erhält die persönliche Beziehung zwischen dem Menschen und dem, der ihn gemacht hat.
- source_word: וְעֵינָיו
  choice: und seine Augen
  rationale: Die konkrete körperliche Bildsprache und der poetische Parallelismus bleiben erhalten.
- source_word: אֶל קְדוֹשׁ יִשְׂרָאֵל
  choice: auf den Heiligen Israels
  rationale: „Der Heilige Israels“ ist der charakteristische jesajanische Gottestitel; „auf“ ist im Deutschen die natürliche Richtungsangabe bei „blicken“.
- source_word: תִּרְאֶינָה
  choice: werden … blicken
  rationale: ראה bedeutet grundsätzlich „sehen“, bezeichnet hier im Parallelismus jedoch ein bewusst gerichtetes Blicken. Der Wechsel von „schauen“ zu „blicken“ klingt natürlich und wahrt zugleich die Parallelität.
theological_decisions:
- issue: Repräsentativer Singular הָאָדָם
  choice: der Mensch
  alternative: die Menschen / die Menschheit
  rationale: Der hebräische Text verwendet einen bestimmten Singular mit allgemeiner, repräsentativer Bedeutung. Die Übersetzung bewahrt diese Spannung zwischen Einzahl und kollektivem Bezug.
- issue: Ob Vertrauen oder Umkehr ausdrücklich genannt werden sollen
  choice: auf den schauen
  alternative: auf ihn vertrauen / sich ihm wieder zuwenden
  rationale: Die Hinwendung zu Gott kann Vertrauen oder Umkehr einschließen, doch der hebräische Wortlaut bezeichnet zunächst das gerichtete Schauen. Die möglichen theologischen Folgerungen werden deshalb nicht in den Text hineinformuliert.
- issue: Bezeichnung Gottes als der Handelnde in עֹשֵׂהוּ
  choice: der ihn gemacht hat
  alternative: sein Schöpfer
  rationale: Die Relativkonstruktion bildet das hebräische Partizip transparent ab und vermeidet, den Ausdruck unnötig zu einem abstrakten Titel zu verdichten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetisch-poetischer Satzführung. Die Wiederholung der Blickrichtung und die körperliche Bildsprache wurden bewahrt; ausdrücklich konfessionelle oder über den Wortlaut hinausgehende Deutungen wurden vermieden.
