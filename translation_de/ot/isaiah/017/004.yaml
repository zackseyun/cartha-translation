base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: de
  text: An jenem Tag wird Jakobs Herrlichkeit schwinden[a], und sein wohlgenährter Leib wird abmagern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gering werden“. Das hebräische Verb kann ein Gering-, Schwach- oder Dünnwerden bezeichnen; die zweite Vershälfte führt das Bild des Abmagerns weiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Fettigkeit seines Fleisches wird mager werden“. Das Bild körperlicher Auszehrung steht für den Verlust von Kraft und Wohlstand.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: An jenem Tag wird
  rationale: Die übliche prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben; die Zukunftsbedeutung von וְהָיָה geht in der Verbform des folgenden Satzes auf.
- source_word: יִדַּל
  choice: wird … schwinden
  rationale: Das Verb bezeichnet ein Gering-, Schwach- oder Dünnwerden. „Schwinden“ ist im Deutschen bei Herrlichkeit idiomatisch und bewahrt zugleich den Gedanken eines fortschreitenden Verlusts; die körperliche Bildkomponente wird in einer Fußnote kenntlich gemacht.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die Bedeutungsbreite von Ansehen, Glanz, Gewicht und Wohlstand, ohne den Ausdruck auf nur einen Aspekt festzulegen.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der im Hebräischen stehende Bundes- und Volksname wird beibehalten und nicht deutend durch „Israel“ ersetzt.
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  choice: und sein wohlgenährter Leib
  rationale: Die Wendung lautet wörtlich „und die Fettigkeit/Fülle seines Fleisches“. „Wohlgenährter Leib“ vermittelt das konkrete Bild in verständlichem heutigem Deutsch, ohne „Fleisch“ fälschlich als theologischen Fachbegriff erscheinen zu lassen.
- source_word: יֵרָזֶה
  choice: wird abmagern
  rationale: Das Verb bedeutet, mager oder ausgezehrt zu werden. „Abmagern“ gibt die körperliche Bildsprache präzise und natürlich wieder.
theological_decisions:
- issue: Bezug von „Jakob“ im Gerichtswort
  choice: „Jakob“ bleibt als nationaler und bundestheologisch resonanter Name im Haupttext stehen.
  alternative: „Israel“ oder „das Volk Jakob“
  rationale: Der Zusammenhang bezeichnet zwar das Volk beziehungsweise das Nordreich, doch der hebräische Text nennt ausdrücklich Jakob. Eine Ersetzung würde die prophetische Ausdrucksweise unnötig auslegen.
- issue: Verhältnis von Herrlichkeit und körperlicher Auszehrung
  choice: Die Parallele wird als Bild für den Verlust von Ansehen, Stärke und Wohlstand bewahrt.
  alternative: Die Aussage ausschließlich auf materiellen Wohlstand oder ausschließlich auf militärische Macht beziehen.
  rationale: כָּבוֹד besitzt eine größere Bedeutungsbreite, und die körperliche Metaphorik konkretisiert den Niedergang, ohne ihn auf einen einzigen Bereich zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An jenem Tag“ wahrt den prophetischen Sprachklang. Die konkrete Körpermetaphorik bleibt durch „wohlgenährter Leib“ und „abmagern“ verständlich erhalten, während die ungewöhnliche hebräische Formulierung in der Fußnote dokumentiert wird.
