id: ISA.17.14
reference: Isaiah 17:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: de
  text: 'Zur Abendzeit – sieh: Entsetzen! Noch ehe es Morgen wird, ist er nicht mehr. Das ist der Anteil derer, die uns ausplündern, und das Los derer, die uns berauben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב
  choice: Zur Abendzeit
  rationale: Gibt die Zeitangabe knapp und natürlich wieder.
- source_word: בַלָּהָה
  choice: Entsetzen
  rationale: Bezeichnet jähen Schrecken beziehungsweise Terror; „Entsetzen“ wahrt die intensive Wirkung in idiomatischem Deutsch.
- source_word: אֵינֶנּוּ
  choice: ist er nicht mehr
  rationale: Bewahrt den maskulinen Singular des Hebräischen und die knappe Aussage über das Verschwinden beziehungsweise Ende des zuvor beschriebenen Feindes.
- source_word: חֵלֶק
  choice: Anteil
  rationale: Entspricht der bildhaften Zuteilung dessen, was den Plünderern zufällt.
- source_word: שׁוֹסֵינוּ / בֹזְזֵינוּ
  choice: die uns ausplündern / die uns berauben
  rationale: Gibt die parallelen Bezeichnungen mit zwei nah verwandten deutschen Verben wieder, ohne einen sachlich nicht belegten Unterschied zu erzwingen.
- source_word: גוֹרָל
  choice: Los
  rationale: Bewahrt das Bild des zugewiesenen Loses beziehungsweise Geschicks.
theological_decisions:
- issue: Bezugswort des maskulinen Singulars in אֵינֶנּוּ
  choice: „er ist nicht mehr“ ohne ausdrückliche Identifizierung
  alternative: „sie sind nicht mehr“ oder „es ist nichts mehr da“
  rationale: Der hebräische Text verwendet einen maskulinen Singular, dessen Bezug aus dem Kontext erschlossen wird. Die Übersetzung wahrt diese Form und löst die Referenz nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf bleibt abrupt; der Gedankenstrich bildet die dramatische Wendung des hebräischen וְהִנֵּה ab. Die parallele Schlusszeile ist bewusst eng am poetischen Aufbau gehalten.
