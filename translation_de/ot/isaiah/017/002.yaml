source:
  edition: WLC
  text: עֲזֻב֖וֹת עָרֵ֣י עֲרֹעֵ֑ר לַ/עֲדָרִ֣ים תִּֽהְיֶ֔ינָה וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: de
  text: Die Städte von Aroër sind verlassen[a]; sie werden den Herden[b] gehören. Die Tiere werden sich dort lagern, und niemand wird sie aufschrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgegeben“ oder „menschenleer“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Herden von Schafen, Ziegen oder anderen Weidetieren bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: verlassen
  rationale: Das feminine Partizip Passiv von עזב beschreibt die Städte als aufgegeben und menschenleer. „Verlassen“ ist natürliches modernes Deutsch und bewahrt den Zustandscharakter.
- source_word: עָרֵי
  choice: die Städte von
  rationale: Der Konstruktus Plural von עִיר wird im Kontext des prophetischen Gerichtswortes sachgerecht mit „die Städte von“ wiedergegeben.
- source_word: עֲרֹעֵר
  choice: Aroër
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form mit Trema transliteriert.
- source_word: לַעֲדָרִים
  choice: den Herden gehören
  rationale: עֵדֶר bezeichnet eine Herde beziehungsweise Schaf- oder Ziegenherde. Die Formulierung bringt idiomatisch zum Ausdruck, dass die verlassenen Siedlungen den Tieren als Aufenthalts- und Weideort dienen.
- source_word: תִּהְיֶינָה
  choice: sie werden … gehören
  rationale: Die Zukunftsform von היה mit ל wird im Deutschen idiomatisch als Zugehörigkeits- beziehungsweise Nutzungsverhältnis ausgedrückt.
- source_word: וְרָבְצוּ
  choice: Die Tiere werden sich dort lagern
  rationale: רבץ bezeichnet besonders das Niederlegen oder Lagern von Tieren. Das explizite „Die Tiere“ klärt den im Hebräischen durch den Kontext bestimmten Subjektwechsel von den Städten zu den Herden.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand wird sie aufschrecken
  rationale: Die hebräische Wendung bezeichnet ungestörtes Lagern ohne jemanden, der die Tiere erschreckt oder vertreibt. „Aufschrecken“ passt präzise zum Bild ruhender Tiere.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht den kontextuell erschlossenen Subjektwechsel zu den Tieren verständlich, ohne die prophetische Bildsprache abzuschwächen.
