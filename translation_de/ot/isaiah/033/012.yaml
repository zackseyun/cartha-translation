  source_fidelity: Die Übersetzung gibt die Konstruktion וְהָיוּ ... מִשְׂרְפוֹת שִׂיד treffend als Zustandswechsel wieder („werden zu Kalkbränden“) und bewahrt die knappe, harte Bildsprache. „wie abgehauene Dornen“ entspricht קוֹצִים כְּסוּחִים ohne unnötige Ausdeutung zu Gestrüpp. „im Feuer entzündet“ bildet בָּאֵשׁ יִצַּתּוּ sachgerecht ab und lässt den im Verb liegenden Aspekt des Entzündetwerdens hervortreten.
