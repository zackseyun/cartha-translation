source:
  edition: WLC
  text: וְ/הָי֥וּ עַמִּ֖ים מִשְׂרְפ֣וֹת שִׂ֑יד קוֹצִ֥ים כְּסוּחִ֖ים בָּ/אֵ֥שׁ יִצַּֽתּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
translation:
  language: de
  text: Und die Völker werden zu Kalkbränden; wie abgehauene Dornen werden sie im Feuer entzündet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geraten sie in Brand“; das hebräische Verb kann sowohl das Entzündetwerden als auch das Feuerfangen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Und ... werden zu
  rationale: היה mit einem Prädikatsnomen bezeichnet hier den Übergang in einen neuen Zustand; „werden zu“ gibt die Folge des Gerichts wieder.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet kollektiv mehrere Völker und bewahrt die umfassende korporative Aussage.
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: Kalkbränden
  rationale: Das knappe deutsche Kompositum bewahrt die verdichtete Konstruktverbindung und das Bild des durch Brennen gewonnenen Kalks, ohne es zu einer ausdrücklichen Vergleichsformel auszubauen.
- source_word: קוֹצִים כְּסוּחִים
  choice: abgehauene Dornen
  rationale: קוֹצִים kann Dornen beziehungsweise Dornengestrüpp bezeichnen; כְּסוּחִים beschreibt sie als abgeschnitten oder abgehauen. Die Formulierung bleibt bildhaft und knapp.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition wird hier am natürlichsten lokal verstanden und stellt die Dornen mitten in das Feuerbild.
- source_word: יִצַּתּוּ
  choice: werden sie ... entzündet
  rationale: Das Verb bezeichnet das Entzündet- oder Inbrandgesetztwerden. „Entzündet“ bewahrt stärker als „verbrannt“ den Aspekt des Feuerfangens, ohne die anschließende Vernichtung auszuschließen.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit dichterischer Kürze. „Kalkbrände“ ist bewusst ungewöhnlich, entspricht aber der komprimierten hebräischen Bildsprache; „abgehauene Dornen“ bleibt näher am Ausgangstext als eine Ausdeutung zu Dornbüschen oder Gestrüpp.
