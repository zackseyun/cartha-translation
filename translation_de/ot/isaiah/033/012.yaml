  terminology: „Völker“, „Kalkbränden“, „Dornen“ und „Feuer“ sind terminologisch konsistent und quellentreu. Die Fußnote ist korrekt an יִצַּתּוּ gebunden und erläutert die legitime Nuance zwischen Entzündetwerden und Feuerfangen, ohne eine theologische Deutung einzutragen.
