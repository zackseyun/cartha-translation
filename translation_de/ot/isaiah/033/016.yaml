source:
  edition: WLC
  text: ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים מִשְׂגַּבּ֑/וֹ לַחְמ֣/וֹ נִתָּ֔ן מֵימָ֖י/ו נֶאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: de
  text: Er wird auf den Höhen wohnen; Felsenfestungen werden seine Zuflucht sein[a]. Sein Brot wird ihm gegeben, und sein Wasser ist gesichert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Felsenfestungen werden seine sichere Höhe sein“ oder „seine Festung“; das hebräische Wort bezeichnet einen hoch gelegenen, sicheren Schutzort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Wasser ist zuverlässig/beständig“; sinngemäß auch: „sein Wasser versiegt nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרוֹמִים
  choice: auf den Höhen
  rationale: Der Plural bezeichnet erhöhte Orte. Die Formulierung bewahrt das räumliche Bild von Unzugänglichkeit und Sicherheit.
- source_word: יִשְׁכֹּן
  choice: wird wohnen
  rationale: Das Qal-Imperfekt von שכן bezeichnet ein dauerhaftes Wohnen oder Sich-Niederlassen und passt zum verheißenden Zusammenhang.
- source_word: מְצָדוֹת סְלָעִים
  choice: Felsenfestungen
  rationale: Die Verbindung bedeutet wörtlich etwa „Festungen aus Felsen“ und zeichnet ein Bild schwer zugänglicher, gut geschützter Orte.
- source_word: מִשְׂגַּבּוֹ
  choice: seine Zuflucht
  rationale: Das Substantiv bezeichnet einen erhöhten, sicheren Schutzort. „Zuflucht“ gibt hier seine Schutzfunktion natürlich wieder; die Höhenlage ist bereits durch den Kontext deutlich.
- source_word: לַחְמוֹ
  choice: sein Brot
  rationale: Der konkrete Ausdruck bleibt erhalten und kann zugleich allgemein für die notwendige Nahrung stehen.
- source_word: נִתָּן
  choice: wird ihm gegeben
  rationale: Das passive Prädikat drückt zugesicherte Versorgung aus. Das ergänzte „ihm“ macht im Deutschen den Bezug natürlich deutlich, ohne den Sinn zu erweitern.
- source_word: מֵימָיו נֶאֱמָנִים
  choice: sein Wasser versiegt nicht
  rationale: Das morphologisch pluralische מים wird im Deutschen natürlich als Massennomen im Singular wiedergegeben. נֶאֱמָנִים bezeichnet hier eine verlässliche, beständige Wasserversorgung; „versiegt nicht“ drückt diese konkrete Zusicherung idiomatisch aus.
- source_word: הוּא
  choice: Er
  rationale: Das Pronomen nimmt den in Vers 15 beschriebenen gerecht handelnden Mann auf und bewahrt den maskulinen Singular des unmittelbaren Zusammenhangs.
theological_decisions:
- issue: Bezug des maskulinen Singularpronomens
  choice: Der Vers spricht von dem in Jesaja 33,15 beschriebenen gerecht handelnden Mann.
  alternative: Verallgemeinerung auf jeden gerechten Menschen oder typologische Deutung auf den treuen Rest beziehungsweise den Messias.
  rationale: Der unmittelbare syntaktische und literarische Zusammenhang verweist auf die Person aus dem vorhergehenden Vers. Eine speziell messianische oder kollektiv-typologische Identifizierung wird vom hebräischen Wortlaut hier nicht verlangt.
- issue: Zeitbezug der Versorgungsaussage
  choice: Die Aussagen werden im Zusammenhang als Verheißung sicherer Versorgung wiedergegeben.
  alternative: 'Rein präsentische Wiedergabe: „Sein Brot ist gegeben, sein Wasser ist zuverlässig.“'
  rationale: Das passive נִתָּן und das adjektivische נֶאֱמָנִים können formal zuständlich verstanden werden; zusammen mit יִשְׁכֹּן entfalten sie jedoch eine verheißende Zukunftsperspektive. Die Übersetzung wahrt den Zustand dauerhafter Verlässlichkeit, ohne eine bestimmte heilsgeschichtliche Erfüllung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen parallelen Aussagen und die konkreten Bilder von Höhe, Fels, Brot und Wasser bleiben erhalten; ungewöhnliche hebräische Prädikationen werden nur so weit idiomatisiert, wie es für klares Deutsch nötig ist.
