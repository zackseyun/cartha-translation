  source_fidelity: 'Der hebräische Text wird genau wiedergegeben: Die beiden pluralischen Imperative („Hört“/„erkennt“), die substantivisch-vokativischen Gegenüberstellungen („ihr Fernen“/„ihr Nahen“), das vollendete Handeln („was ich getan habe“) und גבורתי als „meine Macht“ sind angemessen erfasst. Die implizite göttliche Sprecheridentität wird nicht in den Vers hineingetragen.'
