  terminology: „Macht“ ist für גְּבוּרָה eine treffende, moderne und nicht überdeutende Wahl. Die Fußnote nennt mit „Stärke“ und „Kraft“ sinnvolle lexikalische Alternativen. „Erkennt“ wahrt gegenüber „wisst“ die auffordernde und kontextuell gewichtige Aussage, ohne das stärkere „anerkennt“ vorwegzunehmen.
