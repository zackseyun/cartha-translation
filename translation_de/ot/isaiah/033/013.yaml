id: ISA.33.13
reference: Isaiah 33:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
translation:
  language: de
  text: Hört, ihr Fernen, was ich getan habe, und erkennt, ihr Nahen, meine Macht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Stärke« oder »meine Kraft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ von שׁמע wird direkt und in würdigem prophetischem Ton wiedergegeben.
- source_word: רְחוֹקִים
  choice: ihr Fernen
  rationale: Das substantivisch gebrauchte Adjektiv im Plural bezeichnet die angesprochene Gruppe und bildet knapp den Gegensatz zu »ihr Nahen« ab.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: was ich getan habe
  rationale: Die Verbindung aus Relativpartikel und Perfekt 1. Person Singular bezeichnet das vollbrachte Handeln; das deutsche Perfekt ist hier natürlich und lässt dessen gegenwärtige Bedeutung anklingen.
- source_word: וּדְעוּ
  choice: und erkennt
  rationale: ידע kann hier mit »erkennen« wiedergegeben werden. Dies wahrt den parallelen Aufforderungscharakter, ohne das stärker deutende »anerkennen« zu wählen.
- source_word: קְרוֹבִים
  choice: ihr Nahen
  rationale: Das substantivisch gebrauchte Adjektiv im Plural steht als direkte Anrede parallel zu רְחוֹקִים und bewahrt den rhetorischen Gegensatz.
- source_word: גְּבֻרָתִי
  choice: meine Macht
  rationale: גְּבוּרָה bezeichnet Stärke, Macht oder gewaltige Kraft. »Macht« ist im Deutschen natürlich und lässt offen, ob vor allem die Eigenschaft oder ihre machtvolle Bekundung gemeint ist.
theological_decisions:
- issue: Identität des Sprechers in den Formen der ersten Person
  choice: Der Sprecher ist im Kontext der HERR; der Gottesname wird im Vers jedoch nicht ergänzt.
  alternative: Den Gottesnamen als ausdrückliches Subjekt in die Übersetzung einsetzen.
  rationale: Die Formen »ich getan habe« und »meine Macht« beziehen sich im Kontext auf JHWH, doch der hebräische Wortlaut nennt den Gottesnamen in dieser Zeile nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Direktheit. Die parallelen Anreden »ihr Fernen« und »ihr Nahen« bilden die substantivisch gebrauchten hebräischen Adjektive natürlich und symmetrisch ab.
