source:
  edition: WLC
  text: חֲזֵ֣ה צִיּ֔וֹן קִרְיַ֖ת מֽוֹעֲדֵ֑/נוּ עֵינֶי/ךָ֩ תִרְאֶ֨ינָה יְרוּשָׁלִַ֜ם נָוֶ֣ה שַׁאֲנָ֗ן אֹ֤הֶל בַּל יִצְעָן֙ בַּל יִסַּ֤ע יְתֵֽדֹתָי/ו֙ לָ/נֶ֔צַח וְ/כָל חֲבָלָ֖י/ו בַּל יִנָּתֵֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: de
  text: 'Schau auf Zion[a], die Stadt unserer Feste! Deine Augen werden Jerusalem sehen: eine ruhige Wohnstätte[b], ein Zelt, das nicht versetzt wird. Seine Pflöcke werden niemals herausgezogen, und keines seiner Seile wird reißen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stadt unserer festgesetzten Zeiten“ beziehungsweise „die Stadt unserer Versammlungen“. Das hebräische Wort kann bestimmte Zeiten oder Zusammenkünfte bezeichnen, besonders im Zusammenhang mit dem Gottesdienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine sichere Wohnstätte“ beziehungsweise „eine ungestörte Wohnstätte“. Das hebräische Adjektiv kann Ruhe, Ungestörtheit und Sicherheit ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Bild ist das eines Zeltes, das nicht von seinem Ort wegbewegt wird: Seine Pflöcke werden nicht herausgezogen, und seine Spannseile reißen nicht.'
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: Schau auf
  rationale: Der Imperativ fordert unmittelbar zum Hinsehen auf; „Schau auf“ ist gegenwärtig, klar und bewahrt die Aufforderung.
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: die Stadt unserer Festversammlungen
  rationale: מוֹעֵד kann eine bestimmte Zeit, ein Fest oder eine einberufene Versammlung bezeichnen. „Festversammlungen“ verbindet im Jerusalemer Kultkontext den zeitlichen und gemeinschaftlichen Aspekt, ohne nur einen davon festzulegen.
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: Deine Augen werden ... sehen
  rationale: Die ausdrückliche Nennung der Augen wird als körperlich-anschauliche Hervorhebung bewahrt.
- source_word: נָוֶה שַׁאֲנָן
  choice: eine ungestörte Wohnstätte
  rationale: נָוֶה bezeichnet hier einen Wohnort; שַׁאֲנָן vermittelt Ruhe, Unbehelligtheit und Sicherheit. „Ungestört“ hält diese Bedeutungsbreite besser offen als das stärker deutende „sicher“.
- source_word: אֹהֶל בַּל יִצְעָן
  choice: ein Zelt, das nicht versetzt wird
  rationale: „Zelt“ entspricht der gewöhnlichen Bedeutung von אֹהֶל. Das seltene Verb יִצְעָן bezeichnet im Zusammenhang wohl ein Verrücken oder Weiterziehen; „versetzt“ erhält sowohl das konkrete Zeltbild als auch den Gedanken der Beständigkeit.
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: Seine Pflöcke werden niemals herausgezogen
  rationale: נסע bezeichnet beim Abbrechen eines Lagers das Herausziehen der Zeltpflöcke. לָנֶצַח wird in der verneinten Aussage idiomatisch mit „niemals“ wiedergegeben.
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: und keines seiner Seile wird reißen
  rationale: חֲבָלִים sind im Kontext die Spannseile des Zeltes. Die hebräische Verbindung „alle ... nicht“ wird im Deutschen natürlich mit „keines“ ausgedrückt; נתק im Nifal bezeichnet Abreißen oder Zerreißen.
theological_decisions:
- issue: Bedeutung des Zion-/Jerusalembildes
  choice: Die friedliche Beständigkeit Jerusalems wird durch das konkrete Bild eines nicht abgebrochenen Zeltes ausgedrückt.
  alternative: Das Bild ausdrücklich nur auf eine historische Wiederherstellung oder ausdrücklich auf das endzeitliche Gottesvolk beziehen.
  rationale: Der hebräische Text bezeichnet Zion und Jerusalem direkt und entfaltet ihre Beständigkeit metaphorisch. Eine weitergehende historische, ekklesiologische oder eschatologische Festlegung gehört nicht in den Übersetzungstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache des Zeltes bleibt konkret und einheitlich. „Festversammlungen“ wahrt die kultische Bedeutung von מוֹעֵד sowie die mögliche Nuance einer einberufenen Zusammenkunft; Alternativen werden in der Fußnote offengehalten.
