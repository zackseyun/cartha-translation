  - severity: medium
    issue: Die zweite Anreihung ist im Deutschen schwer lesbar.
    rationale: „und dir, Treuloser, an dem man …“ verbindet eine Dativanrede mit einem Relativanschluss in dritter Person ohne klaren grammatischen Übergang. Ein Relativsatz macht den masoretischen Personenwechsel nachvollziehbar.
  - severity: low
