  verdict: revise
  source_fidelity: Die Grundstruktur des hebräischen Wehrufs, die Wiederholung von „verwüsten“ und die Vergeltungsumkehr sind zutreffend wiedergegeben. Die dritte Person in וְלֹא בָגְדוּ בוֹ wird im Haupttext bewahrt und die mögliche Angleichung an die direkte Anrede angemessen vermerkt. „Sobald“ legt jedoch einen unmittelbaren zeitlichen Anschluss stärker nahe, als die temporale Konstruktion כַּ־ erfordert; „wenn“ ist quellentreuer und offener.
  naturalness: Der Entwurf ist insgesamt verständlich, doch die Verbindung „und dir, Treuloser, an dem …“ wirkt syntaktisch schwerfällig. Mit einem Relativsatz und „jemandem gegenüber treulos handeln“ wird die ungewöhnliche Personenfolge des hebräischen Textes verständlich, ohne sie zu glätten. „Wenn du aufhörst, treulos zu handeln“ ist modernes Standarddeutsch und bewahrt die verbale Wiederholung besser als die Nominalisierung „dein treuloses Handeln beendet hast“.
  terminology: „Verwüster/verwüstet“ bildet die hebräische Wurzelwiederholung überzeugend ab. „Treuloser/treulos handeln“ ist zwar gehoben, aber im prophetischen Register verständlich und erhält die Wiederholung von בגד. Die explizite Pluralform „sie“ entspricht יִבְגְּדוּ besser als das verallgemeinernde „man“.
