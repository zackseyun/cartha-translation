  text: ה֣וֹי שׁוֹדֵ֗ד וְ/אַתָּה֙ לֹ֣א שָׁד֔וּד וּ/בוֹגֵ֖ד וְ/לֹא בָ֣גְדוּ ב֑/וֹ כַּ/הֲתִֽמְ/ךָ֤ שׁוֹדֵד֙ תּוּשַּׁ֔ד כַּ/נְּלֹתְ/ךָ֥ לִ/בְגֹּ֖ד יִבְגְּדוּ בָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: de
  text: Wehe dir, Verwüster, der du selbst nicht verwüstet worden bist, und dir, Treuloser, dem gegenüber man nicht treulos gehandelt hat![a] Wenn du mit dem Verwüsten fertig bist, wirst du verwüstet werden; wenn du aufhörst, treulos zu handeln, werden sie dir gegenüber treulos handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und Treuloser, und man hat an ihm nicht treulos gehandelt“. Wegen der direkten Anrede kann der Sinn auch lauten: „und dir, Treuloser, dem gegenüber man nicht treulos gehandelt hat“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet hier einen prophetischen Wehruf und eine Gerichtsankündigung ein; „Wehe“ bewahrt die knappe, feierliche Schärfe.
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: Verwüster / verwüstet worden / verwüstet werden
  rationale: „Verwüsten“ umfasst gewaltsames Verheeren und Ausplündern und erhält durchgehend die hebräische Wortwiederholung und Umkehrung.
- source_word: בּוֹגֵד / בגד
  choice: Treuloser / treulos handeln
  rationale: Die Wendung bezeichnet verräterisches beziehungsweise treuloses Handeln. Die substantivierte Form „Treuloser“ ist als Anrede verständlich; die wiederholte Formulierung bewahrt das Wortspiel.
- source_word: כַּהֲתִמְךָ
  choice: Sobald du ... fertig bist
  rationale: Die temporale Konstruktion markiert den Zeitpunkt, an dem das Verwüsten vollendet ist; „sobald“ bringt den unmittelbaren Umschlag zum Gericht natürlich zum Ausdruck.
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: sobald du dein treuloses Handeln beendet hast
  rationale: נלה bezeichnet hier das Zu-Ende-Kommen beziehungsweise Aufhören der Treulosigkeit. Die Wiedergabe wahrt diese Bedeutungsbreite, ohne einen Beweggrund für das Aufhören einzutragen.
- source_word: יִבְגְּדוּ בָךְ
  choice: wird man an dir treulos handeln
  rationale: Das unbestimmte Subjekt des Plurals wird im Deutschen idiomatisch mit „man“ wiedergegeben; die Präposition und die Wiederholung des Stammes בגד bleiben erkennbar.
theological_decisions:
- issue: Personwechsel in וְלֹא בָגְדוּ בוֹ
  choice: „an dem man nicht treulos gehandelt hat“ als dritte Person, bezogen auf den angeredeten Treulosen
  alternative: „an dir hat man nicht treulos gehandelt“ als durchgehend direkte Anrede
  rationale: Der masoretische Text hat ausdrücklich das Suffix der dritten Person Singular („an ihm“). Die deutsche Relativkonstruktion erhält diese Form, lässt den Bezug jedoch natürlich auf den unmittelbar angeredeten „Treulosen“ zurücklaufen; die mögliche Angleichung an die zweite Person wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffälligen Wiederholungen „verwüsten“ und „treulos handeln“ sind bewusst beibehalten, weil sie die Vergeltungsstruktur des Hebräischen tragen. Der einzelne Fußnotenmarker [a] steht unmittelbar bei der textkritisch beziehungsweise syntaktisch mehrdeutigen Wendung.
