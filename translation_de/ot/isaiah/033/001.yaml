  to: Wehe dir, Verwüster, der du selbst nicht verwüstet worden bist, und dir, Treuloser, dem gegenüber man nicht treulos gehandelt hat![a] Wenn du mit dem Verwüsten fertig bist, wirst du verwüstet werden; wenn du aufhörst, treulos zu handeln, werden sie dir gegenüber treulos handeln.
  rationale: Die Revision ersetzt die überstarke zeitliche Einengung durch „wenn“, glättet die deutsche Syntax, ohne den im masoretischen Text stehenden Wechsel zur dritten Person zu beseitigen, und stellt die wiederholte Verbwurzel bei בגד klarer heraus. Die Fußnote wahrt die alternative Lesung als durchgehend direkte Anrede.
