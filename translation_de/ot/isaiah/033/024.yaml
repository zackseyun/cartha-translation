    rationale: „Aufgehoben“ kann im modernen Deutsch sowohl „beseitigt“ als auch „aufbewahrt/beibehalten“ heißen. Es bildet die hebräische Bildsprache daher nicht klar ab.
  - severity: low
    issue: „darin wohnt“ wirkt im Einzelvers kontextarm
    rationale: Das Suffix in בָּהּ verweist auf Zion beziehungsweise die Stadt im Kontext. „Dort“ gibt den Ortsbezug idiomatischer wieder, ohne einen nicht im Vers genannten Ortsnamen einzuführen.
