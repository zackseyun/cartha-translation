  text: וּ/בַל יֹאמַ֥ר שָׁכֵ֖ן חָלִ֑יתִי הָ/עָ֛ם הַ/יֹּשֵׁ֥ב בָּ֖/הּ נְשֻׂ֥א עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: de
  text: 'Und kein Bewohner wird sagen: »Ich bin krank.« Dem Volk, das dort wohnt, ist die Schuld vergeben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Schuld ist getragen« beziehungsweise »ihre Schuld ist weggenommen«. Die hebräische Wendung spricht wörtlich davon, dass Schuld getragen oder weggenommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: Und kein
  rationale: Die Konjunktion וּ wird mit »Und« wiedergegeben; בַל drückt hier eine nachdrückliche Verneinung aus. Zusammen mit dem generisch gebrauchten שָׁכֵן ergibt sich im Deutschen natürlich »Und kein Bewohner«.
- source_word: יֹאמַר
  choice: wird sagen
  rationale: Das Imperfekt bezeichnet im prophetischen Ausblick ein zukünftiges Geschehen.
- source_word: שָׁכֵן
  choice: Bewohner
  rationale: Die substantivisch gebrauchte Form bezeichnet allgemein jemanden, der an diesem Ort wohnt.
- source_word: חָלִיתִי
  choice: Ich bin krank
  rationale: Die Verbform beschreibt den eingetretenen beziehungsweise gegenwärtigen Zustand von Krankheit oder Schwäche; in der direkten Rede ist »Ich bin krank« natürlich und präzise.
- source_word: הָעָם
  choice: Dem Volk
  rationale: עַם bezeichnet hier die Bevölkerung als Gemeinschaft. Der Dativ entspricht der deutschen Konstruktion »jemandem ist etwas vergeben«.
- source_word: הַיֹּשֵׁב בָּהּ
  choice: das darin wohnt
  rationale: Das singularische Partizip stimmt mit dem Kollektivum »Volk« überein. בָּהּ bezieht sich auf den zuvor beschriebenen Ort beziehungsweise Zion; »darin« bewahrt diesen örtlichen Bezug.
- source_word: נְשֻׂא עָוֺן
  choice: ist die Schuld vergeben
  rationale: Die Verbindung von נשׂא mit עָוֹן ist eine hebräische Wendung für das Tragen, Wegnehmen beziehungsweise Vergeben von Schuld. Die Hauptübersetzung gibt den idiomatischen Sinn verständlich wieder, während die Fußnote das konkrete Bild bewahrt.
theological_decisions:
- issue: Verhältnis von Krankheit und Schuldvergebung
  choice: Der Vers stellt die Abwesenheit von Krankheit und die Vergebung der Schuld als zwei Segnungen für Zions Bevölkerung nebeneinander.
  alternative: Man könnte die Krankheit ausschließlich bildlich auf geistliche Not beziehen oder aus der Aussage einen unmittelbaren Zusammenhang zwischen jeder persönlichen Krankheit und persönlicher Sünde ableiten.
  rationale: Der hebräische Text nennt beide Aspekte, erklärt jedoch nicht ausdrücklich ihr kausales Verhältnis. Die Übersetzung bewahrt diese Spannung und fügt keine weitergehende Lehrentscheidung hinzu.
- issue: Bedeutungsumfang von נְשֻׂא עָוֺן
  choice: Die Hauptzeile formuliert idiomatisch »die Schuld ist vergeben« und erläutert das Bild des Tragens beziehungsweise Wegnehmens in einer Fußnote.
  alternative: Wörtlicher wären »die Schuld ist weggetragen« oder »die Sünde ist aufgehoben«.
  rationale: Die Wendung kann sowohl den Akt des Tragens als auch das daraus folgende Wegnehmen beziehungsweise Vergeben ausdrücken. Haupttext und Fußnote bewahren gemeinsam Klarheit und semantische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; »Bewohner« und »Volk« sind allgemein verständlich. Die ungewöhnliche Bildlichkeit der hebräischen Vergebungswendung wird nicht in den Haupttext gezwungen, aber in der Fußnote sichtbar gehalten.
