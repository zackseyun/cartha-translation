  verdict: revise
  source_fidelity: Die Hauptübersetzung gibt die Zukunftsaussage, die generische Einzahl von שָׁכֵן, die Krankheitsaussage sowie die idiomatische Verbindung נְשֻׂא עָוֺן zutreffend wieder. Der Dativ in „Dem Volk ... ist die Schuld vergeben“ entspricht dem passivischen Sinn im Deutschen gut.
  naturalness: „Darin wohnt“ ist ohne den weiteren Kontext Zions etwas sperrig und referenziell weniger klar. „Dort wohnt“ ist modernes, natürliches Deutsch und wahrt den lokalen Rückbezug. Die Fußnotenformulierung „Sünde ist aufgehoben“ ist im heutigen Deutsch mehrdeutig, da „aufheben“ auch „beibehalten“ bedeuten kann.
  terminology: „Bewohner“, „Volk“, „krank“, „Schuld“ und „vergeben“ sind angemessen. Die Fußnote sollte die Bildsprache von נשׂא mit „getragen“ bzw. „weggenommen“ erläutern, ohne die missverständliche Alternative „aufgehoben“ zu verwenden.
