  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: de
  text: Doch dort wird Jahwe, der Majestätische, für uns ein Ort mit Flüssen und breiten Strömen sein[a][b], wo kein Ruderschiff fährt[c] und kein mächtiges Schiff hindurchfährt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch dort ist der Mächtige, Jahwe, für uns ein Ort mit Flüssen und breiten Strömen.“'
    reason: Die knappe hebräische Nominalkonstruktion lässt auch eine Gliederung zu, in der „der Mächtige“ substantivisch auf Jahwe bezogen wird.
  - marker: b
    text: 'Wörtlich: „breit an Händen“; gemeint sind sehr breite Wasserläufe.'
    reason: Erläutert das hebräische Körperteilidiom רַחֲבֵי יָדָיִם.
  - marker: c
    text: 'Auch: „Schiff mit Rudern“; die genaue Art des bezeichneten Wasserfahrzeugs ist lexikalisch nicht völlig sicher.'
    reason: Die Wendung אֳנִי שַׁיִט bezeichnet ein aktiv bewegtes Schiff, wahrscheinlich ein gerudertes Fahrzeug.
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch
  rationale: Die Wortverbindung setzt einen starken Gegensatz zum vorausgehenden Zusammenhang; „Doch“ gibt diesen Umschwung im Deutschen knapp und natürlich wieder.
- source_word: שָׁם
  choice: dort
  rationale: Bewahrt den örtlichen Nachdruck auf Zion als den beschriebenen sicheren Ort.
- source_word: אַדִּיר יְהוָה
  choice: Jahwe, der Majestätische
  rationale: אַדִּיר bezeichnet Größe, Hoheit und Macht. Die Apposition gibt den wahrscheinlich attributiven Bezug auf Jahwe wieder, ohne die Bedeutungsbreite auf bloße Stärke zu verengen.
- source_word: לָנוּ
  choice: für uns
  rationale: Die Präposition bezeichnet hier den Nutzen für das Volk.
- source_word: מְקוֹם נְהָרִים יְאֹרִים
  choice: ein Ort mit Flüssen und … Strömen
  rationale: מְקוֹם bleibt als „Ort“ erhalten; die beiden Wasserwörter werden unterscheidbar, aber idiomatisch mit „Flüssen“ und „Strömen“ wiedergegeben.
- source_word: רַחֲבֵי יָדָיִם
  choice: weite Ströme
  rationale: Die wörtliche Wendung „breit an Händen/Seiten“ beschreibt sehr breite Wasserläufe; „weit“ vermittelt das Bild in natürlichem Deutsch.
- source_word: אֳנִי שַׁיִט
  choice: Ruderschiff
  rationale: Die Bezeichnung meint ein zur aktiven Fahrt, wahrscheinlich mit Rudern, bewegtes Schiff. „Ruderschiff“ ist verständlich und weniger historisch verengt als „Galeere“.
- source_word: וְצִי אַדִּיר
  choice: kein mächtiges Schiff
  rationale: צִי bezeichnet ein Schiff oder Wasserfahrzeug; אַדִּיר hebt dessen Macht oder imposante Größe hervor.
- source_word: לֹא יַעַבְרֶנּוּ
  choice: kein … Schiff hindurchzieht
  rationale: Das Verb bezeichnet das Durchqueren. „hindurchzieht“ bewahrt die räumliche Vorstellung, ohne im Deutschen einen unklaren Singularbezug zu erzwingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ macht den persönlichen Gottesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Jahwe als schützender Ort mit Wasserläufen
  choice: für uns ein Ort mit Flüssen und weiten Strömen
  alternative: für uns wie ein Ort mit Flüssen und weiten Strömen
  rationale: Der hebräische Text setzt Jahwe unmittelbar mit dem schützenden Ort in Beziehung und enthält kein ausdrückliches Vergleichswort. Die Übersetzung wahrt diese kühne Metapher.
- issue: Syntaktischer Bezug von אַדִּיר
  choice: Jahwe, der Majestätische
  alternative: dort ist Jahwe für uns der Mächtige, ein Ort mit Flüssen und Strömen
  rationale: Die Wortstellung legt einen beschreibenden Bezug von אַדִּיר auf Jahwe nahe, lässt aber eine prädikative Gliederung zu. Die Hauptfassung wählt die natürlichere attributive Lesart; die Fußnote hält die syntaktische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt bildhaft und nah am Hebräischen, vermeidet aber unnatürliche Singularbezüge bei den Wasserläufen. „der Majestätische“ ist gehoben, jedoch allgemein verständlich; „mächtiges Schiff“ nimmt die Wiederholung von אַדִּיר mit einer kontextgerechten Bedeutungsnuance auf.
