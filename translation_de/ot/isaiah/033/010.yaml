  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
translation:
  language: de
  text: Nun stehe ich auf, spricht Jahwe; nun erhebe ich mich, nun werde ich erhöht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nun werde ich erhaben sein, nun werde ich emporgehoben.“ Die beiden letzten hebräischen Verben sind bedeutungsnah; ihre genaue Abstufung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: nun
  rationale: Das dreimal wiederholte Zeitadverb bezeichnet das unmittelbar einsetzende Handeln Gottes. „Nun“ bewahrt die knappe, feierliche Wiederholung.
- source_word: אָקוּם
  choice: stehe ich auf
  rationale: Das Qal-Imperfekt von קום bezeichnet hier das entschlossene Aufstehen zum Eingreifen. Das deutsche Präsens mit „nun“ gibt die Unmittelbarkeit natürlicher wieder als eine bloße Zukunftsform.
- source_word: יֹאמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel wahrt den feierlichen Charakter; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֵרוֹמָם
  choice: erhebe ich mich
  rationale: Die Form von רום kann hier selbstbezügliches Sich-Erheben beziehungsweise Erhabensein ausdrücken. Die reflexive Wiedergabe unterscheidet sie vorsichtig vom folgenden Niphal.
- source_word: אֶנָּשֵׂא
  choice: werde ich erhöht sein
  rationale: Das Niphal-Imperfekt von נשׂא hat passive beziehungsweise zustandsbezogene Färbung. Die Formulierung bewahrt zugleich die enge Bedeutungsnähe zum vorangehenden Verb.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis der beiden abschließenden Erhöhungsverben
  choice: „erhebe ich mich“ und „werde ich erhöht sein“
  alternative: „werde ich erhaben sein“ und „werde ich erhöht sein“
  rationale: Die beiden hebräischen Verben liegen semantisch eng beieinander, unterscheiden sich aber in Wurzel und Stammform. Die Übersetzung erhält sowohl ihre Parallelität als auch eine mögliche aktiv-reflexive beziehungsweise passive Abstufung, ohne die genaue Nuance dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Rhythmik. Die dreifache Wiederholung von „nun“ und die Folge der drei Gotteshandlungen bleiben erhalten.
