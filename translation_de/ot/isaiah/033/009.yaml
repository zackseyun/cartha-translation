id: ISA.33.9
reference: Isaiah 33:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָבַ֤ל אֻמְלְלָה֙ אָ֔רֶץ הֶחְפִּ֥יר לְבָנ֖וֹן קָמַ֑ל הָיָ֤ה הַ/שָּׁרוֹן֙ כָּֽ/עֲרָבָ֔ה וְ/נֹעֵ֥ר בָּשָׁ֖ן וְ/כַרְמֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: de
  text: Das Land trauert und verkümmert; der Libanon ist beschämt und verdorrt. Die Scharon-Ebene ist wie die Araba[a] geworden, und Baschan und Karmel schütteln ihr Laub ab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Wüstenebene“ beziehungsweise „wie die Steppe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Baschan und Karmel schütteln ab“; dem Zusammenhang nach ist gemeint, dass sie ihr Laub verlieren und kahl werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: trauert
  rationale: Bewahrt die poetische Personifikation des Landes; zugleich lässt der Zusammenhang Verwüstung und Dürre anklingen.
- source_word: אֻמְלְלָה
  choice: verkümmert
  rationale: Bezeichnet ein Schwachwerden oder Dahinsiechen und passt zur Verwüstung des Landes, ohne die Bildsprache auf bloßes Austrocknen zu verengen.
- source_word: אֶרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das verwüstete Gebiet gemeint, nicht notwendig die ganze Erde.
- source_word: הֶחְפִּיר
  choice: ist beschämt
  rationale: Gibt die dem Libanon zugeschriebene Scham beziehungsweise Erniedrigung wieder und erhält die Personifikation.
- source_word: לְבָנוֹן
  choice: der Libanon
  rationale: Gebräuchliche deutsche Form des geografischen Namens.
- source_word: קָמַל
  choice: verdorrt
  rationale: Das Verb beschreibt das Welken oder Vertrocknen von Pflanzen; „verdorrt“ bringt die Vegetations- und Dürrevorstellung prägnant zum Ausdruck.
- source_word: הַשָּׁרוֹן
  choice: die Scharon-Ebene
  rationale: Die ergänzende Gattungsbezeichnung macht für heutige Leser deutlich, dass Scharon eine Landschaft bezeichnet, und entspricht dem deutschen Sprachgebrauch.
- source_word: כָּעֲרָבָה
  choice: wie die Araba
  rationale: Bewahrt die mögliche geografische Anspielung auf die Jordansenke; die allgemeinere Bedeutung als dürre Steppe wird in der Fußnote genannt.
- source_word: נֹעֵר
  choice: schütteln ihr Laub ab
  rationale: Das Verb bedeutet „abschütteln“; das im Hebräischen nicht ausdrücklich genannte Laub wird aus dem Bildzusammenhang ergänzt, damit das Bild im Deutschen verständlich bleibt.
- source_word: בָּשָׁן
  choice: Baschan
  rationale: Gebräuchliche deutsche Umschrift des Landschaftsnamens.
- source_word: כַרְמֶל
  choice: Karmel
  rationale: Gebräuchliche deutsche Form des Namens; „Berg“ wird nicht ergänzt, da es im hebräischen Text nicht ausdrücklich steht.
