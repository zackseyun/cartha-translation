id: ISA.33.5
reference: Isaiah 33:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: de
  text: Jahwe ist erhaben, denn er wohnt hoch oben[a]; er hat Zion mit Recht und Gerechtigkeit erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Höhe wohnt“.'
    reason: Lexikalisch-syntaktische Alternative für שֹׁכֵן מָרוֹם; מָרוֹם kann als Bezeichnung des hohen Ortes beziehungsweise der Höhe verstanden werden.
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: ist erhaben
  rationale: Die Zustandsform bezeichnet Jahwes Hoheit und erhöhte Stellung. „Ist erhaben“ bewahrt sowohl das räumliche Bild als auch die ehrende Aussage und klingt im Deutschen natürlich und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für die Aussage ein, dass Jahwe erhaben ist.
- source_word: שֹׁכֵן מָרוֹם
  choice: er wohnt hoch oben
  rationale: Das Partizip beschreibt ein fortdauerndes Wohnen; „hoch oben“ gibt die räumliche Höhe von מָרוֹם idiomatisch wieder, ohne die Bildsprache aufzulösen.
- source_word: מִלֵּא
  choice: er hat … erfüllt
  rationale: 'Das Perfekt wird als vollendetes Handeln mit gegenwärtigem Ergebnis wiedergegeben: Zion ist nun von Recht und Gerechtigkeit erfüllt.'
- source_word: צִיּוֹן
  choice: Zion
  rationale: Die geläufige Form des Ortsnamens bewahrt dessen geschichtlichen und theologischen Klang.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im Wortpaar mit צְדָקָה bezeichnet מִשְׁפָּט die gerechte Ordnung und Rechtsprechung. „Recht“ ist im Deutschen knapp, geläufig und vom folgenden „Gerechtigkeit“ unterscheidbar.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den Aspekt des sittlich und gemeinschaftlich richtigen Handelns und lässt die beiden verwandten Begriffe des hebräischen Wortpaars unterscheidbar bleiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wortpaar מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Gericht und Gerechtigkeit
  rationale: Die unterschiedliche Wiedergabe der beiden eng verwandten Begriffe erhält die Spannung zwischen gerechter Rechtsordnung und umfassender moralischer Gerechtigkeit, ohne beide gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die Satzstruktur folgt der knappen hebräischen Aussage; das Semikolon macht den Übergang von Jahwes erhabener Wohnstatt zu seinem Wirken in Zion sichtbar.
