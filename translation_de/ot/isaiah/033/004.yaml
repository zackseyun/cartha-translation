base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/004.yaml
  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
translation:
  language: de
  text: Und eure Beute wird eingesammelt, wie die Fressheuschrecke[a] einsammelt; wie Schwärme[b] heranstürmen, so stürzt man sich darauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Heuschrecke einsammelt“. חָסִיל kann eine bestimmte Art oder Entwicklungsstufe der Heuschrecke bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der zweite Vergleich ist im Hebräischen schwer verständlich. Das seltene Wort גֵּבִים kann hier Schwärme meinen und wird häufig mit dem Heuschreckenbild verbunden. Möglich sind auch Wiedergaben wie: „wie beim Ansturm“ oder „wie Heuschrecken umherjagen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסַּף
  choice: Und … wird eingesammelt
  rationale: Das passive Verb von אסף bezeichnet das Auflesen oder Einsammeln. Die Zukunftsform ergibt sich aus dem prophetischen Zusammenhang; „Und“ gibt die einfache Satzverknüpfung wieder.
- source_word: שְׁלַלְכֶם
  choice: eure Beute
  rationale: שׁלל bezeichnet im kriegerischen Zusammenhang erbeutetes Gut. „Beute“ ist dafür im modernen Deutschen idiomatisch.
- source_word: אֹסֶף
  choice: wie … einsammelt
  rationale: Das mit אסף verwandte Substantiv greift das vorangehende Verb nachdrücklich auf. Die deutsche Verbwiederholung bewahrt dieses Wortspiel natürlicher als „wie das Einsammeln“.
- source_word: הֶחָסִיל
  choice: die Fressheuschrecke
  rationale: חָסִיל kann eine bestimmte Art oder Entwicklungsstufe der Heuschrecke bezeichnen und hebt wahrscheinlich ihre verheerende Fraßtätigkeit hervor. Der Singular kann kollektiv verstanden werden.
- source_word: כְּמַשַּׁק
  choice: wie … heranstürmen
  rationale: Das seltene מַשַּׁק bezeichnet wahrscheinlich ein heftiges Heraneilen, einen Ansturm oder Angriff. „heranstürmen“ vermittelt die plötzliche, lebhafte Bewegung.
- source_word: גֵּבִים
  choice: Heuschreckenschwärme
  rationale: Das seltene Wort ist unsicher. Im parallelen Heuschreckenbild liegt eine Bezeichnung für Schwärme beziehungsweise schwärmende Heuschrecken nahe.
- source_word: שׁוֹקֵק
  choice: so stürzt man sich
  rationale: Das Partizip schildert eine lebhafte, drängende Bewegung. Das unpersönliche „man“ wahrt den im Hebräischen nicht ausdrücklich genannten Handlungsträger, ohne Menschen als Subjekt festzulegen.
- source_word: בּוֹ
  choice: darauf
  rationale: Die Präposition mit Suffix verweist am ehesten auf die Beute als Ziel des Ansturms.
