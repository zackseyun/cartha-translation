  source_fidelity: 'Die Grundstruktur ist zutreffend: passive Zukunft für וְאֻסַּף, kriegerische „Beute“ für שְׁלַלְכֶם, die Wiederaufnahme von אסף sowie das unbestimmte deutsche „man“ für den nicht ausdrücklich benannten Handelnden. Der erste Vergleich ist jedoch im Entwurf und besonders in Anmerkung a nicht ganz sauber wiedergegeben: אֹסֶף הֶחָסִיל beschreibt am wahrscheinlichsten das Einsammeln durch die (Fress-)Heuschrecke, nicht das Einsammeln der Heuschrecken als Objekt. Im zweiten Vergleich ist „Heuschreckenschwärme“ als Haupttext unnötig festlegend, da גֵּבִים lexikalisch unsicher ist.'
