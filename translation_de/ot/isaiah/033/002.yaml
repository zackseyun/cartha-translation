id: ISA.33.2
reference: Isaiah 33:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: de
  text: Jahwe, sei uns gnädig! Auf dich hoffen wir. Sei jeden Morgen ihr Arm[a], sei auch unsere Rettung in der Zeit der Not!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem hebräischen Text: „ihr Arm“. Manche verstehen den Ausdruck kollektiv als Bezug auf die betende Gemeinschaft und übersetzen: „unser Arm“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben; die direkte Anrede ergibt sich aus dem Gebetscharakter.
- source_word: חָנֵּנוּ
  choice: sei uns gnädig
  rationale: Die Bitte bewahrt den Grundsinn von חנן und klingt zugleich natürlich und würdevoll.
- source_word: לְךָ קִוִּינוּ
  choice: auf dich hoffen wir
  rationale: קוה bezeichnet erwartungsvolles Warten und Hoffen. Die Formulierung gibt das Vertrauen natürlich wieder; das hebräische Perfekt kann im Gebetszusammenhang eine fortdauernde Haltung ausdrücken.
- source_word: הֱיֵה
  choice: sei
  rationale: Der Imperativ von היה leitet die Bitte unmittelbar ein.
- source_word: זְרֹעָם
  choice: ihr Arm
  rationale: Der masoretische Text hat ein Suffix der 3. Person Plural. Das Bild des Arms als Kraft und Schutz wird beibehalten, ohne die Pronomenverschiebung zu glätten.
- source_word: לַבְּקָרִים
  choice: jeden Morgen
  rationale: Der Plural bezeichnet die regelmäßig wiederkehrenden Morgen; diese Wiedergabe ist idiomatisches modernes Deutsch.
- source_word: אַף
  choice: auch
  rationale: Das Wort fügt die zweite Bitte verstärkend beziehungsweise ergänzend an.
- source_word: יְשׁוּעָתֵנוּ
  choice: unsere Rettung
  rationale: Im unmittelbaren Zusammenhang steht konkrete Befreiung aus Not im Vordergrund. „Rettung“ bewahrt diesen Sinn, ohne die weitere theologische Bedeutung auszuschließen.
- source_word: בְּעֵת צָרָה
  choice: in der Zeit der Not
  rationale: Die Formulierung gibt sowohl den zeitlichen Ausdruck als auch die Bedrängnis von צָרָה klar und würdig wieder.
theological_decisions:
- issue: Pronomen in זְרֹעָם
  choice: ihr Arm
  alternative: unser Arm
  rationale: Das Suffix des masoretischen Textes ist formal 3. Person maskulin Plural („ihr“). Obwohl der Wechsel von „uns/wir“ zu „ihr“ auffällt und häufig zu „unser“ geglättet wird, bleibt die echte textliche Spannung im Haupttext erhalten; die kontextuell naheliegende Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich gebetsartig-würdevolles Standarddeutsch. Kurze Ausrufesätze bilden die eindringlichen Bitten ab. Die hebräische Arm-Metapher und der auffällige Pronomenwechsel bleiben bewusst erhalten.
