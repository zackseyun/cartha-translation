  text: פָּחֲד֤וּ בְ/צִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים מִ֣י יָג֣וּר לָ֗/נוּ אֵ֚שׁ אוֹכֵלָ֔ה מִי יָג֥וּר לָ֖/נוּ מוֹקְדֵ֥י עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: de
  text: 'Die Sünder in Zion fürchten sich, Zittern hat die Gottlosen[a] ergriffen: »Wer von uns kann bei einem verzehrenden Feuer wohnen[b][c]? Wer von uns kann bei ewigen Flammen wohnen[d]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heuchler“. Das hebräische Wort kann gottlose oder frevelhafte Menschen bezeichnen, nicht nur unaufrichtige.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Fremder weilen“ beziehungsweise „bleiben“. Das hebräische Verb kann ein vorübergehendes Verweilen oder ein Wohnen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das „verzehrende Feuer“ erinnert an biblische Aussagen über Gottes heilige und richtende Gegenwart; siehe 5. Mose 4,24; Hebräer 12,29.
    reason: cross_reference
  - marker: d
    text: 'Oder: „immerwährenden Flammen“ beziehungsweise „ewigem Brennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ
  choice: fürchten sich
  rationale: Das Qal Perfekt bezeichnet hier die eingetretene Furcht der Sünder; das deutsche Präsens gibt den daraus entstandenen Zustand natürlich wieder.
- source_word: בְצִיּוֹן
  choice: in Zion
  rationale: Die Präposition בְ ist hier lokal zu verstehen und bezeichnet den Ort, an dem sich die Sünder befinden.
- source_word: חַטָּאִים
  choice: die Sünder
  rationale: Die geläufige Bezeichnung für Menschen, die durch Sünde gekennzeichnet sind, wird direkt und verständlich wiedergegeben.
- source_word: אָחֲזָה רְעָדָה
  choice: Zittern hat … ergriffen
  rationale: 'Die konkrete hebräische Wendung bleibt erhalten: Das Zittern packt beziehungsweise ergreift die Betroffenen.'
- source_word: חֲנֵפִים
  choice: die Gottlosen
  rationale: Das Wort bezeichnet hier eher frevelhafte, irreligiöse Menschen als lediglich unaufrichtige Personen; „Gottlose“ bewahrt den moralisch-religiösen Sinn.
- source_word: מִי יָגוּר לָנוּ
  choice: Wer von uns kann … wohnen
  rationale: גור kann „als Fremder weilen“ oder allgemeiner „wohnen/bleiben“ bedeuten. לָנוּ wird im gemeinschaftlichen Selbstausruf idiomatisch mit „von uns“ wiedergegeben.
- source_word: אֵשׁ אוֹכֵלָה
  choice: ein verzehrendes Feuer
  rationale: Die substantivisch-partizipiale Verbindung wird als lebendiges Bild eines Feuers wiedergegeben, das verzehrt.
- source_word: מוֹקְדֵי עוֹלָם
  choice: ewige Gluten
  rationale: „Gluten“ wahrt das intensive Feuerbild und den hebräischen Plural; „ewig“ gibt עוֹלָם wieder, ohne die Bildsprache näher dogmatisch festzulegen.
theological_decisions:
- issue: Bezug des verzehrenden Feuers und der ewigen Gluten
  choice: Die Übersetzung lässt die Feuerbilder als Bilder der furchterregenden Heiligkeit und des Gerichts in Gottes Gegenwart stehen.
  alternative: Die Bilder könnten enger auf das göttliche Strafgericht über die Frevler oder auf die Feuer- und Altarsymbolik Zions bezogen werden.
  rationale: Der unmittelbare Zusammenhang verbindet die gefährliche Gegenwart JHWHs mit der Frage, wer dort bestehen beziehungsweise wohnen kann. Der Haupttext bewahrt diese Spannung, ohne das Bild auf eine spätere Lehrkategorie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. Die Wiederholung von „wohnen“ bildet die hebräische Wiederholung ab; die konkrete Bildsprache von Zittern, Feuer und Gluten bleibt erhalten.
