  variant: modern standard German
source:
  edition: WLC
  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: de
  text: Deine Taue hängen schlaff; sie können den Fuß ihres Mastes nicht festhalten und das Segel[a] nicht ausspannen. Dann wird reiche Beute verteilt[b]; selbst die Lahmen tragen Beute davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Banner“ beziehungsweise „das Feldzeichen“. Das hebräische Wort bedeutet gewöhnlich „Banner“ oder „Signalzeichen“; „Segel“ entspricht jedoch dem Schiffsbild des Verses.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Bild eines manövrierunfähigen Schiffes schildert den Zusammenbruch des Feindes: Seine Beute kann so mühelos genommen werden, dass selbst die Lahmen daran teilhaben.'
    reason: cultural_note
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: Deine Taue hängen schlaff
  rationale: Das passive Perfekt beschreibt gelöste oder erschlaffte Taue. „Hängen schlaff“ gibt das Bild eines manövrierunfähigen Schiffes natürlich wieder; das feminine Suffix der zweiten Person bleibt als „deine“ erhalten.
- source_word: בַּל יְחַזְּקוּ
  choice: sie können … nicht festhalten
  rationale: Die starke Verneinung bezeichnet im Zusammenhang eher Unfähigkeit als bloße Weigerung; חזק bezeichnet das Befestigen beziehungsweise Festhalten.
- source_word: כֵן תָּרְנָם
  choice: den Fuß ihres Mastes
  rationale: כֵן ist hier unsicher und bezeichnet wahrscheinlich Stand, Sockel oder Stütze; „Fuß“ passt zur Mastkonstruktion, ohne eine technisch zu genaue Deutung zu behaupten. Das Suffix an תרן wird mit „ihres“ bewahrt.
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: das Segel nicht ausspannen
  rationale: פרש bedeutet ausbreiten oder ausspannen. נֵס bezeichnet gewöhnlich ein Banner oder Feldzeichen, kann im durchgehenden Schiffsbild jedoch als Segel verstanden werden; die lexikalisch naheliegende Alternative steht in der Fußnote.
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: Dann wird reiche Beute verteilt
  rationale: „Dann“ führt die Folge des Zusammenbruchs ein. Das passive Verb und die große Menge der Beute werden knapp und idiomatisch wiedergegeben.
- source_word: פִּסְחִים בָּזְזוּ בַז
  choice: selbst die Lahmen tragen Beute davon
  rationale: 'Die Aussage steigert die Wehrlosigkeit des besiegten Gegners: Sogar Menschen mit eingeschränkter Gehfähigkeit können plündern. „Die Lahmen“ bleibt nah am hebräischen Ausdruck; „Beute davontragen“ gibt die Wortfigur von בזז und בז natürlich wieder.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer nautischer Bildsprache. Die unsichere Bedeutung von כֵן wird nicht technisch überpräzisiert; die Mehrdeutigkeit von נֵס bleibt durch die Fußnote sichtbar. Der Fußnotenmarker [a] steht unmittelbar bei „Segel“, auf das sich die lexikalische Alternative bezieht.
