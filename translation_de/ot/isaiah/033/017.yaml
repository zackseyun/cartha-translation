source:
  edition: WLC
  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: de
  text: Deine Augen werden den König in seiner Schönheit sehen; sie werden ein Land sehen, das sich weithin erstreckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein fernes Land“; wörtlicher: „ein Land der Fernen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: den König
  rationale: Das artikellose hebräische Substantiv kann hier bestimmt verstanden werden. Der Kontext weist auf eine konkrete königliche Gestalt, ohne sie näher zu identifizieren.
- source_word: בְּיָפְיוֹ
  choice: in seiner Schönheit
  rationale: Die Wiedergabe bewahrt die hebräische Konstruktion und lässt offen, ob äußere Schönheit, königlicher Glanz oder wiederhergestellte Würde gemeint ist.
- source_word: תֶּחֱזֶינָה
  choice: werden … sehen
  rationale: חזה bezeichnet ein bewusstes Schauen oder Erblicken. Im modernen Deutschen ist „sehen“ hier natürlich und würdig; die Hervorhebung entsteht durch das ausdrücklich beibehaltene Subjekt „deine Augen“.
- source_word: עֵינֶיךָ
  choice: Deine Augen
  rationale: Die ausdrückliche Nennung der Augen erhält das poetische Bild und dient als gemeinsames Subjekt beider femininer Pluralverben.
- source_word: תִּרְאֶינָה
  choice: sie werden … sehen
  rationale: Das Pronomen nimmt „deine Augen“ auf und bewahrt den Parallelismus der beiden Satzhälften.
- source_word: אֶרֶץ
  choice: ein Land
  rationale: „Land“ gibt die breite Bedeutung von אֶרֶץ wieder. Die unbestimmte Form ist im Deutschen hier natürlich, ohne eine bestimmte geografische Zuordnung einzutragen.
- source_word: מַרְחַקִּים
  choice: das sich weithin erstreckt
  rationale: Der Plural des Distanzbegriffs bezeichnet weite Fernen beziehungsweise große Ausdehnung. Die Formulierung gibt das poetische Bild idiomatisch wieder, ohne es auf bloße Abgelegenheit festzulegen.
theological_decisions:
- issue: Identität des Königs
  choice: „den König“, ohne nähere Identifizierung
  alternative: Hiskia, der HERR als König oder ein messianisch-eschatologischer König
  rationale: Der hebräische Vers nennt lediglich den König. Die Übersetzung bewahrt diese Offenheit und legt keine bestimmte theologische Deutung fest.
- issue: Bedeutung des fernen beziehungsweise weiten Landes
  choice: ein Land von großer Ausdehnung
  alternative: ein fernes oder abgelegenes Land
  rationale: אֶרֶץ מַרְחַקִּים kann sowohl räumliche Weite als auch Ferne ausdrücken. Der Haupttext wählt eine natürliche expansive Lesart; die Fußnote erhält die lexikalische Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. Die Wiederholung von „sehen“ und das ausdrückliche „deine Augen“ bewahren den hebräischen Parallelismus; der Relativsatz gibt die ungewohnte Wendung אֶרֶץ מַרְחַקִּים natürlich wieder.
