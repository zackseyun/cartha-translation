  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die zentralen Lexeme zuverlässig wieder: „Deine Augen“ bleibt als ausdrückliches Subjekt erhalten, „den König“ wahrt die im Kontext naheliegende bestimmte, aber nicht weiter identifizierte Referenz, und „in seiner Schönheit“ bewahrt die Offenheit von בְּיָפְיוֹ. Die Wiederholung von „sehen“ bildet den Parallelismus der beiden Verben angemessen ab. „ein Land, das sich weithin erstreckt“ ist eine idiomatische und sachlich vertretbare Wiedergabe von אֶרֶץ מַרְחַקִּים, ohne es einseitig als bloß abgelegen festzulegen.'
