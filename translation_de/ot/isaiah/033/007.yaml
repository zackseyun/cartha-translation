id: ISA.33.7
reference: Isaiah 33:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֚ן אֶרְאֶלָּ֔ם צָעֲק֖וּ חֻ֑צָ/ה מַלְאֲכֵ֣י שָׁל֔וֹם מַ֖ר יִבְכָּיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
translation:
  language: de
  text: Seht, ihre Helden[a] schreien draußen; die Friedensboten[b] weinen bitterlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort אֶרְאֶלָּם ist unsicher. Möglich sind etwa „ihre Tapferen“, wörtlicher vielleicht „ihre Ariel-Männer“ oder „ihre Gotteslöwen“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Friedensgesandten“ beziehungsweise „die Unterhändler für den Frieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Interjektion wird in natürlichem, würdigem Deutsch wiedergegeben und behält ihren nachdrücklichen Charakter.
- source_word: אֶרְאֶלָּם
  choice: ihre Helden
  rationale: Das schwierige und umstrittene Wort bezeichnet im Zusammenhang am ehesten die tapferen oder herausragenden Männer des Volkes; das Suffix wird mit „ihre“ wiedergegeben. Die Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: צָעֲקוּ
  choice: schreien
  rationale: Das Verb bezeichnet hier einen lauten Notschrei. Das Präsens vermittelt die lebendige Darstellung der prophetischen Dichtung.
- source_word: חֻצָה
  choice: draußen
  rationale: Die Richtungs- beziehungsweise Ortsangabe bezeichnet den Bereich außerhalb; „draußen“ bleibt näher am unspezifischen hebräischen Ausdruck als „auf den Straßen“.
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: die Friedensboten
  rationale: מַלְאָך kann einen Boten oder Gesandten bezeichnen. Im politischen Zusammenhang sind menschliche Unterhändler gemeint; „Friedensboten“ wahrt zugleich die Breite des Ausdrucks.
- source_word: מַר
  choice: bitterlich
  rationale: Das Adjektiv wird adverbial gebraucht und verstärkt das Weinen; „bitterlich weinen“ ist eine natürliche deutsche Verbindung.
- source_word: יִבְכָּיוּן
  choice: weinen
  rationale: Das Imperfekt kann in der prophetischen Dichtung eine lebendig vergegenwärtigte Handlung ausdrücken. Das Präsens passt zum parallelen ersten Versglied.
theological_decisions:
- issue: Identität der mit אֶרְאֶלָּם bezeichneten Personen
  choice: menschliche Helden beziehungsweise tapfere Männer
  alternative: ihre Ariel-Männer; ihre Gotteslöwen; eine anderweitig auf Ariel bezogene Gruppe
  rationale: Der unmittelbare Zusammenhang handelt von Verwüstung, gescheiterten Friedensbemühungen und öffentlicher Klage. Menschliche Helden passen am besten zum parallelen Ausdruck „Friedensboten“, doch die lexikalische Unsicherheit wird nicht verschwiegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; genuine lexikalische Unsicherheiten werden in den Fußnoten ausgewiesen.
