  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: de
  text: Das anmaßende Volk wirst du nicht mehr sehen[a], ein Volk mit einer Sprache, die man nicht verstehen kann[b], und mit einer stammelnden Zunge, die unverständlich bleibt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das wilde Volk« oder »das trotzige Volk«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein Volk, tief von Lippe, vom Hören her«; gemeint ist eine Sprache, die für die Hörenden unverständlich ist.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Wendung kann auch als »spöttische Zunge« oder als Hinweis auf eine fremdartig klingende Sprache verstanden werden. Gemeint ist wahrscheinlich eine fremde Sprache, die den Hörenden unverständlich bleibt; eine tatsächliche Sprechstörung ist nicht gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: anmaßend
  rationale: Das Wort bezeichnet hier ein Volk von herausfordernder, einschüchternder Kühnheit. »Anmaßend« gibt die überhebliche und bedrohliche Färbung wieder, ohne die Bedeutung einseitig auf militärische Wildheit festzulegen.
- source_word: תִרְאֶה
  choice: wirst du nicht mehr sehen
  rationale: ראה bedeutet grundsätzlich »sehen«. Im Zusammenhang verheißt die Aussage, dass das angesprochene Volk dem fremden Bedränger künftig nicht mehr begegnen wird; »nicht mehr« gibt diesen kontextuellen Sinn im Deutschen natürlich wieder.
- source_word: עִמְקֵי שָׂפָה
  choice: mit einer Sprache, die zu schwer zu verstehen ist
  rationale: Wörtlich steht »tief von Lippe«. Das Bild bezeichnet eine für die Hörenden schwer zugängliche beziehungsweise unverständliche Sprache und wird daher idiomatisch wiedergegeben.
- source_word: מִשְּׁמוֹעַ
  choice: zu verstehen
  rationale: Wörtlich bedeutet die Form »vom Hören her«. In der Verbindung mit »tief von Lippe« geht es um die Unfähigkeit, das Gehörte zu erfassen; »verstehen« drückt diese Funktion im Deutschen klar aus.
- source_word: נִלְעַג לָשׁוֹן
  choice: mit einer stammelnden Zunge
  rationale: Die schwierige Wendung beschreibt im Parallelismus eine fremde Sprache, die für die Hörenden abgehackt oder unverständlich klingt. Die traditionelle Bildsprache wird bewahrt, ohne sie als tatsächliche Sprachstörung festzulegen.
- source_word: אֵין בִּינָה
  choice: die unverständlich bleibt
  rationale: Die Wendung bezeichnet hier fehlende Verständlichkeit für den Hörer. Die deutsche Formulierung vermeidet die missverständliche Aussage, die fremden Sprecher selbst hätten keinen Verstand.
- source_word: עַם ... עַם
  choice: Volk ... ein Volk
  rationale: Die Wiederholung des hebräischen Nomens wird als betonte appositionelle Beschreibung erhalten.
