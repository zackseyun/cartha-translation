  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Volk« und das Bild der »Zunge« bleiben erhalten; die undurchsichtige Wendung »tief von Lippe« wird im Haupttext verständlich und in der Fußnote wörtlich wiedergegeben. Die schwierige Bedeutung von נלעג wird nicht stillschweigend vereindeutigt.
