  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: de
  text: Wer gerecht lebt[a] und aufrichtig redet, wer Gewinn aus Erpressungen[b] verachtet, wer seine Hände abschüttelt, um kein Bestechungsgeld anzunehmen, wer seine Ohren verschließt, um nichts von Blutvergießen[c] zu hören, und seine Augen verschließt, um Böses nicht anzusehen —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „in gerechten Taten wandelt“; möglich ist ebenso: „nach Gerechtigkeit handelt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gewinn aus Unterdrückung“.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „Blute“, eine Ausdrucksweise für Blutvergießen oder Blutschuld.
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: gerecht lebt
  rationale: הלך bezeichnet im ethischen Zusammenhang die Lebensführung; die natürliche deutsche Wendung „gerecht lebt“ gibt das Bild sinngemäß wieder. Der ungewöhnliche hebräische Plural צְדָקוֹת lässt zugleich gerechte Taten oder gerechtes Handeln zu, was die Fußnote bewahrt.
- source_word: וְדֹבֵר מֵישָׁרִים
  choice: und aufrichtig redet
  rationale: מֵישָׁרִים bezeichnet Geradheit, Aufrichtigkeit oder Redlichkeit. „Aufrichtig redet“ ist im Deutschen natürlich und erhält die ethische Aussage.
- source_word: מֹאֵס
  choice: verachtet
  rationale: Das Partizip drückt entschiedene moralische Abscheu aus und ist stärker als ein bloßes Ablehnen.
- source_word: בְּבֶצַע מַעֲשַׁקּוֹת
  choice: Gewinn aus Erpressungen
  rationale: בֶּצַע ist Gewinn oder Profit, häufig mit negativer Färbung; מַעֲשַׁקּוֹת bezeichnet im Plural bedrückende oder erpresserische Handlungen. Die Formulierung erhält den Plural und die Herkunft des Gewinns.
- source_word: נֹעֵר כַּפָּיו
  choice: seine Hände davon abschüttelt
  rationale: Die körperliche Geste bringt entschiedene Zurückweisung und Distanzierung zum Ausdruck. „Davon“ verbindet sie im Deutschen klar mit dem folgenden Bestechungsgeld.
- source_word: מִתְּמֹךְ בַּשֹּׁחַד
  choice: Bestechungsgeld anzunehmen
  rationale: תמך bedeutet wörtlich halten oder ergreifen; im Zusammenhang bezeichnet es das Annehmen einer Bestechung. Die deutsche Wiedergabe nennt die gemeinte Handlung klar.
- source_word: אֹטֵם אָזְנוֹ
  choice: seine Ohren davor verschließt
  rationale: Der hebräische Singular ist idiomatisch; im natürlichen Deutschen wird die feste Wendung im Plural gebraucht.
- source_word: מִשְּׁמֹעַ דָּמִים
  choice: von Blutvergießen zu hören
  rationale: דָּמִים, wörtlich „Blute“, ist eine geläufige Bezeichnung für Blutvergießen und kann auch Blutschuld einschließen. Die Wiedergabe vermeidet, eine nicht ausdrücklich genannte Planung gewaltsamer Taten in den Haupttext einzutragen.
- source_word: וְעֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: und seine Augen davor verschließt, Böses anzusehen
  rationale: Die Formulierung bewahrt die aktive Verweigerung des Sehens, ohne näher festzulegen, ob das Böse beobachtet, gebilligt oder mitvollzogen würde.
theological_decisions:
- issue: Reihe substantivisch gebrauchter maskuliner Partizipien ohne ausdrückliches Relativpronomen
  choice: Wer …
  alternative: Derjenige, der … / Ein Mann, der …
  rationale: „Wer“ bildet die offene, repräsentative Aussage des Hebräischen idiomatisch ab, ohne das grammatische Maskulinum unnötig als Beschränkung auf Männer auszulegen.
- issue: Bedeutung von צְדָקוֹת
  choice: gerecht lebt
  alternative: gerechte Taten tut / nach Gerechtigkeit handelt
  rationale: Der Kontext beschreibt umfassend die ethische Lebensführung. Die Hauptfassung bleibt weit, während die Fußnote die konkrete pluralische Lesart und den möglichen Akzent auf Gerechtigkeit bewahrt.
- issue: Bedeutung von דָּמִים
  choice: Blutvergießen
  alternative: Blutschuld / Mordpläne
  rationale: „Blutvergießen“ ist die übliche konkrete Bedeutung des idiomatischen Plurals. „Blutschuld“ bleibt semantisch möglich; „Mordpläne“ wäre eine kontextuelle Spezifizierung, die der Wortlaut nicht ausdrücklich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Struktur „wer …“ bildet die hebräische Partizipienreihe klar ab. Die konkrete Körperbildsprache der Hände, Ohren und Augen bleibt erhalten; der Vers endet entsprechend seinem syntaktischen Anschluss an den Folgevers mit einem Gedankenstrich.
