source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: de
  text: Und er wird die Beständigkeit deiner Zeiten sein[a], eine Fülle von Rettung[b], Weisheit und Erkenntnis; die Furcht Jahwes ist sein Schatz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In deinen Zeiten wird Beständigkeit herrschen.“ Das hebräische Verb kann auch unpersönlich verstanden werden, ohne ein persönliches Subjekt anzunehmen.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Hebräischen „Rettungen“; der Plural kann eine Fülle von Rettung oder viele einzelne Befreiungen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Wessen Schatz gemeint ist, ist umstritten. Das hebräische Suffix lautet formal „sein“; sein Bezug kann je nach Deutung unterschiedlich bestimmt werden.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und er wird … sein
  rationale: Die maskuline Singularform kann auf Jahwe im Zusammenhang zurückweisen. Die ebenso mögliche unpersönliche Auffassung wird in Fußnote [a] bewahrt.
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: die Beständigkeit deiner Zeiten
  rationale: אֱמוּנָה bezeichnet hier Festigkeit, Verlässlichkeit oder Beständigkeit; mit „deiner Zeiten“ ist objektive Stabilität gemeint, nicht subjektiver Glaube.
- source_word: חֹסֶן
  choice: eine Fülle von
  rationale: Das Substantiv kann Reichtum, Vorrat oder Fülle bezeichnen. „Eine Fülle von“ verbindet die folgende Reihe in natürlichem Deutsch, ohne den bildhaften Sinn unnötig zu verengen.
- source_word: יְשׁוּעֹת
  choice: Rettung
  rationale: Der hebräische Plural kann intensiv oder zusammenfassend eine reiche Rettung beziehungsweise zahlreiche Rettungstaten bezeichnen. Der Singular ist im Deutschen in dieser Aufzählung idiomatisch; der Plural wird in Fußnote [b] erläutert.
- source_word: חָכְמַת וָדָעַת
  choice: Weisheit und Erkenntnis
  rationale: Die geläufigen deutschen Entsprechungen bewahren die koordinierte Aufzählung des Hebräischen.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht Jahwes
  rationale: „Furcht“ bewahrt sowohl Ehrfurcht als auch das im Ausdruck enthaltene ernste Moment. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הִיא אוֹצָרוֹ
  choice: ist sein Schatz
  rationale: Das feminine Pronomen nimmt „Furcht“ auf; der maskuline Suffixbezug in „sein Schatz“ bleibt im Kontext mehrdeutig. Alternative Bezüge werden in Fußnote [c] genannt.
theological_decisions:
- issue: Subjekt von וְהָיָה
  choice: „Er wird die Beständigkeit deiner Zeiten sein“
  alternative: „In deinen Zeiten wird Beständigkeit herrschen“
  rationale: Ein persönlicher Rückbezug auf Jahwe ist im Kontext möglich und entspricht der maskulinen Singularform; da das Hebräische auch unpersönlich verstanden werden kann, wird diese Spannung nicht aufgelöst, sondern in Fußnote [a] offengelegt.
- issue: Bezug des Suffixes in אוֹצָרוֹ
  choice: „sein Schatz“
  alternative: „dein Schatz“ beziehungsweise „ihr Schatz“
  rationale: Das maskuline Suffix bedeutet formal „sein“, doch sein Bezug ist nicht ausdrücklich genannt. Die Hauptfassung wahrt die Form, während Fußnote [c] die sachlich möglichen Zuordnungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Nominalprägung des poetischen Verses bleibt erhalten; echte syntaktische und pronominale Mehrdeutigkeiten werden durch Fußnoten kenntlich gemacht.
