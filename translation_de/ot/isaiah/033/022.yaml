id: ISA.33.22
reference: Isaiah 33:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: de
  text: Denn Jahwe[a] ist unser Richter, Jahwe ist unser Gesetzgeber[b], Jahwe ist unser König; er selbst wird uns retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat hier den Gottesnamen JHWH; traditionell wird er auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch jemanden bezeichnen, der Satzungen erlässt oder Herrschaft ausübt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Zusammenhang ein und bewahrt die verbindende Funktion natürlich im Deutschen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH als im Deutschen geläufige wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שֹׁפְטֵנוּ
  choice: unser Richter
  rationale: Bewahrt die richterliche Amtsbezeichnung prägnant und entspricht der substantivisch gebrauchten Form.
- source_word: מְחֹקְקֵנוּ
  choice: unser Gesetzgeber
  rationale: Erfasst den Gedanken dessen, der Satzungen festlegt, und wahrt die Folge rechtlicher und königlicher Hoheitstitel.
- source_word: מַלְכֵּנוּ
  choice: unser König
  rationale: Gibt den eindeutigen Königstitel direkt wieder und erhält das monarchische Bild.
- source_word: הוּא
  choice: er selbst
  rationale: Macht die ausdrückliche und hervorgehobene Nennung des Pronomens im Deutschen hörbar.
- source_word: יוֹשִׁיעֵנוּ
  choice: wird uns retten
  rationale: Gibt den Hifil-Imperfekt direkt als erwartete rettende Handlung wieder und bewahrt den umfassenden Sinn von Rettung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift wahrt den Unterschied zwischen dem Eigennamen und einem Herrschaftstitel.
- issue: Bedeutungsumfang von מְחֹקְקֵנוּ
  choice: unser Gesetzgeber
  alternative: unser Herrscher
  rationale: „Gesetzgeber“ erhält die rechtlich-königliche Dreierfolge „Richter – Gesetzgeber – König“, ohne den mittleren Ausdruck mit dem allgemeineren Herrschertitel gleichzusetzen.
- issue: Nachdruck des selbstständigen Pronomens הוּא
  choice: er selbst wird uns retten
  alternative: er wird uns retten
  rationale: „Er selbst“ bewahrt den im Hebräischen durch das ausdrücklich gesetzte Pronomen entstehenden Nachdruck, ohne eine zusätzliche Person oder Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „Jahwe ist unser …“ bildet die feierliche Struktur des Hebräischen ab; das Semikolon markiert den Übergang von den Hoheitstiteln zur rettenden Handlung.
