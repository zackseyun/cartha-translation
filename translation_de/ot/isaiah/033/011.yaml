base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
translation:
  language: de
  text: Ihr geht schwanger mit Spreu und gebärt Stroh. Euer Atem[a] ist ein Feuer, das euch verzehren wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Euer Geist ist ein Feuer, das euch verzehren wird.“ Das hebräische Wort רוּחַ kann „Atem“, „Wind“ oder „Geist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: ihr empfangt
  rationale: Das Qal Imperfekt 2. Person Plural von הרה bezeichnet das Empfangen beziehungsweise Schwangerwerden. „Ihr empfangt“ erhält das Bild von Schwangerschaft und Geburt in knapper, würdiger Sprache.
- source_word: חֲשַׁשׁ
  choice: Spreu
  rationale: Das Substantiv bezeichnet leichtes, trockenes und rasch brennbares Pflanzenmaterial. „Spreu“ passt zum prophetischen Gerichtsbild und bildet mit „Stroh“ einen natürlichen Parallelismus.
- source_word: תֵּלְדוּ
  choice: ihr gebiert
  rationale: Das Qal Imperfekt 2. Person Plural von ילד führt das Schwangerschaftsbild ausdrücklich bis zur Geburt weiter.
- source_word: קַשׁ
  choice: Stroh
  rationale: קַשׁ bezeichnet Stroh oder dürre Pflanzenreste. „Stroh“ ist im modernen Deutschen geläufig und bewahrt sowohl die Wertlosigkeit als auch die Brennbarkeit des Bildes.
- source_word: רוּחֲכֶם
  choice: euer Atem
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. „Atem“ bewahrt hier das konkrete Bild eines aus den Angesprochenen selbst hervorgehenden Mittels ihrer Vernichtung, ohne die mögliche Bedeutung „Geist“ auszuschließen.
- source_word: אֵשׁ
  choice: ein Feuer
  rationale: Die Wiedergabe ist direkt und bildet mit „euer Atem ist“ einen natürlichen deutschen Nominalsatz.
- source_word: תֹּאכַלְכֶם
  choice: das euch verzehren wird
  rationale: אכל bedeutet essen oder verschlingen; bei Feuer als Subjekt gibt „verzehren“ die zerstörerische Kraft idiomatisch und bildnah wieder.
theological_decisions:
- issue: Bedeutung von רוּחֲכֶם im prophetischen Gerichtsbild
  choice: euer Atem
  alternative: euer Geist; euer Wind
  rationale: „Atem“ erhält die anschauliche Vorstellung, dass das von den Menschen selbst Ausgehende zu ihrem Verderben wird. Die Fußnote bewahrt die echte lexikalische und theologische Mehrdeutigkeit von רוּחַ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen parallelen Aussagen und das durchgehende Schwangerschafts- und Verbrennungsbild bleiben erhalten; die Mehrdeutigkeit von רוּחַ wird nicht stillschweigend aufgelöst.
