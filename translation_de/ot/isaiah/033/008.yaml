  text: נָשַׁ֣מּוּ מְסִלּ֔וֹת שָׁבַ֖ת עֹבֵ֣ר אֹ֑רַח הֵפֵ֤ר בְּרִית֙ מָאַ֣ס עָרִ֔ים לֹ֥א חָשַׁ֖ב אֱנֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: de
  text: Die Fernstraßen liegen verödet; kein Reisender zieht mehr auf ihnen entlang. Er hat den Bund gebrochen, die Städte verachtet[a] und keinen Menschen geachtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige alte Übersetzungen setzen hier eine abweichende Lesart voraus: „Zeugen“ statt „Städte“. Der masoretische Text lautet „Städte“.'
    reason: textual_variant
  - marker: b
    text: 'Hebräisch: „Mensch“ (ʾenōsch), ein singularischer Ausdruck für einen Menschen beziehungsweise Sterblichen; hier ist er allgemein gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ מְסִלּוֹת
  choice: Die Fernstraßen sind verödet
  rationale: נָשַׁמּוּ bezeichnet den eingetretenen Zustand der Verödung; מְסִלּוֹת meint ausgebaute Haupt- oder Fernstraßen. Die Formulierung gibt Ergebniszustand und öffentlichen Reiseverkehr natürlich wieder.
- source_word: שָׁבַת עֹבֵר אֹרַח
  choice: niemand zieht mehr des Weges
  rationale: Die Wendung beschreibt, dass der Durchreisende aufgehört hat, den Weg zu benutzen. Die deutsche Negativformulierung gibt die eingestellte Reisetätigkeit idiomatisch wieder, ohne einen bestimmten Reisenden vorauszusetzen.
- source_word: הֵפֵר בְּרִית
  choice: Er hat den Bund gebrochen
  rationale: הפר mit בְּרִית bedeutet einen Bund aufheben, verletzen oder brechen. „Bund“ bewahrt den zentralen biblischen Begriff und lässt zugleich einen politischen Vertrag als mögliche Bedeutung offen.
- source_word: מָאַס עָרִים
  choice: die Städte verachtet
  rationale: Der masoretische Text liest עָרִים, „Städte“. מָאַס wird passend mit „verachtet“ wiedergegeben; die abweichende antike Überlieferung wird in einer Fußnote genannt.
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: keinen Menschen geachtet
  rationale: Die Wendung besagt, dass kein sterblicher Mensch für ihn Gewicht oder Ansehen besitzt. „Mensch“ wahrt den generischen Sinn des singularischen אֱנוֹשׁ und klingt im heutigen Deutsch natürlich.
theological_decisions:
- issue: Bezug der Verben in der dritten Person Singular
  choice: Das unbestimmte Pronomen „Er“ bleibt stehen.
  alternative: Ausdrückliche Identifikation als Feind, Verräter oder Vertragsbrecher.
  rationale: Der hebräische Vers nennt das Subjekt nicht ausdrücklich. Eine nähere Bestimmung aus dem Kontext würde eine im Vers selbst vorhandene Offenheit beseitigen.
- issue: Bedeutungsbereich von בְּרִית
  choice: Bund
  alternative: Vertrag
  rationale: „Bund“ bewahrt die theologische und politische Bedeutungsbreite des hebräischen Wortes, ohne vorschnell festzulegen, welche Art von Vereinbarung gemeint ist.
- issue: Generischer Bezug von אֱנוֹשׁ
  choice: Mensch
  alternative: jemanden; die Menschen; einen Mann
  rationale: אֱנוֹשׁ steht singularisch und bezeichnet hier einen sterblichen Menschen in generischem Sinn. „Mensch“ hält diese Form und Bedeutung zusammen, ohne den Bezug unnötig auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fernstraßen“ verdeutlicht größere Verkehrswege; „des Weges ziehen“ ist leicht gehoben, aber allgemein verständlich und für den poetisch-prophetischen Kontext angemessen. Alle im Text gesetzten Fußnotenmarker sind erläutert.
