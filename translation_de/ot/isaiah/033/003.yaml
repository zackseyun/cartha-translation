review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Wiedergaben von עַמִּים, גּוֹיִם, נָדְדוּ und נָפְצוּ sind sachgerecht. „Vor dem Lärm“ verschiebt מִקּוֹל jedoch primär in eine zeitliche bzw. furchtauslösende Bedeutung („vor“), während der hebräische Ausdruck den Anlass beim/aufgrund des hörbaren Getöses bezeichnet. „Beim Getöse“ gibt dies unmittelbar und idiomatisch wieder. Die dynamische Wiedergabe des zweiten Ausdrucks als „wenn du dich erhebst“ ist kontextuell vertretbar, muss die nominale Alternative „deiner Erhabenheit/Erhöhung“ aber deutlich in der Anmerkung erhalten.
  naturalness: „Beim Getöse flohen die Völker“ ist modernes, würdiges Standarddeutsch und vermeidet die etwas doppelte Verbindung „Lärm des Getümmels“. „Wenn du dich erhebst“ klingt natürlicher als „als du dich erhobst“ und wahrt die poetisch-prophetische Parallelität.
  terminology: „Völker“ und „Nationen“ bewahren angemessen die Variation zwischen עַמִּים und גּוֹיִם. „Getöse“ trifft הָמוֹן im Kontext besser als die mehrdeutige Verbindung „Lärm des Getümmels“. Die Fußnote zu מֵרוֹמְמֻתֶךָ soll neben dem aktiven Sich-Erheben auch die Bedeutungen Erhabenheit bzw. Erhöhung nennen, ohne den Referenten dogmatisch festzulegen.
