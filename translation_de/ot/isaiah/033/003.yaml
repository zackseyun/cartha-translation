revisions:
- from: Vor dem Lärm des Getümmels[a] flohen die Völker; als du dich erhobst[b], wurden die Nationen zerstreut.
  to: Beim Getöse[a] flohen die Völker; wenn du dich erhebst[b], werden die Nationen zerstreut.
  rationale: Die Revision ersetzt die in dieser Stelle semantisch weniger genaue Präposition „vor“ durch „beim“ und strafft die Wiedergabe von הָמוֹן zu „Getöse“. Der zweite Halbvers behält die plausible kontextuelle Deutung eines göttlichen Sich-Erhebens bei; die Fußnote bewahrt die grammatisch und semantisch mögliche Lesart von Erhabenheit beziehungsweise Erhöhung. Bedeutung, Parallelismus und die Unterscheidung zwischen Völkern und Nationen bleiben erhalten.
