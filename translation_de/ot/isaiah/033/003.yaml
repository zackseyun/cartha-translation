  text: מִ/קּ֣וֹל הָמ֔וֹן נָדְד֖וּ עַמִּ֑ים מֵ/ר֣וֹמְמֻתֶ֔/ךָ נָפְצ֖וּ גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: de
  text: Beim Getöse[a] flohen die Völker; wenn du dich erhebst[b], werden die Nationen zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beim Lärm des Aufruhrs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei deiner Erhabenheit“ oder „bei deiner Erhöhung“. Das Hebräische kann Gottes Sich-Erheben zum Handeln oder seine erhabene Majestät betonen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל הָמוֹן
  choice: Vor dem Lärm des Getümmels
  rationale: מִן mit קוֹל bezeichnet hier den auslösenden Anlass oder Grund. „Vor dem Lärm“ ist idiomatisches Deutsch; הָמוֹן bezeichnet in diesem Zusammenhang eher lärmendes Getümmel als eine bloße Menschenmenge.
- source_word: נָדְדוּ
  choice: flohen
  rationale: Das Verb kann ein Umherziehen oder Sich-entfernen bezeichnen, meint im militärischen Gerichtskontext jedoch wahrscheinlich die Flucht.
- source_word: עַמִּים
  choice: die Völker
  rationale: „Völker“ gibt עַמִּים natürlich wieder und bewahrt soweit möglich die Variation gegenüber גּוֹיִם im zweiten Halbvers.
- source_word: מֵרוֹמְמֻתֶךָ
  choice: als du dich erhobst
  rationale: Die Form aus רום kann Erhebung, Sich-Erheben oder Hoheit ausdrücken. Die gewählte Formulierung passt zur Vorstellung, dass Gott zum Handeln aufsteht, ohne die alternative Bedeutung „bei deiner Erhöhung“ auszuschließen.
- source_word: נָפְצוּ
  choice: wurden zerstreut
  rationale: Das Verb kann Zerstreuen oder Zerschmettern ausdrücken. Bei Nationen als Subjekt ist „wurden zerstreut“ hier die wahrscheinlichste kontextuelle Bedeutung.
- source_word: גּוֹיִם
  choice: die Nationen
  rationale: „Nationen“ ist eine passende Wiedergabe und vermeidet die nicht erforderliche spätere religiöse Konnotation von „Heiden“.
theological_decisions:
- issue: Bezug der Anrede in מֵרוֹמְמֻתֶךָ
  choice: Die zweite Person wird als Anrede an Gott verstanden und beschreibt sein Sich-Erheben zum Handeln.
  alternative: Die Anrede könnte sich auf das personifizierte Zion beziehungsweise Jerusalem beziehen; zudem kann der Ausdruck Gottes Erhöhung oder erhabene Majestät bezeichnen.
  rationale: Der unmittelbare Zusammenhang spricht von der Anrufung und dem Eingreifen des HERRN gegen feindliche Nationen. Die Übersetzung lässt die Anrede stehen und erklärt die semantische Alternative in einer Fußnote, statt sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des hebräischen Verses bleibt erhalten. „Völker“ und „Nationen“ bilden die lexikalische Variation von עַמִּים und גּוֹיִם ab; die Mehrdeutigkeit von רום wird im Haupttext kontextgemäß und in der Fußnote ausdrücklich wiedergegeben.
