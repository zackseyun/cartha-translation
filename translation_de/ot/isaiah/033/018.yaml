translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Fragen und das konkrete Bild der Türme bleiben erhalten. Der Wechsel zum Präteritum in den drei Fragen gibt im Deutschen den Rückblick auf die überwundene Bedrohung natürlich wieder, obwohl die hebräischen Partizipien für sich genommen keine Zeitstufe festlegen.
