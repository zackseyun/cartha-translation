base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: de
  text: Dein Herz wird über das Grauen nachsinnen:[a] »Wo ist der Schreiber? Wo ist der, der abwägt? Wo ist der, der die Türme zählt?«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird über das Grauen grübeln« beziehungsweise »wird über das Grauen murmeln«. Das hebräische Verb kann inneres Nachsinnen oder leises Äußern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Schreiber«, demjenigen, der abwägt, und demjenigen, der die Türme zählt, sind wahrscheinlich fremde Amtsträger gemeint, die mit Erfassung oder Abwägung von Abgaben beziehungsweise mit Berechnungen im Zusammenhang einer Belagerung befasst waren.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: לֵב bezeichnet den inneren Menschen einschließlich Denken und Erinnern. »Herz« bewahrt das hebräische Menschenbild; das Verb macht die gedankliche Tätigkeit deutlich.
- source_word: יֶהְגֶּה
  choice: wird … nachsinnen
  rationale: הגה kann leises Äußern, Sinnen oder Nachdenken bezeichnen. Im Zusammenhang mit der rückblickenden Erinnerung an die Bedrohung passt »nachsinnen« natürlich, ohne die mögliche Bedeutungsbreite ganz aufzulösen.
- source_word: אֵימָה
  choice: das Grauen
  rationale: Das Substantiv bezeichnet heftigen Schrecken oder Entsetzen. »Grauen« gibt die Intensität in würdigem, heutigem Deutsch wieder.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die dreimalige Wiederholung und die jeweils singularische Frageform werden bewahrt; sie prägen den rhetorischen Rückblick.
- source_word: סֹפֵר
  choice: der Schreiber
  rationale: Das Partizip kann einen Schreibenden, Registrierenden oder Zählenden bezeichnen. In der ersten Nennung ist »Schreiber« eine sachlich offene Amtsbezeichnung.
- source_word: שֹׁקֵל
  choice: der, der abwog
  rationale: Das Partizip bedeutet wörtlich »der Wägende«. Die verbale Wiedergabe bleibt transparent und legt nicht fest, ob Geld, Tribut oder etwas anderes gewogen wurde. Das Präteritum lässt die Amtsträger als Teil des nun vergangenen Schreckens erscheinen.
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: der, der die Türme zählte
  rationale: Bei Türmen bedeutet ספר hier am natürlichsten »zählen«. Die konkrete Formulierung vermeidet eine nicht ausdrücklich genannte Deutung als Vermessung oder militärische Begutachtung.
- source_word: הַמִּגְדָּלִים
  choice: die Türme
  rationale: Die konkrete Bedeutung wird bewahrt, ohne sie interpretierend zu »Wachtürmen« oder »Befestigungen« zu erweitern.
