  text: וְ/נָתַן֩ מְטַ֨ר זַרְעֲ/ךָ֜ אֲשֶׁר תִּזְרַ֣ע אֶת הָ/אֲדָמָ֗ה וְ/לֶ֨חֶם֙ תְּבוּאַ֣ת הָֽ/אֲדָמָ֔ה וְ/הָיָ֥ה דָשֵׁ֖ן וְ/שָׁמֵ֑ן יִרְעֶ֥ה מִקְנֶ֛י/ךָ בַּ/יּ֥וֹם הַ/ה֖וּא כַּ֥ר נִרְחָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: de
  text: Dann wird er deiner Saat, mit der du den Acker besäst, Regen geben und Brot aus dem Ertrag des Ackers[a]. Das Brot wird nahrhaft und reichlich sein[b]. An jenem Tag wird dein Vieh auf einer weiten Weide grasen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brot, der Ertrag des Ackers“. Die hebräische Wortverbindung kann auch als Apposition verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „fett und reich“; ein Ausdruck für Überfluss und Fruchtbarkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Dann wird er … geben
  rationale: Das Qal-Perfekt mit ו wird im prophetischen Zusammenhang folgerichtig zukünftig wiedergegeben. Das Subjekt bleibt wie im Hebräischen unausgesprochen und wird durch „er“ aufgenommen; der Kontext bezeichnet den HERRN als Handelnden.
- source_word: מְטַר זַרְעֲךָ
  choice: deiner Saat … Regen
  rationale: מְטַר bezeichnet Regen, זֶרַע hier das zur Aussaat bestimmte Saatgut. Die deutsche Dativkonstruktion gibt die Zuwendung des Regens idiomatisch wieder.
- source_word: אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  choice: mit der du den Acker besäst
  rationale: Das Relativpronomen bezieht sich auf die Saat; der hebräische Akkusativ bezeichnet die bearbeitete Fläche. „Acker“ passt im landwirtschaftlichen Zusammenhang genauer als das allgemeinere „Erdboden“.
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: Brot aus dem Ertrag des Ackers
  rationale: לֶחֶם wird konkret als „Brot“ bewahrt. Die Verbindung mit תְּבוּאַת הָאֲדָמָה wird als Herkunftsbeziehung verständlich wiedergegeben, während eine mögliche appositionelle Lesart in der Fußnote erhalten bleibt.
- source_word: וְהָיָה דָשֵׁן וְשָׁמֵן
  choice: es wird nahrhaft und reichlich sein
  rationale: Die wörtlichen Bilder „fett“ und „fett/reich“ bezeichnen bei einem landwirtschaftlichen Erzeugnis gehaltvolle Qualität und Fülle. Die Formulierung überträgt das Idiom natürlich, ohne seine Bildlichkeit in der Fußnote zu verschweigen.
- source_word: יִרְעֶה מִקְנֶיךָ
  choice: dein Vieh … grasen
  rationale: מִקְנֶה ist ein Sammelbegriff für Nutzvieh; רעה bezeichnet hier dessen Weiden beziehungsweise Grasen.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird in einer geläufigen, würdigen deutschen Form wiedergegeben.
- source_word: כַּר נִרְחָב
  choice: auf einer weiten Weide
  rationale: כַּר bezeichnet Weide- oder Wiesenland, נִרְחָב dessen räumliche Weite. Die Präposition „auf“ wird aus der deutschen Syntax ergänzt.
theological_decisions:
- issue: Unausgesprochenes Subjekt des einleitenden Verbs
  choice: „er“ als Verweis auf den HERRN im unmittelbaren Kontext
  alternative: 'Den Gottesnamen ausdrücklich wiederholen: „Dann wird der HERR … geben“'
  rationale: Der hebräische Vers nennt das Subjekt nicht erneut. Das Pronomen bewahrt diesen Textfluss und vermeidet eine ausdrückliche Ergänzung, ohne den im Kontext gegebenen göttlichen Handelnden umzudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Landwirtschaftliche Begriffe bleiben konkret; hebräische Idiome werden im Haupttext natürlich übertragen und in den Fußnoten transparent gemacht.
