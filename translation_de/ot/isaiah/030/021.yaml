source:
  edition: WLC
  text: וְ/אָזְנֶ֨י/ךָ֙ תִּשְׁמַ֣עְנָה דָבָ֔ר מֵֽ/אַחֲרֶ֖י/ךָ לֵ/אמֹ֑ר זֶ֤ה הַ/דֶּ֨רֶךְ֙ לְכ֣וּ ב֔/וֹ כִּ֥י תַאֲמִ֖ינוּ וְ/כִ֥י תַשְׂמְאִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: de
  text: 'Und deine Ohren werden ein Wort von hinter dir her hören, das sagt: »Dies ist der Weg; geht auf ihm!«, wenn ihr nach rechts oder nach links abbiegt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wenn ihr nach rechts und wenn ihr nach links geht«. Die hebräischen Verbformen im letzten Satzteil, besonders die erste, sind schwierig; im Kontext können sie eine Wendung in die eine oder die andere Richtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנֶיךָ
  choice: deine Ohren
  rationale: Der hebräische Plural mit Suffix der 2. Person Singular wird konkret wiedergegeben und bewahrt das körperliche Bild des Hörens.
- source_word: תִּשְׁמַעְנָה
  choice: werden … hören
  rationale: Das feminine Verb im Plural stimmt mit »Ohren« überein; die deutsche Futurform gibt die prophetische Zusage natürlich wieder.
- source_word: דָבָר
  choice: ein Wort
  rationale: Die direkte Wiedergabe lässt offen, ob ein einzelner Ausspruch oder eine Botschaft gemeint ist.
- source_word: מֵאַחֲרֶיךָ
  choice: hinter dir
  rationale: Die Form bezeichnet etwas, das vom Rücken beziehungsweise von hinten her vernommen wird; die knappe deutsche Wendung erhält dieses anschauliche Bild.
- source_word: זֶה הַדֶּרֶךְ
  choice: Dies ist der Weg
  rationale: »Weg« wahrt sowohl die räumliche als auch die übertragene Bedeutung von דֶּרֶךְ.
- source_word: לְכוּ בוֹ
  choice: geht auf ihm
  rationale: Der Pluralimperativ und der Bezug auf den Weg bleiben erhalten. Im Deutschen ist »auf einem Weg gehen« natürlicher als »in einem Weg gehen«.
- source_word: כִּי תַאֲמִינוּ וְכִי תַשְׂמְאִילוּ
  choice: wenn ihr nach rechts oder nach links abbiegt
  rationale: Die parallelen Ausdrücke bezeichnen im Kontext Richtungsänderungen. »Oder« gibt die zwei einander ausschließenden Möglichkeiten im Deutschen idiomatisch wieder; die Schwierigkeit der ersten hebräischen Verbform wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Ursprung und Art des leitenden Wortes
  choice: Ein leitendes Wort, ohne den Sprecher oder die Vermittlungsweise näher zu bestimmen
  alternative: Die Stimme eines Lehrers, prophetische Weisung oder eine innere Eingebung
  rationale: Der Vers beschreibt verlässliche Führung, benennt in diesem Satz aber weder den Sprecher noch den genauen Vermittlungsweg.
- issue: Wechsel der Anredezahl
  choice: Den Wechsel vom Singular »dir« zum Plural »geht/ihr« bewahren
  alternative: Die Anrede im Deutschen vollständig vereinheitlichen
  rationale: Der hebräische Text wechselt tatsächlich von der zweiten Person Singular zum Plural. Eine Vereinheitlichung würde diese offene Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschaulichen Begriffe »Ohren«, »Wort« und »Weg« bleiben erhalten. Der im Hebräischen auffällige Wechsel von der singularischen zur pluralischen Anrede wird nicht geglättet.
