base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: de
  text: Und das Licht des Mondes wird wie das Licht der Sonne sein, und das Licht der Sonne wird siebenfach sein, wie das Licht von sieben Tagen, an dem Tag, an dem Jahwe den Bruch seines Volkes verbindet und die Verletzung durch seinen Schlag heilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zerschmetterung durch seinen Schlag“ bzw. „die Quetschung durch seinen Schlag“. Das Hebräische lässt bei der Verletzungsmetaphorik Nuancen zu; gemeint ist die Verletzung, die mit Jahwes Schlag verbunden ist und die er heilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird … sein
  rationale: Die Form leitet den verheißenen zukünftigen Zustand ein; die deutsche Futurform gibt dies natürlich wieder.
- source_word: אוֹר
  choice: Licht
  rationale: Das wiederholte Substantiv bezeichnet hier das sichtbare Licht von Mond und Sonne; die Wiederholung bleibt zur Wahrung der poetischen Struktur erhalten.
- source_word: הַלְּבָנָה
  choice: der Mond
  rationale: Dies ist die übliche poetische Bezeichnung für den Mond, auch wenn das Wort etymologisch mit Weißsein zusammenhängt.
- source_word: הַחַמָּה
  choice: die Sonne
  rationale: Im Zusammenhang ist der Himmelskörper gemeint, nicht abstrakt die Hitze.
- source_word: שִׁבְעָתַיִם
  choice: siebenfach
  rationale: Die Form bezeichnet eine siebenfache Steigerung; „siebenfach“ ist knapp, verständlich und dem prophetischen Stil angemessen.
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: wie das Licht von sieben Tagen
  rationale: Die bildhafte und möglicherweise bewusst offene Formulierung bleibt erhalten, ohne ausdrücklich eine Zusammenrechnung des Lichts einzutragen.
- source_word: חֲבֹשׁ
  choice: verbindet
  rationale: Das Verb beschreibt das Verbinden einer Verletzung und trägt zugleich das Bild göttlicher Wiederherstellung.
- source_word: שֶׁבֶר
  choice: Bruch
  rationale: Das Wort kann einen Bruch, eine Zertrümmerung oder einen Zusammenbruch bezeichnen. „Bruch“ bewahrt das körperliche Heilungsbild und dessen übertragene Bedeutung.
- source_word: מַחַץ מַכָּתוֹ
  choice: die Wunde seines Schlages
  rationale: Die knappe Genitivfügung bewahrt sowohl das Verletzungsbild als auch die Aussage, dass Jahwe den mit seinem Schlag verbundenen Schaden selbst heilt, ohne die hebräische Beziehung unnötig auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen im modernen Deutschen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in מַכָּתוֹ
  choice: seines Schlages
  alternative: seiner Wunde
  rationale: 'Im unmittelbaren Zusammenhang ist Jahwe das handelnde Subjekt: Er verbindet und heilt den Schaden, der mit seinem Schlag verbunden ist. Die knappe Formulierung erhält die Spannung zwischen göttlichem Gericht und göttlicher Heilung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Wiederholung. Die medizinische Metaphorik von Bruch, Verbinden, Schlag und Heilen bleibt sichtbar; die ungewöhnliche Wendung „die Wunde seines Schlages“ erhält die theologische Spannung des hebräischen Textes.
