  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: de
  text: Denn vor der Stimme Jahwes wird Assyrien zerschmettert werden[a]; mit dem Stab wird er zuschlagen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in Schrecken geraten“ oder „wird zusammenbrechen“; das hebräische Verb kann Entsetzen, Zusammenbruch oder Zerschmetterung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt das Subjekt von „wird zuschlagen“ nicht erneut; am natürlichsten ist damit Jahwe aus dem vorangehenden Satzteil gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt eine Begründung oder Erläuterung zum vorausgehenden Zusammenhang ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: מִקּוֹל
  choice: vor der Stimme
  rationale: מִן bezeichnet hier den Anlass oder die Ursache. „Vor der Stimme“ bewahrt das eindrückliche Bild und ist im Deutschen bei einer Reaktion auf machtvolles Reden idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יֵחַת
  choice: wird zerschmettert werden
  rationale: Das Nifal von חתת kann Erschrecken, Zusammenbrechen oder Zerschmettertwerden bezeichnen. Im Gerichtszusammenhang bringt „zerschmettert werden“ den umfassenden Zusammenbruch Assyriens zum Ausdruck, ohne die lexikalischen Alternativen zu verschweigen.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Gemeint ist hier das assyrische Reich; dafür ist „Assyrien“ die übliche deutsche Bezeichnung.
- source_word: בַּשֵּׁבֶט
  choice: mit dem Stock
  rationale: שֵׁבֶט kann Stock, Stab oder Zepter bedeuten. Als Werkzeug des Schlagens passt „Stock“ hier am unmittelbarsten.
- source_word: יַכֶּה
  choice: wird er zuschlagen
  rationale: Das Hifil von נכה bezeichnet das Schlagen. „Zuschlagen“ gibt die Handlung wieder und bewahrt zugleich, dass im Hebräischen kein ausdrückliches Objekt genannt wird.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יַכֶּה
  choice: Das Pronomen „er“ bezieht sich am natürlichsten auf Jahwe.
  alternative: Die knappe hebräische Formulierung kann anders syntaktisch aufgefasst werden, etwa unpersönlicher oder mit einer ergänzten passiven Vorstellung.
  rationale: Jahwe ist der nächstliegende männliche Singularbezug im vorangehenden Satzteil und handelt im Kontext als Richter. Da das Hebräische das Subjekt jedoch nicht wiederholt, wird diese Entscheidung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und bildkräftig; die beiden echten Mehrdeutigkeiten des hebräischen Textes werden durch Fußnoten sichtbar gehalten.
