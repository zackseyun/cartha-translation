source:
  edition: WLC
  text: וּ֠/שְׁבָרָ/הּ כְּ/שֵׁ֨בֶר נֵ֧בֶל יוֹצְרִ֛ים כָּת֖וּת לֹ֣א יַחְמֹ֑ל וְ/לֹֽא יִמָּצֵ֤א בִ/מְכִתָּת/וֹ֙ חֶ֔רֶשׂ לַ/חְתּ֥וֹת אֵשׁ֙ מִ/יָּק֔וּד וְ/לַ/חְשֹׂ֥ף מַ֖יִם מִ/גֶּֽבֶא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: de
  text: Und sein Zerbrechen ist wie das Zerschlagen eines Töpferkrugs, der ohne Erbarmen zerschmettert wird, sodass sich unter seinen Bruchstücken keine Scherbe findet, mit der man Feuer aus der Feuerstelle holen[a] oder Wasser aus einer Zisterne[b] schöpfen könnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glut/Kohlen aus der Feuerstelle holen“. Wörtlich heißt es im Hebräischen: „Feuer aus dem Brennort nehmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus einem Wasserbecken“. Das hebräische Wort kann allgemein eine Ansammlung von Wasser bezeichnen; hier passt „Zisterne“ gut zum dargestellten Gebrauch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: Und sein Zerbrechen
  rationale: Die Form wird als substantivischer Ausdruck mit Suffix der 3. Person Singular feminin verstanden. Die etwas markante Wiederholung mit שֵׁבֶר bildet die hebräische Rhetorik ab.
- source_word: כְּשֵׁבֶר נֵבֶל יוֹצְרִים
  choice: dem Zerbrechen eines Töpferkrugs gleichen
  rationale: נֵבֶל bezeichnet hier ein irdenes Gefäß; „Töpferkrug“ ist konkret, verständlich und passt zur anschließenden Scherbe.
- source_word: כָּתוּת לֹא יַחְמֹל
  choice: der erbarmungslos zerschmettert wird
  rationale: „Zerschmettert“ gibt die vollständige gewaltsame Zerstörung wieder; „erbarmungslos“ bewahrt den Gedanken von לֹא יַחְמֹל, ohne ein ungenanntes handelndes Subjekt einzuführen.
- source_word: בִמְכִתָּתוֹ חֶרֶשׂ
  choice: unter seinen Trümmern keine Scherbe
  rationale: „Scherbe“ bezeichnet den konkreten Keramikrest; „unter seinen Trümmern“ gibt den resultativen Sinn der Zerschlagung natürlich wieder.
- source_word: לַחְתּוֹת אֵשׁ מִיָּקוּד
  choice: Feuer aus der Feuerstelle holen
  rationale: Die Wiedergabe bleibt nahe am wörtlichen „Feuer nehmen“ und lässt offen, ob konkret Glut oder Kohlen gemeint sind.
- source_word: וְלַחְשֹׂף מַיִם מִגֶּבֶא
  choice: Wasser aus einer Zisterne schöpfen
  rationale: Das Verb bezeichnet hier das Aufnehmen von Wasser; „Zisterne“ passt zum Bild eines gesammelten Wasservorrats, während „Wasserbecken“ ebenfalls möglich bleibt.
