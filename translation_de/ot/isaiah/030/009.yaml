id: ISA.30.9
reference: Isaiah 30:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י עַ֤ם מְרִי֙ ה֔וּא בָּנִ֖ים כֶּחָשִׁ֑ים בָּנִ֕ים לֹֽא אָב֥וּ שְׁמ֖וֹעַ תּוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/009.yaml
  text: For they are a rebellious people[a], lying children, children unwilling to hear the law of Yahweh[b],
translation:
  language: de
  text: Denn sie sind ein rebellisches Volk, verlogene Kinder[a], Kinder, die nicht auf die Weisung Jahwes[b] hören wollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: betrügerische Kinder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: auf das Gesetz Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: עַם מְרִי
  choice: ein rebellisches Volk
  rationale: Die Substantivverbindung bezeichnet ein durch Auflehnung gekennzeichnetes Volk. Die adjektivische Wiedergabe ist im Deutschen klar und bewahrt die scharfe prophetische Anklage.
- source_word: בָּנִים
  choice: Kinder
  rationale: Der Ausdruck bezeichnet das Volk bildhaft als Nachkommen und ist hier nicht auf männliche Personen beschränkt.
- source_word: כֶּחָשִׁים
  choice: verlogene
  rationale: Das Wort kennzeichnet die Kinder als von Lüge oder Täuschung geprägt. „Verlogen“ ist knapp, idiomatisch und ebenso anklagend wie der hebräische Ausdruck.
- source_word: לֹא אָבוּ שְׁמוֹעַ
  choice: die nicht … hören wollen
  rationale: Die Verbindung betont nicht bloß fehlendes Hören, sondern mangelnde Bereitschaft. „Nicht hören wollen“ bewahrt sowohl den Hörbegriff als auch die willentliche Weigerung.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier Jahwes verbindliche Unterweisung. „Weisung“ lässt den weiteren Bedeutungsumfang gegenüber dem enger klingenden deutschen „Gesetz“ bestehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ bewahrt den umfassenden Sinn göttlicher Unterweisung, ohne ihre verbindliche, bundesbezogene Autorität abzuschwächen. „Gesetz“ ist im Kontext ebenfalls möglich und wird in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst, nicht einen Titel. Seine Wiedergabe als „Jahwe“ wahrt diesen Unterschied.
- issue: Hören und Gehorchen in שְׁמוֹעַ
  choice: hören
  alternative: gehorchen
  rationale: Im Zusammenhang ist Gehorsam mitgemeint, doch der unmittelbare Wortlaut bezeichnet das Hören. Die Übersetzung löst diese Bedeutungsnähe nicht einseitig zugunsten von „gehorchen“ auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Wiederholung von „Kinder“ und die direkte Anklage des Ausgangstextes bleiben erhalten.
