  naturalness: Das Deutsch ist idiomatisches modernes Standarddeutsch und bewahrt durch die Wiederholung von „Kinder“ den knappen, anklagenden Parallelismus des Ausgangstextes. „… hören wollen“ ist natürlich und stellt die in לֹא אָבוּ enthaltene Verweigerung klar heraus.
  terminology: „Jahwe“ ist als deutsche Wiedergabe des Tetragramms konsistent. „Rebellisches Volk“, „verlogene Kinder“ und „Weisung“ sind registergerecht und semantisch tragfähig. Die Fußnoten sind korrekt verankert und bieten echte lexikalische Alternativen.
