id: ISA.30.29
reference: Isaiah 30:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/שִּׁיר֙ יִֽהְיֶ֣ה לָ/כֶ֔ם כְּ/לֵ֖יל הִתְקַדֶּשׁ חָ֑ג וְ/שִׂמְחַ֣ת לֵבָ֗ב כַּֽ/הוֹלֵךְ֙ בֶּֽ/חָלִ֔יל לָ/ב֥וֹא בְ/הַר יְהוָ֖ה אֶל צ֥וּר יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: de
  text: Dann werdet ihr singen wie in der Nacht, wenn ein Fest geheiligt wird,[a] und euch von Herzen freuen wie jemand, der unter Flötenspiel[b] zum Berg Jahwes[c] zieht, zum Felsen Israels.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wie in der Nacht, wenn man sich für ein Fest heiligt«. Gemeint ist wahrscheinlich die Nacht eines heiligen Festes, vermutlich im Zusammenhang mit einer Wallfahrt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit einer Flöte« beziehungsweise »zu Pfeifenklang«. Das hebräische Wort bezeichnet ein Blasinstrument, das bei festlichen Umzügen gespielt wurde.'
    reason: lexical_alternative
  - marker: c
    text: Traditionell wird der Gottesname JHWH mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: d
    text: 'Auch möglich: »zu Israels Fels«. »Fels« ist hier eine Bezeichnung für Gott und hebt seine Stärke und Verlässlichkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: Dann werdet ihr singen
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich etwa »Das Lied wird für euch sein«. Die verbale Wiedergabe ist im heutigen Deutsch natürlich und bewahrt die Aussage, dass das Volk singen wird; »Dann« nimmt den zukünftigen Zusammenhang auf.
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: wie in der Nacht, wenn ein Fest geheiligt wird
  rationale: כְּ markiert den Vergleich, und die Wendung bezeichnet eine für ein heiliges Fest ausgesonderte Nacht. Die passive Formulierung wahrt die grammatische und sachliche Offenheit des knappen Hebräisch.
- source_word: וְשִׂמְחַת לֵבָב
  choice: und euch von Herzen freuen
  rationale: Die deutsche Verbalform gibt die zur ersten Aussage parallele nominale Wendung »Freude des Herzens« idiomatisch wieder, ohne den inneren Charakter der Freude zu verlieren.
- source_word: כַּהוֹלֵךְ
  choice: wie jemand, der … zieht
  rationale: Das Partizip bezeichnet allgemein eine gehende Person. »zieht« passt im Deutschen natürlich zu einer festlichen Bewegung auf ein Heiligtum zu, ohne ausdrücklich »Pilger« in den Text einzutragen.
- source_word: בֶּחָלִיל
  choice: unter Flötenspiel
  rationale: חָלִיל bezeichnet eine Flöte beziehungsweise Pfeife. Die Präposition lässt instrumentale Begleitung erkennen; »unter Flötenspiel« gibt die festliche Prozessionsmusik natürlich wieder.
- source_word: לָבוֹא בְהַר יְהוָה
  choice: zum Berg Jahwes zieht
  rationale: Beim Bewegungsverb bezeichnet בְ das Ziel. Die zusammengezogene deutsche Form wahrt Richtung und Pilgerbewegung, ohne das schwerfällige »geht, um zu kommen« nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: zum Felsen Israels
  rationale: צוּר ist hier ein Gottesprädikat, das Festigkeit, Stärke und Schutz ausdrückt. Die wörtliche Metapher bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. »Jahwe« macht diesen Namen im deutschen Haupttext sichtbar, während die traditionelle Ersatzlesung in der Fußnote genannt wird.
- issue: Kultische Bedeutung von הִתְקַדֶּשׁ חָג
  choice: wenn ein Fest geheiligt wird
  alternative: wenn man sich für ein Fest heiligt
  rationale: Die knappe hebräische Konstruktion kann auf die Heiligung des Festes beziehungsweise auf die kultische Vorbereitung dafür bezogen werden. Der Haupttext folgt der passiv-festbezogenen Auffassung; die Fußnote bewahrt die personenbezogene Möglichkeit.
- issue: Gottesbezeichnung צוּר יִשְׂרָאֵל
  choice: Fels Israels als Gottesprädikat
  alternative: Israels Fels
  rationale: Die Metapher wird nicht erklärend aufgelöst. So bleiben ihre Aussagen über Beständigkeit, Stärke und Schutz sowie ihre appositionelle Beziehung zu Jahwe erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit verständlicher Satzführung. Die verbale Wiedergabe »werdet ihr singen« und »euch … freuen« vermeidet eine im Deutschen steife Nachbildung der hebräischen Nominalsätze. »Zieht« lässt den Wallfahrtscharakter anklingen, ohne eine nicht ausdrücklich genannte Personengruppe einzusetzen.
