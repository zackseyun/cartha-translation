source:
  edition: WLC
  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: de
  text: Tausend werden vor der Drohung eines Einzigen fliehen; vor der Drohung von fünf werdet ihr fliehen, bis ihr übrig bleibt wie ein Mast[a] auf dem Gipfel eines Berges und wie ein Banner[b] auf einem Hügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein hoher Pfahl“. Das hebräische Wort תֹּרֶן kann einen Schiffsmast oder einen hohen Pfahl bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Feldzeichen“. Das hebräische Wort נֵס bezeichnet ein erhöhtes Banner oder Standzeichen, das als Signal dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: Tausend
  rationale: Die wörtliche Folge „tausend, eins“ bezeichnet idiomatisch eine Einheit von tausend. „Tausend“ ist im Deutschen natürlich und bewahrt die zugespitzte Zahlenrelation.
- source_word: מִפְּנֵי גַּעֲרַת
  choice: vor dem Drohruf
  rationale: מִפְּנֵי bezeichnet hier den Anlass der Flucht; גְּעָרָה ist ein tadelnder oder drohender Ruf. „Drohruf“ wahrt den sprachlichen Kern und passt zum militärischen Zusammenhang.
- source_word: אֶחָד
  choice: eines Einzigen
  rationale: Die substantivierte Wiedergabe macht im Deutschen klar, dass eine einzige Person gemeint ist, und hebt den rhetorischen Gegensatz zwischen tausend Flüchtenden und einem Verfolger hervor.
- source_word: חֲמִשָּׁה
  choice: fünf
  rationale: Die schlichte Zahl wird beibehalten; gegenüber dem einen Drohenden steigern fünf die Vorstellung einer vollständigen Flucht.
- source_word: תָּנֻסוּ
  choice: werdet ihr fliehen
  rationale: Die Form ist ein Qal Imperfekt in der 2. Person Plural. Die Wiedergabe bewahrt die direkte Anrede und ist in modernem Deutsch idiomatisch.
- source_word: עַד אִם
  choice: bis
  rationale: Die Verbindung bezeichnet hier den Endpunkt beziehungsweise das Ergebnis der Flucht und wird im Deutschen natürlich mit „bis“ wiedergegeben.
- source_word: נוֹתַרְתֶּם
  choice: ihr übrig bleibt
  rationale: Das Nifal bezeichnet diejenigen, die nach der Niederlage zurückbleiben. „Übrig bleibt“ bringt den Gedanken eines stark dezimierten Restes knapp zum Ausdruck.
- source_word: כַּתֹּרֶן
  choice: wie ein Signalmast
  rationale: תֹּרֶן kann einen Mast oder hohen Pfahl bezeichnen. Im Parallelismus mit נֵס und auf einer weithin sichtbaren Bergeshöhe gibt „Signalmast“ das Bild eines einzelnen, auffälligen Zeichens wieder, ohne die mögliche Bedeutung „Schiffsmast“ zu verschweigen.
- source_word: עַל רֹאשׁ הָהָר
  choice: auf dem Gipfel eines Berges
  rationale: „Gipfel“ gibt רֹאשׁ in dieser topografischen Wendung natürlich wieder. Der unbestimmte Artikel entspricht dem allgemeinen Vergleichsbild im Deutschen.
- source_word: וְכַנֵּס
  choice: und wie ein Banner
  rationale: נֵס bezeichnet ein erhöht angebrachtes Feld- oder Signalzeichen. „Banner“ ist allgemein verständlich und bewahrt das sichtbare Zeichen im Bild.
- source_word: עַל הַגִּבְעָה
  choice: auf einem Hügel
  rationale: Die topografische Angabe wird schlicht und idiomatisch wiedergegeben; der unbestimmte Artikel passt zum allgemeinen Vergleich.
theological_decisions:
- issue: Aussage des abschließenden Vergleichs
  choice: Das Bild bleibt als Vergleich mit einem einsamen, weithin sichtbaren Mast und Banner stehen.
  alternative: Den Vergleich ausdrücklich nur als Warnsignal, nur als Ausdruck der Vereinzelung oder nur als Bild der Schwäche auslegen.
  rationale: Die beiden Zeichen auf erhöhten Orten können zugleich Vereinzelung, Ausgesetztheit und weithin sichtbaren Reststatus nach der Niederlage vermitteln. Der Haupttext legt sich nicht auf nur einen Aspekt fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält die rhetorische Steigerung von einem zu fünf und die knappe, eindringliche Bildsprache bei. Die Fußnotenmarker [a] und [b] stehen unmittelbar bei den jeweils mehrdeutigen Bildwörtern.
