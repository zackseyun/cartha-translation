id: ISA.30.18
reference: Isaiah 30:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: de
  text: Darum wartet Jahwe darauf, euch gnädig zu sein, und darum erhebt er sich, um sich über euch zu erbarmen.[a] Denn Jahwe ist ein Gott des Rechts. Selig sind alle, die auf ihn warten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und darum ist er erhaben, um sich über euch zu erbarmen“; auch möglich: „und darum erhöht er sich, um sich über euch zu erbarmen“.'
    reason: Die Form יָרוּם kann sowohl ein Sich-Erheben zum Handeln als auch Erhöhung beziehungsweise Erhabenheit ausdrücken.
lexical_decisions:
- source_word: וְלָכֵן
  choice: Darum
  rationale: Gibt den folgernden beziehungsweise resultativen Übergang natürlich und prägnant wieder; die Wiederholung bleibt erhalten.
- source_word: יְחַכֶּה
  choice: wartet darauf
  rationale: Bewahrt den Grundsinn von חכה und die Spannung verzögerter Gnade, ohne ein stärkeres Verlangen in den Text hineinzulesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לַחֲנַנְכֶם
  choice: euch gnädig zu sein
  rationale: Bewahrt den Sinn von חנן als unverdiente Zuwendung und unterscheidet ihn sprachlich vom folgenden רחם.
- source_word: יָרוּם
  choice: erhebt er sich
  rationale: Bewahrt das Bild des Hochwerdens beziehungsweise Sich-Erhebens und lässt im Kontext eine Bewegung zum barmherzigen Eingreifen erkennen.
- source_word: לְרַחֶמְכֶם
  choice: um sich über euch zu erbarmen
  rationale: Gibt רחם idiomatisch wieder und hält die Nuance des Erbarmens gegenüber dem vorhergehenden Gnädigsein fest.
- source_word: כִּי
  choice: Denn
  rationale: Leitet den begründenden Satz im Deutschen klar und würdig ein.
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: ein Gott des Rechts
  rationale: מִשְׁפָּט bezeichnet hier Gottes gerechtes Richten und Walten; „Recht“ bewahrt dabei die Breite des hebräischen Begriffs.
- source_word: אַשְׁרֵי
  choice: Glücklich sind
  rationale: Gibt die weisheitliche Seligpreisungsformel in verständlichem modernem Deutsch wieder, ohne sie auf ein bloßes Gefühl zu verengen.
- source_word: כָּל
  choice: alle
  rationale: Entspricht dem universalen Quantor und passt natürlich zum substantivierten Plural.
- source_word: חוֹכֵי
  choice: die ... warten
  rationale: 'Bewahrt die bewusste Wiederaufnahme derselben Wurzel חכה: Jahwe wartet, und glücklich sind die, die auf ihn warten.'
- source_word: לוֹ
  choice: auf ihn
  rationale: Ist die natürliche deutsche Verbindung mit „warten“ und bewahrt die relationale Ausrichtung auf Gott.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich; die Transliteration bewahrt diesen, statt ihn durch einen traditionellen Titel zu ersetzen.
- issue: Bedeutung von יָרוּם im Zusammenhang
  choice: erhebt er sich
  alternative: ist er erhaben / erhöht er sich
  rationale: Die Form kann eine Bewegung zum Handeln oder Erhöhung beziehungsweise Erhabenheit bezeichnen. Der Haupttext folgt wegen der Parallele zu „wartet“ der aktiven Lesart; die genuine Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- issue: Verhältnis von göttlichem Recht und Erbarmen
  choice: Denn Jahwe ist ein Gott des Rechts
  alternative: Denn Jahwe ist ein Gott des Gerichts
  rationale: „Recht“ vermittelt Gottes gerechtes Walten als Grund dafür, auf sein Erbarmen zu warten, ohne den möglichen Gerichtsklang vollständig auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „darum“ und „warten“ bildet die hebräische Rhetorik ab. „Jahwe“ wahrt den Gottesnamen; „Gott des Rechts“ hält die begriffliche Weite von מִשְׁפָּט fest.
