    rationale: Im Deutschen ist „mit einer Flamme verzehrenden Feuers“ erforderlich; die korrigierte Form gibt לַהַב אֵשׁ אֹכֵלָה natürlich als „eine Flamme verzehrenden Feuers“ wieder.
