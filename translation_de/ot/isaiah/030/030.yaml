revisions:
- from: Und Jahwe wird die Majestät seiner Stimme hören lassen und den niedersausenden Schlag seines Arms sichtbar machen[a] – in rasendem Zorn und mit der Flamme verzehrenden Feuers, mit Wolkenbruch[b], Unwetter und Hagelsteinen.
  to: Und Jahwe wird die Majestät seiner Stimme hören lassen und das Niederfahren seines Arms[a] sichtbar machen – in glühendem Zorn und mit einer Flamme verzehrenden Feuers, mit Wolkenbruch[b], Sturm und Hagelsteinen.
  rationale: Die Revision korrigiert die deutsche Grammatik, setzt den ersten Fußnotenanker an die tatsächlich erläuterte hebräische Wendung und vermeidet bei נַחַת eine zu stark festgelegte Interpretation. Die Bildsprache des Textes, der Gottesname und die Wetterabfolge bleiben erhalten.
