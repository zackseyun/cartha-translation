source:
  edition: WLC
  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: de
  text: Und Jahwe wird die Majestät seiner Stimme hören lassen und das Niederfahren seines Arms[a] sichtbar machen – in glühendem Zorn und mit einer Flamme verzehrenden Feuers, mit Wolkenbruch[b], Sturm und Hagelsteinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den niederschlagenden Arm oder den Schlag seines Arms. Der hebräische Ausdruck ist schwierig und kann besonders die Abwärtsbewegung des Arms beim Gericht hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Platzregen. Das hebräische Wort bezeichnet hier wahrscheinlich ein heftig losbrechendes Unwetter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und entspricht der im Deutschen geläufigen wissenschaftlichen Form.
- source_word: הִשְׁמִיעַ
  choice: wird ... hören lassen
  rationale: Bewahrt die kausative Bedeutung des Hifil und klingt zugleich natürlich auf Deutsch.
- source_word: הוֹד קוֹלוֹ
  choice: die Majestät seiner Stimme
  rationale: הוֹד bezeichnet Hoheit, Pracht oder Majestät; „Majestät“ passt zur theophanischen Bildsprache.
- source_word: נַחַת זְרוֹעוֹ
  choice: den niedersausenden Schlag seines Arms
  rationale: Die schwierige Wendung verbindet im Gerichtskontext wahrscheinlich die Abwärtsbewegung des Arms mit der Wucht des Schlages; die Übersetzung hält beide Aspekte zusammen.
- source_word: יַרְאֶה
  choice: sichtbar machen
  rationale: Gibt den kausativen Sinn des Hifil idiomatisch wieder.
- source_word: בְּזַעַף אַף
  choice: in rasendem Zorn
  rationale: Drückt die intensive Zornesformulierung knapp und kraftvoll aus, ohne sie durch eine hölzerne Doppelung abzuschwächen.
- source_word: לַהַב אֵשׁ אֹכֵלָה
  choice: mit der Flamme verzehrenden Feuers
  rationale: Bewahrt das konkrete Feuerbild und den aktiven Sinn des Partizips אֹכֵלָה.
- source_word: נֶפֶץ
  choice: Wolkenbruch
  rationale: Im Zusammenhang mit Unwetter und Hagel bezeichnet das Wort wahrscheinlich ein plötzlich und gewaltsam losbrechendes Wetterereignis.
- source_word: זֶרֶם
  choice: Unwetter
  rationale: Vermittelt hier die Gewalt eines stürmischen Wetterereignisses und fügt sich ohne unnötige Wiederholung in die Aufzählung ein.
- source_word: אֶבֶן בָּרָד
  choice: Hagelsteinen
  rationale: Natürliche deutsche Wiedergabe des hebräischen Ausdrucks „Hagelstein“ im kollektiven beziehungsweise pluralischen Sinn.
theological_decisions:
- issue: Anthropomorphe Gerichtssprache über Jahwes Arm und Zorn
  choice: Die konkrete Bildsprache von Arm, Schlag, Zorn und verzehrendem Feuer bleibt erhalten.
  alternative: Die Bilder abstrakt als bloße Offenbarung göttlicher Macht wiederzugeben.
  rationale: Der hebräische Text gestaltet das göttliche Gericht bewusst als leibhaft wirkende Theophanie. Eine abstraktere Wiedergabe würde die prophetische Kraft mindern und eine Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger prophetischer Bildsprache. Die Satzstruktur folgt dem poetischen Aufbau des Hebräischen, während „sichtbar machen“ die kausative Verbform idiomatisch wiedergibt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
