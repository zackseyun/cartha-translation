    issue: Überfestlegung von נַחַת זְרֹעוֹ als „niedersausender Schlag“
    rationale: Der Ausdruck ist lexikalisch und syntaktisch schwierig. „Niedersausend“ fügt Schnelligkeit hinzu, und „Schlag“ entscheidet die umstrittene Bedeutung stärker als nötig. „Niederfahren seines Arms“ gibt die Abwärtsbewegung wieder und lässt die genaue Nuance offen.
  - severity: high
