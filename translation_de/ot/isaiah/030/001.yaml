  to: Wehe, ihr widerspenstigen Kinder, spricht Jahwe! Ihr führt einen Plan aus, der nicht von mir stammt, und gießt ein Trankopfer aus[a], doch nicht durch meinen Geist, um Sünde auf Sünde zu häufen.
  rationale: Die Revision beschränkt sich auf die Wiedergabe von לְמַעַן סְפוֹת. Die ausdrückliche Infinitivkonstruktion „um … zu häufen“ bewahrt den im Hebräischen markierten Zweck-/Folgezusammenhang und die Wiederholung des Schuldmotivs. Die umstrittene Wendung zu מַסֵּכָה bleibt texttreu im Haupttext und transparent in der Fußnote.
