source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: de
  text: Wehe, ihr widerspenstigen Kinder, spricht Jahwe! Ihr führt einen Plan aus, der nicht von mir stammt, und gießt ein Trankopfer aus[a], doch nicht durch meinen Geist, um Sünde auf Sünde zu häufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und webt eine Decke“; manche verstehen die Wendung im Zusammenhang weiter gefasst als „und schließt ein Bündnis“. Der punktierte hebräische Text bedeutet am ehesten „und gießt ein Trankopfer aus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Bewahrt die Kraft des prophetischen Klage- und Drohrufs.
- source_word: בָּנִים סוֹרְרִים
  choice: ihr widerspenstigen Kinder
  rationale: Die Anrede hält die relationale, bundesbezogene Bildsprache fest; „widerspenstig“ bezeichnet beharrliche Auflehnung.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine natürliche und zugleich gewichtige Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לַעֲשׂוֹת עֵצָה
  choice: einen Plan ausführen
  rationale: Die Wendung bezeichnet hier nicht nur das Fassen eines Entschlusses, sondern das Betreiben einer politischen Absicht.
- source_word: וְלֹא מִנִּי
  choice: der nicht von mir stammt
  rationale: Gibt die Herkunft beziehungsweise den Ursprung des Plans klar wieder.
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: ein Trankopfer ausgießen
  rationale: Folgt der masoretischen Punktierung, die am unmittelbarsten auf das Ausgießen eines Trankopfers weist; abweichende Deutungen werden in der Fußnote offengelegt.
- source_word: וְלֹא רוּחִי
  choice: doch nicht durch meinen Geist
  rationale: Bewahrt „Geist“ ausdrücklich und lässt dessen Rolle als göttliche Quelle oder Wirkkraft stehen, ohne sie weiter zu bestimmen.
- source_word: לְמַעַן סְפוֹת חַטָּאת עַל חַטָּאת
  choice: So häuft ihr Sünde auf Sünde
  rationale: Gibt die Folge beziehungsweise Absicht und das Bild wachsender Schuld in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname bleibt erkennbar und bewahrt die bundesbezogene Aussagekraft.
- issue: Deutung von וְלִנְסֹךְ מַסֵּכָה
  choice: Die masoretische Lesart „ein Trankopfer ausgießen“ steht im Haupttext.
  alternative: eine Decke weben; ein Bündnis schließen
  rationale: Die Punktierung des masoretischen Textes stützt die kultische Bedeutung am direktesten. Der Zusammenhang mit Ägypten hat jedoch zu einer politischen oder textkritisch abweichenden Deutung geführt; diese echte Schwierigkeit wird nicht stillschweigend aufgelöst.
- issue: Bedeutung von רוּחִי
  choice: meinen Geist
  alternative: meinen Willen; meinen Sinn
  rationale: Die konkrete Wiedergabe „Geist“ erhält die theologische Spannung des hebräischen Ausdrucks, ohne ihn lediglich als menschlich verstandene Absicht zu paraphrasieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die Satzfolge wurde leicht gegliedert, damit der Vers mündlich verständlich bleibt; Wiederholung und Anklagecharakter bleiben erhalten.
