source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: de
  text: Und jeder Schlag[a] der festgesetzten Rute, die Yahweh auf ihn niedergehen lässt, wird von Handtrommeln und Leiern begleitet sein; und mit Kämpfen voller Schwingbewegungen wird er gegen sie kämpfen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und jedes Vorübergehen der festgesetzten Rute«. Der hebräische Ausdruck ist schwierig; »Schlag« versteht ihn als jeden einzelnen Schlag oder Schwung der Rute.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht: »gegen sie«, mit einem femininen Singularsuffix. Worauf es sich im Zusammenhang bezieht, ist unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כֹּל
  choice: Und jeder ... wird ... sein
  rationale: Gibt die zukunftsbezogene, distributive Aussage im Deutschen natürlich wieder.
- source_word: מַעֲבַר מַטֵּה
  choice: Schlag der ... Rute
  rationale: מַעֲבַר bezeichnet eigentlich ein Vorübergehen bzw. einen Durchgang; zusammen mit der Rute ist wahrscheinlich jeder einzelne Schlag oder Schwung gemeint. Die Unsicherheit wird in Fußnote [a] bewahrt.
- source_word: מוּסָדָה
  choice: festgesetzten
  rationale: Gibt den Gedanken von etwas Gegründetem, Feststehendem oder im Voraus Bestimmtem wieder, ohne das Bild aufzulösen.
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: die Yahweh auf ihn niedergehen lässt
  rationale: Die Hifil-Form von נוח bezeichnet hier das Auflegen bzw. Niedergehenlassen der Rute im Gericht; die Formulierung passt zum Bild eines Schlages.
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: von Handtrommeln und Leiern begleitet
  rationale: Die Präposition bezeichnet die musikalische Begleitung. 'Handtrommeln' und 'Leiern' sind moderne, verständliche Bezeichnungen der Instrumente.
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: und mit Kämpfen, in denen er sie schwingt
  rationale: תְּנוּפָה bezeichnet eine Schwing- oder Schwenkbewegung. Die Wiedergabe hält das ungewöhnliche martialische Bild fest und bezieht das Schwingen plausibel auf die Rute.
- source_word: נִלְחַם בָהּ
  choice: wird er gegen sie kämpfen
  rationale: Yahweh ist im Zusammenhang das naheliegende Subjekt. Das feminine Singularsuffix bleibt hinsichtlich seines Bezugs unsicher und wird in Fußnote [b] erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Subjekt von נִלְחַם
  choice: Yahweh
  alternative: die Rute oder eine unpersönliche Macht
  rationale: Der unmittelbare Satz und der weitere Zusammenhang des Gerichts über Assur sprechen am ehesten dafür, dass Yahweh kämpft.
- issue: Bezug des Suffixes in בָהּ
  choice: gegen sie, im Kontext auf die feindliche Macht bezogen
  alternative: gegen sie/es im femininen Singular, möglicherweise auf Assur, die Rute oder den Kampf bezogen
  rationale: Das hebräische feminine Singularsuffix hat einen unsicheren Bezug. Der Haupttext stellt den kontextuellen Sinn lesbar dar, während die Fußnote die grammatische Schwierigkeit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des Hebräischen wird weitgehend bewahrt; erklärungsbedürftige lexikalische und grammatische Unsicherheiten stehen in den Fußnoten.
