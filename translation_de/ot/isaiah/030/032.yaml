revisions:
- from: Und jeder Schlag der festgesetzten Rute, die Yahweh auf ihn niedergehen lässt, wird von Handtrommeln und Leiern begleitet sein;[a] und mit Kämpfen, in denen er sie schwingt, wird er gegen sie kämpfen.[b]
  to: Und jeder Schlag[a] der festgesetzten Rute, die Yahweh auf ihn niedergehen lässt, wird von Handtrommeln und Leiern begleitet sein; und mit Kämpfen voller Schwingbewegungen wird er gegen sie kämpfen.[b]
  rationale: Die Revision entfernt die unbelegte Ergänzung, dass Yahweh die Rute schwinge, und bewahrt stattdessen die absichtlich ungewöhnliche martialische Bildsprache des Hebräischen in natürlichem Deutsch. Die Fußnoten werden an ihren jeweiligen Bezugswörtern verankert und grammatisch präzisiert.
