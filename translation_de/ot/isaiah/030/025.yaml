  text: וְ/הָיָ֣ה עַל כָּל הַ֣ר גָּבֹ֗הַ וְ/עַל֙ כָּל גִּבְעָ֣ה נִשָּׂאָ֔ה פְּלָגִ֖ים יִבְלֵי מָ֑יִם בְּ/יוֹם֙ הֶ֣רֶג רָ֔ב בִּ/נְפֹ֖ל מִגְדָּלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: de
  text: Auf jedem hohen Berg und auf jedem emporragenden Hügel wird es Bäche und Wasserläufe[a] geben, am Tag des großen Gemetzels, wenn die Türme fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wasserrinnen« oder »Rinnsale«. Das hebräische Wort ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird es … geben
  rationale: Gibt die hebräische Existenzformel idiomatisch und zukunftsbezogen wieder.
- source_word: הַר גָּבֹהַ
  choice: hohen Berg
  rationale: Natürliche topografische Entsprechung für einen Berg von großer Höhe.
- source_word: גִּבְעָה נִשָּׂאָה
  choice: emporragenden Hügel
  rationale: Bewahrt den Sinn von »erhoben« und klingt im landschaftlichen Zusammenhang natürlich.
- source_word: פְּלָגִים
  choice: Bäche
  rationale: Bezeichnet hier fließende Wasserläufe; »Bäche« ist klar und unterscheidet den Ausdruck vom folgenden seltenen Begriff.
- source_word: יִבְלֵי מָיִם
  choice: Wasserläufe
  rationale: Der seltene Ausdruck bezeichnet wahrscheinlich Rinnsale, Bäche oder Wasserkanäle; »Wasserläufe« wahrt die semantische Breite.
- source_word: בְּיוֹם הֶרֶג רָב
  choice: am Tag des großen Gemetzels
  rationale: Bewahrt die Wucht der prophetischen Gerichtssprache; »Gemetzel« gibt הֶרֶג als massenhaftes Töten prägnant wieder.
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: wenn die Türme fallen
  rationale: Gibt die Infinitivkonstruktion als natürlichen temporalen Nebensatz wieder.
theological_decisions:
- issue: Verhältnis der Wasserfülle zum Gerichtsbild
  choice: Segen und Gericht werden unvermittelt nebeneinandergestellt.
  alternative: Die Wasserfülle ausdrücklich als Wiederherstellung nach dem Gericht oder als Versorgung während des Gerichts deuten.
  rationale: Der hebräische Text erklärt das Verhältnis zwischen den Wasserläufen und dem Tag des Gemetzels nicht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die harte Verbindung von Fruchtbarkeit und Gericht bleiben erhalten.
