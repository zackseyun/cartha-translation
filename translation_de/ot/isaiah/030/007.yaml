source:
  edition: WLC
  text: וּ/מִצְרַ֕יִם הֶ֥בֶל וָ/רִ֖יק יַעְזֹ֑רוּ לָ/כֵן֙ קָרָ֣אתִי לָ/זֹ֔את רַ֥הַב הֵ֖ם שָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: de
  text: Denn Ägyptens Hilfe ist nichtig und nutzlos. Darum nenne ich Ägypten »Rahab[a], die stillsitzt«.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Rahab« ist hier ein poetischer Name oder Spottname für Ägypten; das hebräische Wort kann auch Stolz, Prahlerei oder Ungestüm bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist stark verdichtet und kann auch wiedergegeben werden: »Rahab – sie sitzen still« oder »die Prahlerin, die nichts tut«. Gemeint ist vermutlich der Gegensatz zwischen großspurigem Auftreten und Untätigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: Denn Ägyptens
  rationale: Die Verbindung mit dem folgenden Hilfsverb wird im Deutschen natürlich als Genitivfügung wiedergegeben. »Denn« bringt den begründenden Zusammenhang mit dem vorausgehenden Vers zum Ausdruck.
- source_word: הֶבֶל וָרִיק
  choice: nichtig und nutzlos
  rationale: Beide Wörter bezeichnen Leere, Vergeblichkeit oder Wirkungslosigkeit. Die Doppelung bewahrt die hebräische Verstärkung, ohne im Deutschen dasselbe Wort zu wiederholen.
- source_word: יַעְזֹרוּ
  choice: Hilfe
  rationale: Das pluralische Verb »sie helfen« bezieht sich wohl kollektiv auf Ägypten beziehungsweise seine Vertreter. Die Substantivierung ergibt im Deutschen einen klaren und natürlichen Satz, ohne den kollektiven Sinn zu verlieren.
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der Nutzlosigkeit der ägyptischen Hilfe.
- source_word: קָרָאתִי לָזֹאת
  choice: nenne ich Ägypten
  rationale: Das feminine Demonstrativpronomen verweist auf das personifizierte Ägypten. Die ausdrückliche Wiederaufnahme des Namens ist im Deutschen klarer als ein grammatisch irritierendes feminines Pronomen nach dem Neutrum »Ägypten«.
- source_word: רַהַב
  choice: Rahab
  rationale: Das Wort fungiert hier wahrscheinlich als poetischer Spottname für Ägypten und trägt zugleich Anklänge an Stolz, Prahlerei oder Ungestüm. Die Namensform bleibt erhalten; ihre Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: הֵם שָׁבֶת
  choice: die stillsitzt
  rationale: Die schwierige, stark verdichtete Wendung wird als spöttische nähere Bestimmung des personifizierten Ägypten verstanden. Das Bild der Untätigkeit bleibt erhalten; die grammatische Uneindeutigkeit des Hebräischen wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Deutung des Spottnamens רַהַב הֵם שָׁבֶת
  choice: »Rahab, die stillsitzt« als poetischer Spottname für Ägypten
  alternative: »Rahab – sie sitzen still«, »die Prahlerin, die nichts tut« oder »Ungestüm, das untätig bleibt«
  rationale: Die prophetische Aussage verspottet Ägyptens großspuriges Auftreten bei gleichzeitiger Untätigkeit. Die gewählte Fassung erhält Name, Personifikation und Bild, ohne die sprachlich verdichtete hebräische Wendung als völlig eindeutig auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Satire bleibt erhalten; »nichtig und nutzlos« ist verständlich, aber bewusst gehoben. Die Fußnoten sichern die Mehrdeutigkeit des Spottnamens und der schwierigen Schlusswendung.
