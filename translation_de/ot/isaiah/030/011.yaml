  source_fidelity: Die beiden parallelen Imperative und die Wegmetaphorik sind zutreffend wiedergegeben. Auch die Gottesbezeichnung „der Heilige Israels“ bleibt erhalten. Die Schlussforderung sollte jedoch die kausative Kraft von הַשְׁבִּיתוּ unmittelbarer ausdrücken; „Lasst … verschwinden“ ist zwar verständlich, schwächt aber den aktiven Beseitigungsbefehl etwas ab.
  naturalness: „Weicht vom Weg ab, biegt vom Pfad ab!“ ist modernes, natürliches Deutsch und bewahrt den Parallelismus. „Schafft den Heiligen Israels aus unserer Gegenwart fort!“ ist idiomatisch, entschieden und ohne unnötige Festlegung auf eine konkrete Weise des Fortschaffens.
  terminology: '„Der Heilige Israels“ ist als feste jesajanische Gottesbezeichnung angemessen. „Aus unserer Gegenwart“ gibt מִפָּנֵינוּ idiomatisch wieder. Die Fußnote wird sprachlich und semantisch bereinigt: „dazu, vor uns aufzuhören“ ist im Deutschen missverständlich und legt eine unpassende personale Handlungsbedeutung nahe.'
