  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: de
  text: Weicht vom Weg ab, biegt vom Pfad ab! Schafft den Heiligen Israels aus unserer Gegenwart fort![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Lasst den Heiligen Israels vor uns aufhören.“ Das hebräische Verb ist kausativ und kann hier auch bedeuten: „Beseitigt den Heiligen Israels aus unserer Gegenwart.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: Weicht vom Weg ab
  rationale: Der pluralische Imperativ von סור bezeichnet das Abweichen oder Sichentfernen. Die Formulierung bewahrt das Wegbild und klingt im modernen Deutschen natürlich.
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: biegt vom Pfad ab
  rationale: נטה steht parallel zu סור und bezeichnet hier das Abbiegen von einer Bahn. „Pfad“ erhält den poetischen Parallelismus mit „Weg“, ohne beide Begriffe gleich wiederzugeben.
- source_word: הַשְׁבִּיתוּ
  choice: Lasst … verschwinden
  rationale: 'Der Hifil-Imperativ von שבת hat kausative Bedeutung: etwas zum Aufhören bringen beziehungsweise seine Gegenwart beenden. Die gewählte Formulierung gibt die feindselige Forderung verständlich wieder, ohne die Art dieses Beseitigens näher festzulegen.'
- source_word: מִפָּנֵינוּ
  choice: aus unserer Gegenwart
  rationale: Die Wendung bedeutet wörtlich „von unserem Angesicht/vor uns weg“ und bezeichnet hier die Gegenwart beziehungsweise den unmittelbaren Bereich der Sprecher.
- source_word: אֶת קְדוֹשׁ יִשְׂרָאֵל
  choice: den Heiligen Israels
  rationale: Die wiederkehrende jesajanische Gottesbezeichnung wird vollständig und als Titel beibehalten.
theological_decisions:
- issue: Bezug von „der Heilige Israels“
  choice: Die Wendung wird als Gottesbezeichnung unverändert wiedergegeben.
  alternative: Sie könnte metonymisch auf Jesajas Botschaft oder abstrakt auf Gottes Heiligkeit bezogen werden.
  rationale: Im Jesajabuch ist קְדוֹשׁ יִשְׂרָאֵל ein wiederkehrender Titel für Israels Gott. Die direkte Wiedergabe bewahrt sowohl den Gottesbezug als auch die Spannung, dass die Sprecher seine konfrontierende Gegenwart ablehnen.
- issue: Art des geforderten „Aufhörens“
  choice: Die Übersetzung lässt offen, ob Gottes Gegenwart selbst oder seine durch die Propheten vermittelte Konfrontation aus dem Blickfeld verschwinden soll.
  alternative: Die Aussage ausdrücklich als Aufforderung deuten, nicht mehr von Gott zu reden.
  rationale: Der hebräische Wortlaut nennt den Heiligen Israels als direktes Objekt, erläutert aber nicht, auf welche Weise er „aufhören“ soll. Eine explizite Beschränkung auf die prophetische Verkündigung würde diese Mehrdeutigkeit auflösen.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Sprache. Die parallelen Wegbilder bleiben erhalten; die ungewöhnliche Härte der abschließenden Forderung wird nicht abgeschwächt. Der Fußnotenmarker steht unmittelbar bei der von ihm erläuterten Wendung.
