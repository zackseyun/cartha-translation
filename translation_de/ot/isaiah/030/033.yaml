- from: Denn längst ist Tofet[a] hergerichtet[b]; auch für den König ist es bereitgemacht. Er hat es tief und weit gemacht. Seine Feuerstätte enthält Feuer und Holz in Menge. Der Atem Jahwes setzt sie wie ein Schwefelstrom[c] in Brand.
  to: Denn längst ist Tofet[a] hergerichtet[b]; auch für den König ist es bereitgemacht. Er hat es tief und weit gemacht. Die Feuerstätte dort enthält Feuer und reichlich Holz. Der Atem Jahwes setzt sie, wie ein Schwefelstrom[c], in Brand.
  rationale: Die Revision korrigiert die sachlich fehlerhafte Fußnote zu „Schwefel“, verdeutlicht den Bezug der Feuerstätte auf Tofet und glättet die Mengenangabe. Die im Hebräischen nicht ausdrücklich identifizierten Bezüge – insbesondere „der König“ und das maskuline Subjekt von „hat ... gemacht“ – bleiben unangetastet.
