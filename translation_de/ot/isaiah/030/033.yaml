reference: Isaiah 30:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: de
  text: Denn längst ist Tofet[a] hergerichtet[b]; auch für den König ist es bereitgemacht. Er hat es tief und weit gemacht. Die Feuerstätte dort enthält Feuer und reichlich Holz. Der Atem Jahwes setzt sie, wie ein Schwefelstrom[c], in Brand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Tophet“. Der hebräische Ortsname ist mit Bildern des Verbrennens und des Gerichts verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seit gestern“; gemeint ist hier: schon seit Langem oder im Voraus.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell auch: „Schwefelstein“. Das hebräische Wort bezeichnet Schwefel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּךְ
  choice: ist … hergerichtet
  rationale: Das passive Partizip bezeichnet einen bereits hergestellten, vorbereiteten Zustand. „Herg​​erichtet“ passt zur nachfolgend beschriebenen Feuerstätte und wahrt den resultativen Sinn.
- source_word: מֵאֶתְמוּל
  choice: längst
  rationale: Wörtlich „seit gestern“; idiomatisch verweist die Wendung auf eine schon länger zurückliegende Vorbereitung. „Längst“ gibt dies knapp und natürlich wieder.
- source_word: תָּפְתֶּה
  choice: Tofet
  rationale: Der hebräische Ortsname wird transliteriert und nicht deutend übersetzt. Die Form „Tofet“ ist im Deutschen gebräuchlich.
- source_word: גַּם הוא לַמֶּלֶךְ הוּכָן
  choice: auch für den König ist es bereitgemacht
  rationale: „Auch“ bewahrt die ergänzende bzw. hervorhebende Kraft von גַּם; „der König“ lässt dessen im Vers nicht ausdrücklich bestimmten Bezug offen.
- source_word: הֶעְמִיק הִרְחִב
  choice: Er hat es tief und weit gemacht
  rationale: Die beiden kausativen Verben stehen in der 3. Person Singular maskulin. Das deutsche Pronomen bildet die grammatische Form ab, ohne den im Hebräischen unausgesprochenen Handelnden ausdrücklich zu identifizieren.
- source_word: מְדֻרָתָהּ
  choice: seine Feuerstätte
  rationale: Das Substantiv bezeichnet eine für das Feuer bestimmte Anlage oder einen Brennplatz. „Feuerstätte“ ist verständlich und weniger eng als „Scheiterhaufen“.
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: Feuer und Holz in Menge
  rationale: Die Formulierung bewahrt beide Bestandteile und die ausdrücklich genannte Fülle.
- source_word: נִשְׁמַת יְהוָה
  choice: der Atem Jahwes
  rationale: נְשָׁמָה bedeutet hier „Atem“ bzw. „Hauch“; „Atem“ erhält das starke Bild. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כְּנַחַל גָּפְרִית
  choice: wie ein Schwefelstrom
  rationale: נַחַל kann Bach, Strom oder Sturzbach bezeichnen. „Schwefelstrom“ ist anschaulich, modern und lässt die genaue Stärke des Wasserbildes offen.
- source_word: בֹּעֲרָה בָּהּ
  choice: setzt sie … in Brand
  rationale: Das feminine Partizip bezieht sich auf נִשְׁמַת („Atem“); das Suffix verweist auf die Feuerstätte bzw. Tofet. Die Wiedergabe drückt im Zusammenhang verständlich aus, dass Jahwes Atem das vorbereitete Feuer entfacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von „dem König“
  choice: für den König
  alternative: für den König von Assyrien / für Moloch
  rationale: Der hebräische Vers identifiziert den König nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und trägt keine umstrittene Deutung in den Haupttext ein.
- issue: Handelnder bei „hat es tief und weit gemacht“
  choice: Er
  alternative: Jahwe / man
  rationale: Die hebräischen Verben haben ein unausgesprochenes maskulines Subjekt. „Er“ bildet dies ab, ohne die kontextuell naheliegende göttliche Urheberschaft ausdrücklich festzuschreiben oder durch ein unpersönliches „man“ zu verwischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten den wuchtigen Gerichtscharakter. Der Ortsname, der nicht ausdrücklich identifizierte König und das unausgesprochene Subjekt der Verben bleiben ohne konfessionelle oder auslegungsgeschichtliche Festlegung stehen.
