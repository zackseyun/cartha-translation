  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: de
  text: Denn seine Würdenträger sind in Zoan, und seine Boten gelangen nach Hanes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: seine führenden Männer
  rationale: שׂרים bezeichnet hier hochrangige Vertreter bzw. Amtsträger; die Wiedergabe bleibt verständlich und vermeidet die im Deutschen mögliche Verengung von „Fürsten“ auf Angehörige eines Herrscherhauses.
- source_word: מַלְאָכָיו
  choice: seine Boten
  rationale: מַלְאָךְ meint im politischen Kontext menschliche Gesandte oder Boten, nicht Engel.
- source_word: יַגִּיעוּ
  choice: gelangen
  rationale: Das Verb נגע im Hifil beschreibt hier das Erreichen eines Ortes; „gelangen nach“ gibt die Bewegung natürlich wieder, ohne zusätzliche Wertung.
- source_word: צֹעַן / חָנֵס
  choice: Zoan / Hanes
  rationale: Die überlieferten Ortsnamen werden in geläufiger deutscher Transliteration beibehalten.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in „seine“
  choice: Das Pronomen bleibt wie im Hebräischen ohne ausdrückliche Identifizierung des Bezugsworts stehen.
  alternative: Den Bezug als „die führenden Männer Judas“ oder „des Pharaos“ explizit machen.
  rationale: Der unmittelbare Vers nennt den Referenten nicht ausdrücklich; eine Ergänzung würde die syntaktische Mehrdeutigkeit des Ausgangstextes auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Satzbau des Hebräischen bleibt erhalten; „führende Männer“ und „Boten“ kennzeichnen den politischen Kontext klar.
