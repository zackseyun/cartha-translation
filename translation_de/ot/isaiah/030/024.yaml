  text: וְ/הָ/אֲלָפִ֣ים וְ/הָ/עֲיָרִ֗ים עֹֽבְדֵי֙ הָֽ/אֲדָמָ֔ה בְּלִ֥יל חָמִ֖יץ יֹאכֵ֑לוּ אֲשֶׁר זֹרֶ֥ה בָ/רַ֖חַת וּ/בַ/מִּזְרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: de
  text: Auch die Ochsen und die Esel, die den Boden bearbeiten, werden gewürztes Futter[a] fressen, das mit Schaufel und Wurfgabel geworfelt wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gesalzenes Futter“. Das hebräische Adjektiv kann Futter bezeichnen, das durch Salzen oder Würzen besonders zubereitet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Schaufel und Wurfgabel waren landwirtschaftliche Geräte, mit denen man das Erntegut beim Worfeln in die Luft warf, damit sich die leichteren Bestandteile trennten.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: die Ochsen
  rationale: Im Zusammenhang mit der Feldarbeit bezeichnet das Wort Rinder, die als Zugtiere eingesetzt werden. „Ochsen“ gibt diese landwirtschaftliche Funktion präziser wieder als das allgemeinere „Rinder“.
- source_word: הָעֲיָרִים
  choice: die Esel
  rationale: Die übliche moderne Bezeichnung für die hier parallel zu den Ochsen genannten Arbeitstiere.
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: die den Boden bearbeiten
  rationale: Die partizipiale Wendung beschreibt die Tiere nach ihrer Arbeit auf dem Acker; die Formulierung bleibt konkret und im modernen Deutsch verständlich.
- source_word: בְּלִיל
  choice: Futter
  rationale: Gemeint ist zubereitetes Viehfutter, wahrscheinlich ein Futtergemisch. „Futter“ ist natürlich und lässt die genaue Zusammensetzung offen.
- source_word: חָמִיץ
  choice: gewürztes
  rationale: Das seltene Adjektiv bezeichnet offenbar besonders zubereitetes oder verbessertes Futter. „Gewürzt“ wahrt die allgemeinere Bedeutung; die mögliche Spezifizierung als gesalzen wird in der Fußnote genannt.
- source_word: יֹאכֵלוּ
  choice: werden … fressen
  rationale: Der Zukunftsbezug entspricht der Verheißung landwirtschaftlicher Fülle; bei Tieren ist „fressen“ im Deutschen die natürliche Wortwahl.
- source_word: אֲשֶׁר זֹרֶה
  choice: das … geworfelt wurde
  rationale: „Worfeln“ bezeichnet das Hochwerfen und Reinigen mit den anschließend genannten Geräten. Die passive Form gibt im Deutschen natürlich wieder, dass das Futter diesem Vorgang unterzogen wurde.
- source_word: בָרַחַת
  choice: mit Schaufel
  rationale: Bezeichnet ein landwirtschaftliches Gerät zum Hochwerfen des Ernteguts beim Worfeln; „Schaufel“ ist die geläufige Entsprechung.
- source_word: וּבַמִּזְרֶה
  choice: und Wurfgabel
  rationale: Bezeichnet ein gabelartiges Gerät zum Worfeln. „Wurfgabel“ macht seine landwirtschaftliche Funktion deutlicher als das bloße „Gabel“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter landwirtschaftlicher Bildsprache. Der seltenere Fachausdruck „geworfelt“ ist wegen seiner Präzision beibehalten und wird durch die genannten Geräte sowie die Fußnote verständlich gemacht.
