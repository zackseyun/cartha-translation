  terminology: „Ochsen“, „Esel“, „Futter“, „Schaufel“ und „Wurfgabel“ sind kontextgerechte und registerangemessene Begriffe. Die Fußnote zu „gewürztes Futter“ wahrt die lexikalische Offenheit, ohne eine bestimmte technische Deutung als sicher auszugeben. Die Fußnotenanker sind sinnvoll gesetzt.
