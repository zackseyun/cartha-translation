  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Zukunftscharakter des Hebräischen zutreffend wieder: die als Feldarbeitstiere charakterisierten Ochsen und Esel erhalten besonders zubereitetes Futter; die anschließende Relativbestimmung nennt die beiden Worfelgeräte. „Gewürztes“ bleibt als Wiedergabe von חָמִיץ vertretbar, da die genaue Art der Zubereitung (insbesondere Salzung) lexikalisch nicht völlig gesichert ist und die Fußnote die wichtige Alternative nennt. Das deutsche Passiv bei „geworfelt wurde“ vermittelt idiomatisch, dass das Futter geworfelt wird.'
