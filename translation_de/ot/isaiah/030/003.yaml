  rationale: 'Die Wiedergabe wird an die wahrscheinliche kontextuelle Bedeutung von מָעוֹז angepasst: Nicht ein konkretes „Bollwerk“, sondern der von Pharao erwartete Schutz wird zur Schande. „Schmach“ gibt לִכְלִמָּה präzise und natürlich wieder. Die Fußnote zum Schattenbild bleibt erhalten; eine lexikalische Alternativnote zu „Bollwerk“ entfällt, weil dieser Ausdruck nicht mehr im Haupttext steht.'
