  text: וְ/הָיָ֥ה לָ/כֶ֛ם מָע֥וֹז פַּרְעֹ֖ה לְ/בֹ֑שֶׁת וְ/הֶ/חָס֥וּת בְּ/צֵל מִצְרַ֖יִם לִ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: de
  text: Dann wird euch der Schutz durch Pharao zur Schande werden und die Zuflucht im Schatten Ägyptens zur Schmach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Schatten Ägyptens“ ist ein Bild für den Schutz, den man bei Ägypten sucht.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann wird … werden
  rationale: Die Formulierung gibt im Zusammenhang die angekündigte Folge wieder. „Dann“ markiert den Fortgang der Warnung, während „wird … werden“ den resultativen Zukunftssinn natürlich ausdrückt.
- source_word: לָכֶם
  choice: euch … zur
  rationale: 'Der Dativ gibt die Beziehung des Nachteils idiomatisch wieder: Der vermeintliche Schutz wird für die Angesprochenen Schande.'
- source_word: מָעוֹז
  choice: Bollwerk
  rationale: Das Substantiv bezeichnet einen Ort oder eine Quelle der Stärke und des Schutzes. „Bollwerk“ bewahrt das konkrete Bild und unterscheidet den Ausdruck von חָסוּת im zweiten Satzglied.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: לְבֹשֶׁת
  choice: zur Schande
  rationale: בֹּשֶׁת bezeichnet Schande oder Beschämung; die Konstruktion mit ל wird natürlich als Ergebnisangabe wiedergegeben.
- source_word: וְהֶחָסוּת
  choice: und die Zuflucht
  rationale: חָסוּת bezeichnet das Suchen oder Finden von Schutz. „Zuflucht“ ist knapp, natürlich und wahrt die Unterscheidung zu מָעוֹז.
- source_word: בְּצֵל
  choice: im Schatten
  rationale: Die bildhafte Rede von schützendem Schatten bleibt erhalten.
- source_word: מִצְרַיִם
  choice: Ägyptens
  rationale: Der Genitiv gibt die hebräische Verbindung idiomatisch wieder.
- source_word: לִכְלִמָּה
  choice: zur Demütigung
  rationale: כְּלִמָּה bezeichnet Schmach, Entehrung oder Demütigung. „Demütigung“ bewahrt gegenüber „Schande“ eine erkennbare Nuance zwischen den parallelen Begriffen.
theological_decisions:
- issue: Unterscheidung der beiden parallelen Begriffe für Schande
  choice: בֹּשֶׁת als „Schande“ und כְּלִמָּה als „Demütigung“ wiedergeben
  alternative: Beide Ausdrücke mit „Schande“ oder „Schmach“ wiedergeben
  rationale: Der hebräische Parallelismus verwendet verwandte, aber unterschiedliche Substantive. Die differenzierte Wiedergabe erhält diese rhetorische Spannung, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Bildsprache des Schutzes durch Ägypten
  choice: „im Schatten Ägyptens“ wörtlich-bildhaft beibehalten
  alternative: Deutend mit „unter dem Schutz Ägyptens“ wiedergeben
  rationale: Das Bild vom schützenden Schatten ist im Deutschen verständlich und lässt zugleich die Ironie des angekündigten Scheiterns dieses Schutzes bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Schutzmetaphorik des Hebräischen bleiben erhalten; die beiden verwandten Schandbegriffe werden bewusst unterschiedlich wiedergegeben.
