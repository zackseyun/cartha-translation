base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: de
  text: Denn ein Volk wird in Zion, in Jerusalem, wohnen. Du wirst ganz gewiss nicht mehr weinen.[a] Er wird dir gewiss gnädig sein beim Klang deines Hilferufs; sobald er ihn hört, wird er dir antworten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Weinend wirst du nicht weinen.« Die Verbindung zweier Formen desselben Verbs verstärkt die Verneinung: Du wirst ganz gewiss nicht mehr weinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »Gnädig seiend wird er dir gnädig sein.« Die Verbindung zweier Formen desselben Verbs betont die Gewissheit seiner Gnade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Verheißung und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: עַם בְּצִיּוֹן יֵשֵׁב בִּירוּשָׁלִָם
  choice: ein Volk wird auf Zion, in Jerusalem, wohnen
  rationale: Die Wiedergabe folgt der masoretischen Verbform יֵשֵׁב als Zukunftsform und erhält sowohl den kollektiven Begriff »Volk« als auch die eng verbundenen Ortsangaben Zion und Jerusalem. »Auf Zion« ist im Deutschen für den Berg- und Stadtnamen idiomatisch.
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: Du wirst ganz gewiss nicht mehr weinen
  rationale: Infinitivus absolutus und finite Verbform derselben Wurzel verstärken die Verneinung. »Ganz gewiss« gibt den Nachdruck in natürlichem Deutsch wieder; »nicht mehr« passt zum angekündigten Ende der Not.
- source_word: חָנוֹן יָחְנְךָ
  choice: Ganz gewiss wird er dir gnädig sein
  rationale: Auch hier verstärkt der Infinitivus absolutus die finite Verbform. חנן bezeichnet das Erweisen unverdienter Gunst; »gnädig sein« bewahrt diese Bedeutung, ohne sie konfessionell einzuengen.
- source_word: לְקוֹל זַעֲקֶךָ
  choice: sobald er deinen Hilferuf hört
  rationale: Wörtlich steht »beim Klang deines Schreiens«. Die dynamische Wiedergabe verbindet die akustische Vorstellung verständlich mit der Reaktion Gottes; זעקה bezeichnet einen aus Bedrängnis ausgestoßenen Ruf.
- source_word: כְּשָׁמְעָתוֹ
  choice: wenn er ihn hört
  rationale: Die Konstruktion mit כְּ und dem Infinitiv bezeichnet den Zeitpunkt des Hörens. Das Pronomen »ihn« verweist auf den Hilferuf.
- source_word: עָנָךְ
  choice: wird er dir antworten
  rationale: ענה bedeutet hier »antworten, reagieren«. Das Futur entspricht dem Verheißungszusammenhang; die ungewöhnliche Form des Suffixes wird im Deutschen nicht eigens abgebildet.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt in den letzten Sätzen
  choice: Das Subjekt wird mit »er« wiedergegeben und aus dem Kontext auf den HERRN bezogen.
  alternative: Das Subjekt durch eine unpersönlichere Formulierung unausgesprochen lassen.
  rationale: Die hebräischen Verbformen tragen ein männliches Subjekt, das im Zusammenhang der HERR ist. Deutsch verlangt hier für eine klare, natürliche Aussage ein ausgesprochenes Pronomen.
- issue: Deutung von יֵשֵׁב als Zukunftsform oder als gegenwärtige Charakterisierung
  choice: »wird … wohnen«
  alternative: »Du Volk auf Zion, das in Jerusalem wohnt«
  rationale: Die masoretische Punktierung lässt sich regulär als Imperfekt mit Zukunftsbezug lesen. Die alternative vokativische Deutung ist kontextuell möglich und wird deshalb in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede des Volkes als kollektiver Einheit. Die beiden hebräischen Nachdruckskonstruktionen werden durch »ganz gewiss« hörbar gemacht. Die mögliche vokativische Lesart des ersten Satzes bleibt in der Fußnote sichtbar.
