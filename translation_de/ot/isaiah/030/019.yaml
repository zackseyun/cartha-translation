revisions:
- from: Denn ein Volk wird auf Zion, in Jerusalem, wohnen. Du wirst ganz gewiss nicht mehr weinen.[a] Ganz gewiss wird er dir gnädig sein, sobald er deinen Hilferuf hört; wenn er ihn hört, wird er dir antworten.[b]
  to: Denn ein Volk wird in Zion, in Jerusalem, wohnen. Du wirst ganz gewiss nicht mehr weinen.[a] Er wird dir gewiss gnädig sein beim Klang deines Hilferufs; sobald er ihn hört, wird er dir antworten.[b]
  rationale: Die Revision bewahrt die Zukunftsaussage, die kollektive Anrede und den hebräischen Nachdruck. Sie unterscheidet wieder klar zwischen Gottes gnädiger Reaktion „beim Klang“ des Hilferufs und seinem Antworten, sobald er ihn hört. Die Fußnoten sind nun jeweils an den erläuterten Nachdruckskonstruktionen verankert und geben keine unnötig unsichere Lesart als textliche Alternative aus.
