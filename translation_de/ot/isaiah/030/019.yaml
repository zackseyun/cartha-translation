review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird überwiegend getroffen: יֵשֵׁב ist sinnvoll zukunftsbezogen als „wird wohnen“ wiedergegeben, und die beiden Infinitivus-abs.-Konstruktionen werden angemessen als Nachdruck wiedergegeben. Die Fassung „sobald er deinen Hilferuf hört; wenn er ihn hört“ verschiebt jedoch לְקוֹל זַעֲקֶךָ („beim/auf den Klang deines Hilferufs“) in die erste Hörhandlung und erzeugt eine unnötige, widersprüchlich wirkende Doppelung mit כְּשָׁמְעָתוֹ („sobald/wenn er ihn hört“).'
  naturalness: Der Ausgangssatz ist im modernen Deutsch verständlich, aber die unmittelbar aufeinanderfolgenden Formulierungen „sobald er ... hört; wenn er ihn hört“ sind stilistisch schwerfällig. Die Ortsangabe lässt sich quellennäher und natürlich als „in Zion, in Jerusalem“ ausdrücken.
  terminology: „gnädig sein“, „Hilferuf“ und „antworten“ sind passende, registergerechte Wiedergaben. Die bisherige Fußnote b behandelt eine alternative Deutung des ersten Satzes, ist aber am Ende des Verses verankert und erklärt daher nicht den markierten Text. Sie sollte durch eine Fußnote zur tatsächlich markierten emphatischen Gnadenform ersetzt werden.
  issues:
  - severity: medium
    issue: Die Wiedergabe von לְקוֹל זַעֲקֶךָ und כְּשָׁמְעָתוֹ vermischt zwei aufeinanderfolgende Ausdrücke.
    rationale: לְקוֹל bedeutet zunächst „beim/auf den Klang von“, während כְּשָׁמְעָתוֹ danach das Hören des Rufes zeitlich bestimmt. „Beim Klang deines Hilferufs ...; sobald er ihn hört ...“ erhält beide Elemente und ihre rhetorische Wiederaufnahme.
  - severity: medium
    issue: Fußnote b ist inhaltlich und positionell nicht dem Anker zugeordnet.
    rationale: Der Anker steht nach „antworten“, die Fußnote erläutert aber eine angebliche vokativische Deutung des ersten Satzes. Zudem ist diese Deutung für die punktierte WLC-Form nicht erforderlich. Eine Fußnote zur emphatischen Form חָנוֹן יָחְנְךָ passt an dieser Stelle.
  - severity: low
    issue: „auf Zion“ ist enger als die hebräische Präposition בְּ („in Zion“).
    rationale: Da Zion hier zugleich die Ortsbezeichnung der Jerusalemer Bevölkerung ist, wahrt „in Zion, in Jerusalem“ die Formulierung des Ausgangstextes ohne eine Berg-Lokalisierung hervorzuheben.
