source:
  edition: WLC
  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: de
  text: 'Ein Ausspruch über die Tiere des Negev[a]: Durch ein Land der Bedrängnis und Not, ein Land von Löwin und Löwe,[b] von Viper und fliegender Feuerschlange tragen sie ihren Reichtum auf den Schultern von Eseln und ihre Schätze auf den Höckern von Kamelen zu einem Volk, das ihnen nichts nützt.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Last über die Tiere des Südens.“ Das hebräische Überschriftswort kann „Ausspruch“ oder „Last“ bedeuten; „Negev“ kann auch allgemeiner als „Süden“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Löwe und Löwe.“ Im Hebräischen stehen zwei verschiedene Wörter für einen Löwen; ihr genauer Bedeutungsunterschied ist hier unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu einem Volk, das ihnen nicht helfen wird.“ Das hebräische Verb kann „nützen“ oder „helfen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine göttliche Kundgabe oder einen Ausspruch. „Ausspruch“ ist im Deutschen verständlich und bewahrt die Funktion als Überschrift; die traditionelle Wiedergabe „Last“ bleibt als Alternative in der Fußnote erhalten.
- source_word: בַּהֲמוֹת נֶגֶב
  choice: die Tiere des Negev
  rationale: בַּהֲמוֹת bezeichnet Tiere beziehungsweise Lasttiere; נֶגֶב ist hier am ehesten die geografische Bezeichnung Negev, kann aber auch allgemein „Süden“ bedeuten.
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: durch ein Land der Bedrängnis und Not
  rationale: Das Land bezeichnet den Weg der Gesandtschaft. Die beiden nah verwandten Begriffe drücken Bedrängnis, Not und bedrückende Enge aus.
- source_word: לָבִיא וָלַיִשׁ
  choice: Löwin und Löwe
  rationale: Der hebräische Text verwendet zwei verschiedene Löwenwörter. „Löwin und Löwe“ bildet diese Unterscheidung plausibel ab, ohne sie als sicher auszugeben.
- source_word: אֶפְעֶה
  choice: Viper
  rationale: Das Wort bezeichnet eine Giftschlange; „Viper“ ist eine klare, gegenwärtige deutsche Entsprechung.
- source_word: שָׂרָף מְעוֹפֵף
  choice: fliegende Feuerschlange
  rationale: 'Die auffällige Bildsprache wird bewahrt: שָׂרָף bezeichnet eine brennende oder feurige Schlange, מְעוֹפֵף etwas Fliegendes beziehungsweise schnell Dahinschießendes.'
- source_word: יִשְׂאוּ
  choice: tragen sie
  rationale: Das Verb beschreibt hier den Transport von Gütern auf Lasttieren.
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: auf den Schultern von Eseln
  rationale: „Schultern“ gibt כֶּתֶף wörtlich wieder und erhält die konkrete Bildlichkeit; עֲיָרִים bezeichnet Esel beziehungsweise junge Esel.
- source_word: חֵילֵהֶם
  choice: ihren Reichtum
  rationale: חַיִל kann Kraft, Vermögen oder Ressourcen bezeichnen; im Zusammenhang der mitgeführten diplomatischen Gaben passt „Reichtum“.
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: auf den Höckern von Kamelen
  rationale: דַּבֶּשֶׁת bezeichnet ausdrücklich den Kamelhöcker; die konkrete Wiedergabe erhält das anschauliche Parallelbild.
- source_word: אֹצְרֹתָם
  choice: ihre Schätze
  rationale: Das Wort bezeichnet Vorräte oder aufbewahrte Kostbarkeiten; „Schätze“ passt zu den wertvollen mitgeführten Gaben.
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: zu einem Volk, das ihnen nichts nützt
  rationale: עַל kann nach einer Bewegung die Richtung bezeichnen. יוֹעִילוּ bedeutet nützen, Vorteil bringen oder helfen; „nichts nützt“ bewahrt die Aussage über die Vergeblichkeit des Unternehmens.
theological_decisions:
- issue: Art der gefährlichen Tiere im Negev
  choice: Die Tiere werden als Bestandteile der gefahrvollen Wüstenreise wiedergegeben.
  alternative: Die Tierbezeichnungen symbolisch auf politische Mächte beziehen oder zu allgemeinen wilden Tieren und Schlangen verflachen.
  rationale: Der unmittelbare Zusammenhang betont die Gefährlichkeit und Vergeblichkeit der Gesandtschaft. Eine sachnahe Wiedergabe bewahrt die prophetische Bildkraft, ohne eine vom Text nicht ausdrücklich vorgenommene Allegorisierung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die konkrete Wüstenbildsprache und die rhetorische Aussage über die vergebliche Hoffnung auf fremde Hilfe bleiben erhalten; echte lexikalische Unsicherheiten werden in den Fußnoten offengelegt.
