base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: de
  text: Darum wird diese Schuld für euch wie ein einstürzender Riss sein, der sich in einer hohen Mauer auswölbt; plötzlich, in einem Augenblick, bricht die Mauer zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֺן הַזֶּה
  choice: diese Schuld
  rationale: עָוֹן bezeichnet hier die schuldhafte Verfehlung und zugleich ihre verhängnisvolle Folge. „Schuld“ bewahrt diesen Zusammenhang im Deutschen besser als das heute weniger geläufige „Missetat“.
- source_word: כְפֶרֶץ נֹפֵל
  choice: wie ein einstürzender Riss
  rationale: פֶרֶץ ist ein Riss beziehungsweise Bruch in einer Mauer; נֹפֵל kennzeichnet ihn als fallend oder einstürzend. Die Formulierung bewahrt das ungewöhnliche Bild des Hebräischen, ohne es in „eine Mauer kurz vor dem Einsturz“ umzudeuten.
- source_word: נִבְעֶה
  choice: der sich … auswölbt
  rationale: Das seltene Partizip beschreibt wahrscheinlich ein Hervorquellen oder eine Ausbuchtung. „Sich auswölben“ passt zum Bild einer instabilen hohen Mauer.
- source_word: שִׁבְרָהּ
  choice: ihr Zusammenbruch
  rationale: Das Suffix bezieht sich grammatisch auf die Mauer; שֶׁבֶר kann Bruch, Zerbrechen oder Zusammenbruch bedeuten. Im gegebenen Bild ist „Zusammenbruch“ idiomatisch und klar.
- source_word: פִּתְאֹם לְפֶתַע
  choice: plötzlich, in einem Augenblick
  rationale: Die nahezu synonymen Ausdrücke verstärken die Unvermitteltheit. Beide werden wiedergegeben, statt die emphatische Doppelung zu glätten.
theological_decisions:
- issue: Verhältnis von Schuld und Gericht
  choice: „diese Schuld“ bleibt das Subjekt des Vergleichs und führt bildhaft zum Zusammenbruch
  alternative: Explizit formulieren, dass Gottes Strafe über sie kommt
  rationale: Der hebräische Text hält Schuld und ihre zerstörerische Folge eng zusammen, benennt in diesem Vers aber nicht ausdrücklich Gott als Handelnden. Die Übersetzung fügt diese Deutung daher nicht ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das markante Mauerbild und die emphatische zeitliche Doppelung des Hebräischen bleiben erhalten; der Satzbau wurde nur so weit geglättet, wie es für natürliche deutsche Lesbarkeit nötig ist.
