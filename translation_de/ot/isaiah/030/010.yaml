  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: de
  text: 'die zu den Sehern sagen: »Seht nicht!«, und zu den Schauenden: »Schaut uns nicht, was recht ist[a]! Redet zu uns glatte Worte; schaut Trugbilder[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was geradlinig ist« oder »Wahres«. Das hebräische Wort bezeichnet Gerades, Aufrichtiges oder Richtiges.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Täuschungen« oder »Wahngebilde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / תִרְאוּ
  choice: Seher / seht
  rationale: Die Bezeichnung für prophetische Seher und das zugehörige Verb werden mit demselben deutschen Wortstamm wiedergegeben; so bleibt das hebräische Wortspiel erkennbar.
- source_word: חֹזִים / תֶחֱזוּ
  choice: Schauende / schaut
  rationale: Der zweite, von חזה abgeleitete Ausdruck für prophetisches Schauen bleibt von ראה unterschieden. »Schauende« ist im Deutschen verständlich und bewahrt zusammen mit »schaut« den Gleichklang von Bezeichnung und Verb.
- source_word: נְכֹחוֹת
  choice: was recht ist
  rationale: Der Ausdruck bezeichnet Gerades, Richtiges oder Aufrichtiges. »Was recht ist« bewahrt sowohl den sachlichen als auch den ethischen Sinn, ohne ihn auf bloße Tatsachenwahrheit einzuengen.
- source_word: חֲלָקוֹת
  choice: glatte Worte
  rationale: Wörtlich sind »glatte Dinge« gemeint, im Zusammenhang schmeichelnde oder angenehm klingende Rede. Die Ergänzung »Worte« macht das Bild im Deutschen natürlich verständlich.
- source_word: מַהֲתַלּוֹת
  choice: Trugbilder
  rationale: Das Wort bezeichnet Täuschendes oder Irreführendes. »Trugbilder« passt zum prophetischen Schauen und lässt offen, ob Selbsttäuschung, Täuschung anderer oder unwahre Visionen im Vordergrund stehen.
- source_word: אֲשֶׁר אָמְרוּ
  choice: die ... sagen
  rationale: Der Relativsatz charakterisiert das im vorherigen Vers genannte Volk. Das Präsens gibt diese fortdauernde Haltung angemessen wieder.
theological_decisions:
- issue: Art der abgelehnten prophetischen Botschaft
  choice: נְכֹחוֹת wird mit »was recht ist« wiedergegeben.
  alternative: »Wahres«, »Gerades« oder »Aufrichtiges«
  rationale: Die Formulierung umfasst sachliche Wahrheit und moralische Geradheit, ohne die Aussage vorschnell auf nur eine dieser Dimensionen festzulegen.
- issue: Unterscheidung der beiden prophetischen Bezeichnungen
  choice: רֹאִים und חֹזִים werden als »Seher« und »Schauende« unterschieden.
  alternative: Beide Ausdrücke mit »Seher« oder allgemein mit »Propheten« wiedergeben.
  rationale: Der hebräische Parallelismus verwendet zwei verwandte, aber verschiedene Wortstämme. Die differenzierte Wiedergabe erhält diese sprachliche Spannung, ohne unterschiedliche prophetische Ämter zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aufforderungen bleiben knapp und eindringlich. »Schauende« ist bewusst leicht gehoben, damit die vom Hebräischen gesetzte Unterscheidung zu »Seher« und der Wortanklang an »schaut« erhalten bleiben.
