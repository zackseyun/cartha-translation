  source_fidelity: 'Die Grundstruktur und die zentralen Lexeme werden treffend wiedergegeben: רֹאִים/תִרְאוּ als »Seher/Seht«, חֹזִים/תֶחֱזוּ als davon abgehobenes prophetisches Schauen, נְכֹחוֹת als das Rechte, חֲלָקוֹת als glatte Rede und מַהֲתַלּוֹת als Trugbilder. Die deutsche Wortstellung »Schaut für uns nicht, was recht ist« kann jedoch bedeuten, dass die Schauenden nicht zugunsten der Sprecher auf das Rechte blicken sollen, statt dass sie ihnen keine rechte Botschaft schauen sollen. Die Stellung von »uns« unmittelbar beim Inhalt beseitigt diese unnötige Mehrdeutigkeit.'
  naturalness: »Schauende« ist in diesem parallelen, prophetischen Register vertretbar und erhält den Bezug zu »schaut«. »Schaut uns nicht, was recht ist« ist zwar bewusst knapp und poetisch, aber weniger eindeutig idiomatisch. »Schaut uns nicht, was recht ist« wird deshalb zu »Schaut uns nicht, was recht ist« nicht verändert; die sichere Verbesserung erfolgt durch Umstellung zu »Schaut uns nicht, was recht ist«? Diese Formulierung bleibt jedoch syntaktisch ebenfalls markiert. Eine natürlichere und zugleich genaue Lösung ist »Schaut uns nicht, was recht ist« im biblisch-poetischen Register, mit der Präpositionalergänzung des Entwurfs entfernt.
  terminology: »Seher« und »Schauende« bewahren angemessen die Unterscheidung der beiden hebräischen Stämme, ohne daraus verschiedene Ämter abzuleiten. »Was recht ist«, »glatte Worte« und »Trugbilder« sind sachgerecht. Die Fußnoten erläutern die jeweiligen lexikalischen Spielräume und sind an den passenden Ausdrücken verankert.
