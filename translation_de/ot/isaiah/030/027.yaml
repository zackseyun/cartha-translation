id: ISA.30.27
reference: Isaiah 30:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: de
  text: Seht, der Name Jahwes kommt aus der Ferne; sein Zorn brennt, und dichter Rauch steigt auf[a]. Seine Lippen sind voller Grimm, und seine Zunge ist wie verzehrendes Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Wörtlicher etwa: „und Schwere des Erhebens“; sie kann auch als „und schwere Last“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel eröffnet die prophetische Schau. „Seht“ ist im heutigen Deutsch verständlich und bewahrt ihren hinweisenden, eindringlichen Charakter.
- source_word: שֵׁם יְהוָה
  choice: der Name Jahwes
  rationale: Die ausdrückliche hebräische Wendung bleibt erhalten; „Name“ kann hier für Jahwes offenbar werdende Gegenwart, Macht und Autorität stehen und soll nicht stillschweigend durch den bloßen Gottesnamen ersetzt werden.
- source_word: בָּא מִמֶּרְחָק
  choice: kommt aus der Ferne
  rationale: Gibt die anschauliche prophetische Gegenwart knapp und in gehobenem, natürlichem Deutsch wieder.
- source_word: בֹּעֵר אַפּוֹ
  choice: sein Zorn brennt
  rationale: אַף bezeichnet wörtlich Nase beziehungsweise Nasenflügel, ist hier aber ein geläufiges Bild für Zorn. Die deutsche Form bewahrt zugleich das Feuerbild.
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: und dichter Rauch steigt auf
  rationale: Die schwierige Wendung wird entsprechend dem Zusammenhang der feurigen Gotteserscheinung als dichter, aufsteigender Rauch verstanden. Eine Fußnote hält die wörtlichere und unsichere Deutung offen.
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: Seine Lippen sind voller Grimm
  rationale: Bewahrt das konkrete Körperbild und unterscheidet זַעַם sprachlich vom zuvor genannten אַף, ohne die Gerichtssprache abzuschwächen.
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: und seine Zunge ist wie verzehrendes Feuer
  rationale: Die Formulierung erhält sowohl den Vergleich als auch die aktive, vernichtende Kraft des Partizips אֹכָלֶת.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: „Name“ als handelndes Subjekt
  choice: der Name Jahwes kommt
  alternative: Jahwe kommt
  rationale: Der hebräische Text nennt ausdrücklich den „Namen Jahwes“. Diese Form bewahrt die Spannung zwischen Jahwes Identität und seiner sich offenbarenden Gegenwart im Gericht.
- issue: Deutung von וְכֹבֶד מַשָּׂאָה
  choice: Bild von dicht aufsteigendem Rauch im Haupttext, Unsicherheit in der Fußnote
  alternative: und Schwere des Erhebens / und eine schwere Last
  rationale: Der unmittelbare Zusammenhang legt eine feurige Theophanie mit Rauch nahe, doch die seltene und syntaktisch schwierige hebräische Wendung erlaubt keine dogmatische Festlegung; deshalb wird die wörtlichere Möglichkeit dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bildkräftiger prophetischer Sprache. Der Doppelpunktcharakter von הִנֵּה wird durch „Seht“ und die Satzgliederung vermittelt; konkrete Bilder wie Name, Lippen und Zunge bleiben erhalten.
