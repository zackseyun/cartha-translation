source:
  edition: WLC
  text: וְ/נָתַ֨ן לָ/כֶ֧ם אֲדֹנָ֛/י לֶ֥חֶם צָ֖ר וּ/מַ֣יִם לָ֑חַץ וְ/לֹֽא יִכָּנֵ֥ף עוֹד֙ מוֹרֶ֔י/ךָ וְ/הָי֥וּ עֵינֶ֖י/ךָ רֹא֥וֹת אֶת מוֹרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: de
  text: Und der Herr wird euch Brot der Not und Wasser der Bedrückung geben.[a] Doch dein Lehrer wird sich nicht länger verbergen,[b] und deine Augen werden deinen Lehrer sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brot der Bedrängnis und Wasser der Not«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische kann auch verstanden werden als: »Deine Lehrer werden nicht länger verborgen sein«; traditionell auch: »Dein Lehrer wird nicht mehr in einen Winkel gedrängt werden«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die übliche und würdevolle deutsche Wiedergabe des göttlichen Herrschertitels; sie bleibt im modernen Standarddeutsch gut verständlich.
- source_word: לֶחֶם צָר
  choice: Brot der Not
  rationale: Bewahrt das konkrete Bild des Brotes und gibt צָר als bedrängende Not wieder, ohne die Metapher aufzulösen.
- source_word: מַיִם לָחַץ
  choice: Wasser der Bedrängnis
  rationale: Gibt לָחַץ mit seinem Sinn von Druck, Bedrängnis beziehungsweise Unterdrückung wieder und erhält den Parallelismus mit »Brot der Not«.
- source_word: יִכָּנֵף
  choice: wird sich … verbergen
  rationale: Das Nifal von כנף bezeichnet hier wahrscheinlich ein Verborgen- oder Verhülltsein. Die reflexive deutsche Form ist bei einem persönlichen singularischen Subjekt natürlich, ohne die mögliche passive Lesart zu verschweigen.
- source_word: מוֹרֶיךָ
  choice: dein Lehrer
  rationale: Die masoretische Form sieht morphologisch pluralisch aus, steht hier jedoch mit einem singularischen Verb und kann als singularisch beziehungsweise honorativ verstanden werden. Die Mehrzahllesart wird in der Fußnote bewahrt.
- source_word: עֵינֶיךָ רֹאוֹת
  choice: deine Augen werden … sehen
  rationale: Folgt dem hebräischen Ausdruck eng und erhält die Betonung unmittelbarer eigener Wahrnehmung.
theological_decisions:
- issue: Identität und Numerus von מוֹרֶיךָ
  choice: Im Haupttext steht unbestimmt und kleingeschrieben »dein Lehrer«; die Person wird weder ausdrücklich mit Gott gleichgesetzt noch als menschlicher Lehrer bestimmt.
  alternative: »deine Lehrer« als Bezeichnung menschlicher Lehrer oder Propheten; möglich ist auch ein auf Gott bezogener singularischer Titel.
  rationale: Das singularische Verb begünstigt »dein Lehrer«, während die Form מוֹרֶיךָ auch eine pluralische Deutung zulässt. Eine Kleinschreibung und der Verzicht auf eine nähere Identifikation bewahren die theologische Offenheit des Textes.
- issue: Bedeutung von יִכָּנֵף
  choice: »wird sich nicht länger verbergen«
  alternative: »wird nicht länger verborgen sein« beziehungsweise traditionell »wird nicht mehr in einen Winkel verwiesen werden«
  rationale: Die reflexive Wiedergabe ist im Deutschen natürlich und passt zum singularisch verstandenen Lehrer, legt aber die schwierige Verbform nicht endgültig fest; weitere mögliche Lesarten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel von »euch« zu »dein/deine« entspricht dem Numeruswechsel des hebräischen Textes. Die anschaulichen Bilder von Brot, Wasser und Sehen bleiben erhalten; die schwierige singularische beziehungsweise pluralische Lehrer-Lesart wird nicht dogmatisch entschieden.
