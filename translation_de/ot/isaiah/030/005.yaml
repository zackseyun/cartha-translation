source:
  edition: WLC
  text: כֹּ֣ל הבאיש עַל עַ֖ם לֹא יוֹעִ֣ילוּ לָ֑/מוֹ לֹ֤א לְ/עֵ֨זֶר֙ וְ/לֹ֣א לְ/הוֹעִ֔יל כִּ֥י לְ/בֹ֖שֶׁת וְ/גַם לְ/חֶרְפָּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: de
  text: Alle sind wegen eines Volkes beschämt[a], das ihnen weder Hilfe noch Nutzen bringt, sondern Schande und auch Schmach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb הבאיש ist schwierig. Es kann die Vorstellung des Anstößigwerdens oder Übelriechens tragen. Im Zusammenhang des gescheiterten Bündnisses und der parallelen Begriffe „Schande“ und „Schmach“ wird es hier im Sinn von Beschämung verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Alle
  rationale: Die distributive Gesamtheit der Betroffenen wird im Deutschen knapp und natürlich mit „Alle“ wiedergegeben.
- source_word: הבאיש
  choice: werden zuschanden
  rationale: Das schwierige Verb kann mit üblem Geruch oder Anstößigkeit verbunden sein. Im Zusammenhang des gescheiterten Bündnisses und parallel zu „Schande“ und „Schmach“ bezeichnet es hier am ehesten ein öffentliches In-Schande-Geraten, nicht bloß ein inneres Schamgefühl.
- source_word: עַל
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass oder Grund ihrer Beschämung.
- source_word: עַם
  choice: eines Volkes
  rationale: Der kollektive Singular bleibt erhalten, ohne Ägypten im Vers ausdrücklich einzusetzen.
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: das ihnen nichts nützt
  rationale: יעל bezeichnet Nutzen oder Vorteil. Die Formulierung wahrt den Bezug auf die Betroffenen und leitet zur Wiederholung von „Nutzen“ über.
- source_word: לְעֵזֶר
  choice: Hilfe
  rationale: Die knappe substantivische Wiedergabe bewahrt den Parallelismus.
- source_word: לְהוֹעִיל
  choice: Nutzen bringt
  rationale: Die Wiederaufnahme von „nützt“ bildet die Wiederholung desselben hebräischen Verbstamms hörbar ab.
- source_word: כִּי
  choice: sondern
  rationale: 'Im Satz führt die Konjunktion den gegensätzlichen Ausgang ein: nicht Hilfe oder Nutzen, sondern Schande.'
- source_word: לְבֹשֶׁת
  choice: Schande
  rationale: „Schande“ gibt die öffentliche Erniedrigung direkt und idiomatisch wieder.
- source_word: וְגַם
  choice: und dazu noch
  rationale: Die Formulierung bewahrt die steigernde, additive Betonung.
- source_word: לְחֶרְפָּה
  choice: Schmach
  rationale: „Schmach“ bezeichnet öffentliche Herabsetzung und verächtliche Behandlung und unterscheidet sich dabei sprachlich von „Schande“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „nützt/Nutzen“ bildet die hebräische Wortwiederholung ab; der Gedankenstrich macht den erläuternden Parallelismus lesbar. „Zuschanden werden“ ist gehoben, aber weiterhin verständlich und erfasst die äußere Entehrung besser als „sich schämen“.
