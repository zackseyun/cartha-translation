  terminology: „der Heilige Israels“, „dieses Wort“, „Unterdrückung“ und „euch darauf gestützt habt“ sind angemessen. „Verkehrtheit“ wahrt die Bedeutung von נָלוֹז (das Krumme/Verkehrte) ohne die stärkere und potenziell einengende Konnotation von „Perversität“ oder „Betrug“.
