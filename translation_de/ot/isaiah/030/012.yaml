source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: de
  text: 'Darum, so spricht der Heilige Israels: Weil ihr dieses Wort[a] verworfen, auf Unterdrückung und Verkehrtheit vertraut und euch darauf gestützt habt,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Botschaft“ oder „diese Sache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als natürliche deutsche Folgerung die angekündigte Konsequenz aus dem vorherigen Tadel ein.
- source_word: כֹּה אָמַר
  choice: spricht
  rationale: Die im Deutschen etablierte prophetische Botenformel „So spricht“ wird zusammen mit „Darum“ idiomatisch zu „Darum spricht“, ohne den Aussagegehalt zu verändern.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Bewahrt den charakteristischen jesajanischen Gottesnamen und die hebräische Genitivverbindung.
- source_word: יַעַן
  choice: Weil
  rationale: Kennzeichnet klar den Grund für das folgende Gerichtswort.
- source_word: מָאַס
  choice: verworfen
  rationale: Gibt die bewusste Zurückweisung kräftig und in würdigem modernem Deutsch wieder.
- source_word: בַּדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: Bewahrt die mögliche Bezugnahme auf das zuvor verkündete prophetische Wort, ohne die weitere Bedeutung „Botschaft/Sache“ auszuschließen.
- source_word: בָּטַח
  choice: vertraut
  rationale: Gibt das Setzen von Vertrauen unmittelbar wieder und wahrt den Parallelismus zum folgenden Sichstützen.
- source_word: עֹשֶׁק
  choice: Unterdrückung
  rationale: Deckt den breiten Sinn ungerechter Machtausübung ab; Erpressung oder Ausbeutung sind je nach Kontext ebenfalls möglich.
- source_word: נָלוֹז
  choice: Verdrehung
  rationale: Bringt das Bild des moralisch oder sachlich Verdrehten zum Ausdruck und lässt die Nuancen Verkehrtheit, Falschheit und Verschlagenheit offen.
- source_word: שָׁעַן
  choice: euch gestützt habt
  rationale: Bewahrt das konkrete Bild des Sich-Anlehnens als Ausdruck des Vertrauens.
- source_word: עָלָיו
  choice: darauf
  rationale: Erhält den singularischen Rückverweis des Hebräischen, ohne zu entscheiden, ob besonders das zuletzt Genannte oder der gesamte Komplex gemeint ist.
theological_decisions:
- issue: Bezug von „dieses Wort“
  choice: das zuvor ergangene prophetische Wort, bei bewahrter lexikalischer Offenheit
  alternative: diese Botschaft; diese Sache
  rationale: Der Zusammenhang legt die göttliche Warnung nahe; „Wort“ wahrt diesen Bezug, ohne דָּבָר unnötig einzuengen.
- issue: Worauf sich Juda verlässt
  choice: Unterdrückung und Verdrehung
  alternative: Erpressung und Verkehrtheit; Ausbeutung und Falschheit
  rationale: Die Übersetzung bewahrt die ethische Anklage und legt keine bestimmte historische oder lehrmäßige Ausformung fest.
- issue: Referent des singularischen Pronomens
  choice: „darauf“ mit offenem Bezug
  alternative: „auf sie“ als zusammenfassender Bezug auf beide Begriffe
  rationale: Das hebräische עָלָיו ist singularisch. „Darauf“ wahrt die grammatische Form und vermeidet eine nicht ausdrücklich markierte Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als begründender Vordersatz syntaktisch offen, da der angekündigte Urteilsspruch in den Folgeversen fortgeführt wird. „Verdrehung“ wahrt die Bildhaftigkeit von נָלוֹז besser als eine stärker deutende Festlegung auf Betrug oder Perversität.
