    rationale: טִמֵּא bezeichnet hier das Unreinmachen bzw. Verunreinigen. „Entweihen“ ist kontextuell möglich, kann jedoch stärker eine allgemeine Profanierung als die im Vergleich ausdrücklich aufgerufene kultische Unreinheit nahelegen.
