  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: de
  text: 'Dann werdet ihr den Silberüberzug eurer Schnitzbilder und die Goldverkleidung eurer Gussbilder verunreinigen. Ihr werdet sie wie ein Menstruationstuch wegwerfen und zu ihm[a] sagen: »Hinaus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische hat hier beim Pronomen und beim Befehl den Singular: „zu ihm … Hinaus!“; der genaue Singularbezug innerhalb der zuvor genannten Kultbilder und ihrer Überzüge bleibt offen.'
    reason: Der Singular soll quellentreu sichtbar bleiben, ohne seinen Bezug über das Hebräische hinaus festzulegen.
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: Dann werdet ihr … entweihen
  rationale: Das Piel bezeichnet hier, dass die bislang kultisch verehrten Gegenstände als unrein behandelt und entheiligt werden. »Dann« bindet die Folge natürlich an den vorausgehenden Zusammenhang an.
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: den Silberüberzug eurer Schnitzbilder
  rationale: צִפּוּי ist der Überzug; פְּסִילִים sind geschnitzte beziehungsweise behauene Kultbilder. Der kollektive Singular der Anrede wird im Deutschen dem pluralischen Volk entsprechend wiedergegeben.
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: die Goldverkleidung eurer Gussbilder
  rationale: אֲפֻדָּה bezeichnet hier eine Umhüllung oder Verkleidung, מַסֵּכָה ein gegossenes Bild. Die Formulierung bewahrt den Parallelismus zum Silberüberzug.
- source_word: תִּזְרֵם
  choice: Ihr werdet sie wegwerfen
  rationale: Das Verb זרה kann zerstreuen, worfeln oder wegwerfen bedeuten. Im Kontext der entschiedenen Beseitigung der Götzen ist »wegwerfen« natürlich und sachgerecht.
- source_word: כְּמוֹ דָוָה
  choice: wie ein Menstruationstuch
  rationale: דָּוָה verweist auf die menstruationsbedingte Unreinheit beziehungsweise einen damit verbundenen unreinen Gegenstand. Die konkrete Wiedergabe vermittelt den Vergleich verständlich, ohne seine Anstößigkeit abzuschwächen.
- source_word: צֵא
  choice: Fort mit euch!
  rationale: Wörtlich steht der maskuline Singular »Geh hinaus!«. Da sich das Pronomen zuvor auf die Bilder beziehungsweise ihre Überzüge bezieht, gibt die idiomatische deutsche Wendung die abweisende Entsorgung wieder.
theological_decisions:
- issue: Behandlung der Kultbilder als unrein
  choice: entweihen
  alternative: unrein machen
  rationale: »Entweihen« bringt die bewusste Abkehr von vormals verehrten Kultgegenständen zum Ausdruck; der folgende Vergleich bewahrt zugleich die Kategorie kultischer Unreinheit.
- issue: Numerus beim abschließenden Befehl
  choice: 'zu ihnen sagen: »Fort mit euch!«'
  alternative: 'zu ihm sagen: »Hinaus!«'
  rationale: Der hebräische Befehl und das Pronomen stehen formal im Singular, während das Bezugsfeld aus mehreren Kultbildern und Verkleidungen besteht. Die pluralische Wiedergabe folgt dem natürlichen deutschen Bezug, ohne eine einzelne Referenz dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Der drastische Reinheitsvergleich wird nicht beschönigt; »Fort mit euch!« gibt die entschiedene Verwerfung idiomatisch wieder.
