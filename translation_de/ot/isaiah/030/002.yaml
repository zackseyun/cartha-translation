  text: הַ/הֹלְכִים֙ לָ/רֶ֣דֶת מִצְרַ֔יִם וּ/פִ֖/י לֹ֣א שָׁאָ֑לוּ לָ/עוֹז֙ בְּ/מָע֣וֹז פַּרְעֹ֔ה וְ/לַ/חְס֖וֹת בְּ/צֵ֥ל מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: de
  text: die nach Ägypten hinabziehen, ohne mich um Weisung zu fragen, um in der Festung des Pharao Zuflucht zu suchen und im Schatten Ägyptens Schutz zu finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהֹלְכִים לָרֶדֶת
  choice: die hinabziehen wollen
  rationale: Das Partizip mit Infinitiv bezeichnet diejenigen, die sich anschicken beziehungsweise beabsichtigen, nach Ägypten hinabzuziehen; die Formulierung bewahrt die Bewegungsrichtung und klingt im Deutschen natürlich.
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: ohne meinen Mund zu befragen
  rationale: Die ungewöhnliche Metonymie „meinen Mund“ wird bewusst erhalten, da sie Gottes eigenes Reden beziehungsweise seine Weisung betont und nicht stillschweigend zu „mich“ oder „meinen Rat“ geglättet werden sollte.
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: um in der Festung des Pharaos Zuflucht zu suchen
  rationale: Das Wortspiel zwischen עוז und מעוז lässt sich nicht vollständig nachbilden. „Festung“ gibt den konkreten Schutz- beziehungsweise Machtstützpunkt wieder, während „Zuflucht suchen“ den Zweck ausdrückt.
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: und im Schatten Ägyptens Schutz zu finden
  rationale: „Schatten“ bleibt als Schutzmetapher erhalten; „Schutz finden“ gibt חסה idiomatisch und würdig wieder.
theological_decisions:
- issue: Art der unterlassenen Gottesbefragung
  choice: „meinen Mund“ wörtlich-metonymisch bewahren
  alternative: „mich nicht befragen“ oder „meinen Rat nicht einholen“
  rationale: Der hebräische Text nennt ausdrücklich Gottes Mund. Die gewählte Fassung lässt offen, ob dabei prophetische Weisung, ein Orakel oder allgemein Gottes offenbartes Wort gemeint ist.
- issue: Charakter des ägyptischen Schutzes
  choice: politisch-militärische Schutzbilder ohne wertende Zusätze wiedergeben
  alternative: den Schutz ausdrücklich als falsches Vertrauen bezeichnen
  rationale: Die Verurteilung ergibt sich aus dem Kontext; der Vers selbst soll nicht durch eine konfessionell oder interpretativ zugespitzte Ergänzung erweitert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. „Hinabziehen“ entspricht der traditionellen geografischen Perspektive auf den Weg von Juda nach Ägypten; „meinen Mund befragen“ ist absichtlich markant, aber verständlich.
