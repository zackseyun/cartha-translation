id: ISA.30.15
reference: Isaiah 30:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: de
  text: 'Denn so spricht Gott, der HERR, der Heilige Israels: »Durch Umkehr[a] und Ruhe werdet ihr gerettet[b]; im Stillsein und im Vertrauen liegt eure Stärke.« Doch ihr habt nicht gewollt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rückkehr«; das hebräische Wort kann die Umkehr zu Gott, einschließlich Buße, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »befreit«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Die im Deutschen etablierte Wiedergabe des zusammengesetzten Gottesnamens unterscheidet den Herrschertitel vom Eigennamen JHWH, der nach Übersetzungskonvention durch HERR angezeigt wird.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Bewahrt den für Jesaja charakteristischen Hoheitstitel und seine Beziehung zu Israel.
- source_word: בְּשׁוּבָה
  choice: durch Umkehr
  rationale: Umkehr gibt das Zurückkehren beziehungsweise Sich-Abwenden von einem falschen Weg wieder, ohne den Ausdruck ausschließlich auf innere Reue zu verengen. Die Präposition »durch« bringt den instrumentalen Sinn des hebräischen בְּ natürlich zum Ausdruck.
- source_word: וָנַחַת
  choice: und Ruhe
  rationale: Ruhe bezeichnet hier ein gelassenes Absehen von eigenmächtigem Handeln und bildet ein natürliches Begriffspaar mit Umkehr.
- source_word: תִּוָּשֵׁעוּן
  choice: werdet ihr gerettet
  rationale: Das Nifal von ישׁע bezeichnet Gerettet- oder Befreitwerden. »Gerettet« wahrt die umfassende Aussage, ohne sie allein auf politische Befreiung oder geistliches Heil festzulegen.
- source_word: בְּהַשְׁקֵט
  choice: im Stillsein
  rationale: Die substantivierte Form bezeichnet ruhiges, stilles Verhalten. »Stillsein« wahrt den aktiven Aspekt besser als lediglich »Stille«.
- source_word: וּבְבִטְחָה
  choice: und im Vertrauen
  rationale: Vertrauen bringt im Kontext die Haltung des Sich-Verlassens auf Gott deutlicher zum Ausdruck als das mögliche, aber stärker zustandsbezogene »Sicherheit«.
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: liegt eure Stärke
  rationale: Diese natürliche deutsche Wendung gibt wieder, worin Israels eigentliche Stärke bestehen sollte. »Stärke« deckt die Bedeutung von גְּבוּרָה hier treffend ab.
- source_word: וְלֹא אֲבִיתֶם
  choice: Doch ihr habt nicht gewollt
  rationale: Gibt die fehlende Bereitschaft unmittelbar wieder und bewahrt den scharfen Gegensatz zur vorausgehenden Zusage.
theological_decisions:
- issue: Bedeutungsumfang von בְּשׁוּבָה
  choice: Umkehr
  alternative: Rückkehr; Buße
  rationale: Die Wurzel שׁוב kann die Rückkehr zu Gott und damit Buße einschließen, bezeichnet im Zusammenhang aber ebenso die Abkehr von selbstgewählten politischen Sicherungsmaßnahmen. »Umkehr« bewahrt diese relationale und handlungsbezogene Weite.
- issue: Heils- beziehungsweise Befreiungssinn von תִּוָּשֵׁעוּן
  choice: werdet ihr gerettet
  alternative: werdet ihr befreit
  rationale: Im Zusammenhang ist konkrete Rettung aus politischer und militärischer Bedrängnis im Blick; zugleich trägt ישׁע eine weiterreichende Heilsaussage. »Gerettet« hält beide Ebenen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar, wird aber durch »durch« und »liegt« natürlich deutsch gestaltet. Die Anrede steht durchgehend im Plural.
