  source_fidelity: 'Die Übersetzung gibt die Satzglieder und Parallelismen des Hebräischen zuverlässig wieder: den zusammengesetzten Gottestitel, den Titel »der Heilige Israels«, die beiden Präpositionalgruppen, die Passivform »werdet ihr gerettet«, die Aussage über die Stärke sowie den abschließenden Vorwurf der Unwilligkeit. »Durch Umkehr« ist als natürliche instrumentale Ausformung von בְ vertretbar und wahrt den weiten Sinn von שׁוּבָה.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. »Im Stillsein und im Vertrauen liegt eure Stärke« ist idiomatisch und erhält die prägnante antithetische Struktur des Verses. »Doch ihr habt nicht gewollt« ist als bewusst knapper, absolut gebrauchter Schluss im Deutschen angemessen.
  terminology: »Gott, der HERR« markiert den zusammengesetzten Gottesnamen sachgerecht. »Der Heilige Israels«, »Umkehr«, »Ruhe«, »Vertrauen«, »Stärke« und »gerettet« sind kontextgerecht. Insbesondere legt »gerettet« weder ausschließlich geistliches Heil noch bloß politische Befreiung fest.
