- from: Nun komm und schreibe es vor ihren Augen auf eine Tafel; zeichne es in einer Schriftrolle auf, damit es für einen künftigen Tag[a] bestehen bleibt, als Zeugnis für immer und ewig.[b]
  to: Nun komm, schreibe es vor ihren Augen auf eine Tafel und ritze es in eine Schriftrolle ein, damit es für einen späteren Tag[a] erhalten bleibt, für immer, bis in Ewigkeit.[b]
  rationale: Die Revision entfernt die nicht belegte Deutung „als Zeugnis“ und gibt לָעַד עַד־עוֹלָם als emphatische Dauerformel wieder. Sie wahrt zugleich die offene zeitliche Bedeutung von לְיוֹם אַחֲרוֹן und behält die Fußnotenanker an den jeweils mehrdeutigen beziehungsweise erläuterungsbedürftigen Ausdrücken bei.
