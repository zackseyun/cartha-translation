  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: de
  text: Nun komm, schreibe es vor ihren Augen auf eine Tafel und ritze es in eine Schriftrolle ein, damit es für einen späteren Tag[a] erhalten bleibt, für immer, bis in Ewigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für einen künftigen Tag“; möglicherweise auch: „für den letzten Tag“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „für immer, bis in Ewigkeit“. Die doppelte Dauerformel betont das bleibende Bestehen der Aufzeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה בּוֹא
  choice: Nun komm
  rationale: עַתָּה markiert die unmittelbare Aufforderung; der Singularimperativ בּוֹא wird direkt und natürlich mit „komm“ wiedergegeben.
- source_word: כָתְבָהּ
  choice: schreibe es
  rationale: Das feminine Suffix verweist auf die niederzuschreibende Botschaft, ohne dass ihr Bezug im Deutschen unnötig präzisiert wird.
- source_word: עַל לוּחַ
  choice: auf eine Tafel
  rationale: לוּחַ bezeichnet eine feste Schreibtafel; „Tafel“ ist im Deutschen verständlich und mediengeschichtlich passend.
- source_word: אִתָּם
  choice: vor ihren Augen
  rationale: Wörtlich kann die Form „bei/mit ihnen“ bedeuten; im Zusammenhang einer öffentlich festgehaltenen Botschaft gibt „vor ihren Augen“ den Anwesenheits- und Zeugnischarakter idiomatisch wieder.
- source_word: וְעַל סֵפֶר חֻקָּהּ
  choice: zeichne es in einer Schriftrolle auf
  rationale: סֵפֶר bezeichnet hier ein Schriftstück beziehungsweise eine Rolle. חקק trägt den Sinn dauerhaften Einzeichnens oder Aufzeichnens; die Formulierung vermeidet die für eine Rolle unpassende Vorstellung des Einmeißelns.
- source_word: וּתְהִי
  choice: damit es … bestehen bleibt
  rationale: Die Form hat hier nach den Imperativen einen Ziel- oder Folgesinn. „Bestehen bleibt“ bringt die beabsichtigte Dauer des Schriftzeugnisses zum Ausdruck.
- source_word: לְיוֹם אַחֲרוֹן
  choice: für einen künftigen Tag
  rationale: אַחֲרוֹן kann hier einen späteren beziehungsweise zukünftigen Tag bezeichnen, ohne zwingend als technischer Ausdruck für den letzten Tag verstanden werden zu müssen.
- source_word: לָעַד עַד עוֹלָם
  choice: als Zeugnis für immer und ewig
  rationale: לָעַד kann Dauer ausdrücken, lässt sich im Kontext der schriftlichen Dokumentation aber auch zeugnishaft verstehen. Die Wiedergabe erhält diese kontextuelle Aussage und gibt עַד עוֹלָם als starke Dauerformel wieder.
theological_decisions:
- issue: Eschatologische Tragweite von לְיוֹם אַחֲרוֹן
  choice: für einen künftigen Tag
  alternative: für den letzten Tag / für einen späteren Tag
  rationale: Der Haupttext wahrt den Zukunftsbezug, ohne eine technische endzeitliche Bedeutung festzulegen; die mögliche stärkere Lesart bleibt in der Fußnote sichtbar.
- issue: Bedeutung von לָעַד
  choice: als Zeugnis für immer und ewig
  alternative: für immer, bis in Ewigkeit
  rationale: Im Zusammenhang des schriftlich fixierten Wortes ist eine zeugnishafte Nuance möglich, doch das Wort kann auch rein temporal verstanden werden. Die Alternative wird daher ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Schreibhandlungen bleiben erhalten; „Schriftrolle“ vermeidet das anachronistische „Buch“. Die Fußnoten bewahren die zeitliche beziehungsweise mögliche endzeitliche Mehrdeutigkeit sowie die alternative rein temporale Deutung von לָעַד.
