  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: de
  text: 'Doch ihr habt gesagt: „Nein, auf Pferden werden wir fliehen; auf schnellen Pferden werden wir reiten.“ Darum werdet ihr fliehen; darum werden eure Verfolger schnell sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: Doch ihr habt gesagt
  rationale: Das Waw führt den Gedankengang fort; „Doch“ gibt im Zusammenhang den Gegensatz zu Gottes vorausgehender Mahnung wieder.
- source_word: לֹא כִּי
  choice: Nein!
  rationale: לֹא weist Gottes Angebot entschieden zurück; כִּי leitet hier die entgegengesetzte Absicht ein, die im Deutschen natürlich als anschließende direkte Aussage folgt.
- source_word: עַל סוּס נָנוּס
  choice: Auf Pferden werden wir fliehen
  rationale: סוּס steht kollektiv; der Plural ist im Deutschen idiomatisch. „Fliehen“ bewahrt die Wiederholung der Wurzel נוס in der göttlichen Antwort.
- source_word: עַל כֵּן תְּנוּסוּן
  choice: Darum werdet ihr fliehen
  rationale: 'Die Wiederholung von „fliehen“ erhält die prophetische Ironie: Der angekündigte Fluchtweg wird zum Gericht.'
- source_word: וְעַל קַל נִרְכָּב
  choice: 'Und: „Auf schnellen Tieren werden wir reiten“'
  rationale: קַל ist substantiviert und bezeichnet im Kontext schnelle Reittiere; „Tieren“ macht die Ellipse verständlich, ohne ausdrücklich nochmals „Pferde“ in den Haupttext einzusetzen.
- source_word: עַל כֵּן יִקַּלּוּ רֹדְפֵיכֶם
  choice: Darum werden eure Verfolger schnell sein
  rationale: Die Wiedergabe mit „schnell“ bewahrt die Wortverbindung zwischen קַל und יִקַּלּוּ sowie die ironische Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur, die zweimalige Folgerung „Darum“ und die Wortspiele um „fliehen“ und „schnell“ bleiben erhalten.
