source:
  edition: WLC
  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: de
  text: Und sein Atem ist wie ein reißender Strom[a], der bis an den Hals reicht, um die Nationen mit einem Sieb der Nichtigkeit[b] zu sieben; und ein Zaum, der in die Irre führt, liegt an den Kiefern der Völker[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Geist“ oder „sein Wind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit einem Sieb der Leere“, „mit einem Sieb der Falschheit“ oder „mit einem wertlosen Sieb“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein irreführender Zaum“; „Kiefern“ kann auch „Wangen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחוֹ
  choice: sein Atem
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. Im Zusammenhang der Gerichtserscheinung und des aus dem Mund JHWHs hervorgehenden Wirkens gibt „Atem“ das konkrete, zerstörerische Bild am besten wieder; die Alternativen bleiben in der Fußnote sichtbar.
- source_word: כְּנַחַל שׁוֹטֵף
  choice: wie ein überströmender Bach
  rationale: נַחַל bezeichnet einen Bach oder ein Wadi, שׁוֹטֵף ein Überfluten oder reißendes Dahinströmen. Die Formulierung bewahrt das Bild einer machtvollen Überschwemmung.
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: bis an den Hals reicht er
  rationale: חצה bedeutet gewöhnlich teilen oder spalten, wird im Flutbild hier jedoch plausibel als Angabe verstanden, wie hoch die Strömung reicht. Die ungewöhnliche Bildsprache wird verständlich wiedergegeben, ohne eine präzise Bewegung hinzuzusetzen.
- source_word: לַהֲנָפָה
  choice: er schüttelt
  rationale: Die Form von נוף bezeichnet ein Schwingen, Schütteln oder Sieben. Zusammen mit dem folgenden Sieb ist „schüttelt“ anschaulich und erhält zugleich die Vorstellung des Siebens.
- source_word: גוֹיִם
  choice: die Nationen
  rationale: גוֹיִם bezeichnet hier geopolitische Völkerverbände; „Nationen“ passt zum weltweiten Gerichtskontext.
- source_word: בְּנָפַת שָׁוְא
  choice: in einem Sieb der Nichtigkeit
  rationale: נָפָה ist ein Sieb; שָׁוְא kann Nichtigkeit, Leere, Falschheit oder Wertlosigkeit bedeuten. „Nichtigkeit“ wahrt die knappe und mehrdeutige Härte des Ausdrucks.
- source_word: רֶסֶן מַתְעֶה
  choice: ein Zaum, der sie in die Irre führt
  rationale: רֶסֶן ist Zaum beziehungsweise Zügel; מַתְעֶה bezeichnet aktiv etwas, das irreführt oder vom Weg abbringt. Ein Relativsatz klingt im Deutschen natürlicher und erhält den verursachenden Sinn.
- source_word: עַל לְחָיֵי עַמִּים
  choice: an den Kiefern der Völker
  rationale: לְחִי kann Wange oder Kiefer bedeuten. Beim Bild eines Zaums ist „Kiefer“ sachlich passend; עַמִּים wird zur Unterscheidung von גוֹיִם als „Völker“ wiedergegeben.
theological_decisions:
- issue: Bezug des Pronomens in „sein Atem“
  choice: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf den HERRN.
  alternative: Eine unpersönliche Sturmgewalt.
  rationale: Der Kontext schildert das Kommen des HERRN zum Gericht und die Wirkung seiner Stimme. „Sein“ bewahrt die persönliche göttliche Urheberschaft, ohne weitere dogmatische Aussagen einzutragen.
- issue: Funktion von Sieb und Zaum
  choice: Beide Bilder beschreiben das richtende und irreführende Handeln, dem die Völker ausgesetzt werden.
  alternative: Das Sieb könnte primär als Mittel der Ausscheidung und der Zaum lediglich als parallele Umschreibung verstanden werden.
  rationale: Der hebräische Text lässt die genaue Beziehung der beiden Metaphern offen. Die Übersetzung stellt sie nebeneinander und löst ihre theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei starken Metaphern – Flut und Zaum – bleiben konkret. Der Satz wird zur besseren Verständlichkeit gegliedert; die semantische Mehrdeutigkeit von רוּחַ, שָׁוְא und מַתְעֶה wird durch Fußnoten bewahrt.
