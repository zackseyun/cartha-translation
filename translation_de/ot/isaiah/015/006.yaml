source:
  edition: WLC
  text: כִּֽי מֵ֥י נִמְרִ֖ים מְשַׁמּ֣וֹת יִֽהְי֑וּ כִּֽי יָבֵ֤שׁ חָצִיר֙ כָּ֣לָה דֶ֔שֶׁא יֶ֖רֶק לֹ֥א הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
translation:
  language: de
  text: Denn die Wasser von Nimrim werden zur Einöde[a]. Das Gras ist verdorrt, das Grün ist verschwunden, und nichts Grünes ist mehr da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden verwüstet sein“ / „werden zu einer Wüste“. Die knappe hebräische Formulierung kann entweder die Wasser selbst als verwüstet beschreiben oder das Gebiet an den Wassern als zur Einöde geworden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי führt im Zusammenhang eine Begründung bzw. Erklärung der Klage ein. Vor dem zweiten כִּי gibt ein Punkt im Deutschen die gestufte Begründung natürlich wieder.
- source_word: מֵי נִמְרִים
  choice: die Wasser von Nimrim
  rationale: מֵי ist die Konstruktform im Plural; der Ortsname נִמְרִים wird als „Nimrim“ wiedergegeben.
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: werden zur Einöde werden
  rationale: Die prädikative Pluralform מְשַׁמּוֹת bezeichnet Verwüstung bzw. verwüstete Orte; היה kann hier „sein“ oder „werden“ bedeuten. Die Formulierung wahrt den Veränderungssinn und die schroffe Aussage, ohne im Deutschen den unnatürlichen abstrakten Plural „Verwüstungen“ zu erzwingen.
- source_word: יָבֵשׁ חָצִיר
  choice: Das Gras ist verdorrt
  rationale: Das Perfekt beschreibt den eingetretenen Zustand; „ist verdorrt“ ist natürlich und bildet das Austrocknen der Vegetation präzise ab.
- source_word: כָּלָה דֶשֶׁא
  choice: das Grün ist verschwunden
  rationale: דֶשֶׁא bezeichnet frischen Pflanzenwuchs; כָּלָה drückt dessen vollständiges Ende aus. „Das Grün“ ist im Deutschen breit genug und vermeidet eine künstliche Wiederholung von „Gras“.
- source_word: יֶרֶק לֹא הָיָה
  choice: nichts Grünes ist mehr da
  rationale: Die existentielle Verneinung besagt, dass keinerlei grüner Pflanzenwuchs vorhanden ist. „ist mehr da“ vermittelt idiomatisch den verbleibenden Zustand völliger Kahlheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildfolge bleibt knapp und kumulativ. Der doppelte Gebrauch von „werden“ in „werden zur Einöde werden“ ist grammatisch korrekt und bewahrt den möglichen Übergang in einen verwüsteten Zustand; die Fußnote hält die syntaktisch-lexikalische Mehrdeutigkeit ausdrücklich offen.
