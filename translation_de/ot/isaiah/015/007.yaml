  naturalness: Der Satz ist bereits gut verständlich. „Bach der Weiden“ bildet jedoch die hebräische Konstruktverbindung genauer und im heutigen Bibeldeutsch natürlicher ab als das zusammengeschriebene, stärker wie ein festes Eigennamen wirkende „Weidenbach“. Die umgestellte erste Nominalgruppe macht zudem klarer, dass der Überschuss aus dem Erworbensein resultiert.
  terminology: „Vorräte“ ist als kontextgerechte Hauptdeutung möglich, sofern die lexikalische Unsicherheit in der Fußnote genannt wird. „Wadi“ wird im Deutschen überwiegend sächlich verwendet; daher ist „das Wadi der Araba“ die idiomatisch sichere Form. „Araba“ ist die übliche deutsche Wiedergabe der geographischen Bezeichnung.
