  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
translation:
  language: de
  text: Darum tragen sie den Überschuss, den sie erworben haben, und ihre Vorräte über den Bach der Weiden[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das Wadi der Araba“ beziehungsweise „über das Tal der Wüstenebene“. Der hebräische Ausdruck ist unsicher; traditionell wird er als „Bach der Weiden“ verstanden.'
    reason: alternative_reading
  - marker: b
    text: Das mit „ihre Vorräte“ wiedergegebene hebräische Wort ist schwer zu deuten. Es kann auch „ihren Besitz“ oder „das ihnen Anvertraute“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה עָשָׂה
  choice: ihren erworbenen Überschuss
  rationale: יִתְרָה bezeichnet Überschuss, Rest oder Fülle. Zusammen mit עָשָׂה ist im Fluchtkontext wahrscheinlich das gemeint, was man erwirtschaftet oder erworben hat. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne ihn auf Geldvermögen zu verengen.
- source_word: וּפְקֻדָּתָם
  choice: und ihre Vorräte
  rationale: Das schwierige Substantiv kann auf Aufbewahrtes, Besitz oder Anvertrautes weisen. „Vorräte“ passt zum Parallelismus und zum Kontext des Forttragens, bleibt aber als unsichere Deutung gekennzeichnet.
- source_word: נַחַל
  choice: Bach
  rationale: נַחַל kann einen Bach, ein Bachtal oder einen nur zeitweise wasserführenden Wadi bezeichnen. „Bach“ ist im Deutschen allgemein verständlich; die topografische Alternative wird in der Fußnote genannt.
- source_word: הָעֲרָבִים
  choice: Weiden
  rationale: Die traditionelle Deutung verbindet das Wort mit Weiden beziehungsweise ähnlichen Bäumen und versteht die Wendung als Ortsbezeichnung „Weidenbach“. Eine mögliche Ableitung von Arabah oder Wüstenebene bleibt in der Fußnote erhalten.
- source_word: יִשָּׂאוּם
  choice: tragen sie
  rationale: נשׂא bedeutet „tragen, fortschaffen“. Das angehängte Pronomen bezieht sich auf die zuvor genannten Güter; im Deutschen kann das Objekt durch die vorangestellte Nominalgruppe ohne zusätzliches Pronomen ausgedrückt werden.
