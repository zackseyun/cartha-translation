  text: לִבִּ/י֙ לְ/מוֹאָ֣ב יִזְעָ֔ק בְּרִיחֶ֕/הָ עַד צֹ֖עַר עֶגְלַ֣ת שְׁלִשִׁיָּ֑ה כִּ֣י מַעֲלֵ֣ה הַ/לּוּחִ֗ית בִּ/בְכִי֙ יַֽעֲלֶה בּ֔/וֹ כִּ֚י דֶּ֣רֶךְ חוֹרֹנַ֔יִם זַעֲקַת שֶׁ֖בֶר יְעֹעֵֽרוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: de
  text: Mein Herz schreit auf um Moab. Moabs Flüchtlinge[a] fliehen bis nach Zoar, bis nach Eglat-Schelischija[b]. Denn die Steige von Luhit steigen sie unter Weinen hinauf[c]; denn auf dem Weg nach Horonajim erheben sie einen Schrei der Zerstörung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort בְּרִיחֶיהָ ist schwierig. Es kann „ihre Flüchtlinge“ bedeuten; wörtlicher lässt es sich auch als „ihre Riegel“ verstehen, was manche bildlich deuten oder aufgrund des Zusammenhangs textkritisch ändern.
    reason: lexical_alternative
  - marker: b
    text: Eglat-Schelischija ist wahrscheinlich ein Ortsname. Der Ausdruck kann auch wörtlich als „eine dreijährige Färse“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Die hebräischen Verben in diesem Vers wechseln zwischen Singular und Plural. Die Übersetzung verwendet hier den Plural, weil Moabs fliehende Bevölkerung als Gruppe gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: Mein Herz schreit auf um Moab
  rationale: Die körpernahe Metapher „mein Herz“ und der laute, schmerzerfüllte Ruf bleiben erhalten. „Um Moab“ gibt die Klage zugunsten bzw. angesichts Moabs natürlich wieder, ohne ihre genaue Nuance unnötig festzulegen.
- source_word: בְּרִיחֶיהָ
  choice: seine Flüchtlinge … fliehen
  rationale: Das schwierige Wort wird im Zusammenhang der Flucht als Bezeichnung für Flüchtlinge verstanden. Das ergänzte Verb „fliehen“ macht den im Hebräischen knappen Bewegungssinn im Deutschen verständlich; die wörtlichere Alternative wird in einer Fußnote genannt.
- source_word: עַד צֹעַר
  choice: bis nach Zoar
  rationale: עַד bezeichnet die räumliche Erstreckung; bei einem Ortsziel ist „bis nach“ idiomatisches Deutsch.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Eglat-Schelischija
  rationale: Im geografischen Zusammenhang ist wahrscheinlich ein Ortsname gemeint. Die Transliteration vermeidet, die unsichere Deutung als Tierbezeichnung in den Haupttext einzutragen.
- source_word: מַעֲלֵה הַלּוּחִית
  choice: die Steige von Luhit
  rationale: „Steige“ bezeichnet knapp und verständlich einen ansteigenden Weg und bewahrt den geografischen Charakter des Ausdrucks.
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: gehen sie weinend hinauf
  rationale: Das kollektive Subjekt wird im Deutschen im Plural ausgedrückt. „Weinend“ gibt die begleitende Klage natürlich wieder.
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: auf dem Weg nach Horonajim
  rationale: Die Formulierung bezeichnet im Kontext am natürlichsten den Weg, der nach Horonajim führt.
- source_word: זַעֲקַת שֶׁבֶר
  choice: einen Schrei über die Verwüstung
  rationale: שֶׁבֶר bezeichnet hier verheerenden Zusammenbruch oder Zerstörung. „Verwüstung“ passt zum Gerichtskontext und vermeidet das missverständliche wörtliche „Bruch“.
- source_word: יְעֹעֵרוּ
  choice: lassen sie … erschallen
  rationale: Das Verb hat den Grundsinn des Erweckens oder Erregens; zusammen mit „Schrei“ gibt „erschallen lassen“ die idiomatische Wirkung wieder.
