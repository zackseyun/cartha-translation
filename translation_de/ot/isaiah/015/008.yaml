  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: de
  text: Denn der Notschrei hat die Grenze Moabs umkreist[a]; bis nach Eglajim reicht sein Wehklagen, bis nach Beer-Elim sein Wehklagen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat die Grenze Moabs umschlossen“. Das hebräische Verb bewahrt das Bild, dass der Schrei rings um Moab zieht.'
    reason: lexical_alternative
  - marker: b
    text: Eglajim und Beer-Elim sind Ortsnamen. Beer-Elim kann möglicherweise „Brunnen der Götter“ oder „Brunnen der Mächtigen“ bedeuten.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Klage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הִקִּיפָה
  choice: ist rings um … gezogen
  rationale: Das Verb bezeichnet hier eine Bewegung ringsherum. Die Formulierung bewahrt das räumliche Bild, dass sich der Schrei um Moabs Grenze herum ausbreitet.
- source_word: הַזְּעָקָה
  choice: der Hilfeschrei
  rationale: זְעָקָה bezeichnet einen lauten Schrei aus Not. „Hilfeschrei“ vermittelt die Dringlichkeit und den Klagecharakter.
- source_word: אֶת גְּבוּל מוֹאָב
  choice: die Grenze Moabs
  rationale: גְּבוּל meint hier die geografische Grenze beziehungsweise das Grenzgebiet; die formnahe Wiedergabe erhält das Bild des hebräischen Textes.
- source_word: עַד
  choice: bis nach
  rationale: Die Präposition bezeichnet die räumliche Erstreckung bis zu den genannten Orten und wird vor Ortsnamen idiomatisch mit „bis nach“ wiedergegeben.
- source_word: אֶגְלַיִם
  choice: Eglajim
  rationale: Der Ortsname wird nach einer im Deutschen verständlichen hebräischen Lautumschrift wiedergegeben.
- source_word: יִלְלָתָהּ
  choice: sein Klagen
  rationale: יִלְלָה bezeichnet lautes Klagen oder Wehgeschrei. Das Possessivpronomen greift den grammatisch männlichen deutschen Ausdruck „Hilfeschrei“ auf; die Wiederholung beider Vorkommen bildet die hebräische Struktur ab.
- source_word: וּבְאֵר אֵילִים
  choice: und bis nach Beer-Elim
  rationale: Der mit וּ angeschlossene Ortsname setzt wahrscheinlich die Angabe der geografischen Reichweite fort. „Bis nach“ macht die parallele Beziehung zu Eglajim deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „sein Klagen“ ist bewusst beibehalten, um den poetischen Parallelismus und den Nachdruck des hebräischen Textes hörbar zu machen.
