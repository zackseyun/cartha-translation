base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: de
  text: Heschbon und Elale schreien laut; bis nach Jahaz ist ihre Stimme zu hören. Darum stoßen die gerüsteten Männer Moabs laute Schreie aus[a]; seine Seele verzagt in ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum stoßen Moabs Krieger einen Schlachtruf aus.“ Das hebräische Wort für „gerüstete Männer“ kann allgemeiner „Krieger“ bedeuten; das Verb kann einen lauten Ruf, im militärischen Zusammenhang auch einen Schlachtruf, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist schwer zu deuten. Möglich sind auch: „seine Seele ist in Not“ oder „seine Seele bebt in ihm“. Der Singular kann sich auf Moab als Ganzes beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: schreien laut
  rationale: Das Verb זעק bezeichnet einen lauten Not- oder Alarmruf. Der poetische Präsensgebrauch gibt die Unmittelbarkeit der prophetischen Schilderung natürlich wieder.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Heschbon und Elale
  rationale: Die Ortsnamen werden in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: עַד יַהַץ
  choice: bis nach Jahaz
  rationale: עַד bezeichnet hier die räumliche Reichweite des weithin hörbaren Rufes.
- source_word: נִשְׁמַע קוֹלָם
  choice: ist ihre Stimme zu hören
  rationale: קוֹל kann Stimme, Laut oder Ruf bedeuten. „Stimme“ bewahrt das hebräische Bild der personifiziert rufenden Städte.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet die folgende Reaktion als Folge des zuvor geschilderten Notrufs.
- source_word: חֲלֻצֵי מוֹאָב
  choice: die gerüsteten Männer Moabs
  rationale: חֲלֻצִים bezeichnet zum Kampf ausgerüstete beziehungsweise aufgebotene Männer. „Gerüstete Männer“ erhält diesen militärischen Sinn, ohne den folgenden Ruf ausdrücklich als Schlachtruf festzulegen.
- source_word: יָרִיעוּ
  choice: stoßen ... laute Schreie aus
  rationale: Das Hifil von רוע/ריע bezeichnet lautes Rufen oder Schreien und kann in militärischem Zusammenhang auch einen Schlachtruf meinen. Die gewählte Fassung lässt die Art des Rufes offen.
- source_word: נַפְשׁוֹ יָרְעָה לוֹ
  choice: seine Seele verzagt in ihm
  rationale: Die schwierige Schlusswendung beschreibt einen inneren Zusammenbruch oder tiefe Bestürzung. „Verzagt“ bewahrt den poetischen Ton; die auffälligen Singularsuffixe werden nicht stillschweigend in den Plural geändert.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Knappheit. Die Ortsnamen werden personifiziert wiedergegeben. Die ungewöhnlichen Singularformen im letzten Satz bleiben erhalten, damit die Mehrdeutigkeit des hebräischen Textes nicht durch eine Angleichung an die pluralischen Krieger beseitigt wird.
