  yaml_path: translation/ot/isaiah/015/003.yaml
  text: In its streets they put on sackcloth; on its rooftops and in its squares everyone wails[a], going down in weeping.
translation:
  language: de
  text: Auf seinen Straßen binden sie sich Sacktuch um; auf seinen Dächern und seinen Plätzen klagen alle laut und gehen weinend hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle klagen laut, hinabsteigend unter Weinen.“ Wörtlich steht im Hebräischen: „hinabgehend im Weinen“. Die Wendung kann tatsächliches Hinabgehen bezeichnen oder bildhaft ausdrücken, dass sie von Trauer überwältigt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחוּצֹתָיו
  choice: auf seinen Straßen
  rationale: חוּץ bezeichnet hier die offenen Bereiche der Stadt, gewöhnlich ihre Straßen. „Auf seinen Straßen“ ist im Deutschen natürlich und passt zur öffentlichen Trauerszene.
- source_word: חָגְרוּ שָׂק
  choice: legen sie Trauergewänder an
  rationale: חגר bedeutet wörtlich „sich umgürten“; zusammen mit שַׂק bezeichnet es das Anlegen eines groben Gewands als sichtbares Zeichen der Trauer. „Trauergewänder“ vermittelt die Funktion verständlich, ohne das heute missverständliche „Sacktuch“ in den Haupttext zu setzen.
- source_word: עַל גַּגּוֹתֶיהָ
  choice: auf seinen Dächern
  rationale: גַּגּוֹת bezeichnet die flachen Hausdächer, die als Orte öffentlicher Klage dienen konnten. Das Suffix bezieht sich auf die zuvor genannte Stadt; im Deutschen wird diese hier mit „seinen“ aufgenommen.
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: und auf seinen Plätzen
  rationale: רְחוֹבוֹת sind breite öffentliche Räume oder Plätze. „Plätze“ bewahrt die Unterscheidung zu den zuvor genannten Straßen.
- source_word: כֻּלֹּה
  choice: alle
  rationale: Die feminine Singularform meint im Zusammenhang kollektiv die gesamte Bevölkerung der Stadt. „Alle“ gibt diesen distributiven Sinn natürlich wieder.
- source_word: יְיֵלִיל
  choice: klagen laut
  rationale: ילל bezeichnet lautes, eindringliches Klagen oder Heulen. „Klagen laut“ bewahrt die Intensität, ohne im Deutschen unnötig tierhaft zu wirken.
- source_word: יֹרֵד בַּבֶּכִי
  choice: gehen weinend hinab
  rationale: יֹרֵד bedeutet wörtlich „hinabgehend“. Die Formulierung erhält die räumliche Bewegung und verbindet בַּבֶּכִי idiomatisch mit ihr; ob tatsächliches Hinabgehen oder bildhaftes Versinken in Trauer gemeint ist, bleibt offen.
