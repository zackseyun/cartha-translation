  naturalness: „Einen Löwen über die Flüchtlinge ... bringen“ ist im modernen Standarddeutsch keine natürliche Kollokation. Die revidierte Fassung gliedert die elliptische Aufzählung nach dem Doppelpunkt in einen eigenständigen, knappen prophetischen Satz und wahrt dadurch sowohl Verständlichkeit als auch Nachdruck.
  terminology: '„Dimon“, „Blut“, „Flüchtlinge Moabs“, „Übriggebliebene“ und „Löwe“ sind angemessen. Die Fußnote zu נוספות sollte nicht „Zusätzliches ... setzen“ als wörtliche Wiedergabe bezeichnen: Das Hebräische hat pluralisch „zusätzliche Dinge“ und das Verb bedeutet hier grundlegend „setzen/legen“, idiomatisch im Zusammenhang „auferlegen“.'
