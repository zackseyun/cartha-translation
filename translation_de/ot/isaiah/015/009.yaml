revisions:
- from: Denn die Wasser von Dimon sind voll Blut.[a] Ja, ich werde noch mehr über Dimon bringen:[b] einen Löwen über die Flüchtlinge Moabs[c] und über die Übriggebliebenen im Land.
  to: Denn die Wasser von Dimon sind voll Blut.[a] Ja, ich werde noch mehr über Dimon bringen:[b] Einen Löwen werde ich auf die Flüchtlinge Moabs[c] und auf die Übriggebliebenen im Land loslassen.
  rationale: Die Revision behebt die unidiomatische deutsche Rektion beim Löwen und präzisiert die Fußnote zur elliptischen pluralischen Form נוספות. „Loslassen“ expliziert nur die im deutschen Satzbau notwendige Beziehung zwischen Löwe und Betroffenen; die Referenz des Löwen bleibt bewusst offen. Die übrigen Entscheidungen des Entwurfs bleiben erhalten.
