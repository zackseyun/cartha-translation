source:
  edition: WLC
  text: כִּ֣י מֵ֤י דִימוֹן֙ מָ֣לְאוּ דָ֔ם כִּֽי אָשִׁ֥ית עַל דִּימ֖וֹן נוֹסָפ֑וֹת לִ/פְלֵיטַ֤ת מוֹאָב֙ אַרְיֵ֔ה וְ/לִ/שְׁאֵרִ֖ית אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: de
  text: Denn die Wasser von Dimon sind voll Blut.[a] Ja, ich werde noch mehr über Dimon bringen:[b] Einen Löwen werde ich auf die Flüchtlinge Moabs[c] und auf die Übriggebliebenen im Land loslassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei „Dimon“ könnte ein Wortspiel mit dem hebräischen Wort für „Blut“ (dam) vorliegen. Manche bringen den Ortsnamen mit Dibon in Verbindung.
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische lautet wörtlich etwa: „Ich werde zusätzliche Dinge über Dimon setzen.“ Es lässt unausgesprochen, worin das zusätzliche Unheil besteht.'
    reason: alternative_reading
  - marker: c
    text: Der „Löwe“ kann wörtlich gemeint oder ein Bild für weiteres Gericht sein.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: die Wasser von Dimon
  rationale: Der Pluralkonstrukt מֵי wird idiomatisch mit „die Wasser von“ wiedergegeben. Die masoretische Namensform Dimon bleibt erhalten und bewahrt den möglichen Anklang an דָם („Blut“).
- source_word: מָלְאוּ דָם
  choice: sind voll Blut
  rationale: מלא mit דָם beschreibt, dass die Wasser mit Blut angefüllt sind. „sind voll Blut“ ist im Deutschen knapp, natürlich und bildkräftig.
- source_word: כִּי ... כִּי
  choice: Denn ... Ja
  rationale: Das erste כִּי führt die Begründung des vorausgehenden Zusammenhangs fort; das zweite kann hier bekräftigend verstanden werden. Die Wiedergabe vermeidet ein schwerfälliges doppeltes „denn“ und erhält den prophetischen Nachdruck.
- source_word: אָשִׁית עַל דִּימוֹן נוֹסָפוֹת
  choice: ich werde noch mehr über Dimon bringen
  rationale: שׂים עַל bezeichnet das Auferlegen oder Herbeiführen; נוֹסָפוֹת steht substantivisch, ohne die zusätzlichen Heimsuchungen näher zu benennen. „noch mehr“ bewahrt diese Ellipse.
- source_word: לִפְלֵיטַת מוֹאָב
  choice: über die Flüchtlinge Moabs
  rationale: פְלֵיטָה bezeichnet Entkommene oder Überlebende. Im Zusammenhang von Flucht und Verwüstung gibt „Flüchtlinge“ den Ausdruck anschaulich wieder; ל wird im Zusammenhang mit dem angekündigten Löwen als dessen Ziel verstanden.
- source_word: אַרְיֵה
  choice: einen Löwen
  rationale: Das konkrete Bild des hebräischen Singulars wird ohne Deutung beibehalten.
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: und über die Übriggebliebenen im Land
  rationale: שְׁאֵרִית bezeichnet den Rest beziehungsweise die Verbliebenen; אֲדָמָה hat hier räumlichen Sinn. Die personenbezogene Fassung passt zum parallelen „Flüchtlinge Moabs“ und ist im Deutschen natürlicher als „Rest des Landes“.
theological_decisions:
- issue: Wesen des in der Gerichtsankündigung genannten Löwen
  choice: Das konkrete Bild „einen Löwen“ bleibt im Haupttext ungedeutet.
  alternative: Ein buchstäblicher Löwe oder ein Bild für eine Invasionsmacht beziehungsweise weiteres Gericht.
  rationale: Der hebräische Text benennt den Löwen, legt aber dessen Referenz nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die Ortsnamenform „Dimon“, die Ellipse bei „noch mehr“ und die Mehrdeutigkeit des Löwenbildes bleiben erhalten.
