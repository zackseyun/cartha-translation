  text: עָלָ֨ה הַ/בַּ֧יִת וְ/דִיבֹ֛ן הַ/בָּמ֖וֹת לְ/בֶ֑כִי עַל נְב֞וֹ וְ/עַ֤ל מֵֽידְבָא֙ מוֹאָ֣ב יְיֵלִ֔יל בְּ/כָל רֹאשָׁ֣י/ו קָרְחָ֔ה כָּל זָקָ֖ן גְּרוּעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: de
  text: Zum Tempel ist man hinaufgestiegen und Dibon zu den Kulthöhen, um zu weinen.[a] Über Nebo und über Medeba wehklagt Moab; jeder Kopf ist kahl[b], jeder Bart ist abgeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der Vers: „Er ist zum Haus hinaufgestiegen, und Dibon zu den Kulthöhen, zum Weinen.“ „Das Haus“ kann hier ein Heiligtum meinen. Die knappe hebräische Formulierung nach „Dibon“ ist mehrdeutig: Dibon kann als weiterer Zielort verstanden werden oder metonymisch für seine Bewohner stehen, die zu den Kulthöhen hinaufsteigen.'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Kahlheit und das Abschneiden des Bartes waren Zeichen der Trauer.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: ist man hinaufgestiegen
  rationale: Das Qal Perfekt bezeichnet hier ein vollzogenes Hinaufgehen. Das unpersönliche „man“ vermeidet ein im Deutschen unbegründetes männliches Pronomen und lässt den im Hebräischen nicht ausdrücklich genannten Handelnden offen.
- source_word: הַבַּיִת
  choice: zum Tempel
  rationale: Wörtlich steht „zum Haus“. Zusammen mit den Kulthöhen bezeichnet es im Kontext wahrscheinlich ein Heiligtum oder einen Tempel; die wörtliche Möglichkeit wird in der Fußnote bewahrt.
- source_word: וְדִיבֹן הַבָּמוֹת
  choice: und in Dibon zu den Kulthöhen
  rationale: Die knappe hebräische Reihung lässt Beziehungen und ausgelassene Präpositionen unausgesprochen. Die Wiedergabe versteht Dibon als Ort, an dem man zu den kultischen Höhen hinaufsteigt, und kennzeichnet die syntaktische Mehrdeutigkeit in der Fußnote.
- source_word: לְבֶכִי
  choice: um zu weinen
  rationale: Die Präposition mit dem Substantiv „Weinen“ drückt hier Zweck oder Ziel aus; der deutsche Infinitiv gibt dies natürlich wieder.
- source_word: יְיֵלִיל
  choice: wehklagt
  rationale: Das Verb bezeichnet lautes Klagen. „Wehklagt“ bewahrt Stärke und Trauercharakter in würdigem, verständlichem Deutsch.
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: jeder Kopf ist kahl
  rationale: Die auf das kollektiv gebrauchte „Moab“ bezogene Wendung wird distributiv wiedergegeben. „Kahl“ vermittelt den nominalen Ausdruck „Kahlheit“, ohne im Deutschen unnatürlich zu wirken.
- source_word: כָּל זָקָן גְּרוּעָה
  choice: jeder Bart abgeschnitten
  rationale: Die knappe Nominalkonstruktion und ihre Parallelität zum vorherigen Satzglied bleiben erhalten; das Abschneiden des Bartes ist als Trauerzeichen gemeint.
