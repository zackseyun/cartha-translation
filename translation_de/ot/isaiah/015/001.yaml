source:
  edition: WLC
  text: מַשָּׂ֖א מוֹאָ֑ב כִּ֠י בְּ/לֵ֞יל שֻׁדַּ֨ד עָ֤ר מוֹאָב֙ נִדְמָ֔ה כִּ֗י בְּ/לֵ֛יל שֻׁדַּ֥ד קִיר מוֹאָ֖ב נִדְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: de
  text: Ein Ausspruch über Moab:[a] Denn in einer Nacht[b] ist Ar-Moab verwüstet, vernichtet; denn in einer Nacht ist Kir-Moab verwüstet, vernichtet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch »Last« oder »Botschaft« bedeuten; hier leitet es einen prophetischen Ausspruch über Moab ein.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in einer Nacht«. Die Formulierung hebt hervor, wie plötzlich die Verwüstung eintritt; möglich wäre auch die Wiedergabe »über Nacht«.'
    reason: lexical_alternative
  - marker: c
    text: Das mit »vernichtet« wiedergegebene hebräische Verb kann auch »ausgelöscht«, »abgeschnitten« oder »zum Schweigen gebracht« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort häufig eine gewichtige, meist gerichtliche Botschaft. »Ausspruch« gibt diese Gattungsfunktion verständlich wieder, ohne die mögliche wörtliche Bedeutung »Last« zum alleinigen Sinn zu machen.
- source_word: מוֹאָב
  choice: Moab
  rationale: Die geläufige deutsche Form des Orts- und Volksnamens wird beibehalten.
- source_word: כִּי
  choice: denn
  rationale: »Denn« bewahrt die begründende beziehungsweise erläuternde Funktion und passt zum gehobenen prophetischen Stil; auch eine bekräftigende Nuance ist möglich.
- source_word: בְּלֵיל
  choice: in einer Nacht
  rationale: Die knappe Formulierung hält die Betonung der plötzlichen Vernichtung innerhalb nur einer Nacht fest, ohne sie idiomatisch zu »über Nacht« umzudeuten.
- source_word: שֻׁדַּד
  choice: ist verwüstet
  rationale: Das passive Verb bezeichnet gewaltsame Verheerung oder Plünderung. »Verwüstet« ist kräftig, setzt aber nicht zwingend völlige Auslöschung voraus.
- source_word: עָר מוֹאָב
  choice: Ar-Moab
  rationale: Die Bindestrichform behandelt die Verbindung als Namen der moabitischen Stadt und bleibt zugleich nahe an der hebräischen Namensform.
- source_word: נִדְמָה
  choice: vernichtet
  rationale: Im Zusammenhang mit dem Untergang der Städte bezeichnet das Verb wahrscheinlich ihr Ende oder ihre Beseitigung. Eine Bedeutung wie »zum Schweigen gebracht« bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: קִיר מוֹאָב
  choice: Kir-Moab
  rationale: Die Bindestrichform gibt den Eigennamen knapp und in Übereinstimmung mit Ar-Moab wieder.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller prophetischer Stil mit bewusst erhaltener Wiederholung und Parallelstruktur. Die beiden Ortsnamen werden einheitlich mit Bindestrich geschrieben. Das asyndetische Nebeneinander von »verwüstet, vernichtet« spiegelt die gedrängte Wucht des Hebräischen.
