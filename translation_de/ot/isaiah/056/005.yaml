base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: de
  text: Und ich werde ihnen in meinem Haus und innerhalb meiner Mauern ein Denkmal und einen Namen geben, besser als Söhne und Töchter; einen ewigen Namen werde ich ihm[a] geben, der nicht ausgelöscht wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text wechselt hier von der Mehrzahl „ihnen“ zur Einzahl „ihm“.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „der nicht abgeschnitten wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und … gebe ich
  rationale: נתן bedeutet gewöhnlich „geben“. Das deutsche Präsens hat hier aufgrund des prophetischen Zusammenhangs futurische Bedeutung und lässt die Wiederholung des Verbs natürlich hervortreten.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pluralpronomen verweist auf die zuvor angesprochene Gruppe und bleibt im ersten Satzteil erhalten.
- source_word: בְּבֵיתִי וּבְחֹמֹתַי
  choice: in meinem Haus und innerhalb meiner Mauern
  rationale: „Haus“ bewahrt die konkrete Bezeichnung, ohne sie im Haupttext ausdrücklich als Tempel auszulegen; „innerhalb meiner Mauern“ bezeichnet den Ort im ummauerten heiligen Bereich.
- source_word: יָד וָשֵׁם
  choice: ein Denkmal und einen Namen
  rationale: יָד bedeutet wörtlich „Hand“, bezeichnet in dieser Verbindung jedoch ein Erinnerungszeichen bzw. Denkmal. „Denkmal“ bewahrt die konkrete, dauerhafte Bildhaftigkeit, während „Name“ wörtlich wiedergegeben wird.
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: besser als Söhne und Töchter
  rationale: Die Vergleichskonstruktion wird direkt wiedergegeben; „Söhne und Töchter“ bewahrt die ausdrückliche hebräische Paarung.
- source_word: שֵׁם עוֹלָם
  choice: einen ewigen Namen
  rationale: עוֹלָם bezeichnet hier bleibende, nicht endende Dauer; „ewig“ ist im Deutschen natürlich und würdevoll.
- source_word: אֶתֶּן לוֹ
  choice: gebe ich ihm
  rationale: Der masoretische Text wechselt vom Plural לָהֶם zum Singular לוֹ. Dieser Wechsel wird bewahrt und nicht stillschweigend angeglichen.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: der nicht ausgelöscht wird
  rationale: כרת im Nifal bedeutet „abgeschnitten/ausgerottet werden“. Bei einem Namen gibt „ausgelöscht“ den natürlichen deutschen Sinn wieder; eine Fußnote bewahrt das wörtliche Bild und seine Resonanz.
theological_decisions:
- issue: Idiomatische Wiedergabe von יָד וָשֵׁם
  choice: ein Denkmal und einen Namen
  alternative: eine Hand und einen Namen; ein Erinnerungszeichen und einen Namen
  rationale: Die wörtliche Wiedergabe „Hand“ wäre im Deutschen undurchsichtig. „Denkmal“ vermittelt den konkreten Gedanken eines bleibenden Erinnerungszeichens, ohne den „Namen“ zu paraphrasieren.
- issue: Numeruswechsel von לָהֶם zu לוֹ
  choice: „ihnen“ … „ihm“
  alternative: durchgehend „ihnen“; „jedem von ihnen“
  rationale: Der Wechsel vom Plural zum Singular gehört zum hebräischen Text und kann die Zusage auf den Einzelnen innerhalb der Gruppe zuspitzen. Die Übersetzung erhält die Spannung, statt sie zu harmonisieren.
- issue: Bildsprache in אֲשֶׁר לֹא יִכָּרֵת
  choice: im Haupttext „nicht ausgelöscht“, mit wörtlicher Alternative in der Fußnote
  alternative: nicht abgeschnitten
  rationale: „Ein Name wird nicht ausgelöscht“ ist im heutigen Deutsch verständlich und idiomatisch. Die Fußnote erhält das konkrete Bild des Abschneidens, das im Kontext der Nachkommenschaft besondere Resonanz hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt durch die Wiederholung „gebe ich“ die göttliche Zusage hervor. „Haus“ bleibt bewusst uninterpretierend stehen; der echte Numeruswechsel des Hebräischen wird im Haupttext bewahrt.
