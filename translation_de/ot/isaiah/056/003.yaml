  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: de
  text: 'Der Fremde, der sich dem HERRN angeschlossen hat, soll nicht sagen: »Der HERR wird mich gewiss von seinem Volk ausschließen.« Und der Eunuch soll nicht sagen: »Sieh, ich bin ein dürrer Baum.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־הַנֵּכָר
  choice: der Fremde
  rationale: Die hebräische Wendung bezeichnet einen Menschen aus einem fremden Volk; im Deutschen gibt »der Fremde« den sozialen und ethnischen Status knapp und natürlich wieder.
- source_word: הַנִּלְוָה אֶל־יְהוָה
  choice: der sich dem HERRN angeschlossen hat
  rationale: Das reflexiv gebrauchte Verb לוה bezeichnet hier den bewussten Anschluss an den HERRN; die vollendete Form wird durch »angeschlossen hat« bewahrt.
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: wird mich gewiss … ausschließen
  rationale: Infinitiv absolutus plus finites Verb verstärkt die Aussage. »Gewiss« bildet die Verstärkung ab; »ausschließen« gibt die hier gemeinte Trennung von der Volksgemeinschaft idiomatisch wieder.
- source_word: הַסָּרִיס
  choice: der Eunuch
  rationale: Die direkte, etablierte deutsche Entsprechung bewahrt die konkrete körperliche und gesellschaftliche Lage des Betroffenen.
- source_word: הֵן
  choice: Sieh doch
  rationale: Die Aufmerksamkeitspartikel hebt die bittere Selbsteinschätzung hervor; »Sieh doch« ist gegenwärtig und würdevoll.
- source_word: עֵץ יָבֵשׁ
  choice: ein dürrer Baum
  rationale: Das Bild bezeichnet einen vertrockneten, unfruchtbaren Baum. »Dürr« bewahrt die metaphorische Kraft und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Gottesname יהוה
  choice: HERR in Kapitälchenschreibweise
  alternative: JHWH oder Jahwe
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den Eigennamen, ohne eine unsichere Rekonstruktion seiner Aussprache festzuschreiben.
- issue: Bedeutung der Trennung vom Volk
  choice: von seinem Volk ausschließen
  alternative: von seinem Volk absondern
  rationale: Im Kontext spricht der Fremde von befürchteter Nichtzugehörigkeit zur Bundesgemeinschaft. »Ausschließen« macht diese relationale und gemeinschaftliche Dimension verständlich, ohne den Grund dafür dogmatisch festzulegen.
- issue: Metapher des dürren Baumes
  choice: Metapher unverändert stehen lassen
  alternative: erklärend mit Kinderlosigkeit oder Unfruchtbarkeit übersetzen
  rationale: Der unmittelbare Kontext legt fehlende Nachkommenschaft nahe, doch der Bildausdruck selbst ist weiter und soll nicht im Haupttext auf nur eine Deutung reduziert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufforderungsstruktur »soll nicht sagen« bleibt erhalten. Die Rede klingt natürlich, ohne die starke Gewissheit des Fremden oder das eindringliche Bild des Eunuchen abzuschwächen.
