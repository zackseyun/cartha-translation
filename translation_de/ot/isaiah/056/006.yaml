reference: Isaiah 56:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: de
  text: Und die Fremden[a], die sich Jahwe anschließen, um ihm zu dienen, den Namen Jahwes zu lieben und seine Diener[b] zu sein – jeder, der den Sabbat hält, ohne ihn zu entweihen, und an meinem Bund festhält –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne des Fremden« oder »die Söhne der Fremde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Sklaven«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: Und die Fremden[a]
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne des Fremden/der Fremde«, bezeichnet hier aber idiomatisch Menschen fremder Herkunft. »Die Fremden« ist im heutigen Deutsch natürlich und schließt die angesprochene Gruppe als Ganze ein; die konkrete hebräische Ausdrucksweise wird in der Fußnote dokumentiert.
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: die sich Jahwe anschließen
  rationale: Das Nifal-Partizip von לוה bezeichnet ein Sich-Anschließen beziehungsweise eine verbindliche Zugehörigkeit. Die reflexive Form und der Gedanke bewusster Hinwendung bleiben erhalten.
- source_word: לְשָׁרְתוֹ
  choice: um ihm zu dienen
  rationale: שרת bezeichnet besonders den Dienst für Gott beziehungsweise im Heiligtum. »Ihm zu dienen« ist im Deutschen würdig und verständlich, ohne den Ausdruck unnötig auf einen bestimmten kultischen Dienst einzuengen.
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: den Namen Jahwes zu lieben
  rationale: Die ausdrückliche Rede vom Namen Jahwes wird bewahrt, da sie die ehrfürchtige und bundeshafte Beziehung bezeichnet und nicht einfach zu »Jahwe zu lieben« verkürzt werden sollte.
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: seine Diener[b] zu sein
  rationale: עֲבָדִים kann Diener oder Sklaven bezeichnen. Im Zusammenhang freiwilliger Hinwendung und Gottesdienstes gibt »Diener« den Schwerpunkt natürlich wieder; die stärkere mögliche Bedeutung wird in der Fußnote genannt.
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: jeder, der den Sabbat hält, ohne ihn zu entweihen
  rationale: כָּל mit dem singularischen Partizip hat distributiven Sinn, daher »jeder, der«. Die Konstruktion mit מן wird idiomatisch als Bewahrung vor Entweihung wiedergegeben.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: und an meinem Bund festhält
  rationale: חזק mit ב bezeichnet hier ein festes Ergreifen beziehungsweise Festhalten. »An meinem Bund festhalten« ist im Deutschen die natürliche und inhaltlich präzise Formulierung. Der Singular folgt der distributiven Konstruktion »jeder, der«, obwohl der hebräische Text hier zum Pluralpartizip wechselt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bundeszugehörigkeit von Menschen fremder Herkunft
  choice: Die Fremden werden als Menschen dargestellt, die sich Jahwe selbst anschließen und an seinem Bund festhalten.
  alternative: Die wörtliche, aber im Deutschen missverständliche Formulierung »Söhne der Fremde« im Haupttext.
  rationale: Der Text spricht Menschen fremder Herkunft volle Zugehörigkeit durch Anschluss an Jahwe, Liebe zu seinem Namen, Dienst und Bundestreue zu. Die Übersetzung wahrt diese Aussage, ohne spätere konfessionelle Folgerungen in den Vers hineinzutragen.
- issue: Bedeutungsumfang von עֲבָדִים
  choice: Diener
  alternative: Sklaven
  rationale: Beide Bedeutungen sind lexikalisch möglich. Hier steht der hingebungsvolle Dienst für Jahwe im Vordergrund; »Diener« passt deshalb besser in den Kontext, während die Alternative in einer Fußnote sichtbar bleibt.
- issue: Numeruswechsel bei כָּל שֹׁמֵר … וּמַחֲזִיקִים
  choice: 'Distributiver Singular: »jeder, der … festhält«'
  alternative: 'Pluralisch: »alle, die … festhalten«'
  rationale: Der Singular von שֹׁמֵר nach כָּל stützt die distributive Wiedergabe. Das folgende pluralische מַחֲזִיקִים bezieht sich inhaltlich auf die gesamte Gruppe; im Deutschen wird der Satz grammatisch an »jeder« angeglichen, ohne die Bedeutung zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich am Versende bleibt stehen, weil der Satz in Vers 7 fortgeführt wird. Die Formulierung ist nah an der hebräischen Satzstruktur, vermeidet jedoch im heutigen Deutsch unnatürliche oder missverständliche Idiome.
