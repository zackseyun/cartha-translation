  variant: modern standard German
source:
  edition: WLC
  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: de
  text: 'Ausspruch des Herrn Jahwe,[a] der die Verstoßenen Israels sammelt: Ich werde noch weitere zu ihm sammeln, zu seinen bereits Versammelten hinzu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch אֲדֹנָי יְהוָה (Adonaj JHWH), wörtlich „Herr Jahwe“. Manche Übersetzungen geben den Gottesnamen hier mit „GOTT“ oder „HERR“ wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde noch weitere zu ihnen sammeln, zu ihren bereits Versammelten hinzu.“ Die hebräischen Suffixe stehen im Singular; sie können kollektiv auf Israel bezogen werden. Auch ein Bezug auf Zion oder das Land wird erwogen.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv bezeichnet einen feierlichen göttlichen Ausspruch. „Ausspruch“ bewahrt die nominale Form und entspricht dem würdevollen prophetischen Sprachgebrauch.
- source_word: אֲדֹנָי יְהוָה
  choice: des Herrn Jahwe
  rationale: Die Wiedergabe bildet sowohl אֲדֹנָי („Herr“) als auch den Gottesnamen יהוה („Jahwe“) ab, ohne beide Bestandteile zu einem interpretierenden Titel zu verschmelzen.
- source_word: מְקַבֵּץ
  choice: der … sammelt
  rationale: Das Partizip beschreibt Jahwe als denjenigen, der sammelt; der deutsche Relativsatz ist klar und idiomatisch.
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: die Verstoßenen Israels
  rationale: נדח bezeichnet Menschen, die fortgetrieben, verstoßen oder zerstreut wurden. „Verstoßene“ bewahrt stärker als „Zerstreute“ den Aspekt des Weggetriebenseins.
- source_word: עוֹד
  choice: noch weitere
  rationale: Im Zusammenhang kündigt das Adverb eine zusätzliche Sammlung über die bereits Gesammelten hinaus an.
- source_word: אֲקַבֵּץ
  choice: Ich werde … sammeln
  rationale: Die Imperfektform bringt hier im göttlichen Ausspruch eine zukünftige Absicht beziehungsweise Verheißung zum Ausdruck.
- source_word: עָלָיו
  choice: zu ihm
  rationale: Die Übersetzung bewahrt den maskulinen Singularsuffix und damit die mögliche kollektiv-personifizierte Bezugnahme auf Israel, statt ihn stillschweigend in einen Plural umzuwandeln.
- source_word: לְנִקְבָּצָיו
  choice: zusätzlich zu denen, die bereits bei ihm versammelt sind
  rationale: Die Form bezeichnet seine beziehungsweise die bei ihm Gesammelten; im Satzgefüge hat לְ additive Kraft. Die ausformulierte Wendung gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוָה
  choice: Herr Jahwe
  alternative: GOTT, der Herr; der Herr, der HERR
  rationale: „Herr Jahwe“ lässt sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה erkennen und vermeidet die im Deutschen schwer verständliche Verdoppelung „Herr HERR“.
- issue: Bezug der Singularsuffixe in עָלָיו und לְנִקְבָּצָיו
  choice: 'Singular als kollektiv-personifizierte Bezugnahme: „zu ihm … bei ihm“'
  alternative: 'Pluralische Sinndeutung: „zu ihnen … bei ihnen“; möglicherweise Bezug auf Zion oder das Land'
  rationale: Der hebräische Text verwendet maskuline Singularsuffixe. Der Haupttext bewahrt diese Form und legt ihren umstrittenen Bezug nicht durch eine pluralische Glättung fest; die alternative Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Eingang. Die Satzstruktur bleibt nah am Hebräischen, wird jedoch durch „zusätzlich zu“ idiomatisch verdeutlicht. Die ungewöhnlichen Singularbezüge werden im Haupttext erhalten und in der Fußnote erklärt.
