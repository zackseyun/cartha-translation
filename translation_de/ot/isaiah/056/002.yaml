  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: de
  text: 'Glücklich ist der Mensch, der dies tut, und der Mensch, der daran festhält: der den Sabbat hält, ohne ihn zu entweihen, und seine Hand davon abhält, irgendetwas Böses zu tun.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Gibt die hebräische Glückseligpreisung idiomatisch und würdig wieder.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Bezeichnet hier den sterblichen Menschen allgemein; die natürliche deutsche Wiedergabe vermeidet eine unnötige Beschränkung auf Männer.
- source_word: בֶן אָדָם
  choice: der Menschensohn
  rationale: Bewahrt die parallele hebräische Ausdrucksweise und ihre wörtliche Bildlichkeit, ohne den Ausdruck als Titel kenntlich zu machen.
- source_word: יַחֲזִיק בָּהּ
  choice: der daran festhält
  rationale: Gibt das beharrliche Ergreifen beziehungsweise Festhalten an dem zuvor Gesagten wieder.
- source_word: שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: der den Sabbat bewahrt und ihn nicht entweiht
  rationale: Bewahrt sowohl das aktive Hüten als auch das Vermeiden der Entweihung in natürlichem Deutsch.
- source_word: כָּל רָע
  choice: irgendetwas Böses
  rationale: Gibt die umfassende Verneinung des hebräischen Ausdrucks idiomatisch wieder.
theological_decisions:
- issue: Bezug von „dies“ und „daran“
  choice: Die Pronomen bleiben ohne erklärenden Zusatz stehen.
  alternative: Ausdrückliche Festlegung auf Recht und Gerechtigkeit aus Vers 1 oder auf die folgenden Sabbat- und Ethikgebote.
  rationale: Der hebräische Text lässt den Bezug im unmittelbaren Zusammenhang erschließen, legt ihn grammatisch aber nicht abschließend auf nur eine Möglichkeit fest.
- issue: Verhältnis der beiden Partizipialaussagen zum Vorhergehenden
  choice: Wiedergabe nach einem Doppelpunkt als nähere Kennzeichnung des glücklichen Menschen.
  alternative: Unterordnung mit „indem er“ oder Relativsätze ohne Doppelpunkt.
  rationale: Der Doppelpunkt erhält den erläuternden Charakter, ohne eindeutig kausal oder instrumental zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des Hebräischen bleibt erkennbar; die Formulierung ist zugleich für gewöhnliche Leser verständlich.
