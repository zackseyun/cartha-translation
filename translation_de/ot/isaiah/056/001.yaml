source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: de
  text: 'So spricht Jahwe: »Wahrt das Recht und übt Gerechtigkeit! Denn bald kommt meine Rettung[a], und meine Gerechtigkeit[b] wird offenbar.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mein Heil.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: mein Recht; auch: mein Recht schaffendes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Verkündigungscharakter. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: Wahrt das Recht
  rationale: »Wahren« drückt die aufmerksame und beständige Beachtung aus; »das Recht« bezeichnet hier die gerechte Ordnung und das rechte Urteil.
- source_word: וַעֲשׂוּ צְדָקָה
  choice: und übt Gerechtigkeit
  rationale: »Üben« gibt das konkrete Tun idiomatisch wieder und hält »Gerechtigkeit« von dem verwandten Begriff מִשְׁפָּט unterschieden.
- source_word: כִּי קְרוֹבָה יְשׁוּעָתִי לָבוֹא
  choice: Denn bald kommt meine Rettung
  rationale: Die natürliche deutsche Formulierung gibt die unmittelbar bevorstehende Ankunft der göttlichen Rettung wieder. »Rettung« bewahrt den Gedanken göttlicher Befreiung, ohne ihn unnötig einzuengen.
- source_word: וְצִדְקָתִי לְהִגָּלוֹת
  choice: und meine Gerechtigkeit wird offenbar
  rationale: Die passive Bedeutung von גלה bleibt erhalten. »Gerechtigkeit« lässt sowohl Gottes gerechtes Wesen als auch sein rettendes und Recht schaffendes Handeln anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen Gottes. »Jahwe« gibt ihn transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: das Recht … Gerechtigkeit
  alternative: Gerechtigkeit … das Rechte
  rationale: Die beiden eng verwandten ethischen Begriffe werden nicht zu einem einzigen deutschen Begriff eingeebnet.
- issue: Bedeutung von Gottes צְדָקָה
  choice: meine Gerechtigkeit
  alternative: mein Recht / mein Recht schaffendes Handeln
  rationale: Die Hauptfassung wahrt die Spannung zwischen Gottes gerechtem Wesen, seinem gerechten Handeln und seiner rettenden Rechtfertigung; die Fußnote nennt mögliche sachliche Akzente.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzstruktur. Die Imperative stehen im Plural. Die Parallelität der beiden Aufforderungen und der beiden folgenden Heilstaten bleibt erkennbar.
