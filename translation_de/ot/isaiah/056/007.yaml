    rationale: Die Quelle sagt wörtlich „Haus meines Gebets“ bzw. idiomatisch „Haus des Gebets“ und wiederholt anschließend „mein Haus – Haus des Gebets“. „Haus des Gebets“ bewahrt diese Wiederholung und ist im modernen Standarddeutsch für diese biblische Wendung idiomatischer.
  - severity: low
