  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: de
  text: Ich werde sie zu meinem heiligen Berg bringen und ihnen in meinem Haus des Gebets Freude schenken. Ihre Brandopfer und ihre Schlachtopfer werden mir auf meinem Altar wohlgefällig sein; denn mein Haus wird ein Haus des Gebets für alle Völker[a] genannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für alle Nationen“. Das hebräische עַמִּים kann Völker oder Nationen bezeichnen; „Völker“ bringt hier die umfassende ethnische Bedeutung zum Ausdruck.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: Ich werde sie … bringen
  rationale: Der Hifil von בוא mit Gott als Subjekt bezeichnet, dass Gott selbst ihr Kommen veranlasst. „Ich werde sie bringen“ gibt diese göttliche Initiative natürlich und direkt wieder.
- source_word: אֶל הַר קָדְשִׁי
  choice: zu meinem heiligen Berg
  rationale: Die Wendung bezeichnet den heiligen Berg Gottes, im Kontext den Zion beziehungsweise den Tempelberg. „Heiliger Berg“ bewahrt die sakrale Bedeutung und ist im Deutschen geläufig.
- source_word: וְשִׂמַּחְתִּים
  choice: und ihnen … Freude schenken
  rationale: Der Piel von שׂמח drückt aus, dass Gott Freude bewirkt. Die gewählte Formulierung ist idiomatisch und bewahrt Gottes aktive Rolle.
- source_word: בְּבֵית תְּפִלָּתִי
  choice: in meinem Gebetshaus
  rationale: Die Wendung charakterisiert den Tempel ausdrücklich als Ort des Gebets. „Gebetshaus“ ist prägnant und bewahrt diesen engeren Sinn gegenüber dem allgemeineren „Haus der Anbetung“.
- source_word: עוֹלֹתֵיהֶם
  choice: ihre Brandopfer
  rationale: עוֹלָה ist der feste kultische Ausdruck für ein vollständig auf dem Altar verbranntes Opfer. „Brandopfer“ ist die gebräuchliche deutsche Entsprechung.
- source_word: וְזִבְחֵיהֶם
  choice: und ihre Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer und steht hier neben dem spezifischen Brandopfer. „Schlachtopfer“ erhält die kultische Unterscheidung, ohne den Begriff zu verallgemeinern.
- source_word: לְרָצוֹן
  choice: wohlgefällig angenommen
  rationale: Im Opferkontext bezeichnet רָצוֹן die gnädige Annahme beziehungsweise das Wohlgefallen Gottes. Die Formulierung verbindet beide Aspekte und bleibt im Deutschen verständlich.
- source_word: עַל מִזְבְּחִי
  choice: auf meinem Altar
  rationale: Dies ist die direkte und natürliche Wiedergabe der Präpositionalphrase.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aussage. „Denn“ bewahrt den erklärenden Zusammenhang in gehobenem, aber gegenwärtigem Deutsch.
- source_word: בֵּיתִי בֵּית תְּפִלָּה
  choice: mein Haus wird ein Haus des Gebets … genannt werden
  rationale: Die Wiederholung von בַּיִת bleibt erhalten und hebt die Bestimmung des Hauses Gottes als Gebetsort hervor.
- source_word: יִקָּרֵא
  choice: wird … genannt werden
  rationale: Der Nifal von קרא hat hier den üblichen passiven Sinn „genannt werden“. Das Futur gibt den noch ausstehenden deklarativen Charakter wieder.
- source_word: לְכָל הָעַמִּים
  choice: für alle Völker
  rationale: עַמִּים kann „Völker“ oder „Nationen“ bezeichnen. „Völker“ bewahrt den ethnisch-korporativen und umfassenden Sinn, ohne moderne Nationalstaaten nahezulegen; ל wird zweck- beziehungsweise begünstigend verstanden.
theological_decisions:
- issue: Reichweite von לְכָל הָעַמִּים
  choice: für alle Völker
  alternative: für alle Nationen
  rationale: Der Zusammenhang bezieht ausdrücklich Fremde in den Gottesdienst ein. „Alle Völker“ bewahrt diesen universalen Horizont, ohne die fortbestehende Bundes- und Tempelperspektive des Abschnitts über den Wortlaut hinaus aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebetshaus“, „Brandopfer“ und „Schlachtopfer“ bewahren die kultische Begrifflichkeit, während „Freude schenken“ und „wohlgefällig angenommen“ die hebräischen Aussagen idiomatisch und verständlich wiedergeben.
