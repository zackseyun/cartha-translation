    rationale: לְרָצוֹן bezeichnet hier, dass die Opfer zum Wohlgefallen/wohlgefällig sind. „Angenommen“ ist als Auslegung möglich, fügt aber gegenüber der knappen hebräischen Prädikation ein zusätzliches Annahmekonzept hinzu. „werden mir ... wohlgefällig sein“ ist genauer.
