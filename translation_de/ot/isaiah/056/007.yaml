  to: Ich werde sie zu meinem heiligen Berg bringen und ihnen in meinem Haus des Gebets Freude schenken. Ihre Brandopfer und ihre Schlachtopfer werden mir auf meinem Altar wohlgefällig sein; denn mein Haus wird ein Haus des Gebets für alle Völker[a] genannt werden.
