  text: אֵתָ֥יוּ אֶקְחָה יַ֖יִן וְ/נִסְבְּאָ֣ה שֵׁכָ֑ר וְ/הָיָ֤ה כָ/זֶה֙ י֣וֹם מָחָ֔ר גָּד֖וֹל יֶ֥תֶר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: de
  text: »Kommt! Ich will Wein holen, und wir wollen uns an berauschendem Getränk satt trinken.[a] Morgen wird es sein wie heute – groß, ja noch viel größer!«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und wir wollen uns an berauschendem Getränk volltrinken“. Das hebräische Verb kann das Satt- oder Vollwerden bezeichnen; der Zusammenhang lässt maßlosen Alkoholgenuss anklingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Morgen wird es sein wie heute, ja noch viel üppiger.“ Der hebräische Schluss steigert die prahlerische Erwartung für den nächsten Tag sehr stark.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  choice: Kommt!
  rationale: Die Aufforderung richtet sich an mehrere Personen. „Kommt!“ gibt die knappe, einladende und zugleich herausfordernde Sprechweise natürlich wieder.
- source_word: אֶקְחָה
  choice: Ich will … holen
  rationale: Die kohortativische Form drückt den Willen des Sprechers aus. „Ich will … holen“ ist im Deutschen natürlicher als ein wörtliches „Lasst mich nehmen“.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und übliche Entsprechung des hebräischen Wortes.
- source_word: וְנִסְבְּאָה
  choice: und wir wollen uns … satt trinken
  rationale: Die Form bezeichnet hier ein Sich-Sättigen beziehungsweise Volltrinken und drückt zugleich gemeinsamen Willen aus. Die Übersetzung bewahrt das Bild der Sättigung, während der Zusammenhang berauschenden Überfluss erkennen lässt.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Der Ausdruck bezeichnet ein alkoholisches Getränk neben Wein. „Berauschendes Getränk“ ist verständlich und vermeidet die möglicherweise irreführende Festlegung auf hochprozentige Spirituosen.
- source_word: וְהָיָה כָזֶה יוֹם מָחָר
  choice: Morgen wird es sein wie heute
  rationale: Die idiomatische deutsche Satzstellung gibt den Vergleich des morgigen Tages mit dem gegenwärtigen wieder.
- source_word: גָּדוֹל יֶתֶר מְאֹד
  choice: groß, ja noch viel größer
  rationale: Die Formulierung bewahrt das Grundwort „groß“ und gibt die starke Steigerung des abschließenden Ausdrucks wieder, ohne dessen Bezug vorschnell auf eine bestimmte Art von Überfluss einzuengen.
theological_decisions: []
