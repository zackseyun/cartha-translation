  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: de
  text: 'Denn so spricht der HERR zu den Eunuchen, die meine Sabbate halten, wählen, was mir gefällt, und an meinem Bund festhalten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַסָּרִיסִים
  choice: zu den Eunuchen
  rationale: סָרִיס bezeichnet hier im Zusammenhang mit Vers 3 Männer, die körperlich Eunuchen sind; das konkrete »Eunuchen« bewahrt den Zusammenhang besser als das weiter gefasste »Hofbeamte«.
- source_word: יִשְׁמְרוּ אֶת שַׁבְּתוֹתַי
  choice: die meine Sabbate halten
  rationale: שׁמר bedeutet hier beachten bzw. einhalten. »Sabbate« bewahrt den Plural des hebräischen Textes.
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: wählen, was mir gefällt
  rationale: Die Formulierung gibt die bewusste Wahl dessen wieder, woran der HERR Gefallen hat, ohne den Gegenstand enger festzulegen.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: und an meinem Bund festhalten
  rationale: חזק mit ב bezeichnet ein entschlossenes Ergreifen und Festhalten; die deutsche Wendung gibt dies natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die etablierte deutsche Bibelkonvention »HERR« kennzeichnet den Gottesnamen würdig und entspricht der konsultierten POB-Lesart, ohne den Namen mit dem gewöhnlichen Titel »Herr« gleichzusetzen.
- issue: Beziehung der drei Handlungen
  choice: Die Verben werden als koordinierte Merkmale derselben Eunuchen wiedergegeben.
  alternative: Jede Handlung durch ein erneut gesetztes Relativpronomen hervorheben
  rationale: Im Hebräischen folgen die drei Handlungen koordiniert aufeinander. Die knappe deutsche Reihung bewahrt diese Struktur und macht keine theologische Rangordnung zwischen Sabbat, Wohlgefallen Gottes und Bundestreue auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Verkündigungsstil; der Doppelpunkt signalisiert, dass die eigentliche Zusage in den folgenden Versen weitergeht.
