  source_fidelity: 'Die Übersetzung gibt die Anrede an die Eunuchen sowie die drei im Hebräischen koordinierten Kennzeichen sachgerecht wieder: das Halten der Sabbate, die Wahl dessen, woran der HERR Gefallen hat, und das Festhalten an seinem Bund. Der Plural „Sabbate“ entspricht שַׁבְּתוֹתַי, und der Doppelpunkt bewahrt die Fortsetzung der Gottesrede in den folgenden Versen.'
  naturalness: „Denn so spricht der HERR zu den Eunuchen, die meine Sabbate halten, wählen, was mir gefällt, und an meinem Bund festhalten:“ ist modernes, würdiges und syntaktisch klares Standarddeutsch. Die gemeinsame Zuordnung der drei Verben zum Relativpronomen „die“ ist natürlich.
  terminology: „Eunuchen“ ist im Kontext von Jesaja 56,3–5 die präzise Wiedergabe von סָרִיסִים. „HERR“ ist eine etablierte deutsche Konvention für den Gottesnamen יהוה. „Bund“ und „an ... festhalten“ treffen die Aussage von בִּבְרִיתִי und מַחֲזִיקִים angemessen.
