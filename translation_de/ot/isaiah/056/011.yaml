  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: de
  text: Und die Hunde haben einen unbändigen Appetit[a]; sie kennen keine Sättigung. Und sie sind Hirten, die nicht zu verstehen wissen[b]. Sie alle haben sich ihrem eigenen Weg zugewandt, jeder seinem eigenen Gewinn – ohne Ausnahme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind unersättlich“; wörtlich etwa: „stark/heftig an Verlangen (oder: Appetit)“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die nichts verstehen“ beziehungsweise „die keine Einsicht haben“.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Wendung ist schwierig; möglich ist auch eine räumliche Wiedergabe wie „von jedem Ende her“ oder „aus jedem Winkel“. Sie kann betonen, wie umfassend die eigennützige Haltung ist.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: die Hunde
  rationale: Bewahrt das konkrete, abwertende Bild des hebräischen Textes, statt es durch eine auslegende Bezeichnung wie „Anführer“ zu ersetzen.
- source_word: עַזֵּי נֶפֶשׁ
  choice: haben einen unbändigen Appetit
  rationale: Gibt die Verbindung von „stark/heftig“ und נֶפֶשׁ im Sinn von Verlangen oder Appetit idiomatisch wieder und passt zum Bild der Hunde.
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: sie kennen keine Sättigung
  rationale: Bewahrt sowohl das Verb „kennen“ als auch das Substantiv „Sättigung“ und lässt den rhetorischen Nachdruck des Originals erkennen.
- source_word: רֹעִים
  choice: Hirten
  rationale: Erhält die zweite Metapher des Verses und vermeidet eine Verengung auf ein bestimmtes religiöses Amt.
- source_word: לֹא יָדְעוּ הָבִין
  choice: die nicht zu verstehen wissen
  rationale: Bildet die ungewöhnliche hebräische Verbindung aus „nicht wissen“ und „verstehen“ relativ eng, aber verständlich ab.
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: Sie alle haben sich ihrem eigenen Weg zugewandt
  rationale: Bewahrt die Gesamtaussage, das Verb der Hinwendung und das moralisch aufgeladene Wegbild.
- source_word: אִישׁ לְבִצְעוֹ
  choice: jeder seinem eigenen Gewinn
  rationale: Gibt אִישׁ distributiv und בֶּצַע als eigennützig erstrebten Gewinn wieder, ohne die mögliche Bedeutung „unrechtmäßiger Gewinn“ zwingend in den Haupttext einzutragen.
- source_word: מִקָּצֵהוּ
  choice: ohne Ausnahme
  rationale: Die schwierige Wendung wird im Kontext als Bekräftigung verstanden, dass die Anklage für die gesamte Gruppe gilt; eine räumlichere Wiedergabe bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Identität der „Hunde“ und „Hirten“
  choice: Beide Metaphern bleiben im Haupttext stehen.
  alternative: Ausdeutende Wiedergabe als „Anführer“, „Wächter“ oder „religiöse Amtsträger“.
  rationale: Der Kontext richtet die Kritik gegen verantwortliche Führungsfiguren, doch der Vers formuliert dies bildhaft. Die Beibehaltung der Bilder verhindert eine konfessionelle oder institutionelle Verengung.
- issue: Moralische Färbung von בֶּצַע
  choice: „Gewinn“ im Haupttext
  alternative: „unrechtmäßiger Gewinn“ oder „schändlicher Gewinn“
  rationale: Das Wort kann eigennützigen oder unrechtmäßigen Profit bezeichnen, doch „Gewinn“ wahrt hier die lexikalische Offenheit; der negative Sinn ergibt sich klar aus der Anklage und aus „seinem eigenen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bilder „Hunde“ und „Hirten“ sowie die Wiederholung des Erkenntnis- und Einsichtsmotivs bleiben erhalten. Der Gedankenstrich markiert die abschließende, textlich schwierige Verstärkung.
