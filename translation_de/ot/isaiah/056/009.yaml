id: ISA.56.9
reference: Isaiah 56:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֖ל חַיְת֣וֹ שָׂדָ֑י אֵתָ֕יוּ לֶ/אֱכֹ֥ל כָּל חַיְת֖וֹ בַּ/יָּֽעַר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/009.yaml
  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
translation:
  language: de
  text: All ihr Tiere des Feldes,[a] kommt, um zu fressen – all ihr Tiere im Wald!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ruf an die Tiere ist wahrscheinlich ein Bild für das kommende Gericht; möglicherweise stehen dabei einfallende Feinde im Hintergrund.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: all
  rationale: Der Quantor umfasst jeweils die Gesamtheit der angeredeten Tiere und wird im Deutschen kollektiv und idiomatisch mit „all“ wiedergegeben.
- source_word: חַיְתוֹ
  choice: Tiere
  rationale: חיה bezeichnet in den Verbindungen mit Feld und Wald wilde Tiere. „Tiere“ ist modernes, natürliches Deutsch; der Kontext macht den Wildtiercharakter deutlich.
- source_word: שָׂדָי
  choice: des Feldes
  rationale: Die poetische Form von שׂדה steht im Kontrast zum Wald. „Des Feldes“ bewahrt die knappe, gehobene Parallelstruktur.
- source_word: אֵתָיוּ
  choice: kommt
  rationale: Der pluralische Imperativ ruft die Tiere direkt herbei; „kommt“ ist die natürliche und unmittelbare Entsprechung.
- source_word: לֶאֱכֹל
  choice: um zu fressen
  rationale: Das gewöhnliche Verb „essen“ erhält bei Tieren idiomatisch die Wiedergabe „fressen“. Sie bewahrt den konkreten Wortlaut, ohne die stärkere Deutung „verschlingen“ in den Haupttext einzutragen.
- source_word: בַּיָּעַר
  choice: im Wald
  rationale: Die Präposition ב mit Artikel bedeutet hier wörtlich „im Wald“. Die deutsche Form bleibt natürlich und erhält den formalen Unterschied zu „des Feldes“.
theological_decisions:
- issue: Prophetisches Bild der herbeigerufenen Tiere
  choice: Die Tiere werden im Haupttext unmittelbar angeredet; der Ruf wirkt im Zusammenhang als Bild kommenden Gerichts.
  alternative: Die Tiere unmittelbar als feindliche Völker oder Invasoren zu übersetzen.
  rationale: Der hebräische Wortlaut nennt Tiere des Feldes und im Wald. Eine mögliche metaphorische Beziehung auf angreifende Feinde sollte nicht an die Stelle dieses konkreten Bildes treten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Der knappe Parallelismus und der direkte Imperativ bleiben erhalten. „Fressen“ ist bei Tieren idiomatisch und entspricht dem gewöhnlichen hebräischen Verb, während „verschlingen“ eine stärkere kontextuelle Zuspitzung wäre.
