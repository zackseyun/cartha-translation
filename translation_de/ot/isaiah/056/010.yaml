  source_fidelity: 'Die Übersetzung gibt die hebräische Bildfolge und den scharfen prophetischen Vorwurf zuverlässig wieder: die blinden Wächter, ihr fehlendes Wissen, die stummen und bellunfähigen Hunde sowie die abschließende Folge von Schlaf-/Trägheitsbildern. „Seine Wächter“ folgt der herkömmlichen kontextuellen Deutung der schwierigen defektiven Form צפו. Die unsichere Bedeutung von הֹזִים wird sachgerecht nicht überdeutet und durch die Fußnote kenntlich gemacht.'
