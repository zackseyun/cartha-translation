  variant: modern standard German
source:
  edition: WLC
  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: de
  text: Seine Wächter sind allesamt blind; sie erkennen nichts. Sie alle sind stumme Hunde, die nicht bellen können. Sie träumen[a], liegen da und lieben es zu schlummern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „murmeln vor sich hin“. Das hebräische Wort ist selten und in diesem Zusammenhang schwer zu deuten; „träumen“ passt zu den folgenden Bildern vom Liegen und Schlummern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: Seine Wächter
  rationale: Die schwierige beziehungsweise defektiv geschriebene Form wird entsprechend der überlieferten kontextuellen Deutung auf die für ihn eingesetzten Wächter bezogen. „Wächter“ bewahrt das prophetische Bild natürlich im Deutschen.
- source_word: עִוְרִים כֻּלָּם
  choice: sind allesamt blind
  rationale: Die konkrete Metapher der Blindheit bleibt erhalten; „allesamt“ gibt die nachgestellte Gesamtheitsangabe nachdrücklich und idiomatisch wieder.
- source_word: לֹא יָדָעוּ
  choice: sie erkennen nichts
  rationale: ידע bezeichnet hier fehlende Einsicht oder Wahrnehmung. „Erkennen“ passt zum Bild blinder Wächter und bleibt näher am hebräischen Verb als eine erklärende Paraphrase.
- source_word: כְּלָבִים אִלְּמִים
  choice: stumme Hunde
  rationale: Die scharfe prophetische Metapher wird wörtlich und in heutigem, verständlichem Deutsch bewahrt.
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: die nicht bellen können
  rationale: Die Unfähigkeit wird schlicht und natürlich ausgedrückt, ohne das Bild der Hunde abzuschwächen.
- source_word: הֹזִים
  choice: sie träumen
  rationale: Das seltene und schwierige Partizip wird im Licht der unmittelbar folgenden Schlafbilder als „träumen“ verstanden. Die verbale Wiedergabe vermeidet, dass „Träumer“ im Deutschen als idealistische Menschen missverstanden wird.
- source_word: שֹׁכְבִים
  choice: liegen da
  rationale: Die partizipiale Körperhaltung und der Vorwurf untätigen Herumliegens werden knapp und anschaulich wiedergegeben.
- source_word: אֹהֲבֵי לָנוּם
  choice: lieben es zu schlummern
  rationale: Die Konstruktion mit „lieben“ bleibt erhalten; „schlummern“ gibt die Nuance schläfriger Untätigkeit wieder und passt zum würdevollen prophetischen Register.
