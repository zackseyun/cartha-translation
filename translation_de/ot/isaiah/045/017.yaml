source:
  edition: WLC
  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: de
  text: Israel ist durch Jahwe[a] gerettet, mit ewiger Rettung. Ihr werdet euch weder schämen noch gedemütigt werden, für immer und ewig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Jahwe«. Die hebräische Präposition kann sowohl Mittel beziehungsweise Urheber als auch den Bereich der Rettung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Ihr werdet weder beschämt noch gedemütigt werden.« Die hebräischen Verben können sowohl das Erleben von Scham als auch öffentliche Beschämung und Demütigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹשַׁע
  choice: wird gerettet
  rationale: Das Nifal-Partizip bezeichnet Israels Rettung durch Jahwe. Die deutsche Formulierung lässt den gegenwärtig-feststehenden und den verheißenden Zukunftsaspekt nebeneinander bestehen.
- source_word: בַּיהוָה
  choice: durch Jahwe
  rationale: Die Präposition ב kann hier Mittel beziehungsweise Urheber oder auch den Bereich bezeichnen. Beim passiven Verb gibt »durch Jahwe« den naheliegenden instrumentalen beziehungsweise agentiven Sinn idiomatisch wieder; die alternative Lesart wird in Fußnote [a] bewahrt.
- source_word: יהוה
  choice: Jahwe
  rationale: Der hebräische Text nennt das Tetragramm יהוה. »Jahwe« gibt den Gottesnamen in seiner im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: mit einer Rettung für alle Ewigkeit
  rationale: Die Konstruktverbindung bezeichnet eine dauerhaft gültige, ewige Rettung. Die Formulierung bewahrt das Substantiv תְּשׁוּעָה und klingt zugleich natürlich.
- source_word: לֹא תֵבֹשׁוּ וְלֹא תִכָּלְמוּ
  choice: ihr werdet weder beschämt noch gedemütigt werden
  rationale: Die beiden Verben bilden einen poetischen Parallelismus. »Beschämt« und »gedemütigt« geben ihre überlappenden, aber nicht völlig identischen Bedeutungen wieder, ohne sie zu einem einzigen Ausdruck einzuebnen.
- source_word: עַד עוֹלְמֵי עַד
  choice: für immer und ewig
  rationale: Die gesteigerte hebräische Zeitformel betont unbegrenzte Dauer; »für immer und ewig« ist eine natürliche und emphatische deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Wiedergabe als »Jahwe« macht den Bundesnamen sichtbar und ersetzt ihn nicht interpretierend durch einen Titel.
- issue: Bedeutung der Präposition ב in ביהוה
  choice: durch Jahwe
  alternative: in Jahwe
  rationale: In Verbindung mit dem passiven »wird gerettet« liegt die instrumentale beziehungsweise agentive Deutung nahe. Da ב zugleich den Bereich ausdrücken kann, bleibt »in Jahwe« ausdrücklich als Alternative erhalten.
- issue: Zeitbezug von נוֹשַׁע
  choice: wird gerettet
  alternative: ist gerettet
  rationale: Das Partizip kann einen bestehenden Zustand ausdrücken, während der Zusammenhang zugleich Verheißungscharakter hat. Das deutsche Präsenspassiv lässt diese Spannung eher offen als eine eindeutig vergangenheits- oder zukunftsbezogene Form.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, poetischem Ton. Die doppelte Ewigkeitsaussage des Hebräischen bleibt erhalten. Der Wechsel von »Israel« zur Anrede in der zweiten Person Plural wird nicht geglättet.
