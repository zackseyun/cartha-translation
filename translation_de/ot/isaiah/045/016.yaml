  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: de
  text: Sie werden beschämt und auch gedemütigt, sie alle miteinander; die Hersteller von Götzenbildern[a] gehen in Schande dahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Hersteller von Bildern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: sie werden beschämt
  rationale: Das Verb bezeichnet das Erleben von Scham und öffentlich sichtbarem Scheitern. Das deutsche Passiv gibt die resultative Aussage im prophetischen Zusammenhang natürlich wieder.
- source_word: וְגַם
  choice: und sogar
  rationale: Die Verbindung wirkt steigernd und führt über eine bloße Aufzählung hinaus.
- source_word: נִכְלְמוּ
  choice: gedemütigt
  rationale: Die Wiedergabe wahrt die parallele Verstärkung gegenüber בּוֹשׁוּ, ohne beide Verben unterschiedslos mit „beschämt“ wiederzugeben.
- source_word: כֻּלָּם יַחְדָּו
  choice: sie alle miteinander
  rationale: Dies gibt sowohl den pronominalen Bezug von כֻּלָּם als auch die gemeinsame Betroffenheit durch יַחְדָּו ausdrücklich wieder.
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: gehen in Schande dahin
  rationale: הלך bezeichnet hier idiomatisch den Weg beziehungsweise Ausgang in einen Zustand der Schande; „dahingehen“ bewahrt das Bewegungsbild und klingt im Deutschen würdig und verständlich.
- source_word: חָרָשֵׁי צִירִים
  choice: die Götzenbildner
  rationale: חָרָשֵׁי bezeichnet Handwerker beziehungsweise Hersteller; צִירִים meint im Kontext gefertigte Kultbilder. Das Kompositum benennt knapp und eindeutig diejenigen, die Götzenbilder anfertigen.
theological_decisions:
- issue: Referent von חָרָשֵׁי צִירִים
  choice: Götzenbildner
  alternative: Bildner von Bildern
  rationale: Der unmittelbare Zusammenhang stellt den HERRN den angefertigten Gottheiten gegenüber. „Götzenbildner“ macht den kultischen und polemischen Bezug deutlich, während die Fußnote die lexikalisch allgemeinere Wiedergabe bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Schamterminologie wird mit „beschämt“, „gedemütigt“ und „Schande“ bewusst differenziert, während die semantische Parallelität erhalten bleibt. Das prophetische Perfekt wird als gegenwärtig-gewisse Aussage wiedergegeben.
