base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: de
  text: Ich bin Jahwe, und es gibt keinen anderen; außer mir gibt es keinen Gott. Ich rüste dich aus[a], obwohl du mich nicht kanntest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich stärke dich“ oder „Ich gürte dich“. Das hebräische Verb kann das Gürten beziehungsweise Ausrüsten und damit die Befähigung oder Stärkung zum Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: וְאֵין עוֹד
  choice: und sonst gibt es keinen
  rationale: Die Formulierung gibt die ausschließende Aussage idiomatisch und mit ihrem absoluten Nachdruck wieder.
- source_word: זוּלָתִי
  choice: außer mir
  rationale: Die Wendung bezeichnet den Ausschluss jedes anderen neben dem Sprecher und erhält die Parallelität der beiden Aussagen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang der ausschließlichen Aussage bezeichnet das Wort Gott schlechthin, nicht einen Gott unter mehreren.
- source_word: אֲאַזֶּרְךָ
  choice: Ich rüste dich aus
  rationale: Das Piel von אזר kann „gürten“, „ausrüsten“ oder dadurch „stärken“ bedeuten. „Ausrüsten“ ist im modernen Deutsch verständlich und bewahrt das konkrete Bild sowie den Sinn der Befähigung zum Handeln.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: obwohl du mich nicht gekannt hast
  rationale: Das einleitende ו wird im Kontext sinnvollerweise konzessiv verstanden. Das Perfekt bezeichnet die bis dahin fehlende Kenntnis Jahwes, ohne die relationale Bedeutung von ידע weiter einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen und verwendet die im Deutschen übliche Form.
- issue: Bedeutung von אֲאַזֶּרְךָ
  choice: Ich rüste dich aus
  alternative: Ich stärke dich; ich gürte dich
  rationale: Die konkrete Bedeutung des Verbs und der übertragene Gedanke göttlicher Befähigung bleiben beide erkennbar; die Fußnote weist die echten Übersetzungsalternativen aus.
- issue: Konzessive Bedeutung des Schlusssatzes
  choice: obwohl du mich nicht gekannt hast
  alternative: und du hast mich nicht gekannt
  rationale: Im Zusammenhang wird Kyrus von Jahwe befähigt, obwohl er ihn zuvor nicht kannte. Die konzessive Wiedergabe macht diesen Zusammenhang deutlich, ohne zusätzliche Aussagen über die Art dieser Unkenntnis einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Ausschließlichkeitsaussagen bleiben erhalten. „Ausrüsten“ vermeidet das heute missverständliche „gürten“, bewahrt aber mehr vom konkreten hebräischen Bild als die rein abstrakte Wiedergabe „stärken“.
