  to: Verkündet es und bringt eure Sache vor[a]; ja, sie sollen sich miteinander beraten. Wer hat dies vor langer Zeit bekannt gemacht, wer hat es seit Langem angekündigt? War nicht ich es, Jahwe[b]? Außer mir gibt es keinen anderen Gott. Ich bin ein gerechter Gott und Retter; außer mir gibt es keinen.
