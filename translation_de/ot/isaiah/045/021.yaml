  variant: modern standard German
source:
  edition: WLC
  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: de
  text: Verkündet es und bringt eure Sache vor[a]; ja, sie sollen sich miteinander beraten. Wer hat dies vor langer Zeit bekannt gemacht, wer hat es seit Langem angekündigt? War nicht ich es, Jahwe[b]? Außer mir gibt es keinen anderen Gott. Ich bin ein gerechter Gott und Retter; außer mir gibt es keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bringt es her“ beziehungsweise „legt es vor“; im Zusammenhang liegt ein gerichtlicher Sinn nahe: „bringt eure Sache vor“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Verkündet es
  rationale: Der Imperativ fordert in diesem öffentlichen Streitgespräch zu einer förmlichen Erklärung auf; „verkündet“ gibt dies natürlicher wieder als das allgemeinere „sagt“.
- source_word: וְהַגִּישׁוּ
  choice: bringt eure Sache vor
  rationale: Das Hifil von נגשׁ bedeutet grundsätzlich „heranbringen/vorbringen“ und hat hier wahrscheinlich einen forensischen Sinn. Die gewählte Formulierung macht den Gerichtskontext verständlich, ohne ausdrücklich Beweise in den Text einzutragen.
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: ja, sie sollen sich miteinander beraten
  rationale: אַף verstärkt die Aufforderung, und die Nifalform von יעץ bezeichnet gemeinsames Beraten. Der Wechsel von der zweiten zur dritten Person bleibt erhalten.
- source_word: מִי הִשְׁמִיעַ זֹאת
  choice: Wer hat dies vor alters bekannt gemacht
  rationale: שׁמע im Hifil bedeutet hier „hören lassen/bekannt machen“. „Bekannt gemacht“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Sinn einer öffentlichen Vorankündigung.
- source_word: מִקֶּדֶם ... מֵאָז
  choice: vor alters ... längst zuvor
  rationale: Die parallelen Zeitangaben verweisen auf weit zurückliegende Bekanntgabe. Die Wiedergabe wahrt den Parallelismus, ohne altertümlich zu klingen.
- source_word: הֲלוֹא אֲנִי יְהוָה
  choice: War nicht ich es, Jahwe?
  rationale: Die rhetorische Frage bezeichnet Jahwe als den, der die Ereignisse im Voraus angekündigt hat. Das Präteritum passt zum Rückblick auf diese Ankündigung.
- source_word: וְאֵין עוֹד אֱלֹהִים מִבַּלְעָדַי
  choice: Außer mir gibt es keinen anderen Gott
  rationale: Die feste Ausschließlichkeitsformel wird idiomatisch wiedergegeben und wahrt die eindeutige Aussage, dass es neben dem Sprecher keinen Gott gibt.
- source_word: אֵל צַדִּיק
  choice: einen gerechten Gott
  rationale: צַדִּיק kann „gerecht“ oder „rechtschaffen“ bedeuten. „Gerecht“ umfasst hier sowohl Gottes moralische Gerechtigkeit als auch sein rechtes Handeln.
- source_word: וּמוֹשִׁיעַ
  choice: und Retter
  rationale: Das Partizip bezeichnet den, der rettet oder befreit. „Retter“ ist im Deutschen knapp, verständlich und erhält die substantivische Parallelität.
- source_word: אַיִן זוּלָתִי
  choice: keinen gibt es außer mir
  rationale: Die abschließende Ausschließlichkeitsformel wird bewusst als bekräftigende Wiederholung erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen erkennbar wieder; die traditionelle deutsche Wiedergabe wird in der Fußnote genannt.
- issue: Bedeutung von צַדִּיק in Bezug auf Gott
  choice: gerecht
  alternative: rechtschaffen
  rationale: „Gerecht“ ist lexikalisch tragfähig und lässt sowohl die moralische als auch die rechtsprechende Dimension offen, ohne die Aussage auf eine einzelne systematisch-theologische Deutung festzulegen.
- issue: Verhältnis von „gerechter Gott“ und „Retter“
  choice: appositionale Formulierung ohne ergänzte Erklärung
  alternative: ich bin ein gerechter Gott und ein Retter
  rationale: Das Hebräische verbindet beide Bezeichnungen unmittelbar mit אֵל und enthält keine ausdrückliche Kopula. Die knappe Apposition bewahrt die Spannung, dass Gottes Gerechtigkeit und sein Retten gemeinsam ausgesagt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ton eines öffentlichen Streit- beziehungsweise Gerichtsverfahrens wird gewahrt. Die Wiederholung der Ausschließlichkeitsaussage und der Personenwechsel in der Aufforderung bleiben erhalten; unnötige konfessionelle Präzisierungen werden vermieden.
