  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: de
  text: 'So spricht Jahwe, der Heilige Israels und sein Bildner: »Fragt mich nach dem Kommenden[a], das meine Söhne[b] betrifft, und gebietet mir hinsichtlich des Werks meiner Hände![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »nach den zukünftigen Dingen« oder »nach dem, was kommen wird«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »meine Söhne«; damit kann Israel als Gottes Volk insgesamt gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Formulierung »gebietet mir« ist im Zusammenhang wohl bewusst provozierend. Manche verstehen die Aufforderungen als vorwurfsvolle rhetorische Fragen: »Wollt ihr mich … befragen und mir … gebieten?«'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Wiedergabe des Gottesnamens bewahrt dessen Charakter als Eigenname.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die traditionelle und zugleich verständliche deutsche Wiedergabe des prophetischen Titels.
- source_word: וְיֹצְרוֹ
  choice: und der, der es geformt hat
  rationale: Das maskuline Singularsuffix wird auf Israel bezogen. Da der Name Israel im Deutschen hier ohne Artikel steht, ist der Rückbezug mit »es« idiomatisch; »geformt« erhält das Bild des hebräischen Verbs.
- source_word: הָאֹתִיּוֹת
  choice: das Kommende
  rationale: Im prophetischen Zusammenhang bezeichnet der Ausdruck die kommenden Ereignisse; die substantivierte Einzahlform ist im Deutschen eine natürliche Sammelbezeichnung.
- source_word: שְׁאָלוּנִי
  choice: Fragt mich
  rationale: Der Pluralimperativ mit Suffix der ersten Person wird direkt und ohne abschwächende Umschreibung wiedergegeben.
- source_word: עַל בָּנַי
  choice: das meine Söhne betrifft
  rationale: »Söhne« bewahrt den ausdrücklich maskulinen Plural; der Relativsatz stellt den syntaktischen Bezug zum Kommenden klar dar.
- source_word: פֹּעַל יָדַי
  choice: das Werk meiner Hände
  rationale: Die konkrete hebräische Metapher und die Parallelität des Satzes bleiben erhalten.
- source_word: תְּצַוֻּנִי
  choice: gebietet mir
  rationale: Das starke Verb wird nicht theologisch geglättet. »Gebieten« ist würdevoll und gibt die provozierende Aussage natürlicher wieder als das missverständliche »befehlt mich«.
theological_decisions:
- issue: Ob Menschen hier ausdrücklich aufgefordert werden, Gott zu gebieten, oder ob die Worte als vorwurfsvoll-rhetorische Frage zu verstehen sind
  choice: Die Imperativform »gebietet mir« bleibt im Haupttext stehen.
  alternative: »Wollt ihr mir etwa über das Werk meiner Hände gebieten?«
  rationale: Im Hebräischen steht kein ausdrückliches Fragezeichen oder Fragewort. Die schroffe Formulierung und ihre theologische Spannung sollen daher im Text erhalten und die rhetorische Deutung in einer Fußnote genannt werden.
- issue: Ob בָּנַי geschlechtsneutral wiederzugeben ist
  choice: meine Söhne
  alternative: meine Kinder
  rationale: Der hebräische Ausdruck ist ausdrücklich maskuliner Plural, auch wenn er kollektiv auf Gottes Volk bezogen sein kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gottesrede behält die knappen Pluralimperative und die anstößige Schlusswendung bei; ungebräuchliche Satzverdrehungen wurden vermieden.
