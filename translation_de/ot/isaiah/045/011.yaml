revisions:
- from: 'So spricht Jahwe, der Heilige Israels und der, der es geformt hat: »Fragt mich nach dem Kommenden[a], das meine Söhne[b] betrifft, und gebietet mir über das Werk meiner Hände![c]«'
  to: 'So spricht Jahwe, der Heilige Israels und sein Bildner: »Fragt mich nach dem Kommenden[a], das meine Söhne[b] betrifft, und gebietet mir hinsichtlich des Werks meiner Hände![c]«'
  rationale: Die Revision ersetzt die problematische neutrale Rückverweisung bei וְיֹצְרוֹ durch die knappe possessive Titelwendung »sein Bildner« und klärt die deutsche Rektion im Schlussglied. Die mögliche rhetorisch-vorwurfsvolle Lesart bleibt ausschließlich in der Fußnote; der Haupttext bewahrt die Imperative und damit die Spannung des Hebräischen.
