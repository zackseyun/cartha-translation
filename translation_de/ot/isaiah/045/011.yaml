  source_fidelity: Die Grundstruktur und die starken Pluralimperative geben den hebräischen Text angemessen wieder. »das Kommende«, »meine Söhne« und die ungemilderte Aufforderung sind sachgerecht. Bei וְיֹצְרוֹ sollte jedoch der maskuline Singular nicht mit dem deutschen Neutrum »es« wiedergegeben werden; eine possessive Titelwendung bewahrt den im Hebräischen offenen Bezug besser.
  naturalness: Die Übersetzung ist insgesamt würdig und gut verständlich. »jemandem über etwas gebieten« kann im Deutschen jedoch auch »Macht über etwas haben« bedeuten. »hinsichtlich des Werks meiner Hände« macht den durch עַל bezeichneten Bezug klarer, ohne die Schärfe von תְּצַוֻּנִי abzuschwächen.
  terminology: »Jahwe«, »der Heilige Israels«, »meine Söhne« und »das Werk meiner Hände« sind angemessen. »sein Bildner« ist als knappe prophetische Titelbezeichnung eine passende Wiedergabe von »und sein Former/Macher«; der Bezug bleibt wie im Ausgangstext implizit.
  issues:
