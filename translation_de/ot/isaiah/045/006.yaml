base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: de
  text: damit sie vom Sonnenaufgang bis zu ihrem Untergang[a] erkennen, dass außer mir keiner ist. Ich bin Jahwe[b], und es gibt keinen anderen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Osten bis zum Westen“; wörtlich: „vom Aufgang der Sonne und von ihrem Untergang“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: damit sie erkennen
  rationale: לְמַעַן leitet einen Zweck- bzw. Ergebnissatz ein; der hebräische Imperfekt in der 3. Person Plural wird mit „sie erkennen“ bewahrt.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: vom Aufgang der Sonne
  rationale: Die poetische Sonnenmetapher des Hebräischen bleibt erhalten, statt sie unmittelbar mit „vom Osten“ wiederzugeben.
- source_word: וּמִמַּעֲרָבָהּ
  choice: und von ihrem Untergang her
  rationale: Das feminine Suffix verweist auf die Sonne. „ihrem Untergang“ erhält diesen Bezug und die Parallelität der beiden Wendungen.
- source_word: אֶפֶס בִּלְעָדַי
  choice: dass es außer mir keinen gibt
  rationale: Die idiomatische Wendung bezeichnet ausschließliche Einzigkeit. „keinen“ lässt den personalen Bezug im Zusammenhang klar hervortreten.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Das ausdrücklich gesetzte Pronomen wird zur Betonung beibehalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְאֵין עוֹד
  choice: und es gibt keinen anderen
  rationale: Die klare, moderne Formulierung bewahrt die abschließende Exklusivitätsaussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration „Jahwe“ macht den Eigennamen sichtbar, während die traditionelle Wiedergabe „der HERR“ als Alternative in der Fußnote genannt wird.
- issue: Reichweite der geografischen Wendung
  choice: vom Aufgang der Sonne und von ihrem Untergang her
  alternative: vom Osten bis zum Westen
  rationale: Der Ausgangstext verwendet poetische Sonnenbilder und zweimal die Präposition „von“. Die Übersetzung bewahrt diese Form, ohne die gemeinte weltweite Reichweite auf bloße Himmelsrichtungen zu reduzieren.
- issue: Aussage göttlicher Einzigkeit
  choice: außer mir keinen ... keinen anderen
  alternative: nichts außer mir ... sonst nichts
  rationale: Im Kontext ist die Aussage personal auf die Einzigkeit Jahwes bezogen. Die Formulierung wahrt diese Aussage, ohne sie durch spätere dogmatische Terminologie auszuweiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Bildlichkeit. Die doppelte Exklusivitätsaussage des Hebräischen bleibt erhalten. Die etwas markierte Wendung „von ihrem Untergang her“ dient dazu, das feminine Suffix und die parallele hebräische Konstruktion sichtbar zu halten.
