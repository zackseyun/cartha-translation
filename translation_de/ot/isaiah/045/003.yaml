- from: Und ich werde dir die Schätze der Finsternis[a] und die verborgenen Reichtümer geheimer Orte geben, damit du erkennst, dass ich Jahwe bin[b], der dich bei deinem Namen ruft, der Gott Israels.
  to: Und ich werde dir die Schätze der Finsternis[a] und die verborgenen Schätze geheimer Orte[b] geben, damit du erkennst, dass ich Jahwe bin, der dich mit Namen ruft, der Gott Israels[c].
  rationale: Die Revision glättet zwei Formulierungen im modernen Standarddeutsch, ohne die poetische Parallelität oder die Mehrdeutigkeit der hebräischen Konstruktionen aufzulösen. Die ergänzte Fußnote ist unmittelbar an der zweiten Schatzformulierung verankert und dokumentiert eine zulässige, stärker explizierende Alternative. Die Aussage bleibt auf konkret vorstellbare, verborgene Schätze bezogen und wird nicht metaphorisch-theologisch erweitert.
