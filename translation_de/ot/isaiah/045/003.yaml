base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: de
  text: Und ich werde dir die Schätze der Finsternis[a] und die verborgenen Schätze geheimer Orte[b] geben, damit du erkennst, dass ich Jahwe bin, der dich mit Namen ruft, der Gott Israels[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in der Finsternis verborgenen Schätze“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verborgene Schätze an geheimen Orten“.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Text hat hier den Gottesnamen JHWH, traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: Das Qal-Perfekt mit וְ steht hier im prophetischen Verheißungskontext und wird im Deutschen natürlich und kontextgerecht als Zukunftsaussage wiedergegeben.
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: die Schätze der Finsternis
  rationale: Die formnahe Wiedergabe der Status-constructus-Verbindung bewahrt das poetische Bild und lässt offen, ob die Schätze der Finsternis zugeordnet oder in ihr verborgen sind.
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: und die verborgenen Reichtümer geheimer Orte
  rationale: מַטְמֻנִים bezeichnet verborgene Vorräte oder Schätze; מִסְתָּרִים hebt Orte des Verbergens hervor. Die Formulierung erhält beide Aspekte und den poetischen Parallelismus.
- source_word: לְמַעַן תֵּדַע
  choice: damit du erkennst
  rationale: Die Wendung drückt eine Absicht aus. „Erkennen“ gibt ידע hier als persönliches, durch Gottes Handeln vermitteltes Wissen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht stillschweigend durch einen Titel ersetzt.
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: der dich bei deinem Namen ruft
  rationale: Die Wiedergabe erhält den ausdrücklichen Bezug auf den Namen des Angesprochenen und die partizipiale Charakterisierung Gottes.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Klare und im Deutschen übliche Wiedergabe der hebräischen Status-constructus-Verbindung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ macht diesen sichtbar; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutung der Schatzmetaphorik
  choice: Konkrete, verborgen aufbewahrte Reichtümer
  alternative: Geistliche Schätze
  rationale: Der Zusammenhang der Berufung des Kyros, der besiegten Völker und geöffneten Zugänge legt materielle Beute oder verborgene Staatsschätze nahe. Die Übersetzung bewahrt jedoch das Bild, ohne eine weitergehende metaphorische Anwendung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Bildsprache des Hebräischen bleibt erhalten; unnötige Archaismen und eine vergeistigende Auslegung der konkreten Reichtümer werden vermieden.
