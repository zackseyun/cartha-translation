  source_fidelity: 'Die Abfolge und Aussage des Hebräischen werden treffend wiedergegeben: Jahwe als Schöpfer der Himmel, Gott, Former, Macher und Gründer der Erde; die Gegenüberstellung von תֹהוּ und Bewohnbarkeit sowie die abschließende Exklusivformel bleiben erhalten. „Ödland“ ist im Kontext eine sachgerechte, nicht überbestimmende Wiedergabe von תֹהוּ.'
