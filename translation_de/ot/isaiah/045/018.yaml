  terminology: „Jahwe“, „Gott“, „Himmel“, „Erde“, „geformt“ und „Ödland“ sind konsistent und quellentreu gewählt. Die Aussage „er ist Gott“ fügt die erst am Schluss explizierte Ausschließlichkeit nicht vorzeitig hinzu.
