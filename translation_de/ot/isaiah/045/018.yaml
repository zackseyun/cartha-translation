source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: de
  text: 'Denn so spricht Jahwe, der die Himmel geschaffen hat – er ist Gott –, der die Erde geformt und gemacht hat; er hat sie fest gegründet. Nicht als Ödland hat er sie geschaffen; zum Bewohnen hat er sie geformt: Ich bin Jahwe, und es gibt keinen anderen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: der die Himmel geschaffen hat
  rationale: Die Relativkonstruktion gibt das attributiv gebrauchte Partizip natürlich wieder; der Plural „die Himmel“ entspricht der hebräischen Form und dem kosmischen Zusammenhang.
- source_word: הוּא הָאֱלֹהִים
  choice: er ist Gott
  rationale: Die knappe, betonte Identifikation bleibt erhalten, ohne das erst am Versende ausdrücklich formulierte Ausschließlichkeitsmotiv vorwegzunehmen.
- source_word: יֹצֵר הָאָרֶץ וְעֹשָׂהּ
  choice: der die Erde geformt und gemacht hat
  rationale: „Geformt“ bewahrt die gestaltende Nuance von יצר, während „gemacht“ das allgemeinere עשה wiedergibt; „Erde“ ist im Schöpfungszusammenhang angemessener als „Land“.
- source_word: כּוֹנְנָהּ
  choice: er hat sie fest gegründet
  rationale: Die Wendung bringt sowohl das Gründen als auch die in כון enthaltene Festigkeit und Beständigkeit zum Ausdruck.
- source_word: תֹהוּ
  choice: Ödland
  rationale: Der Gegensatz zum Bewohnen legt hier Unbewohnbarkeit und Verödung nahe. „Ödland“ wahrt diese Bedeutung, ohne den Ausdruck vorschnell auf „formlos“ oder metaphysisches „Chaos“ festzulegen.
- source_word: לָשֶׁבֶת יְצָרָהּ
  choice: zum Bewohnen hat er sie geformt
  rationale: Die Zweckangabe des Infinitivs wird knapp und idiomatisch wiedergegeben; die Wiederholung von „geformt“ erhält die lexikalische Verbindung zu יֹצֵר.
- source_word: וְאֵין עוֹד
  choice: und sonst gibt es keinen
  rationale: Die Formulierung bewahrt die uneingeschränkte Ausschließlichkeitsaussage und lässt den im Zusammenhang eindeutigen Bezug auf Gott unausgesprochen wie im Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird transparent wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von תֹהוּ in der Aussage über den Schöpfungszweck
  choice: Ödland
  alternative: Leere; Chaos; formlos
  rationale: Der unmittelbare Gegensatz „zum Bewohnen“ spricht für eine auf Unbewohnbarkeit beziehungsweise Verödung bezogene Bedeutung. Die echte Bedeutungsbreite des Wortes wird dabei nicht durch eine dogmatische Festlegung auf Genesis 1,2 eingeengt.
- issue: Aussagekraft von הוּא הָאֱלֹהִים
  choice: er ist Gott
  alternative: er ist der Gott; er allein ist Gott
  rationale: Die emphatische Identifikation wird bewahrt, ohne „allein“ bereits hier hinzuzufügen; die Ausschließlichkeit folgt ausdrücklich am Versende.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhythmische Folge der Schöpfungsaussagen und die markante Selbstbekundung am Schluss bleiben erhalten. Gedankenstriche markieren den einschiebenden Bekenntnissatz „er ist Gott“.
