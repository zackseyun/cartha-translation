id: ISA.45.13
reference: Isaiah 45:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: de
  text: Ich habe ihn in Gerechtigkeit erweckt[a], und alle seine Wege werde ich ebnen. Er wird meine Stadt wieder aufbauen[b] und meine Verbannten freilassen, weder gegen Bezahlung noch gegen Bestechung. Das spricht Jahwe der Heere[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe ihn in Gerechtigkeit aufstehen lassen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er wird meine Stadt bauen.“ „Wieder aufbauen“ ergibt sich aus dem Zusammenhang der Wiederherstellung Jerusalems.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: ich habe ihn … erweckt
  rationale: Das Hifil von עור bezeichnet ein Erwecken, Aufrütteln oder In-Bewegung-Setzen. „Erweckt“ bewahrt die göttliche Initiative, ohne eine Erhebung in ein Amt ausdrücklich vorauszusetzen.
- source_word: בְצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die Wendung gibt die Präposition und das breite Bedeutungsfeld von צדק direkt wieder; sie lässt sowohl die moralische als auch die rechtliche Dimension offen.
- source_word: אֲיַשֵּׁר
  choice: werde … ebnen
  rationale: Das Piel von ישר kann „gerade machen“, „glätten“ oder „ebnen“ bedeuten. Im Deutschen gibt „Wege ebnen“ das Bild einer von Gott bereiteten Bahn natürlich wieder.
- source_word: דְּרָכָיו
  choice: seine Wege
  rationale: „Wege“ erhält das konkrete Bild und zugleich seine mögliche übertragene Bedeutung als Lebensweg oder Unternehmung.
- source_word: יִבְנֶה עִירִי
  choice: wird meine Stadt wieder aufbauen
  rationale: בנה bedeutet wörtlich „bauen“. Wegen der vorausgesetzten Zerstörung und Wiederherstellung Jerusalems bringt „wieder aufbauen“ den kontextuellen Sinn im Deutschen klar zum Ausdruck; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: גָלוּתִי
  choice: meine Verbannten
  rationale: גלות kann den Zustand des Exils oder die Gemeinschaft der Weggeführten bezeichnen. Zusammen mit „freilassen“ ist hier die personale Bedeutung am natürlichsten.
- source_word: יְשַׁלֵּחַ
  choice: freilassen
  rationale: Das Piel von שלח kann „wegsenden“, „ziehen lassen“ oder „freilassen“ bedeuten. „Freilassen“ passt zum Exilkontext, ohne ein im Hebräischen nicht genanntes Reiseziel einzufügen.
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: weder gegen Bezahlung noch gegen Bestechung
  rationale: Die deutsche Paarformel gibt die doppelte Verneinung natürlich wieder und bewahrt den Gegensatz zwischen regulärer Gegenleistung und unrechtmäßiger Bestechung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Der Heere“ übersetzt צבאות transparent und bewahrt dessen militärische sowie umfassendere kosmische Konnotationen besser als das heute weniger verständliche „Heerscharen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität des mit „ihn/er“ bezeichneten Handelnden
  choice: Die Pronomen bleiben erhalten
  alternative: Kyros im Haupttext ausdrücklich nennen
  rationale: Der Zusammenhang identifiziert Kyros, doch dieser Vers selbst verwendet nur Pronomen. Die Übersetzung folgt darin dem Ausgangstext und fügt keine erklärende Identifizierung ein.
- issue: Art der Freilassung der Verbannten
  choice: ohne Bezahlung oder Bestechung
  alternative: als unentgeltlichen Loskauf deuten
  rationale: Der Text verneint Preis und Bestechung, erklärt aber nicht näher, wessen Zahlung oder Motivation gemeint ist. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am prophetischen Ausgangstext, wird aber durch geläufige Wendungen wie „Wege ebnen“ und „weder … noch“ natürlich lesbar. Die Pronomen und die semantische Weite von „Gerechtigkeit“ bleiben bewusst erhalten.
