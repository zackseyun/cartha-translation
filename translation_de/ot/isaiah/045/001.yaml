    issue: Die Schlusskonstruktion „sodass Tore nicht verschlossen bleiben“ ist keine genaue Entsprechung von וּשְׁעָרִים לֹא יִסָּגֵרוּ.
    rationale: Das Hebräische sagt schlicht, dass Tore nicht geschlossen werden bzw. nicht geschlossen sein werden; es führt weder ausdrücklich eine Folgekonjunktion ein noch formuliert es den Zustand des Offenbleibens.
  - severity: low
    issue: „Flügeltüren“ entscheidet die Bedeutung der hebräischen Dualform im Haupttext.
    rationale: Die Dualform kann auf Doppeltüren hinweisen, muss im Deutschen aber nicht als „Flügeltüren“ festgelegt werden. „Türen“ ist textnäher und natürlicher; die mögliche Nuance gehört in die Fußnote.
