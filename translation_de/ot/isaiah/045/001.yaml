  text: כֹּה אָמַ֣ר יְהוָה֮ לִ/מְשִׁיח/וֹ֮ לְ/כ֣וֹרֶשׁ אֲשֶׁר הֶחֱזַ֣קְתִּי בִֽ/ימִינ֗/וֹ לְ/רַד לְ/פָנָי/ו֙ גּוֹיִ֔ם וּ/מָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִ/פְתֹּ֤חַ לְ/פָנָי/ו֙ דְּלָתַ֔יִם וּ/שְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: de
  text: 'So spricht der HERR zu seinem Gesalbten[a], zu Kyrus, dessen rechte Hand ich ergriffen habe, um Nationen vor ihm zu unterwerfen und Königen den Gürtel zu lösen[b], um vor ihm Türen zu öffnen[c], und Tore werden nicht geschlossen werden:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Gesalbter“ gehört zu derselben Wortfamilie wie „Messias“. Hier bezeichnet es Kyrus als den vom HERRN für diese Aufgabe erwählten und bevollmächtigten Herrscher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die Lenden der Könige werde ich lösen“. Gemeint sein kann, dass sie geschwächt, entwaffnet oder ihres Mutes beraubt werden.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort steht in der Dualform und kann Doppeltüren bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im deutschen Bibelgebrauch etablierte Wiedergabe des Tetragramms in Kapitälchenform; hier technisch als Großschreibung dargestellt.
- source_word: לִמְשִׁיחוֹ
  choice: zu seinem Gesalbten
  rationale: Gibt die Grundbedeutung des hebräischen Ausdrucks wieder und bewahrt zugleich die überraschende Anwendung auf Kyrus, ohne ihn vorschnell mit dem späteren spezialisierten Messiastitel gleichzusetzen.
- source_word: לְכוֹרֶשׁ
  choice: zu Kyrus
  rationale: Übliche deutsche Namensform des persischen Königs.
- source_word: אֲשֶׁר הֶחֱזַקְתִּי בִימִינוֹ
  choice: den ich bei seiner rechten Hand ergriffen habe
  rationale: Bewahrt das konkrete Bild göttlicher Führung und Bevollmächtigung; der Relativsatz bezieht sich im Deutschen natürlich auf Kyrus.
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: um Nationen vor ihm zu unterwerfen
  rationale: Gibt den militärisch-politischen Sinn von רדה im Zusammenhang klar und sachgemäß wieder.
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: und Königen den Gürtel zu lösen
  rationale: Erhält das körperlich-konkrete Bild der Lendenpartie durch den Gürtel und macht die Handlung im Deutschen verständlich, ohne die mögliche Bedeutung des Entwaffnens oder Schwächens in den Haupttext einzutragen.
- source_word: לִפְתֹּחַ לְפָנָיו דְּלָתַיִם
  choice: um vor ihm Flügeltüren zu öffnen
  rationale: Die Dualform דלתים bezeichnet wahrscheinlich eine Tür aus zwei Flügeln; „Flügeltüren“ bewahrt diese Nuance idiomatisch.
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: sodass Tore nicht verschlossen bleiben
  rationale: Versteht die abschließende Aussage als Folge der göttlichen Öffnung und gibt den passiven Sinn flüssig wieder.
theological_decisions:
- issue: Bezeichnung des Kyrus als מָשִׁיחַ
  choice: seinem Gesalbten
  alternative: seinem Messias
  rationale: Der Ausdruck bezeichnet hier Kyrus als von Gott für eine geschichtliche Aufgabe erwählten und bevollmächtigten Herrscher. „Gesalbter“ wahrt die lexikalische und theologische Spannung, ohne die später spezialisierte messianische Bedeutung aufzuzwingen.
- issue: Deutung des Lösens an den Lenden der Könige
  choice: das Bild im Haupttext bewahren und die möglichen Wirkungen in der Fußnote nennen
  alternative: Könige entwaffnen oder ihrer Kraft berauben
  rationale: Der hebräische Text nennt bildhaft die Lenden und das Lösen. Eine ausschließlich militärische oder psychologische Deutung würde die echte Bedeutungsbreite unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachrhythmus. Konkrete hebräische Bilder werden soweit möglich bewahrt; ungebräuchliche Wörtlichkeit wird durch knappe Fußnoten erschlossen.
