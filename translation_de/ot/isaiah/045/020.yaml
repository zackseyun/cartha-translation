  source_fidelity: Die drei Imperative geben הִקָּבְצוּ, וָבֹאוּ und הִתְנַגְּשׁוּ samt יַחְדָּו präzise und in ihrer Steigerung wieder. „ihr Überlebenden der Völker“ trifft den vokativischen Ausdruck פְּלִיטֵי הַגּוֹיִם. Der folgende Satz bewahrt die auf die Götzendiener bezogenen Partizipien sowie die Polemik von „Holz ihres Schnitzbildes“ und „einem Gott …, der nicht retten kann“.
  naturalness: Die Formulierung ist modernes Standarddeutsch mit angemessen würdigem, prophetischem Ton. Die vorangestellte Wendung „Nichts wissen die“ ist bewusst markiert, aber gut verständlich und stilistisch passend; sie ist keine unnatürliche Archaisierung.
  terminology: „Schnitzbild“ gibt פֶּסֶל ohne zusätzliche konfessionelle Deutung wieder; die Fußnote erläutert sachgerecht den hölzernen Götzenbezug. „Gott“ für אֵל erhält die polemisch-ironische Bezeichnung des hebräischen Textes, während „nicht retten kann“ die im Kontext gemeinte Ohnmacht idiomatisch ausdrückt. Die Alternative „nicht rettet“ ist korrekt als Fußnote erhalten.
