base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: de
  text: Versammelt euch und kommt, tretet gemeinsam heran, ihr Überlebenden der Völker! Nichts wissen die, die das Holz ihres Schnitzbildes[a] tragen und zu einem Gott beten, der nicht retten kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Holz ihres Schnitzbildes“; gemeint ist ein aus Holz gefertigtes Götzenbild.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der nicht rettet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: Versammelt euch und kommt
  rationale: Der Nifal-Imperativ von קבץ ruft die Angesprochenen dazu auf, sich zu versammeln; בוא wird im anschließenden Imperativ schlicht und idiomatisch mit „kommt“ wiedergegeben.
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: tretet gemeinsam heran
  rationale: Der Hitpael-Imperativ von נגש bezeichnet hier das Herantreten in einer feierlichen Aufforderung; יַחְדָּו betont das gemeinsame Handeln.
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: ihr Überlebenden der Völker
  rationale: פְּלִיטֵי bezeichnet Entkommene beziehungsweise Überlebende. Die Anredeform macht den vokativischen Gebrauch deutlich, ohne genauer festzulegen, auf welche Weise sie dem Unheil entkommen sind.
- source_word: לֹא יָדְעוּ
  choice: Nichts wissen die
  rationale: Das finite Verb ידע wird direkt als fehlendes Wissen wiedergegeben. Die vorangestellte Formulierung erhält den markanten prophetischen Ton und bezieht sich grammatisch auf die folgenden Partizipien.
- source_word: הַנֹּשְׂאִים אֶת עֵץ פִּסְלָם
  choice: die das Holz ihres Schnitzbildes tragen
  rationale: Die substantivische Partizipialform wird als Relativsatz wiedergegeben. „Holz ihres Schnitzbildes“ bewahrt sowohl עֵץ als auch den handwerklich hergestellten Charakter von פֶּסֶל und damit die polemische Wirkung.
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: und zu einem Gott beten
  rationale: Das Hitpael-Partizip von פלל bezeichnet hier das Beten. Das artikellose אֵל wird im Kontext indefinit wiedergegeben; die Bezeichnung „Gott“ bleibt als polemische Benennung dessen stehen, was die Völker als Gott verehren.
- source_word: לֹא יוֹשִׁיעַ
  choice: der nicht retten kann
  rationale: Der Hifil von ישׁע bedeutet „retten“. Im Zusammenhang der Götzenpolemik bringt „nicht retten kann“ die offenkundige Ohnmacht des verehrten Gottes zum Ausdruck; die formal mögliche Wiedergabe „nicht rettet“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Aussage über den als אֵל bezeichneten Kultgegenstand
  choice: „zu einem Gott …, der nicht retten kann“
  alternative: „zu einem Gott …, der nicht rettet“ oder deutender „zu einem Götzen“
  rationale: „Gott“ bewahrt die ironisch-polemische Sprache des Hebräischen, ohne dem Kultgegenstand wirkliche Göttlichkeit zuzuschreiben. „Nicht retten kann“ hebt im Kontext seine Ohnmacht hervor; die Alternative „nicht rettet“ bleibt möglich und wird deshalb ausdrücklich genannt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem prophetischem Ton. Die parallelen Aufforderungen und die scharfe Ironie der Götzenkritik bleiben erhalten; ungebräuchliche altertümliche Wörter werden vermieden.
