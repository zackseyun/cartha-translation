  source_fidelity: Der Entwurf gibt den Weheruf, das Rechts-/Streitmotiv, das Töpferbild und die bewusst mehrdeutige Schlusszeile grundsätzlich zutreffend wieder. Die rhetorische Verbform kann im Deutschen jedoch besser als Zukunftsfrage wiedergegeben werden. Die Apposition zu „dem“ sollte zudem im Dativ stehen.
  naturalness: „Scherben aus Erde“ wirkt im modernen Deutschen etwas unidiomatisch und stofflich ungenau. „irdenen Scherben“ ist natürlich, bewahrt den Bezug zu אדמה und vermeidet die unnötige Wiederholung von „Ton“.
  terminology: „Bildner“ ist als gehobene, aber verständliche Bezeichnung für יֹצֵר vertretbar und erhält das Formungsmotiv. „Ton“ und „Werk“ passen zum Bildfeld. Die Fußnote wahrt die mögliche Deutung von ידים als „Henkel“, ohne sie in den Haupttext zu verlagern.
  issues:
