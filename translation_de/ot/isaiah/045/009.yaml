source:
  edition: WLC
  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: de
  text: 'Wehe dem, der mit seinem Bildner streitet – einer Tonscherbe unter den irdenen Scherben! Wird etwa der Ton zu dem, der ihn formt, sagen: »Was machst du?«, oder dein Werk: »Er hat keine Hände«?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Es hat keine Henkel.« Dann kritisiert das Werk die Form des Gefäßes statt die Fähigkeit des Bildners.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe dem
  rationale: Die Wendung bewahrt den mahnenden und anklagenden Ton des prophetischen Weherufs in würdigem, geläufigem Deutsch.
- source_word: רָב אֶת יֹצְרוֹ
  choice: der mit seinem Bildner streitet
  rationale: רָב bezeichnet hier ein Streiten oder Rechten. „Bildner“ gibt das substantivierte Partizip von יצר wieder und hält zugleich das Motiv des Formens fest.
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: eine Tonscherbe unter den Scherben aus Erde
  rationale: Die elliptische hebräische Formulierung ordnet den Streitenden den übrigen irdenen Scherben zu. „Tonscherbe“ macht das Töpferbild deutlich, während „aus Erde“ den stofflichen Gegensatz zum Bildner bewahrt.
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: Sagt etwa der Ton zu dem, der ihn formt
  rationale: „Ton“ entspricht dem Werkstoff im Töpferbild. Die rhetorische Frage wird durch „etwa“ im natürlichen Deutschen kenntlich gemacht; „der ihn formt“ bleibt eng am hebräischen Ausdruck.
- source_word: מַה תַּעֲשֶׂה
  choice: Was machst du?
  rationale: עשה kann „tun“ oder „machen“ bedeuten; im Bild vom Formen des Tons ist „machen“ die naheliegende, ohne unnötige Einengung verständliche Wiedergabe.
- source_word: וּפָעָלְךָ
  choice: oder dein Werk
  rationale: פֹּעַל kann die Tat, Arbeit oder das hervorgebrachte Werk bezeichnen. „Werk“ lässt den geformten Gegenstand selbst als Sprecher erscheinen und wahrt zugleich die knappe Parallelkonstruktion.
- source_word: אֵין יָדַיִם לוֹ
  choice: Er hat keine Hände
  rationale: Wörtlich besagt die Wendung, dass „ihm“ keine Hände zukommen. Im Zusammenhang ist sie am ehesten ein vermessener Vorwurf gegen die Fähigkeit des Bildners; die mögliche Deutung von יָדַיִם als Gefäßhenkel wird in der Fußnote bewahrt.
theological_decisions:
- issue: Anthropomorphe Kritik in der Schlusswendung
  choice: 'Das Werk sagt über seinen Bildner: „Er hat keine Hände.“'
  alternative: 'Das Werk beklagt seine eigene Gestalt: „Es hat keine Henkel.“'
  rationale: Der Zusammenhang tadelt das Geschöpf dafür, mit seinem Bildner zu rechten. Daher fügt sich der Vorwurf mangelnder Hände beziehungsweise Fähigkeit des Bildners gut in den Gedankengang. Da die Deutung als Gefäßhenkel sprachlich möglich ist, wird sie nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bildner“ ist bewusst gewählt, um das wiederholte hebräische Motiv des Formens mit dem Tonbild zu verbinden; die übrige Syntax ist für heutige Leser geglättet, ohne die rhetorische Schärfe oder die mögliche Mehrdeutigkeit der Schlusswendung aufzulösen.
