    issue: Kasus und Idiomatik der Scherben-Apposition
    rationale: Da „eine Tonscherbe“ auf „dem“ zurückbezogen ist, ist „einer Tonscherbe“ syntaktisch sauberer. „unter den irdenen Scherben“ klingt natürlicher als „unter den Scherben aus Erde“ und entspricht weiterhin dem irdisch-tönernen Bild.
  - severity: low
    issue: Rhetorische Verbform
    rationale: „Wird etwa ... sagen?“ gibt die hebräische rhetorische Frage idiomatischer und mit ihrer zukunftsgerichtet-modalen Kraft wieder als das gegenwartsbezogene „Sagt etwa ...?“.
