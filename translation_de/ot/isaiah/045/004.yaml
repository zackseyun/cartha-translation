  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֨עַן֙ עַבְדִּ֣/י יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל בְּחִירִ֑/י וָ/אֶקְרָ֤א לְ/ךָ֙ בִּ/שְׁמֶ֔/ךָ אֲכַנְּ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: de
  text: Um meines Dieners Jakob willen und Israels, meines Erwählten, rief ich dich bei deinem Namen; ich gab dir einen Ehrennamen[a], obwohl du mich nicht kanntest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich gab dir einen Beinamen“ beziehungsweise „ich verlieh dir einen Titel“. Das hebräische Verb bezeichnet die Zuweisung einer Benennung oder Ehrenbezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: um ... willen
  rationale: Gibt den Zweck- beziehungsweise Beweggrund natürlich und würdevoll wieder.
- source_word: עַבְדִּי
  choice: meines Dieners
  rationale: Im prophetischen Zusammenhang ist dies eine ehrende Bundesbezeichnung für Jakob; „Sklave“ würde hier einen unzutreffenden Schwerpunkt setzen.
- source_word: בְּחִירִי
  choice: meines Erwählten
  rationale: Bewahrt die substantivische, persönliche Bezeichnung Israels und entspricht dem gehobenen Register.
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: rief ich dich bei deinem Namen
  rationale: Gibt sowohl den persönlichen Anruf als auch die ausdrückliche Namensangabe des Hebräischen wieder.
- source_word: אֲכַנְּךָ
  choice: ich gab dir einen Ehrennamen
  rationale: Das Piel von כנה bezeichnet wahrscheinlich das Verleihen einer Benennung, eines Beinamens oder Titels. „Ehrenname“ ist im Deutschen verständlich und bringt die auszeichnende Funktion im Kontext zum Ausdruck, ohne sie im Haupttext auf eine moderne Amtsbezeichnung festzulegen.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: obwohl du mich nicht kanntest
  rationale: 'Die konzessive Wiedergabe passt zum Zusammenhang: Gott beruft und bezeichnet Kyrus, obwohl dieser ihn nicht kannte.'
theological_decisions:
- issue: Das Nichtkennen Gottes durch den Angeredeten
  choice: 'Die Aussage bleibt uneingeschränkt: Kyrus wurde von Gott berufen, obwohl er ihn nicht kannte.'
  alternative: „obwohl du mich nicht anerkanntest“ oder eine Abschwächung zu unvollständiger Gotteserkenntnis
  rationale: Der hebräische Wortlaut spricht vom Nichtkennen. Die Übersetzung bewahrt die Spannung, dass Gott einen heidnischen Herrscher für seine Absicht einsetzt, ohne eine spätere Bekehrung oder bloß mangelnde Anerkennung hineinzulesen.
- issue: Gottesbezeichnung im Objektssuffix נִי
  choice: „mich“
  alternative: „den HERRN“
  rationale: Im Hebräischen steht lediglich das Objektssuffix der ersten Person. „Mich“ ist textnäher; die Identität des Sprechers ergibt sich aus dem Kontext.
- issue: Bedeutungsumfang von אֲכַנְּךָ
  choice: „ich gab dir einen Ehrennamen“ mit Fußnote zu weiteren Möglichkeiten
  alternative: „ich gab dir einen Beinamen“, „ich verlieh dir einen Titel“ oder „ich nannte dich ehrenvoll“
  rationale: Die genaue Art der verliehenen Benennung ist lexikalisch nicht völlig sicher. Der Haupttext gibt die wahrscheinliche auszeichnende Funktion wieder, während die Fußnote die echte Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Um ... willen“ wahrt den Nachdruck des hebräischen Satzanfangs. „Meines Erwählten“ ist gehoben, aber allgemein verständlich. Das Semikolon bildet den Übergang vom Beweggrund zum göttlichen Handeln ab.
