  source_fidelity: 'Die grundlegenden Wortentscheidungen sind zutreffend: „Erde“ steht dem kosmischen אֶרֶץ entsprechend, „gemacht“ und „erschaffen“ bewahren die Unterscheidung von עשה und ברא, und „Heer“ lässt den Bezugsumfang von צבא offen. Die Wiedergabe der zweiten Satzhälfte ist jedoch syntaktisch nicht tragfähig: „Ich – meine Hände haben“ macht „Hände“ zum finiten Subjekt und lässt das betonte אֲנִי unverbunden zurück. Eine idiomatische Umformung mit „Ich selbst“ und „mit meinen Händen“ erhält den Nachdruck und die bildliche Aussage ohne eine inhaltliche Ergänzung.'
