lexical_decisions:
- source_word: אָֽנֹכִי עָשִׂ֣יתִי אֶ֔רֶץ
  choice: Ich habe die Erde gemacht
  rationale: Das vorangestellte selbstständige Pronomen betont Gottes eigenes Handeln. Die Anfangsstellung von „Ich“ wahrt diesen Nachdruck; „gemacht“ gibt עשה im Schöpfungszusammenhang natürlich wieder und unterscheidet es von ברא.
- source_word: וְאָדָ֖ם
  choice: und den Menschen[a]
  rationale: אָדָם ist hier ein kollektiver Singular für die Menschheit. „Den Menschen“ bewahrt im Deutschen die Singularform und kann zugleich generisch verstanden werden; die Fußnote macht den kollektiven Sinn ausdrücklich.
- source_word: עָלֶ֣יהָ בָרָ֑אתִי
  choice: auf ihr erschaffen
  rationale: Das feminine Pronomen bezieht sich auf „Erde“. „Erschaffen“ gibt das für göttliches Schaffen charakteristische ברא wieder und hält den Unterschied zu „gemacht“ aufrecht.
- source_word: אֲנִ֗י יָדַי֙
  choice: Ich – meine Hände
  rationale: Die syntaktisch auffällige Wiederaufnahme mit אֲנִי wird durch eine markierte Voranstellung mit Gedankenstrich bewahrt, ohne das nicht ausdrücklich vorhandene „eigenen“ einzufügen.
- source_word: נָט֣וּ שָׁמַ֔יִם
  choice: haben den Himmel ausgespannt
  rationale: „Ausspannen“ ist eine natürliche und bildkräftige Wiedergabe des Schöpfungsidioms נטה שמים. Der deutsche Singular „Himmel“ bezeichnet hier idiomatisch den gesamten Himmelsraum.
- source_word: וְכָל צְבָאָ֖ם צִוֵּֽיתִי
  choice: und seinem ganzen Heer habe ich Befehle erteilt
  rationale: Das Suffix bezieht sich auf den Himmel. „Heer“ lässt offen, welche Gesamtheit himmlischer Wesen oder Himmelskörper gemeint ist; „Befehle erteilt“ gibt die Herrschaftsaussage von צוה klar und idiomatisch wieder.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: den Menschen
  alternative: die Menschheit
  rationale: „Den Menschen“ folgt der grammatischen Singularform und bezeichnet hier dennoch die menschliche Gattung. Die Fußnote bewahrt die kollektive Reichweite, ohne im Haupttext stärker zu abstrahieren.
- issue: Identität des „Heeres“ des Himmels
  choice: seinem ganzen Heer
  alternative: seiner ganzen Schar
  rationale: Der Ausdruck צבא kann die geordnete Gesamtheit des Himmels bezeichnen, ohne im Vers eindeutig zwischen Gestirnen und himmlischen Wesen zu unterscheiden. „Heer“ erhält diese Offenheit.
- issue: Nachdruck des zweiten אֲנִי
  choice: Ich – meine Hände
  alternative: Meine eigenen Hände
  rationale: Die gewählte Form erhält die ungewöhnliche hebräische Betonung und vermeidet, „eigenen“ als lexikalisch ausdrücklich vorhanden erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstellung. Der Gedankenstrich bildet die emphatische hebräische Wiederaufnahme ab. „Himmel“ und „Heer“ bewahren den kosmischen und zugleich mehrdeutigen Charakter der Aussage.
