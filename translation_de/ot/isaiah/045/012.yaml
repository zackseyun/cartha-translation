  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: de
  text: Ich habe die Erde gemacht und den Menschen[a] auf ihr erschaffen. Ich selbst habe den Himmel mit meinen Händen ausgespannt und seinem ganzen Heer Befehle erteilt.
  philosophy: optimal-equivalence
  footnotes:
