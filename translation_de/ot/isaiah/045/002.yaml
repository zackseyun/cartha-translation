  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: de
  text: Ich selbst werde vor dir hergehen und die unebenen Stellen ebnen[a]. Türen aus Bronze werde ich zerschmettern und eiserne Riegel zerhauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist textlich und lexikalisch schwierig; auch möglich: „und die Unebenheiten werde ich ebnen“. Manche Übersetzungen geben sie spezifischer mit „Berge“ oder „Höhen“ wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt Gottes persönliches Handeln hervor; „selbst“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: לְפָנֶיךָ אֵלֵךְ
  choice: werde vor dir hergehen
  rationale: Die räumliche Wendung bezeichnet das Vorausgehen; der Kontext einer prophetischen Zusage legt im Deutschen das Futur nahe.
- source_word: וַהֲדוּרִים אושר
  choice: und die unebenen Stellen ebnen
  rationale: Die textlich und lexikalisch schwierige Wendung weist wahrscheinlich auf erhöhtes, unebenes oder zerklüftetes Gelände, das eingeebnet wird. Die Wiedergabe wahrt den wahrscheinlichen Sinn, ohne sich auf „Berge“ festzulegen.
- source_word: דַּלְתוֹת נְחוּשָׁה
  choice: Türen aus Bronze
  rationale: דְּלָתוֹת bedeutet wörtlich „Türen“; נְחוּשָׁה bezeichnet hier Bronze. Die konkrete Bildsprache bleibt erhalten.
- source_word: אֲשַׁבֵּר
  choice: werde ich zerschmettern
  rationale: Die Piel-Form bezeichnet ein nachdrückliches Zerbrechen; „zerschmettern“ gibt diese Intensität knapp und würdig wieder.
- source_word: בְרִיחֵי בַרְזֶל
  choice: eiserne Riegel
  rationale: בְּרִיחִים sind Verschlussriegel oder -balken. „Eiserne Riegel“ ist im Deutschen idiomatisch und passt zum Bild befestigter Türen.
- source_word: אֲגַדֵּעַ
  choice: zerhauen
  rationale: Das Verb bezeichnet das Ab- oder Durchhauen. „Zerhauen“ vermittelt hier die gewaltsame, vollständige Beseitigung der eisernen Riegel.
theological_decisions:
- issue: Betonung des göttlichen Selbstbezugs
  choice: Ich selbst werde vor dir hergehen
  alternative: Ich werde vor dir hergehen
  rationale: Das eigenständige אֲנִי ist emphatisch. „Ich selbst“ bewahrt die Zusage des persönlichen Handelns Gottes, ohne zusätzliche theologische Aussagen einzutragen.
- issue: Deutung der schwierigen Gelände-Wendung
  choice: die unebenen Stellen ebnen
  alternative: die Berge einebnen / die Höhen gerade machen
  rationale: Da Textgestalt und Lexik unsicher sind, wird die allgemeine Vorstellung beseitigter Hindernisse wiedergegeben und die spezifischere Deutung als Berge oder Höhen nicht in den Haupttext erhoben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache bleibt konkret und kräftig; die schwierige hebräische Wendung wird verständlich, aber bewusst nicht überpräzise wiedergegeben.
