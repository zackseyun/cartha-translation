    rationale: „Die Wolken sollen Gerechtigkeit herabströmen lassen“ macht die Wolken zu bloßen Veranlassern. Das hebräische Verb schildert vielmehr unmittelbar das Herabfließen bzw. -rieseln dessen, was die Wolken geben.
