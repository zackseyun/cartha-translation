    issue: Fußnote b bezeichnet eine unsichere Deutung als wörtlich
    rationale: Die Verbindung des Pluralverbs ויפרו mit ישע ist im masoretischen Text syntaktisch schwierig. „Sie sollen Heil hervorbringen“ kann eine mögliche Auslegung sein, ist aber keine unproblematische wörtliche Entsprechung und sollte als Möglichkeit, nicht als wörtlichere Fassung bezeichnet werden.
