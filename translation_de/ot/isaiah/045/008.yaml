  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: de
  text: Träufelt von oben, ihr Himmel, und die Wolken sollen Gerechtigkeit[a] herabrieseln! Die Erde öffne sich, damit Heil hervorsprosse, und sie lasse zugleich Gerechtigkeit sprießen. Ich, Jahwe, habe es erschaffen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“. Die hebräischen Wörter צֶדֶק und צְדָקָה können je nach Zusammenhang sowohl Gerechtigkeit als auch Recht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „es“ wiedergegebene hebräische Suffix kann sich auf das eben geschilderte Geschehen als Ganzes beziehen.
    reason: referent_ambiguity
lexical_decisions:
- source_word: הַרְעִיפוּ
  choice: Träufelt
  rationale: Der Imperativ von רעף bezeichnet das Herabträufeln oder Herabtropfen. „Träufelt“ bewahrt das Niederschlagsbild, ohne es zu einem heftigen Regen zu steigern.
- source_word: שָׁמַיִם מִמַּעַל
  choice: von oben, ihr Himmel
  rationale: Die direkte Anrede und die räumliche Angabe werden in gehobenem, aber verständlichem Deutsch bewahrt.
- source_word: שְׁחָקִים יִזְּלוּ
  choice: die Wolken sollen … herabströmen lassen
  rationale: שׁחקים bezeichnet hier parallel zu den Himmeln die Wolken; נזל beschreibt ein Fließen oder Herabfließen. Die deutsche Formulierung erhält das Bild eines von oben kommenden Stroms.
- source_word: צֶדֶק / צְדָקָה
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl rechtes Handeln und rechte Ordnung als auch den forensisch-sozialen Aspekt ab und passt zur Verbindung mit Heil. Die Wiederholung desselben Wortstamms wird sichtbar gehalten.
- source_word: תִּפְתַּח אֶרֶץ
  choice: Die Erde öffne sich
  rationale: Der jussivische poetische Satz wird als Aufforderung wiedergegeben; „Erde“ erhält die kosmische Weite des Bildes.
- source_word: וְיִפְרוּ יֶשַׁע
  choice: sodass Heil hervorsprosst
  rationale: פרה bezeichnet Fruchtbarkeit beziehungsweise Hervorbringen. Die Wiedergabe erhält das Wachstumsbild und gibt den in der hebräischen Dichtung verdichteten Zusammenhang mit der sich öffnenden Erde natürlich wieder; die grammatische Besonderheit wird in einer Fußnote offengelegt.
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: und zugleich lasse sie Gerechtigkeit wachsen
  rationale: צמח bezeichnet vegetatives Sprossen oder Wachsen; יחד markiert das gemeinsame beziehungsweise gleichzeitige Hervorkommen. Das feminine Verb lässt sich auf „Erde“ beziehen.
- source_word: אֲנִי יְהוָה
  choice: Ich, Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die appositionelle Form entspricht dem verblosen hebräischen Ausdruck.
- source_word: בְּרָאתִיו
  choice: habe es erschaffen
  rationale: ברא bedeutet „erschaffen“. Das maskuline Singularsuffix wird mit „es“ wiedergegeben, ohne seinen Bezug vorschnell auf nur eines der zuvor genannten Bilder festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den im Ausgangstext ausdrücklich stehenden Bundesnamen und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von צדק und צדקה
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Im Zusammenhang mit Heil und kosmischer Erneuerung wahrt „Gerechtigkeit“ die umfassende Bedeutung; die stärker rechtlich-soziale Nuance „Recht“ bleibt in der Fußnote erhalten.
- issue: Subjekt und Syntax von וְיִפְרוּ יֶשַׁע
  choice: Heil wird als das aus der geöffneten Erde Hervorsprossende dargestellt
  alternative: „und sie sollen Heil hervorbringen“ beziehungsweise „und Heil soll Frucht bringen“
  rationale: Der masoretische Text hat ein Verb im Plural, während die poetische Bildfolge die geöffnete Erde und das hervorkommende Heil eng verbindet. Die Hauptfassung gibt den Bildsinn idiomatisch wieder, ohne die grammatische Spannung stillschweigend zu beseitigen; diese wird ausdrücklich angemerkt.
- issue: Bezug des Suffixes in בְּרָאתִיו
  choice: es
  alternative: dies alles
  rationale: Das hebräische maskuline Suffix hat keinen völlig eindeutigen Einzelbezug. „Es“ erhält diese Offenheit, während eine Fußnote den möglichen Gesamtbezug erklärt.
translation_notes:
  register: Poetisch-erhabener, zugleich moderner Standardstil. Imperative und jussivische Formen erhalten den feierlichen Aufruf; die Niederschlags- und Wachstumsbilder werden konkret bewahrt. Ungewöhnliche hebräische Syntax und mehrdeutige Bezüge werden nicht dogmatisch aufgelöst, sondern in Fußnoten kenntlich gemacht.
