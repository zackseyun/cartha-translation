  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: de
  text: In Jahwe werden alle Nachkommen Israels[b] gerecht gesprochen[a] und sich rühmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als im Recht erwiesen“. Das hebräische Verb kann sowohl „gerecht gesprochen werden“ als auch „als im Recht erwiesen werden“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Same Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: In Jahwe
  rationale: 'Die Präposition ב bezeichnet hier am ehesten den Bezugs- oder Grundbereich: In Jahwe findet Israels Nachkommenschaft ihre Gerechtsprechung und ihren Ruhm. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.'
- source_word: יִצְדְּקוּ
  choice: wird … gerecht gesprochen
  rationale: Das Qal von צדק kann bedeuten, als gerecht beziehungsweise im Recht erwiesen zu werden. „Gerecht gesprochen“ bewahrt den deklarativen Sinn, ohne die mögliche Nuance der Rechtfertigung oder Rehabilitierung auszuschließen.
- source_word: וְיִתְהַלְלוּ
  choice: und wird sich rühmen
  rationale: Der Hitpael von הלל bezeichnet hier reflexiv das Sich-Rühmen. Die deutsche Formulierung ist natürlich und erhält diese reflexive Bedeutung.
- source_word: כָּל
  choice: die ganze
  rationale: כָּל bezieht sich auf das folgende Kollektiv „Nachkommenschaft“; im Deutschen ist „die ganze Nachkommenschaft“ idiomatischer als „alle Nachkommenschaft“.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: Nachkommenschaft Israels
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv die Nachkommen. „Nachkommenschaft“ gibt diesen kollektiven Sinn in würdigem, modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ erhält den Charakter als Eigenname und folgt der vorgegebenen Entscheidung, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von צדק im Heilszusammenhang
  choice: gerecht gesprochen werden
  alternative: als im Recht erwiesen werden
  rationale: Die gewählte Fassung bewahrt den deklarativen beziehungsweise resultativen Sinn. Da das Verb zugleich eine vindizierende Nuance haben kann, wird diese echte Mehrdeutigkeit in einer Fußnote sichtbar gemacht.
- issue: Bezug von „sich rühmen“
  choice: Der knappe hebräische Satz wird ohne ausdrücklich ergänztes Objekt wiedergegeben.
  alternative: sich Jahwes rühmen / sich in Jahwe rühmen
  rationale: Im Hebräischen steht bei וְיִתְהַלְלוּ kein eigenes Objekt. Der vorangestellte Ausdruck „In Jahwe“ kann semantisch auf beide Verben bezogen werden, doch die Übersetzung ergänzt dies beim zweiten Verb nicht ausdrücklich und vermeidet so eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „die ganze Nachkommenschaft … wird“ folgt der deutschen Grammatik und gibt das hebräische Kollektiv wieder. Die Wortstellung hält „In Jahwe“ betont am Satzanfang.
