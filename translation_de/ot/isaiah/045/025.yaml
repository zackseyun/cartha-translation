  source_fidelity: 'Die Grundbedeutungen sind zutreffend wiedergegeben: ביהוה als „In Jahwe“, צדק mit der offenen Nuance von Rechtfertigung/Vindikation und הלל als Sich-Rühmen. Allerdings stehen im Hebräischen beide Verben im Plural; „alle Nachkommen Israels“ bildet dies im Deutschen klarer ab als der kollektive Singular. Die vorangestellte Präpositionalphrase kann, wie im Hebräischen, beide Prädikate bestimmen.'
  naturalness: „Alle Nachkommen Israels werden in Jahwe gerecht gesprochen und sich rühmen“ ist modernes, würdiges und syntaktisch flüssiges Standarddeutsch. Es vermeidet die etwas schwerfällige Wiederholung „wird ... und wird“ und bringt die pluralische Satzstruktur des Ausgangstextes zur Geltung.
  terminology: „Jahwe“, „gerecht gesprochen“ und „sich rühmen“ sind angemessen. „Nachkommen“ ist im heutigen Deutsch idiomatischer als „Nachkommenschaft“ und gibt זרע als kollektive Bezeichnung zuverlässig wieder. Die Alternative „als im Recht erwiesen“ bewahrt die mögliche vindizierende Nuance.
