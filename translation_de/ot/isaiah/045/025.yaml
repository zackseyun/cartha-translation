revisions:
- from: In Jahwe wird die ganze Nachkommenschaft Israels gerecht gesprochen[a] und wird sich rühmen[b].
  to: In Jahwe werden alle Nachkommen Israels[b] gerecht gesprochen[a] und sich rühmen.
  rationale: Die Revision stellt die pluralischen Verbformen des hebräischen Textes mit „alle Nachkommen ... werden“ transparent dar, verbessert die idiomatische Satzführung und setzt den lexikalischen Fußnotenanker direkt bei dem erläuterten Ausdruck. Die offene Bedeutung von צדק bleibt in der Fußnote erhalten; für das Sich-Rühmen wird kein im Hebräischen nicht eigens ausgedrücktes Objekt ergänzt.
