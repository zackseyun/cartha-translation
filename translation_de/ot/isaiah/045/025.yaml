  - severity: medium
    issue: Fußnotenanker b steht beim falschen Wort
    rationale: Die Fußnote erläutert „Nachkommenschaft“ beziehungsweise זרע („Same“), ihr Marker steht jedoch nach „rühmen“. Der Marker muss unmittelbar nach „Nachkommen Israels“ stehen.
  - severity: low
