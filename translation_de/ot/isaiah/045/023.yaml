base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
translation:
  language: de
  text: 'Bei mir selbst habe ich geschworen; aus meinem Mund ist ein gerechtes Wort hervorgegangen, und es wird nicht zurückkehren: Mir wird sich jedes Knie beugen, jede Zunge wird schwören.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus meinem Mund ist in Gerechtigkeit ein Wort hervorgegangen … jede Zunge wird einen Eid ablegen.“ Die hebräische Formulierung kann entweder die Gerechtigkeit des Wortes oder die Gerechtigkeit seines Aussprechens betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Bei mir selbst habe ich geschworen
  rationale: Die hebräische Schwurformel bezeichnet Gott selbst als Bürge des Eides. „Bei mir selbst“ gibt die emphatische Selbstreferenz im Deutschen natürlich wieder.
- source_word: יָצָא מִפִּי
  choice: aus meinem Mund ist … hervorgegangen
  rationale: Bewahrt das konkrete Bild des Wortes, das aus Gottes Mund hervorgeht, in würdigem, gegenwärtigem Deutsch.
- source_word: צְדָקָה דָּבָר
  choice: ein gerechtes Wort
  rationale: Die knappe hebräische Verbindung lässt sich attributiv verstehen. „Ein gerechtes Wort“ bewahrt den Sinn von Gerechtigkeit beziehungsweise Richtigkeit, ohne ihn auf bloße Wahrheit oder einen Rechtsspruch zu verengen.
- source_word: וְלֹא יָשׁוּב
  choice: und es wird nicht zurückkehren
  rationale: Erhält die hebräische Metapher eines Wortes, das nicht zurückkehrt; „nicht widerrufen werden“ wäre stärker auslegend.
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: Vor mir wird sich jedes Knie beugen
  rationale: Das wörtliche „mir“ bezeichnet hier die auf Gott gerichtete Unterwerfung. „Vor mir“ ist im Deutschen die natürliche Form des Bildes, ohne dessen Aussage zu erweitern.
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: jede Zunge wird schwören
  rationale: „Schwören“ gibt den Niphal von שבע unmittelbar wieder und vermeidet, den Gegenstand oder die innere Qualität des Eides ergänzend festzulegen.
theological_decisions:
- issue: Art der universalen Unterwerfung
  choice: Universale Beugung und universales Schwören werden ausgesagt, ohne Freiwilligkeit, Zwang oder innere Haltung zu bestimmen.
  alternative: „Jede Zunge wird mir Treue schwören“ oder „wird sich zu mir bekennen“
  rationale: Der hebräische Text beschreibt die umfassende Anerkennung der Herrschaft Gottes, legt aber an dieser Stelle weder ausdrücklich den Inhalt des Schwurs noch die innere Verfassung der Schwörenden fest.
- issue: Bezug von צְדָקָה
  choice: „ein gerechtes Wort“
  alternative: „in Gerechtigkeit ist ein Wort hervorgegangen“
  rationale: Die verdichtete Syntax erlaubt unterschiedliche Zuordnungen. Der Haupttext folgt der natürlichen attributiven Wiedergabe; die alternative adverbiale Beziehung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, im Deutschen geläufige Körpermetapher „jedes Knie beugen“ bleibt erhalten. Der abschließende Schwur wird bewusst nicht als Treueschwur oder Bekenntnis präzisiert, damit die Offenheit des Hebräischen gewahrt bleibt.
