translation:
  language: de
  text: Ich forme das Licht und erschaffe die Finsternis, ich schaffe Frieden und erschaffe Unheil[a]. Ich bin Jahwe, der dies alles tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Katastrophe“ oder „Böses“. Das hebräische Wort רָע kann Böses, Schlimmes, Schaden, Unglück oder Unheil bedeuten. Hier bezeichnet es im Gegensatz zu „Frieden“ wahrscheinlich Unheil oder widrige Verhältnisse, nicht primär moralisches Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצֵר
  choice: formt
  rationale: Das Qal-Partizip von יצר bezeichnet das Formen oder Gestalten. Die präsentische Wiedergabe ist im Deutschen natürlich und hält den Unterschied zu ברא („erschaffen“) aufrecht.
- source_word: אוֹר
  choice: Licht
  rationale: Die Grundbedeutung „Licht“ entspricht dem ausdrücklichen Gegensatz zur Finsternis.
- source_word: וּבוֹרֵא
  choice: und … erschafft
  rationale: Das Qal-Partizip von ברא bezeichnet hier göttliches Schaffen. „Erschafft“ bewahrt den gewichtigen Ausdruck und die Wiederholung desselben Verbs in beiden Vershälften.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ gibt den poetisch-gehobenen Gegenbegriff zu „Licht“ prägnant wieder.
- source_word: עֹשֶׂה
  choice: schafft / tut
  rationale: עשה ist semantisch weit. Bei שָׁלוֹם ist „Frieden schafft“ idiomatisch; in der zusammenfassenden Schlussklausel ist „tut“ natürlich und umfassend.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם kann Wohlergehen und Ganzheit einschließen; im knappen Gegensatz zu רָע wahrt „Frieden“ die poetische Antithese.
- source_word: רָע
  choice: Unheil
  rationale: רָע kann Böses, Schlimmes, Schaden oder Katastrophe bezeichnen. Im Gegensatz zu שָׁלוֹם bezeichnet es hier am ehesten leidvolle Widerfahrnis beziehungsweise Gericht, ohne die mögliche Härte des Ausdrucks zu beseitigen.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Das ausdrückliche Pronomen unterstreicht die Selbstidentifikation; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: der dies alles tut
  rationale: Die Partizipialklausel fasst sämtliche vorher genannten Handlungen zusammen. „Dies alles“ wahrt den umfassenden Anspruch göttlichen Handelns.
theological_decisions:
- issue: Wiedergabe von רָע als Gegenstand göttlichen Schaffens
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Der Gegensatz zu שָׁלוֹם legt Unheil oder widrige Zustände nahe. „Böses“ würde im heutigen Deutsch vorrangig moralische Bosheit bezeichnen und den Sinn unnötig festlegen; „Katastrophe“ wäre enger als das hebräische Wort. „Unheil“ bewahrt die Spannung der Aussage über Jahwes umfassende Souveränität.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben, sodass die persönliche Selbstidentifikation erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die wechselnde Wiedergabe von עשה als „schafft“ und „tut“ folgt dem jeweiligen deutschen Sprachgebrauch; die beiden Vorkommen von ברא bleiben bewusst einheitlich „erschafft“.
