  text: אָכֵ֕ן אַתָּ֖ה אֵ֣ל מִסְתַּתֵּ֑ר אֱלֹהֵ֥י יִשְׂרָאֵ֖ל מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: de
  text: Wahrlich, du bist ein Gott, der sich verbirgt[a], der Gott Israels, der Retter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein verborgener Gott“. Das hebräische Partizip kann reflexiv („der sich verbirgt“) oder eher stativ („der verborgen ist“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Ja
  rationale: Das bekräftigende אָכֵן leitet hier eine nachdrückliche Erkenntnis bzw. ein Bekenntnis ein. „Ja“ klingt im Deutschen natürlich und würdevoll.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen der 2. Person Singular richtet die Aussage unmittelbar an Gott.
- source_word: אֵל
  choice: Gott
  rationale: Im Kontext bezeichnet אֵל eindeutig den Gott Israels; „Gott“ gibt den Ausdruck ohne unnötige Erweiterung wieder.
- source_word: מִסְתַּתֵּר
  choice: der sich verbirgt
  rationale: Das Hitpael-Partizip lässt sich reflexiv bzw. medial verstehen und bewahrt so den verbalen Gedanken des Sich-Verbergens. Die stative Möglichkeit wird in der Fußnote genannt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Wendung steht als Apposition und identifiziert den zuvor angesprochenen Gott näher; der bestimmte Artikel sorgt im Deutschen für eine natürliche Fügung.
- source_word: מוֹשִׁיעַ
  choice: der Retter
  rationale: Das Hifil-Partizip von ישׁע bezeichnet den, der rettet. „Retter“ ist im modernen Deutsch natürlich und erhält den titelartigen Charakter.
theological_decisions:
- issue: Bedeutung der Verborgenheit Gottes
  choice: „ein Gott, der sich verbirgt“
  alternative: „ein verborgener Gott“ / „ein Gott, der verborgen ist“
  rationale: Die Übersetzung gibt die reflexive bzw. mediale Deutung des hebräischen Partizips wieder, ohne zu erklären, ob Gottes Unergründlichkeit, verborgenes Handeln oder zeitweilige Verhüllung gemeint ist. Die mögliche stative Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. Die Appositionen bleiben erhalten; die echte Mehrdeutigkeit des Partizips wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote sichtbar gemacht.
