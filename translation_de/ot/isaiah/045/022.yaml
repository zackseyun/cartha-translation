  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: de
  text: Wendet euch mir zu und lasst euch retten[a], ihr alle an den Enden der Erde! Denn ich bin Gott, und es gibt keinen anderen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Blickt auf mich und lasst euch retten.“ Das hebräische Verb kann die Hinwendung zu jemandem bezeichnen und in diesem Zusammenhang auch das Ausrichten des Blicks auf Gott einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Wendet euch mir zu
  rationale: Der Imperativ von פנה bezeichnet hier eine Hinwendung oder Ausrichtung auf den Sprecher. „Wendet euch mir zu“ gibt diese Bewegung natürlich wieder, ohne den möglichen Sinn „blickt auf mich“ auszuschließen.
- source_word: וְהִוָּשְׁעוּ
  choice: und lasst euch retten
  rationale: Der pluralische Nifal-Imperativ von ישׁע bezeichnet empfangene Rettung. „Lasst euch retten“ ist im modernen Deutschen natürlicher als „werdet gerettet“ und bewahrt den passiven Sinn.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: alle Enden der Erde
  rationale: Die feste Wendung bezeichnet sämtliche fernsten Bereiche der Erde und unterstreicht die weltweite Reichweite des Aufrufs.
- source_word: כִּי אֲנִי אֵל
  choice: Denn ich bin Gott
  rationale: כִּי begründet den vorangehenden Aufruf; אֵל ist hier die Bezeichnung „Gott“ und kein zu transliterierender Eigenname.
- source_word: וְאֵין עוֹד
  choice: und sonst gibt es keinen
  rationale: Die hebräische Wendung drückt uneingeschränkte Einzigkeit aus. Die deutsche Formulierung ist klar und bewahrt, dass ein ergänztes „außer mir“ im Hebräischen nur implizit ist.
theological_decisions:
- issue: Gottes Einzigkeit und der universale Ruf zur Rettung
  choice: „Denn ich bin Gott, und sonst gibt es keinen.“
  alternative: „Denn ich bin Gott, und es gibt keinen außer mir.“
  rationale: Der abschließende Satz begründet den weltweiten Rettungsruf mit Gottes ausschließlicher Göttlichkeit. Die gewählte Fassung erhält diese Aussage, ohne das im Hebräischen nicht ausdrücklich wiederholte „außer mir“ einzufügen.
- issue: Empfangene Rettung im Nifal-Imperativ
  choice: „lasst euch retten“
  alternative: „werdet gerettet“
  rationale: Die Form stellt Rettung als etwas dar, das den Angesprochenen zuteilwird. Die idiomatische deutsche Wiedergabe soll weder menschliche Selbsterrettung nahelegen noch eine weitergehende systematische Aussage über das Verhältnis von göttlichem und menschlichem Handeln in den Text eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Anrede „alle Enden der Erde“ bewahrt das poetische Bild; der Ausruf markiert den eindringlichen universalen Aufruf.
