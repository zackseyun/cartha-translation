  - severity: low
    issue: „alle Enden der Erde“ wirkt als direkte Anrede im Deutschen unidiomatisch.
    rationale: Die hebräische poetische Metonymie kann im Deutschen natürlich als Anrede der Menschen in den fernsten Teilen der Erde formuliert werden, ohne den Umfang des Aufrufs zu verändern.
