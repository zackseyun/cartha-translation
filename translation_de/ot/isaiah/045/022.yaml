  source_fidelity: 'Die Imperative werden sachgerecht wiedergegeben: פנו als Aufforderung zur Hinwendung zu Gott und והושעו als empfangene Rettung. Die universale Anrede und die Begründung durch Gottes ausschließliche Göttlichkeit bleiben erhalten. „Keinen anderen“ gibt ואין עוד idiomatisch wieder, ohne „außer mir“ ausdrücklich einzutragen.'
  naturalness: „Alle Enden der Erde“ als unmittelbare Anrede ist im Deutschen zwar verständlich, klingt jedoch weniger natürlich, weil geographische „Enden“ nicht selbst angesprochen werden können. „Ihr alle an den Enden der Erde“ bewahrt das Bild und macht die gemeinten Menschen idiomatisch deutlich. „Sonst gibt es keinen“ ist zudem mehrdeutig, da „sonst“ auch konditional oder temporal verstanden werden kann.
  terminology: „Gott“, „retten“ und „Enden der Erde“ entsprechen dem prophetischen Register und den zentralen Begriffen des Hebräischen. „Keinen anderen“ wahrt die absolute Exklusivbehauptung von ואין עוד in modernem Standarddeutsch.
