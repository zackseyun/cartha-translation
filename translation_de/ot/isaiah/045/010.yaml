  text: ה֛וֹי אֹמֵ֥ר לְ/אָ֖ב מַה תּוֹלִ֑יד וּ/לְ/אִשָּׁ֖ה מַה תְּחִילִֽי/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: de
  text: 'Wehe dem, der zu einem Vater sagt: »Was zeugst du?«[a], oder zu einer Frau: »Was gebierst du?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet hier ausdrücklich das väterliche Zeugen.
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb lässt an Geburtswehen und das Sich-Winden bei der Geburt denken; auch: »Womit liegst du in den Wehen?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe dem
  rationale: Die prophetische Weheruf-Formel behält die scharfe Kraft von Anklage und Unheilsankündigung.
- source_word: אֹמֵר
  choice: der … sagt
  rationale: Das substantivisch gebrauchte Partizip wird als allgemeine Personenbezeichnung natürlich wiedergegeben.
- source_word: לְאָב
  choice: zu einem Vater
  rationale: Im Hebräischen steht kein Possessivsuffix; daher ist »einem Vater« genauer als »seinem Vater«.
- source_word: מַה תּוֹלִיד
  choice: Was zeugst du?
  rationale: Der Hifil von ילד bezeichnet beim männlichen Angesprochenen das Zeugen eines Kindes; »zeugen« bewahrt die ausdrücklich väterliche Perspektive.
- source_word: וּלְאִשָּׁה
  choice: oder zu einer Frau
  rationale: Das Waw verbindet hier zwei parallele, alternative Anreden; im Deutschen bildet »oder« die Paarung idiomatisch ab. Ein Possessivverhältnis wie »seiner Mutter« steht nicht im Text.
- source_word: מַה תְּחִילִין
  choice: Was gebierst du?
  rationale: Die Form bezeichnet das Sich-Winden in Geburtswehen beziehungsweise den Geburtsvorgang. »gebären« ist knapp, verständlich und wahrt die weibliche Geburtsmetaphorik, während die Fußnote den Aspekt der Wehen sichtbar hält.
theological_decisions:
- issue: Aussagekraft des Eltern-Kind-Bildes
  choice: Das konkrete Bild von Vater und Frau bleibt stehen, ohne den im Zusammenhang gemeinten Schöpfer ausdrücklich in den Vers einzutragen.
  alternative: »Vater und Mutter« schreiben oder erläuternd ergänzen, dass hier das Infragestellen Gottes gemeint ist.
  rationale: Der hebräische Vers formuliert die Analogie selbst in konkreten elterlichen Bildern. Ihre Anwendung auf den Schöpfer ergibt sich aus dem Kontext und soll nicht als erklärende Paraphrase in den Vers eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionelle Weheruf »Wehe dem« erhält den prophetischen Ton; »zeugen« und »gebären« bewahren den parallelen väterlichen und mütterlichen Bildbereich ohne zusätzliche Ausdeutung.
