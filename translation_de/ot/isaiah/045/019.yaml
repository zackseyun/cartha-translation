base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: de
  text: 'Nicht im Verborgenen habe ich geredet, nicht an einem Ort in einem Land der Finsternis. Zu den Nachkommen Jakobs habe ich nicht gesagt: »Sucht mich vergeblich!«[a] Ich, Jahwe, rede, was gerecht ist, und verkünde, was recht ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sucht mich ins Leere hinein!« Das hebräische Wort תֹהוּ kann Leere, Nichtigkeit, Vergeblichkeit oder Formlosigkeit bezeichnen. Hier ist gemeint, dass die Suche nach Jahwe nicht zwecklos ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »rede, was recht ist« beziehungsweise »spreche Recht«. Das hebräische Wort צֶדֶק kann Gerechtigkeit, Richtigkeit oder Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: im Verborgenen
  rationale: סֵתֶר bezeichnet Verborgenheit oder Heimlichkeit. »Im Verborgenen« ist natürliches, würdevolles Deutsch und bewahrt den Gegensatz zu Jahwes offener, verlässlicher Rede.
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: an einem Ort in einem Land der Finsternis
  rationale: Die Wiedergabe hält die doppelte Ortsangabe von מָקוֹם und אֶרֶץ fest und bewahrt zugleich das Bild der Finsternis.
- source_word: לְזֶרַע יַעֲקֹב
  choice: zu den Nachkommen Jakobs
  rationale: זֶרַע ist hier kollektiv gebraucht. »Nachkommen« gibt den Sinn im modernen Deutsch klar wieder, ohne ihn auf eine einzelne Person zu verengen.
- source_word: תֹּהוּ
  choice: vergeblich
  rationale: תֹהוּ kann Leere, Nichtigkeit, Formlosigkeit oder Vergeblichkeit bezeichnen. Im Zusammenhang mit der Aufforderung, Jahwe zu suchen, steht die Zwecklosigkeit im Vordergrund.
- source_word: בַקְּשׁוּנִי
  choice: Sucht mich
  rationale: Der Imperativ im Plural mit Objektsuffix wird direkt und idiomatisch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דֹּבֵר צֶדֶק
  choice: spreche Gerechtigkeit
  rationale: Die substantivische Form von צֶדֶק und ihre moralisch-theologische Weite bleiben erhalten; die leicht gehobene Formulierung entspricht dem würdevollen prophetischen Register.
- source_word: מַגִּיד מֵישָׁרִים
  choice: verkünde, was recht ist
  rationale: מֵישָׁרִים bezeichnet Geradheit, Redlichkeit oder das Rechte. Die Formulierung ist verständlich und bewahrt den ethischen Sinn.
theological_decisions:
- issue: Jahwes Selbstbeschreibung am Versende
  choice: Ich, Jahwe, spreche Gerechtigkeit und verkünde, was recht ist.
  alternative: Ich, Jahwe, sage, was richtig ist, und verkünde das Rechte.
  rationale: Die gewählte Fassung bewahrt die Bedeutungsweite von צֶדֶק zwischen Gerechtigkeit, Richtigkeit und gerechtem Handeln und verengt die Aussage weder auf bloße Tatsachenwahrheit noch ausschließlich auf Rechtsprechung.
- issue: Sinn von תֹּהוּ in der Aufforderung, Jahwe zu suchen
  choice: Sucht mich vergeblich!
  alternative: Sucht mich ins Leere hinein! / Sucht mich umsonst!
  rationale: Im Kontext bestreitet Jahwe, seine Nachkommen zu einer aussichtslosen Suche aufgefordert zu haben. »Vergeblich« wahrt diesen Sinn, ohne die weitere Bedeutungsbreite des hebräischen Wortes zu verschweigen.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen prophetischen Register. Der Parallelismus der beiden abschließenden Aussagen und die Spannung zwischen verborgener Rede und verlässlicher Offenbarung bleiben erhalten.
