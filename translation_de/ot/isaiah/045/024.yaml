base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: de
  text: 'Von mir wird man sagen: »Nur bei Jahwe sind Gerechtigkeit[a] und Stärke.« Zu ihm wird man kommen[b], und alle, die gegen ihn entbrannt sind, werden beschämt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort steht im Plural; auch möglich: „Rechtserweise“ oder „gerechte Taten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Satzfügung ist mehrdeutig. Auch möglich: „Nur bei Jahwe sind Gerechtigkeit und Stärke“, wird man sagen. Das Verb „kommen“ steht im Hebräischen im Singular und kann einen unbestimmten oder kollektiv verstandenen Bezug haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ בַּיהוָה
  choice: Nur bei Jahwe
  rationale: אַךְ bezeichnet hier Ausschließlichkeit bzw. Nachdruck; בְּ beschreibt, wo Gerechtigkeit und Stärke zu finden sind. „Bei Jahwe“ ist im Deutschen natürlicher als „in Jahwe“ und bewahrt den Gottesnamen.
- source_word: לִי אָמַר
  choice: sagt man von mir
  rationale: Die knappe hebräische Fügung ist syntaktisch mehrdeutig. Die unpersönliche Wiedergabe erhält den berichtenden Charakter und das Pronomen der ersten Person, ohne einen bestimmten Sprecher einzusetzen.
- source_word: צְדָקוֹת
  choice: gerechte Taten
  rationale: Der hebräische Plural kann konkrete Erweise von Gerechtigkeit, Rechtserweise oder Rechtfertigungen bezeichnen. „Gerechte Taten“ bildet den Plural sichtbar ab, ohne ihn auf einen rein forensischen Sinn zu verengen.
- source_word: וָעֹז
  choice: und Stärke
  rationale: עֹז bezeichnet Stärke oder Macht; „Stärke“ ist klar, würdig und passt zur parallelen Aussage.
- source_word: עָדָיו יָבוֹא
  choice: Zu ihm wird man kommen
  rationale: Das Verb steht im Singular und kann ein unbestimmtes oder kollektiv verstandenes Subjekt haben. Das deutsche unpersönliche „man“ bewahrt den Numerus besser als ein vorweggenommenes pluralisches Subjekt.
- source_word: וְיֵבֹשׁוּ
  choice: werden beschämt dastehen
  rationale: בוש bezeichnet im Gerichtszusammenhang Scham und das Scheitern einer feindlichen Haltung. Die Formulierung gibt sowohl Zustand als auch Ergebnis wieder.
- source_word: כֹּל הַנֶּחֱרִים בּוֹ
  choice: alle, die gegen ihn entbrannt waren
  rationale: חרה beschreibt heftigen, brennenden Zorn; בּוֹ markiert hier die gegen Jahwe gerichtete Feindschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ die traditionelle Leseersetzung wiedergibt.
- issue: Bedeutung des Plurals צְדָקוֹת
  choice: gerechte Taten
  alternative: Gerechtigkeit; Rechtserweise
  rationale: Der Plural legt konkrete Erweise rechten Handelns oder rettender Rechtsetzung nahe. Die Alternative „Gerechtigkeit“ bleibt möglich und wird in der Fußnote genannt.
- issue: Mehrdeutige Redeeinleitung לִי אָמַר
  choice: „Nur bei Jahwe“, sagt man von mir, „sind …“
  alternative: 'Man wird sagen: „Nur bei Jahwe sind …“; Er sagt zu mir: „Nur bei Jahwe sind …“'
  rationale: Die hebräische Wortfolge ist ungewöhnlich und lässt die Zuordnung von לִי sowie das Subjekt von אָמַר offen. Der Haupttext erhält das Ich-Pronomen und den unpersönlichen Sprecher, während die Fußnote die wesentliche syntaktische Alternative dokumentiert.
- issue: Subjekt von יָבוֹא
  choice: man
  alternative: er; sie
  rationale: Das Verb ist morphologisch Singular, der folgende Satz nennt jedoch eine Mehrzahl. Das unpersönliche „man“ wahrt diese Spannung besser als eine eindeutige pluralische Auflösung.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Knappheit. „Entbrannt“ bewahrt das hebräische Bild heftigen Zorns; „beschämt dastehen“ ist verständlich und trägt den prophetischen Gerichtston. Die direkte Rede macht die schwierige Redeeinleitung lesbar, ohne ihre Mehrdeutigkeit im Fußnotenapparat zu verdecken.
