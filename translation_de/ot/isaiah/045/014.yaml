  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: de
  text: 'So spricht Jahwe: Der Ertrag Ägyptens und der Handelsgewinn von Kusch und den Sebäern, hochgewachsenen Männern, werden zu dir übergehen und dir gehören. Hinter dir werden sie hergehen, in Fesseln werden sie zu dir übergehen. Vor dir werden sie sich niederwerfen und zu dir flehen[a]: »Wahrlich, in dir ist Gott, und sonst gibt es keinen; es gibt keinen anderen Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dir beten“. Das hebräische Verb kann Gebet oder inständiges Flehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt dessen Eigennamecharakter.
- source_word: יְגִיעַ מִצְרַיִם
  choice: der Ertrag Ägyptens
  rationale: יְגִיעַ bezeichnet hier das durch Arbeit Erworbene bzw. Hervorgebrachte; „Ertrag“ erhält diesen Zusammenhang und passt zum wirtschaftlichen Parallelbegriff.
- source_word: סְחַר כּוּשׁ
  choice: der Handelsgewinn von Kusch
  rationale: סְחַר kann Handel, Handelsware oder daraus gewonnenen Reichtum bezeichnen. „Handelsgewinn“ bildet den wirtschaftlichen Sinn ab, ohne moderne Warenbilder aufzudrängen.
- source_word: סְבָאִים
  choice: Sebäer
  rationale: Der Volksname wird in einer etablierten deutschen Form wiedergegeben und nicht mit einer modernen Bevölkerungsgruppe gleichgesetzt.
- source_word: אַנְשֵׁי מִדָּה
  choice: hochgewachsene Männer
  rationale: Die Wendung bezeichnet Männer von auffälligem Körpermaß; „hochgewachsen“ ist im Deutschen natürlich und wahrt den konkreten körperlichen Bezug.
- source_word: עָלַיִךְ יַעֲבֹרוּ
  choice: werden zu dir übergehen
  rationale: Die feminine Singularform bezeichnet Zion bzw. die angesprochene Gemeinschaft. „Zu dir übergehen“ bewahrt sowohl die Bewegungsrichtung als auch den möglichen Sinn eines Wechsels in ihren Machtbereich.
- source_word: וְלָךְ יִהְיוּ
  choice: dir gehören
  rationale: Die Lamed-Konstruktion drückt Zugehörigkeit oder Unterordnung aus; die knappe Wiedergabe lässt deren genaue politische Ausprägung offen.
- source_word: בַּזִּקִּים
  choice: in Fesseln
  rationale: Das Wort bezeichnet Fesseln oder Ketten; „Fesseln“ ist klar, würdig und bildgetreu.
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: Vor dir werden sie sich niederwerfen
  rationale: Die Wiedergabe beschreibt die körperliche Huldigung, ohne vorschnell göttliche Anbetung der angesprochenen Zion zu behaupten.
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: zu dir flehen
  rationale: Das Verb kann „beten“ oder „flehen, Fürbitte erbitten“ bedeuten. Im ungewöhnlichen Bezug auf die feminine menschliche bzw. städtische Adressatin vermeidet „flehen“ eine falsche Eindeutigkeit; eine Fußnote hält die formellere Alternative fest.
- source_word: אַךְ בָּךְ אֵל
  choice: Nur bei dir ist Gott
  rationale: בָּךְ kann Gottes Gegenwart „in“ oder „bei“ der Angesprochenen ausdrücken. „Bei dir“ ist idiomatisch und lässt erkennen, dass das Bekenntnis Gottes Gegenwart bei Zion gilt, nicht Zions Göttlichkeit.
- source_word: וְאֵין עוֹד אֶפֶס אֱלֹהִים
  choice: und sonst gibt es keinen; es gibt keinen anderen Gott
  rationale: Die doppelte Verneinung wird als nachdrückliches Bekenntnis zur Einzigkeit Gottes wiedergegeben, ohne die Wiederholung einzuebnen.
theological_decisions:
- issue: Bezeichnet das Niederwerfen Anbetung Zions oder eine Huldigung vor Zion?
  choice: „Vor dir werden sie sich niederwerfen“
  alternative: „Sie werden dich anbeten“
  rationale: Die Adressatin ist feminin singular, wahrscheinlich Zion. Das hebräische Verb umfasst Niederwerfen und Anbetung; die körperlich beschreibende Übersetzung erhält die Spannung und vermeidet die Behauptung, Zion werde als Gott verehrt.
- issue: Ist יִתְפַּלָּלוּ als Gebet an Zion oder als inständiges Flehen zu verstehen?
  choice: „zu dir flehen“ mit Fußnote zur Alternative „zu dir beten“
  alternative: „zu dir beten“
  rationale: Die Grammatik richtet die Handlung unmittelbar an die feminine Adressatin, während der folgende Wortlaut Gottes Gegenwart und Einzigkeit bekennt. „Flehen“ wahrt den möglichen nichtkultischen Sinn; die Fußnote erhält die auffällige Gebetslesart.
- issue: Wie ist בָּךְ in der Aussage über Gottes Gegenwart wiederzugeben?
  choice: „bei dir ist Gott“
  alternative: „in dir ist Gott“
  rationale: Beide räumlichen Nuancen sind möglich. „Bei dir“ klingt im Deutschen natürlich und vermeidet eine unnötig ontologische Deutung, ohne die besondere Gegenwart Gottes bei Zion abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit gut hörbarem prophetischem Rhythmus. Die feminine Singularanrede wird durch „dir“ bewahrt, ohne die in diesem Einzelvers nicht ausdrücklich genannte Adressatin einzusetzen. Orts- und Volksnamen folgen den im Deutschen üblichen Formen „Kusch“ und „Sebäer“.
