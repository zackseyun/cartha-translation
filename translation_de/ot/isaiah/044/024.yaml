base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: de
  text: 'So spricht Jahwe, dein Erlöser, der dich vom Mutterleib an geformt hat: Ich bin Jahwe, der alles macht, der ganz allein den Himmel ausspannt und die Erde ohne Hilfe ausbreitet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzten hebräischen Wörter sind schwierig. Bei einer anderen Gliederung lassen sie sich als Frage verstehen: „Wer war bei mir?“ In beiden Fällen wird betont, dass Jahwe ohne Helfer geschaffen hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: גֹּאֲלֶךָ
  choice: dein Erlöser
  rationale: „Erlöser“ gibt die rettende und lösende Funktion von גאל wieder, ohne die verwandtschaftliche Bedeutungskomponente hier unnötig ausdrücklich zu machen.
- source_word: וְיֹצֶרְךָ מִבָּטֶן
  choice: der dich vom Mutterleib an geformt hat
  rationale: יצר bezeichnet ein gestaltendes Formen; „vom Mutterleib an“ bewahrt das vorgeburtliche Bild und klingt im heutigen Deutsch natürlich.
- source_word: עֹשֶׂה כֹּל
  choice: der alles macht
  rationale: Die umfassende schöpferische Tätigkeit wird schlicht und nah an der partizipialen Form ausgedrückt.
- source_word: נֹטֶה שָׁמַיִם
  choice: der den Himmel ausspannt
  rationale: „Ausspannen“ bewahrt das konkrete Schöpfungsbild von נטה; der hebräische Plural שָׁמַיִם wird gemäß normalem deutschen Sprachgebrauch mit dem Kollektivsingular „Himmel“ wiedergegeben.
- source_word: לְבַדִּי
  choice: ganz allein
  rationale: Die Form betont Jahwes ausschließliche Urheberschaft; „ganz allein“ bringt diesen Nachdruck idiomatisch zum Ausdruck.
- source_word: רֹקַע הָאָרֶץ
  choice: die Erde ausbreitet
  rationale: רקע bezeichnet das Breiten oder Ausschlagen einer Fläche. „Ausbreiten“ erhält das räumliche Bild, ohne im Deutschen unpassend stark an Metallbearbeitung denken zu lassen.
- source_word: מֵאִתִּי / מִי אִתִּי
  choice: aus eigener Kraft
  rationale: Die schwierigen Schlusswörter werden im Haupttext im Sinn selbstständiger, ununterstützter Schöpfertätigkeit wiedergegeben. Die mögliche alternative Gliederung als Frage wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration erhält den persönlichen Bundesnamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Alleinige Urheberschaft Gottes und die schwierigen Schlusswörter
  choice: „aus eigener Kraft“ im Haupttext
  alternative: „Wer war bei mir?“
  rationale: Der masoretisch überlieferte Schluss lässt unterschiedliche Deutungen beziehungsweise Lesungen zu. Beide heben im Zusammenhang hervor, dass Jahwe ohne Mitwirkenden schuf; die Hauptfassung gibt diesen Sinn natürlich wieder, während die Fußnote die echte textliche und syntaktische Spannung offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Selbstbezeichnung „Ich bin Jahwe“ und die anschaulichen Schöpfungsverben bleiben erhalten; unnötige Fachsprache und konfessionelle Sonderformulierungen werden vermieden.
