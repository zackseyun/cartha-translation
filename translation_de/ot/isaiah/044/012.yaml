base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: de
  text: Der Eisenschmied arbeitet mit einem Schneidwerkzeug[a] und mit Holzkohle. Mit Hämmern formt er es und bearbeitet es mit seinem kräftigen Arm. Auch er wird hungrig und hat keine Kraft; er hat kein Wasser getrunken und ermattet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Dechsel“, „mit einem Gravierwerkzeug“ oder „mit einem Meißel“. Welches Werkzeug genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: der Eisenschmied
  rationale: Die Wortverbindung bezeichnet am ehesten einen Handwerker, der Eisen bearbeitet. „Eisenschmied“ ist im Deutschen konkret und passt zum Werkstattbild.
- source_word: מַעֲצָד
  choice: ein Schneidwerkzeug
  rationale: Die genaue Art des Werkzeugs ist unsicher. Der allgemeinere Ausdruck wahrt die handwerkliche Funktion, ohne eine nicht gesicherte Identifikation festzulegen.
- source_word: וּפָעַל ... וַיִּפְעָלֵהוּ
  choice: arbeitet ... bearbeitet es
  rationale: Die verwandten deutschen Verben geben die Wiederholung der hebräischen Wurzel פעל wieder und lassen zugleich den Satz natürlich klingen.
- source_word: בַּפֶּחָם
  choice: über den Kohlen
  rationale: פֶּחָם bezeichnet Kohle beziehungsweise Holzkohle im Schmiedeprozess. Die Formulierung zeichnet die Arbeit an der Glut anschaulich nach.
- source_word: וּבַמַּקָּבוֹת
  choice: mit Hämmern
  rationale: Der Plural des hebräischen Wortes wird ausdrücklich beibehalten.
- source_word: יִצְּרֵהוּ
  choice: formt er es
  rationale: יצר bezeichnet das Formen oder Gestalten und passt zur Bearbeitung des Werkstücks.
- source_word: בִּזְרֹעַ כֹּחוֹ
  choice: mit seinem kräftigen Arm
  rationale: Dies gibt die wörtlichere Wendung „mit dem Arm seiner Kraft“ in natürlichem Deutsch wieder und erhält den Akzent auf körperlicher Anstrengung.
- source_word: גַּם רָעֵב
  choice: Auch wird er hungrig
  rationale: Die Formulierung bewahrt das hervorhebende גַּם und stellt die fortschreitende körperliche Erschöpfung dar.
- source_word: וְאֵין כֹּחַ
  choice: und hat keine Kraft mehr
  rationale: Die idiomatische deutsche Formulierung gibt das Fehlen von Kraft wieder; „mehr“ verdeutlicht im Zusammenhang den eingetretenen Kräfteverlust.
- source_word: לֹא שָׁתָה מַיִם
  choice: er hat kein Wasser getrunken
  rationale: 'Das Perfekt wird als gegenwärtig wirksamer Zustand verstanden: Der ausbleibende Trunk führt zur folgenden Mattigkeit.'
- source_word: וַיִּיעָף
  choice: und wird matt
  rationale: „Matt werden“ erfasst den Abschluss der beschriebenen körperlichen Entkräftung in gegenwärtigem, gut lesbarem Deutsch.
theological_decisions:
- issue: Prophetische Verspottung der Götzenherstellung
  choice: Der Vers wird als konkrete Schilderung der mühevollen und entkräftenden Arbeit des Schmieds wiedergegeben.
  alternative: Die Vergeblichkeit des Götzendienstes bereits in diesem Vers ausdrücklich wertend zu benennen.
  rationale: Die ironische theologische Wirkung entsteht im Zusammenhang daraus, dass ein schwacher Mensch den vermeintlichen Gott herstellt. Zusätzliche Deutungssprache im Haupttext würde über den Wortlaut des Verses hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkreter Werkstattsprache. Die Wiederholung von „arbeitet/bearbeitet“ spiegelt die hebräische Wortwiederholung. Der Fußnotenmarker steht unmittelbar bei dem lexikalisch unsicheren Werkzeugbegriff.
