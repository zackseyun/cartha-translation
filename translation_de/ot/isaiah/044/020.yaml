source:
  edition: WLC
  text: רֹעֶ֣ה אֵ֔פֶר לֵ֥ב הוּתַ֖ל הִטָּ֑/הוּ וְ/לֹֽא יַצִּ֤יל אֶת נַפְשׁ/וֹ֙ וְ/לֹ֣א יֹאמַ֔ר הֲ/ל֥וֹא שֶׁ֖קֶר בִּ/ימִינִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: de
  text: 'Er nährt sich von Asche[a]. Ein getäuschtes Herz hat ihn irregeführt; er kann sich nicht retten und sagt nicht[b]: »Ist nicht eine Lüge in meiner rechten Hand?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Er weidet sich an Asche.« Das Hebräische verwendet anschaulich das Bild des Weidens oder Sich-Nährens.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und rettet seine נֶפֶשׁ nicht und sagt nicht«. נֶפֶשׁ kann je nach Zusammenhang die eigene Person, das Leben oder die Seele bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה אֵפֶר
  choice: Er nährt sich von Asche
  rationale: Das Partizip von רעה hält das Bild des Weidens beziehungsweise Sich-Nährens lebendig. »Sich von Asche nähren« klingt im Deutschen natürlich genug und bewahrt zugleich die drastische Metapher.
- source_word: לֵב הוּתַל
  choice: ein getäuschtes Herz
  rationale: לֵב umfasst Denken, Wollen und inneres Urteilsvermögen; »Herz« wahrt diese hebräische Ausdrucksweise. Das Passiv »getäuscht« gibt den Zustand der Verblendung wieder, ohne dessen Ursache näher festzulegen.
- source_word: הִטָּהוּ
  choice: hat ihn irregeführt
  rationale: Die Kausativform von נטה bezeichnet hier das Abbringen vom richtigen Weg. »Irregeführt« gibt diese moralisch-religiöse Orientierungslosigkeit knapp wieder.
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: er kann sich nicht retten
  rationale: נפש bezeichnet hier die eigene Person beziehungsweise das eigene Leben. Die deutsche reflexive Wendung ist idiomatisch und vermeidet eine unnötige Verengung auf die immaterielle Seele.
- source_word: וְלֹא יֹאמַר
  choice: und sagt nicht
  rationale: Die koordinierte Negation wird formal bewahrt. Im Zusammenhang beschreibt sie, dass der Betroffene nicht zur entscheidenden Selbsterkenntnis gelangt.
- source_word: הֲלוֹא שֶׁקֶר בִּימִינִי
  choice: Ist nicht eine Lüge in meiner rechten Hand?
  rationale: Die rhetorische Frage bleibt erhalten. »Lüge« gibt שׁקר prägnant wieder, und »in meiner rechten Hand« bewahrt das konkrete Bild des gehaltenen Götzen.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: Im Haupttext mit »sich« wiedergegeben
  alternative: »seine Seele« oder »sein Leben«
  rationale: Der Vers spricht von der Unfähigkeit des Götzendieners, die eigene Person aus Täuschung und Verderben zu retten. Die reflexive Wiedergabe entspricht dem hebräischen Idiom, ohne eine besondere Lehre über die Zusammensetzung des Menschen vorauszusetzen.
- issue: Ursache und Verantwortung der Täuschung
  choice: Die passive Form »getäuschtes Herz« und das irreleitende Herz werden ohne zusätzliche Erklärung beibehalten
  alternative: »verblendetes Herz« oder eine ausdrückliche Benennung dessen, der täuscht
  rationale: 'Der hebräische Text lässt die Spannung bestehen: Das Herz ist getäuscht und führt zugleich den Menschen irre. Die Übersetzung benennt keine vom Text nicht ausdrücklich genannte äußere Ursache.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Metapher bleibt bewusst sichtbar; Satzbau und Wortwahl sind dennoch für heutige Leser unmittelbar verständlich.
