base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: de
  text: Fürchte dich nicht und sei nicht bestürzt.[a] Habe ich dich nicht seit Langem hören lassen und es dir verkündet?[b] Ihr seid meine Zeugen. Gibt es einen Gott außer mir? Es gibt keinen Fels;[c] ich kenne keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürchte dich nicht und erschrick nicht.“ Das zweite Verb ist selten und verstärkt wahrscheinlich das erste Verbot.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder näher am Hebräischen: „Habe ich dich nicht von alters her hören lassen und es dir verkündet?“ Der hebräische Text verwendet hier den Singular, während der folgende Satz zum Plural wechselt.'
    reason: lexical_alternative
  - marker: c
    text: „Fels“ ist hier eine Bezeichnung für Gott und hebt seine Beständigkeit und Verlässlichkeit hervor.
    reason: metaphor_clarification
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: Fürchtet euch nicht
  rationale: פחד bezeichnet Furcht oder Schrecken. Die reflexive deutsche Wendung ist natürlich und bewahrt die direkte Form des Verbots.
- source_word: תִּרְהוּ
  choice: erschreckt nicht
  rationale: Das seltene Verb steht parallel zu פחד und verstärkt wahrscheinlich das Verbot. „Erschreckt nicht“ wahrt diese Steigerung, ohne die unsichere Bedeutung zu eng festzulegen.
- source_word: מֵאָז
  choice: schon vor langer Zeit
  rationale: Die Zeitangabe verweist auf eine frühere Kundgabe. Diese Formulierung ist im modernen Deutsch klar; die näher am Hebräischen liegende Alternative wird in einer Fußnote genannt.
- source_word: הִשְׁמַעְתִּיךָ
  choice: es euch … hören lassen
  rationale: Der Hifil von שמע hat kausative Bedeutung. „Hören lassen“ bildet diese transparenter ab als das glattere „kundgetan“; der singularische Suffix bezieht sich kollektiv auf das angesprochene Volk und wird im Deutschen idiomatisch pluralisch wiedergegeben.
- source_word: וְהִגַּדְתִּי
  choice: und verkündet
  rationale: נגד bedeutet bekannt machen oder verkünden. „Verkündet“ erhält den feierlichen, öffentlichen Ton und ergänzt „hören lassen“ natürlich.
- source_word: עֵדָי
  choice: meine Zeugen
  rationale: Das hebräische Substantiv ist Plural und trägt ein Suffix der ersten Person Singular. Die Wiedergabe bewahrt das rechtlich-zeugenschaftliche Motiv.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die rhetorische Frage zielt im Kontext auf die Einzigkeit des wahren Gottes. „Gott“ ist die natürliche deutsche Wiedergabe, ohne die Aussage über den Text hinaus auszuweiten.
- source_word: מִבַּלְעָדַי
  choice: außer mir
  rationale: Die Präposition drückt Ausschluss aus. „Außer mir“ ist knapp, idiomatisch und erhält den absoluten Anspruch.
- source_word: צוּר
  choice: Fels
  rationale: צוּר ist hier eine Gottesmetapher beziehungsweise ein Titel und betont Beständigkeit und Verlässlichkeit. „Fels“ bewahrt das konkrete Bild.
- source_word: בַּל יָדָעְתִּי
  choice: ich kenne keinen
  rationale: Die betonte Verneinung wird im Deutschen idiomatisch und vollständig wiedergegeben. Der maskuline Bezug nimmt „Fels“ auf.
theological_decisions:
- issue: Göttliche Einzigkeit in der rhetorischen Frage
  choice: „Gibt es einen Gott außer mir? Es gibt keinen Fels; ich kenne keinen.“
  alternative: „Gibt es außer mir einen Gott?“ beziehungsweise Kleinschreibung von „gott“ als Gattungsbezeichnung.
  rationale: Der Zusammenhang ist eine Polemik gegen Götzen und behauptet Gottes Einzigkeit. Die Großschreibung entspricht der deutschen Orthografie und lässt die rhetorische Aussage in ihrer absoluten Schärfe stehen.
- issue: צוּר als Gottesbezeichnung
  choice: „Fels“ großgeschrieben
  alternative: „Fels“ als bloßes Bildwort ohne titularen Hinweis beziehungsweise eine abstrahierende Wiedergabe wie „Zuflucht“.
  rationale: Das konkrete hebräische Bild soll erhalten bleiben. Die Großschreibung ist im Deutschen ohnehin substantivisch erforderlich; eine Fußnote erläutert die Funktion als Gottesbezeichnung, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die seltene Bedeutung von תִּרְהוּ und die zeitliche Nuance von מֵאָז werden nicht dogmatisch festgelegt, sondern durch Fußnoten offengehalten. Die kollektive Anrede wird im Deutschen konsequent im Plural formuliert.
