base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: de
  text: Er fällt sich Zedern, nimmt eine Zypresse[a] oder eine Eiche und lässt sie für sich unter den Bäumen des Waldes stark werden.[b] Er pflanzt eine Kiefer[c], und der Regen lässt sie wachsen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תִּרְזָה bezeichnet eine nicht sicher bestimmbare Baumart; möglich sind unter anderem Zypresse, Steineiche, Terebinthe oder Ulme.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sucht sich unter den Bäumen des Waldes einen kräftigen aus“. Der hebräische Satz ist schwierig und kann entweder das Kräftigen beziehungsweise Heranwachsen des Baumes oder die Auswahl eines kräftigen Baumes beschreiben.'
    reason: alternative_reading
  - marker: c
    text: Das hebräische Wort אֹרֶ bezeichnet eine nicht sicher bestimmbare Baumart; möglich sind unter anderem Kiefer, Tanne, Esche oder Lorbeer.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִים
  choice: Er fällt sich Zedern
  rationale: Der Infinitiv mit ל setzt die Schilderung der Tätigkeit des Handwerkers aus dem Zusammenhang fort. Als selbstständiger deutscher Vers ist eine finite Form natürlich; לֹו bezeichnet den Nutzen für ihn selbst.
- source_word: תִּרְזָה
  choice: eine Zypresse
  rationale: Die genaue Baumart ist unsicher. „Zypresse“ ist eine plausible, geläufige Wiedergabe; die botanische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְאַלּוֹן
  choice: oder eine Eiche
  rationale: אַלּוֹן bezeichnet eine Eiche. Das deutsche „oder“ gibt die Aufzählung möglicher Holzarten im Zusammenhang idiomatisch wieder, auch wenn die hebräische Konjunktion formal „und“ lautet.
- source_word: וַיְאַמֶּץ ל֖וֹ בַּעֲצֵי יָעַר
  choice: und lässt sie für sich unter den Bäumen des Waldes stark werden
  rationale: אמץ bedeutet grundsätzlich „stark machen/stärken“. Die Wiedergabe bewahrt diesen Wortsinn und den Bezug des Dativpronomens, ohne die schwierige, verdichtete Konstruktion als bloßes Auswählen festzulegen.
- source_word: אֹרֶ
  choice: eine Kiefer
  rationale: Die genaue Baumart ist nicht sicher bestimmbar. „Kiefer“ ist im Zusammenhang plausibel; weitere Möglichkeiten werden in der Fußnote genannt.
- source_word: וְגֶשֶׁם יְגַדֵּל
  choice: und der Regen lässt sie wachsen
  rationale: Die Hifilform von גדל drückt hier aus, dass der Regen den Baum groß werden beziehungsweise wachsen lässt. Die Formulierung ist im Deutschen natürlich und erhält den kausativen Sinn.
theological_decisions:
- issue: Die schwierige Beschreibung von Auswahl, Pflege oder Kräftigung des Baumes im Zusammenhang der Götzenpolemik
  choice: Die Klausel wird als Starkwerdenlassen des Baumes unter den Waldbäumen wiedergegeben.
  alternative: „und sucht sich unter den Bäumen des Waldes einen kräftigen aus“ beziehungsweise „und stärkt ihn für sich unter den Bäumen des Waldes“
  rationale: 'Der hebräische Wortlaut ist syntaktisch verdichtet und lässt offen, ob das Kräftigen beziehungsweise Heranwachsen oder die Auswahl eines kräftigen Baumes im Vordergrund steht. Der Haupttext bleibt nahe an der Grundbedeutung von אמץ; die Auswahl-Deutung wird in der Fußnote bewahrt. So wird die im Kontext wirksame Spannung nicht vorschnell aufgelöst: Das Material des Götzen ist gewöhnliches, durch Regen gewachsenes Holz.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Er fällt sich Zedern“ ist knapp und bewahrt den Dativ des persönlichen Nutzens. Die Pronomen beziehen sich auf die jeweils genannte Baumart; sämtliche botanischen und syntaktischen Unsicherheiten sind transparent ausgewiesen.
