  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: de
  text: Jubelt, ihr Himmel, denn Jahwe hat gehandelt[a]! Jauchzt, ihr Tiefen der Erde[b]! Brecht in Jubel aus, ihr Berge, du Wald und jeder Baum darin! Denn Jahwe hat Jakob erlöst, und in Israel verherrlicht er sich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „denn Jahwe hat es getan“ oder „denn Jahwe ist tätig geworden“. Im Hebräischen bleibt unausgesprochen, was er getan hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „unterste Bereiche der Erde“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „in Israel zeigt er seine Herrlichkeit“ oder „in Israel erweist er sich als herrlich“.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: Jubelt
  rationale: Der pluralische Imperativ von רנן bezeichnet einen lauten, freudigen Jubel und kann sowohl Singen als auch jubelndes Rufen einschließen. „Jubelt“ bewahrt diese Bedeutungsbreite in natürlichem Deutsch.
- source_word: כִּי עָשָׂה יְהוָה
  choice: denn Jahwe hat gehandelt
  rationale: עשה steht hier ohne ausdrücklich genanntes Objekt. „Hat gehandelt“ vermeidet es, ein bestimmtes Objekt einzutragen, und gibt die vollzogene Tat Gottes idiomatisch wieder.
- source_word: הָרִיעוּ
  choice: Jauchzt
  rationale: Der Hifil-Imperativ von רוע fordert zu einem lauten Freudenruf auf. „Jauchzt“ passt zum poetischen Parallelismus und zum festlichen Ton.
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: Tiefen der Erde
  rationale: Die Wendung bezeichnet poetisch die unteren oder tiefsten Bereiche der Erde. „Tiefen der Erde“ ist anschaulich, idiomatisch und erhält die kosmische Spannweite.
- source_word: פִּצְחוּ ... רִנָּה
  choice: Brecht in Jubel aus
  rationale: Die Verbindung beschreibt den plötzlichen Ausbruch eines lauten Freudenliedes oder Jubelrufs. Die deutsche Wendung bildet sowohl die Dynamik von פצח als auch den freudigen Klang von רנה ab.
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: du Wald und jeder Baum darin
  rationale: Die direkte Anrede und die Einzelbezeichnung „jeder Baum“ werden nahe am Hebräischen bewahrt.
- source_word: גָאַל
  choice: erlöst
  rationale: גאל bezeichnet das befreiende Zurückgewinnen durch einen Löser und trägt hier heilsgeschichtliches Gewicht. „Erlöst“ ist die passende, etablierte deutsche Wiedergabe.
- source_word: וּבְיִשְׂרָאֵל יִתְפָּאָר
  choice: und an Israel zeigt er seine Herrlichkeit
  rationale: Die Form יִתְפָּאָר bezeichnet, dass Jahwe sich als herrlich erweist beziehungsweise seine Herrlichkeit sichtbar macht. „An Israel“ gibt בְ als den Bereich oder Bezug wieder, an dem dies offenbar wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen und folgt einer im Deutschen geläufigen Umschrift.
- issue: Bedeutung von יִתְפָּאָר im Schlusssatz
  choice: zeigt er seine Herrlichkeit
  alternative: verherrlicht er sich / erweist er sich als herrlich
  rationale: Die reflexiv-mediale Form kann das Sich-Verherrlichen oder Sichtbarwerden der Herrlichkeit ausdrücken. Die Hauptfassung macht deutlich, dass Jahwe das grammatische Subjekt bleibt, ohne Israel zum Handelnden zu machen; die Fußnote bewahrt die engere reflexive Alternative.
translation_notes:
  register: Poetisch-gehobene, aber gegenwärtige Standardsprache. Die wechselnde Anrede „ihr Berge, du Wald“ folgt der hebräischen Personifikation; kurze Ausrufe bilden den dreifachen Aufruf zum kosmischen Jubel ab.
