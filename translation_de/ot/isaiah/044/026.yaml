  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: de
  text: 'der das Wort seines Dieners bestätigt und den Plan seiner Boten[a] ausführt, der von Jerusalem sagt: »Es wird wieder bewohnt werden«, und von den Städten Judas: »Sie werden wieder aufgebaut werden«, und: »Seine Ruinen richte ich wieder auf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seiner Engel«. Das hebräische Wort kann menschliche oder himmlische Boten bezeichnen; hier sind wahrscheinlich prophetische Boten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: bestätigt
  rationale: Das Hifil-Partizip von קום bedeutet mit »Wort« als Objekt, dass Gott es bestehen lässt und wirksam eintreffen lässt. »Bestätigt« gibt diese idiomatische Bedeutung natürlich wieder.
- source_word: דְּבַר עַבְדּוֹ
  choice: das Wort seines Dieners
  rationale: Die singularischen Formen bleiben erhalten; »Wort« wahrt den formalen und prophetischen Bezug von דָּבָר, ohne den Diener näher zu bestimmen.
- source_word: וַעֲצַת מַלְאָכָיו
  choice: und den Plan seiner Boten[a]
  rationale: עֵצָה kann Rat, Plan oder Vorhaben bezeichnen; »Plan« klingt im heutigen Deutsch natürlich und passt zu seiner Ausführung. מַלְאָךְ bleibt durch »Boten« gegenüber menschlichen oder himmlischen Gesandten grundsätzlich offen; die Alternative wird in der Fußnote ausgewiesen.
- source_word: יַשְׁלִים
  choice: ausführt
  rationale: Das Hifil von שלם bezeichnet hier das vollständige Verwirklichen. »Ausführt« verbindet sich idiomatisch mit »Plan« und vermittelt wirksame Vollendung.
- source_word: הָאֹמֵר לִירוּשָׁלִַם
  choice: der von Jerusalem sagt
  rationale: Das substantivierte Partizip führt die Beschreibung Gottes fort. ל wird im Deutschen bei einer Aussage über die Stadt natürlich mit »von« wiedergegeben.
- source_word: תּוּשָׁב
  choice: Es soll wieder bewohnt sein
  rationale: Die feminine Stadtbezeichnung lässt sich im Deutschen wegen des sächlichen Namens »Jerusalem« nicht natürlich mit »sie« aufnehmen. »Wieder« bringt im Wiederherstellungskontext den resultativen Sinn idiomatisch zum Ausdruck.
- source_word: תִּבָּנֶינָה
  choice: Sie sollen wieder aufgebaut werden
  rationale: Der feminine Plural im Nifal wird passiv wiedergegeben. »Wieder aufgebaut« macht die im Zusammenhang vorausgesetzte Wiederherstellung deutlich.
- source_word: וְחָרְבוֹתֶיהָ אֲקוֹמֵם
  choice: Seine Trümmerstätten richte ich wieder auf
  rationale: חָרְבוֹת bezeichnet verwüstete oder in Trümmern liegende Orte. Das feminine Suffix bezieht sich grammatisch naheliegend auf Jerusalem; im Deutschen entspricht dem »seine«. »Richte ... wieder auf« bewahrt das Bild von קום und den Wiederherstellungssinn.
theological_decisions:
- issue: Bezug von »seinem Diener« und »seinen Boten«
  choice: Die Übersetzung belässt den Diener im Singular und die Boten im Plural, ohne sie zu identifizieren.
  alternative: Der Diener könnte insbesondere Jesaja und die Boten könnten eine Gruppe prophetischer Sprecher bezeichnen.
  rationale: Der Vers nennt keine Personen ausdrücklich. Eine nähere Festlegung würde die im Text bestehende Offenheit unnötig auflösen.
- issue: Menschliche oder himmlische מַלְאָכִים
  choice: Im Haupttext steht »Boten«.
  alternative: »Engel«
  rationale: Die Parallele zum prophetischen »Diener« und der Inhalt der Verkündigung sprechen hier eher für menschliche Gottesboten. Da das hebräische Wort auch himmlische Boten bezeichnen kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Satzstruktur des Hebräischen bleibt erhalten. Die Soll-Formen geben die prophetisch wirksame Zusage natürlich wieder; »wieder« verdeutlicht den Wiederherstellungskontext. Das grammatische Geschlecht wird idiomatisch an das Deutsche angepasst.
