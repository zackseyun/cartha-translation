  text: הָ/אֹמֵ֥ר לַ/צּוּלָ֖ה חֳרָ֑בִי וְ/נַהֲרֹתַ֖יִ/ךְ אוֹבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
translation:
  language: de
  text: 'der zur Tiefe[a] sagt: »Trockne aus! Deine Ströme werde ich austrocknen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Tiefen«. Das hebräische Wort bezeichnet die wässrige Tiefe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: der … sagt
  rationale: Das substantivierte Partizip setzt die Beschreibung aus dem vorangehenden Zusammenhang als Relativsatz fort. Das Präsens bewahrt den partizipialen Charakter.
- source_word: לַצּוּלָה
  choice: zur Meerestiefe
  rationale: צּוּלָה bezeichnet eine große Wassertiefe. „Meerestiefe“ gibt den wässrigen Bezug im modernen Deutsch knapp und eindeutig wieder.
- source_word: חֳרָבִי
  choice: Trockne aus!
  rationale: Der feminine Singular des Imperativs richtet sich an die ebenfalls feminine Meerestiefe. „Trockne aus!“ ist im Deutschen natürlicher als „Sei trocken“ und bewahrt den Befehlscharakter.
- source_word: וְנַהֲרֹתַיִךְ
  choice: Deine Ströme
  rationale: נְהָרוֹת kann Flüsse oder Ströme bezeichnen; „Ströme“ passt zur poetischen Wasserbildsprache. Das Possessivpronomen gibt das Suffix der 2. Person feminin Singular wieder.
- source_word: אוֹבִישׁ
  choice: werde ich trockenlegen
  rationale: 'Der Hifil-Imperfekt der Wurzel יבש ist kausativ: Der Sprecher wird die Wasserläufe trocken machen. „Trockenlegen“ gibt dies idiomatisch wieder.'
theological_decisions:
- issue: Identität des Sprechers und syntaktischer Anschluss an den Kontext
  choice: Den Vers als abhängigen Relativsatz „der … sagt“ wiedergeben, ohne „der HERR“ zu ergänzen.
  alternative: Das Subjekt aus dem vorherigen Zusammenhang ausdrücklich als „der HERR“ einsetzen.
  rationale: Im Hebräischen setzt der Vers die vorausgehende Beschreibung Gottes fort. Eine ausdrückliche Ergänzung des Gottesnamens würde dem Einzelvers Wörter hinzufügen, die hier nicht stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Ton. Die Satzabhängigkeit vom vorherigen Vers bleibt erhalten; die direkte Rede ist klar gegliedert.
