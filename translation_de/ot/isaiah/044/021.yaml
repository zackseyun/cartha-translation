  text: זְכָר אֵ֣לֶּה יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל כִּ֣י עַבְדִּ/י אָ֑תָּה יְצַרְתִּ֤י/ךָ עֶֽבֶד לִ/י֙ אַ֔תָּה יִשְׂרָאֵ֖ל לֹ֥א תִנָּשֵֽׁ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: de
  text: Denk an diese Dinge, Jakob und Israel, denn du bist mein Diener. Ich habe dich geformt; du bist mein Diener. Israel, ich werde dich nicht vergessen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israel, du sollst mich nicht vergessen.“ Die hebräische Form kann auch so verstanden werden; dann ist die Aussage eine Mahnung statt der Zusicherung: „Ich werde dich nicht vergessen.“'
    reason: Alternative syntaktische Deutung von לֹא תִנָּשֵׁנִי.
lexical_decisions:
- source_word: זְכָר אֵלֶּה
  choice: Denk daran
  rationale: Der Qal-Imperativ fordert unmittelbar zum Erinnern auf. Das pluralische Demonstrativum verweist auf das zuvor Gesagte; im modernen Deutschen gibt „daran“ diesen Rückbezug natürlich wieder.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Jakob, und du, Israel
  rationale: Beide Namen dienen der direkten Anrede desselben Volkes. Das ergänzte „du“ macht den erneuten Vokativ im Deutschen hörbar.
- source_word: כִּי עַבְדִּי אָתָּה
  choice: denn du bist mein Diener
  rationale: כִּי begründet die Aufforderung; עֶבֶד bezeichnet hier Israels Dienstverhältnis zu Gott, wofür „Diener“ im Kontext angemessen ist.
- source_word: יְצַרְתִּיךָ
  choice: Ich habe dich geformt
  rationale: יצר bezeichnet das Formen oder Gestalten und bewahrt hier die Schöpfer- beziehungsweise Handwerkerbildlichkeit.
- source_word: עֶבֶד לִי אַתָּה
  choice: du bist mein Diener
  rationale: Die selbstständige Nominalklausel wird als eigene Aussage erhalten. Idiomatisches Deutsch gibt לִי hier am besten als Zugehörigkeit wieder.
- source_word: לֹא תִנָּשֵׁנִי
  choice: ich werde dich nicht vergessen
  rationale: 'Die masoretisch vokalisierte Form wird kontextuell als passive Zusicherung verstanden: Israel wird von Gott nicht vergessen. Im Deutschen ist die aktive Umformung natürlicher und eindeutig.'
theological_decisions:
- issue: Subjekt-Objekt-Verhältnis in לֹא תִנָּשֵׁנִי
  choice: 'Göttliche Zusicherung: „ich werde dich nicht vergessen“'
  alternative: 'An Israel gerichtete Mahnung beziehungsweise Aussage: „Du sollst/wirst mich nicht vergessen“'
  rationale: Die Zusicherung passt zum Zusammenhang von Gottes Erwählung und Gestaltung Israels. Da die hebräische Form auch anders verstanden werden kann, bleibt die alternative Deutung in einer Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bewahren die feierliche direkte Anrede und die hebräische Klauselstruktur; „Diener“ vermeidet eine unnötige Verengung auf rechtlichen Sklavenstatus.
