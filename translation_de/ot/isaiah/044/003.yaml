  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: de
  text: Denn ich werde Wasser auf durstiges Land[a] gießen und fließendes Wasser[b] auf trockenen Boden; ich werde meinen Geist[c] auf deine Nachkommen ausgießen und meinen Segen auf deine Nachfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Durstigen«. Das hebräische Adjektiv kann substantivisch gebraucht sein; die Parallele zu »trockenem Boden« spricht jedoch für durstiges Land.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Ströme«. Das hebräische Wort bedeutet wörtlich »Fließendes«.'
    reason: lexical_alternative
  - marker: c
    text: »Meinen Geist« kann auch mit »meinen Atem« oder »meinen Wind« wiedergegeben werden. Im Zusammenhang der göttlichen Segensverheißung für kommende Generationen liegt hier jedoch »Geist« näher.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Verheißung ein und bewahrt den Zusammenhang natürlich.
- source_word: אֶצָּק / אֶצֹּק (יצק)
  choice: ich gieße
  rationale: Gibt das Ausgießen einer Flüssigkeit unmittelbar wieder und lässt sich sowohl mit Wasser als auch bildlich mit Gottes Geist natürlich verbinden.
- source_word: מַיִם
  choice: Wasser
  rationale: Entspricht der grundlegenden Bedeutung und bewahrt das konkrete Bild.
- source_word: צָמֵא
  choice: durstiges Land
  rationale: Wörtlich steht ein Adjektiv, »durstig«. Wegen der Parallele zu trockenem Boden wird das implizite Land ergänzt; die mögliche personale Lesart bleibt in einer Fußnote erhalten.
- source_word: וְנֹזְלִים
  choice: und Bäche
  rationale: Das substantivierte Partizip bezeichnet wörtlich Fließendes. »Bäche« bewahrt das Bild fließenden Wassers in knappem, natürlichem Deutsch.
- source_word: יַבָּשָׁה
  choice: trockenen Boden
  rationale: Bezeichnet trockenes Land beziehungsweise Erdreich und bildet eine klare poetische Parallele zu durstigem Land.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Kontext göttlicher Segensgabe an die Nachkommenschaft ist »Geist« die naheliegende Bedeutung; die Mehrdeutigkeit wird angemerkt.
- source_word: זַרְעֶךָ
  choice: deine Nachkommen
  rationale: Das wörtliche »dein Same« bezeichnet kollektiv die Nachkommenschaft; »Nachkommen« ist im heutigen Deutsch verständlich und würdig.
- source_word: וּבִרְכָתִי
  choice: und meinen Segen
  rationale: Bewahrt die übliche und umfassende Bedeutung des Nomens, ohne die Art des Segens einzuengen.
- source_word: צֶאֱצָאֶיךָ
  choice: deine Nachfahren
  rationale: Bezeichnet die aus jemandem Hervorgegangenen. Die Wiedergabe variiert gegenüber »Nachkommen« und erhält zugleich den synonymen Parallelismus.
theological_decisions:
- issue: Bedeutung von רוּחִי in der Verheißung
  choice: meinen Geist
  alternative: meinen Atem / meinen Wind
  rationale: Die Wasserbilder gehen in die ausdrückliche Gabe von Gottes Geist und Segen an kommende Generationen über. »Geist« bewahrt diese theologische Aussage, während die lexikalischen Alternativen in der Fußnote offengehalten werden.
- issue: Bezug von צָמֵא
  choice: durstiges Land
  alternative: der Durstige
  rationale: Der unmittelbare Parallelismus mit »trockenem Boden« legt eine Landschaft als Bezug nahe. Weil das Hebräische das Adjektiv auch substantivisch verwenden kann, wird die personale Alternative nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erhaltenem poetischem Parallelismus. Das wiederholte »ich gieße« spiegelt die hebräische Wiederholung. Auf eine Fußnote [b] wurde verzichtet, da »Bäche« die lexikalische Bildhaftigkeit hinreichend wiedergibt und keine für die Veröffentlichung nötige Mehrdeutigkeit verloren geht.
