  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: de
  text: Der Holzhandwerker spannt die Messschnur; mit einem Griffel[a] zeichnet er es vor, mit Hobeln bearbeitet er es, und mit dem Zirkel zeichnet er es nach. Er fertigt es nach dem Vorbild eines Mannes an, nach der Schönheit eines Menschen, um in einem Haus zu wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit einem Markierwerkzeug; möglicherweise ist roter Zeichenstoff gemeint. Der hebräische Ausdruck bezeichnet ein Werkzeug oder Mittel zum Vorzeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: Holzhandwerker
  rationale: Die Konstruktverbindung bezeichnet einen Handwerker, der Holz bearbeitet. „Holzhandwerker“ hält den Werkstoff ausdrücklich fest und ist weniger eng als „Zimmermann“.
- source_word: נָטָה קָו
  choice: spannt die Messschnur
  rationale: Die Wendung beschreibt das Auslegen beziehungsweise Spannen einer Schnur zum Vermessen; „Messschnur“ macht ihre Funktion natürlich verständlich.
- source_word: יְתָאֲרֵהוּ
  choice: zeichnet die Gestalt … vor
  rationale: Das Verb bezeichnet hier das Umreißen oder Vorzeichnen. Die Ergänzung „die Gestalt“ gibt das pronominale Objekt im Deutschen verständlich wieder, ohne die Tätigkeit als freie Kunstzeichnung zu deuten.
- source_word: בַשֶּׂרֶד
  choice: mit einem Griffel
  rationale: Der seltene Ausdruck bezeichnet wohl ein Werkzeug zum Einritzen oder Markieren. „Griffel“ wahrt diese Grundvorstellung; die genaue Bestimmung bleibt in der Fußnote offen.
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: bearbeitet sie mit Hobeln
  rationale: Der Plural bezeichnet vermutlich Werkzeuge zur Holzbearbeitung, häufig als Hobel verstanden. Wegen der lexikalischen Unsicherheit werden andere mögliche Werkzeuge in einer Fußnote genannt.
- source_word: וּבַמְּחוּגָה
  choice: mit dem Zirkel
  rationale: Das Substantiv bezeichnet ein Gerät zum Zeichnen von Kreisen oder Bögen; „Zirkel“ ist die natürliche deutsche Entsprechung.
- source_word: כְּתַבְנִית אִישׁ
  choice: nach der Gestalt eines Mannes
  rationale: תַּבְנִית bedeutet Form, Gestalt oder Modell; אִישׁ ist hier der konkrete männliche Mensch. Die Wiedergabe erhält diese Aussage, statt sie zu verallgemeinern.
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: nach der Schönheit eines Menschen
  rationale: תִּפְאֶרֶת kann Schönheit, Pracht oder Herrlichkeit bezeichnen; im Zusammenhang der ansprechenden Menschengestalt passt „Schönheit“. אָדָם ist hier generisch menschlich.
- source_word: לָשֶׁבֶת בָּיִת
  choice: damit sie in einem Haus wohnt
  rationale: יָשַׁב kann sitzen, wohnen oder bleiben bedeuten. „Wohnt“ bewahrt die ironische Personifizierung des menschengemachten Bildes; „Haus“ wird nicht ohne Textgrundlage auf „Tempel“ oder „Schrein“ verengt.
theological_decisions:
- issue: Das Verhältnis von אִישׁ und אָדָם
  choice: „eines Mannes … eines Menschen“
  alternative: „eines Menschen … menschlicher Schönheit“
  rationale: 'Der Wechsel der beiden hebräischen Bezeichnungen wird sichtbar gehalten: אִישׁ wird konkret mit „Mann“, אָדָם generisch mit „Mensch“ wiedergegeben. So bleibt sowohl die männliche Gestalt als auch der umfassendere Mensch-Gott-Kontrast erhalten.'
- issue: Personifizierung in לָשֶׁבֶת בָּיִת
  choice: „damit sie in einem Haus wohnt“
  alternative: „damit sie in einem Haus steht“ oder „sitzt“
  rationale: „Wohnt“ entspricht einem üblichen Sinn von יָשַׁב und erhält die prophetische Ironie, ohne ausdrücklich zu erklären, dass es sich um ein Götzenbild handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Werkstattsprache. Das feminine Pronomen „sie“ bezieht sich auf die vorgezeichnete und ausgearbeitete Gestalt. Die Übersetzung wahrt die wiederholte Tätigkeit des Vorzeichnens sowie die ironische Rede vom Wohnen des gefertigten Bildes.
