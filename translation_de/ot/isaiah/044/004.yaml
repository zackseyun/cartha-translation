  text: וְ/צָמְח֖וּ בְּ/בֵ֣ין חָצִ֑יר כַּ/עֲרָבִ֖ים עַל יִבְלֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/004.yaml
  text: And they will spring up among the grass like willows by streams of water[a].
translation:
  language: de
  text: Und sie werden mitten im Gras aufsprießen, wie Weiden an Wasserläufen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Pappeln an Wasserläufen“. Das hebräische עֲרָבִים wird meist mit „Weiden“ wiedergegeben; möglicherweise bezeichnet es allgemeiner pappelartige Bäume, die am Wasser wachsen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  choice: Und sie werden … aufsprießen
  rationale: Das Qal von צמח bezeichnet das Sprießen oder Hervorwachsen, besonders bei Pflanzen. „Aufsprießen“ bewahrt das lebendige Wachstumsbild und die Zukunftsbedeutung.
- source_word: בְּבֵין
  choice: mitten im
  rationale: Wörtlich bezeichnet die Wendung ein Dazwischen; zusammen mit dem Kollektiv „Gras“ gibt „mitten im“ die räumliche Vorstellung im Deutschen natürlich wieder.
- source_word: חָצִיר
  choice: Gras
  rationale: חָצִיר bezeichnet gewöhnlich Gras oder grüne Vegetation. „Gras“ ist hier klar, schlicht und bildhaft.
- source_word: כַּעֲרָבִים
  choice: wie Weiden
  rationale: עֲרָבִים wird in Verbindung mit Wasser traditionell und wahrscheinlich als „Weiden“ verstanden. Da auch eine weiter gefasste Bestimmung als pappelartige Uferbäume vertreten wird, steht die Alternative in der Fußnote.
- source_word: עַל
  choice: an
  rationale: In diesem Ortsbild bezeichnet עַל die Lage bei oder entlang dem Wasser. „An“ ist im Deutschen idiomatisch und knapp.
- source_word: יִבְלֵי מָיִם
  choice: Wasserläufen
  rationale: Die Konstruktverbindung bezeichnet fließende Wasserkanäle oder Wasserläufe. „Wasserläufe“ erhält den Plural und bleibt gegenüber „Bächen“ hinsichtlich natürlicher oder angelegter Läufe offen.
theological_decisions: []
