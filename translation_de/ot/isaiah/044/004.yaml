  register: Modernes, würdiges Standarddeutsch. Die Pflanzenmetapher und der parallele Aufbau des hebräischen Verses bleiben erhalten; die botanische Unsicherheit wird nicht im Haupttext aufgelöst, sondern in der Fußnote kenntlich gemacht.
