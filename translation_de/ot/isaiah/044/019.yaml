  text: וְ/לֹא יָשִׁ֣יב אֶל לִבּ֗/וֹ וְ/לֹ֨א דַ֥עַת וְ/לֹֽא תְבוּנָה֮ לֵ/אמֹר֒ חֶצְי֞/וֹ שָׂרַ֣פְתִּי בְמוֹ אֵ֗שׁ וְ֠/אַף אָפִ֤יתִי עַל גֶּחָלָי/ו֙ לֶ֔חֶם אֶצְלֶ֥ה בָשָׂ֖ר וְ/אֹכֵ֑ל וְ/יִתְר/וֹ֙ לְ/תוֹעֵבָ֣ה אֶעֱשֶׂ֔ה לְ/ב֥וּל עֵ֖ץ אֶסְגּֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: de
  text: 'Er nimmt es sich nicht zu Herzen, und ihm fehlen Erkenntnis und Einsicht, sodass er sagen könnte: »Die eine Hälfte habe ich im Feuer verbrannt; auf den Kohlen davon habe ich sogar Brot gebacken, Fleisch gebraten und gegessen. Soll ich aus dem Rest einen Gräuel machen? Soll ich mich vor einem Holzklotz[a] niederwerfen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor einem Stück Holz« oder »vor einem Holzscheit«. Die hebräische Wendung ist geringschätzig und betont, dass das Götzenbild nichts weiter als Holz ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: nimmt es sich zu Herzen
  rationale: Die hebräische Wendung bezeichnet ein inneres Bedenken oder Erwägen. Die deutsche Redewendung gibt diesen Sinn natürlich wieder.
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: Erkenntnis und Einsicht
  rationale: 'Die beiden Begriffe werden unterschieden, ohne den engen Bedeutungszusammenhang aufzulösen: דַעַת bezeichnet Erkenntnis beziehungsweise Wissen, תְבוּנָה verstehende Einsicht oder Urteilsvermögen.'
- source_word: חֶצְיוֹ
  choice: die eine Hälfte
  rationale: Der Ausdruck verweist auf die Hälfte des zuvor genannten Holzes und bereitet den Gegensatz zum verbleibenden Rest vor.
- source_word: שָׂרַפְתִּי בְמוֹ אֵשׁ
  choice: habe ich im Feuer verbrannt
  rationale: Die lokale Wiedergabe entspricht der häuslichen Feuer- und Kochszene und klingt im Deutschen natürlich.
- source_word: וְאַף אָפִיתִי
  choice: habe ich sogar … gebacken
  rationale: אַף verstärkt und ergänzt die Aussage. „Sogar“ lässt die ironische Anhäufung der gewöhnlichen Nutzungen des Holzes hervortreten.
- source_word: עַל גֶּחָלָיו
  choice: auf ihren Kohlen
  rationale: Das Suffix bezieht sich am ehesten auf die verbrannte Hälfte beziehungsweise das Holz. Das feminine Pronomen nimmt im Deutschen „die Hälfte“ auf.
- source_word: לֶחֶם
  choice: Brot
  rationale: Der konkrete Sinn wird beibehalten und nicht zum allgemeineren „Essen“ erweitert.
- source_word: אֶצְלֶה בָשָׂר וְאֹכֵל
  choice: Fleisch gebraten und gegessen
  rationale: צלה bezeichnet das Braten oder Rösten über Feuer. Die koordinierte deutsche Perfektform gibt die rückblickende Überlegung flüssig wieder.
- source_word: וְיִתְרוֹ
  choice: aus dem Rest
  rationale: Die Form bezeichnet das Übriggebliebene und steht im deutlichen Gegensatz zur zuvor verbrauchten Hälfte.
- source_word: לְתוֹעֵבָה
  choice: einen Gräuel
  rationale: „Gräuel“ bewahrt die starke religiös-ethische Wertung von תוֹעֵבָה und die Schärfe der prophetischen Kritik.
- source_word: לְבוּל עֵץ
  choice: vor einem Holzklotz
  rationale: Die Formulierung reduziert das Götzenbild spöttisch auf sein bloßes Material. „Holzklotz“ vermittelt diese Geringschätzung im modernen Deutschen.
theological_decisions:
- issue: Prophetische Verspottung des Götzenbildes
  choice: Holzklotz
  alternative: Stück Holz; Holzscheit
  rationale: Der Text kontrastiert die gewöhnliche Verwendung des Holzes als Brennstoff mit der Verehrung seines Restes. Die abwertende Materialbezeichnung bewahrt diese Kritik, ohne dem Hebräischen eine zusätzliche Lehraussage hinzuzufügen.
- issue: Wertung des angefertigten Götzenbildes
  choice: Gräuel
  alternative: etwas Abscheuliches
  rationale: „Gräuel“ erhält die religiösen Obertöne und die starke Wertung des hebräischen תוֹעֵבָה; die Aussage wird nicht zu einer bloß subjektiven Abneigung abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bewahrt die ironische Selbstbefragung; „sich zu Herzen nehmen“, „Gräuel“ und „sich niederwerfen“ sind verständlich, zugleich dem prophetischen Ton angemessen.
