  source_fidelity: 'Die Übersetzung trifft den Gedankengang, die rhetorischen Fragen und die wertende Sprache des Hebräischen im Wesentlichen gut. Allerdings ist „sodass er sich sagt“ sachlich verkehrt: Es stellt die folgende Einsicht als tatsächlich erfolgende Selbstrede dar, während der hebräische Text gerade festhält, dass dem Menschen Erkenntnis und Einsicht fehlen, um dies zu sagen. Die Beziehung der Kohlen zum Holz sollte zudem ohne das deutsche feminine Pronomen „ihren“ ausgedrückt werden.'
  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „Gräuel“, „sich zu Herzen nehmen“ und „sich niederwerfen“ passen zum prophetischen Register. „auf den Kohlen davon“ ist hier etwas weniger elegant als „auf ihren Kohlen“, verhindert aber eine irreführende Bindung an die deutsche „Hälfte“ und gibt den Bezug auf das verbrannte Holz klar wieder.
  terminology: „Erkenntnis und Einsicht“ gibt דַּעַת und תְּבוּנָה angemessen differenziert wieder. „Gräuel“ bewahrt die starke kultisch-prophetische Wertung von תּוֹעֵבָה. „Holzklotz“ kann die abwertende Materialbezeichnung von לְבוּל עֵץ gut vermitteln; die Fußnote benennt vertretbare neutralere Alternativen.
