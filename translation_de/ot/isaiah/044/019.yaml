    rationale: Das hebräische Suffix bezieht sich auf das als Brennmaterial verwendete Holz. „Auf den Kohlen davon“ macht den Bezug idiomatisch hinreichend deutlich, ohne die deutsche feminine Kongruenz als inhaltliche Festlegung wirken zu lassen.
