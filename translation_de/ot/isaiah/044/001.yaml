source:
  edition: WLC
  text: וְ/עַתָּ֥ה שְׁמַ֖ע יַעֲקֹ֣ב עַבְדִּ֑/י וְ/יִשְׂרָאֵ֖ל בָּחַ֥רְתִּי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: de
  text: Doch nun höre, Jakob, mein Diener, und Israel, den ich erwählt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb leitet nach dem vorangehenden Gerichtswort eine kontrastierende, tröstliche Anrede ein. „Doch nun“ gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Imperativ bedeutet „hören“ oder „zuhören“. „Höre“ bewahrt die knappe, feierliche Direktheit der prophetischen Anrede, ohne ein im Hebräischen unausgesprochenes Objekt hinzuzufügen.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: עבד kann einen Diener oder Sklaven bezeichnen; bei der Bundesanrede Israels steht hier die Zugehörigkeit zu Gott und der ihm übertragene Auftrag im Vordergrund. „Diener“ ist daher im Deutschen sachgerecht und kontextgemäß.
- source_word: וְיִשְׂרָאֵל
  choice: und Israel
  rationale: Die Wendung stellt den parallelen Bundesnamen für dieselbe angesprochene Größe koordinierend neben „Jakob“ und bewahrt so den hebräischen Parallelismus.
- source_word: בָּחַרְתִּי בוֹ
  choice: den ich erwählt habe
  rationale: Die Präposition ב gehört hier zur idiomatischen Konstruktion mit בחר; im Deutschen wird sie ohne Präposition als direktes Objekt wiedergegeben. Das Perfekt „habe erwählt“ bezeichnet eine vollzogene Wahl mit fortbestehender Bedeutung.
theological_decisions:
- issue: Bezeichnung Israels als עַבְדִּי
  choice: mein Diener
  alternative: mein Sklave
  rationale: Die Formulierung bezeichnet Jakob beziehungsweise Israel in seiner Bundeszugehörigkeit und Aufgabe vor Gott. „Sklave“ würde den Aspekt der Unfreiheit stärker hervorheben, als es der unmittelbare Zusammenhang nahelegt.
- issue: Aussagekraft der eröffnenden Konjunktion וְ in וְעַתָּה
  choice: Doch nun
  alternative: Und nun
  rationale: Der Zusammenhang wechselt von Tadel und Gericht zu erneuter Zusage. Die adversative Wiedergabe macht diesen rhetorischen Umschwung sichtbar, ohne einen fremden theologischen Gedanken einzuführen.
- issue: Bezug von בָּחַרְתִּי בוֹ
  choice: 'als Relativsatz zu „Israel“: „den ich erwählt habe“'
  alternative: 'parataktisch: „Israel, ich habe ihn erwählt“'
  rationale: Der Relativsatz bildet die hebräische Beziehung im Deutschen idiomatisch ab und lässt Jakob und Israel als parallele Benennungen des erwählten Gottesvolkes stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Direktheit. „Höre“ statt des umgangssprachlicheren „hör zu“ erhält den feierlichen Ton; die Syntax bleibt eng am hebräischen Parallelismus, ohne im Deutschen unnatürlich zu wirken.
