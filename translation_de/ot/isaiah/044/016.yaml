  naturalness: Die bisherige Formulierung „Mit der anderen Hälfte bereitet er Fleisch zum Essen zu“ ist zwar flüssig, aber zu paraphrasierend. „Mit der anderen Hälfte brät er Fleisch, isst davon und wird satt“ ist modernes, verständliches Deutsch und verdeutlicht den im Hebräischen knappen Zusammenhang, ohne eine bloße Zubereitung an die Stelle des Essens zu setzen.
  terminology: „Braten“ kann das hebräische Verbalnomen צָלִי angemessen wiedergeben und erhält die stammverwandte Zuspitzung „brät einen Braten“. Für אוּר ist „Feuer“ die kontextnächste, neutrale Wiedergabe; die mögliche Nuance „Flamme/Lichtschein“ gehört in die Fußnote.
