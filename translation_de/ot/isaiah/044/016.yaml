  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: de
  text: 'Die eine Hälfte davon verbrennt er im Feuer. Mit der anderen Hälfte brät er Fleisch, isst davon und wird satt. Er brät einen Braten.[a] Auch wärmt er sich und sagt: »Ah, mir ist warm! Ich habe Feuer gesehen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch verwendet eine stammverwandte Verbindung, wörtlich etwa: »Er brät einen Braten.« Die knappe Formulierung verknüpft die andere Hälfte des Holzes mit dem Essen und Braten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Ich habe die Flamme gesehen« oder »Ich habe den Feuerschein gesehen.« Das hebräische Wort kann Feuer, Flamme oder feurigen Lichtschein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶצְיוֹ ... עַל חֶצְיוֹ
  choice: die eine Hälfte davon ... mit der anderen Hälfte
  rationale: Der erste Ausdruck bezeichnet die Hälfte des Holzes; beim zweiten macht der Zusammenhang deutlich, dass die verbleibende Hälfte gemeint ist. „Andere“ wird zur verständlichen Wiedergabe des Kontrasts ergänzt.
- source_word: שָׂרַף בְּמוֹ אֵשׁ
  choice: verbrennt er im Feuer
  rationale: Das Perfekt steht in einer anschaulichen Beschreibung typischen Handelns und wird daher im Deutschen präsentisch wiedergegeben. Die Präpositionalgruppe bezeichnet hier das Feuer, in dem das Holz verbrannt wird.
- source_word: בָּשָׂר יֹאכֵל
  choice: bereitet er Fleisch zum Essen zu
  rationale: Wörtlich steht „isst er Fleisch“. Zusammen mit dem folgenden Braten bezeichnet die Aussage jedoch das Kochen und Essen mithilfe der anderen Holzhälfte; die Formulierung stellt diesen sachlichen Zusammenhang im Deutschen klar, während die wörtliche Fassung in der Fußnote erhalten bleibt.
- source_word: יִצְלֶה צָלִי
  choice: er brät einen Braten
  rationale: Die deutsche Verbindung von „braten“ und „Braten“ bildet die stammverwandte hebräische Ausdrucksweise natürlich nach.
- source_word: וְיִשְׂבָּע
  choice: und wird satt
  rationale: Das Verb bezeichnet das Erreichen der Sättigung; „wird satt“ ist prägnant und idiomatisch.
- source_word: אַף יָחֹם
  choice: auch wärmt er sich
  rationale: אַף fügt eine weitere Verwendung des Holzes hinzu; im Zusammenhang ist das Wärmen der eigenen Person gemeint.
- source_word: הֶאָח חַמּוֹתִי
  choice: Ah, mir ist warm!
  rationale: Die Interjektion drückt erfreutes Behagen aus. Das Perfekt bezeichnet den erreichten Zustand des Warmseins.
- source_word: רָאִיתִי אוּר
  choice: Ich sehe den Feuerschein
  rationale: אוּר kann Feuer, Flamme oder feurigen Lichtschein bezeichnen. „Feuerschein“ bewahrt die Verbindung von Feuer und sichtbarem Licht; das deutsche Präsens gibt die gegenwärtige Wahrnehmung natürlich wieder.
theological_decisions:
- issue: Die satirische Kritik am Götzenmacher wiedergeben, ohne sie in den Vers hineinzuerklären
  choice: Die alltäglichen Handlungen und die selbstzufriedene Äußerung des Mannes werden unmittelbar beschrieben.
  alternative: Den Mann oder das verbleibende Holz in diesem Vers ausdrücklich als Götzenmacher beziehungsweise Götzenbild bezeichnen.
  rationale: Der weitere Zusammenhang richtet sich gegen den Götzendienst, doch dieser Vers selbst beschreibt das Verbrennen, Braten, Essen und Wärmen. Die Ironie bleibt aus dem Zusammenhang erkennbar, ohne dass erklärende Theologie ergänzt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten den anschaulichen, satirischen Erzählrhythmus. „Er brät einen Braten“ bewahrt bewusst das hebräische Wortspiel, ohne im Deutschen gekünstelt zu wirken.
