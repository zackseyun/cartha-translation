id: ISA.44.9
reference: Isaiah 44:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: de
  text: Alle, die ein Götzenbild formen, sind nichtig[a], und ihre Kostbarkeiten nützen nichts[b]. Ihre Zeugen[c] sehen nichts und wissen nichts, sodass sie beschämt werden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind leer und wertlos“; auch: „sind ein Nichts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Dinge, an denen sie Freude haben“ beziehungsweise „ihre begehrenswerten Dinge“.'
    reason: lexical_alternative
  - marker: c
    text: „Ihre Zeugen“ kann die Menschen bezeichnen, die für die Götzenbilder eintreten, oder ironisch die Götzenbilder selbst.
    reason: alternative_reading
  - marker: d
    text: 'Oder: „damit sie beschämt werden“. Das Hebräische kann hier Zweck oder Folge ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל כֻּלָּם
  choice: Alle, die ein Götzenbild formen
  rationale: Das Partizip von יצר bezeichnet das Formen oder Gestalten; פֶסֶל ist ein geschnitztes beziehungsweise gefertigtes Kultbild. Die Formulierung ist im Deutschen natürlich und bewahrt den konkreten Herstellungsvorgang.
- source_word: תֹּהוּ
  choice: nichtig
  rationale: Hier bezeichnet תֹּהוּ Leere, Wertlosigkeit und Vergeblichkeit, nicht das urzeitliche Chaos. „Nichtig“ erhält die pointierte Aussage, ohne metaphysische Nichtexistenz zu behaupten.
- source_word: וַחֲמוּדֵיהֶם
  choice: ihre Kostbarkeiten
  rationale: Das von חמד abgeleitete Wort bezeichnet begehrte, geschätzte oder kostbare Dinge. „Kostbarkeiten“ wahrt den Bezug auf das, was ihnen wertvoll ist, ohne es ausdrücklich und damit überdeutlich mit den Götzenbildern gleichzusetzen.
- source_word: בַּל יוֹעִילוּ
  choice: nützen nichts
  rationale: Die Verbform bedeutet Nutzen oder Vorteil bringen. Die deutsche Wendung ist knapp und gibt die praktische Nutzlosigkeit klar wieder.
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: Ihre Zeugen
  rationale: 'Der hebräische Ausdruck bleibt hinsichtlich des Bezugs mehrdeutig: Gemeint sein können die Menschen, die für die Bilder zeugen, oder ironisch die Bilder selbst. Das selbstständige Pronomen הֵמָּה verstärkt das Subjekt; diese Betonung muss im Deutschen nicht eigens wiederholt werden.'
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: sehen nichts und wissen nichts
  rationale: Die wiederholte Verneinung wird parallel und idiomatisch wiedergegeben und bewahrt den Vorwurf fehlender Wahrnehmung und Erkenntnis.
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: sodass sie beschämt werden
  rationale: לְמַעַן kann Zweck oder Folge anzeigen. „Sodass“ gibt hier die naheliegende Folge wieder; die Fußnote hält die Zwecknuance offen.
theological_decisions:
- issue: Bezug von „ihre Zeugen“
  choice: Der Haupttext lässt offen, ob Anhänger beziehungsweise Fürsprecher der Götzenbilder oder ironisch die Bilder selbst gemeint sind.
  alternative: Die Wendung ausschließlich auf die Götzenverehrer oder ausschließlich auf die Götzenbilder beziehen.
  rationale: Die anschließenden Aussagen über Sehen und Wissen können rhetorisch auf beide Gruppen bezogen werden. Eine Festlegung würde die echte Mehrdeutigkeit des Hebräischen unnötig auflösen.
- issue: Aussagekraft von תֹּהוּ
  choice: „nichtig“ im Sinn von wertlos und vergeblich
  alternative: „Chaos“, „Leere“ oder „ein Nichts“
  rationale: Im Zusammenhang steht die Wirkungslosigkeit der Götzenherstellung im Vordergrund. Die Übersetzung vermeidet sowohl den kosmologischen Sinn „Chaos“ als auch eine überzogene Aussage metaphysischer Nichtexistenz.
- issue: Zweck oder Folge in לְמַעַן יֵבֹשׁוּ
  choice: 'Folge: „sodass sie beschämt werden“'
  alternative: 'Zweck: „damit sie beschämt werden“'
  rationale: Beides ist sprachlich möglich. Im prophetischen Tadel fügt sich die Beschämung gut als Folge ihrer Blindheit und Unwissenheit ein; die Alternative wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Schärfe. „Götzenbild“ ist allgemein verständlich; „nichtig“ bewahrt den gehobenen biblischen Ton, während die Fußnote seine Bedeutung erläutert. Alle sachlich relevanten Mehrdeutigkeiten werden im Haupttext gewahrt oder in den Fußnoten ausgewiesen.
