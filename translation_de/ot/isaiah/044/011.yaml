revisions:
- from: 'Sieh doch: Alle seine Gefährten werden zuschanden werden, und die Kunsthandwerker sind nur Menschen.[a] Mögen sie sich alle versammeln und vortreten! Sie werden erschrecken[b] und miteinander zuschanden werden.'
  to: 'Sieh: Alle seine Gefährten werden beschämt werden, und die Kunsthandwerker sind nur Menschen.[a] Mögen sie sich alle versammeln und sich hinstellen! Sie werden sich fürchten[b] und gemeinsam beschämt werden.'
  rationale: 'Die Revision beschränkt sich auf sichere sprachliche und semantische Korrekturen: Das schlichte Stehen wird nicht mehr als Vortreten ausgelegt, Furcht wird nicht als bloßer Schreckmoment wiedergegeben, und die Sprache wird modernisiert. Die Mehrdeutigkeit von »seine Gefährten« bleibt erhalten.'
