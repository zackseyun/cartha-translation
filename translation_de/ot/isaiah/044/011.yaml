    rationale: Das Verb bedeutet primär „stehen“ bzw. „sich hinstellen“. »Vortreten« fügt eine Bewegung nach vorn hinzu, die im hebräischen Wortlaut nicht ausdrücklich enthalten ist.
  - severity: medium
