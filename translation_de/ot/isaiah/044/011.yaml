source:
  edition: WLC
  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: de
  text: 'Sieh: Alle seine Gefährten werden beschämt werden, und die Kunsthandwerker sind nur Menschen.[a] Mögen sie sich alle versammeln und sich hinstellen! Sie werden sich fürchten[b] und gemeinsam beschämt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von Menschen« beziehungsweise »zum Menschengeschlecht gehörig«; gemeint ist, dass die Hersteller selbst nur menschlich und nicht göttlich sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie werden zittern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh doch
  rationale: Die einleitende Aufmerksamkeitspartikel wird als gegenwärtiger, nachdrücklicher Aufruf wiedergegeben, ohne das altertümlichere »Siehe« zu erzwingen.
- source_word: חֲבֵרָיו
  choice: seine Gefährten
  rationale: Die Form bezeichnet die mit ihm verbundenen Personen. »Gefährten« bewahrt den Bezug und legt weder eine Handwerkerzunft noch eine bestimmte kultische Rolle fest.
- source_word: יֵבֹשׁוּ
  choice: werden zuschanden werden
  rationale: Die Wendung gibt die angekündigte öffentliche Beschämung und das Scheitern wieder und bewahrt durch ihre Wiederholung den Rahmen des hebräischen Verses.
- source_word: וְחָרָשִׁים
  choice: und die Kunsthandwerker
  rationale: חָרָשִׁים bezeichnet fachkundige Hersteller unterschiedlicher Materialien; »Kunsthandwerker« ist im Götzenbildkontext verständlich, ohne den Begriff auf Schmiede einzuengen.
- source_word: הֵמָּה מֵאָדָם
  choice: sind nur Menschen
  rationale: Die idiomatische Wiedergabe macht den Kontrast zwischen den bloß menschlichen Herstellern und dem beanspruchten göttlichen Rang deutlich.
- source_word: יִתְקַבְּצוּ כֻלָּם
  choice: Mögen sie sich alle versammeln
  rationale: Der Jussiv gibt die herausfordernde Aufforderung des Zusammenhangs wieder; das reflexive Verb entspricht der Hitpael-Form, bleibt aber im Deutschen natürlich.
- source_word: יַעֲמֹדוּ
  choice: und vortreten
  rationale: Im Herausforderungsszenario bedeutet das Stehen ein Sich-Stellen beziehungsweise Antreten; »vortreten« macht diese Funktion idiomatisch deutlich.
- source_word: יִפְחֲדוּ
  choice: Sie werden erschrecken
  rationale: Das Verb bezeichnet die Furcht, die sie angesichts der Herausforderung ergreift. »Erschrecken« wahrt die mögliche ereignishafte Nuance.
- source_word: יָחַד
  choice: miteinander
  rationale: Das Adverb fasst ihr gemeinsames Geschick zusammen und bezieht sich natürlich auf die erneute Beschämung.
theological_decisions:
- issue: Menschlicher Status der Hersteller gegenüber dem Göttlichen
  choice: die Kunsthandwerker sind nur Menschen
  alternative: die Kunsthandwerker stammen von Menschen
  rationale: מֵאָדָם betont, dass die Hersteller selbst dem Menschengeschlecht angehören und nicht göttlich sind. Die gewählte Formulierung macht diesen Kontrast verständlich, ohne eine weitergehende dogmatische Aussage einzutragen.
- issue: Modus der Aufforderung an die Verbündeten
  choice: Mögen sie sich alle versammeln und vortreten!
  alternative: Sie werden sich alle versammeln und dastehen
  rationale: Die aufeinanderfolgenden Imperfektformen lassen sich formal auch futurisch lesen; im Kontext einer Herausforderung ist die jussivische Aufforderung jedoch wahrscheinlicher. Der anschließende Schrecken und die Beschämung bleiben als Zukunftsaussage formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »zuschanden werden« bildet die hebräische Rahmung nach. »Seine Gefährten« bewahrt den im Hebräischen vorhandenen männlichen Singularbezug, ohne den möglichen Bezug ausdrücklich auf das Götzenbild, seinen Hersteller oder dessen Anhänger festzulegen.
