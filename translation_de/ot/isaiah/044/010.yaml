  naturalness: „Wer formt einen Gott und gießt ein Götterbild, das überhaupt nichts nützt?“ ist modernes, verständliches und dem prophetischen Spott angemessen knappes Standarddeutsch. „Götterbild“ ist hier eine natürliche, nicht unnötig konfessionell aufgeladene Wiedergabe.
