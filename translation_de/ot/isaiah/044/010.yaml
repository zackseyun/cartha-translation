id: ISA.44.10
reference: Isaiah 44:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִֽי יָצַ֥ר אֵ֖ל וּ/פֶ֣סֶל נָסָ֑ךְ לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: de
  text: Wer formt einen Gott und gießt ein Götterbild, das überhaupt nichts nützt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer formt einen Gott und gießt ein Götterbild – ohne jeden Nutzen?“'
    reason: Der hebräische Ausdruck kann sich allgemein auf die Nutzlosigkeit des Herstellens beziehen, statt ausschließlich das Götterbild als nutzlos zu kennzeichnen.
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet eine zugespitzte rhetorische Frage ein.
- source_word: יָצַר
  choice: formt
  rationale: Das Verb bezeichnet das handwerkliche Formen oder Gestalten; das Präsens gibt die allgemein-rhetorische Aussage im Deutschen natürlich wieder.
- source_word: אֵל
  choice: einen Gott
  rationale: Gemeint ist ein von Menschen hergestellter falscher Gott, nicht der Gott Israels.
- source_word: וּפֶסֶל
  choice: und … ein Götterbild
  rationale: Die Konjunktion wird grundlegend mit „und“ wiedergegeben. „Götterbild“ bezeichnet im Deutschen klar ein kultisch verehrtes, menschengemachtes Bild.
- source_word: נָסָךְ
  choice: gießt
  rationale: Im Zusammenhang der Bilderherstellung bezeichnet das Verb das Gießen eines Bildes, wahrscheinlich aus Metall.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: das überhaupt nichts nützt
  rationale: Die Wendung drückt vollständige Nutzlosigkeit aus. Die Relativkonstruktion ist im Deutschen klar und bewahrt die polemische Schärfe; „überhaupt“ verstärkt die im Hebräischen ausgedrückte Negation idiomatisch.
theological_decisions:
- issue: Wiedergabe von אֵל in der Götzenpolemik
  choice: einen Gott
  alternative: Gott; eine Gottheit
  rationale: Der Kontext spricht von einem hergestellten falschen Gott. Der unbestimmte Artikel und die kontextgemäße Kleinschreibung des Artikels unterscheiden ihn vom Gott Israels, ohne den Ausdruck unnötig zu abstrahieren.
- issue: Bezug der Aussage über die Nutzlosigkeit
  choice: Das Götterbild wird als völlig nutzlos bezeichnet.
  alternative: Die Herstellung geschieht ohne jeden Nutzen.
  rationale: Der hebräische Infinitivausdruck nennt kein ausdrückliches Subjekt und lässt den genauen syntaktischen Bezug offen. Der Haupttext wählt die im Kontext naheliegende Aussage über das Götterbild; die Fußnote bewahrt die weitere mögliche Fassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rhetorischer Schärfe. Die handwerklichen Verben bleiben konkret; die echte syntaktische Mehrdeutigkeit des Schlusssatzes wird in der Fußnote erhalten.
