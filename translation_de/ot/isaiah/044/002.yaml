  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: de
  text: 'So spricht JHWH, dein Schöpfer, der dich im Mutterleib geformt hat und dir hilft: Fürchte dich nicht, mein Diener Jakob, Jeschurun[a], den ich erwählt habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeschurun ist ein poetischer Name für Israel und bedeutet wahrscheinlich „der Aufrechte“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Die Wiedergabe mit dem deutschen Tetragramm bewahrt den besonderen Gottesnamen, ohne ihn durch einen Titel oder eine unsichere Aussprache zu ersetzen.
- source_word: עֹשֶׂךָ
  choice: der dich gemacht hat
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet JHWH als den, der Israel gemacht hat; die verbale Formulierung klingt im heutigen Deutsch natürlich.
- source_word: וְיֹצֶרְךָ
  choice: und dich … geformt hat
  rationale: יצר hebt das absichtsvolle Formen oder Gestalten hervor und bleibt damit von dem allgemeineren עשה unterschieden.
- source_word: מִבֶּטֶן
  choice: vom Mutterleib an
  rationale: Die Wendung erhält das Bild des Mutterleibs und gibt zugleich den zeitlichen Ausgangspunkt des hebräischen מִן idiomatisch wieder.
- source_word: יַעְזְרֶךָּ
  choice: der dir helfen wird
  rationale: Das Imperfekt wird als zukünftige Zusage verstanden; die Relativkonstruktion führt die Beschreibung JHWHs fort.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Dies ist eine knappe, idiomatische und im biblischen Register geläufige Wiedergabe des hebräischen Verbots.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im Zusammenhang bezeichnet עבד Israels Zugehörigkeit und Dienst für Gott; „Diener“ ist gegenwärtig verständlich und vermeidet eine unnötige Festlegung auf den sozialen Status eines Sklaven.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Die im Deutschen etablierte Namensform bezeichnet hier Israel als kollektive Person.
- source_word: וִישֻׁרוּן
  choice: Jeschurun
  rationale: Der poetische Ehrenname für Israel wird in deutscher Form transliteriert; seine wahrscheinliche Bedeutung wird in einer Fußnote angegeben.
- source_word: בָּחַרְתִּי בוֹ
  choice: den ich erwählt habe
  rationale: Die Relativkonstruktion gibt das Perfekt und das pronominale Objekt natürlich wieder und bewahrt die Aussage von Gottes Erwählung.
theological_decisions:
- issue: Singularformen in der kollektiven Anrede Israels
  choice: Die singularische Anrede „dich/dir“ und die Namen Jakob und Jeschurun bleiben erhalten.
  alternative: Die Anrede als Plural oder ausdrücklich mit „Israel“ wiederzugeben.
  rationale: Der hebräische Text personifiziert das Volk durch die Namen Jakob und Jeschurun. Die Bewahrung des Singulars erhält diese prophetische und bundestheologische Ausdrucksweise, ohne sie auszudeuten.
- issue: Wiedergabe von יְשֻׁרוּן
  choice: Der Name steht als „Jeschurun“ im Haupttext; seine wahrscheinliche Bedeutung erscheint in einer Fußnote.
  alternative: Den Ausdruck im Haupttext als „Aufrechter“ zu übersetzen.
  rationale: Da der Ausdruck hier als poetischer Name Israels fungiert, wahrt die Transliteration seine Namensfunktion, während die Fußnote den möglichen Wortsinn zugänglich macht.
- issue: Zeitbezug von יַעְזְרֶךָּ
  choice: „der dir helfen wird“ als zukünftige Zusage
  alternative: „der dir hilft“ als allgemeine oder gegenwärtige Aussage
  rationale: Das hebräische Imperfekt lässt den Zeitbezug grundsätzlich offen; im Kontext der Ermutigung wird die Form plausibel als zugesagte künftige Hilfe wiedergegeben, ohne eine weitergehende zeitliche Bestimmung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte singularische Anrede bildet die kollektive Personifizierung Israels ab. „JHWH“ bewahrt den Gottesnamen; „Jeschurun“ bleibt als poetischer Eigenname stehen.
