  text: מָחִ֤יתִי כָ/עָב֙ פְּשָׁעֶ֔י/ךָ וְ/כֶ/עָנָ֖ן חַטֹּאותֶ֑י/ךָ שׁוּבָ֥/ה אֵלַ֖/י כִּ֥י גְאַלְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: de
  text: Ich habe deine Vergehen wie eine dichte Wolke ausgelöscht[a] und deine Sünden wie eine Wolke. Kehre zu mir zurück[b], denn ich habe dich erlöst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe deine Vergehen wie eine Wolke ausgelöscht und deine Sünden wie eine Wolke.“ Das Hebräische verwendet im poetischen Parallelismus zwei verwandte Wörter für Wolke; das erste kann insbesondere eine dichte Wolke bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Kehre zu mir zurück“ kann auch mit „Wende dich wieder mir zu“ wiedergegeben werden und schließt den Gedanken der Umkehr ein.
    reason: lexical_alternative
  - marker: c
    text: 'Im prophetischen Sprachgebrauch möglicherweise auch: „Ich werde … auslöschen … ich werde dich erlösen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: Ich habe ... weggewischt
  rationale: מחה bezeichnet das Wegwischen, Auslöschen oder Tilgen. „Weggewischt“ ist gegenwärtiges, natürliches Deutsch und verbindet die vollständige Beseitigung anschaulich mit dem folgenden Wolkenbild.
- source_word: כָעָב
  choice: wie eine Wolke
  rationale: Die Präposition כ markiert einen Vergleich; עָב bezeichnet eine Wolke, häufig eine dichte Wolke.
- source_word: פְּשָׁעֶיךָ
  choice: deine Vergehen
  rationale: פשע kann Übertretung, Auflehnung oder Vergehen bezeichnen. „Vergehen“ bewahrt den moralisch-rechtlichen Ernst, ohne das Wort unnötig auf offene Rebellion festzulegen.
- source_word: וְכֶעָנָן
  choice: und ... wie Nebel
  rationale: עָנָן bedeutet gewöhnlich „Wolke“. „Nebel“ erhält im poetischen Parallelismus eine verständliche Variation und hebt das spurlos Vergehende des Bildes hervor; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: חַטֹּאותֶיךָ
  choice: deine Sünden
  rationale: „Sünden“ ist die kontextgemäße und allgemein verständliche Wiedergabe von חטאות.
- source_word: שׁוּבָה אֵלַי
  choice: Kehre zu mir zurück
  rationale: שוב mit אֶל fordert zur Rückkehr beziehungsweise Umkehr zu Gott auf. Die Formulierung wahrt sowohl die relationale als auch die bundesbezogene und zur Umkehr rufende Bedeutung.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die Aufforderung zur Rückkehr mit Gottes erlösendem Handeln.
- source_word: גְאַלְתִּיךָ
  choice: ich habe dich erlöst
  rationale: גאל bezeichnet die lösende, zurückfordernde oder befreiende Tat eines Erlösers. „Erlöst“ bewahrt das theologische Gewicht und die breite biblische Bedeutungsfülle.
theological_decisions:
- issue: Aspekt und zeitlicher Bezug der Perfektformen מָחִיתִי und גְאַלְתִּיךָ
  choice: 'Beide als deutsches Perfekt mit gegenwärtigem Ergebnis wiedergeben: „Ich habe ... weggewischt ... ich habe dich erlöst.“'
  alternative: 'Im prophetischen Sprachgebrauch ist auch eine auf die Zukunft zielende Wiedergabe möglich: „Ich werde ... wegwischen ... ich werde dich erlösen.“'
  rationale: Im Zusammenhang begründet Gottes vollzogenes beziehungsweise als sicher verkündetes Erlösungshandeln die Aufforderung zur Rückkehr. Das deutsche Perfekt bringt Vollendung und bleibende Gegenwartsbedeutung zum Ausdruck, ohne die mögliche prophetische Zukunftsnuance zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. „Weggewischt“ erhält das konkrete Bild; „Kehre zu mir zurück“ ist feierlich, aber allgemein verständlich. Die Fußnoten bewahren die lexikalische und aspektuelle Mehrdeutigkeit des Hebräischen.
