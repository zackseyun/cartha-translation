  text: וּ/מִֽי כָמ֣וֹ/נִי יִקְרָ֗א וְ/יַגִּידֶ֤/הָ וְ/יַעְרְכֶ֨/הָ֙ לִ֔/י מִ/שּׂוּמִ֖/י עַם עוֹלָ֑ם וְ/אֹתִיּ֛וֹת וַ/אֲשֶׁ֥ר תָּבֹ֖אנָה יַגִּ֥ידוּ לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: de
  text: Und wer ist wie ich? Der soll rufen, es verkünden und es mir der Reihe nach darlegen, seit ich ein Volk aus alter Zeit eingesetzt habe.[a] Sie sollen ihnen das Kommende[b] und das, was kommen wird, ankündigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Zeit an, als ich das Volk der Vorzeit einsetzte“. Der hebräische Ausdruck kann zeitlich verstanden werden; עוֹלָם kann hier „aus alter Zeit“, aber auch „ewig“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Zeichen“. Im Zusammenhang bezeichnet der hebräische Ausdruck wahrscheinlich bevorstehende Ereignisse.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: Und wer ist wie ich?
  rationale: Die rhetorische Herausforderung und der Anschluss durch וּ werden unmittelbar und natürlich wiedergegeben.
- source_word: יִקְרָא וְיַגִּידֶהָ
  choice: Der soll es ausrufen, es verkünden
  rationale: Der Jussivcharakter der Herausforderung wird mit „soll“ ausgedrückt. Das zweimalige „es“ macht das im Hebräischen durch das feminine Suffix bezeichnete, aber nicht ausdrücklich genannte Thema sichtbar, ohne es näher festzulegen.
- source_word: וְיַעְרְכֶהָ לִי
  choice: und mir geordnet darlegen
  rationale: „Geordnet darlegen“ gibt den Sinn von ערך als ordnen beziehungsweise in eine Folge bringen wieder; „mir“ bewahrt die Funktion von לִי.
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: seit ich ein Volk aus alter Zeit eingesetzt habe
  rationale: מִן mit dem Infinitiv wird temporal als „seit“ verstanden. עוֹלָם bezeichnet hier wahrscheinlich hohes Alter beziehungsweise Vorzeit; „eingesetzt“ gibt שׂים wieder, ohne eine spezifische Art der Einsetzung festzulegen.
- source_word: וְאֹתִיּוֹת
  choice: das Kommende
  rationale: Im Parallelismus mit וַאֲשֶׁר תָּבֹאנָה bezeichnet der Ausdruck wahrscheinlich bevorstehende Ereignisse. Die substantivierte Form „das Kommende“ ist im Deutschen knapp und lässt den Inhalt offen.
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: und das, was kommen wird
  rationale: Die Relativkonstruktion und ihr Zukunftsbezug werden bewahrt; zugleich bleibt die auffällige inhaltliche Parallelität zum vorhergehenden Ausdruck bestehen.
- source_word: יַגִּידוּ לָמוֹ
  choice: Sie sollen ihnen … ankündigen
  rationale: Die schwierigen Pluralpronomina des Hebräischen werden nicht durch ausdrücklich benannte Bezugsgruppen vereindeutigt.
theological_decisions:
- issue: Bedeutung von עַם עוֹלָם
  choice: ein Volk aus alter Zeit
  alternative: ein ewiges Volk; das Volk der Vorzeit
  rationale: Im Zusammenhang der göttlichen Herausforderung, Geschichte zu ordnen und Zukünftiges anzukündigen, liegt die zeitliche Bedeutung „aus alter Zeit“ nahe. Die Fußnote hält die mögliche Bedeutung „ewig“ offen und vermeidet, eine Aussage über den ewigen Status eines bestimmten Volkes in den Text einzutragen.
- issue: Bedeutung von וְאֹתִיּוֹת
  choice: das Kommende
  alternative: die Zeichen
  rationale: Der Parallelismus mit „das, was kommen wird“ spricht für bevorstehende Ereignisse. Die traditionelle beziehungsweise graphisch mögliche Deutung als „Zeichen“ wird in einer Fußnote erhalten.
- issue: Bezug der Pluralpronomina in יַגִּידוּ לָמוֹ
  choice: Sie sollen ihnen … ankündigen
  alternative: Sie sollen das ankündigen; sie sollen es jenem Volk ankündigen
  rationale: Da die Bezugsgrößen im komprimierten Hebräisch nicht eindeutig sind, werden die Pronomen formal bewahrt, statt rivalisierende Götter, deren Anhänger oder das alte Volk ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die jussive Herausforderung wird mit „Der soll …“ idiomatisch wiedergegeben. Die ungewöhnlichen Pronomen und die doppelte Bezeichnung des Zukünftigen bleiben bewusst stehen, damit die Verdichtung und Mehrdeutigkeit des Hebräischen nicht geglättet werden.
