revisions:
- from: 'der über Kyrus sagt: »Er ist mein Hirte und wird alles ausführen, was mir gefällt«, und über Jerusalem: »Es soll wieder aufgebaut werden«, und über den Tempel: »Sein Grund soll gelegt werden.«'
  to: 'der über Kyrus sagt: »Er ist mein Hirte und wird mein ganzes Vorhaben ausführen«, der zu Jerusalem sagt: »Es soll wieder aufgebaut werden«, und zum Tempel: »Sein Fundament wird gelegt werden.«'
  rationale: Die Revision präzisiert חֶפֶץ als Gottes Vorhaben, ohne eine konfessionelle Deutung einzutragen, und gibt die Tempelgründung unmittelbarer wieder. Die Wiederholung von »der« macht die im Hebräischen durch לֵאמֹר erneut gesetzte Redeanbindung klar und ist im Deutschen zugleich flüssig. Der offene Relativsatz bleibt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:47Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft die Struktur und die zentralen Aussagen des Hebräischen weitgehend. »Kyrus«, »mein Hirte« und die Wiederaufbauaussage über Jerusalem sind zutreffend. Bei כָל־חֶפְצִי ist »was mir gefällt« jedoch zu stark auf bloßes Gefallen verengt; im Kontext und mit יַשְׁלִם bezeichnet es Gottes gesamtes Vorhaben bzw. seinen Willen, den Kyrus ausführen wird. Bei dem Tempel lautet das hebräische Prädikat passiv »wird gegründet/fundiert werden«; »Sein Grund soll gelegt werden« ist möglich, fügt aber »Grund« als Substantiv hinzu und schwächt die direkte Aussage über den Tempel.
  naturalness: Der Relativsatzanschluss ist korrekt und die Sprache ist modern und würdig. Die parallele Konstruktion wird mit »über« verständlich wiedergegeben. »Sein Grund soll gelegt werden« klingt etwas schwerfällig; »Sein Fundament wird gelegt werden« ist idiomatischer, bleibt aber gegenüber »der Tempel wird gegründet werden« leicht explizierend.
  terminology: Die deutsche Namensform »Kyrus« ist etabliert. »mein Hirte« bewahrt die Metapher angemessen. Für חֶפֶץ ist »mein ganzes Vorhaben« im vorliegenden Satz die treffendere und theologisch nicht überdeutende Wiedergabe.
  issues:
  - severity: medium
    issue: כָל־חֶפְצִי wird als »alles, was mir gefällt« wiedergegeben.
    rationale: Die Wiedergabe kann im Deutschen ein momentanes Wohlgefallen nahelegen. In Verbindung mit »er wird erfüllen« ist Gottes gesamtes Vorhaben bzw. Wille gemeint; »mein ganzes Vorhaben« bildet dies genauer ab.
  - severity: low
    issue: תִּוָּסֵד wird mit »Sein Grund soll gelegt werden« wiedergegeben.
    rationale: Der hebräische Text sagt unmittelbar vom Tempel, dass er gegründet werden wird. Die Fassung mit »Grund« ist verständlich, aber weniger direkt und ergänzt ein Substantiv. »Sein Fundament wird gelegt werden« ist eine klare, natürliche Entfaltung des passiven Verbs.
  revised_text: 'der über Kyrus sagt: »Er ist mein Hirte und wird mein ganzes Vorhaben ausführen«, der zu Jerusalem sagt: »Es soll wieder aufgebaut werden«, und zum Tempel: »Sein Fundament wird gelegt werden.«'
  revised_footnotes: []
