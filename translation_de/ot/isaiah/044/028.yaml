base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: de
  text: 'der über Kyrus sagt: »Er ist mein Hirte und wird mein ganzes Vorhaben ausführen«, der zu Jerusalem sagt: »Es soll wieder aufgebaut werden«, und zum Tempel: »Sein Fundament wird gelegt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹרֶשׁ
  choice: Kyrus
  rationale: Die im Deutschen etablierte Namensform für den persischen König Cyrus.
- source_word: רֹעִי
  choice: mein Hirte
  rationale: Gibt die königliche Hirtenmetapher des Hebräischen unmittelbar und würdevoll wieder.
- source_word: כָל־חֶפְצִי יַשְׁלִם
  choice: wird alles ausführen, was mir gefällt
  rationale: חֵפֶץ kann Gefallen, Wunsch oder Vorhaben bezeichnen; die Formulierung bewahrt diese Spannung besser als das abstraktere »meinen ganzen Plan«.
- source_word: תִּבָּנֶה
  choice: soll wieder aufgebaut werden
  rationale: Das Nifal bezeichnet das Erbautwerden; »wieder« ergibt sich sachgerecht aus dem Wiederaufbau Jerusalems, während »soll« den deklarativen Charakter der Gottesrede wiedergibt.
- source_word: תִּוָּסֵד
  choice: Sein Grund soll gelegt werden
  rationale: Gibt das passive Verb יסד konkret wieder und bezieht das Suffix sinngemäß auf den Tempel.
theological_decisions:
- issue: Bezeichnung des Kyrus als Gottes Hirten
  choice: »mein Hirte« ohne Abschwächung
  alternative: »mein Beauftragter«
  rationale: Die auffällige Hirtenmetapher ist ausdrücklich im Ausgangstext vorhanden und darf trotz ihrer theologischen Spannung nicht paraphrasiert werden.
- issue: Bedeutung von חֵפֶץ
  choice: »was mir gefällt«
  alternative: »mein ganzes Vorhaben«
  rationale: Die gewählte Fassung hält sowohl Gottes Wohlgefallen als auch seinen wirksamen Willen im Blick, ohne die Mehrdeutigkeit einseitig aufzulösen.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Der Vers bleibt als Relativsatz offen, da er syntaktisch an den vorhergehenden Kontext anschließt. Die parallelen Aussagen über Jerusalem und den Tempel werden knapp und klar wiedergegeben.
