  to: 'Aus dem Rest macht er einen Gott, sein Schnitzbild[a]. Vor ihm wirft er sich nieder und betet es an; er betet zu ihm und sagt: »Rette mich, denn du bist mein Gott!«'
  rationale: Die erste Satzhälfte wird syntaktisch geglättet, damit „sein Schnitzbild“ eindeutig als Apposition zu dem hergestellten „Gott“ steht. Keine inhaltliche oder theologische Deutung wird hinzugefügt; die wechselnde deutsche Bezugnahme auf das Bild und die direkte Anrede bleiben als Ausdruck der im Ausgangstext inszenierten Verehrung erhalten.
