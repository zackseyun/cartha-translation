base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: de
  text: 'Aus dem Rest macht er einen Gott, sein Schnitzbild[a]. Vor ihm wirft er sich nieder und betet es an; er betet zu ihm und sagt: »Rette mich, denn du bist mein Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzenbild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: Den Rest davon
  rationale: שְׁאֵרִית bezeichnet den Rest beziehungsweise das Übriggebliebene; das Suffix verweist auf das Holz im vorausgehenden Zusammenhang.
- source_word: לְאֵל עָשָׂה
  choice: macht er zu einem Gott
  rationale: Die Präposition לְ bezeichnet hier das Ergebnis der Herstellung. Das Präsens entspricht der anschaulichen Schilderung des fortlaufenden beziehungsweise typischen Handelns.
- source_word: לְפִסְלוֹ
  choice: zu seinem Schnitzbild
  rationale: פֶסֶל bezeichnet ein plastisch hergestelltes, insbesondere geschnitztes Kultbild. „Schnitzbild“ bewahrt den konkreten Herstellungsaspekt.
- source_word: יִסְגּוֹד לוֹ
  choice: Vor ihm wirft er sich nieder
  rationale: סגד bezeichnet das Niederwerfen als Huldigungs- oder Verehrungsgeste; die Formulierung hält diese körperliche Handlung vom folgenden Anbeten unterscheidbar.
- source_word: וְיִשְׁתַּחוּ
  choice: und betet es an
  rationale: שׁחה kann das Sich-Niederwerfen bezeichnen, trägt im kultischen Zusammenhang aber den Sinn der Anbetung. So bleibt die rhetorische Häufung erhalten, ohne dieselbe deutsche Wendung zu wiederholen.
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: er betet zu ihm
  rationale: התפלל אל bezeichnet das Gebet an jemanden. „Ihm“ ist im Deutschen sowohl für „Gott“ als auch im Dativ für das sächliche „Schnitzbild“ grammatisch möglich und wahrt den Bezug.
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Imperativ von נצל bittet um Rettung oder Befreiung. „Rette mich“ ist klares, modernes Deutsch und erhält die Ironie der Bitte an ein selbst gefertigtes Bild.
- source_word: כִּי אֵלִי אָתָּה
  choice: denn du bist mein Gott
  rationale: כִּי begründet die Bitte; אֵלִי bezeichnet den als persönlichen Gott beanspruchten Gegenstand.
theological_decisions:
- issue: Personale Rede an das Kultbild
  choice: Die direkte Anrede „du“ und die Gebetsform bleiben uneingeschränkt erhalten.
  alternative: Durch ausschließlich unpersönliche Bezüge stärker hervorheben, dass es sich um einen Gegenstand handelt.
  rationale: Der hebräische Text entfaltet seine Kritik gerade dadurch, dass der Hersteller das selbst gemachte Bild wie einen rettenden Gott anspricht. Diese Spannung darf nicht erklärend abgeschwächt werden.
- issue: Wiedergabe von אֵל im götzendienerischen Zusammenhang
  choice: „Gott“
  alternative: „Götze“
  rationale: „Gott“ bewahrt die Behauptung des Betenden und damit die Schärfe der Ironie; „Götze“ würde die verurteilende Deutung bereits in dessen eigene Aussage hineintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Handlungen Niederwerfen, Anbeten und Beten bleiben als rhetorische Steigerung sichtbar; die Bildsprache wird weder archaisiert noch konfessionell zugespitzt.
