  naturalness: „Aus dem Rest macht er einen Gott, sein Schnitzbild“ ist modernes, klares Standarddeutsch und macht deutlich, dass das Schnitzbild der hergestellte „Gott“ ist. Die Reihung der Verehrungshandlungen bleibt erhalten.
