source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אָדָם֙ לְ/בָעֵ֔ר וַ/יִּקַּ֤ח מֵ/הֶם֙ וַ/יָּ֔חָם אַף יַשִּׂ֖יק וְ/אָ֣פָה לָ֑חֶם אַף יִפְעַל אֵל֙ וַ/יִּשְׁתָּ֔חוּ עָשָׂ֥/הוּ פֶ֖סֶל וַ/יִּסְגָּד לָֽ/מוֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: de
  text: 'Dann dient es einem Menschen als Brennstoff: Er nimmt etwas davon und wärmt sich; auch entzündet er ein Feuer und backt Brot. Auch macht er einen Gott und wirft sich nieder; er macht daraus ein Schnitzbild und beugt sich vor ihm nieder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine poetische Pluralform: „vor ihnen“. Sie kann sich auf die Holzstücke oder das Material insgesamt beziehen; dem unmittelbar zuvor genannten „Schnitzbild“ entsprechend ist auch die singularische Wiedergabe „vor ihm“ möglich.'
    reason: Die hebräische Pronominalform לָמוֹ ist formal pluralisch, während ihr nächster möglicher Bezug פֶסֶל singularisch ist; die echte grammatische Spannung soll sichtbar bleiben.
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: Dann dient es einem Menschen als Brennstoff
  rationale: Die Wendung bezeichnet das Holz in seiner Funktion zum Verbrennen. „Dient ... als Brennstoff“ gibt Zweck und Ergebnis natürlich wieder; אָדָם ist hier generisch-singular und wird mit „einem Menschen“ ohne unnötige Geschlechtsfestlegung übersetzt.
- source_word: וַיִּקַּח מֵהֶם
  choice: Er nimmt etwas davon
  rationale: מֵהֶם ist formal pluralisch und partitiv. Im Deutschen nimmt „davon“ den im Zusammenhang genannten Holzbestand beziehungsweise dessen Stücke natürlich auf.
- source_word: וַיָּחָם
  choice: und wärmt sich
  rationale: Das Verb bezeichnet das Warmwerden; im Handlungskontext ist die reflexive deutsche Form idiomatisch.
- source_word: אַף יַשִּׂיק
  choice: auch heizt er damit
  rationale: אַף setzt die Reihe mit „auch“ fort. Das Hifil bezeichnet hier das Entzünden beziehungsweise Unterhalten eines Feuers; „heizt ... damit“ passt zum Holz und vermeidet eine schwerfällige Ergänzung.
- source_word: וְאָפָה לָחֶם
  choice: und backt Brot
  rationale: Direkte und natürliche Wiedergabe der Verb-Objekt-Verbindung.
- source_word: אַף יִפְעַל אֵל
  choice: Auch macht er einen Gott
  rationale: פעל bedeutet hier machen beziehungsweise herstellen. Die bewusst anstößige Formulierung bewahrt die prophetische Ironie, dass ein Mensch einen „Gott“ anfertigt.
- source_word: וַיִּשְׁתָּחוּ
  choice: und wirft sich nieder
  rationale: Das Verb bezeichnet eine körperliche Niederwerfung und kann dadurch Verehrung ausdrücken. Die Übersetzung hält zunächst die konkrete Gebärde fest.
- source_word: עָשָׂהוּ פֶסֶל
  choice: er macht daraus ein Schnitzbild
  rationale: Das Objektsuffix wird im Deutschen mit „daraus“ natürlich auf das Material bezogen. פֶסֶל bezeichnet ein durch Schnitzen beziehungsweise Behauen hergestelltes Kultbild; „Schnitzbild“ bewahrt diesen handwerklichen Aspekt.
- source_word: וַיִּסְגָּד לָמוֹ
  choice: und beugt sich vor ihm nieder
  rationale: סגד bezeichnet das Niederbeugen oder Sich-Niederwerfen. לָמוֹ ist formal eine poetische Pluralform, steht hier aber nach dem singularischen פֶסֶל; die idiomatische Hauptübersetzung nimmt den unmittelbaren singularischen Bezug auf, während die Formabweichung in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Bezeichnung des hergestellten Kultgegenstands
  choice: „einen Gott“ ... „ein Schnitzbild“
  alternative: beide Ausdrücke mit „Götzenbild“ wiederzugeben
  rationale: Der hebräische Text wechselt bewusst von אֵל („Gott“) zu פֶסֶל („Schnitzbild“). Dieser Kontrast trägt die Ironie und darf nicht durch ein einheitliches polemisches Etikett eingeebnet werden.
- issue: Bezug der poetischen Pronominalform לָמוֹ
  choice: im Haupttext singularisch „vor ihm“, mit Fußnote zur formalen Mehrzahl
  alternative: „vor ihnen“
  rationale: Der unmittelbare Bezugsbegriff פֶסֶל ist singularisch. Die formal pluralische, poetische Form bleibt textkritisch und auslegungsoffen dokumentiert, ohne im deutschen Haupttext einen irreführenden Numeruswechsel zu erzeugen.
- issue: Generisches אָדָם
  choice: „einem Menschen“
  alternative: „einem Mann“
  rationale: אָדָם bezeichnet hier den Menschen als beliebigen Nutzer des Holzes, nicht ausdrücklich eine männliche Person. „Mensch“ wahrt Singularität und generische Reichweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Satzanfänge mit „auch“ bilden die zugespitzte hebräische Handlungsfolge nach. Konkrete Herstellungs- und Niederwerfungsbegriffe bewahren die prophetische Ironie, ohne zusätzliche konfessionelle Terminologie einzutragen.
