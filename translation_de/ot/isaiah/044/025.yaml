id: ISA.44.25
reference: Isaiah 44:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: de
  text: der die Zeichen der Lügner zunichtemacht und Wahrsager zu Narren werden lässt, der Weise zurückweichen lässt und ihr Wissen zur Torheit macht,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: zunichtemacht
  rationale: Das Partizip bezeichnet, dass etwas vereitelt, aufgehoben oder unwirksam gemacht wird; „zunichtemacht“ gibt die Wirkung natürlich und prägnant wieder.
- source_word: בַּדִּים
  choice: Lügner
  rationale: Das seltene Wort kann prahlerische oder falsche Redner bezeichnen. Im Zusammenhang mit Zeichen und Wahrsagern ist „Lügner“ lexikalisch gut begründet und bewahrt die Gegenüberstellung zu Gottes verlässlichem Wort.
- source_word: יְהוֹלֵל
  choice: zu Narren werden lässt
  rationale: Die Kausativform drückt aus, dass Gott die Wahrsager töricht erscheinen oder handeln lässt; diese Formulierung ist idiomatisch und erhält den Vorgangscharakter.
- source_word: מֵשִׁיב ... אָחוֹר
  choice: zurückweichen lässt
  rationale: Die Wendung bedeutet wörtlich, jemanden rückwärts zu wenden. „Zurückweichen lässt“ bewahrt das Bild und ist im Deutschen verständlich.
- source_word: יְשַׂכֵּל
  choice: zur Torheit macht
  rationale: Die Form ist kausativ und besagt, dass das Wissen als töricht erwiesen beziehungsweise zur Torheit gemacht wird; die gewählte Fassung hält die pointierte Parallelität fest.
theological_decisions:
- issue: Gottes Handeln gegenüber menschlichen Zeichen, Wahrsagung und Weisheit
  choice: 'Die kausativen Aussagen werden unmittelbar wiedergegeben: Gott macht Zeichen zunichte, lässt Wahrsager zu Narren werden und macht Wissen zur Torheit.'
  alternative: 'Abschwächend: Gott „entlarvt“ lediglich ihre Torheit oder ihr Wissen als töricht.'
  rationale: Der hebräische Text beschreibt wirksames göttliches Handeln. Die Übersetzung sollte diese Spannung nicht auf eine bloße menschliche Fehleinschätzung reduzieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die partizipiale Reihung des Kontextes wird durch wiederholtes „der“ bewahrt; das abschließende Komma signalisiert, dass der Vers syntaktisch Teil der fortlaufenden Gottesbeschreibung ist.
