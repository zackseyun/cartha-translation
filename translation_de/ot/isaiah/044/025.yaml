  source_fidelity: 'Die Wiedergabe folgt der hebräischen Partizipialreihe und ihren kausativen Aussagen zuverlässig: מֵפֵר ist treffend als „zunichtemacht“ wiedergegeben; אֹתוֹת בַּדִּים als „Zeichen der Lügner“ ist im gegebenen Kontext gut vertretbar; יְהוֹלֵל, מֵשִׁיב ... אָחוֹר und יְשַׂכֵּל werden sinnentsprechend als göttliches Herbeiführen von Torheit, Rückzug und Entwertung des Wissens wiedergegeben. Die vorhandene Mehrdeutigkeit von בַּדִּים wird nicht unzulässig dogmatisch eingeengt.'
