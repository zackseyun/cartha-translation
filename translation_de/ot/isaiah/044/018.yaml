source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: de
  text: Sie wissen nichts und verstehen nichts; denn ihre Augen sind zugestrichen, sodass sie nicht sehen können, und ihre Herzen sind zugestrichen, sodass sie keine Einsicht haben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein Verb für das Bestreichen oder Verputzen: Die Augen und Herzen sind gleichsam überzogen, sodass sie nicht sehen beziehungsweise keine Einsicht haben können. Oft wird sinngemäß „verblendet“ übersetzt. Das hebräische Verb steht in der 3. Person Singular, nennt den Handelnden aber nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen sind die „Herzen“ der Sitz von Denken und Einsicht, nicht nur von Gefühlen.
    reason: cultural_note
lexical_decisions:
- source_word: יָדְעוּ
  choice: sie wissen nichts
  rationale: Das negierte Qal-Perfekt bezeichnet im Kontext einen gegenwärtigen beziehungsweise allgemeinen Zustand. Die idiomatische deutsche Formulierung gibt die Aussage knapp wieder.
- source_word: יָבִינוּ
  choice: verstehen nichts
  rationale: בין bezeichnet Verstehen oder Einsicht; „verstehen“ bildet im Deutschen eine natürliche Parallele zu „wissen“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung ihrer Erkenntnislosigkeit ein; „denn“ wahrt den erklärenden Zusammenhang in würdigem Deutsch.
- source_word: טַח
  choice: sind zugestrichen
  rationale: טח bezeichnet konkret das Bestreichen oder Überziehen. Die passive Formulierung bewahrt das Bild, vermeidet aber, den im Hebräischen nicht genannten Handelnden festzulegen.
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: ihre Augen …, sodass sie nicht sehen
  rationale: מִן mit Infinitiv bezeichnet hier eine Verhinderung. Die deutsche Folgekonstruktion gibt diese Funktion natürlicher wieder als „vom Sehen“.
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: ihre Herzen, sodass sie keine Einsicht haben
  rationale: השׂכיל drückt einsichtiges Erfassen aus. „Keine Einsicht haben“ erhält den kognitiven Sinn und lässt zugleich „Herzen“ als hebräischen Sitz des Denkens stehen.
- source_word: לִבֹּתָם
  choice: ihre Herzen
  rationale: Das hebräische Herz umfasst Denken, Wahrnehmen und Wollen, nicht nur Gefühle; die konkrete anthropologische Redeweise wird beibehalten.
theological_decisions:
- issue: Nicht ausdrücklich genannter Handelnder bei טַח
  choice: 'Passiv: „ihre Augen sind zugestrichen“'
  alternative: „er hat ihre Augen zugestrichen“
  rationale: טח ist formal 3. Person Maskulinum Singular, doch sein Subjekt wird nicht genannt. Das deutsche Passiv bewahrt diese Offenheit und legt nicht fest, ob Gott oder ein anderer Handelnder gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Hebräischen und die kognitive Bedeutung von „Herz“ bleiben erhalten. Der nicht genannte Handelnde wird durch eine Passivkonstruktion bewusst offengelassen.
