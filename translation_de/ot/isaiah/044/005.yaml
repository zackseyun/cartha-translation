  text: זֶ֤ה יֹאמַר֙ לַֽ/יהוָ֣ה אָ֔נִי וְ/זֶ֖ה יִקְרָ֣א בְ/שֵֽׁם יַעֲקֹ֑ב וְ/זֶ֗ה יִכְתֹּ֤ב יָד/וֹ֙ לַֽ/יהוָ֔ה וּ/בְ/שֵׁ֥ם יִשְׂרָאֵ֖ל יְכַנֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: de
  text: 'Der eine wird sagen: »Ich gehöre Jahwe[a].« Ein anderer wird sich nach Jakob[b] nennen, und wieder ein anderer wird sich auf die Hand schreiben: »Jahwe zugehörig«, und sich den Namen Israel geben[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Jahwe zugehörig bin ich.« Das Hebräische ist knapp und lässt das Verb unausgesprochen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann auch »den Namen Jakob anrufen« bedeuten. Im Zusammenhang ist eine Selbstbezeichnung oder Zuordnung zu Jakob wahrscheinlich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sich mit dem Namen Israel benennen« beziehungsweise »sich nach Israel nennen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: der eine ... ein anderer ... und wieder ein anderer
  rationale: Die wiederholten Demonstrativformen unterscheiden mehrere Personen. Die deutsche Wiedergabe bewahrt den verteilenden Sinn in natürlicher Form.
- source_word: יֹאמַר לַיהוָה אָ֔נִי
  choice: 'wird sagen: »Ich gehöre Jahwe«'
  rationale: Die elliptische hebräische Nominalwendung lautet wörtlich etwa »Jahwe zugehörig bin ich«. Die Ergänzung mit »gehöre« gibt das Zugehörigkeitsbekenntnis klar und idiomatisch wieder.
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: wird sich mit dem Namen Jakob nennen
  rationale: Im parallelen Zusammenhang bezeichnet קרא בשם am ehesten die bewusste Selbstidentifikation mit Jakob beziehungsweise dessen Volk; die grundsätzlich mögliche Bedeutung »anrufen« wird nicht stillschweigend ausgeschlossen und in der Fußnote genannt.
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: 'wird auf seine Hand schreiben: »Jahwe gehörend«'
  rationale: Der knappe hebräische Wortlaut, wörtlich ungefähr »wird seine Hand Jahwe schreiben«, wird meist als Beschriftung oder Kennzeichnung der Hand zum Zeichen der Zugehörigkeit verstanden. Die Formulierung bewahrt das konkrete Bild.
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: wird sich den Namen Israel geben
  rationale: Das Piel von כנה bezeichnet hier wahrscheinlich das Bezeichnen oder Benennen mit einem Namen. Die reflexive deutsche Form passt zur parallelen Selbstzuordnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transparent und in der im Deutschen geläufigen Form »Jahwe« wiedergegeben.
theological_decisions:
- issue: Art des Bekenntnisses und der Zugehörigkeit
  choice: Die Personen erklären offen ihre Zugehörigkeit zu Jahwe und identifizieren sich mit Jakob beziehungsweise Israel.
  alternative: Die Aussagen könnten allgemeiner als soziale Zuordnung zu Israel verstanden werden.
  rationale: Die parallelen Handlungen – Bekenntnis, Namensannahme und Beschriftung der Hand – sprechen für eine bewusste Zugehörigkeit, ohne spätere konfessionelle Kategorien in den Text einzutragen.
- issue: Bedeutung von יִקְרָא בְשֵׁם יַעֲקֹב
  choice: sich mit dem Namen Jakob nennen
  alternative: den Namen Jakob anrufen
  rationale: Die Selbstbezeichnung passt besser zu den parallelen Akten persönlicher Identifikation; die lexikalische Mehrdeutigkeit wird jedoch durch eine Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die dreifache Parallelstruktur bleibt hörbar; elliptische Aussagen werden nur so weit ergänzt, wie es für verständliches Deutsch nötig ist. Die Namen Jakob und Israel sowie das konkrete Bild der Hand bleiben erhalten.
