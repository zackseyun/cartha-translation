source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: de
  text: 'So spricht Jahwe[a], der König Israels und sein Erlöser, Jahwe der Heerscharen: Ich bin der Erste, und ich bin der Letzte; außer mir gibt es keinen Gott.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Gottesname hier mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Außer mir gibt es keine Gottheit.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König Israels
  rationale: Die formelle Titulatur und die Apposition zum Gottesnamen bleiben erhalten.
- source_word: גֹאֲלוֹ
  choice: sein Erlöser
  rationale: Das Partizip bezeichnet den, der Israel auslöst beziehungsweise befreit; „Erlöser“ ist im Deutschen natürlich und wahrt die möglichen verwandtschaftsrechtlichen Anklänge, ohne sie übermäßig festzulegen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Heerscharen“ gibt צְבָאוֹת als umfassende Scharen beziehungsweise Heere wieder und bewahrt zugleich die würdevolle, im Deutschen verständliche Titelform.
- source_word: אֲנִי רִאשׁוֹן וַאֲנִי אַחֲרוֹן
  choice: Ich bin der Erste, und ich bin der Letzte
  rationale: Die wiederholten Pronomen und der feierlich ausgewogene Parallelismus des Hebräischen werden beibehalten.
- source_word: וּמִבַּלְעָדַי
  choice: außer mir
  rationale: Die Wendung drückt Ausschließlichkeit aus und ist so knapp und idiomatisch wiedergegeben.
- source_word: אֵין אֱלֹהִים
  choice: gibt es keinen Gott
  rationale: Die Formulierung bewahrt die absolute Aussage über Gottes Einzigkeit; die alternative Kleinschreibung bleibt als mögliche sprachliche Auffassung in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration bewahrt den persönlichen Gottesnamen; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ ist lexikalisch tragfähig, würdevoll und weiter gefasst als ausschließlich menschliche Heere; „der Allmächtige“ wäre stärker deutend.
- issue: Monotheistische Aussage אֵין אֱלֹהִים
  choice: keinen Gott
  alternative: keinen Gott oder keine Gottheit neben mir
  rationale: Der Haupttext formuliert die absolute Einzigkeitsaussage knapp, ohne eine Hierarchie möglicher geringer Götter einzuführen; die grammatisch mögliche generische Auffassung wird in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst feierlichem Parallelismus. „So spricht“ entspricht der prophetischen Botenformel; „Heerscharen“ wahrt die Breite und Traditionsnähe des göttlichen Titels, ohne ihn mit „allmächtig“ auszudeuten.
