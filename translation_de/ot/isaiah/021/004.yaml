  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: de
  text: Mein Herz taumelt; Schauder hat mich in Angst versetzt. Die Dämmerung, nach der ich mich sehnte, hat er mir zum Schrecken gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Abenddämmerung, nach der ich mich sehnte, hat er mir zum Beben gemacht.«'
    reason: Lexikalische Alternativen bei נֶשֶׁף und חֲרָדָה sowie eine idiomatische Wiedergabe der resultativen Konstruktion שָׂם לִי.
lexical_decisions:
- source_word: תָּעָה
  choice: taumelt
  rationale: Das Verb bezeichnet eigentlich ein Umherirren oder Abirren. Mit »mein Herz« beschreibt es hier bildhaft innere Desorientierung; »taumelt« bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: Die wörtliche Wiedergabe bewahrt die hebräische Vorstellung vom Herzen als Mitte des inneren Menschen.
- source_word: פַּלָּצוּת
  choice: Schauder
  rationale: Das Substantiv bezeichnet heftiges Zittern oder Schaudern. »Schauder« verbindet die körperliche Reaktion mit dem empfundenen Entsetzen.
- source_word: בִּעֲתַתְנִי
  choice: hat mich in Angst versetzt
  rationale: Das Verb בעת bedeutet »erschrecken, in Angst versetzen«. Das Perfekt wird als eingetretene Wirkung der Vision wiedergegeben.
- source_word: נֶשֶׁף
  choice: Dämmerung
  rationale: נֶשֶׁף bezeichnet das Zwielicht, hier wahrscheinlich die Abenddämmerung. »Dämmerung« erhält die poetische Weite des Ausdrucks.
- source_word: חִשְׁקִי
  choice: nach der ich mich sehnte
  rationale: Das mit Suffix versehene Substantiv bedeutet »mein Verlangen/meine Sehnsucht«. Die verbale Fassung ergibt natürliches modernes Deutsch.
- source_word: שָׂם לִי
  choice: hat er für mich ... verwandelt
  rationale: שׂים bedeutet wörtlich »setzen, machen«. Die resultative Wiedergabe »verwandelt« drückt den Umschlag der ersehnten Dämmerung in Schrecken aus; das im Hebräischen nicht ausdrücklich genannte männliche Subjekt bleibt als »er« bestehen.
- source_word: לַחֲרָדָה
  choice: in Schrecken
  rationale: חֲרָדָה kann Zittern, Angst oder Schrecken bezeichnen. »Schrecken« passt zur beschriebenen Umkehr und vermeidet eine unnötige Wiederholung von »Schauder«.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von שָׂם
  choice: »er« wird beibehalten, ohne den Handelnden zu identifizieren
  alternative: 'Unpersönlich oder passiv: »wurde mir zum Schrecken«'
  rationale: Die hebräische Verbform ist aktiv und maskulin Singular, doch der Vers selbst benennt den Handelnden nicht. Die Übersetzung wahrt diese Offenheit und legt ihn nicht ausdrücklich als Gott oder eine andere Gestalt fest.
translation_notes:
  register: Poetisches, würdiges modernes Standarddeutsch. Die kurzen Hauptsätze und die körperlich-emotionalen Begriffe erhalten die Unmittelbarkeit der Vision; ungewöhnlich steife Wörtlichkeit wird vermieden.
