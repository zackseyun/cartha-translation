revisions:
- from: Mein Herz taumelt; Schauder hat mich in Angst versetzt. Die Dämmerung, nach der ich mich sehnte, hat er für mich in Schrecken verwandelt.[a]
  to: Mein Herz taumelt; Schauder hat mich in Angst versetzt. Die Dämmerung, nach der ich mich sehnte, hat er mir zum Schrecken gemacht.[a]
  rationale: Die Änderung von „für mich in Schrecken verwandelt“ zu „mir zum Schrecken gemacht“ gibt die aktive resultative Konstruktion שָׂם לִי לַחֲרָדָה und den Dativ לִי genauer wieder, ohne den nicht genannten Handelnden zu bestimmen. Die Fußnote wird entsprechend sprachlich geglättet und behält die lexikalische Ambiguität von Abenddämmerung und Beben/Zittern bei.
