base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: de
  text: Sie decken den Tisch, sie breiten Teppiche aus[a], sie essen, sie trinken. Steht auf, ihr Fürsten! Ölt den Schild ein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie stellen Wachen auf“ beziehungsweise „sie halten auf dem Wachturm Ausschau“. Der hebräische Wortlaut ist hier schwer zu deuten; die Übersetzung im Haupttext folgt dem Sinn einer Festvorbereitung, der zur Abfolge der Handlungen passt.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Salbt den Schild.“ Gemeint ist vermutlich, den Schild durch Einölen für den Kampf herzurichten.'
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: Sie decken den Tisch
  rationale: עָרֹךְ bezeichnet das Ordnen oder Bereitstellen; in Verbindung mit dem Tisch ist „den Tisch decken“ im Deutschen konkret, natürlich und dem Festmahlbild angemessen.
- source_word: צָפֹה הַצָּפִית
  choice: sie breiten die Decken aus
  rationale: Die schwierige Wortverbindung kann im Zusammenhang als Ausbreiten einer Decke oder eines Teppichs zur Vorbereitung des Mahls verstanden werden. Die unsichere Deutung wird in der Fußnote offengehalten.
- source_word: אָכוֹל שָׁתֹה
  choice: sie essen, sie trinken
  rationale: Die Infinitive absoluti zeichnen knapp und lebhaft die laufende Szene; finite Verben geben diese Wirkung im modernen Deutschen natürlich wieder.
- source_word: קוּמוּ הַשָּׂרִים
  choice: Steht auf, ihr Fürsten!
  rationale: Der pluralische Imperativ bewirkt einen jähen Wechsel zum Alarmruf. „Fürsten“ bewahrt den höfisch-politischen Rang von שׂרים, ohne ihn enger festzulegen.
- source_word: מִשְׁחוּ מָגֵן
  choice: Ölt die Schilde ein
  rationale: מִשְׁחוּ bedeutet wörtlich „salbt/bestreicht“. Bei militärischer Ausrüstung bezeichnet „einölen“ die konkrete Vorbereitung; der deutsche Plural macht den kollektiv gebrauchten Singular מָגֵן verständlich.
