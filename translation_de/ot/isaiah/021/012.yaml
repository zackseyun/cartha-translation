reference: Isaiah 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָמַ֣ר שֹׁמֵ֔ר אָתָ֥ה בֹ֖קֶר וְ/גַם לָ֑יְלָה אִם תִּבְעָי֥וּ/ן בְּעָ֖יוּ שֻׁ֥בוּ אֵתָֽיוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: de
  text: 'Der Wächter sagt[a]: »Der Morgen kommt, und auch die Nacht. Wenn ihr fragen wollt, dann fragt; kehrt zurück[b], kommt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Morgen ist gekommen, und auch die Nacht.« Das Hebräische kann als allgemeine Aussage über das Kommen oder als unmittelbarere Ankündigung des Eingetretenen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Die letzten Aufforderungen können auch als »kehrt um, kommt wieder« verstanden werden. Gemeint sein kann eine Umkehr oder einfach, dass die Fragenden später erneut kommen sollen; das Hebräische lässt die Nuance offen.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: der Wächter
  rationale: Das substantivierte Partizip bezeichnet jemanden, der Wache hält; »Wächter« passt zur Rolle im unmittelbaren Zusammenhang.
- source_word: אָמַר
  choice: sagt
  rationale: Obwohl die Form morphologisch ein Perfekt ist, führt sie hier die gegenwärtig wiedergegebene Antwort des Wächters ein; das deutsche Präsens klingt natürlich.
- source_word: אָתָה בֹקֶר
  choice: der Morgen kommt
  rationale: Das Verb bezeichnet das Kommen beziehungsweise Eintreffen; die Formulierung bewahrt die Aussage, ohne zwischen allgemeiner und bereits eingetretener Ankunft zu entscheiden.
- source_word: וְגַם לָיְלָה
  choice: und auch die Nacht
  rationale: Die koordinierende Fügung wird eng wiedergegeben; ein ausdrücklich adversatives »aber« würde die angedeutete Spannung stärker auslegen als der hebräische Wortlaut.
- source_word: אִם תִּבְעָיוּן בְּעָיוּ
  choice: wenn ihr fragen wollt, dann fragt
  rationale: Die Wiederholung derselben Wurzel bleibt durch »fragen … fragt« hörbar; »wollt« gibt den volitionalen Zug der Bedingung idiomatisch wieder.
- source_word: שֻׁבוּ
  choice: kehrt zurück
  rationale: Die Wendung lässt sowohl eine räumliche Rückkehr als auch ein Umkehren anklingen und legt die Bedeutung nicht vorschnell fest.
- source_word: אֵתָיוּ
  choice: kommt
  rationale: Der knappe zweite Imperativ wird direkt wiedergegeben; so bleibt die ungewöhnliche Folge »kehrt zurück, kommt« erhalten.
theological_decisions:
- issue: Bedeutung der abschließenden Imperative
  choice: »kehrt zurück, kommt« bleibt bewusst offen
  alternative: »kehrt um und kommt wieder« mit ausdrücklichem Hinweis auf Umkehr oder eine spätere erneute Anfrage
  rationale: Der hebräische Wortlaut kann sowohl räumliche Rückkehr beziehungsweise erneutes Kommen als auch Umkehr im weitergehenden Sinn nahelegen; der Haupttext soll diese Spannung nicht konfessionell festlegen.
translation_notes:
  register: Modernes, standardsprachliches und würdevolles Deutsch. Die knappe, rätselhafte Aussageform des Orakels sowie die Wiederholung beim Fragen und die Mehrdeutigkeit der Schlussaufforderungen bleiben erhalten.
