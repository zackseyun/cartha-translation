id: ISA.21.17
reference: Isaiah 21:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: de
  text: Und die noch verbliebenen Bogenschützen[a], die Krieger der Söhne Kedars, werden nur wenige sein[b]; denn Jahwe, der Gott Israels, hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Bogen“; das Wort steht hier für die Männer, die den Bogen führen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Und der Rest der Zahl der mächtigen Bogenschützen unter den Söhnen Kedars wird abnehmen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: Und die noch verbliebenen … werden nur wenige sein
  rationale: Die Verbindung bezeichnet den verbleibenden zahlenmäßigen Bestand. Die deutsche Formulierung gibt den quantitativen Sinn natürlich wieder, ohne dem Wort שְׁאָר unnötig eine theologische Bedeutung als „Rest“ beizulegen.
- source_word: קֶשֶׁת
  choice: Bogenschützen
  rationale: Wörtlich steht „Bogen“; gemeint sind metonymisch die mit dem Bogen kämpfenden Männer. „Bogenschützen“ bewahrt das militärische Bild und ist im modernen Deutsch idiomatisch.
- source_word: גִּבּוֹרֵי
  choice: die Krieger
  rationale: Das Wort bezeichnet hier im militärischen Zusammenhang kampfstarke Männer. „Krieger“ ist natürlicher als das wörtlichere „Helden“ oder „starke Männer“.
- source_word: בְנֵי קֵדָר
  choice: der Söhne Kedars
  rationale: Die Wiedergabe bewahrt die hebräische Abstammungs- und Volksbezeichnung, ohne sie erklärend zu „Volk von Kedar“ zu verflachen.
- source_word: יִמְעָטוּ
  choice: werden nur wenige sein
  rationale: Das Verb kann bedeuten, zahlenmäßig gering zu werden oder wenige zu sein. Die gewählte Form gibt in diesem Kontext das angekündigte Ergebnis klar und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Konstruktion wird direkt und idiomatisch wiedergegeben.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt begründet die Gewissheit des angekündigten Geschehens; „hat gesprochen“ erhält die feierliche prophetische Schlussformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration als „Jahwe“ bewahrt den Eigennamen und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von שְׁאָר
  choice: noch verbliebenen
  alternative: Rest
  rationale: Im Zusammenhang geht es vorrangig um die nach einer Niederlage verbleibende Anzahl von Kämpfern. Die Übersetzung vermeidet es, ohne textlichen Zwang eine besondere theologische Vorstellung vom „Rest“ einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem gedrängten Hebräisch leicht geglättet; die ethnische Bezeichnung „Söhne Kedars“ und die prophetische Schlussformel bleiben bewusst erhalten.
