source:
  edition: WLC
  text: כִּֽי מִ/פְּנֵ֥י חֲרָב֖וֹת נָדָ֑דוּ מִ/פְּנֵ֣י חֶ֣רֶב נְטוּשָׁ֗ה וּ/מִ/פְּנֵי֙ קֶ֣שֶׁת דְּרוּכָ֔ה וּ/מִ/פְּנֵ֖י כֹּ֥בֶד מִלְחָמָֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/015.yaml
  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
translation:
  language: de
  text: Denn sie sind vor den Schwertern geflohen, vor dem gezückten Schwert[a], vor dem gespannten Bogen[b] und vor der Schwere des Kampfes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem ausgestreckten Schwert“. Das hebräische Wort bezeichnet ein Schwert, das ausgestreckt oder zum Einsatz bereitgemacht ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem schussbereiten Bogen“. Gemeint ist ein Bogen, der zum Schießen vorbereitet ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor dem Gewicht des Kampfes“; auch „vor der Schwere des Krieges“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den erklärenden Zusammenhang.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die viermal wiederholte Präposition bezeichnet hier das fluchtartige Zurückweichen angesichts einer Gefahr; im Deutschen ist „vor … fliehen“ die natürliche Entsprechung.
- source_word: חֲרָבוֹת
  choice: Schwertern
  rationale: Der Plural bezeichnet konkret die bewaffnete Bedrohung und wird direkt wiedergegeben.
- source_word: נָדָדוּ
  choice: sind … geflohen
  rationale: Im Zusammenhang militärischer Gefahr meint das Verb Flucht beziehungsweise Ausweichen, nicht zielloses Umherziehen.
- source_word: חֶרֶב נְטוּשָׁה
  choice: gezückten Schwert
  rationale: Das Adjektiv beschreibt ein ausgestrecktes oder einsatzbereit gemachtes Schwert; „gezückt“ ist dafür eine natürliche und anschauliche deutsche Wiedergabe.
- source_word: קֶשֶׁת דְּרוּכָה
  choice: gespannten Bogen
  rationale: Die Form beschreibt einen zum Schießen bereitgemachten Bogen. „Gespannt“ ist im Deutschen die übliche Waffenbezeichnung.
- source_word: כֹּבֶד מִלְחָמָה
  choice: Wucht des Kampfes
  rationale: כֹּבֶד bedeutet wörtlich „Gewicht/Schwere“ und bezeichnet hier die bedrückende Gewalt des Kampfgeschehens; „Wucht“ erhält das Bild in verständlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition „vor“ bildet die eindringliche hebräische Reihung ab; „Wucht des Kampfes“ bewahrt die Gewichtsmetapher in natürlicher Form.
