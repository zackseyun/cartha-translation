revisions:
- from: 'Und sieh[a], da kommt ein Wagen, ein Mann, ein Gespann von Reitern. Und er hob an und sagte: »Gefallen, gefallen ist Babylon! Und alle Schnitzbilder ihrer Götter hat er zu Boden geschmettert.«[b]'
  to: 'Und sieh, da kommt ein Wagen, ein Mann, ein Paar Reiter.[a] Und er hob an und sagte: »Gefallen, gefallen ist Babylon, und alle Schnitzbilder ihrer Götter hat er zu Boden geschmettert.«[b]'
  rationale: Die Revision ersetzt ausschließlich die missverständliche und im Deutschen unnatürliche Verbindung »Gespann von Reitern« durch »Paar Reiter« und setzt den zugehörigen Fußnotenanker an die tatsächlich erläuterte Wortgruppe. Die syntaktische Härte des Hebräischen, insbesondere die Reihung »ein Wagen, ein Mann, ein Paar Reiter«, bleibt bewusst bestehen. Die Interpunktion verbindet die doppelte Fallensproklamation mit der Zerschmetterung der Bilder wie im hebräischen Satzgefüge.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:15:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung bewahrt die deiktische Ankündigung, die emphatische Wiederholung »Gefallen, gefallen«, den Namen Babylon sowie das unausgesprochene maskuline Singularsubjekt von »hat er ... geschmettert«. In der schwierigen Wortgruppe רכב איש צמד פרשים ist jedoch »ein Gespann von Reitern« nicht quellentreu genug: צֶמֶד bezeichnet ein Paar, während ein deutsches »Gespann« gewöhnlich ein Team von Zugtieren bezeichnet und nicht Reiter.'
  naturalness: »Ein Wagen, ein Mann, ein Paar Reiter« ist absichtlich knapp und elliptisch, aber im Deutschen verständlich und wesentlich natürlicher als »ein Gespann von Reitern«. Die knappe prophetische Satzfolge und der gehobene, moderne Registerton bleiben erhalten.
  terminology: »Schnitzbilder ihrer Götter« gibt פסילי אלהיה angemessen konkret wieder. »Zu Boden geschmettert« vermittelt die zerstörerische Kraft von שבר und lässt den Täter wie im Hebräischen ungenannt. »Ein Paar Reiter« gibt צמד präzise wieder, ohne die syntaktisch umstrittene Gesamtwendung zu harmonisieren.
  issues:
  - severity: medium
    issue: »ein Gespann von Reitern«
    rationale: Die Formulierung verschiebt die Bedeutung von צֶמֶד (Paar/Joch) zu einem Zugtiergespann und ist im Deutschen semantisch auffällig. »Ein Paar Reiter« erhält sowohl die lexikalische Bedeutung als auch die hebräische Verdichtung.
  - severity: low
    issue: Fußnotenanker [a] steht bei »sieh« statt bei der schwierigen Wagen-Reiter-Wortgruppe.
    rationale: Die Anmerkung erläutert nicht וְהִנֵּה, sondern die anschließende verdichtete Wortgruppe. Ein Anker nach »Reiter« ist für Leserinnen und Leser eindeutig.
