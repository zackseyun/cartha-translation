source:
  edition: WLC
  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: de
  text: 'Und sieh, da kommt ein Wagen, ein Mann, ein Paar Reiter.[a] Und er hob an und sagte: »Gefallen, gefallen ist Babylon, und alle Schnitzbilder ihrer Götter hat er zu Boden geschmettert.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wortgruppe ist stark verdichtet und kann auch als Beschreibung einer herannahenden Wagen- oder Reitertruppe verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen heißt es »hat er ... geschmettert«; wer damit gemeint ist, bleibt unausgesprochen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה זֶה בָא
  choice: Und sieh, da kommt
  rationale: Bewahrt die lebhafte, hinweisende Ankündigung und gibt die Unmittelbarkeit in natürlichem modernem Deutsch wieder.
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: ein Wagen, ein Mann, ein Gespann von Reitern
  rationale: Die stark verdichtete und syntaktisch schwierige Formulierung wird möglichst quellennah wiedergegeben, ohne ihre Mehrdeutigkeit durch eine glättende Deutung aufzulösen.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Und er hob an und sagte
  rationale: Gibt die zweigliedrige hebräische Redeeinleitung in würdigem, verständlichem Deutsch wieder.
- source_word: נָפְלָה נָפְלָה
  choice: Gefallen, gefallen
  rationale: Erhält die emphatische Wiederholung und die knappe prophetische Wucht.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: alle Schnitzbilder ihrer Götter
  rationale: Schnitzbilder bezeichnet konkret die hergestellten Kultbilder und bleibt enger am hebräischen Ausdruck als das allgemeinere Götzenbilder.
- source_word: שִׁבַּר לָאָרֶץ
  choice: hat er zu Boden geschmettert
  rationale: Gibt die aktive maskuline Singularform und die gewaltsame, vollständige Zerstörung anschaulich wieder.
theological_decisions:
- issue: Urheber der Zerstörung im letzten Satzteil
  choice: Die aktive Singularform »hat er ... geschmettert« bleibt ohne ausdrücklich genanntes Subjekt stehen.
  alternative: Ein göttliches oder menschliches Subjekt ergänzen; kollektiv »sie haben« oder passiv »sie wurden ... zerschmettert« übersetzen.
  rationale: Das Hebräische hat ein Verb in der 3. Person Maskulin Singular, nennt den Handelnden aber nicht. Die Übersetzung bewahrt diese Offenheit und legt weder göttliche noch menschliche Urheberschaft fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Wiederholung bleibt erhalten; die schwierige Wagen-Reiter-Wendung wird bewusst nicht eindeutig geglättet. Sämtliche Fußnotenmarker stehen im Haupttext.
