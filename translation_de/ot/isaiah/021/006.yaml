source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: de
  text: 'Denn so hat der Herr zu mir gesagt: »Geh und stell einen Wächter auf! Was er sieht, soll er melden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so hat … gesagt
  rationale: כִּי begründet die vorausgehende Aussage, während die feste Redeeinleitung כֹה אָמַר mit »so hat … gesagt« natürlich und zugleich quellennah wiedergegeben wird.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der göttliche Titel, nicht der Gottesname JHWH. »Der Herr« gibt den Titel in modernem Standarddeutsch angemessen wieder.
- source_word: לֵךְ הַעֲמֵד
  choice: Geh und stell … auf
  rationale: Der erste Imperativ fordert zum Gehen auf; der Hifil-Imperativ von עמד bedeutet, jemanden an einem bestimmten Ort aufzustellen. Das verbindende »und« entspricht natürlichem Deutsch, ohne den Handlungsablauf zu verändern.
- source_word: הַמְצַפֶּה
  choice: einen Wächter
  rationale: Das substantivierte Partizip von צפה bezeichnet jemanden, der Ausschau hält. Der bestimmte Artikel kann nach dem unbestimmten deutschen Objekt idiomatisch als Rollenbezeichnung wiedergegeben werden.
- source_word: אֲשֶׁר יִרְאֶה יַגִּיד
  choice: Was er sieht, soll er melden
  rationale: Der Relativsatz bezeichnet den Inhalt der Meldung. Das Modalverb »soll« gibt die auffordernde beziehungsweise jussivische Kraft von יַגִּיד klar wieder; »melden« passt zur Aufgabe eines Wächters.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: der Herr
  alternative: mein Herr
  rationale: Obwohl die Form geschichtlich mit einem Possessivelement verbunden ist, fungiert אֲדֹנָי hier konventionell als göttlicher Titel. »Der Herr« wahrt zugleich den Unterschied zum Gottesnamen JHWH und vermeidet eine unnötige Festlegung auf ausdrücklich possessiven Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlsartig; die Satzfolge ist für heutige Leser natürlich, ohne die Struktur oder den Sinn des Hebräischen auszubauen.
