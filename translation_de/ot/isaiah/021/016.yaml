review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Redeformel, den göttlichen Titel Adonaj, den Adressaten, den vollständigen Verlust und den Eigennamen Kedar zuverlässig wieder. „Noch ein Jahr“ ist jedoch im heutigen Deutsch zeitlich weniger eindeutig als בְּעוֹד שָׁנָה und kann zudem wie eine bloße Verlängerung klingen; „Binnen eines Jahres“ gibt die verbleibende Frist klarer wieder. Die Vergleichsformel mit dem Tagelöhner bleibt bewusst erhalten.
  naturalness: Die bisherige Abfolge „Noch ein Jahr, wie die Jahre eines Tagelöhners, dann ...“ wirkt im modernen Standarddeutsch elliptisch und etwas sperrig. Mit „Binnen eines Jahres, wie die Jahre eines Tagelöhners“ ist der Satz flüssiger, ohne das Bild oder dessen Deutung auszuformulieren.
  terminology: „der Herr“ ist für אֲדֹנָי angemessen; keine für JHWH reservierte Schreibweise ist erforderlich. „Herrlichkeit“ hält den offenen Bedeutungsumfang von כָּבוֹד gut fest. Die Fußnote sollte die Alternativen jeweils mit dem Bezugswort „Kedars“ vollständig nennen.
  issues:
