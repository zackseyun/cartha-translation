source:
  edition: WLC
  text: כִּי כֹ֛ה אָמַ֥ר אֲדֹנָ֖/י אֵלָ֑/י בְּ/ע֤וֹד שָׁנָה֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/כָלָ֖ה כָּל כְּב֥וֹד קֵדָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: de
  text: 'Denn so hat der Herr zu mir gesagt: »Binnen eines Jahres, wie die Jahre eines Tagelöhners, wird die ganze Herrlichkeit Kedars[a] ein Ende haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Pracht Kedars« oder »der ganze Wohlstand Kedars«. Das hebräische Wort kann Herrlichkeit, Ansehen, Pracht oder materiellen Reichtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so hat … gesagt
  rationale: Die Wendung leitet die Begründung ein und bewahrt zugleich die feierliche prophetische Redeformel.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Hier steht der göttliche Titel Adonaj, nicht der Gottesname JHWH; deshalb wird der Titel unmittelbar übersetzt.
- source_word: אֵלָי
  choice: zu mir
  rationale: Gibt den Empfänger der göttlichen Rede knapp und unmittelbar wieder.
- source_word: בְּעוֹד שָׁנָה
  choice: Noch ein Jahr
  rationale: Die Formulierung bezeichnet die bis zur Erfüllung verbleibende Zeit und ist im Deutschen natürlich, ohne den Zeitpunkt unnötig zu präzisieren.
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: wie die Jahre eines Tagelöhners
  rationale: Bewahrt das hebräische Bild einer vertraglich festgelegten und genau abgezählten Arbeitszeit, ohne die implizite Bedeutung in den Haupttext einzutragen.
- source_word: וְכָלָה
  choice: dann wird … ein Ende haben
  rationale: Gibt das vollständige Aufhören beziehungsweise Erschöpftwerden in idiomatischem Deutsch wieder; „dann“ macht den zeitlichen Zusammenhang deutlich.
- source_word: כָּל כְּבוֹד קֵדָר
  choice: die ganze Herrlichkeit Kedars
  rationale: „Herrlichkeit“ wahrt die Bedeutungsbreite von כבוד zwischen Ansehen, Pracht und Wohlstand; Kedar bleibt als Eigenname transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: der HERR
  rationale: Der Ausgangstext verwendet Adonaj als Titel und nicht das Tetragramm JHWH. Daher wird keine besondere Schreibweise verwendet, die dem Gottesnamen vorbehalten sein könnte.
- issue: Bedeutungsumfang von כְּבוֹד in der Gerichtsankündigung
  choice: Herrlichkeit
  alternative: Pracht oder Wohlstand
  rationale: Der Kontext erlaubt sowohl gesellschaftliches Ansehen und Pracht als auch materiellen Reichtum. Der Haupttext wahrt diese Spannung mit dem breiten Ausdruck „Herrlichkeit“; die Alternativen werden in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Redeformel bleibt erkennbar; das Bild vom Tagelöhner wird nicht erklärend aufgelöst. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
