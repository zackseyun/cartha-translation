id: ISA.21.10
reference: Isaiah 21:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: de
  text: Mein Gedroschenes[a], Sohn meiner Tenne[b]! Was ich von Jahwe der Heerscharen, dem Gott Israels, gehört habe, habe ich euch verkündet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mein Zermalmtes“ oder „mein Zertretenes“. Das Hebräische gebraucht das Dreschen als Bild schwerer Bedrängnis.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Sohn meiner Tenne“. Die bildhafte Wendung gehört zum Dreschmotiv und kann das bezeichnen, was zur Tenne gehört und dort wie Getreide bearbeitet wird.
    reason: cultural_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: mein Gedroschenes
  rationale: Die substantivierte Form bewahrt das passive Bild des Dreschens und lässt offen, wer genau angeredet wird. Deutendere Wiedergaben wie „mein zerschlagenes Volk“ würden den Bezug und die Metapher stärker festlegen, als es der hebräische Text tut.
- source_word: וּבֶן גָּרְנִי
  choice: Sohn meiner Tenne
  rationale: Die wörtlich-poetische Wiedergabe erhält sowohl בֵּן („Sohn“) als auch גֹּרֶן („Tenne“) und damit die enge Verbindung zum vorausgehenden Dreschbild. Die ungewöhnliche Formulierung ist auch im Hebräischen bildhaft.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: Was ich … gehört habe
  rationale: אֲשֶׁר leitet hier den Inhalt des Gehörten ein; das deutsche Perfekt verbindet das empfangene Wort natürlich mit seiner nun erfolgenden Verkündigung.
- source_word: מֵאֵת יְהוָה צְבָאוֹת
  choice: von Jahwe der Heerscharen
  rationale: מֵאֵת bezeichnet die Herkunft der Botschaft. „Jahwe“ gibt den Gottesnamen im üblichen deutschen Lautbild wieder; „der Heerscharen“ bewahrt die weite Bedeutung des traditionellen Gottestitels, ohne sie auf irdische Heere einzuengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Apposition wird unmittelbar und idiomatisch wiedergegeben.
- source_word: הִגַּדְתִּי לָכֶם
  choice: habe ich euch verkündet
  rationale: Das Hifil von נגד bezeichnet das Bekanntmachen oder Verkünden. „Euch“ bildet den Plural der angeredeten Personen ausdrücklich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen, und entspricht der im Deutschen geläufigen Form.
- issue: Deutungsgrad des Dreschbildes
  choice: Das landwirtschaftliche Bild bleibt im Haupttext erhalten.
  alternative: Deutende Wiedergabe wie „mein zerschlagenes Volk“
  rationale: Der hebräische Wortlaut benennt die Angeredeten in einer ungewöhnlichen Dreschmetaphorik, ohne sie hier ausdrücklich mit „Volk“ oder „Israel“ gleichzusetzen. Die Übersetzung bewahrt diese Offenheit und die Härte des Bildes.
- issue: Bezug und Bedeutung von „Sohn meiner Tenne“
  choice: Die semitische Bildrede wird nicht auf eine einzige Sachdeutung festgelegt.
  alternative: „Korn meiner Tenne“ oder „mein auf der Tenne gedroschenes Volk“
  rationale: „Sohn“ kann Zugehörigkeit oder enge Beziehung ausdrücken; der Kontext legt das Dreschen nahe, bestimmt jedoch nicht völlig eindeutig, wie die Metapher sachlich aufzulösen ist.
translation_notes:
  register: Poetisch-prophetischer, würdiger Ton mit bewusst ungewöhnlicher Anrede. Die knappe Ausrufkonstruktion erhält die Eindringlichkeit des Hebräischen; der anschließende Satz ist in natürlichem modernem Standarddeutsch formuliert.
