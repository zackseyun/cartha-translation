id: ISA.21.14
reference: Isaiah 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
translation:
  language: de
  text: Bringt dem Durstigen Wasser entgegen; ihr Bewohner des Landes Tema[a], geht dem Flüchtenden mit Brot entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tema war eine Oase beziehungsweise Region in Arabien an wichtigen Karawanenwegen.
    reason: cultural_note
  - marker: b
    text: Die hebräische Form kann auch im Sinn von »geht dem Flüchtenden mit seinem Brot beziehungsweise seinen Vorräten entgegen« verstanden werden. Gemeint sein kann entweder, dass man ihm Brot bringt, oder dass man ihm beim Zusammentreffen mit seinen Vorräten entgegenkommt.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת צָמֵא
  choice: dem Durstigen … entgegen
  rationale: לִקְרַאת bezeichnet die Bewegung auf jemanden zu; צָמֵא ist ein substantiviertes Adjektiv im Singular und bleibt mit „dem Durstigen“ formal sichtbar.
- source_word: הֵתָיוּ מָיִם
  choice: Bringt … Wasser
  rationale: Der pluralische Imperativ fordert dazu auf, Wasser herbeizubringen; die deutsche Wortstellung mit „entgegen“ gibt die hebräische Begegnungswendung natürlich wieder.
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  choice: ihr Bewohner des Landes Tema
  rationale: Die Nominalgruppe fungiert angesichts der pluralischen Imperative als Anrede. Der Ortsname wird als „Tema“ transliteriert.
- source_word: בְּלַחְמוֹ
  choice: mit Brot
  rationale: „Mit Brot“ wahrt die instrumentale beziehungsweise begleitende Bedeutung der Präposition, ohne den semantisch unsicheren Bezug des Suffixes im Haupttext festzulegen.
- source_word: קִדְּמוּ
  choice: geht … entgegen
  rationale: Das Piel bedeutet hier, jemandem entgegenzugehen beziehungsweise ihn zu empfangen; „entgegengehen“ verbindet beide Halbverse sprachlich.
- source_word: נֹדֵד
  choice: dem Flüchtenden
  rationale: Das Partizip bezeichnet im Zusammenhang jemanden, der auf der Flucht ist. „Flüchtender“ bewahrt zudem die partizipiale, noch nicht statisch gewordene Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Begegnungsbewegung der beiden Halbverse wird durch „entgegen“ beziehungsweise „entgegengehen“ bewahrt; der leicht gehobene Anrederhythmus entspricht dem prophetischen Kontext.
