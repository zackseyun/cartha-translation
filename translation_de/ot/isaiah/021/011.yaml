  text: מַשָּׂ֖א דּוּמָ֑ה אֵלַ/י֙ קֹרֵ֣א מִ/שֵּׂעִ֔יר שֹׁמֵר֙ מַה מִ/לַּ֔יְלָה שֹׁמֵ֖ר מַה מִ/לֵּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: de
  text: 'Ein Ausspruch über Duma[a]: Aus Seïr ruft mir jemand zu: »Wächter, wie weit ist die Nacht? Wächter, wie weit ist die Nacht?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Duma kann zugleich an das hebräische Wort für »Schweigen« anklingen. Wegen der Erwähnung Seïrs wird Duma hier oft mit Edom in Verbindung gebracht.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Wie steht es um die Nacht?« Die hebräische Wendung fragt nach dem Stand oder Fortschritt der Nacht.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Verkündigung. »Ausspruch« ist im modernen Deutschen verständlich und vermeidet die irreführend konkrete Wiedergabe »Last«.
- source_word: דּוּמָה
  choice: Duma
  rationale: Die Form wird in der Überschrift als Eigenname verstanden und entsprechend transliteriert. Ein möglicher Anklang an das hebräische Wort für »Schweigen« wird nicht in den Haupttext eingetragen, sondern in der Fußnote bewahrt.
- source_word: אֵלַי קֹרֵא
  choice: ruft mir jemand zu
  rationale: Das maskuline Partizip hat kein ausdrücklich genanntes Subjekt. »Jemand« erhält diese Unbestimmtheit; »mir … zu« gibt die Richtung des Rufes idiomatisch wieder.
- source_word: מִשֵּׂעִיר
  choice: Aus Seïr
  rationale: Der Eigenname wird transliteriert; die Präposition kennzeichnet Seïr als Herkunftsort des Rufes.
- source_word: שֹׁמֵר
  choice: Wächter
  rationale: Das Wort ist hier eine direkte Anrede an denjenigen, der Nachtwache hält. »Wächter« passt zum Bild und bewahrt die markante Wiederholung.
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: wie weit ist die Nacht?
  rationale: Die idiomatische Frage zielt wahrscheinlich auf Stand oder Fortschritt der Nacht. Die deutsche Formulierung ist knapp, poetisch und verständlich; beide hebräischen Varianten werden gleich wiedergegeben, um die rhetorische Wiederholung zu erhalten.
theological_decisions:
- issue: Identität und Bedeutung von דּוּמָה
  choice: Duma als Eigenname im Haupttext
  alternative: »Schweigen« als Bedeutungsanklang oder ein indirekter Hinweis auf Edom
  rationale: Die Form einer prophetischen Überschrift spricht für einen Orts- oder Volksnamen, während Seïr einen edomitischen Zusammenhang nahelegt. Die Transliteration legt die genaue historische Identifikation nicht fest; die Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetisch-poetischer Form. Die Wiederholung und die unbestimmte Identität des Rufenden bleiben erhalten. Der Fußnotenmarker steht nach dem gesamten Ruf, da die Anmerkung sowohl Duma als auch die wiederholte Nachtfrage erläutert.
