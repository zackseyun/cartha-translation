base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/007.yaml
  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: de
  text: 'Und er sah einen Reitertrupp[b]: ein Paar Reiter, einen Trupp Esel, einen Trupp Kamele; und er horchte sehr aufmerksam hin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „Aufmerksamkeit, große Aufmerksamkeit“ oder „er horchte mit viel Aufmerksamkeit hin“. Die Wiederholung betont das besonders sorgfältige Hinhören.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann je nach Kontext einen Wagen, einen Wagenverband oder einen berittenen Trupp bezeichnen. Bei den folgenden Eseln und Kamelen ist auch die genaue Beziehung der Tiere zum Trupp nicht eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Und er sah
  rationale: Das Qal Perfekt 3. Person Singular mit וְ wird als fortlaufender Bericht wiedergegeben; „Und“ bewahrt die hebräische Koordination, ohne eine zusätzliche zeitliche Deutung einzutragen.
- source_word: רֶכֶב
  choice: Reiterzug / Zug von …reitern
  rationale: רֶכֶב kann Wagen, Wagenverband oder einen berittenen Verband bezeichnen. Da im unmittelbaren Zusammenhang Pferdereiter, Esel und Kamele genannt werden, bezeichnet „Reiterzug“ hier plausibel eine berittene Gruppe und vermeidet die sachlich fragliche Vorstellung von durch Esel oder Kamele gezogenen Streitwagen.
- source_word: צֶמֶד פָּרָשִׁים
  choice: ein Paar Pferdereiter
  rationale: צֶמֶד bedeutet „Paar“ oder „Gespann“, פָּרָשִׁים bezeichnet Reiter beziehungsweise Pferdeleute. Die Wiedergabe hält die Paarstruktur ausdrücklich fest.
- source_word: רֶכֶב חֲמוֹר
  choice: einen Zug von Eselreitern
  rationale: Die Konstruktverbindung wird im parallelen Zusammenhang als berittener Verband auf Eseln verstanden. Die Formulierung ist im Deutschen klar und wahrt zugleich den kollektiven Sinn von רֶכֶב.
- source_word: רֶכֶב גָּמָל
  choice: einen Zug von Kamelreitern
  rationale: Parallel zu רֶכֶב חֲמוֹר bezeichnet die Wendung einen berittenen Verband auf Kamelen.
- source_word: וְהִקְשִׁיב
  choice: Da lauschte er aufmerksam
  rationale: Der Hifil von קשׁב drückt bewusstes, konzentriertes Hinhören aus. „lauschte“ bewahrt den akustischen Bezug und „aufmerksam“ die intensive Ausrichtung.
- source_word: קֶשֶׁב רַב קָשֶׁב
  choice: mit größter Aufmerksamkeit
  rationale: Die emphatische Wiederholung von קֶשֶׁב und die Verstärkung durch רַב werden in natürlichem Deutsch intensiv wiedergegeben; die auffällige hebräische Formulierung wird in der Fußnote sichtbar gemacht.
theological_decisions:
- issue: Mehrdeutigkeit von רֶכֶב
  choice: berittener Zug beziehungsweise Reiterverband
  alternative: Streitwagen beziehungsweise Wagenverband
  rationale: Der Kontext mit Eseln und Kamelen spricht eher für berittene Gruppen; die lexikalische Mehrdeutigkeit wird jedoch nicht als theologische Aussage behandelt oder dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den Sammelbegriff und die folgenden Gruppen. Die emphatische Wiederholung beim Lauschen bleibt durch „aufmerksam, mit größter Aufmerksamkeit“ spürbar, ohne im Deutschen unverständlich zu wirken.
