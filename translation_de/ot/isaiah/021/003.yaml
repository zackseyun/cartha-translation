  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֗ן מָלְא֤וּ מָתְנַ/י֙ חַלְחָלָ֔ה צִירִ֣ים אֲחָז֔וּ/נִי כְּ/צִירֵ֖י יֽוֹלֵדָ֑ה נַעֲוֵ֣יתִי מִ/שְּׁמֹ֔עַ נִבְהַ֖לְתִּי מֵ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: de
  text: Darum sind meine Lenden von Qual erfüllt[a]; Wehen haben mich gepackt wie die Wehen einer Gebärenden. Ich krümme mich vor dem, was ich höre[b]; ich bin entsetzt über das, was ich sehe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Zittern erfüllt“. Das hebräische Wort bezeichnet heftiges körperliches Beben oder sich windende Not.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich bin verdreht“ beziehungsweise „niedergebeugt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: meine Lenden sind … erfüllt
  rationale: מָתְנַיִם bezeichnet konkret die Lenden beziehungsweise Hüftgegend. „Lenden“ bewahrt das körperliche Bild und passt zum gehobenen, aber verständlichen Register.
- source_word: חַלְחָלָה
  choice: Qual
  rationale: Das Substantiv bezeichnet heftiges Zittern, Beben oder sich windende Not. „Qual“ gibt im Zusammenhang mit den folgenden Geburtswehen die leidvolle Gesamterfahrung natürlich wieder; die körperliche Nuance wird in einer Fußnote erhalten.
- source_word: צִירִים
  choice: Wehen
  rationale: Das Wort kann Schmerzen oder Krämpfe, besonders Geburtswehen, bezeichnen. Weil der folgende Vergleich ausdrücklich eine Gebärende nennt, ist „Wehen“ prägnant und bildgetreu.
- source_word: אֲחָזוּנִי
  choice: haben mich gepackt
  rationale: Das Verb beschreibt ein kraftvolles Ergreifen. „Gepackt“ vermittelt, dass die Schmerzen den Sprecher plötzlich und überwältigend erfassen.
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: wie die Wehen einer Gebärenden
  rationale: Die Formulierung erhält den ausdrücklichen Vergleich und die Wiederholung von צִירִים. „Gebärende“ ist knapp, würdig und im modernen Standarddeutsch verständlich.
- source_word: נַעֲוֵיתִי
  choice: ich krümme mich
  rationale: Die Niphalform kann ein Gekrümmt-, Verdreht- oder Niedergebeugtsein ausdrücken. „Ich krümme mich“ gibt die körperliche Reaktion auf das Gehörte natürlich wieder, ohne sie unnötig genauer festzulegen.
- source_word: מִשְּׁמֹעַ
  choice: vor dem, was ich höre
  rationale: Die Präposition מן mit Infinitiv wird hier kausal verstanden. Die deutsche Wendung macht den Auslöser klar und wahrt zugleich die Parallele zur folgenden Aussage.
- source_word: נִבְהַלְתִּי
  choice: ich bin entsetzt
  rationale: Das Verb bezeichnet erschrockenes, verstörtes oder bestürztes Sein. „Entsetzt“ entspricht der Intensität des Verses, ohne zwingend die stärkere Bedeutung „zu Tode erschrocken“ oder „in Panik“ einzutragen.
- source_word: מֵרְאוֹת
  choice: über das, was ich sehe
  rationale: Die Formulierung gibt den kausalen Sinn wieder und bildet mit „vor dem, was ich höre“ ein natürliches deutsches Parallelpaar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter körperlicher Bildsprache. Die parallelen Ursachen „was ich höre“ und „was ich sehe“ werden idiomatisch ausgedrückt; die lexikalische Spannweite der seltenen beziehungsweise mehrdeutigen Ausdrücke bleibt in den Fußnoten sichtbar.
