base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: de
  text: Ausspruch über die Meereswüste:[a] Wie Wirbelstürme im Negev[b] dahinfegen, so kommt es[c] aus der Wüste, aus einem furchterregenden Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Wüste am Meer“. Die hebräische Wendung ist ungewöhnlich und kann als poetische geografische Bezeichnung dienen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Süden“. „Negev“ kann die südliche Wüstenregion oder allgemein den Süden bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das Subjekt von „kommt“ bleibt im Hebräischen unausgesprochen; gemeint sein kann das zuvor mit Wirbelstürmen verglichene Geschehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet מַשָּׂא eine gewichtige prophetische Botschaft, häufig eine Gerichtsankündigung. „Ausspruch“ ist im Deutschen natürlich und vermeidet eine vorschnelle Festlegung auf die wörtliche Bedeutung „Last“.
- source_word: מִדְבַּר יָם
  choice: Meereswüste
  rationale: Die knappe Zusammensetzung bewahrt die auffällige hebräische Constructus-Verbindung und lässt offen, ob eine poetische Landschaftsbezeichnung oder ein geografischer Name gemeint ist.
- source_word: כְּסוּפוֹת
  choice: wie Wirbelstürme
  rationale: סוּפוֹת bezeichnet heftige Sturmwinde; „Wirbelstürme“ gibt die Gewalt und Anschaulichkeit des Vergleichs wieder.
- source_word: בַּנֶּגֶב
  choice: im Negev
  rationale: נֶגֶב kann sowohl die südliche Wüstenregion als auch allgemein den Süden bezeichnen. „Negev“ erhält hier die geografische Färbung.
- source_word: לַחֲלֹף
  choice: dahinfegen
  rationale: Der Infinitiv beschreibt das rasche Vorüberziehen der Stürme. „dahinfegen“ verbindet die Bewegung natürlich mit dem Sturmvergleich.
- source_word: מִמִּדְבָּר בָּא
  choice: so kommt es aus der Wüste
  rationale: Das hebräische Verb steht im Singular, nennt aber kein ausdrückliches Subjekt. Das neutrale „es“ erhält diese Unbestimmtheit und kann sich auf das sturmähnliche Geschehen beziehen.
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: aus einem furchterregenden Land
  rationale: נוֹרָאָה bezeichnet hier etwas Schrecken oder Furcht Einflößendes. „furchterregend“ gibt diese Wirkung klar wieder, ohne die Art der Gefahr näher festzulegen.
theological_decisions:
- issue: Deutung der rätselhaften Überschrift und geografischen Bezeichnung
  choice: Die poetische Formulierung „Meereswüste“ bleibt im Haupttext erhalten.
  alternative: Die Wendung als „Wüste am Meer“ wiederzugeben oder ausdrücklich auf Babylon zu beziehen.
  rationale: Der Vers selbst identifiziert die bezeichnete Größe nicht eindeutig. Die Übersetzung soll die Bildsprache und ihre Spannung bewahren, statt eine traditionelle geografische Deutung in den Text einzutragen.
- issue: Unausgesprochenes Subjekt von בָּא
  choice: Das unbestimmte „es“ verwenden.
  alternative: Ein persönliches Subjekt wie „er“ oder ein ergänztes Substantiv wie „der Feind“ einsetzen.
  rationale: Im Hebräischen fehlt ein ausdrückliches Subjekt. Eine persönliche oder militärische Identifizierung würde die Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Prägnanz. Die ungewöhnliche Überschrift wird bewusst nicht geglättet; „dahinfegen“ hält das kraftvolle Bewegungsbild lebendig.
