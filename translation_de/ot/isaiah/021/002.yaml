base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: de
  text: 'Eine schwere Vision wurde mir verkündet: Der Verräter verrät[a], und der Plünderer plündert. Elam, zieh hinauf! Medien, belagere! Ich habe all ihrem Seufzen ein Ende gemacht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der treulos Handelnde handelt treulos, und der Verwüster verwüstet.“'
    reason: Die hebräischen Wortstammwiederholungen können sowohl Treulosigkeit beziehungsweise Verrat als auch Plündern beziehungsweise Verwüsten bezeichnen.
  - marker: b
    text: Wörtlich steht im Hebräischen „all ihr Seufzen“. Der feminine Bezug wird in diesem Vers nicht ausdrücklich genannt.
    reason: Die Mehrdeutigkeit des femininen Suffixes soll erhalten bleiben.
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: eine harte Vision
  rationale: „Vision“ gibt die prophetische Schau wieder; „hart“ bewahrt die Schwere und Unerbittlichkeit von קָשָׁה, ohne sie näher auszudeuten.
- source_word: הֻגַּד לִי
  choice: wurde mir verkündet
  rationale: Die passive Form bezeichnet eine dem Propheten bekannt gemachte Botschaft. „Verkündet“ wahrt den prophetischen Ton in verständlichem Deutsch.
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: der Treulose handelt treulos
  rationale: Die Wiedergabe erhält die Wiederholung desselben Wortstamms und bezeichnet sowohl die handelnde Person als auch ihre fortgesetzte treulose Handlung.
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: und der Verwüster verwüstet
  rationale: שׁדד kann Plündern oder gewaltsames Verwüsten bezeichnen. „Verwüster verwüstet“ bewahrt die Stammwiederholung und passt zum militärischen Zusammenhang.
- source_word: עֲלִי עֵילָם
  choice: Elam, zieh herauf!
  rationale: Der feminine Singular des Imperativs richtet sich an Elam als Kollektiv oder Land. „Heraufziehen“ wahrt das militärische Bild des hebräischen Verbs.
- source_word: צוּרִי מָדַי
  choice: Medien, belagere!
  rationale: צור bezeichnet hier das Einschließen beziehungsweise Belagern einer Stadt. Die deutsche Befehlsform gibt den femininen Singular des Hebräischen knapp wieder.
- source_word: כָּל אַנְחָתָהּ
  choice: all ihrem Seufzen
  rationale: אַנְחָה bezeichnet leidvolles Seufzen oder Stöhnen. Das Pronomen „ihrem“ lässt den im Vers nicht ausdrücklich genannten Bezug der femininen Endung offen.
- source_word: הִשְׁבַּתִּי
  choice: habe ich ein Ende gemacht
  rationale: Der Hifil von שבת bedeutet, etwas aufhören zu lassen. Die Formulierung gibt die kausative Bedeutung idiomatisch wieder.
theological_decisions:
- issue: Bezug der femininen Endung in כָּל אַנְחָתָהּ
  choice: Der Bezug bleibt mit „ihrem“ unbestimmt.
  alternative: Das Seufzen ausdrücklich Babylon, dem Land oder den von Babylon Unterdrückten zuordnen.
  rationale: Der unmittelbare Vers nennt den femininen Bezug nicht ausdrücklich. Eine nähere Bestimmung würde eine Auslegung in den Haupttext eintragen.
- issue: Sprecher des abschließenden Satzes
  choice: Die erste Person „ich“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Sprecher im Text ausdrücklich als Gott oder als den Propheten bestimmen.
  rationale: Die Verbform nennt nur die erste Person Singular; der Vers selbst setzt keinen ausdrücklichen Sprechernamen hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten hebräischen Wortstämme werden durch „Treulose/treulos“ und „Verwüster/verwüstet“ hörbar gemacht. Die knappen Befehle bewahren den drängenden prophetisch-militärischen Ton.
