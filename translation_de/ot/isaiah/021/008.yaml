  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: de
  text: 'Da rief er: »Ein Löwe![a] Auf dem Wachtturm, mein Herr, stehe ich unablässig bei Tag, und auf meinem Wachposten bin ich alle Nächte hindurch stationiert.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Löwe!« Der hebräische Wortlaut ist an dieser Stelle schwierig. Möglich ist auch die Deutung: »Wie ein Löwe!«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »jede Nacht« beziehungsweise »die ganze Nacht hindurch«. Im Hebräischen steht der Plural: »alle Nächte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief er
  rationale: Das Qal-Wayyiqtol von קרא bezeichnet hier ein lautes Rufen; »Da« gibt die erzählerische Abfolge natürlich wieder.
- source_word: אַרְיֵה
  choice: Ein Löwe!
  rationale: Das masoretische Hebräisch hat unvermittelt das Substantiv »Löwe«. Die wörtliche, bewusst schwierige Formulierung bleibt im Haupttext erhalten; eine mögliche vergleichende Deutung steht in der Fußnote.
- source_word: עַל מִצְפֶּה
  choice: Auf dem Wachtturm
  rationale: מִצְפֶּה bezeichnet einen erhöhten Beobachtungs- oder Wachplatz; »Wachtturm« ist im Zusammenhang klar und idiomatisch.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die Form mit Suffix der ersten Person bezeichnet hier die angeredete übergeordnete Person, nicht den Gottesnamen.
- source_word: עֹמֵד תָּמִיד יוֹמָם
  choice: stehe ich unablässig bei Tag
  rationale: Das Partizip drückt anhaltendes Stehen aus; תָּמִיד und יוֹמָם werden als »unablässig« und »bei Tag« wiedergegeben.
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: und auf meinem Wachposten
  rationale: מִשְׁמֶרֶת kann Wachdienst, Wache oder Wachposten bezeichnen; die örtliche Wendung passt zur Präposition עַל und zum Bild des Wächters.
- source_word: אָנֹכִי נִצָּב
  choice: bin ich … aufgestellt
  rationale: Das selbstständige Pronomen setzt Nachdruck auf »ich«; das Nifal-Partizip von נצב bezeichnet das Aufgestellt- oder Stationiertsein.
- source_word: כָּל הַלֵּילוֹת
  choice: alle Nächte hindurch
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Plural und vermittelt zugleich fortgesetzte nächtliche Wache.
