  text: מַשָּׂ֖א בַּ/עְרָ֑ב בַּ/יַּ֤עַר בַּ/עְרַב֙ תָּלִ֔ינוּ אֹֽרְח֖וֹת דְּדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: de
  text: 'Ausspruch über Arabien:[a]


    Im Waldland Arabiens[b] werdet ihr übernachten, ihr Karawanen der Dedaniter.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lastspruch über Arabien“. Das hebräische Wort kann in prophetischen Überschriften einen Ausspruch, eine Verkündigung oder eine Last bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Waldland“ kann hier auch Gehölz, Dickicht oder Buschland meinen. Das hebräische Wort bezeichnet gewöhnlich Wald oder bewaldetes Land.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort bedeutet wörtlich auch „Wege“ oder „Pfade“, bezeichnet hier aber wahrscheinlich Reisegesellschaften, also Karawanen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine göttliche Verkündigung. „Ausspruch“ gibt diese Funktion in würdigem, heutigem Deutsch wieder, ohne die mögliche Nuance „Last“ zum alleinigen Sinn zu machen.
- source_word: בַּעְרָב
  choice: über Arabien
  rationale: Nach מַשָּׂא kennzeichnet die Präposition am natürlichsten den Gegenstand des Ausspruchs. „Über“ bewahrt dabei mehr Offenheit als das ausdrücklich feindselige „gegen“.
- source_word: בַּיַּעַר
  choice: im Waldland
  rationale: יַעַר bezeichnet grundsätzlich Wald oder Gehölz. „Waldland“ bewahrt das Bild, lässt im arabischen Umfeld aber auch Busch- oder Gehölzland zu.
- source_word: בַּעְרַב
  choice: in Arabien
  rationale: Die Punktierung und die Wiederaufnahme des Ortsnamens aus der Überschrift sprechen für die geografische Deutung und nicht für „am Abend“.
- source_word: תָּלִינוּ
  choice: müsst ihr übernachten
  rationale: Das Verb לין bedeutet „übernachten“. Die deutsche Konstruktion bringt die an die Reisenden gerichtete prophetische Ankündigung natürlich zum Ausdruck, ohne eine freiwillige Rast vorauszusetzen.
- source_word: אֹרְחוֹת
  choice: Karawanen
  rationale: Das Wort kann wörtlich „Wege/Pfade“ bedeuten, bezeichnet hier aber in Verbindung mit den Dedanitern metonymisch Reisegesellschaften; im arabischen Handelskontext ist „Karawanen“ treffend.
- source_word: דְּדָנִים
  choice: der Dedaniter
  rationale: Die Form bezeichnet die zu Dedan gehörige Volksgruppe. Zusammen mit „Karawanen“ ergibt sich die Anrede „ihr Karawanen der Dedaniter“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Überschrift und die direkte Anrede bleiben erhalten; „Waldland“ vermeidet im arabischen Kontext das möglicherweise missverständliche Bild eines dichten mitteleuropäischen Waldes, ohne die hebräische Bildsprache aufzugeben.
