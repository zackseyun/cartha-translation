  text: יְשֻׂשׂ֥וּ/ם מִדְבָּ֖ר וְ/צִיָּ֑ה וְ/תָגֵ֧ל עֲרָבָ֛ה וְ/תִפְרַ֖ח כַּ/חֲבַצָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/001.yaml
  text: The wilderness and the dry land will rejoice[a]; the desert plain will be glad and blossom like the crocus.
translation:
  language: de
  text: Die Wüste und das dürre Land werden sich freuen; die Steppe wird jubeln und blühen wie ein Krokus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Lilie“, „Affodill“ oder eine andere Zwiebelblume; welche Pflanze mit dem hebräischen Wort חֲבַצָּלֶת genau gemeint ist, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׂשׂוּם
  choice: werden sich freuen
  rationale: Das Verb שׂושׂ bezeichnet lebhafte Freude. Die zukunftsbezogene Wiedergabe passt zum prophetischen Zusammenhang; das ungewöhnliche auslautende ם wird nicht durch eine syntaktisch gezwungene Objektkonstruktion nachgebildet.
- source_word: מִדְבָּר
  choice: Wüste
  rationale: Bezeichnet hier unbebautes, ödes Land. „Wüste“ ist im Deutschen knapp, geläufig und bildet mit „dürres Land“ ein natürliches poetisches Paar.
- source_word: צִיָּה
  choice: dürres Land
  rationale: Bewahrt den besonderen Akzent auf Trockenheit und ergänzt „Wüste“, ohne dieselbe Bezeichnung zu wiederholen.
- source_word: תָגֵל
  choice: wird jubeln
  rationale: גיל kann freudiges Jauchzen oder Jubeln ausdrücken. „Jubeln“ erhält die Intensität und variiert natürlich gegenüber „sich freuen“.
- source_word: עֲרָבָה
  choice: Steppe
  rationale: Im Zusammenhang ist die allgemeine Bedeutung einer trockenen, weithin offenen Landschaft wahrscheinlicher als der Eigenname „Araba“. „Steppe“ unterscheidet sie sprachlich klar von מִדְבָּר.
- source_word: תִפְרַח
  choice: blühen
  rationale: פרח bezeichnet das Hervorsprießen beziehungsweise Blühen einer Pflanze; „blühen“ ist im Deutschen für dieses poetische Bild natürlich.
- source_word: חֲבַצָּלֶת
  choice: Krokus
  rationale: Die genaue Pflanzenart ist unsicher. „Krokus“ ist eine verbreitete und anschauliche Wiedergabe; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions: []
