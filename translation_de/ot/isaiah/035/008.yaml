revisions:
- from: Dort wird es eine gebahnte Straße und einen Weg geben; er wird »der heilige Weg« genannt werden. Kein Unreiner wird ihn betreten. Doch er wird für sie da sein.[a] Wer auf diesem Weg unterwegs ist – selbst wenn es Toren sind –, wird sich nicht verirren.[b]
  to: Dort wird es eine gebahnte Straße geben, einen Weg; er wird »der heilige Weg« genannt werden. Kein Unreiner wird ihn betreten. Doch er ist für sie bestimmt.[a] Wer diesen Weg geht, wird sich nicht verirren; auch Toren nicht.[b]
  rationale: Die Revision ersetzt die missverständliche idiomatische Deutung »für sie da sein« durch »für sie bestimmt«, das die kontextuell bevorzugte Lesart wahrt, ohne die in der Fußnote erhaltene syntaktische Mehrdeutigkeit aufzuheben. Der Schlusssatz wird zugleich sprachlich geglättet und behält die Aussage bei, dass selbst Toren auf diesem Weg nicht in die Irre gehen.
