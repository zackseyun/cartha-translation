  - severity: low
    issue: Die Wendung »selbst wenn es Toren sind« ist unnötig unklar.
    rationale: Das Pronomen »es« hat keinen eindeutigen grammatischen Bezug. »Auch Toren werden nicht in die Irre gehen« formuliert die Einschub-Aussage natürlich und erhält ihren Nachdruck.
