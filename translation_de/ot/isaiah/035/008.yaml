source:
  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: de
  text: Dort wird es eine gebahnte Straße geben, einen Weg; er wird »der heilige Weg« genannt werden. Kein Unreiner wird ihn betreten. Doch er ist für sie bestimmt.[a] Wer diesen Weg geht, wird sich nicht verirren; auch Toren nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Möglich sind auch: »Und er wird bei ihnen sein« oder: »Er wird ihnen gehören.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »wird nicht umherirren« beziehungsweise »wird nicht abirren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: gebahnte Straße
  rationale: Das Wort bezeichnet eine aufgeschüttete oder eigens angelegte Straße. »Gebahnte Straße« bewahrt das Bild eines vorbereiteten Verkehrswegs und ist im heutigen Deutsch verständlicher als »Hochstraße«.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: »Weg« eignet sich sowohl für den konkreten Verkehrsweg als auch für die weitergehende Bedeutung eines von Gott bestimmten Weges. In der ersten Wortpaarung verhindert »Straße und Weg« eine unnötig schwerfällige Wiederholung.
- source_word: הַקֹּדֶשׁ
  choice: heilig
  rationale: Die Verbindung bezeichnet einen Gott geweihten Weg. »Der heilige Weg« gibt dies natürlich und würdevoll wieder.
- source_word: יִקָּרֵא לָהּ
  choice: er wird … genannt werden
  rationale: Der Niphal wird als passive Benennungsformel wiedergegeben; das Pronomen bezieht sich auf den Weg.
- source_word: טָמֵא
  choice: Unreiner
  rationale: Das substantivierte Adjektiv bleibt bewusst weit und kann sowohl kultische als auch sittliche Unreinheit anklingen lassen.
- source_word: יַעַבְרֶנּוּ
  choice: wird ihn betreten
  rationale: Die Form bezeichnet das Hinüber- oder Entlanggehen auf dem Weg. »Betreten« drückt im Kontext klar aus, dass Unreinen der Zugang verwehrt ist.
- source_word: וְהוּא לָמוֹ
  choice: Doch er wird für sie da sein
  rationale: Die schwierige, knappe Wendung wird so verstanden, dass das Pronomen auf den Weg zurückweist und dieser für die gemeinte Gruppe bestimmt ist. Die echte syntaktische Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: Wer auf diesem Weg unterwegs ist
  rationale: Die partizipiale Wendung bezeichnet allgemein die Reisenden auf diesem Weg. Die Formulierung ist im modernen Deutsch natürlich und erhält das Bild des Unterwegsseins.
- source_word: אֱוִילִים
  choice: Toren
  rationale: »Toren« bezeichnet Menschen, deren Torheit nicht bloß mangelnde Intelligenz, sondern fehlende Einsicht einschließt, und passt zum würdevollen prophetischen Sprachstil.
- source_word: לֹא יִתְעוּ
  choice: wird sich nicht verirren
  rationale: תעה kann sowohl ein konkretes Umherirren als auch ein übertragenes Abirren bezeichnen. »Sich verirren« lässt beide Ebenen anklingen.
theological_decisions:
- issue: Art der Unreinheit in טָמֵא
  choice: Die umfassende Bezeichnung »Unreiner« wird beibehalten.
  alternative: »rituell Unreiner« oder »sittlich Unreiner«
  rationale: Der prophetische Kontext kann kultische und ethische Unreinheit zugleich anklingen lassen. Die Übersetzung grenzt die Aussage daher nicht auf nur eine Dimension ein.
- issue: Deutung der schwierigen Wendung וְהוּא לָמוֹ
  choice: 'Das Pronomen wird auf den Weg bezogen: »Doch er wird für sie da sein.«'
  alternative: »Und er wird bei ihnen sein« oder »er wird ihnen gehören«
  rationale: 'Der Rückbezug auf den Weg ergibt im Zusammenhang einen verständlichen Gegensatz: Unreine betreten ihn nicht, für die angesprochene Gruppe aber ist er bestimmt. Wegen der ungewöhnlich knappen Syntax werden andere mögliche Deutungen ausdrücklich in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Wegmetaphorik. »Gebahnte Straße« vermeidet die heute vorwiegend technische Bedeutung von »Hochstraße«; »Toren« erhält den prägnanten Weisheitston des hebräischen Ausdrucks.
