source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשֻׁב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂ֔יגוּ וְ/נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: de
  text: Und die von Jahwe Erlösten[a] werden zurückkehren und unter Jubel nach Zion kommen. Ewige Freude wird auf ihren Häuptern sein. Jubel und Freude werden sie einholen, und Kummer und Seufzen werden fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von Jahwe Losgekauften“. Das hebräische Wort kann Menschen bezeichnen, die durch Erlösung oder Loskauf befreit worden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: die von Jahwe Erlösten
  rationale: Das passive Partizip von פדה bezeichnet Menschen, die erlöst beziehungsweise losgekauft wurden. „Erlösten“ ist im Deutschen natürlich und bewahrt den umfassenden Rettungssinn; die mögliche Lösegeldvorstellung wird in der Fußnote genannt.
- source_word: יְשֻׁבוּן
  choice: werden zurückkehren
  rationale: שוב bezeichnet hier die Rückkehr; das Futur gibt die angekündigte Bewegung klar wieder.
- source_word: וּבָאוּ צִיּוֹן
  choice: und … nach Zion kommen
  rationale: בוא kann „kommen“ oder „hineingehen“ bedeuten. „Nach Zion kommen“ ist idiomatisches Deutsch und entspricht der gerichteten Bewegung.
- source_word: בְּרִנָּה
  choice: unter Jubel
  rationale: רִנָּה bezeichnet einen hörbaren Freudenruf, der auch Gesang einschließen kann. „Unter Jubel“ hält diese Bedeutungsbreite offen.
- source_word: וְשִׂמְחַת עוֹלָם
  choice: Ewige Freude
  rationale: Die Verbindung bedeutet wörtlich Freude von unbegrenzter Dauer; „ewige Freude“ ist knapp, würdig und poetisch.
- source_word: עַל רֹאשָׁם
  choice: auf ihren Häuptern
  rationale: 'Die konkrete Bildsprache des Hebräischen bleibt erhalten: Die Freude liegt gleichsam sichtbar wie ein Schmuck oder eine Krone auf ihren Köpfen.'
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Jubel und Freude
  rationale: Die beiden nahe verwandten Begriffe werden als Wortpaar bewahrt. „Jubel“ bringt bei שָׂשׂוֹן die lebhafte, feiernde Freude zum Ausdruck.
- source_word: יַשִּׂיגוּ
  choice: werden sie einholen
  rationale: נשׂג kann „erreichen“ oder „einholen“ bedeuten. Mit Jubel und Freude als Subjekt bewahrt „einholen“ die eindrückliche Personifikation.
- source_word: וְנָסוּ
  choice: werden fliehen
  rationale: נוס bedeutet „fliehen“. Die direkte Wiedergabe erhält die Personifikation von Kummer und Seufzen.
- source_word: יָגוֹן וַאֲנָחָה
  choice: Kummer und Seufzen
  rationale: יָגוֹן bezeichnet Kummer oder Gram, אֲנָחָה das Seufzen beziehungsweise Stöhnen. Die deutsche Paarung gibt sowohl die innere Not als auch ihren hörbaren Ausdruck wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form von „Yahweh“.
- issue: Bedeutungsumfang von פְדוּיֵי
  choice: Erlösten
  alternative: Losgekauften
  rationale: Beide Wiedergaben sind lexikalisch möglich. „Erlösten“ lässt den umfassenden Rettungssinn stehen, ohne das Bild auf eine ausdrücklich genannte Zahlung zu verengen; die Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. „Häuptern“ ist bewusst leicht gehoben, um das konkrete hebräische Bild natürlich zu erhalten; Satzrhythmus und die Personifikationen von Freude, Kummer und Seufzen bleiben gewahrt.
