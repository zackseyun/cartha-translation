  verdict: revise
  source_fidelity: 'Die erste Bildhälfte gibt den landschaftlichen Parallelismus angemessen wieder. Die Wendung „wird Gras zu Schilf und Papyrus“ ist jedoch keine sichere Wiedergabe von חָצִיר לְקָנֶה וָגֹמֶא: Sie macht aus Gras ausdrücklich eine Verwandlung in Schilf und Papyrus, während die knappe hebräische Konstruktion auch eine Aufzählung neu aufkommender Feuchtgebietsvegetation zulässt. Die Hauptfassung sollte diese Deutung nicht festlegen. Auch die Zuordnung von רִבְצָהּ zu den pluralischen Schakalen wird im Entwurf stärker entschieden, als es die Form nahelegt.'
  naturalness: „Die flirrende Wüstenhitze wird zum Teich“ und „das dürre Land zu Wasserquellen“ sind modernes, poetisch angemessenes Deutsch. „Wo Schakale hausen und lagern“ ist zwar verständlich, glättet aber die verdichtete Ortsbestimmung. „In der Behausung der Schakale, an ihrem Lagerplatz“ bewahrt sie klarer und bleibt natürlich.
  terminology: „Schakale“, „Teich“ und „Wasserquellen“ sind sachgerecht. Für גֹמֶא ist „Binsen“ als allgemeine Bezeichnung vorzuziehen; „Papyrus“ bleibt eine berechtigte lexikalische Alternative in der Fußnote.
