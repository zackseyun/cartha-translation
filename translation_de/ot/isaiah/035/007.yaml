base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: de
  text: Die flirrende Wüstenhitze wird zum Teich[a] und das dürre Land zu Wasserquellen. In der Behausung der Schakale, an ihrem Lagerplatz,[b] wachsen Gras, Schilf und Binsen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Luftspiegelung wird zum Teich.« Das hebräische Wort kann sengende Hitze oder die flimmernde Erscheinung über heißem Wüstenboden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »In der Behausung der Schakale, ihrem Lagerplatz«. Die gedrängte hebräische Satzfügung lässt offen, wie »Behausung«, »Lagerplatz« und die folgende Vegetation genauer zueinander stehen.'
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: Das mit »Binsen« wiedergegebene hebräische Wort kann auch »Papyrus« bedeuten. Die Schlusswendung kann außerdem so verstanden werden, dass Gras zu Schilf und Binsen wird.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: die flirrende Wüstenhitze
  rationale: שָׁרָב bezeichnet sengende Hitze beziehungsweise die dadurch flimmernde Wüstenerscheinung. Die Wiedergabe verbindet die konkrete Landschaft mit dem sichtbaren Hitzeflimmern, ohne den Ausdruck auf eine bloße Sinnestäuschung festzulegen.
- source_word: לַאֲגַם
  choice: zum Teich
  rationale: אֲגַם kann ein Wasserbecken, einen Teich oder ein sumpfiges Gewässer bezeichnen. »Teich« ist hier natürlich und lässt die genaue Gewässerart offen.
- source_word: צִמָּאוֹן
  choice: das dürre Land
  rationale: Das Substantiv kann »Durst« oder einen ausgedörrten Ort bezeichnen. Im landschaftlichen Parallelismus ist die örtliche Bedeutung gemeint; »dürres Land« klingt im Deutschen natürlicher als eine wörtliche Personifikation.
- source_word: לְמַבּוּעֵי מָיִם
  choice: zu Wasserquellen
  rationale: מַבּוּעַ bezeichnet eine hervorbrechende Quelle. Der Plural wird bewahrt und bildet den Gegenpol zum dürren Land.
- source_word: בִּנְוֵה תַנִּים
  choice: Wo Schakale hausen
  rationale: נָוֶה bezeichnet einen Wohn- oder Lagerplatz; תַנִּים meint im prophetischen Wüstenkontext Schakale. Die verbale Formulierung ist klares, gegenwärtiges Deutsch.
- source_word: רִבְצָהּ
  choice: und lagern
  rationale: Die Form gehört zu רבץ, »sich lagern, niederliegen«. Wegen der gedrängten hebräischen Syntax wird die Ortsangabe verbal wiedergegeben und auf die Schakale bezogen.
- source_word: חָצִיר לְקָנֶה וָגֹמֶא
  choice: wird Gras zu Schilf und Papyrus
  rationale: Das לְ kann eine resultierende Verwandlung kennzeichnen. So erscheint anstelle gewöhnlichen Grases typische Vegetation wasserreicher Standorte; die knappe Abfolge des Hebräischen bleibt erkennbar.
