  - severity: medium
    issue: „Wo Schakale hausen und lagern“ legt den Bezug von רִבְצָהּ auf die Schakale fest.
    rationale: Die feminine Singularsuffixform lässt sich auch auf den Wohn-/Lagerplatz beziehen. Eine nominale Wiedergabe im Haupttext und eine erläuternde Fußnote erhalten die Mehrdeutigkeit.
