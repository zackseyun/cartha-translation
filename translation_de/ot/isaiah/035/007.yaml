    rationale: Das Wort kann Papyrus bezeichnen, aber auch allgemeiner Binsen/Riedpflanzen. „Binsen“ ist im deutschen poetischen Kontext weit und natürlich; „Papyrus“ sollte als Alternative genannt werden.
