- from: Die flirrende Wüstenhitze wird zum Teich[a] und das dürre Land zu Wasserquellen. Wo Schakale hausen und lagern,[b] wird Gras zu Schilf und Papyrus.[c]
  to: Die flirrende Wüstenhitze wird zum Teich[a] und das dürre Land zu Wasserquellen. In der Behausung der Schakale, an ihrem Lagerplatz,[b] wachsen Gras, Schilf und Binsen.[c]
  rationale: Die Revision bewahrt die Bilder von Hitze, Dürre und wasserreicher Wiederherstellung, ohne die verdichtete Syntax der Schlusszeile zu einer eindeutigen Verwandlung von Gras in Schilf und Papyrus zu machen. Die Orts- und Lagerplatzbeziehung bleibt im Deutschen sichtbar und wird in der Fußnote als offen erläutert. Die Fußnotenanker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
