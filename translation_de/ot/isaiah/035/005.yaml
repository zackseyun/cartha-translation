id: ISA.35.5
reference: Isaiah 35:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֥ז תִּפָּקַ֖חְנָה עֵינֵ֣י עִוְרִ֑ים וְ/אָזְנֵ֥י חֵרְשִׁ֖ים תִּפָּתַֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/005.yaml
  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: de
  text: Dann werden die Augen der Blinden geöffnet und die Ohren der Gehörlosen aufgetan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: geöffnet.'
    reason: Die Wiedergabe „aufgetan“ entspricht bei Ohren natürlichem deutschem Sprachgebrauch; das hebräische Verb bedeutet grundsätzlich „öffnen“.
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb bezeichnet den folgenden Zeitpunkt innerhalb der prophetischen Heilsankündigung; „Dann“ ist knapp und natürlich.
- source_word: תִּפָּקַחְנָה
  choice: werden … geöffnet
  rationale: Das Nifal Imperfekt von פקח mit „Augen“ als Subjekt bezeichnet deren Öffnung. Die deutsche Passivform gibt Bild und Zukunftsbezug angemessen wieder.
- source_word: עֵינֵי עִוְרִים
  choice: die Augen der Blinden
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen idiomatisch mit bestimmtem Artikel wiedergegeben; das substantivierte Adjektiv bewahrt die knappe Parallelstruktur.
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: und die Ohren der Gehörlosen
  rationale: Die Formulierung entspricht der parallelen Konstruktion des ersten Halbverses und ist in modernem Standarddeutsch klar und würdig.
- source_word: תִּפָּתַחְנָה
  choice: werden … aufgetan
  rationale: Das Nifal Imperfekt von פתח bedeutet wörtlich „werden geöffnet“. Bei Ohren ist „aufgetan“ eine natürliche, bildhafte Wiedergabe, die zugleich den Unterschied zum Verb פקח im ersten Halbvers erkennen lässt.
theological_decisions:
- issue: Art der angekündigten Wiederherstellung
  choice: Konkrete körperliche Wiederherstellungssprache beibehalten, ohne sie ausschließlich körperlich oder ausschließlich geistlich auszulegen.
  alternative: Nur als wunderbare körperliche Heilung oder nur als Metapher geistlicher Wahrnehmung verstehen.
  rationale: Der hebräische Text spricht anschaulich von Augen und Ohren, entscheidet aber in diesem Vers allein nicht über die volle Reichweite des prophetischen Bildes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Klang. Die parallele Satzstruktur bleibt erhalten; „aufgetan“ vermeidet eine schwerfällige Wiederholung und wahrt zugleich den lexikalischen Unterschied der beiden hebräischen Verben.
