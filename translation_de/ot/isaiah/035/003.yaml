lexical_decisions:
- source_word: חַזְּקוּ
  choice: Stärkt
  rationale: Der Piel-Imperativ Plural ist hier transitiv und fordert dazu auf, den nachfolgenden Händen Kraft zu geben.
- source_word: יָדַיִם רָפוֹת
  choice: die kraftlosen Hände
  rationale: Die konkrete Körpermetapher bleibt erhalten; „kraftlos“ gibt רָפוֹת in natürlichem modernem Deutsch als Mangel an Stärke wieder.
- source_word: וּבִרְכַּיִם כֹּשְׁלוֹת
  choice: und die wankenden Knie
  rationale: Das Partizip von כשל beschreibt Knie, die wanken, straucheln oder nachzugeben drohen; „wankend“ bewahrt das lebendige Bild.
- source_word: אַמֵּצוּ
  choice: festigt
  rationale: Der Piel-Imperativ bezeichnet ein Stark- oder Festmachen. „Festigt“ wahrt die poetische Variation gegenüber חַזְּקוּ und klingt im Deutschen natürlich.
