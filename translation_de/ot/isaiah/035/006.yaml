  text: אָ֣ז יְדַלֵּ֤ג כָּֽ/אַיָּל֙ פִּסֵּ֔חַ וְ/תָרֹ֖ן לְשׁ֣וֹן אִלֵּ֑ם כִּֽי נִבְקְע֤וּ בַ/מִּדְבָּר֙ מַ֔יִם וּ/נְחָלִ֖ים בָּ/עֲרָבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: de
  text: Dann wird der Lahme springen wie ein Hirsch, und die Zunge des Stummen wird vor Freude jubeln[a]; denn in der Wildnis brechen Wasser hervor und Bäche in der Steppe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird laut vor Freude rufen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Araba“, wenn der Ausdruck als geografischer Name statt als Bezeichnung für eine trockene Ebene verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: wird springen
  rationale: Das Piel bezeichnet ein lebhaftes, kräftiges Springen; die Wiedergabe bewahrt das anschauliche Bild wiederhergestellter Bewegungsfähigkeit.
- source_word: כָּאַיָּל
  choice: wie ein Hirsch
  rationale: אַיָּל bezeichnet einen Hirsch beziehungsweise ein männliches Tier aus der Familie der Hirsche; „Hirsch“ ist im Deutschen natürlich und bildet den Vergleich prägnant ab.
- source_word: פִּסֵּחַ
  choice: der Lahme
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier generisch eine gehbehinderte Person. „Der Lahme“ ist knapp, quellenah und passt zum poetisch-prophetischen Register, ohne die Ursache der Behinderung genauer festzulegen.
- source_word: וְתָרֹן
  choice: wird vor Freude jubeln
  rationale: רנן bezeichnet einen hellen, freudigen Ruf und kann auch freudiges Singen einschließen. „Jubeln“ wahrt diese Bedeutungsbreite und verbindet sich im Deutschen natürlich mit „Zunge“.
- source_word: לְשׁוֹן אִלֵּם
  choice: die Zunge des Stummen
  rationale: Die konkrete hebräische Körpermetapher wird beibehalten und hebt die wiedererlangte Fähigkeit zu sprechen oder zu jubeln hervor.
- source_word: נִבְקְעוּ
  choice: brechen hervor
  rationale: Das Nifal von בקע beschreibt ein Aufbrechen beziehungsweise Hervorbrechen. Das deutsche Präsens lässt sich im prophetischen Zusammenhang auf das angekündigte Geschehen beziehen und gibt das plötzliche Austreten des Wassers natürlich wieder.
- source_word: בַמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר bezeichnet unbebautes, ödes Land. „Wildnis“ unterscheidet diesen Ausdruck von עֲרָבָה im parallelen Satzglied.
- source_word: מַיִם
  choice: Wasser
  rationale: Obwohl das Hebräische formal pluralisch ist, ist „Wasser“ im modernen Deutschen die natürliche Kollektivbezeichnung.
- source_word: וּנְחָלִים
  choice: und Bäche
  rationale: נְחָלִים kann Wasserläufe, Bäche oder Wadis bezeichnen. Im Zusammenhang des hervorbrechenden Wassers vermittelt „Bäche“ das Bild klar und allgemeinverständlich.
- source_word: בָּעֲרָבָה
  choice: in der Steppe
  rationale: עֲרָבָה kann eine trockene Steppe beziehungsweise Wüstenebene oder den geografischen Eigennamen „Araba“ bezeichnen. Der Gattungsbegriff passt gut zum poetischen Parallelismus, während die geografische Lesart in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Art der angekündigten Wiederherstellung
  choice: Konkrete körperliche Heilung und Erneuerung der öden Landschaft werden als volle prophetische Bilder wiedergegeben, ohne die Art ihrer Erfüllung festzulegen.
  alternative: Die Aussagen ausschließlich als geistliche Metapher oder ausschließlich als wörtliche endzeitliche Vorhersage deuten.
  rationale: Der hebräische Text beschreibt unmittelbar wiederhergestellte körperliche Fähigkeiten und Wasser in dürrem Land. Die Übersetzung soll diese Aussagen weder vergeistigen noch auf ein bestimmtes Erfüllungsschema begrenzen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit dichterischem und würdevollem Ton. Die traditionellen Personenbezeichnungen „der Lahme“ und „der Stumme“ folgen der knappen substantivischen Form des Hebräischen; das konkrete Bild der „Zunge“ bleibt erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
