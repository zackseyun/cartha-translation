base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: de
  text: Kein Löwe wird dort sein, und kein reißendes Tier[a] wird auf ihr hinaufgehen[b]; es wird dort nicht zu finden sein. Doch die Erlösten[c] werden dort gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewalttätiges Tier“, „wildes Tier“ oder „Raubtier“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr“ bezieht sich wahrscheinlich auf die Straße beziehungsweise Hochstraße im vorigen Vers.
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: „die Losgekauften“. Hier steht das hebräische Wort aus der Wortfamilie גאל („erlösen“); im nächsten Vers wird dafür ein anderes Verb gebraucht, פדה („freikaufen, auslösen“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: Löwe
  rationale: Die gewöhnliche Tierbezeichnung wird im Singular allgemein gebraucht und lässt sich im Deutschen unmittelbar mit „Löwe“ wiedergeben.
- source_word: פְרִיץ חַיּוֹת
  choice: reißendes Tier
  rationale: פְרִיץ bezeichnet etwas Gewalttätiges, Rücksichtsloses oder Wildes; zusammen mit חַיּוֹת ist ein gefährliches Raubtier gemeint. „Reißendes Tier“ ist idiomatisch und bewahrt sowohl das Tierbild als auch den bedrohlichen Charakter.
- source_word: בַּל
  choice: kein / nicht
  rationale: Die poetische Negationspartikel verstärkt die Verneinung; im Deutschen wird ihre Kraft natürlich durch „kein“ beziehungsweise „nicht“ ausgedrückt.
- source_word: יַעֲלֶנָּה
  choice: wird auf ihr hinaufziehen
  rationale: עלה bedeutet „hinaufgehen, hinaufziehen“. Das feminine Suffix verweist wahrscheinlich auf die Straße beziehungsweise Hochstraße im vorigen Vers. „Auf ihr“ erhält diesen Rückverweis, ohne das Bezugswort ausdrücklich einzusetzen.
- source_word: תִמָּצֵא
  choice: wird nicht zu finden sein
  rationale: Der Niphal von מצא bedeutet gewöhnlich „gefunden werden“. Die unpersönliche Wiedergabe mit „es“ ist im Deutschen natürlich und lässt den genauen femininen Bezug des Hebräischen offen.
- source_word: גְּאוּלִים
  choice: die Erlösten
  rationale: Das passive Partizip von גאל bezeichnet Menschen, die erlöst oder zurückgewonnen wurden. „Die Erlösten“ ist prägnant, würdevoll und erhält den theologischen Klang des Ausdrucks.
- source_word: וְהָלְכוּ
  choice: werden dort gehen
  rationale: הלך ist das gewöhnliche Verb für „gehen“. „Dort gehen“ bewahrt den wiederholten Ortsbezug und lässt die im Zusammenhang vorausgesetzte Straße mitschwingen.
- source_word: שָׁם
  choice: dort
  rationale: Das wiederholte Adverb unterstreicht die Sicherheit dieses Ortes; „dort“ erhält die Wiederholung knapp und natürlich.
theological_decisions:
- issue: Erlösungsterminologie bei גְּאוּלִים
  choice: die Erlösten
  alternative: die Freigekauften / die Ausgelösten
  rationale: Vers 9 verwendet גאל, während Vers 10 פדה gebraucht. „Die Erlösten“ gibt גאל angemessen wieder; eine Fußnote weist auf den Wechsel des hebräischen Verbs hin, damit die lexikalische Unterscheidung im Zusammenhang nicht unbemerkt eingeebnet wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdigem Ton. Die Wiederholung von „dort“ folgt dem hebräischen Nachdruck. „Auf ihr hinaufziehen“ ist bewusst etwas gehobener formuliert, um den femininen Rückverweis auf die Straße des vorigen Verses sichtbar zu halten; die Fußnote klärt ihn, ohne ihn im Haupttext auszudeuten.
