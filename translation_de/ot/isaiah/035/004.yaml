  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: de
  text: 'Sagt zu denen, deren Herz unruhig ist[a]: »Seid stark, fürchtet euch nicht! Seht, euer Gott wird kommen mit Rache, mit Gottes Vergeltung[b]. Er selbst wird kommen und euch retten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zu den Hastigen des Herzens«; gemeint sind Menschen, die innerlich aufgewühlt oder von Panik erfasst sind.'
    reason: lexical_alternative
  - marker: b
    text: Die knappe hebräische Formulierung kann auch mit »göttliche Vergeltung« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: denen, deren Herz rast
  rationale: Die Wendung bedeutet wörtlich etwa »die Eiligen/Hastigen des Herzens« und bezeichnet hier innere Unruhe oder panische Erregung. »Deren Herz rast« gibt dieses Bild in natürlichem Deutsch wieder, ohne es auf bloße Furcht zu verengen.
- source_word: חִזְקוּ
  choice: Seid stark
  rationale: Der pluralische Imperativ wird direkt und in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: אַל תִּירָאוּ
  choice: fürchtet euch nicht
  rationale: Die geläufige deutsche Wendung bewahrt Form und Nachdruck des hebräischen Verbots.
- source_word: הִנֵּה
  choice: Seht
  rationale: Das Aufmerksamkeitssignal wird ausdrücklich wiedergegeben und passt zum Plural der Angesprochenen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Konstruktion mit dem Suffix der zweiten Person Plural wird unmittelbar übersetzt.
- source_word: נָקָם
  choice: Rache
  rationale: Das Substantiv bezeichnet Rache beziehungsweise Vergeltung. »Rache« bewahrt die Schärfe des Ausgangstextes und wird nicht zu allgemeiner Gerechtigkeit abgeschwächt.
- source_word: גְּמוּל אֱלֹהִים
  choice: Gottes Vergeltung
  rationale: Die Konstruktion wird natürlich und quellennah wiedergegeben; die Zuordnung zu Gott bleibt ausdrücklich erhalten.
- source_word: הוּא
  choice: Er selbst
  rationale: Das selbstständige Pronomen trägt Nachdruck und betont, dass Gott persönlich kommt.
- source_word: וְיֹשַׁעֲכֶם
  choice: und wird euch retten
  rationale: Die Hifil-Form von ישׁע bezeichnet rettendes beziehungsweise befreiendes Handeln. »Retten« ist im Zusammenhang klar und umfassend.
theological_decisions:
- issue: Verhältnis von Gottes Rache und Rettung
  choice: Gottes Rache beziehungsweise Vergeltung und seine Rettung werden beide unverkürzt ausgesprochen.
  alternative: »Rache« zu allgemeiner Gerechtigkeit abschwächen oder die Rettung ausschließlich geistlich deuten.
  rationale: Der hebräische Text stellt Vergeltung und Rettung unmittelbar nebeneinander. Die Übersetzung erhält diese theologische Spannung, ohne Ziel oder Art der Vergeltung und Rettung über den Vers hinaus festzulegen.
- issue: Bezug von גְּמוּל אֱלֹהִים
  choice: »Gottes Vergeltung«
  alternative: »göttliche Vergeltung« oder syntaktisch die Auffassung »er kommt als Gottes Vergeltung«.
  rationale: Die gewählte Fassung bewahrt die ausdrückliche Gottesbezeichnung und lässt die genaue syntaktische Beziehung der knappen hebräischen Nominalfolge in der Fußnote erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der Aufforderungen und das emphatische »Er selbst« bleiben erhalten. »Deren Herz rast« vermittelt das hebräische Bild der inneren Hast anschaulich; die Fußnote dokumentiert die wörtlichere Form.
