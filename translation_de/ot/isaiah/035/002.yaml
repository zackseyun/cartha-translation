id: ISA.35.2
reference: Isaiah 35:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: de
  text: Üppig wird sie blühen[a] und jubeln, ja, jubeln und jauchzen. Die Herrlichkeit des Libanon wird ihr gegeben, die Pracht des Karmel und des Scharon[b]. Sie[d] werden die Herrlichkeit Jahwes[c] sehen, die Pracht unseres Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Blühend wird sie blühen“; im Hebräischen verstärken ein Infinitivus absolutus und das finite Verb gemeinsam die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: Libanon, Karmel und Scharon waren für ihre Schönheit und Fruchtbarkeit bekannt. Scharon bezeichnet eine Ebene. Das Bild überträgt ihre Pracht auf die Wüste.
    reason: cultural_note
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: d
    text: Das hebräische maskuline „sie“ kann sich auf die Menschen beziehen, die zum erneuerten Land gehören; möglicherweise sind die genannten Landschaften poetisch als Sehende vorgestellt.
    reason: ambiguity
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: Üppig wird sie blühen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Verbalgedanken. „Üppig“ gibt diese Betonung in natürlichem Deutsch wieder und passt zum Bild der fruchtbaren Wüste.
- source_word: וְתָגֵל אַף גִּילַת וְרַנֵּן
  choice: und jubeln, ja, jubeln und jauchzen
  rationale: Die Wiedergabe bewahrt die emphatische Wiederaufnahme der Wortwurzel גיל und steigert den hörbaren Freudenjubel mit „jauchzen“, ohne die poetische Häufung einzuebnen.
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: die Herrlichkeit des Libanon
  rationale: „Herrlichkeit“ bewahrt die lexikalische Verbindung von כָּבוֹד zur späteren „Herrlichkeit Jahwes“ und lässt den poetischen Vergleich hervortreten.
- source_word: נִתַּן לָהּ
  choice: wird ihr gegeben
  rationale: Die passive Perfektform erhält im zukunftsgerichteten prophetischen Zusammenhang natürlich futurische Bedeutung.
- source_word: הֲדַר הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: die Pracht des Karmel und der Scharonebene
  rationale: הָדָר bezeichnet Pracht oder Majestät. „Pracht“ ist für die Schönheit der Landschaft idiomatisch; „Scharonebene“ macht den geografischen Namen im Deutschen eindeutig.
- source_word: הֵמָּה יִרְאוּ
  choice: Sie werden sehen
  rationale: Das ausdrücklich gesetzte maskuline Pluralpronomen und das Pluralverb bleiben erhalten. So wird der mögliche Bezug auf Menschen im erneuerten Land nicht durch eine unpersönliche Umformung verdeckt.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben; zugleich bleibt die Wiederholung von כָּבוֹד gegenüber der Herrlichkeit des Libanon sichtbar.
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: die Pracht unseres Gottes
  rationale: Die wiederholte Wiedergabe von הָדָר mit „Pracht“ erhält die Parallelität mit der Pracht von Karmel und Scharon.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Bezug von הֵמָּה („sie“)
  choice: Das Pluralpronomen wird beibehalten
  alternative: 'Unpersönlich: „Dort wird die Herrlichkeit Jahwes zu sehen sein“'
  rationale: Der hebräische Text wechselt unerwartet zu einem maskulinen Plural. Die Übersetzung bewahrt diesen Wechsel und legt nicht endgültig fest, ob Bewohner beziehungsweise Begünstigte des erneuerten Landes oder poetisch aufgefasste Regionen gemeint sind.
translation_notes:
  register: Moderne, gehobene und gut verständliche poetische Sprache. Die Wiederholungen „jubeln, ja, jubeln“ und „Herrlichkeit/Pracht“ bilden die emphatische und parallele Struktur des Hebräischen nach. „Jahwe“ folgt der deutschen Form des Gottesnamens.
