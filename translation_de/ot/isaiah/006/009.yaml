  text: וַ/יֹּ֕אמֶר לֵ֥ךְ וְ/אָמַרְתָּ֖ לָ/עָ֣ם הַ/זֶּ֑ה שִׁמְע֤וּ שָׁמ֨וֹעַ֙ וְ/אַל תָּבִ֔ינוּ וּ/רְא֥וּ רָא֖וֹ וְ/אַל תֵּדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: de
  text: 'Und er sagte[a]: »Geh und sage zu diesem Volk: ›Hört immerzu, aber versteht nicht! Seht immerzu, aber erkennt nicht!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: »Hört, ja hört, aber versteht nicht; seht, ja seht, aber erkennt nicht.« Die hebräische Verstärkung kann auch vorhersagend aufgefasst werden: »Ihr werdet gewiss hören, aber nicht verstehen; ihr werdet gewiss sehen, aber nicht erkennen.«'
    reason: Alternative Wiedergaben der durch den Infinitivus absolutus verstärkten Imperative und ihrer möglichen vorhersagenden Kraft.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Das narrative Wayyiqtol von אמר wird schlicht wiedergegeben und bewahrt den hebräischen Erzählfluss, ohne die zeitliche Abfolge stärker auszudeuten.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך richtet sich an Jesaja; »Geh« ist die direkte und natürliche deutsche Entsprechung.
- source_word: וְאָמַרְתָּ
  choice: und sage
  rationale: Die Form führt den Auftrag nach »Geh« fort. Der deutsche Imperativ gibt diese Befehlsfolge idiomatisch wieder.
- source_word: לָעָם הַזֶּה
  choice: zu diesem Volk
  rationale: עָם bezeichnet hier das Volk; der Demonstrativ wird erhalten und lässt den möglichen distanzierenden Ton bestehen.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Hört nur immerzu
  rationale: Imperativ plus Infinitivus absolutus verstärkt die Verbalhandlung. »nur immerzu« vermittelt im heutigen Deutsch sowohl Nachdruck als auch fortgesetztes Hören, ohne die Wendung zu einer bloßen Vorhersage umzudeuten.
- source_word: וְאַל תָּבִינוּ
  choice: aber versteht nicht
  rationale: בין meint verstehen beziehungsweise unterscheiden. »aber« macht den im Zusammenhang liegenden Gegensatz natürlich deutlich, während »versteht« die lexikalische Abgrenzung zu ידע wahrt.
- source_word: וּרְאוּ רָאוֹ
  choice: Seht nur immerzu
  rationale: Wie beim Hören verstärkt ein Infinitivus absolutus den Imperativ. Die parallele Wiedergabe erhält Form und rhetorische Wirkung.
- source_word: וְאַל תֵּדָעוּ
  choice: aber erkennt nicht
  rationale: ידע kann Wissen, Erkennen und Wahrnehmen bezeichnen. Im Zusammenhang des Sehens ist »erkennen« natürlich, bewahrt aber gegenüber »verstehen« eine eigene lexikalische Nuance.
theological_decisions:
- issue: Ob die Aussage als unmittelbarer Befehl oder als ironisch-gerichtliche Vorhersage wiederzugeben ist
  choice: 'Befehlsformen mit rhetorisch-gerichtlicher Kraft: »Hört ... versteht nicht; seht ... erkennt nicht.«'
  alternative: 'Vorhersagende Wiedergabe: »Ihr werdet zwar hören ... ihr werdet zwar sehen ...«'
  rationale: שִׁמְעוּ und רְאוּ sind grammatisch Imperative; die mit אַל verneinten Formen setzen den auffordernden Charakter fort. Der Zusammenhang verleiht ihnen eine ironische und gerichtliche Spannung, die nicht durch eine rein vorhersagende Übersetzung aufgelöst werden sollte. Die mögliche Vorhersagekraft wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzgestalt und die schroffe Spannung der hebräischen Aufforderungen bleiben erhalten; »nur immerzu« macht die Intensivierung für heutige Leser verständlich.
