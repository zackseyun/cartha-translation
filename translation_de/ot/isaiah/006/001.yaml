source:
  edition: WLC
  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: de
  text: Im Todesjahr des Königs Usija sah ich den Herrn auf einem Thron sitzen, hoch und erhaben, und die Säume seines Gewandes füllten den Tempel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Palast“. Das hebräische Wort kann sowohl einen Tempel als auch einen Palast bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte „hoch und erhaben“ können im Hebräischen auch den Thron näher bestimmen.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: Im Todesjahr des Königs Usija
  rationale: Die constructusartige Zeitangabe bezeichnet das Jahr, in dem König Usija starb. „Im Todesjahr“ ist im Deutschen knapp, natürlich und gibt das Ereignis מוֹת sachgerecht wieder.
- source_word: וָאֶרְאֶה
  choice: sah ich
  rationale: Das Wayyiqtol der ersten Person Singular berichtet die Vision in der Vergangenheit; im deutschen Satzbau ist keine zusätzliche Wiedergabe des einleitenden ו erforderlich.
- source_word: אֶת אֲדֹנָי
  choice: den Herrn
  rationale: אֲדֹנָי ist hier der göttliche Titel und nicht das Tetragramm. „den Herrn“ bewahrt diese Unterscheidung.
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: auf einem … Thron sitzen
  rationale: Das Partizip beschreibt die thronende Haltung des Herrn. Die deutsche Infinitivkonstruktion nach „sah“ gibt die Szene idiomatisch wieder.
- source_word: רָם וְנִשָּׂא
  choice: hohen und erhabenen
  rationale: Die beiden Adjektive beziehen sich grammatisch am nächsten auf כִּסֵּא, den Thron. „hoch und erhaben“ bewahrt die feierliche Doppelung und die räumlich-königliche Bildsprache.
- source_word: שׁוּלָיו
  choice: die Säume seines Gewandes
  rationale: Der Plural bezeichnet die unteren Ränder beziehungsweise herabhängenden Teile seines Gewandes. Der Plural „Säume“ entspricht der Form und erklärt zugleich die pluralische Verbform מְלֵאִים.
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: füllten den Tempel
  rationale: Das Partizip bezeichnet den Zustand beziehungsweise die Wirkung der Gewandsäume. הֵיכָל kann Palast oder Tempel heißen; im Zusammenhang der Heiligtumsvision ist „Tempel“ die verständlichste Hauptübersetzung.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: Herr
  alternative: Gebieter
  rationale: Der Text verwendet den göttlichen Titel אֲדֹנָי, nicht den Gottesnamen JHWH. „Herr“ gibt den Titel würdig und traditionell verständlich wieder, ohne den nicht geschriebenen Gottesnamen einzutragen.
- issue: Bezug von רָם וְנִשָּׂא
  choice: 'auf den Thron bezogen: „auf einem hohen und erhabenen Thron“'
  alternative: 'prädikativ oder auf den Herrn bezogen: „auf einem Thron, hoch und erhaben“'
  rationale: Nach der hebräischen Wortstellung und Kongruenz modifizieren die maskulinen Singularadjektive unmittelbar כִּסֵּא. Die alternative Interpunktion ist in der Auslegung möglich, wird aber nicht zur Hauptlesart gemacht.
- issue: Bedeutung von הֵיכָל
  choice: Tempel
  alternative: Palast
  rationale: הֵיכָל umfasst beide Bedeutungen. Die folgende Heiligtumsszene mit Serafim und Heiligkeitsruf legt „Tempel“ nahe; die königliche Palastvorstellung bleibt durch Thron und Herrschaftsbild gegenwärtig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Erzählweise. Der Satz folgt der hebräischen Bildfolge, vermeidet jedoch unnatürliche Wortstellung. Die Form „Usija“ entspricht der im Deutschen gebräuchlichen biblischen Namensform. Der Fußnotenmarker steht unmittelbar nach der textlich betroffenen Wiedergabe.
