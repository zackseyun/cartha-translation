id: ISA.6.6
reference: Isaiah 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֣עָף אֵלַ֗/י אֶחָד֙ מִן הַ/שְּׂרָפִ֔ים וּ/בְ/יָד֖/וֹ רִצְפָּ֑ה בְּ/מֶ֨לְקַחַ֔יִם לָקַ֖ח מֵ/עַ֥ל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: de
  text: Da flog einer der Serafim zu mir. In seiner Hand hielt er eine glühende Kohle[a], die er mit einer Zange vom Altar genommen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen glühenden Stein“. Das hebräische Wort kann einen heißen Stein oder eine glühende Kohle vom Altar bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף
  choice: Da flog
  rationale: Das Verb עוּף bezeichnet das Fliegen. „Da flog“ gibt die fortschreitende Erzählung knapp und natürlich wieder.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der 1. Person Singular bezeichnet die auf den Sprecher gerichtete Bewegung.
- source_word: אֶחָד מִן־הַשְּׂרָפִים
  choice: einer der Serafim
  rationale: „Serafim“ bewahrt die in dieser Vision verwendete Bezeichnung für diese himmlischen Wesen; „Brennende“ wäre eine stärker deutende etymologische Wiedergabe.
- source_word: וּבְיָדוֹ
  choice: In seiner Hand hielt er
  rationale: Die hebräische Nominalkonstruktion beschreibt, was der Seraf in der Hand hatte. „Hielt er“ ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: רִצְפָּה
  choice: eine glühende Kohle
  rationale: Das Wort bezeichnet hier einen heißen beziehungsweise glühenden Gegenstand vom Altar, möglicherweise einen Stein oder eine Kohle. „Glühende Kohle“ ist verständlich und passt zum Zusammenhang; die sachliche Unschärfe wird in der Fußnote kenntlich gemacht.
- source_word: בְּמֶלְקַחַיִם
  choice: mit einer Zange
  rationale: Das Substantiv bezeichnet eine Zange beziehungsweise Feuerzange; die instrumentale Präposition wird mit „mit“ wiedergegeben.
- source_word: לָקַח
  choice: genommen hatte
  rationale: Das Qatal beschreibt am natürlichsten eine Handlung, die dem Heranfliegen vorausging. Das Plusquamperfekt verdeutlicht diese zeitliche Folge.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: vom Altar
  rationale: מֵעַל bedeutet wörtlich „von auf“ beziehungsweise „herab von“. „Vom Altar“ gibt dies in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von שְׂרָפִים in der Thronsaalvision
  choice: Serafim
  alternative: die Brennenden
  rationale: Der Ausdruck bezeichnet in Jesaja 6 eine bestimmte Gruppe himmlischer Wesen. Die etablierte Bezeichnung „Serafim“ bewahrt diese literarische und theologische Besonderheit, ohne die Etymologie zur Auslegung zu machen.
- issue: Wiedergabe von רִצְפָּה in der Reinigungsszene am Altar
  choice: glühende Kohle
  alternative: heißer oder glühender Stein
  rationale: Der Gegenstand stammt erhitzt vom Altar und dient in der Vision der Reinigung. „Glühende Kohle“ ist im modernen Deutsch anschaulich, während die Fußnote die lexikalisch mögliche Deutung als Stein offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle, im Deutschen etablierte Form „Serafim“ bleibt erhalten; Satzbau und Verbwahl sind bewusst natürlich, ohne die Bildsprache des Hebräischen aufzulösen.
