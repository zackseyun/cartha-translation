source:
  edition: WLC
  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: de
  text: Mach das Herz dieses Volkes stumpf[a], mach seine Ohren schwer und verklebe ihm die Augen[b], damit es nicht mit seinen Augen sieht, mit seinen Ohren hört und mit seinem Herzen versteht, umkehrt[c] und geheilt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mach das Herz dieses Volkes fett“; gemeint ist, dass es unempfänglich oder abgestumpft wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verschließe ihm die Augen“ beziehungsweise „überstreiche ihm die Augen“; das hebräische Verb bezeichnet hier, dass die Augen nicht mehr wahrnehmen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zurückkehrt“; das Verb kann allgemein eine Umkehr oder Rückkehr bezeichnen und hier auch Reue einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמֵן לֵב
  choice: Mach das Herz … stumpf
  rationale: Das Hifil von שׁמן bedeutet wörtlich „fett machen“. In Verbindung mit „Herz“ bezeichnet es bildhaft ein Unempfänglichmachen. „Stumpf“ gibt diese Wirkung in verständlichem, modernem Deutsch wieder, ohne das Herz auf den bloßen Verstand einzuengen.
- source_word: לֵב / לְבָבוֹ
  choice: Herz / mit seinem Herzen
  rationale: לֵב bezeichnet das innere Wahrnehmungs-, Denk- und Willenszentrum. „Herz“ bewahrt die hebräische Anthropologie und den biblischen Bildklang.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Der kollektive Singular wird im Deutschen natürlich als „dieses Volk“ wiedergegeben; entsprechend können auch die folgenden Pronomen und Verben im Singular stehen.
- source_word: וְאָזְנָיו הַכְבֵּד
  choice: mach seine Ohren schwer
  rationale: Die Formulierung bewahrt die Metapher des hebräischen כבד („schwer machen“), die hier mangelnde Aufnahmefähigkeit ausdrückt. „Schwerhörig“ wäre idiomatischer, würde das Bild aber stärker in eine körperliche Beeinträchtigung auflösen.
- source_word: וְעֵינָיו הָשַׁע
  choice: verklebe seine Augen
  rationale: הָשַׁע bezeichnet hier ein Verschließen oder Überstreichen der Augen, sodass sie nicht mehr reagieren. „Verklebe“ erhält das konkrete Bild; die lexikalische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die deutsche Zweckkonstruktion gibt die abwehrende beziehungsweise verhindernde Kraft von פֶּן klar wieder und bewahrt die Härte des göttlichen Auftrags.
- source_word: יִרְאֶה … יִשְׁמָע … יָבִין
  choice: es … sieht … hört … versteht
  rationale: Die hebräischen Singularformen beziehen sich auf den kollektiven Singular „dieses Volk“. Anders als im Englischen lässt sich diese Übereinstimmung im Deutschen natürlich beibehalten.
- source_word: וָשָׁב
  choice: umkehrt
  rationale: שׁוב bedeutet grundsätzlich „umkehren, zurückkehren“. „Umkehrt“ bewahrt die Bewegungsmetapher und lässt offen, in welchem Umfang hier ausdrücklich Reue oder Buße gemeint ist.
- source_word: וְרָפָא לוֹ
  choice: und geheilt wird
  rationale: Die hebräische Wendung ist knapp und lässt den Heilenden unausgesprochen. Die passive deutsche Form gibt den Ergebnissinn wieder, ohne ein im Satz nicht ausdrücklich genanntes Subjekt einzufügen.
theological_decisions:
- issue: Göttliches Handeln bei der Verstockung
  choice: 'Die drei Imperative werden als direkte Befehle wiedergegeben: „Mach … mach … verklebe …“'
  alternative: Abschwächung zu einer Erlaubnis („Lass das Herz stumpf werden“) oder bloßen Folgebeschreibung.
  rationale: Der hebräische Text verwendet an den Propheten gerichtete Imperative. Die Übersetzung bewahrt deshalb die theologische Spannung des gerichtlichen Unempfänglichmachens, statt sie durch permissive Sprache aufzulösen.
- issue: Bedeutungsumfang der Umkehr
  choice: שׁוב wird mit „umkehrt“ übersetzt.
  alternative: „Buße tut“ oder „zurückkehrt“.
  rationale: „Buße tut“ würde die im Kontext mögliche geistliche Bedeutung ausdrücklich festlegen; „umkehrt“ erhält sowohl die Grundbedeutung als auch die mögliche Dimension der Reue.
- issue: Unausgesprochener Handelnder bei der Heilung
  choice: „geheilt wird“ ohne Nennung des Heilenden.
  alternative: „ich es heile“ oder „Gott es heilt“.
  rationale: Die passive Wiedergabe wahrt die Ellipse des Hebräischen und vermeidet, ein nicht ausdrücklich genanntes Subjekt in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Bewahrung der hebräischen Körpermetaphern. Der kollektive Singular „dieses Volk“ wird in den nachfolgenden Bezügen als „es/sein“ fortgeführt. Die syntaktische Härte der Imperative und des negativen Zwecksatzes bleibt erhalten.
