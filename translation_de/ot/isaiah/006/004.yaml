id: ISA.6.4
reference: Isaiah 6:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּנֻ֨עוּ֙ אַמּ֣וֹת הַ/סִּפִּ֔ים מִ/קּ֖וֹל הַ/קּוֹרֵ֑א וְ/הַ/בַּ֖יִת יִמָּלֵ֥א עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: de
  text: Da bebten die tragenden Teile der Schwellen[a] von der Stimme des Rufenden, und das Haus[b] füllte sich mit Rauch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Pfosten der Schwellen“, „die Stützen der Schwellen“ oder „die Fundamente der Schwellen“. Der hebräische Ausdruck bezeichnet Bauteile im Tür- und Schwellenbereich; ihre genaue Art ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist das Tempelheiligtum. Hebräisch: „das Haus“, eine geläufige Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: Da bebten
  rationale: Das Verb נוע bezeichnet Bewegung oder Erschütterung. „bebten“ gibt die eindrückliche physische Erschütterung natürlich wieder; „Da“ bindet die Wayyiqtol-Form an den Erzählfluss an.
- source_word: אַמּוֹת הַסִּפִּים
  choice: die tragenden Teile der Schwellen
  rationale: Die seltene Verbindung bezeichnet Bauteile im Schwellen- bzw. Türbereich. Die Wiedergabe wahrt die architektonische Bedeutung, ohne die umstrittene genaue Identifikation als Fundamente, Pfosten, Stützen oder Zapfen festzulegen.
- source_word: מִקּוֹל
  choice: von der Stimme
  rationale: קוֹל kann „Stimme“ oder „Schall“ bedeuten; bei einem Rufenden ist „Stimme“ im Deutschen natürlich. Die Präposition מִן bezeichnet hier den auslösenden Grund.
- source_word: הַקּוֹרֵא
  choice: des Rufenden
  rationale: Das substantivierte Partizip bezeichnet den, der ruft, und lässt den Bezug wie im Hebräischen unausgesprochen.
- source_word: וְהַבַּיִת
  choice: und das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet im Kontext das Tempelheiligtum. Die wörtliche Benennung bleibt im Haupttext erhalten.
- source_word: יִמָּלֵא
  choice: füllte sich
  rationale: Der Nifal drückt das Vollwerden bzw. Gefülltwerden aus. Das reflexive deutsche Präteritum ist in der Erzählung natürlich und vermeidet die mögliche Vorstellung eines ausdrücklich genannten Handelnden.
- source_word: עָשָׁן
  choice: mit Rauch
  rationale: Direkte und kontextgerechte Wiedergabe von עָשָׁן.
theological_decisions:
- issue: Bezeichnung des Heiligtums in der Vision
  choice: das Haus
  alternative: der Tempel
  rationale: Der hebräische Text verwendet בַּיִת („Haus“), eine geläufige Bezeichnung für den Tempel. „Haus“ bewahrt die Ausdrucksweise des Ausgangstextes; die Fußnote erläutert den Kontext.
- issue: Identität des Rufenden
  choice: des Rufenden
  alternative: des Serafs
  rationale: Der unmittelbare Kontext legt einen Seraf nahe, doch der Vers selbst nennt nur „den Rufenden“. Die Übersetzung löst diesen Bezug nicht ausdrücklich auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzbewegung bleibt knapp und bildhaft. Seltene Architekturterminologie wird im Haupttext verständlich, aber bewusst nicht zu eng wiedergegeben; Alternativen stehen in der Fußnote.
