id: ISA.6.11
reference: Isaiah 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: de
  text: 'Da sagte ich[a]: »Wie lange, Herr?« Er antwortete: »Bis die Städte verwüstet sind und niemand mehr darin wohnt, die Häuser menschenleer sind und das Land verwüstet daliegt – eine Einöde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Bis wann, Herr?«'
    reason: Die Fußnote bewahrt die formale Entsprechung zwischen עַד מָתַי und dem עַד der Antwort, während der Haupttext idiomatisches Deutsch bietet.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Waw mit der Verbform führt die Erzählung weiter; »Da sagte ich« gibt die Abfolge im Deutschen natürlich wieder.
- source_word: עַד מָתַי
  choice: Wie lange
  rationale: Die Wendung bedeutet wörtlich »bis wann«; als Frage ist »Wie lange?« im heutigen Deutschen natürlicher, während die zeitliche Entsprechung zur Antwort mit »Bis« erhalten bleibt.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die göttliche Anrede wird im Deutschen herkömmlich und sachgerecht mit »Herr« wiedergegeben; das pronominale Element wird bei diesem feststehenden Titel nicht eigens als »mein« ausgedrückt.
- source_word: עַד אֲשֶׁר אִם
  choice: Bis
  rationale: Die Verbindung bezeichnet hier den zeitlichen Endpunkt, nicht eine gewöhnliche Bedingung; »Bis« gibt ihre Funktion knapp und verständlich wieder.
- source_word: שָׁאוּ עָרִים מֵאֵין יוֹשֵׁב
  choice: die Städte verwüstet sind und niemand mehr darin wohnt
  rationale: שׁאה bezeichnet Verwüstung; מֵאֵין יוֹשֵׁב besagt, dass kein Bewohner vorhanden ist. Die explizite Formulierung vermeidet das im Deutschen unnatürliche »ohne Bewohner« nach dem Plural.
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: die Häuser menschenleer sind
  rationale: אָדָם bezeichnet hier generisch einen Menschen. »Menschenleer« bewahrt die knappe, drastische Aussage und ist weder männlich verengt noch umständlich.
- source_word: וְהָאֲדָמָה תִּשָּׁאֶה שְׁמָמָה
  choice: das Land verwüstet daliegt – eine Einöde
  rationale: אֲדָמָה meint im Zusammenhang das Land; Verb und folgendes Substantiv häufen Verwüstungssprache. »verwüstet daliegt – eine Einöde« bewahrt diese Verstärkung in natürlichem Deutsch.
theological_decisions:
- issue: Generischer Sinn von אָדָם
  choice: menschenleer
  alternative: ohne einen Menschen
  rationale: Gemeint ist nicht ausschließlich ein Mann, sondern das völlige Fehlen von Menschen in den Häusern. »Menschenleer« gibt diesen generischen Sinn präzise und knapp wieder.
- issue: Zeitliche Reichweite des Gerichts in עַד אֲשֶׁר אִם
  choice: Bis
  alternative: Bis zu der Zeit, da
  rationale: Der Text nennt den Punkt, bis zu dem der Auftrag beziehungsweise seine Wirkung reicht, erklärt aber nicht ausdrücklich, was danach geschieht. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der vollständigen Entvölkerung und Verwüstung bleibt knapp und eindringlich; der Gedankenstrich markiert die substantivische Verstärkung שְׁמָמָה, ohne sie zu glätten.
