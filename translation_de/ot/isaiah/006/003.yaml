source:
  edition: WLC
  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
translation:
  language: de
  text: 'Und einer rief dem anderen zu und sprach: „Heilig, heilig, heilig ist Jahwe[a] der Heerscharen[b]; die ganze Erde ist voll von seiner Herrlichkeit.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Oder „der Heere“. Der hebräische Titel kann die himmlischen und irdischen Mächte unter seinem Befehl umfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָא זֶה אֶל זֶה
  choice: Und einer rief dem anderen zu
  rationale: Die Wendung זֶה אֶל זֶה bezeichnet ein wechselseitiges Zurufen. „Einer … dem anderen“ ist im Deutschen idiomatisch; „rief … zu“ gibt קרא in dieser feierlichen, antiphonalen Szene treffend wieder.
- source_word: וְאָמַר
  choice: und sprach
  rationale: Die Fortführung der Erzählung wird ausdrücklich wiedergegeben. „Sprach“ wahrt den würdevollen biblischen Ton, ohne veraltet oder unverständlich zu wirken.
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: Heilig, heilig, heilig
  rationale: Die dreifache Wiederholung bleibt unverändert erhalten, da sie die eindringliche und liturgische Wirkung des Hebräischen trägt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Im festen Gottesnamen-Titel bewahrt „Heerscharen“ die umfassende Bedeutung der unter Gottes Befehl stehenden himmlischen und irdischen Mächte besser als das engere „Armeen“.
- source_word: מְלֹא כָל הָאָרֶץ כְּבוֹדוֹ
  choice: die ganze Erde ist voll von seiner Herrlichkeit
  rationale: Die nominale hebräische Konstruktion wird als natürlicher deutscher Prädikatsatz wiedergegeben. „Voll von“ macht die in מְלֹא ausgedrückte Fülle klar, ohne den Sinn auszuweiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt den Eigennamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ lässt offen, ob himmlische oder irdische Mächte beziehungsweise beide gemeint sind, und bewahrt damit die Bedeutungsbreite des hebräischen Titels.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem Rhythmus. Die dreifache Wiederholung und der traditionelle Ausdruck „Heerscharen“ erhalten die liturgische Kraft des Verses; Satzbau und Wortwahl bleiben zugleich allgemein verständlich.
