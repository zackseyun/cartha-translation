    rationale: Der Ausgangstext lautet יהוה צבאות („Jahwe der Heerscharen/Heere“), nicht „Herr der Heerscharen“. Die Fassung fügt den Titel „Herr“ hinzu und gestaltet die Apposition unnötig um.
  - severity: medium
