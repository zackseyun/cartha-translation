    rationale: „Heere“ und „Heerscharen“ sind alternative deutsche Wiedergaben von צבאות; keine von beiden ist ohne Weiteres „wörtlicher“. Außerdem muss die traditionelle Wiedergabe mit „der HERR“ als alternative Gesamtübersetzung, nicht als direkte Wiedergabe neben „Jahwe“, kenntlich sein.
