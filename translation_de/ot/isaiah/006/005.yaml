    issue: „Und nun“ für כִּי vor „meine Augen haben ... gesehen“
    rationale: Das dritte כִּי begründet Jesajas Weheruf durch die Gottesvision. „Und nun“ führt eine nicht im hebräischen Text markierte zeitliche Nuance ein und verdeckt die Begründungsrelation.
  - severity: high
