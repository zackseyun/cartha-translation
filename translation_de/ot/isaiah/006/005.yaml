source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: de
  text: 'Da sagte ich: »Wehe mir! Denn ich bin verloren[a], denn ich bin ein Mann mit unreinen Lippen und lebe mitten in einem Volk mit unreinen Lippen; denn meine Augen haben den König gesehen: Jahwe der Heerscharen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin vernichtet!«; möglicherweise auch: »Ich muss verstummen!«'
    reason: Das hebräische Verb נִדְמֵיתִי ist in diesem Zusammenhang nicht eindeutig und kann Untergang beziehungsweise Verstummen bezeichnen.
  - marker: b
    text: 'Auch: »Jahwe der Heere«; traditionell: »der HERR der Heerscharen«.'
    reason: Alternative Wiedergaben von צבאות sowie die traditionelle Ersatzwiedergabe des Gottesnamens יהוה.
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Wehe mir!
  rationale: Die knappe Klage- und Unheilsformel wahrt Gewicht und Dringlichkeit des hebräischen Ausrufs.
- source_word: נִדְמֵיתִי
  choice: Ich bin verloren!
  rationale: Die Form bezeichnet hier wahrscheinlich das drohende Zugrundegehen in Gottes Gegenwart; die Wendung ist natürlich und lässt die möglichen Nuancen von Vernichtung, Verstummen oder Abgeschnittensein offen genug.
- source_word: טְמֵא שְׂפָתַיִם
  choice: mit unreinen Lippen
  rationale: Die Wendung erhält das kultisch und moralisch geprägte Bild der Unreinheit, die an den Lippen und damit am Reden sichtbar wird.
- source_word: וּבְתוֹךְ ... יוֹשֵׁב
  choice: lebe mitten in
  rationale: ישב bezeichnet hier den dauerhaften Wohn- und Lebenszusammenhang; „mitten in“ gibt בתוך anschaulich wieder.
- source_word: הַמֶּלֶךְ
  choice: den König
  rationale: Der bestimmte Titel wird als hervorgehobene Gottesbezeichnung großgeschrieben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, den Herrn der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder. צבאות wird mit der im Deutschen verständlichen und würdevollen traditionellen Bezeichnung „Heerscharen“ ausgedrückt; die Apposition lässt den König mit Jahwe identisch sein.
- source_word: רָאוּ עֵינַי
  choice: haben meine Augen ... gesehen
  rationale: Das Perfekt bezeichnet das vollendete Sehen mit unmittelbarer gegenwärtiger Folge für Jesaja.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צבאות
  choice: Herr der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ umfasst die militärisch-himmlische Bildwelt, ohne vorschnell festzulegen, welche Heere genau gemeint sind; die transparentere Alternative steht in der Fußnote.
- issue: Folgernde oder verstärkende Funktion des zweiten כי vor אֶת הַמֶּלֶךְ
  choice: Und nun
  alternative: denn
  rationale: Die Partikel führt den erschütternden Grund beziehungsweise die Zuspitzung des Ausrufs an. „Und nun“ verbindet natürlich, ohne den logischen Zusammenhang starr festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischer Eindringlichkeit. Das wiederholte Bild der „unreinen Lippen“ bleibt erhalten; „Mann“ entspricht Jesajas Selbstbezeichnung. Die Zeichensetzung gliedert die langen Begründungssätze für heutige Leser.
