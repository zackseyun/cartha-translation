id: ISA.6.8
reference: Isaiah 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: de
  text: 'Da hörte ich die Stimme des Herrn sagen: „Wen soll ich senden, und wer wird für uns gehen[a]?“ Ich sagte: „Hier bin ich[b]. Sende mich!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „für uns“. Der Plural kann auf den himmlischen Rat im Zusammenhang hinweisen; manche christliche Leser erkennen darin außerdem einen Anklang an die spätere Offenbarung der Dreieinigkeit. Der Text selbst bestimmt den Bezug nicht.
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung drückt Bereitschaft und Verfügbarkeit aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Da hörte ich
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder; „hörte“ entspricht שׁמע.
- source_word: קוֹל
  choice: Stimme
  rationale: Da ausdrücklich gesprochen wird, bezeichnet קוֹל hier am natürlichsten eine „Stimme“ und nicht bloß einen „Laut“.
- source_word: אֲדֹנָי
  choice: des Herrn
  rationale: Der Gottestitel אֲדֹנָי wird im Deutschen idiomatisch und würdevoll mit „Herr“ wiedergegeben.
- source_word: אֹמֵר
  choice: sagen
  rationale: Der Partizipialausdruck wird nach „die Stimme … hören“ im Deutschen natürlich mit dem Infinitiv „sagen“ wiedergegeben.
- source_word: מִי אֶשְׁלַח
  choice: Wen soll ich senden
  rationale: מִי ist hier das Objekt von „senden“; „wen“ wahrt diese syntaktische Funktion. „Soll ich“ gibt die überlegende Frage passend wieder.
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: und wer wird für uns gehen
  rationale: Die erste Person Plural in לָנוּ wird ausdrücklich als „für uns“ bewahrt, ohne ihren Bezug interpretierend festzulegen.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Die hebräische Bereitschaftsformel bezeichnet Selbstvorstellung, Verfügbarkeit und Bereitschaft. „Hier bin ich“ ist im modernen Deutsch natürlich und behält diesen Sinn.
- source_word: שְׁלָחֵנִי
  choice: Sende mich!
  rationale: Der Imperativ mit dem Suffix der ersten Person Singular wird als unmittelbare Bitte beziehungsweise freiwilliges Angebot wiedergegeben.
theological_decisions:
- issue: Erste Person Plural in der göttlichen Rede („für uns“)
  choice: Der Plural „für uns“ bleibt im Haupttext stehen, ohne dass sein Bezug bestimmt wird.
  alternative: Mögliche Deutungen sind ein himmlischer Rat, ein Majestäts- oder Beratungsplural oder in christlicher kanonischer Lesart ein Anklang an die spätere Offenbarung der Dreieinigkeit.
  rationale: Der hebräische Text enthält eindeutig ein Suffix der ersten Person Plural, nennt dessen Bezug jedoch nicht. Die Übersetzung bewahrt diese Offenheit und die damit verbundene theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; „Hier bin ich“ vermeidet unnötig altertümliche Wortstellung, ohne die Bereitschaftsformel abzuschwächen.
