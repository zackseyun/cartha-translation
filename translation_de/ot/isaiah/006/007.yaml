base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: de
  text: 'Und er berührte meinen Mund und sagte: »Sieh, dies hat deine Lippen berührt; deine Schuld ist gewichen, und deine Sünde ist gesühnt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: Und er berührte meinen Mund
  rationale: נגע mit עַל bezeichnet hier das Berühren; die schlichte Wiedergabe folgt der konkreten Handlung des hebräischen Textes.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, feierlichen Charakter der Partikel in einer natürlichen modernen Form.
- source_word: וְסָר עֲוֹנֶךָ
  choice: deine Schuld ist gewichen
  rationale: סוּר bedeutet weggehen beziehungsweise weichen; עָוֹן bezeichnet hier die belastende Schuld. Die Formulierung erhält das Bild ihrer Entfernung.
- source_word: וְחַטָּאתְךָ תְכֻפָּר
  choice: und deine Sünde ist gesühnt
  rationale: Das passive Pual von כפר drückt bewirkte Sühnung aus; das deutsche Perfekt gibt den nun vollzogenen Zustand natürlich wieder.
theological_decisions:
- issue: Verhältnis von Schuldentfernung und Sühnung
  choice: 'Beide parallelen Aussagen bleiben eigenständig erhalten: Die Schuld weicht, die Sünde wird gesühnt.'
  alternative: Beide Aussagen zu einer allgemeinen Vergebungsaussage zusammenziehen.
  rationale: Der hebräische Parallelismus verbindet zwei verwandte, aber nicht völlig identische Aussagen; die Übersetzung soll diese theologische Spannung nicht einebnen.
- issue: Nicht genannter Handelnder bei der Sühnung
  choice: 'Passiv: »ist gesühnt«'
  alternative: »Gott hat deine Sünde gesühnt« oder »dir ist vergeben«
  rationale: Der Ausgangstext nennt den Handelnden nicht ausdrücklich. Das Passiv bewahrt diese grammatische Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sieh« ist gegenüber »Siehe« gegenwärtiger, behält aber den feierlichen Hinweischarakter. Keine Fußnote erforderlich.
