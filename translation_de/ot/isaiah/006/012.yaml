id: ISA.6.12
reference: Isaiah 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: de
  text: Und Jahwe wird die Menschen weit fortbringen[a], und mitten im Land wird die Verödung groß sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen ein kollektiver Singular: »den Menschen«; gemeint ist die menschliche Bevölkerung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »und die verlassenen Gebiete im Land werden zahlreich sein« oder: »und das Verlassensein mitten im Land wird groß sein«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: wird … weit fortbringen
  rationale: Das Verb רחק bezeichnet hier im Zusammenhang des angekündigten Gerichts das Herbeiführen räumlicher Entfernung. Die Zukunftsform gibt die prophetische Fortsetzung natürlich wieder; »weit fortbringen« bewahrt sowohl das Wegführen als auch die große Entfernung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאָדָם
  choice: die Menschen
  rationale: Der bestimmte Singular אָדָם wird hier kollektiv für die menschliche Bevölkerung gebraucht. Im heutigen Deutsch gibt »die Menschen« diesen Bezug klar und natürlich wieder.
- source_word: וְרַבָּה
  choice: wird … groß sein
  rationale: Die feminine Form stimmt mit הָעֲזוּבָה überein und bezeichnet das große Ausmaß des folgenden Zustands.
- source_word: הָעֲזוּבָה
  choice: die Verödung
  rationale: Das Wort kann den Zustand des Verlassenseins beziehungsweise die daraus entstehende Verwüstung bezeichnen. »Verödung« ist im Deutschen konkret genug für den Zusammenhang und lässt den Zustandscharakter erkennen.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: mitten im Land
  rationale: Die Wendung bewahrt die räumliche Vorstellung von etwas, das sich im Inneren beziehungsweise inmitten des Landes abspielt.
theological_decisions:
- issue: Kollektive Bedeutung von הָאָדָם
  choice: die Menschen
  alternative: der Mensch / die Menschheit
  rationale: Gemeint ist nicht nur ein einzelner Mann, sondern die Bevölkerung, die im Gericht weit weggebracht wird. Die gewählte Form macht den kollektiven Bezug deutlich, ohne ihn auf Männer einzugrenzen.
- issue: Deutung von הָעֲזוּבָה
  choice: die Verödung
  alternative: das Verlassensein / die verlassenen Gebiete
  rationale: Die hebräische Form lässt eine abstrakte Zustandsbezeichnung und eine konkretere örtliche Auffassung zu. Der Haupttext wahrt den Zustandsbezug; die Fußnote nennt die sachlich mögliche konkrete Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während »weit fortbringen« und »Verödung« im heutigen Deutsch verständlich sind. Die genuine Mehrdeutigkeit von הָעֲזוּבָה wird in einer Fußnote offengehalten.
