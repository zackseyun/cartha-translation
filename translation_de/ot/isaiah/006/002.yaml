  terminology: „Serafim“ ist als etablierte deutsche biblische Bezeichnung für שְׂרָפִים vertretbar. Die Fußnote wahrt die unsichere etymologische Verbindung mit „brennen“, ohne diese zur festen Übersetzungsbedeutung zu machen. „Füße“ ist hier die sachgemäße Wiedergabe von רַגְלָיו.
