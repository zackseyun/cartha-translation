  source_fidelity: 'Die Übersetzung gibt den hebräischen Befund zuverlässig wieder: Die Serafim befinden sich über dem in V. 1 genannten Herrn; die Aussage über sechs Flügel ist distributiv auf jedes Wesen bezogen; die drei Zweiergruppen von Flügeln dienen dem Bedecken des Gesichts, dem Bedecken der Füße und dem Fliegen. Das deutsche Präteritum ist für die visionäre Beschreibung angemessen.'
