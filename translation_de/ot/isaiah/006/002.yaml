id: ISA.6.2
reference: Isaiah 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: de
  text: 'Serafim standen über ihm. Jeder hatte sechs Flügel: Mit zweien bedeckte er sein Gesicht[a], mit zweien bedeckte er seine Füße, und mit zweien flog er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Serafe«; die Bezeichnung hängt möglicherweise mit einem Wortstamm zusammen, der »brennen« bedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָפִים
  choice: Serafim
  rationale: Die herkömmliche deutsche Bezeichnung bewahrt den besonderen Namen dieser himmlischen Wesen; die mögliche Herleitung als »Brennende« bleibt wegen ihrer Unsicherheit in der Fußnote.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip beschreibt die Haltung der Wesen in der Vision; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: מִמַּעַל לוֹ
  choice: über ihm
  rationale: Die Wendung bezeichnet ihre räumliche Stellung über dem im vorigen Vers genannten Herrn.
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
  choice: Jeder hatte sechs Flügel
  rationale: Die verteilende Aussage des Hebräischen wird klar und idiomatisch wiedergegeben, ohne die schwerfällige Wiederholung wörtlich nachzubilden.
- source_word: בִּשְׁתַּיִם
  choice: mit zweien
  rationale: Das instrumentale ב wird natürlich mit »mit« wiedergegeben; »zweien« verweist eindeutig auf die Flügel.
- source_word: יְכַסֶּה
  choice: bedeckte er
  rationale: Der Singular entspricht dem verteilenden »jeder« und beschreibt im visionären Bericht die jeweilige Handlung.
- source_word: פָנָיו
  choice: sein Gesicht
  rationale: Direkte Wiedergabe des singularischen Nomens mit Possessivsuffix.
- source_word: רַגְלָיו
  choice: seine Füße
  rationale: »Füße« ist hier die übliche und kontextgemäße Bedeutung; »Beine« wäre weniger präzise.
- source_word: יְעוֹפֵף
  choice: flog er
  rationale: Das Präteritum fügt sich in die Abfolge der visionär beschriebenen Handlungen und wahrt den distributiven Singular.
theological_decisions:
- issue: Wörtliche Übersetzung oder Beibehaltung von שְׂרָפִים als Bezeichnung himmlischer Wesen
  choice: Serafim
  alternative: die Brennenden
  rationale: Der Kontext bezeichnet eine bestimmte Gruppe himmlischer Wesen. Die Transliteration vermeidet, eine mögliche Etymologie zur sicheren inhaltlichen Deutung zu machen.
- issue: Referent des Suffixes in לוֹ
  choice: über ihm
  alternative: darüber
  rationale: Der unmittelbare Bezug ist der im vorherigen Vers auf dem Thron sitzende Herr; die personale Wiedergabe erhält diesen Bezug.
- issue: Wiedergabe der distributiven Singularformen
  choice: Jeder hatte ... er
  alternative: Sie hatten jeweils ... sie
  rationale: Der Singular bildet den hebräischen Wechsel zur Einzelperspektive genauer ab, ohne die Serafim als unpersönliche Wesen darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Serafim« folgt dem etablierten deutschen biblischen Sprachgebrauch; Satzbau und Verbformen bleiben klar und gut verständlich.
