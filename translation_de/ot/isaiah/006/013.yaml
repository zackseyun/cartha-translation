base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: de
  text: Und selbst wenn darin noch ein Zehntel bleibt, wird es wieder verbrannt werden – wie eine Terebinthe oder eine Eiche, bei denen nach dem Fällen ein Stumpf stehen bleibt.[a] Der heilige Same ist ihr Stumpf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim Laubfall“ / „wenn ihre Blätter fallen“. Das hebräische Wort בְּשַׁלֶּכֶת ist schwer zu deuten; der Haupttext versteht es aufgrund des anschließenden Stumpfbildes vom Fällen des Baumes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד בָּהּ עֲשִׂרִיָּה
  choice: Und bleibt darin noch ein Zehntel
  rationale: Die Wendung bezeichnet einen weiterhin vorhandenen Rest. Die deutsche Voranstellung mit „bleibt … noch“ gibt den fortdauernden und im Zusammenhang konzessiven Sinn natürlich wieder.
- source_word: וְשָׁבָה
  choice: wird auch dieses wieder
  rationale: שׁוב bezeichnet hier die Wiederholung des folgenden Geschehens. „wieder“ wahrt diesen Rückbezug; „auch dieses“ macht deutlich, dass selbst das verbliebene Zehntel betroffen ist, ohne einen neuen Referenten einzuführen.
- source_word: וְהָיְתָה לְבָעֵר
  choice: wird … der Vernichtung preisgegeben
  rationale: Die Konstruktion bezeichnet, dass der Rest erneut dem Verzehren beziehungsweise Beseitigen anheimfällt. „der Vernichtung preisgegeben“ bewahrt den Gerichtssinn, ohne das nicht völlig eindeutige Verb unnötig auf Verbrennen durch Feuer festzulegen.
- source_word: כָּאֵלָה וְכָאַלּוֹן
  choice: wie eine Terebinthe oder eine Eiche
  rationale: Die beiden konkreten Baumarten bleiben erhalten. Das deutsche „oder“ stellt sie idiomatisch als parallele Vergleichsbilder dar.
- source_word: בְּשַׁלֶּכֶת
  choice: wenn sie gefällt wird
  rationale: Das seltene und umstrittene Wort wird im Haupttext entsprechend dem unmittelbar folgenden Stumpfbild auf das Fällen des Baumes bezogen. Die mögliche Deutung als Laubfall wird in der Fußnote bewahrt.
- source_word: מַצֶּבֶת בָּם
  choice: deren Stumpf stehen bleibt
  rationale: מַצֶּבֶת bezeichnet im Baumbild den stehen gebliebenen Stock oder Stumpf. Die Formulierung verbindet diese Bedeutung idiomatisch mit dem deutschen Relativsatz.
- source_word: זֶרַע קֹדֶשׁ
  choice: Heiliger Same
  rationale: Die knappe, artikellose Wiedergabe wahrt das hebräische Bild und legt nicht fest, ob damit der treue Rest, das fortbestehende Bundesvolk oder eine messianische Linie gemeint ist.
- source_word: מַצַּבְתָּהּ
  choice: ist ihr Stumpf
  rationale: Dasselbe Stumpfbild wie zuvor wird wiederaufgenommen. Das feminine „ihr“ lässt den Rückbezug auf das im Zusammenhang vorausgesetzte Land beziehungsweise die betroffene Größe offen.
theological_decisions:
- issue: Identität des „heiligen Samens“
  choice: 'Die Aussage bleibt bildhaft und ohne nähere Identifizierung: „Heiliger Same ist ihr Stumpf.“'
  alternative: Ausdrückliche Deutung als treuer Rest Israels, als fortbestehendes Bundesvolk oder als messianischer Same.
  rationale: Der Vers spricht von einem geheiligten überlebenden Kern, bestimmt dessen Identität aber nicht näher. Die Übersetzung bewahrt daher die theologische Spannung und vermeidet eine konfessionelle Festlegung.
- issue: Art der erneuten Vernichtung
  choice: „der Vernichtung preisgegeben“
  alternative: „zum Verbrennen bestimmt“ oder „wird abgeholzt“
  rationale: Das hebräische לְבָעֵר kann Verzehren, Beseitigen oder Vernichten bezeichnen. Die gewählte Formulierung hält den Gerichtssinn fest, ohne die Art der Zerstörung enger zu bestimmen, als der Ausgangstext sicher erlaubt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Satzbau bleibt bildhaft und relativ nah am Hebräischen; veraltete Wendungen und konfessionell geprägte Deutungen werden vermieden.
