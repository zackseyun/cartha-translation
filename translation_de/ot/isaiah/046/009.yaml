source:
  edition: WLC
  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
translation:
  language: de
  text: Erinnert euch an das Frühere von alters her[a]; denn ich bin Gott, und es gibt keinen anderen Gott, niemand ist mir gleich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „aus uralter Zeit“. Der hebräische Ausdruck bezeichnet hier die ferne Vergangenheit, nicht unbedingt die Ewigkeit im abstrakten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt an
  rationale: Der Imperativ Plural fordert die Angesprochenen zum bewussten Erinnern auf. „Denkt an“ ist im modernen Deutsch natürlicher als das hier schwerfällige „Erinnert euch an“.
- source_word: רִאשֹׁנוֹת
  choice: das Frühere
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet frühere Geschehnisse oder Taten. „Das Frühere“ bewahrt den für Jesaja wichtigen Gegensatz zwischen Früherem und Kommendem.
- source_word: מֵעוֹלָם
  choice: aus längst vergangener Zeit
  rationale: עוֹלָם bezeichnet hier die ferne Vergangenheit, nicht zwingend abstrakte Ewigkeit. Die Formulierung gibt diesen zeitlichen Sinn klar und idiomatisch wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Aufforderung zum Erinnern ein.
- source_word: אָנֹכִי אֵל
  choice: ich bin Gott
  rationale: אֵל ist hier eine Bezeichnung für Gott und kein Eigenname, der transliteriert werden müsste.
- source_word: וְאֵין עוֹד
  choice: und sonst gibt es keinen
  rationale: Die hebräische Wendung drückt Ausschließlichkeit aus. „Sonst gibt es keinen“ ist knapp, natürlich und bewahrt diese Aussage.
- source_word: אֱלֹהִים
  choice: Ich bin Gott
  rationale: Der zweite Nominalsatz wird im Deutschen mit dem aus dem ersten Satz ergänzten Subjekt und Verb verständlich wiedergegeben; die Wiederholung erhält den Nachdruck des Hebräischen.
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: und niemand ist wie ich
  rationale: Die Wendung erklärt Gottes Unvergleichlichkeit. „Niemand“ passt im Deutschen zur personalen Selbstaussage, ohne zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Göttliche Selbstbezeichnung und Ausschließlichkeit
  choice: Beide Gottesbezeichnungen werden mit „Gott“ wiedergegeben; die parallelen Aussagen über Gottes Einzigkeit und Unvergleichlichkeit bleiben vollständig erhalten.
  alternative: אֵל als „El“ oder „mächtiger Gott“ wiedergeben beziehungsweise die zweite Nennung von „Gott“ nur implizit lassen.
  rationale: Der hebräische Text bekräftigt in parallelen Gliedern, dass Gott allein Gott und mit niemandem vergleichbar ist. Die gewählte Fassung bewahrt diesen Nachdruck, ohne eine über den Text hinausgehende dogmatische Präzisierung vorzunehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Pluralimperativ richtet sich an mehrere Angesprochene. Die Wiederholung „Ich bin Gott“ erhält die rhetorische Betonung des Ausgangstextes.
