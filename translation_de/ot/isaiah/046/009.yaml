revisions:
- from: Denkt an das Frühere aus längst vergangener Zeit[a]; denn ich bin Gott, und sonst gibt es keinen. Ich bin Gott, und niemand ist wie ich.
  to: Erinnert euch an das Frühere von alters her[a]; denn ich bin Gott, und es gibt keinen anderen Gott, niemand ist mir gleich.
  rationale: 'Die Revision beseitigt die stilistische Doppelung am Versanfang und stellt die hebräische Konstruktion genauer dar: Gottes Selbstbezeichnung wird gefolgt von der Aussage, dass es keinen anderen Gott gibt, und von seiner Unvergleichlichkeit. Die Fußnote bleibt an der Zeitangabe verankert und wahrt die nicht-metaphysische Lesart von מֵעוֹלָם.'
