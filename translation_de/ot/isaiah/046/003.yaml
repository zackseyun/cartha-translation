  text: שִׁמְע֤וּ אֵלַ/י֙ בֵּ֣ית יַעֲקֹ֔ב וְ/כָל שְׁאֵרִ֖ית בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/עֲמֻסִים֙ מִנִּי בֶ֔טֶן הַ/נְּשֻׂאִ֖ים מִנִּי רָֽחַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: de
  text: 'Hört auf mich, Haus Jakob, und ihr alle, die ihr der Rest des Hauses Israel seid: Ihr seid vom Mutterleib an von mir getragen und vom Mutterschoß an von mir emporgehoben worden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen hier zwei verwandte Wendungen: „vom Leib an“ und „vom Mutterschoß an“. Sie bezeichnen parallel die früheste Lebenszeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Der Pluralimperativ fordert zu aufmerksamem Hören und Beachten auf. „Hört auf mich“ ist im heutigen Deutsch natürlich und bewahrt den nachdrücklichen Aufruf.
- source_word: בֵּית יַעֲקֹב
  choice: Haus Jakob
  rationale: Die feste biblische Bezeichnung für die von Jakob abstammende Gemeinschaft bleibt erhalten, statt sie als „Nachkommen Jakobs“ auszudeuten.
- source_word: וְכָל שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: und der ganze Rest des Hauses Israel
  rationale: „Rest“ bewahrt den in Jesaja wichtigen prophetischen Leitbegriff שְׁאֵרִית und zugleich die kollektive Formulierung des Hebräischen.
- source_word: הַעֲמֻסִים
  choice: ihr wurdet … getragen
  rationale: Das passive Partizip von עמס bezeichnet hier das Getragenwerden. Die Wiedergabe lässt den Kontrast zu den von Menschen getragenen Götzen in den vorangehenden Versen erkennen.
- source_word: הַנְּשֻׂאִים
  choice: auf den Armen gehalten
  rationale: Das passive Partizip von נשׂא bedeutet „getragen/hochgehoben“. Die Formulierung vermeidet eine unbeholfene Wiederholung und erhält das fürsorgliche Bild, ohne die Aussage auf eine bestimmte Tragweise festzulegen.
- source_word: מִנִּי בֶטֶן … מִנִּי רָחַם
  choice: vom Mutterleib an … vom Mutterschoß an
  rationale: מִנִּי bezeichnet in beiden parallelen Wendungen den zeitlichen Ausgangspunkt. Die beiden deutschen Ausdrücke bewahren die poetische Parallelität und unterscheiden zugleich בטן und רחם.
theological_decisions:
- issue: Prophetischer Begriff „Rest“
  choice: der ganze Rest
  alternative: alle, die übrig geblieben sind
  rationale: Die substantivische Wiedergabe wahrt die literarische und theologische Kontinuität des in Jesaja wiederkehrenden Begriffs, ohne ihn zusätzlich zu deuten.
- issue: Handelnder bei den passiven Partizipien
  choice: Passiv ohne ausdrücklich ergänztes „von mir“
  alternative: die ich … getragen habe
  rationale: Der Zusammenhang macht Gott als den Tragenden deutlich, doch der hebräische Wortlaut nennt den Handelnden hier nicht ausdrücklich; מִנִּי gehört jeweils zur Zeitangabe „vom Mutterleib/Mutterschoß an“. Das Passiv bewahrt daher sowohl die Grammatik als auch die kontextuelle Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Anredewechsel zum ausdrücklichen „Ihr“ macht die hebräischen passiven Partizipien verständlich. Der zweite Satz erhöht die Lesbarkeit, ohne die syntaktische Zugehörigkeit zur Anrede aufzulösen.
