id: ISA.46.8
reference: Isaiah 46:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: de
  text: Denkt daran und nehmt euch zusammen[a]! Nehmt es euch zu Herzen[b], ihr Abtrünnigen[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das entsprechende hebräische Verb ist sehr selten. Möglich sind auch: „zeigt euch standhaft“, „seid stark“ oder „fasst Mut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Bringt es auf das Herz zurück“; gemeint ist, dass sie es ernsthaft bedenken sollen.'
    reason: literal_rendering
  - marker: c
    text: 'Oder: „ihr Auflehnenden“ beziehungsweise „ihr Übertreter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt daran
  rationale: Der Imperativ Plural von זכר fordert dazu auf, sich das zuvor Gesagte bewusst in Erinnerung zu rufen. „Denkt daran“ ist im heutigen Deutsch direkt und natürlich.
- source_word: זֹאת
  choice: daran
  rationale: Das feminine Singular-Demonstrativ bezeichnet die betreffende Sache. Im Deutschen gibt „daran“ die Verbindung mit dem Verb idiomatisch wieder, ohne den singularischen Bezug aufzulösen.
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: und nehmt euch zusammen
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein Sich-Festigen oder Sich-Aufraffen. „Nehmt euch zusammen“ bewahrt den auffordernden Charakter und vermeidet sowohl die unsichere Deutung „schämt euch“ als auch eine unnötig männliche Formulierung.
- source_word: הָשִׁיבוּ … עַל־לֵב
  choice: Nehmt es euch zu Herzen
  rationale: 'Wörtlich steht „bringt es auf das Herz zurück“. Die deutsche Wendung gibt den idiomatischen Sinn wieder: etwas ernsthaft bedenken und innerlich beherzigen.'
- source_word: פוֹשְׁעִים
  choice: ihr Abtrünnigen
  rationale: Das substantivisch gebrauchte Partizip von פשע bezeichnet Menschen, die sich auflehnen oder treulos abfallen. „Abtrünnige“ wahrt den religiös-moralischen Beziehungsbruch, ohne ihn auf einen einzelnen Gesetzesverstoß zu verengen.
theological_decisions:
- issue: Charakter der angesprochenen Personen
  choice: Abtrünnige
  alternative: Auflehnende; Übertreter
  rationale: פוֹשְׁעִים kann sowohl rebellisches Aufbegehren als auch Übertretung bezeichnen. „Abtrünnige“ hält den Gedanken bewusster Untreue fest; die Fußnote bewahrt die weiteren Bedeutungsnuancen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Imperative bleiben eindringlich und parallel. Die seltene Verbform wird im Haupttext idiomatisch wiedergegeben; ihre echte lexikalische Unsicherheit bleibt in der Fußnote ausdrücklich sichtbar.
