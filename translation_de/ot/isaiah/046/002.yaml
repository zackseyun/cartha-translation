source:
  edition: WLC
  text: קָרְס֤וּ כָֽרְעוּ֙ יַחְדָּ֔ו לֹ֥א יָכְל֖וּ מַלֵּ֣ט מַשָּׂ֑א וְ/נַפְשָׁ֖/ם בַּ/שְּׁבִ֥י הָלָֽכָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
translation:
  language: de
  text: Sie sinken nieder[a]; sie beugen sich zugleich. Sie können die Last nicht retten, und sie selbst[b] gehen in die Gefangenschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie kauern nieder“ oder „Sie brechen zusammen“. Das hebräische Verb bezeichnet ein Niedersinken und kann auch einen Zusammenbruch nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und ihre Seele geht in die Gefangenschaft“ oder „und ihr Leben geht in die Gefangenschaft“. Das hebräische Wort näfäsch kann „Seele“, „Leben“ oder „die eigene Person“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  choice: sie sinken nieder
  rationale: Das Verb bezeichnet ein Niedersinken oder Zusammenbrechen. „Sinken nieder“ wahrt das Bild und lässt offen, ob ein vollständiger Zusammenbruch gemeint ist.
- source_word: כָרְעוּ
  choice: sie beugen sich
  rationale: Das Verb kann Knien oder tiefes Sichbeugen bezeichnen. Hier bewahrt die Formulierung die ironische Darstellung der selbst niedergebeugten Götterbilder.
- source_word: יַחְדָּו
  choice: alle zugleich
  rationale: Gibt das gemeinsame, gleichzeitige Niedersinken im Deutschen natürlich wieder.
- source_word: לֹא יָכְלוּ מַלֵּט
  choice: sie können … nicht retten
  rationale: Die Wendung drückt Unvermögen aus; מלט im Kausativ bedeutet entkommen lassen, befreien oder retten.
- source_word: מַשָּׂא
  choice: die Last
  rationale: Bezeichnet das Getragene beziehungsweise die Fracht; „Last“ erhält die knappe Mehrdeutigkeit des Kontextes.
- source_word: וְנַפְשָׁם
  choice: und sie selbst
  rationale: נֶפֶשׁ kann Leben, Seele oder die eigene Person bezeichnen. Die reflexive Wiedergabe ist idiomatisch, während eine Fußnote die wörtlichere Möglichkeit offenhält.
- source_word: בַּשְּׁבִי הָלָכָה
  choice: gehen in die Gefangenschaft
  rationale: שְׁבִי bezeichnet Gefangenschaft; das Perfekt wird innerhalb der lebhaften prophetischen Darstellung präsentisch wiedergegeben.
theological_decisions:
- issue: Personifizierung der Götterbilder im letzten Satzglied
  choice: „sie selbst gehen in die Gefangenschaft“
  alternative: „und ihre Seele/ihr Leben geht in die Gefangenschaft“
  rationale: Die idiomatische Wiedergabe erhält den Spott über die Ohnmacht der Götterbilder, ohne die Aussage in eine anthropologische Lehre über ihre „Seele“ umzudeuten. Die echte Bedeutungsbreite von נֶפֶשׁ wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Ironie der niedergebeugten, hilflosen Götterbilder bleiben erhalten; die Präsensformen geben die prophetische Szene lebhaft wieder.
