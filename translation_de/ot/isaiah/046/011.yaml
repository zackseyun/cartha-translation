base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/011.yaml
  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: de
  text: der aus dem Osten einen Raubvogel[b] ruft, aus fernem Land den Mann meines Ratschlusses.[a] Ja, ich habe geredet; ja, ich werde es herbeiführen. Ich habe es geformt; ja, ich werde es vollbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Konsonantentext hat: „den Mann seines Ratschlusses“; die traditionelle Lesung lautet: „den Mann meines Ratschlusses“.'
    reason: textual_variant
  - marker: b
    text: Die aus dem Osten gerufene Gestalt wird im größeren Zusammenhang häufig als Kyrus verstanden; in diesem Vers wird er jedoch nicht namentlich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: קֹרֵא
  choice: der … ruft
  rationale: Das maskuline Qal-Partizip beschreibt Gott und setzt die Selbstbeschreibung des vorangehenden Zusammenhangs fort. Die relative Form bewahrt diese syntaktische Verbindung besser als ein neuer selbstständiger Hauptsatz.
- source_word: מִמִּזְרָח
  choice: aus dem Osten
  rationale: מִזְרָח bezeichnet hier die Himmelsrichtung beziehungsweise den Ort des Sonnenaufgangs; „aus dem Osten“ ist im Deutschen natürlich und sachlich passend.
- source_word: עַיִט
  choice: einen Raubvogel
  rationale: Das Wort bezeichnet allgemein einen jagenden beziehungsweise reißenden Vogel, ohne eine bestimmte Vogelart festzulegen.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: aus fernem Land
  rationale: Die knappe deutsche Wendung gibt die räumliche Ferne wieder und erhält den parallelen Satzbau.
- source_word: אִישׁ עֲצָתוֹ / אִישׁ עֲצָתִי
  choice: den Mann meines Ratschlusses
  rationale: Im überlieferten Zusammenhang ist Gottes eigener Plan gemeint. „Ratschluss“ bewahrt sowohl den Gedanken eines überlegten Plans als auch die knappe Genitivkonstruktion, ohne die Ausführung dieses Plans bereits in die Bezeichnung hineinzulesen.
- source_word: אַף
  choice: ja
  rationale: Das dreimalige אַף bekräftigt jeweils die folgende Aussage. Das wiederholte „ja“ erhält die emphatische Struktur in natürlichem Deutsch.
- source_word: דִּבַּרְתִּי
  choice: ich habe geredet
  rationale: Das Perfekt bezeichnet die bereits ergangene göttliche Aussage; das deutsche Perfekt stellt ihren fortdauernden Geltungsanspruch heraus.
- source_word: אֲבִיאֶנָּה
  choice: ich werde es herbeiführen
  rationale: Das feminine Suffix verweist am ehesten auf das angekündigte Vorhaben beziehungsweise Geschehen. „Herbeiführen“ gibt die kausative Erfüllung idiomatisch wieder.
- source_word: יָצַרְתִּי
  choice: ich habe es geformt
  rationale: Die Übersetzung bewahrt die konkrete Bildsprache von יָצַר („formen, gestalten“) und damit Gottes absichtsvolle Gestaltung des Vorhabens.
- source_word: אֶעֱשֶׂנָּה
  choice: ich werde es vollbringen
  rationale: „Vollbringen“ gibt in diesem Zusammenhang die tatsächliche Ausführung des angekündigten und geformten Vorhabens klar und würdig wieder.
theological_decisions:
- issue: Identität des Raubvogels beziehungsweise des Mannes aus fernem Land
  choice: Die bildhafte Bezeichnung wird im Haupttext ohne Namensnennung wiedergegeben.
  alternative: Die Gestalt ausdrücklich mit Kyrus gleichsetzen.
  rationale: Der größere Zusammenhang legt Kyrus als historischen Bezug nahe, doch dieser Vers nennt ihn nicht. Die Übersetzung wahrt deshalb die Bildsprache und überlässt die Identifikation der Auslegung.
- issue: Bezug der femininen Suffixe in אֲבִיאֶנָּה und אֶעֱשֶׂנָּה
  choice: Das deutsche „es“ bezieht sich auf Gottes angekündigtes Vorhaben beziehungsweise Geschehen.
  alternative: Die Suffixe mit „ihn“ auf den genannten Mann beziehen.
  rationale: Die feminine Form spricht gegen einen direkten Bezug auf den maskulinen אִישׁ. Das unbestimmte „es“ erhält den impliziten Bezug, ohne ein nicht ausdrücklich genanntes Bezugswort festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, paralleler Satzführung. „Ratschluss“ ist leicht gehoben, bewahrt aber die theologische und semantische Spannung zwischen Plan, Beratung und festem Vorhaben. Die Wiederholung von „ja“ bildet den dreifachen Nachdruck des Hebräischen ab.
