  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
translation:
  language: de
  text: Hört auf mich, ihr mit verstocktem Herzen[a], die ihr fern von Gerechtigkeit seid[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die stark oder mächtig an Herz sind“; im Zusammenhang bezeichnet dies wahrscheinlich ein unbeugsames oder verstocktes Herz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „fern vom Recht“; möglicherweise ist auch Gottes rettende Rechtserweisung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Der Pluralimperativ שִׁמְעוּ fordert nicht nur zum akustischen Hören, sondern zum Beachten auf. „Hört auf mich“ gibt die Verbindung mit אֵלַי im heutigen Deutsch natürlich wieder.
- source_word: אַבִּירֵי לֵב
  choice: die ihr ein unnachgiebiges Herz habt
  rationale: Wörtlich bedeutet die Wendung etwa „stark/mächtig an Herz“. Im Zusammenhang der prophetischen Zurechtweisung bezeichnet sie wahrscheinlich eine innerlich unbeugsame, verstockte Haltung. Die Formulierung bewahrt das Bild des Herzens, ohne positive Tapferkeit nahezulegen.
- source_word: הָרְחוֹקִים
  choice: fern … seid
  rationale: Das substantivierte Partizip beschreibt die Angeredeten als solche, die sich in großer Entfernung befinden. Ein deutscher Relativsatz verbindet diese Bestimmung klar mit der direkten Anrede.
- source_word: מִצְּדָקָה
  choice: von Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit, gerechtes Handeln oder rettende Rechtserweisung bezeichnen. „Gerechtigkeit“ erhält im Haupttext die Breite des hebräischen Begriffs.
theological_decisions:
- issue: Bedeutung von אַבִּירֵי לֵב
  choice: unnachgiebiges Herz
  alternative: starken Herzens / hartherzig
  rationale: Die negative Aussageabsicht des Kontexts spricht für Unnachgiebigkeit oder Verstocktheit; zugleich bleibt durch „Herz“ die hebräische Bildsprache sichtbar. Die mögliche wörtlichere Lesart wird in der Fußnote bewahrt.
- issue: Bedeutung von צְדָקָה
  choice: Gerechtigkeit
  alternative: Recht / Rechtfertigung oder rettende Rechtserweisung
  rationale: Der Ausdruck kann sowohl moralische Gerechtigkeit als auch Gottes gerechtes oder rettendes Eingreifen bezeichnen. Der breite deutsche Begriff „Gerechtigkeit“ legt den Vers nicht unnötig auf nur eine dieser Dimensionen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung bleibt kräftig; die beiden parallelen Kennzeichnungen der Angeredeten werden in einem flüssigen deutschen Satz verbunden. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
