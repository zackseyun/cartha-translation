  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: de
  text: 'Bel geht in die Knie, Nebo sinkt nieder.


    Ihre Götzenbilder[a] werden auf Tiere und Vieh geladen.


    Eure Traglasten[b] sind aufgeladen,


    eine Last für das erschöpfte Tier.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Bilder«. Das hebräische Wort bezeichnet gefertigte Kultbilder und hat hier einen polemischen Klang.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck ist schwierig. Gemeint sind wahrscheinlich die getragenen oder zu transportierenden Kultbilder beziehungsweise Kultgegenstände.
    reason: textual_difficulty
  - marker: c
    text: 'Wörtlich: »eine Last für die Erschöpfte«. Die feminine Einzahl bezieht sich wahrscheinlich auf ein mitgedachtes Lasttier; möglich ist auch ein kollektiver Bezug auf die müden Tiere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: geht in die Knie
  rationale: Das Qal-Perfekt schildert Bels Zusammenbrechen bzw. seine Demütigung. Das deutsche Präsens gibt die prophetische Szene anschaulich wieder.
- source_word: בֵּל
  choice: Bel
  rationale: Der Eigenname der babylonischen Gottheit wird transliteriert.
- source_word: קֹרֵס
  choice: sinkt nieder
  rationale: Das Partizip bezeichnet ein Niedersinken oder Zusammenbrechen und bildet eine natürliche Parallele zu »geht in die Knie«.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Der Eigenname der babylonischen Gottheit wird transliteriert.
- source_word: עֲצַבֵּיהֶם
  choice: ihre Götzenbilder
  rationale: עֶצֶב bezeichnet hier gefertigte Kultbilder; »Götzenbilder« bewahrt sowohl den konkreten Bildcharakter als auch die prophetische Polemik.
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: auf Tiere und Vieh
  rationale: Die beiden Tierbezeichnungen werden als allgemeiner Ausdruck und als Bezeichnung für Nutzvieh wiedergegeben. »Auf« verdeutlicht im Zusammenhang, dass die Bilder den Tieren aufgeladen werden.
- source_word: נְשֻׂאֹתֵיכֶם
  choice: was ihr getragen habt
  rationale: Die schwierige Form bezeichnet wahrscheinlich die von den Verehrern getragenen Kultgegenstände. Die Wiedergabe wahrt den Wechsel zur zweiten Person und lässt den genauen Gegenstand unausgesprochen.
- source_word: עֲמוּסוֹת
  choice: wird ihnen aufgeladen
  rationale: Das passive Partizip von עמס beschreibt das Aufladen als Fracht. Das ergänzte »ihnen« nimmt die zuvor genannten Tiere auf.
- source_word: מַשָּׂא
  choice: eine Last
  rationale: מַשָּׂא bezeichnet eine getragene Last und hebt die Ironie hervor, dass die vermeintlichen Götter selbst getragen werden müssen.
- source_word: לַעֲיֵפָה
  choice: für das erschöpfte Tier
  rationale: Das feminine Singularadjektiv »erschöpft« bezieht sich wahrscheinlich auf ein mitgedachtes Lasttier. Die Übersetzung macht diesen im Deutschen nötigen Bezug behutsam deutlich.
theological_decisions:
- issue: Bezeichnung der heidnischen Kultbilder
  choice: Götzenbilder
  alternative: Bilder
  rationale: Im prophetischen Zusammenhang bezeichnet das Wort nicht wertneutral Kunstwerke, sondern als Gottheiten verehrte Bilder. »Götzenbilder« erhält diese Kritik, ohne über den Text hinaus eine bestimmte konfessionelle Deutung einzutragen.
- issue: Darstellung der Ohnmacht Bels und Nebos
  choice: Die Gottheiten selbst gehen in die Knie beziehungsweise sinken nieder, während ihre Bilder als Last transportiert werden.
  alternative: Nur die Standbilder kippen oder beugen sich.
  rationale: Der Text nennt zunächst die Gottheiten und danach ausdrücklich ihre Kultbilder. Die Übersetzung bewahrt diese rhetorische Spannung, statt beide Aussagen stillschweigend gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen poetischen Zeilen. Die konkrete Lasttier-Szene und die ironische Umkehrung – die Götter müssen selbst getragen werden – bleiben deutlich. Schwierige Bezüge werden im Haupttext lesbar gestaltet und in den Fußnoten offengelegt.
