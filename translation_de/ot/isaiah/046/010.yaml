base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: de
  text: 'der ich von Anfang an das Ende verkünde und von alters her verkünde, was noch nicht geschehen ist[a], der ich sage: »Mein Plan wird Bestand haben[b], und alles, woran ich Gefallen habe, werde ich tun[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was nicht getan worden ist“; auch: „was noch nicht vollbracht ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mein Ratschluss wird Bestand haben.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „alles, was ich will“, beziehungsweise: „alles, was ich wünsche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: verkünde
  rationale: Das Hifil-Partizip von נגד bezeichnet das Bekanntmachen oder Verkünden. „Verkünde“ wahrt den gehobenen prophetischen Ton und schließt als partizipiale Selbstbeschreibung an den Kontext an.
- source_word: מֵרֵאשִׁית ... אַחֲרִית
  choice: von Anfang an das Ende
  rationale: Die direkte zeitliche Gegenüberstellung von רֵאשִׁית und אַחֲרִית wird im Deutschen klar und knapp bewahrt.
- source_word: וּמִקֶּדֶם
  choice: und seit alters
  rationale: קֶדֶם bezeichnet hier eine weit zurückliegende Zeit. „Seit alters“ ist würdig und idiomatisch, ohne den Parallelismus unnötig auszubauen.
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: was noch nicht geschehen ist
  rationale: Der Niphal von עשה lautet formal „was nicht getan worden ist“, bezeichnet im Zusammenhang aber noch nicht eingetretene beziehungsweise bewirkte Ereignisse. Die Hauptfassung gibt diesen Sinn in natürlichem Deutsch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: עֲצָתִי
  choice: mein Plan
  rationale: עֵצָה kann Rat, Ratschluss, Plan oder Absicht bedeuten. „Plan“ ist im heutigen Deutsch klar und bezeichnet hier Gottes feststehende Absicht, ohne zusätzliche dogmatische Präzisierung.
- source_word: תָקוּם
  choice: wird Bestand haben
  rationale: קום drückt hier Festigkeit, Fortbestand und Gültigkeit aus. „Bestand haben“ überträgt die Metapher natürlich ins Deutsche.
- source_word: וְכָל חֶפְצִי
  choice: alles, woran ich Gefallen habe
  rationale: חֵפֶץ umfasst Gefallen, Wunsch und Willen. Die Formulierung bewahrt den Aspekt des Gefallens, ohne das Wort auf bloßen Willen zu verengen.
- source_word: אֶעֱשֶׂה
  choice: werde ich tun
  rationale: Die Grundbedeutung von עשה ist „tun/machen“. „Tun“ ist hier verständlich und lässt offen, ob der Akzent auf Ausführung oder Herbeiführung liegt.
theological_decisions:
- issue: Gottes Absicht und Gefallen in עֲצָתִי und חֶפְצִי
  choice: Mein Plan wird Bestand haben, und alles, woran ich Gefallen habe, werde ich tun.
  alternative: Mein Ratschluss wird bestehen, und alles, was ich will, werde ich ausführen.
  rationale: Die Fassung bringt die Wirksamkeit der göttlichen Absicht zum Ausdruck, bewahrt zugleich aber den eigenen Bedeutungsakzent von חֵפֶץ als Gefallen oder Wunsch. Sie vermeidet eine Verengung auf eine bestimmte systematisch-theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Relativanschluss „der ich“ bewahrt die syntaktische Verbindung zum vorausgehenden Kontext. „Seit alters“ ist leicht gehoben, aber allgemein verständlich. Die Satzstellung im letzten Glied erhält die feierliche Parallelität, ohne archaisch zu wirken.
