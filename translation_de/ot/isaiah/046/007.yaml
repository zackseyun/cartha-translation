  text: יִ֠שָּׂאֻ/הוּ עַל כָּתֵ֨ף יִסְבְּלֻ֜/הוּ וְ/יַנִּיחֻ֤/הוּ תַחְתָּי/ו֙ וְ/יַֽעֲמֹ֔ד מִ/מְּקוֹמ֖/וֹ לֹ֣א יָמִ֑ישׁ אַף יִצְעַ֤ק אֵלָי/ו֙ וְ/לֹ֣א יַעֲנֶ֔ה מִ/צָּרָת֖/וֹ לֹ֥א יוֹשִׁיעֶֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: de
  text: Sie heben ihn auf die Schulter, tragen ihn und stellen ihn an seinen Platz.[a] Dort steht er und rührt sich nicht von der Stelle. Selbst wenn jemand zu ihm schreit, antwortet er nicht und rettet diesen Menschen nicht aus seiner Not.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie stellen ihn unter ihn/sich“. Gemeint ist wahrscheinlich, dass sie das Götzenbild an seinem Platz oder auf seinem Sockel abstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֻהוּ עַל כָּתֵף
  choice: Sie heben ihn auf die Schulter
  rationale: נשׂא bezeichnet hier das Hochheben des Götzenbildes; „auf die Schulter“ gibt die gerichtete Bewegung und den idiomatischen Singular wieder.
- source_word: יִסְבְּלֻהוּ
  choice: tragen ihn
  rationale: סבל bezeichnet das Tragen einer Last. „tragen“ ist natürlich und unterscheidet diesen Vorgang vom vorhergehenden Hochheben.
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: und stellen ihn an seinen Platz
  rationale: Die wörtliche Formulierung „unter ihn/sich“ ist im Deutschen unklar; im Zusammenhang ist wahrscheinlich das Abstellen an seinem vorgesehenen Ort oder auf seinem Sockel gemeint. Die Fußnote bewahrt den auffälligen Wortlaut.
- source_word: וְיַעֲמֹד מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: Dort steht er und rührt sich nicht von der Stelle
  rationale: Die Formulierung erhält das Bild der unbeweglichen Statue; „sich nicht von der Stelle rühren“ ist gegenwärtiges, idiomatisches Deutsch.
- source_word: אַף יִצְעַק אֵלָיו
  choice: Selbst wenn jemand zu ihm schreit
  rationale: אַף verstärkt hier den einräumenden Gedanken. Das unbestimmte „jemand“ gibt das generisch gebrauchte maskuline Singularsubjekt wieder.
- source_word: וְלֹא יַעֲנֶה
  choice: antwortet er nicht
  rationale: ענה bezeichnet die ausbleibende Antwort auf einen Hilferuf oder ein Gebet.
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: und rettet diesen Menschen nicht aus seiner Not
  rationale: ישע im Hifil bedeutet „retten“, צָרָה „Not/Bedrängnis“. „diesen Menschen“ macht den Rückbezug auf „jemand“ eindeutig, ohne den Singular in einen Plural umzuwandeln.
theological_decisions:
- issue: Generisches Maskulinum im Hilferuf und in der Schlussaussage
  choice: „jemand … diesen Menschen … aus seiner Not“
  alternative: „er … ihn … aus seiner Not“ oder ein pluralisches „sie/ihre“
  rationale: Das hebräische Maskulinum Singular ist generisch. Die gewählte Form bleibt singularisch und geschlechtsübergreifend verständlich, während „diesen Menschen“ eine mögliche Verwechslung der deutschen Pronomen für den Götzen und den Hilfesuchenden vermeidet.
- issue: Tatsächliches Versagen oder ausdrückliche Unfähigkeit des Götzen
  choice: „antwortet er nicht und rettet … nicht“
  alternative: „kann weder antworten noch retten“
  rationale: Der hebräische Text verneint die Handlungen, formuliert aber kein ausdrückliches Modalverb. Die Übersetzung bewahrt diese Aussageform und verschärft sie nicht zu einer expliziten Unfähigkeitsbehauptung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge der Handlungen und der spöttische Gegensatz zwischen menschlichem Tragen und der ausbleibenden Hilfe des Götzen bleiben erhalten.
