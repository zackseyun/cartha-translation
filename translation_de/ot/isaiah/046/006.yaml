source:
  edition: WLC
  text: הַ/זָּלִ֤ים זָהָב֙ מִ/כִּ֔יס וְ/כֶ֖סֶף בַּ/קָּנֶ֣ה יִשְׁקֹ֑לוּ יִשְׂכְּר֤וּ צוֹרֵף֙ וְ/יַעֲשֵׂ֣/הוּ אֵ֔ל יִסְגְּד֖וּ אַף יִֽשְׁתַּחֲוּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: de
  text: Die Gold aus dem Beutel ausschütten und Silber auf der Waage[a] abwiegen, werben einen Goldschmied an, und er macht daraus einen Gott. Sie verneigen sich vor ihm, ja, sie werfen sich nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Rohr“; gemeint ist wahrscheinlich der Balken einer Waage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּלִים זָהָב מִכִּיס
  choice: Sie schütten Gold aus dem Beutel
  rationale: Das Partizip הַזָּלִים beschreibt das freigebige beziehungsweise verschwenderische Ausschütten; „schütten“ bewahrt zugleich das konkrete Bild. כִּיס ist ein Beutel oder Geldbeutel.
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: und wiegen Silber auf der Waage[a]
  rationale: קָנֶה bedeutet wörtlich „Rohr/Stab“, bezeichnet hier jedoch wahrscheinlich den Waagebalken und damit metonymisch die Waage. Die natürliche deutsche Formulierung steht im Text, die wörtliche Bildsprache in der Fußnote.
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: Sie bezahlen einen Goldschmied
  rationale: שׂכר kann das Anwerben gegen Bezahlung ausdrücken. צוֹרֵף bezeichnet einen Metallhandwerker beziehungsweise Läuterer; angesichts von Gold und Silber ist „Goldschmied“ kontextuell passend.
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: damit er daraus einen Gott macht
  rationale: Das Suffix verweist auf das zuvor genannte Edelmetall. „einen Gott“ erhält die polemisch bedeutsame Quellwortwahl אֵל, statt sie deutend durch „Götzenbild“ zu ersetzen.
- source_word: יִסְגְּדוּ אַף יִשְׁתַּחֲווּ
  choice: vor dem werfen sie sich nieder, ja, sie verbeugen sich tief
  rationale: Die beiden Verben bezeichnen kultische Unterwerfung. „ja“ gibt die verstärkende Funktion von אַף wieder; zwei verschiedene deutsche Wendungen erhalten die rhetorische Steigerung.
theological_decisions:
- issue: Bezeichnung des menschengemachten Kultgegenstands
  choice: einen Gott
  alternative: ein Götzenbild
  rationale: אֵל heißt ausdrücklich „Gott“. Der polemische Zusammenhang macht deutlich, dass es um einen hergestellten falschen Gott geht; „Götzenbild“ würde diese Spannung bereits interpretierend auflösen.
- issue: Wiedergabe der kultischen Gesten
  choice: werfen sich nieder … verbeugen sich tief
  alternative: beten es an
  rationale: Die körperlichen Handlungen bleiben sichtbar und werden nicht ausschließlich durch den theologischen Oberbegriff „anbeten“ ersetzt.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die anschauliche Ironie des Verses bleibt erhalten: Menschen geben Edelmetall aus, lassen daraus einen Gott herstellen und unterwerfen sich anschließend ihrem eigenen Erzeugnis.'
