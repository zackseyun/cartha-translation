revisions:
- from: Sie schütten Gold aus dem Beutel und wiegen Silber auf der Waage[a]. Sie bezahlen einen Goldschmied, damit er daraus einen Gott macht; vor dem werfen sie sich nieder, ja, sie verbeugen sich tief.
  to: Die Gold aus dem Beutel ausschütten und Silber auf der Waage[a] abwiegen, werben einen Goldschmied an, und er macht daraus einen Gott. Sie verneigen sich vor ihm, ja, sie werfen sich nieder.
  rationale: Die Revision bewahrt die partizipiale Eröffnung des Hebräischen („Die … ausschütten und … abwiegen“), gibt יִשְׂכְּרוּ als Anwerben eines Handwerkers wieder und ordnet die beiden kultischen Gesten in einer im Deutschen natürlichen, dem hebräischen Ausdruck entsprechenden Steigerung. Die textkritisch bzw. lexikalisch offene Deutung von קָנֶה bleibt durch die Fußnote transparent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Begriffe des Hebräischen im Wesentlichen zutreffend wieder: das Ausschütten von Gold aus dem Beutel, das Abwiegen von Silber, das Anwerben eines Metallhandwerkers und die anschließenden kultischen Gesten. Die Fußnote zu קָנֶה bildet die wörtliche Bedeutung und die wahrscheinliche Bedeutung im Kontext angemessen ab. Bei den beiden Schlussverben ist jedoch die natürliche und rhetorisch sinnvolle Reihenfolge im Deutschen zu verbessern: סגד bezeichnet Verneigung/Verbeugung, während השתחוה das Niederwerfen bzw. Sich-Niederwerfen ausdrückt.'
  naturalness: „vor dem werfen sie sich nieder“ ist als Relativanschluss nach dem Semikolon unnötig schwerfällig. „Sie verneigen sich vor ihm, ja, sie werfen sich nieder“ ist modernes, klares Standarddeutsch und erhält die Wiederaufnahme des hergestellten Gottes.
  terminology: „Goldschmied“ ist im Kontext von Gold und Silber vertretbar, auch wenn צורף allgemeiner einen Metallarbeiter bzw. Läuterer bezeichnen kann. „einen Gott“ bewahrt אֵל ohne die interpretierende Vorentscheidung „Götzenbild“. „Anwerben“ gibt יִשְׂכְּרוּ präziser wieder als das bloße „bezahlen“.
  issues:
  - severity: medium
    issue: Die Reihenfolge und Stärke der abschließenden Gesten ist im Deutschen unglücklich.
    rationale: Der Entwurf setzt das stärkere „sich niederwerfen“ vor das schwächere „sich tief verbeugen“. Für סגד ... אַף השתחוה ist „sich verneigen, ja, sich niederwerfen“ sprachlich und semantisch angemessener.
  - severity: low
    issue: Der Anschluss „vor dem werfen sie sich nieder“ ist stilistisch holprig.
    rationale: 'Das Pronomen kann einfacher und eindeutiger nachgestellt werden: „Sie verneigen sich vor ihm“. Dadurch bleibt der Bezug auf den gefertigten „Gott“ klar.'
  - severity: low
    issue: „bezahlen“ ist für יִשְׂכְּרוּ weniger genau als „anwerben“.
    rationale: Das Verb bezeichnet das Mieten bzw. Anwerben eines Handwerkers; die Revision stellt diese Handlung deutlicher heraus.
  revised_text: Die Gold aus dem Beutel ausschütten und Silber auf der Waage[a] abwiegen, werben einen Goldschmied an, und er macht daraus einen Gott. Sie verneigen sich vor ihm, ja, sie werfen sich nieder.
  revised_footnotes:
