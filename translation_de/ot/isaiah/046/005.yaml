  text: To whom will you liken me and make me equal[a], and compare me, that we may be alike?
translation:
  language: de
  text: Wem wollt ihr mich ähnlich machen und gleichstellen? Mit wem wollt ihr mich vergleichen, sodass wir einander ähnlich wären?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische häuft drei eng verwandte Verben: „ähnlich machen“, „gleichstellen“ und „vergleichen“. Dadurch wird die rhetorische Herausforderung verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: Mit wem
  rationale: Das vorangestellte Fragewort mit ל bezeichnet die Vergleichsgröße. „Mit wem“ ist im modernen Deutschen natürlich und bewahrt die rhetorische Zuspitzung.
- source_word: תְדַמְיוּנִי
  choice: wollt ihr mich vergleichen
  rationale: Das Piel von דמה bedeutet hier „vergleichen, gleichsetzen“. Die Wiedergabe hält das Objektsuffix „mich“ ausdrücklich fest.
- source_word: וְתַשְׁווּ
  choice: und wem gleichstellen
  rationale: Der Hifil von שוה bezeichnet das Gleichstellen beziehungsweise Stellen auf dieselbe Ebene. Das im Hebräischen aus dem Parallelismus erschlossene Objekt „mich“ bleibt im Deutschen durch den ersten Teilsatz verständlich.
- source_word: וְתַמְשִׁלוּנִי
  choice: Mit wem wollt ihr mich in eine Reihe stellen
  rationale: Der Hifil von משל bedeutet in diesem Zusammenhang „vergleichen, gleichstellen“. „In eine Reihe stellen“ bewahrt die Nähe zu den vorigen Vergleichsverben, ohne sie bloß zu wiederholen.
- source_word: וְנִדְמֶה
  choice: sodass wir einander ähnlich wären
  rationale: Die 1. Person Plural von דמה schließt Gott und die Vergleichsgröße ausdrücklich in „wir“ zusammen. Der Konjunktiv „wären“ gibt den vorgestellten, durch die rhetorische Frage bestrittenen Vergleich natürlich wieder.
theological_decisions:
- issue: Polemik gegen die Gleichsetzung Gottes mit anderen Größen beziehungsweise Götzen
  choice: Die Häufung dreier nah verwandter Vergleichsausdrücke wird beibehalten.
  alternative: Die Folge zu einem einzigen Vergleichsverb zusammenziehen.
  rationale: Die hebräische Kumulation verstärkt die rhetorische Herausforderung. Sie soll nicht geglättet werden, da gerade die unmögliche Gleichstellung Gottes den Nachdruck des Satzes bildet.
- issue: Bezug des abschließenden „wir“
  choice: „wir einander ähnlich wären“ lässt beide Seiten des Vergleichs ausdrücklich hervortreten.
  alternative: „damit es mir ähnlich wäre“ oder eine unpersönliche Formulierung.
  rationale: Die hebräische 1. Person Plural muss gewahrt bleiben, ohne die rhetorisch gedachte Ähnlichkeit als tatsächlich möglich zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Mit wem“ gliedert die lange rhetorische Frage und erhält zugleich die eindringliche Häufung des Hebräischen.
