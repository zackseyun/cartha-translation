  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: de
  text: Ich habe meine Gerechtigkeit[a] nahegebracht; sie ist nicht fern, und meine Rettung wird sich nicht verzögern. Ich werde in Zion Rettung geben, für Israel meine Herrlichkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Recht“ oder „meinen Rechtserweis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Pracht“. Die knappe hebräische Schlussfügung lässt die genaue Beziehung zwischen Israel und Gottes Herrlichkeit offen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: Ich habe … nahegebracht
  rationale: Das Qal-Perfekt der 1. Person Singular wird als vollzogene Handlung mit gegenwärtiger Bedeutung wiedergegeben; die ungewöhnliche, aber verständliche Verbindung bewahrt zudem das Bild des hebräischen Verbs.
- source_word: צִדְקָתִי
  choice: meine Gerechtigkeit
  rationale: „Gerechtigkeit“ erhält die Bedeutungsbreite von צְדָקָה, die hier Gottes gerechtes und rettendes Handeln einschließt, ohne den Ausdruck auf Rechtsprechung oder Rechtfertigung zu verengen.
- source_word: לֹא תִרְחָק
  choice: sie ist nicht fern
  rationale: Das feminine Verb bezieht sich auf „meine Gerechtigkeit“. Die deutsche Formulierung drückt ihre bereits bestehende Nähe natürlich aus.
- source_word: וּתְשׁוּעָתִי
  choice: und meine Rettung
  rationale: „Rettung“ ist eine klare und breite Wiedergabe von תְּשׁוּעָה und passt zur konkreten rettenden Intervention im Kontext.
- source_word: לֹא תְאַחֵר
  choice: wird sich nicht verzögern
  rationale: Das Piel-Imperfekt bezeichnet das Ausbleiben eines Aufschubs; die reflexive deutsche Wendung ist idiomatisch und bewahrt die Zukunftsbedeutung.
- source_word: וְנָתַתִּי
  choice: Ich werde … schaffen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“. Bei Rettung als abstraktem Objekt und Zion als Ortsangabe gibt „schaffen“ den Gedanken wieder, dass Gott Rettung dort wirksam werden lässt, ohne Zion zum indirekten Objekt zu machen.
- source_word: בְצִיּוֹן
  choice: in Zion
  rationale: Die Präposition ב wird entsprechend ihrer naheliegenden lokalen Bedeutung wiedergegeben.
- source_word: תְּשׁוּעָה
  choice: Rettung
  rationale: Die Wiederholung von „Rettung“ entspricht der Wiederholung im Hebräischen und erhält den Nachdruck.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: „Für“ gibt ל als Begünstigten- oder Bezugsmarker wieder und lässt die genaue Beziehung zum folgenden „meine Herrlichkeit“ offen.
- source_word: תִּפְאַרְתִּי
  choice: meine Herrlichkeit
  rationale: תִּפְאֶרֶת kann Herrlichkeit, Pracht oder Schmuck bezeichnen. „Herrlichkeit“ bewahrt den Gedanken majestätischer Ehre und bleibt im knappen Schlussglied syntaktisch offen.
theological_decisions:
- issue: Bedeutung von „meine Gerechtigkeit“ parallel zu „meine Rettung“
  choice: Der umfassende Ausdruck „meine Gerechtigkeit“ bleibt stehen und wird eng mit Gottes rettendem Handeln verbunden.
  alternative: „mein Recht“, „mein Rechtserweis“ oder „meine Rechtfertigung“
  rationale: Jesajas Sprachgebrauch verbindet Gottes Gerechtigkeit häufig mit seinem treuen, rettenden Eingreifen. Eine engere Wiedergabe würde die theologische Spannung zwischen Eigenschaft, Rechtshandeln und Rettung vorschnell auflösen.
- issue: Beziehung von „meine Herrlichkeit“ zu Israel und zur Rettung in Zion
  choice: Die komprimierte Folge „für Israel meine Herrlichkeit“ bleibt erhalten.
  alternative: „Israel, meine Herrlichkeit“, „meine Herrlichkeit für Israel“ oder „und Israel gebe ich meine Herrlichkeit“
  rationale: Der hebräische Schluss ist knapp und lässt die Beziehung teilweise offen. Die gewählte Wortfolge deutet Israel nicht eindeutig entweder als Empfänger oder als Verkörperung von Gottes Herrlichkeit und bewahrt so die echte syntaktisch-theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schlüsselbegriffe „Gerechtigkeit“, „Rettung“ und „Herrlichkeit“ bleiben bewusst breit. Der komprimierte Schluss folgt der hebräischen Wortfolge weitgehend, während „Rettung schaffen“ im Deutschen natürlicher klingt als ein wörtliches „Rettung setzen/geben“.
