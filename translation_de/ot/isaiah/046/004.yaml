  terminology: „Derselbe“ ist hier keine dogmatische Zuspitzung, sondern eine natürliche deutsche Wiedergabe von אֲנִי הוּא im Kontext der lebenslangen Beständigkeit Gottes. „Tragen“, „gemacht“ und „retten“ sind sachgerecht. Die Fußnote zu a sollte genauer zwischen dem wiederholten hebräischen Verb und dem verwandten mittleren Tragverb unterscheiden.
