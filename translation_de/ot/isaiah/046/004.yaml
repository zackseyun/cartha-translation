  text: וְ/עַד זִקְנָה֙ אֲנִ֣י ה֔וּא וְ/עַד שֵיבָ֖ה אֲנִ֣י אֶסְבֹּ֑ל אֲנִ֤י עָשִׂ֨יתִי֙ וַ/אֲנִ֣י אֶשָּׂ֔א וַ/אֲנִ֥י אֶסְבֹּ֖ל וַ/אֲמַלֵּֽט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: de
  text: 'Auch wenn ihr alt werdet, bin ich derselbe,

    und bis zu eurem grauen Haar werde ich euch tragen.[a]

    Ich habe euch gemacht, und ich werde euch tragen;

    ich werde euch tragen und euch retten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb, das hier und später mit „tragen“ wiedergegeben ist, kann auch „stützen“ oder „auf sich nehmen“ bedeuten. Das dazwischen stehende hebräische Verb ist ihm in der Bedeutung verwandt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befreien“ beziehungsweise „in Sicherheit bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: Auch bis in euer Alter
  rationale: „Bis in euer Alter“ gibt die zeitliche Erstreckung idiomatisch wieder; „auch“ hebt hervor, dass Gottes Fürsorge weiterhin gilt. Das im Hebräischen nicht ausdrücklich gesetzte Possessivpronomen wird aus der direkten Anrede und dem Zusammenhang ergänzt.
- source_word: אֲנִי הוּא
  choice: bin ich es
  rationale: Die knappe göttliche Selbstaussage bleibt erhalten, ohne sie durch „derselbe“ oder eine spätere theologische Formel auszudeuten.
- source_word: שֵׂיבָה
  choice: bis ihr grau seid
  rationale: Bewahrt das konkrete Bild des grauen Haares in einer natürlichen modernen deutschen Formulierung.
- source_word: אֶסְבֹּל / אֶשָּׂא
  choice: werde ich euch tragen
  rationale: Beide Verben können hier das Tragen beziehungsweise Stützen einer Last bezeichnen. Die einheitliche Wiedergabe „tragen“ hält das Leitbild des Zusammenhangs klar; die im Hebräischen impliziten Angeredeten werden im Deutschen als Objekt ergänzt.
- source_word: עָשִׂיתִי
  choice: Ich habe euch gemacht
  rationale: 'Das Verb bedeutet gewöhnlich „machen“. Das ergänzte „euch“ ergibt sich aus dem Kontext: Der Schöpfer seines Volkes ist auch der, der es trägt.'
- source_word: וַאֲמַלֵּט
  choice: und euch retten
  rationale: Das Piel von מלט bezeichnet das In-Sicherheit-Bringen oder Befreien. „Retten“ ist im heutigen Deutsch klar und lässt den konkreten Umfang der Rettung offen.
theological_decisions:
- issue: Göttliche Selbstaussage אֲנִי הוּא
  choice: bin ich es
  alternative: bin ich derselbe
  rationale: „Bin ich es“ bewahrt die formale Offenheit der hebräischen Selbstbezeichnung. „Bin ich derselbe“ würde die im Kontext naheliegende Beständigkeit Gottes ausdrücklich machen, fügt aber ein Adjektiv hinzu, das nicht im Ausgangstext steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen parallelen Satzgliedern. Die wiederholte Form „ich werde euch tragen“ wahrt das tragende Leitbild des Abschnitts und klingt bewusst eindringlich. Implizite Objekte wurden dort ergänzt, wo sie für natürliches Deutsch und den Bezug auf die Angeredeten erforderlich sind.
