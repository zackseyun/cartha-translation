base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: de
  text: Denkt nicht an das Frühere, und achtet nicht auf das Vergangene.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erinnert euch nicht an die früheren Dinge, und denkt nicht über die Dinge aus alter Zeit nach.“'
    reason: 'Lexikalische Alternative: זכר kann mit „sich erinnern“ wiedergegeben werden; קַדְמֹנִיּוֹת bezeichnet Dinge aus früherer oder alter Zeit, und תִּתְבֹּנָנוּ kann „bedenken“ oder „nachdenken über“ bedeuten.'
lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  choice: Denkt nicht mehr an
  rationale: Die Negation אַל mit der Verbform drückt ein Verbot aus. זכר bedeutet „sich erinnern, an etwas denken“. Das im Deutschen idiomatische „nicht mehr“ ergibt sich aus dem Gegensatz zu dem angekündigten Neuen in Vers 19, ohne das Erinnern als bloße Gedächtnisleistung misszuverstehen.
- source_word: רִאשֹׁנוֹת
  choice: das Frühere
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet frühere Dinge oder Ereignisse. „Das Frühere“ ist natürlich und wahrt den Kontrast zum „Neuen“ im folgenden Vers.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Verbote.
- source_word: קַדְמֹנִיּוֹת
  choice: das längst Vergangene
  rationale: Der Ausdruck bezeichnet Dinge aus früher beziehungsweise alter Zeit. „Das längst Vergangene“ bildet einen verständlichen poetischen Parallelismus zu „das Frühere“.
- source_word: אַל תִּתְבֹּנָנוּ
  choice: richtet eure Aufmerksamkeit nicht auf
  rationale: Die reflexiv-intensive Form von בין bezeichnet aufmerksames Betrachten, Erwägen oder Beachten. Die Wiedergabe macht deutlich, dass nicht bloß intellektuelles Verstehen, sondern ein bewusstes Sichdarauf-Richten gemeint ist.
theological_decisions:
- issue: Reichweite des Verbots, sich an frühere Dinge zu erinnern
  choice: Als Aufforderung wiedergegeben, die Aufmerksamkeit nicht länger auf das Frühere zu richten
  alternative: Als absolutes Verbot jeder Erinnerung an frühere Heilstaten verstehen
  rationale: Der Kontext kündigt Gottes neues Handeln an. Die poetische Aussage soll nicht gegen die zahlreichen biblischen Aufforderungen ausgespielt werden, Gottes frühere Taten zu erinnern; zugleich wird die Spannung des uneingeschränkten hebräischen Verbots nicht durch eine erklärende Ergänzung im Haupttext aufgehoben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetischem Parallelismus. Die direkte Anrede steht im Plural. „Längst vergangen“ ist würdevoll, aber weniger altertümlich als „die Dinge von alters her“.
