source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה קְדֽוֹשְׁ/כֶ֑ם בּוֹרֵ֥א יִשְׂרָאֵ֖ל מַלְכְּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: de
  text: Ich bin Jahwe[a], euer Heiliger, der Schöpfer Israels, euer König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname.'
    reason: Die Fußnote macht die hebräische Namensform transparent.
lexical_decisions:
- source_word: אֲנִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen ist betont; „Ich bin“ bildet den verblosen hebräischen Identifikationssatz im Deutschen natürlich ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: קְדוֹשְׁכֶם
  choice: euer Heiliger
  rationale: Die Form mit Suffix der 2. Person Plural bezeichnet Gott als den Heiligen, der zu seinem Volk in Beziehung steht, und hat hier titelartigen Charakter.
- source_word: בּוֹרֵא יִשְׂרָאֵל
  choice: der Schöpfer Israels
  rationale: Das Partizip bezeichnet Gottes charakteristische Rolle; die nominale Wiedergabe erhält die Parallelität der Titel.
- source_word: מַלְכְּכֶם
  choice: euer König
  rationale: Das Substantiv mit Suffix der 2. Person Plural bezeichnet Jahwe als König seines Volkes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Titelartige Wiedergabe von קְדוֹשְׁכֶם
  choice: euer Heiliger
  alternative: der Heilige von euch; der euch heilig ist
  rationale: Die knappe substantivische Form bewahrt sowohl den Titelcharakter als auch die unmittelbare Zugehörigkeitsbeziehung des Suffixes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Reihung der Gottesbezeichnungen und der Parallelismus des Hebräischen bleiben erhalten; „euer“ gibt jeweils die maskuline Pluralform wieder und richtet sich an Israel als Gemeinschaft.
