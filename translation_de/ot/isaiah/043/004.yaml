  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: de
  text: Weil du in meinen Augen kostbar und geehrt bist und ich dich liebe[a], gebe ich Menschen für dich hin[b] und Völker anstelle deines Lebens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weil du in meinen Augen kostbar warst, geehrt wurdest und ich dich geliebt habe.« Die hebräischen Verbformen können in diesem Zusammenhang auch vergangenheitsbezogen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werde ich Menschen für dich hingeben und Völker anstelle deines Lebens.« Die hebräische Verbform kann in diesem prophetischen Zusammenhang auch zukünftig verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: Weil
  rationale: Die Verbindung leitet hier am ehesten den Grund für Gottes rettendes Handeln ein; eine zeitliche Deutung bleibt möglich, ist im Zusammenhang aber weniger naheliegend.
- source_word: יָקַרְתָּ בְעֵינַי
  choice: du in meinen Augen kostbar ... bist
  rationale: Das Qatal bezeichnet im Kontext einen fortbestehenden Stand. Die hebräische Wendung »in meinen Augen« bleibt bildhaft und ist im Deutschen verständlich.
- source_word: נִכְבַּדְתָּ
  choice: geehrt bist
  rationale: Das Nifal von כבד bezeichnet hier, dass Israel Ehre und Wertschätzung erfährt; »geehrt« passt zum relationalen Kontext.
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: und ich dich liebe
  rationale: Das Perfekt wird kontextuell als gegenwärtig fortbestehende Liebe wiedergegeben, ohne sie auf einen vergangenen Akt zu beschränken.
- source_word: וְאֶתֵּן
  choice: gebe ich ... hin
  rationale: Das Yiqtol kann in der prophetischen Zusage gegenwärtig bzw. zukünftig verstanden werden. »hingeben« macht die Austausch- und Stellvertretungsrelation im Deutschen natürlich deutlich; die Zukunftsdeutung wird in der Fußnote bewahrt.
- source_word: אָדָם
  choice: Menschen
  rationale: Das kollektive Singularwort bezeichnet hier menschliche Personen. »Menschen« ist im modernen Deutschen präzise und bildet einen sinnvollen Parallelismus zu »Völker«.
- source_word: תַּחְתֶּיךָ
  choice: für dich
  rationale: תחת hat hier nicht räumliche, sondern austauschende beziehungsweise stellvertretende Bedeutung. Zusammen mit »hingeben« drückt »für dich« dies idiomatisch aus.
- source_word: וּלְאֻמִּים
  choice: und Völker
  rationale: Der Plural bezeichnet ethnisch-politische Völkergruppen und bewahrt den Parallelismus.
- source_word: תַּחַת נַפְשֶׁךָ
  choice: anstelle deines Lebens
  rationale: נפש meint hier das Leben beziehungsweise die Person, nicht ausdrücklich eine vom Körper getrennte Seele. »Anstelle deines Lebens« bewahrt zudem die Austauschrelation.
theological_decisions:
- issue: Zeitwert der hebräischen Verbformen
  choice: 'gegenwärtige Wiedergabe: »bist«, »liebe«, »gebe«'
  alternative: vergangen bei »warst/geliebt habe« oder zukünftig bei »werde geben«
  rationale: Die Formen lassen im prophetischen Zusammenhang unterschiedliche Zeitbezüge zu. Der Haupttext gibt den fortbestehenden gegenwärtigen Zuspruch wieder; die besonders relevante Zukunftsdeutung von וְאֶתֵּן bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von אָדָם als Kollektivbegriff
  choice: Menschen
  alternative: Menschheit; Männer
  rationale: Im Kontext sind menschliche Personen gemeint, die für Israel hingegeben werden. »Menschen« vermeidet die Abstraktion von »Menschheit« und eine im Hebräischen hier nicht zwingend vorhandene Beschränkung auf männliche Personen.
- issue: Wiedergabe von נֶפֶשׁ
  choice: Leben
  alternative: Seele; Person
  rationale: Die konkrete Bedeutung »Leben« passt zur Aussage über Bewahrung und Austausch und vermeidet, dem Text eine spätere dualistische Anthropologie aufzuerlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die persönliche Anrede bleibt im Singular, da sie sich im Kontext an Israel/Jakob als Kollektiv richtet. »Hingeben« verbindet die beiden parallelen Satzglieder und vermittelt den Austauschgedanken natürlicher als eine wörtlich-transaktionale Formulierung.
