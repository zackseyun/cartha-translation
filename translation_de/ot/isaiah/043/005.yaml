source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: de
  text: Fürchte dich nicht, denn ich bin bei dir[a]; vom Osten her werde ich deine Nachkommen[b] bringen, und vom Westen her werde ich dich sammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Einzahl „dir“ redet Israel beziehungsweise Jakob als gemeinschaftliche Einheit an.
    reason: cultural_note
  - marker: b
    text: 'Das hebräische Wort steht als kollektiver Singular; wörtlicher auch: „deine Nachkommenschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die Verneinung אַל mit der Imperfektform drückt ein Verbot beziehungsweise eine beruhigende Aufforderung aus. Die gewählte Formulierung ist im modernen Deutschen klar, knapp und würdevoll.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung. „Denn“ gibt diesen erklärenden Zusammenhang natürlich wieder.
- source_word: אִתְּךָ אָנִי
  choice: ich bin bei dir
  rationale: Die Wendung bezeichnet Gottes Gegenwart und Beistand. Die deutsche Wortstellung klingt natürlich, ohne die Aussage interpretierend zu erweitern.
- source_word: מִמִּזְרָח
  choice: vom Osten
  rationale: Das Substantiv hängt sprachlich mit dem Sonnenaufgang zusammen, bezeichnet hier aber idiomatisch die Himmelsrichtung Osten.
- source_word: אָבִיא
  choice: werde ich … bringen
  rationale: Der Hifil von בוא bedeutet hier „bringen“. Ein zusätzliches „zurück“ wäre im Zusammenhang denkbar, ist im Verb selbst jedoch nicht ausdrücklich enthalten.
- source_word: זַרְעֶךָ
  choice: deine Nachkommen
  rationale: זֶרַע ist grammatisch ein kollektiver Singular und bezeichnet hier die Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch natürlicher als das wörtliche „Samen“.
- source_word: וּמִמַּעֲרָב
  choice: und vom Westen
  rationale: Als geografisches Gegenstück zum Osten bezeichnet מַעֲרָב hier idiomatisch den Westen, obwohl das Wort etymologisch mit Abend beziehungsweise Sonnenuntergang verbunden ist.
- source_word: אֲקַבְּצֶךָּ
  choice: werde ich dich sammeln
  rationale: Der Piel von קבץ bedeutet „sammeln“ oder „zusammenbringen“. Der Singular des Objekts bleibt erhalten und bewahrt die korporative Anrede Israels.
theological_decisions:
- issue: Bezug der Anrede in der zweiten Person Singular
  choice: Die Singularformen „dich“, „dir“ und „deine“ bleiben im Haupttext erhalten; Israel beziehungsweise Jakob wird als gemeinschaftliche Einheit angeredet.
  alternative: Die Anrede durch Pluralformen oder durch eine ausdrückliche Ergänzung wie „dein Volk“ verdeutlichen.
  rationale: Der hebräische Text verwendet konsequent den maskulinen Singular und spricht das Volk korporativ an. Die Beibehaltung des Singulars wahrt die prophetische Redeweise und vermeidet eine interpretierende Erweiterung.
- issue: Wiedergabe von זֶרַע
  choice: „Nachkommen“ im Haupttext, mit Hinweis auf den kollektiven Singular in der Fußnote.
  alternative: „Nachkommenschaft“ oder das wörtliche „Samen“.
  rationale: „Nachkommen“ vermittelt den gemeinten Personenbezug in natürlichem Deutsch. Die Fußnote bewahrt zugleich die grammatische Eigenart und die mögliche formale Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Bewegung „vom Osten … vom Westen“ und die korporative Singularanrede des Hebräischen bleiben erhalten.
