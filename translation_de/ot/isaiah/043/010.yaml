source:
  edition: WLC
  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: de
  text: Ihr seid meine Zeugen, spricht Jahwe, und mein Diener, den ich erwählt habe, damit ihr erkennt, mir glaubt[a] und versteht, dass ich es bin.[b] Kein Gott wurde vor mir geformt, und nach mir wird es keinen geben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir vertraut“ beziehungsweise „an mich glaubt“. Die hebräische Wendung kann Glauben oder Vertrauen mit Gott als persönlichem Gegenüber ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass ich er bin“. Die knappe hebräische Wendung dient im Jesajabuch der göttlichen Selbstidentifikation.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch verkürzt: „und nach mir wird keiner sein“. Gemeint ist aus dem Zusammenhang: kein Gott.'
    reason: ellipsis
lexical_decisions:
- source_word: עֵדַי
  choice: meine Zeugen
  rationale: Der hebräische Plural mit Suffix der 1. Person Singular bezeichnet die angesprochenen Israeliten gemeinsam als Jahwes Zeugen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feierliche prophetische Botenformel in natürlichem, würdigem Deutsch wieder und bewahrt den Gottesnamen.
- source_word: וְעַבְדִּי
  choice: und mein Diener
  rationale: Der Singular bleibt erhalten; im unmittelbaren Zusammenhang kann er das kollektiv angesprochene Israel bezeichnen, ohne dies im Wortlaut festzuschreiben.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: den ich erwählt habe
  rationale: Die Formulierung bezeichnet eine vollzogene Wahl mit fortdauernder Bedeutung.
- source_word: לְמַעַן
  choice: damit
  rationale: Markiert knapp und idiomatisch den Zweck der Erwählung.
- source_word: תֵּדְעוּ
  choice: ihr erkennt
  rationale: Im Kontext geht es nicht nur um Faktenwissen, sondern um das Erkennen der Identität und Einzigkeit Jahwes.
- source_word: וְתַאֲמִינוּ לִי
  choice: mir glaubt
  rationale: Die Konstruktion mit לִי kann Glauben oder Vertrauen gegenüber einer Person ausdrücken. „Mir glaubt“ bildet den direkten Personenbezug eng nach.
- source_word: וְתָבִינוּ
  choice: und versteht
  rationale: Bewahrt die Dreierfolge erkennen–glauben–verstehen in klarem modernem Deutsch.
- source_word: כִּי אֲנִי הוּא
  choice: dass ich es bin
  rationale: Bewahrt die knappe Formel der göttlichen Selbstidentifikation, ohne sie zu dem weitergehenden „Ich bin“ zu verkürzen.
- source_word: לֹא נוֹצַר אֵל
  choice: wurde kein Gott gebildet
  rationale: Gibt das Passiv von יצר formal wieder und wahrt die polemische Aussage, dass keine Gottheit vor Jahwe ins Dasein gebracht wurde.
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: und nach mir wird es keinen geben
  rationale: Ergänzt im Deutschen das aus dem vorigen Satzglied erschließbare „Gott“, ohne die hebräische Ellipse unnötig auszudeuten.
theological_decisions:
- issue: Bezug von „mein Diener“
  choice: Singular „mein Diener“ beibehalten und den möglichen kollektiven Bezug offenlassen
  alternative: ausdrücklich „mein Volk, das mir dient“ oder eine individuelle Gestalt
  rationale: Der Kontext spricht die Gemeinschaft im Plural als Zeugen an, während das Hebräische „Diener“ im Singular hat. Die Übersetzung bewahrt beides und legt keine engere christologische oder rein individuelle Deutung fest.
- issue: Wiedergabe von אֲנִי הוּא
  choice: „ich es bin“
  alternative: „ich bin“ oder „ich der Eine bin“
  rationale: Die gewählte Fassung erhält die Selbstidentifikationsformel und ihr theologisches Gewicht, ohne spätere Assoziationen ausdrücklich in den Text einzutragen.
- issue: Aussage über andere Götter
  choice: „kein Gott“ in der allgemeinen Gattungsbedeutung
  alternative: „kein Gott außer mir“ oder „kein wahrer Gott“
  rationale: Der Text spricht von keinem vor Jahwe gebildeten Gott und keinem nach ihm; Zusätze wie „wahrer“ würden die Aussage interpretierend abschwächen oder umformen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. „Jahwe“ gibt den Eigennamen יהוה wieder. Die Syntax bleibt nahe am hebräischen Parallelismus, ist aber flüssig und allgemein verständlich.
