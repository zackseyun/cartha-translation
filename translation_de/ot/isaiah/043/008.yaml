source:
  edition: WLC
  text: הוֹצִ֥יא עַם עִוֵּ֖ר וְ/עֵינַ֣יִם יֵ֑שׁ וְ/חֵרְשִׁ֖ים וְ/אָזְנַ֥יִם לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: de
  text: Führe ein blindes Volk heraus[a], obwohl es Augen hat, und die Tauben, obwohl sie Ohren haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bring ein blindes Volk heraus, obwohl es Augen hat, und die Tauben, obwohl sie Ohren haben.“'
    reason: Lexikalische Alternative für הוֹצִיא; sowohl „herausführen“ als auch „herausbringen“ liegt im Bedeutungsbereich der Form.
lexical_decisions:
- source_word: הוֹצִיא
  choice: Führe … heraus
  rationale: Der Hifil-Imperativ Singular von יצא fordert dazu auf, jemanden herauszuführen bzw. herauszubringen. „Führe … heraus“ gibt die Befehlsform natürlich wieder, ohne den Ausgangspunkt näher zu bestimmen.
- source_word: עַם עִוֵּר
  choice: ein blindes Volk
  rationale: Die artikellose hebräische Wortgruppe bezeichnet kollektiv ein Volk, das als blind charakterisiert wird. Der unbestimmte Artikel bildet diese Form angemessen ab.
- source_word: וְעֵינַיִם יֵשׁ
  choice: obwohl es Augen hat
  rationale: Wörtlich steht „und Augen sind vorhanden“. „Obwohl“ macht den im Zusammenhang klaren Gegensatz verständlich, ohne die Bildsprache auszudeuten.
- source_word: וְחֵרְשִׁים
  choice: und die Tauben
  rationale: Das pluralische Adjektiv wird substantivisch gebraucht. Die deutsche Form „die Tauben“ wahrt die Parallelität zum blinden Volk.
- source_word: וְאָזְנַיִם לָמוֹ
  choice: obwohl sie Ohren haben
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „und Ohren sind ihnen“. Die konzessive Wiedergabe bringt die prophetische Ironie in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Art der Blindheit und Taubheit
  choice: Die gewöhnlichen Sinnesbegriffe „blind“ und „taub“ bleiben im Haupttext stehen; ihre übertragene Bedeutung ergibt sich aus dem Zusammenhang.
  alternative: Die Begriffe ausdrücklich als geistliche Blindheit und Taubheit deuten.
  rationale: Der hebräische Text verwendet die konkreten Begriffe, während der größere Zusammenhang zugleich geistliche Unempfänglichkeit nahelegt. Eine ausdrückliche Deutung im Haupttext würde die Bildsprache unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konzessiven Nebensätze machen den hebräischen Gegensatz natürlich verständlich; die knappe prophetische Bildsprache und ihre Mehrdeutigkeit bleiben erhalten.
