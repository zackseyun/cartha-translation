base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: de
  text: 'Seht, ich tue etwas Neues: Jetzt sprießt es hervor – erkennt ihr es nicht?[a] Auch werde ich in der Wüste einen Weg anlegen, im Ödland Flüsse.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nehmt ihr es nicht wahr?“ beziehungsweise „Wisst ihr es nicht?“'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verwendet zwei verwandte, aber unterschiedliche Bezeichnungen für karges Land: „Wüste“ und „Ödland“; für Letzteres ist auch „Einöde“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Die Wendung eröffnet eine göttliche, Aufmerksamkeit fordernde Ankündigung. „Seht“ klingt modern und würdevoll; zusammen mit „ich“ gibt es auch den pronominalen Bestandteil wieder.
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: ich tue etwas Neues
  rationale: Das Partizip bezeichnet Gottes gegenwärtig einsetzendes beziehungsweise unmittelbar bevorstehendes Handeln; das substantivisch gebrauchte Adjektiv wird im Deutschen natürlich mit „etwas Neues“ wiedergegeben.
- source_word: עַתָּה תִצְמָח
  choice: Jetzt sprießt es hervor
  rationale: „Jetzt“ bewahrt die zeitliche Unmittelbarkeit, während „sprießt … hervor“ das Bild des Keimens und sichtbar werdenden Wachstums erhält.
- source_word: הֲלוֹא תֵדָעוּהָ
  choice: erkennt ihr es nicht?
  rationale: Die rhetorische Frage erwartet Wahrnehmung und Anerkennung. „Erkennen“ wahrt den breiten Bedeutungsraum von ידע, ohne das Bild auf bloßes Sehen einzuengen.
- source_word: אַף
  choice: Ja
  rationale: Hier leitet die Partikel eine nachdrücklich bestätigende und überraschende Konkretisierung des neuen Handelns ein. „Ja“ ist im Deutschen idiomatischer als ein wörtliches „sogar“ an dieser Stelle.
- source_word: אָשִׂים
  choice: ich lege … an
  rationale: Das Verb bedeutet grundlegend „setzen/legen“. Mit „Weg“ ergibt „anlegen“ natürliches Deutsch; beim parallelen zweiten Objekt bleibt das Verb poetisch ausgespart.
- source_word: בַּמִּדְבָּר דֶּרֶךְ
  choice: in der Wüste einen Weg
  rationale: „Wüste“ bezeichnet unbewohntes, trockenes Land; „Weg“ wahrt sowohl die konkrete Vorstellung als auch die weiterreichenden Anklänge im Jesajabuch.
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: im Ödland Flüsse
  rationale: „Ödland“ unterscheidet den zweiten Ausdruck für karges Land von מִדְבָּר und bewahrt den knappen poetischen Parallelismus.
theological_decisions:
- issue: Bedeutung und Erfüllung des „Neuen“
  choice: Die konkrete Bildsprache von neuem, an einen Exodus erinnerndem Schöpfungs- und Rettungshandeln bleibt stehen, ohne eine einzige Erfüllung festzulegen.
  alternative: Den Vers ausdrücklich nur auf die Rückkehr aus dem Exil, ausschließlich auf eine endzeitliche Erneuerung oder unmittelbar auf messianisches Heil zu beziehen.
  rationale: Der hebräische Text lässt mehrere miteinander verbundene heilsgeschichtliche Horizonte zu. Die Übersetzung soll diese Spannung bewahren und keine nicht ausdrücklich genannte dogmatische Festlegung eintragen.
- issue: Bild oder konkrete Landschaftsveränderung
  choice: Weg und Flüsse werden als konkrete poetische Bilder übersetzt, ohne sie im Text zu vergeistigen.
  alternative: Die Bilder deutend durch Begriffe wie „Rettung“ oder „Segen“ zu ersetzen.
  rationale: Die offene Bildsprache trägt die theologische Aussage und lässt sowohl geschichtliche als auch umfassendere Bezüge zu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Der knappe Parallelismus des Hebräischen bleibt durch die Auslassung des wiederholten Verbs im letzten Satzglied erhalten; die organische Metapher des Hervorsprießens wird nicht geglättet.
