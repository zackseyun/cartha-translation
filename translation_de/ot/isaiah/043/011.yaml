  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: de
  text: Ich, ich bin Jahwe, und außer mir gibt es keinen Retter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: Ich, ich bin
  rationale: Das doppelte selbstständige Pronomen ist nachdrücklich. Die Wiederholung bleibt erhalten und klingt im Deutschen feierlich und verständlich, ohne den Nachdruck durch zusätzliche Deutung aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וְאֵין
  choice: und ... gibt es keinen
  rationale: אֵין bezeichnet Nichtvorhandensein. „Es gibt keinen“ ist natürliches modernes Deutsch und gibt die existentielle Verneinung genau wieder.
- source_word: מִבַּלְעָדַי
  choice: außer mir
  rationale: Die Form bedeutet „außer mir/abgesehen von mir“. „Außer mir“ bringt die Ausschließlichkeit knapp und idiomatisch zum Ausdruck.
- source_word: מוֹשִׁיעַ
  choice: Retter
  rationale: Das Hifil-Partizip von ישׁע bezeichnet jemanden, der rettet oder befreit. „Retter“ ist im Deutschen die natürliche substantivische Wiedergabe und bewahrt die umfassende Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe mit dem Eigennamen „Jahwe“ bewahrt dies, statt einen Titel wie „der HERR“ einzusetzen.
- issue: Ausschließlichkeit der Rettung
  choice: und außer mir gibt es keinen Retter
  alternative: und abgesehen von mir gibt es keinen Retter
  rationale: Der hebräische Wortlaut behauptet unmittelbar und uneingeschränkt, dass allein Jahwe Retter ist. Die Übersetzung erhält diese theologische Spannung, ohne sie abzuschwächen oder zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung „Ich, ich“ bewahrt den emphatischen Charakter des Hebräischen; „außer mir“ ist knapp und allgemein verständlich.
