base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: de
  text: Darum entweihte ich die Obersten des Heiligtums und gab Jakob der Vernichtung preis[a] und Israel den Schmähungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gab Jakob dem Bann preis“. Das hebräische Wort חֵרֶם bezeichnet etwas, das im göttlichen Gericht dem Bann und damit der Vernichtung übergeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחַלֵּל
  choice: So entweihte ich
  rationale: Das Piel von חלל bezeichnet hier das Profanieren bzw. Entweihen. „Entweihte“ bewahrt den kultisch-religiösen Gehalt; das einleitende וַ wird im Zusammenhang folgernd und vergangen wiedergegeben.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: die Obersten des Heiligtums
  rationale: שָׂרֵי bezeichnet führende Amtsträger. Die Verbindung mit קֹדֶשׁ verweist am ehesten auf den heiligen Bereich beziehungsweise das Heiligtum, ohne die Amtsträger ausdrücklich als Priester zu bestimmen.
- source_word: וְאֶתְּנָה
  choice: und gab … preis
  rationale: נתן bedeutet grundsätzlich „geben“, bezeichnet hier aber die richterliche Auslieferung. Die deutsche Wendung „preisgeben“ bringt diesen Zusammenhang natürlich zum Ausdruck.
- source_word: לַחֵרֶם
  choice: der Vernichtung preis
  rationale: חֵרֶם bezeichnet hier das im göttlichen Gericht dem Bann und damit der Vernichtung Übergebene. Die Formulierung ist verständlich und wahrt die Härte der Aussage; „Bann“ wird als wichtige Alternative in der Fußnote genannt.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname bleibt erhalten und bezeichnet hier metonymisch das Bundesvolk.
- source_word: וְיִשְׂרָאֵל
  choice: und Israel
  rationale: Der Eigenname bleibt als poetische Parallelbezeichnung zu „Jakob“ erhalten.
- source_word: לְגִדּוּפִים
  choice: den Schmähungen
  rationale: גִּדּוּפִים bezeichnet Beschimpfungen, Verhöhnungen oder Schmähreden. „Schmähungen“ wahrt den Plural und den Aspekt öffentlicher Schande, ohne fälschlich eine ausschließlich gegen Gott gerichtete Lästerung anzudeuten.
theological_decisions:
- issue: Art der Gerichtsaussage in חֵרֶם
  choice: „gab Jakob der Vernichtung preis“
  alternative: „gab Jakob dem Bann preis“ oder „weihte Jakob der Vernichtung“
  rationale: Die schwere Sprache des Bundesgerichts bleibt erhalten, ohne spätere dogmatische Kategorien einzutragen. Die Fußnote bewahrt den biblisch bedeutsamen Begriff „Bann“.
- issue: Bezug von שָׂרֵי קֹדֶשׁ
  choice: Amtsträger des Heiligtums beziehungsweise des heiligen Bereichs
  alternative: „heilige Fürsten“ oder ausdrücklich „Priester“
  rationale: Der hebräische Ausdruck legt eine Zugehörigkeit zum heiligen Bereich nahe, nennt die Personen jedoch nicht ausdrücklich Priester. „Oberste des Heiligtums“ wahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe poetische Parallelität zwischen „Jakob“ und „Israel“ bleibt erhalten; „Oberste“ ist bewusst formeller als „Anführer“ und passt zum sakralen Amtsbereich.
