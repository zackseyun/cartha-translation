  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: de
  text: 'Alle Nationen sind zusammengekommen, und die Völker sollen versammelt werden. Wer unter ihnen kann dies verkünden und uns das Frühere[a] zu Gehör bringen? Sie sollen ihre Zeugen vorbringen, damit sie als im Recht erwiesen werden; sie sollen hören und sagen: »Es ist wahr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die früheren Dinge“ oder „die ersten Dinge“. Gemeint sein können frühere Ereignisse oder frühere Ankündigungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם נִקְבְּצוּ יַחְדָּו
  choice: Alle Nationen sind zusammengekommen
  rationale: Das Nifal-Perfekt wird als bereits vollzogene beziehungsweise vorgestellte Versammlung wiedergegeben; יַחְדָּו ist durch „zusammen“ enthalten. „Nationen“ bezeichnet hier die Völkerwelt, nicht speziell Nichtjuden.
- source_word: וְיֵאָסְפוּ לְאֻמִּים
  choice: und die Völker sollen sich versammeln
  rationale: Der Nifal-Imperfekt lässt sich im gerichtlichen Aufruf jussiv verstehen. „Völker“ wahrt die leichte Variation gegenüber „Nationen“.
- source_word: מִי בָהֶם יַגִּיד זֹאת
  choice: Wer unter ihnen kann dies verkünden
  rationale: „Verkünden“ gibt den Hifil von נגד angemessen wieder; „kann“ macht die rhetorische Herausforderung im Deutschen natürlich deutlich.
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: und uns das Frühere zu Gehör bringen
  rationale: „Das Frühere“ bewahrt die inhaltliche Offenheit des substantivierten Plurals; „zu Gehör bringen“ wahrt den kausativen Sinn des Hifil und gibt das ausdrücklich vorhandene Suffix „uns“ wieder.
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: Sie sollen ihre Zeugen vorbringen
  rationale: Im Gerichtsrahmen bedeutet נתן mit „Zeugen“ idiomatisch, Zeugen als Beweismittel vorzuführen.
- source_word: וְיִצְדָּקוּ
  choice: damit sie Recht bekommen
  rationale: Die Form hat hier forensischen Sinn. Die deutsche Wendung vermeidet eine unnötige dogmatische Aufladung durch den theologischen Fachbegriff „gerechtfertigt werden“.
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: 'sie sollen hören und sagen: »Es ist wahr.«'
  rationale: Die koordinierten Verbformen bleiben als Aufforderung erhalten. Das knappe אֱמֶת wird im Deutschen natürlich als Feststellung wiedergegeben.
theological_decisions:
- issue: Gerichtliche Bedeutung von וְיִצְדָּקוּ
  choice: damit sie Recht bekommen
  alternative: und gerechtfertigt werden / und sich als im Recht erweisen
  rationale: Der Zusammenhang ist eine Beweisaufnahme im Gericht. Die gewählte Formulierung hält den forensischen Sinn fest, ohne spätere dogmatische Terminologie in den Vers einzutragen.
- issue: Bezug des wiederholten Pronomens „sie“ im Schlusssatz
  choice: Die mehrdeutige pronominale Fortführung wird beibehalten.
  alternative: „Diese Zeugen sollen hören und sagen“
  rationale: Der hebräische Text benennt beim letzten „sie“ keinen neuen ausdrücklichen Bezug. Eine Festlegung allein auf die Zeugen würde eine mögliche, aber nicht zwingende Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gerichtsszene bleibt durch „Zeugen vorbringen“ und „Recht bekommen“ deutlich. Der Wechsel zwischen feststellendem Perfekt und aufforderndem Imperfekt am Versanfang sowie die Mehrdeutigkeit des pronominalen Subjekts am Schluss werden nicht eingeebnet.
