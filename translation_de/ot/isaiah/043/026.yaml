  yaml_path: translation/ot/isaiah/043/026.yaml
  text: Remind me[a]; let us argue the case together. State your case[b], so that you may be proved right.
translation:
  language: de
  text: Erinnere mich daran[a]; lass uns miteinander den Rechtsstreit führen[b]. Trag du deine Sache vor, damit du im Recht erwiesen wirst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ruf es mir ins Gedächtnis.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lass uns miteinander vor Gericht treten.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „damit du Recht behältst“ beziehungsweise „gerechtfertigt wirst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: Erinnere mich daran
  rationale: 'Der Hifil-Imperativ von זכר mit dem Suffix der 1. Person Singular bedeutet „veranlasse mich, mich zu erinnern“, idiomatisch: „Erinnere mich daran“. Das nicht ausdrücklich genannte Objekt bleibt auch im Deutschen offen.'
- source_word: נִשָּׁפְטָה
  choice: lass uns … den Rechtsstreit führen
  rationale: Die Kohortativform von שפט hat hier im Zusammenhang einer gerichtlichen Auseinandersetzung wechselseitigen, forensischen Sinn. Die Formulierung gibt diesen Sinn natürlich wieder, ohne sie irreführend rein passiv als „gerichtet werden“ zu verstehen.
- source_word: יָחַד
  choice: miteinander
  rationale: Das Adverb bezeichnet die gemeinsame beziehungsweise gegenseitige Beteiligung am Rechtsstreit; „miteinander“ passt im Deutschen besonders gut zur wechselseitigen Szene.
- source_word: סַפֵּר
  choice: Trag … deine Sache vor
  rationale: Der Piel-Imperativ von ספר kann „erzählen“, „darlegen“ oder „vortragen“ bedeuten. Im forensischen Zusammenhang bringt „seine Sache vortragen“ die gemeinte Aufforderung klar und idiomatisch zum Ausdruck.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Personalpronomen setzt Nachdruck auf den Angesprochenen. Die Wortstellung „Trag du … vor“ bewahrt diese Betonung in natürlichem Deutsch.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion leitet hier den beabsichtigten beziehungsweise in Aussicht gestellten Ausgang ein.
- source_word: תִּצְדָּק
  choice: damit du als im Recht erwiesen wirst
  rationale: Die Qal-Form von צדק bezeichnet im gerichtlichen Zusammenhang das Rechtbehalten beziehungsweise die Feststellung, im Recht zu sein. Die gewählte Formulierung wahrt den forensischen Sinn und vermeidet eine unnötige Festlegung auf spätere dogmatische Terminologie.
theological_decisions:
- issue: Forensische Bedeutung von צדק
  choice: als im Recht erwiesen werden
  alternative: gerechtfertigt werden; Recht behalten; für gerecht erklärt werden
  rationale: Der unmittelbare Kontext ist eine Rechtsauseinandersetzung. Die Übersetzung hält die gerichtliche Feststellung fest, ohne „rechtfertigen“ vorschnell mit einer späteren theologischen Lehrsprache zu verbinden.
- issue: Stimme und Gegenseitigkeit von נִשָּׁפְטָה
  choice: miteinander den Rechtsstreit führen
  alternative: miteinander vor Gericht treten; uns miteinander richten lassen
  rationale: Die hebräische Form lässt eine stärker formale Wiedergabe des gemeinsamen Eintretens ins Gericht zu. Im Kontext ist jedoch eine gegenseitige gerichtliche Auseinandersetzung gemeint; die Hauptfassung macht diese deutlich, während die Fußnote die formale Alternative wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gerichtssprache bleibt deutlich, aber allgemein verständlich. „Trag du“ bewahrt die Betonung des hebräischen Personalpronomens; die Fußnoten dokumentieren echte lexikalische und forensische Alternativen.
