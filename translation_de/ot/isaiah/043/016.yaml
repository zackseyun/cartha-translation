  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/נּוֹתֵ֥ן בַּ/יָּ֖ם דָּ֑רֶךְ וּ/בְ/מַ֥יִם עַזִּ֖ים נְתִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: de
  text: So spricht Jahwe, der im Meer einen Weg schafft und in mächtigen Wassern einen Pfad:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Meer“ und „durch mächtige Wasser“. Die hebräische Präposition bedeutet wörtlich „in“, kann hier aber auch eine Bewegung durch die Wasser ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die prophetische Botenformel wird mit der im Deutschen natürlichen und würdevollen Präsensform wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form der wissenschaftlichen Umschrift.
- source_word: הַנּוֹתֵן
  choice: der … schafft
  rationale: Das Partizip bezeichnet Jahwe als den, der einen Weg entstehen lässt. „Schafft“ verbindet sich im Deutschen natürlich mit „Weg“ und lässt die Anspielung auf den Durchzug durch das Meer bestehen.
- source_word: בַּיָּם
  choice: im Meer
  rationale: Die Präposition ב wird zunächst formal als „in“ wiedergegeben. Der mögliche Bewegungssinn „durch“ wird in der Fußnote genannt.
- source_word: דָּרֶךְ
  choice: einen Weg
  rationale: „Weg“ bewahrt sowohl die konkrete Bedeutung als auch weitergehende poetische Resonanzen.
- source_word: וּבְמַיִם עַזִּים
  choice: und in mächtigen Wassern
  rationale: „Mächtig“ gibt die Stärke von עַזִּים wieder, ohne die Wasser deutend als „tobend“ zu charakterisieren; der Plural „Wasser“ erhält die poetische Ausdrucksweise.
- source_word: נְתִיבָה
  choice: einen Pfad
  rationale: „Pfad“ wahrt die poetische Parallelität zu „Weg“ und gibt zugleich den leicht abweichenden Ausdruck des Hebräischen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anspielung auf den Weg durch das Meer
  choice: im Meer … in mächtigen Wassern
  alternative: durch das Meer … durch mächtige Wasser
  rationale: Die Hauptfassung erhält die Grundbedeutung der Präposition ב. Da der Kontext zugleich einen Weg durch die Wasser nahelegt, wird diese berechtigte Lesart in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; beim zweiten Glied wird „schafft“ entsprechend der hebräischen Ellipse nicht wiederholt.
