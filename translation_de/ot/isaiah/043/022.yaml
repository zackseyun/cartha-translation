  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: de
  text: Doch du hast mich nicht angerufen[a], Jakob, denn du bist meiner müde geworden[b], Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich nicht gerufen“. Das hebräische Verb bedeutet allgemein „rufen“, kann aber im Zusammenhang mit Gebet oder Gottesdienst „anrufen“ meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit mir müde geworden“. Die hebräische Präposition lässt diese eng am Wortlaut liegende Wiedergabe zu; im Zusammenhang ist „meiner müde geworden“ jedoch natürlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Doch … nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung steht hier im Kontrast zum vorausgehenden Zusammenhang; „doch“ gibt den vorwurfsvollen Gegensatz in natürlichem Deutsch wieder.
- source_word: אֹתִי קָרָאתָ
  choice: du hast mich angerufen
  rationale: קרא bedeutet grundsätzlich „rufen“; auf Gott bezogen kann es das Anrufen im Gebet oder Gottesdienst bezeichnen. „Jemanden anrufen“ bewahrt im Deutschen sowohl die direkte Objektkonstruktion als auch diesen religiösen Sinn.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname steht als Anrede für das Volk.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier den vorherigen Vorwurf. „Denn“ verbindet die beiden Aussagen würdig und natürlich, ohne die logische Beziehung stärker festzulegen als nötig.
- source_word: יָגַעְתָּ בִּי
  choice: du bist meiner müde geworden
  rationale: יגע bezeichnet Ermüdung oder Überdruss; בִּי bestimmt, worauf sich diese Müdigkeit richtet. Die idiomatische Wendung „meiner müde werden“ gibt den naheliegenden Sinn präzise wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bildet als zweite Anrede eine Parallele zu „Jakob“ und verstärkt die direkte Zurechtweisung des Volkes.
theological_decisions:
- issue: Art des Versagens Israels gegenüber Gott
  choice: Israel wird vorgeworfen, Gott nicht angerufen zu haben und seiner müde geworden zu sein.
  alternative: Israel hat Gott nicht gerufen und ist im Umgang mit ihm müde geworden.
  rationale: Die Syntax legt Israel als Subjekt beider Verben nahe. Die gewählte Fassung bewahrt den Vorwurf der Vernachlässigung, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „meiner müde geworden“ ist allgemein verständlich, bewahrt die knappe poetische Form und vermeidet eine umgangssprachliche Abschwächung des Vorwurfs.
