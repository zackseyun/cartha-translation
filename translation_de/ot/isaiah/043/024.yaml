  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: de
  text: Du hast mir mit Silber kein Duftrohr[a] gekauft und mich nicht mit dem Fett deiner Schlachtopfer gesättigt. Vielmehr hast du mich mit deinen Sünden belastet[b] und mich mit deinen Vergehen ermüdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kalmus“ oder „aromatisches Rohr“. Gemeint ist ein kostbares, wohlriechendes Rohr.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Du hast mich mit deinen Sünden dienen lassen“; gemeint ist: Du hast mich durch deine Sünden zum Dienen oder Arbeiten gezwungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף קָנֶה
  choice: hast mir für Silber kein Würzrohr gekauft
  rationale: קנה bedeutet hier kaufen bzw. erwerben; בַכֶּסֶף bezeichnet den Preis oder das Zahlungsmittel. Das zweite קָנֶה ist ein kostbares aromatisches Rohr. „Würzrohr“ ist verständlich und bewahrt den konkreten Gegenstand.
- source_word: חֵלֶב זְבָחֶיךָ
  choice: das Fett deiner Schlachtopfer
  rationale: חֵלֶב bezeichnet im Opferkontext die Fettstücke des Opfertiers; „Fett“ erhält die konkrete kultische Bildsprache.
- source_word: הִרְוִיתָנִי
  choice: mich ... gesättigt
  rationale: Der Hifil von רוה bedeutet jemanden sättigen, reichlich tränken oder erfüllen. „Gesättigt“ passt zur Erwähnung des Opferfetts und wahrt die anthropomorphe Aussage.
- source_word: אַךְ
  choice: Stattdessen
  rationale: Die Partikel setzt hier einen scharfen Kontrast zwischen dem unterlassenen Opferdienst und der tatsächlichen Belastung durch Sünde.
- source_word: הֶעֱבַדְתַּנִי
  choice: hast du mich ... dienen lassen
  rationale: 'Der Hifil von עבד bedeutet wörtlich „dienen/arbeiten lassen“. Die formalere Wiedergabe erhält die auffällige Umkehrung: Nicht Israel dient Gott, sondern es lässt Gott durch seine Sünden dienen.'
- source_word: בְּחַטֹּאותֶיךָ
  choice: mit deinen Sünden
  rationale: Die Präposition bezeichnet hier Mittel oder Umstand; „mit“ folgt der hebräischen Konstruktion knapp und natürlich.
- source_word: הוֹגַעְתַּנִי
  choice: mich ... müde gemacht
  rationale: Der Hifil von יגע bedeutet „ermüden, müde machen“ und bewahrt die anthropomorphe Klage.
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: mit deinen Vergehen
  rationale: עָוֹן kann Schuld, Verkehrtheit oder Vergehen bezeichnen. „Vergehen“ hält eine erkennbare Nuancendifferenz zu חטאות „Sünden“ aufrecht.
theological_decisions:
- issue: Anthropomorphe Rede davon, dass Gott durch Opfer gesättigt und durch menschliche Schuld ermüdet wird
  choice: Die Aussagen „mich ... gesättigt“ und „mich ... müde gemacht“ bleiben unmittelbar stehen.
  alternative: Abstrakter wiedergeben, etwa „mich geehrt“ und „mich beleidigt“.
  rationale: Der hebräische Text formuliert bewusst körperlich und zugespitzt. Eine Abstraktion würde die theologische Spannung glätten.
- issue: הֶעֱבַדְתַּנִי als auffällige Rollenumkehr
  choice: „hast du mich mit deinen Sünden dienen lassen“
  alternative: „hast du mich mit deinen Sünden belastet“
  rationale: Die wörtlichere Wiedergabe bewahrt das Wortspiel und die Umkehrung des erwarteten Dienstverhältnisses; eine Fußnote erläutert die ungewohnte Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Opfersprache und die starken Anthropomorphismen bleiben erhalten. „Schlachtopfer“ unterscheidet זֶבַח präzise von einem allgemeinen Opfer; „Würzrohr“ vermeidet das heute missverständliche „süßes Rohr“.
