  to: Du hast mir mit Silber kein Duftrohr[a] gekauft und mich nicht mit dem Fett deiner Schlachtopfer gesättigt. Vielmehr hast du mich mit deinen Sünden belastet[b] und mich mit deinen Vergehen ermüdet.
  rationale: Die Revision ersetzt lediglich eine im Deutschen missverständliche wörtliche Formulierung durch die kontextgemäße idiomatische Wiedergabe und dokumentiert die ungewöhnliche hebräische Dienstmetapher in einer Fußnote. Ferner werden Zahlungsmittel und aromatische Beschaffenheit des Rohrs klarer ausgedrückt. Opferbild, anthropomorphe Sprache und die Gegenüberstellung von Sünden und Vergehen bleiben bestehen.
