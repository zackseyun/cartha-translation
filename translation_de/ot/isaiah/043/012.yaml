source:
  edition: WLC
  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: de
  text: Ich selbst habe verkündet und gerettet und kundgetan; kein fremder Gott[a] war unter euch. Ihr seid meine Zeugen, spricht Jahwe, und ich bin Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Fremder war unter euch“. Das hebräische Wort kann „Fremder“ bedeuten; im Zusammenhang ist wahrscheinlich ein fremder Gott gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Das selbstständige Pronomen ist betont; „Ich selbst“ gibt diesen Nachdruck wieder, ohne darüber hinaus ein ausdrückliches „allein“ einzufügen.
- source_word: הִגַּדְתִּי
  choice: habe verkündet
  rationale: Das Hifil von נגד bezeichnet hier feierliches Kundtun oder Verkünden und passt zum zeugnishaften Ton des Abschnitts.
- source_word: וְהוֹשַׁעְתִּי
  choice: und gerettet
  rationale: Das Hifil von ישׁע bedeutet „retten“ oder „befreien“; „gerettet“ ist knapp und bewahrt die heilsgeschichtliche Aussage.
- source_word: וְהִשְׁמַעְתִּי
  choice: und zu hören gegeben
  rationale: Die Hifil-Form von שׁמע bedeutet wörtlich „hören lassen“; „zu hören gegeben“ wahrt dieses Bild und unterscheidet die Aussage vom vorangehenden „verkündet“.
- source_word: וְאֵין בָכֶם זָר
  choice: kein fremder Gott war unter euch
  rationale: זָר bedeutet grundsätzlich „fremd/Fremder“. Im Kontext der ausschließlichen Rettungsmacht Jahwes ist ein fremder Gott gemeint; „Gott“ wird als kontextuell implizites Bezugswort ergänzt, während die lexikalische Alternative in einer Fußnote erhalten bleibt.
- source_word: עֵדַי
  choice: meine Zeugen
  rationale: Das Substantiv mit Suffix der ersten Person bezeichnet die Angeredeten unmittelbar als Jahwes Zeugen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Botenformel wird in natürlichem, würdigem Deutsch mit „spricht Jahwe“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַאֲנִי אֵל
  choice: und ich bin Gott
  rationale: אֵל ist hier die Gottesbezeichnung „Gott“. Die Übersetzung fügt kein nicht ausdrücklich vorhandenes „allein“ hinzu.
theological_decisions:
- issue: Deutung von זָר in וְאֵין בָכֶם זָר
  choice: fremder Gott
  alternative: Fremder / fremde Person
  rationale: Der Zusammenhang stellt Jahwes Verkünden und Retten den fremden Gottheiten gegenüber. Daher ist „fremder Gott“ im Haupttext am wahrscheinlichsten; die echte lexikalische Mehrdeutigkeit wird jedoch in der Fußnote kenntlich gemacht.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird sichtbar als „Jahwe“ wiedergegeben.
- issue: Aussage וַאֲנִי אֵל
  choice: und ich bin Gott
  alternative: und ich allein bin Gott
  rationale: Die knappe Schlussaussage bekennt Jahwes Gottsein. Ein ausdrückliches „allein“ würde die im weiteren Kontext vorhandene Ausschließlichkeit in diesen Satzteil hineintragen, obwohl es dort lexikalisch nicht steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Verknüpfungen der drei göttlichen Handlungen bleiben erhalten. „Zu hören gegeben“ ist bewusst etwas feierlicher und bildet die hebräische Kausativform genauer ab; die syntaktisch knappe Schlussaussage wird nicht theologisch erweitert.
