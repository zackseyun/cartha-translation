base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: de
  text: Wenn du durchs Wasser gehst, bin ich bei dir; und wenn du durch die Ströme gehst, werden sie dich nicht hinwegspülen[a]. Wenn du durchs Feuer gehst, wirst du nicht versengt werden[b], und die Flamme wird dich nicht verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden dich nicht überfluten“ oder „überwältigen“. Das hebräische Verb kann das Überfluten, Fortspülen oder Überwältigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wirst du nicht verbrannt werden“. Das Hebräische verwendet hier ein anderes Verb als im folgenden Satz, der direkter sagt, dass die Flamme dich nicht verbrennen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier in beiden Vershälften eine zeitliche Situation ein. „Wenn“ gibt den Parallelismus natürlich wieder, ohne die Aussage als bloße Möglichkeit oder Begründung zu deuten.
- source_word: תַעֲבֹר בַּמַּיִם
  choice: du durchs Wasser gehst
  rationale: עבר bezeichnet das Hinüber- oder Hindurchgehen. Die idiomatische deutsche Formulierung bewahrt das Bild einer Bewegung durch bedrohliches Wasser; der hebräische Plural wird im Deutschen mit dem üblichen Kollektivsingular „Wasser“ natürlich ausgedrückt.
- source_word: אִתְּךָ אָנִי
  choice: bin ich bei dir
  rationale: Die vorangestellte Zusage gibt die emphatische hebräische Wortstellung in natürlichem Deutsch wieder.
- source_word: וּבַנְּהָרוֹת
  choice: und durch die Ströme
  rationale: נְהָרוֹת bezeichnet Flüsse oder Ströme. „Ströme“ passt zur gesteigerten Gefahrenbildlichkeit und zum folgenden Verb des Hinwegspülens.
- source_word: לֹא יִשְׁטְפוּךָ
  choice: sie werden dich nicht hinwegspülen
  rationale: שטף kann vom Überfluten, Fortspülen oder Überwältigen sprechen. „Hinwegspülen“ hält das konkrete Bild der Wassergewalt fest.
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: du durchs Feuer gehst
  rationale: הלך bedeutet gehen; die Präpositionalfügung bezeichnet die Bewegung im beziehungsweise durch das Feuer. „Durchs Feuer gehen“ ist klar und bewahrt den poetischen Parallelismus.
- source_word: לֹא תִכָּוֶה
  choice: wirst du nicht versengt
  rationale: Das Nifal von כוה bezeichnet das Versengt- oder Verbranntwerden. „Versengt“ unterscheidet diese Aussage sprachlich von dem unmittelbar folgenden „verbrennen“.
- source_word: וְלֶהָבָה לֹא תִבְעַר בָּךְ
  choice: und die Flamme wird dich nicht verbrennen
  rationale: Die Formulierung gibt das konkrete Bild direkt und idiomatisch wieder; בער mit ב bezeichnet hier das Brennen an beziehungsweise gegen einer Person.
theological_decisions:
- issue: Reichweite der Zusage in den Bildern von Wasser und Feuer
  choice: Die Übersetzung lässt die Bilder konkret stehen und formuliert Gottes Gegenwart und Bewahrung mitten in schwerer Gefahr.
  alternative: Die Bilder ausschließlich auf geistliche Prüfungen zu beziehen oder daraus eine allgemeine Garantie völliger körperlicher Unversehrtheit abzuleiten.
  rationale: Der hebräische Text benennt Wasser, Ströme, Feuer und Flamme, ohne die Bilder ausdrücklich zu allegorisieren oder die Zusage systematisch zu verallgemeinern. Die Übersetzung bewahrt daher die poetische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Durchs“ ist gegenwärtig und natürlich, ohne umgangssprachlich zu wirken. Der Doppelpunkt nach „durch die Ströme“ vermeidet eine schwerfällige Wiederholung des Verbs und macht den Bezug von „sie“ eindeutig.
