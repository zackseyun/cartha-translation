base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: de
  text: der die Streitwagen und Pferde, Heer und Mächtige herausführt. Sie liegen da und stehen nicht mehr auf; sie sind erloschen, ausgelöscht wie Flachs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Flachsdocht“. Wörtlich steht im Hebräischen „wie Flachs“; das Bild erinnert an etwas, das sich rasch auslöschen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: der … ausziehen lässt
  rationale: Das Hifil-Partizip beschreibt den HERRN im Anschluss an Vers 16. Die präsentische Form bewahrt sowohl die lebendige Darstellung als auch den Rückblick auf das Geschehen am Meer.
- source_word: רֶכֶב וָסוּס
  choice: Wagen und Pferd
  rationale: Die kollektiven Singulare werden eng und konkret wiedergegeben; im militärischen Kontext bezeichnet רֶכֶב den Streitwagen beziehungsweise die Wagenmacht.
- source_word: חַיִל וְעִזּוּז
  choice: Heer und Mächtige
  rationale: חַיִל bezeichnet hier die Streitmacht. עִזּוּז ist substantiviert und wird ohne den Zusatz „Krieger“ als kollektiver Singular „Mächtige“ wiedergegeben.
- source_word: יַחְדָּו
  choice: zugleich
  rationale: Das Adverb hebt hervor, dass die gesamte Streitmacht gemeinsam untergeht.
- source_word: יִשְׁכְּבוּ בַּל יָקוּמוּ
  choice: Sie liegen da und stehen nicht mehr auf
  rationale: „Liegen“ wahrt das Bild des hebräischen Verbs; „nicht mehr“ bringt die nachdrückliche und endgültige Verneinung von בַּל in natürliches Deutsch.
- source_word: דָּעֲכוּ
  choice: sie sind erloschen
  rationale: Das Verb bezeichnet das Erlöschen eines Feuers und leitet das anschließende Flachsbild ein.
- source_word: כַּפִּשְׁתָּה כָבוּ
  choice: wie Flachs ausgegangen
  rationale: Die direkte Wiedergabe bewahrt Flachs als Vergleichsbild und das zweite Verb des Erlöschens, ohne im Haupttext ausdrücklich einen Docht einzuführen.
theological_decisions:
- issue: Zeitliche Darstellung von Gottes Handeln und der Niederlage der Streitmacht
  choice: 'Präsentische, anschauliche Darstellung: „ausziehen lässt … liegen da“'
  alternative: Durchgehend Vergangenheit als ausdrücklicher Rückblick auf den Auszug aus Ägypten
  rationale: Die hebräischen Verbformen lassen eine lebendige Beschreibung zu, die auf das frühere Geschehen am Meer anspielt, ohne die Aussage ausschließlich auf einen vergangenen Zeitpunkt festzulegen.
- issue: Identität der besiegten Streitmacht
  choice: Wagen, Pferd, Heer und Mächtige werden ohne ausdrückliche Benennung Ägyptens wiedergegeben
  alternative: Im Haupttext „Pharaos Heer“ oder „die Ägypter“ ergänzen
  rationale: Der Zusammenhang spielt deutlich auf den Exodus an, doch der hebräische Vers selbst nennt Ägypten und den Pharao nicht. Die allusive Offenheit bleibt deshalb erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch knapper Satzführung. „Mächtige“ wahrt die substantivische Offenheit von עִזּוּז; der Singular ist kollektiv verstanden. Der Fußnotenmarker steht unmittelbar nach dem Flachsbild.
