id: ISA.43.27
reference: Isaiah 43:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָבִ֥י/ךָ הָ/רִאשׁ֖וֹן חָטָ֑א וּ/מְלִיצֶ֖י/ךָ פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
translation:
  language: de
  text: Dein erster Vater[a] hat gesündigt, und deine Wortführer[b] haben sich gegen mich aufgelehnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein frühester Vorfahr“. Der Ausdruck bezeichnet möglicherweise allgemein Israels Ahnherrn, ohne eine bestimmte Person zu nennen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Dolmetscher“, „deine Fürsprecher“ oder „deine Vermittler“. Das hebräische Wort kann Personen bezeichnen, die für andere sprechen oder zwischen ihnen vermitteln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  choice: dein erster Vater
  rationale: Die direkte Wiedergabe bewahrt das hebräische Bild und lässt offen, welcher frühe Stammvater oder Ahnherr gemeint ist.
- source_word: חָטָא
  choice: hat gesündigt
  rationale: Im moralisch-religiösen Zusammenhang ist „sündigen“ die klare und übliche Entsprechung.
- source_word: מְלִיצֶיךָ
  choice: deine Wortführer
  rationale: „Wortführer“ bezeichnet Personen, die für andere sprechen, ohne die mögliche Funktion vorschnell auf Dolmetscher oder kultische Mittler festzulegen.
- source_word: פָּשְׁעוּ בִי
  choice: haben sich gegen mich aufgelehnt
  rationale: Die Wendung gibt den bewussten, gegen Gott gerichteten Charakter von פשע natürlich wieder und bewahrt seine starke Bedeutung von Auflehnung.
theological_decisions:
- issue: Identität des „ersten Vaters“
  choice: Der Ausdruck bleibt unbestimmt.
  alternative: Ausdrückliche Identifizierung mit Adam, Abraham oder Jakob.
  rationale: Der hebräische Text nennt keine bestimmte Person; eine Festlegung würde eine mögliche Deutung in den Haupttext eintragen.
- issue: Funktion der מְלִיצִים
  choice: Als repräsentative „Wortführer“ wiedergegeben.
  alternative: Dolmetscher, Fürsprecher oder Mittler.
  rationale: Der Kontext erlaubt verschiedene Arten sprachlicher oder vermittelnder Vertretung. „Wortführer“ hält diese Funktion offen und vermeidet eine unnötige kultische Spezifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dein erster Vater“ ist bewusst etwas markant formuliert, um die Bildsprache und die nicht aufgelöste Mehrdeutigkeit des Hebräischen zu erhalten; „haben sich gegen mich aufgelehnt“ klingt natürlich und bringt die Stärke des Verbs zum Ausdruck.
