  text: כֹּ֚ל הַ/נִּקְרָ֣א בִ/שְׁמִ֔/י וְ/לִ/כְבוֹדִ֖/י בְּרָאתִ֑י/ו יְצַרְתִּ֖י/ו אַף עֲשִׂיתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: de
  text: alle, die nach meinem Namen genannt sind[a] und die ich zu meiner Ehre geschaffen, geformt, ja gemacht habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die meinen Namen tragen“. Das Hebräische verwendet ein kollektives Singular und wiederholt bei den drei Verben ein Singularsuffix („ihn“).'
    reason: Die Anmerkung bietet eine idiomatische Alternative zur Namensformel und erläutert knapp die im Deutschen nicht beibehaltene kollektive Singularform.
lexical_decisions:
- source_word: כֹּל
  choice: jeden
  rationale: Im Zusammenhang sind die Menschen gemeint, die Gott aus den Himmelsrichtungen sammelt (V. 5–6). „Jeden“ gibt den distributiven Sinn des kollektiven Ausdrucks natürlich wieder.
- source_word: הַנִּקְרָא בִשְׁמִי
  choice: der nach meinem Namen genannt ist
  rationale: Die Formulierung bewahrt den passiven Sinn von קרא und die durch Gottes Namen ausgedrückte Zugehörigkeit, ohne sie lediglich als Namensgleichheit wiederzugeben.
- source_word: וְלִכְבוֹדִי
  choice: und den ich zu meiner Ehre
  rationale: כבוד bezeichnet hier Gottes Ehre beziehungsweise Herrlichkeit. „Zu meiner Ehre“ drückt den Zweck der Erschaffung in natürlichem Deutsch aus.
- source_word: בְּרָאתִיו
  choice: geschaffen habe
  rationale: ברא wird mit „schaffen“ wiedergegeben; das Perfekt ist in diesem deutschen Relativsatz idiomatisch.
- source_word: יְצַרְתִּיו
  choice: den ich geformt
  rationale: „Geformt“ wahrt die Vorstellung des gestaltenden Formens und unterscheidet das Verb von „geschaffen“ und „gemacht“.
- source_word: אַף
  choice: ja
  rationale: „Ja“ gibt die bekräftigende und steigernde Wirkung von אַף knapp und würdig wieder.
- source_word: עֲשִׂיתִיו
  choice: den ich gemacht habe
  rationale: „Gemacht“ wahrt das breite Bedeutungsfeld von עשה sowie den abschließenden dritten Schöpfungsausdruck.
theological_decisions:
- issue: Kollektiver Bezug und maskuline Singularsuffixe
  choice: Der kollektive Ausdruck wird mit „jeden“ wiedergegeben; die maskulinen Singularsuffixe erscheinen als Relativpronomen „den“.
  alternative: „alle, die …; sie habe ich …“ oder formal wiederholt „ihn habe ich …“
  rationale: Der Kontext bezieht die Aussage auf das gesammelte Volk. Die gewählte Form bewahrt dennoch die grammatische Singularstruktur und vermeidet eine unnötige Beschränkung auf männliche Personen.
- issue: Bezug der Zweckangabe לִכְבוֹדִי
  choice: „zu meiner Ehre“ wird unmittelbar mit Gottes Erschaffen verbunden.
  alternative: 'Die hebräische Wortfolge weniger eng gegliedert wiedergeben: „und zu meiner Ehre habe ich ihn geschaffen“'
  rationale: Die Stellung im Hebräischen lässt die formale Satzfolge sichtbar, doch semantisch bezeichnet die Wendung den Zweck der Erschaffung. Die deutsche Fassung vermittelt diesen Bezug klar, ohne einen zusätzlichen theologischen Gedanken einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Verbalfolge „geschaffen – geformt – gemacht“ und die Bekräftigung durch „ja“ bleiben erhalten; die Relativsatzstruktur sorgt trotz der formalen Nähe zum Hebräischen für gute Lesbarkeit.
