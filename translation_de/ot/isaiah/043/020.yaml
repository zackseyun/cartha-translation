  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: de
  text: Die Tiere des Feldes werden mich ehren, die Schakale[a] und die Strauße[b], denn ich gebe Wasser in der Wüste, Flüsse im Ödland, um meinem Volk, meinem Erwählten, zu trinken zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ältere Übersetzungen geben das hebräische Wort mit »Drachen« wieder; im Zusammenhang sind wahrscheinlich Schakale gemeint.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »Töchter des Straußes«, eine hebräische Bezeichnung für Strauße; ältere Übersetzungen geben das Wort bisweilen mit »Eulen« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  choice: werden mich ehren
  rationale: Das Piel von כבד bedeutet hier »ehren« beziehungsweise »verherrlichen«. »Mich ehren« ist natürliches, würdevolles Deutsch und bewahrt die Aussage, ohne sie liturgisch zu überhöhen.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die Tiere des Feldes
  rationale: Die Kollektivform bezeichnet die wild lebenden Tiere. »Tiere des Feldes« erhält das biblisch-poetische Bild und bleibt allgemein verständlich.
- source_word: תַּנִּים
  choice: die Schakale
  rationale: Im Zusammenhang mit Wüstenfauna sind sehr wahrscheinlich Schakale gemeint; mythologische »Drachen« passen hier weniger gut.
- source_word: וּבְנוֹת יַעֲנָה
  choice: und die Strauße
  rationale: Wörtlich »Töchter des Straußes«; dies ist eine idiomatische Bezeichnung für Strauße und wird im Deutschen sinnvoll aufgelöst.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die Ehrung Gottes ein und fügt sich natürlich in den gehobenen deutschen Satz ein.
- source_word: נָתַתִּי
  choice: ich gebe
  rationale: Das hebräische Perfekt schildert Gottes Tat als gewiss und vollgültig. Das Präsens wahrt die lebendige Unmittelbarkeit des prophetischen Bildes; möglich wäre auch »ich habe gegeben«.
- source_word: בַמִּדְבָּר מַיִם
  choice: Wasser in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land; im Deutschen bringt »Wüste« den Gegensatz zum gegebenen Wasser prägnant zum Ausdruck.
- source_word: נְהָרוֹת בִּישִׁמוֹן
  choice: Flüsse im Ödland
  rationale: »Flüsse« bewahrt das Bild überreicher Versorgung; »Ödland« gibt die kahle, verwüstete Landschaft wieder und vermeidet eine bloße Wiederholung von »Wüste«.
- source_word: לְהַשְׁקוֹת
  choice: um … zu trinken zu geben
  rationale: Der Infinitiv bezeichnet den Zweck. Die Wendung ist bei einem menschlichen Objekt natürlich und hält das konkrete Bild des Tränkens fest.
- source_word: עַמִּי בְחִירִי
  choice: meinem Volk, meinem Erwählten
  rationale: »Mein Volk« ist die übliche Wiedergabe von עַמִּי. Das morphologisch singularische בְחִירִי wird als substantivierte Apposition erhalten und bezeichnet das Volk in korporativer Einheit.
theological_decisions:
- issue: Korporativer Singular בְחִירִי in Bezug auf Israel
  choice: meinem Volk, meinem Erwählten
  alternative: meinem Volk, meinen Erwählten / meinem erwählten Volk
  rationale: בְחִירִי ist grammatisch Singular und steht in Apposition zum kollektiven »mein Volk«. Der Singular bewahrt Jesajas Spannung zwischen Volk und korporativer Einzelgestalt; eine deutsche Pluralform würde die morphologische Besonderheit einebnen, während »mein erwähltes Volk« die Apposition auflöst.
- issue: Zeitbezug von נָתַתִּי
  choice: ich gebe
  alternative: ich habe gegeben / ich werde geben
  rationale: Das Perfekt kann im prophetischen Zusammenhang eine als gewiss dargestellte Heilstat bezeichnen. Das deutsche Präsens erhält die bildhafte Unmittelbarkeit, ohne die Tat ausschließlich auf Vergangenheit oder Zukunft festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht poetischem Klang. Die Parallelglieder »Wasser in der Wüste, Flüsse im Ödland« bleiben erhalten. Der ungewöhnliche korporative Singular wird im Haupttext bewusst bewahrt und durch eine Fußnote erläutert.
