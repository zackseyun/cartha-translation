base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: de
  text: 'Doch nun, so spricht Jahwe, der dich erschaffen hat, Jakob, und der dich geformt hat, Israel: Fürchte dich nicht, denn ich habe dich erlöst; ich habe dich bei deinem Namen gerufen; du bist mein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: בֹּרַאֲךָ
  choice: der dich erschaffen hat
  rationale: Die verbale Wiedergabe des Partizips wahrt den Bezug auf Gottes schöpferisches Handeln und passt natürlich zur direkten Anrede Jakobs.
- source_word: וְיֹצֶרְךָ
  choice: der dich geformt hat
  rationale: „Geformt“ bewahrt die Vorstellung des gestaltenden Formens und unterscheidet יצר von ברא („erschaffen“).
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jakob … Israel
  rationale: Die beiden Namen bleiben als parallele Anreden des Bundesvolkes erhalten.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Diese knappe, würdevolle Form gibt das direkte Verbot idiomatisch wieder.
- source_word: גְאַלְתִּיךָ
  choice: ich habe dich erlöst
  rationale: „Erlöst“ bewahrt die Bedeutung von Befreiung und Rückgewinnung durch den zuständigen Löser, ohne den Vorgang enger festzulegen als der hebräische Ausdruck.
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: ich habe dich bei deinem Namen gerufen
  rationale: Die Formulierung bildet das Possessivsuffix ausdrücklich ab und lässt sowohl persönliches Rufen als auch autoritatives Berufungs- oder Herbeirufen anklingen.
- source_word: לִי אָתָּה
  choice: du bist mein
  rationale: Die knappe deutsche Nominalaussage bewahrt den nachdrücklichen Anspruch und die Zugehörigkeit des hebräischen Satzes.
- source_word: וְעַתָּה כֹּה אָמַר
  choice: Doch nun, so spricht
  rationale: „Doch nun“ markiert den tröstlichen Umschwung im Zusammenhang; „so spricht“ wahrt die feierliche prophetische Botenformel.
theological_decisions:
- issue: Bundesbezogene Bedeutung von גאל
  choice: erlöst
  alternative: freigekauft; zurückgewonnen
  rationale: „Erlöst“ erhält die Verbindung von Befreiung, Rückgewinnung und dem Handeln eines Lösers, ohne einen bestimmten Mechanismus in den Text einzutragen.
- issue: Göttlicher Zugehörigkeitsanspruch in לִי אָתָּה
  choice: du bist mein
  alternative: du gehörst mir
  rationale: Die gewählte Fassung folgt der Kürze und Eindringlichkeit des Hebräischen und bewahrt zugleich die Spannung von Zugehörigkeit, Schutz und Anspruch.
- issue: Bedeutung von קרא בשם
  choice: bei deinem Namen gerufen
  alternative: namentlich gerufen; mit deinem Namen genannt
  rationale: Die Hauptfassung gibt die persönliche und bestimmte Anrede natürlich wieder. Die Fußnote weist auf die sprachlich mögliche Nuance hin, ohne die Aussage dogmatisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Botenformel. Die parallelen Anreden „Jakob“ und „Israel“ sowie die knappen Zusagen des Ausgangstextes bleiben erhalten.
