  text: אָנֹכִ֨י אָנֹכִ֥י ה֛וּא מֹחֶ֥ה פְשָׁעֶ֖י/ךָ לְמַעֲנִ֑/י וְ/חַטֹּאתֶ֖י/ךָ לֹ֥א אֶזְכֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: de
  text: Ich, ich bin es, der deine Vergehen auslöscht[a] um meinetwillen; und an deine Sünden werde ich nicht mehr denken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegwischt“ beziehungsweise „tilgt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das bedeutet hier: Gott wird diese Sünden seinem Volk nicht länger vorhalten oder gegen es in Anschlag bringen.'
    reason: meaning_clarification
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Ich, ich bin es
  rationale: Die Wiederholung des selbstständigen Personalpronomens ist ausdrücklich emphatisch. „Ich, ich bin es“ bewahrt sowohl die Wiederholung als auch die anschließende Selbstidentifikation durch הוּא in natürlichem Deutsch.
- source_word: מֹחֶה
  choice: der … auslöscht
  rationale: Das Partizip bezeichnet hier das Tilgen beziehungsweise Wegwischen von Schuld. „Auslöschen“ bewahrt das Bild vollständiger Beseitigung und ist im modernen Deutsch verständlich.
- source_word: פְשָׁעֶיךָ
  choice: deine Vergehen
  rationale: פשע kann Übertretung, Auflehnung oder Vergehen bezeichnen. „Vergehen“ hält den moralischen Ernst fest, ohne die mögliche Bundesdimension ausdrücklich hinzuzufügen.
- source_word: לְמַעֲנִי
  choice: um meinetwillen
  rationale: Die Wendung begründet das Handeln Gottes in ihm selbst, seinem Namen und seinem Vorsatz. „Um meinetwillen“ gibt diese Selbstbezogenheit knapp und idiomatisch wieder.
- source_word: וְחַטֹּאתֶיךָ
  choice: und … deine Sünden
  rationale: „Sünden“ ist die geläufige und genaue Wiedergabe von חטאות und unterscheidet den Ausdruck weiterhin von פשעים.
- source_word: לֹא אֶזְכֹּר
  choice: werde ich nicht mehr denken
  rationale: Das Verb זכר bedeutet erinnern oder an etwas denken. In der deutschen Verbindung „an deine Sünden werde ich nicht mehr denken“ wird die zukunftsgerichtete Zusage natürlich ausgedrückt; „nicht mehr“ gibt im Kontext das künftige Nicht-in-Anschlag-Bringen wieder.
theological_decisions:
- issue: Grund der Vergebung
  choice: Gott löscht die Vergehen „um meinetwillen“ aus.
  alternative: Gott vergibt aufgrund der Würdigkeit oder ausdrücklich genannten Reue des Menschen.
  rationale: לְמַעֲנִי nennt Gottes eigenes Anliegen als Grund. Die Übersetzung bewahrt diese Spannung und ergänzt keine im Vers ungenannte menschliche Voraussetzung.
- issue: Gottes Nichtgedenken der Sünden
  choice: „An deine Sünden werde ich nicht mehr denken“ bezeichnet Gottes Zusage, sie nicht mehr gegen sein Volk in Anschlag zu bringen.
  alternative: Gott verliert buchstäblich die Kenntnis vergangener Sünden.
  rationale: זכר kann in solchen Beziehungsaussagen ein wirksames Gedenken bezeichnen. Die Hauptübersetzung bleibt nah am Wortlaut; die Fußnote erklärt die Aussage, ohne eine Lehre über Gottes Erkenntnis in den Vers hineinzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung „Ich, ich“ und die ungewöhnlich gewichtige Wortstellung im zweiten Satzteil wurden bewusst beibehalten. Die Anrede steht entsprechend dem Hebräischen im Singular.
