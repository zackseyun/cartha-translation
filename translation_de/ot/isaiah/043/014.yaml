source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: de
  text: 'So spricht Jahwe, euer Erlöser, der Heilige Israels: Um euretwillen habe ich nach Babylon gesandt[a] und sie alle als Flüchtlinge hinabgebracht[b], auch die Chaldäer auf den Schiffen ihres Jubels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habe ich gegen Babylon gesandt“. Wörtlich steht im Hebräischen „habe ich nach Babylon gesandt“; wen oder was Gott sandte, bleibt unausgesprochen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und alle Riegel hinabgebracht“; das hier mit „Flüchtlinge“ wiedergegebene hebräische Wort ist schwierig und wurde auch auf „Riegel“ oder, weniger wahrscheinlich, auf „Vornehme“ bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamencharakter des Tetragramms.
- source_word: גֹּאַלְכֶם
  choice: euer Erlöser
  rationale: „Erlöser“ gibt die in Jesaja gewichtige Vorstellung von Befreiung und Wiederherstellung knapp und würdig wieder.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feste, wiederkehrende Jesaja-Bezeichnung wird in ihrer feierlichen und verständlichen Form bewahrt.
- source_word: לְמַעַנְכֶם
  choice: Um euretwillen
  rationale: Die Formulierung drückt aus, dass Jahwe zugunsten Israels handelt, und entspricht dem gehobenen prophetischen Register.
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: habe ich nach Babylon gesandt
  rationale: Das Richtungs-h an בָבֶלָה stützt „nach Babylon“; wie im Hebräischen bleibt das Objekt des Sendens unausgesprochen.
- source_word: וְהוֹרַדְתִּי
  choice: und ... hinabgebracht
  rationale: Die Kausativform von ירד wird präzise wiedergegeben und lässt sowohl räumliches Hinabführen als auch Erniedrigung anklingen.
- source_word: בָרִיחִים
  choice: als Flüchtlinge
  rationale: Die kontextuell plausible Ableitung von ברח ergibt ein stimmiges Bild der besiegten Babylonier; die erhebliche lexikalische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Formulierung bewahrt die umfassende Aussage des hebräischen Ausdrucks.
- source_word: וְכַשְׂדִּים
  choice: auch die Chaldäer
  rationale: „Auch“ verdeutlicht die wahrscheinlich erläuternd-emphatische Funktion der Konjunktion, ohne die Chaldäer von der zuvor genannten Gesamtheit abzutrennen.
- source_word: בָּאֳנִיּוֹת
  choice: auf den Schiffen
  rationale: Im Deutschen ist „auf Schiffen“ die natürliche Ortsangabe; die Präposition ב lässt diese räumliche Wiedergabe zu.
- source_word: רִנָּתָם
  choice: ihres Jubels
  rationale: רִנָּה bezeichnet häufig einen weithin hörbaren Jubelruf. Die knappe Genitivverbindung bewahrt die ungewöhnliche und wohl ironische Bildsprache des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen und verwendet die im modernen Deutschen übliche Form.
- issue: Deutung von בָרִיחִים
  choice: als Flüchtlinge
  alternative: 'als Riegel; weniger wahrscheinlich: als Vornehme'
  rationale: Die Lesart „Flüchtlinge“ passt zum Bild von Babylons Niederlage und Flucht, ist lexikalisch jedoch nicht sicher. Deshalb werden die Hauptalternativen nicht stillschweigend ausgeschlossen.
- issue: Unausgesprochenes Objekt bei שִׁלַּחְתִּי
  choice: 'Das Objekt bleibt unausgesprochen: „habe ich nach Babylon gesandt“'
  alternative: „habe ich gegen Babylon gesandt“
  rationale: Das Hebräische nennt kein Objekt und bezeichnet ausdrücklich eine Richtung nach Babylon. Die offene Form bewahrt diese syntaktische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ton. „Um euretwillen“ und „der Heilige Israels“ halten das gehobene Register, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Die ungewöhnliche Wendung „auf den Schiffen ihres Jubels“ bewahrt bewusst die knappe, mehrdeutige Bildsprache des masoretischen Textes.
