id: ISA.43.3
reference: Isaiah 43:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: de
  text: Denn ich bin Jahwe, dein Gott, der Heilige Israels, dein Retter. Ich habe Ägypten als Lösegeld für dich gegeben, Kusch[a] und Seba an deiner Stelle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kusch bezeichnet eine antike Region südlich von Ägypten, die häufig mit Nubien beziehungsweise Teilen des heutigen Sudan und Äthiopien verbunden wird.
    reason: cultural_note
  - marker: b
    text: 'Oder: „im Austausch für dich“. Der hebräische Ausdruck bezeichnet Stellvertretung oder Austausch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Zusage im vorausgehenden Zusammenhang ein und gibt den erklärenden Anschluss natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder und bewahrt seine bundesbezogene Aussagekraft.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Entspricht der Form mit dem Suffix der zweiten Person Singular und klingt in der Bundesformel natürlich.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Bewahrt den für Jesaja charakteristischen Titel und seine knappe, feierliche Form.
- source_word: מוֹשִׁיעֶךָ
  choice: dein Retter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den, der rettet; „Retter“ ist unmittelbar verständlich und bewahrt den persönlichen Bezug.
- source_word: נָתַתִּי
  choice: ich habe … gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene göttliche Handlung; das deutsche Perfekt bringt deren gegenwärtige Bedeutung im prophetischen Zusammenhang gut zum Ausdruck.
- source_word: כָפְרְךָ
  choice: als Lösegeld für dich
  rationale: כֹּפֶר bezeichnet hier eine Ersatz- oder Loskaufsleistung. „Lösegeld“ bewahrt das starke Bild des Austauschs, ohne kultische Sühneterminologie einzutragen.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Die Umschrift vermeidet die Gleichsetzung mit einem heutigen Staat und bezeichnet die antike Region präziser.
- source_word: סְבָא
  choice: Seba
  rationale: Übliche Umschrift des Ortsnamens; sie hält Seba von Saba unterscheidbar.
- source_word: תַּחְתֶּיךָ
  choice: an deiner Stelle
  rationale: Die Wendung bezeichnet Stellvertretung beziehungsweise Austausch. „An deiner Stelle“ gibt den hebräischen Ausdruck knapp und deutlich wieder.
theological_decisions:
- issue: Bedeutung der Austauschformulierung mit Ägypten, Kusch und Seba
  choice: Die genannten Länder werden als Lösegeld beziehungsweise an Israels Stelle gegeben; der Text beschreibt Gottes geschichtliche Rettung und Bewahrung Israels.
  alternative: Die Aussage kann schwächer als politische Entschädigung oder Gegenleistung verstanden werden.
  rationale: Der unmittelbare Zusammenhang handelt von der Rettung und Bewahrung Israels. „Lösegeld“ und „an deiner Stelle“ erhalten die deutliche Ersatz- und Austauschvorstellung, ohne eine spätere systematische Sühnelehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Gottesname wird als „Jahwe“ wiedergegeben. Die beiden parallelen Titel bleiben erhalten; die Austauschmetaphorik wird deutlich, aber nicht dogmatisch ausgelegt.
