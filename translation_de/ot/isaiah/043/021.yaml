revisions:
- from: Dieses Volk habe ich für mich geformt; es soll von meinem Ruhm erzählen.
  to: Dieses Volk habe ich für mich geformt; es wird mein Lob verkünden.
  rationale: Die Revision erhält die bewusste Formungsmetaphorik und die Zweck-/Zugehörigkeitsnuance von „für mich“, stellt aber den zentralen Begriff תְּהִלָּתִי mit „mein Lob“ genauer wieder. „Verkünden“ entspricht dem Piel von ספר im gehobenen prophetischen Kontext und wahrt die direkte Verbindung von Gottes Lob und dem Reden des Volkes. Eine Fußnote ist nicht erforderlich.
