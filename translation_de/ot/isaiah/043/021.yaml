base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/021.yaml
  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: de
  text: Dieses Volk habe ich für mich geformt; es wird mein Lob verkünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם
  choice: Volk
  rationale: עַם bezeichnet hier eine zusammengehörige Menschengruppe. „Volk“ ist im Deutschen natürlich und wahrt den gemeinschaftlichen Sinn, ohne einen modernen Nationalstaat vorauszusetzen.
- source_word: זוּ
  choice: dieses
  rationale: זוּ weist demonstrativ auf das im Kontext bezeichnete Volk zurück; „dieses“ gibt den Bezug knapp und unmittelbar wieder.
- source_word: יָצַרְתִּי
  choice: habe ich geformt
  rationale: יצר bezeichnet häufig ein bewusstes Formen oder Gestalten. „Geformt“ bewahrt den handwerklich-intentionalen Beiklang besser als das allgemeinere „geschaffen“.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition ל mit Suffix der ersten Person bezeichnet hier Zugehörigkeit beziehungsweise Bestimmung. „Für mich“ ist direkt und lässt beide Nuancen bestehen.
- source_word: תְּהִלָּתִי
  choice: meinem Ruhm
  rationale: תְּהִלָּה kann den Lobpreis Gottes oder seinen rühmlichen Charakter beziehungsweise Ruhm bezeichnen. Mit ספר ist „von meinem Ruhm erzählen“ im Deutschen idiomatisch und bewahrt den Inhalt des verkündeten Lobes.
- source_word: יְסַפֵּרוּ
  choice: es soll … erzählen
  rationale: Das Piel von ספר bedeutet erzählen, berichten oder verkünden. Die deutsche Soll-Fügung bringt in diesem Zusammenhang die Bestimmung des von Gott geformten Volkes natürlich zum Ausdruck, ohne einen ausdrücklichen hebräischen Zwecksatz einzufügen.
theological_decisions:
- issue: Verhältnis zwischen Gottes Formen des Volkes und dessen Verkündigung
  choice: „es soll von meinem Ruhm erzählen“ als Ausdruck der Bestimmung
  alternative: „sie werden mein Lob verkünden“ als einfache Zukunfts- oder Folgerungsangabe
  rationale: Das Hebräische verbindet die Aussagen ohne ausdrückliche Zweckkonjunktion. Die Soll-Fügung gibt die naheliegende Bestimmung wieder, lässt aber offen, ob der Nachdruck auf Zweck, Ergebnis oder erwarteter Zukunft liegt.
- issue: Bedeutung von תְּהִלָּתִי
  choice: „meinem Ruhm“
  alternative: „meinem Lob“
  rationale: „Mein Lob“ wäre formaler, kann im Deutschen jedoch wie Gottes eigenes Loben missverstanden werden. „Von meinem Ruhm erzählen“ bezeichnet natürlich das rühmende Reden über Gott und passt eng zum Bedeutungsfeld des Nomens und des Verbs.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wortstellung hebt „Dieses Volk“ hervor; der Singular „es“ nimmt das Kollektivnomen „Volk“ grammatisch korrekt auf. Keine konfessionell geprägte Terminologie.
