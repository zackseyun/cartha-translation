  text: גַּם מִ/יּוֹם֙ אֲנִ֣י ה֔וּא וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּ֑יל אֶפְעַ֖ל וּ/מִ֥י יְשִׁיבֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: de
  text: Ja, von jenem Tag an[a] bin ich es. Niemand kann aus meiner Hand retten. Ich handle – wer kann es rückgängig machen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe hebräische Wendung kann auch »von heute an«, »seit den ältesten Tagen« oder deutender »von Ewigkeit her« verstanden werden.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »Wer kann es zurückwenden?« Das angehängte Pronomen bezieht sich wahrscheinlich auf Gottes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Ja
  rationale: Die Partikel verstärkt hier die folgende Aussage. »Ja« gibt diese bekräftigende Funktion im Deutschen natürlich wieder; ein bloß additives »auch« wäre missverständlich.
- source_word: מִיּוֹם
  choice: von jeher
  rationale: Die knappe Wendung bezeichnet eine von einem »Tag« beziehungsweise Zeitpunkt her bestehende Dauer, ohne den Ausgangspunkt ausdrücklich festzulegen. »Von jeher« ist im Zusammenhang idiomatisch; die anderen möglichen zeitlichen Deutungen werden in der Fußnote offengehalten.
- source_word: אֲנִי הוּא
  choice: bin ich es
  rationale: Die Formulierung bewahrt die markante göttliche Selbstidentifikation möglichst unmittelbar. »Ich bin es« ist modernes, natürliches Deutsch und legt die Aussage nicht durch einen ergänzten Hoheitstitel aus.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: Niemand kann aus meiner Hand retten
  rationale: Die Wiedergabe erhält das Bild der »Hand« als Ausdruck von Macht und Verfügungsgewalt. Das modal formulierte »kann« bringt die im Zusammenhang ausgesagte Unmöglichkeit idiomatisch zum Ausdruck.
- source_word: אֶפְעַל
  choice: Ich handle
  rationale: פעל bezeichnet hier Gottes wirksames, entschlossenes Tun. »Ich handle« ist prägnant und passt zur anschließenden rhetorischen Frage.
- source_word: יְשִׁיבֶנָּה
  choice: kann es rückgängig machen
  rationale: Der Hifil von שוב bedeutet hier, das vollzogene oder beabsichtigte Handeln zurückzuwenden, also aufzuheben. »Rückgängig machen« gibt den Sinn in natürlichem Deutsch wieder; das Suffix verweist wahrscheinlich auf die implizite Handlung.
theological_decisions:
- issue: Zeitlicher Umfang von מִיּוֹם
  choice: von jeher
  alternative: von heute an; seit jenem Tag; seit den ältesten Tagen; von Ewigkeit her
  rationale: Der hebräische Ausdruck ist knapp und lässt den zeitlichen Bezugspunkt unausgesprochen. Die Übersetzung bezeichnet Gottes schon lange bestehende Identität, ohne aus der Wendung allein ausdrücklich eine metaphysische Aussage über die Ewigkeit abzuleiten; die echte Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- issue: Selbstidentifikationsformel אֲנִי הוּא
  choice: ich bin es
  alternative: ich bin derselbe; ich bin der Eine; ich bin
  rationale: »Ich bin es« erhält die gewichtige Selbstidentifikation, ohne »derselbe« oder eine spätere dogmatische Deutung in den Wortlaut einzutragen.
- issue: Unwiderstehlichkeit des göttlichen Handelns
  choice: Niemand kann retten; niemand kann Gottes Handeln rückgängig machen
  alternative: Die Aussagen lediglich als allgemeine Überlegenheit Gottes zu umschreiben
  rationale: Die beiden absoluten Aussagen und die rhetorische Frage werden in ihrer Spannung und Stärke bewahrt, ohne sie systematisch-theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, nachdrücklichen Sätzen. Die Selbstidentifikation bleibt bewusst knapp; das Bild von Gottes Hand wird erhalten. Die Gedankenstriche markieren den engen rhetorischen Zusammenhang zwischen Gottes Handeln und der Frage nach dessen Unumkehrbarkeit.
