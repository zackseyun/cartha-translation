source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: de
  text: 'Ich werde zum Norden sagen: »Gib sie heraus!«, und zum Süden: »Halte sie nicht zurück! Bring meine Söhne aus der Ferne her und meine Töchter vom Ende der Erde.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Gib!« und »Halte nicht zurück!« Das Objekt bleibt im Hebräischen unausgesprochen; gemeint sind Gottes zerstreute Söhne und Töchter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vom Ende des Landes«. Das hebräische Wort kann sowohl »Erde« als auch »Land« bedeuten; »Ende« steht im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ich werde … sagen
  rationale: Das Qal-Imperfekt in der prophetischen Ankündigung wird natürlich als Zukunft wiedergegeben.
- source_word: לַצָּפוֹן / וּלְתֵימָן
  choice: zum Norden / zum Süden
  rationale: Die Himmelsrichtungen werden personifiziert angeredet; תֵימָן bezeichnet im Parallelismus den Süden, nicht den edomitischen Ort Teman.
- source_word: תֵּנִי
  choice: Gib sie heraus
  rationale: Der feminine Singular richtet sich an den personifizierten Norden. Das im Hebräischen unausgesprochene Objekt wird im Deutschen aus dem Kontext mit »sie« aufgenommen.
- source_word: אַל תִּכְלָאִי
  choice: Halte sie nicht zurück
  rationale: Die feminine Verbform richtet sich an den personifizierten Süden; die Formulierung gibt das Zurückhalten der Zerstreuten in natürlichem Deutsch wieder.
- source_word: הָבִיאִי
  choice: Bring … her
  rationale: Der Hifil-Imperativ im femininen Singular setzt die Anrede an die personifizierten Regionen fort; »herbringen« drückt die Bewegung zum Sprecher hin aus.
- source_word: בָנַי / וּבְנוֹתַי
  choice: meine Söhne / meine Töchter
  rationale: Die ausdrücklich männliche und weibliche Parallelform des Hebräischen bleibt erhalten.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Die geläufige deutsche Wendung bewahrt die Angabe entfernter Herkunft.
- source_word: מִקְצֵה הָאָרֶץ
  choice: vom Ende der Erde
  rationale: Die singularische Form קְצֵה wird eng am Ausgangstext wiedergegeben; הָאָרֶץ kann je nach Zusammenhang »Erde« oder »Land« bedeuten.
theological_decisions:
- issue: Worauf sich die Befehle an Norden und Süden beziehen
  choice: Norden und Süden erscheinen als personifizierte Regionen, die Gottes zerstreute Söhne und Töchter herausgeben und herbringen sollen.
  alternative: Die Himmelsrichtungen könnten lediglich als unbestimmte kosmische Mächte verstanden werden.
  rationale: Der unmittelbare Zusammenhang handelt von der Sammlung Israels; »meine Söhne« und »meine Töchter« benennen die Zurückkehrenden ausdrücklich, ohne den historischen und theologischen Horizont enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Rede. Die personifizierten Himmelsrichtungen und die geschlechtsspezifische Paarung »Söhne/Töchter« bleiben sichtbar; ergänzte Pronomen werden in einer Fußnote offengelegt.
