base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: de
  text: Du hast mir kein Schaf für deine Brandopfer gebracht und mich mit deinen Schlachtopfern nicht geehrt. Ich habe dich nicht mit Getreideopfern belastet[a] und dich nicht mit Weihrauch ermüdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich habe dich nicht mit Getreideopfern dienen lassen.“ Die hebräische Wendung kann das Auferlegen eines Dienstes ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂה
  choice: Schaf
  rationale: שֵׂה bezeichnet ein Stück Kleinvieh, also ein Schaf oder eine Ziege. „Schaf“ ist hier eine natürliche, hinreichend breite Wiedergabe; „Lamm“ wäre zu eng.
- source_word: עֹלֹתֶיךָ
  choice: als Brandopfer
  rationale: עֹלָה ist der übliche Ausdruck für das vollständig verbrannte Opfer. Die singularische Formulierung „kein Schaf als Brandopfer“ gibt die hebräische Verbindung im Deutschen natürlich wieder.
- source_word: זְבָחֶיךָ
  choice: deine Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer. „Schlachtopfer“ bewahrt den kultischen Sinn genauer als das allgemeinere „Opfer“.
- source_word: כִבַּדְתָּנִי
  choice: mich … geehrt
  rationale: כבד bedeutet im Piel gewöhnlich „ehren“. Im Zusammenhang wird die unterlassene Opferdarbringung als verweigerte Ehre beschrieben.
- source_word: הֶעֱבַדְתִּיךָ
  choice: Ich habe dich nicht … belastet
  rationale: Das Hifil von עבד bedeutet wörtlich „dienen lassen“ oder „Dienst auferlegen“. Zusammen mit der parallelen Aussage über das Ermüden vermittelt „belastet“ die idiomatische Aussage von auferlegtem beschwerlichem Dienst; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: מִנְחָה
  choice: Getreideopfern
  rationale: מִנְחָה bezeichnet im Opferkontext gewöhnlich ein aus Getreide bestehendes Opfer. „Getreideopfer“ ist präzise und für heutige Leser verständlich.
- source_word: הוֹגַעְתִּיךָ
  choice: dich … ermüdet
  rationale: Das Hifil von יגע bedeutet „müde machen, ermüden“ und bildet eine bewusste Parallele zum auferlegten Dienst der vorhergehenden Teilaussage.
- source_word: לְבוֹנָה
  choice: Weihrauch
  rationale: לְבוֹנָה bezeichnet spezifisch Weihrauch und nicht Räucherwerk im Allgemeinen.
- source_word: לִי
  choice: mir
  rationale: Die Präposition kennzeichnet Richtung beziehungsweise Empfänger; „mir … gebracht“ ist die natürliche deutsche Formulierung.
theological_decisions:
- issue: Sinn der Aussage Gottes über den Opferdienst
  choice: Gott sagt, dass er Israel keinen beschwerlichen Opferdienst auferlegt hat.
  alternative: Gott sagt, dass er überhaupt keine Opfer verlangt habe.
  rationale: Die parallelen Aussagen „nicht … belastet“ und „nicht … ermüdet“ betonen Gottes nicht bedrückendes Handeln, während Israels mangelnde Ehrung gerügt wird. Die Formulierung lässt die Spannung zur anderweitig bezeugten Anordnung von Opfern bestehen, ohne daraus eine generelle Verneinung des Opferdienstes zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe werden beibehalten, aber transparent formuliert. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
