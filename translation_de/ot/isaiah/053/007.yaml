source:
  edition: WLC
  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: de
  text: Er wurde bedrängt und gedemütigt,[a] doch er öffnete seinen Mund nicht. Wie ein Lamm, das zur Schlachtung geführt wird, und wie ein weibliches Schaf, das vor denen, die es scheren, still ist, so öffnete er seinen Mund nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wurde bedrängt, doch er demütigte sich.“ Der hebräische Anfang des Verses ist schwierig; das zweite Verb kann statt als passive Demütigung auch im Sinn einer Selbsterniedrigung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  choice: wurde bedrängt
  rationale: Das Nifal bezeichnet hier harte Bedrängung oder Unterdrückung. „Wurde bedrängt“ ist natürliches, gegenwärtiges Deutsch und wahrt die passive Gewalterfahrung.
- source_word: נַעֲנֶה
  choice: wurde gedemütigt
  rationale: Die Form kann passive Erniedrigung beziehungsweise Misshandlung, möglicherweise aber auch reflexive Selbsterniedrigung ausdrücken. „Wurde gedemütigt“ passt zum Parallelismus, ohne die Schwierigkeit zu verdecken; die Alternative wird in der Fußnote genannt.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: doch er öffnete seinen Mund nicht
  rationale: „Doch“ gibt beim ersten Vorkommen den konzessiven Zusammenhang idiomatisch wieder. Die körpernahe Wendung „seinen Mund öffnen“ bleibt wegen ihrer Klarheit und rhetorischen Wiederholung erhalten.
- source_word: כַּשֶּׂה
  choice: wie ein Lamm
  rationale: שֶׂה kann ein Tier aus dem Kleinvieh bezeichnen; im Bild des Schlachtens bringt „Lamm“ Schutzlosigkeit und Verletzlichkeit prägnant zum Ausdruck.
- source_word: לַטֶּבַח
  choice: zum Schlachten
  rationale: Die Wendung gibt Richtung und Zweck natürlich wieder und verbindet sich im Deutschen idiomatisch mit „geführt wird“.
- source_word: יוּבָל
  choice: geführt wird
  rationale: Das Hofal bezeichnet das passive Geführt- oder Gebrachtwerden unter fremder Gewalt. Das hebräische Imperfekt wird innerhalb des zeitlos vergegenwärtigenden Vergleichs präsentisch wiedergegeben.
- source_word: וּכְרָחֵל
  choice: und wie ein Mutterschaf
  rationale: רָחֵל bezeichnet spezifisch ein weibliches Schaf. „Mutterschaf“ ist allgemein verständlicher als „Aue“ und bewahrt die Geschlechtsspezifik.
- source_word: לִפְנֵי גֹזְזֶיהָ
  choice: vor seinen Scherern
  rationale: Die Form bezeichnet diejenigen, die das weibliche Schaf scheren. Das natürliche deutsche Genus von „Mutterschaf“ verlangt das Pronomen „seinen“.
- source_word: נֶאֱלָמָה
  choice: verstummt
  rationale: Das Verb bezeichnet Schweigen beziehungsweise Stummsein. „Verstummt“ fügt sich als Prädikat natürlich in den Vergleich und bewahrt die starke Bildwirkung.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: so öffnete er seinen Mund nicht
  rationale: Beim wiederholten Schlussglied macht „so“ die Folgerichtung des Vergleichs im Deutschen hörbar, während die bewusste Wiederholung erhalten bleibt.
theological_decisions:
- issue: Grad der messianischen Explizitheit
  choice: Der Vers wird nach seinem unmittelbaren hebräischen Wortlaut übersetzt, ohne die Gestalt ausdrücklich mit Christus zu identifizieren.
  alternative: Eine stärker durch neutestamentliche Zitate und traditionelle christologische Formulierungen geprägte Wiedergabe.
  rationale: Die christliche Auslegung erkennt hier eine Erfüllung in Christus; die Übersetzung selbst soll diese Identifikation jedoch nicht in den hebräischen Wortlaut eintragen. Das Bild des schweigend leidenden Knechtes und seine Spannung bleiben unverändert stehen.
- issue: Deutung von נַעֲנֶה
  choice: 'Passiv: „wurde gedemütigt“'
  alternative: 'Reflexiv: „demütigte sich“'
  rationale: Der Parallelismus mit נִגַּשׂ stützt eine passive Leidensaussage, doch die reflexive Deutung ist sprachlich möglich und wird deshalb in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Bildsprache. Die rhetorische Wiederholung von „er öffnete seinen Mund nicht“ bleibt erhalten. „Mutterschaf“ vermeidet das heute wenig geläufige „Aue“, ohne die feminine Spezifik des Hebräischen aufzugeben.
