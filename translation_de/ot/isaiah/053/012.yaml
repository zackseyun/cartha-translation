id: ISA.53.12
reference: Isaiah 53:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: de
  text: Darum werde ich ihm unter den Vielen einen Anteil geben[a], und mit den Starken wird er Beute teilen, weil er sein Leben in den Tod ausgeschüttet hat und zu den Übertretern gezählt wurde[b]. Doch er trug die Sünde vieler und tritt für die Übertreter ein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum werde ich ihm einen Anteil mit den Vielen geben.“ Die knappe hebräische Wendung kann auf mehrere eng verwandte Arten verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wurde unter die Übertreter gerechnet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „legt Fürbitte für die Übertreter ein“. Das hebräische Verb kann hier formeller oder idiomatischer wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem Leiden und der anschließenden Erhöhung des Knechtes in natürlichem, gehobenem Deutsch.
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  choice: werde ich ihm unter den Vielen einen Anteil geben
  rationale: Bewahrt die Vorstellung eines zugeteilten Anteils und die syntaktische Mehrdeutigkeit der knappen hebräischen Wendung, ohne die Vielen selbst eindeutig zum Anteil zu erklären.
- source_word: עֲצוּמִים
  choice: die Starken
  rationale: Gibt die übliche Bedeutung von Stärke oder Macht wieder und passt zum Bild des Teilens von Kriegsbeute.
- source_word: יְחַלֵּק שָׁלָל
  choice: wird er Beute teilen
  rationale: Natürliches modernes Deutsch für das Bild vom Aufteilen erbeuteter Güter nach einem Sieg.
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Drückt den hier naheliegenden begründenden Zusammenhang knapp und verständlich aus.
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  choice: er sein Leben in den Tod ausgeschüttet hat
  rationale: Erhält das eindrückliche hebräische Bild des Ausschüttens und gibt נֶפֶשׁ kontextgemäß mit „Leben“ wieder.
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  choice: und zu den Übertretern gezählt wurde
  rationale: Gibt die passive Zuordnung zu den Übertretern präzise und idiomatisch wieder.
- source_word: פֹּשְׁעִים
  choice: Übertreter
  rationale: Bewahrt den moralisch-rechtlichen Sinn von פשע und vermeidet die Verallgemeinerung zu „Sündern“.
- source_word: וְהוּא
  choice: Doch er
  rationale: 'Macht den im Zusammenhang liegenden Gegensatz sichtbar: Er wurde Übertretern zugerechnet, trug aber die Sünde anderer.'
- source_word: חֵטְא רַבִּים נָשָׂא
  choice: er trug die Sünde vieler
  rationale: Bewahrt sowohl das Tragen als auch den singularischen Ausdruck „Sünde“, ohne ihn auf eine bestimmte spätere Lehrformel festzulegen.
- source_word: רַבִּים
  choice: die Vielen / viele
  rationale: Die beiden deutschen Formen entsprechen der jeweiligen hebräischen Konstruktion und bewahren den Umfangsausdruck, ohne ihn als „alle“ oder als begrenzte Gruppe auszulegen.
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  choice: und tritt für die Übertreter ein
  rationale: Gibt den Fürbitte- beziehungsweise Vermittlungssinn des Hiphil von פגע in natürlichem modernem Deutsch wieder; der hebräische Imperfekt bleibt als gegenwärtig-fortdauernde Aussage offen.
theological_decisions:
- issue: Reichweite von רַבִּים
  choice: „die Vielen“ beziehungsweise „viele“ beibehalten
  alternative: „alle“ oder „die Menge“
  rationale: Der hebräische Text sagt רַבִּים. Die Übersetzung entscheidet nicht, ob dies rhetorisch alle oder eine begrenztere Gruppe bezeichnet.
- issue: Sühnebezug von נָשָׂא חֵטְא
  choice: „trug die Sünde vieler“
  alternative: „nahm die Sünde vieler weg“ oder „erlitt für viele die Strafe“
  rationale: Die Formulierung erhält die stellvertretende und kultische Tragweite, ohne sie in eine einzelne dogmatische Erklärung aufzulösen.
- issue: Zeit- und Bedeutungswert von יַפְגִּיעַ
  choice: „tritt für die Übertreter ein“
  alternative: „trat für die Übertreter ein“ oder „legt Fürbitte für die Übertreter ein“
  rationale: Das Präsens lässt den hebräischen Imperfekt als zusammenfassende oder fortdauernde Aussage stehen und vermeidet eine unnötige Festlegung auf ausschließlich vergangenes Handeln.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Das poetische Bild des ausgeschütteten Lebens und die Wiederholung von „Übertreter“ bleiben erhalten. Die Satzstruktur folgt dem argumentativen Bogen des Hebräischen, ohne dessen kompakte Wendungen unnatürlich nachzubilden.
