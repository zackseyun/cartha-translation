  terminology: „Übertreter“ bildet פֹּשְׁעִים konsistent ab und bewahrt dessen stärkeres Moment des Aufbegehrens bzw. der Übertretung. „Sünde vieler“ erhält den singularischen hebräischen Ausdruck. Die Wiedergabe von רַבִּים als „die Vielen“ beziehungsweise „vieler“ vermeidet jede dogmatische Festlegung über dessen Umfang.
