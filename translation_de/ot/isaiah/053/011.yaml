revisions:
- from: Nach der Mühsal seiner Seele wird er sehen und satt werden.[a] Durch seine Erkenntnis wird mein gerechter Knecht die Vielen gerecht machen, und ihre Vergehen wird er tragen.[b]
  to: Aus der Mühsal seiner Seele heraus wird er sehen und satt werden.[b] Durch seine Erkenntnis[a] wird mein gerechter Knecht viele gerecht sprechen, und er selbst wird ihre Schuld tragen.
  rationale: 'Die Revision korrigiert die vertauschten Fußnotenanker und gibt die entscheidenden hebräischen Nuancen genauer wieder: מֵעֲמַל bleibt ohne rein zeitliche Festlegung, יַצְדִּיק wird mit dem im Kontext naheliegenden „gerecht sprechen“ übersetzt, und das emphatische הוּא erscheint als „er selbst“. Die objektive Deutung von בְּדַעְתּוֹ sowie die Lesart „Licht“ bleiben ausschließlich in den jeweils korrekt verankerten Fußnoten erhalten.'
