  verdict: revise
  source_fidelity: Die Hauptfassung trifft den masoretischen Text im Wesentlichen, doch „Nach der Mühsal“ verengt מֵעֲמַל unnötig zu einer rein zeitlichen Abfolge. „gerecht machen“ ist für יַצְדִּיק im Deutschen zudem zu stark transformativ und verdeckt die naheliegende Bedeutung „für gerecht erklären/sprechen“. Das betonte הוּא sollte berücksichtigt werden.
  naturalness: Die vorgeschlagene Fassung ist überwiegend verständlich, aber „Aus der Mühsal seiner Seele heraus“ bildet die offene hebräische Präposition genauer ab. „Viele gerecht sprechen“ ist modernes, verständliches Bibeldeutsch; „ihre Schuld tragen“ ist idiomatischer als „ihre Vergehen tragen“.
  terminology: „Mühsal“, „Seele“ und „Knecht“ sind angemessen. Für עָוֺן ist „Schuld“ als kollektiver Singular idiomatisch und bedeutungsstark. „Gerecht sprechen“ gibt den Hifil von צדק präziser wieder, ohne den Mechanismus über den Aussagegehalt hinaus auszudeuten.
  issues:
  - severity: medium
    issue: Die Fußnotenmarker sind an den falschen Aussagen verankert.
    rationale: Die Anmerkung zur alternativen Deutung von בְּדַעְתּוֹ muss bei „seine Erkenntnis“ stehen; die textkritische Anmerkung zu „sehen [Licht]“ muss bei „sehen und satt werden“ stehen.
  - severity: medium
    issue: „Nach der Mühsal“ macht מֵעֲמַל ausschließlich temporal.
    rationale: Die Präposition kann hier Herkunft, Folge oder Ergebnis aus der Mühsal anzeigen. Eine Formulierung mit „aus ... heraus“ bewahrt diese Offenheit besser.
  - severity: medium
    issue: „Die Vielen gerecht machen“ ist für יַצְדִּיק semantisch zu transformativ.
    rationale: Der Hifil bezeichnet hier am ehesten das Gerechtsprechen bzw. Für-gerecht-Erklären. „Viele gerecht sprechen“ ist im Deutschen präziser und wahrt den rechtlichen Sinn.
  - severity: low
    issue: Das hervorgehobene Personalpronomen הוּא bleibt unmarkiert.
    rationale: „Er selbst“ gibt die hebräische Betonung angemessen wieder.
