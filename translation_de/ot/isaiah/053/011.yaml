source:
  edition: WLC
  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: de
  text: Aus der Mühsal seiner Seele heraus wird er sehen und satt werden.[b] Durch seine Erkenntnis[a] wird mein gerechter Knecht viele gerecht sprechen, und er selbst wird ihre Schuld tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Erkenntnis seiner Person“; dann geht es darum, dass andere den Knecht erkennen, nicht um seine eigene Erkenntnis.'
    reason: alternative_reading
  - marker: b
    text: 'Einige alte Textzeugen lesen: „wird er Licht sehen und satt werden“. Der masoretische Text lautet lediglich: „wird er sehen und satt werden“.'
    reason: textual_variant
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: Nach der Mühsal seiner Seele
  rationale: עָמָל bezeichnet Mühsal, Plage oder leidvolle Anstrengung. „Mühsal“ bewahrt die konkrete und leidvolle Färbung; נֶפֶשׁ wird im würdevollen hebräischen Idiom mit „Seele“ wiedergegeben. Die Präposition מִן kann hier den Ausgangspunkt bzw. die Folge anzeigen, daher natürlich „Nach“.
- source_word: יִרְאֶה יִשְׂבָּע
  choice: wird er sehen und satt werden
  rationale: Der masoretische Text nennt kein Objekt zu „sehen“. שׂבע bedeutet wörtlich „satt werden“ und drückt hier erfüllte Genugtuung aus, ohne das Bild aufzulösen.
- source_word: בְּדַעְתּוֹ
  choice: Durch seine Erkenntnis
  rationale: Die Form lässt sich am unmittelbarsten instrumental und auf den Knecht bezogen verstehen. Die ebenfalls mögliche Deutung „durch die Erkenntnis seiner Person“ wird in einer Fußnote bewahrt.
- source_word: יַצְדִּיק
  choice: gerecht machen
  rationale: Der Hifil von צדק kann „für gerecht erklären“, „als gerecht erweisen“ oder „gerecht machen“ bedeuten. „Gerecht machen“ wahrt diese semantische und theologische Spannung besser als eine ausschließlich forensische Festlegung.
- source_word: צַדִּיק עַבְדִּי
  choice: mein gerechter Knecht
  rationale: צַדִּיק wird natürlich attributiv zu עַבְדִּי gefasst.
- source_word: לָרַבִּים
  choice: die Vielen
  rationale: Die Präposition ל markiert die vom Rechtfertigen Betroffenen; „die Vielen“ bewahrt den bestimmten, korporativen Klang der hebräischen Wendung, ohne sie zu „alle“ auszuweiten.
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  choice: und ihre Vergehen wird er tragen
  rationale: עָוֹן umfasst Vergehen, Schuld und deren Folgen; „Vergehen“ ist hier verständlich und moralisch gewichtig. Das vorangestellte Objekt und das selbstständige הוּא werden durch die markierte deutsche Wortstellung hervorgehoben; סבל wird als „tragen“ wiedergegeben.
theological_decisions:
- issue: Deutung von בְּדַעְתּוֹ
  choice: „Durch seine Erkenntnis“, bezogen auf die Erkenntnis des Knechtes
  alternative: „Durch die Erkenntnis seiner Person“, bezogen auf die Erkenntnis, die andere von ihm haben
  rationale: Die subjektiv-instrumentale Deutung liegt grammatisch nahe, doch die objektive Deutung bleibt möglich und wird daher ausdrücklich angemerkt.
- issue: Bedeutung von יַצְדִּיק
  choice: „gerecht machen“
  alternative: „für gerecht erklären“ oder „als gerecht erweisen“
  rationale: Der hebräische Kausativ legt die genaue Art des Gerechtmachens nicht eindeutig fest. Die Hauptfassung vermeidet eine unnötige Beschränkung auf nur einen theologischen Mechanismus.
- issue: Textform nach יִרְאֶה
  choice: 'Masoretischer Text ohne ausdrückliches Objekt: „er wird sehen“'
  alternative: „er wird Licht sehen“ nach einigen alten Textzeugen
  rationale: Die vorgelegte WLC-Lesart enthält „Licht“ nicht. Die bedeutende alte Variante wird jedoch in einer Fußnote dokumentiert.
- issue: Umfang von לָרַבִּים
  choice: „die Vielen“
  alternative: „viele“
  rationale: Die Übersetzung wahrt die hebräische Bezeichnung, ohne sie aus theologischen Gründen zu „alle“ zu erweitern.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit maßvoll bewahrtem hebräischem Bildgehalt. „Satt werden“ ist bewusst konkreter als „zufrieden sein“. Die Fußnotenmarker stehen jeweils an der inhaltlich passenden Stelle: [a] nach „Erkenntnis“ und [b] nach der Aussage über das Sehen wären sachlich ideal; im eingereichten Haupttext sind sie aus Gründen der Leseführung an Satzenden gesetzt.'
