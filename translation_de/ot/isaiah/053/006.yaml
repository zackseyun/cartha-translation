  text: כֻּלָּ֨/נוּ֙ כַּ/צֹּ֣אן תָּעִ֔ינוּ אִ֥ישׁ לְ/דַרְכּ֖/וֹ פָּנִ֑ינוּ וַֽ/יהוָה֙ הִפְגִּ֣יעַ בּ֔/וֹ אֵ֖ת עֲוֺ֥ן כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: de
  text: Wir alle gingen wie Schafe in die Irre; jeder wandte sich seinem eigenen Weg zu, und Jahwe ließ unser aller Schuld ihn treffen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schuld“ kann hier auch „Vergehen“ oder die mit der Schuld verbundene Schuldfolge beziehungsweise Strafe bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe ließ unser aller Schuld auf ihn treffen“ beziehungsweise „auf ihm zusammentreffen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: Wir alle / unser aller
  rationale: Bewahrt die betonte Gesamtheit am Anfang und ihre Wiederaufnahme am Schluss.
- source_word: כַּצֹּאן
  choice: wie Schafe
  rationale: Gibt den hebräischen Vergleich natürlich wieder und erhält das Bild des Umherirrens.
- source_word: תָּעִינוּ
  choice: gingen … in die Irre
  rationale: Passt sowohl zum Schafbild als auch zur moralischen Bedeutung des Verbs.
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: jeder wandte sich seinem eigenen Weg zu
  rationale: „Jeder“ gibt die distributive Kraft des maskulinen Singulars im Deutschen umfassend und idiomatisch wieder; „seinem eigenen Weg“ bewahrt das Bild und die individuelle Ausrichtung.
- source_word: וַיהוָה
  choice: Doch Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „doch“ markiert den inhaltlichen Umschlag von menschlichem Abirren zu Jahwes Handeln, ohne einen neuen Gegensatz zu behaupten.
- source_word: הִפְגִּיעַ בּוֹ
  choice: ließ … ihn treffen
  rationale: 'Bewahrt genauer als „legte auf ihn“ die Bildlichkeit des Hifil: Jahwe bewirkt, dass die Schuld auf dem Knecht zusammentrifft beziehungsweise ihn trifft.'
- source_word: עֲוֺן
  choice: Schuld
  rationale: Das Wort kann Vergehen, Schuld und Schuldfolge umfassen. „Schuld“ hält diese Spannung im Deutschen besser offen als eine engere Festlegung auf Sünde oder Strafe.
theological_decisions:
- issue: Das Tragen der Schuld durch den Knecht
  choice: Jahwe ließ die Schuld aller ihn treffen
  alternative: Jahwe legte unser aller Schuld auf ihn / ließ die Strafe für unsere Schuld auf ihn fallen
  rationale: Die Fassung erhält den stellvertretenden Bezug, legt aber nicht über den hebräischen Wortlaut hinaus fest, ob עָוֹן hier vor allem Tat, Schuldzustand oder Schuldfolge bezeichnet.
- issue: Distributiver maskuliner Singular אִישׁ
  choice: jeder
  alternative: jeder Mann / ein jeder
  rationale: Im Zusammenhang mit „wir alle“ bezeichnet אִישׁ distributiv jedes Mitglied der gesamten Gruppe. Das natürliche deutsche „jeder“ bewahrt diese Funktion, ohne den Bezug unnötig auf Männer einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die rahmende Wiederholung „wir alle / unser aller“. Das traditionelle, aber heute noch klare Bild „in die Irre gehen“ bleibt erhalten.
