  terminology: »HERR«, »Schuldopfer«, »Nachkommen«, »lange leben« und »durch seine Hand« sind passend. Die Fußnoten behandeln die wesentlichen lexikalischen und syntaktischen Alternativen. Die Fußnote zur Schuldopfer-Klausel sollte die aktive Deutung als Deutung von »sein Leben« ausdrücklich benennen, nicht nur allgemein von einem schwierigen Subjekt sprechen.
