source:
  edition: WLC
  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: de
  text: Doch der HERR wollte ihn zerschlagen; er machte ihn krank.[a] Wenn sein Leben als Schuldopfer dargebracht wird,[b] wird er Nachkommen sehen und lange leben; und was dem HERRN gefällt, wird durch seine Hand gelingen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch der HERR hatte Gefallen daran, ihn zu zerschlagen; er plagte ihn.« Das erste Verb kann Gefallen, Willen oder Absicht ausdrücken; das zweite kann auch »er plagte ihn« oder »er ließ ihn leiden« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Wenn sein Leben ein Schuldopfer darbringt« oder: »Wenn du sein Leben als Schuldopfer einsetzt.« Der hebräische Satz ist schwierig: Die Verbform kann auf »sein Leben« bezogen werden oder »du« meinen. Das »Schuldopfer« ist das in der Tora vorgeschriebene Opfer bei Schuld beziehungsweise zur Wiedergutmachung.'
    reason: alternative_reading_and_cultural_note
  - marker: c
    text: 'Oder: »und der Wille / das Vorhaben des HERRN wird durch ihn Erfolg haben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Doch der HERR
  rationale: Die Konjunktion kann schlicht »und« heißen, markiert hier im Zusammenhang aber einen starken Gegensatz. »Doch« gibt diesen Diskurswert knapp wieder; das Tetragramm wird nach deutscher Bibelkonvention als »der HERR« wiedergegeben.
- source_word: חָפֵץ דַּכְּאוֹ
  choice: wollte ihn zerschlagen
  rationale: חפץ kann Gefallen, Wunsch oder Willen bezeichnen. »Wollte« vermeidet im Deutschen das mögliche Missverständnis sadistischer Freude, ohne die direkte göttliche Willensbestimmung abzuschwächen. דכא bezeichnet ein schweres Zerschlagen, nicht nur ein leichtes Verwunden.
- source_word: הֶחֱלִי
  choice: er machte ihn krank
  rationale: Die Hifil-Form von חלה bezeichnet das Verursachen von Krankheit beziehungsweise Leiden. Die konkrete Wiedergabe bleibt näher am Hebräischen als das allgemeinere »betrübte ihn«.
- source_word: אִם תָּשִׂים אָשָׁם נַפְשׁוֹ
  choice: Wenn sein Leben ein Schuldopfer darbringt
  rationale: אִם wird regulär konditional als »wenn« verstanden. תשים ist formal 3. Person Femininum Singular und kann daher auf נפשו, »sein Leben«, bezogen werden. Da Syntax und Subjektbestimmung schwierig bleiben, werden passive und zweitpersonige Deutungen in der Fußnote bewahrt.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Der Ausdruck ist ein kultischer Fachbegriff der Tora für das Opfer bei Schuld beziehungsweise zur Wiedergutmachung; »Schuldopfer« ist die etablierte, knappe deutsche Entsprechung.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפש bezeichnet hier die hingegebene Lebenskraft beziehungsweise Person, nicht ausschließlich eine immaterielle Seele.
- source_word: יִרְאֶה זֶרַע
  choice: wird er Nachkommen sehen
  rationale: זרע kann »Same«, »Nachkommenschaft« oder »Nachkommen« bedeuten. »Nachkommen« ist natürlich und lässt offen, wie genau die Beziehung zu verstehen ist.
- source_word: יַאֲרִיךְ יָמִים
  choice: lange leben
  rationale: Die wörtliche Wendung »Tage verlängern« ist ein hebräisches Idiom für langes Leben. Die natürliche deutsche Wiedergabe vermittelt denselben Sinn.
- source_word: וְחֵפֶץ יְהוָה
  choice: und was dem HERRN gefällt
  rationale: חֵפֶץ umfasst Gefallen, Willen und Vorhaben. Die Formulierung »was dem HERRN gefällt« wahrt die lexikalische Verbindung zu חָפֵץ am Versanfang und klingt im Deutschen natürlicher als »das Gefallen des HERRN«.
- source_word: בְּיָדוֹ יִצְלָח
  choice: wird durch seine Hand gelingen
  rationale: בידו bezeichnet wörtlich »in/durch seine Hand« und damit seine wirksame Vermittlung. »Durch seine Hand« bewahrt das hebräische Bild, während »gelingen« die Erfolgsbedeutung von צלח wiedergibt.
theological_decisions:
- issue: Göttliches Handeln beim Leiden des Knechtes
  choice: Der HERR wollte ihn zerschlagen und machte ihn krank.
  alternative: Der HERR ließ zu, dass er zerschlagen beziehungsweise krank wurde.
  rationale: Die hebräischen Verben schreiben dem HERRN unmittelbare Willensbestimmung und Verursachung zu. Eine bloße Zulassung würde die Aussage theologisch mildern. Zugleich gibt »wollte« den Bedeutungsbereich von חפץ wieder, ohne zwingend Freude am Leiden auszudrücken.
- issue: Subjekt und Aussageweise der Schuldopfer-Klausel
  choice: Wenn sein Leben ein Schuldopfer darbringt
  alternative: 'Wenn sein Leben zum Schuldopfer gemacht wird; oder: Wenn du sein Leben als Schuldopfer einsetzt.'
  rationale: Die masoretische Form תשים ist formal feminin Singular und lässt sich auf נפשו beziehen; die ungewöhnliche Syntax erlaubt jedoch mehrere seit Langem vertretene Analysen. Die Hauptfassung folgt einer formnahen aktiven Lesart, während die echte Ungewissheit in der Fußnote ausdrücklich erhalten bleibt.
- issue: Nachkommen und langes Leben nach dem Leiden
  choice: Die Aussagen werden ohne harmonisierende Erklärung nebeneinandergestellt.
  alternative: Eine ausdrücklich biologische, korporative oder eschatologische Deutung.
  rationale: Der Vers erklärt nicht, in welchem Sinn der Knecht Nachkommen sieht und lange lebt. Die Übersetzung soll diese Spannung nicht durch eine konfessionell geprägte Auslegung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung ist gut vorlesbar und bleibt eng an der hebräischen Bildwelt. Kultische Fachsprache wird mit »Schuldopfer« bewahrt; schwer verständliche syntaktische Alternativen stehen in den Fußnoten. Alle Fußnotenmarker erscheinen an der jeweils einschlägigen Stelle im Haupttext.
