  source_fidelity: 'Die erste Satzhälfte gibt die direkte göttliche Willensbestimmung und Verursachung angemessen wieder. Die Schuldopfer-Klausel ist im Hebräischen syntaktisch und hinsichtlich des Subjekts von תָּשִׂים mehrdeutig (die Form kann insbesondere als 3. Femininum Singular oder als 2. Maskulinum Singular gelesen werden). Die vorliegende aktive deutsche Formulierung legt jedoch eine semantisch missverständliche Konstruktion nahe: Ein »Leben« bringt nicht eigentlich ein Opfer dar, sondern ist bzw. wird das Opfer. Eine idiomatische passive Hauptfassung wahrt den Sinn, während die Alternativen in der Fußnote erhalten bleiben.'
