base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: de
  text: Denn er wuchs vor ihm[b] auf wie ein junger Trieb[a] und wie eine Wurzel aus dürrem Boden. Er hatte keine Gestalt und keine Pracht, die uns dazu bewegt hätte, ihn anzusehen,[c] und kein Aussehen, das uns dazu bewegt hätte, ihn zu begehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein zarter Spross“. Das hebräische Wort יוֹנֵק kann in diesem Pflanzenbild einen jungen, zarten Spross bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor ihm“. Gemeint sein kann der HERR; der Bezug wird an dieser Stelle jedoch nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher lässt sich die Folge auch wiedergeben: „Und wir sahen ihn; doch da war kein Aussehen, sodass wir ihn begehrt hätten.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: wuchs auf
  rationale: עלה bedeutet wörtlich „hinaufgehen/aufkommen“; im Pflanzenbild bezeichnet es natürlich das Aufwachsen oder Emporsprossen.
- source_word: כַּיּוֹנֵק
  choice: wie ein junger Trieb
  rationale: יוֹנֵק kann einen Säugling oder, wie hier im botanischen Parallelismus, einen jungen, zarten Spross bezeichnen. „Junger Trieb“ ist im heutigen Deutsch konkret und natürlich.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die Form enthält ein maskulines Singularsuffix. Die wörtliche Wiedergabe bewahrt den im Vers nicht ausdrücklich genannten Bezug.
- source_word: וְכַשֹּׁרֶשׁ
  choice: und wie eine Wurzel
  rationale: שֹׁרֶשׁ ist das gewöhnliche Wort für „Wurzel“; das konkrete Pflanzenbild bleibt erhalten.
- source_word: מֵאֶרֶץ צִיָּה
  choice: aus dürrem Boden
  rationale: Im landwirtschaftlichen Bild ist „Boden“ für אֶרֶץ passend; צִיָּה bezeichnet trockene, ausgedörrte Beschaffenheit.
- source_word: לֹא תֹאַר לוֹ
  choice: Er hatte keine Gestalt
  rationale: תֹאַר bezeichnet Gestalt, Umriss oder äußere Erscheinung. Das im Hebräischen verblose Gefüge wird im Deutschen idiomatisch mit „hatte“ wiedergegeben.
- source_word: וְלֹא הָדָר
  choice: und keine Pracht
  rationale: הָדָר kann Majestät, Glanz oder Pracht bedeuten. Hier bezeichnet es sichtbare Eindruckskraft; „Pracht“ vermeidet eine unnötige Festlegung auf königliche Würde.
- source_word: וְנִרְאֵהוּ
  choice: die unseren Blick angezogen hätten
  rationale: Die konsonantische Form kann formal als „und wir sahen ihn“ verstanden werden. Im Satzzusammenhang lässt sie sich auch auf ein Aussehen beziehen, das zum Anschauen bewegt. Die Hauptfassung gibt diesen Sinn in natürlichem Deutsch wieder; die formalere Lesart steht in der Fußnote.
- source_word: וְלֹא מַרְאֶה
  choice: und kein Aussehen
  rationale: מַרְאֶה bezeichnet das sichtbare Aussehen oder die Erscheinung. „Aussehen“ wahrt den visuellen Schwerpunkt, ohne den Begriff auf Schönheit zu verengen.
- source_word: וְנֶחְמְדֵהוּ
  choice: das unser Verlangen geweckt hätte
  rationale: חמד bezeichnet Begehren, Verlangen oder Gefallen an etwas Anziehendem. Die Formulierung ist natürliches Deutsch und bewahrt die Aussage fehlender äußerer Anziehungskraft.
theological_decisions:
- issue: Bezug von לְפָנָיו („vor ihm“)
  choice: Der Haupttext belässt „vor ihm“, ohne den Bezug ausdrücklich zu bestimmen.
  alternative: „vor dem HERRN“
  rationale: Das maskuline Singularsuffix ist eindeutig, doch sein Bezug wird in diesem Vers nicht neu genannt. Die häufige Deutung auf den HERRN ist kontextuell plausibel, soll aber nicht in den Haupttext eingetragen werden.
- issue: Körperliche Unattraktivität oder umfassendere gesellschaftliche Unscheinbarkeit
  choice: 'Die Übersetzung bleibt bei sichtbezogenen Begriffen: „Gestalt“, „Pracht“ und „Aussehen“.'
  alternative: Eine ausdrückliche Deutung als fehlende Schönheit, königliche Ausstrahlung oder gesellschaftliches Ansehen.
  rationale: Der hebräische Wortlaut konzentriert sich auf die wahrnehmbare Erscheinung. Weitergehende soziale oder theologische Folgerungen werden nicht in den Vers hineingetragen.
- issue: Syntax von וְנִרְאֵהוּ
  choice: Im Haupttext wird die Form als Teil der Aussage über fehlende sichtbare Anziehungskraft wiedergegeben.
  alternative: „Und wir sahen ihn; doch da war kein Aussehen, dass wir ihn begehrt hätten.“
  rationale: Die geglättete Hauptfassung ist im Deutschen verständlich und entspricht dem Zusammenhang; die Fußnote bewahrt die formal mögliche, parataktische Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Pflanzenbild bleibt konkret; „dürr“ bewahrt den poetischen Klang ohne altertümlich zu wirken. Die zweite Vershälfte wird für natürliches Deutsch behutsam geglättet, während die formnähere Syntax in einer Fußnote dokumentiert ist.
