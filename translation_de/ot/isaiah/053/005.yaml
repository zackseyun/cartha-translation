base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: de
  text: Doch er wurde wegen unserer Vergehen durchbohrt[a], wegen unserer Verfehlungen zerschlagen. Die Strafe, die uns Frieden bringt, lag auf ihm[b], und durch seine Wunde sind wir geheilt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verwundet“. Das hebräische Wort kann ein Verwundet- oder Durchbohrtsein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Die Strafe unseres Friedens lag auf ihm.“ „Frieden“ kann hier auch Wohlergehen oder Ganzsein einschließen.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort für „Wunde“ steht in der Einzahl; möglich ist auch „Strieme“ oder „Quetschwunde“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Doch er
  rationale: 'Das einleitende וְ hat im Zusammenhang einen gegensätzlichen Sinn: Entgegen der zuvor beschriebenen Einschätzung litt der Knecht wegen der Schuld anderer.'
- source_word: מְחֹלָל
  choice: durchbohrt
  rationale: Im Zusammenhang körperlichen Leidens bezeichnet das passive Partizip am ehesten ein Durchbohrt- oder Verwundetsein. „Durchbohrt“ bewahrt die konkrete Gewaltsamkeit des Bildes; die weitere mögliche Wiedergabe steht in der Fußnote.
- source_word: מִפְּשָׁעֵינוּ
  choice: wegen unserer Vergehen
  rationale: מִן bezeichnet hier den ursächlichen Grund. „Vergehen“ gibt den bewussten Normbruch von פֶּשַׁע verständlich wieder, ohne ihn mit dem folgenden Schuldbegriff gleichzusetzen.
- source_word: מְדֻכָּא
  choice: zerschlagen
  rationale: Das Wort drückt schwere, vernichtende Bedrängnis aus. „Zerschlagen“ erhält die Stärke des hebräischen Ausdrucks und passt zum poetischen Parallelismus.
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: wegen unserer Verfehlungen
  rationale: Die Präposition wird erneut kausal verstanden. „Verfehlungen“ bewahrt den moralischen Schuldgehalt von עָוֹן und bleibt zugleich von „Vergehen“ unterschieden.
- source_word: מוּסַר
  choice: Strafe
  rationale: מוּסָר kann Zucht, Zurechtweisung oder Strafe bedeuten. Im Zusammenhang des stellvertretenden Leidens ist „Strafe“ natürlich und prägnant, ohne eine weiter ausgearbeitete Sühnetheorie in den Vers einzutragen.
- source_word: שְׁלוֹמֵנוּ
  choice: die uns Frieden bringt
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Ganzsein. Die relationale Formulierung macht den Sinn des kompakten hebräischen Ausdrucks in natürlichem Deutsch deutlich; seine größere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: עָלָיו
  choice: lag auf ihm
  rationale: Die Wendung bewahrt das hebräische Bild einer auf dem Knecht liegenden Last oder Strafe und klingt im Deutschen natürlich.
- source_word: וּבַחֲבֻרָתוֹ
  choice: durch seine Wunde
  rationale: Das Substantiv steht im Singular und bezeichnet die ihm zugefügte Verletzung. „Wunde“ ist gegenwärtiges, verständliches Deutsch und wahrt den Singular.
- source_word: נִרְפָּא לָנוּ
  choice: sind wir geheilt
  rationale: Obwohl die hebräische Form formal in der dritten Person Singular steht, ergibt die Verbindung mit לָנוּ idiomatisch, dass uns Heilung zuteilwird. Die deutsche Fassung gibt diesen Sinn klar wieder.
theological_decisions:
- issue: Beziehung zwischen dem Leiden des Knechtes und der Schuld der anderen
  choice: Die kausale und stellvertretende Beziehung wird mit „wegen unserer …“ und der auf ihm liegenden Strafe ausgedrückt.
  alternative: Das Leiden nur als Beispiel zu verstehen oder ausdrücklich eine umfassende spätere Straftheorie zu formulieren.
  rationale: Der hebräische Text verbindet das Leiden des Knechtes deutlich mit den Sünden der Gemeinschaft sowie mit ihrem Frieden und ihrer Heilung. Die Übersetzung wahrt diese Beziehung, ohne sie über den Wortlaut hinaus systematisch festzulegen.
- issue: Bedeutungsumfang von Frieden und Heilung
  choice: „Frieden“ und „geheilt“ bleiben umfassende Bilder der Wiederherstellung.
  alternative: Die Aussagen ausschließlich auf körperliche Heilung, ausschließlich auf Sündenvergebung oder auf materiellen Wohlstand zu beschränken.
  rationale: שָׁלוֹם und רפא haben im Kontext eine breite, ganzheitliche Bedeutung. Eine engere Festlegung würde eine echte semantische und theologische Offenheit des Verses beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. Die Formulierungen sind für gewöhnliche Leser verständlich, bewahren jedoch die Bildsprache, den Singular von „Wunde“ und die semantische Breite von Frieden und Heilung.
