source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: de
  text: 'Durch Bedrückung und Gericht wurde er weggenommen. Und was seine Generation[b] betrifft: Wer bedachte[a], dass er aus dem Land der Lebenden abgeschnitten wurde und ihn wegen des Vergehens meines Volkes ein Schlag traf?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer sprach davon“, „wer berichtete darüber“ oder „wer erwog“; das hebräische Verb ist selten und schwer zu bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Generation“ kann seine Zeitgenossen, seine Nachkommen oder weiter gefasst sein Lebensgeschick beziehungsweise seine Lebenszeit meinen.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Der Schlag traf ihn“ beziehungsweise „lag auf ihm“. Das hebräische לָמוֹ ist der Form nach Mehrzahl, kann hier aber poetisch für eine einzelne Person stehen; manche verstehen es als „auf ihnen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: Durch Bedrückung
  rationale: עֹצֶר kann Zwang, Haft oder bedrückende Einschränkung bezeichnen. Im Zusammenhang gibt „Bedrückung“ die gewaltsame, ungerechte Behandlung wieder; „durch“ wahrt den möglichen instrumentalen Sinn der Präposition.
- source_word: וּמִמִּשְׁפָּט
  choice: und Gericht
  rationale: מִשְׁפָּט bezeichnet Gericht, Recht oder ein gerichtliches Verfahren. „Gericht“ bewahrt den rechtlichen Bezug, ohne vorwegzunehmen, ob ein gerechtes Urteil oder ein ungerechtes Verfahren gemeint ist.
- source_word: לֻקָּח
  choice: wurde er weggenommen
  rationale: Die Passivform von לקח bezeichnet hier ein Fortnehmen oder Beseitigen. „Weggenommen“ bleibt nah am Bild und passt zur folgenden Aussage über seinen Ausschluss aus dem Land der Lebenden.
- source_word: וְאֶת־דּוֹרוֹ
  choice: Und was seine Generation betrifft
  rationale: Die vorangestellte, mit אֶת markierte Wortgruppe ist syntaktisch schwierig. Die Wiedergabe als Thema erhält die hervorgehobene Stellung und lässt „Generation“ bewusst offen.
- source_word: מִי יְשׂוֹחֵחַ
  choice: Wer bedachte
  rationale: Das seltene Verb שׂוח kann hier ein Nachdenken oder Erwägen ausdrücken. Da auch Sprechen oder Verkünden möglich ist, werden diese Bedeutungen in einer Fußnote genannt.
- source_word: כִּי
  choice: dass
  rationale: כִּי wird als Einleitung des Inhalts verstanden, den niemand bedachte. „Dass“ ergibt im Deutschen einen klaren Anschluss an die rhetorische Frage, ohne die möglichen kausalen Nuancen des Gesamtzusammenhangs dogmatisch auszubauen.
- source_word: נִגְזַר
  choice: abgeschnitten wurde
  rationale: Das Nifal von גזר bedeutet „abgeschnitten“ oder „abgetrennt werden“. Die Formulierung erhält das konkrete Bild und bezeichnet im Kontext die Entfernung aus dem Leben.
- source_word: מֵאֶרֶץ חַיִּים
  choice: aus dem Land der Lebenden
  rationale: Die feste Bildrede bezeichnet den Bereich der Lebenden, also das irdische Leben. Die wörtlich nahe Form ist auch im modernen Deutschen verständlich und würdevoll.
- source_word: מִפֶּשַׁע עַמִּי
  choice: wegen des Vergehens meines Volkes
  rationale: פֶּשַׁע bezeichnet ein schuldhaftes Vergehen beziehungsweise eine Auflehnung. „Wegen“ gibt den kausalen Sinn von מִן wieder, während „Vergehen“ verständlich bleibt und die Schuldrelation wahrt.
- source_word: נֶגַע לָמוֹ
  choice: getroffen
  rationale: נֶגַע ist ein Schlag, eine Plage oder Heimsuchung. Die partizipiale Wiedergabe „getroffen“ macht den stark verdichteten hebräischen Schluss im Deutschen lesbar; die unsichere Beziehung und Zahl von לָמוֹ wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bezug und Numerus von לָמוֹ im Schlusssatz
  choice: 'Im Haupttext auf den einzelnen Knecht bezogen: „getroffen wegen des Vergehens meines Volkes“'
  alternative: „der Schlag traf ihn“ beziehungsweise „der Schlag traf sie/lag auf ihnen“
  rationale: לָמוֹ ist der Form nach pluralisch, kann in poetischer Sprache jedoch singularisch gebraucht werden. Der unmittelbare Zusammenhang spricht fortlaufend von einer einzelnen Gestalt; die formale Mehrdeutigkeit wird deshalb nicht verschwiegen, sondern in der Fußnote bewahrt.
- issue: Bedeutungsumfang von דּוֹר
  choice: Das breite Wort „Generation“ bleibt im Haupttext stehen
  alternative: „seine Zeitgenossen“, „seine Nachkommen“ oder sein Lebensgeschick beziehungsweise seine Lebenszeit
  rationale: Der hebräische Ausdruck lässt mehrere Deutungen zu. Eine engere Festlegung würde eine strittige Auslegung in den Haupttext eintragen; „Generation“ erhält die Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die verdichtete Syntax des Hebräischen wird nur so weit geglättet, wie es für gewöhnliche Leserinnen und Leser nötig ist; die Unsicherheiten bei דּוֹר, שׂוח und לָמוֹ bleiben durch die Fußnoten sichtbar.
