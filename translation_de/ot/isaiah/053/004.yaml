source:
  edition: WLC
  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: de
  text: Gewiss, er trug unsere Krankheiten und lud unsere Schmerzen auf sich[a]. Wir aber hielten ihn für getroffen, von Gott geschlagen[b] und geplagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Kummer“ und „unsere Leiden“. Das Hebräische bezeichnet konkreter Krankheiten und Schmerzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „von Gott heimgesucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Doch
  rationale: Im Zusammenhang korrigiert das Wort nachdrücklich die zuvor geschilderte Wahrnehmung; „Doch“ gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: חֳלָיֵנוּ
  choice: unsere Krankheiten
  rationale: Das Substantiv bezeichnet primär Krankheiten oder Leiden und sollte nicht vorschnell auf seelischen Kummer eingeengt werden.
- source_word: נָשָׂא
  choice: trug
  rationale: Das Verb bezeichnet das Aufnehmen und Tragen einer Last; „trug“ bewahrt das konkrete Bild.
- source_word: וּמַכְאֹבֵינוּ
  choice: unsere Schmerzen
  rationale: Das Substantiv bezeichnet Schmerzen, häufig körperlicher Art; „Schmerzen“ ist die direkte moderne Entsprechung.
- source_word: סְבָלָם
  choice: lud … auf sich
  rationale: Das Verb betont das Tragen einer Last. Die Wendung ist im Deutschen natürlich und unterscheidet es vom vorangehenden נָשָׂא.
- source_word: וַאֲנַחְנוּ חֲשַׁבְנֻהוּ
  choice: Wir aber hielten ihn für einen
  rationale: Pronomen und Konjunktion setzen die menschliche Einschätzung in Gegensatz zur tatsächlichen Bedeutung seines Leidens; חָשַׁב bedeutet hier „halten für, ansehen als“.
- source_word: נָגוּעַ
  choice: getroffen
  rationale: Das passive Partizip kann einen von einem schweren Schlag oder einer Plage Getroffenen bezeichnen, ohne die Art des Leidens eindeutig festzulegen.
- source_word: מֻכֵּה אֱלֹהִים
  choice: von Gott … geschlagen
  rationale: Die Formulierung nennt Gott ausdrücklich als Urheber des Schlagens; „geschlagen“ ist näher am hebräischen Verb als eine verstärkende Wiedergabe wie „niedergeschlagen“.
- source_word: וּמְעֻנֶּה
  choice: gedemütigt
  rationale: Das Partizip kann „gebeugt, gedemütigt, bedrückt“ bedeuten. „Gedemütigt“ erhält eine eigenständige Nuance neben „getroffen“ und „geschlagen“.
theological_decisions:
- issue: Körperlich konkrete oder verallgemeinerte Wiedergabe der vom Knecht getragenen Leiden
  choice: „Krankheiten“ und „Schmerzen“ im Haupttext
  alternative: „Leiden“ und „Schmerzen“ beziehungsweise „Kummer“ und „Sorgen“
  rationale: חֳלִי und מַכְאוֹב bezeichnen zunächst Krankheit und Schmerz. Die konkrete Sprache bleibt erhalten, ohne die weiterreichende Bedeutung des Verses festzulegen.
- issue: Göttliche Urheberschaft in מֻכֵּה אֱלֹהִים
  choice: „von Gott … geschlagen“
  alternative: „gottgeschlagen“ oder „von Gott heimgesucht“
  rationale: Der Text gibt die damalige menschliche Einschätzung wieder und nennt darin Gottes Urheberschaft ausdrücklich. Die Übersetzung darf diese Spannung weder abschwächen noch die Einschätzung als abschließende Deutung ausgeben.
- issue: Bedeutung von מְעֻנֶּה
  choice: „gedemütigt“
  alternative: „geplagt“ oder „bedrückt“
  rationale: Die hebräische Form lässt Affliktion und Erniedrigung anklingen. „Gedemütigt“ wahrt diese Nuance und vermeidet eine bloße Wiederholung der beiden vorausgehenden Leidensbegriffe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Lastenträger-Verben und die dreigliedrige Beschreibung des leidenden Knechts bleiben erkennbar. Die Satzstellung bindet „von Gott“ eindeutig an „geschlagen“.
