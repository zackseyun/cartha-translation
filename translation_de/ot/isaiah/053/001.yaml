id: ISA.53.1
reference: Isaiah 53:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: de
  text: Wer hat unserer Botschaft[a] geglaubt, und wem ist der Arm Jahwes offenbart worden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem, was wir gehört haben; auch: unserer Kunde. Das hebräische Wort kann etwas Gehörtes, eine Nachricht oder eine verkündete Botschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; „Wer“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: הֶאֱמִין
  choice: hat … geglaubt
  rationale: Der Hifil von אמן bedeutet hier „glauben“ oder „Vertrauen schenken“. Das deutsche Perfekt gibt die rückblickende rhetorische Frage natürlich wieder.
- source_word: לִשְׁמֻעָתֵנוּ
  choice: unserer Botschaft[a]
  rationale: שְׁמוּעָה bezeichnet etwas Gehörtes, eine Nachricht, Kunde oder Botschaft. „Unserer Botschaft geglaubt“ ist im Deutschen idiomatisch, ohne die lexikalische Spannweite in der Fußnote zu verschweigen.
- source_word: וּזְרוֹעַ
  choice: und … der Arm
  rationale: Das konkrete Bild „Arm“ bleibt erhalten, statt es deutend durch „Macht“ oder „Kraft“ zu ersetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: עַל מִי
  choice: wem
  rationale: In Verbindung mit dem Passiv von גלה bezeichnet עַל מִי idiomatisch den Empfänger der Offenbarung; „wem“ ist im Deutschen natürlicher als „über wem“.
- source_word: נִגְלָתָה
  choice: ist … offenbart worden
  rationale: Der Nifal von גלה ist passiv und bedeutet „offenbart/enthüllt werden“. Die Formulierung wahrt das Passiv und entspricht dem deutschen Sprachgebrauch.
theological_decisions:
- issue: Metaphorik des „Armes Jahwes“
  choice: Das Bild „der Arm Jahwes“ bleibt im Haupttext erhalten.
  alternative: die Macht Jahwes
  rationale: Der Arm ist ein bedeutsames prophetisches Bild für Jahwes wirksame, besonders rettende Macht. Eine Auflösung in „Macht“ würde die Bildsprache und ihre biblischen Bezüge verengen.
- issue: Bedeutung von שְׁמוּעָה
  choice: „unserer Botschaft“ im Haupttext, mit offenen Alternativen in der Fußnote
  alternative: „dem, was wir gehört haben“ oder „unserer Kunde“
  rationale: Das Substantiv kann sowohl das Gehörte als auch die weitergegebene Nachricht bezeichnen. Der Zusammenhang legt eine verkündete Botschaft nahe, entscheidet die lexikalische Mehrdeutigkeit aber nicht vollständig; deshalb wird sie in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Parallelfrage und das konkrete Bild vom Arm bleiben erhalten; die Mehrdeutigkeit von שְׁמוּעָה wird nicht stillschweigend aufgelöst.
