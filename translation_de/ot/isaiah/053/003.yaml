source:
  edition: WLC
  text: נִבְזֶה֙ וַ/חֲדַ֣ל אִישִׁ֔ים אִ֥ישׁ מַכְאֹב֖וֹת וִ/יד֣וּעַ חֹ֑לִי וּ/כְ/מַסְתֵּ֤ר פָּנִים֙ מִמֶּ֔/נּוּ נִבְזֶ֖ה וְ/לֹ֥א חֲשַׁבְנֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: de
  text: Verachtet war er und von Menschen verlassen[a], ein Mann voller Schmerzen[b] und mit Krankheit vertraut[c]. Wie einer, vor dem man das Gesicht verbirgt[d], so war er verachtet, und wir schätzten ihn nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Menschen gemieden“ oder „von Menschen abgelehnt“. Die hebräische Wendung ist schwierig und kann soziale Verlassenheit oder Ausgrenzung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein Mann der Schmerzen“; auch „ein Mann des Leidens“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „mit Krankheit bekannt“. Traditionell wird teils „mit Leiden vertraut“ übersetzt.'
    reason: lexical_alternative
  - marker: d
    text: 'Das Hebräische ist verkürzt formuliert: etwa „wie ein Verbergen des Gesichts vor ihm“. Gemeint ist wohl, dass Menschen ihr Gesicht von ihm abwandten.'
    reason: cultural_note
lexical_decisions:
- source_word: נִבְזֶה
  choice: verachtet
  rationale: Das Nifal-Partizip von בזה bezeichnet jemanden, der verachtet oder geringschätzig behandelt wird. „Verachtet“ ist knapp, natürlich und wahrt den passiv-resultativen Sinn.
- source_word: חֲדַל אִישִׁים
  choice: von Menschen verlassen
  rationale: Die schwierige Wendung beschreibt grundlegend ein Fehlen beziehungsweise Verlassensein im Verhältnis zu Menschen. „Von Menschen verlassen“ bewahrt den Gedanken sozialer Vereinsamung, ohne die umstrittene Formulierung zu stark festzulegen.
- source_word: אִישׁ מַכְאֹבוֹת
  choice: ein Mann voller Schmerzen
  rationale: מַכְאֹבוֹת kann körperliche wie seelische Schmerzen bezeichnen. „Voller Schmerzen“ klingt im modernen Deutschen natürlicher als „ein Mann der Schmerzen“ und hält beide Dimensionen offen.
- source_word: וִידוּעַ חֹלִי
  choice: mit Krankheit vertraut
  rationale: Die Verbindung bezeichnet jemanden, dem Krankheit aus Erfahrung bekannt ist. Die konkrete Wiedergabe bleibt näher am hebräischen חֹלִי als das traditionellere „Leid“ oder „Kummer“.
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: Wie vor einem, vor dem man das Gesicht verbirgt
  rationale: 'Die hebräische Formulierung ist elliptisch. Die Wiedergabe ergänzt nur das im Deutschen notwendige unpersönliche Subjekt und wahrt die Richtung von מִן: Das Gesicht wird vor ihm verborgen.'
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: wir achteten ihn für nichts
  rationale: חשב bedeutet hier „einschätzen, ansehen, für etwas halten“. „Für nichts achten“ bringt die negative Wertung stärker und idiomatischer zum Ausdruck als ein bloßes „nicht achten“.
theological_decisions:
- issue: Messianische beziehungsweise knechtbezogene Auslegung
  choice: Das Bild wird ohne ausdrückliche christologische Ergänzungen in seinen eigenen literarischen Begriffen wiedergegeben.
  alternative: Den Vers durch ausdrücklich christologische Bezeichnungen erweitern.
  rationale: Die Übersetzung fügt dem Hebräischen keine Identifizierung hinzu, lässt aber seine kanonische und messianische Auslegung offen.
- issue: Wiedergabe der Leidensbegriffe
  choice: Konkrete Begriffe wie „Schmerzen“ und „Krankheit“ werden verwendet.
  alternative: Traditionell-abstraktere Begriffe wie „Schmerzen und Leiden“ oder „Kummer und Leid“ verwenden.
  rationale: Die hebräischen Wörter bezeichnen konkret Schmerz und Krankheit, ohne das Leiden ausschließlich auf eine körperliche oder seelische Dimension zu begrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem poetischen Parallelismus des Hebräischen, wird jedoch für heutige Leser leicht geglättet. Die Wiederholung von „verachtet“ bleibt als bewusstes Stilmerkmal erhalten.
