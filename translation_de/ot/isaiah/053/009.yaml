  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: de
  text: Und man bestimmte sein Grab bei den Frevlern[a] und bei einem Reichen in seinen Toden[b], obwohl er keine Gewalttat verübt hatte und kein Trug in seinem Mund war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Grab wurde bei den Frevlern bestimmt.“ Das hebräische Verb bedeutet wörtlich „gab/legte fest“; ein ausdrückliches Subjekt wird nicht genannt.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Hebräischen die Mehrzahl „in seinen Toden“; oft wird sie sinngemäß mit „bei seinem Tod“ oder „in seinem Tod“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Und man bestimmte
  rationale: נתן bedeutet wörtlich „geben, setzen, hinstellen“. Im Zusammenhang mit dem Grab gibt „bestimmen“ die Zuweisung eines Begräbnisplatzes wieder. Das unpersönliche „man“ vermeidet es, dem syntaktisch schwierigen Verb einen ausdrücklich benannten Handelnden zuzuweisen.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Pluralwort bezeichnet schuldhaft böse oder gottlose Menschen. „Frevler“ bewahrt die moralische Kategorie knapp und würdevoll, ohne nur allgemeine Kriminalität auszudrücken.
- source_word: קִבְרוֹ
  choice: sein Grab
  rationale: קבר bezeichnet ein Grab oder eine Begräbnisstätte. „Sein Grab“ ist die direkte und im Deutschen natürliche Entsprechung.
- source_word: עָשִׁיר
  choice: ein Reicher
  rationale: Das Wort steht im Singular und bezeichnet hier am natürlichsten eine einzelne wohlhabende Person. Die substantivierte Form „ein Reicher“ erhält diese Einzahl.
- source_word: בְּמֹתָיו
  choice: in seinen Toden
  rationale: Die hebräische Form ist morphologisch Plural („seine Tode“). Die ungewöhnliche Mehrzahl bleibt im Haupttext sichtbar; die im Kontext naheliegende idiomatische Einzahl wird in einer Fußnote genannt.
- source_word: עַל
  choice: obwohl
  rationale: Die Präposition leitet hier den Umstand ein, der im Verhältnis zur entehrenden Grablegung einen Gegensatz bildet. „Obwohl“ gibt diesen konzessiven Zusammenhang im Deutschen klar wieder, ohne die Unschuld des Knechtes als Ursache der Behandlung darzustellen.
- source_word: חָמָס
  choice: Gewalttat
  rationale: חמס bezeichnet Gewalt, gewaltsames Unrecht oder Frevel. „Gewalttat“ passt zur Wendung mit עשה und ist im Deutschen präzise.
- source_word: מִרְמָה
  choice: Betrug
  rationale: Das Substantiv bezeichnet Täuschung, Trug oder Falschheit. „Betrug“ ist gegenwärtig und verständlich und bezeichnet hier irreführende Rede.
- source_word: בְּפִיו
  choice: in seinem Mund war
  rationale: Die Formulierung erhält das hebräische Bild wörtlich, ohne ein nicht ausdrücklich vorhandenes Verb wie „gefunden werden“ hinzuzufügen.
theological_decisions:
- issue: Die ungewöhnliche Mehrzahl בְּמֹתָיו im theologisch bedeutsamen Lied vom Gottesknecht
  choice: Die formale Mehrzahl „in seinen Toden“ bleibt im Haupttext erhalten.
  alternative: „bei seinem Tod“ oder „in seinem Tod“
  rationale: Die morphologische Mehrzahl ist echte Textgestalt und soll nicht stillschweigend harmonisiert werden. Eine Fußnote nennt die verbreitete idiomatische Deutung als Einzahl.
- issue: Der nicht ausdrücklich genannte Bezugsträger von וַיִּתֵּן
  choice: Unpersönliche Wiedergabe mit „man bestimmte“
  alternative: „er bestimmte“ oder passivisch „sein Grab wurde bestimmt“
  rationale: Der hebräische Text nennt kein ausdrückliches Subjekt, obwohl das Verb formal in der 3. Person Singular steht. Die unpersönliche deutsche Fassung benennt weder Gott noch den Knecht oder eine andere Gruppe als Handelnden und hält die Spannung offen.
- issue: Das Verhältnis von עַל לֹא zur vorausgehenden Grablegung
  choice: 'Konzessiv: „obwohl“'
  alternative: 'Kausal: „weil“ oder „wegen“'
  rationale: Im Zusammenhang kontrastiert die Aussage über seine Unschuld mit der ihm zugedachten Grablegung unter Frevlern. „Obwohl“ bildet diesen Sinn natürlich ab; die grundsätzlich mögliche kausale Wiedergabe wird nicht zur theologischen Erklärung ausgebaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der kompakten hebräischen Parallelstruktur. „In seinen Toden“ ist bewusst auffällig, da die ungewöhnliche Form des Ausgangstextes nicht geglättet werden soll; die Fußnote erschließt sie für heutige Leser.
