  source_fidelity: Der Entwurf gibt den hebräischen Erzählfortgang, die Botenanweisung an die Gesandten und den an Hiskia gerichteten Singular zutreffend wieder. „Fürchte dich nicht vor den Worten“ entspricht dem Sinn von אַל־תִּירָא מִפְּנֵי הַדְּבָרִים. Die Relativkonstruktion „die du gehört hast und mit denen …“ bindet die Schmähung sachgerecht an die gehörten Worte. „Diener des Königs von Assyrien“ ist im Kontext eine tragfähige Wiedergabe von נַעֲרֵי מֶלֶךְ אַשּׁוּר.
