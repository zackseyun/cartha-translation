  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֔עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶלֶךְ אַשּׁ֖וּר אוֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: de
  text: 'Und Jesaja sagte zu ihnen: „So sollt ihr zu eurem Herrn sagen: So spricht Jahwe: ‚Fürchte dich nicht vor den Worten, die du gehört hast und mit denen die Diener des Königs von Assyrien mich gelästert haben.[a]‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich verhöhnt“ oder „mich geschmäht“. Das hebräische Verb bezeichnet verächtliche oder beleidigende Rede gegen Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: Und Jesaja sagte zu ihnen
  rationale: Bewahrt den hebräischen Erzählfortgang und gibt Adressat sowie Sprecher direkt wieder.
- source_word: כֹּה תֹאמְרוּן
  choice: So sollt ihr … sagen
  rationale: Gibt die formelhafte Anweisung natürlich und mit verpflichtendem Sinn wieder.
- source_word: אֶל אֲדֹנֵיכֶם
  choice: zu eurem Herrn
  rationale: Bezeichnet hier Hiskia als menschlichen Herrn der Boten; die Kleinschreibung im Possessivzusammenhang unterscheidet ihn vom Gottesnamen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים
  choice: Fürchte dich nicht vor den Worten
  rationale: Natürliches, zugleich würdevolles Deutsch; מִפְּנֵי bezeichnet hier den Anlass beziehungsweise Gegenstand der Furcht.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: die Diener des Königs von Assyrien
  rationale: נַעֲרִים kann junge Männer oder Bedienstete bezeichnen; im politischen Kontext passt die funktionale Bezeichnung „Diener“.
- source_word: גִּדְּפוּ אֹתִי
  choice: mich gelästert haben
  rationale: Erfasst die gegen Gott gerichtete, verächtliche Rede, ohne den Sinn ausschließlich auf einen technischen theologischen Begriff zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ macht diesen im Deutschen sichtbar.
- issue: Bedeutungsumfang von גִּדֵּף gegenüber Gott
  choice: mich gelästert haben
  alternative: mich verhöhnt / geschmäht haben
  rationale: „Gelästert“ wahrt das Gewicht der gegen Gott gerichteten Rede; die Fußnote erhält den breiteren Sinn von Schmähung und Verhöhnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formel „So … sagen / So spricht“ folgt bewusst der Struktur des Hebräischen. Der Singular „Fürchte dich“ richtet sich innerhalb der an mehrere Boten erteilten Anweisung an ihren Herrn Hiskia.
