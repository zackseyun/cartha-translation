base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
translation:
  language: de
  text: Wo sind der König von Hamat, der König von Arpad und der König der Stadt Sefarwajim, Hena und Iwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe hebräische Aufzählung lässt offen, ob Hena und Iwa als weitere Städte zu „der König“ gehören. Daher ist auch möglich: „… und der König der Stadt Sefarwajim, von Hena und von Iwa?“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַיֵּה
  choice: Wo sind
  rationale: Das Fragewort bedeutet „wo?“. Da im Deutschen mehrere Könige als verbundenes Subjekt folgen, wird das im Hebräischen nicht ausgedrückte Verb idiomatisch im Plural ergänzt.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die übliche Entsprechung für מֶלֶךְ; die dreimalige Wiederholung wird wegen ihrer rhetorischen Wirkung beibehalten.
- source_word: חֲמָת
  choice: Hamat
  rationale: Im Deutschen gebräuchliche Umschrift des Ortsnamens.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Gebräuchliche Umschrift des Ortsnamens.
- source_word: לָעִיר
  choice: der Stadt
  rationale: Die Verbindung wird als Zugehörigkeitsangabe zu „König“ verstanden und im Deutschen natürlich mit dem Genitiv wiedergegeben.
- source_word: סְפַרְוָיִם
  choice: Sefarwajim
  rationale: Im Deutschen gebräuchliche, der hebräischen Form entsprechende Umschrift des Ortsnamens.
- source_word: הֵנַע
  choice: Hena
  rationale: Nahe Umschrift des masoretisch überlieferten Ortsnamens.
- source_word: עִוָּה
  choice: Iwa
  rationale: Deutsche Umschrift des masoretisch vokalisierten Ortsnamens.
