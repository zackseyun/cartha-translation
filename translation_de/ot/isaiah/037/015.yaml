  text: 'And Hezekiah prayed to Yahweh[a], saying:'
translation:
  language: de
  text: 'Und Hiskija betete zu Jahwe[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: betete
  rationale: Das Hitpael von פלל bezeichnet hier das Beten. „betete“ gibt die schlichte Erzählung natürlich und präzise wieder.
- source_word: חִזְקִיָּהוּ
  choice: Hiskija
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet den Adressaten des Gebets; „zu Jahwe beten“ ist im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den unmittelbar folgenden Wortlaut des Gebets ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion knapp und eindeutig, ohne ein schwerfälliges „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Namen; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt leitet den folgenden Gebetswortlaut natürlich ein; das eröffnende „Und“ bewahrt den narrativen Anschluss des hebräischen וַ־.
