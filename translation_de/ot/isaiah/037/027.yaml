  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: de
  text: Und ihre Bewohner waren machtlos[a]; sie waren gebrochen[b] und beschämt. Sie waren wie Gras auf dem Feld und wie frisches Grün, wie Gras auf den Dächern und wie ein versengtes Feld, bevor das Getreide steht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kurze Hände habend“; eine hebräische Redewendung für fehlende Kraft oder Handlungsfähigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie waren verzagt“. Das hebräische Verb kann sowohl Gebrochensein als auch innere Bestürzung oder Verzagtheit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Schlusswendung ist schwierig. Wahrscheinlich ist ein Feld oder Pflanzenwuchs gemeint, der verdorrt oder versengt, bevor das Getreide heranwächst; vergleiche die Parallelstelle in 2. Könige 19,26.
    reason: textual_difficulty
lexical_decisions:
- source_word: יֹשְׁבֵיהֶן
  choice: ihre Bewohner
  rationale: Das substantivierte Partizip mit Suffix bezeichnet die Menschen, die in den zuvor genannten Orten wohnen. „Bewohner“ gibt den kollektiven Bezug knapp und natürlich wieder.
- source_word: קִצְרֵי יָד
  choice: machtlos
  rationale: Die Wendung bedeutet wörtlich „kurz an Hand“ und ist ein Idiom für fehlende Kraft oder Handlungsfähigkeit. „Machtlos“ vermittelt diesen Sinn klar; die wörtliche Bildsprache wird in einer Fußnote bewahrt.
- source_word: חַתּוּ
  choice: waren gebrochen
  rationale: Das Verb חתת kann äußeres Zerbrechen wie auch innere Bestürzung oder Verzagtheit ausdrücken. „Gebrochen“ erhält die starke Bildwirkung, ohne die Bedeutung ausschließlich auf Angst festzulegen.
- source_word: וָבֹשׁוּ
  choice: und beschämt
  rationale: בוש bezeichnet Scham, Beschämung oder Schande. „Beschämt“ ist im Deutschen idiomatisch und lässt offen, ob der Zustand innerlich empfunden oder durch die Niederlage herbeigeführt wurde.
- source_word: עֵשֶׂב שָׂדֶה
  choice: Gras auf dem Feld
  rationale: Die einfache Wortverbindung bezeichnet die vergängliche Vegetation des Feldes. Die deutsche Formulierung erhält das konkrete Bild.
- source_word: וִירַק דֶּשֶׁא
  choice: frisches Grün
  rationale: Die Wörter bezeichnen grüne, frisch sprießende Vegetation. „Frisches Grün“ klingt natürlich und vermeidet eine unnötige Wiederholung von „Gras“.
- source_word: חֲצִיר גַּגּוֹת
  choice: Gras auf den Dächern
  rationale: Das Bild meint den flach wurzelnden, rasch verdorrenden Bewuchs auf damaligen Flachdächern. Die direkte Wiedergabe ist klar und bibelsprachlich verständlich.
- source_word: וּשְׁדֵמָה לִפְנֵי קָמָה
  choice: wie ein versengtes Feld, noch bevor das Getreide aufrecht steht
  rationale: Die schwierige Schlusswendung steht in einer Reihe von Bildern für schwache, vergängliche Vegetation. „Versengtes Feld“ folgt der wahrscheinlichen Bedeutung von שדמה; קמה bezeichnet das aufrecht stehende, herangewachsene Getreide. Eine Fußnote weist auf die textliche und lexikalische Unsicherheit hin.
