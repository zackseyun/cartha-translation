  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: de
  text: Wen hast du verhöhnt und gelästert? Gegen wen hast du deine Stimme erhoben und deine Augen hoch erhoben? Gegen den Heiligen Israels!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: verhöhnt
  rationale: Das Verb bezeichnet hier entehrendes Schmähen beziehungsweise Verhöhnen; „verhöhnt“ gibt den feindseligen Spott im Kontext natürlich und prägnant wieder.
- source_word: גִדַּפְתָּ
  choice: gelästert
  rationale: Das Verb meint Lästerung oder Schmähung, besonders gegenüber Gott, und wird daher mit „gelästert“ wiedergegeben.
- source_word: הֲרִימוֹתָה קּוֹל
  choice: deine Stimme erhoben
  rationale: Die hebräische Wendung wird idiomatisch und zugleich formnah wiedergegeben; sie drückt anmaßendes, herausforderndes Reden aus.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: deine Augen hochmütig erhoben
  rationale: Wörtlich steht eine Verbindung aus „die Augen erheben“ und „zur Höhe/hoch“. „hochmütig“ macht die im Kontext erkennbare Überheblichkeit verständlich, ohne das Bild des Augenerhebens aufzugeben.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Der feste Jesaja-Titel wird traditionsnah und klar als „der Heilige Israels“ wiedergegeben.
theological_decisions:
- issue: Bezugspunkt der Schmähung
  choice: Der abschließende Satz nennt den Heiligen Israels ausdrücklich als Ziel des anmaßenden Handelns.
  alternative: Den Schluss syntaktisch enger nur mit dem Erheben der Augen verbinden.
  rationale: Die Folge rhetorischer Fragen gipfelt im hebräischen Text in „gegen den Heiligen Israels“. Die deutsche Zeichensetzung lässt diesen Höhepunkt gelten, ohne die vorausgehenden Handlungen theologisch voneinander zu trennen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Zuspitzung und der anklagende Ton des hebräischen Gotteswortes bleiben erhalten; das abschließende Ausrufezeichen markiert den emphatischen Höhepunkt.
