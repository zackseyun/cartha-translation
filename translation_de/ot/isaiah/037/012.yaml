  variant: modern standard German
source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אוֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִשְׁחִ֣יתוּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: de
  text: 'Haben etwa die Götter der Völker sie gerettet, die meine Vorfahren vernichteten: Gosan, Haran, Rezef und die Söhne Edens[a], die in Telassar waren?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne Edens“; gemeint sind die Menschen oder Bewohner von Eden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Haben etwa … gerettet
  rationale: Das Hifil-Perfekt von נצל steht in einer rhetorischen Frage. Das Perfekt gibt den Rückblick auf vergangene Eroberungen wieder; „etwa“ macht die spöttische Erwartung einer verneinenden Antwort im natürlichen Deutschen hörbar.
- source_word: אוֹתָם
  choice: sie
  rationale: Das direkte Objektpronomen wird knapp als „sie“ wiedergegeben; die folgende Aufzählung bestimmt die Gemeinten näher.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: die Götter der Völker
  rationale: Die Pluralkonstruktion bezeichnet die Gottheiten der fremden Völker. „Völker“ passt zum geopolitischen Zusammenhang und bewahrt die Form des Hebräischen.
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: die meine Vorfahren vernichteten
  rationale: Das Hifil von שׁחת bezeichnet hier militärisches Vernichten. „Vorfahren“ vermittelt den dynastischen Sinn von אבותי im heutigen Deutsch klarer als das missverständliche „Väter“.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gosan, Haran, Rezef
  rationale: Die Ortsnamen werden in geläufiger deutscher Transliteration wiedergegeben.
- source_word: וּבְנֵי עֶדֶן
  choice: die Söhne Edens
  rationale: Die wörtliche Wendung bleibt im Haupttext erhalten; eine Fußnote erklärt ihren kollektiven Sinn als Bezeichnung der Bewohner beziehungsweise des Volkes von Eden.
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: die in Telassar waren
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die Söhne Edens und gibt die Ortsangabe mit ב als „in“ wieder.
theological_decisions:
- issue: Rhetorische Rede über die Götter anderer Völker
  choice: Der Plural „die Götter der Völker“ und die rhetorische Frage bleiben unverändert stehen.
  alternative: Die fremden Gottheiten als bloße Götzen ausdrücklich abwerten.
  rationale: Der Vers gibt die höhnische Behauptung des assyrischen Sprechers wieder. Eine zusätzliche theologische Wertung wäre im Wortlaut dieses Verses nicht ausdrücklich vorhanden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen rhetorischen Aufbau; der Doppelpunkt kennzeichnet die anschließende nähere Bestimmung. Der Fußnotenmarker steht unmittelbar bei der erklärten Wendung.
