source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת כָּל הָ/אֲרָצ֖וֹת וְ/אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/018.yaml
  text: Truly[a], O Yahweh, the kings of Assyria have laid waste all the lands and their own land[b],
translation:
  language: de
  text: 'Es ist wahr, Jahwe: Die Könige Assyriens haben alle Länder[a] und ihr Land[b] verwüstet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Gebiete“ beziehungsweise „alle Staaten“. Das hebräische Wort kann je nach Zusammenhang Länder, Gebiete oder Staatswesen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der Singular „ihr Land“. Die Formulierung kann kollektiv verstanden werden; in der Parallelstelle 2. Könige 19,17 wird häufig „ihre Länder“ übersetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: Es ist wahr
  rationale: Die Wendung bekräftigt das Folgende. „Es ist wahr“ gibt die nachdrückliche Bestätigung in Hiskijas Gebet natürlich und würdevoll wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֶחֱרִיבוּ
  choice: verwüstet
  rationale: Der Hifil von חרב bezeichnet hier das durch Krieg verursachte Veröden und Zerstören; „verwüstet“ trifft diesen Sinn knapp und idiomatisch.
- source_word: מַלְכֵי אַשּׁוּר
  choice: die Könige Assyriens
  rationale: Der deutsche Genitiv gibt die hebräische Status-constructus-Verbindung präzise und natürlich wieder.
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: alle Länder
  rationale: אֲרָצוֹת kann Länder, Gebiete oder Staatswesen bezeichnen. „Länder“ bewahrt hier die territoriale Bedeutungsbreite.
- source_word: וְאֶת אַרְצָם
  choice: und ihr Land
  rationale: Der vorliegende masoretische Text hat den Singular „Land“ mit einem Suffix der 3. Person maskulin Plural. Die Übersetzung glättet diese auffällige Formulierung nicht zu „ihre Länder“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Gottesname selbst. „Jahwe“ wahrt seinen Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug und Numerus von אַרְצָם
  choice: ihr Land
  alternative: ihre Länder
  rationale: Die Singularform des überlieferten hebräischen Textes wird beibehalten, obwohl ihr Bezug auffällig ist und die Parallelstelle 2. Könige 19,17 häufig mit „ihre Länder“ wiedergegeben wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der Doppelpunkt nach der Anrede macht die bekräftigende Einleitung im Deutschen klar. Die auffällige Singularform „ihr Land“ bleibt erhalten und wird in einer Fußnote erläutert.
