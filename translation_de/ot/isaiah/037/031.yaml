  terminology: „Haus Juda“ ist als kollektive, nationale Bezeichnung passend. „Rest“, „Wurzeln schlagen“ und „Frucht tragen“ geben die zentralen Begriffe und das metaphorische Bild ohne konfessionelle Auslegung wieder. Die Fußnote wird als vollständige, auf den markierten Ausdruck bezogene Alternative formuliert.
