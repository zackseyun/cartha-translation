  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: de
  text: Und der entkommene Rest des Hauses Juda, der übrig geblieben ist, wird wieder[a] nach unten Wurzeln schlagen und nach oben Frucht tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird weiterhin nach unten Wurzeln schlagen und nach oben Frucht tragen.'
    reason: 'Lexikalische Alternative: יסף kann hier sowohl ein erneutes als auch ein fortgesetztes Geschehen bezeichnen.'
lexical_decisions:
- source_word: וְיָסְפָה
  choice: wird wieder
  rationale: יסף bezeichnet hier ein erneutes oder fortgesetztes Geschehen. „Wird wieder“ gibt die naheliegende Zukunftsbedeutung idiomatisch wieder, ohne das im Deutschen unnatürliche „wird hinzufügen“ zu verwenden.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: was ... entkommen und übrig geblieben ist
  rationale: Die Formulierung bewahrt sowohl den Flucht- bzw. Rettungsaspekt von פְּלֵיטָה als auch den Gedanken des Verbleibens in הַנִּשְׁאָרָה und gibt das kollektiv verstandene Subjekt natürlich wieder.
- source_word: בֵּית יְהוּדָה
  choice: Haus Juda
  rationale: „Haus Juda“ bewahrt die traditionelle nationale und gemeinschaftliche Bezeichnung des hebräischen Ausdrucks, statt ihn lediglich mit „Juda“ wiederzugeben.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: nach unten Wurzeln schlagen
  rationale: Das substantivische Bild der Wurzel wird im Deutschen idiomatisch verbal ausgedrückt; „nach unten“ erhält die räumliche Gegenüberstellung zum Fruchttragen nach oben.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: und nach oben Frucht tragen
  rationale: Mit פְרִי bedeutet עשׂה „Frucht hervorbringen“. „Frucht tragen“ ist die natürliche deutsche Wendung und bewahrt das landwirtschaftliche Bild sowie den Parallelismus.
theological_decisions:
- issue: Bildhafte Darstellung der Wiederherstellung Judas
  choice: Das konkrete Bild vom Wurzelschlagen nach unten und Fruchttragen nach oben bleibt erhalten.
  alternative: Abstrakte Wiedergabe wie „wird festen Bestand haben und gedeihen“.
  rationale: Der hebräische Text beschreibt erneute Festigkeit und Gedeihen durch ein bewusst konkretes Pflanzenbild. Eine abstrakte Paraphrase würde die poetische Spannung und Anschaulichkeit abschwächen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, bildhaftem Ton. Die etwas ungewohnte, aber klare Wendung „Haus Juda“ erhält die biblische Kollektivbezeichnung; die doppelte Aussage „entkommen und übrig geblieben“ bewahrt die Nuancen des hebräischen Textes.
