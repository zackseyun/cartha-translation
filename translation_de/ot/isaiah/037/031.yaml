  source_fidelity: 'Die Aussage wird im Wesentlichen zutreffend wiedergegeben: פְּלֵיטַת und הַנִּשְׁאָרָה bezeichnen den entkommenen bzw. verbliebenen Rest Judas, und das Pflanzenbild mit den Richtungsangaben bleibt erhalten. Eine nominative Wiedergabe von פְּלֵיטַת als „Rest“ bildet jedoch die hebräische Konstruktion und ihren kollektiven Bezug klarer ab als das relativische „was … ist“.'
