base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: de
  text: Doch ich kenne dein Sitzen[a], dein Ausgehen und dein Eingehen und dein Toben gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Wohnen … dein Fortgehen … dein Eintreten“. Das Hebräische verwendet eine herkömmliche Folge von Ausdrücken für das sesshafte Leben und die Bewegungen eines Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: dein Sitzen
  rationale: Der Infinitiv von ישׁב mit Suffix bezeichnet hier im Zusammenhang mit Ausgehen und Eingehen das ruhende Verweilen bzw. die sesshafte Lebenslage. „Dein Sitzen“ bewahrt das konkrete hebräische Bild; die mögliche Bedeutung „dein Wohnen“ wird in der Fußnote genannt.
- source_word: וְצֵאתְךָ
  choice: dein Ausgehen
  rationale: Die direkte Wiedergabe wahrt das Bewegungsbild und die idiomatische Paarung mit „Eingehen“.
- source_word: וּבוֹאֲךָ
  choice: dein Eingehen
  rationale: Als Gegenstück zu „Ausgehen“ gibt „Eingehen“ die konkrete Richtung des hebräischen בוא wieder und erhält die formale Parallelität.
- source_word: יָדָעְתִּי
  choice: ich kenne
  rationale: Das Qal-Perfekt bezeichnet in diesem Zusammenhang Gottes feststehende und gegenwärtig relevante Kenntnis. Das deutsche Präsens gibt diese Aussage natürlicher wieder als ein einfaches Präteritum.
- source_word: הִתְרַגֶּזְךָ
  choice: dein Toben
  rationale: Der Hitpael von רגז bezeichnet heftige Erregung beziehungsweise feindseliges Wüten. „Toben“ bringt die gegen Gott gerichtete Heftigkeit zum Ausdruck, ohne sie als bloßen inneren Gemütszustand abzuschwächen.
- source_word: אֵלַי
  choice: gegen mich
  rationale: Obwohl אֶל grundsätzlich eine Richtung bezeichnet, verlangt die Verbindung mit feindseligem „Toben“ im Deutschen die adversative Wiedergabe „gegen mich“.
- source_word: וְאֵת
  choice: und
  rationale: Der Akkusativmarker wird nicht eigenständig übersetzt; seine koordinierende Einbindung des letzten Objekts wird durch „und“ wiedergegeben.
theological_decisions:
- issue: Göttliches Wissen im hebräischen Perfekt
  choice: „ich kenne“ im Präsens
  alternative: „ich kannte“ oder „ich habe gekannt“
  rationale: Der Zusammenhang betont die vollständige Kenntnis des HERRN von den Bewegungen und der Feindseligkeit des assyrischen Königs. Das deutsche Präsens vermittelt die fortgeltende Aussage, ohne über den Text hinaus zusätzliche dogmatische Bestimmungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivierten Infinitive bewahren die knappe Parallelstruktur und die konkrete Bildsprache des Hebräischen; die leichte Fremdheit von „dein Sitzen“ wird durch die Fußnote aufgefangen.
