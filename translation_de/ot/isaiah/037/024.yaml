  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge der assyrischen Prahlrede und die wesentlichen Bildfelder des Hebräischen zuverlässig wieder: instrumentale Beauftragung durch Diener, Beleidigung des Herrn, militärische Stärke, das Vordringen in die fernsten Bereiche des Libanon sowie das Fällen seiner ausgezeichneten Bäume. Die Wiedergaben von בְּרוֹשׁ und יַעַר כַּרְמִלּוֹ bleiben mithilfe der Fußnoten angemessen offen. Das ausdrücklich gesetzte אֲנִי in אֲנִי עָלִיתִי hat jedoch emphatische Funktion, die über das im Deutschen ohnehin erforderliche Personalpronomen hinausgeht und daher besser mit »ich selbst« wiedergegeben wird.'
