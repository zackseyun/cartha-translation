  to: 'Durch deine Diener hast du den Herrn verhöhnt[a] und gesagt: »Mit meinen vielen Streitwagen bin ich selbst auf die Höhen der Berge hinaufgezogen, bis in die entlegensten Winkel des Libanon. Ich werde seine hohen Zedern und seine erlesensten Zypressen[b] fällen. Ich werde bis zu seiner äußersten Höhe vordringen, in seinen üppigen Wald[c].«'
