  terminology: »den Herrn« gibt אֲדֹנָי als Titel korrekt wieder, ohne den Gottesnamen einzutragen. »Diener«, »Streitwagen«, »Zedern« und »Zypressen« sind passend; die botanische Unsicherheit von berosch wird sachgerecht in Fußnote b kenntlich gemacht.
