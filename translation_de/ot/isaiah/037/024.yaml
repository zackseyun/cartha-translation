  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: de
  text: 'Durch deine Diener hast du den Herrn verhöhnt[a] und gesagt: »Mit meinen vielen Streitwagen bin ich selbst auf die Höhen der Berge hinaufgezogen, bis in die entlegensten Winkel des Libanon. Ich werde seine hohen Zedern und seine erlesensten Zypressen[b] fällen. Ich werde bis zu seiner äußersten Höhe vordringen, in seinen üppigen Wald[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geschmäht« beziehungsweise »verspottet«; das hebräische Verb bezeichnet eine verächtliche Beleidigung oder Herausforderung.'
    reason: lexical_alternative
  - marker: b
    text: Welche Baumart mit dem hebräischen Wort berosch gemeint ist, ist unsicher; möglich sind Zypresse, Tanne oder ein anderer Nadelbaum.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seinen fruchtbaren Wald«. Der hebräische Ausdruck verbindet die Vorstellung eines Waldes mit der von fruchtbarem, üppig bewachsenem Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: Durch deine Diener
  rationale: Die Wendung bedeutet wörtlich »durch die Hand deiner Diener« und bezeichnet hier das Mittel beziehungsweise die Beauftragten, durch die der Spott ausgesprochen wurde.
- source_word: חֵרַפְתָּ
  choice: hast du … verhöhnt
  rationale: »Verhöhnen« gibt den verächtlichen, beleidigenden und herausfordernden Sinn des Verbs in natürlichem Deutsch wieder.
- source_word: אֲדֹנָי
  choice: den Herrn
  rationale: Das Hebräische verwendet hier den Gottestitel Adonaj, nicht den Gottesnamen JHWH.
- source_word: בְּרֹב רִכְבִּי
  choice: Mit meinen vielen Streitwagen
  rationale: Die Formulierung bewahrt den militärischen Machtanspruch und ist im Deutschen unmittelbar verständlich.
- source_word: אֲנִי עָלִיתִי
  choice: bin ich … hinaufgezogen
  rationale: Das ausdrücklich gesetzte Pronomen wird durch die normale deutsche Wortstellung nach dem vorangestellten Satzglied hinreichend sichtbar; ein zusätzliches »ich selbst« wäre im Deutschen unnötig schwerfällig.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: bis in die entlegensten Winkel des Libanon
  rationale: Die Wendung bezeichnet die hintersten oder fernsten Bereiche und nicht bloß geografische Seiten.
- source_word: קוֹמַת אֲרָזָיו
  choice: seine hohen Zedern
  rationale: Das Substantiv bezeichnet Höhe oder Wuchs; attributives »hohen« vermittelt das Bild idiomatisch.
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: seine erlesensten Zypressen
  rationale: מִבְחַר bezeichnet das Ausgewählte oder Beste; die genaue botanische Bestimmung von בְּרוֹשׁ bleibt unsicher und wird in einer Fußnote offengehalten.
- source_word: וְאָבוֹא מְרוֹם קִצּוֹ
  choice: Ich werde bis zu seiner äußersten Höhe vordringen
  rationale: בוא kann »kommen«, »hineingehen« oder im Kontext »vordringen« bedeuten. קֵץ bezeichnet hier den äußersten beziehungsweise fernsten Bereich.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: seinen üppigen Wald
  rationale: כַּרְמֶל kann fruchtbares Kulturland beziehungsweise üppiges Wachstum bezeichnen. »Üppiger Wald« verbindet die ausdrücklich genannte Waldlandschaft mit der Vorstellung reicher Vegetation.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: Herr
  rationale: Die Übersetzung gibt den vorliegenden Titel wieder und setzt nicht den Bundesnamen voraus, der hier im masoretischen Text nicht steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält den prahlerischen Ton und die Abfolge militärischer Selbstbehauptungen bei. Botanische und bildsprachliche Unsicherheiten werden nicht im Haupttext überladen, sondern in den Fußnoten offengehalten.
