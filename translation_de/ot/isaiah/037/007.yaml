source:
  edition: WLC
  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: de
  text: Siehe, ich lege einen Geist[a] in ihn. Er wird eine Nachricht[b] hören und in sein Land zurückkehren. Ich werde ihn in seinem Land durch das Schwert zu Fall bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen inneren Antrieb“ bzw. „eine bestimmte Gesinnung“. Das hebräische רוּחַ kann einen Geist, eine innere Regung oder eine Haltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Meldung“ bzw. „ein Gerücht“. Das hebräische שְׁמוּעָה bezeichnet eine vernommene Mitteilung, ohne festzulegen, ob sie bestätigt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי נוֹתֵן
  choice: Siehe, ich lege
  rationale: „Siehe“ bewahrt den aufmerksamkeitslenkenden, feierlichen Ton von הִנְנִי. Das Partizip נוֹתֵן bezeichnet hier eine unmittelbar bevorstehende bzw. bereits ins Werk gesetzte Handlung; „ich lege“ gibt dies im Deutschen natürlich wieder.
- source_word: בּוֹ רוּחַ
  choice: einen Geist in ihn
  rationale: Die Präposition bezeichnet hier eine Einwirkung im Inneren des Königs. „Geist“ wahrt die Bedeutungsbreite von רוּחַ und legt nicht fest, ob ein geistliches Wesen, ein innerer Antrieb oder eine bestimmte Gesinnung gemeint ist.
- source_word: שְׁמוּעָה
  choice: eine Nachricht
  rationale: שְׁמוּעָה bezeichnet eine vernommene Mitteilung, ohne deren Verlässlichkeit näher zu bestimmen. „Nachricht“ bleibt entsprechend neutral.
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: wird er in sein Land zurückkehren
  rationale: שׁוּב bedeutet hier „zurückkehren“. Der Zusammenhang zwischen dem Hören der Nachricht und der Rückkehr wird im Deutschen durch den Konditionalsatz verständlich ausgedrückt, ohne die Ereignisfolge zu verändern.
- source_word: וְהִפַּלְתִּיו
  choice: ich werde ihn … zu Fall bringen
  rationale: Die Form ist kausativ. „Zu Fall bringen“ bewahrt Gottes ausdrückliche Verursachung und klingt im Deutschen natürlicher als „fallen lassen“.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die Wendung bezeichnet einen gewaltsamen Tod durch eine Waffe; „durch das Schwert“ erhält das Bild und die instrumentale Bedeutung.
- source_word: בְּאַרְצוֹ
  choice: in seinem Land
  rationale: 'Die Wiederholung von „seinem Land“ bewahrt die Betonung des hebräischen Textes: Der König wird gerade in dem Land sterben, in das er zurückkehrt.'
theological_decisions:
- issue: Bedeutung von רוּחַ in Gottes Ankündigung über den assyrischen König
  choice: Geist
  alternative: innerer Antrieb, Gesinnung oder Wind
  rationale: „Geist“ bewahrt sowohl die göttliche Wirksamkeit als auch die im Hebräischen offene Frage nach der genauen Art dieses Einflusses. Der Text wird nicht auf einen rein psychologischen Vorgang oder ein näher bestimmtes Geistwesen festgelegt.
- issue: Art des göttlichen Handelns beim Tod des Königs
  choice: Gott bringt ihn durch das Schwert zu Fall
  alternative: Der König fällt lediglich durch das Schwert
  rationale: Der Hifil von נפל stellt Gottes kausatives Handeln ausdrücklich heraus, ohne zu erläutern, durch welche menschlichen Akteure es ausgeführt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erhöhtem prophetischem Ton. „Siehe“ erhält den ausdrücklichen Aufmerksamkeitsruf; ansonsten vermeidet die Fassung unnötig altertümliche Syntax. Die Zeichensetzung macht die Abfolge von göttlicher Einwirkung, Nachricht, Rückkehr und Tod klar.
