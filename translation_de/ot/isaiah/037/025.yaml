source:
  edition: WLC
  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: de
  text: Ich selbst grub Brunnen und trank Wasser; mit meinen Fußsohlen trocknete ich alle Nilkanäle Ägyptens[a][b] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Mazor; hier wahrscheinlich eine poetische oder alternative Bezeichnung für Ägypten, nicht „Belagerung“ oder „Befestigung“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „alle Nilarme Ägyptens“. Der hebräische Ausdruck kann sich besonders auf die Arme und Kanäle des Nils beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das selbstständige Personalpronomen steht ausdrücklich im Hebräischen und trägt im Zusammenhang zur prahlerischen Selbstbetonung bei.
- source_word: קַרְתִּי
  choice: grub Brunnen
  rationale: Das Verb bezeichnet hier das Graben zur Wassergewinnung. Das im Deutschen nötige Objekt „Brunnen“ macht den gemeinten Vorgang natürlich verständlich, ohne das Bild zu verändern.
- source_word: וְשָׁתִיתִי מָיִם
  choice: und trank Wasser
  rationale: Die einfache Verbindung wird direkt und idiomatisch wiedergegeben; das formal pluralische מָיִם entspricht im Deutschen dem Stoffnamen „Wasser“.
- source_word: וְאַחְרִב
  choice: ließ … austrocknen
  rationale: Der Hifil von חרב bezeichnet bei Wasserläufen das Trockenmachen; „austrocknen lassen“ bewahrt die kausative Form und das konkrete Bild.
- source_word: בְּכַף פְּעָמַי
  choice: mit meinen Fußsohlen
  rationale: כַּף bezeichnet in Verbindung mit Füßen die Sohle. Die Formulierung erhält die anschauliche, übersteigerte Behauptung.
- source_word: יְאֹרֵי
  choice: Nilkanäle
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang häufig den Nil oder dessen Arme und Kanäle. „Nilkanäle“ ist präzise und zugleich verständlich; die mögliche Wiedergabe „Nilarme“ wird in der Fußnote bewahrt.
- source_word: מָצוֹר
  choice: Ägyptens
  rationale: מָצוֹר ist hier wahrscheinlich eine poetische oder alternative Bezeichnung für Ägypten. Die geografische Bedeutung wird im Text klar ausgedrückt, während die hebräische Form in der Fußnote vermerkt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich selbst“ erhält die ausdrückliche und im Kontext prahlerische Selbstbetonung. Das Semikolon gliedert die beiden parallelen Machtbehauptungen; die drastische Übertreibung des Austrocknens durch die Fußsohlen bleibt unverändert erhalten.
