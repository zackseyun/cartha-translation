id: ISA.37.16
reference: Isaiah 37:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: de
  text: Jahwe der Heerscharen, Gott Israels, der über den Kerubim thront[a], du allein bist Gott über alle Königreiche der Erde. Du hast den Himmel und die Erde gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der zwischen den Kerubim wohnt“; auch möglich: „der auf den Kerubim thront“.'
    reason: Die Wendung יֹשֵׁב הַכְּרֻבִים nennt keine Präposition und lässt die genaue räumliche Beziehung offen.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ bewahrt im festen Gottestitel die umfassende Bedeutung von צְבָאוֹת, ohne sie ausschließlich auf irdische Heere einzuengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung; der Kontext verlangt den Singular.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: der über den Kerubim thront
  rationale: יֹשֵׁב bezeichnet in dieser kultisch-königlichen Wendung ein Thronen. „Über den Kerubim“ vermittelt das mit der Bundeslade verbundene Bild, ohne Gottes Gegenwart räumlich zu begrenzen; die im Hebräischen nicht ausdrücklich bezeichnete räumliche Beziehung bleibt in der Fußnote offen.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: du allein bist Gott
  rationale: Die betonte Pronominalkonstruktion und לְבַדְּךָ drücken Exklusivität aus. Die deutsche Formulierung bewahrt den Nachdruck knapp und natürlich.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: über alle Königreiche der Erde
  rationale: Das לְ wird relational auf Gottes Herrschaft über sämtliche irdischen Königreiche bezogen; „über“ macht diese Beziehung im Deutschen idiomatisch deutlich.
- source_word: עָשִׂיתָ
  choice: hast … gemacht
  rationale: עשה bedeutet hier „machen“; die Wiedergabe vermeidet, das spezifischere Verb „erschaffen“ einzutragen.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: den Himmel und die Erde
  rationale: „Himmel und Erde“ ist im modernen Deutschen die natürliche Gesamtformel für die hebräische Wendung; der morphologische Plural von שָׁמַיִם wird im Deutschen idiomatisch singularisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird erkennbar und direkt wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Exklusivität in אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: du allein bist Gott
  alternative: du bist der einzige Gott; du bist Gott allein
  rationale: Die gewählte Fassung gibt die nachdrückliche Ausschließlichkeit des Hebräischen wieder, ohne die Aussage philosophisch auszuweiten.
- issue: Räumliches Bild bei יֹשֵׁב הַכְּרֻבִים
  choice: der über den Kerubim thront
  alternative: der zwischen den Kerubim wohnt; der auf den Kerubim thront
  rationale: Die Hauptfassung bringt das königliche Thronmotiv zum Ausdruck; da das Hebräische keine Präposition setzt, werden andere mögliche Auffassungen ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Heerscharen“ ist bewusst als etablierter, semantisch weiter Gottestitel beibehalten; Satzbau und übriger Wortschatz bleiben klar und gegenwärtig. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Kerubim-Wendung.
