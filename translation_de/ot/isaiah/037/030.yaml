  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Der Wechsel von der singularischen Anrede Hiskias („für dich“) zu den pluralischen Aufforderungen an die Gemeinschaft („esst“, „sät“) bleibt erhalten.
