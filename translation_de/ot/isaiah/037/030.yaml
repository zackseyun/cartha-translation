base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: de
  text: 'Und dies soll das Zeichen für dich sein: In diesem Jahr esst, was von selbst wächst, und im zweiten Jahr, was danach aufwächst[a]. Im dritten Jahr sät und erntet, pflanzt Weinberge und esst ihre Früchte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entsprechende hebräische Wort ist selten und seine genaue Bedeutung unsicher. Es kann einen zweiten Aufwuchs oder eine Nachfrucht bezeichnen, die ohne reguläre Aussaat aufgeht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: Und dies soll das Zeichen für dich sein
  rationale: Die bestimmte Form הָאוֹת bezeichnet das konkrete bestätigende Zeichen für Hiskia. Die verbloser Nominalsatz wird wegen des vorausweisenden Zusammenhangs mit „soll … sein“ wiedergegeben.
- source_word: אָכוֹל
  choice: esst
  rationale: Der Infinitivus absolutus hat hier imperativisch beziehungsweise ankündigend-anweisenden Sinn. „Esst“ fügt sich in die später folgende Reihe pluralischer Aufforderungen ein.
- source_word: סָפִיחַ
  choice: was von selbst wächst
  rationale: Das Wort bezeichnet ohne reguläre Aussaat aufgehende Feldfrucht. Die Umschreibung ist verständlich und bewahrt den landwirtschaftlichen Sinn.
- source_word: שָׁחִיס
  choice: was daraus nachwächst
  rationale: Der seltene landwirtschaftliche Ausdruck bezeichnet wahrscheinlich den im zweiten Jahr ohne neue Aussaat aufkommenden Nachwuchs. „Daraus nachwächst“ gibt den vermuteten Bezug zur vorjährigen Selbstaussaat wieder, ohne die Unsicherheit unnötig zu verdecken.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: sät und erntet
  rationale: Die pluralischen Imperative werden direkt wiedergegeben; „sät und erntet“ erhält die knappe landwirtschaftliche Parallelität.
- source_word: וְנִטְעוּ כְרָמִים
  choice: pflanzt Weinberge
  rationale: Dies ist die natürliche und sachlich genaue deutsche Wiedergabe der hebräischen Wendung.
- source_word: וְאִכְלוּ פִרְיָם
  choice: esst ihre Früchte
  rationale: Das pluralische Suffix bezieht sich auf die Weinberge; „Früchte“ ist im Deutschen bei Weinbergen natürlich und wahrt den Bildbereich des Ausgangstextes.
