base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: de
  text: 'Sie sagten zu ihm: „So spricht Hiskia: Dieser Tag ist ein Tag der Bedrängnis, der Zurechtweisung und der Schmach[a]. Denn die Kinder sind bis zur Geburt gelangt, und es fehlt die Kraft zum Gebären.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tag der Bedrängnis, der Rüge und der Verachtung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Sie sagten zu ihm
  rationale: Die reguläre Erzählform mit indirektem Objekt wird in natürlichem, knappem Deutsch wiedergegeben.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: So spricht Hiskia
  rationale: Die feste Botenformel wird würdevoll und idiomatisch wiedergegeben; das hebräische Perfekt hat hier die Funktion einer gegenwärtigen Redeeinleitung.
- source_word: יוֹם צָרָה
  choice: ein Tag der Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Angst; „Bedrängnis“ entspricht dem Ernst der nationalen Krise.
- source_word: וְתוֹכֵחָה
  choice: der Zurechtweisung
  rationale: תּוֹכֵחָה kann Zurechtweisung, Rüge oder Ahndung bezeichnen. „Zurechtweisung“ bewahrt die Vorstellung einer beschämenden Korrektur, ohne deren Urheber ausdrücklich festzulegen.
- source_word: וּנְאָצָה
  choice: der Schmach
  rationale: נְאָצָה kann Verachtung, Schmähung oder Lästerung bezeichnen. „Schmach“ gibt hier die öffentliche Entehrung wieder, ohne die Bedeutung vorschnell auf Gotteslästerung einzuengen.
- source_word: הַיּוֹם הַזֶּה
  choice: Dieser Tag
  rationale: Die vorangestellte Demonstrativformulierung und ihr feierlicher Nachdruck bleiben erhalten.
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Denn die Kinder sind bis an den Muttermund gelangt
  rationale: Die Wendung beschreibt bildhaft den Augenblick der Entbindung. „Kinder“ bezeichnet hier die zur Geburt kommenden Babys; „Muttermund“ macht die konkrete Geburtsmetapher verständlich, ohne sie zu verallgemeinern.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: doch es fehlt die Kraft zum Gebären
  rationale: Die Fortsetzung bewahrt das Bild einer Geburt, die trotz erreichter Entbindungsphase aus Kraftlosigkeit nicht vollendet werden kann.
theological_decisions:
- issue: Geburtsmetapher für die nationale Krise Judas
  choice: Das Geburtsbild wird ausdrücklich beibehalten.
  alternative: Den Sinn allgemein als erreichten Krisenpunkt und völlige Hilflosigkeit umschreiben.
  rationale: Der hebräische Text schildert Judas Not durch das drastische Bild einer bis zur Entbindung fortgeschrittenen Geburt ohne verbleibende Kraft. Eine abstrakte Paraphrase würde die rhetorische Wirkung mindern.
- issue: Deutung von נְאָצָה
  choice: „Schmach“ lässt offen, ob die Entehrung, Verachtung oder Schmähung im Vordergrund steht.
  alternative: „Gotteslästerung“ würde den Ausdruck ausdrücklich als Lästerung gegen Gott deuten.
  rationale: Obwohl der Begriff religiöse Lästerung bezeichnen kann, legt die Dreierreihe des Verses diese engere Deutung nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Botenformel und die eindringliche Geburtsmetapher bleiben erhalten; seltene oder unnötig archaische Wendungen werden vermieden.
