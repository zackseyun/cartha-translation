base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: de
  text: Weil dein Wüten gegen mich und deine Selbstsicherheit mir zu Ohren gekommen sind[a], werde ich meinen Haken in deine Nase und meinen Zaum in deine Lippen legen und dich auf dem Weg zurückführen, auf dem du gekommen bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Überheblichkeit«. Das hebräische Wort kann sorglose Ruhe oder ein Gefühl der Sicherheit bezeichnen; hier ist wahrscheinlich überhebliche Selbstgewissheit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den kausalen Grund für das folgende Gerichtswort natürlich und präzise ein.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: dein Wüten gegen mich
  rationale: Gibt die feindselige Erregung des Verbs sowie die im Kontext adversative Richtung von אֵלַי wieder.
- source_word: שַׁאֲנַנְךָ
  choice: deine Selbstsicherheit
  rationale: Bewahrt den Grundgedanken von Ruhe und sicherem Sich-Wähnen, ohne die im Kontext mitschwingende Überheblichkeit zwingend in den Haupttext einzutragen.
- source_word: עָלָה בְאָזְנַי
  choice: mir zu Ohren gekommen sind
  rationale: Eine natürliche deutsche Wiedergabe des anschaulichen hebräischen Höridioms; der Plural entspricht den beiden verbundenen Subjekten.
- source_word: חַחִי בְּאַפֶּךָ
  choice: meinen Haken in deine Nase
  rationale: Erhält das konkrete Bild eines Hakens, mit dem ein Tier oder Gefangener gewaltsam gelenkt wird.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: meinen Zaum zwischen deine Lippen
  rationale: „Zaum“ ist im Deutschen verständlich und bewahrt das Bild vollständiger Beherrschung; „zwischen“ formuliert die räumliche Beziehung idiomatisch.
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: Ich führe dich … zurück
  rationale: 'Gibt die kausative Form von שוב wieder: Gott bewirkt die Rückkehr des Angeredeten.'
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: auf dem Weg …, auf dem du gekommen bist
  rationale: Bewahrt den Gedanken der erzwungenen Umkehr auf derselben Route in natürlichem modernem Deutsch.
theological_decisions:
- issue: Anthropomorphe und tierbezogene Bildsprache für Gottes Hören und seine Herrschaft über den Feind
  choice: Die konkreten Bilder von Ohren, Haken und Zaum bleiben erhalten.
  alternative: 'Abstrakte Paraphrase wie: „Ich habe deinen Hochmut gehört; deshalb werde ich dich bezwingen und zurückschicken.“'
  rationale: Die drastische Bildsprache stellt Gottes uneingeschränkte Kontrolle über den assyrischen Herrscher heraus. Eine Abstraktion würde die rhetorische Schärfe des Ausgangstextes mindern.
- issue: Wertung von שַׁאֲנַנְךָ
  choice: Im Haupttext steht das relativ offene „Selbstsicherheit“; die negative kontextuelle Bedeutung wird in einer Fußnote erläutert.
  alternative: Eindeutig wertende Wiedergabe als „Hochmut“ oder „Überheblichkeit“.
  rationale: Das hebräische Wort bezeichnet zunächst ungestörte Ruhe oder ein Gefühl der Sicherheit, trägt hier aber wahrscheinlich den negativen Sinn überheblicher Selbstgewissheit. Haupttext und Fußnote bewahren beides.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildkräftig, vermeidet jedoch unnötig altertümliche Wendungen. „Zaum“ ist leicht gehoben, aber im konkreten Herrschaftsbild allgemein verständlich.
