source:
  edition: WLC
  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
translation:
  language: de
  text: und warfen ihre Götter ins Feuer[a]. Denn sie waren keine Götter, sondern von Menschenhand gemacht, aus Holz und Stein; darum vernichteten sie sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Götzen“. Im Hebräischen steht „ihre Götter“; gleich danach wird erklärt, dass sie in Wahrheit keine Götter, sondern von Menschen geschaffene Gegenstände waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתֹן
  choice: und warfen
  rationale: נתן bedeutet grundlegend „geben/setzen/legen“; in Verbindung mit „ins Feuer“ bezeichnet es idiomatisch das Hineinwerfen. Der deutsche Erzählzusammenhang verlangt hier das Präteritum.
- source_word: אֱלֹהֵיהֶם
  choice: ihre Götter
  rationale: 'Die direkte Wiedergabe bewahrt die polemische Spannung: Zunächst werden sie als die Götter der Völker bezeichnet, unmittelbar danach wird ihr Gottsein verneint.'
- source_word: בָּאֵשׁ
  choice: ins Feuer
  rationale: Die Verbindung mit dem Bewegungsverb wird im Deutschen natürlich als Richtung in das Feuer ausgedrückt.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: Denn sie waren keine Götter
  rationale: כִּי begründet ihre Vernichtbarkeit. Das Präteritum fügt sich in den Bericht innerhalb des Gebets ein, ohne die grundsätzliche Aussage aufzuheben.
- source_word: כִּי אִם
  choice: sondern
  rationale: Nach einer Verneinung bildet „sondern“ im Deutschen den präzisen adversativen Gegensatz.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: von Menschenhand gemacht
  rationale: Diese natürliche deutsche Wendung gibt das wörtliche „Werk menschlicher Hände“ wieder und bewahrt den Gegensatz zwischen göttlichem Sein und menschlicher Herstellung.
- source_word: עֵץ וָאֶבֶן
  choice: aus Holz und Stein
  rationale: Die Materialien werden appositionell genannt; „aus“ macht ihre Funktion im Deutschen klar, ohne zusätzliche Deutung einzuführen.
- source_word: וַיְאַבְּדוּם
  choice: darum konnten sie sie vernichten
  rationale: Die Hifil-Form bedeutet „sie vernichteten sie“. „Darum“ bringt die Folgerung zum Ausdruck; „konnten“ verdeutlicht die im Kontext begründete Vernichtbarkeit, ist jedoch gegenüber einer streng formalen Wiedergabe leicht explizierend.
theological_decisions:
- issue: Status der Gottheiten der Völker
  choice: „ihre Götter“, gefolgt von „sie waren keine Götter“
  alternative: „ihre Götzen“
  rationale: Der hebräische Text verwendet zunächst אֱלֹהִים und bestreitet anschließend ausdrücklich ihre Göttlichkeit. Diese Abfolge bewahrt die beabsichtigte polemische Spannung.
- issue: Logischer Zusammenhang des Schlusssatzes
  choice: „darum konnten sie sie vernichten“
  alternative: „und sie vernichteten sie“
  rationale: Die Formulierung macht deutlich, dass ihre Vernichtung aus ihrem bloß menschlichen und materiellen Wesen folgt. Sie darf jedoch nicht so verstanden werden, als stünde ein eigenes Modalverb im Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Von Menschenhand gemacht“ ist allgemein verständlich und wahrt die knappe Bildsprache. Der Satz beginnt kleingeschrieben, weil der vorgelegte Vers syntaktisch an den vorhergehenden Vers anschließt.
