base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: de
  text: Hast du nicht gehört? Vor langer Zeit habe ich es bewirkt, seit den Tagen der Vorzeit habe ich es geformt. Jetzt habe ich es herbeigeführt, dass du befestigte Städte zu Trümmerhaufen machst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist syntaktisch schwierig. Er kann auch unpersönlich verstanden werden: „sodass befestigte Städte zu Trümmerhaufen wurden.“'
    reason: textual_syntactic_ambiguity
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעְתָּ
  choice: Hast du es nicht gehört?
  rationale: Die rhetorische Frage erwartet Zustimmung und bewahrt den zurechtweisenden Ton. Das im Deutschen ergänzte „es“ verweist allgemein auf Gottes längst bekannten Plan.
- source_word: לְמֵרָחוֹק
  choice: Vor langer Zeit
  rationale: Die Wendung bezeichnet hier zeitliche, nicht räumliche Ferne und wird in natürlichem Deutsch idiomatisch wiedergegeben.
- source_word: עָשִׂיתִי
  choice: habe ich es gewirkt
  rationale: עשה bezeichnet Gottes Hervorbringen beziehungsweise Festsetzen des Geschehens. „Gewirkt“ passt zum abstrakten Bezug und vermeidet das im Deutschen missverständliche „gemacht“.
- source_word: מִימֵי קֶדֶם
  choice: seit den Tagen der Vorzeit
  rationale: Die gehobene, aber verständliche Formulierung erhält die Aussage über die weit zurückliegende Planung.
- source_word: וִיצַרְתִּיהָ
  choice: habe ich es gestaltet
  rationale: יצר trägt die Vorstellung absichtsvollen Formens oder Gestaltens; die Übersetzung bewahrt dieses Bild, ohne es auf bloßes Vorherwissen abzuschwächen.
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: Jetzt habe ich es eintreffen lassen
  rationale: Der Kausativ von בוא bezeichnet hier, dass Gott das zuvor gestaltete Vorhaben geschichtlich eintreten lässt.
- source_word: לְהַשְׁאוֹת
  choice: verwüsten
  rationale: Der Infinitiv bezeichnet das Veröden beziehungsweise Verwüsten und passt zum militärischen Zusammenhang.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: befestigte Städte zu Trümmerhaufen verwüsten
  rationale: Die schwierige Wortfolge wird als Ergebnis der Verwüstung verstanden. „Trümmerhaufen“ vermittelt das konkrete Bild zerstörter Städte.
theological_decisions:
- issue: Gottes Souveränität über die Eroberungen Assyriens
  choice: Gott hat das Geschehen seit alter Zeit gestaltet und lässt es nun durch den angesprochenen Herrscher eintreten.
  alternative: Die Aussage lediglich als göttliches Vorherwissen wiederzugeben.
  rationale: Die Folge „gewirkt … gestaltet … eintreffen lassen“ schreibt Gott mehr als bloße Voraussicht zu. Zugleich wird keine zusätzliche systematische Erklärung in den Text eingefügt.
- issue: Subjekt des abschließenden Verwüstungssatzes
  choice: Der angesprochene assyrische König bleibt als handelndes „du“ erhalten.
  alternative: 'Unpersönlich beziehungsweise intransitiv: „sodass befestigte Städte zu Trümmerhaufen wurden“.'
  rationale: Die masoretische Konsonantenfolge ist schwierig, doch die vokalisierte Form לְהַשְׁאוֹת kann als aktiver Infinitiv mit dem angeredeten König als implizitem Agens verstanden werden. Die Fußnote macht die syntaktische Unsicherheit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Die Parallelität der beiden zeitlich zurückblickenden Aussagen bleibt erhalten; die echte Unsicherheit des Schlusssatzes wird nicht stillschweigend beseitigt, sondern in einer Fußnote ausgewiesen.
