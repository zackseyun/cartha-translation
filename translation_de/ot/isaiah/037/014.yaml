source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: de
  text: Da nahm Hiskia die Briefe aus der Hand der Boten[a] und las sie[b]. Dann ging er hinauf in das Haus Jahwes und breitete sie vor Jahwe aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Hand der Boten“; die Wendung bezeichnet hier die Übergabe durch sie.'
    reason: cultural_note
  - marker: b
    text: Wörtlich steht im Hebräischen beim Lesen und Ausbreiten jeweils ein singularisches Pronomen („es“); gemeint ist wahrscheinlich die in den Briefen enthaltene Botschaft als Einheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: die Briefe
  rationale: סֵפֶר bezeichnet allgemein ein Schriftstück. Im Erzählzusammenhang handelt es sich um die von den assyrischen Boten überbrachte schriftliche Botschaft; „Briefe“ ist dafür im Deutschen natürlich und sachlich passend.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die wörtliche hebräische Wendung bleibt im Deutschen verständlich und veranschaulicht die unmittelbare Übergabe durch die Boten.
- source_word: הַמַּלְאָכִים
  choice: der Boten
  rationale: מַלְאָךְ kann einen menschlichen Boten oder einen Engel bezeichnen. Hier sind im historischen Zusammenhang eindeutig menschliche Abgesandte gemeint; „Boten“ bewahrt den Grundbegriff, ohne stärker als nötig zu deuten.
- source_word: וַיִּקְרָאֵהוּ
  choice: und las sie
  rationale: קרא bedeutet bei einem Schriftstück „lesen“. Obwohl das Objektsuffix im Hebräischen Singular ist, bezieht es sich wahrscheinlich kollektiv auf die in den Briefen enthaltene Botschaft; das deutsche Pronomen richtet sich natürlich nach dem Plural „Briefe“.
- source_word: וַיַּעַל
  choice: Dann ging er hinauf
  rationale: עלה bezeichnet das Hinaufgehen. Die Übersetzung erhält die räumliche Vorstellung des Weges zum erhöht gelegenen Heiligtum.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiedergabe folgt der konkreten hebräischen Formulierung „Haus JHWHs“ und vermeidet die erklärende, aber weniger formnahe Übersetzung „Tempel“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname JHWH wird in der im modernen Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: und breitete sie … aus
  rationale: פרשׂ bedeutet „ausbreiten“. Wie beim vorherigen Verb steht im Hebräischen ein singularisches Objektsuffix, das wohl kollektiv auf die schriftliche Botschaft verweist; im Deutschen entspricht „sie“ dem gewählten Plural „Briefe“.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: 'Die knappe Wendung gibt die räumliche und relationale Bedeutung von לִפְנֵי natürlich wieder: Hiskia legt die Briefe in Jahwes Gegenwart vor ihn hin.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen Charakter als persönlichen Gottesnamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Singularisches Objektsuffix bei pluralischem Bezugswort
  choice: Pluralische Wiedergabe „sie“ mit Fußnote
  alternative: Singularische Wiedergabe „es“
  rationale: Die hebräische Form lässt die Spannung zwischen den mehreren Schriftstücken und ihrer einen zusammenhängenden Botschaft erkennen. Der flüssige deutsche Haupttext bezieht das Pronomen auf „Briefe“; die Fußnote bewahrt die grammatische Besonderheit und damit die mögliche kollektive Auffassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die Wiederholung des Gottesnamens und die konkrete Bezeichnung „Haus Jahwes“ bleiben erhalten. „Da“ und „Dann“ bilden die hebräische Handlungsfolge natürlich ab, ohne sie stilistisch auszuschmücken.
