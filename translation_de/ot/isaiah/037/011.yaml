  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: de
  text: Sieh, du hast gehört, was die Könige von Assyrien all diesen Ländern angetan haben, indem sie sie der Vernichtung weihten[a]—und du wirst gerettet werden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sie völlig vernichteten“ oder „sie dem Bann weihten“. Das hebräische Verb kann das Aussondern bzw. Weihen zur vollständigen Vernichtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Und du wirst entkommen?“ Im Zusammenhang ist dies eine spöttische rhetorische Frage.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die Wendung lenkt nachdrücklich die Aufmerksamkeit auf etwas bereits Bekanntes. „Sieh doch“ gibt diese hervorhebende Funktion in natürlichem modernem Deutsch wieder.
- source_word: שָׁמַעְתָּ
  choice: du hast gehört
  rationale: Das Perfekt bezeichnet hier eine dem Angesprochenen bereits bekannte Nachricht; das deutsche Perfekt passt zum unmittelbaren rhetorischen Appell.
- source_word: אֲשֶׁר עָשׂוּ
  choice: was ... gemacht haben
  rationale: Die Verbindung aus Relativpartikel und Verb führt idiomatisch den Inhalt dessen ein, was Hiskija gehört hat.
- source_word: מַלְכֵי אַשּׁוּר
  choice: die Könige von Assyrien
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: לְכָל הָאֲרָצוֹת
  choice: mit all den Ländern
  rationale: Die Präposition wird passend zur deutschen Verbindung „etwas mit jemandem oder etwas machen“ wiedergegeben. Der Plural bezeichnet die verschiedenen eroberten Länder, nicht die gesamte Erde.
- source_word: לְהַחֲרִימָם
  choice: sie dem Untergang geweiht
  rationale: Der Hifil-Infinitiv von חרם mit Suffix bezeichnet, dass die Länder unwiderruflich vollständiger Vernichtung übergeben wurden. „Dem Untergang weihen“ bewahrt dieses Gewicht, ohne einen schwer verständlichen Fachausdruck zu verwenden.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: Und du solltest gerettet werden?
  rationale: 'Das selbstständige Pronomen hebt den spöttischen Gegensatz hervor: Nachdem alle anderen Länder vernichtet wurden, soll ausgerechnet Hiskija Rettung erfahren. Die passive Form von נצל bleibt erhalten; die Frageform gibt den rhetorischen Sinn wieder.'
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie im militärischen Zusammenhang
  choice: dem Untergang weihen
  alternative: völlig vernichten; dem Bann übergeben
  rationale: 'חרם bezeichnet mehr als eine gewöhnliche Niederlage: Etwas wird unwiderruflich der vollständigen Vernichtung übergeben. Die gewählte Formulierung bewahrt diese Bedeutungsfülle, ohne den Ausdruck ausdrücklich als kultischen „Bann“ zu deuten.'
- issue: תִּנָּצֵל als rhetorische Frage
  choice: Und du solltest gerettet werden?
  alternative: Und du wirst gerettet werden; und du solltest entkommen?
  rationale: Der Kontext ist eine assyrische Verhöhnung von Hiskijas Hoffnung auf Rettung. Die hebräische Schrift markiert die Frage nicht eigens, doch der Zusammenhang und der betonte Gegensatz sprechen klar für eine rhetorische Frage. „Gerettet werden“ bewahrt zugleich die Passivform.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ wirkt nachdrücklich, ohne altertümlich zu klingen. Der Doppelpunkt macht das Verhältnis zwischen dem Handeln der assyrischen Könige und der anschließenden חרם-Aussage transparent; die abschließende Frage behält den höhnischen Ton und die theologische Spannung der behaupteten Rettung bei.
