  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שְׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת כָּל דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שָׁלַ֔ח לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: de
  text: Neige dein Ohr, HERR, und höre! Öffne deine Augen, HERR, und sieh! Höre alle Worte Sanheribs, die er gesandt hat, um den lebendigen Gott zu verhöhnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Neige dein Ohr
  rationale: Gibt die hebräische Aufforderung und das Körperbild unmittelbar und in würdigem, verständlichem Deutsch wieder.
- source_word: פְּקַח ... עֵינֶיךָ
  choice: Öffne deine Augen
  rationale: Bewahrt den Plural des hebräischen Textes und die parallele Gebetsformulierung.
- source_word: לְחָרֵף
  choice: zu verhöhnen
  rationale: Das Verb bezeichnet hier eine ehrverletzende, herausfordernde Schmähung. „Verhöhnen“ passt zum Kontext und wahrt den gegen Gott gerichteten Frevel.
- source_word: אֱלֹהִים חָי
  choice: den lebendigen Gott
  rationale: Entspricht der bestimmten, im Deutschen idiomatischen Bezeichnung und erhält den Kontrast zu machtlosen Götzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen bzw. Großbuchstaben bleibt für gewöhnliche Leser verständlich und kennzeichnet den Gottesnamen, ohne eine unsichere Aussprache festzulegen.
- issue: Bezug von אֲשֶׁר שָׁלַח
  choice: die er gesandt hat
  alternative: mit denen er seine Boten gesandt hat
  rationale: 'Die grammatische Spannung bleibt erhalten: Das maskuline Singularpronomen verweist natürlich auf Sanherib, während der nicht ausdrücklich genannte Gegenstand des Sendens aus dem Zusammenhang als Worte beziehungsweise Botschaft verstanden wird.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die imperativische Dreierfolge und der Parallelismus des Gebets bleiben erhalten; „all die Worte“ klingt natürlich und gibt כָּל דִּבְרֵי vollständig wieder.
