revisions:
- from: Neige dein Ohr, HERR, und höre! Öffne deine Augen, HERR, und sieh! Höre all die Worte Sanheribs, die er gesandt hat, um den lebendigen Gott zu verhöhnen.
  to: Neige dein Ohr, HERR, und höre! Öffne deine Augen, HERR, und sieh! Höre alle Worte Sanheribs, die er gesandt hat, um den lebendigen Gott zu verhöhnen.
  rationale: Eine minimale stilistisch-semantische Anpassung ersetzt die verstärkende Wendung „all die“ durch das quellentreuere „alle“. Die im Hebräischen vorhandene Bezugsspannung des Relativsatzes wird nicht durch eine interpretierende Umformulierung aufgelöst.
