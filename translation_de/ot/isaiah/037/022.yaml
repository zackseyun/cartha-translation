  - severity: low
    issue: Unidiomatische Stellung von „hinter dir“
    rationale: Bei einer gegen einen weggehenden Gegner gerichteten Kopfbewegung ist „hinter dir her den Kopf schütteln“ im Deutschen die natürliche Entsprechung zu אַחֲרֶיךָ רֹאשׁ הֵנִיעָה.
