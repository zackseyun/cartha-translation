  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzstruktur, die beiden Spottverben und die personifizierten Bezeichnungen Zion und Jerusalem grundsätzlich zuverlässig wieder. „Über ihn“ ist für עָלָיו möglich und bewahrt gegenüber „gegen ihn“ die offenere Bezugnahme. Die Wendung אַחֲרֶיךָ verlangt jedoch eine im Deutschen idiomatischere Zuordnung zur Kopfbewegung.
  naturalness: „Die Jungfrau, Tochter Zion“ wirkt im modernen Standarddeutsch ohne zweiten Artikel oder attributive Verbindung syntaktisch abgerissen. „Die jungfräuliche Tochter Zion“ ist die etablierte und natürliche poetische Wiedergabe. „schüttelt hinter dir den Kopf“ ist ebenfalls unidiomatisch; „schüttelt hinter dir her den Kopf“ bringt die gegen den abziehenden Gegner gerichtete Geste klar zum Ausdruck.
  terminology: „der HERR“ ist eine angemessene konventionelle Wiedergabe des Tetragramms. „Tochter Zion“ und „Tochter Jerusalem“ erhalten die poetische Personifikation. „jungfräulich“ gibt בְּתוּלַת in dieser konstruktartigen Titelform angemessen wieder, ohne zusätzliche theologische Aussage.
