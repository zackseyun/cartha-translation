  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: de
  text: 'Dies ist das Wort, das der HERR über ihn gesprochen hat: »Die jungfräuliche Tochter Zion verachtet dich und verspottet dich. Die Tochter Jerusalem schüttelt hinter dir her den Kopf.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen bzw. Großschreibung; sie entspricht hier der konsultierten Fassung und ist im modernen Bibeldeutsch vertraut.
- source_word: בְּתוּלַת בַּת־צִיּוֹן
  choice: die Jungfrau, Tochter Zion
  rationale: Bewahrt sowohl בְּתוּלָה („Jungfrau“) als auch die personifizierende Bezeichnung „Tochter Zion“, ohne beide Ausdrücke zu einem modernen Eigennamen zu verschmelzen.
- source_word: בָּזָה ... לָעֲגָה
  choice: verachtet dich und verspottet dich
  rationale: Gibt die beiden parallelen Verben klar und idiomatisch wieder; der zweite Ausdruck bezeichnet Spott bzw. Hohn.
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: schüttelt hinter dir den Kopf
  rationale: Gibt die verächtliche Spottgebärde natürlich auf Deutsch wieder und erhält „hinter dir“ als Hinweis auf den abziehenden bzw. abgewiesenen Gegner.
- source_word: בַּת יְרוּשָׁלִָם
  choice: die Tochter Jerusalem
  rationale: Bewahrt die poetische Personifikation und den Parallelismus mit „Tochter Zion“.
theological_decisions:
- issue: Bezugswort von עָלָיו („über/gegen ihn“)
  choice: über ihn
  alternative: gegen ihn
  rationale: „Über ihn“ lässt offen, ob die folgende Botschaft ihn betrifft oder ausdrücklich gegen ihn gerichtet ist, und bewahrt so die semantische Breite der Präposition.
- issue: Personifikation Zions und Jerusalems
  choice: weibliche Einzelfigur als „Jungfrau, Tochter Zion“ bzw. „Tochter Jerusalem“
  alternative: die jungfräuliche Tochter Zion
  rationale: Die appositionale Wiedergabe erhält die dichte poetische Bildsprache und vermeidet eine unnötige dogmatische oder historische Festlegung des Jungfrauenmotivs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener hebräischer Parallelstruktur. Die direkte Rede wird durch deutsche Anführungszeichen markiert; kurze, klare Verben tragen den spöttischen Ton des prophetischen Wortes.
