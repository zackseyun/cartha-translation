  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/אֵ֣ת שֶׁבְנָ֣א הַ/סּוֹפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: de
  text: Dann sandte er Eljakim, den Palastvorsteher[a], den Schreiber Schebna und die Ältesten der Priester, alle in Sacktuch gehüllt[b], zu dem Propheten Jesaja, dem Sohn des Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der über das Haus [gesetzt] war“. Gemeint ist der Beamte, der dem königlichen Haushalt beziehungsweise Palast vorstand.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „mit Sacktuch bekleidet“ oder „Sacktuch tragend“. Sacktuch war ein sichtbares Zeichen von Trauer oder Demütigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann sandte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge im modernen Deutsch natürlich wieder, ohne dem schlichten Sendevorgang eine zusätzliche Begründung zu geben.
- source_word: אֶלְיָקִים
  choice: Eljakim
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: den Palastvorsteher
  rationale: Die Wendung bezeichnet hier den Amtsträger, der dem königlichen Haushalt beziehungsweise Palast vorstand. Die kompakte Amtsbezeichnung ist im Deutschen verständlich; die wörtlichere Form wird in einer Fußnote bewahrt.
- source_word: שֶׁבְנָא הַסּוֹפֵר
  choice: den Schreiber Schebna
  rationale: סֹפֵר bezeichnet einen Schreiber beziehungsweise königlichen Sekretär. „Schreiber“ bleibt nahe am hebräischen Titel und legt dessen genaue Verwaltungsfunktion nicht enger fest.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: die Ältesten der Priester
  rationale: Die Wiedergabe bildet die hebräische Genitivverbindung transparent ab und lässt offen, ob damit ältere, führende oder institutionell als Älteste geltende Priester gemeint sind.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: die in Sacktuch gehüllt waren
  rationale: Die partizipiale Form beschreibt ihren anhaltenden Zustand. „In Sacktuch gehüllt“ bewahrt das Bild des Bedeckens und bezeichnet zugleich sichtbar Trauer oder Demütigung.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: zu dem Propheten Jesaja, dem Sohn des Amoz
  rationale: Name, Vatersname und prophetischer Titel werden direkt wiedergegeben. Die deutsche Wortstellung verbindet den bestimmten Titel natürlich mit dem Namen.
