source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: de
  text: 'Darum sagt Jahwe über den König von Assyrien: Er wird nicht in diese Stadt kommen, dort keinen Pfeil abschießen, nicht mit einem Schild gegen sie vorrücken[a] und keinen Belagerungswall gegen sie aufschütten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr mit einem Schild entgegentreten“ bzw. „mit einem Schild vor sie treten“. Der hebräische Ausdruck beschreibt das geschützte Heranrücken zum Angriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Belagerungsrampe gegen sie aufschütten“. Wörtlich steht im Hebräischen: „einen Belagerungswall gegen sie ausgießen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlicher als das ebenfalls mögliche „Daher“.
- source_word: כֹּה אָמַר
  choice: spricht
  rationale: „So spricht“ ist die knappe, würdevolle deutsche Entsprechung der prophetischen Botenformel; zusammen mit „Darum“ ergibt sich hier natürlich „Darum spricht“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen gebräuchliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: über den König von Assyrien
  rationale: אֶל bezeichnet hier nach der Redeeinleitung am plausibelsten den Gegenstand der Aussage. „Über“ entspricht dem deutschen Sprachgebrauch besser als das wörtliche „zu“, da die folgenden Worte nicht als direkte Anrede formuliert sind.
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: Er wird nicht in diese Stadt kommen
  rationale: Bewahrt die Bewegungsrichtung von אֶל und lässt den assyrischen König als Repräsentanten seines Heeres stehen, ohne „eindringen“ interpretierend hinzuzufügen.
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: dort keinen Pfeil abschießen
  rationale: Die Hifil-Form von ירה bezeichnet mit חֵץ das Abschießen eines Pfeils; „dort“ gibt שָׁם ausdrücklich wieder.
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: nicht mit einem Schild gegen sie vorrücken
  rationale: קדם im Piel kann das Entgegentreten, Herantreten oder Vorrücken bezeichnen. Im Belagerungskontext vermittelt „vorrücken“ das militärische Bild, ohne eine bestimmte Angriffsformation festzulegen.
- source_word: וְלֹא יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: keinen Belagerungswall gegen sie aufschütten
  rationale: שׁפך bedeutet wörtlich „ausgießen“, bezeichnet mit סֹלְלָה aber das Aufschütten eines Belagerungswerks. „Belagerungswall“ ist verständlich und lässt offen, ob eher ein Erdwall oder eine Angriffsrampe gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen und vermeidet die Ersetzung durch den Titel „der HERR“.
- issue: Bezug des assyrischen Königs auf die Belagerung
  choice: Das grammatische Subjekt „er“ bleibt erhalten
  alternative: explizite Erweiterung zu „sein Heer“
  rationale: Der hebräische Text nennt den König selbst und kann ihn repräsentativ für seine Streitmacht sprechen lassen. Eine ausdrückliche Ergänzung von „sein Heer“ würde diese rhetorische Spannung auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller prophetischer Tonlage. Die vierfach verneinte Folge des Hebräischen wird knapp beibehalten. Das feminine Pronomen „sie“ nimmt jeweils „diese Stadt“ auf.
