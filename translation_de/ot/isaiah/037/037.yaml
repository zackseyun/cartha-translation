  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
translation:
  language: de
  text: Da brach Sanherib, der König von Assyrien, auf, zog fort, kehrte zurück und wohnte[a] in Ninive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blieb“ oder „ließ sich nieder“. Das hebräische Verb kann Bleiben, Wohnen oder sich Niederlassen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: brach … auf
  rationale: Das Verb נסע bezeichnet im Reisebericht das Aufbrechen beziehungsweise Losziehen. „Aufbrechen“ gibt die Bewegung natürlich wieder, ohne das im Deutschen stärker militärisch gefärbte „das Lager abbrechen“ ausdrücklich einzutragen.
- source_word: וַיֵּלֶךְ
  choice: zog fort
  rationale: הלך ist das gewöhnliche Verb für „gehen“. „Zog fort“ bewahrt hier die eigenständige zweite Bewegungsangabe der hebräischen Verbfolge und klingt bei einem König mit seinem Heer idiomatisch.
- source_word: וַיָּשָׁב
  choice: kehrte zurück
  rationale: שׁוב bedeutet in diesem Reisekontext „zurückkehren“. Die Übersetzung lässt das Ziel zunächst offen, wie es auch der hebräische Satz tut.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: „Sanherib“ ist die etablierte deutsche Namensform des assyrischen Königs.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Sanheribs Amt und Herrschaftsgebiet. Die deutsche Apposition verlangt hier idiomatisch den bestimmten Artikel.
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישׁב kann „sitzen“, „bleiben“, „wohnen“ oder „sich niederlassen“ bedeuten. Nach der Rückkehr nach Ninive gibt „wohnte“ den Sinn einer Residenz natürlich und ohne unnötig altertümlichen Ton wieder.
- source_word: בְּנִינְוֵה
  choice: in Ninive
  rationale: Die Präposition בְּ ist lokal gebraucht; „Ninive“ ist die etablierte deutsche Form des Stadtnamens.
