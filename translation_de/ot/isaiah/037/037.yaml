translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache Bewegungsfolge des Hebräischen bleibt erkennbar, wird aber durch deutsche Zeichensetzung lesbar gegliedert. Der letzte Teilsatz steht als eigener Satz, um die mögliche Bedeutung eines dauerhaften Wohnens klar und natürlich auszudrücken.
