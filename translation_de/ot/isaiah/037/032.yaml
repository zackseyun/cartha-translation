  text: כִּ֤י מִ/ירֽוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: de
  text: Denn von Jerusalem wird ein Rest ausgehen, und vom Berg Zion werden Entkommene ausgehen. Der Eifer Jahwes der Heerscharen wird dies vollbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Eifersucht Jahwes der Heerscharen wird dies vollbringen.“ Das hebräische Wort kann „Eifer“ oder „Eifersucht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Verheißung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: von Jerusalem wird ein Rest ausgehen
  rationale: מִן bezeichnet den Ausgangspunkt; das Qal-Imperfekt von יצא ist hier zukunftsbezogen. „Ein Rest“ bewahrt das prophetische Schlüsselmotiv und die fehlende ausdrückliche Determination.
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: und vom Berg Zion, wer entkommen ist
  rationale: פְלֵיטָה bezeichnet hier parallel zu „Rest“ entkommene beziehungsweise überlebende Menschen. Die singularische Kollektivformulierung bewahrt die Struktur des Hebräischen, ohne ein abstraktes „Rettung“ nahezulegen.
- source_word: קִנְאַת
  choice: Der Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang meint es Jahwes intensive Entschlossenheit, seine Zusage zu verwirklichen; die alternative Bedeutung wird in der Fußnote bewahrt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwes der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ erhält die breite und traditionelle Bedeutung des festen göttlichen Titels.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: wird dies vollbringen
  rationale: Gibt die zugesicherte göttliche Wirksamkeit idiomatisch wieder. „Vollbringen“ passt im Deutschen besser zum abstrakten Subjekt „Eifer“ als das formal nähere „tun“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קִנְאַת in Bezug auf Gott
  choice: Eifer
  alternative: Eifersucht
  rationale: Der Kontext hebt Gottes kraftvolle, treue Entschlossenheit hervor. Da das hebräische Wort zugleich „Eifersucht“ bedeuten kann, wird diese echte lexikalische Spannung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Rest-Terminologie und die Parallelstruktur werden bewahrt; zugleich wird der Schlusssatz mit „vollbringen“ natürlich formuliert. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
