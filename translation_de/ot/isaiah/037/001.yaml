  terminology: „Jahwe“ ist eine im Deutschen etablierte Wiedergabe des Tetragramms und entspricht der vorgegebenen Namenspolitik. „Haus Jahwes“ bewahrt die Tempelbezeichnung ohne unzulässige zusätzliche Ausdeutung. „Sacktuch“ trifft den groben Trauerstoff; die Übersetzung legt dessen Bedeutung nicht einseitig fest.
