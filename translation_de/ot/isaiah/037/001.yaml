id: ISA.37.1
reference: Isaiah 37:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: de
  text: 'Und es geschah: Als König Hiskia das[a] hörte, zerriss er seine Kleider, hüllte sich in Sacktuch und ging in das Haus Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen nur „als König Hiskia hörte“; was er hörte, ergibt sich aus dem vorangehenden Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische narrative Einleitungsformel wird erkennbar bewahrt, ohne die altertümlichere Wendung „Und es begab sich“ zu verwenden.
- source_word: כִּשְׁמֹעַ
  choice: als … das hörte
  rationale: כְּ mit dem Infinitiv von שׁמע bezeichnet hier den zeitlichen Umstand. Das Objekt bleibt im Hebräischen unausgesprochen; „das“ nimmt im Deutschen den vorangehenden Zusammenhang auf.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: König Hiskia
  rationale: Titel und Eigenname stehen in Apposition; „König Hiskia“ ist die natürliche deutsche Form.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Die konkrete Trauer- und Erschütterungsgeste wird wörtlich und idiomatisch wiedergegeben.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: hüllte sich in Sacktuch
  rationale: Die reflexive Verbform bezeichnet das Anlegen beziehungsweise Umhüllen mit dem groben Trauerstoff. „Sacktuch“ bezeichnet hier den Stoff, nicht einen einzelnen Sack.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: ging in das Haus Jahwes
  rationale: בוא mit בֵּית als Ziel bezeichnet das Hineingehen in den Tempel; „Haus Jahwes“ bewahrt die hebräische Tempelbezeichnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Umschrift gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova; Yahweh
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ ist die geläufige deutschsprachige Umschrift und bewahrt den Charakter als Eigenname, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung des Zerreißens der Kleider und des Sacktuchs
  choice: Die Handlungen werden konkret wiedergegeben, ohne ihre genaue emotionale oder kultische Bedeutung im Text auszudeuten.
  alternative: Eine ausdrückliche Deutung als Trauer, Buße oder Entsetzen
  rationale: Die Gesten können tiefe Erschütterung, Trauer und Demütigung ausdrücken; der Vers selbst legt sich jedoch nicht auf nur eine dieser Bedeutungen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt der knappen hebräischen Erzählweise. „Und es geschah“ wahrt die narrative Formel; der Doppelpunkt ermöglicht dennoch einen gut verständlichen deutschen Satz. „Sacktuch“ wird als Bezeichnung des Trauerstoffs gebraucht.
