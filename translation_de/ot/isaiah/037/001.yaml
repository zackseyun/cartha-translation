  source_fidelity: 'Der Entwurf gibt die hebräische Erzählfolge vollständig und treffend wieder: die narrative Einleitung, den temporalen Infinitivsatz mit implizitem Objekt, den Königstitel, das Zerreißen der Kleider, das Sich-Hüllen in Sacktuch und den Gang in das Haus Jahwes. „das“ ergänzt das im Hebräischen ausgelassene Objekt ausschließlich aus dem Kontext und wird angemessen erläutert.'
