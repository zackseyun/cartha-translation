id: ISA.37.21
reference: Isaiah 37:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ הִתְפַּלַּ֣לְתָּ אֵלַ֔/י אֶל סַנְחֵרִ֖יב מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: de
  text: 'Da sandte Jesaja, der Sohn des Amoz, Hiskia folgende Botschaft: »So spricht Jahwe[b], der Gott Israels: Weil du wegen Sanherib, des Königs von Assyrien, zu mir gebetet hast,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formnäher: „Was du wegen Sanherib, des Königs von Assyrien, zu mir gebetet hast –“. Der hebräische Satz ist elliptisch und wird in der folgenden Aussage weitergeführt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH. Traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … folgende Botschaft
  rationale: Das Verb bedeutet „senden“; sein Objekt bleibt im Hebräischen unausgesprochen. „folgende Botschaft“ macht den im Kontext gemeinten Mitteilungsakt im Deutschen natürlich deutlich, ohne einen Boten ausdrücklich hinzuzufügen.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Jesaja, der Sohn des Amoz
  rationale: Die Namen folgen der üblichen deutschen Bibelschreibung; die Apposition gibt das Patronym transparent wieder.
- source_word: לֵאמֹר
  choice: folgende Botschaft
  rationale: Die hebräische Einleitungsformel wird idiomatisch in die deutsche Konstruktion mit „sandte“ integriert; ein zusätzliches „und ließ sagen“ wäre schwerfälliger.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige und zugleich formnahe deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird transparent und in natürlichem Deutsch wiedergegeben.
- source_word: אֲשֶׁר
  choice: Weil
  rationale: Die Konjunktion erschließt den sachlichen Zusammenhang der elliptischen hebräischen Klausel und entspricht dem Sinn der Parallele in 2. Könige 19,20; die Fußnote bewahrt die formalere, offenere Wiedergabe.
- source_word: הִתְפַּלַּלְתָּ אֵלַי
  choice: du … zu mir gebetet hast
  rationale: Das Hitpael von פלל bezeichnet hier das Beten. Das deutsche Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Bedeutung natürlich wieder.
- source_word: אֶל סַנְחֵרִיב
  choice: wegen Sanherib
  rationale: Die Präposition bezeichnet hier den Gegenstand beziehungsweise Anlass des Gebets. „wegen“ ist klar und vermeidet die stärker deutende Wiedergabe „gegen“.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Die hebräische Status-constructus-Verbindung wird als erklärende Apposition zu Sanherib wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt.
- issue: Elliptische Klausel nach „der Gott Israels“
  choice: Weil du wegen Sanherib, des Königs von Assyrien, zu mir gebetet hast,
  alternative: Was du wegen Sanherib, des Königs von Assyrien, zu mir gebetet hast –
  rationale: „Weil“ ergibt einen verständlichen Anschluss und wird durch die vollständigere Parallele in 2. Könige 19,20 gestützt. Da der hebräische Wortlaut syntaktisch knapp und offen bleibt, wird die formalere Alternative ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „So spricht“ bleibt erhalten. Die Anrede Gottes und die fortlaufende Satzstruktur enden bewusst mit einem Komma, weil die Gottesrede im nächsten Vers weitergeht.
