translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Erzählstruktur. Die eröffnende Konjunktion und die Wiederholung von „hörte“ bleiben sichtbar. Der Vers endet als Einleitung der im Folgevers einsetzenden Botschaft mit einem Doppelpunkt.
