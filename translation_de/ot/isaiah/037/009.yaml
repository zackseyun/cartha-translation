base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/009.yaml
  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: de
  text: 'Und er hörte über Tirhaka, den König von Kusch,[a] die Nachricht: »Er ist ausgezogen, um gegen dich zu kämpfen.« Als er dies hörte, sandte er Boten zu Hiskia und ließ ihm sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den König von Äthiopien«. Der hebräische Name lautet Kusch und bezeichnet ein Gebiet südlich von Ägypten, das oft mit Regionen des antiken Nubien und Äthiopiens verbunden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Und er hörte
  rationale: Bewahrt sowohl die narrative Verknüpfung durch וַ als auch die Grundbedeutung von שׁמע; der folgende Kontext macht deutlich, dass es sich um eine Nachricht handelt.
- source_word: עַל תִּרְהָקָה
  choice: über Tirhaka
  rationale: עַל bezeichnet nach שׁמע den Gegenstand der Nachricht. „Über“ ist im modernen Deutsch natürlich und quellennah.
- source_word: מֶלֶךְ כּוּשׁ
  choice: den König von Kusch
  rationale: Kusch gibt den hebräischen geografisch-ethnischen Namen wieder, ohne ihn mit einem späteren Staatsgebiet gleichzusetzen.
- source_word: לֵאמֹר
  choice: sagen / ließ ihm sagen
  rationale: Das erste לֵאמֹר leitet die mitgeteilte direkte Rede ein. Beim zweiten wird die idiomatische deutsche Botenformel „ließ ihm sagen“ verwendet; der Doppelpunkt hält den Übergang zur Rede im Folgevers offen.
- source_word: יָצָא
  choice: Er ist ausgezogen
  rationale: Im militärischen Zusammenhang bezeichnet יצא das Aufbrechen beziehungsweise Ausrücken; „ist ausgezogen“ ist präzise und idiomatisch.
- source_word: לְהִלָּחֵם אִתָּךְ
  choice: um gegen dich zu kämpfen
  rationale: Das Verb bedeutet hier „kämpfen“; אֵת/אִתָּךְ hat im Kampfzusammenhang adversative Bedeutung und wird daher natürlich mit „gegen dich“ wiedergegeben.
- source_word: וַיִּשְׁמַע
  choice: Als er das hörte
  rationale: Die Wiederholung wird erhalten, während „als“ den zeitlich-folgernden Zusammenhang im Deutschen natürlich ausdrückt. „Das“ greift ausdrücklich die Nachricht auf.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: sandte er Boten
  rationale: מַלְאָכִים bezeichnet hier menschliche königliche Boten; „sandte“ entspricht dem würdigen Erzählregister.
- source_word: אֶל חִזְקִיָּהוּ
  choice: zu Hiskia
  rationale: „Hiskia“ ist die etablierte deutsche Namensform; אֶל wird mit „zu“ wiedergegeben.
