base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: de
  text: Da kehrte der Rabschake[a] zurück und fand den König von Assyrien im Kampf gegen Libna[b]; denn er hatte gehört, dass dieser von Lachisch abgezogen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Obermundschenk“. Der hebräisch-assyrische Titel „Rabschake“ wird hier traditionell in Umschrift wiedergegeben, weil er als Hof- beziehungsweise Amtstitel und in der Erzählung als Bezeichnung dieses Würdenträgers dient.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei Libna“. Die hebräische Wendung kann stärker örtlich verstanden werden; im Zusammenhang geht es darum, dass der König von Assyrien gegen die Stadt kämpfte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte zurück
  rationale: Das Wayyiqtol von שוב führt die Erzählung fort; „kehrte zurück“ gibt die Rückbewegung knapp und natürlich wieder.
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Der assyrische Amtstitel bezeichnet in der Erzählung diesen bereits eingeführten Würdenträger. Die traditionelle Umschrift vermeidet eine unsichere Festlegung auf eine genaue Amtsfunktion.
- source_word: וַיִּמְצָא אֶת
  choice: fand
  rationale: מצא mit direktem Objekt bedeutet hier schlicht „finden“ beziehungsweise „antreffen“; „fand … im Kampf“ ist im Deutschen idiomatisch.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: den König von Assyrien
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: נִלְחָם עַל
  choice: im Kampf gegen
  rationale: Das Partizip Nifal von לחם mit על beschreibt den König als in einen Kampf gegen die Stadt verwickelt. Die Formulierung erhält den feindlichen Bezug und klingt zugleich natürlich.
- source_word: לִבְנָה
  choice: Libna
  rationale: Der Ortsname wird nach üblicher deutscher biblischer Schreibweise wiedergegeben.
- source_word: כִּי שָׁמַע
  choice: denn er hatte gehört
  rationale: כִּי begründet die Rückkehr beziehungsweise das Antreffen; das Plusquamperfekt macht deutlich, dass das Hören zeitlich vorausging.
- source_word: כִּי נָסַע
  choice: dass dieser … abgezogen war
  rationale: נסע bezeichnet häufig das Aufbrechen oder den Abzug eines Lagers beziehungsweise Heeres. „Abgezogen war“ passt zum militärischen Zusammenhang, ohne zusätzliche Einzelheiten einzutragen.
- source_word: מִלָּכִישׁ
  choice: von Lachisch
  rationale: Der Ortsname mit der Präposition מִן wird direkt und entsprechend der üblichen deutschen Namensform wiedergegeben.
