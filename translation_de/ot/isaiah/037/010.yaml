source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: de
  text: 'So sollt ihr zu Hiskia, dem König von Juda, sagen: »Lass dich nicht von deinem Gott täuschen[a], auf den du vertraust, indem er dir sagt: ›Jerusalem wird nicht in die Hand[b] des Königs von Assyrien gegeben werden.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „irreführen“. Das hebräische Verb kann „täuschen“ oder „irreführen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „In die Hand“ ist eine hebräische Wendung für „in die Gewalt“ oder „in die Macht“.
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה
  choice: So
  rationale: Leitet die auszurichtende Botschaft als natürliche deutsche Botenformel ein.
- source_word: תֹאמְרוּן
  choice: sollt ihr ... sagen
  rationale: Das Imperfekt der 2. Person Plural hat hier auffordernde Kraft; „sollt ihr sagen“ bewahrt den Charakter einer verbindlichen Anweisung.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hiskia, dem König von Juda
  rationale: Der Königtitel steht als Apposition zum Namen; Kasus und Kommas entsprechen natürlichem Standarddeutsch.
- source_word: יַשִּׁאֲךָ
  choice: Lass dich ... nicht täuschen
  rationale: Das Hifil von נשׁא bezeichnet hier das Täuschen oder Irreführen. Die reflexive deutsche Konstruktion gibt die Warnung idiomatisch wieder.
- source_word: אֱלֹהֶיךָ
  choice: von deinem Gott
  rationale: Das Suffix der 2. Person Singular bleibt erhalten; die Präposition ergibt sich aus der deutschen Passivkonstruktion.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: auf den du vertraust
  rationale: בטח bezeichnet Vertrauen oder Sichverlassen; „auf jemanden vertrauen“ ist im Deutschen natürlich und bewahrt den persönlichen Bezug.
- source_word: לֵאמֹר
  choice: mit den Worten
  rationale: Die Wendung führt den Inhalt der angeblichen Täuschung ein und wird im Deutschen klar und flüssig wiedergegeben.
- source_word: לֹא תִנָּתֵן
  choice: wird nicht ... gegeben werden
  rationale: Die passive Form des Verbs נתן wird formal bewahrt, ohne sie interpretierend durch „erobert“ zu ersetzen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Das hebräische Bild wird im Haupttext erhalten; seine Bedeutung „in die Gewalt/Macht“ wird in einer Fußnote erklärt.
theological_decisions:
- issue: Assyrische Verhöhnung des Gottes Hiskias
  choice: Lass dich von deinem Gott ... nicht täuschen
  alternative: Lass dich von deinem Gott ... nicht irreführen
  rationale: Die scharfe Anklage gehört zur feindlichen Rede des assyrischen Absenders. Sie wird weder abgeschwächt noch als Aussage des Erzählers dargestellt; der Zusammenhang beurteilt ihren Wahrheitsanspruch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Botenformel bleibt knapp und formell; die direkte Rede bewahrt die Schärfe der assyrischen Drohung. Das hebräische Bild „in die Hand“ bleibt im Text stehen und wird erklärt.
