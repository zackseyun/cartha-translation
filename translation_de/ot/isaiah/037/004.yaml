source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: de
  text: Vielleicht hört Jahwe, dein Gott, die Worte des Rabschake[a], den sein Herr, der König von Assyrien, gesandt hat, um den lebendigen Gott zu verhöhnen, und wird die Worte zurechtweisen, die Jahwe, dein Gott, gehört hat.[b] Darum erhebe ein Gebet für den Rest, der noch vorhanden ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rabschake“ ist eine assyrische Amtsbezeichnung, die hier wie eine Bezeichnung der Person gebraucht wird; traditionell wird sie auch als „Obermundschenk“ verstanden.
    reason: cultural_note
  - marker: b
    text: 'Oder: „und wird wegen der Worte zur Rechenschaft ziehen“ oder „und wird den Worten entgegentreten“. Das hebräische Verb kann Zurechtweisung, Widerlegung oder ein Zur-Rechenschaft-Ziehen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „für den verbliebenen Rest“ oder „für die Überlebenden, die noch übrig sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Vielleicht hört
  rationale: Gibt die erhoffte Möglichkeit natürlich wieder, ohne Gewissheit auszudrücken; „hört“ bewahrt den Grundsinn des hebräischen Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Behandelt die assyrische Amtsbezeichnung entsprechend ihrer namenähnlichen Verwendung im Kontext; eine Erläuterung steht in der Fußnote.
- source_word: לְחָרֵף
  choice: zu verhöhnen
  rationale: Bezeichnet hier die verächtliche und gotteslästerliche Rede gegen den lebendigen Gott in natürlichem modernem Deutsch.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: und zieht ihn wegen der Worte zur Rechenschaft
  rationale: Bewahrt die mögliche gerichtliche Bedeutung von יכח und macht den im Hebräischen nur impliziten Bezug auf den Sprecher im Deutschen verständlich, ohne die Alternative „zurechtweisen“ auszuschließen.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: der Rest, der noch vorhanden ist
  rationale: Bewahrt den für Jesaja bedeutsamen Ausdruck „Rest“ und gibt das Partizip נִמְצָאָה idiomatisch als gegenwärtiges Vorhandensein wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich; die Transliteration bewahrt den Eigennamen.
- issue: Bedeutung von וְהוֹכִיחַ
  choice: zieht ihn … zur Rechenschaft
  alternative: weist die Worte zurecht / antwortet auf die Worte
  rationale: Das Verb kann Zurechtweisung, Widerlegung oder gerichtliches Zur-Rechenschaft-Ziehen ausdrücken. Der Haupttext verwendet eine kontextuell passende Formulierung, während die Fußnote die Spannweite offenhält.
- issue: Wiedergabe von שְׁאֵרִית
  choice: Rest
  alternative: Überlebende
  rationale: „Rest“ erhält die mögliche theologische Resonanz des Ausdrucks in Jesaja, ohne sie im Vers weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem Hebräischen erkennbar nahe, wird aber durch „sein Herr, der König von Assyrien“ eindeutig und idiomatisch gegliedert. „Darum erhebe ein Gebet“ bewahrt den feierlichen Imperativ, ohne altertümlich zu wirken.
