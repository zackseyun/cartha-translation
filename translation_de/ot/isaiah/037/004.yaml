  rationale: Die einzige sachlich notwendige Änderung entfernt das nicht ausdrücklich im Ausgangstext genannte Objekt „ihn“. „Die Worte zurechtweisen“ bewahrt die in der englischen Audit-Spur vertretene metonymische Lesart und lässt die Alternativen in der Fußnote offen. Die übrigen Formulierungen und Fußnoten bleiben erhalten.
