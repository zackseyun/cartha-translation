  text: וְ/גַנּוֹתִ֛י עַל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: de
  text: Und ich werde diese Stadt verteidigen[a], um sie zu retten[b] – um meinetwillen und um meines Dieners David willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beschützen« oder »abschirmen«.'
    reason: lexical_alternative
  - marker: b
    text: »Retten« kann hier auch mit »befreien« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: Und ich werde … verteidigen
  rationale: Das Verb גנן bezeichnet schützendes Abschirmen. »Verteidigen« gibt im militärischen Zusammenhang der bedrohten Stadt die Handlung natürlich und treffend wieder; die vorangestellte Konjunktion wird als »Und« bewahrt.
- source_word: עַל הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: In Verbindung mit גנן bezeichnet עַל die Stadt als Ziel der schützenden Handlung und wird im Deutschen bei »verteidigen« nicht eigens wiedergegeben. Substantiv mit Demonstrativ wird natürlich mit »diese Stadt« übersetzt.
- source_word: לְהוֹשִׁיעָהּ
  choice: um sie zu retten
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck. »Retten« wahrt die grundlegende Bedeutung von ישׁע; das feminine Pronomen bezieht sich auf »Stadt«.
- source_word: לְמַעֲנִי
  choice: um meinetwillen
  rationale: Die feste deutsche Wendung gibt den in Gott selbst liegenden Beweggrund knapp und mit der im Hebräischen vorhandenen Selbstbezüglichkeit wieder.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: und um meines Dieners David willen
  rationale: Die Formulierung bewahrt die Parallelität der beiden mit לְמַעַן eingeleiteten Beweggründe. »Diener« entspricht Davids Stellung gegenüber Gott im königlich-bundestheologischen Zusammenhang.
theological_decisions:
- issue: Göttlicher Beweggrund für die Rettung Jerusalems
  choice: um meinetwillen und um meines Dieners David willen
  alternative: um meines Namens beziehungsweise meines Bundes mit David willen
  rationale: Der Text nennt Gottes eigene Sache und David als zwei miteinander verbundene Beweggründe. Die Übersetzung lässt diese Aussage und ihre theologische Spannung stehen, ohne »meinetwillen« erläuternd mit Gottes Namen oder Ehre und »um Davids willen« mit einer ausformulierten Bundestheologie gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert Zweck und Beweggrund, ohne zusätzliche inhaltliche Beziehungen einzutragen. Die wiederholte Wendung »um … willen« bewahrt die Parallelität und den feierlichen Ton.
