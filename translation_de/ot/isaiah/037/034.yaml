source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: de
  text: Auf dem Weg, auf dem er gekommen ist, wird er zurückkehren; und in diese Stadt wird er nicht kommen – Ausspruch Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָּהּ
  choice: Auf dem Weg, auf dem er gekommen ist
  rationale: דֶּרֶךְ bezeichnet hier den Reiseweg. Die Wiederaufnahme durch בָּהּ wird im Deutschen mit dem zweiten „auf dem“ bewahrt, ohne die unnatürliche Formulierung „auf ihm“.
- source_word: יָשׁוּב
  choice: wird er zurückkehren
  rationale: שׁוּב bezeichnet hier die Rückkehr auf demselben Weg; „zurückkehren“ ist präzise und natürlich.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: in diese Stadt aber wird er nicht kommen
  rationale: Mit בוא und einem Ziel bezeichnet אֶל die Bewegung in Richtung beziehungsweise hinein in die Stadt. „aber“ gibt den kontrastiven Zusammenhang natürlich wieder, ohne eine zusätzliche theologische Deutung einzutragen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feste prophetische Formel; „Ausspruch“ erhält ihren nominalen und autoritativen Charakter. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. „Jahwe“ gibt diesen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des männlichen Subjekts
  choice: Das ungenannte „er“ bleibt unbestimmt
  alternative: ausdrückliche Benennung des assyrischen Königs
  rationale: Der Vers selbst enthält nur die maskulinen Verbformen. Der Kontext identifiziert den Betreffenden, doch die Übersetzung fügt keinen Namen ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Wegmotivs bleibt erkennbar; der abschließende Gedankenstrich markiert die prophetische Schlussformel.
