lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: So kamen
  rationale: Das Wayyiqtol von בוא führt die Erzählung mit einem einfachen Präteritum fort. „So“ gibt den folgernden Anschluss an den vorherigen Auftrag im Deutschen natürlich wieder; auch „Und“ oder „Da“ wären möglich.
- source_word: עַבְדֵי
  choice: die Diener
  rationale: Der Konstruktplural von עבד bezeichnet im königlichen Kontext die Bediensteten oder Beauftragten des Königs. „Diener“ bewahrt die lexikalische Weite, ohne einen amtlichen Rang oder einen Sklavenstatus festzulegen.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: des Königs Hiskija
  rationale: Die deutsche Fügung mit Genitiv gibt die Zugehörigkeit der Diener wieder und verwendet die im Deutschen übliche Namensform Hiskija.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die gerichtete Bewegung auf eine Person hin; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Verwendet wird die im Deutschen etablierte Namensform des Propheten.
