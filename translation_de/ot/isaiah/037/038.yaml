source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: de
  text: 'Und es geschah, als er im Haus[a] seines Gottes Nisroch anbetete[b]: Seine Söhne Adrammelech und Sarezer schlugen ihn mit dem Schwert nieder und entkamen ins Land Ararat. Sein Sohn Asarhaddon wurde an seiner Stelle König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tempel“; wörtlich steht im Hebräischen „Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich niederwarf“ beziehungsweise „sich zu Boden warf“; das hebräische Verb kann die körperliche Gebärde der Anbetung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative Einleitungsformel wird in würdigem, noch heute verständlichem Deutsch wiedergegeben, ohne das altertümlichere „es begab sich“ zu verwenden.
- source_word: מִשְׁתַּחֲוֶה
  choice: anbetete
  rationale: Im kultischen Zusammenhang bezeichnet das Verb ein Sich-Niederwerfen zur Verehrung. „Anbetete“ gibt die religiöse Funktion natürlich wieder; die körperliche Bedeutung bleibt in der Fußnote sichtbar.
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: im Haus seines Gottes Nisroch
  rationale: „Haus“ folgt dem hebräischen Ausdruck eng und lässt die konkrete Bedeutung „Tempel“ in der Fußnote erkennen. Die Wortstellung identifiziert Nisroch eindeutig als seinen Gott.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: schlugen ihn mit dem Schwert nieder
  rationale: Die Wiedergabe bewahrt die Grundbedeutung „schlagen“ und bringt im Zusammenhang zugleich den tödlichen Ausgang zum Ausdruck, ohne das Verb einfach mit „töteten“ gleichzusetzen.
- source_word: נִמְלְטוּ
  choice: entkamen
  rationale: Der Nifal bezeichnet hier die gelungene Flucht nach dem Anschlag; „entkamen“ ist präzise und natürlich.
- source_word: אֶרֶץ אֲרָרָט
  choice: ins Land Ararat
  rationale: Die traditionelle geografische Bezeichnung entspricht dem hebräischen Ausdruck und bezeichnet die Region, nicht ausdrücklich den Berg.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: Im Zusammenhang der Thronfolge gibt diese Formulierung den Regierungsantritt idiomatischer wieder als das bloße „regierte“.
- source_word: אֵסַר חַדֹּן
  choice: Asar-Haddon
  rationale: Die im Deutschen verbreitete Namensform wird verwendet; der Bindestrich macht die Gliederung des Namens transparent.
theological_decisions:
- issue: Bezeichnung Nisrochs als „sein Gott“
  choice: seines Gottes Nisroch
  alternative: Nisroch, den er als Gott verehrte
  rationale: Die Übersetzung wahrt die knappe Perspektive des hebräischen Erzähltextes und fügt weder eine Bestätigung noch eine ausdrückliche Distanzierung gegenüber diesem Gott hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Erzählformel bleibt erhalten; Eigennamen folgen geläufigen deutschen Formen. Der Doppelpunkt führt den durch „Und es geschah, als …“ angekündigten Hauptvorgang klar und flüssig ein.
