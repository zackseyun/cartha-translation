  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: de
  text: Da zog der Engel Jahwes[a] aus und erschlug im Lager Assyriens 185.000. Als man früh am Morgen aufstand, siehe, sie alle waren Leichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Bote« als auch »Engel« bedeuten; hier spricht der Zusammenhang eher für einen himmlischen Vollstrecker des göttlichen Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Im Zusammenhang dieses unmittelbar göttlichen Gerichts liegt ein himmlischer Beauftragter nahe; die mögliche Wiedergabe »Bote« bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name und in der im Deutschen geläufigen Form »Jahwe« wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וַיֵּצֵא
  choice: zog ... aus
  rationale: Die idiomatische Wendung gibt die erzählende Verbform von יצא prägnant wieder und wahrt die Vorstellung des Hinausgehens zum Vollzug des Gerichts.
- source_word: וַיַּכֶּה
  choice: erschlug
  rationale: נכה bezeichnet hier ein Schlagen mit tödlichem Ausgang. »Erschlug« bewahrt sowohl den Vorgang als auch dessen ausdrücklich genannten tödlichen Ausgang.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: im Lager Assyriens
  rationale: Die Genitivkonstruktion folgt eng dem hebräischen Ausdruck und ist zugleich natürliches Deutsch.
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: '185.000'
  rationale: Die genaue Zahl wird in moderner deutscher Ziffernschreibung wiedergegeben; eine nicht ausdrücklich vorhandene Personenbezeichnung wird nicht ergänzt.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Als man früh am Morgen aufstand
  rationale: Das hebräische Verb steht in der 3. Person Plural, ohne dass ein eindeutiges Subjekt genannt wird. Das unpersönliche »man« bewahrt diese Offenheit und gibt den Aspekt des frühen Aufstehens wieder.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: »Siehe« erhält die aufmerksamkeitslenkende und dramatische Funktion von הִנֵּה, ohne den Satz unnötig auszudeuten.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: da waren sie alle tot – lauter Leichen
  rationale: Die Formulierung bewahrt sowohl כֻּלָּם (»sie alle«) als auch die nachdrückliche Verbindung von »Leichen« und »tot«, vermeidet aber die im Deutschen schwerfällige Wendung »tote Leichen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch den Titel »der HERR« zu ersetzen.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Das Wort מַלְאָךְ lässt beide Bedeutungen zu. Der Kontext eines übermenschlichen Gerichtsakts begünstigt »Engel«, ohne dass die lexikalische Alternative als unmöglich ausgeschlossen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt knapp und eindringlich; »siehe« erhält die dramatische Hervorhebung des hebräischen Textes. Der unbestimmte Handlungsträger beim morgendlichen Aufstehen wird nicht konkretisiert.
