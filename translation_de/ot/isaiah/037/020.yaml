  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: de
  text: Und nun, Yahweh, unser Gott, rette[a] uns aus seiner Hand, damit alle Königreiche der Erde erkennen, dass du allein Yahweh bist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreie“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass du, Yahweh, allein [bist]“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion וְ als auch den zeitlich-diskursiven Ausdruck עַתָּה und leitet im Deutschen natürlich die entscheidende Bitte ein.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt das Tetragramm als Gottes persönlichen Namen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Entspricht der Form mit dem Suffix der ersten Person Plural und bewahrt die gemeinschaftliche Anrede.
- source_word: הוֹשִׁיעֵנוּ
  choice: rette uns
  rationale: Der Hifil-Imperativ von ישׁע bezeichnet hier die Bitte um Rettung oder Befreiung. „Rette uns“ ist unmittelbar, natürlich und bedeutungsnah.
- source_word: מִיָדוֹ
  choice: aus seiner Hand
  rationale: Bewahrt das hebräische Bild der Hand als Ausdruck von Macht und Verfügungsgewalt; „aus seiner Hand“ ist im Deutschen idiomatisch.
- source_word: וְיֵדְעוּ
  choice: damit … erkennen
  rationale: Der Kontext legt nach dem Imperativ eine Zweck- beziehungsweise Ergebnisbeziehung nahe. „Damit“ gibt diese Funktion natürlich wieder, ohne sie unnötig auszubauen.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: Der internationale Kontext spricht für die umfassende Bedeutung „Erde“ statt des engeren „Land“.
- source_word: כִּי
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was die Königreiche erkennen sollen.
- source_word: אַתָּה יְהוָה לְבַדֶּךָ
  choice: dass du allein Yahweh bist
  rationale: Stellt durch „du allein“ die im Hebräischen betonte Ausschließlichkeit klar heraus und bewahrt zugleich Yahweh als Eigennamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration „Yahweh“ bewahrt diesen als Namen und ersetzt ihn nicht durch einen Hoheitstitel.
- issue: Bezug und Aussagekraft von לְבַדֶּךָ im Schlusssatz
  choice: du allein bist Yahweh
  alternative: du bist Yahweh allein; du, Yahweh, bist allein
  rationale: Die gewählte Wortstellung bezieht „allein“ auf das Subjekt „du“ und bringt die exklusive Aussage idiomatisch zum Ausdruck. Die mögliche formnähere Zuordnung wird in der Fußnote sichtbar gehalten, ohne die Aussage über den hebräischen Wortlaut hinaus zu erläutern.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die Satzführung bleibt knapp und verständlich; das Bild „aus seiner Hand“ sowie der persönliche Gottesname werden bewahrt.
