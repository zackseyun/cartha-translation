source:
  edition: WLC
  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: de
  text: Wie ist die treue Stadt zur Prostituierten geworden! Sie war voll von Recht; Gerechtigkeit wohnte in ihr[a] – jetzt aber sind dort Mörder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gerechtigkeit verbrachte die Nacht in ihr«; das Verb kann bildhaft ein Bleiben oder Wohnen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie
  rationale: Leitet einen erschütterten Klageruf über den tiefgreifenden Wandel ein, keine echte Informationsfrage.
- source_word: הָיְתָה לְזוֹנָה
  choice: ist … zur Prostituierten geworden
  rationale: Gibt den vollzogenen Zustandswechsel und das drastische Bild des hebräischen Textes in gegenwärtigem Standarddeutsch wieder.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: die treue Stadt
  rationale: Bewahrt die Personifikation und den moralischen Gegensatz zwischen früherer Treue und gegenwärtiger Verderbnis.
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: Sie war voll von Recht
  rationale: מִשְׁפָּט bezeichnet hier gerechte Rechtsordnung beziehungsweise Rechtsprechung; „Recht“ ist prägnant und unterscheidet sich vom folgenden צֶדֶק.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Bewahrt neben „Recht“ den ethisch-sozialen Akzent des Wortes, ohne die semantische Überschneidung beider Begriffe aufzuheben.
- source_word: יָלִין בָּהּ
  choice: übernachtete in ihr
  rationale: Der Ausdruck greift die konkrete Bedeutung „die Nacht verbringen“ auf und personifiziert Gerechtigkeit als einst in der Stadt anwesend.
- source_word: וְעַתָּה מְרַצְּחִים
  choice: jetzt aber sind dort Mörder
  rationale: „Jetzt aber“ macht den scharfen Gegensatz deutlich; das ergänzte „sind dort“ gibt die hebräische Ellipse in natürlichem Deutsch wieder.
theological_decisions:
- issue: Sexuelle Metapher für die Untreue und Verderbnis Jerusalems
  choice: „zur Prostituierten geworden“
  alternative: „untreu geworden“ oder „zur Hure geworden“
  rationale: Die konkrete Metapher des Ausgangstextes bleibt ausdrücklich erhalten. „Untreu“ würde sie verallgemeinern; „Hure“ ist möglich, wirkt im heutigen Deutsch jedoch stärker als Schimpfwort und kann den prophetischen Bildgebrauch unnötig vergröbern.
- issue: Verhältnis von מִשְׁפָּט und צֶדֶק
  choice: „Recht“ und „Gerechtigkeit“
  alternative: Beide mit „Gerechtigkeit“ oder צֶדֶק mit „Rechtschaffenheit“ wiedergeben
  rationale: Die gewählte Paarung wahrt sowohl die enge Bedeutungsnähe als auch eine erkennbare Nuance zwischen gerechter Ordnung und gelebter Gerechtigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Schärfe. Der Ausruf bleibt knapp; die Schlussellipse wird für natürliche Verständlichkeit behutsam ergänzt.
