  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: de
  text: Denn ihr werdet wie eine Terebinthe sein, deren Blatt verwelkt,[a] und wie ein Garten, der kein Wasser hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Eiche“. Das hebräische Wort אֵלָה kann eine Terebinthe oder eine Eiche bezeichnen; die genaue Baumart ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Folgerung aus dem zuvor angekündigten Gericht ein.
- source_word: תִהְיוּ
  choice: ihr werdet … sein
  rationale: Das Qal-Imperfekt der 2. Person Plural bezeichnet hier die bevorstehende Folge des Gerichts.
- source_word: כְאֵלָה
  choice: wie eine Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich die Terebinthe; da auch die Wiedergabe als Eiche vertreten wird, bleibt diese Artbestimmung in der Fußnote offen.
- source_word: נֹבֶלֶת עָלֶהָ
  choice: deren Blatt verwelkt
  rationale: Die partizipiale Form נֹבֶלֶת beschreibt fortschreitendes Welken; der Singular von עָלֶה mit Suffix wird als „deren Blatt“ bewahrt.
- source_word: וּכְגַנָּה
  choice: und wie ein Garten
  rationale: גַּנָּה bezeichnet einen Garten oder eine umfriedete Anbaufläche; „Garten“ ist die natürliche und bildlich passende Entsprechung.
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: der kein Wasser hat
  rationale: Die wörtliche Existenzkonstruktion „für den es kein Wasser gibt“ wird idiomatisch wiedergegeben, ohne das Bild des Wassermangels abzuschwächen.
theological_decisions: []
