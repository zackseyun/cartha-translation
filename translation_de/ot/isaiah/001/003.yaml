source:
  edition: WLC
  text: יָדַ֥ע שׁוֹר֙ קֹנֵ֔/הוּ וַ/חֲמ֖וֹר אֵב֣וּס בְּעָלָ֑י/ו יִשְׂרָאֵל֙ לֹ֣א יָדַ֔ע עַמִּ֖/י לֹ֥א הִתְבּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: de
  text: Ein Ochse erkennt seinen Besitzer[a] und ein Esel den Futtertrog seines Herrn; Israel aber erkennt nicht; mein Volk versteht nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Eigentümer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: erkennt
  rationale: „Erkennt“ bewahrt in beiden Vorkommen dieselbe Wortwahl und gibt den kognitiven wie relationalen Sinn von ידע wieder. Anders als „kennt“ kann es im zweiten Satz ohne ausdrücklich genanntes Objekt stehen.
- source_word: שׁוֹר
  choice: Ochse
  rationale: „Ochse“ ist die geläufige Bezeichnung für das hier als Arbeitstier vorgestellte Hausrind und passt zum sprichwörtlichen Vergleich.
- source_word: קֹנֵהוּ
  choice: seinen Besitzer
  rationale: Das Partizip von קנה kann den Erwerber oder Eigentümer bezeichnen; im Zusammenhang mit einem Haustier ist „Besitzer“ die natürliche deutsche Entsprechung.
- source_word: חֲמוֹר
  choice: Esel
  rationale: „Esel“ ist die klare und übliche moderne deutsche Bezeichnung.
- source_word: אֵבוּס
  choice: Futtertrog
  rationale: „Futtertrog“ bezeichnet den Futterbehälter verständlich und ohne die besonderen Assoziationen, die „Krippe“ heute hervorrufen kann.
- source_word: בְּעָלָיו
  choice: seines Herrn
  rationale: בעל bezeichnet hier den Herrn beziehungsweise Besitzer des Tieres. „Herr“ bewahrt den Aspekt der Verfügungsgewalt und vermeidet eine unmittelbare Wiederholung von „Besitzer“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name des Volkes bleibt unverändert und steht im scharfen Gegensatz zu den verständigen Tieren.
- source_word: לֹא יָדַע
  choice: erkennt nicht
  rationale: Die Wiederholung von „erkennt“ erhält die rhetorische Gegenüberstellung. Das im Hebräischen nicht genannte Objekt wird auch im Deutschen nicht ergänzt.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die direkte Wiedergabe des Possessivsuffixes bewahrt die Bundesbeziehung und die Klage im göttlichen Reden.
- source_word: הִתְבּוֹנָן
  choice: versteht nicht
  rationale: Die Form bezeichnet einsichtiges Wahrnehmen oder verständiges Bedenken. „Versteht nicht“ ist natürliches modernes Deutsch und bleibt parallel zu „erkennt nicht“.
theological_decisions:
- issue: Nicht genanntes Objekt von Israels Nichterkennen
  choice: Das Objekt bleibt im Haupttext unausgesprochen.
  alternative: „Israel erkennt den HERRN/mich nicht“
  rationale: Der Zusammenhang legt Gott als Objekt nahe, doch der hebräische Text nennt kein Objekt. Die knappe, offene Formulierung bewahrt diese Spannung, statt sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Parallelstruktur. „Erkennt“ wurde bewusst zweimal verwendet, damit die Wiederholung des hebräischen ידע und der Gegensatz zwischen den Tieren und Israel hörbar bleiben.
