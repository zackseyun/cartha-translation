  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: de
  text: Zion wird durch Recht erlöst und die zu ihr zurückkehren[a] durch Gerechtigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Umkehrenden“ beziehungsweise „die in ihr umkehren“. Das hebräische Wort kann sowohl Umkehr als auch Rückkehr bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: בְּמִשְׁפָּט
  choice: durch Recht
  rationale: מִשְׁפָּט bezeichnet hier die rechtliche und ethische Ordnung; בְּ wird instrumental mit „durch“ wiedergegeben. „Recht“ hält den Begriff von צְדָקָה („Gerechtigkeit“) unterscheidbar.
- source_word: תִּפָּדֶה
  choice: wird erlöst
  rationale: Das Nifal von פדה bezeichnet das Erlöst- oder Losgekauftwerden. „Erlöst“ bewahrt sowohl den konkreten Rettungssinn als auch den theologischen Klang.
- source_word: וְשָׁבֶיהָ
  choice: und die, die in ihr umkehren
  rationale: Das Partizip von שוב kann eine persönliche Umkehr oder eine räumliche Rückkehr bezeichnen. Die Hauptfassung lässt im Kontext von Jesaja 1 die ethisch-geistliche Umkehr anklingen; die mögliche räumliche Deutung wird in der Fußnote ausdrücklich offengehalten.
- source_word: בִּצְדָקָה
  choice: durch Gerechtigkeit
  rationale: צְדָקָה bezeichnet normgemäßes, gerechtes Handeln. „Durch Gerechtigkeit“ wahrt den Parallelismus zu „durch Recht“, ohne beide hebräischen Begriffe gleichzusetzen.
theological_decisions:
- issue: Bedeutung von וְשָׁבֶיהָ
  choice: die, die in ihr umkehren
  alternative: die zu ihr zurückkehren / ihre Rückkehrenden
  rationale: Der Zusammenhang spricht von moralischer Umkehr und anschließender Wiederherstellung. Dennoch entscheidet die hebräische Partizipialform nicht eindeutig zwischen Umkehr und räumlicher Rückkehr; deshalb bleibt die andere Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe poetische Parallelismus wird bewahrt; „Recht“ und „Gerechtigkeit“ bilden das hebräische Begriffspaar ab.
