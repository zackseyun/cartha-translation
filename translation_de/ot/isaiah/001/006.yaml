id: ISA.1.6
reference: Isaiah 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: de
  text: 'Von der Fußsohle bis zum Kopf ist nichts an ihm gesund[a]: Wunden, Striemen und frische Verletzungen[b]. Sie sind nicht ausgedrückt[c], nicht verbunden[d] und nicht mit Öl erweicht worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische sagt wörtlich „an ihm“. Das Volk wird als verwundeter Körper dargestellt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „frische Wunden“ beziehungsweise „rohe Verletzungen“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist wahrscheinlich das Ausdrücken oder Auspressen von Wunden vor der weiteren Behandlung.
    reason: cultural_note
  - marker: d
    text: 'Oder: „nicht mit einem Verband umwickelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל וְעַד רֹאשׁ
  choice: Von der Fußsohle bis zum Kopf
  rationale: Die Wendung bezeichnet als Merismus den ganzen Körper von unten bis oben. „Fußsohle“ gibt כַּף רֶגֶל präzise und idiomatisch wieder.
- source_word: אֵין בּוֹ מְתֹם
  choice: ist nichts an ihm gesund
  rationale: מְתֹם bezeichnet körperliche Unversehrtheit oder Gesundheit. Die Formulierung bewahrt das Bild des als verwundeter Körper dargestellten Volkes; „ihm“ entspricht dem maskulinen Suffix בּוֹ, ohne dessen Bezug ausdrücklich festzulegen.
- source_word: פֶּצַע
  choice: Wunden
  rationale: פֶּצַע ist eine allgemeine Bezeichnung für Wunden oder Verletzungen. Der deutsche Plural gibt den kollektiv gebrauchten hebräischen Singular natürlich wieder.
- source_word: חַבּוּרָה
  choice: Striemen
  rationale: חַבּוּרָה bezeichnet eine durch Schläge verursachte Strieme oder Prellung. „Striemen“ erhält den Zusammenhang mit den zuvor erwähnten Schlägen.
- source_word: מַכָּה טְרִיָּה
  choice: frische Verletzungen
  rationale: מַכָּה kann einen Schlag oder die dadurch entstandene Verletzung bezeichnen; טְרִיָּה bedeutet hier frisch oder noch roh. Die Wiedergabe lässt offen, ob vor allem Ursache oder Wundzustand gemeint ist.
- source_word: לֹא זֹרוּ
  choice: nicht ausgedrückt
  rationale: זור wird in diesem medizinischen Zusammenhang wahrscheinlich vom Ausdrücken einer Wunde verstanden. Die Fußnote erläutert die heute nicht unmittelbar selbstverständliche Behandlungspraxis.
- source_word: וְלֹא חֻבָּשׁוּ
  choice: nicht verbunden
  rationale: חבשׁ bezeichnet bei Wunden das Verbinden oder Umwickeln. „Verbunden“ ist im modernen Deutschen eine natürliche medizinische Formulierung.
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: nicht mit Öl erweicht worden
  rationale: רכך bedeutet wörtlich „weich machen“. Die direkte Wiedergabe erhält das antike Bild der Wundbehandlung mit Öl, ohne es zu „gelindert“ oder „gepflegt“ zu verallgemeinern.
theological_decisions:
- issue: Bezug des verwundeten Körpers
  choice: Das maskuline Pronomen wird mit „an ihm“ wiedergegeben, während der Bezug im Vers selbst unausgesprochen bleibt.
  alternative: Unpersönlich „daran“ oder ausdrücklich „am ganzen Körper“; beziehungsweise eine direkte Benennung Judas oder Israels.
  rationale: Der Kontext personifiziert das Volk als schwer verwundeten Körper. Das Hebräische hat ein maskulines Suffix, nennt den Bezug hier aber nicht erneut. „An ihm“ bewahrt sowohl die Personifikation als auch die grammatische Offenheit, ohne einen einzelnen Mann oder eine ausdrücklich benannte Größe einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer medizinischer Bildsprache. Die knappe Reihung der unbehandelten Verletzungen bildet den hebräischen Nachdruck nach. Die ungewohnte Formulierung „mit Öl erweicht“ bleibt bewusst nahe am Quelltext und wird nicht durch eine stärker deutende moderne Behandlungsvokabel ersetzt.
