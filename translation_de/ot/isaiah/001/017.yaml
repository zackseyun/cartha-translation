source:
  edition: WLC
  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: de
  text: Lernt, Gutes zu tun! Sucht das Recht, weist den Unterdrücker zurecht[a], verhelft der Waise zum Recht, führt den Rechtsstreit für die Witwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „helft den Unterdrückten“ oder „bringt die Unterdrückten zu ihrem Recht“. Die hebräische Wendung ist schwierig; חָמוֹץ kann aktiv oder passiv verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ
  choice: Lernt
  rationale: Der Imperativ Plural von למד fordert dazu auf, eine Lebenspraxis einzuüben. „Lernt“ bewahrt die direkte Aufforderung.
- source_word: הֵיטֵב
  choice: Gutes zu tun
  rationale: Das adverbial gebrauchte Wort von יטב bezeichnet gutes beziehungsweise rechtes Handeln. Die deutsche Wendung macht den im Zusammenhang vorausgesetzten ethischen Sinn natürlich verständlich.
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: דרש kann „suchen“, „erforschen“ oder „erstreben“ bedeuten. „Sucht“ erhält die aktive, knappe Aufforderung.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט bezeichnet hier Recht und gerechte Rechtsprechung im sozialen und gerichtlichen Sinn. „Das Recht“ passt zum anschließenden Einsatz für Schutzlose und wahrt den juristischen Klang.
- source_word: אַשְּׁרוּ
  choice: weist … zurecht
  rationale: Die Piel-Form von אשר kann ein Geraderichten oder Zurechtbringen ausdrücken. In Verbindung mit der aktiv verstandenen folgenden Bezeichnung ist „zurechtweisen“ im Deutschen knapp und verständlich.
- source_word: חָמוֹץ
  choice: den Unterdrücker
  rationale: Das schwierige Wort kann aktiv als „Unterdrücker/Gewalttäter“ oder passiv als „Unterdrückter“ verstanden werden. Der Haupttext folgt der aktiven Deutung; die plausible passive Deutung wird in der Fußnote bewahrt.
- source_word: שִׁפְטוּ יָתוֹם
  choice: verhelft der Waise zum Recht
  rationale: שפט hat hier gerichtlichen Sinn und fordert ein Urteil zugunsten eines schutzlosen Kindes. Die idiomatische deutsche Formulierung erhält sowohl den Rechtsbezug als auch den Begünstigten.
- source_word: יָתוֹם
  choice: Waise
  rationale: יָתוֹם bezeichnet besonders ein vaterloses und daher sozial schutzloses Kind. „Waise“ ist die natürliche heutige deutsche Bezeichnung.
- source_word: רִיבוּ
  choice: führt den Rechtsstreit
  rationale: ריב bezeichnet hier das rechtliche Streiten beziehungsweise die Vertretung einer Sache. „Den Rechtsstreit führen“ bewahrt das forensische Profil deutlicher als das allgemeinere „eintreten“.
- source_word: אַלְמָנָה
  choice: der Witwe
  rationale: אַלְמָנָה bezeichnet die Witwe als typische sozial gefährdete Person; die direkte deutsche Entsprechung ist eindeutig.
theological_decisions:
- issue: Wiedergabe der schwierigen Wortgruppe אַשְּׁרוּ חָמוֹץ
  choice: weist den Unterdrücker zurecht
  alternative: helft den Unterdrückten; bringt die Unterdrückten zu ihrem Recht
  rationale: Die hebräische Wortgruppe ist lexikalisch und syntaktisch umstritten. Der Haupttext versteht חָמוֹץ aktiv und אַשְּׁרוּ als Aufforderung zum Zurechtbringen. Da eine passive Deutung von חָמוֹץ ebenso traditionsreich und sprachlich plausibel ist, wird sie nicht ausgeschlossen, sondern in einer Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen prophetischen Imperativen. Der juristische Wortschatz („Recht“, „zum Recht verhelfen“, „Rechtsstreit“) bildet den Zusammenhang ab, ohne altertümlich zu wirken. Die Satzzeichen gliedern die eng aufeinanderfolgenden Aufforderungen.
