  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: de
  text: Denn sie werden sich schämen wegen der Eichen[a], die ihr begehrt habt, und ihr werdet beschämt dastehen wegen der Gärten, die ihr ausgewählt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Terebinthen“. Das hebräische Wort kann große Bäume bezeichnen; die genaue Baumart ist unsicher. Im Zusammenhang stehen sie möglicherweise für Orte unerlaubter Verehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung beziehungsweise Erläuterung des vorausgehenden Gerichtsworts ein.
- source_word: יֵבֹשׁוּ
  choice: ihr werdet euch schämen
  rationale: Obwohl die Form grammatisch in der 3. Person Plural steht, spricht der parallele folgende Satzteil die Angeredeten in der 2. Person Plural an; die Wiedergabe folgt diesem erkennbaren Diskursbezug.
- source_word: מֵאֵילִים
  choice: wegen der Eichen
  rationale: אֵילִים bezeichnet hier im Parallelismus mit den Gärten am ehesten große, wohl mit unerlaubtem Kult verbundene Bäume. Die genaue Baumart bleibt unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: die ihr begehrt habt
  rationale: חמד bezeichnet starkes Verlangen oder Gefallen; „begehrt“ erhält die Intensität, ohne die kultische Bedeutung ausdrücklich in den Haupttext einzutragen.
- source_word: וְתַחְפְּרוּ
  choice: und ihr werdet beschämt dastehen
  rationale: חפר drückt hier Beschämung oder Schmach aus. „Beschämt dastehen“ ist gegenwärtiges, natürliches Deutsch und unterscheidet die Formulierung leicht vom vorausgehenden „euch schämen“.
- source_word: מֵהַגַּנּוֹת
  choice: wegen der Gärten
  rationale: Die Präposition מִן bezeichnet bei Verben der Scham den Anlass oder Grund; „wegen“ gibt dies im Deutschen idiomatisch wieder.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: die ihr erwählt habt
  rationale: בחר bedeutet „wählen“. „Erwählt“ bewahrt den bewussten, religiös gewichtigen Charakter der Entscheidung, ohne den Gegenstand näher auszudeuten.
theological_decisions:
- issue: Bedeutung der Eichen und Gärten
  choice: Der Haupttext nennt schlicht Eichen und Gärten; der wahrscheinlich kultische Hintergrund wird nur in der Fußnote zur Baumbezeichnung angedeutet.
  alternative: Die Orte im Haupttext ausdrücklich als heidnische Heiligtümer oder Kultgärten bezeichnen.
  rationale: Der Zusammenhang spricht deutlich für unerlaubte Verehrungsstätten, doch diese Deutung soll nicht an die Stelle der konkreten Bildsprache des hebräischen Textes treten.
- issue: Wechsel von der 3. zur 2. Person Plural
  choice: Beide Verben werden als Anrede in der 2. Person Plural wiedergegeben.
  alternative: „Denn sie werden sich schämen … und ihr werdet beschämt dastehen …“
  rationale: Der masoretische Text bietet zunächst יֵבֹשׁוּ (3. Person Plural), danach aber חֲמַדְתֶּם, תַחְפְּרוּ und בְּחַרְתֶּם in der 2. Person Plural. Die Übersetzung versteht den ersten Ausdruck entsprechend dem parallelen Diskurs als auf dieselben Angeredeten bezogen; der grammatische Wechsel ist eine echte formale Auffälligkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die beiden unterschiedlichen Schamausdrücke bleiben erhalten. „Begehrt“ und „erwählt“ spiegeln die bewusste Hinwendung der Angeredeten wider, ohne den kultischen Hintergrund im Haupttext auszuschreiben.
