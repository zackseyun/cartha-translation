  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: de
  text: Hört das Wort Jahwes, ihr Anführer Sodoms[a]; hört auf die Weisung unseres Gottes[b], ihr Volk Gomorras!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesaja redet die Führenden und das Volk Judas mit den Namen „Sodom“ und „Gomorra“ an. Das ist ein prophetischer Vergleich, keine wörtliche Gleichsetzung mit diesen Städten.
    reason: cultural_note
  - marker: b
    text: Oder „Lehre“ oder „Gesetz“; das hebräische Wort Tora kann diese Bedeutungen haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Qal-Imperativ Plural fordert unmittelbar zum Hören und Beachten auf. „Hört“ ist knapp, gegenwärtig und bewahrt den prophetischen Nachdruck.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר bezeichnet hier das prophetisch ergehende Wort beziehungsweise die Botschaft Gottes. „Wort“ erhält die feste prophetische Formel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: קְצִינֵי
  choice: Anführer
  rationale: Das Substantiv bezeichnet maßgebliche Leiter oder Herrschende. „Anführer“ ist verständlich und lässt offen, ob politische Amtsträger oder die führenden Kreise insgesamt gemeint sind.
- source_word: הַאֲזִינוּ
  choice: horcht auf
  rationale: Der Hifil-Imperativ von אזן ist eine nachdrückliche Aufforderung, aufmerksam zuzuhören. „Horcht auf“ unterscheidet sich vom vorausgehenden „Hört“ und erhält zugleich den Parallelismus.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder Unterweisung bedeuten. „Weisung“ bewahrt hier die Breite göttlicher Unterweisung, ohne den Ausdruck auf einen Gesetzeskodex zu verengen.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Das Suffix der ersten Person Plural ist ausdrücklich vorhanden. Die Wiedergabe erhält Jesajas Einbeziehung in das Gottesverhältnis des angesprochenen Volkes.
- source_word: עַם עֲמֹרָה
  choice: ihr Volk Gomorras
  rationale: Die Wortgruppe dient als direkte Anrede. Die deutsche Form mit „ihr“ macht den Vokativ natürlich kenntlich, ohne den scharfen Vergleich abzuschwächen.
theological_decisions:
- issue: Prophetische Bezeichnung Judas und Jerusalems als Sodom und Gomorra
  choice: Die direkten Anreden „Anführer Sodoms“ und „Volk Gomorras“ bleiben im Haupttext stehen.
  alternative: „Ihr Anführer, die ihr wie die von Sodom seid“ beziehungsweise „ihr Volk, das Gomorra gleicht“.
  rationale: Der hebräische Text setzt die Namen unmittelbar als Anrede ein. Eine ausformulierte Vergleichspartikel würde die Metapher erklären und dadurch ihre prophetische Schärfe mindern; die Fußnote klärt, dass keine wörtliche Ortsangabe gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem prophetischem Ton. Der parallele Aufbau der beiden Aufforderungen und Anreden bleibt erhalten; das Semikolon bildet die hebräische Parallelstruktur ab.
