  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Euer Ackerland verzehren Fremde vor euren Augen“ ist verständlich und bewahrt die hebräische Hervorhebung des Ackerlands. „Wie eine Verwüstung durch Fremde“ ist natürlicher und genauer als „wie nach einer Zerstörung durch Fremde“.
  terminology: „Land“, „Städte“, „Ackerland“, „Fremde“ und „verzehren“ sind treffend. Die Wiederholung von „Fremde“ bildet זָרִים angemessen nach. „Einöde“ ist als Wiedergabe von שְׁמָמָה vertretbar, auch wenn es weniger deutlich als „Verwüstung“ den Zustand der Zerstörung hervorhebt.
