source:
  edition: WLC
  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: de
  text: Euer Land ist eine Einöde, eure Städte sind mit Feuer verbrannt. Euer Ackerland verzehren Fremde vor euren Augen; es ist eine Einöde wie eine Verwüstung durch Fremde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe hebräische Wendung lautet etwa: „wie die Zerstörung/Umwälzung von Fremden“. Sie kann auch bedeuten: „wie die Zerstörung von Fremden“; manche verstehen sie als Anspielung auf die Zerstörung Sodoms.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: euer Land
  rationale: אֶרֶץ bezeichnet hier das Land beziehungsweise Staatsgebiet; „Land“ ist im Deutschen natürlich und hinreichend weit.
- source_word: שְׁמָמָה
  choice: eine Einöde
  rationale: Das Substantiv bezeichnet einen Zustand völliger Verwüstung. „Eine Einöde“ bewahrt die nominale Ausdrucksweise und den eindringlichen Ton.
- source_word: עָרֵיכֶם
  choice: eure Städte
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 2. Person maskulin Plural.
- source_word: שְׂרֻפוֹת אֵשׁ
  choice: mit Feuer verbrannt
  rationale: Die Formulierung gibt das passive Partizip mit אֵשׁ eng und zugleich idiomatisch wieder.
- source_word: אַדְמַתְכֶם
  choice: euer Ackerland
  rationale: אֲדָמָה bezeichnet hier den nutzbaren Boden und wird so von אֶרֶץ am Versanfang unterschieden.
- source_word: לְנֶגְדְּכֶם
  choice: vor euren Augen
  rationale: Die Wendung hebt hervor, dass die Angesprochenen die Verwüstung unmittelbar mitansehen müssen.
- source_word: זָרִים
  choice: Fremde
  rationale: זָרִים bezeichnet Außenstehende beziehungsweise fremde Eindringlinge. „Fremde“ wahrt die Wiederholung an beiden Stellen des Verses.
- source_word: אֹכְלִים אֹתָהּ
  choice: verzehren
  rationale: Das wörtliche „essen“ beschreibt hier bildhaft, wie Fremde den Ertrag und die Ressourcen des Ackerlandes aufbrauchen; „verzehren“ bewahrt dieses Bild natürlich.
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: wie nach einer Zerstörung durch Fremde
  rationale: מַהְפֵּכָה bezeichnet eine vernichtende Umkehrung oder Zerstörung. Die gewählte Fassung ist im Deutschen verständlich und nimmt זָרִים als Urheberangabe, ohne die syntaktische Mehrdeutigkeit zu verschweigen.
theological_decisions:
- issue: Deutung von כְּמַהְפֵּכַת זָרִים
  choice: wie nach einer Zerstörung durch Fremde
  alternative: wie bei der Zerstörung von Fremden; möglicherweise eine Anspielung auf die Zerstörung Sodoms
  rationale: Die knappe hebräische Genitivverbindung lässt offen, ob Fremde die Zerstörung verursachen oder selbst von ihr betroffen sind. Eine mögliche Sodom-Anspielung ist nicht ausdrücklich benannt und wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze und die Wiederholung von „eine Einöde“ bewahren den eindringlichen Gerichtston; „Ackerland“ unterscheidet den bebauten Boden vom umfassenderen „Land“.
