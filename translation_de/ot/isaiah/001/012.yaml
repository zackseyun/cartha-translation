  text: כִּ֣י תָבֹ֔אוּ לֵ/רָא֖וֹת פָּנָ֑/י מִי בִקֵּ֥שׁ זֹ֛את מִ/יֶּדְ/כֶ֖ם רְמֹ֥ס חֲצֵרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: de
  text: Wenn ihr kommt, um vor mein Angesicht zu treten[a], wer hat das von euch verlangt, meine Vorhöfe zu zertreten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um mein Angesicht zu sehen“; die Wendung bezeichnet hier das Erscheinen in Gottes Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den Umstand ein, auf den sich der folgende Vorwurf bezieht; im Deutschen gibt „wenn“ diesen Zusammenhang natürlich wieder.
- source_word: תָבֹאוּ
  choice: ihr kommt
  rationale: בוא bezeichnet gewöhnlich das Kommen oder Eintreten; „kommt“ passt hier zum Besuch des Heiligtums.
- source_word: לֵרָאוֹת פָּנָי
  choice: um vor mein Angesicht zu treten
  rationale: Wörtlich steht „um mein Angesicht zu sehen“. Im kultischen Zusammenhang bezeichnet die Wendung das Erscheinen in Gottes Gegenwart. „Vor mein Angesicht treten“ bewahrt das Bild des hebräischen Ausdrucks und vermittelt zugleich dessen idiomatischen Sinn.
- source_word: מִי בִקֵּשׁ
  choice: wer hat … verlangt
  rationale: Die rhetorische Frage bestreitet, dass Gott einen solchen Gottesdienst gefordert habe; „verlangt“ gibt בִּקֵּשׁ in diesem Zusammenhang treffend wieder.
- source_word: זֹאת מִיֶּדְכֶם
  choice: das von euch
  rationale: „Das“ nimmt das nachfolgend erläuterte Zertreten der Vorhöfe auf. Das hebräische „aus eurer Hand“ bezeichnet hier, was von ihnen gefordert worden sein soll; „von euch“ ist im heutigen Deutsch natürlich.
- source_word: רְמֹס חֲצֵרָי
  choice: meine Vorhöfe zu zertreten
  rationale: Der Infinitiv benennt erläuternd den beanstandeten Vorgang. „Vorhöfe“ bezeichnet die Höfe des Heiligtums, und „zertreten“ erhält den scharf abwertenden Ton von רמס.
theological_decisions:
- issue: Kultische Wendung לֵרָאוֹת פָּנָי
  choice: vor mein Angesicht zu treten
  alternative: mein Angesicht zu sehen
  rationale: Die Formulierung handelt vom Erscheinen der Gottesdienstbesucher in Gottes Gegenwart, nicht zwingend von einem körperlichen Sehen Gottes. Die gewählte Fassung wahrt das Bild des Angesichts, ohne die Wendung vorschnell als Aussage über eine sichtbare Gottesgestalt festzulegen.
- issue: Bezug des göttlichen Vorwurfs
  choice: Das Zertreten der Vorhöfe wird als Inhalt der rhetorisch bestrittenen Forderung wiedergegeben.
  alternative: Die Frage nur allgemein auf das Kommen zum Gottesdienst beziehen.
  rationale: 'Die hebräische Satzfolge stellt רְמֹס חֲצֵרָי erläuternd zu זֹאת. So bleibt die Spannung erhalten: Nicht die bloße Gegenwart im Heiligtum wird isoliert verurteilt, sondern das inhaltsleer und anmaßend gewordene Auftreten der Angesprochenen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor mein Angesicht treten“ hält bewusst einen biblisch-feierlichen Ton, bleibt aber verständlich. Der Gedankenstrich bildet die scharfe rhetorische Unterbrechung und die nachfolgende Frage natürlich ab.
