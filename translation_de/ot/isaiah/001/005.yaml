  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: de
  text: Warum solltet ihr noch geschlagen werden?[a] Ihr fahrt fort, euch aufzulehnen. Der ganze Kopf ist krank, und das ganze Herz ist matt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wo (am Körper) solltet ihr noch geschlagen werden?“ Die hebräische Wendung kann im Licht der anschließenden Körpermetaphorik auch nach der Stelle fragen, an der weitere Schläge noch treffen könnten.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: Warum
  rationale: Die Verbindung leitet am natürlichsten eine rhetorische Frage nach dem Grund bzw. Zweck weiterer Schläge ein. Die mögliche räumliche Deutung wird in einer Fußnote bewahrt.
- source_word: תֻכּוּ עוֹד
  choice: solltet ihr noch geschlagen werden
  rationale: Das Hofal von נכה wird passiv mit „geschlagen werden“ wiedergegeben; עוֹד bezeichnet weitere beziehungsweise erneute Schläge. „Solltet“ bringt den rhetorischen Sinn in natürlichem Deutsch zum Ausdruck.
- source_word: תּוֹסִיפוּ סָרָה
  choice: Ihr fahrt fort, euch aufzulehnen
  rationale: יסף mit סרה bezeichnet das fortgesetzte rebellische Abweichen. Die Aussage bleibt wie im Hebräischen deklarativ und wird nicht zu einer zweiten Frage gemacht.
- source_word: כָּל רֹאשׁ
  choice: der ganze Kopf
  rationale: Die kollektive Körpermetapher wird als Ganzes bewahrt und nicht auf „jeder Kopf“ verteilt.
- source_word: לָחֳלִי
  choice: ist krank
  rationale: Die Konstruktion mit ל und חֳלִי beschreibt den Zustand des Kopfes; „ist krank“ ist klar und idiomatisch.
- source_word: וְכָל לֵבָב דַּוָּי
  choice: und das ganze Herz matt
  rationale: „Das ganze Herz“ hält den Parallelismus zur Kopfmetapher fest. „Matt“ gibt דַּוָּי als geschwächt und kraftlos wieder, ohne es unnötig mit „krank“ zu wiederholen.
theological_decisions:
- issue: Sinn der einleitenden Frage
  choice: Rhetorische Frage nach dem Grund oder Zweck weiterer Züchtigung angesichts fortgesetzter Auflehnung
  alternative: Frage danach, an welcher Körperstelle noch weitere Schläge möglich wären
  rationale: עַל־מֶה wird hier am ehesten kausal beziehungsweise final verstanden. Die anschließende Körpermetapher lässt jedoch eine räumliche Deutung zu, die deshalb in der Fußnote genannt wird.
- issue: Satzfunktion von תּוֹסִיפוּ סָרָה
  choice: Deklarative Feststellung fortgesetzter Auflehnung
  alternative: 'Zweite Frage: „Warum lehnt ihr euch weiterhin auf?“'
  rationale: Im Hebräischen steht kein zweites Fragewort. Daher wird die Spannung zwischen weiterer Strafe und anhaltender Auflehnung bewahrt, ohne den Aussagesatz in eine zusätzliche Frage umzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe Körpermetapher und der Parallelismus des hebräischen Textes bleiben erhalten; altertümliche Wörter wie „siech“ werden vermieden.
