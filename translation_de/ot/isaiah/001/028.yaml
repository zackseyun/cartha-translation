base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: de
  text: Doch Rebellen und Sünder werden gemeinsam zerschmettert[a], und diejenigen, die Jahwe verlassen, gehen zugrunde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Rebellen und Sünder trifft gemeinsam der Untergang.“ Das hebräische Wort ist ein Substantiv und kann „Bruch“, „Zusammenbruch“ oder „Verderben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden vergehen“ beziehungsweise „werden aufgerieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: werden zerschmettert
  rationale: Das Substantiv bezeichnet Bruch, Zusammenbruch oder Verderben. Eine verbale Wiedergabe ist im Deutschen natürlich und bewahrt zugleich das konkrete Bild des Zerbrechens.
- source_word: פֹּשְׁעִים
  choice: Rebellen
  rationale: Das Wort bezeichnet Menschen, die sich bewusst auflehnen. „Rebellen“ gibt diese entschiedene Haltung in gegenwärtigem Deutsch klar wieder.
- source_word: חַטָּאִים
  choice: Sünder
  rationale: Die übliche und sachlich passende Wiedergabe für Menschen, die durch Sünde gekennzeichnet sind; die Unterscheidung gegenüber den „Rebellen“ bleibt erhalten.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet ein gemeinsames beziehungsweise gleichzeitiges Geschick. „Gemeinsam“ fügt sich hier natürlicher in den deutschen Satz als „zusammen“.
- source_word: עֹזְבֵי יְהוָה
  choice: die, die Jahwe verlassen
  rationale: Das Partizip von עזב bezeichnet das Verlassen oder Aufgeben. Die Formulierung wahrt den ernsten Beziehungs- und Bundeskontext, ohne zusätzliche Deutung einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִכְלוּ
  choice: nehmen ein Ende
  rationale: Die Verbform kann das Zu-Ende-Gehen, Vergehen oder Aufgeriebenwerden bezeichnen. „Nehmen ein Ende“ hält die Aussage bewusst weit und entspricht dem gehobenen, würdigen Register.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Transliteration bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art des angekündigten Gerichts
  choice: werden zerschmettert; nehmen ein Ende
  alternative: Verderben über Rebellen und Sünder; werden vernichtet
  rationale: Der Text kündigt den Untergang eindeutig an, legt dessen genaue Art jedoch nicht näher fest. Die Übersetzung erhält sowohl das konkrete Bruchbild von שֶׁבֶר als auch die semantische Breite von כלה.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der adversative Anschluss וְ wird mit „Doch“ wiedergegeben. Die parallele Gerichtsankündigung bleibt knapp und nachdrücklich; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten offengehalten.
