  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: de
  text: Die Vision Jesajas, des Sohnes von Amoz, die er über Juda und Jerusalem[a] sah, in den Tagen Usijas, Jotams, Ahas’ und Hiskias, der Könige von Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen Juda und Jerusalem“. Die hebräische Präposition kann sowohl den Gegenstand der Vision als auch eine gegen jemanden gerichtete Botschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: Vision
  rationale: „Vision“ gibt die prophetische Schau direkt und konventionell wieder und bewahrt den Zusammenhang mit dem folgenden Verb חָזָה („sah“).
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Gebräuchliche deutsche Namensform.
- source_word: בֶן אָמוֹץ
  choice: des Sohnes von Amoz
  rationale: Die Abstammungsangabe wird in natürlichem modernem Deutsch wiedergegeben; „Amoz“ folgt der üblichen deutschen Namensform.
- source_word: אֲשֶׁר חָזָה
  choice: die er … sah
  rationale: Der Relativsatz bezieht sich auf „Vision“. Das schlichte „sah“ bewahrt die sprachliche Verbindung zwischen Vision und Sehen, ohne erklärend zu erweitern.
- source_word: עַל
  choice: über
  rationale: „Über“ bezeichnet hier zunächst den Gegenstand der Vision und lässt deren umfassenden Inhalt aus Gericht und Hoffnung offen. Die mögliche adversative Nuance wird in der Fußnote genannt.
- source_word: יְהוּדָה וִירוּשָׁלָם
  choice: Juda und Jerusalem
  rationale: Übliche deutsche Formen der Orts- und Gebietsnamen.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Bewahrt die hebräische Zeitformel und bleibt in gehobenem, aber verständlichem Deutsch idiomatisch.
- source_word: עֻזִּיָּהוּ יוֹתָם אָחָז יְחִזְקִיָּהוּ
  choice: Usijas, Jotams, Ahas’ und Hiskias
  rationale: Gebräuchliche deutsche Formen der Königsnamen; die Genitivformen passen zur Wendung „in den Tagen“.
- source_word: מַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Die abschließende Apposition wird formal nah und zugleich verständlich wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von עַל in der Überschrift
  choice: über Juda und Jerusalem
  alternative: gegen Juda und Jerusalem
  rationale: Die Präposition kann den Gegenstand einer prophetischen Botschaft bezeichnen, in bestimmten Zusammenhängen aber auch eine gegen jemanden gerichtete Botschaft einleiten. Da das Buch sowohl Gericht als auch Hoffnung enthält, legt der Haupttext die Richtung nicht vorschnell auf Anklage fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusster Nähe zur knappen Form einer prophetischen Buchüberschrift. Die Formulierung bleibt ein Nominalsatz, wie auch der hebräische Ausgangstext.
