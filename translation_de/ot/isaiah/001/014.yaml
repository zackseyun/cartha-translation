    rationale: Die deutsche Wendung kann bedeuten, dass jemand einer Sache überdrüssig ist. נִלְאֵיתִי bezeichnet hier Müdigkeit bzw. Erschöpfung; „ich bin müde geworden“ wahrt diese Bedeutung und das Perfekt.
