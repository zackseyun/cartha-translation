  source_fidelity: 'Die wesentlichen hebräischen Elemente sind zutreffend wiedergegeben: חָדְשֵׁיכֶם als „eure Neumonde“, מוֹעֲדֵיכֶם als „eure Festzeiten“, die nachdrückliche Subjektformulierung mit נַפְשִׁי („meine Seele“), die resultative Last-Metapher und das Tragen. Die Perfektform נִלְאֵיתִי wird mit „bin müde geworden“ genauer abgebildet als mit „bin es müde“, das im Deutschen leicht ein Überdrüssigsein statt Erschöpfung ausdrücken kann.'
  naturalness: Die Voranstellung des gesamten Objekts in „Eure Neumonde und eure Festzeiten hasst meine Seele“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig stark markiert. Die Stellung „Meine Seele hasst ...“ bleibt würdig und emphatisch, ist aber deutlich natürlicher.
  terminology: „Neumonde“ bewahrt den kultischen Ausdruck. „Festzeiten“ ist im Kontext für מוֹעֲדִים vertretbar und die Fußnote hält die lexikalischen Alternativen offen. Die Formulierung vermeidet eine über den Wortlaut hinausgehende theologische Erklärung.
