id: ISA.1.14
reference: Isaiah 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: de
  text: Meine Seele hasst eure Neumonde und eure Festzeiten[a]. Sie sind mir zur Last geworden; ich bin müde geworden, sie zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eure festgesetzten Zeiten; oder: eure Feste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  choice: eure Neumonde
  rationale: חֹדֶשׁ bezeichnet wörtlich den Neumond und kann zugleich die damit verbundene monatliche Feier meinen. „Neumonde“ bewahrt die konkrete kultische Ausdrucksweise des Hebräischen.
- source_word: וּמוֹעֲדֵיכֶם
  choice: und eure Festzeiten
  rationale: מוֹעֵד kann eine festgesetzte Zeit, eine Zusammenkunft oder ein Fest bezeichnen. Im kultischen Zusammenhang gibt „Festzeiten“ sowohl den zeitlichen als auch den feierlichen Aspekt knapp und verständlich wieder; die Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: שָׂנְאָה נַפְשִׁי
  choice: hasst meine Seele
  rationale: Im Hebräischen ist נֶפֶשׁ ausdrücklich das Subjekt. Die Wiedergabe mit „meine Seele“ erhält die nachdrückliche persönliche Abscheu und glättet die Wendung nicht zu einem bloßen „ich hasse“.
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: Sie sind mir zur Last geworden
  rationale: Die Formulierung bezeichnet einen eingetretenen Zustand. „Zur Last geworden“ gibt dies idiomatisch wieder und bereitet zugleich das folgende Bild des Tragens vor.
- source_word: טֹרַח
  choice: Last
  rationale: טֹרַח kann Last, Mühsal oder Beschwernis bedeuten. „Last“ passt zum anschließenden Tragen und erhält den Zusammenhang des Bildes.
- source_word: נִלְאֵיתִי
  choice: ich bin es müde
  rationale: Das Verb bezeichnet Ermüdung oder Erschöpfung. In Verbindung mit dem Infinitiv ist „ich bin es müde, …“ natürliches modernes Deutsch und bewahrt den kräftigen prophetischen Ton.
- source_word: נְשֹׂא
  choice: sie zu tragen
  rationale: נָשָׂא bedeutet „tragen“. Das im Deutschen ergänzte Pronomen „sie“ bezieht sich eindeutig auf die zuvor genannten kultischen Feiern und erhält das Last-Bild.
theological_decisions:
- issue: Gottes Abscheu gegenüber Israels gottesdienstlichen Feiern
  choice: Die Possessivformen „eure“ werden bewahrt; der Vers formuliert Gottes entschiedene Ablehnung der von Israel praktizierten Feiern, ohne im Übersetzungstext ihren Missbrauch ausdrücklich zu erklären.
  alternative: Eine ausdeutende Wiedergabe, nach der Gott nur heuchlerische oder verdorbene Feiern ablehnt; oder eine Wiedergabe, die seine Ablehnung ausdrücklich auf die Feste an sich bezieht.
  rationale: Der unmittelbare Wortlaut nennt „eure“ Neumonde und Festzeiten und drückt Abscheu aus. Der Kontext legt eine Ablehnung des schuldhaft gewordenen Gottesdienstes nahe, doch diese Deutung sollte nicht als erklärender Zusatz in den Vers eingeführt werden. So bleiben Schärfe und theologische Spannung des Textes erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Schärfe. Die vorangestellte Objektgruppe und „hasst meine Seele“ spiegeln die hebräische Hervorhebung, bleiben aber verständlich. Das durchgehende Bild von Last und Tragen wird bewahrt.
