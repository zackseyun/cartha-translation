id: ISA.1.4
reference: Isaiah 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: de
  text: Ach[a], sündige Nation, ein Volk, schwer beladen mit Schuld[b], Nachkommen von Übeltätern, Kinder, die Verderben stiften[c]! Sie haben Jahwe verlassen, den Heiligen Israels verachtet; sie haben ihm den Rücken gekehrt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wehe der sündigen Nation!“ Die hebräische Interjektion kann sowohl Klage als auch einen anklagenden Weheruf ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann sowohl das Unrecht als auch die daraus erwachsende Schuld bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Kinder, die verderblich handeln“ beziehungsweise „Kinder, die Zerstörung anrichten“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich etwa: „sie haben sich rückwärts abgewandt“. Die schwierige Wendung kann auch Entfremdung oder Abwendung ausdrücken: „sie haben sich abgewandt“ beziehungsweise „sie haben sich entfremdet und sind zurückgegangen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ach
  rationale: Die Interjektion kann Klage und anklagenden Weheruf zugleich ausdrücken. „Ach“ hält diese Spannung offen, während „Wehe“ den Ton stärker auf die Gerichtsankündigung festlegt.
- source_word: גּוֹי חֹטֵא
  choice: sündige Nation
  rationale: Das Partizip חֹטֵא charakterisiert die Nation hier adjektivisch. „Sündige Nation“ ist knapp, natürlich und bewahrt den kollektiven Vorwurf.
- source_word: עַם כֶּבֶד עָוֺן
  choice: ein Volk, schwer beladen mit Schuld
  rationale: Die Wendung bewahrt das Bild der Schwere. „Schuld“ kann im Deutschen sowohl das begangene Unrecht als auch die daraus erwachsende Schuldhaftigkeit anklingen lassen.
- source_word: זֶרַע מְרֵעִים
  choice: Nachkommen von Übeltätern
  rationale: זֶרַע bezeichnet kollektiv die Nachkommenschaft. Die Übersetzung erhält die familiäre und generationenübergreifende Bildsprache, ohne das wörtliche, hier unnatürliche „Same“ zu verwenden.
- source_word: בָּנִים מַשְׁחִיתִים
  choice: Kinder, die Verderben stiften
  rationale: Das Hifil-Partizip von שׁחת kann verderbliches, zerstörerisches oder korruptes Handeln bezeichnen. „Verderben stiften“ wahrt diese Bedeutungsbreite in natürlichem Deutsch.
- source_word: עָזְבוּ אֶת יְהוָה
  choice: Sie haben Jahwe verlassen
  rationale: עָזַב bedeutet hier „verlassen, aufgeben“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: נִאֲצוּ אֶת קְדֹושׁ יִשְׂרָאֵל
  choice: den Heiligen Israels verachtet
  rationale: נִאֲצוּ bezeichnet verächtliche Zurückweisung; der charakteristische jesajanische Titel קְדֹושׁ יִשְׂרָאֵל bleibt direkt erhalten.
- source_word: נָזֹרוּ אָחוֹר
  choice: sie sind zurückgewichen
  rationale: Die schwierige Wendung verbindet Abwendung beziehungsweise Entfremdung mit der Richtung „zurück“. „Zurückgewichen“ ist im Deutschen knapp und wahrt die Rückwärtsbewegung; alternative Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה und nicht den Titel אֲדֹנָי. „Jahwe“ macht den persönlichen Bundesnamen im Haupttext sichtbar.
- issue: Kollektive und familiäre Anklagesprache
  choice: Sowohl „Nation/Volk“ als auch „Nachkommen/Kinder“ beibehalten
  alternative: Die Bildfelder zu einer ausschließlich politischen oder genealogischen Bezeichnung vereinheitlichen
  rationale: Der Vers steigert die Anklage durch die Verbindung nationaler und familiärer Identitätsbegriffe. Eine Vereinheitlichung würde diese rhetorische und theologische Spannung abschwächen.
- issue: Bedeutung von נָזֹרוּ אָחוֹר
  choice: sie sind zurückgewichen
  alternative: sie haben sich abgewandt / sie haben sich entfremdet und sind zurückgegangen
  rationale: Die Form ist lexikalisch umstritten und kann Abwendung oder Entfremdung bezeichnen. Der Haupttext wahrt die durch אָחוֹר bezeichnete Rückwärtsbewegung, während die Fußnote die weitergehenden Möglichkeiten offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Eindringlichkeit. Die gereihte Anklage und die familiär-kollektive Bildsprache des Hebräischen bleiben erhalten; ungewöhnliche oder mehrdeutige Wendungen werden nicht stillschweigend konfessionell oder dogmatisch vereindeutigt.
