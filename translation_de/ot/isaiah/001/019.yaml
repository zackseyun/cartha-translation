base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
translation:
  language: de
  text: Wenn ihr willig seid und gehorcht[a], werdet ihr vom Guten des Landes essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hört“; das hebräische Wort kann ein Hören bezeichnen, das eine gehorsame Reaktion einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die übliche konditionale Konjunktion leitet den Bedingungssatz ein.
- source_word: תֹּאבוּ
  choice: ihr willig seid
  rationale: אבה bezeichnet die Bereitschaft oder Zustimmung; die prädikative Wiedergabe ist im Deutschen natürlich und bewahrt den Willensaspekt.
- source_word: וּשְׁמַעְתֶּם
  choice: und hört
  rationale: שׁמע kann hören, auf jemanden hören oder gehorchen bedeuten. „Hört“ bewahrt die konkrete hebräische Ausdrucksweise und lässt im Zusammenhang die geforderte gehorsame Reaktion erkennen.
- source_word: טוּב
  choice: das Gute
  rationale: Das Substantiv bezeichnet das Gute beziehungsweise den guten Ertrag; zusammen mit „des Landes“ bleibt das hebräische Bild erhalten.
- source_word: הָאָרֶץ
  choice: des Landes
  rationale: Im Bundes- und Gerichtskontext Jesajas ist das Land und sein Ertrag gemeint, nicht die gesamte Erde.
- source_word: תֹּאכֵלוּ
  choice: werdet ihr … essen
  rationale: Die konkrete Zukunftsaussage des Verbs אכל wird idiomatisch wiedergegeben und beschreibt den Genuss des Ertrags des Landes.
theological_decisions:
- issue: Bedeutung von שׁמע in der Bundesmahnung
  choice: hört
  alternative: gehorcht / gehorsam seid
  rationale: Das Verb bezeichnet hier mehr als bloßes akustisches Hören und schließt eine entsprechende Reaktion ein. Die Hauptfassung bewahrt dennoch die genuine lexikalische Weite; die Fußnote verdeutlicht den Gehorsamsaspekt, ohne ihn einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität des hebräischen Bedingungssatzes bleibt erhalten; „das Gute des Landes essen“ bewahrt das konkrete Bild und ist im Deutschen verständlich.
