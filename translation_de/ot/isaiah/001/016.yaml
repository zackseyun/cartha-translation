id: ISA.1.16
reference: Isaiah 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: de
  text: Wascht euch[a], macht euch rein! Schafft die Bosheit eurer Taten vor meinen Augen weg[b]! Hört auf, Böses zu tun!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigt euch.“ Das hebräische Verb verwendet das konkrete Bild des Waschens hier im Zusammenhang moralischer Reinigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Entfernt die Bosheit eurer Taten von vor meinen Augen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: Wascht euch
  rationale: Der Qal-Imperativ im Plural bezeichnet hier im Zusammenhang eine auf die Angesprochenen selbst bezogene Reinigung. „Wascht euch“ bewahrt das konkrete Bild und die eindringliche Aufforderung.
- source_word: הִזַּכּוּ
  choice: macht euch rein
  rationale: Der Hitpael-Imperativ fordert dazu auf, rein zu werden beziehungsweise sich rein zu machen. Die Formulierung ist modernes, natürliches Deutsch und hält den Parallelismus zu „Wascht euch“ aufrecht.
- source_word: הָסִירוּ
  choice: Schafft … weg
  rationale: Der Hifil-Imperativ bedeutet, etwas zu entfernen. „Schafft … weg“ gibt die energische Aufforderung idiomatisch wieder.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: die Bosheit eurer Taten
  rationale: רֹעַ bezeichnet das Böse beziehungsweise die Bosheit, מַעַלְלֵיכֶם die Taten der Angesprochenen. Die Wiedergabe erhält sowohl die moralische Bewertung als auch den Bezug auf ihr konkretes Handeln.
- source_word: מִנֶּגֶד עֵינָי
  choice: vor meinen Augen
  rationale: Die räumlich-bildhafte Wendung lautet wörtlich „von vor meinen Augen“. Im Deutschen verbindet sie sich natürlich mit „wegschaffen“ und bewahrt die anthropomorphe Bildsprache.
- source_word: חִדְלוּ הָרֵעַ
  choice: Hört auf, Böses zu tun
  rationale: חדל mit folgendem Infinitiv bedeutet „aufhören, etwas zu tun“. הָרֵעַ bezeichnet hier das Tun des Bösen; die deutsche Formulierung macht diese verbale Bedeutung klar.
theological_decisions:
- issue: Bildsprache moralischer Reinigung
  choice: Die Imperative „Wascht euch“ und „macht euch rein“ werden als bildhafte Aufforderung zu Umkehr und ethischer Reinigung beibehalten.
  alternative: Eine stärker kultisch klingende Wiedergabe wie „reinigt/heiligt euch“.
  rationale: Der unmittelbare Zusammenhang richtet sich gegen sündiges Handeln und fordert eine Änderung der Taten. Der Text verwendet Reinigungsbilder, legt aber hier keinen bestimmten Ritus oder eine spätere sakramentale Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer Folge kurzer, eindringlicher Imperative. Das konkrete Waschbild und die Wendung „vor meinen Augen“ bleiben erhalten; zugleich wird die letzte Aufforderung idiomatisch und eindeutig formuliert.
