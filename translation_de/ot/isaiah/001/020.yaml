id: ISA.1.20
reference: Isaiah 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם תְּמָאֲנ֖וּ וּ/מְרִיתֶ֑ם חֶ֣רֶב תְּאֻכְּל֔וּ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
translation:
  language: de
  text: Doch wenn ihr euch weigert und euch auflehnt, werdet ihr vom Schwert verzehrt[a]; denn der Mund Jahwes hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werdet ihr vom Schwert gegessen“. Die Formulierung bildet einen bewussten Gegensatz zum vorherigen Vers: Die Gehorsamen „essen das Gute des Landes“, die Widerspenstigen dagegen werden vom Schwert gegessen.'
    reason: Das hebräische Wortspiel mit Vers 19 und die ungewöhnliche Bildsprache sollen für deutschsprachige Leser erkennbar bleiben.
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die adversative Verknüpfung stellt die Warnung dem Versprechen in Vers 19 gegenüber und bewahrt zugleich die Bedingung.
- source_word: תְּמָאֲנוּ
  choice: ihr euch weigert
  rationale: מאן bezeichnet entschiedene Weigerung beziehungsweise Unwilligkeit; die reflexive deutsche Wendung ist natürlich und prägnant.
- source_word: וּמְרִיתֶם
  choice: und euch auflehnt
  rationale: מרה bezeichnet rebellisches, trotziges Widerstreben. „Sich auflehnen“ gibt den aktiven Widerstand wieder, ohne die Aussage konfessionell zuzuspitzen.
- source_word: חֶרֶב
  choice: vom Schwert
  rationale: Das konkrete prophetische Bild wird beibehalten; das Schwert kann zugleich metonymisch für gewaltsames Gericht stehen.
- source_word: תְּאֻכְּלוּ
  choice: werdet ihr … gefressen
  rationale: 'Das Passiv von אכל kehrt die Aussage aus Vers 19 bewusst um: Dort essen die Gehorsamen, hier werden die Widerspenstigen gegessen. „Gefressen“ bewahrt dieses drastische Bild und die Wortverbindung.'
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet und bekräftigt die vorangehende Warnung.
- source_word: פִּי יְהוָה
  choice: der Mund Jahwes
  rationale: Die konkrete anthropomorphe Redeweise des Hebräischen bleibt erhalten und hebt die Autorität des göttlichen Ausspruchs hervor.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt unterstreicht die verbindliche Gewissheit der prophetischen Erklärung; die Formulierung ist im modernen Standarddeutsch würdig und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt es als Gottes Eigennamen, während „der HERR“ die traditionelle Lesung als Titel wiedergibt.
- issue: Art des angekündigten Gerichts
  choice: das konkrete Bild vom fressenden Schwert bewahren
  alternative: durch Krieg vernichtet werden
  rationale: Der Text lässt das Schwert als Mittel beziehungsweise Bild des Gerichts stehen. Eine abstrakte Deutung als „Krieg“ würde das Bild und die Umkehrung des Verbs „essen“ aus Vers 19 abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Das drastische Bild „vom Schwert gefressen“ und die anthropomorphe Wendung „der Mund Jahwes“ werden bewusst erhalten.
