  text: כַּסְפֵּ֖/ךְ הָיָ֣ה לְ/סִיגִ֑ים סָבְאֵ֖/ךְ מָה֥וּל בַּ/מָּֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/022.yaml
  text: Your silver has become dross[a]; your wine is diluted with water.
translation:
  language: de
  text: Dein Silber ist zu Schlacke geworden, dein Wein ist mit Wasser verdünnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: dein Silber
  rationale: כֶּסֶף bezeichnet hier am ehesten das Metall Silber; zusammen mit „Schlacke“ bleibt so das Bild verdorbener Reinheit erhalten. Das feminine Singularsuffix richtet die Aussage an Jerusalem/Zion.
- source_word: הָיָה לְסִיגִים
  choice: ist zu Schlacke geworden
  rationale: Das Qatal von היה beschreibt den eingetretenen Zustand; לְסִיגִים bezeichnet die beim Läutern ausgeschiedenen unedlen Rückstände. Die deutsche Wendung gibt Ergebnis und Bild natürlich wieder.
- source_word: סָבְאֵךְ
  choice: dein Wein
  rationale: סֹבֶא bezeichnet ein berauschendes Getränk und kann im Kontext Wein meinen. „Wein“ ergibt im Deutschen ein klares, natürliches Bild der Verfälschung, ohne die Aussage unnötig technisch zu machen.
- source_word: מָהוּל בַּמָּיִם
  choice: mit Wasser verdünnt
  rationale: מהול bezeichnet hier das Vermischen beziehungsweise Verdünnen; ב ist instrumental bzw. assoziativ. „Mit Wasser verdünnt“ bringt den negativen Sinn der Qualitätsminderung idiomatisch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdige Standardsprache. Die parallelen Bilder von verunreinigtem Silber und verwässertem Wein bleiben erhalten; die feminine Anrede ist im Deutschen an den Possessivformen nicht sichtbar, ergibt sich aber aus dem Kontext.
