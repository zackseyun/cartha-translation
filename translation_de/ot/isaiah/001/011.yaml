id: ISA.1.11
reference: Isaiah 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: de
  text: Wozu soll mir die Menge eurer Schlachtopfer dienen? – spricht Jahwe.[a] Ich habe die Brandopfer von Widdern und das Fett gemästeter Tiere satt. Am Blut von Stieren, Lämmern und Ziegenböcken habe ich kein Gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Warum mir die Menge eurer Schlachtopfer?« Gemeint sein kann auch: »Was soll mir die Menge eurer Schlachtopfer?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: Wozu soll mir … dienen?
  rationale: Die hebräische Verbindung aus »warum/wozu?« und »mir« fragt rhetorisch nach Wert oder Nutzen der Opfer für Jahwe. Die deutsche Formulierung bewahrt diese Stoßrichtung, ohne ein Bedürfnis Gottes vorauszusetzen.
- source_word: רֹב זִבְחֵיכֶם
  choice: die Menge eurer Schlachtopfer
  rationale: רֹב bezeichnet die große Menge; זֶבַח meint hier spezifisch Schlachtopfer und nicht unterschiedslos jede Opferart.
- source_word: יֹאמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Redeeinleitung wird im Deutschen idiomatisch mit »spricht« wiedergegeben; der Gottesname erscheint als Jahwe.
- source_word: שָׂבַעְתִּי
  choice: Ich habe … satt
  rationale: Das Verb bezeichnet Sättigung bis zum Überdruss. »Satt haben« gibt den scharfen, ablehnenden Ton natürlich wieder.
- source_word: עֹלוֹת אֵילִים
  choice: Brandopfer von Widdern
  rationale: עֹלָה ist der übliche Ausdruck für das vollständig verbrannte Brandopfer; אֵילִים bezeichnet Widder.
- source_word: חֵלֶב מְרִיאִים
  choice: das Fett gemästeter Tiere
  rationale: חֵלֶב ist Opferfett; מְרִיאִים bezeichnet gut genährte beziehungsweise gemästete Tiere, ohne hier eine einzelne Tierart festzulegen.
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: Blut von Stieren, Lämmern und Ziegenböcken
  rationale: Die Reihe wird konkret wiedergegeben. עַתּוּדִים bezeichnet männliche Ziegen; כְבָשִׂים kann Schafe beziehungsweise Lämmer meinen und wird im Opferkontext als »Lämmer« übersetzt.
- source_word: לֹא חָפָצְתִּי
  choice: habe ich kein Gefallen
  rationale: חפץ umfasst Gefallen, Freude und Verlangen. Die gewählte Formulierung wahrt die wertende Ablehnung, ohne sie als absolutes Verbot aller Opfer zu überdeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Ablehnung der Opfer
  choice: konkrete Aussage des Verses ohne erklärenden Zusatz
  alternative: ausdrückliche Einschränkung auf heuchlerische oder unwürdige Opfer
  rationale: Der unmittelbare Wortlaut äußert Gottes Überdruss und Missfallen, nennt in diesem Vers aber nicht ausdrücklich die präzisierende Ursache. Diese Spannung bleibt im Haupttext erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schlachtopfer« bewahrt die kultische Spezifik von זְבָחִים; »satt haben« vermittelt die kräftige Bildsprache des Hebräischen. Der Gedankenstrich markiert die eingeschobene prophetische Redeeinleitung.
