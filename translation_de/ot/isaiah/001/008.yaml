base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: de
  text: Und die Tochter Zion[a] ist übrig geblieben wie eine Schutzhütte im Weinberg, wie eine Hütte im Gurkenfeld[b], wie eine belagerte Stadt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Tochter Zions“. Die Wendung personifiziert Zion beziehungsweise Jerusalem als Tochter.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Melonenfeld“ oder „Feld mit Kürbisgewächsen“. Das hebräische Wort kann ein mit Gurken oder ähnlichen rankenden Feldfrüchten bestelltes Feld bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Möglicherweise: „wie eine bewachte Stadt“; im Zusammenhang passt „belagerte Stadt“ jedoch am besten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: Und … ist übrig geblieben
  rationale: Das Nifal von נותר bezeichnet das Zurück- oder Übrigbleiben nach einer Verwüstung. „Ist übrig geblieben“ gibt sowohl das Fortbestehen als auch die vorausgegangenen Verluste natürlich wieder.
- source_word: בַת צִיּוֹן
  choice: die Tochter Zion
  rationale: Die hebräische Konstruktverbindung personifiziert Zion beziehungsweise Jerusalem als Tochter. Die knappe Form bewahrt das poetische Bild, ohne es durch eine erklärende Umschreibung zu ersetzen.
- source_word: כְּסֻכָּה
  choice: wie eine Schutzhütte
  rationale: סֻכָּה bezeichnet eine einfache, vorübergehend errichtete Hütte oder Schutzstelle. „Schutzhütte“ vermittelt ihre Funktion und passt zum Bild eines vereinzelten, verletzlichen Unterstands im Weinberg.
- source_word: בְכָרֶם
  choice: im Weinberg
  rationale: Die Ortsangabe entspricht dem hebräischen Singular und bewahrt das konkrete landwirtschaftliche Bild.
- source_word: כִּמְלוּנָה
  choice: wie eine Hütte
  rationale: מְלוּנָה bezeichnet hier eine vorübergehende Unterkunft auf einem Feld. „Hütte“ ist im Deutschen natürlich und lässt Zweck und genaue Bauart offen.
- source_word: בְמִקְשָׁה
  choice: im Gurkenfeld
  rationale: מִקְשָׁה bezeichnet ein bestelltes Feld mit Gurken oder verwandten rankenden Feldfrüchten. „Gurkenfeld“ ist eine gut belegte konkrete Wiedergabe; die weitere mögliche Bedeutung wird in einer Fußnote genannt.
- source_word: כְּעִיר נְצוּרָה
  choice: wie eine belagerte Stadt
  rationale: Das passive Partizip נְצוּרָה wird im Zusammenhang von Verwüstung und Bedrängnis am natürlichsten als „belagert“ verstanden. Die mögliche Deutung als „bewacht“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Personifikation Zions
  choice: die Tochter Zion
  alternative: Jerusalem; die Bevölkerung Zions
  rationale: Der Ausgangstext gebraucht eine prophetisch-poetische Personifikation. Sie wird beibehalten, statt sie auf eine einzelne sachliche Referenz zu verengen.
- issue: Deutung von נְצוּרָה
  choice: belagerte Stadt
  alternative: bewachte Stadt
  rationale: „Belagert“ entspricht dem Gerichtskontext und dem Bild zunehmender Bedrängnis; die lexikalisch mögliche Alternative wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Bildfolge. Die parallelen Vergleiche und die Personifikation bleiben erhalten; seltene oder mehrdeutige landwirtschaftliche und militärische Begriffe werden knapp im Fußnotenapparat erläutert.
