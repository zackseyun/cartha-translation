id: ISA.1.31
reference: Isaiah 1:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה הֶ/חָסֹן֙ לִ/נְעֹ֔רֶת וּ/פֹעֲל֖/וֹ לְ/נִיצ֑וֹץ וּ/בָעֲר֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וְ/אֵ֥ין מְכַבֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: de
  text: Der Starke wird zu Zunder[a] und sein Werk zum Funken. Beide werden miteinander verbrennen, und niemand wird sie löschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet lose, leicht entzündliche Fasern, besonders Flachswerg.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  choice: der Starke
  rationale: Die substantivierte Bezeichnung meint einen starken oder mächtigen Menschen. „Der Starke“ bewahrt die knappe, persönliche Form des Hebräischen, ohne den Sinn auf Reichtum oder gesellschaftliche Stellung einzuengen.
- source_word: לִנְעֹרֶת
  choice: zu Zunder
  rationale: Das Wort bezeichnet abgeschüttelte beziehungsweise lose Pflanzen- oder Flachsfasern, die leicht Feuer fangen. „Zunder“ vermittelt diese Funktion im heutigen Deutsch klar; die genauere Sachbedeutung steht in der Fußnote.
- source_word: וּפֹעֲלוֹ
  choice: und sein Werk
  rationale: פֹּעַל kann eine Tat, Arbeit oder deren Erzeugnis bezeichnen. „Sein Werk“ erhält diese Bedeutungsbreite und bezieht das Suffix natürlich auf den zuvor genannten Starken.
- source_word: לְנִיצוֹץ
  choice: zum Funken
  rationale: Das Substantiv bezeichnet einen Funken oder glühenden Feuerpartikel. „Funken“ bildet mit „Zunder“ das beabsichtigte Brandbild unmittelbar ab.
- source_word: וּבָעֲרוּ
  choice: werden ... verbrennen
  rationale: Das Verb bezeichnet Brennen beziehungsweise durch Feuer verzehrt werden. „Verbrennen“ klingt hier natürlich und lässt sowohl den Vorgang als auch die vernichtende Wirkung erkennen.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: Beide werden miteinander
  rationale: Die Formulierung betont, dass der Starke und sein Werk dasselbe Schicksal erleiden. „Beide ... miteinander“ gibt diese gemeinsame Vernichtung knapp wieder.
- source_word: וְאֵין מְכַבֶּה
  choice: und niemand wird sie löschen
  rationale: Die Konstruktion mit אֵין und Partizip besagt, dass keiner da ist, der das Feuer löscht. Das Objekt „sie“ wird im Deutschen aus den beiden zuvor Genannten ergänzt.
theological_decisions:
- issue: Bezug des singularischen Possessivsuffixes in וּפֹעֲלוֹ
  choice: „sein Werk“ bezieht sich auf den Starken; Mensch und Werk verfallen gemeinsam dem Gericht.
  alternative: Das Suffix könnte kollektiv verstanden werden und auf die Werke der Mächtigen als Gruppe zielen.
  rationale: Das hebräische Suffix im Singular verweist am natürlichsten auf das unmittelbar vorausgehende singularische הֶחָסֹן. Dadurch bleibt der poetische Zusammenhang von Person und Werk erhalten, ohne „Werk“ unnötig auf Tat oder Erzeugnis festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Bildsprache. „Der Starke“ wahrt die substantivierte Personenbezeichnung; „Zunder“ ist allgemein verständlich, während die Fußnote den konkreten Hintergrund aus der Faserverarbeitung erläutert.
