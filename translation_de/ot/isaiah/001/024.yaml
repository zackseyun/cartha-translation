    issue: „Wehe!“ für הוֹי
    rationale: „Wehe!“ kann im Deutschen unmittelbar einen gegen andere gerichteten Weheruf markieren. Das hebräische הוֹי ist hier eine ausdrucksstarke, semantisch nicht eindeutig festgelegte Interjektion; „Ach!“ ist weniger einengend.
  - severity: medium
    issue: „Genugtuung“ für אֶנָּחֵם
    rationale: „Genugtuung“ kann nahe an Vergeltungsbefriedigung liegen und damit mit וְאִנָּקְמָה („und ich werde mich rächen“) zusammenfallen. Der Kontext und die Konstruktion mit מן lassen sich genauer als Erleichterung/Entlastung von Gegnern wiedergeben.
