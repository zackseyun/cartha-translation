id: ISA.1.24
reference: Isaiah 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: de
  text: 'Darum lautet der Ausspruch des Herrn[a], Jahwes der Heerscharen[b], des Mächtigen Israels: »Ach! Ich werde mir Erleichterung von meinen Widersachern verschaffen[c] und mich an meinen Feinden rächen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Orakelspruch des Herrn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwes der Heere“. Traditionell: „Jahwe Zebaot“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Ich werde Trost über meine Widersacher finden“ oder „Ich werde mich von meinen Widersachern erleichtern“. Gemeint ist eine durch das Gericht erlangte Entlastung; sie ist von der folgenden Racheaussage zu unterscheiden. Für „Ach!“ auch: „Ha!“ oder „Wehe!“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und klingt im modernen Deutsch natürlich und gewichtig.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Gibt die feierliche prophetische Verkündigungsformel wieder; die Alternative „Orakelspruch“ wird in einer Fußnote genannt.
- source_word: הָאָדוֹן
  choice: der Herr
  rationale: Bewahrt den bestimmten göttlichen Herrschertitel und unterscheidet ihn vom unmittelbar folgenden Eigennamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als göttlichen Eigennamen wieder, statt es durch einen weiteren Herrentitel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt die militärisch-kosmische Bildsprache des traditionellen deutschen Ausdrucks; „Heere“ bleibt als transparentere Alternative in der Fußnote erhalten.
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: der Mächtige Israels
  rationale: Gibt den göttlichen Titel als substantivierte Bezeichnung wieder und betont Stärke und Macht.
- source_word: הוֹי
  choice: Wehe!
  rationale: Bewahrt die starke emotionale Interjektion. Im Kontext kann sie Entschlossenheit, Drohung oder Klage anklingen lassen, ohne diese Nuance vollständig festzulegen.
- source_word: אֶנָּחֵם מִצָּרַי
  choice: Ich werde mir Genugtuung an meinen Widersachern verschaffen
  rationale: Gibt das idiomatische Niphal von נחם hier als durch Gericht erlangte Entlastung oder Befriedigung wieder, ohne es mit dem folgenden Racheverb gleichzusetzen.
- source_word: וְאִנָּקְמָה מֵאוֹיְבָי
  choice: und mich an meinen Feinden rächen
  rationale: Bewahrt den entschlossenen, reflexiven Sinn und entspricht natürlichem deutschem Sprachgebrauch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ unterscheidet ihn vom vorausgehenden Titel הָאָדוֹן („der Herr“) und vermeidet eine künstliche Verdoppelung.
- issue: Verhältnis von göttlicher Genugtuung und Rache
  choice: zwei verwandte, aber getrennt wiedergegebene Handlungen
  alternative: beide Verben als einheitliche Vergeltungsaussage zusammenziehen
  rationale: Der hebräische Text verwendet zwei verschiedene Verben. Die Übersetzung bewahrt die Spannung zwischen erlangter Entlastung beziehungsweise Genugtuung und vollzogener Rache.
- issue: Emotionale Färbung von הוֹי
  choice: Wehe!
  alternative: Ach! / Ha!
  rationale: Die Interjektion ist mehrdeutig. „Wehe!“ trägt die bedrohliche und feierliche Kraft des Gerichtskontexts, während die Fußnote mögliche deutsche Nuancierungen offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Feierlichkeit. „Ausspruch“ ist zugänglicher als „Orakel“, „Heerscharen“ bewahrt jedoch bewusst die erhabene und bildhafte Titelform. Die Wiederholung „Widersacher/Feinde“ folgt dem hebräischen Parallelismus.
