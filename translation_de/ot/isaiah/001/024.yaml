revisions:
- from: 'Darum lautet der Ausspruch des Herrn[a], Jahwes der Heerscharen[b], des Mächtigen Israels: »Wehe! Ich werde mir Genugtuung an meinen Widersachern verschaffen[c] und mich an meinen Feinden rächen.«'
  to: 'Darum lautet der Ausspruch des Herrn[a], Jahwes der Heerscharen[b], des Mächtigen Israels: »Ach! Ich werde mir Erleichterung von meinen Widersachern verschaffen[c] und mich an meinen Feinden rächen.«'
  rationale: Die Überarbeitung erhält die feierliche Titelfolge und den hebräischen Parallelismus, legt aber weder die Interjektion הוֹי noch die Bedeutung von נחם unnötig eng fest. Sie unterscheidet klar zwischen der durch das Gericht erlangten Erleichterung und der anschließenden Rachehandlung.
