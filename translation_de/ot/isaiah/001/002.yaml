  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: de
  text: 'Hört, ihr Himmel, und hör zu, Erde, denn Jahwe hat gesprochen: »Kinder[a] habe ich großgezogen und erhöht[b], doch sie haben sich gegen mich aufgelehnt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Söhne“. Gemeint ist hier das Volk als Ganzes in seiner Beziehung zu Jahwe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu Ansehen gebracht“. Das zweite Verb geht über das bloße Aufziehen hinaus und kann Förderung oder Erhöhung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמַיִם
  choice: Hört, ihr Himmel
  rationale: Der pluralische Imperativ und die direkte Anrede werden in natürlichem, gehobenem Deutsch bewahrt.
- source_word: וְהַאֲזִינִי אֶרֶץ
  choice: und horch auf, du Erde
  rationale: Der feminine Singular des Imperativs entspricht der personifizierten Erde; „horch auf“ gibt die nachdrückliche Aufforderung poetisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet hier die maßgebliche, bereits ergangene Rede, die im folgenden Zitat entfaltet wird.
- source_word: בָּנִים
  choice: Kinder
  rationale: Das maskuline Pluralwort bezeichnet hier im Bild einer Eltern-Kind-Beziehung das Volk als Ganzes; „Kinder“ trifft den gemeinten Umfang.
- source_word: גִּדַּלְתִּי
  choice: habe ich großgezogen
  rationale: Im Zusammenhang mit Kindern bezeichnet das Verb ihr Aufziehen und Heranwachsenlassen.
- source_word: וְרוֹמַמְתִּי
  choice: und groß gemacht
  rationale: Die Formulierung erhält gegenüber „großgezogen“ den zusätzlichen Gedanken des Erhöhens, Förderns oder Zu-Ansehen-Bringens, ohne ihn einseitig festzulegen.
- source_word: פָּשְׁעוּ בִי
  choice: sie haben sich gegen mich aufgelehnt
  rationale: Das Verb bezeichnet bewusste Rebellion gegen rechtmäßige Autorität; die deutsche Wendung bewahrt die relationale und politische Spannung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen; die Transliteration wahrt diesen Unterschied gegenüber einem Herrschaftstitel.
- issue: Umfang von בָּנִים
  choice: Kinder
  alternative: Söhne
  rationale: Obwohl das hebräische Wort grammatisch maskulin ist, bezieht es sich hier kollektiv auf das ganze Volk. „Kinder“ wahrt das Abstammungs- und Familienbild, ohne den Bezug auf Männer zu beschränken.
- issue: Bedeutungsnuance von רוֹמַמְתִּי
  choice: groß gemacht
  alternative: erhöht / emporgebracht
  rationale: Das Verb kann Erhöhung, Förderung oder Ehrung ausdrücken. Die gewählte Formulierung lässt diese Bedeutungsbreite offen und vermeidet es, den Ausdruck lediglich als Wiederholung von „großgezogen“ zu behandeln.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit direkter kosmischer Anrede. „Hört … horch auf“ bewahrt den hebräischen Parallelismus, während die wechselnden Numeri der angeredeten Größen im Deutschen erkennbar bleiben. Das Satzzeichen vor der Gottesrede macht den Übergang zur direkten Rede deutlich.
