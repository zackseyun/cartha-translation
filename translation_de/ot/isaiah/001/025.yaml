  text: וְ/אָשִׁ֤יבָה יָדִ/י֙ עָלַ֔יִ/ךְ וְ/אֶצְרֹ֥ף כַּ/בֹּ֖ר סִיגָ֑יִ/ךְ וְ/אָסִ֖ירָה כָּל בְּדִילָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: de
  text: Ich werde meine Hand gegen dich wenden[a], deine Schlacken wie mit Lauge[b] ausschmelzen und all dein unedles Metall[c] entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über dich ausstrecken“. Die hebräische Wendung kann strafendes Handeln oder einen reinigenden Eingriff einleiten; das Bild des Läuterns verbindet hier Gericht und Reinigung.'
    reason: lexical_alternative
  - marker: b
    text: '„Lauge“ bezeichnet hier ein alkalisches Reinigungsmittel. Auch möglich: „mit Alkali“ oder „wie mit Seife“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich möglicherweise: „all dein Zinn“; gemeint sein können auch allgemein minderwertige metallische Beimischungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה יָדִי עָלַיִךְ
  choice: Ich werde meine Hand gegen dich wenden
  rationale: Die Wendung mit שוב im Hifil und „Hand“ bezeichnet hier Gottes erneutes bzw. gezieltes Eingreifen. „Gegen dich“ gibt im Gerichtskontext die gegnerische Stoßrichtung wieder, während die Fußnote die mögliche Nuance „über dich“ und den reinigenden Zweck offenhält.
- source_word: וְאֶצְרֹף
  choice: ausschmelzen
  rationale: צרף gehört zur Metallschmelze und bezeichnet das Läutern durch Abscheiden von Verunreinigungen. „Ausschmelzen“ verbindet den Vorgang mit der im Kontext beabsichtigten Entfernung.
- source_word: כַּבֹּר
  choice: wie mit Lauge
  rationale: בֹּר bezeichnet ein alkalisches Reinigungsmittel. Die Formulierung bewahrt das vergleichende כ und ist im Deutschen verständlich, ohne die schwierige Verbindung von Reinigungs- und Metallbild zu glätten.
- source_word: סִיגָיִךְ
  choice: deine Schlacken
  rationale: סיגים bezeichnet beim Läutern ausgeschiedene Verunreinigungen beziehungsweise Schlacke. Der Plural „Schlacken“ bewahrt die Form und das metallurgische Bild.
- source_word: וְאָסִירָה
  choice: und … entfernen
  rationale: Das Hifil von סור bedeutet „wegnehmen, entfernen“ und beschreibt hier die vollständige Beseitigung der Beimischungen.
- source_word: כָּל בְּדִילָיִךְ
  choice: all dein unedles Metall
  rationale: בדיל kann konkret „Zinn“ oder im Läuterungszusammenhang minderwertige metallische Beimischung bezeichnen. „Unedles Metall“ erhält die allgemeinere Bedeutung und passt zur Parallele mit den Schlacken.
theological_decisions:
- issue: Art des göttlichen Handelns
  choice: Gerichtliches Eingreifen mit reinigendem Ziel
  alternative: Entweder ausschließlich vernichtendes Gericht oder ausschließlich sanfte Wiederherstellung
  rationale: „Meine Hand gegen dich wenden“ bringt die Härte des Gerichts zum Ausdruck; Ausschmelzen und Entfernen beschreiben zugleich Läuterung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das metallurgische Bild bleibt konkret erhalten; weniger geläufige oder semantisch offene Begriffe werden knapp in Fußnoten erläutert.
