  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: de
  text: 'Kommt doch, lasst uns miteinander rechten[a], spricht Jahwe: Wenn auch eure Sünden wie Scharlach sind, werden sie weiß wie Schnee; wenn sie rot wie Karmesin sind[b], werden sie wie Wolle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „lasst uns die Sache klären“, „lasst uns den Streit austragen“ oder „lasst uns die Sache entscheiden“. Das hebräische Verb hat sowohl dialogische als auch rechtliche Anklänge.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „wie Wurmscharlach“ oder „wie Scharlachfarbstoff“. Der Ausdruck ist mit der Schildlaus und dem daraus bzw. mit ihr verbundenen kräftig roten Farbstoff assoziiert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: Kommt doch
  rationale: Der Imperativ von הלך dient hier als eindringliche Einladung bzw. Aufforderung; נָא verleiht ihr einen bittenden oder dringlichen Ton. „Kommt doch“ ist im modernen Deutschen natürlich und bewahrt diese Nuance.
- source_word: וְנִוָּכְחָה
  choice: lasst uns die Sache miteinander klären
  rationale: Die Niphal-Kohortativform von יכח bezeichnet das gemeinsame Erörtern, Austragen oder Entscheiden einer strittigen Sache und hat dialogische wie rechtliche Anklänge. Die gewählte Formulierung bleibt verständlich, ohne den forensischen Unterton auszuschließen.
- source_word: יֹאמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die hebräische Prophetenformel wird im Deutschen idiomatisch mit „spricht“ wiedergegeben. Der Gottesname יהוה erscheint als „Jahwe“.
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: Sind eure Sünden
  rationale: אִם leitet hier eine Bedingung ein, die im Zusammenhang zugleich einen einräumenden Sinn haben kann. Die deutsche uneingeleitete Konditionalform bewahrt diese Offenheit besser als das eindeutig konzessive „obwohl“.
- source_word: כַּשָּׁנִים
  choice: wie Scharlach
  rationale: שָׁנִים bezeichnet Scharlach bzw. scharlachfarbenen Farbstoff oder Stoff; „Scharlach“ bildet den kräftigen Rotton knapp und poetisch ab.
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: sollen sie weiß werden wie Schnee
  rationale: Die Verbform von לבן drückt das Weißwerden aus. „Sollen“ gibt hier die zugesagte bzw. festgesetzte Folge wieder, ohne den Vorgang der Verwandlung abzuschwächen.
- source_word: אִם יַאְדִּימוּ
  choice: sind sie rot
  rationale: Die Form von אדם beschreibt hier die intensive rote Färbung. Die knappe deutsche Zustandsaussage entspricht dem poetischen Parallelismus.
- source_word: כַּתּוֹלָע
  choice: wie Karmesin
  rationale: תּוֹלָע bezeichnet wörtlich den Wurm bzw. die Schildlaus, aus der der kräftig rote Farbstoff gewonnen wurde, und metonymisch die dadurch erzeugte Karmesinfarbe.
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: sollen sie wie Wolle werden
  rationale: Die Wiedergabe folgt dem Vergleich des Hebräischen, ohne „weiß“ im zweiten Halbvers ausdrücklich zu ergänzen; die Farbe ergibt sich aus dem Parallelismus mit dem Schnee.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedingter oder einräumender Sinn von אִם
  choice: offene deutsche Konditionalform „Sind …, sollen …“
  alternative: „Obwohl eure Sünden … sind, werden …“
  rationale: אִם kann im Zusammenhang einräumend verstanden werden, ist grammatisch jedoch eine Konditionalpartikel. Die Übersetzung bewahrt die Spannung, ohne Gottes Zusage als bloß unsicher darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die Rechts- und Gesprächssprache der Einladung wird verständlich formuliert und in der Fußnote genauer entfaltet. Die beiden אִם-Sätze bleiben in ihrer bedingten und zugleich einräumenden Spannung erhalten.
