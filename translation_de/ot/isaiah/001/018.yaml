  terminology: „Jahwe“ entspricht der vorgegebenen Entscheidung zur Wiedergabe des Tetragramms. „Scharlach“ und „Karmesin“ geben die parallelen roten Farbbezeichnungen treffend wieder. Die Fußnote zu תּוֹלָע sollte das mögliche Missverständnis vermeiden, der Farbstoff sei unmittelbar aus einer Schildlaus „gewonnen“ worden; gemeint ist die mit dem Insekt verbundene Färbung.
