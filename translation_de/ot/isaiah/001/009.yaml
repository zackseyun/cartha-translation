source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: de
  text: Hätte Jahwe der Heerscharen uns nicht einen ganz kleinen Rest[a] übrig gelassen, wären wir wie Sodom geworden, hätten wir Gomorra geglichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns nicht einige wenige Überlebende bewahrt“.'
    reason: 'Lexikalische Alternative: שָׂרִיד kann einen verbliebenen Rest oder kollektiv Überlebende bezeichnen; הוֹתִיר kann entsprechend auch mit „bewahren“ wiedergegeben werden.'
lexical_decisions:
- source_word: לוּלֵי
  choice: Hätte … nicht
  rationale: Die Konstruktion leitet eine irreale Bedingung der Vergangenheit ein; der deutsche Konjunktiv II gibt sie natürlich und präzise wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ wahrt die Weite des Titels, ohne ihn ausschließlich auf menschliche Armeen einzuengen.
- source_word: הוֹתִיר לָנוּ
  choice: uns … übrig gelassen
  rationale: Der Hifil von יתר bezeichnet hier das Zurück- beziehungsweise Übriglassen; die deutsche Wendung verbindet sich idiomatisch mit „Rest“.
- source_word: שָׂרִיד כִּמְעָט
  choice: einen ganz kleinen Rest
  rationale: שָׂרִיד ist grammatisch Singular, kann hier aber kollektiv den verbliebenen Teil bezeichnen; כִּמְעָט hebt dessen äußerst geringen Umfang hervor.
- source_word: כִּסְדֹם הָיִינוּ
  choice: wären wir wie Sodom geworden
  rationale: Die Wiedergabe drückt den infolge der irrealen Bedingung nicht eingetretenen Zustand aus und bewahrt den Vergleich mit Sodom.
- source_word: לַעֲמֹרָה דָּמִינוּ
  choice: hätten wir Gomorra geglichen
  rationale: דמה bedeutet „gleichen, ähnlich sein“; eine vom vorherigen Halbvers unterschiedene Formulierung erhält den synonymen Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heere
  rationale: Die gewählte Form gibt das Tetragramm als persönlichen Namen wieder und lässt den umfassenden Sinn von צְבָאוֹת offen, statt ihn auf irdische Streitkräfte zu verengen.
- issue: Bedeutung des Ausdrucks שָׂרִיד כִּמְעָט
  choice: einen ganz kleinen Rest
  alternative: einige wenige Überlebende
  rationale: „Rest“ bewahrt die prophetische Rest-Terminologie, während die Fußnote die ebenso mögliche konkrete Deutung als Überlebende sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Bedingungssatz wird idiomatisch mit Konjunktiv II formuliert; die beiden parallelen Aussagen bleiben durch „geworden“ und „geglichen“ sprachlich unterscheidbar.
