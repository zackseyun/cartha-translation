  source_fidelity: Die Übersetzung gibt die irreale Bedingung von לוּלֵי präzise mit dem Konjunktiv II wieder. „Jahwe der Heerscharen“ entspricht יהוה צבאות, ohne den Bedeutungsumfang von צבאות unzulässig auf menschliche Truppen zu verengen. „uns ... einen ganz kleinen Rest übrig gelassen“ bildet הותיר לנו שריד כמעט sachgerecht ab; „Rest“ kann wie das hebräische Singularwort kollektiv verstanden werden. Die beiden Vergleichsaussagen zu Sodom und Gomorra sowie die leicht variierte Parallelität von היה und דמה bleiben erhalten.
