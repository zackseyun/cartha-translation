  terminology: „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. „Heerscharen“ und „Rest“ sind treffende, etablierte Begriffe; „Gomorra“ entspricht der deutschen Namensform. Die Fußnote bietet eine echte lexikalische Alternative, ohne den Haupttext dogmatisch einzuengen.
