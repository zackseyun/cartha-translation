  source_fidelity: Die Übersetzung gibt die fortdauernde Unterlassungsaufforderung von לֹא תוֹסִיפוּ הָבִיא mit »Bringt nicht länger« zutreffend wieder. »wertlose Speisopfer«, »Räucherwerk«, »Neumond und Sabbat« sowie »das Einberufen einer Versammlung« entsprechen dem kultischen Kontext und den einzelnen hebräischen Ausdrücken. Der knappe, syntaktisch spannungsvolle Schlusssatz wird nicht unzulässig aufgelöst.
