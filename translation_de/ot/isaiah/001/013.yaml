id: ISA.1.13
reference: Isaiah 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: de
  text: Bringt nicht länger wertlose Speisopfer[a]! Räucherwerk ist mir ein Gräuel. Neumond und Sabbat, das Einberufen einer Versammlung – Frevel und Festversammlung kann ich nicht ertragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »nichtige Speisopfer« oder »leere Opfergaben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist knapp und kann auch bedeuten: »Frevel bei einer Festversammlung kann ich nicht ertragen.« Damit wird möglicherweise die Unvereinbarkeit von bösem Handeln und gottesdienstlicher Versammlung betont.'
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: bringt nicht länger
  rationale: Die Verbindung von יסף im Hifil mit einem Infinitiv bezeichnet die Fortsetzung einer Handlung. »Nicht länger bringen« gibt das Verbot natürlich und mit seinem wiederholten Charakter wieder.
- source_word: מִנְחַת שָׁוְא
  choice: wertlose Speisopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang gewöhnlich ein Speisopfer; שָׁוְא trägt die Bedeutung von Nichtigkeit, Leere oder Wertlosigkeit. Die Wiedergabe bewahrt sowohl die kultische Bestimmtheit als auch die prophetische Verurteilung.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Substantiv bezeichnet Räucherwerk beziehungsweise Weihrauch als Opfergabe. »Räucherwerk« passt zum kultischen Zusammenhang und ist im modernen Deutsch verständlich.
- source_word: תּוֹעֵבָה הִיא לִי
  choice: ist mir ein Gräuel
  rationale: תּוֹעֵבָה ist eine starke Bezeichnung für etwas Verabscheuungswürdiges. »Ein Gräuel« erhält die Schärfe und den würdigen biblischen Ton.
- source_word: חֹדֶשׁ
  choice: Neumond
  rationale: Im kultischen Kalender bezeichnet חֹדֶשׁ die Feier des Neumonds.
- source_word: שַׁבָּת
  choice: Sabbat
  rationale: »Sabbat« ist die etablierte und eindeutige deutsche Wiedergabe des wöchentlichen Ruhe- und Gottesdiensttages.
- source_word: קְרֹא מִקְרָא
  choice: das Einberufen einer Versammlung
  rationale: Die Verbindung des Verbs קרא mit dem verwandten Substantiv מִקְרָא hebt das Zusammenrufen hervor. Die deutsche Formulierung bleibt dem Ausdruck nahe, ohne unnatürlich zu wirken.
- source_word: לֹא אוּכַל
  choice: kann ich nicht ertragen
  rationale: Obwohl das Verb wörtlich das Vermögen bezeichnet, drückt es hier aus, dass etwas für Gott unerträglich ist.
- source_word: אָוֶן
  choice: Frevel
  rationale: אָוֶן kann Unheil, Bosheit oder schuldhaftes Unrecht bezeichnen. »Frevel« bewahrt hier das moralische Gewicht und passt zur prophetischen Anklage.
- source_word: וַעֲצָרָה
  choice: und Festversammlung
  rationale: עֲצָרָה bezeichnet eine feierliche kultische Versammlung. »Festversammlung« macht ihren gottesdienstlichen und festlichen Charakter deutlich.
theological_decisions:
- issue: Verhältnis zwischen Frevel und gottesdienstlicher Versammlung im Schlusssatz
  choice: Frevel und Festversammlung kann ich nicht ertragen
  alternative: Frevel bei einer Festversammlung kann ich nicht ertragen
  rationale: Der hebräische Text stellt אָוֶן und עֲצָרָה knapp nebeneinander, ohne eine Präposition auszudrücken. Die koordinierende Wiedergabe bewahrt diese Kürze und Spannung; die mögliche Aussage von der Unvereinbarkeit sündigen Handelns mit der Gottesdienstversammlung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter kultischer Terminologie. Der Gedankenstrich bildet die abrupte, knappe Reihung des Hebräischen ab. Die Mehrdeutigkeit des Schlusssatzes wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengehalten.
