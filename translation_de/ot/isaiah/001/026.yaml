source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: de
  text: Und ich werde deine Richter wiederherstellen wie früher und deine Ratgeber wie am Anfang. Danach wird man dich »Stadt der Gerechtigkeit«[a] nennen, eine treue Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stadt der Rechtschaffenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Und ich werde … wiederherstellen
  rationale: 'Der Hifil von שוב hat hier kausative Bedeutung: Gott stellt die frühere, rechtmäßige Ordnung wieder her. »Wiederherstellen« trifft den Zusammenhang besser als das wörtlichere »zurückbringen«.'
- source_word: שֹׁפְטַיִךְ
  choice: deine Richter
  rationale: שֹׁפֵט bezeichnet gewöhnlich einen Richter, kann im Zusammenhang aber auch Leitungs- und Regierungsaufgaben einschließen. »Richter« wahrt den konkreten lexikalischen Sinn.
- source_word: כְּבָרִאשֹׁנָה
  choice: wie in der ersten Zeit
  rationale: Die Wendung verweist auf einen früheren, als vorbildlich gedachten Zustand, ohne eine bestimmte geschichtliche Epoche festzulegen.
- source_word: וְיֹעֲצַיִךְ
  choice: deine Ratgeber
  rationale: Das Wort bezeichnet Personen, die Rat erteilen. »Ratgeber« ist im Zusammenhang städtischer Führung klar und bildet ein natürliches Gegenstück zu »Richter«.
- source_word: כְּבַתְּחִלָּה
  choice: wie am Anfang
  rationale: Die Formulierung bewahrt den Parallelismus zur »ersten Zeit« und gibt den zeitlichen Vergleich knapp und natürlich wieder.
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung markiert die zeitliche beziehungsweise folgerichtige Folge der angekündigten Wiederherstellung.
- source_word: יִקָּרֵא לָךְ
  choice: wird man dich … nennen
  rationale: Der Nifal von קרא bezeichnet das Genanntwerden. Die unpersönliche deutsche Form bewahrt die direkte Anrede der als weiblich personifizierten Stadt.
- source_word: עִיר הַצֶּדֶק
  choice: Stadt der Gerechtigkeit
  rationale: Die Genitivfügung wahrt die substantivische Ausdrucksweise des Hebräischen. »Gerechtigkeit« umfasst hier sowohl gerechte Rechtsprechung als auch umfassende moralische Rechtschaffenheit.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: treue Stadt
  rationale: קִרְיָה ist ein poetisches Synonym für Stadt; נֶאֱמָנָה bezeichnet Treue und Verlässlichkeit. Die Wiedergabe nimmt zugleich den Kontrast zu Jesaja 1,21 auf.
theological_decisions:
- issue: Bedeutungsumfang von צֶדֶק im Zusammenhang der Wiederherstellung der Stadt
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: »Gerechtigkeit« kann im Deutschen sowohl gerechte gesellschaftliche und richterliche Ordnung als auch moralisches Rechttun bezeichnen. »Rechtschaffenheit« betont stärker die moralische Qualität, würde aber den klaren politischen und rechtlichen Zusammenhang verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. Die direkte Anrede der personifizierten Stadt und die beiden ihr verliehenen Ehrennamen bleiben sichtbar; Anführungszeichen verdeutlichen die Namensgebung.
