source:
  edition: WLC
  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: de
  text: Deine Herrscher sind widerspenstig[a] und Verbündete von Dieben. Jeder von ihnen liebt Bestechung und jagt Zahlungen nach[b]. Dem Waisenkind verschaffen sie kein Recht[c], und die Rechtssache der Witwe gelangt nicht vor sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Deine Fürsten sind rebellisch.'
    reason: Bewahrt die mögliche Wiedergabe von שַׂר als »Fürst« und von סוֹרְרִים als »rebellisch«.
  - marker: b
    text: 'Oder: jagt Vergütungen oder Belohnungen nach. Das hebräische Wort bezeichnet Zahlungen oder Gegenleistungen, hier wahrscheinlich im Zusammenhang mit Korruption.'
    reason: Die genaue Bedeutung des seltenen Ausdrucks שַׁלְמֹנִים ist nicht eindeutig.
  - marker: c
    text: 'Oder: Sie sprechen dem Waisenkind kein Recht.'
    reason: Die Alternative bildet den gerichtlichen Sinn von שׁפט enger ab, während der Haupttext die beabsichtigte Wirkung des Rechtsprechens natürlich ausdrückt.
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: deine Herrscher
  rationale: שַׂר bezeichnet einen führenden Amtsträger, Herrscher oder Fürsten. „Herrscher“ ist im heutigen Deutsch verständlich und bewahrt den politischen Bezug.
- source_word: סוֹרְרִים
  choice: Aufrührer
  rationale: Das Wort bezeichnet hartnäckig Widerspenstige oder Rebellen. Das Substantiv „Aufrührer“ erhält die zugespitzte Anklage und passt zur parallelen Bezeichnung „Diebesgesellen“.
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: und Diebesgesellen
  rationale: Die Wendung bezeichnet Gefährten oder Verbündete von Dieben. „Diebesgesellen“ ist knapp, verständlich und gibt die vorgeworfene Komplizenschaft wieder.
- source_word: כֻּלּוֹ
  choice: jeder von ihnen
  rationale: Die grammatisch singularische Form beschreibt die zuvor genannte Gruppe distributiv. „Jeder von ihnen“ macht deutlich, dass die Anklage ausnahmslos jeden Herrscher trifft.
- source_word: אֹהֵב שֹׁחַד
  choice: liebt Bestechung
  rationale: שֹׁחַד meint ein Bestechungsgeschenk beziehungsweise Bestechung. Die abstrakte deutsche Formulierung ist natürlich und bezeichnet die korrupte Praxis klar.
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: und jagt Zahlungen nach
  rationale: רֹדֵף drückt eifriges Verfolgen aus; שַׁלְמֹנִים kann Zahlungen, Vergütungen oder Belohnungen bezeichnen. „jagt … nach“ erhält die Eindringlichkeit, ohne die nicht völlig sichere Art der Zuwendung zu stark festzulegen.
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: Dem Waisenkind verschaffen sie kein Recht
  rationale: שׁפט bezeichnet im gerichtlichen Zusammenhang das Rechtsprechen beziehungsweise das Verschaffen von Recht. Die Formulierung macht verständlich, dass den Schutzlosen Gerechtigkeit verweigert wird.
- source_word: וְרִיב אַלְמָנָה
  choice: und die Rechtssache der Witwe
  rationale: רִיב kann einen Rechtsstreit, eine Klage oder einen Rechtsfall bezeichnen. „Rechtssache“ hält den gerichtlichen Zusammenhang fest.
- source_word: לֹא יָבוֹא אֲלֵיהֶם
  choice: gelangt nicht vor sie
  rationale: Wörtlich kommt die Rechtssache nicht zu ihnen. „vor sie gelangen“ gibt im Deutschen idiomatisch wieder, dass der Fall den zuständigen Herrschern nicht zur Verhandlung vorgelegt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Anklagesätze und die bildhafte Verfolgung unlauterer Zahlungen bleiben erhalten. „Waisenkind“ vermeidet die heute teils missverständliche beziehungsweise geschlechtlich markierte Form „Waise“ und bezeichnet die sozial schutzlose Person klar.
