base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: de
  text: Und wenn ihr eure Handflächen[a] ausbreitet, verberge ich meine Augen vor euch. Auch wenn ihr noch so viel betet, höre ich euch nicht[b]. Eure Hände sind voller Blut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hände“. Im Hebräischen steht genauer „Handflächen“; gemeint ist die Gebärde ausgebreiteter oder erhobener Hände beim Gebet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „höre ich nicht darauf“ beziehungsweise „will ich nicht hören“. Gemeint ist nicht mangelnde Wahrnehmung, sondern Gottes Weigerung, ihre Gebete anzunehmen.'
    reason: lexical_alternative
  - marker: c
    text: „Blut“ kann hier auch „Blutvergießen“ oder „Blutschuld“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: Und wenn ihr … ausbreitet
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitivus constructus hat hier temporalen Sinn. „Ausbreiten“ gibt die Gebärde des Gebets natürlich wieder.
- source_word: כַּפֵּיכֶם
  choice: eure Handflächen
  rationale: כַּף bezeichnet genauer die Handfläche beziehungsweise die hohle Hand. Die konkrete Gebetsgebärde bleibt so sichtbar, zugleich wird der Wechsel zu יְדֵיכֶם („Hände“) am Versende bewahrt.
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: verberge ich meine Augen vor euch
  rationale: Die konkrete anthropomorphe Bildsprache des Hiphil von עלם wird beibehalten und nicht zum abstrakten „ich beachte euch nicht“ abgeschwächt.
- source_word: גַּם כִּי תַרְבּוּ תְפִלָּה
  choice: Auch wenn ihr noch so viel betet
  rationale: גַּם כִּי leitet eine Einräumung ein; die Verbindung von רבה und תְפִלָּה bezeichnet ein starkes Vermehren des Betens. Die deutsche Wendung ist natürlich und erhält die Steigerung.
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: höre ich nicht
  rationale: Die negative Partizipialkonstruktion bezeichnet Gottes anhaltende Weigerung, die Gebete anzunehmen. „Hören“ bewahrt die lexikalische und theologische Spannung des Hebräischen; eine Fußnote nennt die pragmatische Alternative.
- source_word: יְדֵיכֶם דָּמִים מָלֵאוּ
  choice: Eure Hände sind voller Blut
  rationale: „Hände“ entspricht יָד und wahrt den bewussten Wechsel gegenüber „Handflächen“. Das pluralische דָּמִים kann Blut, Blutvergießen oder Blutschuld bezeichnen; „Blut“ erhält die starke, mehrdeutige Bildsprache.
theological_decisions:
- issue: Anthropomorphe Darstellung von Gottes Zurückweisung des Gottesdienstes
  choice: „verberge ich meine Augen“ und „höre ich nicht“ werden konkret beibehalten
  alternative: „beachte ich euch nicht“ beziehungsweise „nehme ich eure Gebete nicht an“
  rationale: Der hebräische Text stellt Gottes Zurückweisung heuchlerischer Frömmigkeit mit körperbezogener Bildsprache dar. Die Übersetzung bewahrt diese prophetische Schärfe, ohne sie dogmatisch aufzulösen.
- issue: Bedeutungsumfang von דָּמִים
  choice: „Blut“ im Haupttext mit erläuternder Fußnote
  alternative: „Blutvergießen“ oder „Blutschuld“
  rationale: Der Kontext klagt schwere Gewalttat und Schuld an, doch das hebräische Wort lässt die genauere Zuordnung offen. Die konkrete Formulierung vermeidet eine vorschnelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Schärfe. Die Satzglieder sind für natürliches Deutsch leicht gegliedert; die konkreten Bilder und die genuine Mehrdeutigkeit von „hören“ und דָּמִים bleiben erhalten. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
