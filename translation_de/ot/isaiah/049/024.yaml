source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: de
  text: Kann einem Mächtigen die Beute[a] abgenommen werden, oder können die Gefangenen eines Gerechten[b] gerettet werden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Raubgut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach dem masoretischen Text: „die Gefangenen eines Gerechten“. Die Wendung ist in diesem Zusammenhang schwierig. Manche verstehen sie anders; einige alte Übersetzungen setzen eine Lesart voraus, die eher „die Gefangenen eines Gewalttätigen“ oder „eines Schrecklichen“ bedeutet.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: Kann … abgenommen werden
  rationale: Die Fragepartikel mit dem passiven Imperfekt von לקח bildet eine rhetorische Frage. „Kann … abgenommen werden“ gibt sowohl die Möglichkeit als auch die Wegnahme aus dem Besitz des Mächtigen natürlich wieder.
- source_word: מִגִּבּוֹר
  choice: einem Mächtigen
  rationale: גִּבּוֹר bezeichnet einen starken oder mächtigen Mann, häufig auch einen Krieger. „Mächtiger“ bewahrt den weiten Sinn, ohne die militärische Nuance zwingend festzulegen.
- source_word: מַלְקוֹחַ
  choice: die Beute
  rationale: Das Substantiv bezeichnet Erbeutetes oder Geraubtes. „Beute“ ist im Deutschen idiomatisch und passt zum Parallelbegriff der Gefangenen.
- source_word: וְאִם
  choice: oder können
  rationale: Im parallelen rhetorischen Satz führt וְאִם keine gewöhnliche Bedingung ein, sondern die zweite Frage. „Oder können“ gibt diese Funktion natürlich wieder.
- source_word: שְׁבִי
  choice: die Gefangenen
  rationale: שְׁבִי kann Gefangenschaft oder die Gesamtheit der Gefangenen bezeichnen. Der Zusammenhang und das Verb des Entkommens beziehungsweise Gerettetwerdens sprechen hier für die personale Wiedergabe.
- source_word: צַדִּיק
  choice: eines Gerechten
  rationale: Die gewöhnliche Bedeutung von צַדִּיק ist „gerecht“ beziehungsweise „ein Gerechter“. Diese Wiedergabe folgt dem masoretischen Text und lässt dessen Schwierigkeit im Zusammenhang bewusst bestehen.
- source_word: יִמָּלֵט
  choice: gerettet werden
  rationale: Der Nifal von מלט bezeichnet Entkommen oder Gerettetwerden. „Gerettet werden“ wahrt die passive Aussage und bildet einen natürlichen Parallelismus zu „abgenommen werden“.
theological_decisions:
- issue: צַדִּיק bezeichnet im Zusammenhang offenbar den Besitzer von Gefangenen.
  choice: Die Hauptübersetzung folgt mit „eines Gerechten“ dem masoretischen Text und löst die Spannung nicht auf.
  alternative: Kontextuelle oder textkritische Wiedergaben wie „eines Gewalttätigen“, „eines Tyrannen“ oder „eines Schrecklichen“.
  rationale: Die überlieferte hebräische Lesart lautet צַדִּיק. Da sie in diesem Zusammenhang schwierig ist, werden abweichende Deutungen und alte Textzeugen in einer Fußnote genannt, aber nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Parallelstruktur bleibt erhalten; die schwer verständliche masoretische Lesart wird im Haupttext bewahrt und durch eine knappe textkritische Fußnote erläutert.
