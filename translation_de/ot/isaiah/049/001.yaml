  text: שִׁמְע֤וּ אִיִּים֙ אֵלַ֔/י וְ/הַקְשִׁ֥יבוּ לְאֻמִּ֖ים מֵ/רָח֑וֹק יְהוָה֙ מִ/בֶּ֣טֶן קְרָאָ֔/נִי מִ/מְּעֵ֥י אִמִּ֖/י הִזְכִּ֥יר שְׁמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: de
  text: Hört mir zu, ihr Küstenländer[a], und hört aufmerksam zu, ihr Völker aus der Ferne! Jahwe rief mich vom Mutterleib an; noch im Leib meiner Mutter nannte er meinen Namen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Inseln“. Das hebräische Wort kann Inseln, Küstengebiete oder allgemein ferne Länder am Meer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aus dem Inneren meiner Mutter hat er meinen Namen genannt“. Die Wendung kann auf Benennung, Erwählung oder Berufung hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Die Wendung gibt den pluralischen Aufforderungscharakter natürlich wieder und bezeichnet nicht nur akustisches Hören, sondern aufmerksames Beachten.
- source_word: אִיִּים
  choice: Küstenländer
  rationale: Der Ausdruck bezeichnet bei Jesaja häufig ferne maritime Gebiete; „Küstenländer“ ist weiter als das engere „Inseln“.
- source_word: וְהַקְשִׁיבוּ
  choice: hört aufmerksam zu
  rationale: Der Hifil-Imperativ von קשׁב verstärkt die Aufforderung zum aufmerksamen Hören.
- source_word: לְאֻמִּים מֵרָחוֹק
  choice: ihr Völker in der Ferne
  rationale: Bewahrt die Anrede an entfernte Volksgruppen und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִבֶּטֶן קְרָאַנִי
  choice: hat mich vom Mutterleib an berufen
  rationale: קרא kann „rufen“ oder „berufen“ bedeuten. Im Zusammenhang mit der Sendung des Sprechers bringt „berufen“ den möglichen Auftragssinn zum Ausdruck; „vom Mutterleib an“ bezeichnet den zeitlichen Ausgangspunkt.
- source_word: מִמְּעֵי אִמִּי
  choice: schon im Leib meiner Mutter
  rationale: Die wörtlichen „inneren Teile meiner Mutter“ werden idiomatisch wiedergegeben, ohne die parallele Formulierung einfach zu wiederholen.
- source_word: הִזְכִּיר שְׁמִי
  choice: hat er meinen Namen genannt
  rationale: הזכיר bedeutet im Hifil „erwähnen, nennen, in Erinnerung bringen“. „Meinen Namen genannt“ bewahrt die Formulierung und lässt offen, ob Benennung, Erwählung oder ausdrückliche Bezeichnung gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; die Umschrift „Jahwe“ macht dies sichtbar und ersetzt ihn nicht durch einen Titel.
- issue: Berufung vor der Geburt
  choice: vom Mutterleib an berufen
  alternative: aus dem Mutterleib gerufen
  rationale: Die Formulierung lässt die vorgeburtliche Erwählung beziehungsweise Beauftragung anklingen, ohne die Identität des Sprechers näher festzulegen.
- issue: Bedeutung von הִזְכִּיר שְׁמִי
  choice: meinen Namen genannt
  alternative: mich beim Namen gerufen
  rationale: „Genannt“ bleibt näher am Verb „erwähnen/nennen“ und vermeidet es, den Ausdruck eindeutig als Rufhandlung oder Namensgebung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Anruf. Die doppelte Höraufforderung und der poetische Parallelismus bleiben erkennbar; ungewöhnliche hebräische Bildsprache wird maßvoll idiomatisiert.
