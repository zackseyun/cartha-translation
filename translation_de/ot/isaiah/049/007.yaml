source:
  edition: WLC
  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: de
  text: 'So spricht Jahwe[a], der Erlöser Israels, sein Heiliger, zu dem zutiefst Verachteten[b], den das Volk verabscheut[c], zum Sklaven von Herrschern[d]: Könige werden es sehen und sich erheben, Fürsten werden sich niederwerfen[e] – weil Jahwe treu ist, der Heilige Israels, der dich erwählt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jahwe“ gibt den hebräischen Gottesnamen יהוה wieder, der traditionell oft mit „der HERR“ wiedergegeben wird.
    reason: translation_convention
  - marker: b
    text: Wörtlicher etwa „dem an der Seele Verachteten“. Die knappe hebräische Wendung kann auch „dem von Menschen Verachteten“ oder einfach „dem tief Verachteten“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „den eine Nation verabscheut“; manche verstehen den Singular kollektiv im Sinn von „den die Völker verabscheuen“.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische עֶבֶד kann je nach Zusammenhang „Sklave“, „Knecht“ oder „Diener“ bedeuten.
    reason: lexical_alternative
  - marker: e
    text: Das Hebräische nennt nicht ausdrücklich, vor wem die Fürsten sich niederwerfen. Die Huldigung steht im Zusammenhang mit dem Angeredeten, geschieht aber „weil Jahwe treu ist“.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: גֹּאֵל יִשְׂרָאֵל
  choice: der Erlöser Israels
  rationale: „Erlöser“ bewahrt sowohl den Gedanken der Befreiung als auch den rechtlich-bundesbezogenen Hintergrund von גאל, ohne die Verwandtschaftspflicht ausdrücklich in den Text einzutragen.
- source_word: קְדוֹשׁוֹ
  choice: sein Heiliger
  rationale: 'Die wörtliche Wiedergabe erhält das maskuline Suffix „sein“. Im unmittelbaren Satzbau bezieht es sich am ehesten auf Israel: Jahwe ist Israels Erlöser und sein Heiliger.'
- source_word: לִבְזֹה נֶפֶשׁ
  choice: zu dem zutiefst Verachteten
  rationale: Die hebräische Wendung ist stark verdichtet. „Zutiefst“ gibt die intensive Bedeutung wieder, ohne das mehrdeutige נֶפֶשׁ unnatürlich als „Seele“ abzubilden.
- source_word: לִמְתָעֵב גּוֹי
  choice: den das Volk verabscheut
  rationale: Die aktive deutsche Formulierung ist idiomatisch und bewahrt גּוֹי im Singular; „Volk“ lässt offen, welches Volk gemeint ist.
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: zum Sklaven von Herrschern
  rationale: עֶבֶד kann Diener oder Sklave bedeuten. In der Reihe von Erniedrigungen hebt „Sklave“ die Unterworfenheit hervor; „von Herrschern“ gibt den unbestimmten Plural wieder.
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: Könige werden es sehen und sich erheben
  rationale: „Sich erheben“ bezeichnet hier eine ehrende Reaktion. Das neutrale „es“ vermeidet es, ein im Hebräischen nicht ausdrücklich genanntes Objekt als Person festzulegen.
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: Fürsten werden sich niederwerfen
  rationale: „Fürsten“ entspricht dem politischen Rang von שָׂרִים; „sich niederwerfen“ gibt die starke Gebärde der Huldigung wieder, ohne deren nicht genanntes Objekt festzulegen.
- source_word: לְמַעַן יְהוָה אֲשֶׁר נֶאֱמָן
  choice: um Jahwes willen, der treu ist
  rationale: לְמַעַן bezeichnet den maßgeblichen Grund der Huldigung; נֶאֱמָן hebt Jahwes Verlässlichkeit und Treue hervor.
- source_word: וַיִּבְחָרֶךָּ
  choice: der dich erwählt hat
  rationale: Das maskuline Singularsuffix wird als „dich“ erhalten; das Perfekt bezeichnet die bereits vollzogene Erwählung.
theological_decisions:
- issue: Bezug von „sein Heiliger“ (קְדוֹשׁוֹ)
  choice: Die Formulierung wird wörtlich als „sein Heiliger“ erhalten und im Satzbau auf Israel bezogen.
  alternative: Die Wendung auf den erst anschließend angeredeten Knecht beziehen oder frei als „der Heilige Israels“ wiedergeben.
  rationale: „Israel“ ist das unmittelbar vorausgehende Bezugswort, und „der Heilige Israels“ ist ein charakteristischer Gottesname im Jesajabuch. Die wörtliche Form bewahrt zugleich die ungewöhnliche Gestalt des Hebräischen.
- issue: Objekt des Niederwerfens
  choice: Im Haupttext wird kein Objekt ergänzt.
  alternative: Ausdrücklich „vor dir“ beziehungsweise „vor Jahwe“ ergänzen.
  rationale: Der Zusammenhang stellt die Erhöhung des Angeredeten vor Augen, während לְמַעַן יְהוָה Jahwe als ihren Grund nennt. Da das Hebräische das Ziel der Huldigung nicht ausdrücklich bezeichnet, soll die Übersetzung diese Spannung nicht dogmatisch auflösen.
- issue: Bedeutung von עֶבֶד
  choice: „Sklave“
  alternative: „Diener“ oder „Knecht“
  rationale: Die unmittelbare Verbindung mit Verachtung und Abscheu spricht hier für den Status erzwungener Unterordnung. Die Fußnote hält die weitere lexikalische Möglichkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der feierlichen Redeform des Hebräischen, wird aber durch Doppelpunkt und Gedankenstrich lesbar gegliedert. Verdichtete oder syntaktisch offene Formulierungen werden im Haupttext nicht konfessionell vereindeutigt; die wichtigsten Alternativen stehen in den Fußnoten.
