  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: de
  text: 'So spricht der Herr Yahweh: Siehe, ich werde meine Hand zu den Nationen hin erheben und mein Feldzeichen[a] für die Völker aufrichten. Sie werden deine Söhne an der Brust tragen[b], und deine Töchter werden auf der Schulter getragen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Signal“ oder „mein Banner“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Schoß“ oder „im Bausch des Gewandes“; gemeint ist, dass die Kinder dicht am Körper getragen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den im Text stehenden Gottesnamen יְהוִה wieder und vermeidet die im Deutschen missverständliche Doppelung „Herr HERR“.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den nachdrücklichen prophetischen Aufmerksamkeitsruf in würdigem, allgemein verständlichem Deutsch.
- source_word: אֶשָּׂא אֶל־גּוֹיִם יָדִי
  choice: ich werde meine Hand zu den Nationen hin erheben
  rationale: Erhält das konkrete Bild einer weithin sichtbaren, an die Nationen gerichteten Gebärde und den Zukunftscharakter der Ankündigung.
- source_word: גּוֹיִם / עַמִּים
  choice: Nationen / Völker
  rationale: Spiegelt die lexikalische Variation des hebräischen Parallelismus wider, ohne einen scharfen Bedeutungsunterschied zu behaupten.
- source_word: אָרִים נִסִּי
  choice: mein Feldzeichen ... aufrichten
  rationale: נֵס bezeichnet ein sichtbares Signal, Feldzeichen oder Banner; „Feldzeichen“ bewahrt die öffentliche Sammel- und Signalwirkung.
- source_word: בָנַיִךְ / בְנֹתַיִךְ
  choice: deine Söhne / deine Töchter
  rationale: Bewahrt die ausdrücklich geschlechtsspezifische Paarung des hebräischen Textes.
- source_word: בְּחֹצֶן
  choice: an der Brust tragen
  rationale: Gibt den Sinn des Tragens dicht am Körper natürlich wieder; die konkretere Möglichkeit des Gewandbauschs bleibt in der Fußnote erhalten.
- source_word: עַל־כָּתֵף תִּנָּשֶׂאנָה
  choice: auf der Schulter getragen werden
  rationale: Bewahrt sowohl die passive Verbform als auch den im Hebräischen singularisch formulierten Körperteil.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr JHWH
  rationale: Die gewählte Form unterscheidet Titel und Eigenname transparent und gibt den im Ausgangstext ausdrücklich vorhandenen Gottesnamen wieder, ohne eine konfessionelle Deutung einzutragen.
- issue: Handlungsträger beim Zurückbringen der Kinder
  choice: Sie werden deine Söhne ... tragen
  alternative: Die Völker werden deine Söhne ... tragen
  rationale: Das hebräische Verb hat ein unausgesprochenes Subjekt, das sich aus den zuvor genannten Nationen und Völkern erschließt. Das Pronomen bewahrt diese Textgestalt, ohne den Bezug zu verdunkeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. „Siehe“ wahrt den feierlichen Aufmerksamkeitsruf; seltenere Bildwörter werden durch knappe Fußnoten erläutert. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, ohne im Deutschen unnötig schwerfällig zu wirken.
