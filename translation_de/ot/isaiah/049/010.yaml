  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: de
  text: Sie werden weder hungern noch dürsten, und weder sengende Hitze noch die Sonne werden sie treffen; denn der, der Erbarmen mit ihnen hat, wird sie führen und sie zu Wasserquellen leiten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an Wasserquellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעָבוּ
  choice: werden hungern
  rationale: Das Qal-Imperfekt von רָעֵב bezeichnet Hunger leiden bzw. hungrig sein; die verbale Wiedergabe bewahrt den Parallelismus mit „dürsten“.
- source_word: יִצְמָאוּ
  choice: werden dürsten
  rationale: Das Qal-Imperfekt von צָמֵא bedeutet „dürsten“; die Formulierung ist knapp, verständlich und poetisch parallel zu „hungern“.
- source_word: יַכֵּם
  choice: wird sie treffen
  rationale: Das Hifil von נכה bedeutet „schlagen/treffen“. Bei Hitze und Sonne gibt „treffen“ die schädigende Einwirkung natürlich wieder, ohne unnötig altertümlich zu klingen.
- source_word: שָׁרָב
  choice: sengende Hitze
  rationale: שָׁרָב bezeichnet brennende, austrocknende Hitze; „sengende Hitze“ vermittelt die Intensität und das Wüstenbild.
- source_word: שָׁמֶשׁ
  choice: Sonne
  rationale: Gemeint ist im Kontext die physische Sonne; eine bildliche Auslegung ist nicht erforderlich.
- source_word: מְרַחֲמָם
  choice: der, der Erbarmen mit ihnen hat
  rationale: Das Partizip von רָחַם mit Suffix bezeichnet den, der sich ihrer erbarmt. Die Wiedergabe wahrt die beschreibende Form, ohne den im Kontext wahrscheinlichen göttlichen Referenten ausdrücklich einzusetzen.
- source_word: יְנַהֲגֵם
  choice: wird sie führen
  rationale: Das Piel von נהג bedeutet „führen/leiten“; „führen“ passt zum fürsorglichen, pastoralen Zusammenhang.
- source_word: מַבּוּעֵי מַיִם
  choice: Wasserquellen
  rationale: מַבּוּעַ bezeichnet eine Quelle bzw. einen natürlichen Wasseraustritt. „Wasserquellen“ ist konkret und idiomatisch.
- source_word: יְנַהֲלֵם
  choice: sie leiten
  rationale: Das Piel von נהל bezeichnet ein fürsorgliches Führen oder Leiten. „leiten“ unterscheidet sich stilistisch vom vorausgehenden „führen“, ohne den Sinn zu verändern.
- source_word: וְעַל
  choice: zu
  rationale: עַל kann in einem Bewegungskontext eine Ausrichtung auf ein Ziel bezeichnen. „zu Wasserquellen“ gibt diese Zielrichtung natürlich wieder; „an Wasserquellen“ bleibt als mögliche lokale Deutung denkbar.
theological_decisions:
- issue: Referent des erbarmenden Führers
  choice: Der Referent wird nur als „der, der Erbarmen mit ihnen hat“ bezeichnet.
  alternative: Den Referenten ausdrücklich als Gott benennen.
  rationale: Der Kontext legt Gott nahe, doch der hebräische Text nennt ihn hier nicht ausdrücklich. Die beschreibende Form bewahrt sowohl den wahrscheinlichen Bezug als auch die sprachliche Zurückhaltung des Originals.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die doppelte Subjektkonstruktion „weder … noch …“ macht deutlich, dass sowohl die sengende Hitze als auch die Sonne gemeint sind. Keine Fußnote ist nötig, da die Zielrichtung von עַל im Haupttext natürlich wiedergegeben wird und die alternative lokale Nuance den Verssinn nicht wesentlich verändert.
