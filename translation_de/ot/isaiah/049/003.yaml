  text: וַ/יֹּ֥אמֶר לִ֖/י עַבְדִּ/י אָ֑תָּה יִשְׂרָאֵ֕ל אֲשֶׁר בְּ/ךָ֖ אֶתְפָּאָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Du bist mein Diener, Israel, in dir werde ich mich verherrlichen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Und er sagte zu mir
  rationale: Das Wayyiqtol führt die Rede als nächsten Schritt fort; לִי bezeichnet den Angeredeten als indirektes Objekt.
- source_word: עַבְדִּי אָתָּה
  choice: Du bist mein Diener
  rationale: Die ausdrückliche Anrede wird im natürlichen deutschen Nominalsatz mit »bist« wiedergegeben. »Diener« ist in diesem Jesaja-Kontext angemessener als »Sklave«.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt als Anrede beziehungsweise Apposition zu »mein Diener« stehen, ohne die Identität des Dieners näher auszulegen.
- source_word: אֲשֶׁר בְּךָ אֶתְפָּאָר
  choice: an dir werde ich meine Herrlichkeit zeigen
  rationale: בְּךָ kann hier den Bereich oder das Mittel göttlicher Selbstoffenbarung bezeichnen. Der Hitpael von פאר drückt aus, dass Gott sich als herrlich erweist; die gewählte Formulierung gibt dies verständlich und aktiv wieder, ohne bloßes menschliches Rühmen nahezulegen.
theological_decisions:
- issue: Identität des als »Israel« angeredeten Dieners
  choice: Die direkte Anrede »Du bist mein Diener, Israel« bleibt ohne weitere Festlegung erhalten.
  alternative: Israel ausdrücklich als Gesamtvolk, treuen Rest oder individuellen messianischen Repräsentanten bestimmen.
  rationale: Der Vers nennt den Diener Israel, während der weitere Kontext eine Spannung zwischen kollektiver, repräsentativer und individueller Deutung bestehen lässt. Die Übersetzung entscheidet diese Frage nicht.
- issue: Art der Verherrlichung Gottes im Diener
  choice: »an dir werde ich meine Herrlichkeit zeigen«
  alternative: »in dir werde ich verherrlicht werden« oder »durch dich werde ich mich verherrlichen«
  rationale: Die Formulierung wahrt Gottes eigene Aktivität im reflexiven hebräischen Verb und lässt offen, auf welche Weise seine Herrlichkeit am Diener sichtbar wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetisch-prophetische Satzstruktur und die direkte Anrede bleiben erhalten; »an dir« klingt im Deutschen natürlicher als ein starres »in dir« und bewahrt zugleich die Offenheit der hebräischen Präposition.
