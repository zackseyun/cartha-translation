  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: de
  text: 'Doch Zion sagte: »Der HERR hat mich verlassen; mein Herr hat mich vergessen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der traditionelle deutsche Orts- und Symbolname entspricht dem hebräischen Eigennamen und bewahrt seine personifizierte Verwendung.
- source_word: עֲזָבַנִי
  choice: hat mich verlassen
  rationale: Gibt das Qal-Perfekt von עזב mit dem Objektsuffix der ersten Person direkt und idiomatisch wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention, den Gottesnamen JHWH durch HERR in Kapitälchen wiederzugeben.
- source_word: וַאדֹנָי
  choice: mein Herr
  rationale: Das Suffix der ersten Person in אֲדֹנָי wird kontextgemäß ausdrücklich mit »mein« wiedergegeben und vom Gottesnamen JHWH unterschieden.
- source_word: שְׁכֵחָנִי
  choice: hat mich vergessen
  rationale: Entspricht dem Qal-Perfekt von שכח samt Objektsuffix und bewahrt die parallele Klage.
theological_decisions:
- issue: Unterscheidung zwischen JHWH und Adonai
  choice: »der HERR« und »mein Herr«
  alternative: Beide Ausdrücke als »der Herr« wiederzugeben
  rationale: Die unterschiedliche hebräische Wortwahl und das personale Suffix bei אֲדֹנָי bleiben sichtbar, ohne die Beziehung beider Bezeichnungen weiter auszudeuten.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. »Doch« markiert den klagenden Kontrast zum vorausgehenden Zusammenhang; die Parallelstruktur des Hebräischen bleibt erhalten.
