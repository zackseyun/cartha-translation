id: ISA.49.6
reference: Isaiah 49:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: de
  text: 'Und er sagte: »Es ist zu wenig, dass du mein Diener bist, um die Stämme Jakobs wieder aufzurichten und die Bewahrten Israels[a] zurückzubringen. Ich mache dich auch zu einem Licht für die Nationen[b], damit du meine Rettung bist bis ans Ende der Erde[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Überlebenden Israels« beziehungsweise »die Behüteten Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu einem Licht für die Völker«; auch »zu einem Licht für die Heiden« ist möglich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder entsprechend einer geläufigen deutschen Ausdrucksweise: »bis an die Enden der Erde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: es ist zu wenig
  rationale: Das Adjektiv bezeichnet etwas Leichtes, Geringes oder Unzureichendes. Die idiomatische Wendung »es ist zu wenig« bringt zum Ausdruck, dass der Auftrag an Israel allein gemessen an Gottes weiterem Vorhaben nicht ausreicht.
- source_word: עֶבֶד
  choice: Diener
  rationale: Das Wort kann auch einen Sklaven bezeichnen, dient hier aber als ehrenvolle Bezeichnung für den von Gott Beauftragten. »Diener« ist im heutigen Deutsch verständlich und vermeidet eine im Kontext nicht vorrangige Betonung des Rechtsstatus.
- source_word: לְהָקִים
  choice: wieder aufzurichten
  rationale: Der Hifil von קום bezeichnet hier das erneute Aufrichten beziehungsweise Wiederherstellen. »Wieder aufrichten« bewahrt das konkrete Bild und lässt den Wiederherstellungssinn erkennen.
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: die Stämme Jakobs
  rationale: Die ausdrückliche Nennung Jakobs und die Stammesbezeichnung werden beibehalten; so bleibt auch der Parallelismus mit Israel erhalten.
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: die Bewahrten Israels
  rationale: Die Form von נצר bezeichnet am ehesten die Bewahrten oder Behüteten. Diese Wiedergabe erhält den lexikalischen Sinn, ohne ihn auf bloße Überlebende festzulegen.
- source_word: לְהָשִׁיב
  choice: zurückzubringen
  rationale: Der Hifil von שוב bedeutet gewöhnlich, jemanden zur Rückkehr zu veranlassen. »Zurückbringen« gibt dies transparent wieder und lässt zugleich den Sinn der Wiederherstellung offen.
- source_word: וּנְתַתִּיךָ
  choice: Ich mache dich auch
  rationale: Wörtlich heißt die Form »und ich werde dich geben«. In der Verbindung mit einer Rollenangabe ist »ich mache dich zu« im Deutschen idiomatisch. »Auch« verdeutlicht die Ausweitung des Auftrags von Israel auf die Nationen.
- source_word: לְאוֹר גּוֹיִם
  choice: zu einem Licht für die Nationen
  rationale: גּוֹיִם meint hier die Völker außerhalb Israels. »Nationen« erhält den universalen Horizont, während »für« die prädikative Konstruktion natürlich wiedergibt.
- source_word: יְשׁוּעָתִי
  choice: meine Rettung
  rationale: Das Substantiv kann Rettung, Heil oder Befreiung bezeichnen. »Rettung« ist allgemein verständlich, wahrt die Breite des göttlichen Rettungshandelns und vermeidet eine unnötige begriffliche Verengung.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: bis ans Ende der Erde
  rationale: Der hebräische Ausdruck steht im Singular und bezeichnet den äußersten Rand beziehungsweise fernsten Ort der Erde. Der Haupttext wahrt diesen Singular.
theological_decisions:
- issue: Identität und Reichweite des Auftrags des Dieners
  choice: 'Der Text bewahrt den zweifachen Auftrag: die Wiederherstellung Israels und die Ausweitung von Gottes Rettung auf die Nationen.'
  alternative: Den Diener ausdrücklich ausschließlich kollektiv als Israel oder ausdrücklich ausschließlich messianisch zu bestimmen.
  rationale: Der Vers selbst beauftragt den Diener sowohl im Blick auf Jakob und Israel als auch im Blick auf die Nationen. Seine umstrittene Identität wird in der Übersetzung nicht über das Gesagte hinaus festgelegt.
- issue: Beziehung des Dieners zu Gottes Rettung
  choice: »damit du meine Rettung bist«
  alternative: »damit du meine Rettung bis ans Ende der Erde bringst« oder »damit meine Rettung bis ans Ende der Erde reicht«
  rationale: Der hebräische Text sagt wörtlich, der Diener solle Gottes Rettung »sein«. Die ungewohnte, theologisch spannungsreiche Prädikation wird nicht durch ein ergänztes Verb wie »bringen« oder durch einen Subjektwechsel geglättet.
- issue: Wiedergabe von גּוֹיִם
  choice: Nationen
  alternative: Heiden oder Völker
  rationale: »Nationen« bewahrt den weltweiten Horizont und vermeidet sowohl die mögliche abwertende Nebenbedeutung von »Heiden« als auch eine voreilige Einengung auf einen rein ethnischen Gegensatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. »Diener« ist gegenüber dem historisch und rechtlich stärker markierten »Sklave« bevorzugt. Die ungewöhnliche Aussage, der Diener solle Gottes Rettung »sein«, bleibt bewusst erhalten. Sämtliche Fußnotenmarker stehen an den jeweils einschlägigen Ausdrücken im Haupttext.
