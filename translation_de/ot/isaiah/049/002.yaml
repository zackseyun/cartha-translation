  text: וַ/יָּ֤שֶׂם פִּ/י֙ כְּ/חֶ֣רֶב חַדָּ֔ה בְּ/צֵ֥ל יָד֖/וֹ הֶחְבִּיאָ֑/נִי וַ/יְשִׂימֵ֨/נִי֙ לְ/חֵ֣ץ בָּר֔וּר בְּ/אַשְׁפָּת֖/וֹ הִסְתִּירָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: de
  text: Und er machte meinen Mund wie ein scharfes Schwert; im Schatten seiner Hand verbarg er mich. Er machte mich zu einem polierten Pfeil[a]; in seinem Köcher hielt er mich verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem ausgewählten Pfeil“, „zu einem geschärften Pfeil“ oder „zu einem geläuterten Pfeil“. Das hebräische Adjektiv bezeichnet etwas Gereinigtes oder Verfeinertes und meint hier wahrscheinlich einen sorgfältig für den Einsatz vorbereiteten Pfeil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי
  choice: er machte meinen Mund
  rationale: Die Konstruktion mit prädikativem Vergleich bezeichnet das Versetzen in einen Zustand. „Machte“ ist im Deutschen natürlich und bewahrt mit „meinen Mund“ das konkrete Körperbild für die Rede.
- source_word: כְּחֶרֶב חַדָּה
  choice: wie ein scharfes Schwert
  rationale: Die direkte Wiedergabe erhält Vergleich und Waffenbild ohne erklärende Ausdeutung.
- source_word: בְּצֵל יָדוֹ
  choice: im Schatten seiner Hand
  rationale: Die konkrete hebräische Metapher für Verbergung beziehungsweise Schutz bleibt unverändert erhalten.
- source_word: הֶחְבִּיאָנִי
  choice: verbarg er mich
  rationale: Das Hifil von חבא bedeutet „verbergen“. Die schlichte deutsche Form gibt den Vorgang direkt wieder.
- source_word: וַיְשִׂימֵנִי לְחֵץ
  choice: Er machte mich zu einem … Pfeil
  rationale: „Zu einem … machen“ drückt die durch שׂים mit לְ bezeichnete Bestimmung beziehungsweise Zurichtung idiomatisch aus.
- source_word: בָּרוּר
  choice: geschliffenen
  rationale: Das Adjektiv kann „gereinigt, geläutert, ausgewählt“ bezeichnen. Beim Pfeil beschreibt „geschliffen“ anschaulich eine sorgfältige Bearbeitung und Einsatzbereitschaft, ohne die anderen Möglichkeiten auszuschließen.
- source_word: בְּאַשְׁפָּתוֹ
  choice: in seinem Köcher
  rationale: „Köcher“ ist die reguläre konkrete Bedeutung von אַשְׁפָּה in diesem Zusammenhang; das Possessivsuffix wird beibehalten.
- source_word: הִסְתִּירָנִי
  choice: hielt er mich verborgen
  rationale: Das Hifil von סתר bezeichnet das Verbergen. „Hielt … verborgen“ wahrt die Bedeutung, klingt nach dem vorausgehenden „verbarg“ natürlich und kann den Zustand des Zurückhaltens im Köcher ausdrücken.
theological_decisions:
- issue: Waffenbilder für Rede und Berufung des Knechtes
  choice: Die Bilder „scharfes Schwert“ und „geschliffener Pfeil“ werden konkret und ohne Auslegung wiedergegeben.
  alternative: Die Bilder bereits im Haupttext ausdrücklich auf prophetische Verkündigung oder eine messianische Sendung beziehen.
  rationale: Der Vers entfaltet die Bilder, benennt ihre vollständige theologische Referenz aber nicht. Eine unaufgelöste Wiedergabe erhält poetische Kraft und theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die zweimalige Verbergung wird leicht variiert, ohne einen Bedeutungsunterschied zu behaupten.
