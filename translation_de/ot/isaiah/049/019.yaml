source:
  edition: WLC
  text: כִּ֤י חָרְבֹתַ֨יִ/ךְ֙ וְ/שֹׁ֣מְמֹתַ֔יִ/ךְ וְ/אֶ֖רֶץ הֲרִֽסֻתֵ֑י/ךְ כִּ֤י עַתָּה֙ תֵּצְרִ֣י מִ/יּוֹשֵׁ֔ב וְ/רָחֲק֖וּ מְבַלְּעָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: de
  text: Denn deine Trümmerstätten, deine verödeten Orte und dein verwüstetes Land – ja, nun wirst du für die Bewohner zu eng sein[a], und die dich verschlingen[b], werden fern sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „du wirst wegen der Bewohner zu eng sein“. Die hebräische Wendung ist knapp und kann auch entsprechend formnah wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Verschlinger“. Das Hebräische gebraucht das drastische Bild des Verschlingens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: deine Trümmerstätten
  rationale: חָרְבָּה bezeichnet einen verwüsteten oder in Trümmern liegenden Ort. „Trümmerstätten“ ist anschaulich und unterscheidet sich klar von den parallel genannten verödeten Orten.
- source_word: שֹׁמְמֹתַיִךְ
  choice: deine verödeten Orte
  rationale: Die Form von שׁמם beschreibt Orte, die öde und verlassen sind. „Verödete Orte“ gibt diesen Zustand in natürlichem Deutsch wieder.
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: dein verwüstetes Land
  rationale: Die Wendung bezeichnet das Land in seinem Zustand nach der Zerstörung. „Verwüstetes Land“ ist idiomatisch und bewahrt die resultative Bedeutung.
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet die vorausgehende Verheißung und wird daher kausal mit „Denn“ wiedergegeben.
- source_word: כִּי עַתָּה
  choice: ja, nun
  rationale: Das zweite כִּי wirkt hier bekräftigend und leitet die angekündigte Wende ein. „Ja, nun“ wahrt den Nachdruck, ohne eine zusätzliche Kausalbeziehung einzuführen.
- source_word: תֵּצְרִי
  choice: du wirst zu eng sein
  rationale: Die feminine Singularform redet Zion unmittelbar an und bezeichnet räumliche Enge. Die direkte Anrede bleibt erhalten, statt die vorangestellten Ortsangaben zum grammatischen Subjekt umzudeuten.
- source_word: מִיּוֹשֵׁב
  choice: für die Bewohner
  rationale: מן mit der Form von ישׁב beschreibt hier die Enge im Blick auf die Menschen, die das Land bewohnen. „Für die Bewohner“ ist im Deutschen knapp und verständlich.
- source_word: וְרָחֲקוּ
  choice: werden weit weg sein
  rationale: Das Perfekt steht im prophetischen Zusammenhang für das sichere künftige Ergebnis der Wiederherstellung. Die Zukunftsform fügt sich in den zeitlichen Bezug des Verses ein.
- source_word: מְבַלְּעָיִךְ
  choice: die, die dich verschlungen haben
  rationale: Die Form von בלע bezeichnet diejenigen, die Zion verschlingen. Die Übersetzung bewahrt das drastische Bild des hebräischen Textes, statt es zu „Zerstörer“ zu verallgemeinern.
theological_decisions:
- issue: Zeitbezug des prophetischen Perfekts im letzten Satzteil
  choice: 'Zukunftsbezogen: „werden weit weg sein“'
  alternative: 'Gegenwarts- oder vergangenheitsbezogen: „sind weit weg“ beziehungsweise „waren weit weg“'
  rationale: Im Heilsorakel beschreibt der Satz die verheißene Umkehr bei Zions Wiederherstellung. Die deutsche Zukunftsform vermittelt diese prophetische Ausrichtung, ohne die Aussage als bereits vergangenes Geschehen festzulegen.
- issue: Bezug der femininen Singularform תֵּצְרִי
  choice: 'Zion bleibt als angeredetes Gegenüber Subjekt: „du wirst … zu eng sein“'
  alternative: 'Die Trümmerstätten und das verwüstete Land als ausdrückliches Subjekt umformulieren: „werden … zu eng sein“'
  rationale: Die Verbform ist feminin Singular und setzt die in diesem Abschnitt angeredete Zion fort. Die thematisch vorangestellten Ortsangaben werden deshalb nicht stillschweigend zum pluralischen Subjekt gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die im Hebräischen knappe thematische Voranstellung lesbar; die direkte Anrede Zions und das Bild des Verschlingens bleiben erhalten.
