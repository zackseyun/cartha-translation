reference: Isaiah 49:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: de
  text: 'Ich aber sagte: »Vergeblich habe ich mich abgemüht, für Leere und Hauch meine Kraft verbraucht. Doch gewiss: Mein Recht[a] liegt bei Jahwe und mein Lohn[b] bei meinem Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Rechtssache« oder »meine Rechtfertigung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Vergeltung« oder »mein Arbeitslohn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: vergeblich
  rationale: רִיק bezeichnet Leere beziehungsweise Ergebnislosigkeit. »Vergeblich« gibt den Gedanken einer scheinbar fruchtlosen Mühe im Deutschen knapp und natürlich wieder.
- source_word: יָגַעְתִּי
  choice: habe ich mich abgemüht
  rationale: יגע bezeichnet anstrengende, ermüdende Arbeit. »Sich abmühen« bewahrt sowohl die Arbeit als auch die damit verbundene Erschöpfung.
- source_word: לְתֹהוּ וְהֶבֶל
  choice: für Leere und Hauch
  rationale: תֹהוּ bezeichnet Leere, Öde oder Nichtigkeit; הֶבֶל bedeutet wörtlich »Hauch« und kann Vergänglichkeit oder Nichtigkeit ausdrücken. Die Übersetzung hält beide Bilder auseinander und bewahrt ihre poetische Offenheit.
- source_word: כֹּחִי כִלֵּיתִי
  choice: meine Kraft verbraucht
  rationale: כלה im Piel bedeutet hier aufbrauchen oder verzehren. »Meine Kraft verbraucht« bringt die vollständig eingesetzte Energie klar zum Ausdruck.
- source_word: אָכֵן
  choice: Doch gewiss
  rationale: אָכֵן leitet eine nachdrückliche, zugleich gegensätzliche Wendung ein. »Doch gewiss« verbindet den Kontrast zur Klage mit dem folgenden Vertrauen.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט kann Recht, Urteil, Rechtsanspruch oder Rechtssache bezeichnen. »Mein Recht« wahrt die juristische Bedeutungsbreite, ohne bereits ausdrücklich eine erfolgte Rechtfertigung zu behaupten.
- source_word: אֶת יְהוָה
  choice: liegt bei Jahwe
  rationale: אֶת bezeichnet hier die Zuordnung beziehungsweise Verwahrung bei Jahwe. »Liegt bei« ist natürliches Deutsch und vermeidet eine nicht ausdrücklich vorhandene Richtungsangabe.
- source_word: וּפְעֻלָּתִי
  choice: und mein Lohn
  rationale: פְעֻלָּה kann Arbeit, Ertrag, Lohn oder Vergeltung bedeuten. Im Parallelismus bezeichnet es plausibel den Lohn für die aufgewandte Mühe.
- source_word: אֶת אֱלֹהָי
  choice: bei meinem Gott
  rationale: Wie im parallelen Ausdruck zuvor bezeichnet אֶת, dass der Lohn bei Gott liegt beziehungsweise in seiner Obhut ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von מִשְׁפָּטִי in der Rede des Knechtes
  choice: mein Recht
  alternative: meine Rechtssache; meine Rechtfertigung
  rationale: »Mein Recht« bewahrt die Spannung zwischen dem Rechtsanspruch des Sprechers, seiner Sache vor Gott und einer möglichen künftigen Rechtfertigung, ohne eine dieser Nuancen allein festzuschreiben.
- issue: Deutung von וּפְעֻלָּתִי
  choice: mein Lohn
  alternative: meine Vergeltung; mein Arbeitslohn
  rationale: »Mein Lohn« entspricht dem Zusammenhang der scheinbar vergeblichen Arbeit, lässt aber offen, in welcher Form Gott diesen Lohn gewährt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelstruktur. »Leere und Hauch« bewahrt die beiden unterschiedlichen hebräischen Bilder; »Doch gewiss« markiert den Umschlag von der Klage zum Vertrauen. Die Fußnoten stehen unmittelbar an den jeweils erläuterten Ausdrücken.
