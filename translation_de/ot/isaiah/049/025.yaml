  naturalness: „Die Beute eines Gewalttätigen wird entrinnen“ ist im modernen Standarddeutsch ohne Ergänzung holprig, weil „Beute“ gewöhnlich nicht als selbst handelndes Subjekt von „entrinnen“ erscheint. „wird dem Gewalttätigen entrinnen“ erhält das hebräische Entkommensbild und ist natürlich. Die bestimmten generischen Bezeichnungen „des Mächtigen“ und „des Gewalttätigen“ lesen sich in diesem poetisch-prophetischen Kontext idiomatischer als die unbestimmten Formen.
  terminology: „der HERR“ ist die etablierte deutsche Schreibung für יהוה. „Kinder“ ist im Zion-Kontext als kollektive Wiedergabe von בָּנַיִךְ vertretbar, sofern die wörtliche Alternative in der Fußnote erhalten bleibt. „streiten“ bewahrt die bewusst offene Verbindung von rechtlichem Streit und Gegnerschaft bei ריב.
