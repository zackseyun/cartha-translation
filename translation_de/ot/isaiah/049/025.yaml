source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: de
  text: 'Denn so spricht der HERR: Selbst die Gefangenen des Mächtigen werden weggenommen, und die Beute des Gewalttätigen wird dem Gewalttätigen entrinnen. Ich selbst werde mit dem streiten, der mit dir streitet, und ich selbst werde deine Kinder[a] retten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: deine Söhne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im Deutschen übliche Wiedergabe des Tetragramms mit „HERR“ kennzeichnet den Gottesnamen und vermeidet eine unsichere Rekonstruktion seiner Aussprache.
- source_word: שְׁבִי גִבּוֹר
  choice: die Gefangenen eines Mächtigen
  rationale: שְׁבִי wird hier konkret und kollektiv auf gefangen gehaltene Menschen bezogen; גִבּוֹר bezeichnet ihren mächtigen Bezwinger oder Bewacher.
- source_word: יֻקָּח
  choice: werden weggenommen
  rationale: Das passive Verb bezeichnet, dass die Gefangenen dem Mächtigen aus seiner Gewalt genommen werden.
- source_word: מַלְקוֹחַ עָרִיץ
  choice: die Beute eines Gewalttätigen
  rationale: מַלְקוֹחַ bezeichnet das Erbeutete, während עָרִיץ einen gewalttätigen, tyrannischen Unterdrücker meint. Die Formulierung erhält das Bild der geraubten Beute.
- source_word: יִמָּלֵט
  choice: wird entrinnen
  rationale: Das Verb kann sowohl Entkommen als auch Befreiung ausdrücken. „Entrinnen“ bewahrt die aktive Bildhaftigkeit, ohne Gottes rettendes Handeln im Kontext auszuschließen.
- source_word: וְאֶת־יְרִיבֵךְ אָנֹכִי אָרִיב
  choice: Ich selbst werde mit dem streiten, der mit dir streitet
  rationale: Die Wiederholung von ריב wird im Deutschen durch „streiten“ erhalten; die Formulierung lässt sowohl rechtliche Auseinandersetzung als auch tätigen Widerstand offen. „Ich selbst“ gibt das betonte אָנֹכִי wieder.
- source_word: בָּנַיִךְ
  choice: deine Kinder
  rationale: Zion wird in der weiblichen Einzahl angeredet; ihre „Söhne“ sind hier kollektiv ihre Nachkommen beziehungsweise Einwohner. „Kinder“ gibt diesen Bezug im heutigen Deutsch natürlich wieder, während die wörtliche Form in der Fußnote genannt wird.
- source_word: אוֹשִׁיעַ
  choice: werde retten
  rationale: Die Kausativform von ישׁע bezeichnet Gottes rettendes oder befreiendes Eingreifen; „retten“ ist direkt und theologisch nicht einengend.
theological_decisions:
- issue: Umfang von בָּנַיִךְ in der Anrede an Zion
  choice: deine Kinder
  alternative: deine Söhne
  rationale: Der grammatisch maskuline Plural bezeichnet in der personifizierten Zion-Anrede ihre Nachkommen oder Bewohner kollektiv. Die Übersetzung macht den gemeinten Personenkreis deutlich, ohne die wörtliche Form zu verbergen.
- issue: Bedeutungsbereich von ריב
  choice: streiten
  alternative: den Rechtsstreit führen / kämpfen
  rationale: ריב kann einen Rechtsstreit, eine Auseinandersetzung oder aktiven Widerstand bezeichnen. „Streiten“ erhält diese Spannung und vermeidet eine Festlegung auf ausschließlich gerichtliche oder militärische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung „Ich selbst“ bildet die zweifache Betonung durch אָנֹכִי ab. Der deutsche Satzbau bleibt klar, während die poetische Wiederholung von „streiten“ und die Beutemetaphorik des Hebräischen erhalten werden.
