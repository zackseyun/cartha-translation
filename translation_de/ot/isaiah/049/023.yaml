id: ISA.49.23
reference: Isaiah 49:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: de
  text: Könige werden deine Pflegeväter[a] sein und ihre Fürstinnen deine Ammen. Mit dem Gesicht zur Erde werden sie sich vor dir niederwerfen und den Staub deiner Füße lecken. Dann wirst du erkennen, dass ich Jahwe bin. Wer auf mich wartet[b], wird nicht beschämt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Betreuer oder Beschützer. Das hebräische Wort kann Männer bezeichnen, die jemanden aufziehen, versorgen oder schützen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: auf mich hofft. Das hebräische Verb verbindet Warten mit hoffnungsvoller Erwartung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: deine Pflegeväter
  rationale: Das von אמן abgeleitete Wort bezeichnet Männer, die ein Kind aufziehen, versorgen oder schützen. „Pflegeväter“ bewahrt sowohl das männliche Gegenstück zu den Ammen als auch das Bild königlicher Fürsorge.
- source_word: שָׂרוֹתֵיהֶם
  choice: ihre Fürstinnen
  rationale: Die feminine Pluralform von שׂר kann Herrscherinnen oder hochgestellte Frauen bezeichnen. „Fürstinnen“ ist weit genug, ohne die Frauen ausdrücklich zu Königinnen oder Töchtern von Königen zu machen.
- source_word: מֵינִקֹתַיִךְ
  choice: deine Ammen
  rationale: Das Partizip bezeichnet Frauen, die ein Kind stillen. „Ammen“ ist im Deutschen knapp, verständlich und bildet den fürsorglichen Parallelismus zu „Pflegeväter“ ab.
- source_word: אַפַּיִם אֶרֶץ
  choice: mit dem Gesicht zur Erde
  rationale: Die knappe hebräische Wendung beschreibt eine vollständige Niederwerfung; die deutsche Formulierung erhält das konkrete Körperbild.
- source_word: יִשְׁתַּחֲווּ לָךְ
  choice: sie werden sich vor dir niederwerfen
  rationale: Das Verb bezeichnet hier körperliche Unterwerfung und Huldigung. „Sich niederwerfen“ wahrt die Intensität, ohne den Vorgang ausdrücklich als Anbetung zu deuten.
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: und den Staub deiner Füße lecken
  rationale: Die bewusst drastische Metapher völliger Unterwerfung wird möglichst direkt wiedergegeben.
- source_word: וְיָדַעַתְּ
  choice: Dann wirst du erkennen
  rationale: Das einleitende ו kann im Zusammenhang eine Folge anzeigen. „Erkennen“ bringt stärker als bloßes Wissen das durch das Geschehen bestätigte Erfassen zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא יֵבֹשׁוּ
  choice: wird nicht beschämt werden
  rationale: Die Form bezeichnet das Ausbleiben von Schande und enttäuschendem Scheitern. Die passive deutsche Wendung erhält den öffentlichen und ergebnisbezogenen Sinn.
- source_word: קוָֹי
  choice: wer auf mich wartet
  rationale: Das Partizip von קוה umfasst geduldiges Warten und hoffnungsvolle Erwartung. Der Singular „wer“ gibt die hebräische Mehrzahl im Deutschen als allgemeine Aussage natürlich wieder; die Hoffnungsnuance wird in der Fußnote bewahrt.
theological_decisions:
- issue: Art der Huldigung gegenüber Zion
  choice: „sich vor dir niederwerfen“ als konkrete Unterwerfung und Huldigung
  alternative: „dich anbeten“
  rationale: השתחוה kann kultische Anbetung bezeichnen, doch hier beugen sich Könige und Fürstinnen vor der wiederhergestellten Zion. Die Übersetzung lässt die Handlung eindringlich stehen, ohne Zion ausdrücklich göttliche Anbetung zuzuschreiben.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen יהוה. Die Transliteration wahrt seine Funktion als Eigenname.
- issue: Bedeutung von קוה
  choice: warten mit offen gehaltener Hoffnungsnuance
  alternative: hoffen
  rationale: Das Verb verbindet zeitliches Warten mit vertrauensvoller Erwartung. Der Haupttext wählt „warten“ und dokumentiert die andere Nuance, ohne beide gegeneinander auszuspielen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Pflegeväter“ und „Ammen“ erhalten den fürsorglichen Parallelismus; „den Staub deiner Füße lecken“ bewahrt bewusst das drastische Bild des Ausgangstextes. Die feminine Anrede bezieht sich auf Zion und bleibt in den Possessivformen sichtbar.
