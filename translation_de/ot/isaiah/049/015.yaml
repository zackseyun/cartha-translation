reference: Isaiah 49:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: de
  text: Kann eine Frau ihren Säugling vergessen und sich nicht über den Sohn ihres Leibes[a] erbarmen? Selbst diese können vergessen; ich aber werde dich nicht vergessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kind ihres Leibes“. Hebräisch: „den Sohn ihres Leibes“.'
    reason: Die Alternative macht deutlich, dass die Wendung idiomatisch allgemein auf das von ihr geborene Kind bezogen werden kann, während der Haupttext das ausdrücklich verwendete hebräische Wort „Sohn“ bewahrt.
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: Kann ... vergessen
  rationale: Die Fragepartikel הֲ und die Imperfektform bilden eine rhetorische Frage. „Kann“ bringt die als nahezu undenkbar dargestellte Möglichkeit im Deutschen klar zum Ausdruck.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה bedeutet „Frau“ oder „Ehefrau“. Die mütterliche Rolle ergibt sich aus dem folgenden Bild; deshalb wird nicht ausdrücklich „Mutter“ eingesetzt.
- source_word: עוּלָהּ
  choice: ihren Säugling
  rationale: עוּל bezeichnet ein noch gestilltes, von der Mutter abhängiges Kind. „Säugling“ gibt dies knapp und in heutigem Deutsch wieder.
- source_word: מֵרַחֵם
  choice: sich nicht ... erbarmen
  rationale: Das Verb רחם bezeichnet Erbarmen oder tiefes Mitgefühl. In Verbindung mit מִן drückt die Form hier das Ausbleiben dieses Erbarmens aus.
- source_word: בֶּן בִּטְנָהּ
  choice: den Sohn ihres Leibes
  rationale: Die Wiedergabe bewahrt sowohl das ausdrücklich männliche בֵּן als auch das eindringliche körperliche Bild von בֶּטֶן.
- source_word: גַּם אֵלֶּה
  choice: Selbst diese
  rationale: Die demonstrative Form verweist betont auf die zuvor genannten Frauen zurück. „Selbst diese“ erhält diesen Nachdruck.
- source_word: תִשְׁכַּחְנָה
  choice: können vergessen
  rationale: Das Imperfekt bezeichnet hier im zugestehenden Kontrast eine Möglichkeit, nicht die sichere Behauptung, dass Mütter ihre Kinder vergessen werden.
- source_word: וְאָנֹכִי
  choice: ich aber
  rationale: Das betonte Pronomen אָנֹכִי und die Konjunktion markieren einen starken Gegensatz. „Ich aber“ gibt ihn natürlich und würdig wieder.
- source_word: לֹא אֶשְׁכָּחֵךְ
  choice: werde dich nicht vergessen
  rationale: Die deutsche Futurform gibt die entschiedene göttliche Zusicherung wieder. Das angesprochene „dich“ bezieht sich im Kontext auf Zion.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in בֶּן בִּטְנָהּ
  choice: den Sohn ihres Leibes
  alternative: das Kind ihres Leibes
  rationale: Da der hebräische Text ausdrücklich בֵּן („Sohn“) verwendet, bleibt die männliche Bezeichnung im Haupttext erhalten. Die Fußnote nennt die im Deutschen mögliche allgemeinere Wiedergabe, ohne sie stillschweigend einzusetzen.
- issue: Aussagekraft des Vergleichs
  choice: Selbst diese können vergessen; ich aber werde dich nicht vergessen.
  alternative: Auch wenn diese vergessen, werde ich dich nicht vergessen.
  rationale: Die gewählte Form bewahrt die zugestandene Möglichkeit menschlichen Versagens und stellt ihr Gottes nachdrückliche Zusicherung gegenüber, ohne die Wahrscheinlichkeit des mütterlichen Vergessens zu überzeichnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildhaftem Ton. Der Parallelismus der rhetorischen Frage und der scharfe Gegensatz zwischen möglichem menschlichem Versagen und Gottes Zusicherung bleiben erhalten.
