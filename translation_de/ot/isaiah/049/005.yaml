  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: de
  text: 'Und nun spricht der HERR, der mich von Mutterleib an dazu geformt hat, sein Diener zu sein, Jakob zu ihm zurückzubringen und Israel zu ihm zu sammeln[a]: Ich bin in den Augen des HERRN geehrt, und mein Gott ist meine Stärke geworden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische Text lautet: „und Israel wird nicht gesammelt“; möglich ist auch: „obwohl Israel nicht gesammelt wird“. Viele alte Übersetzungen und Überlieferungen verstehen dagegen: „und Israel wird zu ihm gesammelt“, passend zur parallelen Aussage über Jakobs Rückkehr.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist im modernen Bibeldeutsch allgemein verständlich und wahrt seinen besonderen Charakter; die Kapitälchenschreibung wird hier technisch durch Großbuchstaben dargestellt.
- source_word: יֹצְרִי מִבֶּטֶן
  choice: der mich von Mutterleib an ... geformt hat
  rationale: יֹצֵר bezeichnet bewusstes Formen oder Gestalten. „Von Mutterleib an“ gibt den zeitlichen Ausgangspunkt natürlich wieder.
- source_word: לְעֶבֶד לוֹ
  choice: dazu ..., sein Diener zu sein
  rationale: עֶבֶד kann Diener oder Sklave bedeuten; im Zusammenhang der Berufung steht der beauftragte Dienst im Vordergrund.
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: Jakob zu ihm zurückzubringen
  rationale: Die Form bezeichnet hier das Veranlassen einer Rückkehr. „Zurückbringen“ bewahrt sowohl Bewegung als auch Wiederherstellung.
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: und Israel zu ihm zu sammeln
  rationale: Der Haupttext folgt der kontextuell und durch alte Überlieferung gestützten Lesart לוֹ, „zu ihm“, die parallel zu Jakobs Rückkehr steht. Die masoretische Negation לֹא wird in der Fußnote offengelegt.
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: Ich stehe in Ehren in den Augen des HERRN
  rationale: Das Niphal von כבד bezeichnet Geehrtsein. Die deutsche Wendung ist gegenwärtig, würdevoll und vermeidet eine unnötige Festlegung auf Zukunft oder Vergangenheit.
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: und mein Gott ist meine Stärke geworden
  rationale: עֹז bedeutet Stärke oder Kraft. „Ist ... geworden“ bildet das Verb הָיָה ab und lässt dessen resultativen Sinn bestehen.
theological_decisions:
- issue: Lesart von וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: „und Israel zu ihm zu sammeln“ im Haupttext
  alternative: „doch Israel wird nicht gesammelt“ beziehungsweise „obwohl Israel nicht gesammelt wird“
  rationale: Der masoretische Konsonantentext mit לֹא enthält eine Negation und ergibt die alternative Aussage vom ausbleibenden Sammeln Israels. Die Lesart לוֹ („zu ihm“) entspricht jedoch dem Parallelismus mit der Rückführung Jakobs und ist in alten Auslegungstraditionen und Übersetzungen bezeugt. Die Fußnote bewahrt die echte textliche und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Satzführung. „Von Mutterleib an“ und „in den Augen“ bewahren die Bildsprache des Hebräischen; die textkritische Unsicherheit wird nicht verdeckt.
