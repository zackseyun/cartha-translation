base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: de
  text: 'Dann wirst du in deinem Herzen sagen: »Wer hat mir diese Kinder geboren? Ich war doch meiner Kinder beraubt und kinderlos, verbannt und verstoßen. Und diese hier – wer hat sie großgezogen? Sieh, ich war allein zurückgeblieben. Diese hier – wo waren sie denn?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁכוּלָה
  choice: meiner Kinder beraubt
  rationale: Gibt den Zustand einer Frau wieder, die ihre Kinder verloren hat, und bewahrt den Bezug zur unerwartet großen Kinderschar.
- source_word: גַלְמוּדָה
  choice: unfruchtbar
  rationale: Im Kontext bezeichnet das Wort eine vereinsamte, kinderlose Frau; »unfruchtbar« bringt den Kontrast zum Gebären im Deutschen klar zum Ausdruck, ohne die folgende Aussage des Alleinseins zu verdoppeln.
- source_word: גֹּלָה וְסוּרָה
  choice: verbannt und verstoßen
  rationale: 'Bewahrt die beiden passiven Zustände: Entfernung ins Exil und Aussonderung beziehungsweise Zurückweisung.'
- source_word: גִדֵּל
  choice: großgezogen
  rationale: Entspricht dem kausativen Sinn »aufziehen, groß werden lassen«.
- source_word: אֵיפֹה הֵם
  choice: Woher kommen also diese?
  rationale: 'Idiomatic German reflecting the contextual force of the literal question »Wo sind diese?«: Die Sprecherin wundert sich über Herkunft und Gegenwart der Kinder.'
theological_decisions:
- issue: Identität der angesprochenen Frau
  choice: Im Vers nicht ausdrücklich benennen; feminine Anrede beibehalten
  alternative: Die Sprecherin ausdrücklich als Zion oder Jerusalem bezeichnen
  rationale: Der unmittelbare hebräische Text verwendet nur die feminine zweite Person. Die Identifikation ergibt sich aus dem Kontext und sollte nicht in den Vers eingefügt werden.
- issue: Ursprung der versammelten Kinder
  choice: Die staunende Frage offen stehen lassen
  alternative: Gott ausdrücklich als denjenigen nennen, der sie schenkte oder sammelte
  rationale: Der Vers formuliert rhetorische Fragen und nennt die Antwort noch nicht ausdrücklich; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt emotional und staunend; Gedankenstrich und »Sieh« markieren die lebhafte Folge der Fragen. Keine Fußnoten erforderlich.
