  naturalness: Das Deutsch ist insgesamt modernes, würdiges Standarddeutsch. „Wer hat mir diese geboren?“ ist als bibelsprachliche rhetorische Frage verständlich; die explizite Ergänzung „Kinder“ macht den deutschen Bezug klar, ohne den Sinn zu verändern. Die Schlussfrage „Diese hier – wo waren sie denn?“ erhält die hebräische Ellipse und ist im Kontext natürlich verständlich.
  terminology: „Meiner Kinder beraubt“, „verbannt und verstoßen“ sowie „großgezogen“ geben die jeweiligen Ausdrücke und den Kontext angemessen wieder. Für גַלְמוּדָה ist „kinderlos“ gegenüber „unfruchtbar“ weniger medizinisch festgelegt und bildet den Kontext von Verlassenheit bzw. fehlenden Kindern idiomatisch ab.
