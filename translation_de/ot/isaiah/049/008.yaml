source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: de
  text: 'So spricht Jahwe: »Zur Zeit der Gunst[a] habe ich dir geantwortet, und am Tag der Rettung[b] habe ich dir geholfen. Ich werde dich behüten[c] und dich zum Bund für das Volk geben[d], um das Land wiederherzustellen[e] und die verwüsteten Erbteile zuzuteilen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zur Zeit des Wohlwollens«; auch im Sinn von »zur Zeit der Annahme«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »am Tag der Befreiung« beziehungsweise »am Tag des Heils«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »bewahren« beziehungsweise »beschützen«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »dich dem Volk zum Bund geben«; עָם kann je nach Kontext auch »ein Volk« bedeuten.'
    reason: lexical_and_syntactic_alternative
  - marker: e
    text: 'Wörtlicher: »um das Land aufzurichten«; auch möglich: »um das Land zu festigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den überlieferten Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּעֵת רָצוֹן
  choice: Zur Zeit der Gunst
  rationale: רָצוֹן bezeichnet hier Gunst, Wohlwollen oder Annahme. Die Formulierung ist knapp, natürlich und lässt den von Gott gewährten günstigen Zeitpunkt erkennen.
- source_word: עֲנִיתִיךָ
  choice: habe ich dir geantwortet
  rationale: Gibt die Grundbedeutung von ענה direkt wieder; die günstige Art der Antwort ergibt sich bereits aus dem vorangehenden Ausdruck.
- source_word: בְיוֹם יְשׁוּעָה
  choice: am Tag der Rettung
  rationale: יְשׁוּעָה umfasst Rettung, Hilfe und Heil. „Rettung“ ist im modernen Deutsch konkret und bewahrt dennoch die heilsgeschichtliche Weite.
- source_word: עֲזַרְתִּיךָ
  choice: habe ich dir geholfen
  rationale: Direkte und idiomatische Wiedergabe von עזר.
- source_word: וְאֶצָּרְךָ
  choice: Ich werde dich behüten
  rationale: נצר bezeichnet schützendes Bewahren oder Hüten. „Behüten“ bringt den persönlichen Schutz klar zum Ausdruck.
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: und dich zum Bund für das Volk geben
  rationale: Die Formulierung hält fest, dass der Angesprochene selbst als Bund gegeben wird, statt ihn erklärend nur als Vermittler eines Bundes zu bezeichnen. „Für das Volk“ gibt die wahrscheinlich benefaktive Beziehung wieder.
- source_word: לְהָקִים אֶרֶץ
  choice: um das Land wiederherzustellen
  rationale: Das Hifil von קום kann „aufrichten“, „fest gründen“ oder im Zusammenhang „wiederherstellen“ bedeuten. Da anschließend verwüstete Erbteile genannt werden, ist „wiederherstellen“ im Deutschen natürlich und kontextgerecht.
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: und die verwüsteten Erbteile wieder zuzuteilen
  rationale: Das Hifil von נחל bedeutet, etwas als Erbbesitz zuweisen zu lassen oder zuzuteilen. „Erbteile“ bezeichnet die ererbten Landanteile; „wieder“ verdeutlicht im Deutschen die Wiederzuteilung der zuvor verwüsteten Gebiete, die der Kontext voraussetzt.
theological_decisions:
- issue: Die Rolle des Angesprochenen als „Bund für das Volk“
  choice: Der Angesprochene wird selbst „zum Bund für das Volk“ gegeben.
  alternative: Der Angesprochene vermittelt oder errichtet lediglich einen Bund für das Volk.
  rationale: Die hebräische Wendung לִבְרִית עָם stellt den Angesprochenen unmittelbar als Bund beziehungsweise als Verkörperung der Bundeszusage dar. Diese theologische Verdichtung bleibt erhalten und wird nicht durch eine engere Deutung ersetzt.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil oder Befreiung
  rationale: „Rettung“ bewahrt sowohl den konkreten Gedanken des Befreiens aus Not als auch die weiter reichende heilsgeschichtliche Bedeutung, ohne den Ausdruck ausschließlich dogmatisch zu fassen.
- issue: Zeit- und Wiederherstellungsbezug der abschließenden Infinitive
  choice: Die Aufgaben werden als Wiederherstellung des Landes und erneute Zuteilung verwüsteter Erbteile formuliert.
  alternative: Das Land aufrichten und verwüstete Erbteile als Erbe geben.
  rationale: Der Wiederherstellungsbezug ergibt sich aus den als verwüstet bezeichneten Erbteilen. Die Übersetzung macht diesen Zusammenhang idiomatisch sichtbar, ohne die Art der Wiederherstellung näher festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klaren, allgemein verständlichen Verben. Der Parallelismus der beiden Zeitangaben und der beiden göttlichen Handlungen bleibt erhalten. „Jahwe“ bewahrt den Eigennamen; „zum Bund für das Volk“ erhält die ungewöhnliche und theologisch dichte Aussage des Hebräischen.
