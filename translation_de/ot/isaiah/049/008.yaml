  to: 'So spricht Jahwe: »Zur Zeit der Gunst[a] habe ich dir geantwortet, und am Tag der Rettung[b] habe ich dir geholfen. Ich werde dich behüten[c] und dich zum Bund für das Volk geben[d], um das Land wiederherzustellen[e] und die verwüsteten Erbteile zuzuteilen.«'
  rationale: Die einzige notwendige Korrektur entfernt das nicht ausdrücklich belegte „wieder“ bei „zuzuteilen“. Damit bleibt die Wiederherstellungsdimension des Verses erkennbar, ohne sie bei der Zuteilung als explizite Aussage des hebräischen Verbs auszugeben. Text und Fußnotenanker bleiben vollständig und strukturell unverändert.
