source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: de
  text: 'Erhebe deine Augen und sieh dich ringsum um: Sie alle versammeln sich und kommen zu dir. So wahr ich lebe, spricht Jahwe: Du wirst sie alle wie Schmuck anlegen und sie dir umbinden wie eine Braut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie umbinden, wie es eine Braut tut“. Das Hebräische lässt offen, ob „wie eine Braut“ näher beschreibt, wie Zion den Schmuck anlegt, oder ob die Menschen selbst wie Brautschmuck umgebunden werden.'
    reason: syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Heb deine Augen und schau dich ringsum um
  rationale: Die beiden femininen Singularimperative richten sich an das personifizierte Zion. Die deutsche Wendung bewahrt das Bild des Erhebens der Augen und gibt סָבִיב natürlich als umfassenden Rundblick wieder.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: Sie alle versammeln sich und kommen zu dir
  rationale: Das präsentische Deutsch vermittelt die lebendige prophetische Schau. „Versammeln sich“ lässt die medial-passive Nuance des Nifal offen genug, ohne schwerfällig zu wirken.
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Dies ist die geläufige, würdevolle deutsche Entsprechung der göttlichen Schwurformel.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ gibt die prophetische Formel idiomatisch wieder; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כִּי כֻלָּם כָּעֲדִי תִלְבָּשִׁי
  choice: Du wirst sie alle wie Schmuck anlegen
  rationale: עֲדִי bezeichnet Schmuck beziehungsweise Zierde. Das kollektive deutsche „Schmuck“ passt trotz der Singularform natürlich und wahrt das Bild, dass die heimkehrenden Menschen Zions Zierde sind.
- source_word: וּתְקַשְּׁרִים כַּכַּלָּה
  choice: und sie dir umbinden wie eine Braut
  rationale: Das Verb bezeichnet das An- oder Umbinden von Schmuck. Das zusätzliche „dir“ macht den reflexiven Bezug im Deutschen klar; „wie eine Braut“ erhält den knappen Vergleich und seine mögliche syntaktische Offenheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Transliteration bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von כֻּלָּם („sie alle“)
  choice: Das Pronomen bleibt ohne erläuternden Zusatz
  alternative: deine Kinder / deine Bewohner
  rationale: Der Kontext legt die heimkehrenden Menschen nahe, doch der Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt diese textliche Offenheit.
- issue: Funktion von כִּי nach der Schwurformel
  choice: durch den Doppelpunkt und die bestimmte Zukunftsaussage wiedergegeben
  alternative: denn / wahrlich
  rationale: כִּי führt hier den Inhalt der Schwurformel ein. Im Deutschen ist ein Doppelpunkt natürlicher und vermeidet eine fälschlich kausale Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede an Zion wird durch die Verbformen nicht eigens markiert, ergibt sich aber aus Kontext und Brautbild. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Satz.
