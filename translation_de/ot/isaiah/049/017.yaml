  text: מִֽהֲר֖וּ בָּנָ֑יִ/ךְ מְהָֽרְסַ֥יִ/ךְ וּ/מַחֲרִבַ֖יִ/ךְ מִמֵּ֥/ךְ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: de
  text: Deine Kinder eilen herbei[a]; die dich niedergerissen und verwüstet haben, werden von dir fortziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Erbauer eilen herbei.« Einige alte Textzeugen bezeugen »Erbauer« statt »Kinder«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: eilen herbei
  rationale: Das Verb מהר bedeutet »eilen, sich beeilen«. Im Zusammenhang kehren Zions Kinder zu ihr zurück, während ihre Verwüster fortziehen. »Eilen herbei« macht diese kontextuell vorausgesetzte Richtung deutlich, ohne den Wiederherstellungsgedanken unnötig auszuweiten.
- source_word: בָּנָיִךְ
  choice: deine Kinder
  rationale: Der masoretische Text liest das Wort als »deine Söhne/Kinder«. Da Zion als Mutter und Stadt angesprochen wird, bezeichnet »Kinder« ihre Bewohner beziehungsweise ihre Nachkommen in natürlichem, inklusivem Deutsch. Die alte Lesart »deine Erbauer« wird in einer Fußnote bewahrt.
- source_word: מְהָרְסַיִךְ
  choice: die dich niedergerissen haben
  rationale: Das Partizip von הרס bezeichnet Menschen, die niederreißen oder zerstören. Der Relativsatz klingt im Deutschen natürlich und erhält zugleich das auf die Stadt bezogene Bild des Niederreißens.
- source_word: וּמַחֲרִבַיִךְ
  choice: und verwüstet haben
  rationale: Die Form bezeichnet diejenigen, die etwas öde machen oder verwüsten. Das gemeinsame Subjekt wird im deutschen Relativsatz zusammengefasst; »verwüstet« vermittelt das Ausmaß der Zerstörung klar.
- source_word: מִמֵּךְ
  choice: von dir
  rationale: Die Präposition מן mit Suffix drückt die Trennung von der angesprochenen Zion aus. »Von dir« gibt dies direkt wieder.
- source_word: יֵצֵאוּ
  choice: werden fortziehen
  rationale: יצא bedeutet »hinausgehen, weggehen«. Mit »von dir« und den Zerstörern als Subjekt ist »fortziehen« idiomatisch und bewahrt die räumliche Entfernung von Zion.
theological_decisions:
- issue: Lesart von בָּנָיִךְ
  choice: deine Kinder
  alternative: deine Erbauer
  rationale: Der masoretische Text bietet »deine Kinder/Söhne«, passend zum Motiv, dass Zions Nachkommen zu ihr kommen, während ihre Zerstörer sie verlassen. Einige alte Textzeugen spiegeln »deine Erbauer« wider, was zum Wiederaufbaukontext passt. Die Hauptlesart folgt dem WLC; die echte textliche Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Zion wird entsprechend den femininen hebräischen Suffixen direkt mit »du« angesprochen. Die parallelen Bewegungen — Kinder herbei, Zerstörer fort — werden sprachlich klar hervorgehoben.
