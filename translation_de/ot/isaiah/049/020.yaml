  text: ע֚וֹד יֹאמְר֣וּ בְ/אָזְנַ֔יִ/ךְ בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ צַר לִ֥/י הַ/מָּק֖וֹם גְּשָׁ/ה לִּ֥/י וְ/אֵשֵֽׁבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: de
  text: 'Noch werden die Kinder deines Verlusts zu dir sagen: »Der Platz ist zu eng für mich. Mach mir Platz,[a] damit ich wohnen kann!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Rücke näher für mich« oder »Komm näher für mich«. Die hebräische Form ist ein femininer Imperativ. Im Zusammenhang mit dem zu engen Platz ist die Aufforderung idiomatisch wohl als Bitte zu verstehen, Platz zu schaffen: »Mach mir Platz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֚וֹד
  choice: Noch
  rationale: Das Adverb bezeichnet hier die Fortsetzung beziehungsweise das weitere Hinzukommen des angekündigten Geschehens und leitet passend die zukünftige Aussage ein.
- source_word: יֹאמְר֣וּ
  choice: werden … sagen
  rationale: Der Qal-Imperfekt der 3. Person Plural bezeichnet im prophetischen Zusammenhang ein zukünftiges Reden.
- source_word: בְ/אָזְנַ֔יִ/ךְ
  choice: dir … ins Ohr
  rationale: Die körperhafte hebräische Wendung bleibt in einer geläufigen deutschen Redensart erhalten und macht deutlich, dass Zion die Worte unmittelbar hört.
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: die Kinder, die du verloren hattest
  rationale: בני kann kollektiv »Kinder« bedeuten; שִׁכֻּלַיִךְ bezeichnet Zions Verlust beziehungsweise Beraubung um Kinder. Die Formulierung ist im Deutschen verständlich, während eine Fußnote die ungewöhnliche Bildstruktur des Hebräischen offenhält.
- source_word: צַר לִ֥י הַ/מָּק֖וֹם
  choice: Der Platz ist zu eng für mich
  rationale: צַר bezeichnet räumliche Enge; die deutsche Wendung gibt die durch die große Zahl der Heimkehrenden entstandene Überfüllung unmittelbar wieder.
- source_word: גְּשָׁ/ה לִּ֥י
  choice: Mach mir Platz
  rationale: Die feminine Imperativform von נגשׁ bedeutet formal »tritt näher/heran«. Im Zusammenhang mit dem zu engen Platz fordert die Wendung idiomatisch dazu auf, Raum zu schaffen; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וְ/אֵשֵֽׁבָה
  choice: damit ich hier wohnen kann
  rationale: ישׁב bezeichnet hier das Sich-Niederlassen oder Wohnen, nicht bloß das Sitzen. »Damit« gibt den naheliegenden Zweck der vorausgehenden Aufforderung wieder; »hier« macht den im Kontext gemeinten Ort im Deutschen natürlich kenntlich.
theological_decisions:
- issue: Bezug von בְּנֵי שִׁכֻּלָיִךְ
  choice: Kinder, die Zion verloren hatte
  alternative: Kinder aus Zions Zeit der Kinderlosigkeit beziehungsweise Kinder ihres Verlusts
  rationale: Die knappe hebräische Genitivverbindung lässt offen, wie genau die Kinder mit Zions Zustand des Kinderverlusts verbunden sind. Der Haupttext folgt der im Kontext naheliegenden Beziehung zu den verloren geglaubten Kindern, ohne die ungewöhnliche Ausgangsform in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und anschaulich; »ins Ohr sagen« bewahrt die Körperlichkeit des Hebräischen, ohne altertümlich zu wirken. Die beiden Fußnoten markieren echte lexikalische und syntaktische Unsicherheiten.
