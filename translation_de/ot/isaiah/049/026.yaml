  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: de
  text: Ich werde deine Unterdrücker ihr eigenes Fleisch essen lassen, und sie werden von ihrem eigenen Blut trunken werden wie von jungem Wein.[a] Dann wird alles Fleisch erkennen, dass ich, Jahwe, dein Retter und dein Erlöser bin, der Mächtige Jakobs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie von Süßwein“. Das hebräische Wort עָסִיס kann jungen, süßen oder frisch gepressten Wein bezeichnen.'
    reason: 'Lexikalische Alternative: עָסִיס hat ein Bedeutungsspektrum, das im Deutschen nicht mit einer einzigen Bezeichnung vollständig abgedeckt wird.'
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: Ich werde … essen lassen
  rationale: Der Hifil von אכל ist kausativ. Die Wiedergabe bewahrt diese Bedeutung und klingt im Deutschen natürlicher als „ich werde … zu essen geben“.
- source_word: מוֹנַיִךְ
  choice: deine Unterdrücker
  rationale: Das Wort bezeichnet diejenigen, die Zion bedrängen oder misshandeln. „Unterdrücker“ ist prägnant und entspricht dem Gerichtskontext.
- source_word: בְּשָׂרָם
  choice: ihr eigenes Fleisch
  rationale: Das Possessivsuffix wird durch „eigenes“ verdeutlicht; so tritt die erschreckende Umkehrung der Gewalt klar hervor.
- source_word: וְכֶעָסִיס
  choice: wie an Süßwein
  rationale: עָסִיס bezeichnet süßen beziehungsweise frisch gepressten Wein oder Saft. Im Zusammenhang mit dem Sich-Berauschen ist „Süßwein“ eine natürliche Wiedergabe; die mögliche Alternative wird in der Fußnote genannt.
- source_word: דָּמָם
  choice: an ihrem eigenen Blut
  rationale: Das Possessivsuffix und die Parallelität zu „ihrem eigenen Fleisch“ werden ausdrücklich wiedergegeben.
- source_word: יִשְׁכָּרוּן
  choice: sie werden sich … berauschen
  rationale: Das Verb bezeichnet das Betrunken- oder Berauschtwerden. Die reflexive deutsche Form ist idiomatisch und bewahrt das starke Bild.
- source_word: כָל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche prophetische Wendung bewahrt den universalen Umfang und die innerbiblischen Anklänge besser als eine Einebnung zu „alle Menschen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מוֹשִׁיעֵךְ
  choice: dein Retter
  rationale: Die knappe Bezeichnung gibt Gottes rettende Funktion und Beziehung zu Zion in natürlichem modernem Deutsch wieder.
- source_word: וְגֹאֲלֵךְ
  choice: dein Erlöser
  rationale: „Erlöser“ bewahrt den für Jesaja wichtigen Bedeutungszusammenhang von גאל, ohne die spezifischere Vorstellung eines Verwandtenlösers in den Vers hineinzutragen.
- source_word: אֲבִיר יַעֲקֹב
  choice: der Mächtige Jakobs
  rationale: Die Wiedergabe folgt dem hebräischen „Jakob“ und erhält den feststehenden Gottes-Titel mit seinem Schwerpunkt auf Macht und Stärke.
theological_decisions:
- issue: Wiedergabe der drastischen Gerichtsbildsprache
  choice: Die Bilder vom Essen des eigenen Fleisches und vom Berauschen am eigenen Blut werden direkt beibehalten.
  alternative: Die Aussage allgemein als Selbstvernichtung der Feinde umschreiben.
  rationale: Die schockierende Bildsprache gehört zur prophetischen Ankündigung der Umkehrung von Zions Unterdrückung. Eine Abschwächung würde die rhetorische und theologische Spannung des Ausgangstextes verdecken.
- issue: Wiedergabe von כָל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen / die ganze Menschheit
  rationale: Die formnahe Wendung erhält das prophetische Register, den universalen Horizont und die innerbiblischen Bezüge, ohne den Ausdruck unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Bildkraft. „Alles Fleisch“ und „der Mächtige Jakobs“ erhalten den gehobenen biblischen Ton, während der Satzbau für heutige Leser verständlich bleibt.
