id: ISA.49.13
reference: Isaiah 49:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: de
  text: Jubelt, ihr Himmel, und freue dich, Erde! Ihr Berge, brecht in Jubel aus! Denn Jahwe[a] hat sein Volk getröstet, und mit seinen Elenden[b] wird er Erbarmen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seinen Armen“, „seinen Demütigen“ oder „seinen Bedrängten“. Das hebräische Wort kann Menschen in Not, Armut oder erniedrigter Stellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנּוּ
  choice: Jubelt
  rationale: Der pluralische Imperativ von רנן bezeichnet lauten, freudigen Jubel. „Jubelt“ ist im Deutschen natürlich und bewahrt den poetischen Aufruf.
- source_word: שָׁמַיִם
  choice: ihr Himmel
  rationale: Im kosmischen Parallelismus mit Erde und Bergen bezeichnet שָׁמַיִם die Himmel; die Anrede mit „ihr“ macht den Imperativ im Deutschen deutlich.
- source_word: וְגִילִי
  choice: und freue dich
  rationale: Der feminine Singularimperativ richtet sich an die Erde. „Freue dich“ gibt die personifizierende direkte Anrede idiomatisch wieder.
- source_word: אָרֶץ
  choice: Erde
  rationale: Der Zusammenhang mit Himmeln und Bergen spricht für die kosmische Bedeutung „Erde“, nicht für ein bestimmtes Land.
- source_word: יפצחו ... רִנָּה
  choice: brecht in Jubel aus
  rationale: Die poetische Aufforderung und die Wendung mit פצח und רנה werden durch die natürliche deutsche Verbindung „in Jubel ausbrechen“ wiedergegeben.
- source_word: נִחַם
  choice: hat ... getröstet
  rationale: Das Perfekt bezeichnet hier Jahwes tröstendes Handeln an seinem Volk; das deutsche Perfekt bringt die vollzogene Handlung mit gegenwärtiger Bedeutung passend zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: „Volk“ bewahrt den kollektiven und bundesbezogenen Sinn.
- source_word: וַעֲנִיָּו
  choice: mit seinen Elenden
  rationale: עָנִי kann Bedrängte, Arme oder Demütige bezeichnen. „Elende“ hält den umfassenden Sinn von Not und Bedrängnis offen, ohne ihn ausschließlich wirtschaftlich zu bestimmen.
- source_word: יְרַחֵם
  choice: wird er Erbarmen haben
  rationale: Die Imperfektform bezeichnet das folgende erbarmende Handeln Jahwes. Die deutsche Zukunftsform wahrt den zeitlichen Kontrast zum vorangehenden Perfekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; eine Fußnote nennt die traditionelle Ersetzung durch einen Titel.
- issue: Bedeutungsumfang von עָנִי
  choice: seine Elenden
  alternative: seine Armen / seine Demütigen / seine Bedrängten
  rationale: Das Wort umfasst soziale Not, Bedrängnis und eine erniedrigte Stellung. Die Übersetzung entscheidet nicht einseitig zugunsten wirtschaftlicher Armut oder innerer Demut; die Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Poetisch, würdevoll und zugleich gegenwärtig verständlich. Die personifizierenden Anreden an Himmel, Erde und Berge bleiben erhalten. Zwei kurze Ausrufesätze bilden den kosmischen Jubel ab; der begründende Schlusssatz wahrt den Wechsel von bereits geschehenem Trost zu angekündigtem Erbarmen.
