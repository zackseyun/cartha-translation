source:
  edition: WLC
  text: הִנֵּה אֵ֕לֶּה מֵ/רָח֖וֹק יָבֹ֑אוּ וְ/הִֽנֵּה אֵ֨לֶּה֙ מִ/צָּפ֣וֹן וּ/מִ/יָּ֔ם וְ/אֵ֖לֶּה מֵ/אֶ֥רֶץ סִינִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/012.yaml
  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: de
  text: Seht, diese kommen von weit her! Und seht, diese kommen aus dem Norden und vom Meer[a], und diese aus dem Land Sinim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „aus dem Westen“; das „Meer“ kann im hebräischen Sprachgebrauch als geografische Bezeichnung für den Westen dienen.'
    reason: lexical_alternative
  - marker: b
    text: „Sinim“ ist ein nicht sicher bestimmter Ortsname. Als mögliche Identifizierung werden unter anderem Syene beziehungsweise Assuan im Süden Ägyptens vorgeschlagen; manche denken an eine weiter entfernte Region im Osten. Die Lage bleibt ungewiss.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird in gegenwärtigem, würdigem Deutsch mit „Seht“ wiedergegeben. Ihre Wiederholung im Hebräischen bleibt erhalten.
- source_word: אֵלֶּה
  choice: diese / jene
  rationale: Das Demonstrativpronomen gliedert die verschiedenen herankommenden Gruppen. Beim letzten Vorkommen verdeutlicht „jene“ im Deutschen den Wechsel zu einer weiteren Gruppe, ohne den Aussagegehalt zu verändern.
- source_word: מֵרָחוֹק
  choice: von weit her
  rationale: Diese geläufige deutsche Wendung gibt die räumliche Ferne natürlich und präzise wieder.
- source_word: יָבֹאוּ
  choice: kommen
  rationale: Das hebräische Imperfekt bezeichnet hier im prophetischen Zusammenhang ein bevorstehendes Kommen; das deutsche Präsens wirkt nach „Seht“ anschaulich und kann ebenso zukünftiges Geschehen ausdrücken.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: Klare und idiomatische Wiedergabe der Herkunftsangabe.
- source_word: וּמִיָּם
  choice: und vom Meer
  rationale: Die wörtliche Bedeutung „Meer“ bleibt im Haupttext erhalten. Da יָם geografisch auch den Westen bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
- source_word: מֵאֶרֶץ סִינִים
  choice: aus dem Land Sinim
  rationale: Der unsicher identifizierte Ortsname wird transliteriert und nicht durch eine spekulative geografische Zuordnung ersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die zweimalige Aufforderung „Seht“ bewahrt die deiktische Struktur; die Ausrufezeichen machen den aufmerksamkeitslenkenden Charakter kenntlich. Die geografischen Unsicherheiten werden nicht im Haupttext aufgelöst.
