base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: de
  text: Und ich werde alle meine Berge zu einem Weg machen[a], und meine Straßen werden erhöht werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für einen Weg« oder »als Weg«. Das Hebräische kann hier sowohl das Ergebnis als auch den Zweck betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Straßen werden emporgehoben«. Das hebräische Wort kann eine aufgeschüttete oder ausgebaute Straße bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Und ich mache
  rationale: שׂים kann »setzen, stellen, machen« bedeuten. Zusammen mit לַדָּרֶךְ gibt »mache … zu« den resultativen Sinn natürlich wieder.
- source_word: כָל הָרַי
  choice: alle meine Berge
  rationale: Die konkrete topografische Bildsprache und der Suffix der 1. Person Singular bleiben unmittelbar erhalten.
- source_word: לַדָּרֶךְ
  choice: zu einem Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Straße. Die Formulierung bewahrt den möglichen resultativen Sinn, ohne die ebenso mögliche Zweckbedeutung zu verschweigen.
- source_word: וּמְסִלֹּתַי
  choice: und meine Hochstraßen
  rationale: מְסִלָּה kann eine aufgeschüttete beziehungsweise ausgebaute Straße bezeichnen. »Hochstraße« erhält diesen Bedeutungsaspekt und passt zum folgenden Erhöhen.
- source_word: יְרֻמוּן
  choice: werden erhöht
  rationale: Die Form von רום hat hier passiven beziehungsweise intransitiven Sinn. »Werden erhöht« wahrt die konkrete Straßenbau-Bildsprache und vermeidet das abstraktere »werden verherrlicht«.
theological_decisions:
- issue: Deutung der Weg- und Wiederherstellungsbildsprache
  choice: Das konkrete Bild, dass Gott Berge zu einem passierbaren Weg macht und Straßen erhöht, bleibt stehen.
  alternative: Die Aussage ausdrücklich als geistliche Hindernisbeseitigung oder ausschließlich als buchstäbliche Rückkehrroute deuten.
  rationale: Der hebräische Text lässt offen, ob die Topografie wörtlich, bildlich oder in beiden Sinnen zu verstehen ist; diese Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. »Hochstraßen« ist bewusst konkret und nicht im heutigen Sinn einer ausschließlich auf Pfeilern geführten Straße gemeint; die Fußnote erläutert die antike Straßenbaunuance.
