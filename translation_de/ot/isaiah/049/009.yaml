  text: לֵ/אמֹ֤ר לַֽ/אֲסוּרִים֙ צֵ֔אוּ לַ/אֲשֶׁ֥ר בַּ/חֹ֖שֶׁךְ הִגָּל֑וּ עַל דְּרָכִ֣ים יִרְע֔וּ וּ/בְ/כָל שְׁפָיִ֖ים מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: de
  text: 'um zu den Gefangenen zu sagen: »Kommt heraus!« und zu denen in der Finsternis: »Zeigt euch!«[a] Entlang der Wege werden sie weiden, und auf allen kahlen Höhen[b] wird ihre Weide sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Werdet sichtbar!« oder: »Kommt zum Vorschein!«'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint sind frei liegende, unbewaldete Höhen; auch: »kahle Hügel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: um … zu sagen
  rationale: Der Infinitivus constructus von אמר führt den Inhalt des im vorigen Zusammenhang genannten Auftrags ein. Die deutsche Infinitivkonstruktion bewahrt diese syntaktische Anbindung.
- source_word: לַאֲסוּרִים
  choice: zu den Gefangenen
  rationale: Das passive Partizip von אסר bezeichnet Menschen, die gebunden oder gefangen gehalten werden. »Gefangene« ist im Deutschen natürlich und wahrt das konkrete Befreiungsbild.
- source_word: צֵאוּ
  choice: Kommt heraus!
  rationale: Der pluralische Imperativ von יצא fordert zum Verlassen des bisherigen Aufenthaltsorts auf. »Kommt heraus« ist eine unmittelbare, idiomatische Aufforderung.
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: zu denen in der Finsternis
  rationale: Die Relativkonstruktion bezeichnet eine weitere Gruppe. »Finsternis« lässt sowohl einen konkreten als auch einen übertragenen Sinn offen.
- source_word: הִגָּלוּ
  choice: Zeigt euch!
  rationale: Der Nifal-Imperativ von גלה fordert dazu auf, sichtbar zu werden oder hervorzutreten. »Zeigt euch« passt zur Anrede derer, die sich in der Finsternis befinden, ohne die mögliche Nuance »werdet sichtbar« auszuschließen.
- source_word: עַל דְּרָכִים
  choice: entlang der Wege
  rationale: על mit dem Plural »Wege« bezeichnet hier den Bereich, in dem geweidet wird. »Entlang der Wege« gibt die räumliche Verteilung im natürlichen Deutsch wieder.
- source_word: יִרְעוּ
  choice: werden sie weiden
  rationale: Das Qal-Imperfekt von רעה bezeichnet das Weiden. Die Wiedergabe bewahrt das Hirten- und Herdenbild, in dem die befreiten Menschen wie eine versorgte Herde erscheinen.
- source_word: שְׁפָיִם
  choice: kahle Höhen
  rationale: Das Wort bezeichnet unbewaldete oder frei liegende Höhen. »Kahle Höhen« wahrt den topografischen Sinn und vermeidet die andernorts möglichen kultischen Assoziationen von »Höhen« als festem Fachausdruck.
- source_word: מַרְעִיתָם
  choice: ihre Weide
  rationale: Das Substantiv bezeichnet Weide oder Weideplatz und trägt ein Suffix der 3. Person Plural. Der hebräische Singular kann kollektiv verstanden werden; »ihre Weide« ist knapp und bildkräftig.
theological_decisions:
- issue: Konkreter oder übertragener Sinn von Gefangenschaft und Finsternis
  choice: Die konkreten Bilder »Gefangene« und »Finsternis« bleiben ohne erklärende Eingrenzung stehen.
  alternative: Den Vers ausdrücklich auf die Rückkehr aus dem Exil oder ausdrücklich auf geistliche Befreiung beziehen.
  rationale: Der Wortlaut kann die historische Wiederherstellung Israels und zugleich weiter reichende Heilsaussagen anklingen lassen. Die Übersetzung legt die Spannung nicht einseitig fest.
- issue: Menschen als weidende Herde
  choice: Das Weidebild wird wörtlich bewahrt.
  alternative: Das Bild erläuternd als Versorgung auf dem Heimweg wiedergeben.
  rationale: Der hebräische Text wechselt ohne ausdrückliche Erklärung in die pastorale Metaphorik. Eine Auflösung des Bildes würde mehr festlegen, als der Ausgangstext sagt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist knapp gehalten; »Finsternis«, »weiden« und »Weide« bewahren die Bildsprache des Hebräischen. Der Versanfang bleibt als syntaktische Fortsetzung des vorhergehenden Verses formuliert.
