  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: de
  text: Sieh, ich habe dich in meine Handflächen eingraviert[a]; deine Mauern stehen mir ständig vor Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eingeschrieben“ oder „eingeritzt“. Das hebräische Verb bezeichnet ein Einschneiden, Eingravieren oder Einschreiben und unterstreicht die Dauerhaftigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Zusage nachdrücklich hervor; „Sieh“ ist modern, knapp und würdevoll.
- source_word: עַל כַּפַּיִם
  choice: in meine Handflächen
  rationale: כַּפַּיִם ist der Dual von „Handfläche/Hand“. Beim deutschen Verb „einritzen“ bezeichnet „in“ die Fläche, in die etwas dauerhaft eingeschrieben wird, natürlicher als ein mechanisches „auf“.
- source_word: חַקֹּתִיךְ
  choice: ich habe dich … eingeritzt
  rationale: Das Verb חקק bezeichnet Einritzen, Eingravieren oder Einschreiben. „Eingeritzt“ bewahrt das konkrete Bild und den Eindruck von Dauerhaftigkeit; das feminine Singularsuffix bleibt als „dich“ erhalten.
- source_word: חוֹמֹתַיִךְ
  choice: deine Mauern
  rationale: Die schlichte Wiedergabe wahrt den Bezug auf die Mauern Zions/Jerusalems, ohne den im Vers nicht ausdrücklich genannten Stadtnamen einzufügen.
- source_word: נֶגְדִּי תָּמִיד
  choice: stehen mir ständig vor Augen
  rationale: Die idiomatische deutsche Wendung gibt sowohl das fortwährende Gegenwärtigsein als auch die bildhafte Ausrichtung „vor mir“ natürlich wieder.
theological_decisions:
- issue: Anthropomorphes Bild von Gottes Handflächen und dem Einritzen
  choice: 'Das Bild wird unmittelbar beibehalten: „ich habe dich in meine Handflächen eingeritzt“.'
  alternative: Deutende Paraphrase wie „Ich vergesse dich niemals“.
  rationale: Der hebräische Text vermittelt Gottes bleibende Zuwendung durch ein bewusst körperliches und dauerhaftes Bild; eine Paraphrase würde die Bildkraft und Konkretheit vermindern.
- issue: Bezug der femininen Singularsuffixe
  choice: Die Anrede bleibt mit „dich/deine“ stehen.
  alternative: Den Namen „Zion“ oder „Jerusalem“ ausdrücklich einsetzen.
  rationale: Der Kontext identifiziert die personifizierte Adressatin, während der Vers selbst nur feminine Pronomen verwendet. Die Übersetzung wahrt diese kontextuelle Offenheit.
translation_notes:
  register: Modernes Standarddeutsch mit würdevoll-poetischem Ton. Die Parallelität der beiden Halbverse und das eindringliche Körperbild bleiben erhalten; „vor Augen stehen“ ist idiomatisch, ohne die fortwährende göttliche Aufmerksamkeit abzuschwächen.
