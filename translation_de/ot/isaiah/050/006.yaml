base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
translation:
  language: de
  text: Meinen Rücken bot ich denen dar, die mich schlugen, und meine Wangen denen, die mir den Bart ausrissen.[a] Mein Gesicht verbarg ich nicht vor Schmach und Bespeien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Ausrupfenden«; was ausgerissen wird, steht im Hebräischen nicht ausdrücklich da. Im Zusammenhang mit den Wangen ist wahrscheinlich der Bart gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: meinen Rücken
  rationale: גֵּו bezeichnet den Rücken beziehungsweise den Körper; im Zusammenhang körperlicher Schläge ist »Rücken« die natürliche und konkrete Wiedergabe.
- source_word: נָתַתִּי
  choice: bot ich dar
  rationale: נתן bedeutet grundsätzlich »geben«. »Darbot« gibt hier idiomatisch wieder, dass der Sprecher seinen Rücken bewusst preisgab, ohne mehr als den Kontext auszudeuten.
- source_word: לְמַכִּים
  choice: denen, die mich schlugen
  rationale: Das Partizip von נכה bezeichnet die Schlagenden. Das ergänzte »mich« ist im Deutschen durch »meinen Rücken« eindeutig erschlossen und ergibt eine natürliche Formulierung.
- source_word: וּלְחָיַי
  choice: und meine Wangen
  rationale: לְחִי bezeichnet Wange oder Kieferpartie; der Plural »Wangen« entspricht dem Bild und ist im Deutschen geläufig.
- source_word: לְמֹרְטִים
  choice: denen, die mir den Bart ausrissen
  rationale: מרט bedeutet »ausreißen, ausrupfen«, besonders von Haar. Der Gegenstand bleibt im Hebräischen unausgesprochen; nach »meine Wangen« ist der Bart sehr wahrscheinlich gemeint, wird aber durch eine Fußnote als Ergänzung kenntlich gemacht.
- source_word: פָּנַי
  choice: mein Gesicht
  rationale: Direkte und natürliche Wiedergabe von פָּנִים mit dem Suffix der ersten Person.
- source_word: לֹא הִסְתַּרְתִּי
  choice: verbarg ich nicht
  rationale: Das Hifil von סתר bedeutet »verbergen«. Die deutsche Wortstellung bewahrt den Nachdruck der Verneinung in einer würdigen, flüssigen Form.
- source_word: מִכְּלִמּוֹת
  choice: vor Schmach
  rationale: כְּלִמָּה umfasst Schande, Demütigung und Schmach. »Schmach« bewahrt sowohl die soziale Entehrung als auch den gehobenen poetischen Ton.
- source_word: וָרֹק
  choice: und Speichel
  rationale: רֹק bezeichnet Speichel beziehungsweise Spucke. »Speichel« bleibt konkret und lässt sich in der Präpositionalfügung »vor Schmach und Speichel« knapp und würdig wiedergeben.
theological_decisions:
- issue: Ob die messianische beziehungsweise christologische Anwendung ausdrücklich in die Übersetzung aufgenommen werden soll
  choice: Die Aussage bleibt auf der Ebene des hebräischen Ich-Sprechers und nennt weder den Messias noch Jesus ausdrücklich.
  alternative: Die Formulierung so gestalten, dass sie unmittelbar Jesu Passion als Erfüllung hervorhebt.
  rationale: Der Vers wird christologisch verstanden und angewandt, spricht im Hebräischen selbst jedoch in der ersten Person. Die Übersetzung bewahrt diese Aussageform und importiert keine über den Wortlaut hinausgehende Identifikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. »Bot ich dar« und »Schmach« tragen dem gehobenen prophetischen Register Rechnung, bleiben aber allgemein verständlich. Die Satzstruktur wahrt den Parallelismus des Hebräischen.
