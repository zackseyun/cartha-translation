base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: de
  text: 'So spricht der HERR: Wo ist der Scheidebrief eurer Mutter, mit dem ich sie fortgeschickt habe? Oder an welchen meiner Gläubiger habe ich euch verkauft? Seht: Wegen eurer Schuld seid ihr verkauft worden, und wegen eurer Vergehen wurde eure Mutter fortgeschickt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֵפֶר כְּרִיתוּת
  choice: Scheidebrief
  rationale: Die feste hebräische Verbindung bezeichnet eine schriftliche Scheidungsurkunde; „Scheidebrief“ ist im Deutschen prägnant und sachlich verständlich.
- source_word: נֹשַׁי
  choice: meiner Gläubiger
  rationale: Das Wort bezeichnet Personen, denen jemand etwas schuldet; „Gläubiger“ bewahrt das wirtschaftlich-rechtliche Bild.
- source_word: עֲוֺנֹתֵיכֶם
  choice: eurer Schuld
  rationale: Der Ausdruck kann sowohl schuldhafte Verfehlung als auch die daraus erwachsende Schuld bezeichnen; der Singular als Kollektivum klingt natürlich, ohne die Verantwortlichkeit abzuschwächen.
- source_word: פִשְׁעֵיכֶם
  choice: eurer Vergehen
  rationale: Das Wort bezeichnet bewusste Übertretungen beziehungsweise Auflehnung; „Vergehen“ unterscheidet es von עָוֹן, ohne das Bild unnötig dogmatisch festzulegen.
- source_word: שִׁלַּחְתִּיהָ / שֻׁלְּחָה
  choice: fortgeschickt hätte / wurde ... fortgeschickt
  rationale: Die wiederholte Wurzel wird im Deutschen sichtbar gehalten; im Zusammenhang mit dem Scheidebrief trägt „fortschicken“ die Bedeutung der Entlassung aus der Ehe.
theological_decisions:
- issue: Rhetorische Fragen und Gottes Verantwortung für die Trennung
  choice: „mit dem ich sie fortgeschickt hätte?“ und „hätte ich euch verkauft?“
  alternative: 'Indikativische Wiedergabe: „mit dem ich sie fortgeschickt habe“ / „verkaufte ich euch“'
  rationale: Die Fragen verlangen implizit die Antwort „Es gibt keinen“ beziehungsweise „an keinen“. Der Konjunktiv II macht im Deutschen deutlich, dass Gott die Vorstellung einer gewöhnlichen Scheidung oder eines Verkaufs wegen eigener Verschuldung zurückweist; der folgende Satz nennt stattdessen die Schuld des Volkes als Ursache.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: „der HERR“ entspricht der etablierten deutschen Bibelkonvention und wahrt den besonderen Status des Gottesnamens, ohne eine unsichere Vokalisierung in den Lesetext einzutragen.
- issue: Verhältnis von Mutter und Kindern im Bild
  choice: „eure Mutter“ und „euch“ unverändert nebeneinander
  alternative: Explizite Deutung als Zion und seine Bewohner
  rationale: Der hebräische Text entfaltet ein Familien- und Schuldnerbild, benennt dessen Referenten hier aber nicht ausdrücklich. Die Übersetzung bewahrt diese Bildspannung, statt die Auslegung in den Text einzubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechts- und Schuldbilder bleiben knapp und parallel gestaltet. „Seht“ gibt הֵן als aufmerksamkeitslenkenden Ausdruck wieder. Der Konjunktiv in den rhetorischen Fragen sorgt für idiomatisches Deutsch und bewahrt ihre verneinende Stoßrichtung.
