base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: de
  text: Doch der Herr Yahweh hilft mir. Darum bin ich nicht zuschanden geworden. Darum habe ich mein Gesicht hart gemacht wie Feuerstein,[b] und ich weiß, dass ich nicht beschämt werden werde.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Das Bild vom hart gemachten Gesicht wie Feuerstein bezeichnet festen, unbeirrbaren Entschluss angesichts von Widerstand.
    reason: cultural_note
  - marker: c
    text: 'Oder: „dass ich nicht zuschanden werde“ beziehungsweise „dass ich nicht enttäuscht werde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: Doch GOTT, der Herr
  rationale: Die zusammengesetzte Gottesbezeichnung אֲדֹנָי יְהוִה wird in einer im Deutschen vertrauten, ehrfürchtigen Form wiedergegeben. „Doch“ nimmt den Gegensatz zum vorausgehenden Zusammenhang auf.
- source_word: יַעֲזָר לִי
  choice: hilft mir
  rationale: Das Imperfekt drückt hier gegenwärtige und fortdauernde Zuversicht aus; „hilft mir“ lässt die zeitliche Weite offen.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die zweimalige Wiederholung des hebräischen Folgerungsausdrucks bleibt als rhetorische Struktur erhalten.
- source_word: לֹא נִכְלָמְתִּי
  choice: bin ich nicht zuschanden geworden
  rationale: Das Nifal von כלם bezeichnet erfahrene Schmach oder Demütigung. Das deutsche Perfekt bewahrt die resultative Form und „zuschanden geworden“ passt zum öffentlichen Ehrverlust.
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  choice: habe ich mein Gesicht hart wie Feuerstein gemacht
  rationale: Die konkrete Körpermetapher wird bewahrt; das ergänzte „hart“ macht den im Vergleich liegenden Gedanken im natürlichen Deutschen verständlich.
- source_word: וָאֵדַע
  choice: und ich weiß
  rationale: Das Präsens gibt die feste, gegenwärtige Gewissheit des Sprechers idiomatisch wieder.
- source_word: לֹא אֵבוֹשׁ
  choice: ich nicht beschämt dastehen werde
  rationale: בוש kann sowohl Scham als auch das öffentliche Scheitern einer Hoffnung bezeichnen. Die Formulierung wahrt diese äußere, resultative Seite und unterscheidet sie leicht vom vorangehenden כלם.
theological_decisions:
- issue: Wiedergabe der zusammengesetzten Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr JHWH / Herr Jahwe
  rationale: Die Hauptfassung verwendet eine im deutschen Bibelgebrauch verständliche Ersatzlesung für den Gottesnamen, ohne die beiden Bestandteile zu einem einzigen Titel zu verschmelzen. Eine Fußnote legt die hebräische Form offen, sodass der Eigenname nicht unsichtbar bleibt.
- issue: Zeitbezug von לֹא נִכְלָמְתִּי und לֹא אֵבוֹשׁ
  choice: gegenwärtig-resultative Erfahrung, gefolgt von Zukunftsgewissheit
  alternative: beide Aussagen futurisch wiedergeben
  rationale: 'Die unterschiedliche hebräische Verbform wird im Deutschen sichtbar gehalten: Das Perfekt blickt auf einen bereits geltenden Zustand, das Imperfekt auf die sichere Erwartung. Die Aussage wird nicht auf eine bestimmte christologische oder historische Erfüllung festgelegt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Darum“ und die markante Feuerstein-Metapher bleiben erhalten. „Zuschanden geworden“ ist leicht gehoben, aber allgemein verständlich und trägt das öffentliche Schammotiv genauer als rein innerliches „sich schämen“.
