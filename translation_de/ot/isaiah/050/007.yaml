revisions:
- from: Doch GOTT, der Herr, hilft mir.[a] Darum bin ich nicht zuschanden geworden. Darum habe ich mein Gesicht hart wie Feuerstein gemacht,[b] und ich weiß, dass ich nicht beschämt dastehen werde.[c]
  to: Doch der Herr Yahweh hilft mir. Darum bin ich nicht zuschanden geworden. Darum habe ich mein Gesicht hart gemacht wie Feuerstein,[b] und ich weiß, dass ich nicht beschämt werden werde.[c]
  rationale: Die Fassung stellt die Gottesbezeichnung auf „der Herr Yahweh“ um, um אֲדֹנָי יְהוִה in der Quellreihenfolge wiederzugeben und den Gottesnamen gemäß der Audit-Spur sichtbar zu machen. Die überflüssig gewordene Fußnote a entfällt. Die Feuersteinmetapher wird sprachlich geglättet, ohne ihren entschlossenen Charakter auszudeuten. Die beiden Aussagen über Schmach bleiben als vergangene beziehungsweise künftige Gewissheit erkennbar.
  reviewer_model: gpt-5.6-terra
