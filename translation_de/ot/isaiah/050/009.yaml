  terminology: „Der Herr Jahwe“ bewahrt Titel und Gottesnamen ohne konfessionelle Überdeutung. „Schuldig sprechen“ ist für die juristische Bedeutung treffend; die Fußnote bietet mit „verurteilen“ eine sinnvolle idiomatische Alternative. „Kleid“ und „Motte“ geben die hebräischen Bildträger unmittelbar wieder.
