id: ISA.50.9
reference: Isaiah 50:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: de
  text: Siehe, der Herr Jahwe hilft mir. Wer ist es, der mich schuldig sprechen wird?[a] Siehe, sie alle werden verschleißen wie ein Kleid; eine Motte wird sie fressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer wird mich verurteilen?“ Das hebräische Verb ist ein Rechtsbegriff und bedeutet, jemanden für schuldig zu erklären oder im Gericht zu verurteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet beide Aussagen mit feierlichem Nachdruck ein. „Siehe“ bewahrt den prophetischen Ton und bleibt im biblischen Kontext gut verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Wiedergabe erhält sowohl den Titel אֲדֹנָי als auch den ausdrücklich gebrauchten Gottesnamen יהוה und folgt ihrer Reihenfolge im Hebräischen.
- source_word: יַעֲזָר לִי
  choice: hilft mir
  rationale: Das Imperfekt kann hier gegenwärtige beziehungsweise fortdauernde Hilfe mit Zukunftsbezug ausdrücken. Das Präsens passt zur zuversichtlichen Aussage des Sprechers.
- source_word: מִי הוּא
  choice: Wer ist es
  rationale: Die Formulierung bewahrt die rhetorische Hervorhebung durch das ausdrückliche Pronomen, ohne im Deutschen unnatürlich zu klingen.
- source_word: יַרְשִׁיעֵנִי
  choice: wird mich schuldig sprechen
  rationale: Der Hifil von רשע bezeichnet im forensischen Sinn das Erklären beziehungsweise Sprechen einer Person für schuldig.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Formulierung gibt den umfassenden Bezug auf sämtliche Gegner natürlich und prägnant wieder.
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: werden verschleißen wie ein Kleid
  rationale: „Verschleißen“ erhält das konkrete Bild eines Kleidungsstücks, das allmählich abgenutzt und unbrauchbar wird.
- source_word: עָשׁ יֹאכְלֵם
  choice: eine Motte wird sie fressen
  rationale: Die wörtliche, anschauliche Redeweise führt das Bild des zerfallenden Kleidungsstücks fort.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: „Der Herr Jahwe“ lässt beide hebräischen Bestandteile sichtbar und gibt den Gottesnamen als Namen wieder, ohne die Aussage konfessionell auszudeuten.
- issue: Gerichtliche Bedeutung von יַרְשִׁיעֵנִי
  choice: wird mich schuldig sprechen
  alternative: wird mich verurteilen
  rationale: Die gewählte Fassung hält den forensischen Akt des Schuldigsprechens ausdrücklich fest. „Verurteilen“ ist möglich, kann aber stärker an die anschließende Strafverhängung denken lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem prophetischem Nachdruck. Die kurzen Sätze und die rhetorische Frage folgen der markanten Struktur des Hebräischen; das konkrete Kleidungs- und Mottenbild bleibt unverändert.
