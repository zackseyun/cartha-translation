  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen wieder: die emphatische Partikel zweimal („Siehe“), den zusammengesetzten Gottesbezug אֲדֹנָי יְהוִה („der Herr Jahwe“), die gegenwärtig-vertrauensvolle Hilfeaussage, die rhetorisch zugespitzte forensische Frage sowie das Bild vom verschleißenden Kleid und der Motte. „Mich schuldig sprechen“ trifft den Hifil von רשע präzise im gerichtlichen Sinn.'
