source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: de
  text: Der Herr Yahweh[a] hat mir die Zunge der Unterwiesenen[b] gegeben, damit ich weiß, wie ich den Müden mit einem Wort aufrichten kann.[c] Morgen für Morgen weckt er, weckt mir das Ohr, damit ich höre wie die Unterwiesenen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Adonaj JHWH; der Titel אֲדֹנָי steht hier zusammen mit dem Gottesnamen JHWH, der als „Yahweh“ wiedergegeben wird.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »die Zunge von Jüngern« beziehungsweise »von Belehrten«.'
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete hebräische Verb ist selten und in seiner Bedeutung unsicher; möglich sind auch »helfen« oder »antworten«.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die im Deutschen geläufige Wiedergabe des zusammengesetzten Titels stellt sowohl אֲדֹנָי als auch den Gottesnamen JHWH dar und vermeidet die schwer verständliche Doppelung »Herr HERR«.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Das konkrete Bild des Hebräischen bezeichnet hier das Vermögen zu reden und ist auch im Deutschen verständlich.
- source_word: לִמּוּדִים
  choice: Unterwiesene
  rationale: Die Form bezeichnet Menschen, die gelehrt oder unterwiesen worden sind. »Unterwiesene« bewahrt diesen Sinn, ohne die stärker festgelegte Deutung »Jünger« in den Haupttext einzutragen.
- source_word: לָדַעַת
  choice: damit ich weiß
  rationale: Der Infinitiv bezeichnet hier den Zweck der verliehenen Fähigkeit.
- source_word: לָעוּת
  choice: aufrichten kann
  rationale: Das seltene und schwierige Verb bezeichnet im Zusammenhang am ehesten wirksame Hilfe für einen Ermüdeten. »Aufrichten« verbindet Beistand und Ermutigung, ohne den Sinn auf bloßes Trösten zu verengen.
- source_word: יָעֵף
  choice: den Müden
  rationale: Die substantivierte Bezeichnung umfasst körperliche wie innere Erschöpfung.
- source_word: דָּבָר
  choice: mit einem Wort
  rationale: Die instrumentale Wendung bewahrt das Motiv wirksamer Rede.
- source_word: יָעִיר
  choice: weckt
  rationale: Das Hifil von עור bedeutet »wecken« oder »aufrütteln«. Die Wiederholung wird im Deutschen beibehalten.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die wiederholte Zeitangabe drückt regelmäßiges, fortgesetztes Geschehen aus und behält den Rhythmus des Hebräischen.
- source_word: אֹזֶן
  choice: mir das Ohr
  rationale: Das לִי bezeichnet die betroffene Person; die ungewohnte, aber verständliche Formulierung bewahrt das hebräische Bild genauer als eine Auflösung zu »macht mich aufmerksam«.
- source_word: לִשְׁמֹעַ
  choice: damit ich höre
  rationale: »Hören« gibt den Grundsinn wieder; die Bereitschaft zum Gehorchen bleibt als mögliche weitergehende Nuance offen.
- source_word: כַּלִּמּוּדִים
  choice: wie die Unterwiesenen
  rationale: Die gleiche Wiedergabe wie beim ersten Vorkommen von לִמּוּדִים erhält die Verknüpfung von unterwiesenem Hören und Reden.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: Herr JHWH / Herr Jahwe
  rationale: Die gewählte deutsche Konvention macht kenntlich, dass sowohl der Gottesname als auch אֲדֹנָי vorliegen, ohne eine bestimmte Aussprache des Tetragramms in den Haupttext zu setzen. Die Fußnote legt die hebräische Form offen.
- issue: Identität der »Unterwiesenen«
  choice: allgemeine Bezeichnung ohne ausdrückliche Festlegung auf »Jünger«
  alternative: Jünger
  rationale: Der Vers beschreibt den Sprecher als von Gott unterwiesen; ob לִמּוּדִים hier den technischeren Sinn »Jünger« trägt, bleibt lexikalisch offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von »Zunge« und »Ohr« sowie die Wiederholung des Verbs »wecken« bleiben erhalten. Der Gedankenstrich trägt die im Hebräischen knappe erste Verwendung von יָעִיר, ohne stillschweigend ein ausdrückliches Objekt wie »mich« hinzuzufügen.
