  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: de
  text: Der Herr, Yahweh, hat mir das Ohr geöffnet, und ich war nicht widerspenstig; ich wich nicht zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich zog mich nicht zurück“.'
    reason: Lexikalische Alternative für נְסוּגֹתִי; das Verb kann sowohl „zurückweichen“ als auch „sich zurückziehen“ bedeuten.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung bewahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den in יהוה überlieferten Gottesnamen. „Der Herr Yahweh“ vermeidet eine Verschmelzung der beiden Bestandteile.
- source_word: פָּתַח לִי אֹזֶן
  choice: hat mir das Ohr geöffnet
  rationale: Die konkrete hebräische Metapher wird beibehalten. Das Perfekt „hat … geöffnet“ bezeichnet eine abgeschlossene Handlung mit fortdauernder Bedeutung.
- source_word: מָרִיתִי
  choice: war nicht widerspenstig
  rationale: מרה bezeichnet widerspenstiges oder rebellisches Verhalten. „Widerspenstig“ gibt den Sinn natürlich wieder, ohne die Aussage zu einer bloßen einmaligen Handlung zu verengen.
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: ich wich nicht zurück
  rationale: סוג bezeichnet ein Zurückweichen oder Sich-Zurückziehen; אָחוֹר verstärkt die räumliche Vorstellung. Die knappe deutsche Wendung bewahrt dieses Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung gibt den Gottesnamen als Namen wieder und erhält zugleich den eigenständigen Titel אֲדֹנָי. Sie vermeidet, יהוה lediglich durch einen weiteren Titel zu ersetzen.
- issue: Bild vom geöffneten Ohr
  choice: hat mir das Ohr geöffnet
  alternative: hat mich hören lassen
  rationale: Die konkrete, theologisch offene Metapher des Hebräischen bleibt stehen; sie kann Bereitschaft, Befähigung und gehorsames Hören anklingen lassen, ohne diese Aspekte ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Zweigliedrigkeit, bleibt aber flüssig und allgemein verständlich. Das konkrete Bild des geöffneten Ohrs und die Spannung zwischen Hören, Nicht-Widerspenstigkeit und Nicht-Zurückweichen bleiben erhalten.
