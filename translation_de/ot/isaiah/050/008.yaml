source:
  edition: WLC
  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: de
  text: Nahe ist der, der mich ins Recht setzt[a]. Wer will mit mir einen Rechtsstreit führen? Lasst uns gemeinsam antreten! Wer hat eine Rechtssache gegen mich[b]? Er trete zu mir heran!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mich für gerecht erklärt“ beziehungsweise „der mir Recht gibt“. Das hebräische Verb ist hier im gerichtlichen Sinn gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Herr/Inhaber meiner Rechtssache“, das heißt derjenige, der gegen mich einen Rechtsanspruch geltend macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: Nahe ist
  rationale: Die vorangestellte Prädikatsangabe bewahrt die Betonung des hebräischen Satzanfangs und den knappen, herausfordernden Ton.
- source_word: מַצְדִּיקִי
  choice: der, der mich ins Recht setzt
  rationale: Der Hifil von צדק ist im Zusammenhang forensisch gebraucht. „Ins Recht setzen“ bezeichnet hier die gerichtliche Bestätigung des Rechts, ohne eine innere moralische Veränderung auszusagen.
- source_word: יָרִיב אִתִּי
  choice: will mit mir rechten
  rationale: ריב kann einen Rechtsstreit oder eine Auseinandersetzung bezeichnen. „Mit mir rechten“ wahrt die juristische Färbung und bleibt zugleich knapp.
- source_word: נַעַמְדָה יָּחַד
  choice: Stellen wir uns gemeinsam hin!
  rationale: Der Kohortativ fordert die Gegenseite dazu auf, gemeinsam vorzutreten beziehungsweise zur rechtlichen Konfrontation Stellung zu beziehen; die Übersetzung lässt das Bild des Stehens bestehen.
- source_word: בַעַל מִשְׁפָּטִי
  choice: mein Prozessgegner
  rationale: Wörtlich bezeichnet die Wendung den „Herrn/Inhaber meiner Rechtssache“, also die Partei, die einen Rechtsanspruch gegen den Sprecher verfolgt. „Prozessgegner“ gibt diese Funktion in verständlichem Deutsch wieder.
- source_word: יִגַּשׁ אֵלָי
  choice: Er trete zu mir heran!
  rationale: Die jussivische Aufforderung setzt die gerichtliche Herausforderung fort. „Herantreten“ nimmt zugleich das Motiv der Nähe vom Versanfang wieder auf.
theological_decisions:
- issue: Forensische oder moralische Bedeutung von מַצְדִּיקִי
  choice: 'forensisch: „der, der mich ins Recht setzt“'
  alternative: 'moralisch: „der, der mich gerecht macht“; terminologisch: „der, der mich rechtfertigt“'
  rationale: 'Der unmittelbare Kontext ist von Gerichtssprache geprägt: Rechtsstreit, gemeinsames Sich-Hinstellen und Prozessgegner. Daher bezeichnet das Verb hier die gerichtliche Bestätigung des Rechts und nicht ausdrücklich eine innere Umgestaltung. Die Formulierung vermeidet zugleich, spätere dogmatische Fachbedeutungen in den Vers einzutragen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper Gerichtssprache. Die leicht markierte Anfangsstellung „Nahe ist“ spiegelt die hebräische Hervorhebung; die Aufforderungen erhalten den herausfordernden Ton des Verses.
