source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: de
  text: 'Seht, ihr alle, die ihr ein Feuer entfacht und euch mit Brandfackeln umgürtet[a]: Geht im Licht eures Feuers und mitten unter den Brandfackeln, die ihr angezündet habt. Das widerfährt euch aus meiner Hand: In Qual werdet ihr euch niederlegen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Funken“ oder möglicherweise „Brandpfeile“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „In Schmerz“ beziehungsweise „in Kummer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die hinweisende Interjektion leitet eine nachdrückliche Anrede ein. „Seht“ ist gegenwärtig und würdevoll, ohne archaisch zu wirken.
- source_word: קֹדְחֵי אֵשׁ
  choice: die ihr ein Feuer entfacht
  rationale: Das Partizip wird aktiv verstanden; der Singular „ein Feuer“ entspricht dem Hebräischen.
- source_word: מְאַזְּרֵי זִיקוֹת
  choice: euch mit Feuerbränden umgürtet
  rationale: „Umgürten“ bewahrt das Bild von אזר. זִיקוֹת ist selten und kann Feuerbrände, Funken oder möglicherweise Brandgeschosse bezeichnen; „Feuerbrände“ hält Feuerbild und Gegenstandscharakter zusammen, ohne die Waffenbedeutung festzuschreiben.
- source_word: לְכוּ בְּאוּר אֶשְׁכֶם
  choice: Geht im Licht eures Feuers
  rationale: Der Imperativ und das selbst erzeugte Licht werden unmittelbar wiedergegeben; der ironisch-gerichtliche Ton ergibt sich aus dem Zusammenhang.
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: und mitten unter den Feuerbränden, die ihr angezündet habt
  rationale: Die Wiederholung desselben Nomens bleibt sichtbar. „Mitten unter“ gibt die räumliche Wirkung der Präposition idiomatisch wieder, und „angezündet“ entspricht dem aktiven Verb.
- source_word: מִיָּדִי הָיְתָה זֹּאת לָכֶם
  choice: Das widerfährt euch aus meiner Hand
  rationale: Die deutsche Wendung wahrt sowohl das Ergehen als auch die ausdrückliche Herkunft „aus meiner Hand“ und damit die unmittelbare Verantwortlichkeit des Sprechers.
- source_word: לְמַעֲצֵבָה תִּשְׁכָּבוּן
  choice: In Qual werdet ihr euch niederlegen
  rationale: „Qual“ gibt den schweren Schmerz oder Kummer des seltenen Nomens wieder. „Sich niederlegen“ bewahrt das konkrete Bild von שכב.
theological_decisions:
- issue: Ton des Imperativs „Geht im Licht eures Feuers“
  choice: Ironisch-gerichtliche Aufforderung, den selbst gewählten Weg mit seinen Folgen zu gehen
  alternative: Neutrale oder zustimmende Aufforderung
  rationale: Die Herkunft der Folge aus der Hand des Sprechers und der Abschluss in Qual zeigen, dass das selbst erzeugte Licht nicht empfohlen wird.
- issue: Sprecher hinter „meiner Hand“
  choice: Die göttliche Sprecherstimme kündigt die Folge als von ihr ausgehend an
  alternative: Eine nicht näher bestimmte menschliche Sprecherstimme
  rationale: Der prophetische Zusammenhang legt Gottes Stimme nahe; die Übersetzung belässt es jedoch beim textlichen „meiner Hand“ und fügt keine Benennung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des Umgürtens mit Feuerbränden wird bewusst bewahrt; die unsichere Bedeutung von זִיקוֹת wird nicht im Haupttext vereindeutigt, sondern in der Fußnote offengelegt.
