source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: de
  text: Warum war niemand da, als ich kam? Warum antwortete keiner, als ich rief? Ist meine Hand etwa zu kurz[a], um zu erlösen, oder fehlt mir die Kraft, zu retten? Ja, durch meine Zurechtweisung[b] trockne ich das Meer aus; ich mache Flüsse zur Wüste. Ihre Fische stinken aus Wassermangel und sterben vor Durst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist meine Hand zu kurz geworden, um loszukaufen?“ Das Bild der zu kurzen Hand bezeichnet mangelnde Fähigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch meinen Tadel“; die Formulierung bezeichnet eine wirksame Zurechtweisung oder einen Verweis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ בָּאתִי וְאֵין אִישׁ
  choice: Warum war niemand da, als ich kam?
  rationale: Die deutsche Satzstellung gibt die rhetorische Frage natürlich wieder. אִישׁ bezeichnet hier repräsentativ eine Person; „niemand“ vermeidet eine sachlich unbegründete Beschränkung auf Männer.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: Warum antwortete keiner, als ich rief?
  rationale: „rufen“ bewahrt die mögliche Bedeutung von Zuruf und Aufforderung; das substantivierte Partizip עוֹנֶה wird idiomatisch als „keiner antwortete“ wiedergegeben.
- source_word: הֲקָצוֹר קָצְרָה יָדִי
  choice: Ist meine Hand etwa zu kurz
  rationale: Die körperhafte Metapher für mangelnde Fähigkeit bleibt erhalten. „etwa“ vermittelt die zugespitzte rhetorische Frage.
- source_word: מִפְּדוּת
  choice: um zu erlösen
  rationale: Das Substantiv פדות bezeichnet Loskauf oder Befreiung; die deutsche Infinitivkonstruktion ist nach „zu kurz“ natürlich und bewahrt den Erlösungsbegriff.
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  choice: oder fehlt mir die Kraft, zu retten
  rationale: כֹחַ wird als „Kraft“ und הציל als das breite Rettungsverb „retten“ wiedergegeben.
- source_word: הֵן
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird in gegenwärtigem, würdigem Deutsch wiedergegeben, ohne das altertümlichere „siehe“ zu erzwingen.
- source_word: בְּגַעֲרָתִי
  choice: durch mein Schelten
  rationale: Die Formulierung bewahrt den Gedanken eines wirksamen göttlichen Zurechtweisens oder Drohworts.
- source_word: אַחֲרִיב יָם
  choice: trockne ich das Meer aus
  rationale: Der Hifil von חרב kann Verwüstung oder Austrocknung bezeichnen; der folgende Wassermangel macht „austrocknen“ hier besonders passend.
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: ich mache Flüsse zur Wüste
  rationale: Die Verwandlungsformulierung und das eindringliche Bild des hebräischen Textes bleiben eng erhalten.
- source_word: תִּבְאַשׁ דְּגָתָם מֵאֵין מַיִם וְתָמֹת בַּצָּמָא
  choice: Ihre Fische stinken aus Wassermangel und sterben vor Durst
  rationale: Die drastische sinnliche Folge der Austrocknung wird vollständig und unmittelbar wiedergegeben.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Hand
  choice: Die Metapher „meine Hand ... zu kurz“ wird beibehalten.
  alternative: „Ist meine Macht etwa zu begrenzt?“
  rationale: Der hebräische Text verbindet Gottes Hand mit seiner wirksamen Macht; die anschließende Frage nach der Kraft erläutert die Metapher bereits, sodass sie nicht aufgelöst werden sollte.
- issue: Bedeutungsumfang von פדות und הציל
  choice: „erlösen“ und „retten“ werden unterschieden.
  alternative: Beide Verben einheitlich mit „retten“ wiederzugeben.
  rationale: So bleibt die Spannung zwischen Loskauf beziehungsweise Befreiung und allgemeiner Rettung erkennbar, ohne eine bestimmte Erlösungslehre in den Vers hineinzulesen.
- issue: אִישׁ als repräsentativer maskuliner Singular
  choice: „niemand“
  alternative: „kein Mann“ oder „kein Mensch“
  rationale: In der Existenzformel bezeichnet אִישׁ kontextuell irgendeine anwesende Person. „Niemand“ gibt diese Funktion im modernen Deutschen präzise und natürlich wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen sind für natürliche Lesbarkeit parallel gestaltet; die kraftvollen Bilder von der kurzen Hand, dem ausgetrockneten Meer und den verendenden Fischen bleiben erhalten.
