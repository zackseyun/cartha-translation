source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: de
  text: Wer unter euch fürchtet Jahwe und hört auf die Stimme seines Dieners[a]? Wer in Finsternis geht und kein Licht hat, der vertraue auf den Namen Jahwes und stütze sich auf seinen Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gehorcht der Stimme seines Dieners; oder: beachtet sie.'
    reason: 'Lexikalische Alternative: שׁמע בקול kann Hören, Beachten oder Gehorchen bezeichnen.'
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Wer unter euch
  rationale: Gibt die direkte, an die Zuhörenden gerichtete Frage idiomatisch und präzise wieder.
- source_word: יְרֵא יְהוָה
  choice: fürchtet Jahwe
  rationale: „Fürchten“ bewahrt das Gewicht ehrfürchtiger Gottesfurcht; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: hört auf die Stimme seines Dieners
  rationale: Die deutsche Wendung bewahrt das Bild des Hörens und kann zugleich auf Beachtung und Gehorsam zielen, ohne die Bedeutungsbreite einseitig festzulegen.
- source_word: עַבְדּוֹ
  choice: seines Dieners
  rationale: „Diener“ entspricht der prophetischen Diener-Sprache und legt die Identität der bezeichneten Person nicht fest.
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: Wer in Finsternis geht
  rationale: Das abstrakt beziehungsweise intensivierend gebrauchte Pluralwort wird im Deutschen natürlich mit dem Singular „Finsternis“ wiedergegeben; das Gehen als Bild bleibt erhalten.
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: und keinen Lichtschein hat
  rationale: „Lichtschein“ erfasst נֹגַהּ als Helligkeit oder leuchtendes Licht und klingt im Zusammenhang der Finsternis natürlich.
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: vertraue auf den Namen Jahwes
  rationale: Der Aufforderungscharakter des Jussivs und das theologisch bedeutsame Motiv des Namens bleiben erhalten.
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: und stütze sich auf seinen Gott
  rationale: „Sich stützen auf“ bewahrt die konkrete Metapher des hebräischen Verbs und ist zugleich verständliches Gegenwartsdeutsch.
theological_decisions:
- issue: Identität des Dieners
  choice: Die Bezeichnung bleibt als „sein Diener“ unbestimmt.
  alternative: Ausdrückliche Identifikation mit dem Propheten, Israel oder einer messianischen Dienergestalt.
  rationale: Der Vers selbst nennt die Identität nicht; die offene Formulierung bewahrt die im Jesajabuch bestehende theologische Spannung.
- issue: Bedeutungsumfang von שֹׁמֵעַ בְּקוֹל
  choice: „hört auf die Stimme“
  alternative: „gehorcht der Stimme“ oder „beachtet die Stimme“
  rationale: Die Hauptfassung hält Hörbereitschaft und praktische Beachtung zusammen, ohne den Ausdruck ausschließlich als Gehorsam zu deuten; die Fußnote nennt die stärkeren Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt direkt; die anschließenden Jussive werden mit „vertraue“ und „stütze sich“ als Aufforderung wiedergegeben. Die Bildsprache von Finsternis, Name und Sich-Stützen wird bewahrt.
