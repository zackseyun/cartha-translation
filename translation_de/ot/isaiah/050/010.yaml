  to: Wer unter euch fürchtet Jahwe und hört auf die Stimme seines Dieners[a]? Wer in Finsternis geht und kein Licht hat, der vertraue auf den Namen Jahwes und stütze sich auf seinen Gott.
  rationale: Die Änderung von „Lichtschein“ zu „Licht“ vermeidet eine nicht vom hebräischen Wort geforderte Einengung. Das Korrelat „der“ verdeutlicht die an den in Finsternis Gehenden gerichtete Aufforderung, ohne den Sinn zu verändern. Die offen gehaltene Deutung von „seines Dieners“ und die lexikalische Fußnote zu „hört auf“ bleiben erhalten.
