  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: de
  text: Ich kleide die Himmel in Dunkelheit[a] und mache Sacktuch zu ihrer Bedeckung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schwärze“ oder „Düsternis“.'
    reason: lexical_alternative
  - marker: b
    text: Sacktuch war ein grober Stoff, der als Zeichen von Trauer und Klage getragen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: Ich kleide
  rationale: Der Hifil von לבשׁ bedeutet „bekleiden“. „Ich kleide“ bewahrt den verursachenden Sinn und die poetische Personifikation.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: שָׁמַיִם bezeichnet den Himmel beziehungsweise die Himmel. Der kollektive Singular „den Himmel“ ist im modernen Deutschen natürlich und behält hier den kosmischen Bezug bei.
- source_word: קַדְרוּת
  choice: Dunkelheit
  rationale: Das Substantiv kann Dunkelheit, Schwärze oder Düsternis bezeichnen. „Dunkelheit“ ist verständlich und lässt sowohl kosmische Verdunkelung als auch Trauersymbolik zu.
- source_word: וְשַׂק
  choice: und Sacktuch
  rationale: שַׂק ist grobes Sacktuch, das besonders mit Trauer und Klage verbunden war. Der traditionelle Sachbegriff erhält das kulturelle Bild.
- source_word: אָשִׂים
  choice: mache … zu
  rationale: שׂים bedeutet setzen, legen oder machen. Die Konstruktion „mache … zu“ gibt idiomatisch wieder, dass das Sacktuch dem Himmel als Hülle dient.
- source_word: כְּסוּתָם
  choice: seiner Hülle
  rationale: כְּסוּת bezeichnet eine Bedeckung oder ein Gewand. „Hülle“ greift den Parallelismus zu „kleide“ auf, ohne die Art der Bedeckung unnötig festzulegen; der deutsche Singular richtet sich nach dem kollektiv gebrauchten „Himmel“.
theological_decisions:
- issue: Kosmische Bildsprache von Gericht und Trauer
  choice: Die Aussage bleibt eine göttliche Erklärung der Macht, den Himmel zu verdunkeln und mit Sacktuch zu umhüllen.
  alternative: Das Bild ausschließlich als buchstäbliche kosmische Verdunkelung oder ausschließlich als Metapher für Trauer und Gericht zu deuten.
  rationale: Der hebräische Text verbindet kosmische Verdunkelung mit einem Trauerzeichen. Die Übersetzung bewahrt beide Bedeutungsebenen, ohne eine davon festzuschreiben.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der kollektive Singular „Himmel“ vermeidet das im heutigen Deutsch markierte „die Himmel“, während „kleide“ und „Hülle“ die Personifikation und den Parallelismus erhalten.
