source:
  edition: WLC
  text: כִּ֚י בַּ/יּ֣וֹם הַ/ה֔וּא יִמְאָס֗וּ/ן אִ֚ישׁ אֱלִילֵ֣י כַסְפּ֔/וֹ וֶ/אֱלִילֵ֖י זְהָב֑/וֹ אֲשֶׁ֨ר עָשׂ֥וּ לָ/כֶ֛ם יְדֵי/כֶ֖ם חֵֽטְא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: de
  text: Denn an jenem Tag wird jeder seine silbernen und goldenen Götzen verwerfen, die eure Hände euch gemacht haben – Sünde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch am Ende sehr knapp: »die eure Hände euch gemacht haben – Sünde«. Die Anbindung von »Sünde« ist unsicher; möglich sind etwa »als Sünde« oder »zur Sünde«.'
    reason: Die Fußnote weist die ungewöhnlich verdichtete hebräische Syntax und die daraus folgende Übersetzungsunsicherheit aus, ohne eine der möglichen Deutungen als alleinige festzulegen.
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: verwerfen
  rationale: Gibt die entschiedene Abkehr und Zurückweisung wieder, ohne über das Verb hinaus eine Zerstörung der Götzen zu behaupten.
- source_word: אִישׁ
  choice: jeder
  rationale: Das distributive »Mann für Mann« wird im modernen Deutschen natürlich und inklusiv als »jeder« wiedergegeben.
- source_word: אֱלִילֵי כַסְפּוֹ וֶאֱלִילֵי זְהָבוֹ
  choice: seine silbernen und goldenen Götzen
  rationale: Bewahrt Besitzbezug, Materialangabe und die polemische Bezeichnung als Götzen in flüssigem Deutsch.
- source_word: אֲשֶׁר עָשׂוּ לָכֶם יְדֵיכֶם חֵטְא
  choice: die eure Hände euch zur Sünde gemacht haben
  rationale: Hält den auffälligen Wechsel vom Singular »jeder/seine« zum Plural »eure/euch« fest und bewahrt die knappe, spannungsreiche Funktion von חֵטְא.
theological_decisions:
- issue: Funktion von חֵטְא am Versende
  choice: zur Sünde
  alternative: als Sünde / sündhaft
  rationale: Der hebräische Ausdruck ist syntaktisch knapp und kann Ergebnis, Zweck oder prädikative Einordnung andeuten. »zur Sünde« wahrt die Aussage, dass die eigenhändig gefertigten Götzen Sünde bewirken beziehungsweise ihr dienen, ohne die Mehrdeutigkeit dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von der distributiven Einzahl »jeder/seine« zur gemeinschaftlichen Mehrzahl »eure/euch« bleibt erhalten. »Götzen« ist geläufiger und idiomatischer als »Götzenbilder«, ohne den Sinn unnötig zu erweitern.
