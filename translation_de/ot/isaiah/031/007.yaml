review_pass:
  verdict: revise
  source_fidelity: Der Vers gibt כִּי, die Zeitangabe, die distributive Aussage mit אִישׁ, das Verwerfen (יִמְאָסוּן), den possessiven Bezug sowie den Wechsel zur pluralischen Anrede bei לָכֶם/יְדֵיכֶם angemessen wieder. Die Endstellung חֵטְא ist jedoch syntaktisch stark verdichtet und in ihrer genauen Anbindung umstritten. »zur Sünde gemacht« legt im Deutschen relativ deutlich einen Zweck oder eine Wirkung fest, die der hebräische Wortlaut nicht ausdrücklich bestimmt.
  naturalness: Der Entwurf ist ansonsten flüssiges modernes Standarddeutsch. »als Sünde gemacht« wäre zwar näher an einer möglichen prädikativen Auffassung, klingt aber im Deutschen unidiomatisch. Eine Gedankenstrichfügung bewahrt die absichtliche Kürze und bleibt verständlich.
  terminology: »Götzen« ist für אֱלִילִים treffend und im Register passend. »silberne und goldene Götzen« ist idiomatisch; die Wiederholung von אֱלִילֵי im Hebräischen muss im Deutschen nicht mechanisch wiederholt werden.
