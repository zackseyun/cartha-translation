source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְהוָ֣ה אֵלַ֡/י כַּ/אֲשֶׁ֣ר יֶהְגֶּה֩ הָ/אַרְיֵ֨ה וְ/הַ/כְּפִ֜יר עַל טַרְפּ֗/וֹ אֲשֶׁ֨ר יִקָּרֵ֤א עָלָי/ו֙ מְלֹ֣א רֹעִ֔ים מִ/קּוֹלָ/ם֙ לֹ֣א יֵחָ֔ת וּ/מֵֽ/הֲמוֹנָ֖/ם לֹ֣א יַֽעֲנֶ֑ה כֵּ֗ן יֵרֵד֙ יְהוָ֣ה צְבָא֔וֹת לִ/צְבֹּ֥א עַל הַר צִיּ֖וֹן וְ/עַל גִּבְעָתָֽ/הּ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: de
  text: 'Denn so hat Jahwe zu mir gesprochen: Wie der Löwe oder der junge Löwe über seiner Beute knurrt[a] und sich, wenn eine ganze Schar von Hirten gegen ihn zusammengerufen wird, von ihrem Geschrei nicht erschrecken und von ihrem Lärmen nicht einschüchtern lässt[b], so wird Jahwe der Heerscharen herabkommen, um auf dem Berg Zion und auf seinem Hügel zu kämpfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie der Löwe und der junge Löwe über ihrer Beute knurren«; das hebräische Begriffspaar kann als poetische Doppelung statt als echte Alternative verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher möglicherweise: »und auf ihr Lärmen nicht antwortet«; das hebräische Verb kann »antworten/reagieren« bedeuten, meint hier im Zusammenhang aber wahrscheinlich, dass der Löwe sich nicht bezwingen oder einschüchtern lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner gebräuchlichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יֶהְגֶּה
  choice: knurrt
  rationale: Bezeichnet hier den tiefen, beharrlichen Laut eines Löwen über seiner Beute, nicht notwendig ein lautes Brüllen.
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: der Löwe oder der junge Löwe
  rationale: Das hebräische Begriffspaar lässt sich als poetische Doppelbezeichnung eines repräsentativen Raubtiers verstehen; die alternative Lesart mit »und« bleibt in der Fußnote erhalten.
- source_word: מְלֹא רֹעִים
  choice: eine ganze Schar von Hirten
  rationale: מְלֹא hebt die volle Zahl beziehungsweise die geschlossen auftretende Menge hervor; »eine ganze Schar« ist zugleich anschaulich und natürlich.
- source_word: יִקָּרֵא עָלָיו
  choice: gegen ihn zusammengerufen wird
  rationale: Bewahrt sowohl das passive Herbeirufen der Hirten als auch ihre Ausrichtung gegen den Löwen.
- source_word: לֹא יֵחָת
  choice: sich … nicht erschrecken lässt
  rationale: Gibt die Bedeutung von bestürzt oder in Furcht versetzt werden im natürlichen deutschen Satzbau wieder.
- source_word: לֹא יַעֲנֶה
  choice: sich … nicht einschüchtern lässt
  rationale: Der Parallelismus spricht im Kontext für Unterwerfung oder Einschüchterung; die wörtlichere Möglichkeit »antwortet nicht« wird in der Fußnote bewahrt.
- source_word: הֲמוֹנָם
  choice: ihr Lärmen
  rationale: Bezeichnet den lauten Tumult der zusammengerufenen Hirten.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Bewahrt den traditionellen Titel und seine hier besonders passende militärische Bildkraft.
- source_word: לִצְבֹּא
  choice: um … zu kämpfen
  rationale: Der Infinitiv bezeichnet hier das kriegerische Antreten beziehungsweise Kämpfen; die Formulierung lässt offen, wie sich das Verhältnis zu Zion im weiteren Kontext genau bestimmt.
- source_word: גִּבְעָתָהּ
  choice: seiner Höhe
  rationale: Das Suffix bezieht sich auf Zion; »Höhe« gibt גבעה im poetischen Parallelismus mit »Berg Zion« natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen theologischen Titel zu ersetzen.
- issue: Sinn von לֹא יַעֲנֶה im Löwenvergleich
  choice: lässt sich nicht einschüchtern
  alternative: antwortet nicht auf ihr Lärmen
  rationale: Die Parallelität zu »lässt sich nicht erschrecken« legt Einschüchterung oder Unterwerfung nahe; da die Verbform auch wörtlicher als »antworten/reagieren« verstanden werden kann, bleibt diese Spannung in einer Fußnote sichtbar.
- issue: Zielrichtung von Jahwes Kampf auf Zion
  choice: auf dem Berg Zion … kämpfen
  alternative: gegen den Berg Zion … kämpfen
  rationale: Die Präposition עַל kann räumlich »auf/über« oder adversativ »gegen« bedeuten. Die räumliche Wiedergabe vermeidet es, die im Vers selbst nicht eindeutig ausgesprochene Zielrichtung des Kampfes festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Tiermetaphorik. Der lange Vergleichssatz folgt der hebräischen Bewegung, wird aber durch natürliche deutsche Syntax lesbar gehalten. »Jahwe der Heerscharen« wahrt den Eigennamen und den militärischen Titel.
