  source_fidelity: 'Die Grundstruktur mit der Wiederholung von גנן und der Abfolge von Schutz, Rettung, פסח und מלט ist erkennbar. „An ihm vorübergehen“ ist im Deutschen jedoch keine tragfähige Wiedergabe von פָּסֹחַ in diesem Kontext: Es legt nahe, dass Jahwe Jerusalem unbeachtet passiert, während das Verb hier gerade das verschonende bzw. schützende Übergehen bezeichnet und zugleich den Passa-Anklang weckt. Die Wiedergabe der abschließenden Verbfolge als koordinierte Partizipien bildet die hebräische knappe Reihung angemessener ab.'
  naturalness: „Wie fliegende Vögel“ ist idiomatisch und näher am hebräischen Partizip als „wie Vögel im Flug“. Die Formulierung mit „Er wird“ unterbricht unnötig die poetische Verdichtung. „Es verschonend und rettend“ ist modernes, verständliches Standarddeutsch; die Fußnote sichert den wörtlichen Anklang von „vorübergehen“ ab.
  terminology: „Jahwe der Heerscharen“ und „beschirmen“ sind angemessen. Für Jerusalem ist im Deutschen das feminine Pronomen („sie/ihr“) vorzuziehen, sofern ein Pronomen verwendet wird. Die Fußnote sollte daher nicht „ihm“ sagen.
