    rationale: Die Formen nach dem Hauptverb lassen sich im Deutschen natürlich als Partizipien wiedergeben und bewahren so Rhythmus und Wiederholung.
  - severity: low
    issue: Die Fußnote verwendet für Jerusalem das maskuline Pronomen.
    rationale: Bei personifizierter Stadtbezeichnung ist im Deutschen „ihr“ passend; zudem wird die Formulierung durch eine direkte Erklärung klarer.
