  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: de
  text: Wie fliegende Vögel wird Jahwe der Heerscharen Jerusalem beschirmen – beschirmend und rettend, verschonend und befreiend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vorübergehend und entkommen lassend“. Das hebräische Wort für „verschonend“ erinnert zugleich an das Vorübergehen beim Passa und kann auch schützendes Bewahren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפֳּרִים עָפוֹת
  choice: Wie Vögel im Flug
  rationale: Die Wendung bezeichnet wörtlich fliegende Vögel. „Im Flug“ klingt im Deutschen natürlich und bewahrt das Bild, ohne die im Verb nicht ausdrücklich enthaltene Vorstellung eines Schwebens über einem Nest einzutragen.
- source_word: יָגֵן ... גָּנוֹן
  choice: wird ... beschirmen; er wird es beschirmen
  rationale: „Beschirmen“ gibt die konkrete Schutzbedeutung von גנן wieder und bewahrt durch die Wiederholung den rhetorischen Nachdruck des Hebräischen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „der Heerscharen“ bewahrt die militärischen und himmlischen Bedeutungsanklänge von צְבָאוֹת in einer im Deutschen verständlichen, würdigen Form.
- source_word: עַל יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Beim deutschen Verb „beschirmen“ kann Jerusalem unmittelbar als Objekt stehen; der räumliche Schutzgedanke der Präposition עַל bleibt durch das Vogelbild und das Verb erkennbar.
- source_word: וְהִצִּיל
  choice: und retten
  rationale: נצל bezeichnet das Herausreißen aus Gefahr beziehungsweise Retten. Die finite Fortführung ist im Deutschen klarer als eine Reihe substantivierter oder partizipialer Formen.
- source_word: פָּסֹחַ
  choice: an ihm vorübergehen
  rationale: Die Form wird möglichst transparent mit „vorübergehen“ wiedergegeben, sodass der mögliche Anklang an das Passa-Geschehen erhalten bleibt. Die ebenfalls mögliche Schutz- oder Verschonungsbedeutung steht in der Fußnote.
- source_word: וְהִמְלִיט
  choice: und es entkommen lassen
  rationale: Die kausative Form von מלט bedeutet, jemanden entrinnen beziehungsweise entkommen zu lassen. Diese Wiedergabe unterscheidet das Verb vom vorherigen „retten“ und erhält so die sprachliche Vielfalt des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Mehrdeutigkeit und Passa-Anklang von פָּסֹחַ
  choice: an ihm vorübergehen
  alternative: es verschonen oder schützend über ihm wachen
  rationale: Der Haupttext erhält den möglichen sprachlich-theologischen Anklang an das Vorübergehen beim Passa; die Fußnote nennt die im Zusammenhang naheliegende Schutz- beziehungsweise Verschonungsbedeutung, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung von „beschirmen“ bildet den Nachdruck des hebräischen Textes ab; die Pronomen verdeutlichen im Deutschen, dass Jerusalem weiterhin Gegenstand der Handlungen ist.
