revisions:
- from: Wie Vögel im Flug wird Jahwe der Heerscharen Jerusalem beschirmen. Er wird es beschirmen und retten, an ihm vorübergehen[a] und es entkommen lassen.
  to: Wie fliegende Vögel wird Jahwe der Heerscharen Jerusalem beschirmen – beschirmend und rettend, verschonend und befreiend.[a]
  rationale: Die Revision beseitigt die irreführende Vorstellung, Jahwe gehe an Jerusalem vorbei, und gibt die in diesem Kontext erforderliche Schonungs- und Schutzbedeutung von פָּסֹחַ wieder. Der mögliche Passa-Anklang und die wörtliche Bewegungsbedeutung bleiben ausdrücklich in der Fußnote erhalten. Die partizipiale Reihung wahrt die hebräische rhetorische Verdichtung und die Wiederholung von „beschirmen“.
