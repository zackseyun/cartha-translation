  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִצְרַ֤יִם אָדָם֙ וְֽ/לֹא אֵ֔ל וְ/סוּסֵי/הֶ֥ם בָּשָׂ֖ר וְ/לֹא ר֑וּחַ וַֽ/יהוָ֞ה יַטֶּ֣ה יָד֗/וֹ וְ/כָשַׁ֤ל עוֹזֵר֙ וְ/נָפַ֣ל עָזֻ֔ר וְ/יַחְדָּ֖ו כֻּלָּ֥/ם יִכְלָיֽוּ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: de
  text: Die Ägypter sind Menschen und nicht Gott,[a] und ihre Pferde sind Fleisch und nicht Geist.[b] Wenn der HERR seine Hand ausstreckt, wird der Helfer straucheln und der, dem geholfen wird, fallen; sie alle werden miteinander zugrunde gehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Ägypten ist ein Mensch und nicht Gott«; gemeint ist, dass Ägypten nur menschlich und nicht göttlich ist.'
    reason: lexical_alternative
  - marker: b
    text: »Geist« kann hier auch Atem, Lebenskraft oder immaterielle Macht bezeichnen; das Wort muss nicht ausdrücklich den Heiligen Geist meinen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sie alle werden miteinander umkommen« beziehungsweise »vergehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם אָדָם
  choice: Die Ägypter sind Menschen
  rationale: Der Ländername steht kollektiv für Ägypten beziehungsweise seine Bewohner; die deutsche Formulierung gibt den Gegensatz zwischen menschlicher Geschöpflichkeit und Gott natürlich und prägnant wieder.
- source_word: אֵל
  choice: Gott
  rationale: Im Gegensatz zu אָדָם bezeichnet das Wort wahre Gottheit; daher ist die Großschreibung sachgerecht.
- source_word: סוּסֵיהֶם
  choice: ihre Pferde
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der dritten Person Plural.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Bewahrt den knappen Gegensatz zu רוּחַ und vermittelt die geschöpfliche Schwäche, ohne sie erklärend auszudeuten.
- source_word: רוּחַ
  choice: Geist
  rationale: Bewahrt die Mehrdeutigkeit zwischen Geist, Lebenskraft und immaterieller Kraft; der Kontext verlangt nicht ausdrücklich eine Bezeichnung des Heiligen Geistes.
- source_word: יהוה
  choice: der HERR
  rationale: Entspricht der üblichen deutschen Wiedergabe des Gottesnamens im Bibeltext.
- source_word: יַטֶּה יָדוֹ
  choice: seine Hand ausstreckt
  rationale: Natürliche deutsche Wiedergabe des Bildes für Gottes machtvolles Eingreifen.
- source_word: כָשַׁל עוֹזֵר
  choice: der Helfer straucheln
  rationale: Erhält sowohl die Rollenbezeichnung als auch das konkrete Bild eines beginnenden Zusammenbruchs.
- source_word: וְנָפַל עָזֻר
  choice: der, dem geholfen wird, fallen
  rationale: Gibt das passive Partizip klar wieder und hält den Gegensatz zwischen Helfer und Hilfeempfänger fest.
- source_word: יִכְלָיוּן
  choice: zugrunde gehen
  rationale: Drückt das vollständige Ende idiomatisch aus, ohne zwischen den möglichen Nuancen 'vergehen', 'umkommen' und 'vernichtet werden' zu stark festzulegen.
theological_decisions:
- issue: Bezeichnet רוּחַ ausdrücklich den Heiligen Geist?
  choice: Geist
  alternative: Atem, Lebenskraft oder Geist Gottes
  rationale: Der Gegensatz zu Fleisch hebt die bloß geschöpfliche und vergängliche Macht der Pferde hervor. Die Übersetzung bewahrt den theologischen Resonanzraum, ohne eine ausdrückliche pneumatologische Aussage einzutragen.
- issue: Wie ist אָדָם in der Aussage über Ägypten wiederzugeben?
  choice: Menschen
  alternative: ein Mensch / menschlich
  rationale: Das Hebräische bezeichnet Ägypten kollektiv als menschlich und nicht göttlich. Der Plural ist im modernen Deutschen natürlich, während die Fußnote die knappere singularische Struktur sichtbar hält.
- issue: Wer sind Helfer und Hilfeempfänger?
  choice: rollenbezogene, nicht ausdrücklich identifizierende Wiedergabe
  alternative: Ägypten und Juda ausdrücklich nennen
  rationale: Der unmittelbare Zusammenhang legt diese Zuordnung nahe, doch der Vers selbst verwendet nur die Rollenbegriffe. Die Übersetzung fügt die Identitäten deshalb nicht in den Text ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Gegensätze Menschen/Gott, Fleisch/Geist und Helfer/Hilfeempfänger bleiben deutlich. Das Futur bildet die Folge von Gottes Eingreifen ab; die Fußnoten bewahren relevante lexikalische Alternativen.
