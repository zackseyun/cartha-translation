  variant: modern standard German
source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: de
  text: Wehe denen, die nach Ägypten hinabziehen, um Hilfe zu suchen, die sich auf Pferde stützen[a] und auf Streitwagen vertrauen, weil es so viele sind, und auf Reiter[b], weil sie überaus stark sind, aber nicht auf den Heiligen Israels schauen und Jahwe[c] nicht suchen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich auf Pferde verlassen“. Das hebräische Verb zeichnet das Bild von jemandem, der sich auf etwas stützt, um Halt zu finden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reiterei“.'
    reason: lexical_alternative
  - marker: c
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder.
    reason: divine_name
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Weheruf-Formel kündigt Anklage und Gericht an; „Wehe“ bewahrt diese eindringliche Funktion.
- source_word: הַיֹּרְדִים מִצְרַיִם לְעֶזְרָה
  choice: die nach Ägypten hinabziehen, um Hilfe zu suchen
  rationale: Das substantivierte Partizip bezeichnet die angesprochene Personengruppe. „Hinabziehen“ bewahrt die geografisch und idiomatisch übliche Bewegungsrichtung nach Ägypten; die Zweckangabe wird natürlich wiedergegeben.
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: die sich auf Pferde stützen
  rationale: Das Nifal von שׁען bezeichnet das Suchen von Halt durch Anlehnen oder Sichstützen. Die konkrete Metapher bleibt im Deutschen verständlich und sichtbar.
- source_word: וַיִּבְטְחוּ עַל רֶכֶב
  choice: und auf Streitwagen vertrauen
  rationale: בטח bezeichnet Vertrauen beziehungsweise Zuversicht; רֶכֶב steht hier kollektiv für die Streitwagenmacht und wird daher im Plural wiedergegeben.
- source_word: כִּי רָב
  choice: weil es so viele sind
  rationale: Das maskuline Singularadjektiv stimmt mit dem kollektiven רֶכֶב überein, meint inhaltlich aber die große Zahl der Streitwagen.
- source_word: וְעַל פָּרָשִׁים
  choice: und auf Reiter
  rationale: פָּרָשִׁים bezeichnet berittene Krieger. „Reiter“ erhält das konkrete Bild und lässt die mögliche kollektive Bedeutung „Reiterei“ offen.
- source_word: כִּי עָצְמוּ מְאֹד
  choice: weil sie überaus stark sind
  rationale: עָצַם kann Stärke, Macht oder zahlenmäßige Überlegenheit bezeichnen. „Überaus stark“ passt zum militärischen Zusammenhang, ohne die Bedeutung unnötig einzuengen.
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: aber nicht auf den Heiligen Israels schauen
  rationale: שׁעה bezeichnet ein aufmerksames, beachtendes Hinschauen. „Auf ... schauen“ bewahrt den Kontrast zur menschlichen Stütze und kann zugleich vertrauensvolle Hinwendung ausdrücken.
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: und nicht nach Jahwe fragen
  rationale: דרש mit göttlichem Objekt bedeutet, Gott zu suchen, nach ihm zu fragen oder sich an ihn zu wenden. „Nach Jahwe fragen“ bewahrt die gängige Bundes- und Orakelsprache, ohne sie nur auf Gebet oder Gottesdienst festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, während die traditionelle Ersatzlesung „der HERR“ diese Unterscheidung verdecken würde.
- issue: Zeit- und Aspektfolge der hebräischen Verbformen
  choice: durchgehendes Präsens innerhalb des prophetischen Weherufs
  alternative: 'Vergangenheit: „hinabzogen ... stützten sich ... vertrauten ... schauten nicht ... fragten nicht“'
  rationale: Das substantivierte Partizip eröffnet eine Anklage gegen eine charakterisierte Personengruppe. Das deutsche Präsens gibt diese generische und aktuell warnende Kraft natürlicher wieder als eine narrative Vergangenheitsfolge.
- issue: Bedeutungsbreite von דרש in Bezug auf Jahwe
  choice: nach Jahwe fragen
  alternative: Jahwe suchen
  rationale: Beide Wiedergaben sind möglich. „Nach Jahwe fragen“ umfasst hier das Sich-an-ihn-Wenden und das Einholen seiner Weisung; die Formulierung vermeidet, das Verb ausschließlich als innere Gottsuche zu verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Der Satzbau folgt der Steigerung des hebräischen Weherufs, bleibt aber gut lesbar. Die konkreten Militärbilder und die Wiederholung von „auf“ werden bewusst bewahrt.
