  text: שׁ֗וּבוּ לַ/אֲשֶׁ֛ר הֶעְמִ֥יקוּ סָרָ֖ה בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: de
  text: Kehrt zu dem zurück, gegen den die Söhne Israels sich zutiefst aufgelehnt haben![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kehrt zu dem zurück, von dem die Söhne Israels sich so weit abgewandt haben.“ Die hebräische Relativkonstruktion ist stark verkürzt und lässt sich unterschiedlich wiedergeben.'
    reason: alternative_reading
  - marker: b
    text: „Söhne Israels“ entspricht dem Hebräischen wörtlicher als das traditionelle „Kinder Israels“; gemeint ist Israel als Volk.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Kehrt … zurück
  rationale: Der pluralische Imperativ von שוב ruft zur Umkehr und zur erneuten Hinwendung auf. „Zurückkehren“ bewahrt sowohl die räumliche Grundbedeutung als auch den prophetischen Ruf zur Umkehr.
- source_word: לַאֲשֶׁר
  choice: zu dem, gegen den
  rationale: Die Verbindung aus ל und אֲשֶׁר ist knapp und mehrdeutig. „Zu dem“ gibt das Ziel der Rückkehr wieder; „gegen den“ ergibt sich aus dem folgenden Ausdruck für Auflehnung. Der Bezug auf Gott bleibt wie im Hebräischen unausgesprochen.
- source_word: הֶעְמִיקוּ סָרָה
  choice: ihr euch so tief aufgelehnt habt
  rationale: הֶעְמִיקוּ verstärkt die mit סָרָה bezeichnete Abkehr oder Rebellion. Die deutsche Wendung gibt sowohl die Intensität als auch den aktiven Widerstand in natürlicher Sprache wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  rationale: „Söhne Israels“ entspricht der hebräischen Form genauer als „Kinder Israels“. Die Anredeform macht im Deutschen deutlich, dass der vorausgehende pluralische Imperativ an Israel gerichtet ist.
theological_decisions:
- issue: Soll derjenige, zu dem Israel zurückkehren soll, ausdrücklich als Gott oder der HERR bezeichnet werden?
  choice: Die relative Umschreibung „zu dem“ bleibt stehen.
  alternative: „Kehrt zum HERRN zurück“
  rationale: Aus dem Zusammenhang ist Gott gemeint, doch der Vers selbst nennt weder den Gottesnamen noch einen Titel. Die Übersetzung fügt daher keine ausdrückliche Gottesbezeichnung ein.
- issue: Wie ist das Verhältnis zwischen Rückkehr und vorausgegangener Abkehr wiederzugeben?
  choice: „zu dem, gegen den ihr euch … aufgelehnt habt“
  alternative: „zu dem, von dem ihr so weit abgefallen seid“
  rationale: Die gewählte Fassung erhält sowohl das Ziel der Rückkehr als auch den Charakter der Abkehr als Auflehnung. Eine Fußnote bewahrt die mögliche stärker räumlich gedachte Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede ist direkt und verständlich; „aufgelehnt“ wahrt den Ernst der prophetischen Sprache, ohne unnötig altertümlich oder fachsprachlich zu wirken.
