  source_fidelity: Die Übersetzung gibt den pluralischen Umkehrruf, das Rückkehrziel und die gegen Gott gerichtete, intensivierte Rebellion sachgerecht wieder. Die hebräische Relativkonstruktion bleibt ohne ergänzten Gottesnamen erhalten. Die Umformung von „die Söhne Israels“ zu „ihr Söhne Israels“ verwischt jedoch die im Hebräischen vorliegende Subjektkonstruktion.
  naturalness: „Sich so tief auflehnen“ ist im modernen Standarddeutsch weniger idiomatisch. „Sich zutiefst auflehnen“ ist natürlich und bewahrt die Verstärkung. Die Beibehaltung von „die Söhne Israels“ im Satz ist zudem klarer als die nachgestellte Anrede.
  terminology: „Söhne Israels“ ist als formnahe Wiedergabe von בְּנֵי יִשְׂרָאֵל vertretbar; die Fußnote erläutert den korporativen Bezug angemessen. „Auflehnen“ wahrt den Charakter von סָרָה als Rebellion, ohne eine konfessionelle Deutung einzutragen.
