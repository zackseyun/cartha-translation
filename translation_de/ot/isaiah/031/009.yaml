base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: de
  text: Vor Schrecken wird sein Fels vergehen[a], und seine Fürsten werden vor dem Feldzeichen erschrecken[b] – Ausspruch Jahwes, der sein Feuer in Zion und seinen Ofen in Jerusalem hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Festung wird in Schrecken vergehen.“ Der hebräische Ausdruck „sein Fels“ kann bildlich Assyriens Zuflucht, Festung oder Herrscher bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Fürsten werden vor dem Banner verzagen.“ Das hebräische Wort kann ein Banner, Feldzeichen oder Signalzeichen bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: Das Bild von Jahwes „Feuer“ und „Ofen“ in Zion und Jerusalem kann auf seine verzehrende Gegenwart im Gericht hinweisen; der Text grenzt das Bild jedoch nicht näher ein.
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: sein Fels
  rationale: סֶלַע bezeichnet wörtlich einen Felsen oder eine Felsklippe. Das Bild bleibt im Haupttext erhalten, obwohl es hier wahrscheinlich bildlich für Assyriens Zuflucht, Festung oder Herrscher steht.
- source_word: מִמָּגוֹר יַעֲבוֹר
  choice: Vor Schrecken wird … weichen
  rationale: מִן kann hier Ursache beziehungsweise Anlass ausdrücken; מָגוֹר bezeichnet Schrecken. יַעֲבוֹר bedeutet grundsätzlich „vorübergehen/weiterziehen“, bezeichnet im Zusammenhang aber passend das Zurückweichen oder Verschwinden.
- source_word: וְחַתּוּ
  choice: werden … erschrecken
  rationale: חתת kann im Qal das Erschrecken, Verzagen oder Zerschmettertwerden bezeichnen. Bei menschlichen Subjekten und parallel zu מָגוֹר gibt „erschrecken“ den Zusammenhang natürlich wieder, ohne die stärkere mögliche Nuance völlig festzulegen.
- source_word: מִנֵּס
  choice: vor dem Feldzeichen
  rationale: נֵס bezeichnet ein Signalzeichen, Banner oder Feldzeichen. „Feldzeichen“ bewahrt das konkrete militärische Bild; „vor“ gibt den Anlass ihres Erschreckens wieder.
- source_word: שָׂרָיו
  choice: seine Fürsten
  rationale: שַׂר kann Fürst, Amtsträger oder Heerführer bedeuten. „Fürsten“ ist breit genug und wahrt die mögliche politische wie militärische Bedeutung.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Ausspruchsformel. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן
  choice: der sein Feuer in Zion … hat
  rationale: אוּר ist wegen des parallelen תַּנּוּר als „Feuer“ zu verstehen. Die deutsche Konstruktion gibt das hebräische לוֹ idiomatisch wieder und bewahrt das Bild.
- source_word: וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: und seinen Ofen in Jerusalem
  rationale: תַּנּוּר bezeichnet einen Ofen oder Feuerofen. „Ofen“ bleibt lexikalisch nah am Hebräischen und lässt die genaue Funktion des Bildes offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt diesen Namen im modernen deutschen Bibelstil unmittelbar wieder.
- issue: Deutung von „Fels“
  choice: Das konkrete Bild im Haupttext bewahren
  alternative: Festung, Zuflucht oder Herrscher ausdrücklich einsetzen
  rationale: Der Zusammenhang legt eine Metapher für Assyriens Sicherheit oder Führung nahe, bestimmt ihren Bezug aber nicht eindeutig. Die Übersetzung bewahrt daher die Mehrdeutigkeit.
- issue: Deutung von Feuer und Ofen in Zion und Jerusalem
  choice: Die Bilder ohne nähere dogmatische Bestimmung stehen lassen
  alternative: ausdrücklich auf Altarfeuer oder endzeitliches Gericht beziehen
  rationale: Die Bilder können Jahwes verzehrende Gegenwart und sein Gericht andeuten, doch der Vers benennt weder ausschließlich den Opferkult noch ein bestimmtes eschatologisches Geschehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Satzstellung stellt den Schrecken heraus. „Ausspruch Jahwes“ erhält den feierlichen Charakter der prophetischen Formel; „Fels“, „Feldzeichen“, „Feuer“ und „Ofen“ bewahren die konkreten und mehrdeutigen Bilder des Hebräischen.
