source:
  edition: WLC
  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: de
  text: Doch auch er ist weise und führt Unheil herbei[a]. Seine Worte nimmt er nicht zurück[b] und erhebt sich gegen das Haus der Übeltäter und gegen die Hilfe[c] derer, die Unrecht tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt Unglück kommen“. Das hebräische Wort kann „Böses“ oder „Unheil“ bedeuten; hier bezeichnet es das Unheil des Gerichts, nicht moralisch böses Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zieht seine Worte nicht zurück“ beziehungsweise „widerruft seine Worte nicht“.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische spricht abstrakt von der „Hilfe“ oder „Unterstützung“, nicht von den „Helfern“. Gemeint sein kann die von Ägypten gewährte Unterstützung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הוּא
  choice: Doch auch er
  rationale: 'Die Verbindung ist zugleich additiv und im Kontext kontrastiv: Der HERR ist ebenfalls – und in Wahrheit – weise. Das ausdrücklich gesetzte Pronomen wird bewahrt.'
- source_word: חָכָם
  choice: weise
  rationale: Gibt die übliche Bedeutung wieder und bewahrt den ironischen Kontrast zur vermeintlichen politischen Klugheit Judas und Ägyptens.
- source_word: וַיָּבֵא רָע
  choice: führt Unheil herbei
  rationale: רָע bezeichnet hier im Zusammenhang des göttlichen Gerichts eine verhängte Katastrophe, nicht moralische Bosheit. Die Formulierung hält die aktive Verursachung fest.
- source_word: וְאֶת דְּבָרָיו לֹא הֵסִיר
  choice: Seine Worte nimmt er nicht zurück
  rationale: Die idiomatische deutsche Wendung gibt wieder, dass Gott seine angekündigten Worte nicht widerruft; der Plural דְּבָרָיו bleibt erhalten.
- source_word: וְקָם עַל
  choice: sondern erhebt sich gegen
  rationale: קום mit עַל bezeichnet hier feindliches Einschreiten. „Sondern“ macht den sachlichen Gegensatz zum Nichtzurücknehmen seiner Worte im Deutschen natürlich deutlich.
- source_word: בֵּית מְרֵעִים
  choice: das Haus der Übeltäter
  rationale: Bewahrt die Konstruktverbindung und ihre mögliche kollektive Bedeutung, ohne sie vorschnell auf Haushalt, Dynastie oder Staatswesen festzulegen.
- source_word: עֶזְרַת
  choice: die Hilfe
  rationale: Das Hebräische hat ein abstraktes Substantiv („Hilfe, Unterstützung“), nicht die Personenbezeichnung „Helfer“.
- source_word: פֹּעֲלֵי אָוֶן
  choice: derer, die Unrecht tun
  rationale: Natürliches modernes Deutsch, das sowohl den handelnden Charakter von פֹּעֲלֵי als auch den moralischen Sinn von אָוֶן wiedergibt.
theological_decisions:
- issue: רָע als Folge göttlichen Handelns
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im prophetischen Gerichtskontext bezeichnet רָע eine von Gott herbeigeführte Katastrophe. „Unheil“ bewahrt diesen Gerichtssinn, ohne Gott moralisch böses Handeln zuzuschreiben.
- issue: Bezug des betonten Pronomens הוּא
  choice: Das Pronomen „er“ bleibt stehen und bezieht sich im Kontext auf den HERRN.
  alternative: Den Gottesnamen ausdrücklich einsetzen.
  rationale: Der Kontext bestimmt den Bezug eindeutig; die Beibehaltung des Pronomens wahrt Form und rhetorischen Vergleich des Hebräischen.
- issue: Zeitbezug der Gerichtsaussagen
  choice: Deutsches Präsens
  alternative: Futur („wird Unheil herbeiführen“, „wird sich erheben“) oder Vergangenheit
  rationale: Das Präsens bewahrt die pointierte, als feststehend dargestellte Aussage des Verses und entspricht der aspektuell offenen prophetischen Darstellung, ohne den Zeitbezug stärker festzulegen als der Kontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus der Übeltäter“ erhält die bildhafte und kollektiv offene Ausdrucksweise des Hebräischen; „derer, die Unrecht tun“ vermeidet das heute steife „Wirker des Frevels“. Die Zeichensetzung gliedert den Vers, ohne zusätzliche inhaltliche Festlegungen einzuführen.
