source:
  edition: WLC
  text: וְ/נָפַ֤ל אַשּׁוּר֙ בְּ/חֶ֣רֶב לֹא אִ֔ישׁ וְ/חֶ֥רֶב לֹֽא אָדָ֖ם תֹּֽאכֲלֶ֑/נּוּ וְ/נָ֥ס ל/וֹ֙ מִ/פְּנֵי חֶ֔רֶב וּ/בַחוּרָ֖י/ו לָ/מַ֥ס יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: de
  text: Und Assyrien wird durch ein Schwert fallen, das nicht von einem Mann kommt[a], und ein Schwert, das nicht von einem Menschen kommt, wird es verzehren[b]. Es wird vor dem Schwert fliehen, und seine jungen Männer[c] werden zu Zwangsarbeit herangezogen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch ein Schwert, nicht eines Mannes“. Im Hebräischen stehen אִישׁ („Mann“) und אָדָם („Mensch/Menschheit“) parallel nebeneinander.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Schwert, das nicht durch menschliche Macht wirkt; auf welche Weise der HERR sein Gericht vollzieht, lässt der Text offen.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „seine Männer in der Blüte ihrer Kraft“; das hebräische Wort bezeichnet junge Männer und kann besonders in militärischem Zusammenhang gebraucht werden.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „werden Fronarbeit leisten müssen“; das Wort kann auch auferlegte Abgaben oder Tribut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפַל
  choice: Und … wird … fallen
  rationale: Das Qal-Perfekt mit וְ steht hier im prophetischen Zusammenhang mit Zukunftsbezug; die Wiedergabe mit „wird fallen“ bringt die Ankündigung natürlich zum Ausdruck.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Der Name bezeichnet hier kollektiv die assyrische Macht; „Assyrien“ ist die übliche moderne deutsche Form.
- source_word: בְּחֶרֶב
  choice: durch ein Schwert
  rationale: Die Präposition בְּ kennzeichnet das Mittel. „Durch ein Schwert“ bewahrt diesen instrumentalen Sinn.
- source_word: לֹא אִישׁ
  choice: das nicht eines Mannes ist
  rationale: Die Formulierung kennzeichnet das Schwert als nicht menschlichen Ursprungs beziehungsweise nicht von einem menschlichen Kämpfer geführt. „Mann“ bildet אִישׁ ab und wahrt den Parallelismus.
- source_word: וְחֶרֶב לֹא אָדָם
  choice: ein Schwert, das nicht eines Menschen ist
  rationale: „Mensch“ gibt das allgemeinere אָדָם wieder und lässt zugleich den feinen Unterschied zum vorherigen אִישׁ („Mann“) erkennen.
- source_word: תֹּאכֲלֶנּוּ
  choice: wird es verzehren
  rationale: Das feminine Verb bezieht sich auf „Schwert“. „Verzehren“ gibt den bildhaften Gebrauch von אכל in Verbindung mit dem Schwert würdig und verständlich wieder. Das Pronomen „es“ nimmt das kollektiv verstandene Assyrien auf.
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: Es wird vor dem Schwert fliehen
  rationale: Assyrien bleibt als kollektiv-singularisches Subjekt bestehen. „Vor dem Schwert fliehen“ ist die natürliche deutsche Entsprechung von מִפְּנֵי חֶרֶב; das unbetonte לוֹ verlangt hier keine eigene Wiedergabe.
- source_word: בַחוּרָיו
  choice: seine jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich junge Männer in ihrer Kraft, hier wahrscheinlich in militärischem Zusammenhang. Die Übersetzung vermeidet es, „Krieger“ ausdrücklich in den Text einzutragen.
- source_word: לָמַס יִהְיוּ
  choice: werden zur Zwangsarbeit herangezogen werden
  rationale: מַס kann auferlegte Fron- oder Tributarbeit bezeichnen. Die deutsche Wendung drückt sowohl den Zwang als auch den infolge der Niederlage eintretenden Zustand klar aus.
theological_decisions:
- issue: Art des Schwertes, durch das Assyrien besiegt wird
  choice: Ein Schwert, das nicht menschlichen Ursprungs beziehungsweise nicht von menschlicher Macht geführt ist
  alternative: Ein buchstäbliches Schwert ohne menschlichen Träger oder ein Bild für göttliches Eingreifen, etwa durch Plage oder Engelgericht
  rationale: Der hebräische Text verneint zweimal menschliche Zugehörigkeit beziehungsweise menschliches Handeln, legt aber die genaue Weise des Gerichts nicht fest. Die Übersetzung lässt diese Spannung bestehen und benennt keinen bestimmten Mechanismus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der doppelte, knappe Parallelismus von „Mann“ und „Mensch“ bleibt erhalten, ohne die nicht näher bestimmte göttliche Gerichtsweise auszudeuten. Die kollektiv-singularische Rede von Assyrien wird im Deutschen mit dem sächlichen Pronomen „es“ fortgeführt.
