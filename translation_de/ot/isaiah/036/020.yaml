source:
  edition: WLC
  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: de
  text: Wer von all den Göttern dieser Länder hat denn sein Land aus meiner Hand gerettet, dass Jahwe Jerusalem aus meiner Hand retten sollte?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: Wer von all den Göttern dieser Länder
  rationale: „Wer von all den …“ gibt die distributive Frage und den höhnischen Ton natürlich wieder; „Länder“ passt zum Zusammenhang der eroberten Gebiete.
- source_word: הִצִּילוּ
  choice: hat … gerettet
  rationale: Das Hifil von נצל bezeichnet hier die Rettung aus militärischer Gewalt. Der Singular folgt im Deutschen dem interrogativen „Wer“.
- source_word: אַרְצָם
  choice: sein Land
  rationale: Der hebräische Pluralsuffix bezieht sich kollektiv auf die zuvor genannten Götter; nach dem distributiven „Wer“ ist im Deutschen „sein Land“ idiomatisch.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die konkrete hebräische Metapher für Macht und Verfügungsgewalt bleibt erhalten.
- source_word: כִּי יַצִּיל
  choice: sodass … retten sollte
  rationale: Die Formulierung bewahrt die rhetorische Folgerung und den spöttischen Zweifel des Sprechers, ohne den Imperfekt bloß als neutrale Zukunft wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt den Eigenname-Charakter, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Rhetorischer Anspruch des assyrischen Sprechers
  choice: „retten sollte“ als spöttisch bestrittene Möglichkeit
  alternative: „retten wird“ als einfache Zukunft
  rationale: Der Vers formuliert keine theologische Aussage des Erzählers über Jahwes Macht, sondern den höhnischen Schluss des Rabschake. Die gewählte Form hält diese Sprecherperspektive erkennbar.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „aus meiner Hand“ und „retten“ wurde wie im Hebräischen beibehalten, um Nachdruck und rhetorische Geschlossenheit zu wahren.
