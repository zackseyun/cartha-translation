source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: de
  text: 'Hört nicht auf Hiskia! Denn so spricht der König von Assyrien: Schließt Frieden mit mir[a] und kommt zu mir heraus! Und jeder soll von seinem eigenen Weinstock essen, jeder von seinem eigenen Feigenbaum, und jeder soll das Wasser aus seiner eigenen Zisterne trinken[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Macht mit mir einen Segen.« Die Wendung bedeutet hier, Frieden zu schließen oder sich auf günstige Bedingungen zu einigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht dreimal אִישׁ („Mann“, hier distributiv: „jeder“): jeweils bei Weinstock, Feigenbaum und dem Wasser aus der Zisterne.'
    reason: source_form
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: Hört nicht auf
  rationale: Die Verbindung שׁמע אל bedeutet hier, auf jemanden zu hören bzw. seinem Rat zu folgen. Die deutsche Wendung bewahrt beides, ohne bereits vollständigen Gehorsam auszudrücken.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Gebräuchliche deutsche Namensform.
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Gibt die formelhafte Einleitung direkter Rede knapp und in geläufigem biblischem Deutsch wieder.
- source_word: הַמֶּלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Natürliche deutsche Wiedergabe der Status-constructus-Verbindung, die den politischen Titel erhält.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Schließt Frieden mit mir
  rationale: Die wörtlich auf einen „Segen“ bezogene diplomatische Wendung fordert dazu auf, günstige Bedingungen beziehungsweise Frieden mit dem assyrischen König zu vereinbaren. Die ungewöhnliche wörtliche Form bleibt in einer Fußnote sichtbar.
- source_word: וּצְאוּ אֵלַי
  choice: und kommt zu mir heraus
  rationale: Bewahrt die konkrete Bewegungsformulierung des Hebräischen. „Ergebt euch mir“ wäre kontextuell naheliegend, aber stärker auslegend.
- source_word: וְאִכְלוּ ... וּשְׁתוּ
  choice: Dann soll jeder ... essen und ... trinken
  rationale: Die deutschen Aufforderungsformen mit „soll“ geben die Imperativfolge natürlich wieder und lassen zugleich den verlockenden, zusageähnlichen Ton der Rede erkennen.
- source_word: אִישׁ
  choice: jeder
  rationale: Das dreimalige אִישׁ wird distributiv gebraucht. „Jeder“ gibt diesen Sinn im modernen Deutschen wieder, ohne unnötig eine ausschließlich männliche Personengruppe zu formulieren; die Wiederholung wird in der Fußnote erläutert.
- source_word: גַּפְנוֹ ... תְּאֵנָתוֹ
  choice: seinem eigenen Weinstock und seinem eigenen Feigenbaum
  rationale: „Eigenen“ verdeutlicht die Possessivsuffixe und die rhetorische Zusicherung persönlicher Versorgung und Sicherheit.
- source_word: מֵי בוֹרוֹ
  choice: das Wasser aus seiner eigenen Zisterne
  rationale: בּוֹר bezeichnet hier am präzisesten eine Zisterne, also einen Behälter beziehungsweise eine Grube zum Sammeln von Wasser, nicht notwendig einen grundwassergespeisten Brunnen.
theological_decisions:
- issue: Die Aufforderung וּצְאוּ אֵלַי als Kapitulationsforderung
  choice: kommt zu mir heraus
  alternative: ergebt euch mir
  rationale: Der Kontext legt Kapitulation nahe, doch der hebräische Wortlaut nennt ausdrücklich nur das Herauskommen. Die Übersetzung bewahrt diese Spannung und vermeidet eine stillschweigende Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Botenformel „Denn so spricht“ erhält den feierlich-offiziellen Ton. Der Satz bleibt als Teil der fortlaufenden Rede mit Komma offen. Die Fußnotenmarker stehen jeweils an der sachlich zugehörigen Stelle.
