source:
  edition: WLC
  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: de
  text: 'Lasst euch von Hiskia nicht irreführen[a], indem er sagt: »Jahwe wird uns retten.« Haben etwa die Götter der Völker – jeder Einzelne von ihnen[b] – sein Land aus der Hand des Königs von Assyrien gerettet?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann hier auch »bewegen«, »verleiten« oder »überreden« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Hat je einer von den Göttern der Völker sein Land aus der Hand des Königs von Assyrien gerettet?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יַסִּית אֶתְכֶם
  choice: Lasst euch … nicht irreführen
  rationale: פֶּן leitet hier eine Warnung ein; die deutsche Aufforderung mit »nicht« gibt diese Funktion natürlich wieder. Der Hifil von סות kann zum Bewegen, Verleiten oder Irreführen bezeichnen. »Irreführen« passt zur polemischen Behauptung des assyrischen Sprechers, ohne die Bedeutung unnötig auf bloßes Überreden oder vorsätzliche Täuschung festzulegen.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Form des hebräischen Personennamens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die gängige deutsche Umschrift.
- source_word: יַצִּילֵנוּ
  choice: wird uns retten
  rationale: Der Hifil von נצל bezeichnet hier die Rettung aus militärischer Bedrohung. »Retten« ist im Deutschen klar und natürlich.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: die Götter der Völker
  rationale: Die Genitivverbindung bildet den hebräischen Ausdruck direkt und idiomatisch ab; »Völker« bewahrt dessen ethnisch-politischen Sinn.
- source_word: אִישׁ אֶת־אַרְצוֹ
  choice: jeder Einzelne von ihnen … sein Land
  rationale: אִישׁ wird distributiv gebraucht. Die eingeschobene Formulierung bewahrt sowohl den vorausgehenden Plural »Götter« als auch den anschließenden Singular »sein Land«.
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: aus der Hand des Königs von Assyrien
  rationale: Die deutsche Wendung bleibt verständlich und bewahrt das hebräische Bild der Hand als Ausdruck von Macht und Herrschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. Die Umschrift »Jahwe« wahrt diesen Unterschied gegenüber einem ersetzenden Titel.
- issue: Aussage über die Götter der Völker
  choice: Die rhetorische Frage wird ohne erklärenden Zusatz wiedergegeben.
  alternative: Eine Formulierung, die ihre Nichtexistenz oder tatsächliche Machtlosigkeit ausdrücklich kommentiert.
  rationale: Der Vers gibt die polemische Rede des assyrischen Sprechers wieder und setzt die Götter der Völker rhetorisch mit Jahwe in Beziehung. Die Übersetzung darf diese Spannung nicht durch einen theologischen Kommentar im Haupttext vorweg auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede steht in deutschen Anführungszeichen; die rhetorische Frage und das Bild »aus der Hand« bleiben erhalten. Der Gedankenstrich macht die distributive Einfügung lesbar, ohne die auffällige Numerusspannung des Hebräischen einzuebnen.
