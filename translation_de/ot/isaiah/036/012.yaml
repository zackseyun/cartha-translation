base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: de
  text: 'Doch der Rabschake sagte: »Hat mein Herr mich zu deinem Herrn und zu dir gesandt, um diese Worte zu sagen? Hat er mich nicht zu den Männern gesandt, die auf der Mauer sitzen, um mit euch ihren eigenen Kot zu essen und ihren eigenen Urin zu trinken?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht bewusst derbe Belagerungssprache, wörtlich: „ihren Kot essen und ihren Urin trinken“. Der überlieferte Konsonantentext enthält die groben Ausdrücke; die masoretische Lesetradition bietet dafür weniger anstößige Umschreibungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Die im Deutschen eingebürgerte Umschrift bewahrt die assyrische Amtsbezeichnung, ohne sie durch eine unsichere funktionale Übersetzung zu verengen.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: deinem Herrn / mein Herr
  rationale: 'Beide Ausdrücke bezeichnen hier politische Herren: Hiskia beziehungsweise den assyrischen König. Die Kleinschreibung vermeidet eine Verwechslung mit einer Gottesbezeichnung.'
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: um diese Worte zu sagen
  rationale: Gibt die konkrete Wendung mit דְּבָרִים eng und zugleich in natürlichem Deutsch wieder.
- source_word: הֲלֹא
  choice: Etwa nicht
  rationale: Bewahrt die zweite rhetorische Frage und ihre erwartete bejahende Antwort, ohne sie mit der ersten Frage zu verschmelzen.
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: die Männer, die auf der Mauer sitzen
  rationale: Entspricht dem maskulinen Plural und gibt das Partizip als natürliche deutsche Relativkonstruktion wieder.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: damit sie ... essen und ... trinken
  rationale: Die Infinitive bezeichnen im Zusammenhang die von der Belagerung herbeigeführte Folge beziehungsweise das Ziel der Drohrede. Die Formulierung bleibt hart, ohne die zusätzliche Deutung „dazu verdammt“ einzutragen.
- source_word: חראיהם
  choice: ihren eigenen Kot
  rationale: Die derbe Bezeichnung wird deutlich und verständlich wiedergegeben; „eigenen“ macht den Personenbezug des Suffixes im Deutschen idiomatisch sichtbar.
- source_word: שיניהם
  choice: ihren eigenen Urin
  rationale: Gibt den Sinn der bewusst vulgären Belagerungssprache klar wieder; die Besonderheit der Schreib- und Lesetradition wird in der Fußnote erläutert.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Bewahrt den komitativen Sinn und die Anrede im maskulinen Plural.
