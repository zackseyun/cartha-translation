base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: de
  text: 'Du sagst[a]: »Rat und Stärke zum Krieg« – doch das sind nur Lippenworte. Auf wen vertraust du nun, dass du dich gegen mich aufgelehnt hast?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die masoretische Lesung lautet: »Ich sagte«. »Du sagst« folgt dem Paralleltext in 2 Könige 18,20 sowie alten Übersetzungen und passt zum Redezusammenhang.'
    reason: Die Übersetzung übernimmt eine gut bezeugte, kontextuell passende Lesung, die vom masoretischen Text abweicht; die Fußnote macht diese textkritische Entscheidung transparent.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Du sagst
  rationale: Obwohl die masoretische Konsonanten- und Vokalgestalt formal »ich sagte« lautet, stützen der Paralleltext in 2 Könige 18,20, die antiken Versionen und der unmittelbare Redezusammenhang die Anrede »du sagst«; vermutlich liegt eine alte Text- oder Überlieferungsvariante vor.
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  choice: Das sind doch nur Lippenworte
  rationale: Gibt die abwertende Einschränkung אַךְ und das Idiom für bloßes, substanzloses Reden natürlich und prägnant wieder.
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  choice: Rat und Stärke zum Krieg
  rationale: Bewahrt die beiden abstrakten Hauptwörter und den militärischen Bezug. »Stärke« lässt offen, ob militärische Macht, Fähigkeit oder Tatkraft gemeint ist.
- source_word: בָטַחְתָּ
  choice: vertraust du
  rationale: Das hebräische Verb bezeichnet das Setzen von Vertrauen oder Zuversicht auf jemanden; das deutsche Präsens passt zum gegenwärtigen Vertrauen, das die Auflehnung ermöglicht.
- source_word: מָרַדְתָּ בִּי
  choice: dich gegen mich aufgelehnt hast
  rationale: מָרַד bezeichnet politische Rebellion oder Auflehnung; die reflexive Formulierung ist im Deutschen natürlich und wahrt den politischen Ton.
theological_decisions:
- issue: Sprecherwechsel bzw. Textvariante bei אָמַרְתִּי
  choice: »Du sagst« im Haupttext
  alternative: »Ich sagte«
  rationale: »Du sagst« entspricht dem Paralleltext 2 Könige 18,20, den alten Übersetzungen und dem Sinn der assyrischen Herausforderung. »Ich sagte« würde die Zuordnung der folgenden Worte syntaktisch und rhetorisch erschweren. Da dies textkritisch relevant ist, wird die masoretische Lesung in einer Fußnote offengelegt.
- issue: Bezug und Ton von »Rat und Stärke zum Krieg«
  choice: Als spöttisch zitierte Behauptung Hiskias wiedergegeben
  alternative: 'Als Aussage des assyrischen Sprechers: »Bei bloßen Lippenworten wären Rat und Stärke zum Krieg nötig«'
  rationale: Die gewählte Zeichensetzung folgt dem wahrscheinlichsten Zusammenhang und der Parallelüberlieferung, ohne eine theologische Deutung über Vertrauen und Rebellion hinaus einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Herausforderung bleibt scharf und rhetorisch. Zur vorgeschriebenen Sichtbarkeit der Fußnote muss der Marker im Haupttext direkt nach »sagst« stehen.
