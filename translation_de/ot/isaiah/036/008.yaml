source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י הַ/מֶּ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: de
  text: 'Nun denn, geh doch mit meinem Herrn, dem König von Assyrien, eine Wette ein[a]: Ich gebe dir zweitausend Pferde, wenn du die Reiter dafür stellen kannst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geh eine Verpflichtung mit ihm ein“; auch: „lass dich auf einen Wettstreit mit ihm ein“. Das hebräische Verb kann das Eingehen einer Verpflichtung, einer Wette oder einer Herausforderung bezeichnen. Hier legt der spöttische Zusammenhang eine Wette beziehungsweise Herausforderung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: geh doch … eine Wette ein
  rationale: Das Hitpael von ערב bezeichnet hier im spöttischen diplomatischen Zusammenhang das Eingehen auf eine Wette oder Herausforderung. „Doch“ gibt die höflich klingende, zugleich höhnische Abschwächung durch נָא natürlich wieder.
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: mit meinem Herrn, dem König von Assyrien
  rationale: Die Wendung bezeichnet den anderen Beteiligten an der Wette. „Herr“ meint hier eindeutig den menschlichen Gebieter des Sprechers; die Apposition bewahrt den hebräischen Titel.
- source_word: וְאֶתְּנָה לְךָ
  choice: Ich gebe dir
  rationale: Die Form drückt das unmittelbar an die Herausforderung anschließende Angebot aus. Der deutsche Präsensgebrauch wirkt bei einem verbindlichen Angebot natürlich und bestimmt.
- source_word: אַלְפַּיִם סוּסִים
  choice: zweitausend Pferde
  rationale: Direkte Wiedergabe der Zahl und des Substantivs.
- source_word: אִם תּוּכַל
  choice: wenn du … kannst
  rationale: Gibt die Bedingung der Fähigkeit klar wieder und bewahrt im Kontext den spöttischen Zweifel daran.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: die Reiter dafür stellen
  rationale: Gemeint ist nicht bloß das körperliche Aufsetzen von Reitern, sondern das Bereitstellen genügend berittener Männer. Die deutsche Wendung ist knapp und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die scheinbar höfliche Aufforderung und der höhnische Ton bleiben durch „geh doch“ sowie die konditionale Schlusswendung erhalten.
