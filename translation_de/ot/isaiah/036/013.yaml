base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/013.yaml
  text: Then the Rabshakeh stood and called out loudly in Judean, and said, “Hear the words of the great king, the king of Assyria.”
translation:
  language: de
  text: 'Da stellte sich der Rabschake hin und rief mit lauter Stimme auf Judäisch: »Hört die Worte des Großkönigs, des Königs von Assyrien!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird in seiner im Deutschen bibelsprachlich etablierten Form wiedergegeben, ohne ihn als Eigennamen festzulegen.
- source_word: בְקוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Gibt die hebräische Wendung natürlich und zugleich formnah wieder.
- source_word: יְהוּדִית
  choice: auf Judäisch
  rationale: Bezeichnet hier die Sprache Judas; die Wiedergabe bewahrt die historische Ausdrucksweise, ohne sie vorschnell mit einer späteren Sprachbezeichnung gleichzusetzen.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: des Großkönigs
  rationale: Die kompakte deutsche Titelform entspricht dem königlichen Herrschaftsanspruch und klingt im Kontext wie eine offizielle Proklamation.
theological_decisions: []
translation_notes:
  register: Würdevolle, klare Proklamationssprache. Die Wiederholung von »König« bleibt erhalten, während das zweite וַיֹּאמֶר idiomatisch durch den Doppelpunkt in die direkte Rede überführt wird.
