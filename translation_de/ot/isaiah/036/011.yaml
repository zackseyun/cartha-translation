  text: וַ/יֹּ֣אמֶר אֶלְיָקִים֩ וְ/שֶׁבְנָ֨א וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר אֵלֵ֨י/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חוֹמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: de
  text: 'Da sagten Eljakim, Schebna und Joach zum Rabschake[a]: »Bitte sprich mit deinen Dienern aramäisch, denn wir verstehen es. Sprich nicht so mit uns judäisch[b], dass das Volk auf der Mauer es hören kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Rabschake« ist wahrscheinlich ein assyrischer Amtstitel und kein Personenname.
    reason: cultural_note
  - marker: b
    text: 'Oder: »hebräisch«. Der hebräische Ausdruck bezeichnet genauer die Sprache Judas beziehungsweise der Judäer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der akkadischstämmige Ausdruck ist wahrscheinlich ein assyrischer Amtstitel. Die traditionelle Transkription vermeidet eine unsichere Festlegung auf eine konkrete Amtsfunktion.
- source_word: דַּבֶּר נָא
  choice: Bitte sprich
  rationale: Der Imperativ mit נָא formuliert eine höfliche, ehrerbietige Bitte.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: Die höfische Selbstbezeichnung drückt Unterordnung aus; »Diener« ist hier treffender als »Sklaven« oder die nivellierende Wiedergabe »Beamte«.
- source_word: אֲרָמִית
  choice: aramäisch
  rationale: Die Form bezeichnet die aramäische Sprache; die adverbiale deutsche Wiedergabe ist natürlich und genau.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: denn wir verstehen es
  rationale: שׁמע bedeutet im Zusammenhang mit einer Sprache nicht bloß akustisches Hören, sondern Verstehen.
- source_word: יְהוּדִית
  choice: judäisch
  rationale: Der Ausdruck bezeichnet spezifisch die Sprache Judas beziehungsweise der Judäer. »Judäisch« bewahrt diesen ethnolinguistischen Bezug besser als die geläufige, aber weiter gefasste Bezeichnung »Hebräisch«.
- source_word: בְּאָזְנֵי הָעָם
  choice: solange das Volk … es hören kann
  rationale: Die hebräische Wendung meint, dass etwas in Hörweite beziehungsweise vor den Ohren des Volkes gesagt wird; die deutsche Formulierung gibt die kommunikative Absicht natürlich wieder.
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: das Volk auf der Mauer
  rationale: הָעָם bezeichnet das Volk beziehungsweise die Leute; »Soldaten« wäre eine unbelegte Verengung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt höflich und diplomatisch. »Judäisch« bewahrt die historische Sprachbezeichnung; die verständlichere traditionelle Alternative steht in der Fußnote.
