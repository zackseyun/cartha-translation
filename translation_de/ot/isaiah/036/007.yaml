  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: de
  text: 'Doch wenn du zu mir sagst: »Wir vertrauen auf den HERRN, unseren Gott«, ist er nicht der, dessen Höhenheiligtümer und Altäre Hiskia beseitigt hat und zu Juda und Jerusalem sagte: »Vor diesem Altar sollt ihr euch niederwerfen«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּמוֹת
  choice: Höhenheiligtümer
  rationale: Bezeichnet kultische Opferstätten auf Anhöhen beziehungsweise lokale Kultstätten; »Höhenheiligtümer« ist im Deutschen verständlicher und präziser als das bloße »Höhen«.
- source_word: תִּשְׁתַּחֲווּ
  choice: sollt ihr euch niederwerfen
  rationale: Gibt die körperliche Huldigung beziehungsweise kultische Verehrung wieder, ohne die Handlung vorschnell nur als inneres »Anbeten« zu deuten.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist im Bibelregister gut erkennbar und entspricht der konsultierten Textschicht.
- source_word: הֵסִיר
  choice: beseitigt hat
  rationale: Gibt das Entfernen der Kultstätten natürlich und mit der im Kontext beabsichtigten Endgültigkeit wieder.
theological_decisions:
- issue: Deutung der Kultreform Hiskias durch den assyrischen Sprecher
  choice: Die rhetorische Frage bleibt als Behauptung des Sprechers stehen, ohne redaktionelle Korrektur.
  alternative: Durch erklärende Zusätze kenntlich machen, dass Hiskia nicht gegen den HERRN, sondern gegen unrechtmäßige Kultstätten vorging.
  rationale: Der Vers gibt die polemische Fehldeutung des Rabschake wieder. Die Spannung zur biblischen Bewertung von Hiskias Reform darf nicht im Haupttext aufgelöst werden.
- issue: Bezug der Possessivformen »seine Höhenheiligtümer und seine Altäre«
  choice: Durch »dessen Höhenheiligtümer und Altäre« wird der behauptete Bezug auf den HERRN bewahrt.
  alternative: »die Höhenheiligtümer und Altäre« ohne Possessivbezug.
  rationale: Das Hebräische stellt diese Kultstätten ausdrücklich als die des genannten Gottes dar, jedenfalls aus der Perspektive des Sprechers.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und die rhetorische Spitze des assyrischen Sprechers bleiben deutlich; der Satzbau wurde für flüssiges Deutsch leicht geglättet, ohne die inhaltliche Spannung aufzulösen.
