  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: de
  text: 'So spricht der König: Lasst euch nicht von Hiskia täuschen[a], denn er wird euch nicht retten können[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: irreführen.'
