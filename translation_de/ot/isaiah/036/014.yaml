  - marker: b
    text: 'Oder: befreien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die geläufige deutsche Botenformel gibt die formelle königliche Proklamation natürlich und würdevoll wieder; das hebräische Perfekt wird in dieser Einleitungsformel idiomatisch mit dem Präsens übersetzt.
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: Lasst euch nicht von Hiskia täuschen
  rationale: Die deutsche Konstruktion mit „sich täuschen lassen“ gibt das Verbot natürlich wieder. יַשִּׁא bezeichnet hier ein Irreführen oder Täuschen; לָכֶם wird idiomatisch in die deutsche Verbkonstruktion aufgenommen.
- source_word: כִּי לֹא יוּכַל
  choice: denn er wird … nicht … können
  rationale: „Denn“ führt die Begründung ein; die Formulierung bewahrt die ausgedrückte Unfähigkeit und den im Zusammenhang vorausblickenden Sinn.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: euch retten
  rationale: הציל bezeichnet die Rettung aus konkreter Gefahr. „Retten“ ist im Deutschen in diesem militärischen Zusammenhang klar und natürlich; „befreien“ bleibt als mögliche Nuance in der Fußnote erhalten.
theological_decisions:
- issue: Bezug von „der König“
  choice: Die allgemeine Bezeichnung „der König“ bleibt stehen und verweist im Kontext auf den assyrischen König.
  alternative: „Sanherib“ oder „der große König“
  rationale: Der hebräische Vers nennt weder den Namen noch das Attribut „groß“. Eine Präzisierung würde Kontextinformation in den Wortlaut eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Botenformel „So spricht der König“ bewahrt den formellen Charakter; die übrige Syntax ist bewusst gegenwärtig und direkt.
