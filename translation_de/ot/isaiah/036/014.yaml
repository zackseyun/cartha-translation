  source_fidelity: Der Text gibt die hebräische Botenformel כֹּה אָמַר הַמֶּלֶךְ treffend als „So spricht der König“ wieder. Das Verbot אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ ist mit „Lasst euch nicht von Hiskia täuschen“ idiomatisch und semantisch angemessen wiedergegeben. „Denn er wird euch nicht retten können“ bewahrt sowohl die begründende Funktion von כִּי als auch die ausgesagte Unfähigkeit (לֹא יוּכַל לְהַצִּיל).
