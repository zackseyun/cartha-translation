  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֣וּר אֶת רַב שָׁקֵ֨ה מִ/לָּכִ֧ישׁ יְרוּשָׁלְַ֛מָ/ה אֶל הַ/מֶּ֥לֶךְ חִזְקִיָּ֖הוּ בְּ/חֵ֣יל כָּבֵ֑ד וַֽ/יַּעֲמֹ֗ד בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: de
  text: Da sandte der König von Assyrien den Rabschake[a] mit einer großen Streitmacht von Lachisch nach Jerusalem zu König Hiskia. Er nahm an der Wasserleitung des oberen Teiches Aufstellung, an der Straße am Feld des Walkers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rabschake“ ist ein assyrischer Amtstitel, kein Personenname; die genaue deutsche Amtsbezeichnung ist unsicher.
    reason: Die Transliteration bewahrt den historischen Titel, bedarf aber für heutige Leser einer Erklärung.
  - marker: b
    text: 'Oder: „an der Straße zum Feld des Walkers“; „Walker“ bezeichnet einen gewerblichen Tuchbearbeiter bzw. Wäscher.'
    reason: Die hebräische Genitivverbindung beschreibt die Beziehung von Straße und Feld knapp; ob die Straße am Feld entlangführt oder auf dieses zu verläuft, bleibt offen.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird als traditionell eingebürgerte deutsche Form wiedergegeben, statt ihn als Eigennamen zu behandeln oder durch eine unsichere moderne Amtsbezeichnung zu ersetzen.
- source_word: בְּחֵיל כָּבֵד
  choice: mit einer großen Streitmacht
  rationale: חַיִל bezeichnet hier eine militärische Truppe; כָּבֵד beschreibt ihre beträchtliche Stärke bzw. Größe. „Große Streitmacht“ ist im Deutschen natürlich und kontextgerecht.
- source_word: וַיַּעֲמֹד
  choice: Er nahm … Aufstellung
  rationale: Im militärischen Kontext bezeichnet das Stehen am genannten Ort zweckmäßig das Positionieren bzw. Aufstellungnehmen, nicht nur ein beiläufiges Stehen.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: Wasserleitung des oberen Teiches
  rationale: תְּעָלָה bezeichnet einen Kanal oder eine Leitung; „Wasserleitung“ gibt die Funktion an dieser topografischen Stelle klar wieder.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: Straße zum Walkerfeld
  rationale: מְסִלָּה ist eine angelegte Straße; כוֹבֵס bezeichnet einen gewerblichen Wäscher bzw. Walker. Die Zielbeziehung „zum“ ist idiomatisches Deutsch, während der hebräische Ausdruck formal auch als Genitivverbindung verstanden werden kann.
