  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Angaben des Hebräischen im Wesentlichen zuverlässig wieder: Der assyrische König sendet den Rabschake von Lachisch zu Hiskia nach Jerusalem mit einer beträchtlichen Streitmacht; dieser steht bei der Wasserleitung des oberen Teiches. Die Wiedergabe „an der Straße zum Walkerfeld“ legt jedoch eine Zielrichtung („zum“) fest, die in der hebräischen Genitivverbindung מְסִלַּת שְׂדֵה כוֹבֵס nicht ausdrücklich enthalten ist. Eine örtliche Verbindung der Straße mit dem Feld ist sicherer.'
  naturalness: „Da sandte …“ und „nahm … Aufstellung“ sind natürliches, würdiges modernes Standarddeutsch. „Feld des Walkers“ ist verständlich, wenn auch historisch geprägt; die Fußnote erläutert den Beruf angemessen. „an der Straße am Feld des Walkers“ ist idiomatisch und vermeidet die unnötige Richtungsfestlegung.
  terminology: „Rabschake“ bewahrt zutreffend den assyrischen Amtstitel und sollte nicht als Personenname aufgelöst werden. „Große Streitmacht“ ist eine angemessene idiomatische Wiedergabe von בְּחֵיל כָּבֵד. „Wasserleitung des oberen Teiches“ ist für תְּעָלַת … sachgerecht. Für כוֹבֵס ist „Walker“ als historische Fachbezeichnung tragfähig; die erläuternde Alternative „Wäscher“ sollte als mögliche, nicht identische moderne Annäherung kenntlich bleiben.
