  text: וַ/יְהִ֡י בְּ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗הוּ עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: de
  text: Im vierzehnten Regierungsjahr des Königs Hiskia zog Sanherib, der König von Assyrien, gegen alle befestigten Städte Judas herauf und nahm sie ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Im …
  rationale: Die Erzählform leitet den neuen Abschnitt ein. Im modernen Deutschen braucht es dafür kein eigens wiedergegebenes „Und es geschah“; die Datumsangabe eröffnet den Satz natürlich.
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: Im vierzehnten Regierungsjahr König Hiskias
  rationale: Die Wendung ist eine Datierungsformel nach Regierungsjahren. „Regierungsjahr“ macht die Beziehung des Jahres zum König im Deutschen knapp und eindeutig.
- source_word: עָלָה … עַל
  choice: zog … gegen … herauf
  rationale: עלה mit עַל bezeichnet hier das militärische Vorrücken gegen ein Ziel. „Heraufziehen“ bewahrt die Richtungsnuance, während „gegen“ die feindliche Bewegung ausdrückt.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Apposition bezeichnet Sanheribs Amt und Herrschaftsgebiet; der bestimmte Artikel ist im natürlichen deutschen Satzbau angemessen.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: gegen alle befestigten Städte Judas
  rationale: „Befestigt“ gibt den militärischen Schutz der Städte präzise wieder; „Judas“ ist der natürliche deutsche Genitiv des Landesnamens Juda.
- source_word: וַיִּתְפְּשֵׂם
  choice: und nahm sie ein
  rationale: תפשׂ bedeutet ergreifen oder in Besitz nehmen. Bei Städten ist „einnehmen“ die idiomatische deutsche Bezeichnung für ihre militärische Eroberung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle, heute schwerfällige Eröffnung „Und es geschah“ wird nicht verwendet. Der Satz bleibt erzählerisch knapp und bewahrt mit „herauf“ die räumlich-militärische Färbung des hebräischen Verbs.
