base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: de
  text: Wo sind die Götter von Hamat und Arpad? Wo sind die Götter von Sefarwajim? Und haben sie Samaria aus meiner Hand gerettet?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: befreit; auch: errettet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Wo sind
  rationale: Das Ortsfragewort ist unveränderlich; wegen des pluralischen Bezugsworts »Götter« lautet die natürliche deutsche Wiedergabe »Wo sind«.
- source_word: אֱלֹהֵי
  choice: die Götter von
  rationale: Die Konstruktform steht im Plural. Der bestimmte Artikel entspricht hier natürlichem Deutsch und der konkreten Bezugnahme auf die Gottheiten der genannten Städte.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamat und Arpad
  rationale: Die Ortsnamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben; die Konjunktion bleibt erhalten.
- source_word: סְפַרְוָיִם
  choice: Sefarwajim
  rationale: Diese Form bildet die hebräische Namensform im Deutschen nachvollziehbar ab.
- source_word: וְכִי
  choice: Haben sie etwa
  rationale: Die Partikel leitet die zugespitzte rhetorische Frage ein. »Etwa« macht den spöttisch verneinenden Unterton in natürlichem Deutsch kenntlich, ohne die Frage in eine Aussage umzuwandeln.
- source_word: הִצִּילוּ
  choice: gerettet
  rationale: Das Hifil von נצל bezeichnet hier die Rettung beziehungsweise Befreiung aus militärischer Gewalt. »Gerettet« ist aktuell und verständlich.
- source_word: אֶת שֹׁמְרוֹן
  choice: Samaria
  rationale: Der direkte Objektmarker bleibt unübersetzt; der Stadtname erscheint in seiner üblichen deutschen Form.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die bildhafte Wendung wird bewahrt, weil sie im Deutschen verständlich ist und den Anspruch auf Macht und Verfügungsgewalt ausdrückt.
theological_decisions:
- issue: Bezug von »meiner Hand« in der Rede des Rabschake
  choice: Die Ich-Form der Prahlrede bleibt ohne erläuternde Deutung stehen.
  alternative: Dynamisch als »aus der Macht des assyrischen Königs« wiedergeben.
  rationale: Der hebräische Text legt dem Sprecher die Behauptung in der ersten Person in den Mund. Die Übersetzung bewahrt diese rhetorische und theologische Spannung, statt den Bezug im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Frageform und die spöttische Zuspitzung der assyrischen Herausforderung bleiben erhalten; die traditionelle Machtmetapher »aus meiner Hand« wird nicht aufgelöst.
