    issue: Die Wiedergabe »Haben sie etwa …?« lässt die Konjunktion וְ aus und fügt »etwa« hinzu.
    rationale: Die Schlussfrage ist rhetorisch, doch וְכִי kann hier ohne zusätzliche pragmatische Verstärkung als »Und haben …?« wiedergegeben werden. Dies wahrt die Verknüpfung und vermeidet eine unnötige Einengung des Tons.
  - severity: medium
    issue: Die Fußnote bietet »ihrer Gewalt entrissen« als lexikalische Alternative.
    rationale: 'Diese Formulierung verändert die Bezugsrelation der Machtmetapher: Gemeint ist ausdrücklich Rettung aus »meiner Hand«, nicht Entrinnen aus der Gewalt der genannten Götter. Eine Fußnote darf diese Bedeutung nicht verschieben.'
