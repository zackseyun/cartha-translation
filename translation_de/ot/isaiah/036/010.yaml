source:
  edition: WLC
  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: de
  text: 'Und nun: Bin ich etwa ohne Jahwe[a] gegen dieses Land heraufgezogen, um es zu zerstören? Jahwe hat zu mir gesagt: »Zieh zu diesem Land hinauf und zerstöre es!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unabhängig von Jahwe«.'
    reason: Lexikalische Alternative für מִבַּלְעֲדֵי; die Wendung bezeichnet ein Handeln ohne bzw. unabhängig von Jahwe.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: Bin ich etwa ohne
  rationale: Die Verbindung aus Fragepartikel und מִבַּלְעֲדֵי bildet eine rhetorische Frage. »Etwa ohne« ist im Deutschen natürlich und wahrt den Sinn eines Handelns unabhängig von Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עָלִיתִי עַל הָאָרֶץ הַזֹּאת
  choice: bin ich gegen dieses Land heraufgezogen
  rationale: עלה bezeichnet das Hinaufziehen; עַל erhält im militärisch-feindlichen Zusammenhang die Bedeutung »gegen«.
- source_word: לְהַשְׁחִיתָהּ
  choice: um es zu zerstören
  rationale: Der Hifil von שׁחת bezeichnet hier die beabsichtigte Zerstörung des Landes.
- source_word: אָמַר אֵלַי
  choice: hat zu mir gesagt
  rationale: Gibt die schlichte Redeeinleitung idiomatisch und zeitlich passend wieder.
- source_word: עֲלֵה אֶל הָאָרֶץ הַזֹּאת
  choice: Zieh gegen dieses Land hinauf
  rationale: Der Imperativ von עלה wird bewahrt; »gegen« macht den militärischen Zusammenhang deutlich.
- source_word: וְהַשְׁחִיתָהּ
  choice: und zerstöre es
  rationale: Die ausdrückliche Wiederholung des Zerstörungsbefehls bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname bleibt sichtbar. Zugleich wird die Behauptung des assyrischen Sprechers, Jahwe habe den Feldzug befohlen, als dessen Aussage wiedergegeben, ohne sie als wahr zu bestätigen.
- issue: Anspruch auf göttliche Beauftragung
  choice: direkte Behauptung des Sprechers unverändert wiedergeben
  alternative: durch distanzierende Zusätze als fragwürdig kennzeichnen
  rationale: Der hebräische Text lässt den Sprecher den Anspruch unmittelbar erheben. Die Übersetzung löst die erzählerische und theologische Spannung nicht durch erklärende Zusätze auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bewegungsrichtung »hinaufziehen« und die rhetorische Frage bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Fragesatz, auf dessen Wendung er sich bezieht.
