    rationale: Im zweiten Teilsatz steht אֶל („zu, auf ... hin“), nicht עַל. Zwar bleibt der militärische Kontext bestehen, doch die Übersetzung sollte die unterschiedliche Präposition nicht ohne Not harmonisieren.
  - severity: low
    issue: Die Fußnote nennt „abseits von Jahwe“ als wörtlichere Wiedergabe.
    rationale: „Abseits von“ ist keine genauere wörtliche Entsprechung von מִבַּלְעֲדֵי und kann räumlich missverstanden werden.
