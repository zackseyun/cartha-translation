  to: Wie könntest du da auch nur einen einzigen Befehlshaber[b], einen der geringsten Diener meines Herrn, zurückschlagen[a], wenn du auf Ägypten vertraust, um Streitwagen und Reiter zu erhalten?
  rationale: Die Überarbeitung stellt den Amtsträger als „einen der geringsten Diener“ des assyrischen Herrn dar, ohne die zusätzliche Gruppenmetapher einzuführen. Sie macht zudem deutlich, dass Juda gerade zur Erlangung militärischer Ressourcen auf Ägypten vertraut. Die idiomatische militärische Wiedergabe „zurückschlagen“ und beide Fußnotenanker bleiben erhalten.
