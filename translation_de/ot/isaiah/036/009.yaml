  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: de
  text: Wie könntest du da auch nur einen einzigen Befehlshaber[b], einen der geringsten Diener meines Herrn, zurückschlagen[a], wenn du auf Ägypten vertraust, um Streitwagen und Reiter zu erhalten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das Angesicht zurückwenden“; die hebräische Wendung bedeutet hier, jemanden abzuwehren oder zurückzutreiben.'
    reason: lexical_alternative
  - marker: b
    text: Oder „Statthalter“ beziehungsweise „Amtsträger“. Das hebräische Wort bezeichnet einen untergeordneten Herrscher oder hohen Beamten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Wie könntest du da
  rationale: Gibt sowohl die rhetorische Frage als auch den an den vorherigen Gedankengang anknüpfenden Sinn des וְ wieder.
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: zurückschlagen
  rationale: Die Wendung bedeutet wörtlich etwa „das Angesicht zurückwenden“, bezeichnet hier aber das Abwehren oder Zurücktreiben eines Gegners. „Zurückschlagen“ bewahrt den militärischen Sinn in natürlichem Deutsch.
- source_word: פַחַת
  choice: Befehlshaber
  rationale: Das Wort bezeichnet einen Statthalter oder ranghohen Amtsträger. Im militärischen Zusammenhang der Herausforderung ist „Befehlshaber“ passend, ohne die breitere Amtsbedeutung in der Fußnote auszublenden.
- source_word: אַחַד
  choice: auch nur einen einzigen
  rationale: 'Diese Formulierung bringt den spöttischen Nachdruck zur Geltung: Hiskia könne nicht einmal einen untergeordneten assyrischen Amtsträger abwehren.'
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: aus den Reihen der geringsten Diener meines Herrn
  rationale: Bewahrt die Rangabstufung und macht die hebräische Zuordnung im Deutschen verständlich; „mein Herr“ bezeichnet aus der Perspektive des Sprechers den assyrischen König.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: wo du dich doch … auf Ägypten verlässt
  rationale: „Wo … doch“ verbindet den Umstand eng mit der rhetorischen Verhöhnung. Das reflexive „dich verlassen auf“ gibt das Vertrauen beziehungsweise die militärische Abhängigkeit idiomatisch wieder.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: bei Streitwagen und Reitern
  rationale: Bezeichnet die militärischen Mittel, derentwegen Juda auf Ägypten setzt. „Streitwagen“ verdeutlicht gegenüber dem allgemeinen „Wagen“ den militärischen Bezug; „Reiter“ ist die direkte, geläufige Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe des assyrischen Spotts wird durch „auch nur einen einzigen“ und „doch“ hörbar gemacht; militärische Begriffe bleiben für heutige Leser unmittelbar verständlich.
