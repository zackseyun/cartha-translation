  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: de
  text: 'Da sagte der Rabschake[a] zu ihnen: »Sagt bitte zu Hiskia: ›So spricht der Großkönig, der König von Assyrien: Was ist das für ein Vertrauen, auf das du vertraust?[b]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Rabschake« ist wahrscheinlich ein assyrischer Amtstitel. Möglich sind etwa »Obermundschenk« oder die allgemeinere Bezeichnung eines hohen Hof- oder Militärbeamten.
    reason: cultural_note
  - marker: b
    text: 'Im Hebräischen stehen hier ein Substantiv und ein Verb aus derselben Wortwurzel: »Vertrauen« und »vertraust«. Die Wiederholung dient der rhetorischen Zuspitzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Der aus dem Akkadischen stammende Ausdruck ist wahrscheinlich ein assyrischer Amtstitel, dessen genaue Funktion umstritten ist. Die traditionelle Wiedergabe als »Rabschake« bewahrt die historische Bezeichnung, ohne sie vorschnell funktional festzulegen.
- source_word: אִמְרוּ נָא
  choice: Sagt bitte
  rationale: Der Imperativ mit נָא wird durch »bitte« angemessen abgemildert und zugleich in natürlichem modernem Deutsch wiedergegeben.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die formelhafte, feierliche Botenrede und ist im Deutschen idiomatischer als eine streng zeitliche Wiedergabe.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: der Großkönig
  rationale: Gibt den assyrischen Herrschertitel knapp und historisch passend wieder und bewahrt seinen anspruchsvollen, propagandistischen Klang.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Apposition wird entsprechend dem Hebräischen beibehalten und erläutert, wer mit dem Großkönig gemeint ist.
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: Was ist das für ein Vertrauen, auf das du vertraust?
  rationale: Die bewusst zugespitzte Verbindung des Substantivs und Verbs aus derselben hebräischen Wurzel wird auch im Deutschen hörbar gemacht, obwohl die Wiederholung stilistisch markiert ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem formellen Klang einer königlichen Botenrede. »Großkönig« bewahrt den assyrischen Herrschertitel; die auffällige Wiederholung von »Vertrauen« ist wegen des hebräischen Wortspiels bewusst stehen gelassen.
