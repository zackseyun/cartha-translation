source:
  edition: WLC
  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: de
  text: Sieh, du vertraust auf Ägypten, auf diesen zerbrochenen Rohrstab. Wenn sich jemand darauf stützt, dringt er ihm in die Hand und durchbohrt sie. So ist der Pharao, der König von Ägypten, für alle, die auf ihn vertrauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einer natürlichen, aber würdevollen deutschen Aufforderung wiedergegeben.
- source_word: בָטַחְתָּ עַל מִצְרַיִם
  choice: du vertraust auf Ägypten
  rationale: Das Perfekt bezeichnet hier die gegenwärtige Haltung des Angesprochenen; „auf jemanden vertrauen“ entspricht dem deutschen Sprachgebrauch.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: diesen zerbrochenen Rohrstab
  rationale: Die Formulierung bewahrt das konkrete Bild eines Rohrs, das als Stütze dienen soll, aber bereits beschädigt und daher gefährlich ist.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Wenn sich jemand darauf stützt
  rationale: Der Relativsatz beschreibt einen typischen Bedingungsfall. „Jemand“ gibt das hier allgemein und stellvertretend gebrauchte אִישׁ natürlich wieder.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: dringt er ihm in die Hand und durchbohrt sie
  rationale: Die anschauliche Verletzung bleibt erhalten; das Präsens entspricht der bildhaften Folge im hebräischen Vergleich.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: So ist der Pharao, der König von Ägypten
  rationale: „So“ stellt knapp die ausdrückliche Entsprechung zwischen dem gefährlichen Rohrstab und dem Pharao her.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: für alle, die auf ihn vertrauen
  rationale: Die Formulierung gibt die Beziehung des Pharaos zu allen wieder, die sich auf ihn verlassen, und greift das Verb „vertrauen“ konsistent wieder auf.
