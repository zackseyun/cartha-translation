translation:
  language: de
  text: 'bis ich komme und euch in ein Land mitnehme, das eurem eigenen Land gleicht: ein Land mit Getreide und jungem Wein[a], ein Land mit Brot und Weinbergen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Most“. Das hebräische Wort תירוש bezeichnet ein Erzeugnis der Weinrebe, häufig jungen oder neuen Wein, und wird oft vom allgemeineren Wort für Wein unterschieden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: bis ich komme
  rationale: עַד bezeichnet hier die zeitliche Grenze; בֹּאִי ist der Qal-Infinitiv construct mit Suffix der 1. Person Singular und wird im Deutschen natürlich als Nebensatz wiedergegeben.
- source_word: וְלָקַחְתִּי אֶתְכֶם אֶל אֶרֶץ
  choice: und euch in ein Land bringe
  rationale: לקח bedeutet grundsätzlich „nehmen“. In Verbindung mit einem Ziel bezeichnet es hier das Wegnehmen beziehungsweise Verbringen an einen anderen Ort. „bringen“ ist im Deutschen natürlich und lässt den Kontext der erzwungenen Umsiedlung erkennen, ohne ein stärkeres Verb wie „verschleppen“ in den Wortlaut einzutragen.
- source_word: כְּאַרְצְכֶם
  choice: das eurem eigenen Land gleicht
  rationale: כְּ kennzeichnet einen Vergleich. Die Relativsatzkonstruktion ist idiomatisches Deutsch; „eigenen“ hebt die propagandistische Zusicherung der Ähnlichkeit hervor, ohne Gleichheit zu behaupten.
- source_word: דָּגָן
  choice: Korn
  rationale: דגן bezeichnet Getreide beziehungsweise Getreideertrag allgemein. „Korn“ bewahrt die knappe, landwirtschaftliche Bildsprache.
- source_word: תִירוֹשׁ
  choice: Most
  rationale: תירוש bezeichnet den Ertrag der Weinrebe, häufig jungen beziehungsweise frischen Wein, und unterscheidet sich vom allgemeineren יין. „Most“ erhält diese lexikalische Unterscheidung im Deutschen; eine Fußnote erläutert den möglichen Bedeutungsumfang.
- source_word: לֶחֶם וּכְרָמִים
  choice: Brot und Weinbergen
  rationale: לֶחֶם wird konkret mit „Brot“ wiedergegeben, כרמים mit „Weinbergen“. So bleibt das Bild landwirtschaftlicher Fülle erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Formel „ein Land voll …“ bildet die hebräische Wiederholung ab und klingt zugleich natürlich. „Bringe“ vermeidet eine unnötig beschönigende Formulierung, legt aber die im Kontext erzwungene Deportation nicht stärker fest, als es das einfache hebräische Verb לקח selbst tut.
