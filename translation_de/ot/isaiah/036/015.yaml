source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: de
  text: 'Und lasst euch von Hiskija nicht dazu bringen, auf Jahwe[a] zu vertrauen, indem er sagt: »Jahwe wird uns ganz gewiss retten[b]; diese Stadt wird nicht in die Hand des Königs von Assyrien gegeben werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), traditionell oft mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Jahwe wird uns rettend retten“; die hebräische Konstruktion drückt starke Gewissheit aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל
  choice: Und lasst … nicht
  rationale: Gibt die Verbindung mit dem vorausgehenden Redegang und das verneinte Verbot in natürlichem Deutsch wieder.
- source_word: יַבְטַח אֶתְכֶם חִזְקִיָּהוּ אֶל יְהוָה
  choice: lasst euch von Hiskija nicht dazu bringen, auf Jahwe zu vertrauen
  rationale: 'Der Hifil von בטח hat hier kausative Bedeutung: Hiskija veranlasst die Angesprochenen zum Vertrauen. Die reflexive deutsche Konstruktion bewahrt diesen Sinn ohne die stärker deutende Wiedergabe „euch einreden“.'
- source_word: לֵאמֹר
  choice: wenn er sagt
  rationale: Leitet die anschließend wörtlich angeführte Aussage Hiskijas in flüssigem Deutsch ein.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: wird uns ganz gewiss retten
  rationale: Infinitivus absolutus und finite Verbform derselben Wurzel נצל bilden eine emphatische Konstruktion; „ganz gewiss“ gibt deren Nachdruck idiomatisch wieder.
- source_word: לֹא תִנָּתֵן
  choice: wird nicht … gegeben werden
  rationale: Bewahrt die passive Form des Nifal von נתן und die Zukunftsaussage.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: in die Hand des Königs von Assyrien
  rationale: Erhält das verständliche hebräische Bild der „Hand“ als Ausdruck von Gewalt oder Verfügungsgewalt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Nachdruck in הַצֵּל יַצִּילֵנוּ
  choice: Jahwe wird uns ganz gewiss retten
  alternative: Jahwe wird uns retten
  rationale: Die emphatische hebräische Konstruktion verstärkt die Behauptung. Der Nachdruck gehört zur zitierten Zusicherung Hiskijas, wie sie der assyrische Sprecher wiedergibt, und wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausative Aussage über Hiskija bleibt erhalten; zugleich wird eine im Deutschen schwerfällige wörtliche Konstruktion vermieden. Das Bild „in die Hand“ bleibt wegen seiner Klarheit und Nähe zum Ausgangstext stehen.
