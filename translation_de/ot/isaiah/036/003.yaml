base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: de
  text: Da ging Eljakim, Sohn Hilkijas und Vorsteher des Palastes,[a] zu ihm hinaus, zusammen mit Schebna, dem Schreiber,[b] und Joach, dem Sohn Asafs, dem Kanzler.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der über dem Haus war«; gemeint ist ein hoher königlicher Beamter, der die Palastverwaltung leitete.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »Sekretär«.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Amtsbezeichnung meint wahrscheinlich einen hohen Hofbeamten, der Aufzeichnungen führte und dem König Bericht erstattete. Oder: »Protokollführer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... אֵלָיו
  choice: Da ging ... zu ihm hinaus
  rationale: Das narrative Wayyiqtol wird mit „Da“ wiedergegeben. יצא mit אֶל bezeichnet hier das Hinausgehen zu dem zuvor genannten assyrischen Vertreter; „ging ... hinaus“ folgt einer natürlichen deutschen Erzählperspektive.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eljakim, der Sohn Hilkijas
  rationale: Die Eigennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die hebräische Sohn-Vater-Beziehung bleibt ausdrücklich erhalten.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: der dem Palast vorstand
  rationale: Die Wendung bezeichnet einen hohen Hofbeamten, der für den königlichen Palast beziehungsweise Haushalt verantwortlich war. Die funktionsbezogene Wiedergabe ist im modernen Deutsch verständlicher als das wörtliche „über dem Haus war“.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר kann einen Schreiber oder königlichen Sekretär bezeichnen. „Schreiber“ bewahrt die direkte lexikalische Entsprechung; die mögliche Amtsbedeutung wird in einer Fußnote genannt.
- source_word: הַמַּזְכִּיר
  choice: der Chronist
  rationale: Der Titel bezeichnet einen Hofbeamten, der Vorgänge festhielt beziehungsweise dem König vortrug. „Chronist“ ist knapp und würdig, ohne das Amt zu eng festzulegen; „Berichterstatter“ bleibt als Alternative möglich.
