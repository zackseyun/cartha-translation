translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, während die Amtsbezeichnung אֲשֶׁר עַל הַבָּיִת funktionsgerecht und verständlich wiedergegeben wird. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
