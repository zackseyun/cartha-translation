revisions:
- from: Da ging Eljakim, der Sohn Hilkijas, der dem Palast vorstand,[a] zu ihm hinaus, zusammen mit dem Schreiber Schebna[b] und dem Chronisten Joach, dem Sohn Asafs.[c]
  to: Da ging Eljakim, Sohn Hilkijas und Vorsteher des Palastes,[a] zu ihm hinaus, zusammen mit Schebna, dem Schreiber,[b] und Joach, dem Sohn Asafs, dem Kanzler.[c]
  rationale: Die Revision beseitigt die mögliche Fehlzuordnung der Amtsbezeichnung zu Hilkija und ersetzt die semantisch zu enge Bezeichnung „Chronist“ durch den als Amtstitel geeigneteren Ausdruck „Kanzler“. Die erklärende Fußnote macht die konkrete, nicht vollständig präzise bestimmbare Funktion transparent, ohne sie dogmatisch festzulegen.
