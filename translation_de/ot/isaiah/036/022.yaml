base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: de
  text: Da kamen Eljakim, der Sohn Hilkijas, der dem Palast vorstand, der Schreiber Schebna und Joach, der Sohn Asafs, der Protokollführer, mit zerrissenen Kleidern zu Hiskia und berichteten ihm die Worte des Rabschake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rabschake“ ist ein assyrischer Amtstitel. Er wird häufig etwa als „Obermundschenk“ verstanden, kann aber auch einen anderen hochrangigen Hofbeamten bezeichnet haben.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kamen
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung ein. Wegen des mehrgliedrigen Subjekts ist im Deutschen der Plural „kamen“ erforderlich.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: der über den Palast gesetzt war
  rationale: Die Wendung bezeichnet den hohen Beamten, der dem königlichen Haus beziehungsweise Palast vorstand. Die Formulierung bewahrt das Verwaltungsverhältnis, ohne ein modernes Amtsprofil vorzutäuschen.
- source_word: הַסּוֹפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet hier einen königlichen Schreiber oder Sekretär. „Schreiber“ ist die direkte, im historischen Kontext verständliche Entsprechung.
- source_word: הַמַּזְכִּיר
  choice: der Chronist
  rationale: Der Titel bezeichnet einen Hofbeamten, der Aufzeichnungen führte beziehungsweise dem König Bericht erstattete. „Chronist“ gibt diese amtliche Funktion knapp wieder, ohne die genaue, nicht völlig sichere Aufgabenbeschreibung zu überbestimmen.
- source_word: קְרוּעֵי בְגָדִים
  choice: mit zerrissenen Kleidern
  rationale: Die Wendung beschreibt ihren Zustand bei der Ankunft und bewahrt das sichtbare Zeichen von Bestürzung und Trauer.
- source_word: וַיַּגִּידוּ לוֹ
  choice: und berichteten ihm
  rationale: Die Hifil-Form von נגד bedeutet hier „mitteilen“ oder „berichten“. „Berichteten“ passt zum offiziellen Überbringen der gehörten Rede.
- source_word: דִּבְרֵי
  choice: die Worte des
  rationale: Der Status constructus von דָּבָר verweist auf die zuvor gesprochenen Worte. Die direkte Wiedergabe vermeidet die interpretierende Verengung auf bloß „Botschaft“.
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird transliteriert, weil seine genaue Funktionsentsprechung unsicher ist und er in der Erzählung wie eine feste Amtsbezeichnung verwendet wird.
