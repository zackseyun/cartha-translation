base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: de
  text: 'Doch sie schwiegen und antworteten ihm kein Wort[a], denn der Befehl des Königs lautete: »Antwortet ihm nicht!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie antworteten ihm kein Wort«; gemeint ist, dass sie ihm überhaupt nicht antworteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: sie schwiegen
  rationale: Das Hiphil von חרשׁ bezeichnet hier bewusstes Stillschweigen. Das schlichte deutsche »sie schwiegen« ist natürlich und gibt die absichtliche Zurückhaltung im Zusammenhang wieder.
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: und antworteten ihm kein Wort
  rationale: Die Konstruktion mit ענה, Personenobjekt und דָּבָר bedeutet, dass sie überhaupt keine Antwort gaben. Die gewählte Formulierung bewahrt die hebräische Ausdrucksweise und ist im Deutschen idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für ihr Schweigen ein; »denn« passt zum erzählenden Register.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: der König hatte befohlen
  rationale: מִצְוָה bezeichnet hier den verbindlichen Befehl des Königs. Die verbale Wiedergabe ist im modernen Deutschen natürlicher als »das Gebot des Königs war«.
- source_word: הִיא לֵאמֹר
  choice: ':'
  rationale: Die hebräische Konstruktion führt den Inhalt des Befehls ein. Im Deutschen erfüllt ein Doppelpunkt diese Funktion klar und ohne unnötige Schwerfälligkeit.
- source_word: לֹא תַעֲנֻהוּ
  choice: Antwortet ihm nicht!
  rationale: Die negierte Form der 2. Person maskulin Plural gibt eine an die Gruppe gerichtete Anweisung wieder. Der deutsche Imperativ bildet diese unmittelbar und eindeutig ab.
