  variant: modern standard German
source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: de
  text: Wach auf, wach auf, kleide dich in Kraft, Arm Jahwes! Wach auf wie in den Tagen der Vorzeit, wie in längst vergangenen Generationen! Warst nicht du es, der Rahab[a] zerhieb, der den Drachen[b] durchbohrte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab ist hier ein poetischer Name für eine stolze feindliche Macht; wahrscheinlich ist damit Ägypten gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „das Seeungeheuer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Wach auf
  rationale: Der feminine Singularimperativ richtet sich an den personifizierten Arm Jahwes. „Wach auf“ bewahrt die eindringliche Wiederholung und klingt im heutigen Deutsch natürlich und würdig.
- source_word: לִבְשִׁי עֹז
  choice: kleide dich in Kraft
  rationale: Die Formulierung erhält das hebräische Bild, Kraft wie ein Kleid anzulegen, ohne es zu einer bloßen Aufforderung zum Starksein abzuflachen.
- source_word: זְרוֹעַ יְהוָה
  choice: Arm Jahwes
  rationale: Das Bild bezeichnet Jahwes wirksame Macht. Der Vokativ bleibt erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כִּימֵי קֶדֶם
  choice: wie in den Tagen der Vorzeit
  rationale: „Vorzeit“ vermittelt die weit zurückliegende Vergangenheit und passt zum feierlich-poetischen Zusammenhang.
- source_word: דֹּרוֹת עוֹלָמִים
  choice: in den Geschlechtern längst vergangener Zeiten
  rationale: „Geschlechter“ gibt דֹּרוֹת wieder, während „längst vergangener Zeiten“ die hier gemeinte unermesslich ferne Vergangenheit ausdrückt, ohne metaphysische Ewigkeit einzulesen.
- source_word: הֲלוֹא אַתְּ הִיא
  choice: Warst nicht du es
  rationale: Die rhetorische Frage blickt auf frühere Machttaten zurück und hebt durch die Wortstellung die angesprochene Person hervor.
- source_word: הַמַּחְצֶבֶת
  choice: der ... zerhieb
  rationale: „Zerhieb“ gibt das gewaltsame Hauen oder Zerteilen anschaulich wieder und entspricht dem poetischen Kampfesbild.
- source_word: רַהַב
  choice: Rahab
  rationale: Der poetische Eigenname bleibt stehen, damit die vielschichtige Anspielung auf eine stolze feindliche Macht, wahrscheinlich Ägypten, nicht auf nur eine Deutung verengt wird.
- source_word: מְחוֹלֶלֶת
  choice: der ... durchbohrte
  rationale: „Durchbohrte“ wahrt die gewaltsame und bildhafte Bedeutung des Partizips in der Parallele zum Zerhieben Rahabs.
- source_word: תַּנִּין
  choice: den Drachen
  rationale: Im poetischen Zusammenhang bezeichnet das Wort ein bedrohliches Ungeheuer. „Drache“ erhält die Kampf- und Chaosbildsprache; „Seeungeheuer“ bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder.
- issue: Deutung von Rahab und תַּנִּין
  choice: Die poetischen Bilder als „Rahab“ und „Drache“ beibehalten
  alternative: Rahab im Haupttext unmittelbar als Ägypten deuten und תַּנִּין als „Seeungeheuer“ wiedergeben
  rationale: Die Sprache verbindet wahrscheinlich die Erinnerung an Ägyptens Niederlage mit umfassenderer Chaoskampf-Bildsprache. Die Übersetzung bewahrt diese Mehrschichtigkeit, statt sie auf eine einzige historische oder mythologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Wiederholung und kräftiger Bildsprache. Die ungewöhnliche Anrede „Arm Jahwes“ wird als bewusstes Personifikationsbild beibehalten. Die Relativsätze folgen im Deutschen dem grammatisch maskulinen „Arm“, obwohl die hebräischen Verbformen wegen der Personifikation feminin sind.
