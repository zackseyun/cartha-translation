source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: de
  text: 'Und ich habe meine Worte in deinen Mund gelegt und dich im Schatten meiner Hand geborgen, um den Himmel zu pflanzen[a] und die Erde zu gründen und zu Zion zu sagen: »Du bist mein Volk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich »den Himmel zu pflanzen« – ein ungewöhnliches Bild, das an Schöpfung oder erneuernde Wiederherstellung denken lässt. Möglich ist sinngemäß auch: »den Himmel fest zu gründen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: Und ich habe … gelegt
  rationale: שׂים bedeutet »setzen, legen, stellen«. Das Perfekt gibt hier eine vollzogene beziehungsweise zugesicherte Handlung wieder und steht parallel zu כִּסִּיתִיךָ.
- source_word: דְּבָרַי בְּפִיךָ
  choice: meine Worte in deinen Mund
  rationale: Der Plural »meine Worte« und das konkrete Bild »in deinen Mund« bewahren die Sprache prophetischer Beauftragung.
- source_word: וּבְצֵל יָדִי כִּסִּיתִיךָ
  choice: und dich im Schatten meiner Hand geborgen
  rationale: בְּצֵל ist hier natürlich als Ortsangabe »im Schatten« zu verstehen. »Geborgen« gibt die schützende Bedeutung von כסה im Deutschen idiomatisch wieder, ohne das Bild des Schattens aufzulösen.
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: um den Himmel zu pflanzen
  rationale: נטע heißt gewöhnlich »pflanzen«. Die auffällige kosmische Metapher wird beibehalten und nicht zu »ausspannen« oder »errichten« normalisiert.
- source_word: וְלִיסֹד אָרֶץ
  choice: und die Erde zu gründen
  rationale: יסד bezeichnet das Gründen beziehungsweise Fundamentlegen. »Die Erde gründen« bewahrt das Schöpfungsbild in würdigem, verständlichem Deutsch.
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: und zu Zion zu sagen
  rationale: אמר ist das gewöhnliche Verb »sagen«; eine Verstärkung zu »verkünden« wäre nicht erforderlich.
- source_word: עַמִּי אָתָּה
  choice: Du bist mein Volk
  rationale: Die natürliche deutsche Wortfolge bewahrt die direkte Anrede des personifizierten Zion und die Bundesformel.
theological_decisions:
- issue: Bezug der zweiten Person Singular
  choice: Die Anrede bleibt im Singular und ihr Bezug wird nicht ausdrücklich festgelegt.
  alternative: Der Knecht, der Prophet oder das gemeinschaftlich verstandene Israel/Zion wird ausdrücklich als Angesprochener identifiziert.
  rationale: Der hebräische Vers nennt den Angesprochenen nicht eindeutig. Die Übersetzung bewahrt diese Offenheit.
- issue: Kosmische Zwecksätze
  choice: Die Schöpfungssprache »den Himmel zu pflanzen und die Erde zu gründen« bleibt im Haupttext erhalten.
  alternative: Die Aussagen werden ausdrücklich als Bild für Israels Wiederherstellung beziehungsweise eine neue Schöpfung wiedergegeben.
  rationale: Der Wortlaut lässt Schöpfung und Wiederherstellung ineinandergreifen. Eine eindeutige metaphorische oder rein kosmologische Festlegung würde die Spannung des Textes verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher des Pflanzens wird bewusst bewahrt; die Schutzmetapher ist mit »im Schatten meiner Hand geborgen« natürlich formuliert. Die singularische Anrede bleibt ohne interpretierende Identifikation.
