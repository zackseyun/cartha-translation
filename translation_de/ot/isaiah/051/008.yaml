base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: de
  text: Denn die Motte wird sie wie ein Kleid zerfressen, und die Larve[a] wird sie wie Wolle zerfressen. Doch meine Gerechtigkeit wird für immer bestehen und meine Rettung von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort ist in seiner genauen Bedeutung unsicher und bezeichnet wahrscheinlich ein textilzerstörendes Insekt oder dessen Larve; auch möglich: »Wurm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und bewahrt den kausalen Zusammenhang.
- source_word: כַבֶּגֶד
  choice: wie ein Kleid
  rationale: בֶּגֶד bezeichnet ein Kleidungsstück oder Kleidung; »Kleid« ist im poetischen Vergleich natürlich und anschaulich.
- source_word: יֹאכְלֵם
  choice: wird sie fressen
  rationale: Bewahrt das kräftige Bild des Verbs אכל und gibt den kontextuell zukünftigen Sinn des Imperfekts wieder.
- source_word: עָשׁ
  choice: die Motte
  rationale: Bezeichnet die stoffzerstörende Motte; der bestimmte Artikel dient im Deutschen der generischen Aussage.
- source_word: וְכַצֶּמֶר
  choice: und … wie Wolle
  rationale: צֶמֶר bedeutet »Wolle« und bildet die poetische Parallele zu »wie ein Kleid«.
- source_word: סָס
  choice: die Kleidermotte
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein Textilien zerstörendes Insekt oder dessen Larve. »Kleidermotte« ist verständlich, lässt die genaue biologische Bestimmung jedoch in einer Fußnote offen.
- source_word: וְצִדְקָתִי
  choice: Doch meine Gerechtigkeit
  rationale: צְדָקָה umfasst Gottes rechtes, gerechtes und heilbringendes Handeln. »Doch« macht den sachlichen Gegensatz zur Vergänglichkeit der zuvor Genannten deutlich.
- source_word: לְעוֹלָם תִּהְיֶה
  choice: bleibt für immer
  rationale: Gibt das dauerhafte Sein idiomatisch und klar wieder; »bleibt« unterstreicht im Deutschen passend die Beständigkeit.
- source_word: וִישׁוּעָתִי
  choice: und meine Rettung
  rationale: יְשׁוּעָה bezeichnet hier Gottes rettendes Eingreifen. »Rettung« ist konkret und verständlich, ohne den Ausdruck unnötig zu verengen.
- source_word: לְדֹר דּוֹרִים
  choice: von Generation zu Generation
  rationale: Bewahrt die hebräische Wiederholung und bezeichnet die fortdauernde Geltung über immer neue Generationen hinweg.
theological_decisions:
- issue: Bedeutungsbreite von צִדְקָה im prophetischen Zusammenhang
  choice: Gerechtigkeit
  alternative: gerechtes Handeln / Heilsgerechtigkeit
  rationale: »Gerechtigkeit« wahrt die moralische, forensische und bundestreue Dimension des hebräischen Begriffs, ohne ihn ausschließlich als Strafjustiz oder ausschließlich als rettende Tat festzulegen.
- issue: Wiedergabe von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: »Rettung« hebt Gottes wirksames Befreien hervor und bleibt für heutige Leser unmittelbar verständlich; »Heil« wäre theologisch traditionsreich, kann aber abstrakter wirken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer poetischer Parallelität. Das zweimalige »wird sie fressen« bewahrt die eindringliche Wiederholung des Hebräischen; der Gegensatz wird mit »Doch« natürlich markiert.
