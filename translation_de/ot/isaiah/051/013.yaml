  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: de
  text: Und du hast Jahwe vergessen, deinen Schöpfer, der den Himmel ausspannte und die Erde gründete, und hast dich unablässig den ganzen Tag vor dem Zorn des Bedrängers gefürchtet, als er sich bereitmachte zu vernichten[a]. Doch wo ist der Zorn des Bedrängers?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wäre er bereit zu vernichten“.'
    reason: Die Verbindung כַּאֲשֶׁר כּוֹנֵן kann außer zeitlich auch modal beziehungsweise vergleichend verstanden werden.
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: du hast … vergessen
  rationale: Das Qal-Wayyiqtol der 2. Person Singular formuliert einen vorwurfsvollen Rückblick. Das deutsche Perfekt ist in heutiger Standardsprache natürlich und bewahrt den vollendeten Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֹשֶׂךָ
  choice: deinen Schöpfer
  rationale: Das Partizip mit Suffix bezeichnet den, der den Angeredeten gemacht hat; „Schöpfer“ gibt die titelartige Verwendung knapp und würdig wieder.
- source_word: נוֹטֶה שָׁמַיִם
  choice: der den Himmel ausspannte
  rationale: נטה bezeichnet hier das Ausspannen des Himmels. Der deutsche Singular „Himmel“ ist in diesem Schöpfungskontext idiomatisch.
- source_word: וְיֹסֵד אָרֶץ
  choice: und die Erde gründete
  rationale: יסד trägt das Bild des Gründens beziehungsweise Grundlegens; „gründete“ erhält dieses Bild ohne umständliche Erweiterung.
- source_word: וַתְּפַחֵד
  choice: du fürchtetest dich
  rationale: פחד bezeichnet Furcht oder Angst. Die direkte Wiedergabe vermeidet die stärkere körperliche Festlegung „du zittertest“.
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: unablässig, den ganzen Tag
  rationale: 'Die Formulierung gibt beide Zeitangaben wieder: die fortwährende Furcht und ihre Ausdehnung über den ganzen Tag.'
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: vor dem Zorn des Bedrängers
  rationale: מִפְּנֵי bezeichnet hier den Anlass beziehungsweise Gegenstand der Furcht; חֲמַת ist heftiger Zorn, und מֵצִיק bezeichnet den, der bedrängt oder unterdrückt.
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: als er sich bereitmachte zu vernichten
  rationale: Die Wendung kann zeitlich verstanden werden und beschreibt die Bereitschaft beziehungsweise feste Ausrichtung des Bedrängers auf Vernichtung. Das fehlende ausdrückliche Objekt wird auch im Deutschen nicht ergänzt.
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: Doch wo ist der Zorn des Bedrängers?
  rationale: Die rhetorische Frage stellt der vorausgehenden Furcht die Vergänglichkeit oder Ohnmacht des Bedrängers gegenüber; „Doch“ macht diesen Kontrast natürlich sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen selbst. Die Transliteration wahrt seinen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Subjekt von כּוֹנֵן לְהַשְׁחִית
  choice: Der Bedränger ist das Subjekt.
  alternative: 'Unpersönliche oder modale Lesart: „als wäre er bereit zu vernichten“'
  rationale: Der unmittelbar vorausgehende „Bedränger“ ist der naheliegende Bezug, und die anschließende rhetorische Frage nimmt dessen Zorn erneut auf. Die modale Nuance bleibt jedoch sprachlich möglich und wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede im Singular. Die parallelen Schöpfungsaussagen bleiben knapp; die rhetorische Zuspitzung des Schlusses wird bewahrt. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten mehrdeutigen Wendung.
