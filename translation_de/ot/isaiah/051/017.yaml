  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: de
  text: Wach auf, wach auf! Steh auf, Jerusalem, die du aus der Hand Jahwes[a] den Becher seines Zorns getrunken hast! Die Schale[b], den Becher des Taumels[c], hast du getrunken, bis auf den Grund geleert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname wird hier mit „Jahwe“ wiedergegeben; traditionell steht dafür „der HERR“.
    reason: translation_tradition
  - marker: b
    text: 'Oder: „den Kelch“. Das seltene hebräische Wort bezeichnet wahrscheinlich ein schalenförmiges Trinkgefäß.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „des Schwankens“; traditionell auch „des Zitterns“. Gemeint ist die taumelnde Wirkung des Tranks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוֹרְרִי ... הִתְעוֹרְרִי
  choice: Wach auf, wach auf
  rationale: Der wiederholte feminine Singularimperativ wird als eindringlicher Weckruf wiedergegeben. Das reflexive Hitpael ist im natürlichen deutschen Imperativ „wach auf“ idiomatisch enthalten; „rüttle dich auf“ wäre zu interpretierend.
- source_word: קוּמִי
  choice: Steh auf
  rationale: Der feminine Singularimperativ bezeichnet das Sich-Erheben bzw. Aufstehen und schließt natürlich an den Weckruf an.
- source_word: מִיַּד יְהוָה
  choice: aus der Hand Jahwes
  rationale: Die hebräische Wendung wird bildhaft beibehalten und bezeichnet Jahwe als Ursprung und Handelnden hinter dem Gericht.
- source_word: כּוֹס חֲמָתוֹ
  choice: den Becher seines Zorns
  rationale: Die prophetische Bechermetapher und das Gewicht von חֵמָה als göttlicher Zorn bleiben erhalten.
- source_word: קֻבַּעַת
  choice: die Schale
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein schalenförmiges Trinkgefäß. „Schale“ ist im Deutschen klar und wahrt die Unterscheidung vom folgenden „Becher“.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: den Becher des Taumels
  rationale: תַּרְעֵלָה bezeichnet den durch den Trank ausgelösten Taumel bzw. das Schwanken. Die substantivische Form bewahrt die knappe poetische Metapher.
- source_word: שָׁתִית מָצִית
  choice: hast du ausgetrunken, restlos geleert
  rationale: Die beiden Verben werden als abgeschlossenes Trinken und vollständiges Leeren wiedergegeben. „Restlos“ bringt den Gedanken des Leerens bis zur Neige natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen. So bleibt die direkte Benennung im hebräischen Text sichtbar.
- issue: Der Becher des Zorns
  choice: Die Metapher für göttliches Gericht wird unverändert beibehalten.
  alternative: Deutende Auflösung als „Strafe“ oder „Gericht“
  rationale: Der Text verbindet Jahwes Hand, seinen Zorn und das Trinken eines Bechers. Eine abstrakte Umschreibung würde das eindringliche prophetische Bild abschwächen.
- issue: Bezug von „seines“ in „seines Zorns“
  choice: Das Pronomen bezieht sich auf Jahwe.
  alternative: 'Explizit: „Jahwes Zorn“'
  rationale: Der unmittelbare grammatische Bezug ist klar; die pronominale Form entspricht der hebräischen Konstruktion und vermeidet unnötige Wiederholung.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Dringlichkeit. Die Wiederholung und die Bechermetapher bleiben erhalten. Die feminine Anrede Jerusalems wird durch den Relativsatz „die du“ sichtbar gemacht; Ausrufezeichen gliedern den eindringlichen Aufruf und die anschließende Gerichtsaussage.
