  source_fidelity: Der Entwurf gibt die Imperative, den kosmischen Gegensatz von Himmel und Erde, die dreifache Vergänglichkeitsreihe sowie den Kontrast zu Gottes bleibender Rettung und Gerechtigkeit zuverlässig wieder. „Sich wie Rauch verflüchtigen“ ist für נִמְלָחוּ eine vertretbare, idiomatische Wiedergabe; die lexikalische Unsicherheit wird angemessen vermerkt. „Nicht zerbrechen“ bewahrt die bildhafte Aussage von תֵחָת, ohne sie theologisch einzuengen.
  naturalness: Modernes, verständliches und zugleich dem prophetischen Ton angemessenes Standarddeutsch. „Zum Himmel“ ist trotz der hebräischen Pluralform im Deutschen die natürliche Bezeichnung. Die Abfolge der Bilder ist klar und flüssig.
  terminology: „Rettung“ für יְשׁוּעָה und „Gerechtigkeit“ für צִדְקָה sind sachgerecht und in ihrem Bedeutungsumfang nicht konfessionell verengt. Die Fußnote zu „Recht“ macht eine mögliche Nuance transparent. „Gewand“ und „Bewohner“ passen zum gehobenen, aber nicht archaischen Register.
