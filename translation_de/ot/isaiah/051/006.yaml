  variant: modern standard German
source:
  edition: WLC
  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: de
  text: Erhebt eure Augen zum Himmel und blickt auf die Erde unter euch! Denn der Himmel wird sich wie Rauch verflüchtigen[a], die Erde wird verschleißen wie ein Gewand, und ihre Bewohner werden ebenso sterben. Doch meine Rettung wird ewig bestehen, und meine Gerechtigkeit[b] wird nicht zerbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier verwendete hebräische Verb ist selten und in seiner Bedeutung unsicher. Gemeint ist offenbar, dass der Himmel vergeht; möglich ist auch: „wird wie Rauch verschwinden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Recht“. Das hebräische Wort kann sowohl Gerechtigkeit als auch Recht beziehungsweise gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: Erhebt eure Augen
  rationale: Der konkrete Ausdruck des hebräischen Imperativs bleibt erhalten und ist im Deutschen verständlich und würdevoll.
- source_word: לַשָּׁמַיִם
  choice: zum Himmel
  rationale: Das morphologisch plurale שׁמים bezeichnet hier im kosmischen Gegensatz zur Erde den Himmel; der deutsche Singular ist dafür die natürliche Standardform.
- source_word: וְהַבִּיטוּ אֶל הָאָרֶץ מִתַּחַת
  choice: und blickt auf die Erde unter euch
  rationale: „Erde“ wahrt den kosmischen Gegensatz zum Himmel; „unter euch“ gibt מִתַּחַת in natürlichem Deutsch wieder.
- source_word: נִמְלָחוּ
  choice: wird sich verflüchtigen
  rationale: Das seltene und schwierige Verb beschreibt im Zusammenhang das Vergehen des Himmels. „Sich verflüchtigen“ verbindet diesen Sinn anschaulich mit dem Vergleich „wie Rauch“, ohne eine fragwürdige wörtliche Etymologie in den Haupttext zu setzen.
- source_word: תִּבְלֶה כַּבֶּגֶד
  choice: wird verschleißen wie ein Gewand
  rationale: Die Wiedergabe erhält das Bild eines durch Gebrauch alt und unbrauchbar werdenden Kleidungsstücks.
- source_word: וְיֹשְׁבֶיהָ כְּמוֹ כֵן יְמוּתוּן
  choice: und ihre Bewohner werden ebenso sterben
  rationale: „Ebenso“ entspricht כְּמוֹ כֵן und bezieht das Sterben der Bewohner auf das zuvor geschilderte Vergehen von Himmel und Erde.
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  choice: Doch meine Rettung wird ewig bestehen
  rationale: „Rettung“ gibt יְשׁוּעָה konkret und allgemeinverständlich wieder; „wird ewig bestehen“ drückt das fortdauernde Sein im Gegensatz zur vergänglichen Schöpfung natürlich aus.
- source_word: וְצִדְקָתִי לֹא תֵחָת
  choice: und meine Gerechtigkeit wird nicht zerbrechen
  rationale: „Zerbrechen“ bewahrt die starke Bildsprache von חתת und vermeidet, die Aussage lediglich als abstraktes „nicht aufhören“ wiederzugeben.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקָתִי
  choice: meine Gerechtigkeit
  alternative: mein Recht / meine Recht schaffende Gerechtigkeit
  rationale: צדקה kann sowohl Gottes Gerechtigkeit als Eigenschaft und Bundestreue als auch sein gerechtes, rettendes Handeln bezeichnen. „Gerechtigkeit“ wahrt diese Breite; die mögliche Nuance „Recht“ wird in einer Fußnote kenntlich gemacht.
- issue: Dauer von Gottes Rettung im Gegensatz zur Vergänglichkeit der Welt
  choice: wird ewig bestehen
  alternative: wird in Ewigkeit sein
  rationale: Die natürliche deutsche Formulierung gibt לְעוֹלָם תִּהְיֶה wieder, ohne die Aussage abzuschwächen oder über den hebräischen Text hinaus systematisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Bildsprache. Die Imperative bleiben konkret; die Gegensätze Himmel–Erde, Vergänglichkeit–ewige Rettung und Zerbrechen–Bestand werden deutlich bewahrt. Das schwierige נִמְלָחוּ wird lesbar wiedergegeben und seine Unsicherheit transparent vermerkt.
