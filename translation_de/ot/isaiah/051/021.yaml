  text: לָ/כֵ֛ן שִׁמְעִי נָ֥א זֹ֖את עֲנִיָּ֑ה וּ/שְׁכֻרַ֖ת וְ/לֹ֥א מִ/יָּֽיִן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/021.yaml
  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: de
  text: 'Darum höre dies doch, du Bedrängte, du Betrunkene – nicht vom Wein:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: שִׁמְעִי נָא
  choice: höre nun
  rationale: Der feminine Imperativ richtet sich an die personifizierte Stadt; נָא verleiht der Aufforderung Nachdruck bzw. Dringlichkeit. „Nun“ ist hier idiomatischer als ein bittendes „bitte“.
- source_word: עֲנִיָּה
  choice: du Gebeugte
  rationale: Bezeichnet die schwer Bedrängte bzw. Erniedrigte. „Gebeugte“ bewahrt das Bild und passt zur direkten Anrede.
- source_word: וּשְׁכֻרַת
  choice: du Betrunkene
  rationale: Das feminine Partizip wird als direkte Anrede wiedergegeben; der folgende Zusatz stellt klar, dass keine buchstäbliche Weintrunkenheit gemeint ist.
- source_word: וְלֹא מִיָּיִן
  choice: doch nicht vom Wein
  rationale: Bewahrt den kontrastierenden, paradoxen Ausdruck des Hebräischen in natürlichem Deutsch.
theological_decisions:
- issue: Bildhafte Trunkenheit
  choice: Die Metapher bleibt ohne erklärende Auflösung im Vers stehen.
  alternative: Die Trunkenheit ausdrücklich als Wirkung von Gottes Zorn oder Gericht deuten.
  rationale: Der unmittelbare Wortlaut sagt lediglich, dass die Trunkenheit nicht vom Wein stammt; die nähere Deutung ergibt sich aus dem Kontext und soll nicht in den Vers hineingetragen werden.
translation_notes:
  register: Moderne, würdevolle direkte Anrede. Die feminine Form des Hebräischen wird durch die substantivierten femininen Anreden sichtbar gehalten; der Doppelpunkt wahrt den Übergang zum folgenden Vers.
