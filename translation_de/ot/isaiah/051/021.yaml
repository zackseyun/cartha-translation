    rationale: „Nun“ kann im Deutschen temporal wirken. Das hebräische נָא markiert hier eine eindringliche bzw. höflich-bittende Aufforderung; „doch“ ist kontextuell näher.
  - severity: low
    issue: „Gebeugte“ für עֲנִיָּה
    rationale: „Gebeugte“ ist möglich, hebt aber vor allem die körperlich-bildhafte Seite hervor. „Bedrängte“ gibt die umfassendere Bedeutung von Not und Unterdrückung natürlicher wieder.
