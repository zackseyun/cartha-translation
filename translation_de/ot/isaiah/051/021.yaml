  source_fidelity: Die Grundstruktur und die weibliche Anrede sind richtig wiedergegeben. „Nun“ kann נָא zwar gelegentlich pragmatisch abschwächen, vermittelt hier aber eher eine zeitliche Nuance; die bittend-eindringliche Partikel ist mit „doch“ angemessener wiedergegeben. עֲנִיָּה bezeichnet die Bedrängte/Elende stärker als bloß die „Gebeugte“.
  naturalness: Die direkte Anrede mit substantivierten femininen Formen ist verständlich und würdevoll. Ein Gedankenstrich vor der abschließenden Negation macht die paradoxe Gegenüberstellung im Deutschen klar und natürlich.
  terminology: „Bedrängte“ gibt die Notlage von עֲנִיָּה ohne vorzeitige Einengung auf eine bestimmte Ursache wieder. „Betrunkene“ bewahrt die Metapher; der Text erklärt sie nicht über den Wortlaut hinaus.
