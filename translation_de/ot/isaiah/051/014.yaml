id: ISA.51.14
reference: Isaiah 51:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִהַ֥ר צֹעֶ֖ה לְ/הִפָּתֵ֑חַ וְ/לֹא יָמ֣וּת לַ/שַּׁ֔חַת וְ/לֹ֥א יֶחְסַ֖ר לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: de
  text: Bald wird der Gebeugte befreit[a]; er wird nicht in der Grube[b] sterben, und sein Brot wird ihm nicht fehlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Gefangene wird bald freigelassen.“ Der hebräische Ausdruck ist schwierig und kann an jemanden denken lassen, der unter Bedrückung niedergebeugt ist und dann frei wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Kerker“. Das hebräische Wort kann eine Grube oder einen Kerker, aber auch das Grab beziehungsweise den Ort des Verderbens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  choice: Bald
  rationale: Die Form bezeichnet Eile beziehungsweise zeitliche Nähe. „Bald“ gibt die verheißene unmittelbar bevorstehende Befreiung in natürlichem Deutsch wieder.
- source_word: צֹעֶה
  choice: der Gebeugte
  rationale: Das schwierige Partizip kann einen niedergebeugten oder unter Bedrückung kauernden Menschen bezeichnen. „Der Gebeugte“ bewahrt dieses Bild, ohne die Person eindeutig als Gefangenen festzulegen.
- source_word: לְהִפָּתֵחַ
  choice: wird … befreit
  rationale: Der Nifal-Infinitiv von פתח bedeutet wörtlich „geöffnet werden“, bezeichnet hier aber idiomatisch die Freilassung aus Bedrängnis oder Haft.
- source_word: וְלֹא יָמוּת
  choice: er wird nicht … sterben
  rationale: Die verneinte Imperfektform wird als Zusage künftiger Bewahrung wiedergegeben.
- source_word: לַשַּׁחַת
  choice: in der Grube
  rationale: שחת kann eine Grube, einen Kerker, das Grab oder den Ort des Verderbens bezeichnen. „Grube“ erhält das konkrete Bild und lässt die weiteren Bedeutungsanklänge offen.
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: sein Brot wird ihm nicht fehlen
  rationale: Die Formulierung bleibt nahe am konkreten hebräischen Bild des Brotes als notwendiger Versorgung und ist zugleich idiomatisches Deutsch.
theological_decisions:
- issue: Identität des bedrückten Menschen
  choice: Eine einzelne gebeugte Person, die im Zusammenhang stellvertretend für die bedrückten Exilierten stehen kann
  alternative: Ein bestimmter Gefangener oder allgemein jeder Leidende
  rationale: Der Singular des Hebräischen bleibt erhalten; zugleich wird die Person nicht genauer bestimmt, sodass die repräsentative und die individuelle Lesart möglich bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dreigliedrigkeit und die konkreten Bilder des hebräischen Textes bleiben erhalten; schwierige Bedeutungsalternativen werden in den Fußnoten offengelegt.
