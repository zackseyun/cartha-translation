  terminology: »Herr«, »Jahwe«, »Gott«, »Rechtssache«, »Zorn« und die Bechermetaphorik sind angemessen. Das fehlende deutsche »und« vor »dein Gott« ist als appositionelle Reihung vertretbar. Die Fußnote erklärt zutreffend die doppelte Gefäßterminologie; der Anker steht an der einschlägigen Wendung.
