source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנַ֣יִ/ךְ יְהוָ֗ה וֵ/אלֹהַ֨יִ/ךְ֙ יָרִ֣יב עַמּ֔/וֹ הִנֵּ֥ה לָקַ֛חְתִּי מִ/יָּדֵ֖/ךְ אֶת כּ֣וֹס הַ/תַּרְעֵלָ֑ה אֶת קֻבַּ֨עַת֙ כּ֣וֹס חֲמָתִ֔/י לֹא תוֹסִ֥יפִי לִ/שְׁתּוֹתָ֖/הּ עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: de
  text: 'So spricht dein Herr, Jahwe, dein Gott, der die Rechtssache seines Volkes führt: Sieh, ich habe dir den Becher des Taumels aus der Hand genommen, die Schale – den Becher meines Zorns[a]. Du wirst nie wieder daraus trinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »die Schale des Bechers meines Zorns«. Das Hebräische häuft hier Bezeichnungen für Trinkgefäße an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  choice: dein Herr
  rationale: Der mit einem Suffix der 2. Person feminin Singular versehene Hoheitstitel bezeichnet Zions Herrn und wahrt die Anredeform des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen dem Gottesnamen und dem vorausgehenden Titel אֲדֹנַיִךְ.
- source_word: וֵאלֹהַיִךְ
  choice: dein Gott
  rationale: Im Kontext ist der Singular gemeint; die Wendung setzt die Reihe der appositionellen Gottesbezeichnungen fort. Das hebräische ו wird im Deutschen wegen der natürlichen Apposition nicht eigens mit »und« wiedergegeben.
- source_word: יָרִיב עַמּוֹ
  choice: der die Rechtssache seines Volkes führt
  rationale: 'ריב trägt hier einen forensischen Sinn: Jahwe tritt im Rechtsstreit für sein Volk ein. Die Formulierung bewahrt diesen Rechtscharakter, ohne ihn bloß allgemein als Hilfe oder Verteidigung wiederzugeben.'
- source_word: הִנֵּה
  choice: Sieh
  rationale: »Sieh« gibt den aufmerksamkeitslenkenden und feierlichen Impuls verständlich und gegenwärtig wieder.
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: ich nehme dir ... aus der Hand
  rationale: Das hebräische Perfekt bezeichnet im prophetischen Zuspruch eine als vollzogen dargestellte Handlung. Das deutsche Präsens vermittelt die unmittelbar zugesagte Wegnahme natürlich; »aus der Hand« erhält das Bild.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: den Taumelbecher
  rationale: תַּרְעֵלָה bezeichnet die benommen machende, taumeln lassende Wirkung des Gerichts. Das Kompositum ist im Deutschen knapp, bildhaft und verständlich.
- source_word: קֻבַּעַת כּוֹס חֲמָתִי
  choice: die Schale, den Becher meines Zorns
  rationale: Die Wiedergabe erhält die gehäufte Gefäßmetaphorik und versteht die Wortgruppe appositionell, ohne die ungewöhnliche hebräische Verbindung zu glätten.
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: Du wirst nie wieder daraus trinken
  rationale: Die Verbindung von יסף, Infinitiv und עוֹד drückt das endgültige Ende künftigen Trinkens aus. »Daraus« bezieht sich im Deutschen idiomatisch auf das genannte Gefäß.
theological_decisions:
- issue: Abfolge der Gottesbezeichnungen
  choice: dein Herr, Jahwe, dein Gott
  alternative: dein Herr, Jahwe und dein Gott
  rationale: Die drei Bezeichnungen bleiben unterscheidbar und appositionell auf dieselbe Person bezogen. Im natürlichen Deutschen ist das verbindende »und« entbehrlich; die theologische Identifikation wird weder abgeschwächt noch erweitert.
- issue: Forensische Bedeutung von ריב
  choice: der die Rechtssache seines Volkes führt
  alternative: der für sein Volk streitet
  rationale: Die gewählte Fassung hält den möglichen Rechtsstreit-Hintergrund offen und vermeidet eine vorschnelle Verengung auf militärisches Kämpfen.
- issue: Bild vom Zornesbecher
  choice: Die Becher- und Schalenmetaphorik wird wörtlich beibehalten.
  alternative: Dynamische Auflösung als Strafe oder Leiden
  rationale: Das Bild ist im Text selbst theologisch tragend und schafft biblische Querbezüge. Eine erklärende Auflösung würde seine Spannung und Anschaulichkeit vermindern.
- issue: Zeitwert des prophetischen Perfekts לָקַחְתִּי
  choice: ich nehme
  alternative: ich habe genommen
  rationale: Das Perfekt stellt die göttliche Wegnahme als sicher beziehungsweise vollzogen dar. Das Präsens klingt im deutschen Zuspruch natürlich und wahrt die Unmittelbarkeit, ohne eine vom Kontext getrennte vergangene Handlung zu erzwingen.
translation_notes:
  register: Moderne, würdevolle Prophetensprache mit direkter Anrede Zions im Femininum Singular. Die Bildsprache bleibt konkret; der juristische Sinn von ריב sowie die ungewöhnliche Gefäßhäufung werden nicht eingeebnet. Der einzige Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
