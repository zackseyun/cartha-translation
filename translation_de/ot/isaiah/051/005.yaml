base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: de
  text: Meine Gerechtigkeit ist nahe[a], mein Heil ist hervorgegangen, und meine Arme[b] werden die Völker richten. Die Küstenländer[c] werden auf mich warten und auf meinen Arm hoffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Recht ist nahe“ beziehungsweise „Meine Rechtfertigung ist nahe“. Das hebräische Wort kann je nach Zusammenhang Gerechtigkeit, Recht oder Rechtfertigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch zunächst „meine Arme“, später im Vers „mein Arm“. Das Bild bezeichnet die wirksame Macht des HERRN.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Inseln“ beziehungsweise „die fernen Küsten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: ist nahe
  rationale: Das prädikative Adjektiv bezeichnet gegenwärtige Nähe; „ist nahe“ ist natürlich und fügt keinen zusätzlichen Aspekt hinzu.
- source_word: צִדְקִי
  choice: meine Gerechtigkeit
  rationale: צדק kann Gerechtigkeit, Recht oder Rechtfertigung bezeichnen. „Gerechtigkeit“ bewahrt hier die breite theologische Bedeutung und die Parallelität mit Gottes Heil.
- source_word: יָצָא
  choice: ist ausgezogen
  rationale: Das Qatal bezeichnet eine vollzogene Handlung. „Ist ausgezogen“ erhält das konkrete Bewegungsbild des hebräischen Verbs.
- source_word: יִשְׁעִי
  choice: mein Heil
  rationale: „Heil“ gibt die Rettungsbedeutung von ישׁע prägnant wieder und passt zum würdevollen prophetischen Register.
- source_word: וּזְרֹעַי
  choice: und meine Arme
  rationale: Die Form ist morphologisch Plural und wird nicht an den späteren Singular angeglichen.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere Völkergruppen; der bestimmte Artikel entspricht natürlichem Deutsch.
- source_word: יִשְׁפֹּטוּ
  choice: werden richten
  rationale: שׁפט umfasst richterliches und herrscherliches Handeln. „Richten“ wahrt den gerichtlichen Grundsinn.
- source_word: אֵלַי
  choice: auf mich
  rationale: Die Richtungspartikel wird mit dem deutschen Verb „warten“ idiomatisch als „auf mich“ wiedergegeben.
- source_word: אִיִּים
  choice: die Küstenländer
  rationale: Der Ausdruck bezeichnet bei Jesaja häufig maritime, besonders ferne Länder und ist weiter als nur „Inseln“.
- source_word: יְקַוּוּ
  choice: werden warten
  rationale: Das Verb bezeichnet erwartungsvolles Warten; die Wiedergabe unterscheidet es vom anschließenden יחל, ohne die poetische Nähe aufzuheben.
- source_word: וְאֶל זְרֹעִי
  choice: und auf meinen Arm
  rationale: Der Singular und das Körperbild werden bewahrt; der Arm steht bildhaft für Gottes wirksame Macht.
- source_word: יְיַחֵלוּן
  choice: hoffen
  rationale: Das Piel bezeichnet hoffendes, erwartungsvolles Warten. „Hoffen“ ergibt mit „auf“ natürliches Deutsch und erhält die Variation im Parallelismus.
theological_decisions:
- issue: Bedeutung von צדק in einem Heilswort
  choice: meine Gerechtigkeit
  alternative: mein Recht; meine Rechtfertigung
  rationale: Der Zusammenhang verbindet Gottes צדק mit seinem Heil und seinem Richten der Völker. „Gerechtigkeit“ hält die umfassende Bedeutung offen; die gerichtliche Alternative wird in einer Fußnote bewahrt.
- issue: Anthropomorphes Bild von Gottes Arm beziehungsweise Armen
  choice: Das Bild „Arm/Arme“ wörtlich beibehalten
  alternative: Macht; Stärke
  rationale: Der hebräische Text stellt Gottes wirksame Macht durch ein Körperbild dar. Eine Abstraktion würde die prophetische Bildsprache abschwächen.
- issue: Wechsel zwischen Plural und Singular bei זרוע
  choice: zuerst „meine Arme“, später „meinen Arm“
  alternative: beide Stellen im Singular angleichen
  rationale: Der auffällige Numeruswechsel steht im hebräischen Text und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Satzfolge, die Parallelität und das konkrete Bild vom Arm Gottes bleiben erhalten; der Numeruswechsel zwischen „Arme“ und „Arm“ wird bewusst nicht geglättet.
