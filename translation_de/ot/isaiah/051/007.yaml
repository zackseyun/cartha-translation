  - severity: low
    issue: Pluralisierung von אֱנוֹשׁ im Haupttext
    rationale: „durch Menschen“ ist verständlich, aber die Quelle hat den generischen Singular. „die Schmähung eines Menschen“ bewahrt ihn ohne unnatürlich zu werden.
