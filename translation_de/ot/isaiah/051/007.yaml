source:
  edition: WLC
  text: שִׁמְע֤וּ אֵלַ/י֙ יֹ֣דְעֵי צֶ֔דֶק עַ֖ם תּוֹרָתִ֣/י בְ/לִבָּ֑/ם אַל תִּֽירְאוּ֙ חֶרְפַּ֣ת אֱנ֔וֹשׁ וּ/מִ/גִּדֻּפֹתָ֖/ם אַל תֵּחָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: de
  text: 'Hört auf mich, ihr, die ihr Gerechtigkeit kennt, ihr Volk, das meine Weisung in eurem Herzen hat: Fürchtet euch nicht vor der Schmähung eines Menschen[a] und lasst euch von ihren Beschimpfungen nicht erschüttern.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor der Schmähung eines Sterblichen“; hebräisch אֱנוֹשׁ bezeichnet einen Menschen und kann dessen Hinfälligkeit anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verzagt nicht“; auch: „lasst euch nicht zerbrechen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Der pluralische Imperativ mit אֶל fordert zu aufmerksamem, folgebereitem Hören auf. „Hört auf mich“ ist im modernen Deutsch natürlich und bewahrt den Nachdruck des Aufrufs.
- source_word: יֹדְעֵי צֶדֶק
  choice: ihr, die ihr Gerechtigkeit kennt
  rationale: צֶדֶק umfasst Gerechtigkeit im moralischen und gemeinschaftlichen Sinn. Die Formulierung bewahrt das ungewöhnliche „kennen“, ohne es deutend durch „tun“ oder „lieben“ zu ersetzen.
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: du Volk, das meine Weisung im Herzen trägt
  rationale: תּוֹרָה bedeutet Weisung und kann auch „Gesetz“ heißen. „Weisung“ gibt den breiteren Sinn wieder; „im Herzen trägt“ drückt verständlich die innere Verankerung aus. Der Wechsel vom Plural zur kollektiven Anrede „Volk“ wird bewahrt.
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: Fürchtet euch nicht vor der Schmähung durch Menschen
  rationale: חֶרְפָּה bezeichnet Schmähung, Schmach oder Hohn. אֱנוֹשׁ ist formal Singular und kann die Hinfälligkeit des Menschen anklingen lassen; im Deutschen gibt „durch Menschen“ die generische Bedeutung natürlich wieder.
- source_word: וּמִגִּדֻּפֹתָם
  choice: von ihren Beschimpfungen
  rationale: גִּדּוּפוֹת bezeichnet beleidigende, schmähende Äußerungen. „Beschimpfungen“ ist gegenwärtig und klar, ohne den Ausdruck vorschnell als Gotteslästerung zu bestimmen.
- source_word: אַל תֵּחָתּוּ
  choice: lasst euch nicht erschüttern
  rationale: Das Nifal von חתת kann „erschrecken“, „verzagen“, „zerschmettert werden“ oder „bestürzt sein“ bedeuten. „Lasst euch nicht erschüttern“ bewahrt sowohl die innere Wirkung als auch die stärkere Bildkraft.
theological_decisions:
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ wahrt den moralisch-bundestheologischen Bedeutungsumfang, ohne die soziale und rechtliche Dimension auszuschließen.
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ entspricht dem breiten hebräischen Begriff und vermeidet eine unnötige Verengung auf kodifiziertes Gesetz; „Gesetz“ bleibt in diesem Bundeszusammenhang möglich.
- issue: Generischer Singular אֱנוֹשׁ
  choice: Menschen
  alternative: eines Sterblichen
  rationale: Die deutsche Pluralform ist idiomatisch und bezieht sich passend auf das folgende pluralische Suffix. Die formale Singularität und der mögliche Akzent auf menschlicher Sterblichkeit werden in der Fußnote erhalten.
- issue: Stärke von חתת
  choice: nicht erschüttern lassen
  alternative: nicht verzagen / nicht zerbrechen
  rationale: Die Übersetzung hält die Spannung zwischen Furcht, innerer Bestürzung und bildhaftem Zusammenbrechen offen, ohne eine einzelne Nuance zu verabsolutieren.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Wechsel von der pluralischen Anrede („ihr“) zur kollektiven Singularanrede („du Volk“) folgt der hebräischen Syntax. Die Satzstruktur bleibt poetisch und direkt, während schwer verständliche Wörtlichkeit vermieden wird.
