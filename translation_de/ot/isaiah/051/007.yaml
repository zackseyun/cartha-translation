revisions:
- from: Hört auf mich, ihr, die ihr Gerechtigkeit kennt, du Volk, das meine Weisung im Herzen trägt:[a] Fürchtet euch nicht vor der Schmähung durch Menschen[b] und lasst euch von ihren Beschimpfungen nicht erschüttern.[c]
  to: 'Hört auf mich, ihr, die ihr Gerechtigkeit kennt, ihr Volk, das meine Weisung in eurem Herzen hat: Fürchtet euch nicht vor der Schmähung eines Menschen[a] und lasst euch von ihren Beschimpfungen nicht erschüttern.[b]'
  rationale: Die Revision beseitigt den unklaren Wechsel von pluralischer Anrede zu „du Volk“ und gibt das pluralische Herz-Suffix der Quelle mit „eurem Herzen“ wieder. Die Apposition „ihr Volk“ erhält den kollektiven Charakter von עַם, ohne im Deutschen eine zweite, inkongruente Anrede einzuführen. Der Singular „eines Menschen“ wahrt die Form von אֱנוֹשׁ; die mögliche Nuance von Sterblichkeit bleibt als Alternative markiert. Die Bedeutung des Verses und seine poetisch-direkte Registerlage bleiben unverändert.
