  terminology: „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. „dein Gott“ und „Jahwe der Heerscharen“ sind sachgerecht und registerlich stimmig. Die Fußnoten kennzeichnen sowohl die reale lexikalische Mehrdeutigkeit von רֹגַע als auch die textlich vorhandene dritte Person bei שְׁמוֹ, ohne eine Lesart dogmatisch zu erzwingen.
