id: ISA.51.15
reference: Isaiah 51:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: de
  text: Denn ich bin Jahwe, dein Gott, der das Meer aufwühlt[a], sodass seine Wellen brausen — Jahwe der Heerscharen ist sein Name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der das Meer beruhigt/stillt, während seine Wellen brausen«. Das hebräische Partizip kann je nach Zusammenhang »aufwühlen« oder »beruhigen/stillen« bedeuten; die folgenden brausenden Wellen sprechen hier eher für »aufwühlt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen die dritte Person: »ist sein Name«. Sinngemäß wird bisweilen »ist mein Name« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Denn ich
  rationale: Die Konjunktion leitet im Zusammenhang eine begründende Zusicherung ein; das selbstständige Pronomen betont das »ich«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Suffix der zweiten Person Singular wird direkt und natürlich wiedergegeben.
- source_word: רֹגַע
  choice: der … aufwühlt
  rationale: Das Partizip ist mehrdeutig und kann je nach Zusammenhang Aufwühlen oder Beruhigen bezeichnen. Die unmittelbar folgenden brausenden Wellen sprechen hier für »aufwühlt«.
- source_word: הַיָּם
  choice: das Meer
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וַיֶּהֱמוּ
  choice: sodass … brausen
  rationale: Die Form beschreibt hier sinnvoll die Folge des Aufwühlens; »brausen« gibt das laute Tosen der Wellen idiomatisch wieder.
- source_word: גַּלָּיו
  choice: seine Wellen
  rationale: Das maskuline Suffix bezieht sich auf das im Hebräischen maskuline Wort für »Meer«; im Deutschen ist »seine« daher grammatisch passend.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Die traditionelle, würdevolle Wiedergabe bewahrt sowohl die Vorstellung geordneter Scharen als auch den Charakter eines göttlichen Titels.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Der masoretische Text hat ausdrücklich ein Suffix der dritten Person Singular; diese auffällige Form bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname wahrt die Unterscheidung zwischen dem persönlichen Gottesnamen und einem bloßen Titel.
- issue: Bedeutung von רֹגַע in Bezug auf das Meer
  choice: aufwühlt
  alternative: beruhigt; stillt
  rationale: Die lexikalische Mehrdeutigkeit wird nicht verschwiegen. Im Haupttext erhält »aufwühlt« den Vorzug, weil danach die Wellen brausen.
- issue: Person des Suffixes in שְׁמוֹ innerhalb der Gottesrede
  choice: sein Name
  alternative: mein Name
  rationale: Trotz des Wechsels von der ersten zur dritten Person wird die Form des hebräischen Textes bewahrt und nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Syntax bleibt nah am Hebräischen, klingt jedoch natürlich. Der auffällige Personenwechsel zu »sein Name« und die echte lexikalische Mehrdeutigkeit von רֹגַע werden bewahrt beziehungsweise erläutert.
