  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Bilder des Hebräischen zuverlässig wieder: das feminine Objekt verweist auf den Becher aus V. 22, die Bedrücker fordern Zion zur erniedrigenden Unterwerfung auf, und ihr Rücken wird mit Erde und einer Verkehrsfläche verglichen. »Über dich hinweggehen« ist durch das anschließende Rücken-/Straßenbild gut gestützt. Das einleitende »Da« vor וַתָּשִׂימִי fügt jedoch eine im Hebräischen nicht ausdrücklich markierte zeitlich-folgernde Nuance hinzu.'
