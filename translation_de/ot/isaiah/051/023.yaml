  text: וְ/שַׂמְתִּ֨י/הָ֙ בְּ/יַד מוֹגַ֔יִ/ךְ אֲשֶׁר אָמְר֥וּ לְ/נַפְשֵׁ֖/ךְ שְׁחִ֣י וְ/נַעֲבֹ֑רָה וַ/תָּשִׂ֤ימִי כָ/אָ֨רֶץ֙ גֵּוֵ֔/ךְ וְ/כַ/ח֖וּץ לַ/עֹבְרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: de
  text: 'Und ich werde ihn[a] in die Hand derer geben, die dich quälen, die zu dir sagten: »Beug dich nieder, damit wir über dich hinweggehen!« Du machtest deinen Rücken dem Erdboden gleich, wie eine Straße für die Vorübergehenden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: sie; gemeint ist der Becher aus Vers 22.'
    reason: Das hebräische Pronomen ist feminin, während das natürliche deutsche Bezugswort »Becher« maskulin ist.
lexical_decisions:
- source_word: מוֹגַיִךְ
  choice: die dich quälen
  rationale: Das seltene Wort bezeichnet hier die Bedrücker beziehungsweise Peiniger Zions. »quälen« gibt die feindselige Misshandlung natürlich und deutlich wieder.
- source_word: לְנַפְשֵׁךְ
  choice: zu dir
  rationale: נפש bezeichnet in dieser Anrede die Person selbst; eine wörtliche Wiedergabe mit »zu deiner Seele« wäre im modernen Deutschen missverständlich.
- source_word: שְׁחִי
  choice: Beug dich nieder
  rationale: Der feminine Singular richtet sich an die personifizierte Stadt Zion und fordert sie zu erniedrigender Unterwerfung auf.
- source_word: וְנַעֲבֹרָה
  choice: damit wir über dich hinweggehen
  rationale: Das Verb bedeutet »hinüber-/vorübergehen«; aus dem folgenden Bild vom Rücken als Straße ergibt sich, dass das Gehen über die erniedrigte Person gemeint ist.
- source_word: גֵּוֵךְ
  choice: deinen Rücken
  rationale: גֵּו bezeichnet den Rücken beziehungsweise Leib; im Bild des Zertretens ist »Rücken« die treffende deutsche Entsprechung.
- source_word: כַחוּץ
  choice: wie eine Straße
  rationale: חוּץ bedeutet grundsätzlich »draußen« und kann die freie Fläche beziehungsweise Gasse bezeichnen; im Zusammenhang mit den Darübergehenden ist »Straße« idiomatisch und bildkräftig.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in וְשַׂמְתִּיהָ
  choice: ihn, mit Fußnote zur grammatisch femininen Rückverweisung auf den Becher
  alternative: sie
  rationale: Das feminine Suffix verweist im Kontext auf die »Schale« beziehungsweise den »Becher« des Zorns aus Vers 22. Da »Becher« im Deutschen maskulin ist, folgt das Pronomen dem deutschen Bezugswort; die Fußnote bewahrt die Form des Hebräischen.
- issue: Bild des Über-Zion-Hinweggehens
  choice: explizit »über dich hinweggehen«
  alternative: nur »vorübergehen«
  rationale: Der Parallelismus mit dem Rücken als Erdboden und Straße zeigt eine gewaltsame, entwürdigende Handlung. Die Übersetzung macht diesen im Hebräischen kontextuell angelegten Bezug sichtbar, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt scharf und erniedrigend; das Straßenbild wird verständlich wiedergegeben, ohne die poetische Parallelität aufzugeben.
