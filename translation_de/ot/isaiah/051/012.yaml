source:
  edition: WLC
  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: de
  text: Ich, ich bin es, der euch tröstet. Wer bist du, dass du dich vor einem Menschen fürchtest, der sterben muss, und vor einem Menschensohn[a], der wie Gras dahingegeben wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Menschen“. „Menschensohn“ bezeichnet hier im poetischen Parallelismus einen gewöhnlichen sterblichen Menschen und ist nicht notwendigerweise ein messianischer Titel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: Ich, ich
  rationale: Die Wiederholung trägt den Nachdruck der göttlichen Selbstvorstellung und wird deshalb nicht zu „Ich selbst“ geglättet.
- source_word: הוּא
  choice: bin es
  rationale: In Verbindung mit dem wiederholten Personalpronomen bildet הוּא eine nachdrückliche Selbstidentifikationsformel; „Ich, ich bin es“ ist dafür idiomatisches Deutsch.
- source_word: מְנַחֶמְכֶם
  choice: der euch tröstet
  rationale: Das Partizip bezeichnet Gottes fortdauerndes beziehungsweise kennzeichnendes Handeln. Das Suffix ist Plural und wird mit „euch“ wiedergegeben.
- source_word: מִי אַתְּ
  choice: Wer bist du
  rationale: Die direkte rhetorische Frage bleibt erhalten; das deutsche „du“ lässt das feminine Genus der hebräischen Anrede, das sich auf die angesprochene Größe beziehungsweise Gemeinschaft bezieht, nicht eigens erkennen.
- source_word: וַתִּירְאִי
  choice: dass du dich … fürchtest
  rationale: Die Form bezeichnet Furcht angesichts menschlicher Bedrohung. Die reflexive deutsche Wendung ist natürlich und bewahrt die direkte Aussage.
- source_word: אֱנוֹשׁ
  choice: einem Menschen
  rationale: אֱנוֹשׁ bezeichnet den hinfälligen Menschen. Seine Sterblichkeit wird im folgenden Relativsatz ausdrücklich entfaltet, sodass „Mensch“ hier ausreicht.
- source_word: יָמוּת
  choice: der sterben muss
  rationale: Der Imperfekt stellt die sichere Sterblichkeit des Menschen heraus. „Sterben muss“ gibt diese unausweichliche Bestimmung im Deutschen klar wieder.
- source_word: בֶּן אָדָם
  choice: einem Menschensohn
  rationale: Die wörtliche Bildsprache und der Parallelismus zu אֱנוֹשׁ bleiben erhalten. Eine Fußnote erklärt, dass die Wendung hier den gewöhnlichen sterblichen Menschen bezeichnet.
- source_word: חָצִיר
  choice: Gras
  rationale: Gras ist das übliche prophetische Bild für Vergänglichkeit und menschliche Hinfälligkeit.
- source_word: יִנָּתֵן
  choice: dahingegeben wird
  rationale: Die passive Form von נתן wird bewusst nicht zu einem bloßen „vergeht“ geglättet. „Wie Gras dahingegeben wird“ bewahrt das ungewöhnliche Ausdrucksprofil und vermittelt zugleich Vergänglichkeit.
theological_decisions:
- issue: Deutung von בֶּן אָדָם in diesem nicht ausdrücklich messianischen Zusammenhang
  choice: Menschensohn
  alternative: ein Mensch / ein Menschenkind
  rationale: Im poetischen Parallelismus bezeichnet die Wendung hier einen gewöhnlichen sterblichen Menschen. Die wörtlichere Wiedergabe wahrt jedoch die hebräische Diktion und lässt mögliche intertextuelle Resonanzen stehen; die Fußnote verhindert, dass sie vorschnell als feststehender messianischer Titel verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung und die rhetorische Frage bleiben erhalten. Der Wechsel vom pluralischen „euch“ zur singularischen Anrede „du“, der bereits im Hebräischen steht, wird nicht harmonisiert.
