  to: Denn Jahwe tröstet Zion; er tröstet alle ihre Ruinen.[a] Er macht ihre Wüste wie Eden[b] und ihre dürre Ebene[c] wie den Garten Jahwes. Jubel und Freude werden in ihr zu finden sein, Dank und der Klang von Gesang.[d]
  rationale: Die einzige sichere Verbesserung ersetzt das im modernen Deutsch weniger natürliche und enger gefasste „Trümmerstätten“ durch „Ruinen“. Bedeutung, poetische Parallelität, Zeitprofil und alle Fußnotenanker bleiben erhalten.
