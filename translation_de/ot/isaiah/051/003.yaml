source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: de
  text: Denn Jahwe tröstet Zion; er tröstet alle ihre Ruinen.[a] Er macht ihre Wüste wie Eden[b] und ihre dürre Ebene[c] wie den Garten Jahwes. Jubel und Freude werden in ihr zu finden sein, Dank und der Klang von Gesang.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle ihre verwüsteten Orte“ beziehungsweise „alle ihre Einöden“.'
    reason: lexical_alternative
  - marker: b
    text: „Eden“ greift das Gartenmotiv aus 1. Mose auf; vergleiche den „Garten Jahwes“ im folgenden Satzteil.
    reason: cross_reference
  - marker: c
    text: 'Oder: „ihre Steppe“ beziehungsweise „ihre Wüstenebene“. Das hebräische Wort bezeichnet eine trockene Ebene.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Dank und die Stimme des Gesangs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zusage beziehungsweise Aufforderung ein und gibt die kausale Funktion natürlich wieder.
- source_word: נִחַם
  choice: tröstet
  rationale: Bezeichnet hier die tröstende, wiederherstellende Zuwendung zu Zion und ihren verwüsteten Orten. Das Präsens wahrt die eindringliche prophetische Gewissheit, ohne den hebräischen Aspekt zeitlich zu überbestimmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Übliche deutsche Form des Ortsnamens und der personifiziert dargestellten Stadt.
- source_word: כָּל חָרְבֹתֶיהָ
  choice: alle ihre Trümmerstätten
  rationale: Gibt die Gesamtheit der zerstörten oder verödeten Orte Zions konkret wieder; die Fußnote bewahrt weitere mögliche Nuancen.
- source_word: וַיָּשֶׂם
  choice: Er macht
  rationale: Das prophetische Präsens vermittelt die als gewiss dargestellte Wiederherstellung, ohne eine ausschließlich vergangene oder zukünftige Zeitstufe festzulegen.
- source_word: מִדְבָּרָהּ
  choice: ihre Wüste
  rationale: Natürliche Wiedergabe von מִדְבָּר und zugleich vom folgenden Ausdruck עֲרָבָה unterschieden.
- source_word: כְּעֵדֶן
  choice: wie Eden
  rationale: Bewahrt den Eigennamen und den Anklang an die Gartenerzählung der Genesis.
- source_word: וְעַרְבָתָהּ
  choice: ihre dürre Ebene
  rationale: Bezeichnet eine trockene, steppenartige Ebene und wahrt die lexikalische Unterscheidung zur vorausgehenden Wüste.
- source_word: כְּגַן יְהוָה
  choice: wie den Garten Jahwes
  rationale: Bewahrt die Genitivkonstruktion und die Verbindung des Bildes mit Eden.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Jubel und Freude
  rationale: Gibt das Paar festlicher Freude idiomatisch und mit zwei unterscheidbaren Begriffen wieder.
- source_word: יִמָּצֵא בָהּ
  choice: werden in ihr zu finden sein
  rationale: Das singularische Verb kann im Deutschen bei der zweiteiligen Aufzählung natürlich im Plural wiedergegeben werden; die Zukunftsform entspricht der Verheißung der Wiederherstellung.
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: Dank und der Klang von Gesang
  rationale: Bewahrt sowohl den Dank als auch die hörbare Stimme beziehungsweise den Klang des Singens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug der prophetischen Verben
  choice: 'Mischung aus prophetischem Präsens und ausdrücklichem Futur: „tröstet“, „macht“, „werden … zu finden sein“'
  alternative: durchgehend Vergangenheit oder durchgehend Zukunft
  rationale: Die hebräischen Verbformen stellen die Wiederherstellung als gewiss und anschaulich dar, legen aber keine einfache, durchgehend einheitliche deutsche Zeitfolge nahe. Die Übersetzung bewahrt diese Spannung.
- issue: Personifikation Zions
  choice: 'weibliche Bezüge: „ihre“, „in ihr“'
  alternative: unpersönliche Ortsbezüge
  rationale: Die hebräischen femininen Suffixe stellen Zion als weiblich personifizierte Stadt dar; dies bleibt im Deutschen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Bildsprache und die Personifikation Zions bleiben erhalten. „Trümmerstätten“ ist anschaulich, während die Fußnote die breiteren Bedeutungen von Verwüstung und Verödung dokumentiert. Die Marker stehen jeweils unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
