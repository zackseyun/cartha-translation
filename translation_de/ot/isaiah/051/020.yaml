source:
  edition: WLC
  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: de
  text: Deine Söhne sind ohnmächtig geworden; sie liegen am Anfang jeder Straße[a] wie eine Antilope[b] in einem Netz, erfüllt vom Zorn Jahwes und von der Zurechtweisung deines Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an jeder Straßenecke“. Wörtlich: „am Kopf jeder Straße“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Wildochse“. Welche Tierart das hebräische Wort bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: Deine Söhne
  rationale: Der maskuline Plural mit Suffix der 2. Person feminin Singular bezeichnet wörtlich „deine Söhne“. Die konkrete, geschlechtliche Form bleibt erhalten.
- source_word: עֻלְּפוּ
  choice: sind ohnmächtig geworden
  rationale: Die Form bezeichnet ein Schwach- oder Ohnmächtigwerden infolge großer Not und erklärt den anschließenden Zustand des Liegens.
- source_word: שָׁכְבוּ
  choice: sie liegen
  rationale: Das Präsens gibt den als gegenwärtig geschilderten Zustand nach dem Zusammenbrechen natürlich wieder.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: am Anfang jeder Straße
  rationale: רֹאשׁ bedeutet wörtlich „Kopf, Anfang, Spitze“. Die Wiedergabe bleibt nahe am Hebräischen; die kontextuell mögliche Deutung als Straßenecke steht in der Fußnote.
- source_word: כְּתוֹא
  choice: wie eine Antilope
  rationale: Die genaue Tierart ist unsicher. „Antilope“ vermittelt das Bild eines gefangenen Wildtiers, ohne die ältere Identifikation als Wildochse stillschweigend auszuschließen.
- source_word: מִכְמָר
  choice: im Netz
  rationale: Das Substantiv bezeichnet ein zum Tierfang verwendetes Netz.
- source_word: הַמְלֵאִים
  choice: erfüllt von
  rationale: Das pluralische Partizip bezieht sich auf die Söhne. Die Formulierung wahrt die starke Aussage, dass sie vom göttlichen Zorn erfüllt beziehungsweise ganz davon betroffen sind.
- source_word: חֲמַת יְהוָה
  choice: vom Zorn Jahwes
  rationale: חֵמָה bezeichnet heftigen, brennenden Zorn; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: vom Schelten deines Gottes
  rationale: גְּעָרָה bezeichnet eine scharfe, machtvolle Zurechtweisung. „Schelten“ wahrt die verbale Bildlichkeit und das Gewicht der Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bezug von הַמְלֵאִים
  choice: Die Söhne sind vom Zorn Jahwes und vom Schelten ihres Gottes erfüllt.
  alternative: 'Freier: Sie haben den Zorn Jahwes und das Schelten ihres Gottes voll zu spüren bekommen.'
  rationale: Die formal nähere Fassung erhält die ungewöhnliche und theologisch spannungsreiche Redeweise des Hebräischen, ohne sie als bloße Wirkung oder Strafe auszudeuten.
- issue: Identifikation von תוא
  choice: Antilope
  alternative: Wildochse
  rationale: Die Tierart ist lexikalisch unsicher und theologisch nicht entscheidend; die Unsicherheit wird ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem eindringlichen Bild des Hebräischen, ohne die ungewöhnliche Wendung „erfüllt vom Zorn“ erklärend aufzulösen. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Ausdrücken.
