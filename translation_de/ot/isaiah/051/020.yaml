  terminology: „Jahwe“ ist als Wiedergabe von יהוה konsistent. „Zorn“ für חֵמָה und „Zurechtweisung“ für גַּעֲרָה sind sachgerecht, ohne den Sinn konfessionell einzuengen. Die Fußnoten sichern sowohl die räumliche als auch die zoologische Mehrdeutigkeit ab.
