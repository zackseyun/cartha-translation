  source_fidelity: 'Die Übersetzung gibt die Abfolge und Bildsprache des Hebräischen im Wesentlichen präzise wieder: die Söhne sind zusammengebrochen, liegen an den Straßenanfängen, werden mit einem im Netz gefangenen Wildtier verglichen und sind von Jahwes Zorn und Gottes scharfer Zurechtweisung erfüllt. „Antilope“ ist bei der unsicheren Bedeutung von תוא vertretbar, sofern die Alternative in der Fußnote bleibt.'
