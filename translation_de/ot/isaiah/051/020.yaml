  rationale: 'Es ist nur eine sichere stilistisch-lexikalische Korrektur erforderlich: Das unidiomatische substantivierte „Schelten“ wird durch „Zurechtweisung“ ersetzt. Die Satzstruktur, die bewusst bildhafte Aussage „erfüllt vom Zorn“, der Gottesname und die abgesicherten Unsicherheiten bleiben erhalten.'
