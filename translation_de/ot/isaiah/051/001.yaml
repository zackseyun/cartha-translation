  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: de
  text: Hört auf mich, die ihr der Gerechtigkeit nachjagt,[a] die ihr Jahwe sucht! Blickt auf den Felsen, aus dem ihr herausgehauen wurdet,[b] und auf die Höhlung der Grube, aus der ihr ausgehauen wurdet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr dem Recht nachjagt“ bzw. „die ihr nach Rechtschaffenheit strebt“.'
    reason: lexical_alternative
  - marker: b
    text: Vers 2 bezieht die Bilder auf Abraham und Sara.
    reason: cross_reference
  - marker: c
    text: 'Wörtlich etwa: „die Aushöhlung einer Grube“. Die seltene hebräische Wendung beschreibt das Gegenbild zum aus dem Felsen Herausgehauensein.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Der pluralische Imperativ mit אֵלַי ist eine Aufforderung zu aufmerksamem Hören. „Hört auf mich“ ist im modernen Deutschen natürlich und gibt die Richtung „zu mir/auf mich“ idiomatisch wieder.
- source_word: רֹדְפֵי צֶדֶק
  choice: die ihr der Gerechtigkeit nachjagt
  rationale: Das Partizip bezeichnet Menschen, deren Handeln vom Verfolgen dessen geprägt ist, was recht und gerecht ist. „Nachjagen“ bewahrt die aktive Bildlichkeit von רדף; „Gerechtigkeit“ lässt die moralische und rechtliche Bedeutungsbreite von צֶדֶק offen.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: die ihr Jahwe sucht
  rationale: Die parallele Partizipialkonstruktion wird als direkte Anrede wiedergegeben. „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַבִּיטוּ
  choice: Blickt
  rationale: Der Imperativ fordert zu betrachtender, bedachter Aufmerksamkeit auf. „Blickt auf“ ist würdig, klar und passt zur folgenden Herkunftsmetapher.
- source_word: צוּר חֻצַּבְתֶּם
  choice: den Felsen, aus dem ihr herausgehauen wurdet
  rationale: צוּר bedeutet „Fels“, und חצב bezeichnet das Heraushauen von Stein. Die passive Herkunftsmetapher bleibt konkret erhalten.
- source_word: מַקֶּבֶת בּוֹר נֻקַּרְתֶּם
  choice: die Grube, aus der ihr herausgebrochen wurdet
  rationale: Die seltene Verbindung bezeichnet den Ort bzw. Hohlraum des Herausbrechens oder Ausgrabens. „Grube“ bewahrt בּוֹר, während „herausgebrochen“ die Gewinnungsmetapher von נקר im Parallelismus zum Heraushauen aus dem Felsen wiedergibt.
theological_decisions:
- issue: Deutung von Fels und Grube als Abraham und Sara
  choice: Die Metapher bleibt im Haupttext unausgelegt.
  alternative: Fels und Grube ausdrücklich mit Abraham und Sara identifizieren.
  rationale: Vers 2 entfaltet das Bild durch die Nennung Abrahams und Saras; Vers 1 selbst formuliert es noch metaphorisch. Die Übersetzung nimmt diese spätere Erklärung nicht vorweg.
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht; Rechtschaffenheit
  rationale: צֶדֶק kann gerechtes Handeln, Recht und Rechtschaffenheit umfassen. „Gerechtigkeit“ erhält im Deutschen diese theologische und soziale Spannung am besten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter pluralischer Anrede. Die parallelen Herkunftsbilder und ihre Spannung bleiben erhalten; die seltene zweite Steinbruchmetapher wird nicht vorschnell vereinheitlicht.
