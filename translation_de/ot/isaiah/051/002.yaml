source:
  edition: WLC
  text: הַבִּ֨יטוּ֙ אֶל אַבְרָהָ֣ם אֲבִי/כֶ֔ם וְ/אֶל שָׂרָ֖ה תְּחוֹלֶלְ/כֶ֑ם כִּי אֶחָ֣ד קְרָאתִ֔י/ו וַ/אֲבָרְכֵ֖/הוּ וְ/אַרְבֵּֽ/הוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: de
  text: Schaut auf Abraham, euren Vater, und auf Sara, die euch geboren hat! Denn ich berief ihn als einen Einzelnen; ich segnete ihn und machte ihn zahlreich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: Schaut auf
  rationale: Der pluralische Imperativ bewahrt das Bild des Hinschauens und fordert zugleich dazu auf, Abraham und Sara als Beispiel zu betrachten.
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: Abraham, euren Vater
  rationale: Bewahrt die familiäre und bundestheologische Sprache des Hebräischen; »Vater« ist die unmittelbare Bedeutung.
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: Sara, die euch geboren hat
  rationale: Das Verb bezeichnet hier das Gebären beziehungsweise die Wehen. Die Formulierung gibt das mütterliche Bild klar und natürlich wieder.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein.
- source_word: אֶחָד
  choice: als einen Einzelnen
  rationale: Bewahrt den wörtlichen Gedanken »einer/eins«, ist im Deutschen aber verständlicher als »als einen«. Zugleich hebt die Wendung den Ausgang von nur einem Menschen hervor, ohne die mögliche Nuance »allein« zu verdrängen.
- source_word: קְרָאתִיו
  choice: habe ich ihn berufen
  rationale: Gibt קרא im Zusammenhang eines göttlichen Rufes idiomatisch wieder und wahrt den heilsgeschichtlichen Klang.
- source_word: וַאֲבָרְכֵהוּ
  choice: ich habe ihn gesegnet
  rationale: Direkte und natürliche Wiedergabe von ברך.
- source_word: וְאַרְבֵּהוּ
  choice: zahlreich gemacht
  rationale: Der Hifil von רבה bedeutet »zahlreich machen/vermehren«. Die Formulierung ist im Deutschen natürlicher als »ihn vermehrt« und bewahrt den Bezug zur Verheißung zahlreicher Nachkommen.
theological_decisions:
- issue: Bedeutung von אֶחָד beim Ruf Abrahams
  choice: als einen Einzelnen
  alternative: als er allein war; als einen Einzigen
  rationale: Der hebräische Text sagt knapp »einen/eins« und betont, dass Gottes Vermehrung mit einem einzelnen Menschen begann. Die Hauptfassung erhält diesen Gedanken; die mögliche Zustandsnuance »allein« wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufforderung und die familiären Bilder bleiben erhalten. Das Perfekt bildet die hebräische Erzählfolge im Deutschen natürlich ab; das Semikolon gliedert Ruf, Segen und Vermehrung.
