  to: Warst nicht du es, die das Meer austrocknete, die Wasser der großen Tiefe[a], die die Tiefen des Meeres zu einem Weg für die Erlösten[b] machte, um hinüberzuziehen?
  rationale: Die Überarbeitung ersetzt die modal klingende Relativsatzkonstruktion durch die finale Formulierung „für die Erlösten …, um hinüberzuziehen“. Sie erhält die offene Referenz des „Meeres“, die feminine Anrede und die poetische Parallelität. Die erste Fußnote bleibt eine echte lexikalische Alternative, ohne zusätzliche kosmologische Deutung festzulegen.
