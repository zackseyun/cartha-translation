source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: de
  text: Warst nicht du es, die das Meer austrocknete, die Wasser der großen Tiefe[a], die die Tiefen des Meeres zu einem Weg für die Erlösten[b] machte, um hinüberzuziehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wasser der gewaltigen Tiefe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Freigekauften“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אַתְּ הִיא
  choice: Warst nicht du es
  rationale: Gibt die rhetorische Frage mit erwarteter Zustimmung und die emphatische Anrede idiomatisch wieder. Das feminine Relativpronomen „die“ bewahrt den grammatischen Bezug der Anrede.
- source_word: הַמַּחֲרֶבֶת
  choice: die … austrocknete
  rationale: Die kausative Bedeutung von חרב passt zum Meer und zur angedeuteten Rettung am Meer; „austrocknen“ ist im Deutschen natürlich und bildkräftig.
- source_word: יָם
  choice: das Meer
  rationale: Die unbestimmte Benennung des Hebräischen bleibt erhalten und lässt den Exodus-Anklang bestehen, ohne das Gewässer ausdrücklich zu identifizieren.
- source_word: מֵי תְהוֹם רַבָּה
  choice: die Wasser der großen Tiefe
  rationale: Bewahrt die kosmisch-poetische Färbung von תְּהוֹם und gibt רַבָּה formal als „groß“ wieder.
- source_word: הַשָּׂמָה
  choice: die … zu einem Weg machte
  rationale: „Zu einem Weg machen“ gibt die Funktion der Meerestiefen idiomatisch wieder.
- source_word: מַעֲמַקֵּי יָם
  choice: die Tiefen des Meeres
  rationale: Entspricht dem pluralischen Ausdruck und erhält das räumliche Bild.
- source_word: דֶּרֶךְ לַעֲבֹר
  choice: zu einem Weg …, auf dem … hinüberziehen konnten
  rationale: Formuliert Ziel und Möglichkeit des Durchzugs in natürlichem Deutsch; „hinüberziehen“ passt zu einer Gruppe beim Durchqueren des Meeres.
- source_word: גְּאוּלִים
  choice: die Erlösten
  rationale: Gibt das passive Partizip von גאל als Bezeichnung der Losgekauften bzw. Befreiten wieder und entspricht Jesajas Erlösungssprache.
theological_decisions:
- issue: Exodus-Anspielung und Reichweite des Erlösungsbildes
  choice: Das historische Bild der Meerüberquerung bleibt deutlich, ohne das Meer im Haupttext ausdrücklich als Schilfmeer zu benennen.
  alternative: Das Meer ausdrücklich als Schilfmeer identifizieren oder die Aussage rein metaphorisch verallgemeinern.
  rationale: Der hebräische Text weckt die Exodus-Erinnerung, nennt das Gewässer jedoch nur „Meer“. Die offene Benennung bewahrt sowohl den historischen Anklang als auch die weiterreichende Erlösungssymbolik.
- issue: Referenz der feminin angeredeten Person
  choice: Die feminine Anrede wird grammatisch bewahrt, aber ihr Bezug wird nicht erklärend festgelegt.
  alternative: Die Angeredete ausdrücklich als Zion oder als den Arm des HERRN identifizieren.
  rationale: Der unmittelbare Kontext richtet die Aufforderung an den „Arm des HERRN“, während die feminine Form sprachlich auffällig bleibt. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Würde. Die rhetorische Frage und die parallelen Relativsätze werden bewahrt; die Satzfügung bleibt trotz ihrer Feierlichkeit für heutige Leser verständlich.
