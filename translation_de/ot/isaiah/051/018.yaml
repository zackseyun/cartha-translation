  terminology: „Söhne“ bewahrt das im Hebräischen ausdrücklich maskuline בָּנִים. „Geboren“ und „großgezogen“ geben die mütterliche Bildsprache klar und in angemessen würdigem Register wieder. Es sind keine Fußnoten erforderlich.
