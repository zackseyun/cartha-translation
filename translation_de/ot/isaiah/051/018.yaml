id: ISA.51.18
reference: Isaiah 51:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: de
  text: Keiner von all den Söhnen, die sie geboren hat, führt sie, und keiner von all den Söhnen, die sie großgezogen hat, nimmt sie bei der Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְנַהֵל
  choice: führt
  rationale: Das Partizip von נהל bezeichnet ein leitendes oder führendes Handeln. „führt sie“ ist im Deutschen natürlich und lässt sowohl Orientierung als auch fürsorgliche Begleitung anklingen.
- source_word: לָהּ
  choice: sie
  rationale: Das feminine Suffix bezieht sich auf die als Frau personifizierte Stadt Zion beziehungsweise Jerusalem.
- source_word: מִכָּל בָּנִים
  choice: von all den Söhnen
  rationale: מן mit כל bezeichnet hier die Gesamtheit, aus der niemand hervortritt. Die Formulierung bewahrt zugleich das ausdrücklich maskuline בנים.
- source_word: יָלָדָה
  choice: die sie geboren hat
  rationale: Das Perfekt beschreibt die von der personifizierten Mutter geborenen Söhne; das deutsche Perfekt gibt den abgeschlossenen Vorgang mit gegenwärtiger Bedeutung natürlich wieder.
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: nimmt sie bei der Hand
  rationale: Die hebräische Wendung bezeichnet wörtlich ein Ergreifen oder Festhalten an ihrer Hand und vermittelt hier stützende Führung. „bei der Hand nehmen“ bewahrt das Bild idiomatisch.
- source_word: גִּדֵּלָה
  choice: die sie großgezogen hat
  rationale: Das Piel von גדל bedeutet hier Kinder aufziehen. „großgezogen“ ist modernes, geläufiges Deutsch und entspricht dem mütterlichen Bild.
- source_word: אֵין ... וְאֵין
  choice: Keiner ... und keiner
  rationale: Die wiederholte Existenzverneinung unterstreicht die völlige Verlassenheit. Die parallele Wiederholung wird knapp und deutlich bewahrt.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von בָּנִים
  choice: Söhne
  alternative: Kinder
  rationale: Der hebräische Text verwendet in der mütterlichen Metapher für Jerusalem ausdrücklich den maskulinen Plural „Söhne“. Diese Geschlechtsmarkierung wird beibehalten, ohne darüber hinaus eine besondere Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und die wiederholte Verneinung bleiben erhalten; die beiden Relativsätze geben die mütterliche Bildsprache klar und natürlich wieder.
