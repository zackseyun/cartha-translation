source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: de
  text: Und die von Jahwe Erlösten werden zurückkehren und unter Jubel[a] nach Zion kommen. Ewige Freude wird auf ihren Häuptern sein; Frohlocken und Freude werden sie einholen[b]; Kummer und Seufzen werden fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Jubelgesang“ beziehungsweise „mit Freudenrufen“; das hebräische Wort kann sowohl jubelndes Rufen als auch Singen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Frohlocken und Freude werden sie erreichen“; das hebräische Verb kann „einholen, erreichen“ bedeuten und stellt Frohlocken und Freude bildhaft als Verfolger dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: die … Erlösten
  rationale: Das passive Partizip von פדה bezeichnet Menschen, die erlöst oder losgekauft worden sind. „Die Erlösten“ ist im Deutschen natürlich und bewahrt den Gedanken der Befreiung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְשׁוּבוּן
  choice: werden zurückkehren
  rationale: שוב bedeutet hier im Zusammenhang der angekündigten Wiederherstellung „zurückkehren“.
- source_word: וּבָאוּ צִיּוֹן
  choice: und … nach Zion kommen
  rationale: בוא bezeichnet das Kommen; im Deutschen verlangt das Ziel „Zion“ hier natürlich die Präposition „nach“.
- source_word: בְּרִנָּה
  choice: unter Jubel
  rationale: רִנָּה kann freudiges Rufen, Jubeln oder Singen bezeichnen. „Unter Jubel“ bewahrt diese Bedeutungsbreite besser als eine Festlegung allein auf Gesang.
- source_word: שִׂמְחַת עוֹלָם
  choice: ewige Freude
  rationale: Die Wendung bezeichnet dauerhaftes, nie endendes Freuen; „ewige Freude“ ist knapp und poetisch.
- source_word: עַל רֹאשָׁם
  choice: auf ihren Häuptern
  rationale: Die bildhafte Ortsangabe wird formal bewahrt. „Häupter“ trägt dem gehobenen poetischen Register Rechnung.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Frohlocken und Freude
  rationale: Zwei verwandte, aber unterscheidbare Begriffe werden nicht zu einem einzigen Ausdruck eingeebnet.
- source_word: יַשִּׂיגוּן
  choice: werden sie einholen
  rationale: Die Hifil-Form von נשׂג vermittelt das Bild, dass Frohlocken und Freude die Heimkehrenden verfolgen und erreichen.
- source_word: נָסוּ
  choice: werden fliehen
  rationale: Obwohl die Form morphologisch ein Qatal ist, wird sie innerhalb der prophetischen Zukunftsschilderung resultativ-zukünftig wiedergegeben.
- source_word: יָגוֹן וַאֲנָחָה
  choice: Kummer und Seufzen
  rationale: Die beiden Substantive bezeichnen inneren Schmerz beziehungsweise dessen hörbaren Ausdruck; die deutsche Paarung erhält diese Abstufung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ erhält den Unterschied zwischen Name und Titel.
- issue: Zeitwert von נָסוּ in prophetischer Dichtung
  choice: 'zukünftig-resultativ: „werden fliehen“'
  alternative: 'perfektiv: „sind geflohen“'
  rationale: Der Satz gehört zur angekündigten Rückkehr und beschreibt deren Folge. Die deutsche Zukunftsform stellt diesen Zusammenhang klar, ohne die perfekte hebräische Form als gewöhnliche Vergangenheit misszuverstehen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. „Häuptern“ ist bewusst gehoben, um das markante hebräische Bild zu erhalten; ansonsten bleibt die Formulierung allgemein verständlich. Die parallelen Freudenbegriffe und die Personifikation in „einholen“ werden bewahrt.
