  text: שְׁתַּ֤יִם הֵ֨נָּה֙ קֹֽרְאֹתַ֔יִ/ךְ מִ֖י יָנ֣וּד לָ֑/ךְ הַ/שֹּׁ֧ד וְ/הַ/שֶּׁ֛בֶר וְ/הָ/רָעָ֥ב וְ/הַ/חֶ֖רֶב מִ֥י אֲנַחֲמֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: de
  text: Diese beiden Dinge[a] sind über dich gekommen – wer wird um dich klagen? – Verwüstung und Zerstörung, Hunger und Schwert; wer wird dich trösten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nennt der hebräische Text »zwei Dinge«, führt dann aber vier Katastrophen in zwei Paaren an: »Verwüstung und Zerstörung« sowie »Hunger und Schwert«.'
    reason: textual_tension
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: Diese beiden Dinge
  rationale: Bewahrt die ausdrücklich genannte Zahl und die hinweisende Kraft der hebräischen Formulierung.
- source_word: קֹרְאֹתַיִךְ
  choice: sind über dich gekommen
  rationale: Das Verb קרא bezeichnet in dieser Verbindung mit Unheil nicht ein Rufen, sondern das Eintreffen beziehungsweise Widerfahren von Katastrophen.
- source_word: מִי יָנוּד לָךְ
  choice: wer wird um dich klagen?
  rationale: נוּד kann Klage, mitfühlende Anteilnahme oder eine Trauergeste ausdrücken. »Um dich klagen« ist natürlich und lässt die mitfühlende Bedeutung anklingen.
- source_word: הַשֹּׁד
  choice: Verwüstung
  rationale: Gibt die durch gewaltsame Zerstörung entstandene Verheerung prägnant wieder.
- source_word: הַשֶּׁבֶר
  choice: Zusammenbruch
  rationale: Bewahrt das Bild des Brechens und bezeichnet im prophetischen Unheilskontext den völligen Zusammenbruch.
- source_word: הָרָעָב
  choice: Hunger
  rationale: Im Deutschen ist »Hunger« in der festen Verbindung »Hunger und Schwert« natürlich und bezeichnet hier die Hungersnot als Gerichtskatastrophe.
- source_word: הַחֶרֶב
  choice: Schwert
  rationale: Entspricht dem hebräischen Ausdruck und steht metonymisch für Krieg und gewaltsamen Tod.
- source_word: מִי אֲנַחֲמֵךְ
  choice: wer wird dich trösten?
  rationale: נחם im Piel bedeutet »trösten«; zugleich bleibt damit das zentrale Trostmotiv in Jesaja erkennbar.
theological_decisions:
- issue: Die Ankündigung von »zwei« Dingen trotz vier Katastrophenbezeichnungen
  choice: Die Zahl zwei bleibt stehen; die vier Begriffe erscheinen als zwei Begriffspaare.
  alternative: Den Text emendieren oder unbestimmt von mehrfachen beziehungsweise doppelten Katastrophen sprechen.
  rationale: Der masoretische Text nennt ausdrücklich zwei und ordnet anschließend vier Unheilsbegriffe in zwei koordinierte Paare. Die Übersetzung bewahrt diese Spannung, ohne sie durch eine nicht erforderliche Textänderung aufzulösen.
- issue: Unbestimmtheit des möglichen Trösters
  choice: Die rhetorische Frage bleibt ohne ausdrücklich genanntes Subjekt außer »wer«.
  alternative: Gott oder menschliche Verbündete ausdrücklich als möglichen Tröster einsetzen.
  rationale: Der Vers nennt den Tröster nicht. Eine nähere Bestimmung würde eine theologische Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede Zions im Singular bleibt erhalten. Gedankenstriche bilden die eingeschobene rhetorische Frage ab; das Semikolon trennt die abschließende Trostfrage klar von der Unheilsaufzählung.
