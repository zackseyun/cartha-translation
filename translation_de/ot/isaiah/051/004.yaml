  text: הַקְשִׁ֤יבוּ אֵלַ/י֙ עַמִּ֔/י וּ/לְאוּמִּ֖/י אֵלַ֣/י הַאֲזִ֑ינוּ כִּ֤י תוֹרָה֙ מֵ/אִתִּ֣/י תֵצֵ֔א וּ/מִשְׁפָּטִ֔/י לְ/א֥וֹר עַמִּ֖ים אַרְגִּֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: de
  text: Hört auf mich, mein Volk, und hört mir zu, mein Volk! Denn Weisung[a] wird von mir ausgehen, und mein Recht[b] werde ich als Licht für die Völker einsetzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesetz“ oder „Lehre“ (hebräisch תּוֹרָה).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Gericht“, „meine Gerechtigkeit“ oder „meine Rechtsentscheidung“ (hebräisch מִשְׁפָּטִי).'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb ist schwierig. Es kann auch im Sinn von „zur Ruhe bringen“ oder „ruhen lassen“ verstanden werden; möglich sind außerdem Wiedergaben wie „fest begründen“ oder „aufrichten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Hört aufmerksam auf mich
  rationale: Der Imperativ fordert zu bewusstem, aufmerksamem Hören auf; die Formulierung ist im modernen Deutsch natürlich und bewahrt den Nachdruck.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Gibt die kollektive Anrede und ihren Bundesklang direkt wieder.
- source_word: וּלְאוּמִּי
  choice: meine Nation
  rationale: Bewahrt gegenüber עַמִּי die lexikalische Unterscheidung der parallelen Anrede, auch wenn beide hebräischen Wörter semantisch überlappen.
- source_word: הַאֲזִינוּ
  choice: hört mir zu
  rationale: Gibt den zweiten, parallelen Höraufruf idiomatisch wieder, ohne beide Imperative völlig gleich zu übersetzen.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: Bezeichnet hier Gottes autoritative Lehre und ist weiter als das möglicherweise zu eng verstandene deutsche Wort „Gesetz“.
- source_word: תֵצֵא
  choice: wird … ausgehen
  rationale: Bewahrt die im Verb ausgedrückte Bewegung von Gott her nach außen.
- source_word: וּמִשְׁפָּטִי
  choice: mein Recht
  rationale: „Recht“ hält die Bedeutungsbreite zwischen gerechter Ordnung, Rechtsentscheid und Gericht besser offen als eine einseitige Festlegung.
- source_word: לְאוֹר עַמִּים
  choice: als Licht für die Völker
  rationale: Gibt Zweck beziehungsweise Wirkung natürlich wieder und bewahrt den universalen Horizont des Plurals.
- source_word: אַרְגִּיעַ
  choice: werde ich … zur Ruhe bringen
  rationale: Die schwierige Hifilform von רגע wird eng am möglichen kausativen Sinn wiedergegeben. Dadurch bleibt die genuine lexikalische Unsicherheit sichtbar, statt sie im Haupttext auf „einsetzen“ oder „aufrichten“ festzulegen.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet hier die Völkerwelt; „Völker“ ist dafür die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Reichweite von תּוֹרָה und מִשְׁפָּט gegenüber den Völkern
  choice: Gottes Weisung und Recht sind auf die Völker hin ausgerichtet.
  alternative: Die Aussage bezieht sich ausschließlich auf das mosaische Gesetz und das Gericht für Israel.
  rationale: Die ausdrückliche Wendung „für die Völker“ und das Ausgehen von Gott her weisen auf einen universalen Horizont, ohne dessen spätere theologische Entfaltung vorwegzunehmen.
- issue: Bedeutung von מִשְׁפָּטִי
  choice: mein Recht
  alternative: mein Gericht; meine Gerechtigkeit; meine Rechtsentscheidung
  rationale: „Recht“ bewahrt die positive und richterliche Bedeutungsbreite des hebräischen Ausdrucks und vermeidet eine unnötige Festlegung auf Strafgericht oder einen abstrakten Gerechtigkeitsbegriff.
- issue: Deutung von אַרְגִּיעַ
  choice: zur Ruhe bringen
  alternative: einsetzen; fest begründen; aufrichten
  rationale: Die hebräische Verbform ist umstritten. Der Haupttext folgt einer formal naheliegenden kausativen Deutung; die Fußnote nennt die kontextuell möglichen Alternativen, ohne die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die parallelen Höraufrufe bleiben erkennbar, ohne altertümliches „leiht mir euer Ohr“. „Weisung“ und „Recht“ sind verständlich und zugleich semantisch offen. Die ungewöhnliche Formulierung „zur Ruhe bringen“ bewahrt bewusst die Schwierigkeit des Schlussverbs und wird durch eine Fußnote abgesichert.
