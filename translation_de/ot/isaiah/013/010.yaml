  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: de
  text: Denn die Sterne des Himmels und seine Sternbilder[a] werden ihr Licht nicht strahlen lassen; die Sonne verfinstert sich bei ihrem Aufgang, und der Mond wird sein Licht nicht strahlen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seine Orione“. Das hebräische Wort kann speziell den Orion bezeichnen, meint hier im Plural jedoch möglicherweise allgemeiner Sternbilder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Gerichtsankündigung ein und entspricht dem deutschen prophetischen Erzählfluss.
- source_word: כוֹכְבֵי הַשָּׁמַיִם
  choice: die Sterne des Himmels
  rationale: Bewahrt die Genitivverbindung und den gehobenen poetischen Klang des Hebräischen.
- source_word: וּכְסִילֵיהֶם
  choice: und seine Sternbilder
  rationale: כְּסִיל kann speziell den Orion bezeichnen; der Plural mit Suffix legt hier jedoch eine allgemeinere Bezeichnung für die Sternbilder des Himmels nahe. Das deutsche Pronomen steht im Singular, weil „Himmel“ im Deutschen grammatisch Singular ist.
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: werden ihr Licht nicht leuchten lassen
  rationale: Gibt die Verneinung, den Zukunftsbezug und die kausative beziehungsweise lichtausstrahlende Bedeutung der Hifil-Form wieder.
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: die Sonne ist bei ihrem Aufgang verfinstert
  rationale: Bewahrt den anschaulichen perfektischen Ausdruck innerhalb der prophetischen Zukunftsschilderung; בְּצֵאתוֹ bezeichnet hier idiomatisch den Sonnenaufgang.
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: und der Mond wird sein Licht nicht scheinen lassen
  rationale: Die Form von נגהּ ist kausativ; „scheinen lassen“ bildet diese Nuance verständlich und relativ formnah ab.
theological_decisions:
- issue: Deutung der kosmischen Verfinsterung
  choice: Die kosmischen Bilder werden unmittelbar wiedergegeben, ohne sie als ausschließlich wörtliches astronomisches Geschehen oder ausschließlich politische Metapher festzulegen.
  alternative: Ausdrückliche Deutung als endzeitliche kosmische Katastrophe oder als Sinnbild für den Sturz irdischer Mächte.
  rationale: Der hebräische Text verwendet kosmische Entschöpfungs- und Gerichtsbilder, entscheidet aber an dieser Stelle nicht ausdrücklich zwischen diesen Deutungsebenen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch-prophetischem Satzbau. Das prophetische Perfekt bei der Sonne bleibt gegenüber den futurischen Aussagen über Sterne und Mond sichtbar; die sachliche Bildsprache wird nicht interpretierend aufgelöst.
