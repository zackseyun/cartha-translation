source:
  edition: WLC
  text: וְ/עֹלְלֵי/הֶ֥ם יְרֻטְּשׁ֖וּ לְ/עֵֽינֵי/הֶ֑ם יִשַּׁ֨סּוּ֙ בָּֽתֵּי/הֶ֔ם וּ/נְשֵׁי/הֶ֖ם תשגלנה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/016.yaml
  text: Their infants will be dashed to pieces before their eyes; their houses will be plundered[a], and their wives raped.
translation:
  language: de
  text: Ihre kleinen Kinder werden vor ihren Augen zerschmettert; ihre Häuser werden geplündert und ihre Frauen vergewaltigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: ihre kleinen Kinder
  rationale: עֹלֵל bezeichnet sehr junge Kinder. „Kleine Kinder“ gibt die Altersangabe im modernen Deutschen natürlich wieder, ohne sie enger als nötig auf Säuglinge zu beschränken.
- source_word: יְרֻטְּשׁוּ
  choice: werden zerschmettert
  rationale: Das passive Verb bezeichnet gewaltsames Zerschlagen. „Zerschmettert“ bewahrt die erschütternde Härte des hebräischen Ausdrucks.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die deutsche Wendung entspricht dem hebräischen Idiom und macht deutlich, dass das Geschehen in ihrer unmittelbaren Sicht stattfindet.
- source_word: יִשַּׁסּוּ
  choice: werden geplündert
  rationale: Das Verb bezeichnet das Ausrauben beziehungsweise Plündern. Wegen des Subjekts „Häuser“ ist die passive deutsche Form natürlich und genau.
- source_word: בָּתֵּיהֶם
  choice: ihre Häuser
  rationale: „Häuser“ ist die direkte, sachlich passende Wiedergabe von בָּתִּים im Zusammenhang kriegerischer Plünderung.
- source_word: וּנְשֵׁיהֶם
  choice: ihre Frauen
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „Ihre Frauen“ bewahrt diese im Hebräischen vorhandene Bedeutungsbreite und ist im Kontext verständlich.
- source_word: תשגלנה
  choice: werden vergewaltigt
  rationale: Die überlieferte grobe Verbform bezeichnet hier sexuelle Gewalt. „Vergewaltigt“ benennt den Sinn im heutigen Deutsch klar und ohne beschönigenden Euphemismus.
theological_decisions:
- issue: Wiedergabe sexueller Gewalt in einer prophetischen Gerichtsankündigung
  choice: ihre Frauen werden vergewaltigt
  alternative: ihre Frauen werden geschändet
  rationale: Die direkte Formulierung entspricht der Härte des überlieferten hebräischen Ausdrucks und verschleiert die angekündigte sexuelle Gewalt nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, direkter Benennung der Kriegsgewalt. Die drei parallelen Satzglieder und die passive Ausdrucksweise des Ausgangstextes bleiben erhalten.
