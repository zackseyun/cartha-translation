  terminology: „Durchbohrt“ und „durch das Schwert“ sind angemessene, nicht unnötig euphemistische Wiedergaben der kriegerischen Bildsprache. „Ergriffen“ vermeidet die zu enge Festlegung auf Gefangennahme und wahrt zugleich den Kontext.
