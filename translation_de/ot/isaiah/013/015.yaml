  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
translation:
  language: de
  text: Jeder, der gefunden wird, wird durchbohrt, und jeder, der ergriffen wird,[a] wird durch das Schwert fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder, der weggerafft wird“. Das hebräische Partizip von ספה kann je nach Zusammenhang sowohl Erfasstwerden als auch Weggerafftwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנִּמְצָא
  choice: Jeder, der gefunden wird
  rationale: כָּל wird mit dem substantivisch gebrauchten Nifal-Partizip הַנִּמְצָא distributiv verbunden. Die Wiedergabe bewahrt Passivform und umfassenden Bezug in natürlichem Deutsch.
- source_word: יִדָּקֵר
  choice: wird durchbohrt
  rationale: Das Nifal-Imperfekt von דקר bezeichnet das Durchbohrtwerden mit einer Waffe. „Durchbohrt“ gibt die Gewaltsamkeit prägnant und würdig wieder.
- source_word: וְכָל הַנִּסְפֶּה
  choice: und jeder, der weggerafft wird
  rationale: Das passive Partizip von ספה kann hier das Erfasst- oder Weggerafftwerden im Gericht bezeichnen. „Weggerafft“ erhält die weitere Bedeutung und vermeidet die nicht zwingend im Hebräischen enthaltene Festlegung auf Gefangennahme.
- source_word: יִפּוֹל
  choice: fällt
  rationale: Das Qal-Imperfekt von נפל steht im Kriegszusammenhang für das Fallen beziehungsweise Umkommen; die folgende Wendung nennt das Mittel.
- source_word: בֶּחָרֶב
  choice: durch das Schwert
  rationale: Die Präposition בְּ bezeichnet hier Mittel oder Ursache. „Durch das Schwert“ ist im Deutschen eine klare, kontextgerechte Kriegsformel.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem Parallelismus. Die zweimalige Formulierung „jeder, der …“ bildet die distributive Struktur des Hebräischen ab; die lexikalische Mehrdeutigkeit von הַנִּסְפֶּה wird in der Fußnote offengehalten.
