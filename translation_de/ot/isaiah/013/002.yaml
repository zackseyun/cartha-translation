source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: de
  text: Auf einem kahlen Berg richtet ein Signalzeichen auf[a]! Erhebt die Stimme zu ihnen! Winkt mit der Hand[b], damit sie durch die Tore der Vornehmen einziehen[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Feldzeichen« oder »Banner«. Das hebräische Wort נֵס bezeichnet häufig ein erhöht aufgerichtetes militärisches Zeichen oder ein Zeichen zum Sammeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gebt mit der Hand ein Zeichen« beziehungsweise »Winkt sie herbei«. Die Geste dient wahrscheinlich dazu, die angreifende Streitmacht herbeizurufen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »durch die Tore der Fürsten«. Das hebräische נְדִיבִים kann Vornehme, Fürsten oder andere hochgestellte Führer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: kahlen
  rationale: Das Wort bezeichnet hier wohl einen entblößten oder von Bewuchs freien Berg. »Kahl« gibt das sichtbare Bild einer weithin erkennbaren Höhe knapp und natürlich wieder.
- source_word: נֵס
  choice: Signalzeichen
  rationale: In diesem militärisch-prophetischen Zusammenhang ist ein erhöhtes Zeichen zum Sammeln oder Lenken von Truppen gemeint. »Signalzeichen« verdeutlicht seine Funktion, ohne seine konkrete Form festzulegen.
- source_word: הָרִימוּ קוֹל
  choice: Erhebt die Stimme
  rationale: Die Wendung bewahrt das hebräische Bild und ist zugleich verständliches, würdiges Deutsch.
- source_word: לָהֶם
  choice: zu ihnen
  rationale: Die Präposition bezeichnet am natürlichsten die Richtung des Rufs; die Angesprochenen bleiben entsprechend dem Hebräischen nur durch das Pronomen bestimmt.
- source_word: הָנִיפוּ יָד
  choice: Winkt mit der Hand
  rationale: Die Formulierung gibt die sichtbare Handbewegung konkret wieder. Dass sie als Herbeiwinken dient, liegt nahe, wird aber nicht zwingend in den Haupttext eingetragen.
- source_word: וְיָבֹאוּ
  choice: damit sie … einziehen
  rationale: Nach den Aufforderungen lässt sich die Verbform natürlich als Zweck oder Folge verstehen. »Einziehen« passt zu den folgenden Toren und zum militärischen Zusammenhang.
- source_word: פִּתְחֵי
  choice: Tore
  rationale: Wörtlich sind Öffnungen oder Eingänge gemeint; im Zusammenhang einer Stadt oder Festung ist »Tore« die idiomatische deutsche Wiedergabe.
- source_word: נְדִיבִים
  choice: Vornehmen
  rationale: Das Wort kann hochgestellte, angesehene oder führende Personen bezeichnen. »Vornehme« wahrt diese Breite besser als das spezifischere »Fürsten«.
