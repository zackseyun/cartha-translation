source:
  edition: WLC
  text: הִנְ/נִ֛י מֵעִ֥יר עֲלֵי/הֶ֖ם אֶת מָדָ֑י אֲשֶׁר כֶּ֨סֶף֙ לֹ֣א יַחְשֹׁ֔בוּ וְ/זָהָ֖ב לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/017.yaml
  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
translation:
  language: de
  text: Siehe, ich wecke die Meder gegen sie auf, die Silber nicht schätzen und an Gold kein Gefallen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Silber nicht beachten und Gold nicht begehren“. Die Formulierung besagt, dass sie nicht auf Silber oder Gold aus sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Die Verbindung aus Aufmerksamkeitspartikel und Pronomen leitet eine nachdrückliche göttliche Ankündigung ein. „Siehe“ bewahrt den prophetischen Ton und ist im modernen Bibeldeutsch verständlich.
- source_word: מֵעִיר
  choice: stachle ... auf
  rationale: Das Hifil-Partizip von עור bezeichnet das Veranlassen zum Erwachen oder Tätigwerden. „Ich stachle ... auf“ gibt die aktive Veranlassung in einem feindlich-militärischen Zusammenhang natürlich wieder; das Präsens wahrt den gegenwärtigen beziehungsweise unmittelbar bevorstehenden Sinn des Partizips.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: על mit Pronomen bezeichnet im militärischen Zusammenhang die feindliche Ausrichtung und wird daher idiomatisch mit „gegen sie“ wiedergegeben.
- source_word: אֶת מָדָי
  choice: die Meder
  rationale: מָדַי bezeichnet hier das Volk, nicht bloß das Gebiet Medien. „Die Meder“ ist die übliche deutsche Volksbezeichnung.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen führt eine Beschreibung der Meder als Personengruppe ein.
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: Silber nicht achten
  rationale: חשב bedeutet hier „einschätzen, für etwas halten, achten“ und nicht lediglich „denken“. Die Formulierung drückt ihre Gleichgültigkeit gegenüber Silber aus, ohne eine bestimmte Motivation wie Bestechlichkeit ausdrücklich in den Haupttext einzutragen.
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: und an Gold kein Gefallen haben
  rationale: חפץ mit ב kann Gefallen, Freude oder Verlangen bezeichnen. „An Gold kein Gefallen haben“ bewahrt die affektive Nuance und gibt das pronominale בו idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. „Siehe“ ist bewusst bibelsprachlich, aber allgemein verständlich; die übrige Syntax ist knapp und gegenwärtig. Die alternative Bedeutungsbreite von חשב und חפץ wird in der Fußnote offengehalten.
