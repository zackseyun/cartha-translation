  source_fidelity: Die Übersetzung gibt die Ankündigung des kommenden Tages Jahwes, die dreifache Charakterisierung des Gerichts, den Zweck der Verwüstung und die Beseitigung der Sünder grundsätzlich treffend wieder. „Erde“ ist im weiteren Kontext gut vertretbar; die Fußnote wahrt die lexikalisch mögliche Bedeutung „Land“. Das Subjekt des maskulinen Singularverbs bleibt sinnvollerweise offen.
  naturalness: „Ihre Sünder wird er aus ihr vernichten“ ist im heutigen Deutsch syntaktisch und kollokativ unerquicklich, da „vernichten“ nicht natürlich mit „aus ihr“ verbunden wird. „Aus ihr ausrotten“ gibt sowohl die eliminierende Kraft von שׁמד als auch die Präpositionalphrase מִמֶּנָּה idiomatisch wieder.
  terminology: „Jahwe“, „Tag Jahwes“, „Grimm“ und „glühender Zorn“ sind registergerecht und konsistent. „Einöde“ ist eine angemessene Wiedergabe von לְשַׁמָּה.
