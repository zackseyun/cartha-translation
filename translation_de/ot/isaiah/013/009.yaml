    issue: Unnatürliche Verbindung „aus ihr vernichten“
    rationale: Das deutsche Verb „vernichten“ wird hier nicht idiomatisch mit einer Herkunfts-/Entfernungsangabe konstruiert. „Aus ihr ausrotten“ bewahrt den Sinn, dass die Sünder aus der Erde/dem Land entfernt und vernichtet werden.
  - severity: low
