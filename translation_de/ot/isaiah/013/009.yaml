source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: de
  text: Siehe, der Tag Jahwes kommt – grausam, mit Grimm und glühendem Zorn –, um die Erde[a] zur Einöde zu machen, und ihre Sünder wird er[b] aus ihr ausrotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“. Das hebräische Wort kann sowohl ein bestimmtes Land als auch die Erde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb steht in der dritten Person maskulin Singular; sein nicht ausdrücklich genanntes Subjekt kann sich auf Jahwe oder auf den Tag Jahwes beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die hinweisende, feierliche Kraft der prophetischen Ankündigung und ist im Deutschen weiterhin verständlich.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Gibt die feste prophetische Wendung direkt wieder und verwendet für das Tetragramm die Projektform „Jahwe“.
- source_word: בָּא
  choice: kommt
  rationale: Das Partizip bezeichnet hier ein unmittelbar bevorstehendes und gewisses Kommen; das deutsche Präsens wirkt lebendig und natürlich.
- source_word: אַכְזָרִי
  choice: grausam
  rationale: Entspricht der Charakterisierung des Tages als schonungslos und hart, ohne den Ausdruck weiter auszudeuten.
- source_word: וְעֶבְרָה
  choice: mit Grimm
  rationale: „Grimm“ gibt die intensive Zornesbezeichnung knapp und würdig wieder und unterscheidet sie vom folgenden Ausdruck.
- source_word: וַחֲרוֹן אָף
  choice: und glühendem Zorn
  rationale: Bewahrt das hebräische Bild von der Hitze bzw. dem Entbrennen des Zorns und die Häufung der Zornesbegriffe.
- source_word: לָשׂוּם
  choice: um … zu machen
  rationale: Gibt den Zweckinfinitiv in natürlichem Deutsch wieder.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten; der weite, kosmisch anmutende Zusammenhang in Jesaja 13 unterstützt hier „Erde“, ohne die Alternative auszuschließen.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: Bezeichnet einen verwüsteten, menschenleeren Zustand und wahrt den prophetischen Sprachton.
- source_word: וְחַטָּאֶיהָ
  choice: ihre Sünder
  rationale: Gibt das Substantiv mit dem femininen Suffix knapp wieder; das Pronomen bezieht sich auf die Erde.
- source_word: יַשְׁמִיד
  choice: wird er vernichten
  rationale: Das Hifil von שׁמד bezeichnet entschiedene Vernichtung. Das maskuline Subjekt bleibt im Deutschen als „er“ erkennbar.
- source_word: מִמֶּנָּה
  choice: aus ihr
  rationale: Bezieht sich grammatisch auf die feminine „Erde“ und ist im Deutschen natürlicher als „von ihr weg“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen sichtbar wieder; „der HERR“ ist die traditionelle Ersatzlesung, steht aber so nicht im hebräischen Konsonantentext.
- issue: Subjekt von יַשְׁמִיד
  choice: „er“, mit möglichem Bezug auf Jahwe
  alternative: „er“, grammatisch auch auf den Tag Jahwes beziehbar
  rationale: Das Verb steht maskulin singular. Sowohl יְהוָה als auch יוֹם sind grammatisch mögliche Bezugspunkte. Die Übersetzung wahrt mit dem bloßen Pronomen die Ambiguität, statt sie durch eine ausdrückliche Wiederholung von „Jahwe“ oder „der Tag“ aufzulösen.
translation_notes:
  register: Feierlich-prophetischer, aber moderner Standardwortschatz. Die Gedankenstriche bilden die eingeschobene Häufung der Gerichtsausdrücke ab; die Satzstellung im letzten Glied bewahrt den Nachdruck auf „ihre Sünder“. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Stellen.
