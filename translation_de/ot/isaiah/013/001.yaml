source:
  edition: WLC
  text: מַשָּׂ֖א בָּבֶ֑ל אֲשֶׁ֣ר חָזָ֔ה יְשַׁעְיָ֖הוּ בֶּן אָמֽוֹץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/001.yaml
  text: The oracle concerning Babylon[a], which Isaiah son of Amoz saw.
translation:
  language: de
  text: Der Ausspruch über Babel[a], den Jesaja, der Sohn des Amoz, schaute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Last Babels« beziehungsweise »Der Ausspruch gegen Babel«. Das hebräische Wort מַשָּׂא bezeichnet als prophetische Überschrift eine gewichtige Botschaft, häufig eine Gerichtsankündigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Botschaft, häufig eine Gerichtsankündigung. »Ausspruch« ist im modernen Deutschen verständlich und wahrt den Charakter einer feierlichen Verkündigung, ohne die im Hebräischen offene Beziehung zu Babel vorschnell festzulegen.
- source_word: בָּבֶל
  choice: Babel
  rationale: »Babel« ist die etablierte deutsche biblische Namensform für die Stadt beziehungsweise das Reich Babylon.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen bezieht sich auf den maskulinen »Ausspruch« und leitet den Relativsatz ein.
- source_word: חָזָה
  choice: schaute
  rationale: Das Verb bedeutet »sehen/schauen« und wird häufig für prophetisches Schauen gebraucht. »Schaute« bewahrt die Bildlichkeit und den visionären Unterton, ohne erklärend »in einer Vision empfing« einzutragen.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Etablierte deutsche Form des Prophetennamens.
- source_word: בֶּן
  choice: Sohn des
  rationale: Entspricht der hebräischen genealogischen Bezeichnung und ist im Deutschen natürlich.
- source_word: אָמֽוֹץ
  choice: Amoz
  rationale: Etablierte deutsche Wiedergabe des Personennamens.
theological_decisions:
- issue: Wiedergabe der prophetischen Überschrift מַשָּׂא
  choice: Der Ausspruch über Babel
  alternative: Die Last Babels; der Ausspruch gegen Babel
  rationale: »Über Babel« lässt die Beziehung der Botschaft zu Babel ebenso offen wie die hebräische Genitivverbindung. »Gegen Babel« entspräche zwar dem Gerichtsinhalt des folgenden Abschnitts, würde diese Stoßrichtung aber bereits in die Überschrift eintragen. »Last« wäre formnäher, ist im heutigen Deutschen als Bezeichnung einer prophetischen Botschaft jedoch missverständlich.
translation_notes:
  register: Moderne, würdige Überschriftensprache. »Schaute« hält den prophetisch-visionären Ton fest; der Artikel und die Apposition »der Sohn des Amoz« sorgen für einen natürlichen deutschen Satzbau.
