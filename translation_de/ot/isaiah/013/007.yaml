  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֖ן כָּל יָדַ֣יִם תִּרְפֶּ֑ינָה וְ/כָל לְבַ֥ב אֱנ֖וֹשׁ יִמָּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: de
  text: Darum werden alle Hände kraftlos, und jedes Menschenherz wird zerschmelzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Herz jedes Sterblichen“. Das hebräische Wort אֱנוֹשׁ bezeichnet hier allgemein einen Menschen und kann dessen Schwäche und Vergänglichkeit mit anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung leitet die Folge aus der zuvor angekündigten Gerichtsbotschaft ab. „Darum“ gibt diesen folgernden Zusammenhang knapp und natürlich wieder.
- source_word: כָּל יָדַיִם
  choice: alle Hände
  rationale: Der kollektive Plural und das anschauliche Bild versagender menschlicher Kraft bleiben erhalten.
- source_word: תִּרְפֶּינָה
  choice: werden … kraftlos
  rationale: Das Verb רפה bezeichnet das Erschlaffen oder Schwachwerden. „Kraftlos werden“ ist in modernem Deutsch verständlich und bewahrt die körperliche Bildsprache.
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: und jedes Menschenherz
  rationale: לְבַב bezeichnet das Herz als Sitz von Mut und innerer Entschlossenheit; אֱנוֹשׁ meint den Menschen, häufig mit dem Beiklang seiner Schwäche und Vergänglichkeit. „Jedes Menschenherz“ wahrt den generischen Singular und klingt würdevoll.
- source_word: יִמָּס
  choice: wird zerschmelzen
  rationale: Das Verb bedeutet wörtlich „schmelzen“ und dient hier als Bild für zusammenbrechenden Mut. „Zerschmelzen“ erhält diese Metapher, ohne sie erklärend aufzulösen.
theological_decisions:
- issue: Generische menschliche Bezeichnung אֱנוֹשׁ
  choice: Menschenherz
  alternative: Herz eines Sterblichen; Mannesherz
  rationale: אֱנוֹשׁ ist hier allgemein menschlich und nicht spezifisch männlich; zugleich kann das Wort menschliche Schwäche oder Sterblichkeit anklingen lassen. „Menschenherz“ gibt den generischen Bezug wieder, während die mögliche Nuance in der Fußnote benannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Körper- und Schmelzmetaphorik. Die parallele Satzstruktur bleibt deutlich; die anthropologische Nuance von אֱנוֹשׁ wird nicht dogmatisch verengt.
