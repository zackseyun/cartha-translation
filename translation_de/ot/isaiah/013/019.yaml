source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
translation:
  language: de
  text: Und Babylon, die Zierde der Königreiche, die Pracht des Stolzes[a] der Chaldäer, wird es ergehen wie Sodom und Gomorra, als Gott sie umstürzte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Pracht der Hoheit der Chaldäer“. Das hebräische Wort kann hier sowohl negativ den Stolz als auch neutral die Hoheit oder Erhabenheit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird es ergehen
  rationale: Das Qal-Perfekt mit וְ hat im prophetischen Zusammenhang Zukunftsbezug. Die deutsche Wendung verbindet Babylons angekündigten Zustand natürlich mit dem folgenden Vergleich.
- source_word: בָבֶל
  choice: Babylon
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: צְבִי מַמְלָכוֹת
  choice: die Zierde der Königreiche
  rationale: צְבִי bezeichnet Schönheit, Schmuck oder Zierde. Die Constructusverbindung wird knapp und poetisch wiedergegeben.
- source_word: תִּפְאֶרֶת גְּאוֹן כַּשְׂדִּים
  choice: die Pracht des Stolzes der Chaldäer
  rationale: תִּפְאֶרֶת wird mit „Pracht“ und גְּאוֹן im Gerichtskontext mit „Stolz“ wiedergegeben. Die enge Genitivfolge bewahrt die verdichtete, mehrdeutige Bildsprache des Hebräischen.
- source_word: כַּשְׂדִּים
  choice: Chaldäer
  rationale: Der historische Volksname wird beibehalten und nicht zu „Babylonier“ verallgemeinert.
- source_word: כְּמַהְפֵּכַת אֱלֹהִים אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: wie Sodom und Gomorra, als Gott sie umstürzte
  rationale: Die Vergleichspartikel כְּ und Gottes Urheberschaft werden klar ausgedrückt. Die verbale Formulierung ist im modernen Deutschen natürlicher als „wie Gottes Umstürzung von …“ und bewahrt das Bild des Umstürzens.
theological_decisions:
- issue: Bedeutung von גְּאוֹן im Gerichtsorakel
  choice: Stolz
  alternative: Hoheit / Erhabenheit
  rationale: Im Kontext des angekündigten Gerichts kann גְּאוֹן den negativen Beiklang menschlichen Stolzes tragen. Da das Wort zugleich Hoheit oder Erhabenheit bezeichnen kann, wird die neutralere Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Verdichtung. „Zierde“ und „Pracht“ bewahren den feierlichen Ton; die Schlusswendung ist bewusst idiomatisch formuliert. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Wortgruppe.
