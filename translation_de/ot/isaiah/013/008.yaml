base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/008.yaml
  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: de
  text: Da werden sie bestürzt sein. Schmerzen und Wehen werden sie packen; sie werden sich winden wie eine Gebärende. Jeder wird seinen Nächsten anstarren; ihre Gesichter werden wie Flammen sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ihre Gesichter sind Gesichter von Flammen.“ Das Bild kann auf feuriges Aussehen oder auf den im Gesicht sichtbaren Schrecken hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: Da werden sie bestürzt sein
  rationale: Das Nifal von בהל bezeichnet plötzliches Erschrecken oder Bestürzung. „Bestürzt sein“ bewahrt die inchoative Färbung, ohne die Intensität unnötig zu steigern.
- source_word: צִירִים וַחֲבָלִים
  choice: Wehen und Schmerzen
  rationale: Beide Substantive bezeichnen heftige Schmerzen; der anschließende Vergleich mit einer Gebärenden prägt das Bild. „Wehen“ macht den Geburtsbezug sichtbar, während „Schmerzen“ die zweite Bezeichnung natürlich wiedergibt.
- source_word: יֹאחֵזוּן
  choice: werden sie packen
  rationale: אחז bedeutet ergreifen oder festhalten. „Packen“ ist im Deutschen anschaulich und idiomatisch, wenn Schmerzen einen Menschen überwältigen.
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: sie werden sich winden wie eine Gebärende
  rationale: Die Wendung beschreibt körperliche Qual nach dem Bild einer Frau bei der Geburt. „Sich winden“ gibt die intensive körperliche Reaktion wieder; „Gebärende“ ist knapp, würdig und präzise.
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: Einer wird den anderen entsetzt anstarren
  rationale: Die distributive Wendung lässt sich natürlich mit „einer … den anderen“ wiedergeben. תמה bezeichnet staunendes beziehungsweise fassungsloses Hinsehen; „entsetzt anstarren“ erschließt im Gerichtskontext die emotionale Färbung.
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: ihre Gesichter werden wie Flammen glühen
  rationale: Wörtlich lautet die ungewöhnliche Metapher etwa „Gesichter von Flammen sind ihre Gesichter“. Die Wiedergabe bewahrt das Flammenbild in verständlichem Deutsch, ohne eindeutig festzulegen, ob Röte, Hitze oder sichtbar gewordener Schrecken gemeint ist.
theological_decisions:
- issue: Bedeutung des Flammenbildes
  choice: Das Bild bleibt als Vergleich erhalten und wird nicht auf eine bestimmte körperliche oder emotionale Wirkung festgelegt.
  alternative: „Ihre Gesichter werden rot vor Angst“ beziehungsweise die streng wörtliche Form „ihre Gesichter sind Gesichter von Flammen“.
  rationale: Der hebräische Ausdruck ist bildhaft und mehrdeutig. Eine eindeutige Deutung als Röte, Blässe, Hitze oder Schrecken wäre exegetisch enger als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, eindringliche Sätze tragen den Gerichtston. „Gebärende“ ist präzise und allgemein verständlich; die ungewöhnliche Flammenmetapher wird lesbar formuliert und durch eine Fußnote transparent gemacht.
