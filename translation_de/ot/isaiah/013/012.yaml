  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: de
  text: Ich werde Sterbliche seltener machen als Feingold[a], Menschen seltener als Gold aus Ofir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde Sterbliche kostbarer machen als Feingold.“ Das hebräische Verb kann Kostbarkeit oder hohen Wert betonen; im Zusammenhang ist damit wahrscheinlich äußerste Seltenheit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: Ich mache … seltener
  rationale: Das Hifil von יקר kann ausdrücken, dass etwas kostbar oder wertvoll gemacht wird. Im Gerichtskontext liegt als Folge äußerste Seltenheit nahe; „seltener machen“ gibt den Vergleich im Deutschen natürlich wieder, ohne die Wertbedeutung zu verschweigen.
- source_word: אֱנוֹשׁ
  choice: den sterblichen Menschen
  rationale: אֱנוֹשׁ bezeichnet den Menschen häufig unter dem Gesichtspunkt seiner Schwachheit und Sterblichkeit. Die Wiedergabe bewahrt diese Nuance.
- source_word: מִפָּז
  choice: als Feingold
  rationale: פָּז bezeichnet besonders hochwertiges, geläutertes Gold; „Feingold“ ist eine prägnante und idiomatische deutsche Entsprechung.
- source_word: וְאָדָם
  choice: und die Menschheit
  rationale: אָדָם steht hier parallel zu אֱנוֹשׁ und bezeichnet die Menschen kollektiv. „Menschheit“ wahrt den generischen Sinn und lässt zugleich den Wechsel der hebräischen Begriffe erkennen.
- source_word: מִכֶּתֶם אוֹפִיר
  choice: als das Gold von Ofir
  rationale: כֶּתֶם bezeichnet kostbares, oft reines Gold; Ofir ist als Herkunft besonders hochwertigen Goldes bekannt. Die Formulierung bewahrt den geografischen Bezug.
theological_decisions:
- issue: Bedeutung von אוֹקִיר im Gerichtskontext
  choice: seltener machen
  alternative: kostbarer machen
  rationale: Der Kontext beschreibt die Verheerung durch Gottes Gericht, sodass die Menschen durch ihre geringe Zahl seltener als Gold werden. Da das Verb zugleich Wert oder Kostbarkeit bezeichnen kann, wird diese echte lexikalische Alternative in einer Fußnote erhalten.
- issue: Generische Bedeutung von אָדָם
  choice: die Menschheit
  alternative: der Mensch
  rationale: Im Parallelismus bezeichnet אָדָם die Menschen als Gesamtheit. „Die Menschheit“ gibt diesen kollektiven Sinn im modernen Deutschen klar wieder, ohne daraus eine Aussage nur über Männer zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die beiden unterschiedlichen Menschenbezeichnungen des Hebräischen bleiben erkennbar; die Ellipse im zweiten Glied wird durch die Wiederholung von „seltener“ für heutige Leser transparent gemacht.
