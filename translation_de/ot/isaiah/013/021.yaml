  text: וְ/רָבְצוּ שָׁ֣ם צִיִּ֔ים וּ/מָלְא֥וּ בָתֵּי/הֶ֖ם אֹחִ֑ים וְ/שָׁ֤כְנוּ שָׁם֙ בְּנ֣וֹת יַֽעֲנָ֔ה וּ/שְׂעִירִ֖ים יְרַקְּדוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: de
  text: Doch Wüstentiere werden dort lagern, und ihre Häuser werden voller Eulen sein[a]. Strauße werden dort wohnen, und Wildziegen werden dort tanzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes אֹחִים ist unsicher; möglich sind auch „heulende Tiere“ oder „Schakale“.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort שְׂעִירִים bezeichnet wörtlich „Haarige“ und kann Ziegen bzw. Böcke meinen; möglicherweise sind auch Bocksdämonen oder Satyrn gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: werden lagern
  rationale: רבץ bezeichnet häufig das Sich-Niederlegen oder Lagern von Tieren; „lagern“ gibt das Bild natürlich und knapp wieder.
- source_word: צִיִּים
  choice: Wüstentiere
  rationale: Der Ausdruck bezeichnet allgemein Wesen oder Tiere der Wüste, ohne eine Tierart eindeutig festzulegen.
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: ihre Häuser werden voller … sein
  rationale: Die Formulierung bewahrt den einfachen possessiven Sinn und klingt im modernen Deutsch natürlich.
- source_word: אֹחִים
  choice: Eulenvögel
  rationale: Die genaue Tierbezeichnung ist unsicher. „Eulenvögel“ folgt einer traditionellen Deutung, während die Unsicherheit in der Fußnote offengelegt wird.
- source_word: וְשָׁכְנוּ
  choice: werden wohnen
  rationale: שׁכן bedeutet an einem Ort wohnen oder sich dort niederlassen; „wohnen“ ist klar und würdig.
- source_word: בְּנוֹת יַעֲנָה
  choice: Strauße
  rationale: Die wörtliche Wendung „Töchter des Straußes“ fungiert als zoologische Bezeichnung und wird im Deutschen idiomatisch mit dem Tiernamen wiedergegeben.
- source_word: וּשְׂעִירִים
  choice: Bockswesen
  rationale: Das Wort bezeichnet wörtlich „Haarige“ beziehungsweise Böcke, kann aber auch unheimliche oder dämonische Wüstenwesen meinen. „Bockswesen“ bewahrt diese Spannung besser als eine rein zoologische oder eindeutig dämonologische Festlegung.
- source_word: יְרַקְּדוּ
  choice: werden tanzen
  rationale: רקד kann tanzen, hüpfen oder springen bedeuten; „tanzen“ erhält das lebhafte und unheimliche poetische Bild.
theological_decisions:
- issue: Ob שְׂעִירִים gewöhnliche Wildziegen oder dämonisch gedachte Wesen bezeichnet
  choice: Im Haupttext steht „Bockswesen“.
  alternative: „Wildziegen“, „Bocksdämonen“ oder „Satyrn“
  rationale: „Bockswesen“ hält die genuine Mehrdeutigkeit zwischen tierischer und mythisch-dämonischer Vorstellung offen, ohne dem Text eine festgelegte Dämonologie aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildkraft. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; unsichere Tier- und Wesenbezeichnungen werden nicht vorschnell vereindeutigt.
