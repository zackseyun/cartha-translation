id: ISA.13.5
reference: Isaiah 13:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: de
  text: 'Sie kommen aus einem fernen Land, vom äußersten Rand des Himmels[a]: Jahwe und die Waffen seines Zorns[b], um die ganze Erde zu verwüsten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom Ende des Himmels“; auch möglich: „aus den fernsten Weiten des Himmels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Werkzeuge seines Zorns“.'
    reason: lexical_alternative
  - marker: c
    text: „Die ganze Erde“ kann auch mit „das ganze Land“ wiedergegeben werden; die kosmische Sprache des Verses spricht hier eher für den umfassenderen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: Sie kommen
  rationale: Das maskuline Partizip Plural zeichnet das Kommen anschaulich als gegenwärtig bevorstehendes Geschehen; das im Deutschen nötige Pronomen wird aus dem Zusammenhang ergänzt.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: aus einem fernen Land
  rationale: אֶרֶץ bezeichnet hier im Unterschied zum abschließenden כָּל הָאָרֶץ zunächst ein Herkunftsland; מֶרְחָק hebt dessen große Entfernung hervor.
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: vom äußersten Rand des Himmels
  rationale: קָצֶה bezeichnet Ende, äußersten Rand oder Grenze. Die Formulierung gibt das kosmische Bild in natürlichem, gehobenem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: וּכְלֵי זַעְמוֹ
  choice: und die Waffen seines Zorns
  rationale: כְּלִי kann Gerät, Werkzeug oder Waffe bedeuten. Im militärischen Gerichtskontext ist „Waffen“ naheliegend; זַעַם bezeichnet heftigen, hier göttlichen Zorn.
- source_word: לְחַבֵּל
  choice: um … zu verwüsten
  rationale: Der Infinitiv mit לְ bezeichnet den Zweck. חבל meint hier vernichten, zugrunde richten oder verwüsten; „verwüsten“ passt zum Gericht über die Erde und bleibt idiomatisch.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Die kosmische Bildsprache im unmittelbaren Satz begünstigt „Erde“, ohne die engere Möglichkeit auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration bewahrt ihn als Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Reichweite des Gerichts in כָּל הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der Bezug auf den äußersten Rand des Himmels legt im Vers eine weltweite Perspektive nahe. Da אֶרֶץ dennoch auch „Land“ bedeuten kann, bleibt diese Lesart in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bewahrt die appositionelle Enthüllung der Kommenden als Jahwe und die Mittel seines Gerichts. Die Bildsprache bleibt kräftig, ohne unnötig altertümliche Wendungen.
