id: ISA.13.6
reference: Isaiah 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
translation:
  language: de
  text: Heult[a], denn der Tag Jahwes ist nahe! Er kommt wie Verwüstung vom Allmächtigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jammert laut“; der hebräische Imperativ fordert zu einem lauten Klage- oder Schreckensruf auf.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen besteht ein Klangspiel zwischen „Verwüstung“ (schod) und „der Allmächtige“ (Schaddai).
    reason: wordplay
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Heult
  rationale: Der Imperativ Plural bezeichnet einen lauten Klage- oder Schreckensruf. „Heult“ bewahrt die Eindringlichkeit des hebräischen Ausdrucks besser als das allgemeinere „Klagt“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion nennt den Grund für die Aufforderung und entspricht dem knappen prophetischen Stil.
- source_word: קָרוֹב
  choice: ist nahe
  rationale: Das prädikative Adjektiv kündigt die unmittelbar bevorstehende Nähe des Tages an; „ist nahe“ ist klar und idiomatisch.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Die feste prophetische Wendung bezeichnet Jahwes entscheidendes Eingreifen, hier im Gericht. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כְּשֹׁד
  choice: wie Verwüstung
  rationale: שֹׁד bezeichnet in diesem Gerichtskontext gewaltsame Zerstörung oder Verheerung. Die artikellose Formulierung erhält die knappe Wucht des Hebräischen.
- source_word: מִשַּׁדַּי
  choice: vom Allmächtigen
  rationale: Die Präposition מִן bezeichnet die Herkunft; שַׁדַּי wird als göttlicher Titel mit der im Deutschen geläufigen Bezeichnung „der Allmächtige“ übersetzt.
- source_word: יָבֹוא
  choice: Er kommt
  rationale: Das maskuline Singularverb kann sich grammatisch auf den ebenfalls maskulinen „Tag“ beziehen. Das deutsche Präsens gibt die prophetisch angekündigte, unmittelbar bevorstehende Zukunft natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der im Deutschen etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: שַׁדַּי ist hier ein Gottestitel. Seine Übersetzung vermittelt deutschsprachigen Lesern die traditionelle Bedeutungsrichtung, während eine Fußnote auf das im Deutschen nicht nachbildbare hebräische Klangspiel hinweist.
- issue: Bezug von יָבֹוא
  choice: 'Bezug auf den Tag Jahwes: „Er kommt“'
  alternative: 'Unpersönlich auf das angekündigte Geschehen: „Es kommt“'
  rationale: Genus und Kontext legen „der Tag“ als Rückbezug nahe. Zugleich bleibt der Vergleich mit der von Gott ausgehenden Verwüstung bestehen, ohne Tag und Verwüstung gleichzusetzen.
translation_notes:
  register: Moderner, würdevoller prophetischer Stil mit kurzer, alarmierender Satzführung. „Heult“ ist bewusst kräftig, aber allgemein verständlich. Das Ausrufezeichen bildet die Dringlichkeit ab, ohne dem Text zusätzliche Aussageinhalte hinzuzufügen.
