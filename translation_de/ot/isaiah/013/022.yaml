  text: וְ/עָנָ֤ה אִיִּים֙ בְּ/אַלְמנוֹתָ֔י/ו וְ/תַנִּ֖ים בְּ/הֵ֣יכְלֵי עֹ֑נֶג וְ/קָר֤וֹב לָ/בוֹא֙ עִתָּ֔/הּ וְ/יָמֶ֖י/הָ לֹ֥א יִמָּשֵֽׁכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: de
  text: Hyänen[a] werden in ihren Palästen[b] heulen und Schakale in ihren prunkvollen Hallen. Ihre Zeit steht kurz bevor[c], und ihre Tage werden nicht verlängert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Tierart des hebräischen Wortes אִיִּים ist unsicher; möglich sind allgemein Wildtiere oder auch Schakale.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck ist schwierig und lautet nach der masoretischen Vokalisierung wörtlich ungewöhnlich »in seinen Witwen«. Wegen der parallelen »prunkvollen Hallen« verstehen viele ihn als Bezeichnung verlassener vornehmer Gebäude oder Paläste.
    reason: textual_and_lexical_alternative
  - marker: c
    text: Babylon wird als Frau beziehungsweise als weiblich gedachte Stadt personifiziert; daher heißt es »ihre Zeit« und »ihre Tage«.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: werden … heulen
  rationale: ענה bedeutet grundsätzlich »antworten«; bei wilden Tieren in einer Verwüstungsszene bezeichnet es hier ihren weithin hörbaren Ruf. »Heulen« gibt das Bild im Deutschen natürlich wieder.
- source_word: אִיִּים
  choice: Hyänen
  rationale: Die genaue Tierart ist unsicher. »Hyänen« passt zu den aasfressenden Wildtieren in verlassenen Ruinen; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: בְּאַלְמנוֹתָיו
  choice: in ihren Palästen
  rationale: Die masoretische Form ist textlich und lexikalisch schwierig und würde wörtlich ungewöhnlich »in seinen Witwen« lauten. Der Parallelismus mit den prunkvollen Hallen legt verlassene vornehme Gebäude beziehungsweise Paläste nahe. Das feminine »ihren« bezieht sich kontextuell auf die personifizierte Stadt Babylon.
- source_word: וְתַנִּים
  choice: Schakale
  rationale: תַנִּים bezeichnet in prophetischen Verwüstungstexten am wahrscheinlichsten Schakale, nicht mythische Drachen oder Schlangen.
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: in ihren prunkvollen Hallen
  rationale: הֵיכָל bezeichnet einen großen Palast- oder Tempelbau; עֹנֶג hebt Pracht und luxuriösen Genuss hervor. »Prunkvolle Hallen« ist verständlich und bewahrt den Gegensatz zwischen früherem Glanz und kommender Verwüstung.
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: Ihre Zeit steht kurz bevor
  rationale: Die knappe deutsche Wendung gibt die Nähe des bestimmten Zeitpunkts wieder, ohne ausdrücklich zu ergänzen, worin er besteht. Das feminine Pronomen bewahrt die Personifizierung Babylons.
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: ihre Tage werden nicht verlängert
  rationale: Die Form von משך bedeutet hier »verlängert werden«. Die formnahe Wiedergabe erhält das Bild von Babylons gezählten Tagen.
