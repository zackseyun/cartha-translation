base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
translation:
  language: de
  text: Ihre Bogen[a] werden junge Männer[b] zerschmettern. Mit der Frucht des Mutterleibs haben sie kein Erbarmen; ihre Augen werden Kinder[c] nicht verschonen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder metonymisch: „Ihre Bogenschützen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Jungen“ oder „Jugendliche“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Söhne“; hier wahrscheinlich im umfassenderen Sinn von „Kinder“ beziehungsweise „Nachkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: Bogen
  rationale: Das Substantiv bezeichnet gewöhnlich die Waffen selbst. Die feminine Pluralform des Verbs stimmt mit dem femininen Plural „Bogen“ überein; eine metonymische Deutung als „Bogenschützen“ bleibt jedoch möglich.
- source_word: נְעָרִים
  choice: junge Männer
  rationale: Das Wort kann Jungen, Jugendliche oder junge Männer bezeichnen. Im Zusammenhang des Kriegsorakels gibt „junge Männer“ die Altersgruppe wieder, ohne sie auf kleine Kinder zu beschränken.
- source_word: תְּרַטַּשְׁנָה
  choice: werden … zerschmettern
  rationale: Der Piel-Stamm bezeichnet ein gewaltsames Zerschlagen oder Zerschmettern. Die Übersetzung bewahrt die Härte des hebräischen Ausdrucks.
- source_word: פְרִי בֶטֶן
  choice: Frucht des Mutterleibs
  rationale: Die feste hebräische Wendung bezeichnet Nachkommen beziehungsweise Kinder. Die bildhafte Formulierung wird im Deutschen verständlich und würdevoll beibehalten.
- source_word: יְרַחֵמוּ
  choice: haben sie kein Erbarmen
  rationale: רחם bezeichnet gefühlsmäßiges Erbarmen oder Mitgefühl. Die deutsche Wendung ist natürlich und erhält diese Bedeutung.
- source_word: בָּנִים
  choice: Kinder
  rationale: Obwohl das Wort formal „Söhne“ bedeutet, kann es Nachkommen oder Kinder allgemein bezeichnen. Der Parallelismus mit „Frucht des Mutterleibs“ unterstützt hier die umfassendere Wiedergabe.
- source_word: תָחוּס עֵינָם
  choice: ihre Augen werden … nicht verschonen
  rationale: Das Hebräische spricht idiomatisch im Singular von „ihrem Auge“. Der deutsche Plural bewahrt das anschauliche Bild eines erbarmungslosen Blicks, ohne unnatürlich zu klingen; „verschonen“ gibt חוס im Gerichtskontext treffend wieder.
