  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: de
  text: Ich selbst habe meinen Geweihten befohlen; auch habe ich meine Krieger für meinen Zorn herbeigerufen – sie, die über meine Hoheit jubeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meine stolz Jubelnden; oder: sie, die über meinen Triumph jubeln.'
    reason: Die knappe hebräische Verbindung עַלִּיזֵי גַּאֲוָתִי kann unterschiedlich verstanden werden; גַּאֲוָה kann Hoheit, Stolz oder triumphale Erhabenheit bezeichnen.
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen trägt Nachdruck; „Ich selbst“ gibt diesen im Deutschen natürlich wieder.
- source_word: צִוֵּיתִי
  choice: habe ... Befehl gegeben
  rationale: Das Piel von צוה bezeichnet hier das Befehlen beziehungsweise Beauftragen. Die Formulierung bewahrt den militärischen Zusammenhang und bleibt im Deutschen verständlich.
- source_word: לִמְקֻדָּשַׁי
  choice: meinen Geheiligten
  rationale: Das passive Partizip von קדשׁ mit Suffix bezeichnet Menschen, die für Gottes Zweck ausgesondert sind; „Geheiligte“ behauptet hier nicht notwendig moralische Heiligkeit.
- source_word: גַּם
  choice: auch
  rationale: Das Wort verbindet eine zweite göttliche Handlung mit der ersten.
- source_word: קָרָאתִי
  choice: habe ... gerufen
  rationale: קרא bedeutet „rufen“ und kann im militärischen Kontext das Zusammenrufen bezeichnen; die deutsche Wiedergabe bleibt nahe am Wortlaut.
- source_word: גִּבּוֹרַי
  choice: meine Kriegshelden
  rationale: גבור bezeichnet starke, tapfere Männer. „Kriegshelden“ verdeutlicht den militärischen Zusammenhang, ohne ihre Identität näher festzulegen.
- source_word: לְאַפִּי
  choice: damit sie meinen Zorn vollstrecken
  rationale: אַף bezeichnet idiomatisch Zorn. Die lamed-Verbindung drückt hier Zweck oder Bestimmung aus; der deutsche Zwecksatz gibt dies natürlich wieder.
- source_word: עַלִּיזֵי גַּאֲוָתִי
  choice: sie, die über meine Hoheit jubeln
  rationale: Die komprimierte Verbindung kann Jubel im Blick auf Gottes Hoheit bezeichnen. Diese Wiedergabe ist verständlich, während andere mögliche Bezüge in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Bezeichnet „meine Geheiligten“ moralisch heilige Menschen oder für das Gericht ausgesonderte Beauftragte?
  choice: Für Gottes Gerichtshandeln ausgesonderte Beauftragte
  alternative: Moralisch Heilige oder Engelwesen
  rationale: Der unmittelbare Zusammenhang schildert das Aufbieten einer Streitmacht gegen Babylon. Die Heiligung ist daher zunächst funktional zu verstehen, ohne über den moralischen Zustand der Beauftragten zu urteilen.
- issue: Wie ist עַלִּיזֵי גַּאֲוָתִי zu verstehen?
  choice: Menschen, die über Gottes Hoheit jubeln
  alternative: Gottes stolz Jubelnde oder Menschen, die über seinen Triumph jubeln
  rationale: Die hebräische Genitivverbindung ist mehrdeutig. Der Haupttext bietet eine mögliche natürliche Deutung; die Fußnote bewahrt die anderen ernst zu nehmenden Lesarten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält die nachdrückliche göttliche Selbstrede und den militärischen Ton bei. Der Gedankenstrich markiert die abschließende Apposition, ohne die syntaktische Mehrdeutigkeit vollständig aufzulösen.
