  variant: modern standard German
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: de
  text: Und ich werde die Welt für ihre Bosheit bestrafen[a] und die Frevler für ihre Schuld. Ich werde dem Hochmut der Überheblichen ein Ende machen und den Stolz der Gewalttätigen erniedrigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Welt“ kann hier genauer die bewohnte Welt, den Erdkreis, bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werde ich niedrig machen“. Das Hebräische verwendet in den beiden parallelen Aussagen zwei eng verwandte Ausdrücke für stolze Selbsterhöhung.'
    reason: lexical_and_literary_clarification
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: ich werde … bestrafen
  rationale: פָקַד mit עַל bezeichnet hier angesichts von Bosheit und Schuld ein strafendes Heimsuchen beziehungsweise Zur-Rechenschaft-Ziehen. „Bestrafen“ gibt diesen gerichtlichen Sinn in natürlichem Deutsch klar wieder.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet gewöhnlich die Welt als bewohnten Erdkreis. „Die Welt“ bewahrt den weiten Horizont des Verses, ohne ihn auf Babylon oder ein einzelnes Land einzuengen.
- source_word: רָעָה
  choice: ihre Bosheit
  rationale: Im Parallelismus mit den Frevlern und ihrer Schuld bezeichnet רָעָה moralische Bosheit, nicht Unheil. Das Possessivpronomen verdeutlicht die im Hebräischen knappe Zuordnung zur Welt.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: „Frevler“ gibt die substantivisch gebrauchte Bezeichnung für schuldhaft böse Menschen knapp und würdig wieder.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus folgende Strafe bezeichnen. „Schuld“ wahrt hier die Mehrdeutigkeit zwischen schuldhafter Tat und Schuldzustand besser als eine zu enge Festlegung auf „Sünde“.
- source_word: וְהִשְׁבַּתִּי
  choice: ich werde … ein Ende machen
  rationale: Der Hifil von שׁבת bedeutet „aufhören lassen“. Die deutsche Wendung gibt die kausative und endgültige Wirkung idiomatisch wieder.
- source_word: גְּאוֹן זֵדִים
  choice: dem Hochmut der Überheblichen
  rationale: גְּאוֹן ist hier durch זֵדִים negativ als stolze Selbsterhöhung bestimmt. „Hochmut“ und „Überhebliche“ bewahren die enge Wortfeldverbindung.
- source_word: גַאֲוַת עָרִיצִים
  choice: den Stolz der Gewalttätigen
  rationale: גַאֲוָה bezeichnet stolze Erhebung; עָרִיצִים sind gewalttätige, rücksichtslose Unterdrücker. „Gewalttätige“ hält diesen sozialen und moralischen Aspekt offen, ohne sie ausschließlich als politische Tyrannen zu bestimmen.
- source_word: אַשְׁפִּיל
  choice: erniedrigen
  rationale: Der Hifil von שׁפל bedeutet „niedrig machen“. „Erniedrigen“ bewahrt das räumliche Bild des Herabsetzens und vermeidet, dass „demütigen“ primär als innere Läuterung verstanden wird.
theological_decisions:
- issue: Reichweite des Gerichts in תֵּבֵל
  choice: „die Welt“ als bewohnte menschliche Welt
  alternative: „das Land“ oder ausschließlich Babylon
  rationale: Obwohl Jesaja 13 gegen Babylon gerichtet ist, verwendet der Vers den weiteren Ausdruck תֵּבֵל und universale moralische Kategorien. Die Übersetzung bewahrt diesen weiteren Horizont, ohne das Verhältnis zum Babylon-Orakel aufzulösen.
- issue: Bedeutung von עֲוֺנָם
  choice: „ihre Schuld“
  alternative: „ihre Sünde“ oder „die Strafe für ihre Schuld“
  rationale: Das hebräische Wort kann sowohl das schuldhafte Unrecht als auch die daraus erwachsende Schuld und bisweilen deren Folgen bezeichnen. „Schuld“ lässt diese theologisch bedeutsame Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die beiden unterschiedlichen Ausdrücke für Stolz beziehungsweise Selbsterhöhung bleiben erkennbar; unnötig altertümliche Wörter und eine konfessionelle Ausdeutung werden vermieden.
