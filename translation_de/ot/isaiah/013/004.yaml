id: ISA.13.4
reference: Isaiah 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: de
  text: Der Lärm einer Menge in den Bergen[a] – wie von einem großen Volk! Der Lärm eines Getümmels von Königreichen, von versammelten Nationen[b]! Jahwe der Heerscharen mustert ein Heer zum Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Bergen“.'
    reason: Die Präposition בְּ kann hier sowohl „in“ als auch „auf“ bezeichnen.
  - marker: b
    text: 'Oder: „von Nationen, die sich versammeln“.'
    reason: Das hebräische Nifal-Partizip kann sowohl einen versammelten Zustand als auch einen noch andauernden Sammlungsvorgang ausdrücken.
lexical_decisions:
- source_word: ק֥וֹל
  choice: Der Lärm
  rationale: קוֹל kann Stimme, Laut, Schall oder Geräusch bezeichnen. Im Zusammenhang des lärmenden militärischen Aufmarschs gibt „Lärm“ die akustische Wirkung natürlich wieder; die Wiederholung bewahrt die rhetorische Parallelität.
- source_word: הָמ֛וֹן
  choice: einer Menge
  rationale: הָמוֹן kann eine große Menschenmenge und zugleich deren lärmendes Treiben bezeichnen. „Menge“ bewahrt hier den kollektiven Sinn, während קוֹל durch „Lärm“ wiedergegeben wird.
- source_word: בֶּֽהָרִ֖ים
  choice: in den Bergen
  rationale: Die Präposition בְּ ist hier am natürlichsten lokal zu verstehen. „In den Bergen“ lässt offen, ob die Menge sich zwischen den Bergen oder allgemein im Bergland befindet.
- source_word: דְּמ֣וּת
  choice: wie von
  rationale: Das Substantiv bezeichnet eigentlich Ähnlichkeit oder Gestalt, dient hier aber einem Vergleich. „Wie von“ ergänzt im Deutschen idiomatisch den beim zweiten Glied mitgedachten Lärm.
- source_word: עַם רָ֑ב
  choice: einem großen Volk
  rationale: עַם bezeichnet ein Volk beziehungsweise eine größere Volksmenge; רַב kann Größe oder zahlreiche Menge ausdrücken. Die knappe Wiedergabe erhält den gehobenen Ton und die mögliche Doppeldeutigkeit.
- source_word: שְׁא֞וֹן
  choice: eines Getümmels
  rationale: שָׁאוֹן bezeichnet laute Unruhe, Getöse oder tumultartiges Treiben. „Getümmel“ verbindet hörbare Unruhe mit der Vorstellung zahlreicher zusammenströmender Reiche und Nationen.
- source_word: מַמְלְכ֤וֹת גּוֹיִם֙
  choice: von Königreichen, von Nationen
  rationale: Die dichte hebräische Wortfolge kann als Zuordnung oder Apposition verstanden werden. Die zweigliedrige deutsche Fassung bewahrt die Häufung politischer Kollektive, ohne sie zu einer einzigen eindeutigen Konstruktion zu verengen.
- source_word: נֶֽאֱסָפִ֔ים
  choice: die sich versammelt haben
  rationale: Das Nifal-Partizip kann einen versammelten Zustand oder einen laufenden Sammlungsvorgang ausdrücken. Der Haupttext gibt den erreichten Zustand wieder; die Fußnote bewahrt die prozessuale Möglichkeit.
- source_word: יְהוָ֣ה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָא֔וֹת
  choice: der Heerscharen
  rationale: Im festen Gottesnamen bezeichnet צְבָאוֹת umfassend geordnete Scharen beziehungsweise Heere. „Heerscharen“ bewahrt die traditionelle Weite des Titels, ohne ihn auf das unmittelbar genannte Kampfheer zu beschränken.
- source_word: מְפַקֵּ֖ד
  choice: mustert
  rationale: פקד hat ein breites Bedeutungsspektrum. Zusammen mit „Heer zum Kampf“ ist die militärische Bedeutung „mustern, zum Einsatz aufstellen“ kontextuell am stärksten.
- source_word: צְבָ֥א מִלְחָמָֽה
  choice: ein Heer zum Kampf
  rationale: Die Verbindung bezeichnet eine zum Krieg beziehungsweise Kampf bestimmte Streitmacht. „Ein Heer zum Kampf“ bleibt nah an der knappen hebräischen Formulierung und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ macht den Eigennamen sichtbar, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Reichweite des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ lässt die traditionelle, nicht abschließend festgelegte Reichweite des Titels bestehen; „Heere“ könnte ihn im unmittelbaren Kontext vorschnell ausschließlich militärisch deuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem Ausrufcharakter eines prophetischen Hörbildes. Die zweimalige Formulierung „Der Lärm“ bildet die hebräische Wiederholung von קוֹל ab. Gedankenstrich und Ausrufezeichen verdeutlichen den verdichteten, alarmierenden Rhythmus, ohne zusätzliche Aussagen einzuführen.
