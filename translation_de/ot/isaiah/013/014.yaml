  text: וְ/הָיָה֙ כִּ/צְבִ֣י מֻדָּ֔ח וּ/כְ/צֹ֖אן וְ/אֵ֣ין מְקַבֵּ֑ץ אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ אֶל אַרְצ֖/וֹ יָנֽוּסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: de
  text: 'Dann wird es sein wie eine aufgescheuchte Gazelle[a] und wie Schafe, die niemand sammelt: Jeder wird sich seinem eigenen Volk zuwenden, und jeder wird in sein eigenes Land fliehen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine fortgetriebene Gazelle“. Das hebräische Partizip kann „fortgetrieben“, „verscheucht“ oder „verjagt“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht in beiden Satzgliedern jeweils das distributiv gebrauchte Wort „Mann“: „ein Mann … und ein Mann …“, sinngemäß „jeder … und jeder …“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann wird es sein
  rationale: Die Form leitet im prophetischen Zusammenhang den daraus folgenden Zustand ein; „dann“ gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: כִּצְבִי מֻדָּח
  choice: wie mit einer aufgescheuchten Gazelle
  rationale: צְבִי bezeichnet eine Gazelle; מֻדָּח ist ein passives Partizip von נדח und beschreibt sie als fortgetrieben oder verscheucht. „Aufgescheucht“ bewahrt das Bild, ohne eine gezielte Jagd zwingend vorauszusetzen.
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: und wie mit Schafen, die niemand sammelt
  rationale: צֹאן bezeichnet Kleinvieh, hier im Bild am natürlichsten „Schafe“. Die Existenzverneinung mit Partizip besagt, dass niemand da ist, der sie sammelt.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: Jeder wird sich seinem eigenen Volk zuwenden
  rationale: אִישׁ wird distributiv gebraucht. „Jeder“ ist im Deutschen eine natürliche, formtreue Wiedergabe; פנה bezeichnet die Hinwendung zu einem Ziel.
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: und jeder wird in sein eigenes Land fliehen
  rationale: נוּס bedeutet „fliehen“, und אֶרֶץ bezeichnet hier das jeweilige Heimatland. Die Wiederholung von „jeder“ bildet die parallele hebräische Struktur ab.
theological_decisions:
- issue: Distributiver Gebrauch des maskulinen אִישׁ
  choice: „Jeder“ in beiden parallelen Satzgliedern
  alternative: „Jeder Mann“ beziehungsweise „jeder Einzelne“
  rationale: אִישׁ bezeichnet hier distributiv die Angehörigen der zuvor angesprochenen Menge. „Jeder“ bewahrt den Singular und die individuelle Aussage, ohne im Deutschen unnötig eine ausschließlich männliche Gruppe festzulegen.
- issue: Bezug der einleitenden Singularform וְהָיָה
  choice: unpersönlich „Dann wird es sein“
  alternative: personenbezogen „Dann wird er sein“
  rationale: Der weitere Vers beschreibt die zerstreute Menge mit pluralischen Verben. Die unpersönliche Wiedergabe erhält den Übergang zum resultierenden Zustand und vermeidet einen nicht eindeutig genannten singularischen Referenten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tierbilder und der parallele Satzbau bleiben deutlich; „aufgescheucht“ erhält die Bedeutungsbreite des hebräischen Partizips besser als das enger zielgerichtete „gejagt“.
