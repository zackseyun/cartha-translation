id: ISA.13.20
reference: Isaiah 13:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: de
  text: Sie wird niemals bewohnt sein und von Generation zu Generation unbesiedelt bleiben. Kein Araber[a] wird dort sein Zelt aufschlagen, und Hirten werden dort ihre Herden nicht lagern lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Wüstennomade“. Das hebräische Wort kann einen Araber im engeren Sinn oder in diesem Zusammenhang allgemeiner einen nomadischen Wüstenbewohner bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: wird … bewohnt sein
  rationale: יָשַׁב bedeutet grundsätzlich „sitzen/wohnen“; bei einer Stadt als Subjekt bezeichnet die Form idiomatisch das Bewohntsein.
- source_word: לָנֶצַח
  choice: niemals
  rationale: Unter der Verneinung gibt „niemals“ die Bedeutung „für immer nicht“ natürlich und nachdrücklich wieder.
- source_word: תִשְׁכֹּן
  choice: unbesiedelt bleiben
  rationale: שָׁכַן bezeichnet das Wohnen oder Sich-Niederlassen. Die Wiedergabe wahrt den Bezug auf die Stadt und vermeidet eine schwerfällige unmittelbare Wiederholung von „bewohnt“.
- source_word: עַד דּוֹר וָדוֹר
  choice: von Generation zu Generation
  rationale: Die feste Wendung bezeichnet eine über alle aufeinanderfolgenden Generationen fortdauernde Lage.
- source_word: יַהֵל
  choice: sein Zelt aufschlagen
  rationale: Die Piel-Form von אהל bezeichnet das Zelten oder Lagern; die konkrete Formulierung erhält das Nomadenbild.
- source_word: עֲרָבִי
  choice: Araber
  rationale: Das Substantiv bezeichnet gewöhnlich einen Araber beziehungsweise Bewohner Arabiens; der im Kontext mögliche weitere Sinn eines Wüstennomaden wird in der Fußnote festgehalten.
- source_word: רֹעִים
  choice: Hirten
  rationale: Das Partizip von רעה bezeichnet Menschen, die Herden weiden und hüten.
- source_word: יַרְבִּצוּ
  choice: werden … ihre Herden nicht lagern lassen
  rationale: 'Die Hifil-Form ist kausativ: Die Hirten lassen Tiere sich lagern. Das im Hebräischen unausgesprochene Objekt wird aus dem Hirtenkontext als „ihre Herden“ ergänzt.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden nahezu parallelen Verben für Wohnen und Sich-Niederlassen werden im Deutschen durch „bewohnt sein“ und „unbesiedelt bleiben“ unterschieden; die dauerhafte Verödung bleibt dabei erhalten.
