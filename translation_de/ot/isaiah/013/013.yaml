revisions:
- from: Darum lasse ich den Himmel erbeben, und die Erde wird von ihrer Stelle gerückt werden — beim Grimm Jahwes, des Herrn der Heerscharen,[a] am Tag seines glühenden Zorns.
  to: Darum werde ich den Himmel erbeben lassen, und die Erde wird von ihrer Stelle beben — durch den Grimm Jahwes der Heerscharen, am Tag seines glühenden Zorns.
  rationale: Die Revision ersetzt das sachlich zu starke und grammatisch abweichende Passiv bei der Erde durch ein aktives Beben und stellt den Gottesnamen mit seinem Titel als unmittelbare Genitivverbindung dar. Die Fußnotenmarkierung bleibt am Titel erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:13:22Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von עַל־כֵּן, der kausativen Form „ich werde den Himmel erbeben lassen“, des Gottesnamens und der Zornesmetaphorik ist grundsätzlich zutreffend. Die Formulierung „die Erde wird von ihrer Stelle gerückt werden“ gibt jedoch nicht das aktive Qal „sie wird erbeben/erschüttert werden“ wieder, sondern führt eine nicht im Hebräischen ausgedrückte passive Verursachung und tatsächliche Versetzung ein.
  naturalness: Der Satz ist insgesamt würdig und verständlich. „Jahwes, des Herrn der Heerscharen“ ist jedoch als Apposition weniger natürlich und verschiebt den Titel in Richtung „Jahwe, der Herr ...“. „Jahwe der Heerscharen“ bildet die hebräische Genitivverbindung unmittelbar und idiomatisch ab.
  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. „Heerscharen“ ist für צבאות möglich, doch sollte es direkt als Bestandteil des Titels stehen. „Glühender Zorn“ bewahrt die Bildlichkeit von חרון אף.
  issues:
  - severity: medium
    issue: Die Erde wird „von ihrer Stelle gerückt werden“.
    rationale: וְתִרְעַשׁ steht im Qal und beschreibt das Beben der Erde. Das deutsche Passiv „wird ... gerückt werden“ fügt einen externen Akteur und eine vollzogene Verlagerung hinzu. „Von ihrer Stelle beben“ bewahrt sowohl das Verb als auch die präpositionale Ortsangabe.
  - severity: low
    issue: „Jahwes, des Herrn der Heerscharen“
    rationale: Der hebräische Titel יהוה צבאות lautet direkt „Jahwe der Heerscharen“. Die Apposition „des Herrn“ ist nicht erforderlich und macht die Konstruktion im Deutschen unnötig schwerfällig.
  revised_text: Darum werde ich den Himmel erbeben lassen, und die Erde wird von ihrer Stelle beben — durch den Grimm Jahwes der Heerscharen, am Tag seines glühenden Zorns.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“. Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ersetzt das sachlich zu starke und grammatisch abweichende Passiv bei der Erde durch ein aktives Beben und stellt den Gottesnamen mit seinem Titel als unmittelbare Genitivverbindung dar. Die Fußnotenmarkierung bleibt am Titel erhalten.
