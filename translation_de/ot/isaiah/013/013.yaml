source:
  edition: WLC
  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: de
  text: Darum werde ich den Himmel erbeben lassen, und die Erde wird von ihrer Stelle beben — durch den Grimm Jahwes der Heerscharen, am Tag seines glühenden Zorns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt den folgernden Anschluss knapp und natürlich wieder.
- source_word: שָׁמַיִם אַרְגִּיז
  choice: lasse ich den Himmel erbeben
  rationale: Die Kausativform von רגז wird mit „lasse … erbeben“ ausgedrückt; „Himmel“ ist im Deutschen die natürliche kollektive Wiedergabe des hebräischen Plurals.
- source_word: וְתִרְעַשׁ הָאָרֶץ מִמְּקוֹמָהּ
  choice: und die Erde wird von ihrer Stelle gerückt werden
  rationale: רעש bezeichnet heftiges Erschüttern; zusammen mit „von ihrer Stelle“ macht die passive Form die daraus folgende Verlagerung deutlich und erhält den kosmischen Parallelismus.
- source_word: בְּעֶבְרַת
  choice: beim Grimm
  rationale: עֶבְרָה bezeichnet heftigen, überströmenden Zorn; „Grimm“ wahrt den gehobenen prophetischen Ton.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwes, des Herrn der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Herr der Heerscharen“ ist eine verständliche, im Deutschen etablierte Wiedergabe des Titels und lässt dessen umfassenden militärisch-himmlischen Bezug offen.
- source_word: וּבְיוֹם חֲרוֹן אַפּוֹ
  choice: am Tag seines glühenden Zorns
  rationale: „Am Tag“ entspricht natürlichem Deutsch; „glühender Zorn“ bewahrt die im Hebräischen enthaltene Hitze-Metaphorik.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name kenntlich gemacht, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: Herr der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ wahrt die mögliche Breite des Ausdrucks für irdische oder himmlische Heere; die Fußnote nennt die unmittelbarere moderne Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-kosmischem Klang. Die Parallelität von Himmel und Erde sowie die Zornesmetaphorik bleiben erhalten; unnötige konfessionelle Festlegungen werden vermieden.
