  text: וַ/יְשַׂגֵּ֧ב יְהוָ֛ה אֶת צָרֵ֥י רְצִ֖ין עָלָ֑י/ו וְ/אֶת אֹיְבָ֖י/ו יְסַכְסֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
translation:
  language: de
  text: Da machte Jahwe die Gegner Rezins gegen ihn stark[a] und stachelte seine Feinde auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erhöhte“ oder „verschaffte den Gegnern Rezins Überlegenheit“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen singularische Pronomen („gegen ihn … seine Feinde“). Im weiteren Zusammenhang ist das Nordreich beziehungsweise Efraim das Ziel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: ließ … erstarken
  rationale: Der Hifil von שׂגב kann bedeuten, jemanden stark zu machen, zu erhöhen oder in eine überlegene Stellung zu bringen. Im Gerichtszusammenhang gibt „ließ … erstarken“ die kausative Bedeutung natürlich wieder, ohne eine ehrende Erhöhung anzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: צָרֵי רְצִין
  choice: die Gegner Rezins
  rationale: Die Status-constructus-Verbindung bezeichnet diejenigen, die Rezin feindlich gegenüberstehen. „Gegner“ bewahrt den Sinn und vermeidet eine unmittelbare Wiederholung von „Feinde“.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: עַל hat bei feindlichem Vorgehen die Bedeutung „gegen“. Das maskuline Singularsuffix bleibt entsprechend dem Hebräischen erhalten.
- source_word: אֹיְבָיו
  choice: seine Feinde
  rationale: Dies ist eine direkte und natürliche Wiedergabe des Nomens mit maskulinem Singularsuffix.
- source_word: יְסַכְסֵךְ
  choice: stachelte … auf
  rationale: סכסך bezeichnet hier das Anreizen oder Aufwiegeln zu feindlichem Handeln. „Aufstacheln“ gibt diese aktive Veranlassung im heutigen Deutsch klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transkription bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der singularischen Pronomen
  choice: „gegen ihn“ und „seine Feinde“ bleiben singularisch und ohne ausdrückliche Identifizierung
  alternative: „gegen Israel“ oder „gegen Efraim“
  rationale: Der hebräische Vers enthält maskuline Singularsuffixe, nennt ihren Bezug an dieser Stelle aber nicht ausdrücklich. Der Zusammenhang weist auf das Nordreich beziehungsweise Efraim, doch diese Deutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da ließ“ führt die hebräische Erzählfolge flüssig fort. Die parallelen feindlichen Bezeichnungen und die im Ausgangstext vorhandene Unbestimmtheit des Pronomenbezugs bleiben erhalten.
