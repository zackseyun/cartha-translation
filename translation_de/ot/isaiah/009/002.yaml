source:
  edition: WLC
  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: de
  text: Du hast das Volk zahlreich gemacht; du hast die Freude nicht vermehrt.[a] Sie freuen sich vor dir, wie man sich über die Ernte freut, wie man jubelt, wenn man Beute verteilt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige alte Übersetzungen und viele moderne Bibelübersetzungen lesen: „Du hast seine Freude vermehrt.“ Dies setzt eine hebräische Lesart wie לוֹ („ihm“) statt לֹא („nicht“) voraus.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Sie freuen sich vor dir wie bei der Erntefreude, wie Menschen jubeln, wenn sie Beute verteilen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ הַגּוֹי
  choice: Du hast das Volk zahlreich gemacht
  rationale: Das Hifil von רבה bezeichnet hier das Vermehren beziehungsweise Zahlreichmachen. „Das Volk“ gibt den singularischen Kollektivbegriff גּוֹי im Kontext natürlich wieder.
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: du hast die Freude nicht vermehrt
  rationale: Die Übersetzung folgt dem masoretischen לֹא („nicht“) und bewahrt damit die schwierige Spannung des überlieferten Textes, ohne ihn stillschweigend zu glätten.
- source_word: שָׂמְחוּ לְפָנֶיךָ
  choice: Sie freuen sich vor dir
  rationale: Das Perfekt wird im lebendigen prophetischen Zusammenhang präsentisch wiedergegeben. „Vor dir“ wahrt den Bezug auf Gottes Gegenwart.
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: wie bei der Freude über die Ernte
  rationale: Die Formulierung erhält das Substantiv „Freude“ und macht zugleich deutlich, dass die eingebrachte Ernte Anlass der Freude ist.
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: wie Menschen jubeln
  rationale: גיל bezeichnet ausgelassenes, starkes Freuen. „Jubeln“ gibt diese Intensität in natürlichem Deutsch wieder; „Menschen“ versteht den maskulinen Plural generisch.
- source_word: בְּחַלְּקָם שָׁלָל
  choice: wenn sie Beute verteilen
  rationale: Die Wendung beschreibt die Verteilung erbeuteter Güter nach einem Sieg. „Beute“ bewahrt das kriegerische Bild und ist allgemein verständlich.
theological_decisions:
- issue: Textvariante לֹא („nicht“) gegenüber לוֹ („ihm/ihm zu“, sinngemäß „seine Freude“)
  choice: 'Der Haupttext folgt dem masoretischen Text: „du hast die Freude nicht vermehrt“.'
  alternative: „du hast seine Freude vermehrt“
  rationale: Die vorgegebene hebräische Quelle liest eindeutig לֹא. Obwohl alte Übersetzungen und zahlreiche moderne Übertragungen eine Lesart wie לוֹ voraussetzen, darf die schwierige Aussage nicht stillschweigend emendiert werden; die bedeutsame Variante wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche negative Aussage des masoretischen Textes bleibt im Haupttext erhalten; die Satzbilder von Erntefreude und Beuteverteilung werden klar und ohne konfessionelle Deutung wiedergegeben.
