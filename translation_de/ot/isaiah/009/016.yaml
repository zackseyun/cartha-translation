  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: de
  text: Darum freut sich der Herr nicht über ihre jungen Männer, und mit ihren Vaterlosen und Witwen hat er kein Erbarmen. Denn sie alle sind gottlos und tun Böses, und jeder Mund redet Schändliches.[a] Trotz alledem hat sich sein Zorn nicht abgewandt; noch immer ist seine Hand ausgestreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und jeder Mund redet schändliche Torheit«; das hebräische Wort kann törichtes, schändliches oder niederträchtiges Reden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gerichtswort knapp und natürlich wieder.
- source_word: בַּחוּרָיו
  choice: ihre jungen Männer
  rationale: בָּחוּר bezeichnet hier junge Männer in der Blüte ihrer Kraft. Der hebräische Singularsuffix bezieht sich kollektiv auf das Volk; im Deutschen ist daher der Pluralpossessiv natürlich.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die Form fungiert im prophetischen Sprachgebrauch als Gottesbezeichnung; »der Herr« ist die idiomatische deutsche Wiedergabe.
- source_word: יְתֹמָיו וְאֶת אַלְמְנֹתָיו
  choice: ihren Waisen und Witwen
  rationale: Bewahrt die sozial schutzbedürftigen Gruppen des Ausgangstextes; »Waisen« ist im heutigen Deutsch natürlicher als »Vaterlose«, ohne den Sinn wesentlich zu verengen.
- source_word: לֹא יְרַחֵם
  choice: hat er kein Erbarmen
  rationale: Gibt die mitfühlende Barmherzigkeit von רחם in einer würdigen und geläufigen deutschen Wendung wieder.
- source_word: כֻלּוֹ חָנֵף וּמֵרַע
  choice: sie alle sind gottlos und tun Böses
  rationale: חָנֵף bezeichnet hier religiös-moralische Verderbtheit; מֵרַע charakterisiert Menschen durch ihr böses Handeln. Die verbale Wiedergabe ist natürlich und bewahrt beide Aspekte.
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: jeder Mund redet Schändliches
  rationale: Behält das konkrete Bild »jeder Mund« bei. נְבָלָה kann Torheit, Schändlichkeit oder Niederträchtigkeit bezeichnen; »Schändliches« trägt hier die moralische Schwere besser als bloßes »Torheit«.
- source_word: בְּכָל זֹאת לֹא שָׁב אַפּוֹ
  choice: Trotz alledem hat sich sein Zorn nicht abgewandt
  rationale: Die wiederkehrende Jesaja-Formel wird idiomatisch wiedergegeben; אַף ist als »Zorn« und שׁוב als nicht erfolgte Abwendung verstanden.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: noch immer ist seine Hand ausgestreckt
  rationale: Bewahrt das eindringliche Bild der weiterhin zum Gericht ausgestreckten Hand.
theological_decisions:
- issue: Gottesbezeichnung אֲדֹנָי
  choice: der Herr
  alternative: mein Herr
  rationale: Im Kontext ist אֲדֹנָי ein feststehender göttlicher Titel, keine persönliche Besitzangabe.
- issue: Singularische Possessivsuffixe bei jungen Männern, Waisen und Witwen
  choice: ihre … ihren
  alternative: seine … seinen
  rationale: Der grammatisch singularische Bezug gilt dem Volk als Kollektiv. Der deutsche Plural macht diesen Bezug verständlich, ohne einen einzelnen männlichen Besitzer nahezulegen.
- issue: Bedeutungsbreite von נְבָלָה
  choice: Schändliches
  alternative: Torheit; schändliche Torheit
  rationale: Das Wort verbindet moralische Verwerflichkeit mit töricht-gottwidrigem Reden. Die Hauptfassung betont die Schändlichkeit; die Fußnote bewahrt die weitere Bedeutungsbreite.
- issue: Ausgestreckte Hand
  choice: Bild unverändert beibehalten
  alternative: seine Hand bleibt zum Gericht erhoben
  rationale: Der Ausgangstext nennt das Gericht nicht ausdrücklich im letzten Satz. Die wörtliche Bildsprache bewahrt diese implizite Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Gerichtssprache. Der Parallelismus und die wiederkehrende Schlussformel bleiben erkennbar; unnötig altertümliche Wörter werden vermieden.
