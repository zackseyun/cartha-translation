id: ISA.9.5
reference: Isaiah 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: de
  text: 'Denn uns ist ein Kind geboren[a], uns ist ein Sohn gegeben, und die Herrschaft ruht auf seiner Schulter; und sein Name wird genannt: Wunderbarer Ratgeber, mächtiger Gott, Vater der Ewigkeit[b], Fürst des Friedens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, traditionell zukunftsbezogen im prophetischen Zusammenhang: „Denn uns wird ein Kind geboren, uns wird ein Sohn gegeben; die Herrschaft wird auf seiner Schulter liegen, und sein Name wird genannt werden …“'
    reason: alternative_reading
  - marker: b
    text: „Vater der Ewigkeit“ gibt die hebräische Wortverbindung wörtlich wieder; traditionell wird auch „Ewiger Vater“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor verkündete Hoffnung ein und bewahrt die erklärende bzw. kausale Funktion.
- source_word: יֶלֶד
  choice: Kind
  rationale: Gibt die allgemeine Bezeichnung für ein junges Kind natürlich und präzise wieder.
- source_word: יֻלַּד לָנוּ
  choice: uns ist ... geboren
  rationale: Bewahrt die passive Form und den vollendeten Charakter der hebräischen Aussage; zugleich entspricht die Formulierung dem gehobenen deutschen Bibelstil.
- source_word: בֵּן נִתַּן לָנוּ
  choice: uns ist ein Sohn gegeben
  rationale: Gibt Geschlecht, Passiv und Parallelismus genau wieder, ohne den im Hebräischen ungenannten Geber ausdrücklich einzusetzen.
- source_word: הַמִּשְׂרָה
  choice: die Herrschaft
  rationale: Bezeichnet königliche Regierungsgewalt; „Herrschaft“ ist im Deutschen natürlicher und weniger institutionell als „Regierung“.
- source_word: וַתְּהִי ... עַל שִׁכְמוֹ
  choice: ruht auf seiner Schulter
  rationale: Bewahrt das Schulterbild und drückt idiomatisch aus, dass er die königliche Herrschaft trägt; die zeitliche Einordnung bleibt im prophetischen Zusammenhang offen.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: sein Name wird genannt
  rationale: Die unbestimmte Benennungsformel wird ohne Festlegung eines ausdrücklich handelnden Subjekts wiedergegeben.
- source_word: פֶּלֶא יוֹעֵץ
  choice: Wunderbarer Ratgeber
  rationale: Versteht die Wörter als zusammengehörigen königlichen Titel und bewahrt sowohl das Außergewöhnliche als auch die beratende Funktion.
- source_word: אֵל גִּבּוֹר
  choice: mächtiger Gott
  rationale: Gibt die starke göttliche Bedeutung der Wortverbindung direkt wieder, wie sie auch sonst bei Jesaja begegnet.
- source_word: אֲבִי עַד
  choice: Vater der Ewigkeit
  rationale: Bildet die hebräische Genitivverbindung möglichst transparent ab und vermeidet es, sie vorschnell nur als Eigenschaft „ewiger Vater“ aufzulösen.
- source_word: שַׂר שָׁלוֹם
  choice: Fürst des Friedens
  rationale: Gibt den königlichen Titel prägnant wieder; „Frieden“ lässt die umfassende Bedeutung von שָׁלוֹם im Kontext anklingen.
theological_decisions:
- issue: Zuordnung und Aussagekraft der Thronnamen
  choice: 'Die gesamte Reihe wird als Titel des Kindes verstanden: „Wunderbarer Ratgeber, mächtiger Gott, Vater der Ewigkeit, Fürst des Friedens“.'
  alternative: Einzelne Bestandteile könnten auf Gott als den Benennenden bezogen oder אֵל גִּבּוֹר abgeschwächt als „göttlicher Held“ wiedergegeben werden.
  rationale: Die Benennungsformel legt syntaktisch am nächsten, die Folge als Namen bzw. Titel des Kindes zu lesen. Die starke göttliche Aussage wird weder abgeschwächt noch durch eine konfessionell geprägte Erklärung erweitert.
- issue: Zeitliche Wiedergabe der prophetischen Aussage
  choice: Die Geburt und Gabe werden als vollendete Aussagen formuliert; „ruht“ und „wird genannt“ geben den resultativen bzw. offenen prophetischen Bezug idiomatisch wieder.
  alternative: Durchgehend vergangenheitsbezogene Formen oder eine ausdrücklich zukünftige Wiedergabe wie „wird geboren werden“ und „wird heißen“.
  rationale: Die hebräische Formenfolge erlaubt im prophetischen Zusammenhang unterschiedliche zeitliche Perspektiven. Der Haupttext bewahrt die vollendete Gewissheit, während die Fußnote die traditionelle zukunftsbezogene Lesart festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Klangfarbe. Der Parallelismus und das Schulterbild bleiben erhalten; die Titel werden ohne erklärende Zusätze wiedergegeben.
