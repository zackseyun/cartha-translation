  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: de
  text: Die Herrschaft wird immer größer werden, und der Frieden wird kein Ende haben. Auf dem Thron Davids und über seinem Königreich wird es von nun an bis in Ewigkeit durch Recht und Gerechtigkeit gefestigt und gestützt werden. Der Eifer Jahwes der Heerscharen[a] wird dies vollbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der HERR der Heerscharen“.'
    reason: Traditionelle Wiedergabe des Gottesnamens יהוה und des Titels צבאות.
lexical_decisions:
- source_word: למרבה המשרה
  choice: Die Herrschaft wird immer größer werden
  rationale: למרבה bezeichnet die Zunahme beziehungsweise Ausweitung der königlichen Herrschaft. Die verbale Wiedergabe ist im modernen Deutschen natürlich und bewahrt den Gedanken fortschreitender Ausbreitung.
- source_word: ולשלום אין קץ
  choice: und der Frieden wird kein Ende haben
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und heilvolle Ganzheit; „Frieden“ ist hier die knappe, kontextgerechte Wiedergabe. Die Zukunftsform entspricht dem prophetischen Zusammenhang.
- source_word: על כסא דוד ועל ממלכתו
  choice: Auf dem Thron Davids und über seinem Königreich
  rationale: Die dynastische Bildsprache und der Bezug auf Davids Königtum bleiben ohne zusätzliche christologische Deutung erhalten.
- source_word: להכין אתה ולסעדה
  choice: wird er es fest gründen und … stützen
  rationale: כון im Hifil bezeichnet das feste Aufrichten oder Gründen, סעד das Stützen und Erhalten. Das Pronomen „es“ bezieht sich im Deutschen auf das Königreich.
- source_word: במשפט ובצדקה
  choice: durch Recht und Gerechtigkeit
  rationale: 'Die beiden verwandten Begriffe bleiben unterschieden: מִשְׁפָּט bezeichnet hier die gerechte Rechtsordnung beziehungsweise Rechtsprechung, צְדָקָה rechtschaffenes und gemeinschaftstreues Handeln.'
- source_word: מעתה ועד עולם
  choice: von nun an bis in Ewigkeit
  rationale: Die Formulierung gibt den Beginn in der Gegenwartsperspektive der Verheißung und ihre unbegrenzte Dauer wieder.
- source_word: קנאת
  choice: Der Eifer
  rationale: קִנְאָה bezeichnet hier Jahwes leidenschaftlichen, entschlossenen Einsatz für die Erfüllung seiner Zusage, nicht kleinliche Eifersucht.
- source_word: יהוה צבאות
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben. „Heerscharen“ bewahrt die umfassende königliche und militärische Bildwelt von צְבָאוֹת.
- source_word: תעשה זאת
  choice: wird dies vollbringen
  rationale: „Vollbringen“ gibt in diesem Verheißungszusammenhang das wirksame Handeln stärker und natürlicher wieder als das wörtliche „tun“.
theological_decisions:
- issue: Davidisch-messianische Tragweite der Verheißung
  choice: Die davidische Thron- und Königreichssprache sowie die ewige Dauer werden unmittelbar wiedergegeben, ohne den verheißenen Herrscher im Vers ausdrücklich christologisch zu identifizieren.
  alternative: Eine spätere christologische Identifikation ausdrücklich in den Übersetzungstext aufnehmen.
  rationale: Der hebräische Wortlaut trägt eine davidisch-messianische Perspektive, formuliert an dieser Stelle aber keine spätere lehrmäßige Identifikation. Diese Spannung soll erhalten bleiben.
- issue: Wiedergabe des Gottesnamens und des Titels יהוה צבאות
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen
  rationale: „Jahwe“ gibt den Eigennamen wieder; die traditionelle Ersatzlesung wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem knappen hebräischen Nominalsatz leicht entfaltet, damit der Zusammenhang verständlich bleibt. „Recht und Gerechtigkeit“ bewahrt die begriffliche Paarung; „Heerscharen“ erhält die traditionelle biblische Bildsprache.
