  naturalness: Die Sprache ist insgesamt modernes, würdevolles Standarddeutsch. „fest gründen“ ist jedoch weniger idiomatisch als „festigen“. Eine passive Formulierung erlaubt zudem ein flüssiges Deutsch, ohne einen im Einzelsatz nicht genannten Handelnden einzutragen.
  terminology: „Herrschaft“, „Frieden“, „Recht und Gerechtigkeit“, „Jahwe der Heerscharen“ und „Eifer“ sind sachgerecht. Die Fußnote bietet die traditionelle Ersatzwiedergabe angemessen an.
