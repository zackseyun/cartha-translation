revisions:
- from: Die Herrschaft wird immer größer werden, und der Frieden wird kein Ende haben. Auf dem Thron Davids und über seinem Königreich wird er es fest gründen und durch Recht und Gerechtigkeit stützen, von nun an bis in Ewigkeit. Der Eifer Jahwes der Heerscharen[a] wird dies vollbringen.
  to: Die Herrschaft wird immer größer werden, und der Frieden wird kein Ende haben. Auf dem Thron Davids und über seinem Königreich wird es von nun an bis in Ewigkeit durch Recht und Gerechtigkeit gefestigt und gestützt werden. Der Eifer Jahwes der Heerscharen[a] wird dies vollbringen.
