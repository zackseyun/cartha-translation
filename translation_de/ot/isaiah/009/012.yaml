  text: וְ/הָ/עָ֥ם לֹא שָׁ֖ב עַד הַ/מַּכֵּ֑/הוּ וְ/אֶת יְהוָ֥ה צְבָא֖וֹת לֹ֥א דָרָֽשׁוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: de
  text: Doch das Volk kehrte nicht zu dem zurück, der es schlug, und nach Jahwe der Heerscharen[a] suchten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“; traditionell: „der HERR der Heerscharen“.'
    reason: lexikalische und traditionelle Übersetzungsalternative
lexical_decisions:
- source_word: וְהָעָם
  choice: Doch das Volk
  rationale: Das וְ hat im Zusammenhang nach dem ergangenen Gericht eine gegensätzliche Bedeutung; „doch“ gibt diesen Kontrast natürlich wieder.
- source_word: לֹא שָׁב
  choice: kehrte nicht … zurück
  rationale: שׁוב bedeutet hier „umkehren/zurückkehren“. „Zurückkehren“ bewahrt die relationale Aussage, ohne sie ausdrücklich auf innere Reue einzuengen.
- source_word: עַד הַמַּכֵּהוּ
  choice: zu dem …, der es schlug
  rationale: Die Wendung bezeichnet die Person, die das Volk schlug. Das singularische Pronomen „es“ entspricht dem Kollektivsingular „das Volk“ und der hebräischen Suffixform.
- source_word: וְאֶת
  choice: und nach … nicht
  rationale: Die zweite mit וְ verbundene Negation wird im Deutschen idiomatisch durch eine koordinierte Satzfolge mit abschließendem „nicht“ wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den göttlichen Eigennamen wieder. „Heerscharen“ ist die im Deutschen verständliche und traditionsreiche Wiedergabe von צְבָאוֹת und bezeichnet geordnete himmlische oder kriegerische Mächte.
- source_word: לֹא דָרָשׁוּ
  choice: suchten sie nicht
  rationale: דרשׁ bezeichnet hier das Suchen nach Gott, einschließlich der Hinwendung zu ihm um Hilfe oder Weisung; „suchen“ hält dieses Bedeutungsspektrum offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt den Charakter als Eigenname, während „der HERR“ die traditionelle Ersatzlesung wäre.
- issue: Wiedergabe von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ bewahrt die Breite und den feierlichen Charakter des Titels; „Heere“ wäre gegenwärtiger, könnte die Bedeutung aber stärker auf menschliche Streitkräfte verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „nach Jahwe der Heerscharen“ erhält die rhetorische Parallelität und Betonung des hebräischen Satzes. Der Kollektivsingular „das Volk … es“ folgt der Form des Ausgangstextes; das anschließende „sie“ ist im Deutschen bei einem Kollektiv als sinngemäße Aufnahme möglich.
