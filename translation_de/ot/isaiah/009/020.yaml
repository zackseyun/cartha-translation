base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: de
  text: Manasse verschlingt Ephraim[a] und Ephraim Manasse; gemeinsam sind sie gegen Juda. Bei alledem hat sich sein Zorn nicht abgewandt, und seine Hand ist noch ausgestreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Manasse Ephraim und Ephraim Manasse.“ Im Hebräischen steht jeweils ein Akkusativmarker, aber kein Verb; „verschlingt“ ist aus dem Bild des vorhergehenden Verses ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der herkömmliche deutsche Name des Stammes wird verwendet.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der herkömmliche deutsche Name des Stammes wird verwendet.
- source_word: מְנַשֶּׁה אֶת אֶפְרַיִם וְאֶפְרַיִם אֶת מְנַשֶּׁה
  choice: Manasse verschlingt Ephraim und Ephraim Manasse
  rationale: Im Hebräischen fehlt das Verb. „Verschlingt“ wird aus dem Bild des gegenseitigen Fressens im vorhergehenden Vers ergänzt; die Auslassung des Verbs im zweiten Teilsatz bleibt im Deutschen erhalten.
- source_word: יַחְדָּו הֵמָּה עַל יְהוּדָה
  choice: gemeinsam wenden sie sich gegen Juda
  rationale: „Gemeinsam“ gibt יַחְדָּו natürlich wieder; עַל hat im feindseligen Zusammenhang die Bedeutung „gegen“. Das Verb „wenden sich“ wird für einen idiomatischen deutschen Satz ergänzt.
- source_word: בְּכָל זֹאת
  choice: Bei alledem
  rationale: Die knappe feste Wendung bewahrt den Zusammenhang des wiederkehrenden Gerichtsrefrains, ohne ein stärkeres kausales oder konzessives Verhältnis festzulegen.
- source_word: לֹא שָׁב אַפּוֹ
  choice: hat sich sein Zorn nicht abgewandt
  rationale: אַף bezeichnet idiomatisch den Zorn; שׁוב wird hier als Abwendung wiedergegeben. Das Perfekt bezeichnet den bis jetzt fortbestehenden Zustand.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: und seine Hand ist noch ausgestreckt
  rationale: Die konkrete Bildsprache der weiterhin zum Gericht ausgestreckten Hand bleibt erhalten; „noch“ drückt die Fortdauer aus.
theological_decisions:
- issue: Bezug von „sein Zorn“ und „seine Hand“
  choice: Die Pronomen bleiben im Haupttext unausgedeutet.
  alternative: „Gottes Zorn“ beziehungsweise „Gottes Hand“ ausdrücklich einsetzen.
  rationale: Der literarische Zusammenhang weist auf Gott als Bezug hin. Die prononominale Form des Hebräischen bewahrt jedoch den Refrain und soll nicht unnötig expliziert werden.
- issue: Das im ersten Satz fehlende Verb
  choice: „verschlingt“ wird aus dem Bild des vorhergehenden Verses ergänzt und in einer Fußnote kenntlich gemacht.
  alternative: Eine neutralere Ergänzung wie „ist gegen“ oder eine stark elliptische deutsche Form verwenden.
  rationale: Der direkte Objektmarker אֶת spricht für ein transitives, ausgelassenes Verb; das Motiv des Fressens im unmittelbaren Kontext legt „verschlingen“ nahe, ohne die Ellipse zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und der wiederkehrende Gerichtsrefrain werden bewahrt; notwendige Verbergänzungen sorgen für natürliche Verständlichkeit und werden bei der bedeutungstragenden Ellipse offengelegt.
