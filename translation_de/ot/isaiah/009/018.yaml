  source_fidelity: Die Übersetzung gibt den instrumentalen Sinn von בְּעֶבְרַת, den Gottesnamen, die umstrittene Verbform נֶעְתַּם samt Fußnotenhinweis, die Feuer-Metaphorik und das distributive „niemand verschont seinen Bruder“ sachgerecht wieder. Die Formulierung „Jahwes der Heerscharen“ ist jedoch syntaktisch mehrdeutig und kann den Eindruck erwecken, die Heerscharen seien ein Genitivattribut zu Jahwe statt Teil des Gottesprädikats.
