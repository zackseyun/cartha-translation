source:
  edition: WLC
  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: de
  text: Durch den Zorn Jahwes, des Herrn der Heerscharen, ist das Land versengt[a], und das Volk ist zu Brennstoff für das Feuer geworden; keiner verschont seinen Bruder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist verbrannt“ oder „ist verfinstert“. Das hebräische Verb ist selten, und seine genaue Bedeutung ist umstritten; das unmittelbar folgende Feuerbild spricht für „ist versengt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: Durch den Zorn
  rationale: Die Präposition בְּ wird instrumental wiedergegeben; עֶבְרָה bezeichnet heftigen, überströmenden Zorn.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwes der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die traditionelle Weite von צְבָאוֹת und beschränkt den Ausdruck nicht auf menschliche Armeen.
- source_word: נֶעְתַּם
  choice: ist versengt
  rationale: Das seltene Verb ist in seiner genauen Bedeutung umstritten. „Versengt“ passt zum unmittelbar folgenden Feuerbild, ohne eine vollständige Vernichtung zu behaupten.
- source_word: אָרֶץ
  choice: das Land
  rationale: Im Zusammenhang des Gerichts über das Volk bezeichnet אָרֶץ eher dessen Land als die gesamte Erde.
- source_word: וַיְהִי הָעָם
  choice: und das Volk ist ... geworden
  rationale: Die Form führt die Folge des göttlichen Zorns ein; das deutsche Perfekt bringt den entstandenen Zustand natürlich zum Ausdruck.
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: wie Nahrung für das Feuer
  rationale: מַאֲכֹלֶת bezeichnet etwas, das verzehrt wird. Die Wiedergabe bewahrt das hebräische Bild vom Feuer, das das Volk frisst.
- source_word: אִישׁ אֶל אָחִיו
  choice: keiner ... seinen Bruder
  rationale: אִישׁ ist hier distributiv gebraucht. „Seinen Bruder“ erhält die familiäre Sprache und damit die Schärfe des innergesellschaftlichen Zerfalls.
- source_word: לֹא יַחְמֹלוּ
  choice: verschont ... nicht
  rationale: חמל bezeichnet ein aus Mitleid erfolgendes Verschonen; „verschont nicht“ ist im Gewaltkontext knapp und treffend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von צְבָאוֹת
  choice: Heerscharen
  alternative: Heere
  rationale: „Heerscharen“ lässt offen, ob himmlische, irdische oder umfassend alle unter Gottes Befehl stehenden Mächte gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Metapher „Nahrung für das Feuer“ wurde bewusst erhalten; die unsichere Bedeutung von נֶעְתַּם wird durch eine Fußnote kenntlich gemacht.
