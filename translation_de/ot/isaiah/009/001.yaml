source:
  edition: WLC
  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
translation:
  language: de
  text: Das Volk, das in der Finsternis geht, hat ein großes Licht gesehen; über denen, die in einem Land tiefster Dunkelheit wohnen, hat ein Licht geleuchtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: Das Volk
  rationale: Das singularische Kollektiv bezeichnet hier die Bevölkerung beziehungsweise das Volk; „das Volk“ gibt dies knapp und natürlich wieder.
- source_word: הַהֹלְכִים
  choice: das … lebt
  rationale: Wörtlich steht „das … geht“. Im bildhaften Zusammenhang bezeichnet das Gehen einen fortdauernden Lebenszustand; „lebt“ vermittelt diesen Sinn in natürlichem Deutsch, während das Bild der Finsternis erhalten bleibt.
- source_word: בַּחֹשֶׁךְ
  choice: in der Finsternis
  rationale: Die Wendung bewahrt sowohl den konkreten als auch den übertragenen Gehalt des hebräischen Bildes.
- source_word: רָאוּ
  choice: hat … gesehen
  rationale: Das hebräische Perfekt stellt das Sehen als vollendetes Geschehen dar. Das deutsche Perfekt eignet sich für die prophetische Aussage und wahrt ihren Gegenwartsbezug.
- source_word: אוֹר גָּדוֹל
  choice: ein großes Licht
  rationale: Die einfache und bildkräftige Verbindung von Substantiv und Adjektiv wird unmittelbar wiedergegeben.
- source_word: יֹשְׁבֵי
  choice: denen, die … wohnen
  rationale: Die partizipiale Form beschreibt einen anhaltenden Zustand; der deutsche Relativsatz klingt natürlich und bewahrt diesen Aspekt.
- source_word: בְּאֶרֶץ
  choice: in einem Land
  rationale: Die unbestimmte Form leitet eine qualitative Beschreibung ein und entspricht hier natürlichem Deutsch.
- source_word: צַלְמָוֶת
  choice: tiefster Dunkelheit
  rationale: Das Wort bezeichnet in diesem Kontext wahrscheinlich besonders dichte, bedrückende Dunkelheit. Der Superlativ gibt die Intensität idiomatisch wieder; die traditionelle Deutung als „Todesschatten“ bleibt in der Fußnote sichtbar.
- source_word: אוֹר
  choice: Licht
  rationale: Die Wiederholung von „Licht“ wird als prägendes Stilmittel des hebräischen Textes beibehalten.
- source_word: נָגַהּ
  choice: ist … aufgeleuchtet
  rationale: Das Verb bedeutet „leuchten, Licht ausstrahlen“. „Aufgeleuchtet“ ist eine direkte, natürliche Wiedergabe und vermeidet die stärker deutende Übersetzung „ist aufgegangen“.
- source_word: עֲלֵיהֶם
  choice: über denen
  rationale: Die Präposition bedeutet „über/auf ihnen“. Die Voranstellung entspricht der hebräischen Satzstruktur und ergibt im Deutschen einen klaren Parallelismus.
theological_decisions:
- issue: Wiedergabe von צַלְמָוֶת in einem messianisch bedeutsamen prophetischen Text
  choice: tiefste Dunkelheit
  alternative: Todesschatten / Schatten des Todes
  rationale: Im Kontext bezeichnet das hebräische Wort wahrscheinlich tiefe, bedrückende Finsternis, ohne den Tod zwingend ausdrücklich zu nennen. Die Hauptfassung gibt diesen wahrscheinlichen Sinn wieder; die traditionsreiche Alternative wird in einer Fußnote bewahrt, sodass die sprachliche und theologische Spannung sichtbar bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. Die Wiederholung von „Licht“ und das Bild der Finsternis bleiben erhalten; die idiomatische Wiedergabe von „gehen“ als „leben“ vermeidet im Deutschen eine missverständliche rein räumliche Lesart.
