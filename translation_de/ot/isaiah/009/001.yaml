  naturalness: Die revidierte Formulierung ist modernes, würdevolles Standarddeutsch. „in der Finsternis geht“ ist in diesem poetisch-prophetischen Register verständlich und bewahrt die Metapher. „Über denen ... hat ein Licht geleuchtet“ ist natürlich und bildet עֲלֵיהֶם angemessen ab.
  terminology: „Finsternis“, „großes Licht“ und „tiefste Dunkelheit“ sind treffend. Die Fußnote wahrt die traditionsreiche, lexikalisch mögliche Alternative „Todesschatten“, ohne sie im Haupttext vorzuziehen.
