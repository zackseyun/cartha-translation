  terminology: „Behauene Steine“, „Zedern“ und „durch ... ersetzen“ treffen den Sinn angemessen. „Maulbeerfeigen“ ist die präzise deutsche Bezeichnung für שִׁקְמִים; die Fußnote kann die botanische Einordnung knapp erläutern.
