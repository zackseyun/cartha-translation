source:
  edition: WLC
  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: de
  text: Ziegel sind gefallen, doch mit behauenen Steinen werden wir bauen; Maulbeerfeigen[a] sind gefällt worden, doch wir werden sie durch Zedern ersetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maulbeerfeigen sind Bäume der Art Ficus sycomorus.
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: Ziegel
  rationale: Das Substantiv bezeichnet gewöhnliche Bauziegel, wahrscheinlich Lehmziegel. „Ziegel“ bleibt wie das Hebräische unspezifisch und bildet den Gegensatz zu bearbeitetem Stein klar ab.
- source_word: נָפָלוּ
  choice: sind eingestürzt
  rationale: Das Qatal bezeichnet ein abgeschlossenes Geschehen. Im Zusammenhang mit Mauerwerk gibt „eingestürzt“ die Wirkung natürlicher wieder als das wörtlichere „gefallen“.
- source_word: גָזִית
  choice: behauene Steine
  rationale: Das Wort bezeichnet zugerichtete Werksteine. „Behauene Steine“ ist verständlich, würdig und erhält den Gegensatz zu einfachen Ziegeln.
- source_word: נִבְנֶה
  choice: werden wir bauen
  rationale: Der Imperfekt der ersten Person Plural drückt die beabsichtigte zukünftige Handlung aus. Das Verb bedeutet schlicht „bauen“; die Wiederherstellung ergibt sich bereits aus dem Kontext, ohne dass „wieder-“ ergänzt werden muss.
- source_word: שִׁקְמִים
  choice: Maulbeerfeigenbäume
  rationale: Gemeint ist Ficus sycomorus, nicht die im Deutschen üblicherweise mit „Sykomore“ bezeichnete Ahornart. Die botanisch eindeutige deutsche Bezeichnung vermeidet eine sachliche Verwechslung.
- source_word: גֻּדָּעוּ
  choice: sind gefällt worden
  rationale: Die Passivform bezeichnet das Abhauen beziehungsweise Fällen der Bäume. Das deutsche Perfekt Passiv bewahrt sowohl Abgeschlossenheit als auch Passivität.
- source_word: אֲרָזִים
  choice: Zedern
  rationale: Die Zedern stehen für wertvolleres und kräftigeres Bauholz als die Maulbeerfeigenbäume. Die knappe Bezeichnung entspricht dem hebräischen Plural.
- source_word: נַחֲלִיף
  choice: werden wir sie durch … ersetzen
  rationale: Das Hifil von חלף bezeichnet hier das Austauschen beziehungsweise Ersetzen. Die deutsche Konstruktion macht den Wechsel von den gefällten Bäumen zu Zedern idiomatisch deutlich.
theological_decisions:
- issue: Ton der Erklärung
  choice: Die Aussage wird als selbstbewusster, trotziger Vorsatz formuliert, nach der Zerstörung mit höherwertigen Materialien weiterzubauen.
  alternative: Eine neutrale Ankündigung des Wiederaufbaus.
  rationale: Der weitere Kontext deutet die Worte als Hochmut und Überheblichkeit. Die Übersetzung lässt diesen Ton durch den Gegensatz der Baustoffe und das wiederholte „doch wir werden“ hervortreten, ohne ihn durch erklärende Zusätze festzuschreiben.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Satzbau. Die Parallelstruktur des Hebräischen bleibt erhalten. „Behauene Steine“ wahrt die konkrete Bildsprache; „Maulbeerfeigenbäume“ sorgt für botanische Genauigkeit. Der Fußnotenmarker [a] steht unmittelbar am betreffenden Ausdruck.
