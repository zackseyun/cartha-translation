id: ISA.9.3
reference: Isaiah 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: de
  text: Denn das Joch seiner Last[a], den Stab auf seiner Schulter und den Stock seines Bedrängers hast du zerschmettert[c] wie am Tag Midians.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Joch seiner Bürde“ beziehungsweise „das Joch seiner Bedrückung“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Tag Midians“ erinnert wahrscheinlich daran, wie der HERR zur Zeit Gideons Midian besiegte (Richter 7).
    reason: cross_reference
  - marker: c
    text: 'Im Hebräischen steht die vollendete Verbform: „hast du zerschmettert“. Prophetische Rede kann Gottes künftigen Sieg so als gewiss darstellen; daher übersetzen manche: „wirst du zerschmettern“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹל סֻבֳּלוֹ
  choice: das Joch seiner Last
  rationale: עֹל bezeichnet wörtlich ein Joch; סֻבֳּל bezeichnet eine getragene beziehungsweise auferlegte Last. Die formnahe Wendung bewahrt sowohl das konkrete Bild als auch den Gedanken erzwungener Knechtschaft.
- source_word: מַטֵּה שִׁכְמוֹ
  choice: den Stab auf seiner Schulter
  rationale: מַטֶּה kann Stab oder Stock bedeuten. „Stab“ erhält das Bild des bedrückenden Geräts und unterscheidet den Ausdruck sprachlich vom folgenden שֵׁבֶט; שִׁכְמוֹ wird natürlich mit „auf seiner Schulter“ wiedergegeben.
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: den Stock seines Bedrängers
  rationale: שֵׁבֶט bezeichnet hier einen zum Schlagen und Zwingen dienenden Stock. נֹגֵשׂ ist ein Bedränger, Antreiber oder Fronvogt; „Bedränger“ gibt den Zwang verständlich wieder, ohne die Bedeutung unnötig einzuengen.
- source_word: הַחִתֹּתָ
  choice: hast du zerschmettert
  rationale: Das Verb חתת bezeichnet ein Zerbrechen oder Zerschmettern. Die zweite Person Singular und die Perfektform bleiben als direkte Anrede und als vollendete Darstellung des Sieges erhalten. Im Deutschen kann das singularische Verb ohne ein ergänztes Pronomen alle drei vorangestellten Objekte regieren.
- source_word: כְּיוֹם מִדְיָן
  choice: wie am Tag Midians
  rationale: Die knappe historische Vergleichsform des Hebräischen bleibt erhalten. Sie verweist wahrscheinlich auf die entscheidende Niederlage Midians zur Zeit Gideons.
- source_word: כִּי
  choice: Denn
  rationale: כִּי begründet hier die vorausgehende Aussage über Freude und Rettung. „Denn“ stellt diesen Zusammenhang im Deutschen klar und idiomatisch her.
theological_decisions:
- issue: Prophetisches Perfekt und göttliches Handeln
  choice: 'Die Perfektform wird als vollendete, an Gott gerichtete Handlung wiedergegeben: „hast du zerschmettert“.'
  alternative: 'Zukünftige Wiedergabe: „wirst du zerschmettern“.'
  rationale: Die hebräische prophetische Rede kann ein noch erwartetes Rettungshandeln wegen seiner Gewissheit als bereits vollendet darstellen. Die Übersetzung bewahrt diese rhetorische Spannung, statt sie stillschweigend in ein gewöhnliches Futur aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Bildsprache der Unterdrückung und die direkte Anrede Gottes bleiben erhalten; „zerschmettert“ gibt die Kraft des hebräischen Verbs wieder.
