source:
  edition: WLC
  text: דָּבָ֛ר שָׁלַ֥ח אֲדֹנָ֖/י בְּ/יַעֲקֹ֑ב וְ/נָפַ֖ל בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: de
  text: Der Herr sandte ein Wort gegen Jakob[a], und es fiel auf Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der Herr sandte eine Botschaft an Jakob, und sie fiel auf Israel.'
    reason: 'Lexikalische und syntaktische Alternative: דָּבָר kann »Botschaft« bedeuten, und בְּיַעֲקֹב kann als Zielangabe »an Jakob« verstanden werden.'
lexical_decisions:
- source_word: דָּבָר
  choice: ein Wort
  rationale: דָּבָר kann »Wort«, »Botschaft« oder »Sache« bedeuten. »Ein Wort« bewahrt die knappe, eindringliche Formulierung eines wirksamen göttlichen Ausspruchs.
- source_word: שָׁלַח
  choice: sandte
  rationale: Das Verb bedeutet grundsätzlich »senden«. Das Präteritum entspricht dem erzählend-prophetischen Stil und klingt im Deutschen würdig und natürlich.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Im Ausgangstext steht der Gottestitel אֲדֹנָי und nicht der Gottesname יהוה. Daher wird der Titel mit »der Herr« übersetzt.
- source_word: בְּיַעֲקֹב
  choice: gegen Jakob
  rationale: Die Präposition בְּ kann hier Zielrichtung oder Bezug bezeichnen. Im Zusammenhang des Gerichtswortes und parallel zu »fiel auf Israel« gibt »gegen Jakob« die wahrscheinliche feindliche Zielrichtung wieder; die alternative Deutung »an Jakob« bleibt in der Fußnote sichtbar.
- source_word: וְנָפַל
  choice: und es fiel
  rationale: נפל bedeutet »fallen«. Das Pronomen nimmt »ein Wort« auf und bewahrt das starke Bild eines göttlichen Wortes, das sein Ziel erreicht und wirksam wird.
- source_word: בְּיִשְׂרָאֵל
  choice: auf Israel
  rationale: Bei נפל kann בְּ den Bereich oder das Ziel des Fallens bezeichnen. »Auf Israel« erhält die Bildsprache und die Parallelität zu Jakob.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: Herr; keine Wiedergabe mit dem Bundesnamen
  rationale: Der hebräische Text verwendet ausdrücklich den Titel אֲדֹנָי. Eine Ersetzung durch eine Konvention für יהוה würde die vorliegende Wortform verwischen.
- issue: Bedeutung von בְּ bei Jakob und Israel
  choice: Gerichtswort gegen Jakob, das auf Israel fällt
  alternative: eine an Jakob gesandte Botschaft, die Israel erreicht oder dort niederfällt
  rationale: Der Zusammenhang und der Parallelismus legen eine gegen Jakob beziehungsweise Israel gerichtete Wirkung nahe. Da die Präposition jedoch auch anders verstanden werden kann, wird die Richtung im Haupttext kontextgemäß wiedergegeben und die echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper prophetischer Bildsprache. »Fiel auf« bleibt bewusst bildhaft und wird nicht durch das deutendere »traf« ersetzt.
