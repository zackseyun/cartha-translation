  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: de
  text: Aram von Osten und die Philister von Westen her[b] fraßen Israel mit vollem Maul[a]. Bei alledem hat sich sein Zorn nicht abgewandt, und seine Hand ist noch ausgestreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit ganzem Maul“; die Wendung bezeichnet gieriges oder vollständiges Verschlingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von hinten“; im Gegensatz zu „von Osten“ ist hier wahrscheinlich „von Westen“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische geografisch-ethnische Eigenname wird direkt wiedergegeben, statt ihn mit dem späteren Namen „Syrien“ gleichzusetzen.
- source_word: מִקֶּדֶם
  choice: von Osten
  rationale: קֶדֶם kann „vorn“ oder „Osten“ bedeuten; im Gegensatz zu מֵאָחוֹר ist hier die Himmelsrichtung gemeint.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die geläufige deutsche Bezeichnung der im Hebräischen genannten Volksgruppe.
- source_word: מֵאָחוֹר
  choice: von Westen her
  rationale: Wörtlich bedeutet der Ausdruck „von hinten“; im räumlichen Gegensatz zu „von Osten“ bezeichnet er hier wahrscheinlich den Westen.
- source_word: וַיֹּאכְלוּ
  choice: fraßen
  rationale: Die konkrete Metapher des Essens bleibt erhalten und bezeichnet das schonungslose Verzehren beziehungsweise Verwüsten Israels.
- source_word: בְּכָל פֶּה
  choice: mit vollem Maul
  rationale: Die ungewöhnliche hebräische Wendung wird anschaulich und im Deutschen verständlich wiedergegeben; sie vermittelt gieriges, restloses Verschlingen.
- source_word: בְּכָל זֹאת
  choice: Bei alledem
  rationale: Die Wendung führt den wiederkehrenden Kehrvers ein und zeigt, dass Gottes Gericht trotz des zuvor Beschriebenen fortdauert.
- source_word: לֹא שָׁב אַפּוֹ
  choice: hat sich sein Zorn nicht abgewandt
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch aber den Zorn. Die Formulierung wahrt zugleich das Bewegungsbild von שׁוב.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: und noch ist seine Hand ausgestreckt
  rationale: Die knappe prophetische Bildsprache einer weiterhin zum Gericht ausgestreckten Hand bleibt erhalten.
theological_decisions:
- issue: Bezug der Pronomen im Kehrvers
  choice: Die Pronomen bleiben als „sein/seine“ stehen und beziehen sich im Kontext auf Gott.
  alternative: Den Bezug ausdrücklich als „Gottes Zorn“ und „Gottes Hand“ benennen.
  rationale: Der Kontext weist auf Gottes fortdauerndes Gericht, doch die Übersetzung bewahrt die pronominale Form des Hebräischen und macht nicht expliziter, was der Ausgangstext nur kontextuell erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fraßen“ und „Maul“ bewahren bewusst die drastische Fressmetapher. Die wahrscheinliche geografische Bedeutung „Westen“ steht im Haupttext; die wörtliche Alternative „hinten“ ist in den Übersetzungsentscheidungen dokumentiert, benötigt aber wegen des einzelnen gesetzten Markers keine zusätzliche Fußnote.
