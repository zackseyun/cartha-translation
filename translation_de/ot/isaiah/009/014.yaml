  text: זָקֵ֥ן וּ/נְשׂוּא פָנִ֖ים ה֣וּא הָ/רֹ֑אשׁ וְ/נָבִ֥יא מֽוֹרֶה שֶּׁ֖קֶר ה֥וּא הַ/זָּנָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
translation:
  language: de
  text: Der Älteste und Angesehene ist das Haupt, und der Prophet, der Falsches lehrt[a], ist der Schwanz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Lügen lehrt“. Zu „der Älteste und Angesehene“: Oder: „der alte Mann und der Mann von hohem Rang“. Die hebräische Wendung lautet wörtlich etwa: „der Älteste und der an Gesicht Erhobene“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: der Älteste
  rationale: זָקֵן kann einen alten Mann oder einen Ältesten bezeichnen. Im Zusammenhang gesellschaftlicher Führung gibt „der Älteste“ sowohl Alter als auch anerkannte Stellung wieder, ohne die Bedeutung auf bloßes Lebensalter zu verengen.
- source_word: וּנְשׂוּא פָנִים
  choice: und der Angesehene
  rationale: Die Wendung bedeutet wörtlich etwa „der an Gesicht Erhobene“ und bezeichnet einen Menschen von Ansehen oder hohem Rang. „Der Angesehene“ ist im modernen Deutschen natürlich und bewahrt den sozialen Statusbezug.
- source_word: הוּא הָרֹאשׁ
  choice: ist das Haupt
  rationale: Die Identifikation mit dem Körperteilbild wird unmittelbar wiedergegeben. „Haupt“ bewahrt die gehobene prophetische Bildsprache und bildet den deutlichen Gegensatz zu „Schwanz“.
- source_word: וְנָבִיא
  choice: und der Prophet
  rationale: Der Prophet erscheint als repräsentative Gestalt und steht parallel zu den zuvor genannten gesellschaftlichen Autoritäten. Der bestimmte Artikel ergibt sich im Deutschen natürlich aus dieser identifizierenden Gegenüberstellung.
- source_word: מוֹרֶה שֶּׁקֶר
  choice: der Lügen lehrt
  rationale: Das Partizip bezeichnet fortdauernde oder kennzeichnende Tätigkeit. „Lügen lehrt“ gibt den Sinn von שֶׁקֶר als Lüge beziehungsweise Falschheit verständlich und knapp wieder.
- source_word: הוּא הַזָּנָב
  choice: ist der Schwanz
  rationale: Das konkrete Gegenbild zum Haupt wird ohne erklärende Abschwächung beibehalten.
theological_decisions:
- issue: Bildhafte Identifikation gesellschaftlicher und religiöser Autoritäten als „Haupt“ und „Schwanz“
  choice: Die beiden Körperteilmetaphern werden direkt als „Haupt“ und „Schwanz“ wiedergegeben.
  alternative: Die Bilder deutend als „Führer“ und „niedriger beziehungsweise nachgeordneter Teil“ auflösen.
  rationale: Der hebräische Text verwendet bewusst konkrete, spannungsreiche Körperbilder. Ihre unveränderte Wiedergabe bewahrt die prophetische Rhetorik und greift der Deutung des Zusammenhangs nicht vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ wurde statt des alltäglicheren „Kopf“ gewählt, um die prophetische Metapher in gehobenem, aber allgemein verständlichem Register zu bewahren. Die Singularformen stellen die genannten Personen jeweils als Vertreter einer Gruppe dar.
