  naturalness: Die vorgeschlagene Fassung bleibt moderne, knappe Standardsprache. „Doch sie werden nicht satt“ ist trotz des absichtlichen Numeruswechsels verständlich; die Formulierung bewahrt die Textgestalt besser als das singularische „wird nicht satt“.
  terminology: „Fleisch seines Arms“ bewahrt die körperliche Bildlichkeit. Das im Entwurf ergänzte „eigenen“ ist nicht erforderlich, da das Possessivsuffix bereits „seines“ ausdrückt; die schlichtere Form ist genauer. Die Anmerkungen benennen Möglichkeiten, ohne die Bildsprache dogmatisch oder einseitig festzulegen.
