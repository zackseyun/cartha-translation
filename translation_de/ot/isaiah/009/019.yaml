  text: וַ/יִּגְזֹ֤ר עַל יָמִין֙ וְ/רָעֵ֔ב וַ/יֹּ֥אכַל עַל שְׂמֹ֖אול וְ/לֹ֣א שָׂבֵ֑עוּ אִ֥ישׁ בְּשַׂר זְרֹע֖/וֹ יֹאכֵֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: de
  text: Er schneidet rechts ab[a] und bleibt hungrig; er isst links, doch sie werden nicht satt. Jeder isst das Fleisch seines Arms.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er reißt rechts an sich“. Das hebräische Verb bedeutet wörtlich „schneiden“ oder „abschneiden“; hier kann das Bild auch gewaltsames Ergreifen von Nahrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Jeder isst das Fleisch seines Arms.“ Das drastische Bild kann äußerste innere Feindschaft oder Selbstzerstörung darstellen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: Er schneidet … ab
  rationale: גזר bedeutet grundsätzlich „schneiden“ oder „abschneiden“. Die konkrete, gewaltsame Bildsprache bleibt erhalten, ohne die mögliche Bedeutung „an sich reißen“ in den Haupttext einzutragen.
- source_word: עַל יָמִין … עַל שְׂמֹאול
  choice: rechts … links
  rationale: Die knappe räumliche Gegenüberstellung des Hebräischen wird im Deutschen natürlich und parallel wiedergegeben.
- source_word: וְרָעֵב
  choice: und bleibt hungrig
  rationale: „Bleibt hungrig“ macht deutlich, dass die vorausgehende Handlung den Hunger nicht stillt; die Konjunktion wird dabei nicht unnötig adversativ überdeutet.
- source_word: וַיֹּאכַל
  choice: er isst
  rationale: אכל ist das gewöhnliche Verb für „essen“. Die Verzweiflung und Gewalt ergeben sich aus dem Zusammenhang.
- source_word: וְלֹא שָׂבֵעוּ
  choice: und wird nicht satt
  rationale: שׂבע bezeichnet das Sattwerden. Das Deutsche führt das unbestimmte singularische Subjekt flüssig fort; der hebräische Wechsel zum Plural wird nicht als eigener Bedeutungsunterschied interpretiert.
- source_word: אִישׁ … יֹאכֵלוּ
  choice: Jeder isst
  rationale: 'Die Verbindung aus singularischem אִישׁ und pluralischem Verb ist distributiv: Die Aussage gilt jedem Einzelnen. Im Deutschen verlangt „jeder“ ein singularisches Verb.'
- source_word: בְּשַׂר זְרֹעוֹ
  choice: das Fleisch seines eigenen Arms
  rationale: Die wörtliche Körperbezeichnung bewahrt das drastische Bild. „Eigenen“ verdeutlicht im Deutschen den auf die Person selbst zurückweisenden Sinn des Possessivsuffixes im Zusammenhang.
theological_decisions:
- issue: Bild vom Essen des eigenen Arms
  choice: Als drastische körperliche Metapher unverändert wiedergegeben
  alternative: Als „Selbstzerstörung“ oder „gegenseitiges Verschlingen“ ausdeuten
  rationale: Der Text benennt das Bild, erklärt aber seine genaue Referenz nicht. Die Übersetzung bewahrt deshalb die Spannung zwischen Hunger, innerem Kampf und Selbstzerstörung, ohne eine einzige Deutung festzuschreiben.
translation_notes:
  register: Moderne, knappe Standardsprache mit würdigem, bewusst drastischem Bildton. Der Parallelismus „rechts … links“ und die konkrete Rede von Hunger, Essen und Fleisch bleiben erhalten.
