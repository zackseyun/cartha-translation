base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: de
  text: Denn die Bosheit brennt wie Feuer; sie verzehrt Dornen und Disteln und setzt die Dickichte des Waldes in Brand, und Rauchschwaden wälzen sich hoch empor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sie wirbeln in aufquellendem Rauch empor“. Der hebräische Wortlaut der Schlussklausel ist schwierig; das seltene Verb und sein Bezug sind unsicher. Wahrscheinlich beschreibt die Klausel Rauch, der wogend oder wirbelnd emporsteigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה
  choice: brennt
  rationale: Das Qal Perfekt 3. Femininum Singular kann im prophetischen Zusammenhang einen anschaulich gegenwärtigen Vorgang ausdrücken. „Brennt“ bewahrt das unmittelbare Feuerbild.
- source_word: רִשְׁעָה
  choice: Gottlosigkeit
  rationale: Das Abstraktum bezeichnet moralische Bosheit bzw. verwerfliches Handeln. „Gottlosigkeit“ ist im Jesajakontext würdig und verständlich und erhält die Personifikation als handelnde Macht.
- source_word: שָׁמִיר וָשַׁיִת
  choice: Dornen und Disteln
  rationale: Das feste Wortpaar bezeichnet stacheligen, wertlosen Bewuchs; da die genaue botanische Bestimmung unsicher ist, ist eine allgemein verständliche Wiedergabe angemessen.
- source_word: תֹּאכֵל
  choice: verzehrt
  rationale: אכל wird häufig bildlich vom verzehrenden Feuer gebraucht. „Verzehrt“ gibt diese intensive Wirkung natürlich wieder.
- source_word: וַתִּצַּת
  choice: setzt … in Brand
  rationale: Das Verb bezeichnet das Entzünden bzw. Inbrandsetzen. Die Form führt die personifizierte Gottlosigkeit als Subjekt weiter.
- source_word: סִבְכֵי הַיַּעַר
  choice: die Dickichte des Waldes
  rationale: סבך bezeichnet dicht verflochtenen Bewuchs oder Gestrüpp. „Dickichte“ bewahrt sowohl den Plural als auch das Bild des verwachsenen Waldes.
- source_word: וַיִּתְאַבְּכוּ
  choice: sie wälzen sich … empor
  rationale: Das seltene und schwierige Verb beschreibt wahrscheinlich eine wirbelnde oder sich auftürmende Aufwärtsbewegung. „Sich emporwälzen“ hält das eindrückliche Bewegungsbild fest, ohne es unnötig festzulegen.
- source_word: גֵּאוּת עָשָׁן
  choice: als hoch aufsteigender Rauch
  rationale: גֵּאוּת kann Höhe, Anschwellen oder eine emporragende Masse bezeichnen. In Verbindung mit „Rauch“ liegt das Bild einer hoch aufquellenden Rauchmasse nahe.
