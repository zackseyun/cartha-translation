  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: de
  text: Und die Leiter dieses Volkes sind zu solchen geworden, die es in die Irre führen[a], und die von ihnen Geführten werden verschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diejenigen, die dieses Volk glücklich preisen, führen es in die Irre, und die von ihnen glücklich Gepriesenen werden verschlungen.“ Die hebräischen Formen von אשר können sich auf das Glücklichpreisen eines Menschen beziehen; der Zusammenhang stützt jedoch auch die Wiedergabe mit „Leiter“ und „Geführte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: sind zu … geworden
  rationale: Die Form bezeichnet hier den Eintritt in einen daraus folgenden Zustand. Das deutsche Perfekt gibt diesen Übergang natürlich wieder.
- source_word: מְאַשְּׁרֵי
  choice: die Führer
  rationale: Das Partizip von אשר kann diejenigen bezeichnen, die führen oder den Weg weisen. Im Zusammenhang mit מַתְעִים und der parallelen Passivform passt „Führer“ am besten und bewahrt die Ironie einer Führung, die in die Irre führt.
- source_word: הָעָם הַזֶּה
  choice: dieses Volkes
  rationale: עם bedeutet gewöhnlich „Volk“; die Genitivfügung entspricht dem Hebräischen und klingt in modernem Standarddeutsch natürlich.
- source_word: מַתְעִים
  choice: zu Verführern
  rationale: Das Hifil-Partizip von תעה bezeichnet Menschen, die andere zum Abirren bringen. „Verführer“ gibt die kausative Bedeutung knapp wieder und bildet ein prägnantes Wortspiel mit „Führer“.
- source_word: וּמְאֻשָּׁרָיו
  choice: die von ihnen Geführten
  rationale: Die passive Partizipialform wird parallel zu מְאַשְּׁרֵי als die von den Führern geleiteten Menschen verstanden. „Von ihnen“ gibt den kollektiven Bezug sinngemäß wieder, obwohl das hebräische Suffix formal singularisch ist.
- source_word: מְבֻלָּעִים
  choice: werden verschlungen
  rationale: Das passive Partizip von בלע bewahrt das anschauliche Bild des Verschlungenwerdens, ohne es vorschnell auf „vernichtet“ oder „verwirrt“ festzulegen.
theological_decisions:
- issue: Deutung der beiden Formen aus אשר
  choice: Als „Führer“ und „die von ihnen Geführten“ wiedergegeben
  alternative: Als diejenigen, die das Volk glücklich preisen bzw. segnen, und diejenigen, die von ihnen glücklich gepriesen bzw. gesegnet werden
  rationale: Der unmittelbare Zusammenhang mit „in die Irre führen“ und der Parallelismus zwischen aktiver und passiver Form sprechen für die Bedeutung Führung/Leitung. Da אשר jedoch auch das Glücklichpreisen ausdrücken kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Wortpaar „Führer/Verführer“ bildet die hebräische Gegenüberstellung prägnant ab; „werden verschlungen“ erhält die starke Metapher und den gegenwärtigen Zustandscharakter des Partizips.
