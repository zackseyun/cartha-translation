revisions:
- from: Und die Führer dieses Volkes sind zu Verführern geworden[a], und die von ihnen Geführten werden verschlungen.
  to: Und die Leiter dieses Volkes sind zu solchen geworden, die es in die Irre führen[a], und die von ihnen Geführten werden verschlungen.
  rationale: Die Revision ersetzt die unnötig belastete Bezeichnung „Führer“ durch das neutrale „Leiter“ und gibt die kausative Bedeutung von מַתְעִים ausdrücklich als „in die Irre führen“ wieder. Dabei bleibt der mit וַיִּהְיוּ ausgedrückte Übergang durch „sind zu solchen geworden“ erhalten. Die alternative Deutung der אשר-Formen bleibt in der Fußnote sichtbar.
