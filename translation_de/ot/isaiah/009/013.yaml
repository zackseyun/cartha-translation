  text: וַ/יַּכְרֵ֨ת יְהוָ֜ה מִ/יִּשְׂרָאֵ֗ל רֹ֧אשׁ וְ/זָנָ֛ב כִּפָּ֥ה וְ/אַגְמ֖וֹן י֥וֹם אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: de
  text: Da schnitt Jahwe von Israel Kopf und Schwanz[a], Palmzweig und Binse[b], an einem einzigen Tag ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das ganze Spektrum des Volkes, von den Hochgestellten bis zu den Niedrigen; der folgende Vers erklärt das Bild.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Schilfrohr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: Da schnitt … ab
  rationale: Das Hifil von כרת bezeichnet hier ein entschiedenes Beseitigen. „Abschneiden“ bewahrt sowohl das konkrete Bild als auch die übertragene Bedeutung des Gerichts; „da“ gibt den fortführenden Zusammenhang natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition מן bezeichnet die Trennung beziehungsweise Entfernung von Israel; „von Israel … abschneiden“ wahrt dieses Verhältnis im Deutschen.
- source_word: רֹאשׁ וְזָנָב
  choice: Kopf und Schwanz
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten, da sie im folgenden Vers selbst erklärt wird.
- source_word: כִּפָּה
  choice: Palmzweig
  rationale: Das Wort bezeichnet den erhöhten Teil beziehungsweise Zweig einer Palme und bildet den Gegensatz zur niedrigen Sumpfpflanze.
- source_word: וְאַגְמוֹן
  choice: Binse
  rationale: אַגְמוֹן bezeichnet eine niedrige Sumpf- oder Röhrichtpflanze. „Binse“ ist prägnant und erhält den bildlichen Gegensatz zum Palmzweig.
- source_word: יוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Formulierung bringt die Plötzlichkeit und Geschlossenheit des angekündigten Gerichts idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bildsprache oder deutende Wiedergabe
  choice: „Kopf und Schwanz, Palmzweig und Binse“ im Haupttext beibehalten
  alternative: Deutend mit „Hohe und Niedrige“ oder „Führende und Geführte“ übersetzen
  rationale: Der Ausgangstext verwendet konkrete Gegensatzpaare, deren Bedeutung der folgende Vers erläutert. Eine deutende Übersetzung an dieser Stelle würde diese Erklärung vorwegnehmen und die Bildspannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen Gegensatzbilder des Hebräischen bleiben bewusst stehen. Die Satzklammer „schnitt … ab“ ist natürlich deutsch, während „von Israel“ die im Ausgangstext bezeichnete Trennung erhält.
