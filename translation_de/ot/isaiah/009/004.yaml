  yaml_path: translation/ot/isaiah/009/004.yaml
  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
translation:
  language: de
  text: Denn jeder stampfende Stiefel im Getöse[a] und jedes in Blut gewälzte Gewand werden zum Verbrennen bestimmt sein, dem Feuer zum Fraß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder Stiefel, der im Getöse aufstampft“. Der hebräische Ausdruck ist selten und schwer zu deuten; manche verstehen den ersten Satzteil allgemeiner als Hinweis auf Getöse oder Schlachtenlärm statt auf einen Stiefel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein.
- source_word: כָל
  choice: jeder / jedes
  rationale: Der distributive Sinn wird bei den beiden singularischen Gegenständen im Deutschen natürlich wiedergegeben.
- source_word: סְאוֹן
  choice: Stiefel
  rationale: Das seltene und schwierige Substantiv bezeichnet im militärischen Zusammenhang am ehesten das Schuhwerk eines Kriegers; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: סֹאֵן
  choice: der … stampft
  rationale: Das Partizip beschreibt ein dröhnendes oder stampfendes Auftreten und wird als Relativsatz verständlich an „Stiefel“ angeschlossen.
- source_word: בְּרַעַשׁ
  choice: im Schlachtgetöse
  rationale: רַעַשׁ bezeichnet Lärm, Erschütterung oder Getümmel; der unmittelbare militärische Bildzusammenhang rechtfertigt die kontextuelle Präzisierung „Schlacht-“.
- source_word: וְשִׂמְלָה
  choice: und jedes … Gewand
  rationale: שִׂמְלָה ist eine allgemeine Bezeichnung für ein Kleidungsstück; „Gewand“ wahrt den gehobenen, aber verständlichen Ton.
- source_word: מְגוֹלָלָה
  choice: gewälzte
  rationale: Gibt das passive Partizip eng wieder und bewahrt das drastische Bild eines in Blut gerollten beziehungsweise damit überzogenen Gewandes.
- source_word: בְדָמִים
  choice: in Blut
  rationale: Der hebräische Plural „Blute“ wird im Deutschen idiomatisch als Kollektivsingular wiedergegeben.
- source_word: וְהָיְתָה לִשְׂרֵפָה
  choice: werden verbrannt
  rationale: Die wörtliche Zielangabe „wird zum Verbrennen sein“ wird in natürliches modernes Deutsch übertragen; wegen der verbundenen Satzglieder steht das Verb im Plural.
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: Brennstoff für das Feuer
  rationale: Die wörtliche Metapher „Nahrung des Feuers“ wird durch eine geläufige deutsche Entsprechung wiedergegeben, ohne das Bild der vollständigen Verbrennung abzuschwächen.
