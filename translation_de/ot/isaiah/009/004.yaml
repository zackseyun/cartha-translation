  terminology: „Gewand“ und „Blut“ sind angemessen. „Stampfender Stiefel“ wahrt die Unsicherheit der seltenen Wendung, ohne einen im Hebräischen nicht genannten Krieger ausdrücklich einzuführen. Die Fußnote benennt die reale Deutungsschwierigkeit und bleibt am nicht näher bestimmten „Getöse“.
