  source_fidelity: Die Grundbilder (Stiefel, Blutgewand, Verbrennung) sind getroffen. „Schlachtgetöse“ präzisiert jedoch über den hebräischen Wortlaut hinaus; רַעַשׁ bezeichnet Getöse/Erschütterung und nennt keine Schlacht ausdrücklich. Zudem lässt „der ... stampft“ den Stiefel selbst handeln, während die schwierige hebräische Verbindung eher einen stampfenden/dröhnenden Stiefel bzw. den Tritt bezeichnet. Die Zielbestimmung „zum Verbrennen ... dem Feuer zum Fraß“ bildet לִשְׂרֵפָה מַאֲכֹלֶת אֵשׁ genauer ab als die bloße Aussage „werden verbrannt“.
