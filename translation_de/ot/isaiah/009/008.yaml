id: ISA.9.8
reference: Isaiah 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָדְעוּ֙ הָ/עָ֣ם כֻּלּ֔/וֹ אֶפְרַ֖יִם וְ/יוֹשֵׁ֣ב שֹׁמְר֑וֹן בְּ/גַאֲוָ֛ה וּ/בְ/גֹ֥דֶל לֵבָ֖ב לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
translation:
  language: de
  text: 'Und das ganze Volk wird es erkennen: Efraim und die Bewohner Samarias, die in Stolz und mit hochmütigem Herzen sagen:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „in Stolz und in Größe des Herzens“. Gemeint ist hier selbstüberheblicher Hochmut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und … wird es erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ kann im prophetischen Zusammenhang zukünftig beziehungsweise resultativ verstanden werden. Das ergänzte „es“ ergibt im Deutschen einen natürlichen Satzanschluss, ohne den noch folgenden Inhalt vorwegzunehmen.
- source_word: הָעָם כֻּלּוֹ
  choice: das ganze Volk
  rationale: Gibt die durch כֻּלּוֹ ausgedrückte Gesamtheit idiomatisch und vollständig wieder.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Der Eigenname wird beibehalten, auch wenn er im Kontext metonymisch für das Nordreich stehen kann.
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: und die Bewohner Samarias
  rationale: Das singularische Partizip hat kollektiven Sinn; der deutsche Plural gibt diesen natürlich wieder.
- source_word: בְּגַאֲוָה
  choice: in Stolz
  rationale: Bewahrt die moralisch negative Bedeutung von גַּאֲוָה und die präpositionale Fügung.
- source_word: וּבְגֹדֶל לֵבָב
  choice: und mit hochmütigem Herzen
  rationale: Die wörtliche Wendung „Größe des Herzens“ bezeichnet hier im Parallelismus mit „Stolz“ selbstüberheblichen Hochmut. Die deutsche idiomatische Wiedergabe wahrt diese kontextuelle Bedeutung.
- source_word: לֵאמֹר
  choice: die … sagen
  rationale: Leitet die im folgenden Vers wiedergegebene Äußerung ein; als Relativsatz ist dies im Deutschen klar und flüssig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt zeigt an, dass „Efraim und die Bewohner Samarias“ das zuvor genannte Volk näher bestimmen; der Vers bleibt zum folgenden Ausspruch hin offen.
