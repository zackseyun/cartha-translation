source:
  edition: WLC
  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: de
  text: Ich werde mich gegen sie erheben, spricht Jahwe der Heerscharen[a], und ich werde aus Babylon Namen und Überrest, Spross und Nachkommen[b] ausrotten, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Jahwe der Heere“.'
    reason: lexical_alternative
  - marker: b
    text: Die Verbindung „Namen und Überrest, Spross und Nachkommen“ bezeichnet umfassend Babylons fortbestehende Erinnerung, seine Überlebenden und seine künftigen Generationen.
    reason: cultural_note
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  choice: Ich werde mich gegen sie erheben
  rationale: Das Qal-Perfekt mit וְ hat im prophetischen Gerichtswort Zukunftsbedeutung. „Sich gegen jemanden erheben“ bewahrt das Bild des entschlossenen feindlichen Eingreifens.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: „Spricht“ gibt die prophetische Botenformel נְאֻם natürlich und feierlich wieder. Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die militärische und kosmische Tragweite von צְבָאוֹת.
- source_word: וְהִכְרַתִּי לְבָבֶל
  choice: ich werde in Babylon … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier die vollständige Beseitigung. Das לְ markiert Babylon als den betroffenen Bereich; „in Babylon … ausrotten“ ist im Deutschen idiomatisch und wahrt diesen Bezug.
- source_word: שֵׁם וּשְׁאָר
  choice: Namen und Überrest
  rationale: „Name“ hält die knappe Bildsprache von fortbestehender Identität und Erinnerung fest; „Überrest“ bezeichnet hier neutral das, was noch übrig ist.
- source_word: נִין וָנֶכֶד
  choice: Spross und Nachkommen
  rationale: Die beiden seltenen Verwandtschaftsbezeichnungen erfassen gemeinsam die fortdauernde Linie über Generationen. Die Wiedergabe vermeidet eine unsichere Festlegung auf genau „Sohn und Enkel“.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die abschließende Wiederholung der prophetischen Formel bleibt erhalten und unterstreicht die Verbindlichkeit des Gerichtsworts.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit sein Charakter als offenbarter Bundesname sichtbar bleibt.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ ist im Deutschen würdevoll und etabliert, ohne die Aussage auf ausschließlich irdische Streitkräfte zu begrenzen; die transparentere Alternative wird in der Fußnote genannt.
- issue: Umfang des angekündigten Gerichts
  choice: Die viergliedrige Reihe bleibt als umfassende Aussage stehen
  alternative: freie Paraphrase als vollständige Vernichtung Babylons
  rationale: Der Text verbindet Erinnerung, Überlebende und künftige Generationen, ohne diese Spannung in einer pauschalen Deutung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-feierlichem Rhythmus. Die zweimalige Formel „spricht Jahwe“ und die knappe viergliedrige Aufzählung wurden bewusst bewahrt.
