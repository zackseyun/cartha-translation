base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: de
  text: 'Die dich sehen, werden dich anstarren und dich eingehend betrachten[a]: »Ist das der Mann, der die Erde erbeben ließ und Königreiche erschütterte,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich prüfen“ beziehungsweise „über dich nachdenken“. Das hebräische Verb kann neben genauem Hinsehen auch sorgfältiges Erwägen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: die dich sehen
  rationale: Das substantivisch gebrauchte Qal-Partizip im Plural mit Suffix der 2. Person maskulin Singular bezeichnet diejenigen, die den angesprochenen Herrscher sehen, und bewahrt die direkte Anrede.
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: werden dich anstarren
  rationale: Der Hiphil von שׁגח bezeichnet hier ein gezieltes, aufmerksames Hinschauen. „Anstarren“ gibt den im Kontext mitschwingenden erstaunten, unverwandten Blick natürlich wieder.
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: dich eingehend betrachten
  rationale: Die Form von בין bezeichnet sorgfältiges Wahrnehmen beziehungsweise prüfendes Betrachten. Die Wiedergabe erhält den visuellen Parallelismus zum vorherigen Ausdruck, ohne den Aspekt genauer Prüfung auszublenden.
- source_word: הֲזֶה הָאִישׁ
  choice: Ist das der Mann
  rationale: Die Fragepartikel mit Demonstrativum leitet eine rhetorische Frage des ungläubigen Staunens ein; „der Mann“ entspricht dem grammatisch und kontextuell männlichen Einzelreferenten.
- source_word: מַרְגִּיז הָאָרֶץ
  choice: der die Erde erbeben ließ
  rationale: Das Hiphil-Partizip drückt das Verursachen von Beben oder Zittern aus. „Erbeben ließ“ bewahrt diese kausative Bedeutung.
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: Königreiche erschütterte
  rationale: Das Hiphil-Partizip von רעשׁ bezeichnet verursachtes Erschüttern. Die knappe Formulierung ist idiomatisch und steht parallel zur vorherigen Aussage.
theological_decisions:
- issue: Bezug von „der Mann“ im Spottlied
  choice: Die Formulierung bezeichnet im Haupttext schlicht einen menschlichen Herrscher.
  alternative: Den Mann ausdrücklich als Satan/Luzifer oder zugleich als babylonischen König und kosmischen Rebellen ausweisen.
  rationale: Der hebräische Text dieses Verses sagt „der Mann“, und der unmittelbare literarische Zusammenhang richtet das Spottlied gegen den König von Babel. Eine spätere theologische Identifikation wird daher nicht in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erstaunte Direktheit der rhetorischen Frage und der poetische Parallelismus bleiben erhalten. Das Komma am Versende zeigt, dass der Satz im folgenden Vers weitergeht. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
