source:
  edition: WLC
  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: de
  text: 'Sogar die Zypressen[a] freuen sich über dich, und die Zedern des Libanon: »Seit du dich niedergelegt hast, zieht kein Holzfäller mehr gegen uns herauf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wacholder oder Tannen; welche Baumart das hebräische Wort genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Sogar
  rationale: 'Das Wort fügt ein überraschendes, betontes Element hinzu: Nicht nur Menschen, sondern selbst die Bäume freuen sich.'
- source_word: בְּרוֹשִׁים
  choice: Zypressen
  rationale: Das hebräische Wort bezeichnet einen Nadelbaum, dessen genaue Art unsicher ist. »Zypressen« ist im Zusammenhang mit den berühmten Nutzhölzern des Libanon eine geläufige Wiedergabe; Alternativen stehen in der Fußnote.
- source_word: שָׂמְחוּ לְךָ
  choice: freuen sich über dich
  rationale: שׂמח mit ל kann Freude über jemanden beziehungsweise aufgrund seines Ergehens ausdrücken. Das Präsens gibt die lebendige Rede des Spottlieds natürlich wieder.
- source_word: אַרְזֵי לְבָנוֹן
  choice: die Zedern des Libanon
  rationale: Die transparente Genitivverbindung bezeichnet die weithin bekannten Zedern des Libanon.
- source_word: מֵאָז
  choice: Seit
  rationale: Bezeichnet den Zeitraum vom Sturz des angesprochenen Herrschers an.
- source_word: שָׁכַבְתָּ
  choice: du dich niedergelegt hast
  rationale: Bewahrt das poetische Bild des Liegens, ohne es ausdrücklich als Tod oder Sturz auszudeuten.
- source_word: לֹא יַעֲלֶה
  choice: kommt kein … mehr herauf
  rationale: Das Imperfekt beschreibt den seit dem Sturz fortdauernden Zustand. »herauf« bewahrt die räumliche Vorstellung des Hinaufziehens zum Libanon.
- source_word: הַכֹּרֵת
  choice: Holzfäller
  rationale: Das substantivierte Partizip von כרת bezeichnet hier denjenigen, der Bäume fällt.
- source_word: עָלֵינוּ
  choice: gegen uns
  rationale: Die Präposition bezeichnet hier die feindlich gegen die personifizierten Bäume gerichtete Bewegung.
theological_decisions:
- issue: Bildhafte Freude der Bäume
  choice: Die Bäume werden im Spottlied über den gestürzten König personifiziert.
  alternative: Eine ausschließlich wörtliche Aussage über das Ende des Holzeinschlags.
  rationale: Der poetische Zusammenhang arbeitet mit Personifikation. Die Übersetzung erhält dieses Bild, statt es erklärend aufzulösen.
- issue: Bedeutung von שָׁכַבְתָּ im Zusammenhang
  choice: Das Bild »du dich niedergelegt hast« bleibt erhalten.
  alternative: »du gestorben bist« oder »du zu Fall gebracht wurdest«
  rationale: Die Wiedergabe bewahrt die Mehrdeutigkeit zwischen Hinlegen, Tod und Niederlage und löst die poetische Spannung nicht voreilig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und die Personifikation bleiben lebendig; die leicht markierte Formulierung »gegen uns herauf« bewahrt sowohl die feindliche Richtung als auch die Aufwärtsbewegung des hebräischen Ausdrucks.
