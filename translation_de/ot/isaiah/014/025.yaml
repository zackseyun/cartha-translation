  text: לִ/שְׁבֹּ֤ר אַשּׁוּר֙ בְּ/אַרְצִ֔/י וְ/עַל הָרַ֖/י אֲבוּסֶ֑/נּוּ וְ/סָ֤ר מֵֽ/עֲלֵי/הֶם֙ עֻלּ֔/וֹ וְ/סֻ֨בֳּל֔/וֹ מֵ/עַ֥ל שִׁכְמ֖/וֹ יָסֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: de
  text: Assur in meinem Land zu zerschlagen[a] und es auf meinen Bergen niederzutreten. Dann wird sein Joch von ihnen weichen, und seine Last wird von der Schulter des Unterdrückten weichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Assyrer“. Der hebräische Ausdruck kann sowohl das Reich Assur als auch dessen repräsentativen Herrscher oder sein Heer bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen steht zunächst der Plural „von ihnen“, danach aber der Singular „von seiner Schulter“. „Des Unterdrückten“ gibt diesen Singular wieder; er kann das unterdrückte Volk als Einheit darstellen oder auf jeden Einzelnen bezogen sein.
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: zu zerschlagen
  rationale: Der Infinitiv von שׁבר setzt den Zweck bzw. Inhalt des vorangehenden Schwurs fort. „Zerschlagen“ bewahrt die kraftvolle Bildsprache.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Der hebräische Name kann das Reich Assur oder kollektiv den Assyrer bzw. dessen Heer bezeichnen. „Assur“ gibt die politische Macht wieder und erlaubt zugleich die folgende Personifikation.
- source_word: בְּאַרְצִי
  choice: in meinem Land
  rationale: „Land“ entspricht אֶרֶץ und bewahrt sowohl den territorialen als auch den theologischen Bezug.
- source_word: וְעַל הָרַי אֲבוּסֶנּוּ
  choice: und es auf meinen Bergen niederzutreten
  rationale: בוס bezeichnet ein Niedertreten oder Zertreten. Das sächliche Pronomen nimmt im Deutschen das Reich Assur auf; „meine Berge“ bleibt als wörtliches und theologisch bedeutsames Bild erhalten.
- source_word: וְסָר
  choice: Dann wird ... weichen
  rationale: Das Perfekt mit ו setzt in diesem prophetischen Zusammenhang die zukünftige Folge fort. „Dann“ verdeutlicht das Ergebnis, ohne einen zusätzlichen Gedanken einzuführen.
- source_word: עֻלּוֹ
  choice: sein Joch
  rationale: Das Joch ist das geläufige Bild für assyrische Herrschaft und Unterdrückung.
- source_word: מֵעֲלֵיהֶם
  choice: von ihnen
  rationale: Die deutsche Wendung „von ihnen weichen“ gibt das Entfernen der auf ihnen liegenden Last natürlich wieder; der Plural des hebräischen Suffixes bleibt sichtbar.
- source_word: סֻבֳּלוֹ
  choice: seine Last
  rationale: „Last“ bezeichnet die aufgezwungene Bürde und bildet eine natürliche Parallele zu „Joch“.
- source_word: מֵעַל שִׁכְמוֹ יָסוּר
  choice: wird von seiner Schulter weichen
  rationale: Die Formulierung bewahrt den masoretischen Singular „seiner Schulter“ sowie die Wiederholung des Verbs סור.
theological_decisions:
- issue: Referent von אַשּׁוּר
  choice: Assur als Reich und unterdrückende Macht, im weiteren Verlauf personifiziert
  alternative: „der Assyrer“ als König, Heer oder repräsentativer Eindringling
  rationale: Der Zusammenhang betrifft die Niederlage der imperialen Macht in Gottes Land. Der Eigenname „Assur“ hält den kollektiven politischen Bezug offen, während die Possessivformen die Macht personifizieren.
- issue: Numeruswechsel bei den Unterdrückten
  choice: Den Wechsel von Plural „ihnen“ zu Singular „seiner Schulter“ bewahren
  alternative: Im Deutschen zu „ihren Schultern“ angleichen
  rationale: Der masoretische Text wechselt ausdrücklich vom Plural zum Singular. Der Singular kann das unterdrückte Volk personifizieren oder distributiv gemeint sein; eine Angleichung würde diese echte Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Assur“ folgt der im Deutschen gebräuchlichen biblisch-historischen Bezeichnung des neuassyrischen Reiches. Die parallele Wiederholung von „weichen“ und der auffällige Numeruswechsel des hebräischen Textes bleiben erhalten.
