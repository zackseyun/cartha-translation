  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֛י/הָ לְ/מוֹרַ֥שׁ קִפֹּ֖ד וְ/אַגְמֵי מָ֑יִם וְ/טֵֽאטֵאתִ֨י/הָ֙ בְּ/מַטְאֲטֵ֣א הַשְׁמֵ֔ד נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: de
  text: Ich mache sie zum Besitz des Igels[a] und zu Wasserlachen; ich fege sie mit dem Besen der Vernichtung hinweg, spricht Jahwe der Heere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort קִפֹּד bezeichnet wahrscheinlich ein Tier, das in Wüsten oder Ruinen lebt. Möglich sind auch Wiedergaben wie »Stachelschwein«, »Eule« oder traditionell »Rohrdommel«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: Ich mache sie
  rationale: שׂוּם bedeutet »setzen, stellen, machen«; mit den folgenden prädikativen Ergänzungen ist »machen« im Deutschen natürlich. Das feminine Pronomen nimmt das personifiziert dargestellte Babylon auf.
- source_word: לְמוֹרַשׁ
  choice: zum Besitz
  rationale: מוֹרָשׁ bezeichnet Besitz beziehungsweise ein in Besitz genommenes Gebiet. Die Formulierung bewahrt das Bild, dass die verwüstete Stadt dem genannten Tier überlassen wird.
- source_word: קִפֹּד
  choice: Igel
  rationale: Die genaue Tierart ist unsicher. »Igel« ist eine plausible moderne Wiedergabe; andere Deutungen werden in der Fußnote genannt.
- source_word: וְאַגְמֵי מָיִם
  choice: und zu Wasserteichen
  rationale: אַגַם bezeichnet einen Teich, Tümpel oder ein sumpfiges Gewässer. »Wasserteiche« erhält sowohl den Plural als auch das Bild der Überflutung und Verödung.
- source_word: וְטֵאטֵאתִיהָ
  choice: ich fege sie … hinweg
  rationale: Das Verb טאטא bedeutet »fegen«. »Hinwegfegen« gibt im Deutschen die auf vollständige Beseitigung zielende Metapher anschaulich wieder.
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: mit dem Besen der Vernichtung
  rationale: Die instrumentale Präposition, der bestimmte Artikel und die Genitivverbindung werden formal und bildhaft wiedergegeben.
- source_word: נְאֻם
  choice: spricht
  rationale: Dies ist eine natürliche und gewichtige deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: צְבָאוֹת bedeutet »Heere, Heerscharen«. »Der Heere« ist transparent, würdig und bewahrt den militärisch-kosmischen Klang des Titels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Umschrift »Jahwe« bewahrt den Charakter als persönlicher Gottesname.
- issue: Bezug der femininen Suffixe
  choice: sie
  alternative: es
  rationale: Die femininen Suffixe beziehen sich auf Babylon als personifizierte Stadt. »Sie« erhält diese prophetische Personifikation.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdig-prophetischem Klang. Die konkrete Kehrmetapher und die Personifikation Babylons bleiben erhalten; die unsichere Tierbezeichnung wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengelegt.
