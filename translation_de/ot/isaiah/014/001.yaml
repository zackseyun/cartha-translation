source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: de
  text: Denn der HERR wird sich über Jakob erbarmen und Israel wieder erwählen. Er wird sie auf ihrem eigenen Land zur Ruhe kommen lassen. Der Fremde[a] wird sich ihnen anschließen, und sie werden sich dem Haus Jakob anschließen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Schutzbürger“ beziehungsweise „der ansässige Fremde“. Das hebräische Wort bezeichnet oft einen Nichtisraeliten, der unter Israel lebt, nicht nur einen vorübergehenden Besucher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie werden dem Haus Jakob angefügt werden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Gerichtsaussage ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: יְרַחֵם יְהוָה
  choice: der HERR wird sich erbarmen
  rationale: Das Piel von רחם bezeichnet inniges Erbarmen. Der Gottesname wird gemäß verbreiteter deutscher Bibelkonvention als „der HERR“ wiedergegeben.
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: und Israel wieder erwählen
  rationale: עוֹד kennzeichnet eine erneute Zuwendung; „erwählen“ bewahrt den theologischen Gehalt von בחר, ohne ihn näher festzulegen.
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  choice: Er wird sie auf ihrem eigenen Land zur Ruhe kommen lassen
  rationale: Die Hifil-Form verbindet das Versetzen ins Land mit dem Gedanken gewährter Ruhe. Diese Wiedergabe bewahrt beide Aspekte besser als das bloße „ansiedeln“.
- source_word: הַגֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet häufig einen nichtisraelitischen Menschen, der als Schutzbürger oder ansässiger Fremder unter Israel lebt; die kurze Haupttextform bleibt verständlich, während die Fußnote die genauere Bedeutungsbreite nennt.
- source_word: וְנִלְוָה ... עֲלֵיהֶם
  choice: wird sich ihnen anschließen
  rationale: Die Form bezeichnet freiwillige Verbindung oder Zugehörigkeit und wird im Deutschen natürlich reflexiv ausgedrückt.
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: und sie werden dem Haus Jakob angefügt werden
  rationale: Das Nifal von ספח ist formal passiv („angefügt werden“). Die Wiedergabe erhält diese grammatische Perspektive und die kollektive Bildsprache von „Haus Jakob“.
theological_decisions:
- issue: Israels erneute Erwählung
  choice: „Israel wieder erwählen“ als erneuerte göttliche Zuwendung nach dem Gericht
  alternative: „Israel erneut bevorzugen“ oder eine ausschließlich nationalpolitische Deutung
  rationale: Der Wortlaut spricht von Erwählung und Wiederherstellung, bestimmt aber nicht ausdrücklich, ob der Schwerpunkt national, eschatologisch oder typologisch ist. Diese Spannung bleibt offen.
- issue: Identität des גֵּר
  choice: „der Fremde“ mit erläuternder Fußnote
  alternative: „der Schutzbürger“ oder „der ansässige Fremde“
  rationale: Der Ausdruck kann einen dauerhaft unter Israel lebenden Nichtisraeliten bezeichnen. Die Übersetzung vermeidet sowohl die Verengung auf einen bloßen Besucher als auch eine übermäßig technische Festlegung.
- issue: Aktive oder passive Nuance von וְנִסְפְּחוּ
  choice: „werden ... angefügt werden“
  alternative: „werden sich ... anschließen“
  rationale: Die Nifal-Form ist passiv beziehungsweise medial deutbar. Der Haupttext bildet die formale passive Lesart ab; die Fußnote bewahrt die mögliche mediale Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Der HERR“ folgt der etablierten deutschen Wiedergabe des Tetragramms; „Haus Jakob“ bewahrt die biblische Familien- und Volksmetapher. Die Satzglieder wurden leicht gegliedert, ohne den gedanklichen Zusammenhang aufzulösen.
