source:
  edition: WLC
  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male servants and female servants. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: de
  text: Völker werden sie nehmen und sie an ihren Ort bringen[a]. Das Haus Israel wird sie im Land Jahwes[b] als Sklaven und Sklavinnen[d] in Besitz nehmen[c]. Sie werden die gefangen nehmen, die sie gefangen hielten[e], und über ihre Unterdrücker herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang ihr angestammtes Land.
    reason: referent_clarification
  - marker: b
    text: Hebräisch JHWH; hier mit „Jahwe“ wiedergegeben.
    reason: divine_name
  - marker: c
    text: 'Oder: „als Erbbesitz übernehmen“. Das hebräische Verb enthält Erbschafts- und Besitzsprache.'
    reason: lexical_alternative
  - marker: d
    text: Im Hebräischen werden männliche und weibliche versklavte Personen eigens genannt.
    reason: lexical_clarification
  - marker: e
    text: 'Wörtlich etwa: „Sie werden zu Fängern ihrer Fänger.“ Im Hebräischen steht ein Wortspiel mit derselben Wurzel für das Gefangennehmen.'
    reason: wordplay
lexical_decisions:
- source_word: וּלְקָחוּם
  choice: werden sie mitnehmen
  rationale: לקח bedeutet im Qal grundsätzlich „nehmen“. Im Zusammenhang mit dem anschließenden Bringen gibt „mitnehmen“ die Bewegung im Deutschen natürlich wieder, ohne die Völker bloß als passive Empfänger darzustellen.
- source_word: עַמִּים
  choice: Völker
  rationale: Die Pluralform bezeichnet ethnische beziehungsweise politische Gemeinschaften; „Völker“ bewahrt diesen Sinn, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: וֶהֱבִיאוּם אֶל־מְקוֹמָם
  choice: und an ihren Ort bringen
  rationale: הביא heißt „bringen“. Das Suffix bezeichnet „ihren Ort“, im Kontext Israels angestammtes Land; die knappe Formulierung lässt diesen Kontextbezug bestehen.
- source_word: וְהִתְנַחֲלוּם
  choice: wird sie … in Besitz nehmen
  rationale: Die Hitpael-Form von נחל enthält Besitz- beziehungsweise Erbschaftssprache. „In Besitz nehmen“ ist im Deutschen verständlich und lässt den Objektsuffix ausdrücklich auf die zuvor genannten Menschen bezogen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die traditionelle kollektive Bezeichnung wird formal bewahrt und nicht auf den verkürzten Namen „Israel“ reduziert.
- source_word: עַל אַדְמַת יְהוָה
  choice: auf dem Land Jahwes
  rationale: אדמה bezeichnet Boden oder Land, und על wird hier natürlich mit „auf“ wiedergegeben. Die Formulierung bewahrt zugleich die Aussage, dass das Land Jahwe gehört.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: als Sklaven und Sklavinnen
  rationale: Die Präposition bezeichnet hier den Status, in den die Betroffenen gelangen. Der hebräische Text nennt ausdrücklich männliche und weibliche versklavte Personen; die direkte Wiedergabe vermeidet eine beschönigende Abschwächung.
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: Sie werden die gefangen nehmen, die sie gefangen hielten
  rationale: Die Formulierung bildet die Wiederholung der Wurzel שבה mit dem deutschen Wortfeld „gefangen nehmen/gefangen halten“ nach und macht die Umkehrung der Verhältnisse idiomatisch verständlich.
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: und über ihre Unterdrücker herrschen
  rationale: רדה bedeutet „herrschen“ oder „Gewalt ausüben“, während נגשׂ hier die Bedränger beziehungsweise Unterdrücker bezeichnet. Die Wiedergabe bleibt breit genug für den Exilskontext.
theological_decisions:
- issue: Die Umkehrung, durch die Israel frühere Bezwinger versklavt
  choice: Die im Hebräischen ausdrücklich genannte Versklavung wird direkt als „Sklaven und Sklavinnen“ wiedergegeben.
  alternative: Die Begriffe mit „Diener und Dienerinnen“ abschwächen oder allgemein als Unterordnung umschreiben.
  rationale: Der Vers schildert eine drastische politische und soziale Umkehrung. Eine Übersetzung soll diese Spannung weder beschönigen noch über den Text hinaus ethisch oder dogmatisch rechtfertigen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. Die Transliteration bewahrt den Charakter als Gottesname, während die Fußnote die zugrunde liegende hebräische Form offenlegt.
- issue: Erbschaftssprache in וְהִתְנַחֲלוּם
  choice: im Haupttext „in Besitz nehmen“, mit „als Erbbesitz übernehmen“ als Fußnotenalternative
  alternative: Nur „erben“ oder „als Erbbesitz erhalten“ schreiben.
  rationale: Die Form trägt Erbschafts- und Besitzbedeutung zugleich. Der Haupttext bleibt verständlich, während die Fußnote die im Deutschen nicht vollständig abbildbare Nuance bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am prophetischen Hebräisch, wird aber durch „mitnehmen“ und den erläuternden Anschluss „und zwar“ idiomatisch lesbar. Die harte Herrschafts- und Sklavereisprache wird nicht euphemistisch abgeschwächt; Fußnoten kennzeichnen echte lexikalische Nuancen und das hebräische Wortspiel.
