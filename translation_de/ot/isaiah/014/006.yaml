  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: de
  text: der Völker im Grimm schlug, mit einem Schlag, der nicht nachließ,[a] der Nationen im Zorn beherrschte, verfolgt, ohne dass jemand Einhalt gebot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit einem Schlag, der nicht abwich“; gemeint ist: der nicht nachließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schluss ist stark verkürzt. Das maskuline Singular-Passivpartizip kann sich auf den Herrscher beziehen: „verfolgt, ohne dass jemand Einhalt gebot“. Im Zusammenhang wird die Wendung auch als Hinweis auf die unablässige Verfolgung der Nationen verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  choice: der Völker … schlug
  rationale: Das Hifil-Partizip beschreibt die fortdauernde, kennzeichnende Gewalttätigkeit des Herrschers. Der Relativsatz fügt sich in den Satzbau des vorangehenden Verses ein; „Völker“ wahrt die Unterscheidung zu גּוֹיִם.
- source_word: בְּעֶבְרָה
  choice: im Grimm
  rationale: עֶבְרָה bezeichnet heftigen, überströmenden Zorn. „Grimm“ ist knapp, kraftvoll und im heutigen gehobenen Deutsch verständlich.
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: mit Schlägen ohne Ende
  rationale: Die figura etymologica mit נכה wird durch „schlug … mit Schlägen“ hörbar gemacht. בִּלְתִּי סָרָה bezeichnet ein Schlagen, das nicht abließ oder nicht aufhörte; die idiomatische Mehrzahl gibt die fortgesetzte Gewalt natürlich wieder.
- source_word: רֹדֶה
  choice: beherrschte
  rationale: רדה kann „herrschen“, „unterwerfen“ oder „niedertreten“ bedeuten. „Beherrschte“ bewahrt den lexikalischen Kern, während der Zorn- und Gewaltkontext die tyrannische Art der Herrschaft erkennen lässt.
- source_word: בָאַף
  choice: im Zorn
  rationale: אַף bedeutet in dieser idiomatischen Verwendung „Zorn“. Die Formulierung erhält die Parallelität zu „im Grimm“.
- source_word: גּוֹיִם
  choice: Nationen
  rationale: „Nationen“ ist die natürliche Entsprechung und unterscheidet גּוֹיִם von עַמִּים, das zuvor mit „Völker“ wiedergegeben wird.
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  choice: mit Verfolgung ohne Einhalt
  rationale: Die knappe und schwierige hebräische Fügung wird als Beschreibung einer ungehemmten Verfolgung innerhalb der Gewaltherrschaft verstanden. „Ohne Einhalt“ gibt בְּלִי חָשָׂךְ wieder, ohne die syntaktische Mehrdeutigkeit im Haupttext unnötig auszuweiten.
theological_decisions:
- issue: Bezug und Syntax von מֻרְדָּף בְּלִי חָשָׂךְ
  choice: Die Schlusswendung beschreibt die rücksichtslose Verfolgung, die von der Gewaltherrschaft ausging.
  alternative: 'Das maskuline passive Partizip kann auch auf den Herrscher bezogen werden: „verfolgt, ohne dass jemand Einhalt gebot“.'
  rationale: Der masoretische Text ist stark verdichtet und syntaktisch schwierig. Der Haupttext folgt dem Parallelismus der vorangehenden Aussagen über die Unterdrückung der Völker; die andere grammatisch mögliche Zuordnung wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige poetische Sprache. Die Wiederholung „schlug … mit Schlägen“ bildet die hebräische Wortwurzel-Wiederholung nach; „ohne Einhalt“ hält den gewaltsamen Ton, ohne konfessionelle oder dogmatische Zusätze.
