source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: de
  text: Du aber bist von deinem Grab fortgeworfen wie ein verabscheuter Zweig[a], bedeckt mit Erschlagenen, mit vom Schwert durchbohrten[b], die zu den Steinen der Grube[c] hinabsteigen – wie ein zertretener Leichnam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein verabscheuter Spross“. Das hebräische Wort kann einen Spross oder Zweig bezeichnen; hier ist etwas Abgelehntes und Weggeworfenes gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit vom Schwert Niedergestochenen“. Der hebräische Ausdruck ist schwierig; gemeint sind offenbar im Kampf Getötete.'
    reason: lexical_alternative
  - marker: c
    text: Die „Grube“ ist ein poetisches Bild für das Grab oder den Bereich der Toten. Die „Steine der Grube“ können an eine mit Steinen ausgekleidete Grabstätte erinnern.
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: bist fern von deinem Grab hingeworfen
  rationale: Der Hofal Perfekt bezeichnet einen passiven, eingetretenen Zustand. מִן drückt hier die Entfernung beziehungsweise den Ausschluss vom eigenen Grab und damit von einer ehrenvollen Bestattung aus.
- source_word: כְּנֵצֶר נִתְעָב
  choice: wie ein verabscheuter Zweig
  rationale: נֵצֶר bezeichnet einen Spross oder Zweig; „Zweig“ bewahrt das Pflanzenbild, ohne an dieser Stelle unnötig messianische Bezüge einzutragen. נִתְעָב bezeichnet etwas Abscheu Erregendes oder Verabscheutes.
- source_word: לְבוּשׁ הֲרֻגִים
  choice: bedeckt mit Erschlagenen
  rationale: לְבוּשׁ verwendet das Bild des Bekleidetseins. Im Deutschen gibt „bedeckt mit“ die wahrscheinlich gemeinte räumliche Vorstellung natürlicher wieder, ohne das Bild völlig aufzulösen.
- source_word: מְטֹעֲנֵי חָרֶב
  choice: mit vom Schwert Durchbohrten
  rationale: Die seltene und schwierige Form wird im Zusammenhang mit den Kriegstoten wahrscheinlich auf Menschen bezogen, die vom Schwert durchbohrt oder niedergestochen wurden. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: die zu den Steinen der Grube hinabsteigen
  rationale: Die konkrete und ungewöhnliche Wendung „Steine der Grube“ bleibt erhalten; das Partizip beschreibt die Getöteten als in die Grube beziehungsweise Totenwelt Hinabsteigende.
- source_word: כְּפֶגֶר מוּבָס
  choice: wie ein zertretener Leichnam
  rationale: פֶגֶר ist ein toter Körper beziehungsweise Leichnam; מוּבָס bezeichnet das Zertretensein. Die Wiedergabe ist prägnant und wahrt die drastische Bildsprache.
theological_decisions:
- issue: Mögliche messianische Assoziation von נֵצֶר
  choice: Zweig
  alternative: Spross
  rationale: Obwohl נֵצֶר in Jesaja 11,1 in einem messianisch verstandenen Zusammenhang vorkommt, bezeichnet es hier im Spottlied über den gestürzten Herrscher etwas Verworfenes. „Zweig“ trägt keine über den Kontext hinausgehende Deutung ein.
- issue: Bedeutung der Grube
  choice: konkretes Bild „Grube“ beibehalten
  alternative: Grab oder Totenreich
  rationale: בּוֹר kann in Todespoesie das Grab oder die Totenwelt bezeichnen, bleibt hier aber mit „Steinen“ konkret verbunden. Die Übersetzung bewahrt diese Spannung, während die Fußnote den poetischen Bedeutungsbereich erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer Bildsprache. Der Gedankenstrich strukturiert die lange poetische Folge, ohne ihre Mehrdeutigkeit aufzulösen. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
