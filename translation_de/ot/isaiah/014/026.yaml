  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung „Das ist … und das ist …“ bewahrt den nachdrücklichen Parallelismus des Hebräischen. „Die Hand, die … ausgestreckt ist“ ist eine natürliche deutsche Wiedergabe.
