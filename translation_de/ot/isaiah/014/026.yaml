source:
  edition: WLC
  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: de
  text: Das ist der Plan, der gegen die ganze Erde[a] gefasst ist, und das ist die Hand, die gegen alle Völker ausgestreckt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ganze Land«, falls hier eher eine Region als die gesamte Erde gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: Das ist der Plan, der … gefasst ist
  rationale: עֵצָה bezeichnet hier einen Plan oder Beschluss; das verwandte passive Partizip הַיְעוּצָה beschreibt ihn als fest geplant. Die idiomatische Wendung „einen Plan fassen“ gibt die enge Wortbeziehung natürlich wieder, ohne die hebräische Wiederholung schwerfällig nachzuahmen.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang des angekündigten Gerichts bezeichnet die Präposition die feindlich gerichtete Zielrichtung.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Parallelismus mit „alle Völker“ spricht hier eher für den weltweiten Horizont; die regionale Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וְזֹאת הַיָּד הַנְּטוּיָה
  choice: und das ist die Hand, die … ausgestreckt ist
  rationale: Die konkrete Hand-Metapher für wirksame Macht im Gericht wird bewahrt; das passive Partizip wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier umfassend die ethnisch-politischen Völker. „Völker“ ist im modernen Deutschen natürlicher als „Nationen“ und vermeidet die unzutreffende Verengung auf „Heiden“.
theological_decisions:
- issue: Reichweite von הָאָרֶץ im Gerichtswort
  choice: 'universale Reichweite: „die ganze Erde“'
  alternative: 'regionale Reichweite: „das ganze Land“'
  rationale: Der parallele Ausdruck „alle Völker“ stützt eine universale Lesart. Da אֶרֶץ lexikalisch auch „Land“ bedeuten kann, wird diese echte Mehrdeutigkeit nicht ausgeschlossen, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild der ausgestreckten Hand bleiben erhalten; „der Plan, der … gefasst ist“ vermeidet die im Deutschen unnatürliche Formulierung „der Plan, der geplant ist“.
