  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: de
  text: Ich will über die Höhen der Wolken hinaufsteigen; ich will mich dem Höchsten gleichmachen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde dem Höchsten gleichen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: Ich steige … hinauf
  rationale: Das Qal-Imperfekt in der 1. Person Singular von עלה bezeichnet eine Aufwärtsbewegung. Die trennbare Formulierung „steige … hinauf“ ist im modernen Deutsch natürlich und bewahrt den Gedanken der Selbstüberhöhung.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit dem Verb des Hinaufsteigens und den „Höhen der Wolken“ bezeichnet עַל hier am ehesten eine die Wolkenhöhen übersteigende Lage.
- source_word: בָּמֳתֵי עָב
  choice: die Höhen der Wolken
  rationale: Der Konstruktus-Plural von במה mit עָב bewahrt das poetische Bild der höchsten Wolkenregionen; „Höhen der Wolken“ gibt dies würdevoll und verständlich wieder.
- source_word: אֶדַּמֶּה
  choice: ich mache mich … gleich
  rationale: Die Hitpael-Form von דמה drückt hier ein Sich-Gleichmachen beziehungsweise Sich-Ähnlichmachen aus. „Ich mache mich … gleich“ erhält die reflexive Nuance und den vermessenen Anspruch.
- source_word: לְעֶלְיוֹן
  choice: dem Höchsten
  rationale: עֶלְיוֹן fungiert im Kontext als Gottesbezeichnung. Der Dativ nach „gleich“ ist idiomatisches Deutsch und „der Höchste“ bewahrt den Titelcharakter.
theological_decisions:
- issue: Wiedergabe von עֶלְיוֹן als Gottesbezeichnung
  choice: dem Höchsten
  alternative: dem Allerhöchsten
  rationale: Der Zusammenhang schildert den Anspruch, sich Gott gleichzustellen. „Der Höchste“ gibt den etablierten göttlichen Titel wieder, ohne spätere Lehrdeutungen in den Vers einzutragen.
- issue: Reichweite des Anspruchs in אֶדַּמֶּה
  choice: ich mache mich dem Höchsten gleich
  alternative: ich werde dem Höchsten gleichen
  rationale: Die gewählte Form bewahrt die reflexive Bedeutung und macht die beabsichtigte Selbstüberhöhung deutlich, ohne eine tatsächliche Erlangung göttlichen Ranges zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildsprache. Die Wortstellung hält die parallelen Ich-Aussagen des hebräischen Spruchs fest; der Gottesname wird als Titel großgeschrieben.
