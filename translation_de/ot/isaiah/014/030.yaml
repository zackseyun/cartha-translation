  text: וְ/רָעוּ֙ בְּכוֹרֵ֣י דַלִּ֔ים וְ/אֶבְיוֹנִ֖ים לָ/בֶ֣טַח יִרְבָּ֑צוּ וְ/הֵמַתִּ֤י בָֽ/רָעָב֙ שָׁרְשֵׁ֔/ךְ וּ/שְׁאֵרִיתֵ֖/ךְ יַהֲרֹֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: de
  text: Die Erstgeborenen der Armen werden weiden[a], und die Bedürftigen werden in Sicherheit lagern; und deine Wurzel werde ich durch Hunger töten[b], und er wird deinen Rest töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Ärmsten der Armen werden weiden.“ Wörtlich steht im Hebräischen „die Erstgeborenen der Armen“; die Wendung kann möglicherweise als Steigerung gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werde ich deine Wurzel durch Hunger töten“. Das folgende „er“ hat im Hebräischen kein ausdrücklich genanntes Bezugswort; gemeint sein könnten der Hunger, ein nicht genannter Vollstrecker des Gerichts oder Gott selbst.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: werden weiden
  rationale: Das Qal von רעה bezeichnet hier das Weiden beziehungsweise Grasen und bewahrt zusammen mit „lagern“ das pastorale Bild.
- source_word: בְּכוֹרֵי דַלִּים
  choice: die Erstgeborenen der Armen
  rationale: Die wörtliche Bedeutung von בכור wird im Haupttext bewahrt; eine mögliche idiomatische Steigerung wird in der Fußnote genannt.
- source_word: וְאֶבְיוֹנִים
  choice: und die Bedürftigen
  rationale: „Bedürftige“ gibt אביונים wieder und hält die Bedeutungsnuance gegenüber דלים, „Armen“, erkennbar.
- source_word: לָבֶטַח יִרְבָּצוּ
  choice: werden in Sicherheit lagern
  rationale: רבץ bezeichnet häufig das sichere Lagern von Tieren; diese Formulierung erhält das pastorale Bild und gibt לבטח natürlich wieder.
- source_word: וְהֵמַתִּי בָרָעָב
  choice: Doch … werde ich durch Hunger absterben lassen
  rationale: Der Hifil von מות bedeutet „sterben lassen“; ב bezeichnet den Hunger als Mittel. „Doch“ macht den inhaltlichen Gegensatz verständlich, ohne ihn theologisch weiter auszudeuten.
- source_word: שָׁרְשֵׁךְ
  choice: deine Wurzel
  rationale: Das Bild der Wurzel wird entsprechend dem hebräischen שׁרשׁ unmittelbar bewahrt.
- source_word: וּשְׁאֵרִיתֵךְ
  choice: deinen Rest
  rationale: „Rest“ gibt שׁארית knapp wieder und passt zur prophetischen Rede von dem, was übrig bleibt.
- source_word: יַהֲרֹג
  choice: er wird … töten
  rationale: Das maskuline Singularpronomen bildet den Wechsel von der ersten zur dritten Person formal ab, ohne den nicht ausdrücklich genannten Täter festzulegen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des abschließenden Verbs יַהֲרֹג
  choice: „er wird deinen Rest töten“
  alternative: „der Hunger wird deinen Rest töten“ oder „ich werde deinen Rest töten“
  rationale: Der hebräische Text wechselt von der ersten Person Singular zu einem Verb in der dritten Person maskulin Singular. Die Übersetzung bewahrt diesen auffälligen Wechsel und legt weder den Hunger noch Gott ausdrücklich als Subjekt fest.
- issue: Verhältnis zwischen der Rettung der Bedürftigen und dem Gericht über Philistäa
  choice: Satzverknüpfung mit „Doch“
  alternative: Reihendes „und“
  rationale: Das hebräische ו kann kontextabhängig adversativ verstanden werden. „Doch“ bringt den deutlichen inhaltlichen Gegensatz natürlich zum Ausdruck, ohne eine zusätzliche dogmatische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weiden“ und „lagern“ bewahren die zusammengehörige Hirten- und Herdenmetaphorik. Die ungewöhnliche Wendung „Erstgeborenen der Armen“ sowie der Wechsel zum nicht näher bestimmten „er“ bleiben bewusst sichtbar und werden durch Fußnoten erläutert.
