base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: de
  text: 'Jahwe der Heere[a] hat geschworen: »Gewiss,[b] wie ich es geplant[c] habe, so ist es geschehen[e]; und wie ich es beschlossen[d] habe, so wird es Bestand haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »der HERR der Heerscharen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Schwurformel, wörtlich: »wenn nicht«; hier als nachdrückliche Bekräftigung gebraucht.'
    reason: source_idiom
  - marker: c
    text: 'Oder: »wie ich es gedacht oder beabsichtigt habe«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »wie ich es beraten oder festgesetzt habe«; der zweite Satzteil kann auch lauten: »so wird es feststehen«.'
    reason: lexical_alternative
  - marker: e
    text: Das hebräische Perfekt kann hier neben der Vergangenheitsbedeutung auch eine als gewiss dargestellte künftige Verwirklichung ausdrücken.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: Die Wiedergabe ist im heutigen Deutsch verständlich und bewahrt den militärischen Sinn des göttlichen Titels.
- source_word: נִשְׁבַּע
  choice: hat geschworen
  rationale: Das Perfekt bezeichnet einen vollzogenen feierlichen Schwur, dessen Geltung im Zusammenhang fortbesteht.
- source_word: לֵאמֹר
  choice: und gesagt
  rationale: Die koordinierte Formulierung gibt die Einleitung der direkten Rede natürlich und quellennah wieder.
- source_word: אִם לֹא
  choice: Ja
  rationale: In einer Schwurformel ist die Wendung keine gewöhnliche Bedingung, sondern eine nachdrückliche Bekräftigung.
- source_word: דִּמִּיתִי
  choice: ich es geplant habe
  rationale: Das Verb kann Denken, Beabsichtigen oder Planen bezeichnen; im Parallelismus mit dem Beschluss bringt „geplant“ die zielgerichtete Absicht klar zum Ausdruck.
- source_word: הָיָתָה
  choice: so ist es geschehen
  rationale: Die feminine Singularform nimmt eine vorausgesetzte Sache oder ein Ereignis auf. Das deutsche Perfekt bewahrt die abgeschlossene Form des Hebräischen, ohne sie stillschweigend in ein Futur umzudeuten.
- source_word: יָעַצְתִּי
  choice: ich es beschlossen habe
  rationale: Das Verb bezeichnet hier beratenes Vorhaben oder festen Entschluss; „beschlossen“ wahrt die entschiedene, deliberative Nuance.
- source_word: הִיא תָקוּם
  choice: so wird es Bestand haben
  rationale: Die Wendung bezeichnet das feste Zustandekommen beziehungsweise Fortbestehen des Beschlossenen und bewahrt mit „Bestand haben“ das Bild von Festigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Die Hauptfassung bewahrt den persönlichen Gottesnamen und übersetzt צְבָאוֹת transparent, ohne die traditionelle Alternative zu verschweigen.
- issue: Aussagekraft der Schwurformel אִם לֹא
  choice: Ja
  alternative: Wahrlich / Wenn nicht
  rationale: Die hebräische Bedingungsform fungiert im Schwur als starke Bekräftigung. Eine wörtliche konditionale Wiedergabe wäre im Deutschen missverständlich.
- issue: Zeitbezug von הָיָתָה
  choice: so ist es geschehen
  alternative: so wird es geschehen
  rationale: Die abgeschlossene hebräische Verbform bleibt in der Hauptfassung sichtbar. Dadurch wird die Spannung zum folgenden Zukunftsausdruck nicht durch eine interpretierende Angleichung beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; zugleich werden unverständliche Hebraismen idiomatisch wiedergegeben. Das Perfekt „ist geschehen“ und das Futur „wird Bestand haben“ bewahren bewusst die aspektuelle Spannung des Ausgangstextes.
