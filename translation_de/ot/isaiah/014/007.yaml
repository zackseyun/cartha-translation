  text: נָ֥חָה שָׁקְטָ֖ה כָּל הָ/אָ֑רֶץ פָּצְח֖וּ רִנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/007.yaml
  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: de
  text: Die ganze Erde ist zur Ruhe gekommen und still geworden; sie[a] brechen in Jubel aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische hat hier ein Verb im Plural, ohne ein neues Subjekt ausdrücklich zu nennen.
    reason: Der pluralische Numerus von פָּצְחוּ soll erhalten bleiben, während die offene Subjektzuordnung des hebräischen Textes nicht ausgedeutet wird.
lexical_decisions:
- source_word: נָחָה
  choice: ist zur Ruhe gekommen
  rationale: Das Qal-Perfekt bezeichnet hier passend das Eintreten einer Ruhe, deren Zustand fortbesteht. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den resultativen Aspekt.
- source_word: שָׁקְטָה
  choice: liegt still
  rationale: Das Qal-Perfekt steht parallel zu נָחָה und beschreibt ungestörte Ruhe. „Liegt still“ verbindet sich idiomatisch mit dem Subjekt „Erde“, ohne die Aussage unnötig auszudeuten.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im weit gespannten Kontext des Spottliedes gibt „die ganze Erde“ die universale Formulierung mit כָּל am besten wieder.
- source_word: פָּצְחוּ
  choice: sie bricht … aus
  rationale: Das Qal-Perfekt 3. Person Plural bezeichnet ein plötzliches Hervorbrechen von Laut oder Gesang. Im Deutschen ist „in Jubel ausbrechen“ idiomatisch. Der Numeruswechsel vom singularischen „Erde“ zum pluralischen Verb bleibt durch „sie“ sichtbar und wird nicht erklärend aufgelöst.
- source_word: רִנָּה
  choice: Jubel
  rationale: Das Substantiv bezeichnet einen hellen, häufig freudigen Ruf oder Gesang. „Jubel“ erfasst die freudige Klangfarbe knapp und natürlich, ohne ausschließlich auf musikalischen Gesang festzulegen.
theological_decisions:
- issue: Numeruswechsel zwischen „die ganze Erde“ und dem pluralischen פָּצְחוּ
  choice: Der Wechsel wird mit „sie bricht“ formal geglättet, wobei „sie“ kollektiv auf die ganze Erde beziehungsweise ihre Bewohner bezogen werden kann.
  alternative: „Alle brechen in Jubel aus“ oder „ihre Bewohner brechen in Jubel aus“.
  rationale: Der hebräische Text nennt kein neues Subjekt. Die gewählte Formulierung vermeidet einen ausdrücklich ergänzten Bezug auf die Bewohner und erhält die poetische Personifikation der Erde, auch wenn das deutsche Verb grammatisch im Singular steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Prägnanz. Der Parallelismus der beiden Ruheverben und der anschließende Umschlag zum Jubel bleiben deutlich.
