base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
translation:
  language: de
  text: Im Todesjahr des Königs Ahas erging dieser Ausspruch:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Botschaft erging«; traditionell auch: »diese Last war da«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: In dem Jahr, als … starb
  rationale: Die hebräische Zeitangabe bedeutet wörtlich „im Jahr des Todes“. Die verbale deutsche Formulierung ist natürlich und gibt den Zeitpunkt präzise wieder.
- source_word: הַמֶּלֶךְ אָחָז
  choice: König Ahas
  rationale: Im modernen Deutschen steht der Titel vor dem Eigennamen gewöhnlich ohne Artikel. Der Name wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: הָיָה
  choice: erging
  rationale: Das Verb bedeutet grundsätzlich „war/geschah“. Zusammen mit מַשָּׂא bezeichnet es hier das Ergehen bzw. Vorliegen der prophetischen Botschaft; „erging“ ist eine natürliche deutsche Wiedergabe der Formel.
- source_word: הַמַּשָּׂא
  choice: Ausspruch
  rationale: מַשָּׂא bezeichnet in prophetischen Überschriften einen feierlichen, häufig gerichtshaltigen Gottesspruch. „Ausspruch“ ist verständlich und vermeidet die im Deutschen missverständliche wörtliche Wiedergabe „Last“.
- source_word: הַזֶּה
  choice: dieser
  rationale: Das Demonstrativpronomen verweist unmittelbar auf die folgende prophetische Botschaft.
theological_decisions:
- issue: Bedeutung von מַשָּׂא in einer prophetischen Überschrift
  choice: Ausspruch
  alternative: Last; Weissagung; Botschaft
  rationale: „Ausspruch“ bewahrt den Charakter einer feierlichen prophetischen Verkündigung, ohne eine ausschließlich belastende Bedeutung festzuschreiben. Die wörtliche Grundbedeutung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung folgt der knappen hebräischen Datierungs- und Überschriftsformel, verwendet aber eine im Deutschen natürliche temporale Konstruktion.
