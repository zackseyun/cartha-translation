source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: de
  text: 'Doch du hast in deinem Herzen gesagt: »Zum Himmel will ich hinaufsteigen; hoch über die Sterne Gottes will ich meinen Thron erheben. Ich will auf dem Berg der Versammlung sitzen, im äußersten Norden[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »auf den Höhen des Zafon«, falls צָפוֹן auf den in altorientalischen Überlieferungen bekannten kosmischen Berg anspielt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Doch du
  rationale: Die Konjunktion und das ausdrücklich gesetzte Pronomen markieren im Kontext einen Gegensatz; »Doch du« gibt ihn im Deutschen knapp und natürlich wieder.
- source_word: אָמַרְתָּ בִלְבָבְךָ
  choice: hast in deinem Herzen gesagt
  rationale: Das Perfekt wird im Deutschen idiomatisch als Perfekt wiedergegeben; »in deinem Herzen« bewahrt das verständliche hebräische Bild für inneres Denken.
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: Zum Himmel will ich hinaufsteigen
  rationale: »Himmel« ist im Deutschen trotz des formal pluralischen hebräischen Ausdrucks die natürliche Bezeichnung; die vorangestellte Zielangabe und »will ich« erhalten den feierlich-prahlerischen Ton.
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: hoch über die Sterne Gottes
  rationale: Die Wendung wahrt das räumliche Bild und lässt offen, ob Sterne, himmlische Wesen oder Mächte gemeint sind.
- source_word: אָרִים כִּסְאִי
  choice: will ich meinen Thron erheben
  rationale: Das Hifil von רום bezeichnet das Erhöhen; »den Thron erheben« bewahrt das Bild der Selbstüberhöhung in würdigem Deutsch.
- source_word: וְאֵשֵׁב
  choice: Ich will … sitzen
  rationale: ישב bedeutet hier zunächst »sitzen«; dies erhält die mögliche Thron- und Herrschaftsvorstellung, ohne sie ausdrücklich einzutragen.
- source_word: בְּהַר מוֹעֵד
  choice: auf dem Berg der Versammlung
  rationale: מוֹעֵד bezeichnet hier wahrscheinlich eine festgesetzte beziehungsweise göttliche Versammlung; die formnahe Wiedergabe wahrt den kosmischen Bildraum.
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: im äußersten Norden
  rationale: יַרְכְּתֵי bezeichnet entlegene Rand- oder äußerste Bereiche. »Im äußersten Norden« ist knapp und lässt die mögliche Anspielung auf Zafon für die Fußnote offen.
theological_decisions:
- issue: Mögliche mythisch-kosmische Anspielung bei צָפוֹן
  choice: Im Haupttext als »Norden« übersetzen.
  alternative: Als Eigenname »Zafon« beziehungsweise als »Höhen des Zafon« wiedergeben.
  rationale: צָפוֹן bedeutet gewöhnlich »Norden«, kann hier aber zugleich auf den aus altorientalischen Überlieferungen bekannten kosmischen Berg Zafon anspielen. Haupttext und Fußnote bewahren beide Deutungsmöglichkeiten, ohne die Anspielung festzuschreiben.
- issue: Bedeutung der »Sterne Gottes«
  choice: Das hebräische Bild »Sterne Gottes« unverändert stehen lassen.
  alternative: Als »himmlische Wesen« oder »göttliche Mächte« auslegen.
  rationale: Die Formulierung kann wirkliche Sterne oder personifiziert gedachte himmlische Wesen und Mächte bezeichnen. Eine deutende Auflösung würde die genuine Mehrdeutigkeit verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Steigerung. Die wiederholte Konstruktion »will ich« trägt den prahlerischen Selbstanspruch; schwer verständliche Archaismen werden vermieden.
