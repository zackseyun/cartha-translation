  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen treffend wieder: die Gesamtheit der Sprechenden, die doppelte Redeformel, die spöttische Einbeziehung mit »Auch du«, die Schwächung sowie die abschließende Gleichstellung mit den anderen Toten. Das Perfekt »bist ... geworden« gibt den resultativen Charakter der hebräischen Perfektformen natürlich wieder.'
