  text: כֻּלָּ֣/ם יַֽעֲנ֔וּ וְ/יֹאמְר֖וּ אֵלֶ֑י/ךָ גַּם אַתָּ֛ה חֻלֵּ֥יתָ כָמ֖וֹ/נוּ אֵלֵ֥י/נוּ נִמְשָֽׁלְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: de
  text: 'Sie alle werden dir antworten und sagen: »Auch du bist schwach geworden wie wir[a]; du bist uns gleich geworden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch du bist geschwächt worden wie wir.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du bist uns gleichgesetzt worden«; auch möglich: »du bist uns vergleichbar geworden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Die Form bezeichnet die Gesamtheit der im Zusammenhang angesprochenen Toten beziehungsweise Könige und bewahrt die umfassende Aussage.
- source_word: יַעֲנוּ וְיֹאמְרוּ אֵלֶיךָ
  choice: werden dir antworten und sagen
  rationale: Die koordinierte Redeformel wird in natürlichem Deutsch wiedergegeben; das Futur bewahrt den Aspekt der angekündigten Reaktion.
- source_word: גַּם אַתָּה
  choice: Auch du
  rationale: Die Formulierung drückt die spöttische Einbeziehung des gestürzten Herrschers in die Gemeinschaft der Entmachteten aus.
- source_word: חֻלֵּיתָ כָמוֹנוּ
  choice: bist schwach geworden wie wir
  rationale: Das Pual von חלה bezeichnet hier im Zusammenhang den Verlust von Kraft und Macht, nicht notwendig Krankheit. Die resultative Bedeutung wird mit »bist … geworden« ausgedrückt.
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: du bist uns gleich geworden
  rationale: נמשל kann Ähnlichkeit, Vergleichbarkeit oder Gleichstellung bezeichnen. Die gewählte Formulierung ist idiomatisch und bewahrt die Aussage, dass der einst Erhabene nun auf derselben Stufe wie die Toten steht.
theological_decisions:
- issue: Art und Aussage des Spottworts im Totenreich
  choice: Die Rede wird als poetischer Spott über den Machtverlust des Königs und seine Gleichstellung mit den Toten wiedergegeben.
  alternative: Die Stelle könnte stärker mythologisch ausgedeutet oder als genaue Lehraussage über den Bewusstseinszustand der Toten formuliert werden.
  rationale: Der Vers stellt die Toten dichterisch als Sprechende dar. Die Übersetzung bewahrt dieses Bild, ohne daraus weitergehende Aussagen über den Zustand nach dem Tod abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aussagen und der spöttische Ton bleiben erhalten; die Formulierungen vermeiden sowohl altertümliche Sprache als auch eine überdeutende Festlegung der poetischen Jenseitsdarstellung.
