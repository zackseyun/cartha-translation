  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: de
  text: Freue dich nicht, ganz Philistäa, weil der Stab dessen, der dich schlug, zerbrochen ist! Denn aus der Wurzel der Schlange wird eine Viper hervorkommen, und ihre Frucht wird eine fliegende Feuerschlange sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְלֶשֶׁת כֻּלֵּךְ
  choice: ganz Philistäa
  rationale: Die feminine Anrede gilt dem Land als Ganzem; „ganz Philistäa“ gibt die Kollektivität natürlich und prägnant wieder.
- source_word: שֵׁבֶט מַכֵּךְ
  choice: der Stock, der dich schlug
  rationale: שֵׁבֶט bezeichnet hier bildhaft ein Schlag- bzw. Herrschaftsinstrument. „Stock“ bewahrt das konkrete Bild, ohne die mögliche politische Bedeutung auszudeuten.
- source_word: צֶפַע
  choice: Viper
  rationale: Die genaue Schlangenart ist unsicher; „Viper“ vermittelt im Deutschen eine gefährliche Giftschlange und entspricht der üblichen semantischen Einordnung.
- source_word: שָׂרָף מְעוֹפֵף
  choice: fliegende Feuerschlange
  rationale: Die wörtliche, bildhafte Verbindung von שָׂרָף und מְעוֹפֵף bleibt erhalten, ohne sie zoologisch oder symbolisch zu erklären.
theological_decisions:
- issue: Identität der aufeinanderfolgenden Schlangenbilder
  choice: Die Bilder „Schlange“, „Viper“ und „fliegende Feuerschlange“ bleiben unidentifiziert.
  alternative: Die Bilder ausdrücklich auf bestimmte assyrische oder judäische Herrscher beziehen.
  rationale: Der Vers selbst nennt keine Personen. Eine historische oder messianische Identifizierung würde die genuine Offenheit des prophetischen Bildes unzulässig festlegen.
- issue: Bezug des Possessivpronomens in וּפִרְיוֹ
  choice: „ihre Frucht“ bezieht sich grammatisch auf die feminine „Schlange“.
  alternative: „dessen Frucht“ auf die Wurzel oder die Viper beziehen.
  rationale: Das maskuline Suffix kann auf נָחָשׁ („Schlange“, grammatisch maskulin) zurückweisen; im Deutschen ist „Schlange“ feminin, daher verlangt der natürliche Rückbezug „ihre“. Die Bildfolge bleibt dabei erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Der Warnruf wird durch ein Ausrufezeichen markiert; die Metaphern bleiben bewusst unaufgelöst.
