source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: de
  text: 'Wie bist du vom Himmel gefallen,


    du Glänzender[a], Sohn der Morgenröte!


    Du wurdest zu Boden gefällt,


    der du die Völker niederstrecktest!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort הֵילֵל (hêlēl) bezeichnet wahrscheinlich eine leuchtende Himmelsgestalt und wird oft als »Morgenstern« verstanden. In einigen älteren Übersetzungen steht traditionell »Luzifer«.
    reason: Bewahrt die wichtige traditionelle Wiedergabe und die spezifischere astronomische Deutung, ohne eine von beiden im Haupttext festzuschreiben.
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet einen erstaunten, klagenden Ausruf ein, ohne ein zusätzliches »Wehe« in den Text einzutragen.
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: bist du vom Himmel gefallen
  rationale: Das deutsche Perfekt gibt den vollendeten Sturz mit gegenwärtiger Wirkung natürlich wieder; »Himmel« bewahrt das erhabene Bild und den Gegensatz zur Erde.
- source_word: הֵילֵל
  choice: du Glänzender
  rationale: Gibt die wahrscheinliche Bedeutung als Bezeichnung einer leuchtenden Himmelsgestalt wieder, ohne die spätere traditionelle Namensform »Luzifer« oder die spezifischere Deutung »Morgenstern« zum eindeutigen Haupttext zu machen.
- source_word: בֶּן־שָׁחַר
  choice: Sohn der Morgenröte
  rationale: Bewahrt die personifizierende, poetische Bildsprache des Hebräischen; »Morgenröte« klingt im heutigen Deutschen würdevoll und bezeichnet שׁחר genauer als das allgemeinere »Morgen«.
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: Du wurdest zur Erde niedergehauen
  rationale: Die Passivform und das gewaltsame Bild des Abhauens werden erhalten; »zur Erde« führt den Gegensatz zwischen Himmel und Erde weiter.
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: der du die Völker bezwangst
  rationale: Gibt die im Kontext wahrscheinliche Bedeutung des Überwältigens oder Unterwerfens idiomatisch wieder. Das Präteritum beschreibt die frühere Macht des nun Gestürzten.
theological_decisions:
- issue: Ob הֵילֵל als Eigenname »Luzifer« wiederzugeben ist
  choice: Beschreibende Wiedergabe »du Glänzender« im Haupttext
  alternative: »Luzifer«, »Morgenstern« oder »Tagesstern«
  rationale: Im hebräischen Ausgangstext ist הֵילֵל nicht eindeutig als Eigenname ausgewiesen. Die beschreibende Wiedergabe erhält das poetische Himmelsbild, während die geschichtlich einflussreiche Form »Luzifer« und die astronomische Deutung als Morgenstern in der Fußnote genannt werden.
translation_notes:
  register: Poetisch, würdevoll und für heutige Leser verständlich. Die Zeilenführung macht die hebräischen Parallelismen sichtbar; die direkte Anrede und der Himmel-Erde-Gegensatz bleiben erhalten.
