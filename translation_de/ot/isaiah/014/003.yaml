  text: וְ/הָיָ֗ה בְּ/י֨וֹם הָנִ֤יחַ יְהוָה֙ לְ/ךָ֔ מֵֽ/עָצְבְּ/ךָ֖ וּ/מֵ/רָגְזֶ֑/ךָ וּ/מִן הָ/עֲבֹדָ֥ה הַ/קָּשָׁ֖ה אֲשֶׁ֥ר עֻבַּד בָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: de
  text: Und es wird geschehen an dem Tag, an dem Jahwe dir Ruhe verschafft von deiner Mühsal[a] und deiner Unruhe und von der harten Arbeit, zu der du gezwungen wurdest[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von deinem Schmerz“ oder „von deinem Kummer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „von der harten Arbeit, die dir auferlegt wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die prophetische Zukunftsformel wird in würdevollem, noch heute verständlichem Deutsch wiedergegeben; der Anschluss an den vorherigen Zusammenhang bleibt durch „Und“ erhalten.
- source_word: בְּיוֹם
  choice: an dem Tag, an dem
  rationale: Die Zeitangabe leitet idiomatisch den Zeitpunkt der folgenden Handlung ein und bewahrt zugleich das Bild des „Tages“.
- source_word: הָנִיחַ
  choice: dir Ruhe verschafft
  rationale: Der Hifil von נוח bezeichnet hier das Gewähren von Ruhe beziehungsweise Entlastung; „Ruhe verschafft“ wahrt den kausativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵעָצְבְּךָ
  choice: von deiner Mühsal
  rationale: עֶצֶב kann Schmerz, Kummer oder leidvolle Mühe bezeichnen. „Mühsal“ passt zum Kontext bedrückender Zwangsarbeit, ohne den Ausdruck rein körperlich oder rein seelisch einzuengen.
- source_word: וּמֵרָגְזֶךָ
  choice: und deiner Unruhe
  rationale: רֹגֶז bezeichnet Erregung, Unruhe oder Aufruhr. „Unruhe“ ist natürliches Deutsch und lässt offen, ob vor allem innere Erschütterung oder bedrängende Lebensumstände gemeint sind.
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: von der harten Arbeit
  rationale: עֲבֹדָה bezeichnet Arbeit oder Dienst, קָשֶׁה deren Härte. Der Zusammenhang zeigt auferlegte, bedrückende Arbeit, ohne dass das Substantiv allein eine bestimmte Form der Sklaverei festlegt.
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: zu der du gezwungen wurdest
  rationale: Die passive Form von עבד mit ב drückt aus, dass dem Angeredeten der Dienst auferlegt wurde. Die deutsche Formulierung macht den Zwang deutlich und vermeidet eine unnatürlich wörtliche Konstruktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname ausdrücklich. „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Art der bedrückenden Arbeit
  choice: harte Arbeit, zu der du gezwungen wurdest
  alternative: harte Sklavenarbeit, die dir auferlegt wurde
  rationale: Der Zwang ist grammatisch und kontextuell deutlich, doch der Vers benennt nicht ausdrücklich eine rechtlich definierte Form von Sklaverei. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz endet mit einem Komma, weil die in Vers 3 begonnene Zeitkonstruktion in Vers 4 syntaktisch fortgeführt wird. Die Anrede bleibt im Singular, entsprechend dem hebräischen Text.
