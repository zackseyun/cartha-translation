  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: de
  text: Und was wird man den Boten des Volkes[a] antworten? Dass Jahwe Zion gegründet hat und dass in ihr die Bedrängten[b] seines Volkes Zuflucht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gesandten des Volkes“. Das hebräische Wort kann auch diplomatische Abgesandte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Armen seines Volkes“ beziehungsweise „die Demütigen seines Volkes“. Das hebräische Wort kann wirtschaftliche Armut, Bedrängnis oder Niedrigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: Und was soll man … antworten?
  rationale: Das Waw wahrt den Zusammenhang mit dem Vorhergehenden. Die unbestimmte deutsche Konstruktion mit „man“ gibt die generisch gebrauchte 3. Person Singular wieder; „soll“ entspricht in der Frage natürlichem, gegenwartsbezogenem Deutsch.
- source_word: מַלְאֲכֵי גוֹי
  choice: den Boten des Volkes
  rationale: מַלְאָךְ kann allgemein einen Boten oder im politischen Zusammenhang einen Gesandten bezeichnen. Der Singular גוֹי ist bestimmt aufgefasst und verweist wahrscheinlich auf das zuvor angesprochene Volk.
- source_word: כִּי
  choice: Dass
  rationale: כִּי leitet hier am natürlichsten den Inhalt der zu gebenden Antwort ein, nicht zwingend eine kausale Begründung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִסַּד צִיּוֹן
  choice: Zion gegründet hat
  rationale: יסד bezeichnet das Gründen oder feste Errichten und kann einen architektonischen Unterton tragen. Das Perfekt formuliert Gottes Gründung als vollzogene, weiterhin gültige Tat.
- source_word: וּבָהּ
  choice: und dass in ihr
  rationale: Das feminine Suffix bezieht sich auf Zion. „In ihr“ bewahrt die im Hebräischen naheliegende Darstellung Zions als weiblich gedachte Stadt.
- source_word: יֶחֱסוּ
  choice: Zuflucht finden
  rationale: חסה bezeichnet das Zufluchtnehmen beziehungsweise Sichbergen. „Zuflucht finden“ ist idiomatisch und gibt den Schutzaspekt klar wieder.
- source_word: עֲנִיֵּי עַמּוֹ
  choice: die Bedrängten seines Volkes
  rationale: עָנִי kann Arme, Elende, Bedrängte oder Demütige bezeichnen. „Bedrängte“ passt zum Schutz- und Zufluchtskontext, ohne die Bedeutung ausschließlich wirtschaftlich oder innerlich zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt den Eigennamen in gebräuchlicher deutscher Form.
- issue: Personifizierung Zions
  choice: in ihr
  alternative: dort; in ihm
  rationale: Das feminine hebräische Pronomen verweist auf Zion als Stadt. Die feminine Form bewahrt das prophetische Stadtbild, ohne zusätzliche theologische Festlegung.
- issue: Bedeutungsbreite von עֲנִיֵּי
  choice: die Bedrängten
  alternative: die Armen; die Demütigen
  rationale: Der Kontext betont Schutz für gefährdete Angehörige von Gottes Volk. Da das Wort sowohl äußere Not als auch Armut oder Niedrigkeit bezeichnen kann, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frageform ist idiomatisch, während die Satzstruktur und die feminine Bezugnahme auf Zion eng am Hebräischen bleiben. Die Fußnotenmarker stehen unmittelbar nach dem jeweils erklärungsbedürftigen Ausdruck.
