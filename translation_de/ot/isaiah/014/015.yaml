  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: de
  text: Doch wirst du zum Scheol[a] hinabgebracht, in die Tiefen der Grube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Grab“ oder „das Totenreich“ für „Scheol“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt den scharfen Gegensatz zum zuvor geäußerten Anspruch des Aufstiegs. „Doch“ gibt diese rhetorische Umkehrung im Deutschen knapp und natürlich wieder; eine bekräftigende Nuance wie „gewiss“ bleibt grundsätzlich möglich.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt die hebräische Vorstellung vom Bereich der Toten, ohne den Ausdruck auf ein einzelnes Grab zu verengen oder mit einer später ausformulierten Lehre von der Hölle gleichzusetzen.
- source_word: תּוּרָד
  choice: wirst du hinabgebracht
  rationale: Die Hophal-Form von ירד ist kausativ-passiv. „Wirst du hinabgebracht“ erhält sowohl das Passiv als auch die im Zusammenhang liegende erniedrigende Umkehrung.
- source_word: יַרְכְּתֵי
  choice: die Tiefen
  rationale: Das Wort bezeichnet die innersten, äußersten oder entlegensten Bereiche. In Verbindung mit der Abwärtsbewegung gibt „die Tiefen“ das räumliche Bild natürlich und prägnant wieder.
- source_word: בּוֹר
  choice: Grube
  rationale: „Grube“ entspricht dem Bild eines tiefen Ortes des Hinabfahrens und der Erniedrigung. „Grab“ würde die poetische Parallele zu Scheol unnötig verengen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל in einem poetischen Gerichtswort
  choice: Scheol
  alternative: Grab; Totenreich
  rationale: „Scheol“ erhält das eigenständige hebräische Bild vom Bereich der Toten und vermeidet sowohl eine Beschränkung auf das physische Grab als auch die Eintragung einer später präzisierten Höllenvorstellung. Die theologische Offenheit des Ausdrucks bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt durch „Doch“ den Gegensatz zwischen dem beanspruchten Aufstieg und dem tatsächlichen Hinabgebrachtwerden hervor; „bis in“ macht das Ziel und die äußerste Tiefe idiomatisch deutlich.
