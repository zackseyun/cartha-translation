id: ISA.14.20
reference: Isaiah 14:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: de
  text: Du wirst nicht gemeinsam mit ihnen bestattet werden, denn du hast dein Land zugrunde gerichtet, dein Volk erschlagen. Die Nachkommenschaft von Übeltätern[a] wird niemals mehr genannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Same von Übeltätern“; gemeint sein können Nachkommen oder eine ganze Nachkommenschaft.'
    reason: Die kollektive Bedeutung von זֶרַע und der allgemeine Plural „Übeltäter“ sollen sichtbar bleiben.
lexical_decisions:
- source_word: לֹא תֵחַד אִתָּם בִּקְבוּרָה
  choice: Du wirst nicht gemeinsam mit ihnen bestattet werden
  rationale: Die natürliche deutsche Formulierung gibt das Verb יחד mit אִתָּם sowie das abstrakte קְבוּרָה als Ausschluss von einer gemeinsamen Bestattung wieder, ohne einen bestimmten Grabort vorauszusetzen.
- source_word: אַרְצְךָ שִׁחַתָּ
  choice: du hast dein Land zugrunde gerichtet
  rationale: „Land“ bewahrt den politischen und territorialen Sinn von אֶרֶץ. „Zugrunde gerichtet“ gibt die starke, zerstörerische Bedeutung des Piel von שׁחת idiomatisch wieder.
- source_word: עַמְּךָ הָרָגְתָּ
  choice: dein Volk erschlagen
  rationale: Die vorangestellte Objektphrase bleibt erkennbar und unterstreicht den Vorwurf, dass der Herrscher sein eigenes Volk getötet hat. „Erschlagen“ wahrt den gehobenen prophetischen Ton, ohne die zusätzliche juristische Festlegung von „ermordet“.
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: wird niemals mehr genannt werden
  rationale: Die Wiedergabe erhält das passive Niphal und den Gedanken dauerhafter Tilgung von Name beziehungsweise Andenken, ohne zwischen Benennung und Erwähnung abschließend zu entscheiden.
- source_word: זֶרַע מְרֵעִים
  choice: die Nachkommenschaft von Übeltätern
  rationale: „Nachkommenschaft“ bewahrt den kollektiven Singular von זֶרַע; „von Übeltätern“ gibt den grammatischen Plural מְרֵעִים wieder und engt den Ausdruck nicht ausdrücklich auf einen einzigen Herrscher ein.
theological_decisions:
- issue: Bezeichnet זֶרַע מְרֵעִים ausschließlich die Dynastie des angesprochenen Tyrannen oder allgemeiner die Nachkommenschaft von Übeltätern?
  choice: Die grammatisch allgemeine und plurale Formulierung „Nachkommenschaft von Übeltätern“ bleibt erhalten.
  alternative: „Die Nachkommen dieses Übeltäters“ beziehungsweise „die Nachkommenschaft des Bösen“.
  rationale: Der Zusammenhang legt die Familie oder Dynastie des angesprochenen Herrschers nahe, doch der hebräische Wortlaut bezeichnet ihn nicht ausdrücklich als einzigen Bezugspunkt. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutet לֹא יִקָּרֵא vor allem, keinen Namen zu tragen, nicht ausgerufen zu werden oder nicht mehr erwähnt zu werden?
  choice: „wird niemals mehr genannt werden“
  alternative: „wird nie mehr einen Namen tragen“ oder „wird nie mehr erwähnt werden“.
  rationale: „Genannt werden“ hält die Bedeutungsbreite von קרא offen und vermeidet eine Festlegung auf bloße Erinnerung oder formale Namensgebung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Anklagesätze und ihre Parallelität bleiben erhalten; altertümliche Ausdrücke und konfessionell geprägte Deutungen werden vermieden.
