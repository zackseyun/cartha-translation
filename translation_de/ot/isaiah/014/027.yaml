base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: de
  text: Denn Jahwe der Heerscharen hat es beschlossen – wer könnte es vereiteln?[a] Seine Hand ist ausgestreckt[b] – wer könnte sie zurückwenden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wer könnte es aufheben?« Das hebräische Verb kann bedeuten, einen Plan zu brechen, zunichtezumachen oder zu durchkreuzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Seine Hand ist ausgestreckt.« Das Bild bezeichnet wirksame Machtausübung, häufig im Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt die bewusst weite Bedeutung des Titels, die himmlische wie irdische Mächte umfassen kann.
- source_word: יָעָץ
  choice: hat es beschlossen
  rationale: Das Verb bezeichnet das Fassen eines Plans oder Entschlusses. Das ergänzte »es« verweist auf das zuvor angekündigte Vorhaben und ermöglicht im Deutschen einen klaren Rückbezug.
- source_word: יָפֵר
  choice: könnte es vereiteln
  rationale: Die Hifil-Form von פרר kann das Brechen, Aufheben oder Durchkreuzen eines Plans bezeichnen. »Vereiteln« ist im Zusammenhang mit einem Beschluss idiomatisch, ohne die Aussage abzuschwächen.
- source_word: יָדוֹ הַנְּטוּיָה
  choice: Seine Hand ist ausgestreckt
  rationale: Die konkrete hebräische Metapher bleibt erhalten und bezeichnet Gottes wirksame Machtausübung, in diesem Zusammenhang besonders sein Gerichtshandeln.
- source_word: יְשִׁיבֶנָּה
  choice: wer könnte sie zurückwenden
  rationale: Die feminine Objektendung bezieht sich auf »Hand«. »Zurückwenden« gibt die kausative Bedeutung von שוב wieder und bewahrt das Bild einer bereits zum Handeln ausgestreckten Hand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: »Jahwe« bewahrt den im hebräischen Text ausdrücklich verwendeten Eigennamen. »Heerscharen« lässt die Reichweite des Titels offen und beschränkt ihn nicht vorschnell auf menschliche Armeen.
- issue: Unwiderstehlichkeit von Jahwes Beschluss und Handeln
  choice: 'zwei rhetorische Fragen: »wer könnte …?«'
  alternative: Aussagesätze wie »niemand kann …«
  rationale: Die rhetorische Form des Hebräischen wird bewahrt. Sie bringt die Gewissheit zur Sprache, ohne die Fragen in erklärende Aussagen umzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur und die beiden rhetorischen Fragen des Hebräischen bleiben erhalten; die anthropomorphe Bildsprache wird nicht aufgelöst.
