id: ISA.14.21
reference: Isaiah 14:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָכִ֧ינוּ לְ/בָנָ֛י/ו מַטְבֵּ֖חַ בַּ/עֲוֺ֣ן אֲבוֹתָ֑/ם בַּל יָקֻ֨מוּ֙ וְ/יָ֣רְשׁוּ אָ֔רֶץ וּ/מָלְא֥וּ פְנֵֽי תֵבֵ֖ל עָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: de
  text: Bereitet seinen Söhnen die Schlachtbank wegen der Schuld ihrer Väter[a], damit sie sich nicht erheben, das Land in Besitz nehmen[b] und den Erdkreis mit Städten füllen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der Verfehlung ihrer Väter“; das hebräische Wort kann Schuld, Verfehlung oder die aus der Schuld folgende Strafe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land erben“; das hebräische Verb kann „erben“, „in Besitz nehmen“ oder „besitzen“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „das Angesicht des Erdkreises mit Städten füllen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: הָכִינוּ
  choice: Bereitet
  rationale: Der Hifil-Imperativ im Plural fordert unmittelbar dazu auf, etwas herzurichten. „Bereitet“ bewahrt Befehlsform und Kürze.
- source_word: לְבָנָיו
  choice: seinen Söhnen
  rationale: Die Form bezeichnet wörtlich „seine Söhne“. Eine allgemeinere Wiedergabe wie „seine Nachkommen“ wäre kontextuell möglich, ist aber weniger direkt.
- source_word: מַטְבֵּחַ
  choice: die Schlachtbank
  rationale: Das Substantiv bezeichnet das Schlachten beziehungsweise einen Ort des Schlachtens. „Schlachtbank“ gibt das gewaltsame Gerichtsbild in natürlichem, prägnantem Deutsch wieder, ohne es zum militärischen Kampf umzudeuten.
- source_word: בַּעֲוֺן אֲבוֹתָם
  choice: wegen der Schuld ihrer Väter
  rationale: Die Präposition wird kausal verstanden. עָוֹן kann Schuld, Verfehlung oder die aus Schuld folgende Strafe bezeichnen; „Schuld“ hält die moralische Dimension fest, ohne die Folgewirkung auszuschließen.
- source_word: בַּל
  choice: damit … nicht
  rationale: בַּל leitet hier einen negativen Zweck- oder Ergebnissatz ein. Die moderne deutsche Konstruktion ist klarer und natürlicher als das gehobene „auf dass nicht“.
- source_word: יָקֻמוּ
  choice: sie sich erheben
  rationale: קום kann sowohl das buchstäbliche Aufstehen als auch das Erstarken oder Auftreten zur Macht bezeichnen. „Sich erheben“ bewahrt diese politische Mehrdeutigkeit.
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: das Land in Besitz nehmen
  rationale: ירשׁ kann „erben“, „in Besitz nehmen“ oder „besitzen“ bedeuten. „In Besitz nehmen“ passt zum Kontext dynastischer Herrschaft, ohne vorschnell einen bundestheologischen Erbanspruch einzutragen. „Land“ hält אָרֶץ von תֵבֵל („Erdkreis“) im folgenden Satzteil unterscheidbar.
- source_word: וּמָלְאוּ פְנֵי תֵבֵל
  choice: den Erdkreis … füllen
  rationale: תֵבֵל bezeichnet den bewohnten Erdkreis. Im Haupttext wird die hebräische Wendung „das Angesicht des Erdkreises füllen“ idiomatisch verkürzt; die Bildform bleibt in der Fußnote dokumentiert.
- source_word: עָרִים
  choice: mit Städten
  rationale: Der masoretische Text hat den Plural „Städte“. Die Wiedergabe bewahrt das Bild einer weltweiten Ausbreitung städtischer Herrschaft.
theological_decisions:
- issue: Generationenübergreifendes Gericht
  choice: Die Söhne werden ausdrücklich im Zusammenhang mit der Schuld ihrer Väter dem Gericht ausgesetzt.
  alternative: Die Aussage ausdrücklich darauf beschränken, dass die Söhne dieselben Sünden fortsetzen, oder עָוֹן ausschließlich als bereits verhängte Strafe deuten.
  rationale: Der hebräische Wortlaut stellt die Verbindung her, erklärt aber nicht, wie persönliche und generationenübergreifende Verantwortung zueinander stehen. Die Übersetzung bewahrt diese theologische Spannung, statt sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schlachtbank“ erhält die Härte des Gerichtsbildes; „damit … nicht“ vermeidet unnötig altertümliche Syntax. „Land“ und „Erdkreis“ geben die unterschiedlichen hebräischen Wörter אָרֶץ und תֵבֵל erkennbar wieder.
