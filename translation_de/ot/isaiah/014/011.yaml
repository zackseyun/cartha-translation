id: ISA.14.11
reference: Isaiah 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: de
  text: Ins Totenreich[b] hinabgebracht sind deine Pracht[a] und der Klang deiner Harfen[c]. Unter dir sind Maden ausgebreitet, und Würmer sind deine Decke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dein Hochmut; auch: deine Hoheit. Das hebräische Wort kann sowohl erhabene Pracht als auch stolze Überheblichkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Scheol, der Bereich der Toten; auch mit „Grab“ wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Leiern; gemeint sind harfen- oder leierartige Saiteninstrumente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: hinabgebracht sind
  rationale: Der Hofal von ירד bezeichnet ein verursachtes Hinabsteigen in passiver Form. Das deutsche Perfekt stellt die Erniedrigung als vollzogen dar.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: „Totenreich“ gibt die althebräische Vorstellung vom Aufenthaltsbereich der Toten verständlich wieder, ohne sie auf ein einzelnes Grab zu verengen oder mit späteren Vorstellungen von der Hölle gleichzusetzen.
- source_word: גְּאוֹנֶךָ
  choice: deine Pracht
  rationale: גאון kann Hoheit, Pracht oder Hochmut bezeichnen. Im Zusammenhang mit dem gestürzten König steht seine herrscherliche Pracht im Vordergrund, während die mögliche Nebenbedeutung des Hochmuts in einer Fußnote erhalten bleibt.
- source_word: הֶמְיַת נְבָלֶיךָ
  choice: der Klang deiner Harfen
  rationale: הֶמְיָה bezeichnet hier den Klang beziehungsweise das Getöse der נְבָלִים, harfen- oder leierartigen Saiteninstrumente.
- source_word: תַּחְתֶּיךָ יֻצַּע רִמָּה
  choice: Unter dir sind Maden ausgebreitet
  rationale: יצע wird für das Ausbreiten oder Herrichten einer Unterlage gebraucht. „Maden“ bewahrt die drastische Verwesungsmetaphorik von רִמָּה.
- source_word: וּמְכַסֶּיךָ תּוֹלֵעָה
  choice: und Würmer sind deine Decke
  rationale: Die knappe Nominalkonstruktion wird im Deutschen als Prädikativsatz wiedergegeben. „Decke“ erhält das Gegenbild zur unter dem Toten ausgebreiteten Unterlage.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: Der Vers schildert den Abstieg in den Bereich der Toten. „Totenreich“ bewahrt diese Vorstellung, ohne den Ausdruck auf das physische Grab zu reduzieren oder mit einer später ausgebildeten Höllenlehre gleichzusetzen.
- issue: Bedeutung von גָּאוֹן
  choice: Pracht
  alternative: Hochmut; Hoheit
  rationale: Im Spottlied wird die königliche Herrlichkeit erniedrigt; zugleich kann das Wort moralisch wertenden Hochmut anklingen lassen. Die Hauptübersetzung folgt dem Bild königlicher Pracht, die Fußnote wahrt die Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, poetischem Ton. Die parallelen Bilder von einer Unterlage aus Maden und einer Decke aus Würmern bleiben bewusst drastisch. Die asyndetische hebräische Folge von „Pracht“ und „Klang deiner Harfen“ wird als natürliche deutsche Reihung wiedergegeben.
