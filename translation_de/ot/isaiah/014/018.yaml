source:
  edition: WLC
  text: כָּל מַלְכֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם שָׁכְב֥וּ בְ/כָב֖וֹד אִ֥ישׁ בְּ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/018.yaml
  text: All the kings of the nations[a], all of them, lie in glory[b], each in his own house.
translation:
  language: de
  text: Alle Könige der Völker, sie alle, liegen in Ehren[a], jeder in seinem Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Herrlichkeit“ beziehungsweise „mit Ehre“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in seinem Haus“; im Zusammenhang ist damit wahrscheinlich sein Grab oder seine Grabkammer gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַלְכֵי גוֹיִם
  choice: Alle Könige der Völker
  rationale: Die Konstruktion bezeichnet die Gesamtheit der Könige anderer Völker. „Völker“ gibt גוֹיִם im Zusammenhang sachlich und ohne unnötige Zuspitzung wieder.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Das wiederaufnehmende Pronomen verstärkt die vorausgehende Gesamtaussage. Die ausdrückliche Wiedergabe bewahrt diese hebräische Betonung.
- source_word: שָׁכְבוּ
  choice: liegen
  rationale: Im Bestattungszusammenhang beschreibt das Verb den bleibenden Zustand der verstorbenen Könige. „Liegen“ wahrt das Bild, ohne es als „ruhen“ oder „schlafen“ weiter auszudeuten.
- source_word: בְכָבוֹד
  choice: in Ehren
  rationale: כָבוֹד bezeichnet hier die Ehre beziehungsweise Würde einer ordnungsgemäßen königlichen Bestattung. „In Ehren“ ist im Deutschen natürlich und bewahrt den ehrenden Sinn; „in Herrlichkeit“ wäre formaler, könnte hier aber missverständlich klingen.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird in dieser distributiven Konstruktion idiomatisch mit „jeder“ wiedergegeben und bezieht sich auf die zuvor genannten Könige.
- source_word: בְבֵיתוֹ
  choice: in seinem Haus
  rationale: Die Übersetzung hält am wörtlichen Bild „Haus“ fest. Im Kontext kann damit die Grabstätte oder Grabkammer jedes Königs gemeint sein, doch diese Deutung wird nicht stillschweigend in den Haupttext eingesetzt.
theological_decisions:
- issue: Deutung von „Haus“ im Bestattungskontext
  choice: Das Bild „Haus“ bleibt im Haupttext erhalten.
  alternative: „Grab“, „Grabstätte“ oder „Grabkammer“
  rationale: Der Kontext legt eine königliche Grabstätte nahe, während der hebräische Wortlaut ausdrücklich „Haus“ sagt. Die Fußnote macht die wahrscheinliche Bedeutung zugänglich, ohne die Bildsprache zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung „Alle … sie alle“ und die distributive Wendung „jeder“ bleiben erhalten. Die konkrete Bildsprache des hebräischen Textes wird nicht unnötig geglättet.
