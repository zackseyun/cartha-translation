  naturalness: „Alle Könige der Völker, sie alle, liegen in Ehren, jeder in seinem Haus“ ist würdiges, verständliches modernes Standarddeutsch. Die leichte Wiederholung ist hier als bewusste Wiedergabe der hebräischen Emphase natürlich genug.
  terminology: „Völker“, „in Ehren“ und „Haus“ sind kontextgerecht. Die Fußnoten sind an den sachlich passenden deutschen Ankern angebracht und erläutern sowohl die lexikalische Alternative zu „in Ehren“ als auch den möglichen Grabbezug von „Haus“.
