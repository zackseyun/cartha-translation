id: ISA.14.5
reference: Isaiah 14:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׁבַ֥ר יְהוָ֖ה מַטֵּ֣ה רְשָׁעִ֑ים שֵׁ֖בֶט מֹשְׁלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/005.yaml
  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
translation:
  language: de
  text: 'Jahwe hat den Stab der Frevler zerbrochen,

    das Zepter der Herrscher.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַר
  choice: hat … zerbrochen
  rationale: Das Qal Perfekt bezeichnet eine vollendete Handlung; das deutsche Perfekt gibt im poetischen Zusammenhang deren gegenwärtige Tragweite natürlich wieder. „Zerschmettert“ wäre stärker als nötig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: מַטֵּה
  choice: Stab
  rationale: מַטֶּה bezeichnet einen Stab beziehungsweise eine Rute. „Stab“ wahrt zusammen mit „Zepter“ die parallelen, aber verschiedenen Herrschaftsbilder.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivierte Adjektiv im Plural bezeichnet schuldhaft böse Menschen. „Frevler“ ist knapp, geschlechtsübergreifend kollektiv lesbar und dem würdigen poetischen Register angemessen.
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: שֵׁבֶט kann Stab, Rute oder Zepter bedeuten. In Verbindung mit den Herrschenden bezeichnet es hier plausibel ein Sinnbild beziehungsweise Werkzeug ihrer Herrschaft.
- source_word: מֹשְׁלִים
  choice: der Herrscher
  rationale: Das substantivierte Qal-Partizip Plural von משל bedeutet „die Herrschenden“. „Herrscher“ ist direkt und vermeidet die kontextuell mögliche, aber im Wort selbst nicht enthaltene Wertung „Tyrannen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Moralische Kennzeichnung der Herrschenden
  choice: Herrscher
  alternative: Tyrannen
  rationale: מֹשְׁלִים bezeichnet für sich genommen Herrschende. Die negative Bewertung ergibt sich aus dem Parallelismus mit „Frevler“ und dem Kontext; „Tyrannen“ würde sie zusätzlich in das einzelne Wort hineintragen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der zweigliedrige Parallelismus und die beiden Herrschaftsbilder „Stab“ und „Zepter“ bleiben erhalten; wegen der im Deutschen klaren und natürlichen Wortwahl ist keine Fußnote erforderlich.
