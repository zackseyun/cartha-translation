source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: de
  text: Heule[a], du Tor! Schrei auf, du Stadt! Schmilz dahin[b], ganz Philistäa! Denn von Norden kommt Rauch, und in seinen Reihen gibt es keinen Nachzügler.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jammere“; das hebräische Verb bezeichnet einen lauten Klage- oder Notruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Verzage“ beziehungsweise „löse dich vor Angst auf“. Das hebräische Bild kann das Schwinden des Mutes und einen völligen Zusammenbruch bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Und keiner ist vereinzelt an seinen festgesetzten Orten.“ Die hebräische Schlussformulierung ist ungewöhnlich und kann auf die vollständig versammelten und geordneten Truppen des Angreifers bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Heule
  rationale: Der feminine Singularimperativ von ילל bezeichnet einen lauten Klage- oder Notruf. „Heule“ bewahrt die Eindringlichkeit und passt zur direkten Anrede des Tores.
- source_word: שַׁעַר
  choice: du Tor
  rationale: Das Tor wird als Teil und Repräsentant der Stadt direkt angeredet. „Du“ macht den Vokativ im heutigen Deutschen natürlich deutlich.
- source_word: זַעֲקִי
  choice: Schrei auf
  rationale: Der feminine Singularimperativ von זעק fordert zu einem dringenden, lauten Hilferuf oder Klageschrei auf. „Schrei auf“ ist knapp und idiomatisch.
- source_word: עִיר
  choice: du Stadt
  rationale: Wie das Tor wird auch die Stadt personifiziert und direkt angeredet; der feminine Imperativ stützt diese Wiedergabe.
- source_word: נָמוֹג
  choice: Schmilz dahin
  rationale: מוג beschreibt ein Schmelzen, Zerfließen oder den Zusammenbruch des Mutes. Die bildhafte Wiedergabe lässt körperlichen, emotionalen und gesellschaftlichen Zusammenbruch zugleich anklingen.
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: ganz Philistäa
  rationale: Das feminine Suffix bezeichnet Philistäa in seiner Gesamtheit. „Ganz Philistäa“ gibt die kollektive Anrede knapp und natürlich wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet den Grund für die vorangehenden Klagerufe ein.
- source_word: מִצָּפוֹן
  choice: von Norden
  rationale: Die Richtungsangabe weist auf die Herkunft der drohenden Macht hin, ohne sie ausdrücklich zu identifizieren.
- source_word: עָשָׁן
  choice: Rauch
  rationale: Die konkrete Bildsprache bleibt erhalten; ob der Rauch für Verwüstung oder sinnbildlich für ein heranziehendes Heer steht, wird nicht festgelegt.
- source_word: בָּא
  choice: kommt
  rationale: Das Perfekt kann in prophetischer Rede ein unmittelbar bevorstehendes Geschehen vergegenwärtigen. Das Präsens „kommt“ bewahrt diese Unmittelbarkeit.
- source_word: וְאֵין בּוֹדֵד
  choice: und … keiner zurückbleibt
  rationale: בודד bezeichnet hier wahrscheinlich einen Abgesonderten oder Vereinzelten. Im militärischen Zusammenhang gibt „keiner bleibt zurück“ den Gedanken eines fehlenden Nachzüglers verständlich wieder.
- source_word: בְּמוֹעָדָיו
  choice: in seinen Aufgeboten
  rationale: מועד kann festgesetzte Zeiten, Orte oder Zusammenkünfte bezeichnen. „Aufgebote“ verbindet den Gedanken des Einberufenen beziehungsweise Geordneten mit dem militärischen Kontext, ohne schlicht „Reihen“ in den Text einzutragen.
theological_decisions:
- issue: Deutung von וְאֵין בּוֹדֵד בְּמוֹעָדָיו
  choice: 'Die Schlussklausel beschreibt die geschlossene, geordnete Streitmacht des aus dem Norden kommenden Angreifers: In seinen Aufgeboten bleibt keiner zurück.'
  alternative: '„Und es gibt keinen Vereinzelten bei seinen festgesetzten Zeiten/Versammlungen“ oder: „Keiner fehlt an seinem festgesetzten Platz.“'
  rationale: Der Rauch aus dem Norden legt im Zusammenhang ein heranziehendes Heer nahe. Die militärische Wiedergabe ergibt einen stimmigen Sinn, doch die ungewöhnliche Verbindung mit מועד bleibt mehrdeutig und wird deshalb in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit kurzen, eindringlichen Imperativen. Die Personifikation von Tor, Stadt und Philistäa sowie das Rauch- und Schmelzbild bleiben erhalten. „Aufgebote“ ist bewusst etwas feierlicher, aber verständlich und trägt der Mehrdeutigkeit der Schlussklausel besser Rechnung als eine rein deutende Wiedergabe mit „Reihen“.
