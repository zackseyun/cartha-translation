  source_fidelity: Die Übersetzung gibt die Konstruktion נָשָׂא מָשָׁל idiomatisch als das Anstimmen eines gegen den König von Babel gerichteten Spottliedes wieder. „Unterdrücker“ trifft נֹגֵשׂ gut. Für מַדְהֵבָה ist „Gewaltherrschaft“ angesichts der seltenen und unsicheren Vokabel eine vertretbare kontextuelle Deutung, ohne Gewissheit vorzutäuschen.
  naturalness: Modernes, würdiges und gut verständliches Deutsch. Die exklamative Zweizeilenstruktur ist klar und poetisch angemessen. „Wie hat der Unterdrücker ein Ende genommen“ ist idiomatisch; die anschließende Variation mit „aufgehört“ vermeidet im Deutschen eine unnötig hölzerne Wiederholung.
  terminology: „König von Babel“ ist die etablierte deutsche biblische Namensform. „Spottlied“ passt im Kontext zu מָשָׁל als höhnischem Spruch bzw. Taunt. Die Fußnote kennzeichnet die lexikalische Unsicherheit von מַדְהֵבָה sachgerecht und nennt sowohl naheliegende Alternativen als auch die traditionelle Wiedergabe „goldene Stadt“.
