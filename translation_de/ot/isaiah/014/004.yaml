source:
  edition: WLC
  text: וְ/נָשָׂ֜אתָ הַ/מָּשָׁ֥ל הַ/זֶּ֛ה עַל מֶ֥לֶךְ בָּבֶ֖ל וְ/אָמָ֑רְתָּ אֵ֚יךְ שָׁבַ֣ת נֹגֵ֔שׂ שָׁבְתָ֖ה מַדְהֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: de
  text: 'Dann wirst du dieses Spottlied über den König von Babel anstimmen und sagen:


    »Wie hat der Unterdrücker ein Ende genommen,

    wie hat die Gewaltherrschaft[a] aufgehört!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Gewaltherrschaft“ wiedergegebene hebräische Wort ist selten und in seiner Bedeutung unsicher. Möglich sind auch „Anmaßung“, „Ansturm“ oder „drückende Zwangsherrschaft“; traditionell wird es mit „goldene Stadt“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ הַמָּשָׁל הַזֶּה
  choice: Dann wirst du dieses Spottlied … anstimmen
  rationale: נשא mit משל bedeutet idiomatisch, einen Spruch vorzutragen oder anzustimmen. Im Kontext ist מָשָׁל ein höhnischer Spruch gegen Babylons König; „Spottlied“ gibt Form und Funktion natürlich wieder.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: über den König von Babel
  rationale: עַל bezeichnet hier den Gegenstand und zugleich das Ziel des Spottliedes. „Über“ ist im Deutschen bei einem Lied idiomatischer als „gegen“, ohne die feindselige Stoßrichtung zu verdecken. „Babel“ ist die etablierte deutsche Form des biblischen Ortsnamens.
- source_word: אֵיךְ שָׁבַת נֹגֵשׂ
  choice: Wie hat der Unterdrücker ein Ende genommen
  rationale: אֵיךְ leitet den triumphierenden Ausruf ein; נֹגֵשׂ bezeichnet einen Antreiber, Bedränger oder Unterdrücker. „Ein Ende genommen“ gibt שָׁבַת würdig und verständlich wieder.
- source_word: שָׁבְתָה מַדְהֵבָה
  choice: wie hat die Gewaltherrschaft aufgehört
  rationale: מַדְהֵבָה ist ein nur hier belegtes und unsicheres Wort. Im Parallelismus mit „Unterdrücker“ liegt eine Bezeichnung für bedrückende Machtausübung nahe. „Gewaltherrschaft“ wahrt diesen Zusammenhang; die Unsicherheit und weitere Deutungen werden in der Fußnote offengelegt.
theological_decisions:
- issue: Deutung des seltenen Wortes מַדְהֵבָה
  choice: Gewaltherrschaft
  alternative: Anmaßung; Ansturm oder drückende Zwangsherrschaft; traditionell auch „goldene Stadt“
  rationale: Die Frage ist lexikalisch, nicht konfessionell. Der Parallelismus spricht eher für eine Form gewaltsamer Unterdrückung als für die traditionelle Wiedergabe „goldene Stadt“. Da das hebräische Wort einzigartig und seine Bedeutung unsicher ist, wird keine Deutung als zweifelsfrei ausgegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelstruktur wird durch zwei mit „Wie hat …“ beginnende Zeilen bewahrt. „Anstimmen“ passt zur Auffassung von מָשָׁל als Spottlied, während die Fußnote die echte lexikalische Unsicherheit des Schlusswortes sichtbar hält.
