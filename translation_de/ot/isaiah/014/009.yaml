source:
  edition: WLC
  text: שְׁא֗וֹל מִ/תַּ֛חַת רָגְזָ֥ה לְ/ךָ֖ לִ/קְרַ֣את בּוֹאֶ֑/ךָ עוֹרֵ֨ר לְ/ךָ֤ רְפָאִים֙ כָּל עַתּ֣וּדֵי אָ֔רֶץ הֵקִים֙ מִ/כִּסְאוֹתָ֔/ם כֹּ֖ל מַלְכֵ֥י גוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: de
  text: Die Scheol in der Tiefe gerät deinetwegen in Aufruhr, um dich bei deiner Ankunft zu empfangen. Sie weckt deinetwegen die Schatten[a] auf, alle Mächtigen der Erde[b]; sie lässt alle Könige der Völker von ihren Thronen aufstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Toten“ beziehungsweise „die Totengeister“; hebräisch Rephaim.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle (Ziegen-)Böcke der Erde“ – ein Bild für herausragende Herrscher oder Machthaber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt die hebräische Vorstellung vom unterirdischen Totenreich, ohne sie auf das Grab zu verengen oder mit späteren Vorstellungen von der Hölle gleichzusetzen.
- source_word: מִתַּחַת
  choice: tief unten
  rationale: Die Wendung erhält die räumliche Abwärtsvorstellung und klingt im Deutschen zusammen mit „Scheol“ natürlich.
- source_word: רָגְזָה
  choice: gerät … in Aufruhr
  rationale: Das Verb bezeichnet Erregung, Unruhe oder Beben; die Formulierung passt zur Personifikation der Scheol, die auf die Ankunft des gestürzten Herrschers reagiert.
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: um dich bei deiner Ankunft zu empfangen
  rationale: Die Übersetzung gibt sowohl die Bewegung beziehungsweise Ausrichtung auf den Ankommenden als auch den Empfangscharakter der Szene wieder.
- source_word: עוֹרֵר
  choice: schreckt … auf
  rationale: Die kräftige Formulierung vermittelt, dass die Scheol ihre Bewohner angesichts des Neuankömmlings in Bewegung setzt.
- source_word: רְפָאִים
  choice: die Schatten
  rationale: Im Kontext sind die Verstorbenen im Totenreich gemeint. „Schatten“ bewahrt den poetischen Charakter und vermeidet eine ethnische Deutung als Rephaim.
- source_word: עַתּוּדֵי אָרֶץ
  choice: alle Mächtigen der Erde
  rationale: Wörtlich steht „(Ziegen-)Böcke der Erde“; metaphorisch sind herausragende Herrscher oder Machthaber gemeint. Die übertragene Bedeutung steht im Text, das Tierbild in der Fußnote.
- source_word: הֵקִים
  choice: lässt … aufstehen
  rationale: Der Hifil bezeichnet das Veranlassen des Aufstehens und erhält das Bild, dass die verstorbenen Könige sich von ihren Thronen erheben.
- source_word: מִכִּסְאוֹתָם
  choice: von ihren Thronen
  rationale: „Throne“ entspricht dem königlichen Kontext und führt unmittelbar zu den Königen der Völker.
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: alle Könige der Völker
  rationale: Die Formulierung bewahrt den umfassenden Geltungsbereich und die politische Bildwelt des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל in einem poetischen Spottlied über die Toten
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: „Scheol“ wahrt die Eigenart und Offenheit des hebräischen Begriffs. „Grab“ wäre zu eng, während „Hölle“ spätere theologische Vorstellungen in den Text eintragen könnte.
- issue: Identität der רְפָאִים in der Unterweltszene
  choice: Schatten, das heißt die Verstorbenen
  alternative: Rephaim als Volks- oder Riesengruppe
  rationale: Die Scheol, die Throne und die bereits verstorbenen Könige zeigen, dass hier die Toten gemeint sind; die poetische Bezeichnung wird dennoch nicht zu einer ausgearbeiteten Lehre über den Zustand der Toten erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Bildkraft. Die Scheol wird entsprechend dem hebräischen Femininum personifiziert. Kurze Hauptsätze und das semantisch starke „in Aufruhr“ beziehungsweise „schreckt … auf“ erhalten die dramatische Bewegung des Spottliedes.
