base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/017.yaml
  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: de
  text: der die Welt zur Wüste machte und ihre Städte niederriss, der seinen Gefangenen den Weg nach Hause nicht öffnete?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen etwa: „der seinen Gefangenen nicht zum Haus/heimwärts öffnete“. Die knappe Wendung kann bedeuten, dass er ihnen den Heimweg nicht öffnete, also sie nicht in die Heimat zurückkehren ließ.'
    reason: Die Fußnote erläutert die ungewöhnliche hebräische Verbindung von „öffnen“ mit dem Richtungswort „zum Haus/heimwärts“ und bewahrt die Nähe zwischen Bildsprache und möglichem Sinn.
lexical_decisions:
- source_word: שָׂם
  choice: machte
  rationale: Das Qal-Perfekt von שׂים bezeichnet hier, was der Gewaltherrscher aus der Welt machte. Im Deutschen gibt „zur Wüste machte“ die resultative Aussage natürlich und präzise wieder.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל meint die Welt als bewohnte Erde. „Die Welt“ ist im modernen Standarddeutsch klar und bewahrt die umfassende Reichweite der Aussage.
- source_word: כַּמִּדְבָּר
  choice: zur Wüste
  rationale: Das Präfix כ kennzeichnet einen Vergleich. Die deutsche Wendung „zur Wüste machen“ gibt das Bild idiomatisch wieder, ohne מִדְבָּר auf eine Sandwüste einzuengen.
- source_word: וְעָרָיו
  choice: und ihre Städte
  rationale: Das maskuline Suffix bezieht sich im Kontext am ehesten auf תֵּבֵל, das im Hebräischen grammatisch maskulin ist. Wegen des femininen deutschen Substantivs „Welt“ lautet der entsprechende Rückbezug „ihre“.
- source_word: הָרָס
  choice: niederriss
  rationale: הרס bezeichnet das Einreißen oder Zerstören. „niederriss“ bewahrt die konkrete Gewalt des Bildes und passt natürlich zu Städten.
- source_word: אֲסִירָיו
  choice: seine Gefangenen
  rationale: אָסִיר bezeichnet einen Gebundenen oder Gefangenen. „Gefangene“ ist hier die klare gegenwärtige Entsprechung.
- source_word: לֹא פָתַח
  choice: nicht … entließ
  rationale: פתח bedeutet wörtlich „öffnen“, kann bei Gefangenen aber deren Freilassung ausdrücken. „entließ“ ergibt zusammen mit dem Richtungswort בָּיְתָה verständliches, natürliches Deutsch; die konkrete hebräische Formulierung wird in der Fußnote offengelegt.
- source_word: בָּיְתָה
  choice: nach Hause
  rationale: Die Richtungsendung ה an בַּיִת bezeichnet eine Bewegung zum Haus beziehungsweise heimwärts. Im Zusammenhang mit Gefangenen ist „nach Hause“ die natürliche deutsche Wiedergabe.
