id: ISA.20.3
reference: Isaiah 20:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: de
  text: 'Da sagte Jahwe: „So wie mein Diener Jesaja drei Jahre lang nackt[a] und barfuß umhergegangen ist, als Zeichen und Vorzeichen gegen Ägypten und Kusch[b],“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise „entkleidet“: Das kann bedeuten, dass Jesaja nur ein Untergewand oder einen Lendenschurz trug und nicht völlig unbekleidet war.'
    reason: lexical_alternative
  - marker: b
    text: Kusch bezeichnet das Gebiet südlich von Ägypten, das häufig mit Nubien verbunden wird; manche Übersetzungen geben den Namen mit „Äthiopien“ wieder.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in der im Deutschen gebräuchlichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר
  choice: So wie
  rationale: Bewahrt die vergleichende Funktion und leitet den Zeichenvergleich natürlich ein.
- source_word: הָלַךְ
  choice: umhergegangen ist
  rationale: Drückt hier nicht nur eine einzelne Gehbewegung, sondern Jesajas öffentliches Auftreten während des genannten Zeitraums aus.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Bezeichnet Jesajas beauftragten Dienst für Gott, ohne unnötig den Aspekt der Sklaverei hervorzuheben.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Verwendet die etablierte deutsche Namensform.
- source_word: עָרוֹם
  choice: nackt
  rationale: Gibt die unmittelbare lexikalische Bedeutung wieder; die mögliche Bedeutung einer Entblößung nur bis auf ein Untergewand wird in einer Fußnote offengehalten.
- source_word: וְיָחֵף
  choice: und barfuß
  rationale: Direkte und idiomatische Wiedergabe des körperlichen Zustands.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: drei Jahre lang
  rationale: Kennzeichnet die Zeitspanne im Deutschen eindeutig und natürlich.
- source_word: אוֹת
  choice: Zeichen
  rationale: Übliche Wiedergabe für eine symbolische Handlung, die auf eine kommende Wirklichkeit verweist.
- source_word: וּמוֹפֵת
  choice: und Vorzeichen
  rationale: Unterscheidet den zweiten Begriff von אות und bringt den ankündigenden Charakter der prophetischen Zeichenhandlung zum Ausdruck.
- source_word: עַל
  choice: gegen
  rationale: Entspricht im Gerichtszusammenhang der gegen Ägypten und Kusch gerichteten Bedeutung der Zeichenhandlung.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Etablierte deutsche Landesbezeichnung.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Bewahrt den historischen geografischen Namen, statt ihn mit dem modernen Äthiopien gleichzusetzen.
theological_decisions:
- issue: Ausmaß von Jesajas Nacktheit bei der Zeichenhandlung
  choice: Im Haupttext steht „nackt“, während eine Fußnote die Möglichkeit offenhält, dass Jesaja nur das Obergewand abgelegt hatte.
  alternative: „entkleidet“ beziehungsweise „nur mit einem Untergewand bekleidet“
  rationale: Der klare lexikalische Sinn von עָרוֹם soll nicht abgeschwächt werden. Zugleich kann das Wort im Zusammenhang antiker Kleidung auch bedeuten, dass jemand ohne Obergewand und nicht zwingend völlig unbekleidet war.
- issue: Bezug von „Zeichen und Vorzeichen“
  choice: Die Formulierung wird als Beschreibung von Jesajas gesamter dreijähriger Zeichenhandlung wiedergegeben.
  alternative: Die drei Jahre selbst als je einzelne symbolische Zeitangaben verstehen.
  rationale: Die hebräische Syntax verbindet die Dauer am natürlichsten mit Jesajas Auftreten; die Handlung als Ganze dient als Zeichen gegen Ägypten und Kusch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umhergegangen ist“ macht das länger andauernde öffentliche Auftreten idiomatisch deutlich. Die Paarung „Zeichen und Vorzeichen“ bewahrt die beiden hebräischen Begriffe und ihren prophetisch-ankündigenden Klang.
