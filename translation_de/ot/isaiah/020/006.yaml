  to: 'Und die Bewohner dieses Küstenlandes werden an jenem Tag sagen: »Seht, das ist es, worauf wir hofften[a] und wohin wir um Hilfe geflohen sind, um vor dem König von Assyrien gerettet zu werden. Wie sollen wir da entkommen?«'
