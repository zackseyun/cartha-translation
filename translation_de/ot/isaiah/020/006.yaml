  source_fidelity: 'Die Übersetzung trifft den kollektiven Bezug von יֹשֵׁב, die prophetische Zeitangabe, den bedrohlichen Bezug auf den König von Assyrien und die rhetorische Schlussfrage gut. Die Verbindung von מַבָּטֵנוּ mit אֲשֶׁר נַסְנוּ שָׁם wird jedoch in „unsere Hoffnung, zu der wir geflohen sind“ im Deutschen semantisch und idiomatisch unscharf: Zu einer abstrakten Hoffnung kann man nicht natürlich fliehen. Die revidierte Fassung macht deutlich, dass es um das Objekt des Hoffens bzw. den Ort der Zuflucht geht, ohne den Text weiter auszudeuten.'
  naturalness: „Zu der wir geflohen sind“ mit dem Bezugswort „Hoffnung“ wirkt im modernen Standarddeutsch unnatürlich. „Das ist es, worauf wir hofften und wohin wir um Hilfe geflohen sind“ ist flüssig und erhält die doppelte Bezugnahme des Hebräischen.
  terminology: „Küstenland“, „König von Assyrien“ und „gerettet werden“ sind sachgerecht. „Hoffnung“ ist als knappe Wiedergabe von מַבָּט möglich, wird aber in der revidierten Satzgestaltung als auf einen konkreten Gegenstand gerichtete Hoffnung verständlich. Die Fußnote bewahrt die lexikalische Spannweite.
