base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: de
  text: 'Und die Bewohner dieses Küstenlandes werden an jenem Tag sagen: »Seht, das ist es, worauf wir hofften[a] und wohin wir um Hilfe geflohen sind, um vor dem König von Assyrien gerettet zu werden. Wie sollen wir da entkommen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ist es, worauf wir geblickt haben«; oder: »das ist unsere Erwartung«. Der hebräische Ausdruck bezeichnet das, worauf jemand erwartungsvoll blickt und seine Hoffnung setzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: die Bewohner dieses Küstenlandes
  rationale: Der substantivierte Singular יֹשֵׁב bezeichnet hier kollektiv die Bevölkerung. Der Plural ist im modernen Deutschen natürlicher. אִי kann eine Insel, besonders bei Jesaja aber auch ein Küsten- oder Meeresland bezeichnen; der Kontext legt ein Küstenland nahe.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: הִנֵּה
  choice: Seht
  rationale: Wahrt den aufmerksamkeitslenkenden und vor Augen stellenden Charakter des Ausdrucks in gegenwärtiger, würdiger Sprache.
- source_word: כֹּה מַבָּטֵנוּ
  choice: das ist unsere Hoffnung
  rationale: מַבָּט bezeichnet wörtlich das, worauf man blickt, und im Kontext den Gegenstand der Erwartung beziehungsweise Hoffnung. Die knappe Form wahrt die Bildnähe und vermeidet die nicht ausdrücklich formulierte Erweiterung »was aus unserer Hoffnung geworden ist«.
- source_word: אֲשֶׁר נַסְנוּ שָׁם
  choice: zu der wir geflohen sind
  rationale: Das Relativpronomen bezieht sich sinngemäß auf den Ort beziehungsweise den Gegenstand der Hoffnung; שָׁם drückt das Ziel der Flucht aus. »Zu der« stellt im Deutschen den Bezug zur Hoffnung her, ohne ein redundantes »dorthin«.
- source_word: לְעֶזְרָה
  choice: um Hilfe zu finden
  rationale: Gibt den Zweck der Flucht natürlich wieder. Das schlichte Substantiv עֶזְרָה bedeutet Hilfe oder Beistand.
- source_word: לְהִנָּצֵל
  choice: gerettet zu werden
  rationale: 'Der Nifal-Infinitiv trägt passive Bedeutung: gerettet beziehungsweise befreit werden. Die Formulierung erhält diesen Passivcharakter.'
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: vor dem König von Assyrien
  rationale: מִפְּנֵי bezeichnet hier das Entkommen vor der bedrohlichen Macht des assyrischen Königs; »vor« ist im Deutschen idiomatisch.
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: Wie sollen wir da entkommen?
  rationale: Die rhetorische Frage drückt Ausweglosigkeit aus. »Da« gibt den folgernden Zusammenhang des וְ natürlich wieder, während »sollen« die offene Zukunftsfrage erhält.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Der kollektiv gebrauchte hebräische Singular wird idiomatisch als Plural wiedergegeben. Die knappe, möglicherweise demonstrative Aussage כֹּה מַבָּטֵנוּ bleibt bewusst ohne deutende Erweiterung erhalten.
