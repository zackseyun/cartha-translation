source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: de
  text: 'Zu jener Zeit sprach Jahwe durch Jesaja, den Sohn des Amoz: »Geh, löse das Sacktuch von deiner Hüfte und zieh deine Sandalen von deinen Füßen.« Er tat es und ging nackt[a] und barfuß umher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entkleidet« oder »bloß«. Das hebräische Wort kann in manchen Zusammenhängen auch bedeuten, dass jemand nur unzureichend bekleidet und nicht völlig unbekleidet ist.'
    reason: Lexikalische Alternative; bewahrt die Unsicherheit über den Grad der Entblößung.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Natürliche deutsche Zeitangabe, die den Rückverweis des hebräischen Ausdrucks bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: דִּבֶּר ... בְּיַד
  choice: sprach durch
  rationale: Die hebräische Wendung lautet wörtlich „sprach durch die Hand von“; „sprach durch“ gibt die prophetische Vermittlung im Deutschen klar und idiomatisch wieder.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Jesaja, den Sohn des Amoz
  rationale: Verwendet die im Deutschen üblichen Namensformen und gibt die Abstammungsangabe eindeutig wieder.
- source_word: לֵאמֹר
  choice: Einführung der direkten Rede durch Doppelpunkt
  rationale: Das hebräische Zitatwort muss im natürlichen modernen Deutsch nicht eigens mit „und sagte“ wiederholt werden.
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: löse das Sacktuch von deiner Hüfte
  rationale: „Löse“ wahrt die konkrete Bedeutung von פתח in diesem Zusammenhang; „Sacktuch“ bezeichnet das als Kleidungsstück getragene raue Gewebe, und „Hüfte“ gibt den Körperbereich verständlich wieder.
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: zieh deine Sandalen von deinen Füßen
  rationale: Gibt das Ausziehen der kollektiv singularisch bezeichneten Fußbekleidung in natürlichem Deutsch wieder.
- source_word: וַיַּעַשׂ כֵּן
  choice: Er tat es
  rationale: Knappes und unmittelbares Äquivalent der hebräischen Erfüllungsformel.
- source_word: הָלֹךְ עָרוֹם וְיָחֵף
  choice: ging nackt und barfuß umher
  rationale: „Ging … umher“ gibt den adverbial gebrauchten Infinitiv הָלֹךְ natürlich wieder; „nackt und barfuß“ wahrt die markante Formulierung des Zeichens.
theological_decisions:
- issue: Grad der Entblößung bei עָרוֹם
  choice: Im Haupttext „nackt“, mit Hinweis auf „entkleidet“ beziehungsweise unzureichend bekleidet in der Fußnote.
  alternative: „entkleidet“, „bloß“ oder nur mit einem Untergewand bekleidet
  rationale: עָרוֹם bezeichnet gewöhnlich Nacktheit und darf im Haupttext nicht vorschnell abgeschwächt werden. In manchen Zusammenhängen kann das Wort jedoch einen Zustand unzureichender Bekleidung meinen; diese echte Deutungsoffenheit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige wörtliche Wendung „durch die Hand Jesajas“ wird idiomatisch als „durch Jesaja“ wiedergegeben. Der Haupttext bleibt bei der starken Grundbedeutung „nackt“, während die Fußnote die kontextuell mögliche Teilentkleidung offenhält.
