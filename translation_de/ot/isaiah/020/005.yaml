  text: וְ/חַתּ֖וּ וָ/בֹ֑שׁוּ מִ/כּוּשׁ֙ מַבָּטָ֔/ם וּ/מִן מִצְרַ֖יִם תִּפְאַרְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: de
  text: Dann werden sie bestürzt sein und sich schämen wegen Kusch[a], auf das sie hofften, und wegen Ägypten[b], auf das sie stolz waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kusch war ein antikes Gebiet südlich von Ägypten, das häufig mit Nubien verbunden wird. In älteren Übersetzungen steht dafür manchmal „Äthiopien“.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „Ägypten, ihr Ruhm“; auch möglich: „Ägypten, dessen sie sich rühmten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: Dann werden sie bestürzt sein
  rationale: Das Qal von חתת bezeichnet hier im prophetischen Zusammenhang die kommende Bestürzung beziehungsweise den inneren Zusammenbruch. „Bestürzt sein“ ist natürliches modernes Deutsch und wahrt den Zukunftssinn.
- source_word: וָבֹשׁוּ
  choice: und sich schämen
  rationale: בושׁ kann Scham, Beschämung oder enttäuschte Hoffnung ausdrücken. Die mediale Formulierung „sich schämen“ entspricht der aktiven hebräischen Form und verbindet sich idiomatisch mit „bestürzt sein“.
- source_word: מִכּוּשׁ
  choice: wegen Kusch
  rationale: 'מן ist in beiden parallelen Wendungen kausal zu verstehen: Kusch wird zum Anlass ihrer Bestürzung und Scham. Der historische Name „Kusch“ ist präziser als „Äthiopien“.'
- source_word: מַבָּטָם
  choice: auf das sie hofften
  rationale: מַבָּט bezeichnet wörtlich das Hinschauen beziehungsweise das, worauf man blickt, und hier übertragen den Gegenstand vertrauensvoller Erwartung. Die verbale Wiedergabe klingt im Deutschen natürlicher als „ihre Hoffnung“, macht aber denselben Bezug deutlich.
- source_word: וּמִן מִצְרַיִם
  choice: und wegen Ägypten
  rationale: Wie zuvor wird מן aufgrund des Parallelismus kausal wiedergegeben.
- source_word: תִּפְאַרְתָּם
  choice: auf das sie stolz waren
  rationale: תִּפְאֶרֶת umfasst Ruhm, Herrlichkeit und den Gegenstand des Stolzes. Die relationale Formulierung bezeichnet Ägypten als das, dessen sie sich rühmten, ohne die Bedeutung einseitig auf bloße Prahlerei zu verengen.
