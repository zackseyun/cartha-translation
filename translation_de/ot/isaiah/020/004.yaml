source:
  edition: WLC
  text: כֵּ֣ן יִנְהַ֣ג מֶֽלֶךְ אַ֠שּׁוּר אֶת שְׁבִ֨י מִצְרַ֜יִם וְ/אֶת גָּל֥וּת כּ֛וּשׁ נְעָרִ֥ים וּ/זְקֵנִ֖ים עָר֣וֹם וְ/יָחֵ֑ף וַ/חֲשׂוּפַ֥י שֵׁ֖ת עֶרְוַ֥ת מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: de
  text: So wird der König von Assyrien die Gefangenen Ägyptens und die Verschleppten aus Kusch wegführen, Junge und Alte, nackt und barfuß, mit entblößtem Gesäß[a] – Ägyptens Blöße[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit bloßem Gesäß“. Die hebräische Wendung ist bewusst drastisch und schildert die Erniedrigung der Verschleppten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ägyptens Schande“. Wörtlich steht hier „Ägyptens Blöße“; das Bild verbindet öffentliche Entblößung mit Schmach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Das Wort verbindet Jesajas Zeichenhandlung unmittelbar mit ihrer angekündigten Erfüllung; „So“ ist knapp, natürlich und gibt diesen Zusammenhang wieder.
- source_word: יִנְהַג
  choice: wird … wegführen
  rationale: נהג kann „führen“ oder „treiben“ bedeuten. Im Zusammenhang einer erzwungenen Deportation bringt „wegführen“ sowohl die Bewegung als auch den Zwang verständlich zum Ausdruck.
- source_word: שְׁבִי מִצְרַיִם
  choice: die Gefangenen Ägyptens
  rationale: שְׁבִי bezeichnet hier parallel zu גָּלוּת nicht nur einen Zustand, sondern die gefangen genommenen Menschen.
- source_word: גָּלוּת כּוּשׁ
  choice: die Verschleppten aus Kusch
  rationale: גָּלוּת kann das Exil oder die Gruppe der Deportierten bezeichnen. Der Personenbezug und die Parallele zu „Gefangenen“ sprechen für „Verschleppte“; „aus Kusch“ bezeichnet ihre Herkunft idiomatisch.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der historische Eigenname wird beibehalten, statt ihn mit einem heutigen Staat wie Äthiopien gleichzusetzen.
- source_word: נְעָרִים וּזְקֵנִים
  choice: Junge und Alte
  rationale: Das Paar umfasst idiomatisch Menschen über die gesamte Altersspanne hinweg. Die knappe deutsche Wendung vermeidet eine unnötige geschlechtliche Präzisierung.
- source_word: עָרוֹם וְיָחֵף
  choice: nackt und barfuß
  rationale: Die direkte Wiedergabe wahrt den Bezug zur Zeichenhandlung im Kontext und die bildhafte Darstellung von Schutzlosigkeit und Erniedrigung.
- source_word: חֲשׂוּפַי שֵׁת
  choice: mit entblößtem Gesäß
  rationale: Die hebräische Wendung ist bewusst drastisch und bezeichnet das bloßgelegte Hinterteil. Die Formulierung ist klar, würdig und schwächt die öffentliche Erniedrigung nicht ab.
- source_word: עֶרְוַת מִצְרָיִם
  choice: Ägyptens Blöße
  rationale: עֶרְוָה bezeichnet wörtlich die Blöße und kann zugleich Schande ausdrücken. „Blöße“ erhält den körperlichen Bildzusammenhang und lässt die übertragene Bedeutung offen.
theological_decisions:
- issue: Öffentliche Entblößung als Gerichts- und Erniedrigungsbild
  choice: Die körperlich drastische Sprache wird beibehalten.
  alternative: Die Wendungen nur abstrakt als „Schande“ oder „Demütigung“ wiederzugeben.
  rationale: Der hebräische Text verbindet reale Entblößung und öffentliche Schande, ohne sie voneinander zu lösen. Eine rein abstrakte Wiedergabe würde die bewusst anstößige Bildsprache abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die drastische Bildsprache des Hebräischen bleibt erhalten, ohne sie unnötig zu verschärfen. Der Gedankenstrich markiert die abschließende, deutende Zuspitzung.
