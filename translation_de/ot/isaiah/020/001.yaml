  text: בִּ/שְׁנַ֨ת בֹּ֤א תַרְתָּן֙ אַשְׁדּ֔וֹדָ/ה בִּ/שְׁלֹ֣ח אֹת֔/וֹ סַֽרְג֖וֹן מֶ֣לֶךְ אַשּׁ֑וּר וַ/יִּלָּ֥חֶם בְּ/אַשְׁדּ֖וֹד וַֽ/יִּלְכְּדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: de
  text: In dem Jahr, als der Tartan[a] nach Aschdod kam – Sargon, König von Assyrien, sandte ihn –, kämpfte er gegen Aschdod und nahm es ein,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tartan“ ist wahrscheinlich ein assyrischer Amtstitel, möglicherweise im Sinn von „Oberbefehlshaber“, und eher kein Personenname.
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת
  choice: In dem Jahr, als
  rationale: Die Verbindung aus ב und שְׁנַת eröffnet eine zeitliche Einordnung; „In dem Jahr, als“ ist im Deutschen natürlich und erhält den Charakter eines noch nicht abgeschlossenen Satzanfangs.
- source_word: תַרְתָּן
  choice: der Tartan
  rationale: Das Wort bezeichnet wahrscheinlich einen assyrischen Amtstitel. Die Transliteration bewahrt die historische Bezeichnung; der bestimmte Artikel signalisiert, dass es sich eher um ein Amt als um einen Eigennamen handelt.
- source_word: אַשְׁדּוֹדָה
  choice: nach Aschdod
  rationale: Das Richtungs-he bezeichnet eine Bewegung auf Aschdod zu; „nach“ ist bei Städten die idiomatische deutsche Entsprechung.
- source_word: בִּשְׁלֹח אֹתוֹ
  choice: Sargon, der König von Assyrien, hatte ihn gesandt
  rationale: Der Infinitiv mit ב bezeichnet einen begleitenden zeitlichen Umstand. Das Plusquamperfekt macht im Deutschen deutlich, dass die Sendung dem Kommen vorausging, ohne den Sachgehalt zu verändern.
- source_word: סַרְגוֹן
  choice: Sargon
  rationale: Gebräuchliche deutsche Umschrift des assyrischen Königsnamens.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Status-constructus-Verbindung bestimmt Sargon näher; die Apposition mit Artikeln ist natürliches Standarddeutsch.
- source_word: וַיִּלָּחֶם בְּאַשְׁדּוֹד
  choice: und er gegen Aschdod kämpfte
  rationale: לחם mit ב bedeutet hier „gegen jemanden beziehungsweise einen Ort kämpfen“. Die Wiedergabe bleibt nahe am militärischen Ausdruck, ohne ihn zu „angreifen“ zu verengen.
- source_word: וַיִּלְכְּדָהּ
  choice: und es einnahm
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt; das Pronomen bezieht sich auf Aschdod.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche fassen die Angabe zu Sargons Sendung als eingeschobene Hintergrundinformation und halten zugleich den langen zeitlichen Satzrahmen lesbar. Das Schlusskomma bleibt stehen, weil der Vers syntaktisch in Vers 2 weitergeführt wird.
