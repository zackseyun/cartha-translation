  verdict: revise
  source_fidelity: Die Grundübersetzung trifft die zeitliche Rahmung, den assyrischen Titel, die Sendung durch Sargon sowie Kampf und Einnahme Aschdods. Das Plusquamperfekt „hatte ihn gesandt“ legt jedoch eine zeitliche Vorordnung stärker fest als die hebräische b-Infinitivkonstruktion, die den Umstand der Sendung zeitgleich rahmt.
  naturalness: Der Satz ist als bewusst offener Satzanfang, der in V. 2 fortgesetzt wird, gut verständlich. Die eingeschobene finite Form „sandte ihn“ ist im Deutschen klarer und natürlicher als ein doppeltes „als“ und wahrt zugleich die syntaktische Offenheit.
  terminology: „der Tartan“, „Aschdod“, „Sargon, König von Assyrien“, „kämpfte gegen“ und „nahm es ein“ sind sachlich und sprachlich angemessen. Die Fußnote sollte die Unsicherheit darüber wahren, ob es sich um einen Titel statt um einen Personennamen handelt; „und kein Personenname“ ist dafür zu kategorisch.
