  text: גֹּאֲלֵ֕/נוּ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ קְד֖וֹשׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/004.yaml
  text: Our Redeemer—Yahweh of Armies is his name—is the Holy One of Israel[a][b].
translation:
  language: de
  text: Unser Erlöser – Jahwe der Heere ist sein Name – der Heilige Israels.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: b
    text: „Erlöser“ kann auch als „Löser als Verwandter“ verstanden werden und hebt damit die mögliche rechtliche und bundesbezogene Nuance des hebräischen Wortes hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: unser Erlöser
  rationale: Das substantivisch gebrauchte Partizip von גאל bezeichnet den, der uns auslöst bzw. erlöst. „Erlöser“ ist im Deutschen natürlich und bewahrt das rechtliche und bundestheologische Gewicht besser als das allgemeinere „Retter“; die mögliche verwandtschaftsrechtliche Nuance wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: „Heere“ gibt den konkreten Sinn des Plurals צְבָאוֹת in gegenwärtigem Deutsch klarer wieder als das traditionelle, heute weniger transparente „Heerscharen“.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die hebräische Nominalkonstruktion wird im Deutschen mit der notwendigen Kopula natürlich wiedergegeben.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Diese Wiedergabe bewahrt den für Jesaja charakteristischen festen Gottestitel und dessen Wiedererkennbarkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen יְהוָה. „Jahwe“ bewahrt diesen Namen, während „der Heere“ die konkrete Bedeutung von צְבָאוֹת verständlich ausdrückt; die traditionelle Wiedergabe bleibt in der Fußnote zugänglich.
- issue: Wiedergabe von גֹּאֲלֵנוּ als Gottestitel
  choice: unser Erlöser
  alternative: unser Löser aus der Verwandtschaft
  rationale: „Erlöser“ ist als göttliche Bezeichnung idiomatisch und lässt den rechtlich-bundestheologischen Gehalt stehen, ohne eine im unmittelbaren Wortlaut nicht ausdrücklich markierte Verwandtschaftsbeziehung zu erzwingen.
- issue: Syntax des abschließenden Gottestitels
  choice: ist der Heilige Israels
  alternative: der Heilige Israels
  rationale: Das Deutsche benötigt für einen vollständigen, natürlichen Satz eine Kopula. Die Gedankenstriche bewahren zugleich die appositionelle Spannung der knappen hebräischen Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bilden die eingeschobene Namensformel übersichtlich ab. Die traditionellen Jesaja-Titel bleiben erkennbar, während „Heere“ gegenüber „Heerscharen“ für heutige Leser unmittelbarer verständlich ist.
