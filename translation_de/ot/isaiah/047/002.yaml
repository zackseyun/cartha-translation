  text: קְחִ֥י רֵחַ֖יִם וְ/טַ֣חֲנִי קָ֑מַח גַּלִּ֨י צַמָּתֵ֧/ךְ חֶשְׂפִּי שֹׁ֛בֶל גַּלִּי שׁ֖וֹק עִבְרִ֥י נְהָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/002.yaml
  text: Take the millstones and grind flour[a]; uncover your veil, strip off your skirt, uncover the leg[c][b], cross over the rivers.
translation:
  language: de
  text: Nimm die Mühlsteine und mahle Mehl. Nimm deinen Schleier ab[a], hebe den Rocksaum hoch[b], entblöße das Bein[c], durchquere die Flüsse!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lege dein Haar frei« bzw. »Löse deine Locken«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »entblöße die Schleppe« bzw. »den herabhängenden Saum«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »den Unterschenkel«; möglicherweise auch: »den Oberschenkel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: Nimm die Mühlsteine
  rationale: Der direkte Imperativ und das konkrete Bild der Geräte für niedrige Mahlarbeit bleiben erhalten.
- source_word: וְטַחֲנִי קָמַח
  choice: und mahle Mehl
  rationale: Gibt טחן und קמח knapp und idiomatisch wieder und bewahrt das Bild erniedrigender Arbeit.
- source_word: גַּלִּי צַמָּתֵךְ
  choice: Nimm deinen Schleier ab
  rationale: צַמָּה kann eine Kopfbedeckung beziehungsweise einen Schleier, möglicherweise aber auch Haar oder Locken bezeichnen. Im Kontext der schrittweisen Entblößung ist „Schleier“ plausibel; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: hebe den Rocksaum hoch
  rationale: שֹׁבֶל bezeichnet den herabhängenden Saum beziehungsweise die Schleppe eines Gewandes. Zusammen mit חשׂף und dem anschließenden Durchqueren von Flüssen ist das Hochheben beziehungsweise Freilegen des Saums natürlich, ohne ein vollständiges Ausziehen zu behaupten.
- source_word: גַּלִּי שׁוֹק
  choice: entblöße das Bein
  rationale: שׁוֹק bezeichnet hier das Bein, möglicherweise genauer den Unterschenkel; „Bein“ ist im Deutschen klar und lässt die genaue anatomische Reichweite offen.
- source_word: עִבְרִי נְהָרוֹת
  choice: durchquere die Flüsse
  rationale: עבר mit נְהָרוֹת beschreibt das Hinübergehen durch beziehungsweise über Flüsse; „durchqueren“ passt zum Freilegen des Beins beim Waten.
theological_decisions:
- issue: Charakter der Erniedrigungs- und Entblößungsbilder
  choice: Die Befehlsfolge schildert den Verlust königlicher Würde und öffentliche Erniedrigung, ohne die Szene stärker zu sexualisieren, als der hebräische Wortlaut verlangt.
  alternative: Die Entblößung ausdrücklich sexuell deuten oder durch drastischere Körperbegriffe verstärken.
  rationale: Der Text steigert Arbeit, Ablegen beziehungsweise Hochheben des Gewands und körperliche Entblößung. Die Übersetzung bewahrt diese Spannung, fügt aber keine über den Wortlaut hinausgehende Sexualisierung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen weiblichen Imperativen. Die Wiederholung von גַּלִּי wird wegen unterschiedlicher deutscher Kollokationen mit „abnehmen“ und „entblößen“ leicht variiert. Die Interpunktion gliedert die Befehlskette klar; das abschließende Ausrufezeichen trägt ihren Nachdruck.
