source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: de
  text: 'Und nun höre dies, du Verwöhnte,[a] die du in Sicherheit wohnst und in deinem Herzen sagst: »Ich bin, und außer mir gibt es niemanden.[b] Ich werde nicht als Witwe dasitzen und keinen Verlust von Kindern erfahren.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „du Zarte“, „du Verweichlichte“ oder „du im Luxus Lebende“. Das hebräische Wort bezeichnet hier ein durch Luxus und Selbstverwöhnung geprägtes Leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich bin, und sonst gibt es nichts.“ Die Aussage ist eine überhebliche Behauptung uneingeschränkter Einzigartigkeit.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „Kinderverlust nicht kennen“, das heißt, den Tod von Kindern nicht erleben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus וְ und עַתָּה markiert ausdrücklich den Übergang zur direkten, konfrontativen Anrede.
- source_word: עֲדִינָה
  choice: du Verwöhnte
  rationale: Das feminine Adjektiv bezeichnet hier eine durch Wohlleben weich und anspruchsvoll gewordene Person; die substantivierte Anrede ist im Deutschen natürlich und bewahrt den ironischen Ton.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: die du in Sicherheit wohnst
  rationale: Die Formulierung bezeichnet einen beständigen Zustand vermeintlicher Sicherheit. „Wohnst“ gibt den durativen Sinn des Partizips idiomatisch wieder.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Ich bin es, und außer mir gibt es niemanden
  rationale: Die Wiedergabe erhält die absolute, überhebliche Selbstbehauptung der personifizierten Stadt und lässt zugleich den möglichen Anklang an Aussagen göttlicher Einzigkeit stehen.
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: Ich werde nicht als Witwe dasitzen
  rationale: „Dasitzen“ bewahrt das Bild des hebräischen Verbs und bezeichnet zugleich das Verharren im Stand einer Witwe.
- source_word: שְׁכוֹל
  choice: den Verlust von Kindern
  rationale: Das Wort bezeichnet nicht allgemeine Kinderlosigkeit, sondern den durch den Tod von Kindern verursachten Verlust.
- source_word: אֵדַע
  choice: erfahren
  rationale: Das hebräische „kennen“ hat hier erfahrungsbezogenen Sinn; „erfahren“ ist im modernen Deutschen klarer, ohne den Gehalt zu erweitern.
theological_decisions:
- issue: Babylons Selbstbehauptung אֲנִי וְאַפְסִי עוֹד
  choice: Ich bin es, und außer mir gibt es niemanden
  alternative: Ich bin, und sonst gibt es nichts
  rationale: Die gewählte Fassung bewahrt die mögliche Anspielung auf Formulierungen ausschließlicher Hoheit, ohne ausdrücklich festzulegen, ob עוֹד personal („niemand“) oder umfassender („nichts“) zu verstehen ist; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Schärfe. Die feminine Anrede macht die Personifikation Babylons sichtbar. „Und nun“ folgt dem ausdrücklich vorhandenen וְעַתָּה; die Satzparallelen und die selbstsichere Rede der Stadt bleiben erhalten.
