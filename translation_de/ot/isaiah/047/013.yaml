  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: de
  text: 'Du bist müde geworden von deinen vielen Beratungen. Sie sollen doch antreten und dich retten: diejenigen, die den Himmel einteilen[a], die in die Sterne schauen, die Monat für Monat[b] kundtun, was über dich kommen wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die den Himmel in Abschnitte aufteilen“. Der hebräische Ausdruck ist schwierig und bezieht sich wahrscheinlich auf Astrologen, die den Himmel zur Deutung in Bereiche gliederten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die zu den Neumonden Vorhersagen machen“. Das Hebräische kann sich auf Vorhersagen beziehen, die an den monatlichen Neumondzyklus gebunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְאֵית
  choice: Du bist müde geworden
  rationale: Das Nifal Perfekt 2. Person feminin Singular bezeichnet das Ermüden bzw. Erschöpftwerden und richtet sich an Babylon als weiblich angesprochene Stadt.
- source_word: בְּרֹב עֲצָתָיִךְ
  choice: von deinen vielen Beratungen
  rationale: עֵצָה kann Rat, Beratung oder Plan bedeuten. Im Kontext sind Babylons zahlreiche Ratgeber und okkulte Hilfsmittel im Blick; „Beratungen“ bewahrt den Bezug auf ihre vielen eingeholten Ratschläge.
- source_word: יַעַמְדוּ נָא
  choice: Sie sollen doch antreten
  rationale: Der Imperfekt/Jussiv mit נָא formuliert eine spöttische Aufforderung. „antreten“ gibt das Bild des Sich-Hinstellens und die herausfordernde Nuance natürlich wieder.
- source_word: וְיוֹשִׁיעֻךְ
  choice: und dich retten
  rationale: Das Hifil von ישׁע bedeutet retten oder befreien. „retten“ wahrt sowohl den unmittelbaren Sinn der Bewahrung vor dem Gericht als auch die umfassendere Aussage über ihre Unfähigkeit zur Rettung.
- source_word: הברו שָׁמַיִם
  choice: die den Himmel einteilen
  rationale: Die schwierige, wohl auf astrologische Himmelseinteilung bezogene Wendung wird konkret wiedergegeben, ohne sie zum bloßen „Studieren“ des Himmels zu verallgemeinern.
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: die in die Sterne schauen
  rationale: חזה bezeichnet Schauen bzw. visionäres Sehen; zusammen mit „Sternen“ sind astrologische Sterndeuter gemeint. Die Formulierung bleibt bildhaft und verständlich.
- source_word: מוֹדִיעִם לֶחֳדָשִׁים
  choice: die Monat für Monat kundtun
  rationale: לֶחֳדָשִׁים kann eine monatliche Folge oder die Neumonde bezeichnen. Der Text wählt die natürliche zeitliche Wiedergabe und weist die Alternative in einer Fußnote aus.
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: was über dich kommen wird
  rationale: 'Die Wendung bezeichnet den Inhalt der astrologischen Ankündigungen: die bevorstehenden Ereignisse beziehungsweise das drohende Gericht über Babylon.'
theological_decisions:
- issue: Darstellung der okkulten Fachleute Babylons
  choice: Der Vers erscheint als spöttische Herausforderung an astrologische Deuter, die Babylon nicht retten können.
  alternative: Allgemeiner Bezug auf Ratgeber oder Weise ohne ausdrücklich astrologische Ausrichtung.
  rationale: Der Kontext von Jesaja 47 nennt Zaubereien und Beschwörungen; zudem weisen Himmel, Sterne und Monate unmittelbar auf astrologische Praktiken. Die Übersetzung erhält diese Polemik, ohne zusätzliche religiöse Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ironische Herausforderung wird mit „sollen doch antreten“ hörbar gemacht. Fachbegriffe wie „Astrologen“ bleiben den Fußnoten vorbehalten, während der Haupttext die konkreten Bilder des Hebräischen wahrt.
