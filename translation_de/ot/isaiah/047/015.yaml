base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: de
  text: 'So sind dir deine Händler seit deiner Jugend geworden, die, mit denen du dich abgemüht hast: Sie irren umher, jeder in seine eigene Richtung[a]; niemand rettet dich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „jeder zu seiner Seite“. Möglich sind auch: „jeder in seinen eigenen Bereich“ oder „jeder in seine eigene Richtung“. Der hebräische Ausdruck betont wahrscheinlich die Zerstreuung, ohne ein genaues Ziel zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: So sind sie für dich geworden
  rationale: 'Die Formulierung bewahrt den folgernden Rückblick und den resultativen Sinn: Babylons langjährige Helfer haben sich letztlich als nutzlos erwiesen.'
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: die, mit denen du dich abgemüht hast
  rationale: יגע bezeichnet anstrengende Arbeit oder Mühe. Die im Hebräischen knappe Relativkonstruktion lässt die genaue Beziehung offen; „mit denen“ passt zum Zusammenhang langjähriger Handelsbeziehungen, ohne das Tätigkeitswort abzuschwächen.
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: deine Händler seit deiner Jugend
  rationale: סחר bezeichnet Händler oder Kaufleute; die Zeitangabe beschreibt die seit Babylons Frühzeit bestehende Verbindung.
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  choice: Jeder irrt in seine eigene Richtung davon
  rationale: איש wird distributiv als „jeder“ wiedergegeben. עבר kann Seite, Bereich oder Richtung bezeichnen, während תעה ein Umherirren oder Abirren ausdrückt. „davon“ macht die im Zusammenhang erkennbare Zerstreuung natürlich verständlich.
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: niemand rettet dich
  rationale: Die knappe deutsche Formulierung gibt das völlige Fehlen eines Retters oder Befreiers wieder und erhält zugleich das theologische Gewicht des Verbs ישׁע.
theological_decisions:
- issue: Wiedergabe von מוֹשִׁיעֵךְ
  choice: rettet dich
  alternative: befreit dich / kann dich retten
  rationale: „retten“ ist die direkte, im Deutschen natürliche Entsprechung und bewahrt sowohl die konkrete Bedeutung der Befreiung aus Gefahr als auch den weiteren theologischen Klang, ohne ihn dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Satz behält die ungewöhnliche, nachdrückliche Ergebnisformulierung des Hebräischen bei; der zweite Satz ist idiomatisch gefasst, ohne die Mehrdeutigkeit von לְעֶבְרוֹ zu verdecken.
