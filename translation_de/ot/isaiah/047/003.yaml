source:
  edition: WLC
  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: de
  text: Deine Blöße wird aufgedeckt, ja, deine Schande wird sichtbar werden. Ich werde Rache nehmen und keinen Menschen verschonen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzte hebräische Wendung ist schwer zu deuten. Möglich sind auch: „und keinem Menschen begegnen“ oder „und keinen Menschen eingreifen lassen“. Gemeint sein kann, dass kein Mensch das Gericht abwenden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּגָּל
  choice: wird aufgedeckt
  rationale: Das Nifal von גלה bezeichnet hier das passive Aufdecken oder Entblößen und bewahrt das konkrete Bild öffentlicher Bloßstellung.
- source_word: עֶרְוָתֵךְ
  choice: deine Blöße
  rationale: עֶרְוָה bezeichnet die Nacktheit beziehungsweise Blöße und trägt im Zusammenhang den Beiklang beschämender Entblößung. „Blöße“ ist konkret, würdevoll und idiomatisch.
- source_word: גַּם
  choice: ja
  rationale: גַּם verstärkt hier die parallele Aussage. „Ja“ gibt diese Steigerung im Deutschen natürlicher wieder als ein rein additives „auch“.
- source_word: תֵּרָאֶה
  choice: wird sichtbar werden
  rationale: Das Nifal von ראה bezeichnet hier das Sichtbarwerden beziehungsweise Gesehenwerden; die Formulierung hebt die öffentliche Wahrnehmbarkeit der Demütigung hervor.
- source_word: חֶרְפָּתֵךְ
  choice: deine Schande
  rationale: חֶרְפָּה umfasst Schmach, Schande und soziale Entehrung. „Schande“ ist im heutigen Deutsch klar und passt zum Parallelismus mit „Blöße“.
- source_word: נָקָם אֶקָּח
  choice: Ich werde Rache nehmen
  rationale: Die feste Verbindung aus נָקָם und לקח bedeutet „Rache nehmen“ beziehungsweise Vergeltung üben. Die gewählte Form bewahrt den feierlichen Ton des göttlichen Gerichtswortes.
- source_word: וְלֹא אֶפְגַּע אָדָם
  choice: und keinen Menschen verschonen
  rationale: פגע besitzt ein breites Bedeutungsspektrum; im Gerichtszusammenhang lässt sich die schwierige, knappe Wendung als unnachgiebiges Vollziehen der Vergeltung verstehen. אָדָם hat hier wahrscheinlich allgemein-menschliche Bedeutung. Die echte Unsicherheit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Deutung von וְלֹא אֶפְגַּע אָדָם
  choice: und keinen Menschen verschonen
  alternative: und keinem Menschen begegnen; und keinen Menschen eingreifen lassen
  rationale: Die hebräische Wendung ist knapp und mehrdeutig. Im Zusammenhang des Gerichts über Babylon fügt sich die Aussage, dass die Vergeltung niemanden verschont beziehungsweise durch keinen Menschen aufgehalten wird, gut in den Gedankengang. Da „begegnen“ lexikalisch näher an einer häufigen Bedeutung von פגע liegt und auch ein menschliches Eingreifen gemeint sein kann, werden diese Möglichkeiten nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus von „Blöße“ und „Schande“ sowie der ernste Gerichtston bleiben erhalten; die umstrittene Schlusswendung wird im Haupttext verständlich wiedergegeben und in der Fußnote als echte Mehrdeutigkeit kenntlich gemacht.
