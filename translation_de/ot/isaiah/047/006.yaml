  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: de
  text: Ich war zornig über mein Volk. Ich entweihte[a] mein Erbe und gab sie in deine Hand. Du hattest kein Erbarmen mit ihnen.[b] Den Alten[c] hast du dein Joch überaus schwer auferlegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: behandelte mein Erbe wie etwas Unheiliges.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Du setztest ihnen kein Erbarmen; im Hebräischen steht „Erbarmen“ in der Mehrzahl.'
    reason: literal_idiom
  - marker: c
    text: Der hebräische Singular kann hier allgemein oder kollektiv alte Menschen bezeichnen.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: קָצַפְתִּי עַל עַמִּי
  choice: Ich war zornig über mein Volk
  rationale: קצף bezeichnet starken Zorn; „zornig“ wahrt den Ernst des göttlichen Gerichts. עַל wird hier natürlich mit „über“ wiedergegeben.
- source_word: חִלַּלְתִּי נַחֲלָתִי
  choice: Ich entweihte mein Erbe
  rationale: Der Piel von חלל hat die starke Bedeutung „entweihen/profanieren“. Die aktive Aussage der ersten Person wird nicht zu einem bloßen Zulassen abgeschwächt; נחלה bleibt als „Erbe“ in seiner bundesbezogenen Besitzsprache erhalten.
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: und gab sie in deine Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Das Bild der „Hand“ bleibt erhalten; das pluralische „sie“ nimmt inhaltlich die Angehörigen des Volkes auf.
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: Du hattest kein Erbarmen mit ihnen
  rationale: Wörtlich steht eine idiomatische Wendung mit „Erbarmungen setzen“. „Kein Erbarmen haben“ ist modernes, klares Deutsch und bewahrt den Vorwurf mangelnden Mitgefühls.
- source_word: עַל זָקֵן
  choice: Den Alten
  rationale: Der hebräische Singular kann einen alten Menschen stellvertretend bzw. kollektiv bezeichnen. „Den Alten“ erhält diese knappe generische Ausdrucksweise.
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: hast du dein Joch überaus schwer auferlegt
  rationale: „Joch“ bewahrt das Bild bedrückender Herrschaft; „überaus schwer“ gibt כבד mit dem Intensivwort מאד wieder. „Auferlegt“ macht die deutsche Konstruktion natürlich, ohne das Bild aufzulösen.
theological_decisions:
- issue: Gottes Handeln in „Ich entweihte mein Erbe“
  choice: Die aktive Ich-Aussage wird als „Ich entweihte mein Erbe“ beibehalten.
  alternative: „Ich ließ mein Erbe entweihen“ oder „Ich gab mein Erbe preis“
  rationale: 'Der hebräische Text verwendet eine aktive Verbform in der ersten Person. Die Übersetzung wahrt so die Spannung: Gott vollzieht Gericht an seinem Volk, während Babylon zugleich wegen ihrer Erbarmungslosigkeit zur Verantwortung gezogen wird.'
- issue: Verantwortlichkeit Babylons trotz göttlicher Übergabe
  choice: Die unmittelbare Gegenüberstellung von Gottes Übergabe und Babylons Erbarmungslosigkeit bleibt ohne harmonisierende Erklärung stehen.
  alternative: Babylons Härte ausdrücklich als von Gott befohlen oder als vollständig unabhängig von Gottes Gericht darstellen
  rationale: 'Der Vers hält beide Aussagen nebeneinander: Gott gab sein Volk in Babylons Hand, doch Babylon zeigte kein Erbarmen. Die Übersetzung darf diese theologische Spannung nicht einseitig auflösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Bildsprache („in deine Hand“, „Joch“). Die Anrede richtet sich im Kontext an Babylon; im Deutschen muss ihr grammatisches Geschlecht in den Verbformen nicht eigens markiert werden.
