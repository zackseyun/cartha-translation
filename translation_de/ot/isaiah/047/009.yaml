id: ISA.47.9
reference: Isaiah 47:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: de
  text: 'Doch diese beiden Dinge werden in einem Augenblick, an einem einzigen Tag, über dich kommen: Kinderverlust und Witwenstand. Sie werden in vollem Umfang[a] über dich kommen[b], trotz deiner vielen Zaubereien und der großen Macht deiner Beschwörungen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig“ / „in vollem Maß“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlussglieder können auch verstanden werden als: „wegen deiner vielen Zaubereien und der großen Macht deiner Beschwörungen“ oder: „mit deinen vielen Zaubereien und deinen überaus mächtigen Beschwörungen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה ... שְׁתֵּי אֵלֶּה
  choice: Doch beides wird ... über dich kommen
  rationale: Das feminine Pluralverb bezieht sich auf die beiden folgenden Unglücksfälle. „Beides“ gibt die Zweizahl im heutigen Deutsch natürlich wieder.
- source_word: רֶגַע
  choice: in einem Augenblick
  rationale: Die Wendung bewahrt den zeitlichen Sinn eines sehr kurzen Augenblicks und unterstreicht die Plötzlichkeit.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Formulierung gibt die zeitliche Verdichtung und den Nachdruck von אֶחָד idiomatisch wieder.
- source_word: שְׁכוֹל
  choice: Kinderverlust
  rationale: Das Substantiv bezeichnet den Zustand, durch den Tod der Kinder beraubt zu sein; „Kinderverlust“ ist präziser als die auch anders verstehbare „Kinderlosigkeit“.
- source_word: וְאַלְמֹן
  choice: Witwenstand
  rationale: Das abstrakte Substantiv bezeichnet das Dasein als Witwe und entspricht der weiblich personifizierten Angeredeten.
- source_word: כְּתֻמָּם
  choice: in vollem Maß
  rationale: 'Die adverbiale Wendung drückt Vollständigkeit aus: Beide Schicksalsschläge treffen sie uneingeschränkt.'
- source_word: בָּאוּ עָלַיִךְ
  choice: wird es über dich kommen
  rationale: Das hebräische Perfekt wird im prophetischen Zusammenhang als sichere Zukunftsaussage verstanden. Das Singularpronomen greift das deutsche „beides“ auf.
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: trotz deiner vielen Zaubereien
  rationale: 'Die Präposition ב wird im Kontext konzessiv verstanden: Babylons zahlreiche magische Künste können das Gericht nicht abwenden.'
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: trotz ... der sehr großen Macht deiner Beschwörungen
  rationale: עָצְמָה bezeichnet Macht oder Stärke, חֲבָרִים hier magische Beschwörungen; מְאֹד verstärkt die Aussage.
theological_decisions:
- issue: Bedeutung der Präposition ב in den beiden Schlussgliedern
  choice: 'konzessiv: „trotz“'
  alternative: 'kausal: „wegen“; oder begleitend/instrumental: „mit“'
  rationale: 'Im unmittelbaren Kontext verspottet der Text das Vertrauen Babylons auf Magie: Das Unheil kommt trotz dieser Mittel. Da die hebräische Präposition mehrere Beziehungen zulässt, werden die anderen möglichen Deutungen in der Fußnote genannt.'
- issue: Aspekt von בָּאוּ in prophetischer Rede
  choice: 'Zukunft: „wird ... kommen“'
  alternative: 'Perfekt: „ist ... gekommen“'
  rationale: Das Perfekt stellt das angekündigte Geschehen als gewiss dar; eine deutsche Zukunftsform wahrt den zeitlichen Zusammenhang mit dem vorhergehenden Imperfekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kinderverlust“ vermeidet die Mehrdeutigkeit von „Kinderlosigkeit“, während „Witwenstand“ die substantivische Form des Hebräischen bewahrt. Die Wiederholung von „über dich kommen“ folgt dem Nachdruck des Ausgangstextes.
