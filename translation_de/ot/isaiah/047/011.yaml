    issue: „du wirst es nicht sühnen können“ als Haupttext für כַּפְּרָהּ
    rationale: Das Objekt ist hier הֹוָה, ein Verderben bzw. Unheil, nicht Schuld. Im Kontext bezeichnet die Wendung die Unfähigkeit, das Unheil zu beseitigen, abzuwenden oder zu beschwichtigen. „Abwenden“ ist im Deutschen natürlich und kontextuell präzise; die lexikalisch engere Möglichkeit „sühnen“ sollte in der Fußnote stehen.
  - severity: low
    issue: Maskulines Possessivpronomen in Fußnote a
    rationale: Das Bezugswort רָעָה („Unheil“) ist im Hebräischen feminin. Daher muss die alternative deutsche Formulierung „ihren Anbruch“, nicht „seinen Anbruch“, lauten.
