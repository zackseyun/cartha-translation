base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: de
  text: Doch Unheil wird über dich kommen; du wirst nicht wissen, wie du es wegzaubern kannst.[a] Verderben wird über dich hereinbrechen; du wirst es nicht abwenden können.[b] Und plötzlich wird Verwüstung über dich kommen, von der du nichts ahnst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du wirst ihren Anbruch nicht kennen“; möglicherweise auch: „du wirst nicht wissen, wie du es abwenden kannst“. Der hebräische Ausdruck ist schwierig. Die Übersetzung im Haupttext nimmt Bezug auf Babylons Zauberei und Beschwörungen im unmittelbaren Kontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du wirst es nicht beschwichtigen können“. Wörtlich steht hier ein Verb aus der Wortfamilie „bedecken, tilgen, sühnen“; im Kontext kann es das Abwenden oder Beschwichtigen des Unheils bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang des Gerichts bezeichnet das Wort nicht primär moralische Bosheit, sondern ein hereinbrechendes Übel beziehungsweise Unglück. „Unheil“ wahrt die Bedeutungsbreite und passt zum Parallelismus.
- source_word: שַׁחְרָהּ
  choice: wie du es wegzaubern kannst
  rationale: Die schwierige Form ist umstritten. Angesichts der Zaubereien und Beschwörungen Babylons in den Nachbarversen gibt die Wendung wahrscheinlich die Unfähigkeit wieder, das Unheil durch Magie abzuwenden; alternative Deutungen werden in der Fußnote bewahrt.
- source_word: הֹוָה
  choice: Verderben
  rationale: Das Substantiv bezeichnet verhängnisvolles, zerstörerisches Unheil. „Verderben“ ist würdig und unterscheidet den Ausdruck vom ersten Parallelbegriff.
- source_word: כַּפְּרָהּ
  choice: es sühnen
  rationale: Die Wiedergabe erhält den lexikalischen Bezug von כפר zu Bedecken, Tilgen und Sühnen. Im Kontext bedeutet dies, dass Babylon das Verderben weder ausgleichen noch abwenden kann.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Direkte und natürliche Wiedergabe des Adverbs für ein unerwartetes, abruptes Eintreten.
- source_word: שׁוֹאָה
  choice: Verwüstung
  rationale: Das Wort bezeichnet verheerende Zerstörung beziehungsweise Öde. „Verwüstung“ gibt die Schwere des Gerichts klar wieder.
- source_word: לֹא תֵדָעִי
  choice: von der du nichts ahnst
  rationale: Die wörtliche Aussage „du wirst nicht wissen“ hat im Hebräischen ein unausgesprochenes Objekt. „Von der du nichts ahnst“ drückt im Deutschen natürlich aus, dass die plötzlich kommende Verwüstung unerkannt beziehungsweise unvorhergesehen ist.
theological_decisions:
- issue: Wiedergabe von כפר im Gerichtskontext
  choice: „du wirst es nicht sühnen können“
  alternative: „du wirst es nicht abwenden können“ oder „du wirst es nicht beschwichtigen können“
  rationale: „Sühnen“ bewahrt die theologisch bedeutsame lexikalische Verbindung von כפר, ohne hier eine bestimmte Opfertheologie einzutragen. Die kontextuell möglichen Bedeutungen des Abwendens oder Beschwichtigens werden in der Fußnote genannt.
- issue: Deutung der schwierigen Form שַׁחְרָהּ
  choice: magisches Wegzaubern
  alternative: „du wirst seinen Anbruch nicht kennen“ oder „du wirst nicht wissen, wie du es abwenden kannst“
  rationale: Der unmittelbare Kontext spricht von Babylons Zaubereien und Beschwörungen. Dennoch bleibt die hebräische Form unsicher; deshalb werden die anderen ernsthaften Deutungen ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Anrede an Babylon bleibt durch „dich/du“ im Kontext erkennbar. Die dreigliedrige Steigerung des hebräischen Gerichtsspruchs wird erhalten; zugleich werden schwer verständliche Hebraismen nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
