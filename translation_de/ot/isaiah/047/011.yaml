  to: Doch Unheil wird über dich kommen; du wirst nicht wissen, wie du es wegzaubern kannst.[a] Verderben wird über dich hereinbrechen; du wirst es nicht abwenden können.[b] Und plötzlich wird Verwüstung über dich kommen, von der du nichts ahnst.
