  verdict: revise
  source_fidelity: Die dreigliedrige Ankündigung des Gerichts und die Abfolge von Unheil, Verderben und Verwüstung geben den hebräischen Text treffend wieder. Die schwierige Wendung שַׁחְרָהּ wird im Haupttext kontextgerecht als magisches Abwenden verstanden und mit einer angemessenen Alternativlesart dokumentiert. Bei כַּפְּרָהּ ist „sühnen“ als lexikalische Möglichkeit zu vermerken, im vorliegenden Zusammenhang mit einer Katastrophe ist „abwenden“ jedoch die idiomatischere und kontextuell wahrscheinlichere Hauptwiedergabe.
  naturalness: „Wegzaubern“ ist verständlich, aber wegen des Kontexts von Babylons Zauberkünsten noch vertretbar. „Verderben sühnen“ ist dagegen im heutigen Deutsch mit einer hereingebrochenen Katastrophe semantisch unerquicklich; „nicht abwenden können“ ist klar und natürlich. Die Schlusssatzwendung „von der du nichts ahnst“ gibt das implizite Objekt von לֹא תֵדָעִי idiomatisch wieder.
  terminology: „Unheil“, „Verderben“ und „Verwüstung“ unterscheiden die parallelen hebräischen Begriffe sinnvoll. Die Fußnote zu כַּפְּרָהּ bewahrt die Verbindung zur Wortfamilie von „sühnen/tilgen“, ohne diese im deutschen Haupttext unnatürlich auf das Verderben zu beziehen.
