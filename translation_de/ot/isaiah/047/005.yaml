  variant: modern standard German
source:
  edition: WLC
  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: de
  text: Sitz schweigend da und geh in die Dunkelheit, Tochter der Chaldäer! Denn man wird dich nicht länger »Herrin der Königreiche«[a] nennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebieterin der Königreiche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי דוּמָם
  choice: Sitz schweigend da
  rationale: Der feminine Singularimperativ von ישׁב richtet sich an das personifizierte Babylon; דוּמָם bezeichnet adverbial Schweigen oder Regungslosigkeit. Die Formulierung ist im Deutschen natürlich und bewahrt die erzwungene Stille der Erniedrigungsszene.
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: und geh in die Dunkelheit
  rationale: בוא mit Richtungsangabe bezeichnet hier das Eintreten in die Dunkelheit. »Geh in« entspricht im Deutschen der Bewegung vom Angesprochenen weg und erhält das konkrete prophetische Bild.
- source_word: בַּת כַּשְׂדִּים
  choice: Tochter der Chaldäer
  rationale: Die prophetische Personifikation einer Stadt beziehungsweise eines Volkes als Tochter bleibt erhalten, ohne Babylon als Zusatz in den Text einzutragen.
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: man wird dich nicht länger … nennen
  rationale: Die Negation mit יסף drückt das Aufhören aus. Die dritte Person Plural hat hier einen unbestimmten Handlungsträger, der im heutigen Deutsch idiomatisch mit »man« wiedergegeben wird.
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: Herrin der Königreiche
  rationale: גְּבֶרֶת bezeichnet eine Herrin beziehungsweise Gebieterin und betont Rang und Vorherrschaft, ohne das ausdrücklichere Amt einer Königin einzutragen. Der Genitiv erhält die knappe hebräische Fügung.
theological_decisions:
- issue: Dunkelheit als Bild des Gerichts und des Verlusts von Ansehen
  choice: Das konkrete Bild »Dunkelheit« bleibt im Haupttext stehen.
  alternative: Verborgenheit oder Bedeutungslosigkeit
  rationale: Die wörtliche Bildsprache lässt Erniedrigung, Gericht und Verlust öffentlicher Geltung aus dem Zusammenhang hervorgehen, ohne die Metapher auf nur eine Deutung festzulegen.
- issue: Weibliche Personifikation Babylons beziehungsweise Chaldäas
  choice: Die Anrede als »Tochter der Chaldäer« und der Titel »Herrin« werden bewahrt.
  alternative: Die Personifikation durch eine direkte Benennung Babylons ersetzen.
  rationale: Das Hebräische spricht die Großmacht als weibliche Gestalt an. Diese Rhetorik gehört wesentlich zur Gerichtsankündigung und sollte nicht abstrahiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ bleibt knapp und eindringlich; das Ausrufezeichen schließt die direkte Anrede ab. »Man« gibt den unbestimmten hebräischen Plural natürlich wieder. Die Anführungszeichen markieren den aberkannten Ehrentitel.
