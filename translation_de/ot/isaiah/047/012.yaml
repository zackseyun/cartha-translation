  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: de
  text: Stell dich doch hin mit deinen Beschwörungen und deinen vielen Zaubereien, mit denen du dich seit deiner Jugend abgemüht hast! Vielleicht kannst du dir damit nützen[a], vielleicht kannst du Furcht einflößen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Vielleicht kannst du Erfolg haben.'
    reason: Das Verb kann hier den Sinn haben, Nutzen oder Vorteil zu erlangen beziehungsweise Erfolg zu haben.
  - marker: b
    text: 'Oder: Vielleicht kannst du dich behaupten.'
    reason: Das seltene Verb kann das Einflößen von Furcht bezeichnen; seine genaue Nuance ist unsicher und wird auch im Sinn von Sichbehaupten oder Erfolg haben verstanden.
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: Tritt doch auf
  rationale: Der feminine Singularimperativ von עמד mit נָא wird als dringende, im Kontext spöttische Aufforderung wiedergegeben. „Tritt doch auf“ bewahrt das Bild des Sich-Hinstellens und klingt im Deutschen natürlicher als „Steh doch“.
- source_word: בַחֲבָרַיִךְ
  choice: mit deinen Beschwörungen
  rationale: חֲבָרִים bezeichnet hier magische Bindungen beziehungsweise gesprochene Zauberformeln. „Beschwörungen“ ist gegenwärtiges, verständliches Deutsch und passt zum Parallelbegriff „Zaubereien“.
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: und deinen vielen Zaubereien
  rationale: רֹב bezeichnet die große Menge, כְּשָׁפִים wiederholte magische Praktiken. Die Formulierung erhält sowohl die Vielzahl als auch den Plural.
- source_word: בַּאֲשֶׁר יָגַעַתְּ
  choice: mit denen du dich ... abgemüht hast
  rationale: יגע bezeichnet anstrengende, ermüdende Arbeit. „Sich abmühen“ bringt diesen Aspekt deutlicher zum Ausdruck als das neutralere „arbeiten“.
- source_word: מִנְּעוּרַיִךְ
  choice: seit deiner Jugend
  rationale: Die Wendung bezeichnet eine seit früher Zeit fortgesetzte Tätigkeit; „seit deiner Jugend“ ist im modernen Deutschen idiomatisch.
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: Vielleicht kannst du dir damit nützen
  rationale: יכל mit הועיל spricht von der Fähigkeit, Nutzen oder Vorteil zu bewirken. Das ergänzte „dir damit“ macht den Bezug im Deutschen verständlich, ohne den Sinn auf bloßen finanziellen Gewinn zu verengen.
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: vielleicht kannst du Schrecken verbreiten
  rationale: ערץ kann das Hervorrufen von Furcht oder Schrecken bezeichnen. Die Wiedergabe erhält den möglichen kausativen Sinn, ohne ein ausdrücklich genanntes Objekt zu ergänzen.
theological_decisions:
- issue: Ton der Anrede an Babylon
  choice: Die Aufforderung und die beiden Vielleicht-Sätze bleiben wörtlich als spöttische Herausforderung erkennbar, ohne die Ironie ausdrücklich in den Vers einzufügen.
  alternative: Die Worte als ernst gemeinten Rat oder durch einen erklärenden Zusatz ausdrücklich als Spott wiedergeben.
  rationale: Der Zusammenhang des Gerichtswortes macht den Spott über Babylons Vertrauen auf Magie deutlich. Die Übersetzung lässt diesen Ton aus dem Kontext hervorgehen und fügt keine Deutung in den Haupttext ein.
- issue: Wirkung der Zauberei im letzten Satzglied
  choice: „Schrecken verbreiten“ bewahrt die mögliche Bedeutung, andere in Furcht zu versetzen.
  alternative: „die Oberhand gewinnen“ oder „standhalten“ als stärker ergebnisorientierte Deutung.
  rationale: Die Wurzel ערץ ist semantisch nicht völlig eindeutig. Der furchterregende Sinn ist gut belegt und passt zum Versuch Babylons, die drohende Gefahr abzuwehren; die Alternative wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt durchgehend feminin singularisch, da sie Babylon als personifizierte Stadt anspricht. Das Ausrufezeichen nach dem ersten Satz hebt die herausfordernde Aufforderung hervor, ohne zusätzliche Deutungswörter einzusetzen.
