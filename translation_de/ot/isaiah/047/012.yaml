  terminology: „Beschwörungen“ und „Zaubereien“ unterscheiden die parallelen Begriffe angemessen. „Sich abmühen“ gibt יגע mit seinem Aufwand- und Ermüdungsaspekt gut wieder. Die Fußnote zur letzten Wendung sollte die Deutungsalternative als mögliche Bedeutung ausweisen, ohne eine syntaktisch unpassende Erklärung vom „Überwältigen“ beizufügen.
