base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: de
  text: 'Du hast auf deine Bosheit vertraut und gesagt: »Niemand sieht mich.« Deine Weisheit und dein Wissen haben dich irregeführt, und du hast in deinem Herzen gesagt: »Ich bin, und außer mir gibt es niemanden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin, und sonst gibt es nichts.« Die hebräische Wendung kann abstrakter verstanden werden; im Zusammenhang bringt sie wahrscheinlich Babylons Anspruch zum Ausdruck, ohnegleichen zu sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּבְטְחִי בְרָעָתֵךְ
  choice: Du hast auf deine Bosheit vertraut
  rationale: בטח mit ב bezeichnet hier das Vertrauen auf etwas; רָעָה meint im Zusammenhang das moralisch Böse der angesprochenen Babylon, nicht ein Unglück.
- source_word: אֵין רֹאָנִי
  choice: Niemand sieht mich
  rationale: Die hebräische Existenzverneinung mit Partizip und Objektsuffix wird so knapp und natürlich wiedergegeben; gemeint ist die vermeintliche Verborgenheit ihres Handelns.
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: Deine Weisheit und dein Wissen
  rationale: Die beiden Begriffe bleiben unterschieden und bewahren die rhetorische Paarung des Hebräischen.
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: haben dich irregeführt
  rationale: Das Verb bezeichnet hier das Abbringen vom rechten Weg. Der deutsche Plural bezieht die Aussage natürlich auf die unmittelbar vorausgehende Paarung aus Weisheit und Wissen.
- source_word: בְלִבֵּךְ
  choice: in deinem Herzen
  rationale: Die bildhafte hebräische Wendung für inneres Denken ist auch im modernen Deutschen verständlich und stilistisch angemessen.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Ich bin, und außer mir gibt es niemanden
  rationale: Die Formulierung bewahrt die schroffe Selbstbehauptung und den Anspruch Babylons auf konkurrenzlose Einzigartigkeit, ohne die mögliche abstraktere Bedeutung von אֶפֶס zu verschweigen.
theological_decisions:
- issue: Babylons Selbstbehauptung אֲנִי וְאַפְסִי עוֹד und ihr Anklang an exklusive Gottesworte im Jesajabuch
  choice: Ich bin, und außer mir gibt es niemanden
  alternative: Ich bin, und sonst gibt es nichts
  rationale: Die personale Fassung passt zur personifizierten Stadt und erhält die theologische Ironie ihres vermessenen Anspruchs. Die abstraktere Deutung bleibt als echte sprachliche Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede und bewahrter Herzmetaphorik. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlussaussage.
