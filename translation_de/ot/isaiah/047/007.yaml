base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: de
  text: 'Du sagtest[a]: »Für immer werde ich Herrin sein.« Sodass du dir diese Dinge nicht zu Herzen nahmst[b] und nicht an ihr Ende dachtest[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit dem fortführenden Bindewort: „Und du sagtest“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „du legtest diese Dinge nicht auf dein Herz“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sachlich: „dessen Ende“ beziehungsweise „wie es ausgehen würde“. Das Hebräische hat ein feminines Singularsuffix und setzt damit wahrscheinlich die weibliche Personifikation fort.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Du sagtest
  rationale: Die feminine Singularform richtet sich unmittelbar an das als Frau dargestellte Babylon. Das eröffnende waw führt die Rede fort, muss im Deutschen aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: לְעוֹלָם אֶהְיֶה גְבָרֶת
  choice: Für immer werde ich Herrin sein
  rationale: „Für immer“ gibt den unbegrenzten Zukunftsanspruch wieder; „Herrin“ bezeichnet eine Frau in einer übergeordneten oder gebietenden Stellung, ohne den nicht ausdrücklich genannten Königinnentitel einzutragen.
- source_word: עַד לֹא
  choice: Darum … nicht
  rationale: Die Verbindung beschreibt hier am ehesten die Folge der selbstsicheren Behauptung. „Darum“ gibt diesen Zusammenhang in natürlichem Deutsch wieder, ohne das schwer verständliche wörtliche „bis nicht“ nachzubilden.
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: nahmst du dir dies nicht zu Herzen
  rationale: Die hebräische Wendung spricht wörtlich davon, etwas auf das Herz zu legen. Die gewählte deutsche Redewendung bewahrt dieses Bild und bezeichnet ernsthaftes Bedenken.
- source_word: לֹא זָכַרְתְּ אַחֲרִיתָהּ
  choice: dachtest nicht an ihr Ende
  rationale: זכר kann hier das bewusste Bedenken oder Im-Sinn-Behalten bezeichnen. „An … denken“ ist im Deutschen idiomatisch; „ihr Ende“ bewahrt den femininen Singularsuffix und die Personifikation.
theological_decisions:
- issue: Feminine Personifikation Babylons in אַחֲרִיתָהּ
  choice: „ihr Ende“
  alternative: „dessen Ende“ oder „wie es ausgehen würde“
  rationale: Der feminine Singularsuffix wird sichtbar erhalten und entspricht der durchgehenden Darstellung Babylons als Frau. Da sein genauer Bezug nicht völlig eindeutig ist, wird die sachlich-neutrale Alternative in einer Fußnote genannt.
- issue: Zusammenhang von עַד לֹא mit dem vorausgehenden Hochmutsspruch
  choice: 'Folgebeziehung: „Darum … nicht“'
  alternative: „bis … nicht“ oder „sodass … nicht“
  rationale: Im Kontext bezeichnet die ungewöhnliche Verbindung wahrscheinlich die Folge beziehungsweise das Ausmaß der selbstsicheren Haltung. Die Wiedergabe vermeidet eine unverständliche Wort-für-Wort-Konstruktion, ohne eine zusätzliche Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Satzführung. Die poetische Frauenpersonifikation und das Herz-Bild bleiben erhalten; altertümliche Formen und eine Überpräzisierung als „Königin“ werden vermieden.
