  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: de
  text: Sieh[a], sie sind wie Stoppeln geworden; Feuer hat sie verbrannt. Sie können ihr Leben nicht aus der Gewalt der Flamme retten. Es gibt keine Glut, an der man sich wärmen kann[b], kein Feuer, vor dem man sitzen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „keine Glut zum Wärmen“. Die hebräische Formulierung ist schwierig; gemeint ist offenbar keine kleine, nützliche Herdenglut, sondern ein verzehrendes Feuer.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Hervorhebung wird in modernem, würdigem Deutsch knapp und unmittelbar wiedergegeben.
- source_word: הָיוּ כְקַשׁ
  choice: sie sind wie Stoppeln geworden
  rationale: Das Perfekt bezeichnet hier einen eingetretenen Zustand; קַשׁ meint trockenes, leicht brennbares Stroh beziehungsweise Stoppeln.
- source_word: אֵשׁ שְׂרָפָתַם
  choice: Feuer verbrennt sie
  rationale: Die knappe, bildhafte Aussage bewahrt die zerstörerische Kraft des Verbs שׂרף, ohne den Aspekt unnötig festzulegen.
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: Sie können ihr Leben nicht … retten
  rationale: נֶפֶשׁ bezeichnet hier das eigene Leben beziehungsweise die eigene Person; die Formulierung bleibt konkret und vermeidet zusätzliche soteriologische Färbung.
- source_word: מִיַּד לֶהָבָה
  choice: aus der Gewalt der Flamme
  rationale: Die Wendung „aus der Hand“ bezeichnet idiomatisch Macht oder Zugriff. „Aus der Gewalt“ gibt diesen Sinn natürlich wieder und erhält das personifizierende Bild teilweise.
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: Das ist keine Glut, an der man sich wärmt
  rationale: Die schwierige Form לַחְמָם wird als „zum Wärmen“ verstanden. Der Satz kontrastiert eine nützliche Herdenglut mit dem verzehrenden Feuer des Gerichts.
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: kein Feuer, vor dem man sitzt
  rationale: אוּר bezeichnet hier ein Feuer; die Wendung beschreibt natürlich ein Herdfeuer, vor dem Menschen sitzen.
theological_decisions:
- issue: Tragweite des Gerichtsbildes
  choice: Das Bild bezeichnet im unmittelbaren Zusammenhang das vernichtende Gericht über Babylons Ratgeber beziehungsweise Beschwörer.
  alternative: Eine allgemeine oder endzeitliche Aussage über göttliches Gericht.
  rationale: Der Wortlaut bleibt drastisch, wird aber nicht durch spätere Lehrvorstellungen über den historischen Kontext hinaus festgelegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. „Sieh“ bewahrt den Nachdruck von הִנֵּה; „Stoppeln“, „Gewalt der Flamme“ und die Herdfeuer-Metaphorik bleiben anschaulich. Die syntaktisch schwierige Wärmeklausel wird verständlich wiedergegeben, ohne ihre Bildfunktion zu verlieren.
