source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: de
  text: Steig herab und setz dich in den Staub, jungfräuliche Tochter Babylon[a]! Setz dich auf den Boden, ohne Thron, Tochter der Chaldäer[b]! Denn man wird dich nicht länger »die Zarte und Verwöhnte« nennen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jungfräuliche Tochter Babylon“ ist eine dichterische Personifikation der Stadt und Weltmacht als junge königliche Frau.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Setz dich auf den Boden; da ist kein Thron.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Zarte und Empfindliche“; das zweite Wort kann eine durch Luxus geprägte, verwöhnte Lebensweise bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְדִי
  choice: Steig herab
  rationale: Der feminine Singularimperativ von ירד bezeichnet das Herabsteigen aus einer erhöhten Stellung. „Steig herab“ ist im Deutschen natürlich und bewahrt im Gerichtswort das Bild des erzwungenen sozialen Abstiegs.
- source_word: וּשְׁבִי / שְׁבִי
  choice: setz dich / Setz dich
  rationale: Im Zusammenhang mit Staub und Erde bedeutet ישב hier das Einnehmen einer erniedrigten Sitzposition, nicht „wohnen“. Die Wiederholung bildet die hebräische Rhetorik ab.
- source_word: עַל עָפָר
  choice: in den Staub
  rationale: Mit dem Bewegungsimpuls von „steig herab und setz dich“ ist „in den Staub“ idiomatisches Deutsch und vermittelt deutlich die Erniedrigung.
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: jungfräuliche Tochter Babylon
  rationale: Die Constructusverbindung personifiziert Babylon als junge, bislang unberührte Frau. Die ungewöhnliche, aber verständliche Form bewahrt die dichterische Titulatur, statt sie zu „Jungfrau Babylon“ zu verkürzen.
- source_word: לָאָרֶץ
  choice: auf die Erde
  rationale: Die Präposition bezeichnet bei ישב den Ort beziehungsweise das Ziel des Sichsetzens. „Auf die Erde“ steht natürlich parallel zu „in den Staub“.
- source_word: אֵין כִּסֵּא
  choice: ohne Thron
  rationale: Die knappe Nominalkonstruktion kann als „kein Thron“ oder umstandsangabend „ohne Thron“ verstanden werden. Letzteres fügt sich natürlich in die Aufforderung ein und wahrt das Bild verlorener Königswürde.
- source_word: בַּת כַּשְׂדִּים
  choice: Tochter der Chaldäer
  rationale: Die Wiedergabe folgt dem pluralischen Volksnamen כַּשְׂדִּים und erhält die zweite weibliche Personifikation Babylons.
- source_word: כִּי לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: Denn man wird dich nicht länger … nennen
  rationale: יסף mit folgendem Verb drückt das Aufhören eines bisherigen Zustands aus. Der unbestimmte Plural יִקְרְאוּ wird im Deutschen idiomatisch mit „man“ wiedergegeben.
- source_word: רַכָּה
  choice: die Zarte
  rationale: רַכָּה bezeichnet Weichheit, Zartheit oder Empfindsamkeit. Als substantiviertes Adjektiv bildet „die Zarte“ natürlich den zugeschriebenen Ehrentitel ab.
- source_word: וַעֲנֻגָּה
  choice: und Verwöhnte
  rationale: עֲנֻגָּה bezeichnet eine durch Luxus geprägte, verweichlichte oder verwöhnte Person. „Verwöhnte“ bringt diesen Aspekt präziser zum Ausdruck als das im Deutschen hier mehrdeutige „Feine“ oder „Zarte“.
theological_decisions:
- issue: Weibliche und königliche Personifikation Babylons
  choice: Die Titel „jungfräuliche Tochter Babylon“ und „Tochter der Chaldäer“ bleiben erhalten.
  alternative: Die Personifikation zu bloßem „Babylon“ vereinfachen.
  rationale: Der Gerichtsspruch stellt die Weltmacht dichterisch als junge königliche Frau dar, die ihren Thron verliert und in den Staub erniedrigt wird. Diese Spannung gehört zur Aussage des Textes und darf nicht eingeebnet werden.
- issue: Bedeutung der Bezeichnung עֲנֻגָּה
  choice: „Verwöhnte“
  alternative: „Feine“, „Empfindliche“ oder „Luxuriöse“
  rationale: Das Wortfeld umfasst kultivierte Zartheit und ein vom Luxus geprägtes Leben. „Verwöhnte“ bewahrt im Kontext des Gerichtsspruchs die soziale Konnotation, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Direktheit. Die Imperative und ihre Wiederholung erhalten den scharfen Rhythmus des hebräischen Gerichtsworts. Ungewöhnliche Personifikationstitel werden aus literarischen Gründen beibehalten und knapp erläutert.
