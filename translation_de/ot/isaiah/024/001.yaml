id: ISA.24.1
reference: Isaiah 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: de
  text: Siehe, Jahwe leert die Erde[a] aus und verheert sie; er verzerrt ihre Oberfläche[b] und zerstreut ihre Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“. Das hebräische Wort אֶרֶץ kann beides bedeuten; der weitere Zusammenhang spricht hier eher für „die Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihr Gesicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die traditionelle, weiterhin verständliche Aufmerksamkeitsformel bewahrt den feierlichen und eindringlichen Charakter der prophetischen Ankündigung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בּוֹקֵק
  choice: leert … aus
  rationale: Die partizipiale Form zeichnet das angekündigte Handeln als unmittelbar und anschaulich; die Wendung bewahrt das Bild des Leerens.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann Land oder Erde bedeuten. Der weitere Zusammenhang von Jesaja 24 legt hier den umfassenden Sinn „Erde“ nahe, ohne die lexikalische Alternative auszuschließen.
- source_word: וּבֹלְקָהּ
  choice: und verheert sie
  rationale: Das seltene Verb steht klanglich und inhaltlich parallel zu בּוֹקֵק und verstärkt das Bild vollständiger Verwüstung. „Verheert“ gibt die zerstörerische Wirkung knapp und würdig wieder.
- source_word: וְעִוָּה
  choice: er entstellt
  rationale: Das Verb bezeichnet ein Verdrehen oder Verformen. „Entstellt“ wahrt das konkrete Bild, ohne es zu einer vollständigen Umwälzung auszuweiten.
- source_word: פָנֶיהָ
  choice: ihre Oberfläche
  rationale: Wörtlich steht „ihr Gesicht“; auf die Erde bezogen bezeichnet die Wendung natürlich ihre Oberfläche.
- source_word: וְהֵפִיץ
  choice: und zerstreut
  rationale: „Zerstreuen“ gibt das gewaltsame Auseinandertreiben von Menschen im Gerichtszusammenhang präzise wieder.
- source_word: יֹשְׁבֶיהָ
  choice: ihre Bewohner
  rationale: Das substantivierte Partizip bezeichnet kollektiv diejenigen, die auf der Erde wohnen; „Bewohner“ ist im Deutschen natürlich und genau.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Räumlicher Umfang von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Das Wort selbst lässt beide Bedeutungen zu. Der umfassende Gerichtshorizont des Kapitels spricht hier für „Erde“; die mögliche engere Lesart wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das einleitende „Siehe“ erhält den feierlichen prophetischen Ton. Das Präsens vermittelt die durch הִנֵּה und das Partizip erzeugte Unmittelbarkeit und wird für die eng verbundenen Folgehandlungen einheitlich fortgeführt. Die hebräische Klangfigur zwischen בּוֹקֵק und בֹלְקָהּ lässt sich im Deutschen nicht vollständig nachbilden; „leert … aus und verheert“ bewahrt jedoch Parallelität und Steigerung.
