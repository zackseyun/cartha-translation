source:
  edition: WLC
  text: עַל כֵּ֥ן בָּ/אֻרִ֖ים כַּבְּד֣וּ יְהוָ֑ה בְּ/אִיֵּ֣י הַ/יָּ֔ם שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: de
  text: Darum gebt Jahwe im Osten[a] die Ehre; in den Küstenländern des Meeres gebt dem Namen Jahwes, des Gottes Israels, die Ehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Regionen des Lichts«; das hebräische Wort ist schwierig und wurde auch als »in den Feuern« verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die geläufige Folgerungsformel gibt den Schluss aus dem vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: בָּאֻרִים
  choice: im Osten
  rationale: Die schwierige Form lässt an »Lichter« oder »Feuer« denken; der Parallelismus mit den Küstenländern des Meeres spricht jedoch für eine geografische Deutung. Die echte lexikalische Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: כַּבְּדוּ
  choice: gebt … die Ehre
  rationale: Der Pluralimperativ von כבד fordert dazu auf, Jahwe Ehre und Gewicht beizumessen; die deutsche Wendung ist natürlich und bewahrt den auffordernden Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאִיֵּי הַיָּם
  choice: in den Küstenländern des Meeres
  rationale: אִיִּים kann Inseln oder maritime Küstengebiete bezeichnen. »Küstenländer« bewahrt den weiten geografischen Sinn, während »des Meeres« das hebräische Bild ausdrücklich erhält.
- source_word: שֵׁם יְהוָה
  choice: dem Namen Jahwes
  rationale: Die Formulierung bewahrt die ausdrückliche Ehrung des offenbarten Namens Gottes.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die Genitivfügung gibt die hebräische Status-constructus-Verbindung präzise und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von בָּאֻרִים
  choice: 'geografisch: »im Osten«'
  alternative: »in den Regionen des Lichts«; »in den Feuern«
  rationale: Der Parallelismus mit den Küstenländern des Meeres legt eine geografische Gegenüberstellung nahe. Da Wortform und Bedeutung dennoch unsicher sind, werden die anderen möglichen Deutungen nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Nennung Jahwes und die syntaktische Parallelität des hebräischen Verses bleiben erhalten; der Fußnotenmarker steht unmittelbar bei der umstrittenen Wendung.
