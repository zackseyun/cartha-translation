  variant: modern standard German
source:
  edition: WLC
  text: הֵ֛מָּה יִשְׂא֥וּ קוֹלָ֖/ם יָרֹ֑נּוּ בִּ/גְא֣וֹן יְהוָ֔ה צָהֲל֖וּ מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
translation:
  language: de
  text: Sie erheben ihre Stimme und jubeln. Über die Hoheit Jahwes jauchzen sie vom Meer her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Westen her“ beziehungsweise „von den Küstenländern her“. Das hebräische Wort für „Meer“ kann in prophetischer Dichtung auch geografisch den Westen oder die Meeresgebiete bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Personalpronomen hebt die Handelnden hervor; im Deutschen genügt hier das natürliche „Sie“, ohne die Betonung künstlich zu verstärken.
- source_word: יִשְׂאוּ קוֹלָם
  choice: sie erheben ihre Stimme
  rationale: Die hebräische Wendung bedeutet, die Stimme zu erheben. Der kollektive Singular „Stimme“ folgt dem Hebräischen und ist auch im Deutschen idiomatisch.
- source_word: יָרֹנּוּ
  choice: jubeln
  rationale: Das Verb bezeichnet einen lauten, freudigen Ruf und kann auch gesanglichen Jubel einschließen; „jubeln“ wahrt diese Bedeutungsbreite.
- source_word: בִּגְאוֹן
  choice: über die Hoheit
  rationale: גאון bezeichnet hier erhabene Größe oder Hoheit. „Über“ gibt den Anlass des Jubels wieder, ohne die Präposition ausschließlich kausal festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צָהֲלוּ
  choice: jauchzen
  rationale: Das Verb bezeichnet einen lauten, weithin hörbaren Freudenruf. „Jauchzen“ bewahrt die feierliche, poetische Klangfarbe und unterscheidet sich passend von „jubeln“.
- source_word: מִיָּם
  choice: vom Meer her
  rationale: Die Form bedeutet wörtlich „vom Meer“. „Vom Meer her“ klingt im Deutschen natürlich und lässt sowohl eine räumliche als auch eine geografische Deutung offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname ausdrücklich; seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug der Freude auf גְּאוֹן יְהוָה
  choice: über die Hoheit Jahwes
  alternative: wegen der Hoheit Jahwes / angesichts der Hoheit Jahwes
  rationale: Die Präposition ב lässt hier mehrere Nuancen zu. „Über“ bezeichnet Jahwes Hoheit als Gegenstand beziehungsweise Anlass des Jubels, ohne die Beziehung enger als nötig festzulegen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdig-poetischem Ton. Die parallelen Verben „jubeln“ und „jauchzen“ bilden die gesteigerte Lautstärke des hebräischen Verses ab; „Hoheit“ bewahrt den erhabenen Charakter von גאון.
