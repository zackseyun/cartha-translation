  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: de
  text: Darum hat ein Fluch[a] die Erde[b] verzehrt, und die auf ihr wohnen, müssen ihre Schuld tragen. Darum sind die Bewohner der Erde versengt, und nur wenige Menschen[c] bleiben übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Schwur“ beziehungsweise „ein Schwurfluch“. Das hebräische Wort kann einen Schwur oder einen Fluch bezeichnen; im Zusammenhang des gebrochenen Bundes passt „Fluch“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“. Wegen des umfassenden Horizonts des Kapitels steht hier „die Erde“.'
    reason: alternative_reading
  - marker: c
    text: Das hebräische Wort bezeichnet den sterblichen Menschen und wird hier kollektiv für Menschen gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folge aus der Anklage im vorausgehenden Vers.
- source_word: אָלָה
  choice: ein Fluch
  rationale: Im Zusammenhang des gebrochenen Bundes und des folgenden Gerichts bezeichnet das Wort am ehesten den wirksamen Fluch; die mögliche Bedeutung „Schwur“ bleibt in einer Fußnote erhalten.
- source_word: אָכְלָה
  choice: hat … verzehrt
  rationale: Bewahrt das starke Bild des hebräischen Verbs „essen, verzehren“, ohne im Deutschen unnatürlich zu wirken.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der umfassende Horizont von Jesaja 24 spricht hier eher für „Erde“ als für das örtlich begrenzte „Land“.
- source_word: וַיֶּאְשְׁמוּ
  choice: müssen ihre Schuld tragen
  rationale: Gibt sowohl das Schuldigsein als auch dessen Folgen wieder und vermeidet eine vorschnelle Festlegung allein auf Schuldstatus oder Bestrafung.
- source_word: יֹשְׁבֵי בָהּ
  choice: die auf ihr wohnen
  rationale: Entspricht der partizipialen Wendung und ist in modernem Deutsch klar und natürlich.
- source_word: חָרוּ
  choice: sind … versengt
  rationale: Drückt die zerstörerische Hitze des Gerichts bildhaft aus; „verbrannt“ oder „verdorrt“ wären ebenfalls möglich, legen den Vorgang aber enger fest.
- source_word: יֹשְׁבֵי אֶרֶץ
  choice: die Bewohner der Erde
  rationale: Eine flüssige deutsche Wiedergabe der hebräischen Konstruktverbindung.
- source_word: וְנִשְׁאַר
  choice: bleiben übrig
  rationale: Gibt den Gedanken eines verbleibenden Restes unmittelbar wieder.
- source_word: אֱנוֹשׁ
  choice: Menschen
  rationale: Das kollektiv gebrauchte Wort bezeichnet sterbliche Menschen; „Menschen“ ist inklusiv, präzise und idiomatisch.
- source_word: מִזְעָר
  choice: nur wenige
  rationale: Die Hinzufügung von „nur“ bringt die betonte geringe Zahl im Deutschen knapp zum Ausdruck.
theological_decisions:
- issue: Bedeutung von אָלָה im Gerichtszusammenhang
  choice: Fluch
  alternative: Schwur; Schwurfluch
  rationale: Vers 5 spricht von übertretenen Weisungen und einem gebrochenen Bund. Daher ist der gerichtliche Fluch die wahrscheinlichste Bedeutung, ohne die lexikalische Alternative zu verschweigen.
- issue: Reichweite von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Die universale und kosmische Sprache des Kapitels legt „Erde“ nahe; die lokalere Lesart „Land“ bleibt sprachlich möglich.
- issue: Wiedergabe von אֱנוֹשׁ
  choice: Menschen
  alternative: Menschheit; Sterbliche
  rationale: Der maskuline Singular wird kollektiv gebraucht und hebt menschliche Sterblichkeit hervor. „Menschen“ bezeichnet die gemeinte Gruppe ohne unnötige geschlechtliche Verengung.
- issue: Verhältnis von Schuld und Strafe in וַיֶּאְשְׁמוּ
  choice: müssen ihre Schuld tragen
  alternative: werden schuldig; büßen dafür
  rationale: Die Form kann Schuldhaftigkeit und deren belastende Folgen anklingen lassen. Die gewählte Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Darum“ und „Erde“ bildet die hebräische Struktur ab; „müssen ihre Schuld tragen“ bewahrt die Verbindung von Verantwortlichkeit und Gerichtsfolge.
