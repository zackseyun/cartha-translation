base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
translation:
  language: de
  text: In der Stadt ist Verwüstung zurückgeblieben, und das Tor ist zu Trümmern geschlagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁאַר
  choice: ist … geblieben
  rationale: Das Nifal von שׁאר bezeichnet das, was nach der Verwüstung übrig geblieben ist. Die deutsche Perfektform gibt den erreichten Zustand natürlich wieder.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: עִיר bezeichnet gewöhnlich eine Stadt; Präposition und Artikel werden direkt wiedergegeben.
- source_word: שַׁמָּה
  choice: Verwüstung
  rationale: Das Substantiv bezeichnet einen Zustand oder Ort der Verheerung. „Verwüstung“ bewahrt den abstrakten Charakter und passt als Subjekt des Satzes.
- source_word: וּשְׁאִיָּה
  choice: zu Trümmern
  rationale: שְׁאִיָּה bezeichnet Ruin oder Verwüstung. In Verbindung mit dem Passivverb wird es im Deutschen natürlich resultativ wiedergegeben.
- source_word: יֻכַּת
  choice: ist … geschlagen
  rationale: Das Hofal von כתת drückt aus, dass etwas zerschlagen oder zertrümmert wird. Zusammen mit „zu Trümmern“ vermittelt „geschlagen“ die passive zerstörerische Einwirkung.
- source_word: שָׁעַר
  choice: das Tor
  rationale: שַׁעַר bedeutet „Tor“, im Zusammenhang wahrscheinlich das Stadttor; da die Stadt bereits genannt ist, genügt „das Tor“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Nur“ macht idiomatisch deutlich, dass die Verwüstung als einziges Ergebnis zurückgeblieben ist, ohne die Bildsprache auszudeuten.
