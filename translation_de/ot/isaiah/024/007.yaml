  text: אָבַ֥ל תִּיר֖וֹשׁ אֻמְלְלָה גָ֑פֶן נֶאֶנְח֖וּ כָּל שִׂמְחֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/007.yaml
  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: de
  text: Der Most trauert[a], der Weinstock welkt; alle, die frohen Herzens sind, stöhnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der Most welkt.'
    reason: Das hebräische Verb bezeichnet gewöhnlich Trauern oder Klagen, kann im Bildfeld verdorrender Vegetation jedoch auch das Welken beziehungsweise Hinschwinden ausdrücken.
lexical_decisions:
- source_word: אָבַל
  choice: trauert
  rationale: Das Verb bezeichnet gewöhnlich Trauer oder Klage. Die Wiedergabe bewahrt hier die poetische Personifikation des Mostes und die Verbindung zum menschlichen Stöhnen am Versende.
- source_word: תִּירוֹשׁ
  choice: Most
  rationale: Das Wort bezeichnet frischen beziehungsweise neuen Wein. „Most“ ist im Deutschen die natürliche Bezeichnung für den noch jungen Traubensaft und passt zum Bild des Weinstocks.
- source_word: אֻמְלְלָה
  choice: verkümmert
  rationale: Das Verb beschreibt ein Dahinschwinden oder Erschlaffen. „Verkümmert“ gibt den Zustand des Weinstocks natürlich und bildkräftig wieder.
- source_word: גָפֶן
  choice: der Weinstock
  rationale: „Weinstock“ bezeichnet im Deutschen eindeutig die hier gemeinte Weinrebe und ist im poetischen Zusammenhang geläufig.
- source_word: נֶאֶנְחוּ
  choice: stöhnen
  rationale: Die Form bezeichnet einen hörbaren Ausdruck von Kummer oder Bedrängnis. „Stöhnen“ erhält die Stärke des hebräischen Ausdrucks.
- source_word: שִׂמְחֵי לֵב
  choice: alle, die frohen Herzens sind
  rationale: Die Formulierung gibt die wörtliche Wendung „die Frohen des Herzens“ in würdigem, verständlichem Deutsch wieder, ohne die innere Freude auf bloße Ausgelassenheit zu verengen.
