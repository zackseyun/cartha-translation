  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: de
  text: 'Die Erde trauert und verwelkt,

    die Welt verkümmert und verwelkt;

    die Hochgestellten der Erdbevölkerung verkümmern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet hier eine Wendung mit „Höhe“ oder „Erhabenheit“ und „Volk der Erde“. Wegen des Pluralverbs ist wahrscheinlich an hochgestellte Menschen zu denken; möglich ist auch die Wiedergabe: „die Erhabenen der Erde“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אָבְלָה
  choice: trauert
  rationale: Das Verb אבל bezeichnet Trauer oder Klage. In der poetischen Personifikation bewahrt „trauert“ die emotionale Dimension des Gerichts, statt sie auf bloßes Austrocknen zu reduzieren.
- source_word: נָבְלָה
  choice: verwelkt
  rationale: נבל beschreibt Verwelken oder Verblassen. „Verwelkt“ erhält das anschauliche Bild des Niedergangs und wird bei beiden Vorkommen gleich wiedergegeben.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Obwohl אֶרֶץ auch „Land“ bedeuten kann, spricht die Parallele mit תֵּבֵל und der umfassende Zusammenhang von Jesaja 24 für „Erde“.
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: verkümmert / verkümmern
  rationale: Die Wurzel אמל bezeichnet Schwachwerden, Dahinsiechen oder Austrocknen. „Verkümmern“ unterscheidet sie im Deutschen von נבל und passt zum poetischen Bild fortschreitenden Verfalls.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet häufig die bewohnte oder geordnete Welt. „Die Welt“ ist im Deutschen natürlich und bildet eine passende Parallele zu „die Erde“.
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: die Hochgestellten im Volk der Erde
  rationale: מְרוֹם bedeutet wörtlich „Höhe“ oder „Erhabenheit“. Im Zusammenhang und mit dem pluralischen Verb liegt eine Bezeichnung für gesellschaftlich oder politisch hochgestellte Menschen nahe; die Formulierung vermeidet die engere Festlegung auf einen bestimmten Adelsstand.
theological_decisions:
- issue: Reichweite der Gerichtsaussage in הָאָרֶץ / תֵּבֵל
  choice: umfassende, weltweite Reichweite („Erde“ / „Welt“)
  alternative: örtliche Reichweite („Land“)
  rationale: Die Verbindung von הָאָרֶץ mit תֵּבֵל und der universale Horizont des Abschnitts sprechen für eine umfassende Aussage, ohne darüber hinaus eine spätere theologische Systematik einzutragen.
- issue: Deutung von מְרוֹם עַם הָאָרֶץ
  choice: hochgestellte Menschen innerhalb der Erdbevölkerung
  alternative: die abstrakte „Hoheit“ oder „Erhabenheit“ des Volkes der Erde
  rationale: Das pluralische אֻמְלָלוּ unterstützt eine personale Deutung, doch die ungewöhnliche wörtliche Wendung bleibt in der Fußnote sichtbar und wird nicht dogmatisch vereindeutigt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. Die wiederholten Verben bilden den hebräischen Rhythmus nach; „Hochgestellte“ ist allgemeinverständlich und legt keinen bestimmten gesellschaftlichen Stand fest.
