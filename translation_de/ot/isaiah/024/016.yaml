source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: de
  text: 'Vom Rand der Erde[a] hören wir Lieder:


    „Herrlichkeit dem Gerechten!“[b]


    Da sagte ich: „Ich schwinde dahin, ich schwinde dahin![c] Wehe mir!“


    Die Treulosen handeln treulos; mit Treulosigkeit handeln die Treulosen treulos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Vom Flügel der Erde“ oder „Von den Enden der Erde“.
    reason: lexical_alternative
  - marker: b
    text: Auch „Pracht/Ehre den Gerechten“, wenn die Form kollektiv verstanden wird und nicht als Bezeichnung eines einzelnen Gerechten.
    reason: alternative_reading
  - marker: c
    text: 'Der hebräische Ausdruck רָזִי לִי ist schwierig. Traditionell wird er als Klage über Auszehrung oder Dahinschwinden verstanden; möglich ist auch: „Mein Geheimnis gehört mir“ oder „Ein Geheimnis ist es mir“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: Vom Rand der Erde
  rationale: כָּנָף bedeutet wörtlich „Flügel“, bezeichnet in geografischer Verwendung aber einen äußersten Rand. „Rand der Erde“ bewahrt das Bild und die singularische Form, ohne auf die geläufigere Mehrzahl „Enden der Erde“ auszuweiten.
- source_word: זְמִרֹת
  choice: Lieder
  rationale: Das Wort bezeichnet Gesang oder Musik. „Lieder“ bleibt direkt und fügt den im Kontext möglichen Lobcharakter nicht ausdrücklich hinzu.
- source_word: שָׁמַעְנוּ
  choice: hören wir
  rationale: Das hebräische Perfekt kann in der lebendigen prophetischen Darstellung als gegenwärtiges Wahrnehmen wiedergegeben werden. „Hören wir“ vermittelt die Unmittelbarkeit der Szene.
- source_word: צְבִי לַצַּדִּיק
  choice: Herrlichkeit dem Gerechten
  rationale: צְבִי kann „Pracht“, „Zierde“, „Herrlichkeit“ oder „Ehre“ bedeuten. „Herrlichkeit“ gibt hier den preisenden Ausruf wieder; „dem Gerechten“ wahrt die grammatische Einzahl, ohne den nicht genannten Bezug näher zu bestimmen.
- source_word: וָאֹמַר
  choice: Doch ich sage
  rationale: „Doch“ macht den scharfen inhaltlichen Umschlag von den Liedern zur Klage deutlich. Das Präsens entspricht der lebendigen Darstellung, auch wenn formal „und ich sagte“ möglich ist.
- source_word: רָזִי לִי רָזִי לִי
  choice: Ich schwinde dahin, ich schwinde dahin
  rationale: Die schwierige Wendung wird traditionell von רזה, „mager/dünn werden“, her verstanden. „Ich schwinde dahin“ gibt die Klage natürlich wieder und lässt den körperlichen wie existenziellen Verfall anklingen; die abweichende Deutung wird in einer Fußnote bewahrt.
- source_word: אוֹי לִי
  choice: Wehe mir!
  rationale: Dies ist die direkte und im Deutschen geläufige Wiedergabe des Klagerufs.
- source_word: בֹּגְדִים בָּגָדוּ
  choice: Die Treulosen handeln treulos
  rationale: Die Wiederholung desselben hebräischen Wortstamms wird durch „Treulosen/treulos“ hörbar gemacht. Das Präsens passt zur verdichteten prophetischen Aussage.
- source_word: וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: mit Treulosigkeit handeln die Treulosen treulos
  rationale: Die absichtlich schwere Häufung von Formen der Wurzel בגד wird mit der deutschen Wortfamilie „Treulosigkeit/Treulosen/treulos“ möglichst weitgehend bewahrt.
theological_decisions:
- issue: Bezug von לַצַּדִּיק
  choice: dem Gerechten
  alternative: den Gerechten beziehungsweise dem Kreis der Gerechten
  rationale: Die hebräische Form ist bestimmt und singularisch, benennt den Gemeinten aber nicht näher. Die Übersetzung wahrt die Einzahl und vermeidet eine weitergehende messianische oder kollektive Festlegung; die kollektive Möglichkeit steht in der Fußnote.
- issue: Deutung von רָזִי לִי
  choice: Ich schwinde dahin
  alternative: Mein Geheimnis bleibt bei mir beziehungsweise Ein Geheimnis ist es mir
  rationale: Im Zusammenhang mit dem Weheruf und dem beklagten Treubruch ist die traditionelle Herleitung von „mager werden, dahinschwinden“ plausibel. Da der hebräische Ausdruck textlich und lexikalisch schwierig ist, wird die andere Deutung ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Form, der abrupte Wechsel vom weltweiten Lied zur Ich-Klage und die auffällige Wortwiederholung im Schlussglied bleiben erhalten. Die Wiederholung „Treulosigkeit/Treulosen/treulos“ ist bewusst markiert und bildet die rhetorische Häufung des Hebräischen nach.
