  yaml_path: translation/ot/isaiah/024/009.yaml
  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: de
  text: Bei Gesang trinken sie keinen Wein[a]; berauschendes Getränk schmeckt seinen Trinkern bitter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bei Gesang werden sie keinen Wein trinken.“ Das hebräische Imperfekt kann hier auch zukünftig verstanden werden; בַּשִּׁיר kann außerdem mit „mit Gesang“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: beim Singen
  rationale: Die Präposition ב mit שִׁיר bezeichnet hier am natürlichsten den begleitenden Umstand oder die Art und Weise. „Beim Singen“ gibt idiomatisch wieder, dass das Weintrinken nicht mehr von festlichem Gesang begleitet wird.
- source_word: לֹא יִשְׁתּוּ
  choice: sie trinken … keinen … mehr
  rationale: Das hebräische Imperfekt kann in der prophetischen Schilderung gegenwärtig oder zukünftig verstanden werden. Das Präsens bewahrt die lebendige Darstellung; „mehr“ macht im Deutschen den durch den Zusammenhang bezeichneten Verlust früherer Festfreude natürlich deutlich.
- source_word: יַיִן
  choice: Wein
  rationale: Die übliche und genaue deutsche Entsprechung.
- source_word: יֵמַר
  choice: schmeckt … bitter
  rationale: Die Form von מרר bedeutet „bitter sein/werden“. In Verbindung mit einem Getränk gibt „schmeckt bitter“ den prädikativen Sinn natürlich wieder, ohne festzulegen, ob eine Zustandsveränderung gemeint ist.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: שֵׁכָר bezeichnet ein berauschendes Getränk, das von gewöhnlichem Wein unterschieden wird. „Berauschendes Getränk“ erhält diese Unterscheidung und ist im modernen Standarddeutsch klarer als „starkes Getränk“.
- source_word: לְשֹׁתָיו
  choice: denen …, die es trinken
  rationale: Die Form bezeichnet diejenigen, die das Getränk trinken. Die Umschreibung ist natürliches Deutsch und macht den pronominalen Bezug ausdrücklich.
