source:
  edition: WLC
  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: de
  text: Auf den Straßen ertönt Klagegeschrei um den Wein; alle Freude ist dunkel geworden[a], der Jubel der Erde ist gewichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Freude ist zum Abend geworden.“ So wird das hebräische Bild bewahrt, nach dem die Freude wie beim Einbruch der Nacht dunkel wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Der Jubel des Landes ist gewichen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: צְוָחָה
  choice: Klagegeschrei
  rationale: Das Substantiv bezeichnet einen lauten Schrei der Not oder Klage. „Klagegeschrei“ bewahrt sowohl die hörbare Intensität als auch den leidvollen Charakter.
- source_word: עַל
  choice: um
  rationale: Die Präposition bezeichnet hier wahrscheinlich den Gegenstand oder Anlass der Klage. „Um den Wein“ bleibt offener als eine ausdrücklich kausale Wiedergabe wie „wegen des fehlenden Weins“.
- source_word: הַיַּיִן
  choice: den Wein
  rationale: Der bestimmte Artikel wird beibehalten; der Wein steht im Zusammenhang für die nun verlorene festliche Fülle.
- source_word: בַּחוּצוֹת
  choice: auf den Straßen
  rationale: Das Wort bezeichnet öffentliche Außenräume einer Stadt, darunter Straßen und Plätze. „Auf den Straßen“ ist im Deutschen natürlich und stellt den öffentlichen Charakter der Klage heraus.
- source_word: עָרְבָה
  choice: ist dunkel geworden
  rationale: Die Verbform kann „Abend werden“ oder „dunkel werden“ bedeuten. Auf die Freude bezogen entsteht ein bewusst ungewöhnliches Bild, das hier nicht zu „verschwunden“ eingeebnet wird.
- source_word: כָּל שִׂמְחָה
  choice: alle Freude
  rationale: Die Wendung umfasst jede Freude insgesamt und lässt sich knapp und natürlich mit „alle Freude“ wiedergeben.
- source_word: גָּלָה
  choice: ist gewichen
  rationale: Das Verb kann entfernen, fortgehen oder ins Exil gehen bezeichnen. Bei „Jubel“ als Subjekt gibt „ist gewichen“ das Fortgehen bildhaft wieder, ohne die Exilsbedeutung übermäßig zu konkretisieren.
- source_word: מְשׂוֹשׂ
  choice: der Jubel
  rationale: Das Substantiv bezeichnet freudiges Frohlocken oder festliche Freude. „Jubel“ unterscheidet es im Deutschen leicht von שִׂמְחָה („Freude“).
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: Im weiträumigen Gerichtshorizont von Jesaja 24 liegt die universale Bedeutung „Erde“ näher als die räumlich begrenztere Wiedergabe „Land“.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Die umfassende Gerichtssprache des Kapitels spricht für den universalen Horizont. „Erde“ wahrt diesen Kontext, ohne die Aussage auf ein bestimmtes Gebiet einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige hebräische Metapher vom Dunkelwerden der Freude bleibt erhalten; „Klagegeschrei“ und „Jubel“ geben die Intensität des poetischen Gerichtsworts wieder.
