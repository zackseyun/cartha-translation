  source_fidelity: 'Die Übersetzung gibt die drei poetischen Aussagen des Hebräischen sachgerecht wieder: den öffentlichen Notruf bzw. die Klage über den Wein, das bildhafte Dunkelwerden aller Freude und das Weichen des Jubels der Erde. „Um den Wein“ wahrt die im Präpositionsausdruck liegende Offenheit hinsichtlich Gegenstand und Anlass der Klage. „Erde“ ist im Kontext von Jesaja 24 gut begründet.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Klagegeschrei“ und „ist dunkel geworden“ sind poetisch markiert, aber im Gerichtslied angemessen und verständlich. Die Satzfügung mit Semikolon und Komma bildet den gedrängten Parallelismus natürlich ab.
  terminology: „Freude“ für שִׂמְחָה und „Jubel“ für מְשׂוֹשׂ erhalten die Nuancierung der beiden nah verwandten Begriffe. Die Fußnoten bieten die relevanten Alternativen („zum Abend geworden“; „Land“) und ihre Anker stehen jeweils bei der betreffenden Aussage.
