base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/010.yaml
  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
translation:
  language: de
  text: Zerstört ist die Stadt des Chaos[a]; jedes Haus ist verschlossen, sodass niemand hineinkommen kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stadt der Leere“, „die Stadt der Öde“ oder „die Stadt der Verwüstung“. Das hebräische Wort תֹּהוּ kann Chaos, Leere, Öde oder Verwüstung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Jedes Haus ist gegen das Eintreten verschlossen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: zerbrochen liegt
  rationale: Das Nifal-Perfekt bezeichnet einen passiven, resultativen Zustand. „Zerbrochen liegt“ gibt sowohl die Zerstörung als auch deren fortdauerndes Ergebnis im städtischen Bild natürlich wieder.
- source_word: קִרְיַת
  choice: Stadt des
  rationale: Die Constructus-Form von קִרְיָה wird im Deutschen idiomatisch mit „Stadt des“ wiedergegeben und wahrt den gehobenen prophetischen Ton.
- source_word: תֹּהוּ
  choice: Chaos
  rationale: תֹּהוּ kann Chaos, Leere oder Öde bezeichnen. „Chaos“ bewahrt hier die abstrakte, bildhafte Kraft, ohne die mögliche Bedeutung abschließend festzulegen; Alternativen werden in der Fußnote genannt.
- source_word: סֻגַּר
  choice: ist verschlossen
  rationale: Die passive Form von סגר bezeichnet das Verschließen beziehungsweise Abriegeln. „Ist verschlossen“ ist in Verbindung mit einem Haus natürlich und lässt den resultativen Aspekt erkennen.
- source_word: כָּל בַּיִת
  choice: jedes Haus
  rationale: כָּל mit einem Substantiv im Singular hat distributiven Sinn. „Jedes Haus“ bildet dies präzise ab und richtet den Blick auf die Gebäude und ihre versperrten Zugänge.
- source_word: מִבּוֹא
  choice: sodass niemand hineinkommen kann
  rationale: Wörtlich steht „vom Hineinkommen“. Die deutsche Formulierung macht die daraus folgende Verhinderung des Zutritts verständlich, ohne einen im Hebräischen nicht genannten Handelnden festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Die vorangestellte resultative Wendung „Zerbrochen liegt“ erhält den Nachdruck des hebräischen Satzanfangs; die Mehrdeutigkeit von תֹּהוּ wird im Haupttext nicht aufgelöst, sondern durch eine Fußnote offengehalten.
