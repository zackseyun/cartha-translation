  naturalness: Der Satz ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. Die elliptische Reihung nach „Und es wird dem Volk ergehen wie dem Priester“ bewahrt den prägnanten, parallel aufgebauten Charakter des Verses. „Verleiher/Entleiher“ ist klar und vermeidet die Richtungsmehrdeutigkeit von „leihen“.
  terminology: Die sozialen Bezeichnungen „Herr“, „Herrin“, „Sklave“ und „Sklavin“ sind kontextgerecht. Käufer/Verkäufer sowie Gläubiger und verschuldete Person geben die wirtschaftlichen Rollen präzise wieder, ohne zusätzliche Deutung einzutragen.
