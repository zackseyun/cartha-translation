base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the servant, so with his master; as with the female servant, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: de
  text: Und es wird dem Volk ergehen wie dem Priester, dem Sklaven wie seinem Herrn, der Sklavin wie ihrer Herrin, dem Käufer wie dem Verkäufer, dem Verleiher wie dem Entleiher, dem Gläubiger wie dem, der bei ihm verschuldet ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „dem Gläubiger wie dem, der ihm gegenüber eine Schuld trägt“.'
    reason: Die hebräische Wendung כַּאֲשֶׁר נֹשֶׁא בוֹ ist syntaktisch und lexikalisch ungewöhnlich; die Fußnote bewahrt ihre wörtlichere Gestalt neben der verständlichen Wiedergabe im Haupttext.
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird … ergehen
  rationale: Die Zukunftsformel leitet den kommenden Zustand ein; mit „ergehen“ lässt sich die wiederholte Vergleichsstruktur im Deutschen natürlich und würdig ausdrücken.
- source_word: כָעָם כַּכֹּהֵן
  choice: dem Volk … wie dem Priester
  rationale: כ bezeichnet den Vergleich. „Volk“ ist kollektiv gebraucht; beide Gruppen trifft dasselbe Geschick.
- source_word: כַעֶבֶד כַּאדֹנָיו
  choice: dem Sklaven wie seinem Herrn
  rationale: עֶבֶד bezeichnet in diesem Katalog gesellschaftlicher Rangverhältnisse einen unfreien Menschen; „Sklave“ erhält diese soziale Schärfe. אָדוֹן ist hier der menschliche Herr.
- source_word: כַשִּׁפְחָה כַּגְּבִרְתָּהּ
  choice: der Sklavin wie ihrer Herrin
  rationale: שִׁפְחָה bezeichnet ausdrücklich eine weibliche unfreie Person; גְּבִירָה ist ihre weibliche Haushaltsvorgesetzte.
- source_word: כַקּוֹנֶה כַּמּוֹכֵר
  choice: dem Käufer wie dem Verkäufer
  rationale: Die substantivisch gebrauchten Partizipien benennen die beiden gegensätzlichen Rollen eines Kaufgeschäfts.
- source_word: כַמַּלְוֶה כַּלֹּוֶה
  choice: dem Verleiher wie dem Entleiher
  rationale: Die Formen unterscheiden denjenigen, der etwas leiht, von demjenigen, der es ausleiht beziehungsweise entgegennimmt. „Verleiher/Entleiher“ hält den Gegensatz im Deutschen eindeutig fest.
- source_word: כַנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: dem Gläubiger wie dem, der bei ihm verschuldet ist
  rationale: נֹשֶׁה bezeichnet den Gläubiger, der eine Forderung hat. Die zweite Wendung ist ungewöhnlich und wird sachlich als dessen Schuldner verstanden, ohne die zugrunde liegende Bildsprache ganz zu verdecken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sechs parallelen Gegensatzpaare werden in einem rhythmischen Satz bewahrt. „Sklave/Sklavin“ macht den unfreien sozialen Status unverharmlost sichtbar; „Verleiher/Entleiher“ vermeidet die im Deutschen mögliche Richtungsmehrdeutigkeit von „leihen“.
