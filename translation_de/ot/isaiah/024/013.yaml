  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: de
  text: 'Denn so wird es mitten auf der Erde[a], unter den Völkern, sein: wie beim Abschlagen der Oliven[b], wie bei der Nachlese, wenn die Weinlese zu Ende ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mitten im Land«. Das hebräische Wort kann sowohl die Erde als auch ein bestimmtes Land bezeichnen; der Zusammenhang mit den Völkern spricht hier eher für »Erde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »wie beim Schütteln eines Olivenbaums«. Gemeint ist das Schlagen oder Schütteln des Baumes, nach dem nur wenige Oliven übrig bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: Denn so wird es … sein
  rationale: כִּי leitet hier eine Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein; כֹה bezeichnet die Art und Weise, und יִהְיֶה ist als schlichtes Futur wiedergegeben.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: mitten auf der Erde
  rationale: קֶרֶב bezeichnet die Mitte oder das Innere. הָאָרֶץ kann »Erde« oder »Land« bedeuten; zusammen mit »unter den Völkern« liegt hier der weltweite Bezug nahe, ohne dass die engere Bedeutung ausgeschlossen wird.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: unter den Völkern
  rationale: עַמִּים bezeichnet Völker beziehungsweise Volksgruppen. »Unter den Völkern« ist im Deutschen natürlich und vermeidet die moderne politische Engführung von »Nationen«.
- source_word: כְּנֹקֶף זַיִת
  choice: wie beim Abschlagen eines Olivenbaums
  rationale: נֹקֶף bezeichnet hier das Schlagen gegen den Baum oder seine Zweige, durch das die verbliebenen Oliven gelöst werden. »Abschlagen« bildet dieses Erntebild knapper und genauer ab als das allgemeinere »Schütteln«.
- source_word: כְּעוֹלֵלֹת
  choice: wie bei der Nachlese
  rationale: עוֹלֵלֹת sind die nach der Haupternte verbliebenen Früchte beziehungsweise deren Einsammeln. »Nachlese« ist der verständliche deutsche Fachausdruck und bewahrt das Bild der wenigen Reste.
- source_word: אִם כָּלָה בָצִיר
  choice: wenn die Weinlese zu Ende ist
  rationale: אִם ist hier im zeitlichen Sinn von »wenn« zu verstehen. בָצִיר bezeichnet speziell die Trauben- oder Weinlese.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden landwirtschaftlichen Vergleichsbilder bleiben knapp und anschaulich; die mögliche Bedeutung »Land« sowie die Variante »Schütteln« werden in Fußnoten offengehalten.
