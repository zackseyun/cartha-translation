revisions:
- from: 'Und es wird geschehen: Wer vor dem Schreckenslärm flieht, fällt in die Grube; und wer aus der Grube heraufsteigt, verfängt sich in der Falle. Denn die Fenster aus der Höhe[a] sind geöffnet, und die Grundfesten der Erde erbeben.'
  to: 'Und es wird geschehen: Wer vor dem Schreckenslärm flieht, wird in die Grube fallen; und wer aus der Grube heraufsteigt, wird in die Falle geraten. Denn die Fenster in der Höhe[a] sind geöffnet, und die Grundfesten der Erde erbeben.'
  rationale: Die Revision stellt die Zukunftsfolge der hebräischen Verbformen wieder her und ersetzt die reflexive Formulierung durch eine idiomatische Wiedergabe des Passivs. Die Ortsangabe bei den geöffneten Fenstern wird im Haupttext sprachlich geglättet, ohne „Himmel“ als ausdrücklichen Bestandteil des hebräischen Wortlauts einzutragen.
