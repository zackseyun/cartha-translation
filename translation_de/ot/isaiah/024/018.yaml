    rationale: Die Formulierung ist verständlich, aber im Deutschen weniger idiomatisch. „Fenster in der Höhe“ erhält die wörtlich-bildhafte Ausdrucksweise und vermeidet die explizite Ergänzung „Himmel“ im Haupttext.
  revised_text: 'Und es wird geschehen: Wer vor dem Schreckenslärm flieht, wird in die Grube fallen; und wer aus der Grube heraufsteigt, wird in die Falle geraten. Denn die Fenster in der Höhe[a] sind geöffnet, und die Grundfesten der Erde erbeben.'
