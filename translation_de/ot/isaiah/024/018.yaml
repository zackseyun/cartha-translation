  - severity: medium
    issue: Reflexive Wiedergabe von יִלָּכֵד
    rationale: „verfängt sich“ legt ein Sich-Verfangen nahe, während das hebräische Nifal passiv ausdrückt, dass die Person von der Falle gefangen wird. „wird in die Falle geraten“ wahrt das Ergebnis ohne eine zusätzliche Handelndenperspektive.
  - severity: low
