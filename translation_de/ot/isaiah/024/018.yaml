source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: de
  text: 'Und es wird geschehen: Wer vor dem Schreckenslärm flieht, wird in die Grube fallen; und wer aus der Grube heraufsteigt, wird in die Falle geraten. Denn die Fenster in der Höhe[a] sind geöffnet, und die Grundfesten der Erde erbeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schleusen des Himmels“. Wörtlicher: „die Fenster in der Höhe“.'
    reason: Lexikalische Alternative; die traditionelle Deutung wird genannt, während der Haupttext die hebräische Bildsprache bewahrt.
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die geläufige prophetische Einleitungsformel wird würdig und transparent wiedergegeben.
- source_word: הַנָּס מִקּוֹל הַפַּחַד
  choice: Wer vor dem Schreckenslärm flieht
  rationale: Das substantivierte Partizip wird im Deutschen idiomatisch mit einem generischen Relativsatz wiedergegeben. „Schreckenslärm“ verbindet den hörbaren Aspekt von קוֹל mit dem Entsetzen von פַּחַד.
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: fällt in die Grube
  rationale: „Grube“ gibt die konkrete Fallgrube knapp wieder und bleibt von der folgenden „Falle“ unterscheidbar.
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: und wer aus der Grube heraufsteigt
  rationale: Die räumliche Bewegung von עלה und מִתּוֹךְ bleibt ausdrücklich erhalten; die deutsche Formulierung ist natürlich.
- source_word: יִלָּכֵד בַּפָּח
  choice: verfängt sich in der Falle
  rationale: Die Wendung bewahrt das konkrete Fangbild und unterscheidet פַּח von פַּחַת, soweit das deutsche Wortspiel dies zulässt.
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: die Fenster aus der Höhe
  rationale: Die wörtliche Bildsprache bleibt erhalten, ohne „Himmel“ ausdrücklich einzufügen; die geläufigere Deutung als Himmelsschleusen steht in der Fußnote.
- source_word: נִפְתָּחוּ
  choice: sind geöffnet
  rationale: Das passive Perfekt wird als gegenwärtiger, eingetretener Zustand wiedergegeben und passt zum lebhaften prophetischen Bild.
- source_word: וַיִּרְעֲשׁוּ מוֹסְדֵי אָרֶץ
  choice: und die Grundfesten der Erde erbeben
  rationale: „Erbeben“ vermittelt die heftige Bewegung; „Grundfesten“ wahrt das Bild der tragenden Fundamente. „Erde“ entspricht dem kosmischen Zusammenhang des Kapitels.
theological_decisions:
- issue: Reichweite von אָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der Zusammenhang von Jesaja 24 zeichnet ein umfassendes, kosmisches Gericht. „Erde“ entspricht diesem Kontext, ohne eine zusätzliche dogmatische Festlegung einzutragen.
- issue: Deutung von אֲרֻבּוֹת מִמָּרוֹם
  choice: die Fenster aus der Höhe
  alternative: die Schleusen des Himmels
  rationale: Die Hauptübersetzung bewahrt die ungewöhnliche, wörtliche Bildsprache und vermeidet es, „Himmel“ in den Text einzutragen. Die traditionelle und sachlich mögliche Deutung wird als Alternative ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Folge „Schreckenslärm – Grube – Falle“ bewahrt die rasche, unausweichliche Steigerung des hebräischen Verses; das hebräische Lautspiel zwischen פַּחַד, פַּחַת und פַּח lässt sich im Deutschen nicht vollständig nachbilden.
