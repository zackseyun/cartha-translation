  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: de
  text: Die Erde wird taumeln wie ein Betrunkener und hin und her schwanken wie eine Hütte[a]. Ihre Auflehnung lastet schwer auf ihr; sie wird fallen und nicht wieder aufstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Wächterhütte“ beziehungsweise „wie eine vorübergehende Unterkunft“; das hebräische Wort bezeichnet eine einfache, nur zeitweilig genutzte Behausung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: wird taumeln
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt die Aussage. Im Deutschen vermittelt „wird taumeln“ zusammen mit dem Vergleich des Betrunkenen die nachdrückliche, unkontrollierte Bewegung natürlich, ohne eine unbeholfene Wortwiederholung.
- source_word: אֶ֨רֶץ֙
  choice: die Erde
  rationale: Der umfassende Gerichtszusammenhang in Jesaja 24 spricht eher für die Erde als Ganze als nur für ein bestimmtes Land.
- source_word: כַּשִּׁכּ֔וֹר
  choice: wie ein Betrunkener
  rationale: Das substantivisch gebrauchte Wort bezeichnet einen betrunkenen Menschen; „ein Betrunkener“ ist präzise und idiomatisch.
- source_word: וְהִֽתְנוֹדְדָ֖ה
  choice: und hin und her schwanken
  rationale: Die Verbform bezeichnet eine wiederholte, unsichere Bewegung und wird durch „hin und her schwanken“ anschaulich wiedergegeben.
- source_word: כַּמְּלוּנָ֑ה
  choice: wie eine Feldhütte
  rationale: מְלוּנָה bezeichnet eine einfache, vorübergehende Unterkunft, häufig auf einem Feld. „Feldhütte“ bewahrt das Bild einer leichten, instabilen Behausung; weitere mögliche Präzisierungen stehen in der Fußnote.
- source_word: וְכָבַ֤ד עָלֶ֨יהָ֙
  choice: lastet schwer auf ihr
  rationale: Die Formulierung erhält das hebräische Bild einer bedrückenden Last und klingt zugleich natürlich auf Deutsch.
- source_word: פִּשְׁעָ֔הּ
  choice: ihre Auflehnung
  rationale: פשע bezeichnet nicht nur allgemein eine Verfehlung, sondern oft einen bewussten Bruch oder eine Rebellion. „Auflehnung“ bewahrt diese Schärfe, ohne einen bestimmten theologischen Deutungsrahmen hinzuzufügen.
- source_word: וְנָפְלָ֖ה
  choice: sie wird fallen
  rationale: Im prophetischen Zusammenhang wird die vollendete Form als gewiss angekündigtes zukünftiges Geschehen wiedergegeben.
- source_word: וְלֹא תֹסִ֥יף קוּם
  choice: und nicht wieder aufstehen
  rationale: Die Verbindung von יסף mit dem Infinitiv bedeutet hier, dass sich das Aufstehen nicht wiederholen wird. „Nicht wieder aufstehen“ gibt die Wendung klar und idiomatisch wieder.
theological_decisions:
- issue: Reichweite von אֶרֶץ im Gerichtswort
  choice: die Erde
  alternative: das Land
  rationale: Jesaja 24 beschreibt das Gericht in umfassenden, kosmischen Begriffen. „Die Erde“ entspricht diesem Kontext, während „das Land“ den Bezug unnötig regional begrenzen könnte.
- issue: Bedeutungsnuance von פֶּשַׁע
  choice: Auflehnung
  alternative: Übertretung
  rationale: „Auflehnung“ hält den rebellischen Charakter des hebräischen Begriffs fest. „Übertretung“ wäre ebenfalls möglich, könnte aber stärker wie die Verletzung einer einzelnen Vorschrift wirken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bewegungsbilder werden anschaulich und ohne unnötige Archaismen wiedergegeben; das Semikolon markiert den Übergang vom Bild der instabilen Erde zu Ursache und endgültigem Fall.
