  variant: modern standard German
source:
  edition: WLC
  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: de
  text: Verstummt ist die Freude der Tamburine; der Lärm der Jubelnden ist verklungen; verstummt ist die Freude der Leier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: verstummt ist
  rationale: Das Qal Perfekt bezeichnet das Aufhören. Bei Musikinstrumenten gibt „verstummt ist“ den resultativen Sinn natürlich und bildkräftig wieder; die Wiederholung bewahrt die Rahmung des hebräischen Verses.
- source_word: מְשׂוֹשׂ
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude beziehungsweise festlichen Jubel. „Freude“ ist im modernen Deutsch klar und lässt sich in beiden parallelen Verbindungen natürlich verwenden.
- source_word: תֻּפִּים
  choice: Tamburine
  rationale: תֹּף bezeichnet ein handgehaltenes Schlaginstrument, wahrscheinlich eine Rahmentrommel. „Tamburin“ ist die geläufige und verständliche deutsche Bibelbezeichnung.
- source_word: חָדַל
  choice: ist verklungen
  rationale: חָדַל bedeutet aufhören. Mit dem akustischen Subjekt „Lärm“ formuliert „ist verklungen“ idiomatisch das Ende des hörbaren Treibens und variiert entsprechend dem hebräischen Verbwechsel.
- source_word: שְׁאוֹן
  choice: Lärm
  rationale: Das Wort bezeichnet Lärm, Getöse oder lautes Treiben. „Lärm“ ist verständlich, ohne den Ausdruck unnötig als chaotischen Aufruhr zu deuten.
- source_word: עַלִּיזִים
  choice: der Jubelnden
  rationale: Die substantivierte Form bezeichnet ausgelassen frohe oder jubelnde Menschen. „Jubelnde“ wahrt den festlichen Sinn, ohne wie „Zechende“ Trunkenheit einzutragen.
- source_word: כִּנּוֹר
  choice: Leier
  rationale: כִּנּוֹר bezeichnet sehr wahrscheinlich eine Leier. „Leier“ ist organologisch genauer als das traditionelle „Harfe“ und im Deutschen verständlich.
theological_decisions: []
