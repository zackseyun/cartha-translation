lexical_decisions:
- source_word: פַּחַד
  choice: Schrecken
  rationale: Das Substantiv bezeichnet Furcht oder Grauen. „Schrecken“ passt in der Gerichtsformel neben den beiden konkreten Fangmitteln und kann sowohl das Entsetzen als auch das drohende Unheil bezeichnen.
- source_word: פַחַת
  choice: Grube
  rationale: Gemeint ist eine als Falle dienende Grube. „Grube“ ist knapp und anschaulich; die Fangfunktion ergibt sich aus der Verbindung mit der Schlinge.
- source_word: פָח
  choice: Schlinge
  rationale: Das Wort bezeichnet eine Fangschlinge oder Falle. „Schlinge“ unterscheidet dieses Fangmittel klar von der vorausgehenden Grube.
- source_word: עָלֶיךָ
  choice: über dich
  rationale: Die Präposition mit Suffix bedeutet wörtlich „über/auf dir“. Die verblos formulierte deutsche Unheilsankündigung bewahrt die unmittelbare, zugespitzte Wirkung des Hebräischen, ohne ausdrücklich eine Gegenwarts- oder Zukunftsform festzulegen.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: Bewohner der Erde
  rationale: Das substantivierte Partizip im Singular wird als Anrede wiedergegeben. „Erde“ entspricht im Zusammenhang von Jesaja 24 dem umfassenden Horizont, während die lexikalisch mögliche Bedeutung „Land“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der weitere Zusammenhang beschreibt ein umfassendes Gericht. „Erde“ gibt diesen Horizont wieder, ohne die ebenfalls mögliche lokale Bedeutung des hebräischen Wortes zu verschweigen.
- issue: Zeitbezug des verblosen Satzes
  choice: Nominale Unheilsankündigung ohne ausdrückliche Zeitform
  alternative: „kommen über dich“ oder „sind über dir“
  rationale: Das Hebräische enthält hier kein ausgedrücktes Verb. Die knappe deutsche Form bewahrt die Offenheit zwischen unmittelbar gegenwärtiger Bedrohung und angekündigtem Eintreffen.
translation_notes:
  register: Knappe, feierliche Unheilsankündigung in modernem Standarddeutsch. Die dreigliedrige Reihung und die singularische Anrede bleiben erhalten; auf ein ergänztes Verb wird bewusst verzichtet.
