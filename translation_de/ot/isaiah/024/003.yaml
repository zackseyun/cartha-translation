id: ISA.24.3
reference: Isaiah 24:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: de
  text: Die Erde wird restlos entleert und völlig ausgeplündert werden[a], denn Jahwe hat dieses Wort gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Land wird restlos entleert und völlig ausgeplündert werden.“ Das hebräische אֶרֶץ kann „Land“ oder „Erde“ bedeuten; der weitere Zusammenhang spricht hier eher für „Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: wird restlos entleert werden
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt die Aussage. Das passive „entleert werden“ gibt den Nifal wieder; „restlos“ bewahrt die emphatische Kraft in natürlichem Deutsch.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der umfassende Horizont von Jesaja 24 spricht hier eher für „Erde“, ohne die lexikalische Alternative auszuschließen.
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: und völlig ausgeplündert werden
  rationale: Auch hier verstärkt ein absoluter Infinitiv das finite Verb. „Ausplündern“ trifft die Bedeutung von בזז und erhält zusammen mit „völlig“ Nachdruck und Passivform.
- source_word: כִּי
  choice: denn
  rationale: כִּי nennt hier den Grund für die angekündigte Verwüstung. „Denn“ ist knapp und entspricht dem würdevollen prophetischen Stil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen deutschen Text als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: דִּבֶּר
  choice: hat … gesprochen
  rationale: Das Perfekt stellt den göttlichen Ausspruch als erfolgt und gewiss dar. „Hat gesprochen“ bewahrt den feierlichen Klang der prophetischen Formel.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. In dieser prophetischen Begründungsformel bezeichnet „Wort“ passend den ausgesprochenen göttlichen Beschluss.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den Eigennamen Gottes. „Jahwe“ macht diesen im Haupttext sichtbar, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Reichweite von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der weitere Zusammenhang des Kapitels zeichnet ein umfassendes Gerichtsszenario und begünstigt daher die globale Lesart „Erde“. Da אֶרֶץ ebenso „Land“ heißen kann, bleibt diese Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte hebräische Verstärkung wird durch die abgestuften Adverbien „restlos“ und „völlig“ wiedergegeben, ohne im Deutschen eine schwerfällige Wiederholungsformel zu erzeugen.
