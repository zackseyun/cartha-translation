  yaml_path: translation/ot/isaiah/024/019.yaml
  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
translation:
  language: de
  text: Die Erde ist völlig zertrümmert[a]; die Erde bricht vollständig auseinander; die Erde schwankt heftig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Land ist völlig zertrümmert; das Land bricht vollständig auseinander; das Land schwankt heftig.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: ist völlig zertrümmert
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die finite Verbform. »Völlig zertrümmert« gibt sowohl die Intensivierung als auch die zerstörerische Bedeutung der Wurzel רעע in natürlichem Deutsch wieder.
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Der umfassende Gerichtskontext in Jesaja 24 spricht hier eher für »Erde«. Die dreimalige Wiederholung wird als prägendes rhythmisches Stilmittel bewahrt.
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: bricht vollständig auseinander
  rationale: Auch hier verstärkt ein Infinitivus absolutus das folgende Verb. Die Form bezeichnet ein Zerbrechen, Zerfallen oder Auseinanderbrechen; die gewählte Wiedergabe bleibt von der ersten Aussage unterscheidbar und klingt im Deutschen natürlich.
- source_word: מוֹט הִתְמוֹטְטָה
  choice: schwankt heftig
  rationale: Die Wurzel מוט bezeichnet Schwanken, Wanken oder Gleiten. »Schwankt heftig« bewahrt die konkrete Bewegungsbedeutung und bringt zugleich die durch den Infinitivus absolutus ausgedrückte Intensität zur Geltung.
theological_decisions:
- issue: Räumlicher Umfang von אֶרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der kosmisch und umfassend angelegte Gerichtszusammenhang legt die globale Bedeutung nahe; da die hebräische Bezeichnung jedoch auch »Land« heißen kann, bleibt diese echte lexikalische Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Wiederholung von »die Erde« und die gesteigerte Ausdrucksweise des Hebräischen bleiben erhalten; die drei Verben werden semantisch voneinander abgesetzt.
