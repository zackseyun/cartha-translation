  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: de
  text: Und an jenem Tag wird der HERR das Heer der Höhe in der Höhe[a] zur Rechenschaft ziehen und die Könige der Erde auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Heer des Himmels im Himmel.'
    reason: מָרוֹם kann „Höhe“, „oben“ oder den himmlischen Bereich bezeichnen. Die Alternative gibt beide Vorkommen als „Himmel“ wieder, während der Haupttext die Mehrdeutigkeit bewahrt.
lexical_decisions:
- source_word: יִפְקֹד (yifqod)
  choice: wird … zur Rechenschaft ziehen
  rationale: Das Verb פקד kann je nach Zusammenhang aufsuchen, mustern oder strafend heimsuchen bedeuten. Im Gerichtskontext bringt „zur Rechenschaft ziehen“ die strafende Bedeutung natürlich zum Ausdruck, ohne die Art der Strafe näher festzulegen.
- source_word: צְבָא הַמָּרוֹם (tseva hamarom)
  choice: die Heerschar der Höhe
  rationale: „Heerschar“ gibt צבא als geordnete Schar wieder; „der Höhe“ bewahrt die ungewöhnliche und möglicherweise bewusst mehrdeutige Ortsbezeichnung מרום, statt sie ausdrücklich als „Himmel“ oder als bestimmte geistliche Wesen auszulegen.
- source_word: מַלְכֵי הָאֲדָמָה (malkei ha’adamah)
  choice: die Könige der Erde
  rationale: Die geläufige Wendung erhält den Kontrast zwischen der überirdischen Höhe und der Erde sowie die Wiederholung von „Erde“ im folgenden Satzglied.
theological_decisions:
- issue: Identität der „Heerschar der Höhe“
  choice: Die mehrdeutige Formulierung bleibt im Haupttext erhalten.
  alternative: „das Heer des Himmels“ oder ausdrücklich „die himmlischen Mächte“
  rationale: Der hebräische Text bezeichnet die Gruppe nicht genauer. Eine Festlegung auf Sterne, Engel oder feindliche geistliche Mächte würde eine mögliche Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung „in der Höhe … auf der Erde“ wurde bewusst bewahrt; „Heerschar“ erhält den feierlich-prophetischen Ton, bleibt aber verständlich.
