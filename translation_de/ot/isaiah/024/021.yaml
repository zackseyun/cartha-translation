    rationale: Der bisherige Alternativtext „die Heerschar droben im Himmel“ gibt nur eine zusammengezogene Deutung und spiegelt nicht, dass מָרוֹם sowohl im Konstrukt („Heer der Höhe“) als auch erneut als Ortsangabe steht. Die Fußnote sollte die alternative Deutung beider Vorkommen klar benennen.
  - severity: low
    issue: „Heerschar“ ist für das kollektive צְבָא weniger idiomatisch als „Heer“.
    rationale: „Heer“ bezeichnet im Deutschen ebenso eine geordnete Streitmacht bzw. eine große Schar und entspricht hier der üblichen kollektiven Funktion von צְבָא, ohne die Auslegung zu verändern.
