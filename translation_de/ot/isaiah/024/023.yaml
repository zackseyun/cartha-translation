  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חָֽפְרָה֙ הַ/לְּבָנָ֔ה וּ/בוֹשָׁ֖ה הַֽ/חַמָּ֑ה כִּֽי מָלַ֞ךְ יְהוָ֣ה צְבָא֗וֹת בְּ/הַ֤ר צִיּוֹן֙ וּ/בִ/יר֣וּשָׁלִַ֔ם וְ/נֶ֥גֶד זְקֵנָ֖י/ו כָּבֽוֹד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: de
  text: Dann wird der Mond beschämt dastehen und die Sonne sich schämen; denn Jahwe der Heerscharen herrscht auf dem Berg Zion und in Jerusalem, und vor seinen[a] Ältesten ist Herrlichkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ihren Ältesten“, wenn das Suffix auf Zion beziehungsweise Jerusalem bezogen wird statt auf Jahwe.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch knapp: „Herrlichkeit“. Die Wendung kann auch als „vor seinen Ältesten ist seine Herrlichkeit“ oder elliptisch als „vor seinen Ältesten: Herrlichkeit“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָפְרָה
  choice: wird … beschämt dastehen
  rationale: Das Verb bezeichnet hier Beschämung oder Demütigung, nicht das wörtliche Graben. Die Formulierung ist im Deutschen natürlich und unterscheidet sich zugleich vom parallelen בושׁ.
- source_word: הַלְּבָנָה
  choice: der Mond
  rationale: Das Substantiv ist die übliche Bezeichnung für den Mond; seine etymologische Verbindung mit Weißsein steht hier nicht im Vordergrund.
- source_word: וּבוֹשָׁה
  choice: wird … sich schämen
  rationale: בושׁ bezeichnet Scham. Das reflexive deutsche Verb bewahrt den Parallelismus, ohne beide hebräischen Verben völlig gleich wiederzugeben.
- source_word: הַחַמָּה
  choice: die Sonne
  rationale: In der poetischen Paarung mit dem Mond bezeichnet das Wort eindeutig die Sonne.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Beschämung von Mond und Sonne ein.
- source_word: מָלַךְ
  choice: herrscht
  rationale: Das Qatal kann im prophetischen Zusammenhang eine gewiss dargestellte oder gegenwärtig veranschaulichte Königsherrschaft ausdrücken. Das Präsens bewahrt diese knappe, feierliche Aussage, ohne sie ausschließlich zeitlich festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, semantisch breite Wiedergabe lässt offen, ob himmlische oder irdische Heere im Blick sind.
- source_word: בְּהַר צִיּוֹן
  choice: auf dem Berg Zion
  rationale: Dies ist die natürliche deutsche Wiedergabe der Präposition bei einem Berg.
- source_word: וּבִירוּשָׁלִַם
  choice: und in Jerusalem
  rationale: Bei einer Stadt wird ב im Deutschen idiomatisch mit „in“ wiedergegeben.
- source_word: וְנֶגֶד
  choice: und vor
  rationale: נגד bezeichnet hier die Gegenwart beziehungsweise Anwesenheit vor jemandem.
- source_word: זְקֵנָיו
  choice: seinen Ältesten
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf Jahwe, doch ein Bezug auf Zion beziehungsweise Jerusalem bleibt möglich und wird in der Fußnote erhalten.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: Das knappe Schlusswort bezeichnet gewichtige, sichtbare Hoheit und wird ohne zusätzliche possessive Bestimmung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- issue: Bezugswort des Suffixes in זְקֵנָיו
  choice: seinen Ältesten, auf Jahwe bezogen
  alternative: ihren Ältesten, auf Zion beziehungsweise Jerusalem bezogen
  rationale: Jahwe ist das naheliegende maskuline Bezugswort und Subjekt des Satzes. Wegen der knappen Syntax wird die alternative Beziehung nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Syntax der abschließenden Wendung וְנֶגֶד זְקֵנָיו כָּבוֹד
  choice: vor seinen Ältesten ist Herrlichkeit
  alternative: 'vor seinen Ältesten ist seine Herrlichkeit; oder elliptisch: vor seinen Ältesten: Herrlichkeit'
  rationale: Der hebräische Nominalsatz enthält weder ein ausdrückliches Verb noch ein Possessivsuffix bei „Herrlichkeit“. Die gewählte Fassung bleibt verständlich, ohne den Besitzbezug hinzuzufügen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Parallelität. „Beschämt dastehen“ und „sich schämen“ geben die beiden verwandten, aber unterschiedlichen Schamverben natürlich wieder. Der Schluss bleibt bewusst knapp und wahrt die syntaktische sowie theologische Mehrdeutigkeit.
