source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: de
  text: Die Erde ist durch ihre Bewohner entweiht, denn sie haben Gesetze übertreten, eine Ordnung verletzt[a] und den ewigen Bund gebrochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Ordnung verändert. Das hebräische Verb kann sowohl das Verändern als auch das Überschreiten einer festgesetzten Ordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Welcher „ewige Bund“ gemeint ist, wird hier nicht ausdrücklich gesagt. Die Wendung wird unter anderem auf den Bund mit Noah oder auf Gottes bleibende sittliche Ordnung für die Menschheit bezogen.
    reason: alternative_reading
lexical_decisions:
- source_word: חָנְפָה
  choice: ist … entweiht
  rationale: Das Verb bezeichnet hier eine moralisch-religiöse Verunreinigung oder Entweihung. „Entweiht“ macht deutlich, dass die Schuld der Menschen die Erde selbst betroffen hat, ohne den Sinn auf kultische Unreinheit zu verengen.
- source_word: תַּחַת יֹשְׁבֶיהָ
  choice: unter ihren Bewohnern
  rationale: Die Wiedergabe bewahrt das räumliche Bild der Präposition תַּחַת („unter“); zugleich lässt der Zusammenhang erkennen, dass die Bewohner für die Entweihung verantwortlich sind.
- source_word: עָבְרוּ תוֹרֹת
  choice: haben Gesetze übertreten
  rationale: עָבַר bezeichnet in rechtlich-moralischem Zusammenhang das Überschreiten verbindlicher Grenzen. Der Plural תוֹרֹת wird entsprechend als „Gesetze“ wiedergegeben, ohne ihn ausdrücklich auf das mosaische Gesetz festzulegen.
- source_word: חָלְפוּ חֹק
  choice: eine Ordnung verletzt
  rationale: חָלַף kann hier das Überschreiten beziehungsweise Verletzen einer festgesetzten Ordnung bezeichnen. „Ordnung“ gibt חֹק als verbindliche Festsetzung natürlich wieder; die ebenfalls mögliche Bedeutung „verändert“ bleibt in der Fußnote erhalten.
- source_word: הֵפֵרוּ בְּרִית עוֹלָם
  choice: den ewigen Bund gebrochen
  rationale: הֵפֵר ist gebräuchliche Bundessprache für das Brechen oder Außerkraftsetzen eines Bundes. „Den ewigen Bund“ wahrt die theologische Gewichtigkeit der Wendung, ohne ihren konkreten Bezug im Haupttext festzulegen.
theological_decisions:
- issue: Bezug des „ewigen Bundes“
  choice: Die Wendung wird allgemein als „der ewige Bund“ wiedergegeben, ohne ihn näher zu bestimmen.
  alternative: Mögliche Deutungen beziehen sie auf den Bund mit Noah, auf Gottes bleibende sittliche Ordnung für die Menschheit oder allgemein auf einen ewigen Bund zwischen Gott und den Menschen.
  rationale: Der hebräische Text nennt keinen bestimmten Bund. Eine ausdrückliche Zuordnung würde die im Text verbleibende theologische Offenheit unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den dreifachen Parallelismus der Rechts- und Bundessprache. „Unter ihren Bewohnern“ hält das konkrete hebräische Bild fest, obwohl im Deutschen auch die kausale Wiedergabe „durch ihre Bewohner“ möglich wäre.
