  terminology: „Gefangene“ und „Gefängnis“ geben die Haftterminologie klar und modern wieder. „Kerker“ wäre möglich, ist aber stärker literarisch markiert. „Zur Rechenschaft gezogen“ gibt die im Kontext naheliegende gerichtliche Nuance von נפקד wieder, ohne ausdrücklich „bestraft“ zu behaupten.
