source:
  edition: WLC
  text: וְ/אֻסְּפ֨וּ אֲסֵפָ֤ה אַסִּיר֙ עַל בּ֔וֹר וְ/סֻגְּר֖וּ עַל מַסְגֵּ֑ר וּ/מֵ/רֹ֥ב יָמִ֖ים יִפָּקֵֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: de
  text: Sie werden zusammengetrieben wie Gefangene in eine Grube und in einem Gefängnis eingeschlossen; nach vielen Tagen werden sie zur Rechenschaft gezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie werden nach vielen Tagen heimgesucht. Das hebräische Verb kann ein Aufsuchen oder Sich-Zuwenden bezeichnen; im Zusammenhang des Gerichts ist auch die Bedeutung „zur Rechenschaft ziehen“ naheliegend.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: sie werden zusammengebracht … zusammenbringt
  rationale: Die passive Verbform und das stammverwandte Substantiv verstärken gemeinsam den Gedanken des Sammelns. Die deutsche Wiederholung bildet diese hebräische Nachdrücklichkeit verständlich ab.
- source_word: אַסִּיר עַל־בּוֹר
  choice: wie man Gefangene in einer Grube zusammenbringt
  rationale: אַסִּיר steht formal im Singular, ist hier aber kollektiv zu verstehen. Die vergleichende Formulierung gibt das Bild einer Gefangenenschar wieder; עַל bezeichnet in Verbindung mit dem Einsammeln den Ort der Verwahrung.
- source_word: וְסֻגְּרוּ עַל־מַסְגֵּר
  choice: und in einem Kerker eingeschlossen
  rationale: Die passive Form von סגר bezeichnet erzwungene Einschließung. מַסְגֵּר ist ein Ort des Verschlusses oder der Haft; „Kerker“ hält das konkrete Gefängnisbild fest.
- source_word: וּמֵרֹב יָמִים
  choice: Nach vielen Tagen
  rationale: Die Wendung bezeichnet den Ablauf einer langen Zeitspanne und lässt sich im Deutschen natürlich mit „nach vielen Tagen“ wiedergeben.
- source_word: יִפָּקֵדוּ
  choice: werden sie zur Rechenschaft gezogen
  rationale: פקד kann ein Sich-Kümmern, Aufsuchen oder Zur-Verantwortung-Ziehen bezeichnen. Im Gerichtszusammenhang liegt eine zur Rechenschaft ziehende Zuwendung nahe, ohne dass das allgemeinere Bedeutungsspektrum verschwiegen wird.
theological_decisions:
- issue: Bedeutung von יִפָּקֵדוּ im Zusammenhang des Gerichts
  choice: werden sie zur Rechenschaft gezogen
  alternative: wird nach ihnen gesehen / werden sie aufgesucht
  rationale: Gefangennahme und Einschließung legen eine gerichtliche Abrechnung nahe. Da פקד jedoch sowohl fürsorgliche als auch strafende Zuwendung bezeichnen kann, bleibt die allgemeinere Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „zusammengebracht … zusammenbringt“ bewahrt die nachdrückliche hebräische Wortfigur; „Kerker“ erhält das konkrete Haftbild. Die echte Bedeutungsbreite des Schlussverbs wird durch die Fußnote offengehalten.
