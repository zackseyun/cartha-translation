source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: de
  text: Denn Jahwe, der Herr der Heere, hat einen Tag gegen alles Stolze und Hohe, gegen alles, was erhöht ist; es wird erniedrigt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den Zusammenhang natürlich.
- source_word: יוֹם לַיהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heere, hat einen Tag
  rationale: Die hebräische Nominalkonstruktion bezeichnet einen Jahwe zugehörigen beziehungsweise von ihm bestimmten Gerichtstag. „Hat einen Tag“ gibt dies knapp und verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: צְבָאוֹת
  choice: der Herr der Heere
  rationale: „Heere“ bewahrt den militärischen und majestätischen Sinn des Titels; die appositionale Form klingt im Deutschen natürlich und vermeidet die missverständliche Verbindung „Jahwe der Heere“.
- source_word: עַל
  choice: gegen
  rationale: Im Gerichtszusammenhang hat die Präposition adversative Bedeutung.
- source_word: כָּל גֵּאֶה וָרָם
  choice: alles Stolze und Hohe
  rationale: Bewahrt sowohl die moralische Bedeutung von גֵּאֶה als auch das Höhenbild von רָם und lässt offen, ob Menschen oder alles menschlich Erhöhte gemeint sind.
- source_word: כָּל נִשָּׂא
  choice: alles Erhabene
  rationale: Gibt das Bild des Erhöhten idiomatisch wieder und vermeidet eine unnötige Festlegung auf Personen.
- source_word: וְשָׁפֵל
  choice: und es wird erniedrigt werden
  rationale: Versteht die Form gemäß Kontext und Akzentuierung als Aussage über das Ergebnis des Gerichts; das Passiv lässt den göttlichen Urheber, wie im Hebräischen, unausgesprochen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher kenntlich gemacht; die traditionelle Ersatzlesung „der HERR“ bleibt möglich, wird aber nicht in den Haupttext gesetzt.
- issue: Wiedergabe des Titels יהוה צבאות
  choice: Jahwe, der Herr der Heere
  alternative: Jahwe der Heerscharen
  rationale: Die gewählte Form vermittelt Gottes Herrschaft über die Heere in verständlichem modernem Deutsch, ohne genauer zu bestimmen, ob himmlische oder irdische Heere gemeint sind.
- issue: Bezug der stolzen und erhöhten Größen
  choice: 'sächliche Sammelformen: „alles Stolze“, „alles Erhabene“'
  alternative: 'personenbezogen: „jeder Stolze“, „jeder Überhebliche“'
  rationale: Die hebräischen Ausdrücke können kollektiv auf Menschen und auf alles Erhöhte zielen. Die sächliche Form bewahrt diese Offenheit im unmittelbaren Kontext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die poetische Parallelstruktur. Der Gedankenstrich markiert die abschließende Gerichtsfolge. Keine Fußnote erforderlich.
