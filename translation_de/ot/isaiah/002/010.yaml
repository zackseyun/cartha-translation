  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: de
  text: Geh in den Fels und verbirg dich im Staub vor dem Schrecken Jahwes[a] und vor der Pracht seiner Majestät[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Grauen Jahwes“. Das hebräische Wort bezeichnet hier erschreckende Furcht angesichts seines Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor der Majestät seiner Erhabenheit“. Im Hebräischen stehen zwei bedeutungsnahe Wörter für überwältigende königliche Herrlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: Geh in den Felsen hinein
  rationale: Der Imperativ von בוא bezeichnet zusammen mit der Richtungsangabe das Hineingehen. „Geh … hinein“ ist im Deutschen natürlicher als „Komm in den Felsen“ und bewahrt das Bild einer Zuflucht im Felsgestein.
- source_word: וְהִטָּמֵן
  choice: und verbirg dich
  rationale: Der Nifal-Imperativ hat hier reflexiven Sinn. „Verbirg dich“ gibt ihn klar und würdig wieder.
- source_word: בֶּעָפָר
  choice: im Staub
  rationale: עָפָר bedeutet „Staub“ oder „Erde“. „Staub“ erhält die biblische Bildsprache von Erniedrigung und Vergänglichkeit.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Wörtlich steht „vom Angesicht/von der Gegenwart … weg“. Das deutsche „vor“ kann sowohl die Flucht aus der Gegenwart als auch den Anlass des Verbergens ausdrücken.
- source_word: פַּחַד יְהוָה
  choice: dem Schrecken Jahwes
  rationale: פַּחַד bezeichnet in diesem Gerichtszusammenhang erschreckendes Grauen, nicht ehrfürchtige Gottesfurcht. „Schrecken“ bewahrt die Härte des Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Tetragramm und einem bloßen Herrschertitel.
- source_word: וּמֵהֲדַר גְּאֹנוֹ
  choice: und vor der Pracht seiner Majestät
  rationale: הָדָר bezeichnet Pracht oder Herrlichkeit, גָּאוֹן hier Hoheit, Erhabenheit oder Majestät. Die Formulierung erhält die nachdrückliche Verbindung zweier bedeutungsnaher Ausdrücke.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פַּחַד im Gerichtskontext
  choice: Schrecken
  alternative: Grauen; Furcht
  rationale: Gemeint ist die überwältigende, furchterregende Erscheinung Jahwes im Gericht. Die positive Bedeutung ehrfürchtiger Gottesfurcht soll hier nicht eingetragen werden.
- issue: Verhältnis von הָדָר und גָּאוֹן
  choice: Pracht seiner Majestät
  alternative: Majestät seiner Erhabenheit
  rationale: Beide Wörter bezeichnen Aspekte überwältigender königlicher Herrlichkeit. Die Übersetzung lässt ihre verstärkende Verbindung stehen, ohne sie zu einem einzigen Begriff einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Befehlsform und die eindringliche Gerichtssprache bleiben erhalten; die leicht ungewöhnliche Wendung „in den Felsen hinein“ bewahrt das konkrete hebräische Zufluchtsbild.
