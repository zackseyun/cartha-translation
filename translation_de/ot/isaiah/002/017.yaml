id: ISA.2.17
reference: Isaiah 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: de
  text: Der Hochmut des Menschen wird sich beugen[a], und der Stolz der Menschen wird erniedrigt werden; Jahwe allein wird an jenem Tag erhaben sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Hoheit des Menschen wird erniedrigt werden.“ Das Hebräische beschreibt menschlichen Hochmut mit dem Bild von Höhe, die sich senkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁח
  choice: wird sich beugen
  rationale: Das Qal bezeichnet ein Niedrigwerden oder Sichbeugen. Im prophetischen Zusammenhang hat das Perfekt Zukunftsbedeutung; die reflexive Form bewahrt das konkrete Bild natürlicher als eine rein passive Wiedergabe.
- source_word: גַּבְהוּת הָאָדָם
  choice: der Hochmut des Menschen
  rationale: גַּבְהוּת bezeichnet wörtlich Höhe beziehungsweise Erhabenheit und hier bildhaft menschliche Überheblichkeit. „Hochmut“ ist im Deutschen natürlich und lässt das Höhenmotiv noch anklingen.
- source_word: וְשָׁפֵל
  choice: wird erniedrigt werden
  rationale: Das Verb beschreibt das Herabgesetzt- oder Niedrigwerden und steht parallel zu וְשַׁח. Die passive deutsche Form gibt die Erniedrigung klar wieder.
- source_word: רוּם אֲנָשִׁים
  choice: der Stolz der Menschen
  rationale: רוּם bezeichnet Höhe oder Erhebung, meint im Kontext aber die stolze Selbsterhöhung. „Stolz“ vermeidet das im Deutschen missverständliche „Erhöhung der Menschen“ und bewahrt den Sinn der Parallelzeile.
- source_word: וְנִשְׂגַּב
  choice: wird erhaben sein
  rationale: Das Niphal bezeichnet ein Hoch- oder Erhabensein. „Erhaben sein“ stellt Jahwes wirkliche Hoheit dem erniedrigten menschlichen Hochmut gegenüber.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: 'Das Wort betont die Ausschließlichkeit: An jenem Tag ist allein Jahwe erhaben.'
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche und zugleich würdige deutsche Wiedergabe der geläufigen prophetischen Zeitformel.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Anthropologische Begriffe הָאָדָם und אֲנָשִׁים
  choice: des Menschen … der Menschen
  alternative: der Menschheit … der Leute
  rationale: Die Übersetzung bewahrt den Wechsel vom repräsentativen Singular zum Plural und ist im modernen Deutschen weiterhin generisch verständlich.
- issue: Verhältnis menschlicher und göttlicher Höhe
  choice: Hochmut/Stolz wird erniedrigt; Jahwe ist allein erhaben
  alternative: menschliche Erhabenheit wird erniedrigt; Jahwe wird erhöht
  rationale: Die Wiedergabe wahrt die theologische Gegenüberstellung, ohne anzudeuten, Jahwe sei zuvor nicht erhaben gewesen. Zugleich bleibt die im Hebräischen durchgehende Höhen- und Erniedrigungsmetaphorik erkennbar.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Der Parallelismus ist erhalten; „Hochmut“ und „Stolz“ geben die bildhaft als Höhe dargestellte menschliche Selbsterhebung idiomatisch wieder.
