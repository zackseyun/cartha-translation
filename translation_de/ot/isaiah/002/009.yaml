  naturalness: „Der Mensch beugt sich nieder, und jeder Einzelne wird erniedrigt“ ist modernes, würdiges Deutsch und erhält den knappen Parallelismus. Die Wiederholung von „und“ ist möglich, ein Semikolon oder Komma wäre jedoch unnötig; die knappe Reihung wirkt poetisch.
  terminology: „Der Mensch“ und „jeder Einzelne“ bilden die Bewegung vom Allgemeinen zum Individuum angemessen ab. „Vergib ihnen nicht“ gibt die im Englischen gewählte, kontextuell plausible Lesart von נשא wieder. Die Fußnote muss die Alternative als lexikalische Möglichkeit markieren, ohne sie als eindeutige Bedeutung auszugeben.
