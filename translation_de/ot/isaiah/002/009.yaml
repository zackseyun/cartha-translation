  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: de
  text: So beugt sich der Mensch nieder, und jeder Einzelne wird erniedrigt. Vergib ihnen nicht![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: Richte sie nicht auf. Das hebräische Verb kann „heben, tragen“ und in bestimmten Zusammenhängen auch „vergeben“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: beugt sich … nieder
  rationale: Das Verb שׁחח bezeichnet ein Sich-Niederbeugen oder Niedersinken. Im unmittelbaren Zusammenhang mit der Verehrung von Götzen liegt eine aktive beziehungsweise reflexive Wiedergabe näher als eine rein passive Erniedrigung.
- source_word: אָדָם
  choice: der Mensch
  rationale: אָדָם bezeichnet hier den Menschen allgemein. Die Wiedergabe bewahrt den poetischen Gegensatz zum einzelnen אִישׁ, ohne ausschließlich männliche Personen nahezulegen.
- source_word: וַיִּשְׁפַּל
  choice: erniedrigt sich
  rationale: שׁפל bedeutet niedrig sein oder niedrig werden. Die reflexive Form passt zum parallelen Sich-Niederbeugen im Zusammenhang mit Götzenverehrung und hält zugleich den Gedanken der Erniedrigung fest.
- source_word: אִישׁ
  choice: jeder Einzelne
  rationale: Im Parallelismus mit אָדָם hebt אִישׁ den einzelnen Menschen hervor. „Jeder Einzelne“ gibt diesen verteilenden Sinn in natürlichem Deutsch wieder.
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: Vergib ihnen nicht!
  rationale: נשא kann in Verbindung mit Schuld oder einer betroffenen Person „vergeben“ bedeuten. Im Gerichtszusammenhang ist dies die wahrscheinlichste Deutung; die lexikalisch mögliche Bedeutung „aufrichten/erheben“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von נשא im Schlusssatz
  choice: Bitte an Gott, ihnen nicht zu vergeben
  alternative: Bitte an Gott, sie nicht aufzurichten beziehungsweise zu erheben
  rationale: Der Gerichtskontext stützt die Bedeutung „vergeben“, doch נשא bedeutet grundsätzlich „heben, tragen“ und lässt daher auch die alternative Deutung zu. Die Fußnote bewahrt diese echte Mehrdeutigkeit.
- issue: Handlung oder Erleiden in den ersten beiden Verben
  choice: Die Menschen beugen beziehungsweise erniedrigen sich selbst
  alternative: Die Menschen werden gebeugt und erniedrigt
  rationale: Der vorausgehende Vers schildert Götzenverehrung; deshalb können die Verben das freiwillige Niederbeugen vor den Werken eigener Hände bezeichnen. Die Formen und der weitere Gerichtskontext lassen jedoch auch einen resultativen Klang der Erniedrigung mitschwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Der Mensch … jeder Einzelne“ bildet die Bewegung vom Allgemeinen zum Individuellen ab; der abschließende Imperativ bleibt bewusst scharf.
