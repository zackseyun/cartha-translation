  yaml_path: translation/ot/isaiah/002/018.yaml
  text: And the idols will completely vanish[a].
translation:
  language: de
  text: Und die Götzen werden vollständig verschwinden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden restlos vergehen“.'
