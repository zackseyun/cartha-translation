lexical_decisions:
- source_word: וְהָאֱלִילִים
  choice: Und die Götzen
  rationale: וְ wird als einfache Fortführung mit „Und“ wiedergegeben; der Artikel wird durch „die“ ausgedrückt. אֱלִילִים bezeichnet Götzen und trägt eine abwertende Nebenbedeutung von Nichtigkeit oder Wertlosigkeit, die im Deutschen durch das geläufige Wort „Götzen“ hinreichend mitschwingt.
- source_word: כָּלִיל
  choice: vollständig
  rationale: כָּלִיל wird hier adverbial gebraucht und betont die restlose, vollständige Beseitigung.
- source_word: יַחֲלֹף
  choice: werden … verschwinden
  rationale: Die Form von חלף kann „vorübergehen“, „vergehen“ oder „verschwinden“ bedeuten. Mit כָּלִיל und den Götzen als Subjekt bringt „vollständig verschwinden“ die angekündigte völlige Beseitigung natürlich und treffend zum Ausdruck.
