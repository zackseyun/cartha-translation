  text: and against all the ships of Tarshish[a], and against all the beautiful craft.
translation:
  language: de
  text: und gegen alle Schiffe von Tarschisch und gegen alle prachtvollen Schaustücke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen alle begehrenswerten Bildwerke“, „gegen alle kostbaren Werke“ oder, im Zusammenhang mit den Tarschisch-Schiffen, „gegen alle prachtvollen Schiffe“. Das seltene hebräische Wort ist in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: und gegen
  rationale: Im Zusammenhang von Jesaja 2,12–16 bezeichnet עַל die Ziele des kommenden Gerichts des HERRN. „Gegen“ gibt diese feindliche Ausrichtung wieder; „und“ bewahrt die anaphorische Reihung.
- source_word: כָּל
  choice: alle
  rationale: Die Wiedergabe bewahrt den umfassenden Sinn und die poetische Wiederholung.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: Tarschisch-Schiffe
  rationale: Die traditionelle Bezeichnung lässt offen, ob Schiffe mit Ziel oder Herkunft Tarschisch oder allgemein große hochseetüchtige Handelsschiffe gemeint sind.
- source_word: שְׂכִיּוֹת הַחֶמְדָּה
  choice: kostbaren Prunkschiffe
  rationale: שְׂכִיּוֹת ist ein seltenes, unsicher gedeutetes Wort. Der unmittelbare maritime Parallelismus spricht für Wasserfahrzeuge; הַחֶמְדָּה kennzeichnet sie als begehrt, kostbar oder prachtvoll. „Prunkschiffe“ ist im Deutschen natürlich, bleibt aber wegen der lexikalischen Unsicherheit durch eine Fußnote abgesichert.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die zweimalige Formulierung „und gegen alle“ erhält den Rhythmus und die umfassende Gerichtsaussage des hebräischen Textes. „Prunkschiffe“ vermeidet das im Deutschen mehrdeutige „Fahrzeuge“, während die Fußnote die echte lexikalische Unsicherheit offenlegt.
