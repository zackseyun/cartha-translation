  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
translation:
  language: de
  text: Und sein Land[a] ist voll von Götzen. Vor dem Werk seiner Hände werfen sie sich nieder, vor dem, was seine Finger gemacht haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht der Singular: „sein Land … seiner Hände … seine Finger“. Gemeint ist Jakob beziehungsweise das Volk als kollektive Einheit; anschließend wird seine Handlung mit einem Verb im Plural beschrieben.'
    reason: collective_singular
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: ist voll
  rationale: Das Nifal von מלא beschreibt hier den gegenwärtigen Zustand des Landes. Das Präsens gibt die anschauliche prophetische Bestandsaufnahme natürlich wieder.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: Das maskuline Singularsuffix wird bewahrt. Es bezieht sich im Zusammenhang auf Jakob beziehungsweise das Volk als kollektive Einheit.
- source_word: אֱלִילִים
  choice: Götzen
  rationale: אֱלִילִים bezeichnet verehrte Götterbilder mit abwertendem Unterton. „Götzen“ ist dafür die klare und geläufige deutsche Entsprechung.
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: vor dem Werk seiner Hände
  rationale: Die Präposition bezeichnet zusammen mit השתחוה das Gegenüber, vor dem man sich niederwirft. „Werk seiner Hände“ erhält das konkrete Bild und die Ironie menschlich gefertigter Kultobjekte.
- source_word: יִשְׁתַּחֲווּ
  choice: werfen sie sich nieder
  rationale: Das Verb bezeichnet ein körperliches Niederwerfen, häufig als kultische Verehrung. Die Wiedergabe bewahrt das sichtbare Bild, ohne es auf den abstrakteren Begriff „anbeten“ zu verengen.
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: vor dem, was seine Finger gemacht haben
  rationale: 'Die Formulierung folgt dem Singularsuffix des Hebräischen und erhält die pointierte Wiederholung: Menschen verehren, was ihre eigene kollektive Handarbeit hervorgebracht hat. „Vor“ wird im Deutschen passend zum Verb wiederholt.'
theological_decisions:
- issue: Bedeutung der kultischen Handlung השתחוה
  choice: werfen sie sich nieder
  alternative: beten sie an
  rationale: Der Ausgangstext benennt zunächst die körperliche Gebärde, die im Zusammenhang eindeutig kultischen Sinn hat. Die konkrete Formulierung lässt Handlung und theologischen Vorwurf gemeinsam hervortreten.
- issue: Kollektiver Singular und pluralische Handlung
  choice: sein Land … seiner Hände … seine Finger; sie werfen sich nieder
  alternative: ihr Land … ihrer Hände … ihre Finger; sie werfen sich nieder
  rationale: 'Der Wechsel zwischen Singularsuffixen und pluralischem Verb gehört zur Ausdrucksweise des hebräischen Textes: Jakob beziehungsweise das Volk erscheint als kollektive Einheit und zugleich als handelnde Mehrheit. Die Übersetzung bewahrt diese Spannung und erläutert sie in einer Fußnote.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, während die parallelen Wendungen „Werk seiner Hände“ und „was seine Finger gemacht haben“ die Ironie des hebräischen Textes bewahren.
