  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: die prophetische Zukunftsperspektive, die offene Zeitangabe, die Erhöhung des Berges, das Strömen aller Nationen und den Bezug des Pronomens auf den Berg. Die Passivform וְנִשָׂא sollte jedoch im Deutschen nicht durch das reflexiv-aktive „sich ... erheben“ ersetzt werden, da der Ausgangstext den Berg als erhoben darstellt.'
