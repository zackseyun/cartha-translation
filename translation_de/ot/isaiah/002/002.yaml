id: ISA.2.2
reference: Isaiah 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: de
  text: Am Ende der Tage[a] wird der Berg des Hauses Jahwes als höchster der Berge fest gegründet sein[b] und über die Hügel erhoben sein; alle Nationen werden zu ihm strömen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »in kommenden Tagen« oder »in den letzten Tagen«.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »wird der Berg des Hauses Jahwes auf dem Gipfel der Berge fest gegründet sein«.'
    reason: alternative_reading
  - marker: c
    text: Das hebräische Verb zeichnet das Bild, dass die Nationen wie ein Fluss zu ihm hinströmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird … sein
  rationale: Leitet eine zukünftige prophetische Szene ein; die schlichte Futurform ist im Deutschen natürlich und bewahrt den Zukunftsbezug.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  rationale: Bewahrt die prophetische hebräische Wendung und ihre mögliche endzeitliche Weite, ohne sie auf ein bestimmtes Schema festzulegen.
- source_word: נָכוֹן יִהְיֶה
  choice: wird … fest gegründet sein
  rationale: Gibt Festigkeit, Beständigkeit und sichere Aufrichtung wieder.
- source_word: הַר בֵּית יְהוָה
  choice: der Berg des Hauses Jahwes
  rationale: Bildet die hebräische Genitivverbindung transparent ab und nennt sowohl den Berg als auch das Haus ausdrücklich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: als höchster der Berge
  rationale: Im Parallelismus mit der Erhebung über die Hügel bezeichnet die Wendung wahrscheinlich Vorrang beziehungsweise herausragende Höhe; die räumlich wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: und sich über die Hügel erheben
  rationale: Bewahrt das Bild der Erhöhung und die vergleichende Bedeutung der Präposition מן in natürlichem Deutsch.
- source_word: גְּבָעוֹת
  choice: Hügel
  rationale: Der gewöhnliche topografische Sinn passt zum Parallelismus mit den Bergen.
- source_word: וְנָהֲרוּ
  choice: werden … strömen
  rationale: Bewahrt das auffällige Bild von Völkern, die wie ein Wasserstrom zum Berg ziehen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das maskuline Pronomen bezieht sich grammatisch auf den maskulinen Berg; im Deutschen ist daher „ihm“ angemessen.
- source_word: כָּל הַגּוֹיִם
  choice: alle Nationen
  rationale: Bezeichnet hier umfassend die Völker beziehungsweise Nationen; „Heiden“ wäre stärker theologisch vorgeprägt.
theological_decisions:
- issue: Zeitangabe בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  alternative: In kommenden Tagen; in der letzten Zeit
  rationale: Die relativ formale Wiedergabe erhält den prophetischen und möglicherweise eschatologischen Bedeutungsraum, ohne eine bestimmte Endzeitlehre einzutragen.
- issue: Art der Erhöhung des Berges
  choice: als höchster der Berge
  alternative: auf dem Gipfel der Berge
  rationale: Der Parallelismus mit „über die Hügel erheben“ spricht für Vorrang oder herausragende Höhe; zugleich lässt das Hebräische eine stärker räumliche Lesart zu, die in der Fußnote genannt wird.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; dessen Wiedergabe bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Der Satzbau wurde für natürliche deutsche Lesbarkeit leicht geordnet; Mehrdeutigkeiten der Zeitangabe und der Stellung des Berges werden nicht dogmatisch aufgelöst, sondern in Fußnoten offengehalten.
