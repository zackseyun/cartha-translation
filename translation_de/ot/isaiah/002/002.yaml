  terminology: „Jahwe“, „Berg des Hauses Jahwes“, „Nationen“ und „Hügel“ sind angemessen. „Am Ende der Tage“ wahrt die idiomatische, theologisch offene prophetische Formel. Die Alternativfußnote sollte statt „in der letzten Zeit“ die näherliegende Formulierung „in den letzten Tagen“ verwenden.
