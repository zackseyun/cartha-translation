  text: וְ/עַל֙ כָּל אַרְזֵ֣י הַ/לְּבָנ֔וֹן הָ/רָמִ֖ים וְ/הַ/נִּשָּׂאִ֑ים וְ/עַ֖ל כָּל אַלּוֹנֵ֥י הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/013.yaml
  text: and against all the cedars of Lebanon[a], lofty and lifted up, and against all the oaks of Bashan.
translation:
  language: de
  text: Und gegen alle hohen und erhabenen Zedern des Libanon und gegen alle Eichen des Baschan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Terebinthen des Baschan“. Das hebräische Wort kann eine große Baumart bezeichnen, die als Eiche oder Terebinthe identifiziert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: und gegen
  rationale: Das wiederholte עַל bezeichnet in dieser Gerichtsankündigung die feindliche Zuwendung des Tages des HERRN; „und“ bewahrt die Reihung.
- source_word: כָּל
  choice: alle
  rationale: Die Gesamtbezeichnung passt natürlich zu den pluralischen Baumnamen und erhält den umfassenden Charakter der poetischen Aufzählung.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: Zedern des Libanon
  rationale: Die Constructusverbindung bezeichnet die berühmten, mit dem Libanon verbundenen Zedern; der deutsche Genitiv ist idiomatisch und quellennah.
- source_word: הָרָמִים
  choice: die hoch ... sind
  rationale: „hoch“ gibt die körperliche Höhe unmittelbar wieder und lässt zugleich den im Kontext mitschwingenden Bezug auf Überheblichkeit bestehen.
- source_word: וְהַנִּשָּׂאִים
  choice: und emporgehoben
  rationale: Die Form bezeichnet etwas Erhobenes. „emporgehoben“ bewahrt das Bild des Hebens und die bewusste Doppelung mit „hoch“, ohne sie zu einer rein ehrenden „Erhöhung“ umzudeuten.
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: Eichen des Baschan
  rationale: „Eichen“ ist im Parallelismus mit den mächtigen Zedern eine gut begründete Artbestimmung; da אַלּוֹן möglicherweise auch Terebinthen bezeichnet, wird die Alternative in einer Fußnote erhalten.
theological_decisions:
- issue: Symbolische Bedeutung der Bäume im Gerichtswort
  choice: Die Bäume werden wörtlich wiedergegeben; ihre Verbindung mit Stolz und menschlicher Selbsterhöhung ergibt sich aus dem Kontext.
  alternative: Die Bäume ausdrücklich als Sinnbilder stolzer Herrscher oder Völker übersetzen.
  rationale: Die wörtliche Bildsprache erhält die Dichtung und ihre Spannung zwischen Naturbild und symbolischer Bedeutung, ohne die Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „gegen alle“ sowie die parallelen Höhenbegriffe bleiben erhalten, um Aufbau und Bildkraft des hebräischen Verses wiederzugeben.
