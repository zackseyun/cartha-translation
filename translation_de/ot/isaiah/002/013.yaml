  source_fidelity: Die Grundübersetzung gibt die wiederholte gerichtliche Präposition וְעַל angemessen mit „gegen“ wieder und bewahrt die beiden Baumgruppen sowie die doppelte Höhencharakterisierung. Die attributive Fassung der beiden Partizipien ist im Deutschen jedoch näher an der kompakten hebräischen Nominalgruppe und idiomatischer.
