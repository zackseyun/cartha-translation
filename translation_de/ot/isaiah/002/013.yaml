  terminology: „Zedern des Libanon“, „Eichen des Baschan“ und „gegen alle“ sind treffend. Die lexikalische Alternative Terebinthen soll in der Fußnote verbleiben. Die Formulierung der Fußnote wird sprachlich präzisiert, ohne die botanische Ungewissheit zu verringern.
