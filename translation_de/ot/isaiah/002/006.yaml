base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: de
  text: Denn du hast dein Volk, das Haus Jakob, verlassen; denn sie sind voll von dem, was aus dem Osten kommt,[a] und betreiben Wahrsagerei wie die Philister.[b] Sie schlagen mit den Kindern von Fremden die Hand ein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Osten her“. Gemeint sein können Einflüsse oder Bräuche aus dem Osten, möglicherweise aber auch Menschen aus dem Osten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie sind Zeichendeuter wie die Philister.“ Die genaue Art der bezeichneten Wahrsagerei ist nicht sicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Verb ist selten und in seiner Bedeutung unsicher. Möglich sind auch: „Sie schließen Vereinbarungen mit“, „sie verbinden sich mit“ oder „sie haben Gemeinschaft mit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: du hast … verstoßen
  rationale: נטשׁ bezeichnet das Verlassen oder Aufgeben. „Verstoßen“ bewahrt hier die ernste, beziehungsbezogene Aussage, ohne eine endgültige Verwerfung ausdrücklich festzulegen.
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: dein Volk, das Haus Jakob
  rationale: Die appositionelle Struktur bleibt erhalten; „Jakob“ wird entsprechend dem hebräischen Wortlaut nicht durch „Israel“ ersetzt.
- source_word: מָלְאוּ מִקֶּדֶם
  choice: sie sind erfüllt von dem, was aus dem Osten kommt
  rationale: מלא wird resultativ-stativisch wiedergegeben. Die elliptische Wendung מִקֶּדֶם bleibt bewusst weiter als „östliche Bräuche“ und lässt offen, ob Einflüsse, Praktiken oder Menschen aus dem Osten gemeint sind.
- source_word: עֹנְנִים
  choice: betreiben Wahrsagerei
  rationale: Das Partizip bezeichnet Menschen, die eine Form der Wahrsagerei ausüben. Die verbale deutsche Fassung ist verständlich und vermeidet das heute wenig geläufige „Zeichendeuter“.
- source_word: כַּפְּלִשְׁתִּים
  choice: wie die Philister
  rationale: Die mit כ markierte Vergleichsbeziehung wird unmittelbar und knapp wiedergegeben.
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: mit den Kindern von Fremden
  rationale: Die Konstruktion „Kinder von Fremden“ folgt ילדי נכרים eng, ohne das grammatische Geschlecht unnötig auf Männer zu verengen.
- source_word: יַשְׂפִּיקוּ
  choice: schlagen sie die Hand ein
  rationale: Das seltene und unsichere Verb wird mit einem deutschen Ausdruck wiedergegeben, der sowohl die Handbewegung als auch eine mögliche Vereinbarung oder Verbindung anklingen lässt; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Art der fremden Einflüsse und Beziehungen
  choice: Der Text tadelt die Übernahme fremder, mit Wahrsagerei verbundener Einflüsse und eine nicht näher bestimmte Verbindung mit Fremden.
  alternative: Die erste Wendung kann unmittelbar Menschen aus dem Osten meinen; die letzte kann speziell Verträge, Bündnisse oder allgemeine Gemeinschaft bezeichnen.
  rationale: Die Übersetzung vermeidet eine pauschale ethnische Verurteilung und legt weder die elliptische Wendung מִקֶּדֶם noch das seltene Verb יַשְׂפִּיקוּ stärker fest, als es der hebräische Text erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet den begründenden Zusammenhang ab, ohne die langen hebräischen Satzglieder schwerfällig zu bündeln. „Die Hand einschlagen“ ist bildhaft und verständlich; die Fußnote bewahrt die lexikalische Unsicherheit.
