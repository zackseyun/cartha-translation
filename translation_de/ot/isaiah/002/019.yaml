source:
  edition: WLC
  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: de
  text: Dann werden sie in die Felshöhlen und in die Erdlöcher[a] hineingehen vor dem Schrecken Jahwes und vor der Pracht seiner Hoheit, wenn er sich erhebt, um die Erde in Schrecken zu versetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Löcher im Erdboden«; auch möglich: »in die Gänge im Staub«.'
    reason: Das seltene מְחִלּוֹת kann Löcher, unterirdische Gänge oder Tierbaue bezeichnen; עָפָר kann sowohl »Staub« als auch lockere Erde beziehungsweise Erdboden meinen.
lexical_decisions:
- source_word: וּבָאוּ
  choice: Dann werden die Menschen … fliehen
  rationale: Das Verb bedeutet grundsätzlich »kommen/gehen«; zusammen mit den Ortsangaben und מִפְּנֵי beschreibt es hier die Flucht in Verstecke. Das im Hebräischen nicht ausdrücklich genannte Subjekt wird im Deutschen aus dem Kontext mit »die Menschen« aufgenommen.
- source_word: בִּמְעָרוֹת צֻרִים
  choice: in die Felshöhlen
  rationale: Gibt die Höhlen in Felsen oder Felsklüften knapp und natürlich wieder.
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: und in die Erdlöcher[a]
  rationale: מְחִלּוֹת bezeichnet Löcher, Gänge oder unterirdische Verstecke; עָפָר bezeichnet Staub beziehungsweise lockere Erde. »Erdlöcher« ist im Deutschen verständlich, während die Bildvarianten in der Fußnote erhalten bleiben.
- source_word: מִפְּנֵי פַּחַד יְהוָה
  choice: vor dem Schrecken Jahwes
  rationale: מִפְּנֵי bezeichnet hier das Zurückweichen vor der Gegenwart; פַּחַד ist der von Jahwes Gericht ausgelöste Schrecken, nicht ehrfürchtige Gottesfurcht.
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: und vor der Pracht seiner Hoheit
  rationale: 'Bewahrt beide Ausdrücke für göttliche Größe: הָדָר als Pracht und גָּאוֹן als Hoheit beziehungsweise Erhabenheit.'
- source_word: בְּקוּמוֹ
  choice: wenn er sich erhebt
  rationale: Die Präposition mit dem Infinitiv bezeichnet einen zeitlichen Umstand; die reflexive Form klingt im Deutschen würdevoll und natürlich.
- source_word: לַעֲרֹץ הָאָרֶץ
  choice: um die Erde in Schrecken zu versetzen
  rationale: Der seltene Verbstamm bezeichnet hier ein Erschreckenmachen beziehungsweise Erzitternlassen; die Wiedergabe wahrt den Gerichtscharakter und bezieht הָאָרֶץ kosmisch auf die Erde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, sodass der im Ausgangstext ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Bedeutung von פַּחַד
  choice: Schrecken
  alternative: Furcht
  rationale: Im Gerichtskontext bezeichnet das Wort den von Gottes machtvollem Auftreten ausgelösten Schrecken und nicht primär ehrfürchtige Gottesfurcht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Parallelität der beiden Verstecke und die doppelte Beschreibung der göttlichen Majestät bleiben erhalten; schwer verständliche Hebraismen werden maßvoll natürlich formuliert.
