  text: בֵּ֖ית יַעֲקֹ֑ב לְכ֥וּ וְ/נֵלְכָ֖ה בְּ/א֥וֹר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: de
  text: Haus Jakobs[a], kommt[b], lasst uns im Licht Jahwes gehen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr vom Haus Jakobs“. Die hebräische Wendung ist eine direkte Anrede an die Nachkommen Jakobs.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Geht, lasst uns gehen.“ Der hebräische Imperativ kann in dieser Verbindung einladend als „Kommt!“ wiedergegeben werden; darauf folgt eine Form, die zum gemeinsamen Handeln auffordert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: Haus Jakob
  rationale: Die hebräische Status-constructus-Verbindung dient hier als direkte Anrede an die Nachkommen Jakobs. „Haus Jakob“ bewahrt das prophetische Bild und vermeidet die stärker deutende Wiedergabe „Familie Jakobs“.
- source_word: לְכוּ
  choice: kommt
  rationale: Der maskuline Pluralimperativ von הלך kann in dieser auffordernden Verbindung idiomatisch als einladendes „Kommt!“ wiedergegeben werden. Das ist im Deutschen natürlicher als „Geht!“, zumal unmittelbar die gemeinsame Aufforderung folgt.
- source_word: וְנֵלְכָה
  choice: lasst uns … gehen
  rationale: Die Kohortativform der ersten Person Plural drückt eine gemeinsame Aufforderung oder Entschlossenheit aus. „Lasst uns gehen“ erhält sowohl diese Funktion als auch das Bewegungsbild des hebräischen Verbs.
- source_word: בְּאוֹר
  choice: im Licht
  rationale: Die Präposition ב kann hier den Bereich oder das Mittel bezeichnen. „Im Licht“ bewahrt die räumlich-ethische Metapher und lässt offen, ob Führung, Erkenntnis oder Lebensführung im Vordergrund steht.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben. Wegen der Verbindung mit „Licht“ steht hier der Genitiv „Jahwes“, statt den Namen durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ wahrt den Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bedeutung des Gehens im Licht
  choice: das Bild mit „gehen“ bewahren
  alternative: „leben“ oder „wandeln“
  rationale: „Leben“ würde die ethische Deutung ausdrücklich machen; „wandeln“ klingt im heutigen Deutsch altertümlich. „Gehen“ erhält die konkrete Metapher und ihre theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Bildsprache. Die Wiederholung des Verbs „gehen“ wird in der Hauptfassung teilweise idiomatisch geglättet, ohne die gemeinsame Aufforderung oder das Lichtbild aufzulösen.
