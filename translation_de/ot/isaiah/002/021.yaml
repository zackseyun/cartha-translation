  text: לָ/בוֹא֙ בְּ/נִקְר֣וֹת הַ/צֻּרִ֔ים וּ/בִ/סְעִפֵ֖י הַ/סְּלָעִ֑ים מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: de
  text: um in die Höhlen der Felsen und in die Spalten der Felsklippen[a] hineinzugehen, vor dem Schrecken Jahwes und vor dem Glanz seiner Hoheit, wenn er sich erhebt, um die Erde[c] in Schrecken zu versetzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Felshöhlungen und in die Klüfte der Felsen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um die Erde erbeben zu lassen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Land“.'
    reason: scope_ambiguity
lexical_decisions:
- source_word: לָבוֹא
  choice: hineinzugehen
  rationale: Der Infinitiv mit ל setzt den Satz aus dem vorigen Vers fort. „Hineingehen“ bildet die Bewegung in die felsigen Zufluchtsorte direkt ab, ohne den im Verb selbst nicht ausdrücklich enthaltenen Gedanken des Versteckens einzufügen.
- source_word: נִקְרוֹת הַצֻּרִים
  choice: Höhlen der Felsen
  rationale: נִקְרוֹת bezeichnet natürliche Höhlungen oder Hohlräume im Gestein; „Höhlen“ ist anschaulich und im Deutschen geläufig.
- source_word: סְעִפֵי הַסְּלָעִים
  choice: Spalten der Felsklippen
  rationale: Im geologischen Zusammenhang bezeichnet סְעִפֵי zerklüftete Spalten oder Risse. „Felsklippen“ bewahrt gegenüber dem ersten Parallelglied eine leichte Bedeutungsabstufung.
- source_word: מִפְּנֵי
  choice: fort vom
  rationale: Die Wendung bezeichnet ein Zurückweichen aus der Gegenwart beziehungsweise angesichts des Schreckens Jahwes. „Fort vom“ gibt die räumliche Fluchtrichtung natürlich wieder.
- source_word: פַּחַד יְהוָה
  choice: Schrecken Jahwes
  rationale: פַּחַד meint hier den von Gottes machtvollem Erscheinen ausgehenden Schrecken, nicht nur ein inneres Angstgefühl.
- source_word: הֲדַר גְּאוֹנוֹ
  choice: Glanz seiner Hoheit
  rationale: 'Die Wiedergabe unterscheidet die beiden eng verbundenen Begriffe: הֲדַר als „Glanz“ und גָּאוֹן in positiver göttlicher Bedeutung als „Hoheit“.'
- source_word: בְּקוּמוֹ
  choice: wenn er sich erhebt
  rationale: Die Präposition mit Infinitiv hat hier zeitliche Bedeutung. Die reflexive Form ist im Deutschen würdig und natürlich.
- source_word: לַעֲרֹץ
  choice: um … in Schrecken zu versetzen
  rationale: Das Verb bezeichnet das Hervorrufen von Schrecken; die Formulierung wahrt diesen Grundsinn, während die mögliche Folge des Erbebens in einer Fußnote genannt wird.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der umfassende Zusammenhang von Jesaja 2 spricht für „Erde“; die grammatisch ebenfalls mögliche Bedeutung „Land“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der Kontext der allgemeinen Erniedrigung der Menschen legt die umfassende Bedeutung nahe; die örtlich begrenzte Lesart bleibt sprachlich möglich und wird deshalb angemerkt.
- issue: Bedeutung von לַעֲרֹץ
  choice: in Schrecken versetzen
  alternative: erbeben lassen
  rationale: Die gewählte Fassung folgt dem Sinnfeld des Schreckens und nimmt das Motiv von פַּחַד auf. Eine kausative Deutung im Sinn eines Erzitterns oder Erbebens ist ebenfalls möglich.
translation_notes:
  register: Moderne, würdige Standardsprache. Die syntaktische Form als mit „um“ beginnender Infinitivsatz bleibt erhalten, weil der Vers den Satz aus Jesaja 2,20 fortführt. Die parallelen Gesteinsbilder werden ohne unnötige Vereinheitlichung wiedergegeben.
