  text: וְ/עַ֖ל כָּל מִגְדָּ֣ל גָּבֹ֑הַ וְ/עַ֖ל כָּל חוֹמָ֥ה בְצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
translation:
  language: de
  text: und gegen jeden hohen Turm[a] und gegen jede befestigte Mauer –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und über jeden hohen Turm und über jede befestigte Mauer“. Die hebräische Präposition bedeutet wörtlicher „auf“ oder „über“, bezeichnet hier im Zusammenhang aber die Ziele des kommenden Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: und gegen
  rationale: Die wiederholte Verbindung führt im Zusammenhang von Jesaja 2,12–16 weitere Ziele des göttlichen Gerichts an. „Gegen“ gibt diese feindliche Ausrichtung im modernen Deutsch natürlich wieder; das räumlich wörtlichere „auf/über“ bleibt als Alternative in der Fußnote erhalten.
- source_word: כָּל
  choice: jeden / jede
  rationale: Vor den singularischen Substantiven bezeichnet כָּל jeweils jedes einzelne Exemplar einer Gattung. Die deutsche Form richtet sich im Genus nach „Turm“ beziehungsweise „Mauer“.
- source_word: מִגְדָּל
  choice: Turm
  rationale: Das Substantiv bezeichnet allgemein einen Turm oder ein erhöhtes Bauwerk. „Wachturm“ wäre ohne nähere Festlegung des Kontextes zu eng.
- source_word: גָּבֹהַ
  choice: hoch
  rationale: Das Adjektiv bezeichnet physische Höhe und lässt zugleich den thematischen Bezug zur menschlichen Überheblichkeit im Kapitel anklingen, ohne ihn erklärend in den Text einzutragen.
- source_word: חוֹמָה
  choice: Mauer
  rationale: Das Wort bezeichnet eine Mauer, häufig mit Schutzfunktion. Die militärische Sicherung wird durch das folgende Adjektiv ausgedrückt.
- source_word: בְצוּרָה
  choice: befestigt
  rationale: Das Adjektiv beschreibt etwas, das gesichert oder wehrhaft gemacht ist. „Befestigt“ gibt den defensiv-militärischen Sinn präzise und idiomatisch wieder.
theological_decisions:
- issue: Fortführung des im Kontext vorausgesetzten göttlichen Gerichts
  choice: Die wiederholten עַל-Phrasen werden mit „gegen“ als Ziele des Gerichts wiedergegeben.
  alternative: Wörtlicher „über/auf“ übersetzen und die feindliche Bedeutung allein dem Kontext überlassen.
  rationale: Jesaja 2,12–16 zählt poetisch auf, worüber beziehungsweise wogegen der Tag des HERRN kommt. „Gegen“ macht die kontextuell vorhandene adversative Kraft deutlich, ohne einen zusätzlichen Gegenstand oder eine zusätzliche Handlung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. Der Gedankenstrich bewahrt den offenen Anschluss innerhalb der poetischen Aufzählung. „Jeden/jede“ bildet die distributive Wiederholung von כָּל ab.
