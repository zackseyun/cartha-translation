source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ עַמִּ֣ים רַבִּ֗ים וְ/אָמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: de
  text: 'Und viele Völker werden hingehen[a] und sagen: »Kommt, lasst uns hinaufziehen zum Berg Yahwehs, zum Haus des Gottes Jakobs, damit er uns seine Wege lehrt und wir auf seinen Pfaden gehen.« Denn von Zion wird Weisung ausgehen[b] und das Wort Yahwehs von Jerusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »werden gehen« oder »werden kommen«. Das hebräische Verb bedeutet wörtlich »gehen/wandern« und beschreibt hier die Bewegung der Völker nach Zion.'
    reason: lexical_alternative
  - marker: b
    text: »Weisung« übersetzt das hebräische Wort Tora; je nach Zusammenhang kann es auch »Gesetz«, »Lehre« oder »Unterweisung« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: werden hingehen
  rationale: הלך bedeutet wörtlich »gehen« bzw. »wandern«. »Hingehen« ist im Deutschen natürlich und lässt die Bewegung der Völker auf Zion zu erkennen, ohne den im Hebräischen nicht ausdrücklich markierten Erzählstandpunkt durch »kommen« festzulegen.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: עַמִּים bezeichnet ethnisch-kulturelle Gemeinschaften bzw. Völker; »Völker« bewahrt hier den kollektiven Plural besser als das politisch engere »Nationen«.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Kommt, lasst uns hinaufziehen
  rationale: Die Aufforderung beschreibt eine gemeinsame Wallfahrt. »Hinaufziehen« bewahrt sowohl die tatsächliche Höhenbewegung als auch den geläufigen Sprachgebrauch für den Weg nach Jerusalem.
- source_word: הַר יְהוָה
  choice: Berg Yahwehs
  rationale: הַר heißt »Berg«; der Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: Haus des Gottes Jakobs
  rationale: בַּיִת bedeutet wörtlich »Haus«. Obwohl der Tempel gemeint ist, erhält »Haus« die hebräische Ausdrucksweise und ihre religiöse Bildkraft.
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: Er soll uns seine Wege lehren
  rationale: ירה im Hifil bedeutet »lehren/unterweisen«. Das hebräische מִן in der idiomatischen Verbindung bezeichnet den Gegenstandsbereich, aus dem gelehrt wird; natürliches Deutsch gibt die Wendung mit dem direkten Objekt »seine Wege« wieder.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: damit wir auf seinen Pfaden gehen
  rationale: Das Gehen auf Gottes Pfaden ist ein Bild für die Lebensführung. »Damit« gibt den Ziel- bzw. Folgezusammenhang der Verbfolge wieder, ohne ihn dogmatisch zu verengen.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: תּוֹרָה umfasst göttliche Lehre und Unterweisung, nicht nur gesetzliche Vorschriften. »Weisung« bewahrt diese Breite und klingt im Deutschen zugleich würdig und verständlich.
- source_word: תֵּצֵא
  choice: wird ausgehen
  rationale: יצא bezeichnet das Herausgehen. »Ausgehen von« gibt die Bewegung der Weisung von Zion zu den Völkern idiomatisch wieder.
- source_word: וּדְבַר יְהוָה
  choice: und das Wort Yahwehs
  rationale: דְּבַר־יְהוָה ist die etablierte prophetische Wendung »Wort Yahwehs« und wird nicht auf »Botschaft« eingeengt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. »Yahweh« stellt ihn als Namen dar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz; Lehre; Unterweisung
  rationale: Im Zusammenhang der Völkerwallfahrt bezeichnet תּוֹרָה die von Zion ausgehende göttliche Unterweisung in umfassendem Sinn. »Weisung« vermeidet eine Beschränkung auf einen Gesetzeskodex.
- issue: Verhältnis von Gottes Lehren und dem Gehen der Völker
  choice: Er soll uns seine Wege lehren, damit wir auf seinen Pfaden gehen
  alternative: Er wird uns seine Wege lehren, und wir werden auf seinen Pfaden gehen
  rationale: Die hebräische Verbfolge kann Ziel, Folge oder erwartete Zukunft anklingen lassen. Die gewählte Fassung hält den Wunsch- und Zielcharakter der Aufforderung fest, ohne eine bestimmte Lehre über menschliches oder göttliches Handeln einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. »Hinaufziehen«, »Weisung« und »Pfade« bewahren den prophetischen Ton, bleiben aber allgemein verständlich. Die direkte Rede ist klar gegliedert; der Gottesname wird konsequent als Yahweh wiedergegeben.
