  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: de
  text: Das Wort[a], das Jesaja, der Sohn des Amoz, über Juda und Jerusalem sah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Botschaft« oder »Die Sache«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »sah«; eine übliche prophetische Ausdrucksweise für das Empfangen einer Offenbarung in einer Schau.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In einer prophetischen Überschrift bewahrt »das Wort« den konkreten hebräischen Ausdruck und ist im Deutschen verständlich.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen leitet den näher bestimmenden Relativsatz natürlich ein.
- source_word: חָזָה
  choice: schaute
  rationale: Das Verb bezeichnet wörtlich ein Sehen und wird für prophetische Schau gebraucht. »Schaute« bewahrt die visionäre Ausdrucksweise, ohne sie erklärend aufzulösen.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: בֶּן
  choice: der Sohn des
  rationale: Die hebräische Konstruktverbindung wird als natürliche deutsche Herkunftsangabe wiedergegeben.
- source_word: אָמוֹץ
  choice: Amoz
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: עַל
  choice: über
  rationale: In der Überschrift bezeichnet עַל neutral den Gegenstand der prophetischen Schau. »Über« lässt sowohl Gericht als auch Hoffnung zu und klingt im Deutschen natürlicher als »betreffend«.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Etablierte deutsche biblische Namensform.
- source_word: וִירוּשָׁלִָם
  choice: und Jerusalem
  rationale: Die Konjunktion und der Ortsname werden direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Art der prophetischen Offenbarung in חָזָה
  choice: Die visionäre Sprache wird mit »schaute« beibehalten.
  alternative: »in einer Vision empfing« oder »weissagte«
  rationale: Der hebräische Text verwendet ausdrücklich ein Verb des Sehens. Die Übersetzung wahrt diese prophetische Bildsprache und legt die genaue Art des Offenbarungsvorgangs nicht weiter fest.
- issue: Bedeutungsumfang von עַל in der Überschrift
  choice: »über Juda und Jerusalem«
  alternative: »gegen Juda und Jerusalem« oder »Juda und Jerusalem betreffend«
  rationale: Die Überschrift benennt umfassend den Gegenstand der Schau. »Über« vermeidet eine vorschnelle Beschränkung auf Gericht, da der folgende Zusammenhang sowohl Gericht als auch Hoffnung enthält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Schaute« ist leicht gehoben, aber allgemein verständlich und bewahrt den prophetisch-visionären Charakter des hebräischen Verbs.
