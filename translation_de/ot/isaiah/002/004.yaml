- from: Und er wird zwischen den Nationen Recht sprechen und für viele Völker entscheiden[a]. Dann werden sie ihre Schwerter zu Pflugscharen schmieden und ihre Speere zu Winzermessern. Keine Nation wird mehr gegen eine andere das Schwert erheben[b], und sie werden den Krieg nicht mehr erlernen.
  to: Und er wird zwischen den Nationen Recht sprechen und für viele Völker Recht sprechen[a]. Sie werden ihre Schwerter zu Pflugscharen schlagen und ihre Speere zu Rebmessern. Keine Nation wird gegen eine andere das Schwert erheben[b], und sie werden nicht mehr lernen, Krieg zu führen.
  rationale: Die Revision entfernt die nicht im ersten Satzteil vorhandene Zeitangabe „mehr“, ersetzt das zusätzliche „Dann“ durch die quellnähere Parataxe und glättet die gerichtliche Aussage von וְהוֹכִיחַ idiomatisch. Die abschließende Wendung wird in natürliches modernes Deutsch übertragen, ohne ihre Bedeutung als Ende der Einübung von Krieg zu verlieren. Die Fußnoten wurden an den korrigierten Text und die tatsächliche hebräische Satzstruktur angepasst.
