  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: de
  text: Und er wird zwischen den Nationen Recht sprechen und für viele Völker Recht sprechen[a]. Sie werden ihre Schwerter zu Pflugscharen schlagen und ihre Speere zu Rebmessern. Keine Nation wird gegen eine andere das Schwert erheben[b], und sie werden nicht mehr lernen, Krieg zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und viele Völker zurechtweisen“ oder „für viele Völker schlichten“. Das hebräische Verb kann sowohl eine richterlich-entscheidende als auch eine zurechtweisende Bedeutung haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Nation wird gegen Nation kein Schwert erheben.“ Das hebräische „nicht mehr“ steht im folgenden Satzteil: „sie werden nicht mehr Krieg lernen“.'
    reason: source_structure
lexical_decisions:
- source_word: וְשָׁפַט בֵּין הַגּוֹיִם
  choice: Und er wird zwischen den Nationen Recht sprechen
  rationale: שׁפט bezeichnet hier zusammen mit בֵּין eine richterliche Entscheidung zwischen Parteien. „Recht sprechen“ bewahrt den forensischen Sinn und lässt das im Hebräischen nicht ausdrücklich genannte Subjekt unbestimmt.
- source_word: וְהוֹכִיחַ לְעַמִּים רַבִּים
  choice: und für viele Völker entscheiden
  rationale: יכח im Hifil kann entscheiden, zurechtweisen oder schlichten bedeuten. Der Parallelismus zu שׁפט legt hier den richterlich-schlichtenden Sinn nahe; „entscheiden“ fügt keine ausdrücklich genannten „Streitfälle“ ein.
- source_word: וְכִתְּתוּ חַרְבוֹתָם לְאִתִּים
  choice: Dann werden sie ihre Schwerter zu Pflugscharen schmieden
  rationale: כתת bedeutet schlagen bzw. zerschlagen und bezeichnet hier die Umarbeitung. Das idiomatische „schmieden“ vermittelt diesen Vorgang natürlich; אִתִּים sind Pflugscharen oder Pflugmesser.
- source_word: וַחֲנִיתוֹתֵיהֶם לְמַזְמֵרוֹת
  choice: und ihre Speere zu Winzermessern
  rationale: חֲנִיתוֹת sind Speere; מַזְמֵרוֹת sind Schneidewerkzeuge zum Beschneiden von Reben oder Bäumen. „Winzermesser“ ist eine verständliche, konkrete deutsche Bezeichnung.
- source_word: לֹא יִשָּׂא גוֹי אֶל גּוֹי חֶרֶב
  choice: Keine Nation wird mehr gegen eine andere das Schwert erheben
  rationale: Die Wendung נשא חרב beschreibt das feindliche Erheben bzw. Aufnehmen des Schwertes. „Eine andere“ gibt das wiederholte גוי im Deutschen natürlich wieder; „mehr“ nimmt in Verbindung mit dem folgenden עוֹד das Ende des Krieges auf.
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: und sie werden den Krieg nicht mehr erlernen
  rationale: Die Formulierung wahrt das markante hebräische Bild „Krieg lernen“ und kann sowohl Kriegsschulung als auch das Einüben kriegerischer Praxis umfassen.
theological_decisions:
- issue: Identität des Subjekts der Verben וְשָׁפַט und וְהוֹכִיחַ
  choice: Das Pronomen „er“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: „Der HERR wird …“
  rationale: Die nähere Umgebung weist auf den HERRN als Handelnden, doch der Vers selbst nennt das Subjekt nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Offenheit.
- issue: Bedeutung von וְהוֹכִיחַ
  choice: 'richterlich-schlichtend: „entscheiden“'
  alternative: „zurechtweisen“ oder „schlichten“
  rationale: Der Parallelismus zu „Recht sprechen“ und die folgende Friedenswirkung stützen den forensischen Sinn, ohne die ebenfalls mögliche korrektive Nuance auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter prophetischer Bildsprache. „Nationen“ und „Völker“ bilden die unterschiedliche hebräische Wortwahl גּוֹיִם / עַמִּים ab. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
