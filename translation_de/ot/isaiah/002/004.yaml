    rationale: Die Wendung kann wie ein Entscheiden anstelle der Völker klingen. „für viele Völker Recht sprechen“ ist idiomatisch und bildet den gerichtlichen Sinn im Parallelismus zu „zwischen den Nationen Recht sprechen“ ab.
  - severity: low
