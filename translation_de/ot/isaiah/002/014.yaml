source:
  edition: WLC
  text: וְ/עַ֖ל כָּל הֶ/הָרִ֣ים הָ/רָמִ֑ים וְ/עַ֖ל כָּל הַ/גְּבָע֥וֹת הַ/נִּשָּׂאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/014.yaml
  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: de
  text: und gegen alle hohen Berge[a] und gegen alle emporragenden Hügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle erhabenen Berge und alle hoch aufragenden Hügel“.'
    reason: Lexikalische Alternative für die beiden Ausdrücke der Erhöhung; die Wiedergabe kann die räumliche Höhe oder stärker den im Kontext mitschwingenden Gedanken des Erhabenseins betonen.
lexical_decisions:
- source_word: וְעַל
  choice: und gegen
  rationale: Im fortlaufenden Gerichtskatalog bezeichnet עַל das, wogegen sich der Tag des HERRN richtet; „gegen“ gibt diese Zielrichtung natürlich wieder.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ entspricht dem umfassenden, wiederholten כָּל in der poetischen Aufzählung.
- source_word: הֶהָרִים
  choice: Berge
  rationale: „Berge“ wahrt den Gegensatz zum folgenden גְּבָעוֹת („Hügel“).
- source_word: הָרָמִים
  choice: hohen
  rationale: Das von רום abgeleitete Adjektiv bezeichnet räumliche Höhe; „hohen Berge“ ist im Deutschen natürlich und bleibt zunächst konkret.
- source_word: הַגְּבָעוֹת
  choice: Hügel
  rationale: „Hügel“ ist die klare Standardentsprechung und erhält die topografische Abstufung gegenüber den Bergen.
- source_word: הַנִּשָּׂאוֹת
  choice: emporragenden
  rationale: Das passive Partizip von נשׂא beschreibt etwas Erhobenes. „Emporragend“ bewahrt das Bild erhöhter Landschaft und klingt bei Hügeln natürlicher als das wörtlichere „emporgehoben“.
theological_decisions:
- issue: Ob die erhöhten Landschaftsformen ausdrücklich als Sinnbilder menschlichen Hochmuts wiederzugeben sind
  choice: Die konkrete Landschaftssprache bleibt im Haupttext erhalten; mögliche symbolische Anklänge ergeben sich aus dem Zusammenhang.
  alternative: „stolze Berge“ und „erhabene Hügel“, um die Hochmutsthematik ausdrücklich hervorzuheben
  rationale: Der weitere Abschnitt richtet sich gegen alles Hohe und Erhabene, doch der Vers nennt zunächst konkrete Berge und Hügel. Eine bildhafte Deutung sollte daher nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die zweimalige Wendung „gegen alle“ bildet die hebräische Parallelstruktur ab; vor dem zweiten Glied steht kein Komma, da zwei gleichrangige Satzglieder mit „und“ verbunden sind.
