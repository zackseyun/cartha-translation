  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: de
  text: An jenem Tag wird der Mensch seine silbernen und seine goldenen Götzen, die sie ihm gemacht haben, um sich vor ihnen niederzuwerfen, den Maulwürfen[a] und den Fledermäusen hinwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung der ungewöhnlichen hebräischen Wendung ist unsicher; möglicherweise sind Maulwürfe oder andere grabende Tiere gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird im modernen Deutschen natürlich und zugleich würdevoll wiedergegeben.
- source_word: יַשְׁלִיךְ
  choice: hinwerfen
  rationale: Das Hifil bezeichnet ein Werfen oder Fortschleudern; zusammen mit dem Dativ der Tiere vermittelt „hinwerfen“ hier die entschiedene Preisgabe der Götzen.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der generische Singular bleibt erhalten und bezeichnet repräsentativ den Menschen beziehungsweise die Menschheit.
- source_word: אֱלִילֵי כַסְפּוֹ וְאֵת אֱלִילֵי זְהָבוֹ
  choice: seine silbernen und seine goldenen Götzen
  rationale: „Götzen“ gibt die kultischen Bilder samt ihrer abwertenden Nuance klar wieder; die Wiederholung von „seine“ wahrt den Nachdruck des Hebräischen, ohne im Deutschen schwerfällig zu wirken.
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: die sie ihm gemacht haben
  rationale: Der Plural des hebräischen Verbs und das „für ihn/ihm“ bleiben bewusst erhalten; das nicht näher bestimmte „sie“ kann auf die Hersteller der Bilder verweisen.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: damit er sich vor ihnen niederwirft
  rationale: Die Formulierung bewahrt die körperliche Grundbedeutung des Sich-Niederwerfens und lässt zugleich den im Zusammenhang eindeutigen Akt der Verehrung erkennen.
- source_word: לַחְפֹּר פֵּרוֹת
  choice: den Maulwürfen
  rationale: Die schwierige hebräische Wendung wird gemäß der traditionellen und im Kontext plausiblen Deutung als Bezeichnung grabender Tiere wiedergegeben; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְלָעֲטַלֵּפִים
  choice: und den Fledermäusen
  rationale: Die Tierbezeichnung ist lexikalisch klar; zusammen mit den grabenden Tieren entsteht das Bild dunkler, verachteter Orte, an denen die Götzen enden.
theological_decisions:
- issue: Repräsentative Bedeutung von הָאָדָם
  choice: der Mensch im generischen Singular
  alternative: die Menschen / die Menschheit
  rationale: Der hebräische Singular wird formal bewahrt, ohne die Aussage auf einen bestimmten Mann einzuengen; „der Mensch“ kann im Deutschen die Menschheit repräsentieren.
- issue: Bedeutung von לְהִשְׁתַּחֲוֺת
  choice: sich vor ihnen niederwerfen
  alternative: sie anbeten
  rationale: Die konkrete Gebärde bleibt sichtbar, während ihre kultische Bedeutung aus dem Zusammenhang hervorgeht; so wird die Spannung zwischen körperlicher Handlung und religiöser Verehrung nicht eingeebnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit prophetisch-würdigem Ton. Der lange Satzbau folgt der Struktur des hebräischen Verses, bleibt aber durch die klare Stellung der Relativ- und Zwecksätze lesbar.
