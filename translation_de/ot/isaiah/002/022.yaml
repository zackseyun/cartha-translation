base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: de
  text: Verlasst euch nicht länger auf den Menschen[a], dessen Atem in seiner Nase ist. Denn was gilt er schon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Lasst ab vom Menschen.'
    reason: Dokumentiert die formal offenere Bedeutung der hebräischen Wendung hinter der kontextbezogenen Wiedergabe „Verlasst euch nicht länger“.
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: Verlasst euch nicht länger auf den Menschen
  rationale: Die hebräische Aufforderung bedeutet wörtlich etwa „Lasst ab vom Menschen“. Im Zusammenhang warnt sie davor, menschliche Macht und Größe zum Gegenstand des Vertrauens zu machen; die gewählte Formulierung gibt diesen Sinn in natürlichem modernem Deutsch wieder, ohne „vertrauen“ als ausdrücklich vorhandenes Verb auszugeben.
- source_word: נְשָׁמָה בְּאַפּוֹ
  choice: dessen Atem in seiner Nase ist
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten und betont die vergängliche, vom Atem abhängige Existenz des Menschen.
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  choice: Denn was gilt er schon?
  rationale: נחשב bezeichnet hier das Angesehen- oder Veranschlagtwerden. Die rhetorische Frage wird knapp und idiomatisch wiedergegeben; „schon“ vermittelt ihre abwertende Stoßrichtung, ohne einen bestimmten Maßstab wie Nutzen oder moralischen Wert festzulegen.
theological_decisions:
- issue: Warnung vor menschlichem Vertrauen oder allgemeiner Abwendung vom Menschen
  choice: Verlasst euch nicht länger auf den Menschen
  alternative: Lasst ab vom Menschen
  rationale: Der Kontext von Jesaja 2 stellt menschliche Selbstüberhebung und vermeintliche Sicherheit Gottes Erhabenheit gegenüber. Die Übersetzung benennt daher das sachlich gemeinte Sich-Verlassen, während die Fußnote die offenere wörtliche Form dokumentiert.
- issue: Bewertung des Menschen in der Schlussfrage
  choice: Was gilt er schon?
  alternative: Als was ist er zu achten? / Was ist er wert?
  rationale: Die Formulierung wahrt die rhetorische Geringschätzung menschlicher Größe, ohne den von Gott geschaffenen Menschen pauschal als wertlos zu erklären oder den Vers auf wirtschaftlichen „Wert“ zu verengen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die konkrete Metapher vom Atem in der Nase und die knappe rhetorische Schlussfrage bleiben erhalten.
