source:
  edition: WLC
  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: de
  text: Die hochmütigen Augen des Menschen werden erniedrigt[a], und der Stolz der Menschen wird erniedrigt. Jahwe allein wird an jenem Tag erhaben sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die stolzen Augen des Menschen werden erniedrigt.« Das hebräische Bild beschreibt Hochmut, der sich in einem erhobenen Blick zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: die hochmütigen Augen des Menschen
  rationale: Die Wendung bezeichnet wörtlich die »Augen der Hoheit des Menschen« und beschreibt menschlichen Hochmut, der sich im Blick und Auftreten zeigt. Die Übersetzung bewahrt das hebräische Augenbild und klingt zugleich natürlich.
- source_word: שָׁפֵל
  choice: werden gesenkt
  rationale: Das Prädikat bedeutet »niedrig sein/werden« beziehungsweise »erniedrigt werden«. Zusammen mit »Augen« erhält »gesenkt« das räumliche Bild und drückt zugleich Demütigung aus.
- source_word: וְשַׁח רוּם אֲנָשִׁים
  choice: und der Stolz der Menschen wird erniedrigt
  rationale: רוּם bezeichnet Höhe oder Erhabenheit und steht hier im Parallelismus für menschliche Selbstüberhebung; שׁח beschreibt deren Erniedrigung. »Stolz« gibt den Sinn in aktuellem Deutsch wieder, ohne den Kontrast zur Erhabenheit Jahwes aufzuheben.
- source_word: וְנִשְׂגַּב
  choice: wird erhaben sein
  rationale: 'Das Verb bezeichnet das Hoch- oder Erhabensein. Die stativische Wiedergabe ist grammatisch möglich und bewahrt den Gegensatz: Menschliche Höhe sinkt, Jahwe allein ist erhaben.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: 'Das Wort betont die Ausschließlichkeit: An jenem Tag ist allein Jahwe erhaben.'
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die feste prophetische Zeitangabe wird in natürlichem, gehobenem Deutsch wiedergegeben.
theological_decisions:
- issue: Bezug von אָדָם und אֲנָשִׁים
  choice: des Menschen … der Menschen
  alternative: der Menschheit … der Leute
  rationale: Der Wechsel vom generischen Singular zum Plural wird bewahrt. Im Zusammenhang gilt das Gericht menschlichem Hochmut allgemein und ist nicht auf Männer beschränkt.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« macht diesen Unterschied gegenüber einem bloßen Titel sichtbar.
- issue: Aspekt von וְנִשְׂגַּב
  choice: wird erhaben sein
  alternative: wird erhöht werden
  rationale: Die hebräische Form kann das Erhabensein beziehungsweise Erhöhtwerden ausdrücken. Die stativische Fassung vermeidet den möglichen Eindruck, Jahwe müsse erst durch einen anderen erhöht werden, ohne die sprachliche Spannung des Verses aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. »hochmütige Augen« und »gesenkt« erhalten die körperlich-räumliche Bildsprache; »Stolz« vermeidet eine unnatürliche deutsche Formulierung wie »die Höhe der Menschen«.
