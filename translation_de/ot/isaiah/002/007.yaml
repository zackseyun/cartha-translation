base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: de
  text: Sein Land ist voll von Silber und Gold, und seine Schätze nehmen kein Ende; sein Land ist voll von Pferden, und seine Streitwagen nehmen kein Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen die Besitzangaben durchgehend im Singular: „sein Land … seine Schätze … seine Streitwagen“. Wahrscheinlich ist damit das Volk oder die Nation als Einheit gemeint. Für „Schätze“ sind auch „Schatzkammern“ oder „Vorratshäuser“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: ist voll
  rationale: Das Verb מלא bezeichnet das Vollsein bzw. Vollwerden. Im Zusammenhang beschreibt die deutsche Präsensform natürlich den bestehenden Zustand; sie wird in beiden parallelen Vershälften gleich wiedergegeben.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: Der hebräische Text hat ein Suffix der 3. Person maskulin Singular. Die Einzahl wird bewahrt, obwohl sie wahrscheinlich kollektiv auf das Volk oder die Nation bezogen ist.
- source_word: כֶּסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die geläufige und poetisch passende Wiedergabe des Begriffspaars für Edelmetalle und Reichtum.
- source_word: וְאֵין קֵצֶה
  choice: nehmen kein Ende
  rationale: Eine natürliche deutsche Wiedergabe von wörtlich „und es gibt kein Ende“, die den Parallelismus beider Aussagen erhält.
- source_word: לְאֹצְרֹתָיו
  choice: seine Schätze
  rationale: אֹצָר kann Schatz, Vorrat, Schatzkammer oder Vorratshaus bedeuten. Zusammen mit Silber und Gold bezeichnet der Plural hier am ehesten angesammelte Reichtümer; die räumliche Lesart bleibt als Alternative in der Fußnote erhalten.
- source_word: סוּסִים
  choice: Pferden
  rationale: Direkte Wiedergabe des hebräischen Plurals; die Dativform wird durch die deutsche Verbindung „voll von“ verlangt.
- source_word: לְמַרְכְּבֹתָיו
  choice: seine Streitwagen
  rationale: מֶרְכָּבָה bezeichnet einen Wagen bzw. Streitwagen. In der Verbindung mit Pferden und im Kontext staatlicher Macht macht „Streitwagen“ die militärische Funktion im Deutschen deutlich, ohne eine fremde Deutung einzuführen.
theological_decisions:
- issue: Singularische Besitzangaben in einer kollektiv gemeinten Anklage
  choice: sein Land … seine Schätze … seine Streitwagen
  alternative: ihr Land … ihre Schätze … ihre Streitwagen
  rationale: Die hebräischen Suffixe stehen durchgehend in der 3. Person maskulin Singular. Diese Form wird beibehalten und nicht stillschweigend zum deutschen Plural geglättet; wahrscheinlich ist das Volk bzw. die Nation kollektiv gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur bildet den hebräischen Parallelismus ab; „nehmen kein Ende“ vermeidet zugleich eine schwerfällige wörtliche Konstruktion.
