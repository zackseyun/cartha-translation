  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: de
  text: Zieht, zieht durch die Tore! Räumt dem Volk den Weg frei! Schüttet die Straße auf, schüttet sie auf! Befreit sie von Steinen! Richtet über den Völkern ein Feldzeichen auf![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Richtet für die Völker ein Banner auf!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ בַּשְּׁעָרִים
  choice: Zieht hindurch, zieht durch die Tore
  rationale: Das wiederholte Imperativ עִבְרוּ wird als unmittelbare Bewegungsaufforderung wiedergegeben. Die leicht variierte deutsche Formulierung bewahrt die rhetorische Wiederholung und klingt zugleich natürlich.
- source_word: פַּנּוּ דֶּרֶךְ הָעָם
  choice: Räumt dem Volk den Weg frei
  rationale: Das Piel von פנה bezeichnet hier das Freimachen beziehungsweise Bereiten eines Weges. Die gewählte Formulierung ist idiomatisch und bewahrt הָעָם als singularisches Kollektiv.
- source_word: סֹלּוּ סֹלּוּ הַמְסִלָּה
  choice: Schüttet die Straße auf, schüttet sie auf
  rationale: סלל bezeichnet im Straßenbau das Aufschütten oder Anlegen einer erhöhten Straße. „Aufschütten“ erhält das konkrete Bild besser als das allgemeinere „bauen“; die Wiederholung bleibt erhalten.
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: Befreit sie von Steinen
  rationale: Das Verb bedeutet hier, Steine aus dem Weg zu räumen. Das Pronomen „sie“ nimmt die zuvor genannte Straße auf und ermöglicht eine natürliche deutsche Wiedergabe.
- source_word: הָרִימוּ נֵס
  choice: Richtet … ein Feldzeichen auf
  rationale: נֵס bezeichnet ein weithin sichtbares Signal- oder Sammelzeichen, häufig auf einer Stange. „Feldzeichen“ erhält diesen öffentlichen Signalcharakter; die mögliche Wiedergabe „Banner“ wird in der Fußnote genannt.
- source_word: עַל הָעַמִּים
  choice: über den Völkern
  rationale: Die räumliche Grundbedeutung von עַל wird bewahrt. Der Plural הָעַמִּים wird als „die Völker“ wiedergegeben und damit vom singularischen „Volk“ zuvor unterschieden.
theological_decisions:
- issue: Bezug von „dem Volk“ und „den Völkern“
  choice: Die Unterscheidung zwischen dem singularischen Volk und den pluralischen Völkern bleibt ausdrücklich erhalten.
  alternative: Beide Ausdrücke auf Israel oder beide allgemein auf sämtliche Nationen beziehen.
  rationale: Der hebräische Text wechselt bewusst von הָעָם im Singular zu הָעַמִּים im Plural. Die Übersetzung wahrt diesen Unterschied, ohne die jeweiligen Bezugsgruppen im Haupttext näher festzulegen.
- issue: Funktion des נֵס
  choice: Ein sichtbares Signal- und Sammelzeichen, wiedergegeben mit „Feldzeichen“.
  alternative: „Banner“ oder „Signal“; eine ausschließlich militärische oder messianisch spezifizierte Deutung.
  rationale: Der Kontext verlangt ein öffentlich sichtbares Zeichen, bestimmt aber seine konkrete Gestalt oder theologische Erfüllung nicht abschließend. Daher bleibt die Bildsprache offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit imperativischer Dringlichkeit. Die mehrfachen Wiederholungen des Hebräischen bleiben erhalten. „Straße aufschütten“ hält das antike Bild einer angelegten, erhöhten Straße fest; „Feldzeichen“ ist bewusst bildhaft, wird aber durch eine geläufigere Alternative in der Fußnote ergänzt.
