id: ISA.62.7
reference: Isaiah 62:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: de
  text: Und lasst ihm keine Ruhe[a], bis er Jerusalem fest gegründet hat und bis er es auf der Erde[b] zum Gegenstand des Lobes gemacht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und gebt ihm keine Stille“. Das hebräische Wort kann „Stille“, „Schweigen“ oder „Ruhe“ bedeuten; das Bild bezeichnet das unablässige Bitten zum HERRN.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Land“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: Und lasst ... keine
  rationale: Die Verbindung aus Konjunktion, Verneinung und נתן führt die Aufforderung aus dem vorigen Vers fort. Die deutsche Wendung „jemandem keine Ruhe lassen“ gibt den Sinn natürlich wieder.
- source_word: דֳמִי
  choice: Ruhe
  rationale: Das Substantiv kann Schweigen, Stille oder Ruhe bezeichnen. In der Verbindung mit נתן und dem indirekten Objekt ist „ihm keine Ruhe lassen“ im Deutschen idiomatisch und beschreibt das unablässige Bitten; die engere Bedeutung „Stille“ bleibt in einer Fußnote erhalten.
- source_word: לוֹ
  choice: ihm
  rationale: Das maskuline Singularsuffix verweist im unmittelbaren Zusammenhang auf den HERRN.
- source_word: עַד יְכוֹנֵן וְעַד יָשִׂים
  choice: bis er ... fest gegründet hat und bis er ... gemacht hat
  rationale: Das zweimalige עַד wird bewahrt. כון bezeichnet das feste Gründen oder Aufrichten, שׂים hier das Machen zu etwas.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens; beim zweiten Verb wird Jerusalem durch „es“ wieder aufgenommen.
- source_word: תְּהִלָּה
  choice: Gegenstand des Lobes
  rationale: Das Nomen bezeichnet Lob oder Ruhm. Die Formulierung macht im Deutschen verständlich, dass Jerusalem selbst weithin gepriesen werden soll, ohne den bildhaften Prädikatsausdruck in eine bloße Aussage über seinen Ruf aufzulösen.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der weitere Horizont der prophetischen Aussage spricht hier für „Erde“; „auf“ ist bei weltweiter räumlicher Geltung idiomatisches Deutsch.
theological_decisions:
- issue: Bezug von „ihm“
  choice: Das Pronomen bezieht sich auf den HERRN, den die Wächter unablässig anrufen sollen.
  alternative: Ein nicht näher bestimmter göttlicher oder himmlischer Adressat.
  rationale: In Jesaja 62,6 werden diejenigen angesprochen, die den HERRN erinnern und nicht schweigen sollen. Vers 7 setzt diese Aufforderung unmittelbar fort.
- issue: Jerusalem als „Gegenstand des Lobes“
  choice: Jerusalem wird durch Gottes Handeln zu etwas, das auf der Erde gepriesen wird.
  alternative: Jerusalem wird selbst zu einer Verkörperung oder Quelle des Lobpreises.
  rationale: Der prädikative Gebrauch von תְּהִלָּה lässt eine bildhafte Spannung zu. Die Übersetzung bewahrt das Lobmotiv, legt aber nicht fest, ob vor allem Jerusalems Ruhm oder eine umfassendere Funktion als Lobpreis gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lasst ihm keine Ruhe“ ist bewusst idiomatisch; die Wiederholung von „bis“ bewahrt den nachdrücklichen Parallelismus des Hebräischen. „Gegenstand des Lobes“ vermeidet die im Deutschen missverständliche Formulierung „zu einem Lobpreis“.
