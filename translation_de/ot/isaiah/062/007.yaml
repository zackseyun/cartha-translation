  source_fidelity: Die Übersetzung gibt die fortgesetzte Aufforderung, das maskuline Bezugspronomen, die zweimalige Zielbestimmung mit „bis“ sowie die beiden göttlichen Handlungen zuverlässig wieder. „Lasst ihm keine Ruhe“ trifft die idiomatische Aussage von אַל־תִּתְּנוּ דֳמִי לוֹ; „auf der Erde“ ist für בָּאָרֶץ in diesem prophetischen Kontext gut vertretbar.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „bis“ bildet den hebräischen Parallelismus klar ab. „Gegenstand des Lobes“ ist etwas erklärender als die Metapher „ein Lob“, verhindert jedoch die im Deutschen mögliche Missdeutung, Jerusalem selbst solle Lob darbringen.
  terminology: „Jerusalem“ und „HERRN“ sind konsistent und angemessen. Die Fußnoten bewahren die relevanten lexikalischen Alternativen bei דֳמִי und אֶרֶץ. Der Bezug von „ihm“ wird nicht im Text überinterpretiert und ist im Kontext sachgerecht erläutert.
