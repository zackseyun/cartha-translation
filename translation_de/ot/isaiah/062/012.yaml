  text: וְ/קָרְא֥וּ לָ/הֶ֛ם עַם הַ/קֹּ֖דֶשׁ גְּאוּלֵ֣י יְהוָ֑ה וְ/לָ/ךְ֙ יִקָּרֵ֣א דְרוּשָׁ֔ה עִ֖יר לֹ֥א נֶעֱזָֽבָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: de
  text: 'Und man wird sie nennen: »Das heilige Volk, die Erlösten Jahwes[a].« Und dich wird man nennen: »Die Gesuchte[b], eine Stadt, die nicht verlassen ist[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die von Jahwe Erlösten“ oder „Jahwes Erlöste“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Die Begehrte“, „Die Aufgesuchte“ oder „Die, nach der man fragt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „eine nicht verlassene Stadt“; gemeint sein kann ebenso „nicht aufgegeben“ oder „nicht im Stich gelassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: Und man wird sie nennen
  rationale: Die unbestimmte 3. Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben; ל markiert in dieser Namensformel die Benannten.
- source_word: עַם הַקֹּדֶשׁ
  choice: Das heilige Volk
  rationale: עַם bezeichnet hier ein Volk, und die bestimmte Form trägt den Charakter eines Ehrentitels.
- source_word: גְּאוּלֵי יְהוָה
  choice: die Erlösten Jahwes
  rationale: Die substantivierte passive Form bezeichnet die Erlösten; die Konstruktverbindung mit dem Gottesnamen bleibt als Genitiv bewusst mehrdeutig zwischen Zugehörigkeit und Urheberschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְלָךְ יִקָּרֵא
  choice: Und dich wird man nennen
  rationale: Die feminine Singularform richtet sich an die personifizierte Stadt Zion/Jerusalem. Die deutsche aktive Form mit unbestimmtem „man“ bewahrt die Verbindung zum ersten Satzteil.
- source_word: דְרוּשָׁה
  choice: Die Gesuchte
  rationale: Das passive Partizip von דרשׁ bedeutet „gesucht“ beziehungsweise „nach jemandem fragen/sich um jemanden kümmern“. Als Ehrentitel wird es substantiviert.
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: eine Stadt, die nicht verlassen ist
  rationale: Die attributive Aussage wird als natürlicher deutscher Relativsatz wiedergegeben und bewahrt den Gegensatz zum früheren Verlassensein Zions.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext; seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Mehrdeutigkeit von גְּאוּלֵי יְהוָה
  choice: die Erlösten Jahwes
  alternative: die von Jahwe Erlösten
  rationale: Der Genitiv kann Zugehörigkeit oder Jahwe als den Erlöser ausdrücken. Die gewählte Fassung lässt diese Beziehung offen, ohne den theologischen Sinn einzuengen.
- issue: Bedeutung des neuen Namens דְרוּשָׁה
  choice: Die Gesuchte
  alternative: Die Umsorgte
  rationale: „Die Gesuchte“ bleibt eng am passiven Partizip und lässt offen, ob das Suchen, Sich-Erkundigen oder fürsorgliche Zuwenden im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Namensformel wird durch die Wiederholung von „nennen“ erhalten; „man“ gibt das unbestimmte hebräische Pluralsubjekt idiomatisch wieder. Die femininen Titel beziehen sich auf die personifizierte Stadt.
