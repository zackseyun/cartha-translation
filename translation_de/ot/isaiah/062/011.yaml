source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: de
  text: 'Siehe, Jahwe hat es bis ans Ende der Erde verkündet: Sagt zur Tochter Zion: »Siehe, deine Rettung kommt![a] Siehe, sein Lohn ist bei ihm und seine Vergeltung geht vor ihm her.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Retter kommt«. Im Hebräischen steht »deine Rettung«; die folgenden Ausdrücke haben jedoch maskuline Pronomen (»sein Lohn … seine Vergeltung«), sodass die Rettung im kommenden Befreier personifiziert sein kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִשְׁמִיעַ
  choice: hat es … verkündet
  rationale: Der Hifil von שׁמע bezeichnet hier öffentliches Bekanntmachen; »verkündet« ist natürlich und bewahrt den deklarativen Charakter.
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: bis ans Ende der Erde
  rationale: Die singularische Form des Hebräischen bleibt erhalten; »bis ans« gibt die räumliche Reichweite idiomatisch wieder.
- source_word: לְבַת צִיּוֹן
  choice: zur Tochter Zion
  rationale: Bewahrt die poetische Personifikation Zions in einer im Deutschen verständlichen biblischen Wendung.
- source_word: יִשְׁעֵךְ
  choice: deine Rettung
  rationale: Gibt das Substantiv ישׁע unmittelbar wieder, ohne die durch die folgenden maskulinen Suffixe entstehende mögliche Personifizierung vorschnell als »Retter« festzulegen.
- source_word: בָּא
  choice: kommt
  rationale: Das Perfekt hat in der prophetischen Verkündigung gegenwärtig-zukünftige Kraft; »kommt« ist knapp und anschaulich.
- source_word: שְׂכָרוֹ
  choice: sein Lohn
  rationale: שׂכר bezeichnet Lohn oder Belohnung; »Lohn« ist prägnant und für den poetischen Zusammenhang geeignet.
- source_word: וּפְעֻלָּתוֹ
  choice: und seine Vergeltung
  rationale: פעלה kann hier die aufgrund einer Tat zustehende Gegenleistung bezeichnen; »Vergeltung« erhält die Unterscheidung von »Lohn«, ohne festzulegen, ob sie belohnend oder strafend ausfällt.
- source_word: לְפָנָיו
  choice: geht vor ihm her
  rationale: Die räumliche Wendung wird in natürlichem Deutsch wiedergegeben und bewahrt den Parallelismus zu »bei ihm«.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das dreimalige הִנֵּה ist ein emphatischer Aufmerksamkeitssignal; »Siehe« erhält den würdigen prophetisch-poetischen Ton.
theological_decisions:
- issue: Ob יִשְׁעֵךְ sachlich als »deine Rettung« oder persönlich als »dein Retter« wiederzugeben ist
  choice: deine Rettung
  alternative: dein Retter
  rationale: Die hebräische Form bedeutet lexikalisch »deine Rettung«. Die anschließenden maskulinen Suffixe können die Rettung im kommenden Befreier personifizieren. Der Haupttext bewahrt daher die grammatische Form, während die persönliche Deutung in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem »Siehe«. Die dreifache Wiederholung des hebräischen הִנֵּה bleibt erhalten; der Gottesname wird als »Jahwe« wiedergegeben.
