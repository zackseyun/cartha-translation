id: ISA.62.2
reference: Isaiah 62:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רָא֤וּ גוֹיִם֙ צִדְקֵ֔/ךְ וְ/כָל מְלָכִ֖ים כְּבוֹדֵ֑/ךְ וְ/קֹ֤רָא לָ/ךְ֙ שֵׁ֣ם חָדָ֔שׁ אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: de
  text: Die Völker werden deine Gerechtigkeit[a] sehen und alle Könige deine Herrlichkeit. Du wirst mit einem neuen Namen genannt werden, den der Mund Jahwes bestimmen wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Rechtfertigung“ oder „dein Recht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihn bestimmen“, wobei „ihn“ sich auf den neuen Namen bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: werden … sehen
  rationale: Die Verbform steht im prophetischen Zusammenhang und wird im Deutschen natürlich mit Zukunftsbezug wiedergegeben.
- source_word: גוֹיִם
  choice: die Völker
  rationale: Gemeint sind die Völker außerhalb Zions in ihrer Gesamtheit; „Völker“ bewahrt den internationalen Horizont und klingt im Deutschen natürlicher als „Nationen“.
- source_word: צִדְקֵךְ
  choice: deine Gerechtigkeit
  rationale: צֶדֶק kann Gerechtigkeit, Recht oder öffentliche Rechtfertigung bezeichnen. „Gerechtigkeit“ erhält die begriffliche und theologische Breite; die möglichen engeren Bedeutungen werden in der Fußnote genannt.
- source_word: וְכָל מְלָכִים
  choice: und alle Könige
  rationale: Die knappe Parallelstruktur des Hebräischen wird beibehalten; das Verb „sehen“ gilt auch für den zweiten Satzteil.
- source_word: כְּבוֹדֵךְ
  choice: deine Herrlichkeit
  rationale: „Herrlichkeit“ gibt die öffentliche, sichtbare Ehre und den Glanz Zions wieder und entspricht dem gewichtigen Sprachgebrauch von כָּבוֹד bei Jesaja.
- source_word: וְקֹרָא לָךְ
  choice: Du wirst … genannt werden
  rationale: Das Hebräische hat formal ein aktives Verb in der dritten Person Singular. Die deutsche Passivform gibt die Namensverleihung natürlich wieder, ohne den nicht ausdrücklich genannten Handelnden festzulegen.
- source_word: שֵׁם חָדָשׁ
  choice: mit einem neuen Namen
  rationale: Die Wendung bezeichnet eine neu verliehene Identität beziehungsweise Stellung, nicht lediglich eine andere Bezeichnung.
- source_word: אֲשֶׁר פִּי יְהוָה
  choice: den der Mund Jahwes
  rationale: Die ausdrückliche Metapher „Mund Jahwes“ bleibt erhalten und hebt hervor, dass der neue Name durch Gottes eigenes Wort festgelegt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: יִקֳּבֶנּוּ
  choice: bestimmen wird
  rationale: נקב bezeichnet hier das ausdrückliche Benennen oder Festlegen. „Bestimmen“ vermeidet im Deutschen eine schwerfällige Wiederholung von „nennen“ und bewahrt den Gedanken göttlicher Festsetzung.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקֵךְ bei der öffentlichen Wiederherstellung Zions
  choice: deine Gerechtigkeit
  alternative: deine Rechtfertigung; dein Recht
  rationale: Der Zusammenhang erlaubt sowohl moralisch-theologische Gerechtigkeit als auch Zions öffentlich sichtbare Rechtfertigung beziehungsweise die Wiederherstellung seines Rechts. Der Haupttext wahrt die größere Bedeutungsbreite, während die Fußnote die engeren Möglichkeiten offenhält.
- issue: Urheber des neuen Namens
  choice: Passivische Namensformel mit dem Mund Jahwes als der Instanz, die den Namen bestimmt
  alternative: Er wird dich mit einem neuen Namen nennen
  rationale: Das Subjekt des ersten Verbs ist im Hebräischen nicht ausdrücklich bezeichnet, während der Relativsatz die göttliche Herkunft des Namens hervorhebt. Die Passivform vermeidet eine vorschnelle Identifizierung und bewahrt zugleich den theologischen Schwerpunkt auf Jahwes wirksamem Wort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Parallelstruktur der hebräischen Poesie. Die feminine Anrede bezieht sich auf Zion. Die anthropomorphe Formulierung „der Mund Jahwes“ wurde bewusst nicht geglättet.
