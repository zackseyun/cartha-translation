  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: de
  text: Nicht länger wird man dich »Verlassen« nennen und dein Land nicht länger »Verödet«. Vielmehr wird man dich »Meine Freude ist an ihr«[a] nennen und dein Land »Verheiratet«[b]; denn Jahwe hat Freude an dir, und dein Land wird vermählt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Hephziba; der Name bedeutet »Meine Freude ist an ihr«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Beula; der Name bedeutet »Verheiratet«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: Verlassen
  rationale: Das feminine Partizip wird als bedeutungsvoller neuer beziehungsweise bisheriger Name Zions wiedergegeben; »Verlassen« bewahrt den passiven Sinn und passt zur personifizierten Stadt.
- source_word: שְׁמָמָה
  choice: Verödet
  rationale: Die Bezeichnung beschreibt den verwüsteten Zustand des Landes. »Verödet« ist im Deutschen als prädikative Namensbezeichnung verständlich und wahrt die Parallelität zu »Verlassen«.
- source_word: חֶפְצִי בָהּ
  choice: Meine Freude ist an ihr
  rationale: Der semantisch transparente Namenssatz wird übersetzt, damit das Wortspiel mit חָפֵץ im folgenden Begründungssatz erkennbar bleibt.
- source_word: בְּעוּלָה
  choice: Verheiratet
  rationale: Die feminine Form bezeichnet innerhalb der ausdrücklich ehelichen Metaphorik eine verheiratete Frau beziehungsweise ein verheiratetes Land; die direkte Wiedergabe erhält das Bild.
- source_word: חָפֵץ
  choice: hat Freude an
  rationale: Diese Wendung bildet im Deutschen die lexikalische Verbindung zu »Meine Freude ist an ihr« ab und gibt das Wohlgefallen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird direkt und in der im Deutschen geläufigen Form wiedergegeben.
- source_word: תִּבָּעֵל
  choice: wird verheiratet sein
  rationale: Das Nifal von בעל wird als eheliches Passiv verstanden und korrespondiert mit בְּעוּלָה. Die Formulierung bewahrt die ungewöhnliche, auf das Land bezogene Heiratsmetapher.
- source_word: לָךְ / אַרְצֵךְ
  choice: dich / dein Land
  rationale: Die feminine Anrede des personifizierten Zion und das dazugehörige Land bleiben als aufeinander bezogene, aber unterschiedene Größen erhalten.
theological_decisions:
- issue: Bedeutungsübersetzung der symbolischen Namen oder bloße Transliteration
  choice: Die Namen werden im Haupttext nach ihrer Bedeutung übersetzt.
  alternative: Hephziba und Beula transliterieren.
  rationale: Die hebräischen Bezeichnungen sind durchsichtig und tragen die Aussage der Umbenennung. Ihre Übersetzung erhält die rhetorische und theologische Funktion; die traditionellen Formen stehen in Fußnoten.
- issue: Ehemetapher für das Land
  choice: Die Ehemetaphorik wird ausdrücklich beibehalten.
  alternative: Allgemeiner von Wiederherstellung, Bewohnung oder Besitz sprechen.
  rationale: Sowohl בְּעוּלָה als auch תִּבָּעֵל verwenden eheliche Sprache. Eine Abschwächung würde das konkrete Bild und seine Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die als Namen gebrauchten Zustandsbezeichnungen stehen in deutschen Anführungszeichen. Die wiederholte Eheterminologie bleibt bewusst erhalten, obwohl sie beim Land ungewöhnlich klingt, da diese Auffälligkeit zum hebräischen Bild gehört.
