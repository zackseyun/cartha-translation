  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: de
  text: Doch[a] diejenigen, die es einbringen, werden es essen und Jahwe loben; diejenigen, die ihn einsammeln, werden ihn in den Höfen meines Heiligtums[b] trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn diejenigen, die es einbringen, werden es essen.“ Das hebräische כִּי kann auch „denn“ oder „ja“ bedeuten; wegen des Gegensatzes zum vorigen Vers wird es hier mit „doch“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Höfen meines heiligen Ortes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die Konjunktion kann „denn“, „ja“ oder kontextuell adversativ „doch/aber“ bedeuten. Der Gegensatz zu Vers 8 spricht hier für „Doch“, ohne die lexikalische Alternative zu verschweigen.
- source_word: מְאַסְפָיו
  choice: die, die es einbringen
  rationale: Das Partizip von אסף bezeichnet diejenigen, die den Ertrag sammeln beziehungsweise einbringen. Das Pronomen bezieht sich im Kontext auf das zuvor genannte Getreide.
- source_word: יֹאכְלֻהוּ
  choice: werden es essen
  rationale: Die Imperfektform bezeichnet hier die zugesagte künftige Handlung; das Objektsuffix nimmt den eingebrachten Ertrag auf.
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: und Jahwe loben
  rationale: הלל im Piel bedeutet gewöhnlich „loben“; die koordinierte deutsche Form teilt sich idiomatisch das Futurhilfsverb mit „essen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der göttliche Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמְקַבְּצָיו
  choice: und die, die ihn einsammeln
  rationale: Das Partizip von קבץ steht parallel zu אסף und bezeichnet das Sammeln beziehungsweise Einbringen. Das maskuline Pronomen verweist kontextuell auf den in Vers 8 genannten Wein.
- source_word: יִשְׁתֻּהוּ
  choice: werden ihn trinken
  rationale: שתה ist das gewöhnliche Verb für „trinken“; das maskuline Objektsuffix lässt sich im Deutschen passend auf „Wein“ beziehen.
- source_word: בְּחַצְרוֹת
  choice: in den Vorhöfen
  rationale: חצרות bezeichnet Höfe oder Vorhöfe; „Vorhöfe“ ist im Zusammenhang mit einem Heiligtum natürlich und bewahrt die kultische Raumvorstellung.
- source_word: קָדְשִׁי
  choice: meines Heiligtums
  rationale: קֹדֶשׁ mit dem Suffix der ersten Person Singular ist bei den genannten Vorhöfen konkret als Gottes heiliger Ort beziehungsweise Heiligtum zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Räumliche oder abstrakte Deutung von קָדְשִׁי
  choice: meines Heiligtums
  alternative: meiner Heiligkeit / meines heiligen Ortes
  rationale: Die Verbindung mit „Vorhöfen“ legt eine konkrete heilige Stätte nahe. „Heiligtum“ bewahrt die Tempelvorstellung, ohne deren genaue bauliche Ausgestaltung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „die, die“ erhält die parallelen hebräischen Partizipialgruppen und bleibt allgemein verständlich. Die unterschiedlichen deutschen Pronomen „es“ und „ihn“ machen die kontextuellen Bezüge auf Getreide und Wein transparent.
