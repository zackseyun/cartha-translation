  source_fidelity: Der Entwurf gibt die futurische prophetische Anrede der 2. Person feminin Singular angemessen wieder. „Krone der Pracht“ bewahrt die hebräische Genitivverbindung עֲטֶרֶת תִּפְאֶרֶת, und die beiden unterschiedlichen Ausdrücke יָד („Hand“) und כַּף („Handfläche“) bleiben sinnvoll unterschieden. „Jahwe“ entspricht dem expliziten Gottesnamen יהוה; „deines Gottes“ gibt אֱלֹהָיִךְ korrekt wieder. Der zweite Bildausdruck bleibt konkret als Turban erhalten und wird nicht mit der Krone nivelliert.
