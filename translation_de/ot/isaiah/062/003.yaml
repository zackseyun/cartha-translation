source:
  edition: WLC
  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: de
  text: Du wirst eine Krone der Pracht in der Hand Jahwes sein und ein königlicher Turban[a] in der Handfläche deines Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein königlicher Kopfschmuck“ beziehungsweise „ein Diadem der Königswürde“. Das hebräische Wort bezeichnet einen gewundenen Kopfschmuck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: Du wirst … sein
  rationale: Das Qal-Perfekt der 2. Person feminin Singular hat im prophetischen Zusammenhang Zukunftsbedeutung. Die feminine Anrede an Zion beziehungsweise Jerusalem bleibt im Deutschen durch den Kontext erkennbar.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: eine Krone der Pracht
  rationale: Die Wiedergabe bewahrt die hebräische Status-constructus-Verbindung und lässt תִּפְאֶרֶת seine Bedeutung zwischen Schönheit, Pracht und Herrlichkeit behalten.
- source_word: בְּיַד
  choice: in der Hand
  rationale: Die konkrete räumlich-metaphorische Darstellung kostbaren Besitzes wird beibehalten und nicht zu einer abstrakten Aussage über Macht umgedeutet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְצָנִיף מְלוּכָה
  choice: und ein königlicher Turban
  rationale: צָנִיף bezeichnet einen gewundenen Kopfschmuck; „Turban“ erhält das konkrete Bild und unterscheidet es von der zuvor genannten Krone. מְלוּכָה wird hier natürlich attributiv mit „königlich“ wiedergegeben.
- source_word: בְּכַף
  choice: in der Handfläche
  rationale: כַּף bezeichnet genauer die Handfläche beziehungsweise die hohle Hand. Die Übersetzung erhält damit die poetische Variation gegenüber יָד („Hand“).
- source_word: אֱלֹהָיִךְ
  choice: deines Gottes
  rationale: Die Form mit dem Suffix der 2. Person feminin Singular bezeichnet hier Israels einen Gott und führt die direkte Anrede Zions fort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt im Deutschen den persönlichen Bundesnamen, anstatt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bildsprache von Krone und Turban
  choice: Beide konkreten Bilder bleiben nebeneinander stehen
  alternative: Beide Ausdrücke zu einem allgemeinen königlichen Schmuckstück angleichen
  rationale: Der Parallelismus beschreibt Zion sowohl als Krone als auch als königlichen Kopfschmuck. Die Übersetzung löst die bildhafte Spannung nicht auf und deutet nicht näher aus, in welchem Sinn Zion in Gottes Hand gehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst konkreter Bildsprache. „Krone der Pracht“ und „Handfläche“ folgen der poetischen Form des Hebräischen, ohne sie erklärend zu glätten. Der Fußnotenmarker wurde beim Ausdruck „Turban“ gesetzt, auf den sich die lexikalische Alternative tatsächlich bezieht.
