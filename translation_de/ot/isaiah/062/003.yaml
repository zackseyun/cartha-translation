  terminology: „Jahwe“, „Krone der Pracht“, „königlicher Turban“ und „Handfläche“ sind terminologisch konsistent und quellentreu. Der Fußnotenanker steht unmittelbar bei „Turban“ und die Anmerkung bietet passende lexikalische Alternativen, ohne den Text übermäßig zu interpretieren.
