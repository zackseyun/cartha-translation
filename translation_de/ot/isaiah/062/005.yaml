  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: de
  text: Denn wie ein junger Mann eine Jungfrau heiratet, so werden deine Söhne[a] dich heiraten; und wie ein Bräutigam sich über seine Braut freut, so wird dein Gott sich über dich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer alternativen Lesung, die sich in einigen alten Übersetzungen widerspiegelt und von vielen Auslegern vertreten wird: „so werden deine Erbauer dich heiraten“. Die masoretische Vokalisierung liest „deine Söhne“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל / יִבְעָלוּךְ
  choice: heiratet / werden … heiraten
  rationale: Das Verb bezeichnet in diesem Heiratsbild das Eingehen einer Ehe. „Heiraten“ gibt den Sinn natürlich wieder und bewahrt durch die Wiederholung den Zusammenhang beider Satzteile.
- source_word: בָּחוּר
  choice: junger Mann
  rationale: Gemeint ist hier ein heiratsfähiger junger Mann; eine militärische Bedeutung ist im Kontext nicht angezeigt.
- source_word: בְּתוּלָה
  choice: Jungfrau
  rationale: Die Wiedergabe bewahrt die lexikalische Bestimmtheit des hebräischen Ausdrucks im Heiratsvergleich.
- source_word: בָּנָיִךְ
  choice: deine Söhne
  rationale: Der masoretisch vokalisierte Text lautet „deine Söhne“. Die ungewöhnliche Metapher wird nicht stillschweigend geglättet; die alternative Lesung wird in einer Fußnote genannt.
- source_word: חָתָן / כַּלָּה
  choice: Bräutigam / Braut
  rationale: Diese geläufigen deutschen Begriffe entsprechen dem Heiratsbild und dem gehobenen poetischen Register.
- source_word: יָשִׂישׂ
  choice: wird sich freuen
  rationale: Das Verb drückt intensive Freude aus. „Sich freuen“ ist im modernen Standarddeutsch natürlich und nimmt den Vergleich klar auf.
- source_word: אֱלֹהָיִךְ
  choice: dein Gott
  rationale: אֱלֹהִים bezeichnet hier mit singularischem Bezug den Gott Zions; auch das zugehörige Verb steht im Singular.
- source_word: כִּי
  choice: Denn wie … so
  rationale: כִּי leitet hier einen begründenden Vergleich ein. Die deutsche Korrespondenz „wie … so“ bildet die poetische Logik deutlich ab.
theological_decisions:
- issue: Ob בָּנָיִךְ als „deine Söhne“ oder nach einer alternativen Lesung als „deine Erbauer“ wiederzugeben ist
  choice: deine Söhne
  alternative: deine Erbauer
  rationale: Die masoretische Vokalisierung bietet „deine Söhne“. Obwohl das Bild von Söhnen, die die personifizierte Mutterstadt heiraten, ungewöhnlich ist, bleibt es verständlich und darf nicht ohne zwingenden textkritischen Grund ersetzt werden. Die alte und verbreitete Alternativlesung wird wegen ihres Gewichts in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener poetischer Parallelstruktur. Das bewusst befremdliche Bild des masoretischen Textes bleibt im Haupttext stehen; die Fußnote macht die bedeutende textkritische Alternative transparent.
