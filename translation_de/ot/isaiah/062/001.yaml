id: ISA.62.1
reference: Isaiah 62:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: de
  text: Um Zions willen werde ich nicht schweigen, und um Jerusalems willen werde ich nicht ruhen[a], bis ihre Gerechtigkeit[b] hervortritt wie heller Schein und ihr Heil wie eine Fackel brennt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich nicht still sein“. Das hebräische Verb kann still oder ruhig sein sowie ruhen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Rechtfertigung“. Das hebräische Wort kann Gerechtigkeit im moralischen und bundesbezogenen Sinn oder öffentliche Rechtfertigung beziehungsweise Rehabilitation bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Der Sprecher wird in diesem Vers nicht ausdrücklich genannt. Deutungen verstehen darunter den Propheten, den HERRN oder eine andere repräsentative Stimme.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: um … willen
  rationale: Gibt Motivation bzw. Zweck wieder und bewahrt den poetischen Parallelismus zwischen Zion und Jerusalem.
- source_word: אֶחֱשֶׁה
  choice: werde ich nicht schweigen
  rationale: Direkte, natürliche Wiedergabe von חשׁה mit futurisch-voluntativem Sinn.
- source_word: אֶשְׁקוֹט
  choice: werde ich nicht ruhen
  rationale: שׁקט kann still oder ruhig sein sowie ruhen bedeuten. „Nicht ruhen“ drückt hier das unablässige Eintreten für Jerusalem natürlich aus; die Alternative wird in einer Fußnote bewahrt.
- source_word: יֵצֵא
  choice: hervortritt
  rationale: Gibt das Heraus- bzw. Sichtbarwerden idiomatisch wieder, ohne das Bild durch „hervorbrechen“ unnötig zu verstärken.
- source_word: כַנֹּגַהּ
  choice: wie heller Schein
  rationale: נֹגַהּ bezeichnet Helligkeit oder Lichtglanz; „heller Schein“ ist verständlich und legt das Bild nicht speziell auf die Morgenröte fest.
- source_word: צִדְקָהּ
  choice: ihre Gerechtigkeit
  rationale: Bewahrt die moralische und bundestheologische Bedeutungsbreite von צדקה; im Zusammenhang ist auch öffentliche Rechtfertigung bzw. Rehabilitation möglich.
- source_word: וִישׁוּעָתָהּ
  choice: ihr Heil
  rationale: „Heil“ gibt die umfassende Rettung und Wiederherstellung von ישועה würdig und knapp wieder.
- source_word: כְלַפִּיד יִבְעָר
  choice: wie eine Fackel brennt
  rationale: Folgt dem konkreten Bild einer brennenden Fackel und vermeidet eine zusätzliche Intensivierung wie „lodert“.
theological_decisions:
- issue: Identität der sprechenden Ich-Stimme
  choice: Im Text nicht ausdrücklich bestimmt
  alternative: Der Prophet, der HERR oder eine repräsentative Wächterstimme wird ausdrücklich als Sprecher benannt
  rationale: Der hebräische Vers nennt den Sprecher nicht. Die Übersetzung behält daher die erste Person ohne interpretierende Identifikation bei.
- issue: Bedeutung von צִדְקָהּ
  choice: ihre Gerechtigkeit
  alternative: ihre Rechtfertigung bzw. Rehabilitation
  rationale: Das Wort kann sowohl Gerechtigkeit im moralischen bzw. bundesbezogenen Sinn als auch öffentlich sichtbare Rechtfertigung bezeichnen. Der Haupttext bewahrt den Grundbegriff, die kontextuelle Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus. „Um … willen“ und „ihr Heil“ tragen den poetisch-prophetischen Ton, bleiben aber für heutige Leser verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
