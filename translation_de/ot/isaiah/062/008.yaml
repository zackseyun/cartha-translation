  naturalness: „Deinen Feinden zu essen geben“ klingt im modernen Standarddeutsch missverständlich, als würden die Feinde unmittelbar gefüttert. „Deinen Feinden als Nahrung geben“ ist idiomatisch und klar. „Neuen Wein“ ist zudem die im Deutschen geläufigere Entsprechung von תירוש als „jungen Wein“.
  terminology: „Jahwe“ ist eine angemessene Wiedergabe von יהוה. „Starker Arm“ bewahrt die Metapher und die Bedeutung von עֹז. „Neuer Wein“ erhält die Unterscheidung von תירוש gegenüber Wein im Allgemeinen, ohne die im Deutschen ungewohnte Formulierung „junger Wein“ zu wählen.
