  text: נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: de
  text: 'Jahwe hat bei seiner rechten Hand und bei seinem starken Arm geschworen: Nie wieder werde ich dein Getreide deinen Feinden als Nahrung geben,[a] und nie wieder werden Fremde[c] deinen neuen Wein trinken, für den du dich abgemüht hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn ich dein Getreide noch einmal … gebe und wenn … deinen neuen Wein trinken“ – eine hebräische Schwurformel, in der „wenn“ eine nachdrückliche Verneinung ausdrückt: „Ganz gewiss nicht.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Söhne der Fremde“, das heißt Menschen fremder Herkunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נִשְׁבַּע
  choice: hat ... geschworen
  rationale: Das Nifal-Perfekt bezeichnet den vollzogenen Schwur; das deutsche Perfekt klingt natürlich und bewahrt dessen feierliche Kraft.
- source_word: בִּימִינוֹ
  choice: bei seiner rechten Hand
  rationale: Entspricht der hebräischen Schwurformel und bezeichnet die rechte Hand als Bürgschaft des Schwurs.
- source_word: וּבִזְרֹעַ עֻזּוֹ
  choice: und bei seinem starken Arm
  rationale: Bewahrt die konkrete Körpermetapher und gibt עֹז unmittelbar mit „stark“ wieder; „mächtigen Arm“ ist ebenfalls möglich.
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  choice: Nie wieder werde ich ... und nie wieder werden ...
  rationale: Nach der Schwurformel tragen die mit אִם eingeleiteten Sätze idiomatisch die Kraft einer nachdrücklichen Verneinung; עוֹד wird durch „wieder“ erfasst.
- source_word: דְּגָנֵךְ
  choice: dein Getreide
  rationale: Natürliche und genaue Bezeichnung für das geerntete Korn beziehungsweise die Getreideerzeugnisse.
- source_word: מַאֲכָל לְאֹיְבַיִךְ
  choice: deinen Feinden zu essen
  rationale: Gibt die Zielbestimmung von מַאֲכָל mit der ל-Konstruktion im Deutschen flüssig und sinngetreu wieder.
- source_word: בְנֵי נֵכָר
  choice: Fremde
  rationale: Die wörtliche Wendung „Söhne der Fremde“ bezeichnet Menschen fremder Herkunft; „Fremde“ ist im Deutschen knapp und natürlich.
- source_word: תִּירוֹשֵׁךְ
  choice: deinen jungen Wein
  rationale: תִּירוֹשׁ bezeichnet frischen beziehungsweise jungen Wein und wird so von Wein im allgemeinen Sinn unterschieden.
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: für den du dich abgemüht hast
  rationale: Bewahrt den Gedanken mühevoller Arbeit und den Rückbezug des maskulinen Singulars auf den jungen Wein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Unausgesprochene Verneinung in der Schwurformel mit אִם
  choice: Die starke Verneinung wird ausdrücklich mit „Nie wieder“ wiedergegeben.
  alternative: 'Wörtlich: „Wenn ich ... gebe, und wenn ... trinken“'
  rationale: Im Hebräischen ist die angedrohte Folge des Schwurbruchs ausgelassen. Eine wörtliche Wenn-Konstruktion wäre im Deutschen missverständlich; die ausdrückliche Verneinung vermittelt die tatsächliche Aussagekraft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Schwurformel bleibt konkret; die idiomatisch unausgesprochene Verneinung wird für heutige Leser ausdrücklich gemacht. Marker [a] und [c] stehen jeweils direkt bei der betreffenden Formulierung; ein Marker [b] wird nicht verwendet, da die Alternative „mächtiger Arm“ ohne notwendige Fußnote in den lexikalischen Entscheidungen dokumentiert ist.
