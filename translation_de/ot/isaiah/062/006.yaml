  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: de
  text: Auf deine Mauern, Jerusalem, habe ich Wächter gestellt. Den ganzen Tag und die ganze Nacht, unablässig, werden sie nicht schweigen. Ihr, die ihr Jahwe erinnert[a], gönnt euch keine Ruhe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr Jahwe anruft“ oder „die ihr Jahwe in Erinnerung bringt“. Der hebräische Ausdruck ist ungewöhnlich anschaulich und beschreibt den beharrlichen Appell an Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: deine Mauern
  rationale: חוֹמָה bezeichnet die Stadt- oder Befestigungsmauer. „Mauern“ ist im Deutschen natürlich und bewahrt die direkte Anrede Jerusalems.
- source_word: הִפְקַדְתִּי
  choice: habe ich … gestellt
  rationale: Das Hifil von פקד bedeutet hier, jemanden einzusetzen oder an einem Ort zu postieren. In Verbindung mit Wächtern gibt „gestellt“ sowohl Beauftragung als auch Positionierung knapp und idiomatisch wieder.
- source_word: שֹׁמְרִים
  choice: Wächter
  rationale: Das Partizip von שמר bezeichnet Personen, die Wache halten. „Wächter“ bewahrt das Bild von Menschen auf den Stadtmauern, ohne ihre genauere Identität festzulegen.
- source_word: כָּל הַיּוֹם וְכָל הַלַּיְלָה תָּמִיד
  choice: Den ganzen Tag und die ganze Nacht, unablässig
  rationale: Die Wiedergabe aller drei Zeitelemente erhält die hebräische Verstärkung einer ohne Unterbrechung ausgeübten Tätigkeit.
- source_word: לֹא יֶחֱשׁוּ
  choice: werden sie nicht schweigen
  rationale: חשה bedeutet schweigen oder still sein. Das negierte Imperfekt bezeichnet hier das fortdauernde Nichtschweigen der Wächter.
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: die ihr Jahwe erinnert
  rationale: Das Hifil-Partizip von זכר bedeutet wörtlich, jemanden erinnern beziehungsweise etwas in Erinnerung bringen. Die ungewöhnlich kühne Formulierung wird bewahrt, statt sie deutend auf „anrufen“ oder „erwähnen“ zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַל דֳּמִי לָכֶם
  choice: gönnt euch keine Ruhe
  rationale: דֳּמִי kann Schweigen, Stille oder Ruhe bezeichnen. Mit לָכֶם fordert die Wendung die Angeredeten idiomatisch dazu auf, in ihrem beharrlichen Appell nicht innezuhalten.
theological_decisions:
- issue: Identität der „Wächter“ und derer, die Jahwe erinnern
  choice: Die bildhafte Bezeichnung bleibt ohne nähere Identifizierung stehen.
  alternative: Deutung als Engelwächter, Propheten, Priester oder betende Fürbitter
  rationale: Der hebräische Text legt nicht ausdrücklich fest, wer mit diesen Gruppen gemeint ist. Die Übersetzung bewahrt daher die theologische Offenheit.
- issue: Gott „erinnern“
  choice: Die auffällige Aussage, Jahwe werde erinnert, wird wörtlich und verständlich wiedergegeben.
  alternative: „Jahwe anrufen“ oder „Jahwe in Erinnerung bringen“
  rationale: Die Formulierung beschreibt einen beharrlichen Appell an Gott, ohne zu erklären, Gott habe etwas tatsächlich vergessen. Eine glättende Wiedergabe würde die Spannung des hebräischen Bildes abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Zeitangabe bleibt zur Wahrung des hebräischen Nachdrucks bewusst leicht redundant. Der kurze Ausruf am Ende gibt den mahnenden Charakter des hebräischen Verbots wieder.
