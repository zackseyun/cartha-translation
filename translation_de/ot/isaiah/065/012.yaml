  to: Ich werde euch dem Schwert zuweisen[a], und ihr alle werdet euch zur Schlachtung niederbeugen[b], denn ich rief, und ihr antwortetet nicht; ich redete, und ihr hörtet nicht zu[c]. Ihr tatet, was in meinen Augen böse war, und wähltet, woran ich keinen Gefallen hatte[d].
  rationale: Die Revision korrigiert die syntaktische Reichweite von „denn/weil“ entsprechend dem Hebräischen, glättet die moderne deutsche Formulierung bei שׁמע und präzisiert die historische Referenz in Fußnote a. Die Aussage über Gottes Gericht, das Bild des Niederbeugens und die lexikalische Offenheit von שׁמע und חפץ bleiben erhalten.
