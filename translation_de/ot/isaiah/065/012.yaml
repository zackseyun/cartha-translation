base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: de
  text: Ich werde euch dem Schwert zuweisen[a], und ihr alle werdet euch zur Schlachtung niederbeugen[b], denn ich rief, und ihr antwortetet nicht; ich redete, und ihr hörtet nicht zu[c]. Ihr tatet, was in meinen Augen böse war, und wähltet, woran ich keinen Gefallen hatte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ich werde euch für das Schwert bestimmen“ oder „Ich werde euch für das Schwert zählen“. Das hebräische Verb erlaubt zugleich ein Wortspiel mit Meni, der in Vers 11 genannten Gottheit des Schicksals.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ihr werdet zur Schlachtung niederknien“ oder, im Sinn des Zusammenhangs, „zusammensinken“. Das hebräische Verb bezeichnet wörtlich das Beugen der Knie; hier zeichnet es den Zusammenbruch im Gericht.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „ihr hörtet nicht“ oder sinngemäß „ihr gehorchtet nicht“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „was ich nicht wollte“ oder „woran ich keine Freude hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: Ich werde ... bestimmen
  rationale: Das Verb מנה bezeichnet hier ein Bestimmen oder Zuweisen und nimmt wahrscheinlich in einem Wortspiel den Namen des Schicksalsgottes מְנִי aus Vers 11 auf. Die Zukunftsform gibt den im Zusammenhang zukunftsbezogenen prophetischen Perfektwert wieder.
- source_word: לַחֶרֶב
  choice: für das Schwert
  rationale: Die Formulierung bewahrt die gerichtliche Bildsprache und verbindet sich im Deutschen natürlich mit „bestimmen“.
- source_word: לַטֶּבַח
  choice: zur Schlachtung
  rationale: טֶבַח bezeichnet das Schlachten beziehungsweise die Tötung; „zur Schlachtung“ erhält den Parallelismus mit dem Schwert.
- source_word: תִּכְרָעוּ
  choice: werdet euch ... niederbeugen
  rationale: כרע bezeichnet konkret das Beugen der Knie oder Sich-Niederbeugen. Im Zusammenhang ist der Zusammenbruch unter dem Gericht gemeint, doch die Übersetzung bewahrt zunächst das körperliche Bild.
- source_word: יַעַן
  choice: weil
  rationale: Die Konjunktion leitet den Grund für das angekündigte Gericht ein.
- source_word: קָרָאתִי ... וְלֹא עֲנִיתֶם
  choice: ich rief und ihr nicht antwortetet
  rationale: Die direkte Entsprechung von Rufen und Antworten erhält den knappen Parallelismus.
- source_word: דִּבַּרְתִּי ... וְלֹא שְׁמַעְתֶּם
  choice: ich redete und ihr nicht hörtet
  rationale: שמע kann auch „zuhören“ oder „gehorchen“ bedeuten. „Hören“ wahrt hier die Parallelität zum Reden und lässt die darin enthaltene Verweigerung des Gehorsams mitschwingen, ohne sie festzuschreiben.
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Ihr tatet, was böse war in meinen Augen
  rationale: Die geläufige hebräische Bewertungsformel wird bildnah und zugleich verständlich wiedergegeben.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: und wähltet, woran ich keinen Gefallen hatte
  rationale: חפץ umfasst Gefallen, Freude und Verlangen. „Keinen Gefallen haben“ bewahrt die persönliche und wertende Dimension, ohne sie auf bloßen Willen oder bloßes Gefühl einzuengen.
theological_decisions:
- issue: Aktive Rolle Gottes im angekündigten Gericht
  choice: „Ich werde euch für das Schwert bestimmen“
  alternative: „Ich werde euch dem Schwert überlassen“
  rationale: Der hebräische Wortlaut stellt Gottes gerichtliches Bestimmen aktiv dar. „Überlassen“ würde diese Aussage abschwächen; die Übersetzung erweitert sie jedoch nicht zu einer allgemeinen Lehre über Vorherbestimmung.
- issue: Bedeutung von שמע
  choice: „hörtet“
  alternative: „gehorchtet“ oder „hörtet auf mich“
  rationale: Der Zusammenhang mit Gottes Reden trägt zwar eine Gehorsamsdimension, doch „hören“ erhält die lexikalische Offenheit und den parallelen Aufbau.
- issue: Bild des Niederbeugens vor der Schlachtung
  choice: Das konkrete Bild bleibt im Haupttext erhalten.
  alternative: „Ihr werdet unter dem Gericht zusammenbrechen“
  rationale: Eine deutende Wiedergabe würde die Gerichtswirkung erklären, aber das anschauliche und möglicherweise bewusst demütigende Bild des Kniebeugens beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Härte. Die wiederholte Satzstruktur bildet den hebräischen Parallelismus nach. „Schlachtung“ ist ungewohnt scharf, entspricht aber der Gerichtssprache des Ausgangstextes; die Fußnoten sichern lexikalische Mehrdeutigkeiten.
