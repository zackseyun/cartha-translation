source:
  edition: WLC
  text: אֲשֶׁ֨ר הַ/מִּתְבָּרֵ֜ךְ בָּ/אָ֗רֶץ יִתְבָּרֵךְ֙ בֵּ/אלֹהֵ֣י אָמֵ֔ן וְ/הַ/נִּשְׁבָּ֣ע בָּ/אָ֔רֶץ יִשָּׁבַ֖ע בֵּ/אלֹהֵ֣י אָמֵ֑ן כִּ֣י נִשְׁכְּח֗וּ הַ/צָּרוֹת֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/כִ֥י נִסְתְּר֖וּ מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: de
  text: Wer sich im Land[a] Segen zuspricht[b], wird dies im Namen des Gottes der Treue[c] tun; und wer im Land schwört, wird bei dem Gott der Treue schwören. Denn die früheren Nöte sind vergessen, und sie sind meinen Augen verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sich segnet“; möglich ist auch: „sich gesegnet nennt“. Das hebräische Verb steht in reflexiver Form.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Gott der Wahrheit“ oder formnah „Gott des Amen“. Das hebräische אָמֵן umfasst Festigkeit, Verlässlichkeit, Treue und Wahrheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: wer
  rationale: Leitet einen unbestimmten Relativsatz mit allgemeiner Bedeutung ein; „wer“ ist im Deutschen natürlich und prägnant.
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: sich Segen zuspricht / wird es … tun
  rationale: Der Hitpael ist reflexiv. „Sich Segen zusprechen“ bewahrt diese Bedeutung verständlicher als das im heutigen Deutsch ungewohnte „sich segnen“.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. „Land“ ist hier die zurückhaltendere Wiedergabe; die weitere Bedeutung bleibt in der Fußnote erhalten.
- source_word: בֵּאלֹהֵי אָמֵן
  choice: unter Berufung auf den Gott der Treue / beim Gott der Treue
  rationale: Das ungewöhnliche אָמֵן bezeichnet hier Beständigkeit, Verlässlichkeit und Wahrheit. „Gott der Treue“ ist im Deutschen verständlich und bewahrt den personalen Aspekt der Verlässlichkeit; die Alternativen werden in der Fußnote genannt.
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: wer schwört / wird schwören
  rationale: Der Niphal von שׁבע bezeichnet hier das Schwören beziehungsweise Ablegen eines Eides.
- source_word: כִּי
  choice: weil
  rationale: Die beiden Vorkommen führen die Begründung ein; die Wiederholung von „weil“ bewahrt die parallele Struktur.
- source_word: נִשְׁכְּחוּ
  choice: vergessen sind
  rationale: Das Perfekt beschreibt einen eingetretenen und fortbestehenden Zustand.
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: die früheren Nöte
  rationale: צָרוֹת bezeichnet Bedrängnisse oder Nöte; „frühere Nöte“ ist gewichtig, aber in modernem Deutsch natürlich.
- source_word: נִסְתְּרוּ מֵעֵינָי
  choice: vor meinen Augen verborgen sind
  rationale: Die bildhafte, anthropomorphe Ausdrucksweise des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Bedeutung des Gottesepithetons בֵּאלֹהֵי אָמֵן
  choice: der Gott der Treue
  alternative: der Gott der Wahrheit; der Gott des Amen
  rationale: אָמֵן bündelt die Bedeutungen Festigkeit, Verlässlichkeit, Treue und Wahrheit. Die Hauptfassung gibt den Ausdruck verständlich als „Gott der Treue“ wieder, ohne ihn auf bloße sachliche Wahrheit zu verengen; die ungewöhnlichere formnahe Wiedergabe bleibt in der Fußnote sichtbar.
- issue: Räumlicher Umfang von בָּאָרֶץ
  choice: im Land
  alternative: auf der Erde
  rationale: Der Zusammenhang lässt sowohl eine auf das Land bezogene als auch eine weltweite Lesart zu. Die Hauptfassung wählt die engere Bedeutung, ohne die weitere Möglichkeit auszuschließen.
- issue: Reflexive Segensformel
  choice: sich Segen zusprechen und sich dabei auf Gott berufen
  alternative: sich segnen; sich gesegnet nennen
  rationale: Die Form ist reflexiv und bezeichnet nicht einfach, dass jemand von einem anderen gesegnet wird. Die Formulierung wahrt sowohl den Selbstbezug als auch die Anrufung Gottes, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas erklärende Wendung „unter Berufung auf“ macht die Funktion der hebräischen Präposition bei der Segensformel verständlich und hält zugleich die Parallelität zum Schwören bei Gott aufrecht. Die beiden Begründungssätze und das Bild „vor meinen Augen“ bleiben bewusst erhalten.
