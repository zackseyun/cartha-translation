source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: de
  text: Wolf und Lamm werden gemeinsam weiden,[a] und der Löwe wird Stroh fressen wie das Rind; Staub wird die Nahrung der Schlange sein.[b] Auf meinem ganzen heiligen Berg wird man weder Böses tun noch Verderben anrichten,[c] spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wolf und Zicklein“; das hebräische Wort kann allgemein ein junges Tier aus dem Kleinvieh bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Dass die Schlange Staub frisst, erinnert wahrscheinlich an 1. Mose 3,14.
    reason: cross_reference
  - marker: c
    text: 'Oder: „wird man keinen Schaden zufügen und nichts zerstören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב וְטָלֶה
  choice: Wolf und Lamm
  rationale: „Wolf“ ist die übliche Wiedergabe von זְאֵב. טָלֶה bezeichnet ein junges Tier aus dem Kleinvieh; „Lamm“ wahrt hier am natürlichsten den Kontrast zwischen Raubtier und verletzlichem Beutetier.
- source_word: יִרְעוּ כְאֶחָד
  choice: werden gemeinsam weiden
  rationale: רעה bezeichnet das Weiden, כְאֶחָד das gemeinsame Handeln „wie eines“; „gemeinsam weiden“ ist im Deutschen natürlich und bewahrt das Friedensbild.
- source_word: וְאַרְיֵה כַּבָּקָר יֹאכַל תֶּבֶן
  choice: und der Löwe wird Stroh fressen wie das Rind
  rationale: בָּקָר kann kollektiv Rinder beziehungsweise Rindvieh bezeichnen. Im generischen Vergleich klingt der Singular „das Rind“ im Deutschen natürlicher; תֶּבֶן wird konkret mit „Stroh“ wiedergegeben.
- source_word: וְנָחָשׁ עָפָר לַחְמוֹ
  choice: Staub wird die Nahrung der Schlange sein
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann aber allgemein Nahrung bezeichnen. „Nahrung“ ergibt idiomatisches Deutsch, während „Schlange“ den möglichen Anklang an Genesis 3,14 ausreichend erhält.
- source_word: לֹא יָרֵעוּ וְלֹא יַשְׁחִיתוּ
  choice: wird man Böses tun oder Verderben anrichten
  rationale: Die nicht ausdrücklich genannten Subjekte bleiben im Deutschen durch das unpersönliche „man“ offen. יָרֵעוּ kann sowohl moralisches Bösestun als auch Schädigen ausdrücken; „Böses tun“ erhält diese Breite, während „Verderben anrichten“ die zerstörerische Bedeutung von שׁחת wiedergibt.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: nirgends auf meinem ganzen heiligen Berg
  rationale: Die vorangestellte Ortsangabe verbindet die beiden Verneinungen idiomatisch mit dem gesamten Bereich des heiligen Berges. „Auf“ ist im Deutschen bei einem Berg natürlich, und „ganzen“ bewahrt die umfassende Aussage von כָּל.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Botenformel wird würdig und knapp wiedergegeben; der Eigenname יהוה erscheint transparent als „Jahwe“.
theological_decisions:
- issue: Möglicher Rückbezug der Schlangenaussage auf Genesis 3,14
  choice: Die Schlange und der Staub bleiben ohne erklärende Erweiterung im Haupttext stehen.
  alternative: Die Aussage ausdrücklich als Fortdauer des Fluchs aus Genesis 3 deuten.
  rationale: Der Anklang ist wahrscheinlich, doch Jesaja 65,25 formuliert die theologische Beziehung nicht ausdrücklich. Die Übersetzung bewahrt deshalb den intertextuellen Nachhall, ohne ihn dogmatisch festzulegen.
- issue: Referent der pluralischen Verben יָרֵעוּ und יַשְׁחִיתוּ
  choice: Unpersönliche Wiedergabe mit „man“
  alternative: 'Die zuvor genannten Tiere ausdrücklich zum Subjekt machen: „Sie werden …“'
  rationale: Das Hebräische nennt in diesem Satz kein neues Subjekt. Die Verben können die geschilderten Tiere aufgreifen, aber auch allgemeiner alle Bewohner des heiligen Berges umfassen. „Man“ bewahrt diese Offenheit.
- issue: Semantische Spannung in לֹא יָרֵעוּ
  choice: „Böses tun“ im Haupttext, mit Hinweis auf „Schaden zufügen“ in der Fußnote
  alternative: Ausschließlich „Schaden zufügen“ übersetzen.
  rationale: Der Hiphil von רעע kann schädigendes Handeln bezeichnen und zugleich moralische Färbung tragen. Die Hauptfassung erhält die weitere Bedeutung, die Fußnote macht die kontextuell naheliegende Alternative sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Futur bildet die verheißende Ausrichtung ab. Die Zeichensetzung gliedert die drei Tierbilder und die abschließende Friedensaussage klar; alle Fußnotenmarker stehen unmittelbar bei den betreffenden Textstellen.
