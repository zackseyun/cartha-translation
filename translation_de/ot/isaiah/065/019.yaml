base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: de
  text: Ich werde in Jerusalem jubeln und mich an meinem Volk freuen[a]. Nie mehr wird man in ihr[b] Weinen oder Schreie der Not[c] hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „über Jerusalem“ und „über mein Volk“. Die hebräische Präposition bedeutet wörtlich „in“, kann hier aber auch den Bezug oder Anlass der Freude bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „in ihr“; das weibliche Pronomen bezieht sich auf Jerusalem.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Klagegeschrei“ oder „Aufschrei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: Ich werde … jubeln
  rationale: גיל bezeichnet freudiges Jubeln oder Frohlocken. „Jubeln“ gibt die kräftige Freude wieder und lässt sich vom folgenden שׂושׂ sprachlich unterscheiden. Der Zukunftsbezug ergibt sich trotz der hebräischen Perfektform aus dem Zusammenhang der angekündigten Neuschöpfung.
- source_word: בִירוּשָׁלִַם
  choice: über Jerusalem
  rationale: Die Präposition ב kann hier den Bezug beziehungsweise Anlass der Freude bezeichnen. Im Deutschen ist „über Jerusalem jubeln“ natürlicher und inhaltlich klarer als das rein örtlich klingende „in Jerusalem jubeln“.
- source_word: וְשַׂשְׂתִּי
  choice: und mich … freuen
  rationale: שׂושׂ bezeichnet freudiges Sichfreuen. Die Wiedergabe mit „sich freuen“ bewahrt gegenüber dem stärkeren „jubeln“ eine erkennbare, aber nicht überzeichnete Abstufung.
- source_word: בְעַמִּי
  choice: über mein Volk
  rationale: Auch hier kennzeichnet ב am wahrscheinlichsten den Gegenstand der Freude. „Sich über mein Volk freuen“ ist im modernen Deutsch idiomatisch.
- source_word: יִשָּׁמַע
  choice: wird man … hören
  rationale: Der hebräische Nifal ist passiv („wird gehört werden“). Die unpersönliche deutsche Form mit „man“ gibt denselben Sinn natürlicher wieder.
- source_word: בָּהּ
  choice: in ihr
  rationale: Das feminine Singularpronomen bezieht sich auf Jerusalem. „In ihr“ bewahrt die im Hebräischen angelegte Darstellung der Stadt als weiblich.
- source_word: עוֹד
  choice: nie mehr
  rationale: 'In Verbindung mit der Verneinung bezeichnet עוֹד das endgültige Aufhören: „nicht mehr“. „Nie mehr“ entspricht dem nachdrücklichen Verheißungscharakter des Satzes.'
- source_word: קוֹל בְּכִי
  choice: Weinen
  rationale: Wörtlich steht „Stimme/Laut des Weinens“. Im Deutschen bezeichnet „Weinen hören“ denselben akustischen Vorgang ohne eine schwerfällige Nominalfügung.
- source_word: וְקוֹל זְעָקָה
  choice: oder Hilfeschreie
  rationale: זְעָקָה bezeichnet einen lauten Schrei, häufig aus Not und als Ruf um Hilfe. „Hilfeschreie“ unterscheidet diesen Ausdruck klar vom vorausgehenden Weinen; das wiederholte קוֹל wird im flüssigen deutschen Satz nicht eigens wiedergegeben.
theological_decisions:
- issue: Jerusalem als Bezugsgröße der göttlichen Freude
  choice: „über Jerusalem“ und „über mein Volk“
  alternative: „in Jerusalem“ und „an meinem Volk“
  rationale: Die Präposition ב lässt eine örtliche beziehungsweise relationale Nuance zu. Der deutsche Text versteht beide Wendungen als Bezeichnung dessen, worüber Gott sich freut, ohne die im Hebräischen mögliche Nuance zu verschweigen.
- issue: Weibliches Pronomen für Jerusalem
  choice: „in ihr“
  alternative: „dort“ oder „in der Stadt“
  rationale: Das feminine Pronomen des Hebräischen wird beibehalten. So bleibt die literarische Darstellung Jerusalems als weiblich erhalten, ohne zusätzliche theologische Aussagen einzutragen.
- issue: Zwei verwandte Verben für Gottes Freude
  choice: „jubeln“ und „sich freuen“
  alternative: beide Verben gleich mit „sich freuen“ wiedergeben
  rationale: Die unterschiedliche Wiedergabe bewahrt die poetische Fülle der beiden verwandten, aber nicht identischen hebräischen Verben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Freude Gottes wird durch „jubeln“ und „sich freuen“ differenziert wiedergegeben. Der zweite Satz ist gegenüber der hebräischen Nominalstruktur behutsam geglättet, bewahrt aber das akustische Bild und den Gegensatz zwischen Weinen und Schreien aus Not.
