  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: de
  text: Ihr werdet euren Namen meinen Erwählten als Fluch hinterlassen[a], und Yahweh, der Herr, wird dich töten; seinen Dienern aber wird er einen anderen Namen geben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Schwur«; gemeint ist wahrscheinlich, dass ihr Name in einer ausgesprochenen Fluchformel verwendet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seinen Dienern wird er einen anderen Namen rufen«; gemeint ist, dass er ihnen einen anderen Namen gibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנַּחְתֶּם
  choice: ihr werdet … hinterlassen
  rationale: Das Hifil von נוח bezeichnet hier, zusammen mit »Name«, das Zurücklassen für einen späteren Gebrauch. »Hinterlassen« ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: שִׁמְכֶם
  choice: euren Namen
  rationale: Die direkte Wiedergabe erhält sowohl die Bezeichnung als auch den Gedanken des fortlebenden Rufs der Angesprochenen.
- source_word: לִשְׁבוּעָה
  choice: als Fluchwort
  rationale: שְׁבוּעָה bedeutet grundsätzlich »Schwur«, bezeichnet in diesem Gerichtszusammenhang aber wahrscheinlich eine beim Schwören gebrauchte Fluchformel. »Fluchwort« gibt diese konkrete Funktion verständlich wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: לִבְחִירַי
  choice: meinen Erwählten
  rationale: Die substantivierte Mehrzahl mit Suffix wird im Deutschen knapp und idiomatisch als »meinen Erwählten« wiedergegeben.
- source_word: וֶהֱמִיתְךָ
  choice: wird dich töten
  rationale: Das Hifil von מות ist kausativ. Der Wechsel vom vorherigen Plural zum singularischen »dich« wird entsprechend dem Hebräischen bewahrt.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Beide Elemente des hebräischen Gottesnamens werden wiedergegeben: der Titel אֲדֹנָי als »Herr« und der Eigenname יהוה als »Yahweh«.'
- source_word: וְלַעֲבָדָיו
  choice: seine Diener aber
  rationale: »Diener« bezeichnet hier Menschen, die Gott angehören und ihm dienen; ein rechtlicher Sklavenstatus steht nicht im Vordergrund. »Aber« macht den sachlichen Gegensatz zum Gericht über die zuvor Angesprochenen deutlich.
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: wird er mit einem anderen Namen nennen
  rationale: Die Formulierung bleibt nahe beim Verb קרא, klingt im Deutschen aber verständlicher als das ganz wörtliche »einen anderen Namen rufen«. Die mögliche Deutung als Namensverleihung wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr; der Herr JHWH
  rationale: »Yahweh« gibt den im Ausgangstext ausdrücklich stehenden Bundesnamen als Namen wieder, während אֲדֹנָי mit »Herr« übersetzt wird.
- issue: Bedeutung von לִשְׁבוּעָה
  choice: als Fluchwort
  alternative: als Schwur; zur Schwurformel
  rationale: Der Gerichtskontext legt nahe, dass der zurückgelassene Name in einer verwünschenden Schwurformel gebraucht wird. Die Übersetzung macht diese Funktion sichtbar, ohne die lexikalische Grundbedeutung in der Fußnote zu verschweigen.
- issue: Bezeichnung der עֲבָדִים Gottes
  choice: Diener
  alternative: Sklaven; Knechte
  rationale: Im unmittelbaren Gegensatz geht es um Zugehörigkeit und Dienst für Gott. »Diener« ist dafür im modernen Standarddeutsch natürlich und legt keinen hier nicht hervorgehobenen sozialen Status fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällige Wechsel von »ihr/euer« zum singularischen »dich« ist bewusst erhalten. Das Semikolon verdeutlicht den Gegensatz zwischen dem Gericht über die Angesprochenen und der neuen Benennung der Diener, ohne die Satzstruktur unnötig auszubauen.
