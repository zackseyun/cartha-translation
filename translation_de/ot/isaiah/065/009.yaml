  text: וְ/הוֹצֵאתִ֤י מִֽ/יַּעֲקֹב֙ זֶ֔רַע וּ/מִ/יהוּדָ֖ה יוֹרֵ֣שׁ הָרָ֑/י וִ/ירֵשׁ֣וּ/הָ בְחִירַ֔/י וַ/עֲבָדַ֖/י יִשְׁכְּנוּ שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: de
  text: Und ich werde aus Jakob Nachkommen[a] hervorgehen lassen und aus Juda einen Erben meiner Berge. Meine Erwählten werden es in Besitz nehmen[b], und meine Diener werden dort wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Samen“. Das hebräische Wort זֶרַע ist ein kollektiver Singular und kann „Samen“, „Nachkommenschaft“ oder „Nachkommen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden es erben“. Im Hebräischen steht hier derselbe Wortstamm wie bei „Erben“; er verbindet Erbschaft und Besitznahme miteinander. Das Verb hat ein feminines Singularsuffix, obwohl zuvor von „meinen Bergen“ im Plural die Rede ist; sein genauer Bezug bleibt offen.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Und ich werde … hervorgehen lassen
  rationale: Der Hifil von יצא ist kausativ. „Hervorgehen lassen“ gibt das Hervorbringen von Nachkommen natürlich und quellennah wieder.
- source_word: מִיַּעֲקֹב זֶרַע
  choice: aus Jakob Nachkommen
  rationale: מן bezeichnet den Ursprung; זֶרַע ist ein kollektiver Singular und meint hier Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch klarer als „Samen“.
- source_word: וּמִיהוּדָה יוֹרֵשׁ
  choice: und aus Juda einen Erben
  rationale: יוֹרֵשׁ ist ein Partizip von ירש und bezeichnet jemanden, der erbt beziehungsweise Besitz ergreift. „Erbe“ bewahrt die Verbindung zum folgenden Verb desselben Stammes.
- source_word: הָרָי
  choice: meiner Berge
  rationale: Der masoretische Text bietet den Plural „meine Berge“. Die konkrete geografische Bildsprache bleibt erhalten.
- source_word: וִירֵשׁוּהָ
  choice: werden sie in Besitz nehmen
  rationale: ירש kann „erben“ oder „in Besitz nehmen“ bedeuten. Das feminine Singularsuffix verweist grammatisch auffällig auf die zuvor pluralischen „Berge“; im Deutschen wird der sachliche Bezug mit „sie“ wiedergegeben.
- source_word: בְחִירַי
  choice: meine Erwählten
  rationale: Die substantivierte Pluralform bezeichnet die von Gott Erwählten. Die Formulierung ist würdevoll und hält den textlichen Sinn offen, ohne ihn konfessionell auszudeuten.
- source_word: וַעֲבָדַי
  choice: meine Diener
  rationale: עבד kann Diener oder Sklave bezeichnen; im Verhältnis zu Gott ist „Diener“ hier die natürliche kontextuelle Wiedergabe.
- source_word: יִשְׁכְּנוּ שָׁמָּה
  choice: werden dort wohnen
  rationale: שכן bezeichnet beständiges Wohnen oder Sich-Niederlassen. „Dort wohnen“ ist klar, gegenwärtig und würdevoll.
theological_decisions:
- issue: Bezug von „meine Berge“ und die Verheißung des Erbes
  choice: Die konkrete territoriale Aussage „meine Berge“ bleibt stehen.
  alternative: Als allgemeines Land oder ausschließlich als geistlich-eschatologischen Segen deuten.
  rationale: Der hebräische Text nennt ausdrücklich Gottes Berge. Die Übersetzung bewahrt sowohl die geografische Bildwelt als auch die Verknüpfung von Erbe und Besitz, ohne die weitere theologische Erfüllung festzulegen.
- issue: Wiederholung des Stammes ירש
  choice: „einen Erben“ und „in Besitz nehmen“
  alternative: „einen Besitzer“ und „erben“ oder an beiden Stellen eine identische deutsche Wortwurzel verwenden.
  rationale: Die beiden Bedeutungsaspekte Erben und tatsächliche Besitznahme werden im Deutschen idiomatisch abgebildet; eine Fußnote macht die hebräische Wortwiederholung sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem hebräischen Parallelismus. „Nachkommen“ vermeidet das im heutigen Deutsch missverständliche „Samen“, während die Fußnote die Bild- und Kollektivbedeutung dokumentiert. Alle Fußnotenmarker stehen im Haupttext.
