  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: de
  text: Sie werden sich nicht vergeblich abmühen und keine Kinder für das Unheil[a] gebären; denn sie sind die Nachkommen der von Jahwe Gesegneten, und ihre Nachkommen sind bei ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Schrecken“ oder „für plötzliches Verderben“. Das hebräische Wort kann Bestürzung, Schrecken oder plötzlich hereinbrechendes Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיגְעוּ
  choice: sich abmühen
  rationale: Das Verb bezeichnet mühevolle, anstrengende Arbeit. „Sich abmühen“ gibt diesen Aspekt im modernen Deutschen natürlich wieder.
- source_word: לָרִיק
  choice: vergeblich
  rationale: רִיק bezeichnet Leere beziehungsweise Ergebnislosigkeit. Im Zusammenhang mit Arbeit drückt „vergeblich“ idiomatisch aus, dass die Mühe ohne Ertrag bleibt.
- source_word: יֵלְדוּ
  choice: Kinder gebären
  rationale: ילד bezeichnet hier das Hervorbringen von Nachkommen. „Kinder gebären“ ist verständlich und wahrt den unmittelbaren Bezug zu Geburt und Familie.
- source_word: לַבֶּהָלָה
  choice: für das Unheil
  rationale: בֶּהָלָה kann Schrecken, Bestürzung oder plötzlich hereinbrechendes Verderben bezeichnen. „Unheil“ passt zum Ergebniszusammenhang, während die Fußnote die weiteren Nuancen bewahrt.
- source_word: זֶרַע
  choice: die Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet aber häufig Nachkommenschaft. „Nachkommen“ ist hier in modernem Deutsch klar und sachgerecht.
- source_word: בְּרוּכֵי יְהוָה
  choice: der von Jahwe Gesegneten
  rationale: Die Konstruktion bezeichnet Menschen, die von Jahwe gesegnet sind. Die Formulierung bewahrt sowohl den passiven Sinn als auch den Gottesnamen.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: und ihre Nachkommen
  rationale: צֶאֱצָאִים bezeichnet Abkömmlinge oder Nachkommen. Die Wiederholung von „Nachkommen“ ist im Deutschen verständlich und erhält den generationenübergreifenden Gedanken.
- source_word: אִתָּם
  choice: bei ihnen
  rationale: Die Präposition bezeichnet Gemeinschaft beziehungsweise Gegenwart. „Bei ihnen“ lässt offen, ob besonders das Zusammenleben oder allgemeiner die bleibende Verbundenheit gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בְּרוּכֵי יְהוָה
  choice: Nachkommen der von Jahwe Gesegneten
  alternative: eine von Jahwe gesegnete Nachkommenschaft
  rationale: Die Formulierung folgt der naheliegenden Genitivkonstruktion „Nachkommen der Gesegneten Jahwes“ und unterscheidet die angesprochene Generation von ihren anschließend genannten eigenen Nachkommen, ohne die alternative attributive Deutung dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verbformen und der generationenübergreifende Aufbau bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck לַבֶּהָלָה.
