source:
  edition: WLC
  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: de
  text: 'die sagen: »Bleib für dich und komm mir nicht nahe, denn ich bin heiliger als du!«[a] Diese sind Rauch in meiner Nase, ein Feuer, das den ganzen Tag brennt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ich bin dir zu heilig«, oder: »denn ich habe mich von dir heilig gehalten«. Die hebräische Wendung ist schwierig; sie drückt den Anspruch kultischer oder moralischer Überlegenheit aus.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: die sagen
  rationale: Das substantivisch gebrauchte Partizip setzt die Beschreibung der zuvor genannten Menschen fort; der Relativsatz ist im Deutschen natürlich und knapp.
- source_word: קְרַב אֵלֶיךָ
  choice: Bleib für dich
  rationale: Die wörtlich ungewöhnliche Verbindung bezeichnet hier eine abweisende Aufforderung, Abstand zu halten. Die Formulierung bewahrt den Gedanken selbstgewählter Absonderung.
- source_word: אַל תִּגַּשׁ בִּי
  choice: komm mir nicht nahe
  rationale: נגשׁ mit ב bezeichnet die Annäherung an eine Person. Die Wiedergabe bleibt nahe am konkreten Bild und klingt in modernem Deutsch natürlich.
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: denn ich bin heiliger als du
  rationale: Die schwierige, verdichtete Wendung beansprucht im Zusammenhang kultische oder moralische Überlegenheit. Die gewählte Fassung gibt diesen hochmütigen Anspruch verständlich wieder; andere mögliche Deutungen werden in der Fußnote bewahrt.
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das Demonstrativpronomen verweist unmittelbar auf die eben beschriebenen Menschen zurück.
- source_word: עָשָׁן בְּאַפִּי
  choice: Rauch in meiner Nase
  rationale: אַף bezeichnet konkret Nase beziehungsweise Nasenloch und kann zugleich Zorn anklingen lassen. Das anschauliche Bild des ständig reizenden Rauchs wird nicht zu einer abstrakten Aussage verflacht.
- source_word: אֵשׁ יֹקֶדֶת
  choice: ein Feuer, das … brennt
  rationale: Der deutsche Relativsatz gibt das hebräische Partizip natürlich wieder und erhält das Bild fortdauernden Brennens.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche deutsche Wiedergabe der Zeitangabe mit dem Sinn anhaltender Provokation.
theological_decisions:
- issue: Deutung von כִּי קְדַשְׁתִּיךָ
  choice: denn ich bin heiliger als du
  alternative: denn ich bin dir zu heilig; denn ich habe mich von dir heilig gehalten
  rationale: Die hebräische Form ist syntaktisch schwierig und lässt mehrere Deutungen zu. Im Zusammenhang prahlen die Sprecher mit religiöser Absonderung und Überlegenheit. Die Hauptfassung macht diesen Anspruch verständlich, ohne ihn zu bestätigen; die Fußnote erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt scharf und abweisend; das konkrete Bild vom Rauch in Gottes Nase wird bewusst beibehalten.
