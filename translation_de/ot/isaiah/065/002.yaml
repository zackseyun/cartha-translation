id: ISA.65.2
reference: Isaiah 65:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: de
  text: Den ganzen Tag streckte ich meine Hände aus[a] nach einem widerspenstigen Volk[b], das einen Weg geht, der nicht gut ist, und seinen eigenen Gedanken folgt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielt ich meine Hände ausgestreckt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufsässigen“ oder „hartnäckigen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „seinen eigenen Plänen“ beziehungsweise „Vorhaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: streckte ich … aus
  rationale: Das Piel von פרשׂ bezeichnet hier das Ausbreiten oder Ausstrecken. Die konkrete körperliche Geste bleibt erhalten, ohne sie bereits als Bitte, Einladung oder Klage auszudeuten.
- source_word: יָדַי
  choice: meine Hände
  rationale: Die hebräische Form ist dual beziehungsweise plural mit Suffix der 1. Person Singular; der Plural bewahrt das anschauliche Bild.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die geläufige deutsche Wendung gibt die fortdauernde Handlung über den gesamten Tag natürlich wieder.
- source_word: אֶל
  choice: nach
  rationale: In Verbindung mit „die Hände ausstrecken“ bezeichnet „nach“ im Deutschen auf natürliche Weise die Ausrichtung auf das Volk hin.
- source_word: עַם
  choice: Volk
  rationale: Der Ausdruck bezeichnet hier eine gemeinschaftlich angesprochene Menschengruppe und wird mit dem üblichen deutschen Äquivalent wiedergegeben.
- source_word: סוֹרֵר
  choice: widerspenstig
  rationale: Das Wort bezeichnet hartnäckigen Widerstand beziehungsweise Auflehnung. „Widerspenstig“ bewahrt die moralische und relationale Aussage, ohne sie auf politischen Aufruhr zu verengen.
- source_word: הַהֹלְכִים
  choice: das … geht
  rationale: Das Partizip beschreibt die kennzeichnende Lebensführung des Volkes. „Einen Weg gehen“ erhält die Wegmetapher in verständlichem Deutsch.
- source_word: הַדֶּרֶךְ
  choice: einen Weg
  rationale: Die Wiedergabe bewahrt das Bild des Weges als Ausdruck der Lebensführung und passt idiomatisch zum Verb „gehen“.
- source_word: לֹא טוֹב
  choice: der nicht gut ist
  rationale: Die Negation von „gut“ wird unmittelbar wiedergegeben und nicht zum stärkeren „böse“ oder „gottlos“ zugespitzt.
- source_word: אַחַר
  choice: folgt
  rationale: In Verbindung mit der beschriebenen Lebensführung bezeichnet אַחַר ein Sich-richten-nach beziehungsweise Folgen.
- source_word: מַחְשְׁבֹתֵיהֶם
  choice: seinen eigenen Gedanken
  rationale: מַחְשָׁבוֹת kann Gedanken, Pläne oder Vorhaben bezeichnen. „Gedanken“ ist die direkteste Wiedergabe; „eigenen“ macht den possessiven und selbstbestimmten Charakter im Deutschen deutlich.
theological_decisions:
- issue: Gottes Haltung gegenüber einem ungehorsamen Volk
  choice: Das anthropomorphe Bild „meine Hände ausstrecken“ bleibt als konkrete, anhaltende Geste stehen.
  alternative: 'Dynamischer: „Ich wandte mich immer wieder an sie“ oder „Ich hielt ihnen meine Hände entgegen“.'
  rationale: Der hebräische Text deutet die Geste nicht vollständig aus. Die bildhafte Wiedergabe erhält die Spannung zwischen Gottes anhaltender Zuwendung und dem Widerstand des Volkes.
- issue: Moralische Bewertung des Weges des Volkes
  choice: לֹא טוֹב wird mit „nicht gut“ übersetzt.
  alternative: „böse“, „schlecht“ oder „nicht recht“.
  rationale: Die Übersetzung folgt der ausdrücklich negierten Bezeichnung „gut“ und vermeidet eine stärkere moraltheologische Festlegung, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Weg- und Körpermetaphorik. Der Satzbau ist flüssig, ohne die parallelen Aussagen des Hebräischen einzuebnen; „nicht gut“ erhält bewusst die zurückhaltende Formulierung des Ausgangstextes.
