  source_fidelity: 'Der Text gibt die hebräische Aussage vollständig und ohne sachliche Zusätze wieder: פֵּרַשְׂתִּי יָדַי ist treffend als „streckte ich meine Hände aus“ wiedergegeben, כָּל־הַיּוֹם als „den ganzen Tag“, und אֶל durch die im Deutschen bei dieser Geste idiomatische Verbindung „ausstrecken nach“. „Widerspenstigen Volk“ deckt סוֹרֵר angemessen ab. Die Wegmetapher, die zurückhaltende Wertung „nicht gut“ und das Folgen der eigenen Gedanken bleiben erhalten.'
  naturalness: 'Der Satz ist flüssiges modernes Standarddeutsch und wahrt zugleich einen würdigen prophetischen Registerton. Die Konstruktionen „die Hände nach ... ausstrecken“, „einen Weg gehen“ und „seinen Gedanken folgen“ sind idiomatisch. Die Satzbezüge sind klar: Das Volk geht einen nicht guten Weg und folgt seinen eigenen Gedanken.'
