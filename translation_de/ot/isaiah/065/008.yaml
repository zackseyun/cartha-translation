  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כַּ/אֲשֶׁ֨ר יִמָּצֵ֤א הַ/תִּירוֹשׁ֙ בָּֽ/אֶשְׁכּ֔וֹל וְ/אָמַר֙ אַל תַּשְׁחִיתֵ֔/הוּ כִּ֥י בְרָכָ֖ה בּ֑/וֹ כֵּ֤ן אֶֽעֱשֶׂה֙ לְמַ֣עַן עֲבָדַ֔/י לְ/בִלְתִּ֖י הַֽשְׁחִ֥ית הַ/כֹּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: de
  text: 'So spricht Jahwe: Wie wenn sich in einer Traube neuer Wein findet[a] und jemand sagt: »Verdirb ihn nicht, denn ein Segen ist in ihm«, so werde ich um meiner Diener willen handeln, um nicht alles zu vernichten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »frischer Wein«. Das hebräische Wort bezeichnet neuen beziehungsweise frischen Wein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »um nicht alles zu vernichten«. Gemeint sein kann auch: »um sie nicht alle zu vernichten«; im Hebräischen bleibt der genaue Bezug unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche prophetische Botenformel bewahrt den feierlichen, aber verständlichen Stil.
- source_word: כַּאֲשֶׁר
  choice: Wie wenn
  rationale: Die Formulierung eröffnet den Vergleich, dessen Anwendung mit כֵּן folgt.
- source_word: תִּירוֹשׁ
  choice: neuer Wein
  rationale: Der Ausdruck bezeichnet frischen beziehungsweise neuen Wein und wahrt so die landwirtschaftliche Bildsprache.
- source_word: אֶשְׁכּוֹל
  choice: Traube
  rationale: Im Deutschen bezeichnet „Traube“ natürlich ein Bündel von Beeren; der Kontext macht die Weintraube deutlich.
- source_word: וְאָמַר
  choice: und jemand sagt
  rationale: Das hebräische Verb hat hier ein unbestimmtes Subjekt, das im Deutschen ausdrücklich wiedergegeben wird.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Verdirb sie nicht
  rationale: „Verderben“ passt zur konkreten Traube und lässt sich zugleich auf die spätere Vernichtung übertragen; das feminine Pronomen richtet sich nach „Traube“.
- source_word: כִּי בְרָכָה בּוֹ
  choice: denn ein Segen ist in ihr
  rationale: Die konkrete Rede vom Segen bleibt erhalten; das Pronomen folgt dem grammatischen Geschlecht der deutschen Entsprechung „Traube“.
- source_word: כֵּן אֶעֱשֶׂה
  choice: so werde ich ... handeln
  rationale: „Handeln“ gibt die Anwendung des Vergleichs im Deutschen natürlicher wieder als ein isoliertes „tun“.
- source_word: לְמַעַן עֲבָדַי
  choice: um meiner Diener willen
  rationale: Die Wendung drückt Rücksicht beziehungsweise Beweggrund aus und bewahrt den würdevollen prophetischen Ton.
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: und nicht alles vernichten
  rationale: „Alles“ wahrt die im Hebräischen fehlende ausdrückliche Objektbestimmung, statt den Bezug stillschweigend auf Personen festzulegen.
theological_decisions:
- issue: Bezug von הַכֹּל („das Ganze/alles“) im Schlusssatz
  choice: nicht alles vernichten
  alternative: sie nicht alle vernichten
  rationale: Der Kontext legt zwar die vom Gericht betroffene Gemeinschaft nahe, doch das Hebräische nennt kein persönliches Objekt. Die Übersetzung „alles“ bewahrt diese echte Unbestimmtheit; die Fußnote nennt die kontextuell mögliche personale Deutung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Register. Die feste Formel „So spricht Jahwe“ und „um ... willen“ tragen den feierlichen Ton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Die Bildsprache und die Unbestimmtheit des letzten Objekts werden bewahrt.
