id: ISA.65.18
reference: Isaiah 65:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: de
  text: 'Doch freut euch und jubelt für immer über das, was ich erschaffe! Denn seht: Ich erschaffe Jerusalem zum Jubel und ihr Volk zur Freude.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich erschaffe Jerusalem als Jubel und ihr Volk als Freude.“'
    reason: Das Hebräische lässt bei גִּילָה und מָשׂוֹשׂ sowohl eine resultativ-prädikative als auch eine finale Auffassung zu.
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch
  rationale: Die Partikelverbindung setzt die Aufforderung in einen deutlichen Gegensatz zum vorangehenden Verbot, sich an das Frühere zu erinnern. „Doch“ gibt diesen Kontrast knapp und natürlich wieder.
- source_word: שִׂישׂוּ וְגִילוּ
  choice: freut euch und jubelt
  rationale: Die beiden nahezu bedeutungsgleichen Verben werden unterschiedlich wiedergegeben, sodass die poetische Steigerung und der Nachdruck des hebräischen Doppelimperativs erhalten bleiben.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist gegenwärtiges, verständliches Standarddeutsch.
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: über das, was ich erschaffe
  rationale: Der Relativsatz nennt den Anlass beziehungsweise Gegenstand der Freude. „Über das“ ist nach den deutschen Verben „sich freuen“ und „jubeln“ idiomatisch, ohne die genaue Beziehung stärker festzulegen.
- source_word: הִנְנִי
  choice: seht
  rationale: Die deiktische Form leitet eine nachdrückliche göttliche Ankündigung ein. „Seht“ bewahrt diesen Signalcharakter in modernem Deutsch und nimmt die pluralisch angeredeten Hörer auf.
- source_word: בוֹרֵא
  choice: ich erschaffe
  rationale: Das Partizip stellt Gottes schöpferisches Handeln anschaulich als gegenwärtig beziehungsweise unmittelbar bevorstehend dar. Die gleiche Wiedergabe wie im ersten Satz wahrt die Wiederholung.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Die im Deutschen übliche Namensform wird verwendet.
- source_word: גִּילָה
  choice: zum Jubel
  rationale: Das Substantiv bezeichnet freudigen Jubel und greift klanglich wie semantisch das vorherige Verb גילוּ auf. Die Konstruktion mit „zum“ ist natürlich und lässt sowohl ein hervorgebrachtes Ergebnis als auch einen Zweck anklingen.
- source_word: וְעַמָּהּ
  choice: und ihr Volk
  rationale: Das feminine Suffix verweist auf Jerusalem zurück. „Ihr Volk“ bewahrt diese Beziehung und die Personifizierung der Stadt.
- source_word: מָשׂוֹשׂ
  choice: zur Freude
  rationale: Das Substantiv bezeichnet Freude beziehungsweise Frohlocken. „Zur Freude“ bildet mit „zum Jubel“ einen knappen, natürlichen Parallelismus.
theological_decisions:
- issue: Funktion der Substantive גִּילָה und מָשׂוֹשׂ nach ברא
  choice: Jerusalem wird „zum Jubel“ und ihr Volk „zur Freude“ erschaffen.
  alternative: Jerusalem wird „als Jubel“ und ihr Volk „als Freude“ erschaffen.
  rationale: Im Hebräischen können die Substantive resultativ-prädikativ oder final verstanden werden. Das deutsche „zum/zur“ ist idiomatisch und bewahrt einen gewissen Spielraum zwischen hervorgebrachtem Zustand und Zweck; die stärker prädikative Möglichkeit wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. Der Doppelimperativ und die Wiederholung von „erschaffe“ bleiben sichtbar; ungebräuchliche oder konfessionell geprägte Formulierungen werden vermieden.
