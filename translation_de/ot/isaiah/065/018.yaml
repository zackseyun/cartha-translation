  terminology: „Jerusalem“ entspricht der deutschen Standardnamensform. „Jubel“ und „Freude“ geben גִּילָה und מָשׂוֹשׂ differenziert sowie poetisch passend wieder. „Ihr Volk“ bildet den femininen Rückbezug auf Jerusalem korrekt ab.
