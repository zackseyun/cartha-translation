  source_fidelity: Die Übersetzung gibt den adversativen Anschluss כִּי אִם mit „Doch“ angemessen wieder, bewahrt den doppelten Imperativ und die Dauerangabe עֲדֵי עַד. „über das, was ich erschaffe“ gibt die Beziehung zum folgenden Schöpfungshandeln idiomatisch wieder. Die Wiederholung von „ich erschaffe“ entspricht den beiden Partizipien בורא. „Jerusalem zum Jubel und ihr Volk zur Freude“ ist eine natürliche deutsche Wiedergabe der poetischen prädikativen beziehungsweise final lesbaren Nominalfügung.
