id: ISA.65.10
reference: Isaiah 65:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: de
  text: Die Scharonebene wird zu einem Weideplatz für Schafherden[a] und das Tal Achor zu einem Ruheplatz für Rinder[b] — für mein Volk, das mich gesucht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Lagerplatz für Schafe“ beziehungsweise „zu einem Weidegrund für Schafe“.'
    reason: lexical_alternative
  - marker: b
    text: Das Tal Achor wird mit einem früheren Gericht in Verbindung gebracht (Josua 7,24–26); hier erscheint es als Ort der Wiederherstellung und sicheren Ruhe.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: wird zu
  rationale: Die Verbform hat im prophetischen Zusammenhang zukünftige beziehungsweise resultative Bedeutung; „wird zu“ hebt die angekündigte Verwandlung hervor.
- source_word: הַשָּׁרוֹן
  choice: die Scharonebene
  rationale: Der geografische Name wird in geläufiger deutscher Form wiedergegeben; „Ebene“ verdeutlicht, dass Scharon eine Landschaft bezeichnet.
- source_word: לִנְוֵה צֹאן
  choice: zu einem Weideplatz für Schafherden
  rationale: נָוֶה kann Weide-, Wohn- oder Lagerplatz bedeuten. „Weideplatz“ ist hier natürlich und bewahrt zusammen mit „Schafherden“ das Hirtenbild.
- source_word: וְעֵמֶק עָכוֹר
  choice: und das Tal Achor
  rationale: עֵמֶק wird als „Tal“ übersetzt, während der Eigenname Achor transliteriert bleibt.
- source_word: לְרֵבֶץ בָּקָר
  choice: zu einem Ruheplatz für Rinder
  rationale: רֵבֶץ bezeichnet einen Ort des Lagerns oder Niederlegens und vermittelt daher sichere Ruhe, nicht nur das Grasen.
- source_word: לְעַמִּי
  choice: für mein Volk
  rationale: 'Die Präposition ל wird als Angabe des Nutzens verstanden: Die wiederhergestellten Gebiete dienen Gottes Volk.'
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: das mich gesucht hat
  rationale: דרש bedeutet in Bezug auf Gott gewöhnlich „suchen“. Das Perfekt kennzeichnet das Volk durch sein vorausgehendes, weiterhin relevantes Suchen.
theological_decisions:
- issue: Identität von „mein Volk, das mich gesucht hat“
  choice: Die Formulierung bezeichnet die Menschen, die Gott als sein Volk anerkennt und die ihn gesucht haben, ohne sie in der Übersetzung näher einzugrenzen.
  alternative: Ein treuer Rest innerhalb Israels oder das wiederhergestellte Israel als Ganzes.
  rationale: Der hebräische Text legt keine engere systematische Zuordnung ausdrücklich fest; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Scharonebene“ ist für deutsche Leser verständlicher als das isolierte „Scharon“; der Gedankenstrich macht deutlich, dass „für mein Volk“ auf beide parallel genannten Landschaften bezogen ist. Sämtliche Fußnotenmarker stehen im Haupttext.
