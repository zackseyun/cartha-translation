  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: de
  text: 'Darum, so spricht der Herr Jahwe: Seht, meine Diener[a] werden essen, ihr aber werdet hungern. Seht, meine Diener werden trinken, ihr aber werdet dürsten. Seht, meine Diener werden sich freuen, ihr aber werdet beschämt dastehen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Sklaven“. Das hebräische Wort kann beides bedeuten; hier bezeichnet es Menschen, die Gott gehören und ihm dienen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „werdet euch schämen“ oder „werdet zuschanden werden“. Das Hebräische kann sowohl das Empfinden von Scham als auch das Beschämtwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und leitet den Gegensatz von Segen und Gericht natürlich ein.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die im Deutschen vertraute, würdevolle prophetische Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu einem doppelten „Herr“ zu verschmelzen.
- source_word: הִנֵּה
  choice: Seht
  rationale: Erhält bei jeder Gegenüberstellung den aufmerksamkeitslenkenden und nachdrücklichen Charakter der Partikel.
- source_word: עֲבָדַי
  choice: meine Diener
  rationale: עבד kann Diener oder Sklave bezeichnen; hier steht die Zugehörigkeit zu Gott und der Dienst für ihn im Vordergrund.
- source_word: יֹאכֵלוּ / תִּרְעָבוּ
  choice: werden essen / werdet hungern
  rationale: Gibt den konkreten Gegensatz knapp, parallel und idiomatisch wieder.
- source_word: יִשְׁתּוּ / תִּצְמָאוּ
  choice: werden trinken / werdet dürsten
  rationale: Bewahrt die parallele Zukunftsaussage sowie den gehobenen prophetischen Ton.
- source_word: יִשְׂמָחוּ
  choice: werden sich freuen
  rationale: Natürliches modernes Deutsch, das Freude beziehungsweise Frohsein ausdrückt.
- source_word: תֵּבֹשׁוּ
  choice: werdet beschämt dastehen
  rationale: Lässt im Deutschen sowohl das Erleben von Scham als auch die öffentliche Beschämung im Gerichtskontext anklingen.
- source_word: וְאַתֶּם
  choice: ihr aber
  rationale: Das formal verbindende ו trägt in der wiederholten Gegenüberstellung klar adversative Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der Herr; der Herr HERR
  rationale: Die gewählte Form unterscheidet Titel und Eigenname und macht beide Bestandteile des Hebräischen sichtbar.
- issue: Bedeutungsumfang von תֵּבֹשׁוּ
  choice: werdet beschämt dastehen
  alternative: werdet euch schämen; werdet zuschanden
  rationale: Die Formulierung wahrt die Spannung zwischen innerem Schamempfinden und objektiver Beschämung, statt den hebräischen Ausdruck ausschließlich auf eine Seite festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoll-prophetischem Ton. Die dreifache Wiederholung von „Seht“ und die parallelen Gegensätze wurden beibehalten; „ihr aber“ macht den im Kontext klaren Kontrast idiomatisch sichtbar.
