  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: de
  text: Sie werden Häuser bauen und darin wohnen; sie werden Weinberge pflanzen und ihre Früchte essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנוּ
  choice: Sie werden … bauen
  rationale: Das Qal-Perfekt mit ו steht im prophetischen Verheißungskontext und wird im Deutschen sachgerecht futurisch wiedergegeben; בנה bedeutet konkret „bauen“.
- source_word: בָתִּים
  choice: Häuser
  rationale: Die konkrete Pluralbedeutung von בית bleibt erhalten; „Heime“ würde eine im Hebräischen nicht ausdrücklich enthaltene emotionale Nuance hinzufügen.
- source_word: וְיָשָׁבוּ
  choice: darin wohnen
  rationale: ישב bezeichnet hier das Wohnen. „Darin“ nimmt die zuvor genannten Häuser natürlich auf und entspricht dem deutschen Sprachgebrauch.
- source_word: וְנָטְעוּ
  choice: sie werden … pflanzen
  rationale: נטע bedeutet „pflanzen“; wie die benachbarten Perfektformen wird das Verb aufgrund des Verheißungskontexts futurisch übersetzt.
- source_word: כְרָמִים
  choice: Weinberge
  rationale: כרמים bezeichnet Weinberge und nicht lediglich einzelne Weinstöcke; der Plural wird bewahrt.
- source_word: וְאָכְלוּ
  choice: essen
  rationale: אכל bedeutet konkret „essen“. Eine Wiedergabe wie „genießen“ wäre deutender und weiter als der Ausgangstext.
- source_word: פִּרְיָם
  choice: ihre Früchte
  rationale: פרי kann „Frucht“ oder „Ertrag“ bedeuten. Der maskuline Pluralsuffix bezieht sich auf die Weinberge; im Deutschen ist der Plural „Früchte“ in diesem Zusammenhang natürlich und anschaulich.
theological_decisions:
- issue: Prophetischer Gebrauch der hebräischen Perfektformen
  choice: Wiedergabe als zukünftige Verheißung
  alternative: Wiedergabe als Vergangenheit oder deutsches Perfekt
  rationale: Im Zusammenhang der angekündigten Erneuerung schildern die Verbformen das künftige Ergehen des Volkes. Das deutsche Futur vermittelt diese prophetische Funktion klar, ohne den Text als Bericht über Vergangenes misszuverstehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und knappem Satzbau. Die parallele Struktur des Hebräischen bleibt erhalten; das wiederholte „sie werden“ macht beide Verheißungshälften klar und rhythmisch.
