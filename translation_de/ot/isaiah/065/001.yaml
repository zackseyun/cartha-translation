source:
  edition: WLC
  text: נִדְרַ֨שְׁתִּי֙ לְ/ל֣וֹא שָׁאָ֔לוּ נִמְצֵ֖אתִי לְ/לֹ֣א בִקְשֻׁ֑/נִי אָמַ֨רְתִּי֙ הִנֵּ֣/נִי הִנֵּ֔/נִי אֶל גּ֖וֹי לֹֽא קֹרָ֥א בִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: de
  text: 'Ich ließ mich von denen suchen, die nicht nach mir fragten[a]; ich ließ mich von denen finden, die mich nicht suchten. Einem Volk[b], das meinen Namen nicht anrief, sagte ich: »Hier bin ich, hier bin ich!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Ich wurde gesucht … ich wurde gefunden.« Die hebräischen Niphal-Formen können als einfache Passive verstanden werden; im Zusammenhang klingt zugleich an, dass Gott sich Menschen zu erkennen gibt, die nicht nach ihm suchen.'
    reason: lexical_alternative
  - marker: b
    text: Paulus führt diesen Vers in Römer 10,20 mit Bezug auf die Nichtjuden an. Daher kann »Volk« im weiteren biblischen Zusammenhang in diesem Sinn verstanden werden.
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: Ich ließ mich suchen
  rationale: Die Niphal-Form kann schlicht passiv als »Ich wurde gesucht« verstanden werden. Die gewählte reflexiv-passive Wiedergabe bewahrt diese Formnähe und lässt zugleich anklingen, dass Gott sich Menschen zugänglich macht, die nicht nach ihm fragen.
- source_word: לְלֹא שָׁאָלוּ
  choice: von denen, die nicht nach mir fragten
  rationale: שׁאל bezeichnet hier das Fragen beziehungsweise Sich-Erkundigen. »Nach mir fragten« ist im Deutschen natürlich und passt zum Gottesbezug, ohne die Aussage zu überdeuten.
- source_word: נִמְצֵאתִי
  choice: ich ließ mich finden
  rationale: Das Niphal von מצא bedeutet zunächst »gefunden werden«. »Ließ mich finden« erhält die passive beziehungsweise reflexive Nuance und bildet die hebräische Parallelstruktur verständlich ab.
- source_word: לְלֹא בִקְשֻׁנִי
  choice: von denen, die mich nicht suchten
  rationale: בקשׁ bedeutet »suchen«; das Objektsuffix wird mit »mich« wiedergegeben. Die Formulierung entspricht der parallelen ersten Vershälfte.
- source_word: הִנֵּנִי הִנֵּנִי
  choice: Hier bin ich, hier bin ich!
  rationale: Die Wiederholung wird wegen ihrer emphatischen Wirkung beibehalten. »Hier bin ich« ist gegenwärtiges, natürliches Deutsch und drückt Gottes Gegenwart und Bereitschaft aus.
- source_word: גּוֹי
  choice: Volk
  rationale: גּוֹי kann »Volk« oder »Nation« bedeuten. »Volk« ist hier im Deutschen natürlicher und lässt offen, ob eine bestimmte Nation oder die Völkerwelt gemeint ist.
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: das meinen Namen nicht anrief
  rationale: Die aktive Form קֹרָא mit בְּשֵׁם bezeichnet hier das Anrufen des Namens. Sie wird daher nicht passiv im Sinn von »das nicht nach meinem Namen genannt war« verstanden.
theological_decisions:
- issue: Ob die Selbstoffenbarung Gottes gegenüber den Nichtjuden bereits im Haupttext ausdrücklich gemacht werden soll
  choice: גּוֹי wird im Haupttext neutral mit »Volk« wiedergegeben; die Anwendung auf die Nichtjuden wird in einer Fußnote genannt.
  alternative: »Nichtjuden« oder »heidnisches Volk« direkt in den Haupttext aufnehmen.
  rationale: Der hebräische Ausdruck bezeichnet zunächst ein Volk beziehungsweise eine Nation und legt an dieser Stelle allein die spezifische Deutung »Nichtjuden« nicht ausdrücklich fest. Römer 10,20 wendet den Vers jedoch auf die Nichtjuden an; die Fußnote bewahrt diesen kanonischen Zusammenhang, ohne die Mehrdeutigkeit des hebräischen Textes aufzulösen.
- issue: Ob die Niphal-Formen ausschließlich als einfache Passive oder als Ausdruck göttlicher Selbsterschließung wiederzugeben sind
  choice: Die Hauptübersetzung verwendet »ließ mich suchen/finden«, während die einfachen Passivformen in der Fußnote dokumentiert werden.
  alternative: »Ich wurde gesucht … ich wurde gefunden.«
  rationale: Die einfache Passivdeutung ist grammatisch möglich und darf nicht verschwiegen werden. Im Zusammenhang betont der Satz zugleich, dass Gott sich Menschen zu erkennen gibt, die nicht nach ihm fragen oder suchen. Die gewählte Formulierung wahrt beide Aspekte, ohne eine weitergehende dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die emphatische Wiederholung bleibt erhalten. »Volk« vermeidet sowohl das im Deutschen politisch engere »Nation« als auch die interpretierende Festlegung auf »Nichtjuden« im Haupttext.
