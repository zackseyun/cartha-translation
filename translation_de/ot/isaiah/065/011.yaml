base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: de
  text: Ihr aber, die ihr Jahwe verlasst, die meinen heiligen Berg vergesst, die für Gad[a] einen Tisch deckt und für Meni[b] einen Mischtrank[c] einschenkt –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gad war wahrscheinlich der Name einer mit Glück verbundenen Gottheit; möglich ist auch die Übersetzung „für das Glück“.
    reason: alternative_reading
  - marker: b
    text: Meni war wahrscheinlich der Name einer mit Schicksal oder Bestimmung verbundenen Gottheit; möglich ist auch die Übersetzung „für das Schicksal“.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Mischgetränk“. Gemeint ist ein zubereitetes, vermutlich weinhaltiges Getränk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Verbindung aus Konjunktion und ausdrücklich gesetztem Pronomen hebt die Angeredeten kontrastierend hervor; „Ihr aber“ gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: עֹזְבֵי יְהוָה
  choice: die ihr Jahwe verlasst
  rationale: Das substantivisch gebrauchte Partizip beschreibt die angesprochene Gruppe. „Verlassen“ bewahrt hier den gewichtigen Sinn von עזב, ohne eine zusätzliche Deutung einzutragen. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: הַשְּׁכֵחִים אֶת הַר קָדְשִׁי
  choice: die meinen heiligen Berg vergesst
  rationale: „Vergessen“ entspricht dem Grundsinn des Partizips und wahrt den parallelen Aufbau. „Mein heiliger Berg“ ist die natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: הָעֹרְכִים לַגַּד שֻׁלְחָן
  choice: die für Gad einen Tisch deckt
  rationale: ערך bezeichnet beim Tisch das Bereitstellen oder Anordnen; „einen Tisch decken“ ist im Deutschen idiomatisch. גד wird als Eigenname transliteriert, während die mögliche Bedeutung in einer Fußnote erläutert wird.
- source_word: וְהַמְמַלְאִים לַמְנִי מִמְסָךְ
  choice: und für Meni einen Mischtrank einschenkt
  rationale: מלא bedeutet wörtlich „füllen“; im Zusammenhang mit einem zubereiteten Getränk gibt „einschenken“ den gemeinten Vorgang natürlich wieder. מני bleibt als möglicher Göttername im Haupttext erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen und verwendet zugleich die im modernen Deutschen geläufige Form.
- issue: Deutung von גַּד und מְנִי
  choice: Gad und Meni als Eigennamen im Haupttext
  alternative: Glück und Schicksal
  rationale: Beide Ausdrücke können als Namen von Gottheiten beziehungsweise personifizierten Mächten verstanden werden. Die Transliteration wahrt diese wahrscheinlichste syntaktische Deutung; ihre Bedeutungsbezüge werden in den Fußnoten genannt, ohne die verbleibende Unsicherheit zu verdecken.
- issue: Unvollständiger Satz über die Versgrenze hinweg
  choice: Gedankenstrich am Versende
  alternative: den Satz innerhalb von Vers 11 abschließen
  rationale: Die Partizipialgruppe von Vers 11 erhält ihre Folgerung erst im folgenden Vers. Der Gedankenstrich signalisiert diese offene Satzstruktur, statt einen im Hebräischen nicht vorhandenen Abschluss zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Parallelstruktur. Die Wiederholung „die“ macht die hebräischen Partizipien verständlich; der Gedankenstrich hält die syntaktische Fortsetzung in Vers 12 offen.
