  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: de
  text: Sie werden nicht bauen, und ein anderer wird darin wohnen; sie werden nicht pflanzen, und ein anderer wird davon essen. Denn wie die Tage eines Baumes werden die Tage meines Volkes sein, und meine Erwählten werden das Werk ihrer Hände lange genießen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann wörtlich auch „aufbrauchen“, „abnutzen“ oder „verschleißen“ bedeuten. Im Zusammenhang besagt es, dass sie den Ertrag ihrer eigenen Arbeit lange und unverkürzt nutzen werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְנוּ
  choice: sie werden bauen
  rationale: Das Qal-Imperfekt steht im Zusammenhang der verheißenen Wiederherstellung und wird daher futurisch wiedergegeben.
- source_word: וְאַחֵר יֵשֵׁב
  choice: und ein anderer wird darin wohnen
  rationale: יָשַׁב bezeichnet hier das Wohnen in dem zuvor genannten, nur implizit vorhandenen Haus; „darin“ macht diesen Bezug im Deutschen verständlich.
- source_word: יִטְּעוּ
  choice: sie werden pflanzen
  rationale: Das gewöhnliche Verb für das Pflanzen wird im Zukunftssinn direkt wiedergegeben.
- source_word: וְאַחֵר יֹאכֵל
  choice: und ein anderer wird davon essen
  rationale: Das Objekt ist im Hebräischen ausgelassen und aus dem Gepflanzten zu erschließen; „davon“ stellt den natürlichen deutschen Bezug her.
- source_word: כִּי כִימֵי הָעֵץ יְמֵי עַמִּי
  choice: Denn wie die Tage eines Baumes werden die Tage meines Volkes sein
  rationale: Die Vergleichsstruktur und das Bild der „Tage“ bleiben erhalten; der bestimmte Singular הָעֵץ wird im Deutschen generisch mit „eines Baumes“ ausgedrückt.
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: das Werk ihrer Hände
  rationale: Die hebräische Wendung für das Ergebnis der eigenen Arbeit bleibt als verständliches und würdiges Bild erhalten.
- source_word: יְבַלּוּ
  choice: werden … aufbrauchen
  rationale: Das Piel von בלה kann „abnutzen, verschleißen, aufbrauchen“ bedeuten. Die direkte Bildsprache wird bewahrt und durch eine Fußnote gegen das mögliche Missverständnis erklärt, es gehe um Zerstörung statt um lange Nutzung.
- source_word: בְּחִירָי
  choice: meine Erwählten
  rationale: Die substantivierte Pluralform von בחר wird genau wiedergegeben; „Erwählte“ ist im Deutschen natürlich und fügt keine über den Text hinausgehende Aussage hinzu.
theological_decisions:
- issue: Bedeutung von יְבַלּוּ im Zusammenhang der verheißenen Segnung
  choice: Das konkrete Bild wird mit „das Werk ihrer Hände aufbrauchen“ bewahrt.
  alternative: „lange Freude am Werk ihrer Hände haben“ oder „das Werk ihrer Hände voll genießen“
  rationale: Der Kontext beschreibt Sicherheit, Langlebigkeit und den unverkürzten Nutzen der eigenen Arbeit. Die wörtlichere Wiedergabe erhält jedoch die ungewöhnliche, spannungsreiche Bildsprache des Hebräischen; die Fußnote erläutert deren positive Aussage, ohne sie im Haupttext auf eine einzige Paraphrase festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen und das Baumbild bleiben erhalten. Ergänzte Pronomen wie „darin“ und „davon“ verdeutlichen lediglich die im Hebräischen vorausgesetzten Bezüge.
