  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: de
  text: Denn siehe, ich erschaffe neue Himmel und eine neue Erde. An die früheren Dinge wird man sich nicht mehr erinnern, und sie werden nicht mehr in den Sinn kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie werden nicht auf das Herz steigen.“ Gemeint ist: Sie werden einem nicht mehr in den Sinn kommen.'
    reason: Das hebräische Idiom wird im Haupttext verständlich wiedergegeben; die Fußnote bewahrt sein wörtliches Bild und den Plural des Ausgangstextes.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Gibt die begründende beziehungsweise erläuternde Funktion im Zusammenhang wieder.
- source_word: הִנְנִי
  choice: 'seht: Ich'
  rationale: „Seht“ bewahrt den aufmerksamkeitslenkenden und hervorhebenden Charakter der Partikel in heutiger, würdiger Sprache; „Ich“ erhält die betonte Selbstbezeichnung.
- source_word: בוֹרֵא
  choice: erschaffe
  rationale: Das Partizip stellt Gottes Schaffen als gegenwärtig angekündigtes beziehungsweise gewiss einsetzendes Handeln dar. „Ich erschaffe“ gibt diese Form natürlicher wieder als ein bloßes Futur.
- source_word: שָׁמַיִם חֲדָשִׁים
  choice: einen neuen Himmel
  rationale: „Himmel“ ist im Deutschen die natürliche Wiedergabe im kosmischen Schöpfungszusammenhang. Obwohl die hebräische Form pluralisch ist, bezeichnet die feste deutsche Wendung „Himmel und Erde“ den umfassenden kosmischen Zusammenhang, ohne mehrere getrennte Himmel zu behaupten.
- source_word: וָאָרֶץ חֲדָשָׁה
  choice: und eine neue Erde
  rationale: In der Verbindung mit dem neuen Himmel ist אֶרֶץ kosmisch als „Erde“ zu verstehen, nicht lediglich territorial als „Land“.
- source_word: הָרִאשֹׁנוֹת
  choice: das Frühere
  rationale: Das substantivierte feminine Pluraladjektiv bleibt bewusst weit gefasst und bezeichnet die früheren Dinge beziehungsweise die frühere Ordnung, ohne sie näher festzulegen.
- source_word: תִזָּכַרְנָה
  choice: wird man sich nicht mehr erinnern
  rationale: Die unpersönliche deutsche Form gibt den passivischen Sinn des Nifal natürlich wieder. „Nicht mehr“ bringt im Deutschen den Kontrast zwischen dem Früheren und der neuen Schöpfung idiomatisch zum Ausdruck.
- source_word: תַעֲלֶינָה עַל לֵב
  choice: wird es nicht mehr in den Sinn kommen
  rationale: Die geläufige deutsche Wendung vermittelt den Sinn des hebräischen Bildes, nach dem etwas „auf das Herz“ steigt; die Fußnote bewahrt das zugrunde liegende Bild.
theological_decisions:
- issue: Reichweite der verheißenen Erneuerung
  choice: „einen neuen Himmel und eine neue Erde“ als umfassende kosmische Aussage
  alternative: eine ausschließlich bildhafte Beschreibung politischer oder nachexilischer Wiederherstellung
  rationale: Die Verbindung von Himmel und Erde greift die Sprache der Schöpfung auf. Die Übersetzung bewahrt diese Weite, ohne ein bestimmtes eschatologisches System in den Vers hineinzulesen.
- issue: Bezug von „das Frühere“
  choice: bewusst offen gelassen
  alternative: ausdrückliche Gleichsetzung nur mit früherem Leid, früheren Sünden oder der gesamten gegenwärtigen Schöpfungsordnung
  rationale: Der substantivierte Ausdruck ist im Hebräischen nicht näher bestimmt. Die Übersetzung wahrt diese inhaltliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „seht“ gibt den aufmerksamkeitslenkenden Einschnitt natürlich wieder. Die traditionelle Schöpfungsformel „Himmel und Erde“ wahrt den biblischen Zusammenhang, während „das Frühere“ die Offenheit des Ausgangstextes erhält.
