source:
  edition: WLC
  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: de
  text: die bei den Gräbern sitzen und an verborgenen Orten übernachten[a], die Schweinefleisch essen und in deren Gefäßen Brühe aus unreinen Dingen ist[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist unsicher. Möglich sind auch „an abgeschlossenen Orten“ oder „an bewachten Orten“; „an belagerten Orten“ ist im Zusammenhang weniger wahrscheinlich.
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch „Suppe“ oder „Sud“ bedeuten; „unreine Dinge“ lässt sich auch mit „abscheuliche Dinge“ wiedergeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  choice: die … sitzen
  rationale: Das substantivisch gebrauchte Qal-Partizip beschreibt die betreffenden Menschen. „Sitzen“ bewahrt das konkrete Bild; im Zusammenhang kann auch ein längeres Verweilen gemeint sein.
- source_word: בַּקְּבָרִים
  choice: zwischen den Gräbern
  rationale: קְבָרִים bezeichnet Gräber oder Grabstätten. „Zwischen den Gräbern“ gibt den örtlichen Zusammenhang im Deutschen natürlicher wieder als „in den Gräbern“, ohne ein tatsächliches Betreten der Gräber vorauszusetzen.
- source_word: וּבַנְּצוּרִים
  choice: an verborgenen Orten
  rationale: Der seltene und schwierige Ausdruck wird im Parallelismus mit den Gräbern am ehesten als Bezeichnung verborgener Orte verstanden. Die Unsicherheit bleibt in einer Fußnote sichtbar.
- source_word: יָלִינוּ
  choice: übernachten
  rationale: Das Verb לין bezeichnet das Verbringen der Nacht beziehungsweise das Übernachten. Die knappe deutsche Wiedergabe erhält diesen nächtlichen Aspekt.
- source_word: הָאֹכְלִים
  choice: die … essen
  rationale: Das weitere substantivische Partizip setzt die Beschreibung derselben Menschen fort.
- source_word: בְּשַׂר הַחֲזִיר
  choice: Schweinefleisch
  rationale: Die geläufige moderne Bezeichnung ist konkret und gibt das im Text als kultisch anstößig dargestellte Nahrungsmittel genau wieder.
- source_word: ופרק
  choice: Brühe
  rationale: Das seltene Wort wird traditionell als flüssige Speise, Brühe oder Sud verstanden. „Brühe“ passt zum folgenden Gefäßmotiv; die lexikalische Unsicherheit wird angemerkt.
- source_word: פִּגֻּלִים
  choice: unreinen Dingen
  rationale: פִּגּוּל bezeichnet im Speise- und Opferzusammenhang etwas kultisch Unreines beziehungsweise Abscheuliches. „Unrein“ wahrt den rituellen Bezug, ohne ihn weiter auszudeuten.
- source_word: כְּלֵיהֶם
  choice: deren Gefäßen
  rationale: כְּלִי ist eine allgemeine Bezeichnung für Gefäß, Behälter oder Gerät. „Gefäße“ bewahrt diese Allgemeinheit und passt zum Inhalt der Brühe.
theological_decisions:
- issue: Wiedergabe der kultisch anstößigen Speisen
  choice: Die konkreten Bilder „Schweinefleisch“, „Brühe“, „unreine Dinge“ und „Gefäße“ bleiben erhalten.
  alternative: Verallgemeinerung als „verbotene Speisen“ oder verstärkende Wiedergabe als „Gräuel“.
  rationale: Der Vers verurteilt Praktiken im Zusammenhang mit kultischer Unreinheit. Die Übersetzung gibt die ausdrücklich genannten Bilder wieder, ohne daraus spätere Lehrkategorien abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Partizipialformulierungen des Hebräischen werden durch zwei Relativsätze bewahrt. „Zwischen den Gräbern“ und „an verborgenen Orten übernachten“ sind natürlich verständlich, während die Fußnoten die echten lexikalischen Unsicherheiten offenhalten.
