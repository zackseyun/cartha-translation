id: ISA.65.20
reference: Isaiah 65:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: de
  text: Dort wird es keinen Säugling mehr geben, der nur wenige Tage lebt,[a] und keinen alten Menschen, der seine Lebenstage nicht vollendet. Denn der junge Mensch[b] wird mit hundert Jahren sterben, und der Sünder wird mit hundert Jahren verflucht sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Säugling von Tagen“; gemeint sein kann ein Säugling, der nur wenige Tage alt wird.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Junge“, „Jugendlicher“ oder „junger Mann“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „wird unter einem Fluch stehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: dort
  rationale: Das hebräische מִשָּׁם lautet der Form nach „von dort“. Im Deutschen gibt „dort wird es … geben“ die örtliche Aussage in diesem Existenzsatz natürlicher wieder, ohne ihren Sinn zu verändern.
- source_word: עוּל יָמִים
  choice: Säugling, der nur wenige Tage lebt
  rationale: Die wörtliche Verbindung „Säugling von Tagen“ ist im Deutschen unverständlich. Die gewählte Formulierung gibt die idiomatische Bedeutung wieder und bewahrt in der Fußnote das hebräische Bild.
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  choice: alter Mensch, der seine Lebenstage nicht vollendet
  rationale: „Seine Lebenstage vollenden“ bildet מלא mit ימים eng ab und bleibt in gehobenem, modernem Deutsch verständlich.
- source_word: הַנַּעַר
  choice: der junge Mensch
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen. „Junger Mensch“ erhält die altersbezogene Breite und passt zum Kontrast mit hohem Alter.
- source_word: בֶּן מֵאָה שָׁנָה
  choice: mit hundert Jahren
  rationale: Dies ist die natürliche deutsche Wiedergabe der üblichen hebräischen Altersangabe.
- source_word: יָמוּת
  choice: wird sterben
  rationale: Der hebräische Imperfekt wird im prophetischen Zusammenhang als Zukunftsaussage wiedergegeben.
- source_word: הַחוֹטֵא
  choice: der Sünder
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, der durch Sündigen gekennzeichnet ist; „der Sünder“ ist knapp und quellennah.
- source_word: יְקֻלָּל
  choice: wird verflucht sein
  rationale: Die Pual-Form bezeichnet den Zustand beziehungsweise das Ergehen dessen, auf dem ein Fluch liegt. „Verflucht sein“ erhält die starke gerichtliche Aussage.
theological_decisions:
- issue: Tod und Fluch innerhalb der Verheißung von Gottes neuer Schöpfung
  choice: Die Aussagen über Sterben mit hundert Jahren und über den verfluchten Sünder werden ohne Umdeutung wiedergegeben.
  alternative: „Sterben“ rein bildlich verstehen oder die Formulierung so anpassen, dass jede Spannung zu anderen eschatologischen Texten verschwindet.
  rationale: Im Hebräischen stehen ausdrücklich „wird sterben“ und „wird verflucht sein“. Die Übersetzung bewahrt diese Spannung und überlässt ihre theologische Einordnung der Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am hebräischen Parallelismus, während schwer verständliche Idiome behutsam idiomatisch wiedergegeben werden. Die auffällige Spannung, dass ein „junger Mensch“ mit hundert Jahren stirbt, bleibt bewusst stehen.
