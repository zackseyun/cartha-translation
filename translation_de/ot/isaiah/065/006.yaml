id: ISA.65.6
reference: Isaiah 65:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֥ה כְתוּבָ֖ה לְ/פָנָ֑/י לֹ֤א אֶחֱשֶׂה֙ כִּ֣י אִם שִׁלַּ֔מְתִּי וְ/שִׁלַּמְתִּ֖י עַל חֵיקָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
translation:
  language: de
  text: 'Sieh[a], es steht vor mir geschrieben: Ich werde nicht schweigen, sondern vergelten; ja, ich werde es ihnen in den Schoß vergelten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, es steht vor mir geschrieben.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „an ihren Busen“. Das hebräische Bild beschreibt eine Vergeltung, die unmittelbar auf die Betroffenen zurückkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet eine feierliche Erklärung ein. „Sieh“ bewahrt ihren hinweisenden und auffordernden Charakter in würdigem, modernem Deutsch.
- source_word: כְתוּבָה לְפָנָי
  choice: es steht vor mir geschrieben
  rationale: Das passive Partizip bezeichnet eine schriftlich festgehaltene Sache, die vor Gott gegenwärtig ist. „Steht ... geschrieben“ bringt den fortbestehenden Eintrag natürlich zum Ausdruck.
- source_word: לֹא אֶחֱשֶׂה
  choice: Ich werde nicht schweigen
  rationale: חשה bedeutet schweigen oder still bleiben. Die deutsche Wendung bewahrt hier den angekündigten Entschluss Gottes.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Nach der Verneinung führt die Verbindung den positiven Gegensatz ein: Gott wird nicht schweigen, sondern handelnd vergelten.'
- source_word: שִׁלַּמְתִּי
  choice: ich werde vergelten
  rationale: Obwohl die Form formal perfektiv ist, kann sie in prophetischer Rede eine fest beschlossene zukünftige Handlung ausdrücken. „Vergelten“ bewahrt den Gedanken entsprechender Gegenleistung, ohne deren Art enger festzulegen.
- source_word: וְשִׁלַּמְתִּי
  choice: ja, ich werde ... vergelten
  rationale: Die Wiederholung verstärkt die Gewissheit der angekündigten Vergeltung; „ja“ gibt diese Bekräftigung idiomatisch wieder.
- source_word: עַל חֵיקָם
  choice: ihnen in den Schoß
  rationale: חֵיק bezeichnet den Brust- oder Schoßbereich. Die Formulierung erhält das Bild einer Vergeltung, die unmittelbar auf die Betroffenen zurückkommt.
theological_decisions:
- issue: Aspekt und Zeitbezug von שִׁלַּמְתִּי / וְשִׁלַּמְתִּי
  choice: 'Zukünftiger Sinn: „Ich werde ... vergelten; ja, ich werde ... vergelten“'
  alternative: 'Perfektiv bzw. vergangen: „Ich habe vergolten“'
  rationale: Im prophetischen Gerichtswort können Perfektformen eine feststehende zukünftige Handlung ausdrücken. Der Zusammenhang kündigt Vergeltung an; die Zukunftsform bewahrt diesen Sinn, ohne zusätzliche theologische Aussagen einzutragen.
- issue: Art der Vergeltung
  choice: Vergeltende Gegenleistung, ohne nähere Bestimmung
  alternative: Ausdrücklich „Bestrafung“ oder „Rache“
  rationale: שׁלם bezeichnet hier das Zurückzahlen oder Vergelten. „Vergelten“ wahrt die Gegenseitigkeits- und Gerichtsdimension, ohne den Wortlaut interpretierend zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Aufmerksamkeitspartikel und die eindringliche Wiederholung bleiben erhalten; ungebräuchliche oder konfessionell geprägte Formulierungen werden vermieden.
