id: ISA.65.24
reference: Isaiah 65:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֥ה טֶֽרֶם יִקְרָ֖אוּ וַ/אֲנִ֣י אֶעֱנֶ֑ה ע֛וֹד הֵ֥ם מְדַבְּרִ֖ים וַ/אֲנִ֥י אֶשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
translation:
  language: de
  text: 'Und es wird geschehen: Noch bevor sie rufen[a], werde ich antworten; während sie noch reden[b], werde ich hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um Hilfe rufen«. Das Verb kann einen an Gott gerichteten Ruf, einschließlich eines Gebets, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »noch sind sie am Reden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die prophetische Zukunftsformel wird in modernem, würdigem Deutsch wiedergegeben, ohne die altertümliche Formulierung »es wird sich begeben«.
- source_word: טֶרֶם
  choice: noch bevor
  rationale: Die Wendung bezeichnet klar die zeitliche Vorrangigkeit; »noch bevor« hebt die überraschend frühe Antwort natürlich hervor.
- source_word: יִקְרָאוּ
  choice: sie rufen
  rationale: קרא kann allgemein »rufen« oder »ausrufen« bedeuten und hier einen an Gott gerichteten Hilferuf einschließen. »Rufen« bewahrt diese Bedeutungsbreite, ohne ausdrücklich »beten« einzutragen.
- source_word: אֶעֱנֶה
  choice: werde ich antworten
  rationale: ענה bezeichnet das Antworten oder Erwidern und bildet hier das natürliche Gegenstück zum Rufen.
- source_word: עוֹד הֵם מְדַבְּרִים
  choice: während sie noch reden
  rationale: עוֹד mit dem Partizip beschreibt eine noch andauernde Handlung. Die deutsche Nebensatzkonstruktion gibt diesen Verlauf idiomatisch wieder.
- source_word: אֶשְׁמָע
  choice: werde ich hören
  rationale: שמע bedeutet grundlegend »hören« und kann kontextuell aufmerksames oder erhörendes Hören andeuten. »Hören« bewahrt die offene Formulierung des Hebräischen.
theological_decisions:
- issue: Soll der Gebetskontext ausdrücklich gemacht werden?
  choice: Die allgemeinen Verben »rufen«, »antworten« und »hören« bleiben erhalten.
  alternative: »Noch bevor sie beten, werde ich sie erhören.«
  rationale: Der Zusammenhang legt das Gebet und Gottes bereitwillige Zuwendung nahe; der hebräische Text verwendet jedoch allgemeinere Verben. Die Übersetzung macht die Deutung daher nicht enger als die Vorlage.
- issue: Soll אֶשְׁמָע als »erhören« wiedergegeben werden?
  choice: »werde ich hören«
  alternative: »werde ich sie erhören«
  rationale: »Erhören« würde die positive Reaktion ausdrücklich festlegen und zudem ein nicht genanntes Objekt ergänzen. Das parallel stehende »antworten« vermittelt Gottes Zuwendung bereits, während »hören« die lexikalische und theologische Spannung wahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Doppelpunkt macht die folgende Verheißung deutlich; das Semikolon erhält den Parallelismus der beiden Satzhälften. Die Futurformen entsprechen der einleitenden Zukunftsaussage.
