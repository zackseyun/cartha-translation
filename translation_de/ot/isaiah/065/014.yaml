source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: de
  text: Seht, meine Diener werden vor Herzensfreude jubeln[a]. Ihr aber werdet vor Herzensschmerz schreien und wegen eines gebrochenen Geistes heulen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Freude singen“ oder „Jubelrufe ausstoßen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus dem Zerbruch des Geistes“; gemeint ist ein inneres Zerbrochensein.'
    reason: translation_clarity
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufforderung lenkt nachdrücklich die Aufmerksamkeit auf den folgenden Gegensatz. „Seht“ ist gegenwärtiges, verständliches Deutsch und bewahrt die hinweisende Funktion.
- source_word: עֲבָדַי
  choice: meine Diener
  rationale: Das Wort bezeichnet Menschen, die Gott gehören und ihm dienen. „Diener“ gibt dies im heutigen Deutsch natürlicher wieder als das stärker historisch oder sozial gefärbte „Knechte“.
- source_word: יָרֹנּוּ
  choice: werden … jubeln
  rationale: Das Verb kann freudiges Rufen oder Singen bezeichnen. „Jubeln“ wahrt diese Bedeutungsbreite; die mögliche Nuance des Singens wird in einer Fußnote genannt.
- source_word: מִטּוּב לֵב
  choice: aus Herzensfreude
  rationale: Die Wendung bezeichnet hier inneres Wohlergehen und Freude, nicht moralische Güte. Die kausale Bedeutung der Präposition und der Bezug zum Herzen bleiben erhalten.
- source_word: תִּצְעֲקוּ
  choice: werdet … schreien
  rationale: Das Verb bezeichnet einen lauten, häufig aus Not hervorgebrachten Schrei. „Schreien“ erhält die Intensität und den Gegensatz zum Jubel der Diener.
- source_word: מִכְּאֵב לֵב
  choice: vor Herzensschmerz
  rationale: Die Formulierung bewahrt das Herzbild und gibt die Ursache des Schreiens in natürlichem Deutsch wieder. Zugleich bleibt die Parallele zu „Herzensfreude“ erkennbar.
- source_word: מִשֵּׁבֶר רוּחַ
  choice: weil euer Geist gebrochen ist
  rationale: Die hebräische Nominalwendung beschreibt den inneren Zusammenbruch als Ursache des Heulens. Die deutsche Satzform ist verständlich und bewahrt das Bild des gebrochenen Geistes.
- source_word: תְּיֵלִילוּ
  choice: werdet … heulen
  rationale: Das Verb bezeichnet lautes Klagen oder Heulen. „Heulen“ gibt seine starke, ungeschönte Ausdruckskraft wieder.
theological_decisions:
- issue: Identität der „Diener“ und der mit „ihr“ Angesprochenen
  choice: Der im Vers gesetzte Gegensatz bleibt bestehen, ohne die beiden Gruppen in der Übersetzung näher zu bestimmen.
  alternative: Die Diener ausdrücklich als treuen Rest und die Angesprochenen ausdrücklich als abtrünnige Israeliten bezeichnen.
  rationale: Der Vers kontrastiert Gottes Diener mit den Angesprochenen, benennt ihre jeweilige Identität hier aber nicht genauer. Eine nähere Bestimmung gehört in die Auslegung des Zusammenhangs, nicht in den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gegensatzpaare Herzensfreude/Herzensschmerz und jubeln/schreien-heulen werden klar herausgestellt. Archaische Wörter werden vermieden, während die Körper- und Geistmetaphorik des Hebräischen erhalten bleibt.
