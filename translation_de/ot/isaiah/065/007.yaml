  text: עֲ֠וֺנֹתֵי/כֶם וַ/עֲוֺנֹ֨ת אֲבוֹתֵי/כֶ֤ם יַחְדָּו֙ אָמַ֣ר יְהוָ֔ה אֲשֶׁ֤ר קִטְּרוּ֙ עַל הֶ֣/הָרִ֔ים וְ/עַל הַ/גְּבָע֖וֹת חֵרְפ֑וּ/נִי וּ/מַדֹּתִ֧י פְעֻלָּתָ֛/ם רִֽאשֹׁנָ֖ה על חֵיקָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: de
  text: Eure Vergehen und die Vergehen eurer Väter zusammen, spricht Jahwe, weil sie auf den Bergen Räucherwerk verbrannten und mich auf den Hügeln verhöhnten. Darum werde ich ihnen ihr früheres Tun[a] in ihren Schoß[b] zumessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre frühere Vergeltung“. Das hebräische Wort kann sowohl ein Tun oder Werk als auch den dafür zustehenden Lohn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf ihren Schoß“. Die Wendung bezeichnet eine unmittelbare, persönliche Vergeltung.'
    reason: cultural_note
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם וַעֲוֺנֹת אֲבוֹתֵיכֶם
  choice: eure Vergehen und die Vergehen eurer Väter
  rationale: „Vergehen“ gibt die moralische Schuldhaftigkeit von עָוֹן wieder, ohne den Begriff auf bloße Tat oder bereits auf Strafe festzulegen. „Väter“ bewahrt die ausdrücklich männliche Form und den heilsgeschichtlichen Klang des Hebräischen.
- source_word: יַחְדָּו
  choice: zusammen
  rationale: Das Adverb verbindet die Vergehen der Angesprochenen mit denen ihrer Väter, ohne die Spannung der generationenübergreifenden Gerichtsaussage aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Die formal relative Partikel führt hier im Zusammenhang den Grund für das angekündigte Gericht ein. „Weil“ ist im Deutschen klar und natürlich; das anschließende „sie“ lässt offen, wie weit die beschriebenen Handlungen auf Väter und gegenwärtige Generation bezogen werden.
- source_word: קִטְּרוּ
  choice: Räucherwerk verbrannten
  rationale: Das Piel von קטר bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk. Die Formulierung ist konkret und vermeidet eine unnötige Festlegung darauf, ob es sich um ein rechtmäßiges oder unrechtmäßiges Opfer handelte.
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: auf den Bergen … auf den Hügeln
  rationale: Die beiden ausdrücklich genannten Geländeformen und der Parallelismus des Hebräischen bleiben erhalten; „Höhenheiligtümer“ wäre eine interpretierende Ergänzung.
- source_word: חֵרְפוּנִי
  choice: mich … verhöhnten
  rationale: „Verhöhnen“ gibt den Sinn von חרף als schmähen, verspotten oder verächtlich behandeln in gegenwärtigem, würdigem Deutsch wieder.
- source_word: וּמַדֹּתִי
  choice: Darum werde ich … zurückzahlen
  rationale: Das Verb bedeutet wörtlich „messen/zumessen“. In Verbindung mit „in den Schoß“ bezeichnet es persönliche Vergeltung; „zurückzahlen“ vermittelt diese idiomatische Funktion natürlich, während die Körpermetapher erhalten bleibt.
- source_word: פְעֻלָּתָם רִאשֹׁנָה
  choice: ihr früheres Tun
  rationale: פְּעֻלָּה kann Tat, Werk oder den dafür zustehenden Lohn bezeichnen. „Tun“ wahrt den Bezug auf ihr Handeln; „früheres“ gibt רִאשֹׁנָה wieder, ohne eine bestimmte einzelne Tat zu behaupten.
- source_word: עַל חֵיקָם
  choice: in den Schoß
  rationale: Die hebräische Metapher einer unmittelbar und persönlich empfangenen Vergeltung wird in einer verständlichen deutschen Form bewahrt.
theological_decisions:
- issue: Generationenübergreifende Schuld und Gericht
  choice: Die Vergehen der Angesprochenen und ihrer Väter werden gemeinsam genannt; der Text wird ohne systematische Erklärung dieser Verbindung wiedergegeben.
  alternative: Die Aussage ausdrücklich so zu deuten, dass Nachkommen entweder unabhängig von eigener Beteiligung oder ausschließlich wegen ihrer Wiederholung der väterlichen Sünden bestraft werden.
  rationale: Der Vers stellt beide Generationen nebeneinander, erklärt aber hier nicht vollständig, auf welche Weise ihre jeweilige Verantwortung zusammenhängt. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von פְעֻלָּתָם im Gerichtszusammenhang
  choice: „ihr früheres Tun“
  alternative: „ihre Vergeltung“ oder „ihr Lohn“
  rationale: Der Vergeltungssinn wird bereits durch „in den Schoß zurückzahlen“ ausgedrückt. Die gewählte Fassung hält zugleich die lexikalische Alternative in einer Fußnote offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgestalt bewahrt den Anschlusscharakter des Verses und den hebräischen Parallelismus. „Jahwe“ gibt den Gottesnamen wieder. Die Schlussformulierung verbindet eine natürliche deutsche Vergeltungswendung mit der bewahrten Schoß-Metapher.
