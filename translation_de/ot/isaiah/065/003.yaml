  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: de
  text: das Volk, das mich ständig vor meinen Augen zum Zorn reizt, das in den Gärten Opfer schlachtet und auf den Ziegeln[a] Räucherwerk verbrennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich aus Ziegeln errichtete kultische Anlagen oder Altäre; im Hebräischen steht lediglich »auf den Ziegeln«.
    reason: Der konkrete Gegenstand der kultischen Handlung bleibt im hebräischen Ausdruck unausgesprochen.
lexical_decisions:
- source_word: הָעָם
  choice: das Volk
  rationale: Der Artikel bezeichnet eine bestimmte, bereits im Zusammenhang angesprochene Gemeinschaft; »das Volk« bewahrt den kollektiven Sinn.
- source_word: הַמַּכְעִיסִים
  choice: das mich … reizt
  rationale: Der Hifil von כעס bezeichnet ein zum Zorn reizendes oder provozierendes Handeln. »Reizt« erhält diese aktive Bedeutung in einer würdigen, natürlichen Form.
- source_word: עַל־פָּנַי
  choice: ins Angesicht
  rationale: Die Wendung bedeutet wörtlich »auf/vor meinem Angesicht« und trägt hier den Beiklang offener, dreister Missachtung. »Ins Angesicht« bewahrt diese konfrontative Kraft.
- source_word: תָּמִיד
  choice: ständig
  rationale: Das Adverb kennzeichnet ein fortgesetztes beziehungsweise immer wiederkehrendes Verhalten.
- source_word: זֹבְחִים
  choice: Opfer schlachtet
  rationale: זבח bezeichnet im kultischen Zusammenhang das Schlachten eines Opfertiers. Die Wiedergabe wahrt diesen konkreten Sinn, ohne die Art des Opfers näher festzulegen.
- source_word: בַּגַּנּוֹת
  choice: in den Gärten
  rationale: Die schlichte Ortsangabe bleibt erhalten; dass es sich um Stätten unerlaubter Verehrung handelt, ergibt sich aus dem Zusammenhang.
- source_word: וּמְקַטְּרִים
  choice: Räucherwerk verbrennt
  rationale: Der Piel von קטר bezeichnet häufig das Verbrennen von Räucherwerk oder das Darbringen eines Rauchopfers. Die gewählte Formulierung ist im kultischen Zusammenhang klar und natürlich.
- source_word: עַל־הַלְּבֵנִים
  choice: auf den Ziegeln
  rationale: לְבֵנִים bezeichnet ausdrücklich Ziegel; ein Altar oder eine andere kultische Anlage wird nicht genannt. Die formal genaue Wiedergabe bewahrt daher die Unbestimmtheit des hebräischen Ausdrucks.
theological_decisions:
- issue: Art der mit עַל־הַלְּבֵנִים bezeichneten Kultstätte
  choice: auf den Ziegeln
  alternative: auf den Ziegelaltären / auf dem Ziegelwerk
  rationale: Der Zusammenhang mit Opfer und Räucherwerk legt eine kultische Anlage nahe, doch der hebräische Text nennt nur Ziegel. Die Übersetzung ergänzt deshalb keinen Altar und erläutert die wahrscheinliche Deutung in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die partizipialen Handlungen werden als Relativsatz fortgeführt. »Ins Angesicht« erhält die offene Provokation; bei den Ziegeln wird die lexikalische Unbestimmtheit nicht durch die Ergänzung »Altäre« beseitigt.
