  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
translation:
  language: de
  text: Einen festen Sinn[b] bewahrst du in vollkommenem Frieden[a], denn er vertraut auf dich.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Frieden, Frieden“. Die Wiederholung verstärkt den Ausdruck und meint vollen oder vollkommenen Frieden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die innere Ausrichtung“, „die Gesinnung“ oder „die Denkweise“.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen steht kein Pronomen „er“; die maskuline Form „vertraut“ bezieht sich grammatisch auf „Sinn“. Traditionell wird der Vers auch personenbezogen wiedergegeben: „Den Menschen mit festem Sinn bewahrst du in vollkommenem Frieden, denn er vertraut auf dich.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  choice: Sinn
  rationale: יֵצֶר bezeichnet hier die innere Ausrichtung oder Denkhaltung eines Menschen. „Sinn“ ist im Deutschen knapp, würdig und lässt diese anthropologische Weite bestehen.
- source_word: סָמוּךְ
  choice: fest gegründet
  rationale: Das passive Partizip von סמך vermittelt den Gedanken des Gestützt-, Gefestigt- oder Getragenseins. „Fest gegründet“ verbindet Beständigkeit mit Abhängigkeit, ohne das erst später ausdrücklich genannte „auf dich“ vorwegzunehmen.
- source_word: תִּצֹּר
  choice: bewahrst du
  rationale: נצר bedeutet bewahren, behüten oder schützen. „Bewahren“ passt natürlich zur Gabe des Friedens und erhält Gottes aktives Handeln.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: vollkommener Frieden
  rationale: Die Wiederholung verstärkt שָׁלוֹם und bezeichnet umfassenden, ungeteilten Frieden. „Vollkommener Frieden“ gibt diese Intensivierung in natürlichem Deutsch wieder; die wörtliche Form steht in der Fußnote.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aussage. „Denn“ wahrt den poetisch-feierlichen Ton und macht den Begründungszusammenhang deutlich.
- source_word: בְךָ
  choice: auf dich
  rationale: Bei בטח bezeichnet ב den Gegenstand des Vertrauens. Im Deutschen lautet die natürliche Verbindung „auf jemanden vertrauen“.
- source_word: בָּטוּחַ
  choice: er vertraut
  rationale: Die maskuline Form bezieht sich grammatisch auf den maskulinen יֵצֶר („Sinn“). Die Wiedergabe erhält diesen Bezug, ohne einen im Hebräischen nicht ausdrücklich genannten persönlichen Gegenstand in den Hauptsatz einzuführen.
theological_decisions:
- issue: Subjektbezug und anthropologische Ausdrucksweise
  choice: Der innere Sinn wird unmittelbar als das Bewahrte bezeichnet.
  alternative: Den Menschen, dessen Sinn fest auf Gott gerichtet ist, bewahrt Gott in Frieden.
  rationale: Im Hebräischen steht יֵצֶר („Sinn, innere Ausrichtung“) selbst in der Konstruktion; ein ausdrückliches „ihn“ oder „den Menschen“ fehlt. Die Übersetzung bewahrt diese ungewöhnliche, aber bedeutungsvolle Ausdrucksweise.
- issue: Wiedergabe des verdoppelten שָׁלוֹם
  choice: vollkommener Frieden
  alternative: Frieden, Frieden
  rationale: Die Verdoppelung wirkt verstärkend. Der Haupttext vermittelt ihre Bedeutung idiomatisch; die Fußnote erhält zugleich die hebräische Form und poetische Textur.
- issue: Bezug von סָמוּךְ auf Gott
  choice: fest gegründet
  alternative: fest auf dich gerichtet
  rationale: Das Hebräische nennt bei סָמוּךְ keinen eigenen präpositionalen Bezug; „auf dich“ erscheint erst bei „vertraut“. Daher wird die naheliegende Beziehung zu Gott nicht schon in die erste Satzhälfte hineingeschrieben.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Klang. Die ungewöhnliche Personifizierung des „Sinnes“ bleibt als Merkmal des hebräischen Wortlauts erhalten; Fußnoten erläutern die wörtliche Wiederholung und die geläufigere personenbezogene Alternative.
