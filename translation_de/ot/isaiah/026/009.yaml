  source_fidelity: Die Übersetzung gibt die poetische Parallelität von נַפְשִׁי und רוּחִי, die Nacht-/Morgen-Bildlichkeit, die Gerichtsterminologie und den universalen Bezug von יֹשְׁבֵי תֵבֵל insgesamt treffend wieder. Das hebräische Perfekt אִוִּיתִיךָ sollte im Deutschen jedoch nicht durch ein schlichtes Präsens nivelliert werden. Außerdem sollte die Fußnote zur verbarmen Wendung מִשְׁפָּטֶיךָ לָאָרֶץ ausdrücklich kenntlich machen, dass das ergänzte Verb im Hebräischen nicht steht.
