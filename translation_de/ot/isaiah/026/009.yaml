source:
  edition: WLC
  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: de
  text: Nach dir hat sich meine Seele in der Nacht gesehnt; ja, mein Geist in meinem Innern sucht dich am frühen Morgen.[a] Denn wenn deine Gerichte über die Erde kommen,[b] lernen die Bewohner des Erdkreises Gerechtigkeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sucht dich eifrig«; das hebräische Verb kann das Suchen am frühen Morgen und daraus abgeleitet ein eifriges Suchen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »wenn deine Gerichte auf der Erde [sind]«; ein Verb ist nicht ausgedrückt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das Rechte«; das hebräische Wort kann Gerechtigkeit, Recht und richtiges Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt die poetische Rede vom inneren Selbst und die Parallele zu »mein Geist«, ohne den Ausdruck zu einem bloßen »ich« einzuebnen.
- source_word: אִוִּיתִיךָ
  choice: sehnt sich nach dir
  rationale: Das Verb bezeichnet starkes Verlangen. »Sich sehnen nach« ist im heutigen Deutsch natürlich und trägt den poetischen Ton.
- source_word: בַּלַּיְלָה
  choice: in der Nacht
  rationale: Gibt die Zeitangabe unmittelbar wieder und erhält den poetischen Gegensatz zum frühen Morgen.
- source_word: אַף
  choice: ja
  rationale: Das bekräftigende und weiterführende אַף wird knapp und idiomatisch wiedergegeben.
- source_word: רוּחִי בְקִרְבִּי
  choice: mein Geist in meinem Innern
  rationale: Bewahrt sowohl רוּחַ als auch die ausdrückliche Innenperspektive von בְקִרְבִּי.
- source_word: אֲשַׁחֲרֶךָּ
  choice: sucht dich am frühen Morgen
  rationale: Die Wiedergabe erhält das mit שׁחר verbundene Bild des frühen Suchens; die ebenfalls mögliche übertragene Bedeutung des eifrigen Suchens steht in der Fußnote.
- source_word: כִּי כַּאֲשֶׁר
  choice: Denn wenn
  rationale: Gibt sowohl den begründenden Anschluss als auch den zeitlichen beziehungsweise allgemeinen Zusammenhang wieder.
- source_word: מִשְׁפָּטֶיךָ לָאָרֶץ
  choice: deine Gerichte über die Erde kommen
  rationale: Die knappe, verblose hebräische Wendung wird in natürlichem Deutsch wiedergegeben, ohne genauer festzulegen, in welcher Form Gottes Gerichte eintreten; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Der deutsche Ausdruck kann hier sowohl rechtes Handeln als auch den Aspekt des Rechts umfassen und entspricht der ethisch-juridischen Spannweite von צֶדֶק.
- source_word: לָמְדוּ
  choice: lernen
  rationale: Das Präsens gibt den allgemeinen, spruchartigen Sachverhalt im Deutschen natürlich wieder.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: die Bewohner des Erdkreises
  rationale: »Erdkreis« bewahrt den poetischen und universalen Sinn der bewohnten Welt תֵבֵל.
theological_decisions:
- issue: Bedeutung von צֶדֶק im Zusammenhang mit Gottes Gerichten
  choice: Gerechtigkeit
  alternative: das Rechte
  rationale: »Gerechtigkeit« wahrt die Verbindung von moralischer Richtigkeit und Recht, ohne den Ausdruck ausschließlich auf persönliche Frömmigkeit oder staatliche Rechtspflege festzulegen.
- issue: Art des Erscheinens der göttlichen Gerichte
  choice: über die Erde kommen
  alternative: auf der Erde sind
  rationale: Der hebräische Satz enthält an dieser Stelle kein ausdrückliches Verb. Die Hauptfassung bietet ein verständliches deutsches Satzgefüge; die Fußnote erhält die formale Offenheit der Wendung.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Parallelität von »meine Seele« und »mein Geist« sowie der zeitliche Bogen von Nacht zu frühem Morgen bleiben erhalten. »Erdkreis« hebt den poetischen Charakter und die universale Reichweite hervor.
