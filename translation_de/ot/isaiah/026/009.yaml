  terminology: »Seele«, »Geist«, »Gerichte« und »Gerechtigkeit« sind sachgerecht. »Gerechtigkeit« bewahrt die ethische und rechtliche Spannweite von צֶדֶק; die Fußnote erhält mit »das Rechte« eine mögliche weniger abstrakte Nuance. Die Hauptfassung »über die Erde kommen« ist als natürliche Ausfaltung der knappen hebräischen Orts-/Richtungsangabe vertretbar, sofern die Fußnote die fehlende verbale Bestimmung transparent macht.
