  source_fidelity: Die Übersetzung gibt die Wiederholung von יָסַפְתָּ לַגּוֹי angemessen wieder. „Das Volk“ ist für גּוֹי im poetischen deutschen Kontext natürlich, ohne den Bezug auf eine konkrete Nation aufzugeben. „Du bist verherrlicht worden“ ist eine mögliche, grammatisch offene Wiedergabe von נִכְבָּדְתָּ. „... alle Grenzen des Landes weit hinausgeschoben“ trifft die kontextuell naheliegende kausative Raumvorstellung von רִחַקְתָּ und bewahrt mit der Fußnote die mögliche globale Lesart von אָרֶץ.
