id: ISA.26.15
reference: Isaiah 26:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: de
  text: Du hast das Volk vermehrt, Jahwe, du hast das Volk vermehrt; du bist verherrlicht worden[a] und hast alle Grenzen des Landes weit hinausgeschoben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „du hast Ruhm gewonnen“, „du bist geehrt worden“ oder „du hast dich als herrlich erwiesen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „alle Enden der Erde“. Das hebräische Wort kann „Enden“, „Ränder“ oder „Grenzen“ bedeuten; im Zusammenhang sind wahrscheinlich die Grenzen des Landes gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ לַגּוֹי
  choice: du hast das Volk vermehrt
  rationale: יסף mit ל und einem Kollektiv bezeichnet hier eine Vermehrung oder Vergrößerung. „Das Volk vermehrt“ gibt die wiederholte Aussage knapp und verständlich wieder; „Volk“ ist im Deutschen für גּוֹי in diesem poetischen Zusammenhang natürlicher als „Nation“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נִכְבָּדְתָּ
  choice: du bist verherrlicht worden
  rationale: 'Die Nifalform von כבד lässt sich passiv beziehungsweise resultativ verstehen: Jahwe ist als herrlich erwiesen oder geehrt worden. Die Formulierung bewahrt die im Hebräischen nicht ausdrücklich genannte handelnde Instanz.'
- source_word: רִחַקְתָּ
  choice: du hast … weit hinausgeschoben
  rationale: Die Kausativbedeutung „fern machen“ wird im Zusammenhang mit Grenzen idiomatisch als deren Hinausschieben ausgedrückt und entspricht dem Gedanken der Vergrößerung.
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: alle Grenzen des Landes
  rationale: קצה bezeichnet Enden, Ränder oder Grenzen. Der Zusammenhang von Volksvermehrung und räumlicher Ausdehnung spricht hier für die Grenzen des Landes; die globalere Deutung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bezugsbereich von אָרֶץ
  choice: Land
  alternative: Erde
  rationale: Das Vermehren des Volkes und das Weithinausschieben seiner Grenzen legen einen territorialen Bezug nahe. Da אָרֶץ auch „Erde“ bedeuten kann, wird diese Möglichkeit nicht ausgeschlossen, sondern als Alternative vermerkt.
- issue: Nuance von נִכְבָּדְתָּ
  choice: du bist verherrlicht worden
  alternative: du hast Ruhm gewonnen / du hast dich als herrlich erwiesen
  rationale: Die passive Wiedergabe wahrt die grammatische Offenheit der Nifalform, ohne festzulegen, ob die Herrlichkeit zugeschrieben, gewonnen oder reflexiv erwiesen wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Wiederholung. „Weit hinausgeschoben“ macht das hebräische Bild natürlicher verständlich als das abstraktere „entfernt“. Die Fußnotenmarker stehen bei den jeweils erläuterten Ausdrücken.
