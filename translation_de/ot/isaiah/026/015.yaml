  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigenname wieder. „Verherrlicht“ und „Grenzen des Landes“ sind im Register des prophetischen Gebetstextes passend. Die deutschen Fußnoten sind sachlich, verständlich und nicht konfessionell festlegend.
