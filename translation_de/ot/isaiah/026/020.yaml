id: ISA.26.20
reference: Isaiah 26:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֵ֤ךְ עַמִּ/י֙ בֹּ֣א בַ/חֲדָרֶ֔י/ךָ וּֽ/סְגֹ֥ר דלתי/ך בַּעֲדֶ֑/ךָ חֲבִ֥י כִ/מְעַט רֶ֖גַע עַד יעבור זָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: de
  text: Geh, mein Volk, tritt in deine Kammern[a] und schließ deine Türen hinter dir. Verbirg dich für einen kurzen Augenblick, bis der Zorn[b] vorübergegangen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine inneren Räume“. Das hebräische Wort bezeichnet Räume im Inneren eines Hauses oder private Kammern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Empörung“ beziehungsweise „der Grimm“. Der hebräische Text sagt hier nicht ausdrücklich, wessen Zorn gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Geh
  rationale: Der Qal-Imperativ richtet einen unmittelbaren Aufruf an das als Einheit angesprochene Volk.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die persönliche prophetische Anrede wird direkt und in ihrer bündischen Klangfarbe bewahrt.
- source_word: בֹּא בַחֲדָרֶיךָ
  choice: tritt in deine Kammern
  rationale: בוא bezeichnet hier das Hineingehen; חדר meint einen abgeschlossenen Raum, oft eine innere oder private Kammer.
- source_word: וּסְגֹר דלתיך בַּעֲדֶךָ
  choice: und schließ deine Türen hinter dir
  rationale: Die deutsche Wendung gibt das Verschließen der Türen nach dem Eintreten natürlich wieder.
- source_word: חֲבִי
  choice: Verbirg dich
  rationale: Der Singular passt im Deutschen zur kollektiven Anrede „mein Volk“ und bewahrt die Singularformen des hebräischen Satzes.
- source_word: כִמְעַט רֶגַע
  choice: für einen kurzen Augenblick
  rationale: Die Wendung bezeichnet eine sehr begrenzte Zeitspanne; die Formulierung ist knapp, verständlich und würdevoll.
- source_word: עַד יַעֲבוֹר
  choice: bis … vorübergegangen ist
  rationale: עבר stellt den Zorn als etwas dar, das vorbeigeht; das Perfekt nach „bis“ markiert dessen vollständiges Vorübergehen.
- source_word: זָעַם
  choice: der Zorn
  rationale: „Zorn“ trägt das Gewicht des prophetischen Gerichtskontexts, ohne einen im Vers nicht ausdrücklich genannten Urheber hinzuzufügen.
theological_decisions:
- issue: Urheber und Bedeutung von זָעַם
  choice: der Zorn
  alternative: die Empörung; der Grimm
  rationale: Der Zusammenhang legt göttliches Gericht nahe, doch der hebräische Vers nennt den Urheber nicht ausdrücklich. Die Übersetzung lässt ihn daher unausgesprochen und wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die durchgehende Singularanrede folgt dem Hebräischen und ist bei dem Kollektiv „mein Volk“ im Deutschen natürlich.
