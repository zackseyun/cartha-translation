source:
  edition: WLC
  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: de
  text: Deine Toten werden leben; meine Leichname werden auferstehen.[a] Wacht auf und jubelt, die ihr im Staub wohnt! Denn dein Tau ist ein Tau des Lichts,[b] und die Erde wird die Verstorbenen auswerfen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen „mein Leichnam“ mit einem Suffix der 1. Person Singular; das folgende Verb steht jedoch im Plural. Daher kann die Wendung kollektiv als „meine Leichname“ verstanden werden. Möglich ist auch: „Mein Leichnam wird auferstehen.“'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich etwa „Tau der Lichter“. Die schwierige hebräische Wendung kann auch „Tau des Lichts“ oder „lichtvoller, strahlender Tau“ bedeuten und möglicherweise lebenspendenden Tau bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Totengeister“. Das hebräische רְפָאִים bezeichnet hier die Verstorbenen, die als schattenhafte Bewohner des Totenreichs vorgestellt werden. „Auswerfen“ kann auch im Sinn von „herausgeben“ oder „hervorbringen“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  choice: deine Toten
  rationale: Der konstruktusartige Plural mit Suffix der 2. Person Singular wird direkt und im Deutschen idiomatisch wiedergegeben; die Anrede bleibt ohne Festlegung auf Gott, Zion oder eine andere Bezugsgröße erhalten.
- source_word: נְבֵלָתִי
  choice: meine Leichname
  rationale: נְבֵלָה bezeichnet einen Leichnam oder Kadaver. Der masoretische Konsonantentext trägt ein Suffix der 1. Person Singular; der folgende Plural יְקוּמוּן legt hier einen kollektiven beziehungsweise pluralischen Sinn nahe. Die bewusst ungewöhnliche Formulierung bewahrt sowohl den Besitzbezug als auch den Unterschied zu מֵתֶיךָ.
- source_word: יְקוּמוּן
  choice: werden auferstehen
  rationale: קום bedeutet grundsätzlich aufstehen oder sich erheben. Im unmittelbaren Zusammenhang mit Toten und Staubbewohnern gibt „auferstehen“ die konkrete Todes- und Lebensbildsprache natürlich wieder, ohne ihre mögliche gemeinschaftlich-nationale Dimension auszuschließen.
- source_word: הָקִיצוּ
  choice: Wacht auf
  rationale: Der Imperativ ruft die im Staub Wohnenden aus einem todähnlichen Schlaf. „Wacht auf“ ist gegenwärtiges, verständliches Deutsch und erhält den direkten Zuruf.
- source_word: וְרַנְּנוּ
  choice: und jubelt
  rationale: רנן bezeichnet lauten freudigen Jubel, häufig auch jubelndes Singen. „Jubelt“ ist knapp, lebendig und lässt die genaue Ausdrucksform offen.
- source_word: שֹׁכְנֵי עָפָר
  choice: die ihr im Staub wohnt
  rationale: Die partizipiale Wendung wird als direkte Anrede wiedergegeben. Das Bild des Staubes als Bereich der Toten bleibt unverändert erhalten.
- source_word: טַל אוֹרֹת
  choice: ein Tau des Lichts
  rationale: Die schwierige Genitivverbindung wird nahe am Hebräischen wiedergegeben. Das deutsche Singularwort „Licht“ ist idiomatischer als „Lichter“, während die Fußnote den formalen Plural und mögliche Deutungen transparent macht.
- source_word: רְפָאִים
  choice: die Verstorbenen
  rationale: Hier bezeichnet רְפָאִים die Toten beziehungsweise schattenhaften Bewohner der Unterwelt, nicht das gleichnamige Volk. „Die Verstorbenen“ ist verständlich, ohne das Bild zu stark zu dogmatisieren; „Totengeister“ wird als Alternative vermerkt.
- source_word: תַּפִּיל
  choice: wird … auswerfen
  rationale: 'Der Hifil von נפל hat hier ein kraftvolles Bild: Die Erde lässt die Toten aus sich herausfallen beziehungsweise gibt sie frei. „Auswerfen“ bewahrt diese Härte besser als das glättende „hervorbringen“.'
theological_decisions:
- issue: Auferstehungssprache in poetisch-prophetischem Zusammenhang
  choice: Die Aussagen werden als wirkliche Todes- und Auferstehungsbilder wiedergegeben, ohne sie ausdrücklich auf individuelle leibliche Auferstehung zu beschränken.
  alternative: Die Worte ausschließlich als Metapher für die nationale Wiederherstellung Israels wiederzugeben.
  rationale: Die Folge von Leben, Auferstehen, Erwachen aus dem Staub und dem Auswerfen der Verstorbenen durch die Erde trägt starke Auferstehungssprache. Zugleich steht sie in einer gemeinschaftlichen prophetischen Hoffnung. Die Übersetzung erhält beide Ebenen, statt eine davon auszuschließen.
- issue: Sprecherbezug bei נְבֵלָתִי
  choice: Das Possessiv der 1. Person bleibt als „meine“ im Haupttext stehen.
  alternative: Zu „deine Leichname“, „ihre Leichname“ oder schlicht „die Toten“ zu glätten.
  rationale: Der masoretische Text bietet ein Suffix der 1. Person Singular. Da die Identität des Sprechers und das Verhältnis zum vorausgehenden „deine“ umstritten sind, wird die Spannung nicht harmonisiert.
- issue: Identität der רְפָאִים
  choice: Als Verstorbene im Totenbereich verstanden.
  alternative: Als ethnische Refaïter oder ausschließlich als körperlose Geister verstanden.
  rationale: Der Kontext von Toten, Leichnamen, Staub und Erde weist auf die Bewohner des Totenreichs. Die Übersetzung vermeidet dennoch eine detaillierte Lehre über ihren Zustand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die ungewöhnliche Formulierung „meine Leichname“ ist bewusst textnah und wird durch eine Fußnote erklärt. „Auferstehen“ und „auswerfen“ bewahren die kräftige Bildsprache; die schwer deutbare Licht-Tau-Verbindung sowie רְפָאִים werden nicht stillschweigend vereindeutigt.
