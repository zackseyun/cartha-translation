  source_fidelity: 'Der Text gibt die hebräische Abfolge und die wesentlichen Bezüge zuverlässig wieder: „deine Toten“ (מֵתֶיךָ), das spannungsvolle „meine Leichname“ bei singularischem Suffix und pluralischem Verb, der Weckruf an die Staubbewohner sowie das Auswerfen der רְפָאִים durch die Erde. „Tau des Lichts“ ist eine idiomatische, vorsichtige Wiedergabe der schwierigen pluralischen Verbindung טַל אוֹרוֹת; die Fußnote dokumentiert den wörtlichen Plural und die Auslegungsbandbreite.'
