source:
  edition: WLC
  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: de
  text: Wir waren schwanger[a], wir wanden uns in Wehen; wir gebaren gleichsam Wind[b]. Keine Rettungstaten vollbrachten wir auf Erden, und die Bewohner des Erdkreises fielen nicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir empfingen.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann „Wind“, „Atem“ oder „Geist“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das Verb bedeutet gewöhnlich „fallen“. Im Zusammenhang mit der Geburtsmetapher wird es auch als „zur Welt kommen“ oder „geboren werden“ verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: wir waren schwanger
  rationale: Das Qal Perfekt von הרה bezeichnet Empfangen beziehungsweise Schwangersein. „Wir waren schwanger“ führt die anschließende Geburtsmetaphorik natürlich fort; „wir empfingen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: חַלְנוּ
  choice: wir wanden uns in Wehen
  rationale: חול/חיל beschreibt im Geburtszusammenhang die Schmerzen und das Sichwinden während der Wehen. Die Formulierung ist anschaulich, gegenwärtig und nicht archaisch.
- source_word: כְּמוֹ
  choice: gleichsam
  rationale: כְּמוֹ kennzeichnet hier einen vergleichenden beziehungsweise einschränkenden Ausdruck. „Gleichsam“ gibt den bildhaften, leicht ironischen Charakter knapp wieder.
- source_word: יָלַדְנוּ
  choice: wir gebaren
  rationale: ילד ist das übliche Verb für das Gebären. „Gebaren“ bewahrt die direkte Geburtsbildlichkeit und passt zum gehobenen poetischen Register.
- source_word: רוּחַ
  choice: Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Im Bild einer ergebnislosen Geburt und angesichts der anschließend beklagten Wirkungslosigkeit bezeichnet „Wind“ am ehesten das nichtige Ergebnis, ohne eine pneumatologische Aussage einzutragen.
- source_word: יְשׁוּעֹת בַּל נַעֲשֶׂה אֶרֶץ
  choice: Keine Rettung brachten wir auf Erden zustande
  rationale: Der Plural יְשׁוּעֹת bezeichnet Rettungen beziehungsweise rettende Taten; im Deutschen ist der kollektive Singular „Rettung“ idiomatisch. עשה wird mit „zustande bringen“ als Bewirken wiedergegeben. „Auf Erden“ nimmt אֶרֶץ räumlich und im Parallelismus mit תֵבֵל universal auf.
- source_word: יִפְּלוּ
  choice: kamen … zur Welt
  rationale: נפל bedeutet gewöhnlich „fallen“, kann hier aber im fortlaufenden Geburtsbild das Hervorkommen beziehungsweise Geborenwerden bezeichnen. Die kontextuelle Wiedergabe steht im Haupttext; die gewöhnliche lexikalische Bedeutung wird in der Fußnote offengelegt.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: die Bewohner des Erdkreises
  rationale: Die Wendung bezeichnet die Menschen, die die bewohnte Welt bevölkern. „Erdkreis“ wahrt den poetischen Unterschied zwischen אֶרֶץ und תֵבֵל.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Geburtsmetapher
  choice: Wind
  alternative: Atem oder Geist
  rationale: 'Der Zusammenhang beklagt vergebliche Mühe: Schwangerschaft und Wehen führen zu keinem rettenden Ergebnis. „Geist“ könnte eine positive pneumatologische Deutung nahelegen, die der Text nicht verlangt; die Mehrdeutigkeit wird dennoch in der Fußnote bewahrt.'
- issue: Deutung von יִפְּלוּ im letzten Satzglied
  choice: kamen nicht zur Welt
  alternative: fielen nicht / kamen nicht zu Fall
  rationale: Die ungewöhnliche Verwendung steht unmittelbar im ausgedehnten Bild von Schwangerschaft, Wehen und Geburt, sodass eine geburtsbezogene Deutung kontextuell stark ist. Da die gewöhnliche Bedeutung des Verbs „fallen“ lautet und der Ausdruck umstritten bleibt, wird diese Spannung ausdrücklich in einer Fußnote erhalten.
- issue: Reichweite von אֶרֶץ
  choice: auf Erden
  alternative: im Land / für das Land
  rationale: Der Parallelismus mit „Bewohner des Erdkreises“ begünstigt die weitere Bedeutung „Erde“. Die engere Bedeutung „Land“ bleibt sprachlich möglich, doch der Haupttext wahrt hier die globale poetische Perspektive.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Gebaren“ und „Erdkreis“ halten den prophetisch-poetischen Ton, während Satzbau und übriger Wortschatz allgemein verständlich bleiben. Das ergänzende „nur“ verdeutlicht idiomatisch die Ergebnislosigkeit der Geburt, ohne einen neuen Gegenstand einzuführen.
