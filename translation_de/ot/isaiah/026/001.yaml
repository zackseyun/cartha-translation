  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: de
  text: 'An jenem Tag wird dieses Lied im Land Juda gesungen werden: »Wir haben eine starke Stadt[a]; er macht Rettung zu Mauern und Schutzwall[b].[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir haben eine befestigte Stadt.«'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine äußere Verteidigungsanlage; möglich ist auch »Wall« oder traditionell »Bollwerk«.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »er bestimmt Rettung zu Mauern und Schutzwall«. Das Subjekt von »macht/bestimmt« ist im Hebräischen nicht ausdrücklich genannt; im Zusammenhang wird gewöhnlich Gott als der Handelnde verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die übliche prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben.
- source_word: יוּשַׁר
  choice: wird … gesungen werden
  rationale: Die passive Verbform wird bewahrt, ohne einen Sänger zu ergänzen.
- source_word: הַשִּׁיר הַזֶּה
  choice: dieses Lied
  rationale: Gibt den hebräischen Ausdruck direkt wieder, ohne deutende Ergänzung wie »Loblied«.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: אֶרֶץ wird ausdrücklich wiedergegeben; »Juda« bezeichnet das historische Land.
- source_word: עִיר עָז
  choice: eine starke Stadt
  rationale: Bewahrt die knappe Beschreibung der Stadt; »befestigte Stadt« bleibt als mögliche kontextuelle Wiedergabe in der Fußnote erhalten.
- source_word: לָנוּ
  choice: Wir haben
  rationale: Der Dativ in der verblosen hebräischen Aussage wird im Deutschen idiomatisch als Besitzkonstruktion ausgedrückt.
- source_word: יְשׁוּעָה
  choice: Rettung
  rationale: Bezeichnet hier Gottes rettendes Handeln als Schutz der Stadt und ist im heutigen Deutsch unmittelbar verständlich.
- source_word: יָשִׁית
  choice: er setzt … ein
  rationale: Gibt das Setzen beziehungsweise Bestimmen für eine Funktion wieder und lässt das nicht ausdrücklich genannte Subjekt unbenannt.
- source_word: חוֹמוֹת
  choice: Mauern
  rationale: Bewahrt den Plural des hebräischen Wortes.
- source_word: וָחֵל
  choice: und Schutzwall
  rationale: חֵל bezeichnet eine äußere Verteidigungsanlage; »Schutzwall« ist konkreter und heute verständlicher als das altertümliche »Bollwerk«.
theological_decisions:
- issue: Subjekt von יָשִׁית (»er setzt ein«)
  choice: Das implizite maskuline Singularsubjekt wird mit »er« wiedergegeben, ohne es ausdrücklich als Gott oder den HERRN zu benennen.
  alternative: Den wahrscheinlich gemeinten Handelnden ausdrücklich als Gott oder den HERRN benennen; alternativ unpersönlich mit »man« übersetzen.
  rationale: Im Zusammenhang ist Gott wahrscheinlich der Handelnde, doch der hebräische Satz nennt das Subjekt nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung und damit die genuine Offenheit des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, poetischer Satzstruktur. Das doppelte Passiv in »wird … gesungen werden« ist grammatisch schwerer als eine unpersönliche Aktivform, bewahrt jedoch die Verbform und die Zukunftsaussage des Hebräischen. »Schutzwall« vermeidet das heute wenig gebräuchliche »Bollwerk«.
