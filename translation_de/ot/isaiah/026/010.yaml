  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: de
  text: Auch wenn dem Gottlosen Gnade erwiesen wird,[a] lernt er nicht, was recht ist. Im Land der Geradheit handelt er unrecht und erkennt die Hoheit Jahwes nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn dem Gottlosen Gnade erwiesen wird“. Der hebräische Anfang kann auch als Bedingungssatz verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „sieht die Hoheit Jahwes nicht“. „Sehen“ kann hier das Wahrnehmen oder Anerkennen bezeichnen. „Hoheit“ kann auch mit „Erhabenheit“ oder „Majestät“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן רָשָׁע
  choice: Auch wenn dem Gottlosen Gnade erwiesen wird
  rationale: Das Hophal von חנן bezeichnet das Erweisen von Gunst oder Gnade. Die konzessive Wiedergabe passt zum Gegensatz des Verses; der generische Singular רָשָׁע bleibt als „dem Gottlosen“ erhalten.
- source_word: בַּל לָמַד צֶדֶק
  choice: lernt er nicht, was recht ist
  rationale: למד bedeutet hier „lernen“. צֶדֶק umfasst Gerechtigkeit und das moralisch Rechte; „was recht ist“ ist im modernen Deutsch natürlich und bewahrt diese Breite.
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: Im Land der Geradheit
  rationale: נְכֹחוֹת bezeichnet Geradheit, Aufrichtigkeit oder rechte Ordnung. „Land der Geradheit“ erhält das auffällige Bild des Hebräischen, ohne es auf bloße Geografie zu reduzieren.
- source_word: יְעַוֵּל
  choice: handelt er unrecht
  rationale: Das Piel von עול bezeichnet unrechtes oder verkehrtes Handeln. Die Formulierung ist klar und bildet einen bewussten Gegensatz zu „was recht ist“.
- source_word: וּבַל יִרְאֶה
  choice: und erkennt … nicht
  rationale: ראה heißt wörtlich „sehen“, kann hier jedoch das Wahrnehmen oder Anerkennen bezeichnen. „Erkennt“ gibt den gemeinten geistlich-moralischen Sinn im Deutschen natürlich wieder.
- source_word: גֵּאוּת יְהוָה
  choice: die Hoheit Jahwes
  rationale: גֵּאוּת bezeichnet Hoheit, Erhabenheit oder Majestät. „Hoheit“ wahrt die Vorstellung göttlicher Erhabenheit; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Konzessive oder konditionale Bedeutung des Anfangssatzes
  choice: 'Konzessiv: „Auch wenn dem Gottlosen Gnade erwiesen wird“'
  alternative: 'Konditional: „Wenn dem Gottlosen Gnade erwiesen wird“'
  rationale: Der Zusammenhang stellt die erwiesene Gnade der bleibenden Unbelehrbarkeit des Gottlosen gegenüber. Die konzessive Lesart gibt diesen rhetorischen Gegensatz am besten wieder, während die konditionale Möglichkeit in einer Fußnote erhalten bleibt.
- issue: Bedeutung von „sehen“ in Bezug auf die Hoheit Jahwes
  choice: „erkennt … nicht“
  alternative: „sieht … nicht“
  rationale: Der Satz spricht wahrscheinlich nicht nur von optischem Sehen, sondern vom Wahrnehmen und Anerkennen der Hoheit Jahwes. Die Alternative wird in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität zwischen dem Nichtlernen des Rechten und dem unrechten Handeln bleibt deutlich; „Land der Geradheit“ bewahrt bewusst die markante Bildsprache des Hebräischen.
