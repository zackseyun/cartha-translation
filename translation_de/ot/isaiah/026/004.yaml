source:
  edition: WLC
  text: בִּטְח֥וּ בַֽ/יהוָ֖ה עֲדֵי עַ֑ד כִּ֚י בְּ/יָ֣הּ יְהוָ֔ה צ֖וּר עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/004.yaml
  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: de
  text: Vertraut für immer auf den HERRN! Denn in Jah, dem HERRN,[a] ist ein Fels für alle Zeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Jah, der HERR, ist ein Fels für alle Zeiten.“ „Jah“ ist eine Kurzform des hebräischen Gottesnamens.'
    reason: Die Fußnote dokumentiert sowohl die mögliche Deutung der Präposition בְּ als Gleichsetzung als auch die Bedeutung der weniger geläufigen Namensform „Jah“.
lexical_decisions:
- source_word: בִּטְחוּ
  choice: Vertraut
  rationale: Der hebräische Imperativ steht im Plural; „Vertraut“ gibt die an eine Gemeinschaft gerichtete Aufforderung wieder.
- source_word: עֲדֵי עַד
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer und wird in natürlichem, heutigem Deutsch wiedergegeben.
- source_word: בְּיָהּ יְהוָה
  choice: in Jah, dem HERRN
  rationale: Das ungewöhnliche בְּ („in“) bleibt erhalten; „Jah“ gibt die Kurzform des Gottesnamens wieder, während „HERR“ der geläufigen deutschen Wiedergabekonvention für יהוה folgt.
- source_word: צוּר עוֹלָמִים
  choice: ein Fels für alle Zeiten
  rationale: Die poetische Metapher „Fels“ und der wörtliche Zeitbezug des Plurals עוֹלָמִים werden bewahrt; die Formulierung bezeichnet dauerhafte Sicherheit und Beständigkeit.
theological_decisions:
- issue: Deutung des בְּ vor יָהּ
  choice: „in Jah, dem HERRN, ist“
  alternative: „Jah, der HERR, ist“
  rationale: Das Hebräische kann als Aussage über Sicherheit „in“ Gott oder mit einem sogenannten Beth essentiae als Gleichsetzung verstanden werden. Der Haupttext bewahrt die ausdrücklich vorhandene Präposition und vermeidet, die Mehrdeutigkeit stillschweigend aufzulösen.
- issue: Wiedergabe der Gottesnamen יָהּ und יהוה
  choice: „Jah, dem HERRN“
  alternative: „Jah, Jahwe“
  rationale: Die Unterscheidung zwischen Kurzform und vollem Gottesnamen bleibt sichtbar, ohne eine konfessionell markierte Aussprache des Tetragramms im Haupttext festzulegen.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Die leicht ungewöhnliche Wendung „in Jah … ist ein Fels“ spiegelt bewusst die markierte hebräische Formulierung wider.
