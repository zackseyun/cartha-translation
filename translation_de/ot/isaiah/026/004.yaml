  source_fidelity: Der Pluralimperativ „Vertraut“ gibt בִּטְחוּ korrekt wieder. „für immer“ entspricht עֲדֵי עַד. Die markierte und syntaktisch schwierige Folge בְּיָהּ יְהוָה wird mit „in Jah, dem HERRN“ bewusst transparent erhalten, ohne die mögliche gleichsetzende Lesart im Haupttext vorzuziehen. „ein Fels für alle Zeiten“ wahrt die Metapher צוּר sowie den Dauerbezug von עוֹלָמִים.
