  terminology: „HERR“ als Wiedergabe von יהוה folgt der üblichen deutschen Bibelkonvention; „Jah“ macht die Kurzform יָהּ sichtbar. „Fels“ ist eine angemessene, nicht ausdeutende Wiedergabe von צוּר. Die Fußnote dokumentiert die relevante syntaktische Alternative und erklärt den Namen sachlich.
