source:
  edition: WLC
  text: פִּתְח֖וּ שְׁעָרִ֑ים וְ/יָבֹ֥א גוֹי צַדִּ֖יק שֹׁמֵ֥ר אֱמֻנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: de
  text: Öffnet die Tore, damit ein gerechtes Volk einzieht, das Treue bewahrt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wahrheit bewahrt“ oder „das am Glauben festhält“. Das hebräische Wort kann je nach Zusammenhang Treue, Zuverlässigkeit, Wahrheit oder Glauben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Öffnet
  rationale: Der Qal-Imperativ Plural von פתח ist eine unmittelbare Aufforderung. „Öffnet“ ist im Deutschen knapp und natürlich.
- source_word: שְׁעָרִים
  choice: die Tore
  rationale: Das Substantiv steht im Plural. Obwohl im Hebräischen kein Artikel ausgedrückt ist, verweist die Aufforderung im Kontext natürlich auf die Tore der Stadt.
- source_word: וְיָבֹא
  choice: damit … einzieht
  rationale: Die Verbindung aus Konjunktion und Imperfekt bezeichnet nach dem Imperativ zweck- oder folgeartig das gewünschte Eintreten. „Einzieht“ passt zur Tor- und Stadtvorstellung.
- source_word: גוֹי צַדִּיק
  choice: ein gerechtes Volk
  rationale: גוי bezeichnet hier ein Volk beziehungsweise eine Nation; צדיק charakterisiert es als gerecht. Da die hebräische Wortgruppe keinen Artikel trägt, wahrt „ein gerechtes Volk“ diese Unbestimmtheit.
- source_word: שֹׁמֵר
  choice: das … bewahrt
  rationale: Das Qal-Partizip beschreibt das Volk attributiv. Der Relativsatz gibt diese Funktion im modernen Deutschen natürlich wieder.
- source_word: אֱמֻנִים
  choice: Treue
  rationale: Die abstrakte Pluralform aus der Wurzel אמן kann beständige Treue, Zuverlässigkeit, Wahrheit oder Glauben bezeichnen. „Treue“ erfasst hier die Haltung verlässlicher Beständigkeit, ohne die möglichen Nebenbedeutungen auszuschließen.
theological_decisions:
- issue: Bedeutung von אֱמֻנִים als Kennzeichen des gerechten Volkes
  choice: Treue
  alternative: Wahrheit; Glauben
  rationale: „Treue“ bewahrt den ethisch-theologischen Gedanken beständiger Verlässlichkeit, ohne den Ausdruck auf subjektiven Glauben oder auf propositionale Wahrheit zu verengen. Die echte lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Aufruf und seinem Zweck-/Folgesatz; „Treue bewahrt“ ist bewusst leicht gehoben, aber verständlich und hält die substantivische Ausdrucksweise des Ausgangstextes fest.
