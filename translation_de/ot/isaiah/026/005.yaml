  source_fidelity: Die Grundstruktur und die unbenannte, möglicherweise appositionelle Nennung der Stadt entsprechen dem Hebräischen gut. „Hinabstürzen“ ist jedoch stärker und gewaltsamer als יַשְׁפִּילֶנָּה / יַשְׁפִּילָהּ („niedrig machen, erniedrigen“). Außerdem wirkt „sie bis zum Staub gelangen lassen“ im Deutschen semantisch und idiomatisch unerquicklich, obwohl es den Kausativ formal abzubilden versucht.
  naturalness: „Die Bewohner der Höhe“ und die poetische Apposition bleiben bewusst leicht gehoben, sind aber verständlich. „Die erhabene Stadt“ ist im modernen Deutsch für נִשְׂגָּבָה natürlicher und weniger konkret-bildlich als „die hochragende Stadt“. Die Wiederholung wird beibehalten.
  terminology: „Erniedrigen“ gibt sowohl הֵשַׁח als auch die wiederholten Hifilformen von שׁפל angemessen wieder, ohne eine bestimmte historische oder theologische Auslegung einzutragen. „Erde“ und „Staub“ bewahren die bildliche Steigerung des hebräischen Textes.
