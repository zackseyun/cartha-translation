  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
translation:
  language: de
  text: Denn er hat die Bewohner der Höhe erniedrigt, die erhabene Stadt[a]. Er erniedrigt sie, erniedrigt sie bis zur Erde; er lässt sie bis zum Staub reichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die hochgelegene Stadt“ oder, bei engerer Verbindung: „die Bewohner der erhabenen Stadt“. Der hebräische Text nennt die Stadt nicht beim Namen.'
    reason: Bewahrt die lexikalische Bedeutung von נִשְׂגָּבָה sowie die knappe, syntaktisch nicht völlig eindeutige Beziehung zwischen „Bewohner der Höhe“ und „Stadt“.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für den vorausgehenden Lobpreis ein und gibt die erklärende Funktion natürlich wieder.
- source_word: הֵשַׁח
  choice: hat … erniedrigt
  rationale: Der Hifil von שׁחח bezeichnet das Herabsetzen oder Erniedrigen. Die Wiedergabe wahrt sowohl die räumliche als auch die übertragene Bedeutung.
- source_word: יֹשְׁבֵי מָרוֹם
  choice: die Bewohner der Höhe
  rationale: Die Formulierung bleibt nahe am Hebräischen und bewahrt die mögliche räumliche wie bildliche Aussage, ohne die Bewohner ausdrücklich als stolz oder als bestimmte Macht zu deuten.
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: die hochragende Stadt
  rationale: נשׂגב beschreibt hier eine hoch gelegene oder erhabene Stadt. „Hochragend“ hält das Höhenmotiv fest und lässt offen, ob die Lage, der Rang oder beides gemeint ist.
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: Er stürzt sie hinab, stürzt sie hinab
  rationale: Die zweimalige Verbform wird zur poetischen Verstärkung wiederholt. „Hinabstürzen“ gibt im Blick auf die Stadt das gewaltsame Niedrigmachen natürlich wieder.
- source_word: עַד אֶרֶץ
  choice: bis zur Erde
  rationale: Die wörtlichere Wiedergabe von אֶרֶץ bewahrt die Steigerung zur parallelen Wendung „bis zum Staub“.
- source_word: יַגִּיעֶנָּה
  choice: er lässt sie … gelangen
  rationale: Der Hifil von נגע bedeutet wörtlich, etwas reichen oder gelangen zu lassen. Die Formulierung erhält diesen Kausativ, ohne das Bild durch ein zusätzliches „hinab“ zu glätten.
- source_word: עַד עָפָר
  choice: bis zum Staub
  rationale: Bewahrt das konkrete poetische Bild vollständiger Erniedrigung.
theological_decisions:
- issue: Identität der hochragenden Stadt
  choice: Die Stadt bleibt unbenannt.
  alternative: Deutung als Babylon, als eine andere konkrete feindliche Stadt oder als allgemeines Sinnbild menschlichen Hochmuts.
  rationale: Der hebräische Text nennt keinen Eigennamen. Die Übersetzung wahrt deshalb die historische und theologische Offenheit.
- issue: Bezug von „die hochragende Stadt“
  choice: Die Wendung wird als erläuternde Apposition zu den „Bewohnern der Höhe“ wiedergegeben.
  alternative: „Bewohner der hochragenden Stadt“ als ausdrücklich zusammengezogene Nominalgruppe.
  rationale: Die knappe hebräische Syntax lässt den genauen Zusammenhang offen. Die Interpunktion bildet die appositionelle Lesart ab, während die Fußnote auf eine mögliche engere Verbindung hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter poetischer Wiederholung. „Hochragend“, „Erde“ und „Staub“ erhalten das durchgehende Höhen- und Erniedrigungsmotiv; die Stadt wird nicht interpretierend identifiziert.
