  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: de
  text: Ein Fuß tritt sie nieder – die Füße der Armen, die Schritte der Bedürftigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Fuß wird sie niedertreten – die Füße der Armen, die Schritte der Bedürftigen.« Die hebräische Verbform kann im Zusammenhang auch futurisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: zertritt sie
  rationale: Das Verb רמס bezeichnet das Niedertreten oder Zertreten. Die feminine Objektendung nimmt im Zusammenhang die zuvor erniedrigte »hochragende Stadt« auf. Das Präsens bewahrt die lebendige poetische Darstellung.
- source_word: רָגֶל
  choice: ein Fuß
  rationale: Der Singular steht bildhaft und wird anschließend durch die parallelen Wendungen näher bestimmt.
- source_word: רַגְלֵי עָנִי
  choice: die Füße der Armen
  rationale: עָנִי kann arm, bedrängt oder elend bedeuten. »Armen« ist hier verständlich und passt zum Motiv der Umkehrung gegenüber der hochragenden Stadt.
- source_word: פַּעֲמֵי
  choice: die Schritte
  rationale: Das Wort bezeichnet Schritte oder Tritte und erhält den poetischen Parallelismus zu »Füße«.
- source_word: דַלִּים
  choice: der Geringen
  rationale: דַלִּים bezeichnet sozial Schwache, Niedrige oder Bedürftige. »Geringen« wahrt gegenüber »Armen« eine semantische Unterscheidung und bringt zugleich den Kontrast zur hochragenden Stadt zum Ausdruck.
theological_decisions:
- issue: Bezug der femininen Objektendung in תִּרְמְסֶנָּה
  choice: Das Pronomen »sie« bezieht sich auf die im unmittelbaren Kontext erniedrigte hochragende Stadt.
  alternative: Das feminine Objekt könnte ohne ausdrückliche Zuordnung wiedergegeben werden.
  rationale: Jesaja 26,5 nennt unmittelbar zuvor die hochragende Stadt; Vers 6 führt das Bild ihres Sturzes und Zertretens fort.
- issue: Zeitwert des hebräischen Imperfekts
  choice: 'Poetisch vergegenwärtigendes Präsens: »zertritt«'
  alternative: 'Futurisch: »wird sie zertreten«'
  rationale: Die Verbform kann im Kontext futurische Kraft haben; zugleich ist ein lebendiges Präsens als Darstellung des angekündigten Geschehens möglich. Die Ambiguität wird in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der zweigliedrige Parallelismus und der Wechsel vom Singular »Fuß« zu »Füße« und »Schritte« bleiben erhalten.
