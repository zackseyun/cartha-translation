  - severity: low
    issue: »der Geringen« ist weniger klar und weniger idiomatisch als eine soziale Bezeichnung.
    rationale: דַּלִּים bezeichnet Schwache, Geringe oder Bedürftige. »der Bedürftigen« ist in modernem Standarddeutsch klar und wahrt zugleich die Unterscheidung zu »Armen«.
