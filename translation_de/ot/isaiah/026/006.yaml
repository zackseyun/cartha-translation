  source_fidelity: Die Satzstruktur und der bildhafte Wechsel von singularischem רָגֶל zu den parallelen Bestimmungen »Füße der Armen« und »Schritte der Bedürftigen« werden bewahrt. Das Imperfekt kann im Kontext futurisch oder poetisch vergegenwärtigend verstanden werden; die Fußnote dokumentiert die futurische Möglichkeit. Das feminine Objekt »sie« bezieht sich nachvollziehbar auf die Stadt aus V. 5.
  naturalness: »Ein Fuß tritt sie nieder« ist im Deutschen idiomatischer und dem Bild des hebräischen רמס näher als »zertritt sie«. »Bedürftigen« ist modernes, verständliches Deutsch; »Geringen« wirkt hier nominalisiert und weniger eindeutig sozial bestimmt.
  terminology: »Armen« für עָנִי und »Bedürftigen« für דַּלִּים erhält die begriffliche Nuance und den Parallelismus, ohne eine übermäßige begriffliche Trennung zu behaupten. »Niedertreten« gibt רמס präzise wieder.
