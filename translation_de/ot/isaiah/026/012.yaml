source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: de
  text: HERR, du wirst für uns Frieden schaffen,[a] denn auch alle unsere Werke hast du für uns vollbracht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frieden“ kann hier auch umfassendes Wohlergehen oder Heilsein bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Denn alle unsere Werke hast du in uns vollbracht.“ Das hebräische „für uns“ kann in diesem Zusammenhang als Gottes Wirken in seinem Volk verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens JHWH als „HERR“ ist im deutschen Bibelstil verständlich und würdevoll; die direkte Anrede ergibt sich ohne ein zusätzliches „O“ aus dem Satz.
- source_word: תִּשְׁפֹּת
  choice: du wirst … schaffen
  rationale: Das Verb bezeichnet hier das Setzen oder Herstellen des Friedens. „Schaffen“ ist im Deutschen natürlich, bewahrt den Zukunftsbezug und vermeidet das missverständliche „verordnen“.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die naheliegende Wiedergabe; das hebräische Wort kann darüber hinaus umfassendes Wohlergehen und Heilsein bezeichnen, was in einer Fußnote vermerkt wird.
- source_word: לָנוּ
  choice: für uns
  rationale: 'Die Präposition ל bezeichnet hier den Begünstigten: Der Frieden wird zugunsten des Volkes geschaffen.'
- source_word: כִּי גַּם
  choice: denn auch
  rationale: „Denn“ gibt die begründende Funktion von כִּי wieder, während „auch“ die Betonung durch גַּם bewahrt.
- source_word: כָּל מַעֲשֵׂינוּ
  choice: all unsere Werke
  rationale: Die formnahe Wiedergabe lässt offen, ob Werke, Taten, Vorhaben oder Leistungen gemeint sind, und bewahrt die Spannung zwischen menschlichem Tun und göttlichem Wirken.
- source_word: פָּעַלְתָּ
  choice: hast du … gewirkt
  rationale: „Wirken“ gibt das Hervorbringen oder Vollbringen durch Gott wieder und bildet zusammen mit „Werke“ die Wortfügung des Hebräischen möglichst transparent ab.
- source_word: לָּנוּ
  choice: für uns
  rationale: Die Wiederholung von „für uns“ entspricht dem hebräischen לָנוּ und bezeichnet am unmittelbarsten Gottes Handeln zugunsten seines Volkes. Die mögliche Deutung „in uns“ wird in einer Fußnote erhalten.
theological_decisions:
- issue: Göttliches Wirken und menschliche Werke
  choice: Die Werke des Volkes werden genannt und zugleich auf Gottes Wirken für das Volk zurückgeführt.
  alternative: '„Alle unsere Werke hast du in uns gewirkt“ oder allgemeiner: „Alles hast du für uns getan.“'
  rationale: Der hebräische Satz hält menschliches Tun und göttliche Urheberschaft spannungsvoll zusammen. „Für uns“ entspricht der Präposition ל am direktesten, ohne daraus eine engere Lehraussage über ein ausschließlich inneres Wirken Gottes abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Verbindung „unsere Werke … gewirkt“ ist bewusst beibehalten, damit die Aussage über menschliche Werke und Gottes letztgültiges Wirken nicht geglättet wird.
