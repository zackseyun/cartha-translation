  text: יְהוָ֖ה בַּ/צַּ֣ר פְּקָד֑וּ/ךָ צָק֣וּ/ן לַ֔חַשׁ מוּסָרְ/ךָ֖ לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
translation:
  language: de
  text: Jahwe, in der Bedrängnis suchten sie dich[a]; sie schütteten ein geflüstertes Gebet aus[b], als deine Zurechtweisung über sie kam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wandten sie sich dir zu“, „achteten auf dich“ oder wörtlicher „suchten dich auf“. Das hebräische Verb kann verschiedene Formen aufmerksamer Hinwendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher möglicherweise: „sie schütteten ein Flüstern aus“; gemeint sein kann eine leise, unter der Not hervorgebrachte Bitte.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „deine Erziehung“, „deine Züchtigung“ oder „deine Unterweisung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: בַּצַּר
  choice: in der Bedrängnis
  rationale: צַר bezeichnet hier eine bedrängende Notlage, nicht wörtlich einen engen Ort.
- source_word: פְּקָדוּךָ
  choice: suchten sie dich
  rationale: פקד hat ein breites Bedeutungsspektrum. Im Zusammenhang von Not und Gebet gibt „suchen“ die Hinwendung zu Gott natürlich wieder, ohne die anderen möglichen Nuancen auszuschließen.
- source_word: צָקוּן לַחַשׁ
  choice: sie brachten flüsternd ein Gebet hervor
  rationale: Die knappe Verbindung beschreibt wahrscheinlich eine leise, unter Druck hervorgebrachte Äußerung. Die Wiedergabe ist im Deutschen natürlich und bewahrt sowohl das leise Sprechen als auch den Gebetszusammenhang.
- source_word: מוּסָרְךָ
  choice: deine Zurechtweisung
  rationale: מוּסָר umfasst Erziehung, Korrektur und züchtigende Maßnahme. „Zurechtweisung“ hält den korrigierenden Sinn fest, ohne ausschließlich Strafe oder bloße Belehrung zu meinen.
- source_word: לָמוֹ
  choice: sie traf
  rationale: Die Präposition mit Suffix wird idiomatisch auf die Menschen bezogen, über die Gottes zurechtweisendes Handeln kommt.
theological_decisions:
- issue: Charakter von מוּסָר als Handeln Gottes
  choice: deine Zurechtweisung
  alternative: deine Erziehung; deine Züchtigung; deine Unterweisung
  rationale: Der Zusammenhang verbindet Bedrängnis mit der Hinwendung zu Gott. „Zurechtweisung“ wahrt die korrigierende Dimension, ohne zwischen pädagogischer Unterweisung und strafender Züchtigung einseitig zu entscheiden.
- issue: Bedeutung von לַחַשׁ
  choice: flüsternd ein Gebet
  alternative: ein Flüstern; ein Murmeln; eine Beschwörung
  rationale: Der Zusammenhang ist die Hinwendung zu Jahwe in der Not. Daher liegt eine leise Bitte nahe; „Beschwörung“ würde eine magische Bedeutung eintragen, die der Kontext nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am poetischen Gedankengang des Hebräischen, während „brachten flüsternd ein Gebet hervor“ die im Deutschen unnatürliche wörtliche Verbindung „ein Flüstern ausgießen“ verständlich wiedergibt.
