  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: de
  text: Die Toten leben nicht; die Schatten[a] stehen nicht auf. Darum hast du sie bestraft[b] und vernichtet und jede Erinnerung an sie ausgelöscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch רְפָאִים: die Verstorbenen im Totenreich; hier ist nicht das alte Volk der Refaïter gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heimgesucht“. Das hebräische Verb kann ein Eingreifen zum Guten oder zum Gericht bezeichnen; hier weist der Zusammenhang auf Gericht hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵתִים
  choice: die Toten
  rationale: Das substantivisch gebrauchte Pluralwort bezeichnet kollektiv Verstorbene; „die Toten“ ist im modernen Deutschen natürlich und genau.
- source_word: בַּל יִחְיוּ
  choice: werden nicht lebendig
  rationale: Die poetische Verneinung בַּל mit dem Imperfekt kann einen gegenwärtigen Zustand oder eine künftige Unmöglichkeit ausdrücken. „Werden nicht lebendig“ wahrt den Bezug zum Wiederaufleben, ohne eine allgemeine Lehraussage über jede Auferstehung zu formulieren.
- source_word: רְפָאִים
  choice: die Totengeister
  rationale: Im Parallelismus zu „die Toten“ sind hier die Verstorbenen im Totenreich gemeint, nicht das alte Volk der Refaïter. „Totengeister“ ist verständlicher als das im Deutschen mehrdeutige „Schatten“.
- source_word: בַּל יָקֻמוּ
  choice: stehen nicht auf
  rationale: קום bedeutet grundlegend „aufstehen/sich erheben“. Die Formulierung erhält sowohl das Bild des Aufstehens als auch den möglichen Nachklang eines Aufstehens vom Tod.
- source_word: לָכֵן
  choice: Darum
  rationale: Das Wort kennzeichnet Folgerung oder Folge; „darum“ gibt den poetischen Zusammenhang knapp und natürlich wieder.
- source_word: פָּקַדְתָּ
  choice: hast du sie zur Rechenschaft gezogen
  rationale: פקד kann „aufsuchen“, „sich annehmen“ oder im Gerichtskontext „zur Rechenschaft ziehen/heimsuchen“ bedeuten. Die folgenden Verben der Vernichtung bestimmen hier den gerichtlichen Sinn.
- source_word: וַתַּשְׁמִידֵם
  choice: und vernichtet
  rationale: שׁמד bezeichnet starke, vollständige Zerstörung. „Vernichtet“ bewahrt diese Stärke, ohne eine philosophische Aussage über absolute Nichtexistenz einzutragen.
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: und jede Erinnerung an sie ausgelöscht
  rationale: Die Wendung spricht vom Beseitigen ihres gesamten Andenkens. „Jede Erinnerung an sie ausgelöscht“ ist idiomatisches Deutsch und erhält die umfassende Aussage von כָּל.
theological_decisions:
- issue: Bedeutung von רְפָאִים
  choice: Verstorbene im Totenreich („Totengeister“)
  alternative: die Refaïter als altes Volk
  rationale: Der Parallelismus mit „die Toten“ sowie „lebendig werden“ und „aufstehen“ weist auf Verstorbene, nicht auf eine Volksgruppe.
- issue: Tragweite von „stehen nicht auf“
  choice: Aussage über den endgültigen Sturz der hier besungenen, von Gott gerichteten Herrscher oder Mächte
  alternative: allgemeine Verneinung jeder Auferstehung
  rationale: Der Vers steht in einem poetischen Kontext über bestimmte frühere Herren und ihr Gericht. Die direkte Formulierung bleibt erhalten, ohne sie zu einer universalen Lehraussage auszuweiten.
- issue: Gerichtssinn von פקד
  choice: „zur Rechenschaft gezogen“
  alternative: „aufgesucht“ oder „dich ihrer angenommen“
  rationale: Das Verb ist an sich mehrdeutig; die unmittelbar folgenden Aussagen über Vernichtung und ausgelöschte Erinnerung legen hier eine gerichtliche Heimsuchung nahe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Totengeister“ wurde wegen seiner unmittelbaren Verständlichkeit dem missverständlichen „Schatten“ vorgezogen; „zur Rechenschaft gezogen“ macht den kontextuellen Gerichtssinn deutlich und lässt die lexikalische Spannweite in der Fußnote sichtbar.
