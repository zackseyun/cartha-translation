  naturalness: Die Fassung ist insgesamt würdevoll und verständlich. „Andere Herren als du“ ist jedoch im Deutschen klarer und idiomatischer als „Herren außer dir“; es macht zugleich die im Hebräischen ausgedrückte Abgrenzung zu anderen Herren deutlich.
  terminology: „Jahwe“, „Gott“, „Herren“ und „deinen Namen nennen“ sind angemessen. „Herren“ lässt, wie der hebräische Text, offen, ob menschliche Herrscher oder anders verstandene rivalisierende Mächte im Blick sind.
