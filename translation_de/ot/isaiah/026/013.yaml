  to: Jahwe, unser Gott, andere Herren als du haben über uns geherrscht. Doch allein durch dich[a] nennen wir deinen Namen.
  rationale: Eine geringfügige stilistische Präzisierung ersetzt „Herren außer dir“ durch „andere Herren als du“. Die Aussage, der Registerton und die semantische Offenheit des hebräischen Textes bleiben erhalten. Die Fußnote bewahrt die legitime alternative Auffassung von בְּךָ.
