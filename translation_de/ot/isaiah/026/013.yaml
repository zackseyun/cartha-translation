source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: de
  text: Jahwe, unser Gott, andere Herren als du haben über uns geherrscht. Doch allein durch dich[a] nennen wir deinen Namen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Allein in dir nennen wir deinen Namen.« Die hebräische Präposition kann hier sowohl »durch« als auch »in« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; die direkte Anrede ergibt sich im Deutschen ohne ein zusätzliches »O«.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: In Verbindung mit dem Gottesnamen bezeichnet die Form den einen Gott; das Suffix bedeutet »unser«.
- source_word: בְּעָלוּנוּ
  choice: haben über uns geherrscht
  rationale: Das Verb bezeichnet hier die Ausübung von Herrschaft oder Gewalt. Die Formulierung ist natürlich und lässt den bedrückenden Charakter der Fremdherrschaft erkennen.
- source_word: אֲדֹנִים
  choice: Herren
  rationale: Die offene Bezeichnung kann sowohl menschliche Machthaber als auch als Herrscher verstandene fremde Mächte bezeichnen, ohne die Stelle darauf festzulegen.
- source_word: זוּלָתֶךָ
  choice: außer dir
  rationale: 'Die Wendung drückt Abgrenzung aus: Es geht um Herren neben beziehungsweise außer Jahwe.'
- source_word: לְבַד
  choice: allein
  rationale: Das Wort hebt die Ausschließlichkeit hervor und wird zusammen mit בְּךָ auf die folgende Aussage bezogen.
- source_word: בְּךָ
  choice: durch dich
  rationale: Die Präposition ב kann hier Mittel oder Bereich bezeichnen. »Durch dich« ist im Haupttext verständlich; die mögliche Bedeutung »in dir« bleibt in der Fußnote erhalten.
- source_word: נַזְכִּיר
  choice: nennen wir
  rationale: Der Hifil von זכר kann »erwähnen« oder »nennen« bedeuten. »Deinen Namen nennen« ist im Deutschen knapp, natürlich und dem hebräischen Ausdruck nahe.
- source_word: שְׁמֶךָ
  choice: deinen Namen
  rationale: Die direkte Wiedergabe bewahrt die im Kontext mitschwingende Bedeutung des göttlichen Namens, ohne sie erklärend auszuweiten.
theological_decisions:
- issue: Identität der »Herren außer dir«
  choice: Die Übersetzung lässt offen, ob vor allem menschliche oder politische Herrscher gemeint sind.
  alternative: Die Herren können als Götzen oder fremde göttliche Mächte verstanden werden.
  rationale: Das Verb passt gut zu tatsächlicher Fremdherrschaft, doch der hebräische Ausdruck legt die Identität der Herren nicht eindeutig fest. Daher wird die Spannung nicht im Haupttext aufgelöst.
- issue: Bedeutung von בְּךָ לְבַד
  choice: allein durch dich
  alternative: allein in dir
  rationale: Die hebräische Präposition kann instrumental oder als Bezeichnung eines Bereichs beziehungsweise einer Bindung verstanden werden. Der Haupttext bietet eine flüssige Lesart, während die Fußnote die echte Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und gebetsartig; die Wiederholung »Herren … geherrscht« ist im Deutschen bewusst beibehalten, weil sie die Herrschaftsaussage deutlich macht.
