  naturalness: Die Fassung ist überwiegend flüssig und würdig. Eine knappere Wiedergabe mit „aus seiner Stätte hervor“ und ohne die erläuternden Erweiterungen bewahrt den prophetisch-poetischen Ton bei natürlichem modernem Standarddeutsch.
  terminology: „HERR“ für יהוה und „heimzusuchen“ für פקד sind angemessen. Für eine klare deutsche Konstruktion wird die gerichtliche Wendung als „die Schuld ... an ihnen ahnden“ formuliert. „Stätte“ ist gegenüber „Wohnstätte“ semantisch zurückhaltender und näher an מָקוֹם.
