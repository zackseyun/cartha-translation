base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: de
  text: Denn siehe, der HERR tritt aus seiner Stätte hervor, um die Schuld der Bewohner der Erde an ihnen zu ahnden. Die Erde wird ihr Blut enthüllen und ihre Erschlagenen nicht länger bedecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: seht
  rationale: Gibt den aufmerksamkeitsweckenden Diskurspartikel natürlich und würdig wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Entspricht der etablierten deutschen Wiedergabekonvention für das Tetragramm.
- source_word: מִמְּקוֹמוֹ
  choice: aus seiner Wohnstätte
  rationale: מָקוֹם bedeutet wörtlich „Ort“; im Kontext bezeichnet es den Ort, von dem der HERR zum Gericht hervortritt. „Wohnstätte“ ist im Deutschen idiomatischer als „aus seinem Ort“.
- source_word: לִפְקֹד
  choice: heimzusuchen
  rationale: Bewahrt den gerichtlichen Sinn von פקד, ohne ihn unnötig eng auf eine bestimmte Form der Bestrafung festzulegen.
- source_word: עֲוֺן
  choice: Schuld
  rationale: Kann sowohl Vergehen als auch daraus erwachsende Schuld bezeichnen; „Schuld“ wahrt diese forensisch-moralische Spannung.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: der Bewohner der Erde
  rationale: Der hebräische Singular ist kollektiv; im Deutschen lässt er sich hier entsprechend als Gruppenbezeichnung verstehen.
- source_word: דָּמֶיהָ
  choice: das auf ihr vergossene Blut
  rationale: Der hebräische Plural „ihre Blut(taten)/Blutmengen“ bezeichnet gewaltsam vergossenes Blut. Die Ergänzung „vergossene“ macht den deutschen Sinn klar, ohne die Aussage zu erweitern.
- source_word: הֲרוּגֶיהָ
  choice: die in ihr Erschlagenen
  rationale: Bezeichnet gewaltsam Getötete; „in ihr“ gibt die Zugehörigkeit zur personifizierten Erde in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezug des Suffixes in עָלָיו
  choice: „an ihnen“ bezieht sich sinngemäß auf die kollektiv verstandenen Bewohner der Erde
  alternative: „an ihm“ mit grammatisch singularischem Bezug auf „den Bewohner der Erde“
  rationale: Das hebräische Suffix ist maskulin Singular und stimmt formal mit dem kollektiven Singular „Bewohner“ überein. Im Deutschen macht der Plural den kollektiven Bezug verständlicher; die Fußnote bewahrt die Form des Ausgangstextes.
- issue: Personifikation der Erde
  choice: Die Erde deckt das auf ihr vergossene Blut auf und verbirgt ihre Erschlagenen nicht mehr
  alternative: Unpersönliche Formulierung, wonach Blut und Tote entdeckt werden
  rationale: Die aktive Personifikation ist ein wesentliches poetisches und theologisches Merkmal des hebräischen Textes und wird deshalb bewahrt.
- issue: Art des göttlichen Handelns bei פקד
  choice: gerichtliches „Heimsuchen“
  alternative: ausdrücklich „bestrafen“
  rationale: Der Kontext ist eindeutig Gericht, doch das Verb selbst hat eine breitere Bedeutungsweite. „Heimsuchen“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-poetischem Klang. Die Satzstruktur bleibt eng am Hebräischen, wird aber für flüssige deutsche Lesbarkeit gegliedert; die Personifikation der Erde bleibt erhalten.
