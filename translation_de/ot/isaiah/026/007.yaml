  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: de
  text: Der Pfad des Gerechten ist eben; du Aufrichtiger[a], ebnest die Bahn des Gerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Pfad des Gerechten ist gerade; gerade ist die Bahn des Gerechten, die du ebnest.« Das hebräische יָשָׁר kann statt als Anrede auch als Eigenschaft der Bahn verstanden werden; das folgende Verb in der zweiten Person kann dann relativisch aufgefasst werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח
  choice: Pfad
  rationale: Bezeichnet einen Weg oder Lebensweg. »Pfad« bewahrt das poetische Wegbild und steht natürlich neben מַעְגַּל.
- source_word: לַצַּדִּיק
  choice: des Gerechten
  rationale: Das ל kann Zugehörigkeit oder Beziehung ausdrücken. Der deutsche Genitiv gibt den Bezug knapp und idiomatisch wieder.
- source_word: מֵישָׁרִים
  choice: eben
  rationale: Das formal pluralische Substantiv bezeichnet hier prädikativ Geradheit beziehungsweise ebenes Gelände. »Eben« erhält das konkrete Bild eines gut begehbaren Weges.
- source_word: יָשָׁר
  choice: du Aufrichtiger
  rationale: Als Vokativ verstanden, der Gott als den Aufrichtigen anredet. Dafür spricht besonders das folgende Verb in der zweiten Person Singular. Die ungewöhnliche, aber verständliche Anrede erhält die poetische Spannung.
- source_word: מַעְגַּל
  choice: Bahn
  rationale: Bezeichnet eine Spur, Bahn oder einen Weg. »Bahn« vermeidet eine bloße Wiederholung von »Pfad« und bewahrt das Bild des Wegbereitens.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Der generische Singular bezeichnet den gerechten Menschen repräsentativ, ohne eine zusätzliche geschlechtliche Aussage hervorzuheben.
- source_word: תְּפַלֵּס
  choice: ebnest
  rationale: Das Piel von פלס kann das Einebnen oder Glätten eines Weges bezeichnen. »Ebnest« passt präzise zum Wegbild und zur Aussage des ersten Halbverses.
theological_decisions:
- issue: Ob יָשָׁר als Anrede an Gott oder als Eigenschaft der Bahn zu verstehen ist
  choice: 'Vokativ: »du Aufrichtiger«'
  alternative: 'Adjektivische Lesart: »Eine gerade Bahn ebnest du dem Gerechten.«'
  rationale: Das Verb תְּפַלֵּס steht in der zweiten Person Maskulinum Singular und legt einen Wechsel zur direkten Anrede nahe. Zugleich lässt die knappe hebräische Wortstellung eine adjektivische Zuordnung zu מַעְגַּל zu; diese echte Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper poetischer Parallelität. »Du Aufrichtiger« ist als markierte, aber verständliche Gottesanklage im Vokativ beibehalten; die syntaktische Alternative wird nicht stillschweigend ausgeschlossen.
