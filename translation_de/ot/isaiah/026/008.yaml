source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: de
  text: Auch auf dem Weg deiner Gerichte[a], Jahwe, haben wir auf dich gewartet; nach deinem Namen und deinem Gedenken[b] sehnt sich die Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deiner Rechtsentscheide«, »deiner Rechtsordnungen« oder »deines Rechts«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Erinnerung an dich«; das hebräische Wort kann auch »Gedächtnis« oder »bleibender Ruhm« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Auch
  rationale: Die Partikel hat hier wahrscheinlich additive beziehungsweise verstärkende Kraft. „Auch“ fügt den Satz natürlich in den poetischen Zusammenhang ein, ohne die mögliche Nuance durch ein zu starkes „wahrlich“ festzulegen.
- source_word: אֹרַח
  choice: Weg
  rationale: „Weg“ bewahrt das Bild des hebräischen אֹרַח und ist in der Verbindung „auf dem Weg“ idiomatisches modernes Deutsch.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Rechtsentscheide
  rationale: מִשְׁפָּט bezeichnet je nach Zusammenhang Recht, richterliche Entscheidung, Urteil oder Rechtsordnung. „Rechtsentscheide“ hält den Bezug zu Jahwes richterlichem Handeln fest, ohne den Ausdruck ausschließlich auf Strafgerichte zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קִוִּינוּךָ
  choice: warten wir auf dich
  rationale: קוה bezeichnet erwartungsvolles Warten und Hoffen. Das deutsche Präsens passt zur poetischen Aussage eines fortdauernden Vertrauens; „auf dich“ bewahrt das ausdrückliche personale Objekt.
- source_word: לְשִׁמְךָ
  choice: nach deinem Namen
  rationale: Die Präposition לְ wird zusammen mit dem Verlangensausdruck idiomatisch durch „nach“ wiedergegeben. „Name“ bewahrt sowohl die direkte Bedeutung als auch den Anklang an Jahwes Offenbarung und Ansehen.
- source_word: וּלְזִכְרְךָ
  choice: und deinem Gedenken
  rationale: זֵכֶר kann Gedenken, Erinnerung, Gedächtnis oder bleibenden Ruhm bezeichnen. „Gedenken“ erhält die knappe Parallelität zu „Name“ und lässt die Bedeutungsbreite weitgehend offen.
- source_word: תַּאֲוַת נָפֶשׁ
  choice: sehnt sich die Seele
  rationale: Die nominale Wendung „Verlangen der Seele“ wird als natürliches deutsches Verbgefüge wiedergegeben. Der poetische Singular „die Seele“ bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Eigennamen ausdrücklich verwendet, bewahrt „Jahwe“ dessen personale und bundesgeschichtliche Funktion, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von מִשְׁפָּטֶיךָ
  choice: deine Rechtsentscheide
  alternative: deine Gerichte; deine Rechtsordnungen; dein Recht
  rationale: Der Kontext spricht von Gottes gerechtem Handeln in der Welt. „Rechtsentscheide“ wahrt die Spannung zwischen normativem Recht und konkretem richterlichem Eingreifen, ohne nur Strafgericht oder nur abstrakte Gerechtigkeit auszudrücken.
- issue: Bezug von תַּאֲוַת נָפֶשׁ
  choice: 'unbestimmter poetischer Singular: „die Seele“'
  alternative: unsere Seele; unser innerstes Verlangen
  rationale: Im Hebräischen steht weder ein ausdrückliches Possessivpronomen noch ein Plural. Die Übersetzung vermeidet deshalb, den kollektiven Bezug ausdrücklich als „unsere“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die Satzstellung ist gegenüber dem Hebräischen nur so weit angepasst, dass die Zielrichtung der Präpositionen und der Verlangensausdruck natürlich verständlich werden. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
