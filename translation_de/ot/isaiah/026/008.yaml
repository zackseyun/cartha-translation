revisions:
- from: Auch auf dem Weg deiner Rechtsentscheide[a], Jahwe, warten wir auf dich; nach deinem Namen und deinem Gedenken[b] sehnt sich die Seele.
  to: Auch auf dem Weg deiner Gerichte[a], Jahwe, haben wir auf dich gewartet; nach deinem Namen und deinem Gedenken[b] sehnt sich die Seele.
  rationale: Die Revision stellt den Perfektaspekt von קִוִּינוּךָ mit „haben wir auf dich gewartet“ wieder her und ersetzt das fachsprachlich wirkende „Rechtsentscheide“ im Haupttext durch das im Deutschen natürliche, kontextuell passende „Gerichte“. Die poetische Struktur, die offene Bedeutung von זֵכֶר und die Fußnotenanker bleiben erhalten.
