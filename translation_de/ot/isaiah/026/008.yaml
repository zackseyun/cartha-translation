  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Gedenken“ wahrt die knappe Parallelität zu „Name“ und kann als Erinnerung bzw. bleibendes Andenken verstanden werden. Die Fußnoten bilden die relevanten lexikalischen Spielräume ab.
