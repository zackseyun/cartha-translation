  to: HERR, deine Hand ist erhoben, doch sie sehen es nicht. Sie werden den Eifer für dein Volk[a] sehen und sich schämen. Ja, Feuer wird deine Feinde[b] verzehren.
  rationale: Die Revision ersetzt die passive Formulierung „beschämt werden“ durch die dem hebräischen Verb nähere und im Deutschen natürliche Wendung „sich schämen“. Die Fußnote zur Schlusszeile beschreibt die syntaktische Alternative genauer und vermeidet eine zusätzliche, im Hebräischen nicht ausdrücklich enthaltene Bestimmung des Feuers.
