source:
  edition: WLC
  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: de
  text: HERR, deine Hand ist erhoben, doch sie sehen es nicht. Sie werden den Eifer für dein Volk[a] sehen und sich schämen. Ja, Feuer wird deine Feinde[b] verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Eifer des Volkes“. Die knappe hebräische Wendung kann unterschiedlich verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder, bei anderer Zuordnung der hebräischen Wortgruppe: „das Feuer deiner Feinde wird sie verzehren“. Die knappe Wortfolge ist mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird in der im Deutschen vertrauten Bibelkonvention mit „HERR“ wiedergegeben; die direkte Anrede bleibt erhalten.
- source_word: רָמָה יָדְךָ
  choice: deine Hand ist erhoben
  rationale: Bewahrt das konkrete Bild der erhobenen Hand und lässt offen, ob es Gottes Handlungsbereitschaft, Macht oder bereits wirksames Eingreifen bezeichnet.
- source_word: בַּל יֶחֱזָיוּן
  choice: doch sie sehen es nicht
  rationale: „Sehen“ gibt חזה schlicht wieder; „es“ nimmt im Deutschen natürlich das Bild der erhobenen Hand beziehungsweise Gottes Handeln auf.
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: Sie werden … sehen und beschämt werden
  rationale: Die Imperfektformen werden im Kontrast zum gegenwärtigen Nichtsehen mit Zukunftsbedeutung verstanden. Die mögliche auffordernde Lesart wird nicht in den Haupttext aufgenommen, da die Zukunftsaussage im Zusammenhang näherliegt.
- source_word: קִנְאַת עָם
  choice: den Eifer für dein Volk
  rationale: קִנְאָה bezeichnet hier am ehesten leidenschaftlichen Eifer. Die knappe Genitivverbindung lässt mehrere Zuordnungen zu; der Haupttext versteht sie im Zusammenhang als Eifer zugunsten des zu JHWH gehörenden Volkes, während die Fußnote die formnähere Alternative festhält.
- source_word: אַף
  choice: Ja
  rationale: Gibt die bekräftigende und steigernde Funktion der Partikel in natürlichem Deutsch wieder.
- source_word: אֵשׁ צָרֶיךָ תֹאכְלֵם
  choice: Feuer wird deine Feinde verzehren
  rationale: Versteht „deine Feinde“ als vorangestelltes Objekt, das durch das Suffix „sie“ am Verb wiederaufgenommen wird. „Verzehren“ ist bei Feuer eine natürliche Wiedergabe von אכל und bewahrt das Gerichtsbild.
theological_decisions:
- issue: Zuordnung von קִנְאַת עָם
  choice: Eifer zugunsten des Volkes JHWHs
  alternative: der Eifer des Volkes
  rationale: Der Kontext von Gottes erhobener Hand, der Beschämung der Gegner und dem Gericht an den Feinden spricht für Gottes Eifer zugunsten seines Volkes. Da der hebräische Ausdruck äußerst knapp ist und das Possessivverhältnis nicht ausdrücklich benennt, bleibt die alternative Lesart in einer Fußnote sichtbar.
- issue: Syntaktische Zuordnung von צָרֶיךָ
  choice: „deine Feinde“ als vorangestelltes Objekt von „verzehren“
  alternative: „das Feuer deiner Feinde“ oder „das für deine Feinde bestimmte Feuer“
  rationale: Das pronominale Suffix in תֹאכְלֵם („es wird sie verzehren“) stützt die Auffassung, dass „deine Feinde“ als Objekt vorangestellt und anschließend wiederaufgenommen ist. Die kompakte Wortfolge lässt jedoch auch eine Zuordnung zu „Feuer“ zu; diese Spannung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Das traditionelle „HERR“ wahrt die geläufige Kennzeichnung des Gottesnamens. Bildsprache und syntaktische Mehrdeutigkeiten werden nicht unnötig aufgelöst; wesentliche Alternativen stehen in den Fußnoten.
