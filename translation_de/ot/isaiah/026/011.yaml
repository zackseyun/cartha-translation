  terminology: „HERR“, „Eifer“, „Volk“, „Feinde“ und „verzehren“ sind konsistent und geeignet. Die Fußnote zu אֵשׁ צָרֶיךָ sollte die mögliche Genitivzuordnung als solche benennen, ohne die deutlich stärker interpretierende Formulierung „für deine Feinde bestimmt“ als gleichwertige grammatische Alternative auszugeben.
