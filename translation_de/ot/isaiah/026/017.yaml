  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: de
  text: Wie eine Schwangere, die kurz vor der Geburt steht, sich windet und in ihren Wehen aufschreit, so waren wir vor dir[a], Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in deiner Gegenwart; möglicherweise: deinetwegen. Die hebräische Wendung bedeutet wörtlich „von/vor deinem Angesicht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Wie
  rationale: Leitet den Vergleich direkt und natürlich ein.
- source_word: הָרָה
  choice: eine Schwangere
  rationale: Gibt die substantivisch gebrauchte Bezeichnung knapp, eindeutig und in modernem Deutsch wieder.
- source_word: תַּקְרִיב לָלֶדֶת
  choice: die kurz vor der Geburt steht
  rationale: Drückt das Herannahen des Gebärens idiomatisch aus, ohne den Sinn zu erweitern.
- source_word: תָּחִיל
  choice: sich windet
  rationale: Bewahrt im Zusammenhang der Geburtswehen das anschauliche körperliche Leiden des Verbs.
- source_word: תִּזְעַק
  choice: aufschreit
  rationale: Bezeichnet einen lauten, aus der Not hervorgehenden Ruf und passt zum Bild der Wehen.
- source_word: בַּחֲבָלֶיהָ
  choice: in ihren Wehen
  rationale: Gibt die Geburtswehen samt weiblichem Suffix natürlich wieder.
- source_word: כֵּן הָיִינוּ
  choice: so waren wir
  rationale: Markiert klar den zweiten Teil des Vergleichs und wahrt die Vergangenheitsform.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Bewahrt den räumlich-relationalen Grundsinn der Wendung und lässt offen, ob zusätzlich eine ursächliche Bedeutung mitschwingt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen; seine Wiedergabe als „Jahwe“ erhält den Charakter eines persönlichen Namens.
- issue: Bedeutung von מִפָּנֶיךָ
  choice: vor dir
  alternative: deinetwegen
  rationale: „Vor dir“ hält die Beziehung zur Gegenwart beziehungsweise zum Angesicht Jahwes fest, ohne die mögliche ursächliche Nuance auszuschließen oder zur Hauptaussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die eindringliche Körperlichkeit des Geburtsbildes und die knappe Anrede am Versende; die Mehrdeutigkeit von מִפָּנֶיךָ wird im Haupttext nicht vorschnell aufgelöst.
