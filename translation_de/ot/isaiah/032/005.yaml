  yaml_path: translation/ot/isaiah/032/005.yaml
  text: No longer will the fool be called noble[d][c][b][a], nor will the scoundrel be called generous.
translation:
  language: de
  text: Nicht länger wird der Tor[a] edel[b] genannt, und vom Geizhals[c] wird man nicht sagen, er sei vornehm[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Niederträchtige“; das hebräische Wort bezeichnet moralische Verwerflichkeit ebenso wie Torheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vornehm“, „freigebig“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Knauserige“, „der Schurke“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „angesehen“, „reich“ oder „freigebig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: der Tor
  rationale: Das Wort bezeichnet nicht bloß mangelnde Klugheit, sondern einen sittlich abgestumpften oder verwerflichen Menschen. „Tor“ ist knapp, bibelsprachlich vertraut und bewahrt diese moralische Dimension.
- source_word: נָדִיב
  choice: edel
  rationale: נָדִיב kann gesellschaftlichen Rang, edle Gesinnung oder Freigebigkeit bezeichnen. „Edel“ passt hier zu einer ehrenden öffentlichen Bezeichnung und lässt die Bedeutungsbreite offen.
- source_word: כִילַי
  choice: der Geizhals
  rationale: כִילַי bezeichnet einen knauserigen, habgierigen und dadurch moralisch verwerflichen Menschen. „Geizhals“ gibt den im Wort besonders greifbaren Zug prägnant und verständlich wieder.
- source_word: שׁוֹעַ
  choice: vornehm
  rationale: שׁוֹעַ verweist auf Wohlstand, Rang oder gesellschaftliches Ansehen. „Vornehm“ wahrt hier den sozialen Ehrentitel, ohne die Bedeutung einseitig auf Freigebigkeit festzulegen.
- source_word: יִקָּרֵא
  choice: wird … genannt
  rationale: Der Nifal von קרא bezeichnet hier die Benennung oder öffentliche Bezeichnung einer Person; die passive Wiedergabe entspricht Form und Sinn des Hebräischen.
- source_word: יֵאָמֵר
  choice: vom … wird man nicht sagen, er sei
  rationale: Die unpersönliche Form gibt den Nifal von אמר natürlich wieder und bewahrt zugleich den feinen verbalen Unterschied zum „genannt werden“ im ersten Versglied.
- source_word: עוֹד
  choice: nicht länger / nicht mehr
  rationale: In Verbindung mit der Verneinung bezeichnet עוֹד das Ende eines bisherigen Zustands. Die beiden geläufigen deutschen Wendungen vermeiden unnötige Wiederholung.
theological_decisions:
- issue: Art des Gegensatzes
  choice: Das Ende falscher gesellschaftlich-moralischer Ehrbezeichnungen
  alternative: Eine ausdrücklich messianische Aussage oder ein allgemeiner Lehrspruch über wahrhaftige Rede
  rationale: Der Vers selbst spricht davon, dass moralisch verwerfliche Menschen nicht mehr mit ehrenden Bezeichnungen bedacht werden. Der größere Zusammenhang kann eine endzeitliche oder messianische Perspektive eröffnen; diese wird jedoch nicht erläuternd in den Vers hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, annähernd paralleler Satzführung. „Tor“ bewahrt den vertrauten weisheitlichen Klang, während „Geizhals“ unmittelbar verständlich ist. Die unterschiedlichen hebräischen Redeverben werden im Deutschen unterschieden, ohne den Parallelismus aufzulösen.
