base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: de
  text: Und ein Mann[c] wird sein wie ein Versteck vor dem Wind[a] und ein Schutz vor dem Unwetter[b], wie Wasserläufe an einem dürren Ort, wie der Schatten eines mächtigen Felsens in einem ermatteten Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Zuflucht vor dem Wind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Schutz vor dem Wolkenbruch“ beziehungsweise „vor dem Sturm“.'
    reason: lexical_alternative
  - marker: c
    text: „Ein Mann“ kann den idealen Herrscher aus dem vorangehenden Vers, jeden gerechten Herrscher in repräsentativem Sinn oder typologisch eine über sie hinausweisende Gestalt bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und ... wird sein
  rationale: Das Waw verbindet den Vers mit dem vorangehenden Zusammenhang; die Verbform wird im prophetischen Diskurs natürlich futurisch wiedergegeben.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Singularform wird genau bewahrt, ohne ihren möglichen individuellen oder repräsentativen Bezug festzulegen.
- source_word: מַחֲבֵא רוּחַ
  choice: ein Versteck vor dem Wind
  rationale: מַחֲבֵא bezeichnet einen Ort des Verbergens beziehungsweise der Zuflucht; „Versteck“ erhält das konkrete Bild.
- source_word: סֵתֶר זָרֶם
  choice: ein Schutz vor dem Unwetter
  rationale: סֵתֶר bezeichnet Schutz oder Deckung; זָרֶם kann einen heftigen Regenguss oder Sturm bezeichnen. „Unwetter“ bewahrt die Breite des bedrohlichen Wetterbildes.
- source_word: פַלְגֵי מַיִם
  choice: Wasserbäche
  rationale: Die Wendung bezeichnet fließende Wasserläufe; „Wasserbäche“ ist knapp, anschaulich und im Deutschen natürlich.
- source_word: בְּצָיוֹן
  choice: an einem dürren Ort
  rationale: Das Substantiv bezeichnet Trockenheit oder eine dürre Gegend; die Wiedergabe wahrt das räumliche Bild.
- source_word: צֵל סֶלַע כָּבֵד
  choice: der Schatten eines mächtigen Felsens
  rationale: כָּבֵד bedeutet wörtlich „schwer“, beschreibt hier aber die eindrucksvolle Größe und schützende Masse des Felsens; „mächtig“ gibt dies idiomatisch wieder.
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: in einem ermatteten Land
  rationale: עֲיֵפָה bedeutet „müde, matt, erschöpft“. „Ermattet“ bewahrt die Personifikation des Landes und klingt zugleich würdig.
theological_decisions:
- issue: Bezug von אִישׁ („ein Mann“)
  choice: Die Übersetzung bleibt bei „ein Mann“ und lässt offen, ob damit der König aus Vers 1, jeder gerechte Herrscher repräsentativ oder eine weiterführende typologische Gestalt gemeint ist.
  alternative: Den Ausdruck ausdrücklich als „der König“, „jeder von ihnen“ oder „der Messias“ wiederzugeben.
  rationale: Der unmittelbare Zusammenhang nennt einen König und Fürsten, doch der hebräische Singular legt die genaue Reichweite nicht eindeutig fest. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. Die ungewöhnliche Personifikation „ermattetes Land“ wird bewusst erhalten. Alle interpretativ offenen Bezüge bleiben im Haupttext unentschieden.
