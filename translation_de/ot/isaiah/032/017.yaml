  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: de
  text: 'Das Werk der Gerechtigkeit wird Frieden sein, und die Wirkung der Gerechtigkeit: Ruhe und Sicherheit für immer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה הַצְּדָקָה
  choice: das Werk der Gerechtigkeit
  rationale: מַעֲשֶׂה bezeichnet hier das Hervorgebrachte bzw. Wirken; die formnahe Wendung bewahrt den Zusammenhang zwischen Gerechtigkeit und Frieden.
- source_word: עֲבֹדַת הַצְּדָקָה
  choice: der Ertrag der Gerechtigkeit
  rationale: עֲבֹדָה kann Arbeit, Wirken oder das daraus Hervorgebrachte bezeichnen. Im Parallelismus mit מַעֲשֶׂה und den folgenden Ergebnissen ist „Ertrag“ im Deutschen natürlich und gibt die resultative Nuance wieder, ohne „Dienst“ als religiösen Fachbegriff einzutragen.
- source_word: הַשְׁקֵט
  choice: Ruhe
  rationale: Das substantivisch gebrauchte Wort bezeichnet Ungestörtheit bzw. Ruhe.
- source_word: בֶטַח
  choice: Sicherheit
  rationale: Der Ausdruck bezeichnet ein sicheres, unbedrohtes Dasein und kann je nach Kontext auch Zuversicht einschließen.
- source_word: עַד־עוֹלָם
  choice: für immer
  rationale: Gibt die zeitliche Dauer idiomatisch und würdig wieder.
theological_decisions:
- issue: Verhältnis von Gerechtigkeit zu Frieden und Sicherheit
  choice: Die parallelen Aussagen bleiben als Folge- bzw. Ertragsaussagen stehen.
  alternative: Die Gerechtigkeit ausdrücklich als menschliche Tugend, göttliches Heilshandeln oder Rechtsprechung bestimmen.
  rationale: צְדָקָה ist kontextuell weit und kann Gerechtigkeit, gerechtes Handeln oder heilvolle Ordnung bezeichnen. Der Vers selbst legt den Träger nicht ausdrücklich fest; diese Spannung wird nicht konfessionell aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Parallelismus des Hebräischen wird bewahrt; unnötige Fachsprache und konfessionelle Präzisierungen werden vermieden.
