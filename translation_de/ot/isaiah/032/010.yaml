  text: יָמִים֙ עַל שָׁנָ֔ה תִּרְגַּ֖זְנָה בֹּֽטְח֑וֹת כִּ֚י כָּלָ֣ה בָצִ֔יר אֹ֖סֶף בְּלִ֥י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: de
  text: In etwas mehr als einem Jahr[a] werdet ihr zittern, ihr selbstsicheren Frauen[b]; denn die Weinlese wird ausbleiben; die Einbringung wird ausbleiben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Tage über ein Jahr«; gemeint ist wahrscheinlich ein Jahr und eine kurze zusätzliche Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »ihr Frauen, die ihr euch sicher fühlt«; im Zusammenhang kann diese Sicherheit als Sorglosigkeit verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder formnäher: »Denn die Weinlese ist zu Ende; die Einbringung kommt nicht.« Die vollendete Verbform kann prophetisch ein künftiges Geschehen als gewiss darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: In einem Jahr und wenigen Tagen
  rationale: Die Wendung lautet wörtlich »Tage über ein Jahr« und bezeichnet hier einen kurzen Zeitraum über ein volles Jahr hinaus. Die deutsche Formulierung gibt diese Zeitangabe verständlich wieder, ohne das missverständliche Idiom »über Jahr und Tag« zu verwenden.
- source_word: תִּרְגַּזְנָה
  choice: werdet ihr zittern
  rationale: רגז bezeichnet körperliche oder innere Erschütterung, Unruhe und Zittern. Im Zusammenhang der prophetischen Warnung ist »zittern« prägnant und wahrt die direkte Anrede im Femininum Plural.
- source_word: בֹּטְחוֹת
  choice: ihr selbstsicheren Frauen
  rationale: Das feminine Partizip von בטח bezeichnet Frauen, die sich sicher fühlen oder voller Vertrauen sind. »Selbstsicher« bewahrt die Grundbedeutung und lässt im warnenden Kontext die problematische Sicherheit erkennen, ohne die wertende Deutung »selbstzufrieden« in den Haupttext einzutragen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für das angekündigte Zittern ein. »Denn« gibt den kausalen Zusammenhang in gehobenem, aber geläufigem Deutsch wieder.
- source_word: כָּלָה בָצִיר
  choice: die Weinlese wird ausbleiben
  rationale: בָצִיר bezeichnet ausdrücklich die Weinlese; כָּלָה bedeutet zu Ende gehen, aufhören oder aus sein. Im prophetischen Zusammenhang drückt »wird ausbleiben« den bevorstehenden Ernteverlust natürlich aus. Die formnähere Alternative wird in der Fußnote genannt.
- source_word: אֹסֶף
  choice: die Erntezeit
  rationale: Das Substantiv bezeichnet das Einsammeln beziehungsweise die Einbringung der Erzeugnisse. »Erntezeit« hält den Bezug allgemein und vermeidet die nicht ausdrücklich im Hebräischen festgelegte Eingrenzung auf Obst.
- source_word: בְּלִי יָבֹא
  choice: wird nicht kommen
  rationale: Die Wendung bedeutet wörtlich etwa »ohne dass sie kommt«. »Wird nicht kommen« bewahrt das konkrete Bild einer erwarteten, aber nicht eintretenden Einbringung.
