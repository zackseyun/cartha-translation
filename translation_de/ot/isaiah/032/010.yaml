translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die feminine Mehrzahl des Hebräischen wird ausdrücklich wiedergegeben. Der Haupttext ist flüssig, während die Fußnoten die ungewöhnliche Zeitformel, die Bedeutungsbreite von בֹּטְחוֹת sowie die Spannung zwischen hebräischer Perfektform und zukünftigem Kontext offenhalten.
