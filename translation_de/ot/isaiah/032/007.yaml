source:
  edition: WLC
  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: de
  text: Und die Mittel des Schurken sind böse[a]. Er ersinnt Ränke, um die Demütigen[b] mit Lügenworten zugrunde zu richten, selbst wenn der Arme sein Recht vorbringt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werkzeuge“, „Geräte“ oder „Waffen“. Das hebräische Wort kann konkrete Gegenstände und übertragen eingesetzte Methoden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gebeugten“, „die Bedrängten“ oder „die Sanftmütigen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und wenn der Arme Recht/Gericht spricht“. Gemeint sein kann, dass der Schurke gegen ihn vorgeht, obwohl seine Sache gerecht ist.'
    reason: ambiguity
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: Mittel
  rationale: כְּלִי bezeichnet konkret ein Gefäß, Werkzeug oder Gerät und kann übertragen die eingesetzten Methoden oder Mittel meinen. „Mittel“ bewahrt hier diese konkrete wie metaphorische Spannweite und passt zum folgenden Planen.
- source_word: רָעִים
  choice: böse
  rationale: Das Adjektiv bewertet die Mittel moralisch; „böse“ erhält das Gewicht der prophetischen Anklage.
- source_word: זִמּוֹת יָעָץ
  choice: er ersinnt Ränke
  rationale: זִמּוֹת bezeichnet hier arglistige Pläne, während יָעָץ ihr überlegtes Entwerfen ausdrückt. „Ränke ersinnen“ gibt die böswillige Absicht natürlich und prägnant wieder.
- source_word: לְחַבֵּל
  choice: zugrunde zu richten
  rationale: Der Infinitiv bezeichnet die beabsichtigte schwere Schädigung der Schutzlosen, ohne zwingend ihre physische Vernichtung zu behaupten.
- source_word: ענוים
  choice: die Demütigen
  rationale: Der Ausdruck kann demütige, gebeugte oder bedrängte Menschen bezeichnen. „Die Demütigen“ erhält den ethischen Sinn, ohne ihn mit dem später ausdrücklich genannten Armen gleichzusetzen.
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: mit Lügenworten
  rationale: Die Präposition bezeichnet das Mittel; die kompakte Wiedergabe bewahrt die Mehrzahl und den deutlichen Vorwurf der Falschheit.
- source_word: אֶבְיוֹן
  choice: der Arme
  rationale: Das maskuline Singularwort bezeichnet einen armen oder bedürftigen Menschen und wird hier entsprechend seiner grammatischen Form repräsentativ wiedergegeben.
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: selbst wenn der Arme sein Recht vorbringt
  rationale: Die Konstruktion mit בְּ und Infinitiv wird umstandsbezogen beziehungsweise temporal verstanden. מִשְׁפָּט hat einen rechtlich-ethischen Sinn; „sein Recht vorbringen“ ist idiomatisches Deutsch, während eine Fußnote die offenere hebräische Formulierung sichtbar hält.
theological_decisions:
- issue: Repräsentativer maskuliner Singular bei אֶבְיוֹן
  choice: der Arme
  alternative: der bedürftige Mensch / die Bedürftigen
  rationale: Der hebräische Ausdruck steht maskulin im Singular und kann repräsentativ gebraucht sein. Die Übersetzung bewahrt diese Form, ohne die Aussage auf Männer zu beschränken.
- issue: Deutung von מִשְׁפָּט im Schlussglied
  choice: sein Recht vorbringt
  alternative: Recht spricht / Gerechtigkeit ausspricht
  rationale: Der Kontext erlaubt eine rechtliche Aussage oder das Vorbringen einer berechtigten Sache. Die gewählte Form ist im Deutschen verständlich, während die Fußnote die sprachliche Mehrdeutigkeit wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schurke“, „Ränke“ und „Lügenworte“ tragen den scharfen prophetischen Ton, bleiben aber allgemein verständlich. Die Satzteilung erhöht die Lesbarkeit; die Fußnoten bewahren die wesentlichen lexikalischen und syntaktischen Alternativen.
