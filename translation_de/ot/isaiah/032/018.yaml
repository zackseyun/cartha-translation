source:
  edition: WLC
  text: וְ/יָשַׁ֥ב עַמִּ֖/י בִּ/נְוֵ֣ה שָׁל֑וֹם וּֽ/בְ/מִשְׁכְּנוֹת֙ מִבְטַחִ֔ים וּ/בִ/מְנוּחֹ֖ת שַׁאֲנַנּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: de
  text: Und mein Volk wird in einer Wohnstätte des Friedens wohnen, in sicheren Wohnungen und an ungestörten Ruheplätzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁב
  choice: Und … wird … wohnen
  rationale: ישב kann „sitzen“, „wohnen“ oder „leben“ bedeuten. Im Zusammenhang beständiger Sicherheit gibt „wohnen“ den Sinn natürlich und präzise wieder; וְ wird mit „Und“ aufgenommen.
- source_word: עַמִּי
  choice: mein Volk
  rationale: עם mit dem Suffix der 1. Person Singular bezeichnet hier in relationaler, gemeinschaftlicher Sprache „mein Volk“.
- source_word: בִּנְוֵה שָׁלוֹם
  choice: an einer Stätte des Friedens
  rationale: נָוֶה bezeichnet eine Wohnstätte, einen Aufenthaltsort oder auch einen Weideplatz. Zusammen mit שָׁלוֹם und den parallelen Wohn- und Ruheorten ist eine bewohnbare „Stätte“ gemeint. Die Genitivform bewahrt die mögliche Bedeutungsweite von שָׁלוֹם als Frieden, Wohlergehen und Unversehrtheit.
- source_word: וּבְמִשְׁכְּנוֹת מִבְטַחִים
  choice: in sicheren Wohnungen
  rationale: מִשְׁכָּנוֹת sind Wohnstätten; מִבְטַחִים beschreibt ihre Sicherheit. „Sichere Wohnungen“ ist im Deutschen klar und vermeidet unnötige kultische Anklänge.
- source_word: וּבִמְנוּחֹת שַׁאֲנַנּוֹת
  choice: und an ungestörten Ruheplätzen
  rationale: מְנוּחוֹת bezeichnet konkrete Orte der Ruhe. שַׁאֲנַנּוֹת bedeutet ruhig, ungestört oder sorglos; „ungestört“ betont hier die objektive Ruhe und Sicherheit, ohne einen negativen Beiklang von Selbstzufriedenheit einzutragen.
theological_decisions:
- issue: Zeithorizont und Art der verheißenen Verhältnisse
  choice: Der Vers beschreibt konkrete gemeinschaftliche Verhältnisse von Frieden, Sicherheit und ungestörter Ruhe für Gottes Volk, ohne den Erfüllungszeitraum näher festzulegen.
  alternative: Die Aussage ausschließlich auf eine historische Wiederherstellung Judas oder ausschließlich auf einen endzeitlich-messianischen Frieden beziehen.
  rationale: Der hebräische Wortlaut verheißt sichere Wohnverhältnisse, bestimmt in diesem Vers allein aber nicht ausdrücklich, ob die Erfüllung historisch, eschatologisch oder typologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Parallelstruktur bleibt erhalten. „Stätte des Friedens“ bewahrt die semantische Weite des hebräischen שָׁלוֹם und klingt zugleich natürlich; „ungestört“ gibt die ruhige Sicherheit von שַׁאֲנַנּוֹת wieder.
