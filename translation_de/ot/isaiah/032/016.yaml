base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/016.yaml
  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
translation:
  language: de
  text: Dann wird das Recht in der Wüste wohnen, und die Gerechtigkeit wird im fruchtbaren Land[a] wohnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: am Karmel. Das hebräische Wort kann fruchtbares Kulturland oder den Namen Karmel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: sitzen; sinngemäß auch: wohnen oder bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַן
  choice: Dann wird … wohnen
  rationale: Das Qal-Perfekt hat im prophetischen Zusammenhang futurische Bedeutung. „Dann“ gibt die aus dem vorherigen Kontext hervorgehende Abfolge natürlich wieder; „wohnen“ bewahrt die Personifikation.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbebautes Wüsten- oder Wildnisland. „Wüste“ ist im Deutschen prägnant und erhält den Gegensatz zum fruchtbaren Kulturland.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Hier geht es um eine gerechte Ordnung, nicht vorrangig um einen einzelnen Urteilsspruch. „Recht“ bildet zudem mit „Gerechtigkeit“ ein natürliches und begrifflich unterscheidbares Wortpaar.
- source_word: וּצְדָקָה
  choice: und die Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die Unterscheidung von מִשְׁפָּט und erhält die theologische wie poetische Spannung des Parallelismus.
- source_word: בַּכַּרְמֶל
  choice: im fruchtbaren Land
  rationale: כַּרְמֶל kann fruchtbares, kultiviertes Land bezeichnen. Dieser Gattungsname passt zum bildlichen Gegensatz mit der Wüste; die mögliche Deutung als Eigenname wird in einer Fußnote erhalten.
- source_word: תֵּשֵׁב
  choice: wird … ihren Sitz haben
  rationale: Das Verb ישׁב bedeutet wörtlich „sitzen“, kann aber auch dauerhaftes Wohnen oder Bleiben ausdrücken. „ihren Sitz haben“ klingt im Deutschen natürlich, bewahrt das Sitzmotiv und vermittelt zugleich beständige Gegenwart.
theological_decisions:
- issue: Unterscheidung zwischen מִשְׁפָּט und צְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Gerechtigkeit und Rechtschaffenheit; zweimal Gerechtigkeit
  rationale: Die gewählte Paarung lässt die eng verwandten Begriffe unterscheidbar und glättet ihre poetische und theologische Spannung nicht ein.
- issue: Deutung von כַּרְמֶל
  choice: fruchtbares Land
  alternative: Karmel
  rationale: Der unmittelbare Gegensatz zur Wüste spricht für die Gattungsbedeutung. Da der hebräische Ausdruck auch als Ortsname verstanden werden kann, bleibt diese Lesart ausdrücklich in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die personifizierende Bildsprache und der Parallelismus bleiben erhalten.
