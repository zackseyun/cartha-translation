  variant: modern standard German
source:
  edition: WLC
  text: הֵ֥ן לְ/צֶ֖דֶק יִמְלָךְ מֶ֑לֶךְ וּ/לְ/שָׂרִ֖ים לְ/מִשְׁפָּ֥ט יָשֹֽׂרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
translation:
  language: de
  text: Siehe[a], ein König wird in Gerechtigkeit[b][d] regieren, und Fürsten[c] werden nach dem Recht herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schaut“ beziehungsweise „Seht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird gerecht regieren“; wörtlich: „in Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: c
    text: „Fürsten“ kann auch mit „Herrscher“, „Anführer“ oder „Amtsträger“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: d
    text: Viele christliche Leser verstehen diesen König im weiteren Zusammenhang messianisch; im Hebräischen steht hier jedoch lediglich „ein König“.
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die einleitende Interjektion lenkt nachdrücklich die Aufmerksamkeit auf die folgende Ankündigung. „Siehe“ bewahrt den prophetisch-feierlichen Ton und ist im gehobenen modernen Deutsch weiterhin verständlich.
- source_word: לְצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die Präposition לְ bezeichnet hier wahrscheinlich Art oder Maßstab des Regierens. Die nominale Wiedergabe bewahrt das moralische und rechtliche Gewicht von צֶדֶק, ohne es auf bloßes „gerecht“ zu verengen.
- source_word: יִמְלָךְ מֶלֶךְ
  choice: ein König wird regieren
  rationale: מֶלֶךְ steht ohne Artikel; deshalb wird die Unbestimmtheit mit „ein König“ erhalten. Das Yiqtol wird als Zukunftsaussage wiedergegeben. „Regieren“ entspricht dem königlichen Herrschen in natürlichem Deutsch.
- source_word: וּלְשָׂרִים
  choice: und Fürsten
  rationale: שָׂרִים bezeichnet hochgestellte Herrschaftsträger, Anführer oder Beamte. „Fürsten“ erhält im Parallelismus zu „König“ den höfisch-politischen Zusammenhang.
- source_word: לְמִשְׁפָּט
  choice: nach dem Recht
  rationale: Die Wendung bezeichnet den Maßstab, an dem sich die Herrschaft ausrichtet. „Nach dem Recht“ gibt den rechtlich-ethischen Sinn von מִשְׁפָּט idiomatisch wieder und vermeidet die im Deutschen leicht missverständliche Engführung auf ein einzelnes Gerichtsurteil.
- source_word: יָשֹׂרוּ
  choice: werden herrschen
  rationale: Die Form gehört zu שׂרר und bezeichnet das Ausüben von Herrschaft oder Amtsgewalt. „Herrschen“ ist hier direkt und wahrt zugleich die Variation gegenüber dem königlichen „regieren“.
theological_decisions:
- issue: Ob der König im Haupttext ausdrücklich als messianische Gestalt bezeichnet werden soll
  choice: Die unbestimmte Formulierung „ein König“ bleibt erhalten, ohne ihn im Haupttext ausdrücklich mit dem Messias gleichzusetzen.
  alternative: „Der König“ schreiben oder ihn in der Übersetzung ausdrücklich als messianischen König bezeichnen.
  rationale: Der weitere Zusammenhang kann messianisch verstanden werden, doch der hebräische Vers selbst nennt lediglich einen König und setzt bei מֶלֶךְ keinen Artikel. Die Übersetzung bewahrt daher die grammatische Offenheit und verlagert die verbreitete christliche Deutung in eine Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem prophetischem Ton. „Siehe“ wurde bewusst beibehalten; Satzbau und Zukunftsformen bleiben zugleich unmittelbar verständlich. Die parallelen Herrschaftsbegriffe sowie die nominalen Leitwörter „Gerechtigkeit“ und „Recht“ spiegeln die Struktur und Spannung des Hebräischen.
