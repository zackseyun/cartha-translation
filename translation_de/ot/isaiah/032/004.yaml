source:
  edition: WLC
  text: וּ/לְבַ֥ב נִמְהָרִ֖ים יָבִ֣ין לָ/דָ֑עַת וּ/לְשׁ֣וֹן עִלְּגִ֔ים תְּמַהֵ֖ר לְ/דַבֵּ֥ר צָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/004.yaml
  text: The heart of the hasty will understand knowledge[b][a], and the tongue of stammerers will hasten to speak clearly.
translation:
  language: de
  text: Das Herz der Unbesonnenen wird Erkenntnis gewinnen, und die Zunge der Stammelnden wird rasch klar und deutlich reden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַב
  choice: Herz
  rationale: Bewahrt den hebräischen anthropologischen Ausdruck für das innere Denk- und Erkenntnisvermögen; der kognitive Sinn wird durch „zur Erkenntnis gelangen“ deutlich.
- source_word: נִמְהָרִים
  choice: der Unbesonnenen
  rationale: Bezeichnet Menschen, die vorschnell oder impulsiv urteilen. „Unbesonnen“ ist im modernen Deutschen natürlicher als „hastig“ für eine geistige Haltung.
- source_word: יָבִין לָדַעַת
  choice: wird zur Erkenntnis gelangen
  rationale: Gibt die Verbindung von בין („verstehen, Einsicht gewinnen“) und dem Infinitiv ידע („erkennen, wissen“) idiomatisch wieder, ohne die kognitive Aussage abzuschwächen.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die konkrete Körpermetapher bleibt erhalten und entspricht dem poetischen Parallelismus mit „Herz“.
- source_word: עִלְּגִים
  choice: der Stammelnden
  rationale: Bezeichnet Menschen mit stockender oder gehemmter Rede; „Stammelnde“ bewahrt das konkrete Bild.
- source_word: תְּמַהֵר
  choice: wird bald
  rationale: Das Piel von מהר drückt Schnelligkeit oder Bereitwilligkeit aus. „Bald“ wirkt zusammen mit „reden“ natürlich und nimmt zugleich die Vorstellung rascher Veränderung auf.
- source_word: לְדַבֵּר צָחוֹת
  choice: klar und deutlich reden
  rationale: צָחוֹת beschreibt klare, verständliche oder deutliche Rede. Die Doppelung ist im Deutschen idiomatisch und stellt den Gegensatz zum Stammeln heraus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener hebräischer Bildsprache. Die parallelen Begriffe „Herz“ und „Zunge“ bleiben konkret; schwerfällige Wörtlichkeit wird vermieden.
