lexical_decisions:
- source_word: שָׁדַיִם
  choice: an die Brust
  rationale: Das hebräische Substantiv bezeichnet wörtlich die Brüste. In Verbindung mit dem Klagen liegt hier wahrscheinlich die Trauergeste des Sich-an-die-Brust-Schlagens vor; im Deutschen steht die entsprechende feste Wendung gewöhnlich im Singular.
- source_word: סֹפְדִים
  choice: sie schlagen sich vor Trauer
  rationale: Das Partizip bedeutet „klagen, trauern“. Die Übersetzung verbindet es mit „Brüste“ zu der wahrscheinlich gemeinten Trauergeste, ohne die wörtlich mögliche, stark komprimierte Lesart zu verschweigen.
- source_word: שְׂדֵי חֶמֶד
  choice: die kostbaren Felder
  rationale: חֶמֶד bezeichnet etwas Begehrenswertes, Wertvolles oder Angenehmes. „Kostbare Felder“ bringt zum Ausdruck, dass der Verlust geschätzten Kulturlandes beklagt wird.
- source_word: גֶּפֶן פֹּרִיָּה
  choice: der fruchttragende Weinstock
  rationale: גֶּפֶן bezeichnet den Weinstock beziehungsweise die Weinrebe, פֹּרִיָּה etwas Fruchtbares oder Fruchttragendes. Die Wiedergabe bewahrt das landwirtschaftliche Bild und den Singular.
- source_word: עַל
  choice: wegen
  rationale: Das wiederholte עַל bezeichnet hier den Anlass beziehungsweise Gegenstand der Trauer. Die Wiederholung von „wegen“ erhält den parallelen Aufbau.
theological_decisions:
- issue: Bezug von „Brüste“ und „klagen“
  choice: 'Wiedergabe als Trauergeste: „sich vor Trauer an die Brust schlagen“'
  alternative: „über die Brüste klagen“
  rationale: Der hebräische Ausdruck ist elliptisch und lässt die syntaktische Beziehung offen. Im Zusammenhang einer Klage über verwüstetes Kulturland ist die traditionelle Deutung als Brustschlagen wahrscheinlich; die alternative, wörtlichere Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische hebräische Formulierung wird im Haupttext verständlich entfaltet; ihre echte Mehrdeutigkeit wird in der Fußnote dokumentiert. Das Präsens entspricht dem hebräischen Partizip, ohne einen ausdrücklich nicht markierten Zukunftsbezug einzutragen.
