  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: de
  text: 'Denn ein Tor redet Torheit, und sein Herz sinnt auf Unrecht: Er übt Gottlosigkeit, redet Falsches gegen Jahwe, lässt den Hungrigen leer ausgehen und enthält dem Durstigen Trank vor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: Tor / Torheit
  rationale: Die Wiedergabe bewahrt das hebräische Wortspiel und bezeichnet nicht bloß mangelnde Intelligenz, sondern moralische Verblendung und Verwerflichkeit.
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: und sein Herz plant Unheil
  rationale: לֵב bezeichnet hier das innere Denken und Wollen. יַעֲשֶׂה kann das Hervorbringen bzw. Betreiben ausdrücken; „plant“ gibt den absichtsvollen inneren Vorgang in natürlichem Deutsch wieder, während „Unheil“ die ethische Bosheit von אָוֶן erfasst.
- source_word: חֹנֶף
  choice: gottlos
  rationale: Der Begriff bezeichnet hier religiös-ethische Frevelhaftigkeit und kann auch heuchlerische Verworfenheit einschließen. „gottlos“ passt zum anschließenden Reden gegen Jahwe.
- source_word: אֶל יְהוָה תּוֹעָה
  choice: Irrtum gegen Jahwe reden
  rationale: תּוֹעָה kann Irrtum, Verirrung oder Falschheit bezeichnen; אֶל lässt hier eine gegen Jahwe gerichtete oder ihn betreffende Aussage zu. Die Hauptfassung bewahrt den feindseligen Zug, die Fußnote die sachliche Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: den Hungrigen leer ausgehen lassen
  rationale: נֶפֶשׁ meint hier den hungrigen Menschen beziehungsweise sein bedürftiges Leben oder Verlangen, nicht eine vom Körper getrennte „Seele“. Die deutsche Wendung vermittelt die konkrete Entbehrung.
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: dem Durstigen den Trank vorenthalten
  rationale: Die Formulierung gibt das absichtliche Verknappen oder Entziehen des benötigten Getränks präzise und würdig wieder.
theological_decisions:
- issue: Bedeutungsumfang von חֹנֶף
  choice: gottlos
  alternative: heuchlerisch / frevelhaft
  rationale: Der Zusammenhang verbindet die Sünde mit falschem Reden gegen Jahwe und mit der Unterdrückung Bedürftiger. Daher ist der weitere religiös-ethische Sinn vorzuziehen, ohne die mögliche Nuance der Heuchelei auszuschließen.
- issue: Referenz von נֶפֶשׁ
  choice: der hungrige Mensch
  alternative: Seele / Verlangen
  rationale: Im Kontext geht es um einen leibhaftig hungernden Menschen. Eine Wiedergabe mit „Seele“ könnte im modernen Deutschen unbeabsichtigt eine körperlose Bedeutung nahelegen.
- issue: Richtung von אֶל יְהוָה
  choice: gegen Jahwe
  alternative: über Jahwe
  rationale: Die Präposition kann das Reden als gegen Jahwe gerichtet oder als ihn betreffend kennzeichnen. Der Kontext stützt die feindselige Nuance; die andere Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Parallelismus und das Wortspiel „Tor/Torheit“ bleiben erhalten. Das Semikolon gliedert die inneren und äußeren Formen des Unrechts. „Trank“ ist leicht gehoben, aber geläufig und entspricht dem poetischen Register.
