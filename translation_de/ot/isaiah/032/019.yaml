- from: Und es wird hageln, wenn der Wald niederstürzt[a], und im Tiefland wird die Stadt tief erniedrigt werden.
  to: Und es wird hageln, wenn der Wald fällt[a], und im Tiefland wird die Stadt tief sinken.
