review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge von Hagel, dem Herabkommen/Fallen des Waldes und der Erniedrigung der Stadt grundsätzlich zutreffend wieder. „Niederstürzt“ ist jedoch enger und gewaltsamer als ירד („hinabgehen, herabkommen, fallen“). Bei תִּשְׁפַּל ist die passive Formulierung „erniedrigt werden“ zwar kontextuell möglich, legt aber einen nicht genannten Handelnden nahe und hat im Deutschen eine vorrangig personale bzw. moralische Konnotation.
  naturalness: „Wenn der Wald fällt“ ist modernes, natürliches Deutsch und wahrt die Bildsprache ohne zusätzliche Spezifizierung. „Die Stadt wird tief sinken“ ist für den katastrophischen Abstieg einer Stadt idiomatischer als „tief erniedrigt werden“ und vermeidet eine unnötige Passivkonstruktion.
  terminology: „hageln“, „Wald“, „Tiefland“ und „Stadt“ sind angemessen. Die Fußnote soll die syntaktische Möglichkeit, בָרַד mit „Hagel“ als Subjekt zu verstehen, weiterhin dokumentieren, ohne die Hauptfassung zu überfrachten.
  issues:
