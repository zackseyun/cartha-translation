base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/019.yaml
  text: And it will hail when the forest falls[a], and the city will be utterly laid low in the lowland.
translation:
  language: de
  text: Und es wird hageln, wenn der Wald fällt[a], und im Tiefland wird die Stadt tief sinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Hagel fällt, wenn der Wald herabkommt.“ Im Hebräischen kann „Hagel“ formaler als Subjekt verstanden und das Herabkommen beziehungsweise Fallen auf den Wald bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: Und es wird hageln
  rationale: Die Form wird hier als unpersönlicher Witterungsausdruck zur Wurzel ברד („hageln/Hagel“) verstanden. Die Konjunktion וּ wird mit „Und“ wiedergegeben.
- source_word: בְּרֶדֶת
  choice: wenn … niederstürzt
  rationale: Der Infinitiv constructus von ירד („hinabgehen, herabkommen“) mit בְּ hat zeitliche Funktion. Beim Wald bezeichnet „niederstürzen“ anschaulich dessen Fall, ohne die mögliche formalere Deutung zu verschweigen.
- source_word: הַיָּעַר
  choice: der Wald
  rationale: יַעַר bezeichnet einen Wald oder ein bewaldetes Gebiet; „Wald“ ist die klare und geläufige deutsche Entsprechung.
- source_word: וּבַשִּׁפְלָה
  choice: und im Tiefland
  rationale: שְׁפֵלָה bezeichnet ein niedrig gelegenes Land beziehungsweise eine Niederung. „Tiefland“ bewahrt den topografischen Sinn und lässt zugleich das Wortspiel mit תִּשְׁפַּל erkennen.
- source_word: תִּשְׁפַּל
  choice: wird … tief erniedrigt werden
  rationale: Das Verb שׁפל bedeutet „niedrig sein/werden, erniedrigt werden“. Im Zusammenhang mit der Stadt geht es um katastrophische Niederwerfung, nicht um sittliche Demut. „tief erniedrigt werden“ gibt die starke Absenkung wieder und nimmt den Klang von „Tiefland“ auf.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר ist die gewöhnliche Bezeichnung für eine Stadt; der bestimmte Artikel wird beibehalten.
theological_decisions:
- issue: Identität von Wald und Stadt
  choice: Die Bilder bleiben ohne ausdrückliche historische Identifizierung stehen.
  alternative: Wald und Stadt im Text ausdrücklich mit bestimmten Mächten oder Orten gleichsetzen.
  rationale: Der hebräische Vers selbst nennt weder beim Wald noch bei der Stadt einen eindeutigen Referenten. Eine nähere Identifizierung würde Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildfolge des Hebräischen und das Wortspiel zwischen „Tiefland“ und „erniedrigt“ bleiben erhalten; die Fußnote dokumentiert die syntaktisch-lexikalische Alternative des ersten Halbverses.
