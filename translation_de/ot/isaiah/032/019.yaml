    rationale: ירד bezeichnet allgemein Herabkommen/Absteigen; ein gewaltsames Niederstürzen ist möglich, aber nicht ausdrücklich markiert.
  - severity: medium
    issue: „wird die Stadt tief erniedrigt werden“ ist semantisch und stilistisch weniger passend.
    rationale: Die deutsche Wendung ist vor allem auf Personen bezogen und legt durch das Passiv einen Handelnden nahe. Das hebräische Qal beschreibt unmittelbar das Niedrigwerden bzw. Sinken der Stadt.
