source:
  edition: WLC
  text: אַשְׁרֵי/כֶ֕ם זֹרְעֵ֖י עַל כָּל מָ֑יִם מְשַׁלְּחֵ֥י רֶֽגֶל הַ/שּׁ֖וֹר וְ/הַ/חֲמֽוֹר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: de
  text: Wie glücklich seid ihr, die ihr an allen Wassern[a] sät und Rind und Esel frei laufen lasst[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf allen Wassern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: den Fuß des Rindes und des Esels aussendet; gemeint ist wahrscheinlich, dass man die Tiere frei umhergehen oder weiden lässt.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: Wie glücklich seid ihr
  rationale: Die pluralische Glückwunschformel bezeichnet die Angesprochenen als beneidenswert glücklich bzw. in einer guten Lage. „Wie glücklich seid ihr“ gibt den ausrufenden Charakter wieder, ohne ausdrücklich einen Segensakt zu behaupten.
- source_word: זֹרְעֵי
  choice: die ihr … sät
  rationale: Das Partizip kennzeichnet die Angesprochenen durch ihre fortdauernde Tätigkeit. Der Relativsatz ist im Deutschen natürlich und bewahrt den direkten Pluralbezug.
- source_word: עַל כָּל מָיִם
  choice: an allen Wassern
  rationale: Die Formulierung bleibt nahe am Hebräischen und lässt sowohl reich bewässerte Orte als auch das Säen an Wasserflächen anklingen. Die mögliche räumliche Alternative „auf allen Wassern“ wird in der Fußnote offengehalten.
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: frei laufen lasst
  rationale: Wörtlich wird der „Fuß“ ausgesandt; im landwirtschaftlichen Zusammenhang bezeichnet die Wendung wahrscheinlich das Freilassen der Tiere zum Umhergehen oder Weiden. Die idiomatische deutsche Wiedergabe vermittelt dies verständlich.
- source_word: הַשּׁוֹר
  choice: Rind
  rationale: Das Wort bezeichnet hier ein einzelnes Tier der Rindergattung und muss nicht eigens als männlicher „Ochse“ bestimmt werden. „Rind“ passt zudem natürlich zur generischen Paarung mit dem Esel.
- source_word: וְהַחֲמוֹר
  choice: und Esel
  rationale: „Esel“ ist die klare, moderne Standardbezeichnung. Der bestimmte Artikel des Hebräischen wird in der generischen deutschen Paarformel „Rind und Esel“ idiomatisch nicht wiederholt.
