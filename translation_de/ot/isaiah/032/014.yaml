id: ISA.32.14
reference: Isaiah 32:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: de
  text: 'Denn der Palast ist verlassen,

    die belebte Stadt[a] ist aufgegeben.

    Der Ofel[b] und der Wachturm

    sind für immer zu Höhlen[c] geworden,

    zur Freude der Wildesel,

    zum Weideplatz der Herden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „das Getümmel der Stadt“ oder „die Menschenmenge der Stadt“; das hebräische Wort kann sowohl die Menge als auch ihren Lärm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der „Ofel“ ist wahrscheinlich der befestigte Hügelbereich Jerusalems.
    reason: cultural_note
  - marker: c
    text: 'Oder: „zu Tierhöhlen“ beziehungsweise „zu Schlupfwinkeln“; gemeint sind vermutlich verfallene Befestigungen, die Tieren als Unterschlupf dienen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: Palast
  rationale: Die übliche Bedeutung ist ein hervorgehobenes herrschaftliches oder befestigtes Gebäude; „Palast“ passt zum Bild der verwüsteten Stadt.
- source_word: נֻטָּשׁ
  choice: ist verlassen
  rationale: Das passive Verb bezeichnet etwas, das verlassen und sich selbst überlassen wurde.
- source_word: הֲמוֹן עִיר
  choice: die belebte Stadt
  rationale: הָמוֹן kann die Menschenmenge oder das lärmende Getümmel der Stadt bezeichnen. Die adjektivische Wiedergabe erfasst das Bild einer zuvor menschenreichen, geschäftigen Stadt, ohne ausschließlich den Lärm hervorzuheben.
- source_word: עֻזָּב
  choice: ist aufgegeben
  rationale: Die passive Form steht parallel zu נֻטָּשׁ. „Aufgegeben“ wahrt den Parallelismus und vermeidet eine unnötige Wortwiederholung.
- source_word: עֹפֶל
  choice: Ofel
  rationale: Das Wort ist hier am ehesten als topografischer Eigenname für den befestigten Hügelbereich Jerusalems zu verstehen.
- source_word: בַּחַן
  choice: Wachturm
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen Turm oder erhöhten Beobachtungsposten; „Wachturm“ passt zum Zusammenhang der Befestigungsanlagen.
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: sind zu Höhlen geworden
  rationale: Die ungewöhnliche Verbindung beschreibt wahrscheinlich, wie die Befestigungen zu höhlenartigen Ruinen oder Tierunterschlüpfen werden. Im Deutschen richtet sich das Verb natürlich nach dem zusammengesetzten Subjekt.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Dies ist die geläufige Wiedergabe der hebräischen Zeitformel und bewahrt die nachdrückliche Dauerangabe des Gerichtsbildes.
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: zur Freude der Wildesel
  rationale: Die Genitivverbindung beschreibt den verwüsteten Ort als etwas, woran Wildesel Gefallen finden.
- source_word: מִרְעֵה עֲדָרִים
  choice: zum Weideplatz der Herden
  rationale: Die Wiedergabe ist konkret und idiomatisch; עֲדָרִים bezeichnet Tierherden, im Weidekontext besonders Schaf- oder Ziegenherden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Zeilengliederung. Die parallelen Passivformen werden durch „verlassen“ und „aufgegeben“ wiedergegeben. Der Eigenname „Ofel“ bleibt erhalten; seltene oder mehrdeutige Ausdrücke werden knapp in Fußnoten erläutert.
