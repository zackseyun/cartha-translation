translation:
  language: de
  text: Doch der Edle plant Edles[a], und auf Edlem steht er fest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „plant Großzügiges“. Die hebräischen Wörter für „der Edle“ und „Edles“ können auch einen großzügigen Menschen und großzügige Vorhaben oder Taten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch Edles hat er Bestand“, „bei Edlem bleibt er“ oder „für Edles steht er ein“. Der knappe hebräische Ausdruck lässt diese eng verwandten Bedeutungsnuancen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: der Edle
  rationale: Das substantivierte Adjektiv bezeichnet einen edlen, vornehmen oder großzügigen Menschen. „Der Edle“ gibt die maskuline Einzahl als repräsentative Gestalt wieder und bewahrt den Gegensatz zum charakterlosen Menschen im Zusammenhang, ohne einen politischen Rang wie „Fürst“ festzulegen.
- source_word: נְדִיבוֹת
  choice: Edles
  rationale: Das abstrakte Pluralwort kann edle oder großzügige Vorhaben und Taten bezeichnen. „Edles“ erhält die Wortverwandtschaft mit „der Edle“ und lässt Absichten wie Handlungen offen.
- source_word: יָעָץ
  choice: plant
  rationale: Das Verb kann „beraten“, „beschließen“ oder „planen“ bedeuten. Da hier die Vorhaben des Subjekts gemeint sind, ist „plant“ im modernen Deutsch am natürlichsten.
- source_word: עַל ... יָקוּם
  choice: auf Edlem besteht er
  rationale: Die knappe Verbindung von עַל mit קום zeichnet wörtlich das Bild des Stehens und kann zugleich Festhalten oder Bestandhaben ausdrücken. „Auf Edlem besteht er“ bewahrt dieses Bild und die mögliche Bedeutung beharrlicher Ausrichtung.
theological_decisions:
- issue: Art und Grundlage des Bestehens im zweiten Satzteil
  choice: Die bildhafte und ethische Mehrdeutigkeit von עַל ... יָקוּם bleibt erhalten.
  alternative: „Durch Edles hat er Bestand“ oder „für Edles steht er ein“.
  rationale: Der hebräische Ausdruck kann Grundlage, Mittel oder beharrliches Eintreten andeuten. Der Haupttext legt keine bestimmte theologische Ursache oder Verdienstvorstellung fest; die Fußnote nennt die eng verwandten Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die substantivierten Formen „der Edle“ und „Edles“ bilden die hebräische Wortwiederholung nach. Die leicht markierte Wendung „auf Edlem besteht er“ erhält bewusst das konkrete Bild und wird durch eine Fußnote erläutert.
