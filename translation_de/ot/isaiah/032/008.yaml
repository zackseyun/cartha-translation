  source_fidelity: 'Der erste Satzteil gibt die Wiederaufnahme von נָדִיב / נְדִיבוֹת angemessen wieder: „der Edle“ und „Edles“ bewahren sowohl die Wortverwandtschaft als auch die mögliche moralische Bedeutung. „plant“ ist für יָעָץ in diesem Kontext treffend. Im zweiten Satzteil ist „besteht auf“ jedoch im heutigen Deutsch vor allem als „auf etwas beharren“ verständlich und bildet das hebräische Bild von עַל ... יָקוּם („auf ... stehen/standhalten“) nicht zuverlässig ab.'
  naturalness: „Doch der Edle plant Edles“ ist würdevoll und verständlich. „Und auf Edlem besteht er“ ist zwar formal möglich, klingt aber idiomatisch missverständlich. „Und auf Edlem steht er fest“ ist natürlich genug, wahrt das Bild und vermittelt die Nuance von Standhaftigkeit bzw. Festigkeit.
