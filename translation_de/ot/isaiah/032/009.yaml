  text: נָשִׁים֙ שַֽׁאֲנַנּ֔וֹת קֹ֖מְנָה שְׁמַ֣עְנָה קוֹלִ֑/י בָּנוֹת֙ בֹּֽטח֔וֹת הַאְזֵ֖נָּה אִמְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/009.yaml
  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: de
  text: Ihr selbstzufriedenen Frauen[a], steht auf und hört meine Stimme! Ihr sorglosen Töchter[b][c], hört meinem Wort aufmerksam zu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Frauen, die ihr ungestört lebt“. Das hebräische Wort kann ruhiges, unbehelligtes Leben bezeichnen, hier jedoch mit dem Unterton sorgloser Selbstsicherheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Töchter“. Die Bezeichnung wird beibehalten, um die hebräische Anredeform zu bewahren.'
    reason: cultural_note
  - marker: c
    text: „Sorglos“ kann auch mit „sicher“ oder „voll Selbstvertrauen“ wiedergegeben werden; gemeint ist das Gefühl, vor Gefahr geschützt zu sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: Frauen
  rationale: Der Plural bezeichnet hier allgemein Frauen; „Ehefrauen“ wäre im parallelen Zusammenhang mit „Töchter“ unnötig eng.
- source_word: שַׁאֲנַנּוֹת
  choice: selbstzufrieden
  rationale: Das Adjektiv beschreibt ungestörte Ruhe oder sorglose Sicherheit und hat in dieser prophetischen Warnung einen tadelnden Unterton. „Selbstzufrieden“ gibt diesen Unterton wieder, ohne die mögliche Grundbedeutung zu verschweigen.
- source_word: קֹמְנָה
  choice: steht auf
  rationale: Der feminine Pluralimperativ von קום fordert die Angeredeten unmittelbar auf, sich zu erheben.
- source_word: שְׁמַעְנָה
  choice: hört
  rationale: Der Imperativ bezeichnet hier das bewusste Hören auf die folgende Botschaft.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Die wörtliche und im direkten Anruf natürliche Wiedergabe bewahrt das Bild des gesprochenen Wortes.
- source_word: בָּנוֹת
  choice: Töchter
  rationale: Die wörtliche Anrede wird beibehalten, damit Form und Parallelismus des Hebräischen nicht zu einem zweiten „Frauen“ eingeebnet werden.
- source_word: בֹּטְחוֹת
  choice: sorglos
  rationale: Das Partizip bezeichnet Frauen, die sich sicher fühlen. Im warnenden Kontext bringt „sorglos“ die problematische Selbstsicherheit natürlich zum Ausdruck; die neutralere Alternative „sicher“ wird in der Fußnote genannt.
- source_word: הַאְזֵנָּה
  choice: hört aufmerksam
  rationale: Der Hifil-Imperativ fordert nicht bloß akustisches Hören, sondern aufmerksames Zuhören; diese Nuance wird ausdrücklich wiedergegeben.
- source_word: אִמְרָתִי
  choice: mein Wort
  rationale: Die knappe Wendung bezeichnet die Äußerung des Sprechers und steht passend parallel zu „meine Stimme“.
theological_decisions: []
