  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die femininen Pluralimperative werden natürlich wiedergegeben; der Parallelismus zwischen „Frauen“ und „Töchter“ sowie zwischen „meine Stimme“ und „mein Wort“ bleibt erhalten. Die Ausrufezeichen vermitteln den dringlichen Aufforderungscharakter, ohne zusätzliche Inhalte einzutragen.
