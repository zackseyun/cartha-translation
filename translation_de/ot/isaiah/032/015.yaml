id: ISA.32.15
reference: Isaiah 32:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: de
  text: bis ein Geist aus der Höhe über uns ausgegossen wird[a] und die Wüste zu fruchtbarem Land wird[b] und das fruchtbare Land als Wald gilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Geist aus der Höhe«. Das hebräische Wort רוּחַ kann »Geist« bedeuten und sich hier insbesondere auf Gottes Geist beziehen.'
    reason: alternative_reading
  - marker: b
    text: »Fruchtbares Land« gibt das hebräische Wort karmel wieder, das fruchtbares oder kultiviertes Land bezeichnet; hier ist wahrscheinlich nicht der Ortsname Karmel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: bis
  rationale: Kennzeichnet die zeitliche Grenze des zuvor beschriebenen Zustands.
- source_word: יֵעָרֶה עָלֵינוּ
  choice: über uns ausgegossen wird
  rationale: Das Nifal von ערה wird passiv wiedergegeben; »über uns« bewahrt das Bild des Ausgießens und klingt im Deutschen natürlich.
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Zusammenhang der erneuernden Wirkung aus der Höhe passt »Geist« am besten; der fehlende Artikel wird im Deutschen durch die artikellose Form nicht unnötig vereindeutigt.
- source_word: מִמָּרוֹם
  choice: aus der Höhe
  rationale: Gibt den räumlich-erhabenen, wahrscheinlich himmlischen Sinn von מָרוֹם knapp und würdig wieder.
- source_word: מִדְבָּר
  choice: die Wüste
  rationale: Bewahrt den deutlichen Gegensatz zum kultivierten, fruchtbaren Land.
- source_word: כַּרְמֶל
  choice: fruchtbares Land
  rationale: כַּרְמֶל ist hier wahrscheinlich ein Gattungsbegriff für fruchtbares beziehungsweise kultiviertes Land und kein Ortsname.
- source_word: יַעַר
  choice: Wald
  rationale: Direkte und natürliche Wiedergabe des hebräischen Begriffs für Wald beziehungsweise Waldland.
- source_word: יֵחָשֵׁב
  choice: als … gilt
  rationale: Das Nifal von חשב bezeichnet hier das Angesehen- oder Eingestuftwerden; »gilt als« ist prägnantes modernes Deutsch.
theological_decisions:
- issue: Ob רוּחַ ausdrücklich als der Heilige Geist bezeichnet werden soll
  choice: Geist aus der Höhe
  alternative: der Geist aus der Höhe / der Heilige Geist aus der Höhe
  rationale: Der Kontext legt Gottes lebensspendendes Wirken nahe, doch der hebräische Text nennt weder ausdrücklich den Heiligen Geist noch setzt er einen Artikel. Die artikellose deutsche Form bewahrt die Offenheit, während die Fußnote die spezifischere Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Bildfolge Wüste – fruchtbares Land – Wald bleiben erhalten; die artikellose Wiedergabe »Geist« bewahrt die Mehrdeutigkeit des Hebräischen.
