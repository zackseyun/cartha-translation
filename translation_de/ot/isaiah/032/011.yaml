id: ISA.32.11
reference: Isaiah 32:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: de
  text: Zittert, ihr sorglosen Frauen; bebt, ihr Selbstsicheren! Zieht euch aus, entblößt euch und bindet euch Sacktuch[a] um die Hüften[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wird nicht ausdrücklich gesagt, was sie sich umbinden sollen. Im Zusammenhang des Trauerns ist Sacktuch gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „um die Lenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְדוּ
  choice: Zittert
  rationale: Der Imperativ von חרד bezeichnet ein angstvolles Zittern. „Zittert“ ist unmittelbar, verständlich und wahrt die Dringlichkeit.
- source_word: שַׁאֲנַנּוֹת
  choice: ihr sorglosen Frauen
  rationale: Das feminine Pluralwort bezeichnet Frauen, die unbesorgt und in selbstzufriedener Ruhe leben. „Sorglos“ bewahrt sowohl die äußere Ruhe als auch den kritischen Unterton; „Frauen“ macht die im Hebräischen markierte Anrede sichtbar.
- source_word: רְגָזָה
  choice: bebt
  rationale: Der Imperativ aus רגז steht parallel zu חִרְדוּ und bezeichnet heftiges Erschüttertsein. „Bebt“ hält die Parallelität fest, ohne das erste Verb lediglich zu wiederholen.
- source_word: בֹּטְחוֹת
  choice: ihr Selbstsicheren
  rationale: Das feminine Partizip beschreibt Menschen, die sich sicher fühlen. „Selbstsicheren“ gibt in der prophetischen Warnung den ironisch-kritischen Klang wieder und bleibt als substantivierte Anrede feminin.
- source_word: פְּשֹׁטָה וְעֹרָה
  choice: Zieht euch aus, entblößt euch
  rationale: Die beiden knappen Imperative bezeichnen das Ablegen der Kleidung und das Bloßlegen. Die deutsche Doppelung erhält die steigernde, eindringliche Folge des Hebräischen.
- source_word: וַחֲגֹרָה
  choice: und bindet euch Sacktuch um
  rationale: חגר bedeutet, etwas umzugürten oder umzubinden. Der Gegenstand wird im Vers nicht genannt; im prophetischen Trauerzusammenhang ist Sacktuch die naheliegende Ergänzung und wird deshalb mit Fußnote kenntlich gemacht.
- source_word: עַל חֲלָצָיִם
  choice: um die Hüften
  rationale: Wörtlich steht „auf/um die Lenden“. „Um die Hüften“ ist im heutigen Deutsch die natürliche Bezeichnung für das Umbinden eines Gewandes.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt zu חגר
  choice: „Sacktuch“ wird als kontextuelle Ergänzung in den Text aufgenommen und durch eine Fußnote ausgewiesen.
  alternative: Den unvollständigen Ausdruck wörtlich als „gürtet euch um die Hüften“ wiedergeben oder allgemeiner „ein Trauergewand“ ergänzen.
  rationale: Die Handlung gehört zum prophetischen Bild öffentlicher Trauer und Demütigung. Die Ergänzung macht den kulturell vorausgesetzten Sinn verständlich, ohne sie als ausdrücklich vorhandenes hebräisches Wort auszugeben.
translation_notes:
  register: Moderne, eindringliche prophetische Rede mit kurzen Imperativen. Die feminine Anrede des Hebräischen bleibt ausdrücklich erhalten. „Sacktuch“ ist als erschlossene kulturelle Ergänzung transparent markiert.
