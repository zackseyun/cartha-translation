  text: עַ֚ל אַדְמַ֣ת עַמִּ֔/י ק֥וֹץ שָׁמִ֖יר תַּֽעֲלֶ֑ה כִּ֚י עַל כָּל בָּתֵּ֣י מָשׂ֔וֹשׂ קִרְיָ֖ה עַלִּיזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: de
  text: Auf dem Land meines Volkes werden Dornen und Disteln wachsen, ja, auf allen Häusern der Freude in der jubelnden Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: das Land meines Volkes
  rationale: אַדְמָה kann Erdboden, Ackerland oder Land bezeichnen. „Land“ ist hier natürlich und bewahrt zugleich den territorialen Bezug.
- source_word: קוֹץ שָׁמִיר
  choice: Dornen und Disteln
  rationale: Das feste Wortpaar bezeichnet dornigen Wildwuchs als Bild der Verwüstung. Die geläufige deutsche Paarung gibt das Bild klar wieder, ohne die Pflanzen botanisch zu eng festzulegen.
- source_word: תַּעֲלֶה
  choice: werden … wachsen
  rationale: עלה beschreibt hier das Aufkommen von Pflanzen aus dem Boden. „Wachsen“ ist im Deutschen idiomatisch und erhält das konkrete Bild.
- source_word: כִּי
  choice: ja
  rationale: כִּי wirkt hier am ehesten bekräftigend und erweitert die Aussage auf die Häuser der Stadt; „ja“ bildet diese emphatische Fortführung knapp ab.
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: Häuser der Freude
  rationale: Die konstruktive Verbindung bedeutet wörtlich „Häuser der Freude“. Die poetische Formulierung lässt offen, ob Wohnhäuser, Feststätten oder allgemein von Freude geprägte Häuser gemeint sind.
- source_word: קִרְיָה עַלִּיזָה
  choice: die ausgelassene Stadt
  rationale: עַלִּיזָה bezeichnet eine von Jubel und fröhlicher Ausgelassenheit geprägte Stadt. „Ausgelassen“ bewahrt in diesem Gerichtskontext sowohl die Freude als auch den möglichen Unterton sorgloser Selbstsicherheit.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Der Satz bewahrt die Steigerung vom Land zu den Häusern der Stadt und die Spannung zwischen bisheriger Freude und kommender Verwüstung.
