base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: de
  text: Dann werden die Augen der Sehenden nicht getrübt sein[a], und die Ohren der Hörenden werden aufmerksam zuhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden nicht wegsehen«. Die Bedeutung des hebräischen Verbs ist unsicher; es kann auf beeinträchtigtes oder verdecktes Sehen hindeuten, möglicherweise aber auch auf ein Abwenden des Blicks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא תִשְׁעֶינָה
  choice: Dann werden … nicht mehr getrübt sein
  rationale: Das erste וְ führt den Folgezusammenhang des prophetischen Abschnitts weiter; „Dann“ gibt diesen Verlauf natürlich wieder. שעה bezeichnet hier wahrscheinlich eine Beeinträchtigung oder Trübung des Sehens. „nicht mehr“ macht den angekündigten Wandel idiomatisch deutlich, ohne die Bildsprache aufzulösen.
- source_word: עֵינֵי רֹאִים
  choice: die Augen der Sehenden
  rationale: Die Konstruktverbindung und das substantivierte Partizip werden knapp und parallel zum zweiten Versglied wiedergegeben. „Sehende“ vermeidet die fachsprachliche Deutung als prophetische „Seher“.
- source_word: וְ/אָזְנֵי שֹׁמְעִים
  choice: und die Ohren der Hörenden
  rationale: Die syntaktische und poetische Parallelität zu „die Augen der Sehenden“ bleibt erhalten.
- source_word: תִּקְשַׁבְנָה
  choice: werden aufmerksam zuhören
  rationale: קשׁב bezeichnet ein aufmerksames, bewusstes Hören und nicht lediglich die Fähigkeit, Geräusche wahrzunehmen.
theological_decisions:
- issue: Art der wiederhergestellten Wahrnehmung
  choice: Die körperlich-sinnliche Bildsprache bleibt bestehen und kann im Kontext zugleich erneuerte Einsicht und Aufnahmebereitschaft bezeichnen.
  alternative: Ausschließlich körperliche Heilung von Seh- und Hörbeeinträchtigungen oder ausschließlich geistlich-moralische Einsicht.
  rationale: Jesaja 32,1–4 verbindet gerechte Herrschaft mit erneuertem Verstehen. Die Übersetzung bewahrt daher die Spannung zwischen sinnlicher und übertragener Wahrnehmung, statt sie eindeutig auf eine Ebene festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur der beiden Vershälften wird bewahrt; „getrübt sein“ ist verständlich und näher an der möglichen Sehbeeinträchtigung als „blind sein“.
