id: ISA.10.2
reference: Isaiah 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: de
  text: um die Armen vom Recht abzudrängen und den Unterdrückten meines Volkes ihren Rechtsanspruch zu rauben, sodass Witwen zu ihrer Beute werden und sie die Vaterlosen[a] ausplündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Waisen. Das hebräische Wort bezeichnet besonders Kinder, die keinen Vater mehr haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: abzudrängen
  rationale: Das Hifil von נטה bezeichnet hier, dass Menschen vom Recht beziehungsweise vom Rechtsverfahren ferngehalten werden. „Abdrängen“ bewahrt das räumliche Bild, ohne die Aussage durch „verdrehen“ unnötig zu verengen.
- source_word: מִדִּין
  choice: vom Recht
  rationale: דִּין kann Recht, Urteil oder Rechtsverfahren bezeichnen. „Vom Recht“ ist im Deutschen natürlich und umfasst sowohl den Zugang zur Rechtsprechung als auch die daraus erwartete Gerechtigkeit.
- source_word: דַּלִּים
  choice: die Armen
  rationale: דַּל bezeichnet wirtschaftlich Arme und sozial Schwache. Im Zusammenhang der richterlichen Unterdrückung ist „die Armen“ die klare, geläufige Wiedergabe.
- source_word: וְלִגְזֹל
  choice: und ... zu rauben
  rationale: גזל bezeichnet gewaltsames oder widerrechtliches Wegnehmen. „Rauben“ bringt den Rechtsbruch und die ausbeuterische Gewalt deutlich zum Ausdruck.
- source_word: מִשְׁפַּט
  choice: ihren Rechtsanspruch
  rationale: מִשְׁפָּט meint hier das den Bedrängten rechtlich Zustehende. „Rechtsanspruch“ bewahrt den juristischen Sinn und vermeidet eine bloße Wiederholung von „Recht“.
- source_word: עֲנִיֵּי עַמִּי
  choice: den Unterdrückten meines Volkes
  rationale: עָנִי kann arm, bedrängt oder unterdrückt bedeuten. „Unterdrückten“ hebt in diesem Kontext die durch ungerechte Machtausübung verursachte Not hervor, während „meines Volkes“ den ersten-personalen Gottesbezug wahrt.
- source_word: לִהְיוֹת
  choice: sodass ... werden
  rationale: Der Infinitiv bezeichnet hier Zweck oder Folge. „Sodass“ gibt den Zusammenhang flüssig wieder, ohne eindeutig zwischen beabsichtigtem Zweck und tatsächlicher Folge zu entscheiden.
- source_word: אַלְמָנוֹת
  choice: Witwen
  rationale: Dies ist die direkte und im Deutschen geläufige Bezeichnung der konkret genannten schutzbedürftigen Gruppe.
- source_word: שְׁלָלָם
  choice: ihre Beute
  rationale: שָׁלָל bezeichnet Kriegsbeute oder Plündergut. „Beute“ erhält das Bild räuberischer Ausbeutung und vermeidet eine unmittelbare Wortwiederholung mit „ausplündern“.
- source_word: יְתוֹמִים
  choice: die Vaterlosen
  rationale: יָתוֹם bezeichnet im Hebräischen besonders ein Kind ohne Vater. „Vaterlose“ erhält diese konkrete soziale Kategorie; die geläufigere Alternative „Waisen“ wird in einer Fußnote genannt.
- source_word: יָבֹזּוּ
  choice: sie ... ausplündern
  rationale: בזז bedeutet plündern oder ausrauben. „Ausplündern“ ist lebendig, verständlich und bewahrt das gewaltsame Bild.
theological_decisions:
- issue: Konkrete Gruppen schutzbedürftiger Menschen
  choice: „Witwen“ und „Vaterlose“ werden ausdrücklich beibehalten.
  alternative: Verallgemeinerung als „Schutzbedürftige“ oder Wiedergabe als „Witwen und Waisen“.
  rationale: Der hebräische Text nennt konkrete gesellschaftlich besonders gefährdete Gruppen. Ihre Beibehaltung wahrt die ethische Schärfe der prophetischen Anklage; „Vaterlose“ bildet יְתוֹמִים genauer ab als das umfassendere „Waisen“.
- issue: Sprecherperspektive in עַמִּי
  choice: „meines Volkes“
  alternative: „seines Volkes“ oder „des Volkes“
  rationale: Das hebräische Suffix steht in der ersten Person Singular und setzt die göttliche Sprecherperspektive fort. Diese Perspektive wird nicht geglättet.
- issue: Zweck oder Folge bei לִהְיוֹת
  choice: „sodass“
  alternative: „damit“
  rationale: Die Infinitivkonstruktion kann Zweck oder Ergebnis ausdrücken. „Sodass“ lässt diese Beziehung hinreichend offen und vermeidet eine unnötige Festlegung auf ausdrückliche Absicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung von Vers 1 mit „um“ eröffnet. Die Rechtsbegriffe und das räuberische Bildfeld werden klar unterschieden und zugleich eng am Hebräischen gehalten.
