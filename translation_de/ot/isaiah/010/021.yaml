base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
translation:
  language: de
  text: Ein Rest wird umkehren[a], der Rest Jakobs, zu dem starken Gott[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückkehren“. Die Formulierung greift den Namen Schear-Jaschub („Ein Rest kehrt um/zurück“) aus Jesaja 7,3 auf.'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 'Zu „der starke Gott“ vgl. denselben hebräischen Titel in Jesaja 9,5. Möglich ist auch: „zu Gott, dem Starken“; weniger wahrscheinlich: „zu einem starken Gott“ oder „zu einem mächtigen Helden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: Rest
  rationale: Das Substantiv bezeichnet das, was nach Gericht oder Katastrophe übrig bleibt. „Rest“ ist in Jesaja die etablierte, knappe Wiedergabe und bewahrt sowohl den zahlenmäßigen als auch den theologischen Gehalt.
- source_word: יָשׁוּב
  choice: wird umkehren
  rationale: Das Qal-Imperfekt von שוב kann sowohl Rückkehr als auch Umkehr bezeichnen. „Wird umkehren“ passt zur Bewegung hin zu Gott und bewahrt zugleich die im Hebräischen vorhandene Bedeutungsweite.
- source_word: שְׁאָר יַעֲקֹב
  choice: der Rest Jakobs
  rationale: Die Status-constructus-Verbindung wird im Deutschen natürlich und präzise durch einen Genitiv wiedergegeben.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der hebräische Text nennt ausdrücklich Jakob; der Name wird nicht deutend durch „Israel“ ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Ausrichtung beziehungsweise Bewegung auf eine Person hin.
- source_word: אֵל גִּבּוֹר
  choice: der starke Gott
  rationale: Die Wortgruppe bezeichnet im Kontext Gott und entspricht derselben hebräischen Titelformulierung wie in Jesaja 9,5. „Der starke Gott“ ist würdig, verständlich und näher am Grundwort גבור als eine konfessionell stärker geprägte Ausformulierung.
theological_decisions:
- issue: Deutung von אֵל גִּבּוֹר
  choice: der starke Gott
  alternative: Gott, der Starke; ein starker Gott; ein mächtiger Held
  rationale: Dass der Rest zu dieser Gestalt umkehrt, spricht im unmittelbaren Zusammenhang deutlich für Gott als Referenten. Die Übersetzung lässt das Gewicht des göttlichen Titels bestehen, während weniger wahrscheinliche lexikalische Möglichkeiten in der Fußnote genannt werden.
- issue: Bedeutungsweite von שוב
  choice: umkehren
  alternative: zurückkehren
  rationale: Im Zusammenhang mit der Hinwendung zu Gott kann das Verb geistliche Umkehr bezeichnen, ohne den räumlichen Sinn der Rückkehr auszuschließen. Die Fußnote hält diese echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung von „Rest“ wird als bewusstes Stilmittel des hebräischen Textes bewahrt. „Umkehren“ erhält die theologische Spannung zwischen Rückkehr und Hinwendung zu Gott.
