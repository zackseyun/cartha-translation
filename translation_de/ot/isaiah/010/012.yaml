source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn der Herr sein ganzes Werk auf dem Berg Zion und in Jerusalem vollendet hat, werde ich die Frucht des hochmütigen Herzens des Königs von Assyrien[b] ahnden[a] und die Pracht seiner hochmütigen Augen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich … zur Rechenschaft ziehen“. Das hebräische Verb kann ein göttliches Einschreiten zum Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Frucht der Größe des Herzens des Königs von Assyrien“. Gemeint ist hier die überhebliche Selbstüberhöhung seines Herzens.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Pracht der Höhe seiner Augen“, also der Stolz, der sich in seinen Augen zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 'Und es wird geschehen: Wenn'
  rationale: Die Wendung leitet einen zukünftigen Zeitpunkt ein. Die Kombination aus Doppelpunkt und „wenn“ gibt den hebräischen Übergang in würdigem, verständlichem Deutsch wieder.
- source_word: יְבַצַּע
  choice: vollendet hat
  rationale: Das Piel von בצע bezeichnet hier das vollständige Ausführen beziehungsweise Beenden eines Handelns; das Perfekt im deutschen Temporalsatz entspricht dem vorzeitigen Abschluss.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der Gottestitel „Herr“, nicht das Tetragramm.
- source_word: כָּל מַעֲשֵׂהוּ
  choice: sein ganzes Werk
  rationale: Die Formulierung bewahrt den kollektiven Singular und bezeichnet die Gesamtheit des göttlichen Handelns.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: am Berg Zion und in Jerusalem
  rationale: Die Präposition wird zunächst räumlich verstanden. „Am Berg Zion“ und „in Jerusalem“ gibt die örtliche Zuordnung natürlich wieder, ohne ausdrücklich „gegen“ einzutragen.
- source_word: אֶפְקֹד עַל
  choice: werde ich … ahnden
  rationale: פקד על bezeichnet im Gerichtszusammenhang ein strafendes Einschreiten. „Ahnden“ passt im Deutschen auch zu den abstrakten Objekten „Frucht“ und „Prunk“ und bewahrt den richterlichen Sinn.
- source_word: פְּרִי גֹדֶל לְבַב
  choice: die Frucht der Überheblichkeit im Herzen
  rationale: „Frucht“ erhält das hebräische Bild des hervorgebrachten Ergebnisses; „Überheblichkeit“ gibt die im Zusammenhang eindeutig negative „Größe“ des Herzens verständlich wieder.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Dies ist die übliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  choice: den Prunk seines hochmütigen Blicks
  rationale: „Prunk“ bewahrt den Gedanken demonstrativer Herrlichkeit, während „hochmütiger Blick“ die idiomatische Bedeutung der wörtlichen „Höhe seiner Augen“ mit erhaltenem Augenmotiv ausdrückt.
theological_decisions:
- issue: Bedeutung des göttlichen Werkes an Zion und Jerusalem
  choice: 'Räumlich: „am Berg Zion und in Jerusalem“'
  alternative: „gegen den Berg Zion und Jerusalem“
  rationale: Die Präposition בְּ bezeichnet hier den Bereich, in dem der Herr sein Werk vollendet. Die Übersetzung legt nicht fest, ob dieses Werk ausschließlich Gericht, Wiederherstellung oder beides umfasst, und bewahrt so die Spannung des Textes.
- issue: Gegenstand des anschließenden Gerichts
  choice: Die syntaktischen Gegenstände „Frucht“ und „Prunk“ bleiben erhalten
  alternative: 'Den König ausdrücklich als direktes Objekt einsetzen: „werde ich den König … bestrafen“'
  rationale: Der hebräische Text richtet die Heimsuchung grammatisch auf die Hervorbringungen beziehungsweise Ausdrucksformen seines Hochmuts. Diese markante Bildsprache sollte nicht stillschweigend vereinfacht werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Formel bleibt erkennbar, ohne altertümlich zu wirken. Die Metaphern „Frucht“ und „Prunk“ werden bewahrt; schwer verständliche hebräische Idiome werden behutsam idiomatisch wiedergegeben und in den Fußnoten transparent gemacht.
