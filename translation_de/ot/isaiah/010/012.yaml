    issue: „seines hochmütigen Blicks“
    rationale: Der hebräische Text spricht ausdrücklich von „seinen Augen“ (עֵינָיו). Die idiomatische Deutung des Hochmuts kann beibehalten werden, sollte aber den Plural und das Augenbild nicht durch den singularischen „Blick“ ersetzen.
