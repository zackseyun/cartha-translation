  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut lesbar. „Frucht des hochmütigen Herzens“ ist idiomatischer und bildet die hebräische Genitivverbindung klarer ab als „Frucht der Überheblichkeit im Herzen“.
  terminology: „der Herr“, „Berg Zion“, „Jerusalem“ und „König von Assyrien“ sind angemessen. „Pracht“ gibt תִּפְאֶרֶת näher wieder als „Prunk“, ohne die ironisch-kritische Wertung des Kontexts vorwegzunehmen. Die Fußnoten erhalten die wörtlichen Bilder und die lexikalische Alternative zu פקד.
