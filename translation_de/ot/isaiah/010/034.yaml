id: ISA.10.34
reference: Isaiah 10:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: de
  text: Und das Dickicht des Waldes wird mit Eisen niedergehauen, und der Libanon wird durch einen Mächtigen fallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Mächtigen“, wenn „Mächtiger“ hier als Bezeichnung für Gott verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  choice: wird niedergehauen
  rationale: Das Nifal bezeichnet hier passiv das Fällen beziehungsweise Abhauen. „Niedergehauen“ passt zum Waldmotiv und gibt die gewaltsame Handlung natürlich wieder.
- source_word: סִבְכֵי הַיַּעַר
  choice: das Dickicht des Waldes
  rationale: סבך bezeichnet dicht verflochtenes Gestrüpp oder Geäst. Der deutsche Singular „Dickicht“ eignet sich als Kollektivbezeichnung und bewahrt das Bild des dichten Waldes.
- source_word: בַּבַּרְזֶל
  choice: mit Eisen
  rationale: Wörtlich steht „mit dem Eisen“. Gemeint sein dürfte metonymisch ein eisernes Werkzeug; „mit Eisen“ vermeidet jedoch, eine nicht ausdrücklich genannte Axt einzutragen.
- source_word: וְהַלְּבָנוֹן
  choice: und der Libanon
  rationale: Der geografische Name bleibt unverändert und bewahrt zugleich die mögliche Bildsprache vom berühmten Zedernwald und seiner Größe.
- source_word: בְּאַדִּיר
  choice: durch einen Mächtigen
  rationale: אַדִּיר kann einen Mächtigen oder Majestätischen bezeichnen; בְּ wird hier instrumental beziehungsweise agentiv verstanden. Die Kleinschreibung lässt offen, ob ausdrücklich Gott gemeint ist.
- source_word: יִפּוֹל
  choice: wird fallen
  rationale: Die Grundbedeutung von נפל ist „fallen“. Diese Wiedergabe erhält die poetische Parallele, ohne das im Kontext naheliegende Fällen ausdrücklich in das Verb hineinzulesen.
theological_decisions:
- issue: Ob אַדִּיר ausdrücklich als Gottestitel wiederzugeben ist
  choice: durch einen Mächtigen
  alternative: durch den Mächtigen
  rationale: Der Kontext legt Gottes richtendes Handeln nahe, doch der hebräische Ausdruck nennt Gott nicht eindeutig. Der Haupttext erhält daher die Mehrdeutigkeit; die mögliche Lesart als Gottestitel wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dickicht“ und „mit Eisen“ bewahren die knappe Wald- und Fällungsmetaphorik; die syntaktische und theologische Mehrdeutigkeit von בְּאַדִּיר bleibt erhalten.
