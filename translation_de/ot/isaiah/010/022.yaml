source:
  edition: WLC
  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: de
  text: Denn selbst wenn dein Volk, Israel, wie der Sand am Meer wäre, wird nur ein Rest von ihm[a] umkehren. Eine Vernichtung ist beschlossen, überfließend von Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nur ein Rest darin wird umkehren.“ Das hebräische Pronomen steht im Singular und bezieht sich auf „Volk“ als Kollektivbegriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Recht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn selbst wenn
  rationale: 'Die Verbindung ist hier konzessiv: Trotz der unermesslichen Größe Israels wird nur ein Rest umkehren. „Denn selbst wenn“ gibt sowohl den Anschluss als auch den Gegensatz wieder.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: dein Volk, Israel
  rationale: Gibt das Substantiv mit Suffix der 2. Person Singular und den appositionellen Eigennamen unmittelbar und in natürlichem Deutsch wieder.
- source_word: כְּחוֹל הַיָּם
  choice: wie der Sand am Meer
  rationale: Bewahrt das Bild einer unzählbaren Menge in einer geläufigen deutschen Wendung.
- source_word: שְׁאָר
  choice: nur ein Rest
  rationale: „Ein Rest“ entspricht der unbestimmten Form; „nur“ macht den im Kontrast liegenden ausschließenden Sinn im Deutschen deutlich.
- source_word: יָשׁוּב
  choice: umkehren
  rationale: „Umkehren“ bewahrt die Bedeutungsbreite von שוב zwischen tatsächlicher Rückkehr und innerer Umkehr, ohne den prophetischen Sinn auf eine dieser Möglichkeiten festzulegen.
- source_word: בּוֹ
  choice: von ihm
  rationale: Das singularische Pronomen bezieht sich auf das kollektiv verstandene „Volk“. Die partitive Wiedergabe bezeichnet den Rest aus diesem Volk und wahrt im Deutschen den Singular.
- source_word: כִּלָּיוֹן
  choice: Vernichtung
  rationale: Das Wort bezeichnet Aufzehrung oder Vernichtung. „Vernichtung“ gibt die Härte der Gerichtsaussage wieder, ohne wegen des zugleich genannten Restes ausdrücklich eine restlose Auslöschung zu behaupten.
- source_word: חָרוּץ
  choice: ist beschlossen
  rationale: Gibt den Sinn von etwas Entschiedenem oder fest Bestimmtem wieder und lässt den gerichtlichen Charakter der Aussage erkennen.
- source_word: שׁוֹטֵף
  choice: überströmt
  rationale: Bewahrt das Bild des Überflutens beziehungsweise Überströmens und verbindet es syntaktisch mit der beschlossenen Vernichtung.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der deutsche Begriff deckt sowohl den sittlich rechten als auch den Recht schaffenden Charakter des angekündigten Gerichts ab; „Recht“ bleibt als kontextuell mögliche Nuance in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung der Umkehr des Restes
  choice: „umkehren“ mit offener räumlicher und geistlicher Bedeutung
  alternative: „zurückkehren“ im vorwiegend räumlich-nationalen Sinn oder „Buße tun“ im ausdrücklich geistlichen Sinn
  rationale: שוב und das Motiv des Restes erlauben sowohl die Vorstellung einer Rückkehr als auch die einer Hinwendung zu Gott. „Umkehren“ bewahrt diese prophetische Spannung und legt die Aussage weder ausschließlich auf Buße noch auf ein bestimmtes geschichtliches Rückkehrereignis fest.
- issue: Bedeutung von צְדָקָה im Schlusssatz
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Beide Nuancen sind möglich. „Gerechtigkeit“ bewahrt die Aussage, dass auch das vernichtende Gericht moralisch recht ist; die stärker forensische Wiedergabe „Recht“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Kontrast; „umkehren“ und „Gerechtigkeit“ bewahren die inhaltliche und theologische Mehrdeutigkeit.
