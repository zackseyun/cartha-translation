source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: de
  text: Denn der Herr, Jahwe der Heerscharen, vollzieht inmitten der ganzen Erde[a] eine vollständige, fest beschlossene Vernichtung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des ganzen Landes“. Das hebräische Wort kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: Bewahrt die echte lexikalische und kontextuelle Mehrdeutigkeit von אֶרֶץ.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den argumentativen Zusammenhang.
- source_word: כָלָה וְנֶחֱרָצָה
  choice: eine beschlossene Vernichtung
  rationale: כָלָה bezeichnet hier ein vollständiges Ende im Gerichtssinn; das passive Partizip נֶחֱרָצָה kennzeichnet dieses als fest beschlossen. Die kompakte deutsche Wortgruppe gibt beide Elemente natürlich wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt sowohl den Herrschaftstitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt den traditionsreichen, würdevollen und semantisch breiten Bestandteil des göttlichen Titels.
- source_word: עֹשֶׂה
  choice: vollzieht
  rationale: Das Partizip stellt das beschlossene Gericht als gegenwärtig beziehungsweise unmittelbar wirksam dar; „vollzieht“ passt idiomatisch zu einem Beschluss und einer Vernichtung.
- source_word: בְּקֶרֶב
  choice: inmitten
  rationale: Bewahrt gegenüber einem bloßen „in“ die räumliche Bedeutung der hebräischen Wendung.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Die Wendung kann universale Reichweite bezeichnen; die ebenfalls mögliche regionale Bedeutung „das ganze Land“ wird wegen der echten lexikalischen Mehrdeutigkeit in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Fassung unterscheidet den Titel vom Eigennamen und gibt den im Konsonantentext vorhandenen Gottesnamen transparent wieder, ohne eine konfessionelle Deutung einzutragen.
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der Ausdruck lässt im Kontext sowohl eine umfassende als auch eine regional-historische Lesart zu. Der Haupttext folgt der weiteren Bedeutung, während die engere ausdrücklich in der Fußnote bewahrt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung stellt den Handelnden klar voran; „beschlossene Vernichtung“ ist knapp und natürlich, ohne die Endgültigkeit des Gerichts abzuschwächen. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
