  variant: modern standard German
source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: de
  text: Rühmt sich etwa die Axt gegenüber dem, der mit ihr hackt? Oder erhebt sich die Säge über den, der sie führt? Als würde ein Stock den schwingen, der ihn hochhebt, oder als würde ein Stab den hochheben, der kein Holz ist![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht am Ende knapp: „nicht Holz“. Die Wendung kann auch unpersönlich als „was nicht Holz ist“ verstanden werden.'
    reason: Die hebräische Schlusswendung ist elliptisch; die Fußnote bewahrt ihre Mehrdeutigkeit.
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: sich rühmen
  rationale: Der Hitpael bezeichnet Selbstruhm oder Selbstüberhebung. „Sich rühmen“ gibt die personifizierte Anmaßung der Axt in natürlichem, würdigem Deutsch wieder.
- source_word: הַגַּרְזֶן
  choice: die Axt
  rationale: Die übliche deutsche Bezeichnung für das hier gemeinte Hiebwerkzeug.
- source_word: הַחֹצֵב בּוֹ
  choice: der, der mit ihr haut
  rationale: Die Form bezeichnet den Handelnden, der die Axt als Werkzeug gebraucht; „mit ihr“ bewahrt ausdrücklich den instrumentalen Sinn von בּוֹ.
- source_word: יִתְגַּדֵּל
  choice: sich erheben
  rationale: Das Verb beschreibt hier parallele Selbstüberhebung. „Sich erheben über“ ist idiomatisch und bewahrt den Gegensatz zwischen Werkzeug und Handelndem.
- source_word: הַמַּשּׂוֹר
  choice: die Säge
  rationale: Direkte und eindeutige Entsprechung für das Werkzeug.
- source_word: מְנִיפוֹ
  choice: der, der sie schwingt
  rationale: Das Partizip bezeichnet denjenigen, der die Säge bewegt beziehungsweise führt. „Schwingen“ hält den Bezug zur Wurzel נוף und passt zugleich zur anschließenden Umkehrung der Handlung.
- source_word: כְּהָנִיף שֵׁבֶט
  choice: Als könnte ein Stock den schwingen
  rationale: 'Die schwierige elliptische Konstruktion wird als absurde Umkehrung der Handlung wiedergegeben: Nicht der Mensch bewegt das Werkzeug, sondern das Werkzeug den Menschen.'
- source_word: שֵׁבֶט
  choice: ein Stock
  rationale: „Stock“ bezeichnet hier ein handgeführtes Schlag- oder Herrschaftsgerät und bleibt von מַטֶּה, „Stab“, unterscheidbar.
- source_word: מְרִימָיו
  choice: der ihn hochhebt
  rationale: Die Form ist morphologisch plural markiert, bezeichnet im Bildzusammenhang jedoch den oder die Träger des Stocks. Der deutsche Singular folgt der durchgehend singularischen Werkzeugmetapher, ohne den Sinn zu verändern.
- source_word: כְּהָרִים מַטֶּה
  choice: oder als könnte ein Stab den hochheben
  rationale: Die Wiedergabe macht erneut die beabsichtigte Umkehrung der Handlung sichtbar und erhält die Parallelität zum vorangehenden Vergleich.
- source_word: מַטֶּה
  choice: ein Stab
  rationale: „Stab“ ist eine natürliche Entsprechung und unterscheidet diesen Ausdruck von שֵׁבֶט, das hier mit „Stock“ wiedergegeben wird.
- source_word: לֹא עֵץ
  choice: der kein Holz ist
  rationale: Die knappe hebräische Wendung bleibt in ihrer zugespitzten Form erkennbar. Das Relativpronomen macht im Deutschen den menschlichen Gegenpart zum hölzernen Werkzeug verständlich.
theological_decisions:
- issue: Deutung der elliptischen Schlusswendung לֹא עֵץ
  choice: „der kein Holz ist“ bezeichnet den menschlichen Träger im Gegensatz zum hölzernen Werkzeug.
  alternative: „was nicht Holz ist“; oder, bei anderer syntaktischer Zuordnung, „als höbe man einen Stab hoch, der nicht aus Holz ist“.
  rationale: Der Vers verspottet die Selbstüberhebung eines Werkzeugs gegenüber dem, der es gebraucht. Die gewählte Fassung erhält diese rhetorische Umkehrung, während die Fußnote die syntaktische Kürze und eine sachliche Alternative offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen und die absurde Umkehrung von Werkzeug und Handelndem bleiben deutlich. „Stock“ und „Stab“ unterscheiden die beiden nah verwandten hebräischen Begriffe; die ungewöhnliche Formulierung „den schwingen“ ist bewusst beibehalten, weil gerade die vertauschte Handlungsträgerschaft den poetischen Punkt ausmacht.
