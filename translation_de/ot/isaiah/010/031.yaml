translation_notes:
  register: Knappe, rhythmische und würdige Prosa in modernem Standarddeutsch. Die beiden Ortsnamen und die Parallelität der Reaktionen auf die Bedrohung bleiben erhalten; das Perfekt bildet die abgeschlossenen hebräischen Verbformen ab.
