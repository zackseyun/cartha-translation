  yaml_path: translation/ot/isaiah/010/031.yaml
  text: Madmenah has fled[a]; the inhabitants of Gebim have sought refuge.
translation:
  language: de
  text: Madmena ist geflohen; die Bewohner von Gebim haben sich in Sicherheit gebracht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben Schutz gesucht“ beziehungsweise „sind an einen sicheren Ort geflohen“. Das hebräische Verb ist hier schwer zu deuten und kann ein eiliges Handeln zum eigenen Schutz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  choice: ist geflohen
  rationale: Das Qal Perfekt 3. Person Singular feminin von נדד kann ein Fortziehen oder Fliehen bezeichnen. Im Zusammenhang des herannahenden Angriffs gibt „ist geflohen“ die personifizierende Aussage über den Ortsnamen natürlich wieder.
- source_word: מַדְמֵנָה
  choice: Madmena
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren Form transliteriert und nicht übersetzt.
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das substantivisch gebrauchte Partizip im Status constructus bezeichnet kollektiv die Menschen, die an dem genannten Ort wohnen.
- source_word: הַגֵּבִים
  choice: Gebim
  rationale: Der Ortsname wird transliteriert; der hebräische Artikel wird im Deutschen nicht als Bestandteil des Namens wiedergegeben.
- source_word: הֵעִיזוּ
  choice: haben sich in Sicherheit gebracht
  rationale: Die schwierige Hifil-Form bezeichnet hier im Zusammenhang militärischer Bedrohung wahrscheinlich eine eilige Bewegung zum Schutz. Die Formulierung gibt sowohl Flucht als auch Schutzsuche wieder, ohne die Wendung unnatürlich wörtlich als „Stärke zeigen“ zu übersetzen.
