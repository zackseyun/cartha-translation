base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: de
  text: 'Denn er sagt: „Durch die Kraft meiner Hand habe ich es vollbracht und durch meine Weisheit, denn ich bin verständig. Ich beseitige die Grenzen der Völker und plündere ihre Schätze[a]; wie ein Mächtiger[b] stürze ich die Bewohner[c] herab.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Vorräte“, „ihren Besitz“ oder „ihren zurückgelegten Reichtum“. Das seltene hebräische Wort meint wahrscheinlich bereitgelegte oder angesammelte Güter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Starker“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „diejenigen, die sitzen“; im Zusammenhang möglicherweise Personen in Herrschaftsstellung. Das hebräische Wort kann auch allgemein die Wohnenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: Denn er sagt
  rationale: כִּי begründet im Zusammenhang die vorausgehende Beurteilung des assyrischen Hochmuts. Das Perfekt אָמַר gibt hier die charakteristische, anschaulich vergegenwärtigte Rede des Königs wieder.
- source_word: בְּכֹחַ יָדִי
  choice: Durch die Kraft meiner Hand
  rationale: Die konkrete hebräische Verbindung von Kraft und Hand bleibt erhalten und betont die selbstherrliche Zuschreibung militärischer Macht.
- source_word: עָשִׂיתִי
  choice: habe ich es vollbracht
  rationale: Das im Deutschen ergänzte „es“ ergibt sich aus dem Zusammenhang; „vollbracht“ gibt das umfassende עשה in der prahlerischen Rede natürlich wieder.
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: und durch meine Weisheit, denn ich bin verständig
  rationale: „Weisheit“ bewahrt die Breite von חָכְמָה, während „verständig“ die von בין abgeleitete Aussage wiedergibt, ohne sie auf bloße Intelligenz zu verengen.
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: Ich beseitige die Grenzen der Völker
  rationale: Das Hifil von סור bezeichnet das Entfernen oder Beseitigen; „Völker“ entspricht עַמִּים, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: וַעֲתִידֹתֵיהֶם
  choice: ihre aufgehäuften Schätze
  rationale: Das seltene Wort bezeichnet wahrscheinlich bereitgelegte oder angesammelte Güter. Die Formulierung macht diesen Sinn im Plünderungskontext verständlich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: שׁוֹשֵׂתִי
  choice: plündere ich
  rationale: Das Verb bezeichnet das Erbeuten beziehungsweise Plündern im Krieg; das Präsens führt die vergegenwärtigte Prahlrede natürlich fort.
- source_word: כַּאַבִּיר
  choice: wie ein Mächtiger
  rationale: אַבִּיר bezeichnet einen Mächtigen oder Starken. Die substantivische Wiedergabe erhält die knappe Vergleichsform und legt sich nicht unnötig auf „Held“ oder ein starkes Tier fest.
- source_word: וְאוֹרִיד ... יוֹשְׁבִים
  choice: stürze ich die Thronenden herab
  rationale: Das Hifil von ירד bedeutet „herabbringen“. ישב kann „wohnen“ oder „sitzen“ bedeuten; angesichts des Herabstürzens und des Herrschaftskontexts gibt „die Thronenden“ wahrscheinlich die gemeinten Machthaber wieder, während die allgemeinere Möglichkeit in der Fußnote bleibt.
theological_decisions:
- issue: Wer die Prahlrede spricht
  choice: Die singularische Rede wird als Aussage des Königs von Assyrien wiedergegeben.
  alternative: Assyrien als Ganzes könnte personifiziert sprechen.
  rationale: Der unmittelbare Zusammenhang richtet sich gegen das hochmütige Herz des Königs von Assyrien, verbindet ihn aber eng mit der imperialen Macht Assyriens. Das deutsche Singularpronomen bewahrt diese Spannung, ohne den Sprecher weiter einzuengen.
- issue: Bedeutung von יוֹשְׁבִים im Herrschaftskontext
  choice: die Thronenden
  alternative: die Bewohner beziehungsweise die dort Wohnenden
  rationale: Die Aussage vom Herabstürzen legt Personen in erhöhter Machtstellung nahe. Da das Partizip jedoch auch gewöhnlich „Bewohner“ bedeuten kann, wird diese echte Mehrdeutigkeit ausdrücklich vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Prahlrede bleibt kraftvoll und knapp; das Präsens vergegenwärtigt die charakteristische Selbstüberhebung. Seltene oder kontextuell mehrdeutige Wörter werden im Haupttext verständlich wiedergegeben und in den Fußnoten offengehalten.
