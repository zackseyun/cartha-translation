  text: כַּ/אֲשֶׁר֙ מָצְאָ֣ה יָדִ֔/י לְ/מַמְלְכֹ֖ת הָ/אֱלִ֑יל וּ/פְסִ֣ילֵי/הֶ֔ם מִ/ירֽוּשָׁלִַ֖ם וּ/מִ/שֹּׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: de
  text: Wie meine Hand die Königreiche der Götzen erreicht hat, deren geschnitzte Bilder größer waren als die von Jerusalem und Samaria,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische formuliert die Vergleichsaussage elliptisch: Wörtlich steht etwa: „und ihre geschnitzten Bilder als/vor Jerusalem und Samaria“. Aus dem Zusammenhang, besonders V. 11, ergibt sich: größer als die Bilder von Jerusalem und Samaria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: So wie
  rationale: Leitet den Vergleich ein, der in Vers 11 fortgeführt wird, und klingt im Deutschen natürlich.
- source_word: מָצְאָה יָדִי
  choice: meine Hand … erreicht hat
  rationale: Bewahrt das Bild der Hand und gibt im Zusammenhang des assyrischen Eroberungszugs idiomatisch das Gelangen zu beziehungsweise die Machtausübung über diese Reiche wieder.
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: die Königreiche der Götzen
  rationale: Die Präposition wird vom Verb bestimmt; אֱלִיל bezeichnet abwertend Götzen beziehungsweise nichtige Gottheiten.
- source_word: וּפְסִילֵיהֶם
  choice: deren geschnitzte Bilder
  rationale: Gibt das Besitzverhältnis klar wieder und übersetzt פְסִילִים mit einem verständlichen modernen Ausdruck.
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: als die von Jerusalem und Samaria
  rationale: Versteht מִן vergleichend und ergänzt lediglich das im Hebräischen elliptisch vorausgesetzte Bezugswort „Bilder“.
theological_decisions:
- issue: Ob der im Schlusssatz nur angedeutete Vergleich ausdrücklich gemacht werden soll
  choice: „deren geschnitzte Bilder größer waren als die von Jerusalem und Samaria“
  alternative: 'Wörtlicher: „und ihre geschnitzten Bilder aus Jerusalem und aus Samaria“'
  rationale: Der Zusammenhang mit Vers 11 zeigt, dass der assyrische König die von ihm besiegten Götzenreiche und ihre Bilder mit Jerusalem und Samaria vergleicht. Die explizite Wiedergabe vermittelt den wahrscheinlichen Sinn, während die Fußnote die syntaktische Ellipse offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Teil des in Vers 11 fortgesetzten Satzes offen; das Komma am Ende signalisiert diesen Zusammenhang.
