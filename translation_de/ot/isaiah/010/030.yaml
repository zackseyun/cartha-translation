  text: צַהֲלִ֥י קוֹלֵ֖/ךְ בַּת גַּלִּ֑ים הַקְשִׁ֥יבִי לַ֖יְשָׁה עֲנִיָּ֥ה עֲנָתֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
translation:
  language: de
  text: Lass deine Stimme gellend erschallen[a], Tochter Gallims[b]! Horch auf, Laischa! Du bedrängtes Anatot[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass deine Stimme schrill erschallen.“ Das hebräische Verb kann einen durchdringenden oder hell schallenden Ruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Tochter Gallims“; die Stadt oder ihre Bewohnerschaft wird dabei als Frau personifiziert.
    reason: cultural_note
  - marker: c
    text: 'Oder: „du armes Anatot“ beziehungsweise „du elendes Anatot“. Das hebräische Adjektiv kann Armut, Elend oder Bedrängnis ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַהֲלִי קוֹלֵךְ
  choice: Lass deine Stimme gellend hören
  rationale: Das feminine Imperativverb צהל bezeichnet einen lauten, durchdringenden oder hell schallenden Ruf; zusammen mit „deine Stimme“ gibt die Wendung den ausdrücklichen hebräischen Wortlaut und den alarmierenden Klang im Zusammenhang des feindlichen Vormarschs wieder.
- source_word: בַּת גַּלִּים
  choice: Tochter Gallims
  rationale: Die prophetische Personifikation der Stadt beziehungsweise ihrer Bewohnerschaft als Tochter bleibt erhalten; der deutsche Genitiv ist natürlich und bewahrt den Ortsnamen.
- source_word: הַקְשִׁיבִי
  choice: Horch auf
  rationale: Der feminine Imperativ fordert zu aufmerksamem Hören auf. „Horch auf“ ist eindringlicher als bloßes „Hör zu“ und passt zum Warnruf.
- source_word: לַיְשָׁה
  choice: Laischa
  rationale: Der Ortsname wird nach der vorliegenden hebräischen Form transliteriert und nicht mit dem bekannteren Lais gleichgesetzt.
- source_word: עֲנִיָּה
  choice: bedrängtes
  rationale: Das feminine Adjektiv kann Armut, Elend, Bedrängnis oder Unterdrückung ausdrücken. Im Zusammenhang des militärischen Vormarschs trifft „bedrängt“ die Notlage, ohne sie auf wirtschaftliche Armut zu verengen.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Der Ortsname wird in geläufiger deutscher Transliteration wiedergegeben und als personifizierte Ortschaft direkt angeredet.
