base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: de
  text: Siehe, der Herr, Jahwe der Heerscharen, schlägt mit furchterregender Gewalt[a] das Astwerk ab. Die Hochgewachsenen werden gefällt[b], und die Hochragenden werden erniedrigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit gewaltigem Krachen“, „mit Gewalt“ oder „unter Schrecken“; der seltene hebräische Ausdruck bezeichnet furchterregende, zerstörerische Wucht.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild zeigt das Abhauen von Ästen und das Fällen hoher Bäume; zugleich kann es für den Sturz der Erhöhten stehen.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die deiktische Partikel lenkt mit prophetischer Eindringlichkeit die Aufmerksamkeit auf das unmittelbar bevorstehende Geschehen; „Siehe“ bewahrt den gehobenen Ton.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  rationale: Der bestimmte Titel הָאָדוֹן wird als „der Herr“ wiedergegeben, der Gottesname יְהוָה als „Jahwe“. „Der Heerscharen“ ist im Deutschen verständlich und lässt den umfassenden Sinn himmlischer und irdischer Heere offen.
- source_word: מְסָעֵף
  choice: schlägt … ab
  rationale: Das Partizip zeichnet die Handlung lebhaft als gegenwärtig beziehungsweise unmittelbar bevorstehend. „Abschlagen“ hält das Bild vom Entfernen kräftiger Äste fest.
- source_word: פֻּארָה
  choice: das Astwerk
  rationale: Das Wort bezeichnet üppiges Geäst beziehungsweise Zweigwerk. Der Kollektivbegriff „Astwerk“ bewahrt das Baumbild natürlich.
- source_word: בְמַעֲרָצָה
  choice: mit furchterregender Gewalt
  rationale: Der seltene Ausdruck verbindet gewaltsame Wucht mit Schrecken; die Wiedergabe erhält beide Bedeutungsanteile, ohne sich allein auf Lärm oder Angst festzulegen.
- source_word: רָמֵי הַקּוֹמָה
  choice: die hoch Gewachsenen
  rationale: Wörtlich sind es die an Wuchs beziehungsweise Gestalt Hohen. Die Formulierung wahrt sowohl das Bild hoher Bäume als auch die mögliche Anspielung auf hochgestellte Menschen.
- source_word: גְּדוּעִים
  choice: werden gefällt
  rationale: Das passive Ergebnis des Abhauens wird im Zusammenhang mit hohen Bäumen idiomatisch durch „gefällt“ ausgedrückt.
- source_word: הַגְּבֹהִים יִשְׁפָּלוּ
  choice: die Hochragenden werden erniedrigt
  rationale: „Hochragend“ hält die Schwebe zwischen räumlicher Höhe und gesellschaftlicher oder hochmütiger Erhebung; „erniedrigt“ gibt das Niedrigwerden wieder, ohne die moralische Deutung ausdrücklich festzuschreiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Gottesname steht ausdrücklich neben dem Titel „der Herr“. „Jahwe“ macht diese Unterscheidung transparent und gibt den Eigennamen wieder.
- issue: Baumbild und Gericht über die Erhöhten
  choice: Das Bild des Abhauens und Erniedrigens bleibt im Haupttext erhalten
  alternative: Die Aussage ausdrücklich als Gericht über Stolze oder Machthaber paraphrasieren
  rationale: Der hebräische Text verbindet Baumfällung mit Begriffen für Höhe und Erniedrigung. Die Übersetzung bewahrt diese gewollte Spannung, statt die möglichen menschlichen und politischen Bezüge im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Bildkraft. „Siehe“ und „Heerscharen“ tragen den gehobenen biblischen Ton; Satzbau und Verben bleiben zugleich für heutige Leser verständlich. Die Wiederholung der Höhenbegriffe wird variiert, ohne die Mehrdeutigkeit zwischen hohen Bäumen und erhöhten Menschen aufzulösen.
