  text: בָּ֥א עַל עַיַּ֖ת עָבַ֣ר בְּ/מִגְר֑וֹן לְ/מִכְמָ֖שׂ יַפְקִ֥יד כֵּלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/028.yaml
  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: de
  text: Er ist gegen Ajat herangerückt, ist durch Migron gezogen. In Michmas deponiert er seine Ausrüstung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל
  choice: ist gegen … herangerückt
  rationale: Die Verbindung bezeichnet hier im militärischen Marschzusammenhang eine Bewegung gegen einen Ort; „herangerückt“ gibt sowohl das Kommen als auch die Bedrohung natürlich wieder.
- source_word: עָבַר בְּמִגְרוֹן
  choice: durch Migron gezogen
  rationale: עָבַר mit ב kann das Durchqueren eines Ortes ausdrücken; die knappe deutsche Form bewahrt die dynamische Abfolge der Marschroute.
- source_word: יַפְקִיד כֵּלָיו
  choice: lagert er sein Gepäck
  rationale: יַפְקִיד bedeutet hier, die Ausrüstung beziehungsweise das Gepäck an einem Ort zu deponieren oder zurückzulassen; „lagert“ ist im militärischen Kontext verständlich und wahrt das durative Präsens der lebhaften Schilderung.
theological_decisions: []
translation_notes:
  register: Knappe, rhythmische Marschschilderung in gehobenem, aber gegenwärtigem Standarddeutsch. Die Ortsnamen folgen geläufigen deutschen Bibelformen; der Tempuswechsel vom Perfekt zum Präsens bildet das anschauliche Fortschreiten des hebräischen Textes ab.
