    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Interjektion kündigt Gericht an; „Wehe“ ist im Deutschen kraftvoll, verständlich und dem Kontext angemessen.
- source_word: הַחֹקְקִים חִקְקֵי
  choice: die … Erlasse erlassen
  rationale: Das Verb und das verwandte Substantiv bezeichnen hier das verbindliche Festsetzen rechtlicher Bestimmungen. Die idiomatische deutsche Verbindung bewahrt zugleich die auffällige Wiederholung des Hebräischen.
- source_word: אָוֶן
  choice: unheilvolle
  rationale: Das Wort kann moralische Verkehrtheit, Unheil oder schädliches Unrecht bezeichnen. „Unheilvoll“ hält die ethische Verurteilung und die verderblichen Folgen der Erlasse zusammen, ohne die Bedeutung unnötig einzuengen.
- source_word: וּמְכַתְּבִים … כִּתֵּבוּ
  choice: und denen, die … niederschreiben
  rationale: Die Formulierung bezeichnet Personen, die solche Festsetzungen schriftlich abfassen. „Niederschreiben“ gibt den schriftlichen und amtlichen Charakter wieder, ohne ein bestimmtes modernes Amt vorauszusetzen.
- source_word: עָמָל
  choice: Bedrückung
  rationale: Im anschließenden sozialrechtlichen Kontext geht es um belastendes Unrecht gegen Schwache. „Bedrückung“ bringt diese Wirkung gut zum Ausdruck, während die Fußnote den weiteren Bedeutungsraum offenhält.
