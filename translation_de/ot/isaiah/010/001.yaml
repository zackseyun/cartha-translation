  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit einem hebräischen Wortspiel: „die Erlasse des Unrechts festsetzen“; das Verb und das Wort für „Erlasse“ sind im Hebräischen verwandt. Das Wort für „Unrecht“ kann auch Unheil oder Verderben bezeichnen.'
