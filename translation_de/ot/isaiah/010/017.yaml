  text: וְ/הָיָ֤ה אֽוֹר יִשְׂרָאֵל֙ לְ/אֵ֔שׁ וּ/קְדוֹשׁ֖/וֹ לְ/לֶהָבָ֑ה וּ/בָעֲרָ֗ה וְ/אָֽכְלָ֛ה שִׁית֥/וֹ וּ/שְׁמִיר֖/וֹ בְּ/י֥וֹם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: de
  text: Und das Licht Israels wird zum Feuer[a] und sein Heiliger zur Flamme[b]. Sie wird brennen und seine Dornen und sein Dornengestrüpp an einem einzigen Tag verzehren.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird ein Feuer sein“; die hebräische Konstruktion kann formaler so wiedergegeben werden, bezeichnet hier aber wahrscheinlich ein Werden.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Heiliger“ ist wahrscheinlich eine Gottesbezeichnung und bezieht sich auf den HERRN; solche Bezeichnungen sind für Jesaja charakteristisch.
    reason: cross_reference
  - marker: c
    text: Die beiden hebräischen Wörter bezeichnen dornigen Bewuchs. Das erste ist in dieser Bedeutung selten und kann auch allgemeiner als „Gestrüpp“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... לְאֵשׁ
  choice: wird zum Feuer
  rationale: היה mit לְ bezeichnet hier natürlich das Eintreten in einen Zustand. „Wird zum Feuer“ bewahrt das Bild und gibt die resultative Bedeutung idiomatisch wieder.
- source_word: אוֹר יִשְׂרָאֵל
  choice: das Licht Israels
  rationale: Die Genitivfügung gibt den hebräischen Status constructus eng und natürlich wieder, ohne die Metapher aufzulösen.
- source_word: וּקְדוֹשׁוֹ
  choice: sein Heiliger
  rationale: Die substantivische Wiedergabe wahrt die wahrscheinlich auf Gott bezogene, für Jesaja charakteristische Bezeichnung, ohne den Bezug im Haupttext ausdrücklich festzulegen.
- source_word: לְלֶהָבָה
  choice: zur Flamme
  rationale: Die Wiedergabe erhält den poetischen Parallelismus zu „Feuer“ und folgt derselben resultativen Konstruktion.
- source_word: וּבָעֲרָה וְאָכְלָה
  choice: Sie wird brennen und ... verzehren
  rationale: Die feminine Singularform greift am nächsten und bildlich „Flamme“ auf. Das prophetische Perfekt wird futurisch wiedergegeben; „verzehren“ ist für die Wirkung von Feuer idiomatisch.
- source_word: שִׁיתוֹ וּשְׁמִירוֹ
  choice: seine Dornen und sein Dornengestrüpp
  rationale: Beide Wörter bezeichnen dornigen Bewuchs. Die differenzierte Wiedergabe bewahrt den Parallelismus, während „Dornengestrüpp“ die mögliche breitere Bedeutung des seltenen ersten beziehungsweise im Wortpaar schwer abzugrenzenden Bewuchses verständlich abbildet.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Diese natürliche deutsche Formulierung erhält die Betonung der Plötzlichkeit und Vollständigkeit.
theological_decisions:
- issue: Bezug von „Licht Israels“ und „sein Heiliger“
  choice: Die metaphorische und titelartige Sprache bleibt im Haupttext unaufgelöst.
  alternative: Beide Ausdrücke ausdrücklich mit dem HERRN identifizieren.
  rationale: Der Kontext und der Sprachgebrauch Jesajas sprechen stark für einen Gottesbezug, doch der Vers selbst formuliert poetisch. Die Übersetzung wahrt diese theologische Spannung.
- issue: Bezugswort des femininen Verbs וּבָעֲרָה
  choice: „Sie“ wird auf die unmittelbar vorausgehende „Flamme“ bezogen.
  alternative: Unpersönlich „Es wird brennen“ oder Wiederaufnahme mit „das Feuer“.
  rationale: Das feminine Verb stimmt formal mit לֶהָבָה „Flamme“ überein. Die feminine Rückverweisung ist im Deutschen verständlich und bewahrt die grammatische Struktur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. „Dornengestrüpp“ ist allgemein verständlich und vermeidet das heute weniger geläufige „Disteln“ oder „Dornenhecken“, ohne die beiden hebräischen Begriffe zusammenfallen zu lassen.
