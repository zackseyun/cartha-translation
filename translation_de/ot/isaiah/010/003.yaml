source:
  edition: WLC
  text: וּ/מַֽה תַּעֲשׂוּ֙ לְ/י֣וֹם פְּקֻדָּ֔ה וּ/לְ/שׁוֹאָ֖ה מִ/מֶּרְחָ֣ק תָּב֑וֹא עַל מִי֙ תָּנ֣וּסוּ לְ/עֶזְרָ֔ה וְ/אָ֥נָה תַעַזְב֖וּ כְּבוֹדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: de
  text: Was werdet ihr am Tag der Strafe und bei der Verwüstung tun, die aus der Ferne kommt? Zu wem werdet ihr um Hilfe fliehen, und wo werdet ihr euren Reichtum[a] lassen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Herrlichkeit« oder »eure Ehre«. Das hebräische Wort kann Ehre beziehungsweise Herrlichkeit bezeichnen, hier aber auch konkret wertvollen Besitz oder Reichtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: Strafe
  rationale: Im Zusammenhang der prophetischen Gerichtsankündigung bezeichnet das Wort eine strafende Heimsuchung beziehungsweise Abrechnung. „Strafe“ gibt diesen Sinn in heutigem Deutsch klar wieder.
- source_word: שׁוֹאָה
  choice: Verwüstung
  rationale: Das Substantiv bezeichnet verheerende Zerstörung oder Unheil. „Verwüstung“ bewahrt die konkrete Wucht des Ausdrucks.
- source_word: מִמֶּרְחָק
  choice: aus der Ferne
  rationale: Die Wendung bezeichnet die entfernte Herkunft des angekündigten Unheils und bleibt damit räumlich offen.
- source_word: תָּבֹוא
  choice: kommt
  rationale: Das hebräische Imperfekt hat hier Zukunftsbezug; im deutschen Relativsatz drückt das Präsens „kommt“ das bevorstehende Geschehen natürlich aus.
- source_word: תָּנוּסוּ
  choice: werdet ihr fliehen
  rationale: Das Verb bezeichnet die Flucht vor Gefahr. Die Zukunftsform passt zu den rhetorischen Fragen über den kommenden Gerichtstag.
- source_word: לְעֶזְרָה
  choice: um Hilfe
  rationale: In Verbindung mit „fliehen“ gibt „um Hilfe“ den Zweck idiomatisch und präzise wieder.
- source_word: אָנָה
  choice: wo
  rationale: Das Ortsfragewort wird in modernem Deutsch natürlich mit „wo“ wiedergegeben.
- source_word: תַעַזְבוּ
  choice: werdet ihr … lassen
  rationale: Das Verb kann „lassen“ oder „zurücklassen“ bedeuten. „Lassen“ bewahrt die Offenheit der Frage, was mit dem Wertvollen geschehen soll.
- source_word: כְּבוֹדְכֶם
  choice: euren Reichtum
  rationale: כבוד bedeutet häufig „Herrlichkeit“ oder „Ehre“, kann hier im Gerichtskontext jedoch konkret das wertvolle Vermögen der Angesprochenen bezeichnen. „Reichtum“ passt zur Frage, wo es in der Katastrophe bleiben soll; die wörtlicheren Möglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Konkreter oder abstrakter Sinn von כְּבוֹדְכֶם in der Gerichtsankündigung
  choice: euren Reichtum
  alternative: eure Herrlichkeit oder eure Ehre
  rationale: Der Zusammenhang fragt, wohin die Angesprochenen fliehen und wo sie das von ihnen Geschätzte lassen werden. Der konkrete Sinn „Reichtum“ ist daher wahrscheinlich, doch die lexikalisch möglichen abstrakten Bedeutungen bleiben in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen und der drohende Ton des hebräischen Textes bleiben erhalten. „Angesichts“ macht die Beziehung zwischen dem angekündigten Tag und der Verwüstung im Deutschen natürlich verständlich, ohne die Ursache des Unheils näher festzulegen.
