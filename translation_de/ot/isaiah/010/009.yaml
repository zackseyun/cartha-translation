  text: הֲ/לֹ֥א כְּ/כַרְכְּמִ֖ישׁ כַּלְנ֑וֹ אִם לֹ֤א כְ/אַרְפַּד֙ חֲמָ֔ת אִם לֹ֥א כְ/דַמֶּ֖שֶׂק שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/009.yaml
  text: Is not Calno like Carchemish? Is not Hamath like Arpad? Is not Samaria like Damascus?[a]
translation:
  language: de
  text: Ist Kalno nicht wie Karkemisch? Ist Hamat nicht wie Arpad? Ist Samaria nicht wie Damaskus?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא / אִם לֹא
  choice: Ist … nicht
  rationale: Die verneinten Frageformen leiten rhetorische Fragen ein, die Zustimmung erwarten. Die einheitliche Wiedergabe bewahrt die knappe Parallelstruktur.
- source_word: כְּ/כַרְכְּמִישׁ כַּלְנוֹ
  choice: Kalno … wie Karkemisch
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. Im natürlichen Deutschen steht das verglichene Kalno vor dem Vergleichspunkt Karkemisch.
- source_word: כַּלְנוֹ
  choice: Kalno
  rationale: Die Umschrift folgt der hier vorliegenden hebräischen Namensform direkt.
- source_word: כַּרְכְּמִישׁ
  choice: Karkemisch
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: כְ/אַרְפַּד חֲמָת
  choice: Hamat … wie Arpad
  rationale: Die deutsche Wortfolge verdeutlicht den Vergleich, ohne die Aussage auszudeuten.
- source_word: חֲמָת
  choice: Hamat
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: אַרְפַּד
  choice: Arpad
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: כְ/דַמֶּשֶׂק שֹׁמְרוֹן
  choice: Samaria … wie Damaskus
  rationale: Die natürliche deutsche Wortfolge stellt Samaria als verglichene Stadt und Damaskus als Vergleichspunkt dar.
- source_word: דַּמֶּשֶׂק
  choice: Damaskus
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Eingebürgerte deutsche Form des Ortsnamens; im Zusammenhang ist zunächst die Hauptstadt gemeint.
