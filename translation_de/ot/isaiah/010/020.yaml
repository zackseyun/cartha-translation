revisions:
- from: An jenem Tag wird der Rest Israels, werden die Entkommenen des Hauses Jakob sich nicht länger auf den stützen, der sie schlägt, sondern sich in Treue auf den HERRN stützen, den Heiligen Israels.
  to: An jenem Tag werden der Rest Israels und die Entkommenen des Hauses Jakob sich nicht länger auf den stützen, der sie schlägt, sondern sich in Wahrheit auf den HERRN, den Heiligen Israels.
  rationale: Die Revision glättet die deutsche Satzführung und ersetzt die semantisch verengende Deutung „in Treue“ durch „in Wahrheit“. Die bewusst offene Bezeichnung dessen, der Israel schlägt, sowie die Wiederholung von „sich auf … stützen“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:12:48Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Gegensatz von falschem bzw. erzwungenem Anlehnen und dem Anlehnen an JHWH sind zutreffend wiedergegeben. בֶּאֱמֶת bedeutet jedoch primär „in Wahrheit/wahrhaftig“; „in Treue“ ist als kontextuelle Deutung möglich, verengt den Ausdruck aber unnötig. Die personale Pluralisierung bei „der sie schlägt“ ist im Deutschen angesichts der zwei pluralisch gefassten Subjekte verständlich, obwohl das hebräische Suffix formal Singular ist.
  naturalness: Die Fassung ist verständlich und würdig, doch die doppelte finite Verbsetzung „wird …, werden …“ wirkt etwas schwerfällig. Eine gemeinsame Plural-Kongruenz mit den koordinierten Subjekten ist im modernen Standarddeutsch klarer.
  terminology: „Rest Israels“, „Entkommene des Hauses Jakob“, „HERR“ und „der Heilige Israels“ sind angemessen. „In Wahrheit“ wahrt die lexikalische Offenheit von אֱמֶת besser als „in Treue“.
  issues:
  - severity: medium
    issue: „in Treue“ für בֶּאֱמֶת
    rationale: Die Wiedergabe ist interpretierend und kann speziell Gottes Treue oder die Loyalität der Übrigen nahelegen. „In Wahrheit“ gibt den hebräischen Ausdruck unmittelbarer wieder und erhält seine Bedeutungsspanne im Kontext.
  - severity: low
    issue: Getrennte Verbkongruenz bei koordinierten Subjekten
    rationale: „wird der Rest …, werden die Entkommenen …“ ist möglich, aber stilistisch weniger flüssig. Das gemeinsame Prädikat im Plural ist natürlicher.
  revised_text: An jenem Tag werden der Rest Israels und die Entkommenen des Hauses Jakob sich nicht länger auf den stützen, der sie schlägt, sondern sich in Wahrheit auf den HERRN, den Heiligen Israels.
