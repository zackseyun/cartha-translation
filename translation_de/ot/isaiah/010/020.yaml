  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: de
  text: An jenem Tag werden der Rest Israels und die Entkommenen des Hauses Jakob sich nicht länger auf den stützen, der sie schlägt, sondern sich in Wahrheit auf den HERRN, den Heiligen Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche, zugleich traditionsnahe Wiedergabe der prophetischen Zeitformel.
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: der Rest Israels
  rationale: Bewahrt den in Jesaja wichtigen Begriff des übrig gebliebenen Teils des Volkes.
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: die Entkommenen des Hauses Jakob
  rationale: פְלֵיטָה bezeichnet hier die der Katastrophe Entkommenen bzw. Überlebenden; die personale Wiedergabe passt zum parallelen Subjekt.
- source_word: לֹא יוֹסִיף עוֹד ... לְהִשָּׁעֵן
  choice: sich nicht länger ... stützen
  rationale: Die Verbindung יוֹסִיף עוֹד mit dem Infinitiv bedeutet, dass die Handlung nicht weiter beziehungsweise nicht wieder fortgesetzt wird; im Deutschen genügt idiomatisch „nicht länger“.
- source_word: מַכֵּהוּ
  choice: der sie schlägt
  rationale: Das hebräische Partizip beschreibt den Schläger bzw. Bedränger; das Präsens erhält seinen charakterisierenden, fortdauernden Sinn.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die übliche deutsche Bibelkonvention gibt den Gottesnamen erkennbar durch Kapitälchen wieder.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen; im Kontext des vertrauensvollen Sichstützens ist „in Treue“ natürlich und semantisch passend.
theological_decisions:
- issue: Bezug von בֶּאֱמֶת
  choice: „in Treue“ wird adverbial auf das Sichstützen bezogen
  alternative: „auf den HERRN, der wahrhaftig ist“ oder „wahrhaftig auf den HERRN“
  rationale: Die hebräische Stellung lässt eine adverbiale Beziehung zum Vertrauen naheliegen, ohne אֱמֶת ausdrücklich als Eigenschaft Gottes umzuformen.
- issue: Identität dessen, der Israel schlägt
  choice: im Vers nicht ausdrücklich identifiziert
  alternative: Assyrien oder ein bestimmter Herrscher ausdrücklich benennen
  rationale: Der Kontext legt Assyrien nahe, doch der hebräische Text verwendet nur das Partizip mit Pronomen; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „sich auf ... stützen“ bildet den bewussten Gegensatz des hebräischen Textes ab. Die Verbfolge „wird der Rest ..., werden die Entkommenen ...“ macht die zwei koordinierten Subjekte im Deutschen klar und vermeidet eine schwerfällige Singular-Kongruenz.
