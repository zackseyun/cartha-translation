source:
  edition: WLC
  text: וַ/תִּמְצָ֨א כַ/קֵּ֤ן יָדִ/י֙ לְ/חֵ֣יל הָֽ/עַמִּ֔ים וְ/כֶ/אֱסֹף֙ בֵּיצִ֣ים עֲזֻב֔וֹת כָּל הָ/אָ֖רֶץ אֲנִ֣י אָסָ֑פְתִּי וְ/לֹ֤א הָיָה֙ נֹדֵ֣ד כָּנָ֔ף וּ/פֹצֶ֥ה פֶ֖ה וּ/מְצַפְצֵֽף׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: de
  text: Meine Hand fand den Reichtum[a] der Völker wie ein Nest; und wie man verlassene Eier einsammelt, sammelte ich die ganze Erde ein.[b] Keiner regte einen Flügel, öffnete den Mund oder zwitscherte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Mittel« beziehungsweise »die Stärke der Völker«. Das hebräische Wort חַיִל kann Reichtum, Besitz, Mittel, Stärke oder Heeresmacht bezeichnen; hier legt der Zusammenhang erbeuteten Reichtum nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das ganze Land«. Das hebräische Wort אֶרֶץ kann »Erde« oder »Land« bedeuten; »Erde« gibt hier den bewusst umfassenden Anspruch der Prahlrede wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא
  choice: fand
  rationale: Die Grundbedeutung von מצא bleibt erhalten. Im Zusammenhang unterstreicht »fand« die prahlerisch dargestellte Leichtigkeit der Eroberung, ohne deutender »ergriff« oder »raubte« zu übersetzen.
- source_word: כַקֵּן
  choice: wie ein Nest
  rationale: Die knappe Vergleichsform des Hebräischen und das durchgehende Vogelbild bleiben erhalten.
- source_word: יָדִי
  choice: meine Hand
  rationale: Die wörtliche Wiedergabe bewahrt das Bild persönlicher Macht und Handlungsvollmacht des Sprechers.
- source_word: לְחֵיל הָעַמִּים
  choice: den Reichtum der Völker
  rationale: חַיִל kann Reichtum, Mittel, Stärke oder Heeresmacht bezeichnen. Das Bild vom Ausnehmen eines ungeschützten Nestes und das anschließende Einsammeln sprechen hier besonders für erbeuteten Besitz.
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: und wie man verlassene Eier einsammelt
  rationale: Die unpersönliche deutsche Form gibt den infinitivischen Vergleich natürlich wieder; »verlassen« bewahrt das Bild schutzlos zurückgelassener Eier.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. »Die ganze Erde« wahrt den bewusst universalen, übersteigerten Anspruch der imperialen Prahlrede.
- source_word: אָסַפְתִּי
  choice: sammelte ich … ein
  rationale: »Einsammeln« greift das unmittelbar vorausgehende Bild vom Sammeln der Eier auf und klingt im modernen Deutsch natürlich.
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: Niemand flatterte mit dem Flügel
  rationale: Die Formulierung bewahrt das Vogelbild und gibt die Bewegung von נֹדֵד anschaulich wieder.
- source_word: וּפֹצֶה פֶה
  choice: öffnete den Mund
  rationale: Die wörtliche Wendung bewahrt die Mehrdeutigkeit zwischen dem Öffnen eines Vogelschnabels und menschlichem Widerspruch; »Schnabel« wäre enger als der hebräische Ausdruck.
- source_word: וּמְצַפְצֵף
  choice: oder zwitscherte
  rationale: Das Verb bezeichnet einen hellen Vogelruf. »Zwitschern« ist verständlich und führt das Nest-, Eier- und Flügelbild fort.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, bildhafte Prahlrede bleibt erhalten; die Reihe Nest, Eier, Flügel, Mund und Zwitschern wird nicht durch erklärende Zusätze aufgelöst.
