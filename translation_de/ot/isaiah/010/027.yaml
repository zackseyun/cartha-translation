id: ISA.10.27
reference: Isaiah 10:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: de
  text: An jenem Tag wird seine Last von deiner Schulter weichen und sein Joch von deinem Nacken; das Joch wird wegen der Fettigkeit[a] zerbrochen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen des Öls«; traditionell auch wiedergegeben: »wegen der Salbung«.'
    reason: Alternative Wiedergaben der mehrdeutigen und schwierigen hebräischen Wendung מִפְּנֵי שָׁמֶן.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: An jenem Tag wird
  rationale: Gibt die prophetische Zeitformel natürlich und würdig wieder; die Zukunftsbedeutung ergibt sich aus den folgenden Verbformen.
- source_word: יָסוּר סֻבֳּלוֹ מֵעַל שִׁכְמֶךָ
  choice: wird seine Last von deiner Schulter weichen
  rationale: „Weichen“ wahrt die intransitive Konstruktion mit der Last als Subjekt; „von deiner Schulter“ gibt מֵעַל im Deutschen idiomatisch wieder.
- source_word: וְעֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: und sein Joch von deinem Nacken
  rationale: Die Ellipse des Verbs wird wie im Hebräischen bewahrt; „Joch“ erhält das Bild der Unterdrückung.
- source_word: וְחֻבַּל עֹל
  choice: das Joch wird … zerbrochen werden
  rationale: Die passive Form und der Rückbezug auf das zuvor genannte Joch werden ausdrücklich wiedergegeben.
- source_word: מִפְּנֵי שָׁמֶן
  choice: wegen der Fettigkeit
  rationale: Die schwierige Wendung wird möglichst quellennah wiedergegeben, ohne die mögliche Bedeutung „Öl“ oder die traditionelle Deutung „Salbung“ stillschweigend festzulegen.
theological_decisions:
- issue: Deutung von מִפְּנֵי שָׁמֶן
  choice: wegen der Fettigkeit
  alternative: 'wegen des Öls; traditionell auch: wegen der Salbung'
  rationale: שָׁמֶן kann Fettigkeit beziehungsweise Öl bezeichnen. Da der unmittelbare Zusammenhang keine Salbung ausdrücklich nennt, bleibt im Haupttext das konkrete, aber rätselhafte Bild stehen; die anderen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Körper- und Jochbilder bleiben erhalten. Der schwierige Schluss wird nicht konfessionell oder messianisch vereindeutigt.
