  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und die zentralen Bilder zuverlässig wieder: Die Last weicht von der Schulter, das Joch vom Nacken, und das Joch wird zerbrochen. Die possessiven Bezüge („seine Last“, „sein Joch“) bleiben erhalten. „Wegen der Fettigkeit“ bewahrt die auffällig schwierige und nicht abschließend deutbare Wendung מִפְּנֵי שָׁמֶן, ohne eine Salbungsdeutung in den Haupttext einzutragen.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Die Verbellipse im zweiten Glied („und sein Joch von deinem Nacken“) ist klar verständlich und bewahrt die knappe Parallelität des Hebräischen. „Fettigkeit“ ist bewusst ungewöhnlich, aber angesichts der bildhaften und problematischen hebräischen Wendung vertretbar; die Fußnote unterstützt das Verständnis.
  terminology: „Last“, „Joch“, „Schulter“ und „Nacken“ sind sachgerecht und bilden die Metaphorik der Quelle präzise ab. Die Fußnote nennt „Öl“ als lexikalische Alternative und kennzeichnet „Salbung“ ausdrücklich als traditionelle Wiedergabe, ohne diese theologisch bevorzugt darzustellen.
