  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: de
  text: Und die übrigen Bäume seines Waldes werden so wenige sein,[a] dass ein Junge[b] sie aufschreiben kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werden Zahl sein“. „Zahl“ ist hier idiomatisch gebraucht und bedeutet: so wenige, dass man sie zählen kann.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Jugendlicher“ oder „junger Mann“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר עֵץ יַעְרוֹ
  choice: Und die Bäume, die von seinem Wald übrig bleiben
  rationale: שְׁאָר bezeichnet das Verbliebene; עֵץ steht hier kollektiv für die Bäume des Waldes. Die Umschreibung ist im Deutschen natürlich und vermeidet beim sachlichen Bild der Bäume unnötige theologische Nebenbedeutungen von „Rest“.
- source_word: מִסְפָּר יִהְיוּ
  choice: werden an Zahl gering sein
  rationale: Wörtlich steht „werden Zahl sein“. Die Formulierung ist idiomatisch im Sinn einer kleinen, leicht zählbaren Anzahl gebraucht; „an Zahl gering“ hält sowohl die Zahlenvorstellung als auch den Sinn der geringen Menge fest.
- source_word: וְנַעַר
  choice: und ein Junge
  rationale: נַעַר kann je nach Kontext „Junge“, „Jugendlicher“ oder „junger Mann“ bedeuten. „Junge“ trägt hier das Bild, dass selbst ein junger Schreiber die wenigen verbliebenen Bäume erfassen kann.
- source_word: יִכְתְּבֵם
  choice: kann sie aufschreiben
  rationale: Die Verbform bedeutet formal „wird sie schreiben“. Im Zusammenhang drückt das Bild aus, dass die Bäume so wenige sind, dass man sie ohne Mühe schriftlich erfassen kann; das deutsche Modalverb macht diesen impliziten Sinn verständlich.
