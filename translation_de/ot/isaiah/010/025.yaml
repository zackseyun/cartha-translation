  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: de
  text: Denn nur noch eine ganz kurze Zeit, dann ist der Grimm zu Ende, und mein Zorn gilt ihrer Vernichtung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Auslöschung“, „ihr Verzehrtwerden“ oder „ihr Ende“. Das hebräische Substantiv ist selten, und seine genaue Bedeutung ist umstritten; der Zusammenhang weist jedoch auf den Untergang der Bedränger hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Bekräftigung der vorangehenden Zusage ein und stellt den natürlichen Zusammenhang zum Kontext her.
- source_word: עוֹד מְעַט מִזְעָר
  choice: nur noch eine ganz kurze Zeit
  rationale: Die Verbindung zweier annähernd gleichbedeutender Ausdrücke betont, dass nur eine äußerst kurze Zeit verbleibt. Die deutsche Fassung gibt diese zeitliche und verstärkende Funktion natürlich wieder.
- source_word: וְכָלָה
  choice: dann ist … zu Ende
  rationale: Das Perfekt bezeichnet hier im prophetischen Zusammenhang ein unmittelbar bevorstehendes Ende. „Dann“ macht den zeitlichen Fortgang idiomatisch deutlich, ohne die Aussage inhaltlich zu erweitern.
- source_word: זַעַם
  choice: Unwille
  rationale: Bezeichnet hier Gottes heftige Missbilligung beziehungsweise Zorn. „Unwille“ wahrt den gehobenen Ton und unterscheidet den Ausdruck vom folgenden אַפִּי.
- source_word: וְאַפִּי
  choice: und mein Zorn
  rationale: Das wörtlich auf „Nase“ zurückgehende Idiom bezeichnet Zorn; die erste Person und der Unterschied zum vorherigen Begriff bleiben erhalten.
- source_word: עַל
  choice: richtet sich auf
  rationale: Kennzeichnet das Ziel beziehungsweise den Bezug des Zorns. Die Formulierung ist im Deutschen verständlich, lässt aber die ungewöhnliche Beziehung zum folgenden seltenen Substantiv stehen.
- source_word: תַּבְלִיתָם
  choice: ihre Vernichtung
  rationale: Das seltene Substantiv bezeichnet im Kontext wahrscheinlich die Vernichtung beziehungsweise das Ende der Bedränger. Der pronominale Suffix „ihre“ wird ausdrücklich bewahrt; die lexikalische Unsicherheit wird in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Bezug von „ihre“ in „ihre Vernichtung“
  choice: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf die Feinde beziehungsweise Bedränger, besonders auf Assur.
  alternative: Die Wendung kann weniger personenbezogen als allgemeine Aussage über „Vernichtung“ oder „ein Ende“ verstanden werden.
  rationale: Der Kontext kündigt an, dass Gottes Unwille gegen sein Volk endet und sein Zorn den Bedränger trifft. Die Übersetzung bewahrt jedoch lediglich das hebräische Pronomen und nennt Assur nicht ausdrücklich im Vers.
- issue: Verhältnis von Gottes Unwillen und Zorn
  choice: Die beiden hebräischen Zornbegriffe werden mit „Unwille“ und „Zorn“ unterschieden.
  alternative: Beide könnten mit „Zorn“ beziehungsweise „Grimm“ wiedergegeben werden.
  rationale: Die Differenzierung verhindert eine unnötige Einebnung der parallelen, aber nicht identischen Ausdrücke, ohne daraus zwei theologisch getrennte Formen göttlichen Handelns abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem prophetischem Ton. Die betonte Kürze der verbleibenden Zeit wird idiomatisch ausgedrückt; zwei verschiedene hebräische Zornbegriffe bleiben unterscheidbar. Der Fußnotenmarker steht unmittelbar bei dem seltenen und unsicheren Ausdruck, auf den sich die Fußnote bezieht.
