id: ISA.10.26
reference: Isaiah 10:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: de
  text: Und Jahwe der Heerscharen wird eine Peitsche gegen ihn schwingen[a] wie bei der Niederlage Midians am Felsen Oreb.[b] Sein Stab wird über dem Meer sein, und er wird ihn erheben wie einst in Ägypten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wird gegen ihn eine Peitsche aufbieten“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Felsen Oreb“ erinnert an Richter 7,25, wo Oreb, ein Anführer der Midianiter, getötet wurde.
    reason: cross_reference
  - marker: c
    text: 'Wörtlicher: „nach der Weise Ägyptens“. Gemeint ist wahrscheinlich Jahwes Handeln beim Auszug aus Ägypten, als der Stab über dem Meer erhoben wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: wird … schwingen
  rationale: Das Hifil bezeichnet hier das In-Bewegung-Setzen beziehungsweise Aufbieten eines Strafwerkzeugs. Mit „eine Peitsche … schwingen“ wird dies im Deutschen anschaulich und natürlich ausgedrückt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die traditionelle, weit gefasste Bedeutung des Titels.
- source_word: שׁוֹט
  choice: Peitsche
  rationale: Das konkrete Schlaginstrument trägt das Bild strafenden Gerichts klar und verständlich.
- source_word: כְּמַכַּת מִדְיָן
  choice: wie bei der Niederlage Midians
  rationale: מַכָּה kann den Schlag oder das vernichtende Schlagen bezeichnen. „Niederlage“ gibt im historischen Zusammenhang das Ergebnis wieder, ohne den nicht ausdrücklich vorhandenen Gedanken eines Gemetzels einzutragen.
- source_word: בְּצוּר עוֹרֵב
  choice: am Felsen Oreb
  rationale: Die Ortsangabe bewahrt die Anspielung auf Richter 7,25.
- source_word: וּמַטֵּהוּ
  choice: Sein Stab
  rationale: מַטֶּה wird wegen der folgenden Meer- und Ägypten-Anspielung als „Stab“ wiedergegeben. Das Pronomen bleibt wie im Hebräischen formal offen.
- source_word: עַל הַיָּם
  choice: über dem Meer
  rationale: Die räumliche Bildsprache und die Anspielung auf die Erhebung des Stabes am Meer bleiben erhalten.
- source_word: וּנְשָׂאוֹ
  choice: und er wird ihn erheben
  rationale: נשׂא bedeutet „heben/erheben“; das Objektpronomen nimmt natürlich den Stab auf, während das Subjekt im Deutschen ebenso wenig ausdrücklich benannt wird wie im Hebräischen.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: wie einst in Ägypten
  rationale: דֶּרֶךְ bezeichnet hier wahrscheinlich die Art und Weise des früheren Handelns Gottes. „Wie einst in Ägypten“ macht die historische Analogie idiomatisch verständlich, ohne daraus einen wörtlichen Weg nach Ägypten zu machen.
theological_decisions:
- issue: Bezug der Pronomen im zweiten Satzteil
  choice: „Sein Stab … er wird ihn erheben“ bewahrt die pronominale Form und lässt Jahwe als wahrscheinlichen Bezug erkennen.
  alternative: Die Pronomen können auf den Assyrer beziehungsweise dessen Stab bezogen werden.
  rationale: Meer und Ägypten rufen stark Jahwes Handeln beim Exodus in Erinnerung; zugleich wird die im unmittelbaren Kontext mögliche Beziehung auf Assyrien nicht durch einen eingefügten Namen ausgeschlossen.
- issue: Historische Anspielungen
  choice: Der Text lässt sowohl den Sieg über Midian als auch das Geschehen am Meer beim Exodus anklingen.
  alternative: Die Wendungen könnten allgemeiner als Bilder göttlichen Gerichts verstanden werden.
  rationale: Der Felsen Oreb ist eine konkrete Erinnerung an Richter 7,25; Meer, Stab und Ägypten bilden zusammen eine deutliche Exodus-Anspielung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem poetisch-prophetischen Aufbau des Hebräischen, vermeidet jedoch unnatürliche Wörtlichkeit. Die Gottesbezeichnung „Jahwe der Heerscharen“ und die historischen Eigennamen bleiben transparent erhalten.
