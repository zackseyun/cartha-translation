source:
  edition: WLC
  text: וּ/כְב֤וֹד יַעְר/וֹ֙ וְ/כַרְמִלּ֔/וֹ מִ/נֶּ֥פֶשׁ וְ/עַד בָּשָׂ֖ר יְכַלֶּ֑ה וְ/הָיָ֖ה כִּ/מְסֹ֥ס נֹסֵֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: de
  text: Und die Pracht seines Waldes und seines fruchtbaren Landes wird er verzehren, von Seele bis Fleisch; und es wird sein wie das Dahinschwinden eines Kranken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einer, der dahinschwindet“. Die letzte hebräische Wendung ist schwer verständlich; das letzte Wort wird auch anders gedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: die Pracht
  rationale: כָּבוֹד bezeichnet Herrlichkeit, Ehre oder Pracht. Im Bild von Assyriens Wald und Fruchtland gibt „Pracht“ dessen eindrucksvolle Fülle natürlich wieder.
- source_word: יַעְרוֹ
  choice: seines Waldes
  rationale: יַעַר bedeutet „Wald“ oder „Waldland“ und wird hier als Bild für Assyriens Macht und Menge beibehalten.
- source_word: וְכַרְמִלּוֹ
  choice: und seines Fruchtlands
  rationale: כַּרְמֶל kann fruchtbares, kultiviertes Land oder Gartenland bezeichnen; hier liegt eher das Gattungswort als der Eigenname Karmel vor.
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: vom Leben bis zum Leib
  rationale: Die konkrete Spannweite des Hebräischen wird gewahrt. נֶפֶשׁ kann hier „Leben“ bedeuten, während בָּשָׂר den körperlichen Leib bezeichnet; zusammen wird umfassende Vernichtung ausgedrückt, ohne die anthropologische Spannung einzuebnen.
- source_word: יְכַלֶּה
  choice: wird er verzehren
  rationale: Das Piel von כלה kann „vollenden“, „aufzehren“ oder „vernichten“ bedeuten. „Verzehren“ passt zum Feuerbild des Zusammenhangs.
- source_word: וְהָיָה
  choice: und es wird sein
  rationale: Das unpersönliche „es“ nimmt den resultierenden Zustand der zuvor genannten Pracht als Ganzes auf.
- source_word: כִּמְסֹס
  choice: wie wenn … dahinschwindet
  rationale: Die seltene Form wird meist mit Schmelzen, Schwinden oder Vergehen verbunden. Die verbale deutsche Wendung gibt den fortschreitenden Verfall natürlich wieder.
- source_word: נֹסֵס
  choice: ein Kranker
  rationale: Das schwierige Wort wird traditionell auf einen kranken, dahinschwindenden Menschen bezogen. Wegen der Unsicherheit wird eine Alternative in der Fußnote genannt.
