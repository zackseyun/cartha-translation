revisions:
- from: Und die Pracht seines Waldes und seines Fruchtlands wird er verzehren, vom Leben bis zum Leib; und es wird sein, wie wenn ein Kranker dahinschwindet.[a]
  to: Und die Pracht seines Waldes und seines fruchtbaren Landes wird er verzehren, von Seele bis Fleisch; und es wird sein wie das Dahinschwinden eines Kranken.[a]
  rationale: Die Revision verbessert die idiomatische deutsche Formulierung und stellt die konkrete hebräische Wendung מִנֶּפֶשׁ וְעַד בָּשָׂר mit „von Seele bis Fleisch“ enger nach. Die umstrittene Schlusswendung bleibt bei der in der englischen Prüfspur vertretenen Lesart, wird aber weiterhin durch die Fußnote als unsicher markiert.
