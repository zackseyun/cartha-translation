review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Bildsprache werden zutreffend wiedergegeben: Der Glanz von Wald und fruchtbarem Land wird vollständig verzehrt. „Vom Leben bis zum Leib“ verschiebt jedoch die konkrete hebräische Gegenüberstellung נֶפֶשׁ / בָּשָׂר unnötig und klingt im Deutschen semantisch unklar. Die schwierige Schlussformulierung wird vertretbar im Anschluss an die in der englischen Prüfspur gewählte Deutung wiedergegeben; ihre Unsicherheit muss weiterhin kenntlich bleiben.'
  naturalness: „Seines Fruchtlands“ ist möglich, aber „seines fruchtbaren Landes“ ist im modernen Standarddeutsch flüssiger. „Wie wenn ein Kranker dahinschwindet“ ist verständlich, aber die nominale Vergleichsform ist näher am Hebräischen und stilistisch geschlossener.
  terminology: „Pracht“, „Wald“, „verzehren“ und „fruchtbares Land“ sind angemessen. „Von Seele bis Fleisch“ bewahrt die hebräischen Begriffe ohne eine einengende anthropologische oder dogmatische Auslegung. Die Fußnote wahrt die lexikalische Unsicherheit von נֹסֵס.
  issues:
  - severity: medium
    issue: „vom Leben bis zum Leib“
    rationale: Die Wiedergabe ersetzt die hebräischen konkreten Begriffe „Seele“ und „Fleisch“ durch eine deutsche Gegensatzpaarung, die weder idiomatisch noch präzise ist. „Von Seele bis Fleisch“ erhält die Formulierung und ihre Auslegungsweite.
  - severity: low
    issue: „seines Fruchtlands“
    rationale: Nicht falsch, aber „seines fruchtbaren Landes“ ist in modernem Standarddeutsch natürlicher und gibt כַּרְמֶל als Gattungsbezeichnung klar wieder.
  - severity: low
    issue: Vergleichssatz am Versende
    rationale: Die Form „wie das Dahinschwinden eines Kranken“ folgt der substantivischen hebräischen Vergleichskonstruktion enger als „wie wenn ein Kranker dahinschwindet“, ohne die in der Fußnote markierte Unsicherheit zu verdecken.
  revised_text: Und die Pracht seines Waldes und seines fruchtbaren Landes wird er verzehren, von Seele bis Fleisch; und es wird sein wie das Dahinschwinden eines Kranken.[a]
