  text: ע֥וֹד הַ/יּ֖וֹם בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד יְנֹפֵ֤ף יָד/וֹ֙ הַ֣ר בית צִיּ֔וֹן גִּבְעַ֖ת יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
translation:
  language: de
  text: Noch heute wird er in Nob Halt machen; er wird seine Hand drohend gegen den Berg des Hauses Zion[b], den Hügel Jerusalems, schwingen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „schwenken“ oder „schütteln“. Das hebräische Verb kann eine drohende Gebärde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach der vorgelegten hebräischen Textgestalt: „der Berg des Hauses Zion“. Andere Textformen und Übersetzungen bieten „der Berg der Tochter Zion“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ע֥וֹד הַיּ֖וֹם
  choice: Noch heute
  rationale: Die Verbindung bezeichnet anschaulich die unmittelbare Fortsetzung des Geschehens bis zu diesem Tag; „Noch heute“ ist im Deutschen knapp und natürlich.
- source_word: בְּנֹ֣ב לַֽעֲמֹ֑ד
  choice: wird er in Nob Halt machen
  rationale: עמד bezeichnet hier im Zusammenhang des militärischen Vormarschs das Anhalten beziehungsweise Stellungnehmen an einem Ort.
- source_word: יְנֹפֵ֤ף יָד/וֹ֙
  choice: wird seine Hand drohend … schwingen
  rationale: נוף kann ein Schwingen, Schwenken oder eine bedrohliche Gebärde bezeichnen. „Drohْend … schwingen“ gibt die feindselige Geste wieder, ohne „Hand“ durch „Faust“ zu ersetzen.
- source_word: הַ֣ר בית צִיּ֔וֹן
  choice: den Berg des Hauses Zion
  rationale: Die vorgelegte hebräische Textgestalt enthält ausdrücklich בית („Haus“). Die ungewöhnliche Formulierung wird deshalb im Haupttext bewahrt und nicht stillschweigend zu „Tochter Zion“ geändert.
- source_word: גִּבְעַ֖ת יְרוּשָׁלִָֽם
  choice: den Hügel Jerusalems
  rationale: Die Status-constructus-Verbindung wird transparent wiedergegeben und als Apposition zum vorangehenden Berg verstanden.
theological_decisions:
- issue: Bezug der unausgesprochenen männlichen Einzahl („er“)
  choice: Die männliche Einzahl bleibt ohne ausdrückliche Identifizierung erhalten.
  alternative: Der König von Assyrien beziehungsweise das personifizierte assyrische Heer
  rationale: Der Zusammenhang weist auf den assyrischen Angreifer, doch der Vers selbst nennt ihn nicht ausdrücklich. Die Übersetzung vermeidet daher eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bewegung wird idiomatisch mit „Halt machen“ ausgedrückt; die ungewöhnliche Lesart „Haus Zion“ bleibt gemäß der vorgelegten WLC-Textgestalt sichtbar. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Formulierung.
