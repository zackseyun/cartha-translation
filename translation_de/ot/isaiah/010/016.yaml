source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: de
  text: Darum wird der Herr, Jahwe der Heerscharen, unter seinen Wohlgenährten[a] Auszehrung senden; und unter seiner Herrlichkeit[b][c] wird ein Brand auflodern wie der Brand eines Feuers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter seinen Fetten«; das Bild kann Stärke, Wohlstand oder die kräftige Elite bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Herrlichkeit« kann hier auch »Glanz«, »Pracht« oder »Prunk« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Anstelle seiner Herrlichkeit wird ein Brand auflodern«; das hebräische Wort für »unter« kann auch einen Ersatz bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die angekündigte Konsequenz aus dem vorausgehenden Gerichtswort ein.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  rationale: אָדוֹן wird als Titel wiedergegeben, der Gottesname יְהוָה als »Jahwe«. »Heerscharen« bewahrt den umfassenden Sinn von צְבָאוֹת und ist im Deutschen verständlich und würdevoll.
- source_word: בְּמִשְׁמַנָּיו
  choice: unter seinen Wohlgenährten
  rationale: Wörtlich bezeichnet der Ausdruck seine »Fetten«. »Wohlgenährte« erhält das Körperbild, ohne moderne Leser unnötig auf Fettleibigkeit festzulegen; gemeint sein können die kräftigen oder begünstigten Angehörigen der assyrischen Elite.
- source_word: רָזוֹן
  choice: Auszehrung
  rationale: Das Substantiv bezeichnet Magerkeit beziehungsweise das Auszehren. »Auszehrung« bildet den beabsichtigten Gegensatz zu den Wohlgenährten ab, ohne ausdrücklich eine bestimmte Krankheit einzutragen.
- source_word: וְתַחַת כְּבֹדוֹ
  choice: und unter seiner Herrlichkeit
  rationale: תַחַת hat zunächst den Sinn »unter« oder »unterhalb«, kann aber auch »anstelle von« bedeuten. Die Hauptfassung bewahrt das räumliche Bild eines Feuers unter dem äußeren Glanz.
- source_word: יֵקַד יְקֹד
  choice: wird ein Brand auflodern
  rationale: Die hebräische Verbindung eines Verbs mit einem stammverwandten Substantiv verstärkt das Bild. »Ein Brand auflodern« gibt die Wirkung in natürlichem Deutsch wieder.
- source_word: כִּיקוֹד אֵשׁ
  choice: wie loderndes Feuer
  rationale: Die vergleichende Wendung intensiviert das Gerichtsbild; die idiomatische Formulierung wahrt sowohl das Brennen als auch das Feuer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בְּמִשְׁמַנָּיו
  choice: metaphorisch offene Bezeichnung »seine Wohlgenährten«
  alternative: seine kräftigen Männer; seine Krieger; seine Fetten
  rationale: Der Kontext legt Assyriens starke und begünstigte Elite nahe, doch das Substantiv nennt nicht ausdrücklich Krieger. Die Übersetzung bewahrt deshalb das Bild und lässt den genauen Personenkreis offen.
- issue: Bedeutung von תַחַת bei Assyriens Herrlichkeit
  choice: unter seiner Herrlichkeit
  alternative: anstelle seiner Herrlichkeit
  rationale: Beide Bedeutungen sind sprachlich möglich. Die Hauptfassung erhält das anschauliche Bild eines verborgenen oder darunter entzündeten Brandes; die substitutionale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen hebräischen Gegenbilder Wohlgenährtheit/Auszehrung und Herrlichkeit/Brand bleiben erkennbar. Interpretierende Zusätze wie »Krieger« oder die Benennung einer bestimmten Krankheit werden vermieden; echte lexikalische Mehrdeutigkeit wird in den Fußnoten offengelegt.
