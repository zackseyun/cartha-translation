    rationale: צוה verlangt hier „ich befehle ihm“ bzw. „ich beauftrage ihn“. „Jemanden entbieten“ bedeutet im modernen Deutsch gewöhnlich, jemanden zu bestellen oder herbeizurufen, nicht ihm einen Auftrag zu befehlen.
