revisions:
- from: Gegen eine gottlose Nation sende ich ihn[a], und gegen das Volk meines Zorns entbiete ich ihn, Beute zu erbeuten und Raub zu rauben[b] und es zertreten zu lassen wie den Schlamm auf den Straßen.[c]
  to: Gegen eine gottlose Nation sende ich ihn[a], und gegen das Volk meines Zorns befehle ich ihm, Beute zu erbeuten und Raub zu rauben[b] und es zertreten zu lassen wie den Schlamm auf den Straßen.[c]
  rationale: Die einzige notwendige Textänderung ersetzt das missverständliche und heute unidiomatische „entbiete ich ihn“ durch „befehle ich ihm“. Damit werden die Valenz von צוה, der Dativ des Beauftragten und die gerichtliche Beauftragung präzise wiedergegeben. Die übrige Formulierung bleibt erhalten, einschließlich der absichtlich markierten hebräischen Intensivdoppelung. Fußnote c wurde sprachlich und semantisch an die Hauptfassung angeglichen.
