source:
  edition: WLC
  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: de
  text: Gegen eine gottlose Nation sende ich ihn[a], und gegen das Volk meines Zorns befehle ich ihm, Beute zu erbeuten und Raub zu rauben[b] und es zertreten zu lassen wie den Schlamm auf den Straßen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine ruchlose Nation“. Das hebräische Adjektiv bezeichnet Gottlosigkeit, Frevel oder religiöse Treulosigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Beute zu erbeuten und Raub zu rauben“. Die gleichstämmigen Wortverbindungen verstärken die Vorstellung umfassender Plünderung.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Suffix steht im maskulinen Singular und bezieht sich auf die Nation beziehungsweise das Volk als Kollektiv. Das hebräische Wort bezeichnet etwas, das zertreten wird oder dem Zertreten preisgegeben ist.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: eine gottlose Nation
  rationale: גּוֹי bezeichnet hier ein politisch-kollektives Volk; חָנֵף ist im prophetischen Sprachgebrauch eine religiös-moralische Verurteilung und bedeutet eher „gottlos“ als bloß „heuchlerisch“.
- source_word: אֲשַׁלְּחֶנּוּ
  choice: sende ich ihn
  rationale: Das hebräische Imperfekt erhält im prophetischen Zusammenhang durch das deutsche Präsens unmittelbare Eindringlichkeit; das maskuline Suffix verweist auf den zuvor genannten assyrischen Vollstrecker.
- source_word: עַם עֶבְרָתִי
  choice: das Volk meines Zorns
  rationale: Die substantivische Wendung wird bewahrt und die direkte Rede vom göttlichen Zorn nicht zu „dem Volk, über das ich zornig bin“ abgeschwächt.
- source_word: אֲצַוֶּנּוּ
  choice: entbiete ich ihn
  rationale: צוה bedeutet „befehlen, beauftragen“. „Entbieten“ drückt hier die verbindliche göttliche Beauftragung natürlich aus und vermeidet die im Deutschen mögliche Fehlannahme, dass dem Volk etwas befohlen werde.
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: Beute zu erbeuten und Raub zu rauben
  rationale: Die beiden figurae etymologicae des Hebräischen werden bewusst hörbar gemacht. Die markante Wiederholung entspricht dem intensiven, poetischen Ausdruck und ist im Deutschen verständlich.
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: es zertreten zu lassen
  rationale: Das maskuline Singularsuffix greift Nation beziehungsweise Volk als Kollektiv auf. מִרְמָס bezeichnet hier das dem Zertreten Preisgegebene; die verbale deutsche Fassung ist natürlicher als „zu einem Zertreten machen“.
- source_word: כְּחֹמֶר חוּצוֹת
  choice: wie den Schlamm auf den Straßen
  rationale: חֹמֶר meint im Bildzusammenhang Straßenschlamm beziehungsweise Morast; חוּצוֹת sind die Straßen oder öffentlichen Außenräume.
theological_decisions:
- issue: Bezugswort der maskulinen Singularsuffixe bei „senden“ und „entbieten“
  choice: Der Beauftragte wird mit „ihn“ bezeichnet.
  alternative: Assur könnte als personifizierte politische Macht aufgefasst und im Deutschen mit einem anderen grammatischen Bezug wiedergegeben werden.
  rationale: Jesaja 10,5 nennt Assur als Werkzeug des göttlichen Gerichts; das Hebräische verwendet hier maskuline Singularsuffixe und lässt König und Reich als Vollstrecker eng verbunden.
- issue: Göttlicher Zorn und menschliche Täterschaft
  choice: „Volk meines Zorns“ und die ausdrückliche göttliche Beauftragung bleiben ungemildert stehen.
  alternative: Eine paraphrasierende Fassung könnte vom Volk sprechen, „über das ich zornig bin“, oder die Beauftragung abschwächen.
  rationale: Der Vers stellt Assurs gewaltsames Handeln ausdrücklich unter Gottes Gerichtshandeln. Die daraus entstehende theologische Spannung darf nicht stillschweigend aufgelöst werden.
- issue: Referent von וּלְשִׂימוֹ
  choice: „es“ verweist kollektiv auf die angegriffene Nation beziehungsweise das Volk.
  alternative: „ihn“ wäre grammatisch möglich, könnte im Deutschen aber fälschlich auf den assyrischen Vollstrecker bezogen werden.
  rationale: Der unmittelbare Sinn ist, dass das Zielvolk zertreten wird. Das sächliche Pronomen hält den kollektiven Bezug im Deutschen klar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildkraft. „Gottlos“, „Zorn“, „Beute“, „Raub“ und „Schlamm“ sind allgemein verständlich. Die ungewöhnliche Doppelung „Beute zu erbeuten und Raub zu rauben“ bildet die bewusst intensive hebräische Rhetorik ab; Fußnote b erläutert sie. Alle Fußnotenmarker erscheinen im Haupttext.
