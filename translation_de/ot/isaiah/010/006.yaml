  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Gott sendet einen maskulinen Singularbeauftragten gegen eine gottlose Nation bzw. das Volk seines Zorns; die beiden intensivierenden Infinitivverbindungen sowie das Bild vom Straßenschlamm bleiben erhalten. Die Wiedergabe „entbiete ich ihn“ trifft צוה jedoch nicht zuverlässig, da sie im heutigen Deutsch nicht idiomatisch „ich befehle ihm“ bedeutet und eher ein Herbeirufen nahelegt.'
  naturalness: „Entbiete ich ihn“ ist im modernen Standarddeutsch unnatürlich und semantisch missverständlich. „Befehle ich ihm“ ist idiomatisch, bewahrt die ausdrückliche Befehlshandlung und macht durch den Dativ klar, dass der Beauftragte, nicht das Zielvolk, angesprochen ist. Die bewusst rhetorische Doppelung „Beute zu erbeuten und Raub zu rauben“ kann als optimal-äquivalente Wiedergabe stehen bleiben.
  terminology: „Gottlose Nation“, „Volk meines Zorns“, „Beute“, „Raub“ und „Schlamm“ sind passend. Der Schlusssatz gibt מִרְמָס sinnvoll als dem Zertreten-Preisgegebenes wieder; die deutsche Verbform ist verständlich. Die Fußnote sollte nicht von einem „zu etwas Zertretenem“ sprechen, wenn die Hauptfassung bereits mit „zertreten zu lassen“ arbeitet, sondern die substantivische Nuance präzise erläutern.
