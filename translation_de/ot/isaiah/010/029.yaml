  source_fidelity: Die Ortsnamen, die Abfolge der Stationen und die Angst-/Fluchtbilder entsprechen dem Hebräischen. Die Wiedergabe von מַעְבָּרָה als „Übergang“ lässt die lexikalische Offenheit gegenüber „Pass“, „Furt“ und einer allgemeinen Übergangsstelle bestehen. „Gibea Sauls“ gibt die Constructusverbindung גִּבְעַת שָׁאוּל sachgerecht wieder.
  naturalness: „Den Übergang überschreiten“ ist im Deutschen bei einem Ort des Übergangs unnötig doppeldeutig und weniger idiomatisch. „Die Übergangsstelle passieren“ bezeichnet die vollzogene Bewegung klar und bewahrt die offene Bedeutung des hebräischen Substantivs. „Nachtquartier“ ist für מָלוֹן in diesem knappen militärischen Itinerar natürlich.
  terminology: Die Formen „Geba“, „Rama“ und „Gibea Sauls“ sind unterscheidbar und im deutschen Bibelgebrauch verständlich. Die Fußnoten bieten die wesentlichen lexikalischen Alternativen, ohne die Hauptübersetzung einseitig festzulegen.
