base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
translation:
  language: de
  text: Sie haben die Übergangsstelle[a] passiert. Geba ist unser Nachtquartier. Rama zittert; Gibea Sauls[b] ist geflohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Pass“; auch „die Furt“ oder „den Übergang“. Das hebräische Wort bezeichnet allgemein einen Ort des Hinübergehens.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sauls Gibea“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְרוּ
  choice: Sie haben ... überschritten
  rationale: Das Qal Perfekt 3. Person Plural schildert den vollzogenen Vormarsch. Das deutsche Perfekt gibt den lebendigen Bericht natürlich wieder.
- source_word: מַעְבָּרָה
  choice: den Übergang
  rationale: Das Substantiv bezeichnet allgemein eine Stelle oder Route zum Hinübergehen. „Übergang“ bewahrt diese Breite, ohne unbelegt einen Gebirgspass oder eine Furt festzulegen.
- source_word: גֶּבַע
  choice: Geba
  rationale: Der Ortsname wird in gebräuchlicher deutscher Transkription wiedergegeben.
- source_word: מָלוֹן לָנוּ
  choice: ist unser Nachtlager
  rationale: מָלוֹן bezeichnet einen Ort zum Übernachten; die nominale hebräische Aussage wird im Deutschen mit „ist“ idiomatisch ausgedrückt.
- source_word: חָרְדָה
  choice: zittert
  rationale: Das Qal Perfekt kann hier im dichterischen, lebhaften Bericht gegenwärtig wiedergegeben werden. „Zittert“ bewahrt sowohl die körperliche Reaktion als auch den Gedanken der Angst.
- source_word: הָרָמָה
  choice: Rama
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea Sauls
  rationale: Die deutsche Genitivverbindung bildet die hebräische Constructusverbindung knapp und formal nach.
- source_word: נָסָה
  choice: ist geflohen
  rationale: Das Qal Perfekt 3. Person Femininum bezeichnet die bereits erfolgte Flucht der als feminine Ortsbezeichnung behandelten Stadt.
