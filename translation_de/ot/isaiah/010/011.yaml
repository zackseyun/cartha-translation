  text: shall I not do to Jerusalem and her idols just as I did to Samaria and her idols?[a]
translation:
  language: de
  text: Werde ich nicht mit Jerusalem und seinen Götzenbildern genauso verfahren wie mit Samaria und seinen Götzen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen zwei verschiedene Wörter: bei Samaria „Götzen“ (אֱלִילִים), bei Jerusalem „Götzenbilder“ (עֲצַבִּים).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Sollte ich … nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Form bewahrt zugleich den Zukunftsbezug des folgenden Imperfekts.
- source_word: כַּאֲשֶׁר … כֵּן
  choice: genauso … wie
  rationale: Gibt die korrelative Vergleichskonstruktion natürlich und deutlich wieder.
- source_word: עָשִׂיתִי … אֶעֱשֶׂה
  choice: verfahren bin … verfahren
  rationale: Unterscheidet die abgeschlossene Handlung an Samaria von der angekündigten Handlung an Jerusalem. „Verfahren mit“ gibt עשה ל idiomatisch wieder, ohne die im Kontext erkennbare feindliche Handlung unnötig auszudeuten.
- source_word: לְשֹׁמְרוֹן … לִירוּשָׁלַםִ
  choice: mit Samaria … mit Jerusalem
  rationale: Im Deutschen verlangt die gewählte Wendung „verfahren“ die Präposition „mit“ und bezeichnet die von der Handlung betroffenen Städte.
- source_word: אֱלִילֶיהָ
  choice: seinen Götzen
  rationale: אֱלִילִים bezeichnet abwertend nichtige oder falsche Götter; „Götzen“ ist knapp, verständlich und bewahrt die negative Wertung.
- source_word: עֲצַבֶּיהָ
  choice: seinen Götzenbildern
  rationale: Bewahrt im Haupttext den lexikalischen Unterschied zum ersten Götzenbegriff und gibt den bildhaften Gegenstandsbezug von עֲצַבִּים wieder.
theological_decisions:
- issue: Zwei verschiedene hebräische Bezeichnungen für Kultobjekte
  choice: אֱלִילִים als „Götzen“ und עֲצַבִּים als „Götzenbilder“ wiedergeben
  alternative: Beide Begriffe einheitlich mit „Götzen“ übersetzen
  rationale: Die differenzierte Wiedergabe bewahrt die Wortwahl des hebräischen Textes, ohne die rhetorische Gleichsetzung von Samaria und Jerusalem aufzuheben.
- issue: Art der gegen Samaria und Jerusalem gerichteten Handlung
  choice: Mit „verfahren mit“ die Handlung allgemein lassen
  alternative: Mit „antun“ oder „gegen … vorgehen“ die feindliche Bedeutung expliziter machen
  rationale: Das Verb עשה ist allgemein; die zerstörerische Bedeutung ergibt sich aus dem Kontext. Die Übersetzung soll diese nicht stärker festlegen als der Vers selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der zeitliche Gegensatz zwischen bereits besiegtem Samaria und künftig bedrohtem Jerusalem bleiben erhalten. Die Städte werden entsprechend dem hebräischen grammatischen Geschlecht mit „seinen“ aufgenommen.
