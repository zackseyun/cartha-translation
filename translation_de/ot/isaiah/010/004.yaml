base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: de
  text: Nichts bleibt übrig, als sich unter die Gefangenen zu beugen oder unter die Erschlagenen zu fallen.[a] Bei alledem hat sich sein Zorn nicht abgewandt, und seine Hand ist noch ausgestreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer sich unter Gefangenen zu beugen; und unter den Erschlagenen werden sie fallen“. Das Hebräische ist stark verkürzt; wie die Verben und Präpositionen syntaktisch zusammengehören, ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְתִּי
  choice: Es bleibt nichts, als
  rationale: Die Partikel bezeichnet in der stark verkürzten Aussage das einzig noch verbleibende Schicksal. Die Formulierung gibt diese ausschließende Bedeutung im Deutschen idiomatisch wieder.
- source_word: כָרַע
  choice: sich zu ducken
  rationale: Das Verb bezeichnet ein Sich-Beugen oder Niedersinken. „Sich ducken“ vermittelt hier erzwungene Erniedrigung in der Gefangenschaft, ohne einen kultischen Beiklang nahezulegen.
- source_word: תַּחַת
  choice: unter die
  rationale: Die Präposition bedeutet wörtlich „unter“; im Zusammenhang beschreibt sie die Einreihung unter Gefangene beziehungsweise Erschlagene. „Unter die“ bewahrt das Bild und ist im Deutschen verständlich.
- source_word: אַסִּיר
  choice: die Gefangenen
  rationale: Das Substantiv bezeichnet einen Gefangenen oder Gebundenen. Der deutsche Plural gibt den kollektiven Bezug natürlich wieder.
- source_word: הֲרוּגִים
  choice: die Erschlagenen
  rationale: Das passive Partizip bezeichnet gewaltsam Getötete. „Erschlagene“ erhält diesen spezifischen Sinn besser als das allgemeinere „Tote“.
- source_word: יִפֹּלוּ
  choice: zu fallen
  rationale: Obwohl die hebräische Form finit ist („sie werden fallen“), lässt sie sich im elliptischen Satz als paralleles zweites unausweichliches Schicksal verstehen. Der Infinitiv ergibt zusammen mit „Es bleibt nichts, als“ einen natürlichen deutschen Satz; die alternative syntaktische Zuordnung wird in der Fußnote bewahrt.
- source_word: בְּכָל זֹאת
  choice: Bei alledem
  rationale: Die feste Wendung leitet den wiederkehrenden Refrain ein und stellt fest, dass trotz des geschilderten Gerichts Gottes Zorn nicht beendet ist.
- source_word: לֹא שָׁב אַפּוֹ
  choice: hat sich sein Zorn nicht abgewandt
  rationale: אַף bedeutet im Idiom „Zorn“, und שׁוּב beschreibt dessen Nicht-Zurückweichen. Die Übersetzung bewahrt Ausdruck und Zeitbezug des hebräischen Refrains.
- source_word: יָדוֹ נְטוּיָה
  choice: seine Hand ist noch ausgestreckt
  rationale: Die Formulierung erhält das wiederkehrende jesajanische Bild für Gottes weiterhin wirksames Gericht. „Noch“ gibt וְעוֹד präzise wieder.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Gericht
  choice: „sein Zorn“ und „seine Hand ist noch ausgestreckt“ werden bildhaft beibehalten
  alternative: Abstrakte Wiedergabe wie „sein Gericht dauert an“
  rationale: Der hebräische Text spricht bewusst in körperbezogenen Bildern von Gottes fortdauerndem Gericht. Eine abstrakte Paraphrase würde diese Bildsprache und ihre theologische Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz ist wegen der Verdichtung des Hebräischen bewusst knapp gehalten; die ungewöhnliche Bildlichkeit wird nicht geglättet. Der zweite Satz wahrt den Rhythmus und die anthropomorphe Sprache des wiederkehrenden Jesaja-Refrains.
