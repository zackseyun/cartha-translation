  text: וְ/הוּא֙ לֹא כֵ֣ן יְדַמֶּ֔ה וּ/לְבָב֖/וֹ לֹא כֵ֣ן יַחְשֹׁ֑ב כִּ֚י לְ/הַשְׁמִ֣יד בִּ/לְבָב֔/וֹ וּ/לְ/הַכְרִ֥ית גּוֹיִ֖ם לֹ֥א מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: de
  text: Doch er stellt es sich nicht so vor[a], und sein Herz denkt nicht so; denn er hat im Sinn, zu vernichten und nicht wenige Nationen[b] auszurotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beabsichtigt es nicht so«; das hebräische Verb kann sowohl das innere Vorstellen als auch das Beabsichtigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nicht wenige«; eine hebräische Untertreibung für eine große Zahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַמֶּה
  choice: stellt es sich ... vor
  rationale: Das Piel von דמה bezeichnet hier das innere Vorstellen oder Beabsichtigen. Die Formulierung ist natürliches Deutsch und bleibt gegenüber der möglichen Bedeutung »beabsichtigen« offen.
- source_word: לְבָבוֹ
  choice: sein Herz
  rationale: »Herz« bewahrt das hebräische Bild für das Zentrum von Denken und Wollen, ohne es auf Gefühle zu verengen.
- source_word: יַחְשֹׁב
  choice: denkt
  rationale: חשב bezeichnet Denken, Erwägen oder Planen. »Denkt« bildet den kognitiven Parallelismus verständlich ab, während »stellt es sich vor« den ersten Ausdruck unterscheidet.
- source_word: כִּי
  choice: vielmehr
  rationale: כִּי führt hier den tatsächlichen inneren Plan des assyrischen Königs ein. »Vielmehr« macht den Gegensatz idiomatisch deutlich, ohne zusätzliche Erklärung einzutragen.
- source_word: לְהַשְׁמִיד
  choice: zu vernichten
  rationale: Das Hifil von שׁמד bezeichnet das Herbeiführen von Zerstörung. »Vernichten« gibt die starke zerstörerische Absicht knapp wieder.
- source_word: בִּלְבָבוֹ
  choice: hat er im Herzen
  rationale: Die Wiederaufnahme von »Herz« bewahrt die hebräische Betonung seiner inneren Absicht.
- source_word: לְהַכְרִית
  choice: auszurotten
  rationale: Das Hifil von כרת bedeutet abschneiden, beseitigen oder ausrotten. Im Bezug auf Nationen ist »ausrotten« natürlich und gibt die gewaltsame Beseitigung wieder.
- source_word: גּוֹיִם
  choice: Nationen
  rationale: Im politischen Zusammenhang bezeichnet גוים Völker beziehungsweise staatlich verstandene Nationen; »Nationen« ist hier präzise.
- source_word: לֹא מְעָט
  choice: nicht wenige
  rationale: Die wörtliche Litotes bleibt erhalten und bewahrt die rhetorische Form des Hebräischen.
- source_word: וְהוּא
  choice: Doch er selbst
  rationale: Das Waw ist im Kontext adversativ. »Doch« markiert den Gegensatz zum göttlichen Auftrag des vorherigen Verses; »selbst« hebt die eigene Sicht des Königs hervor, ohne sie auszudeuten.
theological_decisions:
- issue: Verhältnis zwischen Gottes Absicht und der Absicht Assyriens
  choice: Der Vers stellt die abweichende Vorstellung und zerstörerische Absicht des assyrischen Königs dar, ohne Gottes Absicht ausdrücklich zu erläutern.
  alternative: Explizit ergänzen, dass der König Gottes Absicht nicht versteht.
  rationale: Der Zusammenhang legt den Gegensatz nahe, doch der hebräische Vers benennt nur, dass der König es nicht so auffasst und in seinem Herzen Vernichtung plant. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hebräische Herz-Begriff und die Litotes »nicht wenige« bleiben erhalten; die beiden Verben des Denkens werden im Deutschen leicht differenziert.
