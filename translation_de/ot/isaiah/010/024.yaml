id: ISA.10.24
reference: Isaiah 10:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: de
  text: 'Darum, so spricht der Herr, Jahwe der Heerscharen: Fürchte dich nicht, mein Volk, das in Zion wohnt, vor Assur! Mit dem Stock wird es dich schlagen und seinen Stab gegen dich erheben, nach der Art Ägyptens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „auf dem Weg Ägyptens“; auch möglich: „auf dem Weg nach Ägypten“. Wahrscheinlich wird auf Ägyptens frühere Unterdrückung Israels angespielt.'
    reason: Bewahrt die Mehrdeutigkeit der hebräischen Wendung בְּדֶרֶךְ מִצְרָיִם und erklärt knapp die im Haupttext gewählte Deutung.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im Deutschen natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in idiomatischem deutschem Präsens.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  rationale: Gibt אֲדֹנָי als Titel „Herr“, den Gottesnamen ausdrücklich als „Jahwe“ und צְבָאוֹת formal als „Heerscharen“ wieder.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Entspricht der direkten Anrede im Singular und bewahrt den knappen, seelsorgerlichen Zuspruch.
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: mein Volk, das in Zion wohnt
  rationale: Der formal singularische Partizipialausdruck wird als kollektive Bezeichnung des Volkes verstanden; der deutsche Relativsatz erhält die singularische Anrede.
- source_word: מֵאַשּׁוּר
  choice: vor Assur
  rationale: Nach dem Verb des Fürchtens bezeichnet מִן den Gegenstand der Furcht; „vor Assur“ ist präzise und idiomatisch.
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: Mit dem Stock wird es dich schlagen
  rationale: Das instrumentale ב wird mit „mit“ wiedergegeben; „Stock“ bewahrt sowohl die konkrete als auch die herrschaftlich-bedrückende Bildwirkung.
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: und seinen Stab gegen dich erheben
  rationale: Gibt das drohende Erheben beziehungsweise Schwingen des Stabes gegen das Volk anschaulich wieder.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: nach der Art Ägyptens
  rationale: Versteht דֶּרֶךְ idiomatisch als Art und Weise und lässt so den wahrscheinlichen Rückbezug auf Ägyptens frühere Unterdrückung Israels anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: der Herr HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom ausdrücklich im Text stehenden Bundesnamen יהוה, ohne beide zu einem einzigen Titel zu verschmelzen.
- issue: Historischer Bezug von בְּדֶרֶךְ מִצְרָיִם
  choice: nach der Art Ägyptens
  alternative: auf dem Weg nach Ägypten
  rationale: Die Lesart als Vergleich mit Ägyptens Unterdrückung passt am besten zum Zusammenhang; die mögliche räumliche Deutung wird wegen der echten sprachlichen Mehrdeutigkeit in der Fußnote erhalten.
- issue: Referent des unausgedrückten Subjekts bei יַכֶּכָּה
  choice: es, bezogen auf Assur
  alternative: er, bezogen auf den assyrischen Herrscher
  rationale: Der unmittelbar zuvor genannte Name Assur ist grammatisch und kontextuell der naheliegende Referent. Das sächliche Pronomen entspricht dem deutschen Genus des Landesnamens, ohne einen einzelnen Herrscher in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel. Die singularische Anrede des kollektiv verstandenen Volkes bleibt erhalten; „Assur“ folgt der traditionellen deutschen Form des Ländernamens.
