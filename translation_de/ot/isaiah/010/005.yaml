  text: ה֥וֹי אַשּׁ֖וּר שֵׁ֣בֶט אַפִּ֑/י וּ/מַטֶּה ה֥וּא בְ/יָדָ֖/ם זַעְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: de
  text: Wehe, Assur, du Rute meines Zorns! Der Stab in ihrer Hand[a] ist mein Grimm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihrer Hand“. Das hebräische Wort für „Hand“ steht im Singular, das Possessivsuffix jedoch im Plural und bezieht sich auf Assur als kollektive Größe, die Assyrer.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion leitet hier einen prophetischen Droh- und Gerichtsruf ein; „Wehe“ bewahrt seine eindringliche Kraft.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: „Assur“ ist im Deutschen die geläufige biblische Bezeichnung für das assyrische Reich beziehungsweise dessen Volk.
- source_word: שֵׁבֶט
  choice: Rute
  rationale: Gemeint ist ein Schlaginstrument und bildlich ein Werkzeug des Gerichts; „Rute“ erhält dieses Bild und steht passend neben „Stab“.
- source_word: אַפִּי
  choice: meines Zorns
  rationale: Das wörtlich körperbezogene hebräische Wort bezeichnet idiomatisch Zorn; die Genitivfügung gibt die instrumentale Metapher knapp wieder.
- source_word: מַטֶּה
  choice: Stab
  rationale: „Stab“ ist die natürliche Entsprechung und bewahrt den poetischen Parallelismus mit „Rute“.
- source_word: בְיָדָם
  choice: in ihrer Hand
  rationale: Die Übersetzung erhält sowohl das singularische Substantiv „Hand“ als auch das pluralische Possessivsuffix „ihr-“ des masoretischen Textes.
- source_word: זַעְמִי
  choice: mein Grimm
  rationale: „Grimm“ bezeichnet heftigen, strafenden Zorn und unterscheidet den Ausdruck im Parallelismus von אַף, ohne die Intensität abzuschwächen.
theological_decisions:
- issue: Assur als Werkzeug des göttlichen Gerichts
  choice: Assur wird ausdrücklich als Rute von Gottes Zorn dargestellt; der Stab in der Hand der Assyrer wird mit Gottes Grimm identifiziert.
  alternative: Assur lediglich als unabhängig oder zufällig handelnde Macht darzustellen.
  rationale: Die Metaphern des hebräischen Textes stellen eine unmittelbare instrumentale Beziehung her. Die Übersetzung bewahrt diese Spannung, ohne daraus weitergehende Aussagen über Verantwortung oder Vorsehung abzuleiten.
- issue: Numeruswechsel bei „in ihrer Hand“
  choice: Der pluralische Bezug des Suffixes wird trotz der singularischen Bezeichnung Assur beibehalten.
  alternative: „in seiner Hand“ zur Angleichung an das singularisch aufgefasste Assur.
  rationale: Der masoretische Text hat eindeutig ein Suffix der 3. Person Plural. Eine Angleichung würde die echte grammatische Spannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdevolles prophetisches Deutsch. Der traditionelle Gerichtsbegriff „Wehe“ und das kräftige Wort „Grimm“ erhalten die poetische Schärfe; die ungewöhnliche Numerusspannung des Hebräischen wird im Text bewahrt und in der Fußnote knapp erläutert.
