  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: de
  text: 'Denn er sagt: „Sind meine Befehlshaber nicht allesamt Könige?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sind meine Fürsten nicht alle Könige?“ Das hebräische Wort kann Fürsten, Herrscher, Amtsträger oder Befehlshaber bezeichnen; „allesamt“ gibt ein Wort wieder, das wörtlich „zusammen“ bedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung beziehungsweise Erläuterung zur vorausgehenden Aussage ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: יֹאמַר
  choice: er sagt
  rationale: Das Imperfekt führt hier im prophetischen Redekontext die prahlerische Äußerung des assyrischen Königs ein. Das Präsens ist im Deutschen idiomatisch; „er wird sagen“ bleibt grammatisch möglich.
- source_word: הֲלֹא
  choice: Sind … nicht
  rationale: Die Verbindung bildet eine rhetorische Frage, die eine bejahende Antwort erwartet. Die deutsche Form bewahrt diese rhetorische Struktur.
- source_word: שָׂרַי
  choice: meine Befehlshaber
  rationale: שַׂר kann Fürst, Herrscher, Amtsträger oder Befehlshaber bezeichnen. Im assyrischen Macht- und Eroberungskontext bezeichnet „Befehlshaber“ plausibel die hochrangigen militärisch-politischen Untergebenen, ohne eine erbliche Fürstenstellung vorauszusetzen.
- source_word: יַחְדָּו
  choice: allesamt
  rationale: Wörtlich bedeutet das Wort „zusammen“; hier unterstreicht es kollektiv, dass sämtliche Befehlshaber Königen gleichstehen. „Allesamt“ bewahrt diesen Nachdruck in natürlichem Deutsch.
- source_word: מְלָכִים
  choice: Könige
  rationale: Das Substantiv bedeutet unmittelbar „Könige“ und trägt die Überheblichkeit der Behauptung, die Untergebenen des assyrischen Königs seien selbst von königlichem Rang.
theological_decisions: []
