source:
  edition: WLC
  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: de
  text: Und Jahwe wird dich beständig führen und dich in dürren Gegenden sättigen[a] und deine Gebeine kräftigen[b]. Du wirst sein wie ein gut bewässerter Garten und wie eine Wasserquelle, deren Wasser nicht versiegen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine Seele in dürren Gegenden sättigen“. Das hebräische Wort für „Seele“ kann hier auch die ganze Person oder ihr Verlangen bezeichnen.'
    reason: Bewahrt die Bedeutungsbreite von נֶפֶשׁ und die wörtliche Satzgestalt.
  - marker: b
    text: 'Oder: „deine Gebeine erfrischen“. Das hier verwendete hebräische Verb ist selten und kann Stärkung oder Belebung ausdrücken.'
    reason: Lexikalische Unsicherheit des Verbs חלץ.
  - marker: c
    text: 'Wörtlich: „deren Wasser nicht lügen“, das heißt: nicht ausbleiben oder enttäuschen.'
    reason: Der Haupttext gibt das hebräische Bild idiomatisch wieder; die Fußnote bewahrt seine konkrete Ausdrucksweise.
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: wird dich … führen
  rationale: Das Verb נחה bezeichnet hier Gottes fortdauerndes Leiten; „führen“ ist natürlich und wahrt die Bildsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תָּמִיד
  choice: beständig
  rationale: Bezeichnet ein fortdauerndes, verlässliches Handeln und klingt im Deutschen würdig und natürlich.
- source_word: וְהִשְׂבִּיעַ בְּצַחְצָחוֹת נַפְשֶׁךָ
  choice: dich selbst in dürren Gegenden sättigen
  rationale: נפש meint hier die bedürftige Person bzw. ihr inneres Leben. „Dich selbst“ ist im modernen Deutsch natürlicher als „deine Seele“, ohne den ganzheitlichen Sinn auf das bloß Körperliche einzuengen. צחצחות bezeichnet ausgedörrte, dürre Verhältnisse oder Gegenden.
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: deine Gebeine kräftigen
  rationale: Das seltene Verb חלץ ist an dieser Stelle unsicher, bezeichnet im Zusammenhang aber wahrscheinlich Stärkung oder Belebung. „Gebeine“ erhält das konkrete poetische Körperbild.
- source_word: כְּגַן רָוֶה
  choice: wie ein gut bewässerter Garten
  rationale: רוה beschreibt reichliche Bewässerung oder Durchtränkung; die Formulierung gibt das Fruchtbarkeitsbild klar wieder.
- source_word: וּכְמוֹצָא מַיִם
  choice: wie eine Wasserquelle
  rationale: מוצא bezeichnet einen Ausgang oder Ursprungsort von Wasser; „Wasserquelle“ ist die natürliche deutsche Entsprechung.
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: deren Wasser nie versiegen
  rationale: כזב bedeutet wörtlich „lügen“ oder „sich als unzuverlässig erweisen“. Von Wasser gesagt meint es idiomatisch, dass es nicht ausbleibt oder versiegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: dich selbst
  alternative: deine Seele
  rationale: נפש kann Seele, Leben, Verlangen oder die ganze Person bezeichnen. Im Zusammenhang des Sättigens ist eine ganzheitliche personale Wiedergabe im Deutschen am verständlichsten, ohne eine strikte Trennung von Leib und Seele einzutragen.
- issue: Bedeutung von יַחֲלִיץ
  choice: kräftigen
  alternative: erfrischen
  rationale: Das ungewöhnliche Verb lässt sowohl Stärkung als auch Belebung anklingen. Der Haupttext wählt „kräftigen“; die echte lexikalische Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-poetischem Klang. Die parallelen Verheißungen und die Bilder von Dürre, Garten und Quelle bleiben erhalten. „Gebeine“ ist bewusst leicht gehoben, weil es die körperlich-poetische Konkretheit des Hebräischen besser wahrt als das alltägliche „Knochen“.
