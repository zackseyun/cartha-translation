base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: de
  text: Dann wird dein Licht hervorbrechen wie die Morgenröte, und deine Heilung[a] wird rasch hervorsprießen. Deine Gerechtigkeit[b] wird vor dir hergehen, und die Herrlichkeit Jahwes wird dich von hinten her schützen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Genesung“ oder „deine Wiederherstellung“.'
    reason: lexical_alternative
  - marker: b
    text: „Gerechtigkeit“ kann hier auch Rechtschaffenheit, Recht oder erwiesenes Recht bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „wird dich sammeln“. Im Zusammenhang mit dem Vorausgehen der Gerechtigkeit kann dies den Schutz von hinten beziehungsweise das Abschließen des Zuges bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: wird hervorbrechen
  rationale: Das Nifal von בקע bezeichnet ein Aufbrechen oder Hervorbrechen; zusammen mit dem Licht und der Morgenröte bewahrt „hervorbrechen“ das lebendige Bild natürlich.
- source_word: כַּשַּׁחַר
  choice: wie die Morgenröte
  rationale: שׁחר bezeichnet die Morgendämmerung bzw. den Tagesanbruch; „Morgenröte“ ist bildhaft, verständlich und würdevoll.
- source_word: אוֹרֶךָ
  choice: dein Licht
  rationale: Die direkte Bedeutung und das Possessivsuffix werden beibehalten.
- source_word: אֲרֻכָתְךָ
  choice: deine Heilung
  rationale: אֲרֻכָה kann Heilung, Genesung oder Wiederherstellung bezeichnen. „Heilung“ passt zum Bild und lässt den umfassenderen prophetischen Sinn offen.
- source_word: מְהֵרָה
  choice: rasch
  rationale: Das Adverb bezeichnet Schnelligkeit; „rasch“ ist knapp und idiomatisch.
- source_word: תִצְמָח
  choice: wird hervorsprießen
  rationale: צמח bezeichnet das Sprießen oder Wachsen. „Hervorsprießen“ bewahrt die organische Metapher auch bei der abstrakten Heilung.
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: wird vor dir hergehen
  rationale: Die Wendung bedeutet, jemandem vorauszugehen; die deutsche Form erhält sowohl Bewegung als auch mögliche Schutz- oder Führungsfunktion.
- source_word: צִדְקֶךָ
  choice: deine Gerechtigkeit
  rationale: צדק umfasst Gerechtigkeit, Rechtschaffenheit und gegebenenfalls Rechtfertigung. „Gerechtigkeit“ bewahrt die moralische und soziale Bedeutungsbreite am besten.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Die Genitivverbindung wird natürlich wiedergegeben; כבוד wird mit „Herrlichkeit“ übersetzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: יַאַסְפֶךָ
  choice: wird dich von hinten sammeln
  rationale: אסף bedeutet grundlegend „sammeln“. Der Zusatz „von hinten“ macht im Parallelismus mit dem Vorausgehen die räumliche Schutzfunktion deutlich, ohne sie vollständig in den militärischen Ausdruck „Nachhut“ umzudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen unmittelbar. „Jahwe“ bewahrt seinen Charakter als persönlichen Namen.
- issue: Bedeutungsumfang von צִדְקֶךָ
  choice: deine Gerechtigkeit
  alternative: dein Recht / deine Rechtschaffenheit
  rationale: Der Kontext sozialer Gerechtigkeit ist wichtig, doch das Wort kann zugleich persönliche Rechtschaffenheit und erwiesenes Recht bezeichnen. „Gerechtigkeit“ vermeidet eine unnötige Verengung.
- issue: Funktion von יַאַסְפֶךָ
  choice: wird dich von hinten sammeln
  alternative: wird deine Nachhut sein
  rationale: Die traditionelle funktionale Deutung als Schutz der Nachhut ist im Kontext plausibel. Der Haupttext erhält jedoch den lexikalischen Kern „sammeln“ und lässt die ungewöhnliche Bildspannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichem prophetischem Parallelismus. Die ungewöhnliche Sammelmetapher im Schlussglied bleibt im Haupttext sichtbar; eine flüssigere funktionale Deutung steht in der Fußnote.
