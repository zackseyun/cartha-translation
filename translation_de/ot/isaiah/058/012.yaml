base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: de
  text: 'Menschen aus deiner Mitte werden die uralten Ruinen wieder aufbauen; du wirst die Fundamente vieler Generationen wieder aufrichten[a]. Man wird dich nennen: »der die Bresche schließt«, »der Wege wiederherstellt, damit man dort wohnen kann«[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Fundamente von Generation und Generation“; gemeint sein können Fundamente aus vielen aufeinanderfolgenden Generationen oder sehr alte Fundamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „der Wege zum Wohnen wiederherstellt“ oder „der Straßen zur Wiederbesiedlung wiederherstellt“. Die knappe hebräische Formulierung lässt offen, ob sich „zum Wohnen“ unmittelbar auf die Wege oder auf die dadurch wieder bewohnbar werdenden Orte bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: Menschen aus deiner Mitte werden … wieder aufbauen
  rationale: מִמְּךָ bezeichnet hier Menschen, die aus der angesprochenen Gemeinschaft hervorgehen. „Wieder aufbauen“ entspricht dem Wiederherstellungskontext besser als das unmarkierte „bauen“.
- source_word: חָרְבוֹת עוֹלָם
  choice: die uralten Trümmer
  rationale: חָרְבוֹת bezeichnet zerstörte oder verwüstete Orte; עוֹלָם verweist hier auf ihr langes Bestehen seit alter Zeit. „Uralte Trümmer“ ist anschaulich und idiomatisch.
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: die Fundamente vieler Generationen
  rationale: מוֹסְדֵי bedeutet „Fundamente“. Die Wiederholung דוֹר וָדוֹר bezeichnet eine Folge von Generationen; die deutsche Fassung gibt dies natürlich wieder, während die Fußnote die hebräische Form sichtbar macht.
- source_word: תְּקוֹמֵם
  choice: du wirst … wieder aufrichten
  rationale: Die kausative Form von קום vermittelt das Bild, etwas erneut zum Stehen zu bringen. Das ergänzte „wieder“ ergibt sich aus dem Zusammenhang zerstörter Bauten.
- source_word: וְקֹרָא לְךָ
  choice: Man wird dich nennen
  rationale: Die unpersönliche dritte Person Singular wird im Deutschen natürlich mit „man“ wiedergegeben und leitet die beiden Ehrenbezeichnungen ein.
- source_word: גֹּדֵר פֶּרֶץ
  choice: der die Bresche schließt
  rationale: גדר bezeichnet das Zumauern oder Sichern einer Lücke, פֶּרֶץ einen Durchbruch beziehungsweise eine Bresche. Die verbale Formulierung ist im modernen Deutsch natürlicher als ein künstliches Substantiv wie „Breschenschließer“.
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: der Wege wiederherstellt
  rationale: Das Partizip von שוב hat hier einen kausativ-restaurativen Sinn; נְתִיבוֹת sind Wege oder Straßen. „Wiederherstellt“ wahrt die Parallele zur baulichen Erneuerung.
- source_word: לָשָׁבֶת
  choice: damit man dort wohnen kann
  rationale: Der Infinitiv bezeichnet Zweck oder Ergebnis. Das unbestimmte „dort“ macht im Deutschen verständlich, dass die wiederhergestellten Wege beziehungsweise die durch sie erschlossenen Orte erneut bewohnbar werden, ohne die genaue syntaktische Beziehung dogmatisch festzulegen.
