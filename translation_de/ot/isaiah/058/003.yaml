source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: de
  text: '„Warum haben wir gefastet[a], und du hast es nicht gesehen? Warum haben wir uns gedemütigt, und du hast es nicht beachtet?“ Seht: Am Tag eures Fastens geht ihr eurem eigenen Vergnügen nach[b] und treibt alle eure Arbeiter hart an[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum haben wir uns selbst geplagt?“ beziehungsweise „Warum haben wir uns etwas versagt?“ Wörtlich: „Warum haben wir unsere Seele geplagt?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „findet ihr Gefallen“, „sucht ihr, was ihr begehrt“; möglicherweise auch: „geht ihr euren eigenen Geschäften nach“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unterdrückt ihr alle eure Arbeiter“; möglicherweise auch: „fordert ihr all eure Arbeitsleistungen ein“. Das Hebräische kann sich auf die Arbeitenden oder auf die von ihnen verlangte Arbeit beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Leitet die unmittelbare Klage des Volkes als Frage ein.
- source_word: צַּמְנוּ
  choice: haben wir gefastet
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung, deren vermeintlich ausbleibende Wirkung gegenwärtig beklagt wird.
- source_word: רָאִיתָ
  choice: hast es nicht gesehen
  rationale: Bewahrt das konkrete Verb ראה; das Pronomen nimmt das Fasten idiomatisch wieder auf.
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: haben wir uns gedemütigt
  rationale: Gibt den idiomatischen Ausdruck für rituelle Selbsterniedrigung beziehungsweise Selbstentbehrung verständlich wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: תֵדָע
  choice: hast es nicht beachtet
  rationale: Im Parallelismus zu »gesehen« geht es nicht um bloßes Wissen, sondern darum, dass Gott dem Tun keine Beachtung schenkt.
- source_word: הֵן
  choice: Seht
  rationale: Markiert nachdrücklich den Übergang von der Klage zur göttlichen Entgegnung in natürlichem, würdigem Deutsch.
- source_word: בְּיוֹם צֹמְכֶם
  choice: Am Tag eures Fastens
  rationale: Bewahrt die ausdrückliche Zeitangabe und die hebräische Nominalkonstruktion.
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: geht ihr eurem eigenen Vergnügen nach
  rationale: Gibt die kontextuelle Bedeutung selbstbezogenen Begehrens oder Betreibens wieder, ohne das mehrdeutige חֵפֶץ auf eine einzige Nuance zu verengen; Alternativen werden in der Fußnote genannt.
- source_word: עַצְּבֵיכֶם
  choice: eure Arbeiter
  rationale: Im Zusammenhang mit נגשׂ bezeichnet das Wort wahrscheinlich die Menschen, deren Arbeit eingefordert wird; die sachbezogene Deutung bleibt in der Fußnote erhalten.
- source_word: תִּנְגֹּשׂוּ
  choice: treibt ... hart an
  rationale: Vermittelt den Zwangs- und Ausbeutungsaspekt von נגשׂ in geläufigem Deutsch, ohne zwingend eine bestimmte rechtliche Form der Unterdrückung festzulegen.
theological_decisions:
- issue: Deutung der sozialen Anklage im zweiten Halbvers
  choice: Das Fasten wird verurteilt, weil es mit selbstbezogenem Handeln und der harten Behandlung von Arbeitern einhergeht.
  alternative: Gemeint sein kann allgemeiner, dass die Fastenden ihren eigenen Geschäften nachgehen und sämtliche Arbeitsleistungen einfordern.
  rationale: Die Verbindung von חֵפֶץ und נגשׂ im Kontext stützt eine Kritik wirtschaftlicher Ausbeutung. Die Fußnoten bewahren jedoch die echte lexikalische Mehrdeutigkeit, ohne eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede des Volkes steht in Anführungszeichen; »Seht« leitet die göttliche Erwiderung ein. Die Formulierungen vermeiden Archaismen und erhalten zugleich Parallelismus, Vorwurfscharakter und soziale Schärfe des Hebräischen.
