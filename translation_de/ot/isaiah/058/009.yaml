  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: de
  text: 'Dann wirst du rufen, und Jahwe wird antworten. Du wirst um Hilfe schreien, und er wird sagen: »Hier bin ich.« Wenn du aus deiner Mitte das Joch[a], das Zeigen mit dem Finger[b] und böses Reden[c] entfernst,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Joch« ist hier ein Bild für bedrückende Behandlung oder Lasten, die anderen auferlegt werden.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »das Ausstrecken des Fingers«; wahrscheinlich ist eine anklagende oder verächtliche Geste gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »unheilvolles Reden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb bezeichnet hier die Folge der zuvor genannten Bedingungen; »Dann« ist knapp und natürlich.
- source_word: תִּקְרָא
  choice: wirst du rufen
  rationale: קרא steht im Gebetszusammenhang und bildet die Entsprechung zu Jahwes Antwort.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: יַעֲנֶה
  choice: wird antworten
  rationale: ענה bezeichnet hier unmittelbar Gottes Antwort auf den Ruf.
- source_word: תְּשַׁוַּע
  choice: Du wirst um Hilfe schreien
  rationale: Das Piel von שׁוע bezeichnet einen dringlichen Hilferuf; die Formulierung macht diesen Bedeutungsaspekt deutlich.
- source_word: הִנֵּנִי
  choice: Hier bin ich
  rationale: Die idiomatische Antwort drückt Gegenwart und Bereitschaft aus und klingt zugleich natürlich und würdig.
- source_word: אִם תָּסִיר
  choice: Wenn du … entfernst
  rationale: אִם leitet eine echte Bedingung ein; das Hiphil von סור bezeichnet das Beseitigen der folgenden Missstände.
- source_word: מִתּוֹכְךָ
  choice: aus deiner Mitte
  rationale: 'Die Wendung bewahrt den gemeinschaftlichen Bezug: Die angesprochenen Praktiken sollen aus der Gemeinschaft verschwinden.'
- source_word: מוֹטָה
  choice: das Joch
  rationale: Das konkrete Bild eines Jochs beziehungsweise Jochbalkens bleibt erhalten und bezeichnet im Zusammenhang bedrückende Behandlung.
- source_word: שְׁלַח אֶצְבַּע
  choice: das Fingerzeigen
  rationale: Die wörtliche Vorstellung des Ausstreckens eines Fingers bezeichnet wahrscheinlich eine anklagende oder verächtliche Geste.
- source_word: דַבֶּר אָוֶן
  choice: böswilliges Reden
  rationale: אָוֶן kann Unheil, Bosheit oder Falschheit bezeichnen; »böswilliges Reden« gibt den negativen moralischen und schädigenden Charakter wieder, ohne ihn auf Unwahrheit allein festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; »Jahwe« erhält dessen Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedingungsgefüge der Verheißung
  choice: Wenn du … entfernst
  alternative: Wenn ihr … entfernt
  rationale: Die hebräischen Verb- und Pronominalformen stehen im maskulinen Singular. Dieser kann Israel beziehungsweise die Gemeinschaft kollektiv anreden; die Übersetzung bewahrt die grammatische Form, ohne den kollektiven Bezug auszuschließen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Der parallele Rhythmus von Rufen, Antworten und Hilfeschrei bleibt erhalten. Die konkreten sozialen Bilder werden nicht vorschnell abstrahiert; erklärungsbedürftige Bedeutungsanteile stehen in Fußnoten.
