  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: de
  text: Dann wirst du deine Freude an Jahwe haben, und ich werde dich auf den Höhen der Erde reiten lassen[a]. Ich werde dich mit dem Erbteil deines Vaters Jakob speisen[b], denn der Mund Jahwes hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „auf den Höhen des Landes“.'
    reason: lexical_alternative
  - marker: b
    text: „Dein Vater Jakob“ ist familiäre Bundessprache; Jakob ist der Stammvater des Volkes.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: an Jahwe deine Freude haben
  rationale: Das Hitpael von ענג bezeichnet genussvolle, tiefe Freude. Die Wendung mit עַל richtet diese Freude auf Jahwe; die deutsche Formulierung bewahrt sowohl den persönlichen Bezug als auch den reflexiven Sinn, ohne gekünstelt zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen Standarddeutsch als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: וְהִרְכַּבְתִּיךָ
  choice: ich werde dich … einherfahren lassen
  rationale: 'Der Hifil von רכב ist kausativ: jemanden fahren beziehungsweise reiten lassen. „Einherfahren lassen“ erhält diese Kausativität und passt zum poetischen Bild der Höhen.'
- source_word: בָּמוֹתֵי אָרֶץ
  choice: auf den Höhen der Erde
  rationale: במות bezeichnet hier Höhen oder hoch gelegene Orte. Die Übersetzung bewahrt das offene Bild von Erhöhung, Sicherheit oder Segen, ohne es auf Eroberung, Geografie oder kultische Höhen festzulegen.
- source_word: וְהַאֲכַלְתִּיךָ
  choice: ich werde dich … essen lassen
  rationale: Der Hifil von אכל bedeutet wörtlich „essen lassen“ beziehungsweise „speisen“. Die gewählte Form erhält das konkrete Bild des Genießens einer von Gott gewährten Erbschaft.
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: vom Erbteil deines Vaters Jakob
  rationale: נחלה wird als „Erbteil“ wiedergegeben, was den Land- und Bundesbezug offenhält. „Dein Vater Jakob“ bewahrt die familiäre Bundessprache des Hebräischen.
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: denn der Mund Jahwes hat gesprochen
  rationale: Die ausdrückliche Formulierung „der Mund Jahwes“ bleibt als feierliche prophetische Bekräftigung erhalten; das Perfekt wird mit dem deutschen Perfekt wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen direkt. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen und entspricht der üblichen wissenschaftlichen Wiedergabe im Deutschen.
- issue: Deutung der „Höhen der Erde“
  choice: Das poetische Bild wird ohne nähere Festlegung beibehalten.
  alternative: Siegreiche Herrschaft über das Land; Wohlstand im Land; kultische Höhen
  rationale: Die Wendung kann Erhöhung, Sicherheit, Sieg oder Segensfülle anklingen lassen. Der Vers legt keine einzige dieser Deutungen eindeutig fest, daher wird die theologische und poetische Mehrdeutigkeit gewahrt.
- issue: Das Erbteil Jakobs als Nahrung
  choice: Das konkrete Bild „vom Erbteil … essen lassen“ bleibt erhalten.
  alternative: Mit dem Erbteil speisen; das Erbteil genießen lassen
  rationale: Der Text verbindet das Erbteil mit dem kausativen Verb „essen lassen“. Eine allzu abstrakte Wiedergabe würde das Bild glätten; die gewählte Form bewahrt sowohl gewährten Genuss als auch Bundeserbe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzbau. Die direkte Anrede steht wie im Hebräischen im Singular. Bildhafte und feierliche Formulierungen wie „Höhen der Erde“, „Erbteil“ und „der Mund Jahwes“ werden bewusst nicht eingeebnet.
