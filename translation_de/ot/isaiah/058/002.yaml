  variant: modern standard German
source:
  edition: WLC
  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: de
  text: Und doch suchen sie mich Tag für Tag und haben Gefallen daran, meine Wege zu kennen, als wären sie ein Volk, das Gerechtigkeit übt und das Recht seines Gottes nicht verlassen hat. Sie fragen mich nach gerechten Urteilen; an Gottes Nähe haben sie Gefallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie haben Gefallen daran, Gott nahezukommen; auch möglich: an der Annäherung an Gott. Die hebräische Wendung kann sowohl Gottes Nähe als auch die Annäherung an ihn bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוֹתִי
  choice: Und doch … mich
  rationale: Die Konjunktion leitet im Zusammenhang einen Gegensatz zur Anklage des vorigen Verses ein; „Und doch“ gibt diesen adversativen Sinn natürlich wieder.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wiederholung bildet eine distributive Wendung und bezeichnet ein fortwährendes beziehungsweise regelmäßiges Handeln.
- source_word: יִדְרֹשׁוּן
  choice: suchen sie
  rationale: דרשׁ bezeichnet hier das Suchen Gottes, möglicherweise auch im Sinn kultischer Befragung. „Suchen“ wahrt die Breite des Ausdrucks.
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: haben Gefallen daran, meine Wege zu kennen
  rationale: Die Formulierung bewahrt sowohl das Moment des Verlangens beziehungsweise Gefallens als auch das Erkennen der Wege Gottes.
- source_word: כְּגוֹי אֲשֶׁר
  choice: als wären sie ein Volk, das
  rationale: Der Vergleich ist im Kontext ironisch. Der Konjunktiv macht diese bereits angelegte Spannung im Deutschen verständlich.
- source_word: צְדָקָה עָשָׂה
  choice: Gerechtigkeit übt
  rationale: „Gerechtigkeit üben“ ist eine natürliche deutsche Wiedergabe des hebräischen Idioms „Gerechtigkeit tun“ und erhält dessen ethischen Sinn.
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: das Recht seines Gottes nicht verlassen hat
  rationale: מִשְׁפָּט kann Recht, Rechtsspruch oder gerechte Ordnung bezeichnen. „Das Recht seines Gottes“ wahrt diese rechtlich-ethische Weite.
- source_word: יִשְׁאָלוּנִי
  choice: Sie fragen mich nach
  rationale: Das Verb bezeichnet Fragen oder Erkundigen. Die deutsche Konstruktion passt zur folgenden Sache, nach der gefragt wird.
- source_word: מִשְׁפְּטֵי צֶדֶק
  choice: gerechten Urteilen
  rationale: Die Verbindung bezeichnet Urteile oder Entscheidungen, die der Gerechtigkeit entsprechen; „gerechte Urteile“ ist präzise und verständlich.
- source_word: קִרְבַת אֱלֹהִים
  choice: Gottes Nähe
  rationale: קִרְבָה kann sowohl Nähe als auch Annäherung bezeichnen. „Gottes Nähe“ erhält die nominale Form; die ebenso mögliche Deutung als Annäherung an Gott wird in der Fußnote genannt.
- source_word: יֶחְפָּצוּן
  choice: haben sie Gefallen
  rationale: חפץ umfasst Gefallen, Freude und Verlangen. Die wiederkehrende Wendung verbindet beide Vorkommen im Vers sprachlich.
theological_decisions:
- issue: Ironischer Sinn des Vergleichs
  choice: „als wären sie ein Volk“
  alternative: „wie ein Volk“
  rationale: Der prophetische Zusammenhang entlarvt den Gegensatz zwischen religiösem Auftreten und tatsächlichem Handeln. Der Konjunktiv macht die Ironie sichtbar, ohne eine zusätzliche Lehraussage einzutragen.
- issue: Bedeutung von קִרְבַת אֱלֹהִים
  choice: „Gottes Nähe“ im Haupttext
  alternative: „Gott nahezukommen“ beziehungsweise „die Annäherung an Gott“
  rationale: Die hebräische Verbindung lässt sowohl Gottes Nähe als auch den Vollzug der Annäherung an Gott zu. Der Haupttext bewahrt die substantivische Lesart; die Fußnote hält die echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „haben Gefallen“ bildet die beiden Vorkommen von חפץ ab; der Satz bleibt verständlich, ohne die prophetische Ironie oder die Mehrdeutigkeit der Schlusswendung einzuebnen.
