review_pass:
  verdict: revise
  source_fidelity: 'Der erste Satz gibt die drei Zweckangaben und die gewalttätige Wendung zutreffend wieder. Im Schlusssatz ist „heute nicht so“ jedoch syntaktisch und semantisch missverständlich: Es kann besagen, dass sie ausgerechnet heute nicht in dieser Weise fasten. Das hebräische כיום bezeichnet hier die gegenwärtige Art ihres Fastens im Kontrast zu einem Fasten, das die Stimme „in der Höhe“ hörbar werden lässt. Die Revision macht diesen Kontrast klar, ohne „in der Höhe“ theologisch zu präzisieren.'
  naturalness: „Seht“ und die direkte Anrede sind modernes, würdiges Deutsch. „Mit boshafter Faust“ ist verständlich, aber „mit böser Faust“ ist die idiomatischere und weniger psychologisierende Wiedergabe der hebräischen Genitivverbindung. „Gehör finden“ ist eine natürliche deutsche Entsprechung zu „die Stimme hören lassen“.
  terminology: „Fasten“, „Stimme“ und „in der Höhe“ bewahren die Terminologie und die absichtliche Offenheit des hebräischen Textes. Die Fußnote zu „in der Höhe“ soll die Anredeperspektive mit „eure Stimme“ beibehalten.
  issues:
