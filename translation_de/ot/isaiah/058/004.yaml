base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: de
  text: Seht, ihr fastet, um zu streiten und zu zanken und mit böser Faust zuzuschlagen.[a] Ihr fastet jetzt nicht so, dass eure Stimme in der Höhe[b] Gehör findet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit einer Faust der Bosheit“.'
    reason: lexical_alternative
  - marker: b
    text: „In der Höhe“ kann den himmlischen Bereich meinen, also dass eure Stimme vor Gott gehört wird.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Konfrontation ein. „Seht“ ist gegenwärtig, verständlich und an die angesprochene Mehrzahl angepasst.
- source_word: לְרִיב וּמַצָּה
  choice: um zu streiten und zu zanken
  rationale: Die beiden eng verwandten Begriffe bezeichnen Streit, Auseinandersetzung und Zank. Die verbale Wiedergabe klingt im Deutschen natürlich und bewahrt die Parallelität.
- source_word: תָּצוּמוּ
  choice: ihr fastet
  rationale: Das Imperfekt der zweiten Person Plural beschreibt im Zusammenhang das gegenwärtige beziehungsweise wiederholte Verhalten der Angesprochenen.
- source_word: וּלְהַכּוֹת
  choice: und … zuzuschlagen
  rationale: Der Infinitiv bezeichnet Zweck oder Folge ihres Fastens; „zuzuschlagen“ gibt die körperliche Gewalttätigkeit idiomatisch und kraftvoll wieder.
- source_word: בְּאֶגְרֹף רֶשַׁע
  choice: mit boshafter Faust
  rationale: Die Wendung verbindet den Faustschlag mit moralischer Verwerflichkeit. „Mit boshafter Faust“ ist natürliches Deutsch; die formnähere Wiedergabe steht in der Fußnote.
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: Ihr fastet heute nicht so
  rationale: Die Formulierung bewahrt sowohl den zeitlichen Bezug von כַיּוֹם auf das gegenwärtige Fasten als auch den Gedanken, dass diese Art des Fastens ihr erklärtes Ziel nicht erreicht.
- source_word: לְהַשְׁמִיעַ … קוֹלְכֶם
  choice: dass eure Stimme … zu hören wäre
  rationale: Der Hifil-Infinitiv bedeutet, die eigene Stimme hörbar zu machen. Die deutsche Ergebniskonstruktion gibt den Zusammenhang mit der Verneinung natürlich wieder.
- source_word: בַּמָּרוֹם
  choice: in der Höhe
  rationale: Die räumliche Wendung bleibt bewusst erhalten und wird nicht ausdrücklich mit „im Himmel“ oder „bei Gott“ gleichgesetzt.
theological_decisions:
- issue: Bezug von „in der Höhe“
  choice: Die räumliche Formulierung „in der Höhe“ bleibt im Haupttext stehen.
  alternative: „im Himmel“ oder „vor Gott“
  rationale: Der hebräische Text legt nahe, dass Gott die Stimme hören soll, nennt ihn an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese implizite Aussage, ohne sie zu verdeutlichen.
- issue: Wirkung des verkehrten Fastens
  choice: „Ihr fastet heute nicht so, dass eure Stimme … zu hören wäre“
  alternative: „Fastet nicht wie heute, um eure Stimme … hören zu lassen“
  rationale: Die Aussage wird als prophetische Feststellung über die Wirkung ihres gegenwärtigen Fastens wiedergegeben, nicht eindeutig als neuer Imperativ. So bleibt die Spannung zwischen Absicht und ausbleibender Erhörung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die parallelen Verben „streiten“ und „zanken“ sind allgemein verständlich; die Schlusswendung bewahrt die räumliche und theologische Offenheit des Hebräischen.
