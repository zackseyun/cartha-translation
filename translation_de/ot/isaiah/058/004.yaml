  to: Seht, ihr fastet, um zu streiten und zu zanken und mit böser Faust zuzuschlagen.[a] Ihr fastet jetzt nicht so, dass eure Stimme in der Höhe[b] Gehör findet.
  rationale: 'Der Schlusssatz wird so umgestellt, dass die kontrastive Aussage von לא תצומו כיום klar bleibt: Ihr gegenwärtiges Fasten ist nicht von einer Art, durch die ihre Stimme in der Höhe Gehör findet. Die räumliche Wendung bleibt bewusst unaufgelöst. Außerdem wird die Gewaltmetapher idiomatischer formuliert und die Fußnote an die Anrede des Textes angeglichen.'
