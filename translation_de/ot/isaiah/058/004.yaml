    issue: Mehrdeutiger Schluss „Ihr fastet heute nicht so“
    rationale: Die Stellung von „heute“ kann den Sinn erzeugen, die Angesprochenen fasteten an diesem Tag nicht in der beschriebenen Weise. Gemeint ist die gegenwärtige beziehungsweise heutige Weise ihres Fastens, die nicht dazu führt, dass ihre Stimme in der Höhe Gehör findet.
  - severity: low
    issue: „boshafter Faust“ ist weniger idiomatisch
    rationale: „Boshafter“ charakterisiert im Deutschen eher eine Person oder Absicht. „Mit böser Faust“ ist eine geläufige, kräftige und dem moralisch qualifizierten hebräischen Ausdruck entsprechende Formulierung.
  - severity: low
    issue: Fußnote b wechselt von „eure“ zu „ihre“ Stimme
    rationale: Die Fußnote erläutert die direkte Anrede des Haupttexts und sollte deshalb deren Perspektive beibehalten.
