source:
  edition: WLC
  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: de
  text: Und wenn du dich selbst für den Hungrigen hingibst[a] und den Notleidenden sättigst[b], dann wird dein Licht in der Finsternis aufstrahlen und dein Dunkel wie der helle Mittag sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »deine Seele dem Hungrigen darreichst«. Das hebräische Wort für »Seele« kann hier das eigene Selbst oder Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die bedrückte Seele sättigst«. Mit »Seele« ist hier wahrscheinlich der ganze notleidende Mensch gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: wenn du dich selbst ... hingibst
  rationale: Die Verbindung des Hifil von פוק mit נֶפֶשׁ bezeichnet hier einen persönlichen, selbsthingebenden Einsatz. Die Wiedergabe ist im Deutschen natürlich und bewahrt mehr als nur das Geben einer Sache.
- source_word: לָרָעֵב
  choice: für den Hungrigen
  rationale: Das substantivierte Adjektiv bezeichnet einen hungrigen Menschen; ל markiert den Empfänger beziehungsweise Begünstigten.
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: den Notleidenden
  rationale: נֶפֶשׁ kann die ganze Person bezeichnen, und נַעֲנָה beschreibt einen bedrückten oder gebeugten Menschen. „Notleidenden“ vermittelt dies verständlich, ohne die Wendung auf eine immaterielle Seele zu verengen.
- source_word: תַּשְׂבִּיעַ
  choice: sättigst
  rationale: Das Hifil von שׂבע bedeutet, jemanden satt zu machen oder sein Bedürfnis zu stillen. Im Zusammenhang mit Hunger ist „sättigen“ konkret und idiomatisch.
- source_word: וְזָרַח
  choice: wird ... aufstrahlen
  rationale: Im konditionalen Zusammenhang hat die Verbform Ergebnis- beziehungsweise Zukunftsbedeutung. „Aufstrahlen“ bewahrt das Bild plötzlich hervortretenden Lichts.
- source_word: בַּחֹשֶׁךְ
  choice: in der Finsternis
  rationale: Die Ortsangabe und der deutliche Bildkontrast zum Licht werden direkt wiedergegeben.
- source_word: אוֹרֶךָ
  choice: dein Licht
  rationale: Die Lichtmetapher bleibt bewusst unaufgelöst.
- source_word: וַאֲפֵלָתְךָ
  choice: dein Dunkel
  rationale: אֲפֵלָה bezeichnet Dunkelheit beziehungsweise tiefes Dunkel. „Dunkel“ vermeidet eine unnötige identische Wiederholung von „Finsternis“ und erhält das poetische Bild.
- source_word: כַּצָּהֳרָיִם
  choice: wie der helle Mittag
  rationale: צָהֳרַיִם bezeichnet die Mittagszeit. Das ergänzte „helle“ macht im heutigen Deutsch den beabsichtigten Gegensatz zum Dunkel deutlich, ohne die Metapher aufzulösen.
theological_decisions:
- issue: Anthropologische Bedeutung des zweimaligen נֶפֶשׁ
  choice: Im ersten Satzteil „dich selbst“, im zweiten „den Notleidenden“, jeweils mit Fußnoten zur hebräischen Ausdrucksweise
  alternative: Beide Vorkommen einheitlich mit „Seele“ oder „Person“ wiedergeben
  rationale: נֶפֶשׁ bezeichnet hier den Menschen als lebendige Person beziehungsweise sein Selbst, nicht ausdrücklich einen vom Körper getrennten Teil. Die kontextuelle Wiedergabe wahrt die Aussage und vermeidet eine nicht vom Text verlangte anthropologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Konditionalstruktur. Die poetischen Gegensätze Licht/Finsternis und Dunkel/Mittag bleiben erhalten; schwer verständliche hebräische Wendungen werden im Haupttext natürlich und in den Fußnoten formnäher wiedergegeben.
