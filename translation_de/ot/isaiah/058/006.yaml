  terminology: „Fesseln des Unrechts“, „Joch“, „Unterdrückten“ und „wegzureißen“ sind tragfähige Entsprechungen. „Riemen“ bezeichnet im Deutschen die zum Joch gehörenden Bindungen präziser als „Bänder“, ohne das Bild zu verengen. Die Fußnoten sind inhaltlich angemessen; die kulturgeschichtliche Anmerkung wird sprachlich gestrafft.
