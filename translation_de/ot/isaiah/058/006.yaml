source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: de
  text: 'Ist dies nicht das Fasten, das ich erwähle: die Fesseln des Unrechts[a] zu lösen, die Riemen des Jochs zu lösen, die Unterdrückten[b] als Freie zu entlassen und jedes Joch wegzureißen?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Bosheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „die Zerschlagenen“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen wird „Joch“ zweimal genannt. Die Wiederholung unterstreicht das Bild der Unterdrückung als körperlicher Fessel, die beseitigt werden muss.
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  choice: Fasten
  rationale: Das Substantiv bezeichnet die religiöse Praxis; „das Fasten“ ist in dieser prädikativen Konstruktion natürlich und genau.
- source_word: אֶבְחָרֵהוּ
  choice: das ich erwähle
  rationale: בחר bedeutet „wählen, erwählen“. „Erwähle“ wahrt die bewusste göttliche Wahl und passt zum würdigen prophetischen Sprachregister.
- source_word: פַּתֵּחַ
  choice: zu lösen
  rationale: Mit Fesseln als Objekt gibt „lösen“ das konkrete Öffnen beziehungsweise Lockern einer Bindung idiomatisch wieder.
- source_word: חַרְצֻבּוֹת
  choice: Fesseln
  rationale: Das Wort bezeichnet Bindungen oder Fesseln. „Fesseln“ bewahrt das anschauliche Bild gewaltsamer Einschränkung, ohne eine Metallkette vorauszusetzen.
- source_word: רֶשַׁע
  choice: Unrecht
  rationale: „Unrecht“ vermittelt hier sowohl die moralische Verkehrtheit als auch den sozialen Zusammenhang der Unterdrückung; die Alternative „Bosheit“ wird in einer Fußnote bewahrt.
- source_word: הַתֵּר
  choice: aufzubinden
  rationale: Das Verb bezeichnet das Lösen oder Aufbinden. Die Wiedergabe erhält das konkrete Bild und unterscheidet sich sinnvoll vom vorherigen „lösen“.
- source_word: אֲגֻדּוֹת
  choice: Bänder
  rationale: Gemeint sind zusammenhaltende Bindungen oder Riemen; „Bänder“ passt zum Bild des Jochs und bleibt gegenüber „Fesseln“ lexikalisch unterscheidbar.
- source_word: מוֹטָה
  choice: Joch
  rationale: Das Wort bezeichnet ein Joch beziehungsweise eine Jochstange als Bild bedrückender Herrschaft. „Joch“ ist im Deutschen verständlich und bewahrt die Metapher.
- source_word: וְשַׁלַּח
  choice: zu entlassen
  rationale: שלח bedeutet grundsätzlich „senden, fortschicken“. Im Befreiungskontext gibt „entlassen“ das Freigeben aus einem Zwangsverhältnis natürlich wieder, ohne die Handlung zu abstrahieren.
- source_word: רְצוּצִים
  choice: die Unterdrückten
  rationale: Das passive Partizip von רצץ kann wörtlich die „Zerschlagenen“ bezeichnen. „Unterdrückte“ gibt den sozialen Sinn im Kontext idiomatisch wieder; die konkretere Alternative steht in einer Fußnote.
- source_word: חָפְשִׁים
  choice: als Freie
  rationale: Das Adjektiv beschreibt den neuen Status der Befreiten. „Als Freie“ erhält diesen prädikativen Charakter deutlicher als das bloße Adverb „frei“.
- source_word: תְּנַתֵּקוּ
  choice: wegzureißen
  rationale: נתק bezeichnet ein kraftvolles Abreißen, Losreißen oder Auseinanderbrechen. „Wegzureißen“ bewahrt die energische Beseitigung des bedrückenden Jochs.
theological_decisions:
- issue: Wesen des von Gott erwählten Fastens
  choice: Das Fasten wird durch konkrete Handlungen der Befreiung von Unrecht bestimmt.
  alternative: Das Fasten lediglich als innere Frömmigkeit oder allgemeine Freundlichkeit zu deuten.
  rationale: Die hebräischen Verbformen nennen greifbare Handlungen, durch die unterdrückende Bindungen beseitigt werden. Die Übersetzung lässt diesen sozialen und ethischen Anspruch stehen, ohne ihn von der religiösen Praxis zu trennen.
- issue: Bildsprache der Unterdrückung
  choice: Das zweimalige Bild des Jochs und die verschiedenen Bindungen werden konkret beibehalten.
  alternative: Die Bilder durch abstrakte Begriffe wie „Belastung“ oder „Unterdrückung“ zu ersetzen.
  rationale: Der Ausgangstext schildert Unrecht als körperliche Fesselung. Die konkrete Bildsprache trägt die prophetische Dringlichkeit und darf nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Die Infinitivreihe bildet den erklärenden Inhalt des erwählten Fastens ab. Konkrete Befreiungsbilder werden bewahrt, während seltene oder missverständliche deutsche Formulierungen vermieden werden.
