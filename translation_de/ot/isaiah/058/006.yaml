  source_fidelity: 'Die Grundstruktur und die Befreiungsbilder folgen dem Hebräischen gut: das von Gott erwählte Fasten wird durch vier konkrete Handlungen entfaltet, und die zweimalige Nennung des Jochs bleibt erhalten. „Unterdrückten“ ist für רְצוּצִים eine vertretbare kontextuelle Wiedergabe; die Fußnote wahrt die konkretere Bedeutung. Bei אֲגֻדּוֹת מוֹטָה ist „Bänder ... aufzubinden“ jedoch semantisch und idiomatisch weniger passend: Gemeint sind Bindungen bzw. Riemen des Jochs, die gelöst werden.'
