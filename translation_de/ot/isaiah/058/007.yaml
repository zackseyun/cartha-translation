  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: de
  text: Besteht es nicht darin, dein Brot mit dem Hungrigen zu teilen, obdachlose Arme[a] in dein Haus zu bringen, wenn du einen Nackten siehst, ihn zu bekleiden und dich deinem eigenen Fleisch[b] nicht zu entziehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann Arme bezeichnen, die umherirren, vertrieben wurden oder ohne Unterkunft sind.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „deinem Fleisch“. Gemeint sein können die eigenen Angehörigen; die Wendung kann darüber hinaus die Verbundenheit mit anderen Menschen anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס לָרָעֵב לַחְמֶךָ
  choice: dein Brot mit dem Hungrigen zu teilen
  rationale: פָרֹס bezeichnet das Teilen oder Brechen des Brotes. Im Deutschen gibt „Brot teilen“ die konkrete Handlung und ihren fürsorglichen Sinn natürlich wieder; לָרָעֵב bezeichnet den Empfänger.
- source_word: עֲנִיִּים מְרוּדִים
  choice: obdachlose Arme
  rationale: עֲנִיִּים bezeichnet Arme oder Bedrängte. Das seltene מְרוּדִים weist wahrscheinlich auf Menschen hin, die umherirren, vertrieben wurden oder ohne Unterkunft sind. „Obdachlose Arme“ ist im Zusammenhang verständlich, während die Fußnote die Unsicherheit offenlegt.
- source_word: תָּבִיא בָיִת
  choice: in dein Haus zu bringen
  rationale: Die Hifil-Form von בוא bezeichnet das Hineinbringen; בָיִת nennt das Haus beziehungsweise den häuslichen Schutzraum.
- source_word: עָרֹם
  choice: einen Nackten
  rationale: Das Adjektiv wird substantivisch und im repräsentativen Singular gebraucht. Die Formulierung bleibt nah am Hebräischen und ist im Deutschen verständlich.
- source_word: וְכִסִּיתוֹ
  choice: ihn zu bekleiden
  rationale: Das Verb bedeutet wörtlich „ihn zu bedecken“. Da es um einen unbekleideten Menschen geht, drückt „bekleiden“ die konkrete Handlung im Deutschen klar aus.
- source_word: וּמִבְּשָׂרְךָ
  choice: deinem eigenen Fleisch
  rationale: Die hebräische Metapher kann die eigene Verwandtschaft bezeichnen, trägt aber möglicherweise eine weiter reichende menschliche Solidarität mit. Die wörtliche Bildsprache bewahrt diese Offenheit.
- source_word: לֹא תִתְעַלָּם
  choice: dich … nicht zu entziehen
  rationale: Der Hitpael bezeichnet ein Sichverbergen oder Sichabwenden. „Sich entziehen“ vermittelt im Deutschen sowohl den Rückzug als auch die verweigerte Verantwortung.
theological_decisions:
- issue: Reichweite von „deinem eigenen Fleisch“
  choice: Die hebräische Metapher wird im Haupttext beibehalten.
  alternative: „deinen Angehörigen“ oder „deiner Familie“
  rationale: Die Wendung kann besonders auf Verwandte zielen, lässt aber eine weiter reichende ethische Resonanz zu. Eine Festlegung ausschließlich auf die Familie würde die im Hebräischen vorhandene Spannung verengen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die Folge konkreter Infinitivhandlungen bleiben erhalten. „Eigenes Fleisch“ bewahrt bewusst das ungewohnte, theologisch offene Bild des Ausgangstextes.
