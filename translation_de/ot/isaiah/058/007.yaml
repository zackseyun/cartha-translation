review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt die rhetorische Frage und die Abfolge der geforderten Handlungen zutreffend wieder. „Dein Brot mit dem Hungrigen zu teilen“ entspricht פָרֹס לָרָעֵב לַחְמֶךָ idiomatisch und inhaltlich. „In dein Haus zu bringen“ gibt תָּבִיא בָיִת angemessen als konkrete Gastaufnahme wieder. „Wenn du einen Nackten siehst, ihn zu bekleiden“ trifft die situative Einleitung כִּי תִרְאֶה sowie die im Kontext gemeinte Bedeutung von וְכִסִּיתוֹ. Die abschließende Bildsprache wird nicht unzulässig auf Verwandte eingeengt.
  naturalness: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Register. Die Infinitivreihe nach „Besteht es nicht darin“ ist natürlich. „Dich deinem eigenen Fleisch nicht zu entziehen“ ist bewusst bildhaft, aber verständlich und als Wiedergabe des Sich-Verbergens bzw. Sich-Abwendens vertretbar.
  terminology: „Hungrigen“, „Arme“, „Nackten“ und „Fleisch“ sind treffende, registergerechte Begriffe. „Obdachlose Arme“ ist eine plausible kontextuelle Wiedergabe von עֲנִיִּים מְרוּדִים; die Fußnote dokumentiert die lexikalische Unsicherheit und nennt die relevanten Alternativen. Die Fußnote zu „Fleisch“ wahrt die offene Reichweite des hebräischen Idioms.
