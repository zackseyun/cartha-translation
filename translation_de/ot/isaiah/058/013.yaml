  variant: modern standard German
source:
  edition: WLC
  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: de
  text: Wenn du deinen Fuß vom Sabbat zurückhältst, an meinem heiligen Tag nicht deinen eigenen Interessen nachgehst[c], den Sabbat eine Freude nennst, den heiligen Tag Jahwes als ehrwürdig bezeichnest und ihn ehrst[a], indem du nicht deine eigenen Wege gehst, nicht deine eigenen Interessen verfolgst und kein Wort redest[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen in „ihn ehrst“ kann statt auf den Sabbat beziehungsweise den heiligen Tag auch auf Jahwe bezogen werden.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und kein Wort redest“. Gemeint sein kann, dass man gewöhnliche, selbstbezogene oder müßige Rede unterlässt.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „deine eigene Freude“, „deine eigenen Wünsche“ oder in diesem Zusammenhang „deine eigenen Geschäfte“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב ... רַגְלֶךָ
  choice: deinen Fuß ... zurückhältst
  rationale: Die konkrete hebräische Fußmetapher bleibt erhalten; „zurückhalten“ gibt im Deutschen natürlich wieder, dass man davon absieht, den Sabbat zu verletzen.
- source_word: מִשַּׁבָּת
  choice: vom Sabbat
  rationale: Die Präposition und das konkrete Bild des Hebräischen werden bewahrt, ohne die Wendung vorschnell abstrakt zu umschreiben.
- source_word: עֲשׂוֹת חֲפָצֶיךָ / מִמְּצוֹא חֶפְצְךָ
  choice: deinen eigenen Interessen nachgehst / deine eigenen Interessen verfolgst
  rationale: חפץ kann Freude, Wunsch, Anliegen oder Geschäft bezeichnen. „Eigene Interessen“ wahrt die in diesem Zusammenhang wichtige Offenheit zwischen Vergnügen und gewöhnlichen persönlichen Geschäften; die verwandte Wiedergabe an beiden Stellen erhält die lexikalische Wiederholung.
- source_word: בְּיוֹם קָדְשִׁי
  choice: an meinem heiligen Tag
  rationale: Die göttliche Besitzangabe und die Heiligkeit des Tages werden direkt und idiomatisch wiedergegeben.
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: den Sabbat eine Freude ... nennst
  rationale: „Eine Freude“ gibt עֹנֶג natürlich wieder und bewahrt die Aussage, dass der Sabbat selbst als erfreulich gelten soll.
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: Jahwes heiligen Tag ehrenwert nennst
  rationale: Die knappe Apposition wird im Deutschen verständlich auf den Sabbat als den Jahwe geheiligten Tag bezogen. „Ehrenwert“ bewahrt den prädikativen Charakter von מְכֻבָּד.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְכִבַּדְתּוֹ
  choice: und ihn ehrst
  rationale: Das maskuline Pronomen kann sich im deutschen Satz ebenso wie im Hebräischen zunächst auf den Sabbat beziehungsweise den heiligen Tag beziehen; zugleich bleibt ein möglicher Bezug auf Jahwe erkennbar und wird in der Fußnote genannt.
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: indem du nicht deine eigenen Wege gehst
  rationale: Die Wegmetapher für das selbstbestimmte Verhalten wird in natürlichem Deutsch bewahrt.
- source_word: וְדַבֵּר דָּבָר
  choice: und kein Wort redest
  rationale: Die auffallend knappe hebräische Formulierung bleibt stehen, ohne die gemeinte Art der Rede im Haupttext interpretierend festzulegen.
theological_decisions:
- issue: Bezugswort des Pronomens in וְכִבַּדְתּוֹ
  choice: 'Das Pronomen wird vorrangig auf den Sabbat beziehungsweise den heiligen Tag bezogen: „ihn ehrst“.'
  alternative: 'Das Pronomen kann auf Jahwe bezogen werden: „ihn ehrst“ im Sinn von „Jahwe ehrst“.'
  rationale: Der unmittelbare Gedankengang handelt davon, den Sabbat Freude und Jahwes heiligen Tag ehrenwert zu nennen und ihn entsprechend zu behandeln. Wegen des möglichen grammatischen Bezugs auf Jahwe wird die Alternative jedoch nicht ausgeschlossen.
- issue: Bedeutung des Sabbatgebots in חפץ und דָּבָר
  choice: Der Haupttext lässt „eigene Interessen“ und „kein Wort“ bewusst relativ offen.
  alternative: Die Wendungen können enger auf Vergnügen, gewöhnliche Geschäfte oder selbstbezogene beziehungsweise müßige Rede bezogen werden.
  rationale: Der hebräische Wortlaut legt die genaue Reichweite dieser Ausdrücke nicht eindeutig fest. Eine konfessionell oder kasuistisch verengende Deutung wäre daher unbegründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Fuß- und Wegmetaphorik des Hebräischen bleibt erhalten. Die Satzform endet mit einem Komma, weil der mit „Wenn“ eröffnete Bedingungssatz in Jesaja 58,14 fortgeführt wird.
