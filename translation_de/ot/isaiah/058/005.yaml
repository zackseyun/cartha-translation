base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: de
  text: 'Ist das etwa ein Fasten, das ich erwählt habe: ein Tag, an dem der Mensch sich selbst demütigt? Besteht es darin, seinen Kopf wie eine Binse zu beugen und Sack und Asche auszubreiten? Willst du das ein Fasten nennen und einen Tag, der dem HERRN gefällt?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צוֹם
  choice: Fasten
  rationale: Das deutsche Substantiv gibt die religiöse Praxis direkt und natürlich wieder.
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: sich selbst demütigt
  rationale: נפשׁ bezeichnet hier die eigene Person; die Wendung meint Selbsterniedrigung beziehungsweise Selbstkasteiung. Die Übersetzung wahrt den Ernst der Formulierung, ohne sie auf bloßes Hungern zu verengen.
- source_word: אַגְמֹן
  choice: Binse
  rationale: Das Bild bezeichnet eine biegsame Sumpfpflanze, die sich leicht neigt; „Binse“ ist im Deutschen anschaulich und sachlich passend.
- source_word: יַצִּיעַ
  choice: unter sich ausbreiten
  rationale: Das Verb bedeutet ausbreiten beziehungsweise als Lager auslegen; die Ergänzung „unter sich“ macht die Funktion von Sack und Asche im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: יוֹם רָצוֹן
  choice: ein Tag, der ... gefällt
  rationale: רצון bezeichnet hier Wohlgefallen beziehungsweise Annahme. Die Relativkonstruktion ist idiomatischer als „ein Tag des Wohlgefallens“.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms in Kapitälchen entspricht dem gängigen Bibelregister und vermeidet eine unsichere Vokalisierung.
theological_decisions:
- issue: Bewertung äußerer Fastenpraktiken
  choice: Die rhetorischen Fragen bleiben als Kritik an einem auf äußere Demutsgesten reduzierten Fasten formuliert.
  alternative: Die Praktiken ausdrücklich als grundsätzlich wertlos oder verboten bezeichnen.
  rationale: Der Vers hinterfragt, ob solche Handlungen das von Gott erwählte Fasten ausmachen; er verwirft sie nicht losgelöst vom Kontext in jeder denkbaren Verwendung.
- issue: Bedeutung von ענה נפשׁ
  choice: „sich selbst demütigt“
  alternative: „sich kasteit“ oder „seine Seele quält“
  rationale: Die gewählte Formulierung erhält die religiöse und innere Dimension sowie die mögliche körperliche Selbsterniedrigung, ohne eine spezifische asketische Technik festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit der rhetorischen Schärfe des Hebräischen. Der Wechsel von der allgemeinen dritten Person („der Mensch“, „er“) zur direkten Anrede („Willst du“) folgt dem Ausgangstext. Die Fragen wurden nicht in Behauptungen umgeformt.
