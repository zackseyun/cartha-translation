  to: 'Ist das etwa ein Fasten, das ich erwählt habe: ein Tag, an dem der Mensch sich selbst demütigt? Besteht es darin, seinen Kopf wie eine Binse zu beugen und Sack und Asche auszubreiten? Willst du das ein Fasten nennen und einen Tag, der dem HERRN gefällt?'
  rationale: Die Revision beseitigt die mögliche Aufforderungsnuance von „Soll er“ und gibt die zweite hebräische rhetorische Frage als Frage nach dem Wesen eines von Gott erwählten Fastens wieder. Die implizierende Ergänzung „unter sich“ wird entfernt. Bedeutung, Register und die rhetorische Schärfe bleiben erhalten.
