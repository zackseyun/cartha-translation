id: ISA.58.1
reference: Isaiah 58:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: de
  text: Rufe aus voller Kehle, halte dich nicht zurück! Erhebe deine Stimme wie ein Schofar[a] und verkünde meinem Volk seine Auflehnung[b] und dem Haus Jakob seine Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein Horn, meist ein Widderhorn, das zur Signalgebung oder Verkündigung verwendet wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: seine Übertretung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  choice: Rufe
  rationale: Der Imperativ bezeichnet hier einen lauten, dringlichen öffentlichen Ruf; „Rufe“ bewahrt sowohl die Grundbedeutung als auch den prophetischen Ton.
- source_word: בְגָרוֹן
  choice: aus voller Kehle
  rationale: Die Wendung gibt das konkrete hebräische „mit der Kehle“ in natürlichem Deutsch wieder und vermittelt zugleich unüberhörbare Lautstärke.
- source_word: אַל תַּחְשֹׂךְ
  choice: halte dich nicht zurück
  rationale: Das idiomatische Verbot fordert dazu auf, nichts zurückzuhalten und den Ruf nicht zu dämpfen.
- source_word: כַּשּׁוֹפָר
  choice: wie ein Schofarhorn
  rationale: „Schofarhorn“ bezeichnet das konkrete Signalhorn genauer als das allgemeine „Trompete“ und bleibt durch die Fußnote allgemein verständlich.
- source_word: הָרֵם קוֹלֶךָ
  choice: Erhebe deine Stimme
  rationale: Die geläufige deutsche Wendung entspricht dem hebräischen Bild und wahrt den gehobenen, eindringlichen Ton.
- source_word: וְהַגֵּד
  choice: und verkünde
  rationale: „Verkünde“ vermittelt die ausdrückliche, autoritative Bekanntmachung, zu der der Prophet aufgefordert wird.
- source_word: לְעַמִּי
  choice: meinem Volk
  rationale: Die possessive Form bewahrt die im Ausdruck liegende Bundesbeziehung.
- source_word: פִּשְׁעָם
  choice: seine Auflehnung
  rationale: פֶּשַׁע bezeichnet häufig einen vorsätzlichen Bruch beziehungsweise Aufruhr und ist stärker als eine allgemeine Verfehlung.
- source_word: וּלְבֵית יַעֲקֹב
  choice: und dem Haus Jakob
  rationale: Die traditionelle nationale und bundesgeschichtliche Bezeichnung wird als eigener paralleler Adressat beibehalten.
- source_word: חַטֹּאתָם
  choice: seine Sünden
  rationale: Der hebräische Plural wird gewahrt; das singularische Possessivpronomen richtet sich grammatisch nach „Haus“.
theological_decisions:
- issue: Verhältnis von „meinem Volk“ und „dem Haus Jakob“
  choice: Beide Bezeichnungen bleiben als parallele Satzglieder ausdrücklich erhalten.
  alternative: „Das Haus Jakob“ als bloße Apposition zu „mein Volk“ wiederzugeben oder beide Ausdrücke zusammenzuziehen.
  rationale: Der hebräische Parallelismus wiederholt die Adressatenbezeichnung und verstärkt so die prophetische Anklage, ohne das genaue Verhältnis der beiden Wendungen weiter auszudeuten.
- issue: Bedeutungsumfang von פֶּשַׁע
  choice: „Auflehnung“ hebt den vorsätzlichen Widerstand hervor.
  alternative: „Übertretung“ betont stärker den Bruch eines Gebots oder einer Grenze.
  rationale: Der Kontext einer an Gottes Volk gerichteten Anklage trägt die rebellische Nuance; die verbreitete Alternative wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftigem prophetischem Imperativ. „Aus voller Kehle“ ist natürlich und bewahrt die körperliche Bildhaftigkeit; „Schofarhorn“ erhält den konkreten kulturellen Bezug. Die parallele Struktur und die beiden unterschiedlichen Sündenbegriffe werden nicht eingeebnet.
