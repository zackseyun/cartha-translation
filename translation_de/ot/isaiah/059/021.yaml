source:
  edition: WLC
  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: de
  text: 'Und was mich betrifft: Dies ist mein Bund mit ihnen, spricht Jahwe: Mein Geist, der auf dir ist, und meine Worte, die ich dir in den Mund gelegt habe, werden nicht aus deinem Mund weichen, auch nicht aus dem Mund deiner Nachkommen[a] und nicht aus dem Mund der Nachkommen deiner Nachkommen, spricht Jahwe, von jetzt an bis in Ewigkeit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deines Samens“. Das hebräische Wort wird hier kollektiv für die Nachkommenschaft gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von nun an und für immer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und was mich betrifft
  rationale: Das vorangestellte Pronomen ist betont und markiert einen Kontrast beziehungsweise einen neuen Einsatz; die Wendung bewahrt diese Hervorhebung im Deutschen.
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: Dies ist mein Bund mit ihnen
  rationale: Die relationale Bundesformel wird im Deutschen natürlich und präzise mit „Bund mit ihnen“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des im hebräischen Text stehenden Gottesnamens wahrt dessen Eigennamecharakter.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ entspricht der feierlichen prophetischen Zitationsformel und ist im Deutschen idiomatischer als ein schlichtes Präsens „sagt“.
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: mein Geist, der auf dir ist
  rationale: Im Zusammenhang göttlicher Bevollmächtigung ist „Geist“ die naheliegende Bedeutung; „auf dir“ bewahrt die Präposition und vermeidet eine interpretierende Umschreibung.
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: und meine Worte, die ich dir in den Mund gelegt habe
  rationale: Der Plural „Worte“ wird erhalten. Die deutsche Fügung „jemandem etwas in den Mund legen“ gibt die hebräische Konstruktion natürlich wieder, ohne hier die moderne Bedeutung einer falschen Zuschreibung anzunehmen.
- source_word: לֹא יָמוּשׁוּ מִפִּיךָ
  choice: sollen nicht aus deinem Mund weichen
  rationale: „Weichen“ gibt das dauerhafte Nicht-Entfernen aus dem Mund in feierlichem, aber verständlichem Deutsch wieder; „sollen“ trägt die Verheißungs- und Bundesgeltung.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch natürlicher als das wörtliche „Same“.
- source_word: זֶרַע זַרְעֲךָ
  choice: die Nachkommen deiner Nachkommen
  rationale: Die Formulierung erhält die ausdrückliche Fortschreibung über weitere Generationen hinweg und vermeidet eine Glättung zu einem unbestimmten „alle Generationen“.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: von jetzt an bis in Ewigkeit
  rationale: Die Wendung bewahrt sowohl den gegenwärtigen Ausgangspunkt als auch die unbegrenzte Dauer und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Bezug der zweiten Person Singular „dir/dein“
  choice: Die Singularform bleibt ohne erklärende Identifikation des Angesprochenen erhalten.
  alternative: Den Angesprochenen ausdrücklich als Propheten, Zion/Israel oder als korporativ verstandenen Knecht beziehungsweise erlöste Gemeinschaft bestimmen.
  rationale: Der unmittelbare Bezug bleibt im hebräischen Text unausgesprochen. Die Übersetzung wahrt diese Mehrdeutigkeit und legt keine bestimmte theologische Deutung fest.
- issue: Bedeutung von רוּחִי
  choice: „mein Geist“
  alternative: „mein Atem“ oder „mein Wind“
  rationale: Der Kontext von göttlicher Bevollmächtigung, Wortgabe und Bund spricht am stärksten für „Geist“, während die grundsätzliche Bedeutungsbreite des hebräischen Wortes anerkannt bleibt.
- issue: Modalität von לֹא יָמוּשׁוּ
  choice: „sollen nicht … weichen“ als verbindliche Bundesverheißung
  alternative: „werden nicht … weichen“ als ausdrücklich prädiktive Formulierung
  rationale: Das Hebräische bezeichnet hier eine dauerhafte, von Jahwe zugesagte Wirklichkeit. „Sollen nicht“ wahrt im Deutschen sowohl die feierliche Verbindlichkeit als auch den Verheißungscharakter, ohne sie auf bloßes Gebot oder bloße Vorhersage zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Feierlichkeit. Wiederholungen wie „Mund“ und die generationenweise Fortschreibung werden als prägende Elemente des hebräischen Textes beibehalten. Der Gottesname wird als „Jahwe“ wiedergegeben.
