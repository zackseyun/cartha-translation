source:
  edition: WLC
  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: de
  text: Denn unsere Vergehen sind zahlreich vor dir, und unsere Sünden zeugen gegen uns[a]. Denn unsere Vergehen sind bei uns, und unsere Schuld kennen wir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „legen Zeugnis gegen uns ab“; wörtlicher: „antworten gegen uns“ beziehungsweise „in uns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet jeweils eine Begründung beziehungsweise erklärende Bekräftigung ein; „denn“ gibt diese Funktion in beiden Vershälften natürlich wieder.
- source_word: רַבּוּ
  choice: sind zahlreich
  rationale: Das Verb רבה bezeichnet das Vielewerden beziehungsweise Zahlreichsein. Die resultative Bedeutung passt hier idiomatisch als „sind zahlreich“.
- source_word: פְשָׁעֵינוּ
  choice: unsere Vergehen
  rationale: פשע bezeichnet einen schuldhaften Bruch oder eine Auflehnung. „Vergehen“ wahrt das Gewicht des Ausdrucks, ohne den Begriff unnötig konfessionell festzulegen.
- source_word: נֶגְדֶּךָ
  choice: vor dir
  rationale: נגד bezeichnet hier die Gegenwart beziehungsweise das Blickfeld Gottes. „Vor dir“ erhält diese räumlich-forensische Nuance und wird nicht vorschnell zu „gegen dich“ verengt.
- source_word: וְחַטֹּאותֵינוּ
  choice: und unsere Sünden
  rationale: חטאות ist der geläufige Ausdruck für Sünden; die direkte Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: עָנְתָה בָּנוּ
  choice: zeugen gegen uns
  rationale: ענה kann in dieser Konstruktion „antworten“ und im forensischen Sinn „zeugen“ bedeuten. „Zeugen gegen uns“ vermittelt den Gerichtskontext verständlich; die ungewöhnlichere, formal nähere Lesart wird in der Fußnote bewahrt.
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: unsere Vergehen sind bei uns
  rationale: Die knappe Formulierung bewahrt die Aussage, dass die Vergehen gegenwärtig sind und den Sprechenden anhaften, ohne „bleiben“ interpretierend hinzuzufügen.
- source_word: וַעֲוֺנֹתֵינוּ
  choice: und unsere Schuld
  rationale: עון kann sowohl die schuldhafte Tat als auch die daraus erwachsende Schuld bezeichnen. Das kollektive deutsche „Schuld“ ist natürlich und hält den Begriff von „Vergehen“ und „Sünden“ unterscheidbar.
- source_word: יְדַעֲנוּם
  choice: kennen wir
  rationale: ידע bedeutet unmittelbar „kennen/wissen“. Die vorangestellte Objektphrase „unsere Schuld“ nimmt das hebräische Objektsuffix sinngemäß auf.
theological_decisions:
- issue: Unterschiedliche hebräische Begriffe für menschliche Schuld
  choice: Die drei Ausdrücke werden als „Vergehen“, „Sünden“ und „Schuld“ unterschieden.
  alternative: Alle drei Begriffe einheitlich mit „Sünden“ wiederzugeben.
  rationale: פשע, חטא und עון überschneiden sich, setzen aber unterschiedliche Akzente. Die Unterscheidung erhält die verdichtete Sprache des Bekenntnisses, ohne daraus ein starres theologisches Begriffssystem abzuleiten.
- issue: Forensische oder räumliche Deutung von עָנְתָה בָּנוּ
  choice: „zeugen gegen uns“ im Haupttext, mit der wörtlicheren Alternative in der Fußnote.
  alternative: „antworten gegen uns“ oder „antworten in uns“.
  rationale: Der Zusammenhang legt ein belastendes Zeugnis der Sünden nahe, doch die hebräische Wendung bleibt ungewöhnlich. Die Fußnote bewahrt ihre lexikalische und präpositionale Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Parallelstruktur. Die Wiederholung „unsere Vergehen“ und die drei unterschiedlichen Schuldbegriffe bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Anmerkung bezieht.
