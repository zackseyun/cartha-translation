  text: וּ/בָ֤א לְ/צִיּוֹן֙ גּוֹאֵ֔ל וּ/לְ/שָׁבֵ֥י פֶ֖שַׁע בְּ/יַֽעֲקֹ֑ב נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: de
  text: Und ein Erlöser[b] wird nach Zion kommen[a] und zu denen in Jakob, die sich von der Auflehnung abwenden[c][d] – Ausspruch des HERRN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Zion“. Die hebräische Präposition kann auch so verstanden werden; zusammen mit dem Verb „kommen“ liegt die Richtungsangabe „nach Zion“ jedoch näher.'
    reason: lexical_alternative
  - marker: b
    text: „Erlöser“ gibt das hebräische go’el wieder. Das Wort bezeichnet jemanden, der auslöst, zurückgewinnt oder befreit, oft mit verwandtschaftlichen oder bundesbezogenen Anklängen.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „zu den Umkehrenden in Jakob“ oder „zu denen in Jakob, die sich von Übertretung abwenden“.'
    reason: alternative_reading
  - marker: d
    text: Paulus führt diesen Vers in Römer 11,26 an. Dort weicht der Wortlaut teilweise ab und ist von der griechischen Textüberlieferung geprägt.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: Und … wird … kommen
  rationale: Das Qal-Perfekt mit vorangestelltem ו steht hier in prophetischer Rede mit zukünftigem Sinn. Das deutsche Futur gibt diesen Kontext klar und natürlich wieder.
- source_word: לְצִיּוֹן
  choice: nach Zion
  rationale: Bei בוא bezeichnet ל am natürlichsten das Ziel der Bewegung. Im Deutschen ist bei Städten und Ortsnamen „nach Zion kommen“ idiomatisch.
- source_word: גּוֹאֵל
  choice: ein Erlöser
  rationale: גאל bezeichnet jemanden, der auslöst, zurückgewinnt oder befreit, häufig mit verwandtschaftlichen und bundesbezogenen Anklängen. „Erlöser“ bewahrt dieses Gewicht, ohne die verwandtschaftliche Rolle im Haupttext stärker festzulegen, als es der hebräische Ausdruck tut.
- source_word: וּלְשָׁבֵי פֶשַׁע
  choice: zu denen …, die sich von der Auflehnung abwenden
  rationale: Das Partizip von שוב beschreibt Menschen, die umkehren beziehungsweise sich abwenden. Zusammen mit פשע geht es um eine moralische Abkehr von Auflehnung. Die verbale Wiedergabe erhält den Vorgangscharakter und vermeidet einen stärker dogmatisch geprägten Fachbegriff.
- source_word: פֶשַׁע
  choice: Auflehnung
  rationale: פשע bezeichnet häufig einen bewussten Verstoß gegen rechtmäßige Autorität und kann daher „Übertretung“ oder „Auflehnung“ bedeuten. „Auflehnung“ bringt den rebellischen Beiklang im heutigen Deutsch deutlich zum Ausdruck.
- source_word: בְּיַעֲקֹב
  choice: in Jakob
  rationale: 'ב bezeichnet hier den Bereich beziehungsweise die Gemeinschaft: innerhalb Jakobs, also unter dem Bundesvolk. Die Wiedergabe bewahrt die bildhafte Identitätsbezeichnung des Hebräischen.'
- source_word: נְאֻם יְהוָה
  choice: Ausspruch des HERRN
  rationale: Die feste prophetische Formel wird formal und zugleich verständlich als „Ausspruch des HERRN“ wiedergegeben. Der Gottesname יהוה erscheint gemäß der vorgegebenen Übersetzungskonvention als „der HERR“.
theological_decisions:
- issue: Identität und Wirkungsbereich des Erlösers
  choice: גּוֹאֵל wird als „ein Erlöser“ wiedergegeben, ohne die Gestalt im Haupttext ausdrücklich zu identifizieren.
  alternative: Der Erlöser als messianische Gestalt; der HERR selbst als der handelnde Erlöser.
  rationale: Der Vers ist theologisch bedeutsam und wird später im Neuen Testament aufgenommen, doch der hebräische Text benennt die Gestalt hier nur als „Erlöser“. Die Übersetzung wahrt diese Offenheit.
- issue: Bedeutung von שָׁבֵי פֶשַׁע
  choice: „die sich von der Auflehnung abwenden“
  alternative: „die Umkehrenden in Jakob“; „die in Jakob von der Übertretung umkehren“
  rationale: Die Formulierung bezeichnet eine moralische Abkehr, bewahrt aber durch das Partizip einen verbalen Sinn. Die gewählte Fassung vermeidet es, einen später systematisierten theologischen Begriff in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nach Zion kommen“ ist idiomatisch, während „in Jakob“ die hebräische Bundes- und Identitätssprache bewusst bewahrt. „Ausspruch des HERRN“ erhält den feierlichen Charakter der prophetischen Schlussformel.
