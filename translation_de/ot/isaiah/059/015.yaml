base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: de
  text: So fehlte die Wahrheit, und wer sich vom Bösen abwandte, wurde zur Beute.[a] Jahwe sah es, und es war böse in seinen Augen,[b] dass es kein Recht gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das seltene hebräische Wort kann auch bedeuten: „machte sich selbst zur Beute“, „wurde ausgeplündert“ oder „wurde wie Beute behandelt“. Es beschreibt wohl, dass jemand, der sich vom Bösen abwendet, selbst zum Opfer wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „es war böse in seinen Augen“; sinngemäß auch: „es missfiel ihm“ oder „es war Unrecht in seinen Augen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  choice: die Wahrheit
  rationale: אֱמֶת bezeichnet hier im Zusammenhang des gesellschaftlichen und rechtlichen Zerfalls vor allem Wahrheit und Wahrhaftigkeit im öffentlichen Leben; „Wahrheit“ bewahrt diese Bedeutungsbreite.
- source_word: נֶעְדֶּרֶת
  choice: fehlte
  rationale: Das Nifal-Partizip beschreibt etwas Abwesendes oder Fehlendes. „Fehlte“ ist im Deutschen knapp, natürlich und deutet nicht stärker als der hebräische Text ein vollständiges Verschwinden an.
- source_word: וְסָר מֵרָע
  choice: wer sich vom Bösen abwandte
  rationale: Das maskuline Singularpartizip hat hier generische Bedeutung. Die Formulierung gibt die aktive Abkehr vom Bösen natürlich wieder, ohne sie auf einen bestimmten Mann zu beschränken.
- source_word: מִשְׁתּוֹלֵל
  choice: wurde zur Beute
  rationale: Die seltene Form bezeichnet wahrscheinlich, dass jemand zur Beute beziehungsweise zum Opfer wird. Die bildhafte Wiedergabe wahrt die Unsicherheit besser als eine Festlegung auf einen bestimmten Vorgang wie Ausplünderung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: es war böse in seinen Augen
  rationale: Die hebräische Wendung wird bewusst nahe am Wortlaut wiedergegeben; sie drückt nicht nur Missfallen, sondern eine moralische Bewertung aus.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט meint hier die gerechte rechtliche und gesellschaftliche Ordnung. „Recht“ fügt sich idiomatisch in „kein Recht gab“ und bewahrt sowohl den juristischen als auch den ethischen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ macht dies sichtbar, ohne einen bloßen Titel an seine Stelle zu setzen.
- issue: Generische Bedeutung von וְסָר
  choice: wer sich vom Bösen abwandte
  alternative: der sich vom Bösen abwandte
  rationale: Das hebräische maskuline Singularpartizip bezeichnet repräsentativ jeden Menschen mit diesem Verhalten; die gewählte deutsche Form gibt diese generische Funktion klar wieder.
- issue: Moralische Wertung in וַיֵּרַע בְּעֵינָיו
  choice: es war böse in seinen Augen
  alternative: es missfiel ihm
  rationale: Die wörtlichere Fassung erhält die Spannung zwischen göttlichem Missfallen und ausdrücklichem moralischem Urteil, statt die Aussage auf eine Gefühlsreaktion zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper Satzführung. „So fehlte“ schließt an die vorausgehende Klage an. Die ungewöhnliche Wendung „böse in seinen Augen“ bleibt erhalten, weil sie die moralische Schärfe des Hebräischen trägt; die seltene Form מִשְׁתּוֹלֵל wird bildhaft und mit Fußnote wiedergegeben.
