  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: de
  text: Ihre Gewebe werden nicht als Kleidung dienen[a], und sie werden sich nicht mit ihren Taten bedecken. Ihre Taten sind Taten des Unrechts[b], und Gewalttat ist in ihren Händen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Spinnennetze“. Das hebräische Wort bezeichnet etwas Gesponnenes oder Gewobenes; „Gewebe“ bewahrt das Bild, ohne es näher festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Taten der Bosheit“ bzw. „Taten des Frevels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּרֵיהֶם
  choice: ihre Gewebe
  rationale: Das Substantiv bezeichnet etwas Gesponnenes oder Gewobenes. „Gewebe“ bewahrt die aus Vers 5 fortgeführte Metapher, ohne das hier nicht ausdrücklich genannte Spinnennetz übermäßig zu spezifizieren.
- source_word: לְבֶגֶד
  choice: zu Kleidung
  rationale: בגד kann ein Kleidungsstück oder Kleidung allgemein bezeichnen. Zusammen mit היה und ל drückt „zu Kleidung werden“ Ergebnis beziehungsweise Funktion natürlich aus.
- source_word: יִתְכַּסּוּ
  choice: werden sie sich bedecken
  rationale: Die Hitpael-Form ist reflexiv; „sich bedecken“ bildet dies ab und erhält das konkrete Bild.
- source_word: בְּמַעֲשֵׂיהֶם / מַעֲשֵׂיהֶם
  choice: mit ihren Taten / ihre Taten
  rationale: „Taten“ ist gegenwärtiges, verständliches Deutsch. Die Wiederholung wird zur Wahrung des hebräischen Nachdrucks beibehalten; ב ist hier instrumental als „mit“ wiedergegeben.
- source_word: מַעֲשֵׂי אָוֶן
  choice: Taten des Unrechts
  rationale: אָוֶן kann Unrecht, Bosheit, Frevel oder Unheil bezeichnen. „Unrecht“ wahrt die moralische Anklage und einen Teil der Bedeutungsbreite, ohne unnötig zu theologisieren.
- source_word: וּפֹעַל חָמָס
  choice: und das Werk der Gewalt
  rationale: Der singularische Konstrukt פֹעַל חָמָס wird formal bewahrt. חָמָס bezeichnet Gewalt beziehungsweise gewaltsames Unrecht.
- source_word: בְּכַפֵּיהֶם
  choice: ist in ihren Händen
  rationale: כף meint wörtlich Handfläche beziehungsweise Hand. Die idiomatische Wiedergabe „in ihren Händen“ vermittelt sowohl konkrete Ausübung als auch Verantwortlichkeit.
theological_decisions:
- issue: Bild vom unzureichenden Bedecken
  choice: Die konkreten Bilder von Gewebe, Kleidung und Sich-Bedecken bleiben erhalten.
  alternative: Den Sinn als Unfähigkeit paraphrasieren, die eigene Schuld oder Bosheit durch Taten zu verbergen.
  rationale: Der hebräische Text erklärt die moralische Bedeutung des Bildes nicht ausdrücklich. Die bildhafte Spannung soll daher nicht durch eine deutende Ergänzung aufgelöst werden.
- issue: Bedeutungsbreite von אָוֶן
  choice: Unrecht
  alternative: Bosheit, Frevel oder Unheil
  rationale: „Unrecht“ passt zur moralischen Anklage im Kontext und lässt die lexikalische Spannweite eher offen als eine stärker dogmatisch oder archaisch gefärbte Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Taten“ und der singularische Ausdruck „das Werk der Gewalt“ folgen bewusst der hebräischen Rhetorik. „Gewebe“ klingt leicht gehoben, ist hier aber wegen des Web- und Kleidungsbildes präzise und verständlich.
