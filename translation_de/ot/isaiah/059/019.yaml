id: ISA.59.19
reference: Isaiah 59:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִֽירְא֤וּ מִֽ/מַּעֲרָב֙ אֶת שֵׁ֣ם יְהוָ֔ה וּ/מִ/מִּזְרַח שֶׁ֖מֶשׁ אֶת כְּבוֹד֑/וֹ כִּֽי יָב֤וֹא כַ/נָּהָר֙ צָ֔ר ר֥וּחַ יְהוָ֖ה נֹ֥סְסָה בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: de
  text: Dann werden sie vom Westen her den Namen Jahwes fürchten und vom Aufgang der Sonne her[a] seine Herrlichkeit. Denn er wird kommen wie ein reißender Strom, den der Atem Jahwes antreibt.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: aus dem Osten.'
    reason: Die wörtliche Wendung „vom Aufgang der Sonne her“ bezeichnet die Himmelsrichtung Osten.
  - marker: b
    text: 'Der hebräische Wortlaut des letzten Satzes ist schwer zu deuten. Auch möglich: „Denn es kommt wie ein Strom; der Geist Jahwes treibt ihn an.“ Das Wort für „Atem“ kann auch „Wind“ oder „Geist“ bedeuten.'
    reason: Die Beziehung des Verbs, die Bedeutung von צָר und die Funktion von רוּחַ in der Schlusskonstruktion sind umstritten.
  - marker: c
    text: 'Traditionelle Wiedergabe: „Wenn der Feind wie eine Flut kommt, wird der Geist Jahwes ein Feldzeichen gegen ihn aufrichten.“ Diese Deutung setzt eine andere Gliederung und Auslegung des schwierigen hebräischen Wortlauts voraus; ein ausdrückliches Wort für „Feind“ steht dort nicht.'
    reason: Die verbreitete traditionelle Lesart soll wegen ihrer Wirkungsgeschichte kenntlich bleiben, obwohl sie gegenüber dem masoretischen Wortlaut zusätzliche Deutungsschritte verlangt.
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Dann werden sie … fürchten
  rationale: Das Qal-Imperfekt von ירא bezeichnet Furcht beziehungsweise ehrfürchtige Scheu. „Fürchten“ bewahrt die Stärke des Ausdrucks; „Dann“ gibt den folgernden Zusammenhang natürlich wieder.
- source_word: מִמַּעֲרָב
  choice: vom Westen her
  rationale: מַעֲרָב bezeichnet den Westen beziehungsweise den Ort des Sonnenuntergangs. Die räumliche Formulierung entspricht dem Parallelismus.
- source_word: אֶת שֵׁם יְהוָה
  choice: den Namen Jahwes
  rationale: Die Wendung bezeichnet Jahwes offenbare Identität und seinen Ruf. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: vom Aufgang der Sonne her
  rationale: Die wörtliche Bildsprache bleibt erhalten und bildet mit „vom Westen her“ einen poetischen Merismus; gemeint ist der Osten.
- source_word: אֶת כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד kann Gewicht, Ehre oder Herrlichkeit bezeichnen. Im Zusammenhang des göttlichen Erscheinens ist „Herrlichkeit“ angemessen.
- source_word: כִּי יָבֹא
  choice: Denn er wird kommen
  rationale: כִּי leitet hier plausibel eine Begründung ein. Das maskuline Verb erlaubt einen persönlichen Bezug auf Jahwe beziehungsweise seine Herrlichkeit; die schwierige Syntax wird in der Fußnote offengelegt.
- source_word: כַנָּהָר צָר
  choice: wie ein aufgestauter Strom
  rationale: נָהָר bedeutet „Strom/Fluss“. Das schwierige צָר kann eine Einengung oder Bedrängung bezeichnen; „aufgestaut“ vermittelt einen unter Druck stehenden, machtvoll hervorbrechenden Strom, ohne das im Hebräischen nicht ausdrücklich genannte Wort „Feind“ einzuführen.
- source_word: רוּחַ יְהוָה
  choice: der Wind Jahwes
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Im Strombild ist „Wind“ konkret und sprachlich schlüssig, während „Atem“ und „Geist“ als mögliche Deutungen in der Fußnote erhalten bleiben.
- source_word: נֹסְסָה בוֹ
  choice: den … vorantreibt
  rationale: Die seltene Form und die ganze Wendung sind schwer zu bestimmen. Die Wiedergabe versteht Jahwes רוּחַ als die Kraft, die den Strom vorwärts treibt, und bezieht בוֹ auf den Strom.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen in der im modernen Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Wind Jahwes
  alternative: der Atem Jahwes / der Geist Jahwes
  rationale: Die konkrete Bedeutung „Wind“ fügt sich unmittelbar in das Bild des vorangetriebenen Stroms. Da רוּחַ zugleich „Atem“ und „Geist“ bedeuten kann, wird diese theologisch bedeutsame Mehrdeutigkeit in der Fußnote bewahrt.
- issue: Deutung des schwierigen Schlusses
  choice: Jahwes Kommen gleicht einem aufgestauten Strom, den sein Wind vorantreibt
  alternative: Wenn der Feind wie eine Flut kommt, richtet der Geist Jahwes ein Feldzeichen gegen ihn auf
  rationale: Im hebräischen Text steht kein ausdrückliches Wort für „Feind“. Die Hauptfassung folgt daher der syntaktisch und lexikalisch näherliegenden Strommetapher, ohne die bekannte traditionelle Deutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. „Vom Aufgang der Sonne her“ erhält das hebräische Bild; „aufgestauter Strom“ ist anschaulich, ohne die schwierige Stelle konfessionell festzulegen. Die Form „Jahwe“ entspricht dem üblichen deutschen Gebrauch.
