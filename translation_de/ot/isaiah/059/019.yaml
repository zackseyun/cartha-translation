  to: Dann werden sie vom Westen her den Namen Jahwes fürchten und vom Aufgang der Sonne her[a] seine Herrlichkeit. Denn er wird kommen wie ein reißender Strom, den der Atem Jahwes antreibt.[b][c]
  rationale: Die Revision ersetzt die nicht sicher belegte Vorstellung eines „aufgestauten“ Stroms durch das natürliche und im Kontext tragfähige Bild eines „reißenden Stroms“. Zugleich wird רוּחַ im Haupttext als „Atem“ wiedergegeben, damit die poetische, konkrete Bildsprache erhalten bleibt; die Fußnote bewahrt die ebenfalls mögliche Lesung „Geist“ sowie die syntaktische Unsicherheit. Die traditionelle Feind-/Feldzeichen-Deutung bleibt ausdrücklich als alternative Auslegung markiert.
