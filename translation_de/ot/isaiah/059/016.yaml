source:
  edition: WLC
  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: de
  text: Er sah, dass kein Mann da war[a], und er war entsetzt, dass niemand Fürsprache einlegte[b]. Da brachte ihm sein eigener Arm Rettung, und seine Gerechtigkeit[c] stützte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „kein Mann“. Gemeint ist hier, dass kein menschlicher Handelnder da war.
    reason: cultural_note
  - marker: b
    text: 'Oder: „dass niemand eingriff“ oder „dass niemand für andere eintrat“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „seine Rechtschaffenheit“. Das hebräische Wort kann sowohl Gerechtigkeit als auch gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mann
  rationale: Die maskuline Singularform wird formal bewahrt. Im Zusammenhang bezeichnet sie jedoch nicht ausschließlich einen männlichen Erwachsenen, sondern das Fehlen jedes menschlichen Handelnden; dies wird in einer Fußnote erläutert.
- source_word: וַיִּשְׁתּוֹמֵם
  choice: war entsetzt
  rationale: Das Verb bezeichnet betroffenes, erschüttertes Staunen. „War entsetzt“ gibt sowohl die Überraschung als auch das moralische Gewicht des Zusammenhangs wieder.
- source_word: מַפְגִּיעַ
  choice: der Fürsprache einlegte
  rationale: Das Hifil-Partizip von פגע kann jemanden bezeichnen, der zugunsten anderer eintritt, Fürsprache einlegt oder eingreift. Die gewählte Formulierung ist verständlich und wahrt den vermittelnden Aspekt.
- source_word: וַתּוֹשַׁע לֹו זְרֹעוֹ
  choice: Da brachte ihm sein eigener Arm Rettung
  rationale: 'Die Formulierung bewahrt das Bild des Arms als wirksamer Kraft und gibt לֹו als „ihm“ wieder. „Sein eigener“ verdeutlicht den im Zusammenhang hervorgehobenen Gegensatz: Weil kein menschlicher Handelnder da war, handelte der HERR selbst.'
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl die moralische Richtigkeit als auch das gerechte Handeln besser ab als eine künstliche Aufspaltung. Die mögliche Bedeutungsnuance „Recht“ wird in der Fußnote genannt.
- source_word: סְמָכָתְהוּ
  choice: stützte ihn
  rationale: Die Wendung erhält das konkrete Bild des Stützens und gibt das Suffix der dritten Person Singular ausdrücklich wieder.
theological_decisions:
- issue: Bezug der Pronomen und Suffixe
  choice: Die Bezüge „ihm“, „sein“ und „ihn“ gelten durchgehend dem HERRN, der selbst rettend handelt.
  alternative: Die letzten Satzglieder könnten weniger reflexiv als abstrakte Aussagen über das Wirken göttlicher Macht und Gerechtigkeit verstanden werden.
  rationale: Der unmittelbare Zusammenhang und die hebräischen Suffixe sprechen für einheitliche Bezüge. Der Zusatz „eigener“ macht die kontextuelle Betonung sichtbar, ohne eine spätere dogmatische Kategorie einzutragen.
- issue: Bedeutungsbreite von צְדָקָה
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Das Wort umfasst hier sowohl Gottes Richtigkeit als auch sein gerechtes Handeln. „Gerechtigkeit“ wahrt diese Breite; die Alternative wird als Fußnote erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die Bildsprache vom eigenen Arm und vom Stützen bleibt erhalten; erklärungsbedürftige Bedeutungsbreiten werden knapp in Fußnoten ausgewiesen.
