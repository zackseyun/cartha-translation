  text: וְ/הֻסַּ֤ג אָחוֹר֙ מִשְׁפָּ֔ט וּ/צְדָקָ֖ה מֵ/רָח֣וֹק תַּעֲמֹ֑ד כִּֽי כָשְׁלָ֤ה בָֽ/רְחוֹב֙ אֱמֶ֔ת וּ/נְכֹחָ֖ה לֹא תוּכַ֥ל לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: de
  text: Und das Recht wird zurückgedrängt, und die Gerechtigkeit steht in der Ferne; denn die Wahrheit ist auf dem öffentlichen Platz[a] gestrauchelt, und die Aufrichtigkeit kann nicht eintreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf der Straße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻסַּג אָחוֹר
  choice: So wird ... zurückgedrängt
  rationale: Der Hophal von סוג bezeichnet ein passives Zurückbewegen oder Verdrängen; „zurückgedrängt“ bewahrt die passive, personifizierende Darstellung. Das einleitende וְ führt hier folgernd aus dem vorherigen Zusammenhang weiter und wird natürlich mit „So“ wiedergegeben.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im gesellschaftlich-rechtlichen Zusammenhang bezeichnet מִשְׁפָּט die gerechte Rechtsordnung beziehungsweise Rechtsprechung. „Das Recht“ ist im Deutschen idiomatisch und bleibt von צְדָקָה unterscheidbar.
- source_word: וּצְדָקָה
  choice: die Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die moralisch-soziale Bedeutung und die Unterscheidung vom vorangehenden מִשְׁפָּט.
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: bleibt in der Ferne stehen
  rationale: Die Formulierung erhält das anschauliche Personifikationsbild des Stehens in weiter Entfernung; „bleibt“ macht den resultierenden Zustand im Deutschen natürlich deutlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet den zuvor beschriebenen Zustand.
- source_word: כָשְׁלָה
  choice: ist ... gestrauchelt
  rationale: כשל bezeichnet Straucheln oder Stolpern. „Gestrauchelt“ bewahrt das Bild, ohne einen vollständigen Sturz zu behaupten.
- source_word: בָרְחוֹב
  choice: auf dem öffentlichen Platz
  rationale: רְחוֹב kann eine breite Straße oder einen offenen städtischen Platz bezeichnen. Im Kontext öffentlicher Rechtspflege bringt „öffentlicher Platz“ die gesellschaftliche Sphäre klar zum Ausdruck.
- source_word: אֱמֶת
  choice: die Wahrheit
  rationale: Hier wird Wahrheit als öffentliche moralische Wirklichkeit personifiziert; „Wahrheit“ ist die direkte und kontextuell passende Wiedergabe.
- source_word: וּנְכֹחָה
  choice: die Aufrichtigkeit
  rationale: נְכֹחָה bezeichnet Geradheit beziehungsweise das, was recht und redlich ist. „Aufrichtigkeit“ erhält das abstrakte, personifizierte Gegenstück zu „Wahrheit“.
- source_word: לֹא תוּכַל לָבוֹא
  choice: kann nicht hineingelangen
  rationale: Die Wendung schildert, dass Aufrichtigkeit keinen Zugang zur öffentlichen Sphäre findet. „Hineingelangen“ wahrt die Eintrittsmetapher, ohne ein im Hebräischen nicht ausdrücklich genanntes Ziel zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Begriffspaars מִשְׁפָּט / צְדָקָה
  choice: das Recht ... die Gerechtigkeit
  alternative: das Gericht ... die Gerechtigkeit; die Gerechtigkeit ... das rechte Handeln
  rationale: Die beiden verwandten, aber unterscheidbaren gesellschaftlich-moralischen Größen werden nicht zu einem einzigen Begriff zusammengezogen. „Recht“ hebt bei מִשְׁפָּט die öffentliche Rechtsordnung hervor, während „Gerechtigkeit“ für צְדָקָה die breitere moralische Qualität wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit durchgehender Personifikation der vier abstrakten Größen. Die Satzstruktur folgt dem hebräischen Parallelismus, bleibt aber idiomatisch. Keine Fußnoten nötig, da die möglichen Bedeutungsbreiten von רְחוֹב und נְכֹחָה im Haupttext sachgerecht wiedergegeben werden.
