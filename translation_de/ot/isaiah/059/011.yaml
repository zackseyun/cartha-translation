id: ISA.59.11
reference: Isaiah 59:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: de
  text: Wir alle brummen wie Bären, und wie Tauben klagen wir unablässig. Wir hoffen[a] auf Recht, doch es ist nicht da; auf Rettung[b], doch sie ist fern von uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wir warten auf Recht; das hebräische Verb kann sowohl hoffendes Erwarten als auch Warten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Heil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  choice: brummen
  rationale: Das Verb bezeichnet ein lautes, dumpfes Tönen oder Murmeln. Im Vergleich mit Bären gibt „brummen“ das Tierbild im Deutschen natürlich wieder, ohne es durch „brüllen“ zu verstärken.
- source_word: כַדֻּבִּים כֻּלָּנוּ
  choice: wir alle … wie Bären
  rationale: Der Plural des Vergleichsbildes und der gemeinschaftliche Charakter der Klage bleiben erhalten.
- source_word: וְכַיּוֹנִים הָגֹה נֶהְגֶּה
  choice: und wie Tauben klagen wir unablässig
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt beziehungsweise intensiviert die Handlung. „Klagen wir unablässig“ vermittelt den anhaltenden Klagelaut verständlich und wahrt das Taubenbild.
- source_word: נְקַוֶּה
  choice: wir hoffen
  rationale: קוה kann sowohl hoffendes Erwarten als auch Warten bezeichnen. „Hoffen“ passt zur enttäuschten Erwartung des Zusammenhangs; die Bedeutungsalternative wird in der Fußnote bewahrt.
- source_word: לַמִּשְׁפָּט
  choice: auf Recht
  rationale: מִשְׁפָּט bezeichnet hier die erwartete gerechte Ordnung beziehungsweise Rechtsschaffung, nicht nur ein einzelnes Gerichtsurteil.
- source_word: וָאַיִן
  choice: doch es ist nicht da
  rationale: Die adversative Formulierung bringt die enttäuschte Erwartung natürlich zum Ausdruck und gibt die Abwesenheit des erhofften Rechts direkt wieder.
- source_word: לִישׁוּעָה
  choice: auf Rettung
  rationale: יְשׁוּעָה kann Rettung oder Heil bezeichnen. „Rettung“ ist im unmittelbaren Kontext konkreter und alltagssprachlich klar, während die breitere Alternative in der Fußnote erhalten bleibt.
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: doch sie ist fern von uns
  rationale: Die Formulierung bewahrt die räumliche Metapher des hebräischen Prädikats und bezieht das feminine Pronomen eindeutig auf „Rettung“.
theological_decisions:
- issue: Wiedergabe von יְשׁוּעָה in der prophetischen Klage
  choice: Rettung
  alternative: Heil
  rationale: Der unmittelbare Zusammenhang handelt von ersehnter Befreiung und Rechtsschaffung. „Rettung“ wahrt diesen konkreten Sinn, ohne die breitere theologische Bedeutung des Begriffs auszuschließen; „Heil“ bleibt als Alternative ausgewiesen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die beiden Tierlaute werden nicht mechanisch gleich wiedergegeben: „brummen“ bewahrt den dumpfen Bärenlaut, während „klagen“ beim Taubenbild den Klageton des Zusammenhangs hervorhebt. Die verdichtete zweite Vershälfte und ihre enttäuschte Erwartung bleiben erhalten.'
