  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: de
  text: 'Darum ist das Recht fern von uns[a], und die Gerechtigkeit erreicht uns nicht[b]. Wir hoffen auf Licht, doch siehe: Finsternis; auf hellen Schein, doch wir gehen in tiefem Dunkel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gericht ist fern von uns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gerechtigkeit holt uns nicht ein“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in dichter Finsternis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im Zusammenhang bezeichnet das Wort die vermisste gerechte Rechtsordnung und Rechtsprechung. „Das Recht“ ist im Deutschen natürlich und hält die Bedeutung von צְדָקָה unterscheidbar.
- source_word: רָחַק
  choice: ist fern von
  rationale: Das Perfekt beschreibt hier einen bestehenden Zustand; die knappe Gegenwartsform bildet ihn idiomatisch ab.
- source_word: צְדָקָה
  choice: die Gerechtigkeit
  rationale: Die Wiedergabe bewahrt die begriffliche Unterscheidung zum vorausgehenden מִשְׁפָּט, ohne die semantische Überschneidung zu leugnen.
- source_word: תַשִּׂיגֵנוּ
  choice: erreicht uns nicht
  rationale: Das Hifil von נשׂג kann „einholen“ oder „erreichen“ bedeuten. Hier ist „erreicht uns nicht“ natürlich und bewahrt das Bild, dass die Gerechtigkeit nicht zu den Sprechenden gelangt.
- source_word: נְקַוֶּה
  choice: wir hoffen auf
  rationale: קוה verbindet erwartendes Warten mit Hoffnung; im Klagezusammenhang tritt die ersehnte Erwartung hervor.
- source_word: אוֹר
  choice: Licht
  rationale: Die direkte Wiedergabe erhält sowohl das konkrete Bild als auch seine metaphorische Bedeutung von Rettung und Wohlergehen.
- source_word: וְהִנֵּה
  choice: doch siehe
  rationale: „Siehe“ bewahrt den hinweisenden, überraschenden Nachdruck der Partikel; „doch“ macht den im Parallelismus klaren Gegensatz idiomatisch sichtbar.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ trägt in würdigem modernem Deutsch das starke Gegenbild zum Licht.
- source_word: נְגֹהוֹת
  choice: heller Schein
  rationale: Der poetische Plural bezeichnet strahlende Helligkeit. „Heller Schein“ ist verständlich und erhält den poetischen Kontrast.
- source_word: אֲפֵלוֹת
  choice: tiefes Dunkel
  rationale: Das Wort meint dichte, bedrückende Dunkelheit; „tiefes Dunkel“ gibt die Intensität natürlich wieder.
- source_word: נְהַלֵּךְ
  choice: wir gehen
  rationale: „Gehen“ bewahrt das hebräische Bewegungsbild und klingt hier im Deutschen natürlicher als „wandeln“.
theological_decisions:
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: „das Recht“ und „die Gerechtigkeit“
  alternative: „das Gericht“ und „die Gerechtigkeit“ oder beide Begriffe mit „Gerechtigkeit“ wiederzugeben
  rationale: Die getrennten deutschen Begriffe bewahren den poetischen Parallelismus und die Unterscheidung zwischen gerechter Rechtsordnung beziehungsweise Rechtsprechung und umfassender Gerechtigkeit, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Bildgehalt von תַשִּׂיגֵנוּ
  choice: „erreicht uns nicht“
  alternative: „holt uns nicht ein“
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Haupttext wählt das im Zusammenhang natürliche „erreicht“, während die Fußnote die dynamischere Lesart offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Parallelstruktur. Der Doppelpunkt nach „siehe“ erhält die abrupte Wahrnehmung des hebräischen Textes; „Finsternis“ und „tiefes Dunkel“ unterscheiden die beiden Dunkelheitsbegriffe.
