source:
  edition: WLC
  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: de
  text: Sondern eure Verfehlungen haben euch von eurem Gott getrennt, und eure Sünden haben sein Angesicht vor euch verborgen, sodass er nicht hört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Hören“ kann hier im Zusammenhang auch das erhörende Hören von Gebeten meinen: „… sodass er euch nicht erhört.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch
  rationale: 'Die Verbindung stellt im Kontext den Gegensatz zu Vers 1 her: Nicht Gottes Unvermögen, sondern die Verfehlungen des Volkes sind die Ursache. „Doch“ gibt diesen adversativen Sinn natürlich und würdig wieder.'
- source_word: עֲוֺנֹתֵיכֶם
  choice: eure Verfehlungen
  rationale: עָוֹן bezeichnet schuldhafte Verkehrtheit bzw. Vergehen. „Verfehlungen“ bewahrt gegenüber dem folgenden „Sünden“ eine gewisse lexikalische Unterscheidung, ohne das im modernen Deutsch ungebräuchliche „Missetaten“ zu verwenden.
- source_word: הָיוּ מַבְדִּלִים
  choice: haben … getrennt
  rationale: Die Verbindung von היה mit Partizip beschreibt den eingetretenen bzw. fortwirkenden Zustand des Trennens. Das deutsche Perfekt ist hier natürlich und gibt die resultierende Trennung angemessen wieder; eine formale Nachbildung wie „sind Trennende geworden“ wäre unidiomatisch.
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: euch von eurem Gott
  rationale: Die hebräische Zwischen-Formel wird im Deutschen idiomatisch mit „jemanden von jemandem trennen“ wiedergegeben. Die relationale Aussage bleibt vollständig erhalten.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner Form eindeutig den einen Gott Israels; der Possessivsuffix wird mit „eurem“ wiedergegeben.
- source_word: וְחַטֹּאותֵיכֶם
  choice: und eure Sünden
  rationale: חַטָּאת bezeichnet hier konkrete Sünden bzw. schuldhafte Taten. „Sünden“ ist die klare und etablierte deutsche Entsprechung.
- source_word: הִסְתִּירוּ פָנִים
  choice: haben sein Angesicht … verborgen
  rationale: Der hebräische Text hat wörtlich „haben Angesicht verborgen“. Das kontextuell vorausgesetzte Possessivpronomen wird ergänzt. „Angesicht“ erhält das ausdrücklich anthropomorphe und literarisch-theologische Bild besser als das neutralere „Gesicht“.
- source_word: מִכֶּם
  choice: vor euch
  rationale: Beim deutschen Ausdruck „sein Angesicht verbergen“ ist „vor euch“ idiomatisch und bezeichnet wie das hebräische מִן den Entzug der zugewandten Gegenwart.
- source_word: מִשְּׁמוֹעַ
  choice: sodass er nicht hört
  rationale: מִן mit dem Infinitiv שׁמע bezeichnet hier die Folge bzw. Wirkung des Verbergens. „Sodass er nicht hört“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne festzulegen, ob bloß akustisches Hören oder erhörendes Zuhören gemeint ist.
theological_decisions:
- issue: Anthropomorphe Rede vom göttlichen Angesicht
  choice: „sein Angesicht vor euch verborgen“ beibehalten
  alternative: „sich von euch abgewandt“ oder „seine Gunst entzogen“
  rationale: Der hebräische Text verwendet ausdrücklich das Bild des göttlichen Angesichts. Es wird nicht in eine abstrakte Aussage über Gegenwart oder Gunst aufgelöst, damit die bildhafte und relationale Spannung erhalten bleibt.
- issue: Ursache der Trennung von Gott
  choice: Die Verfehlungen und Sünden des Volkes werden als Ursache genannt
  alternative: Eine Formulierung, die Gott selbst als Ursache der Trennung erscheinen lässt
  rationale: Im Gegensatz zu Vers 1 erklärt der Text die gestörte Beziehung durch menschliche Schuld. Die Übersetzung wahrt diese Kausalität, ohne darüber hinaus eine systematisch-theologische Erklärung einzutragen.
- issue: Bedeutung von Gottes Nichthören
  choice: „sodass er nicht hört“
  alternative: „sodass er euch nicht erhört“
  rationale: „Erhören“ wäre im Kontext plausibel, würde aber die mögliche Bedeutungsbreite von שׁמע stärker auf die Antwort auf Gebet festlegen. „Nicht hört“ bewahrt die knappe und spannungsreiche Formulierung des Ausgangstextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Angesicht“ ist bewusst gehobener als die übrige Sprache, weil es das zentrale hebräische Bild trägt. Die Syntax ist natürlich deutsch und vermeidet eine unverständliche formale Nachbildung von היה plus Partizip.
