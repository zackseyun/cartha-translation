  text: בֵּיצֵ֤י צִפְעוֹנִי֙ בִּקֵּ֔עוּ וְ/קוּרֵ֥י עַכָּבִ֖ישׁ יֶאֱרֹ֑גוּ הָ/אֹכֵ֤ל מִ/בֵּֽיצֵי/הֶם֙ יָמ֔וּת וְ/הַ/זּוּרֶ֖ה תִּבָּקַ֥ע אֶפְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
translation:
  language: de
  text: Sie brüten Eier einer Giftschlange[a] aus und weben Spinnennetze. Wer von ihren Eiern isst, stirbt; und wenn etwas zerdrückt wird, bricht eine Viper hervor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Eier einer Viper“. Das hebräische Wort bezeichnet eine giftige Schlange; die genaue Art ist nicht sicher bestimmbar.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck für „etwas zerdrückt wird“ ist schwierig. Im Zusammenhang sind wohl die zuvor genannten Eier gemeint; die Schlusszeile beschreibt, dass aus dem Zerdrückten eine giftige Schlange hervorbricht.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: Eier einer Giftotter
  rationale: Die Konstruktverbindung bezeichnet Eier einer giftigen Schlange. „Giftotter“ ist im modernen Deutschen verständlich und bewahrt den generischen Singular des Hebräischen, ohne eine zoologisch zu genaue Artbestimmung vorzutäuschen.
- source_word: בִּקֵּעוּ
  choice: brüten … aus
  rationale: Das Verb bedeutet grundlegend „spalten/aufbrechen lassen“; bei Eiern gibt „ausbrüten“ den kontextuellen Vorgang natürlich wieder.
- source_word: קוּרֵי עַכָּבִישׁ
  choice: Spinnennetze
  rationale: Die Wendung bezeichnet das Fadengewebe einer Spinne. „Spinnennetze“ ist natürliches, allgemein verständliches Deutsch und passt zum Verb „weben“.
- source_word: יֶאֱרֹגוּ
  choice: weben
  rationale: Das Verb bedeutet „weben“ und erhält die konkrete Bildsprache sowie den poetischen Parallelismus.
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם
  choice: Wer von ihren Eiern isst
  rationale: Das substantivierte Partizip ist generisch. „Wer … isst“ gibt diese allgemeine Aussage idiomatisch wieder; „von“ bildet die Präposition מִן ab.
- source_word: יָמוּת
  choice: stirbt
  rationale: Das Präsens bringt im Deutschen die sprichwortartige Gewissheit der poetischen Aussage prägnant zum Ausdruck.
- source_word: וְהַזּוּרֶה
  choice: und wird eines zerdrückt
  rationale: Die schwierige Form wird kontextgemäß auf eines der zuvor genannten Eier bezogen. Die konditionale Formulierung ist im Deutschen natürlich, ohne die zugrunde liegende Bildfolge zu verändern.
- source_word: תִּבָּקַע אֶפְעֶה
  choice: schlüpft eine Viper
  rationale: 'Die feminine Verbform lässt sich mit „Viper“ als Subjekt verstehen: Beim Zerdrücken bricht die Giftschlange aus dem Ei hervor. „Schlüpft“ gibt diesen Vorgang im Eierkontext idiomatisch wieder.'
