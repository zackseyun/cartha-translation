base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/003.yaml
  text: For your hands are defiled with blood[a], and your fingers with iniquity; your lips have spoken falsehood[c][b], your tongue mutters injustice.
translation:
  language: de
  text: Denn eure Hände sind mit Blut befleckt[a] und eure Finger mit Schuld. Eure Lippen haben Lügen geredet, eure Zunge murmelt Unrecht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Handflächen“. Das hebräische Wort bezeichnet genauer die Innenflächen der Hände.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „spricht Unrecht aus“. Das hebräische Verb kann „murmeln“, „leise reden“ oder allgemeiner „äußern“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anklage ein und bewahrt den kausalen Zusammenhang.
- source_word: כַפֵּיכֶם
  choice: eure Hände
  rationale: Das hebräische Wort bezeichnet genauer die Handflächen; im Deutschen ist „Hände“ in diesem Bild natürlicher und umfasst den konkreten Sinn.
- source_word: נְגֹאֲלוּ בַדָּם
  choice: sind mit Blut befleckt
  rationale: „Befleckt“ gibt die Verunreinigung durch Blut anschaulich wieder und trägt zugleich die moralische Bedeutung; es bezeichnet nicht nur eine äußerliche Verfärbung.
- source_word: וְאֶצְבְּעוֹתֵיכֶם בֶּעָוֹן
  choice: und eure Finger mit Schuld
  rationale: Die Körpermetaphorik und der Parallelismus bleiben erhalten. עָוֹן kann Vergehen oder daraus erwachsende Schuld bezeichnen; „Schuld“ passt zur Vorstellung befleckter Glieder, ohne die forensische Dimension auszublenden.
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ שֶׁקֶר
  choice: Eure Lippen reden Lüge
  rationale: Bewahrt die konkrete Körpermetaphorik. Das deutsche Präsens formuliert die fortdauernde prophetische Anklage natürlich; „Lüge“ ist klarer und idiomatischer als „Falschheit“.
- source_word: לְשׁוֹנְכֶם עַוְלָה תֶהְגֶּה
  choice: eure Zunge murmelt Unrecht
  rationale: „Murmelt“ erhält das Bild leisen oder halblauten Äußerns von הגה; „Unrecht“ gibt den ethisch-sozialen Sinn von עַוְלָה in natürlichem Deutsch wieder.
theological_decisions:
- issue: Moralische Begriffe in der prophetischen Anklage
  choice: Die gestaffelten Begriffe als „Blut“, „Schuld“, „Lüge“ und „Unrecht“ unterscheiden.
  alternative: Alle Begriffe unter einer allgemeinen Bezeichnung wie „Bosheit“ oder in traditioneller Begrifflichkeit wie „Missetat“ und „Ungerechtigkeit“ zusammenführen.
  rationale: Die Übersetzung bewahrt die unterschiedlichen Bilder und die ethische wie auch forensische Spannung des Hebräischen, ohne spätere Lehrsysteme einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Körperbilder Hände/Finger und Lippen/Zunge bleiben erhalten. Kurze Hauptsätze geben den eindringlichen Rhythmus der prophetischen Anklage wieder.
