  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: de
  text: Wir tasten wie Blinde an der Wand entlang; wie Menschen ohne Augen tasten wir. Am Mittag straucheln wir wie in der Dämmerung; unter den Lebenskräftigen[a] sind wir wie Tote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »an fruchtbaren Orten«; das hebräische Wort ist selten und seine Bedeutung unsicher. Es kann auch »unter den Starken/Lebenskräftigen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: wir tasten / tasten wir umher
  rationale: Der Piel-Stamm bezeichnet ein suchendes Tasten mit den Händen. Die leichte Variation ergibt natürliches Deutsch, während die hebräische Wiederholung erhalten bleibt.
- source_word: כַעִוְרִים
  choice: wie Blinde
  rationale: Die substantivierte deutsche Adjektivform gibt den kollektiven Plural knapp und ohne zusätzliche Geschlechtsmarkierung wieder.
- source_word: קִיר
  choice: nach der Wand
  rationale: Beim deutschen Verb „tasten“ bezeichnet „nach“ das gesuchte Orientierungsobjekt idiomatisch; der bestimmte Artikel entspricht der konkreten Bildvorstellung.
- source_word: וּכְאֵין עֵינַיִם
  choice: wie Menschen ohne Augen
  rationale: Die Formulierung bewahrt den Vergleich und die drastische Steigerung des Bildes, ohne sie erklärend abzuschwächen.
- source_word: כָּשַׁלְנוּ
  choice: wir straucheln
  rationale: „Straucheln“ gibt das körperliche Stolpern und zugleich das Versagen wieder und passt zum Bild fehlender Orientierung.
- source_word: בַצָּהֳרַיִם
  choice: am hellen Mittag
  rationale: „Mittag“ bezeichnet die hellste Tageszeit; „hellen“ macht den im Kontext beabsichtigten Gegensatz zur Dämmerung im Deutschen unmittelbar deutlich.
- source_word: כַנֶּשֶׁף
  choice: wie in der Dämmerung
  rationale: נשף bezeichnet die lichtarme Übergangszeit, ohne hier zwingend Morgen- oder Abenddämmerung festzulegen.
- source_word: בָּאַשְׁמַנִּים
  choice: unter den Kräftigen
  rationale: Das seltene und unsichere Wort wird im Kontext als Bezeichnung kräftiger beziehungsweise lebensstarker Menschen verstanden. Die Unsicherheit und eine wesentliche örtliche Alternative werden in der Fußnote offengelegt.
- source_word: כַמֵּתִים
  choice: wie Tote
  rationale: Die knappe substantivierte Form bewahrt den schroffen Gegensatz zwischen den Kräftigen und den Toten.
