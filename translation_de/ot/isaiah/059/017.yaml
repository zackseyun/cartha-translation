base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: de
  text: Er zog Gerechtigkeit wie einen Brustpanzer an und setzte sich einen Helm des Heils[b] auf. Er zog Gewänder der Rache als Kleidung an und hüllte sich in Eifer[c] wie in einen Mantel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „der Rettung“, „der Befreiung“ oder „des Sieges“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Eifersucht“, im Sinn leidenschaftlichen Eifers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Bewahrt den grundlegenden Sinn moralischer und rechtlicher Richtigkeit; im Kontext wird Gottes Gerechtigkeit als wirksames Handeln dargestellt.
- source_word: שִׁרְיָן
  choice: Brustpanzer
  rationale: Bezeichnet eine den Oberkörper schützende Rüstung; „Brustpanzer“ erhält das konkrete Kriegerbild und ist im Deutschen verständlich.
- source_word: כּוֹבַע
  choice: Helm
  rationale: Die übliche Bezeichnung für schützende Kopfbedeckung im Kampf.
- source_word: יְשׁוּעָה
  choice: Heil
  rationale: Deckt Gottes rettende Befreiung ab und bewahrt zugleich die im Deutschen etablierte theologische Ausdrucksweise; der kriegerische Kontext lässt auch „Sieg“ oder „Rettung“ zu.
- source_word: בִּגְדֵי נָקָם
  choice: Gewänder der Vergeltung
  rationale: Gibt die Genitivverbindung gehoben und direkt wieder, ohne die Härte des göttlichen Vergeltungshandelns abzuschwächen.
- source_word: תִּלְבֹּשֶׁת
  choice: als seine Kleidung
  rationale: Gibt das appositionelle Verhältnis zum vorhergehenden Ausdruck natürlich wieder und erhält die Wiederholung des Bekleidungsmotivs.
- source_word: וַיַּעַט
  choice: hüllte sich in
  rationale: Drückt das Umgeben beziehungsweise Einhüllen mit einem äußeren Kleidungsstück anschaulich aus.
- source_word: מְעִיל
  choice: Mantel
  rationale: Natürliche deutsche Entsprechung für ein äußeres Gewand und passend zum Vergleich.
- source_word: קִנְאָה
  choice: Eifer
  rationale: Vermittelt hier leidenschaftliche, entschlossene Hingabe; „Eifersucht“ bleibt lexikalisch möglich, könnte im Deutschen jedoch unangemessen kleinlich wirken.
theological_decisions:
- issue: Bild Gottes als göttlicher Krieger
  choice: 'Die konkrete Rüstungs- und Gewandmetaphorik bleibt erhalten: Gott legt Gerechtigkeit, Heil, Vergeltung und Eifer an.'
  alternative: Die Bilder durch abstrakte Aussagen über Gottes Eigenschaften oder Handeln wiedergeben.
  rationale: Der hebräische Text schildert Gottes Eingreifen bewusst als das Ausrüsten eines Kriegers. Eine abstrakte Wiedergabe würde die theologische Spannung und Kraft des Bildes abschwächen.
- issue: Bedeutungsbreite von יְשׁוּעָה
  choice: Heil
  alternative: Rettung, Befreiung oder Sieg
  rationale: „Heil“ wahrt die breite Bedeutung göttlicher Rettung, während eine Fußnote die im militärischen Zusammenhang mögliche Nuance von Sieg oder Befreiung offenhält.
- issue: Bedeutungsbreite von קִנְאָה
  choice: Eifer
  alternative: Eifersucht
  rationale: Im Zusammenhang bezeichnet das Wort Gottes intensive, entschlossene Leidenschaft. Die alternative Bedeutung wird nicht ausgeschlossen, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkreter Kriegerbildsprache. Die Satzstruktur folgt dem hebräischen Parallelismus, wird jedoch für flüssige deutsche Lesbarkeit in zwei Sätze gegliedert. Alle lexikalisch gewichtigen Alternativen werden in Fußnoten offengehalten.
