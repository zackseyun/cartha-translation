base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: de
  text: Ihre Füße laufen zum Bösen, und sie eilen, unschuldiges Blut zu vergießen; ihre Gedanken sind Gedanken des Unrechts[a]; Verwüstung und Zerstörung sind auf ihren Straßen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Pläne sind Pläne des Unrechts.“ Das hebräische Wort kann Gedanken, Pläne oder Vorhaben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf ihren Wegen“. Das hebräische Wort bezeichnet wörtlich Straßen oder gebahnte Wege und deutet hier zugleich ihren Lebenswandel an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: ihre Füße
  rationale: Das konkrete Körperbild und seine metonymische Aussage über ihr Verhalten bleiben erhalten.
- source_word: לָרַע יָרֻצוּ
  choice: laufen zum Bösen
  rationale: Die Richtungsangabe und das anschauliche Verb werden eng am Hebräischen wiedergegeben, ohne das interpretierende „Böses zu tun“ einzufügen.
- source_word: וִימַהֲרוּ
  choice: und sie eilen
  rationale: Gibt die zusätzliche Betonung von Schnelligkeit und Entschlossenheit wieder.
- source_word: לִשְׁפֹּךְ דָּם נָקִי
  choice: unschuldiges Blut zu vergießen
  rationale: Entspricht der geläufigen deutschen Wendung und bewahrt das Bild des hebräischen Ausdrucks.
- source_word: מַחְשְׁבוֹתֵיהֶם מַחְשְׁבוֹת אָוֶן
  choice: ihre Gedanken sind Gedanken des Unrechts
  rationale: Die rhetorische Wiederholung von מַחְשְׁבוֹת bleibt erhalten; „Unrecht“ bringt im Kontext den moralischen Gehalt von אָוֶן zum Ausdruck, ohne die Formulierung unnötig zuzuspitzen.
- source_word: שֹׁד וָשֶׁבֶר
  choice: Verwüstung und Zerstörung
  rationale: Das nahe bedeutungsverwandte Begriffspaar wird als poetische Häufung zerstörerischer Folgen wiedergegeben.
- source_word: בִּמְסִלּוֹתָם
  choice: auf ihren Straßen
  rationale: „Straßen“ bewahrt das konkrete Wegbild; das im Deutschen idiomatische „auf“ entspricht hier dem hebräischen בְּ.
theological_decisions:
- issue: Moralische Charakterisierung von אָוֶן
  choice: Unrecht
  alternative: Unheil; Bosheit
  rationale: Im Zusammenhang mit bösem Handeln und unschuldigem Blut steht die moralische Bedeutung im Vordergrund. „Unrecht“ lässt zugleich die Bedeutungsbreite des Wortes eher offen als eine stärkere Festlegung auf „Bosheit“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter hebräischer Bildsprache und Wiederholung. Die Fußnoten stehen jeweils unmittelbar an der mehrdeutigen Wendung.
