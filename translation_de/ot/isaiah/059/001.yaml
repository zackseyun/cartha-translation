id: ISA.59.1
reference: Isaiah 59:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֛ן לֹֽא קָצְרָ֥ה יַד יְהוָ֖ה מֵֽ/הוֹשִׁ֑יעַ וְ/לֹא כָבְדָ֥ה אָזְנ֖/וֹ מִ/שְּׁמֽוֹעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/001.yaml
  text: Look[a], Yahweh’s hand is not too short to save[b], nor is his ear too dull to hear.
translation:
  language: de
  text: Siehe[a], die Hand Jahwes ist nicht zu kurz, um zu retten, und sein Ohr ist nicht zu schwer, um zu hören.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja“ beziehungsweise „Gewiss“. Die hebräische Partikel leitet eine nachdrückliche Aussage ein und kann zugleich die Aufmerksamkeit auf das Folgende lenken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher Sinn: „Jahwes Hand ist nicht vom Retten her kurz geworden, und sein Ohr ist nicht vom Hören her schwer geworden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die einleitende Partikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. „Siehe“ ist im Deutschen würdevoll und als biblisches Aufmerksamkeitssignal weiterhin verständlich.
- source_word: קָצְרָה יַד
  choice: die Hand … ist nicht zu kurz
  rationale: Die konkrete Metapher bleibt erhalten und bezeichnet im Zusammenhang mangelnde Fähigkeit oder Reichweite; die Verneinung weist genau diese Vorstellung zurück.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵהוֹשִׁיעַ
  choice: um zu retten
  rationale: Die Konstruktion bezeichnet hier die vermeintliche Einschränkung der Fähigkeit. „Retten“ gibt den Hifil von ישׁע direkt und im Deutschen natürlich wieder.
- source_word: כָבְדָה אָזְנוֹ
  choice: sein Ohr ist nicht zu schwer
  rationale: Die wörtliche Körpermetapher des schweren Ohres wird bewahrt, statt sie deutend mit „schwerhörig“ oder „unaufmerksam“ aufzulösen.
- source_word: מִשְּׁמוֹעַ
  choice: um zu hören
  rationale: „Hören“ entspricht dem hebräischen Verb unmittelbar und bewahrt die Parallelität zu „um zu retten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ wahrt den Charakter als Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Gottes Hand und Ohr
  choice: Bewahrung der anthropomorphen Bildsprache
  alternative: Deutende Wiedergabe als Gottes Macht und Bereitschaft zu hören
  rationale: Der Vers spricht bildhaft von Hand und Ohr. Diese Bilder werden nicht in abstrakte theologische Aussagen aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter hebräischer Bildsprache. „Siehe“ markiert den feierlich-nachdrücklichen Auftakt; die ungewöhnliche Wendung vom „schweren“ Ohr bleibt wegen der Parallelität und Quellennähe erhalten.
