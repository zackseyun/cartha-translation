  source_fidelity: Der Entwurf trifft die Satzfolge, die Wiederholung von „Frieden“, מִשְׁפָּט als ethisch-soziales „Recht“ sowie den kollektiven Bezug des hebräischen Singulars בָּהּ im Wesentlichen. Die Wendung „Ihre Pfade haben sie sich krumm gemacht“ gibt jedoch die Handlung nicht klar genug wieder und klingt im Deutschen so, als hätten sie sich selbst verunstaltet. „krumm gebogen“ macht das Objekt und die kausative Aussage von עִקְּשׁוּ deutlich. Für מַעְגְּלוֹתָם ist „Wege“ idiomatischer als das hier unnatürlich wirkende „Bahnen“; die begriffliche Differenzierung der drei Wegwörter muss im Deutschen nicht künstlich erzwungen werden.
  naturalness: „Auf ihren Bahnen gibt es kein Recht“ und besonders „Ihre Pfade haben sie sich krumm gemacht“ wirken im modernen Standarddeutsch steif beziehungsweise semantisch missverständlich. „Auf ihren Wegen ist kein Recht“ und „Ihre Pfade haben sie sich krumm gebogen“ sind würdig, klar und poetisch.
