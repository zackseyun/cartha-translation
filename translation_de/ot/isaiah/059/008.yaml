- from: Den Weg des Friedens kennen sie nicht, und auf ihren Bahnen gibt es kein Recht[a]. Ihre Pfade haben sie sich krumm gemacht; wer auf ihnen[b] geht, kennt keinen Frieden.
  to: Den Weg des Friedens kennen sie nicht, und auf ihren Wegen ist kein Recht[a]. Ihre Pfade haben sie sich krumm gebogen; wer auf ihnen[b] geht, kennt keinen Frieden.
  rationale: Die Überarbeitung beseitigt die missverständliche reflexive Formulierung, indem sie die Pfade eindeutig als Objekt des Verkrümmens benennt. „Wege“ ist für die ersten pluralischen Wegspuren natürliches modernes Deutsch, ohne die hebräische Bildsprache oder den Sinn zu verändern. Die Fußnoten bleiben an den sachlich passenden Stellen und erläutern die relevanten Alternativen.
