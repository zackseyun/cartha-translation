  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: de
  text: Den Weg des Friedens kennen sie nicht, und auf ihren Wegen ist kein Recht[a]. Ihre Pfade haben sie sich krumm gebogen; wer auf ihnen[b] geht, kennt keinen Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „in/auf ihr“; der Singular kann den beschriebenen Weg oder Verlauf zusammenfassend bezeichnen.'
    reason: textual_clarification
lexical_decisions:
- source_word: דֶּרֶךְ שָׁלוֹם
  choice: Weg des Friedens
  rationale: Bewahrt das hebräische Wegbild und die umfassende Bedeutung von שָׁלוֹם, die hier mit dem geläufigen deutschen Wort „Frieden“ angemessen wiedergegeben wird.
- source_word: לֹא יָדָעוּ
  choice: kennen sie nicht
  rationale: ידע bezeichnet hier nicht nur verstandesmäßiges Wissen, sondern auch moralische und erfahrungsmäßige Vertrautheit; „kennen“ lässt diese Weite bestehen.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im prophetischen Zusammenhang bezeichnet das Wort gerechte Ordnung und gerechtes Handeln. „Recht“ ist knapp und idiomatisch; die mögliche Wiedergabe „Urteil“ wird in einer Fußnote genannt.
- source_word: מַעְגְּלוֹתָם
  choice: auf ihren Bahnen
  rationale: „Bahnen“ gibt das Bild festgelegter Spuren oder Lebenswege wieder und unterscheidet den Ausdruck von den folgenden נְתִיבוֹת.
- source_word: נְתִיבוֹתֵיהֶם
  choice: ihre Pfade
  rationale: „Pfade“ wahrt das poetische Wegmotiv und die Unterscheidung von דֶּרֶךְ und מַעְגְּלוֹת.
- source_word: עִקְּשׁוּ לָהֶם
  choice: haben sie sich krumm gemacht
  rationale: Die Formulierung gibt sowohl das aktive Verkrümmen als auch den reflexiven Dativ לָהֶם in natürlichem Deutsch wieder.
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: wer auf ihnen geht
  rationale: Die pluralische Wiedergabe bezieht sich verständlich auf die zuvor genannten Pfade; die auffällige hebräische Singularform wird in einer Fußnote bewahrt.
- source_word: לֹא יָדַע שָׁלוֹם
  choice: kennt keinen Frieden
  rationale: Nimmt die Wortwahl des Anfangs wieder auf und bewahrt die moralisch-erfahrungsmäßige Bedeutung von ידע.
theological_decisions:
- issue: Bedeutung von מִשְׁפָּט im ethisch-sozialen Zusammenhang
  choice: Recht
  alternative: Urteil
  rationale: „Recht“ bringt die prophetische Anklage gegen ungerechte Lebensführung zur Geltung, ohne den Ausdruck auf einen einzelnen richterlichen Urteilsspruch zu verengen.
- issue: Numerus von בָּהּ nach den pluralischen Pfaden
  choice: wer auf ihnen geht
  alternative: wer auf ihr geht
  rationale: Der hebräische Singular kann den gesamten zuvor beschriebenen Wegverlauf kollektiv aufnehmen. Der deutsche Plural stellt den naheliegenden Bezug her, während die Fußnote die formale Spannung offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Wegmotiv. Die drei hebräischen Wegbezeichnungen werden durch „Weg“, „Bahnen“ und „Pfade“ unterschieden; die Wiederholung von „Frieden“ bleibt erhalten.
