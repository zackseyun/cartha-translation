  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: de
  text: 'Den Taten entsprechend wird er vergelten: Zorn seinen Gegnern, Vergeltung seinen Feinden; den Küstenländern[a] wird er heimzahlen, was ihnen gebührt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Inseln“. Das hebräische Wort kann Inseln oder ferne Küstengebiete bezeichnen; bei Jesaja meint es häufig allgemein weit entfernte Länder am Meer.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: Den Taten entsprechend
  rationale: Die gestaffelte Vergleichs- und Verhältnisformel bezeichnet den Maßstab der Vergeltung. Die knappe deutsche Fassung bewahrt den Gedanken einer den Taten entsprechenden Erwiderung, ohne das im Hebräischen nicht ausdrücklich stehende Possessivpronomen „ihren“ einzufügen.
- source_word: יְשַׁלֵּם
  choice: wird er vergelten
  rationale: Das Piel von שׁלם bezeichnet hier das Erstatten beziehungsweise Vergelten im gerichtlichen Sinn. „Vergelten“ entspricht dem gehobenen Kontext und nimmt das Leitmotiv des Verses auf.
- source_word: חֵמָה
  choice: Zorn
  rationale: „Zorn“ gibt die intensive, hier gerichtliche Erregung würdig und verständlich wieder, ohne sie psychologisch zu überzeichnen.
- source_word: לְצָרָיו
  choice: seinen Gegnern
  rationale: Der Ausdruck bezeichnet Menschen, die ihm feindlich gegenüberstehen. „Gegner“ ist im modernen Deutsch natürlich und legt keine speziellere Form der Feindschaft fest.
- source_word: גְּמוּל
  choice: Vergeltung
  rationale: Das Substantiv aus der גמל-Wortgruppe bezeichnet die entsprechende Gegenleistung oder Ahndung. „Vergeltung“ erhält das gerichtliche Motiv und die Verbindung zum Verb.
- source_word: לְאֹיְבָיו
  choice: seinen Feinden
  rationale: „Feinde“ ist die direkte und kontextgemäße Wiedergabe von אֹיְבִים.
- source_word: לָאִיִּים
  choice: den Küstenländern
  rationale: אִיִּים kann Inseln oder maritime Küstengebiete bezeichnen und steht bei Jesaja häufig für ferne Länder am Meer. „Küstenländer“ wahrt diese weitere Bedeutung.
- source_word: גְּמוּל יְשַׁלֵּם
  choice: wird er heimzahlen, was ihnen gebührt
  rationale: Die Verbindung von Substantiv und Verb verstärkt im Hebräischen den Vergeltungsgedanken. Die deutsche Formulierung vermeidet die unnatürliche Doppelung „Vergeltung vergelten“, bewahrt aber Nachdruck und Rechtsgedanken.
theological_decisions:
- issue: Bezug des Subjekts der Verben in der dritten Person Singular
  choice: Das Subjekt bleibt als „er“ unausgesprochen vorausgesetzt.
  alternative: Zur Verdeutlichung „der HERR“ ergänzen.
  rationale: Der Zusammenhang weist auf den göttlichen Krieger als Handelnden, doch im hebräischen Vers wird der Gottesname nicht erneut genannt. Die Übersetzung bewahrt diesen Text- und Diskursverlauf.
- issue: Bedeutung der einleitenden גמל-Wortgruppe
  choice: 'Sie bezeichnet den Maßstab des Gerichts: „Den Taten entsprechend“.'
  alternative: 'Formal-abstrakt: „Gemäß den Vergeltungen“.'
  rationale: Der Vers stellt eine angemessene, proportionale Vergeltung heraus. Die gewählte Form gibt diesen Sinn verständlich wieder, ohne die schwierige hebräische Konstruktion dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gerichtlichem Klang. Der Doppelpunkt und die parallelen Satzglieder erhalten die rhetorische Wucht des Hebräischen; die Schlusswendung gibt dessen betonte Wortwiederholung idiomatisch wieder.
