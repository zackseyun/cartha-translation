  to: Niemand ruft nach Gerechtigkeit[a], und niemand führt seinen Rechtsstreit redlich[b]. Sie vertrauen auf Nichtiges[c] und reden Falsches; sie sind mit Unheil schwanger und gebären Unrecht[d].
