  text: אֵין קֹרֵ֣א בְ/צֶ֔דֶק וְ/אֵ֥ין נִשְׁפָּ֖ט בֶּ/אֱמוּנָ֑ה בָּט֤וֹחַ עַל תֹּ֨הוּ֙ וְ/דַבֶּר שָׁ֔וְא הָר֥וֹ עָמָ֖ל וְ/הוֹלֵ֥יד אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: de
  text: Niemand ruft nach Gerechtigkeit[a], und niemand führt seinen Rechtsstreit redlich[b]. Sie vertrauen auf Nichtiges[c] und reden Falsches; sie sind mit Unheil schwanger und gebären Unrecht[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Recht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Niemand tritt redlich vor Gericht“ oder: „Niemand lässt sich in Treue richten“.'
    reason: lexical_alternative
  - marker: c
    text: „Nichtiges“ kann auch mit „Leeres“, „Haltloses“ oder „Vergebliches“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Bosheit“ beziehungsweise „Unheil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: ruft nach Gerechtigkeit
  rationale: קרא mit ב bezeichnet hier im gerichtlichen Zusammenhang den Ruf nach dem, was recht ist. „Gerechtigkeit“ wahrt die moralische und rechtliche Weite von צֶדֶק.
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: führt seinen Rechtsstreit in Wahrhaftigkeit
  rationale: Das Nifal von שׁפט wird forensisch als Beteiligung an einem Rechtsstreit verstanden. „Wahrhaftigkeit“ gibt אֱמוּנָה als Verlässlichkeit und Redlichkeit wieder, ohne den Ausdruck auf bloße Tatsachenwahrheit zu verengen.
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: vertrauen auf Nichtiges
  rationale: בטח bedeutet „vertrauen, sich verlassen auf“; תֹהוּ bezeichnet Leeres, Haltloses oder Nichtiges. Die substantivierte Form „Nichtiges“ ist im Deutschen natürlich und lässt die Bedeutungsbreite bestehen.
- source_word: וְדַבֶּר שָׁוְא
  choice: reden Lüge
  rationale: שָׁוְא kann Falschheit, Täuschung oder Wertloses bezeichnen. Die idiomatische Wendung „Lüge reden“ bringt hier den moralischen Vorwurf prägnant zum Ausdruck.
- source_word: הָרוֹ עָמָל
  choice: sind mit Unheil schwanger
  rationale: Die Schwangerschaftsmetapher von הרה wird ausdrücklich bewahrt. עָמָל bezeichnet hier leidbringendes, schädliches Tun und wird mit „Unheil“ breit wiedergegeben.
- source_word: וְהוֹלֵיד אָוֶן
  choice: gebären Unrecht
  rationale: Das Hifil von ילד führt das Geburtsbild fort. אָוֶן bezeichnet Unrecht, Bosheit oder verderbliches Tun; „Unrecht“ passt zum gerichtlichen Kontext und wahrt den moralischen Sinn.
theological_decisions:
- issue: Moralisch-rechtliche Begriffe im Zusammenhang gesellschaftlicher und gerichtlicher Verderbnis
  choice: צֶדֶק mit „Gerechtigkeit“ und אֱמוּנָה mit „Wahrhaftigkeit“ wiedergeben
  alternative: „Recht“ und „Redlichkeit“ beziehungsweise „Wahrheit“ verwenden
  rationale: Der Vers klagt konkrete rechtliche Verderbnis an, doch die hebräischen Begriffe reichen über den Gerichtssaal hinaus. Die gewählten Wörter bewahren diese moralisch-rechtliche Spannung, ohne sie konfessionell oder dogmatisch einzuengen.
- issue: Syntax der vier absoluten Infinitive
  choice: Im Deutschen finite Verbformen verwenden und die fortlaufende Schwangerschafts- und Geburtsmetapher erhalten
  alternative: 'Partizipial wiedergeben: „Auf Nichtiges vertrauend und Lüge redend …“'
  rationale: Die hebräischen absoluten Infinitive tragen hier verbale Aussagekraft. Finite Formen sind im modernen Deutschen deutlich natürlicher; die asyndetische Folge und die Bildsprache bleiben dennoch erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gerichtssprache bleibt erkennbar, während die Schwangerschafts- und Geburtsmetapher anschaulich bewahrt wird. Ungewöhnliche, aber bedeutungstragende Begriffe werden durch knappe Fußnoten erschlossen.
