source:
  edition: WLC
  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
translation:
  language: de
  text: gegen Jahwe aufzubegehren und ihn zu verleugnen[a], uns von unserem Gott abzuwenden und ihm nicht mehr zu folgen, von Unterdrückung und Auflehnung[b] zu reden und aus dem Herzen Lügenworte zu ersinnen und auszusprechen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm gegenüber treulos zu handeln“ beziehungsweise „gegen ihn zu lügen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Abfall“; das hebräische Wort kann ein abtrünniges Abweichen oder eine Auflehnung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „aus dem Herzen“; die Lügenworte entstehen aus der inneren Absicht und werden dann geäußert.'
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: aufzubegehren
  rationale: Das Verb bezeichnet ein schuldhaftes Übertreten mit dem Beiklang der Auflehnung. „Aufbegehren“ bewahrt diese aktive, relationale Dimension.
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: und ihn zu verleugnen
  rationale: כחש mit ב kann Leugnen, Lügen gegen jemanden oder treuloses Handeln bezeichnen. „Ihn zu verleugnen“ ist verständlich und gibt die Zurückweisung Jahwes wieder, ohne die alternative Bedeutung zu verschweigen.
- source_word: בַּיהוָה
  choice: gegen Jahwe … und ihn
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; das Pronomen verhindert im Deutschen eine schwerfällige Wiederholung.
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: uns von unserem Gott abzuwenden und ihm nicht mehr zu folgen
  rationale: Die hebräische Wendung bedeutet wörtlich, sich „von hinter“ Gott zurückzuziehen, also seine Nachfolge aufzugeben. Die Übersetzung macht Bild und Sinn in natürlichem Deutsch deutlich.
- source_word: דַּבֶּר עֹשֶׁק
  choice: von Unterdrückung … zu reden
  rationale: עֹשֶׁק bezeichnet bedrückendes oder ausbeuterisches Unrecht. Mit „von“ wird im Deutschen kenntlich, dass dies der Inhalt der Rede ist.
- source_word: וְסָרָה
  choice: und Auflehnung
  rationale: סָרָה kann Abweichen, Auflehnung oder Abfall bezeichnen. „Auflehnung“ erhält den trotzigen Sinn, ohne den Ausdruck auf einen ausschließlich religiösen Fachbegriff zu verengen.
- source_word: הֹרוֹ וְהֹגוֹ
  choice: zu ersinnen und auszusprechen
  rationale: Die beiden Formen führen von der inneren Entstehung zur Äußerung. „Ersinnen und aussprechen“ gibt diese Abfolge idiomatisch wieder.
- source_word: מִלֵּב דִּבְרֵי שָׁקֶר
  choice: aus dem Herzen Lügenworte
  rationale: „Aus dem Herzen“ bezeichnet die innere Quelle und Absicht der falschen Rede; „Lügenworte“ gibt die hebräische Genitivverbindung knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname sichtbar bleibt.
- issue: Bedeutung von כחש in der Beziehung zu Jahwe
  choice: ihn verleugnen
  alternative: gegen ihn lügen; ihm gegenüber treulos handeln
  rationale: Der Ausdruck lässt sowohl sprachliches Leugnen als auch praktisches Treuebrechen zu. Der Haupttext wählt die im Deutschen klare relationale Formulierung; die Fußnote bewahrt die Bedeutungsbreite.
- issue: Religiöse Zuspitzung von סָרָה
  choice: Auflehnung
  alternative: Abfall; Abtrünnigkeit
  rationale: Der Zusammenhang ist eindeutig auf die Untreue gegenüber Gott bezogen, doch das Nomen selbst muss nicht mit einem engeren theologischen Fachwort übersetzt werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Infinitivreihe des hebräischen Sündenbekenntnisses bleibt als fortlaufende Aufzählung erhalten. Leicht erklärende Ergänzungen wie „ihm nicht mehr“ und das Objektpronomen „sie“ dienen der natürlichen deutschen Syntax, ohne die Aussage inhaltlich festzulegen.
