  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: de
  text: Wie[c] Feuer Reisig[a] entzündet und Feuer Wasser zum Kochen bringt[b], um deinen Namen deinen Gegnern bekannt zu machen, sodass Völker vor dir erbeben –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stoppeln“ oder „dürre Zweige“. Das seltene hebräische Wort bezeichnet leicht entzündliches Material.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wasser aufwallen lässt“.'
    reason: lexical_alternative
  - marker: c
    text: In manchen Bibelausgaben wird diese Zeile als Jesaja 63,19b gezählt. Inhaltlich setzt sie die Bitte des vorausgehenden Verses fort.
    reason: verse_numbering
lexical_decisions:
- source_word: כִּקְדֹחַ
  choice: Wie … entzündet
  rationale: כְּ leitet einen Vergleich ein; der Infinitiv von קדח bezeichnet das Entzünden beziehungsweise Brennen. Die Wiedergabe erhält Bild und verbale Kraft in natürlichem Deutsch.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Direkte und kontextgemäße Wiedergabe; die Wiederholung im Hebräischen bleibt erhalten.
- source_word: הֲמָסִים
  choice: Reisig
  rationale: Das seltene und unsichere Substantiv bezeichnet im Zusammenhang leicht entzündliches Brennmaterial. „Reisig“ bewahrt das konkrete Bild, ohne die genaue Art des Materials festzulegen.
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: Feuer Wasser zum Kochen bringt
  rationale: תִּבְעֶה beschreibt hier wahrscheinlich, dass Feuer Wasser sieden oder aufwallen lässt. Die Formulierung ist idiomatisch und erhält „Feuer“ als ausdrücklich wiederholtes Subjekt.
- source_word: לְהוֹדִיעַ
  choice: bekannt zu machen
  rationale: 'Der Hifil-Infinitiv von ידע hat kausative Bedeutung: etwas beziehungsweise jemanden bekannt machen.'
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die biblische Rede vom Namen als Ausdruck von Identität und Ansehen wird nicht paraphrasiert.
- source_word: לְצָרֶיךָ
  choice: deinen Gegnern
  rationale: צַר bezeichnet einen Bedränger, Widersacher oder Feind. „Gegner“ wahrt die relationale Gegnerschaft, ohne sie unnötig auf Krieg zu verengen.
- source_word: מִפָּנֶיךָ
  choice: vor deiner Gegenwart
  rationale: Die Wendung bedeutet wörtlich „von/vor deinem Angesicht“. „Vor deiner Gegenwart“ erhält den Gedanken der machtvollen göttlichen Erscheinung.
- source_word: גּוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet hier die Völker allgemein. „Völker“ ist im Deutschen natürlich und vermeidet die mögliche moderne staatsrechtliche Verengung von „Nationen“.
- source_word: יִרְגָּזוּ
  choice: erbeben
  rationale: Das Verb umfasst Zittern, Beben und heftige Erregung. „Erbeben“ passt zur dichterischen Darstellung einer Gotteserscheinung.
theological_decisions:
- issue: Versgliederung und Zusammenhang mit der vorausgehenden Bitte
  choice: Der Vers wird als vergleichende Fortsetzung der vorausgehenden Bitte wiedergegeben, ohne deren Wortlaut in diesen Vers einzufügen.
  alternative: Den vorausgehenden Ruf, Gott möge den Himmel zerreißen und herabkommen, im Haupttext dieses Verses wiederholen.
  rationale: Der vorliegende hebräische Wortlaut setzt unmittelbar mit dem Vergleich „Wie …“ ein und bleibt syntaktisch von der vorherigen Bitte abhängig. Diese Abhängigkeit soll erkennbar bleiben, ohne zusätzlichen Text einzutragen.
- issue: Bild der göttlichen Erscheinung
  choice: Die Bilder von entzündetem Reisig und kochendem Wasser bleiben offen als Darstellung machtvoller göttlicher Selbstoffenbarung und ihrer Wirkung.
  alternative: Das Bild ausschließlich als Gericht oder ausschließlich als Reinigung auslegen.
  rationale: Der Text verbindet Gottes Offenbarwerden mit der Reaktion seiner Gegner und der Völker, legt die Bildsprache aber nicht auf nur eine dogmatische Kategorie fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischem Satzfluss. Der Gedankenstrich am Ende signalisiert, dass der Vers syntaktisch und inhaltlich weiterführt. Die Wiederholung von „Feuer“ folgt bewusst dem Hebräischen.
