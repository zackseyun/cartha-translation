  to: Wie[c] Feuer Reisig[a] entzündet und Feuer Wasser zum Kochen bringt[b], um deinen Namen deinen Gegnern bekannt zu machen, sodass Völker vor dir erbeben –
  rationale: Die sichere Korrektur ersetzt allein die unidiomatische und semantisch überladene Wendung „vor deiner Gegenwart“ durch „vor dir“. Damit wird מִפָּנֶיךָ präzise und natürlich wiedergegeben. Die Fußnote zur alternativen Verszählung wird allgemein und sachlich formuliert. Bedeutung, Bildsprache, Satzabhängigkeit und offene theologische Reichweite bleiben unverändert.
