base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: de
  text: Unser heiliges und herrliches Haus, in dem unsere Väter[a] dich priesen, ist ein Raub des Feuers geworden[b], und alle unsere Kostbarkeiten sind zur Ruine geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unsere Vorfahren«; im Hebräischen steht ausdrücklich »unsere Väter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ist zu einem Brand des Feuers geworden«.'
    reason: literal_rendering
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: unser heiliges und herrliches Haus
  rationale: Die hebräische Wendung lautet wörtlich »das Haus unserer Heiligkeit und unserer Herrlichkeit«. Die attributive Fassung ist im modernen Deutschen natürlich und bewahrt sowohl die Heiligkeit als auch die Pracht beziehungsweise Herrlichkeit des Tempels.
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: in dem unsere Väter dich priesen
  rationale: Das Relativpronomen bezieht sich auf das Haus; »in dem« gibt den räumlichen Bezug klar wieder. הלל im Piel bedeutet hier »preisen«. »Väter« entspricht der ausdrücklich maskulinen hebräischen Bezeichnung und ihrer heilsgeschichtlichen Prägung.
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: ist vom Feuer verbrannt worden
  rationale: Die idiomatische deutsche Passivform gibt das Ergebnis der hebräischen nominalen Wendung »wurde zu einem Brand des Feuers« verständlich und prägnant wieder; die ungewöhnlichere Form des Ausgangstextes bleibt in einer Fußnote sichtbar.
- source_word: מַחֲמַדֵּינוּ
  choice: alles, was uns kostbar war
  rationale: Das Substantiv bezeichnet begehrte, geschätzte oder kostbare Dinge. Die offene Formulierung vermeidet eine unnötige Festlegung auf Tempelgeräte, Gebäude oder Besitzstücke.
- source_word: לְחָרְבָּה
  choice: zur Ruine
  rationale: Das Wort bezeichnet einen verwüsteten oder zerstörten Ort. »Ruine« ist konkret, verständlich und entspricht der prädikativen Konstruktion »ist ... geworden«.
theological_decisions:
- issue: Bezug von »unser heiliges und herrliches Haus«
  choice: Primärer Bezug auf den Tempel in Jerusalem
  alternative: Weiterer Bezug auf Jerusalem oder die heiligen Stätten des Landes
  rationale: Die Bezeichnung als Haus, in dem die Väter Gott priesen, weist unmittelbar auf den Tempel. Der weitere Zusammenhang beklagt zwar auch die Verwüstung Zions und Jerusalems, doch dieser Vers bezeichnet am direktesten das Heiligtum.
- issue: Wiedergabe von אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und trägt einen bundestheologischen beziehungsweise heilsgeschichtlichen Klang. Die mögliche allgemeinere Wiedergabe wird als lexikalische Alternative in der Fußnote genannt, ohne den Ausgangstext im Haupttext zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Klagewort, ohne dessen nominale Wendungen unnatürlich nachzubilden. »Herrlich« wahrt die Bedeutungsbreite von תִּפְאֶרֶת zwischen Pracht, Schönheit und Herrlichkeit; »alles, was uns kostbar war« lässt den Umfang der zerstörten Kostbarkeiten bewusst offen.
