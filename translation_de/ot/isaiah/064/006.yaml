id: ISA.64.6
reference: Isaiah 64:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: de
  text: Und da ist niemand, der deinen Namen anruft, niemand, der sich aufrafft, an dir festzuhalten. Denn du hast dein Angesicht vor uns verborgen und uns der Macht unserer Schuld preisgegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und hast uns in der Hand unserer Schuld zergehen lassen«. Das hebräische Verb bezeichnet ein Schmelzen, Sichauflösen oder Dahinschwinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵין
  choice: Und da ist niemand
  rationale: Gibt die verbindende Konjunktion und die umfassende Existenzverneinung in natürlichem Deutsch wieder.
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: der deinen Namen anruft
  rationale: Bewahrt die hebräische Gebets- und Anrufungsformel, ohne sie zu einer bloßen Namensnennung abzuflachen.
- source_word: מִתְעוֹרֵר
  choice: der sich aufrafft
  rationale: Bringt die reflexive Bedeutung des Hitpael und die bewusste eigene Anstrengung idiomatisch zum Ausdruck.
- source_word: לְהַחֲזִיק בָּךְ
  choice: an dir festzuhalten
  rationale: Bewahrt das Bild des Ergreifens beziehungsweise festen Haltens und klingt im Deutschen natürlich.
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für den zuvor beschriebenen Zustand.
- source_word: הִסְתַּרְתָּ פָנֶיךָ מִמֶּנּוּ
  choice: du hast dein Angesicht vor uns verborgen
  rationale: Erhält das zentrale biblische Bild vom verborgenen Angesicht Gottes und gibt das Pronomen korrekt wieder.
- source_word: וַתְּמוּגֵנוּ בְּיַד עֲוֺנֵנוּ
  choice: und uns der Macht unserer Schuld preisgegeben
  rationale: Gibt die kontextuelle Aussage von gerichtlicher Auslieferung unter die Macht der eigenen Schuld verständlich wieder; das wörtliche Bild des Zergehens wird in der Fußnote erhalten.
- source_word: עֲוֺנֵנוּ
  choice: unserer Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch Schuld und deren Folgen bezeichnen. „Schuld“ bewahrt hier die moralische Belastung und passt zur Machtmetapher.
theological_decisions:
- issue: Göttliches Handeln und menschliche Schuld im Schlusssatz
  choice: Gott gibt das Volk der Macht seiner eigenen Schuld preis.
  alternative: Gott lässt das Volk in der Hand seiner Schuld zergehen.
  rationale: Die Übersetzung hält göttliches Gericht und menschliche Verantwortlichkeit zusammen, ohne einen bestimmten metaphysischen Kausalmechanismus festzulegen. Die starke hebräische Bildsprache bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „niemand“ verdeutlicht parallel zur hebräischen Satzstruktur die völlige Abwesenheit von Gebet und entschlossenem Festhalten. „Angesicht“ bewahrt bewusst die traditionelle biblische Bildsprache.
