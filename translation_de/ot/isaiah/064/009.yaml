source:
  edition: WLC
  text: עָרֵ֥י קָדְשְׁ/ךָ֖ הָי֣וּ מִדְבָּ֑ר צִיּוֹן֙ מִדְבָּ֣ר הָיָ֔תָה יְרוּשָׁלִַ֖ם שְׁמָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
translation:
  language: de
  text: Deine heiligen Städte sind zur Wüste geworden; Zion ist zur Wüste[a] geworden, Jerusalem zur Einöde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wildnis«; so auch beim ersten Vorkommen von »Wüste«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  choice: deine heiligen Städte
  rationale: Die Konstruktion bedeutet wörtlich »Städte deiner Heiligkeit«. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt sowohl die Zugehörigkeit zu Gott als auch die Heiligkeit der Städte.
- source_word: הָיוּ / הָיָתָה
  choice: sind / ist … geworden
  rationale: Die Perfektformen von היה beschreiben hier plausibel einen eingetretenen Zustand, der in der Klage fortbesteht. Das deutsche Perfekt »ist geworden« gibt diesen Ergebnischarakter natürlich wieder.
- source_word: מִדְבָּר
  choice: Wüste
  rationale: מִדְבָּר bezeichnet eine Wüste oder unbewohnte Wildnis. »Wüste« ist hier idiomatisch, prägnant und bringt die Verwüstung zum Ausdruck, ohne zusätzliche Einzelheiten einzutragen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der überlieferte Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der überlieferte Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: שְׁמָמָה
  choice: Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, verlassenen Ort. »Einöde« erhält die substantivische Prädikatsstruktur und bildet einen natürlichen deutschen Parallelismus zu »Wüste«.
