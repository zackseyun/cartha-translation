  terminology: „Gerechtigkeit üben“, „zornig“, „sündigten“ und „gerettet werden“ sind treffend und registergerecht. „Sieh“ ist als Anredepartikel möglich und verständlich. Die Fußnote zu den Partizipien muss an die pluralische deutsche Hauptfassung angepasst werden.
