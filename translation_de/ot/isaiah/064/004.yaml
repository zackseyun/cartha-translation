base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: de
  text: Du kommst denen entgegen, die sich freuen, Gerechtigkeit üben[a] und auf deinen Wegen an dich denken. Sieh, du warst zornig, und wir sündigten; in ihnen sind wir seit Langem[b] – und werden wir gerettet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du kommst denen entgegen, die sich freuen und Gerechtigkeit üben.“ Die hebräischen Partizipien können gemeinsam die Personen beschreiben, denen Gott entgegenkommt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Satzteil „in ihnen sind wir seit Langem – und werden wir gerettet?“ ist textlich und syntaktisch schwierig. Möglich sind auch: „In ihnen ist Beständigkeit, und wir werden gerettet“ oder: „In ihnen sind wir seit Langem, und werden wir gerettet?“'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: Du kommst … entgegen
  rationale: פגע bezeichnet hier ein Begegnen oder Entgegenkommen. Die deutsche Wendung bewahrt den relationalen Sinn, ohne eine feindliche Begegnung oder Fürsprache hineinzulesen.
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: der mit Freude Gerechtigkeit übt
  rationale: שׂשׂ bezeichnet den sich Freuenden; die adverbiale Wiedergabe „mit Freude“ verbindet beide Partizipien natürlich. „Gerechtigkeit üben“ bewahrt den ethisch-theologischen Gehalt von צֶדֶק.
- source_word: בִּדְרָכֶיךָ יִזְכְּרוּךָ
  choice: die auf deinen Wegen an dich denken
  rationale: „Auf deinen Wegen“ erhält das Bild einer Lebensführung nach Gottes Weisung. זכר mit Personenobjekt wird idiomatisch als „an dich denken“ wiedergegeben.
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einer würdigen, gegenwärtig verständlichen Aufforderung wiedergegeben.
- source_word: קָצַפְתָּ וַנֶּחֱטָא
  choice: du warst zornig, und wir sündigten
  rationale: Die Wiedergabe hält sowohl Gottes Zorn als auch das offene Sündenbekenntnis fest, ohne die zeitliche oder ursächliche Beziehung zwischen beiden enger zu bestimmen.
- source_word: בָּהֶם
  choice: in ihnen
  rationale: Der Bezug des Pronomens ist unklar. Die wörtlich-nahe Formulierung lässt offen, ob auf Gottes Wege oder auf zuvor genannte Umstände verwiesen wird.
- source_word: עוֹלָם
  choice: seit Langem
  rationale: עוֹלָם kann lange Dauer, Vorzeit oder Beständigkeit bezeichnen. „Seit Langem“ drückt Dauer aus, ohne absolute Ewigkeit zu behaupten.
- source_word: וְנִוָּשֵׁעַ
  choice: und sollten wir gerettet werden?
  rationale: Der Nifal von ישׁע bedeutet „gerettet werden“. Als rhetorische Frage bewahrt die Formulierung die Spannung des Klagezusammenhangs; da das Hebräische kein ausdrückliches Fragezeichen enthält, wird die Aussagealternative in der Fußnote genannt.
theological_decisions:
- issue: Deutung des Schlusses וְנִוָּשֵׁעַ
  choice: 'als rhetorische Frage: „und sollten wir gerettet werden?“'
  alternative: 'als Aussage: „und wir werden gerettet“; bei anderer Gliederung auch: „in ihnen ist Beständigkeit, und wir werden gerettet“'
  rationale: Der hebräische Satz ist syntaktisch schwierig. Die Frageform erhält die Spannung zwischen Sündenbekenntnis, göttlichem Zorn und erhoffter Rettung, ohne die Unsicherheit des Textes in eine eindeutige Heilszusage umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gerechtigkeit üben“ wahrt den biblisch-ethischen Klang, während „Sieh“ und „an dich denken“ allgemein verständlich bleiben. Die ungewöhnliche Formulierung des letzten Satzteils wurde nicht geglättet, weil die hebräische Syntax und der Bezug von „in ihnen“ tatsächlich unsicher sind.
