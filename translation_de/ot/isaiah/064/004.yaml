  to: Du kommst denen entgegen, die sich freuen, Gerechtigkeit üben[a] und auf deinen Wegen an dich denken. Sieh, du warst zornig, und wir sündigten; in ihnen sind wir seit Langem[b] – und werden wir gerettet?
  rationale: Die Revision behebt den deutschen Grammatikbruch im ersten Satz durch eine kollektiv-pluralische Personenbeschreibung. Sie wahrt dabei die drei hebräischen Beschreibungen der von Gott begünstigten Personen, ohne den unsicheren Bezug von „in ihnen“ zu deuten. Die Schlussfrage wird sprachlich unmittelbarer formuliert; die deklarative Alternative und die textliche Schwierigkeit bleiben ausdrücklich in der Fußnote dokumentiert.
