id: ISA.64.7
reference: Isaiah 64:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: de
  text: Doch nun, Jahwe, bist du unser Vater. Wir sind der Ton, und du bist unser Töpfer; wir alle sind das Werk deiner Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb leitet nach dem vorausgehenden Klage- und Bittzusammenhang einen kontrastierenden erneuten Appell ein. „Doch nun“ gibt diesen Übergang knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: אָבִינוּ אָתָּה
  choice: bist du unser Vater
  rationale: Die hebräische Nominalkonstruktion wird mit der im Deutschen nötigen Kopula wiedergegeben. Die Stellung von „du“ bewahrt den Nachdruck des Personalpronomens, während „Vater“ die ausdrücklich männliche Verwandtschaftsbezeichnung beibehält.
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: Wir sind der Ton
  rationale: „Ton“ ist im Deutschen im Zusammenhang mit einem Töpfer die natürliche Bezeichnung des formbaren Materials. Der bestimmte Artikel des Hebräischen bleibt erhalten.
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: und du bist unser Töpfer
  rationale: Das Partizip der Wurzel יצר bezeichnet den Formenden. Das unmittelbar vorausgehende Tonbild legt die konkrete Wiedergabe „Töpfer“ nahe und erhält die Metapher.
- source_word: וּמַעֲשֵׂה יָדְךָ
  choice: das Werk deiner Hand
  rationale: Die relativ formnahe Wendung bewahrt sowohl den poetischen Ausdruck als auch das anthropomorphe Bild der gestaltenden Hand Gottes.
- source_word: כֻּלָּנוּ
  choice: wir alle
  rationale: Die inklusive Gesamtheit des Volkes wird ausdrücklich markiert. Die Voranstellung im deutschen Satzteil ist idiomatisch und hält den kollektiven Nachdruck fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Väterliche Bezeichnung Gottes
  choice: unser Vater
  alternative: unser Elternteil
  rationale: Das Hebräische verwendet ausdrücklich das männliche Verwandtschaftswort אָב. „Vater“ erhält die konkrete relationale und bundestheologische Sprache, ohne sie geschlechtsneutral umzudeuten.
- issue: Bild von Ton und Töpfer
  choice: Wir sind der Ton, und du bist unser Töpfer
  alternative: Wir sind das Material, und du hast uns geformt
  rationale: Die konkrete Metapher bleibt erhalten. Sie bringt Gottes gestaltendes Verhältnis zum ganzen Volk zum Ausdruck, ohne daraus über den Vers hinaus eine bestimmte Lehre über menschliche Freiheit oder Vorherbestimmung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. „Doch nun“ markiert den kontrastierenden Übergang; kurze Hauptsätze halten den Gebetscharakter und die Eindringlichkeit des Hebräischen fest.
