source:
  edition: WLC
  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: de
  text: 'Sei nicht über die Maßen zornig, Jahwe, und denk nicht für immer an die Schuld[a]. Sieh doch: Wir alle sind dein Volk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Vergehen“. Das hebräische Wort עָוֹן kann sowohl eine schuldhafte Tat als auch die daraus entstehende Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: Sei nicht über die Maßen zornig
  rationale: קצף bezeichnet heftigen Zorn; אַל mit der Verbform gibt eine dringliche Bitte wieder. „Über die Maßen“ bildet die Verstärkung עַד מְאֹד natürlich ab, ohne den Zorn gänzlich aus dem Text wegzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird nach geläufiger deutscher Umschrift als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֹן
  choice: und denk nicht für immer an die Schuld
  rationale: זכר meint hier das erinnernde Festhalten im Hinblick auf Ahndung. „Schuld“ bewahrt im Deutschen sowohl den moralischen als auch den forensischen Zusammenhang von עָוֹן; der bestimmte Artikel ergibt eine natürliche Bezugnahme auf die Schuld des betenden Volkes, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: הֵן הַבֶּט נָא
  choice: Sieh doch
  rationale: הֵן lenkt nachdrücklich die Aufmerksamkeit, הַבֶּט fordert zum Hinsehen auf, und נָא kennzeichnet die bittende Dringlichkeit. „Sieh doch“ bündelt diese Funktionen in natürlichem Deutsch.
- source_word: עַמְּךָ כֻלָּנוּ
  choice: Wir alle sind dein Volk
  rationale: Der hebräische Nominalsatz lautet wörtlich etwa „dein Volk, wir alle“. Die gewählte Wortfolge ist im Deutschen klar und bewahrt den gemeinschaftlichen Bundesappell.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; „der HERR“ wäre die traditionelle Ersatzlesung, steht aber nicht als Titel im hebräischen Konsonantentext.
- issue: Bedeutungsumfang von עָוֹן im Bußgebet
  choice: Schuld
  alternative: Vergehen / Sünde
  rationale: עָוֹן kann sowohl die schuldhafte Tat als auch die daraus erwachsende Schuld bezeichnen. Der Haupttext entscheidet sich für das im Kontext gut passende „Schuld“, während die Fußnote die echte lexikalische Spannweite offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die knappen Bitten bewahren den eindringlichen Gebetscharakter; „denk“ und „Sieh doch“ sind gegenwärtig und verständlich, ohne umgangssprachlich zu wirken.
