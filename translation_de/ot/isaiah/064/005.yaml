  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: de
  text: Wir alle wurden wie ein Unreiner, und all unsere gerechten Taten waren wie ein beflecktes Kleid[a]. Wir alle verwelkten wie ein Blatt, und unsere Vergehen trugen uns wie der Wind fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und konkreter: „wie ein Kleid der Menstruationsunreinheit“; gemeint sein kann ein durch Menstruation verunreinigtes Kleid oder Tuch.'
    reason: lexikalische Präzisierung
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: Wir alle wurden wie ein Unreiner
  rationale: וַנְּהִי bezeichnet hier den Eintritt in einen Zustand; כַטָּמֵא lässt offen, ob der Vergleich zunächst rituelle oder weiter gefasste Unreinheit meint. „Ein Unreiner“ bewahrt den substantivischen, persönlichen Charakter des hebräischen Adjektivs.
- source_word: וּכְבֶגֶד עִדִּים
  choice: wie ein beflecktes Kleid[a]
  rationale: Die Wendung bezeichnet genauer ein durch Menstruation verunreinigtes Kleid oder Tuch. Die Hauptfassung gibt das Bild würdig und verständlich wieder; die konkrete Bedeutung wird in der Fußnote bewahrt.
- source_word: כָּל צִדְקֹתֵינוּ
  choice: all unsere gerechten Taten
  rationale: Der Plural צִדְקֹת bezeichnet in diesem Zusammenhang konkrete gerechte Handlungen, nicht nur eine abstrakte Gerechtigkeit.
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: Wir alle verwelkten wie ein Blatt
  rationale: נבל beschreibt das Welken pflanzlichen Lebens. „Verwelkten“ erhält das anschauliche Blattbild und die Vergangenheitsfolge.
- source_word: וַעֲוֺנֵינוּ
  choice: unsere Vergehen
  rationale: עָוֹן umfasst Verfehlung, Schuld und mitunter deren Folgen. „Vergehen“ bewahrt hier den moralischen Sinn, ohne die mögliche Schuldkomponente dogmatisch festzulegen.
- source_word: כָּרוּחַ יִשָּׂאֻנוּ
  choice: trugen uns fort wie der Wind
  rationale: נשא bedeutet tragen oder forttragen; im Bild von Blatt und Wind liegt das Fortgetragenwerden nahe. Die Formulierung bleibt näher am Verb als das stärkere „fegten uns hinweg“.
theological_decisions:
- issue: Art der Unreinheit im Schuldbekenntnis
  choice: Die Sprache der Unreinheit und des befleckten Kleides bleibt bildhaft und wird nicht ausschließlich rituell oder ausschließlich als systematische Aussage über menschliche Verderbtheit ausgelegt.
  alternative: Die Aussage entweder rein kultisch verstehen oder ausdrücklich als spätere dogmatische Lehrformel wiedergeben.
  rationale: Der hebräische Text verbindet kultisch geprägte Unreinheitsbilder mit einem gemeinschaftlichen Schuldbekenntnis. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Bedeutungsumfang von עָוֹן
  choice: „Vergehen“ im Haupttext
  alternative: „Schuld“ oder „Sünden“
  rationale: Das Wort kann Tat, Schuld und Folge der Schuld bezeichnen. „Vergehen“ passt zum parallelen Bekenntnis, ohne die Mehrdeutigkeit vollständig auf eine forensische Bedeutung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Satzglieder und das wiederholte „Wir alle“ erhalten den klagenden, gemeinschaftlichen Rhythmus des Hebräischen; klinische Explizitheit steht nur in der lexikalisch notwendigen Fußnote.
