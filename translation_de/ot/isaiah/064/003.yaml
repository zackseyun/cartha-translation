  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: de
  text: Seit Urzeiten hat man weder gehört noch zugehört; kein Auge hat einen Gott außer dir gesehen, der für den handelt, der auf ihn wartet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: Seit Urzeiten
  rationale: Gibt den zeitlichen Ausdruck מֵעוֹלָם idiomatisch wieder, ohne ihn auf ein absolutes „niemals“ zu verengen.
- source_word: לֹא שָׁמְעוּ לֹא הֶאֱזִינוּ
  choice: hat man nicht gehört und nicht vernommen
  rationale: Die dritte Person Plural wird als unpersönliche Aussage wiedergegeben. „Vernommen“ bewahrt die Steigerung des aufmerksamen Hörens, ohne das im Hebräischen nicht ausdrücklich genannte „Ohr“ einzufügen.
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: einen Gott außer dir
  rationale: Bewahrt die direkte Anrede und die syntaktische Verbindung von „Gott“ mit „außer dir“.
- source_word: יַעֲשֶׂה
  choice: der … handelt
  rationale: Das imperfektive Verb bezeichnet hier Gottes charakteristisches beziehungsweise erwartetes Handeln; das Präsens lässt diese zeitliche Offenheit im Deutschen bestehen.
- source_word: לִמְחַכֵּה לוֹ
  choice: für den, der auf ihn wartet
  rationale: Gibt sowohl die Begünstigtenangabe mit לְ als auch das vertrauensvolle Warten von חכה klar und natürlich wieder.
theological_decisions:
- issue: Einzigartigkeit Gottes und sein Handeln für Wartende
  choice: „einen Gott außer dir …, der für den handelt, der auf ihn wartet“
  alternative: „außer dir keinen Gott …, der …“
  rationale: Die gewählte Fassung folgt der hebräischen Wortfolge eng und erhält sowohl den Vergleich mit jedem denkbaren anderen Gott als auch die Aussage über Gottes Handeln, ohne eine zusätzliche dogmatische Präzisierung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unpersönliche Form „man“ folgt dem hebräischen Plural genauer als die ergänzende Formulierung „kein Ohr“. Das Semikolon bildet den poetischen Übergang zur Aussage über das Auge ab.
