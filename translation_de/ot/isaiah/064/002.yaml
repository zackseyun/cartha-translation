  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
translation:
  language: de
  text: Als du ehrfurchtgebietende Taten vollbrachtest, die wir nicht erwartet hatten, kamst du herab; vor dir zerflossen[a] die Berge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erbebten oder schmolzen. Das hebräische Verb ruft das Bild des Fließens oder Zerfließens hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: Als du … vollbrachtest
  rationale: Die Präposition בְּ mit dem Infinitivus constructus und dem Suffix der 2. Person Singular wird hier als temporaler Nebensatz wiedergegeben. „Vollbrachtest“ verbindet sich im Deutschen natürlich mit „Taten“.
- source_word: נוֹרָאוֹת
  choice: ehrfurchtgebietende Taten
  rationale: Das Wort bezeichnet Dinge oder Taten, die Furcht und staunende Ehrfurcht hervorrufen. „Ehrfurchtgebietend“ bewahrt diese Weite, ohne die Taten einseitig als schrecklich oder bloß beeindruckend zu bezeichnen.
- source_word: לֹא נְקַוֶּה
  choice: die wir nicht erwartet hatten
  rationale: קוה kann hoffendes Warten oder erwartungsvolles Ausschauen bezeichnen. Hier passt im Zusammenhang mit Gottes unerwarteten Taten die Wiedergabe „nicht erwartet hatten“; das Plusquamperfekt stellt die Erwartung zeitlich vor das Handeln Gottes.
- source_word: יָרַדְתָּ
  choice: kamst du herab
  rationale: ירד bedeutet hinabgehen oder herabkommen. „Kamst du herab“ ist natürlich und bewahrt die räumliche Bildsprache der Gotteserscheinung.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Wörtlich steht „von vor deinem Angesicht“. Im Kontext bezeichnet die Wendung die Reaktion der Berge angesichts von Gottes Gegenwart; „vor dir“ gibt dies knapp wieder.
- source_word: הָרִים
  choice: die Berge
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Substantivs im Plural.
- source_word: נָזֹלּוּ
  choice: zerflossen
  rationale: Das Verb vermittelt das konkrete Bild des Fließens oder Sich-Auflösens. „Zerflossen“ ist im Deutschen verständliche poetische Sprache und bewahrt das starke Bild, statt es auf ein allgemeines Beben zu reduzieren.
theological_decisions:
- issue: Reaktion der Berge auf Gottes Herabkommen
  choice: Das konkrete Bild „vor dir zerflossen die Berge“ bleibt im Haupttext erhalten.
  alternative: „Vor dir erbebten die Berge“ oder „vor dir schmolzen die Berge“.
  rationale: Der hebräische Text schildert in dichterischer Sprache, wie die Schöpfung vor Gottes Gegenwart ihre Festigkeit verliert. „Zerflossen“ wahrt diese Bildkraft und legt die genaue physische Erscheinung nicht auf bloßes Erdbeben oder Schmelzen fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Bildkraft. „Ehrfurchtgebietend“ vermeidet sowohl das missverständliche umgangssprachliche „fantastisch“ als auch das einseitig negative „furchtbar“. Die Satzstellung folgt dem hebräischen Gedankenverlauf, bleibt aber im Deutschen flüssig.
