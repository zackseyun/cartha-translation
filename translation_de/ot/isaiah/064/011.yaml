source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: de
  text: Willst du dich angesichts all dessen[a] zurückhalten, Jahwe? Willst du schweigen und uns über alle Maßen bedrücken[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen all dessen« beziehungsweise »bei all dem«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »demütigen«. Das hebräische Verb kann sowohl das Zufügen von Leid als auch das Erniedrigen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עַל אֵלֶּה
  choice: angesichts all dessen
  rationale: Die Fragepartikel הַ leitet zusammen mit עַל eine rhetorische Frage ein. »Angesichts all dessen« nimmt den Rückbezug auf die zuvor geschilderte Verwüstung natürlich auf, ohne eindeutig festzulegen, ob עַל den Anlass, den Grund oder den Gegenstand bezeichnet.
- source_word: תִתְאַפַּק
  choice: dich … zurückhalten
  rationale: Der Hitpael von אפק bezeichnet Selbstbeherrschung beziehungsweise ein Sichzurückhalten. Die reflexive deutsche Form bewahrt diesen Zug und lässt offen, ob Jahwe sein Eingreifen oder sein Erbarmen zurückhält.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תֶּחֱשֶׁה
  choice: schweigen
  rationale: Das Verb bezeichnet das Stillsein oder Schweigen; im Zusammenhang beklagt die Frage Gottes ausbleibende Antwort beziehungsweise sein ausbleibendes Eingreifen.
- source_word: וּ/תְעַנֵּ/נוּ
  choice: und uns … bedrücken
  rationale: Der Piel von ענה bezeichnet hier ein schweres Bedrängen, Demütigen oder Zufügen von Leid. »Bedrücken« passt zum Klagekontext und vermeidet die im heutigen Deutsch oft vorherrschende Bedeutung von »demütigen« als bloßes Beschämen.
- source_word: עַד מְאֹד
  choice: über alle Maßen
  rationale: Die feste deutsche Wendung gibt die starke Gradsteigerung idiomatisch und würdevoll wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יְהוָה. »Jahwe« bewahrt ihn als persönliche Anrede, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Gegenstand des göttlichen Zurückhaltens
  choice: nicht ausdrücklich ergänzt
  alternative: dein Eingreifen oder dein Erbarmen zurückhalten
  rationale: Der hebräische Text nennt nicht ausdrücklich, was Jahwe zurückhält. Die Übersetzung bewahrt diese für die Klage bedeutsame Offenheit.
- issue: Bedeutung von ענה im Piel
  choice: bedrücken
  alternative: demütigen
  rationale: Beide Bedeutungsrichtungen sind lexikalisch möglich. Im Zusammenhang der Verwüstung steht das zugefügte Leid im Vordergrund; die Fußnote hält die Alternative offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Klage- und Gebetston. Die beiden rhetorischen Fragen und die knappe Anrede bleiben erhalten; unnötige erklärende Ergänzungen werden vermieden.
