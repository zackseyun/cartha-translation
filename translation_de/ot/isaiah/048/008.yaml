  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: de
  text: Ja, du hattest es nicht gehört, ja, du hattest es nicht gewusst, ja, von jeher hatte sich dein Ohr nicht geöffnet.[a] Denn ich wusste, dass du ganz gewiss treulos handeln würdest und dass man dich vom Mutterleib an einen Rebellen nennen würde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Ohr hatte sich nicht geöffnet.“ Die Metapher kann sowohl mangelnde Aufnahmebereitschaft als auch fehlendes Verstehen anklingen lassen.'
    reason: idiomatische_metapher
  - marker: b
    text: „Vom Mutterleib an“ bezeichnet den frühesten Anfang. „Rebell“ kann auch mit „Übertreter“ wiedergegeben werden.
    reason: lexikalische_alternative
lexical_decisions:
- source_word: גַּם
  choice: ja
  rationale: Das dreimal wiederholte „ja“ gibt die emphatische Steigerung wieder, ohne im Deutschen das additive „auch“ zu erzwingen.
- source_word: שָׁמַעְתָּ / יָדַעְתָּ
  choice: du hattest es nicht gehört / gewusst
  rationale: Das Plusquamperfekt bildet den Rückblick auf Israels vorherige Unkenntnis ab; das ergänzte „es“ ist im Deutschen natürlich und legt den nicht ausdrücklich genannten Gegenstand nicht näher fest.
- source_word: מֵאָז
  choice: von jeher
  rationale: Die Wendung bezeichnet hier eine weit zurückreichende Zeit. „Von jeher“ bewahrt diese zeitliche Tiefe und den gehobenen prophetischen Ton.
- source_word: פִתְּחָה אָזְנֶךָ
  choice: dein Ohr war nicht geöffnet
  rationale: Die körperhafte Metapher des Hebräischen bleibt erhalten und kann sowohl fehlende Offenbarung als auch fehlende Aufnahmebereitschaft anklingen lassen.
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: du würdest ganz gewiss treulos handeln
  rationale: Infinitivus absolutus und Imperfekt desselben Stammes verstärken die Aussage; „ganz gewiss“ bildet diese Bekräftigung ab.
- source_word: פֹשֵׁעַ
  choice: Rebell
  rationale: Das substantivierte Partizip bezeichnet jemanden, der sich auflehnt beziehungsweise die Treue bricht. „Rebell“ ist knapp, verständlich und wahrt die aktive Auflehnung.
- source_word: מִבֶּטֶן
  choice: vom Mutterleib an
  rationale: Die konkrete hebräische Metapher wird bewahrt und bezeichnet zugleich den frühesten Lebensanfang.
- source_word: קֹרָא לָךְ
  choice: man würde dich … nennen
  rationale: Die unpersönliche deutsche Form gibt die idiomatische Benennung oder Charakterisierung wieder, ohne einen im Hebräischen nicht genannten Benennenden einzuführen.
theological_decisions:
- issue: Ob „vom Mutterleib an“ wörtliche vorgeburtliche Schuld oder eine idiomatische Charakterisierung bezeichnet
  choice: Die Formulierung „vom Mutterleib an“ bleibt wörtlich und wird als prophetische Charakterisierung Israels von seinem frühesten Anfang her offengehalten.
  alternative: Die Wendung ausdrücklich als Aussage über persönliche Schuld vor der Geburt auslegen.
  rationale: Der Vers redet Israel beziehungsweise Jakob kollektiv an. Die Übersetzung bewahrt das Bild, macht daraus aber keine über den Wortlaut hinausgehende Lehrfestlegung.
- issue: Bedeutung des nicht geöffneten Ohres
  choice: Die Metapher bleibt unaufgelöst stehen.
  alternative: Eindeutig als fehlende Offenbarung oder ausschließlich als Ungehorsam wiedergeben.
  rationale: Der hebräische Ausdruck kann mangelnde Kenntnis und mangelnde Aufnahmebereitschaft zugleich anklingen lassen; eine explizite Deutung würde die Spannung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Wiederholung. Die dreifache Setzung von „ja“ und die Ohr-Metapher folgen der hebräischen Rhetorik; schwerfällige Archaismen werden vermieden.
