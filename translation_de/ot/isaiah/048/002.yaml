  source_fidelity: „Denn“ gibt כִּי als begründende Konjunktion angemessen wieder. „Sie werden nach der heiligen Stadt genannt“ bildet נִקְרָאוּ plus מֵעִיר הַקֹּדֶשׁ als von der Stadt abgeleitete Benennung idiomatisch ab, ohne die mögliche Herkunftsnuance zu verleugnen. „Sich auf den Gott Israels stützen“ trifft das Bild und die Abhängigkeitsbedeutung von נִסְמָכוּ. „Jahwe der Heerscharen ist sein Name“ gibt die hebräische Namensformel vollständig wieder.
  naturalness: Das Deutsch ist modernes Standarddeutsch und zugleich dem sachlich-biblischen Register angemessen. Die Satzteilung vor der Namensformel ist natürlich; sie beeinträchtigt die enge inhaltliche Verbindung nicht.
  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. „Der Gott Israels“ und „der Heerscharen“ sind treffende, nicht einengende Wiedergaben der hebräischen Konstruktionen. Die Fußnote bewahrt die relevante Mehrdeutigkeit der Präposition, ohne eine Lesart dogmatisch festzulegen.
