id: ISA.48.2
reference: Isaiah 48:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי מֵ/עִ֤יר הַ/קֹּ֨דֶשׁ֙ נִקְרָ֔אוּ וְ/עַל אֱלֹהֵ֥י יִשְׂרָאֵ֖ל נִסְמָ֑כוּ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: de
  text: Denn sie werden nach der heiligen Stadt genannt[a] und stützen sich auf den Gott Israels. Jahwe der Heerscharen ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie werden von der heiligen Stadt her genannt. Das Hebräische kann ihre Benennung nach der Stadt oder ihre Herkunft aus ihr hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert im Zusammenhang die vorausgehende Aussage; „denn“ gibt diese Funktion natürlich wieder.
- source_word: מֵעִיר הַקֹּדֶשׁ
  choice: nach der heiligen Stadt
  rationale: In Verbindung mit dem passiven נִקְרָאוּ kann die Wendung eine Benennung beziehungsweise Identitätsbezeichnung ausdrücken. „Nach der heiligen Stadt“ gibt diesen Sinn idiomatisch wieder; die ebenfalls mögliche Herkunftsbedeutung wird in der Fußnote bewahrt.
- source_word: נִקְרָאוּ
  choice: werden … genannt
  rationale: Das Nifal von קרא bezeichnet hier am unmittelbarsten das Genannt- oder Benanntwerden. Die passive Form vermeidet die stärkere Deutung „sie nennen sich“.
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: und stützen sich auf den Gott Israels
  rationale: „Sich auf jemanden stützen“ bewahrt das Bild von סמך und drückt zugleich Vertrauen beziehungsweise Abhängigkeit aus, ohne den im Kontext möglichen ironischen Unterton aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, breite Wiedergabe lässt offen, ob irdische oder himmlische Heere im Blick sind.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Dies entspricht der hebräischen Namensformel in natürlichem, würdevollem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. Seine Wiedergabe als „Jahwe“ bleibt näher am Hebräischen und vermeidet die Ersetzung durch einen Titel.
- issue: Beziehung des Volkes zur heiligen Stadt
  choice: sie werden nach der heiligen Stadt genannt
  alternative: sie werden von der heiligen Stadt her genannt / sie stammen aus der heiligen Stadt
  rationale: Die Formulierung kann die von der Stadt abgeleitete Bezeichnung oder die Herkunft aus ihr hervorheben. Der Haupttext bevorzugt im Kontext beanspruchter Identität die Benennung, während die Fußnote die Herkunftslesart festhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der bildhafte Ausdruck „sich stützen auf“ und der Titel „Jahwe der Heerscharen“ bleiben erhalten; die echte Mehrdeutigkeit der Wendung zur heiligen Stadt wird nicht stillschweigend beseitigt.
