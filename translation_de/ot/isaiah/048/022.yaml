  yaml_path: translation/ot/isaiah/048/022.yaml
  text: There is no peace," says Yahweh[a], "for the wicked.
translation:
  language: de
  text: »Keinen Frieden gibt es für die Frevler«, sagt Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kein Wohlergehen« beziehungsweise »keine Unversehrtheit«. Das hebräische Wort schalom kann Frieden, Wohlergehen und Ganzheit umfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: gibt es keinen
  rationale: Die deutsche Existenzverneinung gibt die hebräische Partikel der Nichtexistenz natürlich und knapp wieder.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die geläufige knappe Wiedergabe; das hebräische Wort kann zugleich Wohlergehen und Unversehrtheit einschließen, was die Fußnote festhält.
- source_word: אָמַר
  choice: sagt
  rationale: Obwohl die Form morphologisch ein Perfekt ist, dient sie hier als prophetische Redeeinleitung für einen bleibend gültigen Ausspruch; das deutsche Präsens ist idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָרְשָׁעִים
  choice: für die Frevler
  rationale: Die Präposition bezeichnet diejenigen, für die die Aussage gilt. „Frevler“ gibt das substantivierte Pluraladjektiv für schuldhaft böse Menschen knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese konkrete Bundesnamensreferenz, ohne sie durch einen Titel zu ersetzen.
- issue: Reichweite von שָׁלוֹם
  choice: Frieden im Haupttext, mit semantischer Erweiterung in der Fußnote
  alternative: Wohlergehen oder Unversehrtheit im Haupttext
  rationale: Der knappe Ausspruch lässt sowohl politischen beziehungsweise zwischenmenschlichen Frieden als auch umfassendes Wohlergehen anklingen. Die Hauptübersetzung bleibt prägnant, während die Fußnote die genuine Bedeutungsbreite wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Verneinung erhält die pointierte Kürze und den Nachdruck des hebräischen Urteils.
