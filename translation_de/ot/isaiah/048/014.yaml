source:
  edition: WLC
  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: de
  text: 'Versammelt euch alle und hört: Wer von ihnen hat dies angekündigt? Yahweh liebt ihn; er wird seinen Plan in Babylon ausführen, und sein Arm wird sich gegen die Chaldäer richten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Yahweh liebt ihn; er wird seinen Plan in Babylon ausführen, und sein Arm wird sich gegen die Chaldäer richten“, wobei „er“, „seinen“ und „sein“ nach „Yahweh liebt ihn“ auf Yahweh selbst bezogen werden können.'
    reason: Der hebräische Satzbau lässt offen, ob die Pronomen den geliebten Beauftragten oder Yahweh bezeichnen.
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: Versammelt euch alle
  rationale: Der pluralische Nifal-Imperativ fordert die gesamte angesprochene Gruppe direkt zum Zusammenkommen auf; die Formulierung ist natürlich und bewahrt den Nachdruck von כֻלְּכֶם.
- source_word: וּשֲׁמָעוּ
  choice: und hört
  rationale: Der Imperativ bezeichnet aufmerksames Hören; „hört“ wahrt hier den knappen, würdevollen Aufruf.
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: Wer von ihnen hat dies angekündigt?
  rationale: הגיד bedeutet bekannt machen oder ankündigen. Das singularische „dies“ gibt אֵלֶּה im Deutschen idiomatisch als den zuvor genannten Sachverhalt wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲהֵבוֹ
  choice: liebt ihn
  rationale: Das Qal Perfekt mit maskulinem Objektsuffix bezeichnet Yahwehs erwiesene bzw. fortdauernde Zuwendung zu dem genannten Handelnden.
- source_word: יַעֲשֶׂה חֶפְצוֹ
  choice: er wird seinen Plan ausführen
  rationale: עשה mit חפץ bezeichnet die wirksame Verwirklichung eines Willens oder Vorhabens. „Plan ausführen“ ist verständlich und lässt die Zuordnung der Pronomen im Haupttext dem wahrscheinlichen menschlichen Beauftragten gelten.
- source_word: בְּבָבֶל
  choice: in Babylon
  rationale: Die Präposition ב wird in ihrer gewöhnlichen lokalen Bedeutung wiedergegeben. Der Gerichtskontext bleibt durch die anschließende Aussage über die Chaldäer erkennbar.
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: und sein Arm wird gegen die Chaldäer sein
  rationale: „Arm“ bewahrt das hebräische Bild für wirksame Macht. Wegen des elliptischen Nominalsatzes werden Zukunft und gegnerische Beziehung aus dem Zusammenhang ergänzt.
theological_decisions:
- issue: Bezug der maskulinen Singularpronomen in אֲהֵבוֹ, יַעֲשֶׂה חֶפְצוֹ und זְרֹעוֹ
  choice: Im Haupttext beziehen sich die Pronomen auf den von Yahweh geliebten menschlichen Beauftragten, der dessen Plan in Babylon ausführt.
  alternative: Yahweh selbst ist Subjekt von „wird seinen Plan ausführen“, und „sein Arm“ bezeichnet Yahwehs eigenen Arm.
  rationale: Der nähere Zusammenhang spricht wahrscheinlich von einem von Yahweh berufenen Handelnden, ohne ihn in diesem Vers ausdrücklich zu benennen. Da der knappe hebräische Satzbau auch die alternative Zuordnung zulässt, wird diese in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Rede. Der Gottesname bleibt „Yahweh“. Die echte Mehrdeutigkeit des Pronomenbezugs wird nicht im Haupttext geglättet, sondern durch die Fußnote dokumentiert.
