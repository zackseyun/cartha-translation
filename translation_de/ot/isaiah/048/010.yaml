  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
translation:
  language: de
  text: Sieh, ich habe dich geläutert, doch nicht wie Silber[a]; ich habe dich im Schmelzofen der Not erwählt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „nicht mit Silber“; die hebräische Wendung ist schwierig. Gemeint ist wahrscheinlich, dass diese Läuterung nicht der Läuterung von Silber gleicht.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet gewöhnlich „erwählen“. Die Wiedergabe „geprüft“ ist eine kontextuelle Deutung im Zusammenhang des Läuterungsbildes, nicht seine gewöhnliche lexikalische Bedeutung.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das Aufmerksamkeitswort wird als direkte, nachdrückliche Aufforderung wiedergegeben. „Sieh“ ist in modernem Deutsch verständlich und bewahrt den prophetischen Ton besser als das altertümlichere „Siehe“.
- source_word: צְרַפְתִּיךָ
  choice: ich habe dich geläutert
  rationale: צרף bezeichnet das Läutern beziehungsweise Reinigen von Metall. „Geläutert“ erhält das metallurgische Bild und kann zugleich dessen übertragene Bedeutung ausdrücken.
- source_word: וְלֹא בְכָסֶף
  choice: doch nicht wie Silber
  rationale: 'Die Funktion der Präposition ב ist hier schwierig. Im Zusammenhang des Läuterns liegt ein Vergleich nahe: Israels Läuterung geschah nicht auf dieselbe Weise wie die von Silber. Die Unsicherheit wird in einer Fußnote bewahrt.'
- source_word: בְּחַרְתִּיךָ
  choice: ich habe dich … erwählt
  rationale: בחר bedeutet im Hebräischen gewöhnlich „erwählen“. Diese lexikalisch naheliegende Bedeutung bleibt im Haupttext stehen, auch wenn sie innerhalb des metallurgischen Bildes Spannung erzeugt; die kontextuell vorgeschlagene Wiedergabe „geprüft“ wird in der Fußnote genannt.
- source_word: בְּכוּר
  choice: im Schmelzofen
  rationale: כור bezeichnet einen Ofen zum Schmelzen beziehungsweise Läutern von Metall. „Schmelzofen“ macht das fortlaufende Bild ausdrücklich und bleibt natürlich verständlich.
- source_word: עֹנִי
  choice: der Not
  rationale: עֹנִי kann Bedrängnis, Elend, Leiden oder Armut bezeichnen. „Not“ ist knapp, weit genug und bildet mit „Schmelzofen“ eine natürliche deutsche Metapher.
theological_decisions:
- issue: Bedeutung von בְּחַרְתִּיךָ im Läuterungsbild
  choice: „ich habe dich … erwählt“ im Haupttext
  alternative: „ich habe dich … geprüft“
  rationale: Die gewöhnliche lexikalische Bedeutung von בחר ist „erwählen“. Sie darf nicht allein deshalb verdrängt werden, weil „prüfen“ besser zum Bild des Schmelzofens passt. Da der Kontext jedoch die alternative Deutung begünstigen kann, wird diese offengelegt, ohne die theologische und sprachliche Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem klaren metallurgischen Bild. „Sieh“ wahrt den prophetischen Nachdruck ohne unnötigen Archaismus. Die ungewöhnliche Verbindung von Erwählung und Schmelzofen bleibt bewusst erhalten.
