base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: de
  text: Ich, ich habe gesprochen; ja, ich habe ihn gerufen.[a] Ich habe ihn herbeigeführt, und er wird auf seinem Weg Erfolg haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ihn“ ist der Mann gemeint, den Gott gerufen und herbeigeführt hat; im Zusammenhang ist gewöhnlich Kyrus gemeint (siehe Jesaja 48,14).
    reason: cross_reference
  - marker: b
    text: 'Oder: „Sein Weg wird gelingen.“ Das hebräische Verb steht im Hifil (einer meist kausativen Form); es kann hier jedoch auch den Erfolg des Gerufenen auf seinem Weg ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: Ich, ich
  rationale: Die Wiederholung des Personalpronomens ist emphatisch. Die Wiedergabe bewahrt die auffällige Wiederholung und ihren rhetorischen Nachdruck.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt bezeichnet Gottes vollzogene Erklärung; das deutsche Perfekt klingt gegenwärtig und natürlich, ohne die Abgeschlossenheit aufzugeben.
- source_word: אַף
  choice: ja
  rationale: Hier bekräftigt und steigert die Partikel die Aussage. „Ja“ gibt diesen bestätigenden Nachdruck knapp und idiomatisch wieder.
- source_word: קְרָאתִיו
  choice: habe ihn gerufen
  rationale: קרא kann „rufen“ oder „berufen“ bedeuten. „Gerufen“ wahrt die semantische Weite und legt die Art des Rufes nicht unnötig fest.
- source_word: הֲבִיאֹתִיו
  choice: habe ihn kommen lassen
  rationale: 'Der Hifil von בוא ist kausativ: jemanden kommen lassen bzw. herbeibringen. Die gewählte Formulierung bildet diese Kausalität unmittelbar ab.'
- source_word: וְהִצְלִיחַ
  choice: und er wird … zum Erfolg führen
  rationale: Die Form ist Hifil, 3. Person maskulin Singular, nicht 1. Person. Das Futur gibt den im Kontext vorausblickenden Sinn wieder; „zum Erfolg führen“ wahrt die kausative Bedeutung.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: „Weg“ entspricht dem hebräischen Bild und kann hier den Lebensweg, das Vorgehen oder das Unternehmen des Gerufenen bezeichnen.
theological_decisions:
- issue: Bezug der maskulinen Singularpronomen
  choice: Die Pronomen bleiben im Haupttext unaufgelöst; der Kontext verweist auf den von Gott gerufenen und herbeigeführten Mann.
  alternative: Den Namen Kyrus ausdrücklich in den Vers einsetzen.
  rationale: Der hebräische Vers nennt keinen Namen. Die kontextuell naheliegende Identifikation soll erläutert, aber nicht in den Wortlaut eingetragen werden.
- issue: Subjekt von וְהִצְלִיחַ
  choice: Das Subjekt wird als „er“, also der gerufene Mann, wiedergegeben.
  alternative: „Ich werde seinen Weg gelingen lassen“, mit Gott als fortgesetztem Subjekt.
  rationale: וְהִצְלִיחַ ist morphologisch 3. Person maskulin Singular. Daher zeigt der hebräische Text an dieser Stelle einen Subjektwechsel an, auch wenn mehrere moderne Übersetzungen den Gedanken mit Gott als bewirkendem Subjekt glätten.
- issue: Kausative oder resultative Wiedergabe des Erfolgs
  choice: „er wird seinen Weg zum Erfolg führen“
  alternative: „sein Weg wird gelingen“ oder „er wird auf seinem Weg Erfolg haben“
  rationale: Die Hauptfassung bewahrt die Hifil-Kausalität und das ausdrückliche Objekt „seinen Weg“. Die idiomatisch-resultative Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Wiederholung „Ich, ich“ bleibt erhalten. Kurze Hauptsätze bilden den feierlichen Nachdruck ab; die ungewöhnlichere Schlusswendung wahrt bewusst die Kausativform und den Wechsel zur dritten Person.
