  terminology: „Herbeigeführt“ ist für den Hifil von בוא präziser als „kommen lassen“ und im prophetischen Register idiomatisch. Der Referent bleibt im Haupttext wie im Hebräischen ungenannt. Die Fußnote darf Kyrus als kontextuelle, nicht als in den Text eingetragene Identifikation nennen.
