  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: de
  text: 'Kommt zu mir und hört dies: Von Anfang an habe ich nicht im Verborgenen geredet. Seit es ins Dasein trat[a], war ich da. Und nun hat der Herr Jahwe mich[b] gesandt – und sein Geist.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seit es geschah“ oder „seit es da war“. Wörtlich: „von der Zeit ihres Seins an“.'
    reason: lexical_alternative
  - marker: b
    text: Der Sprecher wird im Hebräischen nicht ausdrücklich benannt. Christliche Leser haben hier oft den Knecht beziehungsweise den Messias sprechen gehört; der Wortlaut selbst lässt die Identität jedoch offen.
    reason: alternative_reading
  - marker: c
    text: 'Die knappe Wendung kann so verstanden werden, dass auch Gottes Geist an der Sendung beteiligt ist: „Der Herr Jahwe und sein Geist haben mich gesandt.“ Möglich sind auch weniger bestimmte Auffassungen, etwa „mit seinem Geist“; רוּחַ kann außerdem „Geist“, „Wind“ oder „Atem“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ אֵלַי
  choice: Kommt zu mir
  rationale: Der Qal-Imperativ Plural von קרב fordert unmittelbar zum Näherkommen auf. „Kommt zu mir“ ist natürliches modernes Deutsch und gibt אֵלַי ausdrücklich wieder.
- source_word: שִׁמְעוּ זֹאת
  choice: hört dies
  rationale: Der Imperativ Plural mit Demonstrativ wird knapp und seinem prophetischen Nachdruck entsprechend wiedergegeben.
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: Von Anfang an habe ich nicht im Verborgenen geredet
  rationale: מֵרֹאשׁ bezeichnet den Anfang oder Ausgangspunkt; בַּסֵּתֶר bezeichnet Verborgenheit. Die deutsche Wortstellung macht deutlich, dass das Reden von Anfang an nicht verborgen war.
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: Seit es geschah
  rationale: Wörtlich steht „von der Zeit seines/ihres Seins“. Das feminine Suffix verweist wahrscheinlich auf eine Sache oder ein Ereignis, ohne es ausdrücklich zu benennen. „Seit es geschah“ ist verständlich, während die weiteren Möglichkeiten in der Fußnote erhalten bleiben.
- source_word: שָׁם אָנִי
  choice: war ich da
  rationale: Die verblöse hebräische Aussage lautet wörtlich „dort ich“. Im rückblickenden Zusammenhang gibt das deutsche Präteritum die Anwesenheit zu dem genannten Zeitpunkt natürlich wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: אֲדֹנָי wird als Titel „der Herr“ und der Gottesname יהוה als „Jahwe“ wiedergegeben; so bleiben Titel und Eigenname unterscheidbar.
- source_word: שְׁלָחַנִי
  choice: hat … mich gesandt
  rationale: Das Perfekt mit Objektsuffix bezeichnet die erfolgte Sendung, die für die gegenwärtige Aussage maßgeblich ist. Das deutsche Perfekt passt zu diesem Übergang.
- source_word: וְרוּחוֹ
  choice: und sein Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Sendungskontext liegt „Geist“ nahe. Der Gedankenstrich erhält die auffällige, knappe Anfügung, ohne das syntaktische Verhältnis ausdrücklich aufzulösen.
theological_decisions:
- issue: Identität des Ich-Sprechers
  choice: Der Sprecher bleibt im Haupttext unbenannt.
  alternative: Den Sprecher ausdrücklich als den Knecht oder Messias bezeichnen.
  rationale: Das Hebräische enthält nur die Ich-Rede und identifiziert den Sprecher an dieser Stelle nicht ausdrücklich. Eine christologische Deutung ist traditionsgeschichtlich bedeutsam, darf aber nicht in den Wortlaut eingetragen werden.
- issue: Syntaktische Funktion und Bedeutung von וְרוּחוֹ
  choice: „und sein Geist“ wird als knappe, eigenständige Anfügung bewahrt.
  alternative: „mit seinem Geist“, „und seinen Geist“ oder „und sein geist/sein Wind“.
  rationale: Die hebräische Form kann als weiterer mitwirkender Sendender verstanden werden, lässt aber aufgrund ihrer knappen Anfügung auch andere syntaktische Bezüge zu. Der Haupttext wahrt die Spannung; die Fußnote nennt die wesentlichen Möglichkeiten.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: „der Herr Jahwe“
  alternative: „Gott, der HERR“ oder „der Herr, JHWH“
  rationale: Die Wiedergabe mit „Jahwe“ bewahrt den Gottesnamen als Namen und unterscheidet ihn vom vorangehenden Titel אֲדֹנָי.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Anrede. „Im Verborgenen“ wahrt den gehobenen biblischen Ton, bleibt aber allgemein verständlich. Der Gedankenstrich vor „und sein Geist“ bildet die ungewöhnlich knappe hebräische Schlussfügung ab, ohne ihre theologisch bedeutsame Mehrdeutigkeit zu glätten.
