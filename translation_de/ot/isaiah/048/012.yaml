  text: שְׁמַ֤ע אֵלַ/י֙ יַֽעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל מְקֹרָאִ֑/י אֲנִי הוּא֙ אֲנִ֣י רִאשׁ֔וֹן אַ֖ף אֲנִ֥י אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: de
  text: 'Höre mir zu, Jakob, und Israel, den ich gerufen habe[a]: Ich bin es[b]; ich bin der Erste, und ich bin der Letzte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Israel, mein Gerufener.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ich bin er“ oder „Ich bin derjenige“. Der hebräische Ausdruck ist eine knappe Formel göttlicher Selbstidentifikation, die im Jesajabuch mehrfach vorkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  choice: Höre auf mich
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf. „Höre auf mich“ ist im modernen Deutschen natürlich und bewahrt sowohl den Befehlscharakter als auch die Präposition אֶל.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Jakob und Israel
  rationale: Die beiden parallelen Anreden an das Bundesvolk bleiben als Eigennamen erhalten.
- source_word: מְקֹרָאִי
  choice: den ich gerufen habe
  rationale: Die passive bzw. resultative Bezeichnung Israels als Gottes Gerufener wird idiomatisch als Relativsatz wiedergegeben. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: אֲנִי הוּא
  choice: Ich bin es
  rationale: Diese knappe Formel der göttlichen Selbstidentifikation wird im Deutschen natürlich und zugleich gewichtig wiedergegeben. „Ich bin es“ bildet sowohl אֲנִי als auch הוּא ab, ohne die Aussage deutend zu erweitern.
- source_word: רִאשׁוֹן
  choice: der Erste
  rationale: Das prädikativ-substantivische Adjektiv erhält im Deutschen den bestimmten Artikel und eine titelartige Großschreibung.
- source_word: אַף
  choice: und
  rationale: Hier fügt אַף den parallelen zweiten Satz verstärkend hinzu. „Und“ bewahrt die ausgewogene Satzform; „auch“ wäre ebenfalls möglich.
- source_word: אַחֲרוֹן
  choice: der Letzte
  rationale: Die substantivische Wiedergabe wahrt den formalen Parallelismus und die absolute Aussage zu Gottes Einzigartigkeit.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstidentifikation אֲנִי הוּא
  choice: Ich bin es
  alternative: Ich bin der; Ich bin er; Ich bin
  rationale: „Ich bin es“ ist die idiomatischste knappe deutsche Selbstidentifikation und bewahrt die theologische Tragweite der Formel, ohne sie durch eine spätere dogmatische Deutung festzulegen. Die Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- issue: Gottes Primat und Endgültigkeit in רִאשׁוֹן ... אַחֲרוֹן
  choice: der Erste ... der Letzte
  alternative: Erster ... Letzter
  rationale: Die bestimmte, titelartige Form bringt den absoluten Anspruch des hebräischen Textes zum Ausdruck, ohne ihn paraphrasierend auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die knappen Selbstbezeichnungen des hebräischen Textes bleiben erhalten; ungebräuchliche Wörtlichkeit wird nur dort vermieden, wo sie das Verständnis erschweren würde.
