  text: לְמַעֲנִ֧/י לְמַעֲנִ֛/י אֶעֱשֶׂ֖ה כִּ֣י אֵ֣יךְ יֵחָ֑ל וּ/כְבוֹדִ֖/י לְ/אַחֵ֥ר לֹֽא אֶתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: de
  text: Um meinetwillen, um meinetwillen werde ich handeln. Denn wie könnte es entweiht werden?[a] Meine Herrlichkeit werde ich keinem anderen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lässt den Bezug unausgesprochen. Möglich ist: „Denn wie könnte mein Name entweiht werden?“'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: um meinetwillen
  rationale: Die Präposition ל mit מַעַן bezeichnet hier Beweggrund oder Zweck. „Um meinetwillen“ gibt den rückbezüglichen Sinn und durch die Wiederholung auch den starken Nachdruck natürlich wieder.
- source_word: אֶעֱשֶׂה
  choice: werde ich handeln
  rationale: עשה hat ein breites Bedeutungsspektrum („tun, machen“). Da kein Gegenstand genannt wird, bringt „handeln“ das angekündigte göttliche Eingreifen zum Ausdruck, ohne dessen Inhalt näher festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der vorausgehenden Aussage ein. „Denn“ entspricht dieser erklärenden Funktion.
- source_word: אֵיךְ
  choice: wie sollte
  rationale: Das Fragewort eröffnet eine rhetorische Frage. „Wie sollte“ gibt deren abwehrenden, beinahe undenkbaren Charakter in idiomatischem Deutsch wieder.
- source_word: יֵחָל
  choice: sollte entweiht werden
  rationale: Der Nifal von חלל bedeutet „entweiht werden“. Die unpersönliche deutsche Passivkonstruktion lässt den im Hebräischen unausgesprochenen Bezug offen, statt ausdrücklich „mein Name“ oder „ich“ einzusetzen.
- source_word: וּכְבוֹדִי
  choice: Meine Herrlichkeit
  rationale: כָּבוֹד kann „Herrlichkeit“ oder „Ehre“ bedeuten. In dieser göttlichen Selbstaussage wahrt „Herrlichkeit“ sowohl die Bedeutungsfülle als auch den feierlichen Ton.
- source_word: לְאַחֵר
  choice: keinem anderen
  rationale: אַחֵר bezeichnet einen anderen, von JHWH unterschiedenen Empfänger. Wegen der deutschen Stellung der Verneinung gibt „keinem anderen“ die Aussage knapp und natürlich wieder, ohne den möglichen Bezug auf Götzen ausdrücklich einzutragen.
- source_word: אֶתֵּן
  choice: werde ich … geben
  rationale: נתן ist das gewöhnliche Verb für „geben“. Die einfache Wiedergabe erhält die direkte und kategorische Aussage.
theological_decisions:
- issue: Unausgesprochener Bezug bei יֵחָל („entweiht werden“)
  choice: Der Haupttext nennt weder „meinen Namen“ noch „mich“, sondern verwendet ein unpersönliches Passiv.
  alternative: „Denn wie sollte mein Name entweiht werden?“ oder „Denn wie sollte ich entweiht werden?“
  rationale: Die maskuline Singularform des hebräischen Verbs setzt einen Bezug voraus, der im überlieferten Wortlaut nicht ausdrücklich genannt wird. Gottes Name ist im Zusammenhang eine naheliegende Ergänzung, steht hier aber nicht im Text. Die unpersönliche Form bewahrt diese Offenheit; die Fußnote nennt die wahrscheinlichste Verdeutlichung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung am Versanfang und die knappe Parallelstruktur bleiben erhalten. Die ungewöhnlich offene Form der rhetorischen Frage ist bewusst gewählt, um die Ellipse des hebräischen Textes nicht stillschweigend aufzulösen.
