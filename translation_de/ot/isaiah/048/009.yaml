  rationale: 'Die Revision bewahrt die hebräischen Schlüsselbegriffe genauer: תְּהִלָּתִי wird mit „Lob“ statt der stärker abstrahierenden Deutung „Ruhm“ wiedergegeben. Die Beziehung durch לָךְ bleibt mit „für dich“ offen. Für הַכְרִיתֶךָ steht im Haupttext das natürliche „vernichte“, während die Fußnote die wörtlichere und weitere Ausdrucksweise „abschneiden“ dokumentiert. Die Parallelität, der zeitliche Aspekt von אַאֲרִיךְ אַפִּי und das bildhafte Zurückhalten bei אֶחֱטָם bleiben erhalten.'
