source:
  edition: WLC
  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: de
  text: Um meines Namens willen verzögere ich meinen Zorn[a], und um meines Lobes willen halte ich ihn für dich zurück[b], damit ich dich nicht vernichte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ich mache meine Nase lang“; eine hebräische Redewendung dafür, den Zorn hinauszuzögern oder langsam zum Zorn zu sein.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „zügle ich ihn“ oder „halte ich ihn zurück“. Das hebräische Verb kann das Bild des Zügelns oder Anlegens eines Maulkorbs hervorrufen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „dich abschneide“. Das hebräische Verb kann auch „beseitigen“ oder „ausrotten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: Um meines Namens willen
  rationale: Gibt die Zweck- und Begründungsnuance von לְמַעַן wieder und bewahrt „mein Name“ als Ausdruck für Gottes Ansehen, Ehre und offenbarten Charakter.
- source_word: אַאֲרִיךְ אַפִּי
  choice: verzögere ich meinen Zorn
  rationale: Die Wendung bedeutet wörtlich etwa „ich mache meine Nase lang“ und bezeichnet idiomatisch das Hinauszögern des Zorns. „Verzögere“ bewahrt hier stärker den zeitlichen und konkreten Handlungsaspekt als die allgemeine Eigenschaft „bin ich langmütig“.
- source_word: וּתְהִלָּתִי
  choice: und um meines Ruhmes willen
  rationale: תְּהִלָּה kann Lob, Lobpreis oder den daraus hervorgehenden Ruhm bezeichnen. „Ruhm“ ist in diesem Zusammenhang natürlich und lässt erkennen, dass Gottes eigene Ehre das Motiv seines Handelns ist.
- source_word: אֶחֱטָם
  choice: zügle ich ihn
  rationale: Das seltene Verb bezeichnet ein Zurückhalten und kann an das Anlegen eines Maulkorbs oder Zaums erinnern. „Zügle“ bewahrt dieses Bild in verständlichem Deutsch; „ihn“ nimmt den Zorn aus dem vorigen Teilsatz als unausgesprochenes Objekt auf.
- source_word: לָךְ
  choice: dir zugute
  rationale: Die Wiedergabe macht die auf den Angesprochenen bezogene beziehungsweise begünstigende Funktion der Präposition deutlich, ohne daraus den eigentlichen Beweggrund für Gottes Handeln zu machen.
- source_word: לְבִלְתִּי
  choice: damit … nicht
  rationale: Gibt die negative Zweck- beziehungsweise Folgeangabe in natürlichem modernem Deutsch wieder.
- source_word: הַכְרִיתֶךָ
  choice: dich … ausrotte
  rationale: Die Hifil-Form von כרת bedeutet hier, jemanden abzuschneiden, zu beseitigen oder auszurotten. „Ausrotten“ ist im Deutschen klar und bewahrt die Aussage vollständiger Vernichtung.
theological_decisions:
- issue: Gottes Beweggrund für die Zurückhaltung seines Gerichts
  choice: Gott verzögert und zügelt seinen Zorn um seines eigenen Namens und Ruhmes willen; die Bewahrung des Angesprochenen ist das erklärte Ziel beziehungsweise Ergebnis.
  alternative: Die Aussage so zu formulieren, als sei allein das Wohlergehen Israels Gottes eigentlicher Beweggrund.
  rationale: Der hebräische Parallelismus nennt ausdrücklich Gottes Namen und Ruhm als Begründung. „Dir zugute“ bewahrt zugleich, dass sein Zurückhalten dem Angesprochenen zugutekommt, ohne menschliches Verdienst einzutragen.
- issue: Unausgesprochenes Objekt von אֶחֱטָם
  choice: Das Objekt wird als der zuvor genannte Zorn verstanden und mit „ihn“ aufgenommen.
  alternative: Das Objekt im Deutschen unausgesprochen lassen oder ausdrücklich „meinen Grimm“ ergänzen.
  rationale: Die Rückbeziehung auf „meinen Zorn“ liegt im unmittelbaren Parallelismus nahe. Das Pronomen ergibt einen natürlichen deutschen Satz, ohne den hebräischen Text stärker als nötig auszudeuten.
- issue: Bedeutungsumfang von תְהִלָּתִי
  choice: „meines Ruhmes“
  alternative: „meines Lobes“ oder „meines Lobpreises“
  rationale: „Ruhm“ kann sowohl die Gott zukommende Anerkennung als auch sein öffentliches Ansehen bezeichnen. Damit bleibt die Spannung zwischen empfangenem Lob und rühmlicher Bekanntheit bestehen, ohne den Ausdruck zu einer dogmatischen Abstraktion wie „Herrlichkeit“ umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten. „Verzögere“ und „zügle“ unterscheiden den zeitlichen Aspekt der ersten Aussage vom kräftigen Bild des Zurückhaltens in der zweiten; die Fußnoten erläutern die ungewohnten hebräischen Bilder, ohne den Haupttext zu überladen.
