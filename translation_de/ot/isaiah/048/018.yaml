id: ISA.48.18
reference: Isaiah 48:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: de
  text: Hättest du doch auf meine Gebote geachtet![a] Dann wäre dein Frieden wie ein Strom gewesen und deine Gerechtigkeit[b] wie die Wogen des Meeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hättest du doch auf meine Gebote gehört!«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dein Recht«; möglich ist auch: »deine Rechtfertigung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: Hättest du doch
  rationale: Die deutsche irreale Wunschform mit »doch« gibt den unerfüllten Wunsch und den klagenden Unterton natürlich wieder.
- source_word: הִקְשַׁ֖בְתָּ
  choice: auf … geachtet
  rationale: Das Verb bezeichnet aufmerksames, folgebereites Hören und nicht bloß akustisches Wahrnehmen.
- source_word: לְמִצְוֺתָי
  choice: auf meine Gebote
  rationale: »Gebote« bewahrt das verbindliche, bundestheologisch geprägte Gewicht des hebräischen Ausdrucks.
- source_word: וַיְהִ֤י
  choice: Dann wäre … gewesen
  rationale: Im Anschluss an den unerfüllten Wunsch bezeichnet die Form die Folge, die unter der nicht eingetretenen Bedingung Wirklichkeit geworden wäre.
- source_word: כַנָּהָר
  choice: wie ein Strom
  rationale: »Strom« bewahrt das Bild eines mächtig und beständig fließenden Gewässers und klingt im poetischen Zusammenhang natürlich.
- source_word: שְׁלוֹמֶ֔ךָ
  choice: dein Frieden
  rationale: »Frieden« ist die knappe, geläufige Wiedergabe; die im hebräischen Wort mitschwingenden Bedeutungen Wohlergehen und Unversehrtheit bleiben im Kontext offen.
- source_word: וְצִדְקָתְךָ֖
  choice: deine Gerechtigkeit
  rationale: »Gerechtigkeit« wahrt die moralische und gemeinschaftliche Bedeutungsbreite des Ausdrucks, ohne ihn einseitig auf Rechtsprechung oder Rechtfertigung festzulegen.
- source_word: כְּגַלֵּ֥י הַיָּֽם
  choice: wie die Wogen des Meeres
  rationale: »Wogen« gibt das poetische Bild der zahlreichen, fortwährend heranrollenden Meereswellen prägnant wieder.
theological_decisions:
- issue: Bedeutung von צְדָקָה im Zusammenhang
  choice: Gerechtigkeit
  alternative: Recht; Rechtfertigung
  rationale: »Gerechtigkeit« erhält die Verbindung zwischen dem Beachten der Gebote und einem Zustand rechter Ordnung. Zugleich wird die echte Möglichkeit der stärker sozialen Bedeutung »Recht« in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die irreale Wunschkonstruktion ist idiomatisch deutsch; »Strom« und »Wogen« erhalten die kräftigen Wasserbilder des hebräischen Textes.
