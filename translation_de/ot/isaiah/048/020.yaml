source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: de
  text: 'Zieht aus Babylon fort; flieht vor den Chaldäern[a]! Verkündet dies mit Jubelruf, macht es hörbar, tragt es hinaus bis ans Ende der Erde[b]. Sagt: »Jahwe hat seinen Diener Jakob erlöst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »flieht aus Chaldäa«. Wörtlich nennt der hebräische Text die Volksgruppe: »von den Chaldäern«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder idiomatisch: »bis an die Enden der Erde«; im Hebräischen steht »Ende/Rand« im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל
  choice: Zieht aus Babylon fort
  rationale: Der pluralische Imperativ von יצא fordert zum Verlassen Babylons auf. „Zieht … fort“ gibt Richtung und Aufbruch in natürlichem, würdigem Deutsch wieder.
- source_word: בִּרְחוּ מִכַּשְׂדִּים
  choice: flieht von den Chaldäern weg
  rationale: ברח bezeichnet eine dringliche Flucht. Das Hebräische nennt im Plural die Volksgruppe der Chaldäer; „von … weg“ wahrt den Trennungssinn der Präposition, ohne daraus stillschweigend einen Ländernamen zu machen.
- source_word: בְּקוֹל רִנָּה
  choice: mit Jubelruf
  rationale: Die Wendung verbindet hörbare Stimme mit jubelnder Freude. „Mit Jubelruf“ ist knapp, idiomatisch und für prophetische Verkündigung angemessen.
- source_word: הַגִּידוּ הַשְׁמִיעוּ זֹאת
  choice: Verkündet es …, lasst es hören
  rationale: הגיד fordert öffentliche Bekanntgabe; der Hifil von שמע hat kausative Kraft. Das Deutsche bewahrt beide parallelen Aufforderungen, wobei „es“ auf die zu verkündende Botschaft verweist.
- source_word: הוֹצִיאוּהָ
  choice: tragt es hinaus
  rationale: Der Hifil-Imperativ von יצא mit Objektsuffix beschreibt das Hinausbringen beziehungsweise Verbreiten der Botschaft. „Tragt es hinaus“ erhält das Bewegungsbild.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: bis ans Ende der Erde
  rationale: קצה steht im Singular und bezeichnet Rand oder äußerstes Ende. Die singularische Form wird in verständlichem Deutsch beibehalten.
- source_word: גָּאַל
  choice: hat … erlöst
  rationale: גאל bezeichnet hier die rettende Auslösung beziehungsweise Wiedergewinnung. „Erlöst“ erhält das gewichtige biblische Motiv, ohne den konkreten Vorgang enger festzulegen als der Ausgangstext.
- source_word: עַבְדּוֹ יַעֲקֹב
  choice: seinen Diener Jakob
  rationale: Die Genitiv- und Possessivbeziehung wird direkt wiedergegeben; Jakob bezeichnet im prophetischen Zusammenhang zugleich den namentlich angesprochenen Knecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen in der im Deutschen geläufigen wissenschaftlich-kirchlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Heilsgeschichtliche Bedeutung von גָּאַל
  choice: hat erlöst
  alternative: hat freigekauft / hat befreit
  rationale: „Erlöst“ bewahrt die mögliche Löser- und Befreiungsvorstellung des Verbs sowie seine theologische Spannung, ohne eine bestimmte spätere Erlösungslehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Folge kurzer pluralischer Imperative und die zunehmende Reichweite der Verkündigung bleiben erhalten. „Jubelruf“ vermeidet altertümliche Wendungen, während „Jahwe“, „Diener“ und „erlöst“ die sachliche und theologische Dichte des Hebräischen wahren.
