  variant: modern standard German
source:
  edition: WLC
  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: de
  text: 'Jetzt werden sie geschaffen[a], nicht vor langer Zeit; vor dem heutigen Tag hattest du nichts von ihnen gehört, damit du nicht sagst: »Sieh, ich wusste von ihnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jetzt sind sie geschaffen worden, nicht vor langer Zeit; vor dem heutigen Tag hattest du nichts von ihnen gehört.«'
    reason: Die hebräische Perfektform kann als vollendetes Geschehen wiedergegeben werden; die Zeitangabe kann entsprechend als frühere Entstehungszeit verstanden werden.
lexical_decisions:
- source_word: עַתָּה
  choice: Jetzt
  rationale: Das Zeitadverb bezeichnet die gegenwärtige Verwirklichung und steht im Gegensatz zur fernen Vergangenheit.
- source_word: נִבְרְאוּ
  choice: werden sie geschaffen
  rationale: Der Nifal-Perfekt von ברא bewahrt ausdrücklich die Schöpfungssprache; das deutsche Präsens gibt hier die gegenwärtige Hervorbringung natürlich wieder.
- source_word: מֵאָז
  choice: schon seit Langem
  rationale: In Verbindung mit der Verneinung wird ausgesagt, dass diese Dinge nicht aus ferner Vergangenheit stammen; die Formulierung ist modern und idiomatisch.
- source_word: וְלִפְנֵי יוֹם
  choice: vor dem heutigen Tag
  rationale: Die Wendung bezeichnet die Zeit vor dem gegenwärtigen Tag und bildet einen klaren Gegensatz zu »jetzt«.
- source_word: שְׁמַעְתָּם
  choice: hattest du nichts von ihnen gehört
  rationale: שמע meint hier, von den angekündigten Dingen Kenntnis zu erlangen. Das Plusquamperfekt drückt ihre frühere Nichtoffenbarung aus.
- source_word: פֶּן
  choice: damit nicht
  rationale: Die Konjunktion bezeichnet die Verhinderung eines möglichen Ergebnisses; »damit nicht« ist im modernen Deutsch natürlicher als »auf dass nicht«.
- source_word: תֹּאמַר
  choice: du sagst
  rationale: Der Imperfekt nach פן bezeichnet die mögliche, zu verhindernde Äußerung.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Interjektion leitet die behauptete Vorkenntnis ein, ohne das altertümliche »siehe« zu verwenden.
- source_word: יְדַעְתִּין
  choice: ich wusste von ihnen
  rationale: Das Verb mit Objektsuffix bezeichnet die behauptete frühere Kenntnis der Dinge. »Von ihnen wissen« ist im Deutschen idiomatisch und fügt kein im Hebräischen unausgedrücktes »schon« hinzu.
theological_decisions:
- issue: Bedeutung von »geschaffen« für die angekündigten Dinge
  choice: Die Schöpfungssprache wird mit »werden sie geschaffen« beibehalten.
  alternative: »werden sie hervorgebracht« oder »werden sie angekündigt«
  rationale: ברא bezeichnet ein schöpferisches Handeln Gottes. Die Übersetzung soll Gottes souveräne Urheberschaft an den neuen Geschehnissen bewahren, ohne den Ausdruck auf bloße Ankündigung zu verengen.
- issue: Bezug der pluralischen Suffixe
  choice: Die Pronomina beziehen sich allgemein auf die neu offenbarten Dinge oder Geschehnisse.
  alternative: Explizites »diese Ereignisse«
  rationale: Der Kontext erschließt den Bezug, während das Hebräische ihn in diesem Vers nicht näher bestimmt; daher wird keine zusätzliche Präzisierung eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schöpfungssprache und die zeitliche Spannung zwischen »jetzt« und früherer Unkenntnis bleiben erhalten. Die direkte Rede ist bewusst knapp und ohne das nicht ausdrücklich vorhandene Adverb »schon« formuliert.
