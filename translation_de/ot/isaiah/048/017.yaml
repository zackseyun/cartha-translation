base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: de
  text: 'So spricht Jahwe, dein Erlöser, der Heilige Israels: Ich bin Jahwe, dein Gott, der dich lehrt, was dir nützt[a], der dich auf dem Weg führt, den du gehen sollst[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der dich zu deinem Besten unterweist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der dich auf dem Weg führt, den du gehst“. Das Hebräische kann hier sowohl beschreibend als auch anweisend verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und in beiden Vorkommen beibehalten.
- source_word: גֹּאַלְךָ
  choice: dein Erlöser
  rationale: Die partizipiale Bezeichnung fungiert hier als Titel. „Erlöser“ bewahrt die rettende und bundesbezogene Bedeutung, ohne die mögliche Verwandtschaftsnuance zu überbestimmen.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feste jesajanische Gottesbezeichnung wird in ihrer geläufigen und prägnanten Form wiedergegeben.
- source_word: מְלַמֶּדְךָ לְהוֹעִיל
  choice: der dich zu deinem Besten lehrt
  rationale: להועיל bezeichnet Nutzen oder Vorteil. „Zu deinem Besten“ ist im heutigen Deutsch natürlich und macht deutlich, dass Gottes Lehre dem Angeredeten zugutekommt.
- source_word: מַדְרִיכֲךָ
  choice: der dich ... führt
  rationale: Das Hifil-Partizip beschreibt Gottes fortdauerndes Leiten; „führt“ erhält zugleich das Bild des Weges.
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: auf dem Weg, den du gehen sollst
  rationale: Die Form תֵּלֵךְ kann beschreibend, zukünftig oder im Zusammenhang anweisend verstanden werden. Der Haupttext gibt die hier naheliegende instruktive Nuance wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und der Selbstvorstellung
  choice: Ich bin Jahwe, dein Gott
  alternative: Ich, der HERR, bin dein Gott
  rationale: Die gewählte Fassung wahrt die Wiederholung des Eigennamens יהוה und die betonte göttliche Selbstvorstellung, ohne zusätzliche Deutung einzutragen.
- issue: Ziel der göttlichen Unterweisung
  choice: der dich zu deinem Besten lehrt
  alternative: der dich lehrt, Nutzen zu haben
  rationale: Die Fassung bewahrt den Gedanken einer nutzbringenden Unterweisung, ohne materiellen Gewinn oder eine bestimmte Heilslehre einzulesen.
- issue: Modalität von תֵּלֵךְ
  choice: den du gehen sollst
  alternative: den du gehst
  rationale: Der Kontext legt eine anweisende Bedeutung nahe. Da die hebräische Form auch beschreibend gelesen werden kann, bleibt diese Möglichkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen prophetischen Redeeingang, bleibt aber gut verständlich. „Jahwe“ wahrt den Eigennamen; „zu deinem Besten“ vermeidet eine missverständliche Verengung von Nutzen auf finanziellen Gewinn.
