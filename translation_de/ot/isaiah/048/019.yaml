  source_fidelity: Der Konjunktiv II der Vergangenheit gibt die kontrafaktische Folge aus Jesaja 48,18–19 zutreffend wieder. „Nachkommenschaft“ entspricht dem kollektiv gebrauchten זַרְעֶךָ, „leibliche Nachkommen“ gibt die Abstammungsnuance von צֶאֱצָאֵי מֵעֶיךָ angemessen wieder, und „seine Körner“ bezieht sich natürlich auf den Sand. Die singularische Wiedergabe „sein Name“ bewahrt die Form von שְׁמוֹ, ohne den kollektiv-personifizierenden Bezug vorzeitig festzulegen. „Vor mir“ ist eine vertretbare, würdige deutsche Wiedergabe von מִלְּפָנָי.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und insgesamt gut lesbar. Die Verbindung „sein Name ... ausgerottet oder vernichtet“ ist bewusst bildhaft und eng am hebräischen Parallelismus; sie ist im biblischen Register verständlich.
