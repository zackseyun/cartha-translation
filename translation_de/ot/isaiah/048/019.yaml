id: ISA.48.19
reference: Isaiah 48:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: de
  text: Deine Nachkommenschaft wäre wie der Sand gewesen und deine leiblichen Nachkommen wie seine Körner[a]; sein Name[b] wäre vor mir weder ausgerottet noch vernichtet worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie seine Teilchen“ beziehungsweise „wie seine kleinen Kiesel“. Das hebräische Wort bezeichnet kleine Einheiten des Sandes.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der Singular „sein Name“. Gemeint sein kann die Nachkommenschaft als eine einzige fortbestehende Linie; möglich ist daher sinngemäß auch „ihr Name“ oder „deren Name“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: wäre … gewesen
  rationale: Der Satz führt die in Vers 18 begonnene, nicht verwirklichte Folge fort. Der deutsche Konjunktiv II der Vergangenheit gibt diesen kontrafaktischen Sinn klar wieder.
- source_word: כַחוֹל
  choice: wie der Sand
  rationale: חוֹל bezeichnet gewöhnlich Sand; die schlichte Vergleichsform bewahrt das Bild einer unermesslich großen Nachkommenschaft, ohne es erklärend auszuweiten.
- source_word: זַרְעֶךָ
  choice: deine Nachkommenschaft
  rationale: זֶרַע ist hier kollektiv im Sinn von Nachkommen gebraucht. „Nachkommenschaft“ bewahrt den kollektiven Singular und schafft zugleich einen natürlichen Bezug für das spätere singularische „sein Name“.
- source_word: וְצֶאֱצָאֵי מֵעֶיךָ
  choice: und deine leiblichen Nachkommen
  rationale: צֶאֱצָאִים bezeichnet die Hervorgegangenen beziehungsweise Nachkommen; מֵעֶיךָ meint wörtlich die aus dem Inneren oder Leib Stammenden. „Leibliche Nachkommen“ gibt die körperliche Abstammung natürlich und würdig wieder.
- source_word: כִּמְעֹתָיו
  choice: wie seine Körner
  rationale: Das Suffix verweist am ehesten auf den Sand zurück. מְעוֹת bezeichnet dessen kleine Einheiten oder Teilchen; im Deutschen passt „Körner“ natürlich zum Sandbild.
- source_word: לֹא יִכָּרֵת וְלֹא יִשָּׁמֵד
  choice: wäre … weder ausgerottet noch vernichtet worden
  rationale: Die beiden passiven Verben bezeichnen das Abgeschnittenwerden beziehungsweise die vollständige Beseitigung. Die Doppelung erhält die steigernde Parallelität des Hebräischen.
- source_word: שְׁמוֹ
  choice: sein Name
  rationale: Der mas­kulin-singularische Suffix wird formal bewahrt. Er kann die Nachkommenschaft als eine fortbestehende Linie kollektiv personifizieren.
- source_word: מִלְּפָנָי
  choice: vor mir
  rationale: Die Wendung bedeutet wörtlich „von vor meinem Angesicht“. „Vor mir“ ist im Deutschen klar und feierlich, ohne unnötig eine räumliche Entfernung aus Gottes Gegenwart zu behaupten.
theological_decisions:
- issue: Kontrafaktischer Sinn im Zusammenhang mit Vers 18
  choice: Die Aussage wird als nicht verwirklichte Folge mit „wäre … gewesen“ und „wäre … worden“ wiedergegeben.
  alternative: 'Eine einfache Vergangenheits- oder Zukunftsaussage: „war/wird sein“ beziehungsweise „wurde/wird ausgerottet“.'
  rationale: Vers 19 setzt den Bedingungs- und Klagezusammenhang aus Vers 18 fort. Der Konjunktiv macht deutlich, dass die beschriebene Folge bei Gehorsam eingetreten wäre, ohne zu behaupten, sie sei tatsächlich so eingetreten.
- issue: Numerus und Bezug von שְׁמוֹ
  choice: Der singularische Ausdruck wird als „sein Name“ beibehalten und auf die kollektiv verstandene Nachkommenschaft bezogen.
  alternative: „Ihr Name“ mit Bezug auf die pluralischen Nachkommen oder „deren Name“ als neutralere kollektive Wiedergabe.
  rationale: Der mas­kulin-singularische Wortlaut ist textlich eindeutig, während sein genauer kollektiver Bezug auslegungsfähig bleibt. Die Übersetzung bewahrt daher die Form und erläutert die mögliche kollektive Personifizierung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommenschaft“ hält den kollektiven Charakter von זֶרַע fest; „leibliche Nachkommen“ gibt die körperliche Abstammung verständlich wieder. Der Konjunktiv II der Vergangenheit stellt den aus dem Kontext hervorgehenden kontrafaktischen Sinn ausdrücklich dar.
