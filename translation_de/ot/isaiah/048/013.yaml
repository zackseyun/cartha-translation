    rationale: Der zugrunde gelegte englische Audit trail bewertet „spread out“ als bevorzugten Sinn und nennt „spanned“ bzw. „stretched out“ als Alternativen. Die deutsche Fußnote sollte diese Alternativen abbilden, ohne eine stärkere lexikalische Unsicherheit oder eine nicht erforderliche Mess-Deutung zu behaupten.
  - severity: low
