source:
  edition: WLC
  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: de
  text: Ja, meine Hand hat die Erde gegründet, und meine Rechte hat den Himmel ausgespannt.[a] Rufe ich sie, stehen sie zusammen da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat den Himmel überspannt“ oder „hat den Himmel ausgebreitet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die emphatische Partikel bekräftigt die feierliche Aussage. „Ja“ gibt diese Hervorhebung im Deutschen knapp und natürlich wieder.
- source_word: יָדִי
  choice: meine Hand
  rationale: Die konkrete anthropomorphe Bildsprache für Gottes schöpferisches Handeln bleibt erhalten.
- source_word: יָסְדָה
  choice: hat ... gegründet
  rationale: Das Verb יסד bezeichnet das Gründen beziehungsweise Legen eines Fundaments; „gegründet“ bewahrt das Schöpfungs- und Fundamentbild.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der kosmische Schöpfungszusammenhang meint die Erde, nicht ein bestimmtes Land.
- source_word: וִימִינִי
  choice: und meine Rechte
  rationale: „Meine Rechte“ ist eine natürliche, würdevolle deutsche Wiedergabe von „meine rechte Hand“ und erhält den Parallelismus sowie das Bild göttlicher Macht.
- source_word: טִפְּחָה
  choice: hat ... ausgespannt
  rationale: Das seltene Verb טפח beschreibt hier das Ausbreiten oder Ausspannen des Himmels. „Ausgespannt“ ist im Deutschen anschaulich und passt zur Schöpfungsbildsprache.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet שָׁמַיִם im Deutschen idiomatisch den Himmel als kosmischen Bereich.
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: Rufe ich sie
  rationale: Die vorangestellte Bedingungs- beziehungsweise Zeitkonstruktion gibt die lebendige Beziehung zur folgenden Verbform knapp wieder. Das deutsche „sie“ behandelt Erde und Himmel als gemeinsam Angerufene.
- source_word: יַעַמְדוּ
  choice: stehen sie ... da
  rationale: עמד bedeutet grundsätzlich „stehen“. „Dastehen“ lässt hier zugleich das Sich-Einfinden auf einen Ruf anklingen, ohne die Aussage interpretierend festzulegen.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: „Gemeinsam“ bewahrt den Grundsinn des Adverbs und beschreibt Erde und Himmel als zusammen auf Gottes Ruf hin dastehend.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Schöpfungshandeln
  choice: Die Bilder „meine Hand“ und „meine Rechte“ werden konkret beibehalten.
  alternative: Meine Macht hat die Erde gegründet, und meine Kraft hat den Himmel ausgespannt.
  rationale: Der hebräische Text spricht ausdrücklich in körperlicher Bildsprache. Eine Abstraktion zu Macht und Kraft würde das lebendige Bild interpretierend verflachen.
- issue: Reaktion von Erde und Himmel auf Gottes Ruf
  choice: „Rufe ich sie, stehen sie gemeinsam da.“
  alternative: Wenn ich sie rufe, treten sie gemeinsam an.
  rationale: Die direkte Wiedergabe wahrt sowohl den Grundsinn von עמד als auch die mögliche Nuance des Sich-Einfindens zum Dienst, ohne diese militärisch oder kultisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die anthropomorphe Schöpfungsbildsprache und die unmittelbare Reaktion der geschaffenen Welt bleiben erhalten.
