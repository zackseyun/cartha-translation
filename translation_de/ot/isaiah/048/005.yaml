source:
  edition: WLC
  text: וָ/אַגִּ֤יד לְ/ךָ֙ מֵ/אָ֔ז בְּ/טֶ֥רֶם תָּב֖וֹא הִשְׁמַעְתִּ֑י/ךָ פֶּן תֹּאמַר֙ עָצְבִּ֣/י עָשָׂ֔/ם וּ/פִסְלִ֥/י וְ/נִסְכִּ֖/י צִוָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: de
  text: 'Ich kündigte es dir schon lange zuvor an; bevor es eintraf[a], ließ ich dich davon hören, damit du nicht sagst: »Mein Götze hat sie vollbracht; mein Schnitzbild und mein Gussbild[b] haben sie angeordnet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bevor es kam“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „gegossenes Bild“; traditionell: „Schmelzbild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Ich kündigte es … an
  rationale: Das Hifil von נגד bezeichnet ein Bekanntmachen oder Verkündigen. „ankündigen“ gibt hier zugleich den prophetischen und vorausweisenden Sinn natürlich wieder.
- source_word: מֵאָז
  choice: schon damals
  rationale: Die Wendung verweist auf einen zurückliegenden Zeitpunkt vor dem Eintreffen des Angekündigten. „schon damals“ ist idiomatisch und lässt den genauen zeitlichen Abstand offen.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: bevor es eintraf
  rationale: Das feminine Singularverb bedeutet wörtlich „bevor es kam“ und bezieht sich sinngemäß auf das angekündigte Geschehen. „eintraf“ eignet sich im Deutschen sowohl für eine Vorhersage als auch für ein Ereignis.
- source_word: הִשְׁמַעְתִּיךָ
  choice: ließ ich dich davon hören
  rationale: 'Die Form ist kausativ: Gott bewirkte, dass der Angesprochene es hörte. Die Formulierung wahrt diesen Zug, ohne im Deutschen unnötig sperrig zu werden.'
- source_word: פֶּן
  choice: damit du nicht
  rationale: פֶּן leitet einen abwehrenden Zweck beziehungsweise eine zu verhindernde Folge ein. „damit du nicht“ ist in modernem Deutsch klarer und natürlicher als „auf dass du nicht“.
- source_word: עָצְבִּי
  choice: mein Götze
  rationale: עֶצֶב bezeichnet hier einen Götzen beziehungsweise ein Götzenbild. „Götze“ unterscheidet den allgemeinen Ausdruck von den beiden nachfolgenden, genauer bezeichneten Bildern.
- source_word: עָשָׂם
  choice: hat all das vollbracht
  rationale: Das pluralische Suffix verweist auf die angekündigten Taten oder Ereignisse. „all das“ bildet diesen inhaltlichen Plural im Deutschen idiomatisch ab; „vollbracht“ bezeichnet ihr Herbeiführen und nicht die Herstellung der Bilder.
- source_word: פִסְלִי
  choice: mein Schnitzbild
  rationale: פֶּסֶל ist ein durch Schnitzen oder Behauen geschaffenes Kultbild. „Schnitzbild“ ist knapp, verständlich und genauer als die bloße Wiederholung von „Götze“.
- source_word: וְנִסְכִּי
  choice: und mein Gussbild
  rationale: Der Ausdruck bezeichnet ein gegossenes, traditionell auch „gegossenes“ oder „geschmolzenes“ Bild. „Gussbild“ ist präzises, modernes Deutsch.
- source_word: צִוָּם
  choice: haben es angeordnet
  rationale: צוה bedeutet grundsätzlich „befehlen, anordnen“. Bei Ereignissen klingt „anordnen“ im Deutschen natürlicher, bewahrt aber die ironische Behauptung, die Bilder hätten das Geschehen bestimmt.
theological_decisions:
- issue: Unterscheidung der drei Bezeichnungen für Götzenbilder
  choice: „Götze“, „Schnitzbild“ und „Gussbild“ werden unterschieden wiedergegeben.
  alternative: Alle drei Ausdrücke könnten vereinheitlichend mit „Götzenbild“ übersetzt werden.
  rationale: Der hebräische Text verwendet drei verschiedene Bezeichnungen. Ihre Unterscheidung erhält die rhetorische Zuspitzung der Polemik, ohne zusätzliche theologische Aussagen einzutragen.
- issue: Bezug der pluralischen Suffixe in עָשָׂם und צִוָּם
  choice: Sie beziehen sich auf die zuvor angekündigten Geschehnisse und werden idiomatisch mit „all das“ beziehungsweise „es“ aufgenommen.
  alternative: Man könnte formal pluralisch „sie vollbracht“ und „sie angeordnet“ schreiben, wobei der Bezug im Deutschen undeutlich bliebe.
  rationale: Der Kontext handelt von vorhergesagten Ereignissen, die nicht den Götzen zugeschrieben werden sollen. Die deutsche Wiedergabe macht diesen grammatisch impliziten Bezug verständlich, ohne die Art der Ereignisse näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Die parallelen Bildbezeichnungen und die Spannung zwischen göttlicher Vorankündigung und der falschen Zuschreibung an Götzen bleiben erhalten.
