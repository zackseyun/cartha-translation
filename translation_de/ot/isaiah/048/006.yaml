base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: de
  text: Du hast es gehört; sieh dir das alles an! Und ihr – wollt ihr es nicht verkünden? Von jetzt an lasse ich dich Neues hören, Verborgenes, das du nicht gekannt hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: Du hast es gehört
  rationale: Das Perfekt der 2. Person Singular wird direkt wiedergegeben; das im Deutschen nötige Objekt „es“ greift auf das zuvor Offenbarte zurück.
- source_word: חֲזֵה כֻּלָּהּ
  choice: sieh dies alles an
  rationale: Der Imperativ חֲזֵה verlangt zum aufmerksamen Betrachten auf; כֻּלָּהּ bezeichnet die Gesamtheit dessen, was zuvor angekündigt und nun eingetroffen ist.
- source_word: וְאַתֶּם הֲלוֹא תַגִּידוּ
  choice: Und ihr – wollt ihr es nicht verkünden?
  rationale: Der hebräische Text wechselt ausdrücklich vom Singular zum Plural. הֲלוֹא bildet eine erwartungsvolle rhetorische Frage; „wollt ihr … nicht“ klingt im Deutschen natürlich, ohne die Aussage zur bloßen Feststellung umzudeuten.
- source_word: הִשְׁמַעְתִּיךָ
  choice: lasse ich dich … hören
  rationale: Die Hifil-Form bezeichnet das Hörenlassen bzw. Bekanntmachen; das singularische „dich“ bewahrt den Numeruswechsel des Ausgangstextes.
- source_word: חֲדָשׁוֹת מֵעַתָּה
  choice: Von jetzt an … Neues
  rationale: חֲדָשׁוֹת ist substantivisch gebraucht; מֵעַתָּה markiert den Beginn der nun folgenden Offenbarung.
- source_word: וּנְצֻרוֹת
  choice: Verborgenes
  rationale: Das passive Partizip bezeichnet bewahrte, zurückgehaltene bzw. verborgene Dinge. „Verborgenes“ hält den Sinn offen, ohne eine bestimmte Art der Geheimhaltung festzulegen.
- source_word: וְלֹא יְדַעְתָּם
  choice: das du nicht gekannt hast
  rationale: 'Das Perfekt wird als bisheriger Zustand verstanden: Diese Dinge waren dem Angeredeten bislang unbekannt.'
theological_decisions:
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: „Du … ihr … dich … du“ ausdrücklich beibehalten
  alternative: Die Anrede im Deutschen einheitlich singularisch oder pluralisch gestalten
  rationale: Der auffällige Numeruswechsel steht im hebräischen Text und kann die Spannung zwischen Israel als Gesamtheit und seinen Angehörigen oder Zeugen tragen; er darf nicht stillschweigend geglättet werden.
- issue: Charakter der „neuen“ und „verborgenen“ Dinge
  choice: Ohne nähere dogmatische Bestimmung übersetzen
  alternative: Sie ausdrücklich auf eine bestimmte Heilslehre oder einzelne zukünftige Ereignisse beziehen
  rationale: Der Vers selbst bestimmt Inhalt und zeitliche Reichweite dieser Offenbarung nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den markanten Wechsel von der singularischen zur pluralischen Anrede hörbar. Keine Fußnoten nötig; alle für das Verständnis wesentlichen Spannungen bleiben im Haupttext sichtbar.
