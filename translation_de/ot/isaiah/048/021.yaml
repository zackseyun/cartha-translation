id: ISA.48.21
reference: Isaiah 48:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֣א צָמְא֗וּ בָּ/חֳרָבוֹת֙ הֽוֹלִיכָ֔/ם מַ֥יִם מִ/צּ֖וּר הִזִּ֣יל לָ֑/מוֹ וַ/יִּ֨בְקַע צ֔וּר וַ/יָּזֻ֖בוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: de
  text: Als er sie durch dürre Landstriche[a] führte, litten sie keinen Durst. Er ließ für sie Wasser aus dem Felsen fließen; er spaltete den Felsen[b], und Wasser strömte hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Wüsten“ oder „in den dürren Gebieten“.'
    reason: lexical_alternative
  - marker: b
    text: Der Vers erinnert daran, wie der HERR seinem Volk in der Wüste Wasser aus dem Felsen gab (zum Beispiel 2. Mose 17,6; 4. Mose 20,11).
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: litten sie keinen Durst
  rationale: Das Verb bezeichnet das Erleiden von Durst. Die Formulierung gibt den verbalen Sinn in natürlichem, modernem Deutsch wieder.
- source_word: בָּחֳרָבוֹת
  choice: durch dürre Landstriche
  rationale: Der Plural bezeichnet trockene, öde Gebiete. „Dürre Landstriche“ wahrt die topografische Offenheit; „durch“ passt zum folgenden Verb der Führung.
- source_word: הוֹלִיכָם
  choice: er sie … führte
  rationale: Der Hifil von הלך bedeutet hier „führen“ beziehungsweise „gehen lassen“. „Führte“ ist idiomatisch und bewahrt den kausativen Gedanken.
- source_word: הִזִּיל
  choice: ließ … Wasser … fließen
  rationale: Der Hifil von נזל bezeichnet das Veranlassen des Fließens. Die deutsche Konstruktion macht diese kausative Bedeutung ausdrücklich.
- source_word: מִצּוּר
  choice: aus dem Felsen
  rationale: Der Felsen wird als Ursprung des Wassers bezeichnet. Der bestimmte Artikel entspricht dem konkreten Bild und dem Rückbezug auf die Wüstenerzählungen.
- source_word: וַיִּבְקַע צוּר
  choice: er spaltete den Felsen
  rationale: בקע bedeutet „spalten“ oder „aufbrechen“. „Spaltete“ ist konkret, klar und bildkräftig.
- source_word: וַיָּזֻבוּ מָיִם
  choice: Wasser strömte hervor
  rationale: Das Verb beschreibt das Fließen beziehungsweise Hervorströmen. Die Wiedergabe ist anschaulich, ohne die Intensität übermäßig festzulegen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in der dritten Person Singular
  choice: „er“ bezeichnet im Zusammenhang den HERRN, ohne den Gottesnamen in den Vers einzufügen
  alternative: Ein unbestimmtes oder allgemeines Subjekt
  rationale: Der Kontext beschreibt das Handeln des HERRN an seinem Volk. Da der hebräische Vers selbst keinen ausdrücklichen Gottesnamen enthält, bleibt es beim Pronomen.
- issue: Anspielung auf das Wasserwunder am Felsen während der Wüstenzeit
  choice: Die geschichtlich-poetische Anspielung bleibt im Wortlaut erhalten und wird nur in einer Fußnote kenntlich gemacht
  alternative: Eine ausdrückliche typologische oder sakramentale Deutung im Haupttext
  rationale: Der Vers greift deutlich die Versorgung mit Wasser aus dem Felsen auf, legt hier aber keine weitergehende theologische Deutung ausdrücklich dar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wurde für einen natürlichen deutschen Lesefluss leicht umgeordnet; Bildsprache, Wiederholung von „Felsen“ und die kausative Aussage über das Fließen des Wassers bleiben erhalten.
