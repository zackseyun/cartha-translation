revisions:
- from: Das Frühere habe ich schon vor langer Zeit angekündigt; aus meinem Mund ging es hervor, und ich ließ es hören. Plötzlich handelte ich, und es traf ein.
  to: Die früheren Dinge habe ich längst angekündigt; sie gingen aus meinem Mund hervor, und ich ließ sie vernehmen. Plötzlich handelte ich, und sie traten ein.
  rationale: Die Revision ersetzt die missverständliche Wendung „ließ es hören“ durch die idiomatischere kausative Formulierung „ließ sie vernehmen“ und stellt durchgehend den hebräischen Plural wieder her. Der knappe, feierliche Duktus sowie die Abfolge von Ankündigung, göttlichem Handeln und Eintreten bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge des Hebräischen zutreffend wieder: frühere Dinge werden lange zuvor angekündigt, gehen aus Gottes Mund hervor, werden hörbar gemacht, und Gottes plötzliches Handeln führt zu ihrem Eintreten. Die Singularisierung zu „das Frühere/ es“ ist zwar möglich, verdeckt jedoch den hebräischen Plural und macht die Bezüge weniger klar.'
  naturalness: „Ich ließ es hören“ ist im modernen Deutsch nicht idiomatisch genug und kann missverstanden werden, weil „etwas hören lassen“ hier keine klare kausative Wiedergabe ergibt. Mit pluralischem Bezug und „vernehmen lassen“ ist der Satz verständlicher und bleibt würdevoll.
  terminology: „Die früheren Dinge“ bewahrt den Plural von הָרִאשֹׁנוֹת und entspricht dem etablierten Jesaja-Kontrast von früheren und neuen Dingen. „Längst“ gibt מֵאָז natürlich wieder. „Vernehmen lassen“ vermittelt die kausative Form von שמע, ohne die Aussage zu einer spezifischen theologischen Deutung auszuweiten.
  issues:
  - severity: medium
    issue: Unklare kausative Formulierung „und ich ließ es hören“
    rationale: Die Formulierung ist im heutigen Deutsch semantisch und syntaktisch schwer greifbar. Das hebräische Hifil besagt, dass die zuvor genannten Dinge hörbar bzw. bekannt gemacht wurden. „Ich ließ sie vernehmen“ gibt dies klarer wieder.
  - severity: low
    issue: Singularischer Sammelbezug verschleiert den hebräischen Plural
    rationale: „Das Frühere ... es“ ist nicht falsch, doch הָרִאשֹׁנוֹת sowie die folgenden Verbformen stehen im Plural. „Die früheren Dinge ... sie“ erhält die Textkohärenz und ist natürliches Deutsch.
  revised_text: Die früheren Dinge habe ich längst angekündigt; sie gingen aus meinem Mund hervor, und ich ließ sie vernehmen. Plötzlich handelte ich, und sie traten ein.
  revised_footnotes: []
  revision_rationale: Die Revision ersetzt die missverständliche Wendung „ließ es hören“ durch die idiomatischere kausative Formulierung „ließ sie vernehmen“ und stellt durchgehend den hebräischen Plural wieder her. Der knappe, feierliche Duktus sowie die Abfolge von Ankündigung, göttlichem Handeln und Eintreten bleiben erhalten.
