source:
  edition: WLC
  text: הָ/רִֽאשֹׁנוֹת֙ מֵ/אָ֣ז הִגַּ֔דְתִּי וּ/מִ/פִּ֥/י יָצְא֖וּ וְ/אַשְׁמִיעֵ֑/ם פִּתְאֹ֥ם עָשִׂ֖יתִי וַ/תָּבֹֽאנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: de
  text: Die früheren Dinge habe ich längst angekündigt; sie gingen aus meinem Mund hervor, und ich ließ sie vernehmen. Plötzlich handelte ich, und sie traten ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: das Frühere
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet frühere Ereignisse beziehungsweise zuvor angekündigte Dinge. Der deutsche Sammelbegriff wahrt den Rückbezug trotz des grammatischen Singulars.
- source_word: מֵאָז
  choice: schon vor langer Zeit
  rationale: Die Wendung verweist hier auf einen weit zurückliegenden Zeitpunkt der Ankündigung; die Übersetzung klingt natürlich und macht den zeitlichen Abstand deutlich.
- source_word: הִגַּדְתִּי
  choice: habe ich … angekündigt
  rationale: Der Hifil von נגד bezeichnet hier das autoritative Bekanntmachen zukünftiger Ereignisse. „Angekündigt“ passt zum prophetischen Zusammenhang und bleibt im heutigen Deutsch verständlich.
- source_word: וּמִפִּי יָצְאוּ
  choice: aus meinem Mund ging es hervor
  rationale: Die konkrete Metapher der aus Gottes Mund hervorgehenden Rede bleibt erhalten. Das singularische Pronomen nimmt im Deutschen den Sammelbegriff „das Frühere“ auf.
- source_word: וְאַשְׁמִיעֵם
  choice: und ich ließ es hören
  rationale: 'Die Formulierung bewahrt die kausative Bedeutung des Hifil von שמע: Gott bewirkte, dass die Ankündigung gehört wurde.'
- source_word: פִּתְאֹם
  choice: Plötzlich
  rationale: Das Adverb bezeichnet die unvermittelte, rasche göttliche Handlung.
- source_word: עָשִׂיתִי
  choice: handelte ich
  rationale: Das häufige Verb עשה bedeutet grundsätzlich „tun/machen“. Im Zusammenhang bezeichnet es Gottes Eingreifen, ohne durch „bewirkte es“ die Aussage stärker kausal festzulegen als der Wortlaut.
- source_word: וַתָּבֹאנָה
  choice: und es traf ein
  rationale: Das feminine Pluralverb bezieht sich auf הָרִאשֹׁנוֹת. Bei angekündigten Ereignissen gibt „eintreffen“ idiomatisch wieder, dass sie Wirklichkeit wurden.
theological_decisions:
- issue: Verhältnis von göttlicher Vorankündigung und Erfüllung
  choice: Die Übersetzung stellt Gottes frühere Ankündigung, sein plötzliches Handeln und das Eintreffen des Angekündigten nebeneinander.
  alternative: Man könnte עָשִׂיתִי stärker kausal mit „ich führte es herbei“ wiedergeben oder minimaler mit „ich tat es“.
  rationale: „Ich handelte“ wahrt die Aussage göttlichen Eingreifens, ohne eine über den hebräischen Wortlaut hinausgehende Bestimmung der Kausalität einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache vom Mund bleibt erhalten; die hebräischen femininen Pluralformen werden wegen des deutschen Sammelbegriffs „das Frühere“ idiomatisch im Singular aufgenommen.
