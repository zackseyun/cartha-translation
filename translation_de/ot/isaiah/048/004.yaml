source:
  edition: WLC
  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
translation:
  language: de
  text: Weil ich wusste, dass du halsstarrig[a] bist, dass dein Nacken eine eiserne Sehne[b] ist und dass deine Stirn aus Bronze[c] ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hart“ oder „störrisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Nacken [ist] eine eiserne Sehne“. Das Bild bezeichnet unbeugsamen Widerstand.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „deine Stirn [ist] Bronze“. Das Bild kann schamlose Verhärtung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: Weil ich wusste, dass
  rationale: Die Verbindung führt den Grund für die vorausgehende Aussage ein und bezeichnet zugleich den Inhalt des Wissens. Die deutsche Konstruktion bewahrt beides in natürlicher Form.
- source_word: קָשֶׁה
  choice: halsstarrig
  rationale: Das Adjektiv bedeutet wörtlich „hart“, bezeichnet hier bei einer Person jedoch hartnäckigen Widerstand. „Halsstarrig“ gibt diesen Sinn wieder und passt zu dem folgenden Bild des Nackens.
- source_word: וְגִיד בַּרְזֶל
  choice: eine eiserne Sehne
  rationale: גִּיד bezeichnet eine Sehne. Die konkrete Metallmetapher wird ohne erklärende Auflösung bewahrt.
- source_word: עָרְפֶּךָ
  choice: dein Nacken
  rationale: Das Wort bezeichnet den Nacken beziehungsweise die Rückseite des Halses. „Nacken“ ist hier genauer als das allgemeinere „Hals“ und trägt das Bild des unbeugsamen Widerstands.
- source_word: וּמִצְחֲךָ
  choice: deine Stirn
  rationale: מֵצַח bezeichnet Stirn oder Braue; „Stirn“ ist im modernen Deutsch unmittelbar verständlich und erhält das Körperbild.
- source_word: נְחוּשָׁה
  choice: aus Bronze
  rationale: Das Wort bezeichnet Kupfer beziehungsweise Bronze. „Aus Bronze“ formuliert das nominale hebräische Prädikat natürlich und wahrt das Bild metallischer Härte.
theological_decisions:
- issue: Bildhafte Beschreibung von Israels Widersetzlichkeit
  choice: 'Die Körper- und Metallbilder bleiben erhalten: „dein Nacken eine eiserne Sehne“ und „deine Stirn aus Bronze“.'
  alternative: 'Die Bilder deutend auflösen, etwa: „du bist unbeugsam und schamlos“.'
  rationale: Der hebräische Text formuliert eine konkrete prophetische Anklage. Eine abstrakte Deutung würde die Bildkraft mindern und die mögliche Bedeutung der bronzenen Stirn stärker festlegen, als es der Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen Körper-Metall-Metaphern werden bewusst bewahrt; die Ellipse bei „dein Nacken eine eiserne Sehne“ folgt der knappen hebräischen Parallelstruktur und bleibt im Deutschen verständlich.
