review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Anrede, die Herkunftsmetapher, das Schwören bei Jahwes Namen, das Anrufen des Gottes Israels sowie die doppelte Verneinung sachgerecht wieder. Die Fußnote bewahrt die wörtliche Metapher und kennzeichnet die Abstammungsdeutung angemessen als wahrscheinlich.
  naturalness: „Haus Jakob“ ist in dieser Anrede im modernen Standarddeutsch weniger natürlich als „ihr vom Haus Jakobs“. Außerdem klingt „mit dem Namen Israel genannt“ unidiomatisch; „nach dem Namen Israel genannt“ gibt die hebräische Namenskonstruktion klarer wieder.
  terminology: „Jahwe“, „Gott Israels“, „Wahrheit“ und „Gerechtigkeit“ sind treffend und registergerecht. „bei dem Namen Jahwes schwört“ ist die idiomatischere ausgeschriebene Form.
