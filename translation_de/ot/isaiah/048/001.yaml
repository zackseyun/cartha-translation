  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: de
  text: Hört dies, ihr vom Haus Jakobs, die ihr nach dem Namen Israel genannt seid und aus den Wassern Judas hervorgegangen seid[a], die ihr bei dem Namen Jahwes schwört und den Gott Israels anruft – doch nicht in Wahrheit und nicht in Gerechtigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus den Wassern Judas“. Gemeint ist wahrscheinlich, dass sie von Juda abstammen, also seine Nachkommen sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Hört dies
  rationale: Der pluralische Imperativ mit Demonstrativ wird als unmittelbarer prophetischer Aufruf wiedergegeben; „dies“ bewahrt die knappe Form des Hebräischen.
- source_word: בֵּית יַעֲקֹב
  choice: Haus Jakob
  rationale: Die feste prophetische Anrede bleibt formal und intertextuell erkennbar.
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: die ihr mit dem Namen Israel genannt seid
  rationale: Die Formulierung bewahrt sowohl die passive Bezeichnung als auch die Konstruktion mit „Name“, ohne sie auf bloßes Nam Tragen zu verengen.
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: und aus den Wassern Judas hervorgegangen seid
  rationale: Das auffällige hebräische Bild „Wasser Judas“ bleibt im Haupttext erhalten; der wahrscheinlich gemeinte Abstammungssinn wird in der Fußnote erklärt.
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: die ihr beim Namen Jahwes schwört
  rationale: Die Wendung bezeichnet das Ablegen von Schwüren unter Berufung auf den göttlichen Namen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: und den Gott Israels anruft
  rationale: 'Das Hifil von זכר hat hier im Zusammenhang mit Eid und Bekenntnis einen performativen Sinn: sich auf den Gott Israels berufen beziehungsweise ihn anrufen.'
- source_word: לֹא בֶאֱמֶת וְלֹא בִצְדָקָה
  choice: doch nicht in Wahrheit und nicht in Gerechtigkeit
  rationale: Die beiden abstrakten Begriffe und ihre parallele Verneinung werden bewahrt; „doch“ macht den im Zusammenhang liegenden Gegensatz im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ wahrt ihn als Namen und ist die im modernen Deutschen übliche wissenschaftlich begründete Form.
- issue: Deutung von מִמֵּי יְהוּדָה
  choice: Das wörtliche Bild „aus den Wassern Judas“ im Haupttext bewahren und den Abstammungssinn erläutern.
  alternative: aus Juda hervorgegangen; aus den Lenden Judas; Nachkommen Judas
  rationale: Die Wendung bezeichnet wahrscheinlich Herkunft beziehungsweise leibliche Abstammung, doch das ungewöhnliche Bild gehört ausdrücklich zum überlieferten Wortlaut. Eine Fußnote ermöglicht Verständlichkeit, ohne die Metapher stillschweigend aufzulösen.
- issue: Bedeutung von אֱמֶת und צְדָקָה
  choice: Wahrheit und Gerechtigkeit
  alternative: Treue und Rechtschaffenheit; wahrhaftig und aufrichtig
  rationale: Die substantivische Form erhält die theologische und ethische Spannweite beider Wörter, statt sie allein auf subjektive Aufrichtigkeit zu beschränken.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten prophetischen und poetischen Hebraismen. Die direkte Anrede wird durchgehend mit „ihr“ wiedergegeben; der lange Satz bleibt zur Wahrung der rhetorischen Bewegung als Einheit erhalten.
