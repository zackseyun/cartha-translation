    issue: Unnatürliche Anrede und Genitivform
    rationale: „Haus Jakob“ ist als deutsche Anrede ungewöhnlich und lässt den Genitiv vermissen. „ihr vom Haus Jakobs“ ist modernes, verständliches Deutsch und bewahrt den kollektiven Charakter von בֵּית יַעֲקֹב.
  - severity: low
    issue: Unidiomatische Wendung „mit dem Namen Israel genannt“
    rationale: Die Präposition „mit“ ist hier im Deutschen nicht die natürliche Entsprechung der Namensbezeichnung. „nach dem Namen Israel genannt“ erhält die quellennahe Konstruktion und liest sich klarer.
  - severity: low
    issue: Zusammengezogene Präposition bei der Eidesformel
    rationale: „beim Namen Jahwes“ ist verständlich, aber „bei dem Namen Jahwes“ ist in diesem gehobenen prophetischen Register klarer und näher an der formelhaften Wendung.
