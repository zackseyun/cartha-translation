  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י לֹ֤א בְ/חִפָּזוֹן֙ תֵּצֵ֔אוּ וּ/בִ/מְנוּסָ֖ה לֹ֣א תֵלֵכ֑וּ/ן כִּֽי הֹלֵ֤ךְ לִ/פְנֵי/כֶם֙ יְהוָ֔ה וּ/מְאַסִּפְ/כֶ֖ם אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: de
  text: Denn ihr werdet nicht in Hast ausziehen und nicht fluchtartig fortgehen; denn Jahwe geht vor euch her, und der Gott Israels bildet eure Nachhut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und der Gott Israels sammelt euch von hinten her“; gemeint ist, dass er den Zug nach hinten sichert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: in Hast
  rationale: חִפָּזוֹן bezeichnet hastige, überstürzte Bewegung. „In Hast“ ist natürlich und bewahrt den Kontrast zu einem ruhig geschützten Auszug, ohne zwingend Panik auszudrücken.
- source_word: תֵּצֵאוּ
  choice: ausziehen
  rationale: יצא bedeutet wörtlich „hinausgehen“. Im Kontext eines gemeinschaftlichen Aufbruchs wahrt „ausziehen“ die konkrete Bewegung und den Anklang an den Exodus.
- source_word: וּבִמְנוּסָה
  choice: fluchtartig
  rationale: מְנוּסָה bezeichnet Flucht beziehungsweise fliehende Bewegung. „Fluchtartig“ gibt im Deutschen knapp wieder, dass sie nicht wie Flüchtende fortgehen werden.
- source_word: תֵלֵכוּן
  choice: fortgehen
  rationale: הלך bedeutet „gehen“. „Fortgehen“ passt idiomatisch zum parallelen „ausziehen“ und bezeichnet hier die weitere Bewegung.
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: geht vor euch her
  rationale: Das Partizip stellt Jahwes aktives, begleitendes Vorangehen anschaulich dar. Die deutsche Präsensform ist dafür natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וּמְאַסִּפְכֶם
  choice: bildet eure Nachhut
  rationale: אסף bedeutet grundsätzlich „sammeln“; in diesem Prozessions- oder Schutzkontext bezeichnet die Form das Sammeln beziehungsweise Sichern von hinten. „Bildet eure Nachhut“ vermittelt die Funktion klar, während die Fußnote das wörtlichere Bild bewahrt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die unmittelbare Wiedergabe der Status-constructus-Verbindung bewahrt die Bundesbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bild von Gottes Stellung hinter Israel
  choice: bildet eure Nachhut
  alternative: sammelt euch von hinten
  rationale: Die gewählte Formulierung macht die Schutzfunktion verständlich, ohne das Grundbild von Gottes Tätigkeit hinter dem Zug völlig aufzugeben; die wörtlichere Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität und das Exodusbild bleiben erhalten. „Fluchtartig“ vermeidet eine unnötig substantivische Wendung; „Nachhut“ ist ein geläufiger, präziser Ausdruck für den Schutz von hinten.
