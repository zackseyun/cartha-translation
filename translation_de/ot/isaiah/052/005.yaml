  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: de
  text: „Und nun, was habe ich hier?“, spricht Jahwe. „Denn mein Volk ist umsonst weggenommen worden; die über es herrschen, heulen[a]“, spricht Jahwe, „und fortwährend, den ganzen Tag, wird mein Name verachtet[b].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Unterdrücker des Volkes heulen.“ Der hebräische Ausdruck bezeichnet diejenigen, die über das Volk herrschen; im Zusammenhang erscheinen sie als Unterdrücker.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird mein Name gelästert.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlichen Übergang.
- source_word: מַה־לִּי פֹה
  choice: was habe ich hier?
  rationale: Gibt die rhetorische Frage idiomatisch wieder und erhält den Ton göttlichen Protests.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und würdige Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende rhetorische Frage ein.
- source_word: לֻקַּח עַמִּי
  choice: mein Volk ist weggenommen worden
  rationale: Die Passivform und die vollendete Handlung mit fortdauernder Bedeutung bleiben erhalten, ohne die Art der Wegführung näher festzulegen.
- source_word: חִנָּם
  choice: umsonst
  rationale: Bewahrt die mögliche Bedeutung „ohne Entgelt“ ebenso wie die weitere Nuance „ohne Grund“, statt sich im Haupttext festzulegen.
- source_word: מֹשְׁלָיו
  choice: die über es herrschen
  rationale: Macht den Bezug auf „mein Volk“ deutlich und vermeidet die stärker deutende Wiedergabe „Unterdrücker“ im Haupttext.
- source_word: יְהֵילִילוּ
  choice: heulen
  rationale: Gibt das laute, klagende Heulen des hebräischen Verbs kräftiger wieder als das allgemeinere „jammern“.
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: und fortwährend, den ganzen Tag
  rationale: Beide Zeitangaben werden beibehalten, sodass ihre verstärkende Wirkung erkennbar bleibt.
- source_word: שְׁמִי
  choice: mein Name
  rationale: Bewahrt die konkrete Rede vom Namen Gottes und damit von seiner offenbarten Ehre und seinem Ansehen.
- source_word: מִנֹּאָץ
  choice: wird verachtet
  rationale: Die breite Bedeutung des Verbs bleibt erhalten; die im Zusammenhang mögliche stärkere Wiedergabe „wird gelästert“ steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese Unterscheidung.
- issue: Art der Entehrung des göttlichen Namens in מִנֹּאָץ
  choice: mein Name wird verachtet
  alternative: mein Name wird gelästert
  rationale: Das Verb kann allgemein Verachtung oder im Zusammenhang mit Gottes Namen spezifischer Lästerung bezeichnen. Der Haupttext wahrt die weitere Bedeutung, die Fußnote die stärkere Möglichkeit.
- issue: Identität und Charakter der מֹשְׁלָיו
  choice: die über es herrschen
  alternative: seine Unterdrücker
  rationale: Das Nomen bezeichnet zunächst Herrschende; dass sie Unterdrücker sind, liegt im Zusammenhang nahe, wird aber nicht stillschweigend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gottesrede wird durch Anführungszeichen gegliedert. „Umsonst“ und „verachtet“ bewahren bewusst die Bedeutungsbreite des Hebräischen; stärker deutende Möglichkeiten stehen in den Fußnoten.
