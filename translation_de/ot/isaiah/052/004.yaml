source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: de
  text: 'Denn so spricht Jahwe, der Herr: Mein Volk zog einst nach Ägypten hinab, um dort als Fremde zu leben; und Assyrien unterdrückte es ohne Grund.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »umsonst«, »für nichts« oder »ohne Gegenleistung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יהוה wieder, ohne beide zu dem missverständlichen »Herr HERR« zusammenzuziehen.
- source_word: מִצְרַיִם יָרַד
  choice: zog nach Ägypten hinab
  rationale: Bewahrt die hebräische Richtungsangabe »hinabziehen« und klingt im Deutschen bei einer Wanderung natürlich.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Direkte und idiomatische Wiedergabe der Zugehörigkeitsbezeichnung.
- source_word: בָרִאשֹׁנָה
  choice: einst
  rationale: Bezeichnet hier das frühere geschichtliche Geschehen in Ägypten; »einst« ist knapp und natürlich, ohne zwingend eine absolute zeitliche Reihenfolge festzulegen.
- source_word: לָגוּר שָׁם
  choice: um dort als Fremde zu leben
  rationale: גור bezeichnet den Aufenthalt als Fremder beziehungsweise Schutzbürger. Die deutsche Pluralform nimmt die einzelnen Angehörigen des kollektiv bezeichneten Volkes in den Blick.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Im Kontext ist das assyrische Reich beziehungsweise Volk gemeint.
- source_word: עֲשָׁקוֹ
  choice: unterdrückte es
  rationale: עשק bezeichnet bedrückendes, ausbeuterisches Unrecht. Das sächliche Singularpronomen entspricht im Deutschen dem kollektiven Bezugswort »Volk« und bewahrt damit den Singular des Hebräischen natürlich.
- source_word: בְּאֶפֶס
  choice: ohne Grund
  rationale: Die Wendung kann fehlenden Anlass, fehlende Gegenleistung oder ein unentgeltliches beziehungsweise grundloses Handeln bezeichnen. Im Zusammenhang mit Unterdrückung ist »ohne Grund« eine klare, jedoch nicht alternativlose Wiedergabe.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form macht sowohl den Titel als auch den im Ausgangstext stehenden Eigennamen sichtbar und vermeidet eine konfessionell geprägte Auflösung.
- issue: Numerus und kollektive Personifikation in עֲשָׁקוֹ
  choice: unterdrückte es
  alternative: unterdrückte sie; unterdrückte ihn
  rationale: Der hebräische Suffix ist maskulin Singular und bezieht sich auf »mein Volk« als Kollektiv. Da »Volk« im Deutschen sächlich ist, erhält »es« den kollektiven Singular, ohne ein unnatürliches Genus zu erzwingen.
- issue: Bedeutung von בְּאֶפֶס
  choice: ohne Grund
  alternative: umsonst; für nichts; ohne Gegenleistung
  rationale: Der Kontext legt ungerechtfertigte Unterdrückung nahe, doch die mögliche wirtschaftliche Nuance der Wendung bleibt in einer Fußnote erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Als Fremde leben« erschließt den sozialen Gehalt von גור verständlicher als das heute gehobene »weilen«. Der kollektive Singular wird mit »es« natürlich beibehalten.
