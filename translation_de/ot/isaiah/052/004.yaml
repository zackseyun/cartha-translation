  source_fidelity: 'Die wesentlichen Inhalte sind zutreffend wiedergegeben: der Abstieg nach Ägypten, der Aufenthalt als Fremde, Assyrien als Unterdrücker, der kollektive Singular bei »mein Volk« sowie die offene Bedeutung von בְּאֶפֶס. »ohne Grund« ist im Kontext eine tragfähige Hauptwiedergabe; die Fußnote wahrt die möglichen Alternativen. Der einfache hebräische Anschluss mit וְ wird jedoch besser nicht unnötig adversativ mit »aber« ausgelegt.'
