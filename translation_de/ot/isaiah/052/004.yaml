  terminology: Die Wiedergabe des Gottesnamens mit »Jahwe« macht das Tetragramm sichtbar; »der Herr« gibt אַדֹנָי wieder. »als Fremde zu leben« vermittelt die für גוּר relevante Fremdheits- bzw. Aufenthaltsnuance angemessen. Assyrien ist der passende Länder-/Reichsname.
