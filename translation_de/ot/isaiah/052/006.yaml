id: ISA.52.6
reference: Isaiah 52:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: de
  text: 'Darum wird mein Volk meinen Namen kennen; darum wird es an jenem Tag erkennen, dass ich es bin, der spricht: »Hier bin ich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: darum
  rationale: Kennzeichnet die Folge aus dem vorausgehenden Zusammenhang. Die Wiederholung wird beibehalten, um den Nachdruck und die Gliederung des Hebräischen wiederzugeben.
- source_word: יֵדַע
  choice: wird … kennen / wird … erkennen
  rationale: Das Imperfekt bezeichnet hier eine zukünftige Gewissheit. Beim Namen ist „kennen“ natürlich; für die anschließende inhaltliche Erkenntnis wird das im Deutschen passendere „erkennen“ verwendet.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Bewahrt die kollektive und bundestheologisch geprägte, aber nicht weiter ausgedeutete Bezeichnung.
- source_word: שְׁמִי
  choice: meinen Namen
  rationale: Die wörtliche Formulierung bleibt erhalten und lässt die im hebräischen Namensbegriff mitschwingenden Aspekte von Identität, Ruf und offenbartem Wesen offen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche moderne deutsche Wiedergabe der prophetischen Zeitangabe.
- source_word: כִּי
  choice: dass
  rationale: Leitet hier am wahrscheinlichsten den Inhalt dessen ein, was das Volk erkennen wird.
- source_word: אֲנִי הוּא
  choice: ich es bin
  rationale: Gibt die knappe, betonte Selbstidentifikation idiomatisch wieder, ohne sie zu einer weitergehenden theologischen Aussage auszubauen.
- source_word: הַמְדַבֵּר
  choice: der spricht
  rationale: Gibt das substantivierte Partizip als Relativsatz wieder und bewahrt dessen unmittelbare verbale Kraft.
- source_word: הִנֵּנִי
  choice: Hier bin ich!
  rationale: Moderne, klare Wiedergabe der Formel unmittelbarer Selbstgegenwart.
theological_decisions:
- issue: Betonte göttliche Selbstidentifikation אֲנִי הוּא
  choice: dass ich es bin
  alternative: dass ich der bin
  rationale: „Ich es bin“ wahrt die knappe emphatische Identifikation und mögliche intertextuelle Resonanzen, ohne eine im Vers nicht ausdrücklich formulierte dogmatische Deutung einzutragen.
- issue: Bezug von הַמְדַבֵּר und הִנֵּנִי
  choice: 'der spricht: »Hier bin ich!«'
  alternative: 'der sagt: »Hier bin ich!«'
  rationale: Die gewählte Fassung lässt das Partizip formal als „spricht“ stehen und versteht „Hier bin ich“ als den unmittelbar folgenden Inhalt der göttlichen Rede. Die Alternative macht diesen Zusammenhang syntaktisch expliziter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. Die zweimalige Folgeformel „darum“ und die knappe Schlusswendung werden bewahrt; unnötig altertümliche Formen werden vermieden.
