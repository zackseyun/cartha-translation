id: ISA.52.10
reference: Isaiah 52:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: de
  text: Jahwe hat seinen heiligen Arm vor den Augen aller Nationen entblößt[a][b], und alle Enden der Erde werden die Rettung unseres Gottes sehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „aufgedeckt“ oder „bloßgelegt“. Das hebräische Verb zeichnet das Bild eines zum entschlossenen Handeln freigemachten Arms.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „vor aller Augen“ oder „im Angesicht aller Nationen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „das Heil unseres Gottes“ oder „die Befreiung unseres Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂף
  choice: hat … entblößt
  rationale: Das Verb bezeichnet das Aufdecken oder Entblößen. Die Formulierung bewahrt das anschauliche Bild, dass der Arm zum entschlossenen Eingreifen freigemacht wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: זְרֹעַ קָדְשׁוֹ
  choice: seinen heiligen Arm
  rationale: Die natürliche deutsche Formulierung erhält das anthropomorphe Bild für Gottes machtvolles, rettendes Handeln und bewahrt zugleich die Bezeichnung als heilig.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die Wendung gibt sowohl die wörtliche Bildlichkeit als auch den öffentlichen, für alle sichtbaren Charakter des Handelns wieder.
- source_word: כָּל הַגּוֹיִם
  choice: aller Nationen
  rationale: Hier sind umfassend die Völker der Welt gemeint; „Nationen“ vermeidet eine unnötige Verengung auf Nichtjuden als religiöse Kategorie.
- source_word: וְרָאוּ
  choice: werden … sehen
  rationale: Die Perfektform steht im prophetischen Zusammenhang für die sichere, noch zu erwartende Folge von Jahwes offenbartem Handeln.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: alle Enden der Erde
  rationale: Die vertraute hebräische Wendung bezeichnet die äußersten Bereiche und damit die ganze Erde in ihrer weltweiten Ausdehnung.
- source_word: יְשׁוּעַת
  choice: die Rettung
  rationale: Das Substantiv kann Rettung, Heil oder Befreiung bezeichnen. „Rettung“ ist im modernen Deutsch konkret und weit genug, ohne den Ausdruck auf eine einzelne Ausprägung festzulegen.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Wiedergabe bewahrt die Zugehörigkeitsperspektive der ersten Person Plural und die natürliche deutsche Genitivverbindung.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: Das konkrete Bild „seinen heiligen Arm“ wird beibehalten.
  alternative: Deutende Wiedergabe wie „seine heilige Macht“.
  rationale: Der hebräische Text spricht ausdrücklich in körperlicher Bildsprache. Ihre Bewahrung erhält die poetische Kraft und legt die Metapher nicht vorschnell abstrakt aus.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von וְרָאוּ
  choice: 'Zukünftige Folge: „werden … sehen“.'
  alternative: 'Abgeschlossene Aussage: „haben … gesehen“.'
  rationale: Obwohl die hebräische Form formal ein Perfekt ist, spricht der prophetische Zusammenhang für die gewiss erwartete Folge des zuvor verkündeten Handelns. Die deutsche Zukunftsform macht diesen Zusammenhang verständlich, ohne die Gewissheit abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Der Satz folgt der parallelen Struktur des Hebräischen, bleibt aber idiomatisch. „Nationen“ trägt den universalen Bezug; „Rettung“ ist alltagssprachlich verständlich und zugleich theologisch tragfähig.
