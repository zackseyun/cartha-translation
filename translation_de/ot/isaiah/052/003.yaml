id: ISA.52.3
reference: Isaiah 52:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: de
  text: 'Denn so spricht Jahwe: »Umsonst wurdet ihr verkauft, und nicht für Geld werdet ihr erlöst werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Gottesrede mit begründender beziehungsweise erläuternder Kraft ein und passt zum Zusammenhang.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Bewahrt die formelhafte prophetische Botenrede in einer würdigen, im Deutschen geläufigen Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: חִנָּם
  choice: umsonst
  rationale: Bezeichnet hier, dass beim Verkauf keine Gegenleistung erbracht wurde, und erhält den pointierten Gegensatz zur Erlösung ohne Geld.
- source_word: נִמְכַּרְתֶּם
  choice: wurdet ihr verkauft
  rationale: Gibt den Nifal sachgerecht als Passiv wieder, ohne eine nicht zwingende reflexive Bedeutung einzutragen.
- source_word: וְלֹא בְכֶסֶף
  choice: und nicht für Geld
  rationale: כסף kann Silber bezeichnen, steht in diesem wirtschaftlichen Bild jedoch natürlich für Geld beziehungsweise Bezahlung. Die ungewöhnliche Wortstellung bewahrt die betonte Verneinung des Hebräischen.
- source_word: תִּגָּאֵלוּ
  choice: werdet ihr erlöst werden
  rationale: Bewahrt die Bedeutung von גאל als Loskauf beziehungsweise befreiende Erlösung und lässt offen, wie diese Erlösung geschieht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen; die Transliteration erhält diesen persönlichen Bundesnamen.
- issue: Aussage über die Erlösung
  choice: Das wirtschaftliche Bild bleibt erhalten, ohne den Erlösungsmechanismus näher festzulegen.
  alternative: Die Aussage als buchstäblichen finanziellen Loskauf oder als ausschließlich geistliche Wiederherstellung zu deuten.
  rationale: Der Vers stellt Verkauf ohne Gegenleistung und Erlösung ohne Geld einander gegenüber. Die Übersetzung wahrt diese Spannung, ohne zusätzliche Lehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel »so spricht Jahwe« ist bewusst leicht formal; »umsonst« ist knapp und idiomatisch. Die Schlussstellung »werdet ihr erlöst werden« spiegelt die Hervorhebung von »nicht für Geld« und bleibt dennoch verständlich.
