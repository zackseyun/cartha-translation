  text: כֵּ֤ן יַזֶּה֙ גּוֹיִ֣ם רַבִּ֔ים עָלָ֛י/ו יִקְפְּצ֥וּ מְלָכִ֖ים פִּי/הֶ֑ם כִּ֠י אֲשֶׁ֨ר לֹֽא סֻפַּ֤ר לָ/הֶם֙ רָא֔וּ וַ/אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ הִתְבּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: de
  text: So wird er viele Völker besprengen[a]; Könige werden wegen ihm ihren Mund verschließen. Denn sie werden sehen, was ihnen nicht erzählt worden war, und verstehen, was sie nicht gehört hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So wird er viele Völker in Staunen versetzen.“ Das hebräische Verb bedeutet gewöhnlich „besprengen“; manche verstehen es hier jedoch im Sinn von „in Staunen versetzen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Stellt die entsprechende Folge zum vorangehenden Vergleich in Vers 14 her und bleibt knapp sowie natürlich.
- source_word: יַזֶּה
  choice: wird er … besprengen
  rationale: Der Hifil von נזה bedeutet gewöhnlich „besprengen“, besonders in kultischen und reinigenden Zusammenhängen. Die alternative Deutung „in Staunen versetzen“ wird wegen der lexikalischen Debatte in einer Fußnote bewahrt.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: Bezeichnet hier zahlreiche Nationen beziehungsweise Völkerschaften und nicht notwendig „Heiden“ als späteren religiösen Gegensatzbegriff.
- source_word: עָלָיו
  choice: seinetwegen
  rationale: Gibt die Präposition im Zusammenhang mit dem folgenden Ausdruck als Anlass für das erstaunte Schweigen der Könige idiomatisch wieder.
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: Könige werden … den Mund schließen
  rationale: Bewahrt das konkrete Bild des hebräischen Idioms für sprachloses Staunen in natürlichem Deutsch.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das Schweigen der Könige ein.
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: sie werden sehen, was ihnen nicht erzählt worden war
  rationale: Wahrt den Gegensatz zwischen der zuvor ausgebliebenen Mitteilung und dem künftigen Sehen; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: und verstehen, was sie nicht gehört hatten
  rationale: התבונן bezeichnet einsichtiges Erfassen, nicht bloßes Wahrnehmen oder Hören.
theological_decisions:
- issue: Bedeutung von יַזֶּה im Zusammenhang des Gottesknechts
  choice: Er wird viele Völker besprengen.
  alternative: Er wird viele Völker in Staunen versetzen / aufschrecken.
  rationale: Die reguläre lexikalische Bedeutung des Hifil von נזה ist „besprengen“ und kann kultische beziehungsweise reinigende Bildsprache anklingen lassen. Da „in Staunen versetzen“ eine bedeutende, aber umstrittene Kontextdeutung ist, wird sie nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, während „seinetwegen den Mund schließen“ und die deutschen Tempusformen idiomatisch formuliert sind.
