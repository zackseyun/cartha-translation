  variant: modern standard German
source:
  edition: WLC
  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: de
  text: Weicht[a], weicht! Zieht von dort fort! Rührt nichts Unreines an! Zieht aus ihrer Mitte[b] hinaus! Reinigt euch[c], die ihr die Geräte Jahwes tragt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geht fort, geht fort!“ Die Wiederholung verstärkt den Aufruf, sich zu trennen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus ihrer Mitte“; das feminine Pronomen bezieht sich wahrscheinlich auf die als weiblich vorgestellte Stadt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Seid rein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Weicht
  rationale: Der zweimalige Imperativ von סור ruft nachdrücklich zur Absonderung auf. „Weicht“ bleibt vom folgenden צְאוּ („zieht … fort/hinaus“) unterscheidbar und bewahrt so die Abfolge der hebräischen Aufforderungen.
- source_word: צְאוּ מִשָּׁם
  choice: Zieht von dort fort
  rationale: צְאוּ ist ein pluralischer Imperativ von יצא; die Formulierung gibt die räumliche Aufforderung zum Verlassen des Ortes in natürlichem Deutsch wieder.
- source_word: טָמֵא אַל תִּגָּעוּ
  choice: Rührt nichts Unreines an
  rationale: טָמֵא wird substantivisch gebraucht. „Nichts Unreines“ lässt offen, ob Gegenstände, Praktiken oder Verunreinigung allgemein im Blick sind, und bewahrt die kultisch-ethische Sprache.
- source_word: צְאוּ מִתּוֹכָהּ
  choice: Zieht aus ihrer Mitte hinaus
  rationale: Das feminine Suffix der 3. Person Singular wird mit „ihrer“ sichtbar erhalten; der Bezug auf eine als weiblich gedachte Stadt wird nicht zu einem unpersönlichen „daraus“ eingeebnet.
- source_word: הִבָּרוּ
  choice: Reinigt euch
  rationale: Der pluralische Imperativ bezeichnet im Zusammenhang mit den heiligen Geräten Reinigung beziehungsweise Reinheit. Die reflexive Form ist im Deutschen klar und wahrt zugleich den kultischen und ethischen Bedeutungsraum.
- source_word: נֹשְׂאֵי
  choice: die ihr … tragt
  rationale: Das Partizip wird als direkte Anrede der Träger wiedergegeben und klingt im modernen Deutschen natürlicher als das substantivische „Träger“.
- source_word: כְּלֵי יְהוָה
  choice: die Geräte Jahwes
  rationale: כְּלֵי bezeichnet hier die zum Heiligtum gehörenden Geräte beziehungsweise Gefäße. „Geräte“ ist im Deutschen umfassend genug; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang der Reinheitsbegriffe
  choice: „Unrein“ und „reinigt euch“ werden als kultisch-ethische Sprache beibehalten, ohne sie ausschließlich zeremoniell oder ausschließlich moralisch auszulegen.
  alternative: Die Aussage entweder nur auf rituelle Reinigung der Tempeldiener oder nur auf moralische Trennung vom sündigen Umfeld beziehen.
  rationale: Das Tragen der Geräte Jahwes stellt einen kultischen Zusammenhang her, während der Aufruf zum Verlassen der Stadt zugleich ethische und gemeinschaftliche Tragweite besitzt. Der Wortlaut lässt diese Spannung bestehen.
- issue: Bezug des femininen Pronomens in מִתּוֹכָהּ
  choice: Das feminine „ihrer“ bleibt im Text erhalten.
  alternative: Mit „daraus“ übersetzen oder die gemeinte Stadt ausdrücklich als Babylon benennen.
  rationale: Der hebräische Vers nennt den Bezug hier nicht ausdrücklich. Die Übersetzung bewahrt daher Genus und Mehrdeutigkeit, statt die Stadt im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftigen Imperativen. Die Wiederholungen und die Unterscheidung zwischen סור und יצא bleiben erhalten. „Geräte Jahwes“ ist verständlich und lässt den kultischen Kontext erkennen, ohne die Gegenstände enger als „Gefäße“ festzulegen.
