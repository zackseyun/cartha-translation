base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: de
  text: Schüttle den Staub von dir ab; steh auf, setze dich, Jerusalem! Löse die Fesseln an deinem Hals, du gefangene Tochter Zion!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: Schüttle den Staub von dir ab
  rationale: Der reflexive Hitpael-Imperativ von נער bezeichnet hier das Abschütteln des Staubes. Die deutsche Formulierung bewahrt sowohl das konkrete Bild als auch die Bewegung weg von Erniedrigung und Trauer.
- source_word: קוּמִי
  choice: steh auf
  rationale: Der feminine Singularimperativ von קום wird in natürlichem, modernem Deutsch als unmittelbare Aufforderung wiedergegeben.
- source_word: שְּׁבִי
  choice: setz dich hin
  rationale: Das Verb bedeutet zunächst „sitzen“ beziehungsweise „sich setzen“. Die schlichte Wiedergabe vermeidet es, die im Zusammenhang mögliche Wiederherstellung von Würde ausdrücklich als Inthronisierung festzulegen.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens; Jerusalem wird im Vers als weiblich personifizierte Stadt angesprochen.
- source_word: התפתחו
  choice: Löse
  rationale: Die überlieferte Form in der vorgelegten Quelle ist schwierig beziehungsweise unregelmäßig. Die Wiedergabe folgt dem im Zusammenhang wahrscheinlichen Sinn einer Aufforderung, die Halsfesseln zu lösen, ohne eine bestimmte Textkorrektur in den Haupttext einzutragen.
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: die Fesseln von deinem Hals
  rationale: מוֹסְרֵי bezeichnet Bindungen oder Fesseln; die deutsche Präpositionalfügung macht die Trennung vom Hals idiomatisch deutlich, ohne das Material der Fesseln näher zu bestimmen.
- source_word: שְׁבִיָּה
  choice: gefangene
  rationale: Das feminine Wort kennzeichnet die personifizierte Zionstochter als Gefangene und bewahrt so das Bild von Verschleppung und Unfreiheit.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die feste prophetische Personifikation wird knapp und im Deutschen verständlich wiedergegeben; die alternative Genitivform bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bedeutungsumfang von שְּׁבִי im Wiederherstellungszusammenhang
  choice: setz dich hin
  alternative: nimm deinen Ehrenplatz ein / throne
  rationale: Der unmittelbare Wortsinn ist „setz dich“ beziehungsweise „sitze“. Der Zusammenhang kann einen wiedergewonnenen Ehrenplatz nahelegen, nennt aber keinen Thron ausdrücklich. Die Übersetzung bewahrt diese Spannung, indem sie den Grundsinn im Haupttext und die kontextuelle Möglichkeit in der Fußnote bietet.
- issue: Schwierige Form התנפתחו in der vorgelegten hebräischen Quelle
  choice: Löse
  alternative: Löse dich / Werde gelöst
  rationale: Der Kontext verlangt wahrscheinlich die Befreiung von den Halsfesseln, doch die Form ist in der vorgelegten Gestalt grammatisch auffällig. Der Haupttext gibt den wahrscheinlichen Sinn wieder; die Fußnote legt die Unsicherheit offen, statt Reflexivität oder Passivität dogmatisch festzulegen.
- issue: Personifikation בַּת צִיּוֹן
  choice: Tochter Zion
  alternative: Tochter von Zion
  rationale: Die Formulierung bezeichnet Zion beziehungsweise Jerusalem als weibliche Person und trägt keine eigenständige konfessionelle Aussage ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter imperativischer Bewegung. Das konkrete Bild von Staub, Aufstehen und Halsfesseln bleibt erhalten. „Setz dich hin“ ist bewusst formal näher am Hebräischen als die stärker deutende Wiedergabe „nimm deinen Ehrenplatz ein“.
