id: ISA.52.14
reference: Isaiah 52:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: de
  text: Wie sich viele über dich entsetzten – so entstellt war sein Aussehen, mehr als das eines Menschen, und seine Gestalt mehr als die der Menschen[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mehr als ein Mensch sein Aussehen und seine Gestalt mehr als Menschensöhne“. Gemeint ist: sein Aussehen war mehr entstellt als das eines Menschen und seine Gestalt mehr als die der Menschen. Der hebräische Text wechselt dabei von „dich“ zu „sein/seine“.'
    reason: Macht die verdichtete hebräische Vergleichsformulierung und den ungewöhnlichen Personenwechsel transparent.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Bewahrt die korrelative Vergleichsstruktur des Hebräischen; der Gedanke wird im folgenden Vers weitergeführt.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: sich ... über dich entsetzten
  rationale: Gibt die starke Bestürzung angesichts des Erscheinungsbildes natürlich wieder und bewahrt die Anrede in der zweiten Person.
- source_word: מִשְׁחַת
  choice: entstellt
  rationale: Vermittelt in modernem Deutsch die Zerstörung beziehungsweise Verunstaltung des sichtbaren Erscheinungsbildes klarer als das mögliche, aber weniger unmittelbare „verdorben“.
- source_word: מֵאִישׁ מַרְאֵהוּ
  choice: sein Aussehen, mehr als das irgendeines Menschen
  rationale: Das vergleichende מן bezeichnet hier ein Überschreiten des gewöhnlich Menschlichen; die Formulierung bleibt eng am Wortlaut, ohne den Sinn aufzulösen.
- source_word: וְתֹאֲרוֹ
  choice: und seine Gestalt
  rationale: Bewahrt die Unterscheidung zwischen sichtbarem Aussehen und körperlicher Gestalt.
- source_word: מִבְּנֵי אָדָם
  choice: mehr als die der Menschen
  rationale: Gibt die idiomatische Bedeutung „Menschen“ natürlich wieder; der Vergleich mit dem vorhergehenden Glied bleibt erkennbar.
theological_decisions:
- issue: Wechsel der grammatischen Person
  choice: Den Wechsel von „dich“ zu „sein/seine“ bewahren.
  alternative: Den gesamten Vers in die dritte Person setzen.
  rationale: Der masoretische Text wechselt ausdrücklich von der zweiten zur dritten Person. Diese Spannung wird nicht harmonisiert.
- issue: Grad und Gegenstand der Entstellung
  choice: Die außergewöhnliche Entstellung des Aussehens und der Gestalt vergleichend ausdrücken.
  alternative: Explizit formulieren, er habe nicht mehr menschlich ausgesehen.
  rationale: Eine solche Ausdeutung liegt nahe, geht aber über die knappe und syntaktisch gespannte hebräische Formulierung hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich und der abschließende Strich zeigen, dass der Vergleich in Vers 15 weitergeführt wird. Die Wiederholung „mehr als“ spiegelt die beiden hebräischen Vergleichsangaben, ohne die Aussage stärker auszudeuten.
