  variant: modern standard German
source:
  edition: WLC
  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: de
  text: Wach auf, wach auf! Kleide dich in deine Kraft, Zion! Zieh deine Prachtgewänder an, Jerusalem, du heilige Stadt! Denn nie wieder wird ein Unbeschnittener oder Unreiner[a] in dich hineinkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unbeschnittener“ und „Unreiner“ bewahren die hebräische Bundes- und Reinheitssprache. Gemeint sein können allgemein Menschen, die von der Heiligkeit Jerusalems ausgeschlossen sind; der Vers legt den genauen Bezug nicht fest.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: Wach auf, wach auf
  rationale: Der wiederholte Imperativ an die personifizierte Stadt drückt Dringlichkeit und poetischen Nachdruck aus. Die Wiederholung bleibt erhalten.
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: Kleide dich in deine Kraft
  rationale: Die Formulierung bewahrt das hebräische Bild, Kraft wie ein Kleid anzulegen, und gibt das Possessivsuffix ausdrücklich wieder.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Die im Deutschen etablierte Form des Ortsnamens wird beibehalten; Zion wird hier als weiblich angeredete Stadt personifiziert.
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: Zieh deine Prachtgewänder an
  rationale: תִפְאֶרֶת kann Schönheit, Schmuck, Herrlichkeit oder Pracht bezeichnen. „Prachtgewänder“ ist natürlich, würdevoll und bewahrt das Wiederherstellungs- und Kleidungsbild.
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: Jerusalem, du heilige Stadt
  rationale: Das eingefügte „du“ macht die appositionelle Anrede im Deutschen klar und natürlich; „heilige Stadt“ gibt den bestimmten hebräischen Ausdruck sinngemäß wieder.
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: Denn nie wieder wird … in dich hineinkommen
  rationale: יוֹסִיף zusammen mit עוֹד bezeichnet nachdrücklich das künftige Aufhören. „Nie wieder“ gibt diese Emphase idiomatisch wieder, ohne das Bild des Eintritts in die personifizierte Stadt aufzulösen.
- source_word: עָרֵל וְטָמֵא
  choice: ein Unbeschnittener oder Unreiner
  rationale: Die substantivierten Adjektive bewahren die Bundes- und Reinheitssprache. Im Deutschen verbindet „oder“ die beiden verneinten Kategorien natürlich, ohne zu behaupten, beide Merkmale müssten stets dieselbe Person kennzeichnen.
theological_decisions:
- issue: Bedeutung von „Unbeschnittener“ und „Unreiner“ im Blick auf Jerusalem
  choice: Die Bundes- und Reinheitsbegriffe bleiben ohne nähere Eingrenzung erhalten.
  alternative: Die Wendung ausdrücklich auf fremde Eroberer, kultisch unreine Personen oder einen endzeitlichen Zustand vollkommener Heiligkeit beziehen.
  rationale: Der Vers selbst entscheidet nicht eindeutig, ob die Bezeichnungen vor allem ethnisch, kultisch, moralisch oder eschatologisch zu verstehen sind. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Wiederholung und direkter Anrede. Die Satzzeichen verdeutlichen die drei aufeinanderfolgenden Aufforderungen. Das Kleidungsbild und die Personifizierung Jerusalems bleiben erhalten.
