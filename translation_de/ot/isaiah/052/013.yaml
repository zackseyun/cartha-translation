base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: de
  text: Siehe, mein Knecht wird weise handeln[a]. Er wird hoch sein, emporgehoben werden und sehr erhaben sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird Erfolg haben. Das hebräische Verb kann weises, einsichtiges Handeln und den daraus folgenden Erfolg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel eröffnet die Aussage mit feierlichem Nachdruck; „Siehe“ ist im Deutschen würdig und als prophetisches Signal gut verständlich.
- source_word: יַשְׂכִּיל
  choice: wird weise handeln
  rationale: Das Hifil von שׂכל bezeichnet einsichtiges, kluges Handeln und kann infolgedessen auch Erfolg oder Gelingen einschließen. Die Hauptübersetzung bewahrt den begrifflichen Kern; die Erfolgsnuance steht in der Fußnote.
- source_word: עַבְדִּי
  choice: mein Knecht
  rationale: עבד kann Knecht, Diener oder Sklave bezeichnen. In diesem jesajanischen Zusammenhang ist „mein Knecht“ die etablierte, würdige und sachlich angemessene Wiedergabe.
- source_word: יָרוּם
  choice: wird erhöht
  rationale: רום bezeichnet Höhe beziehungsweise Erhöhung. Die passive deutsche Form passt zur anschließenden Form נִשָּׂא und bewahrt das Bild der Erhebung.
- source_word: וְנִשָּׂא
  choice: und emporgehoben werden
  rationale: נשׂא trägt hier den Sinn des Hochgehoben- oder Erhabenseins. „Emporgehoben“ erhält das konkrete Höhenbild und unterscheidet sich zugleich vom vorangehenden „erhöht“.
- source_word: וְגָבַהּ מְאֹד
  choice: und sehr hoch sein
  rationale: גבהּ mit מְאֹד bildet den verstärkten Höhepunkt der dreigliedrigen Aussage. „Sehr hoch sein“ gibt die hebräische Bildsprache direkter wieder als eine dritte abstrakte Form von „erhöhen“.
theological_decisions:
- issue: Mögliche messianische Deutung des Knechtes
  choice: Die Übersetzung bleibt bei „mein Knecht“ und nimmt keine ausdrückliche Identifikation vor.
  alternative: Den Knecht bereits im Übersetzungstext ausdrücklich als Messias beziehungsweise Christus bezeichnen.
  rationale: Der hebräische Vers selbst sagt עַבְדִּי, „mein Knecht“. Eine messianische oder christologische Identifikation gehört zur Auslegung und darf nicht ohne sprachliche Grundlage in den Wortlaut eingetragen werden.
- issue: Mehrdeutigkeit von יַשְׂכִּיל zwischen einsichtigem Handeln und Erfolg
  choice: „wird weise handeln“ im Haupttext; „wird Erfolg haben / wird Gelingen haben“ als Fußnotenalternative.
  alternative: Nur „wird Erfolg haben“ im Haupttext und damit die Art seines Handelns unausgedrückt lassen.
  rationale: Die Form kann sowohl kluges Handeln als auch das daraus folgende Gelingen bezeichnen. Haupttext und Fußnote erhalten diese echte lexikalische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Feierlichkeit. „Siehe“ und „Knecht“ erhalten den biblischen Ton, ohne die Syntax unnötig zu archaisieren. Die dreifache Höhenaussage bleibt als bewusst gesteigerte Folge erkennbar.
