    issue: Die drei Höhenaussagen sind im Haupttext morphologisch und syntaktisch zu stark vereinheitlicht.
    rationale: יַרוּם bezeichnet zunächst, dass der Knecht hoch sein bzw. sich erheben wird; וְנִשָּׂא ist die anschließende Erhobenheits-/Emporhebungsaussage. Die doppelte Passivformulierung des Entwurfs verwischt diese Gestaltung und führt zu einer unnatürlichen deutschen Satzkette.
  - severity: low
