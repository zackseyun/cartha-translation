source:
  edition: WLC
  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: de
  text: 'Wie schön sind auf den Bergen die Füße dessen, der gute Nachricht bringt, der Frieden verkündet, der Gutes als gute Nachricht bringt, der Rettung verkündet, der zu Zion sagt: »Dein Gott herrscht als König.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Gott ist König« oder »Dein Gott ist König geworden.« Das Hebräische kann die Thronbesteigung oder die gegenwärtige königliche Herrschaft hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: Wie schön sind
  rationale: מַה leitet hier einen bewundernden Ausruf ein; die Wendung gibt diesen im modernen Deutschen natürlich wieder.
- source_word: עַל הֶהָרִים
  choice: auf den Bergen
  rationale: Bewahrt das konkrete geografische Bild des über das Bergland kommenden Boten.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: die Füße dessen, der gute Nachricht bringt
  rationale: Die wörtliche Wiedergabe von רַגְלֵי erhält das poetische Bild; das Partizip מְבַשֵּׂר bleibt verbal und wird nicht unnötig zu einer Amtsbezeichnung verengt.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: der Frieden verkündet
  rationale: Das Hifil-Partizip von שמע bezeichnet das Hörbar- beziehungsweise Bekanntmachen; „verkündet“ passt zum öffentlichen Ruf des Boten.
- source_word: מְבַשֵּׂר טוֹב
  choice: der Gutes als gute Nachricht bringt
  rationale: Bewahrt die Wiederholung des Stammes בשׂר und lässt טוֹב in seiner umfassenden Bedeutung stehen, ohne es auf Wohlstand zu verengen.
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: der Rettung verkündet
  rationale: „Rettung“ deckt den konkreten Befreiungssinn von יְשׁוּעָה ab und wahrt zugleich dessen theologisches Gewicht.
- source_word: אֹמֵר לְצִיּוֹן
  choice: der zu Zion sagt
  rationale: Eine schlichte, unmittelbare Einleitung der direkten Rede; „Zion“ bleibt als herkömmliche Namensform erhalten.
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: Dein Gott herrscht als König
  rationale: Die Formulierung bringt die königliche Herrschaft ausdrücklich zum Ausdruck, ohne die Qatal-Form ausschließlich als punktuelle Thronbesteigung festzulegen.
theological_decisions:
- issue: Deutung der Königsproklamation מָלַךְ אֱלֹהָיִךְ
  choice: Dein Gott herrscht als König
  alternative: Dein Gott ist König / Dein Gott hat die Königsherrschaft angetreten
  rationale: Das hebräische Qatal kann im Proklamationszusammenhang sowohl die ausgeübte Königsherrschaft als auch deren Antritt hervorheben. Der Haupttext wahrt die königliche Dynamik; die Fußnote nennt die echten Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener poetischer Wiederholung. „Gute Nachricht“ wird statt des stärker kirchlich geprägten „frohe Botschaft“ verwendet; „herrscht als König“ macht das königliche Element des Verbs מלך hörbar.
