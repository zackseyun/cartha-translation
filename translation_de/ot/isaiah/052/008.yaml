  source_fidelity: 'Die Wiedergabe trifft die hebräische Bildsprache, die Wächter als pluralisches Subjekt, ihren Jubel sowie die Lesart, dass Jahwe nach Zion zurückkehrt, insgesamt gut. Das einleitende Nominalgefüge ist als poetische Hervorhebung vertretbar. Allerdings gibt „wie Jahwe nach Zion zurückkehrt“ den temporalen Anschluss בְּשׁוּב nicht angemessen wieder: Es lässt die Wächter eher die Art und Weise von Jahwes Rückkehr sehen. Erforderlich ist „wenn Jahwe nach Zion zurückkehrt“.'
