  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: de
  text: Die Stimme deiner Wächter! Sie erheben ihre Stimme und jubeln gemeinsam; denn Auge in Auge[a] werden sie sehen, wenn Jahwe nach Zion zurückkehrt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „Auge in Auge“; gemeint ist wahrscheinlich: unmittelbar oder mit eigenen Augen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn Jahwe Zion wiederherstellt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל צֹפַיִךְ
  choice: Die Stimme deiner Wächter!
  rationale: Die nominale, ausrufartige Eröffnung bewahrt die Hervorhebung des hebräischen קוֹל, ohne einen nicht ausdrücklich vorhandenen Imperativ wie „Hört!“ einzufügen. Das feminine Suffix in צֹפַיִךְ bezieht sich auf Zion und wird mit „deiner“ wiedergegeben.
- source_word: נָשְׂאוּ קוֹל
  choice: Sie erheben ihre Stimme
  rationale: Die feste Wendung bedeutet, die Stimme zu erheben. „Ihre Stimme“ ist im Deutschen bei einem kollektiven Subjekt natürlich und greift die Wiederholung von קוֹל auf.
- source_word: יַחְדָּו יְרַנֵּנוּ
  choice: und jubeln gemeinsam
  rationale: רנן im Piel bezeichnet lauten, freudigen Jubel, der auch gesungen oder gerufen sein kann. „Jubeln“ erhält diese Bedeutungsbreite, während „gemeinsam“ die Einmütigkeit ausdrückt.
- source_word: עַיִן בְּעַיִן
  choice: Auge in Auge
  rationale: Die bildhafte Formulierung des Hebräischen wird bewusst bewahrt. Im Zusammenhang bezeichnet sie wahrscheinlich unmittelbares Sehen, nicht Übereinstimmung im Sinne der deutschen Redewendung „einer Meinung sein“.
- source_word: יִרְאוּ
  choice: werden sie sehen
  rationale: Das Imperfekt weist im gegebenen prophetischen Zusammenhang auf das bevorstehende Wahrnehmen von Jahwes Handeln.
- source_word: בְּשׁוּב יְהוָה צִיּוֹן
  choice: wie Jahwe nach Zion zurückkehrt
  rationale: ב mit dem Infinitiv constructus wird hier als zeitlich bzw. begleitend verstanden; Jahwe ist am naheliegendsten das Subjekt von שוב, Zion das Ziel der Rückkehr.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der überlieferte Ortsname wird in seiner etablierten deutschen Form beibehalten.
theological_decisions:
- issue: Bedeutung von עַיִן בְּעַיִן
  choice: Auge in Auge
  alternative: mit eigenen Augen; unmittelbar
  rationale: Die Hauptfassung erhält das auffällige hebräische Bild und lässt dessen genaue Nuance offen. Eine Fußnote erklärt den im Kontext wahrscheinlichen Sinn des unmittelbaren persönlichen Sehens.
- issue: Subjekt und Bedeutung von בְּשׁוּב יְהוָה צִיּוֹן
  choice: wie Jahwe nach Zion zurückkehrt
  alternative: wenn Jahwe Zion wiederherstellt
  rationale: Die Syntax legt zunächst nahe, Jahwe als Subjekt des Zurückkehrens und Zion als Ziel zu verstehen. Die mögliche kausative bzw. restaurative Deutung wird nicht in den Haupttext eingetragen, sondern als echte Auslegungsalternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ausrufartige Eröffnung und die Wiederholung von „Stimme“ bewahren den poetischen Nachdruck des Hebräischen; „jubeln“ vermeidet eine unnötige Festlegung auf Singen oder Rufen.
