source:
  edition: WLC
  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: de
  text: Brecht in Jubel aus und singt gemeinsam, ihr Trümmer Jerusalems! Denn Jahwe hat sein Volk getröstet, er hat Jerusalem erlöst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּצְחוּ
  choice: Brecht in Jubel aus
  rationale: Der pluralische Imperativ bezeichnet das plötzliche, kraftvolle Ausbrechen in einen freudigen Laut oder Gesang. Die deutsche Wendung bewahrt sowohl das lebendige Bild als auch den Anschluss an רַנְּנוּ.
- source_word: רַנְּנוּ
  choice: jubelt
  rationale: Das Verb bezeichnet einen lauten, freudigen Ruf, häufig auch jubelnden Gesang. „Jubelt“ gibt die freudige Klangfarbe deutlicher wieder als das allgemeinere „singt“.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb hebt hervor, dass die angesprochenen Trümmer gleichsam zusammen und wie mit einer Stimme jubeln.
- source_word: חָרְבוֹת
  choice: Trümmer
  rationale: Das Substantiv bezeichnet verwüstete oder zerstörte Orte. „Trümmer Jerusalems“ ist knapp, anschaulich und erhält die poetische Personifikation.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet den Grund für den vorausgehenden Aufruf zum Jubel ein.
- source_word: נִחַם
  choice: hat … getröstet
  rationale: In diesem Zusammenhang bezeichnet das Verb Trost und die daraus folgende Wende aus Not und Verwüstung. Das Perfekt wird als vollendetes Handeln wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Die Nominalform mit Suffix wird direkt und natürlich wiedergegeben.
- source_word: גָּאַל
  choice: hat … erlöst
  rationale: Das Verb bezeichnet das befreiende Wiedergewinnen beziehungsweise Erlösen und trägt im prophetischen Kontext Bundes- und Wiederherstellungsanklänge. „Erlöst“ bewahrt dieses Gewicht, ohne den Vorgang enger zu bestimmen.
- source_word: יְרוּשָׁלָם
  choice: Jerusalem
  rationale: Der Ortsname wird in seiner im Deutschen üblichen Form wiedergegeben und am Versende entsprechend dem Hebräischen ausdrücklich wiederholt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ erhält ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von גָּאַל
  choice: er hat Jerusalem erlöst
  alternative: er hat Jerusalem zurückgewonnen
  rationale: „Erlöst“ erhält die im hebräischen Verb liegenden Vorstellungen von Befreiung, Wiedergewinnung und Wiederherstellung, ohne einen im Vers nicht genannten Preis oder Mechanismus einzuführen.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. Die Anrede der Trümmer wird als bewusste Personifikation bewahrt; die beiden hebräischen Imperative bleiben erkennbar. Das Perfekt der beiden Heilsverben wird parallel mit „hat … getröstet“ und „hat … erlöst“ wiedergegeben.
