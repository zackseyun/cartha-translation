  text: הֶחֱשֵׁ֨יתִי֙ מֵֽ/עוֹלָ֔ם אַחֲרִ֖ישׁ אֶתְאַפָּ֑ק כַּ/יּוֹלֵדָ֣ה אֶפְעֶ֔ה אֶשֹּׁ֥ם וְ/אֶשְׁאַ֖ף יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: de
  text: Seit langem habe ich geschwiegen, bin still geblieben und habe mich zurückgehalten. Wie eine Gebärende werde ich aufschreien; zugleich werde ich keuchen und nach Luft schnappen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satzteil kann auch wiedergegeben werden: „Ich werde auf einmal keuchen und nach Luft schnappen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: habe ich geschwiegen
  rationale: Das Hifil von חרשׁ bezeichnet hier das bewusste Stillschweigen. Das deutsche Perfekt nimmt den Rückblick auf die bisherige Zurückhaltung natürlich auf.
- source_word: מֵעוֹלָם
  choice: Seit Langem
  rationale: Im Zusammenhang bezeichnet der Ausdruck eine lange zurückliegende und bis zur Gegenwart reichende Zeitspanne, nicht absolute Ewigkeit. „Seit Langem“ ist im modernen Deutsch natürlich; die mögliche Nuance „von alters her“ bleibt in der Fußnote erhalten.
- source_word: אַחֲרִישׁ
  choice: war still
  rationale: Das Verb gehört zum Bedeutungsfeld des Schweigens und Stillseins. „war still“ bewahrt den Parallelismus, ohne „schweigen“ unnötig zu wiederholen.
- source_word: אֶתְאַפָּק
  choice: hielt mich zurück
  rationale: Das Hitpael von אפק drückt Selbstbeherrschung beziehungsweise bewusstes Ansichhalten aus. Die reflexive deutsche Wendung gibt dies klar und idiomatisch wieder.
- source_word: כַּיּוֹלֵדָה
  choice: Wie eine Gebärende
  rationale: Die Form bezeichnet eine Frau bei der Geburt. „Gebärende“ erhält das ausdrückliche und eindringliche Vergleichsbild knapp und würdevoll.
- source_word: אֶפְעֶה
  choice: schreie ich auf
  rationale: פעה bezeichnet das Hervorstoßen eines lauten Klangs oder Schreis. „aufschreien“ passt zum Bild einer Gebärenden und leitet die folgenden Atemlaute ein.
- source_word: אֶשֹּׁם
  choice: ich keuche
  rationale: Im unmittelbaren Geburts- und Atemkontext ist ein heftiger Atemlaut gemeint. „keuchen“ bildet zusammen mit der folgenden Wendung eine natürliche Steigerung.
- source_word: וְאֶשְׁאַף
  choice: und schnappe … nach Luft
  rationale: שׁאף kann heftiges Einatmen, Keuchen oder Luftschnappen bezeichnen. „nach Luft schnappen“ macht das Atembild im modernen Deutsch anschaulich und unterscheidet es vom vorhergehenden Verb.
- source_word: יָחַד
  choice: zugleich
  rationale: Das Adverb kennzeichnet die beiden Handlungen als gleichzeitig. Je nach Nuance kann es auch „auf einmal“ heißen; diese Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Göttliche Selbstbeschreibung durch das Bild einer Gebärenden
  choice: Der ausdrückliche Vergleich „Wie eine Gebärende“ bleibt unverändert erhalten.
  alternative: Das Bild zu einem allgemeinen Ausdruck heftigen Aufschreiens abschwächen oder nur deutend umschreiben.
  rationale: Der hebräische Text vergleicht die plötzlich hervorbrechende Äußerung des göttlichen Sprechers ausdrücklich mit einer Frau bei der Geburt. Das Bild vermittelt angestaute Intensität und unmittelbar bevorstehendes Handeln; es soll weder abgeschwächt noch über die Aussage des Vergleichs hinaus dogmatisch aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die kurzen, parallelen Verbfolgen bewahren den Spannungsaufbau vom langen Schweigen zum plötzlichen, körperlich eindringlichen Aufschrei.
