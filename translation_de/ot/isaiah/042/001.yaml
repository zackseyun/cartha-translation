source:
  edition: WLC
  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: de
  text: Siehe, mein Knecht, den ich stütze, mein Erwählter, an dem meine Seele Gefallen hat.[a] Ich habe meinen Geist auf ihn gelegt.[b] Er wird den Völkern das Recht bringen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem ich Wohlgefallen habe“.'
    reason: lexical_alternative
  - marker: b
    text: Im Neuen Testament wird dieser Vers auf Jesus, den Messias, bezogen; siehe Matthäus 12,18.
    reason: cross_reference
  - marker: c
    text: „Recht“ kann hier auch „gerechtes Urteil“, „Gerechtigkeit“ oder „gerechte Ordnung“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die hinweisende Aufmerksamkeitspartikel eröffnet die Vorstellung des Knechtes. „Siehe“ bewahrt den gehobenen prophetischen Ton, ohne unverständlich zu sein.
- source_word: עַבְדִּי
  choice: mein Knecht
  rationale: „Knecht“ ist im Deutschen die etablierte und kontextuell passende Rollenbezeichnung. „Sklave“ würde den rechtlichen Status stärker hervorheben, als es dieser königlich-prophetische Zusammenhang nahelegt.
- source_word: אֶתְמָךְ בּוֹ
  choice: den ich stütze
  rationale: תמך mit ב bezeichnet das Stützen oder Aufrechterhalten. Der Relativsatz gibt die hebräische Beziehung natürlich und präzise wieder.
- source_word: בְּחִירִי
  choice: mein Erwählter
  rationale: Das substantivierte Adjektiv bezeichnet den von Gott besonders Ausgewählten. „Mein Erwählter“ ist knapp, persönlich und würdevoll.
- source_word: רָצְתָה נַפְשִׁי
  choice: an dem meine Seele Gefallen hat
  rationale: Die Formulierung erhält das ausdrücklich genannte „meine Seele“ und damit die bildhafte Intensität des göttlichen Wohlgefallens. Das Perfekt „hat Gefallen“ entspricht dem hebräischen qatal, ohne die fortdauernde Haltung auszuschließen.
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: Ich habe meinen Geist auf ihn gelegt
  rationale: נתן mit רוח und על wird im Deutschen natürlich mit „den Geist auf jemanden legen“ wiedergegeben. „Geist“ wird großgeschrieben, weil Gott spricht und von seinem eigenen, bevollmächtigenden Geist die Rede ist.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט kann richterliche Entscheidung, Gerechtigkeit oder eine gerechte Ordnung bezeichnen. „Das Recht“ bewahrt im Deutschen diese Breite besser als das enger klingende „Gericht“.
- source_word: לַגּוֹיִם
  choice: den Völkern
  rationale: גּוֹיִם bezeichnet hier die Völker bzw. Nationen. „Den Völkern“ ist im Deutschen idiomatisch und vermeidet die durch spätere Verwendung mögliche Verengung von „Heiden“.
- source_word: יוֹצִיא
  choice: wird … bringen
  rationale: Der Hifil von יצא bedeutet wörtlich „herausbringen“ oder „hervorbringen“. In Verbindung mit לַגּוֹיִם gibt „den Völkern … bringen“ die öffentliche Vermittlung bzw. Verwirklichung des Rechts natürlich wieder.
theological_decisions:
- issue: Identität und Rolle des Knechtes
  choice: Die Übersetzung bleibt mit „mein Knecht“ bei der nicht näher bestimmten Bezeichnung des hebräischen Textes.
  alternative: Der Knecht kann korporativ auf Israel, auf eine prophetische Einzelgestalt oder messianisch auf Jesus bezogen werden.
  rationale: Der Vers selbst nennt die Gestalt lediglich Gottes Knecht. Eine ausdrückliche Identifikation im Haupttext würde eine Auslegung in die Übersetzung eintragen; die neutestamentliche Anwendung wird deshalb in einer Fußnote angegeben.
- issue: רוּחִי als Gottes Geist
  choice: „meinen Geist“ mit großgeschriebenem „Geist“
  alternative: „meinen Geist“ im Sinn von Atem, Lebenskraft oder innerer Haltung
  rationale: Da Gott der Sprecher ist und seinen Geist zur Bevollmächtigung auf den Knecht legt, weist der Kontext auf Gottes wirksamen Geist. Die Großschreibung signalisiert den Referenten, ohne dem hebräischen Wortlaut zusätzliche Aussagen hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst prophetischem Ton. „Siehe“ und „Knecht“ sind leicht gehoben, aber bibelsprachlich geläufig. Die Satzstruktur bleibt nah am hebräischen Parallelismus, während „den Völkern das Recht bringen“ idiomatisches Deutsch bietet.
