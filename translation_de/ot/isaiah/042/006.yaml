  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: de
  text: Ich bin Jahwe. Ich habe dich in Gerechtigkeit[a] gerufen; ich werde dich bei der Hand fassen, dich behüten[b] und dich zum Bund für das Volk[c], zum Licht für die Nationen[d] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Recht« beziehungsweise »in gerechter Weise«. Das hebräische Wort kann Gerechtigkeit und Recht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dich bewahren« beziehungsweise »über dich wachen«.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht kein bestimmter Artikel. »Das Volk« ergibt sich hier aus dem Zusammenhang und dem Gegensatz zu »den Nationen«; wahrscheinlich ist Israel gemeint.
    reason: textual_ambiguity
  - marker: d
    text: 'Oder: »für die Völker«. Das hebräische Wort kann je nach Zusammenhang auch die nichtisraelitischen Völker bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: קְרָאתִיךָ
  choice: Ich habe dich … gerufen
  rationale: Das hebräische Perfekt bezeichnet den bereits vollzogenen Ruf; das deutsche Perfekt gibt dessen fortdauernde Bedeutung im Sendungszusammenhang natürlich wieder.
- source_word: בְצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die substantivische Form bleibt erhalten und umfasst sowohl moralische Gerechtigkeit als auch gerechtes Handeln; »nach Recht« ist ebenfalls möglich.
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: ich werde dich bei der Hand fassen
  rationale: Die konkrete Hand-Metapher und der Sinn von ergreifendem, stützendem Festhalten werden bewahrt.
- source_word: וְאֶצָּרְךָ
  choice: dich behüten
  rationale: Das Verb נצר bezeichnet schützendes Bewahren oder Hüten. »Behüten« ist im Deutschen klar, würdig und lexikalisch nah.
- source_word: וְאֶתֶּנְךָ
  choice: dich … geben
  rationale: Die Grundbedeutung von נתן, »geben«, wird trotz der ungewöhnlichen Aussage beibehalten, statt sie deutend zu »einsetzen« oder »machen« abzuschwächen.
- source_word: לִבְרִית עָם
  choice: zum Bund für das Volk
  rationale: Die angesprochene Gestalt selbst wird als Bund gegeben. »Das Volk« wahrt den wahrscheinlichen Bezug auf Israel, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: לְאוֹר גּוֹיִם
  choice: zum Licht für die Nationen
  rationale: »Nationen« gibt גּוֹיִם breit und ohne eine unnötig technische religiöse Färbung wieder; die Parallelität zu »Bund für das Volk« bleibt erhalten.
theological_decisions:
- issue: Die angesprochene Gestalt als Bund
  choice: »dich zum Bund für das Volk … geben«
  alternative: »dich zum Mittler eines Bundes für das Volk einsetzen«
  rationale: Der hebräische Text bezeichnet die Gestalt unmittelbar als Bund. Die Übersetzung bewahrt diese theologische Verdichtung, statt sie auf eine bestimmte Mittlerfunktion festzulegen.
- issue: Verhältnis von Volk und Nationen
  choice: »das Volk … die Nationen«
  alternative: »ein Volk … die Heiden«
  rationale: Die Formulierung erhält den wahrscheinlichen Kontrast zwischen Israel und den übrigen Nationen, ohne den nicht ausdrücklich genannten Namen Israel einzufügen oder גּוֹיִם konfessionell aufzuladen.
- issue: Zeitbezug der auf den Ruf folgenden Verben
  choice: 'deutsches Futur: »ich werde …«'
  alternative: 'deutsches Präsens: »ich fasse …, behüte … und gebe …«'
  rationale: Die hebräischen Imperfektformen können im Zusammenhang die zugesagte weitere Handlung Jahwes ausdrücken. Das Futur macht diesen Zusagecharakter im Deutschen deutlich, ohne die Handlungen als bereits abgeschlossen darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Das ungewöhnliche »dich zum Bund … geben« bleibt bewusst stehen, damit die theologische Spannung des Ausgangstextes nicht erklärend aufgelöst wird.
