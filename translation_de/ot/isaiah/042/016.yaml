source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: de
  text: Und ich werde die Blinden auf einem Weg führen, den sie nicht kennen; auf Pfaden, die sie nicht kennen, werde ich sie leiten. Die Finsternis vor ihnen werde ich zu Licht machen und das Krumme zu ebenem Boden. Diese Dinge habe ich getan, und ich habe sie nicht verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese Dinge werde ich tun, und ich werde sie nicht verlassen.“ Das Hebräische verwendet hier Perfektformen; sie können vollendetes Handeln oder die prophetische Gewissheit dessen ausdrücken, was Gott zu tun verspricht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: Und ich werde … führen
  rationale: Der Hifil von הלך ist kausativ; „führen“ gibt die gemeinte göttliche Wegleitung im Deutschen natürlich wieder.
- source_word: עִוְרִים
  choice: die Blinden
  rationale: Das substantivierte maskuline Pluraladjektiv wird knapp und bildtreu wiedergegeben.
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: auf einem Weg, den sie nicht kennen
  rationale: „Auf einem Weg“ ist im Deutschen für die Bewegung entlang einer unbekannten Route idiomatisch; „nicht kennen“ bewahrt die Aussage fehlender Vertrautheit.
- source_word: בִּנְתִיבוֹת לֹא יָדְעוּ אַדְרִיכֵם
  choice: auf Pfaden, die ihnen unbekannt sind, werde ich sie leiten
  rationale: „Pfade“ erhält den poetischen Parallelismus zu „Weg“; die variierte Formulierung vermeidet schwerfällige Wiederholung, ohne den Sinn zu verändern.
- source_word: מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: die Finsternis vor ihnen … zu Licht
  rationale: Die räumliche Metapher und die Verwandlung von Dunkelheit in Licht bleiben unmittelbar erhalten.
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: das unebene Gelände zu ebenem Grund
  rationale: מַעֲקַשִּׁים bezeichnet im Wegkontext krumme beziehungsweise schwierige Stellen; מִישׁוֹר bezeichnet ebenes, passierbares Gelände. Die deutsche Fassung wahrt das Reisebild.
- source_word: עֲשִׂיתִם וְלֹא עֲזַבְתִּים
  choice: die ich getan habe, und ich habe sie nicht verlassen
  rationale: Die Perfektformen werden formal als vollendete Handlungen wiedergegeben und bewahren so den auffälligen Aspektwechsel gegenüber den vorherigen Zukunftsformen.
theological_decisions:
- issue: Zeitbezug der abschließenden hebräischen Perfektformen
  choice: 'Deutsches Perfekt: „die ich getan habe, und ich habe sie nicht verlassen“'
  alternative: 'Futur: „die ich tun werde, und ich werde sie nicht verlassen“'
  rationale: Der Vers beginnt mit zukunftsbezogenen Formen, wechselt am Ende jedoch ins Perfekt. Die Hauptfassung erhält diese Spannung und kann die zugesagte Handlung als prophetisch gewiss darstellen, ohne den möglichen Zukunftsbezug auszuschließen.
- issue: Bildgehalt von Blindheit und Wegführung
  choice: Die konkrete Bildsprache ohne erklärende Deutung beibehalten
  alternative: Die Blinden ausdrücklich als geistlich Unwissende deuten
  rationale: Der hebräische Text lässt offen, ob die Blindheit wörtlich, metaphorisch oder auf beiden Ebenen zu verstehen ist; die Übersetzung soll diese Offenheit nicht konfessionell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus von Weg/Pfaden und Finsternis/Licht bleibt erhalten. „Unebenes Gelände“ ist verständlicher als das abstrakte „Krummes“, ohne die Wegmetapher aufzugeben. Der Fußnotenmarker steht bei der gesamten abschließenden Aussage, auf die sich die Alternative bezieht.
