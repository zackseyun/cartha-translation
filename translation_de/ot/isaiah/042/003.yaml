source:
  edition: WLC
  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: de
  text: Ein geknicktes Rohr wird er nicht zerbrechen, und einen nur noch glimmenden Docht[a] wird er nicht auslöschen. In Treue[b] wird er das Recht hervorbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schwacher Flachs“. Gemeint ist wahrscheinlich ein schwach brennender Lampendocht aus Flachs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „In Wahrheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה
  choice: Rohr
  rationale: Das Substantiv bezeichnet gewöhnlich ein Schilfrohr oder Rohr. „Rohr“ bewahrt das konkrete Pflanzenbild und ist in diesem poetischen Zusammenhang natürlich.
- source_word: רָצוּץ
  choice: geknickt
  rationale: Das passive Partizip bezeichnet etwas Zerschlagenes oder Beschädigtes. „Geknickt“ stellt bei einem Rohr anschaulich einen schwer beschädigten, aber noch nicht völlig zerbrochenen Zustand dar.
- source_word: יִשְׁבּוֹר
  choice: wird er nicht zerbrechen
  rationale: Das Imperfekt beschreibt hier das kennzeichnende künftige beziehungsweise fortdauernde Handeln des Knechtes. „Wird … nicht zerbrechen“ passt zur prophetischen Darstellung.
- source_word: פִשְׁתָּה
  choice: Docht
  rationale: Wörtlich ist Flachs gemeint; zusammen mit dem Mattwerden und Auslöschen bezeichnet das Wort wahrscheinlich einen aus Flachs gefertigten Lampendocht. „Docht“ vermittelt das gemeinte Bild im Deutschen klar.
- source_word: כֵהָה
  choice: nur noch glimmend
  rationale: Das Adjektiv bezeichnet etwas Mattes oder Schwachgewordenes. Bei einem Docht drückt „nur noch glimmend“ aus, dass sein Licht beinahe erloschen ist, ohne den Zustand als bereits beendet darzustellen.
- source_word: יְכַבֶּנָּה
  choice: wird er nicht auslöschen
  rationale: Das Verb bedeutet „löschen“ oder „zum Erlöschen bringen“. „Auslöschen“ bewahrt das Bild einer Lampe und ist in modernem Deutsch verständlich.
- source_word: לֶאֱמֶת
  choice: in Treue
  rationale: Die Wendung kann „in Wahrheit“ oder „in Treue/zuverlässig“ bedeuten. „In Treue“ gibt hier die verlässliche Weise wieder, in der der Knecht das Recht hervorbringt, ohne die begriffliche Nähe zu אֱמֶת ganz aufzugeben.
- source_word: יוֹצִיא
  choice: wird er hervorbringen
  rationale: Der Hifil von יצא bedeutet hier „herausbringen“ beziehungsweise „hervorbringen“. Die gewählte Formulierung ist quellennah und entspricht dem würdigen prophetischen Stil.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט kann Gericht, Rechtsentscheid oder gerechte Ordnung bezeichnen. „Das Recht“ lässt im Deutschen sowohl den rechtlichen als auch den auf Gerechtigkeit zielenden Sinn anklingen.
theological_decisions:
- issue: Bildhafte Darstellung des Umgangs des Knechtes mit Schwachen
  choice: Die konkreten Bilder vom geknickten Rohr und vom nur noch glimmenden Docht bleiben erhalten.
  alternative: Die Bilder ausdrücklich auf schwache oder scheiternde Menschen beziehen.
  rationale: Der hebräische Text deutet die Metaphern nicht ausdrücklich aus. Ihre Beibehaltung erhält die poetische Kraft und vermeidet, eine bestimmte Anwendung in den Haupttext einzutragen.
- issue: Bedeutung von לֶאֱמֶת
  choice: in Treue
  alternative: in Wahrheit
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bezeichnen. Im Kontext ist die zuverlässige Ausführung des Rechts gut verständlich; die ebenfalls mögliche wörtlichere Wiedergabe „in Wahrheit“ wird in einer Fußnote bewahrt.
- issue: Bedeutungsumfang von מִשְׁפָּט
  choice: das Recht
  alternative: Gerechtigkeit oder Gericht
  rationale: Die Formulierung bewahrt die Spannung zwischen rechtmäßiger Ordnung, gerechtem Handeln und richterlichem Urteil, ohne den Ausdruck auf nur einen theologischen Aspekt zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Klang. Die parallele Bildsprache und die Zukunftsformen des Hebräischen bleiben erhalten; „nur noch“ verdeutlicht idiomatisch den schwachen Zustand des Dochtes.
