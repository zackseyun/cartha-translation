  text: ראית רַבּ֖וֹת וְ/לֹ֣א תִשְׁמֹ֑ר פָּק֥וֹחַ אָזְנַ֖יִם וְ/לֹ֥א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: de
  text: Du hast vieles gesehen[a], aber du achtest nicht darauf; seine Ohren sind offen, aber er hört nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt der Vers in seiner zweiten Hälfte von „du“ zu „er“. Bei „Ohren“ steht kein Possessivpronomen; das Deutsche ergänzt „seine“, um den durch das Verb erkennbaren Wechsel zur dritten Person wiederzugeben. Manche Übersetzungen gleichen dies zu „deine/du“ an.
    reason: alternative_reading
lexical_decisions:
- source_word: ראית
  choice: Du hast gesehen
  rationale: Das Qal Perfekt 2. Person maskulin Singular wird mit dem deutschen Perfekt wiedergegeben; die singularische Anrede des Knechtes beziehungsweise Volkes bleibt erhalten.
- source_word: רַבּוֹת
  choice: vieles
  rationale: Das substantivisch gebrauchte feminine Pluraladjektiv bezeichnet viele Dinge; „vieles“ ist im Deutschen natürlich und knapp.
- source_word: וְלֹא תִשְׁמֹר
  choice: aber du achtest nicht darauf
  rationale: שׁמר kann „bewahren, hüten, beachten“ bedeuten. Im Zusammenhang mit Sehen und fehlender Reaktion gibt „darauf achten“ den Sinn natürlich wieder, ohne das Verb mit „beobachten“ auf rein visuelle Wahrnehmung zu verengen.
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: seine Ohren sind offen
  rationale: Der resultative Ausdruck beschreibt offene Ohren. Das Possessivpronomen macht im Deutschen den durch יִשְׁמָע angezeigten Wechsel zur dritten Person verständlich.
- source_word: וְלֹא יִשְׁמָע
  choice: aber er hört nicht
  rationale: Das Qal Imperfekt 3. Person maskulin Singular wird hier als gegenwärtige Feststellung verstanden. „hört“ bewahrt den sinnlichen Bezug zu den Ohren und vermeidet die stärkere Deutung „hört nicht zu“.
theological_decisions:
- issue: Wechsel der grammatischen Person innerhalb des Verses
  choice: Der Wechsel von der zweiten Person („du“) zur dritten Person („seine/er“) bleibt erhalten.
  alternative: 'Den gesamten Vers an die zweite Person angleichen: „deine Ohren sind offen, aber du hörst nicht“.'
  rationale: Der masoretische Text weist tatsächlich diesen rhetorischen Personenwechsel auf. Eine Angleichung würde eine Spannung beseitigen, die im Ausgangstext vorhanden ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und bewahrt zugleich den auffälligen Personenwechsel des hebräischen Textes.
