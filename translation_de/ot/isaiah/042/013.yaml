- from: Jahwe zieht aus wie ein Held, wie ein Kriegsmann entfacht er seinen Eifer.[a] Er erhebt einen Schrei, ja, er lässt den Schlachtruf erschallen; über seine Feinde erweist er sich als mächtig.[b]
  to: Jahwe zieht aus wie ein Held, wie ein Kriegsmann entfacht er Eifer.[a] Er stößt einen Schrei aus, ja, er schreit laut auf; gegen seine Feinde setzt er sich durch.[b]
  rationale: Die Überarbeitung gibt die beiden aufeinanderfolgenden Rufverben direkt wieder und übersetzt die Schlusswendung mit einem im Deutschen natürlichen Ausdruck für das Sich-Durchsetzen über bzw. gegen Feinde. Die Alternative zu קִנְאָה bleibt offen, ohne einen im hebräischen Wortlaut nicht eigens markierten Besitzbezug einzuführen. Die Fußnote zur Schlusswendung dokumentiert die wörtlichere Lesart und wahrt die Mehrdeutigkeit von עַל.
