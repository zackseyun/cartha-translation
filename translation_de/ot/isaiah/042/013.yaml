source:
  edition: WLC
  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: de
  text: Jahwe zieht aus wie ein Held, wie ein Kriegsmann entfacht er Eifer.[a] Er stößt einen Schrei aus, ja, er schreit laut auf; gegen seine Feinde setzt er sich durch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entfacht er Eifersucht“. Das hebräische Wort kann sowohl leidenschaftlichen Eifer als auch Eifersucht bezeichnen, besonders im Zusammenhang des Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über seine Feinde erweist er sich stark“.'
    reason: lexical_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּגִּבּוֹר
  choice: wie ein Held
  rationale: גִּבּוֹר bezeichnet einen starken, kampferprobten Mann oder Krieger. „Held“ ist im Deutschen würdig und bündig; der folgende Ausdruck macht den militärischen Zusammenhang eindeutig.
- source_word: יֵצֵא
  choice: zieht aus
  rationale: „Ausziehen“ bewahrt die Grundbedeutung von יצא und klingt im kriegerischen Kontext natürlich, ohne ein bestimmtes Marschieren hinzuzufügen.
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: wie ein Kriegsmann
  rationale: Die Wendung lautet wörtlich „wie ein Mann der Kriege“. „Kriegsmann“ bewahrt die männliche Form und die militärische Parallele, ohne im Deutschen unnatürlich zu wirken.
- source_word: יָעִיר קִנְאָה
  choice: entfacht er seinen Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. „Eifer“ passt zum aktiven göttlichen Einsatz in diesem Kriegskontext; das Possessivpronomen gibt den im Zusammenhang vorausgesetzten Träger idiomatisch wieder.
- source_word: יָרִיעַ
  choice: Er erhebt einen Schrei
  rationale: Das Verb bezeichnet das Erheben eines lauten Rufes; die Formulierung bleibt allgemein genug, während das folgende Verb die kriegerische Zuspitzung trägt.
- source_word: אַף יַצְרִיחַ
  choice: ja, er lässt den Schlachtruf erschallen
  rationale: אַף verstärkt die Aussage. יַצְרִיחַ bezeichnet lautes Schreien; „Schlachtruf“ bringt die durch den Kontext bestimmte militärische Funktion natürlich zum Ausdruck.
- source_word: עַל אֹיְבָיו יִתְגַּבָּר
  choice: über seine Feinde erweist er sich als mächtig
  rationale: Die Wiedergabe bewahrt sowohl die mögliche Überlegenheitsbedeutung von עַל als auch den reflexiven bzw. sich erweisenden Zug des Hitpael von גבר und greift zugleich die Wortwurzel von גִּבּוֹר auf.
theological_decisions:
- issue: Göttliche Kriegsmetaphorik
  choice: Die deutliche Kriegersprache bleibt ungemildert erhalten.
  alternative: Die Bilder könnten zu allgemeiner Stärke abgeschwächt werden.
  rationale: Der hebräische Text schildert Jahwe ausdrücklich als ausziehenden Kriegsmann, der ruft und seine Feinde überwindet. Eine Abschwächung würde das Bild und seine Spannung verändern.
- issue: Bedeutung von קִנְאָה
  choice: Eifer
  alternative: Eifersucht
  rationale: Beide Bedeutungen sind möglich. Im Zusammenhang des göttlichen Kampfes bezeichnet „Eifer“ am natürlichsten die leidenschaftliche Entschlossenheit; die alternative Bundesbedeutung wird in der Fußnote offengehalten.
- issue: Sieg oder Machterweis in יִתְגַּבָּר
  choice: erweist er sich als mächtig
  alternative: siegt er / gewinnt er die Oberhand
  rationale: Die gewählte Form erhält die reflexive Nuance und die Verbindung zu גִּבּוֹר, ohne den tatsächlichen Triumph zu leugnen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit klarer poetischer Parallelität. „Kriegsmann“ ist bewusst leicht feierlich, aber verständlich; die martialische Bildsprache des Ausgangstextes wird nicht abgeschwächt. Alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
