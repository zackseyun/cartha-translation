  terminology: »Ausgeplündert und ausgeraubt«, »Beute«, »Gefängnissen«, »rettet« und »Gib zurück!« passen zum Klage- und Gerichtsregister. Der offene Imperativ »Gib zurück!« bewahrt zutreffend das im Hebräischen nicht ausgedrückte Objekt. Die Fußnote soll die alternative Deutung von בַּחוּרִים als »junge Männer« weiterhin kenntlich machen, aber »unter« nicht als zu enge Ortsbeziehung festlegen.
