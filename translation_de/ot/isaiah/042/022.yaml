  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: de
  text: 'Doch dieses Volk ist ausgeplündert und ausgeraubt. Sie alle sind in Gruben gefangen[a] und in Gefängnissen verborgen. Sie sind zur Beute geworden, und niemand rettet sie; sie sind zum Raub geworden, und niemand sagt: »Gib zurück!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Sie alle sind inmitten junger Männer gefangen.« Das hebräische Wort bedeutet gewöhnlich »junge Männer«; der Zusammenhang legt hier jedoch eher eine seltene Bedeutung wie »Löcher« oder »Gruben« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: Doch dieses Volk ist
  rationale: Das Pronomen nimmt kollektiv auf das zuvor behandelte Volk Bezug. »Doch« gibt den Gegensatz im Zusammenhang wieder; die deutsche Formulierung ist natürlich und wahrt den kollektiven Sinn.
- source_word: בָּזוּז וְשָׁסוּי
  choice: ausgeplündert und ausgeraubt
  rationale: Die beiden passiven Begriffe schildern gewaltsame Beraubung. Zwei verwandte deutsche Verben erhalten die verstärkende hebräische Doppelung.
- source_word: הָפֵחַ
  choice: gefangen
  rationale: Die schwierige Form bezeichnet im Zusammenhang ein Gefangensein beziehungsweise eine Falle. »Gefangen« verbindet sich natürlich mit der folgenden Ortsangabe, ohne eine unsichere Herleitung zu überpräzisieren.
- source_word: בַּחוּרִים
  choice: in Erdlöchern
  rationale: Im Parallelismus mit den Gefängnissen ist eine seltene Bedeutung wie »Löcher« oder »Gruben« am wahrscheinlichsten. »Erdlöcher« vermittelt das Bild eines engen, verborgenen Haftortes; die geläufigere lexikalische Möglichkeit »unter jungen Männern« wird in der Fußnote bewahrt.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Suffixform hebt die Gesamtheit der Betroffenen hervor; »sie alle« ist im Deutschen klar und nachdrücklich.
- source_word: וּבְבָתֵּי כְלָאִים
  choice: in Gefängnissen
  rationale: Wörtlich sind es »Häuser der Gefangenschaft«. Das moderne »Gefängnisse« gibt die Bedeutung würdig und ohne unnötig fremdartige Formulierung wieder.
- source_word: הָחְבָּאוּ
  choice: verborgen
  rationale: Die passive Form beschreibt, dass die Menschen verborgen beziehungsweise weggeschlossen wurden. »Verborgen« erhält diesen Zustandssinn.
- source_word: הָיוּ לָבַז
  choice: Sie sind zur Beute geworden
  rationale: Die Konstruktion היה ל bezeichnet das Werden zu einem Zustand. »Zur Beute geworden« bewahrt das konkrete Bild der Kriegsbeute.
- source_word: וְאֵין מַצִּיל
  choice: und niemand rettet sie
  rationale: Die Existenzverneinung mit Partizip bedeutet, dass kein Retter vorhanden ist. Die aktive deutsche Wendung ist knapp und gibt den fortdauernden Mangel wieder.
- source_word: מְשִׁסָּה
  choice: sie sind geplündert
  rationale: Das Nominalgefüge setzt die Beschreibung als Gegenstand der Plünderung parallel zu »zur Beute geworden« fort. Die verbale deutsche Wiedergabe vermeidet das unnatürliche »sie sind Plünderung«, behält aber den Parallelismus.
- source_word: הָשַׁב
  choice: Gib zurück!
  rationale: Der Hifil-Imperativ von שׁוב fordert zur Rückgabe beziehungsweise Wiederherstellung auf. »Gib zurück!« erhält die knappe, offene Forderung und legt kein ausdrücklich genanntes Objekt fest.
theological_decisions:
- issue: Bezug des Singularpronomens וְהוּא
  choice: 'Kollektiver Bezug auf das Volk: »Doch dieses Volk ist«'
  alternative: 'Wörtlicher mit einem maskulinen Singular: »Und er ist ein Volk« oder »Doch es ist ein Volk«'
  rationale: Das folgende עַם erläutert den kollektiven Bezug. Die Entscheidung ist grammatisch und diskursbezogen; sie identifiziert keinen zusätzlichen Einzelnen.
- issue: Gegenstand des Befehls הָשַׁב
  choice: 'Ohne ergänztes Objekt: »Gib zurück!«'
  alternative: »Stell sie wieder her!« oder »Bring sie zurück!«
  rationale: Der hebräische Text nennt kein Objekt. Die knappe Wiedergabe bewahrt die mögliche Spannung zwischen Rückgabe der Beute, Rückführung der Gefangenen und allgemeiner Wiederherstellung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Klage- und Gerichtsregister. Die hebräischen Parallelismen werden soweit möglich durch wiederholte Beute- und Plünderungsbegriffe erhalten. Die schwer verständliche Wendung בַּחוּרִים wird im Haupttext kontextgemäß wiedergegeben und ihre echte lexikalische Alternative in einer markierten Fußnote dokumentiert.
