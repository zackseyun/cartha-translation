id: ISA.42.5
reference: Isaiah 42:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: de
  text: 'So spricht Gott, Jahwe, der die Himmel geschaffen und sie ausgespannt hat, der die Erde ausgebreitet hat und was aus ihr hervorgeht,[a] der den Menschen auf ihr Atem gibt und Geist[b] denen, die auf ihr gehen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ihre Sprösslinge“; gemeint sein kann, was die Erde hervorbringt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Atem“. Das hebräische Wort kann „Geist“, „Atem“ oder „Wind“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: Gott, Jahwe
  rationale: הָאֵל ist die Gottesbezeichnung, gefolgt vom Eigennamen יהוה. Die Apposition bewahrt beide Elemente und klingt im Deutschen würdig und verständlich.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: der die Himmel geschaffen hat
  rationale: Das Partizip bezeichnet Jahwe als Schöpfer. Der deutsche Relativsatz gibt die attributive Funktion natürlich wieder; der Plural „Himmel“ bewahrt den kosmischen Umfang.
- source_word: וְנוֹטֵיהֶם
  choice: und sie ausgespannt hat
  rationale: נטה beschreibt das Ausspannen beziehungsweise Ausbreiten der Himmel. „Ausgespannt“ erhält das konkrete Bild.
- source_word: רֹקַע הָאָרֶץ
  choice: der die Erde ausgebreitet hat
  rationale: רקע kann ein Breiten durch Schlagen oder Hämmern bezeichnen. „Ausgebreitet“ gibt hier das Ergebnis natürlich wieder, ohne die Bildlichkeit unnötig festzulegen.
- source_word: וְצֶאֱצָאֶיהָ
  choice: und was aus ihr hervorgeht
  rationale: צאצאים bezeichnet das, was hervorkommt oder entspringt. Die breite Formulierung lässt offen, ob vor allem Erzeugnisse, Pflanzen oder Lebewesen gemeint sind.
- source_word: נֹתֵן נְשָׁמָה
  choice: der … Atem gibt
  rationale: נשמה bezeichnet den Atem beziehungsweise Lebensatem. „Atem“ ist klar und vermeidet die sachlich unpassende Einengung auf „Seele“.
- source_word: לָעָם עָלֶיהָ
  choice: den Menschen auf ihr
  rationale: עם ist ein Kollektiv. Im Deutschen bezeichnet „den Menschen“ die Menschheit beziehungsweise die auf der Erde lebenden Menschen natürlicher als „dem Volk“, das hier ein bestimmtes Volk nahelegen könnte.
- source_word: וְרוּחַ
  choice: und Geist
  rationale: רוח kann Geist, Atem oder Wind bedeuten. „Geist“ hält die Wortwahl von נשמה („Atem“) auseinander und bewahrt zugleich die anthropologische Spannung.
- source_word: לַהֹלְכִים בָּהּ
  choice: denen, die auf ihr gehen
  rationale: Die konkrete Bedeutung „die Gehenden“ bleibt erhalten; „auf ihr“ ist im Deutschen für die Erde natürlicher als „in ihr“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Unterscheidung von נְשָׁמָה und רוּחַ
  choice: Atem … Geist
  alternative: Lebensatem … Atem
  rationale: Zwei verwandte, aber verschiedene hebräische Wörter stehen parallel. Die unterschiedliche Wiedergabe erhält sowohl ihre Nähe als auch ihre Unterscheidung, ohne das Verhältnis dogmatisch zu erklären.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer prophetischer Einleitungsformel. Die Relativsatzfolge bewahrt den feierlichen Rhythmus des Hebräischen. Der abschließende Doppelpunkt hält den Satz für die folgende Rede offen.
