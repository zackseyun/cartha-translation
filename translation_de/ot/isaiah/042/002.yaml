base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: de
  text: Er wird nicht schreien, seine Stimme nicht erheben und seine Stimme nicht auf der Straße hören lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit „draußen“ als wörtlicherer Wiedergabe des öffentlichen Außenraums: „Er wird nicht schreien, seine Stimme nicht erheben und seine Stimme draußen nicht hören lassen.“ Die hebräische Form kann auch präsentisch verstanden werden: „Er schreit nicht …“'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: יִצְעַק
  choice: schreien
  rationale: צעק bezeichnet einen lauten Ruf, häufig in Not oder als öffentlichen Appell. „Schreien“ bewahrt die hörbare Intensität, ohne hier zwingend einen besonderen Gefühlszustand festzulegen.
- source_word: יִשָּׂא
  choice: seine Stimme erheben
  rationale: נשׂא bedeutet wörtlich „heben/tragen“. Im Parallelismus mit קוֹלוֹ ist „seine Stimme erheben“ die natürliche deutsche Wiedergabe der Ellipse.
- source_word: יַשְׁמִיעַ
  choice: sie hören lassen
  rationale: 'Der Hifil von שׁמע ist kausativ: „hörbar machen“. Das Pronomen „sie“ greift „seine Stimme“ auf und vermeidet im Deutschen eine schwerfällige Wiederholung.'
- source_word: בַּחוּץ
  choice: draußen
  rationale: חוּץ bezeichnet den Außenraum beziehungsweise den öffentlichen Bereich. „Draußen“ bewahrt die räumliche Weite des Ausdrucks, ohne ihn unnötig auf eine einzelne Straße oder einen Marktplatz zu verengen.
- source_word: קוֹלוֹ
  choice: seine Stimme
  rationale: קוֹל bedeutet in diesem Zusammenhang „Stimme“. Der Ausdruck wird beim zweiten Verb ergänzt und beim dritten durch „sie“ wieder aufgenommen.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: wird nicht ... und ... nicht ... und ... nicht
  rationale: Die wiederholte Verneinung und die koordinierenden וְ-Partikeln werden rhythmisch nachvollzogen; das Futur passt zum vorausblickenden Porträt des Knechtes.
theological_decisions:
- issue: Zeitlich-aspektuelle Bedeutung der Imperfektformen im Kontext des Knechtsliedes
  choice: 'Zukunftsbezogene Beschreibung: „Er wird nicht …“'
  alternative: 'Habituelle Gegenwart: „Er schreit nicht …“'
  rationale: Die Imperfektformen können charakteristisches Handeln ausdrücken; im programmatisch vorausblickenden Zusammenhang von Jesaja 42 ist das deutsche Futur angemessen, ohne den habituellen Charakter auszuschließen.
- issue: Bezug des elliptischen וְלֹא יִשָּׂא
  choice: „seine Stimme nicht erheben“
  alternative: 'Formal offen: „nichts erheben“ beziehungsweise „sich nicht erheben“'
  rationale: Der folgende Ausdruck „seine Stimme“ legt idiomatisch nahe, dass auch יִשָּׂא auf die Stimme bezogen ist. Da das Objekt im Hebräischen erst anschließend ausdrücklich steht, wird die formal knappere Alternative in der Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Dreischritt. „Draußen“ gibt den öffentlichen Außenraum wieder; die Fußnote macht die Ellipse beim zweiten Verb und eine präsentisch-habituelle Lesemöglichkeit teilweise sichtbar.
