base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: de
  text: Wer ist blind, wenn nicht mein Diener, und taub wie mein Bote, den ich sende? Wer ist blind wie der, der in Frieden ist,[a] und blind wie der Diener Jahwes?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie der Vollkommene/Untadelige« beziehungsweise »wie der, der ganz ist«. Das hebräische Wort מְשֻׁלָּם ist schwierig und kann Vollständigkeit, Ganzheit oder Frieden bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  choice: blind
  rationale: Die gewöhnliche Bedeutung des Adjektivs wird an allen drei Stellen gleich wiedergegeben, um die rhetorische Wiederholung zu bewahren.
- source_word: חֵרֵשׁ
  choice: taub
  rationale: Die direkte und kräftige Entsprechung erhält die Verbindung mit »blind«.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im Kontext der Diener-Texte Jesajas ist »Diener« die natürliche und etablierte Wiedergabe, ohne den Bezug näher festzulegen.
- source_word: מַלְאָכִי
  choice: mein Bote
  rationale: Obwohl das Wort auch einen Engel bezeichnen kann, sprechen die Parallele zu »mein Diener« und das Senden hier für einen beauftragten Boten.
- source_word: אֶשְׁלָח
  choice: den ich sende
  rationale: Das hebräische Imperfekt wird als gegenwärtig bzw. allgemein geltender Sendeauftrag wiedergegeben, ohne einen vollendeten Vorgang einzutragen.
- source_word: מְשֻׁלָּם
  choice: der, der in Frieden ist
  rationale: Die schwierige Form aus der Wortfamilie שלם kann Frieden, Ganzheit oder Vollkommenheit anklingen lassen. Die Hauptfassung wahrt den möglichen Friedensaspekt, ohne ein im Hebräischen unausgesprochenes »mit mir« hinzuzufügen.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: Die Genitivverbindung wird unmittelbar und in Übereinstimmung mit der ersten Vershälfte wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: כִּי אִם
  choice: wenn nicht
  rationale: Die deutsche idiomatische Wendung bewahrt die ausschließende Kraft der rhetorischen Frage.
theological_decisions:
- issue: Identität von »mein Diener« und »mein Bote«
  choice: Der Bezug bleibt über die Bezeichnungen des Verses hinaus unbestimmt.
  alternative: Israel als Ganzes, der Prophet oder eine idealisierte Dienergestalt ausdrücklich identifizieren.
  rationale: Der Vers benennt den Adressaten nur als Diener und Boten. Eine engere Identifikation würde eine Auslegung in die Übersetzung eintragen.
- issue: Deutung von מְשֻׁלָּם
  choice: »der, der in Frieden ist« im Haupttext, mit Alternativen in der Fußnote.
  alternative: »der Vollkommene/Untadelige«, »der Ganzgemachte« oder »der Vergoltene«.
  rationale: Die Form ist lexikalisch und kontextuell umstritten. Die Übersetzung bewahrt den Friedensaspekt, während die Fußnote die wesentliche Bedeutungsbreite offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Wörter »blind« und »Diener« sowie die rhetorischen Fragen bleiben erhalten. »Jahwe« gibt den Gottesnamen als Eigennamen wieder.
