base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
translation:
  language: de
  text: Siehe, die früheren Dinge[a] sind eingetroffen[b], und neue Dinge verkünde ich. Bevor sie hervorsprossen[c], kündige ich sie euch an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die ersten Dinge“ oder, kollektiv formuliert, „das Frühere“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sind gekommen“. Gemeint sein kann: „sind geschehen“ oder „haben sich erfüllt“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bedeutet wörtlich „sprossen“ oder „hervorkeimen“ und gebraucht das Bild beginnenden Pflanzenwachstums für das noch nicht sichtbar eingetretene Neue.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: das Frühere
  rationale: Der substantivierte Plural bezeichnet frühere beziehungsweise zuerst angekündigte Dinge. Das kollektive „das Frühere“ ist im Deutschen natürlich und bewahrt die knappe Gegenüberstellung zu „Neues“.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das Aufmerksamkeitssignal trägt hier feierliche prophetische Kraft. „Siehe“ ist im modernen Standarddeutsch weiterhin verständlich und würdevoll.
- source_word: בָאוּ
  choice: ist eingetroffen
  rationale: Wörtlich bedeutet das Verb „ist gekommen/sind gekommen“. Bei angekündigten Geschehnissen bezeichnet es idiomatisch deren Eintreten, ohne ausdrücklich mehr als der Text zu behaupten.
- source_word: חֲדָשׁוֹת
  choice: Neues
  rationale: Der substantivierte Plural steht parallel zu הָרִאשֹׁנוֹת. „Neues“ erhält die Offenheit des Bezugs und vermeidet die einengende Ergänzung „Ereignisse“.
- source_word: מַגִּיד
  choice: verkünde ich
  rationale: Der Hifil von נגד bedeutet „bekannt machen, mitteilen, verkünden“. „Verkünden“ passt zum prophetischen Register und bleibt allgemein verständlich.
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die temporale Konjunktion gibt die schlichte Bedeutung „bevor“ natürlich wieder.
- source_word: תִּצְמַחְנָה
  choice: es hervorsprosst
  rationale: Das Verb verwendet das Bild des Keimens oder Sprossens. Das singularische „es“ nimmt das im Deutschen kollektiv gebrauchte „Neues“ auf.
- source_word: אַשְׁמִיע אֶתְכֶם
  choice: kündige ich es euch an
  rationale: Der Hifil von שמע lautet wörtlich „ich lasse euch hören“. Im Deutschen gibt „ich kündige es euch an“ die kommunikative und zukunftsbezogene Funktion natürlich wieder; „es“ nimmt „Neues“ auf.
theological_decisions:
- issue: Verhältnis von früheren und neuen Dingen
  choice: Die Formulierung lässt erkennen, dass das Frühere eingetroffen ist und Gott Neues vor dessen sichtbarem Beginn ankündigt.
  alternative: Man kann „das Frühere“ lediglich als vergangene Taten und nicht ausdrücklich als zuvor angekündigte Ereignisse verstehen.
  rationale: Der unmittelbare Kontrast zwischen dem Eingetroffenen und dem vor seinem Hervorsprossen Verkündeten legt Vorhersage und Erfüllung nahe. Die Übersetzung macht diesen Zusammenhang nicht durch zusätzliche dogmatische Begriffe expliziter als der hebräische Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Parallelität. „Siehe“ bewahrt den feierlichen Aufmerksamkeitsruf; „hervorsprosst“ erhält das auffällige Wachstumsbild. Die kollektiven Formen „das Frühere“ und „Neues“ vermeiden unnötige Festlegungen auf Ereignisse, Aussagen oder Taten.
