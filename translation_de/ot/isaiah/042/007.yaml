base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/007.yaml
  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
translation:
  language: de
  text: um blinde Augen[a] zu öffnen, um einen Gefangenen aus dem Gewahrsam[b] herauszuführen, aus dem Gefängnis die im Dunkeln Sitzenden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Augen der Blinden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus dem Kerker“ beziehungsweise „aus dem Gefängnis“; das hebräische Wort kann einen Ort oder Zustand des Eingeschlossenseins bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die im Dunkeln wohnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: zu öffnen
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck. „Augen öffnen“ gibt die hebräische Verbindung klar und idiomatisch wieder.
- source_word: עֵינַיִם עִוְרוֹת
  choice: blinde Augen
  rationale: Das Adjektiv bezieht sich unmittelbar auf „Augen“; die knappe Bildsprache des Hebräischen bleibt erhalten.
- source_word: לְהוֹצִיא
  choice: herauszuführen
  rationale: Der zweite Zweckinfinitiv bezeichnet das Veranlassen des Herausgehens. „Herausführen“ klingt im Deutschen natürlich und bewahrt die räumliche Bewegung.
- source_word: מִמַּסְגֵּר
  choice: aus dem Gewahrsam
  rationale: Das Substantiv bezeichnet einen Ort oder Zustand des Eingeschlossenseins. „Gewahrsam“ lässt diese Bedeutungsbreite eher offen als das spezifischere „Kerker“.
- source_word: אַסִּיר
  choice: einen Gefangenen
  rationale: Der indefinite Singular wird beibehalten und nicht an den folgenden Plural angeglichen.
- source_word: מִבֵּית כֶּלֶא
  choice: aus dem Gefängnis
  rationale: Die Konstruktverbindung bedeutet wörtlich „aus dem Haus der Gefangenschaft“. „Aus dem Gefängnis“ ist im modernen Deutsch natürlich, ohne den Sinn abzuschwächen.
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: die, die im Dunkeln sitzen
  rationale: Das Partizip von ישׁב kann „sitzen“ oder „wohnen“ bedeuten. „Im Dunkeln sitzen“ bewahrt das anschauliche Bild und die Zustandsbeschreibung.
theological_decisions:
- issue: Wörtliche und metaphorische Tragweite von Blindheit, Gefangenschaft und Dunkelheit
  choice: Die konkreten Bilder von blinden Augen, Gefangenschaft und Dunkelheit bleiben ohne geistliche Ausdeutung im Haupttext stehen.
  alternative: Die Bilder ausdrücklich als geistliche Erleuchtung und Befreiung deuten.
  rationale: Der hebräische Text kann wörtliche wie übertragene Resonanzen tragen, legt ihre Beziehung hier jedoch nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung.
- issue: Numeruswechsel zwischen אַסִּיר und יֹשְׁבֵי
  choice: Der Wechsel vom singularischen „einen Gefangenen“ zum pluralischen „die, die … sitzen“ wird beibehalten.
  alternative: Beide parallelen Glieder im Deutschen in den Plural setzen.
  rationale: So bleibt eine auffällige formale Spannung des hebräischen Textes sichtbar, ohne die beiden Glieder stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Zweckangabe mit „um … zu“ spiegelt den hebräischen Aufbau. Die leicht markierte Parallelkonstruktion im zweiten Halbvers bewahrt den Numeruswechsel und die poetische Spannung des Ausgangstextes.
