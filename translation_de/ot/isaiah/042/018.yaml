id: ISA.42.18
reference: Isaiah 42:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/חֵרְשִׁ֖ים שְׁמָ֑עוּ וְ/הַ/עִוְרִ֖ים הַבִּ֥יטוּ לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
translation:
  language: de
  text: Hört, ihr Tauben[a], und schaut hin, ihr Blinden, damit ihr seht[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder substantivisch: »die Tauben … die Blinden«. Die hebräischen Adjektive mit Artikel können als direkte Anrede oder als Bezeichnungen der betreffenden Gruppen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »um zu sehen«. Die Schlusswendung bezeichnet das Ziel des Hinschauens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: ihr Tauben
  rationale: Das mit Artikel gebrauchte Adjektiv bezeichnet hier die Angeredeten. Die direkte Anrede bewahrt den eindringlichen prophetischen Aufruf; die konkrete Bezeichnung »taub« bleibt erhalten.
- source_word: שְׁמָעוּ
  choice: Hört
  rationale: Der pluralische Imperativ von שׁמע wird mit dem klaren, kräftigen deutschen Imperativ »Hört« wiedergegeben.
- source_word: וְהַעִוְרִים
  choice: und … ihr Blinden
  rationale: Die Konjunktion verbindet die zweite direkte Anrede mit der ersten und erhält so den Parallelismus des hebräischen Satzes.
- source_word: הַבִּיטוּ
  choice: schaut hin
  rationale: Der Hifil-Imperativ fordert zu bewusstem, gerichtetem Sehen auf. »Schaut hin« gibt diese Nuance natürlicher wieder als das bloße »schaut« und ist weniger altertümlich als »seht hin« im Sinn von »siehe«.
- source_word: לִרְאוֹת
  choice: damit ihr seht
  rationale: Der Infinitiv mit ל bezeichnet hier das Ziel des Hinschauens. »Damit ihr seht« drückt diesen Zweck im modernen Deutsch klar aus.
theological_decisions:
- issue: Ob »taub« und »blind« unmittelbar als geistliche Unempfänglichkeit auszulegen sind
  choice: Die konkreten Sinnesbezeichnungen bleiben im Haupttext stehen; ihre bildliche Bedeutung ergibt sich aus dem Zusammenhang.
  alternative: »geistlich taub und blind« oder »unempfänglich«
  rationale: Der hebräische Text verwendet die konkreten Begriffe und lässt dadurch die prophetische Bildsprache wirken. Eine ausdrückliche geistliche Deutung im Wortlaut würde die Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen, parallelen Imperativen. Die konkrete Bildsprache und die mögliche grammatische Mehrdeutigkeit des Hebräischen bleiben gewahrt.
