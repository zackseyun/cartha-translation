  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: de
  text: Er wird weder erlahmen noch zerbrechen, bis er das Recht auf der Erde aufrichtet. Die Küstenländer werden auf seine Weisung warten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf seine Weisung hoffen“. Das hebräische Verb bezeichnet ein Warten voller Erwartung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְהֶה
  choice: verlöschen
  rationale: Das Verb כהה bezeichnet ein Matt- oder Dunkelwerden. „Verlöschen“ bewahrt im Deutschen die bildhafte Verbindung zum glimmenden Docht aus dem vorherigen Vers, ohne die Aussage auf bloße körperliche Ermüdung zu verengen.
- source_word: יָרוּץ
  choice: zerbrechen
  rationale: רצץ bedeutet zerdrücken oder zerbrechen. „Zerbrechen“ erhält die Verbindung zum geknickten beziehungsweise zerdrückten Rohr in Vers 3 und lässt zugleich offen, worin der Widerstand gegen den Knecht besteht.
- source_word: עַד יָשִׂים
  choice: bis er … aufgerichtet hat
  rationale: שים bedeutet setzen oder hinstellen. In Verbindung mit מִשְׁפָּט gibt „aufrichten“ natürlich wieder, dass das Recht verlässlich zur Geltung und in Bestand gebracht wird.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die anschließende Erwähnung der Küstenländer spricht hier für den weiteren, weltumspannenden Horizont.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט bezeichnet hier nicht nur ein einzelnes Urteil, sondern die gerechte Rechtsordnung. „Das Recht“ ist im Deutschen idiomatisch und bewahrt den sachlichen und gemeinschaftlichen Bezug.
- source_word: לְתוֹרָתוֹ
  choice: auf seine Weisung
  rationale: תּוֹרָה umfasst Unterweisung, Lehre und verbindliche Weisung und ist nicht auf ein Gesetzbuch beschränkt. „Weisung“ wahrt diese Breite und das verbindliche Gewicht des Begriffs.
- source_word: אִיִּים
  choice: die Küstenländer
  rationale: אִיִּים bezeichnet in prophetischen Texten Inseln sowie überseeische oder an Küsten gelegene Länder. „Küstenländer“ gibt diesen weiteren geografischen Sinn besser wieder als ausschließlich „Inseln“.
- source_word: יְיַחֵילוּ
  choice: werden … warten
  rationale: יחל im Piel bezeichnet erwartungsvolles Warten und kann auch Hoffen ausdrücken. „Warten“ gibt den Grundvorgang wieder; die hoffnungsvolle Nuance wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Reichweite des Auftrags des Knechtes
  choice: Ein weltweiter Horizont, angedeutet durch „Erde“ und „Küstenländer“
  alternative: Vorrangig das Land Israel, mit möglichen weiterreichenden Folgen
  rationale: Die Verbindung von אֶרֶץ mit den Küstenländern weist im Vers selbst über ein örtlich begrenztes Gebiet hinaus. Die Übersetzung gibt diesen Horizont wieder, ohne die Identität des Knechtes oder die spätere theologische Entfaltung vorwegzunehmen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen Bilder „verlöschen“ und „zerbrechen“ greifen bewusst die Bildsprache des vorherigen Verses auf. „Das Recht aufrichten“ und „Weisung“ bewahren den prophetischen und verbindlichen Ton, ohne konfessionelle Deutungen einzutragen.
