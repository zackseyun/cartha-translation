  rationale: Die Revision begrenzt sich auf zwei sichere semantische und grammatische Präzisierungen. „Erlahmen“ vermeidet die zu starke Finalität von „verlöschen“ und wahrt zugleich die Anspielung auf die Bildsprache des vorigen Verses. Das Präsens in der bis-Konstruktion gibt das zielgerichtete hebräische Imperfekt natürlich wieder. Alle anderen tragenden Entscheidungen des Entwurfs bleiben erhalten.
