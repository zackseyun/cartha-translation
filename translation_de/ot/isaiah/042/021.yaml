  rationale: Nur das zweite Verb wird zu „zu verherrlichen“ geändert. Damit wird die aktive kausative Bedeutung von וְיַאְדִּיר unmittelbar wiedergegeben, ohne die Aussage, den Registerton oder die bewusst breite Übersetzung von תּוֹרָה zu verändern.
