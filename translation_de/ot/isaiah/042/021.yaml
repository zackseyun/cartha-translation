source:
  edition: WLC
  text: יְהוָ֥ה חָפֵ֖ץ לְמַ֣עַן צִדְק֑/וֹ יַגְדִּ֥יל תּוֹרָ֖ה וְ/יַאְדִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: de
  text: Jahwe hatte Gefallen daran, um seiner Gerechtigkeit willen die Weisung[a] groß zu machen und zu verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Gesetz; hebräisch Tora, auch „Unterweisung“ oder „Lehre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חָפֵץ
  choice: hatte Gefallen daran
  rationale: Die Form bezeichnet Jahwes Wohlgefallen beziehungsweise seinen Willen; die deutsche Wendung ist natürlich und lässt beide Nuancen anklingen.
- source_word: לְמַעַן צִדְקוֹ
  choice: um seiner Gerechtigkeit willen
  rationale: Die feste deutsche Wendung bewahrt den möglichen Sinn von Motiv oder Zweck, ohne das Verhältnis vorschnell festzulegen.
- source_word: צִדְקוֹ
  choice: seiner Gerechtigkeit
  rationale: „Gerechtigkeit“ erhält die breite moralische, bundestheologische und rechtliche Bedeutungsweite des hebräischen Begriffs besser als das engere „Recht“.
- source_word: יַגְדִּיל
  choice: groß zu machen
  rationale: Die kausative Form wird ausdrücklich wiedergegeben und bildet den Parallelismus mit dem folgenden Verb ab.
- source_word: תּוֹרָה
  choice: die Weisung
  rationale: „Weisung“ gibt die Bedeutungsbreite von Tora als Lehre, Unterweisung und verbindliche göttliche Anordnung wieder; die traditionelle Alternative „Gesetz“ steht in der Fußnote.
- source_word: וְיַאְדִּיר
  choice: und herrlich werden zu lassen
  rationale: Diese Formulierung gibt die kausative Bedeutung des Hifil wieder und vermeidet im Deutschen die unnatürliche Verbindung „herrlich machen“.
theological_decisions:
- issue: Bedeutung von צִדְקוֹ als Grund oder Ziel von Jahwes Handeln
  choice: um seiner Gerechtigkeit willen
  alternative: um seines Rechts willen
  rationale: Die Übersetzung bewahrt die umfassendere Bedeutung „Gerechtigkeit“, ohne den Begriff ausschließlich auf richterliches Recht einzuengen. Zugleich lässt „um ... willen“ offen, ob primär Beweggrund, Zweck oder beides gemeint ist.
- issue: Bezug der Infinitivkonstruktion auf חָפֵץ
  choice: Jahwe hatte Gefallen daran, ... die Weisung groß zu machen
  alternative: Jahwe wollte um seiner Gerechtigkeit willen die Weisung groß machen
  rationale: Die gewählte Fassung erhält den Aspekt des Wohlgefallens, ohne den im Verb ebenfalls möglichen Willensaspekt auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem hebräischen Parallelismus und gibt beide kausativen Verben ausdrücklich wieder. „Jahwe“ bewahrt den Gottesnamen; „Weisung“ ist im Haupttext verständlich und semantisch breiter als „Gesetz“.
