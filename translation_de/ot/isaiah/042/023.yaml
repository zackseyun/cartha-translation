lexical_decisions:
- source_word: מִי בָכֶם
  choice: Wer unter euch
  rationale: Die rhetorische Frage und die kollektive Anrede werden im modernen Deutschen natürlich wiedergegeben.
- source_word: יַאֲזִין זֹאת
  choice: hört darauf
  rationale: אזן bezeichnet aufmerksames Hinhören; das pronominale „darauf“ gibt den Rückbezug von זֹאת auf die gegenwärtige Botschaft idiomatisch wieder.
- source_word: יַקְשִׁב
  choice: passt auf
  rationale: Die Wiedergabe unterscheidet das Verb von אזן und bewahrt die Steigerung zu bewusster Aufmerksamkeit.
- source_word: וְיִשְׁמַע
  choice: und hört
  rationale: שמע bedeutet hier im Zusammenhang des Hörens zunächst „hören“; die mögliche Folgerung des Gehorchens wird nicht ausdrücklich in den Text eingetragen.
- source_word: לְאָחוֹר
  choice: für die kommende Zeit
  rationale: Wörtlich steht eine Wendung mit „hinten/zurück“, die temporal auf das Spätere beziehungsweise Künftige weist. Die deutsche Formulierung bewahrt diese zeitliche Ausrichtung ohne unverständliche Wörtlichkeit.
