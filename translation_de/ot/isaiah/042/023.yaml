  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: de
  text: Wer unter euch wird sich dies anhören, achtgeben und künftig hören[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Zukunft“, „später“ oder „hernach“. Im Hebräischen steht wörtlich eine Wendung mit „hinten/nach hinten“, die idiomatisch auf das Spätere oder Künftige weisen kann.'
