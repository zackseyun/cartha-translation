  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: de
  text: Ich werde Berge und Hügel verwüsten, und all ihre Pflanzen werde ich verdorren lassen. Flüsse werde ich zu Inseln[a] machen, und Teiche werde ich austrocknen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Küstenländer“; das hebräische Wort kann Inseln oder Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיב
  choice: ich werde … verwüsten
  rationale: Der Hifil von חרב bezeichnet das Verursachen von Verwüstung oder Verödung. „Verwüsten“ bewahrt den Gerichtston, ohne vollständige Vernichtung zu behaupten.
- source_word: הָרִים וּגְבָעוֹת
  choice: Berge und Hügel
  rationale: Dies sind die üblichen konkreten Entsprechungen; „Höhen“ könnte hier unbeabsichtigt kultische Vorstellungen eintragen.
- source_word: וְכָל עֶשְׂבָּם
  choice: all ihre Pflanzen
  rationale: עֵשֶׂב kann Gras, Kraut oder Pflanzenwuchs allgemein bezeichnen. „Pflanzen“ gibt den gesamten Bewuchs der Berge und Hügel verständlich wieder.
- source_word: אוֹבִישׁ
  choice: verdorren lassen / austrocknen
  rationale: 'Der Hifil von יבש bedeutet, etwas trocken werden zu lassen. Im Deutschen verlangt das jeweilige Objekt eine natürliche Differenzierung: Pflanzen verdorren, Gewässer trocknen aus.'
- source_word: וְשַׂמְתִּי
  choice: werde ich zu … machen
  rationale: שׂים bezeichnet hier das Versetzen in einen neuen Zustand. Die Konstruktion „zu … machen“ bildet dies unmittelbar ab.
- source_word: נְהָרוֹת
  choice: Flüsse
  rationale: נְהָרוֹת bezeichnet gewöhnlich Flüsse; der Kontext erfordert keine Abschwächung zu „Bächen“.
- source_word: לָאִיִּים
  choice: zu Inseln
  rationale: אִיִּים kann Inseln oder Küstenländer bezeichnen. „Inseln“ ist die direkte lexikalische Wiedergabe und bewahrt das auffällige Bild des hebräischen Textes.
- source_word: וַאֲגַמִּים
  choice: Teiche
  rationale: אֲגַמִּים bezeichnet stehende oder sumpfige Gewässer. „Teiche“ ist knapp und bildet einen verständlichen Parallelbegriff zu den Flüssen.
theological_decisions:
- issue: Bild göttlichen Gerichts über die Schöpfung
  choice: Die konkrete Aussage über die Verwüstung von Gelände, Pflanzen und Gewässern bleibt ungemildert stehen.
  alternative: Das Bild ausschließlich als Metapher für die Beseitigung von Hindernissen wiederzugeben.
  rationale: Der hebräische Text verwendet konkrete Umweltbilder. Die Übersetzung sollte weder ihre Wucht abschwächen noch entscheiden, ob sie im weiteren Zusammenhang nur bildlich oder auch geschichtlich beziehungsweise kosmisch zu verstehen sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier Verbalhandlungen werden durch wiederholte Voranstellung des jeweiligen Objekts und die wiederkehrende Form „werde ich“ rhetorisch hervorgehoben. Bei אוֹבִישׁ wird die hebräische Wiederholung semantisch bewahrt, im Deutschen jedoch objektgerecht mit „verdorren lassen“ und „austrocknen“ ausgedrückt. Der Fußnotenmarker steht unmittelbar bei „Inseln“, auf das sich die lexikalische Alternative bezieht.
