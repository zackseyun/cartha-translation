  terminology: „Stimme erheben“, „Siedlungen“, „jubeln“, „Gipfel der Berge“ und „laut rufen“ sind modernstandardsprachlich und dem würdigen prophetischen Register angemessen. Die Fußnote zu Sela ist sachlich und am richtigen Anker platziert.
