source:
  edition: WLC
  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: de
  text: Die Wüste und ihre Städte sollen ihre Stimme erheben, ebenso die Siedlungen, in denen Kedar wohnt. Die Bewohner von Sela[a] sollen jubeln; von den Gipfeln der Berge sollen sie laut rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Bewohner des Felsens«, wenn סֶלַע als Gattungswort und nicht als Ortsname Sela verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: sollen ihre Stimme erheben
  rationale: Das Präfixverb steht in einer auffordernden Folge. Das im Hebräischen nicht ausgedrückte Objekt »Stimme« wird für natürliches Deutsch aus dem Zusammenhang ergänzt; »erheben« bewahrt zugleich das Bild von נשׂא.
- source_word: מִדְבָּר
  choice: die Wüste
  rationale: »Wüste« gibt מִדְבָּר in modernem Standarddeutsch knapp wieder und eignet sich für die poetische Personifikation des Landstrichs.
- source_word: וְעָרָיו
  choice: und ihre Städte
  rationale: Das maskuline Suffix bezieht sich grammatisch auf מִדְבָּר. Im Deutschen richtet sich das Possessivpronomen nach dem Genus von »Wüste«.
- source_word: חֲצֵרִים
  choice: die Siedlungen
  rationale: חֲצֵרִים bezeichnet unbefestigte Ortschaften oder Dörfer. »Siedlungen« ist weit genug, auch halbnomadische Wohnplätze Kedars einzuschließen.
- source_word: תֵּשֵׁב קֵדָר
  choice: in denen Kedar wohnt
  rationale: Die Relativkonstruktion gibt die knappe hebräische Fügung natürlich wieder. Kedar bleibt als Eigenname erhalten.
- source_word: יָרֹנּוּ
  choice: sollen jubeln
  rationale: רנן bezeichnet freudigen, klingenden Gesang oder Jubelruf. »Jubeln« bewahrt die feierliche Freude, ohne unnötig zwischen Singen und Rufen festzulegen.
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das substantivierte Partizip bezeichnet Menschen, die an einem Ort wohnen; »Bewohner« ist idiomatisch und prägnant.
- source_word: סֶלַע
  choice: Sela
  rationale: Im Parallelismus mit Kedar ist wahrscheinlich der Ortsname Sela gemeint. Die mögliche Bedeutung als Gattungswort »Fels« bleibt in einer Fußnote sichtbar.
- source_word: מֵרֹאשׁ הָרִים
  choice: von den Gipfeln der Berge
  rationale: Die Wendung bezeichnet die höchsten Stellen der Berge. »Gipfel« ist im Deutschen natürlich und bewahrt das pluralische Bild.
- source_word: יִצְוָחוּ
  choice: laut rufen
  rationale: צוח bezeichnet einen kräftigen, weithin hörbaren Ruf. »Laut rufen« ist würdig und lässt den positiven Lobkontext durch den Zusammenhang erkennen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Sprache. Die mehrfachen Aufforderungen werden mit »sollen« wiedergegeben; »jubeln« und »laut rufen« erhalten den ansteigenden Lobcharakter. Der Fußnotenmarker steht unmittelbar beim mehrdeutigen Ausdruck.
