  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: de
  text: Da goss er die Glut seines Zorns und die Wucht des Krieges über ihn[a] aus. Die Glut setzte ihn ringsum in Flammen, doch er erkannte es nicht; sie brannte in ihm[c], doch er nahm es sich nicht zu Herzen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Einzahl „ihn/er“ bezeichnet hier Israel beziehungsweise Jakob als ein personifiziertes Volk.
    reason: cultural_note
  - marker: c
    text: 'Oder: „sie brannte an ihm“ beziehungsweise „sie erfasste ihn“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „und er legte es nicht auf das Herz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ עָלָיו
  choice: Da goss er über ihn … aus
  rationale: שׁפך bedeutet wörtlich „ausgießen“. Die deutsche Wendung bewahrt das Bild, dass Zorn und Kriegsgewalt über den Betroffenen ausgegossen werden.
- source_word: חֵמָה אַפּוֹ
  choice: die Glut seines Zorns
  rationale: חֵמָה bezeichnet Hitze, Grimm oder Zorn, während אַף idiomatisch für Zorn steht. „Glut seines Zorns“ erhält die Intensivierung und zugleich das Feuerbild des Verses.
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: und die Wucht des Krieges
  rationale: עֱזוּז bezeichnet Stärke, Macht oder heftige Gewalt. „Wucht des Krieges“ ist im Deutschen natürlich, wahrt die substantivische Konstruktion und legt die genaue Art dieser Macht nicht unnötig fest.
- source_word: וַתְּלַהֲטֵהוּ מִסָּבִיב
  choice: Sie setzte ihn ringsum in Flammen
  rationale: Das Verb bezeichnet ein Aufflammen oder Inbrandsetzen; מִסָּבִיב bedeutet „ringsum, von allen Seiten“. Das feminine „sie“ kann sich im Deutschen auf die zuvor genannte Glut beziehungsweise Wucht als wirkende Gerichtsmacht beziehen.
- source_word: וְלֹא יָדָע
  choice: doch er erkannte es nicht
  rationale: ידע kann „wissen“, „erkennen“ oder „wahrnehmen“ bedeuten. Im Zusammenhang bezeichnet es das Ausbleiben der Einsicht in das Geschehen; „erkannte es nicht“ bleibt näher am Grundverb als „begriff es nicht“.
- source_word: וַתִּבְעַר בּוֹ
  choice: sie brannte in ihm
  rationale: בער bedeutet „brennen“; בּוֹ lautet formal „in ihm“, kann im Kontext aber auch die betroffene Person bezeichnen. Die Hauptfassung wahrt die Präposition, während eine Fußnote die mögliche Nuance nennt.
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: doch er nahm es sich nicht zu Herzen
  rationale: Die hebräische Wendung bedeutet wörtlich, etwas auf das Herz zu legen, und idiomatisch, es ernst zu nehmen oder zu beherzigen. Die deutsche Formulierung erhält das Herzbild.
theological_decisions:
- issue: Bezug der männlichen Singularformen
  choice: Die Einzahl „ihn/er“ bleibt erhalten und bezeichnet Israel beziehungsweise Jakob als personifiziertes Volk.
  alternative: Zur Verdeutlichung mit „sie/ihnen“ auf das Volk im Plural beziehen.
  rationale: Der hebräische Text verwendet durchgehend den Singular. Seine Beibehaltung wahrt die prophetische Personifikation, ohne sie stillschweigend aufzulösen.
- issue: Subjekt der Gerichtsverben
  choice: Im ersten Satz ist Gott das Subjekt; anschließend bezeichnet „sie“ die ausgegossene Glut beziehungsweise Kriegswucht als wirkende Macht.
  alternative: Gott auch bei den folgenden Verben ausdrücklich zum Subjekt machen oder die Verben unpersönlich wiedergeben.
  rationale: Der hebräische Text wechselt von Gottes Ausgießen zu femininen Singularverben für die Wirkung des Gerichts. Die deutsche Fassung bildet diesen Wechsel ab, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Feuerbildlichkeit und die personifizierende Einzahl des Hebräischen bleiben erhalten. „Wucht des Krieges“ vermeidet sowohl altertümliche Sprache als auch eine unnötige Festlegung von עֱזוּז auf bloße Gefühlsheftigkeit.
