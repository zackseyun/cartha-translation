review_pass:
  verdict: revise
  source_fidelity: 'Die Grundfassung gibt die Bilder und die Satzfolge des Hebräischen insgesamt genau wieder: Gott gießt die Glut seines Zorns und die Gewalt des Krieges über das personifizierte Israel aus; das Gericht entzündet es ringsum, wird nicht erkannt und nicht zu Herzen genommen. Die feminine Singularform der folgenden Verben lässt sich am sichersten auf „die Glut“ (חֵמָה) beziehen.'
  naturalness: 'Die Formulierung „Sie setzte ihn ringsum in Flammen“ ist nach der vorangehenden koordinierten Nominalgruppe („die Glut ... und die Wucht ...“) im Deutschen syntaktisch missverständlich: Ein Pronomen mit singularischem Verb kann nicht klar beide Substantive aufnehmen. Die explizite Wiederaufnahme „Die Glut“ beseitigt dies und macht zugleich den wahrscheinlichen Bezug der hebräischen femininen Singularverben deutlich.'
  terminology: „Glut seines Zorns“, „Wucht des Krieges“, „erkannte es nicht“ und „nahm es sich nicht zu Herzen“ sind für modernes Standarddeutsch angemessen und bewahren die Bildsprache sowie das Herzidiom. Die Singular-Personifikation Israels bleibt erhalten.
  issues:
  - severity: medium
    issue: Unklarer und im Deutschen kongruenzproblematischer Bezug von „Sie setzte“
    rationale: Nach „die Glut seines Zorns und die Wucht des Krieges“ legt die deutsche Koordination einen pluralischen Rückbezug nahe. Der hebräische feminine Singular verweist jedoch wahrscheinlich besonders auf חֵמָה („Glut/Zornesglut“). Eine explizite Wiederaufnahme vermeidet eine unnatürliche Konstruktion, ohne den Sinn zu verändern.
  - severity: low
    issue: Fußnote d bezeichnet eine nicht völlig wörtliche Fassung als wörtlich
    rationale: „doch“ und das ergänzte „es“ sind im Deutschen für den Zusammenhang sinnvoll, stehen aber nicht ausdrücklich im hebräischen Wortlaut. Die Fußnote sollte den idiomatischen Wortlaut ohne die adversative Ergänzung angeben.
