revisions:
- from: Da goss er über ihn[a] die Glut seines Zorns und die Wucht des Krieges[b] aus. Sie setzte ihn ringsum in Flammen, doch er erkannte es nicht; sie brannte in ihm[c], doch er nahm es sich nicht zu Herzen.[d]
  to: Da goss er die Glut seines Zorns und die Wucht des Krieges über ihn[a] aus. Die Glut setzte ihn ringsum in Flammen, doch er erkannte es nicht; sie brannte in ihm[c], doch er nahm es sich nicht zu Herzen.[d]
  rationale: Die Wiederholung von „Die Glut“ stellt den im Hebräischen femininen Singular der Verben natürlich dar und verhindert, dass das deutsche „sie“ fälschlich oder ungrammatisch auf die koordinierte Doppelgruppe bezogen wird. Die Fußnote zum Herzidiom wurde geringfügig präzisiert. Die nicht im Text verankerte Fußnote b bleibt als lexikalische Alternative erhalten, auch wenn sie im Vers keine eigene Markierung trägt.
