base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
translation:
  language: de
  text: Sie sollen Jahwe[a] die Ehre geben[b] und sein Lob in den Küstenländern[c] verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Jahwe Ehre zuschreiben“. Das hebräische Verb bedeutet wörtlich „setzen“ oder „stellen“ und wird hier idiomatisch gebraucht.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich auch: „auf den Inseln“. Der Ausdruck bezeichnet bei Jesaja häufig weiter gefasst ferne Insel- und Küstengebiete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: sie sollen … geben
  rationale: שׂים bedeutet wörtlich „setzen/stellen“, bildet hier mit כָּבוֹד und לַיהוָה jedoch die idiomatische Wendung „jemandem Ehre geben/zuschreiben“. „Sie sollen“ gibt den auffordernden Sinn des Imperfekts im Zusammenhang wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger der Ehre; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: כָּבוֹד kann „Herrlichkeit“ oder „Ehre“ bedeuten. In der Verbindung „jemandem כָּבוֹד geben“ ist „Ehre geben“ im Deutschen natürlich und sachlich genau.
- source_word: וּתְהִלָּתוֹ
  choice: und … sein Lob
  rationale: תְּהִלָּה bezeichnet Lob beziehungsweise Lobpreis; das Suffix der 3. Person Singular wird mit „sein“ wiedergegeben.
- source_word: בָּאִיִּים
  choice: in den Küstenländern
  rationale: אִיִּים kann wörtlich Inseln bezeichnen, steht bei Jesaja aber häufig weiter gefasst für ferne Insel- und Küstengebiete. Die Präposition ב wird mit „in“ wiedergegeben.
- source_word: יַגִּידוּ
  choice: sie sollen … verkünden
  rationale: Der Hifil von נגד bedeutet „kundtun, verkünden“. „Verkünden“ entspricht dem öffentlichen, feierlichen Charakter des poetischen Aufrufs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht diesen Namen im Haupttext sichtbar; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Auffordernder oder feststellender Sinn der Verbformen
  choice: Sie sollen … geben und … verkünden
  alternative: Sie werden … geben und … verkünden
  rationale: Die parallelen Imperfektformen stehen im Zusammenhang des vorausgehenden Aufrufs zum Lob und lassen sich daher am besten auffordernd verstehen. Die formal mögliche futurische beziehungsweise feststellende Lesart bleibt als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Die Satzstellung bleibt klar und gut vorlesbar; „Ehre geben“ und „Lob verkünden“ bewahren die beiden hebräischen Aussagen, ohne sie zu verschmelzen.
