  text: אֲנִ֥י יְהוָ֖ה ה֣וּא שְׁמִ֑/י וּ/כְבוֹדִ/י֙ לְ/אַחֵ֣ר לֹֽא אֶתֵּ֔ן וּ/תְהִלָּתִ֖/י לַ/פְּסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: de
  text: Ich bin Jahwe; das ist mein Name. Meine Herrlichkeit werde ich keinem anderen geben und mein Lob nicht den Götzenbildern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mein Lob nicht den geschnitzten Bildern“. Das hebräische Wort bezeichnet gefertigte, besonders geschnitzte Kultbilder; „Götzenbilder“ gibt die Bedeutung im Zusammenhang wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: הוּא שְׁמִי
  choice: das ist mein Name
  rationale: Das Pronomen hat hier identifizierende und hervorhebende Funktion; diese Wiedergabe ist natürlich und bewahrt den Sinn.
- source_word: כְבוֹדִי
  choice: meine Herrlichkeit
  rationale: כָּבוֹד bezeichnet hier Gottes Herrlichkeit beziehungsweise Ehre; „Herrlichkeit“ entspricht dem feierlichen theologischen Kontext.
- source_word: לְאַחֵר
  choice: keinem anderen
  rationale: Im Deutschen verlangt die durch לֹא verneinte Aussage idiomatisch „keinem anderen“; der exklusive Kontrast bleibt erhalten.
- source_word: אֶתֵּן
  choice: gebe ich
  rationale: Das hebräische Imperfekt kann hier Gottes feste, fortdauernde Entschlossenheit ausdrücken. Das deutsche Präsens formuliert diese grundsätzliche Weigerung natürlich.
- source_word: תְהִלָּתִי
  choice: meinen Ruhm
  rationale: תְּהִלָּה kann sowohl das Gott dargebrachte Lob als auch seinen Ruhm bezeichnen. „Ruhm“ ist im parallelen deutschen Satz natürlich; die Alternative „Lobpreis“ wird in der Fußnote genannt.
- source_word: לַפְּסִילִים
  choice: den Götzenbildern
  rationale: פְּסִילִים bezeichnet gefertigte, besonders geschnitzte Kultbilder. „Götzenbilder“ gibt sowohl den gegenständlichen als auch den kultischen Bezug wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt dies, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תְהִלָּתִי
  choice: meinen Ruhm
  alternative: meinen Lobpreis; das mir gebührende Lob
  rationale: Die knappe possessive Form wird ohne erklärende Erweiterung bewahrt. Da sowohl „Ruhm“ als auch empfangener Lobpreis möglich sind, nennt die Fußnote die sachlich wichtige Alternative.
- issue: Referenz von אַחֵר
  choice: keinem anderen
  alternative: keinem anderen Gott
  rationale: Der hebräische Text nennt den anderen nicht ausdrücklich. Die offene Formulierung bewahrt diese Kürze und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Der Eigenname „Jahwe“ bleibt sichtbar; die genuine Bedeutungsbreite von תְהִלָּה und פְּסִילִים wird durch die Fußnote offengehalten.
