    rationale: „Ruhm“ bezeichnet im heutigen Deutsch vor allem Ansehen oder Bekanntheit. תְהִלָּה meint hier im Parallelismus mit der nicht abtretbaren Herrlichkeit das Lob, das Yahweh gebührt bzw. ihm gilt. „mein Lob“ ist näher am hebräischen Lexem und natürlicher als „mein Lobpreis“.
