id: ISA.42.24
reference: Isaiah 42:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: de
  text: Wer gab Jakob der Plünderung preis[a] und Israel den Plünderern? War es nicht Jahwe, gegen den wir gesündigt haben? Sie wollten nicht auf seinen Wegen gehen und hörten nicht auf seine Weisung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „zur Plünderung“ und „den Plünderern“. Die Zeile schildert Jakob und Israel als zur Ausplünderung Preisgegebene.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Gesetz“. Das hebräische Wort Tora kann „Weisung“, „Lehre“ oder „Gesetz“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: der Plünderung preis
  rationale: Die Wendung bezeichnet das Ausgeliefertsein zur Plünderung. „Der Plünderung preisgeben“ ist im Deutschen natürlich und bewahrt das Bild, dass Jakob anderen zum Ausrauben überlassen wurde.
- source_word: לְ/בֹזְזִים
  choice: den Plünderern
  rationale: Das Partizip von בזז bezeichnet Menschen, die Beute rauben. „Plünderer“ gibt den feindlichen Handlungsträger präzise wieder und steht parallel zu „Plünderung“.
- source_word: הֲ/לֹא יְהוָה
  choice: War es nicht Jahwe
  rationale: Die rhetorische Frage erwartet Zustimmung. Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich stehende Eigenname erhalten bleibt.
- source_word: זוּ
  choice: er, gegen den
  rationale: זוּ leitet hier relativisch die Aussage über den ein, gegen den gesündigt wurde. Das vorangestellte „er“ erhält die formale Hervorhebung des hebräischen Ausdrucks.
- source_word: חָטָאנוּ לּוֹ
  choice: gegen den wir gesündigt haben
  rationale: חטא mit ל bezeichnet hier das Sündigen gegen jemanden. Das Perfekt wird mit gegenwärtiger Relevanz als „gesündigt haben“ wiedergegeben.
- source_word: וְלֹא אָבוּ
  choice: Sie wollten nicht
  rationale: אבה bezeichnet Willigkeit beziehungsweise deren Verweigerung. „Sie wollten nicht“ bewahrt diese Nuance, ohne die Aussage stärker als ausdrückliche Weigerung zu formulieren.
- source_word: בִדְרָכָיו הָלוֹךְ
  choice: auf seinen Wegen gehen
  rationale: Die hebräische Wegmetapher für Lebensführung bleibt erhalten und ist auch im heutigen Deutschen verständlich.
- source_word: בְּתוֹרָתוֹ
  choice: auf seine Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder Weisung bezeichnen. „Weisung“ wahrt hier die Breite des Begriffs; „Gesetz“ bleibt eine mögliche kontextuelle Wiedergabe.
- source_word: שָׁמְעוּ
  choice: hörten nicht auf
  rationale: שׁמע umfasst Hören und das daraus folgende Gehorchen. Die deutsche Wendung „auf etwas hören“ lässt beide Aspekte anklingen.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jakob … Israel
  rationale: Die beiden Namen bleiben erhalten, um den poetischen Parallelismus und die Bundesidentität des Volkes wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel von der ersten Person Plural zu der dritten Person Plural
  choice: „wir haben gesündigt“; danach „sie wollten nicht … und hörten nicht“
  alternative: Alle Aussagen zur stilistischen Glättung in die erste Person setzen
  rationale: Der hebräische Text wechselt unvermittelt von gemeinschaftlichem Bekenntnis zur Rede über das Volk. Dieser echte Spannungs- und Perspektivwechsel wird nicht harmonisiert.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ lässt den weiteren Bedeutungsumfang des hebräischen Wortes offen und vermeidet, es ohne Not ausschließlich auf kodifiziertes Gesetz zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität der Namen und der Wegmetapher bleibt erhalten. Die markante Apposition „er, gegen den“ bildet die Hervorhebung durch זוּ ab; der Wechsel von „wir“ zu „sie“ wird bewusst nicht geglättet.
