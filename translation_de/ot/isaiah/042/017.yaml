source:
  edition: WLC
  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: de
  text: 'Sie werden zurückweichen[a]; sie werden völlig zuschanden werden[b] – diejenigen, die auf ein Götzenbild vertrauen und zu einem Gussbild[c] sagen: »Ihr seid unsere Götter!«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Sie sind zurückgewichen“ oder „sie werden zurückgetrieben“. Die hebräische Form kann ein Zurückweichen als bereits feststehend darstellen; das Verb kann je nach Zusammenhang ein eigenes Zurückweichen oder ein Zurückgedrängtwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine verstärkende Verbindung wie „sie werden Schande erfahren“ beziehungsweise „sie werden beschämt sein“.
    reason: lexical_alternative
  - marker: c
    text: Für „Götzenbild“ kann auch „Schnitzbild“ stehen; „Gussbild“ bezeichnet ein gegossenes, meist metallenes Bild. Das Hebräische gebraucht zwei verschiedene Wörter für hergestellte Kultbilder.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich im Plural: „Ihr seid unsere Götter.“ Manche Übersetzungen gleichen die Anrede an das einzelne Bild zum Singular „Du bist unser Gott“ an.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: sie werden zurückweichen
  rationale: Das Qal von נסג bezeichnet ein Zurückweichen oder Sich-zurückziehen; אָחוֹר verstärkt die Richtung. Im Zusammenhang der angekündigten Beschämung gibt das deutsche Futur den prophetischen Gerichtston natürlich wieder, während eine Fußnote die aspektuelle und semantische Offenheit bewahrt.
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: völlig zuschanden werden
  rationale: Verb und stammverwandtes Substantiv bilden im Hebräischen eine emphatische Fügung. „Völlig zuschanden werden“ überträgt die Verstärkung in würdiges, heutiges Deutsch, ohne die unnatürliche Form „mit Schande beschämt werden“ nachzubilden.
- source_word: הַבֹּטְחִים
  choice: alle, die … vertrauen
  rationale: Das substantivierte Partizip bezeichnet die betreffende Menschengruppe aufgrund ihres fortdauernden Vertrauens. „Alle, die“ schließt natürlich an den vorhergehenden Plural an.
- source_word: בַּפָּסֶל
  choice: auf ein Götzenbild
  rationale: פֶּסֶל bezeichnet ein zur Verehrung hergestelltes Bild, häufig ein Schnitzbild. „Götzenbild“ macht hier seine religiöse Funktion deutlich; die generische Aussage wird im Deutschen mit dem unbestimmten Artikel wiedergegeben.
- source_word: לְמַסֵּכָה
  choice: zu einem Gussbild
  rationale: מַסֵּכָה bezeichnet hier ein gegossenes, gewöhnlich metallenes Kultbild. „Gussbild“ ist knapp und hält diesen Herstellungshinweis gegenüber dem allgemeineren „Götzenbild“ fest.
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: Ihr seid unsere Götter
  rationale: Sowohl das Pronomen אַתֶּם als auch אֱלֹהֵינוּ sind morphologisch plural. Die deutsche Wiedergabe erhält diesen Numerus, statt ihn wegen des unmittelbar zuvor genannten einzelnen Gussbildes zum Singular zu glätten.
theological_decisions:
- issue: Unterscheidung der beiden Bezeichnungen für Kultbilder פֶּסֶל und מַסֵּכָה
  choice: „Götzenbild“ und „Gussbild“ werden unterschieden.
  alternative: Beide Wörter könnten allgemein mit „Götzenbild“ oder stärker herstellungsbezogen mit „Schnitzbild“ und „gegossenem Bild“ wiedergegeben werden.
  rationale: Die gewählte Fassung bewahrt sowohl die religiös-polemische Funktion von פֶּסֶל als auch den Herstellungshinweis in מַסֵּכָה, ohne eine bestimmte Herstellungsweise für פֶּסֶל im Haupttext stärker festzulegen, als der Kontext verlangt.
- issue: Numerus in der Rede an das Gussbild
  choice: Der Plural „Ihr seid unsere Götter“ bleibt erhalten.
  alternative: 'Eine geglättete Fassung könnte lauten: „Du bist unser Gott.“'
  rationale: Der hebräische Text verwendet ausdrücklich ein Pronomen der zweiten Person Plural und das pluralisch markierte „unsere Götter“. Die Spannung zwischen dem einzelnen Gussbild und der pluralischen Anrede wird nicht harmonisiert.
- issue: Zeit- und Handlungswert von נָסֹגוּ
  choice: Als zukünftiges Zurückweichen im angekündigten Gericht wiedergegeben.
  alternative: „Sie sind zurückgewichen“ oder resultativ „Sie werden zurückgetrieben“.
  rationale: Die folgende Imperfektform und der Kontext der Gerichtsankündigung stützen eine futurische Wiedergabe. Da die Perfektform und das Verb selbst mehrere Nuancen zulassen, nennt die Fußnote die echte Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Zuschanden werden“ ist gehoben, aber weiterhin geläufig und bildet die öffentliche Beschämung treffender ab als das schwächere „sich schämen“. Der Gedankenstrich hebt die nachgestellte Bestimmung der Betroffenen hervor; die direkte Rede bewahrt den auffälligen Plural des Ausgangstextes.
