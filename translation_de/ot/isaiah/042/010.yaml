source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: de
  text: Singt Jahwe ein neues Lied, seinen Lobpreis vom Ende der Erde her, ihr, die ihr zum Meer hinabfahrt, und alles, was es erfüllt, ihr Inseln[a] und ihre Bewohner!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Küstenländer“. Das hebräische Wort kann Inseln oder weiter gefasst ferne Küstengebiete bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der Imperativ Plural fordert unmittelbar zum Lobgesang auf; „Singt“ ist im Deutschen schlicht und natürlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und damit als Eigenname erkennbar gehalten.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Die geläufige hebräische Wortverbindung lässt sich formal und idiomatisch so wiedergeben.
- source_word: תְּהִלָּתוֹ
  choice: seinen Lobpreis
  rationale: „Lobpreis“ bezeichnet hier das auf ihn gerichtete Lob und bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: מִקְצֵה הָאָרֶץ
  choice: vom Ende der Erde her
  rationale: Die singularische Form „vom Ende der Erde“ wird bewahrt; „her“ verdeutlicht im Deutschen, dass der Lobpreis von dort erschallen soll.
- source_word: יוֹרְדֵי הַיָּם
  choice: die ihr zum Meer hinabfahrt
  rationale: Die partizipiale Anrede wird beibehalten. „Hinabfahrt“ gibt den idiomatischen Bezug auf Seefahrende natürlich wieder, ohne ihn auf ein bloßes Substantiv zu verkürzen.
- source_word: וּמְלֹאוֹ
  choice: und alles, was es erfüllt
  rationale: Die Wendung bezeichnet die Fülle des Meeres beziehungsweise alles, was darin ist; die Formulierung bleibt nahe am Bild des Ausgangstextes.
- source_word: אִיִּים
  choice: die Inseln
  rationale: Das Wort kann Inseln wie auch ferne Küstenländer bezeichnen. „Inseln“ ist hier eine direkte, gut verständliche Wiedergabe; die weitere Bedeutung wird in der Fußnote genannt.
- source_word: וְיֹשְׁבֵיהֶם
  choice: und ihre Bewohner
  rationale: Die kompakte deutsche Form entspricht den dort Wohnenden und hält den Pluralbezug auf die Inseln beziehungsweise Küstenländer fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der poetische Aufruf und die weite geografische Perspektive bleiben erhalten; der Satz wird als ein zusammenhängender Imperativ gestaltet.
