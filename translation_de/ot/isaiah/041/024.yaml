id: ISA.41.24
reference: Isaiah 41:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵן אַתֶּ֣ם מֵ/אַ֔יִן וּ/פָעָלְ/כֶ֖ם מֵ/אָ֑פַע תּוֹעֵבָ֖ה יִבְחַ֥ר בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: de
  text: Seht, ihr seid nichts, und euer Werk ist weniger als nichts.[a] Wer euch wählt, ist ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des seltenen hebräischen Wortes ist unsicher; auch möglich: »aus dem Nichtsein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die hinweisende Interjektion leitet einen nachdrücklichen Ausspruch ein. »Seht« gibt ihre Kraft in natürlichem, nicht altertümlichem Deutsch wieder.
- source_word: מֵאַיִן
  choice: nichts
  rationale: Im Zusammenhang der Polemik gegen die Götzen bezeichnet die Wendung ihre Nichtigkeit. Das idiomatische »ihr seid nichts« ist im Deutschen klarer als das formale, aber missverständliche »ihr seid aus nichts«.
- source_word: וּפָעָלְכֶם
  choice: und euer Werk
  rationale: »Werk« bewahrt die Bedeutungsbreite des hebräischen Ausdrucks, der sowohl das Wirken als auch dessen Ergebnis bezeichnen kann.
- source_word: מֵאָפַע
  choice: weniger als nichts
  rationale: Das seltene und schwierige Wort steht parallel zu מֵאַיִן und steigert im Kontext die Aussage von Nichtigkeit. Die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: תּוֹעֵבָה
  choice: ein Gräuel
  rationale: »Gräuel« bewahrt die starke religiöse und moralische Abscheu des hebräischen Begriffs und ist in biblisch-würdigem Deutsch weiterhin verständlich.
- source_word: יִבְחַר בָּכֶם
  choice: Wer euch wählt
  rationale: Der generische Singular wird im Deutschen natürlich mit »wer« wiedergegeben; die Verbindung des Verbs mit ב bezeichnet hier die Wahl beziehungsweise Bevorzugung der angesprochenen Götzen.
theological_decisions:
- issue: Bezug der Pronomen in der zweiten Person Plural
  choice: Die Anrede gilt den im Kontext herausgeforderten Götzen beziehungsweise Göttern.
  alternative: Die Anrede könnte metonymisch auf die Hersteller der Götzen bezogen werden.
  rationale: Der unmittelbare Zusammenhang fordert die Götter der Völker auf, etwas anzukündigen und zu vollbringen; der Schlusssatz verurteilt diejenigen, die sie wählen. Die direkte Wiedergabe der Pronomen erhält diese prophetische Verspottung, ohne den Bezug im Haupttext erklärend festzulegen.
- issue: Satzfunktion von תּוֹעֵבָה im Schlusssatz
  choice: »ein Gräuel« ist die vorangestellte Prädikatsbestimmung zu dem, der die Götzen wählt.
  alternative: Das Substantiv könnte aufgrund der markierten Wortstellung enger mit dem Wahlvorgang oder den Gewählten verbunden verstanden werden.
  rationale: 'Die natürliche Analyse des verblosen Nominalsatzes lautet: »Ein Gräuel ist, wer euch wählt.« Die deutsche Wortfolge »Wer euch wählt, ist ein Gräuel« macht diese Aussage verständlich, ohne ihre Schärfe abzuschwächen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Zuspitzung »nichts … weniger als nichts« bleibt erhalten; »Gräuel« trägt bewusst die starke Wertung des Ausgangstextes.
