source:
  edition: WLC
  text: כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מַחֲזִ֣יק יְמִינֶ֑/ךָ הָ/אֹמֵ֥ר לְ/ךָ֛ אַל תִּירָ֖א אֲנִ֥י עֲזַרְתִּֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: de
  text: 'Denn ich bin Jahwe, dein Gott, der deine rechte Hand ergreift und zu dir sagt: »Fürchte dich nicht! Ich werde dir helfen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann die hebräische Perfektform auch heißen: »Ich habe dir geholfen« oder »Ich half dir«. Hier ist sie wegen des Zusammenhangs als gewisse Zusage wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Ermutigung und wird im Deutschen natürlich mit »Denn« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die direkte Anrede und die possessive, auf die Bundesbeziehung bezogene Form bleiben erhalten.
- source_word: מַחֲזִיק
  choice: der … ergreift
  rationale: Das Hifil-Partizip von חזק bezeichnet hier das feste Ergreifen beziehungsweise Halten der Hand. »Ergreift« bewahrt das konkrete Bild und lässt sich im Deutschen natürlich mit dem folgenden Relativsatz verbinden.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Die konkrete Körpermetapher wird ohne Verallgemeinerung beibehalten.
- source_word: הָאֹמֵר לְךָ
  choice: und zu dir sagt
  rationale: Das artikulierte Partizip beschreibt Jahwe weiter. Die koordinierte Wiedergabe mit »und« vermeidet im Deutschen eine schwerfällige Wiederholung von »der«.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht!
  rationale: Dies ist eine klare und würdige Wiedergabe des negierten Imperfekts mit Aufforderungsfunktion.
- source_word: עֲזַרְתִּיךָ
  choice: Ich werde dir helfen
  rationale: Die Form ist morphologisch ein Perfekt, hat in dieser göttlichen Zusage jedoch plausibel vergewissernde beziehungsweise zukunftsgerichtete Kraft. Das deutsche Futur gibt den Verheißungscharakter verständlich wieder; die formale Mehrdeutigkeit wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Umschrift »Jahwe« wahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeit- und Aspektwert von עֲזַרְתִּיךָ
  choice: 'zukunftsgerichtete Zusage: »Ich werde dir helfen«'
  alternative: »Ich habe dir geholfen«; »Ich helfe dir«
  rationale: Das hebräische Perfekt lässt die Aussage formal als vollendete Handlung erscheinen, kann hier aber die Gewissheit göttlicher Hilfe ausdrücken. Im Zusammenhang mit »Fürchte dich nicht« vermittelt das deutsche Futur den Verheißungscharakter am natürlichsten, während die Fußnote die formale Lesart offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Rede. Das konkrete Bild des Ergreifens der rechten Hand bleibt erhalten; der Satzbau ist für heutige Leser geglättet, ohne die wiederholte persönliche Anrede abzuschwächen.
