  source_fidelity: Die Übersetzung gibt die Begründung כִּי, den Gottesnamen, die direkte Anrede, das konkrete Bild der rechten Hand sowie die Zusage zuverlässig wieder. »der deine rechte Hand ergreift« bildet das Hifil-Partizip מַחֲזִיק idiomatisch und bildhaft angemessen ab. Das Futur in »Ich werde dir helfen« ist im Kontext der Ermutigung eine gut begründete Wiedergabe von עֲזַרְתִּיךָ; die formale Perfektlesart bleibt in der Fußnote transparent.
