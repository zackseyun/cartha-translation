  terminology: »Jahwe« gibt יהוה als Eigenname angemessen wieder. »dein Gott«, »rechte Hand«, »Fürchte dich nicht« und »helfen« sind terminologisch präzise und registergerecht. Die Fußnote beschreibt die morphologische und kontextuelle Spannung ohne eine einseitige dogmatische Festlegung.
