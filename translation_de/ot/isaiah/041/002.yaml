source:
  edition: WLC
  text: מִ֤י הֵעִיר֙ מִ/מִּזְרָ֔ח צֶ֖דֶק יִקְרָאֵ֣/הוּ לְ/רַגְל֑/וֹ יִתֵּ֨ן לְ/פָנָ֤י/ו גּוֹיִם֙ וּ/מְלָכִ֣ים יַ֔רְדְּ יִתֵּ֤ן כֶּֽ/עָפָר֙ חַרְבּ֔/וֹ כְּ/קַ֥שׁ נִדָּ֖ף קַשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: de
  text: Wer hat vom Osten her einen erweckt, den er in Gerechtigkeit zu sich ruft?[a] Er gibt Völker vor ihm preis und unterwirft ihm Könige.[b] Durch sein Schwert macht er sie zu Staub, durch seinen Bogen zu verwehten Stoppeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wortgruppe ist schwierig. Wörtlich etwa: „den Gerechtigkeit zu seinem Fuß ruft“. Auch eine Deutung im Sinn von „den er zum Sieg ruft“ oder „dem Gerechtigkeit bzw. Sieg auf Schritt und Tritt folgt“ ist möglich. Das mit „Gerechtigkeit“ wiedergegebene Wort kann hier auch Recht oder Sieg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung ist syntaktisch schwierig. Möglich sind auch: „und lässt ihn über Könige herrschen“ oder „und lässt ihn Könige niedertreten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵעִיר
  choice: erweckt
  rationale: Das Hifil bezeichnet hier das Erwecken oder Aufbieten eines Menschen zum Handeln. „Erweckt“ bewahrt den kausativen Sinn und den gehobenen prophetischen Ton.
- source_word: מִמִּזְרָח
  choice: vom Osten her
  rationale: מִזְרָח bezeichnet den Ort des Sonnenaufgangs und damit idiomatisch den Osten. „Vom Osten her“ ist im Deutschen geografisch klar und natürlich.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Das Wort kann Gerechtigkeit, Recht, Rechtfertigung beziehungsweise siegreiche Durchsetzung bezeichnen. „Gerechtigkeit“ bewahrt den lexikalischen Kern, ohne die Stelle vorschnell allein auf Sieg festzulegen.
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: den … auf Schritt und Tritt ruft
  rationale: Wörtlich steht eine schwierige Verbindung aus „ihn rufen“ und „zu seinem Fuß“. Die deutsche Wendung „auf Schritt und Tritt“ nimmt das Fußbild auf und lässt offen, ob Gerechtigkeit ihn begleitet, ihm begegnet oder ihn zum Handeln ruft.
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: Er gibt Völker vor ihm preis
  rationale: נתן mit לְפָנָיו beschreibt die Auslieferung beziehungsweise Übergabe der Völker vor dem Eroberer. „Preisgeben“ gibt diesen Sinn im Deutschen klar wieder.
- source_word: וּמְלָכִים יַרְדְּ
  choice: und unterwirft ihm Könige
  rationale: Die Form und Satzkonstruktion sind schwierig; im Zusammenhang geht es am ehesten darum, dass Könige unter die Herrschaft des Erweckten gebracht werden. Die Ergänzung „ihm“ macht den Bezug im Deutschen verständlich, ohne den Eroberer zu benennen.
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: Sein Schwert macht sie zu Staub
  rationale: Die nachgestellte Waffe lässt sich als Subjekt verstehen; נתן kann hier resultativ „zu etwas machen“ ausdrücken. Das ergänzte „sie“ bezieht sich auf Völker und Könige.
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: sein Bogen zu verwehten Stoppeln
  rationale: קַשׁ bezeichnet Stroh oder Stoppeln, נִדָּף etwas Fortgetriebenes beziehungsweise Verwehtes. Die elliptische Parallelkonstruktion zum Schwertsatz bleibt erhalten.
theological_decisions:
- issue: Identität des vom Osten her Erweckten
  choice: Die Gestalt bleibt im Vers unbenannt.
  alternative: Kyros, Abraham oder ein idealisierter, von Gott berufener Eroberer ausdrücklich nennen.
  rationale: Der hebräische Vers identifiziert die Person nicht ausdrücklich. Eine Namensnennung im Haupttext würde eine Auslegung festschreiben, die der Vers selbst offenlässt.
- issue: Bedeutung von צֶדֶק im Zusammenhang des Sieges
  choice: Im Haupttext steht „Gerechtigkeit“, mit Alternativen in der Fußnote.
  alternative: Ausschließlich „Sieg“, „Recht“ oder „Heil“ übersetzen.
  rationale: Der Begriff verbindet hier möglicherweise gerechtes Handeln, Rechtfertigung und siegreiche Durchsetzung. Die Übersetzung soll diese theologische und lexikalische Spannung nicht auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischem Klang. Ungewöhnliche Bilder des Hebräischen werden soweit möglich bewahrt, aber schwierige Syntax wird in verständliche deutsche Satzführung überführt. Die Fußnoten kennzeichnen echte lexikalische und syntaktische Mehrdeutigkeit.
