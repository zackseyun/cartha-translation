  - severity: medium
    issue: „Sein Schwert macht sie zu Staub, sein Bogen zu verwehten Stoppeln“ verändert die Satzstruktur, indem Schwert und Bogen als Subjekte auftreten.
    rationale: יִתֵּן wird im Vers dreimal verwendet und ist am besten mit dem Handelnden der vorangehenden Aussage zu verbinden. Die Waffen bezeichnen das Mittel, durch das die Völker und Könige Staub beziehungsweise verwehte Stoppeln werden.
  - severity: low
    issue: Die Fußnote zu a enthält die alternative Aussage „dem Sieg auf Schritt und Tritt begegnet“, die weder als klare Übersetzungsalternative noch als Erklärung der hebräischen Syntax hinreichend präzise ist.
    rationale: Die Anmerkung sollte transparent erklären, dass sowohl die Satzgliederung als auch die Bedeutungsnuance von צדק unsicher sind.
