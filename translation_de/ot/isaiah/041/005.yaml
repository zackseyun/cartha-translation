base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: de
  text: Die Küstenländer[a] sahen und fürchteten sich; die Enden der Erde zitterten. Sie näherten sich und kamen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Inseln“ beziehungsweise „die fernen Küstengebiete“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die beiden letzten Verben stehen im Hebräischen eng nebeneinander und betonen die Bewegung: „Sie näherten sich und kamen.“'
    reason: literary_feature
lexical_decisions:
- source_word: אִיִּים
  choice: Küstenländer
  rationale: Der Ausdruck bezeichnet in Jesaja häufig Inseln, Küstengebiete oder ferne Länder jenseits des Meeres. „Küstenländer“ wahrt den geografischen Horizont, ohne ihn auf einzelne Inseln zu beschränken.
- source_word: רָאוּ
  choice: sahen es
  rationale: Das hebräische Verb nennt kein ausdrückliches Objekt. Im Deutschen macht das unbetonte „es“ den Satz natürlich verständlich, ohne festzulegen, was genau die fernen Länder gesehen haben.
- source_word: וְיִירָאוּ
  choice: und fürchteten sich
  rationale: ירא bezeichnet hier angesichts des Zusammenhangs eine Reaktion der Angst, nicht ausdrücklich ehrfürchtige Anbetung.
- source_word: קְצוֹת הָאָרֶץ
  choice: die Enden der Erde
  rationale: Die feste hebräische Wendung meint die fernsten Gegenden der Welt; die entsprechende deutsche Wendung ist prägnant und geläufig.
- source_word: יֶחֱרָדוּ
  choice: erbebten
  rationale: חרד verbindet körperliches Zittern mit Furcht und Erschütterung. „Erbebten“ erhält beide Aspekte und den gehobenen prophetischen Ton.
- source_word: קָרְבוּ
  choice: Sie näherten sich
  rationale: Das Verb bezeichnet eine Bewegung auf etwas oder jemanden zu. Die Übersetzung lässt wie der hebräische Text das Ziel offen.
- source_word: וַיֶּאֱתָיוּן
  choice: und kamen
  rationale: Das poetische Verb bedeutet „kommen“. Die knappe Wiederholung neben „sich nähern“ wird bewusst bewahrt.
theological_decisions:
- issue: Art der Reaktion der fernen Völker
  choice: Furcht und Erschütterung werden benannt, doch Zweck und Haltung ihres Näherkommens bleiben offen.
  alternative: Das Näherkommen als ehrfürchtige Unterwerfung oder als feindlichen Zusammenschluss ausdrücklich deuten.
  rationale: Der Vers beschreibt Angst, Beben und Bewegung, legt aber für sich genommen weder Umkehr und Anbetung noch Feindseligkeit eindeutig fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die Wiederholung am Versende und die offene Zielrichtung des Näherkommens bleiben erhalten.
