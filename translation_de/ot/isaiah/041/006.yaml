base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/006.yaml
  text: Each man helps his neighbor[a], and says to his brother[b], “Be strong!”
translation:
  language: de
  text: 'Jeder hilft seinem Nächsten[a] und sagt zu seinem Bruder[b]: »Sei stark!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinem Gefährten« oder »seinem Freund«.'
    reason: lexical_alternative
  - marker: b
    text: »Bruder« kann hier auch einen Verwandten oder ein Mitglied derselben Gemeinschaft bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶת רֵעֵהוּ
  choice: Einer hilft dem anderen
  rationale: Die Verbindung aus dem singularischen אִישׁ, dem Ausdruck רֵעֵהוּ und dem pluralischen Verb beschreibt wechselseitiges beziehungsweise verteilendes Handeln. Die idiomatische deutsche Wendung bewahrt diesen Sinn, ohne רֵעַ unnötig auf »Freund« oder »Nachbar« einzuengen.
- source_word: יַעְזֹרוּ
  choice: hilft
  rationale: Das Imperfekt schildert hier das Geschehen anschaulich; das deutsche Präsens passt zum Kontext. Der Singular richtet sich nach der distributiven Formulierung »Einer … dem anderen«.
- source_word: וּלְאָחִיו
  choice: und sagt zu seinem Bruder
  rationale: אָח bedeutet unmittelbar »Bruder«, kann im Zusammenhang jedoch auch einen Verwandten oder Zugehörigen bezeichnen. Die direkte Wiedergabe wahrt das Parallelgefüge.
- source_word: יֹאמַר
  choice: sagt
  rationale: Wie beim vorausgehenden Verb gibt das Präsens die anschauliche Darstellung des hebräischen Imperfekts natürlich wieder.
- source_word: חֲזָק
  choice: Sei stark!
  rationale: Der Imperativ von חזק fordert zu Stärke und Entschlossenheit auf. »Sei stark!« ist knapp, direkt und wahrt die Aufforderungskraft.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die reziproke Wendung »Einer … dem anderen« bildet die hebräische distributive Konstruktion natürlich ab; die direkte Rede bleibt markant und eindringlich.
