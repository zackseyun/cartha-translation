source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: de
  text: 'Der Handwerker stärkt den Metallarbeiter; wer mit dem Hammer glättet, stärkt den, der auf den Amboss schlägt, und sagt von der Lötverbindung[a]: »Sie ist gut.« Dann befestigt er es mit Nägeln, damit es nicht wankt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von der Verbindung«, »vom Lot«; weniger wahrscheinlich: »vom Klebstoff«. Das hebräische Wort kann den Stoff oder den Vorgang bezeichnen, durch den das Werkstück zusammengefügt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »damit es nicht verrückt wird« oder »damit es nicht umkippt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: stärkt
  rationale: Das Piel von חזק bezeichnet hier das Stärken oder Unterstützen. »Stärkt« bewahrt sowohl die praktische Zusammenarbeit als auch den möglichen Unterton gegenseitiger Ermutigung.
- source_word: חָרָשׁ
  choice: Handwerker
  rationale: Der Ausdruck bezeichnet allgemein einen kundigen Handwerker; die breite Wiedergabe erhält die Unterscheidung zum folgenden Metallarbeiter.
- source_word: צֹרֵף
  choice: Metallarbeiter
  rationale: Das Partizip bezeichnet einen Schmelzer oder Läuterer von Metall. »Metallarbeiter« passt zum Herstellungsvorgang, ohne das Material auf Gold festzulegen.
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: wer mit dem Hammer glättet
  rationale: Die verbale Formulierung gibt die Tätigkeit natürlich wieder und versteht חלק im Zusammenhang der Metallbearbeitung als Glätten.
- source_word: הוֹלֶם פָּעַם
  choice: der auf den Amboss schlägt
  rationale: הלם bezeichnet das Schlagen; פעם wird im Werkstattzusammenhang plausibel als Amboss beziehungsweise Schlagfläche verstanden.
- source_word: לַדֶּבֶק
  choice: von der Lötverbindung
  rationale: דבק kann hier den Stoff oder Vorgang des Zusammenfügens bezeichnen. Im metallhandwerklichen Kontext bringt »Lötverbindung« diese Bedeutung konkret zum Ausdruck, ohne die bestehende lexikalische Unsicherheit zu verschweigen.
- source_word: טוֹב הוּא
  choice: Sie ist gut
  rationale: Das Pronomen wird im Deutschen auf die feminine »Lötverbindung« bezogen; die schlichte Qualitätsaussage des Hebräischen bleibt erhalten.
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: Dann befestigt er es mit Nägeln
  rationale: Die zweite Verwendung von חזק bezeichnet das konkrete Sichern des gefertigten Gegenstands. »Befestigt« ist dafür idiomatisch und präzise.
- source_word: לֹא יִמּוֹט
  choice: damit es nicht wankt
  rationale: מוט im Nifal kann wanken, ins Rutschen geraten oder umstürzen bedeuten. »Wankt« erhält den ironischen Gedanken eines Gegenstands, der eigens stabilisiert werden muss, ohne das vollständige Umstürzen vorauszusetzen.
theological_decisions:
- issue: Darstellung der Götzenherstellung in prophetischer Ironie
  choice: Der Vers beschreibt Herstellung und Stabilisierung, ohne im Haupttext ausdrücklich »Götzenbild« einzufügen.
  alternative: Den Gegenstand zur Verdeutlichung ausdrücklich als »Götzenbild« benennen.
  rationale: Der Kontext identifiziert den Gegenstand, doch der hebräische Vers selbst nennt ihn hier nicht ausdrücklich. Die zurückhaltende Wiedergabe bewahrt die prophetische Ironie und vermeidet eine erklärende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tätigkeiten sind in natürlicher Werkstattsprache wiedergegeben; die parallele Struktur und die Ironie des sicherungsbedürftigen Werkstücks bleiben erkennbar.
