base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
translation:
  language: de
  text: »Legt euren Rechtsfall vor!«, sagt Jahwe[a]. »Bringt eure starken Gründe vor!«, sagt der König Jakobs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: Legt euren Rechtsfall vor
  rationale: Die wörtlich räumliche Formulierung »Bringt euren Streit heran« dient hier als gerichtliche Aufforderung. »Legt euren Rechtsfall vor« gibt diesen forensischen Sinn in natürlichem Deutsch wieder.
- source_word: יֹאמַר
  choice: sagt
  rationale: Das Imperfekt steht in der eingeschobenen Redeeinleitung und wird im Deutschen idiomatisch mit dem Präsens wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben; die Fußnote nennt die traditionelle deutsche Wiedergabe.
- source_word: הַגִּישׁוּ עֲצֻמוֹתֵיכֶם
  choice: Bringt eure stärksten Beweisgründe vor
  rationale: הַגִּישׁוּ fordert zum Vorbringen auf. Das seltene עֲצֻמוֹתֵיכֶם bezeichnet im gerichtlichen Zusammenhang starke Gründe, Beweise oder Verteidigungsmittel; »stärksten Beweisgründe« bewahrt die Intensität und die forensische Bildwelt.
- source_word: מֶלֶךְ יַעֲקֹב
  choice: der König Jakobs
  rationale: Die Genitivverbindung bewahrt sowohl den Königstitel als auch den im Hebräischen ausdrücklich genannten Namen Jakob.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn als Namen, während die traditionelle Ersatzlesung in der Fußnote transparent gemacht wird.
- issue: Gerichtliche Bildsprache
  choice: Rechtsfall und Beweisgründe ausdrücklich benennen
  alternative: 'wörtlich-räumlich: »Bringt euren Streit heran; bringt eure starken Dinge herbei«'
  rationale: Der Kontext ist eine gerichtliche Herausforderung. Die gewählte Formulierung macht den pragmatischen Sinn verständlich, ohne vorwegzunehmen, ob עֲצֻמוֹתֵיכֶם genauer Gründe, Beweise oder Verteidigungsmittel meint.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer gerichtlicher Bildwelt. Die parallelen Aufforderungen und die beiden nachgestellten Redeeinleitungen bleiben erhalten.
