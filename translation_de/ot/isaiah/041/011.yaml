id: ISA.41.11
reference: Isaiah 41:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: de
  text: Siehe, alle, die gegen dich vor Zorn entbrannt sind[a], werden beschämt und gedemütigt. Sie werden wie nichts sein, und die Männer, die mit dir streiten, werden zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „die gegen dich entbrannt sind“; das hebräische Bild des Brennens bezeichnet heftigen Zorn. Auch möglich: „die über dich erzürnt sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet die angekündigte Gewissheit nachdrücklich ein; „Siehe“ bewahrt den prophetischen Ton, ohne den Satz inhaltlich zu erweitern.
- source_word: יֵבֹשׁוּ
  choice: werden beschämt
  rationale: Das Verb bezeichnet hier die Erfahrung von Schande infolge der angekündigten Umkehrung, nicht lediglich ein inneres Schamgefühl.
- source_word: וְיִכָּלְמוּ
  choice: und gedemütigt
  rationale: Die Wiedergabe erhält das zweite, parallele Verb und vermittelt die Steigerung zur öffentlichen Erniedrigung, statt beide Verben zusammenzuziehen.
- source_word: הַנֶּחֱרִים בָּךְ
  choice: die gegen dich vor Zorn entbrannt sind
  rationale: Das Partizip von חרה verwendet das Bild des Brennens idiomatisch für heftigen Zorn; „gegen dich“ gibt die feindliche Ausrichtung der Präposition wieder.
- source_word: יִהְיוּ כְאַיִן
  choice: sie werden wie nichts sein
  rationale: Die Formulierung bewahrt sowohl das Zukunftsverb als auch den Vergleich mit כ und vermeidet die stärker deutende Aussage, sie würden vollständig vernichtet.
- source_word: וְיֹאבְדוּ
  choice: werden zugrunde gehen
  rationale: Das Qal von אבד ist intransitiv; „zugrunde gehen“ gibt dies natürlich wieder, ohne eine ausdrücklich genannte handelnde Ursache einzuführen.
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: die Männer, die mit dir streiten
  rationale: Die Übersetzung bewahrt das ausdrücklich männliche Substantiv אַנְשֵׁי und gibt den Konflikt- beziehungsweise Rechtsstreitcharakter von ריב verständlich wieder.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in אַנְשֵׁי רִיבֶךָ
  choice: die Männer, die mit dir streiten
  alternative: die mit dir streiten / deine Widersacher
  rationale: Da der hebräische Text ausdrücklich ein männliches Pluralnomen verwendet, wird es nicht stillschweigend neutralisiert. Das deutsche „dir“ lässt zugleich den auffälligen Wechsel der grammatischen Anredeformen im Hebräischen naturgemäß unmarkiert.
- issue: Aussage von יִהְיוּ כְאַיִן
  choice: sie werden wie nichts sein
  alternative: sie werden zunichtewerden / sie werden nicht mehr sein
  rationale: Die vergleichende Formulierung wahrt die Bildsprache und legt nicht über den Text hinaus fest, ob völlige Nichtexistenz, Bedeutungslosigkeit oder Wirkungslosigkeit gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht prophetischem Klang. „Siehe“ erhält den markanten Auftakt; ansonsten werden geläufige Formulierungen verwendet. Die beiden parallelen Verben für Beschämung sowie der Vergleich „wie nichts“ bleiben getrennt und erkennbar.
