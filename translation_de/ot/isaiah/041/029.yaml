  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: de
  text: Siehe, sie alle sind nichtig[a]; ihre Werke sind nichts. Ihre Gussbilder[b] sind Wind und Leere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Unheil“ oder „Böses“ bedeuten; hier betont es die Wert- und Wirkungslosigkeit.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegossene Bilder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die hinweisende Partikel leitet mit Nachdruck das abschließende Urteil ein. „Siehe“ bewahrt diesen Aufmerksamkeitsruf in würdigem, verständlichem Deutsch.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Form bezeichnet die zuvor genannten Größen kollektiv und bewahrt zugleich den pronominalen Bezug, ohne ihn enger als der hebräische Text festzulegen.
- source_word: אָוֶן
  choice: nichtig
  rationale: Im Zusammenhang der Götzenpolemik steht die Wert- und Wirkungslosigkeit im Vordergrund. „Nichtig“ gibt dies knapp wieder und passt zur parallelen Aussage mit אֶפֶס.
- source_word: אֶפֶס
  choice: nichts
  rationale: Das Wort wird prädikativ gebraucht und verschärft das Urteil über ihre Werke. „Nichts“ ist direkt und idiomatisch.
- source_word: מַעֲשֵׂיהֶם
  choice: ihre Werke
  rationale: Die Wendung kann sowohl das von ihnen Hervorgebrachte als auch ihr Wirken bezeichnen. „Werke“ erhält diese Bedeutungsbreite.
- source_word: רוּחַ
  choice: Wind
  rationale: In der Verbindung mit תֹהוּ bezeichnet das Wort hier Unbeständigkeit und Substanzlosigkeit. „Geist“ könnte an dieser Stelle theologisch irreführen.
- source_word: תֹהוּ
  choice: Leere
  rationale: Das Wort bezeichnet hier Wirkungslosigkeit und Gehaltlosigkeit, nicht notwendig urzeitliches Chaos. „Leere“ entspricht dem polemischen Zusammenhang.
- source_word: נִסְכֵּיהֶם
  choice: ihre Gussbilder
  rationale: Das Substantiv bezeichnet aus gegossenem Metall hergestellte Bilder. „Gussbilder“ ist präzise, knapp und im heutigen Deutsch verständlich.
theological_decisions:
- issue: Bezug des vernichtenden Urteils
  choice: Die Formulierung lässt offen, ob „sie alle“ nur die Götzen oder umfassender die Götzen samt ihren Herstellern und dem mit ihnen verbundenen Wirken bezeichnet.
  alternative: Die Aussage ausschließlich auf die Götzenbilder beziehen.
  rationale: Der unmittelbare Zusammenhang richtet sich gegen machtlose Götzen; die Pluralbezüge können jedoch das gesamte Götzensystem einschließen. Die Übersetzung wahrt diese Unbestimmtheit, während „Gussbilder“ am Versende den Schwerpunkt deutlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem prophetischem Nachdruck. Die parallele Struktur und die drastischen Nominalsätze des Hebräischen bleiben erkennbar; unnötige interpretierende Zusätze werden vermieden.
