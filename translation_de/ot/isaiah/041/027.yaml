  text: רִאשׁ֥וֹן לְ/צִיּ֖וֹן הִנֵּ֣ה הִנָּ֑/ם וְ/לִ/ירוּשָׁלִַ֖ם מְבַשֵּׂ֥ר אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: de
  text: 'Als Erster[a] sage ich zu Zion: »Sieh, da sind sie![b]«; Jerusalem gebe[c] ich einen Boten guter Nachricht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und elliptisch etwa: »Erster zu Zion«. Das Hebräische nennt hier weder ausdrücklich »ich« noch ein Verb wie »sagen«. Möglich ist auch die Auffassung: »Der Erste spricht zu Zion«.'
    reason: alternative_reading
  - marker: b
    text: Das Hebräische sagt nicht ausdrücklich, wer oder was mit »sie« gemeint ist; gemeint sein können angekündigte Menschen oder Ereignisse.
    reason: referent_ambiguity
  - marker: c
    text: 'Oder: »werde ich geben«.'
    reason: tense_alternative
lexical_decisions:
- source_word: רִאשׁוֹן
  choice: Als Erster
  rationale: Die Form bedeutet »erster« oder »früherer«. »Als Erster« bewahrt den Vorrang in der Ankündigung und lässt sich im Zusammenhang auf den göttlichen Sprecher beziehen, ohne »der Frühere« festzulegen.
- source_word: לְצִיּוֹן
  choice: zu Zion
  rationale: Die Präposition ל bezeichnet hier am natürlichsten den Adressaten der Ankündigung.
- source_word: הִנֵּה הִנָּם
  choice: »Sieh, da sind sie!«
  rationale: Die betonte deiktische Wendung weist auf mehrere nicht ausdrücklich benannte Personen oder Dinge. »Sieh« spricht das personifizierte Zion im Singular an; »da sind sie« erhält den Plural.
- source_word: וְלִירוּשָׁלַם
  choice: Und Jerusalem
  rationale: Der deutsche Dativ gibt ל natürlich wieder und stellt Jerusalem parallel zu Zion als Empfängerin dar.
- source_word: מְבַשֵּׂר
  choice: einen Freudenboten
  rationale: Das Partizip bezeichnet jemanden, der gute Nachricht verkündet. »Freudenbote« ist knapp, verständlich und bewahrt sowohl die Person als auch den erfreulichen Inhalt der Botschaft.
- source_word: אֶתֵּן
  choice: gebe ich
  rationale: Das Imperfekt der ersten Person kann im prophetischen Zusammenhang gegenwärtig oder zukünftig verstanden werden. Das Präsens erhält die lebendige Unmittelbarkeit der Aussage.
theological_decisions:
- issue: Subjekt und ergänztes Verb im ersten Satzglied
  choice: »Als Erster sage ich« versteht den in אֶתֵּן ausdrücklich auftretenden Ich-Sprecher auch als implizites Subjekt des verkürzten Anfangs und ergänzt ein zur Ankündigung passendes Verb.
  alternative: '»Ein Erster zu Zion: …« oder »Der Erste spricht zu Zion: …«'
  rationale: Das Hebräische ist elliptisch und nennt beim ersten Satzglied weder ein ausdrückliches Personalpronomen noch das Verb »sagen«. Die gewählte Fassung ist im Deutschen natürlich, während eine Fußnote die formale Offenheit sichtbar hält.
- issue: Bezug des Pluralsuffixes in הִנָּם
  choice: Der Bezug bleibt mit »sie« unbestimmt.
  alternative: Rückkehrende, angekündigte Ereignisse oder Werkzeuge der Rettung ausdrücklich benennen
  rationale: Der hebräische Vers identifiziert den pluralischen Bezug nicht. Eine Konkretisierung würde eine Auslegung in den Text eintragen.
- issue: Zeitbezug von אֶתֵּן
  choice: 'Präsens: »gebe ich«'
  alternative: 'Futur: »werde ich geben«'
  rationale: Beide Wiedergaben sind im prophetischen Redekontext möglich; das Präsens passt zur anschaulichen Gegenwartsnähe von הִנֵּה, ohne die Zukunftslesart auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. Die Ellipse des hebräischen Anfangs wird für einen natürlichen deutschen Satz behutsam ergänzt und in der Fußnote offengelegt; der unbestimmte Plural bleibt erhalten.
