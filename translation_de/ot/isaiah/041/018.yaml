source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: de
  text: Ich werde auf den kahlen Höhen[a] Flüsse hervorbrechen lassen und mitten in den Tälern Quellen. Ich werde die Wüste zu einem Wasserteich machen und das dürre Land zu Wasserquellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf den unbewachsenen Höhen; auf den kahlen Hügeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: Ich lasse … hervorbrechen
  rationale: Das Qal „öffnen“ bezeichnet hier idiomatisch das Eröffnen beziehungsweise Hervorbrechenlassen von Wasserläufen. Die Formulierung bewahrt Gottes aktives Handeln und klingt im Deutschen natürlich.
- source_word: שְׁפָיִים
  choice: kahle Höhen
  rationale: Der Ausdruck bezeichnet exponierte, meist vegetationsarme Höhen. „Kahle Höhen“ gibt sowohl die Geländelage als auch die Kargheit wieder, ohne die kultische Nebenbedeutung von „Höhen“ unnötig zu verstärken.
- source_word: נְהָרוֹת
  choice: Flüsse
  rationale: „Flüsse“ entspricht dem gewöhnlichen lexikalischen Wert und erhält das Bild überströmender Fülle; „Bäche“ wäre ebenfalls kontextuell möglich, aber schwächer.
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: mitten in den Tälern
  rationale: „Täler“ bildet den poetischen Gegensatz zu den Höhen; „mitten in“ bewahrt ausdrücklich die Bedeutung von בְּתוֹךְ.
- source_word: מַעְיָנוֹת
  choice: Quellen
  rationale: Das Wort bezeichnet natürliche Quellen; „Quellen“ ist präzise, gegenwärtig und vermeidet den Eindruck künstlicher Springbrunnen.
- source_word: אָשִׂים
  choice: Ich mache
  rationale: Im Zusammenhang der Verwandlung gibt „machen zu“ die Bedeutung von שׂים idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: מִדְבָּר
  choice: die Wüste
  rationale: „Wüste“ ist im modernen Deutsch die klare Bezeichnung für unfruchtbares, wasserarmes Land und passt zum parallelen „dürren Land“.
- source_word: לַאֲגַם מַיִם
  choice: zu einem Wasserteich
  rationale: אֲגַם bezeichnet ein stehendes oder gesammeltes Gewässer, etwa Teich, Wasserbecken oder sumpfige Fläche. „Wasserteich“ erhält das konkrete Bild, ohne Größe und Beschaffenheit zu eng festzulegen.
- source_word: אֶרֶץ צִיָּה
  choice: das dürre Land
  rationale: „Dürr“ gibt die ausgeprägte Trockenheit stärker und poetischer wieder als das allgemeinere „trocken“.
- source_word: לְמוֹצָאֵי מָיִם
  choice: zu Wasserquellen
  rationale: מוֹצָאֵי bezeichnet Orte, an denen Wasser hervortritt, also Quellen oder Austrittsstellen. „Wasserquellen“ ist natürlich und unterscheidet den Ausdruck nicht künstlich vom verwandten Bild im ersten Halbvers.
theological_decisions:
- issue: Art der Verwandlungsbilder
  choice: Die konkrete prophetisch-poetische Zusage einer von Gott bewirkten Wasserfülle bleibt im Text stehen.
  alternative: Die Bilder unmittelbar als geistliche Erneuerung oder ausschließlich als endzeitliche Neuschöpfung auslegen.
  rationale: Der hebräische Text schildert in Gottes Ich-Rede die Verwandlung wasserarmer Gegenden. Eine geistliche oder eschatologische Deutung ist möglich, soll aber nicht durch die Übersetzung festgeschrieben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter prophetischer Bildsprache. Der Satzbau folgt dem hebräischen Parallelismus, ohne im Deutschen steif zu wirken. Der erste Halbvers wird als ein zusammenhängender Satz gestaltet; die Ellipse „und … Quellen“ bewahrt die poetische Verdichtung.
