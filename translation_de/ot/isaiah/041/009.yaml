  text: אֲשֶׁ֤ר הֶחֱזַקְתִּ֨י/ךָ֙ מִ/קְצ֣וֹת הָ/אָ֔רֶץ וּ/מֵ/אֲצִילֶ֖י/הָ קְרָאתִ֑י/ךָ וָ/אֹ֤מַר לְ/ךָ֙ עַבְדִּ/י אַ֔תָּה בְּחַרְתִּ֖י/ךָ וְ/לֹ֥א מְאַסְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: de
  text: 'den ich von den Enden der Erde ergriffen und aus ihren äußersten Winkeln[a] gerufen habe und zu dem ich sagte: »Du bist mein Diener. Ich habe dich erwählt und nicht verworfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »aus ihren entlegensten Gebieten«. Der hebräische Ausdruck ist in seiner Bedeutung umstritten; manche verstehen ihn als »von ihren Vornehmen«. Die räumliche Bedeutung passt am besten zum parallelen Ausdruck »von den Enden der Erde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: ich … ergriffen habe
  rationale: Der Hifil von חזק kann hier ein konkretes Ergreifen oder Festhalten bezeichnen. Im Zusammenhang mit der Herkunft »von den Enden der Erde« liegt die räumliche Vorstellung näher als »stärken«.
- source_word: מִקְצוֹת הָאָרֶץ
  choice: von den Enden der Erde
  rationale: Die geläufige geografische Wendung bezeichnet die fernsten Regionen und bleibt im Deutschen natürlich und bildhaft.
- source_word: וּמֵאֲצִילֶיהָ
  choice: aus ihren äußersten Winkeln
  rationale: Die räumliche Wiedergabe entspricht dem Parallelismus zu »von den Enden der Erde«. Da die Bedeutung des hebräischen Ausdrucks umstritten ist und auch »von ihren Vornehmen« verstanden wurde, wird diese Möglichkeit in einer Fußnote genannt.
- source_word: קְרָאתִיךָ
  choice: ich … gerufen habe
  rationale: »Rufen« gibt sowohl den göttlichen Ruf als auch die konkrete Berufung wieder, ohne die Bedeutung auf ein förmliches Vorladen zu verengen.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: עבד kann einen Knecht, Sklaven oder Diener bezeichnen. »Diener« ist in diesem Kontext eine natürliche moderne Wiedergabe der besonderen Dienstbeziehung Israels zu Gott, ohne unnötig eine bestimmte soziale Rechtsstellung hervorzuheben.
- source_word: בְּחַרְתִּיךָ
  choice: Ich habe dich erwählt
  rationale: Das Perfekt mit gegenwärtiger Bedeutung bringt eine vollzogene Wahl zum Ausdruck, deren Geltung fortbesteht.
- source_word: מְאַסְתִּיךָ
  choice: verworfen
  rationale: מאס bezeichnet Ablehnung oder Verwerfung. »Verworfen« passt zur feierlichen Zusicherung und vermeidet die stärkere Gefühlsbedeutung von »verachtet«.
theological_decisions:
- issue: Bezug der zweiten Person Singular
  choice: Die Anrede bleibt durchgehend im Singular und bezeichnet Israel/Jakob als kollektive Einzelgestalt.
  alternative: Eine pluralische Wiedergabe, die die einzelnen Angehörigen Israels direkt anspricht.
  rationale: Der hebräische Text verwendet konsequent die zweite Person Maskulinum Singular. Der Kontext identifiziert den Angeredeten als Israel/Jakob und stellt das Volk als den einen Diener Gottes dar.
- issue: Aussage über Erwählung und Verwerfung
  choice: 'Die beiden Aussagen bleiben unmittelbar nebeneinander stehen: »erwählt und nicht verworfen«.'
  alternative: Eine erläuternde Wiedergabe, die daraus ausdrücklich eine unwiderrufliche oder bedingte Erwählungslehre ableitet.
  rationale: Der Vers formuliert eine konkrete göttliche Zusicherung an Israel/Jakob. Die Übersetzung bewahrt diese Aussage, ohne ihre systematisch-theologische Reichweite über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Relativsatz an den vorausgehenden Zusammenhang angeschlossen. »Diener« ist für heutige Leser zugänglicher als das traditionellere »Knecht«; »erwählt« und »verworfen« bewahren den feierlichen biblischen Ton.
