source:
  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: de
  text: Verkündet, was danach kommen wird[a], damit wir erkennen, dass ihr Götter seid! Ja, tut Gutes oder richtet Schaden an[b], damit wir erschrecken[c] und gemeinsam sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Spätere«. Der hebräische Ausdruck bezeichnet das, was später kommt, und fordert hier dazu heraus, die Zukunft vorauszusagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: »tut Gutes und Böses«. Gemeint ist die Herausforderung, irgendeine wirkliche Macht zu zeigen, sei es zum Nutzen oder zum Schaden.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hier verwendete Verb ist selten. Es kann auch bedeuten: »staunend schauen« oder »sich bestürzt umsehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Verkündet
  rationale: Der pluralische Imperativ von נגד fordert die angesprochenen Götzen in feierlich-polemischem Ton auf, etwas öffentlich bekannt zu machen.
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: was danach kommen wird
  rationale: Die Wendung bezeichnet wörtlich das Spätere beziehungsweise das, was danach kommt; im Zusammenhang ist sie eine Aufforderung, Zukünftiges vorauszusagen.
- source_word: וְנֵדְעָה
  choice: damit wir erkennen
  rationale: Der Kohortativ nach dem Imperativ drückt hier Zweck beziehungsweise Folge aus. „Erkennen“ passt zum gehobenen prophetischen Register.
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: dass ihr Götter seid
  rationale: Die Anrede und das Prädikat stehen im Plural; im polemischen Zusammenhang sind die als Götter beanspruchten Götzen gemeint.
- source_word: אַף
  choice: Ja
  rationale: Die Partikel verstärkt die folgende Herausforderung knapp und natürlich.
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: tut Gutes oder richtet Schaden an
  rationale: Die beiden Hifil-Verben fordern einen Machterweis zum Nutzen oder zum Schaden. „Oder“ gibt die funktionale Gegenüberstellung im Deutschen idiomatisch wieder.
- source_word: וְנִשְׁתָּעָה
  choice: damit wir erschrecken
  rationale: Die seltene Verbform bezeichnet im Kontext wahrscheinlich eine Reaktion des Erschreckens oder bestürzten Staunens; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְנִרְאֶה
  choice: und es sehen
  rationale: Das hebräische Verb bedeutet schlicht „und sehen“. Das deutsche Pronomen macht den aus dem Kontext erschlossenen Machterweis als Objekt deutlich, ohne ihn näher zu bestimmen.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet die gemeinsame Reaktion der Sprechenden.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Götzenpolemik
  choice: Götter
  alternative: göttliche Wesen; Gott
  rationale: Die zweite Person Plural und der polemische Zusammenhang verlangen hier eine pluralische Wiedergabe. Der Text fordert die vermeintlichen Götter auf, ihren Anspruch durch Vorhersage oder Machterweis zu bestätigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetisch-polemischem Ton. Die direkte Herausforderung bleibt pointiert; seltene oder mehrdeutige Ausdrücke werden nicht dogmatisch vereindeutigt, sondern durch Fußnoten transparent gemacht.
