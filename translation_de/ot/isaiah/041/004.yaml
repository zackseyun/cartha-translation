source:
  edition: WLC
  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: de
  text: Wer hat es bewirkt und vollbracht und ruft die Generationen von Anfang an herbei? Ich, Jahwe, bin der Erste, und bei den Letzten bin ich derselbe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung ist knapp und ungewöhnlich. Auch möglich: „und mit den Letzten – ich bin es.“ Traditionell wird sie als Aussage verstanden, dass Jahwe von den ersten bis zu den letzten Generationen gegenwärtig bleibt.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי פָעַל וְעָשָׂה
  choice: Wer hat es bewirkt und vollbracht
  rationale: Die rhetorische Frage und beide einander verstärkenden Verben bleiben erhalten. Das Objekt „es“ wird im Deutschen idiomatisch ergänzt und verweist auf das zuvor geschilderte geschichtliche Handeln.
- source_word: קֹרֵא הַדֹּרוֹת
  choice: wer ruft die Generationen … herbei
  rationale: Das Partizip bezeichnet Gottes fortdauerndes beziehungsweise charakteristisches Handeln. „Herbeirufen“ bringt hier den Gedanken souveränen Aufrufens auf die Bühne der Geschichte zum Ausdruck, ohne „Generationen“ umzudeuten.
- source_word: מֵרֹאשׁ
  choice: von Anfang an
  rationale: Die Wendung wird zeitlich verstanden und bezeichnet den Beginn beziehungsweise Ausgangspunkt der geschichtlichen Folge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רִאשׁוֹן
  choice: der Erste
  rationale: Die substantivierte Form bewahrt die knappe Aussage über Gottes zeitlichen Vorrang und seine einzigartige Stellung.
- source_word: וְאֶת אַחֲרֹנִים
  choice: und bei den Letzten
  rationale: Die schwierige, elliptische Verbindung wird im Sinn von Gottes Gegenwart bei den letzten Generationen verstanden. Der hebräische Plural bleibt durch „den Letzten“ erkennbar.
- source_word: אֲנִי הוּא
  choice: bin ich derselbe
  rationale: „Derselbe“ gibt die knappe Selbstidentifikation in natürlichem Deutsch wieder und betont die bleibende Identität des Sprechers, ohne die Formel unnötig auszubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Verhältnis zu den „Letzten“ in וְאֶת אַחֲרֹנִים
  choice: bei den Letzten bin ich derselbe
  alternative: ich bin der Erste und der Letzte
  rationale: Der masoretische Text hat „der Erste“ im Singular, danach jedoch eine schwierige Konstruktion mit „den Letzten“ im Plural. Die Übersetzung bewahrt diesen Unterschied und versteht die Wendung als Aussage über Gottes fortdauernde Gegenwart; die bekannte Formulierung „der Erste und der Letzte“ würde den vorliegenden Wortlaut glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben und die rhetorische Frage bleiben erhalten; die ungewöhnliche Schlusswendung wird im Text lesbar formuliert und in der Fußnote als echte sprachliche Mehrdeutigkeit offengelegt.
