  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: de
  text: damit sie sehen und erkennen[a], es sich zu Herzen nehmen und gemeinsam begreifen, dass die Hand Jahwes dies getan hat und der Heilige Israels es geschaffen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sehen und wissen, bedenken und gemeinsam Einsicht gewinnen“. Die hebräischen Verben können auch das innere Erwägen und das Erlangen von Einsicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis ein und ist im modernen Deutschen knapp und natürlich.
- source_word: יִרְאוּ
  choice: sie sehen
  rationale: Bewahrt sowohl die konkrete als auch die übertragene Bedeutung von ראה innerhalb der Folge von Wahrnehmungs- und Erkenntnisverben.
- source_word: וְיֵדְעוּ
  choice: und erkennen
  rationale: ידע bedeutet grundsätzlich „wissen/kennen“; „erkennen“ passt hier idiomatisch zur Wahrnehmung des göttlichen Handelns, ohne den Erkenntnisgehalt einzuengen.
- source_word: וְיָשִׂימוּ
  choice: es sich zu Herzen nehmen
  rationale: Gibt den hier naheliegenden idiomatischen Sinn des inneren Erwägens wieder. Das Pronomen „es“ greift den erkannten Sachverhalt auf.
- source_word: וְיַשְׂכִּילוּ
  choice: begreifen
  rationale: Der Hifil von שׂכל bezeichnet Einsicht oder verständiges Erfassen; „begreifen“ setzt die Erkenntnisfolge in natürlichem Deutsch fort.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Drückt die kollektive beziehungsweise gleichzeitige Einsicht der Betrachtenden aus.
- source_word: כִּי
  choice: dass
  rationale: Leitet hier den Inhalt dessen ein, was gesehen, erkannt und begriffen wird.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Bewahrt die hebräische bildhafte Wendung für Jahwes wirksame Macht und unmittelbares Handeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: עָשְׂתָה זֹּאת
  choice: dies getan hat
  rationale: Gibt das breite Verb עשה und den Rückverweis זֹאת unmittelbar und idiomatisch wieder.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: und der Heilige Israels
  rationale: Bewahrt sowohl die Konjunktion als auch den für Jesaja charakteristischen Gottestitel.
- source_word: בְּרָאָהּ
  choice: es geschaffen hat
  rationale: „Geschaffen“ erhält das eigenständige Gewicht von ברא; „es“ nimmt das zuvor mit „dies“ bezeichnete Werk beziehungsweise Ergebnis wieder auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen und entspricht der üblichen deutschen Form.
- issue: Verhältnis von עשה und ברא
  choice: 'Beide Aussagen bleiben unterschieden: „dies getan hat“ und „es geschaffen hat“.'
  alternative: Beide Verben zu einer einzigen Aussage zusammenziehen.
  rationale: Der hebräische Parallelismus verwendet zwei verschiedene Verben. Ihre getrennte Wiedergabe erhält die rhetorische Fülle und betont Gottes Handeln, ohne eine zusätzliche dogmatische Unterscheidung einzutragen.
- issue: Folge der vier Wahrnehmungs- und Erkenntnisverben
  choice: sehen / erkennen / sich zu Herzen nehmen / begreifen
  alternative: sehen / wissen / bedenken / Einsicht gewinnen
  rationale: Die vierfache Steigerung bleibt erkennbar, während die gewählte Formulierung in modernem Deutsch verständlich und würdig klingt. Die Fußnote weist auf weitere echte Bedeutungsnuancen hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierteilige Erkenntnisfolge und die beiden unterschiedlichen Verben für Jahwes Handeln bleiben erhalten; die Satzstruktur wurde nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
