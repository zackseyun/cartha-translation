source:
  edition: WLC
  text: תִּזְרֵ/ם֙ וְ/ר֣וּחַ תִּשָּׂאֵ֔/ם וּ/סְעָרָ֖ה תָּפִ֣יץ אוֹתָ֑/ם וְ/אַתָּה֙ תָּגִ֣יל בַּֽ/יהוָ֔ה בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּתְהַלָּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: de
  text: Du wirst sie worfeln[a]; der Wind wird sie forttragen, und der Sturm wird sie zerstreuen. Du aber wirst über Jahwe jubeln und dich des Heiligen Israels rühmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie zerstreuen“. Das hebräische Verb kann allgemein das Zerstreuen bezeichnen; „worfeln“ bewahrt hier das Dreschbild des Zusammenhangs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Heiligen Israels deinen Ruhm finden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: du wirst sie worfeln
  rationale: זרה bezeichnet hier im Zusammenhang des Dreschens das Worfeln beziehungsweise Zerstreuen des ausgedroschenen Materials. „Worfeln“ bewahrt das landwirtschaftliche Bild präzise.
- source_word: רוּחַ
  choice: Wind
  rationale: Die Parallele zum Sturm und das Forttragen des Materials verlangen die meteorologische Bedeutung.
- source_word: תִּשָּׂאֵם
  choice: wird sie forttragen
  rationale: נשׂא bedeutet heben oder tragen; „forttragen“ gibt im Bild des vom Wind weggeführten Spreus die resultative Richtung natürlich wieder.
- source_word: סְעָרָה
  choice: Sturm
  rationale: Das Wort bezeichnet einen heftigen Windsturm. „Sturm“ ist im modernen Deutsch natürlich und vermeidet die unnötige Spezifizierung „Wirbelsturm“.
- source_word: תָּפִיץ
  choice: wird sie zerstreuen
  rationale: Der Hifil von פוץ bedeutet auseinanderbringen oder zerstreuen; die Wahl entspricht dem Bild des verwehten Dreschguts.
- source_word: תָּגִיל
  choice: wirst … jubeln
  rationale: גיל bezeichnet freudiges Frohlocken. „Jubeln“ bewahrt dessen Intensität und klingt im heutigen Deutsch natürlich.
- source_word: בַּיהוָה
  choice: über Jahwe
  rationale: Bei einem deutschen Verb der Freude gibt „über“ den Gegenstand beziehungsweise Grund des Jubels idiomatisch wieder. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: des Heiligen Israels
  rationale: Der bedeutende jesajanische Gottestitel wird vollständig bewahrt; der Genitiv ist mit „sich rühmen“ idiomatisches Deutsch.
- source_word: תִּתְהַלָּל
  choice: wirst dich … rühmen
  rationale: Der Hitpael von הלל bezeichnet das Sich-Rühmen beziehungsweise seinen Ruhm in jemandem haben. „Sich des Heiligen Israels rühmen“ wahrt die positive, auf Gott gerichtete Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den offenbarten Gottesnamen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage des Sich-Rühmens
  choice: dich des Heiligen Israels rühmen
  alternative: deinen Ruhm im Heiligen Israels finden
  rationale: Die Form bezeichnet hier keine sündige Selbsterhöhung, sondern freudigen, auf Gott gerichteten Ruhm. Die gewählte Formulierung bewahrt sowohl den reflexiven Ausdruck als auch seinen göttlichen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die seltenere, aber sachlich präzise Bezeichnung „worfeln“ bleibt wegen des unmittelbaren Dreschbildes stehen und wird durch eine Fußnote erläutert. Der Satzbau folgt der poetischen Parallelität, ohne hebräische Wortstellung unnatürlich nachzuahmen.
