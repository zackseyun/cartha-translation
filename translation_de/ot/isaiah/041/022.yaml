  rationale: Die Revision stellt die beiden Aufforderungen zum Vorbringen und Verkünden klar heraus, ohne das im Hebräischen unausgesprochene konkrete Objekt näher zu bestimmen. Sie gibt die idiomatische Bedeutung der Herz-Wendung im Haupttext verständlich wieder und erhält deren Bildsprache in der Fußnote. Die Alternative zu „Ausgang“ bleibt korrekt verankert.
