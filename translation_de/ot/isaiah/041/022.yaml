  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: de
  text: Sie sollen es vorbringen und uns sagen, was geschehen wird.[a] Sagt uns, was die früheren Dinge sind, damit wir sie bedenken[b] und ihren Ausgang erkennen;[c] oder verkündet uns, was kommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollen es vorbringen und uns verkünden, was eintreten wird.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „damit wir unser Herz darauf richten“; gemeint ist sorgfältiges Beachten und Erwägen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „und ihr Ende erkennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: Sie sollen vortreten
  rationale: Der Hifil von נגשׁ fordert im gerichtlichen Zusammenhang dazu auf, vorzutreten beziehungsweise etwas vorzubringen. Da das Objekt im Hebräischen unausgesprochen bleibt, vermeidet „vortreten“ eine unnötige Ergänzung und wahrt die forensische Szene.
- source_word: וְיַגִּידוּ לָנוּ
  choice: und uns sagen
  rationale: נגד im Hifil bedeutet „mitteilen, verkünden, sagen“. „Uns sagen“ ist hier natürlich und gibt die Aufforderung klar wieder.
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: was geschehen wird
  rationale: קרה bezeichnet das Eintreten von Ereignissen. Die knappe Formulierung entspricht idiomatischem modernem Deutsch.
- source_word: הָרִאשֹׁנוֹת
  choice: die früheren Dinge
  rationale: ראשׁון bezeichnet hier Früheres beziehungsweise vorherige Ereignisse und steht im Kontrast zu „was kommen wird“. „Dinge“ lässt die referenzielle Offenheit des Hebräischen bestehen.
- source_word: מָה הֵנָּה
  choice: was die früheren Dinge sind
  rationale: Der verblosen hebräischen Frage „Was sind sie?“ wird eng gefolgt, ohne sie deutend zu „was sie bedeuten“ oder zeitlich zu „was sie waren“ umzuformen.
- source_word: הַגִּידוּ
  choice: Sagt uns
  rationale: Der Imperativ desselben Verbs נגד wird zur lexikalischen und rhetorischen Kontinuität erneut mit „sagen“ wiedergegeben.
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: damit wir sie zu Herzen nehmen
  rationale: Die Wendung „das Herz auf etwas richten“ meint sorgfältiges Beachten und Erwägen. Das geläufige deutsche Idiom „zu Herzen nehmen“ bewahrt die Herzsprache, kann jedoch leicht eine stärkere emotionale Nuance tragen; dies wird in der Fußnote erläutert.
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: und ihren Ausgang erkennen
  rationale: אַחֲרִית kann „Ende“, „späterer Verlauf“ oder „Ausgang“ bedeuten. „Ausgang“ passt zum Prüfen früherer Ereignisse, ohne zwingend eine endzeitliche Bedeutung einzutragen.
- source_word: אוֹ הַבָּאוֹת
  choice: oder ... was kommen wird
  rationale: Das substantivierte Partizip von בוא bezeichnet Kommendes. Die deutsche Singularformulierung „was“ fasst die im Hebräischen pluralisch gedachten Ereignisse idiomatisch zusammen.
- source_word: הַשְׁמִיעֻנוּ
  choice: lasst uns hören
  rationale: Der Hifil von שׁמע bedeutet wörtlich „hören lassen“. Die deutsche Wendung erhält dieses Bild und wirkt in der prophetischen Herausforderung natürlich.
theological_decisions:
- issue: Bezug der Aufforderung יַגִּישׁוּ
  choice: Das unausgesprochene Objekt wird nicht ausdrücklich als „Götzen“ oder „Beweise“ ergänzt.
  alternative: „Sie sollen sie vorbringen“ beziehungsweise „Sie sollen ihre Beweise vorbringen“.
  rationale: Der Vers selbst nennt das Objekt nicht. „Vortreten“ bewahrt den gerichtlichen Ton, ohne die kontextuell naheliegende Referenz im Vers ausdrücklich festzulegen.
- issue: Bedeutung von אַחֲרִיתָן
  choice: „ihren Ausgang“
  alternative: „ihr Ende“
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Ausgang“ hält den Schwerpunkt auf dem Verlauf und Ergebnis der genannten früheren Dinge und vermeidet eine unbeabsichtigte eschatologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Aufforderung. Die Satzstruktur folgt dem Hebräischen, wird aber durch Zeichensetzung und idiomatische Formulierungen lesbar gehalten. Die wiederholten Aufforderungen und der Gegensatz zwischen früheren und kommenden Dingen bleiben erhalten.
