    rationale: Das deutsche Idiom legt nahe, etwas persönlich zu beherzigen. Im Kontext geht es um aufmerksames Erwägen früherer Dinge. „Bedenken“ ist sachlicher und kontextgenauer; die Herzmetaphorik bleibt in der Fußnote dokumentiert.
