reference: Isaiah 41:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: de
  text: Fürchte dich nicht, denn ich bin bei dir. Schau dich nicht ängstlich um[a], denn ich bin dein Gott. Ich werde dich stärken, ja, ich werde dir helfen, ja, ich werde dich mit meiner gerechten rechten Hand stützen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht bestürzt.“ Das hebräische Verb kann ein angstvolles oder alarmiertes Umherschauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „mit der rechten Hand meiner Gerechtigkeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die direkte Verneinung des Verbs ירא wird knapp und würdevoll wiedergegeben; die reflexive deutsche Form ist idiomatisch.
- source_word: כִּי עִמְּךָ אָנִי
  choice: denn ich bin bei dir
  rationale: כִּי begründet hier das vorausgehende Verbot. „Bei dir“ ist im Deutschen die natürliche Entsprechung für die zugesagte Gegenwart Gottes.
- source_word: אַל תִּשְׁתָּע
  choice: Schau dich nicht ängstlich um
  rationale: Die Wiedergabe bewahrt die wahrscheinlich konkrete Vorstellung eines angstvollen oder alarmierten Umherschauens, ohne sie auf bloße Bestürzung zu reduzieren.
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: ich bin dein Gott
  rationale: Die persönliche Gottesbeziehung wird schlicht und unmittelbar ausgedrückt; אֱלֹהִים ist hier syntaktisch und semantisch singular.
- source_word: אִמַּצְתִּיךָ
  choice: Ich werde dich stärken
  rationale: Das Verb אמץ bezeichnet das Starkmachen oder Kräftigen. Das deutsche Futur gibt im Zusammenhang den Charakter einer göttlichen Zusage wieder.
- source_word: אַף
  choice: ja
  rationale: Das zweimalige „ja“ erhält die steigernde Bekräftigung und den poetischen Aufbau des Hebräischen, ohne im heutigen Deutsch schwerfällig zu wirken.
- source_word: עֲזַרְתִּיךָ
  choice: ich werde dir helfen
  rationale: עזר bedeutet helfen; die deutsche Dativkonstruktion ist idiomatisch. Das Futur setzt die Reihe der Zusagen fort.
- source_word: תְּמַכְתִּיךָ
  choice: ich werde dich … stützen
  rationale: תמך bezeichnet das Festhalten, Tragen oder Stützen. „Stützen“ bewahrt das körperliche Bild und verbindet sich natürlich mit der Hand.
- source_word: בִּימִין צִדְקִי
  choice: mit meiner gerechten rechten Hand
  rationale: ב wird instrumental als „mit“ wiedergegeben. Die adjektivische Fassung ist natürliches Deutsch und bewahrt den Zusammenhang von Gottes Macht und Gerechtigkeit, während die formale Konstruktion in einer Fußnote dokumentiert wird.
theological_decisions:
- issue: Zeitbezug der drei Verben אִמַּצְתִּיךָ, עֲזַרְתִּיךָ und תְּמַכְתִּיךָ
  choice: 'Zukünftige Zusagen: „Ich werde dich stärken … helfen … stützen“'
  alternative: 'Perfektische oder gegenwärtige Aussagen: „Ich habe dich gestärkt …“ beziehungsweise „Ich stärke dich …“'
  rationale: Die Formen sind morphologisch Perfektformen, wirken in diesem prophetischen Zusagezusammenhang jedoch als verlässliche Versicherungen göttlichen Handelns. Das Futur bringt diese Funktion im modernen Deutsch klar zum Ausdruck, ohne eine besondere dogmatische Deutung einzutragen.
- issue: Wiedergabe von בִּימִין צִדְקִי
  choice: „mit meiner gerechten rechten Hand“
  alternative: „mit der rechten Hand meiner Gerechtigkeit“
  rationale: Die gewählte Form ist idiomatisch und lässt Gottes Hand als von Gerechtigkeit gekennzeichnet erscheinen. Die formalere Alternative bleibt möglich und wird wegen der echten grammatischen Spannung in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Klang. Kurze Hauptsätze und die Wiederholung von „ja“ erhalten die eindringliche Zusagestruktur. Konkrete hebräische Bildsprache wird nach Möglichkeit bewahrt; echte lexikalische und grammatische Alternativen werden in Fußnoten offengehalten.
