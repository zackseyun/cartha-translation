id: ISA.41.14
reference: Isaiah 41:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: de
  text: Fürchte dich nicht, du Wurm Jakob[a], ihr Männer Israels[b]! Ich selbst helfe dir[c] – spricht Jahwe, dein Erlöser, der Heilige Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wurm Jakob“ ist ein Bild für Schwäche und Niedrigkeit, keine wörtliche Beschreibung.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „Sterbliche Israels“ oder „Volk Israel“. Das hebräische Wort bezeichnet Männer beziehungsweise Menschen und kann hier Israels Gebrechlichkeit betonen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Ich selbst habe dir geholfen“ oder „Ich selbst werde dir helfen“. Die hebräische Verbform stellt die Hilfe als feststehende Zusicherung dar und muss hier nicht ausschließlich vergangen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Fürchte dich nicht
  rationale: אַל mit dem Imperfekt formuliert ein Verbot. Die feminine Singularform richtet sich an Israel als kollektiv gedachte Größe; die deutsche Singularanrede bewahrt diese Form.
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: du Wurm Jakob
  rationale: תּוֹלַעַת bedeutet wörtlich „Wurm“. Die direkte Anrede bewahrt das bewusst drastische Bild für Schwäche und Niedrigkeit, statt es durch eine Deutung wie „kleines Israel“ abzuschwächen.
- source_word: מְתֵי יִשְׂרָאֵל
  choice: ihr Männer Israels
  rationale: מְתֵי ist eine konstruktusförmige Pluralbezeichnung für Menschen bzw. Männer. Die Wiedergabe bleibt nah an der grammatisch maskulinen Form; eine Fußnote nennt die mögliche Nuance „Sterbliche“ und die kollektivere Übersetzung „Volk“.
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt Nachdruck. „Ich selbst“ gibt diese Hervorhebung im Deutschen natürlich wieder.
- source_word: עֲזַרְתִּיךְ
  choice: helfe dir
  rationale: Die Form ist formal ein Perfekt mit femininem Singularsuffix. Im Zusammenhang einer prophetischen Zusicherung kann sie gegenwärtige oder gewiss zukünftige Hilfe ausdrücken; der Präsenssatz ist idiomatisch, ohne den formalen Aspekt in der Fußnote zu verschweigen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: נְאֻם יְהוָה ist eine feste prophetische Botenformel. „Spricht Jahwe“ ist im Deutschen würdig und knapp und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וְגֹאֲלֵךְ
  choice: dein Erlöser
  rationale: גֹאֵל bezeichnet denjenigen, der aufgrund einer Bindung einlöst, befreit oder die Sache eines Angehörigen vertritt. „Erlöser“ bewahrt hier sowohl die Rettungsbedeutung als auch den etablierten göttlichen Titel.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feste jesajanische Gottesbezeichnung wird in ihrer prägnanten Titelform erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet den Tetragrammaton als Gottes persönlichen Bundesnamen. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftlich und kirchlich verständliche Namensform und vermeidet, den Eigennamen durch einen Titel zu ersetzen.
- issue: Zeitbezug von עֲזַרְתִּיךְ
  choice: Ich selbst helfe dir
  alternative: Ich selbst habe dir geholfen; ich selbst werde dir helfen
  rationale: Das hebräische Perfekt kann hier die göttliche Hilfe als feststehende prophetische Gewissheit darstellen. Das Präsens hält die Zusicherung offen für gegenwärtige und verlässlich fortwirkende Hilfe; die formale Vergangenheits- und mögliche Zukunftsdeutung werden in der Fußnote bewahrt.
- issue: Wechsel zwischen Singular- und Pluralanrede
  choice: du Wurm Jakob … ihr Männer Israels … helfe dir
  alternative: durchgehend singularische oder kollektiv geglättete Anrede
  rationale: 'Der Wechsel steht bereits im Hebräischen: Israel wird zugleich als die eine Gestalt Jakob und als aus Männern beziehungsweise Menschen bestehendes Kollektiv angeredet. Die Übersetzung glättet diese Spannung nicht.'
- issue: Apposition der Gottestitel nach der Botenformel
  choice: Jahwe, dein Erlöser, der Heilige Israels
  alternative: Jahwe; und dein Erlöser ist der Heilige Israels
  rationale: Die Titel lassen sich natürlich als Appositionen zu Jahwe lesen. Das hebräische וְ vor גֹאֲלֵךְ kann jedoch auch eine stärker koordinierende Syntax nahelegen; die gewählte Fassung folgt dem zusammengehörigen göttlichen Titelgefüge, ohne verschiedene handelnde Personen einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schroffe Metapher „Wurm Jakob“ und der auffällige Wechsel von Singular zu Plural und zurück bleiben bewusst erhalten. Gedankenstriche grenzen die prophetische Botenformel lesefreundlich ab; die Gottestitel folgen als Appositionen.
