  yaml_path: translation/ot/isaiah/041/019.yaml
  text: I will put in the wilderness cedar[a], acacia, myrtle, and olive tree; I will set in the desert cypress, plane tree, and pine together[b],
translation:
  language: de
  text: Ich will in der Wildnis Zedern, Akazien, Myrten und Olivenbäume[a] setzen; in die Steppe will ich Zypressen, Platanen und Kiefern, alle miteinander[b], setzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ölbäume“; wörtlich: „Bäume des Öls“.'
    reason: lexical_alternative
  - marker: b
    text: Die drei hebräischen Baumnamen lassen sich botanisch nicht sicher bestimmen. Möglich sind unter anderem Wacholder oder Tanne statt „Zypresse“, Ulme statt „Platane“ und Buchsbaum oder Esche statt „Kiefer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֵּן
  choice: Ich pflanze
  rationale: Das Verb bedeutet gewöhnlich „geben“ oder „setzen“. Bei Bäumen gibt „pflanzen“ die konkrete Handlung im Deutschen natürlich wieder, ohne den Gedanken göttlicher Platzierung zu verlieren.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר bezeichnet unbebautes, wüstes Land und nicht notwendig eine Sandwüste. „Wildnis“ bewahrt den weiteren Sinn und den poetischen Gegensatz zum fruchtbaren Bewuchs.
- source_word: אֶרֶז
  choice: Zedern
  rationale: Die übliche und gut begründete Wiedergabe des hebräischen Baumnamens; der Singular bezeichnet hier die Baumart kollektiv.
- source_word: שִׁטָּה
  choice: Akazien
  rationale: Der hebräische Ausdruck bezeichnet die Akazie; der deutsche Artenname ist klarer als eine Transliteration.
- source_word: הֲדַס
  choice: Myrten
  rationale: Übliche botanische Wiedergabe.
- source_word: עֵץ שָׁמֶן
  choice: Olivenbäume
  rationale: Wörtlich „Ölbaum“. Der Olivenbaum ist die herkömmliche und im Kontext plausible Deutung; die wörtlichere, weniger bestimmte Wiedergabe wird in einer Fußnote genannt.
- source_word: אָשִׂים
  choice: setze ich
  rationale: Das Verb bedeutet „setzen, hinstellen, anbringen“. „Setze“ bewahrt die konkrete Bedeutung und zugleich die Variation gegenüber dem ersten Halbvers.
- source_word: בָּעֲרָבָה
  choice: in die Steppe
  rationale: עֲרָבָה kann trockenes Steppenland oder die geografische Araba bezeichnen. Der poetische Parallelismus mit מִדְבָּר spricht hier für die allgemeine Landschaftsbezeichnung.
- source_word: בְּרוֹשׁ
  choice: Zypressen
  rationale: Die genaue Baumart ist unsicher; „Zypresse“ ist eine verbreitete Wiedergabe. Andere mögliche Bestimmungen werden in der Fußnote festgehalten.
- source_word: תִּדְהָר
  choice: Platanen
  rationale: Die botanische Bestimmung ist unsicher. „Platane“ ist eine verbreitete moderne Wiedergabe; „Ulme“ ist ebenfalls vorgeschlagen worden.
- source_word: תְאַשּׁוּר
  choice: Kiefern
  rationale: Die genaue Art ist nicht sicher zu bestimmen. „Kiefer“ ist im Zusammenhang der genannten Bäume eine mögliche und verbreitete Wiedergabe; Alternativen stehen in der Fußnote.
- source_word: יַחְדָּו
  choice: alle miteinander
  rationale: Die Form betont, dass die zuletzt genannten Bäume gemeinsam dort stehen; „alle miteinander“ gibt diesen Nachdruck natürlich wieder.
