  terminology: „Mein Diener“ ist für עַבְדִּי kontextgerecht. Die deutschen Namensformen Israel, Jakob und Abraham sind standardsprachlich. „Meines Freundes“ gibt die hier gut begründbare relationale Lesart von אֹהֲבִי idiomatisch wieder; die mögliche stärker verbale Lesart wird korrekt per Fußnote bewahrt.
