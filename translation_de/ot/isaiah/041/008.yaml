source:
  edition: WLC
  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: de
  text: Du aber, Israel, mein Diener, Jakob, den ich erwählt habe, Nachkomme Abrahams, meines Freundes[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „der mich liebt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt Israel kontrastierend von den zuvor genannten Völkern ab; „Du aber“ gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form beibehalten.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: עבד kann einen Sklaven oder Diener bezeichnen; hier ist es eine Bezeichnung für Israels Verhältnis zu Gott. „Mein Diener“ ist im Deutschen sachgerecht und vermeidet eine einseitige Betonung des rechtlichen Sklavenstatus.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname steht als weitere Anrede beziehungsweise Apposition zu Israel und wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  choice: den ich erwählt habe
  rationale: Der Relativsatz bezieht sich auf Jakob beziehungsweise Israel. Das deutsche Perfekt bezeichnet die vollzogene Erwählung und lässt ihre fortdauernde Bedeutung erkennen.
- source_word: זֶרַע אַבְרָהָם
  choice: Nachkomme Abrahams
  rationale: זֶרַע ist ein kollektiver Singular. „Nachkomme“ bewahrt hier die Singularform und bezeichnet Israel als die aus Abraham hervorgegangene Nachkommenschaft.
- source_word: אֹהֲבִי
  choice: meines Freundes
  rationale: Das Partizip mit Suffix kann wörtlich „der mich liebt“ bedeuten, in diesem Zusammenhang aber auch die besondere Beziehung Abrahams zu Gott als „mein Freund“ bezeichnen. Der Genitiv passt grammatisch zur deutschen Wendung „Nachkomme Abrahams“.
theological_decisions:
- issue: Bedeutung von אֹהֲבִי in Bezug auf Abraham
  choice: meines Freundes
  alternative: der mich liebt
  rationale: „Mein Freund“ gibt die relationale, idiomatische Bedeutung prägnant wieder, während die wörtlichere Deutung als aktiv Liebender sprachlich möglich bleibt. Diese echte Bedeutungsnuance wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anredende Reihung des Hebräischen bleibt erhalten; der Gedankenstrich zeigt an, dass der Satz in Vers 9 weitergeführt wird.
