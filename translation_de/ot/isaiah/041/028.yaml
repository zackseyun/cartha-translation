revisions:
- from: Und ich sah hin, doch da war kein Mensch; unter diesen war kein Ratgeber, den ich hätte fragen können, sodass sie ein Wort erwidert hätten.[a]
  to: Und ich sah hin, doch da war kein Mensch; unter diesen war kein Ratgeber, den ich hätte fragen können und der ein Wort zur Antwort gegeben hätte.[a]
  rationale: Die Revision beseitigt den unklaren Wechsel vom singularischen „Ratgeber“ zum pluralischen „sie“. Der generische Singular stellt im modernen Deutsch klar heraus, dass kein denkbarer Ratgeber befragt werden konnte oder eine Antwort hätte geben können. Die potenzielle bzw. irreale Nuance bleibt erhalten; der nicht ausdrücklich benannte Bezug von „diesen“ wird nicht eingeengt.
