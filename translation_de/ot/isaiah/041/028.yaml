base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: de
  text: Und ich sah hin, doch da war kein Mensch; unter diesen war kein Ratgeber, den ich hätte fragen können und der ein Wort zur Antwort gegeben hätte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „… und ich frage sie, und sie antworten ein Wort.“ Die hebräischen Verbformen stehen hier im Zusammenhang der fehlenden möglichen Antwortpartner; „ein Wort antworten“ bedeutet: überhaupt eine Antwort geben.'
    reason: Die Fußnote zeigt die hebräische Abfolge einschließlich des pluralischen Suffixes und erklärt zugleich die im Deutschen idiomatisch als generischer Singular formulierte potenzielle Aussage.
lexical_decisions:
- source_word: וְאֵרֶא
  choice: Und ich sah hin
  rationale: Das Qal-Imperfekt 1. Person Singular von ראה kann im prophetischen Diskurs rückblickend wiedergegeben werden. „sah hin“ bewahrt den prüfenden, beobachtenden Sinn natürlicher als das bloße „sah“.
- source_word: וְאֵין אִישׁ
  choice: doch da war kein Mensch
  rationale: אִישׁ bezeichnet hier einen Menschen beziehungsweise jemanden, der antworten könnte. „kein Mensch“ wahrt die konkrete Ausdrucksweise, ohne im Deutschen ausschließlich einen erwachsenen Mann nahezulegen.
- source_word: וּמֵאֵלֶּה
  choice: unter diesen
  rationale: 'מִן ist mit אֵלֶּה am besten partitiv zu verstehen: Unter den zuvor Betrachteten fand sich niemand. Die Übersetzung legt nicht ausdrücklich fest, ob damit die Götzen, ihre Vertreter oder die größere Gruppe gemeint sind.'
- source_word: וְאֵין יוֹעֵץ
  choice: war kein Ratgeber
  rationale: יוֹעֵץ ist ein substantivisch gebrauchtes Partizip von יעץ und bezeichnet jemanden, der Rat erteilt. „Ratgeber“ ist knapp und in diesem Kontext verständlich.
- source_word: וְאֶשְׁאָלֵם
  choice: den ich hätte fragen können
  rationale: Die Form mit dem Suffix der 3. Person maskulin Plural bezeichnet eine gedachte beziehungsweise mögliche Befragung. Die deutsche Konstruktion bewahrt diesen Potenzialis und macht den fehlenden Ansprechpartner zum Bezugspunkt.
- source_word: וְיָשִׁיבוּ דָבָר
  choice: sodass sie ein Wort erwidert hätten
  rationale: Das Hifil von שוב kann „erwidern/antworten“ bedeuten; דָבָר heißt wörtlich „Wort“. Die Formulierung erhält die knappe Bildlichkeit und die rhetorische Leere einer ausbleibenden Antwort.
theological_decisions:
- issue: Bezug von „diesen“ und Identität des fehlenden Ratgebers
  choice: Die unbestimmte Formulierung „unter diesen“ bleibt erhalten.
  alternative: Die Götzen oder ihre Vertreter ausdrücklich zu nennen.
  rationale: Der Kontext ist die gerichtliche Herausforderung an die Götzen in Jesaja 41,21–29; der Vers selbst benennt den Bezug jedoch nicht ausdrücklich. Die Übersetzung löst diese Offenheit daher nicht auf.
- issue: Wiedergabe von אִישׁ
  choice: kein Mensch
  alternative: kein Mann; niemand
  rationale: „kein Mensch“ gibt die grammatisch maskuline Einzahl konkret wieder und lässt zugleich die hier naheliegende repräsentative Bedeutung zu. „kein Mann“ könnte im heutigen Deutsch eine sachlich unbeabsichtigte geschlechtliche Einschränkung vermitteln; „niemand“ wäre idiomatisch, würde aber das Substantiv stärker einebnen.
- issue: Modalität von וְאֶשְׁאָלֵם und וְיָשִׁיבוּ
  choice: 'Irreale beziehungsweise potenzielle Beziehung: „den ich hätte fragen können, sodass sie … erwidert hätten“'
  alternative: 'Vergangene Tatsachenfolge: „als ich sie fragte, antworteten sie“'
  rationale: Der Zusammenhang betont, dass niemand vorhanden war, den Gott hätte befragen können und der eine Antwort gegeben hätte. Eine indikativische Vergangenheitsfolge würde diese Spannung verschieben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält den feierlichen Gerichtston und die knappe Polemik des Hebräischen bei. Das Semikolon gliedert die parallelen Feststellungen; der Konjunktiv wahrt die potenzielle beziehungsweise irreale Aussage.
