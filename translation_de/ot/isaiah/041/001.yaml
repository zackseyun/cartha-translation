source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: de
  text: Schweigt vor mir, ihr Küstenländer![a] Die Völker sollen ihre Kraft erneuern.[b] Sie sollen herantreten; dann sollen sie reden. Gemeinsam wollen wir zum Gericht treten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »ihr Inseln« beziehungsweise »ihr fernen Küsten«; das hebräische Wort kann allgemein Inseln, Küstengebiete und Länder jenseits des Meeres bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder »sollen neue Kraft gewinnen«; die hebräische Wendung spricht wörtlich vom Wechseln oder Erneuern der Kraft.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann hier das Gericht, die Rechtssache oder das gerichtliche Verfahren bezeichnen. Der Zusammenhang ist der einer rechtlichen Auseinandersetzung.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ אֵלַי
  choice: Schweigt vor mir
  rationale: Der Hifil-Imperativ fordert in dieser feierlichen Rechtsszene zum Schweigen auf. אֵלַי bedeutet wörtlich »zu mir«; zusammen mit dem Schweigegebot gibt »vor mir« den Zusammenhang im Deutschen natürlich wieder, ohne ausdrücklich ein nicht genanntes »hört mir zu« einzufügen.
- source_word: אִיִּים
  choice: Küstenländer
  rationale: Das Wort bezeichnet besonders bei Jesaja häufig Inseln, Küstengebiete oder überseeische, ferne Länder. »Küstenländer« wahrt diesen weiteren geografischen Sinn.
- source_word: וּלְאֻמִּים
  choice: die Völker
  rationale: לְאֻמִּים bezeichnet Völker beziehungsweise Nationen. »Die Völker« bildet eine natürliche Parallele zu den Küstenländern.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: sollen ihre Kraft erneuern
  rationale: Die Wendung bezeichnet das Erneuern oder Auswechseln der Kraft. Die gewählte Formulierung erhält das hebräische Bild und den auffordernden Sinn des Imperfekts.
- source_word: יִגְּשׁוּ
  choice: Sie sollen herantreten
  rationale: Das Imperfekt ist hier auffordernd gebraucht. »Herantreten« passt zur förmlichen Vorladung und bewahrt die gerichtliche Szene.
- source_word: אָז יְדַבֵּרוּ
  choice: dann sollen sie reden
  rationale: אָז ordnet den nächsten Schritt zeitlich an; דבר bedeutet schlicht »reden«. Die Übersetzung ergänzt daher nicht deutend »ihren Fall vortragen«.
- source_word: יַחְדָּו
  choice: Gemeinsam
  rationale: Das Adverb bezeichnet gemeinsames Handeln und leitet hier die abschließende Einladung ein.
- source_word: לַמִּשְׁפָּט
  choice: zum Gericht
  rationale: מִשְׁפָּט hat in diesem Zusammenhang einen forensischen Sinn. »Zum Gericht« lässt offen, ob besonders das Verfahren, die Rechtssache oder die Entscheidung gemeint ist.
- source_word: נִקְרָבָה
  choice: wollen wir … treten
  rationale: Die Kohortativform der ersten Person Plural drückt eine gemeinsame Aufforderung aus. »Wollen wir … treten« gibt diese Kraft in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Gerichtlicher Rahmen des Verses
  choice: Der Vers wird als göttliche Vorladung zu einer rechtlichen Auseinandersetzung wiedergegeben, ohne die knappe hebräische Formulierung zu einer ausführlichen Gerichtsszene auszubauen.
  alternative: Den Vers nur allgemein als Aufruf zum Zuhören verstehen oder ausdrücklich mit »vor Gericht verhandeln« paraphrasieren.
  rationale: Die Abfolge von Schweigen, Kräftesammeln, Herantreten, Reden und gemeinsamem Treten zum מִשְׁפָּט weist deutlich auf eine forensische Auseinandersetzung. Die Übersetzung macht diesen Rahmen erkennbar, legt aber weder den genauen Verfahrensschritt noch das Ergebnis fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem feierlichen Ton einer göttlichen Vorladung. Die direkten Aufforderungen bleiben knapp; veraltete Wendungen und eine überdeutende Gerichtssaal-Paraphrase werden vermieden.
