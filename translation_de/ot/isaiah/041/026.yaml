base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: de
  text: 'Wer hat es von Anfang an[a] angekündigt, damit wir es erkennen, und im Voraus, damit wir sagen: »Er hat recht«[b]? Doch niemand kündigte es an, niemand gab es zu hören, niemand hörte eure Worte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Anbeginn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er ist im Recht“; traditionell: „Er ist gerecht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הִגִּיד
  choice: Wer hat … angekündigt
  rationale: Die direkte Frage bewahrt die rhetorische Herausforderung; „angekündigt“ gibt den Hifil von נגד im Zusammenhang einer vorausgehenden Bekanntmachung natürlich wieder.
- source_word: מֵרֹאשׁ
  choice: von Anfang an
  rationale: Die Wendung bezeichnet hier die frühzeitige Ankündigung; die gewählte Formulierung ist im Deutschen idiomatisch und lässt als Alternative „von Anbeginn“ zu.
- source_word: וְנֵדָעָה
  choice: damit wir es erkennen
  rationale: Der Kohortativ wird als beabsichtigte Folge wiedergegeben. Das ergänzte „es“ ist im Deutschen erforderlich und bleibt hinsichtlich des Gegenstands unbestimmt.
- source_word: וּמִלְּפָנִים
  choice: und im Voraus
  rationale: Die Formulierung steht parallel zu „von Anfang an“ und betont eine Bekanntgabe vor dem Eintreten des Geschehens.
- source_word: וְנֹאמַר צַדִּיק
  choice: 'damit wir sagen: »Er hat recht«'
  rationale: צַדִּיק fungiert hier als bestätigendes Urteil über die zutreffende Vorhersage; „Er hat recht“ ist natürlich und bewahrt den forensisch-vindikatorischen Sinn.
- source_word: אַף אֵין מַגִּיד
  choice: Doch da war niemand, der es ankündigte
  rationale: Die adversative Wendung bringt den Umschlag von der Frage zur nachdrücklichen Verneinung zum Ausdruck.
- source_word: מַשְׁמִיעַ
  choice: der es hören ließ
  rationale: Die kausative Bedeutung des Hifil von שמע wird eng am Hebräischen wiedergegeben.
- source_word: שֹׁמֵעַ אִמְרֵיכֶם
  choice: der eure Worte hörte
  rationale: Die Wiedergabe wahrt das Partizip und den direkten Bezug auf die Worte der angesprochenen Gegenseite.
theological_decisions:
- issue: Unausgesprochenes Objekt der Ankündigung
  choice: Das neutrale Pronomen „es“ wird verwendet, ohne einen bestimmten Menschen oder ein bestimmtes Ereignis zu benennen.
  alternative: „ihn“ oder „dies“
  rationale: Im Hebräischen bleibt das Objekt unausgesprochen. „Es“ ermöglicht idiomatisches Deutsch, ohne den Bezug über den Text hinaus festzulegen.
- issue: Bedeutung von צַדִּיק
  choice: „Er hat recht“
  alternative: „Er ist gerecht“ oder „Er ist im Recht“
  rationale: Im Kontext wird die Glaubwürdigkeit einer Vorhersage beurteilt. Die Formulierung bezeichnet daher vor allem Bestätigung beziehungsweise Rechtbehalten, nicht ausdrücklich moralische Gerechtigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Bewegung. Die dreifache Verneinung und die partizipiale Parallelstruktur des Hebräischen bleiben erkennbar; unnötige konfessionelle Festlegungen werden vermieden.
