base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/003.yaml
  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: de
  text: Er verfolgt sie und zieht sicher weiter[a], auf einem Pfad, den seine Füße nie betreten haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er verfolgt sie und zieht in Frieden hindurch, auf einem Pfad, den seine Füße nicht gegangen sind.“ Die hebräische Schlusswendung ist schwierig; sie kann den sicheren Vormarsch oder das Vorankommen auf einem bisher unbetretenen Weg hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: Er verfolgt sie
  rationale: Das Qal-Imperfekt der Wurzel רדף mit Objektsuffix bezeichnet die feindliche Verfolgung der zuvor genannten Herrscher. Das Präsens gibt die lebendige prophetische Darstellung natürlich wieder.
- source_word: יַעֲבוֹר
  choice: und zieht … weiter
  rationale: עבר bedeutet grundsätzlich „vorübergehen, hindurchgehen, überschreiten“. „weiterziehen“ beschreibt hier den unaufhaltsamen Vormarsch, ohne ein nicht genanntes Hindernis oder Gebiet zu ergänzen.
- source_word: שָׁלוֹם
  choice: sicher
  rationale: Das wörtliche „Frieden“ ist hier adverbial gebraucht und bezeichnet einen unversehrten, ungestörten Fortgang. „sicher“ ist im Deutschen idiomatisch und vermeidet die mögliche Fehlvorstellung eines friedlichen, nicht kriegerischen Handelns.
- source_word: אֹרַח
  choice: auf einem Pfad
  rationale: אֹרַח bezeichnet einen Pfad oder Weg. „Pfad“ bewahrt das konkrete Bild der Fortbewegung und passt zum folgenden Hinweis auf seine Füße.
- source_word: בְּרַגְלָיו לֹא יָבוֹא
  choice: den seine Füße noch nicht betreten hatten
  rationale: Wörtlich ist die Wendung etwa „mit seinen Füßen kommt er nicht“. Die gewählte Fassung gibt die im Zusammenhang naheliegende Aussage wieder, dass er auf einem ihm bisher unbekannten beziehungsweise unbetretenen Weg vordringt, und bewahrt dabei das Bild der Füße.
theological_decisions:
- issue: Deutung der schwierigen Schlusswendung אֹרַח בְּרַגְלָיו לֹא יָבוֹא
  choice: Der Eroberer zieht auf einem Pfad voran, den seine Füße zuvor nicht betreten hatten.
  alternative: 'Er zieht auf einem Pfad voran, den seine Füße nicht berühren; oder enger am Wortlaut: „einen Pfad kommt er mit seinen Füßen nicht“.'
  rationale: Die hebräische Formulierung ist stark verdichtet. Im Zusammenhang des siegreichen Vormarschs liegt ein bisher unbetretener Weg am nächsten. Da auch andere syntaktische Deutungen möglich sind, wird die Schwierigkeit in der Fußnote offengelegt und nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „zieht … weiter“ vermittelt den militärischen Vormarsch natürlich; „sicher“ gibt den adverbialen Sinn von שָׁלוֹם wieder, während die Fußnote die wörtlichere Wiedergabe „in Frieden“ und die genuine Mehrdeutigkeit der Schlusswendung erhält.
