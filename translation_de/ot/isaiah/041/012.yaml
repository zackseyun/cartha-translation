  text: תְּבַקְשֵׁ/ם֙ וְ/לֹ֣א תִמְצָאֵ֔/ם אַנְשֵׁ֖י מַצֻּתֶ֑/ךָ יִהְי֥וּ כְ/אַ֛יִן וּ/כְ/אֶ֖פֶס אַנְשֵׁ֥י מִלְחַמְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: de
  text: Du wirst sie suchen, aber nicht finden – die Männer, die mit dir streiten.[a] Die Männer, die gegen dich Krieg führen, werden wie nichts sein, wie Nichtigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Männer deines Streits“; gemeint sind diejenigen, die mit dir streiten oder mit dir im Streit liegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „wie אַיִן und wie אֶפֶס“; der zweite Ausdruck kann auch „völlige Nichtigkeit“ oder „Nichtsein“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: Du wirst sie suchen
  rationale: Das Piel von בקש bedeutet hier „suchen“. Die Formulierung ist natürlich und bildet mit „nicht finden“ das sachliche Gegensatzpaar des Hebräischen.
- source_word: וְלֹא תִמְצָאֵם
  choice: und nicht finden
  rationale: מצא im Qal bedeutet „finden“. Die knappe Koordination bewahrt die hebräische Abfolge; das Subjekt muss im Deutschen nicht wiederholt werden.
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: die Männer, die mit dir streiten
  rationale: Die Konstruktverbindung bezeichnet wörtlich die „Männer deines Streits“. Die Relativsatzfassung gibt den persönlichen Bezug und den Sinn von Streit bzw. Auseinandersetzung idiomatisch wieder.
- source_word: יִהְיוּ
  choice: werden … sein
  rationale: היה kann „sein“ oder „werden“ bedeuten. Das deutsche Futur „werden … sein“ lässt offen, ob primär der künftige Zustand oder das Eintreten dieses Zustands betont wird.
- source_word: כְאַיִן
  choice: wie nichts
  rationale: אַיִן bezeichnet Nichtsein oder Nichtigkeit. „Wie nichts“ bewahrt die Vergleichspartikel כ und klingt im Deutschen knapp und poetisch.
- source_word: וּכְאֶפֶס
  choice: wie nicht vorhanden
  rationale: אֶפֶס kann völlige Nichtigkeit oder Nichtvorhandensein bezeichnen. Die Formulierung unterscheidet den Ausdruck von אַיִן, ohne die parallelen Begriffe künstlich zu metaphysischen Fachbegriffen zu machen.
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: Die Männer, die gegen dich Krieg führen
  rationale: Wörtlich steht „die Männer deines Krieges“. Der Relativsatz macht den im Kontext gemeinten feindlichen Bezug in natürlichem Deutsch ausdrücklich.
theological_decisions:
- issue: Grad der Wörtlichkeit bei den beiden Ausdrücken für das Verschwinden der Feinde
  choice: Die konkrete Aussage „suchen und nicht finden“ wird beibehalten; die beiden parallelen Ausdrücke werden als „wie nichts“ und „wie nicht vorhanden“ unterschieden.
  alternative: 'Beide Wörter mit „nichts“ wiedergeben oder deutender formulieren: „sie werden völlig verschwinden“.'
  rationale: So bleiben der poetische Parallelismus und die Steigerung erhalten, ohne die bildhafte Gerichtsaussage in eine metaphysische Behauptung über die Vernichtung der Personen umzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem poetischem Ton. Die Anrede steht entsprechend dem hebräischen Singular im vertrauten „du“. Die parallele Struktur und die echte Bedeutungsnähe der beiden Nichtigkeitsbegriffe bleiben sichtbar.
