  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: de
  text: Ich habe einen aus dem Norden erweckt, und er ist gekommen; vom Aufgang der Sonne her[a] ruft er meinen Namen an.[b] Er wird über Machthaber kommen, als wären sie Lehm, und wie ein Töpfer Schlamm zertreten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: aus dem Osten.'
    reason: lexical_alternative
  - marker: b
    text: '„Ruft meinen Namen an“ kann auch bedeuten: „beruft sich auf meinen Namen“ oder „ruft meinen Namen aus“.'
    reason: lexical_alternative
  - marker: c
    text: Die von Gott erweckte Person wird häufig als Kyros verstanden; im hebräischen Text dieses Verses wird sie nicht namentlich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: Ich habe einen … aufgestört
  rationale: Der Hifil von עור bezeichnet hier Gottes veranlassendes Aufwecken oder Mobilisieren zu einer Tat. „Aufgestört“ bewahrt die kraftvolle Bildlichkeit und die göttliche Initiative; das im Hebräischen nur vorausgesetzte Objekt wird mit „einen“ knapp ergänzt.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: Die Richtungsangabe wird unmittelbar und ohne Harmonisierung mit der folgenden Herkunftsangabe wiedergegeben.
- source_word: וַיַּאת
  choice: und er ist gekommen
  rationale: Die Folgeform nach dem Perfekt führt die als vollzogen dargestellte Handlung weiter. Das deutsche Perfekt gibt diese prophetisch als bereits wirklich betrachtete Perspektive natürlich wieder.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: vom Aufgang der Sonne her
  rationale: Die wörtliche Bildsprache bleibt erhalten und bezeichnet zugleich den Osten; die geläufige Richtungsbedeutung wird in einer Fußnote erläutert.
- source_word: יִקְרָא בִשְׁמִי
  choice: ruft er meinen Namen an
  rationale: קרא בשם kann das Anrufen beziehungsweise Sich-Berufen auf einen Namen bezeichnen. „Meinen Namen anrufen“ wahrt den naheliegenden Sinn, ohne über die Frömmigkeit der ungenannten Person abschließend zu urteilen; eine weitere mögliche Nuance steht in der Fußnote.
- source_word: וְיָבֹא סְגָנִים
  choice: Er wird über Machthaber kommen
  rationale: Das Verb schildert hier ein bedrohliches Herankommen an hohe Amtsträger. „Über … kommen“ lässt sowohl die Bewegung als auch die Überwältigung anklingen. סְגָנִים wird allgemeinverständlich als „Machthaber“ wiedergegeben.
- source_word: כְּמוֹ חֹמֶר
  choice: wie über Lehm
  rationale: חֹמֶר bezeichnet formbare Erde beziehungsweise Lehm. Die wiederholte Präposition „über“ verdeutlicht im Deutschen, dass die Machthaber so leicht niedergetreten werden wie Lehm, ohne die Vergleichsstruktur auszudeuten.
- source_word: וּכְמוֹ יוֹצֵר יִרְמָס טִיט
  choice: und wie ein Töpfer Schlamm zertritt
  rationale: יוֹצֵר ist der formende Handwerker, hier natürlich „Töpfer“. רמס bezeichnet kräftiges Treten oder Zertreten; „zertritt“ erhält die Gewalt des Bildes. טִיט ist nasser Schlamm oder breiiger Lehm und wird zur Unterscheidung von חֹמֶר als „Schlamm“ übersetzt.
theological_decisions:
- issue: Identität und religiöse Haltung des von Gott aufgestörten Eroberers
  choice: Die Person bleibt ungenannt; „ruft er meinen Namen an“ wird übersetzt, ohne daraus ein abschließendes Urteil über echte Gottesverehrung abzuleiten.
  alternative: Die Person ausdrücklich als Kyrus identifizieren oder die Wendung eindeutig als Bekenntnis, bloße Berufung auf Gottes Autorität beziehungsweise Verkündigung festlegen.
  rationale: Der Zusammenhang wird häufig auf Kyrus bezogen, doch dieser Vers nennt ihn nicht. Auch יִקְרָא בִשְׁמִי erlaubt mehrere Nuancen. Die Übersetzung bewahrt daher sowohl die fehlende Namensnennung als auch die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Zeitperspektive. Die Parallelbilder „Lehm“, „Töpfer“ und „Schlamm“ bleiben konkret; die ungenannte Person und die Mehrdeutigkeit des Namensanrufs werden nicht konfessionell vereindeutigt.
