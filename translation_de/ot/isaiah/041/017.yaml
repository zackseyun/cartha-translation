id: ISA.41.17
reference: Isaiah 41:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: de
  text: Die Armen und Bedürftigen suchen Wasser, doch es ist keines da; ihre Zunge ist vor Durst vertrocknet. Ich, Jahwe[a], werde ihnen antworten; ich, der Gott Israels, werde sie nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der Eigenname des Gottes Israels; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲנִיִּים וְהָאֶבְיוֹנִים
  choice: Die Armen und Bedürftigen
  rationale: Die beiden Ausdrücke bezeichnen Menschen in Armut, Bedrängnis und Mangel. Die gewählte Paarung bewahrt den poetischen Parallelismus und stellt im Zusammenhang mit der Wassernot den materiellen Mangel in den Vordergrund.
- source_word: מְבַקְשִׁים מַיִם
  choice: suchen Wasser
  rationale: Das Partizip schildert eine andauernde, gegenwärtig vor Augen gestellte Suche. Das deutsche Präsens gibt dies knapp und natürlich wieder.
- source_word: וָאַיִן
  choice: doch es ist keines da
  rationale: Die Existenzverneinung bezieht sich auf das gesuchte Wasser. „Doch“ macht den sachlich adversativen Zusammenhang deutlich; „keines“ nimmt „Wasser“ auf, ohne es unnötig zu wiederholen.
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: ihre Zunge ist vor Durst vertrocknet
  rationale: Der hebräische kollektive Singular „ihre Zunge“ bleibt erhalten. „Vor Durst vertrocknet“ gibt Ursache und drastisches körperliches Bild in verständlichem Deutsch wieder.
- source_word: אֲנִי יְהוָה
  choice: Ich, Jahwe
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor; die Apposition bewahrt diese emphatische Selbstaussage. Der Gottesname JHWH wird als „Jahwe“ wiedergegeben.
- source_word: אֶעֱנֵם
  choice: werde ihnen antworten
  rationale: Das Verb bedeutet hier „antworten“ oder „reagieren“. „Antworten“ hält die Aussage offen und setzt nicht ausdrücklich ein im Vers ungenanntes Gebet voraus.
- source_word: אֱלֹהֵי יִשְׂרָאֵל לֹא אֶעֶזְבֵם
  choice: ich, der Gott Israels, werde sie nicht verlassen
  rationale: Das wiederholte „ich“ bildet die emphatische Parallelstruktur im Deutschen ab. „Nicht verlassen“ ist gegenwärtig und verständlich und bewahrt zugleich das relationale Gewicht der Zusage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Bedeutung von אֶעֱנֵם
  choice: ihnen antworten
  alternative: sie erhören
  rationale: „Erhören“ könnte ein ausdrückliches Gebet voraussetzen und eine positive Gewährung stärker ausdeuten. „Antworten“ entspricht dem Verb unmittelbar und bewahrt die Offenheit des Verses.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Der kollektive Singular „ihre Zunge“ und die parallelen göttlichen Selbstaussagen bleiben erhalten; altertümliche Formulierungen werden vermieden.
