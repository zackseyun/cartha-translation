source:
  edition: WLC
  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: de
  text: Siehe, ich habe dich zu einem neuen, scharfen Dreschschlitten mit vielen Schneiden gemacht.[a] Du wirst Berge dreschen und zermalmen und die Hügel zu Spreu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Schneiden habend«; das hebräische Wort kann auch »Münder« meinen. Möglich ist auch: »mit gezahnten Schneiden« oder »mit vielen Zähnen«.'
    reason: Die seltene Form פִּיפִיּוֹת und die technische Beschaffenheit des Dreschgeräts sind nicht eindeutig bestimmbar.
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der emphatische Aufmerksamkeitsruf wird in würdigem, verständlichem prophetischem Deutsch bewahrt.
- source_word: שַׂמְתִּיךְ לְמוֹרַג
  choice: ich habe dich zu einem ... Dreschschlitten gemacht
  rationale: שׂים mit לְ bezeichnet hier die bildhafte Umgestaltung zu einem Werkzeug; das Perfekt wird als gegenwärtig wirksames Ergebnis wiedergegeben.
- source_word: חָרוּץ חָדָשׁ
  choice: neuen, scharfen
  rationale: Beide Adjektive charakterisieren das Dreschgerät; חָרוּץ bezeichnet hier seine schneidende Schärfe.
- source_word: בַּעַל פִּיפִיּוֹת
  choice: der viele Schneiden hat
  rationale: בַּעַל bedeutet „besitzend“; das seltene פִּיפִיּוֹת bezeichnet im Zusammenhang die Schneiden oder Zähne des Geräts. „Viele Schneiden“ wahrt die Unbestimmtheit besser als „doppelschneidig“.
- source_word: תָּדוּשׁ הָרִים
  choice: Du wirst Berge dreschen
  rationale: Die konkrete landwirtschaftliche Metapher und der Zukunftssinn der Verbform bleiben erhalten.
- source_word: וְתָדֹק
  choice: und zermalmen
  rationale: דקק bezeichnet das Zerkleinern beziehungsweise Zerreiben; das deutsche Verb nimmt „Berge“ als gemeinsames Objekt auf.
- source_word: וּגְבָעוֹת כַּמֹּץ תָּשִׂים
  choice: und Hügel wie Spreu machen
  rationale: Die poetische Parallele sowie das resultative Bild von Hügeln, die zu leichter Spreu werden, werden unmittelbar wiedergegeben.
theological_decisions:
- issue: Berge und Hügel als metaphorische Größen
  choice: Die konkrete Bildsprache vom Dreschen und Zermalmen bleibt stehen.
  alternative: Die Berge und Hügel ausdrücklich als feindliche Völker oder große Hindernisse deuten.
  rationale: Der hebräische Vers benennt die Bezugsgrößen nicht ausdrücklich. Eine ausdeutende Übersetzung würde die poetische und theologische Offenheit unzulässig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält den prophetischen Nachdruck; „Dreschschlitten“ bewahrt das konkrete antike Agrarbild. Die Anrede ist singular und entspricht dem hebräischen Femininum, ohne dies im Deutschen zusätzlich zu markieren.
