source:
  edition: WLC
  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: de
  text: Sieh, ich selbst habe den Schmied[a] erschaffen, der ein Kohlenfeuer anfacht und eine Waffe[b] für sein Werk[c] hervorbringt; und ich selbst habe den Verderber erschaffen, um zu zerstören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Handwerker“. Das hebräische Wort ist weiter gefasst; Kohlenfeuer und Waffenherstellung weisen hier auf einen Metallhandwerker.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gerät“ oder „Gegenstand“. Das hebräische Wort hat ein breites Bedeutungsspektrum; hier ist wahrscheinlich eine Waffe gemeint.'
    reason: lexical_alternative
  - marker: c
    text: „Sein Werk“ kann sich im Hebräischen entweder auf das hergestellte Stück oder auf den Schmied beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet die nachdrückliche göttliche Aussage ein. „Sieh“ ist gegenwärtiges, würdevolles Deutsch und bewahrt ihren hinweisenden Charakter.
- source_word: אָנֹכִי / וְאָנֹכִי
  choice: ich selbst / und ich selbst
  rationale: Das selbstständige Pronomen ist betont; seine Wiederholung unterstreicht, dass Gott sowohl den Schmied als auch den Verderber erschaffen hat.
- source_word: בָּרָאתִי
  choice: habe … erschaffen
  rationale: Das Qal-Perfekt bezeichnet Gottes vollzogene Schöpfungstat. Das deutsche Perfekt ist hier natürlich und hält ihre fortdauernde Bedeutung im Zusammenhang fest.
- source_word: חָרָשׁ
  choice: Schmied
  rationale: Das Wort kann allgemein einen Handwerker bezeichnen; das Kohlenfeuer und die Herstellung einer Waffe weisen hier jedoch konkret auf einen Metallhandwerker.
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: der ins Kohlenfeuer bläst
  rationale: Die Formulierung gibt das Bild des Handwerkers wieder, der in beziehungsweise an einem Kohlenfeuer bläst, und klingt zugleich natürlich auf Deutsch.
- source_word: וּמוֹצִיא כְלִי
  choice: und eine Waffe hervorbringt
  rationale: כְלִי kann Gefäß, Gerät, Gegenstand oder Waffe bedeuten. Im Zusammenhang mit dem Schmied und dem anschließenden Verderber ist „Waffe“ wahrscheinlich, ohne dass die weitere Wortbedeutung verschwiegen wird.
- source_word: לְמַעֲשֵׂהוּ
  choice: für sein Werk
  rationale: Die knappe Formulierung bewahrt die mögliche Beziehung des maskulinen Suffixes entweder auf den Schmied oder auf den hergestellten Gegenstand.
- source_word: מַשְׁחִית
  choice: Verderber
  rationale: Das substantivisch gebrauchte Hifil-Partizip bezeichnet denjenigen, der Verderben bewirkt. „Verderber“ ist direkt und würdevoll.
- source_word: לְחַבֵּל
  choice: um zu zerstören
  rationale: Der Infinitiv bezeichnet Zweck oder Bestimmung. „Um zu zerstören“ gibt die starke zerstörerische Bedeutung ohne Abschwächung wieder.
theological_decisions:
- issue: Gottes Erschaffung sowohl des Schmieds als auch des Verderbers
  choice: Die wiederholte Aussage „ich selbst habe … erschaffen“ wird für beide Gestalten ausdrücklich beibehalten.
  alternative: Die zweite Aussage indirekter formulieren, um Gottes schöpferisches Handeln in Bezug auf den Verderber abzuschwächen.
  rationale: Der hebräische Text schreibt die Erschaffung beider Gestalten mit derselben betonten Formulierung Gott zu. Die Übersetzung bewahrt diese theologische Spannung, ohne sie philosophisch oder konfessionell aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die Bildsprache des Kohlenfeuers und die emphatische Wiederholung „ich selbst“ bleiben erhalten; echte lexikalische und syntaktische Mehrdeutigkeiten werden in Fußnoten offengelegt.
