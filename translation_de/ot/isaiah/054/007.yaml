  text: בְּ/רֶ֥גַע קָטֹ֖ן עֲזַבְתִּ֑י/ךְ וּ/בְ/רַחֲמִ֥ים גְּדֹלִ֖ים אֲקַבְּצֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: de
  text: Für einen kurzen Augenblick habe ich dich verlassen, doch mit großem Erbarmen werde ich dich sammeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: für einen kurzen Augenblick
  rationale: Die Verbindung bezeichnet eine sehr kurze Zeitspanne. „Für“ gibt den durativen Sinn im Deutschen natürlich wieder; „kurz“ überträgt das wörtliche „klein“ idiomatisch auf die Zeitangabe.
- source_word: עֲזַבְתִּיךְ
  choice: habe ich dich verlassen
  rationale: עזב bedeutet hier direkt „verlassen, preisgeben“. „Verlassen“ bewahrt die Härte der Aussage, ohne sie zu verstärken oder abzuschwächen.
- source_word: וּבְרַחֲמִים גְּדֹלִים
  choice: doch mit großem Erbarmen
  rationale: Das ו wird wegen des deutlichen Gegensatzes adversativ mit „doch“ wiedergegeben. Das pluralische רַחֲמִים bezeichnet hier umfassendes Erbarmen; „groß“ entspricht גְּדֹלִים.
- source_word: אֲקַבְּצֵךְ
  choice: werde ich dich sammeln
  rationale: קבץ bezeichnet das Sammeln beziehungsweise Zusammenbringen und trägt im prophetischen Zusammenhang den Gedanken der Wiederherstellung, ohne dass dieser ausformuliert werden muss.
theological_decisions:
- issue: Spannung zwischen göttlichem Verlassen und Wiederherstellung
  choice: Das Verlassen wird als wirkliche, aber zeitlich begrenzte Handlung ausgesprochen; darauf folgt die Zusage des Sammelns aus großem Erbarmen.
  alternative: Das Verlassen als nur scheinbar darzustellen oder sprachlich abzumildern.
  rationale: Der hebräische Text verwendet עזב ohne Abschwächung, begrenzt die Aussage jedoch selbst durch die kurze Dauer und stellt ihr das große Erbarmen gegenüber. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. „Erbarmen“ und „sammeln“ bewahren die bildhafte und theologische Dichte des Hebräischen, ohne konfessionelle Zusätze.
