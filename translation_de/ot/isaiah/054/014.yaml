  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: de
  text: In Gerechtigkeit wirst du fest gegründet sein[a]. Halte dich fern von Unterdrückung, denn du wirst dich nicht fürchten, und von Schrecken[b], denn er wird dir nicht nahekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch Gerechtigkeit wirst du fest gegründet sein.“ Die hebräische Präposition kann sowohl den Bereich als auch das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Schrecken“ kann auch mit „Zerstörung“ oder „Untergang“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: In Gerechtigkeit
  rationale: Die Präposition ב kann hier sowohl den Bereich als auch das Mittel bezeichnen. „In Gerechtigkeit“ bewahrt diese Offenheit weitgehend und lässt sowohl moralische Rechtschaffenheit als auch gerechte Ordnung anklingen.
- source_word: תִּכּוֹנָנִי
  choice: wirst du fest gegründet sein
  rationale: Die Form von כון bezeichnet ein festes Gegründet- oder Gefestigtsein. Die passive, resultative Aussage und die Anrede an die feminine Einzahl bleiben erhalten.
- source_word: רַחֲקִי
  choice: Halte dich fern
  rationale: Die hebräische Form ist ein Imperativ der femininen Einzahl. Die deutsche Wiedergabe bewahrt den Aufforderungscharakter, ohne ihn in eine bloße Zukunftsaussage umzudeuten.
- source_word: מֵעֹשֶׁק
  choice: von Unterdrückung
  rationale: עֹשֶׁק kann Unterdrückung, Ausbeutung oder Erpressung bezeichnen. „Unterdrückung“ gibt den breiten Bedrohungs- und Unrechtskontext am besten wieder.
- source_word: כִּי לֹא תִירָאִי
  choice: denn du wirst dich nicht fürchten
  rationale: Die Wendung begründet die Aufforderung mit einer Zukunftszusage. „Wirst dich nicht fürchten“ vermeidet die stärker deutende Formulierung „brauchst dich nicht zu fürchten“.
- source_word: מִמְּחִתָּה
  choice: von Schrecken
  rationale: מְחִתָּה kann Schrecken, Zerstörung oder Untergang meinen. Im Parallelismus mit Furcht und angesichts des folgenden Nahkommens ist „Schrecken“ die passende Hauptwiedergabe.
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: denn er wird dir nicht nahekommen
  rationale: Das feminine Verb bezieht sich naheliegend auf מְחִתָּה. Das maskuline deutsche Pronomen „er“ stimmt entsprechend mit „Schrecken“ überein und bewahrt das Bild einer Bedrohung, die nicht herankommt.
theological_decisions:
- issue: Adressatin und grammatisches Geschlecht
  choice: Die feminine Einzahl bleibt in der direkten Anrede ohne ergänzten Eigennamen erhalten.
  alternative: „Zion“ oder „Jerusalem“ ausdrücklich in den Vers einsetzen.
  rationale: Im Zusammenhang ist Zion beziehungsweise Jerusalem angesprochen; der hebräische Vers nennt den Namen hier jedoch nicht erneut. Daher wird er nicht erläuternd in den Haupttext eingefügt.
- issue: Aufforderung oder Zusage bei רַחֲקִי
  choice: 'Aufforderung: „Halte dich fern“.'
  alternative: 'Zusage: „Du wirst fern sein“.'
  rationale: Die masoretische Form ist morphologisch ein Imperativ der femininen Einzahl. Obwohl der Zusammenhang von Zusagen geprägt ist, soll der eindeutige Aufforderungscharakter nicht stillschweigend nivelliert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem knappen hebräischen Parallelismus; „fest gegründet“ macht die resultative Bedeutung von כון verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
