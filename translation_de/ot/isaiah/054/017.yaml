base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: de
  text: Keine Waffe, die gegen dich geformt wird, wird Erfolg haben. Und jede Zunge, die sich im Gericht gegen dich erhebt, wirst du für schuldig erklären.[a] Das ist das Erbteil der Diener Jahwes, und ihre Gerechtigkeit kommt von mir,[b] spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du verurteilen“. Das hebräische Verb bezeichnet im rechtlichen Sinn das Schuldigsprechen oder Verurteilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Freispruch kommt von mir“. Das hebräische Wort kann in diesem rechtlichen Zusammenhang die Bestätigung ihres Rechts oder ihren Freispruch bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: Waffe
  rationale: Im Zusammenhang mit dem gegen Zion gerichteten Vorgehen bezeichnet das allgemeinere Wort hier ein zum Angriff bestimmtes Gerät; „Waffe“ gibt den feindlichen Sinn natürlich wieder.
- source_word: יוּצַר
  choice: geformt wird
  rationale: Das Passiv von יצר bezeichnet das Formen oder Gestalten. „Geformt“ bewahrt die Breite des Ausdrucks, ohne eine bestimmte Herstellungsweise wie das Schmieden vorauszusetzen.
- source_word: יִצְלָח
  choice: wird Erfolg haben
  rationale: Das Verb bedeutet gelingen, Erfolg haben oder gedeihen. Bezogen auf eine Waffe bezeichnet es deren Wirksamkeit.
- source_word: לָשׁוֹן
  choice: Zunge
  rationale: Die konkrete Metapher des Hebräischen bleibt erhalten und bezeichnet hier feindliche Rede beziehungsweise Anklage.
- source_word: לַמִּשְׁפָּט
  choice: im Gericht
  rationale: Die Wendung kennzeichnet einen rechtlichen Zusammenhang, ohne ihn auf einen modernen Gerichtssaal zu verengen.
- source_word: תַּרְשִׁיעִי
  choice: wirst du verurteilen
  rationale: Der Hifil von רשע bedeutet, jemanden für schuldig zu erklären oder zu verurteilen. Die Übersetzung wahrt den forensischen Sinn.
- source_word: נַחֲלַת
  choice: Erbteil
  rationale: Das Wort bezeichnet einen ererbten oder zugeteilten Besitz beziehungsweise Anteil. „Erbteil“ passt zum bundesbezogenen Ton der Aussage.
- source_word: עַבְדֵי
  choice: Diener
  rationale: In der Verbindung „Diener Jahwes“ fungiert das Wort als Bezeichnung für Menschen, die Jahwe gehören und ihm dienen; der Kontext betont nicht ihren rechtlichen Sklavenstatus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִדְקָתָם
  choice: ihre Gerechtigkeit
  rationale: Das Wort gehört zum hebräischen Wortfeld von Gerechtigkeit, kann im rechtlichen Kontext aber auch die von Gott gewährte Rechtfertigung oder Bestätigung des Rechts bezeichnen. Der Grundbegriff bleibt im Haupttext erhalten; die forensische Nuance steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von צִדְקָתָם im Schlusssatz
  choice: ihre Gerechtigkeit kommt von mir
  alternative: ihre Rechtfertigung kommt von mir
  rationale: Der hebräische Ausdruck kann sowohl Gerechtigkeit als auch forensische Rechtfertigung beziehungsweise Bestätigung des Rechts bezeichnen. Der Haupttext bewahrt den üblichen Grundbegriff, während die Fußnote die durch den Gerichtskontext nahegelegte Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt im Singular. Die Bilder „Waffe“ und „Zunge“ sowie der Wechsel vom militärischen zum rechtlichen Bereich werden bewahrt. Die Fußnotenmarker stehen jeweils unmittelbar bei der mehrdeutigen Aussage.
