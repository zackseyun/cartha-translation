  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: de
  text: Fürchte dich nicht[a], denn du wirst nicht beschämt werden[b]. Sei nicht beschämt, denn du wirst nicht zuschanden werden. Denn die Schande deiner Jugend wirst du vergessen, und an die Schmach deiner Witwenschaft wirst du nicht mehr denken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hab keine Angst.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du wirst nicht zuschanden werden«. Die mehreren hebräischen Wörter für Scham, Schande und Demütigung überschneiden sich in ihrer Bedeutung und unterstreichen, dass Zions öffentliche Schmach endet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Fürchte dich nicht
  rationale: Die verneinte Aufforderung richtet sich an das als Frau personifizierte Zion. Die Formulierung ist prägnant, würdevoll und im modernen Deutschen verständlich.
- source_word: תֵבוֹשִׁי
  choice: du wirst nicht zuschanden werden
  rationale: 'בושׁ bezeichnet hier mehr als ein inneres Schamgefühl: Zion wird nicht öffentlich beschämt oder in seiner Hoffnung enttäuscht dastehen. „Zuschanden werden“ bewahrt diese soziale und resultative Bedeutung.'
- source_word: תִּכָּלְמִי
  choice: Schäme dich nicht
  rationale: Das Nifal von כלם kann Beschämung und empfundenes Schamgefühl ausdrücken. Die natürliche deutsche Aufforderung erhält den Parallelismus, ohne die eng verwandten hebräischen Schambegriffe völlig gleichzusetzen.
- source_word: תַחְפִּירִי
  choice: du wirst nicht erniedrigt werden
  rationale: חפר im Hifil bezeichnet hier Schmach oder Demütigung. „Erniedrigt werden“ gibt die öffentliche Herabsetzung wieder und unterscheidet sich sprachlich von „zuschanden werden“.
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: die Schande deiner Jugend
  rationale: Die Wendung bezeichnet die mit Zions früherer Lebensphase verbundene Schande und wahrt das durchgehende Bild einer Frau.
- source_word: תִּשְׁכָּחִי
  choice: wirst du vergessen
  rationale: Die einfache Zukunftsform entspricht dem Verheißungscharakter des Zusammenhangs.
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: die Schmach deiner Witwenschaft
  rationale: חֶרְפָּה trägt den sozialen Sinn von Schmach, Hohn oder öffentlicher Verachtung. „Witwenschaft“ bewahrt das bedeutsame Ehebild des Kapitels.
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: wirst du nicht mehr denken
  rationale: Mit „an … denken“ wird das hebräische Erinnern im Deutschen idiomatisch wiedergegeben; „nicht mehr“ bewahrt die zeitliche Aussage von עוֹד.
theological_decisions:
- issue: Bezug der feminin-singularischen Anrede
  choice: Zion beziehungsweise Jerusalem wird als Frau angeredet, ohne den Namen ergänzend in den Vers einzutragen.
  alternative: Anrede an eine nicht näher bestimmte einzelne Frau
  rationale: Der unmittelbare Zusammenhang von Jesaja 54 verwendet Ehe-, Verlassenheits- und Witwenschaftsbilder für Zion. Die zweite Person und die weibliche Bildsprache bleiben erhalten, während die Übersetzung den Bezug nicht erklärend in den Haupttext einfügt.
- issue: Ehebild in „Witwenschaft“
  choice: Das Bild wird wörtlich als „Witwenschaft“ bewahrt.
  alternative: Deutende Wiedergaben wie „Verlassenheit“ oder „Verödung“
  rationale: Das Ehebild trägt die theologische Spannung zwischen früherer Verlassenheit und erneuerter Zuwendung. Eine abstrakte Umschreibung würde diese Bildwelt vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Die dicht gestaffelte Scham-Terminologie des Hebräischen wird durch verwandte, aber nicht völlig identische deutsche Ausdrücke wiedergegeben; das Bild von Jugend und Witwenschaft bleibt unverändert erhalten.
