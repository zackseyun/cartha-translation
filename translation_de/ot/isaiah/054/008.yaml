base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: de
  text: In einem Aufwallen des Zorns verbarg ich mein Angesicht einen Augenblick lang vor dir[a]; doch mit ewiger Güte[b] habe ich mich deiner erbarmt, spricht Jahwe, dein Erlöser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In überströmendem Zorn“ oder „In einem Ausbruch des Zorns“. Der seltene hebräische Ausdruck verstärkt die Vorstellung heftigen Zorns.'
    reason: lexical_alternative
  - marker: b
    text: „Ewige Güte“ kann auch mit „ewige treue Liebe“ oder „ewige Bundestreue“ wiedergegeben werden. Das hebräische Wort חֶסֶד umfasst Güte, Barmherzigkeit, Treue und verlässliche Liebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: In einem Aufwallen des Zorns
  rationale: Die seltene Verbindung zweier Substantive verstärkt den Zorn und bezeichnet wahrscheinlich einen heftigen, kurzzeitigen Ausbruch. „Aufwallen des Zorns“ bewahrt die knappe poetische Kraft und die erkennbare lexikalische Unsicherheit.
- source_word: הִסְתַּרְתִּי פָנַי
  choice: verbarg ich mein Angesicht
  rationale: Die direkte Wiedergabe erhält das hebräische Bild vom Entzug göttlicher Zuwendung; „Angesicht“ passt zum würdevollen poetischen Register.
- source_word: רֶגַע
  choice: einen Augenblick lang
  rationale: Bezeichnet eine sehr kurze Zeit und bildet den beabsichtigten Gegensatz zur ewigen Güte.
- source_word: וּבְחֶסֶד עוֹלָם
  choice: doch mit ewiger Güte
  rationale: „Güte“ gibt חֶסֶד natürlich wieder, ohne den im Wort enthaltenen Zusammenhang von beständiger Liebe, Barmherzigkeit und Treue auf eine einzige Deutung zu verengen.
- source_word: רִחַמְתִּיךְ
  choice: habe ich mich deiner erbarmt
  rationale: Die idiomatische deutsche Formulierung bringt das tiefe Erbarmen von רחם präzise und würdevoll zum Ausdruck.
- source_word: גֹּאֲלֵךְ
  choice: dein Erlöser
  rationale: Der Titel bewahrt die rechtlich-familiären und rettenden Anklänge von גאל, ohne die Bedeutung durch „Löser aus der Verwandtschaft“ unnötig einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: ewige Güte
  alternative: ewige beständige Liebe; ewige Bundestreue
  rationale: Der Vers stellt den kurzzeitigen Zorn der dauerhaften, erbarmenden Zuwendung Gottes gegenüber. „Güte“ lässt die Aspekte von Liebe, Barmherzigkeit und Treue zusammenklingen, ohne „Bund“ ausdrücklich in den Text einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der hebräische Text den Gottesnamen verwendet, erhält die Übersetzung den persönlichen Namen statt ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher und theologischer Kontrast
  choice: einen Augenblick lang … mit ewiger Güte
  alternative: kurz … in immerwährender Liebe
  rationale: Die Übersetzung bewahrt den starken Gegensatz zwischen dem vorübergehenden Verbergen des Angesichts und dem dauerhaften Erbarmen, ohne die Spannung zwischen Zorn und Güte aufzulösen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Angesicht“ und „Erlöser“ erhalten den biblisch-poetischen Ton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Der zweite Fußnotenmarker steht nach dem vollständigen Redeeinschub, bezieht sich aber ausdrücklich auf „ewige Güte“.
