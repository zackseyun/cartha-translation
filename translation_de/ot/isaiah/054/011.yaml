  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: de
  text: Du Elende, vom Sturm Gepeitschte, die keinen Trost erfahren hat! Siehe, ich bette deine Steine in Antimon[a] und lege deine Fundamente mit Saphiren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In Antimon“ meint wahrscheinlich ein dunkles Material, in das die Steine als Schmuck eingebettet werden; möglich ist auch dunkler Mörtel oder eine Einlage.
    reason: cultural_note
  - marker: b
    text: 'Oder: „mit Lapislazuli“. Das hebräische Wort bezeichnet vermutlich einen blauen Edelstein, möglicherweise nicht den heutigen Saphir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: du Elende
  rationale: Das feminine Singularadjektiv steht als direkte Anrede der personifizierten Stadt Zion/Jerusalem. „Du Elende“ ist knapp, würdevoll und bewahrt die persönliche Anrede.
- source_word: סֹעֲרָה
  choice: vom Sturm Gepeitschte
  rationale: Das Partizip beschreibt eine vom Sturm heftig bedrängte Person. Die Formulierung erhält das Bild und stimmt grammatisch mit der femininen Anrede überein.
- source_word: לֹא נֻחָמָה
  choice: die keinen Trost fand
  rationale: Das passive Verb bedeutet wörtlich „nicht getröstet“. Die gewählte idiomatische Form gibt den Zustand natürlich wieder, ohne dessen Ursache näher festzulegen.
- source_word: הִנֵּה
  choice: Siehe
  rationale: „Siehe“ bewahrt den Nachdruck der prophetischen Gottesrede und passt zum würdevollen Register.
- source_word: מַרְבִּיץ
  choice: ich bette … ein
  rationale: Das Hifil-Partizip bezeichnet hier das Platzieren der Steine in einem Material. Das Präsens nach „Siehe“ vermittelt die anschaulich angekündigte, unmittelbar bevorstehende Handlung.
- source_word: בַּפּוּךְ
  choice: in Antimon
  rationale: פּוּךְ bezeichnet gewöhnlich Antimon beziehungsweise ein dunkles kosmetisches Mineral. Im Baubild dürfte es als Einbettungs-, Fugen- oder Schmuckmaterial gedacht sein; die Übersetzung bewahrt den konkreten, aber nicht völlig sicheren Stoffbezug.
- source_word: אֲבָנַיִךְ
  choice: deine Steine
  rationale: Die gewöhnliche Bedeutung „Steine“ hält das architektonische Bild klar und vermeidet die Überdeutung als Edelsteine.
- source_word: וִיסַדְתִּיךְ
  choice: und gründe dich
  rationale: Die direkte Objektform bedeutet wörtlich, dass Gott die angeredete Stadt gründet beziehungsweise ihr Fundament legt. „Gründe dich“ bewahrt Personifikation und Satzbau besser als eine ausdrücklich ergänzte Mehrzahl „Fundamente“.
- source_word: בַּסַּפִּירִים
  choice: auf Saphiren
  rationale: סַפִּירִים bezeichnet blaue kostbare Steine, deren genaue mineralogische Identität unsicher ist. „Saphire“ wahrt die traditionelle Bezeichnung; „auf“ macht im Deutschen die Funktion als Fundamentmaterial verständlich.
theological_decisions:
- issue: Identität der Angeredeten
  choice: Personifiziertes Zion beziehungsweise Jerusalem als feminine Singularperson
  alternative: Eine beliebige leidende Frau oder allgemeiner die Bundesgemeinschaft
  rationale: Die femininen Singularformen und der Zusammenhang von Jesaja 54 sprechen für die personifizierte Stadt. Der Text nennt sie jedoch nicht ausdrücklich im Vers; daher wird der Name nicht in die Übersetzung eingefügt.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit direkter femininer Anrede. „Siehe“ hält den feierlichen Nachdruck; die ungewöhnlichen Baustoffe bleiben erhalten und werden durch Fußnoten erläutert.
