base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: de
  text: Ich werde deine Zinnen[a] aus Rubinen[b] machen, deine Tore aus funkelnden Steinen[c] und deine gesamte Begrenzung[d] aus kostbaren Steinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch „Fenster“ oder „Brustwehren“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet wahrscheinlich einen roten oder leuchtenden Edelstein; auch „Granat“ oder „roter Jaspis“ sind möglich.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein hell glänzender oder feurig wirkender Edelstein; ältere Übersetzungen nennen ihn oft „Karfunkel“.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „dein ganzes Grenzgebiet“. Im Bild der wiederaufgebauten Stadt kann eine bauliche Einfassung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ich mache
  rationale: שׂים kann „setzen“, „anbringen“ oder im Bauzusammenhang „machen“ bedeuten. „Ich mache“ gibt die gestaltende Handlung natürlich wieder.
- source_word: כַּדְכֹד
  choice: Rubinen
  rationale: Die genaue Bestimmung des vermutlich roten oder glänzenden Edelsteins ist unsicher. „Rubinen“ ist eine traditionelle, plausible Wiedergabe; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: שִׁמְשֹׁתַיִךְ
  choice: deine Zinnen
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich ein auffälliges Bauelement. „Zinnen“ passt zum Zusammenhang von Toren und Stadtbegrenzung, ohne die unsichere Deutung „Fenster“ in den Haupttext zu übernehmen.
- source_word: וּשְׁעָרַיִךְ
  choice: deine Tore
  rationale: Im Zusammenhang einer Stadt ist dies die übliche und eindeutige Bedeutung von שַׁעַר.
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: aus funkelnden Steinen
  rationale: אֶקְדָּח bezeichnet offenbar einen hell glänzenden oder feurig wirkenden Schmuckstein, dessen mineralogische Identität unbekannt ist. Die funktionale Beschreibung vermeidet Scheingenauigkeit.
- source_word: וְכָל גְּבוּלֵךְ
  choice: deine ganze Umgrenzung
  rationale: גְּבוּל kann Grenze, Gebiet oder Grenzanlage bedeuten. „Umgrenzung“ wahrt diese Spannweite und fügt sich in das architektonische Bild, ohne ausdrücklich eine Mauer vorauszusetzen.
- source_word: לְאַבְנֵי חֵפֶץ
  choice: aus kostbaren Steinen
  rationale: Wörtlich sind es begehrte oder wertgeschätzte Steine. „Kostbare Steine“ bringt ihren hohen Wert und ihre Schönheit in natürlichem Deutsch zum Ausdruck.
