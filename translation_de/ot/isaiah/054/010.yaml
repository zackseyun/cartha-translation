id: ISA.54.10
reference: Isaiah 54:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: de
  text: Denn mögen auch die Berge weichen und die Hügel wanken[a], meine beständige Liebe[b] wird nicht von dir weichen, und mein Bund des Friedens[c] wird nicht wanken, spricht Jahwe, der sich über dich erbarmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wanken“ gibt ein anderes hebräisches Verb wieder als „weichen“; gemeint ist, den festen Stand zu verlieren oder erschüttert zu werden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet auch verlässliche Güte, loyale Liebe oder Bundestreue.
    reason: lexical_alternative
  - marker: c
    text: „Frieden“ umfasst hier auch Wohlergehen, Unversehrtheit und umfassendes Heil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn mögen auch
  rationale: כִּי knüpft begründend an den Zusammenhang an; zusammen mit den folgenden Verbformen gibt „Denn mögen auch“ die zugespitzte Einräumung natürlich wieder.
- source_word: הֶהָרִים
  choice: die Berge
  rationale: Gibt den bestimmten Artikel und das Bild scheinbar unverrückbarer Schöpfungsgrößen wieder.
- source_word: יָמוּשׁוּ
  choice: weichen
  rationale: מוּשׁ bezeichnet ein Sich-Entfernen oder Weichen. Dasselbe deutsche Verb erscheint später bei Gottes Liebe und bewahrt so die hebräische Wiederholung.
- source_word: הַגְּבָעוֹת תְּמוּטֶנָה
  choice: die Hügel wanken
  rationale: מוֹט bezeichnet den Verlust festen Standes. „Wanken“ wahrt den Unterschied zu מוּשׁ und lässt sich bei den Hügeln wie beim Bund verwenden.
- source_word: וְחַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד verbindet Liebe und Güte mit Verlässlichkeit und Loyalität. „Beständige Liebe“ bringt hier besonders den Kontrast zum Weichen der Berge zum Ausdruck, ohne den Begriff auf nur einen Aspekt einzuengen.
- source_word: מֵאִתֵּךְ
  choice: von dir
  rationale: Gibt die im Hebräischen bezeichnete Trennung von der weiblich singularisch angeredeten Gestalt Zion/Jerusalem knapp und idiomatisch wieder.
- source_word: וּבְרִית שְׁלוֹמִי
  choice: und mein Bund des Friedens
  rationale: Bewahrt sowohl בְּרִית als „Bund“ als auch שָׁלוֹם als „Frieden“; die Fußnote weist auf dessen weiteren Bedeutungsumfang hin.
- source_word: לֹא תָמוּט
  choice: wird nicht wanken
  rationale: Wiederholt bewusst das für תְּמוּטֶנָה gewählte Verb und erhält dadurch die Parallelstruktur des Hebräischen.
- source_word: אָמַר
  choice: spricht
  rationale: Die prophetische Botenformel wird im Deutschen idiomatisch mit dem präsentischen „spricht“ wiedergegeben.
- source_word: מְרַחֲמֵךְ
  choice: der sich über dich erbarmt
  rationale: Die partizipiale Form beschreibt Jahwe als den, der der Angeredeten fortdauernd Erbarmen erweist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Bundestreue; Güte; loyale Liebe
  rationale: Die Wendung hält Zuneigung, Güte und verlässliche Treue zusammen. Der unmittelbar folgende Bund unterstreicht den Bundesbezug, ohne dass dieser bereits in die Übersetzung des Wortes hineingelesen werden muss.
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Frieden
  alternative: Wohlergehen; Heil; Unversehrtheit
  rationale: „Frieden“ ist die natürliche und intertextuell erkennbare Wiedergabe; eine Fußnote bewahrt den umfassenderen Sinn von שָׁלוֹם.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die Transliteration bewahrt diese Unterscheidung gegenüber einem Herrschaftstitel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelismen und die Wiederholung von „weichen“ beziehungsweise „wanken“ bilden die hebräische Struktur ab. Die feminine Singularanrede an Zion/Jerusalem ist im deutschen „dir“ nicht eigens markiert.
