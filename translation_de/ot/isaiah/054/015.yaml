base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: de
  text: Siehe[a], wenn sich jemand zusammenrottet, geht das nicht von mir aus[b]. Wer sich gegen dich zusammenrottet, wird deinetwegen fallen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geschieht es nicht durch mich“; auch möglich: „geschieht es ohne mich“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „wird auf dich fallen“ oder „wird gegen dich fallen“; sinngemäß möglicherweise: „wird vor dir fallen“ oder „wird an dir zu Fall kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Aussage ein. „Siehe“ bewahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: גּוֹר יָגוּר
  choice: wenn sich jemand zusammenrottet
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt die Aussage. גור ist mehrdeutig, bezeichnet hier im Zusammenhang aber am ehesten ein feindliches Zusammenkommen; „sich zusammenrotten“ gibt dies wieder, ohne einen ausdrücklich militärischen Angriff vorauszusetzen.
- source_word: אֶפֶס מֵאוֹתִי
  choice: geht das nicht von mir aus
  rationale: Die Formulierung verneint Gott als Ursprung beziehungsweise Urheber des feindlichen Vorgehens, bleibt aber offen genug, um die mögliche Nuance „nicht durch mich“ einzuschließen.
- source_word: מִי גָר אִתָּךְ
  choice: Wer sich gegen dich zusammenrottet
  rationale: מִי hat hier verallgemeinernde Kraft. אִתָּךְ bedeutet wörtlich „mit dir“, bezeichnet im Zusammenhang jedoch eine feindliche Ausrichtung; im Deutschen macht „gegen dich“ diese Beziehung eindeutig und natürlich.
- source_word: עָלַיִךְ יִפּוֹל
  choice: wird deinetwegen fallen
  rationale: Die Verbindung von נפל mit על lässt mehrere Deutungen zu. „Deinetwegen fallen“ hält den Bezug zu Zion fest und drückt im Schutz- und Rechtfertigungskontext den Untergang des Gegners aus, ohne die räumliche Wendung „auf dich fallen“ missverständlich als erfolgreichen Angriff wiederzugeben.
theological_decisions:
- issue: Ob die feindliche Zusammenrottung gegen Zion von Gott ausgeht
  choice: Die Aussage verneint Gott als Ursprung des feindlichen Vorgehens.
  alternative: Die Wendung könnte enger als „nicht durch mich“ oder „ohne meine Mitwirkung“ verstanden werden.
  rationale: מֵאוֹתִי bezeichnet gewöhnlich Herkunft oder Ausgangspunkt. Die Übersetzung bewahrt diese Aussage, ohne darüber hinaus eine systematische Behauptung über Gottes Vorsehung zu formulieren.
- issue: Bedeutung des angekündigten Fallens
  choice: Der Gegner wird infolge seines Vorgehens gegen Zion zu Fall kommen.
  alternative: Die Wendung kann wörtlicher als „wird auf/gegen dich fallen“ oder sinngemäß als „wird vor dir fallen“ verstanden werden.
  rationale: Der nähere Zusammenhang verheißt Zion Schutz und Rechtfertigung. Zugleich wird die sprachliche Mehrdeutigkeit von עָלַיִךְ in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich zusammenrotten“ bildet die feindliche, zugleich lexikalisch nicht ausschließlich militärische Handlung ab. Die feminine Singularanrede an Zion wird im Deutschen mit „dich“ wiedergegeben. Sämtliche echten Deutungsalternativen werden in knappen Fußnoten sichtbar gemacht.
