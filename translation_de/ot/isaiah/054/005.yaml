source:
  edition: WLC
  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: de
  text: Denn dein Ehemann ist dein Schöpfer[a] – Jahwe der Heere ist sein Name. Dein Erlöser ist der Heilige Israels; als Gott der ganzen Erde wird er genannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen „Ehemann“ und „Schöpfer“ grammatisch im Plural; der folgende Gottesname und das Pronomen sind Singular.
    reason: source_form
  - marker: b
    text: 'Oder: „Als Gott der ganzen Erde wird er genannt werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Zusage. „Denn“ gibt diese erklärende Verknüpfung im Deutschen knapp und natürlich wieder.
- source_word: בֹעֲלַיִךְ
  choice: dein Ehemann
  rationale: Im Bild von Zion als Frau ist die eheliche Bedeutung von בעל vorrangig. „Ehemann“ bewahrt die ausdrückliche Beziehungsmetapher und vermeidet die Verengung auf „Herr“ oder „Gebieter“.
- source_word: עֹשַׂיִךְ
  choice: dein Schöpfer
  rationale: Das Partizip von עשה bezeichnet hier den, der Zion gemacht hat, und hat titelartigen Charakter. „Schöpfer“ ist würdig, verständlich und knapp.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: „Heere“ vermittelt den militärischen Grundsinn des Titels im heutigen Deutsch klarer als das traditionelle, inzwischen weniger geläufige „Heerscharen“.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die Namensformel wird in natürlicher deutscher Wortstellung bewahrt und erhält ihren feierlichen Klang.
- source_word: וְגֹאֲלֵךְ
  choice: dein Erlöser
  rationale: גאל trägt Vorstellungen von Befreiung und verwandtschaftlicher Einlösung. „Erlöser“ ist hier der verständliche etablierte Titel, ohne die Verwandtschaftsnuance übermäßig auszudeuten.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Der feste jesajanische Gottestitel wird nah an seiner hebräischen Form und konsistent wiedergegeben.
- source_word: אֱלֹהֵי כָל־הָאָרֶץ
  choice: Gott der ganzen Erde
  rationale: Die Formulierung bewahrt die Aussage von Gottes umfassender, weltweiter Hoheit in idiomatischem Deutsch.
- source_word: יִקָּרֵא
  choice: wird er genannt
  rationale: Das Nifal-Imperfekt kann in diesem Zusammenhang eine gegenwärtig gültige Benennung ausdrücken. Das deutsche Präsenspassiv „wird genannt“ gibt dies natürlich wieder; die mögliche futurische Auffassung wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Ehemetapher für das Verhältnis Jahwes zu Zion
  choice: Die ausdrückliche Formulierung „dein Ehemann“ wird beibehalten.
  alternative: „dein Herr“ oder „dein Gebieter“
  rationale: Der Kontext spricht Zion als Frau an; die eheliche Bedeutung bewahrt die relationale und bundestheologische Bildsprache, ohne sie durch spätere Lehrsysteme näher festzulegen.
- issue: Wiedergabe von יְהוָה צְבָאוֹת
  choice: „Jahwe der Heere“
  alternative: „der HERR der Heerscharen“
  rationale: Der Eigenname bleibt sichtbar, und „Heere“ macht den Sinn von צבאות heutigen Leserinnen und Lesern unmittelbar verständlich.
- issue: Zeitbezug von יִקָּרֵא
  choice: 'Gegenwärtig gültige Benennung: „wird er genannt“'
  alternative: 'Zukünftige Benennung: „wird er genannt werden“'
  rationale: Das hebräische Imperfekt lässt je nach Kontext eine gegenwärtig-allgemeine oder zukünftige Deutung zu. Der Haupttext wählt die im Titelsatz natürliche gegenwärtige Lesart, während die Fußnote die Zukunftsdeutung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Gedankenstrich bildet die eingeschobene Namensformel ab. Die weibliche Anrede an Zion bleibt durch „dein“ semantisch erhalten, auch wenn das Deutsche am Possessivpronomen kein weibliches Geschlecht markiert.
