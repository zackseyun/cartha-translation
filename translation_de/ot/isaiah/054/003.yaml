source:
  edition: WLC
  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
translation:
  language: de
  text: Denn du wirst dich nach rechts und nach links ausbreiten, und deine Nachkommen werden Nationen in Besitz nehmen[a] und verödete Städte besiedeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nationen beerben“ beziehungsweise „Nationen verdrängen“. Das hebräische Verb kann je nach Zusammenhang erben, besitzen, in Besitz nehmen oder verdrängen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „verödete Städte bewohnen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zusage beziehungsweise Aufforderung ein und bewahrt den Zusammenhang mit dem Kontext.
- source_word: יָמִין וּשְׂמֹאול
  choice: nach rechts und nach links
  rationale: Bewahrt das konkrete räumliche Bild, das eine Ausbreitung in beide Richtungen bezeichnet, ohne es unbegründet als Himmelsrichtungen auszulegen.
- source_word: תִּפְרֹצִי
  choice: du wirst dich … ausbreiten
  rationale: פרץ bezeichnet ein Hervorbrechen oder Durchbrechen; im Zusammenhang der räumlichen Erweiterung gibt „sich ausbreiten“ den Sinn natürlich wieder, ohne die kraftvolle Bewegung völlig aufzugeben.
- source_word: וְזַרְעֵךְ
  choice: deine Nachkommen
  rationale: זֶרַע ist hier kollektiv gebraucht. „Nachkommen“ ist im modernen Deutsch natürlich und wahrt den kollektiven Bezug.
- source_word: גּוֹיִם
  choice: Nationen
  rationale: Gibt גּוֹיִם unmittelbar wieder und vermeidet, durch „Heiden“ einen späteren religiösen Gegensatz in den Text einzutragen.
- source_word: יִירָשׁ
  choice: werden … in Besitz nehmen
  rationale: ירשׁ kann erben, besitzen, in Besitz nehmen oder verdrängen bedeuten. Mit „Nationen“ als Objekt wahrt „in Besitz nehmen“ die konkrete territoriale Aussage, ohne die mögliche Verdrängung ausdrücklich festzulegen.
- source_word: עָרִים נְשַׁמּוֹת
  choice: verödete Städte
  rationale: נְשַׁמּוֹת beschreibt unbewohnte beziehungsweise verwüstete Orte. „Verödet“ verbindet den Zustand der Verwüstung mit der anschließenden Wiederbesiedlung.
- source_word: יוֹשִׁיבוּ
  choice: wieder besiedeln
  rationale: 'Der Hifil von ישׁב ist kausativ: Die Städte werden wieder zu bewohnten Orten gemacht. „Wieder besiedeln“ drückt dieses Ergebnis in natürlichem Deutsch aus.'
theological_decisions:
- issue: Bedeutung von ירשׁ mit גּוֹיִם als Objekt
  choice: Nationen in Besitz nehmen
  alternative: Nationen beerben oder Nationen verdrängen
  rationale: Die Formulierung bewahrt die konkrete Verheißung von Ausweitung und Besitzergreifung. Da ירשׁ sowohl Besitz beziehungsweise Erbe als auch die Verdrängung bisheriger Besitzer bezeichnen kann, wird die stärkere Deutung „verdrängen“ nicht stillschweigend in den Haupttext aufgenommen, sondern als lexikalische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die räumliche Bildsprache bleibt konkret; schwerfällige Wörtlichkeit und konfessionell geprägte Begriffe werden vermieden.
