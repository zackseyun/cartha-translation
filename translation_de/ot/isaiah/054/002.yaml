base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: de
  text: Erweitere den Platz für dein Zelt, und lass die Zeltdecken deiner Wohnstätten ausspannen; halte dich nicht zurück.[a] Verlängere deine Seile und mach deine Pflöcke fest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „spare nicht“ beziehungsweise „halte nichts zurück“.'
    reason: lexical_alternative
  - marker: b
    text: Die Zeltdecken sind die Stoffbahnen eines Zeltes; die Pflöcke dienen dazu, seine Seile im Boden zu verankern.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: Erweitere
  rationale: Der Hifil-Imperativ fordert dazu auf, den verfügbaren Raum weit zu machen. „Erweitere“ ist im Deutschen natürlich und bewahrt die Befehlsform.
- source_word: מְקוֹם אָהֳלֵךְ
  choice: den Platz für dein Zelt
  rationale: Die konkrete Vorstellung eines für das Zelt bestimmten Platzes bleibt erhalten; „für“ gibt die deutsche Beziehung zwischen Platz und Zelt idiomatisch wieder.
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  choice: die Zeltdecken deiner Wohnstätten
  rationale: יריעות bezeichnet die Stoffbahnen beziehungsweise Decken eines Zeltes. „Wohnstätten“ wahrt den Plural von משכן und vermeidet die kultisch verengende Wiedergabe „Stiftshütten“.
- source_word: יַטּוּ
  choice: lass … ausspannen
  rationale: Der Hifil-Imperfekt hat hier auffordernde Kraft. Die deutsche Konstruktion gibt das Ausbreiten beziehungsweise Spannen der Zeltdecken natürlich wieder, ohne einen im Hebräischen nicht genannten Handelnden festzulegen.
- source_word: אַל תַּחְשֹׂכִי
  choice: halte dich nicht zurück
  rationale: חשׂך kann „zurückhalten“, „sparen“ oder „schonen“ bedeuten. Im Zusammenhang der großzügigen Erweiterung ist „halte dich nicht zurück“ idiomatisch, während die Alternativen in einer Fußnote bewahrt werden.
- source_word: הַאֲרִיכִי מֵיתָרַיִךְ
  choice: Verlängere deine Seile
  rationale: Der Hifil-Imperativ von ארך bedeutet „lang machen“. „Verlängere“ gibt dies direkt wieder; מיתר bezeichnet hier die Seile eines Zeltes.
- source_word: וִיתֵדֹתַיִךְ חַזֵּקִי
  choice: mach deine Pflöcke fest
  rationale: יתד bezeichnet im Zeltbild einen Pflock. Der Piel-Imperativ von חזק verlangt, ihn stark beziehungsweise fest zu machen; die gewählte Formulierung ist konkret und idiomatisch.
theological_decisions:
- issue: Bildhafte Sprache von Zelt und Wohnstätten für Zion
  choice: Das Zeltbild wird im Haupttext konkret beibehalten.
  alternative: Die Aussage als Bevölkerungswachstum, Heimkehr oder Wiederherstellung ausdeuten und entsprechend paraphrasieren.
  rationale: Der hebräische Text entfaltet seine Zusage durch konkrete Aufforderungen aus dem Zeltbau. Ihre weitergehende Bedeutung soll sich aus dem Zusammenhang ergeben und nicht bereits durch die Übersetzung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Imperativen. Die konkrete prophetische Bildsprache bleibt erhalten; fachsprachliche oder konfessionell geprägte Ausdrücke werden vermieden.
