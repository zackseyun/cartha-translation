source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: de
  text: 'Denn dies ist für mich wie die Wasser Noahs: Wie ich geschworen habe, dass die Wasser Noahs nie wieder über die Erde strömen werden,[a] so habe ich geschworen, dir nicht zu zürnen und dich nicht zu schelten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist elliptisch und kann auch wiedergegeben werden: »Denn dies ist für mich wie die Wasser Noahs.« Der hebräische Text hat »Wasser Noahs«; einige alte Textzeugen und davon beeinflusste Übersetzungen lesen »Tage Noahs«.'
    reason: Erläutert die elliptische Formulierung und die textliche Variantenlage, ohne die masoretische Lesung im Haupttext zu verändern.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zusage ein und bewahrt den argumentativen Zusammenhang.
- source_word: מֵי נֹחַ
  choice: die Wasser Noahs
  rationale: Gibt die hebräische Genitivverbindung wörtlich und verständlich wieder, ohne sie zu »Tage Noahs« zu ändern.
- source_word: זֹאת לִי
  choice: dies ist für mich wie
  rationale: Die hebräische Formulierung ist elliptisch; »wie« macht den durch אֲשֶׁר … כֵּן getragenen Vergleich im Deutschen verständlich.
- source_word: אֲשֶׁר … כֵּן
  choice: Wie … so
  rationale: Bildet die vergleichende Satzstruktur im Deutschen natürlich und präzise ab.
- source_word: נִשְׁבַּעְתִּי
  choice: ich geschworen habe / ich habe geschworen
  rationale: Bewahrt die feierliche Sprache des göttlichen Eides und passt die Wortstellung an die deutsche Syntax an.
- source_word: מֵעֲבֹר … עַל הָאָרֶץ
  choice: über die Erde strömen werden
  rationale: עבר bezeichnet das Hinüber- oder Darübergehen; bei Flutwasser gibt »strömen« die Bewegung natürlich wieder, während »über die Erde« die globale Anspielung offenhält.
- source_word: עוֹד
  choice: nie wieder
  rationale: Drückt im Zusammenhang des Eides die ausgeschlossene Wiederholung klar aus.
- source_word: מִקְּצֹף עָלַיִךְ
  choice: dir nicht mehr zu zürnen
  rationale: קצף bezeichnet starken Zorn. »zürnen« ist würdig und prägnant; »nicht mehr« gibt die im Eidzusammenhang implizite Negation samt Wiederholungsaspekt wieder.
- source_word: וּמִגְּעָר בָּךְ
  choice: und dich nicht zu schelten
  rationale: גער bedeutet zurechtweisen oder schelten. »schelten« bewahrt die direkte verbale Parallelität und einen würdigen biblischen Ton.
theological_decisions:
- issue: Elliptischer Vergleich in זֹאת לִי
  choice: Denn dies ist für mich wie die Wasser Noahs
  alternative: Denn dies ist für mich wie die Tage Noahs
  rationale: Der masoretische Text liest ausdrücklich »Wasser Noahs«. Das ergänzte »wie« verdeutlicht lediglich den im Hebräischen elliptisch ausgedrückten Vergleich.
- issue: Negativer Sinn der Eidkonstruktion mit מִן und Infinitiv
  choice: so habe ich geschworen, dir nicht mehr zu zürnen und dich nicht zu schelten
  alternative: so habe ich geschworen, dass ich dir nicht zürnen und dich nicht schelten werde
  rationale: Die deutsche Fassung macht die im hebräischen Eid syntaktisch enthaltene Verneinung ausdrücklich, ohne die Reichweite der Zusage theologisch weiterzubestimmen.
- issue: Bezug von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Im Zusammenhang mit Noah liegt »Erde« näher; zugleich wird die Aussage nicht durch zusätzliche Erläuterungen über den Umfang der Flut erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Wasser Noahs« erhält bewusst die ungewöhnliche Bildsprache des Hebräischen; »zürnen« und »schelten« verleihen dem göttlichen Eid einen gehobenen, aber noch allgemein verständlichen Ton.
