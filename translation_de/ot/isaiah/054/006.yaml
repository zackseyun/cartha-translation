source:
  edition: WLC
  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: de
  text: Denn wie eine verlassene und innerlich betrübte Ehefrau[a] hat Jahwe dich gerufen – wie eine Ehefrau aus Jugendtagen, wenn sie verschmäht wird[b] –, sagt dein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie eine verlassene und innerlich betrübte Frau«. Das hebräische אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; der Zusammenhang legt »Ehefrau« nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wie eine Ehefrau der Jugendzeit, wenn sie verschmäht wird«. Die knappe hebräische Formulierung lässt auch Nuancen wie »obwohl sie verschmäht wurde« oder »die man verschmäht hat« zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zusage ein und entspricht dem Zusammenhang natürlich.
- source_word: כְאִשָּׁה
  choice: wie eine … Ehefrau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; das durchgehende Ehebild spricht hier für »Ehefrau«.
- source_word: עֲזוּבָה
  choice: verlassene
  rationale: Bewahrt die relationale Aussage des hebräischen Wortes und passt zum Ehebild.
- source_word: וַעֲצוּבַת רוּחַ
  choice: und innerlich tief betrübte
  rationale: Gibt die seelische Verletzung idiomatisch wieder, ohne רוּחַ unnötig auf den theologischen Fachbegriff »Geist« festzulegen.
- source_word: קְרָאָךְ
  choice: hat … dich gerufen
  rationale: Gibt die abgeschlossene Handlung mit gegenwärtiger Bedeutung wieder und bewahrt das Bild des Rufens, ohne ausdrücklich »zurückgerufen« hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: wie eine jung geheiratete Frau
  rationale: Bringt die hebräische Wendung »Frau der Jugendzeit« in natürlichem Deutsch zum Ausdruck, ohne die Frau bloß als jung zu charakterisieren.
- source_word: כִּי תִמָּאֵס
  choice: wenn sie verschmäht wird
  rationale: Bewahrt sowohl die passive Form als auch die mögliche zeitlich-bedingende Nuance von כִּי; »verschmäht« trägt die emotionale Schärfe des Ehebildes.
- source_word: אָמַר אֱלֹהָיִךְ
  choice: sagt dein Gott
  rationale: Entspricht der üblichen deutschen Wiedergabe der prophetischen Redeformel und erhält die Bundesbeziehung in »dein Gott«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen; seine Wiedergabe als »Jahwe« bewahrt diese persönliche und bundesbezogene Benennung.
- issue: Ehebild für Zion
  choice: Das Bild einer verlassenen und wieder gerufenen Ehefrau bleibt ausdrücklich erhalten.
  alternative: Verallgemeinerung zu »Frau« oder Auflösung in »Volk/Stadt«
  rationale: Der hebräische Vers beschreibt Zions Verhältnis zu Gott bewusst mit ehelicher Bildsprache; eine Auflösung würde seine theologische Spannung abschwächen.
- issue: Bedeutung von קרא im Zusammenhang
  choice: gerufen
  alternative: zurückgerufen; zu sich gerufen
  rationale: Der Kontext kann eine erneute Annahme nahelegen, doch das Verb selbst sagt lediglich »rufen«. Die Übersetzung fügt daher die Rückkehrbewegung nicht ausdrücklich hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Innerlich tief betrübt« vermeidet die heute steife Wendung »betrübten Geistes«, während »verschmäht« die poetische und relationale Schärfe wahrt. Die Gedankenstriche markieren den bildhaften Einschub, ohne die kompakte Struktur des hebräischen Verses völlig aufzulösen.
