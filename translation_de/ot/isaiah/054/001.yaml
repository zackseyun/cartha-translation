source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: de
  text: Juble, du Unfruchtbare, die du nicht geboren hast! Brich in Jubel aus und jauchze, du, die du keine Wehen hattest! Denn die Kinder der Vereinsamten sind zahlreicher[a] als die Kinder der verheirateten Frau, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen die Vergleichsaussage knapp: „Zahlreich sind die Kinder der Vereinsamten mehr als die Kinder der verheirateten Frau.“'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: רָנִּי
  choice: Juble
  rationale: Der feminine Singularimperativ von רנן fordert zu hörbarer, freudiger Äußerung auf. „Juble“ gibt dies im Deutschen natürlicher wieder als ein bloßes „Singe“ und wahrt den poetischen Aufruf.
- source_word: עֲקָרָה
  choice: du Unfruchtbare
  rationale: Die feminine Bezeichnung meint eine Frau, die keine Kinder bekommen kann. Die substantivierte Form bewahrt die direkte Anrede und bleibt knapp.
- source_word: לֹא יָלָדָה
  choice: die nicht geboren hat
  rationale: Die formal dritte Person Femininum beschreibt in Apposition die angeredete Frau. „Geboren hat“ gibt ילד hier klar und ohne zusätzliche Deutung wieder.
- source_word: פִּצְחִי רִנָּה
  choice: Brich in Jubel aus
  rationale: פצח bezeichnet das plötzliche Ausbrechen in einen Laut, רנה einen hellen Freudenruf oder Jubel. Die deutsche Wendung erhält Bildkraft und Sinn.
- source_word: וְצַהֲלִי
  choice: und jauchze
  rationale: צהל bezeichnet einen lauten, freudigen Ruf. „Jauchze“ ist knapp, verständlich und dem poetischen Parallelismus angemessen.
- source_word: לֹא חָלָה
  choice: die keine Wehen gehabt hat
  rationale: חול/חיל bezeichnet in diesem Zusammenhang das Sichwinden unter Geburtswehen. Die Formulierung ist modernes, unmittelbar verständliches Deutsch.
- source_word: כִּי רַבִּים
  choice: Denn zahlreicher sind
  rationale: רבים bildet zusammen mit dem folgenden vergleichenden מן eine kompakte Vergleichsaussage. „Zahlreicher“ macht diese syntaktische Beziehung im Deutschen deutlich.
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: die Kinder der verlassenen Frau
  rationale: בנים umfasst hier die Nachkommenschaft, nicht nur männliche Söhne. שׁוֹמֵמָה bezeichnet die vereinsamte oder verlassene Frau und steht im Bildkontrast zur verheirateten Frau.
- source_word: מִבְּנֵי בְעוּלָה
  choice: als die Kinder der verheirateten Frau
  rationale: Das Präfix מן markiert den Vergleich. בְּעוּלָה bezeichnet eine mit einem Mann verbundene beziehungsweise verheiratete Frau.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Botenformel wird im Deutschen idiomatisch mit „spricht“ wiedergegeben; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Frauenbilder
  choice: Die weiblichen Bezeichnungen bleiben als Bildsprache stehen
  alternative: Ausdeutung als Zion, Israel oder eine bestimmte Gemeinschaft im Vers selbst
  rationale: Der einzelne Vers nennt die angeredete beziehungsweise verglichene Größe nicht ausdrücklich. Eine identifizierende Ausdeutung würde den unmittelbaren Wortlaut übersteigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die wiederholte weibliche Anrede wird trotz leichter stilistischer Markiertheit beibehalten; unnötige konfessionelle oder allegorische Festlegungen werden vermieden.
