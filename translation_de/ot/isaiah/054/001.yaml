  to: Juble, du Unfruchtbare, die du nicht geboren hast! Brich in Jubel aus und jauchze, du, die du keine Wehen hattest! Denn die Kinder der Vereinsamten sind zahlreicher[a] als die Kinder der verheirateten Frau, spricht Jahwe.
