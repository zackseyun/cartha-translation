  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל בָּנַ֖יִ/ךְ לִמּוּדֵ֣י יְהוָ֑ה וְ/רַ֖ב שְׁל֥וֹם בָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: de
  text: Und alle deine Kinder[a] werden von Jahwe unterwiesen sein, und groß wird der Frieden[b] deiner Kinder sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Söhne«; das hebräische Wort kann Söhne im engeren Sinn oder Kinder allgemein bezeichnen. Dies gilt für beide Vorkommen im Vers.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für »Frieden« kann auch umfassendes Wohlergehen, Unversehrtheit oder Gedeihen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Und alle
  rationale: Die Konjunktion führt die Verheißung fort; כָּל bezeichnet hier in Verbindung mit dem Plural die Gesamtheit.
- source_word: בָּנַיִךְ / בָּנָיִךְ
  choice: deine Kinder
  rationale: בנים kann enger »Söhne« oder umfassender »Kinder« bezeichnen. Im Bild der als Frau angesprochenen Stadt Zion gibt »Kinder« ihre Nachkommenschaft beziehungsweise Bewohner kollektiv wieder, ohne die Aussage unnötig auf Männer zu beschränken.
- source_word: לִמּוּדֵי
  choice: werden … unterwiesen sein
  rationale: Die Form bezeichnet Menschen, die Unterweisung empfangen haben beziehungsweise von jemandem unterwiesen sind. Die deutsche Fügung gibt den prädikativen Sinn und den im Kontext verheißenen Zustand wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְרַב
  choice: und groß wird … sein
  rationale: Die vorangestellte Prädikatsangabe trägt poetischen Nachdruck; die deutsche Wortstellung bewahrt diesen Akzent.
- source_word: שְׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם bezeichnet Frieden und kann darüber hinaus umfassendes Wohlergehen, Unversehrtheit und Gedeihen einschließen. »Frieden« ist die direkte und kontextuell passende Hauptwiedergabe.
theological_decisions:
- issue: Bezug der »Kinder« in der an Zion gerichteten Verheißung
  choice: Die kollektive Bezeichnung »deine Kinder« bleibt ohne nähere heilsgeschichtliche Festlegung stehen.
  alternative: »deine Söhne« oder eine ausdrückliche Deutung als Bewohner, Israel oder Glaubensgemeinschaft
  rationale: Der hebräische Text spricht Zion beziehungsweise Jerusalem als Frau an und bezeichnet ihre Nachkommenschaft kollektiv. Die Übersetzung bewahrt dieses Bild, ohne den Bezug konfessionell oder heilsgeschichtlich festzulegen.
- issue: Zeitbezug der nominalen Aussagen
  choice: 'Futurische Wiedergabe: »werden … sein« und »wird … sein«'
  alternative: 'Gegenwärtige Zustandsaussage: »sind von Jahwe unterwiesen« und »groß ist der Frieden«'
  rationale: Das Hebräische enthält hier keine finite Verbform und lässt den Zeitbezug formal offen. Im Zusammenhang der Zukunftsverheißung in Jesaja 54 ist die futurische Wiedergabe im Deutschen am natürlichsten, ohne die Aussage inhaltlich weiter zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Satzstellung. »Unterwiesen sein« bewahrt den Zustandscharakter des hebräischen Ausdrucks; die Wiederholung von »deine Kinder« folgt der hebräischen Parallelstruktur.
