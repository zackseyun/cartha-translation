  text: הַ/שֹּׁלֵ֨חַ בַּ/יָּ֜ם צִירִ֗ים וּ/בִ/כְלֵי גֹמֶא֮ עַל פְּנֵי מַיִם֒ לְכ֣וּ מַלְאָכִ֣ים קַלִּ֗ים אֶל גּוֹי֙ מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט אֶל עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֚וֹי קַו קָ֣ו וּ/מְבוּסָ֔ה אֲשֶׁר בָּזְא֥וּ נְהָרִ֖ים אַרְצֽ/וֹ־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'who sends envoys by sea in vessels of papyrus over the waters: “Go, swift messengers, to a nation tall and smooth-skinned[a], to a people feared far and wide, a nation that measures out and tramples down[b], whose land rivers divide[c].”'
translation:
  language: de
  text: 'der Gesandte über das Meer sendet, in Papyrusbooten über die Wasser: »Geht, ihr schnellen Boten, zu einem hochgewachsenen und glatthäutigen Volk[a], zu einem Volk, das weithin gefürchtet ist, einer Nation, die ausmisst und niedertritt[b], deren Land Flüsse durchschneiden[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »langgestreckt und glatt«; wahrscheinlich ist damit das äußere Erscheinungsbild beschrieben.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch etwa: »eine Nation von Messschnur, Messschnur und Niedertreten«; möglicherweise: »eine Nation, die ausmisst und niedertritt«. Der Ausdruck ist schwer verständlich.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »deren Land die Flüsse plündern« beziehungsweise »verheeren«. Das Verb bedeutet gewöhnlich »plündern«; »durchschneiden« ist eine geografische Deutung aus dem Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: der … sendet
  rationale: Der artikulierte Partizipialsatz führt die Beschreibung aus Vers 1 als Relativsatz fort.
- source_word: צִירִים
  choice: Boten
  rationale: Das Wort bezeichnet hier ausgesandte, wohl diplomatische Boten; im Deutschen ist „Boten“ klar und würdig.
- source_word: בַּיָּם
  choice: über das Meer
  rationale: Die Präposition bezeichnet den Weg der Entsendung; „über das Meer“ ist im Deutschen idiomatisch.
- source_word: וּבִכְלֵי גֹמֶא
  choice: in Papyrusbooten
  rationale: גֹמֶא bezeichnet Papyrus; „Papyrusboote“ gibt die leichten Wasserfahrzeuge natürlich und genau wieder.
- source_word: עַל פְּנֵי מַיִם
  choice: über die Wasser
  rationale: Die Wendung bewahrt das Bild der Fahrt über die Wasserfläche in knapper, gehobener Sprache.
- source_word: מַלְאָכִים קַלִּים
  choice: schnellen Boten
  rationale: קַלִּים bezeichnet im Zusammenhang die Schnelligkeit der Boten.
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: einem hochgewachsenen und glatthäutigen Volk
  rationale: Die schwierige Wortverbindung wird als Beschreibung der körperlichen Erscheinung verstanden; die wörtlicheren Bedeutungen bleiben in der Fußnote sichtbar.
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: einem Volk, das weithin gefürchtet ist
  rationale: Die idiomatische Wiedergabe drückt die große Reichweite seines furchteinflößenden Rufes aus, ohne die räumlich oder zeitlich mögliche Nuance enger festzulegen.
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: einer Nation, die ausmisst und niedertritt
  rationale: Die Deutung bezieht קַו auf die Messschnur und versteht beide Ausdrücke aktiv; wegen der erheblichen Unsicherheit wird die Alternative angemerkt.
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: deren Land Flüsse durchschneiden
  rationale: Die kontextuelle geografische Deutung beschreibt ein von Flüssen durchschnittenes Land; die gewöhnliche Bedeutung des Verbs wird in der Fußnote bewahrt.
