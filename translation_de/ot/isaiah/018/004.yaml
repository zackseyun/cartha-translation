source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: de
  text: 'Denn so hat Jahwe zu mir gesagt: „Ich werde still bleiben und von meiner Wohnstätte aus[a] zuschauen, wie helle Hitze im Sonnenlicht[b], wie eine Tauwolke in der Erntehitze.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde still sein und von meinem festen Ort aus schauen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie klare Hitze über dem Licht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen geläufigen Form wieder.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der 1. Person Singular bezeichnet nach אָמַר am natürlichsten den Empfänger der Rede.
- source_word: אשקוטה
  choice: Ich werde still bleiben
  rationale: שׁקט bezeichnet ungestörte Ruhe oder bewusstes Stillhalten. Die Formulierung wahrt im Zusammenhang den Eindruck absichtlicher Nichtintervention, ohne ihn auszudeuten.
- source_word: וְאַבִּיטָה
  choice: und … zuschauen
  rationale: נבט bedeutet hinschauen oder betrachten. „Zuschauen“ vermittelt hier die fortdauernde Beobachtung aus einer ruhenden Position.
- source_word: בִמְכוֹנִי
  choice: von meiner Wohnstätte aus
  rationale: מָכוֹן ist ein fester, eingerichteter Ort und kann eine Wohnstätte bezeichnen. Das deutsche „von … aus“ macht den Ort als Beobachtungspunkt idiomatisch deutlich, während die Präposition בְּ wörtlicher auch „an/in“ zulässt.
- source_word: כְּחֹם צַח
  choice: wie flimmernde Hitze
  rationale: חֹם bedeutet „Hitze“, צַח bezeichnet Klarheit oder Helligkeit. „Flimmernde Hitze“ ergibt im Deutschen ein natürliches, sichtbares Wetterbild, ohne die Erscheinung weiter festzulegen.
- source_word: עֲלֵי אוֹר
  choice: im Sonnenlicht
  rationale: Wörtlich steht „über/auf Licht“. Im meteorologischen Vergleich bezeichnet „im Sonnenlicht“ die naheliegende Beziehung von heller Hitze und Licht.
- source_word: כְּעָב טַל
  choice: wie eine Tauwolke
  rationale: עָב bedeutet „Wolke“, טַל „Tau“. Das zusammengesetzte deutsche Wort bewahrt das ungewöhnliche konkrete Bild.
- source_word: בְּחֹם קָצִיר
  choice: in der Erntehitze
  rationale: Die Wendung verbindet die Hitze mit der Erntezeit. „Erntehitze“ ist knapp und erhält den landwirtschaftlichen Schauplatz.
theological_decisions:
- issue: Gottes Stillsein und Zuschauen
  choice: Die Verben werden als bewusstes Stillbleiben und Beobachten wiedergegeben.
  alternative: „Ich werde ruhen“ könnte gelassene Ruhe hervorheben; eine deutende Umschreibung könnte darin bereits die verborgene Vorbereitung des Gerichts sehen.
  rationale: Der hebräische Text schildert Jahwe als still und beobachtend und verbindet dies mit Naturbildern. Die Übersetzung legt weder Gleichgültigkeit noch unmittelbar bevorstehendes Gericht ausdrücklich in die Verben hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen Naturbilder bleiben erkennbar; nur dort, wo eine streng wörtliche Fassung im Deutschen unverständlich oder irreführend klänge, wird idiomatisch formuliert und die wörtliche Möglichkeit in einer Fußnote bewahrt.
