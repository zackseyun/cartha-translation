base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: de
  text: Denn vor der Ernte, wenn die Blüte zu Ende ist und aus der Blüte eine unreife Weinbeere wird,[a] wird er die Triebe mit Rebmessern abschneiden und die ausladenden Zweige entfernen und abhauen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn die Blüte vollendet ist und eine unreife Weinbeere aus der Blüte wird“. Das hebräische Bild führt vor der Ernte von der Blüte zur sich entwickelnden Frucht.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Bezeichnungen für den Wuchs des Weinstocks sind hier selten und können auch mit „Zweige“, „Ranken“ oder „herabhängende Äste“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung des vorausgehenden Bildes ein.
- source_word: לִפְנֵי קָצִיר
  choice: noch vor der Ernte
  rationale: Gibt die zeitliche Angabe natürlich wieder; „noch“ hebt hervor, dass der Eingriff vor dem erwarteten Erntezeitpunkt erfolgt.
- source_word: כְּתָם פֶּרַח
  choice: wenn die Blüte zu Ende ist
  rationale: תמם bezeichnet hier das Zu-Ende-Kommen der Blütephase. Die Formulierung ist verständlich und wahrt den zeitlichen Ablauf des Bildes.
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  choice: und aus der Blüte eine heranreifende Weinbeere wird
  rationale: בֹסֶר bezeichnet eine noch unreife Weinbeere, גֹּמֵל ihre Entwicklung beziehungsweise Reifung und נִצָּה die Blüte. „Weinbeere“ ist genauer als „Traube“, da ein einzelnes Fruchtgebilde gemeint ist.
- source_word: וְכָרַת
  choice: wird er … abschneiden
  rationale: Das Perfekt beschreibt innerhalb der prophetischen Schau die bevorstehende Handlung und wird daher futurisch wiedergegeben.
- source_word: הַזַּלְזַלִּים
  choice: die Triebe
  rationale: Das seltene Wort bezeichnet wahrscheinlich junge oder üppig wachsende Teile des Weinstocks; „Triebe“ passt zum Weinbau und legt die Größe nicht unnötig fest.
- source_word: בַּמַּזְמֵרוֹת
  choice: mit Winzermessern
  rationale: Gemeint sind Schneidwerkzeuge für die Arbeit am Weinstock. „Winzermesser“ ist konkret, ohne moderne Gartenscheren vorauszusetzen.
- source_word: הַנְּטִישׁוֹת
  choice: die ausladenden Zweige
  rationale: Der seltene Ausdruck bezeichnet wohl weit ausgreifenden oder herabhängenden Wuchs; „ausladend“ bewahrt diese räumliche Vorstellung, ohne die Bedeutung zu eng festzulegen.
- source_word: הֵסִיר הֵתַז
  choice: entfernen und abhauen
  rationale: Die beiden Verben werden getrennt wiedergegeben, damit die nachdrückliche zweifache Beschreibung des Beseitigens und Abtrennens erhalten bleibt.
