source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֥י תֵבֵ֖ל וְ/שֹׁ֣כְנֵי אָ֑רֶץ כִּ/נְשֹׂא נֵ֤ס הָרִים֙ תִּרְא֔וּ וְ/כִ/תְקֹ֥עַ שׁוֹפָ֖ר תִּשְׁמָֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: de
  text: 'Ihr alle, die ihr die Welt bewohnt, und die ihr auf der Erde lebt: Wenn auf den Bergen ein Feldzeichen[a] aufgerichtet wird, werdet ihr es sehen; und wenn das Schofarhorn[b] geblasen wird, werdet ihr es hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Signalzeichen“ oder „Banner“. Das hebräische Wort נֵס bezeichnet ein erhöhtes, weithin sichtbares Zeichen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische שׁוֹפָר bezeichnet ein als Signalinstrument verwendetes Horn, häufig ein Widderhorn; auch „Horn“ oder „Widderhorn“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: Ihr alle, die ihr die Welt bewohnt
  rationale: Gibt die universale Anrede und den Bezug auf die bewohnte Welt natürlich wieder; die direkte Anrede mit „ihr“ entspricht den folgenden Verben der zweiten Person Plural.
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: und die ihr auf der Erde lebt
  rationale: Bewahrt den synonymen poetischen Parallelismus, ohne im Deutschen unnatürlich zweimal dasselbe Verb zu verwenden.
- source_word: כִּנְשֹׂא
  choice: Wenn … aufgerichtet wird
  rationale: Die Konstruktion wird hier temporal verstanden. Das Passiv wahrt den im Hebräischen nicht genannten Handelnden.
- source_word: נֵס
  choice: Feldzeichen
  rationale: Bezeichnet ein weithin sichtbares, erhöhtes Signal oder Banner. „Feldzeichen“ wahrt den öffentlichen beziehungsweise militärischen Signalcharakter; weitere mögliche Wiedergaben stehen in der Fußnote.
- source_word: הָרִים
  choice: auf den Bergen
  rationale: Bewahrt den Plural und die räumliche Vorstellung eines weithin sichtbaren Zeichens.
- source_word: תִּרְאוּ
  choice: werdet ihr es sehen
  rationale: Gibt die zweite Person Plural wieder; „es“ nimmt im Deutschen natürlich auf das Feldzeichen Bezug.
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: und wenn das Schofarhorn geblasen wird
  rationale: Bewahrt die parallele temporale Struktur. „Schofarhorn“ bezeichnet das konkrete Signalinstrument genauer als das allgemeinere „Trompete“.
- source_word: תִּשְׁמָעוּ
  choice: werdet ihr es hören
  rationale: Gibt die zweite Person Plural wieder; das ergänzte „es“ bezieht sich natürlich auf das geblasene Horn beziehungsweise dessen Ton.
