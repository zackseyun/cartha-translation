  text: Ach[a], Land der schwirrenden Flügel, jenseits der Ströme von Kusch[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wehe, Land der summenden Flügel!“ oder „Ach, Land der raschelnden Flügel!“ Der hebräische Ausdruck ist schwierig und kann das Geräusch von Flügeln, Insekten oder etwas Flügelartigem in Bewegung hervorrufen.'
    reason: lexical_alternative
