lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion kann Klage, Drohung oder einen nachdrücklichen Anruf einleiten. „Wehe“ bewahrt die prophetische Schärfe; die Fußnote weist auf die offenere Wiedergabe „He!“ hin.
- source_word: אֶרֶץ
  choice: Land
  rationale: Gemeint ist eine geografische Region, nicht die gesamte Erde.
- source_word: צִלְצַל כְּנָפָיִם
  choice: der schwirrenden Flügel
  rationale: Die schwierige Wendung bezeichnet offenbar ein klingendes, summendes oder raschelndes Geräusch in Verbindung mit Flügeln. Die konkrete Bildsprache bleibt erhalten, ohne sie eindeutig auf Insekten oder andere Dinge festzulegen.
- source_word: מֵעֵבֶר לְנַהֲרֵי
  choice: jenseits der Ströme von
  rationale: Die Präpositionsverbindung bezeichnet die Lage auf der anderen Seite. „Ströme“ gibt den poetischen Plural von נָהָר natürlich wieder.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der historische Ortsname wird transliteriert, statt ihn mit einem möglicherweise irreführenden modernen Staat gleichzusetzen.
theological_decisions:
- issue: Ton der Interjektion הוֹי
  choice: „Wehe“ im Haupttext, mit „He!“ als Alternative in der Fußnote
  alternative: „He!“ oder „Ach!“ ohne ausdrücklichen Weheruf
  rationale: Der Ausdruck trägt häufig einen warnenden oder unheilvollen Ton, doch der unmittelbare Kontext legt ihn nicht völlig eindeutig fest. Die Fußnote erhält diese Spannung.
- issue: Bestimmung von כּוּשׁ
  choice: Kusch als historischer Regionsname
  alternative: Äthiopien oder Nubien
  rationale: Der Text nennt Kusch, ohne die Region mit einem heutigen Nationalstaat gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. „Schwirrende Flügel“ erhält die lautmalerische und sachlich offene Bildsprache; „Ströme“ passt zum prophetisch-poetischen Register.
