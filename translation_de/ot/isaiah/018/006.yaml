base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
translation:
  language: de
  text: Sie werden allesamt den Raubvögeln der Berge und den Tieren der Erde überlassen werden.[a] Die Raubvögel werden den Sommer darauf verbringen,[b] und alle Tiere der Erde werden darauf überwintern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden zusammen den Raubvögeln der Berge und den Tieren der Erde überlassen werden.“'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen „Raubvogel“ und „auf ihm“ im Singular, wahrscheinlich mit kollektiver Bedeutung.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: werden … überlassen
  rationale: 'Das Nifal wird passiv verstanden: Die im Kontext Erschlagenen bleiben den Aasfressern preisgegeben. „Überlassen“ gibt sowohl das Verlassenwerden als auch die Auslieferung an Tiere natürlich wieder.'
- source_word: יַחְדָּו
  choice: allesamt
  rationale: Das Adverb bedeutet wörtlich „zusammen“, kann hier aber die Gesamtheit hervorheben. „Allesamt“ bewahrt diese kollektive Aussage in idiomatischem Deutsch; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: לְעֵיט הָרִים
  choice: den Raubvögeln der Berge
  rationale: עַיִט bezeichnet einen Raub- oder Aasvogel und steht hier kollektiv. Der deutsche Plural macht den Klassenbezug verständlich und bewahrt das Gebirgsbild.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: und den Tieren der Erde
  rationale: בְּהֵמָה kann allgemein Tiere bezeichnen. „Tiere der Erde“ ist würdig und eng am Hebräischen; der Zusammenhang zeigt, dass hier wilde, aasfressende Tiere gemeint sind.
- source_word: וְקָץ
  choice: werden den Sommer … verbringen
  rationale: Das Verb bezeichnet hier das Verbringen des Sommers. Diese Formulierung ist im modernen Deutsch natürlicher als das seltene „übersommern“ und erhält die jahreszeitliche Parallele.
- source_word: הָעַיִט
  choice: die Raubvögel
  rationale: Obwohl das hebräische Substantiv formal Singular ist, hat es kollektive Bedeutung. Der Plural ist im Deutschen klar und entspricht dem ersten Satzglied.
- source_word: עָלָיו
  choice: darauf
  rationale: Der singularische Suffixbezug kann kollektiv auf das liegengelassene Ganze beziehungsweise die Gefallenen weisen. „Darauf“ bewahrt den unbestimmten kollektiven Bezug, ohne vorschnell ein einzelnes Bezugswort festzulegen.
- source_word: תֶּחֱרָף
  choice: werden darauf überwintern
  rationale: Das Verb bedeutet hier, den Winter zu verbringen. „Überwintern“ ist geläufiges modernes Deutsch und wahrt den Parallelismus zum Verbringen des Sommers.
