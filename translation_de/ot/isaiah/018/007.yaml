source:
  edition: WLC
  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: de
  text: 'Zu jener Zeit wird dem HERRN der Heerscharen eine Gabe gebracht werden von einem hochgewachsenen und glatthäutigen Volk,[a] von einem Volk, das weit und breit gefürchtet wird: einer Nation von Maß auf Maß und Niedertrampeln,[b] deren Land Ströme durchschneiden,[c] zum Ort des Namens des HERRN der Heerscharen, zum Berg Zion.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einem lang hingestreckten und glattrasierten Volk.'
    reason: Die beiden hebräischen Adjektive haben einen weiteren Bedeutungsbereich. מְמֻשָּׁךְ kann „lang hingestreckt“ bedeuten; מוֹרָט bezeichnet etwas Glattes, Haarloses oder Geschorenes.
  - marker: b
    text: 'Die hebräische Wendung ist unklar; wörtlich etwa: „eine Nation von Linie auf Linie und Niedertrampeln“. Möglich sind auch Deutungen wie „mächtig und siegreich“ oder „vermessen und zertreten“.'
    reason: קַו קָו ist an dieser Stelle semantisch und syntaktisch umstritten. Die Fußnote bewahrt die Mehrdeutigkeit.
  - marker: c
    text: 'Oder: deren Land Ströme plündern; möglicherweise ein Bild für verwüstende Überschwemmungen.'
    reason: בָּזְאוּ bedeutet gewöhnlich „plünderten/raubten“. Die Wiedergabe „durchschneiden“ folgt der kontextuell verbreiteten Deutung, ohne die wörtlichere Möglichkeit auszuschließen.
lexical_decisions:
- source_word: שַׁי
  choice: Gabe
  rationale: Das Wort bezeichnet eine Gabe oder ein Geschenk, möglicherweise auch eine Huldigungsgabe beziehungsweise einen Tribut. „Gabe“ bewahrt den positiven und kultischen Bedeutungsraum, ohne den politischen Charakter festzulegen.
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: hochgewachsen und glatthäutig
  rationale: מְמֻשָּׁךְ bedeutet wörtlich etwa „lang/gestreckt“ und beschreibt hier wahrscheinlich die Körpergröße; מוֹרָט kann „glatt, haarlos, geschoren“ bedeuten. Die gewählte Formulierung ist verständlich, während eine Fußnote die Unsicherheit offenlegt.
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: weit und breit gefürchtet
  rationale: Die Wendung lautet annähernd „gefürchtet von dort an und weiter“ und bezeichnet offenbar einen weitreichenden Ruf.
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: eine Nation, die Befehl auf Befehl gibt und niedertritt
  rationale: Die ungewöhnliche und textlich schwierige Wendung wird in Anschluss an den konsultierten POB-Text verständlich wiedergegeben. Da קַו gewöhnlich „Messschnur/Linie“ bedeutet und die gesamte Formulierung unsicher ist, werden Alternativen in einer Fußnote genannt.
- source_word: בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: deren Land Ströme zerteilen
  rationale: Das Verb ist mit בזז „plündern/rauben“ verbunden, wird hier jedoch traditionell als bildhafte Beschreibung der das Land durchziehenden beziehungsweise zerteilenden Flüsse verstanden. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den Gottesnamen durch „HERR“ und übersetzt צְבָאוֹת formal als „Heerscharen“.
theological_decisions:
- issue: Wer oder was als Gabe gebracht wird
  choice: Die Gabe kommt „von einem … Volk“; das wiederaufgenommene „Sie“ bezieht sich auf die Gabe.
  alternative: Das Volk selbst wird als Gabe zum HERRN gebracht.
  rationale: Die Präposition מִן vor der zweiten Nennung von „Volk“ stützt die Herkunftsangabe, doch die knappe hebräische Syntax lässt eine appositionelle Deutung des Volkes als Gabe zu. Die Übersetzung folgt der wahrscheinlichsten Lesart, ohne daraus eine weitergehende theologische Aussage abzuleiten.
- issue: Bedeutung der schwer verständlichen Charakterisierung קַו קָו וּמְבוּסָה
  choice: Herrschaftliches Befehlen und Niedertrampeln
  alternative: Ein vermessenes/abgemessenes und zertretenes Land beziehungsweise ein starkes und siegreiches Volk
  rationale: Die Wendung ist lexikalisch unsicher. Der Haupttext folgt der konsultierten POB-Lesart, die Fußnote weist ausdrücklich auf die genuine Mehrdeutigkeit hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem feierlichen prophetischen Stil verpflichtet, wird aber durch einen neuen Satz beim Ziel der Gabe entlastet. „HERR“ steht in Kapitälchenersatz für den Gottesnamen; „Heerscharen“ bewahrt die traditionelle, im Deutschen verständliche Gottesbezeichnung.
