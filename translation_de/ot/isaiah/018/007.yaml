  to: 'Zu jener Zeit wird dem HERRN der Heerscharen eine Gabe gebracht werden von einem hochgewachsenen und glatthäutigen Volk,[a] von einem Volk, das weit und breit gefürchtet wird: einer Nation von Maß auf Maß und Niedertrampeln,[b] deren Land Ströme durchschneiden,[c] zum Ort des Namens des HERRN der Heerscharen, zum Berg Zion.'
