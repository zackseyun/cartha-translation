  text: וְ/הָיָ֧ה כִֽי נִרְאָ֛ה כִּֽי נִלְאָ֥ה מוֹאָ֖ב עַל הַ/בָּמָ֑ה וּ/בָ֧א אֶל מִקְדָּשׁ֛/וֹ לְ/הִתְפַּלֵּ֖ל וְ/לֹ֥א יוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
translation:
  language: de
  text: Und wenn sichtbar wird, dass Moab sich auf der Kulthöhe[a] abgemüht hat und zu seinem Heiligtum kommt, um zu beten, wird es nichts ausrichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine „Kulthöhe“ ist eine meist erhöht gelegene Stätte für religiöse Opfer und andere Kulthandlungen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „wird es nicht können“. Gemeint sein kann, dass Moab mit seinem Gebet keinen Erfolg haben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Formel leitet einen zukünftigen Umstand ein; „Und wenn“ gibt den zeitlichen Sinn in natürlichem Deutsch wieder.
- source_word: נִרְאָה
  choice: sich zeigt
  rationale: Das Nifal kann unpersönlich „sichtbar werden/sich zeigen“ bedeuten. Diese Wiedergabe bewahrt die mögliche unpersönliche Aussage, ohne einen zusätzlichen Beobachter einzuführen.
- source_word: נִלְאָה
  choice: sich vergeblich abmüht
  rationale: Das Verb bezeichnet Ermüdung oder Erschöpfung durch Mühe. Im kultischen Zusammenhang lässt die Formulierung sowohl die Anstrengung als auch deren Erfolglosigkeit erkennen.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Form des Volks- und Landesnamens.
- source_word: עַל הַבָּמָה
  choice: auf der Kulthöhe
  rationale: במה bezeichnet hier eine erhöhte Kultstätte. „Kulthöhe“ ist im Deutschen präziser als das missverständliche bloße „Höhe“ und bewahrt den Singular.
- source_word: וּבָא אֶל מִקְדָּשׁוֹ
  choice: und wenn es in sein Heiligtum kommt
  rationale: בוא kann je nach Blickrichtung „kommen“, „gehen“ oder „hineingehen“ bedeuten. „In sein Heiligtum kommt“ ist hier idiomatisch; das sächliche Pronomen folgt dem grammatischen Geschlecht von „Moab“ im Deutschen.
- source_word: לְהִתְפַּלֵּל
  choice: um zu beten
  rationale: Der Hitpael von פלל bedeutet hier schlicht „beten“; eine speziellere Bedeutung wie „Fürbitte leisten“ wäre unbegründet.
- source_word: וְלֹא יוּכָל
  choice: wird es nichts ausrichten
  rationale: Wörtlich bedeutet die Wendung „wird es nicht können“. Im Kontext macht „nichts ausrichten“ die nicht erfolgreiche kultische Bitte natürlich verständlich, ohne ihren genauen Gegenstand zu ergänzen.
theological_decisions:
- issue: Singularischer Bezug des Volksnamens Moab
  choice: Moab wird als kollektiv-personifizierter Singular mit „es“ aufgenommen.
  alternative: Pluralischer Bezug auf die Moabiter oder maskuline Personifikation mit „er“.
  rationale: Die hebräischen Verben stehen im Singular. Das deutsche „es“ bewahrt diesen Bezug und entspricht dem grammatischen Gebrauch bei dem Namen Moab, ohne eine männliche Einzelperson anzunehmen.
- issue: Erfolg der Bitte im Heiligtum
  choice: „wird es nichts ausrichten“
  alternative: 'Wörtlicher: „wird es nicht können“; stärker deutend: „wird es keinen Erfolg haben“.'
  rationale: Der hebräische Satz nennt kein ausdrückliches Objekt zu „können“. Die gewählte Formulierung bewahrt die Offenheit, bringt aber die im Zusammenhang erkennbare Wirkungslosigkeit des Gebets idiomatisch zum Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält die beiden miteinander verbundenen Handlungen zusammen. „Kulthöhe“ und „Heiligtum“ sind sachlich-kultische Begriffe; die kollektive Personifikation Moabs bleibt im Singular erhalten.
