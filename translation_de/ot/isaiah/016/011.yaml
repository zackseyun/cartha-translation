  text: עַל כֵּן֙ מֵעַ֣/י לְ/מוֹאָ֔ב כַּ/כִּנּ֖וֹר יֶֽהֱמ֑וּ וְ/קִרְבִּ֖/י לְ/קִ֥יר חָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/011.yaml
  text: Therefore my inward parts moan like a harp for Moab[b][a], and my inner being for Kir-heres.
translation:
  language: de
  text: Darum stöhnt mein Innerstes um Moab wie eine Leier[a], und mein Inneres um Kir-Heres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie eine Harfe«; das hebräische Wort bezeichnet ein Saiteninstrument.'
    reason: lexical_alternative
  - marker: b
    text: Kir-Heres war eine moabitische Stadt; traditionell wird der Name auch »Kir-Hareset« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: mein Innerstes
  rationale: Das Wort bezeichnet wörtlich die inneren Organe beziehungsweise Eingeweide und bildlich den Sitz tiefer Gefühle. »Mein Innerstes« bewahrt den körperlich-emotionalen Bezug in natürlichem modernem Deutsch.
- source_word: לְמוֹאָב
  choice: um Moab
  rationale: Die Präposition kennzeichnet hier, worauf sich die Klage richtet. Im Deutschen drückt »um Moab klagen« diese Anteilnahme idiomatisch aus.
- source_word: כַּכִּנּוֹר
  choice: wie eine Leier
  rationale: כִּנּוֹר bezeichnet ein Saiteninstrument. »Leier« ist historisch und sachlich angemessener als die ebenfalls geläufige Wiedergabe »Harfe«.
- source_word: יֶהֱמוּ
  choice: klagt
  rationale: המה bezeichnet ein dumpfes, bewegtes Tönen, Dröhnen oder Stöhnen. Im Zusammenhang des Trauerbildes gibt »klagt« die Funktion des Lautes natürlich wieder, ohne die Instrumentenmetapher aufzulösen.
- source_word: וְקִרְבִּי
  choice: und mein tiefstes Inneres
  rationale: קֶרֶב bezeichnet das Innere oder die Mitte. Die Formulierung erhält den Parallelismus zu מֵעַי und macht zugleich die emotionale Tiefe deutlich.
- source_word: לְקִיר חָרֶשׂ
  choice: um Kir-Heres
  rationale: Die Wortfolge ist hier als Name einer moabitischen Stadt zu verstehen und wird daher transliteriert. »Um« nimmt das im ersten Halbvers ausgedrückte Klagen elliptisch wieder auf.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Klagesprache. Der Parallelismus der beiden Bezeichnungen für das Innere des Sprechers bleibt erhalten; »klagt« wird im zweiten Halbvers sinngemäß ergänzt. Die Ortsnamen werden als Eigennamen behandelt.
