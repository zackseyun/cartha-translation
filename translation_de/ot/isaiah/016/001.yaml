id: ISA.16.1
reference: Isaiah 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: de
  text: Schickt dem Herrscher des Landes ein Lamm[b], von Sela[a] durch die Wüste zum Berg der Tochter Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Felsen“ beziehungsweise „von der Felsklippe“. Das hebräische Wort סלע kann ein gewöhnliches Substantiv sein; hier ist jedoch wahrscheinlich der Ortsname Sela gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das Lamm ist hier wahrscheinlich als Tributgabe an den Herrscher gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: Schickt
  rationale: Der Qal-Imperativ im maskulinen Plural richtet einen unmittelbaren Befehl an mehrere Angesprochene. „Schickt“ ist im modernen Deutschen natürlich und bewahrt den Plural.
- source_word: כַר
  choice: ein Lamm
  rationale: Das Substantiv bezeichnet ein junges Weide- beziehungsweise Kleinvieh. Der wahrscheinliche Sinn als Tributzahlung ergibt sich aus dem Zusammenhang und wird nicht in den Wortlaut eingetragen.
- source_word: מֹשֵׁל אֶרֶץ
  choice: dem Herrscher des Landes
  rationale: מֹשֵׁל bezeichnet den Regierenden; אֶרֶץ meint im regionalen Zusammenhang wahrscheinlich das Land, nicht die ganze Erde. Der deutsche Dativ gibt die Zielrichtung des Sendens idiomatisch wieder.
- source_word: מִסֶּלַע
  choice: von Sela
  rationale: סלע kann „Fels“ bedeuten, ist hier jedoch wahrscheinlich als Ortsname Sela zu verstehen. Die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: מִדְבָּרָה
  choice: durch die Wüste
  rationale: Die Form mit direktionaler Endung ist schwierig. Im Zusammenhang lässt sie sich natürlich als Angabe des Weges verstehen; „durch die Wüste“ bewahrt den Bewegungssinn, ohne ein eindeutiges Ziel in der Wüste zu behaupten.
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: zum Berg der Tochter Zion
  rationale: Die poetische Personifikation „Tochter Zion“ bleibt erhalten und wird nicht zu „Jerusalem“ verflacht. „Zum Berg“ gibt אֶל הַר knapp und natürlich wieder.
theological_decisions:
- issue: Ob der politische Sinn einer Tributzahlung im Haupttext ausdrücklich gemacht werden soll
  choice: Die konkrete Formulierung „ein Lamm“ bleibt im Haupttext; der wahrscheinliche Tributsinn steht in einer Fußnote.
  alternative: „Schickt ein Lamm als Tribut“ oder „Schickt Lämmer als Tribut“
  rationale: Der Kontext spricht wahrscheinlich von einer Abgabe an einen Herrscher, doch der hebräische Wortlaut nennt konkret ein Lamm. So bleibt die Bildlichkeit erhalten, ohne die politische Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Wendung „Tochter Zion“ und die knappe Befehlsform bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
