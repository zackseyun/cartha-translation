id: ISA.16.10
reference: Isaiah 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: de
  text: Freude und Jubel sind vom fruchtbaren Land[a] verschwunden. In den Weinbergen jubelt niemand mehr, niemand ruft laut; kein Keltertreter tritt mehr Wein in den Keltern. Dem Kelterruf[b] habe ich ein Ende gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Karmel«, wenn כַּרְמֶל hier als Ortsname statt als Bezeichnung für fruchtbares Land verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: Gemeint ist der laute Ruf bei der Weinlese oder beim Treten der Trauben.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: sind … verschwunden
  rationale: Das Nifal von אסף bezeichnet hier idiomatisch das Weggenommenwerden beziehungsweise Verschwinden. Im Deutschen stimmt der Plural mit dem Doppelsubjekt »Freude und Jubel« überein.
- source_word: שִׂמְחָה וָגִיל
  choice: Freude und Jubel
  rationale: Die beiden einander überlappenden Begriffe werden als poetisches Paar wiedergegeben, aber lexikalisch voneinander unterschieden.
- source_word: כַּרְמֶל
  choice: fruchtbares Land
  rationale: Im landwirtschaftlichen Zusammenhang mit Weinbergen und Keltern liegt die Gattungsbezeichnung für ertragreiches Kulturland näher als der Ortsname Karmel.
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: jubelt niemand mehr, niemand ruft laut
  rationale: Die parallelen Verben bezeichnen lauten festlichen Jubel beziehungsweise einen kräftigen Ruf; die deutsche Wiedergabe wahrt sowohl die Parallelität als auch den Bedeutungsunterschied.
- source_word: יַיִן בַּיְקָבִים
  choice: Wein in den Keltern
  rationale: יַיִן bedeutet »Wein«; יְקָבִים bezeichnet hier die Anlagen beziehungsweise Behälter zum Keltern. »Keltern« ist im Zusammenhang knapp und verständlich.
- source_word: יִדְרֹךְ הַדֹּרֵךְ
  choice: kein Keltertreter tritt mehr
  rationale: Die Verbindung aus finitem Verb und Partizip wird durch die etymologische Wiederholung bewahrt. »Keltertreter« macht die Tätigkeit für heutige Leser eindeutig.
- source_word: הֵידָד
  choice: Kelterruf
  rationale: Gemeint ist der laute Ruf beim Traubentreten beziehungsweise bei der Weinlese. »Kelterruf« bindet ihn präzise an den unmittelbaren Kontext.
- source_word: הִשְׁבַּתִּי
  choice: habe ich ein Ende gemacht
  rationale: Das Hifil von שבת drückt das Verursachen eines Aufhörens aus. Die Formulierung wahrt die kausative Bedeutung und die im Hebräischen ausdrücklich gesetzte erste Person.
theological_decisions:
- issue: Sprecher des Verbs in der ersten Person am Versende
  choice: 'Die erste Person bleibt ohne erklärenden Zusatz stehen: »habe ich ein Ende gemacht«.'
  alternative: »Ich, der HERR, habe …«
  rationale: Der weitere Zusammenhang identifiziert den göttlichen Sprecher, doch dieser Vers nennt ihn nicht erneut. Ein Zusatz im Haupttext würde über den hebräischen Wortlaut hinausgehen.
- issue: Deutung von כַּרְמֶל
  choice: Gattungsbezeichnung »fruchtbares Land«
  alternative: Ortsname »Karmel«
  rationale: Der Parallelismus mit Weinbergen, Wein und Keltern begünstigt die landwirtschaftliche Bedeutung. Da auch der Ortsname grammatisch möglich ist, wird er in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Weinlesekontext wird mit den verständlichen, sachlich präzisen Wörtern »Keltertreter« und »Kelterruf« vergegenwärtigt. Die poetische Wiederholung und der abrupte Wechsel zur göttlichen Ich-Rede bleiben erhalten.
