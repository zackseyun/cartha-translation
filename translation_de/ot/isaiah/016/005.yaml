source:
  edition: WLC
  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: de
  text: Ein Thron wird durch beständige Liebe[a] gefestigt werden, und im Zelt Davids wird einer[b] in Treue[c] auf ihm sitzen. Er spricht Recht, setzt sich für das Recht ein und handelt rasch gerecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus beständiger Liebe; oder: in beständiger Liebe. Das hebräische Wort bezeichnet auch Güte, Erbarmen und loyale Verbundenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: er. Im Hebräischen bleibt das Subjekt unausgesprochen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: in Wahrheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  choice: wird … gefestigt werden
  rationale: Das Hofal von כון bezeichnet ein Festmachen oder dauerhaftes Aufrichten. „Gefestigt werden“ bewahrt den passiven, resultativen Sinn.
- source_word: בַּחֶסֶד
  choice: durch beständige Liebe
  rationale: חֶסֶד umfasst verlässliche Liebe, Güte und loyale Verbundenheit. „Beständige Liebe“ gibt diese Bedeutungsfülle verständlich wieder; „durch“ deutet das Präfix ב instrumentell, ohne andere Möglichkeiten zu verschweigen.
- source_word: כִּסֵּא
  choice: ein Thron
  rationale: Das hebräische Substantiv steht ohne Artikel; der unbestimmte Artikel ist daher formal transparent und im Deutschen natürlich.
- source_word: וְיָשַׁב עָלָיו
  choice: und … wird einer … auf ihm sitzen
  rationale: Das Verb steht in der 3. Person Maskulinum Singular, doch ein ausdrückliches Subjekt fehlt. „Einer“ wahrt diese Unbestimmtheit besser als ein festlegendes „er“.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Im Zusammenhang königlicher Rechtsprechung hebt „Treue“ die zuverlässige Amtsführung hervor; „in Wahrheit“ bleibt als Alternative in der Fußnote erhalten.
- source_word: בְּאֹהֶל דָּוִד
  choice: im Zelt Davids
  rationale: Die konkrete Bildsprache des hebräischen Textes wird bewahrt und nicht deutend zu „Haus“ oder „Dynastie“ umgeformt.
- source_word: שֹׁפֵט
  choice: Er spricht Recht
  rationale: Das Partizip beschreibt die fortdauernde richterliche Tätigkeit des Thronenden. „Recht sprechen“ ist dafür die natürliche deutsche Wendung.
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: strebt nach Recht
  rationale: דרשׁ bezeichnet hier das aktive Suchen oder Verfolgen von מִשְׁפָּט. „Nach Recht streben“ bewahrt den aktiven ethisch-rechtlichen Sinn.
- source_word: וּמְהִר צֶדֶק
  choice: und schafft rasch Gerechtigkeit
  rationale: Die knappe hebräische Wendung verbindet Schnelligkeit mit צֶדֶק. „Schafft rasch Gerechtigkeit“ ist idiomatisches Deutsch und versteht die Gerechtigkeit als zügig verwirklichtes Handeln.
theological_decisions:
- issue: Messianischer beziehungsweise davidischer Bezug
  choice: Der Vers beschreibt einen idealen Herrscher auf Davids Thron, ohne ihn in der Übersetzung ausdrücklich als Messias zu bezeichnen.
  alternative: Den Herrscher ausdrücklich mit dem Messias oder Christus gleichsetzen.
  rationale: Der hebräische Text nennt das Zelt Davids und schildert den Thronenden, identifiziert ihn aber nicht ausdrücklich. Die zurückhaltende Formulierung bewahrt sowohl den unmittelbaren davidischen Zusammenhang als auch die Möglichkeit einer messianischen Auslegung.
- issue: Unausgesprochenes Subjekt von וְיָשַׁב
  choice: „einer“
  alternative: „er“
  rationale: Das grammatische Geschlecht ist männlich, doch der Satz nennt kein ausdrückliches Subjekt. Die Übersetzung soll diese Offenheit nicht unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Wiederholung von „Recht“ gibt die hebräische Verbindung von שׁפט und מִשְׁפָּט wieder. Der zweite Satz löst die hebräischen Partizipien natürlich auf, ohne die königliche und richterliche Bildsprache zu glätten.
