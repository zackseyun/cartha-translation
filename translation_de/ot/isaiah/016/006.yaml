base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: de
  text: Wir haben vom Hochmut Moabs gehört – es ist überaus hochmütig –, von seiner Überheblichkeit, seinem Hochmut und seinem Zorn; seine Prahlereien[a] treffen nicht zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sein leeres Gerede; oder: seine Lügen. Das hebräische Wort kann prahlerische Behauptungen, leeres Gerede oder Falschaussagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Wir haben … gehört
  rationale: Das Qal-Perfekt der 1. Person Plural bezeichnet hier Bekanntes, das durch Berichte vernommen wurde. Das deutsche Perfekt drückt dessen fortdauernde Relevanz natürlich aus.
- source_word: גְאוֹן מוֹאָב
  choice: vom Hochmut Moabs
  rationale: Im Gerichtswort bezeichnet גְאוֹן nicht neutrale Hoheit, sondern anmaßenden Stolz. „Hochmut“ ist dafür im modernen Deutschen klar und würdig.
- source_word: גֵּא מְאֹד
  choice: überaus hochmütig ist es
  rationale: Die prädikative Wendung mit מְאֹד verstärkt die Aussage. Die eingeschobene Klausel bewahrt die emphatische Wiederholung des hebräischen Wortfelds.
- source_word: גַּאֲוָתוֹ
  choice: seiner Überheblichkeit
  rationale: „Überheblichkeit“ unterscheidet dieses Glied innerhalb der gehäuften, bedeutungsnahen Ausdrücke für Stolz, ohne die rhetorische Steigerung einzuebnen.
- source_word: וּגְאוֹנוֹ
  choice: seinem Hochmut
  rationale: Die Wiederaufnahme von גְאוֹן wird auch im Deutschen mit „Hochmut“ wiederholt und hält so den Leitbegriff des Verses fest.
- source_word: וְעֶבְרָתוֹ
  choice: seinem Zorn
  rationale: עֶבְרָה bezeichnet heftigen, überströmenden Zorn. „Zorn“ gibt den Sinn klar und in angemessen würdigem Register wieder.
- source_word: לֹא כֵן
  choice: treffen nicht zu
  rationale: Die knappe Verneinung bestreitet, dass Moabs Aussagen der Wirklichkeit entsprechen. „Treffen nicht zu“ ist natürliches modernes Deutsch, ohne die Aussage unnötig zu präzisieren.
- source_word: בַּדָּיו
  choice: seine Prahlereien
  rationale: Das Wort kann prahlerische Behauptungen, leeres Gerede oder Lügen bezeichnen. Im unmittelbaren Zusammenhang mit Moabs Hochmut passt „Prahlereien“ am besten; die weiteren Nuancen werden in der Fußnote erhalten.
