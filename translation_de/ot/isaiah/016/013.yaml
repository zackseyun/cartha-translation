  text: זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל מוֹאָ֖ב מֵ/אָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/013.yaml
  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: de
  text: Dies ist das Wort, das Jahwe einst über Moab gesprochen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dies ist die Botschaft, die Jahwe früher über Moab ausgesprochen hat.«'
    reason: Lexikalische Alternativen für דָּבָר, דִּבֶּר und מֵאָז.
lexical_decisions:
- source_word: זֶה
  choice: Dies ist
  rationale: Das Demonstrativpronomen führt rückblickend eine zusammenfassende Feststellung ein. Das Präsens bewahrt seine deiktische Kraft, obwohl das folgende Verb vergangenes Reden bezeichnet.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. Im Zusammenhang einer prophetischen Verkündigung bewahrt »Wort« die geprägte biblische Ausdrucksweise und bleibt verständlich.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das … gesprochen hat
  rationale: Die Relativkonstruktion wird im Deutschen natürlich mit »das« wiedergegeben; דִּבֶּר bedeutet hier schlicht »sprach«. Das Perfekt bezeichnet idiomatisch die frühere Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im modernen Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל מוֹאָב
  choice: über Moab
  rationale: אֶל bezeichnet hier im Zusammenhang des prophetischen Ausspruchs dessen Bezug. »Über Moab« ist natürliches Deutsch und legt weder direkte Anrede noch eine über die Aussage hinausgehende feindliche Stoßrichtung fest.
- source_word: מֵאָז
  choice: einst
  rationale: מֵאָז verweist auf eine gegenüber der gegenwärtigen Aussage frühere Zeit. »Einst« gibt dies knapp und in einem würdigen, gegenwärtig verständlichen Register wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֶל bei Moab
  choice: über Moab
  alternative: zu Moab; gegen Moab
  rationale: Der Vers fasst einen prophetischen Ausspruch mit Moab als Gegenstand zusammen. »Über« bewahrt diese referenzielle Bedeutung, ohne direkte Anrede oder Feindschaft zusätzlich festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, knappem prophetischem Ton. »Dies ist das Wort« bewahrt die formale biblische Wendung; »einst« vermeidet das heute schwerfällige »vor Zeiten«.
