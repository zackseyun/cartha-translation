id: ISA.16.3
reference: Isaiah 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הביאו עֵצָה֙ עֲשׂ֣וּ פְלִילָ֔ה שִׁ֧יתִי כַ/לַּ֛יִל צִלֵּ֖/ךְ בְּ/ת֣וֹךְ צָהֳרָ֑יִם סַתְּרִי֙ נִדָּחִ֔ים נֹדֵ֖ד אַל תְּגַלִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: de
  text: Gebt Rat, trefft eine Entscheidung[a]! Lass deinen Schatten mitten am Mittag wie die Nacht sein; verbirg die Vertriebenen, verrate den Flüchtling nicht[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schafft Recht“, „fällt ein Urteil“ oder „entscheidet als Schiedsrichter“. Das hebräische Wort hat eine rechtliche beziehungsweise richterliche Färbung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „decke den Flüchtling nicht auf“ oder „gib ihn nicht preis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: Gebt Rat
  rationale: Der Hifil-Imperativ von בוא bedeutet hier, Rat herbeizubringen beziehungsweise vorzubringen. Die geläufige deutsche Wendung „Rat geben“ gibt den politischen Beratungskontext natürlich wieder.
- source_word: עֲשׂוּ פְלִילָה
  choice: trefft eine Entscheidung
  rationale: פְלִילָה bezeichnet eine Entscheidung mit rechtlicher oder richterlicher Färbung. Die Formulierung bewahrt den Entscheidungscharakter, ohne die seltene hebräische Wendung unnötig festzulegen.
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: Lass deinen Schatten … wie die Nacht sein
  rationale: Die Wiedergabe erhält den Vergleich mit der Nacht und formuliert die hebräische Konstruktion mit שׁית im Deutschen idiomatisch. Der feminine Singular des Imperativs bleibt in der direkten Anrede erkennbar, ohne die nicht ausdrücklich genannte Adressatin zu identifizieren.
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: mitten am Mittag
  rationale: Dies gibt wörtlich und zugleich natürlich „inmitten des Mittags“ wieder und bewahrt den starken Gegensatz zwischen der Mittagssonne und nächtlicher Dunkelheit.
- source_word: סַתְּרִי נִדָּחִים
  choice: verbirg die Vertriebenen
  rationale: סתר fordert zum schützenden Verbergen auf; נִדָּחִים bezeichnet Menschen, die fortgetrieben oder verstoßen wurden. „Vertriebene“ wahrt diesen passiven Sinn.
- source_word: נֹדֵד אַל תְּגַלִּי
  choice: verrate den Flüchtling nicht
  rationale: נֹדֵד kann einen Umherirrenden oder Flüchtenden bezeichnen. גלה bedeutet grundlegend „aufdecken, offenbaren“; im Zusammenhang des Verbergens bezeichnet „verraten“ natürlich das Preisgeben eines Flüchtlings, während die wörtlichere Bedeutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Identität der angeredeten weiblichen Größe
  choice: Die Adressatin wird im Vers nicht ausdrücklich benannt.
  alternative: Sie ausdrücklich als Moab oder eine andere personifizierte Größe zu benennen.
  rationale: Die femininen Singularformen zeigen eine weiblich grammatisierte Adressatin, doch dieser Einzelvers nennt sie nicht. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter imperativischer Dringlichkeit. Der Wechsel vom Plural („Gebt“, „trefft“) zum femininen Singular („Lass“, „verbirg“, „verrate“) folgt dem Hebräischen. Die Bildspannung zwischen Mittag und Nacht bleibt erhalten.
