source:
  edition: WLC
  text: וְ/עַתָּ֗ה דִּבֶּ֣ר יְהוָה֮ לֵ/אמֹר֒ בְּ/שָׁלֹ֤שׁ שָׁנִים֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/נִקְלָה֙ כְּב֣וֹד מוֹאָ֔ב בְּ/כֹ֖ל הֶ/הָמ֣וֹן הָ/רָ֑ב וּ/שְׁאָ֥ר מְעַ֛ט מִזְעָ֖ר ל֥וֹא כַבִּֽיר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: de
  text: 'Doch nun hat Yahweh gesprochen: „Innerhalb von drei Jahren, wie die Jahre eines Lohnarbeiters,[a] wird Moabs Herrlichkeit mit all seiner großen Menge entehrt werden.[b] Nur wenige werden übrig bleiben, sehr wenige und nicht mächtig.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in drei Jahren wie die Jahre eines Lohnarbeiters“. Der Vergleich meint vermutlich eine fest bemessene Frist, die nicht verlängert wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird Moabs Herrlichkeit gering geachtet werden“ beziehungsweise „erniedrigt werden“.'
    reason: lexical_alternative
  - marker: c
    text: „Nicht mächtig“ kann auch „nicht groß“ oder „nicht stark“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Kennzeichnet den Übergang zu einer jetzt ergehenden, gegenüber dem Vorherigen abgesetzten Erklärung.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: hat Yahweh gesprochen
  rationale: Das Perfekt bezeichnet eine feierliche, verbindliche Gottesrede; לֵאמֹר wird im Deutschen idiomatisch durch den folgenden Doppelpunkt wiedergegeben.
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: In drei Jahren, genau bemessen wie die Jahre eines Lohnarbeiters
  rationale: Die Frist ist mit der streng berechneten Dienstzeit eines Lohnarbeiters vergleichbar; „in“ bewahrt die zeitliche Formulierung, während „genau bemessen“ den Sinn des Vergleichs erschließt.
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: wird Moabs Herrlichkeit … gering geachtet werden
  rationale: Das Niphal von קלה bezeichnet hier den Verlust von Gewicht, Ansehen und Ehre; die Formulierung erhält die Spannung zwischen „Herrlichkeit“ und Erniedrigung.
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: samt seiner ganzen großen Menge
  rationale: הָמוֹן kann Menge, Menschenmasse, Fülle oder Getümmel bezeichnen. „Menge“ wahrt diese Breite, ohne ausschließlich Bevölkerung oder Reichtum festzulegen.
- source_word: וּשְׁאָר מְעַט מִזְעָר
  choice: Was übrig bleibt, wird wenig, verschwindend klein … sein
  rationale: Die Wiedergabe vermeidet eine vorschnelle theologische Aufladung von שְׁאָר und bildet die verstärkende Häufung von מְעַט und מִזְעָר ab.
- source_word: לֹא כַבִּיר
  choice: nicht stark
  rationale: כַבִּיר kann „groß“, „mächtig“ oder „stark“ bedeuten; im Zusammenhang des geschwächten Restes passt „nicht stark“, ohne andere Nuancen auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, um den im Hebräischen ausdrücklich stehenden Bundesnamen sichtbar zu erhalten.
- issue: Bedeutung von שְׁאָר
  choice: Was übrig bleibt
  alternative: der Rest / die Übriggebliebenen
  rationale: Der unmittelbare Zusammenhang betont drastische zahlenmäßige und machtpolitische Verminderung, nicht ausdrücklich eine heilvolle Rest-Theologie.
- issue: Semantik von נִקְלָה
  choice: gering geachtet werden
  alternative: erniedrigt werden / entehrt werden
  rationale: Die gewählte Fassung bewahrt den Bezug auf Ansehen und Status; eine rein räumliche oder politische Erniedrigung wäre enger als der hebräische Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt ersetzt das im Deutschen schwerfällige ausdrückliche „indem er sagte“. Die ungewöhnliche Dreifachbestimmung „wenig, verschwindend klein und nicht stark“ bleibt erhalten, weil sie die emphatische Kürze des hebräischen Schlusses widerspiegelt.
