revisions:
- from: 'Doch nun hat Yahweh gesprochen: „In drei Jahren, genau bemessen wie die Jahre eines Lohnarbeiters,[a] wird Moabs Herrlichkeit samt seiner ganzen großen Menge gering geachtet werden.[b] Was übrig bleibt, wird wenig, verschwindend klein und nicht stark sein.“[c]'
  to: 'Doch nun hat Yahweh gesprochen: „Innerhalb von drei Jahren, wie die Jahre eines Lohnarbeiters,[a] wird Moabs Herrlichkeit mit all seiner großen Menge entehrt werden.[b] Nur wenige werden übrig bleiben, sehr wenige und nicht mächtig.[c]“'
  rationale: Die Revision vermeidet eine unnötige Auslegung im Haupttext, verbessert die moderne deutsche Idiomatik und gibt die zahlenmäßige Zuspitzung von מְעַט מִזְעָר klarer wieder. Sie erhält zugleich die semantische Breite von הָמוֹן, die Statusdimension von נִקְלָה und die Mehrdeutigkeit von כַּבִּיר.
