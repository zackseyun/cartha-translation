  verdict: approve
  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und Bildsprache insgesamt treffend wieder: die Felder Heschbons und der Weinstock Sibmas verfallen; die Machthaber der Völker schlagen die Edelreben; deren Reichweite wird bis Jaser, in die Wüste und über das Meer hinaus geschildert. Die plurale Bezugnahme in „Sie reichten … und verirrten sich“ ist im Deutschen nachvollziehbar auf die zuvor genannten Edelreben bezogen. Die schwierige Deutung von נִטְּשׁוּ wird nicht verschwiegen.'
  naturalness: Modernes, poetisch knappes Standarddeutsch. Die Zeilengliederung unterstützt den Parallelismus. „Auch der Weinstock von Sibma“ ist als elliptische poetische Fortsetzung natürlich. „Die Herren der Völker“ wahrt den gehobenen Ton, ohne unnötig zu archaïsieren.
  terminology: Die Ortsnamen Heschbon, Sibma und Jaser sind in deutscher Bibelsprache gebräuchlich. „Weinstock“, „Edelreben“ und „Triebe“ bilden ein stimmiges Bildfeld. „Herren der Völker“ gibt בעלי גוים angemessen offen wieder. Die Anmerkungen zu Edelreben/Ranken, zur schwierigen Verbform und zur möglichen Identifikation des Meeres sind sachlich und korrekt verankert.
