id: ISA.16.8
reference: Isaiah 16:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: de
  text: 'Denn die Felder von Heschbon verkümmern,

    auch der Weinstock von Sibma.

    Die Herren der Völker

    haben seine Edelreben[a] zerschlagen.

    Sie reichten bis nach Jaser

    und verirrten sich in die Wüste.

    Seine Triebe breiteten sich aus[b]

    und überquerten das Meer.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Ranken“. Das hebräische Wort kann ausgewählte Edelreben bezeichnen, möglicherweise aber auch Teile beziehungsweise Triebe des Weinstocks.'
    reason: lexical_alternative
  - marker: b
    text: 'Das zugrunde liegende hebräische Verb ist an dieser Stelle schwer zu deuten. Möglich ist auch: „wurden sich selbst überlassen“.'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: Mit „dem Meer“ könnte aufgrund der regionalen Geografie das Tote Meer gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: Felder
  rationale: Das Wort bezeichnet landwirtschaftlich genutzte Flächen. „Felder“ bleibt gegenüber der kontextuell möglichen Präzisierung „Weinfelder“ angemessen offen.
- source_word: אֻמְלָל
  choice: verkümmern
  rationale: Das Verb bezeichnet einen geschwächten, verdorrenden oder elenden Zustand. „Verkümmern“ passt zur Pflanzen- und Ackerbildsprache, ohne völliges Verdorren vorauszusetzen.
- source_word: גֶּפֶן שִׂבְמָה
  choice: der Weinstock von Sibma
  rationale: Der poetische Singular wird bewahrt; wahrscheinlich steht der Weinstock kollektiv für den Weinbau der Gegend.
- source_word: בַּעֲלֵי גוֹיִם
  choice: die Herren der Völker
  rationale: בעלים kann Herren, Machthaber oder Besitzer bezeichnen. Die formnahe Wiedergabe bewahrt den erhöhten Ton und legt die genaue politische Rolle nicht enger fest.
- source_word: הָלְמוּ
  choice: zerschlagen
  rationale: Das Verb bezeichnet kräftiges Schlagen. Im Zusammenhang der Verwüstung gibt „zerschlagen“ die zerstörerische Wirkung natürlich wieder.
- source_word: שְׂרוּקֶיהָ
  choice: seine Edelreben
  rationale: Der Ausdruck kann besonders ausgewählte, hochwertige Reben bezeichnen. Das Possessivpronomen richtet sich im Deutschen nach dem maskulinen „Weinstock“.
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: Sie reichten bis nach Jaser
  rationale: Der Plural knüpft am natürlichsten an die zuvor genannten Reben an und beschreibt ihre weite geografische Ausdehnung.
- source_word: תָּעוּ מִדְבָּר
  choice: und verirrten sich in die Wüste
  rationale: תעה bedeutet umherirren oder sich verirren. Die personifizierende Metapher der sich weit ausbreitenden Reben bleibt erhalten.
- source_word: שְׁלֻחוֹתֶיהָ
  choice: seine Triebe
  rationale: Das Substantiv bezeichnet Ausläufer oder ausgeschickte Triebe; „Triebe“ passt prägnant zum Weinstock.
- source_word: נִטְּשׁוּ
  choice: breiteten sich aus
  rationale: Die schwierige Form kann hier das lose Ausstrecken beziehungsweise weite Ausgreifen der Triebe beschreiben. Die aktive deutsche Form ergibt in der fortlaufenden Pflanzenmetapher einen natürlichen Sinn.
- source_word: עָבְרוּ יָם
  choice: überquerten das Meer
  rationale: Die Übersetzung folgt der offenen Bezeichnung יָם, ohne im Haupttext ein bestimmtes Gewässer festzulegen.
