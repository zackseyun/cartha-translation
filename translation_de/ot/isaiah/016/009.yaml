source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: de
  text: Darum weine ich mit dem Weinen Jasers um den Weinstock von Sibma. Ich tränke[a] dich mit meinen Tränen, Heschbon und Elale, denn über deine Sommerfrucht und über deine Ernte ist der Ruf hereingebrochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich durchnässe dich.“ Das Verb bezeichnet ein Tränken bis hin zum völligen Durchnässen.'
    reason: lexical_alternative
  - marker: b
    text: Der Ruf kann als hereinbrechender Kampfruf verstanden werden. Möglich ist auch, dass damit der sonst übliche Jubelruf bei der Ernte gemeint ist, der nun verstummt.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: ich weine
  rationale: Das Qal-Imperfekt kann zukünftig oder modal verstanden werden; im Zusammenhang des Klagelieds gibt das deutsche Präsens die gegenwärtig einsetzende Klage natürlich wieder.
- source_word: בִּבְכִי יַעְזֵר
  choice: mit dem Weinen Jasers
  rationale: Die instrumentale beziehungsweise begleitende Bedeutung der Präposition ב wird bewahrt, ohne das Verhältnis zwischen dem Sprecher und Jaser genauer festzulegen.
- source_word: גֶּפֶן שִׂבְמָה
  choice: der Weinstock von Sibma
  rationale: גפן bezeichnet wörtlich einen Weinstock, kann hier aber kollektiv für den Weinbau der Gegend stehen. Das Bild bleibt in seiner Einzahl erhalten.
- source_word: אֲרַיָּוֶךְ
  choice: ich tränke dich
  rationale: Das Piel von רוה bedeutet tränken, sättigen oder durchnässen. „Tränke“ verbindet sich im Deutschen natürlich mit Tränen und bewahrt zugleich das Bild der Bewässerung.
- source_word: דִּמְעָתִי
  choice: mit meinen Tränen
  rationale: Der Singular des hebräischen Kollektivbegriffs wird im Deutschen idiomatisch als Plural wiedergegeben und bezeichnet das Mittel des Tränkens.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Heschbon und Elale
  rationale: Die Ortsnamen werden in geläufiger deutscher Transkription wiedergegeben und als Anrede verstanden, ohne ein zusätzliches „o“ einzufügen.
- source_word: קֵיץ
  choice: Sommerfrucht
  rationale: קיץ bezeichnet reife Frucht beziehungsweise Erzeugnisse des Sommers. „Sommerfrucht“ erhält den landwirtschaftlichen Bildbereich.
- source_word: קָצִיר
  choice: Ernte
  rationale: Dies ist die direkte und im Zusammenhang natürliche Wiedergabe des landwirtschaftlichen Begriffs.
- source_word: הֵידָד
  choice: der Ruf
  rationale: הידד kann einen freudigen Ernte- oder Kelterruf, aber auch einen feindlichen Kampfruf bezeichnen. Die allgemeinere Wiedergabe „Ruf“ legt die Art des Rufes nicht vorschnell fest.
- source_word: נָפָל
  choice: ist hereingebrochen
  rationale: נפל bedeutet wörtlich „fallen“. In Verbindung mit einem Ruf und der Präposition עַל gibt „hereinbrechen über“ das bedrohliche Bild in natürlichem Deutsch wieder, ohne die alternative Deutung als verstummten Ernteruf in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung von הֵידָד נָפָל im Schlussglied
  choice: „der Ruf ist hereingebrochen“ mit offener Bezeichnung des Rufes
  alternative: „der Kampfruf ist hereingebrochen“ oder „der Jubelruf der Ernte ist verstummt“
  rationale: Der Gerichtskontext legt einen feindlichen Ruf nahe, doch הֵידָד kann auch den Jubel bei Ernte oder Kelter bezeichnen. Der Haupttext bewahrt die Spannung; die Fußnote nennt beide Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Wiederholung („mit dem Weinen“) und anschaulicher Agrarsprache. Die Ortsnamen folgen geläufigen deutschen Formen. Die ungewöhnliche Singularanrede „dich“ bleibt entsprechend der femininen Singularform im Hebräischen erhalten; der Bezug kann poetisch auf den Weinstock beziehungsweise die angesprochenen Orte übergehen.
