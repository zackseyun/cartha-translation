  to: Und wie ein umherirrender Vogel, wie ein fortgetriebenes Nest, so werden die Töchter Moabs[b] an den Furten des Arnon sein.
  rationale: „Fortgetriebenes Nest“ bildet die passive, von außen bewirkte Bewegung bzw. Vertreibung in מְשֻׁלָּח enger ab als „aufgescheuchtes Nest“, ohne die poetische Verdichtung aufzulösen. Da die revidierte Formulierung die relevante lexikalische Spannweite hinreichend direkt trägt, ist hierzu keine Fußnote erforderlich. Die Fußnote zu „Töchter Moabs“ bleibt zur Sicherung der Mehrdeutigkeit bestehen.
