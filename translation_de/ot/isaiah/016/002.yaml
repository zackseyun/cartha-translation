  verdict: revise
  source_fidelity: Die doppelte Vergleichsstruktur („wie … wie … so“) und die Zukunftsaussage geben den hebräischen Text zuverlässig wieder. „Aufgescheucht“ verschiebt jedoch die Bedeutung von מְשֻׁלָּח („weggesandt/vertrieben, fortgetrieben“) zu einem Erschrecken, das der passive Partizip nicht ausdrücklich bezeichnet.
  naturalness: Der Satz ist in modernem, gehobenem Deutsch flüssig und poetisch. „Ein fortgetriebenes Nest“ ist bewusst ein ungewöhnliches, aber dem verdichteten hebräischen Bild entsprechendes poetisches Bild und vermeidet die sachlich unpassende Vorstellung, ein Nest selbst könne aufgescheucht werden.
  terminology: „Töchter Moabs“ bewahrt die beabsichtigte Ambiguität; die erläuternde Fußnote ist angemessen. „Furten des Arnon“ ist präzise und idiomatisch. Der Eigenname Arnon ist korrekt.
