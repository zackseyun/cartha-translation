  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
translation:
  language: de
  text: Und wie ein umherirrender Vogel, wie ein fortgetriebenes Nest, so werden die Töchter Moabs[b] an den Furten des Arnon sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Die Töchter Moabs“ kann wörtlich die moabitischen Frauen oder bildlich die als Töchter personifizierten Ortschaften und Gemeinschaften Moabs meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … so werden … sein
  rationale: Die Konstruktion leitet den folgenden Vergleich und dessen Ergebnis ein. Im Deutschen verbindet „Und … so“ beide Bildhälften natürlich, während die Zukunft durch „werden … sein“ ausgedrückt wird.
- source_word: כְעוֹף נוֹדֵד
  choice: wie ein umherirrender Vogel
  rationale: עוֹף bezeichnet einen Vogel, נוֹדֵד dessen unstete, wandernde Bewegung. „Umherirrend“ vermittelt zugleich Bewegung und Heimatlosigkeit, ohne Fluchtpanik ausdrücklich festzulegen.
- source_word: קֵן מְשֻׁלָּח
  choice: wie ein aufgescheuchtes Nest
  rationale: Wörtlich steht ein „fortgeschicktes“ oder „vertriebenes Nest“. Das verdichtete poetische Bild meint offenbar ein gestörtes, auseinandergetriebenes Nest; „aufgescheucht“ bewahrt die ungewöhnliche Metonymie und klingt im Deutschen bildhaft und verständlich.
- source_word: בְּנוֹת מוֹאָב
  choice: die Töchter Moabs
  rationale: Die wörtliche Wiedergabe bewahrt die mögliche Mehrdeutigkeit zwischen moabitischen Frauen und den personifiziert als Töchter bezeichneten Orten oder Gemeinschaften Moabs.
- source_word: מַעְבָּרֹת לְאַרְנוֹן
  choice: an den Furten des Arnon
  rationale: מַעְבָּרוֹת bezeichnet Übergangsstellen, besonders Flussfurten. „Des Arnon“ gibt die Zugehörigkeit dieser Furten zum Fluss bzw. Tal natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter poetischer Parallelität. Die doppelte Vergleichspartikel „wie … wie“ und das entsprechende „so“ bilden die hebräische Struktur klar ab; die Mehrdeutigkeiten der Bilder werden nicht eingeengt.
