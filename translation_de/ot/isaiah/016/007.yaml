  text: לָ/כֵ֗ן יְיֵלִ֥יל מוֹאָ֛ב לְ/מוֹאָ֖ב כֻּלֹּ֣/ה יְיֵלִ֑יל לַ/אֲשִׁישֵׁ֧י קִיר חֲרֶ֛שֶׂת תֶּהְגּ֖וּ אַךְ נְכָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/007.yaml
  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
translation:
  language: de
  text: Darum wird Moab um Moab wehklagen; ganz Moab wird wehklagen. Um die Rosinenkuchen[a] von Kir-Hareset werdet ihr stöhnen, völlig niedergeschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „um die Grundmauern von Kir-Hareset“. Das hebräische אֲשִׁישֵׁי ist schwierig; der masoretische Text lässt sich jedoch am naheliegendsten als „Rosinenkuchen“ verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem vorhergehenden Gerichtswort ein; „Darum“ ist im Deutschen klar und idiomatisch.
- source_word: יְיֵלִיל
  choice: wird wehklagen
  rationale: Das Verb ילל bezeichnet lautes Klagen im Zusammenhang mit Gericht und Unglück. „Wehklagen“ bewahrt die Intensität und den würdevollen prophetischen Ton.
- source_word: לְמוֹאָב
  choice: um Moab
  rationale: 'Die Präposition bezeichnet hier am ehesten den Gegenstand beziehungsweise Anlass der Klage: Das personifizierte Moab klagt um sich selbst.'
- source_word: כֻּלֹּה
  choice: ganz Moab
  rationale: Das Suffix bezieht sich kollektiv auf Moab als Ganzes. Die Wiederaufnahme des Eigennamens klingt im Deutschen natürlicher als „es ganz“ und erhält den Sinn.
- source_word: לַאֲשִׁישֵׁי
  choice: um die Rosinenkuchen
  rationale: אֲשִׁישָׁה bezeichnet sonst einen Rosinen- oder Presskuchen. Im Gerichtskontext steht die Klage darüber wahrscheinlich für verlorenen Wohlstand; die schwierige alternative Deutung „Grundmauern“ wird in der Fußnote bewahrt.
- source_word: קִיר חֲרֶשֶׂת
  choice: Kir-Hareset
  rationale: Die Wortgruppe ist hier der Eigenname einer moabitischen Stadt und wird daher transliteriert.
- source_word: תֶּהְגּוּ
  choice: werdet ihr stöhnen
  rationale: הגה kann ein leises, hörbares Äußern wie Murmeln, Seufzen oder Stöhnen bezeichnen. Im Klagezusammenhang passt „stöhnen“; die zweite Person Plural bewahrt den rhetorischen Wechsel zur direkten Anrede.
- source_word: אַךְ נְכָאִים
  choice: völlig niedergeschlagen
  rationale: אַךְ verstärkt hier wahrscheinlich den Zustand, während נְכָאִים ein durch Leid geschlagenes oder gebeugtes Dasein bezeichnet. Die deutsche Wendung gibt beides natürlich wieder.
