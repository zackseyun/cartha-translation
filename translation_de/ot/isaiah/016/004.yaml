  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: de
  text: Die Vertriebenen Moabs mögen bei dir als Fremde wohnen; sei ihnen ein Versteck vor dem Verwüster. Denn der Bedrücker ist nicht mehr da, die Verwüstung hat aufgehört, die, die niedertreten, sind aus dem Land verschwunden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere verbreitete Deutung aufgrund einer abweichenden Vokalisierung beziehungsweise Gliederung des Versanfangs: „Meine Vertriebenen sollen bei dir wohnen, Moab; sei ihm ein Versteck vor dem Verwüster.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: sollen bei dir als Fremde wohnen
  rationale: גור bezeichnet den zeitweiligen Aufenthalt als Fremder oder Schutzsuchender. Die Formulierung bewahrt diesen Sinn und gibt den auffordernden Charakter des Kontextes natürlich wieder.
- source_word: נִדָּחַי מוֹאָב
  choice: die Vertriebenen Moabs
  rationale: נדח bezeichnet Menschen, die fortgetrieben, verstoßen oder zerstreut wurden. „Vertriebene“ wahrt den passiven Sinn und passt zum Schutzgesuch.
- source_word: הֱוִי סֵתֶר
  choice: sei ihnen ein Versteck
  rationale: סֵתֶר bezeichnet einen verborgenen, schützenden Ort. „Versteck“ erhält das konkrete Bild; „Zuflucht“ wäre möglich, aber abstrakter.
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: vor dem Verwüster
  rationale: שׁוֹדֵד bezeichnet jemanden, der plündert und verheert. „Verwüster“ umfasst die gewaltsame Zerstörung besser als das engere „Plünderer“.
- source_word: אָפֵס הַמֵּץ
  choice: der Bedrücker ist nicht mehr da
  rationale: אָפֵס drückt das Aufhören oder Nicht-mehr-Vorhandensein aus; הַמֵּץ ist schwierig und wird im Parallelismus plausibel als Bedrücker verstanden.
- source_word: כָּלָה שֹׁד
  choice: die Verwüstung hat aufgehört
  rationale: שֹׁד kann Gewalt, Verheerung oder Plünderung bezeichnen. „Verwüstung“ passt zum breiten Kontext gewaltsamer Zerstörung.
- source_word: תַּמּוּ רֹמֵס
  choice: die Zertreter sind ... verschwunden
  rationale: Das Verb steht im Plural, während רֹמֵס kollektiv gebraucht sein kann. Der deutsche Plural bildet die hebräische Kongruenz ab und erhält das Bild des Niedertretens.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: אֶרֶץ bezeichnet hier im regional-politischen Zusammenhang eher das Land als die gesamte Erde.
theological_decisions:
- issue: Adressat und syntaktische Gliederung des Versanfangs
  choice: Eine feminine Singulargröße wird aufgefordert, die Vertriebenen Moabs aufzunehmen.
  alternative: „Meine Vertriebenen sollen bei dir wohnen, Moab; sei ihm ein Versteck vor dem Verwüster.“
  rationale: Die masoretische Punktierung des vorgelegten Textes ergibt בָךְ als feminine Singularform und נִדָּחַי מוֹאָב als „die Vertriebenen Moabs“. Eine verbreitete alternative Vokalisierung beziehungsweise Gliederung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als Fremde wohnen“ bewahrt den zeitweiligen Schutzaufenthalt; „Versteck“, „Verwüster“ und „Zertreter“ erhalten die konkreten Gewalt- und Schutzbilder des Hebräischen.
