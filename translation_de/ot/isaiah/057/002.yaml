base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/002.yaml
  text: He enters into peace[a]; they rest on their beds[c][b], each one who walks in his uprightness.
translation:
  language: de
  text: Er geht in Frieden ein[a]; sie ruhen auf ihren Lagern – jeder, der aufrichtig seinen Weg geht.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er kommt zum Frieden.“ Das hebräische Verb kann hier als Kommen oder als Eingehen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wechselt die Zahl: „Er geht ein … sie ruhen … der geht“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher auch: „jeder, der in seiner Geradheit geht“; möglicherweise: „der gerade vor ihm geht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא
  choice: geht ein
  rationale: Das qal-Imperfekt von בוא bezeichnet hier im poetischen Zusammenhang den Übergang des in Vers 1 genannten Gerechten in den Frieden. „Geht ein“ gibt diese Bewegung idiomatisch wieder, ohne den Bildgehalt weiter auszudeuten.
- source_word: שָׁלוֹם
  choice: in den Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Ganzheit. „Frieden“ ist die prägnante und kontextgemäße Wiedergabe; der bestimmte Artikel macht die deutsche Wendung natürlich.
- source_word: יָנוּחוּ
  choice: sie ruhen
  rationale: Das qal-Imperfekt 3. Person Plural von נוח bezeichnet Ruhe. Die knappe Wiedergabe bewahrt sowohl den Trost als auch die Todesmetaphorik des Verses.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: auf ihren Lagern
  rationale: Der Ausdruck bedeutet wörtlich „auf ihren Liegestätten/Lagern“. „Lager“ erhält das konkrete poetische Bild, ohne es ausdrücklich als Grab oder himmlischen Ruheort festzulegen.
- source_word: הֹלֵךְ
  choice: der … seinen Weg geht
  rationale: Das maskuline Singularpartizip von הלך beschreibt eine kennzeichnende Lebensführung. Die deutsche Wendung „seinen Weg gehen“ gibt das Gehen-Bild natürlich wieder und wahrt den präsentisch-charakterisierenden Aspekt des Partizips.
- source_word: נְכֹחוֹ
  choice: aufrichtig
  rationale: Die verdichtete Form mit Suffix kann ethische Geradheit beziehungsweise ein gerades Gehen ausdrücken. „Aufrichtig“ vermittelt diesen Sinn in natürlichem Deutsch; die syntaktisch möglichen Alternativen werden in einer Fußnote offengehalten.
theological_decisions:
- issue: Wechsel zwischen Singular und Plural
  choice: „Er geht ein … sie ruhen … jeder, der …“
  alternative: Den gesamten Vers entweder in den Singular oder in den Plural angleichen.
  rationale: Der hebräische Text wechselt bewusst oder jedenfalls tatsächlich zwischen Singular, Plural und erneutem Singular. Die Übersetzung bewahrt diesen Wechsel; „jeder“ verdeutlicht lediglich den distributiven Bezug, ohne die Spannung zu beseitigen.
- issue: Bildsprache des Todes und der Ruhe
  choice: Das Bild vom Ruhen auf Lagern bleibt bestehen.
  alternative: Die Lager ausdrücklich als Gräber oder die Ruhe ausdrücklich als himmlischen Zustand deuten.
  rationale: Im Zusammenhang spricht der Vers tröstlich vom Tod des Gerechten, legt aber die genaue Beschaffenheit dieses Friedens und dieser Ruhe nicht weiter aus. Eine explizite metaphysische Festlegung würde über den Wortlaut hinausgehen.
- issue: Deutung von נְכֹחוֹ
  choice: Ethisch als „aufrichtig“ wiedergeben.
  alternative: Räumlich beziehungsweise relational als „gerade vor sich hin“ oder „gerade vor ihm“ verstehen.
  rationale: Der Zusammenhang mit dem Gerechten in Vers 1 begünstigt die ethische Deutung, doch die knappe hebräische Form bleibt mehrdeutig; deshalb werden andere mögliche Auffassungen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Lager“ bewahrt die konkrete Bildsprache, während „aufrecht seinen Weg gehen“ vermieden wurde, weil „aufrichtig seinen Weg gehen“ im heutigen Deutsch natürlicher ist. Der Gedankenstrich markiert den distributiven Nachsatz, ohne den hebräischen Numeruswechsel zu glätten.
