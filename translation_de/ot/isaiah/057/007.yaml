  text: עַ֤ל הַר גָּבֹ֨הַּ֙ וְ/נִשָּׂ֔א שַׂ֖מְתְּ מִשְׁכָּבֵ֑/ךְ גַּם שָׁ֥ם עָלִ֖ית לִ/זְבֹּ֥חַ זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/007.yaml
  text: On a high and lofty mountain you set your bed[b][a]; there too you went up to sacrifice a sacrifice.
translation:
  language: de
  text: Auf einem hohen und emporragenden Berg hast du dein Lager bereitet[b]; auch dort[a] bist du hinaufgestiegen, um ein Opfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »selbst dort«.'
    reason: lexical_alternative
  - marker: b
    text: »Dein Lager« hat in diesem Zusammenhang wahrscheinlich sexuelle Untertöne und dient als Bild für götzendienerische Verehrung.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַר
  choice: Auf einem … Berg
  rationale: Die Präposition bezeichnet den Ort, und הַר wird in seiner gewöhnlichen Bedeutung »Berg« wiedergegeben.
- source_word: גָּבֹהַּ וְנִשָּׂא
  choice: hohen und ragenden
  rationale: Die beiden Adjektive verstärken gemeinsam die Vorstellung großer Höhe. »Ragend« gibt נִשָּׂא räumlich und würdevoll wieder, ohne hier unnötig eine theologische Bedeutung von »erhaben« einzutragen.
- source_word: שַׂמְתְּ מִשְׁכָּבֵךְ
  choice: hast du dein Lager bereitet
  rationale: מִשְׁכָּב bezeichnet einen Ort des Liegens oder ein Lager und trägt im Zusammenhang sexuelle und götzendienerische Untertöne. Die deutsche Wendung ist natürlich und bewahrt das konkrete Bild, ohne die Metapher auszudeuten.
- source_word: גַּם שָׁם
  choice: auch dort
  rationale: Die Formulierung gibt die hinzufügende beziehungsweise hervorhebende Kraft von גַּם in idiomatischem Deutsch wieder; die mögliche stärkere Betonung bleibt in einer Fußnote erhalten.
- source_word: עָלִית
  choice: bist du hinaufgestiegen
  rationale: Das Verb bezeichnet ein Hinaufgehen; die Wiedergabe passt zum zuvor genannten Berg und erhält die Bewegungsrichtung.
- source_word: לִזְבֹּחַ זָבַח
  choice: um ein Opfer darzubringen
  rationale: Der Infinitiv mit dem stammverwandten Substantiv bezeichnet ausdrücklich eine Opferhandlung. Die deutsche Wiedergabe erhält den kultischen Sinn und das Objekt, ohne die im Deutschen schwerfällige Wiederholung »ein Opfer opfern« nachzubilden.
theological_decisions:
- issue: Sexuelle Bildsprache für Götzendienst in מִשְׁכָּבֵךְ
  choice: Das konkrete Bild »dein Lager« bleibt im Haupttext stehen.
  alternative: dein Ort unerlaubter Verehrung
  rationale: Der hebräische Text nennt das Lager und lässt die sexuelle Bildsprache im Kontext als Anklage gegen den Götzendienst wirken. Eine explizite Deutung im Haupttext würde die vorhandene Metapher auflösen.
- issue: Kultische Bedeutung von זבח
  choice: Opfer darbringen
  alternative: ein Opfer schlachten
  rationale: Die gewählte Formulierung bewahrt den kultischen Charakter der Handlung. »Schlachten« wäre zwar lexikalisch möglich, könnte im Deutschen aber den körperlichen Vorgang stärker hervorheben als die Opferhandlung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit prophetisch-würdigem Ton. Die feminine Anrede des Hebräischen wird im Deutschen nicht eigens markiert. Das Semikolon erhält die enge Verbindung zwischen dem bereiteten Lager und der dort vollzogenen Opferhandlung.
