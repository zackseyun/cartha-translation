  source_fidelity: 'Die Übersetzung gibt die Struktur des hebräischen Textes zuverlässig wieder: Gottes Erhabenheit, sein Wohnen in der Ewigkeit bzw. auf hoher und heiliger Höhe, seine Nähe zu den Bedrückten sowie die zweifache Zielangabe mit »Geist« und »Herz«. Die Wiederholung von לְהַחֲיוֹת wird angemessen bewahrt. Eine kleine Anpassung verbessert jedoch die Wiedergabe von שְׁפַל רוּחַ und שְׁפָלִים.'
