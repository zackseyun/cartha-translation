  terminology: »Zerschlagen« bewahrt zutreffend das Bild von דַּכָּא und נִדְכָּאִים, ohne die stärker deutende Verengung auf Reue vorzunehmen. »Beleben«, »Geist« und »Herz« sind passend. Die Fußnote zu »Zerknirschten« bleibt als traditionelle, enger deutende Alternative sinnvoll.
