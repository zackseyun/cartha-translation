  to: 'Denn so spricht der Hohe und Erhabene, der die Ewigkeit bewohnt[a] und dessen Name heilig ist: »An einem hohen und heiligen Ort wohne ich und ebenso bei dem Zerschlagenen und Demütigen im Geist[b], um den Geist der Demütigen zu beleben und das Herz der Zerschlagenen zu beleben.«'
  rationale: Die Revision beschränkt sich auf die natürlichere Wiedergabe von שְׁפַל רוּחַ und שְׁפָלִים als »demütig im Geist« beziehungsweise »der Demütigen«. Die Übersetzung bewahrt weiterhin die Spannung zwischen Gottes erhabenem Wohnen und seiner Gegenwart bei den Zerschlagenen sowie die Bildsprache und Wiederholungen des hebräischen Textes.
