  text: כִּי֩ כֹ֨ה אָמַ֜ר רָ֣ם וְ/נִשָּׂ֗א שֹׁכֵ֥ן עַד֙ וְ/קָד֣וֹשׁ שְׁמ֔/וֹ מָר֥וֹם וְ/קָד֖וֹשׁ אֶשְׁכּ֑וֹן וְ/אֶת דַּכָּא֙ וּ/שְׁפַל ר֔וּחַ לְ/הַחֲיוֹת֙ ר֣וּחַ שְׁפָלִ֔ים וּֽ/לְ/הַחֲי֖וֹת לֵ֥ב נִדְכָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: de
  text: 'Denn so spricht der Hohe und Erhabene, der die Ewigkeit bewohnt[a] und dessen Name heilig ist: »An einem hohen und heiligen Ort wohne ich und ebenso bei dem Zerschlagenen und Demütigen im Geist[b], um den Geist der Demütigen zu beleben und das Herz der Zerschlagenen zu beleben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der für immer wohnt«. Der hebräische Ausdruck kann entweder die ewige Dauer oder das Wohnen in der Ewigkeit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »bei dem Zerknirschten und Demütigen im Geist«; entsprechend später: »das Herz der Zerknirschten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: der Hohe und Erhabene
  rationale: Die substantivierte Gottesbezeichnung bewahrt sowohl die Höhenvorstellung als auch den Gedanken der Erhabenheit und klingt im Deutschen würdig und natürlich.
- source_word: שֹׁכֵן עַד
  choice: der die Ewigkeit bewohnt
  rationale: Die poetische Formulierung gibt die mögliche räumlich-sphärische Bedeutung von עַד wieder und hält zugleich den Zusammenhang mit dem späteren Wohnen aufrecht; die mögliche zeitliche Deutung wird in der Fußnote genannt.
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: dessen Name heilig ist
  rationale: Die Wiedergabe wahrt den prädikativen Sinn des hebräischen Nominalsatzes, ohne „heilig“ zu einem Eigennamen zu machen.
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: An einem hohen und heiligen Ort wohne ich
  rationale: „Ort“ wird zur idiomatischen Verdeutlichung der Ortsangabe ergänzt. „Wohnen“ erhält die bewusste Verbindung zu שֹׁכֵן.
- source_word: דַּכָּא / נִדְכָּאִים
  choice: der Zerschlagene / die Zerschlagenen
  rationale: „Zerschlagen“ bildet das konkrete Wortbild direkter ab als das traditionell deutende „zerknirscht“ und wird für die verwandten Formen einheitlich verwendet.
- source_word: שְׁפַל רוּחַ
  choice: niedrig im Geist
  rationale: Die Formulierung bleibt eng bei der inneren Niedrigkeit des hebräischen Ausdrucks, ohne sie ausschließlich als moralische Demut auszulegen.
- source_word: לְהַחֲיוֹת
  choice: zu beleben
  rationale: Der Hifil von חיה bezeichnet hier das Lebendigmachen beziehungsweise Wiederbeleben. „Beleben“ vermeidet eine unnötige Festlegung auf körperliche Auferstehung.
- source_word: רוּחַ שְׁפָלִים
  choice: den Geist der Niedrigen
  rationale: „Geist“ wird als anthropologischer Begriff beibehalten; „Niedrige“ stellt die lexikalische Verbindung zu שְׁפַל רוּחַ her.
- source_word: לֵב נִדְכָּאִים
  choice: das Herz der Zerschlagenen
  rationale: „Herz“ bewahrt die biblische Rede vom inneren Menschen, und „Zerschlagene“ gibt den Zusammenhang mit דַּכָּא wieder.
theological_decisions:
- issue: Gottes Transzendenz und Nähe
  choice: Sowohl Gottes Wohnen am hohen und heiligen Ort als auch sein Wohnen bei den Zerschlagenen werden ohne Abschwächung wiedergegeben.
  alternative: Die Aussage über Gottes Nähe nur bildlich verstehen oder seine Erhabenheit beziehungsweise Nähe einseitig hervorheben.
  rationale: Der hebräische Text stellt beide Aussagen unmittelbar nebeneinander. Die Übersetzung bewahrt diese theologische Spannung, statt sie aufzulösen.
- issue: Bedeutung von דַּכָּא / נִדְכָּאִים
  choice: „zerschlagen“ im Haupttext
  alternative: „zerknirscht“ oder „reuig“
  rationale: Der direkte lexikalische Sinn ist „zerschlagen/gebrochen“. „Zerknirscht“ kann Reue in den Vordergrund rücken und wäre damit enger als der hebräische Ausdruck.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Färbung. Die Wiederholung von „wohne“ und „beleben“ sowie die Begriffe „Geist“ und „Herz“ wurden bewusst erhalten. Die Formulierung „der die Ewigkeit bewohnt“ ist gehoben, aber verständlich; ihre echte Bedeutungsbreite wird durch Fußnote [a] offengehalten.
