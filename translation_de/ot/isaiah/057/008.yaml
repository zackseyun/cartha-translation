  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: de
  text: Hinter der Tür und dem Türpfosten hast du dein Erinnerungszeichen aufgestellt[a]. Denn von mir weg hast du dich entblößt und bist hinaufgestiegen; du hast dein Lager weit ausgebreitet und dir mit ihnen einen Bund geschlossen[b]. Du hast ihr Lager geliebt; du hast eine Hand betrachtet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du hast dein Gedächtniszeichen angebracht«. Das hebräische Wort kann eine Erinnerung oder ein konkretes Erinnerungszeichen bezeichnen; im Zusammenhang könnte ein verborgen angebrachtes Kultzeichen gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier eine Wendung mit »schneiden«, die häufig für das Schließen eines Bundes verwendet wird; das Wort »Bund« selbst steht im Hebräischen nicht ausdrücklich.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »du hast eine Hand betrachtet«. Die Wendung ist unklar. »Hand« könnte hier möglicherweise ein Denkmal oder Zeichen bezeichnen oder als sexuelles Bild gebraucht sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: Hinter der Tür und dem Türpfosten
  rationale: אַחַר bezeichnet hier den verborgenen Ort hinter der Tür; מְזוּזָה ist der seitliche Türpfosten, nicht die Schwelle.
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: hast du dein Erinnerungszeichen aufgestellt
  rationale: זִכָּרוֹן kann eine Erinnerung oder ein konkretes Erinnerungszeichen bezeichnen. „Erinnerungszeichen“ bewahrt die mögliche Gegenständlichkeit, ohne den Gegenstand vorschnell als Götzenbild festzulegen.
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: Denn von mir weg hast du dich entblößt
  rationale: מֵאִתִּי hat trennende Bedeutung; גלה wahrt hier die sexuell und beschämend gefärbte Bildsprache des Abfalls.
- source_word: וַתַּעֲלִי
  choice: und bist hinaufgestiegen
  rationale: Die Grundbedeutung von עלה bleibt erhalten, ohne den möglichen Bezug zu einer Höhe oder einem erhöhten Lager ausdrücklich festzulegen.
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: du hast dein Lager weit gemacht
  rationale: Die konkrete Metapher eines verbreiterten Liegeplatzes wird eng am Hebräischen und zugleich in würdigem Deutsch wiedergegeben.
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: und dir mit ihnen einen Bund geschlossen
  rationale: כרת wird häufig idiomatisch für das Schließen eines Bundes gebraucht. Die Fußnote weist darauf hin, dass das Substantiv „Bund“ im hebräischen Text nicht ausdrücklich steht.
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: Du hast ihr Lager geliebt
  rationale: Die sexuell aufgeladene Metapher bleibt bestehen und wird nicht einseitig als Götzendienst oder politische Bündnispolitik aufgelöst.
- source_word: יָד חָזִית
  choice: du hast eine Hand betrachtet
  rationale: יָד bedeutet gewöhnlich „Hand“, während חזה ein bewusstes Sehen oder Schauen ausdrückt. Die wörtliche, bewusst rätselhafte Wiedergabe vermeidet eine spekulative Festlegung.
theological_decisions:
- issue: Sexuelle und götzendienstliche Bildsprache für Judas Untreue
  choice: Die sexuelle Bildwelt bleibt im Haupttext erhalten, ohne sie ausschließlich auf Götzendienst oder politische Bündnisse festzulegen.
  alternative: Den Vers vollständig als direkte Aussage über Götzendienst oder ausschließlich als Kritik politischer Bündnisse paraphrasieren.
  rationale: Der prophetische Text verschränkt sexuelle Untreue, Abfall und möglicherweise fremde Bündnisse. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Nicht ausdrücklich genanntes Bundesmotiv in וַתִּכְרָת
  choice: Die geläufige Wendung „einen Bund schließen“ steht im Haupttext, mit einem Hinweis auf die formale Ellipse.
  alternative: Neutraler mit „eine Abmachung treffen“ übersetzen.
  rationale: Das Verb כרת trägt in solchen Zusammenhängen die feste bundesbezogene Bedeutung, doch die Fußnote verhindert, dass die Ergänzung des nicht genannten Substantivs unsichtbar bleibt.
- issue: Deutung von יָד am Versende
  choice: Die Grundbedeutung „Hand“ bleibt im Haupttext stehen.
  alternative: Als Denkmal, Kultzeichen oder sexuelles Euphemismusobjekt übersetzen.
  rationale: Die Wendung ist textlich erhalten, aber semantisch dunkel. Keine der spezifischen Deutungen ist sicher genug, um die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede in der weiblichen Singularform, wie sie im hebräischen Text an die personifizierte Gemeinschaft gerichtet ist. Die Lager- und Entblößungsmetaphorik bleibt bewusst anschaulich; die dunkelste Wendung am Versende wird nicht geglättet.
