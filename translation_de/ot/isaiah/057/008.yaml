revisions:
- from: Hinter der Tür und dem Türpfosten hast du dein Erinnerungszeichen aufgestellt[a]. Denn von mir weg hast du dich entblößt und bist hinaufgestiegen; du hast dein Lager weit gemacht und dir mit ihnen einen Bund geschlossen[b]. Du hast ihr Lager geliebt; du hast eine Hand betrachtet[c].
  to: Hinter der Tür und dem Türpfosten hast du dein Erinnerungszeichen aufgestellt[a]. Denn von mir weg hast du dich entblößt und bist hinaufgestiegen; du hast dein Lager weit ausgebreitet und dir mit ihnen einen Bund geschlossen[b]. Du hast ihr Lager geliebt; du hast eine Hand betrachtet[c].
  rationale: Die einzige Änderung ersetzt die im Deutschen unnatürliche Formulierung „dein Lager weit gemacht“ durch „dein Lager weit ausgebreitet“. Dadurch wird die Bedeutung von הִרְחַבְתְּ („weit machen, verbreitern“) klar und idiomatisch wiedergegeben. Die Mehrdeutigkeit der übrigen schwierigen Ausdrücke und die vorhandenen Fußnoten bleiben unverändert erhalten.
