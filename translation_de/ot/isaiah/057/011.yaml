revisions:
- from: Und vor wem hattest du solche Angst, und wen fürchtetest du, sodass du gelogen und nicht an mich gedacht hast, es dir nicht zu Herzen genommen hast[a]? Liegt es nicht daran, dass ich geschwiegen habe, und das schon seit Langem[b], sodass du mich nicht fürchtest?
  to: Vor wem hattest du Angst, und wen fürchtetest du, sodass du gelogen hast, dich nicht an mich erinnert und es dir nicht zu Herzen genommen hast[a]? Liegt es nicht daran, dass ich schon seit Langem geschwiegen habe[b], sodass du mich nicht fürchtest?
  rationale: Die Revision entfernt die nicht ausdrücklich belegte Intensivierung „solche“, gibt זכר mit der im Deutschen präziseren reflexiven Form „sich an mich erinnern“ wieder und glättet die Verbkoordination. Die Einbindung von „schon seit Langem“ in den Schweige-Satz ist idiomatischer, ohne die als eigenständige Zeitangabe wahrnehmbare Aussage von וּמֵעוֹלָם oder die rhetorische Folgerung zu verändern.
