source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: de
  text: Vor wem hattest du Angst, und wen fürchtetest du, sodass du gelogen hast, dich nicht an mich erinnert und es dir nicht zu Herzen genommen hast[a]? Liegt es nicht daran, dass ich schon seit Langem geschwiegen habe[b], sodass du mich nicht fürchtest?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „du hast es nicht auf dein Herz gelegt“; gemeint ist: Du hast es nicht ernsthaft bedacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „von alters her“ oder „eine lange Zeit hindurch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ
  choice: hattest du solche Angst
  rationale: Das Verb bezeichnet hier im Parallelismus mit ירא angstvolle Besorgnis bzw. Furcht. Die Formulierung gibt die emotionale Stärke und die rhetorische Frage in natürlichem Deutsch wieder.
- source_word: וַתִּירְאִי
  choice: und wen fürchtetest du
  rationale: Die koordinierte Wiedergabe bewahrt das hebräische Verbpaar, ohne beide Ausdrücke im Deutschen völlig gleich klingen zu lassen.
- source_word: כִּי תְכַזֵּבִי
  choice: sodass du gelogen hast
  rationale: 'כִּי wird hier als Folgeangabe verstanden: Die Furcht vor anderen führte zum falschen Handeln. Das Piel von כזב wird klar und unmittelbar mit „lügen“ wiedergegeben.'
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: und nicht an mich gedacht hast
  rationale: זכר meint hier ein wirksames Erinnern bzw. Sich-vergegenwärtigen. „An mich gedacht“ ist im Deutschen natürlicher als „mich erinnert“ und lässt den bundesbezogenen Ernst des Erinnerns bestehen.
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: es dir nicht zu Herzen genommen hast
  rationale: Die geläufige deutsche Wendung entspricht dem hebräischen Bild, etwas auf das Herz zu legen, und bezeichnet ernstes inneres Bedenken. Das im Hebräischen unausgesprochene Objekt wird mit „es“ ergänzt.
- source_word: הֲלֹא
  choice: Liegt es nicht daran, dass
  rationale: Die negativ-rhetorische Frage führt eine Erklärung für das vorausgehende Verhalten ein. Diese Formulierung macht die im Zusammenhang naheliegende kausale Beziehung in idiomatischem Deutsch deutlich.
- source_word: מַחְשֶׁה
  choice: ich geschwiegen habe
  rationale: חשה bedeutet „schweigen“ bzw. „sich still verhalten“. Das Perfekt stellt Gottes bisheriges Schweigen als den Hintergrund der gegenwärtigen Lage dar.
- source_word: וּמֵעוֹלָם
  choice: und das schon seit Langem
  rationale: עוֹלָם bezeichnet hier eine weit zurückreichende Zeitspanne, nicht abstrakte Ewigkeit. Die Formulierung wahrt zugleich die eigenständige, nachgetragene Zeitangabe.
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: sodass du mich nicht fürchtest
  rationale: Die Schlussaussage wird als Folge des lang anhaltenden göttlichen Schweigens verstanden. Das Präsens gibt den fortbestehenden Zustand der fehlenden Gottesfurcht wieder.
theological_decisions:
- issue: Bedeutung und Wirkung des göttlichen Schweigens
  choice: Gottes langes Schweigen wird als Anlass dafür dargestellt, dass die Angesprochene ihn nicht fürchtet.
  alternative: Das Schweigen lediglich als neutrale Nichtintervention oder als absolute Verborgenheit Gottes zu deuten.
  rationale: Der Vers selbst verbindet Gottes Schweigen mit der fehlenden Furcht der Angesprochenen. Die Übersetzung bewahrt diese Spannung, ohne daraus Gleichgültigkeit, Zustimmung oder eine umfassende Lehre über Gottes Verborgenheit abzuleiten.
- issue: Bezugsrichtung von כִּי und der Schlussklausel
  choice: 'Beide Zusammenhänge werden folgernd beziehungsweise kausal wiedergegeben: Furcht vor anderen führt zur Lüge; Gottes langes Schweigen bietet den Anlass zur fehlenden Gottesfurcht.'
  alternative: כִּי nur neutral mit „dass“ und die Schlussklausel lediglich koordinierend mit „und“ wiederzugeben.
  rationale: Die resultative Wiedergabe passt zur rhetorischen Argumentation, bleibt jedoch durch die Fragestruktur als anklagende Deutung des Verses erkennbar und macht keine weitergehende dogmatische Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Singularanrede des Hebräischen ist in den deutschen Verbformen nicht sichtbar, wird aber nicht durch eine zusätzliche Identifikation eingeengt. Die zweimalige Folgeangabe „sodass“ bildet die argumentative Bewegung des hebräischen Satzes ab; die Fußnoten bewahren die Bildlichkeit und zeitliche Mehrdeutigkeit.
