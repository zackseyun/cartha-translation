  terminology: „Angst haben“, „fürchten“, „lügen“, „sich zu Herzen nehmen“ und „schweigen“ sind passende moderne Wiedergaben. Die Fußnoten erläutern sowohl das hebräische Herz-Idioms als auch die zeitliche Weite von מֵעוֹלָם angemessen.
