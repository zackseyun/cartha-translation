    rationale: Im Deutschen entspricht „sich an jemanden erinnern“ dem Verb זכר in diesem Kontext unmittelbarer. Die reflexive Form macht zugleich klar, dass die angesprochene Person und nicht Gott das Subjekt des Erinnerns ist.
