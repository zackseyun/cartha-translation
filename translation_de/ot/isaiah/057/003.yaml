  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
translation:
  language: de
  text: Ihr aber, kommt her, Söhne einer Wahrsagerin[a], Nachkommen eines Ehebrechers und einer Prostituierten[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einer Frau, die verbotene Zeichen deutet“. Das hebräische Wort bezeichnet eine unerlaubte Form der Wahrsagerei.'
    reason: lexical_alternative
  - marker: b
    text: Die Rede von Abstammung und sexueller Untreue kann hier ein prophetisches Bild für Götzendienst und Untreue gegenüber Gott sein; sie muss nicht die tatsächliche Herkunft der Angeredeten bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion zusammen mit dem betonten Pronomen setzt die Angeredeten in einen scharfen Gegensatz zum vorherigen Zusammenhang. „Ihr aber“ gibt diese adversative Wirkung im Deutschen natürlich wieder.
- source_word: קִרְבוּ הֵנָּה
  choice: kommt her
  rationale: Der Imperativ Plural von קרב und das Ortsadverb הֵנָּה bilden zusammen eine unmittelbare, herausfordernde Aufforderung. „Kommt her“ ist idiomatisches modernes Deutsch.
- source_word: בְּנֵי
  choice: Söhne einer
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin plural und bezeichnet hier Zugehörigkeit beziehungsweise charakterliche Abstammung. „Söhne“ bewahrt sowohl die Form als auch die Schärfe der Anrede.
- source_word: עֹנְנָה
  choice: Wahrsagerin
  rationale: Die feminine Form bezeichnet eine Frau, die verbotene mantische beziehungsweise okkulte Praktiken ausübt. „Wahrsagerin“ ist im heutigen Deutsch klarer und genauer auf Divination bezogen als das allgemeinere „Zauberin“.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet in genealogischer Sprache aber die Nachkommenschaft. „Nachkommen“ ist natürlich und lässt sowohl eine tatsächliche als auch eine bildhafte Abstammung zu.
- source_word: מְנָאֵף
  choice: eines Ehebrechers
  rationale: Das maskuline Partizip bezeichnet einen Mann, der Ehebruch begeht. Die substantivische Wiedergabe bewahrt Geschlecht, Numerus und direkten Vorwurfscharakter.
- source_word: וַ/תִּזְנֶה
  choice: und einer Frau, die sich prostituiert
  rationale: Die hebräische Form ist ein feminines Verb in der 3. Person Singular und bezeichnet eine Frau, die Unzucht beziehungsweise Prostitution treibt. Die verbale deutsche Wiedergabe bildet die Form genauer ab als ein bloßes Substantiv und vermeidet zugleich unnötig archaische Sprache.
theological_decisions:
- issue: Art der familiären und sexuellen Anklage
  choice: Die drastische Abstammungssprache bleibt im Haupttext erhalten, ohne festzulegen, ob sie wörtlich oder als prophetisches Bild für Götzendienst und Bundesuntreue gemeint ist.
  alternative: Die Aussage ausschließlich als Behauptung über die tatsächliche Herkunft der Angeredeten oder ausschließlich als Metapher wiederzugeben.
  rationale: Der Kontext legt eine bildhafte Anklage wegen religiöser Untreue nahe, doch der Vers selbst formuliert genealogisch. Die Übersetzung bewahrt diese Spannung; die Fußnote weist auf die metaphorische Möglichkeit hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der scharfen Anklage und dem auffordernden Ton des Hebräischen. Die parallele Abstammungssprache bleibt erkennbar; veraltete oder unnötig derbe Ausdrücke werden vermieden.
