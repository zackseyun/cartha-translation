  terminology: „Ehebrecher“ und „Prostituierte“ geben die sexuelle Anklagesprache ohne unnötig archaische oder euphemistische Abschwächung wieder. Die Fußnoten bewahren zutreffend die lexikalische Alternative bei עֹנְנָה und den möglichen metaphorischen Charakter der Anklage.
