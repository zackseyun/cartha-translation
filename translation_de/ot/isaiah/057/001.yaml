  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: de
  text: Der Gerechte kommt um, und niemand nimmt es sich zu Herzen. Menschen, die treue Liebe üben, werden hinweggenommen, ohne dass jemand begreift, dass der Gerechte vor dem Bösen[a] hinweggenommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Unheil“ oder „vor der kommenden Katastrophe“.'
    reason: Das hebräische רָעָה kann sowohl „Böses“ als auch „Unheil“ oder „Katastrophe“ bedeuten.
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv im maskulinen Singular wird im Deutschen natürlich und formgetreu mit „der Gerechte“ wiedergegeben.
- source_word: אָבָד
  choice: kommt um
  rationale: Die Wendung bezeichnet hier das Zugrundegehen beziehungsweise Sterben, ohne die Aussage unnötig genauer festzulegen.
- source_word: שָׂם עַל לֵב
  choice: nimmt es sich zu Herzen
  rationale: Die geläufige deutsche Redewendung bewahrt sowohl die Bedeutung ernsthafter Beachtung als auch das innere, moralische Gewicht des hebräischen Ausdrucks.
- source_word: אַנְשֵׁי חֶסֶד
  choice: Menschen, die in treuer Liebe leben
  rationale: חֶסֶד verbindet Güte, Beständigkeit und loyale Liebe. Die Formulierung gibt diese Bedeutungsbreite verständlich wieder, ohne sie auf bloße Barmherzigkeit oder Frömmigkeit zu verengen.
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: werden hinweggenommen / wird hinweggenommen
  rationale: Das Niphal von אסף kann in diesem Zusammenhang euphemistisch die Entfernung durch den Tod bezeichnen. „Hinweggenommen“ bewahrt sowohl die Zurückhaltung als auch die Wiederholung des hebräischen Textes.
- source_word: בְּאֵין מֵבִין
  choice: ohne dass jemand begreift
  rationale: Die Formulierung gibt den begleitenden Umstand idiomatisch wieder und betont das fehlende Verständnis.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier am natürlichsten den Inhalt dessen ein, was niemand begreift.
- source_word: מִפְּנֵי הָרָעָה
  choice: vor dem Bösen
  rationale: „Vor“ bewahrt die räumliche beziehungsweise abwendende Nuance von מִפְּנֵי; „das Böse“ lässt offen, ob moralisches Böses oder drohendes Unheil gemeint ist.
theological_decisions:
- issue: Ob הָרָעָה moralisches Böses oder drohendes Unheil bezeichnet
  choice: vor dem Bösen
  alternative: vor dem Unheil / vor der kommenden Katastrophe
  rationale: Der hebräische Ausdruck kann sowohl moralisches Böses als auch Unglück und Gericht bezeichnen. Der Haupttext wahrt die weitere Bedeutung, während die Fußnote die im Zusammenhang wahrscheinliche Lesart als kommendes Unheil sichtbar macht.
- issue: Ob das Hinwegnehmen als Schutz vor dem Bösen oder als Folge des Bösen zu verstehen ist
  choice: vor dem Bösen hinweggenommen
  alternative: wegen des Bösen hinweggenommen
  rationale: Die Präposition מִפְּנֵי kann Entfernung aus dem Bereich oder Angesicht einer Sache ausdrücken und im Kontext auf Bewahrung vor kommendem Unheil weisen. Die gewählte Fassung erhält diese Spannung besser als eine rein kausale Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei hebräischen Satzhälften werden zur besseren Lesbarkeit in zwei Sätze gegliedert; Wiederholungen und die zurückhaltende Rede vom Tod bleiben erhalten.
