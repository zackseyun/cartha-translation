    rationale: »Möglicherweise ist mit ›dem König‹ an Moloch, eine fremde Gottheit, gedacht« ist im Deutschen nicht idiomatisch. Zudem sollte die umstrittene Deutung als mögliche allusive Bezeichnung kenntlich bleiben, nicht als festgelegte Identifikation.
  - severity: low
