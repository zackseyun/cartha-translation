base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: de
  text: Du zogst mit Öl zum König[a] und vermehrtest deine Duftsalben. Du schicktest deine Boten weit in die Ferne und erniedrigtest dich bis in den Scheol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist »der König« als anspielende Bezeichnung für Moloch zu verstehen.
    reason: alternative_reading
  - marker: b
    text: Der Scheol ist das Totenreich.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: du zogst
  rationale: Das schwierige Verb wird im Zusammenhang mit dem Aufsuchen des Königs und dem Aussenden von Boten am ehesten als Bewegung oder Reise verstanden. „Du zogst“ bewahrt diesen Sinn, ohne die unsichere Nuance weiter festzulegen.
- source_word: לַמֶּלֶךְ
  choice: zum König
  rationale: Der vokalisierte Text bedeutet unmittelbar „zum König“. Eine mögliche Anspielung auf Moloch wird nicht in den Haupttext eingetragen, sondern in einer Fußnote offengehalten.
- source_word: בַּשֶּׁמֶן
  choice: mit Öl
  rationale: Die konkrete Grundbedeutung bleibt erhalten; im Zusammenhang kann wohlriechendes Salböl, ein Geschenk oder eine verführerische Aufmachung gemeint sein.
- source_word: רִקֻּחָיִךְ
  choice: deine Duftsalben
  rationale: Das Wort bezeichnet aromatisch gemischte Zubereitungen. „Duftsalben“ ist im Deutschen anschaulich und passt zum unmittelbar genannten Öl.
- source_word: צִרַיִךְ
  choice: deine Boten
  rationale: „Boten“ gibt den politischen oder diplomatischen Sinn wieder, ohne die Personen enger als förmliche Gesandte oder Botschafter zu bestimmen.
- source_word: עַד מֵרָחֹק
  choice: weit in die Ferne
  rationale: Die idiomatische deutsche Wendung bringt die betonte große Entfernung natürlich zum Ausdruck.
- source_word: וַתַּשְׁפִּילִי
  choice: du erniedrigtest dich
  rationale: Die reflexive Wiedergabe entspricht der negativen Selbsterniedrigung im Kontext und vermeidet das positiv konnotierte „demütigen“.
- source_word: עַד שְׁאוֹל
  choice: bis in den Scheol
  rationale: Der hebräische Begriff bleibt erhalten, damit er nicht vorschnell mit Grab oder Hölle gleichgesetzt wird; eine Fußnote erläutert ihn als Totenreich.
theological_decisions:
- issue: Mögliche Deutung von „der König“ als Anspielung auf Moloch
  choice: „zum König“ im Haupttext
  alternative: „zu Moloch“
  rationale: Der masoretisch vokalisierte Text liest „der König“. Sowohl politische Bündnissuche als auch religiöse Untreue können im Kontext mitschwingen. Die traditionelle Moloch-Deutung bleibt deshalb als Möglichkeit in der Fußnote erhalten, ohne den mehrdeutigen Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Singularanrede des Hebräischen bleibt erhalten. Kurze Hauptsätze bewahren den anklagenden prophetischen Ton; die mögliche politische, kultische oder sexuelle Bildsprache wird nicht einseitig aufgelöst.
