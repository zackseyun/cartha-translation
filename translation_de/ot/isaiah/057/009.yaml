  verdict: revise
  source_fidelity: Der Haupttext gibt die schwierige Bewegungsnuance von וַתָּשֻׁרִי vorsichtig wieder und bewahrt »zum König« als wörtliche, mehrdeutige Lesart. Öl, aromatische Zubereitungen, Boten, große Entfernung, negative Selbsterniedrigung und Scheol sind sachgerecht übertragen. Die Fußnote zu »König« muss jedoch sprachlich und sachlich präziser formuliert werden.
  naturalness: Der Vers ist gut verständliches, würdiges modernes Standarddeutsch. »Du schicktest« ist im heutigen Deutsch natürlicher als das zwar korrekte, aber stärker altertümliche »du sandtest«.
  terminology: »Duftsalben«, »Boten« und »Scheol« sind angemessen. Die Erläuterung »Totenreich« erklärt Scheol knapp, ohne ihn mit Hölle oder bloßem Grab gleichzusetzen. Die Moloch-Fußnote soll die Möglichkeit einer anspielenden Bezeichnung ausdrücken, statt die problematische Formulierung »an Moloch ... gedacht« zu verwenden.
