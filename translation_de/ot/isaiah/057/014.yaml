source:
  edition: WLC
  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: de
  text: 'Und es wird gesagt werden: „Schüttet auf, schüttet auf, räumt den Weg frei! Entfernt den Stolperstein aus dem Weg meines Volkes.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Bahnt, bahnt, bereitet den Weg!“ Das Hebräische verwendet das Bild des Aufschüttens und Herrichtens einer Straße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Und es wird gesagt werden
  rationale: Die Form ist formal 3. Person Singular maskulin, doch ohne ausdrücklich genanntes Subjekt. Eine unpersönliche deutsche Wiedergabe bewahrt die knappe Ankündigungsformel und legt den Sprecher nicht fest.
- source_word: סֹלּוּ סֹלּוּ
  choice: Schüttet auf, schüttet auf
  rationale: סלל bezeichnet hier das Aufschütten beziehungsweise Anlegen eines Weges. Die Wiederholung wird als emphatisches Element beibehalten.
- source_word: פַּנּוּ דָרֶךְ
  choice: räumt den Weg frei
  rationale: פנה bezeichnet in diesem Zusammenhang das Freimachen oder Bereiten einer Route. Die Formulierung ist im modernen Deutschen natürlich und bewahrt das Bild der Wegbereitung.
- source_word: הָרִימוּ
  choice: Entfernt
  rationale: Der Hifil-Imperativ von רום bedeutet wörtlich „hebt hoch“. Mit מִכְשׁוֹל und der folgenden מן-Konstruktion bezeichnet er das Wegheben und damit Entfernen eines Hindernisses.
- source_word: מִכְשׁוֹל
  choice: Stolperstein
  rationale: Das Wort bezeichnet etwas, worüber man stolpert, wörtlich oder übertragen. „Stolperstein“ bewahrt die konkrete Metapher.
- source_word: מִדֶּרֶךְ עַמִּי
  choice: aus dem Weg meines Volkes
  rationale: Die Präposition מן bezeichnet die Entfernung aus dem Weg; die Genitivverbindung bewahrt die Zuordnung des Weges zu Gottes Volk.
theological_decisions:
- issue: Identität des Sprechers in der Einleitungsformel
  choice: 'Unpersönliche Ankündigung: „es wird gesagt werden“'
  alternative: „Und er sagte“ mit Gott als erschlossenem Subjekt oder „Dann wird man sagen“ mit unbestimmtem menschlichem Sprecher
  rationale: Der hebräische Text nennt kein ausdrückliches Subjekt. Die unpersönliche Form lässt offen, wer die Aufforderung ausspricht, und vermeidet eine nicht eindeutig ausgewiesene Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die imperativische Dringlichkeit und die Wiederholung des Hebräischen bleiben erhalten; die Fußnote erläutert das im Deutschen ungewohnte Straßenbaubild.
