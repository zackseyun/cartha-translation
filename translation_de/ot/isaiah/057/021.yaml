  text: אֵ֣ין שָׁל֔וֹם אָמַ֥ר אֱלֹהַ֖/י לָ/רְשָׁעִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/021.yaml
  text: There is no peace," says my God[b][a], "for the wicked.
translation:
  language: de
  text: »Keinen Frieden[b] gibt es für die Frevler«, sagt mein Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In Jesaja 48,22 steht sehr ähnlich: »Keinen Frieden gibt es für die Frevler«, spricht der HERR. Hier lautet der hebräische Text »mein Gott«.'
    reason: cross_reference
  - marker: b
    text: Das hebräische Wort für »Frieden« kann auch Wohlergehen oder Unversehrtheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׁלוֹם
  choice: Keinen Frieden gibt es
  rationale: Die existentielle Verneinung wird in natürlichem, zugleich prägnantem Deutsch wiedergegeben und bewahrt die uneingeschränkte Aussage.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die geläufige Wiedergabe; das hebräische Wort kann darüber hinaus Wohlergehen und Unversehrtheit bezeichnen, was eine Fußnote vermerkt.
- source_word: אָמַר
  choice: sagt
  rationale: Obwohl die Form morphologisch ein Perfekt ist, dient sie hier als prophetische Redeeinleitung; das deutsche Präsens klingt idiomatisch und entspricht der fortgeltenden Aussage.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die erste Person Singular des hebräischen Possessivsuffixes wird ausdrücklich bewahrt und nicht an die Parallele in Jesaja 48,22 angeglichen.
- source_word: לָרְשָׁעִים
  choice: für die Frevler
  rationale: 'Die Präposition bezeichnet hier den Bezug: Für diese Menschen gibt es keinen Frieden. „Frevler“ gibt die moralische Kategorie von רְשָׁעִים würdig wieder, ohne sie konfessionell einzuengen.'
theological_decisions:
- issue: Zuordnung des Sprechers in der Gottesrede
  choice: „mein Gott“ entsprechend dem masoretischen Text
  alternative: „der HERR“ nach Angleichung an Jesaja 48,22 oder schlicht „Gott“ ohne Possessivpronomen
  rationale: Der WLC liest אֱלֹהַי („mein Gott“). Diese auffällige Ich-Beziehung wird erhalten und weder harmonisiert noch geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Eindringlichkeit eines prophetischen Schlusssatzes. Die vorangestellte Wendung „Keinen Frieden“ setzt den entscheidenden Gedanken nachdrücklich an den Anfang.
