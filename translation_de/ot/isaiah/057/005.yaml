lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: die ihr … vor Begierde entbrennt
  rationale: Das Partizip bezeichnet hier im Zusammenhang mit kultischen Praktiken ein Sich-Erhitzen oder Entbrennen. „Vor Begierde entbrennen“ gibt die wahrscheinlich sexuelle und zugleich kultische Anklage in natürlichem Deutsch wieder, ohne sie über den Kontext hinaus auszudeuten.
- source_word: בָּאֵלִים
  choice: bei den Terebinthen
  rationale: Der Parallelismus mit „unter jedem grünen Baum“ spricht für große beziehungsweise kultisch verehrte Bäume und gegen die ebenfalls formal mögliche Deutung „bei den Göttern“. „Terebinthen“ ist in diesem Zusammenhang die wahrscheinlichere spezifische Baumbezeichnung.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: unter jedem grünen Baum
  rationale: Die geläufige prophetische Wendung und ihr Bild für Stätten unerlaubter Verehrung bleiben direkt und verständlich erhalten.
- source_word: שֹׁחֲטֵי
  choice: die ihr … schlachtet
  rationale: Das Verb bezeichnet ein Schlachten, häufig mit opferkultischem Beiklang. „Schlachten“ bewahrt sowohl die Gewaltsamkeit als auch diesen möglichen kultischen Bezug.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: Das Substantiv bezeichnet Kinder beziehungsweise Nachkommen, ohne hier Geschlecht oder genaues Alter festzulegen.
- source_word: בַּנְּחָלִים
  choice: in den Wadis
  rationale: Gemeint sind Täler oder Schluchten mit häufig nur zeitweise wasserführenden Bachbetten. Das im Deutschen gebräuchliche Lehnwort „Wadis“ gibt die geographische Eigenart präzise wieder.
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: unter den Klüften der Felsen
  rationale: סְעִפִים bezeichnet wörtlich Verzweigungen oder Teilungen; in Verbindung mit Felsen sind zerklüftete, verborgene Felspartien gemeint. Die Formulierung hält das ungewöhnliche räumliche Bild des Hebräischen fest.
theological_decisions:
- issue: Soll die sexuell-kultische Bedeutung des einleitenden Partizips ausdrücklich werden?
  choice: „vor Begierde entbrennt“
  alternative: „euch erhitzt“ beziehungsweise „entbrennt“
  rationale: Der unmittelbare Zusammenhang verbindet Baumkult und Kinderschlachtung. Die Formulierung macht die wahrscheinliche erotische Dimension der prophetischen Anklage verständlich, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Bezeichnet אֵלִים Bäume oder Götter?
  choice: „Terebinthen“
  alternative: „Götter“ oder „Eichen“
  rationale: Die folgende Ortsangabe „unter jedem grünen Baum“ stützt die Baumdeutung stark. Die mögliche Baumart bleibt in einer Fußnote offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der anklagende Rhythmus der beiden Partizipialgruppen bleiben erhalten; „Wadis“ wird wegen seiner geographischen Präzision verwendet und in der Fußnote erklärt.
