  text: die ihr euch zwischen den Terebinthen[a] erhitzt, unter jedem grünen Baum, die ihr die Kinder in den Wadis[b] schlachtet, unter den Felsvorsprüngen.
  philosophy: optimal-equivalence
  footnotes:
