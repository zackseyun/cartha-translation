  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: de
  text: Denn ich werde nicht für immer hadern noch ohne Ende zornig sein; denn der Geist würde vor mir verschmachten[a] und die Atemzüge, die ich selbst gemacht habe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Atem würde vor mir verschmachten“. Das hebräische Wort רוּחַ kann „Geist“ oder „Atem“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen die Mehrzahl „Atemzüge“; möglich sind auch die deutenderen Wiedergaben „Seelen“ oder „Leben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet in der verneinten Aussage unbegrenzte Dauer und bildet den ersten Teil des poetischen Parallelismus.
- source_word: אָרִיב
  choice: hadern
  rationale: Das Verb ריב bezeichnet Streiten, Rechten oder das Führen einer Auseinandersetzung. „Hadern“ bewahrt hier den relationalen und gerichtlichen Ernst, ohne ein nicht genanntes Objekt einzufügen.
- source_word: לָנֶצַח
  choice: ohne Ende
  rationale: Die leicht variierte Wiedergabe erhält den synonymen Parallelismus zu לְעוֹלָם und klingt im Deutschen natürlich.
- source_word: אֶקְּצֹף
  choice: zornig sein
  rationale: קצף bezeichnet Zorn. Die Formulierung ist klar, gegenwärtig und gewichtig, ohne unnötig altertümlich zu wirken.
- source_word: רוּחַ
  choice: der Geist
  rationale: Im Zusammenhang ist der von Gott gegebene menschliche Lebensgeist gemeint, nicht der Heilige Geist. „Geist“ wahrt zugleich die mögliche Bedeutung „Atem“, die in einer Fußnote genannt wird.
- source_word: מִלְּפָנַי
  choice: vor mir
  rationale: Dies gibt die hebräische Wendung idiomatisch wieder und lässt offen, ob Gottes Gegenwart oder sein fortdauernder Zorn als Ursache des Verschmachtens im Vordergrund steht.
- source_word: יַעֲטוֹף
  choice: würde verschmachten
  rationale: עטף kann das Schwachwerden, Ermüden oder Verschmachten bezeichnen. Der deutsche Konjunktiv macht die im Begründungssatz vorausgesetzte Folge fortdauernden Zorns deutlich.
- source_word: נְשָׁמוֹת
  choice: der Lebensatem
  rationale: Das hebräische Pluralwort bezeichnet wörtlich „Atemzüge“ beziehungsweise die Lebensatem der Geschöpfe. Der kollektive Singular „Lebensatem“ ist im Deutschen natürlich und bewahrt das Bild, ohne die technischere Wiedergabe „Seelen“ festzuschreiben.
- source_word: אֲנִי עָשִׂיתִי
  choice: den ich geschaffen habe
  rationale: „Geschaffen“ bringt im Zusammenhang mit dem Lebensatem das göttliche Hervorbringen natürlich zum Ausdruck. Das selbständige Pronomen אֲנִי setzt Nachdruck auf Gott als den Urheber; dieser ist durch die ausdrückliche Ich-Form im Relativsatz hinreichend erkennbar.
theological_decisions:
- issue: Anthropologische Bedeutung von רוּחַ und נְשָׁמוֹת
  choice: Die Wörter werden als menschlicher Geist und von Gott geschaffener Lebensatem verstanden.
  alternative: רוּחַ als „Atem“ und נְשָׁמוֹת als „Seelen“ oder „Leben“ wiederzugeben.
  rationale: Der Vers begründet Gottes Zurückhaltung damit, dass das von ihm geschaffene menschliche Leben unter unaufhörlichem Zorn verschmachten würde. Der Kontext spricht daher vom geschöpflichen Geist beziehungsweise Lebensatem, nicht vom Heiligen Geist. Die Fußnoten erhalten die lexikalische Mehrdeutigkeit.
- issue: Logischer Bezug des zweiten כִּי
  choice: 'Der Satz wird als Begründung mit vorausgesetzter Folge wiedergegeben: „denn … würde“.'
  alternative: Das zweite כִּי rein kausal ohne den im Deutschen naheliegenden Folgesinn wiederzugeben.
  rationale: Die hebräische Aussage erklärt, weshalb Gott nicht ohne Ende zürnt. Der Konjunktiv wahrt diese Logik, ohne einen zusätzlichen Konditionalsatz in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Hadern“ ist bewusst gehoben, aber noch allgemein verständlich. Das Semikolon gliedert Gottes Aussage und ihre Begründung; alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
