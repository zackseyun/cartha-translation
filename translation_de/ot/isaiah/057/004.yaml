base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: de
  text: Über wen macht ihr euch lustig?[a] Gegen wen reißt ihr den Mund auf und streckt die Zunge heraus?[b] Seid ihr nicht Kinder der Auflehnung, Nachkommen der Lüge?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »An wem ergötzt ihr euch?« Im Zusammenhang ist höhnisches Vergnügen beziehungsweise Spott gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »macht eure Zunge lang«; gemeint ist das Herausstrecken der Zunge als Spottgebärde.'
    reason: lexical_alternative
  - marker: c
    text: Die Ausdrücke »Kinder der Auflehnung« und »Nachkommen der Lüge« verwenden Sprache der Abstammung bildlich für Menschen, deren Wesen und Verhalten von Auflehnung und Lüge geprägt sind.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: macht ihr euch lustig
  rationale: Die Grundbedeutung des Hitpael kann wörtlicher mit »euch ergötzen« wiedergegeben werden; im Zusammenhang mit aufgerissenem Mund und herausgestreckter Zunge bezeichnet die Form jedoch höhnisches Vergnügen. »Sich über jemanden lustig machen« bewahrt sowohl den Spott als auch den darin liegenden Genuss.
- source_word: תַּרְחִיבוּ פֶה
  choice: reißt ihr den Mund auf
  rationale: Die Wendung bedeutet wörtlich, den Mund weit zu machen. Die deutsche Formulierung erhält das anschauliche Bild und vermittelt zugleich die freche, verhöhnende Gebärde.
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: streckt die Zunge heraus
  rationale: Wörtlich heißt die Wendung »macht die Zunge lang«. Die idiomatische deutsche Wiedergabe bezeichnet dieselbe konkrete Spottgebärde.
- source_word: הֲלוֹא
  choice: Seid ihr nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, die Zustimmung erwartet. »Seid ihr nicht« bildet diese Frageform unmittelbar ab.
- source_word: יִלְדֵי פֶשַׁע
  choice: Kinder der Auflehnung
  rationale: »Kinder« bewahrt die hebräische Herkunftsmetapher, ohne sie auf männliche Nachkommen zu beschränken. פֶשַׁע bezeichnet schuldhafte Auflehnung oder Übertretung; »Auflehnung« passt zum prophetischen Vorwurf und bleibt im heutigen Deutsch verständlich.
- source_word: זֶרַע שָׁקֶר
  choice: Nachkommen der Lüge
  rationale: »Nachkommen« gibt זֶרַע in der Abstammungsmetapher natürlich wieder. »Lüge« bewahrt die breite Bedeutung von שֶׁקֶר als Falschheit, Unwahrheit oder Täuschung.
theological_decisions:
- issue: Moralische Herkunftssprache in der prophetischen Anklage
  choice: Die Ausdrücke »Kinder der Auflehnung« und »Nachkommen der Lüge« bleiben als Herkunftsmetaphern stehen und charakterisieren die Angesprochenen moralisch.
  alternative: Die Wendungen könnten als Aussage über ihre leibliche Abstammung oder als bloße Umschreibung »aufrührerische und verlogene Menschen« verstanden beziehungsweise wiedergegeben werden.
  rationale: Die hebräische Familiensprache ist absichtlich prägnant und deutet eine von Auflehnung und Lüge geprägte Identität an. Die Übersetzung bewahrt dieses Bild, während die Fußnote einer biologischen oder ethnischen Fehldeutung vorbeugt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Sprache. »Den Mund aufreißen« und »die Zunge herausstrecken« geben die körperlichen Spottgebärden natürlich wieder; die parallele Herkunftssprache des Hebräischen bleibt erhalten.
