source:
  edition: WLC
  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: de
  text: 'Ich schaffe die Frucht der Lippen[a]: »Frieden, Frieden[b] dem Fernen und dem Nahen[c]«, spricht Jahwe, »und ich werde ihn heilen[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »den Ertrag der Lippen«; gemeint ist das, was die Lippen hervorbringen, wahrscheinlich Worte des Lobes oder des Bekenntnisses.'
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung »Frieden, Frieden« gibt die hebräische Verstärkung wieder.
    reason: lexical_alternative
  - marker: c
    text: »Der Ferne und der Nahe« kann im unmittelbaren Zusammenhang verstreute und im Land lebende Angehörige des Gottesvolkes meinen; spätere biblische Texte greifen die Wendung in einem weiteren Sinn auf.
    reason: cross_reference
  - marker: d
    text: 'Wörtlich steht im Hebräischen ein maskulines Pronomen im Singular: »ihn«. Es kann die genannten Empfänger zusammenfassend bezeichnen.'
    reason: textual_clarification
lexical_decisions:
- source_word: בּוֹרֵא
  choice: Ich schaffe
  rationale: Das Qal-Partizip bezeichnet Jahwe als den, der etwas hervorbringt. Die finite Form gibt den im Hebräischen verdichteten prädikativen Ausdruck in natürlichem Deutsch wieder; Jahwe ist aus der anschließenden Gottesrede als Subjekt erkennbar.
- source_word: נוב שְׂפָתָיִם
  choice: die Frucht der Lippen
  rationale: Die Wendung bezeichnet bildhaft das, was die Lippen hervorbringen. »Frucht der Lippen« bewahrt dieses Bild, ohne es vorschnell auf Lobpreis oder Bekenntnis einzuengen.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Frieden, Frieden
  rationale: Die Wiederholung wird als hebräische Verstärkung beibehalten. »Frieden« wahrt die umfassende Bedeutung von שָׁלוֹם besser als eine Einengung auf innere Ruhe oder äußeren Wohlstand.
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: dem Fernen und dem Nahen
  rationale: Die Präposition ל bezeichnet hier die Empfänger des zugesprochenen Friedens. Die substantivierten Adjektive entsprechen den singularischen Formen des Hebräischen und klingen im Deutschen würdig und verständlich.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die im Hebräischen perfektiv formulierte prophetische Redeeinleitung wird idiomatisch mit dem geläufigen deutschen Präsens »spricht« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּרְפָאתִיו
  choice: und ich werde ihn heilen
  rationale: רפא bedeutet hier »heilen« und kann leibliche wie umfassende Wiederherstellung umfassen. Im Zusammenhang hat die Form zukunftsbezogenen Verheißungscharakter; das singularische Pronomen bleibt erhalten.
theological_decisions:
- issue: Identität des Fernen und des Nahen
  choice: Die Gruppen bleiben unbestimmt als »der Ferne« und »der Nahe« bezeichnet.
  alternative: Ausdrückliche Deutung als im Exil und im Land lebende Israeliten oder, in einem weiteren Horizont, als Nichtjuden und Juden.
  rationale: Der unmittelbare Kontext spricht von der Wiederherstellung des Gottesvolkes, doch der hebräische Wortlaut legt die genaue Identität nicht ausdrücklich fest. Die Übersetzung wahrt diese Offenheit.
- issue: Bezug des singularischen Pronomens in וּרְפָאתִיו
  choice: Das maskuline Singularpronomen wird mit »ihn« bewahrt.
  alternative: Sinngemäße Pluralisierung zu »ich werde sie heilen« oder unpersönliche Wiedergabe.
  rationale: Ob sich das Pronomen kollektiv auf die genannten Empfänger oder auf eine einzelne gedachte Person bezieht, wird im Text nicht ausdrücklich entschieden. Eine Pluralisierung würde diese Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bildsprache und die emphatische Wiederholung des Hebräischen bleiben erhalten. Die direkte Rede macht den Zusammenhang zwischen dem geschaffenen Wort der Lippen, dem Friedenszuspruch und Jahwes Heilungsverheißung transparent, ohne die Identität der Empfänger festzulegen.
