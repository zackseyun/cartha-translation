source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: de
  text: Doch die Gottlosen sind wie das aufgewühlte Meer[a]; denn es kann nicht ruhig werden, und seine Wasser wühlen Schmutz und Schlamm auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie das getriebene Meer“; auch möglich: „wie das unruhige Meer“. Das hebräische Wort stellt das Meer als von Kräften getrieben dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: Doch die Gottlosen
  rationale: Das Substantiv bezeichnet gottlose bzw. schuldige Menschen. Die einleitende Konjunktion wird wegen des Gegensatzes zum Frieden im vorausgehenden Kontext adversativ mit „doch“ wiedergegeben.
- source_word: כַּיָּם נִגְרָשׁ
  choice: wie das aufgewühlte Meer
  rationale: כְּ markiert den Vergleich; נִגְרָשׁ beschreibt das Meer als getrieben bzw. unruhig bewegt. „Aufgewühlt“ bewahrt das dynamische Bild und klingt im Deutschen natürlich.
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: denn es kann nicht ruhig werden
  rationale: כִּי leitet die Erklärung des Vergleichs ein. שׁקט bezeichnet das Ruhig- oder Stillwerden; die deutsche Formulierung gibt den Zustandswechsel idiomatisch wieder.
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: und seine Wasser wühlen … auf
  rationale: Die Wasser sind Subjekt und treiben Stoff aus der Tiefe empor. „Aufwühlen“ stellt im Deutschen den natürlichen Zusammenhang mit dem aufgewühlten Meer her.
- source_word: רֶפֶשׁ וָטִיט
  choice: Schlamm und Schmutz
  rationale: Das Wortpaar bezeichnet schlammigen Unrat und Morast. Die alliterierende deutsche Paarung ist anschaulich, verständlich und unterscheidet die beiden eng verwandten Begriffe, ohne das Bild zu überdeuten.
theological_decisions:
- issue: Adversative Bedeutung der einleitenden Konjunktion
  choice: Doch die Gottlosen
  alternative: Und die Gottlosen
  rationale: Der unmittelbare Kontext stellt den Gottlosen dem zuvor genannten Frieden gegenüber. „Doch“ macht diesen textlichen Gegensatz deutlich, ohne zusätzliche Lehraussagen einzutragen.
- issue: Zustand des Meeres im Vergleich
  choice: das aufgewühlte Meer
  alternative: das getriebene Meer
  rationale: Die Grundbedeutung von גרשׁ enthält das Getriebenwerden. Im Deutschen vermittelt „aufgewühlt“ dasselbe Bild eines von Kräften bewegten, nicht zur Ruhe kommenden Meeres natürlicher; die wörtlichere Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Meeresbild bleibt konkret und dynamisch; die parallelen Formen von גרשׁ werden zugunsten natürlicher deutscher Ausdrucksweise mit „aufgewühlt“ und „aufwühlen“ wiedergegeben.
