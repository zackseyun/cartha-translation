  text: דְּרָכָ֥י/ו רָאִ֖יתִי וְ/אֶרְפָּאֵ֑/הוּ וְ/אַנְחֵ֕/הוּ וַ/אֲשַׁלֵּ֧ם נִֽחֻמִ֛ים ל֖/וֹ וְ/לַ/אֲבֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: de
  text: Ich habe seine Wege gesehen und werde ihn heilen; ich werde ihn führen und ihm und seinen Trauernden wieder Trost schenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ich werde ihm und seinen Trauernden Tröstungen erstatten“. Das hebräische Wort für „Trost“ steht im Plural; das Verb kann auch „erstatten“, „vergelten“ oder „wiederherstellen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכָיו
  choice: seine Wege
  rationale: Der Plural von דֶּרֶךְ bezeichnet häufig die Lebensführung oder das Verhalten eines Menschen. „Seine Wege“ bewahrt das hebräische Bild und dessen moralischen Beiklang.
- source_word: רָאִיתִי
  choice: ich habe … gesehen
  rationale: 'Das Perfekt wird mit gegenwärtiger Relevanz wiedergegeben: Gottes Kenntnis seiner Wege bildet den Hintergrund der folgenden Zusagen.'
- source_word: וְאֶרְפָּאֵהוּ
  choice: doch ich werde ihn heilen
  rationale: רפא bedeutet gewöhnlich „heilen“ und kann hier körperliche wie übertragene Wiederherstellung anklingen lassen. „Doch“ gibt den im Zusammenhang naheliegenden Gegensatz wieder, ohne die einfache hebräische Verknüpfung zu überdeuten.
- source_word: וְאַנְחֵהוּ
  choice: Ich werde ihn führen
  rationale: Der Hifil von נחה bedeutet „führen“ oder „leiten“. „Führen“ ist konkret und fügt sich in die Zusage persönlicher Wiederherstellung.
- source_word: וַאֲשַׁלֵּם נִחֻמִים
  choice: wieder Trost schenken
  rationale: שׁלם im Piel kann „erstatten“, „vergelten“ oder „wiederherstellen“ bedeuten; נִחֻמִים ist formal Plural. Die Formulierung gibt den Wiederherstellungsaspekt natürlich wieder, während „Trost“ im Deutschen üblicherweise als nicht zählbares Singularwort steht.
- source_word: לּוֹ וְלַאֲבֵלָיו
  choice: ihm und denen, die um ihn trauern
  rationale: ל bezeichnet die Empfänger. אֲבֵלָיו meint mit dem Suffix die zu ihm gehörenden Trauernden; die entfaltete Formulierung ist im modernen Deutsch natürlicher als „seinen Trauernden“.
theological_decisions:
- issue: Moralische Bedeutung von „seine Wege“ im Zusammenhang der Wiederherstellung
  choice: Gott hat die Wege des Menschen gesehen und sagt ihm dennoch Heilung und Führung zu.
  alternative: Die Wendung könnte neutral zu „seinen Pfad“ abgeschwächt oder ausdrücklich als Hinweis auf bereits erfolgte Umkehr gedeutet werden.
  rationale: Der hebräische Text nennt seine Wege, sagt in diesem Vers aber nicht ausdrücklich, dass er umgekehrt ist. Die Übersetzung bewahrt die Spannung zwischen Gottes voller Kenntnis und seiner barmherzigen Wiederherstellung.
- issue: Verhältnis zwischen Gottes Sehen und seiner Heilungszusage
  choice: Die Konjunktion wird kontextgemäß mit „doch“ wiedergegeben.
  alternative: Eine formal engere Wiedergabe wäre „und ich werde ihn heilen“.
  rationale: Das hebräische ו kann je nach Zusammenhang auch einen Gegensatz markieren. Nach der Schilderung der Verfehlung und des göttlichen Zorns in Vers 17 macht „doch“ die hier erkennbare Wendung verständlich, ohne einen zusätzlichen theologischen Grund einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache „seine Wege“ und „heilen“ bleibt erhalten; schwer verständliche Wörtlichkeit bei „Tröstungen erstatten“ wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
