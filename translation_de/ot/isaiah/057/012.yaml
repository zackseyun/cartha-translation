source:
  edition: WLC
  text: אֲנִ֥י אַגִּ֖יד צִדְקָתֵ֑/ךְ וְ/אֶֽת מַעֲשַׂ֖יִ/ךְ וְ/לֹ֥א יוֹעִילֽוּ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: de
  text: Ich selbst werde deine Gerechtigkeit[a] und deine Taten bekannt machen; doch sie werden dir nichts nützen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Rechtschaffenheit“. Das hebräische Wort kann je nach Zusammenhang Gerechtigkeit, Rechtschaffenheit oder gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch sie werden dir nicht helfen“. Das hebräische Verb kann „nützen, Nutzen bringen, helfen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen trägt Nachdruck; „Ich selbst“ gibt ihn im Deutschen natürlich wieder.
- source_word: אַגִּיד
  choice: werde … bekannt machen
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, bekannt machen“. Die Formulierung bewahrt den deklarativen Sinn, ohne die im Kontext mögliche entlarvende Ironie ausdrücklich einzutragen.
- source_word: צִדְקָתֵךְ
  choice: deine Gerechtigkeit
  rationale: צדקה bezeichnet grundsätzlich „Gerechtigkeit“ beziehungsweise „Rechtschaffenheit“. Die wörtliche Form lässt den möglicherweise ironischen oder anklagenden Gebrauch offen.
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: und deine Taten
  rationale: מעשים bezeichnet Werke oder Taten. „Taten“ ist im modernen Deutschen natürlich und vermeidet mögliche fachtheologische Nebenbedeutungen von „Werke“.
- source_word: וְלֹא יוֹעִילוּךְ
  choice: doch sie werden dir nichts nützen
  rationale: Der Hifil von יעל bedeutet „nützen, Nutzen bringen, helfen“. „Doch“ gibt den sachlichen Gegensatz zum vorausgehenden Anspruch wieder; „nichts nützen“ ist idiomatisches Standarddeutsch.
theological_decisions:
- issue: Ton von „deine Gerechtigkeit“ im Kontext
  choice: Die schlichte Formulierung „deine Gerechtigkeit“ bleibt ohne Anführungszeichen oder wertende Zusätze stehen.
  alternative: „deine sogenannte Gerechtigkeit“ oder „deine gerechten Taten“
  rationale: Der Kontext kann die Aussage ironisch oder entlarvend erscheinen lassen. Ein Zusatz wie „sogenannte“ würde diese Deutung jedoch im Wortlaut festschreiben; die Übersetzung bewahrt daher die Spannung.
- issue: Bezug des pluralischen Verbs יוֹעִילוּךְ
  choice: „sie“ bezieht sich zusammenfassend auf die genannte Gerechtigkeit und die Taten.
  alternative: 'Unpersönlich: „Das wird dir nichts nützen.“'
  rationale: Die hebräische Pluralform legt einen Rückbezug auf die vorausgehenden Größen nahe. Das deutsche Pronomen bewahrt diesen grammatischen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der emphatische Satzanfang und der Kontrast werden klar wiedergegeben; die mögliche Ironie bleibt dem Kontext überlassen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
