source:
  edition: WLC
  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: de
  text: Wenn du um Hilfe schreist, soll dich doch retten, was du zusammengetragen hast![a] Doch der Wind wird sie alle forttragen; ein Hauch wird sie hinwegnehmen.[b] Wer aber bei mir Zuflucht sucht, wird das Land[c] als Erbe erhalten und meinen heiligen Berg in Besitz nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »deine Gesammelten« oder »deine Ansammlung«. Gemeint sein können Götzen, Verbündete oder andere Dinge, auf die man fälschlich vertraut.'
    reason: lexical_alternative
  - marker: b
    text: '»Wind« und »Hauch« bilden im Hebräischen ein poetisches Wortpaar: Selbst die geringste Luftbewegung lässt diese vermeintlichen Helfer verschwinden.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »die Erde«. Das hebräische Wort kann sowohl das Land als auch die Erde bezeichnen; der Hinweis auf den heiligen Berg spricht hier eher für »das Land«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: Wenn du um Hilfe schreist
  rationale: Die Präposition בְּ mit der entsprechenden Verbalform wird hier zeitlich verstanden. »Um Hilfe schreien« gibt den Notschrei im Zusammenhang natürlich wieder.
- source_word: יַצִּילֻךְ
  choice: sollen dich doch … retten!
  rationale: Der Imperfekt wird als ironische Herausforderung wiedergegeben, nicht als nüchterne Zukunftsaussage.
- source_word: קִבּוּצַיִךְ
  choice: die, die du um dich gesammelt hast
  rationale: Die Form bezeichnet wörtlich Gesammeltes bzw. Zusammengeschartes. Die offene Formulierung bewahrt die mögliche Beziehung auf Götzen, Verbündete oder andere Gegenstände falschen Vertrauens.
- source_word: וְאֶת־כֻּלָּם
  choice: sie alle
  rationale: Die Wendung greift vollständig auf die zuvor Genannten zurück.
- source_word: יִשָּׂא רוּחַ
  choice: der Wind wird sie alle forttragen
  rationale: רוּחַ bedeutet hier im Parallelismus mit הָבֶל am ehesten »Wind«; »forttragen« vermittelt das mühelose Beseitigen.
- source_word: יִקַּח הָבֶל
  choice: ein Hauch nimmt sie hinweg
  rationale: הָבֶל bezeichnet Hauch oder Dunst. Das konkrete Bild eines Hauchs bildet mit »Wind« das poetische Paar und unterstreicht die Nichtigkeit der falschen Zuflucht.
- source_word: וְהַחוֹסֶה בִי
  choice: Wer aber bei mir Zuflucht sucht
  rationale: Das Partizip beschreibt eine anhaltende Haltung des Vertrauens. Die geschlechtsneutrale deutsche Wendung bewahrt den verallgemeinernden Sinn.
- source_word: יִנְחַל אֶרֶץ
  choice: wird das Land als Erbe erhalten
  rationale: נחל bezeichnet das Empfangen als Erbbesitz. Im Zionskontext liegt für אֶרֶץ »Land« näher als »Erde«, ohne die lexikalische Alternative auszuschließen.
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: und meinen heiligen Berg in Besitz nehmen
  rationale: ירשׁ trägt den Sinn von erben bzw. besitzen. Die Formulierung vermeidet eine schwerfällige Wiederholung von »Erbe« und bewahrt das konkrete Besitzmotiv.
theological_decisions:
- issue: Bezug von קִבּוּצַיִךְ
  choice: Im Haupttext offen als »die, die du um dich gesammelt hast« wiedergegeben
  alternative: ausdrücklich »deine gesammelten Götzen« oder »deine Verbündeten«
  rationale: Der Kontext spricht stark für Götzen oder andere falsche Sicherheiten, doch das seltene Wort legt den Bezug nicht eindeutig fest. Die Übersetzung bewahrt deshalb die echte Mehrdeutigkeit und erläutert sie in einer Fußnote.
- issue: Bedeutung von אֶרֶץ
  choice: das Land
  alternative: die Erde
  rationale: Der folgende Ausdruck »mein heiliger Berg« legt einen land- und zionsbezogenen Sinn nahe. Die weiter gefasste Bedeutung »Erde« bleibt lexikalisch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ironische Herausforderung wird durch »sollen … doch« hörbar gemacht. Der seltene und mehrdeutige Ausdruck קִבּוּצַיִךְ bleibt im Haupttext bewusst offen; unnötige konfessionelle Festlegungen werden vermieden.
