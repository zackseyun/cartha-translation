base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: de
  text: 'Auf deinem langen Weg wurdest du müde, doch du sagtest nicht: »Es ist aussichtslos.«[a] Du fandest neue Kraft;[b] darum wurdest du nicht matt.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es gibt keine Hoffnung.« Der hebräische Ausdruck bezeichnet Verzweiflung oder die Einschätzung, dass weiteres Bemühen vergeblich ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Lebenskraft deiner Hand«. Die schwierige Wendung kann neue Kraft oder neue Fähigkeit zum Weitermachen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »du wurdest nicht schwach« oder »du erlahmtest nicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: Auf deinen vielen Wegen
  rationale: רֹב bezeichnet Menge oder Vielzahl; der Plural דַּרְכֵּךְ meint hier die zahlreichen eingeschlagenen Wege beziehungsweise Unternehmungen. Die Formulierung ist im Deutschen natürlich und bewahrt die Wegmetapher.
- source_word: יָגַעַתְּ
  choice: hast du dich abgemüht
  rationale: יגע bezeichnet ermüdende Anstrengung. „Sich abmühen“ bringt sowohl die Tätigkeit als auch die daraus entstehende Erschöpfung zum Ausdruck.
- source_word: נוֹאָשׁ
  choice: Es ist aussichtslos
  rationale: Die Form von יאשׁ drückt Verzweiflung beziehungsweise die Einschätzung aus, dass weiteres Bemühen keinen Erfolg verspricht. Als direkte Rede ist „Es ist aussichtslos“ knapp und idiomatisch.
- source_word: חַיַּת יָדֵךְ
  choice: neue Kraft in deiner Hand
  rationale: Die schwierige Wendung bedeutet wörtlich etwa „Lebenskraft deiner Hand“. Da „Hand“ auch Handlungsvermögen oder Macht bezeichnen kann, gibt die Übersetzung den wahrscheinlichen Sinn als wiedergewonnene Fähigkeit zum Weitermachen wieder, ohne die Handmetapher ganz aufzugeben.
- source_word: מָצָאת
  choice: Du fandest
  rationale: מצא bedeutet grundlegend „finden“ und bezeichnet hier das Erlangen beziehungsweise Entdecken weiterer Kraft.
- source_word: עַל־כֵּן
  choice: darum
  rationale: Die Verbindung kennzeichnet eine Folgerung oder Konsequenz. „Darum“ ist klar und natürlich.
- source_word: לֹא חָלִית
  choice: du wurdest nicht matt
  rationale: חלה kann „krank werden“, „schwach werden“ oder „ermatten“ bedeuten. Im Zusammenhang geht es um das Ausbleiben des Zusammenbruchs oder Nachlassens; „matt werden“ wahrt diese Bedeutungsbreite besser als eine ausdrückliche Krankheitsaussage.
theological_decisions:
- issue: Wertung der Beharrlichkeit im Zusammenhang von Jesaja 57
  choice: Der Wortlaut beschreibt fortgesetztes Bemühen, ohne dieses im Vers selbst ausdrücklich als lobenswert oder verwerflich zu kennzeichnen.
  alternative: Die Beharrlichkeit ausdrücklich als hartnäckiges Festhalten an sündhaften Wegen bezeichnen.
  rationale: Der weitere Zusammenhang tadelt Götzendienst und Untreue, sodass die Beharrlichkeit negativ wirkt. Dennoch fügt die Übersetzung keine wertende Bezeichnung in den Vers ein und lässt die Spannung durch den Kontext entstehen.
- issue: Deutung von חַיַּת יָדֵךְ
  choice: Als neu gefundene Handlungs- oder Lebenskraft wiedergeben und die Handmetapher bewahren.
  alternative: Wörtlich „das Leben deiner Hand“ oder ausschließlich „neue Kraft“ ohne Erwähnung der Hand.
  rationale: Die hebräische Wendung ist komprimiert und mehrdeutig. Die gewählte Fassung macht ihren wahrscheinlichen idiomatischen Sinn verständlich, während die Fußnote die wörtliche Gestalt offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweite Person Singular und die Weg- sowie Handmetaphern bleiben erhalten. Die ungewöhnliche hebräische Wendung חַיַּת יָדֵךְ wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
