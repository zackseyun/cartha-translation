  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: de
  text: Wegen der Schuld seines unrechten Gewinns[a] war ich zornig und schlug ihn; ich verbarg mich[b] und war zornig, und er ging abtrünnig weiter auf dem Weg seines Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seiner Habgier«. Das hebräische Wort kann sowohl gieriges Verlangen als auch den durch Gier erzielten Gewinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ich verbarg mein Angesicht und war zornig«. Das Verbergen des Angesichts ist eine verbreitete biblische Wendung; »Angesicht« steht hier im Hebräischen jedoch nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן בִּצְעוֹ
  choice: Wegen der Schuld seines unrechten Gewinns
  rationale: Die Präposition wird im Zusammenhang kausal verstanden. Die Formulierung bewahrt sowohl עָוֺן („Schuld, Vergehen“) als auch den wirtschaftlichen und moralischen Gehalt von בֶּצַע, ohne die ebenfalls mögliche Bedeutung „Habgier“ auszuschließen.
- source_word: קָצַפְתִּי ... וְאֶקְצֹף
  choice: wurde ich zornig ... und war zornig
  rationale: Die zweimalige Verwendung von קצף bleibt als bewusste Wiederholung erhalten. „Zornig“ ist gegenwärtiges, würdiges Standarddeutsch, ohne die Intensität unnötig zu steigern.
- source_word: וְאַכֵּהוּ
  choice: und schlug ihn
  rationale: Das Hifil von נכה bezeichnet hier eine konkrete strafende Handlung. „Schlug“ gibt diese direkt und natürlich wieder.
- source_word: הַסְתֵּר
  choice: ich verbarg mich
  rationale: Der absolute Infinitiv ist elliptisch beziehungsweise adverbial gebraucht. Die Wiedergabe als eigenständiger Satzteil ist im Deutschen verständlich und fügt das im Hebräischen nicht ausdrücklich genannte Wort „Angesicht“ nicht in den Haupttext ein.
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: und er ging abtrünnig weiter
  rationale: „Ging ... weiter“ bringt die Fortdauer seines Verhaltens zum Ausdruck; „abtrünnig“ bewahrt den Sinn des Sich-Abwendens in שׁוֹבָב. Das verbindende „und“ vermeidet eine im Hebräischen nicht ausdrücklich markierte adversative Deutung.
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: auf dem Weg seines Herzens
  rationale: Die hebräische Wegmetapher und das Herz als Sitz des Wollens und der inneren Ausrichtung werden bewahrt, ohne sie erklärend aufzulösen.
theological_decisions:
- issue: Gegenstand des Gerichts in בִּצְעוֹ
  choice: seines unrechten Gewinns
  alternative: seiner Habgier
  rationale: Das Wort kann sowohl gieriges Verlangen als auch den dadurch erzielten Gewinn bezeichnen. Der Haupttext erhält die konkrete wirtschaftliche Bedeutung; die Fußnote bewahrt die innere, auf das Begehren bezogene Lesart.
- issue: Ausdruck göttlicher Verborgenheit in הַסְתֵּר
  choice: ich verbarg mich
  alternative: ich verbarg mein Angesicht
  rationale: „Angesicht“ gehört zu einer verbreiteten biblischen Wendung, steht hier jedoch nicht ausdrücklich im hebräischen Text. Daher wird es nicht in den Haupttext aufgenommen, sondern als idiomatische Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend erhaltener hebräischer Satzfolge und Bildsprache. Die Wiederholung von „zornig“ sowie die zweimalige Verbindung mit „und“ wurden bewusst beibehalten. „Abtrünnig“ ist leicht gehoben, bleibt aber verständlich und trägt den Sinn des fortgesetzten Sich-Abwendens.
