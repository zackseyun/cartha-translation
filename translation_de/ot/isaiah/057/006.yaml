base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: de
  text: Unter den glatten Steinen im Bachbett liegt dein Anteil[a]; sie, gerade sie, sind dein Los. Auch ihnen hast du ein Trankopfer ausgegossen und ein Speiseopfer dargebracht. Sollte ich deswegen nachgeben?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter den Anteilen des Bachtals“. Das Hebräische meint hier wahrscheinlich die glatten Steine eines Bachbetts, was zum götzendienerischen Zusammenhang passt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sollte ich mich darüber trösten?“ Das hebräische Verb kann auch bedeuten, getröstet oder besänftigt zu werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: Unter den glatten Steinen im Bachbett
  rationale: חַלְּקֵי wird hier wahrscheinlich von der Vorstellung des Glatten her verstanden und bezeichnet die glatten Steine eines zeitweise wasserführenden Bachbetts. Das passt zum Götzendienst im Kontext und zu den folgenden männlichen Pronomen. Die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: חֶלְקֵךְ
  choice: dein Anteil
  rationale: חֵלֶק bezeichnet einen zugeteilten Anteil. „Anteil“ bewahrt die Zuteilungssprache und steht in einer natürlichen Parallele zu „Los“.
- source_word: הֵם הֵם
  choice: sie, gerade sie
  rationale: Die Wiederholung ist nachdrücklich. „Gerade sie“ gibt diese Hervorhebung in natürlichem modernem Deutsch wieder.
- source_word: גּוֹרָלֵךְ
  choice: dein Los
  rationale: גּוֹרָל bezeichnet wörtlich das Los und dann den dadurch zugeteilten Anteil. „Los“ erhält das konkrete Bild und die Parallele zu „Anteil“.
- source_word: נֶסֶךְ
  choice: Trankopfer
  rationale: נֶסֶךְ ist der übliche kultische Ausdruck für ein ausgegossenes Opfer. „Trankopfer“ ist präzise und im Deutschen verständlich.
- source_word: הֶעֱלִית
  choice: dargebracht
  rationale: Der Hifil von עלה kann im Opferzusammenhang das Darbringen eines Opfers bezeichnen. „Dargebracht“ ist natürliches deutsches Kultvokabular, ohne die Bedeutung unnötig einzuengen.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang häufig ein aus pflanzlichen Erzeugnissen bestehendes Opfer. „Speiseopfer“ ist der etablierte, hinreichend verständliche deutsche Ausdruck.
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: Sollte ich deswegen nachgeben?
  rationale: נחם im Nifal kann je nach Zusammenhang „nachgeben“, „es sich anders überlegen“ oder „getröstet werden“ bedeuten. Im Gerichtskontext gibt „nachgeben“ die wahrscheinlich gemeinte rhetorische Frage knapp wieder; die alternative Bedeutung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Sinn der abschließenden rhetorischen Frage
  choice: Frage, ob Gott wegen dieser Handlungen nachgeben beziehungsweise vom Gericht absehen sollte
  alternative: Frage, ob Gott darüber getröstet oder dadurch besänftigt werden könne
  rationale: Der Zusammenhang verurteilt den Götzendienst, sodass die Frage wahrscheinlich eine göttliche Zurücknahme des Gerichts verneint. Da אֶנָּחֵם jedoch auch „getröstet werden“ oder „sich umstimmen lassen“ bedeuten kann, wird diese Spannung nicht beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung הֵם הֵם wird idiomatisch mit „sie, gerade sie“ wiedergegeben. „Bachbett“, „Trankopfer“ und „Speiseopfer“ halten das konkrete Bild und die kultische Sprache verständlich fest.
