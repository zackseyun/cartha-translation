id: ISA.38.2
reference: Isaiah 38:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּסֵּ֧ב חִזְקִיָּ֛הוּ פָּנָ֖י/ו אֶל הַ/קִּ֑יר וַ/יִּתְפַּלֵּ֖ל אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/002.yaml
  text: Then Hezekiah turned his face to the wall and prayed to Yahweh[b][a],
translation:
  language: de
  text: Da wandte Hiskia sein Gesicht der Wand zu[b] und betete zu Jahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zur Wand hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: wandte … zu
  rationale: Die Hifil-Form von סבב bezeichnet hier das körperliche Wenden beziehungsweise Ausrichten. Die deutsche Wendung „sein Gesicht … zuwenden“ gibt die konkrete Bewegung natürlich wieder.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: Die konkrete Körperangabe des Hebräischen bleibt erhalten und wird nicht zu „sich“ verallgemeinert, da sie die anschauliche und emotionale Wirkung der Szene trägt.
- source_word: אֶל הַקִּיר
  choice: der Wand zu
  rationale: אֶל bezeichnet die Richtung der Bewegung. „Der Wand zu“ ist idiomatisches Deutsch und lässt offen, ob nur die Ausrichtung oder eine Bewegung bis unmittelbar an die Wand gemeint ist.
- source_word: וַיִּתְפַּלֵּל
  choice: und betete
  rationale: Die Hitpael-Form von פלל hat hier die übliche Bedeutung „beten“. Die fortlaufende Erzählform wird mit „und“ wiedergegeben.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל kennzeichnet den Adressaten des Gebets; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den Eigennamen wieder; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt, ohne den Namen im Haupttext durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die konkrete Gebärde des Gesichtwendens wird bewahrt; „Da“ führt den unmittelbaren Fortgang der Erzählung knapp und natürlich fort.
