source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: de
  text: 'Ich sagte: »Ich werde Jah, Jah[a], im Land der Lebenden nicht sehen; keinen Menschen werde ich mehr erblicken bei den Bewohnern der Welt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »Jah, Jah«, die wiederholte poetische Kurzform des Gottesnamens; konventionell wird der Gottesname häufig mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Der hebräische Schlussausdruck ist schwierig. »Welt« ist eine mögliche Deutung; andere Wiedergaben sind etwa »das Aufhören«, »das vergängliche Dasein« oder »das Totenreich«. Das seltene Wort חָדֶל kann auf Aufhören, Hinfälligkeit oder einen vom gewöhnlichen Leben abgeschnittenen Bereich weisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Das Qal-Perfekt in der 1. Person Singular leitet Hiskias Klage als direkte Rede ein. »Ich dachte« wäre idiomatisch möglich, ist aber weniger unmittelbar.
- source_word: לֹא אֶרְאֶה
  choice: ich werde … nicht sehen
  rationale: Das negierte Qal-Imperfekt bezeichnet hier die erwartete künftige Entbehrung.
- source_word: יָהּ יָהּ
  choice: Jah, Jah
  rationale: Die zweimal gesetzte poetische Kurzform des Gottesnamens wird transliteriert und in ihrer emphatischen Wiederholung bewahrt.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet den Lebensbereich der Lebenden im Gegensatz zu Tod und Scheol.
- source_word: לֹא אַבִּיט … עוֹד
  choice: werde ich nicht mehr erblicken
  rationale: Die Verbindung aus negiertem Verb und עוֹד wird im Deutschen natürlich mit »nicht mehr« wiedergegeben; »erblicken« erhält das Seh-Motiv und variiert gegenüber »sehen«.
- source_word: אָדָם
  choice: einen Menschen
  rationale: Im Wirkungsbereich der Verneinung ist der indefinite Akkusativ »keinen Menschen« im Deutschen die natürliche Entsprechung und bezeichnet menschliche Gemeinschaft allgemein.
- source_word: עִם יֹשְׁבֵי
  choice: unter den Bewohnern
  rationale: עִם bedeutet grundsätzlich »mit«; »unter« gibt hier die Zugehörigkeit zu einer Gemeinschaft idiomatisch wieder, ohne den schwierigen Schlussausdruck festzulegen.
- source_word: חָדֶל
  choice: des Vergänglichen
  rationale: Das seltene und schwierige Wort hängt mit Aufhören, Schwinden oder Hinfälligkeit zusammen. »Des Vergänglichen« bleibt bewusst offen und ist im Deutschen natürlicher als das substantivierte »des Aufhörens«; eine eindeutige Gleichsetzung mit Totenreich oder Welt wird vermieden.
theological_decisions:
- issue: Wiedergabe der Gottesnamensform יָהּ
  choice: Jah, Jah
  alternative: der HERR, der HERR; Jahwe
  rationale: Der hebräische Text verwendet zweimal die poetische Kurzform יָהּ, nicht das volle Tetragramm. Transliteration und Wiederholung bilden die konkrete Form und ihren Nachdruck ab.
- issue: Deutung von חָדֶל
  choice: des Vergänglichen
  alternative: des Totenreichs; der Welt; des Aufhörens
  rationale: Der seltene Ausdruck ist lexikalisch und kontextuell unsicher. Die gewählte Formulierung wahrt den Zusammenhang mit Aufhören und Vergänglichkeit, ohne den Referenten dogmatisch oder kosmologisch eindeutig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzführung. Die ungewöhnliche Wiederholung »Jah, Jah« und die Spannung des schwer deutbaren Schlussausdrucks bleiben erhalten; die Fußnoten machen die wesentlichen Alternativen transparent.
