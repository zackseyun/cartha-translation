source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: de
  text: 'Und er sagte: »Ach, Yahweh, denk doch daran, dass ich treu und mit ungeteiltem Herzen[a] vor dir gelebt und getan habe, was gut ist in deinen Augen.« Und Hiskia weinte heftig[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit ganzem Herzen«; wörtlich auch: »mit einem vollkommenen Herzen«. Gemeint ist ein vollständiges, ungeteiltes Herz.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Hiskia weinte ein großes Weinen«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Bewahrt den fortlaufenden hebräischen Erzählstil; das Subjekt ergibt sich aus dem Zusammenhang.
- source_word: אָנָּה יְהוָה זְכָר נָא
  choice: Ach, Yahweh, denk doch daran
  rationale: »Ach« und »doch« geben die eindringliche, flehende Kraft der beiden Bittepartikeln wieder, ohne im Deutschen schwerfällig zu wirken; der Gottesname bleibt als Eigenname erhalten.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: vor dir gelebt
  rationale: Das hebräische Bild des Wandelns bezeichnet hier die gesamte Lebensführung vor Gott. »Vor dir gelebt« gibt das Idiom in natürlichem modernem Deutsch wieder.
- source_word: בֶּאֱמֶת
  choice: treu
  rationale: Im Zusammenhang der Lebensführung bezeichnet אֱמֶת vor allem Verlässlichkeit und Treue; die mögliche Bedeutung »in Wahrheit« wird dadurch nicht dogmatisch überdehnt.
- source_word: וּבְלֵב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: שָׁלֵם bezeichnet Ganzheit und ungeteilte Hingabe. Diese Formulierung vermeidet die mögliche Fehlvorstellung moralischer Sündlosigkeit.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: und getan habe, was gut ist in deinen Augen
  rationale: Bewahrt die hebräische Bewertungsformel und bleibt zugleich klar verständlich.
- source_word: וַיֵּבְךְּ חִזְקִיָּהוּ בְּכִי גָדוֹל
  choice: Und Hiskia weinte heftig
  rationale: Der hebräische Ausdruck »weinte ein großes Weinen« verstärkt das Verb. »Heftig« vermittelt diese Intensität natürlich, ohne zusätzlich die nicht ausdrücklich bezeichnete Nuance »bitterlich« einzutragen.
theological_decisions:
- issue: Hiskias Aussage über sein Herz
  choice: mit ungeteiltem Herzen
  alternative: mit vollkommenem Herzen
  rationale: Die Wendung beschreibt Ganzheit beziehungsweise ungeteilte Hingabe und muss nicht als Behauptung absoluter Sündlosigkeit verstanden werden.
- issue: Hiskias Berufung auf seine Treue
  choice: treu ... vor dir gelebt
  alternative: in Wahrheit vor dir gewandelt
  rationale: Der Text lässt Hiskias eigene Bitte und Selbsteinschätzung stehen, ohne daraus eine allgemeine Lehraussage über Verdienst oder Sündlosigkeit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die flehende Gebetssprache wird durch »Ach ... denk doch« natürlich wiedergegeben. Hebräische Redeweisen bleiben dort erhalten, wo sie im Deutschen verständlich sind; andernfalls werden sie idiomatisch übertragen.
