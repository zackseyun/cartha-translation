  variant: modern standard German
source:
  edition: WLC
  text: מָֽה אֲדַבֵּ֥ר וְ/אָֽמַר לִ֖/י וְ/ה֣וּא עָשָׂ֑ה אֶדַּדֶּ֥ה כָל שְׁנוֹתַ֖/י עַל מַ֥ר נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: de
  text: Was soll ich sagen? Er hat zu mir gesprochen, und er selbst hat es getan. All meine Jahre will ich langsam gehen wegen der Bitterkeit meiner Seele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Still und langsam will ich all meine Jahre in der Bitterkeit meiner Seele gehen.“ Das seltene Verb kann ein gedämpftes oder langsames Gehen bezeichnen; die Wendung mit „Bitterkeit“ kann statt als Grund auch als Art und Weise verstanden werden.'
    reason: 'Lexikalische und syntaktische Alternative: Bedeutung des seltenen Verbs אֶדַּדֶּה und Funktion von עַל.'
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: Was soll ich sagen?
  rationale: Die rhetorische Frage drückt Ratlosigkeit oder Ergriffenheit aus. „Was soll ich sagen?“ ist im modernen Deutschen natürlich und bewahrt die offene Frageform.
- source_word: וְאָמַר לִי
  choice: Er hat zu mir gesprochen
  rationale: Das Perfekt gibt die aus der Rückschau betrachtete, abgeschlossene Rede angemessen wieder. „Zu mir gesprochen“ passt zum feierlichen Ton und lässt den Inhalt unausgesprochen wie im Hebräischen.
- source_word: וְהוּא עָשָׂה
  choice: und er selbst hat es getan
  rationale: Das ausdrücklich gesetzte Pronomen הוּא trägt Nachdruck; „er selbst“ erhält diese Betonung. Das ergänzte „es“ entspricht dem im Hebräischen unausgesprochenen Gegenstand der Handlung, ohne ihn näher festzulegen.
- source_word: אֶדַּדֶּה
  choice: Langsam will ich … dahingehen
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein langsames oder gedämpftes Sichbewegen. „Langsam … dahingehen“ ist verständlich, bewahrt das Bewegungsbild und kann zugleich die weitere Lebensführung bezeichnen.
- source_word: כָּל שְׁנוֹתַי
  choice: all meine Jahre
  rationale: Die knappe Zeitangabe wird ohne die zwar naheliegende, aber nicht ausdrücklich vorhandene Ergänzung „verbleibenden“ wiedergegeben.
- source_word: עַל מַר נַפְשִׁי
  choice: wegen der Bitterkeit meiner Seele
  rationale: עַל wird hier kausal verstanden. „Bitterkeit meiner Seele“ bewahrt die anthropologische Ausdrucksweise des Hebräischen; die mögliche modale Deutung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezug der Verben in der dritten Person
  choice: Das Pronomen „er“ bleibt stehen; aus dem Zusammenhang ist Gott als Bezugsperson zu erschließen.
  alternative: Ein nicht näher bestimmtes Subjekt spricht und handelt.
  rationale: Hiskijas Lied blickt auf das Reden und Handeln des HERRN zurück. Da Gott in diesem Vers selbst nicht genannt wird, fügt die Übersetzung seinen Namen nicht erklärend ein.
- issue: Verhältnis von Gottes Reden und Handeln
  choice: „Er hat zu mir gesprochen, und er selbst hat es getan“ bewahrt sowohl die Rede als auch die vollzogene Handlung.
  alternative: Die beiden Aussagen zu einer einzigen Aussage über Gottes Verheißung oder Heilung zusammenzuziehen.
  rationale: Der hebräische Text stellt Reden und Tun nebeneinander und lässt den genauen Gegenstand unausgesprochen. Die Übersetzung löst diese Spannung nicht durch eine ausdrückliche Deutung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und reflektierend. „Dahingehen“ erhält das Bewegungsbild und die mögliche Bedeutung der Lebensführung, ohne altertümlich stark markiert zu sein.
