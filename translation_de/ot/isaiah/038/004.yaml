base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/004.yaml
  text: Then the word of Yahweh came to Isaiah[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Jesaja:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die narrative Wayyiqtol-Form führt das nächste Ereignis ein. „Da erging“ ist im Deutschen eine natürliche, würdige Wiedergabe der geläufigen prophetischen Formel.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der Formel דְּבַר יְהוָה bewahrt „das Wort“ die erkennbare Redeweise göttlicher Offenbarung, ohne sie deutend zu „Botschaft“ umzuschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל
  choice: an
  rationale: Bei „das Wort erging“ bezeichnet „an“ im Deutschen idiomatisch den Empfänger.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt der folgenden Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „das Wort Jahwes erging an“ bleibt erkennbar; לֵאמֹר wird idiomatisch durch einen Doppelpunkt ausgedrückt.
