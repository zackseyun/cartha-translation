  text: הִנְ/נִ֣י מֵשִׁ֣יב אֶת צֵ֣ל הַֽ/מַּעֲל֡וֹת אֲשֶׁ֣ר יָרְדָה֩ בְ/מַעֲל֨וֹת אָחָ֥ז בַּ/שֶּׁ֛מֶשׁ אֲחֹרַנִּ֖ית עֶ֣שֶׂר מַעֲל֑וֹת וַ/תָּ֤שָׁב הַ/שֶּׁ֨מֶשׁ֙ עֶ֣שֶׂר מַעֲל֔וֹת בַּֽ/מַּעֲל֖וֹת אֲשֶׁ֥ר יָרָֽדָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: de
  text: Siehe, ich lasse den Schatten, der durch die Sonne auf den Stufen des Ahas[b] hinabgegangen war, um zehn Stufen[a] zurückgehen. Da ging die Sonne auf den Stufen, auf denen sie hinabgegangen war, um zehn Stufen zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zehn Grade«. Das hebräische Wort bedeutet wörtlich »Stufen« oder »Aufstiege«; möglicherweise ist eine stufenartige Sonnenuhr gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Möglicherweise ist mit den »Stufen des Ahas« eine Anlage gemeint, an der sich der Stand des Sonnenschattens ablesen ließ.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Leitet eine feierliche göttliche Ankündigung ein und bewahrt die hervorhebende Kraft des Hebräischen in würdigem, verständlichem Deutsch.
- source_word: מֵשִׁיב
  choice: ich lasse … zurückgehen
  rationale: Die Hifil-Form von שׁוב ist kausativ; die Formulierung gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: צֵל
  choice: der Schatten
  rationale: Gibt den konkreten Schatten des Zeichens ohne erklärende Paraphrase wieder.
- source_word: מַעֲלוֹת
  choice: Stufen
  rationale: Das Wort bezeichnet wörtlich Stufen oder Aufstiege. Diese Wiedergabe bleibt näher am Hebräischen als die traditionelle Deutung »Grade« und legt die genaue Bauart nicht fest.
- source_word: בְמַעֲלוֹת אָחָז
  choice: auf den Stufen des Ahas
  rationale: Bewahrt die konkrete hebräische Formulierung und lässt offen, ob damit eine Treppenanlage oder eine Vorrichtung zur Anzeige des Sonnenstands gemeint ist.
- source_word: בַּשֶּׁמֶשׁ
  choice: durch die Sonne
  rationale: Drückt die Sonne als Ursache beziehungsweise Mittel des wandernden Schattens aus, ohne eine technische Erklärung einzutragen.
- source_word: אֲחֹרַנִּית
  choice: zurück
  rationale: Gibt die rückläufige Richtung idiomatisch zusammen mit dem Verb wieder.
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: zehn Stufen
  rationale: Bewahrt Zahl und konkretes Substantiv des Hebräischen; »zehn Grade« bleibt als mögliche Deutung in der Fußnote genannt.
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: Da ging die Sonne … zurück
  rationale: Das Hebräische nennt ausdrücklich die Sonne als Subjekt. Die Übersetzung bewahrt diese phänomenologische Darstellung.
- source_word: אֲשֶׁר יָרָדָה
  choice: auf denen sie hinabgegangen war
  rationale: Bewahrt die Richtungsangabe und bezieht das feminine Verb entsprechend dem unmittelbaren hebräischen Subjekt auf die Sonne.
theological_decisions:
- issue: Art des Zeichens mit Sonne und Schatten
  choice: Das Geschehen wird in der beobachtenden Ausdrucksweise des Textes als Rückgang von Schatten und Sonne wiedergegeben.
  alternative: Den Vorgang ausschließlich als Bewegung eines Schattens auf einer Sonnenuhr erklären oder die Aussage über das Zurückgehen der Sonne paraphrasieren.
  rationale: Der hebräische Text beschreibt das Zeichen als wunderbares Geschehen, ohne seinen Mechanismus zu erläutern. Die Übersetzung soll weder eine naturwissenschaftliche Erklärung eintragen noch den Wundercharakter abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« wahrt den feierlichen Ton. Die Wiederholung von »Stufen« und die Aussage, dass die Sonne zurückging, folgen bewusst der konkreten und phänomenologischen Sprache des hebräischen Textes.
