base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: de
  text: Meine Wohnstatt ist abgebrochen und von mir weggetragen worden wie das Zelt eines Hirten.[a] Ich habe mein Leben zusammengerollt wie ein Weber; von den Kettfäden schneidet er mich ab.[b][c] Vom Tag bis zur Nacht bringst du mich zu Ende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Generation ist fortgezogen und von mir weggenommen wie das Zelt eines Hirten.“ Das hebräische Wort bedeutet gewöhnlich „Generation“, kann hier aber eine Wohnstatt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich habe mein Leben wie ein Weber abgeschnitten.“ Das hebräische Verb ist unsicher; im Text wird es wegen des Weberbildes mit „zusammengerollt“ wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder allgemeiner: „vom Webstuhl“. Gemeint sind wahrscheinlich die herabhängenden Fäden, besonders die Kettfäden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: meine Wohnstatt
  rationale: Obwohl דּוֹר meist „Generation“ bedeutet, legt das Bild vom abgebrochenen Hirtenzelt hier die seltenere Bedeutung „Wohnstatt/Aufenthaltsort“ nahe. „Wohnstatt“ wahrt den poetisch-würdigen Ton.
- source_word: נִסַּע וְנִגְלָה
  choice: wird abgebrochen und von mir weggetragen
  rationale: Die beiden Passivformen entfalten konkret das Bild eines Zeltes, das abgebrochen und fortgeschafft wird.
- source_word: כְּאֹהֶל רֹעִי
  choice: wie das Zelt eines Hirten
  rationale: Die natürliche deutsche Genitivkonstruktion erhält das Bild einer beweglichen, vorläufigen Behausung.
- source_word: קִפַּדְתִּי
  choice: Ich habe … zusammengerollt
  rationale: Das schwierige Verb wird im Zusammenhang des Weberbildes als Aufrollen des Gewebes verstanden; die mögliche Bedeutung „abgeschnitten“ bleibt in einer Fußnote sichtbar.
- source_word: כָאֹרֵג חַיַּי
  choice: mein Leben … wie ein Weber
  rationale: Die knappe poetische Vergleichsform bleibt erhalten, ohne das Bild unnötig auszudeuten.
- source_word: מִדַּלָּה
  choice: von den Kettfäden
  rationale: Der Ausdruck bezeichnet wahrscheinlich die herabhängenden Fäden beziehungsweise die Kette am Webstuhl. „Kettfäden“ ist genauer als das allgemeinere „Webstuhl“.
- source_word: יְבַצְּעֵנִי
  choice: schneidet er mich ab
  rationale: Die Form bezeichnet ein Abschneiden oder Abtrennen und führt das Weberbild zugleich als Bild für das Ende des Lebens fort.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Vom Tag bis zur Nacht
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Zeitangabe und vermittelt die erschreckende Schnelligkeit des erwarteten Endes.
- source_word: תַּשְׁלִימֵנִי
  choice: bringst du mich zu Ende
  rationale: Der Hifil von שׁלם bedeutet hier, etwas vollständig zu Ende zu bringen. Die Formulierung ist würdig und bewahrt die direkte Anrede.
theological_decisions:
- issue: Wechsel des grammatischen Subjekts von der dritten zur zweiten Person
  choice: „er schneidet mich ab … du bringst mich zu Ende“
  alternative: Beide Aussagen mit „du“ wiedergeben oder den Handelnden unpersönlich lassen.
  rationale: Der hebräische Text wechselt offenbar vom Handelnden innerhalb des Weberbildes zur unmittelbaren Anrede Gottes. Der unvermittelte Wechsel wird nicht harmonisiert und bewahrt die Spannung der Klage.
translation_notes:
  register: Modernes Standarddeutsch in poetisch-würdigem Register. Die Bildfolge vom Hirtenzelt und vom Weben bleibt konkret; ungewöhnliche oder unsichere hebräische Ausdrücke werden nicht geglättet, sondern durch Fußnoten transparent gemacht.
