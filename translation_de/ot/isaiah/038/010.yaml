  source_fidelity: 'Die Deutung von בִּדְמִי יָמַי als vorzeitige Lebensmitte ist im Kontext gut vertretbar; die Fußnote bewahrt die lexikalische Unsicherheit angemessen. Für בְּשַׁעֲרֵי ist jedoch „zu den Toren“ genauer als „durch die Tore“: Der hebräische Ausdruck lokalisiert den Gang bei/an den Toren und sagt den Durchgang nicht ausdrücklich aus. Die Schlussaussage ist als bereits feststehender Verlust formuliert; „ist mir genommen“ bildet dies besser ab als das zukunftsgerichtete „wird mir genommen“.'
