  text: אֲנִ֣י אָמַ֗רְתִּי בִּ/דְמִ֥י יָמַ֛/י אֵלֵ֖כָה בְּ/שַׁעֲרֵ֣י שְׁא֑וֹל פֻּקַּ֖דְתִּי יֶ֥תֶר שְׁנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: de
  text: 'Ich sagte: »Mitten in meinen Tagen[a] muss ich zu den Toren des Scheols[b] gehen; der Rest meiner Jahre ist mir genommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des hebräischen Ausdrucks ist umstritten; möglich ist auch: »beim Abschneiden meiner Tage«. Gemeint ist wahrscheinlich die Mitte oder Blüte des Lebens.'
    reason: lexical_alternative
  - marker: b
    text: 'Scheol bezeichnet den Bereich der Toten; auch: »Totenreich« oder »Grab«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  choice: mitten in meinen Tagen
  rationale: דְּמִי ist hier schwierig und kann mit Abschneiden, Stillstand oder Lebensmitte verbunden werden. Der Zusammenhang mit den noch verbleibenden Jahren legt die Mitte beziehungsweise Blüte des Lebens nahe; die Fußnote bewahrt die Unsicherheit.
- source_word: אֵלֵכָה בְּשַׁעֲרֵי
  choice: muss ich durch die Tore … gehen
  rationale: Das Imperfekt beschreibt den erwarteten Gang in den Tod; „muss“ gibt die im Klagezusammenhang empfundene Unausweichlichkeit wieder. Die Präposition בְּ bei „Toren“ lässt sich als Bewegung durch den Eingang verstehen.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den besonderen hebräischen Begriff für den Bereich der Toten und vermeidet eine vorschnelle Gleichsetzung mit Grab oder Hölle.
- source_word: פֻּקַּדְתִּי יֶתֶר שְׁנוֹתָי
  choice: der Rest meiner Jahre wird mir genommen
  rationale: Die passive Form von פקד bezeichnet im Zusammenhang den auferlegten Verlust der noch verbleibenden Lebensjahre. Die deutsche Formulierung ist natürlich und erhält die Passivität der Aussage.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל in einer Klage über den bevorstehenden Tod
  choice: Scheol
  alternative: Totenreich; Grab
  rationale: „Scheol“ erhält die alttestamentliche Vorstellungswelt, ohne den Ausdruck mit späteren Vorstellungen von Hölle gleichzusetzen. Eine Fußnote erschließt den Begriff.
- issue: Deutung des vorzeitigen Todes in בִּדְמִי יָמַי
  choice: mitten in meinen Tagen
  alternative: beim Abschneiden meiner Tage; in der Stille meiner Tage
  rationale: Der Parallelgedanke vom Verlust der restlichen Jahre spricht für einen Tod in der Lebensmitte, doch die lexikalische Unsicherheit wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Tagen, Toren und Jahren bleibt erhalten; „Scheol“ wird nicht konfessionell oder dogmatisch näher bestimmt.
