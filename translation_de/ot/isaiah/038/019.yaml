  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: de
  text: Der Lebendige, der Lebendige, er dankt dir, wie ich heute; ein Vater macht den Kindern[b] deine Treue[a] bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrheit“. Das hebräische Wort אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bezeichnen.'
