  - marker: b
    text: 'Wörtlich: „Söhnen“. Gemeint sein können hier Kinder beziehungsweise Nachkommen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: Wer lebt, wer lebt
  rationale: Die emphatische Wiederholung bleibt erhalten. Die substantivische Form des Hebräischen wird im Deutschen durch einen natürlichen generischen Relativsatz wiedergegeben.
- source_word: יוֹדֶךָ
  choice: der dankt dir
  rationale: Das Hifil von ידה bezeichnet hier im Danklied das Danken beziehungsweise den Lobpreis gegenüber Gott; „dankt dir“ trifft den Zusammenhang prägnant.
- source_word: כָּמוֹנִי הַיּוֹם
  choice: wie ich heute
  rationale: Die knappe hebräische Vergleichsform bleibt erhalten; das Verb „danken“ ist aus dem vorhergehenden Satzteil mitzudenken.
- source_word: אָב לְבָנִים
  choice: ein Vater … seine Kinder
  rationale: בָּנִים bedeutet formal „Söhne“, kann in diesem generationenbezogenen Zusammenhang jedoch die Kinder beziehungsweise Nachkommen insgesamt bezeichnen. Das Possessivpronomen macht die Beziehung im Deutschen natürlich deutlich.
- source_word: יוֹדִיעַ
  choice: lässt … erkennen
  rationale: Das Hifil von ידע hat kausative Bedeutung („wissen lassen“, „bekannt machen“). „Erkennen lassen“ ist hier idiomatisch und bewahrt diesen kausativen Sinn.
- source_word: אֶל אֲמִתֶּךָ
  choice: deine Treue
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bezeichnen. Im Zusammenhang der Weitergabe von Gottes verlässlichem Handeln passt „Treue“ am besten; die echte Alternative „Wahrheit“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von בָּנִים
  choice: Kinder
  alternative: Söhne
  rationale: Der maskuline Plural kann hier die Nachkommen insgesamt bezeichnen. „Kinder“ gibt die generationenübergreifende Aussage wieder, ohne den Text auf männliche Nachkommen zu beschränken; die formale Alternative wird offengelegt.
- issue: Bedeutungsnuance von אֱמֶת in Bezug auf Gott
  choice: Treue
  alternative: Wahrheit
  rationale: Der Zusammenhang betont Gottes verlässliches Handeln, das der nächsten Generation bekannt gemacht wird. „Wahrheit“ bleibt jedoch lexikalisch möglich und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung und die knappe Parallelstruktur des Hebräischen bleiben erhalten; das Semikolon bildet den Übergang von der persönlichen Danksagung zur Weitergabe an die nächste Generation ab.
