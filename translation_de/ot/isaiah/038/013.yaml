id: ISA.38.13
reference: Isaiah 38:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
translation:
  language: de
  text: Ich harrte bis zum Morgen[a]; wie ein Löwe, so zerbricht er alle meine Knochen[b]. Vom Tag bis zur Nacht bringst du mich an mein Ende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich fasste mich bis zum Morgen.“ Das erste Verb ist schwer zu deuten; manche verstehen es als Selbstbeherrschung statt als Ausharren.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wechselt die Formulierung von „er zerbricht“ zu „du bringst mich an mein Ende“. Dieser poetische Wechsel der Anrede ist in der Übersetzung beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Ich harrte
  rationale: Das schwierige Verb wird im Zusammenhang mit עַד בֹּקֶר als Ausharren bzw. Warten durch die Nacht verstanden. „Harren“ ist knapp, würdevoll und lässt die angespannte Erwartung des Klagenden erkennen.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die Zeitangabe wird unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: כָּאֲרִי
  choice: wie ein Löwe
  rationale: Die Vergleichsform wird direkt bewahrt; das Bild vermittelt gewaltsames Zermalmen.
- source_word: כֵּן
  choice: so
  rationale: „So“ führt knapp die dem Vergleich entsprechende Handlung ein.
- source_word: יְשַׁבֵּר
  choice: zerbricht er
  rationale: Der Piel von שׁבר bezeichnet ein heftiges Zerbrechen oder Zerschmettern. „Zerbricht“ verbindet sich natürlich mit „Knochen“ und erhält die konkrete Gewaltsamkeit.
- source_word: כָּל עַצְמוֹתָי
  choice: alle meine Knochen
  rationale: Die körperliche Bildsprache des hebräischen Textes wird wörtlich bewahrt.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Vom Tag bis zur Nacht
  rationale: Die wörtliche Zeitspanne bleibt erhalten, ohne sie deutend zu „an einem einzigen Tag“ umzuformen.
- source_word: תַּשְׁלִימֵנִי
  choice: bringst du mich an mein Ende
  rationale: Der Hiphil von שׁלם bezeichnet hier im Kontext nicht Wiederherstellung, sondern das Zu-Ende-Bringen. Die zweite Person Singular wird ausdrücklich erhalten.
theological_decisions:
- issue: Wechsel von der dritten zur zweiten Person innerhalb des Verses
  choice: „er zerbricht … du bringst mich an mein Ende“
  alternative: Beide Aussagen an die dritte Person angleichen oder das Löwenbild durchgehend ausdrücklich auf Gott beziehen.
  rationale: Der hebräische Wechsel wird als poetische Anredebewegung der Klage bewahrt. Dadurch bleibt offen, wie ausdrücklich der Löwe mit Gott gleichgesetzt wird, während die abschließende direkte Anrede unverändert deutlich bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Harrte“ ist leicht gehoben, aber allgemein verständlich und trägt die klagende, angespannte Stimmung. Die konkrete Körpermetaphorik sowie der unvermittelte Personenwechsel bleiben erhalten.
