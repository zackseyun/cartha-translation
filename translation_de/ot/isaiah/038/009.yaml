  text: 'A writing of Hezekiah king of Judah[b][a], when he had been sick and had recovered from his sickness:'
translation:
  language: de
  text: Eine Schrift[a] Hiskias, des Königs von Juda, nachdem er krank gewesen und von seiner Krankheit genesen war:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Abfassung Hiskias“ oder „Eine Aufzeichnung Hiskias“. Das hebräische Wort bezeichnet eine schriftliche Komposition, ohne deren genaue Gattung festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er lebte von seiner Krankheit“. Gemeint ist, dass er wieder gesund wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  choice: Eine Schrift
  rationale: Das Substantiv bezeichnet allgemein ein Schriftstück oder eine schriftliche Abfassung, ohne die Gattung genauer festzulegen. „Schrift“ bleibt daher bewusst offen und vermeidet die nicht ausdrücklich belegte Festlegung auf Gedicht oder Psalm.
- source_word: לְחִזְקִיָּהוּ
  choice: Hiskias
  rationale: Das Präfix ל kennzeichnet in dieser Überschrift am ehesten Zuordnung beziehungsweise Autorschaft. Der deutsche Genitiv „Hiskias“ gibt dies natürlich wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die hebräische Status- und Gebietsangabe lässt sich im Deutschen direkt und idiomatisch als Apposition im Genitiv wiedergeben.
- source_word: בַּחֲלֹתוֹ
  choice: nachdem er krank gewesen
  rationale: Die Konstruktion bezeichnet den zeitlichen Umstand seines Krankseins. In Verbindung mit der anschließenden Genesung ist das deutsche Plusquamperfekt als rückblickende Überschrift natürlich, ohne einen ausdrücklichen Beginn der Krankheit einzutragen.
- source_word: וַיְחִי מֵחָלְיוֹ
  choice: von seiner Krankheit genesen war
  rationale: Wörtlich steht „und er lebte von seiner Krankheit“. Im Zusammenhang bezeichnet die Wendung idiomatisch das Überleben beziehungsweise die Genesung von der Krankheit; „genesen war“ gibt diesen Sinn klar wieder, ohne eine Auferstehung anzudeuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Überschriftensprache. Die Satzstellung ist im Deutschen natürlich, und die Doppelung von „krank/Krankheit“ bewahrt die enge lexikalische Verbindung des Hebräischen. Die Gattungsbezeichnung bleibt absichtlich unbestimmt.
