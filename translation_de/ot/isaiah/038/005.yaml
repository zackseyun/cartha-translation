base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: de
  text: 'Geh und sage zu Hiskia: »So spricht der HERR, der Gott deines Vorfahren David: Ich habe dein Gebet gehört und deine Tränen gesehen. Sieh, ich werde deinem Leben fünfzehn Jahre hinzufügen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Geh und sage
  rationale: Gibt die verbundene Aufforderung direkt und natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der im Deutschen etablierten Wiedergabe des Gottesnamens in Kapitälchenform.
- source_word: אָבִיךָ
  choice: deines Vorfahren
  rationale: Hebräisch אָב kann einen weiter zurückliegenden Ahnen bezeichnen; David war Hiskias Vorfahr, nicht sein unmittelbarer Vater.
- source_word: הִנְנִי
  choice: Sieh, ich werde
  rationale: Bewahrt das aufmerksamkeitslenkende Element und verbindet es idiomatisch mit der folgenden Zusage.
- source_word: יוֹסִף עַל יָמֶיךָ
  choice: deinem Leben … hinzufügen
  rationale: Überträgt das hebräische Bild der hinzugefügten Tage in verständliches modernes Deutsch, ohne den Sinn zu verändern.
theological_decisions:
- issue: Bezeichnung Davids als אָבִיךָ
  choice: deines Vorfahren David
  alternative: deines Vaters David
  rationale: Die Wahl verhindert im modernen Deutsch das Missverständnis einer unmittelbaren Vaterschaft, ohne die dynastische Beziehung oder Davids heilsgeschichtliche Bedeutung zu beseitigen.
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Ersatzlesung ist breit verständlich und entspricht der vorgelegten POB-Konsultationsfassung; der Gottesname wird dabei typografisch kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Rede. Die knappe Satzstruktur und die Wiederholung »gehört … gesehen« bleiben erhalten.
