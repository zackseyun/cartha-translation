  variant: modern standard German
source:
  edition: WLC
  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: de
  text: Herr, durch diese Dinge leben Menschen[a], und in ihnen allen liegt das Leben meines Geistes. Mach mich wieder gesund[b] und lass mich leben[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „sie leben“; möglich ist ebenso die allgemeine Wiedergabe „man lebt“. Das hebräische Verb nennt kein ausdrückliches Subjekt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heile mich“. Das Verb kann das Gesundmachen oder die Wiederherstellung der Gesundheit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „belebe mich wieder“ beziehungsweise „erhalte mich am Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Gottesbezeichnung wird in der direkten Anrede natürlich und würdig mit „Herr“ wiedergegeben; die formal mögliche Besitzbedeutung „mein Herr“ wird im Deutschen bei einer Gebetsanrede gewöhnlich nicht ausgedrückt.
- source_word: עֲלֵיהֶם
  choice: durch diese Dinge
  rationale: Die Präposition עַל mit Suffix verweist hier auf die zuvor genannten Erfahrungen oder Wirklichkeiten. „Durch diese Dinge“ gibt den instrumentalen beziehungsweise lebenserhaltenden Sinn wieder, ohne ihn enger festzulegen.
- source_word: יִחְיוּ
  choice: leben Menschen
  rationale: Das Verb steht in der 3. Person Plural, hat aber kein ausdrücklich genanntes Subjekt. „Menschen“ macht den im Kontext naheliegenden allgemeinen Bezug in natürlichem Deutsch deutlich; die formnäheren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: וּלְכָל בָּהֶן
  choice: und in ihnen allen
  rationale: Die Wendung nimmt umfassend auf die zuvor genannten Dinge Bezug. „In ihnen allen“ bewahrt sowohl den Rückverweis als auch die räumlich-bildhafte Ausdrucksweise.
- source_word: חַיֵּי רוּחִי
  choice: das Leben meines Geistes
  rationale: רוּחַ kann „Geist“, „Atem“ oder „Lebenskraft“ bezeichnen. „Geist“ erhält hier die Mehrdeutigkeit zwischen innerem Leben und Lebenskraft besser als eine Beschränkung auf den körperlichen Atem.
- source_word: וְתַחֲלִימֵנִי
  choice: Mach mich wieder gesund
  rationale: Die Hifil-Form bezeichnet im Krankheitskontext das Gesundmachen beziehungsweise die Wiederherstellung der Gesundheit. Die Formulierung ist kausativ, klar und natürlich.
- source_word: וְהַחֲיֵנִי
  choice: und lass mich leben
  rationale: Das Hifil von חיה kann „am Leben erhalten“, „lebendig machen“ oder „wieder aufleben lassen“ bedeuten. „Lass mich leben“ passt zur bittenden Gebetssprache und legt nicht unnötig fest, ob Wiederbelebung oder Bewahrung gemeint ist.
theological_decisions:
- issue: Das unausgesprochene Subjekt von יִחְיוּ
  choice: 'Allgemeiner menschlicher Bezug: „Menschen leben“'
  alternative: „sie leben“ oder „man lebt“
  rationale: Der hebräische Plural nennt kein Subjekt. Der Zusammenhang legt eine allgemeine Aussage über menschliches Leben nahe, doch die grammatische Offenheit wird nicht als dogmatische Festlegung behandelt und deshalb in einer Fußnote kenntlich gemacht.
- issue: Bedeutungsumfang von רוּחִי
  choice: „meines Geistes“
  alternative: „meines Atems“ oder sinngemäß „meiner Lebenskraft“
  rationale: Im Zusammenhang von Krankheit und Genesung können körperliches Leben, Atem und innerer Geist ineinandergreifen. „Geist“ wahrt diese anthropologische Spannung besser, als den Ausdruck ausschließlich körperlich zu verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in unmittelbarer Gebetssprache. Die Parallelität der beiden Aussagen über das Leben und der beiden abschließenden Bitten bleibt erhalten. „Dinge“ ist bewusst allgemein, weil auch der hebräische Rückverweis nicht genauer benennt, worauf er sich bezieht.
