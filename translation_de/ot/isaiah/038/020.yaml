source:
  edition: WLC
  text: יְהוָ֖ה לְ/הוֹשִׁיעֵ֑/נִי וּ/נְגִנוֹתַ֧י נְנַגֵּ֛ן כָּל יְמֵ֥י חַיֵּ֖י/נוּ עַל בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
translation:
  language: de
  text: Jahwe ist bereit, mich zu retten.[a] Und wir wollen meine Saitenmusik spielen, alle Tage unseres Lebens, im Haus Jahwes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe wird mich retten.« Wörtlicher: »Jahwe, mich zu retten.« Die hebräische Wendung ist elliptisch.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »am Haus Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt das Tetragramm als Eigennamen, statt es durch einen Titel zu ersetzen.
- source_word: לְהוֹשִׁיעֵנִי
  choice: ist bereit, mich zu retten
  rationale: Der Infinitiv mit לְ steht hier elliptisch nach dem Gottesnamen. Die Wiedergabe ergibt einen natürlichen deutschen Satz, ohne die Aussage lediglich als Absicht oder als bereits vollendete Rettung festzulegen; die formnähere Alternative wird in der Fußnote genannt.
- source_word: וּנְגִינוֹתַי
  choice: meine Saitenmusik
  rationale: Das Substantiv bezeichnet Musik beziehungsweise Musikstücke mit Bezug zum Saitenspiel. »Saitenmusik« bewahrt sowohl den musikalischen als auch den instrumentalen Sinn und passt zum folgenden Verb נגן.
- source_word: נְנַגֵּן
  choice: wir wollen … spielen
  rationale: Das Piel-Imperfekt der 1. Person Plural kann das Spielen eines Instruments beziehungsweise Musizieren bezeichnen. »Wir wollen« gibt hier den im Danklied naheliegenden entschlossenen, volitiven Sinn wieder.
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: alle Tage unseres Lebens
  rationale: Die traditionelle, zugleich verständliche deutsche Wendung bildet das hebräische Idiom für die gesamte Lebenszeit genau ab.
- source_word: עַל בֵּית יְהוָה
  choice: am Haus Jahwes
  rationale: עַל bezeichnet hier wahrscheinlich den Ort beziehungsweise den engen räumlichen Bezug zum Tempel. »Am« wahrt die weitere räumliche Bedeutung der Präposition; »im« bleibt als mögliche Deutung in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den persönlichen Gottesnamen. »Jahwe« gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Zeit- und Aussagewert der elliptischen Wendung יְהוָה לְהוֹשִׁיעֵנִי
  choice: Jahwe ist bereit, mich zu retten
  alternative: Jahwe wird mich retten
  rationale: Die hebräische Nominalfügung mit Infinitiv ist knapp und mehrdeutig. Der Haupttext folgt einer plausiblen Bereitschafts- beziehungsweise Zielaussage, während die Fußnote die futurische und die formnahe Lesart offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Klang von »alle Tage unseres Lebens« bleibt erhalten. Die knappe Parallelität des hebräischen Danklieds wird durch zwei Hauptsätze bewahrt; echte Mehrdeutigkeiten der elliptischen Rettungsformel, der Musikbezeichnung und der Ortspräposition werden nicht stillschweigend beseitigt, sondern in Fußnoten ausgewiesen.
