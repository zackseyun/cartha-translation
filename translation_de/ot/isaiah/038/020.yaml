  naturalness: »Am Haus Jahwes« wirkt im heutigen Standarddeutsch räumlich zu eng und weniger natürlich. »Im Haus Jahwes« ist als Tempellokalisierung idiomatisch und im Kontext des Kultgesangs die naheliegende Wiedergabe; die weiter gefasste Alternative bleibt in der Fußnote erhalten. Die übrige Formulierung ist verständlich und dem würdigen poetischen Register angemessen.
