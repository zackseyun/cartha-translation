  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: de
  text: Denn das Totenreich dankt dir nicht[a], der Tod lobt dich nicht; die in die Grube hinabsteigen, hoffen nicht auf deine Treue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Scheol“; gemeint ist das Reich der Toten, nicht nur ein Grab.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warten nicht auf deine Wahrheit“. Das Hebräische kann erwartungsvolles Warten oder Hoffen und sowohl „Wahrheit“ als auch „Treue“ ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: das Totenreich
  rationale: Das hebräische Wort bezeichnet den Bereich der Toten und nicht lediglich eine einzelne Grabstätte. „Totenreich“ gibt den Begriff im modernen Deutschen verständlich wieder; „Scheol“ bleibt als Alternative in der Fußnote erhalten.
- source_word: תּוֹדֶךָּ
  choice: dankt dir
  rationale: Die Hifil-Form von ידה kann „danken“ beziehungsweise „preisen“ bedeuten. „Dankt dir“ wahrt gegenüber dem parallelen „lobt dich“ die Unterscheidung der beiden Verben.
- source_word: מָוֶת
  choice: der Tod
  rationale: Die direkte Wiedergabe erhält die poetische Personifikation und die Parallele zum Totenreich.
- source_word: יְהַלְלֶךָּ
  choice: lobt dich
  rationale: הלל im Piel bedeutet regelmäßig „loben“ oder „preisen“; „lobt dich“ ist hier natürlich und präzise.
- source_word: יְשַׂבְּרוּ
  choice: hoffen ... auf
  rationale: Das Verb bezeichnet erwartungsvolles Warten oder Hoffen. „Auf deine Treue hoffen“ ist idiomatisches Deutsch und lässt den Erwartungscharakter erkennen.
- source_word: יוֹרְדֵי בוֹר
  choice: die in die Grube hinabsteigen
  rationale: Die substantivierte Partizipialkonstruktion wird als laufender beziehungsweise charakteristischer Vorgang wiedergegeben und bewahrt das konkrete poetische Bild.
- source_word: בּוֹר
  choice: die Grube
  rationale: „Grube“ erhält das hebräische Todesbild, ohne es vorschnell mit „Grab“ oder „Totenreich“ gleichzusetzen.
- source_word: אֲמִתֶּךָ
  choice: deine Treue
  rationale: אֱמֶת umfasst Wahrheit, Verlässlichkeit und Treue. In Verbindung mit erwartungsvollem Hoffen bezeichnet „Treue“ Gottes Verlässlichkeit besonders natürlich, während „Wahrheit“ als echte Alternative vermerkt wird.
theological_decisions:
- issue: Aussage über die Toten und den Lobpreis Gottes
  choice: Der Vers bleibt als poetische Aussage stehen, dass das Totenreich und die Toten Gott nicht danken und loben und nicht auf seine Treue hoffen.
  alternative: Den Vers ausdrücklich als umfassende ontologische Lehre über Bewusstsein oder Gottesbeziehung der Toten zu formulieren; oder ihn ausdrücklich nur auf den öffentlichen Gottesdienst der Lebenden zu beschränken.
  rationale: Der hebräische Text beschreibt den Gegensatz zwischen Tod und lebendigem Gotteslob, legt aber keine vollständige Lehre über den Zwischenzustand dar. Die Übersetzung bewahrt diese Spannung und fügt keine dogmatische Klärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die Satzstellung bleibt gut verständlich, und die Bilder „Totenreich“, „Tod“ und „Grube“ werden nicht harmonisiert.
