  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
translation:
  language: de
  text: 'Und dies ist für dich das Zeichen von Jahwe: Jahwe wird das[a] tun, was er gesagt hat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diese Sache“; das hebräische Wort kann auch „Wort“ oder „Angelegenheit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Und dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen führt die Zeichenankündigung als Fortsetzung des vorherigen Wortes ein. Das im Hebräischen elliptische Prädikat wird im Deutschen natürlich mit „ist“ ergänzt.
- source_word: לְּךָ
  choice: für dich
  rationale: Die Präposition ל mit Suffix bezeichnet Hiskia als Empfänger des Zeichens; „für dich“ ist im Deutschen bei einem bestätigenden Zeichen idiomatisch.
- source_word: הָאוֹת
  choice: das Zeichen
  rationale: Der Artikel weist auf das konkrete bestätigende Zeichen hin; „Zeichen“ entspricht dem prophetischen Kontext.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet hier den Ursprung des Zeichens. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: Jahwe wird … tun
  rationale: Der Relativsatz erläutert, was das Zeichen bestätigt. Die finite Zukunftsform gibt den noch ausstehenden Vollzug natürlich wieder.
- source_word: אֶת הַדָּבָר הַזֶּה אֲשֶׁר דִּבֵּר
  choice: das tun, was er gesagt hat
  rationale: Diese Formulierung bildet den Zusammenhang von angekündigtem Wort und künftigem Handeln natürlich ab, ohne דָּבָר einseitig auf „Sache“ oder „Wort“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlichem Reden und Handeln
  choice: „das tun, was er gesagt hat“
  alternative: „diese Sache tun, von der er gesprochen hat“
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen דָּבָר als Wort beziehungsweise Angelegenheit und dessen tatsächlichem Vollzug, ohne das Gesagte ausdrücklich als „Verheißung“ zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng am hebräischen Aufbau, vermeidet jedoch die im Deutschen schwerfällige Wendung „eine Sache tun, die er gesprochen hat“. Der abschließende Doppelpunkt bleibt erhalten, weil der Vers in die folgende Beschreibung des Zeichens überleitet.
