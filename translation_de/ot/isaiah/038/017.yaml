language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: de
  text: Siehe, zu meinem Heil wurde mir bitteres Leid. Doch du hast mein Leben vor der Grube der Vernichtung bewahrt[a], denn du hast alle meine Sünden hinter deinen Rücken geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast aus Liebe mein Leben der Grube der Vernichtung entrissen.“ Das hebräische Verb kann starke Zuneigung, Liebe oder enge Verbundenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: zu meinem Heil
  rationale: שָׁלוֹם bezeichnet hier Frieden, Wohlergehen und Unversehrtheit. „Zu meinem Heil“ bewahrt die Ziel- bzw. Ergebnisperspektive der Präposition לְ und gibt die paradoxe Aussage im Deutschen natürlich wieder.
- source_word: מַר לִי מָר
  choice: wurde mir bitteres Leid
  rationale: Die Wiederholung des Wortstamms für „bitter“ verstärkt die Aussage. „Bitteres Leid“ bildet diese Intensität idiomatisch ab, ohne eine im Deutschen schwer verständliche Verdopplung zu erzwingen.
- source_word: חָשַׁקְתָּ
  choice: hast ... bewahrt
  rationale: Das Verb bezeichnet eigentlich eine starke Bindung, Zuneigung oder Liebe. Im Zusammenhang mit der Grube drückt es eine liebevolle Hinwendung aus, die zur Rettung führt. Die Hauptfassung nennt die kontextuelle Wirkung; die lexikalische Liebeskomponente wird in der Fußnote offengehalten.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ kann „Seele“, „Leben“ oder die ganze Person bezeichnen. Da hier die Bewahrung vor dem Tod im Blick ist, ist „mein Leben“ im modernen Deutschen klar und kontextgerecht.
- source_word: מִשַּׁחַת בְּלִי
  choice: vor der Grube der Vernichtung
  rationale: שַׁחַת bewahrt das konkrete Bild der Grube und kann zugleich Verderben bzw. Untergang bezeichnen; בְּלִי verstärkt den Gedanken völliger Vernichtung.
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: hast ... hinter deinen Rücken geworfen
  rationale: Die anschauliche hebräische Wendung bezeichnet das entschiedene Entfernen aus dem Blick und der Beachtung. Das Bild lässt sich im Deutschen verständlich bewahren.
- source_word: חֲטָאַי
  choice: alle meine Sünden
  rationale: Der Plural von חֵטְא bezeichnet hier direkt die Sünden; „Sünden“ ist die klare und theologisch nicht einengende Wiedergabe.
theological_decisions:
- issue: Ob חָשַׁקְתָּ נַפְשִׁי vor allem Gottes Liebe oder die daraus folgende Rettung bezeichnet
  choice: Die Hauptfassung hebt die Bewahrung des Lebens vor der Vernichtung hervor.
  alternative: „Du hast aus Liebe mein Leben der Grube der Vernichtung entrissen.“
  rationale: Das Verb selbst trägt die Bedeutung starker Zuneigung oder Bindung, während der Satzkontext die Rettung aus Todesgefahr beschreibt. Die Übersetzung macht die Rettungswirkung deutlich, ohne die mögliche Liebesbedeutung zu verlieren; diese bleibt in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Aufforderung „Siehe“ sowie die Bilder von der Grube und vom Hinter-den-Rücken-Werfen bleiben erhalten. Die schwer nachzubildende hebräische Bitterkeitsverstärkung wird idiomatisch als „bitteres Leid“ wiedergegeben.
