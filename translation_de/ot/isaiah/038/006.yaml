source:
  edition: WLC
  text: וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִ֖י עַל הָ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
translation:
  language: de
  text: Und ich werde dich und diese Stadt aus der Hand des Königs von Assyrien[a] retten, und ich werde diese Stadt beschützen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Hand des Königs von Assyrien“; gemeint ist: aus seiner Gewalt.'
    reason: Die Fußnote erläutert das beibehaltene hebräische Sprachbild.
lexical_decisions:
- source_word: מִכַּף
  choice: aus der Hand
  rationale: Die konkrete hebräische Wendung bezeichnet die Macht oder Gewalt eines Herrschers. „Aus der Hand“ ist im Deutschen verständlich und bewahrt zugleich das Bild des Ausgangstextes.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Die Genitivverbindung bezeichnet den assyrischen König; diese Wiedergabe ist natürlich und eindeutig.
- source_word: אַצִּילְךָ
  choice: ich werde dich … retten
  rationale: Der Hifil von נצל bezeichnet das Herausreißen beziehungsweise Retten aus einer konkreten Gefahr. „Retten“ passt zum militärisch-historischen Zusammenhang und ist im modernen Deutsch natürlich.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: und diese Stadt
  rationale: Der Demonstrativausdruck verweist unmittelbar auf die betreffende Stadt, ohne zusätzliche Hervorhebung.
- source_word: וְגַנּוֹתִי
  choice: ich werde … beschützen
  rationale: גנן bedeutet hier schützend für die Stadt einzutreten. „Beschützen“ gibt die aktive Bewahrung natürlich wieder; „verteidigen“ wäre ebenfalls möglich.
- source_word: עַל הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: In Verbindung mit גנן bezeichnet עַל das schützende Handeln über beziehungsweise zugunsten der Stadt. Im Deutschen verlangt „beschützen“ kein eigenes Äquivalent für die Präposition.
theological_decisions:
- issue: Göttliche Rettung in einem historisch-militärischen Zusammenhang
  choice: „retten“ als Befreiung Hiskias und Jerusalems aus der Gewalt Assyriens
  alternative: „befreien“ oder „erretten“
  rationale: Der Vers spricht von konkreter Bewahrung vor einem feindlichen König. „Retten“ wahrt diese Aussage, ohne eine darüber hinausgehende heilsgeschichtliche Bedeutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, bleibt aber gut verständlich. Das wiederholte „diese Stadt“ wird als bewusste Wiederholung des Ausgangstextes beibehalten.
