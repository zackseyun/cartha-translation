source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר חִזְקִיָּ֖הוּ מָ֣ה א֑וֹת כִּ֥י אֶעֱלֶ֖ה בֵּ֥ית יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: de
  text: 'Und Hiskia sagte[a]: »Was ist das Zeichen dafür, dass ich zum Haus Jahwes hinaufgehen werde?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Welches Zeichen gibt es dafür, dass ich zum Haus Jahwes hinaufgehen werde?«'
    reason: Die artikellose hebräische Wendung מָה אוֹת kann entweder nach dem bestimmten erwarteten Zeichen fragen oder allgemeiner danach, welches Zeichen es dafür gibt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. »Und … sagte« bewahrt die schlichte Abfolge, ohne den Zusammenhang stärker als nötig auszudeuten.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: »Hiskia« ist die geläufige deutsche Form des hebräischen Namens.
- source_word: מָה
  choice: Was
  rationale: Das Fragewort verlangt hier nach der Bestimmung des Zeichens; »Was« gibt dies direkt wieder.
- source_word: אוֹת
  choice: das Zeichen
  rationale: אוֹת bezeichnet ein bestätigendes Zeichen. Obwohl das hebräische Substantiv keinen Artikel trägt, ist im Kontext ein bestimmtes, erwartetes Zeichen gemeint; im Deutschen ist daher »das Zeichen« idiomatisch.
- source_word: כִּי
  choice: dafür, dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was durch das Zeichen bestätigt werden soll. Die deutsche Fügung »Zeichen dafür, dass« gibt diesen Zusammenhang natürlich und präzise wieder.
- source_word: אֶעֱלֶה
  choice: ich … hinaufgehen werde
  rationale: Das Qal-Imperfekt weist hier auf Hiskias erwarteten künftigen Gang hin. »Hinaufgehen« bewahrt sowohl die räumliche Bedeutung als auch die übliche Redeweise für den Gang zum Heiligtum.
- source_word: בֵּית יְהוָה
  choice: zum Haus Jahwes
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Wendung für den Tempel und klingt im Deutschen dennoch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, die im Deutschen geläufige Form des Tetragramms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus Jahwes« hält die Bildsprache des Hebräischen fest; »hinaufgehen« bewahrt den traditionellen und räumlichen Ausdruck, ohne durch das erklärende Wort »Tempel« zu paraphrasieren.
