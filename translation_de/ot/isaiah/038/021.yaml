  text: Isaiah had said[a], “Let them take a cake of figs and spread it on the boil, so that he may recover.”
translation:
  language: de
  text: 'Jesaja hatte gesagt: „Man soll einen Feigenkuchen holen und ihn auf das Geschwür streichen, damit er gesund wird[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „damit er lebt“. Das hebräische Verb „leben“ kann hier im Zusammenhang das Genesen von einer Krankheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: hatte gesagt
  rationale: Der Wayyiqtol bedeutet der Form nach „und er sagte“. Da der Vers im Zusammenhang eine zuvor erteilte Anweisung nachträgt, gibt das Plusquamperfekt die zeitliche Einordnung im Deutschen natürlich wieder.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Gebräuchliche deutsche Namensform des Propheten.
- source_word: יִשְׂאוּ
  choice: Man soll … holen
  rationale: נשׂא kann „heben“, „tragen“, „nehmen“ oder „herbeibringen“ bedeuten. Im Zusammenhang der Zubereitung eines Heilmittels ist „holen“ idiomatisch; das unbestimmte „man“ gibt die nicht näher bezeichneten Handelnden wieder.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: einen Feigenkuchen
  rationale: Die Verbindung bezeichnet eine gepresste Masse aus Feigen; „Feigenkuchen“ ist im Deutschen knapp und verständlich.
- source_word: וְיִמְרְחוּ
  choice: und ihn … streichen
  rationale: מרח bezeichnet das Verstreichen oder Auftragen einer Substanz. Das im Hebräischen mitgedachte Objekt wird im Deutschen durch „ihn“ aufgenommen.
- source_word: עַל הַשְּׁחִין
  choice: auf das Geschwür
  rationale: שְׁחִין bezeichnet eine entzündete Hautschwellung, ein Geschwür oder eine Eiterbeule. „Geschwür“ ist eine klare, würdige und im Kontext passende Wiedergabe.
- source_word: וְיֶחִי
  choice: damit er wieder gesund wird
  rationale: חיה bedeutet wörtlich „leben“, kann im Zusammenhang einer schweren Krankheit jedoch die Genesung beziehungsweise das Erhalten des Lebens bezeichnen. Die Übersetzung gibt hier den kontextuellen Sinn wieder und dokumentiert die wörtliche Alternative in einer Fußnote.
theological_decisions:
- issue: Verhältnis des Heilmittels zur angekündigten Heilung
  choice: Die Anweisung wird ohne Erklärung ihrer medizinischen oder theologischen Wirkweise wiedergegeben.
  alternative: Den Feigenkuchen ausdrücklich als bloßes Mittel oder als wundertätige Ursache deuten.
  rationale: Der hebräische Text nennt die Anwendung und die erwartete Genesung, legt aber ihr genaues Verhältnis nicht aus. Diese Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Das Plusquamperfekt kennzeichnet den Vers als nachgetragene Hintergrundinformation. Die unbestimmte dritte Person Plural wird idiomatisch mit „man“ wiedergegeben.
