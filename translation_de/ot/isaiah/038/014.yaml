source:
  edition: WLC
  text: כְּ/ס֤וּס עָגוּר֙ כֵּ֣ן אֲצַפְצֵ֔ף אֶהְגֶּ֖ה כַּ/יּוֹנָ֑ה דַּלּ֤וּ עֵינַ/י֙ לַ/מָּר֔וֹם אֲדֹנָ֖/י עָֽשְׁקָה לִּ֥/י עָרְבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: de
  text: Wie ein Mauersegler oder ein Kranich[a], so zwitschere ich; ich stöhne wie eine Taube. Meine Augen werden schwach vom Blick nach oben. Herr, ich bin bedrängt; verbürge dich für mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach traditioneller Bestimmung: „Wie eine Schwalbe oder ein Kranich.“ Der erste Vogelname ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: Wie ein Mauersegler oder ein Kranich
  rationale: Die beiden Vogelnamen, besonders סוּס, sind zoologisch unsicher. „Mauersegler“ gibt eine verbreitete neuere Bestimmung wieder; „oder“ macht kenntlich, dass die genaue Zuordnung der dicht nebeneinanderstehenden Bezeichnungen unsicher ist, ohne eine nicht belegte Sicherheit vorzutäuschen.
- source_word: אֲצַפְצֵף
  choice: so zwitschere ich
  rationale: Das Verb bezeichnet einen hohen, vogelartigen Laut. „Zwitschern“ ist im modernen Deutschen natürlich und erhält den Vergleich mit den Vögeln.
- source_word: אֶהְגֶּה
  choice: ich stöhne
  rationale: Das Verb kann ein leises, dumpfes Äußern, Murmeln oder Klagen bezeichnen. Im Zusammenhang des Leidens gibt „stöhnen“ den klagenden Laut treffend wieder.
- source_word: כַּיּוֹנָה
  choice: wie eine Taube
  rationale: Der direkte Vergleich bleibt erhalten; das klagende Gurren der Taube entspricht dem Zusammenhang.
- source_word: דַּלּוּ עֵינַי
  choice: Meine Augen werden schwach
  rationale: Die Wendung beschreibt Augen, die durch angestrengtes Schauen ermüden oder versagen. Die deutsche Formulierung bewahrt das körperliche Bild und ist gut verständlich.
- source_word: לַמָּרוֹם
  choice: vom Blick nach oben
  rationale: Wörtlich ist die Blickrichtung „zur Höhe“ beziehungsweise „nach oben“. Die Wiedergabe vermeidet es, ausdrücklich „Himmel“ einzusetzen, wo der hebräische Text allgemeiner formuliert.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Hier steht der göttliche Titel אֲדֹנָי in direkter Anrede, nicht der Gottesname JHWH. Daher wird er als „Herr“ wiedergegeben.
- source_word: עָשְׁקָה לִּי
  choice: ich bin bedrängt
  rationale: Die knappe, schwierige Wendung beruht auf der Wurzel עשׁק, die Unterdrückung, Bedrängnis oder widerfahrenes Unrecht bezeichnet. „Ich bin bedrängt“ gibt den Charakter der Klage natürlich wieder.
- source_word: עָרְבֵנִי
  choice: steh für mich ein
  rationale: Das Verb entstammt dem Rechts- und Bürgschaftsbereich und fordert dazu auf, für jemanden einzutreten beziehungsweise sich für ihn zu verbürgen. „Steh für mich ein“ ist modernes, verständliches Deutsch und bewahrt den relationalen Kern des Bildes.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי
  choice: Herr
  alternative: mein Herr
  rationale: Der Text verwendet einen göttlichen Titel in direkter Anrede. „Herr“ übersetzt diesen Titel, ohne ihn mit der besonderen Wiedergabe des Gottesnamens JHWH zu verwechseln.
- issue: Unsichere Bestimmung der Vögel in כְּסוּס עָגוּר
  choice: Wie ein Mauersegler oder ein Kranich
  alternative: Wie eine Schwalbe oder ein Kranich
  rationale: Die Identifizierung insbesondere des ersten Vogelnamens ist unsicher. Der Haupttext folgt einer verbreiteten neueren Bestimmung, während die traditionelle Identifizierung in der Fußnote erhalten bleibt; damit wird die echte lexikalische Ungewissheit nicht verdeckt.
- issue: Rechtliches Bild in עָרְבֵנִי
  choice: steh für mich ein
  alternative: verbürge dich für mich
  rationale: Die gewählte Formulierung erhält Gottes erbetenes Eintreten für den Beter, ohne das Bild auf bloß allgemeine Hilfe zu reduzieren. Die Alternative bildet den juristischen Wortlaut enger ab, klingt im heutigen Deutschen jedoch weniger natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Lautbilder der Vögel und der Klage bleiben konkret; zugleich werden die knappen hebräischen Aussagen nicht unnötig erklärt. Der Schluss ist als dringende direkte Bitte formuliert.
