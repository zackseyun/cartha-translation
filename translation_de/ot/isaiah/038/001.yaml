source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּב֣וֹא אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: de
  text: 'In jenen Tagen wurde Hiskia todkrank[a]. Da kam der Prophet Jesaja, der Sohn des Amoz, zu ihm und sagte zu ihm: »So spricht Jahwe: Bring dein Haus in Ordnung, denn du wirst sterben und nicht am Leben bleiben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wurde krank zum Sterben«; die hebräische Wendung bezeichnet eine Krankheit, die zum Tod führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Bewahrt die übliche hebräische Zeitformel und ihre erzählerische Verknüpfung in natürlichem Deutsch.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: wurde Hiskia todkrank
  rationale: Gibt das Eintreten der Krankheit und ihre tödliche Schwere knapp und idiomatisch wieder; die Fußnote macht die wörtlichere Konstruktion sichtbar.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: der Prophet Jesaja, der Sohn des Amoz
  rationale: Bewahrt Namen, Abstammungsangabe und prophetischen Titel in einer natürlichen deutschen Apposition.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Entspricht der feierlichen prophetischen Botenformel; der Gottesname wird als Jahwe wiedergegeben.
- source_word: צַו לְבֵיתֶךָ
  choice: Bring dein Haus in Ordnung
  rationale: Die idiomatische deutsche Wendung vermittelt den Auftrag, Haushalt und persönliche Angelegenheiten angesichts des Todes zu ordnen, ohne den Bedeutungsumfang unnötig einzuengen.
- source_word: כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: denn du wirst sterben und nicht am Leben bleiben
  rationale: Gibt die sichere Ankündigung des bevorstehenden Todes direkt wieder und bewahrt den Nachdruck der beiden hebräischen Teilsätze.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; »Jahwe« gibt den Eigennamen im modernen deutschen Bibelregister wieder.
- issue: Aussagekraft von כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: sichere Ankündigung des bevorstehenden Todes
  alternative: »denn du bist tot« oder die stärker medizinisch deutende Formulierung »du wirst nicht genesen«
  rationale: Die prädikative Form bezeichnet im Kontext den sicher bevorstehenden Tod. Die Übersetzung vermeidet sowohl eine kontextwidrige gegenwärtige Todesaussage als auch die Einengung auf medizinische Genesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Botenformel bleibt feierlich; unnötige Archaismen werden vermieden.
