  terminology: »Hiskia«, »Jesaja«, »Amoz« und »Jahwe« sind sachgerecht. Die prophetische Formel und die Todesaussage sind angemessen wiedergegeben. Die Fußnote ist korrekt verankert und erläutert die wörtlichere hebräische Konstruktion, ohne eine konfessionelle Deutung einzutragen.
