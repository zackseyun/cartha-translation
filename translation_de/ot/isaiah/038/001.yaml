  source_fidelity: Die Übersetzung gibt die Zeitformel, das Eintreten der lebensbedrohlichen Krankheit, Jesajas Titel und Abstammung, die Botenformel, den Auftrag an das Haus sowie die doppelte, verbindliche Todesankündigung zuverlässig wieder. »todkrank« trifft die kontextuelle Bedeutung von חָלָה ... לָמוּת idiomatisch, ohne fälschlich zu behaupten, Hiskia sei bereits tot.
