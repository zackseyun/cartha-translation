  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Satzglieder vollständig wieder: זָרִים als „Fremde“, das ausdrücklich bildhafte וְעָמְדוּ als „werden dastehen“, רָעוּ צֹאנְכֶם als „eure Herden hüten“ sowie בְּנֵי־נֵכָר idiomatisch als „Menschen aus fremden Ländern“. Die Besitzsuffixe in „eure Herden“, „eure Bauern“ und „eure Winzer“ sind erhalten. Die soziale Asymmetrie des Orakels wird weder abgeschwächt noch über den Wortlaut hinaus gedeutet.'
