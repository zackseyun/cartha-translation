  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: de
  text: Fremde werden dastehen und eure Herden hüten,[a] und Menschen aus fremden Ländern[b] werden eure Bauern und eure Winzer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weiden“; bei „Herden“ kann besonders an Schafe und Ziegen gedacht sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne der Fremde“; eine hebräische Wendung für Menschen aus fremden Ländern oder Völkern.'
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  choice: Fremde
  rationale: Bezeichnet Menschen, die nicht zur angesprochenen Gemeinschaft gehören. „Fremde“ ist im Deutschen natürlich und bewahrt die soziale und ethnische Distanz, ohne den heute missverständlichen Ausdruck „Ausländer“ unnötig in den Vordergrund zu stellen.
- source_word: וְעָמְדוּ
  choice: werden dastehen
  rationale: Bewahrt das konkrete Bild des hebräischen Verbs „stehen“. Eine Erweiterung zu „bereitstehen“ wäre im Zusammenhang möglich, würde die dienende Funktion jedoch stärker ausdeuten als der Wortlaut.
- source_word: וְרָעוּ
  choice: hüten
  rationale: רעה bezeichnet das Weiden beziehungsweise Hüten von Kleinvieh. „Hüten“ verbindet sich im modernen Deutschen natürlich mit „Herden“ und umfasst mehr als nur das Füttern.
- source_word: צֹאנְכֶם
  choice: eure Herden
  rationale: Das Kollektiv bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Herden“ gibt den kollektiven Sinn natürlich wieder, ohne die Tierart enger festzulegen als der hebräische Ausdruck.
- source_word: בְנֵי נֵכָר
  choice: Menschen aus fremden Ländern
  rationale: Wörtlich steht „Söhne der Fremde/des Auslands“. Gemeint sind Angehörige fremder Völker; die gewählte Formulierung gibt diese idiomatische Bedeutung in natürlichem Deutsch wieder, während eine Fußnote die hebräische Bildform bewahrt.
- source_word: אִכָּרֵיכֶם
  choice: eure Bauern
  rationale: Der Ausdruck bezeichnet Menschen, die den Boden bearbeiten. „Bauern“ ist verständliches modernes Deutsch und weniger eng als „Pflüger“.
- source_word: כֹרְמֵיכֶם
  choice: eure Winzer
  rationale: Bezeichnet Arbeiter beziehungsweise Bewirtschafter von Weinbergen. „Winzer“ ist präzise, geläufig und vermeidet das schwerfällige „Weinbergarbeiter“.
theological_decisions:
- issue: Soziale Rollenumkehr in der Wiederherstellungsverheißung für Zion
  choice: Fremde übernehmen für die angesprochene Gemeinschaft Hirten- und landwirtschaftliche Arbeit.
  alternative: Ein verallgemeinertes Bild internationaler Zusammenarbeit oder eine rein sinnbildliche Aussage über Wohlstand.
  rationale: Der hebräische Wortlaut beschreibt ausdrücklich Fremde in diesen Arbeitsrollen. Die Übersetzung bewahrt diese Asymmetrie, ohne daraus über den Vers hinaus eine ekklesiologische oder gesellschaftspolitische Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche „dastehen“ erhält bewusst das konkrete hebräische Bild; die übrigen Formulierungen sind natürlich und allgemein verständlich. Die parallelen Tätigkeiten „Bauern“ und „Winzer“ bleiben knapp und anschaulich.
