source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: de
  text: Denn wie die Erde ihr Gewächs hervorbringt und wie ein Garten das, was in ihm gesät ist, sprießen lässt, so wird der Herr Jahwe Gerechtigkeit[a] und Lob vor allen Völkern sprießen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“. Das hebräische Wort kann hier auch öffentliche Rechtmäßigkeit oder Rechtfertigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende Gegenüberstellung zum vorherigen Zusammenhang ein und entspricht der kausal-erklärenden Funktion.
- source_word: כָאָרֶץ
  choice: wie die Erde
  rationale: Das Bild ist allgemein schöpfungsbezogen; „Erde“ passt daher besser als das territorial mögliche „Land“.
- source_word: תּוֹצִיא צִמְחָהּ
  choice: ihren Spross hervorbringt
  rationale: Bewahrt das konkrete Bild des Hervorkommens und gibt צֶמַח als das hervorwachsende Gewächs wieder.
- source_word: וּכְגַנָּה זֵרוּעֶיהָ תַצְמִיחַ
  choice: und wie ein Garten das, was in ihm gesät ist, sprießen lässt
  rationale: Gibt das pluralische Gesäte natürlich wieder und erhält die kausative Bedeutung des Hifil von צמח.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Gibt beide Bestandteile des Titels wieder, vermeidet die missverständliche Doppelung „Herr HERR“ und bewahrt den offenbarten Gottesnamen.
- source_word: יַצְמִיחַ
  choice: wird … sprießen lassen
  rationale: Nimmt dasselbe Verb aus dem Gartenbild wieder auf und bewahrt sowohl die rhetorische Entsprechung als auch die kausative Form.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Deckt die moralische und gemeinschaftliche Richtigkeit ab, ohne die im Kontext mögliche öffentliche Rechtfertigung oder Rechtsschaffung auszuschließen.
- source_word: וּתְהִלָּה
  choice: und Lob
  rationale: Entspricht der üblichen Bedeutung und bezeichnet hier wahrscheinlich das Lob, das Gottes rettendes Handeln hervorruft.
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: vor allen Völkern
  rationale: Gibt die öffentliche Sichtbarkeit des Geschehens gegenüber sämtlichen Nationen knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form unterscheidet אֲדֹנָי von יהוה und lässt den Eigennamen als solchen erkennbar, ohne beide Elemente zu verschmelzen.
- issue: Bedeutungsbreite von צְדָקָה im Wiederherstellungskontext
  choice: Gerechtigkeit
  alternative: Recht / Rechtfertigung
  rationale: „Gerechtigkeit“ wahrt die theologische und ethische Breite; die Fußnote macht deutlich, dass auch öffentliches Recht und Rechtfertigung mitschwingen können.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Spross-Metaphorik und die kausative Struktur des Hebräischen bleiben erhalten; der Satz folgt der parallelen Bildführung des Ausgangstextes.
