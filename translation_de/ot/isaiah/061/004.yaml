source:
  edition: WLC
  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: de
  text: Sie werden die uralten Trümmerstätten[a] wieder aufbauen, die früher verwüsteten Orte wiederherstellen; sie werden die zerstörten Städte erneuern, die seit Generationen verwüstet liegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Trümmerstätten aus alter Zeit“. Das hebräische Wort עוֹלָם kann hier ferne Vergangenheit oder lange Dauer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Verwüstungen von Generation zu Generation“. Auch möglich: „die Verwüstungen vieler Generationen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: sie werden … wieder aufbauen
  rationale: בנה bedeutet grundsätzlich „bauen“; angesichts der Trümmerstätten als Objekt gibt „wieder aufbauen“ die im Kontext enthaltene Wiederherstellung natürlich und präzise wieder.
- source_word: חָרְבוֹת עוֹלָם
  choice: die uralten Trümmerstätten
  rationale: חָרְבוֹת bezeichnet Ruinen bzw. verwüstete Orte; עוֹלָם verweist hier auf weit zurückliegende Zeit oder lange Dauer, nicht notwendig auf Ewigkeit.
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: die Verwüstungen früherer Zeiten
  rationale: שֹׁמְמוֹת kann verwüstete Orte oder den Zustand der Verwüstung bezeichnen; רִאשֹׁנִים ist hier zeitlich als „früher“ zu verstehen.
- source_word: יְקוֹמֵמוּ
  choice: wieder aufrichten
  rationale: Die Verbform von קום hat hier kausativ-restaurativen Sinn. „Wieder aufrichten“ bewahrt das konkrete Bild davon, dass Niedergelegtes erneut zum Stehen gebracht wird.
- source_word: וְחִדְּשׁוּ
  choice: sie werden … erneuern
  rationale: חדשׁ bedeutet „erneuern, wieder neu machen“. „Erneuern“ hält dieses Verb von den benachbarten Ausdrücken für Aufbauen und Aufrichten unterscheidbar.
- source_word: עָרֵי חֹרֶב
  choice: die zerstörten Städte
  rationale: Die Constructusverbindung bezeichnet Städte, die von Zerstörung bzw. Verwüstung geprägt sind. „Zerstörte Städte“ ist im modernen Deutschen klar und idiomatisch.
- source_word: שֹׁמְמוֹת דּוֹר וָדוֹר
  choice: die seit Generationen verwüstet liegen
  rationale: דּוֹר וָדוֹר drückt eine Abfolge von Generationen aus. Die Formulierung gibt die lange andauernde Verwüstung natürlich wieder; die wörtlichere Struktur wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederherstellungsbewegung „wieder aufbauen – wieder aufrichten – erneuern“ bewahrt die Variation des Hebräischen. „Trümmerstätten“ erfasst verwüstete Orte breiter als nur einzelne Gebäuderuinen; die zweite Satzhälfte wird zugunsten natürlicher deutscher Syntax als Relativkonstruktion wiedergegeben.
