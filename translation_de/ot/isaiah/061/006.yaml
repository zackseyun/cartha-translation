source:
  edition: WLC
  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: de
  text: 'Ihr aber werdet »Priester Jahwes« genannt werden; man wird euch sagen: »Ihr seid Diener unseres Gottes.« Ihr werdet den Reichtum der Völker verzehren und euch ihres Glanzes rühmen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und euch an ihrer Herrlichkeit erfreuen«. Das letzte hebräische Verb ist selten und in seiner genauen Bedeutung umstritten; möglich sind unter anderem »sich rühmen«, »frohlocken« oder »sich hervortun«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Das vorangestellte Pronomen hebt die Angesprochenen kontrastiv hervor; »Ihr aber« gibt diesen Gegensatz natürlich wieder.
- source_word: כֹּהֲנֵי יְהוָה
  choice: Priester Jahwes
  rationale: Die deutsche Genitivfügung bewahrt die Konstruktion und gibt den Gottesnamen transparent als »Jahwe« wieder.
- source_word: תִּקָּרֵאוּ
  choice: werdet … genannt werden
  rationale: Das Nifal bezeichnet hier eine öffentliche Benennung; die passive Form bleibt erhalten.
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: Diener unseres Gottes
  rationale: מְשָׁרְתִים bezeichnet amtlich oder kultisch Dienende. »Diener« ist im Deutschen verständlich und vermeidet die mögliche Verengung von »Minister« auf ein modernes Staatsamt.
- source_word: יֵאָמֵר לָכֶם
  choice: wird man zu euch sagen
  rationale: Die unpersönliche Aussageform wird mit deutschem »man« wiedergegeben und bewahrt gegenüber einer bloßen zweiten Benennung die Form des Sagens.
- source_word: חֵיל גּוֹיִם
  choice: den Reichtum der Völker
  rationale: חֵיל kann Kraft, Vermögen oder Reichtum bezeichnen; in Verbindung mit »verzehren« liegt hier der materielle Reichtum beziehungsweise Ertrag nahe.
- source_word: תֹּאכֵלוּ
  choice: werdet … verzehren
  rationale: Die konkrete Bildsprache des Essens bleibt erhalten; »verzehren« klingt im Kontext natürlicher als das schlichte »essen«.
- source_word: וּבִכְבוֹדָם
  choice: ihres Glanzes
  rationale: כָּבוֹד kann Herrlichkeit, Ehre, Gewicht oder Glanz bedeuten. »Glanz« passt zu den Völkern und lässt die genaue Art ihres Ansehens offen.
- source_word: תִּתְיַמָּרוּ
  choice: euch … rühmen
  rationale: Das seltene Hitpael wird häufig als sich rühmen oder sich hervortun verstanden. Die gewählte Wendung ist idiomatisch, während die Unsicherheit in der Fußnote offengelegt wird.
theological_decisions:
- issue: Bezug der priesterlichen Bezeichnung
  choice: Die direkte prophetische Anrede und die ausdrücklichen kultischen Titel bleiben erhalten.
  alternative: Die Aussage allgemein als geistlichen Dienst ohne priesterliche Sprache wiederzugeben.
  rationale: Der hebräische Text nennt die Angesprochenen ausdrücklich »Priester Jahwes« und »Diener unseres Gottes«; eine Spiritualisierung oder spätere kirchliche Zuordnung wäre interpretierend.
- issue: Verhältnis der Angesprochenen zu den Völkern
  choice: Die Aussagen über den Reichtum und Glanz der Völker werden ohne abschwächende oder moralisierende Deutung übersetzt.
  alternative: Die Wendungen rein geistlich zu deuten oder durch erklärende Zusätze ethisch umzurahmen.
  rationale: Der Vers lässt die Spannung seiner Zukunftsaussage stehen und bezeichnet zunächst die Teilhabe an Reichtum und Glanz der Völker.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen öffentlichen Benennungen werden durch Anführungszeichen kenntlich gemacht. »Jahwe« gibt den Gottesnamen wieder; »Diener« wahrt den kultischen Zusammenhang, ohne an ein modernes politisches Amt denken zu lassen.
