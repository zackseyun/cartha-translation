  text: לִ/קְרֹ֤א שְׁנַת רָצוֹן֙ לַֽ/יהוָ֔ה וְ/י֥וֹם נָקָ֖ם לֵ/אלֹהֵ֑י/נוּ לְ/נַחֵ֖ם כָּל אֲבֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: de
  text: um das Jahr der Gunst Jahwes und den Tag der Vergeltung unseres Gottes auszurufen und alle Trauernden zu trösten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרֹא
  choice: auszurufen
  rationale: Der Infinitiv bezeichnet hier das öffentliche, feierliche Bekanntmachen; „ausrufen“ gibt diesen Heroldssinn natürlich und prägnant wieder.
- source_word: שְׁנַת רָצוֹן
  choice: das Jahr der Gunst
  rationale: רָצוֹן bezeichnet hier Gottes wohlwollende Zuwendung beziehungsweise Annahme. „Gunst“ bewahrt die relationale Bedeutung und vermeidet die missverständliche Formulierung „angenehmes Jahr“.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: Das ל kennzeichnet in der Verbindung die Zuordnung der Gunst zu Jahwe. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְיוֹם נָקָם
  choice: und den Tag der Vergeltung
  rationale: נָקָם meint göttliche Ahndung beziehungsweise Vergeltung. „Vergeltung“ erhält die Schärfe des Ausdrucks, ohne eigenmächtige menschliche Rache nahezulegen.
- source_word: לֵאלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Genitivform gibt die durch ל ausgedrückte Beziehung idiomatisch wieder und bewahrt das gemeinschaftliche „unser“.
- source_word: לְנַחֵם
  choice: um … zu trösten
  rationale: Der zweite Infinitiv bezeichnet einen weiteren Zweck der Sendung. „trösten“ ist die direkte und kontextgerechte Wiedergabe von נחם.
- source_word: כָּל אֲבֵלִים
  choice: alle Trauernden
  rationale: Die substantivisch gebrauchte Pluralform bezeichnet umfassend alle Menschen, die trauern. „alle Trauernden“ ist knapp, natürlich und geschlechtsübergreifend verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Spannung zwischen Gunst und Vergeltung
  choice: Beide Aussagen ungemildert und gleichgeordnet beibehalten
  alternative: נָקָם abschwächend als „Gericht“ wiedergeben oder die Vergeltung der Trostaussage unterordnen
  rationale: Der Vers stellt das Jahr göttlicher Gunst und den Tag göttlicher Vergeltung bewusst nebeneinander. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Bestimmtheit von יוֹם נָקָם
  choice: den Tag der Vergeltung
  alternative: einen Tag der Vergeltung
  rationale: Obwohl im Hebräischen kein Artikel steht, wird das nomen regens einer bestimmten Genitivverbindung semantisch bestimmt; zudem entspricht die Formulierung der parallelen Struktur mit „das Jahr“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die infinitivische Satzfortsetzung des vorangehenden Verses bleibt erhalten. „Jahwe“ folgt der expliziten Wiedergabe des Tetragrammatons; „Vergeltung“ wahrt das Gewicht von נָקָם. Keine Fußnote ist nötig, da die vertretbaren Alternativen den Sinn nicht so wesentlich verändern, dass sie im Lesetext dokumentiert werden müssen.
