  source_fidelity: Der Text gibt den masoretischen Text sachgerecht wieder. »das Recht« entspricht מִשְׁפָּט im ethisch-sozialen Kontext. »Raub beim Brandopfer« hält die schwierige Verbindung גָזֵל בְּעוֹלָה bewusst offen und folgt der Vokalisierung »Brandopfer«, ohne die abweichende Deutung »Unrecht« in den Haupttext einzutragen. »Ihren Lohn ... in Treue geben« gibt פְּעֻלָּתָם und בֶּאֱמֶת im Kontext angemessen wieder. »einen ewigen Bund ... schließen« ist die idiomatische deutsche Entsprechung von כרת ברית und wird korrekt erläutert.
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. Die Satzgliederung ist klar; insbesondere ist die Voranstellung von »Ihren Lohn« im Deutschen natürlich. »JHWH« und »einen Bund schließen« passen zum gewählten bibelsprachlichen Register.
