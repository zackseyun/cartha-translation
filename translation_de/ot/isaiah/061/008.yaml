id: ISA.61.8
reference: Isaiah 61:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: de
  text: Denn ich, JHWH, liebe das Recht; ich hasse Raub beim Brandopfer[a]. Ihren Lohn[b] werde ich ihnen in Treue geben, und einen ewigen Bund werde ich mit ihnen schließen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwierig. Möglich sind auch »Raub im Brandopfer« oder »Raub für ein Brandopfer«; gemeint sein könnten geraubte Güter, die als Opfer dargebracht werden, oder allgemeiner die Verbindung von Unrecht und Gottesdienst. Manche deuten das Wort abweichend als »Unrecht«.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »ihre Belohnung«, »ihren Verdienst« beziehungsweise »ihren Arbeitslohn«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich lautet die hebräische Redewendung: »einen Bund schneiden«, das heißt: einen Bund schließen.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Die Wiedergabe mit dem in deutschen Bibeln geläufigen Tetragramm bewahrt den persönlichen Gottesnamen, ohne eine unsichere Aussprache festzuschreiben.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im Gegensatz zu Raub bezeichnet das Wort hier die gerechte, rechte Ordnung; »das Recht« ist im Deutschen prägnant und idiomatisch.
- source_word: גָזֵל
  choice: Raub
  rationale: Das Substantiv bezeichnet widerrechtlich oder gewaltsam angeeignetes Gut beziehungsweise den Akt des Raubens; »Raub« bewahrt diese Kürze und Schärfe.
- source_word: בְּעוֹלָה
  choice: beim Brandopfer
  rationale: Der masoretisch vokalisierte Text bezeichnet ein Brandopfer. »Beim« lässt die genaue Beziehung zwischen Raub und Opfer bewusst offen und bleibt im Deutschen verständlich.
- source_word: פְעֻלָּתָם
  choice: ihren Lohn
  rationale: Im Kontext der göttlichen Vergeltung bezeichnet das Wort das ihnen zukommende Entgelt beziehungsweise die Belohnung; »Lohn« wahrt diese Bedeutungsbreite.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: Die Wendung beschreibt Gottes verlässliches, wahrhaftiges Handeln und passt zum anschließenden Bund.
- source_word: בְּרִית עוֹלָם
  choice: einen ewigen Bund
  rationale: Dies ist die natürliche deutsche Wiedergabe der festen hebräischen Bundesformel.
- source_word: אֶכְרֹת
  choice: werde ich … schließen
  rationale: Hebräisch steht wörtlich »einen Bund schneiden«; Deutsch verwendet dafür idiomatisch »einen Bund schließen«. Die Bildlichkeit des Hebräischen wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Deutung von גָזֵל בְּעוֹלָה
  choice: Raub beim Brandopfer
  alternative: 'Raub im Brandopfer; Raub für ein Brandopfer; nach abweichender Deutung: Raub mit Unrecht'
  rationale: Die masoretische Vokalisierung spricht für »Brandopfer«, doch die Präposition lässt das genaue Verhältnis offen. Die Übersetzung wahrt diese Spannung und vermeidet es, עוֹלָה stillschweigend wie ein Wort für »Unrecht« zu behandeln.
- issue: Bedeutung von פְעֻלָּתָם
  choice: ihren Lohn
  alternative: ihre Belohnung; ihren Verdienst; ihr Werk
  rationale: Der Zusammenhang handelt von Gottes verlässlicher Zuwendung an Zions Volk. »Lohn« kann sowohl zustehende Vergeltung als auch Belohnung bezeichnen, ohne die Aussage enger festzulegen.
- issue: Wiedergabe der Bundesformel כרת ברית
  choice: einen Bund schließen
  alternative: einen Bund schneiden
  rationale: Die wörtliche hebräische Wendung ist im Deutschen nicht idiomatisch. Die gebräuchliche deutsche Bundesformel gibt den Sinn klar wieder, während die Fußnote die konkrete hebräische Ausdrucksweise dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Kontrast, wird aber durch die Voranstellung von »Ihren Lohn« natürlich gegliedert. Die schwierige Opferwendung wird im Haupttext knapp und in der Fußnote transparent wiedergegeben.
