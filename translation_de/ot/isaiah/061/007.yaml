  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: de
  text: Anstelle eurer Schande[a] wird es einen doppelten Anteil geben; und anstelle der Entehrung werden sie über ihren Anteil jubeln.[b] Darum werden sie in ihrem Land einen doppelten Anteil erben.[c] Ewige Freude wird ihnen gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wechselt die Anrede nach »eurer Schande« zur dritten Person: »ihr Anteil«, »ihr Land«, »sie werden erben«. Manche Übersetzungen gleichen den ganzen Vers an »ihr/euer« an.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »werden sie über ihren Anteil singen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »werden sie einen doppelten Anteil besitzen« beziehungsweise »in Besitz nehmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: anstelle
  rationale: Die Präposition bezeichnet hier Austausch beziehungsweise Umkehrung, nicht eine räumliche Lage.
- source_word: בָּשְׁתְּכֶם
  choice: eurer Schande
  rationale: Die Endung der zweiten Person Plural wird bewahrt; »Schande« gibt den Gegensatz von erlittenem Ehrverlust und künftiger Wiederherstellung prägnant wieder.
- source_word: מִשְׁנֶה
  choice: einen doppelten Anteil
  rationale: Das Substantiv bezeichnet eine doppelte Menge oder Portion und trägt hier wahrscheinlich den Gedanken von Erbe und Wiederherstellung.
- source_word: כְלִמָּה
  choice: Entehrung
  rationale: Das Wort bezeichnet Schmach beziehungsweise öffentlich erfahrenen Ehrverlust. »Entehrung« unterscheidet es im Deutschen von der unmittelbar zuvor genannten »Schande«.
- source_word: יָרֹנּוּ
  choice: sie werden jubeln
  rationale: רנן bezeichnet einen hörbaren, freudigen Jubel. »Jubeln« ist natürlich, kraftvoll und lässt offen, ob es sich eher um Rufen oder Singen handelt.
- source_word: חֶלְקָם
  choice: ihren Anteil
  rationale: חֵלֶק bedeutet Anteil oder Teil und passt zum Motiv des doppelten Anteils.
- source_word: לָכֵן
  choice: darum
  rationale: Die Konjunktion kennzeichnet die folgende Aussage als Konsequenz der verheißenen Umkehrung.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: »Land« bewahrt sowohl den territorialen Sinn als auch den Wiederherstellungskontext.
- source_word: יִירָשׁוּ
  choice: in Besitz nehmen
  rationale: ירשׁ kann sowohl »erben« als auch »in Besitz nehmen« bedeuten. Die gewählte Formulierung ist mit dem doppelten Anteil als Objekt idiomatisch und hält die Besitzbedeutung fest.
- source_word: שִׂמְחַת עוֹלָם
  choice: ewige Freude
  rationale: Die Wortverbindung bezeichnet bleibende, fortdauernde Freude; »ewige Freude« ist knapp und würdevoll.
- source_word: תִּהְיֶה לָהֶם
  choice: wird ihnen gehören
  rationale: Die deutsche Besitzkonstruktion gibt die hebräische Wendung »wird für ihnen sein« natürlich wieder.
theological_decisions:
- issue: Wechsel von der zweiten Person Plural zu Formen der dritten Person Plural
  choice: 'Der Wechsel wird bewahrt: »eurer Schande« gefolgt von »sie/ihren/ihrem/ihnen«.'
  alternative: 'Alle Pronomen zur besseren Glätte an die zweite Person angleichen: »ihr/euer/euch«.'
  rationale: Der masoretische Text enthält diesen auffälligen Personenwechsel. Ihn beizubehalten wahrt die Textgestalt und vermeidet eine stillschweigende Harmonisierung.
- issue: Erb- oder Besitzbedeutung von יִירָשׁוּ
  choice: »in Besitz nehmen«
  alternative: »erben«
  rationale: Beide Bedeutungen sind lexikalisch möglich. Da der doppelte Anteil und nicht ausdrücklich das Land als Objekt erscheint, ist »in Besitz nehmen« im Deutschen flüssig, ohne den Erbgedanken auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Umkehrungen wird durch die Wiederholung von »anstelle« sichtbar gemacht. Der abrupte hebräische Personenwechsel bleibt erhalten und wird in einer Fußnote erläutert.
