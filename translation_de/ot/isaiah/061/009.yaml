base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: de
  text: Ihre Nachkommen werden unter den Nationen[a] bekannt sein und ihre Nachfahren inmitten der Völker; alle, die sie sehen, werden sie als Nachkommen erkennen, die Jahwe gesegnet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Völkern“; das hebräische Wort kann je nach Zusammenhang auch die nichtisraelitischen Völker bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: werden bekannt sein
  rationale: Das Nifal von ידע bezeichnet hier am natürlichsten den Zustand des Bekannt- bzw. Erkanntseins; die futurische Wiedergabe entspricht dem prophetischen Zusammenhang.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier die Nationen im internationalen Sinn. „Unter“ gibt die räumlich-soziale Bedeutung der Präposition idiomatisch wieder, ohne einen engeren Juden-Heiden-Gegensatz einzutragen.
- source_word: זַרְעָם
  choice: ihre Nachkommen
  rationale: זֶרַע ist ein kollektiver Ausdruck für leibliche Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich und bewahrt den kollektiven Sinn.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: ihre Abkömmlinge
  rationale: Der Ausdruck steht als nahes Synonym parallel zu זֶרַע. „Abkömmlinge“ erhält die lexikalische Variation und die genealogische Bedeutung.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: inmitten der Völker
  rationale: Die Formulierung bildet das wörtliche Bild von בְּתוֹךְ ab und wahrt die poetische Parallele zu „unter den Nationen“.
- source_word: כָּל רֹאֵיהֶם
  choice: alle, die sie sehen
  rationale: Die partizipiale Wendung wird im Deutschen natürlich als Relativsatz ausgedrückt.
- source_word: יַכִּירוּם
  choice: werden erkennen
  rationale: Das Hifil von נכר bedeutet „erkennen, wiedererkennen“. Im Deutschen kann der folgende dass-Satz unmittelbar den Inhalt des Erkennens angeben; das im Hebräischen vorhandene Objektsuffix ist durch den Bezug auf „sie“ semantisch mitgetragen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier am plausibelsten den Inhalt dessen ein, was die Betrachtenden erkennen.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Die Wiederholung von „Nachkommen“ bewahrt die lexikalische Verbindung zum ersten זֶרַע und gibt dessen kollektiven Sinn wieder.
- source_word: בֵּרַךְ
  choice: die … gesegnet hat
  rationale: Die masoretische Form בֵּרַךְ ist formal ein aktives Piel Perfekt („hat gesegnet“), nicht ein passives Partizip. Der Relativsatz gibt daher die hebräische Syntax genauer und zugleich natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Wer segnet die Nachkommen?
  choice: Nachkommen, die Jahwe gesegnet hat
  alternative: von Jahwe gesegnete Nachkommen
  rationale: Die aktive Verbform benennt Jahwe ausdrücklich als handelndes Subjekt. Die Übersetzung wahrt diese Aussage, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. „Abkömmlinge“ ist etwas gehobener, dient hier aber der Unterscheidung der beiden parallelen hebräischen Bezeichnungen. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen schwerfällig zu wirken.
