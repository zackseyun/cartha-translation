id: ISA.61.1
reference: Isaiah 61:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: de
  text: Der Geist des Herrn Yahweh ist auf mir, weil Yahweh mich gesalbt hat, den Gebeugten[a] gute Nachricht zu bringen. Er hat mich gesandt, die Menschen mit gebrochenem Herzen zu verbinden, den Gefangenen Freiheit auszurufen und den Gefesselten Öffnung zu verkünden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den Armen“, „den Demütigen“ oder „den Bedrängten“. Das hebräische עֲנָוִים kann soziale Not, Bedrängnis und demütige Haltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung פְּקַח־קוֹחַ ist schwierig. Möglich sind auch „Öffnung der Augen“ oder allgemeiner „Öffnung/Freilassung“ für die Gefesselten. Der hebräische Text nennt keinen Kerker ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֛וּחַ
  choice: Geist
  rationale: Im Zusammenhang mit dem göttlichen Titel und einer prophetischen Beauftragung bezeichnet das Wort Gottes Geist, nicht bloß Wind, Atem oder eine menschliche Gemütsverfassung.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrentitel אֲדֹנָי als auch den Gottesnamen יְהוִה und vermeidet eine Verschmelzung der beiden Bestandteile.
- source_word: עָלַי
  choice: ist auf mir
  rationale: Die knappe Formulierung bildet die hebräische Präposition in der Sprache prophetischer Bevollmächtigung unmittelbar und verständlich ab.
- source_word: יַעַן
  choice: weil
  rationale: Die Konjunktion leitet den Grund für die Gegenwart des Geistes und die anschließende Sendung ein.
- source_word: מָשַׁח
  choice: hat mich gesalbt
  rationale: Das Perfekt bezeichnet eine vollzogene Salbung mit fortdauernder Bedeutung; „salben“ erhält die konkrete Beauftragungs- und Königssprache, ohne ihre spätere theologische Deutung vorwegzunehmen.
- source_word: לְבַשֵּׂר
  choice: gute Nachricht zu bringen
  rationale: Die Wendung gibt den Sinn des Verkündens einer guten Botschaft natürlich wieder und vermeidet eine unnötige Einengung auf eine bestimmte Predigtform.
- source_word: עֲנָוִים
  choice: den Gebeugten
  rationale: „Gebeugte“ umfasst sozial Bedrängte und innerlich Demütige besser als eine ausschließlich wirtschaftliche oder charakterliche Bezeichnung; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: שְׁלָחַנִי
  choice: Er hat mich gesandt
  rationale: Das deutsche Perfekt entspricht dem abgeschlossenen Sendungsakt mit gegenwärtiger Wirkung und steht parallel zu „hat mich gesalbt“.
- source_word: לַחֲבֹשׁ
  choice: zu verbinden
  rationale: Das Verb bezeichnet ursprünglich das Verbinden einer Wunde. So bleibt das Heilungsbild erhalten, ohne es in eine allgemeinere Aussage aufzulösen.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: die, deren Herz zerbrochen ist
  rationale: Die Formulierung gibt das hebräische Bild verständlich und würdevoll wieder, ohne es zu einem feststehenden deutschen Etikett zu verdichten.
- source_word: לִקְרֹא
  choice: auszurufen
  rationale: Das Verb bezeichnet hier die öffentliche Bekanntmachung der Freilassung.
- source_word: לִשְׁבוּיִם
  choice: den Gefangenen
  rationale: Gemeint sind Menschen in Gefangenschaft; die Wiedergabe fügt sich in den Parallelismus mit den Gefesselten.
- source_word: דְּרוֹר
  choice: Freiheit
  rationale: Das Wort bezeichnet Freilassung beziehungsweise Freiheit und passt zur öffentlichen Ausrufung.
- source_word: פְּקַח־קוֹחַ
  choice: die Öffnung des Kerkers
  rationale: Die schwierige Wendung wird entsprechend dem unmittelbaren Parallelismus als Öffnung des Haftortes verstanden; da „Kerker“ nicht ausdrücklich im Hebräischen steht und auch eine andere Deutung möglich ist, wird dies in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im zusammengesetzten Titel אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Gott, der HERR; Herr JHWH
  rationale: „Herr Yahweh“ hält Titel und Eigenname auseinander und gibt beide Elemente des Hebräischen wieder, statt den Gottesnamen durch einen weiteren Titel zu ersetzen.
- issue: Messianische Bedeutung der Salbung
  choice: hat mich gesalbt
  alternative: hat mich zum Messias gemacht; hat mich beauftragt
  rationale: Die konkrete Salbungssprache bleibt stehen. Damit wird ihre messianische Resonanz bewahrt, aber weder eine spätere christologische Identifizierung in den Wortlaut eingefügt noch die Salbung auf eine allgemeine Beauftragung reduziert.
- issue: Art der angekündigten Befreiung
  choice: Freiheit und Öffnung des Kerkers
  alternative: ausschließlich geistliche Befreiung; ausschließlich politische Freilassung
  rationale: Der Vers verwendet konkrete Gefangenschafts- und Freilassungssprache. Die Übersetzung lässt offen, wie wörtliche, soziale und geistliche Dimensionen im Kontext zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Die Satzglieder folgen weitgehend der hebräischen Abfolge, werden aber so verbunden, dass der Vers mündlich verständlich bleibt. Ungewöhnliche oder mehrdeutige Ausdrücke werden nicht stillschweigend harmonisiert, sondern im Text beziehungsweise in den Fußnoten kenntlich gemacht.
