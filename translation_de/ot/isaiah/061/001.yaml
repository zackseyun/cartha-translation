revisions:
- from: Der Geist des Herrn Yahweh ist auf mir, weil Yahweh mich gesalbt hat, den Gebeugten[a] gute Nachricht zu bringen. Er hat mich gesandt, die zu verbinden, deren Herz zerbrochen ist, den Gefangenen Freiheit auszurufen und den Gefesselten die Öffnung des Kerkers[b].
  to: Der Geist des Herrn Yahweh ist auf mir, weil Yahweh mich gesalbt hat, den Gebeugten[a] gute Nachricht zu bringen. Er hat mich gesandt, die Menschen mit gebrochenem Herzen zu verbinden, den Gefangenen Freiheit auszurufen und den Gefesselten Öffnung zu verkünden[b].
  rationale: Die Revision behebt die grammatische Unvollständigkeit im letzten Satzglied und entfernt die nicht ausdrücklich im Hebräischen enthaltene Konkretisierung „des Kerkers“. Durch „Öffnung zu verkünden“ bleibt die schwierige hebräische Wendung bewusst offen; die wesentlichen Deutungsmöglichkeiten werden in der Fußnote dokumentiert. Die geringfügige Umformulierung von „deren Herz zerbrochen ist“ verbessert die natürliche deutsche Syntax bei unverändertem Bildgehalt.
