source:
  edition: WLC
  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: de
  text: um für die Trauernden Zions zu sorgen und ihnen Kopfschmuck[a] statt Asche zu geben, Freudenöl statt Trauer, ein Gewand des Lobes statt eines matten Geistes; und man wird sie Eichen der Gerechtigkeit[b][c] nennen, eine Pflanzung Jahwes, damit er sich verherrliche[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmuck“. Das hebräische Wort kann Schmuck oder einen festlichen Kopfschmuck bezeichnen. Wahrscheinlich ist Kopfschmuck gemeint, der die auf dem Kopf getragene Trauerasche ersetzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Terebinthen“. Das hebräische Wort kann diese großen, kräftigen Bäume genauer bezeichnen; „Eichen“ gibt das vertraute poetische Bild wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Eichen des Rechts“. Das hebräische Wort kann je nach Zusammenhang sowohl Gerechtigkeit als auch Recht bezeichnen.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „damit er seine Herrlichkeit zeige“ oder „damit er verherrlicht werde“. Die hebräische Schlussform ist ein Finalinfinitiv und kann Jahwes Selbstverherrlichung beziehungsweise seine Verherrlichung durch diese Pflanzung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן לָתֵת לָהֶם
  choice: um für die Trauernden Zions zu sorgen und ihnen … zu geben
  rationale: Die beiden zweckbezeichnenden Infinitive werden in natürlichem Deutsch verbunden. „Für … sorgen“ gibt die hier gemeinte Anordnung beziehungsweise Bereitstellung wieder, während „geben“ die zweite Verbform ausdrücklich erhält.
- source_word: פְּאֵר תַּחַת אֵפֶר
  choice: Kopfschmuck statt Asche
  rationale: פְּאֵר bezeichnet hier wahrscheinlich festlichen oder schmückenden Kopfschmuck und bildet einen konkreten Gegensatz zur Asche des Trauerrituals.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: Freudenöl
  rationale: Das knappe deutsche Kompositum bewahrt die poetische Genitivverbindung und bezeichnet das Salböl festlicher Freude.
- source_word: מַעֲטֵה תְהִלָּה
  choice: ein Gewand des Lobes
  rationale: מַעֲטֶה ist eine äußere Bekleidung oder Umhüllung. „Gewand“ ist verständlich und erhält das Bild.
- source_word: רוּחַ כֵּהָה
  choice: ein matter Geist
  rationale: כֵּהָה bezeichnet Mattheit, Schwäche oder Verdunkelung. „Matt“ wahrt das Bild innerer Kraftlosigkeit, ohne es psychologisch zu verengen.
- source_word: וְקֹרָא לָהֶם
  choice: Dann wird man sie … nennen
  rationale: Die dritte Person Singular hat hier unbestimmt-passivische Kraft. Die deutsche man-Konstruktion gibt dies wieder, ohne einen nicht genannten Handelnden einzuführen.
- source_word: אֵילֵי הַצֶּדֶק
  choice: Eichen der Gerechtigkeit
  rationale: Im Zusammenhang mit „Pflanzung“ ist die Bezeichnung großer, kräftiger Bäume gemeint. „Eichen“ vermittelt dieses poetische Bild allgemeinverständlich; die genauere botanische Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: מַטַּע יְהוָה
  choice: eine Pflanzung Jahwes
  rationale: „Pflanzung“ bewahrt das substantivische Pflanzenbild. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לְהִתְפָּאֵר
  choice: an der er seine Herrlichkeit zeigt
  rationale: Die finale Wendung beschreibt, dass Jahwes Herrlichkeit an seiner Pflanzung sichtbar wird. Die Formulierung erhält seine aktive Beteiligung und passt syntaktisch zum vorangehenden Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe mit „Jahwe“ erhält den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַצֶּדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Das Wort umfasst sowohl normgerechtes beziehungsweise gerechtes Sein als auch Recht und Gerechtigkeit im gesellschaftlichen Sinn. „Gerechtigkeit“ lässt die moralisch-bundestheologische Weite offen; „Recht“ wird als mögliche Nuance vermerkt.
- issue: Sinn von לְהִתְפָּאֵר
  choice: an der er seine Herrlichkeit zeigt
  alternative: durch die er verherrlicht wird
  rationale: Die gewählte Fassung versteht die Schlusswendung als Zweck beziehungsweise Ergebnis von Jahwes Pflanzung und bewahrt seine aktive Selbstdarstellung. Die mögliche passive Auffassung wird nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die dreifache Folge „statt“ bleibt erhalten. „Freudenöl“, „Gewand des Lobes“ und „Eichen der Gerechtigkeit“ bewahren die Bildsprache, ohne altertümlich zu klingen.
