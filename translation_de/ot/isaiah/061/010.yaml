  to: Ich freue mich sehr an Yahweh; meine Seele jubelt über meinen Gott. Denn er hat mich mit Kleidern des Heils bekleidet und mich in den Mantel der Gerechtigkeit[a] gehüllt, wie ein Bräutigam, der sich nach priesterlicher Art einen Kopfschmuck anlegt[b], und wie eine Braut, die sich mit ihrem Schmuck ziert.
