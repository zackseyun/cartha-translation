reference: Isaiah 61:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: de
  text: Ich freue mich sehr an Yahweh; meine Seele jubelt über meinen Gott. Denn er hat mich mit Kleidern des Heils bekleidet und mich in den Mantel der Gerechtigkeit[a] gehüllt, wie ein Bräutigam, der sich nach priesterlicher Art einen Kopfschmuck anlegt[b], und wie eine Braut, die sich mit ihrem Schmuck ziert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Obergewand der Gerechtigkeit“; auch: „in einen Mantel des Rechts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist ungewöhnlich und spielt wahrscheinlich auf priesterlichen Schmuck an; auch möglich: „der sich mit einem prächtigen Kopfschmuck schmückt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: Ich freue mich von Herzen
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt die Aussage. „Von Herzen“ gibt diese Intensivierung natürlich und poetisch wieder, ohne die hebräische Wiederholung mechanisch nachzubilden.
- source_word: בַּיהוָה
  choice: über Yahweh
  rationale: Die Präposition ב bezeichnet hier im Deutschen natürlich den Gegenstand der Freude. Der Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: תָּגֵל נַפְשִׁי
  choice: meine Seele jubelt
  rationale: גיל bezeichnet lebhafte, überschwängliche Freude. „Jubeln“ bewahrt die poetische Steigerung gegenüber dem ersten Satzteil.
- source_word: בֵּאלֹהַי
  choice: über meinen Gott
  rationale: Die Wendung steht parallel zu בַּיהוָה; „über“ bezeichnet idiomatisch den Grund und Gegenstand des Jubels.
- source_word: הִלְבִּישַׁנִי
  choice: er hat mich … bekleidet
  rationale: Das Perfekt beschreibt eine vollzogene Handlung mit gegenwärtiger Wirkung. „Bekleidet“ erhält das tragende Gewandbild.
- source_word: בִּגְדֵי יֶשַׁע
  choice: mit Kleidern des Heils
  rationale: Die Konstruktion wird formal nah wiedergegeben. „Heil“ umfasst Rettung und Wohlergehen und passt zum poetisch-theologischen Register.
- source_word: מְעִיל צְדָקָה
  choice: in den Mantel der Gerechtigkeit
  rationale: מְעִיל ist ein Obergewand beziehungsweise Mantel. „Gerechtigkeit“ bewahrt die moralische und bundestheologische Weite von צְדָקָה.
- source_word: יְעָטָנִי
  choice: mich … gehüllt
  rationale: Das Verb bezeichnet das Umhüllen mit einem Gewand; „hüllen“ ist im Deutschen anschaulich und idiomatisch.
- source_word: יְכַהֵן פְּאֵר
  choice: der sich nach priesterlicher Art mit einem Kopfschmuck schmückt
  rationale: Die seltene Verbform von כהן lässt wahrscheinlich eine priesterliche Anspielung anklingen, während פְּאֵר einen festlichen Kopfschmuck bezeichnet. Die Formulierung wahrt die ungewöhnliche Verbindung, ohne sie als eindeutige Amtsausübung festzulegen.
- source_word: וְכַכַּלָּה תַּעְדֶּה כֵלֶיהָ
  choice: und wie eine Braut, die sich mit ihrem Schmuck ziert
  rationale: עדה bedeutet hier „sich schmücken/zieren“; כֵלֶיהָ bezeichnet im Brautkontext ihre Schmuckstücke beziehungsweise Ziergeräte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsweite von צְדָקָה
  choice: Gerechtigkeit
  alternative: Recht
  rationale: צְדָקָה kann sowohl Gerechtigkeit als auch rechtsschaffendes beziehungsweise rettendes Handeln bezeichnen. „Gerechtigkeit“ hält diese Weite im Bild der göttlichen Bekleidung besser offen.
- issue: Priesterliche Anspielung in יְכַהֵן פְּאֵר
  choice: nach priesterlicher Art mit einem Kopfschmuck schmückt
  alternative: sich mit einem Kopfschmuck schmückt / mit Kopfschmuck priesterlich dient
  rationale: Die vom Wortstamm כהן geprägte ungewöhnliche Form kann priesterliches Anlegen oder priesterliches Handeln andeuten. Die gewählte Fassung erhält die Anspielung, ohne den Bräutigam eindeutig zu einem amtierenden Priester zu machen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Parallelismen und das durchgehende Bild des Bekleidens und Schmückens bleiben erhalten. Die seltene priesterliche Wendung wird verständlich formuliert, ihre echte Mehrdeutigkeit jedoch in der Fußnote offengehalten.
