  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: de
  text: Denn mit Freude werdet ihr ausziehen, und in Frieden werdet ihr geleitet werden[a]. Die Berge und Hügel werden vor euch in Jubelgesang ausbrechen[b], und alle Bäume des Feldes werden in die Hände klatschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werdet ihr sicher geleitet werden«. Das hebräische Wort שָׁלוֹם umfasst Frieden, Wohlergehen und Unversehrtheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werden vor euch in Jubel ausbrechen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt den begründenden beziehungsweise folgernden Anschluss an die vorangehende Verheißung.
- source_word: בְשִׂמְחָה תֵצֵאוּ
  choice: mit Freude werdet ihr ausziehen
  rationale: Gibt die Präpositionalfügung mit ihrem Substantiv wieder und erhält zugleich das Motiv des Auszugs und der Wiederherstellung.
- source_word: וּבְשָׁלוֹם תּוּבָלוּן
  choice: und in Frieden werdet ihr geleitet werden
  rationale: Das Hofal von יבל bezeichnet das Geführt- oder Geleitetwerden. Die Übersetzung wiederholt »aus« nicht, da dies im hebräischen Verb selbst nicht steht, und bewahrt den umfassenden Klang von שָׁלוֹם.
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: Berge und Hügel
  rationale: Natürliche und genaue Wiedergabe der poetisch dargestellten Landschaft.
- source_word: יִפְצְחוּ ... רִנָּה
  choice: werden ... in Jubel ausbrechen
  rationale: Die Verbindung bezeichnet einen unvermittelten, freudigen Gesangs- oder Jubelausbruch; »in Jubel ausbrechen« ist im Deutschen lebendig und idiomatisch.
- source_word: לִפְנֵיכֶם
  choice: vor euch
  rationale: Bewahrt sowohl die räumliche Vorstellung als auch die Reaktion der Landschaft in Gegenwart der Heimkehrenden.
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: und alle Bäume des Feldes
  rationale: Erhält das kollektive poetische Bild und folgt der üblichen Bedeutung von שׂדה.
- source_word: יִמְחֲאוּ כָף
  choice: werden in die Hände klatschen
  rationale: Gibt die hebräische Wendung als verständliches deutsches Idiom wieder und bewahrt die Personifikation der Bäume.
theological_decisions:
- issue: Poetische Personifikation der Schöpfung im Bild der Wiederherstellung
  choice: Berge, Hügel und Bäume als jubelnde Mitwirkende beibehalten
  alternative: Die Bildsprache zu einer unpersönlichen Beschreibung der schönen Natur abschwächen
  rationale: Der hebräische Text stellt die Schöpfung bewusst als Teilnehmerin an der Freude dar. Die Personifikation wahrt das Motiv umfassender Wiederherstellung, ohne es dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher poetischer Bildsprache. Der Plural »ihr« und die Zukunftsformen bleiben ausdrücklich erhalten; die Parallelität und die Personifikation der Natur werden bewahrt.
