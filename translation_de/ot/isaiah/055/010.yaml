  text: כִּ֡י כַּ/אֲשֶׁ֣ר יֵרֵד֩ הַ/גֶּ֨שֶׁם וְ/הַ/שֶּׁ֜לֶג מִן הַ/שָּׁמַ֗יִם וְ/שָׁ֨מָּ/ה֙ לֹ֣א יָשׁ֔וּב כִּ֚י אִם הִרְוָ֣ה אֶת הָ/אָ֔רֶץ וְ/הוֹלִידָ֖/הּ וְ/הִצְמִיחָ֑/הּ וְ/נָ֤תַן זֶ֨רַע֙ לַ/זֹּרֵ֔עַ וְ/לֶ֖חֶם לָ/אֹכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: de
  text: Denn wie Regen und Schnee vom Himmel herabfallen und nicht dorthin zurückkehren, ohne die Erde getränkt, sie Frucht tragen und sprossen lassen und dem Sämann Samen und dem Essenden Brot gegeben zu haben,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht hier im Singular, obwohl Regen und Schnee zusammen genannt werden. Es kann das Niederschlagsgeschehen als Einheit auffassen; ein Wechsel des Subjekts zu „der Erde“ wird nicht ausdrücklich markiert.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Denn wie
  rationale: Bewahrt sowohl die begründende Funktion von כִּי als auch den mit כַּאֲשֶׁר eröffneten Vergleich mit Vers 11.
- source_word: יֵרֵד הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: Regen und Schnee … herabfallen
  rationale: Natürliches modernes Deutsch für Niederschlag; „herab“ erhält die Richtungsangabe des Verbs ירד.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel
  rationale: שָׁמַיִם ist formal pluralisch, bezeichnet hier aber idiomatisch den Himmel als Herkunft von Regen und Schnee.
- source_word: וְשָׁמָּה לֹא יָשׁוּב כִּי אִם
  choice: und nicht dorthin zurückkehren, ohne … zu haben
  rationale: Gibt den Rückbezug von שָׁמָּה und die ausschließende Konstruktion כִּי אִם natürlich wieder.
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: die Erde getränkt
  rationale: רוה im Hifil bezeichnet hier ein sättigendes Bewässern; „getränkt“ hält die Intensität des Bildes fest.
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  choice: sie fruchtbar gemacht und zum Sprießen gebracht
  rationale: 'Die beiden kausativen Verben werden unterschieden wiedergegeben: Die Erde wird produktiv und lässt Wachstum hervorkommen.'
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ וְלֶחֶם לָאֹכֵל
  choice: sodass sie dem Sämann Samen und dem Essenden Brot gibt
  rationale: Das feminine Singularverb bezieht sich am naheliegendsten auf „die Erde“. „Sodass“ macht den resultativen Zusammenhang im Deutschen klar und erhält die konkrete Parallelität.
