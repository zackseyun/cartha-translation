  to: Denn wie Regen und Schnee vom Himmel herabfallen und nicht dorthin zurückkehren, ohne die Erde getränkt, sie Frucht tragen und sprossen lassen und dem Sämann Samen und dem Essenden Brot gegeben zu haben,[a]
