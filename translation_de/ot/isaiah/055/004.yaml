  text: הֵ֛ן עֵ֥ד לְאוּמִּ֖ים נְתַתִּ֑י/ו נָגִ֥יד וּ/מְצַוֵּ֖ה לְאֻמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: de
  text: Siehe, ich habe ihn den Völkern zum Zeugen gegeben[a][b], zum Anführer und Befehlshaber für die Völker[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe ihn als Zeugen für die Völker eingesetzt“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihn“ bezieht sich im Zusammenhang wahrscheinlich auf David oder auf einen davidischen Repräsentanten; manche verstehen die Stelle messianisch.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Nationen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage hervor. „Siehe“ bewahrt den würdevollen prophetischen Nachdruck.
- source_word: עֵד
  choice: Zeuge
  rationale: Das Substantiv bezeichnet hier eine Person, die Zeugnis ablegt, nicht das abstrakte „Zeugnis“.
- source_word: לְאוּמִּים
  choice: den Völkern / für die Völker
  rationale: לְאֻמִּים bezeichnet mehrere Völker beziehungsweise Nationen. Beim Zeugen ist der deutsche Dativ natürlich; bei den Leitungsbezeichnungen gibt „für die Völker“ die Beziehung wieder, ohne eine Herrschaft über sie ausdrücklich festzulegen.
- source_word: נְתַתִּיו
  choice: ich habe ihn … gegeben
  rationale: Die Wiedergabe folgt der Grundbedeutung von נתן und bewahrt das Perfekt mit Gegenwartsbezug. Die deutsche Konstruktion „jemanden zum Zeugen geben“ ist gehoben, aber verständlich.
- source_word: נָגִיד
  choice: Anführer
  rationale: נָגִיד bezeichnet einen in leitender Stellung eingesetzten Menschen. „Anführer“ ist verständlich und legt anders als „Fürst“ keinen erblichen Rang nahe.
- source_word: וּמְצַוֵּה
  choice: und Gebieter
  rationale: Das Partizip von צוה bezeichnet jemanden, der Weisungen oder Befehle erteilt. „Gebieter“ erhält diese aktive Bedeutung und passt zur parallelen Amtsbezeichnung.
theological_decisions:
- issue: Bezug des maskulinen Objektsuffixes „ihn“
  choice: Das Pronomen „ihn“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: David ausdrücklich nennen; den davidischen König beziehungsweise Messias nennen; Israel als personifizierten Bezug verstehen.
  rationale: Vers 3 erinnert unmittelbar an David, doch der hebräische Wortlaut von Vers 4 nennt den Bezug des Suffixes nicht ausdrücklich. Die Übersetzung bewahrt daher die mögliche Spannung zwischen David und einem davidischen Repräsentanten, statt sie lehrmäßig aufzulösen.
- issue: Art der Autorität in נָגִיד וּמְצַוֵּה
  choice: „Anführer und Gebieter für die Völker“
  alternative: „Fürst und Befehlshaber über die Völker“
  rationale: Die gewählte Formulierung erhält Leitungs- und Weisungsautorität, ohne durch „über“ eine im hebräischen ל nicht zwingend festgelegte Herrschaftsbeziehung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Signalwort „Siehe“. Die leicht gehobene Wendung „zum Zeugen gegeben“ hält sich eng an die hebräische Bild- und Satzstruktur; die Fußnote bietet eine geläufigere deutsche Alternative.
