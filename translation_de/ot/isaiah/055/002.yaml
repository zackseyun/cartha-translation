  to: Warum wiegt ihr Silber ab für etwas, das kein Brot ist, und setzt eure Mühe für etwas ein, das nicht satt macht? Hört aufmerksam auf mich und esst, was gut ist; eure Seele soll sich an Fülle erfreuen.
