  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: de
  text: Warum wiegt ihr Silber ab für etwas, das kein Brot ist, und setzt eure Mühe für etwas ein, das nicht satt macht? Hört aufmerksam auf mich und esst, was gut ist; eure Seele soll sich an Fülle erfreuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: wiegt ihr Silber ab
  rationale: Die konkrete Vorstellung des Abwiegens von Silber als Zahlungsmittel bleibt erhalten. Die Fußnote nennt die geläufigere sinngemäße Wiedergabe.
- source_word: בְּלוֹא לֶחֶם
  choice: für etwas, das kein Brot ist
  rationale: Die verneinte Nominalfügung wird verständlich wiedergegeben, ohne das Bild vom Brot ausdrücklich zu vergeistlichen.
- source_word: וִיגִיעֲכֶם
  choice: und euren Arbeitsertrag
  rationale: יְגִיעַ kann Mühe, Arbeit oder deren Ertrag bezeichnen. Im wirtschaftlichen Parallelismus zu Silber liegt „Arbeitsertrag“ nahe, während der Zusammenhang mit menschlicher Mühe hörbar bleibt.
- source_word: בְּלוֹא לְשָׂבְעָה
  choice: für etwas, das nicht satt macht
  rationale: Die substantivische Vorstellung von Sättigung wird im Deutschen natürlich verbal ausgedrückt und mit dem Nahrungsbild verbunden.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Hört aufmerksam
  rationale: Die Verbindung von Imperativ und Infinitivus absolutus verstärkt die Aufforderung. „Hört aufmerksam“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: וְאִכְלוּ טוֹב
  choice: und esst, was gut ist
  rationale: Das substantivisch gebrauchte טוֹב bleibt in seiner offenen Bedeutung erhalten; die Übersetzung legt weder ausschließlich gute Speise noch eine rein geistliche Gabe fest.
- source_word: וְתִתְעַנַּג
  choice: soll sich … erfreuen
  rationale: Die feminine Verbform bezieht sich auf נֶפֶשׁ. Die Formulierung bewahrt den reflexiven Sinn des Hitpael und gibt die einladend-volitive Folge wieder.
- source_word: בַּדֶּשֶׁן
  choice: an reicher Fülle
  rationale: דֶּשֶׁן bezeichnet wörtlich Fett beziehungsweise Üppigkeit und kann reichhaltige Speise oder Fülle meinen. „Reiche Fülle“ bewahrt das Bild, ohne im heutigen Deutsch irreführend körperliche Fettleibigkeit anzudeuten.
- source_word: נַפְשְׁכֶם
  choice: eure Seele
  rationale: Das singularische נֶפֶשׁ mit pluralischem Possessivsuffix wird formal bewahrt. Es kann Seele, Leben oder die ganze Person bezeichnen.
theological_decisions:
- issue: Bildhafte Sprache von Nahrung und Sättigung
  choice: Die Bilder „Brot“, „satt machen“ und „essen“ bleiben im Haupttext unverändert bildhaft.
  alternative: Die Einladung ausdrücklich als geistliche Nahrung oder geistliche Erfüllung erklären.
  rationale: Der hebräische Text nennt die Deutungsebene nicht ausdrücklich. Eine Vergeistlichung im Haupttext würde die poetische Offenheit und Spannung unzulässig auflösen.
- issue: Bedeutung von נֶפֶשׁ
  choice: „eure Seele“
  alternative: „ihr selbst“ oder „euer Leben“
  rationale: „Seele“ wahrt die poetische Personifizierung und die grammatische Beziehung zum femininen Verb, ohne נֶפֶשׁ auf eine vom Körper getrennte Seelenlehre festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetisch-poetischer Bildsprache. Die wirtschaftliche Metapher des abgewogenen Silbers bleibt sichtbar; erklärungsbedürftige historische und grammatische Einzelheiten stehen in knappen Fußnoten.
