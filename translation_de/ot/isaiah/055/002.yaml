    issue: „Arbeitsertrag“ verengt יְגִיעַ.
    rationale: Das Wort kann sowohl Mühe/Arbeit als auch deren Ertrag bezeichnen. Im Deutschen bewahrt „Mühe“ diese poetische und semantische Offenheit besser.
  - severity: low
    issue: Die Auslassung eines Verbs im zweiten Satzglied ist stilistisch holprig.
    rationale: „… und euren Arbeitsertrag für etwas …“ lässt im Deutschen offen, welche Handlung gemeint ist. „setzt ihr eure Mühe … ein“ macht den vom Parallelismus getragenen Einsatz verständlich.
  - severity: low
