  variant: modern standard German
source:
  edition: WLC
  text: דִּרְשׁ֥וּ יְהוָ֖ה בְּ/הִמָּצְא֑/וֹ קְרָאֻ֖/הוּ בִּֽ/הְיוֹת֥/וֹ קָרֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: de
  text: Sucht Jahwe, solange er sich finden lässt[a]; ruft ihn an, solange er nahe ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während er zu finden ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: Der Imperativ von דרש fordert hier dazu auf, sich Jahwe suchend zuzuwenden. „Sucht“ ist knapp, natürlich und bewahrt den religiösen Sinn, ohne ihn auf Buße, Gebet oder Gottesdienst allein festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּהִמָּצְאוֹ
  choice: solange er sich finden lässt
  rationale: Die Verbindung aus ב und dem Infinitiv von מצא ist temporal. Die Formulierung bezeichnet eine gegenwärtige Gelegenheit und bewahrt die Dringlichkeit; eine Fußnote nennt die näher am Wortlaut liegende Alternative.
- source_word: קְרָאֻהוּ
  choice: ruft ihn an
  rationale: קרא mit persönlichem Objekt bedeutet hier, sich im Ruf oder Gebet an jemanden zu wenden. „Ihn anrufen“ ist im Deutschen idiomatisch und würdevoll.
- source_word: בִּהְיוֹתוֹ
  choice: solange er … ist
  rationale: ב mit dem Infinitiv von היה hat temporale Funktion. „Solange“ nimmt den parallelen Zeitrahmen der ersten Vershälfte auf.
- source_word: קָרוֹב
  choice: nahe
  rationale: „Nahe“ gibt קָרוֹב direkt wieder und lässt sowohl Zugänglichkeit als auch räumliche beziehungsweise relationale Nähe anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Auffindbarkeit Gottes in בְּהִמָּצְאוֹ
  choice: solange er sich finden lässt
  alternative: während er zu finden ist; wenn er gefunden wird
  rationale: Die gewählte Fassung drückt die zeitlich begrenzte Gelegenheit aus, ohne zu behaupten, Gott werde zwangsläufig gefunden oder sei nur unter bestimmten menschlichen Bedingungen auffindbar. Die sprachliche Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Die parallelen Aufforderungen und die zeitliche Dringlichkeit des hebräischen Verses bleiben erhalten.
