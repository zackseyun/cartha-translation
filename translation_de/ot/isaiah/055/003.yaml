  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: de
  text: 'Neigt euer Ohr und kommt zu mir! Hört, und eure Seele wird leben. Ich werde mit euch einen ewigen Bund schließen: die verlässlichen Gnadenerweise, die David zugesagt sind[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Davids verlässliche Gnadenerweise“ oder „die David zugesagte beständige Liebe“. Das hebräische Wort חֶסֶד kann je nach Zusammenhang Gnade, Güte, beständige Liebe oder Bundestreue bezeichnen; auch die genaue Beziehung der Wendung zu David ist im Hebräischen knapp und mehrdeutig ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: Neigt euer Ohr
  rationale: Die Wendung bewahrt das hebräische Bild des zugeneigten Ohrs und klingt im Deutschen würdig und verständlich.
- source_word: וּלְכוּ אֵלַי
  choice: und kommt zu mir
  rationale: Im Zusammenhang einer Einladung bedeutet הלך mit אֶל aus der Perspektive des Sprechers natürlich „zu mir kommen“.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: „Hört“ lässt sowohl aufmerksames Zuhören als auch die in שׁמע mitschwingende Bereitschaft zur Annahme offen, ohne ausdrücklich „gehorcht“ einzutragen.
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: und eure Seele wird leben
  rationale: Die Wiedergabe folgt der hebräischen Satzfolge und bewahrt נֶפֶשׁ ausdrücklich. „Seele“ ist hier im umfassenden Sinn von Leben beziehungsweise Person zu verstehen.
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: Ich werde mit euch einen Bund schließen
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes; die deutsche Formulierung gibt sie idiomatisch wieder.
- source_word: בְּרִית עוֹלָם
  choice: einen ewigen Bund
  rationale: „Ewig“ ist in diesem Bundeskontext eine natürliche und prägnante Wiedergabe von עוֹלָם.
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: die verlässlichen Gnadenerweise, die David gelten
  rationale: „Gnadenerweise“ nimmt den Plural von חַסְדֵי auf und bezeichnet loyale, gnädige Zuwendung. „Die David gelten“ verbindet sie mit David, ohne die grammatische Beziehung unnötig eng als Urheberschaft Davids festzulegen. הַנֶּאֱמָנִים wird mit „verlässlich“ als sicher und vertrauenswürdig wiedergegeben.
theological_decisions:
- issue: Beziehung der verlässlichen חֲסָדִים zu David und zum ewigen Bund
  choice: Die Gnadenerweise werden als die David geltende, verlässliche Bundesgnade verstanden, die Gott nun den Angesprochenen im ewigen Bund zusagt.
  alternative: Die Wendung kann auch als „Davids verlässliche Gnadenerweise“ oder als „die David zugesagte beständige Liebe“ wiedergegeben werden.
  rationale: Gott ist der Sprecher und kündigt den Angesprochenen einen Bund an; daher liegt Gottes zuverlässige, mit David verbundene Bundesgnade näher als von David vollbrachte Taten. Die knappe hebräische Genitivverbindung bleibt jedoch mehrdeutig, weshalb die Fußnote alternative Wiedergaben nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von „das Ohr neigen“, das ausdrücklich genannte „Seele“ und die Bundessprache bleiben erhalten. Der Schluss vermeidet eine konfessionell festgelegte Deutung und kennzeichnet die echte lexikalische und syntaktische Mehrdeutigkeit durch eine Fußnote.
