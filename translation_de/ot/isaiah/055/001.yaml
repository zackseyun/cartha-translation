base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: de
  text: 'Auf[a], alle Durstigen, kommt zum Wasser! Und alle, die kein Geld haben[b]: Kommt, kauft und esst! Kommt und kauft ohne Geld und ohne Preis Wein und Milch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Heda!“; das hebräische Wort ist ein dringlicher Ausruf, der je nach Zusammenhang auch eine Klage oder einen Weheruf einleiten kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und wer kein Geld hat“. Das Hebräische steht im maskulinen Singular, ist hier aber allgemein gemeint; die folgenden Aufforderungen stehen im Plural.'
    reason: source_form
lexical_decisions:
- source_word: הוֹי
  choice: Auf
  rationale: Die Interjektion eröffnet hier einen dringlichen, einladenden Ruf. „Auf“ ist im Deutschen würdevoll und verständlich, ohne den Ausdruck als Klage oder Weheruf misszuverstehen.
- source_word: כָּל צָמֵא
  choice: ihr Durstigen … alle
  rationale: Die Verbindung aus כָּל und dem substantivisch gebrauchten Singular bezeichnet kollektiv alle Durstigen. Die deutsche Anrede gibt sowohl den umfassenden Sinn als auch die direkte Einladung natürlich wieder.
- source_word: לְכוּ
  choice: kommt
  rationale: Obwohl das Verb grundsätzlich „gehen“ bedeutet, hat der Imperativ in dieser Einladung die pragmatische Kraft von „kommt“. Die Wiederholung bleibt erhalten und vermittelt den nachdrücklichen Ruf.
- source_word: לַמַּיִם
  choice: zum Wasser
  rationale: Der hebräische Plural מַיִם wird im Deutschen regulär mit dem singularischen Stoffnamen „Wasser“ wiedergegeben. „Zu den Wassern“ wäre zwar formnäher, klänge hier jedoch unnötig altertümlich.
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: und alle, die kein Geld haben
  rationale: Der hebräische maskuline Singular hat generische Bedeutung. Die pluralische deutsche Anrede macht diesen kollektiven Bezug klar und ermöglicht zugleich eine grammatisch natürliche Fortführung mit den pluralischen Imperativen.
- source_word: שִׁבְרוּ
  choice: kauft
  rationale: Das Verb bezeichnet in einem Versorgungskontext den Erwerb von Lebensmitteln. Das allgemeine „kauft“ passt, da beim ersten Vorkommen kein ausdrückliches Objekt genannt wird.
- source_word: וֶאֱכֹלוּ
  choice: und esst
  rationale: Die schlichte Folge zweier Imperative und die Konjunktion werden direkt bewahrt.
- source_word: בְּלוֹא כֶסֶף
  choice: ohne Geld
  rationale: Die direkte Formulierung erhält das Paradox eines Kaufs ohne Zahlungsmittel.
- source_word: וּבְלוֹא מְחִיר
  choice: und ohne Bezahlung
  rationale: מְחִיר bezeichnet Preis oder Gegenwert. „Ohne Bezahlung“ ist gegenwärtiges, natürliches Deutsch und bildet mit „ohne Geld“ eine klare Parallelzeile.
- source_word: יַיִן וְחָלָב
  choice: Wein und Milch
  rationale: Die konkreten Bilder reichlicher Versorgung werden wörtlich bewahrt und nicht durch eine geistliche Deutung ersetzt.
theological_decisions:
- issue: Generischer maskuliner Singular in der Einladung
  choice: Der generische Singular wird als direkte pluralische Anrede „alle, die kein Geld haben“ wiedergegeben.
  alternative: „Wer kein Geld hat“ beziehungsweise formnäher „und der, der kein Geld hat“
  rationale: Der Singular bezeichnet keine bestimmte männliche Person, sondern jedes mittellose Mitglied der angesprochenen Gruppe. Die pluralische Wiedergabe bewahrt den Umfang der Einladung und stimmt grammatisch mit den hebräischen Pluralimperativen überein; die formale Abweichung wird in einer Fußnote offengelegt.
- issue: Wirtschaftliche Bilder gegenüber geistlicher Paraphrase
  choice: Die Markt- und Nahrungsbilder „kauft“, „Wein“ und „Milch“ bleiben konkret stehen.
  alternative: Eine ausdeutende Paraphrase als kostenloses Heil oder geistlicher Segen
  rationale: Der theologische Gehalt wird im Hebräischen durch konkrete, spannungsreiche Bilder vermittelt. Die Übersetzung soll diese Bilder nicht durch eine konfessionell oder dogmatisch festgelegte Erklärung ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit hörbarem poetischem Nachdruck. Die wiederholten Aufforderungen und die konkrete Bildsprache bleiben erhalten. „Auf“ trägt einen leicht gehobenen Ton, ist aber verständlicher und kontextgerechter als das altertümlich wirkende „Heda“.
