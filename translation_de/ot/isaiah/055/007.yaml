revisions:
- from: Der Gottlose soll seinen Weg verlassen und der Übeltäter seine Gedanken. Er soll zu Jahwe[a] zurückkehren, und er wird sich über ihn erbarmen, und zu unserem Gott, denn er vergibt in reichem Maß.[b][c]
  to: Der Gottlose soll seinen Weg verlassen und der Übeltäter seine Gedanken. Er soll zu Jahwe[a] zurückkehren; dann wird er sich über ihn erbarmen.[b] Er soll zu unserem Gott zurückkehren, denn er vergibt reichlich.[c]
  rationale: Die Wiederholung von „zurückkehren“ löst die im Deutschen missglückte Ellipse auf und stellt klar, dass „Jahwe“ und „unser Gott“ die parallelen Ziele derselben Aufforderung sind. „Dann wird“ bringt die als Zusage verstandene Folge des hebräischen Imperfekts klar zum Ausdruck. Die Fußnoten wurden inhaltlich beibehalten, aber der Anker für die modale Alternative an die betreffende Aussage gesetzt.
