source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: de
  text: Der Gottlose soll seinen Weg verlassen und der Übeltäter seine Gedanken. Er soll zu Jahwe[a] zurückkehren; dann wird er sich über ihn erbarmen.[b] Er soll zu unserem Gott zurückkehren, denn er vergibt reichlich.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der persönliche Name Gottes; traditionell oft mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „damit er sich über ihn erbarme“.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Wörtlicher: „denn er macht das Vergeben groß“; gemeint ist, dass er reichlich oder großzügig vergibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲזֹב
  choice: soll … verlassen
  rationale: Der Imperfekt steht hier auffordernd. „Verlassen“ bewahrt sowohl den willentlichen als auch den moralischen Nachdruck.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivisch gebrauchte Wort bezeichnet hier einen Menschen, dessen Lebensführung böse ist. „Der Gottlose“ ist im Deutschen knapp, würdig und im biblischen Sprachgebrauch verständlich.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: „Weg“ erhält das hebräische Bild für Lebensführung, statt es erklärend auf „Verhalten“ zu verengen.
- source_word: אִישׁ אָוֶן
  choice: der Übeltäter
  rationale: Die natürliche deutsche Personenbezeichnung gibt den moralischen Sinn von אָוֶן in diesem Zusammenhang wieder. Das formal nähere „Mann des Unrechts“ wäre im heutigen Deutsch unnötig sperrig.
- source_word: מַחְשְׁבֹתָיו
  choice: seine Gedanken
  rationale: Das Wort kann Gedanken, Absichten oder Pläne bezeichnen. „Gedanken“ wahrt die Bedeutungsbreite und den Gegensatz zwischen innerer Ausrichtung und äußerem Weg.
- source_word: וְיָשֹׁב
  choice: er soll … zurückkehren
  rationale: שׁוּב bezeichnet eine Umkehr beziehungsweise Rückkehr. „Zurückkehren“ bewahrt das relationale Bewegungsbild, ohne es unmittelbar mit dem theologischen Fachwort „Buße tun“ gleichzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וִירַחֲמֵהוּ
  choice: und er wird sich über ihn erbarmen
  rationale: רחם bezeichnet erbarmende Zuwendung. Der folgende Imperfekt wird als Zusage verstanden, die an die Aufforderung zur Rückkehr anschließt.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die erste Person Plural bewahrt die gemeinschaftliche Stimme des Propheten.
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: denn er vergibt in reichem Maß
  rationale: Die Konstruktion mit רבה verstärkt das Vergeben. Die Formulierung gibt diese Fülle idiomatisch wieder, ohne die hebräische Wendung hölzern nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration bewahrt den Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe von שׁוּב
  choice: zurückkehren
  alternative: umkehren / Buße tun
  rationale: „Zurückkehren“ hält das konkrete und relationale Bild des Hebräischen offen. „Buße tun“ wäre stärker theologisch festgelegt; „umkehren“ ist ebenfalls möglich.
- issue: Modale Beziehung von וִירַחֲמֵהוּ zur Aufforderung
  choice: 'Zusage: „er wird sich … erbarmen“'
  alternative: 'Zweck- oder Wunschsatz: „damit er sich … erbarme“'
  rationale: Nach der Aufforderung kann der Imperfekt als verheißene Folge verstanden werden. Die alternative modale Nuance bleibt grammatisch möglich und wird in der Fußnote ausgewiesen.
- issue: Syntaktische Zuordnung von „und zu unserem Gott“
  choice: als zweites Ziel der Rückkehr beibehalten
  alternative: 'glättende Wiederholung: „er kehre zurück zu unserem Gott“'
  rationale: 'Die elliptische Koordination des Hebräischen wird bewahrt: Jahwe und „unser Gott“ sind zwei parallele Bezeichnungen desselben Ziels der Rückkehr. Eine Verbwiederholung wäre klarer, aber stärker glättend.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Aufforderung wird mit „soll“ natürlich wiedergegeben. Die ungewöhnliche, aber bedeutungstragende Parallelstruktur „zu Jahwe … und zu unserem Gott“ bleibt erhalten; dadurch wird die Identität beider Bezeichnungen nicht erklärend aufgelöst.
