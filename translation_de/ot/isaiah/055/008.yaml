id: ISA.55.8
reference: Isaiah 55:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י לֹ֤א מַחְשְׁבוֹתַ/י֙ מַחְשְׁב֣וֹתֵי/כֶ֔ם וְ/לֹ֥א דַרְכֵי/כֶ֖ם דְּרָכָ֑/י נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/008.yaml
  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: de
  text: Denn meine Gedanken sind nicht eure Gedanken[a], und eure Wege sind nicht meine Wege, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn meine Pläne sind nicht eure Pläne, und eure Wege sind nicht meine Wege.“ Das hebräische Wort für „Gedanken“ kann auch „Pläne“ oder „Absichten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: meine Gedanken / eure Gedanken
  rationale: „Gedanken“ bewahrt die Wiederholung und die Bedeutungsbreite des hebräischen Nomens, das auch Pläne oder Absichten bezeichnen kann.
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: eure Wege / meine Wege
  rationale: „Wege“ erhält sowohl das Bild als auch dessen übertragene Bedeutung von Handlungsweise und Lebensführung.
- source_word: לֹא ... וְלֹא
  choice: sind nicht ... und ... sind nicht
  rationale: Die ergänzte Kopula ist im Deutschen notwendig; die wiederholte Verneinung erhält den ausgewogenen Parallelismus.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ gibt die prophetische Spruchformel würdig und im deutschen Bibelstil idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; „der HERR“ wäre eine traditionelle Ersetzung durch einen Titel.
- issue: Bedeutungsumfang von מַחְשָׁבוֹת
  choice: Gedanken im Haupttext, Pläne/Absichten in der Fußnote
  alternative: Pläne im Haupttext
  rationale: Der Kontext kann Gottes Vorhaben und Absichten einschließen, doch „Gedanken“ hält die Aussage bewusst breit und löst die mögliche Spannung zwischen Denken, Planen und Beabsichtigen nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Satzstellung folgt natürlichem Deutsch, ohne die knappe Feierlichkeit der prophetischen Aussage abzuschwächen.
