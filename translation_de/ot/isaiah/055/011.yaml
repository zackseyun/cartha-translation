base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: de
  text: 'So wird mein Wort sein, das aus meinem Mund hervorgeht: Es wird nicht leer zu mir zurückkehren[a], sondern vollbringen, was ich will,[b] und mir gelingen, wozu ich es gesandt habe.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Ergebnis“. Wörtlich: „leer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was mir gefällt“ beziehungsweise „woran ich Gefallen habe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und Erfolg haben in dem, wozu ich es gesandt habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן יִהְיֶה
  choice: So wird … sein
  rationale: Bewahrt den Vergleich mit Regen und Schnee im vorhergehenden Vers und folgt der hervorgehobenen Satzstellung des Hebräischen in natürlichem, gehobenem Deutsch.
- source_word: דְבָרִי
  choice: mein Wort
  rationale: „Wort“ erhält die breite Bedeutung von דָּבָר und die Bildkraft der wirksamen Rede Gottes, ohne daraus ausdrücklich einen Personentitel zu machen.
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: das aus meinem Mund hervorgeht
  rationale: Gibt das konkrete Bild einer Äußerung aus Gottes Mund unmittelbar und würdig wieder.
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: Es wird nicht leer zu mir zurückkehren
  rationale: Die wörtliche Bildsprache bleibt erhalten; „leer“ meint hier, dass das Wort nicht ohne Ergebnis zurückkehrt.
- source_word: כִּי אִם
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet die Wendung den starken Gegensatz „nicht …, sondern …“.
- source_word: עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: vollbringen, was ich will
  rationale: „Vollbringen“ bringt im Zusammenhang die wirksame Ausführung zum Ausdruck; חפץ bezeichnet hier Gottes Wollen, Begehren oder Wohlgefallen.
- source_word: וְהִצְלִיחַ
  choice: und … Erfolg haben
  rationale: Gibt den Erfolgssinn des Verbs wieder, ohne materiellen Wohlstand anzudeuten.
- source_word: אֲשֶׁר שְׁלַחְתִּיו
  choice: bei dem …, wozu ich es gesandt habe
  rationale: Macht die knappe hebräische Zielangabe in verständlichem Deutsch sichtbar, ohne ein zusätzliches theologisches Konzept einzuführen.
theological_decisions:
- issue: Mögliche Personifizierung von „mein Wort“
  choice: „Mein Wort“ bezeichnet im Haupttext Gottes wirksame Rede, ohne als ausdrücklicher persönlicher Titel gekennzeichnet zu werden.
  alternative: Eine christologische Deutung kann im weiteren kanonischen Zusammenhang erwogen werden.
  rationale: Der unmittelbare Zusammenhang vergleicht Gottes ausgesandtes Wort mit Regen und Schnee und betont dessen Wirksamkeit; der hebräische Text verlangt hier keine ausdrückliche personale Identifikation.
- issue: Wirksamkeit des göttlichen Wortes und menschliche Reaktion
  choice: Die Gewissheit aussprechen, dass Gottes Wort seinen beabsichtigten Auftrag erfüllt.
  alternative: Eine Erweiterung zu einer bestimmten Lehre über unwiderstehlichen Ratschluss oder lediglich überredende Rede.
  rationale: Der Vers behauptet die zuverlässige Wirksamkeit von Gottes Wort, legt aber keine weitergehende konfessionelle Systematisierung fest.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die konkrete Bildsprache von Mund, Hinausgehen und leerem Zurückkehren bleibt erhalten. Die Satzstellung „So wird mein Wort sein“ knüpft deutlich an den Vergleich des vorhergehenden Verses an.
