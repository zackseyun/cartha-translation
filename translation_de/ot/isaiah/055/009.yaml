  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: de
  text: Denn wie der Himmel höher ist als die Erde,[a] so sind meine Wege höher als eure Wege und meine Gedanken höher als eure Gedanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Himmel“ steht in der Mehrzahl; möglich sind auch „die Himmel“ oder „der Himmel“ als kollektive Bezeichnung.
    reason: lexical_alternative
  - marker: b
    text: „Gedanken“ kann hier auch „Pläne“ oder „Absichten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und ist im Deutschen natürlich.
- source_word: גָבְהוּ שָׁמַיִם מֵאָרֶץ
  choice: so hoch der Himmel über der Erde ist
  rationale: Gibt den im Hebräischen durch מִן ausgedrückten Höhenvergleich idiomatisch wieder. Der deutsche Singular „Himmel“ bezeichnet hier den sichtbaren beziehungsweise himmlischen Raum kollektiv.
- source_word: כֵּן
  choice: so
  rationale: Bewahrt die knappe Vergleichsstruktur „so … so“ des poetischen Satzes.
- source_word: דְרָכַי
  choice: meine Wege
  rationale: Erhält das Bild für Gottes Handeln und Vorgehen, ohne es deutend einzuengen.
- source_word: מִדַּרְכֵיכֶם
  choice: über euren Wegen
  rationale: Setzt den räumlichen Höhenvergleich aus der ersten Vershälfte fort und klingt im Deutschen natürlicher als „höher als eure Wege“.
- source_word: וּמַחְשְׁבֹתַי
  choice: und meine Gedanken
  rationale: Bewahrt die lexikalische Weite von מַחֲשָׁבוֹת, das Gedanken, Pläne oder Absichten bezeichnen kann, und hält den Bezug zu Vers 8 aufrecht.
- source_word: מִמַּחְשְׁבֹתֵיכֶם
  choice: über euren Gedanken
  rationale: Die ausgelassene Wiederholung von „so hoch sind“ entspricht dem knappen hebräischen Parallelismus und bleibt im Deutschen eindeutig.
theological_decisions:
- issue: Bildhafter Vergleich göttlicher und menschlicher Wege und Gedanken
  choice: Die direkten Bilder „meine Wege“ und „meine Gedanken“ bleiben erhalten.
  alternative: „meine Art zu handeln“ und „meine Pläne“
  rationale: Eine erklärende Paraphrase würde die Aussage auf Handlungsweise oder Planung verengen. Die Bildsprache wahrt die Spannung zwischen Gottes Erhabenheit und menschlicher Begrenztheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Konstruktion „hoch … über“ führt das räumliche Bild durch alle drei Vergleiche fort; „euren“ entspricht der pluralischen Anrede im Hebräischen.
