  source_fidelity: Die Vergleichsstruktur von כִּי … כֵּן und die drei durch מִן markierten Komparative werden am klarsten mit „wie …, so … höher als …“ wiedergegeben. Die Anrede bleibt zu Recht pluralisch („eure“).
  naturalness: Die vorliegende Formulierung „so hoch der Himmel über der Erde ist, so hoch sind … über“ ist zwar verständlich, wirkt jedoch elliptisch und weniger idiomatisch als die reguläre deutsche Vergleichsform „wie … höher als …, so … höher als …“.
  terminology: „Wege“ und „Gedanken“ sind treffend und bewahren die poetische Metaphorik sowie die semantische Weite von מַחְשָׁבוֹת. „Himmel“ im deutschen Singular ist als kollektiver Ausdruck natürlich, obwohl das Hebräische formal Plural hat.
