source:
  edition: WLC
  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: de
  text: Anstelle des Dornstrauchs[a] wird eine Zypresse[b] aufwachsen, anstelle der Brennnessel[c] wird eine Myrte aufwachsen. Dies wird Yahweh zum Ruhm[d] und zu einem ewigen Zeichen, das nicht abgeschnitten wird.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das genaue dornige Gewächs, das mit dem hebräischen Wort bezeichnet wird, ist nicht sicher bestimmbar.
    reason: lexical_alternative
  - marker: b
    text: Oder „Tanne“ beziehungsweise eine andere immergrüne Baumart; die genaue Bedeutung des hebräischen Wortes ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: Oder „Gestrüpp“, „Brombeerstrauch“ beziehungsweise eine andere lästige Wildpflanze; die genaue Pflanzenart ist unsicher.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „zum Namen“; gemeint ist ein bleibender Ruhm oder ein Gedächtnis.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „das nicht beseitigt wird“; wörtlich: „das nicht abgeschnitten wird“.'
    reason: literal_rendering
lexical_decisions:
- source_word: תַּחַת
  choice: anstelle
  rationale: Die Präposition bezeichnet hier im poetischen Parallelismus den Ersatz schädlicher Gewächse durch wertvolle Bäume, nicht eine räumliche Lage.
- source_word: נַּעֲצוּץ
  choice: Dornstrauch
  rationale: Das Wort bezeichnet eine dornige Pflanze unbekannter genauer Art. „Dornstrauch“ ist verständlich und vermeidet botanische Überpräzision.
- source_word: בְרוֹשׁ
  choice: Zypresse
  rationale: Die genaue Baumart ist umstritten; „Zypresse“ ist eine verbreitete, im Kontext passende Wiedergabe für einen stattlichen immergrünen Baum.
- source_word: סִּרְפַּד
  choice: Brennnessel
  rationale: Die Pflanzenart ist unsicher. „Brennnessel“ gibt ein unerwünschtes, reizendes Wildgewächs wieder und bewahrt den Gegensatz zur Myrte.
- source_word: הֲדַס
  choice: Myrte
  rationale: „Myrte“ ist die allgemein anerkannte Identifikation und die übliche deutsche Bezeichnung.
- source_word: יַעֲלֶה
  choice: wird … aufwachsen
  rationale: Die Form bezeichnet das Empor- oder Hervorwachsen und passt natürlich zum Bild der neu aufkommenden Bäume.
- source_word: וְהָיָה
  choice: Dies wird
  rationale: Das maskuline Singularverb fasst wahrscheinlich die gesamte zuvor geschilderte Verwandlung als ein Geschehen oder Ergebnis zusammen.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben; die Präposition ל wird zusammen mit den folgenden Ausdrücken durch „zum/zu einem“ ausgedrückt.
- source_word: לְשֵׁם
  choice: zum Ruhm
  rationale: Wörtlich steht „zum Namen“. In diesem Zusammenhang bezeichnet der hebräische Ausdruck Ansehen, Ruhm oder ein bleibendes Gedächtnis; „zum Ruhm“ ist im modernen Deutsch klar.
- source_word: לְאוֹת עוֹלָם
  choice: zu einem ewigen Zeichen
  rationale: Die Wiedergabe bewahrt sowohl den öffentlichen Zeichencharakter von אוֹת als auch die dauerhafte Geltung von עוֹלָם.
- source_word: לֹא יִכָּרֵת
  choice: das niemals beseitigt wird
  rationale: כרת bedeutet wörtlich „abschneiden“. Bei einem Zeichen drückt „beseitigt werden“ die gemeinte Unaufhebbarkeit natürlich aus; die wörtliche Bildsprache wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. „Yahweh“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Singulars וְהָיָה
  choice: „Dies“ bezieht sich zusammenfassend auf die geschilderte Verwandlung
  alternative: Bezug auf einen einzelnen zuvor genannten Baum
  rationale: Der Singular kann grammatisch knapp wirken; im poetischen Zusammenhang liegt eine zusammenfassende Rückschau auf das gesamte Wiederherstellungsgeschehen näher, ohne einen einzelnen Baum zum Zeichen zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Anstelle“ und die zweimalige Formulierung „wird … aufwachsen“ bilden die Struktur des Hebräischen ab. Unsichere Pflanzenbestimmungen werden im Haupttext lesbar wiedergegeben und in den Fußnoten ausdrücklich offengehalten.
