  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und Abfolge zuverlässig wieder: emphatisches הֵן, die bewusste Gegenüberstellung der unbekannten Nationen, das zukünftige Rufen und Zulaufen sowie die Begründung durch Jahwe und seine Verherrlichung des Angeredeten. Der kollektive Singular „Nation“ wird im Deutschen korrekt im Singular fortgeführt, obwohl יָרוּצוּ im Hebräischen pluralisch steht. Die unentschiedene Referenz des singularischen Angeredeten bleibt angemessen offen.'
