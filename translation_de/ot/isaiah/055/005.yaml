  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: de
  text: Sieh, du wirst eine Nation rufen, die du nicht kennst, und eine Nation, die dich nicht kannte, wird zu dir laufen[a] – um Jahwes, deines Gottes, und des Heiligen Israels willen[b]; denn er hat dich verherrlicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird zu dir eilen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen Jahwe, deines Gottes, und wegen des Heiligen Israels“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn er hat dich geehrt“ oder „denn er hat dich mit Pracht geschmückt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Leitet eine nachdrückliche prophetische Ankündigung ein. „Sieh“ ist im modernen Deutschen verständlich und bewahrt den auffordernden Charakter.
- source_word: גּוֹי
  choice: Nation
  rationale: Bezeichnet hier eine politische oder ethnische Gemeinschaft. „Nation“ lässt die im Hebräischen nicht näher bestimmte Identität offen.
- source_word: לֹא תֵדַע
  choice: die du nicht kennst
  rationale: Das Imperfekt bezeichnet im zukunftsgerichteten Satz eine bestehende Nichtbekanntschaft; das Präsens ist im Deutschen idiomatisch.
- source_word: תִּקְרָא
  choice: du wirst ... rufen
  rationale: Bewahrt die Grundbedeutung von קרא und den Zukunftsbezug, ohne die stärkere Deutung „herbeirufen“ zwingend einzutragen.
- source_word: לֹא יְדָעוּךָ
  choice: die dich nicht kannte
  rationale: Das Perfekt bezeichnet die bisherige Nichtbekanntschaft vor dem künftigen Zulaufen. Der deutsche Singular richtet sich nach „Nation“.
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: wird zu dir laufen
  rationale: Gibt die konkrete und dynamische Bewegung von רוץ wieder. Wegen des kollektiven Singulars „Nation“ steht das Verb im Deutschen im Singular.
- source_word: לְמַעַן
  choice: um ... willen
  rationale: Kann hier Beweggrund bzw. Ursache ausdrücken. „Um ... willen“ bewahrt die mögliche Nuance „deinetwegen/zugunsten von“ besser als eine ausschließlich kausale Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Entspricht der Konstruktion mit Suffix; der Genitiv ist durch die Wendung „um ... willen“ bedingt.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: und des Heiligen Israels
  rationale: Führt die parallele Bezeichnung mit derselben von לְמַעַן abhängigen Präposition fort, ohne das Verhältnis der beiden Gottesbezeichnungen weiter auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: Leitet den erklärenden Grund ein und passt zum würdevollen prophetischen Register.
- source_word: פֵאֲרָךְ
  choice: er hat dich verherrlicht
  rationale: Das Piel von פאר kann schmücken, ehren oder verherrlichen bedeuten. „Verherrlicht“ umfasst hier öffentliche Auszeichnung und Glanz, lässt aber Alternativen zu.
theological_decisions:
- issue: Bezug der Pronomen in der zweiten Person Singular
  choice: Die direkte Anrede „du/dich/dir“ bleibt ohne nähere Identifizierung erhalten.
  alternative: Den Angeredeten ausdrücklich als Zion/Jerusalem, Israel oder eine davidische Gestalt bestimmen.
  rationale: Der hebräische Text nennt den Bezug in diesem Vers nicht ausdrücklich. Die Übersetzung soll diese exegetische Spannung nicht auflösen.
- issue: Verhältnis von „Jahwe, dein Gott“ und „der Heilige Israels“
  choice: Die mit וְ koordinierte Parallelformulierung wird mit „und“ wiedergegeben.
  alternative: Appositionale Wiedergabe, etwa „Jahwe, dein Gott, der Heilige Israels“.
  rationale: Die beiden Benennungen beziehen sich sachlich auf denselben Gott, doch die hebräische Koordination wird formal bewahrt, ohne die Syntax stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Der kollektive Singular „Nation“ wird grammatisch im Singular fortgeführt. Die Anrede bleibt bewusst mehrdeutig; Gedankenstrich und Semikolon strukturieren den langen Satz, ohne seine Parallelität aufzulösen.
