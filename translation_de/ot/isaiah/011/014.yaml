source:
  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: de
  text: Sie werden sich auf die Flanke der Philister im Westen stürzen[a]; gemeinsam werden sie die Söhne des Ostens plündern[b]. Gegen Edom und Moab werden sie ihre Hand ausstrecken[c], und die Ammoniter werden ihnen gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die Schulter der Philister meerwärts“. „Schulter“ kann hier eine Seite, einen Abhang oder eine Flanke bezeichnen; „meerwärts“ bedeutet westwärts.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne des Ostens“ bezeichnet die Völker oder Bewohner östlich von Israel.
    reason: cultural_note
  - marker: c
    text: 'Die hebräische Wendung lautet knapp: „Edom und Moab [werden] das Ausstrecken ihrer Hand“. Sie kann die gegen sie gerichtete Machtausübung oder ihre Unterwerfung bezeichnen. Möglich ist auch: „Edom und Moab werden unter ihrer Hand sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָפוּ
  choice: sie werden sich … stürzen
  rationale: Das Verb bedeutet wörtlich „fliegen“. Im militärischen Zusammenhang bezeichnet es hier einen schnellen, an einen herabstoßenden Vogel erinnernden Angriff; „sich stürzen“ gibt dieses Bild in natürlichem Deutsch wieder.
- source_word: בְכָתֵף פְּלִשְׁתִּים יָמָּה
  choice: auf die Flanke der Philister im Westen
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, kann geografisch oder militärisch aber eine Seite bzw. Flanke bezeichnen. יָמָּה heißt wörtlich „meerwärts“ und bezeichnet aus israelitischer Perspektive den Westen.
- source_word: יַחְדָּו יָבֹזּוּ
  choice: gemeinsam werden sie … plündern
  rationale: Die Wiedergabe bewahrt sowohl das vereinte Handeln als auch die ausdrückliche militärische Bedeutung von בזז.
- source_word: בְּנֵי קֶדֶם
  choice: die Söhne des Ostens
  rationale: Die formnahe Wiedergabe bewahrt die Bildsprache des Hebräischen; gemeint sind die Völker bzw. Bewohner östlich von Israel.
- source_word: אֱדוֹם וּמוֹאָב מִשְׁלוֹחַ יָדָם
  choice: Nach Edom und Moab werden sie ihre Hand ausstrecken
  rationale: Die hebräische Nominalfügung ist stark verdichtet und bezeichnet das Ausstrecken bzw. Ausüben ihrer Macht gegen Edom und Moab. Die deutsche Verbalfassung ist verständlich, ohne das gewaltsame Herrschaftsbild abzuschwächen.
- source_word: וּבְנֵי עַמּוֹן מִשְׁמַעְתָּם
  choice: und die Ammoniter werden ihnen gehorchen
  rationale: מִשְׁמַעַת bezeichnet Gehorsam bzw. Unterordnung. „Ammoniter“ ist die natürliche deutsche Wiedergabe des wörtlichen Ausdrucks „Söhne Ammons“.
theological_decisions:
- issue: Soll die Eroberungs- und Unterwerfungsbildsprache abgeschwächt werden?
  choice: Die militärischen Aussagen bleiben mit „sich stürzen“, „plündern“, „ihre Hand ausstrecken“ und „gehorchen“ ausdrücklich erhalten.
  alternative: Die Aussagen allgemein als politischen Einfluss oder Vorrang wiedergeben.
  rationale: Der hebräische Text spricht deutlich von Angriff, Plünderung, Machtausübung und Gehorsam. Der prophetische Zusammenhang rechtfertigt keine Abschwächung dieser Spannung.
- issue: Deutung der Wendung מִשְׁלוֹחַ יָדָם
  choice: Als Ausstrecken ihrer Hand nach Edom und Moab wiedergegeben.
  alternative: „Edom und Moab werden unter ihrer Hand sein“ oder formnah „Edom und Moab werden das Ausstrecken ihrer Hand sein“.
  rationale: Die hebräische Wendung ist verdichtet und lässt sowohl das Ergreifen bzw. Angreifen als auch die daraus folgende Unterwerfung anklingen. Die Hauptfassung bleibt idiomatisch; die Fußnote bewahrt die Übersetzungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem prophetischen Parallelismus nahe, während schwer verständliche hebräische Wendungen im Haupttext idiomatisch und in den Fußnoten formnah wiedergegeben werden.
