source:
  edition: WLC
  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: de
  text: Sie werden auf meinem ganzen heiligen Berg weder Schaden anrichten noch Verderben bringen; denn die Erde[a] wird voll sein von der Erkenntnis Jahwes, wie Wasser das Meer bedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“.'
    reason: אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten; im Kontext ist wegen des umfassenden Vergleichs „Erde“ gewählt.
lexical_decisions:
- source_word: יָרֵעוּ
  choice: nichts Böses tun
  rationale: Das Hifil von רעע bezeichnet hier schädigendes bzw. böses Handeln. Die deutsche Wendung ist natürlich und passt zum parallelen „zerstören“, ohne den Sinn auf körperliche Verletzung zu verengen.
- source_word: יַשְׁחִיתוּ
  choice: nichts zerstören
  rationale: Das Hifil von שׁחת bedeutet gewöhnlich „zerstören, zugrunde richten“. „Zerstören“ ist im Deutschen direkt und gibt den kausativen Sinn angemessen wieder.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: auf meinem ganzen heiligen Berg
  rationale: ב wird bei einem Berg idiomatisch mit „auf“ wiedergegeben; כָל bezieht sich auf den ganzen Bereich des heiligen Berges.
- source_word: מָלְאָה
  choice: wird erfüllt sein
  rationale: Das Perfekt wird im prophetischen Zusammenhang futurisch verstanden. „Wird erfüllt sein“ bewahrt das Bild eines vollständig von Erkenntnis erfüllten Raumes.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der umfassende Horizont und das folgende Meeresbild sprechen im Kontext für „Erde“, ohne die lexikalische Alternative zu verschweigen.
- source_word: דֵּעָה אֶת יְהוָה
  choice: die Erkenntnis Jahwes
  rationale: Die Wendung bezeichnet auf Jahwe gerichtete, relationale Erkenntnis und nicht bloß Wissen über ihn. Der Genitiv ist im Deutschen knapp und bewahrt diese Offenheit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: wie das Wasser das Meer bedeckt
  rationale: Die natürliche deutsche Kollektivform „Wasser“ gibt מַיִם idiomatisch wieder; der Partizipialsatz wird als allgemeingültiger Vergleich formuliert.
theological_decisions:
- issue: Reichweite der Friedensverheißung
  choice: „die Erde“ mit universaler Reichweite
  alternative: „das Land“, möglicherweise das Land Israel
  rationale: Der expansive Vergleich mit dem vom Wasser bedeckten Meer legt eine universale Lesart nahe. Da אֶרֶץ beide Bedeutungen zulässt, wird die örtlich begrenztere Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben bleiben konkret; der prophetische Zukunftsbezug und die mögliche Mehrdeutigkeit von אֶרֶץ werden erhalten.
