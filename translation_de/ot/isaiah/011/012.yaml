source:
  edition: WLC
  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: de
  text: Er wird ein Feldzeichen für die Nationen aufrichten und die Vertriebenen Israels sammeln; die Zerstreuten Judas wird er von den vier Enden der Erde zusammenbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den vier Flügeln der Erde“. Das hebräische Wort für „die Zerstreuten“ steht in der weiblichen Mehrzahl, bezieht sich hier aber wahrscheinlich kollektiv auf die zerstreuten Angehörigen Judas.'
    reason: Die Fußnote bewahrt sowohl das hebräische Rand- beziehungsweise Flügelbild als auch die grammatische Besonderheit von נְפֻצוֹת, ohne daraus im Haupttext einen ausschließlich weiblichen Personenkreis abzuleiten.
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: Er wird ein Feldzeichen … aufrichten
  rationale: נשא mit נֵס bezeichnet das sichtbare Aufrichten eines Sammelzeichens. „Feldzeichen“ bewahrt den konkreten Charakter eines erhöhten Zeichens und klingt im Deutschen würdevoll und verständlich.
- source_word: לַגּוֹיִם
  choice: für die Nationen
  rationale: גּוֹיִם bedeutet hier „Nationen“; ל bezeichnet die Nationen als Adressaten beziehungsweise Bezugspunkt des Zeichens.
- source_word: וְאָסַף נִדְחֵי יִשְׂרָאֵל
  choice: und die Vertriebenen Israels sammeln
  rationale: נדח bezeichnet Menschen, die fortgetrieben oder vertrieben wurden. „Vertriebene“ erhält diesen passiven Bedeutungsaspekt; אסף wird natürlich mit „sammeln“ wiedergegeben.
- source_word: וּנְפֻצוֹת יְהוּדָה יְקַבֵּץ
  choice: die Zerstreuten Judas wird er … zusammenbringen
  rationale: נְפֻצוֹת ist zwar formal feminin plural, bezeichnet im Parallelismus aber sehr wahrscheinlich kollektiv die zerstreuten Angehörigen Judas, nicht ausdrücklich Frauen. „die Zerstreuten Judas“ erhält die substantivische Form, ohne den Bezug sachlich auf Frauen zu verengen. קבץ wird zur natürlichen Unterscheidung von אסף mit „zusammenbringen“ wiedergegeben.
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: von den vier Enden der Erde
  rationale: כַּנְפוֹת bedeutet wörtlich „Flügel“, hier idiomatisch die äußersten Ränder. „Vier Enden der Erde“ gibt das Bild verständlich wieder, ohne eine bestimmte Kosmologie vorauszusetzen.
theological_decisions:
- issue: Referenz des femininen Plurals נְפֻצוֹת
  choice: kollektive Wiedergabe als „die Zerstreuten Judas“
  alternative: „die zerstreuten Frauen Judas“
  rationale: Die feminine Form ist grammatisch echt, doch der Parallelismus mit „den Vertriebenen Israels“ und der kollektive Bezug auf Juda sprechen gegen eine ausschließliche Aussage über Frauen. Die Form wird in einer Fußnote dokumentiert, ohne den Vers im Haupttext sachlich zu verengen.
- issue: Reichweite von הָאָרֶץ
  choice: „Erde“
  alternative: „Land“
  rationale: Die Erwähnung der Nationen und der vier äußersten Enden legt in diesem Zusammenhang den weiteren räumlichen Horizont „Erde“ nahe; „Land“ bleibt lexikalisch möglich, passt hier aber weniger gut zum Gesamtbild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält den Parallelismus zwischen Israel und Juda; „Feldzeichen“, „Vertriebene“ und „Zerstreute“ bewahren die prophetische Bildsprache, ohne unnötig altertümlich zu wirken.
