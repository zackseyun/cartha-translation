source:
  edition: WLC
  text: וּ/פָרָ֤ה וָ/דֹב֙ תִּרְעֶ֔ינָה יַחְדָּ֖ו יִרְבְּצ֣וּ יַלְדֵי/הֶ֑ן וְ/אַרְיֵ֖ה כַּ/בָּקָ֥ר יֹֽאכַל תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: de
  text: Kuh und Bärin werden weiden[a]; ihre Jungen werden beieinander liegen, und der Löwe wird wie das Rind[b] Stroh fressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden fressen“. Das hebräische Verb kann allgemeiner die Nahrungsaufnahme bezeichnen; „weiden“ bewahrt hier das anschauliche Tierbild.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie das Vieh“. Das hebräische Wort בָּקָר kann sowohl Rindvieh als Gattung als auch ein einzelnes Rind bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרָה
  choice: Kuh
  rationale: פָרָה bezeichnet eine ausgewachsene weibliche Kuh beziehungsweise ein weibliches Rind. „Kuh“ ist hier die natürliche konkrete Entsprechung.
- source_word: וָדֹב
  choice: Bärin
  rationale: דֹב bedeutet „Bär“. Die feminine Verbform und das feminine Suffix, die Kuh und Bär gemeinsam aufnehmen, sprechen im Zusammenhang für eine Bärin; das Deutsche kann dieses Geschlecht ausdrücklich wiedergeben.
- source_word: תִּרְעֶינָה
  choice: werden weiden
  rationale: Das Qal von רעה bezeichnet hier das Fressen weidender Tiere. „Weiden“ erhält das konkrete Tierbild; die allgemeinere Wiedergabe „Nahrung suchen“ beziehungsweise „fressen“ bleibt als Alternative möglich.
- source_word: יַחְדָּו יִרְבְּצוּ
  choice: werden beieinander liegen
  rationale: יַחְדָּו bedeutet „zusammen“, und רבץ bezeichnet häufig das Lagern von Tieren. „Beieinander liegen“ gibt beide Elemente natürlich wieder und ordnet das Adverb entsprechend der hebräischen Satzgliederung den Jungen zu.
- source_word: יַלְדֵיהֶן
  choice: ihre Jungen
  rationale: Wörtlich sind es „ihre Kinder/Jungen“; bei Tieren ist „ihre Jungen“ die idiomatische deutsche Form.
- source_word: וְאַרְיֵה
  choice: und der Löwe
  rationale: אַרְיֵה ist die gewöhnliche Bezeichnung für einen Löwen.
- source_word: כַבָּקָר
  choice: wie das Rind
  rationale: בָּקָר kann Rindvieh als Gattung oder ein Rind im generischen Sinn bezeichnen. „Wie das Rind“ ergibt im Deutschen einen klaren Vergleich und bewahrt zugleich den Gattungscharakter.
- source_word: יֹאכַל
  choice: wird fressen
  rationale: Das Imperfekt steht in der prophetischen Zukunftsschilderung; bei einem Tier ist „fressen“ die natürliche deutsche Wortwahl.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: תֶּבֶן bezeichnet Stroh beziehungsweise als Tierfutter verwendetes Häckselstroh. „Stroh“ ist die klare und herkömmliche Entsprechung.
theological_decisions:
- issue: Art des geschilderten Tierfriedens
  choice: Der Vers wird als konkrete Schilderung einer versöhnten Schöpfung wiedergegeben, ohne festzulegen, ob die Erfüllung wörtlich, bildlich oder in beiderlei Sinn zu verstehen ist.
  alternative: Die Tierbilder ausschließlich auf politischen Frieden unter Menschen zu beziehen oder ausschließlich als zoologische Veränderung zu bestimmen.
  rationale: Der hebräische Text bietet ein anschauliches Bild friedlich zusammenlebender Tiere, entscheidet aber nicht ausdrücklich über die Art seiner Erfüllung. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einfacher, bildhafter Syntax. „Bärin“ nimmt die feminine Kongruenz des Hebräischen auf. „Beieinander liegen“ vermeidet eine schwerfällige Wortstellung und wahrt die Zuordnung von יַחְדָּו zum Lagern der Jungen.
