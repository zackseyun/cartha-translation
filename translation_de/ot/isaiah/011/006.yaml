source:
  edition: WLC
  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: de
  text: Der Wolf wird beim Lamm wohnen[a], und der Leopard wird beim Zicklein lagern. Kalb, Junglöwe und Masttier[b] werden beieinander sein, und ein kleiner Junge wird sie führen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird sich beim Lamm aufhalten“; das hebräische Verb kann auch den Aufenthalt eines Fremden oder Gastes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist ein gemästetes beziehungsweise wohlgenährtes Tier; traditionell auch: „Mastkalb“.'
    reason: lexical_clarification
  - marker: c
    text: 'Oder: „wird sie leiten“; das Verb kann beim Vieh auch „treiben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  choice: wird … wohnen
  rationale: Das Qal von גור bezeichnet das Wohnen oder Sich-Aufhalten, teils auch als Fremder. „Wohnen“ klingt im Deutschen natürlich und bewahrt das Bild friedlicher Nähe, ohne den möglichen Beiklang eines vorübergehenden Aufenthalts völlig festzuschreiben.
- source_word: זְאֵב
  choice: Wolf
  rationale: Die übliche und eindeutige deutsche Bezeichnung des Tieres.
- source_word: עִם
  choice: bei / beim
  rationale: Die Präposition bezeichnet Gemeinschaft beziehungsweise räumliche Nähe. „Beim“ ist hier idiomatisches Deutsch und lässt das friedliche Beieinander deutlich werden.
- source_word: כֶּבֶשׂ
  choice: Lamm
  rationale: Das Wort kann ein Schaf beziehungsweise ein junges Schaf bezeichnen. Im poetischen Gegensatz zum Wolf gibt „Lamm“ das Bild des schutzlosen Beutetiers treffend wieder.
- source_word: וְנָמֵר
  choice: Leopard
  rationale: Die gängige Wiedergabe der Tierbezeichnung.
- source_word: גְּדִי
  choice: Zicklein
  rationale: Das Wort bezeichnet eine junge Ziege. „Zicklein“ ist im modernen Deutsch klar, knapp und anschaulich.
- source_word: יִרְבָּץ
  choice: wird … lagern
  rationale: רבץ bezeichnet bei Tieren das Niederlegen, Lagern oder Ruhen. „Lagern“ bewahrt den poetischen Ton und vermeidet die ausschließlich räuberische Konnotation von „kauern“.
- source_word: וְעֵגֶל
  choice: Kalb
  rationale: Die normale deutsche Entsprechung für ein junges Rind.
- source_word: וּכְפִיר
  choice: Junglöwe
  rationale: כפיר bezeichnet einen jungen Löwen. „Junglöwe“ ist präzise und für prophetische Poesie angemessen.
- source_word: וּמְרִיא
  choice: Masttier
  rationale: מְרִיא bezeichnet ein gemästetes beziehungsweise wohlgenährtes Tier, ohne die Tierart ausdrücklich zu nennen. „Masttier“ vermeidet daher die in „Mastkalb“ enthaltene zusätzliche Festlegung.
- source_word: יַחְדָּו
  choice: werden beieinander sein
  rationale: Das Adverb bedeutet „zusammen“. Die ergänzte Kopula ergibt im Deutschen einen vollständigen, natürlichen Satz und kennzeichnet das friedliche Beisammensein.
- source_word: וְנַעַר קָטֹן
  choice: ein kleiner Junge
  rationale: נַעַר bezeichnet hier einen Jungen, und קָטֹן hebt seine Kleinheit beziehungsweise Jugend hervor. Die Formulierung bewahrt das grammatische Geschlecht und die Anschaulichkeit.
- source_word: נֹהֵג בָּם
  choice: wird sie führen
  rationale: נהג kann „führen“, „leiten“ oder Tiere „treiben“ bedeuten. „Führen“ passt zur friedlichen Szene, ohne über die Art der Leitung hinauszugehen.
theological_decisions:
- issue: Charakter der Tierfriedensbilder
  choice: Die Tierpaare werden als konkrete prophetisch-poetische Bilder wiedergegeben, ohne ihre Erfüllungsweise zu bestimmen.
  alternative: Die Bilder ausdrücklich entweder als wörtliche endzeitliche Veränderung der Tierwelt oder ausschließlich als Metapher für menschlich-politischen Frieden auszulegen.
  rationale: Der hebräische Text nennt Tiere und ihre Handlungen unmittelbar, erklärt aber nicht, auf welcher Deutungsebene die Szene erfüllt wird. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die parallelen Tiergruppen und das Zukunftsmoment des Hebräischen bleiben erhalten. Seltene oder missverständliche Bedeutungsnuancen werden in Fußnoten erläutert, ohne die Hauptzeile zu überladen.
