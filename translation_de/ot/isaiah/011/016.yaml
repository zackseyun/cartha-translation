source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: de
  text: Und für den Rest seines Volkes, der aus Assyrien übrig bleibt, wird es eine Straße geben, wie es sie für Israel gab an dem Tag, als es aus dem Land Ägypten heraufzog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „am Tag seines Heraufziehens aus dem Land Ägypten“; gemeint ist Israels Auszug aus Ägypten.'
    reason: Die Fußnote dokumentiert die substantivischere hebräische Infinitivkonstruktion und erläutert den kollektiven Bezug des Suffixes.
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird es ... geben
  rationale: Das Waw mit Qatal bezeichnet hier im prophetischen Zusammenhang eine zukünftige Folge; die deutsche Konstruktion gibt diesen Zukunftssinn natürlich wieder.
- source_word: מְסִלָּה
  choice: eine Straße
  rationale: Das Wort bezeichnet eine gebahnte, teils erhöhte Straße. „Straße“ bewahrt das Bild eines vorbereiteten Rückwegs, ohne moderne Autobahnvorstellungen zu wecken.
- source_word: לִשְׁאָר עַמּוֹ
  choice: für den Rest seines Volkes
  rationale: „Rest“ gibt den wichtigen jesajanischen Leitbegriff שְׁאָר knapp und verständlich wieder; das Possessivpronomen bleibt ohne ausdrückliche Identifizierung seines Bezugs erhalten.
- source_word: אֲשֶׁר יִשָּׁאֵר
  choice: der ... übrig bleibt
  rationale: Der maskuline Singular entspricht dem kollektiven Singular „Rest“ und bewahrt die Wortverbindung zwischen שְׁאָר und dem Verb שׁאר.
- source_word: מֵאַשּׁוּר
  choice: von Assur
  rationale: Die Präposition מן bezeichnet Herkunft beziehungsweise Ausgangspunkt; „Assur“ ist die im deutschen Bibelregister übliche Bezeichnung für Reich und Gebiet.
- source_word: כַּאֲשֶׁר הָיְתָה
  choice: wie es sie ... gab
  rationale: Die ergänzte pronominale Aufnahme von „Straße“ macht die hebräische Ellipse im Deutschen klar und erhält den Vergleich.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Der kollektive Eigenname wird unmittelbar beibehalten.
- source_word: בְּיוֹם עֲלֹתוֹ
  choice: an dem Tag, als es ... heraufzog
  rationale: Die Zeitangabe und das Verb „heraufziehen“ bewahren die Formulierung des Exodusmotivs; das deutsche Neutrum „es“ bezieht sich grammatisch auf Israel.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die volle Wendung erhält die vertraute Exodusformel des Hebräischen.
theological_decisions:
- issue: Bezug von „seines Volkes“
  choice: Das schlichte Possessivpronomen „seines“ bleibt stehen.
  alternative: „das Volk des HERRN“ oder „das Volk des Messias“
  rationale: Der Vers nennt den Bezug des Suffixes nicht ausdrücklich. Eine namentliche Festlegung würde die im Kontext verbleibende Spannung auflösen.
- issue: Numerus und Bezug in עֲלֹתוֹ
  choice: „als es ... heraufzog“, mit Israel als kollektivem Bezug
  alternative: „bei seinem Heraufziehen“ oder „als er heraufzog“
  rationale: Das Suffix ist maskulin singular und bezieht sich am naheliegendsten auf das kollektive Israel. Das neutrale deutsche Pronomen folgt dem grammatischen Geschlecht von „Israel“ und vermeidet einen missverständlichen Personenbezug.
- issue: Exodustypologie
  choice: Der historische Vergleich mit Israels Auszug wird ohne deutende Erweiterung wiedergegeben.
  alternative: Ausdrückliche Bezeichnung als „neuer“ oder „zweiter Exodus“
  rationale: Der hebräische Text stellt eine Analogie her, verwendet aber keine solche theologische Benennung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rest“ und „Assur“ erhalten das etablierte prophetische Register; „Straße“ ist verständlich und vermeidet den an eine moderne Schnellstraße gebundenen Klang von „Autobahn“.
