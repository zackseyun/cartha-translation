  text: וְ/הָ֥יָה צֶ֖דֶק אֵז֣וֹר מָתְנָ֑י/ו וְ/הָ/אֱמוּנָ֖ה אֵז֥וֹר חֲלָצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: de
  text: Gerechtigkeit[a] wird der Gürtel um seine Hüften sein, und Treue[b] der Gürtel um seine Lenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Recht oder Rechtschaffenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Beständigkeit oder Verlässlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird … sein
  rationale: Das Qal-Perfekt mit וְ steht im prophetischen Zusammenhang mit Zukunftsbezug. Die deutsche Konstruktion gibt diesen Sinn natürlich wieder; die einleitende Konjunktion wird durch den Zusammenhang und das „und“ im parallelen zweiten Glied hinreichend abgebildet.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Der Ausdruck bezeichnet sowohl persönliche Rechtschaffenheit als auch gerechtes Handeln. „Gerechtigkeit“ bewahrt diese Bedeutungsweite und passt zur Charakterisierung des angekündigten Herrschers.
- source_word: אֵזוֹר
  choice: Gürtel
  rationale: „Gürtel“ ist eine konkrete, heutige Bezeichnung für das um den Körper Gebundene und bewahrt das Bild des hebräischen Textes ohne archaische Färbung.
- source_word: מָתְנָיו
  choice: um seine Hüften
  rationale: מָתְנַיִם bezeichnet den Hüft- beziehungsweise Taillenbereich. Die Formulierung ist im Deutschen anschaulich und unterscheidet dieses Körperwort vom parallelen חֲלָצָיו.
- source_word: וְהָאֱמוּנָה
  choice: und Treue
  rationale: אֱמוּנָה bezeichnet hier Festigkeit, Verlässlichkeit und Treue als bleibende Eigenschaft des Herrschers. „Treue“ ist prägnant und idiomatisch.
- source_word: אֵזוֹר
  choice: der Gürtel
  rationale: Die Wiederholung erhält den markanten Parallelismus des hebräischen Verses.
- source_word: חֲלָצָיו
  choice: um seine Lenden
  rationale: חֲלָצַיִם bezeichnet die Lenden- beziehungsweise Hüftgegend. „Lenden“ bewahrt die traditionelle Körpermetapher und hält die poetische Unterscheidung zu מָתְנָיו aufrecht.
theological_decisions:
- issue: Die beiden Tugenden in der Verheißung über den kommenden Herrscher
  choice: „Gerechtigkeit“ und „Treue“ werden als Eigenschaften des Herrschers wiedergegeben, ohne sie dogmatisch weiter auszudeuten.
  alternative: צֶדֶק enger als „Recht“ und אֱמוּנָה als „Beständigkeit“ wiederzugeben.
  rationale: Der Vers zeichnet die sittliche und regierende Verlässlichkeit des angekündigten Herrschers im Bild eines Gürtels. Die Übersetzung wahrt dieses Bild und die Bedeutungsbreite, ohne spätere christologische oder systematisch-theologische Aussagen in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die zweimalige Nennung des Gürtels bleiben erhalten; „Hüften“ und „Lenden“ bilden die beiden nah verwandten, aber unterschiedlichen hebräischen Körperbezeichnungen ab.
