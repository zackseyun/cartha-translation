source:
  edition: WLC
  text: וְ/סָ֨רָה֙ קִנְאַ֣ת אֶפְרַ֔יִם וְ/צֹרְרֵ֥י יְהוּדָ֖ה יִכָּרֵ֑תוּ אֶפְרַ֨יִם֙ לֹֽא יְקַנֵּ֣א אֶת יְהוּדָ֔ה וִֽ/יהוּדָ֖ה לֹֽא יָצֹ֥ר אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: de
  text: Ephraims Eifersucht wird weichen[a], und die Feinde Judas werden ausgerottet; Ephraim wird nicht auf Juda eifersüchtig sein, und Juda wird Ephraim nicht bedrängen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ephraims Neid wird weichen“. Das hebräische Wort kann in diesem Zusammenhang Eifersucht, Neid oder rivalisierenden Eifer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Juda wird Ephraim nicht feindlich behandeln“ beziehungsweise „nicht unterdrücken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: wird weichen
  rationale: Das Verb סור beschreibt hier mit „Eifersucht“ als Subjekt deren Verschwinden. „Wird weichen“ bewahrt das hebräische Bild und klingt im Deutschen natürlich und würdig.
- source_word: קִנְאַת / יְקַנֵּא
  choice: Eifersucht / eifersüchtig sein
  rationale: קנא/קנאה kann Eifersucht, Neid oder leidenschaftlichen Eifer bezeichnen. Im Zusammenhang der Rivalität zwischen Ephraim und Juda passt „Eifersucht“ gut; die mögliche Nuance „Neid“ wird in der Fußnote bewahrt.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt erhalten, auch wenn er hier zugleich für das Nordreich beziehungsweise dessen Bevölkerung stehen kann.
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: die Feinde Judas
  rationale: Das Partizip bezeichnet Menschen, die Juda feindlich gegenüberstehen oder bedrängen. „Feinde“ ist verständlich und legt die konkrete Form ihrer Feindschaft nicht unnötig fest.
- source_word: יִכָּרֵתוּ
  choice: werden ausgerottet
  rationale: Das Nifal von כרת bedeutet „abgeschnitten/ausgerottet werden“. „Ausgerottet werden“ gibt die starke Aussage idiomatisch wieder, ohne die Handelnden zu ergänzen.
- source_word: לֹא יְקַנֵּא אֶת יְהוּדָה
  choice: wird nicht mehr auf Juda eifersüchtig sein
  rationale: Die Wendung setzt die eingangs genannte rivalisierende Eifersucht fort. „Nicht mehr“ bringt im Deutschen die durch den angekündigten Wandel implizierte Beendigung natürlich zum Ausdruck.
- source_word: לֹא יָצֹר אֶת אֶפְרָיִם
  choice: wird Ephraim nicht mehr bedrängen
  rationale: Das Verb kann feindlich behandeln, bedrängen oder unterdrücken bedeuten. „Bedrängen“ bewahrt die aktive Feindseligkeit, ohne sie auf Belagerung, Krieg oder politische Unterdrückung zu verengen.
- source_word: וִיהוּדָה
  choice: und Juda
  rationale: Der Eigenname und die Konjunktion werden beibehalten, sodass der ausgewogene Parallelismus zwischen Ephraim und Juda sichtbar bleibt.
theological_decisions:
- issue: Bezug von Ephraim und Juda
  choice: Die Stammes- und Reichsnamen „Ephraim“ und „Juda“ bleiben unverändert stehen.
  alternative: „das Nordreich“ und „das Südreich“ oder „Israel“ und „Juda“
  rationale: Der hebräische Text nennt Ephraim und Juda ausdrücklich. Die Namen bewahren den poetischen und historischen Gehalt und vermeiden eine interpretierende Ausweitung im Haupttext.
- issue: Art der künftigen Versöhnung
  choice: Der Text beschreibt das Ende wechselseitiger Rivalität und Feindseligkeit, ohne deren geschichtliche oder endzeitliche Verwirklichung näher zu bestimmen.
  alternative: Eine ausdrückliche Deutung als ausschließlich historische Wiedervereinigung oder als ausschließlich endzeitliches Geschehen
  rationale: Der Vers selbst formuliert die Aufhebung der Spannung zwischen Ephraim und Juda, legt aber an dieser Stelle keinen eindeutigen Zeitpunkt oder ein bestimmtes theologisches Erfüllungsschema fest.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der parallele Aufbau des hebräischen Verses bleibt erkennbar. „Nicht mehr“ ist eine natürliche deutsche Wiedergabe des angekündigten Endes der bisherigen Rivalität; die Eigennamen werden nicht erklärend ersetzt.
