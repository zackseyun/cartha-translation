id: ISA.11.2
reference: Isaiah 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: de
  text: 'Und der Geist Jahwes[a] wird auf ihm ruhen: ein Geist der Weisheit und der Einsicht[b], ein Geist des Rates und der Kraft, ein Geist der Erkenntnis und der Furcht Jahwes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder.
    reason: alternative_reading
  - marker: b
    text: 'Nach „dem Geist Jahwes“ wiederholt der hebräische Text dreimal das Wort „Geist“. Dadurch werden die Eigenschaften oder Wirkweisen dieses Geistes hervorgehoben: Weisheit und Einsicht, Rat und Kraft, Erkenntnis und die Furcht Jahwes.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ehrfurcht vor Jahwe“. Der hebräische Ausdruck umfasst ehrfürchtige Scheu und meint nicht bloßes Entsetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחָה עָלָיו
  choice: wird auf ihm ruhen
  rationale: נוח bezeichnet hier ein Sichniederlassen bzw. dauerhaftes Ruhen. Die Zukunftsform entspricht dem prophetischen Zusammenhang; „ruhen“ bewahrt den Gedanken einer bleibenden Gegenwart.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ bezeichnet in diesem Zusammenhang Gottes Geist, der den angekündigten Herrscher befähigt. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: ein Geist der Weisheit und der Einsicht
  rationale: Die Wendung erläutert appositionell den Geist Jahwes. חָכְמָה ist „Weisheit“; בִינָה bezeichnet verstehende Einsicht bzw. Urteilsvermögen, wofür „Einsicht“ im Deutschen prägnant und natürlich ist.
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: ein Geist des Rates und der Kraft
  rationale: עֵצָה bezeichnet im königlichen Zusammenhang weisen Rat und überlegtes Planen. גְבוּרָה meint Stärke oder Macht; „Kraft“ ergibt eine natürliche, würdige Wortverbindung, ohne den Sinn auf militärische Tapferkeit einzuengen.
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: ein Geist der Erkenntnis und der Furcht Jahwes
  rationale: דַּעַת wird als „Erkenntnis“ wiedergegeben. „Furcht Jahwes“ erhält die starke, theologisch vielschichtige Ausdrucksweise יִרְאַת יְהוָה und schwächt sie nicht stillschweigend zu bloßem Respekt ab.
theological_decisions:
- issue: Verhältnis der wiederholten רוּחַ-Wendungen zum Geist Jahwes
  choice: Die drei Wendungen werden als beschreibende Appositionen zum einen Geist Jahwes wiedergegeben.
  alternative: Sie könnten als Aufzählung mehrerer unterschiedener Geister oder geistlicher Gaben verstanden werden.
  rationale: Die hebräische Syntax nennt zuerst den Geist Jahwes und entfaltet danach mit dreimaligem רוּחַ dessen Eigenschaften oder Wirkweisen. Die Wiederholung bleibt sichtbar, ohne eine systematische Deutung als getrennte Wesen oder als festgelegte Siebenzahl aufzuzwingen.
- issue: Bedeutung von יִרְאַת יְהוָה
  choice: Furcht Jahwes
  alternative: Ehrfurcht vor Jahwe
  rationale: „Furcht“ bewahrt die lexikalische Kraft und die Spannung des hebräischen Weisheitsbegriffs; die Fußnote macht deutlich, dass ehrfürchtige Scheu mitgemeint ist und nicht bloße Angst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Dreigliederung. Die Wiederholung von „ein Geist“ folgt bewusst der hebräischen Form. „Jahwe“ erhält den persönlichen Gottesnamen; „Furcht“ wahrt die theologische Spannung des Ausgangstextes.
