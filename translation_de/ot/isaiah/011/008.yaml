source:
  edition: WLC
  text: וְ/שִֽׁעֲשַׁ֥ע יוֹנֵ֖ק עַל חֻ֣ר פָּ֑תֶן וְ/עַל֙ מְאוּרַ֣ת צִפְעוֹנִ֔י גָּמ֖וּל יָד֥/וֹ הָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
translation:
  language: de
  text: Der Säugling wird am Loch der Kobra[a] spielen, und das entwöhnte Kind wird seine Hand über die Höhle der Viper ausstrecken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Aspis. Das hebräische Wort bezeichnet eine Giftschlange, die traditionell als Aspis oder Kobra bestimmt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wird seine Hand auf die Höhle der Viper legen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: wird … spielen
  rationale: Das Verb bezeichnet hier das unbeschwerte Spielen eines kleinen Kindes in unmittelbarer Nähe einer sonst tödlichen Gefahr.
- source_word: יוֹנֵק
  choice: der Säugling
  rationale: Das Partizip bezeichnet ein Kind, das noch gestillt wird, und bewahrt den Gegensatz zum entwöhnten Kind im zweiten Halbvers.
- source_word: חֻר
  choice: Loch
  rationale: Das Substantiv bezeichnet ein Loch oder eine Öffnung und passt natürlich zum Aufenthaltsort einer Schlange.
- source_word: פָּתֶן
  choice: Kobra
  rationale: Das Wort bezeichnet eine Giftschlange, die traditionell als Aspis oder Kobra bestimmt wird; „Kobra“ ist für heutige Leser unmittelbar verständlich, ohne eine völlig sichere zoologische Bestimmung vorzutäuschen.
- source_word: מְאוּרַת
  choice: Höhle
  rationale: Das Wort bezeichnet hier den Unterschlupf beziehungsweise die Behausung der Schlange; „Höhle“ erhält zugleich die poetische Variation gegenüber „Loch“.
- source_word: צִפְעוֹנִי
  choice: Viper
  rationale: Gemeint ist eine giftige Schlange; „Viper“ ist eine klare moderne Entsprechung, ohne die Art zoologisch zu eng festzulegen.
- source_word: גָּמוּל
  choice: das entwöhnte Kind
  rationale: Die substantivierte Form bezeichnet ein bereits entwöhntes Kind und erhält den Entwicklungsunterschied zum Säugling.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die maskuline Singularform des Pronominalsuffixes wird im Deutschen grammatisch genau wiedergegeben.
- source_word: הָדָה
  choice: wird … ausstrecken
  rationale: Das seltene Verb beschreibt hier wahrscheinlich das Ausstrecken oder Hinhalten der Hand; diese Wiedergabe ist im Deutschen anschaulich und lässt die genaue Art der Bewegung offen.
theological_decisions:
- issue: Charakter des Friedensbildes
  choice: Das Bild außergewöhnlichen Friedens und vollkommener Sicherheit wird unmittelbar wiedergegeben, ohne festzulegen, ob es wörtlich, symbolisch oder in beiderlei Sinn zu verstehen ist.
  alternative: Das Bild ausdrücklich entweder als künftige buchstäbliche Verwandlung der Schöpfung oder ausschließlich als Sinnbild messianischen Friedens deuten.
  rationale: Der Vers selbst schildert poetisch, dass selbst kleine Kinder angesichts tödlicher Schlangen ungefährdet sind, entscheidet aber nicht die weitergehende Auslegungsfrage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Gegenüberstellung von „Säugling“ und „entwöhntem Kind“ sowie von „Loch“ und „Höhle“ bleibt erhalten. Die Zukunftsformen geben den prophetischen Kontext natürlich wieder; die Schlangenarten werden verständlich, aber ohne Anspruch auf zoologische Eindeutigkeit benannt.
