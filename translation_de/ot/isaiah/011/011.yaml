source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: de
  text: 'Und an jenem Tag wird der Herr zum zweiten Mal seine Hand ausstrecken[a], um den Rest seines Volkes zurückzugewinnen, der übrig bleibt: aus Assur, Ägypten, Patros, Kusch[b], Elam, Schinar und Hamat und aus den Küstenländern des Meeres[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird der Herr ein zweites Mal seine Hand hinzufügen, um … zu gewinnen“. Die hebräische Wendung bezeichnet ein erneutes machtvolles Eingreifen; möglich ist auch: „wird … seine Hand erneut ausstrecken, um … zu erwerben“.'
    reason: lexical_alternative
  - marker: b
    text: Kusch ist der hebräische Name für ein Gebiet südlich von Ägypten; es darf nicht ohne Weiteres mit dem heutigen Äthiopien gleichgesetzt werden.
    reason: cultural_note
  - marker: c
    text: 'Oder: „von den Inseln des Meeres“. Der hebräische Ausdruck kann sowohl Inseln als auch maritime Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Die prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben; die einleitende Zukunftsbedeutung ergibt sich aus dem folgenden Verb.
- source_word: יוֹסִיף אֲדֹנָי שֵׁנִית יָדוֹ
  choice: wird der Herr zum zweiten Mal seine Hand ausstrecken
  rationale: „Zum zweiten Mal“ gibt שֵׁנִית wieder; „seine Hand ausstrecken“ bewahrt das ausdrücklich anthropomorphe Bild. יוֹסִיף bezeichnet hier die Wiederholung der Handlung und wird zusammen mit שֵׁנִית idiomatisch ausgedrückt, ohne im Deutschen unnötig „wieder … zum zweiten Mal“ zu verdoppeln.
- source_word: לִקְנוֹת
  choice: zurückzugewinnen
  rationale: קנה bedeutet grundsätzlich erwerben oder gewinnen. Im Zusammenhang mit dem bereits zu Gott gehörenden „Rest seines Volkes“ bezeichnet es ein erneutes Gewinnen bzw. Zurückholen; „zurückzugewinnen“ ist im Deutschen natürlicher als „zu erwerben“, ohne die zusätzliche theologische Bedeutung von „zu erlösen“ einzutragen.
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: den Rest seines Volkes, der übrig geblieben ist
  rationale: Die Wortverwandtschaft und Wiederholung von „Rest“ und „übrig geblieben“ bleibt erkennbar; der Relativsatz bezieht sich grammatisch auf den singularischen „Rest“.
- source_word: מֵאַשּׁוּר ... וּמֵחֲמָת
  choice: aus Assur, Ägypten, Patros, Kusch, Elam, Schinar und Hamat
  rationale: Die historischen geografischen Namen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben und nicht mit modernen Staaten gleichgesetzt.
- source_word: מֵאִיֵּי הַיָּם
  choice: aus den Küstenländern des Meeres
  rationale: אִיִּים kann Inseln oder maritime Küstenländer bezeichnen. „Küstenländer“ passt zur weiträumigen geografischen Aufzählung, während die Alternative in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob לִקְנוֹת mit „erlösen“, „erwerben“ oder kontextuell „zurückgewinnen“ wiederzugeben ist
  choice: zurückzugewinnen
  alternative: zu erwerben; zu erlösen
  rationale: „Zurückzugewinnen“ verbindet den lexikalischen Kern des Gewinnens mit dem Kontext des verbliebenen Gottesvolkes. „Erlösen“ würde eine spezifische soteriologische Bedeutung eintragen, die das Verb für sich genommen nicht verlangt; „erwerben“ könnte im Deutschen fälschlich einen erstmaligen Besitzübergang nahelegen.
- issue: Ob das Bild von der Hand des Herrn beibehalten oder in eine reine Handlungsaussage aufgelöst wird
  choice: seine Hand ausstrecken
  alternative: den Rest seines Volkes zurückholen
  rationale: Das hebräische Bild wird ausdrücklich bewahrt und lässt die Art des göttlichen Eingreifens offen, statt sie paraphrasierend festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Register. Die Satzstruktur bleibt der hebräischen Aufzählung nahe, wird jedoch durch einen Doppelpunkt übersichtlich gegliedert. Historische Ortsnamen stehen in geläufigen deutschen Bibelformen; das Bild der ausgestreckten Hand und die Mehrdeutigkeit der maritimen Gebiete bleiben erhalten.
