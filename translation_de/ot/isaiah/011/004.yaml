source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: de
  text: Doch er wird die Armen gerecht richten[a] und den Demütigen der Erde mit Geradheit Recht sprechen[b]. Er wird die Erde[c] mit dem Stab seines Mundes schlagen und den Gottlosen[d] mit dem Atem seiner Lippen töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er wird die Armen in Gerechtigkeit richten.“'
    reason: Die Konjunktion kann schlicht „und“ bedeuten; צֶדֶק kann substantivisch mit „Gerechtigkeit“ wiedergegeben werden.
  - marker: b
    text: 'Oder: „den Sanftmütigen des Landes gerecht Recht sprechen“ oder: „für die Bedrängten der Erde ein gerechtes Urteil fällen“.'
    reason: עָנָו kann „demütig“, „sanftmütig“ oder „bedrängt“ und אֶרֶץ „Erde“ oder „Land“ bedeuten; das Verb hat hier richterlichen Sinn.
  - marker: c
    text: 'Oder: „das Land“.'
    reason: אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bezeichnen.
  - marker: d
    text: 'Oder: „den einen Gottlosen“. Der hebräische Singular kann allgemein für die Gottlosen stehen oder eine einzelne Gestalt bezeichnen.'
    reason: Die grammatische Form lässt eine generische wie eine individualisierte Lesart zu.
lexical_decisions:
- source_word: וְשָׁפַט בְּצֶדֶק
  choice: Doch er wird die Armen gerecht richten
  rationale: Das einleitende וְ wird wegen des Gegensatzes zu V. 3 mit „doch“ wiedergegeben. „Gerecht richten“ bringt den moralischen und rechtlichen Sinn von צֶדֶק in natürlichem Deutsch zum Ausdruck.
- source_word: דַּלִּים
  choice: die Armen
  rationale: דַּלִּים bezeichnet sozial Schwache, Bedürftige oder Arme; im Zusammenhang gerechter Herrschaft ist „die Armen“ klar und idiomatisch.
- source_word: וְהוֹכִיחַ בְּמִישׁוֹר
  choice: und … unparteiisch Recht verschaffen
  rationale: יכח im Hifil hat hier richterlichen Sinn, während מִישׁוֹר Geradheit und Unvoreingenommenheit bezeichnet. Die Formulierung vermeidet die missverständliche Bedeutung „zurechtweisen“.
- source_word: לְעַנְוֵי אָרֶץ
  choice: den Demütigen der Erde
  rationale: עָנָו kann demütig, sanftmütig oder bedrängt bedeuten. „Demütigen“ bewahrt die ethisch-soziale Bedeutungsbreite besser als eine rein wirtschaftliche oder innerliche Festlegung.
- source_word: וְהִכָּה אֶרֶץ
  choice: Er wird die Erde … schlagen
  rationale: נכה bedeutet „schlagen“; אֶרֶץ kann „Erde“ oder „Land“ heißen. „Erde“ passt zum weiten Horizont des Abschnitts, ohne die Alternative auszuschließen.
- source_word: בְּשֵׁבֶט פִּיו
  choice: mit dem Stab seines Mundes
  rationale: שֵׁבֶט bezeichnet Stab, Rute oder Zepter. „Stab“ erhält das Bild seines machtvollen, richtenden Wortes und die Parallele zum Atem seiner Lippen.
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: mit dem Atem seiner Lippen
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. In Verbindung mit den Lippen und parallel zum Mund ist „Atem“ der unmittelbarste bildliche Sinn.
- source_word: יָמִית רָשָׁע
  choice: den Gottlosen … töten
  rationale: Das Hifil von מות bedeutet „zu Tode bringen, töten“. Der hebräische Singular רָשָׁע bleibt im Deutschen singularisch und kann generisch verstanden werden; eine individualisierte Lesart bleibt möglich.
theological_decisions:
- issue: Reichweite von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: אֶרֶץ trägt beide Bedeutungen. „Erde“ entspricht dem umfassenden Horizont des Abschnitts; die mögliche territoriale Lesart wird in einer Fußnote bewahrt.
- issue: Bezug des singularischen רָשָׁע
  choice: der Gottlose, generisch verstanden
  alternative: der eine Gottlose, als individuelle Gestalt
  rationale: Der hebräische Singular kann einen Typus oder eine Gruppe repräsentieren, kann aber auch individualisiert gelesen werden. Die Übersetzung lässt den Singular stehen und entscheidet diese Spannung nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtssprache bleibt verständlich; die poetischen Körper- und Herrschaftsbilder „Stab seines Mundes“ und „Atem seiner Lippen“ werden bewusst erhalten. Alle Fußnotenmarker stehen unmittelbar bei den jeweils mehrdeutigen Formulierungen.
