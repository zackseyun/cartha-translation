source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: de
  text: An jenem Tag wird die Wurzel Isais dastehen als Feldzeichen für die Völker. Ihn werden die Nationen suchen, und sein Ruheort wird Herrlichkeit sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: die Wurzel Isais
  rationale: Bewahrt das markante hebräische Bild und die mögliche Spannung zwischen Ursprung und Nachkomme, statt es erklärend als »Spross« aufzulösen.
- source_word: עֹמֵד
  choice: dastehen
  rationale: Gibt das Partizip als anhaltendes, öffentlich sichtbares Stehen wieder.
- source_word: נֵס עַמִּים
  choice: Feldzeichen für die Völker
  rationale: נֵס bezeichnet ein weithin sichtbares Sammelzeichen; »Feldzeichen« ist im Deutschen konkreter als »Zeichen« und weniger modern-politisch als »Banner«.
- source_word: יִדְרֹשׁוּ
  choice: werden ... fragen
  rationale: דרש kann suchen, nachfragen oder sich an jemanden wenden bedeuten. »Nach ihm fragen« wahrt diese Offenheit besser als eine ausschließlich räumliche Wiedergabe.
- source_word: מְנֻחָתוֹ
  choice: sein Ruheort
  rationale: Das Nomen bezeichnet Ruhe beziehungsweise einen Ort der Ruhe; der Kontext erlaubt die konkrete Wiedergabe »Ruheort«, ohne dessen genaue Referenz festzulegen.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: Gibt das prädikativ gebrauchte Substantiv formal wieder und bewahrt die stärkere Aussage gegenüber dem abschwächenden Adjektiv »herrlich«.
theological_decisions:
- issue: Identität und zeitliche Einordnung der »Wurzel Isais«
  choice: Die bildhafte Bezeichnung bleibt ohne christologische oder historische Erläuterung im Vers stehen.
  alternative: Explizite Wiedergabe als »Nachkomme Isais« oder unmittelbare Benennung des Messias.
  rationale: Der hebräische Text verwendet bewusst das Bild der Wurzel; eine eindeutige Auslegung würde die im Text selbst vorhandene Bildspannung beseitigen.
- issue: Bedeutung der Hinwendung der Nationen
  choice: »Nach ihm werden die Nationen fragen«
  alternative: »Zu ihm werden die Nationen kommen« oder »ihn werden die Nationen suchen«.
  rationale: Die gewählte Form lässt offen, ob דרש primär das Suchen, Befragen oder die verehrende Hinwendung bezeichnet, und importiert keine spezifische Heilsordnung.
- issue: Prädikative Aussage über den Ruheort
  choice: »sein Ruheort wird Herrlichkeit sein«
  alternative: »sein Ruheort wird herrlich sein«.
  rationale: Das Hebräische hat das Substantiv כָּבוֹד, nicht ein Adjektiv. Die nominale Form bewahrt die verdichtete theologische Aussage, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen prophetischen Bildern. »Feldzeichen« ist leicht gehoben, aber anschaulich und sachlich passend; Satzbau und Wortwahl bleiben für gewöhnliche Leser verständlich.
