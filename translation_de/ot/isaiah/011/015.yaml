    issue: Ungebräuchliche Haupttextformulierung „Meereszunge Ägyptens“
    rationale: Die hebräische Bildsprache soll erhalten bleiben, doch die Zusammensetzung ist im heutigen Deutsch wenig geläufig. Eine syntaktisch ausgeschriebene Form ist klarer, ohne die Bildlichkeit zu glätten.
  - severity: low
    issue: „in sieben Bäche zerschlagen“ ist leicht überstark und eng
    rationale: נכה bedeutet primär schlagen; נחלים sind Wasserläufe, Bäche oder Wadis. „in sieben Wasserläufe schlagen“ bewahrt die Breite des Begriffs und das Bild des Textes besser.
  - severity: low
    issue: Fußnote a nennt nicht die dokumentierte geographische Alternative am präzisesten
    rationale: Für לשון ים ist „Golf“ die naheliegende geographische Alternative; „Meeresarm“ ist möglich, aber weniger präzise und weniger gut an die englische Audit-Spur angebunden.
