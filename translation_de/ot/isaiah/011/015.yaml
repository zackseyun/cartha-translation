id: ISA.11.15
reference: Isaiah 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: de
  text: Und Jahwe wird die Zunge des Meeres von Ägypten[a] der Vernichtung weihen. Er wird seine Hand über den Strom[b] schwingen mit der Glut seines Windes[c]; er wird ihn in sieben Wasserläufe schlagen und Menschen in Sandalen hindurchgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Golf von Ägypten“; wörtlich: „die Zunge des Meeres von Ägypten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt wahrscheinlich: den Euphrat.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „mit der Hitze seines Windes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: wird … dem Untergang weihen
  rationale: Der Hifil von חרם bezeichnet gewöhnlich das Weihen oder Bannvollstrecken zur Vernichtung. Die Formulierung wahrt diese kultisch-gerichtliche Färbung besser als das kontextuell mögliche, aber lexikalisch weniger direkte „austrocknen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: die Meereszunge Ägyptens
  rationale: „Meereszunge“ bewahrt das konkrete Bild von לָשׁוֹן und ist im Deutschen als geografische Bezeichnung für einen schmalen Meeresarm verständlich.
- source_word: וְהֵנִיף יָדוֹ
  choice: Er wird seine Hand … schwingen
  rationale: Die Wendung stellt eine machtvolle göttliche Gebärde dar; „schwingen“ erhält das Bild und klingt im Deutschen natürlich.
- source_word: הַנָּהָר
  choice: der Strom
  rationale: Der bestimmte Ausdruck bleibt wie im Hebräischen unbenannt; im prophetischen Sprachgebrauch ist damit wahrscheinlich der Euphrat gemeint, was die Fußnote erläutert.
- source_word: בַּעְיָם רוּחוֹ
  choice: mit der Glut seines Windes
  rationale: בַּעְיָם ist schwierig, bezeichnet aber wahrscheinlich sengende Hitze; רוּחַ wird wegen der Wirkung auf das Wasser als „Wind“ wiedergegeben. Die Formulierung lässt die enge Verbindung beider Begriffe bestehen.
- source_word: וְהִכָּהוּ
  choice: er wird ihn … zerschlagen
  rationale: נכה bedeutet „schlagen“; zusammen mit dem Ergebnis von sieben Wasserläufen bringt „zerschlagen“ die gewaltsame Teilung des Stroms prägnant zum Ausdruck.
- source_word: לְשִׁבְעָה נְחָלִים
  choice: in sieben Bäche
  rationale: נְחָלִים kann Bäche, Wasserläufe oder Wadis bezeichnen. „Bäche“ ist verständlich und bewahrt die konkrete Wasserbildlichkeit; die Zahl sieben bleibt unverändert.
- source_word: וְהִדְרִיךְ
  choice: Menschen … hindurchgehen lassen
  rationale: Der Hifil bedeutet „treten/gehen lassen“. Da im Hebräischen kein ausdrückliches Objekt genannt ist, wird das sachlich vorausgesetzte menschliche Objekt knapp ergänzt.
- source_word: בַּנְּעָלִים
  choice: in Sandalen
  rationale: Die konkrete Wendung zeigt, dass der Übergang trockenen Fußes und ohne Ablegen des Schuhwerks möglich ist.
theological_decisions:
- issue: Art der Bildsprache bei der Überwindung der ägyptischen Meereszunge und des Stroms
  choice: Konkrete geografische Wasser werden in erhöhter prophetischer Bildsprache als Gegenstand von Jahwes Handeln dargestellt.
  alternative: Die Wasser ausschließlich als politische Symbole oder ausschließlich als Rückblick auf den Exodus deuten.
  rationale: Der Vers weckt zwar Erinnerungen an den Exodus und kann politische Tragweite besitzen, doch die Übersetzung bewahrt die konkrete Wasserbildlichkeit, ohne eine bestimmte typologische oder allegorische Deutung festzuschreiben.
- issue: Bedeutung von בַּעְיָם רוּחוֹ
  choice: „mit der Glut seines Windes“
  alternative: „mit der Gewalt seines Geistes“ oder „mit der Hitze seines Windes“
  rationale: Die unmittelbare Szene spricht für einen sengenden Wind, doch die Mehrdeutigkeit von רוּחַ zwischen Wind, Atem und Geist darf nicht dogmatisch überhöht werden; die Fußnote nennt eine eng verwandte lexikalische Möglichkeit.
translation_notes:
  register: Moderne, würdige prophetische Sprache. „Meereszunge“ erhält das hebräische Körperbild, während die Fußnote eine geläufigere geografische Alternative bietet. Der Satzbau wurde für gutes heutiges Deutsch gegliedert, ohne die Abfolge der göttlichen Handlungen zu verändern.
