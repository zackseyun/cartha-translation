revisions:
- from: Und Jahwe wird die Meereszunge Ägyptens[a] dem Untergang weihen. Er wird seine Hand über den Strom[b] schwingen mit der Glut seines Windes[c]; er wird ihn in sieben Bäche zerschlagen und Menschen in Sandalen hindurchgehen lassen.
  to: Und Jahwe wird die Zunge des Meeres von Ägypten[a] der Vernichtung weihen. Er wird seine Hand über den Strom[b] schwingen mit der Glut seines Windes[c]; er wird ihn in sieben Wasserläufe schlagen und Menschen in Sandalen hindurchgehen lassen.
  rationale: Die Revision verbessert punktuell die idiomatische Klarheit und die lexikalische Präzision. Sie erhält die hebräische Metapher der „Zunge“ im Haupttext, vermeidet aber die wenig natürliche Kompositumbildung. „Der Vernichtung weihen“ gibt החרים klar als Bannhandlung wieder, ohne die kontextuell mögliche Wirkung des Austrocknens in den Wortlaut einzutragen. „Wasserläufe“ lässt die Bedeutung von נחלים offen. Alle Fußnotenanker bleiben am jeweiligen Bezugsausdruck erhalten.
