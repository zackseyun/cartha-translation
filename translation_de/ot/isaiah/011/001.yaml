  text: וְ/יָצָ֥א חֹ֖טֶר מִ/גֵּ֣זַע יִשָׁ֑י וְ/נֵ֖צֶר מִ/שָּׁרָשָׁ֥י/ו יִפְרֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: de
  text: Dann[a] wird ein Trieb[b] aus dem Baumstumpf Isais hervorgehen, und ein Spross[c] aus seinen Wurzeln[d] wird Frucht tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ein Trieb wird aus dem Baumstumpf Isais hervorgehen.“ Die Konjunktion kann schlicht mit „und“ wiedergegeben werden; „dann“ nimmt die Bewegung vom vorausgehenden Gericht zur neuen Hoffnung auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Zweig“ beziehungsweise „ein Schössling“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein junger Zweig“. Manche erkennen in diesem Bild eine messianische Bedeutung; der Haupttext bewahrt jedoch den gewöhnlichen botanischen Wortsinn.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „seinen Wurzeln“. Das maskuline Singularsuffix kann innerhalb des Bildes auf Isai beziehungsweise auf den Baumstumpf zurückweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann wird … hervorgehen
  rationale: יָצָא bedeutet „hinausgehen, hervorgehen“. „Hervorgehen“ passt natürlich zum Austreiben einer Pflanze und zugleich zur dynastischen Bildsprache. Das vorangestellte וְ kann schlicht „und“ heißen; „dann“ macht den Übergang vom vorausgehenden Gericht zur neuen Hoffnung sichtbar.
- source_word: חֹטֶר
  choice: Trieb
  rationale: חֹטֶר bezeichnet hier einen jungen Trieb, Zweig oder Schössling. „Trieb“ ist im modernen Deutschen botanisch klar und gibt das neue Wachstum aus dem verbliebenen Stumpf wieder.
- source_word: מִגֵּזַע
  choice: aus dem Baumstumpf
  rationale: גֵּזַע kann Stamm, Wurzelstock oder den nach dem Fällen verbliebenen Stumpf bezeichnen. „Baumstumpf“ verdeutlicht das für den Zusammenhang wichtige Bild von Gericht und anschließendem Neubeginn.
- source_word: יִשָׁי
  choice: Isai
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form „Isai“ wiedergegeben.
- source_word: וְנֵצֶר
  choice: und ein Spross
  rationale: נֵצֶר bezeichnet einen jungen Spross oder Zweig. „Spross“ erhält die botanische Bedeutung und unterscheidet das Wort im poetischen Parallelismus von חֹטֶר („Trieb“), ohne daraus ausdrücklich einen Titel zu machen.
- source_word: מִשָּׁרָשָׁיו
  choice: aus seinen Wurzeln
  rationale: Das hebräische Wort trägt ein maskulines Singularsuffix („seinen“). Die Wiedergabe bewahrt dieses grammatische Merkmal und die mögliche Rückbindung an Isai innerhalb der Baum- und Dynastiemetapher.
- source_word: יִפְרֶה
  choice: wird Frucht tragen
  rationale: פרה bedeutet „fruchtbar sein, Frucht tragen“. „Frucht tragen“ führt das Pflanzenbild folgerichtig weiter und bezeichnet produktives neues Leben.
theological_decisions:
- issue: Messianischer Anklang der Pflanzen- und Dynastiebilder
  choice: Die unmittelbare botanische und dynastische Bildsprache wird übersetzt, ohne „Spross“ durch Großschreibung oder andere Kennzeichnung zu einem ausdrücklichen messianischen Titel zu machen.
  alternative: Eine besonders traditionsgeprägte Formulierung oder typografische Hervorhebung könnte „Spross“ ausdrücklich als messianischen Titel signalisieren.
  rationale: Der Vers spricht im Hebräischen bildhaft von neuem Wachstum aus Isais Linie. Seine messianische Bedeutung kann sich aus dem literarischen und kanonischen Zusammenhang ergeben; sie soll nicht durch einen in den Wortlaut eingefügten Titel vorentschieden werden.
- issue: Maskulines Suffix bei „seinen Wurzeln“
  choice: Das maskuline Possessivpronomen wird als „seinen“ bewahrt.
  alternative: Eine Glättung könnte „dessen Wurzeln“ oder eine ausdrücklich nur auf den Baumstumpf bezogene Formulierung verwenden.
  rationale: Das Hebräische hat ein maskulines Singularsuffix. „Seinen Wurzeln“ erhält sowohl die grammatische Form als auch die Spannung zwischen dem Personenbezug auf Isai und dem fortgesetzten Baumbild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer botanischer Bildsprache. Der Parallelismus „Trieb/Spross“ bleibt erkennbar; „Baumstumpf“ macht den Kontrast zwischen vorausgegangener Abholzung und neuem Leben verständlich. Die Satzstellung ist natürlich, ohne die knappe poetische Struktur unnötig auszubauen.
