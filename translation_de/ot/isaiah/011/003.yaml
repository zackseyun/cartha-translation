base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: de
  text: Er wird seine Freude an der Ehrfurcht vor Jahwe haben.[a] Er wird nicht nach dem urteilen, was seine Augen sehen, und nicht aufgrund dessen entscheiden, was seine Ohren hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ungefähr: „Sein Riechen/Wahrnehmen ist in der Ehrfurcht vor Jahwe.“ Das hebräische Verb ist hier schwer zu deuten und kann ein besonders feines Gespür ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: Er wird seine Freude … haben
  rationale: Die Hifil-Form von ריח ist hier ungewöhnlich und wörtlich schwer verständlich. Im Zusammenhang bezeichnet sie wahrscheinlich eine innere Ausrichtung oder ein feines Gespür. Die idiomatische Wiedergabe „seine Freude … haben“ ergibt natürliches Deutsch; die mögliche Geruchs- bzw. Wahrnehmungsmetapher bleibt in der Fußnote erhalten.
- source_word: בְּיִרְאַת
  choice: an der Ehrfurcht vor
  rationale: יִרְאָה bezeichnet gegenüber Gott zugleich Furcht und ehrfürchtige Haltung. „Ehrfurcht vor“ ist im heutigen Deutsch verständlich und vermeidet den Eindruck bloßen Erschreckens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמַרְאֵה עֵינָיו
  choice: nach dem, was seine Augen sehen
  rationale: Die Formulierung bewahrt das konkrete Bild des Sehens und bezeichnet ein Urteil, das sich nicht allein am sichtbaren Anschein orientiert.
- source_word: יִשְׁפּוֹט
  choice: urteilen
  rationale: שׁפט hat hier einen richterlichen bzw. regierenden Sinn. „Urteilen“ gibt diesen unmittelbar wieder.
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: nach dem, was seine Ohren hören
  rationale: Die Wiedergabe erhält die Parallelität zum Sehen und legt sich nicht vorschnell auf die engere Deutung „nach dem Hörensagen“ fest.
- source_word: יוֹכִיחַ
  choice: entscheiden
  rationale: יכח kann im Hifil unter anderem entscheiden, Recht sprechen, zurechtweisen oder schlichten bedeuten. Parallel zu „urteilen“ steht hier der richterliche Sinn im Vordergrund; „entscheiden“ lässt die genaue Art des richterlichen Handelns hinreichend offen.
theological_decisions:
- issue: Die Wahrnehmungsfähigkeit des kommenden davidischen Herrschers
  choice: Der Herrscher ist innerlich auf die Ehrfurcht vor Jahwe ausgerichtet und urteilt nicht nur aufgrund äußerer Sinneseindrücke.
  alternative: 'Die Anfangsklausel kann stärker seine außergewöhnlich feine Wahrnehmung ausdrücken: Er „wittert“ oder „erspürt“ in der Ehrfurcht vor Jahwe.'
  rationale: Der hebräische Wortlaut verbindet die schwer deutbare Geruchsmetapher mit der Ehrfurcht vor Jahwe und stellt anschließend Sehen und Hören als unzureichende Grundlagen seines Urteils dar. Der Haupttext soll verständlich sein, ohne die mögliche Aussage über überragendes Wahrnehmungsvermögen auszuschließen; deshalb wird diese in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ehrfurcht“ gibt die religiöse Bedeutung von יִרְאָה natürlicher wieder als ein isoliertes „Furcht“. Die parallele Satzstruktur und die Bilder von Augen und Ohren bleiben erhalten.
