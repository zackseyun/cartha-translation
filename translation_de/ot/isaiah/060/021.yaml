  text: וְ/עַמֵּ/ךְ֙ כֻּלָּ֣/ם צַדִּיקִ֔ים לְ/עוֹלָ֖ם יִ֣ירְשׁוּ אָ֑רֶץ נֵ֧צֶר מטע/ו מַעֲשֵׂ֥ה יָדַ֖/י לְ/הִתְפָּאֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: de
  text: Und dein ganzes Volk wird gerecht sein. Für immer werden sie das Land[b] besitzen[a] – ein Spross seiner Pflanzung[c], das Werk meiner Hände, um mich zu verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erben“. Das hebräische Verb kann „erben“, „in Besitz nehmen“ oder „besitzen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; im Zusammenhang der Wiederherstellung ist „Land“ naheliegender.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hier vorgelegte hebräische Text lautet „seiner Pflanzung“ und wechselt anschließend zu „meiner Hände“. Eine harmonisierende Wiedergabe lautet: „ein Spross meiner Pflanzung, das Werk meiner Hände“.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: Und dein ganzes Volk
  rationale: Die Anrede gilt Zion/Jerusalem im femininen Singular. כֻּלָּם wird im Deutschen natürlich in die Nominalgruppe einbezogen und bewahrt die umfassende Aussage.
- source_word: צַדִּיקִים
  choice: wird gerecht sein
  rationale: Das Hebräische enthält einen Nominalsatz ohne ausdrückliche Kopula. Im Zusammenhang der Zukunftsverheißung gibt das Futur den zeitlichen Bezug natürlich wieder; „gerecht“ bewahrt das moralische und bundestheologische Gewicht.
- source_word: לְעוֹלָם
  choice: Für immer
  rationale: Gibt die dauerhafte, nicht nur vorübergehende Geltung der Verheißung in heutigem Deutsch wieder.
- source_word: יִירְשׁוּ
  choice: werden … besitzen
  rationale: ירשׁ kann sowohl das Erben als auch das Inbesitznehmen beziehungsweise dauerhafte Besitzen bezeichnen. Im Wiederherstellungskontext ist „besitzen“ klar und natürlich.
- source_word: אָרֶץ
  choice: das Land
  rationale: Im Zusammenhang von Zions Wiederherstellung liegt das verheißene Land näher als die umfassendere Bedeutung „Erde“.
- source_word: נֵצֶר
  choice: ein Spross
  rationale: Das Wort bezeichnet jungen Pflanzenwuchs. „Spross“ erhält das konkrete Bild und den gehobenen biblischen Ton.
- source_word: מטעו
  choice: seiner Pflanzung
  rationale: Die im bereitgestellten Ausgangstext stehende Form weist einen Suffixbezug der dritten Person Singular auf. Dieser Personenwechsel wird nicht stillschweigend geglättet.
- source_word: מַעֲשֵׂה יָדַי
  choice: das Werk meiner Hände
  rationale: Die konkrete hebräische Metapher wird in einer geläufigen und würdevollen deutschen Form bewahrt.
- source_word: לְהִתְפָּאֵר
  choice: damit ich verherrlicht werde
  rationale: Der Hitpael drückt hier Zweck beziehungsweise Ergebnis der sichtbaren Herrlichkeit Gottes aus. Die passive deutsche Form ist idiomatisch, ohne den reflexiven Zug dogmatisch zu überdeuten.
theological_decisions:
- issue: Personenwechsel zwischen „seiner Pflanzung“ und „meiner Hände“
  choice: Der im bereitgestellten hebräischen Text erkennbare Wechsel von der dritten zur ersten Person wird im Haupttext beibehalten.
  alternative: „ein Spross meiner Pflanzung, das Werk meiner Hände“
  rationale: Eine Harmonisierung würde die überlieferte Form des vorgelegten Ausgangstextes glätten. Die Übersetzung wahrt deshalb die Spannung und erläutert sie transparent in einer Fußnote.
- issue: Land oder Erde
  choice: Land
  alternative: Erde
  rationale: Der unmittelbare Wiederherstellungskontext spricht für das Land; die weitere kosmische Bedeutung bleibt lexikalisch möglich und wird angemerkt.
- issue: Besitzen oder erben
  choice: besitzen
  alternative: erben
  rationale: Beide Bedeutungen sind im Verb ירשׁ angelegt. „Besitzen“ passt unmittelbar zur dauerhaften Wiederinbesitznahme, während „erben“ als bedeutungsvolle Alternative erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Gedankenstrich kennzeichnet die beiden folgenden Bilder als nähere Bestimmung des Volkes. Keine konfessionell geprägte Terminologie wurde hinzugefügt.
