  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: de
  text: Söhne Fremder werden deine Mauern wieder aufbauen[a], und ihre Könige werden dir dienen[b]; denn in meinem Zorn habe ich dich geschlagen, doch in meiner Gunst habe ich mich über dich erbarmt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne eines Fremden“ und „bauen“. Die hebräische Wendung kann auch Angehörige fremder Völker bezeichnen; im Zusammenhang ist der Wiederaufbau der Mauern gemeint.'
    reason: lexical_range
  - marker: b
    text: 'Oder: „werden dir Dienst leisten“. Das hebräische Verb kann persönlichen oder amtlichen Dienst bezeichnen und wird auch in kultischen Zusammenhängen verwendet.'
    reason: lexical_range
  - marker: c
    text: 'Oder: „doch in meinem Wohlgefallen habe ich dir Erbarmen erwiesen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: werden … wieder aufbauen
  rationale: Das Verb bedeutet grundsätzlich „bauen“. Im Zusammenhang mit den Mauern der verwüsteten und wiederhergestellten Stadt gibt „wieder aufbauen“ den Kontext natürlich wieder, ohne einen sachfremden Gedanken einzuführen.
- source_word: בְּנֵי נֵכָר
  choice: die Söhne von Fremden
  rationale: Die formal entsprechende Wiedergabe bewahrt das hebräische Bild; die Wendung kann zugleich allgemeiner Angehörige fremder Völker bezeichnen, was in einer Fußnote vermerkt wird.
- source_word: חֹמֹתַיִךְ
  choice: deine Mauern
  rationale: Direkte Wiedergabe des Plurals mit femininem Suffix der zweiten Person; die angesprochene Stadt bleibt wie im Hebräischen ungenannt.
- source_word: וּמַלְכֵיהֶם
  choice: und ihre Könige
  rationale: Direkte und natürliche Wiedergabe des hebräischen Ausdrucks.
- source_word: יְשָׁרְתוּנֶךְ
  choice: werden dir dienen
  rationale: Das Piel von שׁרת bezeichnet persönlichen, amtlichen oder kultischen Dienst. „Dir dienen“ ist im Deutschen natürlich und lässt die genaue Art des Dienstes offen.
- source_word: בְּקִצְפִּי
  choice: in meinem Zorn
  rationale: קצף bezeichnet heftigen Zorn. „Zorn“ wahrt den ernsten prophetischen Ton und ist in modernem Deutsch klar.
- source_word: הִכִּיתִיךְ
  choice: habe ich dich geschlagen
  rationale: Die Grundbedeutung von נכה wird direkt und ohne Abschwächung wiedergegeben; das Perfekt passt zur rückblickenden Aussage.
- source_word: וּבִרְצוֹנִי
  choice: doch in meinem Wohlgefallen
  rationale: רצון kann Wohlwollen, Gunst oder Wohlgefallen bezeichnen. „Wohlgefallen“ erhält die bewusste Gegenüberstellung zu Gottes Zorn und bleibt zugleich würdig.
- source_word: רִחַמְתִּיךְ
  choice: habe ich mich über dich erbarmt
  rationale: רחם bezeichnet mitfühlendes Erbarmen. Die deutsche Wendung gibt sowohl die innere Anteilnahme als auch die barmherzige Zuwendung wieder.
theological_decisions:
- issue: Identität der feminin angesprochenen Person beziehungsweise Stadt
  choice: Die Anrede „du/dein“ bleibt ohne ergänzenden Eigennamen stehen.
  alternative: „Jerusalem“ oder „Zion“ ausdrücklich in den Haupttext einsetzen.
  rationale: Der Kontext identifiziert die personifizierte Stadt, doch der Eigenname steht nicht in diesem Vers. Die Übersetzung vermeidet daher eine erklärende Ergänzung.
- issue: Gegenüberstellung von göttlichem Gericht und Erbarmen
  choice: „in meinem Zorn habe ich dich geschlagen, doch in meinem Wohlgefallen habe ich mich über dich erbarmt“
  alternative: Die Gerichtsaussage abschwächen oder das Wohlgefallen als bloßen zeitlichen Wechsel paraphrasieren.
  rationale: 'Die Übersetzung bewahrt die unaufgelöste Spannung des hebräischen Textes: Sowohl der Schlag im Zorn als auch das Erbarmen gehen ausdrücklich vom redenden Gott aus.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ernst. Der Satzbau folgt der klaren Zweiteilung des Hebräischen; die feminine Anrede ist im Deutschen formal nicht sichtbar, wird aber nicht durch einen hinzugefügten Eigennamen erläutert.
