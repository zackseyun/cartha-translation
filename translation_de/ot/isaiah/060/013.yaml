  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: de
  text: 'Die Herrlichkeit des Libanon wird zu dir kommen: Zypressen, Platanen und Kiefern allesamt, um den Ort meines Heiligtums zu schmücken; und den Ort meiner Füße[b] werde ich verherrlichen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Auch übersetzbar: „meinen Fußschemel“. Wörtlich steht im Hebräischen: „den Ort meiner Füße“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: die Herrlichkeit des Libanon
  rationale: כָּבוֹד bezeichnet hier die Pracht beziehungsweise den kostbaren Waldbestand des Libanon. „Herrlichkeit“ bewahrt zugleich das Leitwortspiel mit אֲכַבֵּד am Versende.
- source_word: בְּרוֹשׁ תִּדְהָר וּתְאַשּׁוּר
  choice: Zypresse, Platane und Kiefer
  rationale: Die drei Wörter bezeichnen wertvolle Baumarten, doch besonders die zweite und dritte Art sind botanisch nicht sicher bestimmbar. Die gewählten deutschen Namen sind verbreitete, kontextuell plausible Entsprechungen; die Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: יַחְדָּו
  choice: miteinander
  rationale: Das Adverb hebt hervor, dass die genannten Bäume gemeinsam kommen. Die Stellung nach der Aufzählung folgt dem hebräischen Sinnfluss.
- source_word: לְפָאֵר
  choice: um … zu schmücken
  rationale: Das Piel von פאר bedeutet hier, einen Ort schön beziehungsweise prächtig zu machen. „Schmücken“ ist im Deutschen natürlich und passt zum Heiligtumskontext.
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: den Ort meines Heiligtums
  rationale: Die Formulierung gibt die hebräische Genitivverbindung transparent wieder und unterscheidet den Ort nicht vorschnell vom Heiligtum selbst.
- source_word: מְקוֹם רַגְלַי
  choice: den Ort meiner Füße
  rationale: Die wörtliche Bildsprache wird bewahrt. Das interpretierende „Schemel meiner Füße“ ist sachlich möglich, verwendet aber ein im hebräischen Vers nicht stehendes Substantiv.
- source_word: אֲכַבֵּד
  choice: werde ich verherrlichen
  rationale: Das Piel von כבד kann „ehren“ oder „herrlich machen/verherrlichen“ bedeuten. „Verherrlichen“ bewahrt den sprachlichen Zusammenhang mit der „Herrlichkeit“ am Versanfang und drückt aus, dass Gott dem Ort Pracht und Ehre verleiht.
theological_decisions:
- issue: Anthropomorphe Rede vom Ort der Füße Gottes
  choice: „den Ort meiner Füße“ im Haupttext beibehalten
  alternative: „meinen Fußschemel“
  rationale: Der hebräische Text spricht ausdrücklich vom „Ort meiner Füße“. Die konkrete poetische Metapher für Gottes Gegenwart am Heiligtum bleibt deshalb erhalten, ohne sie durch eine theologisch naheliegende, aber interpretierende Bezeichnung zu ersetzen.
- issue: Identität der angeredeten Person
  choice: Das feminine Singularpronomen durch „dir“ wiedergeben, ohne den Namen einzufügen
  alternative: „zu dir, Zion/Jerusalem“
  rationale: Im Zusammenhang ist Zion beziehungsweise Jerusalem angeredet, doch der vorliegende Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt diese Diskursform.
- issue: Bedeutung von אֲכַבֵּד
  choice: „werde ich verherrlichen“
  alternative: „werde ich ehren“
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Verherrlichen“ wahrt hier die Verbindung zu כְּבוֹד und bezeichnet die von Gott verliehene Pracht, ohne die Beziehung zwischen Heiligtum und Gottes Gegenwart weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Bildsprache. Die Satzstellung bleibt gut lesbar, während „Herrlichkeit“ und „verherrlichen“ das hebräische Wortspiel von כְּבוֹד und אֲכַבֵּד spiegeln. Botanische Unsicherheiten werden nicht im Haupttext ausgebreitet, sondern transparent in Fußnote [a] ausgewiesen.
