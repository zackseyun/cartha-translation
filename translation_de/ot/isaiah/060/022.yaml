source:
  edition: WLC
  text: הַ/קָּטֹן֙ יִֽהְיֶ֣ה לָ/אֶ֔לֶף וְ/הַ/צָּעִ֖יר לְ/ג֣וֹי עָצ֑וּם אֲנִ֥י יְהוָ֖ה בְּ/עִתָּ֥/הּ אֲחִישֶֽׁ/נָּה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: de
  text: Aus dem Kleinsten[a] werden tausend[b], und aus dem Geringsten eine mächtige Nation. Ich bin Jahwe; zu ihrer Zeit werde ich es beschleunigen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem Kleinen“ beziehungsweise „aus dem Unbedeutendsten“.'
    reason: lexical_alternative
  - marker: b
    text: „Tausend“ kann auch als Bezeichnung für eine Sippe verstanden werden; hier passt der Zahlensinn jedoch besser zum parallelen Bild des starken Wachstums.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Zu ihrer festgesetzten Zeit werde ich es beschleunigen.“ Das Hebräische verbindet einen bestimmten Zeitpunkt mit rascher Erfüllung.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: aus dem Kleinsten
  rationale: קָטֹן bezeichnet hier substantivisch den Kleinsten beziehungsweise Unbedeutendsten. Die Konstruktion mit „aus“ gibt im Deutschen natürlich wieder, dass aus einer sehr kleinen Ausgangsgröße eine große Menge hervorgeht.
- source_word: יִהְיֶה
  choice: werden
  rationale: היה kann „sein“ oder „werden“ bedeuten. Im Zusammenhang der angekündigten Vermehrung bringt „werden“ die Veränderung angemessen zum Ausdruck.
- source_word: לָאֶלֶף
  choice: tausend
  rationale: אֶלֶף bedeutet primär „tausend“. Der Parallelismus mit der mächtigen Nation und das Motiv starken Wachstums sprechen hier für den Zahlensinn; die mögliche Bedeutung „Sippe“ bleibt in einer Fußnote erhalten.
- source_word: הַצָּעִיר
  choice: aus dem Geringsten
  rationale: צָעִיר kann Jugend, Kleinheit oder geringe Bedeutung bezeichnen. Parallel zu הַקָּטֹן ist hier gesellschaftliche beziehungsweise zahlenmäßige Geringfügigkeit wahrscheinlicher als junges Alter.
- source_word: לְגוֹי עָצוּם
  choice: eine mächtige Nation
  rationale: גּוֹי bezeichnet eine Nation oder ein Volk, עָצוּם Stärke und Macht. „Eine mächtige Nation“ bewahrt Größenordnung und Nachdruck der Verheißung.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die Selbstvorstellungsformel wird direkt wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: בְּעִתָּהּ
  choice: zu ihrer Zeit
  rationale: Die Wendung bedeutet wörtlich „zu ihrer Zeit“ und verweist auf den für die Erfüllung bestimmten Zeitpunkt, ohne den nicht ausdrücklich genannten Bezug des femininen Suffixes zu präzisieren.
- source_word: אֲחִישֶׁנָּה
  choice: werde ich es beschleunigen
  rationale: Der Hifil von חושׁ bezeichnet das Beschleunigen beziehungsweise rasche Herbeiführen. Die Formulierung bewahrt Gottes Handeln und die Spannung zur festgesetzten Zeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Spannung zwischen festgesetzter Zeit und Beschleunigung
  choice: zu ihrer Zeit werde ich es beschleunigen
  alternative: Wenn die Zeit da ist, werde ich es schnell ausführen
  rationale: Der hebräische Wortlaut stellt den bestimmten Zeitpunkt und das Beschleunigen unmittelbar nebeneinander. Die Übersetzung glättet diese Spannung nicht zu einer bloßen Aussage über schnelle Ausführung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Konstruktion „aus dem …“ macht die Wachstumsaussage natürlich verständlich und erhält zugleich den Parallelismus. „Beschleunigen“ wurde bewusst nicht idiomatisch geglättet, damit die Spannung des hebräischen Schlusses hörbar bleibt.
