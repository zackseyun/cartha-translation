id: ISA.60.20
reference: Isaiah 60:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: de
  text: Deine Sonne wird nicht mehr untergehen[a], und dein Mond wird nicht zurückgezogen werden[b]; denn Jahwe wird dir zum ewigen Licht sein, und die Tage deiner Trauer werden zu Ende sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird nicht mehr kommen“; mit der Sonne als Subjekt ist damit hier ihr Untergehen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird nicht eingesammelt werden“, das heißt: nicht weggenommen werden und weiterhin leuchten. Möglich ist auch: „wird nicht schwinden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָבוֹא עוֹד
  choice: wird nicht mehr untergehen
  rationale: בוא bedeutet gewöhnlich „kommen“, bezeichnet hier jedoch mit der Sonne als Subjekt idiomatisch ihr Untergehen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt das kosmische Bild.
- source_word: שִׁמְשֵׁךְ
  choice: deine Sonne
  rationale: Direkte Wiedergabe der Possessivverbindung; das feminine Singularsuffix spricht Zion beziehungsweise Jerusalem an.
- source_word: וִירֵחֵךְ
  choice: und dein Mond
  rationale: Direkte Wiedergabe des koordinierten Nomens mit femininem Singularsuffix.
- source_word: לֹא יֵאָסֵף
  choice: wird nicht mehr zurückgezogen werden
  rationale: Das Nifal von אסף kann „eingesammelt, weggenommen, zurückgezogen werden“ bedeuten. „Zurückgezogen werden“ erhält das Passiv und die bildhafte Vorstellung, ohne den Ausdruck ausschließlich astronomisch als Abnehmen des Mondes zu deuten.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die vorhergehende Verheißung ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift des göttlichen Eigennamens bewahrt den Namen anstelle einer Ersetzung durch einen Titel.
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: wird dir zum ewigen Licht sein
  rationale: Bildet die hebräische Konstruktion mit לְ vergleichsweise eng und zugleich verständlich ab; „ewig“ gibt עוֹלָם in diesem Verheißungskontext angemessen wieder.
- source_word: וְשָׁלְמוּ יְמֵי אֶבְלֵךְ
  choice: und die Tage deiner Trauer werden zu Ende sein
  rationale: שלם bezeichnet hier das Vollendet- oder Beendetsein der Trauerzeit. Die Formulierung ist natürlich und bewahrt den Bezug auf deren Tage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; die deutsche Schreibweise entspricht der üblichen Aussprache- und Umschrifttradition.
- issue: Kosmische Bildsprache von Sonne und Mond
  choice: Die Bilder von Sonne und Mond werden konkret beibehalten.
  alternative: Die Aussagen als bloße Umschreibung dauerhaften Trostes wiedergeben.
  rationale: Der Text stellt die geschaffenen Lichter dem ewigen Licht Jahwes gegenüber. Eine bildgetreue Übersetzung wahrt die prophetische Weite und legt nicht fest, wie wörtlich oder metaphorisch die Aussage zu verstehen ist.
- issue: Bedeutung von יֵאָסֵף beim Mond
  choice: zurückgezogen werden
  alternative: schwinden oder verschwinden
  rationale: Die gewählte passive Form bewahrt die Grundvorstellung des Einsammelns beziehungsweise Wegnehmens und lässt offen, ob ein astronomischer Vorgang oder ein weiter gefasstes prophetisches Bild gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „dir zum ewigen Licht sein“ spiegelt den prophetischen Stil, bleibt aber allgemein verständlich. Die feminine Singularanrede wird durch „deine/deiner“ bewahrt.
