source:
  edition: WLC
  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: de
  text: Du wirst die Milch der Völker saugen[a] und an der Brust von Königen saugen. Und du wirst erkennen, dass ich, Jahwe, dein Retter und dein Erlöser bin, der Mächtige Jakobs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du wirst die Milch der Völker saugen, und an der Brust von Königen wirst du saugen.“ Das Hebräische wiederholt dasselbe Verb und bewahrt so das eindringliche Stillbild für Zions Versorgung und Ehrung durch die Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָנַקְתְּ ... תִּינָקִי
  choice: du wirst … saugen … an der Brust … trinken
  rationale: Beide Formen stammen von ינק und entfalten ein bewusst anschauliches Bild des Saugens beziehungsweise Stillens. Im Deutschen bewahrt „saugen“ beim ersten Vorkommen das Bild; „an der Brust … trinken“ gibt das zweite idiomatisch wieder. Die feminine Singularform richtet sich an Zion/Jerusalem.
- source_word: חֲלֵב גּוֹיִם
  choice: die Milch der Völker
  rationale: חֲלֵב bedeutet konkret „Milch“. Die Übersetzung deutet das Bild nicht vorschnell als Reichtum oder Versorgung aus. גּוֹיִם wird im prophetischen Kontext natürlich mit „Völker“ wiedergegeben.
- source_word: שֹׁד מְלָכִים
  choice: an der Brust von Königen
  rationale: שֹׁד bezeichnet hier die Brust im Stillbild. Die ungewöhnliche Verbindung mit Königen wird nicht geglättet, sondern als bewusst kühne Metapher bewahrt.
- source_word: וְיָדַעַתְּ
  choice: Dann wirst du erkennen
  rationale: Das mit וְ angeschlossene Verb bezeichnet hier die folgende Erkenntnis als Ergebnis des zuvor Geschilderten. „Erkennen“ gibt ידע in diesem feierlichen Zusammenhang angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מוֹשִׁיעֵךְ
  choice: dein Retter
  rationale: Das Hifil-Partizip von ישׁע mit Suffix bezeichnet den, der Zion rettet. „Retter“ ist knapp, natürlich und titelartig.
- source_word: וְגֹאֲלֵךְ
  choice: und dein Erlöser
  rationale: גאל bezeichnet befreiendes Einlösen beziehungsweise Zurückfordern. „Erlöser“ wahrt die in Jesaja wiederkehrende Bezeichnung, ohne die verwandtschaftsrechtliche Bedeutung mit „Löser aus der Sippe“ zu verengen.
- source_word: אֲבִיר יַעֲקֹב
  choice: der Mächtige Jakobs
  rationale: Der feststehende Gottesname wird quellennah wiedergegeben. „Jakobs“ bewahrt den ausdrücklich genannten Namen und ersetzt ihn nicht durch „Israels“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des Stillbildes
  choice: Das körperlich-konkrete Bild von Milch, Brust und Trinken/Saugen bleibt im Haupttext erhalten.
  alternative: Du wirst den Reichtum der Völker und Könige genießen.
  rationale: Der Kontext legt Versorgung, Reichtum und Ehre nahe, doch der hebräische Wortlaut formuliert dies ausdrücklich als Stillbild. Eine abstrakte Paraphrase würde die poetische Spannung auflösen.
- issue: Syntaktische Beziehung von Jahwe zu den folgenden Titeln
  choice: „dass ich, Jahwe, dein Retter bin und dein Erlöser“
  alternative: „dass ich Jahwe bin, dein Retter und dein Erlöser“
  rationale: Die gewählte deutsche Zeichensetzung versteht „Jahwe“ als Apposition zum sprechenden Ich und die folgenden Ausdrücke als Prädikate beziehungsweise Titel. Sie bewahrt den Sinn, ohne eine zusätzliche theologische Aussage in die knappe hebräische Nominalfügung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im femininen Singular bezieht sich auf Zion/Jerusalem. Das ungewöhnliche Stillbild bleibt bewusst sichtbar; lediglich die zweite Verbfügung wird für natürliches Deutsch idiomatisch gestaltet.
