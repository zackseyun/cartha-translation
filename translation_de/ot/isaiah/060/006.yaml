  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: de
  text: Eine Fülle von Kamelen wird dich bedecken, die jungen Kamele von Midian und Efa. Sie alle werden aus Saba kommen. Sie werden Gold und Weihrauch tragen und die Lobpreisungen Jahwes verkünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lobpreisungen Jahwes als Freudenbotschaft verkünden“. Das Verb kann das Verkünden einer guten Nachricht bezeichnen. „Lobpreisungen Jahwes“ kann auch die rühmlichen Taten Jahwes meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְעַת גְּמַלִּים
  choice: Eine Fülle von Kamelen
  rationale: שִׁפְעַת bezeichnet eine Fülle oder große Menge. Die Formulierung wahrt das Bild zahlreicher Kamele und klingt im Deutschen würdig und natürlich.
- source_word: תְּכַסֵּךְ
  choice: wird dich bedecken
  rationale: Das Piel von כסה bedeutet hier „bedecken“. Das feminine Singularsuffix richtet sich an Zion beziehungsweise Jerusalem; das anschauliche Bild bleibt erhalten.
- source_word: בִּכְרֵי
  choice: die jungen Kamele
  rationale: Das Wort bezeichnet junge Kamele. Diese Wiedergabe ist präziser und heute verständlicher als das traditionelle „Dromedare“, das eher eine Kamelart bezeichnet.
- source_word: מִדְיָן וְעֵיפָה
  choice: Midian und Efa
  rationale: Die Eigennamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben.
- source_word: כֻּלָּם מִשְּׁבָא יָבֹאוּ
  choice: Sie alle werden aus Saba kommen
  rationale: „Sie alle“ gibt das ausdrückliche Pronomen כֻּלָּם wieder; Saba ist die gebräuchliche deutsche Form des Eigennamens שְׁבָא.
- source_word: זָהָב וּלְבוֹנָה יִשָּׂאוּ
  choice: Gold und Weihrauch werden sie tragen
  rationale: לְבוֹנָה bezeichnet spezifisch Weihrauch; נשׂא wird mit dem konkreten „tragen“ wiedergegeben, ohne die Bewegung als „bringen“ auszudeuten.
- source_word: וּתְהִלֹּת יְהוָה
  choice: die Ruhmestaten Jahwes
  rationale: תְּהִלּוֹת kann Lobpreisungen oder das Lob Hervorrufende, also rühmliche Taten, bezeichnen. In Verbindung mit בשר ist „Ruhmestaten“ natürlich, bewahrt aber durch eine Fußnote die alternative Deutung als Lobpreis.
- source_word: יְבַשֵּׂרוּ
  choice: verkünden
  rationale: בשר bezeichnet das Verkünden oder Überbringen guter Nachricht. „Verkünden“ passt zum Objekt und vermeidet eine unnötige inhaltliche Ergänzung; die Nuance der Freudenbotschaft wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, der im modernen deutschen Bibel- und Fachdiskurs üblichen Form.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. „Jahwe“ wahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ
  choice: die Ruhmestaten Jahwes verkünden
  alternative: das Lob Jahwes verkünden / die Lobpreisungen Jahwes als gute Nachricht ausrufen
  rationale: Der Plural תְּהִלּוֹת kann sowohl Äußerungen des Lobes als auch die lobenswerten Taten Jahwes bezeichnen; בשר kann zudem das Verkünden guter Nachricht hervorheben. Die Hauptfassung ist im Kontext idiomatisch, während die Fußnote die echte Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die feminine Anrede Zions bleibt durch „dich“ im Kontext offen. Kurze, klare Sätze unterstützen die Verständlichkeit; Eigennamen folgen gebräuchlichen deutschen Bibelformen.
