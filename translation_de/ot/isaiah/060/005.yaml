base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: de
  text: Dann wirst du sehen und strahlen[a]; dein Herz wird beben und sich weiten, denn die Fülle des Meeres wird sich dir zuwenden[b], und der Reichtum der Völker wird zu dir kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufleuchten« beziehungsweise »strahlend werden«.'
    reason: Das hebräische Verb kann ein sichtbares Hell- oder Strahlendwerden als Reaktion auf das Gesehene bezeichnen.
  - marker: b
    text: 'Oder: »der Reichtum des Meeres«.'
    reason: Die Wendung kann besonders maritime Güter oder Reichtümer bezeichnen, die Zion zukommen.
lexical_decisions:
- source_word: תִּרְאִי
  choice: du wirst es sehen
  rationale: Das Qal-Imperfekt 2. Person feminin Singular richtet sich an Zion/Jerusalem. Das ergänzte „es“ ergibt im Deutschen einen natürlichen Anschluss an das zuvor Geschaute, ohne den Sinn näher festzulegen.
- source_word: וְנָהַרְתְּ
  choice: und strahlen
  rationale: נהר bezeichnet hier im Zusammenhang mit dem Sehen am ehesten ein Aufleuchten oder Strahlen. Die knappe Wiedergabe bewahrt das Bild, ohne Freude ausdrücklich in das Verb hineinzulesen.
- source_word: וּפָחַד וְרָחַב לְבָבֵךְ
  choice: dein Herz wird beben und sich weiten
  rationale: „Beben“ lässt sowohl Furcht als auch ehrfürchtige Ergriffenheit zu; „sich weiten“ bewahrt die konkrete hebräische Metapher eines weit werdenden Herzens.
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: wird sich dir zuwenden
  rationale: Die Wendung beschreibt eine Bewegung beziehungsweise Verlagerung auf Zion zu. Das deutsche reflexive Passiväquivalent klingt natürlich und wahrt die Zielrichtung.
- source_word: הֲמוֹן יָם
  choice: die Fülle des Meeres
  rationale: הֲמוֹן kann Fülle, Menge oder Reichtum bezeichnen. „Fülle“ hält die Bedeutung offen und lässt durch den Parallelismus zugleich an maritime Güter und Reichtümer denken.
- source_word: חֵיל גּוֹיִם
  choice: der Reichtum der Völker
  rationale: חֵיל kann Kraft, Heer oder Vermögen bedeuten; im Kontext der nach Zion kommenden Güter ist „Reichtum“ die sachlich passende Bedeutung.
- source_word: יָבֹאוּ לָךְ
  choice: wird zu dir kommen
  rationale: Die schlichte Bewegungsangabe wird direkt wiedergegeben; der Singular im Deutschen richtet sich nach dem Kollektivbegriff „Reichtum“.
theological_decisions:
- issue: Gefühlsreaktion Zions
  choice: Beben und Weitung des Herzens als spannungsvolle Reaktion
  alternative: ausschließlich Angst oder ausschließlich Freude
  rationale: Die Abfolge von Sehen, Strahlen, Beben und einem sich weitenden Herzen verbindet Freude, Staunen und Ehrfurcht. Die Übersetzung legt die Reaktion nicht einseitig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Singularanrede an Zion ist im deutschen Pronomen formal nicht sichtbar, bleibt aber durch den Kontext erhalten. Bildhafte Ausdrücke wie das sich weitende Herz und die Fülle des Meeres werden bewahrt.
