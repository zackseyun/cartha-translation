  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: de
  text: 'Erhebe deine Augen und sieh ringsum: Sie alle versammeln sich und kommen zu dir. Deine Söhne werden aus der Ferne kommen, und deine Töchter werden an der Hüfte getragen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der Seite getragen«; das Verb kann auch die Nuance haben, versorgt oder genährt zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Erhebe deine Augen und sieh dich ringsum um
  rationale: Die beiden femininen Singularimperative richten sich an das personifizierte Zion. Die deutsche Wendung gibt sowohl das Erheben der Augen als auch den Blick in alle Richtungen natürlich und quellennah wieder.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: Sie alle versammeln sich und kommen zu dir
  rationale: Das vorangestellte כֻּלָּם bleibt durch „sie alle“ betont. Die Perfektformen werden als prophetisch vergegenwärtigte Szene im Präsens wiedergegeben, ohne ihren gemeinsamen Blickpunkt auf Zion aufzulösen.
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: Deine Söhne werden aus der Ferne kommen
  rationale: „Söhne“ wahrt die geschlechtsspezifische Entsprechung zu den folgenden „Töchtern“. Das Imperfekt wird als angekündigtes zukünftiges Kommen wiedergegeben.
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: und deine Töchter werden an der Hüfte getragen
  rationale: עַל צַד bezeichnet hier wahrscheinlich das Tragen eines Kindes an der Seite beziehungsweise Hüfte. Das Niphal von אמן vermittelt in diesem Bild das Getragen- und Versorgtwerden.
theological_decisions:
- issue: Geschlechtsspezifisches Bild der Wiederherstellung
  choice: „Söhne“ und „Töchter“ werden ausdrücklich beibehalten.
  alternative: Zusammenfassend „Kinder“
  rationale: Der hebräische Parallelismus nennt beide Gruppen eigens und zeichnet so die umfassende Rückkehr der Nachkommen Zions.
- issue: Zeitbezug der prophetischen Verbformen
  choice: Die ersten Perfektformen stehen im vergegenwärtigenden Präsens, die anschließenden Imperfektformen im Futur.
  alternative: Alle Verben einheitlich im Futur oder in der Vergangenheit wiedergeben
  rationale: Diese Staffelung bewahrt sowohl die lebendige prophetische Schau als auch den ankündigenden Charakter der zweiten Vershälfte.
- issue: Bild des Tragens und Versorgens
  choice: „werden an der Hüfte getragen“
  alternative: „werden an der Seite versorgt“ oder „werden genährt“
  rationale: Das konkrete Bild des Heimbringens kleiner Kinder passt am besten zum unmittelbaren Zusammenhang; die mögliche Fürsorgebedeutung des Verbs bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede an das personifizierte Zion bleibt im femininen Singular erkennbar; das konkrete Familienbild und die prophetische Spannung der Verbformen werden nicht eingeebnet.
