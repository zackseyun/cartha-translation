revisions:
- from: Die Sonne wird für dich nicht länger Licht am Tag sein, und der Mond wird dir nicht mehr mit seinem Glanz[a] leuchten. Vielmehr wird Jahwe[b] für dich ein ewiges Licht sein und dein Gott deine Herrlichkeit[c].
  to: Die Sonne wird für dich nicht länger ein Licht bei Tag sein, und der Mond wird dir nicht zum Glanz leuchten. Vielmehr wird Jahwe für dich ein ewiges Licht sein und dein Gott deine Herrlichkeit.
  rationale: 'Die Revision bewahrt die poetische Parallelität und bildet die hebräische Syntax genauer ab: עוֹד bleibt beim ersten Negationssatz, und לְנֹגַהּ wird als parallele Funktionsangabe zu לְאוֹר יוֹמָם wiedergegeben. Die Fußnotenanker werden an den einschlägigen Wörtern gesetzt.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: die Sonne als Tageslicht, der Mond, Jahwe als ewiges Licht und Gott als Herrlichkeit Zions. Der Entwurf verschiebt jedoch die Verteilung von עוֹד („noch/länger“) und לְנֹגַהּ („zum Glanz/zur Helligkeit“): „nicht mehr“ beim Mond ist im Hebräischen nicht wiederholt, während „mit seinem Glanz“ die präpositionale Funktionsangabe stärker possessiv-instrumental auslegt.'
  naturalness: Die Fassung ist insgesamt würdevoll und gut verständlich. „Die Sonne wird für dich nicht länger Licht am Tag sein“ ist möglich, klingt aber ohne Artikel etwas gedrängt. „… wird dir nicht mehr mit seinem Glanz leuchten“ ist zwar idiomatisch, doch weniger klar parallel zum ersten Halbvers. Eine engere, natürliche Parallelisierung verbessert Lesbarkeit und poetische Form.
  terminology: „Jahwe“ gibt יהוה angemessen wieder. „Ewiges Licht“ und „deine Herrlichkeit“ sind im Kontext treffend. Die Fußnote zu Jahwe ist sachlich korrekt. Für נֹגַהּ sollte die Anmerkung eine echte lexikalische Alternative bieten und nicht den Haupttext durch eine possessive Deutung festlegen.
  issues:
  - severity: medium
    issue: Die zeitliche Angabe „nicht mehr“ wird im zweiten Halbvers ergänzt.
    rationale: עוֹד steht nur im ersten Satzteil. Das Deutsche darf den Umfang der Negation im Parallelismus mitverstehen lassen, doch die ausdrückliche Wiederholung verändert die Verteilung im hebräischen Satz und ist nicht nötig.
  - severity: medium
    issue: „mit seinem Glanz“ gibt וּלְנֹגַהּ zu interpretierend wieder.
    rationale: לְנֹגַהּ ist parallel zu לְאוֹר יוֹמָם eine Funktions-/Zweckangabe („zum Glanz/zur Helligkeit“), nicht ausdrücklich ein instrumentales „mit seinem“.
  - severity: low
    issue: „Licht am Tag“ ohne Artikel wirkt leicht verdichtet.
    rationale: „ein Licht bei Tag“ ist modernes, poetisch angemessenes Deutsch und lässt die prädikative Funktion von לְאוֹר יוֹמָם klarer hervortreten.
  revised_text: Die Sonne wird für dich nicht länger ein Licht bei Tag sein, und der Mond wird dir nicht zum Glanz leuchten. Vielmehr wird Jahwe für dich ein ewiges Licht sein und dein Gott deine Herrlichkeit.
  revised_footnotes:
  - marker: a
    text: 'Oder: „zur Helligkeit“ oder „zum Lichtschein“ (wörtlich: „zum Glanz“).'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „deine Pracht“ beziehungsweise „deine Schönheit“.'
    reason: lexical_alternative
