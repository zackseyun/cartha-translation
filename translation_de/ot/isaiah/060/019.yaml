  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: de
  text: Die Sonne wird für dich nicht länger ein Licht bei Tag sein, und der Mond wird dir nicht zum Glanz leuchten. Vielmehr wird Jahwe für dich ein ewiges Licht sein und dein Gott deine Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: wird für dich nicht länger … sein
  rationale: Gibt Negation, Fortdauerpartikel, Verb und Dativbezug natürlich wieder und bezeichnet das Ende des bisherigen Zustands.
- source_word: לְאוֹר יוֹמָם
  choice: Licht am Tag
  rationale: Bewahrt die Funktionsangabe von לְ und den adverbialen Sinn von יוֹמָם, ohne im Deutschen einen unnötigen Artikel einzuführen.
- source_word: וּלְנֹגַהּ
  choice: mit seinem Glanz
  rationale: נֹגַהּ bezeichnet Glanz oder Lichtschein. Die Formulierung verbindet den Begriff im Deutschen natürlich mit dem Leuchten des Mondes.
- source_word: לֹא יָאִיר לָךְ
  choice: wird dir nicht mehr … leuchten
  rationale: Das Hifil von אור bedeutet Licht geben bzw. leuchten; der deutsche Dativ bewahrt den Bezug von לָךְ. Das ergänzte „mehr“ führt die Aussage von עוֹד sinngemäß parallel fort.
- source_word: וְהָיָה לָךְ
  choice: Vielmehr wird … für dich … sein
  rationale: 'Die Konjunktion leitet hier den poetischen Gegensatz ein: Jahwe tritt an die Stelle der geschaffenen Lichtquellen.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְאוֹר עוֹלָם
  choice: ein ewiges Licht
  rationale: עולם bezeichnet hier unbegrenzte Dauer; die deutsche Wendung wahrt Bildkraft und Zukunftsaussage.
- source_word: לְתִפְאַרְתֵּךְ
  choice: deine Herrlichkeit
  rationale: תפארת kann Herrlichkeit, Pracht oder Schönheit bezeichnen. „Herrlichkeit“ passt zum erhabenen poetischen Zusammenhang, ohne die anderen Nuancen auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ macht dies sichtbar; die traditionelle Ersetzung wird in der Fußnote genannt.
- issue: Art der Lichtbildsprache
  choice: Die prophetische Bildsprache bleibt ohne nähere Festlegung stehen.
  alternative: Das Bild ausdrücklich als rein wörtliche kosmische Veränderung oder ausschließlich als Metapher deuten.
  rationale: Der hebräische Text erklärt nicht, in welcher Weise sich diese Aussage erfüllt. Die Übersetzung wahrt daher die Spannung zwischen kosmischer und theologischer Bildsprache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die direkte Anrede Zions ist durch die feminine Form im Hebräischen bestimmt, im deutschen Pronomen jedoch nicht eigens markiert. Die Bildsprache wird weder rationalisiert noch auf eine bestimmte eschatologische Auslegung festgelegt.
