  text: מִי אֵ֖לֶּה כָּ/עָ֣ב תְּעוּפֶ֑ינָה וְ/כַ/יּוֹנִ֖ים אֶל אֲרֻבֹּתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/008.yaml
  text: Who are these that fly like a cloud[a], and like doves to their windows?
translation:
  language: de
  text: Wer sind diese, die wie eine Wolke fliegen und wie Tauben zu ihren Fenstern[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Öffnungen ihrer Taubenschläge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵלֶּה
  choice: Wer sind diese
  rationale: Die Verbindung aus Interrogativpronomen und Demonstrativpronomen wird im Deutschen mit einer ergänzten Kopula natürlich wiedergegeben und bewahrt die staunende Frage.
- source_word: כָּעָב
  choice: wie eine Wolke
  rationale: Die Vergleichspartikel כ und das singularische עָב werden direkt wiedergegeben; der Singular zeichnet die Herannahenden als geschlossene, wolkenartige Masse.
- source_word: תְּעוּפֶינָה
  choice: herbeifliegen
  rationale: Das Qal-Imperfekt der 3. Person feminin Plural von עוּף bezeichnet hier in einer lebhaften prophetischen Schau das Fliegen. „Herbeifliegen“ macht die aus dem Kontext und dem parallelen Zielausdruck erkennbare Bewegung zum betrachtenden Ort hin idiomatisch deutlich, ohne Schnelligkeit hinzuzufügen.
- source_word: וְכַיּוֹנִים
  choice: und wie Tauben
  rationale: Konjunktion, Vergleichspartikel und Pluralnomen werden parallel zum ersten Vergleich wiedergegeben.
- source_word: אֶל
  choice: zu
  rationale: Die gerichtete Bewegung auf das Ziel hin wird im Deutschen bei „Fenstern“ natürlich mit „zu“ ausgedrückt.
- source_word: אֲרֻבֹּתֵיהֶם
  choice: ihren Fenstern
  rationale: אֲרֻבָּה bezeichnet ein Fenster beziehungsweise eine Öffnung. Im Bild heimkehrender Tauben können speziell die Einflugöffnungen ihrer Taubenschläge gemeint sein; die allgemeinere lexikalische Bedeutung bleibt im Haupttext erhalten, die kontextuelle Alternative in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität der beiden Vergleiche und der Singular „eine Wolke“ bleiben erhalten. Das feminine Verbkongruenzmerkmal des Hebräischen lässt sich im Deutschen an dieser Stelle nicht sichtbar abbilden.
