  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
translation:
  language: de
  text: Steh auf, leuchte[a], denn dein Licht ist gekommen, und die Herrlichkeit Jahwes ist über dir aufgegangen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde hell“; das hebräische Verb kann sowohl „hell werden“ als auch „Licht ausstrahlen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräischen Perfektformen stellen die verheißene Wirklichkeit anschaulich als eingetreten dar; möglich wäre sinngemäß auch: „dein Licht kommt … die Herrlichkeit Jahwes geht über dir auf“.'
    reason: temporal_ambiguity
lexical_decisions:
- source_word: קוּמִי
  choice: Steh auf
  rationale: Der Qal-Imperativ 2. Person Feminin Singular von קום richtet sich an Zion/Jerusalem. „Steh auf“ ist unmittelbar, natürlich und wahrt den feierlichen prophetischen Aufruf.
- source_word: אוֹרִי
  choice: werde hell
  rationale: Der Qal-Imperativ 2. Person Feminin Singular von אור kann zum Hellwerden beziehungsweise Leuchten auffordern. „Werde hell“ bewahrt die mögliche inchoative Bedeutung und bereitet das Licht- und Aufgangsbild des zweiten Halbverses vor.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehenden Aufforderungen. „Denn“ gibt diesen kausalen Zusammenhang knapp und in würdigem Deutsch wieder.
- source_word: בָא אוֹרֵךְ
  choice: dein Licht ist gekommen
  rationale: Der hebräische Perfekt von בוא stellt das Kommen des Lichtes als eingetretene, gegenwärtig wirksame Wirklichkeit dar. Das deutsche Perfekt erhält diese rhetorische Gewissheit, ohne ausdrücklich Vergangenheit oder Zukunft festzulegen.
- source_word: וּכְבוֹד יְהוָה
  choice: und die Herrlichkeit Jahwes
  rationale: כבוד bezeichnet hier Gottes gewichtige Ehre, seinen Glanz und seine offenbare Gegenwart. „Herrlichkeit“ lässt diese Bedeutungsfülle bestehen; „Jahwe“ gibt den im Text stehenden Eigennamen wieder.
- source_word: עָלַיִךְ זָרָח
  choice: ist über dir aufgegangen
  rationale: זרח wird besonders vom Aufgehen und Hervorstrahlen eines Himmelskörpers gebraucht. „Über dir aufgegangen“ erhält das Bild des Sonnenaufgangs und gibt עַל idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ macht diesen offen sichtbar und vermeidet, ihn durch den Titel „Herr“ zu ersetzen.
- issue: Zeitwert der Perfektformen בָא und זָרָח in prophetischer Rede
  choice: 'deutsches Perfekt: „ist gekommen“, „ist … aufgegangen“'
  alternative: 'Präsens oder Futur: „kommt/geht auf“ beziehungsweise „wird kommen/wird aufgehen“'
  rationale: Die Perfektformen stellen die verheißene Wirklichkeit anschaulich als bereits eingetreten dar. Das deutsche Perfekt bewahrt diese prophetische Gewissheit, ohne die Aussage eindeutig auf bloße Vergangenheit oder Zukunft festzulegen.
- issue: Bedeutung des Imperativs אוֹרִי
  choice: werde hell
  alternative: leuchte
  rationale: Die Form kann sowohl das Hellwerden als auch das Ausstrahlen von Licht bezeichnen. Der Haupttext wahrt mit „werde hell“ die Zustandsveränderung; die geläufige aktive Lesart „leuchte“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Klang. Die feminine Anrede an Zion/Jerusalem ist im Deutschen ohne ergänzende Auslegung nicht morphologisch sichtbar. Die Licht- und Sonnenaufgangsmetaphorik sowie die zeitliche Spannung der prophetischen Perfektformen bleiben erhalten.
