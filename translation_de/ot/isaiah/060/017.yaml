  naturalness: Die Wiederholung von „anstelle von“ ist verständlich, aber „statt“ ist im modernen Standarddeutsch knapper und rhythmisch natürlicher. „Ich setze dir Frieden als Aufsicht ein“ ist syntaktisch und semantisch weniger klar als eine zu-Konstruktion. „Gerechtigkeit als deine Antreiber“ ist wegen Singular „Gerechtigkeit“ und Plural „Antreiber“ keine natürliche deutsche Apposition.
  terminology: „Bronze“, „Eisen“, „Silber“, „Holz“, „Steinen“, „Frieden“ und „Gerechtigkeit“ sind angemessen. „Aufsicht“ und „Antreiber“ sollten jeweils eigene Fußnoten erhalten; die Deutungsmöglichkeit von צְדָקָה darf nicht in einer Fußnote zu „Antreiber“ aufgehen.
