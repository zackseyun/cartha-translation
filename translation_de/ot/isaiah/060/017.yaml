  text: תַּ֣חַת הַ/נְּחֹ֜שֶׁת אָבִ֣יא זָהָ֗ב וְ/תַ֤חַת הַ/בַּרְזֶל֙ אָ֣בִיא כֶ֔סֶף וְ/תַ֤חַת הָֽ/עֵצִים֙ נְחֹ֔שֶׁת וְ/תַ֥חַת הָ/אֲבָנִ֖ים בַּרְזֶ֑ל וְ/שַׂמְתִּ֤י פְקֻדָּתֵ/ךְ֙ שָׁל֔וֹם וְ/נֹגְשַׂ֖יִ/ךְ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: de
  text: Statt Bronze werde ich Gold bringen, statt Eisen Silber; statt Holz Bronze und statt Steinen Eisen. Ich werde Frieden zu deiner Aufsicht[a] machen und Gerechtigkeit[b] zu deinen Antreibern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner Verwaltung“ oder „deinen Amtsträgern“. Das hebräische Wort kann Aufsicht, Amt, Verwaltung oder die damit betrauten Personen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gerechtigkeit“ im Sinn gerechter öffentlicher Ordnung; das hebräische Wort kann sowohl persönliche Rechtschaffenheit als auch Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deinen Bedrängern“ oder „denen, die von dir Abgaben eintreiben“. Das hebräische Wort bezeichnet Personen, die Arbeit, Abgaben oder andere Leistungen erzwingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: anstelle von
  rationale: Die Präposition bezeichnet in der Reihe der Baustoffe eindeutig Ersatz; „anstelle von“ ist natürlich und präzise.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Der Ausdruck kann Kupfer beziehungsweise Bronze bezeichnen; in dieser Baustoffreihe ist „Bronze“ die übliche, nicht anachronistische Wiedergabe.
- source_word: אָבִיא
  choice: bringe ich
  rationale: Der Hifil von בוא bezeichnet hier Gottes Zuführung besserer Materialien; das deutsche Präsens gibt das hebräische Zukunftsversprechen idiomatisch wieder.
- source_word: עֵצִים
  choice: Holz
  rationale: Der Plural wird im Deutschen als kollektive Bezeichnung für Baumaterial natürlich mit „Holz“ wiedergegeben.
- source_word: שַׂמְתִּי
  choice: Ich setze … ein
  rationale: שׂים kann setzen, einsetzen oder bestellen bedeuten. „Einsetzen“ passt zur Ordnung des Gemeinwesens und erhält die Personifikation.
- source_word: פְקֻדָּתֵךְ
  choice: dir … als Aufsicht
  rationale: Das von פקד abgeleitete Kollektivum kann Aufsicht, Amt, Verwaltung oder Amtsträger bezeichnen. „Aufsicht“ bewahrt die kollektive beziehungsweise institutionelle Offenheit des Singulars.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst auch Wohlergehen und Ganzheit; „Frieden“ ist hier die zentrale und vertraute Wiedergabe.
- source_word: נֹגְשַׂיִךְ
  choice: deine Antreiber
  rationale: Der Plural bezeichnet Menschen, die Arbeit, Abgaben oder Leistung erzwingen. „Antreiber“ erhält den harten, konkreten Klang und die überraschende Verbindung mit Gerechtigkeit.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der Ausdruck kann moralische Rechtschaffenheit ebenso wie gerechte öffentliche Ordnung bezeichnen; „Gerechtigkeit“ lässt diese Spannweite offen.
theological_decisions:
- issue: Deutung der beiden personifizierten Größen im Schlusskolon
  choice: Frieden wird als Aufsicht und Gerechtigkeit als Antreiber eingesetzt.
  alternative: Deine Verwaltung wird Frieden und deine Herrschaft Gerechtigkeit sein.
  rationale: Die gewählte Fassung erhält die poetische Personifikation sowie die Spannung, dass eine sonst potenziell zwingende Autorität nun von Gerechtigkeit bestimmt ist, ohne daraus eine technische Staatslehre zu machen.
- issue: Numerus und Referenz von פְקֻדָּתֵךְ
  choice: kollektive beziehungsweise institutionelle Wiedergabe „Aufsicht“
  alternative: „deine Aufseher“ oder „deine Amtsträger“
  rationale: Die hebräische Form ist singularisch, kann aber Amt, Aufsicht oder die damit Betrauten meinen. Die deutsche Kollektivbezeichnung wahrt diese Mehrdeutigkeit besser als eine ausdrücklich pluralische Personenbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierteilige Steigerung bleibt knapp und rhythmisch; im Schlusskolon werden Personifikation und semantische Spannung des Hebräischen bewahrt. Alle Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Wendungen.
