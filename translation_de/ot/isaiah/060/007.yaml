source:
  edition: WLC
  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: de
  text: Alle Herden Kedars werden sich bei dir sammeln, die Widder Nebajots werden dir dienen. Sie werden als wohlgefällige Opfer auf meinen Altar hinaufkommen[a], und das Haus meiner Herrlichkeit werde ich herrlich machen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie werden zum Wohlgefallen auf meinen Altar hinaufkommen.“ Gemeint ist, dass sie als Opfer wohlgefällig angenommen werden.'
    reason: Die ungewöhnliche hebräische Verbindung von „hinaufgehen“, „Wohlgefallen“ und „Altar“ trägt sowohl ein räumliches als auch ein kultisches Bild.
  - marker: b
    text: „Das Haus meiner Herrlichkeit“ bezeichnet den Tempel. Das hebräische Verb kann auch „schmücken“, „verschönern“ oder „verherrlichen“ bedeuten.
    reason: Die Wortwurzel פאר erscheint im Ausdruck für Gottes herrliches Haus und erneut im Verb; die Fußnote macht das Wortspiel und die Bedeutungsbreite sichtbar.
lexical_decisions:
- source_word: כָּל צֹאן קֵדָר
  choice: Alle Herden Kedars
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Herden“ bewahrt den kollektiven Sinn; der Eigenname קֵדָר erscheint in der im Deutschen üblichen biblischen Form „Kedar“.
- source_word: יִקָּבְצוּ לָךְ
  choice: werden sich bei dir sammeln
  rationale: Der Nifal kann hier medial bzw. reflexiv verstanden werden. Die Formulierung gibt sowohl die Sammlung als auch die Ausrichtung auf die angeredete Zion/Jerusalem wieder, ohne den ungenannten Handelnden eines strikten Passivs einzuführen.
- source_word: אֵילֵי נְבָיוֹת
  choice: die Widder Nebajots
  rationale: Im Zusammenhang mit Herden und Altar bezeichnet אֵילֵי eindeutig Widder. נְבָיוֹת wird nach geläufiger deutscher Bibelnamensform als „Nebajot“ wiedergegeben.
- source_word: יְשָׁרְתוּנֶךְ
  choice: werden dir dienen
  rationale: שרת bezeichnet Dienst und kann kultischen Dienst einschließen. „Dienen“ ist im Deutschen natürlich, würdig und lässt den kultischen Zusammenhang durch den folgenden Altarbezug hervortreten.
- source_word: יַעֲלוּ עַל רָצוֹן מִזְבְּחִי
  choice: Sie werden als wohlgefällige Opfer auf meinen Altar kommen
  rationale: עלה bedeutet grundsätzlich „hinaufgehen“, trägt im Opferkontext jedoch die Vorstellung des Hinaufkommens bzw. Dargebrachtwerdens auf dem Altar. רָצוֹן bezeichnet hier Annahme oder Wohlgefallen. Die Ergänzung „Opfer“ ist kontextuell transparent und macht die im Deutschen sonst schwer verständliche Verbindung deutlich; eine Fußnote bewahrt die wörtlichere Bildgestalt.
- source_word: בֵית תִּפְאַרְתִּי
  choice: das Haus meiner Herrlichkeit
  rationale: Die Genitivverbindung bewahrt sowohl die Schönheit als auch die Herrlichkeit, die von Gott ausgeht und sein Haus kennzeichnet. Sie ist zugleich eine würdevolle, verständliche Bezeichnung für den Tempel.
- source_word: אֲפָאֵר
  choice: werde ich herrlich machen
  rationale: Das Piel von פאר kann „schmücken“, „verschönern“ oder „verherrlichen“ bedeuten. „Herrlich machen“ erhält die Wortverbindung mit תִּפְאַרְתִּי und lässt konkrete Verschönerung wie auch Verherrlichung anklingen.
theological_decisions:
- issue: Bezug der femininen Anrede „dir“
  choice: Die direkte Anrede bleibt unaufgelöst und richtet sich im Kontext an das personifizierte Zion/Jerusalem.
  alternative: Die Anrede ausdrücklich als das Volk Gottes deuten.
  rationale: Jesaja 60 redet Zion/Jerusalem als weibliche Person an. Das bloße „dir“ erhält diese Textgestalt und vermeidet eine weitergehende theologische Festlegung.
- issue: Kultischer Sinn der Tiere und ihres Hinaufkommens zum Altar
  choice: Die Tiere erscheinen als von Gott wohlgefällig angenommene Opfer.
  alternative: Nur allgemein von Tribut und Dienst sprechen, ohne den Opferbezug ausdrücklich zu machen.
  rationale: Herden, Widder, Altar, Hinaufkommen und Wohlgefallen bilden gemeinsam ein deutliches Opferbild. Die Übersetzung macht diesen Zusammenhang verständlich, ohne die Herkunft der Opfernden oder weitere kultische Einzelheiten festzulegen.
- issue: Bedeutung von Gottes Handeln am Tempel
  choice: „Herrlich machen“ lässt Verschönerung und Verherrlichung zugleich zu.
  alternative: Entweder ausschließlich konkret „verschönern“ oder ausschließlich theologisch „verherrlichen“ übersetzen.
  rationale: פאר umfasst beide Nuancen. Die gewählte Formulierung bewahrt die Spannung zwischen äußerer Pracht des wiederhergestellten Heiligtums und der ihm von Gott verliehenen Herrlichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch-poetischem Klang. Eigennamen folgen geläufigen deutschen Bibelformen. Die Satzstellung im letzten Glied hebt Gottes eigenes Handeln hervor; unnatürliche Hebraismen werden vermieden, während Bildsprache und Wortwiederholung möglichst erhalten bleiben.
