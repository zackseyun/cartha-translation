  text: כִּֽי הַ/גּ֧וֹי וְ/הַ/מַּמְלָכָ֛ה אֲשֶׁ֥ר לֹא יַעַבְד֖וּ/ךְ יֹאבֵ֑דוּ וְ/הַ/גּוֹיִ֖ם חָרֹ֥ב יֶחֱרָֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: de
  text: Denn das Volk und das Königreich, die dir nicht dienen, werden zugrunde gehen[a], und die Völker werden völlig verwüstet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen zunächst der Singular „das Volk und das Königreich“; danach folgt der Plural „die Völker“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden ganz gewiss verwüstet.“ Das Hebräische verstärkt das Verb durch einen vorangestellten absoluten Infinitiv derselben Wortwurzel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehenden Verheißungen und Gerichtsankündigungen ein und bewahrt den verbindenden Charakter des hebräischen Ausdrucks.
- source_word: הַגּוֹי
  choice: das Volk
  rationale: גּוֹי bezeichnet ein Volk beziehungsweise eine Nation. „Volk“ ist im Deutschen natürlich und bewahrt hier den Singular vor dem späteren Plural „Völker“.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: Entspricht der üblichen Bedeutung von מַמְלָכָה und passt zum prophetischen Zusammenhang.
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: die dir nicht dienen
  rationale: Das pluralische Verb bezieht sich auf die verbundenen Subjekte „Volk und Königreich“. „Dienen“ gibt עבד wieder, ohne die nicht ausdrücklich bezeichnete Bedeutung einer bewussten Weigerung hinzuzufügen.
- source_word: יֹאבֵדוּ
  choice: werden zugrunde gehen
  rationale: Gibt das breite Bedeutungsspektrum von אבד als Vergehen oder Ins-Verderben-Geraten wieder, ohne die Art des Untergangs näher festzulegen.
- source_word: וְהַגּוֹיִם
  choice: und die Völker
  rationale: Bewahrt den Wechsel vom repräsentativen Singular zum Plural sowie die einfache hebräische Satzverknüpfung.
- source_word: חָרֹב יֶחֱרָבוּ
  choice: werden völlig verwüstet werden
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb derselben Wurzel verstärkt die Aussage. „Völlig“ bringt diese Nachdrücklichkeit in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Bezug der femininen Singularendung in „dir dienen“
  choice: Die direkte Anrede wird mit „dir“ ohne erklärende Erweiterung beibehalten.
  alternative: „Zion dienen“, „Jerusalem dienen“ oder „dem wiederhergestellten Gottesvolk dienen“
  rationale: Im unmittelbaren Zusammenhang wird Zion beziehungsweise Jerusalem im femininen Singular angeredet. Die Übersetzung bewahrt die Bildsprache und legt den Bezug nicht auf eine theologische Abstraktion fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Bewegung vom Singular zum Plural bleibt erhalten; die hebräische Verstärkung wird idiomatisch mit „völlig“ wiedergegeben.
