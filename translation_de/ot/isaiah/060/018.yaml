  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: de
  text: In deinem Land wird keine Gewalt mehr zu hören sein, und innerhalb deiner Grenzen wird es keine Verwüstung und keine Zerstörung mehr geben[a]. Deine Mauern wirst du »Rettung« nennen und deine Tore »Lob«.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Plünderung und Zusammenbruch« statt »Verwüstung und Zerstörung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: wird … zu hören sein
  rationale: Die Nifal-Form wird passiv wiedergegeben und bezeichnet, dass Gewalt weder als Geschehen noch als Nachricht davon länger vernehmbar sein wird.
- source_word: חָמָס
  choice: Gewalt
  rationale: Der Ausdruck bezeichnet Gewalt, brutales Unrecht oder Unterdrückung; »Gewalt« passt am besten zum Zusammenhang und zur folgenden Parallelzeile.
- source_word: בְּאַרְצֵךְ
  choice: in deinem Land
  rationale: אֶרֶץ bezeichnet hier das Land als Lebens- und Herrschaftsraum der angesprochenen Stadt.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: Das Wort kann Raub beziehungsweise Plünderung oder deren verheerende Wirkung bezeichnen. »Verwüstung« fügt sich natürlich in die Parallelstruktur ein; die engere Alternative wird in der Fußnote bewahrt.
- source_word: שֶׁבֶר
  choice: Zerstörung
  rationale: Das zugrunde liegende Bild ist das Zerbrechen; im prophetischen Sprachgebrauch bezeichnet das Substantiv häufig Zusammenbruch, Verderben oder Zerstörung.
- source_word: בִּגְבוּלָיִךְ
  choice: innerhalb deiner Grenzen
  rationale: גְּבוּל bezeichnet Grenze oder abgegrenztes Gebiet. Die Formulierung erhält das räumliche Bild.
- source_word: וְקָרָאת
  choice: und du wirst … nennen
  rationale: Die vorangestellte Konjunktion wird als schlichtes »und« wiedergegeben; so wird kein im Hebräischen nicht ausdrücklich markierter Gegensatz eingeführt.
- source_word: יְשׁוּעָה
  choice: »Rettung«
  rationale: Das Substantiv kann Rettung, Heil oder Befreiung bedeuten. »Rettung« ist gegenwärtig und verständlich und fungiert durch die Anführungszeichen klar als verliehener Name.
- source_word: חוֹמֹתַיִךְ
  choice: deine Mauern
  rationale: Direkte Wiedergabe des Bildes der städtischen Befestigung.
- source_word: שְׁעָרַיִךְ
  choice: deine Tore
  rationale: Direkte Wiedergabe der Stadttore als Zugänge und Orte des öffentlichen Lebens.
- source_word: תְּהִלָּה
  choice: »Lobpreis«
  rationale: Das Wort bezeichnet Lob, Ruhm oder Lobgesang. »Lobpreis« erhält den auf Gott ausgerichteten Klang und steht parallel zum Namen »Rettung«.
theological_decisions:
- issue: Sind יְשׁוּעָה und תְּהִלָּה gewöhnliche Beschreibungen oder verliehene Namen?
  choice: Sie werden als namenartige Bezeichnungen »Rettung« und »Lobpreis« wiedergegeben.
  alternative: Kleingeschriebene beschreibende Substantive wie »Rettung«/»Heil« und »Lob« ohne Kennzeichnung als Namen.
  rationale: Die Syntax »du wirst deine Mauern X nennen und deine Tore Y« legt eine Namensgebung nahe. Anführungszeichen machen diese Funktion im Deutschen sichtbar, ohne die Begriffe zu personifizieren oder ihre theologische Bedeutung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt den Schauplatz hervor und bleibt zugleich gut verständlich. Das Semikolon erhält die enge Verbindung der beiden prophetischen Aussagen; die wiederholte Konjunktion entspricht der hebräischen Reihung.
