  text: תַּ֧חַת הֱיוֹתֵ֛/ךְ עֲזוּבָ֥ה וּ/שְׂנוּאָ֖ה וְ/אֵ֣ין עוֹבֵ֑ר וְ/שַׂמְתִּי/ךְ֙ לִ/גְא֣וֹן עוֹלָ֔ם מְשׂ֖וֹשׂ דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: de
  text: Statt dass du verlassen und gehasst warst und niemand durch dich zog, werde ich dich zu ewiger Hoheit,[a] zur Freude von Generation zu Generation machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ewigem Ruhm“ oder „zu ewiger Erhabenheit“. Das hebräische Wort kann Hoheit, Erhabenheit oder Stolz im Sinn einer ehrenvollen Stellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: Statt dass du … warst
  rationale: Die Konstruktion bezeichnet den Austausch des früheren Zustands gegen den verheißenen neuen; die finite deutsche Form ist natürlich und bewahrt den Rückblick.
- source_word: עֲזוּבָה וּשְׂנוּאָה
  choice: verlassen und gehasst
  rationale: Die beiden passiven Formen beschreiben Zions bisherigen Zustand unmittelbar und ohne abschwächende Deutung.
- source_word: וְאֵין עוֹבֵר
  choice: und niemand durch dich hindurchzog
  rationale: Das Partizip schildert ausbleibenden Durchgangsverkehr als Zeichen der Verödung. Die Vergangenheitsform fügt sich im Deutschen in die Beschreibung des früheren Zustands ein.
- source_word: וְשַׂמְתִּיךְ
  choice: mache ich dich
  rationale: שׂים mit ל bezeichnet hier die Herbeiführung eines neuen Zustands.
- source_word: לִגְאוֹן עוֹלָם
  choice: zu ewiger Hoheit
  rationale: גאון bezeichnet hier eine von Gott verliehene erhöhte Ehrenstellung. „Hoheit“ vermeidet den im Deutschen meist negativen Sinn von „Stolz“, ohne die Erhöhung zu verflachen.
- source_word: מְשׂוֹשׂ
  choice: zur Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohlocken und steht parallel zum neuen Status der Stadt.
- source_word: דּוֹר וָדוֹר
  choice: von Generation zu Generation
  rationale: Die hebräische Wiederholungsform drückt ununterbrochene Dauer über aufeinanderfolgende Generationen aus.
theological_decisions:
- issue: Bedeutung von גאון in der Wiederherstellungsverheißung
  choice: Hoheit als von Gott verliehene, dauerhafte Ehrenstellung
  alternative: Stolz, Herrlichkeit oder Erhabenheit
  rationale: Der Zusammenhang spricht von Zions Wiederherstellung und Erhöhung, nicht von sündhafter Selbstüberhebung. „Hoheit“ wahrt den positiven Sinn und lässt die genaue Nuance des hebräischen Begriffs in einer Fußnote erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede Zions bleibt erkennbar; die Bildsprache der verlassenen Stadt und der Gegensatz zwischen früherer Verödung und künftiger Ehre werden bewahrt.
