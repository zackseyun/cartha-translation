  text: וְ/הָלְכ֥וּ גוֹיִ֖ם לְ/אוֹרֵ֑/ךְ וּ/מְלָכִ֖ים לְ/נֹ֥גַהּ זַרְחֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: de
  text: Völker[b] werden zu deinem Licht kommen[a] und Könige zum Glanz deines Aufstrahlens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »werden zu deinem Licht gehen« oder »werden zu deinem Licht wandeln«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Nationen«; in manchen Zusammenhängen kann das Wort auch »Heiden« bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »zum Glanz deines Aufgangs« oder »zum Strahlen deiner Morgendämmerung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: werden … kommen
  rationale: הלך bedeutet wörtlich »gehen« oder »wandeln«. Da die Völker sich auf ein mit לְ bezeichnetes Ziel zubewegen, gibt »kommen« die Bewegung im Deutschen idiomatisch wieder; die Zukunftsform entspricht dem prophetischen Zusammenhang.
- source_word: גוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet Völker beziehungsweise Nationen. »Völker« ist im Deutschen weit, natürlich und in diesem Zusammenhang weniger missverständlich als »Heiden«.
- source_word: לְאוֹרֵךְ
  choice: zu deinem Licht
  rationale: אוֹר bedeutet »Licht«; das Suffix der zweiten Person Singular feminin bezieht sich im unmittelbaren Zusammenhang auf das personifizierte Zion beziehungsweise Jerusalem. »Zu« bewahrt die Zielrichtung von לְ.
- source_word: וּמְלָכִים
  choice: und Könige
  rationale: מְלָכִים bedeutet eindeutig »Könige«; das allgemeinere »Herrscher« wäre breiter als der Ausgangstext.
- source_word: לְנֹגַהּ
  choice: zum Glanz
  rationale: נֹגַהּ bezeichnet Glanz, Helligkeit oder Strahlen. »Glanz« ist knapp, poetisch und im modernen Deutschen verständlich.
- source_word: זַרְחֵךְ
  choice: deines Aufstrahlens
  rationale: Die Form geht auf זרח, »aufgehen, hervorstrahlen«, zurück. »Aufstrahlen« erhält sowohl die Lichtmetaphorik als auch den dynamischen Charakter, ohne sie eindeutig auf die Morgendämmerung festzulegen.
theological_decisions:
- issue: Bezug der Suffixe in der zweiten Person Singular feminin
  choice: Direkte Anrede an das als Frau personifizierte Zion beziehungsweise Jerusalem
  alternative: Allgemeinere Anrede an das Volk Gottes
  rationale: Der unmittelbare Zusammenhang von Jesaja 60 spricht Zion in weiblicher Einzahl an. Die Übersetzung belässt es bei »deinem/deines« und trägt keine weitergehende ekklesiologische Deutung in den Vers ein.
translation_notes:
  register: Moderne, würdevolle und poetische Standardsprache. Die parallele Satzstruktur des Hebräischen bleibt erhalten; das zweite Verb wird wie im Ausgangstext elliptisch aus dem ersten Satzglied ergänzt. »Aufstrahlen« bewahrt die offene Bildsprache zwischen Aufgang, Morgendämmerung und Hervorleuchten.
