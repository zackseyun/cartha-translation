  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: de
  text: Ja, auf mich hoffen die Küstenländer[a], und die Schiffe von Tarschisch zuerst, um deine Söhne aus der Ferne zu bringen. Ihr Silber und ihr Gold haben sie bei sich – für den Namen Jahwes, deines Gottes, und für den Heiligen Israels, denn er hat dich verherrlicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Inseln“ oder „die fernen Küsten“. Das hebräische Wort bezeichnet häufig maritime Länder und Küstengebiete im weiteren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn er hat dich geschmückt“ oder „denn er hat dir Ehre verliehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ja
  rationale: Die Partikel leitet hier eine bekräftigende Erklärung ein. „Ja“ gibt diese emphatische Funktion im Deutschen natürlich wieder, ohne einen zwingenden Kausalzusammenhang vorzugeben.
- source_word: לִי ... יְקַוּוּ
  choice: auf mich hoffen
  rationale: Das Verb bezeichnet erwartungsvolles Warten bzw. Hoffen; mit לִי ist „auf mich hoffen“ idiomatisches Deutsch und bewahrt die positive Erwartung.
- source_word: אִיִּים
  choice: Küstenländer
  rationale: Der Ausdruck bezeichnet besonders bei Jesaja häufig Inseln, Küsten und maritime Länder im weiteren Sinn. „Küstenländer“ wahrt diese geografische Breite.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: Tarschisch-Schiffe
  rationale: Die traditionelle geografische bzw. schifffahrtsbezogene Bezeichnung bleibt erhalten, ohne zwischen Schiffen aus Tarschisch und einer Schiffsklasse zu entscheiden.
- source_word: בָּרִאשֹׁנָה
  choice: fahren voran
  rationale: Das Adverb bezeichnet Vorrang oder die führende Position. Im Zusammenhang mit Schiffen drückt „fahren voran“ dies natürlich aus.
- source_word: בָנַיִךְ
  choice: deine Söhne
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin plural; zudem werden im näheren Kontext Töchter gesondert erwähnt.
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: Ihr Silber und ihr Gold haben sie bei sich
  rationale: Die Formulierung bewahrt die wiederholten Possessivsuffixe und das zusätzliche „bei ihnen“, klingt aber als eigener deutscher Satz natürlich.
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: für den Namen Jahwes, deines Gottes
  rationale: „Für den Namen“ drückt Ziel und Ehre aus; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי פֵאֲרָךְ
  choice: denn er hat dich verherrlicht
  rationale: Das Verb kann verherrlichen, schmücken oder ehren bedeuten. „Verherrlicht“ passt zum Kontext der wiederhergestellten Herrlichkeit Zions, ohne die Bildsprache auf äußere Schönheit zu begrenzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Wiedergabe von בָנַיִךְ
  choice: deine Söhne
  alternative: deine Kinder
  rationale: Die maskuline Form wird beibehalten; im umliegenden Abschnitt werden Töchter eigens genannt.
- issue: Bezug des Subjekts in פֵאֲרָךְ
  choice: er hat dich verherrlicht
  alternative: der Heilige Israels hat dich verherrlicht
  rationale: Das hebräische Verb enthält ein maskulines Singularsubjekt, nennt es aber nicht nochmals ausdrücklich. Das Pronomen erhält diesen Bezug, ohne den Satz stärker auszudeuten als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede Zions im Femininum bleibt erkennbar; die leichte Wiederholung bei Silber und Gold bewahrt den Nachdruck des Hebräischen. Der Gedankenstrich gliedert den langen Satz, ohne seine inhaltlichen Beziehungen aufzulösen.
