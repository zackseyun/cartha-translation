source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: de
  text: Die Söhne deiner Bedrücker werden tief gebeugt zu dir kommen,[a] und alle, die dich verachtet haben, werden sich vor deinen Füßen niederwerfen.[b] Sie werden dich »Stadt Jahwes, Zion des Heiligen Israels« nennen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Söhne derer, die dich bedrückten, werden gebeugt zu dir kommen.«'
    reason: lexical_alternative
  - marker: b
    text: Das Niederwerfen drückt hier Unterwerfung oder Huldigung gegenüber Zion aus, nicht die göttliche Anbetung der Stadt.
    reason: cultural_note
  - marker: c
    text: »Zion des Heiligen Israels« bezeichnet Zion als dem Heiligen Israels zugehörig.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחֹחַ
  choice: tief gebeugt
  rationale: Die Form beschreibt eine körperlich erniedrigte Haltung beim Herankommen; »tief gebeugt« bewahrt sowohl das sichtbare Bild als auch den Beiklang der Unterwerfung.
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: die Söhne deiner Bedrücker
  rationale: בְּנֵי bedeutet ausdrücklich »Söhne«, während מְעַנַּיִךְ Personen bezeichnet, die Zion bedrückt oder misshandelt haben. Die Wiedergabe bleibt nah an der hebräischen Formulierung.
- source_word: וְהִשְׁתַּחֲווּ
  choice: werden sich niederwerfen
  rationale: Das Verb bezeichnet hier eine körperliche Geste der Unterwerfung oder Huldigung. »Sich niederwerfen« erhält die Stärke des Ausdrucks, ohne eine Anbetung der Stadt zu behaupten.
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: vor deinen Fußsohlen
  rationale: כַּפּוֹת bezeichnet bei רַגְלַיִךְ die Sohlen der Füße. Die ungewöhnlich bildhafte Formulierung wird bewusst erhalten.
- source_word: מְנַאֲצָיִךְ
  choice: die dich verachtet haben
  rationale: Das Wort bezeichnet verächtliche Zurückweisung beziehungsweise Geringschätzung; »verachtet« ist prägnant und idiomatisch.
- source_word: עִיר יְהוָה
  choice: Stadt Jahwes
  rationale: Die Genitivverbindung bezeichnet die Stadt als Jahwe zugehörig. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: Zion des Heiligen Israels
  rationale: 'Die knappe hebräische Fügung wird als Zugehörigkeitstitel verstanden: Zion gehört dem »Heiligen Israels«. Dadurch wird vermieden, Zion selbst mit dem Heiligen Israels gleichzusetzen.'
- source_word: וְקָרְאוּ לָךְ
  choice: Sie werden dich … nennen
  rationale: Die Wendung bezeichnet die Benennung mit Titeln; »nennen« ist dafür im Deutschen natürlich.
theological_decisions:
- issue: Die Niederwerfung vor Zion
  choice: Eine Geste der Unterwerfung und Huldigung gegenüber dem wiederhergestellten Zion
  alternative: Das Verb als kultische »Anbetung« der Stadt wiederzugeben
  rationale: השתחוה kann je nach Kontext Anbetung bezeichnen, doch hier richtet sich die Geste an Zion. Die Übersetzung bewahrt die körperliche und politische Unterwerfung, ohne der Stadt göttliche Verehrung zuzuschreiben.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה; »Jahwe« gibt ihn als Gottesnamen wieder und unterscheidet ihn von einem Titel.
- issue: Bezug von קְדוֹשׁ יִשְׂרָאֵל
  choice: »des Heiligen Israels« bestimmt Zion als dem Heiligen Israels zugehörig
  alternative: Zion selbst als »der Heilige Israels« zu identifizieren
  rationale: Die zweite Lesart wäre inhaltlich irreführend. Der Kontext und die Titelfolge sprechen dafür, dass Zion durch seine Zugehörigkeit zu Israels Heiligem bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-konkreten Bilder »tief gebeugt« und »vor deinen Fußsohlen« bleiben erhalten. Die beiden abschließenden Bezeichnungen werden durch deutsche Anführungszeichen als Titel kenntlich gemacht; »Jahwe« gibt den Gottesnamen direkt wieder.
