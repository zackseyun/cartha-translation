  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: de
  text: 'Denn siehe: Finsternis wird die Erde bedecken und tiefes Dunkel die Völker. Doch über dir[a] wird der HERR aufgehen, und seine Herrlichkeit wird über dir erscheinen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „dir“ steht in der weiblichen Einzahl und spricht die zuvor angeredete Stadt Zion beziehungsweise Jerusalem an.
    reason: Im Deutschen ist am Pronomen „dir“ weder Geschlecht noch Zahl erkennbar; die Fußnote macht eine im Hebräischen vorhandene Kontextinformation sichtbar.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn siehe
  rationale: Gibt sowohl die begründende Verknüpfung כִּי als auch den aufmerksamkeitslenkenden Ausruf הִנֵּה knapp und würdig wieder.
- source_word: הַחֹשֶׁךְ
  choice: Finsternis
  rationale: Bewahrt das starke poetische Bild und bildet zusammen mit „tiefes Dunkel“ die Steigerung des hebräischen Parallelismus ab.
- source_word: עֲרָפֶל
  choice: tiefes Dunkel
  rationale: Bezeichnet dichtes, bedrückendes Dunkel; diese Wiedergabe ist im heutigen Deutsch verständlich und unterscheidet den Ausdruck von חֹשֶׁךְ.
- source_word: יִזְרַח
  choice: geht ... auf
  rationale: Das Verb beschreibt typischerweise das Aufgehen oder Aufstrahlen von Licht beziehungsweise Sonne. „Geht ... auf“ erhält das Bild, ohne es durch die ausdrückliche Ergänzung „wie die Sonne“ zu erweitern.
- source_word: יֵרָאֶה
  choice: erscheint
  rationale: Gibt die Nifalform als Sichtbarwerden beziehungsweise Erscheinen wieder und passt natürlich zur Herrlichkeit des HERRN.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention, den Gottesnamen durch „HERR“ in Kapitälchen beziehungsweise Großschreibung wiederzugeben.
theological_decisions:
- issue: Bild des aufgehenden HERRN
  choice: „über dir geht der HERR auf“
  alternative: „über dir erstrahlt der HERR“
  rationale: Die gewählte Form bewahrt die konkrete Metapher des hebräischen Verbs und lässt zugleich offen, wie das Bild theologisch auszulegen ist.
- issue: Bezug der zweiten Person Singular
  choice: „über dir“ mit erklärender Fußnote
  alternative: den Namen „Zion“ oder „Jerusalem“ in den Vers einsetzen
  rationale: Der hebräische Text nennt im Vers keinen Namen, sondern setzt die angeredete weibliche Gestalt aus dem Kontext voraus. Die Übersetzung vermeidet daher eine erklärende Einfügung in den Haupttext.
translation_notes:
  register: Poetisch, würdig und zugleich gegenwartsnah. Die beiden Satzhälften werden durch „Doch“ deutlich kontrastiert; der Parallelismus und das Licht-Dunkel-Bild bleiben erhalten.
