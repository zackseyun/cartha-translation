id: ISA.60.11
reference: Isaiah 60:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: de
  text: Deine Tore werden ständig offen stehen; weder bei Tag noch bei Nacht werden sie geschlossen, damit der Reichtum[a] der Völker zu dir gebracht wird und ihre Könige herbeigeführt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Besitz“, „Stärke“ oder „Heer“ bedeuten; im Zusammenhang sind wahrscheinlich die Reichtümer der Völker gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geführt“ beziehungsweise „als Gefangene vorgeführt“. Das hebräische Wort bezeichnet ein Geführtwerden, legt dessen Art hier aber nicht eindeutig fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ
  choice: werden … offen stehen
  rationale: Die Form beschreibt im Zusammenhang den fortdauernden Zustand der Tore. „Offen stehen“ ist dafür im Deutschen natürlich und bewahrt den Zukunftsbezug der prophetischen Aussage.
- source_word: שְׁעָרַיִךְ
  choice: deine Tore
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 2. Person Feminin Singular; angesprochen ist Zion beziehungsweise Jerusalem.
- source_word: תָּמִיד
  choice: ständig
  rationale: Bezeichnet die ununterbrochene Dauer und lässt sich im modernen Standarddeutsch klar und würdig lesen.
- source_word: יוֹמָם וָלַיְלָה
  choice: weder bei Tag noch bei Nacht
  rationale: Die hebräische Zeitformel bezeichnet die Gesamtheit der Zeit. Mit der folgenden Verneinung ist die deutsche weder-noch-Konstruktion idiomatisch.
- source_word: לֹא יִסָּגֵרוּ
  choice: werden sie geschlossen
  rationale: Das Nifal bezeichnet, dass die Tore nicht geschlossen werden; die Passivform bleibt erhalten.
- source_word: לְהָבִיא
  choice: damit … gebracht wird
  rationale: Der mit ל gebildete Infinitiv drückt hier den Zweck der ständig offenen Tore aus.
- source_word: אֵלַיִךְ
  choice: zu dir
  rationale: Gibt die Bewegung auf das als weibliche Einzahl angeredete Zion hin natürlich wieder.
- source_word: חֵיל גּוֹיִם
  choice: der Reichtum der Völker
  rationale: חֵיל kann Stärke, Heer oder Vermögen bezeichnen. Im Kontext von Jesaja 60, wo die Völker ihre Güter nach Zion bringen, ist „Reichtum“ am wahrscheinlichsten; die lexikalische Breite wird in einer Fußnote kenntlich gemacht.
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: und ihre Könige herbeigeführt werden
  rationale: Das passive Partizip von נהג bezeichnet ein Geführtwerden. „Herbeigeführt“ wahrt die passive Bewegung auf Zion zu, ohne eindeutig zwischen ehrenvollem Geleit und Unterwerfung zu entscheiden.
theological_decisions:
- issue: Bedeutung von חֵיל גּוֹיִם im Bild von Zions Wiederherstellung
  choice: wirtschaftlicher Reichtum beziehungsweise Besitz der Völker
  alternative: Stärke oder Heer der Völker
  rationale: Die umliegenden Verse sprechen von Gold, Weihrauch, Herden und weiteren Gütern, die nach Zion gelangen. „Reichtum“ entspricht daher dem unmittelbaren literarischen Zusammenhang, während die mögliche Bedeutungsbreite nicht verschwiegen wird.
- issue: Stellung der Könige in נְהוּגִים
  choice: Die Könige werden zu Zion herbeigeführt, ohne die Art dieses Führens festzulegen.
  alternative: Die Könige werden als Gefangene vorgeführt oder in einem feierlichen Zug geleitet.
  rationale: Das passive Partizip lässt sowohl feierliches Geleit als auch unterworfene Vorführung zu. Die Hauptübersetzung bewahrt diese Spannung und vermeidet eine unbelegte Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Zions in der weiblichen Einzahl bleibt erhalten. Der parallele Rhythmus von ständig offenen Toren sowie Tag und Nacht wird gewahrt; zugleich bleibt die mögliche Spannung zwischen feierlichem Geleit und Unterwerfung der Könige offen.
