base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: de
  text: Und ich werde mein Lager ringsum gegen dich aufschlagen[a], dich mit einem Belagerungswerk einschließen[b] und gegen dich Belagerungsanlagen errichten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „kreisförmig um dich“; wörtlich kann die Wendung „wie ein Kreis“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch eine feste Stellung, einen Belagerungsposten oder eine Garnison bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind möglicherweise Belagerungswälle, Belagerungsrampen oder Belagerungstürme; die genaue Art der Anlagen bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: Und ich werde … lagern
  rationale: חנה bezeichnet das Lagern oder Aufschlagen eines Lagers; im Zusammenhang ist der militärische Sinn deutlich. Die erste Person Singular und die einleitende Konjunktion bleiben ausdrücklich erhalten.
- source_word: כַדּוּר
  choice: ringsum
  rationale: דּוּר bezeichnet hier wahrscheinlich eine kreisförmige Anordnung. „Ringsum“ gibt die beabsichtigte vollständige Einschließung natürlich wieder; das konkretere Bild „wie ein Kreis“ wird in der Fußnote bewahrt.
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: gegen dich / dich
  rationale: עַל mit femininem Singularsuffix bezeichnet im militärischen Kontext die feindliche Ausrichtung gegen die angeredete Stadt. Wo es das deutsche Verb verlangt, wird die Beziehung idiomatisch durch den Akkusativ ausgedrückt.
- source_word: וְצַרְתִּי
  choice: dich … belagern
  rationale: צור hat hier den militärischen Sinn „belagern“. Die direkte und geläufige deutsche Entsprechung hält die Aussage klar.
- source_word: מֻצָּב
  choice: mit einem Belagerungswerk
  rationale: Das Substantiv bezeichnet etwas Aufgestelltes oder eine feste Stellung. „Belagerungswerk“ passt zum Kontext, ohne die genaue Art der Anlage zu stark festzulegen; mögliche engere Bedeutungen stehen in der Fußnote.
- source_word: וַהֲקִימֹתִי
  choice: und … errichten
  rationale: Die Hifil-Form von קום bedeutet „aufstellen, errichten“. „Errichten“ ist bei militärischen Anlagen im Deutschen natürlich und präzise.
- source_word: מְצֻרוֹת
  choice: Belagerungsanlagen
  rationale: Der Plural gehört zum Wortfeld von Belagerung und Befestigung, doch die genaue Art der Anlagen ist unsicher. Der Oberbegriff vermeidet die nicht zwingend gesicherte Festlegung auf Belagerungstürme oder -rampen.
theological_decisions:
- issue: Sprecher und unmittelbare Urheberschaft des Gerichts
  choice: Die Verben der ersten Person werden als unmittelbares Handeln Gottes wiedergegeben.
  alternative: Gott lässt lediglich mittelbar ein menschliches Heer handeln oder gestattet dessen Angriff.
  rationale: Der hebräische Text verwendet durchgehend ausdrückliche Verbformen der ersten Person Singular. Die Übersetzung schwächt diese Urheberschaft nicht zu bloßer Zulassung ab, legt aber auch nicht fest, durch welches menschliche Werkzeug sie ausgeführt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache göttliche Ich-Aussage und die an die personifizierte Stadt gerichtete feminine Singularform werden gewahrt. Die militärische Terminologie bleibt verständlich, ohne unsichere technische Einzelheiten festzuschreiben.
