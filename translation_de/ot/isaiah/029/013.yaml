base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: de
  text: 'Und der Herr sagte: Weil dieses Volk mit seinem Mund naht und mich mit seinen Lippen ehrt, sein Herz aber fern von mir ist und seine Furcht vor mir zu einem Gebot von Menschen geworden ist, das gelehrt wird[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem von Menschen gelehrten Gebot geworden ist“ oder „zu einem menschlichen Gebot, das erlernt wird“. „Furcht“ kann hier auch „Ehrfurcht“ oder „Verehrung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die Form ist der göttliche Hoheitstitel Adonaj, nicht das Tetragramm; „der Herr“ entspricht dem deutschen prophetischen Sprachgebrauch.
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Die Verbindung leitet den Grund für das folgende göttliche Handeln ein und wird im Deutschen natürlich kausal wiedergegeben.
- source_word: נִגַּשׁ
  choice: naht
  rationale: Das Verb bezeichnet das Herantreten und kann hier kultische Annäherung anklingen lassen; „naht“ bewahrt diese Nuance in würdigem, verständlichem Deutsch.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die singularische Kollektivbezeichnung und der prophetische Ton werden direkt bewahrt.
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: mit seinem Mund … mit seinen Lippen
  rationale: Die singularischen Suffixe beziehen sich auf das kollektiv verstandene Volk; der körperbezogene Parallelismus bleibt erhalten.
- source_word: כִּבְּדוּנִי
  choice: ehrt mich
  rationale: כבד bedeutet hier, jemandem Ehre beziehungsweise Gewicht beizumessen; „ehrt“ ist die klare idiomatische Entsprechung.
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: sein Herz aber fern von mir ist
  rationale: Die Zustandsaussage gibt die innere Distanz wieder; „aber“ macht den im Hebräischen durch die Satzfügung ausgedrückten Kontrast natürlich sichtbar.
- source_word: וַתְּהִי
  choice: geworden ist
  rationale: Die Form bezeichnet den eingetretenen Zustand; das deutsche Perfekt fügt sich in den von „weil“ abhängigen Satz.
- source_word: יִרְאָתָם אֹתִי
  choice: ihre Furcht vor mir
  rationale: „Furcht“ bewahrt den lexikalischen Kern sowie die Spannung zwischen echter Gottesfurcht und äußerlich erlernter Frömmigkeit.
- source_word: מִצְוַת אֲנָשִׁים מְלֻמָּדָה
  choice: ein angelerntes Menschengebot
  rationale: Die kompakte Wendung wahrt sowohl den menschlichen Ursprung des Gebots als auch den passiven Sinn von מְלֻמָּדָה. „Angelernt“ lässt die mögliche Nuance bloß äußerlich übernommener Unterweisung anklingen, ohne ausdrücklich „auswendig“ einzutragen.
theological_decisions:
- issue: Bedeutungsumfang der Gottesfurcht
  choice: ihre Furcht vor mir
  alternative: ihre Ehrfurcht vor mir; ihre Verehrung meiner Person
  rationale: יִרְאָה umfasst Furcht, Ehrfurcht und gottesdienstliche Frömmigkeit. Der Haupttext wahrt mit „Furcht“ den Grundsinn und löst die theologische Spannung nicht einseitig auf.
- issue: Deutung von מִצְוַת אֲנָשִׁים מְלֻמָּדָה
  choice: ein angelerntes Menschengebot
  alternative: ein Gebot von Menschen, das gelehrt wird; eine erlernte Vorschrift von Menschen
  rationale: Die hebräische Konstruktion lässt offen, ob besonders das Lehren oder das Erlernen hervorgehoben wird. Die Übersetzung bildet die passive, durch menschliche Unterweisung geprägte Frömmigkeit knapp ab; die Fußnote dokumentiert die formellere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Satzbau. „Naht“ ist leicht gehoben, aber allgemein verständlich und trägt die mögliche kultische Nuance. Der Vers endet entsprechend der vorliegenden Einheit mit einem Komma, da der Begründungssatz in Jesaja 29,14 fortgeführt wird.
