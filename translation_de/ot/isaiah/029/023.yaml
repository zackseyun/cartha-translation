id: ISA.29.23
reference: Isaiah 29:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: de
  text: Denn wenn er seine Kinder[a], das Werk meiner Hände, in seiner Mitte sieht, werden sie meinen Namen heiligen. Sie werden den Heiligen Jakobs als heilig ehren und vor dem Gott Israels in Ehrfurcht erbeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „er“ kann sich auf Jakob beziehungsweise Israel als personifizierte Gemeinschaft beziehen; möglich ist auch ein Bezug auf Abraham oder auf Jakob als Stammvater, die im vorhergehenden Vers genannt werden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „den Gott Israels fürchten“ beziehungsweise „verehren“. Das hebräische Verb bezeichnet Ehrfurcht, die auch Erschrecken oder Beben einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: Denn wenn er … sieht
  rationale: כִּי erläutert die vorausgehende Verheißung; ב mit dem Infinitiv constructus und Suffix hat hier zeitliche Bedeutung. Die Wiedergabe bewahrt sowohl den begründenden Anschluss als auch den zeitlichen Nebensatz.
- source_word: יְלָדָיו
  choice: seine Kinder
  rationale: Das Wort bezeichnet hier kollektiv die Nachkommen und ist nicht auf männliche Söhne zu verengen.
- source_word: מַעֲשֵׂה יָדַי
  choice: das Werk meiner Hände
  rationale: Die konkrete hebräische Metapher für Gottes eigenes Schaffen oder Formen bleibt erhalten.
- source_word: בְּקִרְבּוֹ
  choice: in seiner Mitte
  rationale: Die Form wahrt das singularische Suffix und lässt den Bezug auf den Stammvater oder auf Jakob/Israel als personifizierte Gemeinschaft offen.
- source_word: יַקְדִּישׁוּ שְׁמִי
  choice: sie werden meinen Namen heiligen
  rationale: קדש im Hifil bedeutet, etwas als heilig zu behandeln oder anzuerkennen. Die traditionelle und verständliche Wendung bewahrt die Heiligungssprache.
- source_word: וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: Sie werden den Heiligen Jakobs als heilig ehren
  rationale: Die Wiederholung der Wurzel קדש wird durch „heilig“ sichtbar gehalten; zugleich klingt die deutsche Form natürlicher als „den Heiligen … heiligen“. Der feste jesajanische Gottesname „der Heilige Jakobs“ bleibt erhalten.
- source_word: יַעֲרִיצוּ
  choice: in Ehrfurcht erbeben
  rationale: ערץ im Hifil verbindet ehrfürchtige Verehrung mit Erschrecken oder Beben. Die Formulierung bewahrt beide Bedeutungsanteile.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Der geläufige Gottesname wird unmittelbar und transparent wiedergegeben.
theological_decisions:
- issue: Bezug der singularischen Pronomen in „wenn er … sieht“ und „in seiner Mitte“
  choice: Der Haupttext lässt den singularischen Bezug offen und kann Jakob/Israel als personifizierte Gemeinschaft bezeichnen.
  alternative: Gemeint sein kann besonders Abraham aus dem vorhergehenden Vers oder Jakob als einzelner Stammvater.
  rationale: Der Kontext nennt sowohl Jakob als auch Abraham. Der hebräische Wortlaut entscheidet den Bezug nicht ausdrücklich; deshalb wird er nicht stillschweigend festgelegt.
- issue: Wiedergabe der zweimaligen Heiligungssprache
  choice: „meinen Namen heiligen“ und „den Heiligen Jakobs als heilig ehren“
  alternative: Beide Vorkommen strikt gleich mit „heiligen“ wiederzugeben.
  rationale: Die deutsche Fassung macht die Wiederholung von קדש erkennbar, vermeidet aber beim zweiten Vorkommen eine missverständliche oder unnatürliche Formulierung, als würde Gott erst heilig gemacht.
- issue: Bedeutungsumfang von ערץ
  choice: „in Ehrfurcht erbeben“
  alternative: „fürchten“, „verehren“ oder „vor ihm erschrecken“
  rationale: Die gewählte Formulierung hält ehrfürchtige Verehrung und erschütterndes Gottesbewusstsein zusammen, ohne eines von beiden auszublenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener biblischer Bildsprache. Die Satzstruktur bleibt gut lesbar; Schlüsselbegriffe wie „Name“, „heiligen“ und „der Heilige Jakobs“ werden nicht paraphrastisch aufgelöst.
