  text: וְ/הָיָ֛ה כְּ/אָבָ֥ק דַּ֖ק הֲמ֣וֹן זָרָ֑יִ/ךְ וּ/כְ/מֹ֤ץ עֹבֵר֙ הֲמ֣וֹן עָֽרִיצִ֔ים וְ/הָיָ֖ה לְ/פֶ֥תַע פִּתְאֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: de
  text: Doch die Menge deiner Fremden[a] wird wie feiner Staub sein und die Menge der Gewalttätigen wie vorüberziehende Spreu. Es wird plötzlich geschehen, in einem Augenblick.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deiner Ausländer. Gemeint sind im Zusammenhang fremde Außenstehende, die als Angreifer auftreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird … sein / es wird … geschehen
  rationale: 'Die beiden Vorkommen haben im Satz unterschiedliche Funktionen: Das erste verbindet die Menschenmengen mit den Vergleichsbildern, das zweite kündigt das plötzliche Eintreten des Geschehens an.'
- source_word: כְּאָבָק דַּק
  choice: wie feiner Staub
  rationale: אָבָק bezeichnet Staub; דַּק hebt dessen Feinheit hervor. Die Formulierung bewahrt das Bild von etwas, das leicht zerstreut wird.
- source_word: הֲמוֹן
  choice: Menge
  rationale: הֲמוֹן bezeichnet hier eine große Menschenmasse. „Menge“ ist verständlich, würdevoll und lässt die im Kontext gemeinte feindliche Streitmacht erkennen, ohne sie ausdrücklich in den Text einzutragen.
- source_word: זָרָיִךְ
  choice: deine Fremden
  rationale: Das Wort bezeichnet Fremde beziehungsweise Außenstehende. Die kontextuelle Feindseligkeit wird nicht durch die stärker deutende Übersetzung „Feinde“ vorweggenommen.
- source_word: וּכְמֹץ עֹבֵר
  choice: wie vorüberwehende Spreu
  rationale: מֹץ ist „Spreu“, und עֹבֵר beschreibt sie als vorüberziehend. „Vorüberwehend“ gibt das bewegte, flüchtige Bild im Deutschen natürlich wieder.
- source_word: עָרִיצִים
  choice: die Gewalttätigen
  rationale: עָרִיץ bezeichnet gewalttätige, rücksichtslose Bedrücker. Die substantivierte Form bewahrt die moralische Aussage, ohne eine bestimmte politische Amtsstellung wie „Tyrannen“ vorauszusetzen.
- source_word: לְפֶתַע פִּתְאֹם
  choice: plötzlich … ganz unvermittelt
  rationale: Die zwei nahezu gleichbedeutenden Ausdrücke verstärken die Aussage der jähen, unerwarteten Wendung. Beide werden wiedergegeben, ohne im Deutschen schwerfällig zu wirken.
