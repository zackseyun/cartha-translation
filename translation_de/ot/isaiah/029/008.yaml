revisions:
- from: 'Und es wird sein wie bei einem Hungrigen, der träumt: Siehe, er isst. Doch er wacht auf, und sein Verlangen ist leer[a]. Und wie bei einem Durstigen, der träumt: Siehe, er trinkt. Doch er wacht auf, und siehe, er ist erschöpft, und sein Verlangen lechzt[b]. So wird es der Menge all der Völker ergehen, die gegen den Berg Zion Krieg führen.'
  to: Und es wird sein, wie wenn ein Hungriger träumt und siehe, er isst; doch er wacht auf, und sein Hunger ist nicht gestillt[a]. Oder wie wenn ein Durstiger träumt und siehe, er trinkt; doch er wacht auf, und siehe, er ist erschöpft, und sein Durst ist nicht gestillt[b]. So wird es der Menge aller Völker ergehen, die gegen den Berg Zion Krieg führen.
  rationale: Die Revision beseitigt die unnatürlichen Prädikationen „Verlangen ist leer/lechzt“, konkretisiert die im Bildzusammenhang gemeinte unerfüllte Bedürftigkeit als Hunger und Durst und hält die weiter gefasste Bedeutung von נֶפֶשׁ in den Fußnoten transparent. Die Parallelstruktur und die wiederholte deiktische Partikel bleiben erhalten.
