review_pass:
  verdict: revise
  source_fidelity: Die Vergleichsstruktur, die Traumszenen, das Erwachen und der militärische Angriff der Völker auf den Berg Zion sind zutreffend wiedergegeben. Die Übersetzung von נֶפֶשׁ durch „Verlangen“ ist im Grundsatz vertretbar, doch „sein Verlangen ist leer“ und besonders „sein Verlangen lechzt“ sind im modernen Standarddeutsch semantisch bzw. idiomatisch unglücklich. Die konkreten Bilder von Hunger und Durst erlauben hier die natürlichere Wiedergabe „sein Hunger ist nicht gestillt“ bzw. „sein Durst ist nicht gestillt“, mit Fußnoten zur hebräischen Formulierung.
  naturalness: „Wie wenn“ ist für den wiederholten Vergleich idiomatischer als „wie bei einem …, der“. „Siehe“ kann im würdigen biblischen Register erhalten bleiben, sollte aber in den Satzfluss eingebunden werden. „Hunger/Durst ist nicht gestillt“ ist klar, gegenwartsdeutsch und bewahrt die Pointe des enttäuschten Traumgenusses.
  terminology: '„Berg Zion“ und „gegen … Krieg führen“ sind angemessen. Die Fußnoten sollten die lexikalische Spannweite von נֶפֶשׁ erklären, ohne „wörtlicher“ irreführend auf eine einzige deutsche Entsprechung festzulegen: „Seele“ ist eine mögliche traditionelle Wiedergabe, aber keine kontextfreie wörtliche Übersetzung.'
  issues:
  - severity: medium
    issue: „sein Verlangen ist leer“
    rationale: Die Verbindung ist im Deutschen unidiomatisch; Verlangen kann ungestillt, stark oder drängend sein, aber nicht sinnvoll „leer“.
  - severity: medium
    issue: „sein Verlangen lechzt“
    rationale: „Lechzen“ wird gewöhnlich von einer Person, einem Tier oder bildlich von Kehle/Lippen gesagt, nicht von „Verlangen“. Dadurch wird der Satz künstlich und weniger verständlich.
  - severity: low
