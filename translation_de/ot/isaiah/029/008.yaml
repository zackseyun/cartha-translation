source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: de
  text: Und es wird sein, wie wenn ein Hungriger träumt und siehe, er isst; doch er wacht auf, und sein Hunger ist nicht gestillt[a]. Oder wie wenn ein Durstiger träumt und siehe, er trinkt; doch er wacht auf, und siehe, er ist erschöpft, und sein Durst ist nicht gestillt[b]. So wird es der Menge aller Völker ergehen, die gegen den Berg Zion Krieg führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Inneres ist leer“; wörtlich steht „seine נפש ist leer“. נפש kann „Seele“, „Leben“, „Selbst“ oder im Zusammenhang von Hunger und Durst das Verlangen bzw. den Appetit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Inneres verlangt“ oder „seine Kehle lechzt“. Wörtlich steht „seine נפש ist verlangend“; der Ausdruck beschreibt den nach dem Erwachen fortbestehenden Mangel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird sein
  rationale: Bewahrt die prophetische Zukunftsformel und leitet den Vergleich ein.
- source_word: כַּאֲשֶׁר
  choice: wie bei einem …, der
  rationale: Gibt den wiederholten Vergleich idiomatisch und zugleich strukturell nah am Hebräischen wieder.
- source_word: יַחֲלֹם
  choice: der träumt
  rationale: Das Imperfekt schildert hier einen allgemeinen, anschaulichen Fall; das deutsche Präsens passt dazu.
- source_word: הָרָעֵב / הַצָּמֵא
  choice: ein Hungriger / ein Durstiger
  rationale: Die substantivierten Adjektive bewahren den repräsentativen maskulinen Singular, ohne das im Hebräischen nicht eigens ausgedrückte Substantiv „Mann“ einzufügen.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Erhält die lebhafte deiktische Wirkung und den würdigen prophetischen Ton.
- source_word: אוֹכֵל / שֹׁתֶה
  choice: er isst / er trinkt
  rationale: Das deutsche Präsens stellt die im Traum gegenwärtige Handlung lebendig dar.
- source_word: וְהֵקִיץ
  choice: Doch er wacht auf
  rationale: „Doch“ macht den im Zusammenhang klaren Gegensatz zwischen scheinbarer Sättigung und erwachtem Mangel sichtbar.
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: sein Verlangen ist leer
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang von Hunger und Durst das bedürftige Selbst beziehungsweise sein Verlangen; „Verlangen“ bewahrt mehr semantische Weite als „Appetit“.
- source_word: עָיֵף
  choice: erschöpft
  rationale: Bezeichnet den körperlich entkräfteten Zustand des Durstigen nach dem Erwachen.
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: sein Verlangen lechzt
  rationale: Bewahrt die intensive, fortdauernde Begierde und passt besonders zur Durstmetaphorik, ohne נֶפֶשׁ technisch als immaterielle Seele festzulegen.
- source_word: הֲמוֹן כָּל־הַגּוֹיִם
  choice: die Menge all der Völker
  rationale: Gibt sowohl die große Schar als auch die Gesamtheit der angreifenden Völker wieder.
- source_word: הַצֹּבְאִים עַל
  choice: die gegen … Krieg führen
  rationale: Das Partizip von צבא bezeichnet hier das militärische Aufgebot beziehungsweise den Kriegszug gegen Zion.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im körperlichen Bild von Hunger und Durst
  choice: Verlangen
  alternative: Seele; Kehle; Appetit
  rationale: Der Kontext bezeichnet das bedürftige, begehrende Innere des Menschen. „Verlangen“ vermeidet eine unnötige anthropologische Festlegung, während die Fußnoten die konkreteren beziehungsweise formaleren Möglichkeiten offenhalten.
- issue: Repräsentativer maskuliner Singular bei הָרָעֵב und הַצָּמֵא
  choice: ein Hungriger / ein Durstiger
  alternative: ein hungriger Mann / ein durstiger Mann; ein hungriger Mensch / ein durstiger Mensch
  rationale: Die substantivierten Formen spiegeln Genus und Numerus des Hebräischen, ohne das Beispiel geschlechtlich stärker festzulegen, als der Ausgangstext es verlangt.
- issue: Art des Angriffs der Völker auf Zion
  choice: Krieg führen
  alternative: sich gegen Zion scharen; gegen Zion zu Felde ziehen
  rationale: צבא trägt einen klar militärischen Sinn. Die Übersetzung benennt diesen, ohne den Ausgang des Angriffs oder eine zusätzliche eschatologische Deutung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem „Siehe“ für die lebhafte prophetische Bildsprache. Der parallele Satzbau des Hebräischen bleibt deutlich; unnötige Zusätze wie „noch immer“ wurden vermieden.
