  text: וַ/הֲצִיק֖וֹתִי לַֽ/אֲרִיאֵ֑ל וְ/הָיְתָ֤ה תַֽאֲנִיָּה֙ וַֽ/אֲנִיָּ֔ה וְ/הָ֥יְתָה לִּ֖/י כַּ/אֲרִיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/002.yaml
  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
translation:
  language: de
  text: Und ich werde Ariel bedrängen[a]; und es wird Klagen und Wehklagen geben, und sie wird mir wie ein Opferherd sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische אֲרִיאֵל („Ariel“) enthält wahrscheinlich ein Wortspiel: Die Stadt, die Ariel heißt, wird wie ein „Opferherd“ werden. Formeller kann der Schlusssatz auch lauten: „Und sie wird mir wie Ariel sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: Und ich werde … bedrängen
  rationale: Das Hifil von צוק/ציק bezeichnet das Zufügen von Bedrängnis oder Druck. „Bedrängen“ bewahrt den weiten Sinn, ohne die militärische Belagerung, die im folgenden Vers ausdrücklich hervortritt, schon hier festzuschreiben.
- source_word: לַאֲרִיאֵל
  choice: Ariel
  rationale: אֲרִיאֵל dient im Zusammenhang als Name bzw. Bezeichnung Jerusalems (vgl. V. 1) und wird daher transliteriert. Die mögliche Bedeutung „Opferherd“ kommt beim zweiten Vorkommen zur Geltung.
- source_word: תַאֲנִיָּה וַאֲנִיָּה
  choice: Klagen und Wehklagen
  rationale: Die beiden klanglich verwandten Substantive bezeichnen Trauerklage und schmerzliches Wehklagen. Das deutsche Wortpaar erhält die poetische Häufung und den hörbaren Ausdruck des Leids.
- source_word: וְהָיְתָה לִּי
  choice: und sie wird mir … sein
  rationale: Das feminine Subjekt verweist wahrscheinlich auf Ariel als personifizierte Stadt. „Sie“ erhält diesen Bezug und bildet die hebräische Konstruktion knapp und würdig ab.
- source_word: כַּאֲרִיאֵל
  choice: wie ein Opferherd
  rationale: 'Die Wiederholung von אֲרִיאֵל bildet wahrscheinlich ein Wortspiel: Die Ariel genannte Stadt wird wie ein אֲרִיאֵל, ein Opfer- bzw. Altarherd. „Opferherd“ vermittelt die sachliche Bedeutung und die Bildsprache; die formale Alternative wird in der Fußnote bewahrt.'
theological_decisions:
- issue: Wiedergabe des wiederholten אֲרִיאֵל und seines Wortspiels
  choice: Beim ersten Vorkommen „Ariel“ als Stadtbezeichnung, beim zweiten „Opferherd“ als wahrscheinliche lexikalische Bedeutung.
  alternative: 'Beide Vorkommen mit „Ariel“ wiedergeben: „… und sie wird mir wie Ariel sein.“'
  rationale: Der Kontext bezeichnet Jerusalem als Ariel, während der Schlusssatz wahrscheinlich mit der Bedeutung des Namens spielt und ein Opferbild aufruft. Die Übersetzung macht diese prophetische Pointe verständlich, ohne die bestehende lexikalische Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Doppelung des Klagevokabulars bleibt erhalten. „Opferherd“ ist verständlicher als das fachsprachlichere „Altarherd“ und bewahrt zugleich die kultische Bildsprache; die Mehrdeutigkeit von Ariel wird durch die Fußnote offengehalten.
