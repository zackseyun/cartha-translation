source:
  edition: WLC
  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: de
  text: Denn Jahwe hat einen Geist des Tiefschlafs[a] über euch ausgegossen. Er hat eure Augen – die Propheten – geschlossen und eure Häupter – die Seher – verhüllt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Geist der Benommenheit“. Das hebräische Wort kann tiefen Schlaf oder einen lähmenden, betäubungsähnlichen Zustand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Satzfügung ist schwierig. Wahrscheinlich werden „die Propheten“ mit „euren Augen“ und „die Seher“ mit „euren Häuptern“ gleichgesetzt. Möglich ist auch, „die Propheten“ als eigenständiges Objekt zu „geschlossen“ zu verstehen; „die Seher“ erläutern dann wahrscheinlich weiterhin „eure Häupter“.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den zuvor beschriebenen Zustand beziehungsweise das Gericht ein.
- source_word: נָסַךְ
  choice: hat … ausgegossen
  rationale: Bewahrt das konkrete Bild des Ausgießens und gibt die vollzogene Handlung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רוּחַ תַּרְדֵּמָה
  choice: einen Geist des Tiefschlafs
  rationale: רוּחַ bezeichnet hier am ehesten einen auferlegten inneren Zustand; תַּרְדֵּמָה kann tiefen Schlaf oder eine lähmende Benommenheit bezeichnen. Die Fußnote erhält diese Bedeutungsbreite.
- source_word: וַיְעַצֵּם
  choice: hat … geschlossen
  rationale: Das Verb bezeichnet konkret das Schließen der Augen; die Bildsprache wird nicht durch eine deutende Wiedergabe wie „blind gemacht“ aufgelöst.
- source_word: עֵינֵיכֶם
  choice: eure Augen
  rationale: Die wörtliche Wiedergabe bewahrt das Bild für die Wahrnehmungsorgane des Volkes.
- source_word: אֶת הַנְּבִיאִים
  choice: die Propheten
  rationale: Wird entsprechend der wahrscheinlichen Parallelstruktur als Apposition zu „eure Augen“ verstanden.
- source_word: רָאשֵׁיכֶם
  choice: eure Häupter
  rationale: Bewahrt das hebräische Körperbild und lässt zugleich die mögliche Nebenbedeutung führender Personen anklingen.
- source_word: הַחֹזִים
  choice: die Seher
  rationale: Gibt den besonderen prophetischen Ausdruck knapp wieder und unterscheidet ihn von „Propheten“.
- source_word: כִּסָּה
  choice: verhüllt
  rationale: Entspricht dem Bild des Bedeckens, klingt im Zusammenhang mit Sehern natürlich und wahrt die Parallelität zum Schließen der Augen.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: Jahwe wird ausdrücklich als der Handelnde dargestellt, der den Geist des Tiefschlafs ausgießt sowie Augen schließt und Häupter verhüllt.
  alternative: Permissive Wiedergabe wie „Jahwe ließ einen Geist des Tiefschlafs über euch kommen“.
  rationale: Die hebräischen Verben schreiben Jahwe die Handlungen unmittelbar zu. Diese theologische Spannung wird nicht abgeschwächt.
- issue: Syntaktische Beziehung von „Propheten“ und „Sehern“ zu „Augen“ und „Häuptern“
  choice: „Die Propheten“ und „die Seher“ stehen als erläuternde Appositionen zu „eure Augen“ und „eure Häupter“.
  alternative: Die Bezeichnungen werden als weitere, eigenständige Satzobjekte verstanden.
  rationale: 'Die appositionelle Lesart erklärt den Parallelismus besonders schlüssig: Die Propheten sind die Augen des Volkes, die Seher seine Häupter. Wegen der schwierigen Syntax wird die andere Möglichkeit in einer Fußnote offengehalten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Häupter“ ist bewusst leicht gehoben gewählt, weil „Köpfe“ in dieser Apposition missverständlich oder unfreiwillig grob klänge und weil das Wortbild zugleich die Vorstellung leitender Personen zulässt. Gedankenstriche kennzeichnen die wahrscheinlichen Appositionen klar.
