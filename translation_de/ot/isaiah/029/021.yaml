  text: מַחֲטִיאֵ֤י אָדָם֙ בְּ/דָבָ֔ר וְ/לַ/מּוֹכִ֥יחַ בַּ/שַּׁ֖עַר יְקֹשׁ֑וּ/ן וַ/יַּטּ֥וּ בַ/תֹּ֖הוּ צַדִּֽיק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: de
  text: die einen Menschen wegen eines Wortes schuldig sprechen[a], dem, der im Tor zurechtweist[b], eine Falle stellen und den Gerechten mit nichtigen Gründen abweisen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die einen Menschen durch ein Wort zur Sünde verleiten“. Das Hebräische kann sowohl das Verursachen von Sünde als auch das Schuldigsprechen bezeichnen; der rechtliche Zusammenhang legt hier die zweite Bedeutung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Stadttor war der übliche Ort öffentlicher Verhandlungen und der Rechtsprechung. „Zurechtweist“ kann hier auch bedeuten: „Einspruch erhebt“ oder „eine Rechtssache vertritt“.'
    reason: cultural_and_lexical_note
  - marker: c
    text: 'Wörtlicher: „den Gerechten durch Nichtiges beiseitedrängen“; auch möglich: „dem Gerechten ohne Grund das Recht verweigern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי אָדָם בְּדָבָר
  choice: die einen Menschen wegen eines Wortes schuldig sprechen
  rationale: Der Hifil-Partizip von חטא kann bedeuten, jemanden zur Sünde zu verleiten oder ihn als schuldig zu behandeln. Der gerichtliche Zusammenhang mit dem Stadttor spricht hier eher für eine ungerechte Beschuldigung oder Verurteilung. „Wegen eines Wortes“ bewahrt die Mehrdeutigkeit von דָּבָר als Wort, Aussage, Sache oder Streitfall.
- source_word: לַמּוֹכִיחַ
  choice: dem, der … zurechtweist
  rationale: יכח kann sowohl moralisches Zurechtweisen als auch rechtliches Einreden, Streiten oder Entscheiden bezeichnen. „Zurechtweist“ ist verständlich und lässt den öffentlichen beziehungsweise rechtlichen Unterton im Zusammenhang mit dem Tor bestehen.
- source_word: בַּשַּׁעַר
  choice: im Tor
  rationale: Das Stadttor war ein Ort öffentlicher Beratung und Rechtsprechung. Die knappe hebräische Ortsangabe wird beibehalten und in einer Fußnote kulturell erläutert.
- source_word: יְקֹשׁוּן
  choice: eine Falle stellen
  rationale: Das Verb יקשׁ bezeichnet das Fangen mit einer Schlinge oder Falle. Die deutsche Wendung gibt das Bild einer absichtlichen, heimtückischen Verstrickung natürlich wieder.
- source_word: וַיַּטּוּ בַתֹּהוּ צַדִּיק
  choice: und den Gerechten mit nichtigen Gründen abweisen
  rationale: נטה kann im Rechtszusammenhang das Abbiegen, Beugen oder Abweisen bezeichnen; תֹהוּ steht für Leere, Nichtigkeit oder Haltlosigkeit. Die Wiedergabe macht den rechtlichen Sinn verständlich, ohne festzulegen, ob der Gerechte selbst, seine Sache oder sein Recht abgewiesen wird.
