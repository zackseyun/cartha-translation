base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
translation:
  language: de
  text: Denn der Gewalttätige[a] wird nicht mehr da sein, der Spötter wird ein Ende nehmen, und alle, die auf Unrecht lauern[b], werden ausgerottet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Tyrann“ beziehungsweise „der Rücksichtslose“. Das hebräische Wort kann einen gewalttätigen oder unterdrückerischen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die auf Unrecht bedacht sind“ oder „die nach Bösem Ausschau halten“. Das hebräische Partizip bezeichnet wachsame, beharrliche Aufmerksamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Verheißung; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: אָפֵס
  choice: wird nicht mehr da sein
  rationale: Das Verb bezeichnet das Aufhören oder Verschwinden. Die Formulierung bewahrt den resultativen Sinn und klingt im modernen Deutschen natürlich.
- source_word: עָרִיץ
  choice: der Gewalttätige
  rationale: Das Wort bezeichnet einen gewalttätigen, rücksichtslosen oder unterdrückerischen Menschen. Die substantivierte Singularform wahrt die individualisierende Ausdrucksweise des Hebräischen, ohne sie unnötig auf einen politischen Herrscher einzuengen.
- source_word: וְכָלָה
  choice: wird ein Ende nehmen
  rationale: כלה bezeichnet hier das Zu-Ende-Kommen. Die Wendung ist idiomatisch und vermeidet eine stärkere Aussage über Vernichtung, als das Verb für sich genommen verlangt.
- source_word: לֵץ
  choice: der Spötter
  rationale: לֵץ bezeichnet einen Menschen, der mit hochmütiger Verachtung spottet. „Spötter“ ist prägnant, verständlich und entspricht dem moralischen Ton.
- source_word: וְנִכְרְתוּ
  choice: werden ausgerottet
  rationale: Der Niphal von כרת bedeutet, abgeschnitten oder beseitigt zu werden, häufig im Zusammenhang mit Gericht. „Ausgerottet“ gibt die Endgültigkeit der hebräischen Wendung in natürlichem biblischem Deutsch wieder.
- source_word: כָּל
  choice: alle
  rationale: Entspricht dem umfassenden kollektiven Sinn.
- source_word: שֹׁקְדֵי
  choice: die … lauern
  rationale: Das Partizip von שׁקד drückt wachsame, beharrliche Aufmerksamkeit aus. „Auf … lauern“ vermittelt hier die absichtsvolle Suche nach einer Gelegenheit zum Unrecht.
- source_word: אָוֶן
  choice: Unrecht
  rationale: אָוֶן kann Unheil, Bosheit, Mühsal oder Unrecht bezeichnen. In Verbindung mit den handelnden Personen bringt „Unrecht“ den ethischen Sinn klar zum Ausdruck.
