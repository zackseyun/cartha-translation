  naturalness: »Tief schürfen« bewahrt das Bild des tiefen Grabens bzw. Vordringens und ist im Kontext der beabsichtigten Verheimlichung verständlicher. Die zweite Frage erhält sinnvollerweise ein eigenes Fragezeichen; der Fußnotenanker gehört unmittelbar an die betreffende Wendung.
  terminology: »Wehe«, »Plan«, »Jahwe«, »Taten« und »im Dunkeln« sind für den Kontext und ein würdiges modernes Standarddeutsch geeignet. »Wer kennt uns?« wahrt die knappe persönliche Form des hebräischen »wer weiß/kennt uns?«, ohne das Objekt auf ihr Tun zu verengen.
