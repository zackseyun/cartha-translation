  text: ה֛וֹי הַ/מַּעֲמִיקִ֥ים מֵֽ/יהוָ֖ה לַ/סְתִּ֣ר עֵצָ֑ה וְ/הָיָ֤ה בְ/מַחְשָׁךְ֙ מַֽעֲשֵׂי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ מִ֥י רֹאֵ֖/נוּ וּ/מִ֥י יוֹדְעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: de
  text: 'Wehe denen, die tief schürfen[a], um ihren Plan vor Jahwe zu verbergen, deren Taten im Dunkeln geschehen und die sagen: »Wer sieht uns? Wer kennt uns?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die tief graben«; das Bild bezeichnet den Versuch, einen Plan besonders gründlich zu verheimlichen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wer weiß von uns?« Das hebräische Verb kann hier das Wissen um sie und ihr verborgenes Tun einschließen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Wehruf und eine Gerichtsankündigung ein; »Wehe« bewahrt diese Kraft im Deutschen.
- source_word: הַמַּעֲמִיקִים
  choice: die in die Tiefe gehen
  rationale: Bewahrt das Bild des hebräischen Verbs עמק, das hier metaphorisch ein besonders verborgenes Vorgehen bezeichnet, ohne die Metapher vorschnell aufzulösen.
- source_word: מֵיהוָה
  choice: vor Jahwe
  rationale: Die Präposition bezeichnet hier die Person, vor der etwas verborgen werden soll. »Vor Jahwe« ist im Deutschen idiomatisch und gibt den Sinn der Konstruktion präzise wieder.
- source_word: לַסְתִּר
  choice: um … zu verbergen
  rationale: Der Infinitiv bezeichnet den Zweck ihres Vorgehens.
- source_word: עֵצָה
  choice: Plan
  rationale: עֵצָה kann Rat, Beratung oder Plan bedeuten; im Zusammenhang mit heimlichem Handeln ist »Plan« natürlich und sachlich treffend.
- source_word: בְמַחְשָׁךְ
  choice: im Dunkeln
  rationale: Erhält das konkrete Bild der Dunkelheit, das zugleich Heimlichkeit und moralische Verfinsterung anklingen lässt.
- source_word: מַעֲשֵׂיהֶם
  choice: ihre Taten
  rationale: »Taten« ist eine natürliche Wiedergabe und bewahrt das moralische Gewicht des Ausdrucks.
- source_word: מִי רֹאֵנוּ
  choice: Wer sieht uns?
  rationale: Entspricht knapp der hebräischen Partizipialkonstruktion mit dem Suffix der ersten Person Plural.
- source_word: וּמִי יוֹדְעֵנוּ
  choice: und wer kennt uns?
  rationale: Bewahrt die knappe und bewusst offene Formulierung des Hebräischen; gemeint sein kann auch, wer von ihnen und ihrem Tun weiß.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gegenstand des göttlichen Wissens
  choice: »Wer kennt uns?« bleibt offen formuliert
  alternative: »Wer weiß, was wir tun?«
  rationale: Der hebräische Text nennt als Objekt »uns« und erklärt nicht ausdrücklich »unser Tun«. Die Übersetzung erhält diese theologische Spannung zwischen persönlichem Erkanntsein und Kenntnis der verborgenen Taten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wehruf bleibt markant; die Bilder von Tiefe und Dunkelheit werden beibehalten. Direkte Rede steht in deutschen Anführungszeichen.
