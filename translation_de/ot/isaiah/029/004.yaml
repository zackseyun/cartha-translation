source:
  edition: WLC
  text: וְ/שָׁפַלְתְּ֙ מֵ/אֶ֣רֶץ תְּדַבֵּ֔רִי וּ/מֵֽ/עָפָ֖ר תִּשַּׁ֣ח אִמְרָתֵ֑/ךְ וְֽ֠/הָיָה כְּ/א֤וֹב מֵ/אֶ֨רֶץ֙ קוֹלֵ֔/ךְ וּ/מֵ/עָפָ֖ר אִמְרָתֵ֥/ךְ תְּצַפְצֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: de
  text: 'Dann wirst du erniedrigt sein: Aus der Erde wirst du sprechen, und aus dem Staub wird deine Rede leise sein. Deine Stimme wird wie die eines Totenmediums[a] aus der Erde klingen, und aus dem Staub wird deine Rede zirpen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Totengeistes“. Das hebräische Wort אוֹב kann ein Medium bezeichnen, das Tote befragt, oder einen mit Totenbefragung verbundenen Geist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: Dann wirst du erniedrigt sein
  rationale: Das Verb שׁפל bezeichnet das Niedrigsein beziehungsweise Erniedrigtwerden. Die Form ist feminin Singular und richtet sich an die personifizierte Stadt; „dann“ gibt den fortführenden Zusammenhang idiomatisch wieder.
- source_word: מֵאֶרֶץ ... וּמֵעָפָר
  choice: aus der Erde ... aus dem Staub
  rationale: Die konkrete räumliche Bildsprache und der poetische Parallelismus von אֶרֶץ und עָפָר bleiben erhalten.
- source_word: תִּשַּׁח אִמְרָתֵךְ
  choice: deine Rede nur gedämpft zu hören sein
  rationale: תִּשַּׁח ist schwierig und beschreibt hier wahrscheinlich eine abgesenkte, schwache Äußerung. Die Formulierung vermittelt das Bild einer kaum vernehmbaren Stimme, ohne ausdrücklich ein Flüstern in den Text einzutragen.
- source_word: כְּאוֹב
  choice: wie die eines Totenbeschwörers
  rationale: אוֹב kann eine mit Totenbefragung verbundene Person oder den dabei angerufenen Totengeist bezeichnen. Im Vergleich mit „Stimme“ ist die personale Wiedergabe verständlich; die echte lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: תְּצַפְצֵף
  choice: wird ... zirpen
  rationale: Das Verb bezeichnet einen dünnen, piepsenden oder zirpenden Laut. „Zirpen“ erhält die auffällige, unheimlich wirkende Klangmetapher.
theological_decisions:
- issue: אוֹב im Zusammenhang mit verbotener Totenbefragung
  choice: Totenbeschwörer
  alternative: Totengeist; Totenmedium
  rationale: Der Vers verwendet einen Vergleich für die schwache, aus der Erde kommende Stimme und billigt die Praxis nicht. Die Hauptübersetzung wahrt den Bezug zur Totenbeschwörung; die Fußnote lässt offen, ob stärker die beschwörende Person oder der angerufene Geist gemeint ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit erhaltener poetischer Parallelität. Die personifizierte Stadt wird entsprechend dem hebräischen Femininum mit „du“ angeredet. „Nur gedämpft zu hören sein“ vermeidet sowohl die unklare Wörtlichkeit „niedrig sein“ als auch die stärkere Festlegung auf „flüstern“.
