  rationale: Die Revision entfernt die unbegründete Verstärkung „nur“, gibt die schwierige Aussage über die erniedrigte Rede knapp und idiomatisch wieder und ersetzt die zu enge, geschlechtlich markierte Bezeichnung „Totenbeschwörer“ durch „Totenmedium“. Die Fußnote bewahrt die relevante lexikalische Ambiguität von אוֹב.
