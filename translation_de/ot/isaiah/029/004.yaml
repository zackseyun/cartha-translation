  - severity: medium
    issue: „Totenbeschwörers“ legt כְּאוֹב unnötig auf eine männliche, aktiv beschwörende Person fest.
    rationale: אוֹב kann im biblischen Sprachgebrauch ein Medium bzw. einen damit verbundenen Geist bezeichnen. Im unmittelbaren Stimmvergleich sollte die Mehrdeutigkeit nicht im Haupttext übermäßig eingeengt werden.
