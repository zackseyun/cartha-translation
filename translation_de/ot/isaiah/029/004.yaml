  verdict: revise
  source_fidelity: 'Die Grundstruktur und Bildsprache werden zutreffend wiedergegeben: die als Frau angeredete Stadt wird erniedrigt und spricht aus Erde und Staub. Bei תִּשַּׁח ist eine zurückhaltende Wiedergabe als „leise“ dem schwierigen hebräischen Ausdruck angemessen. Das im Entwurf hinzugefügte „nur“ hat jedoch keine ausdrückliche Grundlage im Text. כְּאוֹב ist lexikalisch nicht sicher auf einen männlichen „Totenbeschwörer“ festzulegen; „Totenmedium“ wahrt die personale Lesart ohne das Geschlecht einzutragen, während die Fußnote die Geisterlesart offenhält.'
  naturalness: „Aus der Erde“ und „aus dem Staub“ funktionieren in der poetischen Bildsprache. „Deine Rede wird leise sein“ ist modernes, klares Deutsch und bewahrt die knappe Parallelität besser als die umschreibende, zusätzlich einschränkende Formulierung „nur gedämpft zu hören sein“.
  terminology: „Totenmedium“ ist für die personale Bedeutung von אוֹב neutraler und präziser als „Totenbeschwörer“, das stärker eine aktiv beschwörende Handlung und ein männliches Geschlecht nahelegt. Die Fußnote erhält die umstrittene bzw. kontextabhängige Bedeutungsspanne (Medium/Geist), ohne den Vergleich dogmatisch festzulegen.
