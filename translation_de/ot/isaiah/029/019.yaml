source:
  edition: WLC
  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: de
  text: Die Demütigen werden ihre Freude an Jahwe vermehren[a], und die Armen unter den Menschen werden über den Heiligen Israels jubeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „werden Freude an/in Jahwe hinzufügen oder vermehren“. Auch möglich: „werden wieder Freude an Jahwe haben“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Armen“ kann auch mit „die Bedürftigen“ wiedergegeben werden; „unter den Menschen“ gibt das hier allgemein gebrauchte hebräische Wort für Mensch/Menschheit wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: werden sich wieder mehr ... freuen
  rationale: יסף bedeutet „hinzufügen, vermehren“ und kann hier zugleich eine erneute und eine zunehmende Freude ausdrücken. Die deutsche Formulierung gibt diese Verbindung idiomatisch wieder, ohne sie bloß auf „wieder“ zu reduzieren.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort bezeichnet demütige, sanftmütige oder sozial erniedrigte Menschen. „Die Demütigen“ bewahrt die geistliche und soziale Bedeutungsbreite.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: Bei „sich freuen“ wird der Gegenstand der Freude im Deutschen natürlich mit „an“ bezeichnet. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: die Armen unter den Menschen
  rationale: אֶבְיוֹן bezeichnet Arme oder Bedürftige; אָדָם ist hier generisch auf die Menschheit bezogen. Die Wendung gibt den hebräischen Konstrukt verständlich wieder.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: über den Heiligen Israels
  rationale: Die Präposition ב bezeichnet hier, parallel zur ersten Vershälfte, den Gegenstand beziehungsweise Grund der Freude. „Der Heilige Israels“ bleibt als charakteristischer Jesaja-Titel erhalten.
- source_word: יָגִילוּ
  choice: werden ... jubeln
  rationale: גיל bezeichnet lebhafte, frohlockende Freude. „Jubeln“ unterscheidet die kräftigere Aussage passend von שִׂמְחָה in der ersten Vershälfte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Freude „in/an“ Gott
  choice: an Jahwe / über den Heiligen Israels
  alternative: in Jahwe / im Heiligen Israels
  rationale: Die gewählten Präpositionen sind im modernen Deutschen idiomatisch und lassen sowohl Gott als Gegenstand als auch als Grund der Freude anklingen, ohne die Aussage konfessionell zu verengen.
- issue: Generische Bedeutung von אָדָם
  choice: unter den Menschen
  alternative: des Menschen
  rationale: אָדָם meint hier Menschen allgemein und ist nicht auf Männer beschränkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Sich freuen“ und „jubeln“ bilden die beiden unterschiedlichen hebräischen Freudeausdrücke ab; „wieder mehr“ bewahrt möglichst knapp die Mehrdeutigkeit von יסף zwischen Wiederholung und Zunahme.
