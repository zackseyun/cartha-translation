source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: de
  text: Und die Menge aller Nationen, die gegen Ariel[a] Krieg führen – alle, die gegen sie und ihre Festung[b] Krieg führen und sie bedrängen –, wird wie ein Traum sein, wie eine Vision in der Nacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ariel ist in diesem Zusammenhang Jesajas poetischer Name für Jerusalem.
    reason: cross_reference
  - marker: b
    text: 'Oder: „ihre befestigte Anlage“; manche verstehen die Wendung als „die Belagerungswerke gegen sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird … sein
  rationale: Die Form führt im prophetischen Zusammenhang den zukünftigen Vergleich ein. Das deutsche Futur gibt dies klar und ohne altertümliche Wendung wieder.
- source_word: כַּחֲלוֹם חֲזוֹן לַיְלָה
  choice: wie ein Traum, eine nächtliche Vision
  rationale: כְּ kennzeichnet den Vergleich; חֲזוֹן לַיְלָה erläutert den Traum appositionell. Die Formulierung bewahrt die poetische Bildsprache und klingt in modernem Deutsch natürlich.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: die Menge all der Nationen
  rationale: הֲמוֹן bezeichnet eine große, gegebenenfalls lärmende Menschenmenge; im militärischen Zusammenhang passt „Menge“. גּוֹיִם meint hier die fremden Nationen.
- source_word: הַצֹּבְאִים עַל / צֹבֶיהָ
  choice: die gegen … Krieg führen
  rationale: Die Formen von צבא bezeichnen hier feindliches militärisches Vorgehen. Die Wiederholung im Deutschen bewahrt die auffällige lexikalische Wiederaufnahme des Hebräischen.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Der poetische Name wird entsprechend dem Ausgangstext transliteriert und nicht im Haupttext durch seine kontextuelle Deutung „Jerusalem“ ersetzt.
- source_word: מְצֹדָתָהּ
  choice: ihre Festung
  rationale: מְצוֹדָה bezeichnet gewöhnlich eine Festung oder befestigte Anlage. Der feminine Suffixbezug wird am unmittelbarsten auf Ariel bezogen; eine andere syntaktisch-lexikalische Deutung wird in der Fußnote offengehalten.
- source_word: וְהַמְּצִיקִים לָהּ
  choice: und sie bedrängen
  rationale: Das Partizip bezeichnet Menschen, die Ariel unter Druck setzen und in Bedrängnis bringen. „bedrängen“ erhält den umfassenden Sinn, ohne ihn auf eine bestimmte Belagerungstechnik einzuengen.
theological_decisions:
- issue: Bezug und Wiedergabe von „Ariel“
  choice: „Ariel“ als poetischen Ortsnamen im Haupttext beibehalten
  alternative: Im Haupttext deutend „Jerusalem“ schreiben
  rationale: Der hebräische Text nennt ausdrücklich אֲרִיאֵל. Die kontextuelle Identifikation mit Jerusalem wird erklärt, aber nicht an die Stelle des überlieferten Namens gesetzt.
- issue: Bezug von מְצֹדָתָהּ
  choice: Als „ihre Festung“ auf Ariel beziehen und das vorangehende Verb sinngemäß mitführen
  alternative: Die Wendung als Belagerungswerke gegen Ariel verstehen
  rationale: Der feminine Singularsuffix legt den Bezug auf Ariel nahe, doch Wortbedeutung und Satzbau lassen eine abweichende militärische Deutung zu. Diese echte Unsicherheit wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Vergleichsstruktur. Die militärische Wiederholung ist bewusst beibehalten; der Gedankenstrich macht die erläuternde Wiederaufnahme lesbar.
