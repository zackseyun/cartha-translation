source:
  edition: WLC
  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: de
  text: 'Dann gibt man das Schriftstück jemandem, der nicht lesen kann,[a] und sagt: »Lies das bitte!« Er aber sagt: »Ich kann nicht lesen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der keine Schrift kennt“; gemeint ist, dass er schriftunkundig ist.'
    reason: Die hebräische Wendung ידע ספר kann formal auf die Kenntnis von Schrift bezogen werden; die Fußnote bewahrt diese Ausdrucksweise, während der Haupttext ihre kontextuelle Bedeutung natürlich wiedergibt.
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: das Schriftstück
  rationale: Im Zusammenhang bezeichnet סֵפֶר das versiegelte Schriftstück bzw. Dokument aus Vers 11; „Schriftstück“ ist hier genauer als das modern oft enger verstandene „Buch“.
- source_word: לֹא יָדַע סֵפֶר
  choice: der nicht lesen kann / Ich kann nicht lesen
  rationale: Die Wendung bedeutet im Kontext, dass die betreffende Person schriftunkundig ist. Die idiomatische deutsche Wiedergabe „nicht lesen können“ passt zur unmittelbar folgenden Aufforderung, das Schriftstück zu lesen, und bewahrt die Wiederholung in beiden Aussagen.
- source_word: קְרָא נָא זֶה
  choice: Lies das bitte!
  rationale: נָא kennzeichnet eine höfliche bzw. eindringliche Bitte; die knappe direkte Rede des Hebräischen bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Dann gibt man“ setzt die parallele Szene aus Vers 11 natürlich fort; die direkte Rede bleibt knapp und anschaulich.
