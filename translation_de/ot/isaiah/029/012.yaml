  source_fidelity: Der Text gibt die hebräische Konstruktion וְנִתַּן הַסֵּפֶר ... לֹא יָדַע סֵפֶר sachgerecht wieder. „nicht lesen kann“ legt die idiomatische und im Kontext durch die Aufforderung קְרָא („Lies!“) eindeutig nahegelegte Bedeutung von „keine Schrift kennen“ natürlich aus. Die Wiederholung wird im Deutschen erhalten.
  naturalness: Flüssiges modernes Standarddeutsch. „Schriftstück“ passt zum in V. 11 erwähnten versiegelten Dokument; die knappen Reden sind idiomatisch. „Dann“ ist im fortlaufenden Szenenzusammenhang gut vertretbar.
  terminology: „Schriftstück“ und „lesen können“ sind kontextgerecht. Die Fußnote bewahrt die formale hebräische Ausdrucksweise „keine Schrift kennt“ und erläutert sie ohne überzogene Festlegung. Dies steht auch nicht im Widerspruch zur englischen Audit-Fassung „does not know writing“.
