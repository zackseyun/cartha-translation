  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: de
  text: Darum, siehe, ich werde an diesem Volk noch einmal Wunderbares tun – Wunder über Wunder.[a] Die Weisheit seiner Weisen wird vergehen, und der Verstand seiner Verständigen wird sich verbergen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde weiterhin wunderbar an diesem Volk handeln – wunderbar und wundersam.“'
    reason: יוֹסִף kann Fortsetzung statt Wiederholung ausdrücken; außerdem lässt sich die emphatische פלא-Wiederholung formnäher wiedergeben.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die Folgerung aus der vorausgehenden Anklage knapp und idiomatisch wieder.
- source_word: הִנְנִי
  choice: 'siehe: Ich'
  rationale: Bewahrt den feierlichen prophetischen Aufmerksamkeitsruf und verbindet ihn im Deutschen natürlich mit der folgenden Ich-Aussage.
- source_word: יוֹסִף לְהַפְלִיא
  choice: werde … noch einmal Wunderbares tun
  rationale: יוֹסִף mit Infinitiv kann erneutes oder fortgesetztes Handeln bezeichnen; „noch einmal“ gibt hier die erneute göttliche Handlung gut wieder, während die Alternative in der Fußnote erhalten bleibt. „Wunderbares tun“ wahrt die verbale Kraft von פלא, ohne die außergewöhnliche Handlung vorschnell positiv zu deuten.
- source_word: אֶת הָעָם הַזֶּה
  choice: an diesem Volk
  rationale: Im Zusammenhang mit פלא bezeichnet אֵת hier das Volk, an dem sich das außergewöhnliche Handeln vollzieht; die deutsche Präpositionalfügung ist natürlich und erhält den kollektiven Singular.
- source_word: הַפְלֵא וָפֶלֶא
  choice: Wunder über Wunder
  rationale: Die idiomatische Wendung bewahrt die emphatische Wiederholung des פלא-Wortstamms und die Steigerung der Aussage.
- source_word: וְאָבְדָה
  choice: wird vergehen
  rationale: Das Qal-Verb bezeichnet das Verschwinden beziehungsweise Zugrundegehen; die prophetische Perfektform wird entsprechend ihrem Zukunftsbezug wiedergegeben.
- source_word: חָכְמַת חֲכָמָיו
  choice: die Weisheit seiner Weisen
  rationale: Erhält das Wortspiel zwischen „Weisheit“ und „Weisen“ sowie den maskulinen Plural; das Suffix bezieht sich auf das kollektiv-singularische „Volk“.
- source_word: וּבִינַת נְבֹנָיו
  choice: der Verstand seiner Verständigen
  rationale: Bewahrt die Parallelität und die etymologische Nähe zwischen בִּינָה und נָבוֹן im Deutschen.
- source_word: תִּסְתַּתָּר
  choice: wird sich verbergen
  rationale: Gibt die reflexive beziehungsweise medio-passive Nuance der Verbform wieder und stimmt mit dem femininen Singularsubjekt בִּינָה überein.
theological_decisions:
- issue: Charakter des außergewöhnlichen göttlichen Handelns
  choice: Wunderbares tun – Wunder über Wunder
  alternative: erstaunlich handeln – erstaunlich und verwunderlich
  rationale: Die פלא-Wortgruppe beschreibt eine außergewöhnliche, Staunen auslösende Tat, die im Kontext Gericht bedeutet. Die Übersetzung erhält diese Spannung und legt „Wunder“ nicht auf eine ausschließlich heilsame Tat fest.
- issue: Bezeichnung der Weisen und Verständigen
  choice: seine Weisen / seine Verständigen
  alternative: die weisen beziehungsweise verständigen Menschen des Volkes
  rationale: Die substantivierten maskulinen Pluralformen werden formal bewahrt, ohne über den Text hinaus eine bestimmte Amtsgruppe oder ausschließlich männliche Gesamtheit zu behaupten.
translation_notes:
  register: Moderne, würdevolle Prophetensprache. „Siehe“ erhält bewusst den feierlichen Aufmerksamkeitsruf; Gedankenstrich und knappe Parallelstruktur machen die emphatische Wiederholung für heutige Leser gut erfassbar.
