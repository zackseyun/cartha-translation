base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: de
  text: Von Jahwe, dem Herrn der Heerscharen, wirst du heimgesucht[a] werden mit Donner, Erdbeben[b] und lautem Getöse[c], mit Wirbelsturm und Sturm und mit der Flamme eines verzehrenden Feuers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du zur Rechenschaft gezogen“ beziehungsweise „wirst du bestraft“. Das hebräische Verb bezeichnet ein Eingreifen oder Aufsuchen Gottes, das Segen oder Gericht bringen kann; hier zeigt der Zusammenhang Gericht an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erschütterung“ beziehungsweise „Beben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „großem Schall“; auch „gewaltigem Dröhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: Von
  rationale: Die Präposition bezeichnet hier bei dem passiven Verb Quelle beziehungsweise Urheber der Heimsuchung; „von“ ist im Deutschen knapp und idiomatisch.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ macht den festen göttlichen Titel in natürlichem, würdigem Deutsch verständlich, ohne die Heerscharen auf menschliche Armeen einzuengen.
- source_word: תִּפָּקֵד
  choice: wirst du heimgesucht werden
  rationale: Das Niphal von פקד bezeichnet ein göttliches Aufsuchen beziehungsweise Eingreifen. „Heimgesucht“ bewahrt die gerichtliche Färbung des Zusammenhangs, ohne die Bedeutung vollständig auf „bestraft“ zu verengen; die zweite Person Singular bleibt erhalten.
- source_word: בְּרַעַם
  choice: mit Donner
  rationale: Das Beth leitet die Begleitumstände beziehungsweise Mittel der göttlichen Heimsuchung ein.
- source_word: וּבְרַעַשׁ
  choice: Erdbeben
  rationale: רעש kann Beben, Erschütterung oder Erdbeben bedeuten; in der Reihe gewaltiger theophanischer Naturerscheinungen ist „Erdbeben“ eine konkrete und natürliche Wiedergabe.
- source_word: וְקוֹל גָּדוֹל
  choice: und gewaltigem Dröhnen
  rationale: קול ist hier ein nicht näher bestimmtes Geräusch, keine ausdrücklich sprechende Stimme. „Gewaltiges Dröhnen“ vermittelt die Stärke und passt zur Naturgewalt des Kontextes.
- source_word: סוּפָה וּסְעָרָה
  choice: mit Wirbelsturm und Unwetter
  rationale: Die zwei benachbarten Sturmbegriffe werden verschieden wiedergegeben, sodass die poetische Häufung erhalten bleibt.
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: und mit der Flamme eines verzehrenden Feuers
  rationale: Die Formulierung bewahrt sowohl das Bild der Flamme als auch das aktive, zerstörerische Feuer.
theological_decisions:
- issue: Bedeutung der göttlichen Heimsuchung in פקד
  choice: „wirst du heimgesucht werden“
  alternative: „wirst du bestraft werden“ oder neutraler „wirst du aufgesucht werden“
  rationale: Der Zusammenhang weist klar auf Gericht, doch פקד bezeichnet grundsätzlich ein göttliches Eingreifen, das je nach Kontext auch anders ausfallen kann. „Heimgesucht“ wahrt einen Teil dieser idiomatischen Breite und lässt zugleich die gerichtliche Kraft der Bilder erkennen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: „Jahwe“
  alternative: „der HERR“
  rationale: Die Wiedergabe als Eigenname unterscheidet das Tetragramm von dem unmittelbar damit verbundenen Titel und macht die namentliche Bezeichnung Gottes sichtbar.
- issue: Verständlichkeit des Titels צְבָאוֹת
  choice: „der Herr der Heerscharen“
  alternative: „der Heerscharen“ oder „der Armeen“
  rationale: Der ergänzte Titel „Herr“ entspricht idiomatischem deutschem Sprachgebrauch und vermeidet die missverständliche Form „Jahwe der Heerscharen“, ohne die Heerscharen ausschließlich als irdische Armeen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Wucht. Die wiederholte Präposition „mit“ gliedert die Folge der Naturgewalten, während die Häufung der Bilder des hebräischen Verses bewahrt bleibt. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
