  text: הִתְמַהְמְה֣וּ וּ/תְמָ֔הוּ הִשְׁתַּֽעַשְׁע֖וּ וָ/שֹׁ֑עוּ שָֽׁכְר֣וּ וְ/לֹא יַ֔יִן נָע֖וּ וְ/לֹ֥א שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
translation:
  language: de
  text: Zögert und staunt;[a] macht euch blind und seid blind.[b] Sie sind betrunken, doch nicht vom Wein; sie taumeln, doch nicht vom Rauschtrank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erstarrt fassungslos und staunt.“ Das erste Imperativpaar kann sowohl verwirrtes Innehalten als auch fassungsloses Erstarren ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Versetzt euch in Benommenheit und seid benommen.“ Die beiden hebräischen Verben sind selten und schwierig; sie können Blindheit, Verblendung oder Betäubung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  choice: Starrt fassungslos
  rationale: Der Hitpael-Imperativ bezeichnet hier im poetischen Parallelismus eher ein betroffenes Verharren in Verwirrung als bloß zeitliches Zögern. Die deutsche Wendung bewahrt sowohl das Innehalten als auch die Erstarrung.
- source_word: וּתְמָהוּ
  choice: und staunt
  rationale: Der Qal-Imperativ von תמהה drückt Staunen, Bestürzung oder Entsetzen aus. „Staunt“ bildet einen knappen, kräftigen Parallelismus zum ersten Imperativ.
- source_word: הִשְׁתַּעַשְׁעוּ
  choice: macht euch blind
  rationale: Die seltene Form wird in diesem Zusammenhang traditionell als reflexive Aufforderung zur Verblendung beziehungsweise Betäubung verstanden; der Parallelismus mit וָשֹׁעוּ stützt dieses Bedeutungsfeld statt der möglichen Bedeutung „sich ergötzen“.
- source_word: וָשֹׁעוּ
  choice: und seid blind
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich Blindheit, Verblendung oder Benommenheit. Die knappe Wiedergabe erhält den auffälligen Parallelismus und lässt die lexikalische Unsicherheit in einer Fußnote sichtbar werden.
- source_word: שָׁכְרוּ
  choice: Sie sind betrunken
  rationale: Der Qal-Perfekt Plural beschreibt nach den Imperativen anschaulich den eingetretenen Zustand. Das deutsche Präsens gibt diese prophetisch-unmittelbare Darstellung natürlich wieder.
- source_word: וְלֹא יַיִן
  choice: doch nicht vom Wein
  rationale: Die verneinte Nominalgruppe schließt Wein als Ursache aus und kennzeichnet damit die Trunkenheit als bildhaft, ohne das Bild auszudeuten.
- source_word: נָעוּ
  choice: sie taumeln
  rationale: נוע bezeichnet Schwanken oder Taumeln. „Taumeln“ passt natürlich zum Bild der Trunkenheit und bewahrt die poetische Bewegung.
- source_word: וְלֹא שֵׁכָר
  choice: doch nicht vom Rauschtrank
  rationale: שֵׁכָר bezeichnet ein berauschendes Getränk, das von Wein unterschieden wird. „Rauschtrank“ ist verständlich, würdig und erhält diese Unterscheidung besser als das zu enge „Bier“.
theological_decisions:
- issue: Art der Trunkenheits- und Blindheitsmetaphorik
  choice: Die bildhafte Trunkenheit und Blindheit werden ohne zusätzliche theologische Ausdeutung wiedergegeben.
  alternative: Wörtliche Trunkenheit oder eine ausdrückliche Deutung als geistliche beziehungsweise gerichtliche Verstockung im Haupttext.
  rationale: Der Vers schließt Wein und Rauschtrank als Ursachen ausdrücklich aus. Daher ist der Zustand bildhaft, doch seine genauere theologische Bedeutung soll aus dem Zusammenhang hervorgehen und nicht in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. „Starrt fassungslos“ vermeidet das missverständliche bloße „Zögert“, während die Fußnote die echte lexikalische Alternative wahrt. Die Wiederholung „macht euch blind und seid blind“ spiegelt bewusst die schroffe hebräische Form.
