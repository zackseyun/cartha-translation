    rationale: וַתְּהִי לָכֶם ist nicht lediglich eine gegenwärtige Zuordnung („ist für euch“), sondern beschreibt, dass die Vision für die Angeredeten zu etwas geworden ist. Diese Nuance sollte im Haupttext stehen und nicht nur als Fußnotenalternative erscheinen.
  - severity: low
    issue: „die ganze Vision“ ist weniger genau als „die Vision von all dem“
    rationale: חָזוּת הַכֹּל bezieht die Vision auf die Gesamtheit des zuvor Gemeinten. „Vision von all dem“ bewahrt diese Beziehung deutlicher.
  - severity: low
    issue: Fußnotenliteral zu יוֹדֵעַ הַסֵּפֶר ist zu eng formuliert
    rationale: „Der die Schriftrolle kennt“ kann im Deutschen nahelegen, die Person kenne gerade dieses Exemplar. Die Wendung hat hier die idiomatische Bedeutung eines Schrift- oder Lesekundigen; das Literal sollte entsprechend vorsichtig formuliert werden.
  revised_text: 'Und die Vision von all dem ist für euch wie die Worte einer versiegelten Schriftrolle geworden: Man gibt sie einem, der lesen kann,[a] und sagt: »Lies das bitte!« Da sagt er: »Ich kann nicht, denn sie ist versiegelt.«'
