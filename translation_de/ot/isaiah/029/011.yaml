base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: de
  text: 'Und die Vision von all dem ist für euch wie die Worte einer versiegelten Schriftrolle geworden: Man gibt sie einem, der lesen kann,[a] und sagt: »Lies das bitte!« Da sagt er: »Ich kann nicht, denn sie ist versiegelt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einem, der die Schrift kennt«; gemeint ist ein Schrift- oder Lesekundiger.'
    reason: Die Fußnote bewahrt die hebräische Ausdrucksweise von יוֹדֵעַ הַסֵּפֶר und erläutert ihren idiomatischen Sinn, ohne fälschlich auf die konkrete versiegelte Schriftrolle zu verengen.
lexical_decisions:
- source_word: חָזוּת הַכֹּל
  choice: die ganze Vision
  rationale: Die Verbindung bezeichnet die Gesamtheit der prophetischen Vision. „Die ganze Vision“ ist im Deutschen natürlich und bleibt eng am hebräischen Ausdruck, ohne erklärend zu erweitern.
- source_word: כְּדִבְרֵי הַסֵּפֶר
  choice: wie die Worte einer … Schriftrolle
  rationale: דִּבְרֵי wird als „Worte“ wiedergegeben; סֵפֶר bezeichnet im historischen Kontext eine Schriftrolle. Der unbestimmte Artikel entspricht der deutschen Darstellung der Vergleichsszene.
- source_word: הֶחָתוּם / חָתוּם
  choice: versiegelt
  rationale: Das passive Partizip von חתם bezeichnet etwas Versiegeltes. Die Wiederholung bewahrt die Bildsprache und den inneren Zusammenhang des Verses.
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: jemandem, der lesen kann
  rationale: Wörtlich etwa „einem, der die Schriftrolle/das Schriftstück kennt“; idiomatisch bezeichnet die Wendung hier einen Lesekundigen. „Der lesen kann“ gibt den situationsbezogenen Sinn klar und ohne unnötige Spezialisierung wieder.
- source_word: קְרָא נָא זֶה
  choice: Lies das bitte!
  rationale: Der Imperativ mit נָא trägt den höflichen beziehungsweise bittenden Ton. Die deutsche Wortstellung ist gegenwärtig und natürlich.
- source_word: לֹא אוּכַל
  choice: Ich kann nicht
  rationale: Die knappe Form bewahrt die Ellipse des Hebräischen; „es lesen“ wird nicht ergänzt, da der Zusammenhang die gemeinte Handlung bereits deutlich macht.
- source_word: וַתְּהִי לָכֶם
  choice: ist für euch
  rationale: Im Zusammenhang beschreibt die Form einen eingetretenen beziehungsweise bestehenden Zustand. Das deutsche Präsens gibt dessen aktuelle Geltung natürlich wieder; die Fußnote nennt die stärker resultative Alternative.
theological_decisions:
- issue: Bild der unzugänglichen Offenbarung
  choice: Das Bild der versiegelten Schriftrolle bleibt ohne ausdeutende Paraphrase erhalten.
  alternative: Die Vision ausdrücklich als unverständlich oder Gottes Wort als unzugänglich bezeichnen.
  rationale: Der Vers vermittelt seine theologische Aussage durch eine Vergleichsszene. Eine erklärende Auflösung würde mehr festlegen, als der Wortlaut selbst ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich natürlich; „Schriftrolle“ wahrt den historischen Sachbezug. Der Satzbau wird gegenüber der langen hebräischen Periode leicht gegliedert, ohne die Abfolge oder die wiederholte Versiegelungsmetapher zu verändern.
