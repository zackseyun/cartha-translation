source:
  edition: WLC
  text: ה֚וֹי אֲרִיאֵ֣ל אֲרִיאֵ֔ל קִרְיַ֖ת חָנָ֣ה דָוִ֑ד סְפ֥וּ שָׁנָ֛ה עַל שָׁנָ֖ה חַגִּ֥ים יִנְקֹֽפוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: de
  text: Ach, Ariel[a], Ariel, du Stadt, in der David sein Lager aufschlug! Fügt Jahr um Jahr hinzu; die Feste mögen ihren Kreislauf durchlaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ariel ist hier ein Name für Jerusalem; das hebräische Wort kann zugleich an „Altarherd“ oder „Löwe Gottes“ anklingen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ach
  rationale: Die Interjektion kann Klage, Drohung oder einen eindringlichen Zuruf einleiten. „Ach“ bewahrt hier den klagend-unheilvollen Ausruf, ohne ihn ausschließlich auf ein Verdammungswort wie „Wehe“ festzulegen.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Das Wort dient hier als Name Jerusalems, wie der folgende Hinweis auf Davids Stadt zeigt. Die Umschrift erhält zugleich das hebräische Wortspiel, dessen mögliche Bedeutungsanklänge in der Fußnote genannt werden.
- source_word: קִרְיַת חָנָה דָוִד
  choice: du Stadt, in der David sein Lager aufschlug
  rationale: Die Anrede mit „du Stadt“ ist im Deutschen natürlich und gibt חנה mit seinem Grundsinn des Lagerns wieder; zugleich bleibt der historische Bezug auf Davids Einnahme und Niederlassung in Jerusalem erkennbar.
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: Fügt Jahr zu Jahr
  rationale: Die knappe Formulierung bewahrt den pluralischen Imperativ und den Gedanken, dass ein weiteres Jahr an das vorige gereiht wird.
- source_word: חַגִּים
  choice: die Feste
  rationale: „Feste“ ist eine verständliche und kultisch passende Bezeichnung für die wiederkehrenden Festzeiten Israels.
- source_word: יִנְקֹפוּ
  choice: mögen ihren Kreislauf vollenden
  rationale: Das Verb bezeichnet ein Umkreisen oder Durchlaufen eines Zyklus. Die Formulierung gibt die wiederkehrende Runde der Feste wieder und lässt den auffordernden beziehungsweise ankündigenden Ton der hebräischen Verbform offen.
theological_decisions:
- issue: Semantische Übersetzung oder Beibehaltung von אֲרִיאֵל als Name
  choice: „Ariel“ bleibt im Haupttext als Name Jerusalems stehen; mögliche Bedeutungsanklänge werden in einer Fußnote bewahrt.
  alternative: Übersetzung als „Altarherd“ oder „Löwe Gottes“.
  rationale: Die Apposition bezeichnet Ariel als die mit David verbundene Stadt, und die Wiederholung wirkt als eindringliche Namensanrede. Eine Festlegung auf nur eine Wortbedeutung würde das prophetische Wortspiel und seine Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die knappe Zeitformel bewahren den prophetischen Nachdruck; ungewöhnliche hebräische Bedeutungsanklänge werden nicht in den Haupttext gezwungen, sondern transparent in der Fußnote erhalten.
