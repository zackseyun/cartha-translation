    issue: Idiomatizität von „Fügt Jahr zu Jahr“
    rationale: Die Formulierung ist im Deutschen ungewöhnlich knapp. „Fügt Jahr um Jahr hinzu“ gibt die iterative Wendung שָׁנָה עַל־שָׁנָה klar und natürlich wieder.
  - severity: low
    issue: „ihren Kreislauf vollenden“ kann zu final klingen
    rationale: יִנְקֹפוּ bezeichnet im Kontext das Kreisen bzw. den Ablauf wiederkehrender Feste. „Ihren Kreislauf durchlaufen“ wahrt den Zyklusgedanken, ohne einen einmaligen Endpunkt nahezulegen.
  revised_text: Ach, Ariel[a], Ariel, du Stadt, in der David sein Lager aufschlug! Fügt Jahr um Jahr hinzu; die Feste mögen ihren Kreislauf durchlaufen.
