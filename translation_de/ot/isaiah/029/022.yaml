reference: Isaiah 29:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: de
  text: 'Darum spricht Jahwe, der Abraham erlöst hat,[a] zum Haus Jakobs: Nun wird Jakob sich nicht mehr schämen,[b] und sein Gesicht wird nicht mehr erbleichen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „der Abraham erlöst hat“ nach „Haus Jakobs“; der Relativsatz wird gewöhnlich auf Jahwe bezogen.
    reason: syntactic_ambiguity
  - marker: b
    text: 'Oder: „nicht mehr zuschanden werden“.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich bezeichnet das hebräische Verb ein Weiß- oder Blasswerden, hier als Bild für Scham oder Bestürzung.
    reason: lexical_clarification
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אֶל בֵּית יַעֲקֹב
  choice: zum Haus Jakobs
  rationale: Erhält den gemeinschaftlichen und bundesgeschichtlichen Sinn von „Haus“, statt den Ausdruck auf einzelne Nachkommen zu verengen.
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: der Abraham erlöst hat
  rationale: פדה bezeichnet Loskauf oder Befreiung; „erlöst“ wahrt diese Bedeutungsbreite und den heilsgeschichtlichen Klang. Die Relativkonstruktion wird natürlich auf Jahwe bezogen.
- source_word: לֹא עַתָּה
  choice: nun ... nicht mehr
  rationale: Die zweimalige Wendung bezeichnet hier die einsetzende Aufhebung des bisherigen Zustands. Die erste Wiedergabe mit „nun“ trägt im Deutschen zugleich über den parallel gebauten zweiten Satzteil.
- source_word: יֵבוֹשׁ
  choice: sich ... schämen
  rationale: Gibt die gewöhnliche Bedeutung des Verbs idiomatisch wieder, ohne eine äußere Verursachung der Schande festzulegen.
- source_word: פָּנָיו יֶחֱוָרוּ
  choice: sein Gesicht wird ... erbleichen
  rationale: Bewahrt das körperliche Bild des Blasswerdens als Ausdruck von Scham, Schrecken oder Bestürzung.
theological_decisions:
- issue: Bezug des Relativsatzes „der Abraham erlöst hat“
  choice: Der Relativsatz beschreibt Jahwe.
  alternative: Aufgrund seiner Stellung könnte er formal zunächst an „Haus Jakobs“ angeschlossen wirken.
  rationale: Inhaltlich ist Jahwe das natürliche Subjekt der Erlösung Abrahams. Die deutsche Wortstellung macht diesen wahrscheinlichsten Bezug deutlich; die hebräische Stellung wird in einer Fußnote transparent gemacht.
- issue: Kollektive Bedeutung von „Jakob“
  choice: Der Eigenname „Jakob“ bleibt stehen und bezeichnet im Zusammenhang das Volk als Ganzes.
  alternative: Explizite Wiedergabe als „Israel“ oder „Jakobs Nachkommen“.
  rationale: Die Wiederholung des patriarchalischen Namens gehört zur Bild- und Ausdrucksweise des hebräischen Textes und sollte nicht erklärend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „so spricht“ bleibt erhalten; ansonsten ist der Satzbau für heutige Leser geglättet. „Jahwe“ gibt den Gottesnamen als Eigennamen wieder.
