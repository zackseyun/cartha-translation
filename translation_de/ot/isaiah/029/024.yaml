revisions:
- from: Und die, deren Geist irregeht, werden Einsicht gewinnen,[a] und die Murrenden werden Unterweisung lernen.[b]
  to: Und die, deren Geist in die Irre geht, werden Einsicht gewinnen,[a] und die Murrenden werden Unterweisung lernen.[b]
  rationale: Die Revision beschränkt sich auf eine idiomatischere Wiedergabe des Bildes in תֹעֵי רוּחַ sowie auf die Präzisierung der dazugehörigen Fußnote. Der parallele Satzbau, die Zukunftsbedeutung und die offene, nicht pneumatologisch festgelegte Bedeutung von רוּחַ bleiben erhalten.
