  text: וְ/יָדְע֥וּ תֹֽעֵי ר֖וּחַ בִּינָ֑ה וְ/רוֹגְנִ֖ים יִלְמְדוּ לֶֽקַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: de
  text: Und die, deren Geist in die Irre geht, werden Einsicht gewinnen,[a] und die Murrenden werden Unterweisung lernen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werden Einsicht kennen/erkennen“; auch: „werden Verständnis erlangen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden Lehre annehmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: werden … gewinnen
  rationale: יָדַע bedeutet wörtlich „kennen/erkennen“. Zusammen mit בִּינָה bezeichnet es hier das Erlangen von Einsicht; „Einsicht gewinnen“ gibt diesen resultativen Sinn in natürlichem Deutsch wieder.
- source_word: תֹעֵי רוּחַ
  choice: die, deren Geist irregeht
  rationale: תֹעֵי bezeichnet Irrende oder Umherirrende. רוּחַ ist hier am ehesten anthropologisch als innere Haltung oder Denkvermögen zu verstehen. Die Formulierung bewahrt das Bild des Irrgehens, ohne einen ausdrücklichen Bezug auf den Heiligen Geist einzutragen.
- source_word: בִּינָה
  choice: Einsicht
  rationale: בִּינָה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ verbindet sich idiomatisch mit „gewinnen“ und passt zum Kontext geistiger Erneuerung.
- source_word: וְרוֹגְנִים
  choice: die Murrenden
  rationale: Das Partizip von רגן bezeichnet Menschen, die murren, nörgeln oder sich beklagen. „Die Murrenden“ ist knapp, verständlich und wahrt die widerstrebende Haltung.
- source_word: יִלְמְדוּ
  choice: werden … lernen
  rationale: Die einfache Zukunftsform von למד wird direkt mit „werden lernen“ wiedergegeben.
- source_word: לֶקַח
  choice: Unterweisung
  rationale: לֶקַח kann Lehre, Unterweisung oder das Empfangene einer Lehre bezeichnen. „Unterweisung“ wahrt den Weisheitskontext und die aktive Lernbewegung.
theological_decisions:
- issue: Bedeutung von רוּחַ in תֹעֵי רוּחַ
  choice: menschlicher Geist beziehungsweise innere Haltung
  alternative: der Geist im Sinne des Heiligen Geistes oder „Wind“
  rationale: Der Zusammenhang handelt von der Wiederherstellung zuvor irriger und widerstrebender Menschen. Die anthropologische Lesart liegt nahe, doch die Übersetzung lässt den Ausdruck „Geist“ stehen und vermeidet eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die substantivierten Personenbezeichnungen bilden den hebräischen Parallelismus ab. „Unterweisung lernen“ ist bewusst etwas gehoben, bleibt aber verständlich und hält sich eng an יִלְמְדוּ לֶקַח.
