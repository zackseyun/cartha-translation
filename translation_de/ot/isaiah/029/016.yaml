  rationale: Die Revision ersetzt die im heutigen Deutsch ungebräuchliche und potenziell missverständliche Gleichachtungsformulierung durch die präzise Wendung „wie Ton angesehen werden“. Außerdem wird der Schlussvorwurf auf „hat keine Einsicht“ abgestimmt, das die hebräische Aussage über mangelndes Verständnis beziehungsweise Urteilsvermögen genauer wiedergibt. Der umstrittene Eingangsausdruck bleibt im Text idiomatisch und in der Fußnote transparent gemacht.
