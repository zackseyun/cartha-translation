source:
  edition: WLC
  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: de
  text: 'Wie ihr alles auf den Kopf stellt![a] Soll denn der Töpfer wie Ton angesehen werden, sodass das Werk von dem, der es gemacht hat, sagt: »Er hat mich nicht gemacht«, und das Gebilde von dem, der es geformt hat: »Er hat keine Einsicht«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Eure Umkehrung!“; andere verstehen: „Was für eine Verkehrtheit bei euch!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: Wie ihr alles auf den Kopf stellt!
  rationale: Das substantivische, mit einem Suffix der 2. Person Plural versehene Wort ist hier elliptisch und ausrufend gebraucht. Die verbale deutsche Wendung gibt den scharfen Vorwurf einer Verkehrung der Wirklichkeit natürlich wieder.
- source_word: אִם
  choice: Soll denn …?
  rationale: אִם leitet hier keine gewöhnliche Bedingung, sondern eine rhetorische Frage ein. „Soll denn“ bringt deren empörte, argumentierende Kraft zum Ausdruck.
- source_word: כְּחֹמֶר
  choice: dem Ton
  rationale: חֹמֶר bezeichnet den formbaren Ton des Töpfers. Im Deutschen verlangt „gleichachten“ den Dativ; die Vergleichsbedeutung von כְּ bleibt dabei erhalten.
- source_word: הַיֹּצֵר
  choice: der Töpfer
  rationale: In unmittelbarer Verbindung mit Ton bezeichnet das Partizip von יצר konkret den Töpfer und bewahrt so das anschauliche Bild.
- source_word: יֵחָשֵׁב
  choice: gleichgeachtet werden
  rationale: Der Nifal von חשׁב bedeutet hier „als etwas gelten/angesehen werden“. „Dem Ton gleichgeachtet“ verdeutlicht die absurde Gleichsetzung, ohne die Metapher aufzulösen.
- source_word: מַעֲשֶׂה
  choice: das Werk
  rationale: Das Wort bezeichnet hier das hervorgebrachte Werk im Gegensatz zu seinem Urheber. „Werk“ ist knapp, verständlich und fügt sich in den parallelen Satzbau.
- source_word: לְעֹשֵׂהוּ
  choice: von dem, der es gemacht hat
  rationale: Das ל nach אמר kann die Person bezeichnen, zu der oder über die gesprochen wird. Der Kontext verlangt eine Aussage über den Urheber; die Umschreibung ist im Deutschen eindeutig und natürlich.
- source_word: לֹא עָשָׂנִי
  choice: Er hat mich nicht gemacht
  rationale: Der hebräische Perfekt wird als abgeschlossene Handlung wiedergegeben. Die Formulierung bewahrt die direkte Leugnung des Urhebers.
- source_word: יֵצֶר
  choice: das Gebilde
  rationale: Das Substantiv bezeichnet das geformte Erzeugnis. „Gebilde“ hält die Parallelität zu „Werk“ aufrecht und lässt zugleich den Bezug zum Formen erkennen.
- source_word: לְיוֹצְרוֹ
  choice: von dem, der es geformt hat
  rationale: Die Umschreibung bewahrt den Wortstamm יצר und den Parallelismus zur vorherigen Aussage, ohne im Deutschen schwerfällig „seinem Former“ zu sagen.
- source_word: לֹא הֵבִין
  choice: Er versteht nichts
  rationale: Der Hifil von בין bezeichnet Verstehen oder Einsicht. Die natürliche deutsche Wendung gibt die umfassende, anmaßende Abwertung durch das Gebilde wieder.
theological_decisions:
- issue: Bild von Töpfer und Ton
  choice: Das konkrete Bild bleibt mit „Töpfer“ und „Ton“ ausdrücklich erhalten.
  alternative: Abstrakte Wiedergabe als „Schöpfer“ und „Geschöpf“.
  rationale: Die Aussagekraft des Verses liegt in der absurden Umkehrung des Verhältnisses zwischen dem gestaltenden Töpfer und dem gestalteten Ton. Das Bild wird bewahrt, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Deutung des Eingangsausrufs
  choice: 'Der Eingang wird als tadelnder Ausruf wiedergegeben: „Wie ihr alles auf den Kopf stellt!“'
  alternative: „Was für eine Verkehrtheit bei euch!“ oder wörtlicher „Eure Umkehrung!“
  rationale: Die hebräische Formulierung ist knapp und mehrdeutig. Die gewählte Fassung gibt ihren klaren Kontextssinn wieder, während die Fußnote die formale und lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf ist idiomatisch und eindringlich; die anschließende rhetorische Frage bewahrt das prophetische Töpfer-Ton-Bild sowie den parallelen Aufbau von „Werk“ und „Gebilde“.
