id: ISA.29.18
reference: Isaiah 29:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁמְע֧וּ בַ/יּוֹם הַ/ה֛וּא הַ/חֵרְשִׁ֖ים דִּבְרֵי סֵ֑פֶר וּ/מֵ/אֹ֣פֶל וּ/מֵ/חֹ֔שֶׁךְ עֵינֵ֥י עִוְרִ֖ים תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: de
  text: Und an jenem Tag werden die Tauben die Worte eines Buches[a] hören, und aus Dunkel und Finsternis werden die Augen der Blinden sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Worte einer Schriftrolle“ oder „die Worte eines Schriftstücks“; das hebräische Wort sefer kann allgemein einen geschriebenen Text bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: Und … werden … hören
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang futurische Bedeutung. Das deutsche Futur gibt die Verheißung natürlich wieder.
- source_word: בַיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die feste prophetische Zeitangabe wird im modernen Deutschen idiomatisch und zugleich feierlich wiedergegeben.
- source_word: הַחֵרְשִׁים
  choice: die Tauben
  rationale: Das substantivierte Adjektiv bezeichnet gehörlose Menschen. „Die Tauben“ bewahrt die knappe, konkrete Ausdrucksweise des Hebräischen.
- source_word: דִּבְרֵי סֵפֶר
  choice: die Worte eines Buches
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Worte eines Buches/einer Schriftrolle/eines Schriftstücks“. „Buch“ ist im Deutschen die breiteste natürliche Wiedergabe; eine Fußnote hält die lexikalischen Alternativen offen.
- source_word: וּמֵאֹפֶל
  choice: und aus Dunkel
  rationale: מִן bezeichnet hier Herkunft beziehungsweise Hervortreten. Das seltenere Substantiv „Dunkel“ hält den Ausdruck von der folgenden „Finsternis“ unterscheidbar und bewahrt den poetischen Parallelismus.
- source_word: וּמֵחֹשֶׁךְ
  choice: und Finsternis
  rationale: Zusammen mit der vorangehenden Präpositionalkonstruktion ergibt sich „aus Dunkel und Finsternis“. „Finsternis“ wahrt die Verstärkung durch das zweite hebräische Dunkelheitswort.
- source_word: עֵינֵי עִוְרִים
  choice: die Augen der Blinden
  rationale: Die hebräische Genitivverbindung und ihr konkretes Bild werden transparent bewahrt.
- source_word: תִּרְאֶינָה
  choice: werden … sehen
  rationale: Das Qal-Imperfekt in der 3. Person Feminin Plural stimmt mit „Augen“ überein und bezeichnet wiederhergestelltes Sehen.
theological_decisions:
- issue: Ob der Vers ausschließlich körperliche Heilung oder zugleich geistliche Wiederherstellung beschreibt
  choice: Die konkreten Sinnesbegriffe „Taube“, „Blinde“, „hören“ und „sehen“ bleiben ohne deutende Zusätze stehen.
  alternative: Die Aussagen ausdrücklich als geistliches Verstehen und Erkennen wiederzugeben.
  rationale: Der hebräische Wortlaut ist konkret, kann im Zusammenhang des Jesajabuchs jedoch auch bildhafte Tragweite besitzen. Die Übersetzung legt sich nicht unnötig auf nur eine Ebene fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend erhaltener hebräischer Satzgestalt und poetischem Parallelismus. „Dunkel und Finsternis“ bewahrt die zwei unterschiedlichen hebräischen Begriffe, ohne sie erklärend aufzulösen.
