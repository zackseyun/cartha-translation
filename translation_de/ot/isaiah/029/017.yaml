base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: de
  text: Dauert es nicht nur noch eine ganz kurze Zeit, bis sich der Libanon in fruchtbares Land[a] verwandelt und das fruchtbare Land als Wald gelten wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kulturland“. Das hebräische Wort כַּרְמֶל bezeichnet fruchtbares, kultiviertes Land; hier ist nicht der Berg Karmel gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Ist es nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, statt sie in eine bloße Bekräftigung umzuwandeln.
- source_word: עוֹד מְעַט מִזְעָר
  choice: nur noch eine ganz kurze Zeit
  rationale: „Noch“ gibt den zeitlichen Aufschub wieder; „nur“ und „ganz kurze“ vermitteln die verstärkte Kürze der hebräischen Wortgruppe natürlich im Deutschen.
- source_word: וְשָׁב
  choice: sich … verwandelt
  rationale: שׁוב bezeichnet hier idiomatisch einen Zustandswechsel. „Sich verwandeln“ ist im Deutschen klarer als „zurückkehren“, das fälschlich eine frühere Beschaffenheit voraussetzen könnte.
- source_word: לְבָנוֹן
  choice: der Libanon
  rationale: Der geografische Eigenname bleibt erhalten; im Zusammenhang kann er zugleich die sprichwörtlich bewaldete Region aufrufen.
- source_word: כַּרְמֶל
  choice: fruchtbares Land
  rationale: כַּרְמֶל ist hier kein Eigenname, sondern bezeichnet ertragreiches, kultiviertes Land. „Fruchtbares Land“ ist verständlich und vermeidet die zu enge Festlegung auf einen Obstgarten.
- source_word: לַיַּעַר
  choice: als Wald
  rationale: יַעַר bezeichnet Wald beziehungsweise Waldland; mit יֵחָשֵׁב drückt die Präposition eine Einordnung aus.
- source_word: יֵחָשֵׁב
  choice: gelten wird
  rationale: 'Gibt den passiven beziehungsweise wertenden Sinn des Nifal von חשׁב knapp und idiomatisch wieder: Das Land wird als Wald angesehen oder eingestuft.'
theological_decisions:
- issue: Art der angekündigten Verwandlung
  choice: Die bildhafte Ankündigung einer einschneidenden Umkehr wird wiedergegeben, ohne festzulegen, ob sie wörtlich, metaphorisch oder auf beiden Ebenen zu verstehen ist.
  alternative: Die Aussage ausschließlich als landwirtschaftliche Veränderung oder ausschließlich als gesellschaftlich-geistliche Umkehr deuten.
  rationale: Der hebräische Text zeichnet deutlich ein Bild von Umkehr und Erneuerung, bestimmt in diesem Vers aber nicht abschließend dessen Bezugsebene.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion mit „bis“ verbindet die hebräische Satzfolge natürlich, während die rhetorische Frage und die betonte Kürze der Zeit erhalten bleiben. Die Wiederholung von „fruchtbares Land“ bildet die Wiederholung desselben hebräischen Substantivs ab.
