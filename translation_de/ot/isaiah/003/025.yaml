base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: de
  text: Deine Männer werden durch das Schwert fallen und deine Krieger[a] im Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Stärke« beziehungsweise »deine Macht«; das hebräische Wort kann hier auch die starken Männer, also die Krieger, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתַיִךְ
  choice: deine Männer
  rationale: Das poetische מְתַיִם bezeichnet hier Männer bzw. männliche Angehörige der angesprochenen Stadt, nicht bereits Tote. »Deine Männer« ist im Deutschen klar und wahrt den Parallelismus.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die Präposition bezeichnet hier das Mittel, durch das sie umkommen. »Durch das Schwert« gibt die kriegerische Todesart würdig und verständlich wieder.
- source_word: יִפֹּלוּ
  choice: werden … fallen
  rationale: Das Qal-Imperfekt kündigt im prophetischen Zusammenhang ein künftiges Geschehen an. »Fallen« bewahrt zugleich das biblisch-poetische Bild für den Tod im Krieg.
- source_word: וּגְבוּרָתֵךְ
  choice: und deine Krieger
  rationale: גְּבוּרָה bedeutet gewöhnlich »Stärke/Macht«, kann hier aber parallel zu »deine Männer« metonymisch die starken, kampffähigen Männer bezeichnen. »Krieger« passt natürlich zum folgenden »im Kampf«; die wörtlichere Deutung wird in der Fußnote erhalten.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: מִלְחָמָה kann »Krieg« oder »Kampf/Schlacht« bedeuten. »Im Kampf« bildet einen natürlichen Parallelismus zu »durch das Schwert fallen«.
theological_decisions:
- issue: Bezug der femininen Suffixe der zweiten Person Singular
  choice: Die feminine Singularanrede wird schlicht mit »deine« wiedergegeben und bezieht sich im Kontext auf das personifizierte Zion/Jerusalem.
  alternative: Die Töchter Zions könnten kollektiv angesprochen sein.
  rationale: Der unmittelbare Zusammenhang legt die personifizierte Stadt nahe. Die Übersetzung fügt jedoch keinen erklärenden Namen in den Vers ein und lässt den kontextuellen Bezug bestehen.
- issue: Personale oder abstrakte Bedeutung von וּגְבוּרָתֵךְ
  choice: Personale, metonymische Wiedergabe als »deine Krieger«.
  alternative: 'Abstrakt und wörtlicher: »deine Stärke« oder »deine Macht«.'
  rationale: Der Parallelismus mit »deine Männer« und die Angabe »im Kampf« sprechen für eine Bezeichnung der kampfstarken Männer. Da die abstrakte Lesart sprachlich möglich bleibt, wird sie nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. Die im Hebräischen ausgelassene Wiederholung von »werden fallen« bleibt auch im zweiten Satzglied unausgesprochen. Die feminine Anrede ist im Possessivpronomen erkennbar, ohne den Bezug im Vers interpretierend auszuschreiben.
