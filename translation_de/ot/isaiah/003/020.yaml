  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
translation:
  language: de
  text: die Kopfbedeckungen, die Fußkettchen, die Schärpen, die Duftbehälter[a] und die Amulette[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Häuser der Seele/des Lebens«; wahrscheinlich kleine Behälter für Parfüm oder andere Duftstoffe.
    reason: lexical_alternative
  - marker: b
    text: Oder »Zaubermittel«; das hebräische Wort hängt mit Flüstern oder Beschwörung zusammen und kann Gegenstände bezeichnen, die mit Zaubersprüchen verbunden waren.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: die Kopfbedeckungen
  rationale: Das Wort bezeichnet hier wahrscheinlich schmückende Kopfbedeckungen. Die deutsche Wiedergabe ist verständlich, ohne sich unnötig auf »Turbane« festzulegen.
- source_word: הַצְּעָדוֹת
  choice: die Fußkettchen
  rationale: Die Bildung hängt mit dem Schreiten zusammen und bezeichnet wahrscheinlich Schmuck an Fuß oder Knöchel. »Fußkettchen« ist im heutigen Deutsch natürlich und konkret.
- source_word: הַקִּשֻּׁרִים
  choice: die Schärpen
  rationale: Das vom Binden abgeleitete Wort meint wohl schmückende Bänder beziehungsweise gebundene Kleidungsstücke. »Schärpen« passt zum Kontext und vermeidet das unbestimmte »Bänder«.
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: die Duftbehälter
  rationale: Wörtlich steht hier »Häuser der Seele/des Lebens«. Im Zusammenhang der Schmuckstücke sind wahrscheinlich kleine Behälter für Duftstoffe gemeint. »Duftbehälter« lässt deren genaue Form offen.
- source_word: הַלְּחָשִׁים
  choice: die Amulette
  rationale: Das Wort hängt mit Flüstern beziehungsweise Beschwörung zusammen, bezeichnet in dieser Liste aber wahrscheinlich konkrete, getragene Gegenstände. »Amulette« bewahrt den magischen Beiklang.
theological_decisions:
- issue: Möglicher magisch-okkultischer Beiklang von הַלְּחָשִׁים
  choice: Im Haupttext »Amulette«
  alternative: Zaubermittel; Beschwörungen
  rationale: Da der Vers konkrete Schmuck- und Luxusgegenstände aufzählt, ist eine gegenständliche Wiedergabe vorzuziehen. Die Fußnote bewahrt zugleich die Verbindung des hebräischen Wortes mit Flüstern und Beschwörung, ohne die Mehrdeutigkeit vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bleibt knapp und nominal wie im Hebräischen. Seltene Gegenstände werden verständlich wiedergegeben; echte lexikalische Unsicherheiten stehen in Fußnoten.
