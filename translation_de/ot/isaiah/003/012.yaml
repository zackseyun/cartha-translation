  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: de
  text: Mein Volk – seine Bedränger sind Kinder, und Frauen herrschen über es. Mein Volk, deine Führer führen dich in die Irre[a] und verschlingen den Weg deiner Pfade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dich glücklich preisen“ beziehungsweise „die dich selig nennen“. Die hebräische Form kann diese Bedeutung haben; im Zusammenhang sind wahrscheinlich Führer oder Lenker gemeint, die das Volk irreführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Den Weg deiner Pfade haben sie verschlungen“ – ein eindringliches Bild dafür, dass sie dem Volk seinen rechten Weg nehmen.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: seine Bedränger
  rationale: נגשׂ bezeichnet Menschen, die andere bedrängen, antreiben oder unterdrücken. „Bedränger“ passt zur gesellschaftlich-politischen Anklage und bewahrt das maskuline Singularsuffix, das sich auf das kollektiv-singularische „Volk“ bezieht.
- source_word: מְעוֹלֵל
  choice: sind Kinder
  rationale: Form und Satzbau sind schwierig; im Zusammenhang bezeichnet der Ausdruck am ehesten die Bedränger als Kinder beziehungsweise unreife Herrscher. „Kinder“ erhält das konkrete Bild.
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: und Frauen herrschen über es
  rationale: 'Die Wiedergabe folgt dem masoretischen Text unmittelbar: נָשִׁים bedeutet „Frauen“, משל mit ב „über jemanden herrschen“. Das Pronomen „es“ nimmt „Volk“ grammatisch und als kollektiven Singular wieder auf.'
- source_word: מְאַשְּׁרֶיךָ
  choice: deine Führer
  rationale: Im Parallelismus mit מַתְעִים liegt die kontextuelle Bedeutung „Führer/Lenker“ nahe. Die echte lexikalische Möglichkeit „die dich glücklich preisen“ wird in Fußnote [a] bewahrt.
- source_word: מַתְעִים
  choice: führen dich in die Irre
  rationale: Die Kausativbedeutung von תעה ist „irreführen, zum Umherirren bringen“. Die deutsche Formulierung ist natürlich und erhält zugleich das Wegmotiv.
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: den Weg deiner Pfade
  rationale: Die bewusst verdichtete Verbindung beider Wegbegriffe wird formal bewahrt, statt sie auf das bloße „deine Pfade“ zu verkürzen.
- source_word: בִּלֵּעוּ
  choice: verschlingen
  rationale: בלע bedeutet wörtlich „verschlingen“. Die konkrete Metapher bleibt erhalten und wird nicht stillschweigend als „verwirren“ oder „zerstören“ aufgelöst.
theological_decisions:
- issue: Möglicherweise abwertend wirkende Aussage über die Herrschaft von Frauen
  choice: Die ausdrückliche Lesart „Frauen herrschen über es“ wird als Teil von Jesajas Gerichtsrhetorik beibehalten.
  alternative: Verallgemeinerung zu „Schwache herrschen über es“ oder textkritische Umdeutung zu „Gläubiger herrschen über es“.
  rationale: Der masoretische Text lautet ausdrücklich „Frauen“. Eine Neutralisierung wäre keine Übersetzung des vorliegenden Textes; zugleich wird daraus keine allgemeine Lehraussage über Frauen gemacht.
- issue: Deutung von מְאַשְּׁרֶיךָ
  choice: Im Haupttext „deine Führer“, mit Hinweis auf die lexikalische Alternative in Fußnote [a].
  alternative: „Die dich glücklich preisen“ oder „die dich selig nennen“.
  rationale: Das anschließende „führen dich in die Irre“ stützt im Kontext die Bedeutung „Führer“. Da die alternative Ableitung sprachlich echt ist, darf sie nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Mein Volk“ und die kollektiv-singularische Bezugnahme werden bewahrt. „Über es“ ist bewusst gewählt, um den grammatischen Bezug auf „das Volk“ klarer und natürlicher wiederzugeben als „über ihn“, auch wenn die Form leicht markiert klingt. Die Weg- und Verschlingungsmetaphorik bleibt sichtbar.
