  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die beiden unterschiedlichen hebräischen Gewaltverben treffend wieder (דכא: »zermalmen«; טחן: »zermahlen«), ebenso »mein Volk«, »die Gesichter der Armen« und die soziale Stoßrichtung. Die elliptische Vorwurfsfrage מָה־לָכֶם wird grundsätzlich angemessen erfasst. Der Gottesname יהוה sollte als »Jahwe« erscheinen; die Titelverbindung verlangt im Deutschen jedoch eine klarere appositionale Konstruktion.'
  naturalness: »Was fällt euch ein, dass ihr …?« ist im modernen Standarddeutsch deutlich weniger idiomatisch als die Infinitivkonstruktion »Was fällt euch ein, … zu …?«. Die Setzung »des Herrn Jahwe der Heerscharen« ist ohne Komma bzw. Genitivangleichung syntaktisch schwer lesbar.
  terminology: »Herr« für אַדֹנָי, »Jahwe« für יהוה und »Heerscharen« für צבאות sind angemessen. »Spruch« ist für נְאֻם eine knappe, würdige und etablierte Wiedergabe. »Armen« ist im gegebenen Sozialkontext passend.
  issues:
