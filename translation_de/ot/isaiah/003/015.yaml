  text: מ/ל/כם תְּדַכְּא֣וּ עַמִּ֔/י וּ/פְנֵ֥י עֲנִיִּ֖ים תִּטְחָ֑נוּ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: de
  text: Was fällt euch ein[a], mein Volk zu zermalmen und die Gesichter der Armen zu zermahlen[b]? – Spruch des Herrn, Jahwes der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Was ist euch, dass …?« Die hebräische Wendung ist ein entrüsteter Vorwurf.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »das Gesicht der Armen zermahlen«. Das Hebräische zeichnet ein drastisches Bild für rücksichtslose Unterdrückung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מ/ל/כם
  choice: Was fällt euch ein
  rationale: Die elliptische Wendung מָה־לָכֶם formuliert einen scharfen Vorwurf. »Was fällt euch ein« gibt diese konfrontative Kraft in natürlichem modernem Deutsch wieder.
- source_word: תְּדַכְּאוּ
  choice: zermalmt
  rationale: Das Piel von דכא bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. Die konkrete Bildsprache bleibt dadurch erhalten.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die Possessivverbindung wird direkt wiedergegeben und bewahrt, dass Gott sich mit den Misshandelten identifiziert.
- source_word: וּפְנֵי עֲנִיִּים
  choice: und die Gesichter der Armen
  rationale: Die formal pluralische Wendung wird bildhaft und quellennah wiedergegeben. עֲנִיִּים bezeichnet hier im Zusammenhang gesellschaftlicher Ausbeutung die Armen.
- source_word: תִּטְחָנוּ
  choice: zermahlt
  rationale: טחן bedeutet wörtlich »mahlen«. »Zermahlen« erhält das drastische Bild rücksichtsloser Unterdrückung und unterscheidet das Verb vom vorhergehenden דכא.
- source_word: נְאֻם
  choice: Spruch
  rationale: »Spruch« gibt die feste prophetische Formel knapp und autoritativ wieder.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: des Herrn Jahwe der Heerscharen
  rationale: אֲדֹנָי wird als Titel »Herr«, der Gottesname יהוה als »Jahwe« und צְבָאוֹת mit dem umfassenden, traditionellen »Heerscharen« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR; Herr, HERR
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet zugleich die missverständliche Doppelung »Herr HERR«.
- issue: Bezeichnung der Betroffenen durch עֲנִיִּים
  choice: die Armen
  alternative: die Elenden; die Bedrängten
  rationale: Der Kontext handelt von sozialer Ausbeutung. »Arme« benennt diese Dimension klar, ohne auszuschließen, dass die Betroffenen zugleich bedrängt und erniedrigt sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die scharfe Anklage und die beiden konkreten Gewaltbilder des Hebräischen bleiben erhalten; die ungewöhnliche Metapher wird nicht zu dem abstrakten Begriff »unterdrücken« geglättet.
