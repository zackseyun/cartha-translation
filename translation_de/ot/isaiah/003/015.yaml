    issue: Unidiomatische Satzkonstruktion nach »Was fällt euch ein«
    rationale: Die Verbindung mit »dass ihr« wirkt im Deutschen holprig. Die Infinitivkonstruktion wahrt die vorwurfsvolle Frage und ist natürliches modernes Standarddeutsch.
  - severity: low
    issue: Unklare syntaktische Verbindung in der Gottesbezeichnung
    rationale: »des Herrn Jahwe der Heerscharen« lässt die appositionale Beziehung von »Jahwe« zu »Herrn« unnötig undeutlich. »des Herrn, Jahwes der Heerscharen« bildet die hebräische Titelfolge klar und grammatisch sauber ab.
