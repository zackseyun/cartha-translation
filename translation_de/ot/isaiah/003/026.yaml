  yaml_path: translation/ot/isaiah/003/026.yaml
  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: de
  text: Ihre Tore werden klagen und trauern, und entblößt[a] wird sie auf dem Boden sitzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entleert“ oder „bloßgelegt“. Das hebräische Verb kann ausdrücken, dass jemand oder etwas leer geworden oder von allem entblößt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: werden klagen
  rationale: Das Verb אנה bezeichnet hier im Parallelismus mit אבל hörbares Klagen. Die Wiedergabe bewahrt zugleich die poetische Personifikation der Tore.
- source_word: וְאָבְל֖וּ
  choice: und trauern
  rationale: אבל bezeichnet Trauer angesichts von Verlust und Verwüstung. „trauern“ ergänzt „klagen“, ohne beide Verben gleichzusetzen.
- source_word: פְּתָחֶ֑י/הָ
  choice: ihre Tore
  rationale: פֶּתַח kann allgemein eine Öffnung oder einen Eingang bezeichnen; im Bild der personifizierten Stadt ist „Tore“ die natürliche und kontextgerechte Wiedergabe.
- source_word: וְנִקָּ֖תָה
  choice: entblößt
  rationale: Der Niphal von נקה kann hier das Ausgeräumt-, Entleert- oder Entblößtsein ausdrücken. „entblößt“ passt zum Bild der ihrer Menschen und Zierde beraubten Stadt, ohne die lexikalische Mehrdeutigkeit vollständig aufzulösen.
- source_word: לָ/אָ֥רֶץ
  choice: auf dem Boden
  rationale: In Verbindung mit ישב bezeichnet אֶרֶץ hier am natürlichsten den Boden als Ort einer erniedrigten Trauerhaltung.
- source_word: תֵּשֵֽׁב
  choice: wird sie sitzen
  rationale: Obwohl ישב auch „wohnen“ oder „bleiben“ bedeuten kann, legt die Verbindung mit „auf dem Boden“ die konkrete Bedeutung „sitzen“ nahe.
theological_decisions:
- issue: Bezug der femininen Singularformen
  choice: Das feminine Subjekt wird als die im Zusammenhang personifizierte Stadt Zion beziehungsweise Jerusalem verstanden, aber nicht ausdrücklich benannt.
  alternative: Eine allgemein personifizierte Stadtfigur.
  rationale: Der Zusammenhang führt von den Töchtern Zions zur Darstellung Jerusalems als weiblicher Stadtgestalt. „ihre“ und „sie“ bewahren diese Personifikation, ohne den Vers erklärend zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Voranstellung von „entblößt“ im zweiten Satzteil bewahrt den Nachdruck des hebräischen Prädikats und klingt zugleich natürlich.
