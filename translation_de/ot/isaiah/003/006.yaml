  text: כִּֽי יִתְפֹּ֨שׂ אִ֤ישׁ בְּ/אָחִי/ו֙ בֵּ֣ית אָבִ֔י/ו שִׂמְלָ֣ה לְ/כָ֔ה קָצִ֖ין תִּֽהְיֶה לָּ֑/נוּ וְ/הַ/מַּכְשֵׁלָ֥ה הַ/זֹּ֖את תַּ֥חַת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: de
  text: 'Denn einer wird seinen Bruder im Haus seines Vaters packen und sagen: „Du hast einen Mantel. Sei du unser Anführer! Dieser Zusammenbruch[a] soll unter deiner Hand sein[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dieses Unheil“; wörtlich etwa „dieser Stolperstein“.
    reason: lexical_alternative
  - marker: b
    text: '„Unter deiner Hand“ bedeutet hier: unter deiner Leitung oder in deiner Verantwortung.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt im Zusammenhang eine Begründung beziehungsweise ein veranschaulichendes Beispiel für den zuvor geschilderten gesellschaftlichen Zerfall ein.
- source_word: יִתְפֹּשׂ
  choice: wird … packen
  rationale: Das Verb bezeichnet ein kräftiges Ergreifen; „packen“ gibt den Nachdruck und den sozialen Druck der Szene natürlich wieder.
- source_word: אִישׁ
  choice: einer
  rationale: Gemeint ist ein einzelner Mann aus der geschilderten Gemeinschaft. „Einer“ ist im Deutschen natürlich und bleibt im Zusammenhang mit „seinen Bruder“ geschlechtsgenau.
- source_word: בְּאָחִיו
  choice: seinen Bruder
  rationale: אָח bedeutet gewöhnlich „Bruder“; die folgende Nennung des Vaterhauses stützt den unmittelbaren Familiensinn.
- source_word: בֵּית אָבִיו
  choice: im Haus seines Vaters
  rationale: Die Formulierung bewahrt den örtlichen und familiären Bezug des hebräischen Ausdrucks.
- source_word: שִׂמְלָה
  choice: Mantel
  rationale: Das Wort bezeichnet ein Kleidungsstück, besonders ein Obergewand. Der Mantel steht hier als sichtbares Mindestzeichen gesellschaftlicher Stellung.
- source_word: לְכָה
  choice: Du hast
  rationale: Die hebräische Konstruktion drückt idiomatisch Besitz aus und wird im Deutschen mit „du hast“ wiedergegeben.
- source_word: קָצִין
  choice: Anführer
  rationale: קָצִין bezeichnet eine Person in leitender Stellung. „Anführer“ ist modern und verständlich, ohne eine ausschließlich militärische Funktion vorauszusetzen.
- source_word: תִּהְיֶה לָּנוּ
  choice: Sei du unser Anführer!
  rationale: Die Imperfektform hat hier auffordernden Charakter. Die deutsche Aufforderung gibt den dringlichen Versuch wieder, dem Bruder die Leitung zu übertragen.
- source_word: הַמַּכְשֵׁלָה הַזֹּאת
  choice: dieser Trümmerhaufen
  rationale: Das vom Stolpern abgeleitete Substantiv bezeichnet hier bildhaft den gesellschaftlichen Ruin. „Trümmerhaufen“ erhält das konkrete Bild und passt zur Übergabe von Verantwortung.
- source_word: תַּחַת יָדֶךָ
  choice: unter deiner Hand
  rationale: Die wörtliche Bildsprache bezeichnet etwas, das der Autorität oder Verantwortung einer Person unterstellt ist; sie bleibt im Haupttext erhalten und wird in einer Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist in kurze, dringliche Sätze gegliedert. Das hebräische Bild „unter deiner Hand“ bleibt bewusst erhalten; die ergänzte Redeeinleitung „und sagen“ macht die im Hebräischen unvermittelt einsetzende direkte Rede im Deutschen verständlich.
