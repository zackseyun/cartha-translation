source:
  edition: WLC
  text: גִּבּ֖וֹר וְ/אִ֣ישׁ מִלְחָמָ֑ה שׁוֹפֵ֥ט וְ/נָבִ֖יא וְ/קֹסֵ֥ם וְ/זָקֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/002.yaml
  text: the mighty man and the man of war[a], the judge and the prophet, the diviner and the elder.
translation:
  language: de
  text: den Helden und den Krieger, den Richter und den Propheten, den Wahrsager und den Ältesten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גִּבּוֹר
  choice: den Helden
  rationale: Das Wort bezeichnet hier einen starken, tapferen Mann als gesellschaftliche Stütze. „Held“ bewahrt die männliche Einzahl und bleibt vom folgenden ausdrücklichen militärischen Ausdruck unterschieden.
- source_word: אִישׁ מִלְחָמָה
  choice: den Kriegsmann
  rationale: Die relativ formnahe Wiedergabe bildet die hebräische Verbindung „Mann des Krieges“ ab und unterscheidet sie von גִּבּוֹר. Im gehobenen Listenstil ist „Kriegsmann“ verständlich und würdevoll.
- source_word: שׁוֹפֵט
  choice: den Richter
  rationale: Die Form bezeichnet hier jemanden mit richterlicher beziehungsweise öffentlicher Funktion; „Richter“ ist die direkte und kontextgerechte Entsprechung.
- source_word: נָבִיא
  choice: den Propheten
  rationale: „Prophet“ ist die etablierte, genaue Bezeichnung für dieses Amt.
- source_word: קֹסֵם
  choice: den Wahrsager
  rationale: Das Wort bezeichnet jemanden, der Divination ausübt. „Wahrsager“ ist im modernen Deutsch klar und gibt die gesellschaftlich-religiöse Rolle beschreibend wieder, ohne sie gutzuheißen.
- source_word: זָקֵן
  choice: den Ältesten
  rationale: In der Aufzählung öffentlicher Rollen bezeichnet das Wort eher einen anerkannten Ältesten als lediglich einen alten Mann.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion prägt den formellen Katalog. Ihre Wiedergabe erhält den paarweisen Rhythmus der hebräischen Aufzählung.
theological_decisions:
- issue: Wiedergabe von קֹסֵם im Kontext der angekündigten Wegnahme gesellschaftlicher Stützen
  choice: den Wahrsager
  alternative: den Orakeldeuter
  rationale: Die Bezeichnung wird ohne beschönigende oder konfessionell geprägte Umdeutung wiedergegeben. Der Vers beschreibt die in Juda vorhandene Rolle, ohne damit die Praxis der Wahrsagerei zu billigen.
translation_notes:
  register: Moderner, würdevoller Listenstil. Die Akkusativformen schließen syntaktisch an die in Vers 1 angekündigte Wegnahme an. Der Fußnotenmarker steht beim tatsächlich erläuterten Wort קֹסֵם; die Stellung beim „man of war“ in der englischen Konsultationsschicht wurde als offenkundige Fehlplatzierung nicht übernommen.
