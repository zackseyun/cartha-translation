base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
translation:
  language: de
  text: Und das Volk wird einander bedrängen – Mann gegen Mann und jeder gegen seinen Nächsten. Der Junge wird dem Alten gegenüber dreist auftreten, und der Geringgeachtete wird dem Angesehenen gegenüber dreist auftreten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Alte“ kann auch „der Ältere“ oder „der Greis“ heißen; das hebräische Wort kann sowohl hohes Alter als auch gesellschaftliches Ansehen beziehungsweise Rang bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: wird einander bedrängen
  rationale: Der Nifal von נגשׂ beschreibt hier feindseligen sozialen Druck. „Einander bedrängen“ gibt den wechselseitigen Zerfall der Gesellschaft wieder, ohne die mögliche Bedeutung unnötig auf institutionelle Unterdrückung zu verengen.
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: Mann gegen Mann und jeder gegen seinen Nächsten
  rationale: Die beiden parallelen distributiven Wendungen und die durch בְּ ausgedrückte Gegnerschaft bleiben erhalten. „Nächster“ bezeichnet hier den Mitmenschen, gegen den sich die Feindseligkeit richtet.
- source_word: יִרְהֲבוּ
  choice: wird sich … gegenüber anmaßend verhalten
  rationale: רהב bezeichnet hier stolzes, dreistes oder unverschämtes Auftreten. Die Formulierung ist im modernen Deutsch verständlich und wahrt den sozialen Charakter der Respektlosigkeit.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר bezeichnet einen Jungen oder jungen Mann. Im Gegensatz zum Alten ist „der Junge“ eine natürliche, konkrete Wiedergabe.
- source_word: בַּזָּקֵן
  choice: dem Alten gegenüber
  rationale: זָקֵן kann sowohl einen alten Mann als auch einen Ältesten bezeichnen. „Der Alte“ bewahrt primär den Altersgegensatz; die mögliche soziale Amts- oder Rangbedeutung wird in der Fußnote offengehalten.
- source_word: הַנִּקְלֶה
  choice: der Geringgeachtete
  rationale: Das Partizip bezeichnet jemanden, der als gering oder unbedeutend gilt. „Geringgeachtete“ bildet einen klaren sozialen Gegensatz zum Angesehenen, ohne die Person als ihrem Wesen nach verächtlich zu bezeichnen.
- source_word: בַּנִּכְבָּד
  choice: dem Angesehenen gegenüber
  rationale: Das Wort bezeichnet eine geehrte, gewichtige oder gesellschaftlich angesehene Person. „Angesehene“ gibt den Statuskontrast idiomatisch wieder.
