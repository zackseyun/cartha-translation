revisions:
- from: 'Und das Volk wird einander bedrängen: Mann gegen Mann und jeder gegen seinen Nächsten. Der Junge wird sich dem Alten gegenüber anmaßend verhalten[a] und der Geringgeachtete dem Angesehenen gegenüber.'
  to: Und das Volk wird einander bedrängen – Mann gegen Mann und jeder gegen seinen Nächsten. Der Junge wird dem Alten gegenüber dreist auftreten, und der Geringgeachtete wird dem Angesehenen gegenüber dreist auftreten.[a]
  rationale: Die Revision glättet die deutsche Syntax, macht die zwei sozialen Umkehrungen vollständig parallel und ersetzt die schwerfällige Umschreibung des hebräischen Verbs durch eine natürliche, semantisch passende Formulierung. Die Fußnote wird so angepasst, dass sie die Bedeutungsbreite von זָקֵן genauer und ohne die im Deutschen irreführende Alternative „der Älteste“ erläutert.
