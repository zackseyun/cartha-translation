  text: die Festgewänder[a], die Umhänge, die Umschlagtücher[b] und die Beutel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Prachtgewänder«. Gemeint sind wahrscheinlich besondere, kostbare Kleidungsstücke.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Schals« oder »Schleier«. Welche Art von Tuch gemeint ist, lässt sich nicht sicher bestimmen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Täschchen«. Wahrscheinlich waren Behältnisse für Geld oder Wertsachen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  choice: Festgewänder
  rationale: Das Substantiv bezeichnet wahrscheinlich besondere, kostbare Kleidung. »Festgewänder« vermittelt den gehobenen und nicht alltäglichen Charakter, ohne eine genauere Gewandform vorzutäuschen.
- source_word: מַּעֲטָפוֹת
  choice: Umhänge
  rationale: Das von der Vorstellung des Einhüllens geprägte Wort bezeichnet ein äußeres Kleidungsstück; »Umhänge« ist im Deutschen natürlich und hinreichend offen.
- source_word: מִּטְפָּחוֹת
  choice: Umschlagtücher
  rationale: Gemeint ist eine textile Bedeckung oder ein Tuch; die genaue Form und Tragweise bleibt unsicher. »Umschlagtücher« wahrt diese Offenheit besser als »Schleier«.
- source_word: חֲרִיטִים
  choice: Beutel
  rationale: Das Wort bezeichnet Behältnisse, möglicherweise für Geld oder Wertsachen. »Beutel« gibt die Grundbedeutung wieder, ohne die modernere und enger gefasste Vorstellung einer Handtasche einzutragen.
