base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: de
  text: 'An jenem Tag wird er seine Stimme erheben[a] und sagen: »Ich will kein Heiler sein[b]; in meinem Haus gibt es weder Brot noch Kleidung. Macht mich nicht zum Anführer des Volkes[c]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wird er erheben«; gemeint sein kann, dass er seine Stimme erhebt oder feierlich Einspruch erhebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »einer, der verbindet«; besonders jemand, der Wunden verbindet. Die Bezeichnung kann hier bildlich für jemanden stehen, der die Notlage behebt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zum Vorsteher des Volkes« beziehungsweise »zum Herrscher des Volkes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: wird er seine Stimme erheben
  rationale: נשא bedeutet grundsätzlich »heben/tragen«; zusammen mit לאמר bezeichnet es hier ein nachdrückliches Erheben der Stimme beziehungsweise eine öffentliche Erklärung. Die deutsche Wendung bewahrt das Bild und klingt zugleich natürlich.
- source_word: חֹבֵשׁ
  choice: einer, der Wunden verbindet
  rationale: Das Partizip von חבש bezeichnet wörtlich jemanden, der verbindet, besonders Wunden. Die konkrete Formulierung wahrt das Bild einer Person, die den gesellschaftlichen Schaden beheben soll, ohne vorschnell »Herrscher« einzusetzen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die Grundbedeutung ist »Brot«, auch wenn das Wort umfassender für Nahrung stehen kann. Hier bleibt das konkrete Grundbedürfnis erhalten.
- source_word: שִׂמְלָה
  choice: Kleidung
  rationale: Das Wort bezeichnet ein Kleidungsstück, häufig ein Obergewand. »Kleidung« ist im modernen Deutschen natürlich und lässt die im Kontext mögliche allgemeine Bedeutung offen.
- source_word: תְשִׂימֻנִי
  choice: Macht mich nicht
  rationale: שים bedeutet »setzen, stellen, einsetzen«. Im Zusammenhang der Amtsübertragung gibt »macht mich nicht« die direkte Ablehnung idiomatisch wieder.
- source_word: קְצִין עָם
  choice: Anführer des Volkes
  rationale: קצין bezeichnet einen Führenden, Vorsteher oder Amtsträger und kann auch militärische Nuancen haben. »Anführer« bewahrt die allgemeine Leitungsfunktion, ohne den Text auf ein bestimmtes Amt festzulegen.
theological_decisions:
- issue: Metaphorische oder amtliche Deutung von חֹבֵשׁ
  choice: Das Bild des Wundenverbindens bleibt im Haupttext erhalten.
  alternative: »Heiler« oder kontextuell »Herrscher«
  rationale: Die wörtliche Bildsprache verbindet die Notlage des Volkes mit der erwarteten Aufgabe des Angesprochenen. Eine rein amtliche Wiedergabe würde diese Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und nachdrücklich; die konkrete Bildsprache des Hebräischen bleibt erhalten. Das doppelte וְאֵין wird im Deutschen idiomatisch durch »weder … noch« wiedergegeben.
