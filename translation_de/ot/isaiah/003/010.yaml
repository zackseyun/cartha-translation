source:
  edition: WLC
  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: de
  text: 'Sagt vom Gerechten: Es wird ihm gut gehen[a], denn sie werden die Frucht ihrer Taten essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sagt vom Gerechten: Gut ist es; denn sie werden die Frucht ihrer Taten essen.“ Das Hebräische wechselt vom repräsentativen Singular „der Gerechte“ im ersten Satz zu Pluralformen („sie“, „ihrer“) im Schlusssatz.'
    reason: lexikalische Alternative und grammatischer Numeruswechsel
lexical_decisions:
- source_word: אִמְרוּ
  choice: Sagt
  rationale: Der pluralische Imperativ von אמר ist eine knappe, direkte Aufforderung zum Reden oder Verkünden; „Sagt“ gibt ihn natürlich und formal passend wieder.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im Hebräischen im Singular und bezeichnet hier einen repräsentativen Angehörigen der Gruppe der Gerechten.
- source_word: כִּי (erstes Vorkommen)
  choice: Es wird ihm gut gehen
  rationale: Das erste כִּי leitet den Inhalt der Aussage ein. טוֹב bedeutet wörtlich „gut“, bezeichnet im Kontext aber idiomatisch das Wohlergehen des Gerechten.
- source_word: כִּי (zweites Vorkommen)
  choice: denn
  rationale: Das zweite כִּי begründet die vorausgehende Aussage und wird daher kausal wiedergegeben.
- source_word: פְרִי
  choice: die Frucht
  rationale: Die konkrete Metapher für Ertrag, Folge oder Vergeltung bleibt erhalten.
- source_word: מַעַלְלֵיהֶם
  choice: ihrer Taten
  rationale: „Taten“ gibt die pluralische Form und ihren moralisch gewichteten Sinn knapp und verständlich wieder.
- source_word: יֹאכֵלוּ
  choice: sie werden … essen
  rationale: Die wörtliche Bedeutung des pluralischen Verbs bewahrt das Bild vom Essen der Frucht, statt es als „genießen“ oder „erfahren“ auszudeuten.
theological_decisions:
- issue: Repräsentativer Singular und Wechsel zum Plural
  choice: „der Gerechte … ihm“, danach „sie … ihrer“
  alternative: 'Den gesamten Vers singularisch formulieren: „der Gerechte … er wird die Frucht seiner Taten essen“; oder den Anfang kollektiv pluralisch wiedergeben: „die Gerechten“'
  rationale: Der hebräische Text beginnt mit dem substantivierten Singular צַדִּיק, wechselt aber in der Schlussaussage ausdrücklich zu einem pluralischen Verb und einem pluralischen Suffix. Die Übersetzung bildet diese Spannung ab, ohne die Formen künstlich zu vereinheitlichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnrede und das Bild von der Frucht der Taten bleiben erhalten; der auffällige Wechsel vom Singular zum Plural wird bewusst nicht geglättet.
