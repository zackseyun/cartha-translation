  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: de
  text: Wehe dem Gottlosen! Ihm ergeht es schlecht[a], denn was seine Hände getan haben, wird ihm angetan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formeller: „Wehe dem Gottlosen! Schlimmes trifft ihn, denn ihm wird vergolten, was seine Hände getan haben.“'
    reason: Lexikalische Alternative für das knappe רָע und die Vergeltungsbedeutung von גְּמוּל; sie vermeidet die missverständliche Formulierung „Vergeltung seiner Hände“.
lexical_decisions:
- source_word: א֖וֹי
  choice: Wehe
  rationale: Die Interjektion verbindet Klage mit prophetischer Gerichtsankündigung; „Wehe“ bewahrt diese feste Ausdrucksweise.
- source_word: לְ/רָשָׁ֣ע
  choice: dem Gottlosen
  rationale: Die Präposition kennzeichnet den Adressaten des Wehrufs. Der substantivierte Singular entspricht dem repräsentativen hebräischen Singular.
- source_word: רָ֑ע
  choice: Ihm ergeht es schlecht
  rationale: רַע steht hier verkürzt-prädikativ und bezeichnet das schlimme Ergehen des Gottlosen; die deutsche Wendung gibt den idiomatischen Sinn natürlich wieder.
- source_word: כִּֽי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Gerichtsankündigung ein.
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: was seine Hände getan haben
  rationale: גְּמוּל bezeichnet hier das Tun beziehungsweise dessen entsprechende Vergeltung. Die Formulierung wahrt das konkrete Bild der Hände und macht den Zusammenhang von Tat und Folge verständlich.
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: wird ihm angetan
  rationale: Der Nifal wird passiv verstanden. „Angetan“ bewahrt den Bezug zum Tun und bringt zugleich zum Ausdruck, dass die Folgen auf ihn zurückkommen.
theological_decisions:
- issue: Repräsentativer maskuliner Singular im Gerichtswort
  choice: „dem Gottlosen … ihm … seine“ im Singular
  alternative: Pluralische Wiedergabe mit „den Gottlosen … ihnen“
  rationale: Der hebräische Text spricht grammatisch im Singular und stellt einen repräsentativen Einzelfall vor; diese Form wird ohne zusätzliche Geschlechtsangabe bewahrt.
- issue: Vergeltung entsprechend den eigenen Taten
  choice: „was seine Hände getan haben, wird ihm angetan“
  alternative: „der Lohn seiner Hände wird ihm vergolten“
  rationale: Die gewählte Fassung erhält die spannungsvolle, maßentsprechende Gerichtslogik und die Verbindung zwischen eigenem Tun und dem, was dem Täter widerfährt, ohne sie dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prophetische Wehruf bleibt prägnant; die Hauptfassung ist idiomatisch, während die Fußnote die knappere und formalere Struktur des Hebräischen erkennen lässt.
