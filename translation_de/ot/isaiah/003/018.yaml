source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יָסִ֣יר אֲדֹנָ֗/י אֵ֣ת תִּפְאֶ֧רֶת הָ/עֲכָסִ֛ים וְ/הַ/שְּׁבִיסִ֖ים וְ/הַ/שַּׂהֲרֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/018.yaml
  text: In that day the Lord will take away the beauty of the anklets[a], the headbands[c][b], and the crescent ornaments.
translation:
  language: de
  text: An jenem Tag wird der Herr den Schmuck der Fußspangen, der Stirnbänder[a] und der halbmondförmigen Schmuckstücke[b] wegnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung des hebräischen Wortes ist unsicher; möglich sind auch »Hauben« oder »Haarnetze«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Halbmondschmuck«. Gemeint sind halbmondförmige Schmuckstücke; ihre genaue Art und Trageweise ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird im modernen Deutschen natürlich und würdevoll wiedergegeben.
- source_word: יָסִיר
  choice: wird … wegnehmen
  rationale: Der Hifil von סור bezeichnet hier das Beseitigen beziehungsweise Fortnehmen der Schmuckstücke.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Im Ausgangstext steht der Gottestitel Adonaj, nicht das Tetragramm; daher wird der Titel übersetzt.
- source_word: תִּפְאֶרֶת
  choice: den Schmuck
  rationale: Das Wort kann Schönheit, Pracht oder Zierde bezeichnen. Im Zusammenhang der aufgezählten Schmuckstücke gibt „Schmuck“ die konkrete Bedeutung natürlich wieder, ohne einen zusätzlichen abstrakten Ausdruck wie „die Schönheit von“ zu erzwingen.
- source_word: הָעֲכָסִים
  choice: der Fußspangen
  rationale: Gemeint sind Schmuckstücke im Bereich von Fuß oder Knöchel. „Fußspangen“ ist verständlich und entspricht dem in Jesaja 3,16 angedeuteten klingenden Fußschmuck.
- source_word: הַשְּׁבִיסִים
  choice: der Stirnbänder
  rationale: Die genaue Art des Kopfputzes ist unsicher. „Stirnbänder“ ist eine vorsichtige, lesbare Wiedergabe innerhalb des wahrscheinlichen Bedeutungsfeldes.
- source_word: הַשַּׂהֲרֹנִים
  choice: der halbmondförmigen Anhänger
  rationale: Die Bezeichnung ist von „Mond/Halbmond“ abgeleitet und meint halbmondförmigen Schmuck; „Anhänger“ benennt plausibel die Schmuckart, deren genaue Trageweise jedoch nicht sicher ist.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die Reihung des Hebräischen bleibt erhalten; unsichere Bezeichnungen für antike Schmuckstücke werden nicht unnötig präzisiert.
