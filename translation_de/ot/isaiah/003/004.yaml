  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: de
  text: Und ich werde ihnen Jugendliche[a] zu Fürsten geben, und Kinder[b] werden über sie herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jungen“ oder „junge Männer“; das hebräische Wort kann Jugendlichkeit und damit verbundene Unerfahrenheit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Unmündige“; das seltene hebräische Wort kann kleine Kinder oder Menschen mit kindisch-wankelmütigem Verhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: Die Grundbedeutung von נתן ist „geben“. Zusammen mit „als Fürsten“ bezeichnet die Wendung hier, dass Gott ihnen diese als Herrscher einsetzt; die natürliche deutsche Formulierung bewahrt zugleich das hebräische Bild.
- source_word: נְעָרִים
  choice: junge Männer
  rationale: נְעָרִים bezeichnet männliche Jugendliche oder junge Männer. Die Wiedergabe lässt offen, wie jung sie sind, und vermittelt im Gerichtskontext ihre mangelnde Erfahrung.
- source_word: שָׂרֵיהֶם
  choice: ihnen … als Fürsten
  rationale: שַׂר bezeichnet einen Fürsten, Obersten oder hohen Amtsträger. „Fürsten“ wahrt den gehobenen Rang; der deutsche Satz gibt die Zugehörigkeit des hebräischen Suffixes idiomatisch mit „ihnen … als“ wieder.
- source_word: וְתַעֲלוּלִים
  choice: und Unreife
  rationale: Das seltene Wort תַעֲלוּלִים kann kleine Kinder oder kindisch-wankelmütige Menschen bezeichnen. „Unreife“ bewahrt die Verbindung von Jugend und ungeeignetem Verhalten, ohne eine ausschließlich wörtliche Altersangabe festzulegen.
- source_word: יִמְשְׁלוּ בָם
  choice: werden über sie herrschen
  rationale: משל mit ב bezeichnet die Ausübung von Herrschaft über Menschen. „Über sie herrschen“ ist direkt, würdevoll und im Deutschen natürlich.
theological_decisions:
- issue: Art des Gerichtsbildes
  choice: Gottes Gericht zeigt sich darin, dass unerfahrene und unreife Menschen die Herrschaft erhalten; die Aussage kann sowohl wirklich junge als auch im Verhalten kindische Herrscher umfassen.
  alternative: Die Ausdrücke könnten ausschließlich das tatsächliche Alter oder ausschließlich bildlich die Unfähigkeit der Herrscher bezeichnen.
  rationale: Die hebräischen Begriffe verbinden Jugend mit Unreife, ohne eindeutig festzulegen, ob die Beschreibung nur wörtlich oder nur bildlich gemeint ist. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fürsten“ erhält die politische und poetische Färbung des Ausgangstextes; „Unreife“ macht den schwierigen zweiten Ausdruck verständlich, ohne seine Deutung auf ein bestimmtes Lebensalter zu verengen.
