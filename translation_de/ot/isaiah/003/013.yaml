  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
translation:
  language: de
  text: Jahwe nimmt Stellung, um einen Rechtsstreit zu führen[a], und steht bereit, um die Völker zu richten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu streiten“ beziehungsweise „um eine Rechtssache zu führen“; das hebräische Verb kann einen rechtlichen Streit vor Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Volksgruppen“ beziehungsweise „die Nationen“; im Hebräischen steht die Mehrzahl, deren genaue Reichweite offenbleibt.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּב
  choice: tritt auf
  rationale: Das Nifal-Partizip beschreibt eine feste, entschlossene Stellung. „Tritt auf“ gibt die aktive richterliche Haltung in natürlichem Deutsch wieder und leitet die Gerichtsszene anschaulich ein.
- source_word: לָרִיב
  choice: um einen Rechtsstreit zu führen
  rationale: ריב bezeichnet hier ein rechtliches Streiten beziehungsweise das Führen einer Sache vor Gericht. Die Wiedergabe bewahrt das forensische Bild, ohne Jahwes genaue Rolle im Verfahren enger festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: וְעֹמֵד
  choice: und steht da
  rationale: Das Partizip von עמד setzt die parallele Darstellung von Jahwes fester richterlicher Haltung fort. „Steht da“ bewahrt den Zustandscharakter und klingt im Deutschen natürlich.
- source_word: לָדִין
  choice: um … zu richten
  rationale: דין hat an dieser Stelle am wahrscheinlichsten forensische Bedeutung. „Richten“ ist klar, knapp und vermeidet die stärkere Auslegung „Urteil vollstrecken“.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der hebräische Plural bezeichnet mehrere Völker oder Volksgruppen. „Die Völker“ erhält die Mehrzahl und lässt den genauen Umfang der bezeichneten Gruppen offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Seine Umschrift bewahrt den Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Reichweite von עַמִּים
  choice: die Völker
  alternative: die Nationen; die Volksgruppen
  rationale: Der Plural kann allgemein mehrere Völker bezeichnen. Die gewählte Formulierung legt nicht fest, ob ausschließlich fremde Nationen oder mehrere Menschengruppen insgesamt gemeint sind.
- issue: Rechtliche Bildsprache von ריב
  choice: einen Rechtsstreit führen
  alternative: streiten; Anklage erheben; eine Sache vorbringen
  rationale: Die Formulierung macht den gerichtlichen Rahmen sichtbar, bestimmt Jahwes prozessuale Rolle aber nicht unnötig als die eines Anklägers oder Fürsprechers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben „tritt auf“ und „steht da“ bewahren die feierliche Gerichtsszene; die rechtliche Bildsprache wird verständlich gemacht, ohne die offenen Rollen und den Umfang von „Völker“ dogmatisch einzuengen.
