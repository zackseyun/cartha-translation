  language: de
  text: die Anhänger, die Armreifen[a] und die Schleier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ketten oder Fußreifen; welche Art von Schmuck das hebräische Wort genau bezeichnet, ist ungewiss.'
