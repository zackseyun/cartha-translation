lexical_decisions:
- source_word: הַנְּטִיפוֹת
  choice: die Anhänger
  rationale: Das Wort bezeichnet wahrscheinlich herabhängenden, möglicherweise tropfenförmigen Schmuck. »Anhänger« ist im Deutschen natürlich und vermeidet die unbelegte Präzisierung auf Ohrringe.
- source_word: הַשֵּׁירוֹת
  choice: die Armreifen
  rationale: Das seltene Wort bezeichnet ein Schmuckstück, dessen genaue Art unsicher ist. »Armreifen« passt in die Aufzählung; mögliche Alternativen werden in der Fußnote genannt.
- source_word: הָרְעָלוֹת
  choice: die Schleier
  rationale: Das Wort bezeichnet hier wahrscheinlich verhüllende oder umhüllende Kleidung. »Schleier« ist die naheliegende, verständliche Wiedergabe, ohne mögliche Bedeutungen wie Umschlagtücher oder Überwürfe auszuschließen.
