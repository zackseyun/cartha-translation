source:
  edition: WLC
  text: וְ/הָיָה֩ תַ֨חַת בֹּ֜שֶׂם מַ֣ק יִֽהְיֶ֗ה וְ/תַ֨חַת חֲגוֹרָ֤ה נִקְפָּה֙ וְ/תַ֨חַת מַעֲשֶׂ֤ה מִקְשֶׁה֙ קָרְחָ֔ה וְ/תַ֥חַת פְּתִיגִ֖יל מַחֲגֹ֣רֶת שָׂ֑ק כִּי תַ֖חַת יֹֽפִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: de
  text: 'Dann wird statt Balsamduft Moder sein,

    statt eines Gürtels ein Strick[a],

    statt kunstvoll frisiertem Haar eine Glatze[b],

    statt eines Prachtgewands ein Sacktuch um die Hüften

    und ein Brandmal statt Schönheit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann einen Strick, eine Schnur oder möglicherweise eine strickartige Spur der Erniedrigung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig und kann allgemeiner kunstvolle Arbeit oder aufwendigen Schmuck bezeichnen. Der Gegensatz zur Glatze spricht hier für kunstvoll gestaltetes Haar.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Schluss ist textlich und sprachlich schwierig. Die masoretische Vokalisierung ergibt wörtlich „denn statt Schönheit“. Die Konsonantenfolge kann abweichend vokalisiert und als „Brandmal“ verstanden werden; andere Übersetzungen geben den Sinn allgemeiner mit „Schande statt Schönheit“ wieder.
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: Balsamduft
  rationale: Das Wort bezeichnet wohlriechenden Balsam beziehungsweise Duftstoff. „Balsamduft“ gibt den konkreten Luxusduft wieder und bildet einen klaren Gegensatz zu „Moder“.
- source_word: מַק
  choice: Moder
  rationale: Das Substantiv bezeichnet Fäulnis oder Verwesung. „Moder“ bewahrt das konkrete, abstoßende Bild und klingt im Deutschen natürlicher als „Fäulnis wird sein“.
- source_word: חֲגוֹרָה
  choice: Gürtel
  rationale: Gemeint ist allgemein etwas, das um die Hüfte getragen wird. „Gürtel“ ist die klare, moderne Entsprechung.
- source_word: נִקְפָּה
  choice: Strick
  rationale: Das seltene Wort wird meist als grober Strick oder als strickartige Spur verstanden. Im Gegensatz zum Gürtel bezeichnet „Strick“ überzeugend den entwürdigenden Ersatz, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: kunstvoll frisiertes Haar
  rationale: Die schwierige Wendung kann allgemein kunstvolle Arbeit oder kunstvollen Schmuck bezeichnen. Da ihr „Glatze“ gegenübersteht, liegt hier eine aufwendig gestaltete Frisur am nächsten.
- source_word: קָרְחָה
  choice: Glatze
  rationale: Das Wort bedeutet Kahlheit beziehungsweise eine kahle Stelle. „Glatze“ ist anschaulich und bildet den unmittelbaren Gegensatz zur kunstvollen Frisur.
- source_word: פְּתִיגִיל
  choice: Prachtgewand
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein kostbares oder festliches Kleidungsstück. „Prachtgewand“ vermittelt Luxus und gesellschaftliche Zurschaustellung, ohne eine bestimmte Gewandform festzulegen.
- source_word: מַחֲגֹרֶת שָׂק
  choice: ein Gürten mit Sacktuch
  rationale: Die Formulierung bezeichnet wörtlich ein Umgürten mit Sacktuch. Die nominale Wiedergabe erhält die Parallelstruktur und das Bild von Trauerkleidung als Ersatz für das Prachtgewand.
- source_word: כִּי תַחַת יֹפִי
  choice: ein Brandmal statt Schönheit
  rationale: Die überlieferte Vokalisierung ergibt isoliert „denn statt Schönheit“ und lässt die Schlusszeile unvollständig erscheinen. Häufig wird in den Konsonanten ein seltenes Wort für „Brandmal“ erkannt beziehungsweise eine sehr geringe Textkorrektur angenommen; dies ergibt den prägnanten letzten Gegensatz.
