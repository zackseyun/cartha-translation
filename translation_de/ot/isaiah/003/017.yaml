source:
  edition: WLC
  text: וְ/שִׂפַּ֣ח אֲדֹנָ֔/י קָדְקֹ֖ד בְּנ֣וֹת צִיּ֑וֹן וַ/יהוָ֖ה פָּתְ/הֵ֥ן יְעָרֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: de
  text: Darum wird der Herr den Scheitel der Töchter Zions mit Schorf bedecken, und Jahwe wird ihre Scham entblößen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Nacktheit“. Das hebräische Wort ist schwierig; manche verstehen es genauer als verhüllende Bezeichnung für die Intimteile, andere als „ihre Stirn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: wird … mit Schorf bedecken
  rationale: Das Verb bezeichnet hier das Zufügen eines schorfigen oder krankhaften Zustands. Die deutsche Wendung ist verständlich, wahrt das konkrete Krankheitsbild und trägt im Zusammenhang strafenden Charakter.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der Gottestitel bezeichnet den souveränen Herrn und bleibt von dem folgenden Gottesnamen יהוה sprachlich unterschieden.
- source_word: קָדְקֹד
  choice: Scheitel
  rationale: Das Wort bezeichnet den höchsten Teil des Kopfes beziehungsweise die Kopfhaut. „Scheitel“ ist knapp, würdig und im Zusammenhang eindeutig körperlich gemeint.
- source_word: בְּנוֹת צִיּוֹן
  choice: die Töchter Zions
  rationale: Die formnahe Wiedergabe erhält die prophetisch-poetische Bezeichnung und vermeidet die interpretierende Verengung auf „Frauen“.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Die Wiedergabe mit dem Eigennamen erhält den formalen Unterschied zum unmittelbar zuvor stehenden Titel אֲדֹנָי.
- source_word: פָּתְהֵן
  choice: ihre Scham
  rationale: Das schwierige Substantiv wird im Kontext von Bloßstellung wahrscheinlich euphemistisch für die Intimteile beziehungsweise Nacktheit gebraucht. „Scham“ bewahrt den Euphemismus und die beschämende Dimension, ohne die lexikalische Unsicherheit zu verdecken.
- source_word: יְעָרֶה
  choice: wird … entblößen
  rationale: Das Verb bedeutet aufdecken oder bloßlegen. „Entblößen“ ist natürliches, eindringliches Deutsch und passt zum Gerichtsmotiv der öffentlichen Beschämung.
theological_decisions:
- issue: Unterschiedliche Wiedergabe von אֲדֹנָי und יהוה im selben Vers
  choice: אֲדֹנָי als „der Herr“, יהוה als „Jahwe“
  alternative: Beide Bezeichnungen als „der Herr“ wiedergeben
  rationale: Der hebräische Text verwendet in unmittelbarer Folge einen Titel und den Gottesnamen. Die unterschiedliche Wiedergabe bewahrt diesen bedeutungsvollen formalen Wechsel.
- issue: Bedeutung von פָּתְהֵן im Gerichtswort
  choice: euphemistische Bezeichnung der Scham beziehungsweise Intimteile
  alternative: „ihre Nacktheit“ allgemein oder nach anderer Deutung „ihre Stirn“
  rationale: Das Verb „entblößen“ und der Zusammenhang öffentlicher Demütigung sprechen für körperliche Bloßstellung. Da das Substantiv selten und schwierig ist, werden abweichende Deutungen in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-poetischer Färbung. Die traditionelle Wendung „Töchter Zions“ und der Gottesname „Jahwe“ erhalten die Struktur des hebräischen Textes; die drastische Gerichtssprache wird klar, aber nicht unnötig explizit wiedergegeben.
