base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: de
  text: 'Denn siehe: Der Herr, der HERR der Heerscharen, nimmt Jerusalem und Juda Stütze und Stab weg: allen Vorrat an Brot und allen Vorrat an Wasser.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jede Stütze des Brotes und jede Stütze des Wassers“. Die wiederholte Stützmetapher bezeichnet die gesamte Versorgung mit Brot und Wasser.'
    reason: Die Fußnote dokumentiert die ungewöhnliche hebräische Bildsprache, während der Haupttext sie in natürlichem Deutsch als Vorrat bzw. Versorgung wiedergibt.
lexical_decisions:
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: der Herr, der HERR der Heerscharen
  rationale: Bewahrt sowohl den Herrschertitel הָאָדוֹן als auch den Gottesnamen יהוה in der deutschen Konvention HERR; צְבָאוֹת wird traditionsnah und semantisch offen als „Heerscharen“ wiedergegeben.
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: Stütze und Stab
  rationale: Das hebräische Wortpaar verwendet eine maskuline und eine feminine Form derselben Wurzel. „Stütze und Stab“ erhält die bildhafte Verdopplung natürlicher als eine rein abstrakte Wiedergabe.
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: jede Stütze an Brot und jede Stütze an Wasser
  rationale: Die ungewöhnliche Stützmetaphorik des Hebräischen bleibt sichtbar; zugleich wird verständlich, dass die grundlegende Versorgung entzogen wird.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: Jahwe
  rationale: Die etablierte deutsche Bibelkonvention macht die Präsenz des Gottesnamens durch Kapitälchen kenntlich, ohne eine bestimmte Aussprache festzulegen.
- issue: Bedeutung von צְבָאוֹת
  choice: Heerscharen
  alternative: Armeen
  rationale: „Heerscharen“ lässt offen, ob irdische, himmlische oder kosmische Mächte im Blick sind, und vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ bewahrt den prophetischen Aufmerksamkeitsruf; „nimmt … weg“ ist klar und unmittelbar. Der Gedankenstrich kennzeichnet die erläuternde Entfaltung des vorangehenden Wortpaars.
