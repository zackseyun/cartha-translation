  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
translation:
  language: de
  text: den Befehlshaber über fünfzig Mann, den hoch angesehenen Mann, den Ratgeber, den geschickten Handwerker und den in Beschwörungen Kundigen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „den, der sich auf Flüstern versteht“. Gemeint ist wahrscheinlich jemand, der sich auf gemurmelte Zauber- oder Beschwörungsformeln versteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: den Befehlshaber über fünfzig Mann
  rationale: שַׂר bezeichnet einen Anführer oder Amtsträger; zusammen mit חֲמִשִּׁים ist ein militärischer oder administrativer Befehlshaber über fünfzig Männer gemeint. Die Ergänzung „Mann“ macht die Zahlenangabe im Deutschen verständlich.
- source_word: נְשׂוּא פָנִים
  choice: den hoch angesehenen Mann
  rationale: Die Wendung bedeutet wörtlich etwa „von erhobenem Gesicht“ und bezeichnet idiomatisch einen geehrten Menschen von hohem gesellschaftlichem Rang.
- source_word: יוֹעֵץ
  choice: den Ratgeber
  rationale: Das Partizip bezeichnet jemanden, der Rat erteilt. „Ratgeber“ fügt sich natürlich in die Aufzählung gesellschaftlich wichtiger Personen ein.
- source_word: חֲכַם חֲרָשִׁים
  choice: den geschickten Handwerker
  rationale: חֲכַם bezeichnet hier die für ein Handwerk erforderliche Sachkunde und Geschicklichkeit; חֲרָשִׁים verweist auf Handwerker beziehungsweise Kunsthandwerker.
- source_word: נְבוֹן לָחַשׁ
  choice: den in Beschwörungen Kundigen
  rationale: נְבוֹן bezeichnet Einsicht oder besondere Sachkunde; לָחַשׁ kann sich auf Flüstern, Zauberformeln oder Beschwörungen beziehen. Die Formulierung gibt den wahrscheinlichen rituell-magischen Sinn wieder, ohne die schwer bestimmbare Tätigkeit unnötig zu präzisieren.
theological_decisions:
- issue: Wiedergabe einer wahrscheinlich mit magischer Praxis verbundenen Bezeichnung
  choice: den in Beschwörungen Kundigen
  alternative: den kundigen Beschwörer
  rationale: Die Übersetzung wahrt den wahrscheinlichen Bezug auf gemurmelte Zauber- oder Beschwörungsformeln, ohne aus der bloßen Nennung eine ausdrückliche Billigung oder Verurteilung dieser Praxis abzuleiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholten Akkusativartikel machen deutlich, dass der Vers die Aufzählung aus dem vorangehenden Satz fortsetzt. Bei der letzten Bezeichnung bleibt die Unschärfe des hebräischen Ausdrucks in der Fußnote sichtbar.
