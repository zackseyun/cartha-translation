  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: de
  text: Ihr Gesichtsausdruck zeugt gegen sie[a]. Wie Sodom verkünden sie ihre Sünde[b]; sie verbergen sie nicht. Wehe ihnen selbst[c]! Denn sie haben sich selbst Böses zugefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was man an ihren Gesichtern erkennt, sagt gegen sie aus.« Der hebräische Ausdruck kann die sichtbare Miene oder Erscheinung als belastendes Zeugnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Wie Sodom« erinnert an öffentlich und schamlos ausgeübte Bosheit; siehe 1. Mose 13,13; 19,5.
    reason: cross_reference
  - marker: c
    text: 'Wörtlicher: »Wehe ihrer eigenen Person«; auch möglich: »Wehe ihrer Seele« oder »Wehe ihnen«. Das hebräische Wort nefesch kann je nach Zusammenhang Person, Selbst, Leben oder Seele bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: Ihr Gesichtsausdruck
  rationale: Die Wortverbindung bezeichnet hier wahrscheinlich das an ihrem Gesicht Erkennbare, also Miene oder Ausdruck. »Gesichtsausdruck« ist natürliches modernes Deutsch und lässt zugleich offen, welches sichtbare Merkmal sie belastet.
- source_word: עָנְתָה בָּם
  choice: zeugt gegen sie
  rationale: 'ענה mit ב hat hier forensischen Klang: Ihr sichtbarer Ausdruck tritt als belastendes Zeugnis gegen sie auf.'
- source_word: וְחַטָּאתָם … הִגִּידוּ
  choice: verkünden sie ihre Sünde
  rationale: נגד im Hifil bedeutet bekannt machen oder verkünden. Die Formulierung bewahrt den öffentlichen und unverschämten Charakter ihres Handelns; der kollektive Singular »Sünde« entspricht dem Hebräischen.
- source_word: כִּסְדֹם
  choice: Wie Sodom
  rationale: Die knappe Vergleichsform bleibt erhalten und ruft Sodom als Inbegriff offen zur Schau gestellter Bosheit auf, ohne die Anspielung im Haupttext auszudeuten.
- source_word: לֹא כִחֵדוּ
  choice: sie verbergen sie nicht
  rationale: כחד bedeutet verbergen oder verhehlen. Das Pronomen nimmt im Deutschen eindeutig »ihre Sünde« auf.
- source_word: אוֹי לְנַפְשָׁם
  choice: Wehe ihnen selbst
  rationale: נפש bezeichnet hier wahrscheinlich die eigene Person und nicht speziell eine immaterielle Seele. »Ihnen selbst« wahrt die reflexive Betonung.
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: Denn sie haben sich selbst Böses zugefügt
  rationale: גמל bezeichnet ein Handeln oder Vergelten, dessen Böses hier auf die Täter selbst zurückfällt. Die Wiedergabe formuliert die selbstverschuldete Folge klar, ohne ihren Mechanismus näher festzulegen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in לְנַפְשָׁם
  choice: 'reflexiv: »ihnen selbst«'
  alternative: »ihrer Seele« oder schlicht »ihnen«
  rationale: נפש kann die ganze Person, das Leben oder das Selbst bezeichnen. Eine Wiedergabe mit »Seele« könnte hier eine engere anthropologische Aussage nahelegen, als der hebräische Text macht.
- issue: Aussage des Schlusssatzes
  choice: selbstverschuldetes Böses beziehungsweise auf sie selbst zurückfallende Folge
  alternative: ausdrücklich göttliche Vergeltung oder lediglich gesellschaftliche Konsequenz
  rationale: Der Vers sagt, dass sie sich selbst Böses zugefügt haben, bestimmt an dieser Stelle aber nicht ausdrücklich, auf welche Weise die Folge eintritt. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Schärfe. Die Wortstellung »Wie Sodom« erhält die markante Anspielung; »ihnen selbst« und »sich selbst« bilden die reflexive Zuspitzung des hebräischen Schlusses ab.
