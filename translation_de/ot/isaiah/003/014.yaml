id: ISA.3.14
reference: Isaiah 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: de
  text: 'Jahwe tritt ins Gericht[a] mit den Ältesten seines Volkes und seinen führenden Männern: »Ihr seid es, die den Weinberg abgeweidet[b][c] haben; das den Armen geraubte Gut[d] ist in euren Häusern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »kommt zum Gericht« oder »kommt im Gericht«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch mit »verzehrt«, »vernichtet« oder »niedergebrannt« wiedergegeben werden; gemeint ist ein zerstörerischer Verbrauch.
    reason: lexical_alternative
  - marker: c
    text: Der »Weinberg« steht wahrscheinlich bildlich für das Volk oder die Gemeinschaft und klingt an Jesajas weitere Weinbergbilder an.
    reason: cross_reference
  - marker: d
    text: 'Wörtlicher: »der Raub der Armen«; auch: »was den Armen geraubt wurde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel »HERR« ersetzt.
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: tritt ins Gericht
  rationale: Die geläufige deutsche Rechtswendung gibt den gerichtlichen Sinn der Verbindung prägnant wieder; das Präsens bewahrt die prophetische Unmittelbarkeit des hebräischen Imperfekts.
- source_word: עִם
  choice: mit
  rationale: »Mit« entspricht unmittelbar der Präposition; der anklagende Zusammenhang zeigt, dass die genannten Führer vor Gericht stehen, ohne die Präposition deutend zu »gegen« zu verschärfen.
- source_word: זִקְנֵי עַמּוֹ
  choice: die Ältesten seines Volkes
  rationale: »Älteste« bezeichnet hier anerkannte Verantwortungsträger und nicht lediglich Menschen hohen Alters.
- source_word: וְשָׂרָיו
  choice: und seine führenden Männer
  rationale: Die Formulierung bildet die Leitungsfunktion von שׂרים in natürlichem Deutsch ab und lässt den Bezug des Suffixes ebenso offen wie die hebräische Form.
- source_word: וְאַתֶּם
  choice: Ihr seid es
  rationale: Die Konstruktion bringt die nachdrückliche, ausdrücklich gesetzte Anrede zur Geltung.
- source_word: בִּעַרְתֶּם
  choice: abgeweidet haben
  rationale: Das Verb kann zerstörendes Verzehren beziehungsweise Abweiden bezeichnen. »Abgeweidet« erhält sowohl das Bildfeld des Weinbergs als auch den Vorwurf rücksichtsloser Ausbeutung.
- source_word: הַכֶּרֶם
  choice: den Weinberg
  rationale: Die konkrete Bildsprache wird bewahrt, ohne den Weinberg im Haupttext ausdrücklich als Volk oder Gemeinschaft auszulegen.
- source_word: גְּזֵלַת הֶעָנִי
  choice: das den Armen geraubte Gut
  rationale: Die Wiedergabe bezeichnet verständlich den durch Raub oder gewaltsame Aneignung erlangten Besitz; der singularische Arme wird im Deutschen kollektiv als »die Armen« ausgedrückt.
- source_word: בְּבָתֵּיכֶם
  choice: ist in euren Häusern
  rationale: Der Plural folgt dem Hebräischen und kennzeichnet die Wohnhäuser der angesprochenen Führer als Aufbewahrungsorte ihres ungerechten Gewinns.
theological_decisions:
- issue: Bildliche Bedeutung des Weinbergs
  choice: »Weinberg« bleibt im Haupttext als Bild stehen.
  alternative: Das Bild als »mein Volk« oder »die Gemeinschaft« auflösen.
  rationale: Der Text selbst nennt an dieser Stelle die Bedeutung des Bildes nicht ausdrücklich. Die Beibehaltung bewahrt seine Mehrdeutigkeit und seine Verbindung zur weiteren Weinbergbildsprache Jesajas.
- issue: Gerichtliche Bedeutung von עִם
  choice: Die Präposition wird mit »mit« wiedergegeben.
  alternative: »gegen«
  rationale: Obwohl die Szene eindeutig anklagend ist, steht im Hebräischen die gewöhnliche Präposition »mit«. Der folgende Vorwurf macht die Gegnerschaft deutlich, ohne sie bereits in die Präposition einzutragen.
- issue: Bezug des Pronominalsuffixes in וְשָׂרָיו
  choice: »seinen führenden Männern« bewahrt den möglichen Bezug auf Jahwe beziehungsweise sein Volk im unmittelbaren Zusammenhang.
  alternative: Eindeutig »den führenden Männern des Volkes« oder »Jahwes führenden Männern« formulieren.
  rationale: Das maskuline Singularsuffix ist grammatisch nicht so eindeutig, dass der Haupttext seinen Bezug stärker festlegen sollte als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtswendung »ins Gericht treten« und die direkte Anklage wahren den feierlich-prophetischen Ton; »führende Männer« vermeidet das heute leicht missverständliche »Fürsten«, während »abgeweidet« die konkrete und harte Bildsprache erhält.
