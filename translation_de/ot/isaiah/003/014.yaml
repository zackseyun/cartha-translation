  naturalness: Modernes, würdiges Standarddeutsch mit passendem prophetisch-rechtlichem Ton. »Ins Gericht treten mit« ist zwar gehoben, in diesem Kontext aber idiomatisch und sachgerecht. »Führende Männer« ist verständlich; es überträgt die Leitungsfunktion von שָׂרִים ohne unnötig anachronistische Bürokratiesprache.
  terminology: »Jahwe«, »Älteste«, »Weinberg«, »Arme« und »Häuser« sind konsistent und quellentreu. Die Fußnoten erläutern echte lexikalische Alternativen und die metaphorische Resonanz des Weinbergs, ohne sie dem Haupttext aufzuzwingen. Die Anker stehen an den sachlich passenden Textstellen.
