  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: de
  text: 'Und Jahwe sprach: Weil die Töchter Zions hochmütig sind, mit gerecktem Hals einhergehen und mit den Augen Blicke werfen[a], mit kleinen Schritten dahintrippeln und mit ihren Füßen klirren[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Augen kokette Blicke werfen“. Die seltene hebräische Wendung kann verführerische, möglicherweise auch täuschende Augenbewegungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit den Füßen ihre Fußringe klirren lassen“. Das hebräische Verb meint wahrscheinlich ein klingendes oder klirrendes Geräusch, das wohl von Schmuck an den Knöcheln stammt; Fußringe werden in diesem Vers jedoch nicht ausdrücklich erwähnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Die Partikelfolge leitet den Grund für das in den folgenden Versen angekündigte Gericht ein. Der mit einem Komma endende Satz wahrt diesen syntaktischen Anschluss.
- source_word: גָבְהוּ בְּנוֹת צִיּוֹן
  choice: die Töchter Zions hochmütig sind
  rationale: „Hochmütig“ gibt die bildlich als Erhöhung bezeichnete stolze Haltung wieder; „Töchter Zions“ bewahrt die hebräische Ausdrucksweise.
- source_word: נטוות גָּרוֹן
  choice: mit gerecktem Hals
  rationale: Die Wendung bezeichnet eine demonstrativ stolze Körperhaltung und bleibt zugleich nahe am hebräischen Bild.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: mit den Augen vielsagende Blicke werfen
  rationale: Die seltene Wendung beschreibt auffällige Augenbewegungen. „Vielsagend“ deutet deren möglichen koketten Charakter an, ohne ihn eindeutig festzulegen.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: mit kleinen Schritten dahintrippeln
  rationale: טפף legt kurze, gezierte Schritte nahe; die deutsche Formulierung gibt sowohl die Bewegung als auch ihre affektierte Art natürlich wieder.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: mit den Füßen ein Klirren erzeugen
  rationale: Das Verb bezeichnet wahrscheinlich ein durch Fußschmuck hervorgerufenes Geräusch. Da Fuß- oder Knöchelringe im Vers nicht ausdrücklich genannt werden, bleibt das Mittel im Haupttext offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch den traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrten prophetischen Bildern. Die Wiederholung von „weil“ gliedert die lange Begründung verständlich. Das abschließende Komma zeigt, dass der Satz und die angekündigte Folge in Vers 17 weitergehen.
