base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: de
  text: Denn Jerusalem strauchelt, und Juda fällt, denn ihre Zunge und ihre Taten richten sich gegen Jahwe und trotzen den Augen seiner Herrlichkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Augen seiner Herrlichkeit trotzen« beziehungsweise »gegen sie aufbegehren«. Die ungewöhnliche Wendung schildert ihre offene Auflehnung angesichts von Jahwes herrlicher Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor angekündigte Gerichtsfolge ein und gibt den erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: כָשְׁלָה
  choice: ist ins Straucheln geraten
  rationale: Bewahrt das Bild des Stolperns beziehungsweise Wankens, ohne bereits einen vollständigen Untergang auszudrücken.
- source_word: יְרוּשָׁלִַם וִיהוּדָה נָפָל
  choice: Jerusalem ist ins Straucheln geraten, und Juda ist gefallen
  rationale: Erhält den poetischen Parallelismus zwischen dem Straucheln Jerusalems und dem Fallen Judas.
- source_word: לְשׁוֹנָם
  choice: ihre Zunge
  rationale: Bewahrt das konkrete hebräische Bild; die Zunge steht metonymisch für ihr Reden.
- source_word: וּמַעַלְלֵיהֶם
  choice: und ihre Taten
  rationale: Gibt die Handlungen knapp, verständlich und mit dem moralischen Gewicht des Kontextes wieder.
- source_word: אֶל יְהוָה
  choice: gegen Jahwe gerichtet sind
  rationale: Im feindseligen Zusammenhang bezeichnet אֶל die gegen Jahwe gerichtete Haltung von Rede und Handeln.
- source_word: לַמְרוֹת
  choice: und sie sich … auflehnen
  rationale: Gibt die aktive, trotzige Rebellion idiomatisch wieder und bezieht das Subjekt weiterhin auf die Bewohner Jerusalems und Judas.
- source_word: עֵנֵי כְבוֹדוֹ
  choice: vor den Augen seiner Herrlichkeit
  rationale: Bewahrt die auffällige, anthropomorphe Bildsprache des Hebräischen und lässt zugleich die Bedeutung seiner herrlichen Gegenwart anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bezug von לַמְרוֹת עֵנֵי כְבוֹדוֹ
  choice: sie lehnen sich vor den Augen seiner Herrlichkeit auf
  alternative: um sich gegen die Augen seiner Herrlichkeit aufzulehnen
  rationale: Die gewählte Fassung versteht die Augen seiner Herrlichkeit als die Sphäre beziehungsweise Gegenwart, vor der die offene Auflehnung geschieht. Sie vermeidet die im Deutschen missverständliche Vorstellung, die Rebellion richte sich speziell gegen Gottes Augen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelstruktur und die konkreten Bilder »Zunge«, »Straucheln« und »Augen seiner Herrlichkeit« bleiben erhalten; syntaktische Ergänzungen dienen der natürlichen deutschen Lesbarkeit.
