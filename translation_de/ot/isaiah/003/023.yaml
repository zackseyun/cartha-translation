    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: Spiegel
  rationale: Das Wort bezeichnet wahrscheinlich glatte, polierte Gegenstände, die als Spiegel dienten. Im Zusammenhang der kostbaren Schmuck- und Kleidungsstücke passt „Spiegel“ am besten; „Tafeln“ bleibt lexikalisch möglich.
- source_word: סְּדִינִים
  choice: Leinengewänder
  rationale: Der Ausdruck bezeichnet Kleidungsstücke aus feinem Leinen, ohne deren genaue Form oder Verwendung sicher festzulegen. „Leinengewänder“ bewahrt diese Offenheit.
- source_word: צְּנִיפוֹת
  choice: Turbane
  rationale: Gemeint sind um den Kopf gewickelte Kleidungsstücke. „Turbane“ ist im Deutschen verständlich und hinreichend genau.
- source_word: רְדִידִים
  choice: Schleier
  rationale: In dieser Aufzählung bezeichnet das Wort wohl leichte, übergeworfene Bedeckungen. „Schleier“ gibt die wahrscheinliche Bedeutung wieder, ohne die möglichen Alternativen zu verschweigen.
