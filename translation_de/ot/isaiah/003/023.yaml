  text: die Spiegel[a], die Leinengewänder, die Turbane und die Schleier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tafeln“. Das hebräische Wort kann allgemein glatte, polierte Gegenstände bezeichnen; in dieser Aufzählung kostbarer Schmuckstücke sind wahrscheinlich Spiegel gemeint.'
