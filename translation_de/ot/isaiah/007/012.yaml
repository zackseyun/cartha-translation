source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָחָ֑ז לֹא אֶשְׁאַ֥ל וְ/לֹֽא אֲנַסֶּ֖ה אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: de
  text: 'Doch Ahas sagte: „Ich werde nicht darum bitten und Jahwe nicht auf die Probe stellen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das Waw mit der Erzählform führt die Handlung fort; im Zusammenhang ist die Antwort jedoch kontrastiv, da Ahas die unmittelbar zuvor erteilte Aufforderung ablehnt. „Doch“ gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: אָחָז
  choice: Ahas
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: לֹא אֶשְׁאַל
  choice: Ich werde nicht darum bitten
  rationale: שׁאל bedeutet „bitten, erfragen, verlangen“. Das ergänzte „darum“ nimmt die im vorherigen Vers angebotene Bitte um ein Zeichen auf, ohne deren Gegenstand im Vers selbst unnötig zu wiederholen.
- source_word: וְלֹא אֲנַסֶּה
  choice: und … nicht auf die Probe stellen
  rationale: נסה im Piel bedeutet „prüfen, erproben, auf die Probe stellen“. Die deutsche Wendung ist hier idiomatisch und vermeidet das missverständliche „versuchen“, das auch als Verlockung zum Bösen verstanden werden könnte.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: אֶת ist die unübersetzte Akkusativpartikel. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich gebrauchten Eigennamen sichtbar zu erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Gottesname; die traditionelle Wiedergabe „der HERR“ wäre ebenfalls verbreitet, würde aber den Eigennamen durch einen Titel ersetzen.
- issue: Bedeutung von אֲנַסֶּה in Bezug auf Gott
  choice: auf die Probe stellen
  alternative: prüfen; versuchen
  rationale: Die Form bezeichnet das Prüfen oder Erproben Gottes. „Auf die Probe stellen“ wahrt den Sinn und vermeidet die mögliche Fehlinterpretation von „versuchen“ als Verführung zum Bösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Rede und der Gegensatz zur göttlichen Aufforderung im vorherigen Vers bleiben erhalten. Es sind keine Fußnoten nötig, da die wesentlichen Bedeutungen natürlich im Haupttext wiedergegeben werden.
