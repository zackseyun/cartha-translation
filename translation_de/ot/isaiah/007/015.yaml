id: ISA.7.15
reference: Isaiah 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֶמְאָ֥ה וּ/דְבַ֖שׁ יֹאכֵ֑ל לְ/דַעְתּ֛/וֹ מָא֥וֹס בָּ/רָ֖ע וּ/בָח֥וֹר בַּ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: de
  text: Er wird Dickmilch und Honig essen, wenn er weiß, das Böse zu verwerfen und das Gute zu wählen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu der Zeit, da er weiß, das Böse zu verwerfen und das Gute zu wählen“. Der hebräische Ausdruck kann den Zeitpunkt beziehungsweise die zeitliche Grenze bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: „Dickmilch“ kann auch mit „Butter“ oder „Rahm“ wiedergegeben werden; gemeint ist allgemein ein Milchprodukt.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: Dickmilch
  rationale: Das Wort bezeichnet allgemein ein Milchprodukt, wahrscheinlich geronnene beziehungsweise eingedickte Milch und nicht zwingend Butter im heutigen Sinn. „Dickmilch“ ist im Zusammenhang mit Honig eine verständliche, sachnahe Wiedergabe.
- source_word: וּדְבַשׁ
  choice: und Honig
  rationale: Dies ist die übliche und kontextuell klare Wiedergabe; die Konjunktion wird beibehalten.
- source_word: יֹאכֵל
  choice: er wird … essen
  rationale: Die Yiqtol-Form wird im prophetischen Zusammenhang zukunftsbezogen wiedergegeben.
- source_word: לְדַעְתּוֹ
  choice: wenn er weiß
  rationale: Die Präposition לְ mit Infinitivus constructus und Suffix wird hier zeitlich verstanden. „Wenn er weiß“ ist natürliches Deutsch und legt nicht unnötig fest, ob ein Zeitpunkt oder eine zeitliche Grenze gemeint ist.
- source_word: מָאוֹס
  choice: zu verwerfen
  rationale: Im Gegensatz zum Erwählen des Guten bezeichnet das Verb die bewusste Zurückweisung des Bösen; „verwerfen“ bewahrt diesen kräftigen Gegensatz, ohne bloßes emotionales Verachten auszudrücken.
- source_word: בָּרָע
  choice: das Böse
  rationale: Der substantivierte Ausdruck mit Artikel wird in seiner bestimmten, allgemeinen Bedeutung wiedergegeben und bildet den Gegenpol zu „das Gute“.
- source_word: וּבָחוֹר
  choice: und … zu wählen
  rationale: „Wählen“ ist die natürliche deutsche Entsprechung und wahrt die Parallelität mit „verwerfen“.
- source_word: בַּטּוֹב
  choice: das Gute
  rationale: Der substantivierte Ausdruck mit Artikel wahrt die formale und inhaltliche Entsprechung zu „das Böse“.
theological_decisions:
- issue: Zeitliche Bedeutung von לְדַעְתּוֹ im Verhältnis zur Nahrung des Kindes und zu seinem moralischen Unterscheidungsvermögen
  choice: Zeitlich mit „wenn er weiß“ wiedergegeben.
  alternative: „bis zu der Zeit, da er weiß“ beziehungsweise „bis er weiß“; möglich wäre formal auch eine Zweckangabe wie „damit er weiß“.
  rationale: Der Zusammenhang legt eine zeitliche Deutung nahe. Die gewählte Fassung vermeidet die zusätzliche theologische Behauptung, die Nahrung bewirke moralisches Unterscheidungsvermögen, und bewahrt zugleich die Unschärfe hinsichtlich des genauen zeitlichen Verhältnisses.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält die prophetische Zukunftsaussage klar; „das Böse“ und „das Gute“ bewahren den markanten moralischen Gegensatz des Hebräischen.
