source:
  edition: WLC
  text: וְ/הָיָ֗ה מֵ/רֹ֛ב עֲשׂ֥וֹת חָלָ֖ב יֹאכַ֣ל חֶמְאָ֑ה כִּֽי חֶמְאָ֤ה וּ/דְבַשׁ֙ יֹאכֵ֔ל כָּל הַ/נּוֹתָ֖ר בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
translation:
  language: de
  text: Und wegen des reichen Milchertrags wird er Dickmilch[a] essen; denn Dickmilch und Honig wird jeder essen, der im Land übrig geblieben ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Butter“. Das hebräische Wort חֶמְאָה kann allgemein ein eingedicktes oder geronnenes Milchprodukt bezeichnen und meint nicht unbedingt moderne Butter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird
  rationale: Die hebräische Zukunftsformel wird im Deutschen natürlich in den Satz integriert; der vorwärtsweisende Sinn bleibt erhalten.
- source_word: מֵרֹב
  choice: wegen der großen Menge
  rationale: מִן mit רֹב bezeichnet hier den Grund beziehungsweise die Ursache der folgenden Handlung.
- source_word: עֲשׂוֹת חָלָב
  choice: Milch, die es gibt
  rationale: Die Konstruktion bezeichnet das Hervorbringen beziehungsweise Vorhandensein eines reichen Milchertrags. Die unpersönliche Formulierung vermeidet es, dem nicht ausdrücklich genannten Einzeltier ein grammatisches Geschlecht zuzuweisen.
- source_word: יֹאכַל חֶמְאָה
  choice: wird er Dickmilch essen
  rationale: חֶמְאָה bezeichnet wahrscheinlich eingedickte oder geronnene Milch und nicht notwendig moderne Butter; „Dickmilch“ ist im Deutschen verständlich und passt zum Ernährungskontext.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet eine erläuternde beziehungsweise begründende Aussage ein.
- source_word: חֶמְאָה וּדְבַשׁ
  choice: Dickmilch und Honig
  rationale: Die bekannte Wortverbindung bleibt erhalten, während חֶמְאָה kontextgerecht als Milchprodukt wiedergegeben wird.
- source_word: כָּל הַנּוֹתָר
  choice: jeder …, der … übrig geblieben ist
  rationale: Das substantivierte Partizip bezeichnet kollektiv alle überlebenden beziehungsweise verbliebenen Personen.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: im Land
  rationale: Natürliches modernes Deutsch; der Sinn des Verbleibens innerhalb des Landes wird im Zusammenhang vollständig ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Begründungsstruktur, ohne im Deutschen unnötig schwerfällig zu wirken. Die Wiederholung von „Dickmilch“ entspricht der Wiederholung von חֶמְאָה im Ausgangstext.
