id: ISA.7.13
reference: Isaiah 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: de
  text: 'Und er sagte: „Hört doch, Haus Davids! Ist es euch zu wenig[a], Menschen zu ermüden, dass ihr auch meinen Gott ermüdet?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist es euch eine Kleinigkeit, Menschen zu ermüden, dass ihr auch meinen Gott ermüdet?“'
    reason: Die rhetorische Wendung הַמְעַט מִכֶּם kann sowohl mit „Ist es euch zu wenig“ als auch mit „Ist es euch eine Kleinigkeit“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen Wayyiqtol führt hier Jesajas Rede ein und bewahrt den hebräischen Erzählfluss.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der Pluralimperativ wird beibehalten; „doch“ gibt die eindringliche, auffordernde Kraft der Partikel נָא in natürlichem modernem Deutsch wieder.
- source_word: בֵּית דָּוִד
  choice: Haus David
  rationale: Die Anrede gilt der davidischen Dynastie beziehungsweise ihrer repräsentativen Gemeinschaft, nicht bloß einem Wohnhaus.
- source_word: הַמְעַט מִכֶּם
  choice: Ist es euch zu wenig
  rationale: Die Formulierung bewahrt die rhetorische Frage und bleibt nahe am hebräischen Idiom; die mögliche Nuance „Ist es euch eine Kleinigkeit“ wird in der Fußnote genannt.
- source_word: הַלְאוֹת … תַלְאוּ
  choice: zu ermüden … ermüdet
  rationale: Die Wiederholung desselben hebräischen Verbs לאה wird auch im Deutschen sichtbar gemacht und trägt die Steigerung von Menschen zu Gott.
- source_word: אֲנָשִׁים
  choice: Menschen
  rationale: אֲנָשִׁים kann kontextuell Menschen beziehungsweise menschliche Personen bezeichnen. „Menschen“ stellt den Gegensatz zu Gott klar dar, ohne den Bezug unnötig auf männliche Personen einzuengen.
- source_word: כִּי
  choice: dass
  rationale: „Dass“ verbindet die gesteigerte Fortsetzung der rhetorischen Frage idiomatisch mit dem ersten Infinitivsatz.
- source_word: גַּם
  choice: auch
  rationale: '„Auch“ bewahrt die additive und steigernde Kraft: Zur Ermüdung von Menschen kommt die Ermüdung Gottes hinzu.'
- source_word: אֶת אֱלֹהָי
  choice: meinen Gott
  rationale: Das ausdrückliche Possessivsuffix der ersten Person wird bewahrt und erhält Jesajas persönliche, prophetische Gegenüberstellung zum Haus David.
theological_decisions:
- issue: Gegenüberstellung von אֲנָשִׁים und Gott
  choice: Menschen
  alternative: Männer
  rationale: Das Substantiv ist formal maskulin plural, kann aber allgemein menschliche Personen bezeichnen. Im Zusammenhang liegt der theologisch-rhetorische Gegensatz zwischen Menschen und Gott im Vordergrund; „Menschen“ gibt ihn im Deutschen am klarsten wieder, ohne eine nur männliche Gruppe zu behaupten.
- issue: Possessivform אֱלֹהָי
  choice: meinen Gott
  alternative: Gott
  rationale: Das Possessivsuffix gehört ausdrücklich zum hebräischen Text und kann Jesajas Haltung gegenüber dem Haus David rhetorisch profilieren; eine Verallgemeinerung zu „Gott“ würde diese Nuance beseitigen.
- issue: Aussage, dass das Haus David Gott ermüdet
  choice: dass ihr auch meinen Gott ermüdet
  alternative: weil ihr auch meinen Gott ermüdet
  rationale: Die gewählte Fassung bewahrt die rhetorische Steigerung, ohne כִּי eindeutig kausal festzulegen. So bleibt die Spannung der Aussage erhalten, dass menschliches Verhalten bildhaft als Ermüdung Gottes bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hört doch“ ist eindringlich, aber nicht altertümlich; „Haus David“ bewahrt die dynastische Anrede. Die Wiederholung von „ermüden“ bildet die auffällige hebräische Wortwiederholung bewusst nach.
