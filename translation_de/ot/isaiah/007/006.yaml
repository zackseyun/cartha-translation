source:
  edition: WLC
  text: נַעֲלֶ֤ה בִֽ/יהוּדָה֙ וּ/נְקִיצֶ֔/נָּה וְ/נַבְקִעֶ֖/נָּה אֵלֵ֑י/נוּ וְ/נַמְלִ֥יךְ מֶ֨לֶךְ֙ בְּ/תוֹכָ֔/הּ אֵ֖ת בֶּן טָֽבְאַֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: de
  text: Lasst uns gegen Juda hinaufziehen, sie in Schrecken versetzen[a], sie für uns aufbrechen[b] und in ihrer Mitte den Sohn Tabeals zum König machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sie mit Grauen erfüllen“, „sie in Unruhe versetzen“ oder „sie bedrängen“. Das hebräische Verb ist schwierig; der Haupttext versteht es als das Hervorrufen von Angst oder Schrecken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „für uns eine Bresche in sie schlagen“ oder „sie für uns spalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: Lasst uns gegen Juda hinaufziehen
  rationale: עלה bezeichnet im militärischen Zusammenhang das Hinaufziehen gegen ein Land oder eine Stadt. „Gegen Juda hinaufziehen“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: וּנְקִיצֶנָּה
  choice: sie in Schrecken versetzen
  rationale: Die schwierige Hifil-Form von קוץ bezeichnet hier wahrscheinlich das Hervorrufen von Furcht, Entsetzen oder Unruhe. Die Formulierung gibt den kausativen Sinn wieder, ohne die lexikalische Unsicherheit zu verdecken.
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: sie für uns aufbrechen
  rationale: בקע bedeutet „spalten, aufbrechen, eine Bresche schlagen“. אֵלֵינוּ bezeichnet hier die Aneignung beziehungsweise den Vorteil der Angreifer; „für uns“ gibt dies knapp wieder.
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: zum König machen
  rationale: Das Hifil von מלך ist kausativ und bedeutet, jemanden als König einzusetzen beziehungsweise zum König zu machen.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Der feminine Suffixbezug auf Juda wird entsprechend der hebräischen Personifikation beibehalten.
- source_word: בֶּן טָבְאַל
  choice: der Sohn Tabeals
  rationale: בֶּן ist hier als gewöhnliche Abstammungsbezeichnung zu verstehen; der Personenname טָבְאַל wird als „Tabeal“ wiedergegeben.
theological_decisions:
- issue: Feminine Personifikation Judas
  choice: Juda wird mit „sie/ihrer“ aufgenommen.
  alternative: Juda mit dem sachlichen Pronomen „es/seiner“ wiedergeben.
  rationale: Die hebräischen Suffixe sind feminin und stellen Juda als personifizierte Größe dar. Obwohl das feminine Pronomen im Deutschen markiert klingt, bewahrt es einen erkennbaren Zug des Ausgangstextes, ohne eine zusätzliche Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier aufeinanderfolgenden Aufforderungen und das militärische Bild des Hinaufziehens und Aufbrechens bleiben erhalten. Die feminine Aufnahme Judas ist bewusst quellennah und daher im Deutschen leicht markiert.
