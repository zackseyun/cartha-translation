  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: de
  text: Und auf all die Hügel, die man mit der Hacke bearbeitet hat,[a] wird man aus Angst vor Dornen und Dornengestrüpp nicht mehr gehen.[b] Sie werden zum Freilassen von Rindern[c] und zum Zertreten durch Kleinvieh.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen eine Verbindung aus einem Wort für „Hacke“ und einem verwandten Verb für die Bodenbearbeitung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wirst du nicht dorthin kommen“. Die zweite Person Singular ist hier wahrscheinlich allgemein gemeint: „wird man nicht dorthin gehen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Hinauslassen von Rindern“; sinngemäß: „als Weide für Rinder“.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Wort kann ein Schaf oder eine Ziege und allgemeiner Kleinvieh bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: Und auf all die Hügel
  rationale: הַר kann Berg oder Hügel bedeuten. Der landwirtschaftliche Zusammenhang mit Hacke und Weidevieh spricht hier für „Hügel“. Die Präposition „auf“ wird im Deutschen passend zum folgenden „gehen“ vorgezogen.
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: die mit der Hacke bearbeitet wurden
  rationale: מַעְדֵּר bezeichnet eine Hacke bzw. ein ähnliches Bodenwerkzeug; die Verbform beschreibt das Bearbeiten des Bodens. Die deutsche Formulierung ist natürlich und lässt den früheren Kultivierungszustand im Gegensatz zur angekündigten Verwilderung erkennen.
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: wird man … nicht mehr gehen
  rationale: Die zweite Person Singular kann hier allgemein gebraucht sein. Das unpersönliche „man“ gibt diesen generischen Sinn im modernen Deutschen natürlich wieder. „Nicht mehr“ verdeutlicht den durch das Gericht eintretenden Gegensatz zur bisherigen Nutzung.
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: aus Angst vor Dornen und Disteln
  rationale: יִרְאַת gibt den Grund des Meidens an. שָׁמִיר וָשַׁיִת ist eine feste Bezeichnung für lästigen, dornigen Wildwuchs; „Dornen und Disteln“ ist verständlich und bewahrt das Verwüstungsbild.
- source_word: וְהָיָה
  choice: Sie werden
  rationale: Die hebräische Verbform ist Singular und kann das Gelände kollektiv aufnehmen. Im Deutschen wird der pluralische Bezug auf „all die Hügel“ natürlich mit „sie“ fortgeführt.
- source_word: לְמִשְׁלַח שׁוֹר
  choice: zu einem Ort, an dem man Rinder frei weiden lässt
  rationale: מִשְׁלַח bezeichnet das Hinaus- oder Freilassen. Die Wiedergabe hält dieses konkrete Bild fest und macht zugleich verständlich, dass das verwilderte Gelände nun der Viehweide dient.
- source_word: וּלְמִרְמַס שֶׂה
  choice: den das Kleinvieh zertritt
  rationale: מִרְמַס bezeichnet Zertreten oder Niedertrampeln. שֶׂה kann Schaf oder Ziege beziehungsweise allgemein ein Tier des Kleinviehs meinen; „Kleinvieh“ bewahrt hier den weiteren Bedeutungsumfang.
theological_decisions: []
