  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה לֹ֥א תָק֖וּם וְ/לֹ֥א תִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr: Es wird keinen Bestand haben[a], und es wird nicht geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Es wird nicht bestehen, und es wird nicht sein.“ Gemeint ist, dass der Plan keinen Bestand haben und nicht zur Ausführung kommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel gibt die deiktische Einleitung כֹּה und die bleibende Geltung des Gotteswortes natürlich und würdig wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe bewahrt beide Bestandteile des zusammengesetzten Gottestitels und gibt den Eigennamen יהוה als „Jahwe“ wieder, ohne ihn mit אֲדֹנָי zu verschmelzen.
- source_word: לֹא תָקוּם
  choice: Es wird keinen Bestand haben
  rationale: 'קום bezeichnet hier im Kontext den feindlichen Plan: Er wird sich nicht behaupten oder verwirklichen. „Keinen Bestand haben“ erhält das Bild des Bestehens und ist im Deutschen idiomatisch.'
- source_word: וְלֹא תִהְיֶה
  choice: und es wird nicht geschehen
  rationale: היה bedeutet wörtlich „sein/werden“, bezeichnet hier aber das Eintreten des zuvor genannten Vorhabens. „Geschehen“ gibt diesen kontextuellen Sinn knapp wieder.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und macht beide im Deutschen erkennbar, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bezug der beiden verneinten Aussagen
  choice: Das feindliche Vorhaben wird weder Bestand haben noch eintreten.
  alternative: 'Eine allgemein gehaltene wörtliche Wiedergabe: „Es wird nicht bestehen und nicht sein.“'
  rationale: Der unmittelbare Zusammenhang bezieht die femininen Verbformen auf den zuvor genannten Plan. Die Übersetzung macht dessen Scheitern verständlich, ohne einen zusätzlichen theologischen Grund einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel „So spricht“ bleibt erhalten; altertümliche Modalformen werden vermieden. Die Satzparallelität und die kategorische Verneinung des Hebräischen bleiben deutlich.
