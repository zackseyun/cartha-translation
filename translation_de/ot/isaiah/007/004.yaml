source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵ֠לָי/ו הִשָּׁמֵ֨ר וְ/הַשְׁקֵ֜ט אַל תִּירָ֗א וּ/לְבָבְ/ךָ֙ אַל יֵרַ֔ךְ מִ/שְּׁנֵ֨י זַנְב֧וֹת הָ/אוּדִ֛ים הָ/עֲשֵׁנִ֖ים הָ/אֵ֑לֶּה בָּ/חֳרִי אַ֛ף רְצִ֥ין וַ/אֲרָ֖ם וּ/בֶן רְמַלְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: de
  text: 'und sag zu ihm: »Sei auf der Hut und bewahre Ruhe! Fürchte dich nicht, und lass dein Herz nicht verzagen wegen dieser beiden qualmenden Stummel dieser Brandscheite, wegen des glühenden Zorns Rezins, Arams und des Sohnes Remaljas.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Sei auf der Hut
  rationale: Der Nifal-Imperativ fordert hier zu Wachsamkeit und Besonnenheit auf, nicht zum Bewachen eines bestimmten Gegenstands. Die Wendung ist im modernen Deutschen klar und bewahrt den Aufforderungscharakter.
- source_word: וְהַשְׁקֵט
  choice: und bewahre Ruhe
  rationale: שׁקט bezeichnet Ruhe beziehungsweise Ungestörtheit. Im Zusammenhang politischer Bedrohung geht es um ruhiges, unbeirrtes Verhalten und nicht lediglich um Schweigen.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die geläufige und würdige deutsche Wiedergabe erhält die knappe Form des hebräischen Verbots.
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: und lass dein Herz nicht verzagen
  rationale: Wörtlich soll das Herz nicht weich oder schwach werden. »Verzagen« gibt den Verlust von Mut wieder und erhält zugleich das Herzbild.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים הָאֵלֶּה
  choice: wegen dieser beiden qualmenden Stummel von Brandscheiten
  rationale: זנבות bedeutet wörtlich »Schwänze«, bezeichnet im Bild aber die übrig gebliebenen Enden. »Stummel« bewahrt die verächtliche Verkleinerung der Gegner; »qualmend« und »Brandscheite« erhalten das Feuerbild.
- source_word: בָּחֳרִי אַף
  choice: wegen des glühenden Zorns
  rationale: Die Verbindung von חֳרִי und אַף bezeichnet heftigen, entbrannten Zorn. »Glühend« führt außerdem das vorangehende Feuerbild fort.
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: Rezins und Arams und des Sohnes Remaljas
  rationale: Die indirekte Bezeichnung Pekachs als »Sohn Remaljas« wird beibehalten, da sie zur abwertenden Rhetorik des hebräischen Textes gehört und nicht durch seinen Namen erklärt werden sollte.
theological_decisions:
- issue: Ob das Bild der nahezu erloschenen feindlichen Mächte im Haupttext erhalten bleibt
  choice: Das Bild der »qualmenden Stummel von Brandscheiten« bleibt erhalten.
  alternative: Dynamische Auflösung als »zwei Bedrohungen, die bald verschwinden«.
  rationale: 'Die prophetische Aussagekraft liegt in Gottes ironischer Einschätzung: Die gefürchteten Herrscher wirken noch gefährlich, sind aber bereits fast ausgebrannt. Eine Auflösung des Bildes würde diese Spannung abschwächen.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die kurzen Aufforderungen bleiben eindringlich; das Feuerbild und die abwertende Umschreibung »Sohn Remaljas« werden ohne konfessionelle Deutung bewahrt.
