  text: יַ֗עַן כִּֽי יָעַ֥ץ עָלֶ֛י/ךָ אֲרָ֖ם רָעָ֑ה אֶפְרַ֥יִם וּ/בֶן רְמַלְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/005.yaml
  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: de
  text: 'Weil Aram zusammen mit Ephraim und dem Sohn Remaljas Böses gegen dich geplant hat, mit den Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Gibt die kausale Einleitung knapp und natürlich wieder; der Satz setzt den Zusammenhang im folgenden Vers fort.
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: Böses gegen dich geplant hat
  rationale: Bewahrt die Bedeutung von יעץ als planen bzw. einen Plan fassen und רעה als Unheil oder Böses; „gegen dich“ entspricht der feindlichen Ausrichtung von עליך.
- source_word: אֲרָם ... אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: Aram ... zusammen mit Ephraim und dem Sohn Remaljas
  rationale: Die singularische Verbform stellt Aram grammatisch in den Vordergrund; Ephraim und der Sohn Remaljas werden als Mitbeteiligte angeschlossen.
- source_word: לֵאמֹר
  choice: 'und gesagt hat:'
  rationale: Leitet den Inhalt des Plans ein. Im Deutschen verbindet „und gesagt hat“ die folgende direkte Rede natürlich mit dem vorangehenden Perfekt.
theological_decisions:
- issue: Grammatische Zuordnung des Planens
  choice: Aram als grammatisches Subjekt, Ephraim und der Sohn Remaljas als Mitbeteiligte
  alternative: 'Alle drei als gleichrangiges zusammengesetztes Subjekt: „Aram, Ephraim und der Sohn Remaljas haben ... geplant“'
  rationale: Das hebräische Verb יָעַץ steht im Singular und folgt unmittelbar auf Aram; die Übersetzung erhält diese syntaktische Gewichtung, ohne die Beteiligung Ephraims und des Sohnes Remaljas auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aram“ und „Ephraim“ bleiben als historische Bezeichnungen erhalten; „Remalja“ folgt der geläufigen deutschen Namensform. Der Doppelpunkt hält den Vers bewusst offen zur anschließenden Rede.
