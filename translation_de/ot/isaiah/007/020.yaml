  text: בַּ/יּ֣וֹם הַ/ה֡וּא יְגַלַּ֣ח אֲדֹנָ/י֩ בְּ/תַ֨עַר הַ/שְּׂכִירָ֜ה בְּ/עֶבְרֵ֤י נָהָר֙ בְּ/מֶ֣לֶךְ אַשּׁ֔וּר אֶת הָ/רֹ֖אשׁ וְ/שַׂ֣עַר הָ/רַגְלָ֑יִם וְ/גַ֥ם אֶת הַ/זָּקָ֖ן תִּסְפֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: de
  text: An jenem Tag wird der Herr mit einem gemieteten Rasiermesser von jenseits des Stromes – mit dem König von Assyrien – den Kopf und das Haar an den Füßen[a] rasieren und auch den Bart entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Haar an den Beinen“. „Füße“ kann hier auch eine verhüllende Bezeichnung für den Genitalbereich sein und damit die völlige Demütigung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  choice: wird … scheren
  rationale: Das Piel von גלח bezeichnet das Abscheren beziehungsweise Rasieren von Haar. „Scheren“ lässt sich im Deutschen natürlich auf Kopfhaar, Körperhaar und Bart beziehen.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der Text verwendet den göttlichen Titel אֲדֹנָי, nicht das Tetragramm; „der Herr“ ist die sachgemäße deutsche Wiedergabe.
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: mit einem gemieteten Rasiermesser
  rationale: תער bedeutet „Rasiermesser“, שׂכירה „gemietet“. Die Formulierung bewahrt das Bild Assyriens als eines vom Herrn eingesetzten Werkzeugs.
- source_word: בְּעֶבְרֵי נָהָר
  choice: von jenseits des Stromes
  rationale: Die Wendung bezeichnet das Gebiet jenseits des Stromes, hier des Euphrat. „Von jenseits“ gibt im Zusammenhang die Herkunft des Rasiermessers knapp wieder.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: mit dem König von Assyrien
  rationale: 'Die Präposition kann instrumental beziehungsweise erläuternd verstanden werden: Der König von Assyrien ist das „gemietete Rasiermesser“. Die Gedankenstriche verdeutlichen die Apposition, ohne sie stärker als der Ausgangstext festzulegen.'
- source_word: שַׂעַר הָרַגְלָיִם
  choice: das Haar an den Füßen
  rationale: Die Wiedergabe bleibt nahe am Wortlaut. רגלים kann Beine beziehungsweise Füße meinen und möglicherweise euphemistisch den Genitalbereich bezeichnen; diese Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: וְגַם אֶת הַזָּקָן
  choice: auch den Bart
  rationale: גם setzt die Aufzählung steigernd fort. „Auch“ erhält diesen Nachdruck in natürlichem Deutsch.
- source_word: תִּסְפֶּה
  choice: wird es wegnehmen
  rationale: Das feminine Verb bezieht sich auf das Rasiermesser und bedeutet hier beseitigen beziehungsweise vollständig entfernen. Das Pronomen „es“ bewahrt diesen Subjektwechsel.
theological_decisions:
- issue: Deutung des Rasierbildes
  choice: Der Herr gebraucht den König von Assyrien als Werkzeug eines umfassenden, demütigenden Gerichts.
  alternative: Das Bild beschreibt lediglich eine militärische Niederlage, ohne den Aspekt der Demütigung hervorzuheben.
  rationale: Das Abscheren von Kopfhaar, Haar am Unterkörper und Bart bezeichnet eine weitreichende Entblößung und Entehrung; zugleich identifiziert die Syntax Assyrien als das vom Herrn geführte Rasiermesser.
- issue: Identität des gemieteten Rasiermessers
  choice: Der König von Assyrien erläutert bildhaft das Rasiermesser.
  alternative: Rasiermesser und König von Assyrien könnten als zwei lediglich instrumental nebeneinanderstehende Angaben gelesen werden.
  rationale: Die appositionelle Deutung passt am besten zur Abfolge der mit ב eingeleiteten Ausdrücke; Gedankenstriche erhalten jedoch die ungewöhnliche Syntax und vermeiden eine übermäßig explizite Gleichsetzung.
translation_notes:
  register: Moderne, würdige Standardsprache. Das drastische Rasierbild und die syntaktische Spannung des Hebräischen bleiben erhalten. „Strom“ wird als traditionelle geografische Bezeichnung großgeschrieben; die Fußnote erklärt die echte lexikalische und euphemistische Mehrdeutigkeit.
