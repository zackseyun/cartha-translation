base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
translation:
  language: de
  text: 'Sie alle werden kommen und sich niederlassen[a]: in den Schluchten der Steilhänge[b], in den Felsspalten, in allen Dornbüschen und an allen Wasserstellen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Ruhe kommen“ beziehungsweise „sich setzen“. Das Verb kann das Ruhen oder Landen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck ist schwierig und wird auch mit „verlassenen Tälern“ oder „Schluchten der Felswände“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort ist selten und in seiner Bedeutung unsicher; möglich sind auch „Weideplätze“ oder „Wiesen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְנָחוּ כֻלָּם
  choice: Sie alle werden kommen und sich niederlassen
  rationale: Die Verbfolge beschreibt im prophetischen Zusammenhang ein zukünftiges Geschehen. נוח bezeichnet hier das Zur-Ruhe-Kommen beziehungsweise Sich-Niederlassen der zuvor genannten Schwärme; „sich niederlassen“ gibt das Bild im Deutschen natürlich wieder.
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: in den Schluchten der Steilhänge
  rationale: נחלים bezeichnet Täler, Bachbetten oder Schluchten. Das seltene und schwierige הבתות scheint hier schroffes oder abschüssiges Gelände näher zu bestimmen; die Übersetzung bleibt deshalb bewusst konkret, während die Unsicherheit in einer Fußnote offengelegt wird.
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: in den Felsspalten
  rationale: נקיקים sind Spalten oder Klüfte, סלעים Felsen beziehungsweise Felsgestein. Das deutsche Kompositum ist prägnant und bildhaft.
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: in allen Dornbüschen
  rationale: Das Substantiv bezeichnet dorniges Gewächs. „Dornbüsche“ ist verständlich und passt zu dem Bild von Schwärmen, die sich an den verschiedensten Orten niederlassen.
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: an allen Wasserstellen
  rationale: Der seltene Ausdruck ist unsicher. „Wasserstellen“ folgt einer verbreiteten lexikalischen Deutung und ergibt im örtlichen Zusammenhang einen natürlichen Sinn; mögliche Alternativen werden in der Fußnote bewahrt.
