  text: וַ/יּ֣וֹסֶף יְהוָ֔ה דַּבֵּ֥ר אֶל אָחָ֖ז לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/010.yaml
  text: And Yahweh continued to speak to Ahaz[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach weiter[a] zu Ahas:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahwe fügte hinzu, zu Ahas zu sprechen“; die hebräische Wendung kann bedeuten, dass Jahwe weitersprach oder erneut zu Ahas sprach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: sprach weiter
  rationale: Die Verbindung von יָסַף mit einem Infinitiv bezeichnet idiomatisch die Fortsetzung oder Wiederholung einer Handlung. „Sprach weiter“ gibt die Wendung im Deutschen natürlich wieder, ohne festzulegen, ob die Rede unmittelbar fortgesetzt oder erneut aufgenommen wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in seiner im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דַּבֵּר
  choice: sprach
  rationale: Der Infinitiv bildet zusammen mit וַיּוֹסֶף die idiomatische Aussage „sprach weiter“.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Ahas“ ist die natürliche deutsche Wiedergabe.
- source_word: אָחָז
  choice: Ahas
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitung wird im Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben, da der folgende Vers den Wortlaut der Rede enthält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname יהוה. „Jahwe“ bewahrt ihn als Gottesnamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die knappe Form mit Doppelpunkt vermeidet die im Deutschen schwerfällige Verdoppelung „sprach … und sagte“ und führt unmittelbar zur folgenden direkten Rede.
