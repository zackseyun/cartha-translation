  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא יְחַיֶּה אִ֛ישׁ עֶגְלַ֥ת בָּקָ֖ר וּ/שְׁתֵּי צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/021.yaml
  text: And in that day a man will keep alive a young cow and two sheep[a][b].
translation:
  language: de
  text: An jenem Tag wird ein Mann eine junge Kuh[a] und zwei Stück Kleinvieh[b] am Leben erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Färse«. Der hebräische Ausdruck bezeichnet ein junges weibliches Rind.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort צֹאן ist eine Sammelbezeichnung für Kleinvieh und kann Schafe wie auch Ziegen einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird
  rationale: Die prophetische Wendung וְהָיָה kündigt ein zukünftiges Geschehen an. Zusammen mit »An jenem Tag« gibt das deutsche Futur ihre Funktion natürlich wieder, ohne ein schwerfälliges »Und es wird geschehen« einzufügen.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitangabe wird im modernen Standarddeutsch idiomatisch mit »An jenem Tag« wiedergegeben.
- source_word: יְחַיֶּה
  choice: am Leben erhalten
  rationale: Das Piel von חיה bezeichnet hier, Tiere lebend zu erhalten beziehungsweise für ihren Fortbestand zu sorgen. »Am Leben erhalten« bewahrt den konkreten Sinn genauer als das möglicherweise auf Aufzucht oder Zucht zielende »aufziehen«.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das maskuline Singularwort bezeichnet hier einen beispielhaft genannten einzelnen Mann; die grammatische und konkrete Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: עֶגְלַת בָּקָר
  choice: eine junge Kuh
  rationale: Die Konstruktverbindung bezeichnet ein junges weibliches Rind. »Junge Kuh« ist allgemein verständlich; das fachsprachlich präzisere »Färse« wird als Alternative in der Fußnote genannt.
- source_word: וּשְׁתֵּי צֹאן
  choice: und zwei Stück Kleinvieh
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. »Zwei Stück Kleinvieh« wahrt diese inhaltliche Breite trotz des im Deutschen nötigen Zählworts.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachklang. Die Formulierung bleibt nah am Hebräischen, vermeidet jedoch unnötig hölzerne Syntax. »Stück Kleinvieh« ist leicht fachsprachlich, erhält aber die echte lexikalische Unbestimmtheit zwischen Schafen und Ziegen.
