  terminology: „Jahwe“, „Jesaja“, „Ahas“ und „Schear-Jaschub“ sind angemessene deutsche Formen. Die Namensfußnote wahrt die semantische Spannweite von שוב. „Wäscher“ gibt כּוֹבֵס verständlich wieder; „Walker“ bleibt als traditionelle Alternative in der Fußnote erhalten.
