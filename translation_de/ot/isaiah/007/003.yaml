  source_fidelity: 'Die Wiedergabe der Namen, der Wasseranlage und des Feldes entspricht dem hebräischen Text im Wesentlichen. Die zwei im Entwurf gebildeten deutschen Imperativsätze sind jedoch nicht quellentreu: צֵא נָא ist der einzige Imperativ; die anschließenden Ortsangaben bestimmen dessen Ziel. Die Revision ordnet sie daher wieder einem einzigen Aufforderungssatz zu.'
