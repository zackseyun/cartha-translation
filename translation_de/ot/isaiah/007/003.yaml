  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶֽל יְשַׁעְיָהוּ֒ צֵא נָא֙ לִ/קְרַ֣את אָחָ֔ז אַתָּ֕ה וּ/שְׁאָ֖ר יָשׁ֣וּב בְּנֶ֑/ךָ אֶל קְצֵ֗ה תְּעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה אֶל מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Jesaja: »Geh nun hinaus, um Ahas zu treffen, zusammen mit deinem Sohn Schear-Jaschub[a], zum Ende der Wasserleitung des oberen Teichs, an der Straße zum Feld des Wäschers[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Schear-Jaschub bedeutet: »Ein Rest kehrt zurück«; auch »Ein Rest kehrt um« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »Feld des Walkers«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: צֵא נָא
  choice: Geh jetzt hinaus
  rationale: Der Imperativ צֵא wird direkt wiedergegeben; נָא verleiht der Aufforderung hier Nachdruck beziehungsweise Dringlichkeit, was natürlich mit »jetzt« ausgedrückt wird.
- source_word: לִקְרַאת
  choice: Ahas entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen mit dem Ziel, Ahas zu begegnen. »Ahas entgegen« ist im Deutschen knapp und idiomatisch.
- source_word: שְׁאָר יָשׁוּב
  choice: Schear-Jaschub
  rationale: Der Personenname wird nach deutscher Konvention umgeschrieben. Seine prophetisch bedeutsame Bedeutung wird in einer Fußnote angegeben.
- source_word: קְצֵה תְּעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: zum Ende der Wasserleitung des oberen Teichs
  rationale: תְּעָלָה bezeichnet hier einen künstlichen Wasserkanal beziehungsweise eine Leitung; »Wasserleitung« macht den städtischen wasserbaulichen Zusammenhang verständlich. בְּרֵכָה wird als »Teich« wiedergegeben, ohne die mögliche Funktion als Reservoir auszuschließen.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: an der Straße zum Wäscherfeld
  rationale: מְסִלָּה bezeichnet einen gebauten oder erhöhten Weg; im Kontext ist »Straße« natürlich. כּוֹבֵס ist ein berufsmäßiger Wäscher beziehungsweise Textilreiniger; »Wäscherfeld« ist verständlicher als das traditionelle »Walkerfeld«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« gibt ihn in geläufiger deutscher Umschrift wieder und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung des Namens שְׁאָר יָשׁוּב
  choice: Ein Rest kehrt zurück
  alternative: Ein Rest wird umkehren; Ein Rest bekehrt sich
  rationale: Die Namensform kann Rückkehr und, je nach Zusammenhang, auch Umkehr anklingen lassen. Die Fußnote gibt die Grundbedeutung wieder, ohne hier festzulegen, ob eine räumliche Rückkehr oder innere Umkehr gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsangabe wurde in zwei kurze Sätze gegliedert, damit der lange hebräische Zielausdruck verständlich bleibt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
