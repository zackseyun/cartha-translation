id: ISA.7.18
reference: Isaiah 7:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: de
  text: An jenem Tag wird Jahwe nach der Fliege pfeifen[a], die am äußersten Ende der Wasserläufe Ägyptens[b] ist, und nach der Biene, die im Land Assyrien ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zischen“. Das hebräische Verb bezeichnet einen scharfen Laut, mit dem man jemanden oder etwas herbeiruft oder ein Zeichen gibt.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck kann Nilarme, Kanäle oder andere Wasserläufe in Ägypten bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die übliche prophetische Zeitformel wird in natürlichem, würdevollem Deutsch wiedergegeben; die einleitende hebräische Konstruktion וְהָיָה wird durch den folgenden Futursatz mitgetragen.
- source_word: יִשְׁרֹק
  choice: wird ... pfeifen
  rationale: Das Verb bezeichnet einen scharfen Laut, mit dem jemand oder etwas herbeigerufen beziehungsweise herbeigelockt wird. „Nach ... pfeifen“ bringt diese Funktion im Deutschen idiomatisch zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַזְּבוּב
  choice: nach der Fliege
  rationale: Der bildhafte kollektive Singular bleibt erhalten und entspricht der parallelen „Biene“.
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: die am äußersten Ende der Nilkanäle Ägyptens ist
  rationale: קָצֶה bezeichnet das äußerste Ende beziehungsweise den entlegensten Bereich. יְאֹרִים meint im ägyptischen Zusammenhang die Nilarme oder vom Nil gespeisten Kanäle; „Nilkanäle“ ist präzise, ohne die konkrete Gewässerart endgültig festzulegen.
- source_word: וְלַדְּבוֹרָה
  choice: und nach der Biene
  rationale: Der Singular und die Parallelität zum Bild der Fliege werden bewahrt.
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: die im Land Assyrien ist
  rationale: Die konkrete territoriale Wendung אֶרֶץ אַשּׁוּר wird bewahrt und zugleich natürlich deutsch formuliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname wahrt die Funktion des Tetragramms im Ausgangstext, statt es durch einen Titel zu ersetzen.
- issue: Deutung der Fliegen- und Bienenbilder
  choice: Die Bilder bleiben ohne ausdrückliche Identifizierung stehen.
  alternative: Fliege und Biene in der Übersetzung ausdrücklich als Ägypten und Assyrien beziehungsweise deren Heere deuten.
  rationale: Der Kontext legt politische und militärische Mächte nahe, doch der hebräische Vers selbst nennt bildhaft Fliege und Biene. Diese Spannung wird nicht durch eine erklärende Einfügung aufgelöst.
translation_notes:
  register: Modernes Standarddeutsch mit prophetisch-würdevollem Ton. Die anschaulichen Singularformen „Fliege“ und „Biene“ sowie die wiederholte Relativsatzstruktur des Hebräischen bleiben erhalten; unnötige Archaismen werden vermieden.
