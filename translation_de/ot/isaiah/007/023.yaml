  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֣ה כָל מָק֗וֹם אֲשֶׁ֧ר יִֽהְיֶה שָּׁ֛ם אֶ֥לֶף גֶּ֖פֶן בְּ/אֶ֣לֶף כָּ֑סֶף לַ/שָּׁמִ֥יר וְ/לַ/שַּׁ֖יִת יִֽהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: de
  text: Und an jenem Tag wird jeder Ort, an dem tausend Weinstöcke tausend Silberstücke wert waren,[a] zu Dornen und Disteln werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »an dem tausend Weinstöcke tausend Silberstücke wert sein werden«. Die hebräische Verbform kann so wiedergegeben werden; der Zusammenhang spricht jedoch eher für den Gegensatz zwischen dem früher wertvollen Weinland und seiner künftigen Verwilderung. Eine genaue Währungseinheit wird im Hebräischen nicht genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה ... יִהְיֶה
  choice: Und ... wird ... werden
  rationale: Die Rahmenformel und das abschließende Prädikat bezeichnen den künftigen Zustand; die deutsche Satzgestaltung verbindet beides natürlich, ohne die Wiederholung des hebräischen היה nachzuahmen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Geläufige, würdige Wiedergabe der prophetischen Zeitformel.
- source_word: כָל מָקוֹם
  choice: jeder Ort
  rationale: Bewahrt die distributive Aussage des Hebräischen knapp und unmittelbar.
- source_word: אֲשֶׁר יִהְיֶה שָׁם
  choice: an dem ... wert waren
  rationale: Der Kontext stellt den früheren Wert des Weinlands seiner künftigen Verwilderung gegenüber. Das hebräische Imperfekt kann jedoch auch zukunftsbezogen verstanden werden; diese Möglichkeit wird in der Fußnote erhalten.
- source_word: אֶלֶף גֶּפֶן
  choice: tausend Weinstöcke
  rationale: גֶּפֶן bezeichnet den Weinstock beziehungsweise die Weinrebe; »Weinstöcke« ist im Deutschen in diesem landwirtschaftlichen Zusammenhang eindeutig und natürlich.
- source_word: בְּאֶלֶף כָּסֶף
  choice: tausend Silberstücke wert
  rationale: Die Präposition bezeichnet hier die Bewertung. Da keine konkrete Währungseinheit genannt ist, vermeidet »Silberstücke« die nicht ausdrücklich belegte Ergänzung »Schekel«.
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: zu Dornen und Disteln
  rationale: Die feste Wortpaarung bezeichnet dornigen Wildwuchs; die genaue botanische Zuordnung bleibt unsicher. »Dornen und Disteln« ist verständlich und bewahrt das Verwüstungsbild.
