id: ISA.7.14
reference: Isaiah 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: de
  text: 'Darum wird der Herr selbst euch ein Zeichen geben: Seht, die junge Frau[a] ist schwanger und bringt einen Sohn zur Welt[b]. Sie wird ihm den Namen Immanuel[c][d] geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Jungfrau“. Das hebräische Wort עַלְמָה bezeichnet eine junge Frau. Die griechische Septuaginta gibt es mit einem Wort wieder, das gewöhnlich als „Jungfrau“ verstanden wird; Matthäus 1,23 zitiert den Vers in dieser Form.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „wird schwanger werden und einen Sohn gebären“. Das Hebräische beschreibt die Frau wörtlicher als schwanger und gebärend.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder nach einigen alten Übersetzungstraditionen: „Du wirst ihm den Namen geben“; in Matthäus 1,23 heißt es: „Man wird ihm den Namen geben“.'
    reason: textual_variant
  - marker: d
    text: Immanuel bedeutet „Gott mit uns“.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als Folgerung aus Ahas’ Weigerung die Konsequenz ein und klingt im modernen Deutschen natürlich.
- source_word: אֲדֹנָי הוּא
  choice: der Herr selbst
  rationale: אֲדֹנָי wird konventionell mit „der Herr“ wiedergegeben; das selbstständige Pronomen הוּא trägt den Nachdruck „selbst“.
- source_word: לָכֶם
  choice: euch
  rationale: Bewahrt den Plural der hebräischen Anrede, die über Ahas als Einzelnen hinausreicht.
- source_word: אוֹת
  choice: ein Zeichen
  rationale: Gängige Wiedergabe für ein von Gott gegebenes bestätigendes Zeichen oder Vorzeichen.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt die hinweisende und Aufmerksamkeit weckende Funktion in gegenwärtigem, würdigem Deutsch wieder.
- source_word: הָעַלְמָה
  choice: die junge Frau
  rationale: עַלְמָה bezeichnet eine junge Frau im heiratsfähigen Alter, ohne für sich allein Jungfräulichkeit ausdrücklich festzulegen.
- source_word: הָרָה
  choice: ist schwanger
  rationale: Die prädikative Form beschreibt unmittelbar einen Zustand; „ist schwanger“ ist präzise und modern.
- source_word: וְיֹלֶדֶת בֵּן
  choice: und bringt einen Sohn zur Welt
  rationale: Das feminine Partizip wird verbal und idiomatisch wiedergegeben, ohne es gegen die hebräische Form in ein schlichtes Futur umzudeuten.
- source_word: וְקָרָאת שְׁמוֹ עִמָּנוּ אֵל
  choice: Sie wird ihm den Namen Immanuel geben
  rationale: Die masoretische Form wird als feminin Singular verstanden. Die deutsche Namensformel ist natürlicher als das wörtliche „seinen Namen nennen“.
theological_decisions:
- issue: Wiedergabe von הָעַלְמָה in einer christologisch bedeutsamen Weissagung
  choice: die junge Frau
  alternative: die Jungfrau
  rationale: Der hebräische Ausdruck bezeichnet unmittelbar eine junge Frau und legt Jungfräulichkeit lexikalisch nicht eindeutig fest. Die griechische Überlieferung und Matthäus 1,23 werden transparent in der Fußnote genannt, ohne sie in den hebräischen Haupttext einzutragen.
- issue: Zeit- und Aspektbedeutung von הָרָה וְיֹלֶדֶת
  choice: ist schwanger und bringt einen Sohn zur Welt
  alternative: wird schwanger werden und einen Sohn gebären
  rationale: Prädikative Zustandsangabe und Partizip stellen Schwangerschaft und Gebären als gegenwärtig beziehungsweise im Verlauf oder unmittelbar bevorstehend dar. Die echte zeitliche Spannung bleibt gegenüber der traditionellen Zukunftsform erhalten.
- issue: Wer dem Kind den Namen gibt
  choice: Sie wird ihm den Namen … geben
  alternative: Du wirst ihm den Namen … geben / Man wird ihn … nennen
  rationale: Der vorliegende masoretische Text wird als feminine Singularform wiedergegeben. Abweichende alte Überlieferungen und Matthäus 1,23 werden in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ wahrt die hinweisende Kraft von הִנֵּה ohne das altertümliche „Siehe“. Die idiomatische Wendung „ihm den Namen … geben“ vermeidet unnatürliches Übersetzungsdeutsch. Sämtliche Fußnotenmarker stehen im Haupttext.
