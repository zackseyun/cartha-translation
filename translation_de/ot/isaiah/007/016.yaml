source:
  edition: WLC
  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: de
  text: Denn bevor der Junge weiß, das Böse zu verwerfen und das Gute zu wählen, wird das Land, vor dessen beiden Königen dir graut,[a] verlassen sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das du wegen seiner beiden Könige verabscheust«; das hebräische Verb kann Abscheu oder angstvolles Grauen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aufgegeben werden« beziehungsweise »verödet sein«. Die hebräische Passivform kann bezeichnen, dass das Land verlassen oder menschenleer wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die temporale Konjunktion bezeichnet, was noch vor dem Erlangen der beschriebenen Urteilsfähigkeit geschehen wird.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann ein Kind oder einen jungen Mann bezeichnen; hier weist die noch nicht erlangte Fähigkeit moralischer Unterscheidung auf einen Jungen. Das grammatische Geschlecht bleibt erhalten.
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: weiß, ... zu verwerfen und ... zu wählen
  rationale: Die Konstruktion bezeichnet erlangte Einsicht oder Fähigkeit. Die deutsche Infinitivkonstruktion bewahrt die Abfolge des Hebräischen und klingt natürlich.
- source_word: מָאֹס בָּרָע
  choice: das Böse zu verwerfen
  rationale: מאס bezeichnet Ablehnung und kann auch Verachtung ausdrücken. »Verwerfen« bildet hier einen klaren, würdigen Gegensatz zu »wählen«.
- source_word: בַּטּוֹב
  choice: das Gute
  rationale: Die substantivierte Form gibt den bestimmten Artikel wieder und erhält den parallelen moralischen Gegensatz zu »das Böse«.
- source_word: תֵּעָזֵב
  choice: wird ... verlassen sein
  rationale: Der Nifal bezeichnet einen passiven Zustand beziehungsweise Vorgang des Verlassens. Die Formulierung lässt offen, ob Entvölkerung, Aufgabe oder Verwüstung im Vordergrund steht.
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: Im Zusammenhang mit zwei Königen und einer politischen Bedrohung bezeichnet אֲדָמָה das betreffende Land beziehungsweise Gebiet, nicht bloß den Erdboden.
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי
  choice: vor dessen ... dir graut
  rationale: קוץ kann Abscheu und angstvolles Grauen ausdrücken; מִפְּנֵי wird durch »vor« sichtbar wiedergegeben. Die unpersönliche deutsche Wendung bewahrt die Verbindung von Abscheu und Furcht, ohne sie einseitig festzulegen.
- source_word: שְׁנֵי מְלָכֶיהָ
  choice: dessen beiden Königen
  rationale: Das feminine Suffix bezieht sich auf »Land«. Im Deutschen ist der Relativanschluss idiomatisch und erhält die Zugehörigkeit der beiden Könige zum Land.
theological_decisions:
- issue: Identität und Funktion des Jungen
  choice: Neutral als »der Junge« wiedergegeben, ohne seine Identität näher festzulegen.
  alternative: Den Jungen ausdrücklich als zeitgeschichtliches Zeichenkind, Immanuel oder messianische Gestalt bestimmen.
  rationale: Der Vers selbst nennt lediglich הַנַּעַר. Eine nähere Identifizierung würde eine umstrittene Auslegung in den Bibeltext eintragen und die Spannung des Zusammenhangs vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Syntax. »Dir graut« ist etwas gehoben, aber allgemein verständlich und bildet מִפְּנֵי sowie die Bedeutungsbreite von קוץ prägnant ab. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
