  text: שְׁאַל לְ/ךָ֣ א֔וֹת מֵ/עִ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ הַעְמֵ֣ק שְׁאָ֔לָה א֖וֹ הַגְבֵּ֥הַּ לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: de
  text: Erbitte dir von Jahwe, deinem Gott, ein Zeichen, ob tief unten oder hoch oben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wortgruppe für „tief unten“ (הַעְמֵק שְׁאָלָה) ist syntaktisch schwierig. Die abschließenden Ausdrücke lauten wörtlich etwa „mach tief … oder mach hoch nach oben“. Traditionell wird die Gegenüberstellung als äußerste Tiefe (bis zum Scheol) oder äußerste Höhe (bis zum Himmel) verstanden; „Scheol“ und „Himmel“ stehen jedoch nicht ausdrücklich im hebräischen Wortlaut.
    reason: Die Anmerkung dokumentiert die schwierige hebräische Konstruktion sowie die traditionelle Deutung, ohne diese interpretierenden Ergänzungen in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: Erbitte dir
  rationale: Der Imperativ שְׁאַל fordert Ahas unmittelbar auf, ein Zeichen zu erbitten; לְךָ verleiht der Aufforderung persönlichen Nachdruck. „Erbitte dir“ gibt beides knapp und natürlich wieder.
- source_word: אוֹת
  choice: ein Zeichen
  rationale: אוֹת bezeichnet hier ein von Gott gewährtes, bestätigendes Zeichen.
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: von Jahwe, deinem Gott
  rationale: מֵעִם bezeichnet die Herkunft des Zeichens. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben; אֱלֹהֶיךָ bedeutet „deinem Gott“.
- source_word: הַעְמֵק שְׁאָלָה
  choice: sei es tief unten
  rationale: Die Wendung erlaubt dem erbetenen Zeichen eine äußerste Tiefe. Die masoretische Vokalisierung von שְׁאָלָה kann als erneuter Imperativ „erbitte!“ verstanden werden; die verbreitete Deutung „bis in den Scheol“ beruht auf einer anders verstandenen beziehungsweise vorausgesetzten Form. Die Übersetzung vermeidet es, diese textliche Spannung im Haupttext einseitig aufzulösen.
- source_word: אוֹ הַגְבֵּהַּ לְמָעְלָה
  choice: oder hoch oben
  rationale: Die beiden Höhenausdrücke verstärken einander. Zusammen mit „tief unten“ entsteht eine natürliche deutsche Gegenüberstellung der äußersten Bereiche.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der Tiefen- und Höhenangabe
  choice: sei es tief unten oder hoch oben
  alternative: mach es tief bis in den Scheol oder hoch bis zum Himmel
  rationale: Der Text stellt dem Bittenden die ganze Spannweite von unten bis oben offen. Da der WLC שְׁאָלָה als Form von „bitten/fragen“ vokalisiert und „Himmel“ nicht ausdrücklich nennt, wahrt die Hauptübersetzung die Bildspanne, ohne Scheol und Himmel in den Wortlaut einzutragen; die traditionelle Deutung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Gedankenstrich markiert die erläuternde Spannweite des angebotenen Zeichens. „Tief unten … hoch oben“ klingt idiomatisch und vermeidet interpretierende Ergänzungen im Haupttext.
