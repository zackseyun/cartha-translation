base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: de
  text: Denn das Haupt von Aram ist Damaskus, und das Haupt von Damaskus ist Rezin. Und innerhalb von fünfundsechzig Jahren wird Ephraim zerschlagen werden, sodass es kein Volk mehr ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… wird Ephraim zerschlagen werden, sodass es nicht mehr ein Volk ist.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung der vorausgehenden Zusage ein; „Denn“ bewahrt diesen Zusammenhang in natürlichem Deutsch.
- source_word: רֹאשׁ
  choice: Haupt
  rationale: '„Haupt“ erhält die Metapher und den Parallelismus: Damaskus steht an der Spitze Arams, Rezin an der Spitze von Damaskus. Das deutendere „Hauptstadt“ wäre in der zweiten Aussage unpassend.'
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Name wird beibehalten; „Syrien“ könnte ungewollt moderne geopolitische Vorstellungen hervorrufen.
- source_word: דַּמֶּשֶׂק
  choice: Damaskus
  rationale: Dies ist die geläufige deutsche Namensform.
- source_word: רְצִין
  choice: Rezin
  rationale: Dies ist die geläufige deutsche Umschrift des Personennamens.
- source_word: וּבְעוֹד
  choice: und innerhalb von
  rationale: Die Wendung bezeichnet den noch verbleibenden Zeitraum bis zum angekündigten Ereignis. „Innerhalb von“ gibt diese zeitliche Bedeutung idiomatisch wieder.
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: fünfundsechzig Jahren
  rationale: Zeitgemäße deutsche Wiedergabe der Zahl und Zeiteinheit.
- source_word: יֵחַת
  choice: wird zerschlagen sein
  rationale: Das Nifal von חתת bezeichnet hier das vernichtende Zerbrechen Ephraims als politisch-ethnischer Einheit. Die resultative Formulierung passt zur zeitlichen Frist.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der ausdrücklich genannte Stammes- und Reichsname bleibt erhalten, statt ihn deutend durch „Nordreich“ oder „Israel“ zu ersetzen.
- source_word: מֵעָם
  choice: sodass es kein Volk mehr ist
  rationale: Die Präposition מִן mit עַם beschreibt die Trennung vom Status eines Volkes. Die gewählte Fassung gibt den resultativen Sinn in verständlichem Deutsch wieder; die formnähere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Art des angekündigten Endes Ephraims
  choice: Die Aussage wird als Verlust des Status eines Volkes wiedergegeben.
  alternative: Die Formulierung könnte enger als Zerbrechen „weg vom Volksein“ verstanden werden.
  rationale: Der hebräische Ausdruck benennt den Verlust nationaler Existenz, ohne näher festzulegen, durch welche geschichtlichen Vorgänge er eintritt. Die Übersetzung fügt daher keine bestimmte Ereignisdeutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Haupt-Metapher und der strenge Parallelismus des Hebräischen bleiben erhalten; unnötige historische oder konfessionelle Deutungen werden vermieden.
