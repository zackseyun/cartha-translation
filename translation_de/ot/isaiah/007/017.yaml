  text: יָבִ֨יא יְהוָ֜ה עָלֶ֗י/ךָ וְ/עַֽל עַמְּ/ךָ֮ וְ/עַל בֵּ֣ית אָבִי/ךָ֒ יָמִים֙ אֲשֶׁ֣ר לֹא בָ֔אוּ לְ/מִ/יּ֥וֹם סוּר אֶפְרַ֖יִם מֵ/עַ֣ל יְהוּדָ֑ה אֵ֖ת מֶ֥לֶךְ אַשּֽׁוּר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: de
  text: Jahwe wird über dich[a], über dein Volk und über das Haus deines Vaters[b] Tage kommen lassen, wie sie seit dem Tag, an dem Ephraim sich von Juda abwandte, nicht gekommen sind — nämlich den König von Assyrien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „dich“ bezeichnet Ahas.
    reason: referent_note
  - marker: b
    text: „Das Haus deines Vaters“ kann hier auch das angestammte beziehungsweise königliche Haus, also die Dynastie, bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: יָבִיא
  choice: wird … kommen lassen
  rationale: Die Hifil-Form von בוא hat kausative Bedeutung. „Kommen lassen“ gibt diese im Deutschen natürlich wieder und verbindet sich idiomatisch mit „Tage“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: über dich, über dein Volk und über das Haus deines Vaters
  rationale: Das wiederholte עַל wird durch „über“ bewahrt; die Wiederholung trägt zum feierlichen Rhythmus und zur umfassenden Ankündigung des Unheils bei.
- source_word: יָמִים אֲשֶׁר לֹא בָאוּ
  choice: Tage …, wie sie nicht gekommen sind
  rationale: Die Formulierung bewahrt ausdrücklich die hebräische Verneinung und bezeichnet beispiellose Zeiten, ohne den Satz durch eine zusätzliche Verneinung im Vergleich unnötig zu verkomplizieren.
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: seit dem Tag, an dem Ephraim sich von Juda abwandte
  rationale: סור kann „sich abwenden“ oder „weggehen“ bedeuten. „Sich abwandte“ bleibt nahe am Wortlaut und lässt den historischen Bruch erkennen, ohne ihn im Haupttext auszudeuten.
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: den König von Assyrien
  rationale: Der Akkusativmarker אֵת führt die abschließende nähere Bestimmung ein. Der Doppelpunkt macht die syntaktische Härte sichtbar, ohne ein erklärendes Wort wie „nämlich“ in den Text einzutragen.
- source_word: בֵּית אָבִיךָ
  choice: das Haus deines Vaters
  rationale: Die wörtliche hebräische Sozial- und Verwandtschaftsbezeichnung bleibt erhalten; im Kontext kann sie zugleich das angestammte beziehungsweise königliche Haus meinen.
theological_decisions:
- issue: Bezug des Königs von Assyrien
  choice: Der König von Assyrien wird als abschließende nähere Bestimmung der angekündigten beispiellosen Tage verstanden.
  alternative: „Den König von Assyrien“ könnte nach einer stärkeren syntaktischen Zäsur als gesondertes Objekt zu „kommen lassen“ aufgefasst werden.
  rationale: Die Stellung von אֵת מֶלֶךְ אַשּׁוּר erlaubt eine appositionelle beziehungsweise spezifizierende Lesart, bleibt im Hebräischen jedoch markant. Der Doppelpunkt wahrt diese Spannung besser als eine vollständig erklärende Umschreibung.
- issue: Umfang des angekündigten Gerichts
  choice: Die kommenden Tage treffen Ahas persönlich, sein Volk und sein Vaterhaus.
  alternative: „Haus deines Vaters“ könnte im Kontext enger ausschließlich als davidische Dynastie verstanden werden.
  rationale: Der Wortlaut nennt alle drei Adressaten ausdrücklich. Die Übersetzung legt die mögliche dynastische Bedeutung nicht exklusiv fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Satzspannung. „Jahwe“ gibt den Gottesnamen wieder. Die Wiederholung von „über“ und die konkrete Wendung „Haus deines Vaters“ erhalten den hebräischen Rhythmus und das soziale Bild; der Doppelpunkt vor „den König von Assyrien“ wahrt die markante, nicht völlig glatte Schlusskonstruktion.
