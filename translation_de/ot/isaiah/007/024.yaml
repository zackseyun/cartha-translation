  text: בַּ/חִצִּ֥ים וּ/בַ/קֶּ֖שֶׁת יָ֣בוֹא שָׁ֑מָּ/ה כִּי שָׁמִ֥יר וָ/שַׁ֖יִת תִּֽהְיֶ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
translation:
  language: de
  text: Mit Pfeilen und Bogen wird man dorthin kommen[a], denn das ganze Land wird zu Dornen und Disteln werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit Pfeilen und Bogen wird er dorthin kommen.“ Das hebräische Verb steht im Singular und kann allgemein gebraucht sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn das ganze Land wird voller Dornen und Disteln sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחִצִּים וּבַקֶּשֶׁת
  choice: Mit Pfeilen und Bogen
  rationale: Das instrumentale ב wird im Deutschen natürlich mit „mit“ wiedergegeben. Trotz der bestimmten Artikel im Hebräischen bezeichnet die Wendung allgemein die mitgeführten Waffen.
- source_word: יָבוֹא
  choice: wird man … kommen
  rationale: Das Verb steht in der 3. Person Singular, kann hier aber generisch gebraucht sein. Das unpersönliche „man“ bewahrt diesen Sinn im natürlichen modernen Deutsch, ohne einen bestimmten Mann einzuführen.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das hebräische Richtungsadverb bezeichnet eine Bewegung zu dem genannten Ort; „dorthin“ gibt dies genauer wieder als bloßes „dort“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet, weshalb man bewaffnet in das Gebiet kommt. „Denn“ verbindet die beiden Aussagen in gehobenem, aber geläufigem Deutsch.
- source_word: שָׁמִיר וָשַׁיִת
  choice: Dornen und Disteln
  rationale: Das feste jesajanische Wortpaar bezeichnet dornigen Wildwuchs als Bild verwüsteten Kulturlands. „Dornen und Disteln“ ist im Deutschen anschaulich und idiomatisch.
- source_word: תִּהְיֶה
  choice: wird … werden
  rationale: Das Verb kann schlicht „wird sein“ bedeuten; im Zusammenhang beschreibt es jedoch den eintretenden Zustand des Landes. „werden“ bringt diesen resultativen Sinn natürlich zum Ausdruck.
- source_word: כָל הָאָרֶץ
  choice: das ganze Land
  rationale: Gemeint ist das gesamte betroffene Land beziehungsweise Gebiet, nicht die ganze Erde. „Das ganze Land“ bewahrt Umfang und lokalen Bezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die generische Singularform wird mit „man“ wiedergegeben; die Bildsprache der verwilderten Landschaft bleibt erhalten.
