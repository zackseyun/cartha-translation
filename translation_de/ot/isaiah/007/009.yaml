base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: de
  text: Und das Haupt Ephraims ist Samaria, und das Haupt Samarias ist der Sohn Remaljas. Wenn ihr nicht glaubt[a], werdet ihr gewiss keinen Bestand haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertraut“.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen stehen „glaubt“ und „Bestand haben“ als zwei Formen derselben Wortwurzel (אמן) eng miteinander in Beziehung.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: Haupt
  rationale: 'Bewahrt die politische Körpermetapher und den Parallelismus: Samaria ist das Haupt Ephraims, der Sohn Remaljas das Haupt Samarias.'
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Übernimmt die hebräische Gebiets- und Stammesbezeichnung, die hier für das Nordreich steht, ohne diese Deutung in den Haupttext einzutragen.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Die übliche deutsche Namensform; gemeint ist die Hauptstadt Ephraims.
- source_word: בֶּן רְמַלְיָהוּ
  choice: der Sohn Remaljas
  rationale: Gibt die auffällige patronymische Bezeichnung wörtlich wieder, statt den Namen Pekach ergänzend einzutragen.
- source_word: אִם לֹא תַאֲמִינוּ
  choice: Wenn ihr nicht glaubt
  rationale: Versteht אִם als Einleitung des Bedingungssatzes und gibt das Hifil von אמן mit dem natürlichen deutschen Verb „glauben“ wieder.
- source_word: כִּי לֹא תֵאָמֵנוּ
  choice: werdet ihr gewiss keinen Bestand haben
  rationale: „Gewiss“ bringt die bekräftigende Kraft von כִּי zur Geltung; „keinen Bestand haben“ gibt das Nifal von אמן als Festigkeit beziehungsweise Fortbestand wieder.
theological_decisions:
- issue: Wortspiel mit zwei Formen der Wurzel אמן
  choice: Wenn ihr nicht glaubt, werdet ihr gewiss keinen Bestand haben.
  alternative: Wenn ihr nicht vertraut, werdet ihr nicht fest bestehen.
  rationale: Die Übersetzung wahrt den Unterschied zwischen Vertrauen beziehungsweise Glauben und dem daraus folgenden festen Bestand. Da sich das hebräische Wortspiel im Deutschen nicht vollständig nachbilden lässt, wird es in einer Fußnote offengelegt, ohne spätere dogmatische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ ist bewusst gehobener als „Oberhaupt“, bewahrt aber die knappe Metapher und den Parallelismus des Hebräischen. Die Schlusswendung ist idiomatisch und lässt die politische wie persönliche Tragweite der Warnung offen.
