source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: de
  text: 'In den Tagen des Ahas, des Königs von Juda, des Sohnes Jotams und Enkels Usijas, geschah es: Rezin, der König von Aram[a], und Pekach, der Sohn Remaljas und König von Israel, zogen nach Jerusalem hinauf, um Krieg gegen die Stadt zu führen. Doch er konnte sie nicht bekämpfen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Aram“; traditionell „Syrien“.
    reason: alternative_reading
  - marker: b
    text: 'Im Hebräischen steht das Verb im Singular: „Er konnte nicht“, obwohl zuvor Rezin und Pekach gemeinsam genannt werden. Manche Übersetzungen gleichen dies an den Sinn an und schreiben: „Sie konnten nicht“.'
    reason: textual_grammar
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: In den Tagen … geschah es
  rationale: Bewahrt die hebräische Eröffnung einer geschichtlichen Erzählung in würdigem, verständlichem Deutsch.
- source_word: אָחָז בֶּן יוֹתָם בֶּן עֻזִּיָּהוּ
  choice: Ahas, der Sohn Jotams und Enkel Usijas
  rationale: Gibt die Abstammungsfolge natürlich wieder; „Enkel“ verdeutlicht im Deutschen die Beziehung des zweiten בֶּן, ohne die Genealogie zu verändern.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin, der König von Aram
  rationale: „Aram“ entspricht unmittelbar der hebräischen historisch-geografischen Bezeichnung; das traditionelle „Syrien“ wird in der Fußnote genannt.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: und Pekach, der Sohn Remaljas und König von Israel
  rationale: Bewahrt Namen, Abstammung und Königstitel in natürlicher deutscher Apposition.
- source_word: עָלָה ... יְרוּשָׁלִַם
  choice: zogen nach Jerusalem hinauf
  rationale: „Hinaufziehen“ erhält die Richtungsbedeutung von עלה und passt zum militärischen Kontext; der deutsche Plural folgt dem zusammengesetzten Subjekt.
- source_word: לַמִּלְחָמָה עָלֶיהָ
  choice: um Krieg gegen die Stadt zu führen
  rationale: Gibt die Zweckangabe und den feindlichen Bezug idiomatisch wieder. „Die Stadt“ macht den femininen Rückbezug auf Jerusalem im Deutschen eindeutig.
- source_word: וְלֹא יָכֹל לְהִלָּחֵם עָלֶיהָ
  choice: Doch er konnte sie nicht bekämpfen
  rationale: Der Singular „er konnte“ bildet die auffällige Singularform des masoretischen Textes ab, statt sie stillschweigend an das zusammengesetzte Subjekt anzugleichen.
theological_decisions:
- issue: Wiedergabe von אֲרָם
  choice: Aram
  alternative: Syrien
  rationale: Die unmittelbare hebräische Bezeichnung wird beibehalten; die traditionelle Wiedergabe wird transparent in einer Fußnote dokumentiert.
- issue: Singular יָכֹל nach Rezin und Pekach als zusammengesetztem Subjekt
  choice: Doch er konnte sie nicht bekämpfen
  alternative: Doch sie konnten sie nicht bekämpfen
  rationale: Der Singular des hebräischen Textes bleibt sichtbar. Die Übersetzung legt nicht fest, ob er sich besonders auf Rezin bezieht oder eine andere syntaktische Erklärung hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Formulierung ist lesefreundlich, der militärische Vorgang klar ausgedrückt. Die auffällige Spannung zwischen dem vorausgehenden zusammengesetzten Subjekt und dem abschließenden Singular wird im Haupttext bewahrt und in der Fußnote erläutert.
