    rationale: Die bisherige Fußnote nennt „hat sich auf Ephraim niedergelassen“ wörtlich, obwohl dies bereits eine deutsche Auslegung des Verbs und eine im Deutschen missverständliche Präpositionsübertragung ist. Sie sollte die Nähe zum hebräischen Bild vorsichtiger erläutern.
