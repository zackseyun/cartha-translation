    rationale: „sich auf Ephraim niederlassen“ legt im Deutschen eine physische Lage auf einem Gebiet oder Volk nahe. Die hebräische Formulierung ist zwar ungewöhnlich, meint im Kontext aber Arams Anlehnung bzw. Lagerung bei Ephraim. „bei Ephraim“ bewahrt die Offenheit besser.
