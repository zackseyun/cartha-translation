  source_fidelity: 'Die Grundstruktur wird korrekt wiedergegeben: die Meldung an das davidische Königshaus, die ungewöhnliche Aussage נָחָה אֲרָם עַל־אֶפְרַיִם sowie das Beben von Herrscher und Volk im Bild der vom Wind bewegten Waldbäume. Der hebräische Ausdruck für das Verhältnis Arams zu Ephraim ist kontextuell politisch zu verstehen, bleibt aber im Wortlaut bildhaft und nicht völlig eindeutig.'
  naturalness: „Dem Haus David“ und besonders „Aram hat sich auf Ephraim niedergelassen“ sind im heutigen Standarddeutsch unnatürlich bzw. missverständlich, als habe Aram sich räumlich auf Ephraim gesetzt. „Dem Haus Davids“ ist die normale deutsche Form; „bei Ephraim niedergelassen“ bewahrt die bildhafte Offenheit ohne diese unerwünschte räumliche Vorstellung. Die Wiederholung von „erzitterten/erzittern“ ist verständlich und markiert die hebräische Verbverbindung.
  terminology: „Haus Davids“ wahrt die dynastische Bezeichnung. „Aram“ und „Ephraim“ sind angemessen. Die Fußnote soll die politisch naheliegende Deutung als Bündnis kenntlich machen, aber nicht behaupten, die Formulierung sei im Deutschen oder Hebräischen schlicht wörtlich mit „sich auf ... niederlassen“ wiederzugeben.
