source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: de
  text: 'Dem Haus Davids wurde gemeldet: »Aram hat sich bei Ephraim niedergelassen[a].« Da erzitterten sein Herz und das Herz seines Volkes, wie die Bäume des Waldes vor dem Wind erzittern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Aram hat sich mit Ephraim verbündet.« Die hebräische Formulierung lautet wörtlich etwa: »Aram hat auf Ephraim geruht« und ist im Zusammenhang wahrscheinlich politisch zu verstehen.'
    reason: Die Anmerkung erklärt die ungewöhnliche hebräische Bildsprache und ihre wahrscheinliche politische Bedeutung, ohne diese als einzig mögliche Lesart im Haupttext festzulegen.
lexical_decisions:
- source_word: נָחָה ... עַל
  choice: hat sich auf ... niedergelassen
  rationale: Die Wiedergabe bewahrt das konkrete Bild des hebräischen Verbs נוח („ruhen, sich niederlassen“) mit der Präposition עַל („auf“) und damit auch die ungewöhnliche, möglicherweise militärisch-politische Formulierung des masoretischen Textes.
- source_word: וַיָּנַע ... כְּנוֹעַ
  choice: bebten ... beben
  rationale: Dasselbe deutsche Verb bildet wie im Hebräischen die Verbindung zwischen den Herzen und den vom Wind bewegten Waldbäumen ab.
- source_word: בֵית דָּוִד
  choice: Haus David
  rationale: Die traditionelle dynastische Bezeichnung bleibt erhalten; im Zusammenhang sind der König aus Davids Haus und sein Hof beziehungsweise die davidische Herrscherfamilie gemeint.
theological_decisions:
- issue: Verhältnis zwischen Aram und Ephraim
  choice: Die Bildsprache „hat sich auf Ephraim niedergelassen“ bleibt im Haupttext stehen.
  alternative: „hat sich mit Ephraim verbündet“ oder „hat sich mit Ephraim vereinigt“
  rationale: Der Kontext legt ein Bündnis nahe, doch der masoretische Wortlaut bezeichnet es nicht mit einem eindeutigen Wort für „sich verbünden“. Die Übersetzung wahrt deshalb die Mehrdeutigkeit und erläutert die kontextuelle Deutung in einer Fußnote.
- issue: Bezug von „sein Herz“
  choice: Das maskuline Singularpronomen wird als „sein Herz“ beibehalten.
  alternative: Explizit „das Herz des Königs“ oder „das Herz des Ahas“
  rationale: Der hebräische Text nennt Ahas in diesem Vers nicht ausdrücklich. Eine Explizierung würde den kontextuell wahrscheinlichen Bezug festlegen, statt die metonymische Rede vom „Haus David“ zu bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Meldung und das eindringliche Vergleichsbild bleiben erhalten; „bebten ... beben“ ist verständlich und bildet die hebräische Wortwiederholung nach.
