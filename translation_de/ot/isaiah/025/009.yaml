source:
  edition: WLC
  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: de
  text: 'An jenem Tag wird man sagen: »Seht, das ist unser Gott! Wir hofften auf ihn, dass er uns rette. Das ist Yahweh[a]; auf ihn haben wir gehofft. Lasst uns jubeln und uns über seine Rettung freuen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), hier mit „Yahweh“ wiedergegeben.'
    reason: Erläuterung der Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: וְאָמַר
  choice: wird man sagen
  rationale: Die 3. Person Singular hat hier wahrscheinlich unpersönlichen Sinn. Die deutsche man-Konstruktion wahrt das Fehlen eines ausdrücklich genannten Subjekts und den Zukunftsbezug der prophetischen Aussage.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der prophetischen Zeitformel und erhält ihren feierlichen Zukunftsbezug.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufforderungscharakter und die nachdrückliche Hinwendung auf das erkannte Handeln Gottes werden in gegenwärtigem, verständlichem Deutsch wiedergegeben.
- source_word: אֱלֹהֵינוּ זֶה
  choice: das ist unser Gott
  rationale: Die demonstrative Identifikation wird klar und betont wiedergegeben.
- source_word: קִוִּינוּ לוֹ
  choice: auf ihn haben wir gehofft
  rationale: קוה verbindet erwartungsvolles Warten mit Hoffnung. „Auf ihn hoffen“ ist im Deutschen idiomatisch und bewahrt den persönlichen Vertrauensbezug, auch wenn die ausdrückliche Nuance des Wartens schwächer hervortritt.
- source_word: וְיוֹשִׁיעֵנוּ
  choice: und er wird uns retten
  rationale: Das nicht-konsekutive Imperfekt bezeichnet am naheliegendsten die erwartete Rettung. Die koordinierende Wiedergabe erhält das hebräische וְ und vermeidet, eine mögliche Zweckbeziehung als eindeutig festzulegen.
- source_word: זֶה יְהוָה
  choice: Das ist Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben; zugleich bleibt die wiederholte demonstrative Erkenntnisaussage erhalten.
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Lasst uns jubeln und uns … freuen
  rationale: Die beiden Kohortative drücken gemeinsame Aufforderung beziehungsweise Entschlossenheit aus. „Jubeln“ und „sich freuen“ bewahren die gesteigerte, parallele Aussage.
- source_word: בִּישׁוּעָתוֹ
  choice: über seine Rettung
  rationale: ישועה bezeichnet die von Gott bewirkte Rettung oder Befreiung. Die deutsche Verbindung „sich über … freuen“ gibt die Funktion der Präposition idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; JHWH
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration „Yahweh“ behandelt es als Gottes Eigennamen und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Zeit- und Sinnbezug von וְיוֹשִׁיעֵנוּ
  choice: und er wird uns retten
  alternative: damit er uns rettet; und er hat uns gerettet
  rationale: Die Form ist ein Imperfekt mit einfacher Konjunktion und kann erwartete künftige Rettung ausdrücken. Eine Zweckdeutung ist kontextuell möglich, aber grammatisch nicht zwingend; eine Vergangenheitsform würde die Perspektive stärker festlegen.
translation_notes:
  register: Modernes, feierliches Standarddeutsch. „Seht“ vermeidet das heute altertümlich wirkende „Siehe“, während Satzrhythmus, Wiederholung und gemeinschaftlicher Jubel des hebräischen Textes erhalten bleiben.
