    issue: Die Verbindung קִוִּינוּ לוֹ וְיוֹשִׁיעֵנוּ wird als bloße Koordination („auf ihn haben wir gehofft, und er wird uns retten“) wiedergegeben.
    rationale: 'Die hebräische Folge kann eine erwartete bzw. finale Beziehung ausdrücken: Man hat auf ihn gewartet/geharrt in der Erwartung, dass er rette. Die deutsche Fassung sollte diese Beziehung ausdrücken, ohne die Verbform als abgeschlossene Rettung festzulegen.'
