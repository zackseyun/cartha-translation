base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: de
  text: Darum wird dich ein starkes Volk[a] ehren; eine Stadt erbarmungsloser Völker[b] wird dich fürchten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein mächtiges Volk“. Das hebräische Eigenschaftswort kann Stärke, Macht oder Wildheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich knapp: „eine Stadt erbarmungsloser Völker“. Gemeint sein kann eine Stadt, die solchen Völkern gehört oder von ihnen geprägt ist. Im Hebräischen stehen die beiden Verben im Plural, obwohl „Volk“ und „Stadt“ jeweils im Singular stehen.'
    reason: grammatical_and_lexical_ambiguity
  - marker: c
    text: 'Oder: „wird Ehrfurcht vor dir haben“. Das Verb kann Furcht, Ehrfurcht oder Scheu ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus den zuvor beschriebenen Taten Gottes. „Darum“ gibt diese folgernde Kraft knapp und natürlich wieder.
- source_word: יְכַבְּדוּךָ
  choice: wird dich … ehren
  rationale: Das Piel von כבד bezeichnet hier, jemandem Ehre oder Gewicht beizumessen. „Ehren“ bewahrt den Sinn, ohne die Aussage vorschnell auf kultische Verherrlichung festzulegen.
- source_word: עַם עָז
  choice: ein starkes Volk
  rationale: עַז kann Stärke, Macht oder auch Wildheit bezeichnen. „Stark“ ist im Deutschen die breiteste, am wenigsten festlegende Wiedergabe.
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: eine Stadt erbarmungsloser Völker
  rationale: Die knappe hebräische Genitivverbindung kann eine Stadt bezeichnen, die solchen Völkern gehört oder durch sie geprägt ist. „Erbarmungslos“ bringt den gewalttätig-unterdrückerischen Charakter von עָרִיץ im Jesajabuch zur Geltung; „Völker“ ist hier natürlicher als „Nationen“.
- source_word: יִירָאוּךָ
  choice: wird dich fürchten
  rationale: ירא umfasst Furcht, Ehrfurcht und Scheu. „Fürchten“ bewahrt angesichts des göttlichen Gerichts die unmittelbare Stärke des Ausdrucks und lässt zugleich eine ehrfürchtige Nuance offen.
theological_decisions:
- issue: Art der Reaktion mächtiger und erbarmungsloser Völker auf Gott
  choice: Die Völker ehren und fürchten Gott; ob dies freiwillige Verehrung, erzwungene Unterwerfung oder beides bedeutet, bleibt offen.
  alternative: Die Aussage entweder eindeutig als Bekehrung zu aufrichtiger Anbetung oder ausschließlich als angstvolle Unterwerfung zu deuten.
  rationale: Die Verben כבד und ירא können Anerkennung und Ehrfurcht ausdrücken, doch der Vers bestimmt die innere Haltung nicht näher. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die parallelen Reaktionen „ehren“ und „fürchten“ bleiben erhalten; die ungewöhnlich knappe hebräische Konstruktion wird lesbar wiedergegeben und in der Fußnote erläutert.
