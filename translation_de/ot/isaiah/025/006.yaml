source:
  edition: WLC
  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: de
  text: 'Und Jahwe der Heere wird auf diesem Berg für alle Völker ein Festmahl bereiten: ein Festmahl mit üppigen Speisen[a], ein Festmahl mit gereiftem Wein[b] – üppige Speisen, reich an Mark, gereifter, geklärter Wein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fette Speisen“. Fett und Mark stehen hier für besonders reichhaltige und kostbare Speisen.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bildsprache, während der Haupttext ihre positive Bedeutung in natürlichem Deutsch ausdrückt.
  - marker: b
    text: 'Wörtlich: „Wein auf dem Hefesatz“ beziehungsweise „auf dem Bodensatz“. Im Festkontext bezeichnet dies hochwertigen, gereiften Wein.'
    reason: Die Fußnote dokumentiert die wörtliche Bedeutung von שְׁמָרִים und erläutert die positive kontextuelle Deutung, ohne eine nicht ausdrücklich genannte Reifedauer festzulegen.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: wird … bereiten
  rationale: עָשָׂה bedeutet grundsätzlich „machen/tun“; im Zusammenhang eines Festmahls gibt „bereiten“ den konkreten Vorgang natürlich und präzise wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; צְבָאוֹת bezeichnet Heere bzw. Scharen. „der Heere“ ist im heutigen Deutsch verständlicher als „der Heerscharen“, ohne den Titel durch eine zusätzliche Deutung zu erweitern.
- source_word: לְכָל הָעַמִּים
  choice: für alle Völker
  rationale: Der Plural עַמִּים bezeichnet die verschiedenen Völker. Die Formulierung bewahrt den umfassenden Horizont des Verses.
- source_word: בָּהָר הַזֶּה
  choice: auf diesem Berg
  rationale: Dies ist die natürliche deutsche Wiedergabe der Ortsangabe und erhält das Demonstrativpronomen.
- source_word: מִשְׁתֵּה
  choice: Festmahl
  rationale: מִשְׁתֵּה bezeichnet ein Fest bzw. Gelage, bei dem auch das Trinken wesentlich ist. „Festmahl“ passt zu den genannten Speisen und Weinen und trägt den feierlichen Ton.
- source_word: שְׁמָנִים
  choice: üppige Speisen
  rationale: Wörtlich sind „fette Dinge/Speisen“ gemeint, im Kontext ein Bild für besonders reichhaltige und kostbare Nahrung. „Üppige Speisen“ vermittelt diese positive Festvorstellung im modernen Deutsch.
- source_word: שְׁמָרִים
  choice: lange gereifter Wein
  rationale: שְׁמָרִים bedeutet wörtlich „Hefesatz/Bodensatz“ und bezeichnet hier Wein, der zur Reifung auf dem Satz gelagert wurde. Die positive Bedeutung wird im Haupttext ausgedrückt, die konkrete Bildsprache in der Fußnote bewahrt.
- source_word: מְמֻחָיִם
  choice: markreich
  rationale: Das Wort bezeichnet mit Mark angereicherte bzw. markhaltige Speisen und hebt deren besondere Reichhaltigkeit hervor. „markreich“ erhält das konkrete Bild knapp und verständlich.
- source_word: מְזֻקָּקִים
  choice: sorgfältig geklärt
  rationale: Das Partizip beschreibt den Wein als geläutert, geklärt oder filtriert. „sorgfältig geklärt“ macht die aufwendige Zubereitung und hohe Qualität deutlich.
theological_decisions:
- issue: Umfassender Kreis der Festteilnehmer
  choice: für alle Völker
  alternative: für die ganze Menschheit / für alle Nationen
  rationale: Die Übersetzung wahrt den Plural des Hebräischen und die über Israel hinausreichende Perspektive, ohne daraus eine weiter ausgearbeitete Aussage über Einladung, Teilnahme oder Heil abzuleiten.
- issue: Wiedergabe des Gottesnamens und Titels
  choice: Jahwe der Heere
  alternative: der HERR Zebaoth / Jahwe der Heerscharen
  rationale: Der persönliche Gottesname bleibt sichtbar; der Titel wird semantisch transparent wiedergegeben, ohne eine zusätzliche kosmologische Bestimmung wie „Himmelsheere“ einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Entfaltung von Festmahl, Speisen und Wein folgt der poetischen Wiederholung des Hebräischen. „Üppig“, „markreich“ und „sorgfältig geklärt“ halten die sinnliche Festbildsprache lebendig, ohne altertümlich zu klingen.
