source:
  edition: WLC
  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: de
  text: Er wird den Tod für immer verschlingen[a]. Und der Herr Jahwe[b] wird die Tränen von jedem Gesicht abwischen und die Schmach seines Volkes von der ganzen Erde wegnehmen[c]. Denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat den Tod für immer verschlungen.“ Das hebräische Perfekt kann hier als prophetisches Perfekt eine zukünftige Tat als gewiss darstellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch אֲדֹנָי יְהוִה (Adonaj JHWH), wörtlich: „Herr Jahwe“.'
    reason: lexical_alternative
  - marker: c
    text: „Erde“ kann hier auch „Land“ bedeuten; „Schmach“ lässt sich auch mit „Schande“ oder „Entehrung“ wiedergeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: Er wird ... verschlingen
  rationale: Das morphologische Perfekt wird im prophetischen Zusammenhang zukunftsbezogen wiedergegeben; „verschlingen“ bewahrt das konkrete Bild des hebräischen Verbs.
- source_word: הַמָּוֶת לָנֶצַח
  choice: den Tod für immer
  rationale: Die Formulierung gibt sowohl das bestimmte Objekt als auch die dauerhafte, endgültige Reichweite von לָנֶצַח natürlich wieder.
- source_word: וּמָחָה ... דִּמְעָה
  choice: wird die Tränen ... abwischen
  rationale: „Abwischen“ entspricht dem Bild von מחה bei Tränen; der deutsche Plural ist in Verbindung mit „jedem Gesicht“ idiomatisch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Gottesnamen יְהוִה und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: מֵעַל כָּל פָּנִים
  choice: von jedem Gesicht
  rationale: Die distributive Bedeutung von כָּל wird in natürlichem Deutsch mit „jedem“ ausgedrückt.
- source_word: וְחֶרְפַּת עַמּוֹ
  choice: die Schmach seines Volkes
  rationale: „Schmach“ umfasst öffentliche Entehrung und Beschämung und entspricht dem würdevollen prophetischen Register.
- source_word: יָסִיר
  choice: wegnehmen
  rationale: Das Hifil von סור bezeichnet hier das Beseitigen; „wegnehmen“ ist klar und bewahrt die räumliche Bildlichkeit von מֵעַל.
- source_word: מֵעַל כָּל הָאָרֶץ
  choice: von der ganzen Erde
  rationale: Im universalen Zusammenhang bezeichnet אֶרֶץ plausibel die Erde; die mögliche Bedeutung „Land“ bleibt in einer Fußnote erhalten.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: Denn Jahwe hat gesprochen
  rationale: כִּי begründet die Gewissheit der Verheißung; das Perfekt „hat gesprochen“ bewahrt die feierliche prophetische Bekräftigung.
theological_decisions:
- issue: Zeitlicher Bezug von בִּלַּע
  choice: 'Zukunft: „Er wird ... verschlingen“'
  alternative: 'Vergangenheit bzw. prophetisches Perfekt: „Er hat ... verschlungen“'
  rationale: Der Zusammenhang kündigt Gottes künftiges Heil an. Die Zukunftsform vermittelt die Funktion des prophetischen Perfekts, ohne dessen morphologische Mehrdeutigkeit zu verschweigen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den im Ausgangstext stehenden Eigennamen sichtbar; in אֲדֹנָי יְהוִה bleibt zugleich der vorangestellte Titel „Herr“ erhalten.
- issue: Reichweite von כָּל הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Die parallele Universalität von „jedem Gesicht“ und die umfassende Überwindung des Todes sprechen für „Erde“, während die lexikalisch mögliche Lesart „Land“ in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Satzführung. Die konkrete Metaphorik des Verschlingens und Abwischens bleibt erhalten. Die Satzteilung erhöht die Lesbarkeit, ohne die logische Verbindung des hebräischen Textes aufzulösen.
