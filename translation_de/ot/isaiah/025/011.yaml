  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פֵרַ֤שׂ יָדָי/ו֙ בְּ/קִרְבּ֔/וֹ כַּ/אֲשֶׁ֛ר יְפָרֵ֥שׂ הַ/שֹּׂחֶ֖ה לִ/שְׂח֑וֹת וְ/הִשְׁפִּיל֙ גַּֽאֲוָת֔/וֹ עִ֖ם אָרְבּ֥וֹת יָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: de
  text: Und er wird mitten darin seine Hände ausbreiten, wie ein Schwimmer sie zum Schwimmen ausbreitet, und er wird seinen Hochmut erniedrigen samt den Kunstgriffen seiner Hände.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwierig. Möglich sind auch „die Geschicklichkeit seiner Hände“ oder, stärker negativ, „die Listen/Machenschaften seiner Hände“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ
  choice: wird … ausbreiten
  rationale: פרשׂ bedeutet ausbreiten oder ausstrecken. „Ausbreiten“ bewahrt das anschauliche Bild der Schwimmbewegung.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Die wörtliche Wiedergabe „Hände“ wahrt die Wiederaufnahme am Versende und ist im Bildzusammenhang verständlich.
- source_word: בְּקִרְבּוֹ
  choice: mitten darin
  rationale: Die maskuline Singularendung verweist im unmittelbaren Zusammenhang am ehesten auf das personifizierte Moab. Die Formulierung lässt den Bezug innerhalb dieses Einzelverses angemessen implizit.
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: wie ein Schwimmer sie zum Schwimmen ausbreitet
  rationale: הַשֹּׂחֶה bezeichnet den Schwimmer beziehungsweise einen Schwimmenden; לִשְׂחוֹת drückt Zweck oder Tätigkeit aus. Das ergänzte „sie“ ist im Deutschen durch „seine Hände“ eindeutig erschlossen.
- source_word: וְהִשְׁפִּיל
  choice: und er wird … erniedrigen
  rationale: Der Hifil von שׁפל bedeutet niedrig machen, erniedrigen oder zu Fall bringen. „Erniedrigen“ verbindet die konkrete Gerichtsaussage natürlich mit „Hochmut“.
- source_word: גַּאֲוָתוֹ
  choice: seinen Hochmut
  rationale: Im Gerichtskontext bezeichnet das Wort überhebliche Selbsterhöhung. „Hochmut“ ist präzise, würdig und im modernen Deutsch geläufig.
- source_word: עִם
  choice: samt
  rationale: עִם verbindet den Hochmut mit dem, was zusammen mit ihm erniedrigt wird. „Samt“ gibt diese Begleitung knapp und idiomatisch wieder.
- source_word: אָרְבוֹת יָדָיו
  choice: den Kunstgriffen seiner Hände
  rationale: Die schwierige Wendung kann auf listige Mittel, Machenschaften oder geschickte Vorrichtungen deuten. „Kunstgriffe“ bewahrt sowohl Geschicklichkeit als auch eine mögliche negative Färbung, ohne die lexikalische Unsicherheit zu verdecken.
theological_decisions:
- issue: Bezug der singularischen Pronomen
  choice: Die singularischen Formen bleiben als „er/seine“ erhalten und beziehen sich im Kontext auf das personifizierte Moab.
  alternative: Die Aussage kann kollektiv auf die Menschen Moabs bezogen werden.
  rationale: Das Hebräische verwendet Singularformen; die Personifikation einer Nation ist in prophetischer Dichtung üblich. Eine ausdrückliche Kollektivierung wäre interpretierende Erweiterung.
- issue: Bedeutung von אָרְבוֹת יָדָיו
  choice: „den Kunstgriffen seiner Hände“ im Haupttext, mit weiteren Möglichkeiten in einer Fußnote
  alternative: „der Geschicklichkeit seiner Hände“, „den Listen/Machenschaften seiner Hände“ oder wörtlich an „Hinterhalte“ angelehnte Deutungen
  rationale: Die Wendung ist lexikalisch unsicher. „Kunstgriffe“ hält Geschick und mögliche Arglist zusammen; die Fußnote macht die Spannweite transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildlichkeit. Die Wiederholung von „ausbreiten“ entspricht der hebräischen Wiederholung; „zum Schwimmen“ hält die Zweckangabe ausdrücklich fest.
