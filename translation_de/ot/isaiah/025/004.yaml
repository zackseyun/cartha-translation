id: ISA.25.4
reference: Isaiah 25:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: de
  text: Denn du bist dem Schwachen[a] eine Schutzburg gewesen, dem Bedürftigen eine Schutzburg in seiner Bedrängnis, eine Zuflucht vor dem Unwetter, Schatten vor der Hitze. Denn der Atem[b] der Gewalttätigen ist wie ein Unwetter gegen eine Mauer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Armen“ beziehungsweise „dem Geringen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Wind“ beziehungsweise „der Ansturm“. Das hebräische רוּחַ kann hier Atem, Wind oder einen heftigen Stoß bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die knappe hebräische Wendung kann auch mit „wie ein Wolkenbruch gegen eine Mauer“ oder „wie ein Unwetter, das gegen eine Mauer schlägt“ wiedergegeben werden.
    reason: textual_ambiguity
lexical_decisions:
- source_word: מָעוֹז
  choice: Schutzburg
  rationale: Bezeichnet einen sicheren, wehrhaften Zufluchtsort. Die Wiederholung des hebräischen Wortes wird bewahrt; zugleich bleibt מַחְסֶה davon unterschieden.
- source_word: דָּל
  choice: der Schwache
  rationale: Das Wort kann soziale Armut wie auch Schwäche und geringe Stellung bezeichnen. „Der Schwache“ bewahrt diese Breite, während die Fußnote die mögliche Wiedergabe „der Arme“ nennt.
- source_word: אֶבְיוֹן
  choice: der Bedürftige
  rationale: Gibt die materielle und soziale Bedürftigkeit wieder und hält die begriffliche Abstufung gegenüber דָּל aufrecht.
- source_word: בַּצַּר לוֹ
  choice: in seiner Bedrängnis
  rationale: Gibt die Notlage des Bedürftigen idiomatisch wieder und bewahrt den maskulinen Singular des Suffixes.
- source_word: מַחְסֶה
  choice: Zuflucht
  rationale: Passt zum Schutzbild, ohne das zuvor zweimal gebrauchte מָעוֹז einzuebnen.
- source_word: זֶרֶם
  choice: Unwetter
  rationale: Der Ausdruck kann einen Wolkenbruch, Sturzregen oder Sturm bezeichnen. „Unwetter“ funktioniert an beiden Stellen und bewahrt die wiederholte Bildsprache.
- source_word: צֵל
  choice: Schatten
  rationale: Bezeichnet hier wohltuenden Schutz vor brennender Hitze und entspricht dem konkreten Bild des Hebräischen.
- source_word: חֹרֶב
  choice: Hitze
  rationale: Im Gegenüber zu „Schatten“ ist brennende Hitze wahrscheinlicher als die ebenfalls mögliche Bedeutung „Dürre“.
- source_word: רוּחַ
  choice: Atem
  rationale: Bewahrt den Grundsinn und die anschauliche Vorstellung der bedrohlichen Kraft, ohne die mögliche Bedeutung „Wind“ oder „Stoß“ auszuschließen.
- source_word: עָרִיצִים
  choice: die Gewalttätigen
  rationale: Erfasst rücksichtslose, unterdrückende Menschen, ohne den Ausdruck unnötig auf politische Tyrannen zu verengen.
- source_word: קִיר
  choice: Mauer
  rationale: Entspricht dem konkreten Sinn des Wortes und erhält das Bild eines Unwetters, das gegen eine Mauer schlägt.
theological_decisions:
- issue: Bildhafte Darstellung von Gottes Schutz
  choice: Die konkreten Schutzbilder „Schutzburg“, „Zuflucht“ und „Schatten“ werden ohne erklärende Ausdeutung wiedergegeben.
  alternative: Eine Paraphrase, die ausdrücklich geistlichen Trost, Heil oder ewige Rettung nennt.
  rationale: Der Vers beschreibt Gottes Fürsorge für gefährdete Menschen in dichterischen Schutzbildern. Eine dogmatische Ausweitung würde über den Wortlaut hinausgehen.
- issue: Bezeichnung der Bedränger
  choice: עָרִיצִים wird allgemein als „die Gewalttätigen“ wiedergegeben.
  alternative: „Tyrannen“ als ausdrücklich politische Herrscher.
  rationale: Der hebräische Ausdruck bezeichnet rücksichtslose Unterdrücker, legt ihre konkrete gesellschaftliche oder politische Stellung aber nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die Wiederholung von „Schutzburg“ bildet die hebräische Wiederholung ab; die konkreten Wetter- und Schutzbilder bleiben erhalten. Sämtliche Fußnotenmarker stehen an den jeweils betroffenen Ausdrücken im Haupttext.
