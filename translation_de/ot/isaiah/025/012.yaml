source:
  edition: WLC
  text: וּ/מִבְצַ֞ר מִשְׂגַּ֣ב חוֹמֹתֶ֗י/ךָ הֵשַׁ֥ח הִשְׁפִּ֛יל הִגִּ֥יעַ לָ/אָ֖רֶץ עַד עָפָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/012.yaml
  text: And the fortified height of your walls he has brought down[a], laid low, and cast to the ground, to the dust.
translation:
  language: de
  text: Und die befestigte Höhe deiner Mauern[a] hat er gesenkt, erniedrigt und zu Boden gebracht, bis in den Staub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und die Festung der Höhe deiner Mauern«. Die hebräische Wortverbindung ist stark verdichtet und kann formaler als eine Folge von Genitivverbindungen wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב
  choice: Und die befestigte Höhe
  rationale: Die verdichtete hebräische Konstruktverbindung bezeichnet eine hoch gelegene, schwer zugängliche Befestigung. »Befestigte Höhe« bewahrt sowohl den Wehrcharakter von מִבְצָר als auch den Höhen- und Schutzaspekt von מִשְׂגָּב, ohne im Deutschen unnötig zu verdoppeln.
- source_word: חוֹמֹתֶיךָ
  choice: deiner Mauern
  rationale: Der Plural »Mauern« und das Suffix der 2. Person Singular werden direkt wiedergegeben; »Stadtmauern« wäre zwar kontextuell möglich, ist im Hebräischen aber nicht ausdrücklich gesagt.
- source_word: הֵשַׁח
  choice: hat er gesenkt
  rationale: Das Hifil bezeichnet das Herabbringen von etwas Hohem. »Gesenk­t« erhält die räumliche Abwärtsbewegung und vermeidet eine vorschnelle Festlegung auf eine bestimmte Art der Zerstörung.
- source_word: הִשְׁפִּיל
  choice: erniedrigt
  rationale: Das Verb bedeutet »niedrig machen« oder »erniedrigen«. Die Wiedergabe bewahrt neben dem räumlichen Niederlegen auch den Beiklang der Demütigung.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: zu Boden gebracht
  rationale: Wörtlich lässt der Verursachungsstamm etwas den Erdboden erreichen. »Zu Boden gebracht« ist natürliches Deutsch und bleibt nahe am Bild des hebräischen Textes.
- source_word: עַד עָפָר
  choice: bis in den Staub
  rationale: Die Formulierung steigert den völligen Sturz bis hinab zum Staub. »Bis in den Staub« gibt עַד und die nachdrückliche Tiefenbewegung ausdrücklich wieder.
theological_decisions: []
