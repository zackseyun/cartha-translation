base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: de
  text: Denn du hast die Stadt zu einem Trümmerhaufen gemacht, die befestigte Stadt zur Ruine; der Palast der Fremden ist keine Stadt mehr[a] und wird niemals wieder aufgebaut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist stark verkürzt und seine genaue syntaktische Beziehung ist umstritten. Wörtlich stehen hier „Palast der Fremden“ und „aus/von einer Stadt“ nebeneinander; gemeint ist wahrscheinlich, dass dieser Herrschaftssitz nicht mehr als Stadt besteht.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Auf ewig wird er nicht gebaut werden.“ Im Zusammenhang der Zerstörung ist „niemals wieder aufgebaut“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: du hast … gemacht
  rationale: שׂוּם bedeutet grundsätzlich „setzen, stellen“, bezeichnet mit einer Ergebnisangabe hier aber idiomatisch das Machen oder Verwandeln zu etwas.
- source_word: מֵעִיר לַגָּל
  choice: die Stadt zu einem Trümmerhaufen
  rationale: Die Konstruktion beschreibt die Verwandlung einer Stadt in einen Haufen. „Trümmerhaufen“ bewahrt das Bild von גַּל und macht den Zerstörungskontext deutlich.
- source_word: קִרְיָה בְצוּרָה
  choice: die befestigte Stadt
  rationale: קִרְיָה ist ein Synonym zu עִיר; בְצוּרָה bedeutet „befestigt“. Die Wiederholung von „Stadt“ erhält den poetischen Parallelismus im Deutschen.
- source_word: לְמַפֵּלָה
  choice: zur Ruine
  rationale: מַפֵּלָה bezeichnet Einsturz, Fall oder den daraus entstandenen Ruinenzustand. „Zur Ruine“ ist im Kontext natürlich und prägnant.
- source_word: אַרְמוֹן זָרִים
  choice: der Palast der Fremden
  rationale: אַרְמוֹן bezeichnet einen Palast oder befestigten Herrschaftssitz; זָרִים sind Fremde beziehungsweise Auswärtige. Die formale Genitivverbindung bleibt erhalten.
- source_word: מֵעִיר
  choice: ist keine Stadt mehr
  rationale: Die stark verkürzte Wendung bezeichnet wahrscheinlich den Verlust des Stadtstatus beziehungsweise die vollständige Beseitigung als Stadt. Die ungewöhnliche Bildspannung zwischen „Palast“ und „Stadt“ wird nicht glatt aufgelöst.
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: wird niemals wieder aufgebaut
  rationale: לְעוֹלָם mit Verneinung bedeutet idiomatisch „niemals“. Der Niphal von בנה ist passiv; nach der geschilderten Zerstörung ist „wieder aufgebaut“ die natürliche kontextuelle Wiedergabe.
theological_decisions:
- issue: Identität der zerstörten Stadt und der Fremden
  choice: Die Stadt und die Fremden bleiben unbestimmt.
  alternative: Die Aussage auf eine bestimmte historische oder endzeitliche Stadt festlegen.
  rationale: Der Vers selbst nennt keine Stadt. Eine nähere Identifizierung wäre Auslegung und würde die Offenheit des prophetischen Textes unzulässig einschränken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Parallelismus. „Trümmerhaufen“ ist anschaulich, aber nicht umgangssprachlich. Die syntaktische Härte von „der Palast … ist keine Stadt mehr“ bleibt bewusst teilweise stehen, weil auch der hebräische Text an dieser Stelle komprimiert und mehrdeutig ist.
