source:
  edition: WLC
  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: de
  text: Denn die Hand Jahwes wird auf diesem Berg ruhen, und Moab wird an Ort und Stelle niedergetreten werden[a], wie Stroh im Wasser einer Dunggrube[b] niedergetreten wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »unter ihm« oder »darunter«; der Bezug des hebräischen Suffixes ist unsicher.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch einen Misthaufen oder eine Dungstätte bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Zusage und Gerichtsankündigung ein.
- source_word: תָנוּחַ
  choice: wird … ruhen
  rationale: Bewahrt das konkrete Bild der ruhenden Hand und lässt zugleich die Vorstellung von bleibender göttlicher Macht und Zuwendung offen.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Die hebräische Metapher für Gottes Macht und Handeln wird beibehalten; der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben.
- source_word: בָּהָר הַזֶּה
  choice: auf diesem Berg
  rationale: Gibt die Ortsangabe natürlich wieder und verweist im Zusammenhang auf den zuvor genannten Berg.
- source_word: וְנָדוֹשׁ
  choice: und … wird niedergetreten werden
  rationale: דושׁ kann das Treten beziehungsweise Dreschen bezeichnen. »Niedertreten« vermittelt hier die gewaltsame Erniedrigung und ermöglicht die Wiederholung desselben Verbs im Vergleich.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Form des Völker- und Gebietsnamens.
- source_word: תַּחְתָּיו
  choice: an seiner Stätte
  rationale: Der Bezug des pronominalen Suffixes ist unsicher. Die Wiedergabe drückt aus, dass Moab dort niedergetreten wird, wo es sich befindet, ohne einen eindeutigen Bezug des Pronomens vorzutäuschen; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: כְּהִדּוּשׁ
  choice: wie … niedergetreten wird
  rationale: Greift denselben deutschen Verbstamm wie beim vorherigen דושׁ auf und erhält so die Wiederholung und das körperliche Bild des Hebräischen.
- source_word: מַתְבֵּן
  choice: Stroh
  rationale: Klare und knappe Wiedergabe für Stroh beziehungsweise strohartiges Futter.
- source_word: בְמֵי
  choice: im Wasser
  rationale: Bezeichnet das Wasser beziehungsweise die Flüssigkeit als Ort oder Medium des Tretens.
- source_word: מַדְמֵנָה
  choice: einer Mistgrube
  rationale: Bezeichnet wahrscheinlich einen übel riechenden, mit Mist verbundenen Ort. »Mistgrube« bewahrt die anstößige Bildwirkung; mögliche Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben. »Jahwe« ist die im modernen Standarddeutschen übliche Form, ohne den Namen durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in תַּחְתָּיו
  choice: Moab wird an seiner Stätte niedergetreten
  alternative: Moab wird unter ihm beziehungsweise darunter niedergetreten
  rationale: Der hebräische Text legt den Bezug des Suffixes nicht eindeutig fest. Der Haupttext erhält den Gerichtssinn, während die Fußnote die formale Unbestimmtheit ausdrücklich sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung »niedergetreten« erhält die hebräische Wortwiederholung und das drastische Gerichtsbild. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
