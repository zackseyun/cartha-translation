source:
  edition: WLC
  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: de
  text: Wie Hitze in dürrem Land unterdrückst du den Lärm der Fremden; wie Hitze im Schatten einer Wolke wird der Gesang der Gewalttätigen gedämpft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das letzte hebräische Verb kann auch „antwortet“ bedeuten. Im Zusammenhang liegt jedoch der Sinn „wird erniedrigt“ oder „wird gedämpft“ nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב בְּצָיוֹן
  choice: Wie Hitze in dürrem Land
  rationale: חֹרֶב kann Hitze oder Dürre bezeichnen, צָיוֹן Trockenheit bzw. dürres Gebiet. „Hitze in dürrem Land“ bewahrt das Umweltbild und passt zum Schatten der Wolke im zweiten Vergleich.
- source_word: שְׁאוֹן זָרִים
  choice: den Lärm der Fremden
  rationale: שְׁאוֹן bezeichnet lautes Getöse oder feindlichen Tumult; „Lärm“ ist knapp und anschaulich. זָרִים meint Fremde bzw. Auswärtige und wird ohne zusätzliche nationale Festlegung wiedergegeben.
- source_word: תַּכְנִיעַ
  choice: bringst du … zum Verstummen
  rationale: Das Hifil von כנע bedeutet erniedrigen, unterwerfen oder niederzwingen. Auf den „Lärm“ bezogen gibt „zum Verstummen bringen“ die Wirkung idiomatisch wieder, ohne den direkten Gottesbezug der zweiten Person aufzugeben.
- source_word: בְּצֵל עָב
  choice: durch den Schatten einer Wolke
  rationale: צֵל bezeichnet Schatten, עָב eine dichte Wolke. „Durch“ gibt hier die abschwächende Wirkung des Wolkenschattens auf die Hitze wieder.
- source_word: זְמִיר עָרִיצִים
  choice: der Gesang der Gewalttätigen
  rationale: זְמִיר bedeutet Gesang oder Lied; עָרִיצִים bezeichnet rücksichtslose, gewalttätige Machthaber. „Gewalttätige“ hält den Gewaltaspekt fest, ohne vorschnell einen bestimmten politischen Titel einzutragen.
- source_word: יַעֲנֶה
  choice: wird … gedämpft
  rationale: Die Form ist schwierig und kann formal mit „antworten“ verbunden werden; der Parallelismus mit תַּכְנִיעַ und das Bild des die Hitze abschwächenden Wolkenschattens sprechen im Zusammenhang für das Niederhalten bzw. Dämpfen des triumphierenden Gesangs. Die passive Formulierung vermeidet einen im letzten Satzglied nicht ausdrücklich genannten Täter.
theological_decisions:
- issue: Gottes Anrede und Subjekt im letzten Satzglied
  choice: Die direkte Anrede bleibt in „bringst du … zum Verstummen“ erhalten; das letzte Satzglied wird passiv formuliert.
  alternative: „Du erniedrigst … du dämpfst …“ oder eine Wiedergabe des letzten Verbs mit „antwortet“.
  rationale: Der Kontext stützt die Anrede Gottes. Im letzten Satzglied nennt der hebräische Text jedoch kein unmissverständliches ausdrückliches Subjekt; das Passiv wahrt diese Offenheit und zugleich den poetischen Parallelismus.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Bildführung. „Zum Verstummen bringen“ und „gedämpft“ machen die Wirkung auf Lärm und Gesang natürlich verständlich; die Wiederholung von „Wie Hitze“ erhält den poetischen Parallelismus.
