  text: וּ/בִלַּע֙ בָּ/הָ֣ר הַ/זֶּ֔ה פְּנֵֽי הַ/לּ֥וֹט הַ/לּ֖וֹט עַל כָּל הָֽ/עַמִּ֑ים וְ/הַ/מַּסֵּכָ֥ה הַ/נְּסוּכָ֖ה עַל כָּל הַ/גּוֹיִֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: de
  text: Und auf diesem Berg wird er die Hülle verschlingen, die alle Völker verhüllt,[a][b] und den Schleier, der über alle Nationen gebreitet ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Leichentuch, das alle Völker umhüllt«. Im Hebräischen stehen hier verwandte Wörter für eine Umhüllung, die über den Menschen liegt.'
    reason: lexical_alternative
  - marker: b
    text: Die Hülle beziehungsweise der Schleier weist wahrscheinlich auf die Beseitigung des Todes im nächsten Vers voraus. Das Bild kann jedoch umfassender für das stehen, was über den Nationen liegt.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: wird er … verschlingen
  rationale: Das Verb בלע bedeutet wörtlich »verschlingen«. Die bildhafte Ausdrucksweise bleibt so erhalten, ebenso die Verbindung zu Vers 8, wo dasselbe Verb für die Beseitigung des Todes gebraucht wird.
- source_word: בָּהָר הַזֶּה
  choice: auf diesem Berg
  rationale: Die Ortsangabe bezeichnet den bereits im Zusammenhang genannten Berg; im Deutschen ist »auf diesem Berg« die natürliche Wiedergabe.
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: die Hülle …, die … verhüllt
  rationale: Die Wendung bezeichnet die über den Menschen liegende Hülle. »Hülle … verhüllt« bildet die Wiederholung verwandter Formen von לוט im Hebräischen in natürlichem Deutsch nach, ohne das Bild vorschnell auf ein Leichentuch einzuengen.
- source_word: עַל כָּל הָעַמִּים
  choice: alle Völker
  rationale: עַמִּים wird mit »Völker« wiedergegeben; das Verhältnis »über« ist in den Relativsatz »die … verhüllt« aufgenommen.
- source_word: וְהַמַּסֵּכָה
  choice: und den Schleier
  rationale: מַסֵּכָה bezeichnet hier aufgrund des Parallelismus keine gegossene Götterfigur, sondern etwas, das bedeckend über den Nationen liegt. »Schleier« bewahrt das textile Bild und unterscheidet zugleich die parallelen Ausdrücke.
- source_word: הַנְּסוּכָה
  choice: der … gebreitet ist
  rationale: Das passive Partizip beschreibt hier einen über etwas ausgebreiteten oder gelegten Schleier. »Gebreitet« ist bildhaft und im Deutschen verständlich.
- source_word: עַל כָּל הַגּוֹיִם
  choice: über alle Nationen
  rationale: גּוֹיִם wird mit »Nationen« wiedergegeben, damit die poetische Entsprechung zu »Völker« erhalten bleibt.
theological_decisions:
- issue: Wesen der beseitigten Bedeckung
  choice: Eine bildhafte Hülle beziehungsweise ein Schleier über allen Völkern und Nationen
  alternative: Ein ausdrücklich als Leichentuch verstandenes Tuch oder ein ausschließliches Sinnbild geistlicher Blindheit beziehungsweise der Schande
  rationale: Vers 8 legt eine Beziehung zum Tod nahe, doch Vers 7 selbst lässt das Bild weiter gefasst. Der Haupttext bewahrt diese Offenheit; die Fußnote weist auf den Zusammenhang hin, ohne ihn zur einzigen Deutung zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Metapher des Verschlingens sowie die poetische Parallelität von »Völker« und »Nationen« bleiben erhalten; die Wortverwandtschaft im Hebräischen wird durch »Hülle … verhüllt« hörbar gemacht.
