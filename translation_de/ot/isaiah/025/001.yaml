id: ISA.25.1
reference: Isaiah 25:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹהַ/י֙ אַתָּ֔ה אֲרֽוֹמִמְ/ךָ֙ אוֹדֶ֣ה שִׁמְ/ךָ֔ כִּ֥י עָשִׂ֖יתָ פֶּ֑לֶא עֵצ֥וֹת מֵֽ/רָח֖וֹק אֱמ֥וּנָה אֹֽמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: de
  text: Jahwe, du bist mein Gott! Ich will dich erheben, ich will deinen Namen preisen; denn du hast Wunderbares vollbracht. Deine Pläne von alters her sind verlässlich und gewiss.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und unter Beibehaltung der knappen hebräischen Satzform auch: »denn du hast ein Wunder vollbracht – Pläne aus ferner Zeit, Treue und Festigkeit.« Der Schluss kann unterschiedlich gegliedert werden; in jedem Fall betont er die Verlässlichkeit der seit Langem bestehenden Pläne Gottes.'
    reason: Der hebräische Schluss ist poetisch verdichtet; sowohl der Bezug der letzten beiden Substantive als auch die zeitliche beziehungsweise formal räumliche Nuance von מֵרָחוֹק verdienen eine transparente Alternative.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form enthält das Possessivsuffix der ersten Person Singular.
- source_word: אֲרוֹמִמְךָ
  choice: ich will dich erheben
  rationale: Die Wendung bewahrt das Bild des Erhöhens und bezeichnet hier die ehrende, preisende Erhebung Gottes.
- source_word: אוֹדֶה שִׁמְךָ
  choice: ich will deinen Namen preisen
  rationale: ידה bezeichnet hier im parallelen Lobpreis das Preisen beziehungsweise Danken; der ausdrücklich genannte »Name« bleibt erhalten.
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: denn du hast Wunderbares vollbracht
  rationale: Das singularische פֶּלֶא kann qualitativ oder kollektiv verstanden werden; »Wunderbares« wahrt den Singularcharakter, ohne nur eine einzige Tat festzulegen.
- source_word: עֵצוֹת מֵרָחוֹק
  choice: Pläne von alters her
  rationale: עֵצוֹת bezeichnet hier göttliche Pläne oder Ratschlüsse; מֵרָחוֹק wird im Zusammenhang zeitlich als Herkunft aus ferner Vergangenheit verstanden.
- source_word: אֱמוּנָה אֹמֶן
  choice: verlässlich und gewiss
  rationale: Die beiden eng verwandten Begriffe bezeichnen Treue, Festigkeit und Zuverlässigkeit. Die adjektivische Wiedergabe macht im Deutschen verständlich, dass die alten Pläne als zuverlässig und fest charakterisiert werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Hebräischen ausdrücklich stehende Eigenname wird als Gottesname bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Zeitliche oder räumliche Bedeutung von מֵרָחוֹק
  choice: 'zeitlich: »von alters her«'
  alternative: 'räumlich: »aus der Ferne«'
  rationale: 'Im Zusammenhang mit den göttlichen Plänen liegt die zeitliche Bedeutung nahe: Die vollbrachten Wundertaten entsprechen lange zuvor gefassten Ratschlüssen.'
- issue: Bezug und Form von אֱמוּנָה אֹמֶן
  choice: Charakterisierung der Pläne als »verlässlich und gewiss«
  alternative: 'substantivisch und appositionell: »Treue und Festigkeit«'
  rationale: Der hebräische Schluss ist stark verdichtet. Die Hauptfassung bezieht die beiden Begriffe auf die alten Pläne, ohne ihre Zuverlässigkeit und Festigkeit zu einem einzigen Begriff zusammenzuziehen; die Fußnote hält die formale und syntaktische Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Lobpreissprache. »Von alters her« ist bewusst leicht gehoben, aber allgemein verständlich und trägt den poetischen Ton. Die Aufteilung in zwei Sätze löst die hebräische Verdichtung lesbar auf; die Fußnote dokumentiert die genuine syntaktische Mehrdeutigkeit.
