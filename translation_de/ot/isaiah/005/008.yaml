id: ISA.5.8
reference: Isaiah 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֗וֹי מַגִּיעֵ֥י בַ֨יִת֙ בְּ/בַ֔יִת שָׂדֶ֥ה בְ/שָׂדֶ֖ה יַקְרִ֑יבוּ עַ֚ד אֶ֣פֶס מָק֔וֹם וְ/הֽוּשַׁבְתֶּ֥ם לְ/בַדְּ/כֶ֖ם בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: de
  text: Wehe denen, die Haus an Haus fügen und Feld an Feld rücken, bis kein Platz mehr übrig ist und ihr allein mitten im Land angesiedelt seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass nur noch ihr mitten im Land wohnt“. Das Hebräische wechselt hier unvermittelt in die direkte Anrede und verwendet eine passive beziehungsweise kausative Verbform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Weheruf ein und bewahrt sowohl den Anklage- als auch den Warnton.
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: die Haus an Haus fügen
  rationale: Das Partizip bezeichnet wörtlich Menschen, die ein Haus das andere berühren lassen. „Haus an Haus fügen“ gibt die fortgesetzte Zusammenlegung von Besitz natürlich und bildhaft wieder.
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: Feld an Feld rücken
  rationale: Das Verb bedeutet „nahe bringen“. Die Formulierung wahrt das vom ersten Satzglied verschiedene hebräische Verb und bezeichnet hier das Zusammenziehen angrenzender Grundstücke.
- source_word: עַד אֶפֶס מָקוֹם
  choice: bis kein Platz mehr übrig ist
  rationale: Gibt das Ergebnis der unaufhörlichen Besitzanhäufung in klarem, gegenwärtigem Deutsch wieder.
- source_word: וְהוּשַׁבְתֶּם
  choice: und ihr … angesiedelt seid
  rationale: Bewahrt die passive beziehungsweise kausative Form und den auffälligen Wechsel von der dritten zur zweiten Person Plural.
- source_word: לְבַדְּכֶם בְּקֶרֶב הָאָרֶץ
  choice: allein mitten im Land
  rationale: „Allein“ erhält den Gedanken des ausschließlichen Besitzes; „mitten im Land“ bildet die räumliche Wendung בקרב הארץ knapp ab.
