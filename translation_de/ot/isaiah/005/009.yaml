base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: de
  text: 'Vor meinen Ohren hat Jahwe der Heere geschworen[a]: »Ganz gewiss werden viele Häuser zur Einöde werden; selbst große und prächtige Häuser werden ohne Bewohner sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »In meinen Ohren Jahwe der Heere: Wenn nicht …« „In meinen Ohren“ ist ein hebräisches Idiom dafür, dass Jesaja dies unmittelbar hörte. Die verkürzte Formel „wenn nicht“ dient hier als nachdrückliche Schwurformel; daher: „hat … geschworen: Ganz gewiss“.'
    reason: textual_clarification
lexical_decisions:
- source_word: בְּאָזְנַי
  choice: In meinen Ohren
  rationale: 'Die konkrete hebräische Wendung bewahrt die feierliche Unmittelbarkeit: Jesaja hat die Botschaft selbst gehört.'
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heere“ macht den pluralischen Titel צְבָאוֹת im heutigen Deutsch verständlich.
- source_word: אִם לֹא
  choice: Ganz gewiss
  rationale: In diesem Schwurzusammenhang ist die wörtlich konditionale Formel eine nachdrückliche Bekräftigung mit unausgesprochener Selbstverwünschung.
- source_word: בָּתִּים רַבִּים
  choice: viele Häuser
  rationale: Gemeint sind im Zusammenhang die konkreten Häuser der wohlhabenden Grundbesitzer, nicht vorrangig ihre Familienverbände.
- source_word: לְשַׁמָּה יִהְיוּ
  choice: werden zur Einöde
  rationale: Die Formulierung erhält den nominalen Charakter von שַׁמָּה und bezeichnet das Ergebnis des angekündigten Gerichts.
- source_word: גְּדֹלִים וְטוֹבִים
  choice: große und prächtige Häuser
  rationale: גְּדֹלִים bezeichnet ihre Größe; טוֹבִים hebt hier ihre hohe Qualität und ansehnliche Ausstattung hervor.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne Bewohner
  rationale: Die knappe deutsche Wendung bewahrt das eindringliche Bild vollständiger Entvölkerung.
theological_decisions:
- issue: Wiedergabe des Gottestitels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Der Text nennt den Gottesnamen ausdrücklich. Die Übersetzung bewahrt ihn als Eigennamen und gibt zugleich צְבָאוֹת als Herrschaft über die Heere wieder, ohne den Namen durch einen Titel zu ersetzen.
- issue: Explizites Schwurverb
  choice: hat … geschworen
  alternative: 'sprach …: „Wenn nicht …“'
  rationale: Im Hebräischen steht kein ausdrückliches Verb für „schwören“; אִם לֹא ist jedoch eine feste Schwurformel. Das ergänzte Verb macht ihre Funktion verständlich, während die Fußnote die sprachliche Ellipse offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Eindringlichkeit. Die hebräische Ohren-Metapher und die knappe Schilderung der Entvölkerung bleiben erhalten; die elliptische Schwurformel wird im Haupttext verständlich entfaltet und in der Fußnote transparent gemacht.
