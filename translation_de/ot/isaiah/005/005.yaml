  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: de
  text: 'Und nun will ich euch doch wissen lassen, was ich mit meinem Weinberg tun werde: Ich werde seine Hecke entfernen, sodass er abgeweidet wird[a]; ich werde seine Mauer niederreißen, sodass er zertreten wird[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass er verzehrt wird“; möglicherweise auch: „sodass er verbrannt wird“. Wörtlich steht eine Wendung wie „und er wird zum Abweiden/Verzehren sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er wird zum Zertreten sein“ beziehungsweise „zu einem Ort des Zertretens werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an das Vorangehende als auch den zeitlichen Übergang.
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: will ich euch wissen lassen
  rationale: Gibt den Hifil von ידע als Bekanntmachen wieder. נָא verleiht der Aufforderung eine höfliche bzw. eindringliche Nuance, die im Deutschen hier durch die einladende Formulierung ausgedrückt wird, ohne ein unnatürliches „bitte“ in die Gerichtsankündigung einzufügen.
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: was ich mit meinem Weinberg tun werde
  rationale: Das Partizip bezeichnet im Zusammenhang das unmittelbar bevorstehende Handeln; „mit meinem Weinberg“ ist im Deutschen die natürliche Verbindung mit „tun“.
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: Ich entferne seine Hecke
  rationale: Der Infinitivus absolutus kündigt die entschlossene erste Handlung an. „Hecke“ bezeichnet die schützende Einfriedung und bleibt von der anschließend genannten Mauer unterschieden.
- source_word: וְהָיָה לְבָעֵר
  choice: sodass er dem Fraß preisgegeben wird
  rationale: Die Ergebniskonstruktion beschreibt, was nach dem Entfernen der Hecke mit dem Weinberg geschieht. Im Weinbergbild liegt das Abweiden bzw. Verzehren nahe; die mögliche weitere Bedeutung „verbrennen/vernichten“ wird in der Fußnote offengehalten.
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: ich reiße seine Mauer nieder
  rationale: פרץ bezeichnet das Aufbrechen oder Niederreißen einer Begrenzung; „Mauer“ wahrt den Unterschied zur zuvor genannten Hecke.
- source_word: וְהָיָה לְמִרְמָס
  choice: sodass er zertreten wird
  rationale: Die nominale Ergebniskonstruktion wird als natürliches deutsches Passiv wiedergegeben; die wörtlichere substantivische Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Das Weinbergbild als Gerichtsankündigung
  choice: Das landwirtschaftliche Bild bleibt im Haupttext ohne ausdrückliche Deutung stehen.
  alternative: Den Weinberg bereits in diesem Vers ausdrücklich mit Israel oder Juda gleichsetzen.
  rationale: Der unmittelbare Zusammenhang erklärt das Bild, doch dieser Vers selbst formuliert das Gericht weiterhin innerhalb der Weinbergmetapher. Eine Ausdeutung im Haupttext würde über den Wortlaut hinausgehen.
- issue: Art der Zerstörung nach Entfernung der Hecke
  choice: „dem Fraß preisgegeben“ als im Bildzusammenhang naheliegende Wiedergabe, mit Hinweis auf die lexikalische Alternative
  alternative: „verbrannt“ oder allgemeiner „vernichtet“
  rationale: Das Entfernen der schützenden Hecke legt das Eindringen und Abweiden nahe; zugleich lässt בער eine auf Verbrennen oder Vernichten bezogene Deutung zu, die nicht stillschweigend ausgeschlossen werden soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten die Entschiedenheit der angekündigten Handlungen; „Hecke“ und „Mauer“ bleiben als zwei verschiedene Schutzvorrichtungen erkennbar. Die Präsensformen nach der Zukunftsankündigung wirken im Deutschen als anschauliche, fest beschlossene Vorhaben.
