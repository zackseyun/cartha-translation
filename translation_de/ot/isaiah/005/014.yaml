base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: de
  text: Darum hat die Scheol ihren Rachen weit gemacht[a] und ihren Mund grenzenlos aufgesperrt[b]. Ihre Pracht, ihre Menge, ihr Getöse und wer in ihr ausgelassen jubelt, fahren hinab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hat ihre Kehle/ihre Seele weit gemacht“; gemeint sein kann auch: „hat ihre Gier vergrößert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne jedes Maß“ beziehungsweise „ohne Grenze“.'
    reason: lexical_alternative
  - marker: c
    text: Scheol bezeichnet das Totenreich. Hier wird sie als verschlingende Gestalt dargestellt. Die weiblichen Fürwörter in der zweiten Satzhälfte beziehen sich wahrscheinlich auf die im Zusammenhang vorausgesetzte Stadt und ihre Bevölkerung.
    reason: cultural_and_referential_note
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: Scheol
  rationale: Die Umschrift bewahrt die alttestamentliche Vorstellung vom Totenreich und dessen Personifizierung, statt sie auf Grab oder abstrakten Tod zu verengen.
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: hat ihren Rachen weit gemacht
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang mit dem geöffneten Mund den gierig verschlingenden Rachen; die konkrete Körpermetapher bleibt erhalten.
- source_word: וּפָעֲרָה פִיהָ
  choice: und ihren Mund ... aufgesperrt
  rationale: „Aufgesperrt“ gibt das gewaltsame, weit klaffende Öffnen des Mundes anschaulich und idiomatisch wieder.
- source_word: לִבְלִי חֹק
  choice: grenzenlos
  rationale: חֹק hat in dieser Verbindung die Bedeutung einer festgesetzten Grenze; „grenzenlos“ wahrt den poetischen Sinn ohne einen irreführenden gesetzlichen Beiklang.
- source_word: וְיָרַד
  choice: fahren ... hinab
  rationale: Das Präsens gibt die prophetisch als gewiss dargestellte Bewegung lebendig wieder; „hinabfahren“ ist im Deutschen die natürliche biblisch-poetische Bezeichnung für den Weg in die Scheol.
- source_word: הֲדָרָהּ
  choice: ihre Pracht
  rationale: Die Wiedergabe umfasst Herrlichkeit, Glanz und gesellschaftliche Größe, ohne die Referenz unnötig einzuengen.
- source_word: הֲמוֹנָהּ
  choice: ihre Menge
  rationale: „Menge“ bewahrt den kollektiven Bezug auf die Menschenmasse und ist in modernem Deutsch natürlich.
- source_word: שְׁאוֹנָהּ
  choice: ihr Getöse
  rationale: „Getöse“ vermittelt den lauten, ausgelassenen Tumult, der im Gericht verstummt.
- source_word: וְעָלֵז בָּהּ
  choice: und wer in ihr ausgelassen jubelt
  rationale: Die singularische Form bleibt durch „wer“ erkennbar; „ausgelassen jubelt“ bringt die selbstsichere, festliche Freude zum Ausdruck, ohne sie ausdrücklich als Hochmut zu deuten.
theological_decisions:
- issue: Wiedergabe von שְּׁאוֹל im poetischen Gerichtswort
  choice: Scheol
  alternative: Totenreich; Grab; Tod
  rationale: „Scheol“ hält das Totenreich als personifizierte, unersättlich verschlingende Macht präsent und vermeidet eine dogmatische oder sachliche Verengung.
- issue: Bezug der femininen Suffixe in der Schlusszeile
  choice: Das mehrdeutige Pronomen „ihre/ihr“ bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: Ausdrückliche Ergänzung „Jerusalems“ oder „der Stadt“
  rationale: Der unmittelbare hebräische Wortlaut nennt die Bezugsgröße nicht ausdrücklich. Wahrscheinlich ist die im Kontext vorausgesetzte Stadt beziehungsweise ihre Bevölkerung gemeint; eine Festlegung im Haupttext würde die syntaktische Spannung glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildkraft. „Scheol“ wird als erklärungsbedürftiger Quellenbegriff beibehalten; „Rachen“, „aufgesperrt“, „Getöse“ und „hinabfahren“ tragen den kräftigen Gerichtscharakter. Die ungewöhnliche Reihung mit singularischem „wer“ folgt der hebräischen Spannung, während der deutsche Plural „fahren“ zur zusammengesetzten Subjektgruppe passt.
