id: ISA.5.11
reference: Isaiah 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: de
  text: Wehe denen, die früh am Morgen aufstehen, um berauschendem Getränk nachzujagen, und bis in die Abenddämmerung[a] hinein aufbleiben, während der Wein sie erhitzt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann die Dämmerung bezeichnen, je nach Zusammenhang auch die Morgen- oder Abenddämmerung. Hier legt der Gegensatz zum frühen Morgen die Abenddämmerung nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Weheruf ein und bewahrt sowohl den klagenden als auch den gerichtlichen Ton.
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: die früh am Morgen aufstehen
  rationale: Gibt das Partizip von שׁכם und die Zeitangabe natürlich und vollständig wieder.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Bezeichnet ein alkoholisches Rauschgetränk, das nicht notwendig Wein und erst recht nicht speziell moderner Branntwein ist; die Formulierung bleibt daher bewusst allgemein.
- source_word: יִרְדֹּפוּ
  choice: nachzujagen
  rationale: Bewahrt das lebhafte Bild des eifrigen Verfolgens und fügt sich idiomatisch in die deutsche Infinitivkonstruktion ein.
- source_word: מְאַחֲרֵי בַנֶּשֶׁף
  choice: bis in die Abenddämmerung hineinbleiben
  rationale: Drückt das lange Verweilen bis in die späte Tageszeit aus; im Zusammenhang bildet die Abenddämmerung den natürlichen Gegensatz zum frühen Morgen.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und eindeutige Entsprechung.
- source_word: יַדְלִיקֵם
  choice: der Wein sie erhitzt
  rationale: Bewahrt das Bild des Entzündens beziehungsweise Erhitzens und beschreibt zugleich verständlich die Wirkung des Weins.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Weheruf und das Bild des Nachjagens bleiben kräftig; „berauschendes Getränk“ vermeidet die irreführende Festlegung auf destillierte Spirituosen. Die Metapher des Erhitzens durch Wein wird erhalten.
