  source_fidelity: Die erste Frage gibt die rhetorische Aussage grundsätzlich treffend wieder. „Was hätte ich noch … tun sollen“ fügt jedoch eine Sollensnuance ein, die im Hebräischen nicht ausgedrückt ist; die Frage betrifft vielmehr, was noch zu tun übrig gewesen wäre. Im zweiten Satz sollte die deutsche Syntax klarer abbilden, dass gefragt wird, warum der Sprecher Traubenertrag erwartete, während tatsächlich בְּאֻשִׁים hervorkamen.
  naturalness: „das ich nicht an ihm getan habe“ ist im heutigen Standarddeutsch grammatisch falsch; nach dem sächlichen Bezugswort „Was“ muss „was ich nicht an ihm getan habe“ stehen. Eine Umstellung des zweiten Satzes macht die rhetorische Gegenüberstellung natürlicher und eindeutiger.
  terminology: „Weinberg“ und „Trauben“ sind angemessen. „Schlechte Trauben“ ist als kontextuelle Wiedergabe von בְּאֻשִׁים vertretbar, sofern die Fußnote die Bedeutung als üble bzw. unbrauchbare Frucht absichert. Die Bildsprache wird korrekt nicht ausgelegt.
