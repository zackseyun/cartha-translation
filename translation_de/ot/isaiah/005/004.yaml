base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: de
  text: Was hätte ich noch für meinen Weinberg tun können, was ich nicht an ihm getan habe? Warum erwartete ich, dass er Trauben hervorbringen würde, doch er brachte schlechte Trauben hervor?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbrauchbare Trauben“; das hebräische Wort bezeichnet üble, nicht brauchbare Frucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: Was hätte ich noch … tun sollen
  rationale: Die rhetorische Frage betrifft eine noch mögliche oder ausstehende Handlung. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne ausdrücklich ein Unvermögen zu behaupten.
- source_word: לְכַרְמִי
  choice: für meinen Weinberg
  rationale: לְ bezeichnet hier die dem Weinberg zugutekommende Fürsorge; כֶּרֶם bedeutet schlicht „Weinberg“.
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  choice: das ich nicht an ihm getan habe
  rationale: Das Perfekt bezeichnet das bereits Getane; בּוֹ wird mit „an ihm“ idiomatisch und zugleich nah am hebräischen Bild wiedergegeben.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die direkte Frage nach dem Grund wird im Deutschen natürlich mit „Warum“ ausgedrückt.
- source_word: קִוֵּיתִי
  choice: ich … erwartete
  rationale: קוה kann „hoffen“, „warten“ oder „erwarten“ bedeuten. Im landwirtschaftlichen Zusammenhang steht das erwartete Ergebnis im Vordergrund.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: Trauben
  rationale: עשה bezeichnet bei einem Gewächs das Hervorbringen eines Ertrags; עֲנָבִים sind Trauben. Die deutsche Satzkonstruktion verbindet dies natürlich mit „hervorbringen“.
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: brachte er … schlechte Trauben hervor
  rationale: עשה wird im landwirtschaftlichen Kontext mit „hervorbringen“ wiedergegeben. בְּאֻשִׁים bezeichnet üble, unbrauchbare Frucht; „schlechte Trauben“ erhält den Gegensatz zu den erwarteten Trauben, ohne eine botanische Aussage über Wildwuchs einzutragen.
theological_decisions:
- issue: Bild vom Weinberg
  choice: „Weinberg“ bleibt im Haupttext als Bild stehen und wird hier nicht auf Israel oder das Volk ausgelegt.
  alternative: Das Bild im Vers ausdrücklich als Israel beziehungsweise Gottes Volk deuten.
  rationale: Der unmittelbare Vers spricht bildhaft vom Weinberg; die Deutung folgt im Zusammenhang. Eine Erweiterung im Vers würde die Metapher vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rhetorischer Klarheit. Die Wiederholung des Motivs „Trauben“ bleibt erhalten; die ungewöhnliche Fruchtbezeichnung wird knapp erläutert.
