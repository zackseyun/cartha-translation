base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
translation:
  language: de
  text: Wehe denen, die in ihren eigenen Augen weise und in ihrem eigenen Urteil verständig sind![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einsichtig“ statt „verständig“. Das hebräische Wort bezeichnet Verstand und die Fähigkeit, etwas richtig zu unterscheiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Interjektion kündigt Unheil an und verbindet Klage mit Anklage; „Wehe“ bewahrt diesen kräftigen Gerichtston.
- source_word: חֲכָמִים
  choice: weise
  rationale: Das Wort bezeichnet hier Menschen, die sich selbst Weisheit zuschreiben; nach „denen, die“ ist die adjektivische Wiedergabe natürlich.
- source_word: בְּעֵינֵיהֶם
  choice: in ihren eigenen Augen
  rationale: Die hebräische Wendung bezeichnet die eigene Einschätzung; „eigenen“ verdeutlicht im Deutschen ihren reflexiven Sinn.
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: vor sich selbst
  rationale: Die Formulierung bedeutet wörtlich etwa „vor ihrem Angesicht“. „Vor sich selbst“ bleibt näher am Bild des Hebräischen und erhält den Parallelismus zur Selbsteinschätzung im ersten Halbvers.
- source_word: נְבֹנִים
  choice: verständig
  rationale: Das Wort bezeichnet Einsicht, Verstand und Unterscheidungsvermögen. „Verständig“ ist würdig und verständlich und bildet ein natürliches Begriffspaar mit „weise“.
