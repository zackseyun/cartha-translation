  text: אָשִׁ֤ירָה נָּא֙ לִֽ/ידִידִ֔/י שִׁירַ֥ת דּוֹדִ֖/י לְ/כַרְמ֑/וֹ כֶּ֛רֶם הָיָ֥ה לִֽ/ידִידִ֖/י בְּ/קֶ֥רֶן בֶּן שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: de
  text: 'Ich will doch für meinen Freund ein Lied meines Geliebten über seinen Weinberg singen: Mein Freund hatte einen Weinberg auf einem fruchtbaren Hügel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einem Horn, einem Sohn des Öls“; ein hebräisches Bild für einen fruchtbaren Hügel.'
    reason: Das bildhafte hebräische Idiom wird im Haupttext sinngemäß wiedergegeben und hier in seiner wörtlichen Form dokumentiert.
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: Ich will doch … singen
  rationale: Der Kohortativ der 1. Person Singular drückt eine Absicht oder Selbstaufforderung aus. „Ich will … singen“ gibt dies im Deutschen natürlich wieder; „doch“ nimmt die bittende bzw. nachdrückliche Nuance von נָא auf, ohne das hier unnatürliche „bitte“ zu erzwingen.
- source_word: לִידִידִי
  choice: für meinen Freund / Mein Freund
  rationale: לְ bezeichnet zunächst die Person, für die bzw. zu deren Ehren gesungen wird. יָדִיד bezeichnet einen nahestehenden, geliebten Freund. „Freund“ wahrt zugleich den Unterschied zum folgenden דּוֹדִי.
- source_word: שִׁירַת דּוֹדִי
  choice: das Lied meines Geliebten
  rationale: Die Constructusverbindung bezeichnet ein dem Geliebten zugeordnetes Lied. „Geliebter“ bewahrt die poetische Beziehungsnähe von דּוֹד und unterscheidet es vom ebenfalls beziehungsreichen יָדִיד.
- source_word: לְכַרְמוֹ
  choice: über seinen Weinberg
  rationale: לְ markiert hier das Thema des Liedes. „Über“ ist dafür im modernen Deutschen klar und idiomatisch.
- source_word: כֶּרֶם הָיָה לִידִידִי
  choice: Mein Freund hatte einen Weinberg
  rationale: Die wörtliche Besitzkonstruktion „Ein Weinberg war meinem Freund“ wird im Deutschen idiomatisch mit „hatte“ wiedergegeben.
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: auf einem fruchtbaren Hügel
  rationale: קֶרֶן bedeutet wörtlich „Horn“, wird hier aber topografisch für eine Anhöhe gebraucht; בֶּן־שֶׁמֶן („Sohn des Öls/Fettes“) beschreibt bildhaft ihre Fruchtbarkeit. Die Hauptzeile gibt den Sinn natürlich wieder, die Fußnote bewahrt das hebräische Bild.
theological_decisions:
- issue: Identität des Freundes beziehungsweise Geliebten
  choice: Die poetischen Bezeichnungen bleiben ohne ausdrückliche Identifizierung stehen.
  alternative: Den Freund beziehungsweise Geliebten bereits hier ausdrücklich mit dem HERRN gleichsetzen.
  rationale: Der einzelne Vers eröffnet das Weinberglied, ohne die Identität schon ausdrücklich offenzulegen. Die Übersetzung bewahrt diese literarische und theologische Spannung, bis der weitere Zusammenhang sie entfaltet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. Die unterschiedlichen hebräischen Wörter יָדִיד und דּוֹד werden durch „Freund“ und „Geliebter“ kenntlich gemacht. Der Fußnotenmarker steht unmittelbar bei der sinngemäßen Wiedergabe des hebräischen Hügel-Idioms.
