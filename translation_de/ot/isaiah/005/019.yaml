source:
  edition: WLC
  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: de
  text: 'die sagen: »Er soll sich beeilen; er soll sein Werk beschleunigen, damit wir es sehen. Der Plan[a] des Heiligen Israels soll herannahen und kommen, damit wir ihn erkennen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Ratschluss des Heiligen Israels.'
    reason: Lexikalische Alternative für עֲצַת; das Wort kann einen Plan, Beschluss oder Ratschluss bezeichnen.
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: die sagen
  rationale: Das Partizip setzt die Beschreibung der zuvor genannten Menschen fort. „die sagen“ schließt natürlich an den vorangehenden Vers an.
- source_word: יְמַהֵר
  choice: Er soll sich beeilen
  rationale: Die Form hat hier auffordernden, spöttisch-herausfordernden Sinn. Die Wendung lässt den Bezug auf Gott wie im Hebräischen zunächst indirekt.
- source_word: יָחִישָׁה מַעֲשֵׂהוּ
  choice: er soll sein Werk beschleunigen
  rationale: Die Übersetzung bewahrt die rhetorische Verdoppelung mit dem vorherigen Verb und gibt מַעֲשֵׂהוּ allgemein als Gottes Werk beziehungsweise Handeln wieder.
- source_word: לְמַעַן נִרְאֶה
  choice: damit wir es sehen
  rationale: Der Zwecksatz wird direkt wiedergegeben; „es“ nimmt verständlich „sein Werk“ auf.
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: soll näher kommen und eintreffen
  rationale: Beide hebräischen Verben bleiben erhalten, sodass die steigernde Parallelität nicht eingeebnet wird.
- source_word: עֲצַת
  choice: der Plan
  rationale: „Plan“ ist gegenwärtiges, gut verständliches Deutsch und bezeichnet hier die beabsichtigte Handlung; „Ratschluss“ bleibt als mögliche formellere Wiedergabe in der Fußnote erhalten.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: des Heiligen Israels
  rationale: Die in Jesaja charakteristische Gottesbezeichnung wird in ihrer etablierten und theologisch gewichtigen Form wiedergegeben.
- source_word: וְנֵדָעָה
  choice: damit wir ihn erkennen
  rationale: Die Form setzt die spöttische Forderung fort. Das Pronomen bezieht sich grammatisch natürlich auf „Plan“ und gibt das im Deutschen nötige Objekt an.
theological_decisions:
- issue: Bezug der Verben und des Suffixes in der dritten Person Singular
  choice: Die Redenden fordern Gott spöttisch dazu heraus, rasch zu handeln.
  alternative: Der Bezug könnte bei isolierter Betrachtung als unbestimmtes „er“ offener bleiben.
  rationale: „sein Werk“ und „der Plan des Heiligen Israels“ machen im Zusammenhang Gott zum Bezugspunkt. Die Übersetzung ersetzt das Pronomen dennoch nicht ausdrücklich durch „Gott“ und bewahrt so die rhetorische Distanz des Hebräischen.
- issue: Bedeutung von עֲצַת
  choice: der Plan des Heiligen Israels
  alternative: der Ratschluss des Heiligen Israels
  rationale: „Plan“ vermittelt die göttliche Absicht in klarem modernem Deutsch, ohne die lexikalische Spannweite unnötig zu verengen; die formellere Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Aufforderungen und beide Bewegungsverben bewahren den spöttischen Nachdruck sowie die Parallelität des Hebräischen. Der Semikolon trennt die beiden eng verbundenen Aufforderungen klar.
