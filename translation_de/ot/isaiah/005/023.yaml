  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
translation:
  language: de
  text: die einen Schuldigen für ein Bestechungsgeld[a] freisprechen und jedem Gerechten sein Recht[b] entziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die einen Frevler wegen eines Bestechungsgeschenks für gerecht erklären.'
    reason: Lexikalische Alternative; מַצְדִּיקֵי kann wörtlicher „für gerecht erklären“ und רָשָׁע auch „Frevler“ heißen.
  - marker: b
    text: 'Oder: „seine Gerechtigkeit“ oder „seinen Rechtsanspruch“. Wörtlich steht am Ende „von ihm“; das maskuline Singularsuffix kann distributiv auf jeden Gerechten bezogen sein.'
    reason: Erläutert die juristischen und ethischen Bedeutungsmöglichkeiten von צְדָקָה sowie das distributiv verstandene maskuline Singularsuffix מִמֶּנּוּ.
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: die … freisprechen
  rationale: Das Hifil-Partizip von צדק bezeichnet im gerichtlichen Zusammenhang das Erklären für gerecht beziehungsweise den Freispruch. „Freisprechen“ gibt diesen forensischen Sinn in natürlichem Deutsch wieder.
- source_word: רָשָׁע
  choice: einen Schuldigen
  rationale: Das substantivierte Singularadjektiv kann „einen Frevler“ oder im Rechtskontext „einen Schuldigen“ bedeuten. „Schuldigen“ verdeutlicht den gerichtlichen Gegensatz, ohne eine moralische Umwandlung anzudeuten.
- source_word: עֵקֶב שֹׁחַד
  choice: gegen Bestechung
  rationale: Die Wendung bezeichnet den Bestechungslohn als Beweggrund beziehungsweise Gegenleistung für das korrupte Urteil. „Gegen Bestechung“ ist knapp und idiomatisch.
- source_word: וְצִדְקַת
  choice: und … ihre Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit, Recht oder berechtigten Anspruch bezeichnen. „Gerechtigkeit“ bewahrt die Wortstammverbindung zu צדק und lässt die moralische wie die rechtliche Dimension bestehen.
- source_word: צַדִּיקִים
  choice: den Gerechten
  rationale: Das substantivierte Pluraladjektiv bildet den direkten moralisch-rechtlichen Gegensatz zum Schuldigen.
- source_word: יָסִירוּ
  choice: nehmen
  rationale: Das Hifil von סור bedeutet „entfernen, wegnehmen“. In der Konstruktion „jemandem etwas nehmen“ wird die rechtliche Beraubung im Deutschen klar und natürlich ausgedrückt.
- source_word: מִמֶּנּוּ
  choice: jeweils ihre
  rationale: Der masoretische Text hat ein maskulines Singularsuffix, obwohl zuvor „die Gerechten“ im Plural steht. „Jeweils“ gibt dessen distributive Kraft wieder; das deutsche Possessivpronomen richtet sich grammatisch nach dem Plural.
theological_decisions:
- issue: Bedeutung von צְדָקָה in einer Anklage gegen korrupte Rechtsprechung
  choice: Gerechtigkeit
  alternative: Recht / Rechtsanspruch
  rationale: Der Kontext ist eindeutig juristisch, doch „Gerechtigkeit“ bewahrt zugleich die ethisch-theologische Weite und die Wortstammbeziehung zwischen dem Freisprechen und den Gerechten. Die Fußnote nennt die engeren juristischen Möglichkeiten.
- issue: Singularsuffix nach dem pluralischen צַדִּיקִים
  choice: 'distributiv: „den Gerechten jeweils ihre …“'
  alternative: 'wörtlich: „die Gerechtigkeit der Gerechten von ihm wegnehmen“'
  rationale: Die Wiedergabe wahrt die distributive Einzelbeziehung des Singularsuffixes, ohne im Deutschen einen grammatisch unklaren Bezug mit „von ihm“ zu erzeugen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der parallele Gegensatz zwischen dem korrupten Freispruch des Schuldigen und der Entrechtung der Gerechten bleibt erhalten. „Gerechtigkeit“ bewahrt bewusst die lexikalische und theologische Spannung; die Fußnote erschließt den engeren juristischen Sinn.
