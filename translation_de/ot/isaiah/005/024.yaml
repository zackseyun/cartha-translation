source:
  edition: WLC
  text: לָ/כֵן֩ כֶּ/אֱכֹ֨ל קַ֜שׁ לְשׁ֣וֹן אֵ֗שׁ וַ/חֲשַׁ֤שׁ לֶֽהָבָה֙ יִרְפֶּ֔ה שָׁרְשָׁ/ם֙ כַּ/מָּ֣ק יִֽהְיֶ֔ה וּ/פִרְחָ֖/ם כָּ/אָבָ֣ק יַעֲלֶ֑ה כִּ֣י מָאֲס֗וּ אֵ֚ת תּוֹרַת֙ יְהוָ֣ה צְבָא֔וֹת וְ/אֵ֛ת אִמְרַ֥ת קְדֽוֹשׁ יִשְׂרָאֵ֖ל נִאֵֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: de
  text: 'Darum: Wie eine Feuerzunge Stoppeln verzehrt und dürres Gras vor der Flamme zusammensinkt, so wird ihre Wurzel wie Fäulnis sein, und ihre Blüte wird wie Staub aufsteigen. Denn sie haben die Weisung Jahwes, des Herrn der Heerscharen, verworfen und das Wort des Heiligen Israels verachtet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und klingt in prophetischer Rede natürlich und nachdrücklich.
- source_word: לְשׁוֹן אֵשׁ
  choice: Feuerzunge
  rationale: Bewahrt das konkrete und poetisch kraftvolle hebräische Bild.
- source_word: קַשׁ
  choice: Stoppeln
  rationale: Bezeichnet trockenes, nach der Ernte zurückbleibendes Halmgut und passt zum Bild rasch brennenden Pflanzenmaterials.
- source_word: חֲשַׁשׁ
  choice: dürres Gras
  rationale: Gibt trockenes, leicht brennbares Pflanzenmaterial verständlich wieder, ohne den Gegenstand unnötig eng festzulegen.
- source_word: יִרְפֶּה
  choice: zusammensinkt
  rationale: Der Grundsinn ist erschlaffen, kraftlos werden oder niedersinken; die Formulierung bewahrt diesen Sinn im Bild der Flamme, ohne ausdrücklich ‚verbrennen‘ einzutragen.
- source_word: כַּמָּק
  choice: wie Fäulnis
  rationale: Das Präfix כַּ־ ist ausdrücklich vergleichend; ‚Fäulnis‘ gibt den Zustand des Verrottens prägnant wieder.
- source_word: כָּאָבָק יַעֲלֶה
  choice: wie Staub emporwirbeln
  rationale: Gibt das Aufsteigen leicht verwehten Staubes in natürlichem Deutsch anschaulich wieder.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier Jahwes verbindliche Unterweisung; ‚Weisung‘ bewahrt sowohl den autoritativen als auch den lehrenden Sinn, ohne den Begriff auf ein modernes Gesetzeskonzept zu verengen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Gibt den Gottesnamen ausdrücklich als ‚Jahwe‘ wieder und macht צְבָאוֹת als Herrschaftstitel in idiomatischem Deutsch verständlich.
- source_word: נִאֵצוּ
  choice: verachtet
  rationale: Drückt die geringschätzige, schmähende Zurückweisung des göttlichen Wortes aus und unterscheidet sich passend von מָאֲסוּ ‚verworfen‘.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Text sichtbar bewahrt und nicht durch einen Titel ersetzt.
- issue: Wiedergabe von תּוֹרָה im prophetischen Bundeszusammenhang
  choice: Weisung
  alternative: Gesetz
  rationale: ‚Weisung‘ umfasst verbindliche Lehre und Anordnung und wahrt die Bedeutungsbreite des hebräischen Ausdrucks; der gerichtliche Kontext bleibt durch ‚verworfen‘ klar.
- issue: Syntax von כַּמָּק יִהְיֶה
  choice: wird wie Fäulnis werden
  alternative: wird zu Fäulnis werden
  rationale: Die Übersetzung bildet das ausdrücklich gesetzte Vergleichspräfix כַּ־ ab und löst die Aussage nicht in eine reine Gleichsetzung auf.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten poetischen Bildern. Der parallele Aufbau von Wurzel und Blüte bleibt erkennbar; ungewöhnliche, aber verständliche Bildsprache wie „Feuerzunge“ wurde bewusst nicht geglättet.
