review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Bilder folgen dem Hebräischen gut. Korrigiert werden sollte jedoch „emporwirbeln“: יַעֲלֶה bedeutet „aufsteigen/hochgehen“ und bezeichnet nicht notwendigerweise ein aktives Wirbeln. Die Vergleichskonstruktion bei כַּמָּק bleibt in der Revision ausdrücklich erhalten.'
  naturalness: Die Bildsprache ist im Allgemeinen würdig und verständlich. „wird wie Fäulnis werden“ ist im Deutschen unnötig schwerfällig; „wird wie Fäulnis sein“ ist natürlicher. „verzehrt“ passt im prophetisch-poetischen Register besser als das umgangssprachlichere „frisst“.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Weisung“ ist für תּוֹרָה möglich und wahrt dessen Bedeutungsweite. „Herr der Heerscharen“ ist als etablierte deutsche Wiedergabe des Titels in diesem Zusammenhang vertretbar.
  issues:
  - severity: medium
    issue: „ihre Blüte wird wie Staub emporwirbeln“
    rationale: יַעֲלֶה bedeutet „aufsteigen“; „emporwirbeln“ fügt eine spezifische Bewegungsart hinzu und lässt die Blüte zudem aktiv handeln. „wie Staub aufsteigen“ wahrt Bild und Verbedeutung.
  - severity: low
    issue: „wird ihre Wurzel wie Fäulnis werden“
    rationale: Die Wiedergabe ist zwar verständlich, aber im modernen Deutsch redundant. „wird ... wie Fäulnis sein“ bildet die hebräische Kopula mit Vergleich natürlicher ab.
  - severity: low
    issue: „frisst“ für das Wirken der Feuerzunge
    rationale: Das Verb kann das Bild vermitteln, wirkt hier aber umgangssprachlicher als der prophetische Registerton. „verzehrt“ ist idiomatisch und behält die Intensität des Bildes.
  revised_text: 'Darum: Wie eine Feuerzunge Stoppeln verzehrt und dürres Gras vor der Flamme zusammensinkt, so wird ihre Wurzel wie Fäulnis sein, und ihre Blüte wird wie Staub aufsteigen. Denn sie haben die Weisung Jahwes, des Herrn der Heerscharen, verworfen und das Wort des Heiligen Israels verachtet.'
