revisions:
- from: 'Darum: Wie die Feuerzunge Stoppeln frisst und dürres Gras in der Flamme zusammensinkt, so wird ihre Wurzel wie Fäulnis werden[a], und ihre Blüte wird wie Staub emporwirbeln. Denn sie haben die Weisung Jahwes, des Herrn der Heerscharen, verworfen und das Wort des Heiligen Israels verachtet.'
  to: 'Darum: Wie eine Feuerzunge Stoppeln verzehrt und dürres Gras vor der Flamme zusammensinkt, so wird ihre Wurzel wie Fäulnis sein, und ihre Blüte wird wie Staub aufsteigen. Denn sie haben die Weisung Jahwes, des Herrn der Heerscharen, verworfen und das Wort des Heiligen Israels verachtet.'
  rationale: Die Revision beseitigt die nicht vom hebräischen Verb gedeckte Vorstellung eines Wirbelns und glättet zwei stilistische Stellen, ohne die poetischen Bilder oder die Ambiguität der Wurzel-Fäulnis-Aussage zu verändern. Da die Fußnote diese Ambiguität erläutert, ist ihr Anker an „wie Fäulnis sein“ zu setzen.
  reviewer_model: gpt-5.6-terra
