id: ISA.5.12
reference: Isaiah 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: de
  text: Leier und Harfe, Handtrommel und Flöte und Wein gehören zu ihren Gelagen[a]. Doch auf das Wirken Jahwes[b] achten sie nicht, und das Werk seiner Hände sehen sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bei ihren Festmählern; das hebräische Wort bezeichnet besonders ein Trinkfest.'
    reason: lexical_alternative
  - marker: b
    text: „Das Wirken Jahwes“ und „das Werk seiner Hände“ sind parallele Ausdrücke für sein Handeln, das sie unbeachtet lassen.
    reason: explanatory
lexical_decisions:
- source_word: וְהָיָה
  choice: gehören zu
  rationale: Die Form von היה führt hier die für ihre Gelage charakteristische Szenerie ein. „Gehören zu“ gibt diese beschreibende Funktion im Deutschen natürlich wieder.
- source_word: כִנּוֹר וָנֶבֶל
  choice: Leier und Harfe
  rationale: Die beiden Wörter bezeichnen unterschiedliche Saiteninstrumente, deren genaue Bauart nicht völlig sicher ist. „Leier und Harfe“ wahrt die Unterscheidung und ist allgemein verständlich.
- source_word: תֹּף וְחָלִיל
  choice: Handtrommel und Flöte
  rationale: תֹּף bezeichnet eine Rahmentrommel beziehungsweise ein tamburinähnliches Instrument; „Handtrommel“ vermeidet die moderne Nebenbedeutung eines Tamburins mit Schellen. חָלִיל bezeichnet ein Blasinstrument, wahrscheinlich eine Flöte oder Pfeife.
- source_word: יַיִן
  choice: Wein
  rationale: Dies ist die direkte und kontextuell passende Wiedergabe.
- source_word: מִשְׁתֵּיהֶם
  choice: ihren Gelagen
  rationale: Das Substantiv bezeichnet ein Festmahl mit besonderem Bezug zum Trinken. „Gelage“ bringt diesen Zusammenhang prägnant zum Ausdruck, ohne ihn zusätzlich auszudeuten.
- source_word: פֹּעַל יְהוָה
  choice: das Wirken Jahwes
  rationale: פֹּעַל kann Werk, Tun oder Wirken bezeichnen. „Wirken“ hebt hier Jahwes Handeln hervor und ermöglicht zugleich, die konkrete Wendung „Werk seiner Hände“ im parallelen Halbvers beizubehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ ist dessen geläufige deutsche Wiedergabe und bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: יַבִּיטוּ
  choice: achten ... auf
  rationale: Die Hifil-Form bezeichnet hier gezielte Aufmerksamkeit oder Beachtung, nicht nur einen körperlichen Blick.
- source_word: מַעֲשֵׂה יָדָיו
  choice: das Werk seiner Hände
  rationale: Die Wiedergabe erhält das konkrete hebräische Bild und den Parallelismus zum „Wirken Jahwes“.
- source_word: לֹא רָאוּ
  choice: sehen sie nicht
  rationale: Obwohl רָאוּ formal ein Perfekt ist, beschreibt es im poetischen Parallelismus ihre gegenwärtige, anhaltende Blindheit gegenüber Gottes Handeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die deutsche Form „Jahwe“ bewahrt diesen persönlichen Namen, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Verhältnis von „Wirken Jahwes“ und „Werk seiner Hände“
  choice: als parallele Bezeichnungen für Gottes unbeachtetes Handeln bewahrt
  alternative: beide Wendungen frei als „was Jahwe getan hat“ wiederzugeben
  rationale: Der Parallelismus betont dasselbe göttliche Handeln mit zwei verwandten Ausdrücken. Die Bildsprache der Hände bleibt erhalten, ohne zu entscheiden, auf welches konkrete Handeln Jahwes der Vers zielt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Instrumentenliste bleibt rhythmisch knapp; „Gelage“ macht den im Hebräischen vorhandenen Trinkbezug deutlich. Der poetische Parallelismus der beiden abschließenden Aussagen wird bewahrt.
