source:
  edition: WLC
  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: de
  text: Darum entbrannte der Zorn Jahwes gegen sein Volk. Er streckte seine Hand gegen es aus und schlug es; die Berge erbebten, und ihre Leichen waren wie Unrat[a] mitten auf den Straßen. Bei alledem hat sich sein Zorn nicht abgewandt, und noch ist seine Hand ausgestreckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Kehricht“. Das seltene hebräische Wort bezeichnet wahrscheinlich etwas, das weggefegt oder weggeworfen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt den folgernden Zusammenhang knapp und natürlich wieder.
- source_word: חָרָה אַף יְהוָה
  choice: der Zorn Jahwes entbrannte
  rationale: Bewahrt das hebräische Bild des brennenden Zorns in idiomatischem, würdigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Eigennamen Gottes als solchen wieder und entspricht der geläufigen deutschen Form.
- source_word: בְּעַמּוֹ
  choice: gegen sein Volk
  rationale: Die Präposition bezeichnet hier bei einem Ausdruck des Zorns dessen Ziel.
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: Er streckte seine Hand gegen es aus
  rationale: Erhält das anthropomorphe Gerichtsbild und nimmt das grammatisch singularische Kollektivum „Volk“ auf.
- source_word: וַיַּכֵּהוּ
  choice: und schlug es
  rationale: Der singularische Objektsuffix bezieht sich auf das Kollektivum „Volk“; die deutsche Form wahrt diesen Bezug.
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: die Berge erbebten
  rationale: „Erbebten“ gibt die heftige Erschütterung in angemessen prophetischem Register wieder.
- source_word: נִבְלָתָם
  choice: ihre Leichen
  rationale: Bezeichnet die toten Körper klar und ohne die Härte des Bildes abzuschwächen.
- source_word: כַּסּוּחָה
  choice: wie Unrat
  rationale: Das seltene Wort bezeichnet wahrscheinlich Weggefegtes oder Weggeworfenes; „Unrat“ vermittelt die verächtliche Behandlung der Leichen, ohne eine unsichere Einzelbedeutung festzuschreiben.
- source_word: בְּקֶרֶב חוּצוֹת
  choice: mitten auf den Straßen
  rationale: Gibt die öffentliche Lage innerhalb der städtischen Straßen natürlich wieder.
- source_word: בְּכָל זֹאת
  choice: Bei alledem
  rationale: Leitet den wiederkehrenden Refrain ein und zeigt, dass das bisherige Gericht den Zorn nicht beendet hat.
- source_word: לֹא שָׁב אַפּוֹ
  choice: hat sich sein Zorn nicht abgewandt
  rationale: Bewahrt die Bewegungsmetapher des Hebräischen und ist zugleich idiomatisch.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: und noch ist seine Hand ausgestreckt
  rationale: Erhält bewusst das offene Bild fortdauernden göttlichen Handelns, statt es erklärend auf eine bestimmte Folgehandlung zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen; „Jahwe“ macht dies transparent, ohne die traditionelle Ersatzlesung in den Haupttext einzutragen.
- issue: Anthropomorphe Sprache für Gottes Zorn und Handeln
  choice: Die Bilder vom entbrennenden Zorn und von der ausgestreckten Hand bleiben erhalten.
  alternative: Abstrakte Umschreibung als starke Verärgerung und fortgesetzte Bestrafung
  rationale: Die leibhaftigen Bilder gehören zur prophetischen Aussagekraft des Textes und sollten weder abgeschwächt noch dogmatisch ausgedeutet werden.
- issue: Bedeutung der weiterhin ausgestreckten Hand
  choice: Das Bild bleibt ohne erklärenden Zusatz stehen.
  alternative: Seine strafende Hand ist weiterhin erhoben.
  rationale: Im Zusammenhang weist das Bild auf fortdauerndes Gericht, doch der hebräische Ausdruck benennt die Funktion der Hand nicht ausdrücklich; die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Das Kollektivum „Volk“ wird in den anschließenden Pronomen als Singular aufgenommen. Der Fußnotenmarker steht unmittelbar bei dem lexikalisch unsicheren Ausdruck.
