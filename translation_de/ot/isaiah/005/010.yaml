  text: כִּ֗י עֲשֶׂ֨רֶת֙ צִמְדֵּי כֶ֔רֶם יַעֲשׂ֖וּ בַּ֣ת אֶחָ֑ת וְ/זֶ֥רַע חֹ֖מֶר יַעֲשֶׂ֥ה אֵיפָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/010.yaml
  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
translation:
  language: de
  text: Denn zehn Joch Weinbergsland werden nur ein Bat Ertrag bringen, und ein Homer Saatgut wird nur ein Efa hervorbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise nähere Erklärung des vorangehenden Gerichtsworts ein.
- source_word: עֲשֶׂרֶת צִמְדֵּי כֶרֶם
  choice: zehn Joch Weinberg
  rationale: צֶמֶד bezeichnet wörtlich ein Gespann und davon abgeleitet die Fläche, die ein Gespann bearbeiten kann. „Joch“ bewahrt das alte Flächenbild in einer im Deutschen belegten agrarischen Verwendung.
- source_word: יַעֲשׂוּ בַּת אֶחָת
  choice: werden nur ein Bat Ertrag bringen
  rationale: עשה bedeutet hier im landwirtschaftlichen Zusammenhang „hervorbringen/Ertrag bringen“. „Nur“ macht den im Mengenverhältnis liegenden drastischen Minderertrag natürlich deutlich, ohne den Sachgehalt zu verändern.
- source_word: וְזֶרַע חֹמֶר
  choice: und ein Homer Saatgut
  rationale: Die Konstruktverbindung bezeichnet eine Homer-Menge Saatgut. Die antike Maßeinheit bleibt erhalten.
- source_word: יַעֲשֶׂה אֵיפָה
  choice: wird nur ein Efa hervorbringen
  rationale: Das Verb wird im selben landwirtschaftlichen Sinn wiedergegeben; „Efa“ erhält die konkrete antike Trockenmaßeinheit.
