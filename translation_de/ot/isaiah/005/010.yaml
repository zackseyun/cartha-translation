  verdict: revise
  source_fidelity: Der Entwurf gibt die kausale Anbindung, die beiden Mengenangaben und den drastisch geringen Ertrag grundsätzlich zutreffend wieder. Das ergänzte „nur“ ist als im Kontrast liegende Verdeutlichung vertretbar. „Zehn Joch Weinberg“ bildet jedoch im modernen Standarddeutsch keine ausreichend klare oder natürliche Flächenangabe und kann fälschlich wie zehn einzelne Joche im Weinberg verstanden werden.
  naturalness: Mit „zehn Joch Weinbergsland“ wird die im Hebräischen wahrscheinlich gemeinte agrarische Flächengröße verständlich und zugleich die traditionelle Maßeinheit Joch erhalten. Die Formulierung bleibt würdig und knapp.
  terminology: „Bat“, „Homer“ und „Efa“ sind als antike Maßeinheiten angemessen beibehalten. Die Fußnoten erläutern die lexikalische Alternative und das Verhältnis von Homer und Efa sachgerecht, ohne eine unsichere moderne Umrechnung vorzugeben.
  issues:
  - severity: medium
    issue: Die Wendung „zehn Joch Weinberg“ ist im modernen Deutsch syntaktisch und semantisch unklar.
    rationale: צִמְדֵּי כֶרֶם bezeichnet wahrscheinlich eine durch ein Ochsengespann bestimmte Weinbergsfläche. „Weinbergsland“ macht die Flächenlesart deutlich, ohne die im Hebräischen vorhandene agrarische Bildlichkeit oder die Auslegungsunsicherheit aufzugeben.
  revised_text: Denn zehn Joch Weinbergsland werden nur ein Bat Ertrag bringen, und ein Homer Saatgut wird nur ein Efa hervorbringen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „zehn Gespanne Weinberg“. Gemeint ist wahrscheinlich die einem Ochsengespann entsprechende Weinbergsfläche, nicht dass die Tiere selbst im Weinberg stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Ein Bat war ein Hohlmaß für Flüssigkeiten, ein Efa ein Hohlmaß für trockene Güter. Ein Homer entsprach zehn Efa. Der Vers beschreibt daher einen verheerend geringen Ertrag: Aus einer großen Weinbergsfläche kommt nur sehr wenig Wein, und die Ernte beträgt nur ein Zehntel der ausgesäten Menge.'
    reason: cultural_note
