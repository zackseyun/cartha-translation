  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲשִׁיתֵ֣/הוּ בָתָ֗ה לֹ֤א יִזָּמֵר֙ וְ/לֹ֣א יֵעָדֵ֔ר וְ/עָלָ֥ה שָׁמִ֖יר וָ/שָׁ֑יִת וְ/עַ֤ל הֶ/עָבִים֙ אֲצַוֶּ֔ה מֵ/הַמְטִ֥יר עָלָ֖י/ו מָטָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: de
  text: Ich werde ihn zur Einöde machen[a]. Er wird weder beschnitten noch behackt[b] werden, und Dornen und Disteln werden aufwachsen. Den Wolken werde ich gebieten, keinen Regen auf ihn fallen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu verwüstetem, unbewirtschaftetem Land«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet das Umgraben oder Behacken des Bodens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: Ich werde ihn … machen
  rationale: שׂים bedeutet grundlegend »setzen/stellen«, kann mit einem folgenden Prädikatsnomen aber natürlich mit »zu etwas machen« wiedergegeben werden. Das maskuline Pronomen verweist auf den Weinberg.
- source_word: בָתָה
  choice: zur Einöde
  rationale: Das seltene Substantiv bezeichnet einen verwüsteten oder nicht mehr bewirtschafteten Ort. »Einöde« vermittelt Verwüstung und Verlassenheit, ohne den Ausdruck unnötig zu präzisieren.
- source_word: לֹא יִזָּמֵר
  choice: weder beschnitten
  rationale: זמר bezeichnet im Weinbau das Beschneiden der Reben; die passive Form wird im Deutschen beibehalten.
- source_word: וְלֹא יֵעָדֵר
  choice: noch behackt
  rationale: עדר bezeichnet hier die Bearbeitung des Bodens durch Hacken oder Graben. »Behackt« passt zum Weinbau und wahrt den landwirtschaftlichen Sinn.
- source_word: וְעָלָה
  choice: werden aufwachsen
  rationale: עלה beschreibt hier das Aufkommen unerwünschten Bewuchses. »Aufwachsen« ist im Deutschen anschaulich und natürlich.
- source_word: שָׁמִיר וָשָׁיִת
  choice: Dornen und Disteln
  rationale: Das Wortpaar bezeichnet dornigen, verwilderten Bewuchs; die genaue botanische Zuordnung bleibt unsicher. Die traditionelle Sammelbezeichnung ist verständlich und überpräzisiert nicht.
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: Den Wolken werde ich gebieten
  rationale: Die vorangestellte Wendung mit עַל bezeichnet hier den Gegenstand des Befehls. Die deutsche Form bewahrt die Hervorhebung der Wolken und klingt zugleich natürlich.
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: keinen Regen auf ihn fallen zu lassen
  rationale: מן mit dem Infinitiv nach צוה drückt Verhinderung oder Verbot aus. Die hebräische figura etymologica »Regen regnen« wird in natürliches Deutsch übertragen.
theological_decisions:
- issue: Unmittelbares Handeln des Sprechers im Gerichtsbild
  choice: 'Die direkte Ich-Rede bleibt erhalten: »Ich werde … machen« und »werde ich gebieten«.'
  alternative: Die Verwüstung unpersönlich als bloße Folge der Vernachlässigung formulieren.
  rationale: Der hebräische Text stellt den Sprecher ausdrücklich als den Handelnden dar. Diese Gerichtsaussage darf weder abgeschwächt noch über das Bild hinaus dogmatisch ausgedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die landwirtschaftlichen Bilder bleiben konkret; die seltene Bezeichnung בָתָה und die botanisch nicht sicher bestimmbaren Begriffe werden nicht überpräzisiert.
