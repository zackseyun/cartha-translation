id: ISA.5.3
reference: Isaiah 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֛ה יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וְ/אִ֣ישׁ יְהוּדָ֑ה שִׁפְטוּ נָ֕א בֵּינִ֖/י וּ/בֵ֥ין כַּרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
translation:
  language: de
  text: Und nun, Bewohner Jerusalems und Mann von Juda[a], urteilt doch zwischen mir und meinem Weinberg!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen „Bewohner Jerusalems“ und „Mann von Juda“ im Singular als repräsentative Anrede an die Bevölkerung insgesamt; das folgende „urteilt“ steht im Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: „Und“ wahrt den Anschluss an das vorangehende Weinberglied; „nun“ markiert die rhetorische Wende zur direkten Anrede.
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: Bewohner Jerusalems
  rationale: Der singularische Partizipialausdruck wird formnah wiedergegeben und dient als repräsentative Anrede der Stadtbevölkerung.
- source_word: וְאִישׁ יְהוּדָה
  choice: und Mann von Juda
  rationale: „Mann“ bewahrt den maskulinen repräsentativen Singular אִישׁ; „von Juda“ ist im Deutschen eine klare und natürliche Zuordnung.
- source_word: שִׁפְטוּ נָא
  choice: urteilt doch
  rationale: Der Pluralimperativ fordert die gemeinsam Angeredeten zu einer Entscheidung auf. „Doch“ vermittelt hier die bittend-auffordernde Nuance von נָא natürlicher als ein ausdrücklich höfliches „bitte“.
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: zwischen mir und meinem Weinberg
  rationale: Die Formulierung erhält die beiden Streitparteien der metaphorischen Rechtsszene; „Weinberg“ ist die übliche Entsprechung für כֶּרֶם.
theological_decisions:
- issue: Repräsentativer Singular in der Anrede
  choice: „Bewohner Jerusalems und Mann von Juda“ im Singular, verbunden mit dem pluralischen Imperativ „urteilt“
  alternative: „Bewohner Jerusalems und Männer Judas“ oder „ihr Menschen aus Jerusalem und Juda“
  rationale: Der hebräische Text spricht Jerusalem und Juda jeweils durch eine männliche Einzelfigur repräsentativ an, richtet den anschließenden Imperativ aber an beide zusammen. Die Übersetzung bewahrt diese auffällige Spannung, ohne die kollektive Bedeutung zu verschleiern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche singularische Doppelanrede bleibt bewusst erhalten; „urteilt doch“ klingt gegenwärtig und gibt zugleich den Rechtscharakter sowie die bittende Nuance der Aufforderung wieder.
