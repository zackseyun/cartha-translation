source:
  edition: WLC
  text: וְ/יִנְהֹ֥ם עָלָ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/נַהֲמַת יָ֑ם וְ/נִבַּ֤ט לָ/אָ֨רֶץ֙ וְ/הִנֵּה חֹ֔שֶׁךְ צַ֣ר וָ/א֔וֹר חָשַׁ֖ךְ בַּ/עֲרִיפֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: de
  text: 'Und an jenem Tag wird er über ihm[a] brüllen wie das Brausen des Meeres. Blickt man auf das Land[b], siehe: Finsternis und Bedrängnis[c]; und das Licht wird in seinen Wolken[d] dunkel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen ihn“. Das hebräische Suffix ist maskulin Singular. Sein Bezug ist im Zusammenhang nicht eindeutig; gemeint sein kann etwa ein personifiziertes Volk oder ein anderer männlich gedachter Bezugsträger.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „auf die Erde“. Das hebräische Wort kann „Land“ oder „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Not“ beziehungsweise „Angst“. Das hebräische Wort bezeichnet Bedrängnis, Enge oder Not.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „durch seine Wolken“ beziehungsweise „in seinen dichten Wolken“. Die hebräische Schlussformulierung ist schwierig und meint möglicherweise dunkle Wolkenmassen, in denen oder durch die das Licht dunkel wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: wird er brüllen
  rationale: נהם bezeichnet ein lautes Brüllen oder Dröhnen. Die maskuline Singularform lässt das Subjekt unausgesprochen; „er“ wahrt diese Form und kann sich auf den zuvor kollektiv dargestellten Angreifer beziehen.
- source_word: עָלָיו
  choice: über ihm
  rationale: על mit maskulinem Singularsuffix kann räumlich „über ihm“ oder feindlich „gegen ihn“ bedeuten. Die Hauptfassung erhält die räumlich-bedrohliche Bildsprache und das grammatische Geschlecht.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: כְּנַהֲמַת יָם
  choice: wie das Brausen des Meeres
  rationale: Das Substantiv bezeichnet das laute Tosen oder Brüllen; „Brausen des Meeres“ ist im Deutschen anschaulich und idiomatisch.
- source_word: וְנִבַּט לָאָרֶץ
  choice: Blickt man auf das Land
  rationale: Die Verbform lässt sich unpersönlich verstehen. „Blickt man“ gibt dies knapp wieder; „Land“ passt zur Gerichtsszene, ohne die ebenfalls mögliche Bedeutung „Erde“ auszuschließen.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: „Siehe“ bewahrt den hinweisenden, plötzlich enthüllenden Charakter des hebräischen Ausdrucks und passt zum würdigen prophetischen Register.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Direkte und im poetisch-prophetischen Zusammenhang natürliche Wiedergabe.
- source_word: צַר
  choice: Bedrängnis
  rationale: Das Wortfeld umfasst Enge, Not und Bedrängnis. „Bedrängnis“ bewahrt sowohl den äußeren Druck als auch die leidvolle Erfahrung.
- source_word: וָאוֹר חָשַׁךְ
  choice: und das Licht ist verdunkelt
  rationale: Die resultative Aussage und der scharfe Gegensatz zwischen Licht und Finsternis bleiben erhalten.
- source_word: בַּעֲרִיפֶיהָ
  choice: in seinen Wolken
  rationale: Die seltene Schlussformulierung wird als Bezug auf Wolken oder dichte Wolkenmassen verstanden. „In“ gibt die Präposition zurück, ohne eindeutig instrumental zu deuten; das deutsche Pronomen bezieht sich auf „Land“.
theological_decisions:
- issue: Bezug von Subjekt und Objekt im ersten Satzteil
  choice: „er … über ihm“
  alternative: „es … über ihm“ oder „er … gegen ihn“
  rationale: Der hebräische Text nennt weder das Subjekt ausdrücklich noch den konkreten Bezug des maskulinen Objektsuffixes. Die Übersetzung wahrt die grammatische Form und legt weder eine bestimmte Person noch eine bestimmte theologische Identifikation fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. „Siehe“ und „Finsternis“ sind bewusst leicht gehoben, bleiben aber allgemein verständlich. Die Satzgliederung mit Punkt und Semikolon macht den Wechsel vom Meeresbrausen zum Blick auf das verdunkelte Land deutlich.
