source:
  edition: WLC
  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: de
  text: Darum geht mein Volk in die Verbannung, weil ihm Erkenntnis fehlt. Seine Angesehenen[a] sind vom Hunger ausgezehrt, und die Menge seines Volkes ist vor Durst ausgedörrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Herrlichkeit – Männer des Hungers“; gemeint sind wahrscheinlich die Angesehenen oder Vornehmen des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folge aus der vorangehenden Anklage und gibt den prophetischen Gedankengang knapp und natürlich wieder.
- source_word: גָּלָה
  choice: geht in die Verbannung
  rationale: Das Verb bezeichnet das Fortgehen beziehungsweise Weggeführtwerden ins Exil. Die Formulierung bewahrt den Exilsinn, ohne eine im Hebräischen nicht ausdrücklich genannte handelnde Instanz einzuführen.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Gibt die erste Person des Suffixes und die Bundesbeziehung unmittelbar wieder.
- source_word: מִבְּלִי דָעַת
  choice: weil es ihm an Erkenntnis fehlt
  rationale: Gibt sowohl den Mangel als auch den im Zusammenhang naheliegenden ursächlichen Bezug wieder. „Erkenntnis“ lässt die sittliche und auf Gott bezogene Bedeutung offen und beschränkt den Ausdruck nicht auf bloßes Faktenwissen.
- source_word: כְבוֹדוֹ
  choice: seine Angesehenen
  rationale: Wörtlich steht „seine Herrlichkeit“. Im parallelen Aufbau bezeichnet der Ausdruck wahrscheinlich die angesehenen oder vornehmen Menschen innerhalb des kollektiv als Einheit aufgefassten Volkes; die Fußnote bewahrt die auffällige wörtliche Form.
- source_word: מְתֵי רָעָב
  choice: sind vom Hunger ausgezehrt
  rationale: Die Konstruktion bedeutet wörtlich „Männer des Hungers“ und beschreibt vom Hunger schwer gezeichnete Menschen. „Ausgezehrt“ vermittelt den Zustand, ohne den Tod ausdrücklich in den hebräischen Wortlaut hineinzulesen.
- source_word: הֲמוֹנוֹ
  choice: seine Menge
  rationale: Bezeichnet die große Masse des kollektiv im Singular behandelten Volkes und erhält die Parallelität zu „seine Angesehenen“.
- source_word: צִחֵה צָמָא
  choice: ist vor Durst ausgedörrt
  rationale: Gibt das Bild äußerster Trockenheit zusammen mit dem substantivischen „Durst“ anschaulich und im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Bedeutungsumfang von דַּעַת in der prophetischen Anklage
  choice: Erkenntnis
  alternative: Wissen; Einsicht
  rationale: „Erkenntnis“ bewahrt den möglichen umfassenden Sinn, der auch die Erkenntnis Gottes sowie sittliche und bundeshafte Verantwortung einschließt, ohne diese Dimension ausdrücklich festzulegen.
- issue: Zeitbezug der Exilsaussage גָּלָה
  choice: geht in die Verbannung
  alternative: ist in die Verbannung gegangen; wird in die Verbannung gehen
  rationale: Das hebräische Perfekt kann im prophetischen Zusammenhang ein als feststehend dargestelltes Geschehen bezeichnen. Das deutsche Präsens erhält die eindringliche Darstellung, ohne die Aussage eindeutig auf Vergangenheit oder Zukunft festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Gruppen – die Angesehenen und die Menge – bleiben erkennbar; starke, aber nicht unnötig deutende Bilder geben Hunger und Durst wieder.
