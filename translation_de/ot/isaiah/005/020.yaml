base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: de
  text: Wehe denen, die das Böse gut und das Gute böse nennen[a], die Finsternis zu Licht machen und Licht zu Finsternis[b], die Bitteres zu Süßem machen und Süßes zu Bitterem!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die zum Bösen sagen: ‚Gut!‘ und zum Guten: ‚Böse!‘“'
    reason: lexical_alternative
  - marker: b
    text: 'Die wiederholten Gegensatzpaare Finsternis/Licht und bitter/süß verschärfen den Vorwurf: Es geht um die Verkehrung der Wirklichkeit, nicht nur um ein falsches Wort.'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Weheruf-Formel kündigt Unheil und Gericht an; „Wehe“ wahrt Kraft und Würde des hebräischen Ausdrucks.
- source_word: הָאֹמְרִים
  choice: denen, die … nennen
  rationale: Wörtlich steht „die sagen“; in der Konstruktion mit den Wertungsbegriffen gibt „nennen“ die Zuweisung einer moralischen Bezeichnung im Deutschen natürlich wieder.
- source_word: לָרַע טוֹב וְלַטּוֹב רָע
  choice: das Böse gut und das Gute böse
  rationale: Bewahrt die knappe, spiegelbildliche Gegenüberstellung und bezeichnet moralische Verkehrung, ohne ihren Anwendungsbereich einzuengen.
- source_word: שָׂמִים
  choice: zu … machen
  rationale: „Machen“ gibt das aktive Vertauschen beziehungsweise Umdeuten wieder; die Konstruktion mit „zu“ ist idiomatisches modernes Deutsch.
- source_word: חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: Finsternis zu Licht und Licht zu Finsternis
  rationale: „Finsternis“ trägt den gehobenen poetisch-prophetischen Ton, während die chiastische Umkehrung eng am hebräischen Parallelismus bleibt.
- source_word: מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: Bitteres zu Süßem und Süßes zu Bitterem
  rationale: Die substantivierten Adjektive ergeben im Deutschen einen natürlichen, symmetrischen Sinneseindruck und bewahren die zugespitzte Schlusswendung.
theological_decisions:
- issue: Gegenstand des Weherufs
  choice: 'Der Vers verurteilt die Umkehrung moralischer Wirklichkeit: Böses wird als gut, Gutes als böse ausgegeben.'
  alternative: Eine bloß allgemeine Verwechslung oder ausschließlich eine juristische beziehungsweise politische Anklage.
  rationale: Die Bildpaare Finsternis/Licht und bitter/süß weiten die Anklage aus, ohne eine bestimmte spätere dogmatische oder politische Anwendung festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die drei parallelen Umkehrungen und ihre knappe Symmetrie bleiben erhalten; „Finsternis“ bewahrt die poetische Bildkraft.
