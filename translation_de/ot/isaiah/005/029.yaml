base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: de
  text: Sein Brüllen ist wie das eines Löwen[a], er brüllt wie junge Löwen, knurrt, packt die Beute und trägt sie fort[b]; niemand ist da, der sie rettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer Löwin“. Das hebräische Wort kann in manchen Zusammenhängen genauer eine Löwin bezeichnen; hier passt „Löwe“ gut zum Parallelismus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schleppt sie weg“ oder „entkommt mit ihr“. Das hebräische Verb legt nahe, dass die Beute fortgebracht wird und nicht mehr zurückgeholt werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה ל֖וֹ
  choice: Sein Brüllen
  rationale: Das Substantiv bezeichnet das Brüllen eines Löwen; das maskuline Suffix wird entsprechend dem personifizierten Angreifer im Zusammenhang mit „sein“ wiedergegeben.
- source_word: כַּלָּבִיא
  choice: wie das eines Löwen
  rationale: לָבִיא bezeichnet einen kräftigen Löwen und kann je nach Kontext auch genauer als Löwin verstanden werden. Die Formulierung vermeidet im Deutschen die unnatürliche Wendung „Brüllen ist wie ein Löwe“.
- source_word: וְשאג כַּכְּפִירִים
  choice: und es brüllt wie junge Löwen
  rationale: כְּפִירִים meint junge, bereits kräftige Löwen, nicht kleine Löwenjunge. Das Präsens vermittelt die lebendige poetische Schilderung.
- source_word: וְיִנְהֹם
  choice: Es knurrt
  rationale: Das Verb bezeichnet einen tiefen, drohenden Laut und hebt sich so von dem zuvor genannten Brüllen ab.
- source_word: וְיֹאחֵז טֶרֶף
  choice: packt die Beute
  rationale: אָחַז bedeutet fest ergreifen; „packen“ ist im Raubtierbild natürlich und kraftvoll. טֶרֶף bezeichnet hier unmittelbar die Beute.
- source_word: וְיַפְלִיט
  choice: und trägt sie fort
  rationale: Der Hifil kann hier ausdrücken, dass der Angreifer die Beute weg- und außer Reichweite bringt. Die Übersetzung bewahrt den Zusammenhang mit dem fehlenden Retter.
- source_word: וְאֵין מַצִּיל
  choice: niemand kann sie retten
  rationale: Die Wendung verneint das Vorhandensein eines Retters. Im Deutschen bringt „niemand kann sie retten“ die völlige Hilflosigkeit der Beute klar und knapp zum Ausdruck.
