translation:
  language: de
  text: Und der Mensch wird gebeugt[a] und der Mann erniedrigt; die Augen der Hochmütigen[b] werden erniedrigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und der Mensch beugt sich“. Das Hebräische kann ein Sichbeugen oder ein Herabgebeugtwerden bezeichnen und verwendet hier zwei verwandte, aber unterschiedliche Verben für die Erniedrigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Augen der Hohen“; gemeint sind Menschen, deren erhobener Blick ihren Hochmut ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: wird gebeugt
  rationale: Das Verb bezeichnet ein Sichbeugen beziehungsweise Herabgebeugtwerden. Im Gerichtszusammenhang bringt die passivische Formulierung die Erniedrigung des Menschen natürlich zum Ausdruck, ohne die mögliche reflexive Nuance zu verschweigen.
- source_word: אָדָם
  choice: der Mensch
  rationale: Der deutsche Singular „der Mensch“ bewahrt den repräsentativen Sinn und steht im poetischen Parallelismus zu אִישׁ.
- source_word: וַיִּשְׁפַּל
  choice: wird erniedrigt
  rationale: שׁפל bezeichnet das Niedrigwerden oder Erniedrigtwerden. „Erniedrigt“ unterscheidet den Ausdruck vom verwandten, aber nicht identischen ersten Verb.
- source_word: אִישׁ
  choice: der Mann
  rationale: Die Wiedergabe wahrt den maskulinen Singular und den Parallelismus mit „der Mensch“, ohne beide Ausdrücke einzuebnen.
- source_word: עֵינֵי גְבֹהִים
  choice: die Augen der Hochmütigen
  rationale: Die konkrete Metapher der Augen bleibt erhalten; „Hochmütigen“ gibt die hier wertende Bedeutung der wörtlich „Hohen“ idiomatisch wieder.
- source_word: תִּשְׁפַּלְנָה
  choice: werden erniedrigt
  rationale: Die Wiederholung von שׁפל wird entsprechend dem zweiten Satzglied ebenfalls mit „erniedrigt“ wiedergegeben. Der Plural stimmt mit „Augen“ überein und die Zukunftsform wahrt die prophetische Ankündigung.
theological_decisions:
- issue: Die parallelen Bezeichnungen אָדָם und אִישׁ
  choice: der Mensch … der Mann
  alternative: die Menschen … jeder Einzelne
  rationale: Die beiden maskulinen Singulare bezeichnen die Menschheit repräsentativ und zugleich den einzelnen Mann. Die gewählte Fassung bewahrt Form und poetischen Parallelismus, ohne den Bezug auf menschlichen Hochmut konfessionell auszudeuten.
- issue: Zeitgestaltung der prophetischen Aussage
  choice: Gegenwartsnahe Zukunft mit „wird/werden“
  alternative: 'Vergangenheit: „wurde … wurde … wurden“'
  rationale: Die ersten beiden Wayyiqtol-Formen stehen in prophetischer Gerichtsdichtung, während die letzte Form ein Imperfekt ist. Das deutsche Futur mit „wird/werden“ vermittelt die angekündigte und als gewiss dargestellte Erniedrigung einheitlich, ohne eine abgeschlossene Vergangenheit zu behaupten.
- issue: Bild der erniedrigten Augen
  choice: die Augen der Hochmütigen werden erniedrigt
  alternative: der hochmütige Blick wird gesenkt
  rationale: Die gewählte Fassung erhält das auffällige hebräische Bild und die Wiederholung des Verbs שׁפל. Die idiomatischere Alternative würde das Bild stärker erklären und die Verbwiederholung verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Satzbau. Das Semikolon bildet den Übergang zum abschließenden Bild ab; die konkrete Rede von den „Augen“ und die Wiederholung von „erniedrigt“ bewahren die hebräische Bildlichkeit und Parallelstruktur.
