  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: de
  text: 'Denn der Weinberg Jahwes der Heere ist das Haus Israel,

    und die Männer Judas sind die Pflanzung seiner Freude.[a]


    Er erwartete Recht, doch siehe: Blutvergießen;

    Gerechtigkeit, doch siehe: ein Aufschrei.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „der Mann von Juda“. Der hebräische Singular ist hier wahrscheinlich kollektiv zu verstehen: die Männer oder die Bewohner Judas.'
    reason: alternative_reading
  - marker: b
    text: Das mit „Blutvergießen“ wiedergegebene hebräische Wort ist nur hier belegt und in seiner genauen Bedeutung unsicher; möglich sind auch „Rechtsbruch“ oder allgemeiner „Gewalttat“.
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen stehen klangähnliche Wörter einander gegenüber: mischpat („Recht“) und mispach („Blutvergießen/Rechtsbruch“) sowie zedaqa („Gerechtigkeit“) und ze''aqa („Aufschrei“). Das Wortspiel verschärft den Gegensatz zwischen dem, was Jahwe erwartete, und dem, was er vorfand.'
    reason: wordplay
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die erklärende Deutung des vorausgehenden Weinbergliedes ein und gibt die kausal-erläuternde Funktion natürlich wieder.
- source_word: כֶרֶם
  choice: Weinberg
  rationale: Bezeichnet den kultivierten Weinberg und führt das Bild der vorausgehenden Verse fort.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Gibt den Gottesnamen als Eigennamen und צְבָאוֹת bedeutungsnah als militärische Heere wieder, ohne das traditionellere, heute weniger geläufige „Heerscharen“ in den Haupttext zu setzen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die feste kollektive und heilsgeschichtliche Ausdrucksweise des Hebräischen.
- source_word: וְאִישׁ יְהוּדָה
  choice: der Mann von Juda
  rationale: Bewahrt den formalen Singular אִישׁ und damit die mögliche kollektive Ausdrucksweise, statt sie im Haupttext eindeutig in einen Plural aufzulösen.
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: die Pflanzung, an der er Freude hat
  rationale: Erhält das landwirtschaftliche Bild und gibt שַׁעֲשׁוּעִים als Freude beziehungsweise Wohlgefallen idiomatisch wieder.
- source_word: וַיְקַו
  choice: Er hoffte auf
  rationale: Drückt die gespannte Erwartung des Weinbergbesitzers aus und passt zur folgenden enttäuschenden Gegenüberstellung.
- source_word: לְמִשְׁפָּט
  choice: auf Recht
  rationale: Bezeichnet hier die erwartete gerechte gesellschaftliche Ordnung und Rechtspraxis; „Recht“ ist knapp und im Deutschen idiomatisch.
- source_word: מִשְׂפָּח
  choice: Blutvergießen
  rationale: Das seltene Wort bezeichnet wahrscheinlich gewaltsames Unrecht beziehungsweise Blutvergießen. Diese Wiedergabe folgt der wahrscheinlichsten Bedeutung, während die Unsicherheit in einer Fußnote offengelegt wird.
- source_word: לִצְדָקָה
  choice: auf Gerechtigkeit
  rationale: Bewahrt die moralische und gemeinschaftliche Dimension von צְדָקָה sowie den Parallelismus zu מִשְׁפָּט.
- source_word: צְעָקָה
  choice: ein Klagegeschrei
  rationale: Bezeichnet den lauten Hilferuf von Menschen, die unter Unrecht leiden; „Klagegeschrei“ macht diesen Not- und Anklagecharakter deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektive oder individuelle Deutung von אִישׁ יְהוּדָה
  choice: der Mann von Juda, mit Erklärung der kollektiven Möglichkeit
  alternative: die Männer von Juda / die Bewohner Judas
  rationale: Der grammatische Singular wird im Haupttext sichtbar gehalten. Zugleich erklärt die Fußnote, dass er im Parallelismus kollektiv für die Bevölkerung Judas stehen kann; so wird die echte sprachliche Spannung nicht stillschweigend aufgelöst.
- issue: Deutung des seltenen Wortes מִשְׂפָּח
  choice: Blutvergießen
  alternative: Rechtsbruch / Gewalttat
  rationale: Der Zusammenhang stellt das gefundene schwere Unrecht dem erwarteten Recht gegenüber. Da die genaue Bedeutung des nur hier belegten Ausdrucks unsicher ist, nennt die Fußnote weitere vertretbare Wiedergaben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem poetischem Parallelismus. „Jahwe der Heere“ ist verständlicher als „Jahwe der Heerscharen“; die bildhafte Sprache von Weinberg und Pflanzung bleibt erhalten. „Siehe“ bewahrt den markanten Überraschungsruf וְהִנֵּה, ohne die Zeile unnötig auszubauen.
