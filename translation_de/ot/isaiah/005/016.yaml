source:
  edition: WLC
  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: de
  text: Doch Jahwe der Heerscharen erweist sich erhaben im Gericht[a], und der heilige Gott wird durch Gerechtigkeit als heilig erwiesen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Recht“ bzw. „durch Gerechtigkeit“. Das hebräische Wort kann sowohl gerechtes Recht als auch dessen Vollzug im Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „erweist sich als heilig“. Gemeint ist, dass Gottes Heiligkeit durch sein gerechtes Handeln sichtbar und bestätigt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: erweist sich erhaben
  rationale: Das Verb גבה bezeichnet das Hoch- oder Erhabensein. Im Zusammenhang wird Jahwes Erhabenheit durch sein richterliches Handeln sichtbar; die reflexive Formulierung gibt diese Manifestation natürlich wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die traditionelle Weite des Titels צְבָאוֹת, ohne ihn ausschließlich auf menschliche Armeen zu begrenzen.
- source_word: בַּמִּשְׁפָּט
  choice: im Gericht
  rationale: מִשְׁפָּט kann sowohl das Recht beziehungsweise die Gerechtigkeit als auch den Vollzug des Gerichts bezeichnen. Der unmittelbare Kontext des Strafgerichts legt hier „im Gericht“ nahe, ohne die rechtliche und moralische Dimension auszuschließen.
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: und der heilige Gott
  rationale: Die Formulierung gibt אֵל und das bestimmte Adjektiv הַקָּדוֹשׁ idiomatisch und würdig wieder.
- source_word: נִקְדָּשׁ
  choice: erweist sich als heilig
  rationale: Der Nifal von קדש bezeichnet hier nicht ein Heiligwerden Gottes, sondern das Sichtbarwerden beziehungsweise die Bestätigung seiner Heiligkeit. „Erweist sich als heilig“ vermeidet die irreführende Vorstellung, Gott werde von außen geheiligt.
- source_word: בִּצְדָקָה
  choice: durch Gerechtigkeit
  rationale: צְדָקָה bezeichnet Gerechtigkeit beziehungsweise rechtschaffenes Handeln. „Durch“ bringt den instrumentalen Sinn der Präposition gut zum Ausdruck und hält den Begriff vom vorausgehenden מִשְׁפָּט unterscheidbar.
theological_decisions:
- issue: Heiligkeitsaussage ohne eine Veränderung in Gottes Wesen anzudeuten
  choice: erweist sich als heilig
  alternative: wird geheiligt; wird als heilig erwiesen
  rationale: 'Die gewählte Wendung wahrt den Sinn des hebräischen Nifal: Gottes schon bestehende Heiligkeit wird in seinem gerechten Handeln offenbar und bestätigt.'
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: Gericht … Gerechtigkeit
  alternative: Recht … Gerechtigkeit; Gerechtigkeit … Gerechtigkeit
  rationale: Zwei unterschiedliche deutsche Begriffe bewahren die verwandten, aber nicht identischen hebräischen Wörter. „Gericht“ entspricht zugleich dem Strafgericht im Kontext.
- issue: Art der Erhöhung Jahwes
  choice: erweist sich erhaben
  alternative: wird erhöht; ist erhaben
  rationale: Die Aussage beschreibt weder eine Veränderung von Gottes Rang noch notwendig eine Erhöhung durch andere, sondern die Offenbarung seiner Erhabenheit in seinem Gericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus wird durch „erweist sich erhaben … erweist sich als heilig“ hörbar gemacht; „Gericht … Gerechtigkeit“ erhält die lexikalische Spannung des Hebräischen.
