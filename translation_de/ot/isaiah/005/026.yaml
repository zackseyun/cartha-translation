base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: de
  text: 'Er richtet für die Völker aus der Ferne ein Feldzeichen auf[a] und pfeift sie vom Ende der Erde herbei[b]. Und siehe: Schnell und geschwind kommt er[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Signalzeichen“ beziehungsweise „ein Banner“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht beim Ziel des Pfeifens die männliche Einzahl: „ihm“. Sie bezieht sich wahrscheinlich kollektiv auf die herbeigerufenen Völker beziehungsweise die herannahende Streitmacht.'
    reason: grammatical_collective
  - marker: c
    text: 'Das Hebräische verwendet die männliche Einzahl: „er kommt“. Damit wird die herannahende Macht wahrscheinlich als kollektive Einheit dargestellt.'
    reason: grammatical_collective
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Er richtet ... auf
  rationale: Das Qatal hat im prophetischen Zusammenhang zukünftigen beziehungsweise anschaulich bevorstehenden Sinn. „Ein Feldzeichen aufrichten“ ist eine natürliche deutsche Verbindung.
- source_word: נֵס
  choice: ein Feldzeichen
  rationale: נֵס bezeichnet ein erhöhtes Signal beziehungsweise militärisches Sammelzeichen. „Feldzeichen“ bewahrt sowohl die Signal- als auch die militärische Bildwelt.
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: für die Völker aus der Ferne
  rationale: Die Präposition ל bezeichnet die Adressaten des Zeichens; מֵרָחוֹק charakterisiert ihre entfernte Herkunft beziehungsweise Lage.
- source_word: וְשָׁרַק
  choice: und pfeift ... herbei
  rationale: Das Verb bezeichnet einen scharfen Pfeifton, der hier als Rufsignal dient. „Herbeipfeifen“ macht diese Funktion im Deutschen deutlich.
- source_word: לוֹ
  choice: sie
  rationale: Der hebräische Ausdruck ist formal maskulin Singular („ihm“), nimmt die zuvor genannten Völker jedoch kollektiv auf. Der Plural ist im Deutschen an dieser Stelle verständlicher; die Singularform des Schlussverbs bleibt erhalten und wird erläutert.
- source_word: מִקְצֵה הָאָרֶץ
  choice: vom Ende der Erde
  rationale: Die Wendung bezeichnet den fernsten Bereich der Erde. Die weitgespannte internationale Perspektive spricht hier für „Erde“ statt „Land“.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Wendung erhält die anschauliche Unmittelbarkeit des prophetischen Hinweises.
- source_word: מְהֵרָה קַל
  choice: Schnell und geschwind
  rationale: Die beiden Ausdrücke verstärken gemeinsam die Vorstellung eines raschen Eintreffens. Die deutsche Doppelung bewahrt diesen Nachdruck.
- source_word: יָבֹוא
  choice: kommt es
  rationale: Das maskuline Singularverb stellt die herannahende Streitmacht kollektiv als eine Einheit dar. Das neutrale Pronomen „es“ verweist im Deutschen auf das als Ganzes gedachte Heer, ohne eine einzelne männliche Person einzuführen.
theological_decisions:
- issue: Singularische Darstellung der herbeigerufenen Völker beziehungsweise Streitmacht
  choice: Im ersten Satz steht wegen des ausdrücklichen Plurals „Völker“ das deutsche „sie“; im Schlusssatz bleibt die kollektive Singularvorstellung mit „kommt es“ erkennbar.
  alternative: Durchgehend singularisch („ihm … er kommt“) oder durchgehend pluralisch („sie … sie kommen“).
  rationale: Der hebräische Text verbindet den Plural „Völker“ mit singularischem Pronomen und Verb. Die Übersetzung glättet dies nicht vollständig, sondern erhält im Schluss die kollektive Singularperspektive, ohne sie auf eine bestimmte Person festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhter prophetischer Sprache. „Feldzeichen“ erhält die militärische Bildwelt; „Und siehe“ bewahrt die dramatische Unmittelbarkeit. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Textstellen.
