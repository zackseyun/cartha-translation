  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Gott richtet ein Feldzeichen für weit entfernte Völker auf, ruft durch Pfeifen, und die herbeigerufene Macht kommt mit großer Geschwindigkeit. Die deutsche neutrale Formulierung „kommt es“ gibt jedoch die maskuline Singularform יָבֹוא nicht wieder und legt mit einem im Text nicht genannten Neutrum eine Deutung nahe. Die hebräische Singularspannung sollte im Text besser erhalten bleiben.'
  naturalness: „Er richtet für die Völker aus der Ferne ein Feldzeichen auf“ und „pfeift sie ... herbei“ sind natürliches, würdiges modernes Standarddeutsch. „Schnell und geschwind“ ist bewusst verstärkend und im prophetischen Register vertretbar. „Und siehe“ ist leicht gehoben, aber verständlich und passend.
  terminology: „Feldzeichen“ ist für נֵס präzise und bewahrt die militärisch-signalhafte Bildwelt. „Pfeift ... herbei“ trifft שָׁרַק gut. Die Fußnoten sollen die grammatische Singularform erläutern, ohne den Referenten zu stark als eindeutig „Streitmacht“ festzulegen.
