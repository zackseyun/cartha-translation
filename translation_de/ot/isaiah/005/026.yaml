    rationale: Das Singularsuffix לוֹ ist im Kontext wahrscheinlich kollektiv zu verstehen, doch der genaue Bezug bleibt grammatisch und kontextuell angespannt. Die Anmerkung sollte neben einer Streitmacht auch die zuvor genannten Völker als mögliche kollektive Bezugsebene nennen.
