  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
translation:
  language: de
  text: Dessen Pfeile sind geschärft, und all seine Bogen sind gespannt. Die Hufe seiner Pferde gelten als Feuerstein[a] und seine Räder als Wirbelsturm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als harter Stein“; das Bild hebt die Härte und Widerstandskraft der Pferdehufe hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Sturmwind“; das Bild betont die Geschwindigkeit und Wucht der Räder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Dessen
  rationale: Leitet wie im Hebräischen einen Relativsatz ein, der die im vorherigen Vers genannte heranrückende Streitmacht beschreibt; die maskulinen Singularsuffixe werden dabei bewahrt.
- source_word: חִצָּיו שְׁנוּנִים
  choice: seine Pfeile sind geschärft
  rationale: שְׁנוּנִים bezeichnet scharf gemachte beziehungsweise scharfe Pfeile und unterstreicht die unmittelbare Kampfbereitschaft.
- source_word: כָל קַשְּׁתֹתָיו דְּרֻכוֹת
  choice: all seine Bogen sind gespannt
  rationale: דרך bezeichnet beim Bogen das Niederdrücken beziehungsweise Spannen zur Gebrauchsfertigkeit. „Gespannt“ ist im Deutschen die natürliche militärische Wendung.
- source_word: פַּרְסוֹת סוּסָיו
  choice: die Hufe seiner Pferde
  rationale: Gibt die Constructusverbindung und das maskuline Singularsuffix direkt und idiomatisch wieder.
- source_word: כַּצַּר נֶחְשָׁבוּ
  choice: gelten als Feuerstein
  rationale: Die Niphalform von חשׁב bedeutet „gelten als/angesehen werden als“. צַר bezeichnet hier einen außerordentlich harten Stein, wahrscheinlich Feuerstein.
- source_word: וְגַלְגִּלָּיו כַּסּוּפָה
  choice: und seine Räder als Wirbelsturm
  rationale: Das im ersten Halbvers ausgedrückte „gelten“ wird elliptisch weitergeführt. סוּפָה bezeichnet einen heftigen Sturm oder Wirbelsturm und vermittelt Schnelligkeit und Gewalt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen, parallelen Aussagen und die personifizierenden maskulinen Singularformen des Hebräischen bleiben erhalten. „Bogen“ wird entsprechend dem üblichen deutschen Singular und Plural ohne zusätzliche Flexionsmarkierung verwendet.
