base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: de
  text: Er grub ihn um, entfernte die Steine und bepflanzte ihn mit Edelreben. Mitten darin baute er einen Turm und hieb auch eine Kelter darin aus. Dann erwartete er, dass der Weinberg Trauben hervorbringen würde, doch der Weinberg brachte schlechte Trauben[a] hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: übel riechende Trauben; das seltene hebräische Wort bezeichnet verdorbene, minderwertige oder üble Frucht statt der erwarteten guten Trauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: Er grub ihn um
  rationale: Das Verb bezeichnet hier die Bearbeitung des Bodens im Weinberg. »Umgraben« ist im heutigen Deutsch anschaulich und idiomatisch, ohne eine bestimmte landwirtschaftliche Technik übermäßig festzulegen.
- source_word: וַיְסַקְּלֵהוּ
  choice: entfernte die Steine
  rationale: Im Weinbaukontext bedeutet das Piel, ein Grundstück von Steinen zu befreien; die Formulierung vermeidet das irreführende wörtliche »steinigte ihn«.
- source_word: שֹׂרֵק
  choice: Edelreben
  rationale: Das Wort bezeichnet eine ausgewählte, hochwertige Rebe beziehungsweise einen edlen Rebbestand. Der deutsche Plural gibt den kollektiven Sinn beim Bepflanzen eines Weinbergs natürlich wieder.
- source_word: מִגְדָּל
  choice: Turm
  rationale: Das hebräische Wort bedeutet allgemein »Turm«. Seine wahrscheinliche Funktion als Wachturm wird nicht in den Text hineingetragen.
- source_word: בְּתוֹכוֹ
  choice: Mitten darin
  rationale: Die Wendung bewahrt die räumliche Aussage und den poetischen Ton in natürlichem Deutsch.
- source_word: יֶקֶב
  choice: Kelter
  rationale: »Kelter« ist die geläufige deutsche Bezeichnung für die Anlage zum Auspressen der Trauben und passt zum Weinbergkontext.
- source_word: חָצֵב
  choice: hieb … aus
  rationale: Das Verb bezeichnet das Aushauen, häufig aus Stein, und erhält so das konkrete Bild sorgfältiger, mühevoller Vorbereitung.
- source_word: וַיְקַו
  choice: erwartete
  rationale: Das Verb kann »warten«, »hoffen« oder »erwarten« bedeuten. Nach den umfassenden Vorbereitungen bringt »erwartete« die begründete Erwartung am klarsten zum Ausdruck.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: dass der Weinberg Trauben hervorbringen würde
  rationale: Hebräisch steht wörtlich »Trauben machen«. »Trauben hervorbringen« ist im Deutschen natürlich; die Wiederaufnahme von »der Weinberg« beseitigt eine sonst störende Mehrdeutigkeit des Pronomens.
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: doch er brachte schlechte Trauben hervor
  rationale: בְּאֻשִׁים bezeichnet üble, minderwertige oder übel riechende Frucht. »Schlechte Trauben« bewahrt den deutlichen Gegensatz zu den erwarteten guten Trauben, ohne die genaue Art des Mangels enger festzulegen, als es das seltene Wort erlaubt.
theological_decisions:
- issue: Die Weinbergmetapher wird im folgenden Kontext auf Israel bezogen.
  choice: Die konkrete landwirtschaftliche Bildsprache bleibt ohne vorweggenommene Deutung erhalten.
  alternative: Den Weinberg oder seine Frucht bereits in diesem Vers ausdrücklich mit Israel und dessen Verhalten identifizieren.
  rationale: Der Vers entfaltet zunächst das Weinberglied; erst der folgende Kontext legt dessen Bezug offen. So bleiben die narrative Entwicklung und die theologische Spannung des Bildes gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer landwirtschaftlicher Bildsprache. »Edelreben«, »Turm« und »Kelter« halten den poetischen Charakter aufrecht, bleiben aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalische Erläuterung bezieht.
