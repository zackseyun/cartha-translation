base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: de
  text: Wehe den Helden im Weintrinken[a] und den Männern von Tatkraft[b] beim Mischen von berauschendem Getränk!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mächtigen Männern“. Das hebräische Wort bezeichnet oft Helden, Krieger oder einflussreiche Männer; hier wird es ironisch auf ihre Leistung beim Trinken bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tapferen Männern“ beziehungsweise „tüchtigen Männern“. Die sonst ehrenvolle Bezeichnung wird hier sarkastisch für ihre Fähigkeit gebraucht, berauschendes Getränk zu mischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Weheformel bringt hier zugleich Anklage und angekündigtes Gericht zum Ausdruck.
- source_word: גִּבּוֹרִים
  choice: Helden
  rationale: Das Wort bezeichnet gewöhnlich mächtige Männer oder Krieger. „Helden“ bewahrt die ironische Übertragung auf ihre vermeintliche Größe beim Trinken.
- source_word: לִשְׁתּוֹת יַיִן
  choice: im Weintrinken
  rationale: Die Formulierung gibt den Bereich wieder, in dem diese Männer ironisch als Helden gelten, und bildet im Deutschen eine knappe Parallele zum zweiten Halbvers.
- source_word: אַנְשֵׁי חַיִל
  choice: Männer von Tatkraft
  rationale: Die Wendung kann tüchtige, starke oder tapfere Männer bezeichnen. „Männer von Tatkraft“ erhält den anerkennenden Klang, der hier sarkastisch auf das Zubereiten berauschender Getränke bezogen wird.
- source_word: לִמְסֹךְ
  choice: im Mischen
  rationale: Das Verb bezeichnet das Mischen beziehungsweise Zubereiten eines Getränks; die konkrete Tätigkeit und die Parallelität zum „Weintrinken“ bleiben erhalten.
- source_word: שֵׁכָר
  choice: berauschender Getränke
  rationale: Der hebräische Begriff bezeichnet berauschende Getränke, häufig neben Wein, ohne eine bestimmte Getränkeart eindeutig festzulegen. Der Plural ist im Deutschen als Gattungsbezeichnung natürlich.
theological_decisions:
- issue: Ironischer Gebrauch ehrenvoller Bezeichnungen
  choice: Die positiven Ausdrücke „Helden“ und „Männer von Tatkraft“ werden beibehalten, sodass der Sarkasmus aus ihrem Bezug auf Trinken und Mischen hervorgeht.
  alternative: Die Ironie ausdrücklich durch Zusätze wie „sogenannte Helden“ kennzeichnen.
  rationale: Der hebräische Text erklärt die Ironie nicht, sondern erzeugt sie durch die überraschende Verbindung. Die Übersetzung sollte sie daher nicht interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Hebräischen und der beißende ironische Ton bleiben erhalten; „berauschende Getränke“ vermeidet eine unbelegte Festlegung auf Bier oder hochprozentige Getränke.
