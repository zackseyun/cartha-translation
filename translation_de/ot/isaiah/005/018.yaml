  text: ה֛וֹי מֹשְׁכֵ֥י הֶֽ/עָוֺ֖ן בְּ/חַבְלֵ֣י הַ/שָּׁ֑וְא וְ/כַ/עֲב֥וֹת הָ/עֲגָלָ֖ה חַטָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: de
  text: Wehe denen, die Schuld mit Stricken des Trugs ziehen und Sünde wie mit dicken Seilen eines Wagens!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Weheruf ein und bewahrt dessen anklagende und zugleich klagende Kraft.
- source_word: מֹשְׁכֵי
  choice: die … ziehen
  rationale: Das Partizip bezeichnet fortdauerndes, bewusstes Handeln. „Ziehen“ erhält das anschauliche Bild, ohne die Richtung des Ziehens festzulegen.
- source_word: עָוֹן
  choice: Schuld
  rationale: Das Wort kann sowohl schuldhaftes Unrecht als auch die daraus erwachsende Schuld oder Folge bezeichnen. „Schuld“ hält diese Bedeutungsbreite offen und bleibt vom folgenden „Sünde“ unterschieden.
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: mit Stricken des Trugs
  rationale: חֶבֶל bezeichnet einen Strick oder ein Seil; שָׁוְא kann Trug, Falschheit, Nichtigkeit oder Leere bedeuten. „Trug“ ergibt im Deutschen ein kräftiges, verständliches Bild; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: וְכַעֲבֹתוֹת הָעֲגָלָה
  choice: und … wie mit Wagenseilen
  rationale: Das Präfix כ kennzeichnet ausdrücklich einen Vergleich. עֲבֹתוֹת sind starke oder dicke Seile, hier die Seile eines Wagens. „Wie mit Wagenseilen“ gibt Vergleich und Bild natürlich wieder.
- source_word: חַטָּאָה
  choice: Sünde
  rationale: Die übliche und sachlich passende Wiedergabe hält den Begriff vom zuvor genannten עָוֹן („Schuld“) unterscheidbar.
theological_decisions:
- issue: Beziehung der Menschen zu Schuld und Sünde im Bild des Ziehens
  choice: Der Haupttext lässt offen, ob sie Schuld und Sünde mit sich ziehen oder auf sich heranziehen.
  alternative: Das Bild ausschließlich als bewusstes Hinter-sich-Herziehen des Bösen oder ausschließlich als Herbeiziehen von Strafe verstehen.
  rationale: Die hebräischen Begriffe und das Verb erlauben sowohl das Bild hartnäckiger Bindung an das Böse als auch den Gedanken, dass Menschen Schuld beziehungsweise deren Folgen auf sich ziehen. Die richtungsneutrale Formulierung „ziehen“ löst diese Spannung nicht vorschnell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knappem prophetischem Rhythmus. Die ungewöhnliche Bildsprache des Hebräischen bleibt erhalten; „Wagenseile“ ist anschaulich und verständlich, während die Fußnoten echte lexikalische und theologische Mehrdeutigkeit ausweisen.
