id: ISA.5.27
reference: Isaiah 5:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵין עָיֵ֤ף וְ/אֵין כּוֹשֵׁל֙ בּ֔/וֹ לֹ֥א יָנ֖וּם וְ/לֹ֣א יִישָׁ֑ן וְ/לֹ֤א נִפְתַּח֙ אֵז֣וֹר חֲלָצָ֔י/ו וְ/לֹ֥א נִתַּ֖ק שְׂר֥וֹךְ נְעָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: de
  text: Keiner unter ihnen ist müde[a], keiner strauchelt; keiner schlummert oder schläft. Keinem löst sich der Gürtel um die Hüften[b], und keinem reißt der Riemen seiner Sandalen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in ihm«; das Hebräische gebraucht ein Pronomen im Singular und fasst damit das heranziehende Heer als Einheit auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: »der Gürtel seiner Lenden öffnet sich nicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָיֵף
  choice: müde
  rationale: Bezeichnet körperliche Ermüdung und ist im Zusammenhang eines unaufhaltsam heranziehenden Heeres klar und natürlich.
- source_word: כּוֹשֵׁל
  choice: strauchelt
  rationale: Gibt das Stolpern oder Wanken wieder und passt zur Beschreibung der uneingeschränkten Marschfähigkeit.
- source_word: בּוֹ
  choice: unter ihnen
  rationale: Das morphologisch singularische Pronomen bezieht sich auf das als Einheit betrachtete Heer; die distributive Wiedergabe ist im Deutschen natürlich, während die Form im Fußnotenhinweis sichtbar bleibt.
- source_word: יָנוּם
  choice: schlummert
  rationale: Bewahrt gegenüber dem folgenden »schläft« die poetische Paarung zweier naher, aber verschiedener Verben.
- source_word: יִישָׁן
  choice: schläft
  rationale: Die übliche und klare Wiedergabe des Verbs für Schlafen.
- source_word: נִפְתַּח
  choice: löst sich
  rationale: Bei einem Gürtel bezeichnet das wörtliche »wird geöffnet« hier idiomatisch, dass er sich öffnet oder locker wird.
- source_word: אֵזוֹר חֲלָצָיו
  choice: der Gürtel um die Hüften
  rationale: Gibt Gürtel und Körperregion konkret und in modernem Deutsch wieder, ohne das heute altertümlich wirkende »Lenden« im Haupttext zu verwenden.
- source_word: נִתַּק
  choice: reißt
  rationale: Das Verb beschreibt ein Abreißen oder Zerreißen; beim Sandalenriemen ist »reißt« prägnant und idiomatisch.
- source_word: שְׂרוֹךְ נְעָלָיו
  choice: der Riemen seiner Sandalen
  rationale: Bewahrt die historische Art des Schuhwerks und bezeichnet dessen Befestigung verständlich als Riemen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die wiederholte distributive Form »keiner/keinem« macht die kollektive Aussage natürlich verständlich; die singularische Bildsprache des hebräischen Textes wird in den Ausrüstungsdetails beibehalten.
