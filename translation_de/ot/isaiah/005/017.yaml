base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/017.yaml
  text: Then lambs will graze as in their pasture[d][c][b][a], and sojourners will eat among the ruins of the well-fed.
translation:
  language: de
  text: Dann werden Lämmer[a] wie auf ihrer Weide[b] grasen, und Fremde[c] werden in den Ruinen der Wohlgenährten[d] essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schafe.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist schwierig; wahrscheinlich: wie auf ihrer Weide. Auch möglich: an ihrem Weideplatz.'
    reason: textual_or_lexical_ambiguity
  - marker: c
    text: 'Oder: Zugezogene; gemeint sind ansässige Fremde.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: der Fetten beziehungsweise der Reichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: Dann werden … grasen
  rationale: Das Qal von רעה bezeichnet hier das Grasen von Tieren. »Dann« gibt den Zusammenhang mit dem zuvor angekündigten Gericht als Folge wieder.
- source_word: כְבָשִׂים
  choice: Lämmer
  rationale: Das Wort kann Schafe im Allgemeinen bezeichnen, hat hier aber gut verständlich den geläufigen Sinn »Lämmer«.
- source_word: כְדָבְרָם
  choice: wie auf ihrer eigenen Weide
  rationale: Die schwierige Form wird im Kontext am plausibelsten mit דֹּבֶר im Sinn eines Weideplatzes verbunden. »Eigene« bringt das pronominale Suffix zum Ausdruck, ohne die unsichere Wendung zu überpräzisieren.
- source_word: וְחָרְבוֹת
  choice: in den Trümmerstätten
  rationale: Der Plural bezeichnet verwüstete oder in Trümmern liegende Orte. Die deutsche Präposition macht die im Hebräischen knappe Ortsangabe verständlich.
- source_word: מֵחִים
  choice: der Wohlgenährten
  rationale: Die seltene Form wird gewöhnlich auf fette beziehungsweise wohlhabende Menschen bezogen. »Wohlgenährte« bewahrt das konkrete Bild und lässt zugleich die soziale Bedeutung erkennen.
- source_word: גָּרִים
  choice: Fremde
  rationale: גרים bezeichnet Menschen, die als Zugezogene oder Schutzbürger außerhalb ihrer angestammten Gemeinschaft leben. »Fremde« ist hier knapp und natürlich; die genauere Alternative wird in der Fußnote genannt.
- source_word: יֹאכֵלוּ
  choice: werden … essen
  rationale: Die gewöhnliche Bedeutung »essen« bleibt erhalten. Was genau in den verwüsteten Anwesen gegessen wird, lässt der knappe hebräische Satz unausgesprochen.
theological_decisions:
- issue: Gericht und soziale Umkehrung
  choice: 'Das Bild bleibt konkret: Nach dem Gericht grasen Lämmer dort, und Fremde essen in den Trümmerstätten der zuvor Wohlgenährten.'
  alternative: Die Wohlgenährten ausdrücklich als »Reiche« bezeichnen und die Fremden als deren Erben darstellen.
  rationale: Der Vers legt eine Umkehrung nahe, benennt deren gesellschaftliche und theologische Einzelheiten jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem knappen Bild des Hebräischen; Fußnoten halten die Unsicherheiten bei כְדָבְרָם und מֵחִים sowie die Bedeutungsbreite von כְבָשִׂים und גָּרִים offen.
