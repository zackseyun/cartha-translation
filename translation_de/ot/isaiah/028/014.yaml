  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: de
  text: Darum hört das Wort Jahwes, ihr Spötter[a], Herrscher dieses Volkes, die ihr in Jerusalem seid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer des Spottes“; gemeint sind Männer, die spotten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dieses Volk, das in Jerusalem ist“; die knappe hebräische Relativkonstruktion kann auch auf „Volk“ bezogen werden.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Zusammenhang und wahrt den prophetischen Gedankengang in natürlichem Deutsch.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ bewahrt den prophetischen Höraufruf, ohne dessen responsive Bedeutung vorschnell als „gehorcht“ festzulegen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ entspricht der festen prophetischen Wendung; „Jahwe“ gibt den im Hebräischen stehenden Gottesnamen als Namen wieder.
- source_word: אַנְשֵׁי לָצוֹן
  choice: ihr Spötter
  rationale: Die hebräische Konstruktverbindung bezeichnet Männer, deren Haltung durch Spott geprägt ist. „Spötter“ ist im Deutschen natürlich, prägnant und im Kontext als männliche Anrede verständlich.
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  choice: die ihr über dieses Volk ... herrscht
  rationale: Das Partizip von משל bezeichnet die angesprochenen Männer als Herrschende; die verbale Relativkonstruktion klingt im Deutschen natürlicher als „Herrscher dieses Volkes“ und bewahrt die direkte Anrede.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: 'Die Ortsangabe wird auf das Volk bezogen: „dieses Volk in Jerusalem“. Das Hebräische lässt syntaktisch auch einen Bezug auf die Herrschenden zu.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt dessen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bezugswort des Relativsatzes אֲשֶׁר בִּירוּשָׁלָם
  choice: dieses Volk in Jerusalem
  alternative: die Herrschenden, die in Jerusalem sind
  rationale: Das unmittelbar vorausgehende „dieses Volk“ bietet einen natürlichen grammatischen Bezug. Da der Sinn im Kontext weitgehend gleich bleibt und die hebräische Zuordnung knapp ist, wird die alternative syntaktische Analyse nicht dogmatisch ausgeschlossen.
- issue: Männliche Anrede אַנְשֵׁי
  choice: ihr Spötter
  alternative: ihr spottenden Männer
  rationale: Der Kontext richtet die Anrede an männliche Machthaber. Das maskuline deutsche Substantiv wahrt dies idiomatisch, ohne die schwerfällige wörtliche Wendung „Männer des Spottes“ zu verwenden.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit direkter Anrede. Die Wortstellung ist gegenüber dem Hebräischen leicht geglättet, ohne den scharfen Ton des Gerichtsorakels abzuschwächen.
