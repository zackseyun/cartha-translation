reference: Isaiah 28:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: de
  text: Wehe der stolzen Krone der Trunkenen Ephraims und der welkenden Blüte seiner herrlichen Pracht, die auf dem Haupt des fruchtbaren Tales[a] liegt — sie sind vom Wein niedergeschlagen![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Tal der Fettigkeiten“; gemeint ist ein fruchtbares, üppiges Tal.
    reason: cultural_note
  - marker: b
    text: 'Oder: „vom Wein überwältigt“. Das hebräische Wort zeichnet sie wörtlich als vom Wein geschlagen oder niedergeschlagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Klage- und Gerichtsruf ein; „Wehe“ bewahrt dessen Ernst und Wucht.
- source_word: עֲטֶרֶת גֵּאוּת
  choice: der stolzen Krone
  rationale: Gibt die Konstruktverbindung „Krone des Stolzes“ natürlich adjektivisch wieder und erhält das Bild einer von Hochmut geprägten Krone.
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: der Trunkenbolde Ephraims
  rationale: Bezeichnet die Ephraim zugehörigen, durch Trunkenheit charakterisierten Menschen; „Trunkenbolde“ ist prägnant und dem prophetischen Tadel angemessen.
- source_word: וְצִיץ נֹבֵל
  choice: und der welkenden Blüte
  rationale: צִיץ bezeichnet Blüte oder Blume, נֹבֵל das Welken; die Formulierung bewahrt das poetische Parallelbild.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: seiner herrlichen Pracht
  rationale: Die Häufung von Ausdrücken für Schönheit, Zierde und Herrlichkeit wird in gehobener, aber verständlicher Sprache wiedergegeben. Das Suffix wird auf Ephraim beziehungsweise dessen Krone bezogen, ohne die Metapher aufzulösen.
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: die das Haupt des üppigen Tales ziert
  rationale: רֹאשׁ bleibt als „Haupt“ bildhaft erhalten; שְׁמָנִים bezeichnet idiomatisch Fruchtbarkeit und reichen Ertrag. Das ergänzte Verb „ziert“ macht die elliptische Ortsangabe im Deutschen verständlich.
- source_word: הֲלוּמֵי יָיִן
  choice: sie sind vom Wein niedergeschlagen
  rationale: Bewahrt das anschauliche Passiv von הלם („schlagen, niederschlagen“) und vermeidet die Abschwächung zu bloßem Betrunkensein.
theological_decisions:
- issue: Bezug und syntaktische Einordnung von הֲלוּמֵי יָיִן
  choice: 'Als abschließende Charakterisierung der Ephraimiter: „sie sind vom Wein niedergeschlagen“'
  alternative: 'Als nähere Bestimmung der Bewohner des üppigen Tales oder weniger bildhaft: „vom Wein überwältigt“'
  rationale: Die hebräische Poesie lässt den genauen Anschluss offen. Die eigenständige Schlusswendung bewahrt sowohl die Rückbindung an die Trunkenbolde als auch die eindringliche Bildsprache.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die Metaphern von Krone, welkender Blüte und Haupt des Tales bleiben erhalten; der Gedankenstrich markiert die syntaktisch mehrdeutige, schlagkräftige Schlusswendung.
