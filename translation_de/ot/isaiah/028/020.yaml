id: ISA.28.20
reference: Isaiah 28:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: de
  text: Denn das Bett ist zu kurz, um sich darauf auszustrecken, und die Decke[a] zu schmal, um sich darin einzuhüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet hier nach dem Zusammenhang eine Bettdecke; dieselbe Wortform kann andernorts auch ein gegossenes Bild bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende beziehungsweise erläuternde Aussage ein und verbindet den Spruch natürlich mit dem vorausgehenden Zusammenhang.
- source_word: קָצַר הַמַּצָּע
  choice: das Bett ist zu kurz
  rationale: מַצָּע bezeichnet eine Unterlage zum Liegen; „Bett“ ist die natürliche moderne Entsprechung. קָצַר beschreibt hier nicht nur Kürze, sondern die Unzulänglichkeit für den beabsichtigten Gebrauch.
- source_word: מֵהִשְׂתָּרֵעַ
  choice: um sich darauf auszustrecken
  rationale: Bewahrt den reflexiven Sinn des Verbs und macht deutlich, dass das Bett für ausgestrecktes Liegen nicht ausreicht.
- source_word: וְהַמַּסֵּכָה
  choice: und die Decke
  rationale: Im Bildfeld von Bett und Liegen bezeichnet das Substantiv hier eine Bedeckung beziehungsweise Bettdecke. „Decke“ ist im Deutschen treffend und nicht unnötig spezifisch.
- source_word: צָרָה
  choice: zu schmal
  rationale: Bringt wie „zu kurz“ die im Kontext gemeinte Unzulänglichkeit idiomatisch zum Ausdruck.
- source_word: כְּהִתְכַּנֵּס
  choice: um sich darin einzuhüllen
  rationale: Gibt das Zusammennehmen beziehungsweise Herumziehen der Decke und den reflexiven Charakter der Form natürlich wieder, ohne das konkrete Bild übermäßig festzulegen.
theological_decisions: []
translation_notes:
  register: Sprichwortartig, knapp und bildhaft. Die parallele Konstruktion „zu kurz … zu schmal“ bewahrt den Rhythmus und die Aussage von völliger Unzulänglichkeit in natürlichem, modernem Standarddeutsch.
