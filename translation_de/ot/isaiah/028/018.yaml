source:
  edition: WLC
  text: וְ/כֻפַּ֤ר בְּרִֽיתְ/כֶם֙ אֶת מָ֔וֶת וְ/חָזוּתְ/כֶ֥ם אֶת שְׁא֖וֹל לֹ֣א תָק֑וּם שׁ֤וֹט שׁוֹטֵף֙ כִּ֣י יַֽעֲבֹ֔ר וִ/הְיִ֥יתֶם ל֖/וֹ לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: de
  text: Und euer Bund mit dem Tod wird aufgehoben, und eure Abmachung mit dem Scheol[a] wird keinen Bestand haben. Wenn die hinwegfegende Geißel[b] hindurchzieht, werdet ihr von ihr zertreten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Scheol ist der hebräische Ausdruck für den Bereich der Toten; auch: „Totenreich“ oder „Grab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch wörtlich: „die überströmende Geißel“. Das hebräische Bild verbindet eine Geißel mit der mitreißenden Gewalt einer Flut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: wird aufgehoben werden
  rationale: Im Zusammenhang mit בְּרִית bezeichnet die Passivform, dass der Bund unwirksam gemacht beziehungsweise außer Kraft gesetzt wird. „Aufgehoben“ gibt den rechtlich-bündischen Sinn natürlich wieder, ohne eine kultische Sühnebedeutung einzutragen.
- source_word: בְּרִיתְכֶם
  choice: euer Bund
  rationale: „Bund“ bewahrt den formellen Beziehungsbegriff und die ironische Vorstellung eines Bundes mit dem personifizierten Tod.
- source_word: חָזוּתְכֶם
  choice: eure Abmachung
  rationale: Parallel zu „Bund“ bezeichnet חָזוּת hier eine Vereinbarung, nicht eine Vision. „Abmachung“ ist verständlich und lässt zugleich die Variation im Parallelismus erkennen.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den hebräischen Begriff für den Bereich der Toten und verengt ihn nicht auf ein einzelnes Grab.
- source_word: לֹא תָקוּם
  choice: wird keinen Bestand haben
  rationale: Die Wendung bezeichnet eine Vereinbarung, die nicht bestehen oder wirksam bleiben wird; diese deutsche Formulierung ist idiomatisch und präzise.
- source_word: שׁוֹט שׁוֹטֵף
  choice: die hinwegfegende Geißel
  rationale: Die Formulierung verbindet eine Geißel mit überströmender, alles mitreißender Gewalt. „Hinwegfegend“ vermittelt die flutartige Bewegung in natürlichem Deutsch.
- source_word: יַעֲבֹר
  choice: hindurchzieht
  rationale: Das Verb beschreibt, wie das Gericht durch das Land beziehungsweise über die Menschen hinweggeht; „hindurchzieht“ vermeidet den möglichen Beiklang des Verschonens.
- source_word: לְמִרְמָס
  choice: von ihr zertreten werden
  rationale: Die prädikative Wendung bedeutet wörtlich, dass sie der Geißel zum Zertreten beziehungsweise zum Ort des Zertretens werden. Die verbale Fassung ist im Deutschen natürlich und erhält das Bild des Niedergetretenwerdens.
theological_decisions:
- issue: Personifikation von Tod und Scheol
  choice: „Tod“ und „Scheol“ als gegenübergestellte, personifizierte Mächte beibehalten
  alternative: „Tod“ und „Totenreich“ oder „Grab“ stärker erklärend wiedergeben
  rationale: Die prophetische Polemik verspottet die vermeintliche Sicherheit Judas als Bund mit dem Tod und Abmachung mit dem Scheol. Die Bildsprache wird bewahrt, ohne zusätzliche Aussagen über deren Wesen zu machen.
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab
  rationale: „Scheol“ erhält den besonderen hebräischen Vorstellungsgehalt und die Spannung im Parallelismus mit dem Tod; „Grab“ wäre zu eng.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der formelle Parallelismus „Bund … Abmachung“ bleibt erhalten. „Hinwegfegende Geißel“ bewahrt das ungewöhnliche Mischbild des Hebräischen; der abschließende Satz wird für natürliches Deutsch verbal formuliert.
