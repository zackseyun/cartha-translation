  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: de
  text: Mit Füßen wird die stolze Krone der Betrunkenen Ephraims zertreten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Mit Füßen wird die Krone des Stolzes der Betrunkenen Ephraims zertreten werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: mit Füßen
  rationale: Die Präposition ב mit dem Dual „Füße“ bezeichnet hier das Mittel des Zertretens. „Mit Füßen“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: תֵּרָמַסְנָה
  choice: wird zertreten
  rationale: Der Nifal-Imperfekt von רמס drückt passives Zertreten aus. Die feminine Verbform stimmt mit עֲטֶרֶת („Krone“) überein; die ungewöhnliche Endung wird nicht eigens abgebildet.
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Das Wort kann eine Krone, einen Kranz oder eine Girlande bezeichnen. „Krone“ erhält im Zusammenhang das Bild von Ephraims stolzer, hervorgehobener Stellung.
- source_word: גֵּאוּת
  choice: stolze
  rationale: Das Substantiv bezeichnet Stolz, Hochmut oder Hoheit. Die attributive Wiedergabe „stolze Krone“ ist im modernen Deutschen natürlich und bewahrt hier den negativen Sinn.
- source_word: שִׁכּוֹרֵי
  choice: der Betrunkenen
  rationale: Die substantivierte Pluralform bezeichnet Menschen, die durch Trunkenheit gekennzeichnet sind. „Betrunkene“ ist gegenwärtig und verständlich, ohne die Aussage unnötig zu verschärfen.
- source_word: אֶפְרָיִם
  choice: Ephraims
  rationale: Der Eigenname wird beibehalten und als Genitivattribut wiedergegeben. Im Kontext steht Ephraim für das Nordreich, doch diese Deutung wird nicht in den Haupttext eingesetzt.
theological_decisions:
- issue: Genitivverbindung עֲטֶרֶת גֵּאוּת
  choice: „die stolze Krone“
  alternative: „die Krone des Stolzes“ oder „die Krone des Hochmuts“
  rationale: Die Verbindung kann formal als Genitiv wiedergegeben werden. Die attributive Form ist natürlicher, bewahrt das Kronenbild und lässt offen, ob die Krone durch Stolz gekennzeichnet ist oder den Stolz Ephraims verkörpert.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Voranstellung von „Mit Füßen“. Die Wortstellung folgt der Hervorhebung im Hebräischen und hält das Bild des gewaltsamen Zertretens im Vordergrund.
