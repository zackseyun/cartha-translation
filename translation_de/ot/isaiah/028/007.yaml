source:
  edition: WLC
  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: de
  text: 'Und auch diese taumeln vom Wein und schwanken vom Rauschtrank: Priester und Prophet taumeln vom Rauschtrank, sie sind vom Wein überwältigt, schwanken vom Rauschtrank; sie taumeln beim Schauen[a], wanken beim Rechtsprechen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der prophetischen Schau« beziehungsweise »in der Vision«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beim Urteil« beziehungsweise »bei der Rechtsentscheidung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: Und auch diese
  rationale: Bewahrt die anknüpfende und zugleich hervorhebende Kraft der Wendung, ohne den Bezug zur vorherigen Gruppe näher festzulegen.
- source_word: שָׁגוּ / תָּעוּ / פָּקוּ
  choice: taumeln / schwanken / wanken
  rationale: Im Zusammenhang der Trunkenheit bezeichnen die Verben körperliche Unsicherheit, lassen aber zugleich die übertragene Bedeutung des Irrens anklingen. Die Variation bildet den hebräischen Parallelismus ab.
- source_word: שֵׁכָר
  choice: Rauschtrank
  rationale: Bezeichnet ein berauschendes Getränk neben Wein. „Rauschtrank“ ist breit genug und in gehobenem, aber verständlichem Bibeldeutsch natürlich.
- source_word: כֹּהֵן וְנָבִיא
  choice: Priester und Prophet
  rationale: Die artikellosen Singularformen bezeichnen hier kollektiv die beiden Gruppen religiöser Amtsträger.
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: sie sind vom Wein überwältigt
  rationale: Das hebräische Bild bedeutet wörtlich, vom Wein „verschlungen“ zu sein. „Überwältigt“ vermittelt das völlige Beherrschtwerden im Deutschen natürlicher; die Bildvariante wird in der Fußnote nicht benötigt, da sie die Aussage nicht wesentlich mehrdeutig macht.
- source_word: בָּרֹאֶה
  choice: beim Schauen
  rationale: Die Form kann das Sehen allgemein oder prophetisches Schauen bezeichnen. „Beim Schauen“ erhält diese Mehrdeutigkeit; die visionäre Deutung wird in einer Fußnote genannt.
- source_word: פְּלִילִיָּה
  choice: beim Rechtsprechen
  rationale: Das seltene Substantiv betrifft richterliche Entscheidung beziehungsweise Urteil. Die verbale deutsche Wendung macht die amtliche Tätigkeit verständlich, ohne sie auf ein bestimmtes Gerichtsverfahren einzuengen.
theological_decisions:
- issue: Bezieht sich בָּרֹאֶה ausdrücklich auf prophetische Vision?
  choice: beim Schauen
  alternative: in der prophetischen Schau / in der Vision
  rationale: Der Zusammenhang mit dem Propheten legt visionäres Sehen nahe, doch das Hebräische bleibt knapp. Die Hauptfassung bewahrt diese Offenheit.
- issue: Bezeichnet פְּלִילִיָּה Urteil, Rechtsprechung oder eine einzelne Rechtsentscheidung?
  choice: beim Rechtsprechen
  alternative: beim Urteil / bei der Rechtsentscheidung
  rationale: Die Übersetzung bezeichnet die richterliche Funktion, ohne die semantische Spannweite auf ein einzelnes Urteil festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Bewegungsverben geben den eindringlichen Rhythmus und die körperlich-geistige Desorientierung des Hebräischen wieder. Beide Fußnotenmarker stehen an den zugehörigen Stellen im Haupttext.
