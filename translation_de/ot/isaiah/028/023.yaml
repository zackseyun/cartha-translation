  text: Give ear and hear my voice[a]; pay attention and hear my word.
translation:
  language: de
  text: Hört aufmerksam zu und hört meine Stimme; gebt acht und hört mein Wort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Hört aufmerksam zu
  rationale: Der Hifil-Imperativ Plural von אזן fordert zum aufmerksamen Hinhören auf. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den nachdrücklichen Auftakt.
- source_word: וְשִׁמְעוּ
  choice: und hört
  rationale: Der Qal-Imperativ Plural von שמע wird wörtlich als „hört“ wiedergegeben, sodass die Verbindung zweier Hörverben und die rhetorische Wiederholung erhalten bleiben.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: קול bezeichnet im Kontext direkter Rede schlicht die Stimme; „meine Stimme“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: הַקְשִׁיבוּ
  choice: gebt acht
  rationale: Der Hifil-Imperativ Plural von קשב verlangt konzentrierte Aufmerksamkeit. „Gebt acht“ ist würdig, verständlich und unterscheidet sich sprachlich vom ersten Aufruf.
- source_word: וְשִׁמְעוּ
  choice: und hört
  rationale: Die identische Wiedergabe des wiederholten שמע bewahrt den Parallelismus und die bewusste Wiederholung des hebräischen Verses.
- source_word: אִמְרָתִי
  choice: mein Wort
  rationale: אמרה kann „Wort“, „Ausspruch“ oder „Rede“ bedeuten. „Mein Wort“ bewahrt den Singular, bleibt knapp und bildet eine natürliche poetische Parallele zu „meine Stimme“.
