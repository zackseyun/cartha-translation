id: ISA.28.21
reference: Isaiah 28:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: de
  text: Denn wie am Berg Perazim[a] wird Jahwe sich erheben, wie im Tal bei Gibeon[b] wird er aufgewühlt sein, um sein Werk zu tun – sein befremdliches Werk – und seine Arbeit zu verrichten – seine fremdartige Arbeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Berg Perazim erinnert daran, wie Jahwe gegen Davids Feinde hervorbrach (2. Samuel 5,20; 1. Chronik 14,11).
    reason: cross_reference
  - marker: b
    text: Das Tal bei Gibeon erinnert wahrscheinlich an Jahwes Eingreifen in der Schlacht bei Gibeon (Josua 10,10–14).
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: „sein fremdes Werk … seine befremdliche Arbeit“. Die beiden Adjektive stellen dieses Handeln als ungewöhnlich und fremdartig dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Warnung ein und wahrt den kausalen Zusammenhang.
- source_word: כְהַר פְּרָצִים
  choice: wie am Berg Perazim
  rationale: Das כ markiert einen Vergleich; die Formulierung verweist natürlich auf das mit diesem Ort verbundene frühere Eingreifen Jahwes.
- source_word: יָקוּם
  choice: wird sich erheben
  rationale: Gibt das entschlossene Eingreifen Jahwes anschaulich und zugleich nah am hebräischen Verb קום wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als solchen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: wie im Tal bei Gibeon
  rationale: Entspricht der hebräischen Präpositionalfügung und bezeichnet in natürlichem Deutsch das Tal in der Umgebung Gibeons.
- source_word: יִרְגָּז
  choice: wird er in Bewegung geraten
  rationale: רגז kann Erbeben, Erregung oder ein machtvolles In-Bewegung-Geraten ausdrücken. Die Wiedergabe bewahrt die aktive Unruhe, ohne unkontrollierten Zorn festzuschreiben.
- source_word: לַעֲשׂוֹת מַעֲשֵׂהוּ
  choice: um sein Werk zu tun
  rationale: Bewahrt die schlichte Verbindung von עשׂה und מַעֲשֶׂה sowie die rhetorische Wiederholung.
- source_word: זָר
  choice: befremdlich
  rationale: Bezeichnet das Werk als ungewöhnlich und dem Erwarteten fremd; „befremdlich“ ist im Deutschen verständlich und wahrt diese Spannung.
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: und seine Arbeit zu verrichten
  rationale: Gibt die figura etymologica aus עבד und עֲבֹדָה in natürlichem Deutsch wieder und hält die Parallele zum ersten Satzglied aufrecht.
- source_word: נָכְרִיָּה
  choice: fremdartig
  rationale: Wahrt die Bedeutung „fremd/ausländisch“ und unterscheidet das zweite Adjektiv sprachlich von זָר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich; „Jahwe“ bewahrt ihn als persönlichen Namen.
- issue: Jahwes „befremdliches/fremdartiges“ Werk
  choice: Die Fremdheitsbegriffe bleiben im Haupttext stehen und werden nicht als Gericht ausgedeutet.
  alternative: sein ungewöhnliches Gericht / seine unerwartete Strafe
  rationale: Der hebräische Text bezeichnet Jahwes Tun als fremd beziehungsweise befremdlich, ohne die darin liegende theologische Spannung ausdrücklich aufzulösen.
- issue: Bedeutung von יִרְגָּז
  choice: wird er in Bewegung geraten
  alternative: wird er aufbrausen / wird er erbeben
  rationale: Die gewählte Fassung lässt die Mehrdeutigkeit zwischen Erregung, Erbeben und machtvollem Tätigwerden möglichst offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Parallelstruktur. Die Gedankenstriche bilden die wiederholenden Appositionen des Hebräischen ab. „In Bewegung geraten“ ist bewusst offen formuliert, um das Bedeutungsspektrum von רגז nicht vorschnell auf Zorn oder Zittern zu verengen.
