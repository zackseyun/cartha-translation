id: ISA.28.15
reference: Isaiah 28:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: de
  text: 'Denn ihr habt gesagt: »Wir haben mit dem Tod einen Bund geschlossen und mit dem Scheol[a] eine Vereinbarung[b] getroffen. Wenn die alles überschwemmende Geißel[c] hindurchzieht, wird sie uns nicht erreichen; denn wir haben die Lüge zu unserer Zuflucht gemacht und uns im Trug verborgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scheol bezeichnet im Hebräischen den Bereich der Toten; der Begriff ist nicht ohne Weiteres mit späteren Vorstellungen von der Hölle gleichzusetzen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »ein Abkommen«. Das hebräische Wort ist selten und schwierig; grundsätzlich kann es auch »Vision« bedeuten, bezeichnet hier aber wahrscheinlich eine Vereinbarung parallel zum »Bund«.'
    reason: lexical_alternative
  - marker: c
    text: Der schwierige hebräische Ausdruck verbindet offenbar das Bild einer schlagenden Geißel mit dem einer alles überschwemmenden oder hinwegfegenden Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֲמַרְתֶּם
  choice: Denn ihr habt gesagt
  rationale: כִּי führt hier die Begründung für die im Zusammenhang angekündigte Gerichtsbotschaft ein. Das Perfekt wird mit gegenwärtiger Relevanz wiedergegeben.
- source_word: כָּרַתְנוּ בְרִית אֶת מָוֶת
  choice: Wir haben mit dem Tod einen Bund geschlossen
  rationale: Die hebräische Wendung bedeutet wörtlich, einen Bund zu »schneiden«; »einen Bund schließen« ist die natürliche deutsche Entsprechung und erhält die Personifikation des Todes.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Umschrift bewahrt den eigenständigen hebräischen Begriff für den Bereich der Toten und vermeidet eine vorschnelle Gleichsetzung mit späteren Höllenvorstellungen.
- source_word: עָשִׂינוּ חֹזֶה
  choice: eine Vereinbarung getroffen
  rationale: חֹזֶה ist hier wahrscheinlich eine Vereinbarung oder ein Abkommen parallel zum »Bund«. Die seltenere mögliche Bedeutung »Vision« passt weniger gut in den unmittelbaren Parallelismus.
- source_word: שיט שׁוֹטֵף
  choice: die überflutende Geißel
  rationale: Die schwierige Wortverbindung vereint wahrscheinlich das Bild einer schlagenden Geißel mit dem einer alles überschwemmenden, hinwegfegenden Gewalt. Die ungewöhnliche deutsche Verbindung bewahrt diese Spannung.
- source_word: כִּי עבר
  choice: Wenn … hindurchzieht
  rationale: כִּי kann in der zitierten Behauptung temporal verstanden werden; עבר beschreibt das Durchziehen der vernichtenden Macht.
- source_word: לֹא יְבוֹאֵנוּ
  choice: wird sie uns nicht erreichen
  rationale: »Erreichen« gibt den behaupteten Schutz vor dem herankommenden Unheil im Deutschen klar und idiomatisch wieder.
- source_word: שַׂמְנוּ כָזָב מַחְסֵנוּ
  choice: wir haben die Lüge zu unserer Zuflucht gemacht
  rationale: Die abstrakte beziehungsweise kollektiv verstandene »Lüge« und das Schutzbild der »Zuflucht« werden direkt bewahrt.
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: und uns im Trug verborgen
  rationale: Die reflexive Aussage des Verbs und der Parallelismus zu »Lüge« bleiben erhalten; »Trug« bietet eine natürliche, gehobene Wiedergabe von שׁקר.
theological_decisions:
- issue: Bedeutung von שְׁאוֹל
  choice: Scheol
  alternative: Grab; Totenreich; Hölle
  rationale: Der hebräische Begriff bezeichnet den Bereich der Toten, ohne von sich aus alle Vorstellungen späterer Lehren über die Hölle zu enthalten. Die Umschrift bewahrt diese Offenheit.
- issue: Personifikation von Tod und Scheol
  choice: Tod und Scheol bleiben als Partner eines Bundes beziehungsweise einer Vereinbarung dargestellt
  alternative: Die Aussage als bloße Umschreibung für Schutz vor dem Sterben auflösen
  rationale: Die prophetische Anklage verspottet das vermeintliche Sicherheitsbündnis der Angesprochenen. Ihre zugespitzte Bildsprache soll nicht erklärend abgeschwächt werden.
- issue: Gemischtes Bild in שיט שׁוֹטֵף
  choice: Geißel und Überschwemmung werden gemeinsam angedeutet
  alternative: Nur »Flut« oder nur »Geißel«
  rationale: Der schwierige Ausdruck scheint Schlag- und Flutbild zu verbinden. Die Übersetzung bewahrt die theologische und rhetorische Spannung des unwiderstehlichen Gerichts, statt sie auf ein einziges Bild zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anklage. Der parallele Satzbau und die auffälligen Bilder des Hebräischen bleiben erhalten; die schwer verständliche Verbindung »überflutende Geißel« wird bewusst nicht geglättet, sondern in einer Fußnote erläutert.
