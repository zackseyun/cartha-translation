  text: לֶ֣חֶם יוּדָ֔ק כִּ֛י לֹ֥א לָ/נֶ֖צַח אָד֣וֹשׁ יְדוּשֶׁ֑/נּוּ וְ֠/הָמַם גִּלְגַּ֧ל עֶגְלָת֛/וֹ וּ/פָרָשָׁ֖י/ו לֹֽא יְדֻקֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: de
  text: Brotgetreide wird zerkleinert[a], doch man drischt es nicht endlos. Auch wenn er das Rad seines Dreschwagens und seine Pferde darüber hinwegtreibt[b], zermalmt er es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Getreide für Brot wird zerkleinert.“ Das hebräische Wort für „Brot“ bezeichnet hier das Getreide, das zu Brot verarbeitet werden soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Reiter“. Das hebräische Wort kann in anderen Zusammenhängen Reiter bezeichnen; zum Bild des Dreschwagens passen hier jedoch „Pferde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: Brotgetreide
  rationale: Das gewöhnlich mit „Brot“ wiedergegebene Wort bezeichnet hier metonymisch das Getreide, aus dem Brot bereitet wird. „Brotgetreide“ erhält das landwirtschaftliche Bild und ist im Deutschen verständlich.
- source_word: יוּדָק
  choice: wird zerkleinert
  rationale: Die Form von דקק bezeichnet das Zerkleinern. „Zerkleinert“ passt zum Dreschvorgang, ohne vorschnell ein Mahlen zu unterstellen.
- source_word: כִּי
  choice: doch
  rationale: 'Im Zusammenhang leitet die Partikel eine kontrastierende Erläuterung ein: Das Korn wird zwar zerkleinert, aber nicht unbegrenzt gedroschen.'
- source_word: לֹא לָנֶצַח
  choice: nicht endlos
  rationale: Die Wendung bedeutet wörtlich „nicht für immer“; beim Dreschen gibt „nicht endlos“ den zeitlichen Sinn natürlich wieder.
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: man drischt es
  rationale: Infinitivus absolutus und finite Verbform desselben Stammes betonen bzw. verstärken den Vorgang. Zusammen mit „nicht endlos“ wird das fortgesetzte Dreschen idiomatisch ausgedrückt; „man“ bewahrt den allgemeinen Sinn.
- source_word: וְהָמַם
  choice: lässt … darüber hinwegrollen
  rationale: Das Verb kann Lärm, heftige Bewegung oder das In-Bewegung-Setzen bezeichnen. Im Bild des Dreschwagens gibt „hinwegrollen lassen“ die konkrete Bewegung verständlich wieder, ohne den möglichen Lärmaspekt überzubetonen.
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: das Rad seines Wagens
  rationale: Die Wiedergabe bildet die hebräische Genitivverbindung direkt und verständlich ab.
- source_word: וּפָרָשָׁיו
  choice: seine Pferde
  rationale: Das Wort kann Reiter bezeichnen, doch im landwirtschaftlichen Zusammenhang sind wahrscheinlich die Zugtiere des Wagens gemeint. Die alternative Deutung wird in einer Fußnote offengehalten.
- source_word: לֹא יְדֻקֶּנּוּ
  choice: er zermalmt es nicht
  rationale: 'Die Wiederaufnahme von דקק setzt dem Dreschen eine Grenze: Das Korn soll nicht völlig fein zerdrückt werden. „Zermalmt“ vermittelt hier die stärkere, zerstörerische Endstufe.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die landwirtschaftliche Bildsprache bleibt konkret; der Wechsel vom unpersönlichen „man“ zum handelnden „er“ folgt der hebräischen Ausdrucksweise. Die beiden Sätze bilden den Gegensatz zwischen notwendigem Zerkleinern und zerstörerischem Zermalmen ab.
