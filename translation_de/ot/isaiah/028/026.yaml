  yaml_path: translation/ot/isaiah/028/026.yaml
  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: de
  text: Denn sein Gott unterweist ihn im richtigen Vorgehen[a]; er lehrt ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zum Recht«. Auch möglich: »nach der rechten Ordnung«. Das Hebräische kann hier die sachgemäße Regel oder Methode bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: unterweist ihn
  rationale: Das Piel von יסר mit Objektsuffix bezeichnet hier im landwirtschaftlichen Zusammenhang anleitende Unterweisung, nicht strafende Züchtigung.
- source_word: לַמִּשְׁפָּט
  choice: im richtigen Vorgehen
  rationale: מִשְׁפָּט kann »Recht« oder »Urteil« bedeuten, bezeichnet hier aber wahrscheinlich die sachgemäße Regel oder Methode bei der Feldarbeit. Die Wiedergabe hält den praktischen Zusammenhang fest, ohne den Grundgedanken einer richtigen Ordnung aufzugeben.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Die Possessivform wird ausdrücklich bewahrt; die praktische Einsicht des Bauern wird Gott zugeschrieben.
- source_word: יוֹרֶנּוּ
  choice: er lehrt ihn
  rationale: Das Hifil von ירה bedeutet »lehren, unterweisen, anweisen«. »Er lehrt ihn« gibt den pädagogischen Sinn knapp wieder und bewahrt die parallele Aussage.
theological_decisions:
- issue: Ursprung landwirtschaftlicher Weisheit
  choice: Gott wird als derjenige dargestellt, der dem Bauern das sachgemäße Vorgehen vermittelt.
  alternative: Die Aussage kann allgemeiner als Hinweis auf Gottes fürsorgliche Lenkung menschlicher Fertigkeiten verstanden werden.
  rationale: Die ausdrückliche Nennung von »sein Gott« zusammen mit zwei Verben des Unterweisens führt das praktische Können unmittelbar auf Gott zurück, ohne eine weitergehende Lehrannahme einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Im richtigen Vorgehen« passt zum landwirtschaftlichen Kontext; die Fußnote bewahrt die engere Bedeutungsspanne von מִשְׁפָּט.
