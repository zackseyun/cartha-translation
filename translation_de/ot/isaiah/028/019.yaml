  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: de
  text: Sooft sie hindurchzieht,[a] wird sie euch packen; denn Morgen für Morgen wird sie hindurchziehen, bei Tag und bei Nacht. Und die Kunde zu verstehen wird nur Entsetzen hervorrufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jedes Mal, wenn sie hindurchzieht, wird sie euch packen.“'
    reason: Die idiomatische Verbindung מִדֵּי עָבְרוֹ kann sowohl mit „sooft“ als auch mit „jedes Mal, wenn“ wiedergegeben werden.
  - marker: b
    text: 'Die Schlussaussage ist im Hebräischen knapp und syntaktisch umstritten. Möglich ist auch: „Und es wird nichts als Entsetzen sein, die Kunde zu verstehen.“ Manche verstehen sie im Sinn von: „Schon die Kunde zu hören wird Entsetzen auslösen.“'
    reason: Die genaue Verbindung von „Entsetzen“, „verstehen“ und „Kunde“ ist umstritten. Die Fußnote dokumentiert die verbreitete Deutung mit „hören“, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: Sooft sie hindurchzieht
  rationale: Die Verbindung bezeichnet ein wiederholtes Geschehen. „Sooft“ bewahrt den iterativen Sinn knapp und natürlich; das feminine Pronomen nimmt die in Jesaja 28,18 genannte Geißel auf.
- source_word: יִקַּח אֶתְכֶם
  choice: wird sie euch packen
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet hier im Gerichtszusammenhang aber ein gewaltsames Ergreifen. „Packen“ gibt diese Kraft wieder, ohne bereits das Ergebnis als Wegführung festzulegen.
- source_word: בַבֹּקֶר בַבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung hat distributiven Sinn und wird mit einer im Deutschen geläufigen, zugleich quellennahen Wendung wiedergegeben.
- source_word: יַעֲבֹר
  choice: wird sie hindurchziehen
  rationale: Die Wiedergabe bleibt beim Bild eines das Land durchziehenden, verheerenden Gerichts und entspricht dem vorherigen עָבְרוֹ.
- source_word: בַיּוֹם וּבַלָּיְלָה
  choice: bei Tag und bei Nacht
  rationale: Die feste deutsche Wendung bewahrt den Merismus und bezeichnet ein unablässiges beziehungsweise immer wiederkehrendes Geschehen.
- source_word: רַק זְוָעָה
  choice: nichts als Entsetzen
  rationale: רַק hat hier ausschließende beziehungsweise verstärkende Kraft. „Nichts als Entsetzen“ ist idiomatisch und gibt die Intensität von זְוָעָה angemessen wieder.
- source_word: הָבִין שְׁמוּעָה
  choice: die Botschaft zu verstehen
  rationale: הָבִין wird seinem gewöhnlichen Sinn entsprechend mit „verstehen“ wiedergegeben. שְׁמוּעָה kann Nachricht, Kunde oder Botschaft bedeuten; „Botschaft“ passt zu der angekündigten Gerichtsaussage, ohne sie näher auszudeuten.
theological_decisions:
- issue: Bezug der maskulinen Singularformen auf die zuvor genannte שׁוֹטֵף שׁוֹט
  choice: Im Deutschen wird das Pronomen feminin als „sie“ wiedergegeben und auf „die Geißel“ aus Jesaja 28,18 bezogen.
  alternative: Das unpersönliche „es“ oder die ausdrückliche Wiederholung „die überflutende Geißel“.
  rationale: Das Hebräische setzt den Bezug aus dem unmittelbaren Kontext voraus. Das deutsche Genus richtet sich beim natürlichen Rückbezug nach „Geißel“; eine Wiederholung des Substantivs würde dem Vers zusätzliche ausdrückliche Information geben.
- issue: Syntax der Schlussaussage רַק זְוָעָה הָבִין שְׁמוּעָה
  choice: Die schwierige Verbindung bleibt als „es wird nichts als Entsetzen sein, die Botschaft zu verstehen“ erhalten.
  alternative: „Schon das Hören der Botschaft wird Entsetzen auslösen“ oder „Es wird lauter Entsetzen sein, die Kunde zu hören“.
  rationale: Der hebräische Text verwendet ausdrücklich das Verb „verstehen/einsehen“ und ist syntaktisch gedrängt. Die Hauptfassung bewahrt diese Spannung, statt Verstehen stillschweigend durch Hören zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sooft“, „Morgen für Morgen“ und „bei Tag und bei Nacht“ erhalten den eindringlichen Rhythmus. Die abrupte und theologisch gewichtige Schlusswendung wird nicht durch eine glättende Paraphrase aufgelöst.
