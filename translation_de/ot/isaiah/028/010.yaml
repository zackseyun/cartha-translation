  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: de
  text: 'Denn: „Gebot auf Gebot, Gebot auf Gebot, Messschnur auf Messschnur, Messschnur auf Messschnur, ein wenig dort, ein wenig dort.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die stark repetitive hebräische Wortfolge kann spöttische oder kindliche Rede nachahmen. Sie lässt sich auch lautnah wiedergeben: „ṣaw lāṣaw, ṣaw lāṣaw, qaw lāqaw, qaw lāqaw“. Andere übersetzen „Zeile auf Zeile“ und, idiomatisch, „ein wenig hier, ein wenig dort“. Wörtlich steht im Hebräischen zweimal „dort“.'
    reason: Die Bedeutung und rhetorische Funktion der ungewöhnlich repetitiven Wendungen sind unsicher; die Fußnote bewahrt wesentliche lexikalische und stilistische Alternativen.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorangehenden Vorwurf ein, ohne den Zusammenhang stärker festzulegen als nötig.
- source_word: צַו לָצָו
  choice: Gebot auf Gebot
  rationale: צַו kann als »Gebot« oder »Anweisung« verstanden werden. Die knappe Wiederholung mit »auf« bewahrt den abgehackten, formelhaften Klang.
- source_word: קַו לָקָו
  choice: Messschnur auf Messschnur
  rationale: קַו bezeichnet gewöhnlich eine Messschnur beziehungsweise Richtschnur. »Messschnur« wahrt das konkrete Bild besser als das traditionelle, aber weniger genaue »Zeile«.
- source_word: זְעֵיר
  choice: ein wenig
  rationale: Gibt die Bedeutung »wenig, klein« wieder und erhält den knappen Rhythmus.
- source_word: שָׁם
  choice: dort
  rationale: Das Adverb bedeutet wörtlich »dort«. Da es im Hebräischen beide Male wiederholt wird, bleibt diese auffällige Wiederholung im Haupttext erhalten.
theological_decisions:
- issue: Ob der Vers sachliche Unterweisung oder spöttisch-kindliche Rede wiedergibt
  choice: Die repetitive Rede wird als Zitat wiedergegeben, ohne den Spott ausdrücklich in den Haupttext hineinzuschreiben.
  alternative: Als neutrale Beschreibung einer schrittweisen Lehrmethode oder als bloße Lautnachahmung wiedergeben.
  rationale: Der Zusammenhang in Jesaja 28,9–13 legt spöttische, singende oder kindlich wirkende Rede nahe; die genaue Funktion der schwer verständlichen hebräischen Folge bleibt jedoch umstritten. Die Übersetzung bewahrt deshalb Wortlaut und Rhythmus und erläutert die Unsicherheit in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, repetitiver Satzmelodie. Die ungewöhnliche Form bleibt hörbar; überdeutende Umgangssprache wie »Bla bla« wird vermieden.
