id: ISA.28.11
reference: Isaiah 28:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: de
  text: Denn mit spottenden Lippen[a] und in einer anderen Sprache[b] wird er zu diesem Volk reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit stammelnden Lippen“. Manche Übersetzungen verstehen die Wendung als Hinweis auf unverständliche statt auf spöttische Rede.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit einer anderen Zunge“. Gemeint ist eine fremde Sprache; im Zusammenhang dürfte dies darauf hinweisen, dass Gott durch fremdsprachige Angreifer im Gericht zu seinem Volk redet.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage und bewahrt so den Zusammenhang.
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: mit spottenden Lippen
  rationale: לַעַג bezeichnet Spott oder Hohn. Die Formulierung erhält zugleich das hebräische Bild der Lippen; die mögliche Deutung als stammelnde beziehungsweise unverständliche Rede wird in einer Fußnote genannt.
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: und in einer anderen Sprache
  rationale: לָשׁוֹן bedeutet wörtlich „Zunge“ und übertragen „Sprache“. Im Deutschen gibt „in einer anderen Sprache“ den gemeinten sprachlichen Gegensatz natürlich und verständlich wieder.
- source_word: יְדַבֵּר
  choice: wird er … reden
  rationale: Das Imperfekt wird im prophetischen Zusammenhang futurisch wiedergegeben. Das im Hebräischen unausgesprochene männliche Subjekt bleibt als „er“ unbestimmt, statt im Haupttext einen bestimmten Handelnden einzusetzen.
- source_word: אֶל הָעָם הַזֶּה
  choice: zu diesem Volk
  rationale: Die Wiedergabe entspricht der üblichen Bedeutung von עָם und bewahrt die demonstrative, prophetisch zugespitzte Formulierung.
theological_decisions:
- issue: Deutung der spöttisch oder fremd klingenden Rede
  choice: Der Haupttext spricht von „spottenden Lippen“ und „einer anderen Sprache“ und lässt den Handelnden mit „er“ unbestimmt.
  alternative: Die Wendung kann als „mit stammelnden Lippen“ verstanden und die Rede ausdrücklich Gott beziehungsweise fremdsprachigen Eroberern zugeschrieben werden.
  rationale: לַעַג stützt vorrangig den Sinn „Spott/Hohn“, während die fremde Sprache im Gerichtskontext wahrscheinlich auf die Rede ausländischer Angreifer weist. Da der Vers den Sprecher grammatisch nicht ausdrücklich nennt, wird diese kontextuelle Deutung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Lippenbild bleibt erhalten; das im Deutschen schwerfällige Bild der „anderen Zunge“ wird im Haupttext idiomatisch als „andere Sprache“ wiedergegeben und in der Fußnote transparent gemacht.
