base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: de
  text: Streut er nicht, nachdem er die Oberfläche des Bodens geebnet hat, Schwarzkümmel[a] aus und sät Kreuzkümmel, setzt Weizen in Reihen[b], Gerste an den dafür bestimmten Platz und Dinkel[c] an den Rand?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung von קֶצַח ist unsicher; möglicherweise ist eine mit dem Schwarzkümmel verwandte Pflanzenart gemeint.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort שׂוֹרָה ist schwer zu deuten. Möglich sind auch „als Hauptfrucht“ oder „am besten Platz“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Emmer“; welche Getreideart כֻסֶּמֶת genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: nicht, sobald
  rationale: Die Verbindung leitet eine rhetorische Frage mit zeitlich-konditionaler Nuance ein. „Nicht, sobald …?“ gibt den Gedankengang im Deutschen natürlich wieder.
- source_word: שִׁוָּה פָנֶיהָ
  choice: die Oberfläche geglättet hat
  rationale: שׁוה bezeichnet hier das Einebnen oder Glätten; פָנֶיהָ meint die Oberfläche des zuvor genannten Bodens.
- source_word: הֵפִיץ קֶצַח
  choice: Schwarzkümmel ein
  rationale: הֵפִיץ bezeichnet breitwürfiges Ausstreuen. Mit dem trennbaren Verb „einstreuen“ bleibt die landwirtschaftliche Handlung knapp und idiomatisch ausgedrückt.
- source_word: קֶצַח
  choice: Schwarzkümmel
  rationale: Schwarzkümmel ist eine verbreitete moderne Identifizierung der Pflanze; da sie nicht völlig sicher ist, wird dies in einer Fußnote vermerkt.
- source_word: כַמֹּן יִזְרֹק
  choice: sät Kümmel aus
  rationale: יִזְרֹק bedeutet wörtlich werfen oder ausstreuen, bezeichnet hier aber das Aussäen. „Kümmel“ ist die übliche deutsche Bezeichnung für כַמֹּן.
- source_word: חִטָּה
  choice: Weizen
  rationale: Standardbezeichnung für diese Getreideart.
- source_word: שׂוֹרָה
  choice: in Reihen
  rationale: Das schwierige Wort wird hier als Angabe einer geordneten Anpflanzung verstanden. Andere plausible Deutungen werden in der Fußnote bewahrt.
- source_word: שְׂעֹרָה נִסְמָן
  choice: die Gerste an den für sie bestimmten Platz
  rationale: נִסְמָן weist wahrscheinlich auf einen markierten oder zugewiesenen Bereich hin. Die Formulierung macht die absichtliche Platzierung deutlich, ohne größere Präzision vorzutäuschen.
- source_word: כֻסֶּמֶת
  choice: Dinkel
  rationale: „Dinkel“ ist die traditionelle und verständliche Wiedergabe; die genaue botanische Bestimmung ist unsicher und wird deshalb in einer Fußnote erläutert.
- source_word: גְּבֻלָתוֹ
  choice: an den Rand
  rationale: Das Wort bezeichnet hier wahrscheinlich die Begrenzung beziehungsweise den Rand des Feldes oder Anbaubereichs.
