  register: Modernes, würdiges Standarddeutsch mit konkreter landwirtschaftlicher Bildsprache. Die unpersönliche Konstruktion „lässt man“ beziehungsweise „klopft man“ gibt die hebräischen Passivformen idiomatisch wieder. „Stock“ und „Stab“ bewahren die lexikalische Unterscheidung der parallelen Schlaggeräte.
