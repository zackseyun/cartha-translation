base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: de
  text: Denn Schwarzkümmel[a] wird nicht mit dem Dreschschlitten gedroschen, und über Kreuzkümmel[b] lässt man kein Wagenrad rollen. Vielmehr klopft man Schwarzkümmel mit einem Stock aus und Kreuzkümmel mit einem Stab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Pflanzenart ist nicht völlig sicher; gemeint ist wahrscheinlich Schwarzkümmel (Nigella sativa), möglicherweise Dill.
    reason: lexical_alternative
  - marker: b
    text: Die genaue Pflanzenart ist nicht völlig sicher; gemeint ist wahrscheinlich Kreuzkümmel (Cuminum cyminum), möglicherweise Echter Kümmel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: Dreschschlitten
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Wort ein scharfes Dreschgerät. „Dreschschlitten“ gibt den Gegenstand präzise und allgemein verständlich wieder.
- source_word: יוּדַשׁ
  choice: wird … gedroschen
  rationale: Die Hophal-Form von דוש bezeichnet hier das Dreschen beziehungsweise Zertreten; „gedroschen“ bewahrt das landwirtschaftliche Bild und den Gegensatz zum schonenderen Ausklopfen.
- source_word: קֶצַח
  choice: Schwarzkümmel
  rationale: Die Pflanze wird meist als Nigella sativa identifiziert. „Schwarzkümmel“ ist die geläufige moderne Bezeichnung; die nicht völlig sichere Bestimmung wird in einer Fußnote kenntlich gemacht.
- source_word: אוֹפַן עֲגָלָה
  choice: Wagenrad
  rationale: Die Konstruktverbindung bedeutet wörtlich „Rad eines Wagens“. „Wagenrad“ ist im Deutschen natürlich und erhält das konkrete Bild.
- source_word: יוּסָּב
  choice: lässt man … rollen
  rationale: Die passive beziehungsweise kausative Form von סבב beschreibt, dass das Rad über das Gewürz bewegt wird. Die aktive unpersönliche Formulierung ist natürliches Deutsch und wahrt den Sinn.
- source_word: כַּמֹּן
  choice: Kümmel
  rationale: Die übliche Identifizierung ist Cuminum cyminum. Im Deutschen kann „Kümmel“ mehrdeutig sein; die genauere Bezeichnung und die botanische Alternative werden deshalb in einer Fußnote genannt.
- source_word: מַטֶּה
  choice: Stock
  rationale: Hier bezeichnet das Wort ein hölzernes Schlaggerät. „Stock“ passt zur praktischen Tätigkeit und bleibt vom parallelen שֵׁבֶט unterscheidbar.
- source_word: יֵחָבֶט
  choice: klopft man … aus
  rationale: חבט bezeichnet das Ausschlagen oder Ausklopfen von Erntegut. „Ausklopfen“ bringt sowohl die Handlung als auch ihr Ziel knapp zum Ausdruck.
- source_word: שָּׁבֶט
  choice: Stab
  rationale: Im Kontext ist ein leichteres Schlaggerät gemeint. „Stab“ erhält die Parallelität und zugleich eine sprachliche Unterscheidung von מַטֶּה, „Stock“.
- source_word: כִּי ... כִּי
  choice: Denn … Vielmehr
  rationale: Das erste כִּי leitet die Begründung ein; das zweite stellt dem ungeeigneten Verfahren die richtige Methode gegenüber. „Vielmehr“ macht diesen Gegensatz in natürlichem Deutsch deutlich.
