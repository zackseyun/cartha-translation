  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: de
  text: Siehe, der Herr hat einen, der stark und mächtig ist[a]. Wie ein Hagelsturm, ein verheerender Sturm, wie ein Strom gewaltiger, überfließender Wasser schleudert er sie mit seiner Hand zu Boden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ein Starker und Mächtiger steht dem Herrn bereit.“ Die hebräische Formulierung kann hervorheben, dass dieser Vollstrecker dem Herrn gehört oder ihm zur Verfügung steht.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht das Objekt im Hebräischen nicht da; „sie“ bezieht sich auf die stolze Krone aus Vers 1. Das Verb kann auch weniger gewaltsam mit „legt sie zu Boden“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der prophetische Aufmerksamkeitsruf wird in gehobener, aber verständlicher Form bewahrt.
- source_word: חָזָק וְאַמִּץ
  choice: einen Starken und Mächtigen
  rationale: Die substantivierten Adjektive lassen die Identität des mächtigen Vollstreckers offen und erhalten die emphatische Doppelung.
- source_word: לַאדֹנָי
  choice: der Herr hat
  rationale: 'Das ל bezeichnet hier wahrscheinlich Zugehörigkeit oder Verfügbarkeit: Der nicht näher bestimmte Mächtige steht dem Herrn als Werkzeug bereit.'
- source_word: כְּזֶרֶם בָּרָד
  choice: wie ein Hagelsturm
  rationale: זֶרֶם bezeichnet einen heftigen Wolkenbruch oder Sturm; zusammen mit Hagel ergibt „Hagelsturm“ ein natürliches und kraftvolles deutsches Bild.
- source_word: שַׂעַר קָטֶב
  choice: ein verheerendes Unwetter
  rationale: Die Wendung verbindet stürmische Gewalt mit Verderben; „verheerend“ gibt die zerstörerische Wirkung wieder, ohne eine bestimmte Sturmform festzulegen.
- source_word: מַיִם כַּבִּירִים שֹׁטְפִים
  choice: gewaltiger, überflutender Wasser
  rationale: „Gewaltig“ bewahrt die Macht und Fülle der Wasser, „überflutend“ ihre hinwegspülende Bewegung.
- source_word: הִנִּיחַ לָאָרֶץ
  choice: schleudert er sie … zu Boden
  rationale: Im Gerichtswort und innerhalb der heftigen Sturmvergleiche hat das Hifil den Sinn eines gewaltsamen Niederwerfens. Das ergänzte Pronomen verweist auf die Krone aus dem unmittelbaren Kontext.
- source_word: בְּיָד
  choice: mit seiner Hand
  rationale: Die konkrete Handmetapher bleibt als Bild unmittelbarer, persönlich ausgeübter Macht erhalten.
theological_decisions:
- issue: Identität des Starken und Mächtigen
  choice: Die Person bleibt unbestimmt und wird als ein dem Herrn verfügbarer Vollstrecker dargestellt.
  alternative: Der assyrische König, Assyrien oder der Herr selbst könnte ausdrücklich genannt werden.
  rationale: Der hebräische Text identifiziert den Vollstrecker an dieser Stelle nicht ausdrücklich; der Zusammenhang legt ein Werkzeug göttlichen Gerichts nahe, ohne es hier zu benennen.
- issue: Subjekt und Objekt des letzten Satzteils
  choice: Das maskuline Subjekt wird auf den Starken und Mächtigen bezogen; „sie“ nimmt die stolze Krone aus Vers 1 auf.
  alternative: Der Herr könnte als handelndes Subjekt verstanden oder das im Hebräischen unausgesprochene Objekt auch im Deutschen unbestimmt gelassen werden.
  rationale: Die Fortführung des zuvor eingeführten maskulinen Vollstreckers ist syntaktisch naheliegend. Das Deutsche benötigt für „schleudern“ ein Objekt; das feminine Pronomen greift den unmittelbaren Kontext auf, ohne die Krone im Vers erneut auszudeuten.
- issue: Gewaltsamkeit von הִנִּיחַ
  choice: schleudert … zu Boden
  alternative: legt … auf die Erde nieder
  rationale: Obwohl das Verb grundsätzlich „ruhen lassen“ oder „niederlegen“ bedeuten kann, sprechen die drei massiven Sturmbilder hier für ein gewaltsames Niederwerfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Wucht. Die wiederholten Sturmvergleiche bleiben parallel, während ungewöhnlich altertümliche oder unnötig technische Wetterbegriffe vermieden werden.
