source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: de
  text: 'Auch dies ist von Yahweh der Heerscharen ausgegangen: Sein Rat ist wunderbar, und seine Umsicht ist groß.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Weisheit“, „seine Tatkraft“ oder „seine Findigkeit“.'
    reason: Das seltene תּוּשִׁיָּה kann gesunde, praktisch wirksame Weisheit, Umsicht oder Tatkraft bezeichnen.
lexical_decisions:
- source_word: גַּם זֹאת
  choice: Auch dies
  rationale: Die Wendung knüpft die Aussage an das vorausgehende landwirtschaftliche Gleichnis an und bewahrt den ergänzenden Sinn von גַּם.
- source_word: מֵעִם ... יָצָאָה
  choice: ist von ... ausgegangen
  rationale: Die Verbindung bezeichnet Herkunft beziehungsweise Ursprung. Das deutsche Perfekt gibt den vollendeten Aspekt wieder und bleibt zugleich idiomatisch.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heerscharen
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben; „Heerscharen“ bewahrt die konkrete Bildwelt des Titels צְבָאוֹת.
- source_word: הִפְלִיא עֵצָה
  choice: Wunderbar ist sein Rat
  rationale: Die verdichtete poetische Formulierung rühmt die außergewöhnliche Qualität von Yahwehs Rat. Die prädikative deutsche Wiedergabe ist natürlich und wahrt den Parallelismus.
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: groß seine Umsicht
  rationale: תּוּשִׁיָּה bezeichnet hier nicht nur abstrakte Weisheit, sondern auch praktische Einsicht und wirksame Findigkeit. „Umsicht“ passt zum Kontext sachkundigen Handelns; die knappe Prädikation bewahrt den poetischen Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bezug der Schlussprädikate
  choice: „sein Rat“ und „seine Umsicht“ beziehen sich auf Yahweh
  alternative: 'unpersönliche oder verbale Wiedergabe: „Er macht Rat wunderbar und Umsicht groß“'
  rationale: Der vorausgehende Gottesname liefert den naheliegenden Bezug. Die deutsche Nominalkonstruktion bringt die Lobpreisung klar zum Ausdruck, ohne eine zusätzliche Lehrbestimmung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Yahweh der Heerscharen“ bewahrt die Form und Bildwelt des hebräischen Gottestitels; „Umsicht“ hält den praktischen Kontext der vorausgehenden Ackerbaulehre präsent.
