  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: de
  text: Ich mache das Recht[a] zur Messschnur und die Gerechtigkeit zum Senkblei[b]. Der Hagel wird die Zuflucht der Lüge hinwegfegen, und die Wasser werden den Unterschlupf[c] überfluten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gericht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist das Gewicht eines Lots; auch: „Lot“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Versteck“; das hebräische Wort kann einen Ort des Verbergens oder des Schutzes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ich mache
  rationale: שׂים bedeutet hier, etwas als Maßstab einzusetzen. „Ich mache … zu“ gibt die prädikative Konstruktion im Deutschen natürlich und bestimmt wieder.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט bezeichnet hier Gottes gerechtes Recht beziehungsweise Urteil als Maßstab. „Recht“ wahrt die Unterscheidung zur folgenden צְדָקָה und klingt in der Baumetapher natürlich.
- source_word: לְקָו
  choice: zur Messschnur
  rationale: קָו ist eine beim Bauen verwendete Messschnur. Die konkrete Wiedergabe verdeutlicht die architektonische Metapher, ohne sie aufzulösen.
- source_word: וּצְדָקָה
  choice: und die Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die moralisch-ethische Bedeutung von צְדָקָה und die begriffliche Spannung zum parallelen מִשְׁפָּט.
- source_word: לְמִשְׁקָלֶת
  choice: zum Senkblei
  rationale: מִשְׁקָלֶת bezeichnet wahrscheinlich das Gewicht eines Lots. „Senkblei“ ist ein konkreter, verständlicher deutscher Baubegriff.
- source_word: וְיָעָה
  choice: wird … hinwegfegen
  rationale: יעה bedeutet wegfegen oder wegräumen. Mit Hagel als Subjekt ist „hinwegfegen“ anschaulich und idiomatisch.
- source_word: מַחְסֵה כָזָב
  choice: die Zuflucht der Lüge
  rationale: Die Genitivverbindung wird eng am Hebräischen wiedergegeben und greift die trügerische Sicherheit des unmittelbaren Zusammenhangs auf.
- source_word: וְסֵתֶר
  choice: und den Unterschlupf
  rationale: סֵתֶר bezeichnet einen Ort des Verbergens oder Schutzes. „Unterschlupf“ verbindet beide Aspekte und passt zum Unwetterbild.
- source_word: מַיִם יִשְׁטֹפוּ
  choice: die Wasser werden … überfluten
  rationale: Der poetische Plural „die Wasser“ spiegelt מַיִם, während „überfluten“ den Sinn von שׁטף als überwältigendes Überschwemmen prägnant wiedergibt.
theological_decisions:
- issue: Wiedergabe des Begriffspaars מִשְׁפָּט / צְדָקָה
  choice: Recht / Gerechtigkeit
  alternative: Gericht / Gerechtigkeit; Gerechtigkeit / Rechtschaffenheit
  rationale: Die getrennten Wiedergaben erhalten die Spannung zwischen rechtlicher Urteils- und Ordnungsdimension einerseits und moralischer Gerechtigkeit andererseits, ohne die Begriffe künstlich zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarer Baumetapher. Der poetische Ausdruck „die Wasser“ wurde beibehalten; die Zukunftsformen machen die angekündigte Handlung im Deutschen eindeutig.
