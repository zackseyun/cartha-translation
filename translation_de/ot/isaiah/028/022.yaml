source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: de
  text: 'Und nun spottet nicht, sonst werden eure Fesseln noch fester. Denn ich habe von Herrn Jahwe der Heerscharen gehört: Über das ganze Land ist eine vollständige Vernichtung beschlossen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die ganze Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum … jetzt
  rationale: Die Formulierung verbindet den Übergang aus dem vorhergehenden Zusammenhang mit der zeitlichen Dringlichkeit. „Darum“ gibt das folgernde וְ idiomatisch wieder, „jetzt“ entspricht עַתָּה.
- source_word: תִּתְלוֹצָצוּ
  choice: spottet
  rationale: לוץ bezeichnet höhnisches, verächtliches Spotten. Das schlichte „spotten“ wahrt den prophetischen Ernst und ist im modernen Deutsch gut verständlich.
- source_word: פֶּן יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: sonst werden eure Fesseln noch fester
  rationale: פֶּן leitet die angedrohte Folge ein. Da מוֹסְרֵיכֶם Subjekt von יֶחְזְקוּ ist, werden die Fesseln selbst stärker beziehungsweise fester; „noch“ bringt die Steigerung im Deutschen natürlich zum Ausdruck.
- source_word: כָלָה וְנֶחֱרָצָה
  choice: eine vollständige Vernichtung beschlossen
  rationale: כָלָה bezeichnet im Gerichtskontext ein vollständiges Ende beziehungsweise Vernichtung; נֶחֱרָצָה beschreibt sie als festgelegt oder beschlossen. Die deutsche Fassung bewahrt beide Aspekte, ohne die Konstruktion unnötig zu glätten.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr Jahwe, der Herr der Heerscharen
  rationale: „Herr“ gibt אֲדֹנָי wieder, „Jahwe“ bewahrt den Gottesnamen, und „Herr der Heerscharen“ gibt den geläufigen Titel mit צְבָאוֹת in würdigem Deutsch wieder.
- source_word: עַל כָּל הָאָרֶץ
  choice: über das ganze Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der nähere Gerichtskontext spricht für „Land“; die ebenfalls mögliche universale Bedeutung wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: der Herr, der HERR
  rationale: Die Fassung unterscheidet den Titel אֲדֹנָי vom Gottesnamen יְהוִה und macht beide Bestandteile sichtbar, ohne sie zu „Herr HERR“ zusammenzuziehen.
- issue: Reichweite von הָאָרֶץ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: Der lokale Bezug auf das angekündigte Gericht legt „Land“ nahe. Da das hebräische Wort ebenso „Erde“ bezeichnen kann, bleibt die weiter reichende Lesart ausdrücklich in der Fußnote erhalten.
- issue: Art des angekündigten Gerichts in כָלָה
  choice: vollständige Vernichtung
  alternative: vollständiges Ende
  rationale: Im Gerichtszusammenhang ist „Vernichtung“ naheliegend, doch der Ausdruck wird nicht als Aussage über metaphysische Auslöschung ausgedeutet; er bezeichnet die umfassende Vollstreckung des angekündigten Gerichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Warnung. Der Ausruf nach der Warnung gibt ihre Dringlichkeit wieder. Der abschließende Doppelpunkt stellt die gehörte Botschaft klar heraus, ohne die nominale Dichte des Hebräischen in unnatürliches Deutsch zu übertragen.
