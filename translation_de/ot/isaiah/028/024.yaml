  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: de
  text: Pflügt der Pflüger etwa den ganzen Tag, um zu säen? Bricht er immerfort seinen Acker auf und eggt ihn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bricht er immerfort seinen Boden auf und ebnet ihn?“ Die hebräischen Ausdrücke für die Feldarbeit können auch allgemeiner wiedergegeben werden; der Haupttext folgt der wahrscheinlich gemeinten Abfolge der Bodenbearbeitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: etwa den ganzen Tag
  rationale: Die Fragepartikel הֲ leitet eine rhetorische Frage ein; „etwa“ macht dies im Deutschen natürlich kenntlich, während „den ganzen Tag“ den zeitlichen Sinn wahrt.
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: pflügt der Pflüger
  rationale: Die etymologische Wiederholung des hebräischen Verbs und Partizips wird durch die deutsche Wortverwandtschaft bewahrt; „Pflüger“ ist verständlich und erhält das landwirtschaftliche Bild.
- source_word: לִזְרֹעַ
  choice: um zu säen
  rationale: Der Infinitiv mit לִ bezeichnet hier den Zweck des Pflügens.
- source_word: יְפַתַּח
  choice: bricht ... auf
  rationale: פתח bedeutet wörtlich „öffnen“; beim Bearbeiten eines Feldes ist „den Acker aufbrechen“ die natürliche deutsche Entsprechung.
- source_word: וִישַׂדֵּד
  choice: eggt
  rationale: Das seltene landwirtschaftliche Verb bezeichnet hier wahrscheinlich die weitere Bodenbearbeitung nach dem Pflügen, etwa Eggen, Zerkleinern oder Einebnen. „Eggen“ gibt die vermutliche Arbeitsfolge prägnant wieder.
- source_word: אַדְמָתוֹ
  choice: seinen Acker ... ihn
  rationale: אדמה meint hier den bearbeiteten Erdboden. „Acker“ ist im deutschen Zusammenhang natürlich; das Pronomen vermeidet eine schwerfällige Wiederholung.
