source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: de
  text: 'Und die welkende Blüte seiner herrlichen Pracht, die auf der Höhe des fruchtbaren Tals liegt, wird sein wie eine Frühfeige vor dem Sommer: Kaum sieht sie jemand, verschlingt er sie, noch während sie in seiner Hand liegt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: die welkende Blüte
  rationale: צִיצַת bezeichnet eine Blüte, נֹבֵל eine welkende beziehungsweise verblühende. Die Formulierung bewahrt Bild und Partizipialcharakter.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: seiner herrlichen Pracht
  rationale: Beide Substantive bezeichnen Schönheit, Schmuck oder Herrlichkeit. Die Wendung erhält die emphatische Häufung, ohne im Deutschen unnötig schwerfällig zu werden.
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: die über dem fruchtbaren Tal thront
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und bezeichnet hier die beherrschende Höhenlage; שְׁמָנִים („Fettigkeiten“) ist ein Bild für Fruchtbarkeit. „Thront“ gibt die räumliche und zugleich stolze Wirkung im Zusammenhang natürlich wieder.
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: wie eine Frühfeige vor dem Sommer
  rationale: בִּכּוּרָה bezeichnet die zuerst reifende Frucht und wird hier sachgerecht als frühe Feige verstanden; בְּטֶרֶם קַיִץ bezeichnet die Zeit vor der sommerlichen Ernte.
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: Kaum sieht sie jemand
  rationale: Die hebräische Wiederholung des Verbs „sehen“ hebt die unmittelbare Reaktion hervor. „Kaum …“ gibt diese Schnelligkeit idiomatisch wieder.
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: noch während sie in seiner Hand liegt
  rationale: כַּף kann Handfläche oder Hand bezeichnen. Im Deutschen ist „in seiner Hand“ natürlich und bewahrt das anschauliche Bild.
- source_word: יִבְלָעֶנָּה
  choice: verschlingt er sie
  rationale: בלע bedeutet „verschlingen, hinunterschlucken“ und vermittelt hier hastigen, vollständigen Verzehr.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt das doppelte Bild von der welkenden Blüte und der sofort verschlungenen Frühfeige; die idiomatische Wiedergabe vermeidet zugleich unnatürliche Hebraismen.
