base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: de
  text: Wen will er Erkenntnis lehren, und wem wird er die Botschaft[a] verständlich machen? Die von Milch Entwöhnten, die von den Brüsten Weggenommenen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Bericht“ beziehungsweise „das Gehörte“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen bleibt unausgesprochen, wer lehrt und verständlich macht. Im Zusammenhang könnten hier Spötter von Jesaja reden.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה
  choice: wird er … lehren
  rationale: Das Hifil von ירה bedeutet hier „lehren/unterweisen“. Die futurische Form passt zur rhetorischen Frage und klingt im Deutschen natürlich.
- source_word: דֵעָה
  choice: Erkenntnis
  rationale: דֵעָה bezeichnet Wissen oder Erkenntnis. „Erkenntnis“ gibt den abstrakten Lehrinhalt würdig und direkt wieder.
- source_word: יָבִין
  choice: wird er … verständlich machen
  rationale: 'Das Hifil von בין hat kausativen Sinn: jemanden verstehen lassen. „Verständlich machen“ bewahrt diesen Sinn idiomatisch.'
- source_word: שְׁמוּעָה
  choice: die Botschaft
  rationale: Das Wort kann eine Nachricht, einen Bericht oder das Gehörte bezeichnen. Im Zusammenhang des Lehrens ist „Botschaft“ eine natürliche, nicht zu enge Wiedergabe.
- source_word: גְּמוּלֵי מֵחָלָב
  choice: die von der Milch entwöhnt
  rationale: Die passive Form von גמל bezeichnet Entwöhnte; מן drückt die Trennung von der Milch aus.
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: die von den Brüsten genommen sind
  rationale: עתק bezeichnet das Wegnehmen oder Entfernen. Die Formulierung wahrt den Parallelismus und gibt den hebräischen Plural שָׁדַיִם wieder.
- source_word: אֶת מִי ... וְאֶת מִי
  choice: Wem … und wem
  rationale: Die Wiederholung bildet zwei parallele rhetorische Fragen. Der deutsche Dativ entspricht idiomatisch den Verben „lehren“ und „verständlich machen“.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Verben im Singular
  choice: Das Pronomen „er“ bleibt ohne namentliche Bestimmung stehen.
  alternative: Den Sprecherbezug ausdrücklich auf Jesaja, auf den HERRN oder auf eine spöttische Äußerung über Jesaja festlegen.
  rationale: Der hebräische Vers nennt das Subjekt nicht. Der Zusammenhang kann auf spöttische Rede über Jesaja weisen, doch eine ausdrückliche Identifizierung würde die echte Mehrdeutigkeit des Textes auflösen.
- issue: Adressaten der rhetorischen Schlussfrage
  choice: Die Entwöhnten und von den Brüsten Genommenen werden als fragend genannte mögliche Adressaten wiedergegeben.
  alternative: Die Wendung als direkte, feststellende Bezeichnung der tatsächlichen Adressaten formulieren.
  rationale: Die Frageform bewahrt den wahrscheinlich spöttischen Ton und lässt offen, ob die Redenden sich gegen eine Behandlung wie Kleinkinder verwahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Fragen und das Bild entwöhnter Kleinkinder bleiben erhalten; die implizite Subjektangabe und der mögliche Spott werden nicht im Haupttext vereindeutigt.
