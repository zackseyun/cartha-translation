  text: אֲשֶׁ֣ר אָמַ֣ר אֲלֵי/הֶ֗ם זֹ֤את הַ/מְּנוּחָה֙ הָנִ֣יחוּ לֶֽ/עָיֵ֔ף וְ/זֹ֖את הַ/מַּרְגֵּעָ֑ה וְ/לֹ֥א אָב֖וּא שְׁמֽוֹעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: de
  text: 'zu denen er sagte: »Dies ist die Ruhe: Gebt dem Müden Ruhe! Und dies ist die Erholung.« Doch sie wollten nicht hören.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: die Ruhe
  rationale: Gibt die grundlegende Bedeutung von Ruhe beziehungsweise Ruheplatz knapp wieder und entspricht dem bestimmten Ausdruck im Hebräischen.
- source_word: הָנִיחוּ לֶעָיֵף
  choice: Gebt dem Müden Ruhe!
  rationale: Bewahrt den kausativen Imperativ von נוח und gibt לֶעָיֵף natürlich als Empfängerangabe wieder.
- source_word: הַמַּרְגֵּעָה
  choice: der Ort der Erholung
  rationale: Der seltene Ausdruck bezeichnet einen Ruhe- oder Erholungsort; diese Wiedergabe unterscheidet ihn hörbar von מְנוּחָה, ohne seine Nähe zum Gedanken der Ruhe aufzugeben.
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: Doch sie wollten nicht hören
  rationale: אָבָה bezeichnet Bereitschaft beziehungsweise Willigkeit; die deutsche Formulierung gibt die bewusste Weigerung idiomatisch wieder.
theological_decisions:
- issue: Bezug und Charakter der angebotenen Ruhe
  choice: Die Aussage bleibt als konkrete göttliche Aufforderung zur Ruhe für den Müden formuliert.
  alternative: Die Ruhe ausdrücklich als Heil, Sabbatruhe oder politische Sicherheit deuten.
  rationale: Der Vers selbst legt die genaue theologische oder historische Ausgestaltung der Ruhe nicht abschließend fest; eine stärkere Präzisierung würde die vorhandene Offenheit beseitigen.
- issue: Subjekt von אָמַר
  choice: Das im Kontext erschließbare männliche Singularsubjekt wird nicht ausdrücklich ergänzt.
  alternative: „Gott sagte zu ihnen“ oder „der HERR sagte zu ihnen“.
  rationale: Im hebräischen Vers steht lediglich „er sagte“; die Übersetzung vermeidet eine erklärende Einfügung in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus wird durch zwei kurze demonstrative Sätze erhalten; der Imperativ bleibt deutlich. Keine konfessionell geprägte Deutung wird in den Wortlaut eingetragen.
