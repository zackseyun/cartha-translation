  language: de
  text: Denn alle Tische sind voll von Erbrochenem und Kot – kein Platz ist frei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: Tische
  rationale: Direkte und im Kontext natürliche Wiedergabe des Plurals.
- source_word: קִיא
  choice: Erbrochenem
  rationale: Gibt den derben Ausdruck sachlich, klar und würdig wieder.
- source_word: צֹאָה
  choice: Kot
  rationale: Die Parallelstellung zu קִיא spricht für die konkrete Bedeutung „Kot/Exkremente“, nicht für das abstraktere „Schmutz“.
- source_word: בְּלִי מָקוֹם
  choice: kein Platz ist frei
  rationale: 'Drückt die elliptische hebräische Wendung idiomatisch aus: Nirgends auf den Tischen bleibt eine unverschmutzte Stelle.'
theological_decisions:
- issue: Reichweite von בְּלִי מָקוֹם
  choice: kein Platz ist frei
  alternative: ohne [freien] Platz
  rationale: Die knappe Aussage bleibt erhalten, wird im Deutschen aber als verständlicher vollständiger Satz formuliert; eine weitergehende theologische Deutung wird vermieden.
translation_notes:
  register: Modernes, deutliches Standarddeutsch. Die drastische Bildsprache des Hebräischen wird nicht abgeschwächt; der Gedankenstrich bildet die abschließende elliptische Zuspitzung ab.
