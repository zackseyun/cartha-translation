  text: וּ/לְ/ר֖וּחַ מִשְׁפָּ֑ט לַ/יּוֹשֵׁב֙ עַל הַ/מִּשְׁפָּ֔ט וְ/לִ֨/גְבוּרָ֔ה מְשִׁיבֵ֥י מִלְחָמָ֖ה שָֽׁעְרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: de
  text: und zum Geist der Gerechtigkeit für den, der zu Gericht sitzt,[a] und zur Stärke für die, die den Kampf am Tor zurückschlagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den, der auf dem Richterstuhl sitzt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die den Kampf zum Tor hin zurückschlagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: und zum Geist der Gerechtigkeit
  rationale: 'Die Präposition לְ führt die von Jesaja 28,5 abhängige Aussage fort: Der HERR wird seinem Volk zum Geist der Gerechtigkeit. „Geist der Gerechtigkeit“ bewahrt die hebräische Nominalfügung und den abstrakten Sinn von מִשְׁפָּט.'
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: für den, der zu Gericht sitzt
  rationale: Die Formulierung gibt das substantivierte Partizip im Singular und die richterliche Tätigkeit natürlich wieder. Das Deutsche „zu Gericht sitzen“ bewahrt zudem das Bild des Sitzens, ohne zwingend einen konkreten Richterstuhl vorauszusetzen.
- source_word: וְלִגְבוּרָה
  choice: und zur Stärke
  rationale: גְּבוּרָה bezeichnet hier im parallelen militärischen Kontext Stärke oder Kampfkraft. „Stärke“ ist verständlich und hält die Aussage offen, ob eine Eigenschaft oder verliehene Kraft im Vordergrund steht.
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: für die, die den Kampf zurückschlagen
  rationale: Das Partizip von שׁוב bezeichnet kausativ diejenigen, die Kampf beziehungsweise Angriff zurückwenden. „Den Kampf zurückschlagen“ ist im Deutschen idiomatisch und erhält den militärischen Sinn.
- source_word: שַׁעְרָה
  choice: am Tor
  rationale: Die Form bezeichnet die Richtung zum Tor oder den Bereich am Tor. Im Kontext der Verteidigung ist „am Tor“ die natürliche Ortsangabe; die Richtungsnuance bleibt als Fußnotenalternative erhalten.
theological_decisions:
- issue: Syntaktische Beziehung zu Jesaja 28,5
  choice: 'Die Präpositionalfügungen werden als Fortsetzung der Aussage verstanden, dass der HERR seinem Volk etwas sein wird: „zum Geist … und zur Stärke“.'
  alternative: Man könnte freier formulieren, dass der HERR Geist der Gerechtigkeit und Stärke „gibt“.
  rationale: Im Hebräischen hängt Vers 6 syntaktisch von der Aussage des vorigen Verses ab. Die gewählte Fassung bewahrt diese Abhängigkeit und vermeidet es, ein nicht ausdrücklich vorhandenes Verb wie „geben“ einzufügen.
- issue: Bedeutung von מִשְׁפָּט
  choice: Gerechtigkeit
  alternative: Urteilsvermögen oder Rechtsprechung
  rationale: Im ersten Vorkommen kennzeichnet das Wort den Geist, der den Richter befähigt. „Gerechtigkeit“ wahrt die ethisch-rechtliche Weite, während der folgende Ausdruck die konkrete richterliche Funktion bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Fügung „zum Geist … und zur Stärke“ ist bewusst beibehalten, weil der Vers syntaktisch die Aussage von Vers 5 fortsetzt. Die inklusiv verständliche Pluralform „die“ gibt das hebräische maskuline Partizip als allgemeine Gruppenbezeichnung wieder.
