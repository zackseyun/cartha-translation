base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: de
  text: 'So wird das Wort Jahwes für sie sein: »Befehl auf Befehl, Befehl auf Befehl, Linie auf Linie, Linie auf Linie, ein wenig hier, ein wenig dort«[a], damit sie gehen und rückwärts stolpern und zerbrochen werden, in eine Falle geraten und gefangen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebot auf Gebot, Gebot auf Gebot«. Traditionell: »Vorschrift auf Vorschrift, Vorschrift auf Vorschrift«. Das Hebräische ist äußerst knapp und ahmt wahrscheinlich eine spöttische oder kindliche Wiederholung nach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָהֶם
  choice: So wird ... für sie sein
  rationale: Die Formulierung bewahrt die resultative Verknüpfung mit dem vorausgehenden Zusammenhang und gibt לָהֶם unmittelbar wieder.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ wahrt den prophetischen Sprachgebrauch; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: צַו לָצָו צַו לָצָו
  choice: Befehl auf Befehl, Befehl auf Befehl
  rationale: „Befehl“ ist lexikalisch plausibel und erhält die knappe, stakkatoartige Wiederholung. Die Unsicherheit und der vermutlich spöttische oder kindlich klingende Ton werden in der Fußnote kenntlich gemacht.
- source_word: קַו לָקָו קַו לָקָו
  choice: Linie auf Linie, Linie auf Linie
  rationale: „Linie“ bildet die Grundbedeutung von קַו ab und bewahrt Klang, Kürze und Parallelismus.
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: ein wenig hier, ein wenig dort
  rationale: Die idiomatisch-distributive Wiedergabe klingt im Deutschen natürlich und erhält die wiederholende Kadenz.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ lässt sowohl Zweck als auch resultative beziehungsweise gerichtliche Wirkung offen.
- source_word: יֵלְכוּ וְכָשְׁלוּ אָחוֹר
  choice: sie gehen und rückwärts stolpern
  rationale: Die Verbfolge und das Bild des Rückwärtsstolperns bleiben eng am Hebräischen erhalten.
- source_word: וְנִשְׁבָּרוּ וְנוֹקְשׁוּ וְנִלְכָּדוּ
  choice: zerbrochen, verstrickt und gefangen werden
  rationale: Die Passivfolge und ihre Steigerung werden bewahrt; „verstrickt“ vermittelt das Fallen in eine Schlinge, ohne mit „gefangen“ zusammenzufallen.
theological_decisions:
- issue: Gerichtlicher Zweck oder gerichtliche Folge im Schlusssatz
  choice: „damit“ mit unveränderter Verbfolge
  alternative: Eine rein beschreibende Folge, etwa „sodass“, oder eine ausdrückliche Deutung als göttlicher Gerichtsplan
  rationale: לְמַעַן und der Kontext legen eine zweckhaft-gerichtliche Wirkung nahe. „Damit“ erhält diese Spannung, ohne die Verantwortlichkeit der Menschen oder Gottes Wirken über den Wortlaut hinaus zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die absichtlich monotone und stakkatoartige Wiederholung bleibt erhalten. „Jahwe“ gibt den Gottesnamen wieder; die schwierige Klang- und Wortfolge wird nicht unnötig geglättet.
