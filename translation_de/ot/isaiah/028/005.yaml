id: ISA.28.5
reference: Isaiah 28:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ יְהוָ֣ה צְבָא֔וֹת לַ/עֲטֶ֣רֶת צְבִ֔י וְ/לִ/צְפִירַ֖ת תִּפְאָרָ֑ה לִ/שְׁאָ֖ר עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
translation:
  language: de
  text: An jenem Tag wird Jahwe der Heere für den Rest seines Volkes eine Krone der Schönheit und ein Diadem der Pracht sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „der HERR der Heerscharen“. Der hebräische Titel יְהוָה צְבָאוֹת enthält den Gottesnamen Jahwe; צְבָאוֹת bedeutet „Heere“ oder „Heerscharen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird natürlich und zugleich feierlich wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heere“ macht den Grundsinn von צְבָאוֹת im heutigen Deutsch transparent.
- source_word: יִהְיֶה
  choice: wird … sein
  rationale: Das Imperfekt bezeichnet hier einen zukünftigen Zustand.
- source_word: לַעֲטֶרֶת צְבִי
  choice: eine Krone der Schönheit
  rationale: Die substantivische Verbindung bewahrt das Bild der Krone und unterscheidet צְבִי von der folgenden תִּפְאָרָה.
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: und ein Diadem der Pracht
  rationale: „Diadem“ erhält die leichte lexikalische Variation im poetischen Parallelismus; „Pracht“ gibt תִּפְאָרָה angemessen wieder.
- source_word: לִשְׁאָר עַמּוֹ
  choice: für den Rest seines Volkes
  rationale: „Rest“ ist im Deutschen die etablierte prophetische Bezeichnung für den nach dem Gericht verbleibenden Teil des Volkes; „für“ gibt den begünstigenden Sinn der Präposition לְ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Die gewählte Fassung bewahrt den persönlichen Gottesnamen und übersetzt צְבָאוֹת verständlich, ohne die mögliche traditionelle Wiedergabe zu verschweigen.
- issue: Bedeutung von שְׁאָר
  choice: Rest
  alternative: das Übriggebliebene
  rationale: „Rest“ bewahrt das für Jesaja wichtige Motiv des nach Gericht und Bewahrung verbleibenden Gottesvolkes, ohne über den Vers hinaus zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die beiden Schmuckbilder und ihre unterschiedlichen Bestimmungen bleiben bewusst voneinander unterschieden.
