  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: de
  text: 'Darum spricht der Herr, JHWH: Siehe, ich lege in Zion einen Stein, einen bewährten Stein, einen kostbaren Eckstein, ein fest gegründetes Fundament. Wer vertraut,[a] wird nicht hasten.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer glaubt“. Das hebräische Partizip kann sowohl Glauben als auch vertrauendes Sich-Verlassen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird nicht eilen“; sinngemäß verstehen manche die Wendung als „wird nicht in Panik geraten“.'
    reason: lexical_alternative
  - marker: c
    text: Dieser „Stein“ wird in Römer 9,33 und 1. Petrus 2,6 auf den Messias bezogen.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, JHWH
  rationale: Die Verbindung aus Herrentitel und Gottesnamen wird ohne die missverständliche Verdoppelung „Herr HERR“ wiedergegeben; „JHWH“ wahrt die Unterscheidung beider Elemente.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: „Siehe“ bewahrt den feierlichen, aufmerksamkeitslenkenden Nachdruck der prophetischen Rede und ist im modernen Deutschen weiterhin verständlich.
- source_word: יִסַּד
  choice: ich lege
  rationale: Im Zusammenhang bezeichnet die Form Gottes wirksames Legen beziehungsweise Gründen des Steins. „Ich lege“ erhält das konkrete architektonische Bild.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Die Präposition bezeichnet hier am natürlichsten den Ort der Gründung.
- source_word: אֶבֶן אֶבֶן בֹּחַן
  choice: einen Stein, einen bewährten Stein
  rationale: Die Wiederholung von „Stein“ bleibt als rhetorische Hervorhebung erhalten; „bewährt“ vermittelt, dass der Stein geprüft und als zuverlässig erwiesen ist.
- source_word: פִּנַּת יִקְרַת
  choice: einen kostbaren Eckstein
  rationale: Die Wendung verbindet die architektonische Funktion des Ecksteins mit seinem hohen Wert beziehungsweise seiner besonderen Würde.
- source_word: מוּסָד מוּסָּד
  choice: ein fest gegründetes Fundament
  rationale: Die verwandten Formen verstärken den Gedanken zuverlässiger Gründung. Die Formulierung erhält diese sprachliche Verdichtung natürlicher als eine wörtliche Substantivwiederholung.
- source_word: הַמַּאֲמִין
  choice: Wer vertraut
  rationale: Das Partizip der Wurzel אמן bezeichnet hier vertrauendes Sich-Verlassen; die offene deutsche Form vermeidet eine unnötige Geschlechtsmarkierung.
- source_word: לֹא יָחִישׁ
  choice: wird nicht hastig handeln
  rationale: Das Verb bezeichnet Eilen oder überstürztes Handeln. Die Wiedergabe bleibt nahe am hebräischen Ausdruck, ohne die mögliche Folge „in Panik geraten“ in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung des in Zion gelegten Steins
  choice: Das architektonische Bild bleibt im Haupttext ohne ausdrückliche messianische Identifizierung stehen.
  alternative: Den Stein bereits in der Übersetzung ausdrücklich als Messias beziehungsweise Christus bezeichnen.
  rationale: Der hebräische Text nennt den Stein nicht ausdrücklich den Messias. Seine christologische Aufnahme im Neuen Testament wird deshalb in einer Fußnote kenntlich gemacht, ohne die Bildsprache des Ausgangstextes aufzulösen.
- issue: Bedeutung von הַמַּאֲמִין
  choice: Wer vertraut
  alternative: Wer glaubt
  rationale: Die hebräische Wurzel kann sowohl Glauben als auch vertrauendes Sich-Verlassen ausdrücken. „Vertraut“ bringt hier die Haltung sicherer Zuversicht gegenüber dem von Gott gelegten Fundament besonders natürlich zum Ausdruck; die Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Feierlichkeit. Die Wiederholung „einen Stein, einen bewährten Stein“ und die architektonische Metaphorik bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
