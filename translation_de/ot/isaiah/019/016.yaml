source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: de
  text: An jenem Tag wird Ägypten wie Frauen sein[a]. Es wird zittern und sich fürchten vor dem Schwingen der Hand Jahwes, des Herrn der Heere[b], die er gegen Ägypten schwingt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vergleich »wie Frauen« gehört zur antiken Kriegsbildsprache für Schutzlosigkeit und Furcht; im Hebräischen steht ausdrücklich »Frauen«.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Jahwe der Heerscharen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »dem Schwenken« oder »dem Schwingen/Schwenken der Hand«; die Wendung bezeichnet eine gegen Ägypten gerichtete Handbewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die geläufige prophetische Zeitformel in natürlichem, würdigem Deutsch.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Bezeichnet das Land beziehungsweise Volk als kollektive Einheit; die Wiederaufnahme mit dem Eigennamen vermeidet ein im Deutschen mehrdeutiges Pronomen.
- source_word: כַּנָּשִׁים
  choice: wie Frauen
  rationale: Gibt den ausdrücklich weiblichen Vergleich des Hebräischen unverändert wieder; sein antikes Kriegsbild wird in einer Fußnote erläutert, nicht im Haupttext abgeschwächt.
- source_word: וְחָרַד וּפָחַד
  choice: Es wird zittern und sich fürchten
  rationale: Erhält beide Verben und ihre steigernde Wirkung in idiomatischem Deutsch.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Drückt hier knapp und natürlich den Auslöser beziehungsweise Gegenstand der Furcht aus.
- source_word: תְּנוּפַת יַד
  choice: der drohend erhobenen Hand
  rationale: Vermittelt die konkrete, feindselige Gebärde natürlicher als das missverständliche »Winken der Hand«; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heere
  rationale: Gibt den Gottesnamen als Jahwe wieder und macht צְבָאוֹת mit der im Deutschen verständlichen Titelprägung »Herr der Heere« transparent.
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: die er gegen Ägypten erhebt
  rationale: Bezieht den Relativsatz grammatisch auf »Hand« und wahrt die feindliche Richtung von עָלָיו; »Ägypten« verdeutlicht den Bezug des hebräischen Pronomens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: der Herr der Heere
  alternative: der Heerscharen
  rationale: »Herr der Heere« bewahrt den militärischen Sinn und ist für heutige Leser unmittelbarer verständlich; die traditionelle Alternative bleibt in der Fußnote sichtbar.
- issue: Bewahrung des Vergleichs כַּנָּשִׁים
  choice: wie Frauen
  alternative: verängstigt und wehrlos
  rationale: Die geschlechtsspezifische Formulierung und ihre historische Spannung werden nicht neutralisiert oder interpretierend aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung des Bewegungsverbs im Hebräischen wird durch »drohend erhoben … erhebt« nachvollziehbar gehalten; eine Fußnote dokumentiert die wörtlichere Bildform.
