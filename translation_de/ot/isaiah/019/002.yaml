source:
  edition: WLC
  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: de
  text: Ich werde die Ägypter gegeneinander aufstacheln[a]. Dann wird jeder gegen seinen Bruder kämpfen und jeder gegen seinen Nächsten, Stadt gegen Stadt, Königreich gegen Königreich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde Ägypten gegen Ägypten aufstacheln.“'
    reason: Die Fußnote bewahrt die auffällige Wiederholung des Landesnamens, während der Haupttext deren kollektiven Sinn verständlich wiedergibt.
lexical_decisions:
- source_word: סִכְסַכְתִּי
  choice: Ich werde … gegeneinander aufstacheln
  rationale: Das Verb bezeichnet das Verursachen innerer Zwietracht. „Gegeneinander aufstacheln“ gibt die kausative Bedeutung im modernen Deutschen klar wieder, ohne die daraus folgende Auseinandersetzung bereits als Krieg festzulegen.
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: die Ägypter gegeneinander
  rationale: Wörtlich steht zweimal der Landesname „Ägypten“. Der anschließende Plural und die gestaffelte Schilderung innerer Kämpfe zeigen jedoch, dass hier die Bevölkerung beziehungsweise Gruppen innerhalb Ägyptens gemeint sind. Die deutsche Formulierung macht diesen kollektiven Sinn verständlich; die formale Gestalt wird in der Fußnote bewahrt.
- source_word: וְנִלְחֲמוּ
  choice: Dann wird … kämpfen
  rationale: Das pluralische Verb bedeutet „kämpfen“. Das folgende distributive אִישׁ entfaltet die Beteiligten einzeln; daher ist „jeder … kämpfen“ im Deutschen sachgerecht. „Dann“ macht den folgernden Anschluss des hebräischen וְ idiomatisch deutlich.
- source_word: אִישׁ … וְאִישׁ
  choice: jeder … und jeder
  rationale: אִישׁ wird hier distributiv gebraucht. „Jeder“ bewahrt diese Funktion und klingt natürlicher als das formale „ein Mann … und ein Mann“.
- source_word: בְּאָחִיו
  choice: gegen seinen Bruder
  rationale: „Bruder“ entspricht dem unmittelbaren Wortsinn und erhält das eindringliche Bild, dass selbst familiäre Bindungen zerbrechen.
- source_word: בְּרֵעֵהוּ
  choice: gegen seinen Nächsten
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bezeichnen. „Nächster“ passt zur Ausweitung des Konflikts von der Familie auf das gesellschaftliche Umfeld.
- source_word: עִיר בְּעִיר
  choice: Stadt gegen Stadt
  rationale: Die knappe Form bewahrt Wortlaut, Rhythmus und die Steigerung von persönlichen zu städtischen Konflikten.
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: Königreich gegen Königreich
  rationale: „Königreich“ ist die transparente Entsprechung für מַמְלָכָה und erhält die abschließende politische Ebene der Steigerung.
theological_decisions:
- issue: Kollektive Bedeutung des zweimaligen Landesnamens מִצְרַיִם im Zusammenhang innerer Unruhen
  choice: die Ägypter gegeneinander
  alternative: Ägypten gegen Ägypten
  rationale: Der hebräische Text lässt formal den Landesnamen stehen, während der weitere Satz Konflikte zwischen Menschen und innerägyptischen politischen Einheiten beschreibt. Die Übersetzung gibt den im Kontext naheliegenden kollektiven Bezug wieder, ohne den wörtlichen Ausdruck zu verschweigen.
- issue: Distributive Bedeutung von אִישׁ
  choice: jeder … und jeder
  alternative: ein Mann … und ein Mann
  rationale: Die Aussage beschreibt, wie der Konflikt die Einzelnen erfasst; das grammatische Maskulinum hebt in dieser Konstruktion nicht eigens das Geschlecht hervor. „Jeder“ gibt diese distributive Funktion in natürlichem Deutsch wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Steigerung vom familiären und gesellschaftlichen Bereich über Städte bis zu Königreichen bleibt knapp und rhythmisch erhalten.
