review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutungen sind treffend wiedergegeben: Die Führer Zoans werden als töricht, die von Nof als getäuscht dargestellt; anschließend werden sie als diejenigen bezeichnet, die Ägypten irreführen. Die Schlussapposition benötigt jedoch eine grammatisch und idiomatisch tragfähige deutsche Wiedergabe des hebräischen Bildes vom „Eckstein/Eckpfeiler“ der Stämme.'
  naturalness: „haben sich täuschen lassen“ kann im Deutschen eine freiwillige oder mitverantwortete Zulassung der Täuschung nahelegen. „sind getäuscht worden“ gibt das passive Niphal unmittelbarer wieder. Die bisherige Formulierung „sie, der Eckstein seiner Stämme“ ist wegen des Konflikts zwischen pluralischem Bezug und singularischem Prädikatsnomen nicht standardsprachlich.
  terminology: „Fürsten“, „Zoan“, „Nof“, „Ägypten“ und „in die Irre geführt“ passen zum prophetischen Register und zum Ausgangstext. „Eckpfeiler“ bewahrt die tragende Leitmetapher von פִּנָּה und lässt sich mit der pluralischen Führergruppe idiomatisch verbinden.
  issues:
  - severity: medium
    issue: Die Schlussapposition ist grammatisch nicht kongruent.
    rationale: „sie, der Eckstein“ verbindet ein pluralisches Bezugswort mit einem singularischen Appositiv. Der hebräische Singular kann ein kollektives Leitbild ausdrücken; im Deutschen ist hier der Plural „die Eckpfeiler“ nötig, damit die Apposition die genannten Fürsten natürlich bezeichnet.
  - severity: low
    issue: „haben sich täuschen lassen“ ist als Passivwiedergabe unnötig markiert.
    rationale: Die Wendung kann eine aktive Duldung implizieren. „sind getäuscht worden“ gibt die passive Bedeutung von נִשָּׁאוּ klarer und ohne zusätzliche Nuance wieder.
  revised_text: Die Fürsten von Zoan sind zu Narren geworden, die Fürsten von Nof[a] sind getäuscht worden. Sie haben Ägypten in die Irre geführt, sie, die Eckpfeiler seiner Stämme.
