  rationale: Die Überarbeitung beseitigt die grammatisch problematische Singularapposition und bewahrt zugleich die metaphorische Aussage, dass diese führenden Männer die tragenden bzw. maßgeblichen Elemente der ägyptischen Stämme sind. Die Passivform wird ohne den möglichen Beiklang freiwilliger Täuschungszulassung formuliert. Die Ortsnamen und die Fußnote bleiben unverändert.
