source:
  edition: WLC
  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: de
  text: Die Fürsten von Zoan sind zu Narren geworden, die Fürsten von Nof[a] sind getäuscht worden. Sie haben Ägypten in die Irre geführt, sie, die Eckpfeiler seiner Stämme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof ist der hebräische Name für Memphis.
    reason: alternative_reading
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: sind zu Narren geworden
  rationale: Das Niphal von יאל bezeichnet hier ein Törichtwerden bzw. Sich-als-töricht-Erweisen. Die resultative Nuance wird bewahrt.
- source_word: שָׂרֵי
  choice: Fürsten
  rationale: שַׂר bezeichnet einen Herrscher, Obersten oder hohen Amtsträger. „Fürsten“ passt zum gehobenen prophetischen Stil und zur politischen Führungsschicht.
- source_word: צֹעַן
  choice: Zoan
  rationale: Der hebräische Ortsname wird transkribiert.
- source_word: נִשְּׁאוּ
  choice: haben sich täuschen lassen
  rationale: Das Niphal von נשׁא wird im Kontext als Getäuschtwerden verstanden; die Formulierung vermeidet die unpassende Deutung „sind erhöht worden“ und steht parallel zur Torheit der Führung.
- source_word: נֹף
  choice: Nof
  rationale: Der hebräische Ortsname wird transkribiert; die geläufige Identifikation mit Memphis steht in der Fußnote.
- source_word: הִתְעוּ
  choice: haben ... in die Irre geführt
  rationale: 'Das Hiphil von תעה hat kausative Bedeutung: jemanden irreführen bzw. vom richtigen Weg abbringen.'
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Landesnamens.
- source_word: פִּנַּת
  choice: Eckstein
  rationale: Wörtlich „Ecke“ bzw. „Eckstein“; metaphorisch bezeichnet das Wort hier ein tragendes oder führendes Element.
- source_word: שְׁבָטֶיהָ
  choice: seiner Stämme
  rationale: שֵׁבֶט kann „Stamm“, „Sippe“, „Stab“ oder „Zepter“ bedeuten. Hier sind wohl die gesellschaftlichen Gliederungen Ägyptens gemeint; das feminine Suffix bezieht sich im Hebräischen auf Ägypten, das im Deutschen sächlich ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Schärfe. Die Wiederholung „die Fürsten“ und das Ecksteinbild bleiben erhalten. Der ungewöhnliche Bezug auf die „Stämme“ Ägyptens wird nicht geglättet.
