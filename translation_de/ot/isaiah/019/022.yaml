  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: de
  text: Und Jahwe wird Ägypten schlagen, schlagen und heilen. Sie werden zu Jahwe umkehren[a]; er wird ihre Bitten erhören[b] und sie heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Jahwe zurückkehren“. Das hebräische Verb kann sowohl eine Hinwendung als auch eine Rückkehr bezeichnen und hat bei den Propheten oft den Beiklang der Umkehr.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „er wird sich von ihnen erbitten lassen“; gemeint ist, dass Jahwe günstig auf ihr Flehen antwortet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: wird … schlagen
  rationale: נגף bezeichnet hier einen von Gott ausgehenden Schlag, möglicherweise auch eine Plage. „Schlagen“ bewahrt die Stärke des Gerichts und ist zugleich modernes, klares Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Länder- und Volksnamens; das folgende pluralische Verb bezieht sich sinngemäß auf die Menschen Ägyptens.
- source_word: נָגֹף וְרָפוֹא
  choice: schlagen und heilen
  rationale: Die beiden Infinitive stellen Gericht und Heilung pointiert nebeneinander. Die Gedankenstriche bilden die emphatische hebräische Konstruktion nach, ohne eine zeitliche Abfolge hinzuzufügen.
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: Sie werden zu Jahwe umkehren
  rationale: שוב mit עַד beschreibt eine Hinwendung beziehungsweise Rückkehr zu Jahwe und kann im prophetischen Zusammenhang Umkehr im religiösen Sinn einschließen. „Umkehren“ wahrt diesen Sinn, ohne ihn dogmatisch auszuweiten.
- source_word: וְנֶעְתַּר לָהֶם
  choice: er wird ihre Bitten erhören
  rationale: Der Niphal von עתר bezeichnet hier, dass Gott sich erbitten lässt und auf das Flehen günstig antwortet. „Ihre Bitten erhören“ ist natürliches modernes Deutsch und bringt die günstige Reaktion zum Ausdruck.
- source_word: וּרְפָאָם
  choice: und sie heilen
  rationale: רפא bedeutet grundsätzlich „heilen“. Die Wiederaufnahme von „heilen“ erhält die lexikalische Verbindung zur ersten Vershälfte und lässt körperliche, gesellschaftliche und geistliche Dimensionen offen.
theological_decisions:
- issue: Verhältnis von göttlichem Gericht und Wiederherstellung
  choice: Jahwe schlägt Ägypten und heilt es zugleich; beide Handlungen werden ihm zugeschrieben.
  alternative: Die Heilung könnte ausschließlich als politische Erholung verstanden oder das Schlagen und Heilen könnten ausdrücklich als zeitlich getrennte Phasen dargestellt werden.
  rationale: Der hebräische Text stellt Schlagen und Heilen unmittelbar nebeneinander und schreibt beides Jahwe zu. Die Übersetzung bewahrt diese Spannung, ohne Art oder zeitlichen Ablauf der Heilung festzulegen.
- issue: Umkehrbedeutung von שׁוב
  choice: zu Jahwe umkehren
  alternative: zu Jahwe zurückkehren
  rationale: „Umkehren“ bewahrt den im prophetischen Kontext möglichen Sinn von Reue und erneuter Hinwendung, behauptet aber nicht mehr, als das Verb im Kontext trägt.
- issue: Gottes günstige Reaktion auf das Flehen
  choice: ihre Bitten erhören
  alternative: sich von ihnen erbitten lassen
  rationale: Die gewählte Formulierung gibt den günstigen Antwortcharakter des Niphal wieder. Sie sagt nicht, dass menschliches Flehen Gott zwingt, sondern dass er sich ihm zuwendet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält die markante hebräische Gegenüberstellung von Schlagen und Heilen. Die pluralischen Pronomen beziehen sich sinngemäß auf die Menschen Ägyptens.
