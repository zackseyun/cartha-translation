source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: de
  text: An jenem Tag wird es im Land Ägypten fünf Städte geben, die die Sprache Kanaans sprechen und beim HERRN der Heerscharen schwören. Eine von ihnen wird »Stadt der Zerstörung«[a] genannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine alte hebräische Lesart lautet: »Stadt der Sonne«.'
    reason: 'Textkritische Variante: הַחֶרֶס (»der Sonne«) statt des masoretischen הַהֶרֶס (»der Zerstörung«).'
lexical_decisions:
- source_word: שְׂפַת כְּנַעַן
  choice: die Sprache Kanaans
  rationale: Wörtlich »die Lippe Kanaans«; im Hebräischen bezeichnet »Lippe« hier die Sprache. Die natürliche deutsche Wiedergabe bewahrt den geografisch-kulturellen Bezug.
- source_word: וְנִשְׁבָּעוֹת לַיהוָה
  choice: und beim HERRN … schwören
  rationale: Die Verbindung von שׁבע mit ל kann das Schwören bei beziehungsweise auf JHWH ausdrücken. »Beim HERRN schwören« bleibt nahe am Wortlaut und vermeidet, die Aussage ausschließlich als ausdrücklichen Treueeid auszulegen, obwohl der Kontext Zugehörigkeit und Loyalität nahelegt.
- source_word: יְהוָה צְבָאוֹת
  choice: HERR der Heerscharen
  rationale: Der Gottesname wird entsprechend deutscher Bibelkonvention als HERR kenntlich gemacht; »Heerscharen« gibt צְבָאוֹת würdevoll und traditionsbewusst wieder, ohne es auf menschliche Armeen zu verengen.
- source_word: עִיר הַהֶרֶס
  choice: Stadt der Zerstörung
  rationale: Dies entspricht dem Konsonantentext und der Vokalisierung des WLC/masoretischen Textes. Die abweichende alte Lesart »Stadt der Sonne« wird wegen ihrer textkritischen Bedeutung in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung des Schwörens gegenüber JHWH
  choice: beim HERRN der Heerscharen schwören
  alternative: dem HERRN der Heerscharen Treue schwören
  rationale: Der Zusammenhang deutet auf Hinwendung und Loyalität zu JHWH, doch der hebräische Ausdruck benennt nicht ausdrücklich »Treue«. Die gewählte Fassung wahrt diese Offenheit.
- issue: Name der einen ägyptischen Stadt
  choice: Stadt der Zerstörung
  alternative: Stadt der Sonne
  rationale: Die Hauptfassung folgt dem vorgegebenen WLC. Da eine alte hebräische Textüberlieferung nur einen Konsonanten abweichend liest und daraus ein deutlich anderer Name entsteht, wird die Alternative transparent dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und gut vorlesbar; »An jenem Tag« und »HERR der Heerscharen« bewahren den prophetischen und kultischen Ton. Die Fußnote markiert die bedeutsame Textvariante, ohne den Haupttext unnötig zu belasten.
