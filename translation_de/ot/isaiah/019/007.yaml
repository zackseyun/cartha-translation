source:
  edition: WLC
  text: עָר֥וֹת עַל יְא֖וֹר עַל פִּ֣י יְא֑וֹר וְ/כֹל֙ מִזְרַ֣ע יְא֔וֹר יִיבַ֥שׁ נִדַּ֖ף וְ/אֵינֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/007.yaml
  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
translation:
  language: de
  text: Die Uferpflanzen am Nil[a], am Rand des Nils und alles, was am Nil gesät wird[b], werden vertrocknen, verweht werden und nicht mehr da sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die kahlen Stellen“ beziehungsweise „die Wiesen am Nil“. Das hebräische Wort עָרוֹת ist an dieser Stelle unsicher; im Zusammenhang liegt eine Bezeichnung für den Bewuchs am Flussufer nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedes Saatfeld des Nils“. Die hebräische Wendung kann die Saat, das Gesäte oder die Anbauflächen am Nil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  choice: Uferpflanzen
  rationale: Das seltene und hier unsichere Wort bezeichnet im Zusammenhang wahrscheinlich den Bewuchs am Flussufer. „Uferpflanzen“ bewahrt diese ökologische Bedeutung, ohne die Pflanzenart enger als der hebräische Text festzulegen.
- source_word: יְאֹר
  choice: Nil
  rationale: Im ägyptischen Kontext bezeichnet das Wort den Nil beziehungsweise sein Gewässersystem; „Nil“ macht den gemeinten Fluss unmittelbar erkennbar.
- source_word: עַל פִּי יְאֹר
  choice: am Rand des Nils
  rationale: Das wörtliche „am Mund des Nils“ ist hier eine räumliche Wendung für den Rand beziehungsweise das Ufer eines Wasserlaufs.
- source_word: כֹל מִזְרַע יְאֹר
  choice: alles, was am Nil gesät wird
  rationale: מִזְרַע kann Saat, Aussaat oder das Gesäte bezeichnen. Die verbale Formulierung lässt die genaue Referenz offen und gibt zugleich die vom Nil abhängige Landwirtschaft natürlich wieder.
- source_word: יִיבַשׁ
  choice: wird vertrocknen
  rationale: Das Verb bezeichnet das Trockenwerden; „vertrocknen“ passt sowohl zu Pflanzen als auch zur Saat im Zusammenhang des versiegenden Nils.
- source_word: נִדַּף
  choice: verweht werden
  rationale: Die Niphal-Form bezeichnet ein Getrieben- oder Fortgewehtwerden. „Verweht werden“ erhält das konkrete Bild ausgetrockneter, vom Wind fortgetragener Vegetation oder Saat.
- source_word: וְאֵינֶנּוּ
  choice: und nicht mehr da sein
  rationale: Die Wendung drückt vollständiges Verschwinden beziehungsweise Nichtmehrvorhandensein aus und wird so in natürlichem modernem Deutsch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Nil“ bildet die eindringliche Struktur des Hebräischen ab. Die unsichere Pflanzenbezeichnung wird im Haupttext nicht unnötig auf „Schilf“ verengt; die Alternativen stehen in der Fußnote.
