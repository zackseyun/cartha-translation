  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: de
  text: Und Ägyptens Geist wird in ihm versiegen, und ich werde seinen Rat verschlingen. Dann werden sie die Götzen befragen, die Geister[a], die Totenbeschwörer und die Wahrsager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des seltenen hebräischen Wortes ist unsicher; auch „Flüsterer“, „Murmler“ oder „Beschwörer“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבְקָה
  choice: wird … ausgezehrt werden
  rationale: Das Nifal bezeichnet ein Leerwerden bzw. inneres Aufgebrauchtwerden. „Ausgezehrt werden“ bewahrt das Bild innerer Entkräftung, ohne es auf bloße Mutlosigkeit zu verengen.
- source_word: רוּחַ מִצְרַיִם בְּקִרְבּוֹ
  choice: Ägyptens Geist … in seinem Innern
  rationale: „Geist“ erhält die Weite des hebräischen רוּחַ als innere Lebenskraft oder Haltung. Das maskuline Pronomen folgt der deutschen Benennung „Ägypten“ und bezeichnet das Land als kollektive Größe.
- source_word: עֲצָתוֹ אֲבַלֵּעַ
  choice: ich werde seinen Rat verschlingen
  rationale: „Rat“ kann Beratung, Plan und Strategie umfassen. „Verschlingen“ bewahrt die konkrete Metapher von בלע, statt sie deutend durch „vereiteln“ oder „verwirren“ zu ersetzen.
- source_word: וְדָרְשׁוּ אֶל
  choice: Dann werden sie … befragen
  rationale: דרשׁ mit אֶל bezeichnet hier das suchende Konsultieren übernatürlicher Instanzen. „Befragen“ ist im Deutschen natürlicher und im divinatorischen Zusammenhang genauer als das allgemeinere „suchen“.
- source_word: הָאֱלִילִים
  choice: die Götzen
  rationale: „Götzen“ gibt den abwertenden Sinn des hebräischen Ausdrucks knapp und geläufig wieder.
- source_word: הָאִטִּים
  choice: die Beschwörer
  rationale: Der seltene Ausdruck ist unsicher. „Beschwörer“ passt zum okkulten Zusammenhang und lässt sich möglicherweise mit einem murmelnden oder flüsternden Vollzug verbinden; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: הָאֹבוֹת
  choice: die Totengeister
  rationale: אוֹבוֹת kann die herbeigerufenen Geister der Toten oder metonymisch die sie befragenden Medien bezeichnen. „Totengeister“ hält hier die mögliche Bezeichnung der konsultierten Wesen fest und vermeidet eine unnötige Gleichsetzung mit dem folgenden Praktikerausdruck.
- source_word: הַיִּדְּעֹנִים
  choice: die Totenbeschwörer
  rationale: Der Ausdruck bezeichnet Personen, die mit verborgenem Geisterwissen verbunden sind. „Totenbeschwörer“ ist gegenwärtig verständlich und passt in den Zusammenhang verbotener Totenbefragung, ohne das altertümliche „Wahrsager“ oder „Zauberer“ aufzuzwingen.
theological_decisions:
- issue: Wiedergabe der okkulten Bezeichnungen und ihrer teilweise unsicheren Referenz
  choice: Eine moderne Reihe aus „Götzen“, „Beschwörern“, „Totengeistern“ und „Totenbeschwörern“, ergänzt um eine Fußnote beim seltenen הָאִטִּים
  alternative: Alle Ausdrücke als menschliche Praktiker wiedergeben, etwa „Götzen, Flüsterer, Totenbeschwörer und Wahrsager“, oder אוֹבוֹת mit „Medien“ übersetzen
  rationale: Der hebräische Text kann sowohl konsultierte Geistwesen als auch die dazugehörigen Praktiker bezeichnen. Die Übersetzung bewahrt diese Spannung, kennzeichnet die größte lexikalische Unsicherheit und vermeidet zusätzliche konfessionelle Festlegungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Bildsprache. „Ausgezehrt“ und „verschlingen“ geben die kräftigen Metaphern des Hebräischen wieder; die Aufzählung bleibt knapp und prophetisch zugespitzt.
