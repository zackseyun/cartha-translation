  naturalness: „Ägyptens Geist wird in ihm versiegen“ ist modernes, würdiges Deutsch und bewahrt das Bild innerer Entleerung. „Sie werden … befragen“ passt zu allen vier Objekten und zum Kontext der Konsultation. Die knappe Aufzählung bleibt prophetisch und gut lesbar.
  terminology: „Götzen“ gibt den abwertenden Charakter von אֱלִילִים angemessen wieder. „Geister“ für das seltene אִטִּים bleibt mit Fußnote als vorsichtige Hauptlesart vertretbar. „Totenbeschwörer“ für אֹבוֹת und „Wahrsager“ für יִּדְּעֹנִים geben die traditionellen, kontextuell passenden Bezeichnungen wieder, ohne eine bestimmte Lehre über die ontologische Wirklichkeit der genannten Praktiken vorauszusetzen.
