  text: וְ/הֶאֶזְנִ֣יחוּ נְהָר֔וֹת דָּלֲל֥וּ וְ/חָרְב֖וּ יְאֹרֵ֣י מָצ֑וֹר קָנֶ֥ה וָ/ס֖וּף קָמֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: de
  text: Die Flüsse werden stinken[a]; die Kanäle Ägyptens werden seicht werden und austrocknen[b]; Schilfrohr und Binse[c] werden verwelken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden faulig werden“. Das hebräische Verb ist selten; gemeint ist wahrscheinlich, dass die Gewässer faulig werden und übel riechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Kanäle von Matzor“. „Matzor“ ist hier wohl eine poetische Bezeichnung für Ägypten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Papyrus“. Das hebräische Wort bezeichnet Sumpfvegetation an Flussufern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: werden stinken
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich das Fauligwerden beziehungsweise den üblen Geruch der Gewässer. „Stinken“ ist knapp, natürlich und bewahrt die drastische Bildsprache.
- source_word: נְהָרוֹת
  choice: die Flüsse
  rationale: Die übliche Wiedergabe des Plurals bezeichnet Flüsse oder größere Wasserläufe und bildet einen natürlichen Gegensatz zu den nachfolgend genannten Kanälen.
- source_word: דָּלֲלוּ
  choice: werden seicht werden
  rationale: Das Verb beschreibt ein Dünn-, Schwach- oder Niedrigwerden. Bei Gewässern gibt „seicht werden“ das Sinken des Wasserstands anschaulich wieder.
- source_word: וְחָרְבוּ
  choice: austrocknen
  rationale: Bei Wasserläufen bezeichnet das Verb das Trockenwerden; „austrocknen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: יְאֹרֵי
  choice: die Kanäle
  rationale: Im ägyptischen Zusammenhang bezeichnet יְאֹר besonders Nil- oder Bewässerungskanäle; „Kanäle“ wahrt diese örtliche Färbung.
- source_word: מָצוֹר
  choice: Ägyptens
  rationale: מָצוֹר ist hier am besten als poetische Bezeichnung für Ägypten zu verstehen, nicht in seiner sonst möglichen Bedeutung „Belagerung“.
- source_word: קָנֶה
  choice: Schilfrohr
  rationale: Der Ausdruck bezeichnet rohrartige Ufervegetation. „Schilfrohr“ ist im Deutschen konkret und unterscheidet die Pflanze von der folgenden Binse.
- source_word: וָסוּף
  choice: Binse
  rationale: סוּף bezeichnet Sumpf- oder Ufervegetation. „Binse“ erhält die Unterscheidung von קָנֶה; „Papyrus“ bleibt eine mögliche, jedoch spezifischere Deutung.
- source_word: קָמֵלוּ
  choice: werden verwelken
  rationale: Das Verb bezeichnet das Welken oder Verdorren von Pflanzen. „Verwelken“ passt zu beiden Pflanzennamen und vermeidet eine Wiederholung von „austrocknen“.
