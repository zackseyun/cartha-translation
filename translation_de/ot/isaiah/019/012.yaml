  variant: modern standard German
source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: de
  text: Wo sind denn deine Weisen? Sie sollen dir doch sagen und erkennen, was Jahwe der Heerscharen gegen Ägypten beschlossen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיָּם אֵפוֹא
  choice: Wo sind denn
  rationale: Die Ortsfrage mit der hervorhebenden Folgerungspartikel wird als natürlicher, spöttisch-herausfordernder Fragesatz wiedergegeben.
- source_word: חֲכָמֶיךָ
  choice: deine Weisen
  rationale: Bezeichnet Ägyptens weise Ratgeber, ohne ihre Funktion enger als Magier oder Hofbeamte festzulegen.
- source_word: וְיַגִּידוּ נָא לָךְ
  choice: Sie sollen dir doch sagen
  rationale: Die Aufforderungsnuance der Verbform und die rhetorisch drängende, hier spöttische Wirkung von נָא werden mit „sollen“ und „doch“ natürlich ausgedrückt.
- source_word: וְיֵדְעוּ
  choice: und erkennen
  rationale: Bewahrt die koordinierte zweite Aufforderung und gibt ידע hier als Einsicht in Jahwes Ratschluss wieder.
- source_word: מַה יָּעַץ
  choice: was ... beschlossen hat
  rationale: יעץ bezeichnet hier den gefassten Plan oder Ratschluss; „beschlossen hat“ bewahrt die Abgeschlossenheit und Entschiedenheit.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ ist im Deutschen eine verständliche, würdige und etablierte Wiedergabe des Titels, ohne ihn auf irdische Armeen zu verengen.
- source_word: עַל מִצְרָיִם
  choice: gegen Ägypten
  rationale: Im Gerichtszusammenhang trägt עַל bei יעץ feindliche Zielrichtung; „gegen“ bringt diese Nuance klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Armeen
  rationale: „Heerscharen“ lässt den Umfang der צְבָאוֹת offen und umfasst himmlische wie militärische Mächte; „Armeen“ wäre transparenter, könnte im Deutschen aber zu eng rein irdisch verstanden werden.
- issue: Bezug von עַל im göttlichen Ratschluss
  choice: gegen Ägypten
  alternative: über Ägypten / im Blick auf Ägypten
  rationale: Der unmittelbare Gerichtskontext stützt die feindliche Zielrichtung, während die grundsätzlich mögliche neutralere Bedeutung nicht in den Haupttext aufgenommen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Herausforderung wird durch „denn“ und „doch“ hörbar gemacht; der Satz bleibt knapp und bewahrt die Parallelität von Sagen und Erkennen.
