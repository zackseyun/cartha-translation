  text: בַּ/יּ֣וֹם הַ/ה֗וּא תִּהְיֶ֨ה מְסִלָּ֤ה מִ/מִּצְרַ֨יִם֙ אַשּׁ֔וּרָ/ה וּ/בָֽא אַשּׁ֥וּר בְּ/מִצְרַ֖יִם וּ/מִצְרַ֣יִם בְּ/אַשּׁ֑וּר וְ/עָבְד֥וּ מִצְרַ֖יִם אֶת אַשּֽׁוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: de
  text: An jenem Tag wird es eine Straße von Ägypten nach Assyrien geben. Assyrien wird nach Ägypten kommen und Ägypten nach Assyrien[a]; und Ägypten wird Assyrien dienen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen fehlt im zweiten Satzteil das Verb; sinngemäß: „und Ägypten wird nach Assyrien kommen“.'
    reason: ellipsis
  - marker: b
    text: Der hebräischen Satzform entsprechend ist Assyrien das direkte Objekt. Im Zusammenhang von Vers 24–25 wird die Aussage auch als Bild dafür verstanden, dass Ägypten und Assyrien gemeinsam Gott dienen.
    reason: alternative_reading
lexical_decisions:
- source_word: מְסִלָּה
  choice: Hochstraße
  rationale: Das Wort bezeichnet eine aufgeschüttete beziehungsweise ausgebaute Straße und trägt hier das Bild einer offenen Verbindung zwischen den Völkern. „Hochstraße“ bewahrt dieses Bild würdig und verständlich.
- source_word: מִמִּצְרַיִם אַשּׁוּרָה
  choice: von Ägypten nach Assyrien
  rationale: Die Präpositionen bezeichnen Ausgangspunkt und Richtung; diese Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: Die Assyrer werden nach Ägypten kommen
  rationale: בוא mit ב bezeichnet die Bewegung in ein Gebiet hinein. Der kollektive Ländername wird im Deutschen idiomatisch durch die Bewohner wiedergegeben.
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: und die Ägypter nach Assyrien
  rationale: Das Verb „kommen“ ist aus dem vorhergehenden Satzglied zu ergänzen. Die knappe Form wahrt den hebräischen Parallelismus und bleibt im Deutschen verständlich.
- source_word: וְעָבְדוּ
  choice: werden dienen
  rationale: עבד kann allgemein „dienen“ und im religiösen Zusammenhang auch „Gottesdienst leisten/anbeten“ bedeuten. „Dienen“ bewahrt die lexikalische Weite und vermeidet eine vorschnelle Festlegung.
- source_word: מִצְרַיִם אֶת־אַשּׁוּר
  choice: die Ägypter werden zusammen mit den Assyrern dienen
  rationale: אֵת kennzeichnet gewöhnlich ein direktes Objekt, sodass formal auch „Ägypten wird Assyrien dienen“ möglich ist. Der Zusammenhang von Vers 23 sowie 24–25 stellt jedoch die gemeinsame Hinwendung und Segnung beider Völker heraus. „Zusammen mit“ gibt diese wahrscheinlichere kontextuelle Deutung wieder; die syntaktisch nähere Alternative wird in einer Fußnote erhalten.
theological_decisions:
- issue: Deutung von וְעָבְדוּ מִצְרַיִם אֶת־אַשּׁוּר
  choice: gemeinsamer Dienst Ägyptens und Assyriens
  alternative: Ägypten wird Assyrien dienen
  rationale: Die unmittelbare Syntax lässt Assyrien als direktes Objekt erscheinen. Der größere Zusammenhang schildert aber nicht politische Unterwerfung, sondern Verbindung und gemeinsamen Segen für Ägypten und Assyrien. Der Haupttext folgt daher der kontextuell wahrscheinlicheren Lesart, während die echte grammatische Spannung in der Fußnote offengelegt wird.
- issue: Religiöse Bedeutung von עבד
  choice: dienen
  alternative: anbeten / Gottesdienst leisten
  rationale: Der Kontext kann einen religiösen Dienst an Gott nahelegen, doch das Verb selbst ist weiter. „Dienen“ bewahrt diese Mehrdeutigkeit, ohne den kultischen Sinn auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Völkernamen werden bei handelnden Subjekten idiomatisch als „Assyrer“ und „Ägypter“ wiedergegeben. Der Satzbau hält den prophetischen Parallelismus fest; Fußnoten bewahren Ellipse und syntaktisch-theologische Mehrdeutigkeit.
