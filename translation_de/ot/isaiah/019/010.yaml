  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
translation:
  language: de
  text: Und ihre Grundfesten werden zerschlagen sein[a]; alle, die für Lohn arbeiten, werden tief betrübt sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist unsicher. Statt „Grundfesten“ sind auch „Stützen“ oder, nach einer anderen Deutung, „Weber“ vorgeschlagen worden.
    reason: alternative_reading
  - marker: b
    text: Der letzte Ausdruck ist im Hebräischen dunkel. Wörtlich lautet er etwa „Teiche der Seele“ oder „Sümpfe des Lebens/Verlangens“; wahrscheinlich bezeichnet er tiefe innere Niedergeschlagenheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: ihre Grundfesten
  rationale: Das seltene und umstrittene Wort wird von einer Wurzel im Sinn von „setzen, gründen“ her verstanden. „Grundfesten“ bewahrt das Bild tragender Grundlagen; andere Deutungen stehen in der Fußnote.
- source_word: מְדֻכָּאִים
  choice: werden zerschlagen sein
  rationale: Das passive Partizip von דכא bezeichnet einen zerschlagenen oder niedergebrochenen Zustand. Zusammen mit וְהָיוּ wird die angekündigte Folge wiedergegeben.
- source_word: כָּל
  choice: alle
  rationale: Die distributive Bedeutung bezieht die Aussage auf die gesamte folgende Personengruppe.
- source_word: עֹשֵׂי שֶׂכֶר
  choice: die für Lohn arbeiten
  rationale: Die wörtliche Verbindung „Macher/Täter von Lohn“ bezeichnet im Zusammenhang Menschen, die gegen Bezahlung arbeiten. Die deutsche Formulierung ist natürlich und quellennah.
- source_word: אַגְמֵי נָפֶשׁ
  choice: tief betrübt
  rationale: Die masoretische Wortfolge ist dunkel und lautet wörtlich etwa „Teiche/Sümpfe der Seele/des Lebens“. Im wirtschaftlichen Zusammenhang liegt eine Bezeichnung tiefer Niedergeschlagenheit nahe; die Unsicherheit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon bildet die zweiteilige Versstruktur ab. Die beiden echten textlich-lexikalischen Unsicherheiten werden nicht im Haupttext ausgebreitet, sondern transparent in Fußnoten ausgewiesen.
