reference: Isaiah 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: de
  text: 'Ausspruch über Ägypten:[a]


    Siehe, Jahwe reitet auf einer schnellen Wolke und kommt nach Ägypten. Die Götzen Ägyptens werden vor ihm erbeben,[b] und das Herz Ägyptens wird in seinem Innern zerschmelzen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Last über Ägypten“ oder „Kundspruch über Ägypten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von seinem Angesicht“ beziehungsweise „von seiner Gegenwart“; gemeint ist: vor ihm, angesichts seiner Gegenwart.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische behandelt Ägypten als eine grammatisch männliche Einheit; daher auch möglich: „in ihm“ beziehungsweise sachlich „in seinem Inneren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige göttliche Kundgabe. „Ausspruch“ ist im modernen Deutschen würdig und verständlich; die mögliche Nuance „Last“ wird in der Fußnote bewahrt.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Ägypten
  rationale: Die übliche deutsche Wiedergabe des Ländernamens.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das Wort lenkt die Aufmerksamkeit auf das unmittelbar geschilderte prophetische Geschehen. „Siehe“ erhält den gehobenen, eindringlichen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רֹכֵב עַל עָב קַל
  choice: reitet auf einer schnellen Wolke
  rationale: Das Partizip zeichnet eine lebendige Szene; קַל bezeichnet hier die Leichtigkeit beziehungsweise Schnelligkeit der Wolke. Die theophanische Bildsprache bleibt unverändert erhalten.
- source_word: וּבָא
  choice: und kommt
  rationale: Die mit dem Partizip verbundene Form stellt das Kommen anschaulich als gegenwärtig beziehungsweise unmittelbar bevorstehend dar.
- source_word: וְנָעוּ
  choice: Da wanken
  rationale: Das Verb bezeichnet ein Schwanken oder Erschüttertwerden. „Wanken“ wahrt die körperliche Bildlichkeit, ohne ausdrücklich eine Emotion wie Furcht hinzuzufügen.
- source_word: אֱלִילֵי
  choice: die Götzen
  rationale: „Götzen“ bezeichnet im Deutschen klar die fremden Kultbilder beziehungsweise Gottheiten und trägt wie das hebräische Wort eine abwertende Nuance.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von seinem Angesicht weg“ und bezeichnet hier die Wirkung seiner Gegenwart. „Vor ihm“ ist knapp und natürlich; der wörtlichere Sinn steht in der Fußnote.
- source_word: וּלְבַב מִצְרַיִם
  choice: und Ägyptens Herz
  rationale: Die Formulierung erhält die Personifikation des Landes und das Bild des Herzens als Sitz von Mut und innerer Kraft.
- source_word: יִמַּס
  choice: zerschmilzt
  rationale: Das hebräische Verb verwendet das konkrete Bild des Schmelzens für den Zusammenbruch von Mut und innerer Festigkeit. „Zerschmilzt“ bewahrt dieses starke Bild.
- source_word: בְּקִרְבּוֹ
  choice: in seinem Innern
  rationale: Das maskuline singularische Suffix bezieht sich auf das personifizierte Ägypten. „In seinem Innern“ wahrt diese grammatische Personifikation, ohne einen individuellen männlichen Referenten anzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bild von Jahwe als Wolkenreiter
  choice: Die theophanische Bildsprache wird direkt beibehalten.
  alternative: Eine entbildlichte Paraphrase wie „Jahwe nähert sich schnell“.
  rationale: Der hebräische Text beschreibt Jahwes Kommen ausdrücklich als Ritt auf einer Wolke. Eine abstrakte Paraphrase würde das poetische und theologische Bild abschwächen.
- issue: Bezug des Suffixes in בְּקִרְבּוֹ
  choice: 'Bezug auf das als Einheit personifizierte Ägypten: „in seinem Innern“'
  alternative: 'Sachlicher Bezug auf das Land: „in seinem Inneren“ beziehungsweise „in ihm“'
  rationale: Das Hebräische behandelt Ägypten grammatisch als maskuline singularische Größe. Die Übersetzung erhält diese Personifikation; die sachlichere deutsche Möglichkeit wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-poetischem Ton. Die kurzen Hauptsätze und die konkreten Bilder des Hebräischen bleiben erhalten. „Siehe“ und „Jahwe“ tragen den gehobenen biblischen Registerton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben.
