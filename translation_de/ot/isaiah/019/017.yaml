  text: וְ֠/הָיְתָה אַדְמַ֨ת יְהוּדָ֤ה לְ/מִצְרַ֨יִם֙ לְ/חָגָּ֔א כֹּל֩ אֲשֶׁ֨ר יַזְכִּ֥יר אֹתָ֛/הּ אֵלָ֖י/ו יִפְחָ֑ד מִ/פְּנֵ֗י עֲצַת֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא יוֹעֵ֥ץ עָלָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: de
  text: Das Land Juda wird für Ägypten zum Schrecken[a]. Jeder, dem Juda erwähnt wird[b], wird sich fürchten wegen des Plans Jahwes der Heere[c], den er gegen Ägypten plant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zum Grauen“ oder „zum Taumeln“. Das hebräische Wort ist selten und in seiner Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung ist stark verdichtet. Gemeint ist, dass jeder, dem Juda erwähnt wird, sich fürchtet.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionelle Wiedergabe: „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: das Land Juda
  rationale: אַדְמָה kann Erdboden oder Land bezeichnen; im geopolitischen Zusammenhang ist „das Land Juda“ die natürliche deutsche Wiedergabe.
- source_word: לְחָגָּא
  choice: zum Schrecken
  rationale: Das seltene und schwierige Substantiv bezeichnet im Zusammenhang etwas, das Furcht auslöst. „Zum Schrecken“ entspricht zudem der Ergebniskonstruktion mit לְ.
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: Jeder, dem gegenüber Juda erwähnt wird
  rationale: 'Die verdichtete hebräische Formulierung wird distributiv verstanden: Jeder, der von Juda hört, fürchtet sich. Die Wiedergabe ist im Deutschen verständlich, ohne die syntaktische Schwierigkeit zu verdecken; eine wörtlichere Alternative steht in der Fußnote.'
- source_word: מִפְּנֵי עֲצַת
  choice: wegen des Plans
  rationale: מִפְּנֵי bezeichnet hier den Grund, עֵצָה den beschlossenen Plan beziehungsweise Ratschluss.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heere“ übersetzt צְבָאוֹת in gegenwärtig verständlicher Sprache und bewahrt die machtvolle, militärische Bildwelt des Titels.
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: den er gegen Ägypten plant
  rationale: Das Partizip יוֹעֵץ bezeichnet das gefasste beziehungsweise im Vollzug begriffene Planen. Der maskuline Suffixbezug weist im Kontext auf Ägypten; die Wiederaufnahme des Verbs „plant“ bewahrt die Wortfigur mit „Plan“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als solchen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Gottestitels צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen
  rationale: „Der Heere“ ist für heutige Leser unmittelbar verständlich; „der Heerscharen“ ist die traditionelle, aber altertümlichere Form.
- issue: Bezugswort des abschließenden Pronomens עָלָיו
  choice: gegen Ägypten
  alternative: gegen es
  rationale: Das maskuline hebräische Pronomen bezieht sich im Zusammenhang auf Ägypten. Die ausdrückliche Wiederholung verhindert im Deutschen einen missverständlichen Bezug auf den Plan oder Juda.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am prophetischen Ausgangstext, wird jedoch dort geglättet, wo eine formale Nachbildung im Deutschen missverständlich wäre. Die Wiederholung „Plan … plant“ ist bewusst beibehalten, weil sie die hebräische Wortverwandtschaft von עֵצָה und יוֹעֵץ spiegelt.
