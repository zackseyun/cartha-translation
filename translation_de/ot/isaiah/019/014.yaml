base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: de
  text: Jahwe hat in Ägyptens Mitte einen Geist der Verwirrung hineingemischt[a], und sie haben Ägypten in all seinem Tun in die Irre geführt[b] – wie ein Betrunkener in seinem Erbrochenen taumelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Geist der Verdrehung“, „einen Geist der Verkehrtheit“ oder „einen Geist des Taumels“. Der hebräische Ausdruck bezeichnet einen desorientierenden, verdrehenden Einfluss, der als Gericht gesandt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb steht in der Mehrzahl: „und sie haben Ägypten in die Irre geführt“. Wer mit „sie“ gemeint ist, wird nicht ausdrücklich gesagt; gemeint sein können die verwirrenden Einflüsse oder Ägyptens Führer unter deren Einfluss.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָסַךְ
  choice: hineingemischt
  rationale: Das Verb bezeichnet gewöhnlich das Mischen oder Vermengen, besonders von Flüssigkeiten. „Hineingemischt“ bewahrt das konkrete Bild und bezeichnet hier bildlich das Einbringen eines verwirrenden Einflusses.
- source_word: בְּקִרְבָּהּ
  choice: in Ägyptens Mitte
  rationale: Der feminine Suffixbezug gilt Ägypten als Land oder Nation. Da „Ägypten“ im Deutschen sächlich ist, wahrt die Wiederaufnahme des Namens den Bezug natürlicher als ein künstliches „in ihrer Mitte“.
- source_word: רוּחַ עִוְעִים
  choice: einen Geist der Verwirrung
  rationale: רוּחַ bezeichnet hier einen wirksamen Einfluss oder eine innere Haltung; עִוְעִים vermittelt die Vorstellung von Verdrehung, Verkehrtheit und Desorientierung. „Verwirrung“ gibt im Kontext vor allem die desorientierende Wirkung wieder.
- source_word: וְהִתְעוּ
  choice: und sie haben … in die Irre geführt
  rationale: Die kausative Bedeutung und die grammatische Mehrzahl des Verbs werden beibehalten. Wer mit „sie“ gemeint ist, bleibt wie im hebräischen Text offen.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: bei allem, was es tut
  rationale: Die Wendung umfasst Ägyptens gesamtes Handeln und alle seine Unternehmungen. Die deutsche sächliche Form entspricht dem Genus des Ländernamens.
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: wie ein Betrunkener … taumelt
  rationale: Die Vergleichskonstruktion beschreibt die orientierungslose Bewegung eines Betrunkenen. „Taumelt“ gibt das Bild in natürlichem Deutsch prägnant wieder.
- source_word: בְּקִיאוֹ
  choice: in seinem Erbrochenen
  rationale: Das drastische Bild des hebräischen Textes wird ungemildert bewahrt.
theological_decisions:
- issue: Göttliches Handeln beim Geist der Verwirrung
  choice: Jahwe mischt den verwirrenden Geist in Ägyptens Mitte hinein.
  alternative: Jahwe lässt Verwirrung in Ägypten entstehen.
  rationale: Der hebräische Text schreibt Jahwe die Handlung ausdrücklich zu. Die Übersetzung bewahrt diese starke Aussage, ohne über das Verhältnis von direkter Verursachung und Zulassung hinauszugehen.
- issue: Subjekt des pluralischen Verbs וְהִתְעוּ
  choice: Die Mehrzahl „sie haben … in die Irre geführt“ wird bewahrt.
  alternative: „Er hat Ägypten in die Irre geführt“ oder „Ägypten wurde in die Irre geführt“.
  rationale: Das masoretische Verb steht in der dritten Person Plural, doch sein Subjekt ist nicht ausdrücklich genannt. Die Übersetzung löst diese mögliche Bezugnahme auf verwirrende Einflüsse oder auf Ägyptens Führer nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche, konkrete Mischbild sowie das drastische Schlussbild bleiben erhalten. Die syntaktische Mehrdeutigkeit des pluralischen Verbs wird im Haupttext bewahrt und in der Fußnote erläutert.
