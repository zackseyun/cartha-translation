  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֤ה יִשְׂרָאֵל֙ שְׁלִ֣ישִׁיָּ֔ה לְ/מִצְרַ֖יִם וּ/לְ/אַשּׁ֑וּר בְּרָכָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: de
  text: An jenem Tag wird Israel zusammen mit Ägypten und Assyrien ein Drittes sein, ein Segen mitten auf der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mitten im Land«. Das hebräische Wort kann sowohl »Erde« als auch »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird im modernen Deutschen natürlich und würdevoll wiedergegeben.
- source_word: יִהְיֶה
  choice: wird … sein
  rationale: Das hebräische Imperfekt bezeichnet hier im prophetischen Zusammenhang ein zukünftiges Geschehen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form beibehalten.
- source_word: שְׁלִישִׁיָּה
  choice: das dritte Volk
  rationale: Das substantivisch gebrauchte Zahlwort stellt Israel als drittes Mitglied neben Ägypten und Assyrien dar. „Volk“ macht den im Kontext vorausgesetzten Bezug im Deutschen verständlich, ohne die Dreiergruppe umzudeuten.
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: neben Ägypten und Assyrien
  rationale: Die Präposition לְ bezeichnet hier die Zuordnung zu einer Gruppe; „neben“ gibt Israels Stellung als drittes Mitglied natürlich wieder.
- source_word: בְּרָכָה
  choice: ein Segen
  rationale: Die direkte substantivische Wiedergabe bewahrt sowohl den prädikativen Sinn als auch den möglichen bundestheologischen Anklang, ohne „Quelle des Segens“ hinzuzufügen.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: mitten auf der Erde
  rationale: בְּקֶרֶב wird räumlich als „mitten auf“ wiedergegeben. Angesichts des internationalen Zusammenhangs ist „Erde“ im Haupttext vorzuziehen; „Land“ bleibt lexikalisch möglich.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Die Verbindung Israels mit Ägypten und Assyrien legt einen weltweiten Horizont nahe. Da הָאָרֶץ jedoch ebenso „das Land“ bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Formulierung „das dritte Volk“ verdeutlicht die substantivische Ordnungszahl; die Mehrdeutigkeit von הָאָרֶץ wird nicht stillschweigend aufgehoben, sondern durch die Fußnote erhalten.
