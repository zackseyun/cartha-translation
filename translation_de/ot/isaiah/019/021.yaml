source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: de
  text: Und Jahwe wird sich Ägypten zu erkennen geben[a], und Ägypten wird Jahwe an jenem Tag erkennen. Sie werden ihm mit Schlachtopfern und Speisopfern dienen[b], und sie werden Jahwe ein Gelübde ablegen und es erfüllen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird Ägypten bekannt werden.“ Das hebräische Verb kann auch stärker passiv beziehungsweise inchoativ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „Sie werden mit Schlachtopfer und Speisopfer dienen.“ Das Verb kann sowohl „dienen“ als auch im kultischen Sinn „verehren“ oder „Gottesdienst halten“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sie werden ein Gelübde geloben und es erfüllen.“ Die Verbindung von Verb und stammverwandtem Substantiv verleiht der Aussage Nachdruck.'
    reason: source_form
lexical_decisions:
- source_word: וְנוֹדַע
  choice: wird sich zu erkennen geben
  rationale: Das Nifal von ידע kann passiv („wird bekannt sein“) oder reflexiv im Sinn göttlicher Selbstoffenbarung verstanden werden. Die gewählte Formulierung ist natürlich und lässt Jahwe als den erkennen, der sich Ägypten erschließt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: לְמִצְרַיִם
  choice: Ägypten
  rationale: Die Präposition ל bezeichnet hier den Empfänger der Offenbarung; im Deutschen wird dies idiomatisch durch „sich Ägypten zu erkennen geben“ ausgedrückt.
- source_word: וְיָדְעוּ מִצְרַיִם אֶת־יְהוָה
  choice: und Ägypten wird Jahwe erkennen
  rationale: מִצְרַיִם steht kollektiv für das Land beziehungsweise sein Volk. Die Wiederholung von „Ägypten“ und „Jahwe“ bewahrt die enge Entsprechung der beiden Satzteile.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: וְעָבְדוּ
  choice: sie werden ihm ... dienen
  rationale: עבד bedeutet „dienen“ und kann im kultischen Zusammenhang Gottesdienst beziehungsweise Verehrung bezeichnen. „Ihm dienen“ bewahrt die Grundbedeutung, während die folgenden Opferbegriffe den kultischen Sinn deutlich machen.
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer. „Schlachtopfer“ unterscheidet es präzise vom folgenden Speisopfer.
- source_word: וּמִנְחָה
  choice: Speisopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang gewöhnlich eine unblutige Opfergabe, besonders das Speisopfer. Der parallel genannte זֶבַח stützt diese kultische Bedeutung.
- source_word: וְנָדְרוּ נֵדֶר
  choice: sie werden ... ein Gelübde ablegen
  rationale: Die hebräische figura etymologica verstärkt den Ausdruck. Eine wörtliche Nachbildung wäre im modernen Deutschen schwerfällig; „ein Gelübde ablegen“ gibt den Sinn natürlich wieder.
- source_word: וְשִׁלֵּמוּ
  choice: und es erfüllen
  rationale: שלם bedeutet bei Gelübden, sie einzulösen beziehungsweise zu erfüllen. Das Objekt ist aus dem vorhergehenden „Gelübde“ ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von עבד im Opferzusammenhang
  choice: ihm mit Schlachtopfern und Speisopfern dienen
  alternative: ihn mit Schlachtopfern und Speisopfern anbeten
  rationale: Der Opferzusammenhang macht den kultischen Sinn deutlich, doch „dienen“ bewahrt zugleich die lexikalische Breite von עבד und legt die Bedeutung nicht ausschließlich auf „anbeten“ fest.
- issue: Göttliche Selbstoffenbarung in וְנוֹדַע
  choice: Jahwe wird sich Ägypten zu erkennen geben
  alternative: Jahwe wird Ägypten bekannt sein
  rationale: Die reflexive Wiedergabe bringt die im Kontext naheliegende Selbstoffenbarung zum Ausdruck; die mögliche passivere Lesart wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Parallelismus, ohne unnatürliche Hebraismen zu erzwingen. „Schlachtopfer“ und „Speisopfer“ sind sachlich präzise und im biblischen Register verständlich; „an jenem Tag“ wahrt den prophetischen Ton.
