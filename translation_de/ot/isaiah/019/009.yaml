base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: de
  text: Diejenigen, die gehechelten Flachs[a] verarbeiten, werden beschämt sein, ebenso die, die weißen Stoff[b] weben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feinen Flachs“. Das hebräische Wort bezeichnet wahrscheinlich besonders aufbereiteten, hochwertigen Flachs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weißem Leinen“. Gemeint ist wahrscheinlich weißes oder gebleichtes Gewebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: werden beschämt dastehen
  rationale: בוש bezeichnet hier die Beschämung, die aus Scheitern und wirtschaftlichem Untergang erwächst. „Beschämt dastehen“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: עֹבְדֵי
  choice: die Arbeiter, die … verarbeiten
  rationale: Das Partizip von עבד bezeichnet Menschen, die mit einem Material arbeiten. Die gewählte Formulierung ist idiomatisch und stellt den beruflichen Zusammenhang klar heraus.
- source_word: פִשְׁתִּים
  choice: Flachs
  rationale: Das Substantiv bezeichnet die Pflanze beziehungsweise den Rohstoff Flachs, aus dem Leinen hergestellt wird; es bezeichnet nicht unmittelbar das fertige Leinen.
- source_word: שְׂרִיקוֹת
  choice: gehechelten
  rationale: Der schwierige Ausdruck dürfte besonders aufbereiteten, hochwertigen Flachs bezeichnen. „Gehechelt“ benennt eine für Flachs typische Bearbeitung und wahrt den handwerklichen Zusammenhang.
- source_word: וְאֹרְגִים
  choice: ebenso die Weber
  rationale: Das Partizip von ארג bezeichnet Weber. „Ebenso“ macht deutlich, dass das Prädikat „werden beschämt dastehen“ auch für diese zweite parallele Gruppe gilt.
- source_word: חוֹרָי
  choice: von weißem Stoff
  rationale: Der seltene Ausdruck wird wahrscheinlich mit Weißsein beziehungsweise weißem oder gebleichtem Gewebe verbunden. „Weißer Stoff“ bleibt verständlich, ohne das Material mit Sicherheit als Leinen festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur der beiden Berufsgruppen bleibt erhalten; das nur einmal ausgedrückte Prädikat wird durch „ebenso“ auch auf die Weber bezogen. Fachsprachliches „gehechelt“ ist im Kontext der Flachsverarbeitung präzise und wird durch eine Fußnote abgesichert.
