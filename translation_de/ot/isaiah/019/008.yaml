  verdict: revise
  source_fidelity: Die Grundstruktur und die drei Gruppen der vom Niedergang Betroffenen sind zutreffend wiedergegeben. »Dahinsiechen« ist für אֻמְלָלוּ jedoch unnötig stark körperlich und zeitlich gefärbt; das Verb bezeichnet hier eher Mutlosigkeit, Erschlaffung bzw. Verzagtheit.
  naturalness: Die Übersetzung ist überwiegend natürlich. »ein Netz über der Wasserfläche ausspannen« ist verständlich, aber »über dem Wasser ausbreiten« ist idiomatischer. Die bisherige Fußnote b enthält zudem mit »werden kraftlos« keine vollständige und in diesem Zusammenhang keine gute deutsche Alternativformulierung.
  terminology: »Fischer«, »Angelhaken«, »Nil« und »Netz« sind sachgerecht. Die Nil-Fußnote wahrt die lexikalische Alternative, ohne den ägyptischen Kontext zu verwischen.
  issues:
