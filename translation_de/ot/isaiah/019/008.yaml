source:
  edition: WLC
  text: וְ/אָנוּ֙ הַ/דַּיָּגִ֔ים וְ/אָ֣בְל֔וּ כָּל מַשְׁלִיכֵ֥י בַ/יְא֖וֹר חַכָּ֑ה וּ/פֹרְשֵׂ֥י מִכְמֹ֛רֶת עַל פְּנֵי מַ֖יִם אֻמְלָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
translation:
  language: de
  text: Die Fischer werden klagen, und alle, die einen Angelhaken in den Nil[a] auswerfen, werden trauern; die ein Netz über dem Wasser ausbreiten, werden verzagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Fluss«; im ägyptischen Zusammenhang bezeichnet das hebräische Wort gewöhnlich den Nil oder seine Wasserläufe.
    reason: lexical_alternative
  - marker: b
    text: Oder »werden verkümmern« oder »werden mutlos werden«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנוּ
  choice: werden klagen
  rationale: Das Verb bezeichnet Klagen oder schmerzliches Seufzen. Das Futur entspricht dem prophetischen Zusammenhang und ergibt zusammen mit dem folgenden Subjekt natürliches Deutsch.
- source_word: הַדַּיָּגִים
  choice: die Fischer
  rationale: Bezeichnet Menschen, die beruflich oder regelmäßig fischen; »Fischer« ist die übliche moderne Berufsbezeichnung.
- source_word: וְאָבְלוּ
  choice: werden trauern
  rationale: אבל bezeichnet Trauer oder Klage. »trauern« wahrt die Parallelität, ohne das vorherige Verb einfach zu wiederholen.
- source_word: כָּל מַשְׁלִיכֵי
  choice: alle, die ... auswerfen
  rationale: Die partizipiale Wendung bezeichnet eine Personengruppe durch ihre fortlaufende Tätigkeit; die Relativkonstruktion ist im Deutschen natürlich.
- source_word: בַיְאֹר
  choice: in den Nil
  rationale: Im ägyptischen Zusammenhang bezeichnet יְאֹר gewöhnlich den Nil oder seine Wasserläufe. »Nil« macht den konkreten Bezug verständlich; die allgemeinere Wiedergabe »Fluss« bleibt in der Fußnote erhalten.
- source_word: חַכָּה
  choice: einen Angelhaken
  rationale: Das Substantiv bezeichnet einen zum Fischfang verwendeten Haken. »Angelhaken« ist eindeutig und bewahrt den konkreten Gegenstand des hebräischen Textes.
- source_word: וּפֹרְשֵׂי
  choice: die ... ausspannen
  rationale: Das Partizip beschreibt das Ausbreiten beziehungsweise Ausspannen eines Fischernetzes. »ausspannen« passt sachlich und idiomatisch zum Netz.
- source_word: מִכְמֹרֶת
  choice: ein Netz
  rationale: Gemeint ist ein Fangnetz. Das allgemeinere »Netz« ist sicher belegt; eine nähere Bestimmung als Schlepp- oder Wurfnetz wäre unnötig spezifisch.
- source_word: עַל פְּנֵי מַיִם
  choice: über der Wasserfläche
  rationale: Die Wendung bedeutet wörtlich »auf/über dem Angesicht des Wassers«. »über der Wasserfläche« bewahrt das räumliche Bild in natürlichem Deutsch.
- source_word: אֻמְלָלוּ
  choice: werden dahinsiechen
  rationale: Das Verb vermittelt ein Verkümmern, Ermatten oder Hinschwinden. »dahinsiechen« gibt den anhaltenden Niedergang anschaulich wieder, ohne ihn ausschließlich wirtschaftlich oder körperlich festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Tätigkeitsbezeichnungen und Trauerverben bleiben erhalten; die beiden hebräischen Perfektformen werden aufgrund des prophetischen Zusammenhangs futurisch wiedergegeben.
