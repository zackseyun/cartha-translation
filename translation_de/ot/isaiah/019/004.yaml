revisions:
- from: Ich werde Ägypten in die Hand eines harten Gebieters[b] ausliefern[a], und ein gewaltiger König wird über sie herrschen. Das ist der Ausspruch des Herrn, Jahwes der Heerscharen.[c]
  to: Ich werde Ägypten in die Hand eines harten Herrschers[b] ausliefern[a], und ein mächtiger König wird über die Ägypter herrschen. Spruch des Herrn, Jahwes der Heerscharen.[c]
  rationale: Die Revision modernisiert die Bezeichnung des menschlichen Machthabers, verdeutlicht den pluralischen Bezug von בָּם und wählt mit „mächtig“ eine präzise, nicht wertend überzogene Wiedergabe von עַז. Satzbau, Bildsprache, Gottesname und die mitgeteilte textliche Besonderheit des formalen Plurals bleiben erhalten.
