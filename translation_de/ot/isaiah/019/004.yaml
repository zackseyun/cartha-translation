source:
  edition: WLC
  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: de
  text: Ich werde Ägypten in die Hand eines harten Herrschers[b] ausliefern[a], und ein mächtiger König wird über die Ägypter herrschen. Spruch des Herrn, Jahwes der Heerscharen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde Ägypten der Gewalt eines harten Herrschers übergeben.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Herrscher“ hat formal die Mehrzahlform („Herren“), bezeichnet hier aber wahrscheinlich einen einzelnen Machthaber; das zugehörige Eigenschaftswort und der folgende „König“ stehen im Singular.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionelle Wiedergabe: „der Herr HERR Zebaoth“ oder „der Herr, der HERR der Heerscharen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: ich werde … ausliefern
  rationale: Das Verb bezeichnet hier die Übergabe Ägyptens in die Gewalt eines anderen. „Ausliefern“ gibt diesen Vorgang im Deutschen klar wieder, ohne die Art der Übergabe näher festzulegen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Gewalt oder Verfügungsgewalt eines anderen. Die Bildsprache der „Hand“ bleibt im Deutschen verständlich und wird daher im Haupttext bewahrt.
- source_word: אֲדֹנִים קָשֶׁה
  choice: eines harten Gebieters
  rationale: „Gebieter“ bezeichnet hier eindeutig einen menschlichen Machthaber und unterscheidet ihn sprachlich vom göttlichen Titel „Herr“ am Versende. קָשֶׁה wird mit „hart“ wiedergegeben. Obwohl אֲדֹנִים formal Plural ist, sprechen das singularische Adjektiv sowie der folgende singularische König mit singularischem Verb für einen einzelnen Herrscher.
- source_word: וּמֶלֶךְ עַז
  choice: und ein gewaltiger König
  rationale: עַז kann Stärke, Macht und furchteinflößende Härte bezeichnen. „Gewaltig“ bewahrt diese Spannweite besser als das stärker wertende „grausam“ und passt zum Gerichtszusammenhang.
- source_word: יִמְשָׁל בָּם
  choice: wird über sie herrschen
  rationale: Dies ist die direkte und im Deutschen natürliche Wiedergabe der politischen Herrschaftsaussage. Das pluralische Pronomen bezieht sich sinngemäß auf die Menschen Ägyptens.
- source_word: נְאֻם
  choice: Das ist der Ausspruch
  rationale: „Ausspruch“ erhält den feierlichen Charakter der prophetischen Botenformel; der vollständige deutsche Satz klingt zugleich natürlich.
- source_word: הָאָדוֹן
  choice: des Herrn
  rationale: Der bestimmte göttliche Titel wird als „der Herr“ wiedergegeben. Dadurch bleibt er vom zuvor genannten menschlichen „Gebieter“ unterschieden.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und steht wegen der deutschen Genitivkonstruktion in der Form „Jahwes“.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: „Heerscharen“ bewahrt den militärischen Grundsinn und die feierliche, im Deutschen etablierte Gottesbezeichnung.
theological_decisions:
- issue: Formaler Plural אֲדֹנִים bei einem offenbar einzelnen menschlichen Herrscher
  choice: eines harten Gebieters
  alternative: harter Gebieter / harte Herren
  rationale: Das singularische Adjektiv קָשֶׁה und die parallele Aussage über einen einzelnen König stützen eine singularische Wiedergabe. Eine Fußnote macht die formale Pluralgestalt sichtbar, ohne im Haupttext eine wahrscheinlich falsche Mehrzahl zu erzwingen.
- issue: Wiedergabe der göttlichen Titelfolge הָאָדוֹן יְהוָה צְבָאוֹת
  choice: des Herrn, Jahwes der Heerscharen
  alternative: des Herrn HERRN Zebaoth / des souveränen HERRN der Heerscharen
  rationale: Der Titel הָאָדוֹן und der Eigenname יְהוָה bleiben voneinander unterschieden. Der Gottesname wird nicht durch einen zweiten Titel ersetzt; die traditionelle deutsche Fassung wird in der Fußnote genannt.
- issue: Bedeutungsbreite von עַז beim König
  choice: gewaltiger König
  alternative: grimmiger König / mächtiger König
  rationale: Die gewählte Formulierung lässt sowohl Macht als auch furchteinflößende Härte anklingen und legt den Ausdruck nicht ausschließlich auf Grausamkeit oder bloße politische Stärke fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. „Gebieter“ vermeidet die Verwechslung des menschlichen Machthabers mit dem göttlichen Titel „Herr“. „Jahwe“ gibt den Gottesnamen ausdrücklich wieder; „Heerscharen“ wahrt die feierliche militärische Metaphorik.
