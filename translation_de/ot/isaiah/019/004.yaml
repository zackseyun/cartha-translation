  naturalness: „Gebieter“ ist im modernen Standarddeutsch unnötig altertümlich und weniger idiomatisch als „Herrscher“. Außerdem benötigt das pluralische hebräische Suffix בָּם im Deutschen einen klaren Bezug; „über die Ägypter“ ist natürlich und macht den Bezug explizit.
  terminology: „Herr“ für הָאָדוֹן, „Jahwe“ für יהוה und „Heerscharen“ für צְבָאוֹת sind konsequent und angemessen. Die Formel „Spruch des Herrn“ ist eine natürliche, würdige Wiedergabe von נְאֻם.
