base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: de
  text: An jenem Tag wird es mitten im Land Ägypten einen Altar für Jahwe geben und nahe seiner Grenze eine Steinsäule[a] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen aufgerichteten Stein“. Das hebräische Wort bezeichnet einen aufgerichteten Stein oder eine Säule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben.
- source_word: יִהְיֶה
  choice: wird … stehen
  rationale: Das hebräische Existenzverb führt die beiden Bau- beziehungsweise Steinwerke ein; „wird … stehen“ klingt im Deutschen bei einem Altar und einem Steinmal natürlicher als „wird es … geben“.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Dies ist die gewöhnliche konkrete Bedeutung des hebräischen Wortes; der Zusammenhang bietet keinen Anlass für eine metaphorische Wiedergabe.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier Widmung oder Zugehörigkeit. „Für Jahwe“ ist dafür im Deutschen natürlich; die Wiederholung wird beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: mitten im Land Ägypten
  rationale: Die Formulierung bewahrt sowohl die ausdrückliche Ortsangabe innerhalb Ägyptens als auch das hebräische „Land Ägypten“.
- source_word: מַצֵּבָה
  choice: Steinmal
  rationale: Das Wort bezeichnet einen aufgerichteten Stein beziehungsweise eine Steinsäule. „Steinmal“ ist präzise und lässt die kultische Spannung des positiv formulierten Zusammenhangs bestehen.
- source_word: אֵצֶל גְּבוּלָהּ
  choice: an seiner Grenze
  rationale: Die Wendung bezeichnet die Lage nahe beziehungsweise an der Grenze; das Pronomen bezieht sich auf das Land Ägypten.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname.
- issue: Positive Verwendung von מַצֵּבָה
  choice: Steinmal
  alternative: Steinsäule
  rationale: Obwohl solche aufgerichteten Steine andernorts kultisch verurteilt werden können, erscheint das Steinmal hier als Jahwe gewidmet. Die Übersetzung erhält diese Spannung und neutralisiert den Ausdruck nicht zu einem allgemeinen „Denkmal“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem prophetischem Satzbau. Die zweimalige Widmung „für Jahwe“ entspricht der betonten Wiederholung im Hebräischen.
