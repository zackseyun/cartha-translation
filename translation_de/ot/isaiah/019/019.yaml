revisions:
- from: An jenem Tag wird mitten im Land Ägypten ein Altar für Jahwe stehen und an seiner Grenze ein Steinmal[a] für Jahwe.
  to: An jenem Tag wird es mitten im Land Ägypten einen Altar für Jahwe geben und nahe seiner Grenze eine Steinsäule[a] für Jahwe.
  rationale: Die Revision gibt die existenzielle Funktion von יִהְיֶה mit „wird es … geben“ wieder, präzisiert die Näheangabe von אֵצֶל durch „nahe“ und verwendet mit „Steinsäule“ eine natürliche, quellennahe Haupttextwiedergabe von מַצֵּבָה. Die Fußnote bewahrt die lexikalische Alternative, ohne den Befund theologisch zu harmonisieren.
