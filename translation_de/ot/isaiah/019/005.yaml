    issue: »verdorren« für den Strom
    rationale: Das Verb bezeichnet im Deutschen primär das Austrocknen bzw. Absterben von Pflanzen. Für einen Fluss oder Strom ist es nicht die natürliche Entsprechung und kann das Bild verfälschen.
