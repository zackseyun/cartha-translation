revisions:
- from: Und die Wasser des Meeres werden versiegen[a], und der Strom wird austrocknen und verdorren.[b]
  to: Und die Wasser des Meeres werden versiegen[a], und der Strom[b] wird austrocknen und versiegen.
  rationale: Die Revision ersetzt das für einen Strom unpassende »verdorren« durch »versiegen«. Damit bleiben die beiden hebräischen Verben als nachdrückliche Beschreibung vollständiger Trockenheit erkennbar, ohne ein pflanzenbezogenes Bild einzutragen. Der Anker der Nil-Anmerkung steht nun unmittelbar bei »Strom«, und die erste Fußnote ist idiomatischer formuliert.
