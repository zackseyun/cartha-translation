    issue: Formulierung der lexikalischen Alternativfußnote
    rationale: »werden aus dem Meer schwinden« ist im Deutschen unklar. »wird dem Meer entzogen« vermittelt die mögliche Bedeutung des Erschöpft- bzw. Abgezogenwerdens verständlicher.
