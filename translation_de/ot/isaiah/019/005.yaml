  timestamp: '2026-07-16T05:14:34Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der wahrscheinliche Bezug von נָהָר auf den Nil sind zutreffend wiedergegeben. »Verdorren« ist für einen Strom jedoch semantisch und idiomatisch ungeeignet, da es gewöhnlich von Pflanzen oder pflanzlichem Bewuchs gesagt wird. Die hebräische Verstärkung durch יֶחֱרַב וְיָבֵשׁ sollte mit auf Gewässer bezogenen Verben erhalten bleiben.
  naturalness: »Die Wasser des Meeres werden versiegen« ist in einem prophetisch-gehobenen Register möglich. »Der Strom wird austrocknen und verdorren« klingt dagegen im modernen Standarddeutsch unnatürlich; »austrocknen und versiegen« ist für ein Gewässer idiomatisch und bewahrt die Zweigliedrigkeit.
  terminology: »Strom« ist als kontextuell bestimmtes Gattungswort angemessen; der Nil sollte wegen des hebräischen Gattungsworts nicht in den Haupttext eingesetzt werden. Die Fußnote erläutert dies sachgerecht. Die alternative Fußnote wird sprachlich klarer formuliert.
  issues:
