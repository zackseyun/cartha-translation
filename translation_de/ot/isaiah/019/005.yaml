  text: וְ/נִשְּׁתוּ מַ֖יִם מֵֽ/הַ/יָּ֑ם וְ/נָהָ֖ר יֶחֱרַ֥ב וְ/יָבֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/005.yaml
  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
translation:
  language: de
  text: Und die Wasser des Meeres werden versiegen[a], und der Strom[b] wird austrocknen und versiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Wasser wird dem Meer entzogen.« Das hebräische Verb kann ausdrücken, dass Wasser aufgezehrt wird oder versiegt.'
    reason: lexical_alternative
  - marker: b
    text: Mit »dem Strom« ist im Zusammenhang wahrscheinlich der Nil gemeint; im Hebräischen steht jedoch das gewöhnliche Wort für einen Strom, nicht der Eigenname.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: werden versiegen
  rationale: Das Nifal bezeichnet hier das Aufgebrauchtwerden beziehungsweise Versiegen der Wassermenge, nicht ein wörtliches »Getrunkenwerden«. »Versiegen« ist im Deutschen natürlich und wahrt die resultative Bedeutung.
- source_word: מַיִם מֵהַיָּם
  choice: die Wasser des Meeres
  rationale: »Die Wasser« spiegelt den hebräischen Plural, und »des Meeres« gibt die durch מִן bezeichnete Herkunfts- beziehungsweise Zugehörigkeitsbeziehung in idiomatischem Deutsch wieder.
- source_word: נָהָר
  choice: der Strom
  rationale: Im ägyptischen Zusammenhang ist wahrscheinlich der Nil gemeint; der hebräische Text verwendet jedoch das Gattungswort נָהָר und nicht den Eigennamen. »Der Strom« bewahrt diese Ausdrucksweise und den bestimmten Kontextbezug.
- source_word: יֶחֱרַב
  choice: wird austrocknen
  rationale: חרב bezeichnet hier das Trockenwerden. »Austrocknen« gibt den Vorgang natürlich wieder und lässt sich von dem folgenden יָבֵשׁ unterscheiden.
- source_word: יָבֵשׁ
  choice: verdorren
  rationale: Das zweite Verb verstärkt das Bild vollständiger Trockenheit. »Verdorren« erhält die Zweigliedrigkeit, ohne im Deutschen bloß »trocken« zu wiederholen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Parallelstruktur bleibt erhalten; die beiden abschließenden Verben werden differenziert wiedergegeben, ohne den wahrscheinlichen Bezug auf den Nil in den Haupttext einzutragen.
