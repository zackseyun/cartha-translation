base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: de
  text: 'den Jahwe der Heerscharen[a] gesegnet hat, indem er sagte: »Gesegnet sei Ägypten, mein Volk, und Assyrien, das Werk meiner Hände[b], und Israel, mein Erbbesitz.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Jahwe der Heere«; traditionell: »der HERR der Heerscharen« oder »HERR Zebaoth«.'
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnungen »mein Volk« und »das Werk meiner Hände«, die häufig mit Israel verbunden werden, gelten hier ausdrücklich Ägypten und Assyrien. Das hebräische Objektsuffix in »gesegnet hat« ist formal Singular; der genaue Bezug des Relativsatzes im Anschluss an den vorherigen Vers ist umstritten, während die folgende Segensrede alle drei Völker nennt.
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen knüpft an die in Vers 24 genannte Gemeinschaft aus Ägypten, Assyrien und Israel an. Der deutsche Plural macht diesen Bezug natürlich verständlich, ohne die drei Größen zu einer einzigen zu verschmelzen.
- source_word: בֵּרֲכוֹ
  choice: gesegnet hat
  rationale: Das Perfekt wird als vollzogene Segenshandlung wiedergegeben. Das hebräische Objektsuffix steht formal im Singular; im Zusammenhang umfasst der Segen jedoch die zuvor genannte Dreiergruppe, die anschließend einzeln angesprochen wird.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt den militärisch-kollektiven Sinn von צְבָאוֹת und die Würde des feststehenden Gottestitels.
- source_word: לֵאמֹר
  choice: indem er sprach
  rationale: Leitet die folgende direkte Rede idiomatisch ein und verbindet sie mit der vorausgehenden Segenshandlung.
- source_word: בָּרוּךְ
  choice: Gesegnet sei
  rationale: Die deutsche Wunschform bewahrt den feierlichen Charakter der hebräischen Segensformel.
- source_word: עַמִּי מִצְרַיִם
  choice: Ägypten, mein Volk
  rationale: Die Apposition wird direkt bewahrt. Dadurch bleibt die überraschende Anwendung der Bezeichnung »mein Volk« auf Ägypten deutlich.
- source_word: וּמַעֲשֵׂה יָדַי אַשּׁוּר
  choice: und Assyrien, das Werk meiner Hände
  rationale: Die appositionale Beziehung wird in natürlicher deutscher Wortstellung ausgedrückt, ohne die Bezeichnung abzuschwächen.
- source_word: וְנַחֲלָתִי יִשְׂרָאֵל
  choice: und Israel, mein Erbbesitz
  rationale: »Erbbesitz« gibt נַחֲלָה als zugeteilten beziehungsweise bleibenden Besitz wieder und passt hier besser als das im Deutschen leicht missverständliche »mein Erbe«.
theological_decisions:
- issue: Gottesname und Titel יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; HERR Zebaoth; Jahwe der Heere
  rationale: Die Wiedergabe nennt den Gottesnamen ausdrücklich und bewahrt zugleich den traditionellen, aus dem militärischen Plural hervorgegangenen Titel.
- issue: Bundesbezogene Bezeichnungen für Ägypten und Assyrien
  choice: Die unmittelbaren Appositionen »Ägypten, mein Volk« und »Assyrien, das Werk meiner Hände« bleiben stehen.
  alternative: Erklärende Erweiterungen wie »Ägypten, das nun mein Volk geworden ist«
  rationale: Der hebräische Text überträgt markante, häufig mit Israel verbundene Bezeichnungen ohne Erklärung auf Ägypten und Assyrien. Diese theologische Spannung und Überraschung darf nicht durch eine Paraphrase aufgelöst werden.
- issue: Bezug und Numerus des Relativsatzes
  choice: Deutscher Plural »die ... gesegnet hat« mit Bezug auf die Dreiergruppe
  alternative: Singularischer Bezug auf nur einen einzelnen Vorläufer oder auf »Segen«
  rationale: Obwohl das hebräische Objektsuffix formal maskulin Singular ist, nennt die folgende Segensrede alle drei Völker. Der Plural stellt den naheliegenden Gesamtbezug im Deutschen her, während die Formfrage in der Fußnote offengelegt wird.
translation_notes:
  register: Moderne, feierliche Standardsprache. Die direkte Segensformel und die dreifache Parallelstruktur werden bewahrt; Kommas verdeutlichen die Appositionen. »Erbbesitz« ist verständlich und vermeidet die mögliche Fehlvorstellung, Israel sei etwas, das Gott von einem Vorgänger geerbt habe.
