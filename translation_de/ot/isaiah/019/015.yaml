  text: וְ/לֹֽא יִהְיֶ֥ה לְ/מִצְרַ֖יִם מַֽעֲשֶׂ֑ה אֲשֶׁ֧ר יַעֲשֶׂ֛ה רֹ֥אשׁ וְ/זָנָ֖ב כִּפָּ֥ה וְ/אַגְמֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: de
  text: Und für Ägypten wird es keine Arbeit geben, die weder Kopf noch Schwanz[a], weder Palmzweig noch Schilfrohr[b] verrichten kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kopf und Schwanz, Palmzweig und Schilfrohr“ ist im Hebräischen eine bildhafte Bezeichnung für alle gesellschaftlichen Schichten, von den höchsten bis zu den niedrigsten; vergleiche Jesaja 9,13–14.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „Kopf und Schwanz, Palmzweig und Schilfrohr“. Die mit „und“ verbundenen hebräischen Wortpaare können koordinierend gelesen werden; gemeint ist, dass kein Teil Ägyptens, weder hoch noch niedrig, handeln kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיֶה
  choice: Und ... wird es nichts geben
  rationale: Die hebräische verneinte Existenzkonstruktion wird in natürlichem modernem Deutsch als zukünftige Aussage wiedergegeben.
- source_word: לְמִצְרַיִם
  choice: für Ägypten
  rationale: 'Die Präposition bezeichnet hier die Zuordnung zu Ägypten: Es wird für Ägypten keine mögliche Tätigkeit geben.'
- source_word: מַעֲשֶׂה
  choice: nichts
  rationale: Das Substantiv bezeichnet eine Tat, Arbeit oder Unternehmung. In Verbindung mit dem Relativsatz gibt „nichts, was … tun könnte“ den Sinn idiomatisch wieder, ohne ihn auf Erwerbsarbeit einzuengen.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: was ... tun könnte
  rationale: Der Imperfekt beschreibt im Zusammenhang die fehlende Handlungsmöglichkeit; der deutsche Konjunktiv mit „könnte“ bringt diese Unfähigkeit natürlich zum Ausdruck.
- source_word: רֹאשׁ וְזָנָב
  choice: weder Kopf noch Schwanz
  rationale: Die gegensätzlichen Körperteile stehen bildlich für die höchsten und niedrigsten gesellschaftlichen Schichten. „Weder … noch“ macht den verteilenden Sinn der Verneinung im Deutschen deutlich.
- source_word: כִּפָּה
  choice: Palmzweig
  rationale: Die wahrscheinlich botanische Bedeutung bleibt erhalten und bildet den Gegensatz zum niedrigen Schilfrohr ab.
- source_word: אַגְמוֹן
  choice: Schilfrohr
  rationale: Das Wort bezeichnet eine Sumpfpflanze wie Schilf oder Binse. „Schilfrohr“ ist anschaulich und wahrt den Gegensatz zum Palmzweig.
theological_decisions: []
