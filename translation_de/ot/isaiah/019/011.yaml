  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: de
  text: 'Gewiss sind die Fürsten von Zoan Narren; die weisen Ratgeber des Pharao erteilen törichten Rat.[a] Wie könnt ihr zum Pharao sagen: »Ich bin ein Sohn von Weisen,[b] ein Sohn von Königen der Vorzeit«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist knapp; wörtlicher etwa: »Rat ist stumpfsinnig« oder »Rat ist unvernünftig«.'
    reason: lexical_alternative
  - marker: b
    text: »Ein Sohn von Weisen« und »ein Sohn von Königen der Vorzeit« bezeichnen hier Herkunft oder Rang und müssen nicht unmittelbare leibliche Sohnschaft meinen.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die Aussage, statt sie im Sinn von »nur« einzuschränken. »Ja« gibt diesen Nachdruck knapp und natürlich wieder.
- source_word: אֱוִלִים
  choice: Narren
  rationale: Das Wort bezeichnet die Fürsten scharf als unverständige Menschen. »Narren« bewahrt diese wertende Kraft und passt zum gehobenen prophetischen Kontext.
- source_word: שָׂרֵי צֹעַן
  choice: die Fürsten von Zoan
  rationale: שָׂרִים kann Fürsten, Machthaber oder hohe Beamte bezeichnen. »Fürsten« wahrt den höfischen Kontext; צֹעַן wird als Ortsname »Zoan« wiedergegeben.
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: die Weisen unter den Ratgebern des Pharaos
  rationale: Die Konstruktion lässt sich als Bezeichnung der als weise geltenden Männer innerhalb der Ratgeberschaft des Pharaos verstehen. Diese Wiedergabe erhält beide nominalen Elemente, ohne ihre behauptete Weisheit als tatsächlich gegeben vorauszusetzen.
- source_word: עֵצָה נִבְעָרָה
  choice: geben törichten Rat
  rationale: Der hebräische Ausdruck ist stark verdichtet und lautet wörtlicher etwa »Rat ist stumpfsinnig«. Die verbale Wiedergabe ist im Deutschen natürlich; »töricht« wahrt die abwertende Aussage in einem würdigen Register.
- source_word: אֵיךְ תֹּאמְרוּ אֶל־פַרְעֹה
  choice: Wie könnt ihr zum Pharao sagen
  rationale: Das Fragewort leitet eine rhetorische, ungläubige Herausforderung ein. Die zweite Person Plural wird mit »ihr« ausdrücklich bewahrt.
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: Ich bin ein Sohn von Weisen
  rationale: »Sohn« kann hier Abstammung oder Zugehörigkeit zu einer angesehenen Gruppe ausdrücken. Die idiomatische Form bleibt erhalten, damit der Text nicht unnötig auf eine bestimmte Art der Abstammung festgelegt wird.
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: ein Sohn von Königen der Vorzeit
  rationale: קֶדֶם bezeichnet hier frühere, alte Zeit und nicht die Himmelsrichtung Osten. »Könige der Vorzeit« gibt den Anspruch auf altes königliches Herkommen klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlicher prophetischer Schärfe. »Narren« und »töricht« erhalten die herabsetzende Wortwahl, ohne in umgangssprachliche Grobheit abzugleiten. Die parallelen Wendungen mit »Sohn« bleiben als bewusstes Herkunfts- und Standesidiom stehen.
