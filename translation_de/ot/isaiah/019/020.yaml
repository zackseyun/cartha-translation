  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: de
  text: Es wird im Land Ägypten ein Zeichen und ein Zeuge für Jahwe der Heere sein. Denn sie werden wegen ihrer Bedränger zu Jahwe schreien, und er wird ihnen einen Retter und Streiter[a] senden und sie befreien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Retter und einen Mächtigen“. Der hebräische Ausdruck ist schwierig; das zweite Wort kann wörtlicher „Mächtiger“ bedeuten und wird im Zusammenhang auch als Bezeichnung eines Kämpfers oder Beistands verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Es wird … sein
  rationale: Die Verbform kündigt die künftige Bedeutung des zuvor erwähnten Zeichens an; die deutsche Satzklammer ergibt eine natürliche Wortstellung.
- source_word: לְאוֹת וּלְעֵד
  choice: ein Zeichen und ein Zeuge
  rationale: אוֹת bezeichnet ein Zeichen oder Kennzeichen, עֵד wörtlich einen Zeugen. Die personhafte und rechtliche Nuance von עֵד bleibt erhalten.
- source_word: לַיהוָה צְבָאוֹת
  choice: für Jahwe der Heere
  rationale: Der Gottesname יהוה wird als Jahwe wiedergegeben; צְבָאוֹת bezeichnet Heere und wird transparent statt mit dem heute missverständlichen traditionellen Ausdruck „Heerscharen“ übersetzt.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die volle geografische Wendung des Hebräischen bleibt erhalten.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier die Erklärung für die Bedeutung des Zeichens und Zeugen ein.
- source_word: יִצְעֲקוּ אֶל יְהוָה
  choice: sie werden … zu Jahwe schreien
  rationale: צעק beschreibt einen dringlichen Hilferuf aus Not; „zu … schreien“ gibt Richtung und Intensität wieder.
- source_word: מִפְּנֵי לֹחֲצִים
  choice: wegen ihrer Bedränger
  rationale: מִפְּנֵי drückt hier den Anlass des Hilferufs aus. Das substantivierte Partizip לֹחֲצִים bezeichnet Menschen, die Druck ausüben oder unterdrücken; das possessive „ihrer“ ist im Deutschen kontextgemäß.
- source_word: מוֹשִׁיעַ
  choice: einen Retter
  rationale: Das Hifil-Partizip von ישׁע bezeichnet jemanden, der rettet oder Befreiung bringt.
- source_word: וָרָב
  choice: und Streiter
  rationale: Der schwierige Ausdruck wird funktional als Bezeichnung eines mächtigen Beistands verstanden. „Streiter“ wahrt den Zusammenhang mit Rettung, ohne die mögliche wörtlichere Lesart „Mächtiger“ zu verschweigen; diese steht in der Fußnote.
- source_word: וְהִצִּילָם
  choice: und sie befreien
  rationale: Das Hifil von נצל bedeutet aus Gefahr oder Bedrängnis retten beziehungsweise befreien. „Befreien“ passt hier besonders zum Kontext der Unterdrückung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Eigennamen יהוה. „Jahwe“ gibt den Namen transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen
  rationale: „Heere“ vermittelt die konkrete Grundbedeutung des hebräischen Plurals in heutigem Deutsch klarer; die traditionelle Form „Heerscharen“ ist möglich, aber weniger unmittelbar verständlich.
- issue: Identität des angekündigten Retters und Streiters
  choice: nicht näher bestimmt
  alternative: ausdrückliche messianische Identifizierung
  rationale: Der Vers selbst identifiziert die gesandte Gestalt nicht näher. Die Übersetzung bewahrt diese Offenheit und fügt keine konfessionelle Deutung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Zeuge“ erhält die konkrete Bildsprache des Hebräischen; „Bedränger“, „Retter“ und „Streiter“ bewahren einen gehobenen, aber allgemein verständlichen biblischen Ton.
