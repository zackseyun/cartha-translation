source:
  edition: WLC
  text: וְ/נֶהֶפְכ֤וּ נְחָלֶ֨י/הָ֙ לְ/זֶ֔פֶת וַ/עֲפָרָ֖/הּ לְ/גָפְרִ֑ית וְ/הָיְתָ֣ה אַרְצָ֔/הּ לְ/זֶ֖פֶת בֹּעֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
translation:
  language: de
  text: Ihre Bachläufe[a] werden zu Pech, ihr Staub zu Schwefel; ihr Land wird zu brennendem Pech.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: ihre Wadis, Bäche oder Flussbetten. Das hebräische Wort kann Wasserläufe bezeichnen, die nur zeitweise Wasser führen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: werden zu
  rationale: Das Nifal von הפך bezeichnet hier die Verwandlung in einen anderen Zustand. Im prophetischen Zusammenhang gibt das deutsche Futur den zukünftigen Ergebnissinn natürlich wieder.
- source_word: נְחָלֶיהָ
  choice: ihre Bachläufe
  rationale: נחל kann einen Bach, einen zeitweise wasserführenden Wildbach oder dessen Bett bezeichnen. „Bachläufe“ ist allgemein verständlich und lässt offen, ob ständig Wasser fließt; die geografisch präzisere Alternative steht in der Fußnote.
- source_word: זֶפֶת
  choice: Pech
  rationale: זפת bezeichnet Pech beziehungsweise Bitumen. „Pech“ ist anschaulich, geläufig und bewahrt das Bild eines dunklen, brennbaren Stoffes.
- source_word: עֲפָרָהּ
  choice: ihr Staub
  rationale: עפר bedeutet Staub oder lockere, trockene Erde. „Staub“ erhält das drastische Bild, dass selbst die Grundsubstanz des Landes verwandelt wird.
- source_word: גָפְרִית
  choice: Schwefel
  rationale: „Schwefel“ ist die genaue und im heutigen Deutsch übliche Wiedergabe von גפרית.
- source_word: אַרְצָהּ
  choice: ihr Land
  rationale: ארץ bezeichnet hier das Gebiet der dem Gericht ausgesetzten Größe; „Land“ ist kontextgerecht und natürlich.
- source_word: בֹּעֵרָה
  choice: brennendem
  rationale: Das Partizip beschreibt das Pech als brennend. Die attributive Form bewahrt diesen fortdauernden, bildhaften Charakter, ohne die Dauer näher festzulegen.
theological_decisions:
- issue: Personifizierung durch die femininen Suffixe
  choice: Die wiederholten Possessivformen werden mit „ihre/ihr“ wiedergegeben.
  alternative: Unpersönliche Wiedergabe mit „dessen“ oder ausdrückliche Wiederholung des Namens des Landes.
  rationale: Die femininen Suffixe personifizieren die dem Gericht ausgesetzte Größe. Die deutschen Formen „ihre/ihr“ erhalten diese literarische Wirkung, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; das Hilfsverb wird im zweiten Satzglied sinngemäß mitverstanden. „Pech“ und „Schwefel“ sind konkret und allgemein verständlich.
