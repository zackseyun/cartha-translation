  text: וְ/יָרְד֤וּ רְאֵמִים֙ עִמָּ֔/ם וּ/פָרִ֖ים עִם אַבִּירִ֑ים וְ/רִוְּתָ֤ה אַרְצָ/ם֙ מִ/דָּ֔ם וַ/עֲפָרָ֖/ם מֵ/חֵ֥לֶב יְדֻשָּֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: de
  text: Wildrinder werden mit ihnen fallen[a], junge Stiere mit den Mächtigen[b]. Ihr Land wird von Blut durchtränkt, und ihr Staub wird fett von Fett.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Oryxantilopen“. Das hebräische Wort bezeichnet ein kräftiges wildes Tier; die genaue Tierart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Die Mächtigen“ können mächtige Menschen oder, innerhalb des Tierbildes, starke Stiere bezeichnen; möglicherweise klingen beide Bedeutungen an.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: werden … fallen
  rationale: Das Verb bedeutet wörtlich „hinabgehen“ oder „hinabsteigen“. Im Zusammenhang des blutigen Gerichts bezeichnet „fallen“ idiomatisch das Erschlagenwerden und bewahrt zugleich die Abwärtsbewegung des Bildes.
- source_word: רְאֵמִים
  choice: Wildrinder
  rationale: Die genaue Tierart ist unsicher; gemeint ist offenbar ein großes, kraftvolles wildes Rind. „Wildrinder“ ist verständlich und vermeidet die sachlich unbegründete ältere Wiedergabe „Einhörner“.
- source_word: עִמָּם
  choice: mit ihnen
  rationale: Die pronominale Bezugnahme bleibt wie im Hebräischen unbestimmt und wird nicht durch einen ausdrücklich genannten Bezug ergänzt.
- source_word: וּפָרִים
  choice: junge Stiere
  rationale: פָּר bezeichnet häufig einen Stier, besonders einen Jungstier. Die Wiedergabe erhält die Tier- und Schlachtopferbildsprache.
- source_word: אַבִּירִים
  choice: die Gewaltigen
  rationale: Das Wort kann allgemein Mächtige oder Starke bezeichnen und hier zugleich starke Tiere oder mächtige Menschen anklingen lassen. „Die Gewaltigen“ erhält diese Mehrdeutigkeit.
- source_word: וְרִוְּתָה
  choice: wird … durchtränkt
  rationale: Das Verb beschreibt Sättigung oder das Trinken bis zur Fülle. Beim Land, das Blut aufnimmt, gibt „durchtränkt“ das drastische Bild natürlich wieder.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: „Land“ bezeichnet passend das Gebiet der Gerichteten und entspricht der üblichen Bedeutung von אֶרֶץ.
- source_word: מִדָּם
  choice: von Blut
  rationale: Die Präposition מִן bezeichnet hier den Stoff beziehungsweise die Ursache der Sättigung; „von Blut durchtränkt“ ist idiomatisches Deutsch.
- source_word: וַעֲפָרָם
  choice: ihr Staub
  rationale: „Staub“ bewahrt das konkrete hebräische Bild und dessen Anklänge an Sterblichkeit und Gericht.
- source_word: מֵחֵלֶב
  choice: vom Fett
  rationale: Die Präposition kennzeichnet das Fett der Erschlagenen als Ursache dafür, dass der Staub gesättigt beziehungsweise fett wird.
- source_word: יְדֻשָּׁן
  choice: wird … gesättigt
  rationale: Das Verb bedeutet „fett werden“ oder „reich werden“. „Vom Fett gesättigt“ ist im Deutschen natürlicher als eine wörtliche Formulierung und erhält die Vorstellung eines vom Fett der Erschlagenen angefüllten Bodens.
theological_decisions:
- issue: Wörtliche oder metaphorische Bedeutung der Tierbilder
  choice: Die Tierbezeichnungen bleiben im Haupttext erhalten und können zugleich den Untergang der Mächtigen im göttlichen Gericht veranschaulichen.
  alternative: Alle Tierbegriffe entweder ausschließlich auf wirkliche Opfertiere oder ausschließlich metaphorisch auf menschliche Herrscher beziehen.
  rationale: Jesaja 34 verbindet Schlachtopfer- und Schlachtfeldbilder. Der hebräische Text ermöglicht eine mehrschichtige Lesart; die Übersetzung legt ihn daher nicht einseitig auf Tiere oder Menschen fest.
- issue: Bezug von אַבִּירִים
  choice: „die Gewaltigen“ bewahrt einen möglichen Bezug sowohl auf mächtige Menschen als auch auf starke Tiere.
  alternative: Eindeutig „mächtige Krieger“ oder „starke Stiere“ übersetzen.
  rationale: Der Ausdruck und sein poetischer Zusammenhang tragen beide Nuancen. Eine eindeutige Festlegung würde die Spannung des Ausgangstextes unnötig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die parallele Satzstruktur und die drastische Gerichtsbildsprache bleiben erhalten; ungesicherte zoologische und metaphorische Festlegungen werden vermieden.
