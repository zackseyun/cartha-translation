source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: de
  text: 'Forscht im Buch Jahwes nach und lest: Keine von ihnen wird fehlen; keine wird ihre Gefährtin vermissen. Denn mein Mund – er hat befohlen[a], und sein Geist[b] hat sie versammelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn mein Mund, er hat befohlen.“ Der hebräische Text wechselt anschließend von „mein“ zu „sein Geist“. Manche Übersetzungen gleichen den ersten Ausdruck zu „sein Mund“ an.'
    reason: Bewahrt den auffälligen Personenwechsel und erläutert die emphatische Syntax.
  - marker: b
    text: 'Oder: „sein Atem“ beziehungsweise „sein Wind“.'
    reason: רוּחַ besitzt alle drei Bedeutungen; der Zusammenhang entscheidet nicht völlig eindeutig.
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה
  choice: Forscht im Buch Jahwes nach
  rationale: Der Imperativ דרשׁ fordert hier zum prüfenden Nachsuchen beziehungsweise Konsultieren einer Schrift auf. Die idiomatische deutsche Wendung gibt zugleich מֵעַל im Zusammenhang mit סֵפֶר natürlich wieder.
- source_word: וּקְרָאוּ
  choice: und lest
  rationale: קרא bezeichnet bei einer Schrift das Lesen, möglicherweise das laute Vorlesen. „Lest“ bleibt im Deutschen natürlich und legt die Modalität nicht unnötig fest.
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: Keine von ihnen wird fehlen
  rationale: Die feminine distributive Form verweist auf die zuvor genannten Tiere. Das Futur bringt im Deutschen die sichere Erfüllung der prophetischen Aussage angemessen zum Ausdruck.
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: keine wird ihre Gefährtin vermissen
  rationale: אִשָּׁה ... רְעוּתָהּ ist wörtlich „eine/Frau – ihre Gefährtin“. „Gefährtin“ bewahrt das feminine Verhältnis und lässt offen, ob Paarung oder allgemein die zugehörige Partnerin gemeint ist; פקד wird im parallelen Zusammenhang als „vermissen“ wiedergegeben.
- source_word: כִּי פִי הוּא צִוָּה
  choice: Denn mein Mund – er hat es befohlen
  rationale: פִי ist im masoretischen Text eindeutig „mein Mund“. Das selbständige הוּא wirkt hervorhebend; der Gedankenstrich bildet diese Emphase ab, ohne den Personenwechsel zur folgenden dritten Person zu glätten.
- source_word: וְרוּחוֹ
  choice: und sein Geist
  rationale: רוּחַ kann Geist, Atem oder Wind bedeuten. Als handelnde göttliche Kraft parallel zum befehlenden Mund ist „Geist“ im Haupttext passend; die genuine Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: קִבְּצָן
  choice: hat sie versammelt
  rationale: Das Perfekt von קבץ bezeichnet das als vollzogen beziehungsweise gewiss dargestellte Sammeln; „hat ... versammelt“ erhält diese Aspektform.
theological_decisions:
- issue: Personenwechsel zwischen פִי und רוּחוֹ
  choice: „mein Mund ... sein Geist“
  alternative: „sein Mund ... sein Geist“ oder vereinheitlichend „mein Mund ... mein Geist“
  rationale: Der WLC liest in der ersten Klausel die erste Person („mein Mund“), danach aber die dritte Person („sein Geist“). Der Haupttext bewahrt diese auffällige Spannung, statt sie aus stilistischen oder theologischen Gründen zu beseitigen.
- issue: Bedeutung von רוּחַ bei göttlicher Wirksamkeit
  choice: Geist
  alternative: Atem oder Wind
  rationale: „Geist“ passt zur handelnden und versammelnden göttlichen Wirksamkeit, ohne dass die ebenfalls möglichen konkreteren Bedeutungen verschwiegen werden; diese stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahwe“ gibt den Gottesnamen יהוה wieder. Der ungewöhnliche Personenwechsel des Hebräischen bleibt bewusst stehen. Beide Fußnotenmarker erscheinen unmittelbar an den erklärten Textstellen.
