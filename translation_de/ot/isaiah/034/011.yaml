  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: de
  text: Wüsteneule und Igel werden es in Besitz nehmen, Eule und Rabe werden darin wohnen.[a] Er wird darüber die Messschnur der Öde und die Lotsteine der Leere spannen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung der hier genannten Tiere ist unsicher. „Wüsteneule“ kann auch als „Pelikan“ oder „Kormoran“, „Igel“ auch als „Stachelschwein“ oder „Rohrdommel“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Messschnur des Tohu und die Steine des Bohu“. Die Formulierung greift die Wörter aus Genesis 1,2 auf („wüst und leer“) und stellt das Land als in einen Zustand der Unordnung und Verödung zurückversetzt dar.'
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: werden es in Besitz nehmen
  rationale: ירשׁ bezeichnet das Inbesitznehmen oder Erben. Im Zusammenhang mit dem verwüsteten Gebiet gibt „in Besitz nehmen“ die Übernahme durch wilde Tiere wieder, ohne einen rechtlichen Erbgang nahezulegen.
- source_word: קָאַת
  choice: Wüsteneule
  rationale: Die zoologische Bestimmung ist unsicher. „Wüsteneule“ passt zum Bild einer menschenleeren Ruinenlandschaft; andere mögliche Bestimmungen werden in der Fußnote genannt.
- source_word: קִפּוֹד
  choice: Igel
  rationale: Die Tierbezeichnung ist umstritten. „Igel“ ist eine geläufige, verständliche Wiedergabe; mögliche Alternativen bleiben in der Fußnote sichtbar.
- source_word: יַנְשׁוֹף
  choice: Eule
  rationale: Gemeint ist wahrscheinlich eine Eulenart. Der allgemeine Ausdruck vermeidet eine nicht belegbare genaue Artbestimmung.
- source_word: עֹרֵב
  choice: Rabe
  rationale: Dies ist die übliche Entsprechung und passt zur biblischen Bildwelt verwüsteter Orte.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: werden darin wohnen
  rationale: שׁכן bezeichnet ein bleibendes Wohnen oder Sichniederlassen. „Darin“ nimmt den im Kontext vorausgesetzten Ort natürlich auf.
- source_word: וְנָטָה עָלֶיהָ
  choice: Er spannt darüber
  rationale: נטה beschreibt hier das Ausspannen einer Messschnur. Das hebräische Verb steht im maskulinen Singular mit unausgesprochenem Subjekt; „Er“ bewahrt diese Form, ohne den Handelnden im Text ausdrücklich zu benennen.
- source_word: קַו תֹהוּ
  choice: die Messschnur der Öde
  rationale: קַו ist eine Messschnur; תֹהוּ bezeichnet Öde, Leere oder ungeordnete Nichtigkeit und erinnert an Genesis 1,2. „Öde“ verbindet das konkrete Gerichtsmotiv mit diesem tieferen Anklang.
- source_word: וְאַבְנֵי בֹהוּ
  choice: und die Lotsteine der Leere
  rationale: אַבְנֵי bedeutet wörtlich „Steine von“. Parallel zur Messschnur sind offenbar Steine eines Mess- oder Lotgeräts gemeint. „Lotsteine“ erhält sowohl das konkrete Bild als auch die ungewöhnliche Ausdrucksweise; בֹהוּ wird mit „Leere“ wiedergegeben.
theological_decisions:
- issue: Anklang an die Schöpfungssprache תֹהוּ וָבֹהוּ
  choice: „Öde“ und „Leere“ im Haupttext, mit ausdrücklichem Hinweis auf Genesis 1,2 in der Fußnote
  alternative: „Chaos“ und „Leere“ beziehungsweise „wüst und leer“ unmittelbar im Haupttext
  rationale: Jesaja greift die Wortverbindung aus Genesis 1,2 auf und schildert das Gericht als Rückführung in einen Zustand der Unordnung und Verödung. Die gewählte Fassung bleibt im unmittelbaren Gerichtskontext natürlich, während die Fußnote den bedeutsamen intertextuellen Anklang sichert.
- issue: Unausgesprochenes Subjekt von וְנָטָה
  choice: Das maskuline Singularsubjekt mit „Er“ wiedergeben, ohne es erläuternd als Gott zu benennen
  alternative: „Gott spannt“ oder eine unpersönliche Passivkonstruktion
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der hebräische Vers nennt ihn an dieser Stelle nicht ausdrücklich. „Er“ bewahrt sowohl den Kontextbezug als auch die formale Zurückhaltung des Ausgangstextes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die ungewöhnliche Vermessungsmetaphorik bleibt bewusst erhalten. Die Pronomen richten sich im Deutschen nach dem im Zusammenhang vorausgesetzten Gebiet beziehungsweise Land; deshalb stehen „es“, „darin“ und „darüber“ statt eines grammatisch femininen Pronomens.
