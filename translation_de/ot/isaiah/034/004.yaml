base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: de
  text: Das ganze Heer des Himmels wird vergehen[a], und die Himmel werden wie eine Schriftrolle zusammengerollt[b]. Das ganze Heer der Himmel wird verwelken wie ein Blatt am Weinstock und wie eine welke Feige am Feigenbaum[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wird sich auflösen“, „wird zerfallen“ oder „wird verfaulen“. Das hebräische Verb kann ein Dahinschwinden, Verwesen oder Sich-Auflösen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen die gebräuchliche Pluralform „die Himmel“; entsprechend ist auch „der Himmel wird wie eine Schriftrolle zusammengerollt“ als idiomatisch-singularische Wiedergabe möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Die Bilder können auch das Herabfallen betonen: „wie ein Blatt vom Weinstock fällt und wie eine Feige vom Feigenbaum fällt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָמַקּוּ
  choice: wird vergehen
  rationale: Das Nifal von נמק bezeichnet ein Dahinschwinden, Verfaulen oder Sich-Auflösen. „Vergehen“ klingt in deutscher prophetischer Dichtung natürlich und bewahrt die Offenheit zwischen Zerfall und Auflösung; die konkreteren Möglichkeiten stehen in der Fußnote.
- source_word: צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  rationale: „Heer des Himmels“ bewahrt die hebräische Wendung und lässt offen, ob besonders Sterne oder umfassender die himmlische Schar gemeint sind.
- source_word: וְנָגֹלּוּ כַסֵּפֶר הַשָּׁמַיִם
  choice: und der Himmel wird zusammengerollt wie eine Schriftrolle
  rationale: גלל bezeichnet das Rollen; סֵפֶר ist hier wegen dieses Bildes am anschaulichsten als „Schriftrolle“ wiedergegeben. Der im Hebräischen formal plurale Ausdruck שׁמים wird im Deutschen idiomatisch singularisch gefasst.
- source_word: וְכָל צְבָאָם
  choice: sein ganzes Heer
  rationale: Das Suffix bezieht sich auf den Himmel beziehungsweise die Himmel und bezeichnet dessen himmlische Schar, ohne sie ausdrücklich mit den Sternen gleichzusetzen.
- source_word: יִבּוֹל
  choice: wird verwelken
  rationale: נבל bezeichnet bei Pflanzen das Welken oder Verblassen und verbindet die Aussage unmittelbar mit den folgenden Pflanzenbildern.
- source_word: כִנְבֹל עָלֶה מִגֶּפֶן
  choice: wie das Laub am Weinstock
  rationale: Die knappe deutsche Form vermeidet die unnatürliche Wendung „wie ein Blatt vom Weinstock verwelkt“. „Laub“ kann kollektiv stehen und behält durch das übergeordnete Verb das Bild des Welkens; zugleich kann das hebräische מִן das Sich-Lösen beziehungsweise Herabfallen anklingen lassen.
- source_word: וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: und wie eine welke Feige am Feigenbaum
  rationale: Die feminine Form lässt sich im Kontext als welke beziehungsweise abfallende Feige verstehen; „Feige“ wird aus תְּאֵנָה sinngemäß ergänzt, damit das Bild auf Deutsch verständlich ist.
theological_decisions:
- issue: Art der kosmischen Gerichtsbilder
  choice: Die kosmische Sprache wird unmittelbar und bildkräftig wiedergegeben, ohne festzulegen, ob sie wörtlich, metaphorisch oder in beiden Ebenen zu verstehen ist.
  alternative: Die Aussage ausschließlich als politischen Zusammenbruch oder ausschließlich als astronomische Auflösung erklären.
  rationale: Der prophetische Text schildert Gericht als kosmische Entschöpfung. Die Übersetzung soll diese theologische Spannung und Bildkraft erhalten, nicht durch ein bestimmtes Endzeitsystem auflösen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit prophetischer Bildkraft. „Heer des Himmels“ und „Schriftrolle“ bewahren die kulturelle und kosmische Bildwelt des Hebräischen. Die Satzstruktur bleibt parallel, ist aber für natürliches Deutsch leicht geglättet.
