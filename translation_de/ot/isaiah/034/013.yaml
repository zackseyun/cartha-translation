source:
  edition: WLC
  text: וְ/עָלְתָ֤ה אַרְמְנֹתֶ֨י/הָ֙ סִירִ֔ים קִמּ֥וֹשׂ וָ/ח֖וֹחַ בְּ/מִבְצָרֶ֑י/הָ וְ/הָיְתָה֙ נְוֵ֣ה תַנִּ֔ים חָצִ֖יר לִ/בְנ֥וֹת יַעֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: de
  text: Dorngestrüpp wird in ihren Palästen aufwachsen, Nesseln und Disteln in ihren Festungen. Sie wird zum Aufenthaltsort der Schakale, zum Weideplatz für Strauße.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Töchter des Straußes“; gemeint sind Strauße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלְתָה ... סִירִים
  choice: Dorngestrüpp wird ... aufwachsen
  rationale: עלה bezeichnet hier das Aufkommen von Pflanzen in den verfallenen Gebäuden; „aufwachsen“ gibt das Bild natürlich wieder. סירים ist eine allgemeine Bezeichnung für dornigen Bewuchs.
- source_word: אַרְמְנֹתֶיהָ
  choice: in ihren Palästen
  rationale: ארמון bezeichnet gewöhnlich einen Palast oder eine herrschaftliche, teils befestigte Residenz; „Paläste“ passt zum Parallelismus mit den Festungen.
- source_word: קִמּוֹשׂ וָחוֹחַ
  choice: Nesseln und Disteln
  rationale: Beide Wörter bezeichnen lästigen beziehungsweise stacheligen Wildwuchs. Die deutschen Pflanzennamen bewahren die Unterscheidung, ohne botanische Sicherheit vorzutäuschen.
- source_word: בְּמִבְצָרֶיהָ
  choice: in ihren Festungen
  rationale: מבצר bezeichnet befestigte Orte oder Festungsanlagen.
- source_word: נְוֵה תַנִּים
  choice: Aufenthaltsort der Schakale
  rationale: נוה kann Wohnort oder Lagerstätte bedeuten; in der Ruinenlandschaft ist „Aufenthaltsort“ passend. תנים bezeichnet in diesem prophetischen Kontext wahrscheinlich Schakale.
- source_word: חָצִיר
  choice: Weideplatz
  rationale: Das Wort kann Gras beziehungsweise eine grasbewachsene Fläche bezeichnen; „Weideplatz“ erhält hier den räumlichen Parallelismus zu נוה.
- source_word: לִבְנוֹת יַעֲנָה
  choice: für Strauße
  rationale: Wörtlich steht „für Töchter des Straußes“; die Wendung bezeichnet idiomatisch Strauße und wird im Haupttext natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei parallelen Sätze und das Bild der von Wildwuchs und Wüstentieren eingenommenen Ruinen bleiben erhalten.
