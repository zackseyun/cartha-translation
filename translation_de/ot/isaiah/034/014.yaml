source:
  edition: WLC
  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: de
  text: Wüstentiere werden Hyänen[a] begegnen, und ein Bocksdämon wird seinem Gefährten zurufen. Ja, dort wird sich Lilith[b] niederlassen und für sich einen Ruheplatz finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakale“; die genaue Tierart des hebräischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Lilith“ kann auch mit „Nachtwesen“ oder „Nachtungeheuer“ wiedergegeben werden; einige ältere Übersetzungen haben „Nachteule“.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: Wüstentiere
  rationale: Der Ausdruck bezeichnet Geschöpfe verwüsteter oder wüstenartiger Gegenden, ohne eine bestimmte Tierart sicher festzulegen.
- source_word: אִיִּים
  choice: Hyänen
  rationale: Die zoologische Bestimmung ist unsicher; „Hyänen“ passt als heutiger Vorschlag zum Bild aasfressender Tiere in einer verwüsteten Landschaft. Die Alternative „Schakale“ wird in der Fußnote bewahrt.
- source_word: שָׂעִיר
  choice: Bocksdämon
  rationale: Im Zusammenhang der unheimlich bevölkerten Einöde liegt die dämonische Bedeutung näher als die bloße Bezeichnung eines Ziegenbocks; anders als „Satyr“ vermeidet die Wiedergabe eine griechisch-römische Festlegung.
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: ruft dem anderen zu
  rationale: Die natürliche deutsche Formulierung gibt wieder, dass eines dieser Wesen einem Artgenossen oder Gefährten zuruft, ohne Geschlecht oder Beziehung näher festzulegen.
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt und pointiert die folgende Aussage; „Ja“ ist im Deutschen knapp und idiomatisch.
- source_word: הִרְגִּיעָה
  choice: lässt sich nieder
  rationale: Das Verb beschreibt, wie jemand zur Ruhe kommt oder sich niederlässt; diese Wiedergabe vermeidet eine unnötige Wiederholung vor „Ruheplatz“.
- source_word: לִּילִית
  choice: Lilith
  rationale: Das seltene Wort ist umstritten. Die Transliteration bewahrt seine mögliche mythische Färbung und vermeidet eine nicht gesicherte zoologische Identifizierung.
- source_word: מָנוֹחַ
  choice: einen Ruheplatz
  rationale: Das Substantiv bezeichnet hier passend einen Ort der Ruhe in der verwüsteten Landschaft.
theological_decisions:
- issue: Ob die Wesen der Wüste in diesem Gerichtsbild entmythologisiert werden sollen
  choice: Die wahrscheinlich übernatürliche oder mythische Färbung bleibt mit „Bocksdämon“ und „Lilith“ erhalten.
  alternative: Beide Ausdrücke ausschließlich als gewöhnliche Wüstentiere oder Vögel wiedergeben.
  rationale: Die Bildsprache zeichnet bewusst eine unheimliche, von sonderbaren Wesen bewohnte Einöde. Diese Wiedergabe bewahrt die Spannung des hebräischen Textes, ohne daraus eine weitergehende Dämonenlehre abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Präsens dient als lebendige deutsche Wiedergabe der hebräischen Verbfolge im Zukunftsbild. Die ungewöhnlichen Wesen werden nicht geglättet; Unsicherheiten erscheinen knapp in den Fußnoten.
