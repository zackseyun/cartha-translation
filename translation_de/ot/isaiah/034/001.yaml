source:
  edition: WLC
  text: קִרְב֤וּ גוֹיִם֙ לִ/שְׁמֹ֔עַ וּ/לְאֻמִּ֖ים הַקְשִׁ֑יבוּ תִּשְׁמַ֤ע הָ/אָ֨רֶץ֙ וּ/מְלֹאָ֔/הּ תֵּבֵ֖ל וְ/כָל צֶאֱצָאֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: de
  text: Kommt herzu, ihr Nationen, um zu hören; ihr Völker, hört aufmerksam zu! Die Erde und alles, was sie erfüllt, sollen hören, der Erdkreis und alles, was aus ihm hervorgeht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „all seine Nachkommen“ oder „all seinen Ertrag“. Der hebräische Ausdruck bezeichnet das, was aus dem Erdkreis hervorgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  choice: Kommt herzu
  rationale: Der Qal-Imperativ Plural fordert die Nationen auf, sich zu nähern. „Kommt herzu“ bewahrt die räumliche Bildlichkeit und klingt als prophetischer Aufruf würdig und verständlich.
- source_word: גוֹיִם
  choice: Nationen
  rationale: Im universalen prophetischen Aufruf bezeichnet das Wort die Nationen der Welt, nicht spezifisch „Heiden“ im späteren religiösen Gegensatz.
- source_word: לִשְׁמֹעַ
  choice: um zu hören
  rationale: Der Infinitiv gibt den Zweck des Herzukommens an und erhält zugleich die Wiederaufnahme der Wurzel שמע im zweiten Halbvers.
- source_word: לְאֻמִּים
  choice: Völker
  rationale: „Völker“ bildet das poetische Synonym zu „Nationen“ ab, ohne beide hebräischen Begriffe gleich wiederzugeben.
- source_word: הַקְשִׁיבוּ
  choice: hört aufmerksam zu
  rationale: Der Hifil-Imperativ bezeichnet aufmerksames Hinhören. Die Formulierung unterscheidet ihn verständlich vom schlichteren שמע.
- source_word: תִּשְׁמַע
  choice: soll hören
  rationale: Das Imperfekt hat hier auffordernden beziehungsweise jussivischen Sinn. „Soll hören“ gibt diesen feierlichen Aufruf im Deutschen natürlich wieder.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Parallelismus mit „Erdkreis“ und die umfassende Anrede sprechen für die globale Bedeutung, nicht für „Land“.
- source_word: מְלֹאָהּ
  choice: alles, was sie erfüllt
  rationale: Die Wendung bezeichnet die gesamte Fülle beziehungsweise alles, was die Erde enthält, und wahrt die konkrete Bildsprache.
- source_word: תֵּבֵל
  choice: der Erdkreis
  rationale: תבל bezeichnet die bewohnte beziehungsweise geordnete Welt. „Erdkreis“ unterscheidet den Ausdruck von הארץ und passt zum gehobenen prophetischen Register.
- source_word: כָל צֶאֱצָאֶיהָ
  choice: alles, was aus ihm hervorgeht
  rationale: צאצאים bezeichnet wörtlich das Hervorgegangene beziehungsweise die Nachkommenschaft. Die Formulierung bewahrt die generative Bildlichkeit, ohne den Bezug vorschnell nur auf Menschen oder nur auf Erzeugnisse festzulegen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger prophetischer Aufruf mit klarer poetischer Parallelität. „Nationen/Völker“ und „Erde/Erdkreis“ bilden die unterschiedlichen hebräischen Begriffe ab. Die Mehrdeutigkeit von צאצאיה zwischen Nachkommenschaft, Hervorgegangenem und Ertrag bleibt durch Haupttext und Fußnote erhalten.
