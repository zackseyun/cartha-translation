  text: לַ֤יְלָה וְ/יוֹמָם֙ לֹ֣א תִכְבֶּ֔ה לְ/עוֹלָ֖ם יַעֲלֶ֣ה עֲשָׁנָ֑/הּ מִ/דּ֤וֹר לָ/דוֹר֙ תֶּחֱרָ֔ב לְ/נֵ֣צַח נְצָחִ֔ים אֵ֥ין עֹבֵ֖ר בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: de
  text: Bei Nacht und bei Tag wird es nicht erlöschen; für immer wird sein Rauch aufsteigen. Von Generation zu Generation wird es verwüstet daliegen[a]; für immer und ewig wird niemand es durchqueren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird es verödet sein. Das hebräische Verb kann einen Zustand der Verwüstung oder der Verödung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  choice: Bei Nacht und bei Tag
  rationale: Die Wortpaarung bezeichnet ununterbrochene Dauer. Die gewählte Formulierung bewahrt Reihenfolge und Merismus des Hebräischen und klingt im Deutschen natürlich.
- source_word: לֹא תִכְבֶּה
  choice: wird es nicht erlöschen
  rationale: כבה bezeichnet beim Feuer das Erlöschen beziehungsweise Gelöschtwerden. „Nicht erlöschen“ ist idiomatisch und lässt die im Kontext vorausgesetzte Flamme unausgesprochen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם drückt hier eine fortdauernde, unbegrenzte Zeit aus. „Für immer“ erhält die uneingeschränkte Kraft der Gerichtsaussage.
- source_word: יַעֲלֶה עֲשָׁנָהּ
  choice: wird sein Rauch aufsteigen
  rationale: עלה mit עשן ist die übliche Verbindung für aufsteigenden Rauch. Das Possessivpronomen richtet sich im Deutschen idiomatisch nach dem vorausgesetzten Gebiet.
- source_word: מִדּוֹר לָדוֹר
  choice: Von Generation zu Generation
  rationale: Die feste Wendung beschreibt eine Dauer über aufeinanderfolgende Generationen hinweg und lässt sich nahezu formgleich und verständlich wiedergeben.
- source_word: תֶּחֱרָב
  choice: wird es verwüstet daliegen
  rationale: חרב bezeichnet hier das Verwüstet- oder Verödetsein. „Verwüstet daliegen“ bringt sowohl das Gerichtsgeschehen als auch den daraus folgenden Zustand zum Ausdruck; die mögliche Nuance wird in der Fußnote kenntlich gemacht.
- source_word: לְנֵצַח נְצָחִים
  choice: für immer und ewig
  rationale: Die intensivierte Zeitformel betont eine unabsehbare Dauer. Die deutsche feste Wendung gibt diese Steigerung natürlich und würdig wieder.
- source_word: אֵין עֹבֵר בָּהּ
  choice: wird niemand hindurchziehen
  rationale: אֵין mit dem Partizip bezeichnet das Fehlen eines Durchziehenden. Im Zusammenhang hat die Aussage zukunftsbezogene beziehungsweise resultative Kraft.
theological_decisions:
- issue: Zeitangaben in der Gerichtsankündigung
  choice: Die wiederholten Ausdrücke werden uneingeschränkt mit „für immer“ und „für immer und ewig“ wiedergegeben.
  alternative: Eine abschwächende Wiedergabe wie „für lange Zeiten“ oder „auf unabsehbare Zeit“.
  rationale: Der hebräische Text häuft עוֹלָם und נֵצַח נְצָחִים, um die Dauer nachdrücklich zu betonen. Die Übersetzung bewahrt diese prophetische Spannung, ohne sie durch eine zeitliche Einschränkung vorab auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Satzstruktur und die mehrfachen Zeitformeln des Hebräischen bleiben erkennbar; unnötig altertümliche Formen werden vermieden.
