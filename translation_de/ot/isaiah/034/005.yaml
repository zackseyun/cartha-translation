source:
  edition: WLC
  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: de
  text: Denn mein Schwert hat sich im Himmel satt getrunken[a]. Siehe, auf Edom fährt es herab, auf das Volk, das ich dem Untergang geweiht habe[b], zum Gericht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Schwert ist im Himmel gesättigt« oder »ist im Himmel durchtränkt«. Das hebräische Verb bezeichnet Sättigung oder völliges Durchtränktsein; die bildhafte Formulierung legt nicht fest, womit das Schwert gesättigt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »das Volk meines Bannes«. Das hebräische Wort חֵרֶם bezeichnet hier ein Volk, das im göttlichen Gericht zur Vernichtung bestimmt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Funktion, ohne sie enger als nötig festzulegen.
- source_word: רִוְּתָה
  choice: ist … trunken geworden
  rationale: Gibt das Bild der Wurzel רוה, vom Satt- oder Trunkenwerden, bewusst anschaulich wieder und vermeidet die Festlegung darauf, womit das Schwert getränkt ist.
- source_word: בַשָּׁמַיִם
  choice: im Himmel
  rationale: Natürliches modernes Deutsch für den hebräischen Plural שׁמים und zugleich Bewahrung des kosmischen Schauplatzes.
- source_word: חַרְבִּי
  choice: mein Schwert
  rationale: Direkte Wiedergabe der Possessivkonstruktion; das Schwert erscheint im Kontext als Gottes Gerichtswerkzeug.
- source_word: הִנֵּה
  choice: Seht
  rationale: Ein würdiger, gegenwärtiger Aufmerksamkeitsruf, der weniger altertümlich als „Siehe“ klingt.
- source_word: עַל אֱדוֹם תֵּרֵד
  choice: auf Edom fährt es herab
  rationale: Bewahrt sowohl die räumliche Bewegung aus dem Himmel als auch die feindliche Stoßrichtung von עַל.
- source_word: עַם חֶרְמִי
  choice: das Volk, das ich dem Untergang geweiht habe
  rationale: Macht die Bedeutung von חֵרֶם als Aussonderung zur Vernichtung im göttlichen Gericht verständlich, ohne sie zu einer bloßen Verwünschung abzuschwächen.
- source_word: לְמִשְׁפָּט
  choice: zum Gericht
  rationale: Gibt die gerichtliche Handlung beziehungsweise Vollstreckung prägnant wieder.
theological_decisions:
- issue: Bedeutung von חֵרֶם im Kontext göttlichen Gerichts
  choice: dem Untergang geweiht
  alternative: mit meinem Bann belegt
  rationale: Die gewählte Formulierung vermittelt die schwerwiegende Aussonderung zur Vernichtung, während „Bann“ im heutigen Deutsch leicht unklar bleibt. Die Fußnote hält die hebräische Begrifflichkeit sichtbar.
- issue: Bildgehalt von רִוְּתָה
  choice: trunken geworden
  alternative: getränkt / gesättigt
  rationale: Die ungewöhnliche Personifikation des Schwertes und die Mehrdeutigkeit zwischen Trinken, Sättigung und Durchtränkung werden im Haupttext nicht vorschnell auf Blut festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Bildsprache bleibt erhalten; schwer verständliche Hebraismen werden im Haupttext erschlossen und in den Fußnoten transparent gemacht.
