source:
  edition: WLC
  text: וְ/הֽוּא הִפִּ֤יל לָ/הֶן֙ גּוֹרָ֔ל וְ/יָד֛/וֹ חִלְּקַ֥תָּ/ה לָ/הֶ֖ם בַּ/קָּ֑ו עַד עוֹלָם֙ יִֽירָשׁ֔וּ/הָ לְ/ד֥וֹר וָ/ד֖וֹר יִשְׁכְּנוּ בָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: de
  text: Er selbst hat für sie das Los geworfen, und seine Hand hat es ihnen mit der Messschnur zugeteilt. Für immer werden sie es besitzen[a]; von Generation zu Generation werden sie darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden sie es als Erbbesitz erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Er selbst
  rationale: Das selbstständige Pronomen ist betont; „Er selbst“ bewahrt diesen Nachdruck in natürlichem Deutsch.
- source_word: הִפִּיל ... גּוֹרָל
  choice: hat ... das Los geworfen
  rationale: Die Hifil-Form von נפל bildet mit גּוֹרָל die feste Wendung für das Werfen eines Loses. Das Perfekt gibt die abgeschlossene Zuteilung mit fortdauernder Wirkung wieder.
- source_word: לָהֶן
  choice: für sie
  rationale: Die feminine Pluralform verweist im Zusammenhang auf die zuvor genannten Tiere beziehungsweise Vögel; „für sie“ entspricht der Zuteilung durch das Los.
- source_word: וְיָדוֹ
  choice: und seine Hand
  rationale: Die Formulierung erhält das anthropomorphe Bild von Gottes unmittelbarem Handeln.
- source_word: חִלְּקַתָּה לָהֶם
  choice: hat es ihnen ... zugeteilt
  rationale: חלק bezeichnet hier die Zuweisung eines abgemessenen Gebietes. Das feminine Objektsuffix wird als „es“ wiedergegeben, ohne den im Vers nicht ausdrücklich genannten Gegenstand zu ergänzen.
- source_word: בַּקָּו
  choice: mit der Messschnur
  rationale: קָו bezeichnet im Kontext der Landvermessung eine Messschnur. Die ausdrückliche Wiedergabe macht das Bild im modernen Deutsch verständlich.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wendung gibt die unbegrenzte Dauer knapp und ohne Archaismus wieder.
- source_word: יִירָשׁוּהָ
  choice: werden sie es besitzen
  rationale: ירשׁ kann Besitzergreifung, dauerhaften Besitz oder Erbbesitz bezeichnen. „Besitzen“ passt hier zur dauerhaften Zuweisung; die erbrechtliche Nuance bleibt in einer Fußnote sichtbar.
- source_word: לְדוֹר וָדוֹר
  choice: von Generation zu Generation
  rationale: Dies ist die natürliche und zugleich feierliche deutsche Entsprechung der distributiven hebräischen Wendung.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: werden sie darin wohnen
  rationale: שׁכן bezeichnet dauerhaftes Wohnen oder Sich-Niederlassen; „wohnen“ bewahrt den fortdauernden Charakter.
theological_decisions:
- issue: Bezug der Pronomen in der Zuteilungsszene
  choice: Die Pronomen bleiben stehen und beziehen sich im unmittelbaren Zusammenhang auf die zuvor genannten wilden Tiere und Vögel, denen das verwüstete Land zugewiesen wird.
  alternative: Die Pronomen könnten allgemeiner auf Bewohner der verwüsteten Gegend bezogen werden.
  rationale: Jesaja 34,11.13–15 nennt Tiere und Vögel als Bewohner Edoms. Der Wechsel zwischen femininen und maskulinen Pluralformen lässt sich kollektiv verstehen. Da der Vers selbst keine Substantive wiederholt, ergänzt die Übersetzung keine ausdrückliche Benennung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem parallelen Aufbau des Hebräischen, bleibt aber flüssig. Das Vermessungsbild wird mit „Messschnur“ ausdrücklich wiedergegeben; ungenannte Bezugswörter werden nicht in den Haupttext eingefügt.
