source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: de
  text: Das Schwert Jahwes ist voll Blut; es ist mit Fett gesättigt, mit dem Blut von Lämmern und Ziegenböcken, mit dem Nierenfett von Widdern. Denn Jahwe hat in Bozra ein Schlachtopfer[a] und ein großes Schlachten im Land Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn für Jahwe gibt es in Bozra ein Schlachtopfer.“ Der hebräische Satz hat kein ausdrückliches Verb.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: das Schwert Jahwes
  rationale: 'Die Lamed-Verbindung bezeichnet hier am natürlichsten Zugehörigkeit bzw. Beziehung: Das Schwert ist Jahwes Gerichtswerkzeug. Der Gottesname wird als „Jahwe“ wiedergegeben.'
- source_word: מָלְאָה דָם
  choice: ist voll Blut
  rationale: Die knappe deutsche Form bewahrt den resultativen Zustand und die eindringliche Bildsprache des Hebräischen.
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: ist mit Fett gesättigt
  rationale: Das passive Verb bezeichnet ein Fett- oder Reichgemachtwerden. „Mit Fett gesättigt“ ist im Deutschen natürlich, behält aber das konkrete Opferbild bei.
- source_word: כָּרִים וְעַתּוּדִים
  choice: Lämmern und Ziegenböcken
  rationale: כָּרִים kann junge Widder bzw. Lämmer bezeichnen; עַתּוּדִים meint ausdrücklich männliche Ziegen. Die gewählte Fassung bildet die Tiergruppen im Opferbild klar ab.
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: mit dem Nierenfett von Widdern
  rationale: Die kompakte Form gibt sowohl das ausdrücklich genannte Fett als auch die Nieren und Widder wieder und entspricht der Opfersprache.
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: „Schlachtopfer“ wahrt den kultischen Sinn des Wortes und zugleich dessen bewusste Verbindung mit dem folgenden großen Schlachten.
- source_word: בָצְרָה
  choice: Bozra
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: טֶבַח גָּדוֹל
  choice: ein großes Schlachten
  rationale: Die substantivierte Wendung bewahrt die harte, konkrete Gerichtssprache und den sprachlichen Zusammenhang mit dem Schlachtopfer.
theological_decisions:
- issue: Opfersprache als Bild für das Gericht über Edom
  choice: Die Begriffe „Fett“, „Nierenfett“, „Schlachtopfer“ und „Schlachten“ werden ausdrücklich beibehalten.
  alternative: Die Aussage allgemein als Kriegsniederlage oder Vernichtung umschreiben.
  rationale: Der Vers stellt Jahwes Gericht bewusst in kultisch-opferbezogenen Bildern dar. Eine Verallgemeinerung würde diese theologische Spannung und die drastische Bildsprache abschwächen.
- issue: Verhältnis Jahwes zum Schlachtopfer in der verblosen Klausel זֶבַח לַיהוָה
  choice: „Jahwe hat … ein Schlachtopfer“
  alternative: „Für Jahwe gibt es … ein Schlachtopfer“
  rationale: Die gewählte Form ist natürliches Deutsch und stellt das Opfer als von Jahwe bestimmtes Gerichtsgeschehen dar; die formal mögliche relationale Fassung wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst drastischer Bildsprache. „Gesättigt“ vermeidet das im Deutschen missverständliche „fett gemacht“, ohne das konkrete Fettmotiv aufzugeben; „Schlachtopfer“ und „Schlachten“ erhalten die kultisch-gerichtliche Wortverbindung.
