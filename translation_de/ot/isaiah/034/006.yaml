  source_fidelity: 'Die Übersetzung gibt die hebräische Bildfolge und Syntax insgesamt zuverlässig wieder: Jahwes Schwert ist mit Blut gefüllt und mit Opferfett gesättigt; Blut von Lämmern und Ziegenböcken sowie Nierenfett von Widdern werden ausdrücklich genannt. „Schlachtopfer“ für זֶבַח und „großes Schlachten“ für טֶבַח גָּדוֹל bewahren die absichtliche Verbindung von Opfersprache und Gericht. Die verblosene Klausel זֶבַח לַיהוָה wird mit einer idiomatischen Lesart wiedergegeben, während die mögliche alternative Zuordnung in der Fußnote erhalten bleibt.'
