  terminology: „Jahwe“, „Schwert“, „Fett“, „Nierenfett“, „Widder“, „Schlachtopfer“, „Bozra“ und „Edom“ sind terminologisch stimmig. „Ziegenböcke“ gibt die maskuline Spezifizierung von עַתּוּדִים präziser wieder als das englische „goats“.
