source:
  edition: WLC
  text: חֹרֶ֥י/הָ וְ/אֵֽין שָׁ֖ם מְלוּכָ֣ה יִקְרָ֑אוּ וְ/כָל שָׂרֶ֖י/הָ יִ֥הְיוּ אָֽפֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: de
  text: Sie werden ihre Edlen rufen[a], doch dort wird es kein Königtum geben, und alle ihre Fürsten werden nichts sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Edlen werden rufen, doch dort wird es kein Königtum geben.« Der hebräische Satz ist an dieser Stelle schwer zu deuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: seine Edlen
  rationale: חֹר bezeichnet hier Angehörige der freien aristokratischen Oberschicht. »Edle« passt zum politischen Zusammenhang und zur Parallele »Fürsten«.
- source_word: וְאֵין שָׁם
  choice: doch dort wird es kein … geben
  rationale: Die adversative Wiedergabe verbindet den Ruf nach den Edlen mit dem völligen Fehlen politischer Herrschaft und bewahrt die örtliche Angabe שָׁם.
- source_word: מְלוּכָה
  choice: Königtum
  rationale: מְלוּכָה kann Königsherrschaft, Königtum oder Königreich bezeichnen. »Königtum« hebt hier die nicht mehr bestehende politische Ordnung hervor, ohne ein Territorium vorauszusetzen.
- source_word: יִקְרָאוּ
  choice: sie werden … rufen
  rationale: Die Grundbedeutung von קרא wird beibehalten. Wegen der schwierigen Satzfügung bleibt offen, wer genau ruft und zu welchem Zweck die Edlen gerufen werden.
- source_word: שָׂרֶיהָ
  choice: seine Fürsten
  rationale: שַׂר bezeichnet einen Fürsten, hohen Amtsträger oder Herrscher. »Fürsten« wahrt das gehobene politische Register und die Parallele zu den Edlen.
- source_word: יִהְיוּ אָפֶס
  choice: werden nichts sein
  rationale: Die Wendung bezeichnet vollständiges Verschwinden beziehungsweise Bedeutungslosigkeit. Die knappe Formulierung bildet die Härte des hebräischen Urteils nach.
theological_decisions:
- issue: Die schwierige Syntax des ersten Halbverses
  choice: Ein unbestimmtes »sie« ruft die Edlen; dem steht das Fehlen jedes Königtums gegenüber.
  alternative: »Seine Edlen werden rufen, doch dort wird es kein Königtum geben.«
  rationale: Die masoretische Wortfolge lässt die syntaktische Beziehung von חֹרֶיהָ und יִקְרָאוּ nicht eindeutig erkennen. Der Haupttext folgt einer möglichen Objektlesart, während die Fußnote die ebenso mögliche Subjektlesart offenhält; keine bestimmte politische Zeremonie wird in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gerichtssprache und die syntaktische Mehrdeutigkeit des ersten Halbverses bleiben erhalten.
