source:
  edition: WLC
  text: כִּ֛י י֥וֹם נָקָ֖ם לַֽ/יהוָ֑ה שְׁנַ֥ת שִׁלּוּמִ֖ים לְ/רִ֥יב צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: de
  text: Denn Jahwe hat einen Tag der Rache, ein Jahr der Vergeltung für Zions Rechtsstreit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn für Jahwe ist ein Tag der Rache, ein Jahr der Vergeltung für Zions Sache.«'
    reason: Bewahrt sowohl die mögliche relationale Wiedergabe des ל bei Jahwe als auch das breitere Bedeutungsspektrum von רִיב.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Gerichtsankündigung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: יוֹם נָקָם
  choice: einen Tag der Rache
  rationale: Bewahrt die hebräische Zeitangabe und den Gedanken strafender Vergeltung in einer geläufigen deutschen Verbindung.
- source_word: לַיהוָה
  choice: Jahwe hat
  rationale: Das ל kann hier Besitz oder Zuordnung ausdrücken; die deutsche Haben-Konstruktion gibt diesen Sinn klar und idiomatisch wieder.
- source_word: שְׁנַת שִׁלּוּמִים
  choice: ein Jahr der Vergeltung
  rationale: Der abstrakt beziehungsweise intensiv gebrauchte Plural bezeichnet angemessene Wiedervergeltung; die Formulierung erhält zugleich den Parallelismus zu »einen Tag«.
- source_word: לְרִיב צִיּוֹן
  choice: für Zions Rechtsstreit
  rationale: רִיב besitzt einen forensischen Sinn und kann einen Streitfall oder eine Rechtssache bezeichnen; »Rechtsstreit« macht diese Dimension sichtbar, ohne den Ausgang ausdrücklich vorwegzunehmen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Bundesname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von לַיהוָה
  choice: 'possessiv beziehungsweise relational: »Jahwe hat einen Tag der Rache«'
  alternative: »für Jahwe ist ein Tag der Rache« beziehungsweise »Jahwe gehört ein Tag der Rache«
  rationale: Die gewählte Konstruktion ist im modernen Deutschen idiomatisch und bewahrt die Zuordnung dieses Gerichtstages zu Jahwe.
- issue: Forensischer Sinn von רִיב
  choice: Zions Rechtsstreit
  alternative: Zions Sache
  rationale: »Rechtsstreit« wahrt den möglichen gerichtlichen Sinn deutlicher; eine Fußnote nennt die breitere, weniger technische Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus »Tag … Jahr« bleibt erhalten; die gerichtliche Bildsprache wird nicht abgeschwächt. Der Fußnotenmarker [a] steht im Haupttext.
