id: ISA.34.2
reference: Isaiah 34:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: de
  text: Denn Jahwes Zorn richtet sich gegen alle Völker, sein Grimm gegen ihr ganzes Heer[a]. Er hat sie dem Untergang geweiht[b] und der Schlachtung preisgegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre ganze Streitmacht«; das hebräische Wort ist ein Sammelbegriff und kann ein Heer oder eine Heerschar bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit dem Bann belegt«; das hebräische Verb bezeichnet hier, dass jemand oder etwas unter göttlichem Gericht der Vernichtung bestimmt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf und die angekündigte Gerichtsszene ein.
- source_word: קֶצֶף לַיהוָה
  choice: Jahwes Zorn richtet sich
  rationale: Gibt die nominale hebräische Konstruktion idiomatisch wieder und bewahrt den Gedanken des gegen die Völker gerichteten göttlichen Zorns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: עַל כָּל הַגּוֹיִם
  choice: gegen alle Völker
  rationale: עַל bezeichnet bei Zorn die Zielrichtung; גּוֹיִם meint hier umfassend die Völker.
- source_word: וְחֵמָה
  choice: sein Grimm
  rationale: Bewahrt die Steigerung und unterscheidet חֵמָה sprachlich von קֶצֶף, ohne beide Begriffe gleich wiederzugeben.
- source_word: עַל כָּל צְבָאָם
  choice: gegen ihr ganzes Heer
  rationale: צָבָא ist ein kollektiver Ausdruck für Heer oder Streitmacht; der Singular des Ausgangstextes bleibt erhalten.
- source_word: הֶחֱרִימָם
  choice: Er hat sie dem Untergang geweiht
  rationale: Der Hifil von חרם bezeichnet hier die unwiderrufliche Bestimmung zur Vernichtung im göttlichen Gericht und nicht lediglich eine bereits vollzogene Tötung.
- source_word: נְתָנָם לַטָּבַח
  choice: und der Schlachtung preisgegeben
  rationale: Gibt das gerichtliche Ausliefern durch נתן sowie das substantivische Bild von טֶבַח in natürlichem, feierlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הֶחֱרִימָם
  choice: dem Untergang geweiht
  alternative: mit dem Bann belegt / völlig vernichtet
  rationale: Die gewählte Formulierung bewahrt den Gedanken des חרם, also einer unter göttlichem Gericht zur Vernichtung bestimmten Hingabe, ohne den Vorgang vorschnell nur als vollzogene Vernichtung zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Begriffe »Zorn« und »Grimm« erhalten die Intensivierung des Hebräischen; »Schlachtung« bewahrt bewusst die Härte des Gerichtsbildes.
