base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: de
  text: Dort wird die Pfeilschlange[a] nisten, Eier legen und sie ausbrüten; sie wird sie in ihrem Schatten bergen[b]. Ja, dort werden sich die Milane[c] versammeln, eine bei ihrer Gefährtin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort קִפּוֹז ist in seiner Bedeutung unsicher; gemeint sein könnte auch eine Eule oder ein anderes Wüstentier.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sie wird in ihrem Schatten über ihnen brüten.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Geier“; allgemeiner auch: „Greifvögel“.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: Pfeilschlange
  rationale: Das nur hier belegte Tierwort ist äußerst unsicher. „Pfeilschlange“ gibt eine mögliche Deutung als schnell vorschnellendes Reptil wieder, ohne die Unsicherheit zu verschweigen.
- source_word: קִנְּנָה
  choice: wird … nisten
  rationale: Das Verb קנן bedeutet „nisten“. Das Futur fügt sich in die prophetische Schilderung der kommenden Verwüstung.
- source_word: וַתְּמַלֵּט
  choice: Eier legen
  rationale: Das Verb bezeichnet das Hervorbringen von Nachwuchs; im Zusammenhang mit Nest, Schlüpfen und Brüten ist „Eier legen“ die natürliche zoologische Wiedergabe.
- source_word: וּבָקְעָה
  choice: sie ausbrüten
  rationale: בקע bedeutet wörtlich „aufbrechen, spalten“ und bezeichnet hier wahrscheinlich das Ausschlüpfen beziehungsweise Ausbrüten der Eier. Das Pronomen macht das im Hebräischen vorausgesetzte Objekt deutlich.
- source_word: וְדָגְרָה בְצִלָּהּ
  choice: sie wird ihre Jungen in ihrem Schatten bergen
  rationale: דגר kann das Brüten oder das schützende Sammeln bezeichnen. Die gewählte Formulierung gibt das Bild des Schutzes im Schatten des Muttertiers natürlich wieder; die engere Bedeutung „brüten“ bleibt in der Fußnote erhalten.
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die Gewissheit der geschilderten Szene und ist nicht einschränkend zu verstehen.
- source_word: דַיּוֹת
  choice: Milane
  rationale: Das Wort bezeichnet wahrscheinlich Milane oder ähnliche Greif- beziehungsweise Aasvögel. Die mögliche größere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: אִשָּׁה רְעוּתָהּ
  choice: jeder bei seinem Gefährten
  rationale: Wörtlich steht eine distributive weibliche Wendung, „eine bei ihrer Gefährtin“. Im Deutschen vermittelt „jeder bei seinem Gefährten“ das paarweise Beisammensein natürlich, ohne zwingend eine Paarungsbeziehung festzulegen.
