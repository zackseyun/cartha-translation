base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: de
  text: Ihre Erschlagenen werden hinausgeworfen[a], und der Gestank ihrer Leichen wird aufsteigen[b]; die Berge werden von ihrem Blut zerschmelzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weggeworfen“. Das hebräische Verb kann sowohl „hinauswerfen“ als auch „wegwerfen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr übler Geruch wird aufsteigen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das ist drastische, übersteigerte prophetische Gerichtssprache: Das Blutvergießen wird als so gewaltig dargestellt, dass selbst die Berge von ihrem Blut zerschmelzen.'
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: ihre Erschlagenen
  rationale: Das substantivierte חָלָל bezeichnet hier im Zusammenhang des Gerichts die im Kampf Erschlagenen; die Wiedergabe bewahrt diesen martialischen Sinn.
- source_word: יֻשְׁלָכוּ
  choice: werden hinausgeworfen
  rationale: Das Passiv von שלך bezeichnet ein Werfen beziehungsweise Wegschaffen. „Hinausgeworfen“ vermittelt zugleich die schmachvolle Preisgabe der unbestatteten Toten.
- source_word: פִגְרֵיהֶם
  choice: ihre Leichen
  rationale: פֶּגֶר bezeichnet einen toten Körper. „Leichen“ ist im modernen Deutschen natürlich und bewahrt die Härte des Bildes.
- source_word: יַעֲלֶה
  choice: wird aufsteigen
  rationale: עלה bedeutet „hinaufgehen/aufsteigen“; auf einen Geruch bezogen ist „aufsteigen“ eine natürliche und bildtreue Wiedergabe.
- source_word: בָאְשָׁם
  choice: der Gestank ihrer Leichen
  rationale: בָּאְשָׁה bezeichnet üblen Geruch beziehungsweise Gestank; das Suffix verweist auf die zuvor genannten Leichen. Die deutsche Formulierung macht diesen Bezug klar.
- source_word: וְנָמַסּוּ
  choice: werden zerfließen
  rationale: מסס kann „schmelzen, sich auflösen, zerfließen“ bedeuten. „Zerfließen“ erhält das drastische prophetische Bild und passt natürlich zu Bergen, die durch Blut gleichsam aufgelöst werden.
- source_word: הָרִים
  choice: die Berge
  rationale: הָרִים bedeutet eindeutig „Berge“ und sollte nicht zu „Hügel“ abgeschwächt werden.
- source_word: מִדָּמָם
  choice: von ihrem Blut
  rationale: Die Präposition מן kann Ursprung oder Ursache ausdrücken. „Von ihrem Blut“ bewahrt diese knappe Mehrdeutigkeit, ohne den Mechanismus des Bildes festzulegen.
theological_decisions:
- issue: Art der Bildsprache im göttlichen Gericht
  choice: 'Die drastische prophetische Gerichtssprache wird ungemildert bewahrt: Die Berge zerfließen von ihrem Blut.'
  alternative: 'Erklärend abschwächen, etwa: „Die Berge werden von ihrem Blut getränkt.“'
  rationale: Der hebräische Text schildert Blutvergießen und kosmische Auflösung in bewusst schockierenden Bildern. Eine erklärende Umschreibung würde die Intensität verringern und das Bild vorschnell auslegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer Bildsprache. Der Parallelismus und die Zukunftsformen des hebräischen Gerichtsworts bleiben erhalten; „zerfließen“ bewahrt die poetische Kraft, ohne die Ursache-Wirkung-Beziehung über die Präposition מן hinaus zu präzisieren.
