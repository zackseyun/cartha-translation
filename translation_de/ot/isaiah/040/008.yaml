source:
  edition: WLC
  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: de
  text: Das Gras verdorrt, die Blume verwelkt[a], aber das Wort unseres Gottes wird für immer bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen zwei verschiedene, bedeutungsnahe Verben: Das Gras „verdorrt“, die Blume „verwelkt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: verdorrt
  rationale: Das Qal von יבש bezeichnet das Trockenwerden. „Verdorrt“ ist im Deutschen bei Gras natürlich und bewahrt das Bild der Vergänglichkeit.
- source_word: חָצִיר
  choice: Gras
  rationale: Im poetischen Zusammenhang bezeichnet חָצִיר die vergängliche Vegetation; „Gras“ ist die geläufige und passende Wiedergabe.
- source_word: נָבֵל
  choice: verwelkt
  rationale: נבל kann das Welken oder Verblassen bezeichnen. „Verwelkt“ passt natürlich zur Blume und unterscheidet das Verb von „verdorrt“ im ersten Satzglied.
- source_word: צִיץ
  choice: Blume
  rationale: צִיץ bezeichnet hier parallel zum Gras eine Blüte oder Blume. „Blume“ ist allgemein verständlich und idiomatisch.
- source_word: וּדְבַר
  choice: aber das Wort
  rationale: Das Waw ist formal verbindend, trägt hier durch den Gegensatz zwischen vergänglicher Vegetation und Gottes bleibendem Wort jedoch adversative Kraft. „Aber“ macht diesen im Parallelismus angelegten Kontrast natürlich deutlich.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: 'Die Form אֱלֹהִים mit dem Suffix der ersten Person Plural bezeichnet im israelitischen Sprachgebrauch den einen Gott: „unser Gott“.'
- source_word: יָקוּם
  choice: wird bestehen
  rationale: קום bedeutet grundsätzlich „aufstehen/stehen“ und bezeichnet hier dauerhaften Bestand. „Wird bestehen“ bewahrt die konkrete Vorstellung besser als eine rein abstrakte Wiedergabe wie „wird fortdauern“.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier unbegrenzte Dauer. „Für immer“ ist die natürliche moderne deutsche Entsprechung.
theological_decisions:
- issue: Gegensatz zwischen vergänglicher Schöpfung und dem bleibenden Reden Gottes
  choice: „aber“ im Haupttext
  alternative: „und“
  rationale: Das hebräische Waw kann formal mit „und“ wiedergegeben werden; der poetische Zusammenhang stellt jedoch einen klaren Gegensatz her. „Aber“ drückt diesen aus, ohne eine zusätzliche Lehraussage einzutragen.
- issue: Wiedergabe von דָּבָר
  choice: „Wort“
  alternative: „Botschaft“ oder „Verheißung“
  rationale: דָּבָר hat einen breiten Bedeutungsumfang. „Wort“ erhält diese Offenheit und verengt Gottes Aussage nicht auf eine bestimmte Art des Redens.
- issue: Zeitbezug der Perfektformen יָבֵשׁ und נָבֵל
  choice: 'gnomisches Präsens: „verdorrt“, „verwelkt“'
  alternative: 'Vergangenheit: „ist verdorrt“, „ist verwelkt“'
  rationale: Die poetische Aussage beschreibt eine allgemein gültige Wirklichkeit. Das deutsche Präsens gibt diesen sprichwortartigen Charakter natürlich wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die beiden unterschiedlichen Verben des Hebräischen bleiben hörbar; „wird für immer bestehen“ verbindet natürliche Sprache mit dem konkreten Bild von קום.
