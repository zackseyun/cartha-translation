source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: de
  text: Das Gras vertrocknet, die Blume verwelkt, denn der Atem Jahwes weht darüber[a]. Gewiss, Gras ist das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn der Wind Jahwes weht darüber“; weniger wahrscheinlich: „denn der Geist Jahwes weht darüber“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֵשׁ
  choice: vertrocknet
  rationale: Das Qal-Perfekt bezeichnet das Trockenwerden; das deutsche Präsens entspricht hier dem poetischen, allgemein gültigen Aussagecharakter.
- source_word: חָצִיר
  choice: Gras
  rationale: Im Bild von Vergänglichkeit und im Zusammenhang des Abschnitts ist „Gras“ die natürliche und präzise Wiedergabe.
- source_word: נָבֵל
  choice: verwelkt
  rationale: Das Verb bezeichnet das Welken oder Verblassen von Pflanzen; „verwelkt“ passt idiomatisch zur Blume und erhält den Parallelismus.
- source_word: צִיץ
  choice: Blume
  rationale: „Blume“ ist in diesem Bild allgemein verständlich und gibt die vergängliche Blüte natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Ursache des Vertrocknens und Verwelkens ein; „denn“ wahrt den gehobenen poetischen Ton.
- source_word: רוּחַ
  choice: Atem
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. „Atem“ verbindet die Wirkung des Wehens mit Jahwe als handelnder Person, ohne die mögliche Windbedeutung zu beseitigen; diese wird in der Fußnote ausgewiesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָשְׁבָה
  choice: weht
  rationale: Das Verb bedeutet „wehen/blasen“. Das Präsens ist im Deutschen für diese poetische allgemeine Aussage natürlich.
- source_word: בּוֹ
  choice: darüber
  rationale: Die Präposition mit Suffix bezeichnet das Wehen über beziehungsweise gegen das zuvor genannte Gras; „darüber“ ist im Deutschen natürlich und lässt den bildlichen Bezug bestehen.
- source_word: אָכֵן
  choice: Ja
  rationale: Die Partikel bekräftigt die abschließende Feststellung. „Ja“ gibt diesen Nachdruck knapp und idiomatisch wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: Der bestimmte Kollektivbegriff wird wörtlich als „das Volk“ wiedergegeben, ohne ihn ausdrücklich auf Israel oder die gesamte Menschheit festzulegen.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Atem Jahwes
  alternative: der Wind Jahwes; der Geist Jahwes
  rationale: Der unmittelbare Zusammenhang schildert, wie Vegetation durch göttliches Wehen vergeht. „Atem“ bewahrt sowohl die persönliche Zuordnung zu Jahwe als auch die bildhafte Nähe zum Wind; „Wind“ ist ebenfalls gut möglich, „Geist“ in diesem Kontext weniger wahrscheinlich.
- issue: Referenz von הָעָם
  choice: das Volk
  alternative: die Menschen; die Menschheit
  rationale: Der hebräische Text verwendet den bestimmten Ausdruck „das Volk“. Die Übersetzung bewahrt diese Form und lässt offen, ob im engeren Zusammenhang Israel oder repräsentativ die Menschen gemeint sind.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die parallelen Verben „vertrocknet“ und „verwelkt“ sowie der knappe Schlusssatz bewahren Rhythmus und Bildkraft des Hebräischen.
