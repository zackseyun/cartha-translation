base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: de
  text: Doch die auf Jahwe hoffen[a], gewinnen neue Kraft. Sie steigen auf mit Flügeln wie Adler[b]. Sie laufen und werden nicht müde; sie gehen und werden nicht matt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf Jahwe warten“. Das hebräische Verb verbindet erwartungsvolles Warten mit Hoffnung.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet große Greifvögel und kann neben Adlern auch Geier einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ יְהוָה
  choice: Doch die auf Jahwe hoffen
  rationale: Das Partizip von קוה bezeichnet erwartungsvolles Warten und Hoffen. „Auf Jahwe hoffen“ ist im heutigen Deutsch natürlich und bewahrt die zuversichtliche Erwartung; „Doch“ stellt den Gegensatz zur Erschöpfung der jungen Menschen im vorherigen Vers her.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: gewinnen neue Kraft
  rationale: Die Verbindung aus חלף im Hifil und כֹּחַ kann Erneuerung beziehungsweise Ersatz verbrauchter Kraft ausdrücken. „Gewinnen neue Kraft“ gibt dies idiomatisch wieder, ohne einen Kraftaustausch ausdrücklich festzulegen.
- source_word: יַעֲלוּ אֵבֶר
  choice: Sie steigen empor mit Flügeln
  rationale: עלה bezeichnet das Hinaufsteigen, אבר Flügel beziehungsweise Schwingen. Die Formulierung erhält das Bild der Aufwärtsbewegung.
- source_word: כַּ/נְּשָׁרִים
  choice: wie Adler
  rationale: נשר bezeichnet einen großen Greifvogel und kann je nach zoologischer Zuordnung auch Geier meinen. Im poetischen Bild ist „Adler“ die geläufige und passende Wiedergabe; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: יָרוּצוּ וְלֹא יִיגָעוּ
  choice: Sie laufen und werden nicht müde
  rationale: יגע beschreibt das Ermüden infolge von Anstrengung. Die deutsche Formulierung ist direkt und erhält den Parallelismus.
- source_word: יֵלְכוּ וְלֹא יִיעָפוּ
  choice: sie gehen und werden nicht matt
  rationale: יעף bezeichnet Mattigkeit oder Erschöpfung. „Matt werden“ unterscheidet sich sprachlich von „müde werden“ und bewahrt so die parallele, nicht völlig identische Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt den persönlichen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsspanne von קוה
  choice: auf Jahwe hoffen
  alternative: auf Jahwe warten
  rationale: קוה verbindet Warten mit erwartungsvoller Hoffnung. Im heutigen Deutsch vermittelt „hoffen“ die zuversichtliche Ausrichtung besonders natürlich; die zeitliche Nuance des Wartens bleibt in der Fußnote sichtbar.
- issue: Bedeutung von יחליפו כח
  choice: gewinnen neue Kraft
  alternative: erneuern ihre Kraft
  rationale: Die Wendung lässt sowohl Erneuerung als auch das Erlangen neuer Kraft anklingen. Die gewählte Fassung vermeidet die unnatürlich wörtliche Vorstellung eines Austauschs, ohne die Verheißung abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem poetischem Rhythmus. Die kurzen parallelen Sätze bilden die Bewegung vom Emporsteigen über das Laufen bis zum Gehen nach. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
