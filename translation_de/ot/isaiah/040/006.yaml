source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: de
  text: 'Eine Stimme sagt: »Rufe aus!« Und er sagte[a]: »Was soll ich ausrufen?« Alles Fleisch ist Gras[b], und all seine Anmut[c] ist wie die Blume des Feldes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer anderen Lesart: »Und ich sagte«.'
    reason: alternative_reading
  - marker: b
    text: „Alles Fleisch“ ist eine wörtliche Bezeichnung für die ganze Menschheit, also für alle Menschen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „all seine Pracht“. Das hebräische Wort bezeichnet sonst häufig Güte, Huld oder Treue; hier kann es das Anmutige, Prächtige oder Bewundernswerte am Menschen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל אֹמֵ֣ר
  choice: Eine Stimme sagt
  rationale: קוֹל bezeichnet hier am natürlichsten eine nicht näher bestimmte Stimme; das Partizip אֹמֵר stellt ihr Reden lebendig und gegenwärtig dar.
- source_word: קְרָ֔א ... אֶקְרָ֑א
  choice: Rufe aus! ... Was soll ich ausrufen?
  rationale: Die Wiederholung von קרא wird im Deutschen durch dasselbe Verb bewahrt. „Ausrufen“ vermittelt den nachdrücklichen, öffentlichen Charakter der prophetischen Rede.
- source_word: וְאָמַ֖ר
  choice: Und ich sagte
  rationale: Die masoretische Vokalisierung liest das Verb in der ersten Person Singular. Eine traditionelle Lesart in der dritten Person wird in Fußnote [a] erhalten.
- source_word: כָּל הַבָּשָׂ֣ר
  choice: Alles Fleisch
  rationale: Die wörtliche Wendung bewahrt das Bild für die vergängliche Menschheit und den unmittelbaren Gegensatz zum Gras.
- source_word: חָצִ֔יר
  choice: Gras
  rationale: „Gras“ ist die klare, übliche Wiedergabe des Bildes vergänglicher Vegetation.
- source_word: חַסְדּ֖וֹ
  choice: seine Anmut
  rationale: חֶסֶד hat gewöhnlich den Bedeutungsbereich Güte, Huld und Treue, bezeichnet hier im Parallelismus mit der Feldblume jedoch wahrscheinlich das Anziehende oder Bewundernswerte am Menschen. „Anmut“ bewahrt diese kontextuelle Bedeutung, ohne sie mit „Schönheit“ zu verengen; „Pracht“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: כְּצִ֥יץ הַשָּׂדֶֽה
  choice: wie die Blume des Feldes
  rationale: צִיץ bezeichnet eine Blüte oder Blume; die generische Formulierung gibt das Bild einer kurzlebigen Feldblume würdig und verständlich wieder.
theological_decisions:
- issue: Identität des Antwortenden in וְאָמַר
  choice: 'erste Person: „Und ich sagte“'
  alternative: 'dritte Person: „Und man sagte“ oder „Und er sagte“'
  rationale: Die masoretische Vokalisierung stützt die erste Person. Da die traditionelle Lesart in der dritten Person die Wahrnehmung des prophetischen Dialogs verändert, wird sie nicht stillschweigend ausgeschlossen, sondern in Fußnote [a] genannt.
- issue: Bedeutung von חַסְדּוֹ im Bild von Gras und Feldblume
  choice: „all seine Anmut“
  alternative: „all seine Pracht“; lexikalisch auch „all seine Güte/Treue“
  rationale: Der unmittelbare Parallelismus legt eine vergängliche menschliche Anmut oder Pracht nahe. Die sonst häufige Bedeutung „Güte/Treue“ wird nicht dogmatisch eingetragen, aber die semantische Spannung wird in Fußnote [c] offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „ausrufen“ bildet die Wiederholung des hebräischen Verbs ab. „Alles Fleisch“ bleibt als verständliches biblisches Bild stehen und wird erläutert; ungewöhnliche oder mehrdeutige Lesarten werden durch Fußnoten transparent gemacht.
