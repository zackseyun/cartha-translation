  text: הַ/נּוֹתֵ֥ן רוֹזְנִ֖ים לְ/אָ֑יִן שֹׁ֥פְטֵי אֶ֖רֶץ כַּ/תֹּ֥הוּ עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/023.yaml
  text: who brings princes to nothing[b][a], and makes the judges of the earth like emptiness.
translation:
  language: de
  text: der die Fürsten zunichtemacht und die Richter der Erde[a] der Leere gleichmacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „des Landes“; das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: Oder „dem Chaos“, „der Nichtigkeit“ beziehungsweise „dem Nichts gleich“; das hebräische תֹהוּ bezeichnet Leere, Öde, Chaos oder Unwirklichkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: der … zunichtemacht
  rationale: Der substantivierte Partizipialausdruck setzt die Beschreibung Gottes aus dem vorherigen Vers als Relativsatz fort. Zusammen mit לְאָיִן gibt „zunichtemacht“ die hebräische Wendung natürlich und kräftig wieder.
- source_word: רוֹזְנִים
  choice: Fürsten
  rationale: Das Wort bezeichnet hochrangige politische Würdenträger oder Machthaber. „Fürsten“ bewahrt den gehobenen prophetischen Sprachton.
- source_word: לְאָיִן
  choice: zunichte
  rationale: אַיִן bezeichnet Nichtsein oder Nichts. Die feste deutsche Wendung „zunichtemachen“ vermittelt hier, dass die Macht der Fürsten völlig aufgehoben wird.
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: die Richter der Erde
  rationale: Die Grundbedeutung „Richter“ bleibt erhalten; אֶרֶץ wird wegen des weltweiten Horizonts des Zusammenhangs mit „Erde“ wiedergegeben.
- source_word: כַּתֹּהוּ
  choice: der Leere gleich
  rationale: תֹהוּ kann Leere, Öde, Chaos oder Nichtigkeit bezeichnen. „der Leere gleich“ bewahrt das Bild und legt sich nicht unnötig auf die speziellere Bedeutung „Chaos“ fest.
- source_word: עָשָׂה
  choice: gleichmacht
  rationale: Obwohl die Verbform formal ein Perfekt ist, steht sie poetisch parallel zum Partizip und beschreibt Gottes charakteristisches Handeln; daher ist das deutsche Präsens angemessen.
theological_decisions:
- issue: Reichweite von אֶרֶץ in שֹׁפְטֵי אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Der nähere Zusammenhang von Jesaja 40 beschreibt Gottes Herrschaft über Welt und Völker. „Erde“ wahrt diesen universalen Horizont, während die lexikalisch mögliche lokale Lesart in einer Fußnote erhalten bleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Parallelismus. Der kleingeschriebene relative Anschluss „der“ spiegelt die syntaktische Fortsetzung der Gottesbeschreibung aus Vers 22. „der Leere gleichmacht“ ist bewusst bildhaft und bewahrt die Bedeutungsweite von תֹהוּ.
