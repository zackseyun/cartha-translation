  terminology: „Jahwe“ gibt יהוה konsequent als Namen wieder. „Schuld ist vergeben“ ist im Kontext der Wiederherstellungsankündigung klar und natürlich; die Fußnote bewahrt die semantische Möglichkeit von Annahme, Genügen bzw. Sühne. „Doppeltes“ bleibt wörtlich und wird nicht dogmatisch oder rechnerisch aufgelöst.
