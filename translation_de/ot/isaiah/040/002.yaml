  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: de
  text: 'Sprecht Jerusalem tröstend zu und ruft ihr zu: Ihre Dienstzeit ist erfüllt[a], ihre Schuld ist vergeben[b], denn sie hat aus der Hand Jahwes Doppeltes empfangen für alle ihre Sünden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Kriegsdienst ist beendet“ oder „ihre belastende Dienstzeit ist erfüllt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihre Schuld ist angenommen“; der hebräische Ausdruck kann auch besagen, dass ihre Strafe angenommen ist oder als ausreichend gilt.'
    reason: lexical_alternative
  - marker: c
    text: „Doppeltes“ kann hier ein volles oder überreiches Maß bezeichnen und muss nicht als genaue mathematische Verdoppelung verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: Redet … zu Herzen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild und vermittelt zugleich den tröstenden, ermutigenden Ton.
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: und ruft ihr zu
  rationale: Gibt den lebhaften prophetischen Zuruf mit natürlichem modernem Deutsch wieder.
- source_word: מָלְאָה צְבָאָהּ
  choice: Ihr Frondienst ist vollendet
  rationale: צָבָא kann Kriegsdienst, verpflichtenden Dienst oder eine festgesetzte Dienstzeit bezeichnen. „Frondienst“ bringt hier die belastende, auferlegte Dienstzeit zum Ausdruck, ohne sie auf Krieg zu beschränken.
- source_word: נִרְצָה עֲוֺנָהּ
  choice: ihre Schuld ist abgetragen
  rationale: Die Formulierung wahrt sowohl den Gedanken der Schuld als auch den des angenommenen beziehungsweise erfüllten Ausgleichs und vermeidet es, den hebräischen Ausdruck einseitig als bloßen Vergebungsakt aufzulösen.
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: aus der Hand Jahwes hat sie … empfangen
  rationale: „Empfangen“ ist im Zusammenhang natürlich; „aus der Hand“ erhält das konkrete hebräische Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּפְלַיִם
  choice: Doppeltes
  rationale: Die wörtliche Zweifachheit bleibt im Haupttext sichtbar; ob eine rechnerisch genaue Verdoppelung oder ein volles Maß gemeint ist, wird nicht entschieden.
- source_word: בְּכָל־חַטֹּאתֶיהָ
  choice: für alle ihre Sünden
  rationale: חַטֹּאות bezeichnet hier im Kontext Sünden; „für“ lässt das Verhältnis zum empfangenen Gericht knapp und offen wieder.
theological_decisions:
- issue: Bedeutung des von Jerusalem empfangenen „Doppelten“
  choice: Die wörtliche Aussage „Doppeltes“ bleibt bestehen, ohne ein genaues mathematisches Verhältnis festzulegen.
  alternative: Ein exakt zweifaches Strafmaß oder idiomatisch ein volles, ausreichendes Maß.
  rationale: Der Zusammenhang handelt von abgeschlossenem Leiden und wiedergewonnener Annahme. Der Text soll die Spannung des Bildes bewahren, statt sie zugunsten einer einzigen Deutung aufzulösen.
- issue: Bedeutung von נִרְצָה עֲוֺנָהּ
  choice: „ihre Schuld ist abgetragen“
  alternative: „ihre Schuld ist vergeben“ oder „ihre Strafe ist angenommen/genügt“
  rationale: Das hebräische עָוֹן kann Vergehen, Schuld und deren Straffolge umfassen; רצה im Nifal bezeichnet hier Annahme beziehungsweise Genügen. „Abgetragen“ hält Schuld, Folgen und Abschluss zusammen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Personifikation Jerusalems und die dreigliedrige Verkündigung bleiben erhalten. „Frondienst“ ist bewusst markant, aber allgemein verständlich; die Fußnote sichert die militärische und zeitliche Bedeutungsbreite.
