  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: de
  text: 'Warum sagst du, Jakob, und sprichst, Israel: »Mein Weg ist Jahwe verborgen, und mein Recht[a] wird von meinem Gott übergangen«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Rechtssache«, »mein Rechtsanspruch« oder »mein gerechtes Anliegen«.'
    reason: Das hebräische מִשְׁפָּטִי kann das zustehende Recht, einen Rechtsanspruch oder die Sache bezeichnen, in der jemand die Anerkennung oder Durchsetzung seines Rechts erwartet.
lexical_decisions:
- source_word: לָמָּה תֹאמַר ... וּתְדַבֵּר
  choice: Warum sagst du ... und sprichst
  rationale: Bewahrt die rhetorische Frage, die direkte Anrede und die Variation zwischen אמר und דבר in natürlichem Deutsch.
- source_word: יַעֲקֹב ... יִשְׂרָאֵל
  choice: Jakob ... Israel
  rationale: Die beiden Namen werden als parallele Anreden an das Volk beibehalten.
- source_word: נִסְתְּרָה דַרְכִּי
  choice: Mein Weg ist ... verborgen
  rationale: Gibt das Passiv und die Wegmetapher direkt wieder, ohne sie auf Lebensumstände oder Schicksal einzuengen.
- source_word: מֵיְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder; die Präposition wird in der deutschen Konstruktion »jemandem verborgen sein« durch den Dativ ausgedrückt.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: Im Kontext bezeichnet מִשְׁפָּט wahrscheinlich den Rechtsanspruch beziehungsweise die Sache, in der der Sprecher göttliche Rechtsschaffung erwartet. »Recht« ist im Deutschen natürlicher als »meine Gerechtigkeit« und hält die juristische Bedeutungsbreite offen.
- source_word: יַעֲבוֹר
  choice: wird ... übergangen
  rationale: Bewahrt das Bild des Vorübergehens, vermittelt aber idiomatisch den kontextuellen Sinn, dass Gott den Rechtsanspruch unbeachtet lasse.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Sinn von מִשְׁפָּטִי
  choice: mein Recht
  alternative: meine Rechtssache; mein Rechtsanspruch; mein gerechtes Anliegen
  rationale: Die Klage kann das zustehende Recht, den Anspruch oder die zur Entscheidung stehende Sache meinen. Der Haupttext legt sich nicht auf eine engere juristische Deutung fest; die Fußnote bewahrt die Alternativen.
- issue: Sinn von מִשְׁפָּטִי יַעֲבוֹר
  choice: mein Recht wird von meinem Gott übergangen
  alternative: meine Rechtssache geht an meinem Gott vorüber
  rationale: Die gewählte Formulierung verbindet das hebräische Bild des Vorübergehens mit verständlichem Deutsch und erhält die Spannung der subjektiven Klage über Gottes vermeintliche Nichtbeachtung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität von »Jakob« und »Israel« sowie von »sagst« und »sprichst« bleibt erhalten. Auf das heute stark altertümliche vokativische »o« wird verzichtet.
