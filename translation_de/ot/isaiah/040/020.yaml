reference: Isaiah 40:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽ/מְסֻכָּ֣ן תְּרוּמָ֔ה עֵ֥ץ לֹֽא יִרְקַ֖ב יִבְחָ֑ר חָרָ֤שׁ חָכָם֙ יְבַקֶּשׁ ל֔/וֹ לְ/הָכִ֥ין פֶּ֖סֶל לֹ֥א יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: de
  text: Wer zu arm für eine Opfergabe ist,[a] wählt Holz, das nicht verfault. Er sucht sich einen geschickten Handwerker, damit dieser ein Götzenbild[b] anfertigt, das nicht wankt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Verarmte wählt als Opfergabe Holz, das nicht verfault.“ Der hebräische Satzanfang ist sehr knapp und lässt sich unterschiedlich gliedern.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Schnitzbild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן תְּרוּמָה
  choice: Wer zu arm für eine Opfergabe ist
  rationale: Die knappe und schwierige hebräische Fügung wird sinnvoll auf jemanden bezogen, der sich eine kostspielige Gabe beziehungsweise ein kostspieliges Bild nicht leisten kann. Die alternative syntaktische Deutung bleibt in Fußnote [a] erhalten.
- source_word: עֵץ לֹא יִרְקַב
  choice: Holz, das nicht verfault
  rationale: Die konkrete Aussage über dauerhaftes, nicht vermoderndes Material wird unmittelbar und in heutigem Deutsch wiedergegeben.
- source_word: חָרָשׁ חָכָם
  choice: einen geschickten Handwerker
  rationale: חָכָם bezeichnet hier fachliches Können, nicht sittliche oder geistliche Weisheit.
- source_word: יְבַקֶּשׁ לוֹ
  choice: Er sucht sich
  rationale: Das reflexive deutsche Idiom gibt sowohl die gezielte Suche als auch das hebräische לוֹ natürlich wieder.
- source_word: לְהָכִין
  choice: anfertigt
  rationale: Im Zusammenhang mit einem Handwerker und einem Bild bezeichnet der Infinitiv dessen Herstellung beziehungsweise Herrichtung. Die Formulierung macht den naheliegenden Bezug auf den Handwerker deutlich.
- source_word: פֶּסֶל
  choice: Götzenbild
  rationale: Das Wort bezeichnet ein kultisches, gewöhnlich geschnitztes Bild. „Götzenbild“ bewahrt in diesem Zusammenhang die polemische Kraft, ohne den konkreten Bildcharakter zu verlieren.
- source_word: לֹא יִמּוֹט
  choice: das nicht wankt
  rationale: „Wankt“ bewahrt die ironische Vorstellung, dass das von Menschen hergestellte Gottesbild eigens gegen Instabilität gesichert werden muss.
theological_decisions:
- issue: Wiedergabe von פֶּסֶל im Zusammenhang der Götzenkritik
  choice: Götzenbild
  alternative: Schnitzbild
  rationale: „Götzenbild“ macht die kultische Funktion und die prophetische Kritik verständlich; „Schnitzbild“ bildet stärker die Herstellungsweise ab und wird deshalb als lexikalische Alternative vermerkt.
- issue: Bezug des Subjekts bei לְהָכִין
  choice: Der Handwerker fertigt das Bild an
  alternative: Der Auftraggeber lässt beziehungsweise bereitet das Bild an
  rationale: Der unmittelbar vorausgehende „geschickte Handwerker“ ist das naheliegende logische Subjekt der Herstellung. Die deutsche Konstruktion vermeidet dennoch weitergehende Aussagen über den Herstellungsprozess.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei kurzen Hauptsätze erhalten den spöttischen Kontrast zwischen sorgfältiger Materialwahl und der menschlich hergestellten, vermeintlich standfesten Gottheit.
