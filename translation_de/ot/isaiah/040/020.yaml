  source_fidelity: Die Übersetzung gibt die schwierige Eröffnung הַמְסֻכָּן תְּרוּמָה angemessen als Armut im Blick auf eine Opfergabe wieder und wahrt die alternative Gliederung in Fußnote [a]. Die Auswahl dauerhaftem Holzes, die Suche nach einem fachkundigen Handwerker und die Ironie eines nicht wankenden Kultbildes entsprechen dem hebräischen Text. „Damit dieser … anfertigt“ macht den im Kontext naheliegenden Bezug des Infinitivs לְהָכִין auf den Handwerker idiomatisch deutlich, ohne den Sinn zu verändern.
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Satzfolge ist flüssig; „sucht sich einen geschickten Handwerker“ ist idiomatisch. „Nicht verfault“ und „nicht wankt“ sind konkret und verständlich.
  terminology: „Opfergabe“ ist für תְּרוּמָה gut vertretbar; die alternative Lesart ist korrekt vermerkt. „Geschickter Handwerker“ gibt חָרָשׁ חָכָם treffend wieder. „Götzenbild“ ist im polemischen Kontext von פֶּסֶל sachgerecht; „Schnitzbild“ wird als lexikalische Alternative angeboten. Die Fußnotenanker stehen an den passenden Stellen.
