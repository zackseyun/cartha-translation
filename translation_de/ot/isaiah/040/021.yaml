base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: de
  text: Wisst ihr es nicht? Hört ihr es nicht? Ist es euch nicht von Anfang an gesagt worden? Habt ihr nicht die Grundfesten der Erde verstanden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Habt ihr es nicht von den Grundfesten der Erde an verstanden?'
    reason: 'Alternative syntaktische Lesart: „Grundfesten der Erde“ kann als herkunfts- bzw. zeitbezogener Ausdruck zu „verstanden“ aufgefasst werden, nicht nur als dessen Objekt.'
lexical_decisions:
- source_word: הֲלוֹא
  choice: nicht …?
  rationale: Die wiederholte verneinte Frage erwartet jeweils eine bejahende Antwort. Die einheitliche deutsche Frageform bewahrt ihren eindringlichen, rhetorischen Charakter.
- source_word: תֵדְעוּ
  choice: wisst
  rationale: Das Verb bezeichnet hier Wissen oder Bewusstsein. „Wissen“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: תִשְׁמָעוּ
  choice: hört
  rationale: „Hören“ gibt die Grundbedeutung wieder, ohne die zusätzliche Nuance absichtsvollen Zuhörens einzutragen.
- source_word: הֻגַּד
  choice: gesagt worden
  rationale: Die passive Form bezeichnet eine Mitteilung an die Angesprochenen. „Gesagt worden“ ist gegenwärtiges, klares Deutsch und vermeidet den feierlicheren Zusatzton von „verkündet“.
- source_word: מֵרֹאשׁ
  choice: von Anfang an
  rationale: Die Wendung verweist auf den frühesten Zeitpunkt oder Ausgangspunkt; „von Anfang an“ ist idiomatisch und wahrt den zeitlichen Sinn.
- source_word: הֲבִינֹתֶם
  choice: habt … verstanden
  rationale: Das Verb bezeichnet Verstehen oder Einsicht. „Verstanden“ erhält den Erkenntnisbezug der vorangehenden Fragen.
- source_word: מוֹסְדוֹת הָאָרֶץ
  choice: seit die Erde gegründet wurde
  rationale: Im bevorzugten syntaktischen Verständnis bezeichnet die Wendung einen zeitlichen Ausgangspunkt. Die verbale deutsche Form gibt diesen Sinn natürlich wieder, während die mögliche objektbezogene Lesart in der Fußnote erhalten bleibt.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der kosmische Zusammenhang spricht für die Erde als Schöpfung, nicht für ein bestimmtes Land.
theological_decisions:
- issue: Syntaktische Beziehung des letzten Satzglieds מוֹסְדוֹת הָאָרֶץ
  choice: Habt ihr es nicht verstanden, seit die Erde gegründet wurde?
  alternative: Habt ihr nicht die Grundfesten der Erde verstanden?
  rationale: Vor „Grundfesten der Erde“ steht im Hebräischen keine ausdrückliche Präposition. Die Wendung kann dennoch als zeitlicher beziehungsweise herkunftsbezogener Ausdruck parallel zu „von Anfang an“ verstanden werden; ebenso ist sie als direktes Objekt von „verstanden“ möglich. Der Haupttext folgt der im Zusammenhang naheliegenden zeitlichen Lesart, die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Rhythmus. Die vier parallelen Fragen bleiben erhalten. Das ergänzte „es“ macht die ersten und letzten Fragen im Deutschen idiomatisch, ohne einen neuen konkreten Gegenstand festzulegen.
