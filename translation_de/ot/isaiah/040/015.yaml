  variant: modern standard German
source:
  edition: WLC
  text: הֵ֤ן גּוֹיִם֙ כְּ/מַ֣ר מִ/דְּלִ֔י וּ/כְ/שַׁ֥חַק מֹאזְנַ֖יִם נֶחְשָׁ֑בוּ הֵ֥ן אִיִּ֖ים כַּ/דַּ֥ק יִטּֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: de
  text: Sieh, die Völker sind wie ein Tropfen aus einem Eimer und gelten wie Staub auf der Waage. Sieh, die Küstenländer[a] hebt er empor wie feinen Staub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Inseln“. Das hebräische Wort kann Inseln, Küstenländer oder ferne Länder am Meer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. „Sieh“ bewahrt diese rhetorische Kraft in knapper, verständlicher Form.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: Das Wort bezeichnet hier umfassend die Völker der Welt. Der bestimmte Artikel ist im Deutschen bei dieser allgemeinen Aussage idiomatisch.
- source_word: כְּמַר מִדְּלִי
  choice: wie ein Tropfen aus einem Eimer
  rationale: מַר bezeichnet einen Tropfen; die Präposition מִן gibt mit דְּלִי die Herkunft an. „Aus einem Eimer“ folgt daher dem hebräischen Bild genauer als die traditionelle Wendung „am Eimer“.
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: wie Staub auf der Waage
  rationale: שַׁחַק kann feinen Staub oder Pulver bezeichnen, מֹאזְנַיִם eine Waage beziehungsweise Waagschalen. Die Formulierung vermittelt anschaulich ein Gewicht, das nicht ins Gewicht fällt.
- source_word: נֶחְשָׁבוּ
  choice: gelten
  rationale: Das Passiv von חשׁב bezeichnet hier ein Einschätzen oder Anrechnen. „Gelten wie“ gibt diese wertende Einordnung natürlich und prägnant wieder.
- source_word: אִיִּים
  choice: die Küstenländer
  rationale: Der Ausdruck kann Inseln, Küstengebiete oder ferne Länder am Meer bezeichnen. „Küstenländer“ passt zum weiteren Sprachgebrauch Jesajas, ohne die geografische Bedeutung unnötig einzuengen.
- source_word: כַּדַּק
  choice: wie feinen Staub
  rationale: דַּק bezeichnet etwas Feines, Dünnes oder Winziges. Im Zusammenhang mit Staub und Gewicht macht „feiner Staub“ die Geringfügigkeit deutlich.
- source_word: יִטּוֹל
  choice: hebt er empor
  rationale: Das Verb נטל bedeutet heben, aufnehmen oder tragen. „Hebt er empor“ erhält das Bild, dass Gott die Küstenländer mühelos wie feinsten Staub anhebt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יִטּוֹל
  choice: Das Subjekt wird mit „er“ wiedergegeben und bleibt, wie im Hebräischen, ohne ausdrückliche Gottesbezeichnung.
  alternative: „Gott hebt … empor“ oder eine unpersönliche Wiedergabe wie „man hebt … empor“.
  rationale: Die Verbform ist dritte Person Singular maskulin, nennt das Subjekt aber nicht ausdrücklich. Der Zusammenhang weist auf Gott; „er“ bewahrt diesen Kontextbezug, ohne einen Gottesnamen in den Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Aufforderung „Sieh“ erhält die rhetorische Gliederung des Hebräischen. Der letzte Satz bewahrt durch die Voranstellung von „die Küstenländer“ weitgehend die markierte hebräische Wortfolge.
