id: ISA.40.28
reference: Isaiah 40:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: de
  text: Weißt du es denn nicht? Hast du es nicht gehört? Jahwe ist der ewige Gott,[a] der Schöpfer der Enden der Erde. Er wird nicht müde und nicht matt; seine Einsicht ist unergründlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Weißt du es denn nicht?
  rationale: Die rhetorische Frage erwartet Zustimmung und erinnert mahnend an etwas, das der Angesprochene bereits wissen sollte. „Denn“ gibt diese Nuance im heutigen Deutsch natürlich wieder.
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: Hast du es nicht gehört?
  rationale: Die Wendung bildet hier parallel zur ersten Frage eine zweite rhetorische Frage und keinen Bedingungssatz.
- source_word: אֱלֹהֵי עוֹלָם
  choice: der ewige Gott
  rationale: Die Konstruktverbindung bezeichnet Gott als den Gott der Ewigkeit beziehungsweise als den ewig bestehenden Gott; „der ewige Gott“ ist prägnant und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בּוֹרֵא
  choice: der Schöpfer
  rationale: Das Qal-Partizip steht substantivisch und bezeichnet Jahwe in Apposition als Schöpfer.
- source_word: קְצוֹת הָאָרֶץ
  choice: der Enden der Erde
  rationale: Die bildhafte hebräische Wendung bezeichnet die äußersten Bereiche beziehungsweise die ganze Ausdehnung der Erde und bleibt in dieser Form erkennbar.
- source_word: לֹא יִיעַף וְלֹא יִיגָע
  choice: Er wird nicht müde und nicht matt
  rationale: Die parallelen Verben bezeichnen Erschöpfung und Ermattung. Die geläufige deutsche Paarformel wahrt den Parallelismus, ohne einen künstlichen Bedeutungsunterschied zu erzwingen.
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: seine Einsicht ist unergründlich
  rationale: Wörtlich gibt es für seine Einsicht kein Erforschen. „Unergründlich“ bewahrt den Gedanken, dass sie nicht vollständig erforscht oder ausgelotet werden kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen JHWH. Die Wiedergabe „Jahwe“ macht den Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֵין חֵקֶר für Gottes Einsicht
  choice: unergründlich
  alternative: nicht zu erforschen
  rationale: Die Aussage betrifft die Unmöglichkeit, Gottes Einsicht erschöpfend zu ergründen; sie behauptet nicht, dass keinerlei Erkenntnis über Gott möglich sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Anrede. Der traditionelle biblische Ausdruck „Enden der Erde“ bleibt wegen seiner klaren Bildhaftigkeit erhalten; archaische Satzformen werden vermieden.
