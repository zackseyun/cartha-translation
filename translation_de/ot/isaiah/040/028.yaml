  source_fidelity: Der Entwurf gibt die zwei parallelen rhetorischen Fragen, die Bezeichnung Jahwes als des ewigen Gottes und Schöpfers sowie die Verneinung von Ermüdung und die Unergründlichkeit seiner Einsicht zuverlässig wieder. „Weißt du es denn nicht?“ ist als gegenwartsbezogene deutsche Entsprechung des hebräischen Perfekts in dieser rhetorischen Erinnerungsfrage angemessen.
