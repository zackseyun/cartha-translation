source:
  edition: WLC
  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: de
  text: Jedes Tal wird angehoben, und jeder Berg und Hügel wird erniedrigt. Das unebene Gelände[a] wird zu ebenem Land und die Höhenzüge[b] zu einer Talebene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das krumme Gelände“; das hebräische Wort kann etwas Krummes oder Unebenes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das raue Gelände“; das seltene hebräische Substantiv kann allgemeiner zerklüftetes oder raues Gelände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: Tal
  rationale: Das Substantiv bezeichnet ein Tal oder eine Schlucht. „Tal“ ist hier die natürliche, umfassende Entsprechung und bildet den topografischen Gegensatz zu Berg und Hügel.
- source_word: יִנָּשֵׂא
  choice: wird angehoben
  rationale: Der Nifal von נשׂא beschreibt hier, dass das Tal erhöht wird. „Angehoben“ bewahrt das konkrete Bild und ist in modernem Deutsch verständlich.
- source_word: הַר
  choice: Berg
  rationale: Die übliche deutsche Entsprechung für das häufige hebräische Wort; zusammen mit גִבְעָה entsteht die natürliche Verbindung „Berg und Hügel“.
- source_word: גִבְעָה
  choice: Hügel
  rationale: Das Wort bezeichnet gewöhnlich eine kleinere Erhebung als הַר. „Hügel“ erhält die topografische Abstufung.
- source_word: יִשְׁפָּלוּ
  choice: wird erniedrigt
  rationale: Die Form von שׁפל bedeutet, niedrig zu werden beziehungsweise niedrig gemacht zu werden. Die singularische Formulierung folgt dem deutschen Paar „jeder Berg und Hügel“ und bewahrt zugleich den Parallelismus zu „wird angehoben“.
- source_word: הֶעָקֹב
  choice: das unebene Gelände
  rationale: Der Ausdruck kann etwas Krummes, Unebenes oder Gewundenes bezeichnen. Im Zusammenhang der Wegbereitung liegt eine konkrete Geländeangabe nahe; die mögliche Bedeutung „krumm“ wird in einer Fußnote erhalten.
- source_word: לְמִישׁוֹר
  choice: zu ebenem Land
  rationale: מִישׁוֹר bezeichnet ebenes Gelände oder eine Ebene. „Ebenes Land“ stellt den Gegensatz zum unebenen Gelände klar und klingt natürlich.
- source_word: הָרְכָסִים
  choice: die Höhenzüge
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich zerklüftete oder sich hinziehende Erhebungen. „Höhenzüge“ hält das Bild konkret; die allgemeinere Deutung als raues Gelände wird in einer Fußnote genannt.
- source_word: לְבִקְעָה
  choice: zu einer Talebene
  rationale: בִקְעָה bezeichnet eine weite Ebene beziehungsweise ein breites Tal. „Talebene“ wahrt diese Bedeutungsbreite und unterscheidet das Wort von מִישׁוֹר im vorangehenden Halbvers.
theological_decisions:
- issue: Art der Bildsprache
  choice: Die Aussage wird als konkrete Umgestaltung der Landschaft wiedergegeben.
  alternative: Die Erhöhung der Niedrigen und Erniedrigung der Stolzen oder eine ausdrücklich endzeitliche Deutung bereits in den Wortlaut einzutragen.
  rationale: Der hebräische Text beschreibt im unmittelbaren Zusammenhang die Bereitung eines Weges durch topografische Bilder. Metaphorische und eschatologische Deutungen bleiben möglich, sollen aber aus dem Kontext hervorgehen und nicht durch die Übersetzung vorentschieden werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter topografischer Bildsprache. Die Wiederholung der Zukunftsform wird im zweiten Parallelglied elliptisch verkürzt, wie es im Deutschen natürlich ist. Die Fußnotenmarker stehen unmittelbar bei den jeweils mehrdeutigen hebräischen Ausdrücken.
