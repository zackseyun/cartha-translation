source:
  edition: WLC
  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: de
  text: 'Hebt eure Augen in die Höhe und seht: Wer hat diese erschaffen? Er ist es, der ihr Heer[a] in abgezählter Zahl[b] herausführt und sie alle mit Namen ruft. Wegen seiner gewaltigen Kraft und seiner mächtigen Stärke fehlt kein Einziger.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Heer“ ist hier die geordnete Menge der Himmelskörper gemeint, besonders der Sterne.
    reason: cultural_note
  - marker: b
    text: 'Oder: „nach ihrer Zahl“. Gemeint ist, dass er sie geordnet und abgezählt herausführt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Kein Mann fehlt“; אִישׁ wird hier verteilend gebraucht und bedeutet: Keines von ihnen fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: Hebt eure Augen in die Höhe
  rationale: Die Wendung bewahrt den körperlich-räumlichen Sinn des pluralischen Befehls und klingt im modernen Standarddeutsch natürlich.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Die knappe Aufforderung leitet wie im Hebräischen unmittelbar zur rhetorischen Frage über.
- source_word: מִי בָרָא אֵלֶּה
  choice: Wer hat diese erschaffen?
  rationale: „Diese“ lässt den durch den Blick nach oben erschlossenen Bezug offen, statt ausdrücklich „Sterne“ einzusetzen; das Perfekt wird im Deutschen passend mit dem Perfekt wiedergegeben.
- source_word: הַמּוֹצִיא
  choice: Er ist es, der … herausführt
  rationale: Die substantivierte Partizipialform wird klar auf den Schöpfer zurückbezogen, ohne ihre fortdauernde bzw. charakterisierende Aussage zu verlieren.
- source_word: בְמִסְפָּר צְבָאָם
  choice: ihr Heer in abgezählter Zahl
  rationale: „Heer“ bewahrt den geordneten kollektiven Sinn von צָבָא; „in abgezählter Zahl“ gibt die Vorstellung geordneter Zählung wieder, ohne bloß eine große Menge zu bezeichnen.
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: und sie alle mit Namen ruft
  rationale: Die Formulierung folgt der hebräischen Aussage, dass die Gesamtheit jeweils unter namentlichem Ruf steht, und bleibt im Deutschen flüssig.
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  choice: Wegen seiner gewaltigen Kraft und seiner mächtigen Stärke
  rationale: מִן wird kausal verstanden. Die zwei eng verwandten Kraftausdrücke werden bewusst parallel und nicht zu einem einzigen Begriff eingeebnet.
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: fehlt kein Einziger
  rationale: אִישׁ hat hier verteilende Kraft und bezeichnet nicht ausdrücklich einen männlichen Menschen. Die deutsche Wendung gibt idiomatisch wieder, dass kein Glied des himmlischen Heeres fehlt.
theological_decisions:
- issue: Bezug von „diese“ und „ihr Heer“
  choice: Der Haupttext lässt den Gegenstand demonstrativ als „diese“ stehen und bezeichnet die geordnete Gesamtheit als „ihr Heer“.
  alternative: „Sterne“ oder allgemeiner „Himmelskörper“ ausdrücklich in den Haupttext einsetzen.
  rationale: Der Blick in die Höhe sowie Zählung und Namensruf weisen stark auf die Himmelskörper, besonders die Sterne. Da der hebräische Text sie hier jedoch nicht ausdrücklich benennt, bleibt die rhetorische Offenheit erhalten.
- issue: Verteilender Gebrauch von אִישׁ
  choice: „kein Einziger“
  alternative: 'Wörtlich: „kein Mann“ bzw. „niemand“'
  rationale: Im Zusammenhang bezieht sich אִישׁ auf jedes einzelne Glied des himmlischen Heeres. Eine geschlechtsspezifische Wiedergabe wäre im Deutschen irreführend.
- issue: Ursache dafür, dass keiner fehlt
  choice: Die Aussage wird kausal auf Gottes gewaltige Kraft und mächtige Stärke bezogen.
  alternative: מִן lediglich als Ausgangspunkt oder Folgebeziehung wiedergeben.
  rationale: 'Der kausale Sinn von מִן passt am besten zum Satzgefüge: Aufgrund der Größe seiner Kraft bleibt kein Glied des Heeres aus.'
translation_notes:
  register: Moderne, würdige Standardsprache mit engem Anschluss an Bildfolge und Parallelismus des Hebräischen. Die etwas feierliche Wendung „in abgezählter Zahl“ erhält das Motiv souveräner Ordnung; die Kraftbegriffe bleiben trotz ihrer inhaltlichen Nähe als Paar stehen.
