base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: de
  text: Er ist es, der über dem Kreis der Erde[a] sitzt; ihre Bewohner sind wie Heuschrecken. Er spannt den Himmel wie einen dünnen Vorhang[b] aus und breitet ihn wie ein Zelt zum Wohnen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über der Wölbung der Erde“ beziehungsweise „über dem Horizont der Erde“. Das hebräische Wort kann einen Kreis, eine kreisförmige Begrenzung oder eine Wölbung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie einen feinen Schleier“ beziehungsweise „wie Gaze“. Das hebräische Wort bezeichnet etwas Dünnes oder Feines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: Er ist es, der … sitzt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Gott durch eine fortdauernde Haltung bzw. Tätigkeit. Die Formulierung ist im Deutschen natürlich, ohne die im Verb nicht ausdrücklich enthaltene Bedeutung „thronen“ hinzuzufügen.
- source_word: עַל
  choice: über
  rationale: „Über“ gibt in diesem Zusammenhang sowohl die räumliche Bildsprache als auch Gottes Erhabenheit wieder, ohne unmittelbaren Kontakt anzudeuten.
- source_word: חוּג הָאָרֶץ
  choice: Kreis der Erde
  rationale: „Kreis“ ist die direkte Entsprechung zu חוּג und bewahrt das poetische Bild, ohne es auf ein bestimmtes antikes oder modernes Weltmodell festzulegen.
- source_word: וְיֹשְׁבֶיהָ
  choice: ihre Bewohner
  rationale: Idiomtische Wiedergabe des substantivischen Partizips mit Suffix; „ihre“ bezieht sich auf die Erde.
- source_word: כַּחֲגָבִים
  choice: wie Heuschrecken
  rationale: חֲגָבִים bezeichnet kleine springende Insekten, häufig Heuschrecken. Das Bild hebt die Winzigkeit der Menschen aus der dargestellten Perspektive hervor.
- source_word: הַנּוֹטֶה
  choice: Er spannt … aus
  rationale: Das weitere substantivische Partizip führt die Beschreibung Gottes fort. Ein neuer deutscher Hauptsatz macht den poetischen Parallelismus klar und flüssig.
- source_word: כַדֹּק
  choice: wie dünnen Stoff
  rationale: דֹק bezeichnet hier etwas Dünnes oder Feines. „Dünner Stoff“ wahrt diese Eigenschaft, ohne das nicht ausdrücklich genannte konkrete Objekt „Vorhang“ festzulegen.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Der hebräische Ausdruck wird im Deutschen in diesem kosmischen Zusammenhang idiomatisch mit dem singularischen Kollektiv „Himmel“ wiedergegeben.
- source_word: וַיִּמְתָּחֵם
  choice: und breitet ihn aus
  rationale: Das Verb bezeichnet das Ausdehnen oder Ausspannen. „Breitet … aus“ vermeidet eine schwerfällige Wiederholung; das singularische Pronomen folgt dem deutschen „Himmel“.
- source_word: כָּאֹהֶל לָשָׁבֶת
  choice: wie ein Zelt zum Wohnen
  rationale: Die Wendung bewahrt den Vergleich mit einem Zelt und gibt den Zweck des Infinitivs לָשָׁבֶת knapp und natürlich wieder.
theological_decisions:
- issue: Kosmologische Bildsprache in חוּג הָאָרֶץ
  choice: „Kreis der Erde“ als offenes poetisches Bild
  alternative: „Wölbung der Erde“ oder „Horizont der Erde“
  rationale: Der Vers preist Gottes Erhabenheit und Schöpfermacht. Die Übersetzung bewahrt die echte lexikalische Offenheit und macht daraus weder eine moderne naturwissenschaftliche Aussage noch die Festlegung auf ein bestimmtes antikes Weltbild.
- issue: Sitzen Gottes über der Erde
  choice: „sitzt“
  alternative: „thront“
  rationale: „Thront“ könnte die königliche Aussage des Zusammenhangs verdeutlichen, fügt jedoch eine Nuance hinzu, die im Verb יָשַׁב selbst nicht zwingend ausgedrückt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Bildsprache. Die beiden hebräischen Partizipialfügungen werden in gut verständliche deutsche Sätze überführt. Der sachlich falsch platzierte englische Fußnotenmarker zu דֹק wurde beim Ausdruck „dünnen Stoff“ gesetzt, nicht bei „Heuschrecken“.
