  naturalness: Das Deutsch ist würdevoll und gut verständlich. »Seine Vergeltung« ist zwar möglich, klingt im modernen Deutschen aber vorrangig nach strafender Vergeltung; »sein Entgelt« wahrt den im Kontext naheliegenden kompensatorischen Sinn neutraler. Die Beibehaltung von »vor ihm« ist zugleich natürlich genug und näher am poetischen Hebräisch.
