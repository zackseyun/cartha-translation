source:
  edition: WLC
  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: de
  text: Siehe, der Herr Jahwe[a] kommt mit Macht[b], und sein Arm übt für ihn die Herrschaft aus[c]. Siehe, sein Lohn ist bei ihm und sein Entgelt ist vor ihm[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Herr Jahwe«; אֲדֹנָי ist der Titel »Herr«, יְהוִה der Gottesname Jahwe.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »wird mit Macht kommen«. Die hebräische Verbform kann ausdrücklich futurisch wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich nahe am Hebräischen: »sein Arm herrscht für ihn«; möglich ist auch: »sein Arm herrscht in seinem Auftrag«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »sein Lohn ist bei ihm und seine Vergeltung vor ihm« oder: »sein Lohn ist bei ihm und sein Werklohn vor ihm«. Die beiden hebräischen Wörter können Lohn, Belohnung, Entgelt oder Vergeltung bezeichnen; »vor ihm« enthält kein ausdrücklich genanntes Bewegungsverb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt an beiden Stellen den hinweisenden, feierlichen Nachdruck der prophetischen Ausrufung.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יְהוִה wieder, ohne die beiden Bestandteile zu einem einzigen Titel zu verschmelzen.
- source_word: בְּחָזָק
  choice: mit Macht
  rationale: Gibt die modale Bedeutung der Präposition mit חָזָק in natürlichem, kraftvollem Deutsch wieder, ohne das Wort als Personenbezeichnung auszulegen.
- source_word: יָבוֹא
  choice: kommt
  rationale: Das Präsens passt zum vorausweisenden »Siehe« und stellt das angekündigte Kommen lebendig als gewiss vor Augen; eine futurische Wiedergabe bleibt möglich.
- source_word: וּזְרֹעוֹ
  choice: und sein Arm
  rationale: Bewahrt das anschauliche biblische Bild des Arms als wirksames Instrument göttlicher Macht.
- source_word: מֹשְׁלָה לוֹ
  choice: übt für ihn die Herrschaft aus
  rationale: Gibt das herrschende Handeln des Arms und den schwerfällig ins Deutsche zu übertragenden Dativ לוֹ wieder, ohne den Bezug stillschweigend aufzulösen.
- source_word: שְׂכָרוֹ
  choice: sein Lohn
  rationale: Bewahrt den möglichen Sinn von Lohn, Belohnung oder Entgelt und eignet sich für die poetische Parallele.
- source_word: אִתּוֹ
  choice: ist bei ihm
  rationale: Entspricht der schlichten Aussage räumlicher beziehungsweise begleitender Nähe.
- source_word: וּפְעֻלָּתוֹ
  choice: und seine Vergeltung
  rationale: Im Parallelismus mit שְׂכָרוֹ bezeichnet das Wort wahrscheinlich den Ertrag beziehungsweise die Entlohnung einer Tat; »Vergeltung« lässt offen, ob Belohnung oder entsprechende Gegenleistung gemeint ist.
- source_word: לְפָנָיו
  choice: geht vor ihm her
  rationale: Verdeutlicht in natürlichem Deutsch die räumlich-prozessionale Aussage, dass die Vergeltung vor ihm ist beziehungsweise ihm vorausgeht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה im zusammengesetzten Titel אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR; der Herr JHWH
  rationale: »Jahwe« macht den im Hebräischen ausdrücklich stehenden Gottesnamen sichtbar; »Herr« gibt אֲדֹנָי als eigenen Titel wieder.
- issue: Personifikation des göttlichen Arms
  choice: sein Arm übt für ihn die Herrschaft aus
  alternative: durch seinen Arm herrscht er; sein Arm verschafft ihm Herrschaft
  rationale: Die gewählte Fassung bewahrt die grammatische und poetische Personifikation, statt sie in eine abstrakte Aussage über Gottes Macht aufzulösen.
- issue: Bedeutung von Lohn und Vergeltung
  choice: sein Lohn ... seine Vergeltung
  alternative: seine Belohnung ... sein Entgelt; sein Lohn ... sein Ertrag
  rationale: Die Formulierung wahrt die Spannung, ob es sich um das handelt, was Jahwe selbst empfängt, oder um den Lohn beziehungsweise die Vergeltung, die er mitbringt und austeilt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Bildsprache. »Siehe« setzt einen leicht gehobenen, aber verständlichen Akzent; die übrige Syntax ist gegenwartsnah. Die Wiederholung von »Siehe« und die Parallelität der beiden Vershälften bleiben erhalten.
