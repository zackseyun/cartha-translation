base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: de
  text: Wer hat die Wasser in seiner hohlen Hand abgemessen, den Himmel mit der Spanne vermessen, den Staub der Erde in ein Maß gefasst[a] und die Berge mit der Waage, die Hügel mit Waagschalen gewogen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet hier wahrscheinlich ein altes Hohlmaß oder Messgefäß, möglicherweise ein Drittelmaß; seine genaue Größe ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָדַד
  choice: Wer hat … abgemessen
  rationale: Die rhetorische Frage und die vollendete Messhandlung werden im Deutschen natürlich mit Perfekt wiedergegeben.
- source_word: בְּשָׁעֳלוֹ
  choice: mit seiner hohlen Hand
  rationale: Bewahrt das konkrete anthropomorphe Bild der Handfläche als kleines Messgefäß in natürlichem Deutsch.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der poetische Plural entspricht dem hebräischen Ausdruck und unterstreicht den kosmischen Umfang.
- source_word: וְשָׁמַיִם בַּזֶּרֶת תִּכֵּן
  choice: den Himmel mit der Spanne vermessen
  rationale: „Spanne“ bezeichnet das Handmaß zwischen ausgestreckten Fingern; „vermessen“ gibt die Bestimmung der Ausdehnung wieder.
- source_word: וְכָל בַּשָּׁלִשׁ עֲפַר הָאָרֶץ
  choice: den Staub der Erde mit einem Maß erfasst
  rationale: Gibt den Messvorgang wieder, ohne für שָׁלִשׁ eine unsichere exakte Gefäßgröße vorzutäuschen.
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים
  choice: die Berge mit der Waage gewogen
  rationale: Bewahrt das konkrete Bild eines Wiegeinstruments und klingt im modernen Deutschen natürlich.
- source_word: וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: die Hügel mit Waagschalen
  rationale: Der Dual מֹאזְנַיִם bezeichnet eine Balkenwaage beziehungsweise deren zwei Waagschalen; die Wiedergabe erhält den poetischen Parallelismus, ohne die Instrumente völlig gleichzusetzen.
theological_decisions:
- issue: Anthropomorphe Darstellung von Gottes Handeln bei der Schöpfung
  choice: Die körperlichen Bilder von hohler Hand und Spanne werden konkret beibehalten.
  alternative: Abstrakte Wiedergabe wie „durch seine Macht“ oder „nach genauem Maß“.
  rationale: Der hebräische Text beschreibt Gottes unvergleichliche Größe gerade durch anschauliche menschliche Messhandlungen; eine Abstraktion würde das poetische Bild und seine theologische Spannung abschwächen.
- issue: Implizites Subjekt der rhetorischen Frage
  choice: Das „Wer“ wird im zweiten Satz wiederholt, ohne „Gott“ ausdrücklich einzusetzen.
  alternative: Explizite Wiedergabe mit „Gott“ als Subjekt.
  rationale: Der Vers nennt das Subjekt nicht ausdrücklich. Die rhetorische Form bleibt so erhalten und wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst konkreter Bildlichkeit. Die Wiederholung von „Wer hat“ gliedert die lange rhetorische Frage verständlich, ohne ihren Sinn zu verändern.
