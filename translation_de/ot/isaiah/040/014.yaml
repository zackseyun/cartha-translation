  variant: modern standard German
source:
  edition: WLC
  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: de
  text: Wen zog er zu Rate, und wer gab ihm Einsicht? Wer lehrte ihn den Pfad des Rechts[a], lehrte ihn Wissen und ließ ihn den Weg der Einsicht[b] erkennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Pfad gerechten Urteilens; auch: den Pfad der Rechtsprechung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: den Weg des verständigen Unterscheidens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: Wen zog er zu Rate
  rationale: אֶת מִי ist das direkte Objekt von נוֹעָץ. „Jemanden zu Rate ziehen“ gibt den Nifal von יעץ in natürlichem, gehobenem Standarddeutsch als Einholen von Rat wieder.
- source_word: וַיְבִינֵהוּ
  choice: und wer gab ihm Einsicht
  rationale: Der Hifil von בין bezeichnet das Vermitteln von Verständnis. Das ergänzte „wer“ macht den im Hebräischen elliptischen Subjektwechsel im Deutschen verständlich, ohne einen bestimmten Ratgeber einzusetzen.
- source_word: וַיְלַמְּדֵהוּ
  choice: lehrte ihn
  rationale: Die zweimalige Form wird beide Male mit „lehrte ihn“ wiedergegeben, sodass Wiederholung und Parallelismus des Hebräischen erhalten bleiben.
- source_word: בְּאֹרַח מִשְׁפָּט
  choice: den Pfad des Rechts
  rationale: אֹרַח bedeutet „Pfad“ oder „Weg“; מִשְׁפָּט umfasst Recht, gerechtes Urteil und Rechtsprechung. „Pfad des Rechts“ ist knapp, würdig und lässt den rechtlich-ethischen Bedeutungsraum weitgehend offen.
- source_word: דַעַת
  choice: Wissen
  rationale: „Wissen“ gibt דַעַת direkt wieder und wahrt die begriffliche Unterscheidung zu בין und תְּבוּנוֹת, die hier mit „Einsicht“ wiedergegeben werden.
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  choice: den Weg der Einsicht
  rationale: דֶרֶךְ wird parallel zu אֹרַח als „Weg“ wiedergegeben. Der abstrakte Intensiv- beziehungsweise Pluralgebrauch von תְּבוּנוֹת bezeichnet Einsicht oder verständiges Unterscheiden.
- source_word: יוֹדִיעֶנּוּ
  choice: ließ ihn … erkennen
  rationale: Die Form ist der Hifil von ידע und hat kausative Bedeutung. „Ließ ihn … erkennen“ ist natürliches Deutsch und bewahrt diesen Sinn.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Die Pronomen bleiben stehen und beziehen sich aus dem Zusammenhang auf den HERRN.
  alternative: Den Gottesnamen im Vers ausdrücklich einsetzen.
  rationale: Jesaja 40,13–14 beschreibt rhetorisch die unvergleichliche Weisheit und Unabhängigkeit des HERRN. Da der hebräische Vers selbst den Gottesnamen nicht wiederholt, setzt die Übersetzung ihn nicht erklärend ein.
- issue: Bedeutung von מִשְׁפָּט
  choice: Recht
  alternative: gerechtes Urteilen oder Rechtsprechung
  rationale: „Recht“ bewahrt im Deutschen sowohl die ethisch gerechte als auch die richterliche Dimension des hebräischen Begriffs, ohne den Vers auf ein Gerichtsverfahren zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Rate ziehen“ und „Pfad des Rechts“ tragen den rhetorisch-erhabenen Ton, bleiben aber allgemein verständlich. Die wiederholte Frageform und das zweimalige „lehrte ihn“ bewahren den Parallelismus. Die im Hebräischen nur einmal gesetzte Fragewendung wird durch „wer“ expliziert, damit der Subjektwechsel im Deutschen eindeutig ist.
