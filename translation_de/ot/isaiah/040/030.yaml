  text: וְ/יִֽעֲפ֥וּ נְעָרִ֖ים וְ/יִגָ֑עוּ וּ/בַחוּרִ֖ים כָּשׁ֥וֹל יִכָּשֵֽׁלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/030.yaml
  text: Even young men grow faint and become weary[a], and young men surely stumble.
translation:
  language: de
  text: Selbst junge Männer werden matt und müde, und kräftige junge Männer werden gewiss straucheln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Männer in der Blüte ihrer Jugend“. Das hebräische Wort bezeichnet junge Männer in der Blüte ihrer Kraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: werden matt
  rationale: Das Qal-Imperfekt von עוף bezeichnet hier das Ermüden beziehungsweise Ermatten; „werden matt“ gibt den einsetzenden Zustand natürlich wieder.
- source_word: נְעָרִים
  choice: junge Männer
  rationale: נְעָרִים kann Jugendliche oder junge Männer bezeichnen. Im Parallelismus liegt der Schwerpunkt auf Menschen mit jugendlicher Kraft, nicht auf Kindern.
- source_word: וְיִגָעוּ
  choice: müde
  rationale: יגע bedeutet ermüden oder müde sein. Zusammen mit „werden“ aus dem ersten Prädikat ergibt „werden matt und müde“ eine knappe, natürliche deutsche Parallelform.
- source_word: וּבַחוּרִים
  choice: Männer in der Blüte ihrer Jugend
  rationale: בַחוּרִים bezeichnet junge Männer im kräftigsten Lebensalter. Die Formulierung unterscheidet den Ausdruck von נְעָרִים, ohne die etymologisch ungesicherte Bedeutung „auserwählt“ einzutragen.
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: kommen unweigerlich zu Fall
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage. „Unweigerlich“ bildet die Emphase ab; „zu Fall kommen“ bewahrt sowohl das Straucheln als auch dessen ernste Folge.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischem Parallelismus. „Selbst“ bringt den konzessiven Sinn des Zusammenhangs zum Ausdruck. Die beiden hebräischen Bezeichnungen für junge Männer werden im Deutschen unterscheidbar wiedergegeben.
