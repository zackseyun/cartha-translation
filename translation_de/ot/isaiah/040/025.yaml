reference: Isaiah 40:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶל מִ֥י תְדַמְּי֖וּ/נִי וְ/אֶשְׁוֶ֑ה יֹאמַ֖ר קָדֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: de
  text: „Mit wem wollt ihr mich also vergleichen[a], sodass ich ihm gleich wäre?“, sagt der Heilige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wem wollt ihr mich gleichstellen, sodass ich ihm gleich wäre?“'
    reason: Lexikalische Alternative für das Verb דמה und die Vergleichskonstruktion mit אֶל.
lexical_decisions:
- source_word: וְאֶל מִי
  choice: Mit wem … also
  rationale: Die Präposition אֶל bezeichnet hier die Person, zu der Gott vergleichend in Beziehung gesetzt werden soll. „Mit wem“ ist dafür im modernen Deutschen idiomatisch; „also“ markiert den aus dem Zusammenhang hervorgehenden rhetorischen Übergang.
- source_word: תְדַמְּיוּנִי
  choice: wollt ihr mich … vergleichen
  rationale: Das Piel von דמה bedeutet „gleichen, vergleichen“. Die Verbindung mit „wollt“ gibt die auf die Absicht zielende rhetorische Frage natürlich wieder, ohne die Aussage abzuschwächen.
- source_word: וְאֶשְׁוֶה
  choice: sodass ich ihm gleich wäre
  rationale: שׁוה bezeichnet Gleichheit oder Entsprechung. Der deutsche Konjunktiv macht den hypothetischen, durch die rhetorische Frage zurückgewiesenen Vergleich deutlich. „ihm“ nimmt das mit מִי erfragte Vergleichsgegenüber grammatisch auf, ohne es näher zu bestimmen.
- source_word: יֹאמַר
  choice: sagt
  rationale: Das Imperfekt dient hier als prophetische Redeeinleitung und wird im Deutschen idiomatisch im Präsens wiedergegeben.
- source_word: קָדוֹשׁ
  choice: der Heilige
  rationale: Das substantivierte Adjektiv fungiert als Gottesbezeichnung. Die kürzere Form des hebräischen Textes wird bewahrt und nicht zu „der Heilige Israels“ erweitert.
theological_decisions:
- issue: Gottes Unvergleichlichkeit
  choice: Die rhetorische Frage bleibt als direkte Rede erhalten und weist jeden Gott gleichkommenden Vergleich zurück.
  alternative: 'Paraphrase: „Niemand ist mit mir vergleichbar.“'
  rationale: Die direkte Frage bewahrt sowohl die eindringliche Anrede als auch die im Hebräischen angelegte rhetorische Form, ohne eine systematisch-theologische Erklärung hinzuzufügen.
- issue: Göttlicher Titel קָדוֹשׁ
  choice: „der Heilige“
  alternative: „der Heilige Israels“
  rationale: Der längere, bei Jesaja häufige Titel steht an dieser Stelle nicht im Ausgangstext und darf nicht aus theologischer Vertrautheit ergänzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Pluralanrede „ihr“ und die rhetorische Frage bleiben erhalten; die Formulierung vermeidet konfessionelle Zusätze und bewahrt den knappen Gottestitel des Hebräischen.
