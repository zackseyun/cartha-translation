source:
  edition: WLC
  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: de
  text: Und die Herrlichkeit Jahwes wird offenbar werden, und alles Fleisch wird gemeinsam sehen, denn der Mund Jahwes hat gesprochen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה
  choice: wird offenbar werden
  rationale: Das Nifal von גלה bezeichnet ein Offenbarwerden bzw. Enthülltwerden. „Wird offenbar werden“ bewahrt den passivisch-reflexiven Sinn und klingt im modernen Deutschen natürlicher als „wird enthüllt werden“.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet Herrlichkeit, Ehre und gewichtige Gegenwart; die Genitivfügung gibt den hebräischen Status constructus klar und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen etablierte wissenschaftliche Form.
- source_word: וְרָאוּ
  choice: wird … sehen
  rationale: Die Verbform trägt in der prophetischen Folge Zukunftssinn. Das schlichte „sehen“ entspricht dem Qal von ראה.
- source_word: כָל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche Wendung bewahrt das konkrete hebräische Bild und seine Betonung der gesamten sterblichen Menschheit.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet das gemeinsame bzw. gleichzeitige Sehen. „Gemeinsam“ ist in dieser Satzstellung natürlicher als „zusammen“.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet und verbürgt hier die vorherige Zusage; „denn“ erhält diesen erklärenden Zusammenhang.
- source_word: פִּי יְהוָה
  choice: der Mund Jahwes
  rationale: Die konkrete anthropomorphe Redeweise des Hebräischen wird beibehalten, statt sie zu „Jahwe selbst“ abzuflachen.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt stellt das Sprechen als vollzogen und damit die Zusage als gewiss dar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration bewahrt den Charakter als Eigenname; die deutsche Form „Jahwe“ ist idiomatisch und etabliert.
- issue: Wiedergabe von כָל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen
  rationale: Die wörtliche Wendung bewahrt die leibliche und geschöpfliche Bildsprache sowie den universalen Umfang, ohne ihn lediglich abstrakt als „Menschheit“ auszulegen.
- issue: Unausgesprochenes Objekt von וְרָאוּ
  choice: „sie“ als grammatisch erforderlicher Rückbezug auf „Herrlichkeit“
  alternative: 'objektlos: „und alles Fleisch gemeinsam wird sehen“'
  rationale: Das Hebräische lässt das Objekt unausgesprochen, doch standardsprachliches Deutsch verlangt bei „sehen“ hier eine Ergänzung. Das Pronomen macht lediglich den naheliegenden Rückbezug auf die Herrlichkeit explizit, ohne einen neuen Referenten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. Die Satzfolge bleibt eng am prophetischen Parallelismus; „alles Fleisch“ ist bewusst markiert, aber verständlich und traditionsfähig.
