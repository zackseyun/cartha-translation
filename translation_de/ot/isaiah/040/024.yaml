  variant: modern standard German
source:
  edition: WLC
  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: de
  text: Kaum sind sie gepflanzt[a], kaum sind sie gesät, kaum hat ihr Stamm in der Erde Wurzeln geschlagen, da bläst er sie nur an, und sie verdorren; ein Sturm[b] trägt sie fort wie Stoppeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Noch sind sie nicht gepflanzt … noch hat ihr Stamm in der Erde keine Wurzeln geschlagen.“ Die dreifache hebräische Wendung unterstreicht, wie rasch ihr Aufstieg zunichtegemacht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Wirbelsturm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  choice: kaum
  rationale: 'Die dreifache Wiederholung verbindet nachdrückliche Verneinung mit zeitlicher Zuspitzung: Ihre scheinbare Verwurzelung hat kaum begonnen, ehe sie beseitigt werden.'
- source_word: נִטָּעוּ
  choice: sind sie gepflanzt
  rationale: Das Passiv von נטע eröffnet das durchgehende Pflanzenbild und klingt im Deutschen zusammen mit „kaum“ natürlich.
- source_word: זֹרָעוּ
  choice: sind sie gesät
  rationale: Das Passiv von זרע bewahrt den landwirtschaftlichen Parallelismus zu „gepflanzt“.
- source_word: שֹׁרֵשׁ ... גִּזְעָם
  choice: hat ihr Stamm ... Wurzeln geschlagen
  rationale: Die ungewöhnliche Konstruktion bezeichnet das Verwurzeln ihres Stammes. „Wurzeln schlagen“ ist idiomatisch und bewahrt sowohl Stamm als auch Wurzelbild.
- source_word: נָשַׁף בָּהֶם
  choice: da bläst er sie nur an
  rationale: נשׁף bedeutet „blasen/hauchen“. „Nur“ verdeutlicht, ohne die Handlung auszubauen, wie mühelos die Vernichtung erfolgt.
- source_word: וַיִּבָשׁוּ
  choice: sie verdorren
  rationale: יבש bezeichnet das Austrocknen oder Verdorren und setzt das Pflanzenbild passend fort.
- source_word: סְעָרָה
  choice: ein Sturm
  rationale: Das Substantiv kann Sturm, Unwetter oder Wirbelsturm bezeichnen. „Sturm“ ist verständlich und lässt die genaue Art offen.
- source_word: כַּקַּשׁ
  choice: wie Stoppeln
  rationale: קשׁ bezeichnet Ernterückstände wie Stoppeln oder Stroh; „Stoppeln“ wahrt das konkrete landwirtschaftliche Bild besser als „Spreu“.
- source_word: תִּשָּׂאֵם
  choice: trägt sie fort
  rationale: נשׂא bezeichnet hier das Aufnehmen und Forttragen. Die Formulierung bleibt bildhaft, ohne die Art der Bewegung stärker als der Ausgangstext festzulegen.
theological_decisions:
- issue: Bezugsgröße des unausgesprochenen Subjekts bei „bläst“
  choice: Das Pronomen „er“ bezieht sich auf Gott als fortwirkendes Subjekt aus dem unmittelbaren Zusammenhang.
  alternative: Ein unpersönlicher Wind bläst sie an.
  rationale: Jesaja 40,23–24 beschreibt durchgehend das Handeln dessen, der Herrscher zunichtemacht. „Er“ bewahrt die persönliche göttliche Urheberschaft, ohne den Gottesnamen dort einzufügen, wo der hebräische Text ihn nicht wiederholt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Dreierstruktur. Das Pflanzenbild wird konsequent bewahrt; „da“ markiert den raschen Umschlag, und die Semikolonverbindung hält die beiden Vernichtungshandlungen eng zusammen.
