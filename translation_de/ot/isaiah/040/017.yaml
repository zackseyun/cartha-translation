id: ISA.40.17
reference: Isaiah 40:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל הַ/גּוֹיִ֖ם כְּ/אַ֣יִן נֶגְדּ֑/וֹ מֵ/אֶ֥פֶס וָ/תֹ֖הוּ נֶחְשְׁבוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: de
  text: Alle Völker sind wie nichts vor ihm; für weniger als nichts und Leere gelten sie ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Nichtigkeit und Chaos/Öde werden sie von ihm angesehen.“ Das hebräische תֹהוּ kann auch „Öde“, „Formlosigkeit“ oder „Chaos“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: Alle Völker
  rationale: כָּל bezeichnet hier die Gesamtheit, und גּוֹיִם meint die Völker beziehungsweise Nationen. „Alle Völker“ ist im Deutschen natürlich und vermeidet eine unnötige ethnische Eingrenzung.
- source_word: כְּאַיִן
  choice: wie nichts
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; אַיִן bedeutet „nichts“ oder „Nichtsein“. „Wie nichts“ bewahrt die Vergleichsform und klingt in modernem Deutsch idiomatisch.
- source_word: נֶגְדּוֹ
  choice: vor ihm
  rationale: נֶגֶד kann die Stellung vor jemandem sowie eine relationale oder wertende Gegenüberstellung ausdrücken. „Vor ihm“ erhält diese Offenheit.
- source_word: מֵאֶפֶס
  choice: für weniger als nichts
  rationale: מִן wird im Zusammenhang als Vergleich beziehungsweise Steigerung verstanden; אֶפֶס bezeichnet Nichtigkeit oder ein völliges Nichts. Die Wendung gibt die rhetorische Zuspitzung gegenüber dem ersten Halbvers wieder.
- source_word: וָתֹהוּ
  choice: und Leere
  rationale: תֹהוּ hat ein Bedeutungsspektrum von Leere und Öde bis zu Formlosigkeit oder Chaos. „Leere“ passt zur Parallelität mit אֶפֶס, ohne mögliche Nebenbedeutungen zu verschweigen.
- source_word: נֶחְשְׁבוּ לוֹ
  choice: gelten sie ihm
  rationale: Das Nifal von חשׁב bedeutet „gerechnet“, „angesehen“ oder „eingeschätzt werden“; לֹו bezeichnet den Maßstab beziehungsweise die Perspektive. „Gelten sie ihm“ ist knapp, gegenwartsnah und wahrt diese Perspektive.
theological_decisions:
- issue: Stärke und Art der Nichtigkeitsaussage
  choice: Die Ausdrücke מֵאֶפֶס וָתֹהוּ werden als gesteigerte Wertung „für weniger als nichts und Leere“ wiedergegeben.
  alternative: „als Nichtigkeit und Chaos“ beziehungsweise „von Nichts und Öde her“
  rationale: Der Parallelismus hebt Gottes Unvergleichlichkeit gegenüber sämtlichen Völkern hervor. Die Übersetzung bewahrt die rhetorische Steigerung, ohne daraus eine weitergehende metaphysische Aussage über die Existenz der Völker abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelität und die Abstufung von „wie nichts“ zu „weniger als nichts und Leere“ werden erhalten.
