  naturalness: Modernes, klares Standarddeutsch mit angemessen prophetisch-feierlichem Ton. „Steig auf einen hohen Berg“, „Erhebe deine Stimme mit Kraft“ und „Fürchte dich nicht“ sind idiomatisch. „Seht“ passt als Pluralanrede an die Städte beziehungsweise deren Bewohner.
