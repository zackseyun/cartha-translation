id: ISA.40.9
reference: Isaiah 40:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: de
  text: 'Steig auf einen hohen Berg, du Botin guter Nachricht für Zion[a]! Erhebe deine Stimme mit Kraft, du Botin guter Nachricht für Jerusalem[b]! Erhebe sie, fürchte dich nicht! Sag den Städten Judas: »Seht, euer Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Zion, du Botin guter Nachricht, steig auf einen hohen Berg!“ Das Hebräische kann Zion als direkt angeredete, personifizierte Botin verstehen oder von einer Botin sprechen, die Zion gute Nachricht bringt.'
    reason: alternative_reading
  - marker: b
    text: 'Entsprechend auch: „Jerusalem, du Botin guter Nachricht, erhebe deine Stimme mit Kraft!“ Die feminine Form kann eine Botin bezeichnen oder auf die personifizierte Stadt bezogen sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִי
  choice: Steig hinauf / Steig auf
  rationale: Der feminine Singularimperativ von עלה bezeichnet das Hinaufsteigen; in Verbindung mit „auf einen hohen Berg“ ist „Steig auf“ im Deutschen natürlich und richtungsgenau.
- source_word: הַר גָּבֹהַ
  choice: einen hohen Berg
  rationale: Die Wortgruppe bezeichnet einen erhöhten Ort für eine weithin hörbare Verkündigung. Der unbestimmte Artikel entspricht hier natürlichem Deutsch, während der hebräische Artikel generisch verstanden werden kann.
- source_word: מְבַשֶּׂרֶת
  choice: Botin guter Nachricht
  rationale: Das feminine Partizip bezeichnet jemanden, der gute Nachricht verkündet. Die Formulierung bewahrt den partizipialen Sinn und das feminine Genus; die syntaktische Zuordnung zu Zion und Jerusalem wird durch Fußnoten als mehrdeutig ausgewiesen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der überlieferte Orts- und Stadtname wird in seiner üblichen deutschen Form beibehalten.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Der Stadtname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: הָרִימִי
  choice: Erhebe
  rationale: Der zweimalige feminine Imperativ wird bewusst wiederholt. „Erhebe deine Stimme“ ist würdig, verständlich und bildet beim zweiten Vorkommen mit „sie“ den hebräischen Nachdruck ab.
- source_word: בַכֹּחַ
  choice: mit Kraft
  rationale: Die substantivische Ausdrucksweise des Hebräischen bleibt erhalten und bezeichnet die kraftvolle, öffentliche Verkündigung.
- source_word: קוֹלֵךְ
  choice: deine Stimme
  rationale: Im Zusammenhang der Verkündigung ist „Stimme“ die natürliche und genaue Entsprechung.
- source_word: אַל תִּירָאִי
  choice: fürchte dich nicht
  rationale: Die knappe Verbotsform und der feminine Singularimperativ werden direkt wiedergegeben.
- source_word: אִמְרִי
  choice: Sag
  rationale: Der einfache Imperativ von אמר wird ohne unnötige Verstärkung wiedergegeben; der Zusammenhang macht den öffentlichen Charakter des Sagens deutlich.
- source_word: לְעָרֵי יְהוּדָה
  choice: den Städten Judas
  rationale: Die Formulierung gibt die Zielangabe und die geografische Bezeichnung knapp und idiomatisch wieder.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeitspartikel wird als verständlicher Aufforderungsruf wiedergegeben. Der Plural richtet sich passend an die angesprochenen Städte beziehungsweise ihre Bewohner.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Das Substantiv mit Suffix der zweiten Person Plural bezeichnet den Gott der Angesprochenen. Da der Gottesname JHWH in diesem Vers nicht steht, lautet die Wiedergabe „Gott“, nicht „der HERR“.
theological_decisions:
- issue: Syntaktische Zuordnung von מְבַשֶּׂרֶת zu Zion und Jerusalem
  choice: Im Haupttext wird eine Botin guter Nachricht für Zion beziehungsweise Jerusalem angeredet.
  alternative: 'Zion und Jerusalem selbst können als personifizierte Freudenbotinnen direkt angeredet sein: „Zion, du Botin guter Nachricht … Jerusalem, du Botin guter Nachricht …“'
  rationale: Die knappe hebräische Fügung lässt sowohl eine Botin für die Städte als auch die personifizierten Städte in der Rolle der Botin zu. Der Haupttext wählt eine gut verständliche Lesart; die echte syntaktische und bildhafte Mehrdeutigkeit bleibt in den Fußnoten ausdrücklich erhalten.
- issue: Referenz von אֱלֹהֵיכֶם
  choice: euer Gott
  alternative: Keine Wiedergabe mit „der HERR“
  rationale: Hier steht אֱלֹהִים mit Possessivsuffix und nicht der Gottesname יהוה. Die Übersetzung wahrt diesen lexikalischen Unterschied.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Klang. Die Imperative bleiben knapp und eindringlich; die Wiederholung von „Erhebe“ wird als rhetorischer Nachdruck bewahrt. „Botin guter Nachricht“ vermeidet altertümliches oder konfessionell geprägtes Vokabular und macht das feminine Partizip sichtbar.
