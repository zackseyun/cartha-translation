reference: Isaiah 40:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: de
  text: 'Eine Stimme ruft: »Bereitet in der Wüste den Weg Jahwes[a]; ebnet in der Steppe eine Straße für unseren Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei anderer Gliederung: »Eine Stimme ruft in der Wüste: ›Bereitet den Weg Jahwes; ebnet in der Steppe eine Straße für unseren Gott!‹«'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וֹל
  choice: Eine Stimme
  rationale: קוֹל bezeichnet hier eine hörbare Stimme; der unbestimmte deutsche Artikel entspricht der präsentierenden Eröffnung des hebräischen Satzes.
- source_word: קוֹרֵא
  choice: ruft
  rationale: Das Partizip bezeichnet fortdauerndes oder aktuelles Rufen. Im Deutschen ergibt die finite Form zusammen mit »Eine Stimme« einen natürlichen, zugleich lebendigen Satz.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land. Aufgrund der masoretischen Akzentsetzung wird die Wendung im Haupttext mit dem folgenden Befehl verbunden; die syntaktisch mögliche Alternative steht in der Fußnote.
- source_word: פַּנּוּ
  choice: Bereitet
  rationale: פנה bedeutet in diesem Zusammenhang, einen Weg freizumachen beziehungsweise herzurichten. »Bereitet« gibt das Bild einer für die Ankunft angelegten Route idiomatisch wieder.
- source_word: דֶּרֶךְ
  choice: den Weg
  rationale: דֶּרֶךְ kann Weg, Straße oder Route bedeuten. »Weg« bewahrt sowohl das konkrete Straßenbild als auch die weiterreichende Bildhaftigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: יַשְּׁרוּ
  choice: ebnet
  rationale: ישׁר bezeichnet hier das Gerade-, Eben- oder Gangbarmachen einer Straße. »Ebnet« ist im Deutschen ein natürlicher Ausdruck für die im Parallelismus beschriebene Straßenbereitung.
- source_word: בָּעֲרָבָה
  choice: in der Steppe
  rationale: עֲרָבָה meint eine trockene, offene Ebene beziehungsweise Wüstensteppe. »Steppe« unterscheidet den Ausdruck von מִדְבָּר und wahrt den poetischen Parallelismus.
- source_word: מְסִלָּה
  choice: eine Straße
  rationale: מְסִלָּה bezeichnet eine eigens angelegte, oft aufgeschüttete Straße. Das heutige deutsche »Straße« ist klarer als »Hochstraße«, das leicht eine moderne Überführung vermuten ließe.
- source_word: לֵאלֹהֵינוּ
  choice: für unseren Gott
  rationale: אֱלֹהִים ist formal pluralisch, bezeichnet hier aber nach regelmäßigem biblischem Sprachgebrauch den einen Gott Israels; das Suffix wird mit »unseren« wiedergegeben.
theological_decisions:
- issue: Syntaktische Zuordnung von »in der Wüste«
  choice: 'Im Haupttext gehört »in der Wüste« zum Befehl: »Bereitet in der Wüste den Weg Jahwes.«'
  alternative: 'Die Ortsangabe kann zum Rufen gehören: »Eine Stimme ruft in der Wüste: Bereitet den Weg Jahwes.«'
  rationale: Die masoretische Akzentsetzung stützt die Zuordnung zum folgenden Imperativ. Da der unpunktierte Konsonantentext auch die andere Gliederung zulässt und diese in den neutestamentlichen Zitaten wirksam ist, wird sie ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Imperative und der parallele Satzbau erhalten den Charakter eines öffentlichen Heroldsrufs. »Steppe« ist präzise und allgemein verständlich; »Straße« vermeidet die missverständliche moderne Bedeutung von »Hochstraße«.
