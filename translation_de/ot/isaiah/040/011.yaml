  terminology: „Hirte“, „Herde“, „Lämmer“ und „Mutterschafe“ bewahren das konkrete pastorale Bild. „Behutsam führen“ ist eine angemessene kontextuelle Entfaltung von יְנַהֵל, ohne eine theologische Deutung einzutragen. Die Fußnoten sind korrekt verankert und erläutern beziehungsweise bieten sinnvolle Alternativen.
