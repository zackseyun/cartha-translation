id: ISA.40.11
reference: Isaiah 40:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/רֹעֶה֙ עֶדְר֣/וֹ יִרְעֶ֔ה בִּ/זְרֹע/וֹ֙ יְקַבֵּ֣ץ טְלָאִ֔ים וּ/בְ/חֵיק֖/וֹ יִשָּׂ֑א עָל֖וֹת יְנַהֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: de
  text: Wie ein Hirte wird er seine Herde weiden[a]. Mit seinem Arm wird er die Lämmer sammeln und sie an seiner Brust tragen[b]; die säugenden Mutterschafe[c] wird er behutsam führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ein Hirte wird er für seine Herde sorgen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in seinem Schoß“; gemeint ist das enge, schützende Tragen am Körper.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Mutterschafe mit ihren Jungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  choice: Wie ein Hirte
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich. „Wie ein Hirte“ bewahrt das einleitende Hirtenbild in natürlichem Deutsch.
- source_word: עֶדְרוֹ יִרְעֶה
  choice: wird er seine Herde weiden
  rationale: עֵדֶר bezeichnet hier eine Schafherde; רעה meint das Weiden beziehungsweise die fürsorgliche Tätigkeit eines Hirten. „Weiden“ erhält den konkreten Bildgehalt.
- source_word: בִּזְרֹעוֹ יְקַבֵּץ
  choice: Mit seinem Arm wird er … sammeln
  rationale: בְּ ist hier instrumental oder begleitend zu verstehen. Die Formulierung verbindet die Kraft des Arms mit dem fürsorglichen Sammeln.
- source_word: טְלָאִים
  choice: die Lämmer
  rationale: Das Wort bezeichnet Lämmer. Der bestimmte Artikel entspricht im Deutschen dem Bezug auf die Lämmer seiner Herde.
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: und sie an seiner Brust tragen
  rationale: חֵיק bezeichnet Schoß oder Brustbereich. „An seiner Brust“ ist im Deutschen anschaulich und bewahrt die Nähe und Geborgenheit des Bildes; „sie“ nimmt das im Hebräischen vorausgesetzte Objekt „Lämmer“ auf.
- source_word: עָלוֹת
  choice: die säugenden Mutterschafe
  rationale: Der Ausdruck bezeichnet weibliche Tiere, die säugen beziehungsweise Junge bei sich haben. „Säugende Mutterschafe“ wahrt die pastorale Konkretheit.
- source_word: יְנַהֵל
  choice: wird er behutsam führen
  rationale: נהל bedeutet führen oder leiten und trägt in diesem Zusammenhang den Gedanken fürsorglicher Führung. „Behutsam“ macht die durch die verletzlichen Muttertiere nahegelegte Art des Führens deutlich, ohne das Hirtenbild aufzulösen.
theological_decisions:
- issue: Göttliches Hirtenbild
  choice: Das Hirtenbild wird unmittelbar auf Gottes fürsorgliches Handeln bezogen, ohne eine spätere messianische oder christologische Deutung in den Wortlaut einzutragen.
  alternative: Eine deutende Übersetzung, die eine messianische Erfüllung ausdrücklich hervorhebt.
  rationale: Der hebräische Vers schildert JHWHs Kraft und Zuwendung im Bild eines Hirten. Die Übersetzung bewahrt dieses alttestamentliche Bild und lässt weiterführende theologische Bezüge offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klang. Das konkrete Hirtenbild bleibt erhalten; ungebräuchliches „Busen“ wird zugunsten von „an seiner Brust“ vermieden. Die futurischen Formen entsprechen dem Zusammenhang und den hebräischen Imperfektformen.
