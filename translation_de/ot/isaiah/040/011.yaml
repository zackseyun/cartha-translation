  source_fidelity: 'Die Übersetzung gibt die hebräische Bildfolge und die Prädikate zuverlässig wieder: der Vergleich „wie ein Hirte“, das Weiden der Herde, das Sammeln der Lämmer mit seinem Arm, das Tragen im Bereich seines חֵיק und das behutsame Führen der säugenden Muttertiere. Das ergänzte Objekt „sie“ bei „tragen“ ist durch „die Lämmer“ eindeutig gedeckt. Die Zukunftsformen passen zum Kontext und zu den Imperfektformen.'
