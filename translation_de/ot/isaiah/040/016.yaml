id: ISA.40.16
reference: Isaiah 40:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר וְ/חַיָּת֔/וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: de
  text: Und der Libanon reicht nicht als Brennholz aus,[a] und seine Tiere reichen nicht für ein Brandopfer aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Libanon war für seine ausgedehnten Wälder berühmt. Gemeint ist: Selbst all sein Holz würde für das Feuer nicht ausreichen.'
    reason: cultural_note
  - marker: b
    text: Das hebräische Wort kann auch „seine wilden Tiere“ bedeuten; sie werden hier als mögliche Opfertiere betrachtet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: der Libanon
  rationale: Der Ortsname bleibt entsprechend dem Hebräischen erhalten. Im Zusammenhang steht der Libanon metonymisch für seinen berühmten Waldreichtum.
- source_word: אֵין דֵּי
  choice: reicht nicht … aus
  rationale: Die Wendung bezeichnet mangelnde Genüge oder Hinlänglichkeit; diese Formulierung ist im modernen Deutschen natürlich und bewahrt den quantitativen Sinn.
- source_word: בָּעֵר
  choice: als Brennholz
  rationale: Der Infinitiv bezeichnet hier das Verbrennen beziehungsweise das Brennmaterial für das Opferfeuer. „Als Brennholz“ macht den im Hebräischen knappen Sinn idiomatisch deutlich, ohne den Bezug auf den Libanon aufzugeben.
- source_word: וְחַיָּתוֹ
  choice: und seine Tiere
  rationale: חַיָּה kann Tiere oder speziell wilde Tiere bezeichnen. „Seine Tiere“ bewahrt die Breite des Ausdrucks und den Rückbezug auf den Libanon.
- source_word: עוֹלָה
  choice: ein Brandopfer
  rationale: עוֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer. Der Singular des Hebräischen wird beibehalten.
theological_decisions:
- issue: Aussagekraft des Opferbildes
  choice: Selbst der gesamte Holz- und Tierbestand des Libanon würde für ein Gottes Größe angemessenes Opfer nicht ausreichen.
  alternative: Allgemeine Aussage, dass sämtliche menschlichen Mittel der Gottesverehrung unzureichend sind.
  rationale: Der Zusammenhang in Jesaja 40,12–17 betont Gottes unvergleichliche Größe. Die Übersetzung bewahrt das konkrete Opferbild, ohne daraus eine weitergehende Lehrbehauptung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen wird bewahrt; „als Brennholz“ verdeutlicht den elliptischen Ausdruck natürlich. Sämtliche Fußnotenmarker stehen im Haupttext.
