source:
  edition: WLC
  text: וְ/אֶל מִ֖י תְּדַמְּי֣וּ/ן אֵ֑ל וּ/מַה דְּמ֖וּת תַּ֥עַרְכוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: de
  text: Mit wem wollt ihr Gott vergleichen, und welches Abbild wollt ihr ihm gegenüberstellen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit wem wollt ihr Gott gleichsetzen, und welche Gestalt wollt ihr mit ihm vergleichen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: Mit wem
  rationale: אֶל מִי bezeichnet hier die Bezugsgröße des Vergleichs. Im Deutschen ist „mit wem vergleichen“ natürlicher als die formal nähere Konstruktion „wem gleichsetzen“. Das vorangestellte וְ verbindet die Frage mit dem Kontext; ein zusätzliches „also“ ist möglich, aber nicht erforderlich.
- source_word: תְּדַמְּיוּן
  choice: wollt ihr … vergleichen
  rationale: Das Verb דמה bedeutet im Piʿel „gleichen, vergleichen“. Die modale Zukunftsform „wollt ihr“ gibt die rhetorische Herausforderung im Deutschen natürlich wieder, ohne eine bloß zeitliche Zukunft festzulegen.
- source_word: אֵל
  choice: Gott
  rationale: Im Zusammenhang von Jesaja 40 bezeichnet אֵל den einen Gott, dessen Unvergleichlichkeit gegenüber Götzenbildern betont wird.
- source_word: וּ/מַה
  choice: und welches
  rationale: Die Verbindung aus וְ und dem Fragewort מַה leitet den parallelen zweiten Frageteil ein. Wegen des gewählten Substantivs „Abbild“ wird מַה idiomatisch mit „welches“ wiedergegeben.
- source_word: דְּמוּת
  choice: Abbild
  rationale: דְּמוּת kann „Gestalt“, „Ähnlichkeit“ oder „Abbild“ bedeuten. „Abbild“ passt zum folgenden Kontext der hergestellten Götterbilder und bleibt zugleich als Bezeichnung einer vergleichbaren Darstellung verständlich.
- source_word: תַּעַרְכוּ
  choice: wollt ihr … gegenüberstellen
  rationale: ערך bedeutet grundlegend „ordnen, aufstellen“ und kann hier das Gegenüberstellen zum Vergleich bezeichnen. „Gegenüberstellen“ bewahrt diese konkrete Nuance besser als eine Wiederholung von „vergleichen“.
- source_word: לֽוֹ
  choice: ihm
  rationale: Das Suffix mit ל bezeichnet Gott als Bezugsgröße des Gegenüberstellens; „ihm gegenüberstellen“ ist die natürliche deutsche Konstruktion.
theological_decisions:
- issue: Wiedergabe von אֵל in der rhetorischen Frage gegen den Götzendienst
  choice: Gott
  alternative: ein Gott
  rationale: Der unmittelbare Zusammenhang spricht vom unvergleichlichen Schöpfer und stellt ihm gefertigte Bilder gegenüber. „Gott“ gibt diesen bestimmten Bezug wieder, ohne zusätzliche dogmatische Titel einzuführen.
- issue: Verhältnis von Gott und דְּמוּת
  choice: welches Abbild wollt ihr ihm gegenüberstellen
  alternative: welche Gestalt wollt ihr mit ihm vergleichen
  rationale: Die Übersetzung hält die rhetorische Unmöglichkeit einer angemessenen Darstellung Gottes fest, formuliert jedoch kein über den Vers hinausgehendes Bilderverbot und löst die Bild- und Vergleichssprache nicht dogmatisch auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural und die parallele rhetorische Frage bleiben erhalten; „Abbild“ und „gegenüberstellen“ bewahren sowohl den Vergleichssinn als auch den konkreten Horizont der folgenden Götzenbildpolemik.
