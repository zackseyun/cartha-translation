source:
  edition: WLC
  text: מִֽי תִכֵּ֥ן אֶת ר֖וּחַ יְהוָ֑ה וְ/אִ֥ישׁ עֲצָת֖/וֹ יוֹדִיעֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: de
  text: Wer hat den Geist Jahwes[a][b] ermessen, und welcher Mensch könnte ihn als sein Ratgeber unterweisen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Sinn Jahwes“. Das hebräische Wort kann Geist, Atem oder innere Gesinnung bezeichnen; die alte griechische Übersetzung, die in Römer 11,34 aufgegriffen wird, hat „Sinn“ beziehungsweise „Denken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wer hat den Geist Jahwes gelenkt, und welcher Mensch hat ihm seinen Rat kundgetan?“ Diese Wiedergabe spiegelt andere mögliche Deutungen der hebräischen Verben und Satzbezüge wider.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragewort eröffnet eine rhetorische Frage; „Wer“ entspricht dem Hebräischen knapp und natürlich.
- source_word: תִכֵּן
  choice: hat … ermessen
  rationale: Das Verb bezeichnet grundlegend das Abmessen, Abwägen oder Bestimmen. „Ermessen“ bewahrt hier die Messmetaphorik und bezeichnet zugleich das vollständige Erfassen.
- source_word: רוּחַ יְהוָה
  choice: den Geist Jahwes
  rationale: רוּחַ kann Geist, Atem, Wind oder innere Gesinnung bezeichnen. Im Zusammenhang mit dem Gottesnamen ist „Geist Jahwes“ eine natürliche Wiedergabe; die mögliche Bedeutung „Sinn“ bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאִישׁ עֲצָתוֹ
  choice: und welcher Mensch … als sein Ratgeber
  rationale: 'אִישׁ ist der Singular „Mensch/Mann“. עֲצָתוֹ lässt sich syntaktisch als prädikative Bestimmung zu אִישׁ verstehen: „als Mann seines Rates“, also „als sein Ratgeber“.'
- source_word: יוֹדִיעֶנּוּ
  choice: könnte ihn … unterweisen
  rationale: Der Hifil von ידע bedeutet „wissen lassen, kundtun, unterrichten“. Mit dem Objektsuffix ergibt sich natürlich „ihn unterweisen“; der Modalwert „könnte“ bringt die rhetorische Verneinung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: Geist Jahwes
  alternative: Sinn Jahwes
  rationale: Die Hauptfassung bewahrt die gewöhnliche Bedeutung „Geist“, ohne die in der antiken griechischen Tradition und Römer 11,34 bezeugte Deutung als „Sinn“ auszuschließen.
- issue: Syntax der zweiten Vershälfte
  choice: welcher Mensch könnte ihn als sein Ratgeber unterweisen?
  alternative: welcher Mensch könnte ihm seinen Rat kundtun?
  rationale: Die masoretische Akzentuierung und die Konstruktion אִישׁ עֲצָתוֹ stützen die Auffassung „Mann seines Rates/Ratgeber“. Die Alternative ist grammatisch möglich, löst aber die Pronomen anders auf und wird deshalb in einer Fußnote bewahrt.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Die Hauptfassung gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder; die traditionelle Titelwiedergabe ist für diese Stelle nicht erforderlich.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Ermessen“ erhält die Messmetaphorik des Zusammenhangs, während „als sein Ratgeber unterweisen“ die wahrscheinlichere Syntax der zweiten Vershälfte natürlich wiedergibt. Beide Fußnotenmarker stehen unmittelbar nach der mehrdeutigen Wendung im Haupttext.
