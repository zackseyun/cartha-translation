source:
  edition: WLC
  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: de
  text: Er gibt dem Müden Kraft und mehrt dem Kraftlosen[a] die Stärke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dem, der keine Kraft hat, mehrt er die Stärke.“'
    reason: Die Wendung וּלְאֵין אוֹנִים kann entweder verdichtet als „dem Kraftlosen“ oder ausdrücklicher als „dem, der keine Kraft hat“ wiedergegeben werden.
lexical_decisions:
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Qal-Partizip beschreibt hier im Zusammenhang Gottes charakteristisches, fortdauernd gültiges Handeln. Das deutsche Präsens gibt diesen allgemeinen Aussagewert natürlich wieder.
- source_word: לַיָּעֵף
  choice: dem Müden
  rationale: Das Wort bezeichnet einen ermatteten oder erschöpften Menschen. „Dem Müden“ ist knapp, verständlich und bewahrt den poetischen Ton.
- source_word: כֹּחַ
  choice: Kraft
  rationale: Gemeint ist die persönliche Fähigkeit und körperlich-seelische Kraft des Ermatteten, nicht abstrakte Macht.
- source_word: וּלְאֵין אוֹנִים
  choice: dessen, der keine Kraft mehr hat
  rationale: אֵין bezeichnet das Fehlen, während אוֹנִים Kraft oder Leistungsvermögen ausdrückt. Die Formulierung gibt den gemeinten Menschen ohne verbleibende Kraft idiomatisch wieder.
- source_word: עָצְמָה
  choice: Stärke
  rationale: Das Substantiv bezeichnet Stärke oder Macht. „Stärke“ wahrt die Parallelität zu כֹּחַ, ohne beide hebräischen Begriffe völlig gleich wiederzugeben.
- source_word: יַרְבֶּה
  choice: mehrt
  rationale: Der Hifil von רבה bedeutet, etwas zahlreich oder groß zu machen beziehungsweise zu vermehren. „Mehrt“ bewahrt den kausativen Sinn und passt zum gehobenen poetischen Register.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verses
  choice: „Er“ bezieht sich auf Gott
  alternative: Den Gottesnamen ausdrücklich wiederholen
  rationale: Im Hebräischen steht in diesem Vers kein ausdrückliches Subjekt; aus dem unmittelbaren Zusammenhang ist jedoch Gott beziehungsweise der HERR gemeint. Das Pronomen bewahrt den Anschluss an den Kontext, ohne den Gottesnamen in den Vers einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdevollem poetischem Klang. Die parallelen Begriffe „Kraft“ und „Stärke“ bilden die hebräische Parallelstruktur ab; „mehrt“ ist bewusst etwas gehobener, aber weiterhin geläufig.
