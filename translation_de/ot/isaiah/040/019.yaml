  text: הַ/פֶּ֨סֶל֙ נָסַ֣ךְ חָרָ֔שׁ וְ/צֹרֵ֖ף בַּ/זָּהָ֣ב יְרַקְּעֶ֑/נּוּ וּ/רְתֻק֥וֹת כֶּ֖סֶף צוֹרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: de
  text: Das Götzenbild gießt ein Handwerker; ein Goldschmied überzieht es mit Gold und schmiedet dafür Ketten aus Silber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: das Götzenbild
  rationale: Bezeichnet hier ein von Menschen hergestelltes Kultbild; „Götzenbild“ gibt im Zusammenhang die polemische Aussage natürlich und verständlich wieder.
- source_word: נָסַךְ חָרָשׁ
  choice: gießt ein Handwerker
  rationale: נסך bezeichnet hier das Gießen von Metall, חרש den ausführenden Kunsthandwerker.
- source_word: בַּזָּהָב יְרַקְּעֶנּוּ
  choice: überzieht es mit Gold
  rationale: רקע beschreibt das Breithämmern beziehungsweise Aufbringen des Goldes; „überzieht“ gibt das Ergebnis dieses Arbeitsvorgangs idiomatisch wieder.
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: und schmiedet dafür Ketten aus Silber
  rationale: Die Wendung beschreibt die kunsthandwerkliche Herstellung silberner Ketten. „Schmiedet“ bewahrt den handwerklichen Charakter und „dafür“ macht den Bezug zum Götzenbild deutlich.
theological_decisions:
- issue: Wertung des hergestellten Bildes
  choice: Götzenbild
  alternative: Bildwerk / Kultbild
  rationale: Der weitere Zusammenhang stellt das von Menschen gefertigte Bild dem unvergleichlichen Gott gegenüber. „Götzenbild“ bringt diese im Text angelegte Kritik zum Ausdruck, ohne zusätzliche konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper, paralleler Satzstruktur. Die Abfolge der handwerklichen Tätigkeiten und die polemische Wirkung des hebräischen Verses bleiben erhalten.
