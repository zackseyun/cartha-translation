  text: נַחֲמ֥וּ נַחֲמ֖וּ עַמִּ֑/י יֹאמַ֖ר אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/001.yaml
  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: de
  text: Tröstet, tröstet mein Volk[a], spricht euer Gott.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Redet meinem Volk tröstend zu.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch auch: „wird euer Gott sagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲמוּ
  choice: Tröstet
  rationale: Der Piel-Imperativ Plural fordert unmittelbar dazu auf, Trost zu geben. „Tröstet“ ist im Deutschen natürlich, prägnant und bewahrt den Aufforderungscharakter.
- source_word: נַחֲמוּ נַחֲמוּ
  choice: Tröstet, tröstet
  rationale: Die Wiederholung wird beibehalten, weil sie Nachdruck, Dringlichkeit und den feierlichen Klang des Hebräischen trägt.
- source_word: עַמִּי
  choice: mein Volk
  rationale: „Mein Volk“ gibt sowohl die gemeinschaftliche Bedeutung von עַם als auch die im Possessiv ausgedrückte Bundesbeziehung angemessen wieder.
- source_word: יֹאמַר
  choice: spricht
  rationale: Obwohl die Form morphologisch ein Imperfekt ist und auch zukünftig verstanden werden kann, dient sie hier als prophetische Redeeinleitung. Das etablierte deutsche „spricht“ gibt diese Funktion natürlich wieder.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: אֱלֹהִים bezeichnet hier den einen Gott Israels; das Suffix ist Plural. „Euer Gott“ entspricht daher Sinn und Grammatik.
theological_decisions:
- issue: Sprecherangabe und Bundesbeziehung
  choice: „spricht euer Gott“ als gegenwärtig wirkende prophetische Redeeinleitung
  alternative: „wird euer Gott sagen“ mit ausdrücklich zukünftigem Sinn
  rationale: Die Wiedergabe wahrt die Zuwendung in „mein Volk“ und „euer Gott“, ohne die nicht genannten Adressaten des pluralischen Befehls zu bestimmen. Die mögliche Zukunftsnuance von יֹאמַר wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Wiederholung bleibt erhalten; „spricht“ folgt dem etablierten prophetischen Sprachgebrauch, während die formale Zukunftsnuance des hebräischen Imperfekts in der Fußnote sichtbar bleibt.
