  text: בְּ/טֶ֥רֶם תָּחִ֖יל יָלָ֑דָה בְּ/טֶ֨רֶם יָב֥וֹא חֵ֛בֶל לָ֖/הּ וְ/הִמְלִ֥יטָה זָכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: de
  text: Bevor sie in den Wehen lag[a], gebar sie; bevor die Geburtswehen über sie kamen[b], brachte sie einen Sohn zur Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bevor sie sich in Geburtswehen wand.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sie“ ist im Zusammenhang Zion beziehungsweise Jerusalem gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die temporale Konjunktion gibt die Bedeutung „bevor“ klar und natürlich wieder; ihre Wiederholung bewahrt den Nachdruck des hebräischen Satzbaus.
- source_word: תָּחִיל
  choice: sie in den Wehen lag
  rationale: Das Verb bezeichnet hier das Sichwinden beziehungsweise die einsetzenden Geburtswehen. Die deutsche Wendung ist gegenwärtig, verständlich und dem Geburtskontext angemessen.
- source_word: יָלָדָה
  choice: sie gebar
  rationale: „Gebar“ entspricht dem gewöhnlichen Verb für das Gebären und bildet die knappe Aussage des Hebräischen würdig ab.
- source_word: יָבֹא ... לָהּ
  choice: über sie kamen
  rationale: Die Formulierung macht idiomatisch deutlich, dass die Wehen sie ereilen, und bewahrt zugleich das Bild eines Geschehens, das über sie kommt.
- source_word: חֵבֶל
  choice: Geburtswehen
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Substantiv den Schmerz beziehungsweise die Wehen bei der Geburt. „Geburtswehen“ macht diese Bedeutung im Deutschen eindeutig.
- source_word: וְהִמְלִיטָה
  choice: brachte sie ... zur Welt
  rationale: Der Hifil von מלט bezeichnet hier das Hervorbringen beziehungsweise Entbinden. Die gewählte Wendung ist natürliches modernes Deutsch und unterscheidet sich stilistisch von „gebar“.
- source_word: זָכָר
  choice: einen Sohn
  rationale: Wörtlich steht „ein Männliches“. Im unmittelbaren Geburtskontext gibt „einen Sohn“ die männliche Bestimmung idiomatisch wieder, ohne sie zu neutralisieren.
theological_decisions:
- issue: Bezug der gebärenden Frau
  choice: Das feminine Subjekt bleibt im Haupttext als „sie“ stehen.
  alternative: Zion beziehungsweise Jerusalem ausdrücklich im Haupttext nennen.
  rationale: Der Zusammenhang weist auf Zion/Jerusalem, doch der Vers selbst bezeichnet das Subjekt nur durch feminine Verbformen und ein Pronomen. Die Bildsprache und ihre Spannung bleiben daher im Haupttext erhalten; der wahrscheinliche Bezug wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Satzrhythmus. Die zweimalige Wiederholung von „bevor“ bildet die hebräische Parallelstruktur ab; „gebar“ und „brachte ... zur Welt“ vermeiden zugleich eine schwerfällige Wortwiederholung.
