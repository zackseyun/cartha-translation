  text: וְ/אָנֹכִ֗י מַעֲשֵׂי/הֶם֙ וּ/מַחְשְׁבֹ֣תֵי/הֶ֔ם בָּאָ֕ה לְ/קַבֵּ֥ץ אֶת כָּל הַ/גּוֹיִ֖ם וְ/הַ/לְּשֹׁנ֑וֹת וּ/בָ֖אוּ וְ/רָא֥וּ אֶת כְּבוֹדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: de
  text: Denn ich kenne ihre Taten und ihre Gedanken.[a] Die Zeit kommt, alle Nationen und Sprachen[b] zu versammeln. Sie werden kommen und meine Herrlichkeit sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist unvermittelt und syntaktisch schwierig. Die Wortfolge lautet etwa: „Und ich – ihre Taten und ihre Gedanken – kommt, um alle Nationen und die Sprachen zu versammeln“; die feminine Singularform „kommt“ lässt sich nicht eindeutig zuordnen. Häufig ergänzt man sinngemäß entweder „Denn ich kenne ihre Taten und ihre Gedanken“ oder „Die Zeit kommt, alle Nationen und Sprachen zu versammeln“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Zungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Denn ich
  rationale: Das selbstständige Pronomen betont den göttlichen Sprecher. „Denn“ gibt den Zusammenhang natürlich wieder, ohne den schwierigen Satzbau im Haupttext nachzuahmen.
- source_word: מַעֲשֵׂיהֶם
  choice: ihre Taten
  rationale: „Taten“ bezeichnet konkrete Handlungen und bildet im Deutschen ein natürliches Paar mit „Gedanken“.
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: ihre Gedanken
  rationale: „Gedanken“ ist die weiteste direkte Entsprechung; je nach Zusammenhang wären auch „Pläne“ oder „Absichten“ möglich.
- source_word: בָּאָה
  choice: Die Zeit kommt
  rationale: Die feminine Singularform steht syntaktisch unvermittelt. Die Ergänzung „Die Zeit“ ergibt im Deutschen einen verständlichen, zukunftsbezogenen Satz; die Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: לְקַבֵּץ
  choice: versammeln werde
  rationale: Gibt das Zusammenbringen der Völker idiomatisch wieder und fügt sich in die prophetische Zukunftsaussage ein.
- source_word: כָּל־הַגּוֹיִם
  choice: alle Nationen
  rationale: „Nationen“ bewahrt die internationale Reichweite und vermeidet eine unnötige Verengung auf „Heiden“.
- source_word: וְהַלְּשֹׁנוֹת
  choice: und Sprachen
  rationale: Wörtlich steht „Zungen“; gemeint sind hier Sprachgemeinschaften beziehungsweise Sprachen. „Sprachen“ ist im modernen Deutsch unmittelbar verständlich.
- source_word: וּבָאוּ וְרָאוּ
  choice: Sie werden kommen und … sehen
  rationale: Die Verbfolge wird entsprechend dem prophetischen Zusammenhang zukünftig wiedergegeben.
- source_word: כְּבוֹדִי
  choice: meine Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt das gewichtige, in Jesaja häufige Motiv der sichtbar werdenden göttlichen Gegenwart.
theological_decisions:
- issue: Wiedergabe des abgebrochenen und syntaktisch schwierigen Versanfangs
  choice: „Denn ich kenne ihre Taten und ihre Gedanken. Die Zeit kommt …“
  alternative: „Und ich – ihre Taten und ihre Gedanken – komme, um alle Nationen und Sprachen zu versammeln.“
  rationale: Im Hebräischen fehlen sowohl ein ausdrückliches Verb wie „kennen“ als auch das Substantiv „Zeit“; zugleich ist die feminine Verbform „kommt“ schwer mit „ich“ zu verbinden. Der Haupttext gibt eine verbreitete, kontextuell plausible Sinnfassung, während die Fußnote die Ellipse und andere mögliche Glättungen ausdrücklich sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext ist bewusst gut lesbar; die echte syntaktische Unsicherheit des masoretischen Textes wird nicht verschwiegen, sondern in Fußnote [a] dokumentiert. „Nationen“, „Sprachen“ und „Herrlichkeit“ sind verständlich und zugleich bibelsprachlich anschlussfähig.
