id: ISA.66.17
reference: Isaiah 66:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: de
  text: Die sich heiligen und sich reinigen, um in die Gärten zu gehen, einem in der Mitte folgend[a], die Schweinefleisch, Abscheuliches und Mäuse essen – sie werden allesamt ein Ende finden, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „einem in der Mitte folgend“. Die hebräische Wendung ist schwer verständlich. Gemeint sein könnte, dass sie einem Anführer folgen, jemandem ins Zentrum folgen oder bei einem kultischen Ritus einer nach dem anderen gehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: die sich heiligen
  rationale: Das Hitpael-Partizip bewahrt den reflexiven Sinn einer rituellen Selbstheiligung und zugleich die im Kontext liegende Ironie.
- source_word: וְהַמִּטַּהֲרִים
  choice: und sich reinigen
  rationale: Das reflexive Hitpael bezeichnet hier rituelle Reinigung und bildet ein natürliches Begriffspaar mit „sich heiligen“.
- source_word: אֶל הַגַּנּוֹת
  choice: um in die Gärten zu gehen
  rationale: אֶל bezeichnet die Bewegung auf die Gärten zu; die ergänzte Bewegungsangabe ergibt im Deutschen einen klaren, natürlichen Satz, ohne den kultischen Bezug näher festzulegen.
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: einem in der Mitte folgend
  rationale: Die schwierige Wendung wird eng am Konsonantentext und an der masoretischen Überlieferung wiedergegeben. Der unbestimmte Bezug von „einem“ bleibt erhalten.
- source_word: אֹכְלֵי
  choice: die … essen
  rationale: Das Partizip beschreibt dieselbe Gruppe weiter; ein deutscher Relativsatz ist hier klarer als eine weitere Partizipialfügung.
- source_word: בְּשַׂר הַחֲזִיר
  choice: Schweinefleisch
  rationale: Dies ist die natürliche moderne deutsche Entsprechung und bewahrt den konkreten Speisebezug.
- source_word: הַשֶּׁקֶץ
  choice: Abscheuliches
  rationale: Der Ausdruck bezeichnet etwas kultisch Abstoßendes oder Verabscheuungswürdiges. „Abscheuliches“ wahrt die Breite des Begriffs, ohne ihn vorschnell als bestimmte Tierart zu deuten.
- source_word: הָעַכְבָּר
  choice: Mäuse
  rationale: עַכְבָּר bezeichnet gewöhnlich Maus beziehungsweise Mäuse; der deutsche Plural passt zur Aussage über den Verzehr.
- source_word: יַחְדָּו יָסֻפוּ
  choice: sie alle werden miteinander ein Ende finden
  rationale: „Miteinander“ gibt יַחְדָּו wieder; „ein Ende finden“ wahrt den Grundsinn von סוף, ohne die Art des Gerichts über den Text hinaus festzulegen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם angemessen wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der dunklen kultischen Wendung אַחַר אחד בַּתָּוֶךְ
  choice: einem in der Mitte folgend
  alternative: einem folgend, einer nach dem anderen / hinter dem in der Mitte
  rationale: Wortlaut und Syntax sind unsicher. Der Haupttext bewahrt deshalb die Unbestimmtheit, während die Fußnote mögliche Deutungen nennt, ohne einen Ritualführer oder einen bestimmten Ritus dogmatisch vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eröffnende Partizipialkette und der Gedankenstrich erhalten die prophetische Verdichtung, während Relativsatz und idiomatische Wortwahl den Vers für heutige Leser verständlich machen. Die schwierige kultische Formulierung bleibt bewusst unaufgelöst.
