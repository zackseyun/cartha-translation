  text: שִׂמְח֧וּ אֶת יְרוּשָׁלִַ֛ם וְ/גִ֥ילוּ בָ֖/הּ כָּל אֹהֲבֶ֑י/הָ שִׂ֤ישׂוּ אִתָּ/הּ֙ מָשׂ֔וֹשׂ כָּל הַ/מִּֽתְאַבְּלִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: de
  text: Freut euch mit Jerusalem[a] und jubelt über sie, alle, die ihr sie liebt! Freut euch mit ihr voller Freude[b], alle, die ihr um sie trauert!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freut euch über Jerusalem.“ Die hebräische Konstruktion kann Jerusalem als Gegenstand der Freude bezeichnen; die parallelen Wendungen im Vers sprechen zugleich für gemeinsam mit Jerusalem erlebte Freude.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Freut euch mit ihr in Freude.“ Im Hebräischen stehen ein Verb und ein verwandtes Substantiv zusammen, um die Freude nachdrücklich hervorzuheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת יְרוּשָׁלִַם
  choice: Freut euch mit Jerusalem
  rationale: Der Pluralimperativ fordert zur Freude auf. אֶת kann hier Jerusalem als Gegenstand der Freude markieren; im poetischen Parallelismus mit אִתָּהּ („mit ihr“) liegt jedoch gemeinsames Sichfreuen nahe. Die Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: וְגִילוּ בָהּ
  choice: und jubelt über sie
  rationale: גיל bezeichnet lebhafte, jubelnde Freude. בָהּ beschreibt hier den Bezug der Freude auf die personifizierte Stadt; „über sie“ ist im Deutschen natürlicher als das missverständliche „in ihr“.
- source_word: כָּל אֹהֲבֶיהָ
  choice: alle, die ihr sie liebt
  rationale: Das Partizip bezeichnet alle, die Jerusalem lieben. Die Anredeform hält den unmittelbaren appellativen Charakter des Hebräischen fest.
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  choice: Freut euch mit ihr voller Freude
  rationale: אִתָּהּ bezeichnet eindeutig Gemeinschaft mit Jerusalem. Das verwandte Verb und Substantiv bilden eine figura etymologica; „freut euch … voller Freude“ bewahrt die emphatische Wiederholung in verständlichem Deutsch.
- source_word: כָּל הַמִּתְאַבְּלִים עָלֶיהָ
  choice: alle, die ihr um sie trauert
  rationale: Das Hitpael-Partizip von אבל bezeichnet Trauernde; עַל kennzeichnet den Gegenstand beziehungsweise Anlass der Trauer. „um sie trauern“ ist die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Jerusalem als personifizierte Mitfreuende oder als Gegenstand der Freude
  choice: Die Hauptfassung betont gemeinschaftliche Freude mit Jerusalem, ohne die Freude über Jerusalem auszuschließen.
  alternative: „Freut euch über Jerusalem“
  rationale: Die parallelen Ausdrücke בָהּ und besonders אִתָּהּ stützen die Vorstellung geteilter Freude, während אֶת auch objektbezogen verstanden werden kann. Die Alternative wird deshalb ausdrücklich in Fußnote [a] genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Personifizierung Jerusalems bleibt durch die femininen Pronomen erhalten. „Jubelt“ unterscheidet גיל von den übrigen Freudeverben; die ungewöhnliche hebräische Wortwiederholung wird in leicht geglätteter Form bewahrt.
