source:
  edition: WLC
  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: de
  text: Wer einen Ochsen schlachtet, ist wie einer, der einen Menschen erschlägt; wer ein Lamm opfert, wie einer, der einem Hund das Genick bricht; wer ein Speisopfer darbringt, wie einer, der Schweineblut darbringt; wer Weihrauch als Gedenkopfer darbringt, wie einer, der Frevel segnet.[a] Auch sie haben ihre eigenen Wege gewählt, und ihre Seele hat Gefallen an ihren Abscheulichkeiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unheil“ oder „Unrecht“; das hebräische Wort kann auch eine mit Götzendienst verbundene Bosheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Seele hat Gefallen“; das hebräische Substantiv und das Verb stehen in der Einzahl und beziehen sich gemeinsam auf die Gruppe.'
    reason: collective_singular
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: Wer einen Stier schlachtet
  rationale: Die substantivische Partizipialkonstruktion wird als allgemeingültiger Relativsatz wiedergegeben. „Stier“ bezeichnet das Opfertier natürlich und ohne die im Deutschen altertümlich klingende Bezeichnung „Ochse“.
- source_word: מַכֵּה אִישׁ
  choice: ist wie einer, der einen Menschen erschlägt
  rationale: Das im Hebräischen unausgesprochene Vergleichsverhältnis wird im Deutschen mit „ist wie“ verdeutlicht. „Erschlägt“ bewahrt die starke, möglicherweise tödliche Bedeutung von נכה, ohne eine unmarkierte Tötungsformulierung zu wählen.
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: wer ein Lamm opfert
  rationale: שֶׂה bezeichnet ein Tier vom Kleinvieh, also Schaf oder Ziege; im Opferzusammenhang ist „Lamm“ eine natürliche, verständliche Wiedergabe, ohne die kultische Handlung abzuschwächen.
- source_word: עֹרֵף כֶּלֶב
  choice: wie einer, der einem Hund das Genick bricht
  rationale: ערף bezeichnet hier das Brechen des Genicks, nicht gewöhnliches Enthaupten. Die konkrete und verstörende Bildwirkung bleibt erhalten.
- source_word: מַעֲלֵה מִנְחָה
  choice: wer ein Speisopfer darbringt
  rationale: מִנְחָה ist im kultischen Kontext das aus Getreide bestehende Speisopfer; „darbringen“ entspricht dem gehobenen, aber geläufigen Opferwortschatz.
- source_word: דַּם חֲזִיר
  choice: wie einer, der Schweineblut darbringt
  rationale: Die knappe hebräische Nominalfügung wird parallel zu den übrigen Vergleichen verbal entfaltet. „Schweineblut“ bewahrt die kultische Anstößigkeit des Bildes.
- source_word: מַזְכִּיר לְבֹנָה
  choice: wer Weihrauch als Gedenkopfer darbringt
  rationale: Der Hifil von זכר hat im Opferkontext die Bedeutung, eine Gedächtnisgabe beziehungsweise einen Gedächtnisanteil darzubringen. „Als Gedenkopfer“ gibt diese kultische Funktion verständlich wieder.
- source_word: מְבָרֵךְ אָוֶן
  choice: wie einer, der Frevel segnet
  rationale: אָוֶן kann Unheil, Unrecht, Frevel oder kultisch-idolatröse Bosheit bezeichnen. „Frevel“ erhält die moralische und kultische Schärfe, ohne den Ausdruck vorschnell auf ein Götzenbild festzulegen.
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  choice: Auch sie haben ihre eigenen Wege gewählt
  rationale: „Auch sie“ bewahrt die Hervorhebung durch גַּם הֵמָּה. „Ihre eigenen Wege“ macht im Kontext die selbstbestimmte Abkehr deutlich.
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: und ihre Seele hat Gefallen an ihren Abscheulichkeiten
  rationale: Die kollektive Einzahl von נֶפֶשׁ und dem Verb bleibt sichtbar. „Abscheulichkeiten“ bewahrt den prophetisch-kultischen Gehalt von שִׁקּוּצִים.
theological_decisions:
- issue: Verhältnis zwischen den ordnungsgemäßen Opfern und den verwerflichen Handlungen
  choice: Die Satzglieder werden als Vergleiche mit „ist wie“ beziehungsweise elliptischem „wie“ wiedergegeben.
  alternative: Die Glieder könnten als unmittelbare Gleichsetzungen ohne Vergleichswort formuliert werden.
  rationale: Das Hebräische enthält keine ausdrückliche Vergleichspartikel, stellt die Handlungen aber in schockierender Entsprechung nebeneinander. Die deutsche Vergleichsform vermittelt diese Wertung, ohne genauer festzulegen, auf welche Weise Gott die Opfer verwirft.
- issue: Bedeutung von אָוֶן
  choice: Frevel
  alternative: Unheil, Bosheit oder Götze
  rationale: Der Kontext erlaubt eine kultisch-idolatröse Färbung, zwingt aber nicht zur konkreten Bedeutung „Götze“. „Frevel“ erhält die absichtliche Bedeutungsweite und die religiös-moralische Verurteilung.
- issue: Kollektive Formulierung נַפְשָׁם חָפֵצָה
  choice: ihre Seele hat Gefallen
  alternative: sie haben Gefallen
  rationale: Die auffällige kollektive Einzahl wird bewahrt, damit die Menschen als Gruppe und zugleich in ihrem inneren Begehren angesprochen bleiben.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltener prophetischer Härte. Die wiederholten „wer … wie einer“-Fügungen bilden den hebräischen Parallelismus nach. Kultische Fachwörter wie „Speisopfer“ und „Gedenkopfer“ bleiben verständlich und präzise; „Abscheulichkeiten“ erhält den gehobenen prophetischen Ton.
