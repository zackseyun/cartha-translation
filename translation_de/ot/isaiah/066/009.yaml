  to: Sollte ich bis zur Geburt führen und dann nicht gebären lassen? – spricht Jahwe.[a] Oder sollte ich, der gebären lässt, den Mutterschoß verschließen? – spricht dein Gott.[c][b]
  rationale: 'Die erste Geburtsmetapher wurde idiomatischer formuliert. Alle übrigen Elemente bleiben erhalten: die rhetorische Parallelität, der kausative Sinn von ילד, die kontextuell gedeckte Explizierung des Mutterschoßes sowie die Fußnoten zur alternativen Lesart und zur femininen Anrede.'
