  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: de
  text: Sollte ich bis zur Geburt führen und dann nicht gebären lassen? – spricht Jahwe.[a] Oder sollte ich, der gebären lässt, den Mutterschoß verschließen? – spricht dein Gott.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »bis zum Durchbruch bringen«; das Hebräische gebraucht ein Bild für den entscheidenden Augenblick der Entbindung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zurückhalten« oder »verschließen«; der Mutterschoß ist im hebräischen Geburtsbild mitgemeint.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort für »dein« steht in der weiblichen Einzahl; angesprochen ist Zion beziehungsweise Jerusalem als Frau.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: bis zum Zeitpunkt der Geburt bringen
  rationale: Der Hifil von שׁבר bezeichnet hier im Bild einer Entbindung das Heranführen bis zum kritischen Augenblick der Geburt. Die Wiedergabe wahrt das Bild, ohne ein wörtliches »zerbrechen« nahezulegen.
- source_word: אוֹלִיד / הַמּוֹלִיד
  choice: gebären lassen / der gebären lässt
  rationale: Die Hifil-Formen von ילד sind kausativ. »Gebären lassen« gibt diese Bedeutung im Deutschen klar und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִם
  choice: Oder sollte ich
  rationale: אִם leitet hier im poetischen Parallelismus die zweite rhetorische Frage ein; »oder« macht die Beziehung der beiden Fragen im Deutschen verständlich.
- source_word: וְעָצַרְתִּי
  choice: den Mutterschoß verschließen
  rationale: עצר bedeutet »zurückhalten, verschließen«. Der im Geburtsbild vorausgesetzte Gegenstand wird zur natürlichen Verständlichkeit ausdrücklich genannt.
- source_word: אֱלֹהָיִךְ
  choice: dein Gott
  rationale: Die direkte Anrede wird bewahrt. Das Hebräische kennzeichnet die angesprochene Person zusätzlich als weiblichen Singular, was im Deutschen an dieser Form nicht sichtbar ist.
theological_decisions:
- issue: Gottes Handeln im Bild einer Geburt
  choice: Das Geburtsbild und die beiden rhetorischen Fragen bleiben erhalten.
  alternative: 'Dynamisch paraphrasieren: »Sollte ich etwas beginnen und es nicht vollenden?«'
  rationale: Der Text versichert Zion, dass Gott den von ihm eingeleiteten Geburtsvorgang nicht vor seiner Vollendung abbrechen wird. Eine abstrakte Paraphrase würde das konkrete und theologisch spannungsreiche Bild einebnen.
- issue: Das unausgesprochene Objekt von וְעָצַרְתִּי
  choice: »den Mutterschoß verschließen«
  alternative: Nur »zurückhalten« oder »verschließen« ohne Objekt
  rationale: Die Ergänzung ist unmittelbar durch den Geburtskontext gesteuert und macht die Aussage im Deutschen verständlich, ohne eine zusätzliche Lehrbehauptung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Der Gedankenstrich vor »spricht« markiert die prophetische Redeform; »Jahwe« gibt den Gottesnamen wieder. Die Formulierung bleibt bildhaft, ist aber für heutige Leser unmittelbar verständlich.
