  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: de
  text: 'Dies alles hat meine Hand gemacht, und so ist dies alles entstanden – Spruch Jahwes. Doch auf diesen Menschen blicke ich: auf den, der arm und im Geist gebrochen ist[a] und vor meinem Wort zittert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bedrängt und zerschlagenen Geistes“.'
    reason: Lexikalische Alternative für עָנִי וּנְכֵה רוּחַ; die hebräischen Ausdrücke können neben Armut auch Bedrängnis und einen zerschlagenen inneren Zustand bezeichnen.
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: meine Hand hat gemacht
  rationale: Die anthropomorphe Redeweise des Hebräischen bleibt erhalten; das Perfekt bezeichnet die vollendete Schöpfungstat.
- source_word: כָּל אֵלֶּה
  choice: dies alles
  rationale: Die knappe deutsche Wendung bezieht sich natürlich auf Himmel und Erde aus dem vorhergehenden Vers, ohne ein Substantiv ergänzen zu müssen.
- source_word: וַיִּהְיוּ כָל אֵלֶּה
  choice: und so ist dies alles entstanden
  rationale: היה bezeichnet hier das Ins-Dasein-Kommen als Folge von Gottes Schaffen. „So“ verdeutlicht den im Zusammenhang liegenden Folgesinn.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: „Spruch“ gibt die feierliche prophetische Formel prägnant wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְאֶל זֶה אַבִּיט
  choice: Doch auf diesen Menschen blicke ich
  rationale: „Doch“ bewahrt den Kontrast; „blicke ich“ erhält das hebräische Bild. „Menschen“ wird zur natürlichen Verdeutlichung des substantivisch gebrauchten Demonstrativums ergänzt.
- source_word: עָנִי
  choice: arm
  rationale: „Arm“ bewahrt den naheliegenden lexikalischen Sinn und lässt zugleich die möglichen Nuancen von Bedrängnis und Demut offen.
- source_word: נְכֵה רוּחַ
  choice: im Geist gebrochen
  rationale: Die Formulierung gibt den Zustand eines verwundeten oder zerschlagenen Geistes in verständlichem, gegenwärtigem Deutsch wieder.
- source_word: חָרֵד עַל דְּבָרִי
  choice: vor meinem Wort zittert
  rationale: Die Wendung bewahrt das starke Bild ehrfürchtiger Furcht und entspricht dem Singular „mein Wort“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottes Bundesname wiedergegeben; „Jahwe“ ist die im Deutschen etablierte Form.
- issue: Art des göttlichen Blicks in וְאֶל זֶה אַבִּיט
  choice: auf diesen Menschen blicke ich
  alternative: diesem Menschen wende ich mich zu
  rationale: Die wörtlichere Bildsprache lässt offen, ob der Blick vor allem Beachtung, Wohlwollen oder Zuwendung bezeichnet, statt dies ausdrücklich festzulegen.
- issue: Bedeutung von עָנִי וּנְכֵה רוּחַ
  choice: arm und im Geist gebrochen
  alternative: bedrängt und zerschlagenen Geistes
  rationale: Der Haupttext hält materielle Armut und innere Gebrochenheit zusammen; die Fußnote wahrt die mögliche Nuance äußerer Bedrängnis und die stärkere Bildlichkeit von נכה.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am prophetischen Parallelismus, wird aber durch „diesen Menschen“ und eine natürliche deutsche Reihung verständlich gehalten.
