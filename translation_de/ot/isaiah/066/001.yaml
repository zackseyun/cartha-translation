source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/שָּׁמַ֣יִם כִּסְאִ֔/י וְ/הָ/אָ֖רֶץ הֲדֹ֣ם רַגְלָ֑/י אֵי זֶ֥ה בַ֨יִת֙ אֲשֶׁ֣ר תִּבְנוּ לִ֔/י וְ/אֵי זֶ֥ה מָק֖וֹם מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: de
  text: 'So spricht Jahwe: Der Himmel ist mein Thron, und die Erde ist der Schemel meiner Füße. Wo ist das Haus, das ihr mir bauen wollt[a], und wo ist der Ort meiner Ruhe?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ spielt wahrscheinlich auf den Tempel an; im Hebräischen steht jedoch das allgemeine Wort für „Haus“.
    reason: Kultureller Hinweis; der Haupttext bewahrt den allgemeinen Wortlaut.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird würdevoll und im Deutschen geläufig wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: Der morphologische Plural bezeichnet hier im Gegensatz zur Erde den himmlischen Bereich; der deutsche Singular ist in diesem Bild natürlich.
- source_word: כִּסְאִי
  choice: mein Thron
  rationale: Direkte Wiedergabe des königlichen Bildes.
- source_word: הֲדֹם רַגְלָי
  choice: der Schemel meiner Füße
  rationale: Bewahrt die konkrete hebräische Wendung und klingt zugleich würdevoll und verständlich.
- source_word: אֵי זֶה
  choice: was für ein
  rationale: Im Zusammenhang fragt die Wendung rhetorisch nach der Art beziehungsweise Angemessenheit eines Hauses und Ortes, nicht bloß nach deren Lage.
- source_word: בַיִת
  choice: Haus
  rationale: Entspricht dem hebräischen Wortlaut; der Tempel ist angedeutet, aber nicht ausdrücklich genannt.
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: könntet ihr mir bauen
  rationale: 'Der Konjunktiv gibt die rhetorische Herausforderung natürlich wieder: Kein von Menschen errichtetes Haus kann Gott angemessen fassen.'
- source_word: מָקוֹם מְנוּחָתִי
  choice: Ort könnte meine Ruhestätte sein
  rationale: Bewahrt sowohl den Ortsbegriff als auch das Substantiv der Ruhe und stellt die Parallelität zur ersten Frage verständlich dar.
theological_decisions:
- issue: Ob בַיִת ausdrücklich als „Tempel“ wiederzugeben ist
  choice: Haus
  alternative: Tempel
  rationale: Der Tempel ist im Kontext wahrscheinlich gemeint, doch der hebräische Text sagt allgemein „Haus“. Diese Wiedergabe erhält sowohl die Anspielung als auch die umfassendere Aussage, dass kein menschlicher Bau Gott angemessen beherbergen kann.
- issue: Wie die rhetorische Kraft von אֵי זֶה auszudrücken ist
  choice: Was für ein … könntet ihr / könnte … sein?
  alternative: Wo ist das Haus … und wo ist der Ort …?
  rationale: Die gewählte Form macht die Frage nach der Angemessenheit deutlich, ohne die im Hebräischen offene rhetorische Spannung in eine ausdrückliche Lehrbehauptung umzuwandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Kadenz. Die rhetorischen Fragen werden natürlich formuliert, ohne die Bildsprache oder die Anspielung auf den Tempel ausdrücklich auszudeuten.
