source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: de
  text: 'Hört das Wort Yahwehs, ihr, die ihr vor seinem Wort zittert! Eure Brüder, die euch hassen und euch um meines Namens willen ausstoßen[a], sagen: »Yahweh möge verherrlicht werden, damit wir eure Freude sehen!«[b] Doch sie werden beschämt sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausschließen“ oder „verbannen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Ausspruch ist wahrscheinlich spöttisch gemeint. Möglich ist auch: „Yahweh werde geehrt, und lasst uns eure Freude sehen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ ist ein unmittelbarer prophetischer Aufruf zum aufmerksamen Hören.
- source_word: דְּבַר יְהוָה
  choice: das Wort Yahwehs
  rationale: Bewahrt die feste prophetische Wendung und gibt den Gottesnamen als Yahweh wieder.
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: ihr, die ihr vor seinem Wort zittert
  rationale: חרד bezeichnet ein Zittern, das hier ehrfürchtige, ernste Reaktion auf Gottes Wort ausdrückt; die körperlich starke Bildsprache bleibt erhalten.
- source_word: אֲחֵיכֶם
  choice: Eure Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt bestehen; im Zusammenhang sind wahrscheinlich Angehörige desselben Volkes gemeint.
- source_word: שֹׂנְאֵיכֶם
  choice: die euch hassen
  rationale: Das attributive Partizip wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: מְנַדֵּיכֶם
  choice: die euch … ausstoßen
  rationale: Das Verb bezeichnet Vertreibung oder Ausschluss; „ausstoßen“ lässt den sozialen beziehungsweise religiösen Charakter offen.
- source_word: לְמַעַן שְׁמִי
  choice: um meines Namens willen
  rationale: Die Wendung bewahrt das Gewicht des göttlichen Namens und kann sowohl den Anlass als auch den von den Gegnern behaupteten Grund bezeichnen.
- source_word: יִכְבַּד יְהוָה
  choice: Yahweh möge verherrlicht werden
  rationale: Die jussivische Verbform wird als Wunsch beziehungsweise Aufforderung wiedergegeben; die passive Form bewahrt den wahrscheinlich spöttischen, äußerlich frommen Klang.
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: damit wir eure Freude sehen
  rationale: נִרְאֶה wird seiner masoretischen Form entsprechend als erste Person Plural verstanden; בְשִׂמְחַתְכֶם wird idiomatisch auf das Sehen ihrer Freude bezogen.
- source_word: יֵבֹשׁוּ
  choice: sie werden beschämt werden
  rationale: Die Form kündigt die künftige Umkehrung an, in der die Gegner Schande erfahren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Ton und Sinn des Ausspruchs der feindseligen Brüder
  choice: Als wahrscheinlich spöttische Herausforderung in direkter Rede
  alternative: Als äußerlich frommer, nicht ausdrücklich spöttischer Wunsch
  rationale: Hass, Ausstoßung und die abschließende Ankündigung ihrer Beschämung legen Spott nahe; die Fußnote kennzeichnet dies jedoch als wahrscheinliche Deutung und erhält die weniger sarkastische Lesart.
- issue: Subjekt von וְנִרְאֶה
  choice: '„wir“: damit wir eure Freude sehen'
  alternative: Eine Deutung im Sinn eines göttlichen Erscheinens
  rationale: Die masoretische Form spricht am unmittelbarsten für die erste Person Plural. Eine auf Gottes Erscheinen bezogene Deutung ist grammatisch weniger naheliegend und wird nicht in den Haupttext aufgenommen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischer Direktheit. „Zittern“, „Brüder“ und „Wort“ bewahren die markanten Bilder und Leitbegriffe des Hebräischen; ungebräuchliche Archaismen werden vermieden.
