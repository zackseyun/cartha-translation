source:
  edition: WLC
  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: de
  text: 'Und sie werden alle eure Brüder[c] aus allen Nationen als Opfergabe für Jahwe herbeibringen: auf Pferden, in Wagen, in Sänften[a], auf Maultieren und auf Dromedaren[b], zu meinem heiligen Berg, Jerusalem, spricht Jahwe, so wie die Söhne Israels die Opfergabe in einem reinen Gefäß zum Haus Jahwes bringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in überdachten Wagen“. Das hebräische Wort bezeichnet ein nicht sicher bestimmbares Transportmittel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf schnellen Kamelen“. Die genaue Bedeutung des seltenen hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: „Brüder“ kann hier im weiteren Sinn Verwandte oder Angehörige des eigenen Volkes bezeichnen, nicht nur männliche Geschwister.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיאוּ
  choice: Und sie werden … herbeibringen
  rationale: Die Hifil-Form bezeichnet im prophetischen Zusammenhang ein zukünftiges Herbeibringen; die trennbare Formulierung ist im Deutschen natürlich.
- source_word: כָּל אֲחֵיכֶם
  choice: alle eure Brüder
  rationale: Die konkrete Verwandtschaftsbezeichnung bleibt erhalten; ihr möglicher weiterer Sinn als Verwandte oder Angehörige wird in einer Fußnote kenntlich gemacht.
- source_word: מִכָּל הַגּוֹיִם
  choice: aus allen Nationen
  rationale: Die Formulierung gibt sowohl die Herkunft als auch die Zerstreuung unter den Völkern knapp und idiomatisch wieder.
- source_word: מִנְחָה
  choice: Opfergabe
  rationale: Das Wort kann Gabe, Tribut oder kultische Opfergabe bedeuten. Der Vergleich mit dem Tempeldienst legt hier den kultischen Klang nahe, ohne die Bedeutung auf ein Speiseopfer zu verengen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Bestimmung der Opfergabe. Der Gottesname wird als Jahwe wiedergegeben.
- source_word: בַּסּוּסִים וּבָרֶכֶב
  choice: auf Pferden, in Wagen
  rationale: Die unterschiedlichen deutschen Präpositionen entsprechen dem natürlichen Sprachgebrauch für Reittiere und Fahrzeuge.
- source_word: וּבַצַּבִּים
  choice: in Sänften
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein Transportmittel für Menschen; wegen der Unsicherheit wird eine Alternative in der Fußnote genannt.
- source_word: וּבַפְּרָדִים
  choice: auf Maultieren
  rationale: פֶּרֶד bezeichnet eindeutig das Maultier.
- source_word: וּבַכִּרְכָּרוֹת
  choice: auf Dromedaren
  rationale: Das schwierige Wort wird traditionell als Bezeichnung schneller Kamele verstanden. Die lexikalische Unsicherheit bleibt durch eine Fußnote sichtbar.
- source_word: עַל הַר קָדְשִׁי יְרוּשָׁלִַם
  choice: zu meinem heiligen Berg, nach Jerusalem
  rationale: Die Wiedergabe macht Jerusalem als nähere Bestimmung des heiligen Berges deutlich und bewahrt zugleich die Zielrichtung.
- source_word: כַּאֲשֶׁר יָבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: so wie die Söhne Israels … bringen
  rationale: Das Präsens gibt den vergleichend beschriebenen, üblichen kultischen Vorgang wieder; die traditionelle Abstammungsbezeichnung bleibt erhalten.
- source_word: בִּכְלִי טָהוֹר
  choice: in einem reinen Gefäß
  rationale: „Rein“ bewahrt sowohl den konkreten als auch den kultischen Sinn von טָהוֹר.
theological_decisions:
- issue: Bezug von „eure Brüder“
  choice: Die Formulierung bezeichnet zunächst die aus den Nationen heimgebrachten Angehörigen Israels, ohne einen möglichen weiteren heilsgeschichtlichen Klang auszuschließen.
  alternative: Die Opfergabe selbst könnte ausschließlich als Bild für bekehrte Menschen aus den Nationen verstanden werden.
  rationale: Der unmittelbare Wortlaut spricht von „euren Brüdern“ und vergleicht ihr Herbeibringen mit der Opfergabe der Söhne Israels. Die Übersetzung legt eine weitergehende Identifikation nicht fest.
- issue: Menschen als Opfergabe
  choice: Die Heimgebrachten werden ausdrücklich „als Opfergabe für Jahwe“ bezeichnet.
  alternative: Man könnte die Wendung abschwächend als bloßes Geschenk oder Tribut wiedergeben.
  rationale: Der anschließende Vergleich mit der zum Haus Jahwes gebrachten Opfergabe stützt die kultische Bildsprache; „Opfergabe“ bewahrt diese Spannung, ohne ein tatsächliches Menschenopfer zu behaupten.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Die Namensform gibt das Tetragramm als Eigennamen wieder und vermeidet, dass der im Hebräischen ausdrücklich stehende Name zu einem Titel wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; die zweite Aussage nimmt das Objekt mit „sie“ wieder auf. Die Transportliste bleibt konkret und rhythmisch, während seltene Begriffe nicht ohne Hinweis überpräzisiert werden.
