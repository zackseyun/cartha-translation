  source_fidelity: 'Die Grundelemente sind korrekt wiedergegeben: כִּי הִנֵּה als aufmerksamkeitslenkende Begründung, der Gottesname, Feuer, Wirbelsturm, Streitwagen sowie Zorn und Verweis. Die vorhandene Formulierung „seinen Zorn im Grimm zurückzuzahlen“ ist jedoch im Deutschen semantisch verfehlt: Zorn ist nicht das Objekt einer Rückzahlung. לְהָשִׁיב bezeichnet hier die Vollstreckung bzw. das Zurückwenden des Zorns im Gericht. Auch die nominale Vergleichsfügung bei den Streitwagen braucht im Deutschen ein dynamisches Verb.'
