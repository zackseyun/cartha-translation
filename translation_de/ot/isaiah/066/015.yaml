  text: כִּֽי הִנֵּ֤ה יְהוָה֙ בָּ/אֵ֣שׁ יָב֔וֹא וְ/כַ/סּוּפָ֖ה מַרְכְּבֹתָ֑י/ו לְ/הָשִׁ֤יב בְּ/חֵמָה֙ אַפּ֔/וֹ וְ/גַעֲרָת֖/וֹ בְּ/לַהֲבֵי אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: de
  text: 'Denn seht: Jahwe kommt im Feuer[a], und seine Streitwagen kommen wie ein Wirbelsturm[b], um seinen Zorn im Grimm zu vollstrecken und seinen Verweis mit Feuerflammen zu vollstrecken[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Feuer“; die hebräische Präposition kann sowohl den Bereich als auch Begleitung oder Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Sturm“ oder „wie ein Unwetter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „seinen Zorn im Grimm zurückzuwenden und seinen Verweis in Feuerflammen“. Das hebräische Verb kann „zurückbringen“, „zurückwenden“ und im Gerichtszusammenhang „vergelten“ oder „vollstrecken“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn seht
  rationale: כִּי begründet die vorausgehende Aussage; הִנֵּה fordert anschaulich zur Aufmerksamkeit auf. „Denn seht“ ist gegenwärtig, würdig und nicht altertümlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Bewahrt die räumlich-modale Offenheit der Präposition ב; „mit Feuer“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: יָבוֹא
  choice: kommt
  rationale: Das deutsche Präsens eignet sich für die lebendige prophetische Ankündigung und kann eine unmittelbar bevorstehende Zukunft ausdrücken.
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: und wie der Wirbelsturm sind seine Streitwagen
  rationale: Die ergänzte Kopula macht den nominalen Vergleich im Deutschen verständlich; „Wirbelsturm“ erhält das heftige, bewegte Bild von סוּפָה.
- source_word: לְהָשִׁיב
  choice: um ... zurückzuzahlen
  rationale: Der Hifil von שׁוב bezeichnet hier das Zurückbringen beziehungsweise Vergelten. „Zurückzahlen“ hält die ungewöhnliche Verbindung mit dem Zorn sichtbar, ohne sie in ein allgemeines „vollstrecken“ aufzulösen.
- source_word: בְּחֵמָה אַפּוֹ
  choice: seinen Zorn im Grimm
  rationale: חֵמָה bezeichnet heftigen, glühenden Grimm; אַף ist idiomatisch Zorn. Die Reihenfolge und Präpositionalfügung des Hebräischen bleiben erkennbar.
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי אֵשׁ
  choice: und sein Schelten in Feuerflammen
  rationale: „Schelten“ bewahrt den Vorgang und die autoritative Schärfe von גְּעָרָה; „Feuerflammen“ gibt die emphatische Bildfügung לַהֲבֵי אֵשׁ eng wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Umschrift bewahrt diesen, ohne ihn durch einen konfessionell geprägten Ersatztitel zu verdecken.
- issue: Verhältnis von Zorn und Vergeltung in לְהָשִׁיב בְּחֵמָה אַפּוֹ
  choice: „seinen Zorn im Grimm zurückzuzahlen“
  alternative: „seinen Zorn im Grimm zu vollstrecken“
  rationale: Die gewählte Fassung wahrt die auffällige, spannungsreiche hebräische Formulierung. Die Alternative wäre glatter, würde aber die Bedeutung von שׁוב stärker auslegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischer Bildkraft. „Seht“ vermeidet das altertümliche „siehe“. Die Wortstellung hält den Vergleich der Streitwagen mit dem Wirbelsturm klar; die bewusst ungeglättete Wendung „Zorn ... zurückzuzahlen“ bewahrt die Spannung des Ausgangstextes.
