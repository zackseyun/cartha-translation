  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. „Streitwagen“ ist für מַרְכְּבוֹת passend. Für גְּעָרָה ist „Verweis“ als substantivische, autoritative Zurechtweisung treffender als das prozesshafte „Schelten“. „Grimm“ kann חֵמָה wiedergeben; „Zorn“ für אַף bleibt sinnvoll.
