  to: Wie ein Mann, den seine Mutter tröstet,[a] so werde ich euch trösten; und in Jerusalem werdet ihr getröstet werden.
  rationale: Die einzige notwendige Änderung ist die grammatisch erforderliche Korrektur von „einen Mann“ zu „ein Mann“. Der hebräische Vergleich und die im englischen Prüfvermerk hervorgehobene maskuline Form von אִישׁ bleiben damit im Haupttext erhalten; Bedeutung, Register, Wiederholung von „trösten“ und das unbestimmte Passiv am Versende werden nicht verändert.
