source:
  edition: WLC
  text: כְּ/אִ֕ישׁ אֲשֶׁ֥ר אִמּ֖/וֹ תְּנַחֲמֶ֑/נּוּ כֵּ֤ן אָֽנֹכִי֙ אֲנַ֣חֶמְ/כֶ֔ם וּ/בִ/ירֽוּשָׁלִַ֖ם תְּנֻחָֽמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: de
  text: Wie ein Mann, den seine Mutter tröstet,[a] so werde ich euch trösten; und in Jerusalem werdet ihr getröstet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie jemanden, den seine Mutter tröstet«. Im Hebräischen steht ausdrücklich »Mann« (אִישׁ) in repräsentativer Verwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאִישׁ
  choice: Wie einen Mann
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann und steht hier als Akkusativobjekt des folgenden Verbs in einem Vergleich. Die Wiedergabe bewahrt die männliche Einzahl und den repräsentativen Charakter des Bildes.
- source_word: אֲשֶׁר אִמּוֹ תְּנַחֲמֶנּוּ
  choice: den seine Mutter tröstet
  rationale: Der Relativsatz gibt die Objektbeziehung natürlich wieder; אִמּוֹ ist »seine Mutter«, und das Piel von נחם bezeichnet aktives Trösten.
- source_word: כֵּן אָנֹכִי אֲנַחֶמְכֶם
  choice: so werde ich euch trösten
  rationale: כֵּן führt den zweiten Teil des Vergleichs ein. Das selbstständige Pronomen אָנֹכִי setzt Gott als tröstendes Gegenüber hervor; die natürliche deutsche Wortstellung vermittelt dies ohne das schwerere »ich selbst«.
- source_word: וּבִירוּשָׁלִַם
  choice: und in Jerusalem
  rationale: Die Präposition ב bezeichnet hier den Ort bzw. Raum, in dem der verheißene Trost erfahren wird.
- source_word: תְּנֻחָמוּ
  choice: werdet ihr getröstet werden
  rationale: Die passive Verbform und die dreifache Wiederholung der Wurzel נחם werden bewahrt. Die Formulierung ist bewusst passiv und legt den Handelnden nicht über den Wortlaut hinaus fest.
theological_decisions:
- issue: Männliche repräsentative Sprache im Vergleich
  choice: »einen Mann, den seine Mutter tröstet« im Haupttext
  alternative: »jemanden, den seine Mutter tröstet«
  rationale: Der hebräische Text verwendet ausdrücklich אִישׁ in der männlichen Einzahl. Die Hauptfassung bildet diese Form ab; die Fußnote nennt eine im Deutschen idiomatische generische Wiedergabe, ohne die Quellform zu verschweigen.
- issue: Verhältnis von Gottes Trost und dem Trost in Jerusalem
  choice: Die passive Schlussaussage bleibt ohne ergänzte Agensangabe stehen
  alternative: »dort werde ich euch trösten«
  rationale: Der Parallelismus verbindet beide Aussagen eng, doch das abschließende Passiv nennt den Handelnden nicht ausdrücklich. Diese Offenheit wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »trösten« bildet die dreifache Verwendung derselben hebräischen Wurzel ab; das etwas volle Passiv »werdet ihr getröstet werden« wurde deshalb gegenüber freieren Formulierungen beibehalten.
