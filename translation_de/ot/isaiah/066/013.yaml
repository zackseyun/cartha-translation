review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Vergleich, die possessive Beziehung „seine Mutter“, die dreifache Wiederaufnahme von נחם („trösten“) sowie das abschließende Passiv zutreffend wieder. Die Offenheit der Schlussaussage hinsichtlich eines ausdrücklich genannten Handelnden bleibt gewahrt. Allerdings verlangt die deutsche Vergleichskonstruktion hier den Nominativ: „Wie ein Mann“, nicht „Wie einen Mann“.'
  naturalness: „Wie einen Mann“ ist im Deutschen in dieser Konstruktion grammatisch nicht möglich. Mit „Wie ein Mann, den seine Mutter tröstet, so werde ich euch trösten“ ist der Satz korrekt, würdig und verständlich. Das Schlussstück „in Jerusalem werdet ihr getröstet werden“ ist bewusst etwas förmlich, aber für die Passivform und die Wurzelwiederholung angemessen.
  terminology: „Mann“ entspricht אִישׁ und bewahrt die maskuline Singularform des hebräischen Vergleichs. Die Fußnote bietet mit „jemanden“ eine idiomatische, nicht-haupttextliche Alternative und erklärt die Quellform sachlich. „Trösten“ bildet die wiederholte hebräische Wurzel konsequent ab.
