base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Siehe, ich lasse ihr Frieden zufließen wie einen Strom und die Herrlichkeit der Völker[a] wie einen über die Ufer tretenden Bach. Ihr werdet saugen, auf der Hüfte getragen werden und auf den Knien liebkost werden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Reichtum“ beziehungsweise „die Fülle der Völker“. Das hebräische Wort für „Herrlichkeit“ kann auch ihre Pracht und ihren Wohlstand einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den Knien geschaukelt werden“. Das hebräische Verb beschreibt liebevolle, spielerische Zuwendung zu einem Kind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Bewahrt den hinweisenden und nachdrücklichen Charakter der hebräischen Wendung in würdigem prophetischem Sprachgebrauch.
- source_word: נֹטֶה אֵלֶיהָ
  choice: ich lasse ihr … zufließen
  rationale: Gibt die auf die weiblich bezeichnete Stadt gerichtete göttliche Handlung natürlich wieder und verbindet sie mit dem unmittelbar folgenden Flussbild.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Ist die etablierte Wiedergabe und lässt zugleich den weiteren Sinn von Wohlergehen und Heil mitschwingen.
- source_word: כְּנָהָר
  choice: wie einen Strom
  rationale: Bewahrt das Bild eines stetigen, reichen Zuflusses.
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: wie einen über die Ufer tretenden Bach
  rationale: נחל bezeichnet einen Bach beziehungsweise ein Wadi; שׁוטף beschreibt dessen machtvoll überströmende oder flutende Bewegung.
- source_word: כְּבוֹד גּוֹיִם
  choice: die Herrlichkeit der Völker
  rationale: Die direkte Wiedergabe bewahrt die Bedeutungsbreite von כָּבוֹד zwischen Pracht, Ansehen und materiellem Reichtum.
- source_word: וִינַקְתֶּם
  choice: ihr werdet saugen
  rationale: Bewahrt die aktive Verbform und das ausdrücklich mütterliche Bild des hebräischen Textes.
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: auf der Hüfte getragen
  rationale: Im Bild der Fürsorge für ein Kind bezeichnet צַד die Seite beziehungsweise Hüfte; die passive Form von נשׂא wird beibehalten.
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: auf den Knien liebevoll gewiegt werden
  rationale: Gibt die liebevolle, spielerische Zuwendung zu einem kleinen Kind in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezug des weiblichen Suffixes אֵלֶיהָ
  choice: als „ihr“ beibehalten
  alternative: ausdrücklich „Jerusalem“ oder „Zion“ einsetzen
  rationale: Der unmittelbare Zusammenhang weist auf die mütterlich dargestellte Stadt, doch der Vers selbst nennt sie nicht erneut. Das Pronomen wahrt den Textzusammenhang, ohne den Bezug im Vers auslegend zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Die mütterliche Metaphorik wird nicht abgeschwächt; seltenere Formulierungen werden nur dort verwendet, wo sie die konkrete Bildwelt des Hebräischen erhalten.
