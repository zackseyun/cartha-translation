  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: de
  text: Schall von Getöse aus der Stadt,[a] Schall aus dem Tempel,[b] Schall Jahwes, der seinen Feinden Vergeltung heimzahlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wiederholt das Wort für „Schall“ dreimal; es kann auch „Stimme“ oder „Geräusch“ bedeuten. „Getöse“ kann auch mit „Tumult“ oder „Lärm“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Tempel“ kann in anderen Zusammenhängen auch „Palast“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Getöse / Schall
  rationale: קוֹל bezeichnet Stimme, Laut, Schall oder Geräusch. Beim ersten Vorkommen verschmilzt die Wiedergabe idiomatisch mit שָׁאוֹן zu „Getöse“; die beiden weiteren Vorkommen werden mit „Schall“ wiedergegeben. Die kurzen Ausrufe bewahren die eindringliche akustische Wirkung des dreifachen קוֹל.
- source_word: שָׁאוֹן
  choice: Getöse
  rationale: שָׁאוֹן bezeichnet lauten, erregten Lärm oder Tumult. „Getöse“ passt zum Gerichtskontext und bildet zusammen mit קוֹל eine natürliche deutsche Wendung.
- source_word: מֵעִיר
  choice: aus der Stadt
  rationale: מִן bezeichnet hier den Ausgangspunkt; der Schall kommt aus der Stadt, im Zusammenhang aus Jerusalem.
- source_word: מֵהֵיכָל
  choice: aus dem Tempel
  rationale: הֵיכָל kann „Palast“ oder „Tempel“ bedeuten. Im Zusammenhang von Zion, Stadt und göttlichem Gericht ist „Tempel“ die naheliegende Wiedergabe; die lexikalische Alternative bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְשַׁלֵּם גְּמוּל
  choice: vergilt …, was sie getan haben
  rationale: Die Verbindung aus dem Partizip von שׁלם und גְּמוּל bezeichnet die erwidernde Vergeltung. Die Formulierung ist im heutigen Deutsch natürlich, wahrt den aktiven Sinn und macht im Zusammenhang mit den Feinden die strafende Bedeutung deutlich, ohne ein zusätzliches technisches Abstraktum zu verwenden.
- source_word: לְאֹיְבָיו
  choice: seinen Feinden
  rationale: לְ kennzeichnet die Empfänger der Vergeltung; „seinen Feinden“ ist im Deutschen knapp und eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Vergeltung in גְּמוּל
  choice: vergilt seinen Feinden, was sie getan haben
  alternative: zahlt seinen Feinden Vergeltung heim
  rationale: גְּמוּל bezeichnet das, was als entsprechende Erwiderung zurückgegeben wird. Die gewählte Formulierung lässt das Prinzip der Vergeltung stehen, ohne über den Vers hinaus Einzelheiten über Maß oder Form des Gerichts festzulegen.
translation_notes:
  register: Kurze, ausrufartige Nominalsätze geben den alarmierenden prophetischen Klang wieder. Die Sprache ist modern und würdevoll; „Getöse“ und „Schall“ schaffen eine hörbare Szene, während die Fußnote die im Deutschen nicht vollständig nachbildbare dreifache Wortwiederholung offenlegt.
