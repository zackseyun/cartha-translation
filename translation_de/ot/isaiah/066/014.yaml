  to: Ihr werdet es sehen, und euer Herz wird sich freuen; eure Gebeine werden wie Gras aufblühen. Die Hand Jahwes wird seinen Dienern[a] erkennbar werden, und gegen seine Feinde wird er zürnen.
  rationale: Die Revision hält die hebräische Bildsprache und die schlichte Verknüpfung mit „und“ bei. Sie ersetzt die zu stark festlegende Formulierung „an seinen Dienern“ durch eine offenere, im Deutschen natürliche Wiedergabe, entfernt die nicht ausdrücklich im Grundtext enthaltene Nuance „frisch“ und verbessert die Verbindung von „Gebeine“ mit dem Wachstumsbild. Das ergänzte „es“ bei „Ihr werdet es sehen“ ist im Deutschen als Platzhalter für das im Kontext Gemeinte idiomatisch und fügt kein Sachobjekt hinzu.
