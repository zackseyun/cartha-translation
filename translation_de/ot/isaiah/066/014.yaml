  text: וּ/רְאִיתֶם֙ וְ/שָׂ֣שׂ לִבְּ/כֶ֔ם וְ/עַצְמוֹתֵי/כֶ֖ם כַּ/דֶּ֣שֶׁא תִפְרַ֑חְנָה וְ/נוֹדְעָ֤ה יַד יְהוָה֙ אֶת עֲבָדָ֔י/ו וְ/זָעַ֖ם אֶת אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: de
  text: Ihr werdet es sehen, und euer Herz wird sich freuen; eure Gebeine werden wie Gras aufblühen. Die Hand Jahwes wird seinen Dienern[a] erkennbar werden, und gegen seine Feinde wird er zürnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Hand Jahwes wird bei seinen Dienern bekannt werden.“ Die knappe hebräische Verbindung kann die Offenbarung seiner Macht gegenüber seinen Dienern oder ihr Sichtbarwerden in ihrem Zusammenhang bezeichnen.'
    reason: Mehrdeutige syntaktisch-lexikalische Beziehung von נוֹדְעָה zu אֶת עֲבָדָיו.
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Ihr werdet sehen
  rationale: Das Qal-Perfekt mit vorangestellter Konjunktion bezeichnet im prophetischen Zusammenhang natürlich ein zukünftiges Geschehen. Das im Hebräischen fehlende Objekt wird nicht ausdrücklich ergänzt.
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: und euer Herz wird sich freuen
  rationale: Die kollektive Einzahl „Herz“ bleibt erhalten; „sich freuen“ gibt die emotionale Aussage in klarem, heutigem Deutsch wieder.
- source_word: וְעַצְמוֹתֵיכֶם
  choice: eure Gebeine
  rationale: „Gebeine“ bewahrt das körperlich-konkrete Bild einer tiefgreifenden Erneuerung und passt zum gehobenen, aber verständlichen Bibelregister.
- source_word: כַּדֶּשֶׁא תִפְרַחְנָה
  choice: werden sprossen wie frisches Grün
  rationale: דֶּשֶׁא bezeichnet Gras beziehungsweise jungen grünen Pflanzenwuchs; פרח beschreibt das Hervorsprossen oder Aufblühen. Die Formulierung bewahrt das Wachstumsbild natürlich.
- source_word: וְנוֹדְעָה יַד יְהוָה
  choice: Die Hand Jahwes wird sich … zeigen
  rationale: 'Das Niphal von ידע hat hier manifestierenden Sinn: Jahwes wirksame Macht wird erkennbar. Das biblische Bild der „Hand“ bleibt erhalten.'
- source_word: אֶת עֲבָדָיו
  choice: an seinen Dienern
  rationale: אֶת bezeichnet hier die Bezugsrichtung der offenbar werdenden Hand. „An seinen Dienern“ lässt erkennen, dass Jahwes Wirken in ihrem Ergehen sichtbar wird, ohne die schwer festzulegende Relation zu stark auszudeuten.
- source_word: וְזָעַם אֶת אֹיְבָיו
  choice: und seinen Feinden wird er zürnen
  rationale: זעם bezeichnet Zorn oder Entrüstung. Die deutsche Konstruktion mit Dativ gibt die gegen die Feinde gerichtete Haltung idiomatisch wieder; „und“ entspricht der ausdrücklich gesetzten hebräischen Konjunktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Verhältnis zwischen Jahwes Hand und seinen Dienern
  choice: wird sich an seinen Dienern zeigen
  alternative: wird seinen Dienern bekannt werden / wird für seine Diener erkennbar werden
  rationale: Die hebräische Verbindung von נודע mit אֶת ist semantisch nicht völlig eindeutig. Die Hauptfassung bewahrt den Gedanken sichtbaren göttlichen Wirkens, ohne festzulegen, ob vor allem Offenbarung gegenüber den Dienern oder Handeln zu ihren Gunsten gemeint ist.
- issue: Verknüpfung des letzten Satzglieds
  choice: und
  alternative: doch / aber
  rationale: Zwischen dem Handeln an den Dienern und dem Zorn gegen die Feinde besteht sachlich ein Kontrast; die hebräische Konjunktion ist jedoch schlicht וְ. Deshalb bleibt die Hauptfassung bei „und“ und fügt keinen ausdrücklich adversativen Sinn hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebeine“ und das Bild von Jahwes „Hand“ erhalten die konkrete poetische Sprache; Satzbau und Verben bleiben zugleich für heutige Leser verständlich.
