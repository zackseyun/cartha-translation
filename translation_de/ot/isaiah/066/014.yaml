  - severity: low
    issue: „sprossen“ bei „Gebeine“
    rationale: Das Verb kann das Bild transportieren, wirkt mit „Gebeine“ jedoch weniger natürlich als „aufblühen“, das פרח direkt und poetisch angemessen wiedergibt.
