base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: de
  text: Auch ich werde für sie eine harte Behandlung wählen[a] und über sie bringen, was sie fürchten[b]. Denn ich rief, und niemand antwortete; ich redete, und sie hörten nicht. Sie taten, was in meinen Augen böse war, und wählten, woran ich kein Gefallen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hohn für sie«, »Verwirrungen für sie« oder »willkürliche Misshandlungen für sie«. Das hebräische Wort ist schwer zu deuten und kann eine harte oder höhnische Behandlung als Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »ihre Ängste« oder »ihre Schrecken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: So werde auch ich
  rationale: 'Gibt die nachdrückliche und vergeltende Entsprechung wieder: Wie sie wählten, so wählt nun auch Gott.'
- source_word: אֶבְחַר
  choice: werde ... wählen
  rationale: Bewahrt das Verb »wählen« und damit die beabsichtigte Entsprechung zu בָּחָרוּ am Versende.
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: eine harte Behandlung für sie
  rationale: Der schwierige Ausdruck kann mutwilliges, höhnisches oder hartes Vorgehen bezeichnen. Im Gerichtszusammenhang vermittelt diese Wiedergabe den strafenden Sinn, ohne die lexikalische Unsicherheit zu verdecken.
- source_word: וּמְגוּרֹתָם
  choice: was sie fürchten
  rationale: Der Ausdruck kann sowohl Furcht als auch deren Gegenstand bezeichnen; mit »über sie bringen« ist der Gegenstand ihrer Furcht im Deutschen am natürlichsten.
- source_word: אָבִיא לָהֶם
  choice: über sie bringen
  rationale: Gibt die im Gerichtskontext nachteilige Richtung der hebräischen Wendung idiomatisch wieder.
- source_word: יַעַן
  choice: Denn
  rationale: Leitet den Grund für das angekündigte Gericht klar und natürlich ein.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: ich rief, doch niemand antwortete
  rationale: Die Konstruktion mit אֵין und Partizip bezeichnet das Ausbleiben jeder Antwort.
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: ich redete, doch sie hörten nicht
  rationale: Bewahrt das konkrete Verb »hören«; im Kontext ist das schuldhafte Nicht-Hören beziehungsweise Nicht-Befolgen deutlich.
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Sie taten, was in meinen Augen böse war
  rationale: Erhält die hebräische Bildformel und bleibt zugleich in modernem Deutsch verständlich.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: und wählten, woran ich kein Gefallen hatte
  rationale: חפץ umfasst Wollen und Gefallenhaben; diese Formulierung wahrt die affektive Nuance und den Kontrast zwischen Gottes Gefallen und ihrer Wahl.
theological_decisions:
- issue: Art der göttlichen Antwort im Gericht
  choice: Gott wählt eine strafende Behandlung, die der vorausgehenden Wahl des Volkes entspricht.
  alternative: Gott wählt ihre eigenen Verirrungen oder mutwilligen Taten als Form der Preisgabe.
  rationale: Der unmittelbare Zusammenhang mit dem, was er über sie bringt und was sie fürchten, spricht für gerichtliche Vergeltung. Die schwierige Wortbedeutung wird jedoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »wählen« bildet die vergeltende Ironie des Hebräischen ab. Kurze Hauptsätze bewahren den eindringlichen prophetischen Rhythmus; die Unsicherheit des seltenen Ausdrucks תַעֲלֻלֵיהֶם wird nicht stillschweigend aufgelöst.
