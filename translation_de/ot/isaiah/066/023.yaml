language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: de
  text: 'Und es wird geschehen: Von Neumond zu Neumond und von Sabbat zu Sabbat[a] wird alles Fleisch[b] kommen, um sich vor mir niederzuwerfen, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Monat für Monat und Sabbat für Sabbat“.'
    reason: lexical_alternative
  - marker: b
    text: „Alles Fleisch“ ist eine hebräische Ausdrucksweise, die die gesamte Menschheit bezeichnen kann und zugleich den Gedanken geschöpflicher, leiblicher Existenz bewahrt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die prophetische Einleitungsformel bezeichnet einen künftigen Zustand; diese Wiedergabe bewahrt ihren feierlichen Klang in natürlichem modernem Deutsch.
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: von Neumond zu Neumond
  rationale: Die Wendung bezeichnet regelmäßige Wiederkehr. Im Parallelismus mit dem Sabbat ist חֹדֶשׁ am ehesten als kultischer Neumond zu verstehen. Die hebräischen Suffixe werden idiomatisch wiedergegeben, nicht mit dem im Deutschen unnatürlichen „zu seinem Neumond“.
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: und von Sabbat zu Sabbat
  rationale: Die parallele Wendung bezeichnet regelmäßig wiederkehrende Sabbatfeiern und bewahrt den kultisch-theologischen Begriff „Sabbat“.
- source_word: יָבוֹא
  choice: wird … kommen
  rationale: Das einfache Verb בוא bezeichnet hier die künftige Bewegung in Gottes Gegenwart.
- source_word: כָל בָּשָׂר
  choice: alles Fleisch
  rationale: Die hebräische Ausdrucksweise bleibt erhalten, weil sie hier die gesamte Menschheit bezeichnen kann und zugleich den Gedanken geschöpflicher, leiblicher Existenz trägt.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: um sich … niederzuwerfen
  rationale: Das Verb bezeichnet eine körperliche Niederwerfung als Ausdruck der Verehrung; die konkrete Handlung wird nicht zum allgemeineren „anbeten“ verflacht.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die knappe deutsche Wendung gibt die unmittelbare Gegenwart vor Gott natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen geläufige Wiedergabe des Gottesnamens und erhält ihn als Eigennamen.
theological_decisions:
- issue: Ist חֹדֶשׁ hier als „Monat“ oder als „Neumond“ zu verstehen?
  choice: Neumond
  alternative: Monat
  rationale: Die Verbindung mit dem Sabbat und der Kontext regelmäßig wiederkehrender Verehrung sprechen für den kultischen Neumond. Damit wird keine weitergehende Aussage über die Fortgeltung kalendarischer Ordnungen getroffen.
- issue: Bezeichnet כָל בָּשָׂר ausschließlich die Menschheit oder umfassender alle Lebewesen?
  choice: alles Fleisch
  alternative: alle Menschen
  rationale: Die quellensprachliche Wendung bewahrt die mögliche Bedeutungsweite. Im Zusammenhang ist die gesamte Menschheit der naheliegende Bezug, doch der Text wird nicht enger festgelegt als das Hebräische.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Der Doppelpunkt gliedert die Einleitungsformel klar. Die Wiederholungsformeln werden im Deutschen idiomatisch gefasst; „alles Fleisch“ bleibt als bewusst biblisch geprägte, durch eine Fußnote erläuterte Wendung erhalten.
