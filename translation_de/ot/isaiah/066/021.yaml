base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: de
  text: Und auch aus ihnen werde ich einige zu Priestern und zu Leviten[a] nehmen, spricht der HERR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „als Priester und als Leviten“. Das Hebräische kann hier die Bestimmung zu diesen Aufgaben ausdrücken. Auf wen sich „ihnen“ bezieht, bleibt im Vers selbst unausgesprochen und ergibt sich aus dem vorhergehenden Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Die Wendung führt den vorherigen Gedanken weiter und hebt zugleich die zusätzliche, überraschende Auswahl hervor. „Und auch“ bildet beides in natürlichem Deutsch ab.
- source_word: מֵהֶם
  choice: aus ihnen … einige
  rationale: מִן mit dem Pronomen bezeichnet die Auswahl aus einer Gruppe. Die im Hebräischen knappe partitive Bedeutung wird im Deutschen durch „einige“ natürlich ausgedrückt, ohne den im Kontext vorausgesetzten Bezug von „ihnen“ festzulegen.
- source_word: אֶקַּח
  choice: werde ich … nehmen
  rationale: לקח bedeutet wörtlich „nehmen“ und bezeichnet hier die Auswahl beziehungsweise Bestimmung von Personen. „Nehmen“ bewahrt das hebräische Bild.
- source_word: לַכֹּהֲנִים
  choice: zu Priestern
  rationale: Das ל kann hier die Bestimmung zu einer Aufgabe oder Stellung ausdrücken. „Zu Priestern nehmen“ ist im Deutschen idiomatisch und erhält den Ernennungscharakter.
- source_word: לַלְוִיִּם
  choice: zu Leviten
  rationale: Wie beim vorangehenden Ausdruck bezeichnet ל die Bestimmung. „Leviten“ ist die etablierte deutsche Bezeichnung.
- source_word: אָמַר יְהוָה
  choice: spricht der HERR
  rationale: Das Perfekt אָמַר dient in der prophetischen Formel performativ. „Spricht der HERR“ ist die traditionelle, würdige und im modernen Bibeldeutsch verständliche Wiedergabe; der Gottesname wird als „der HERR“ wiedergegeben.
theological_decisions:
- issue: Bezug von „ihnen“ und Umfang der Aufnahme unter Priester und Leviten
  choice: Der Bezug des Pronomens bleibt unausgesprochen; die Aussage wird als tatsächliche Bestimmung „zu Priestern und zu Leviten“ wiedergegeben.
  alternative: „Ihnen“ könnte enger auf zurückkehrende Israeliten unter den Völkern bezogen werden; die Amtsbezeichnungen könnten weniger unmittelbar oder bildlich verstanden werden.
  rationale: Der hebräische Vers nennt den Bezug nicht erneut. Daher wird keine bestimmte Gruppe ausdrücklich eingesetzt. Ebenso bleibt die auffällige theologische Spannung der Berufung zu Priestern und Leviten erhalten, statt sie erklärend abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch, bewahrt aber die knappe prophetische Formulierung und die Mehrdeutigkeit des unausgesprochenen Bezugs.
