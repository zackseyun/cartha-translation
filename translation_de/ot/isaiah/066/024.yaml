base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: de
  text: Und sie werden hinausgehen und die Leichen der Männer ansehen, die sich gegen mich aufgelehnt haben. Denn ihr Wurm[a] wird nicht sterben und ihr Feuer nicht erlöschen; und sie werden zum Abscheu[b] für alle Menschen[c] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Made“; das hebräische Wort kann einen Wurm, eine Larve oder eine Made bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Gegenstand des Entsetzens“ oder „etwas Abscheuliches“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „für alles Fleisch“; gemeint sind alle Menschen beziehungsweise die ganze Menschheit.'
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Und sie werden hinausgehen
  rationale: Das Qal-Verb setzt im Kontext die prophetische Zukunftsfolge fort; „hinausgehen“ bewahrt die räumliche Bewegung.
- source_word: וְרָאוּ בְּפִגְרֵי
  choice: und die Leichen … ansehen
  rationale: ראה mit ב bezeichnet hier ein bewusstes Hinsehen; פגר meint einen Leichnam oder Kadaver. „Leichen ansehen“ ist natürlich, würdevoll und zugleich deutlich.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Das konkrete maskuline Pluralwort אֲנָשִׁים wird geschlechtsgenau mit „Männer“ wiedergegeben.
- source_word: הַפֹּשְׁעִים בִּי
  choice: die sich gegen mich aufgelehnt haben
  rationale: פשׁע bezeichnet schuldhafte Auflehnung oder Rebellion; die Formulierung gibt die aktive Widersetzlichkeit gegen Gott natürlich wieder.
- source_word: תוֹלַעְתָּם
  choice: ihr Wurm
  rationale: תולעת kann Wurm, Larve oder Made bezeichnen. „Wurm“ ist lexikalisch möglich und bewahrt die prägnante sowie intertextuell bedeutsame Bildsprache.
- source_word: וְאִשָּׁם לֹא תִכְבֶּה
  choice: und ihr Feuer nicht erlöschen
  rationale: כבה wird bei Feuer idiomatisch mit „erlöschen“ wiedergegeben; das deutsche Futur-Hilfsverb gilt koordiniert für beide Satzglieder.
- source_word: דֵרָאוֹן
  choice: ein Abscheu
  rationale: Das seltene Substantiv bezeichnet etwas Abstoßendes oder Verabscheutes. „ein Abscheu“ erhält die substantivische und starke Wirkung.
- source_word: לְכָל בָּשָׂר
  choice: für alle Menschen
  rationale: Wörtlich „für alles Fleisch“; in diesem anthropologischen Zusammenhang bezeichnet die hebräische Wendung die gesamte Menschheit.
theological_decisions:
- issue: Art der Gerichtsbildsprache
  choice: Die konkrete Darstellung von Leichen, nicht sterbendem Wurm und nicht erlöschendem Feuer bleibt stehen.
  alternative: Die Bilder entweder als rein symbolische Schande aufzulösen oder als vollständige Definition der Mechanik ewiger bewusster Strafe auszudeuten.
  rationale: Der Vers schildert sichtbar die Folgen göttlichen Gerichts, legt aber für sich allein keine umfassende Lehre über die genaue Art des endgültigen Strafzustands fest.
- issue: Wiedergabe von הָאֲנָשִׁים
  choice: der Männer
  alternative: der Menschen / der Leute
  rationale: Der hebräische Text nennt eine konkrete Gruppe mit einem maskulinen Pluralnomen; die Übersetzung neutralisiert dies nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer, eindringlicher Bildsprache. Die Satzstruktur bleibt dem Hebräischen nahe, ohne unnatürlich zu wirken; das Semikolon markiert den Übergang von den beiden dauerhaften Gerichtszeichen zur abschließenden Wirkung auf alle Menschen.
