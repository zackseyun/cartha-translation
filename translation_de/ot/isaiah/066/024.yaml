- from: Und sie werden hinausgehen und die Leichen der Männer ansehen, die sich gegen mich aufgelehnt haben. Denn ihr Wurm wird nicht sterben und ihr Feuer nicht erlöschen; und sie werden für alle Menschen[a] ein Abscheu[b] sein.
  to: Und sie werden hinausgehen und die Leichen der Männer ansehen, die sich gegen mich aufgelehnt haben. Denn ihr Wurm[a] wird nicht sterben und ihr Feuer nicht erlöschen; und sie werden zum Abscheu[b] für alle Menschen[c] sein.
  rationale: Die Änderung „zum Abscheu“ verbessert die deutsche Idiomatik, ohne die Bedeutung oder die Bildsprache zu verändern. Eine zusätzliche Fußnote bei „Wurm“ dokumentiert die im Hebräischen vorhandene lexikalische Bandbreite. Die Fußnotenanker wurden entsprechend eindeutig und fortlaufend gesetzt.
