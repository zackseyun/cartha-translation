  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. In der Schlusspointe ist jedoch „ein Abscheu sein“ weniger idiomatisch als die feste und zugleich quellennähere Wendung „zum Abscheu … sein“.
