  variant: modern standard German
source:
  edition: WLC
  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: de
  text: Wer hat so etwas gehört? Wer hat dergleichen gesehen? Kann ein Land an einem einzigen Tag zur Welt gebracht werden? Kann ein Volk auf einmal geboren werden? Denn Zion lag in Wehen und gebar auch ihre Kinder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: ihre Söhne.'
    reason: 'Lexikalische Alternative: בָּנֶיהָ ist formal maskuliner Plural, bezeichnet hier aber kollektiv Zions Nachkommenschaft.'
lexical_decisions:
- source_word: מִי שָׁמַע כָּזֹאת
  choice: Wer hat je so etwas gehört?
  rationale: „So etwas“ gibt den singularischen Demonstrativausdruck idiomatisch wieder; „je“ unterstreicht die rhetorische Frage, ohne ihren Sinn zu verändern.
- source_word: מִי רָאָה כָּאֵלֶּה
  choice: Wer hat je dergleichen gesehen?
  rationale: „Dergleichen“ bewahrt den pluralischen Bezug auf Ereignisse dieser Art und bildet im Deutschen eine natürliche Parallele zur ersten Frage.
- source_word: הֲיוּחַל אֶרֶץ
  choice: Kann ein Land … zur Welt gebracht werden?
  rationale: Die passive Form von חול steht hier im Bildfeld von Wehen und Geburt. „Zur Welt gebracht werden“ erhält dieses Bild; „Land“ passt zur Parallele mit dem Volk besser als „Erde“.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Formulierung gibt die zeitliche Einheit und die staunenswerte Kürze des Vorgangs klar wieder.
- source_word: אִם יִוָּלֵד גּוֹי
  choice: Kann ein Volk … geboren werden?
  rationale: אִם führt hier im parallelen rhetorischen Zusammenhang eine weitere Frage ein. Die Wiederholung von „Kann“ macht diese Struktur im Deutschen deutlich.
- source_word: גּוֹי
  choice: Volk
  rationale: „Volk“ bezeichnet hier die kollektiv-politische Gemeinschaft natürlich und würdig; „Nation“ wäre möglich, klänge jedoch stärker modern-staatlich.
- source_word: פַּעַם אֶחָת
  choice: auf einmal
  rationale: Die idiomatische Wendung vermittelt das plötzliche, gleichzeitige Geschehen, ohne die Zeitspanne genauer festzulegen als der hebräische Text.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt den begründenden beziehungsweise erklärenden Schlusssatz ein.
- source_word: חָלָה
  choice: lag in Wehen
  rationale: Die Wendung bewahrt das Geburtsbild und ist in modernem Deutsch unmittelbar verständlich.
- source_word: גַּם יָלְדָה
  choice: und gebar auch
  rationale: „Auch“ bildet גַּם ausdrücklich ab, ohne ein nicht ausdrücklich vorhandenes „sobald“ oder „sogleich“ einzufügen.
- source_word: בָּנֶיהָ
  choice: ihre Kinder
  rationale: Das maskuline Pluralwort bezeichnet hier Zions Nachkommenschaft kollektiv. „Kinder“ gibt den gemeinten Umfang natürlich wieder; die formnähere Alternative steht in der Fußnote.
theological_decisions:
- issue: Personifikation Zions als gebärende Mutter
  choice: Zion bleibt ausdrücklich als Mutter dargestellt, die in Wehen liegt und Kinder gebiert.
  alternative: Das Bild abstrakt als Wiederherstellung des Landes oder Volkes wiederzugeben.
  rationale: Der hebräische Text verwendet durchgehend konkrete Geburtsbilder und personifiziert Zion. Eine abstrakte Wiedergabe würde diese prophetische Bildspannung abschwächen.
- issue: Geschlechtsbezug von בָּנֶיהָ
  choice: Im Haupttext steht kollektiv „ihre Kinder“.
  alternative: „ihre Söhne“
  rationale: Die grammatisch maskuline Form kann die gesamte Nachkommenschaft bezeichnen. Die Übersetzung vermeidet eine unbegründete Beschränkung auf männliche Nachkommen, weist aber in der Fußnote auf die formnähere Wiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rhetorischer Parallelität. Das durchgehende Geburtsbild bleibt erhalten; nicht ausdrücklich markierte zeitliche Zusätze wie „sobald“ wurden vermieden.
