    rationale: „vor mir“ gehört im hebräischen Satz nur zur ersten Aussage über Himmel und Erde. Die Fußnote sollte die gemeinsamen Verbmöglichkeiten erläutern, ohne den Präpositionalausdruck auf die zweite Aussage zu übertragen.
  revised_text: Denn wie die neuen Himmel und die neue Erde, die ich schaffe, vor mir bestehen bleiben – Ausspruch Jahwes –, so werden eure Nachkommen und euer Name bestehen bleiben.
