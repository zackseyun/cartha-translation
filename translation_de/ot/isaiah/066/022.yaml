base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: de
  text: Denn wie die neuen Himmel und die neue Erde, die ich schaffe, vor mir bestehen bleiben – Ausspruch Jahwes –, so werden eure Nachkommen und euer Name bestehen bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorangehende Aussage; „Denn“ gibt diesen Zusammenhang im Deutschen knapp und natürlich wieder.
- source_word: כַאֲשֶׁר ... כֵּן
  choice: wie ... so
  rationale: Die korrelative Vergleichsstruktur des Hebräischen wird im Deutschen unmittelbar bewahrt.
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: der neue Himmel und die neue Erde
  rationale: „Himmel“ steht im Deutschen idiomatisch im Singular, obwohl die hebräische Form morphologisch pluralisch ist. Die bestimmte Form und die kosmische Paarung bleiben erhalten.
- source_word: עֹשֶׂה
  choice: die ich schaffe
  rationale: Das Präsens bewahrt den partizipialen Charakter als gegenwärtiges oder bevorstehendes göttliches Handeln; „schaffen“ ist im Kontext der neuen Welt natürlich und würdig.
- source_word: עֹמְדִים / יַעֲמֹד
  choice: bestehen bleiben
  rationale: Bei Himmel, Erde, Nachkommen und Name bezeichnet עמד fortdauernden Bestand. Dieselbe deutsche Wendung an beiden Stellen erhält die lexikalische Verknüpfung des Vergleichs.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die knappe räumlich-relationale Formulierung des Hebräischen wird ohne zusätzliche Deutung bewahrt.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird feierlich und quellennah wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: זַרְעֲכֶם
  choice: eure Nachkommen
  rationale: Das kollektive זֶרַע bezeichnet hier die fortbestehende Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch verständlicher als das wörtliche „Same“.
- source_word: וְשִׁמְכֶם
  choice: und euer Name
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten, ohne sie auf Ruhm, Identität oder geschichtliches Andenken einzuengen.
theological_decisions:
- issue: Die eschatologische Wendung „neuer Himmel und neue Erde“
  choice: Die kosmische Erneuerungsformel wird direkt beibehalten.
  alternative: Eine ausschließlich buchstäbliche Neuschöpfung oder ausschließlich bildhafte Wiederherstellung der Bundesordnung.
  rationale: Der hebräische Wortlaut lässt die genaue Beziehung zwischen kosmischer Neuschöpfung und heilsgeschichtlicher Wiederherstellung offen; die Übersetzung entscheidet diese Spannung nicht.
- issue: Der Umfang der Verheißung an „eure Nachkommen und euren Namen“
  choice: Die bleibende Fortdauer der angesprochenen Gemeinschaft wird zugesagt, ohne ihren theologischen Umfang näher festzulegen.
  alternative: Ausschließliche Beziehung auf das ethnische Israel, allein auf den treuen Rest oder umfassend auf das endzeitliche Volk Gottes.
  rationale: Der Vers selbst bestimmt den vollen heilsgeschichtlichen Umfang der Angesprochenen nicht; deshalb wird keine konfessionelle Deutung in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergleichsstruktur „wie ... so“ und die Wiederholung von „bestehen bleiben“ machen den inneren Zusammenhang des Satzes hörbar. Gedankenstriche grenzen die prophetische Botenformel lesefreundlich ab.
