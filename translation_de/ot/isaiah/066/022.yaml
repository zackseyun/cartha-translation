    rationale: Der Entwurf hat „der neue Himmel“, während das Hebräische „die neuen Himmel“ lautet. Anders als bei einer notwendigen deutschen Idiomatisierung ist die Pluralwiedergabe hier gut möglich und bewahrt die etablierte biblische Formel genauer.
  - severity: low
