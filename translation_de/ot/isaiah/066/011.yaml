  source_fidelity: Die Übersetzung bewahrt die zweifache damit-Konstruktion, das Bild des Saugens an der mütterlich personifizierten Jerusalem und die Abfolge von Sättigung, intensivem Trinken und Freude. In der zweiten Satzhälfte sollte jedoch das שוב wiederholte hebräische מִן („aus/von“) auch im Deutschen beim Verhältnis zur „Fülle ihrer Herrlichkeit“ erkennbar bleiben; „sich an der Fülle erfreuen“ macht die Fülle ausschließlich zum Gegenstand der Freude. Zudem sollte die Fußnote zur wörtlichen Formulierung das hebräische מִן nicht mit „an“ wiedergeben.
  naturalness: „An ihrer tröstenden Brust saugt und satt werdet“ ist im würdigen, modernen Bibelregister verständlich. „Aus der Fülle ihrer Herrlichkeit trinkt und euch daran erfreut“ ist leicht bildhaft, aber als bewusst fortgeführte Metaphorik natürlich genug und näher am hebräischen Parallelismus.
  terminology: „Herrlichkeit“ ist für כְּבוֹדָהּ angemessen. „Tröstende Brust“ gibt die Verbindung mit „Tröstungen/Trost“ idiomatisch wieder, ohne die konkrete mütterliche Bildsprache zu tilgen. Die Alternative „Brust ihrer Tröstungen“ bleibt in der Fußnote sinnvoll.
