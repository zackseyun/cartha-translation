  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
translation:
  language: de
  text: damit ihr an ihrer tröstenden Brust[a] saugt und satt werdet, damit ihr aus der Fülle[c] ihrer Herrlichkeit trinkt[b] und euch daran erfreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von der Brust ihrer Tröstungen“ oder „von der Brust ihres Trostes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aussaugt“, „ausschöpft“. Das hebräische Verb führt das kräftige Bild des Saugens weiter.'
    reason: lexical_alternative
  - marker: c
    text: Das seltene hebräische Wort kann auch „Überfluss“, „Reichtum“ oder „Überströmen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt in beiden Satzhälften die Zweck- beziehungsweise Ergebnisbedeutung natürlich und knapp wieder.
- source_word: תִּינְקוּ
  choice: saugt
  rationale: Bewahrt das konkrete Bild des Säuglings an der Brust; im unmittelbaren Zusammenhang ist das deutsche Verb eindeutig und anschaulich.
- source_word: וּשְׂבַעְתֶּם
  choice: und satt werdet
  rationale: שׂבע bezeichnet das Satt- oder Erfülltwerden. „Satt werdet“ hält hier den Bezug zur Nahrung besonders klar.
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: an ihrer tröstenden Brust
  rationale: Die idiomatische deutsche Formulierung bewahrt das mütterliche Bild. Die wörtlichere Genitivverbindung „an der Brust ihrer Tröstungen“ wird in einer Fußnote offengelegt.
- source_word: תָּמֹצּוּ
  choice: in vollen Zügen trinkt
  rationale: Das Verb setzt das Bild kräftigen Saugens beziehungsweise Ausschöpfens fort. Die Wendung ist im Deutschen natürlich und vermittelt reichlichen Genuss, ohne die Bildfolge aufzugeben.
- source_word: וְהִתְעַנַּגְתֶּם
  choice: und euch … erfreut
  rationale: Gibt die reflexive Bedeutung des Hitpael und den Sinn genussvoller Freude in gegenwärtigem, würdigem Deutsch wieder.
- source_word: מִזִּיז
  choice: an der Fülle
  rationale: Das seltene und schwierige Substantiv wird im Kontext als Fülle oder Überfluss verstanden. „Fülle“ passt zur parallelen Vorstellung reichlicher Nahrung, ohne die Bedeutung unnötig einzuengen.
- source_word: כְּבוֹדָהּ
  choice: ihrer Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem breiten Bedeutungsfeld von כָּבוֹד und passt zur Darstellung des verherrlichten Jerusalem.
theological_decisions:
- issue: Mütterliches Bild für Jerusalem/Zion
  choice: Das Bild einer Mutter, an deren Brust ihre Kinder trinken und Trost empfangen, wird ausdrücklich beibehalten.
  alternative: Die Aussage könnte zu einem allgemeinen Bild göttlichen Trostes verflacht oder ohne körperliche Bildsprache wiedergegeben werden.
  rationale: Im Kontext ist Jerusalem als Mutter personifiziert. Die Übersetzung bewahrt diese Gestalt, ohne sie über den Text hinaus zu allegorisieren.
- issue: Bezug von „ihrer Herrlichkeit“
  choice: Das feminine Suffix wird entsprechend dem Kontext auf Jerusalem bezogen.
  alternative: Man könnte Herrlichkeit stärker unmittelbar auf Gott beziehen.
  rationale: Die feminine Form und der unmittelbare Kontext sprechen grammatisch für das personifizierte Jerusalem; ein mittelbarer Bezug ihrer Herrlichkeit auf Gottes Wirken wird dadurch weder behauptet noch ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die konkrete mütterliche Bildsprache bleibt erhalten; schwer verständliche Hebraismen werden idiomatisch wiedergegeben und durch Fußnoten transparent gemacht.
