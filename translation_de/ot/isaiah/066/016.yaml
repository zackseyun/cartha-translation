  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י בָ/אֵשׁ֙ יְהוָ֣ה נִשְׁפָּ֔ט וּ/בְ/חַרְבּ֖/וֹ אֶת כָּל בָּשָׂ֑ר וְ/רַבּ֖וּ חַֽלְלֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: de
  text: Denn Jahwe hält mit Feuer und mit seinem Schwert Gericht über alles Fleisch[a]; zahlreich werden die von Jahwe Erschlagenen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „alles Fleisch“; eine prophetische Wendung für die gesamte Menschheit in ihrer geschöpflichen Sterblichkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein und bewahrt die verbindende Funktion natürlich.
- source_word: בָאֵשׁ
  choice: mit Feuer
  rationale: Das ב ist hier am besten instrumental zu verstehen; „mit Feuer“ ist im Deutschen idiomatisch und bewahrt das Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: נִשְׁפָּט
  choice: hält Gericht
  rationale: Das Niphal bezeichnet hier richterliches Vorgehen. „hält Gericht“ klingt natürlich und lässt offen, ob der Akzent auf Urteilen oder Vollstrecken liegt.
- source_word: וּבְחַרְבּוֹ
  choice: und mit seinem Schwert
  rationale: Das ב bezeichnet erneut das Mittel; das Bild des Schwertes bleibt ohne Festlegung auf wörtliche oder metaphorische Deutung erhalten.
- source_word: אֶת כָּל בָּשָׂר
  choice: über alles Fleisch
  rationale: Bei נִשְׁפָּט bezeichnet die Wendung den Gegenstand beziehungsweise die Gegenpartei des Gerichts. „über“ ist im Deutschen mit „Gericht halten“ natürlich, während „alles Fleisch“ den hebräischen Ausdruck bewahrt.
- source_word: וְרַבּוּ
  choice: zahlreich werden ... sein
  rationale: Gibt die Aussage großer Zahl wieder und erhält durch die Satzstellung den feierlich-prophetischen Nachdruck.
- source_word: חַלְלֵי יְהוָה
  choice: die von Jahwe Erschlagenen
  rationale: Macht die im Konstruktus ausgedrückte Urheberschaft verständlich und wahrt den ernsten Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich; die Wiedergabe als Eigenname bewahrt dies.
- issue: Umfang und Bildlichkeit von כָּל־בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen
  rationale: Die wörtlichere Fassung bewahrt sowohl den universalen Bezug auf die Menschheit als auch den prophetischen Akzent ihrer geschöpflichen Sterblichkeit.
- issue: Bedeutung von נִשְׁפָּט
  choice: hält Gericht
  alternative: tritt ins Gericht / vollstreckt das Urteil
  rationale: „hält Gericht“ wahrt die richterliche Bedeutung, ohne die im Hebräischen mögliche Spannung zwischen Gerichtsverfahren und Gerichtsvollzug unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt feierlich, ist aber gut verständlich. „Jahwe“ gibt den Gottesnamen wieder; „alles Fleisch“ erhält die prophetische Bildsprache.
