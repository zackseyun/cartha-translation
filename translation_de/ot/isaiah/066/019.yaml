revisions:
- from: 'Und ich werde mitten unter ihnen ein Zeichen setzen[a] und einige von ihnen, die entkommen sind, zu den Nationen senden: nach Tarschisch, Pul und Lud, zu denen, die den Bogen spannen[b], nach Tubal und Jawan und zu den fernen Küstenländern[c], die noch nichts von mir gehört[d] und meine Herrlichkeit nicht gesehen haben. Sie werden unter den Nationen von meiner Herrlichkeit erzählen.'
  to: 'Und ich werde mitten unter ihnen ein Zeichen setzen[a] und aus ihrer Mitte Überlebende zu den Nationen senden: nach Tarschisch, Pul und Lud, die den Bogen spannen[b], nach Tubal und Jawan sowie zu den fernen Küstenländern[c], die noch nichts von mir gehört[d] und meine Herrlichkeit nicht gesehen haben. Sie werden unter den Nationen von meiner Herrlichkeit erzählen.'
  rationale: Die Revision entfernt die unzulässige Einengung durch »einige« und ordnet die Bogen-Wendung wieder als Beschreibung in der Namensreihe ein. Sie bewahrt die im Hebräischen offene Bedeutung von שִׁמְעִי im Haupttext und erläutert die Alternativen sachgerecht in der Fußnote. Anzeichen für eine weitergehende textkritische oder theologische Festlegung bestehen nicht.
