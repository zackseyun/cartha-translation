source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י בָ/הֶ֜ם א֗וֹת וְ/שִׁלַּחְתִּ֣י מֵ/הֶ֣ם פְּ֠לֵיטִים אֶֽל הַ/גּוֹיִ֞ם תַּרְשִׁ֨ישׁ פּ֥וּל וְ/ל֛וּד מֹ֥שְׁכֵי קֶ֖שֶׁת תֻּבַ֣ל וְ/יָוָ֑ן הָ/אִיִּ֣ים הָ/רְחֹקִ֗ים אֲשֶׁ֨ר לֹא שָׁמְע֤וּ אֶת שִׁמְעִ/י֙ וְ/לֹא רָא֣וּ אֶת כְּבוֹדִ֔/י וְ/הִגִּ֥ידוּ אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: de
  text: 'Und ich werde mitten unter ihnen ein Zeichen setzen[a] und aus ihrer Mitte Überlebende zu den Nationen senden: nach Tarschisch, Pul und Lud, die den Bogen spannen[b], nach Tubal und Jawan sowie zu den fernen Küstenländern[c], die noch nichts von mir gehört[d] und meine Herrlichkeit nicht gesehen haben. Sie werden unter den Nationen von meiner Herrlichkeit erzählen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihnen“ beziehungsweise „in ihnen“; die hebräische Präposition lässt mehrere Nuancen zu.'
    reason: lexical_alternative
  - marker: b
    text: „Die den Bogen spannen“ kann sich insbesondere auf Lud beziehen; auch die Wiedergabe „Bogenschützen“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die fernen Inseln“; das hebräische Wort kann Inseln oder Küstenländer, besonders entfernte Seegebiete, bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „die noch keine Kunde von mir“ oder „nichts von meinem Ruf gehört haben“; das hebräische Wort kann die Kunde, den Ruf oder das Renommee Gottes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי בָהֶם אוֹת
  choice: Und ich werde mitten unter ihnen ein Zeichen setzen
  rationale: שׂים bedeutet „setzen, stellen, legen“, אוֹת allgemein „Zeichen“. „Mitten unter ihnen“ gibt die kollektive Bedeutung von בָהֶם natürlich wieder, ohne die mögliche Nuance „an ihnen/in ihnen“ endgültig auszuschließen.
- source_word: וְשִׁלַּחְתִּי מֵהֶם פְּלֵיטִים
  choice: und einige von ihnen, die entkommen sind, ... senden
  rationale: פְּלֵיטִים bezeichnet Entkommene bzw. Überlebende. Die Relativform ist in modernem Deutsch natürlich und erhält den Bezug von מֵהֶם auf die zuvor genannte Gruppe.
- source_word: אֶל הַגּוֹיִם
  choice: zu den Nationen
  rationale: גּוֹיִם bezeichnet hier die fremden Völker bzw. Nationen; „Nationen“ bewahrt die wiederkehrende Terminologie des Verses.
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: Tarschisch, Pul und Lud ... Tubal und Jawan
  rationale: Die Orts- bzw. Völkernamen werden nach geläufiger deutscher biblischer Form transliteriert.
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: die den Bogen spannen
  rationale: Die Wendung bedeutet wörtlich „den Bogen Ziehende“. „Den Bogen spannen“ bewahrt das Bild und ist idiomatisches Deutsch; syntaktisch kann sie besonders auf Lud bezogen werden.
- source_word: הָאִיִּים הָרְחֹקִים
  choice: die fernen Küstenländer
  rationale: אִיִּים kann Inseln oder maritime Küstenländer bezeichnen. „Küstenländer“ ist der breitere Ausdruck; „Inseln“ bleibt als Fußnotenalternative erhalten.
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: die noch nichts von mir gehört haben
  rationale: שִׁמְעִי bezeichnet das über Gott Gehörte, seinen Ruf bzw. die Kunde von ihm. Die Formulierung ist natürlich und bewahrt die semantische Offenheit zwischen „Kunde“ und „Ruf“.
- source_word: וְלֹא רָאוּ אֶת כְּבוֹדִי
  choice: und meine Herrlichkeit nicht gesehen haben
  rationale: כָּבוֹד wird im Gottesbezug sachgerecht mit „Herrlichkeit“ wiedergegeben.
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי בַּגּוֹיִם
  choice: Sie werden unter den Nationen von meiner Herrlichkeit erzählen
  rationale: נגד im Hifil bedeutet verkünden, berichten oder kundtun. „Von ... erzählen“ ist verständlich und gibt den Inhalt der Verkündigung klar wieder.
theological_decisions:
- issue: Art des von Gott gesetzten Zeichens
  choice: Das unspezifische „ein Zeichen“ bleibt stehen.
  alternative: ein Kennzeichen an ihnen; ein Banner unter ihnen
  rationale: Der hebräische Text bestimmt weder Gestalt noch Funktion des Zeichens näher; eine Konkretisierung würde eine nicht ausdrücklich genannte Deutung eintragen.
- issue: Bezug von „ihnen“ und „von ihnen“
  choice: Die Pronomen werden ohne ausdrückliche Identifizierung ihrer Bezugsgruppe wiedergegeben.
  alternative: aus Israel bzw. Juda; aus den zuvor genannten Anbetenden
  rationale: Der Kontext kann den Bezug nahelegen, doch der Vers selbst nennt die Gruppe nicht erneut. Die Übersetzung wahrt diese Offenheit.
- issue: Bezug von מֹשְׁכֵי קֶשֶׁת
  choice: Die Wendung wird in der Namensreihe unmittelbar nach Lud belassen.
  alternative: allgemein auf mehrere der genannten Nationen bezogene „Bogenschützen“
  rationale: Die Stellung spricht für einen besonderen Bezug auf Lud, lässt aber eine weitere Zuordnung nicht völlig zweifelsfrei erscheinen; die Fußnote hält dies offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgliederung folgt der hebräischen Aufzählung, wird jedoch durch einen Doppelpunkt und einen neuen Hauptsatz lesbar gehalten. „Nationen“, „Zeichen“ und „Herrlichkeit“ bewahren die zentralen biblisch-theologischen Begriffe, ohne deren Bedeutung konfessionell einzuengen.
