  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: de
  text: Der Feind hat seine Hand über all ihre Kostbarkeiten ausgestreckt.[a] Denn sie sah Völker[b] in ihr Heiligtum kommen – jene, denen du geboten hast, nicht in deine Versammlung zu kommen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alles, was ihr lieb und wert war“; auch „über all ihre Schätze“.'
    reason: lexical_alternative
  - marker: b
    text: „Völker“ bezeichnet hier fremde Völker; traditionell wird auch „Heiden“ übersetzt.
    reason: lexical_alternative
  - marker: c
    text: Vgl. 5. Mose 23. Im Hebräischen ist „du hast geboten“ maskulin (an Gott gerichtet), „dir/deine“ jedoch feminin; die Anrede wechselt im masoretischen Text daher zu Zion/Jerusalem.
    reason: cross_reference_and_grammatical_ambiguity
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: hat seine Hand ... ausgestreckt
  rationale: Bewahrt das hebräische Bild des feindseligen Ausgreifens und klingt im Deutschen natürlich; „nach“ verdeutlicht hier den Zugriff auf die Kostbarkeiten.
- source_word: צָר
  choice: der Feind
  rationale: Bezeichnet im Zusammenhang den feindlichen Bedränger Jerusalems; „Feind“ ist klar, gegenwärtig und sachlich.
- source_word: מַחֲמַדֶּיהָ
  choice: all ihren Kostbarkeiten
  rationale: Das Wort umfasst alles Begehrte und Wertvolle, ohne es auf Geld oder einzelne Schätze zu beschränken.
- source_word: כִּי
  choice: denn
  rationale: Kennzeichnet den folgenden Satz als Begründung beziehungsweise nähere Erklärung des zuvor geschilderten Unheils.
- source_word: רָאֲתָה
  choice: sie sah
  rationale: Gibt das hebräische Perfekt schlicht wieder und erhält Zion/Jerusalem als personifiziertes Subjekt.
- source_word: גוֹיִם
  choice: Völker
  rationale: Entspricht der Grundbedeutung und vermeidet, mit „Heiden“ eine später stärker religiös geprägte Unterscheidung in den Text einzutragen.
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: in ihr Heiligtum eindrangen
  rationale: „Eindrangen“ bringt im Kontext die unerlaubte, entweihende Bewegung in das Heiligtum zum Ausdruck, während Ort und Possessivbezug ausdrücklich erhalten bleiben.
- source_word: אֲשֶׁר צִוִּיתָה
  choice: jene, von denen du geboten hattest
  rationale: Bezieht den Relativsatz klar auf die zuvor genannten Völker und lässt die direkte Anrede bestehen.
- source_word: לֹא יָבֹאוּ
  choice: Sie dürfen nicht ... kommen
  rationale: Gibt das Verbot als eigenständige, nach dem Verb des Gebietens natürlich anschließende Aussage wieder.
- source_word: בַקָּהָל לָךְ
  choice: in deine Versammlung
  rationale: „Versammlung“ hält die gemeinschaftliche und kultische Weite von קָהָל offen und vermeidet die kirchliche Engführung von „Gemeinde“.
theological_decisions:
- issue: Bezug der direkten Anrede und grammatische Spannung in צִוִּיתָה ... לָךְ
  choice: Der Haupttext gibt die Stelle als direkte Anrede mit „du“ und „deine Versammlung“ wieder.
  alternative: Das Gebot kann Gott gelten, während sich das feminin markierte „dir/deine“ auf Zion beziehungsweise Jerusalem bezieht.
  rationale: Das Verb „du hast geboten“ ist maskulin singular und legt eine Anrede Gottes nahe; der Suffixform bei לָךְ entspricht formal jedoch feminin singular und kann einen Wechsel zu Zion anzeigen. Da das Deutsche diese Differenz nicht sichtbar machen kann, wird sie in einer Fußnote offengelegt, statt stillschweigend harmonisiert zu werden.
- issue: Bedeutung des Verbots
  choice: Das Verbot betrifft das Kommen in die Versammlung.
  alternative: Es könnte als unmittelbares Verbot des Betretens des Heiligtums verstanden werden.
  rationale: Der hebräische Text unterscheidet ausdrücklich zwischen מִקְדָּשָׁהּ, „ihr Heiligtum“, und בַקָּהָל, „in die Versammlung“. Diese Spannung bleibt erhalten und wird nicht zu einem einzigen räumlichen Verbot verschmolzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarem Klagecharakter. Das konkrete Handbild und die Personifizierung Jerusalems bleiben erhalten. „Eindrangen“ macht die feindliche Entweihung verständlich, ohne Heiligtum und Versammlung gleichzusetzen.
