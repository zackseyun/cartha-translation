    rationale: צִוִּיתָה ist maskulin („du [m.] hast geboten“), לָךְ dagegen feminin („dir [f.]“). Im masoretischen Text liegt somit ein Wechsel der angesprochenen Person vor, üblicherweise von Gott zu Zion/Jerusalem.
