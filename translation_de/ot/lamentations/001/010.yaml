  terminology: „Kostbarkeiten“, „Völker“, „Heiligtum“ und „Versammlung“ sind angemessen. „Heiden“ sollte nicht den Haupttext bestimmen, da גוים hier zunächst „Völker“ bedeutet. Die Fußnote zur Anrede wird präzisiert, damit sie die grammatischen Formen nicht nur als Möglichkeit, sondern als tatsächliche Spannung des masoretischen Textes beschreibt.
