source:
  edition: WLC
  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: de
  text: Jerusalem dachte in den Tagen ihres Elends und ihrer Heimatlosigkeit[a] an all ihre Kostbarkeiten aus längst vergangenen Tagen. Als ihr Volk in die Hand des Feindes fiel und niemand ihr half, sahen ihre Feinde sie; sie lachten über ihren Zusammenbruch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihres Umherirrens“. Das hebräische Wort ist selten und in seiner Bedeutung umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über ihren Untergang“ beziehungsweise „über ihre Verwüstung“. Das hebräische Substantiv kann Jerusalems Zusammenbruch oder ihren verwüsteten Zustand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָֽכְרָ֣ה
  choice: dachte … an
  rationale: Das Qal Perfekt 3. Feminin Singular bezieht sich auf das personifizierte Jerusalem. „An etwas denken“ gibt das Erinnern im Deutschen natürlich wieder.
- source_word: יְמֵ֤י עָנְיָהּ֙
  choice: in den Tagen ihres Elends
  rationale: עֳנִי bezeichnet Elend, Not oder Bedrängnis. „Elend“ ist verständlich, gewichtig und passt zum Klagekontext.
- source_word: וּמְרוּדֶ֔יהָ
  choice: und ihrer Heimatlosigkeit
  rationale: Das seltene und umstrittene Wort wird wahrscheinlich von einem Bedeutungsfeld des Umherirrens beziehungsweise der Heimatlosigkeit her verstanden. Im Exilskontext trifft „Heimatlosigkeit“ die konkrete Not gut; „Umherirren“ bleibt als Alternative in der Fußnote erhalten.
- source_word: כֹּ֚ל מַחֲמֻדֶ֔יהָ
  choice: all ihre Kostbarkeiten
  rationale: Der Ausdruck umfasst wertvolle oder geliebte Dinge und ist nicht zwingend auf materiellen Besitz begrenzt. „Kostbarkeiten“ bleibt entsprechend weit.
- source_word: אֲשֶׁ֥ר הָי֖וּ מִ֣ימֵי קֶ֑דֶם
  choice: aus längst vergangenen Tagen
  rationale: מִימֵי קֶדֶם verweist auf frühere, weit zurückliegende Zeiten. Die Formulierung wahrt den poetischen Rückblick in natürlichem Deutsch.
- source_word: בִּנְפֹ֧ל עַמָּ֣הּ
  choice: Als ihr Volk … fiel
  rationale: 'Der Infinitiv mit ב bezeichnet den zeitlichen Umstand: „als ihr Volk fiel“.'
- source_word: בְּיַד צָ֗ר
  choice: in die Hand des Feindes
  rationale: Die hebräische Wendung bezeichnet das Geraten unter fremde Gewalt. Das deutsche Bild „in die Hand“ ist geläufig und bewahrt die Bildsprache.
- source_word: וְאֵ֤ין עוֹזֵר֙ לָ֔הּ
  choice: und niemand ihr half
  rationale: Die knappe Formulierung gibt Jerusalems völlige Verlassenheit idiomatisch wieder.
- source_word: רָא֣וּהָ צָרִ֔ים
  choice: sahen ihre Feinde sie
  rationale: צָרִים bezeichnet Gegner oder Feinde. Das Pronomen „ihre“ macht den Bezug im Deutschen klar, ohne den Sinn auszuweiten.
- source_word: שָׂחֲק֖וּ
  choice: sie lachten
  rationale: Das Verb bezeichnet Lachen, hier im Zusammenhang eindeutig höhnisches Lachen. Die konkrete Handlung bleibt erhalten.
- source_word: עַ֥ל מִשְׁבַּתֶּֽהָ
  choice: über ihren Zusammenbruch
  rationale: Das schwierige Substantiv kann Aufhören, Zusammenbruch, Untergang oder verwüsteten Zustand bezeichnen. „Zusammenbruch“ wahrt die Vorstellung ihres Niedergangs, ohne die lexikalische Unsicherheit zu verdecken.
