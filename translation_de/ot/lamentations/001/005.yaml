base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: de
  text: Ihre Bedränger haben die Oberhand gewonnen; ihre Feinde leben in Sicherheit[a]. Denn Jahwe hat ihr Leid zugefügt wegen ihrer vielen Vergehen. Ihre kleinen Kinder[b] wurden als Gefangene vor dem Bedränger weggeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben Ruhe“, „leben ungestört“ oder „gedeihen“. Das hebräische Verb kann ungestörte Ruhe und Sicherheit ebenso wie Wohlergehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Kleinen“, möglicherweise auch „ihre Säuglinge“. Das hebräische Wort bezeichnet junge Kinder und hebt ihre Schutzlosigkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: ihre Bedränger
  rationale: צַר bezeichnet hier feindliche Widersacher und kann zugleich deren bedrängende, unterdrückende Rolle hervorheben. „Bedränger“ passt zum Klagekontext und unterscheidet sich im Parallelismus natürlich von „Feinde“.
- source_word: לְרֹאשׁ
  choice: stehen nun an der Spitze
  rationale: Die Wendung bedeutet wörtlich „zum Haupt“ und beschreibt Vorrang beziehungsweise Herrschaft. Die Formulierung bewahrt das Bild der Spitze in verständlichem Deutsch und bringt den eingetretenen Machtwechsel zum Ausdruck.
- source_word: אֹיְבֶיהָ
  choice: ihre Feinde
  rationale: „Feinde“ ist die übliche und kontextgerechte Wiedergabe von אֹיֵב in einer militärisch-feindlichen Situation.
- source_word: שָׁלוּ
  choice: leben ungestört
  rationale: Das Verb bezeichnet Ruhe, Sicherheit oder Wohlergehen. „Leben ungestört“ bewahrt den Aspekt sorgloser Sicherheit, ohne den Sinn einseitig auf materiellen Wohlstand festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹגָהּ
  choice: hat ihr Leid zugefügt
  rationale: Die Hifil-Form von יגה bezeichnet das Verursachen von Kummer oder Leid. Diese Wiedergabe erhält die ausdrücklich genannte göttliche Verursachung und klingt zugleich natürlich.
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: wegen ihrer vielen Vergehen
  rationale: רֹב bezeichnet die große Zahl oder Fülle, während פֶּשַׁע schuldhafte Übertretung beziehungsweise Auflehnung meint. „Viele Vergehen“ gibt den Sinn klar und gewichtig wieder, ohne ihn konfessionell zu verengen.
- source_word: עוֹלָלֶיהָ
  choice: ihre kleinen Kinder
  rationale: עוֹלָל bezeichnet sehr junge Kinder und betont damit ihre Schutzlosigkeit. „Kleine Kinder“ ist im modernen Deutsch verständlich, ohne das Alter so eng wie „Säuglinge“ festzulegen.
- source_word: שְׁבִי
  choice: in Gefangenschaft
  rationale: Das Substantiv bezeichnet Gefangenschaft oder den Zustand als Gefangene. Mit „ziehen“ ergibt sich eine natürliche deutsche Wendung.
- source_word: לִפְנֵי צָר
  choice: vor dem Bedränger her
  rationale: Die Formulierung hält das räumliche Bild des Hebräischen fest und deutet an, dass die Kinder unter der Gewalt des Feindes weggeführt werden, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Göttliches Handeln und Jerusalems Schuld
  choice: Denn Jahwe hat ihr Leid zugefügt wegen ihrer vielen Vergehen.
  alternative: Denn Jahwe hat sie wegen ihrer zahlreichen Auflehnungen in Kummer gestürzt.
  rationale: Der hebräische Text schreibt das Leid ausdrücklich Jahwe zu und nennt Jerusalems Vergehen als Grund. Die Übersetzung bewahrt sowohl die göttliche Urheberschaft als auch die menschliche Verantwortlichkeit, ohne die Spannung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus zwischen „Bedränger“ und „Feinde“ bleibt erhalten; „vor dem Bedränger her“ bewahrt bewusst das eindringliche räumliche Bild des Ausgangstextes.
