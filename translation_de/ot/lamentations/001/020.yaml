id: LAM.1.20
reference: Lamentations 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: de
  text: Sieh, Jahwe, denn mir ist angst! Mein Innerstes ist in Aufruhr[a], mein Herz kehrt sich in mir um, denn ich habe mich schwer aufgelehnt[b]. Draußen macht das Schwert kinderlos; im Haus ist es wie der Tod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Meine inneren Organe“. Im Hebräischen ist dies ein körperbezogener Ausdruck für tiefen inneren Schmerz und heftige Erregung.'
    reason: cultural_note
  - marker: b
    text: 'Auch: „denn ich habe mich aufs Äußerste widersetzt“ oder „denn ich habe mich bitter aufgelehnt“. Das Hebräische verstärkt das Verb „sich auflehnen“ durch eine vorangestellte Form desselben Wortstamms.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „im Haus: Tod“. Das Hebräische ist knapp und elliptisch; die Vergleichspartikel spricht jedoch für „wie der Tod“.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ ist ein unmittelbarer Hilferuf an Gott. „Sieh“ ist knapp, gegenwärtig und bewahrt die direkte Anrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Tetragramms als Eigenname erhält die persönliche Gottesbezeichnung des hebräischen Textes.
- source_word: צַר לִי
  choice: mir ist angst
  rationale: Die idiomatische deutsche Wendung gibt die persönliche Bedrängnis natürlich und eindringlich wieder.
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: Mein Innerstes ist in Aufruhr
  rationale: מֵעַי bezeichnet wörtlich die inneren Organe als Sitz tiefer Empfindungen; die Formulierung bewahrt den leiblich-emotionalen Gehalt, ohne im Deutschen missverständlich zu wirken.
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: mein Herz kehrt sich in mir um
  rationale: Die konkrete Metapher des Umkehrens oder Umstürzens bleibt erhalten und wird nicht zu einem bloßen „ich bin betrübt“ verflacht.
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: denn ich habe mich schwer aufgelehnt
  rationale: Infinitivus absolutus und finites Verb desselben Stammes verstärken das Eingeständnis der Auflehnung. „Schwer“ gibt diese Intensivierung idiomatisch wieder.
- source_word: מִחוּץ
  choice: Draußen
  rationale: Die knappe Ortsangabe erhält den poetischen Gegensatz zu „im Haus“.
- source_word: שִׁכְּלָה חֶרֶב
  choice: macht das Schwert kinderlos
  rationale: Das Verb bezeichnet das Berauben von Kindern beziehungsweise das Kinderlosmachen. Die ungewöhnlich kompakte Personifikation des Schwertes bleibt erhalten.
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: im Haus ist es wie der Tod
  rationale: Das כ־ wird als Vergleich wiedergegeben. Das ergänzte „ist es“ macht die elliptische hebräische Wendung im Deutschen verständlich, ohne sie als eindeutige Gleichsetzung aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt es als persönlichen Namen wieder, statt es durch einen Titel zu ersetzen.
- issue: Art und Gewicht des Schuldbekenntnisses מָרוֹ מָרִיתִי
  choice: ich habe mich schwer aufgelehnt
  alternative: ich bin sehr widerspenstig gewesen
  rationale: Die Übersetzung bewahrt sowohl den aktiven Vollzug der Auflehnung als auch die grammatische Intensivierung, ohne näher zu bestimmen, worin sie bestand.
- issue: Deutung von כַּמָּוֶת
  choice: wie der Tod
  alternative: Tod
  rationale: Die Vergleichspartikel כ־ wird ausdrücklich bewahrt. So wird die Spannung der knappen Aussage nicht zu der eindeutigen Behauptung geglättet, im Haus herrsche buchstäblich der Tod.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Körpermetaphern und Ellipsen werden soweit möglich erhalten; erklärungsbedürftige Aspekte stehen in Fußnoten. Die Schreibweise „angst“ folgt der adjektivischen Verwendung in der festen Wendung „jemandem ist angst“.
