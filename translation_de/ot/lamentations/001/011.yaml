source:
  edition: WLC
  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: de
  text: Ihr ganzes Volk stöhnt und sucht nach Brot. Sie gaben ihre Kostbarkeiten[a] für Nahrung her, um neue Lebenskraft zu gewinnen.[b] Sieh, Jahwe, und blicke hin, denn ich bin verachtet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: ihre Schätze; ihren wertvollen Besitz.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um das Leben/die Lebenskraft wiederherzustellen“; gemeint ist, neue Lebenskraft zu gewinnen oder am Leben zu bleiben.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: gering geachtet; verächtlich geworden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: stöhnt
  rationale: Das Partizip bezeichnet das hörbare Stöhnen des notleidenden Volkes und bewahrt den gewichtigen Klagecharakter.
- source_word: מְבַקְּשִׁים לֶחֶם
  choice: sucht nach Brot
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks bleibt erhalten; „Brot“ steht im Kontext zugleich für lebensnotwendige Nahrung.
- source_word: מחמודיהם
  choice: ihre Kostbarkeiten
  rationale: Der Ausdruck bezeichnet begehrte oder wertvolle Besitztümer, ohne sie auf Geld oder bestimmte Schätze einzugrenzen.
- source_word: בְּאֹכֶל
  choice: für Nahrung
  rationale: 'Die Präposition bezeichnet hier den Tausch: Wertvoller Besitz wird für etwas Essbares hingegeben.'
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: um wieder zu Kräften zu kommen
  rationale: Die idiomatische Wendung meint in dieser Hungersnot die Wiederbelebung beziehungsweise Erhaltung des Lebens, nicht eine immaterielle Seele im engeren Sinn.
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Sieh ... und schau her
  rationale: Die beiden Imperative werden als eindringlicher Ruf nach Gottes unmittelbarer Aufmerksamkeit wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird in einer im modernen Deutschen gebräuchlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: זוֹלֵלָה
  choice: verachtet
  rationale: Im Zusammenhang bezeichnet das Wort Jerusalem als geringgeschätzt oder verächtlich; die Wiedergabe vermeidet die sachlich unpassende Bedeutung „gefräßig“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR
  rationale: Der hebräische Eigenname wird als solcher sichtbar gehalten, statt ihn mit dem Titel „Herr“ wiederzugeben.
- issue: Bedeutung von נֶפֶשׁ in לְהָשִׁיב נָפֶשׁ
  choice: körperliche Lebenskraft im Kontext der Hungersnot
  alternative: die Seele als immateriellen Teil des Menschen
  rationale: Die Wendung spricht hier vom Wiedererlangen von Kraft beziehungsweise vom Erhalt des Lebens; eine anthropologische Festlegung auf eine vom Körper getrennte Seele wäre kontextfremd.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gegenwärtige Not wird durch Präsensformen lebendig gehalten. Der Wechsel vom Bericht über „ihr Volk“ zur Ich-Rede Jerusalems bleibt erhalten; „schau her“ gibt dem parallelen Imperativ einen natürlichen und dringlichen Klang.
