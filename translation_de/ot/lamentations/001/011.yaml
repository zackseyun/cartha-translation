  to: Ihr ganzes Volk stöhnt und sucht nach Brot. Sie gaben ihre Kostbarkeiten[a] für Nahrung her, um neue Lebenskraft zu gewinnen.[b] Sieh, Jahwe, und blicke hin, denn ich bin verachtet.[c]
