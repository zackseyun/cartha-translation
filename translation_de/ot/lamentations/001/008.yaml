  text: חֵ֤טְא חָֽטְאָה֙ יְר֣וּשָׁלִַ֔ם עַל כֵּ֖ן לְ/נִידָ֣ה הָיָ֑תָה כָּֽל מְכַבְּדֶ֤י/הָ הִזִּיל֨וּ/הָ֙ כִּי רָא֣וּ עֶרְוָתָ֔/הּ גַּם הִ֥יא נֶאֶנְחָ֖ה וַ/תָּ֥שָׁב אָחֽוֹר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: de
  text: Jerusalem hat schwer gesündigt; darum ist sie unrein geworden.[a] Alle, die sie ehrten, verachten sie, denn sie haben ihre Blöße gesehen. Auch sie selbst seufzt und weicht zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine menstruierende Frau geworden“ oder „zu etwas Unreinem geworden“. Das hebräische Wort verbindet rituelle Unreinheit mit Absonderung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wendet sich nach hinten“ oder „wendet sich zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: hat schwer gesündigt
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Hat schwer gesündigt“ gibt diese Intensivierung in natürlichem Deutsch wieder.
- source_word: לְנִידָה
  choice: ist unrein geworden
  rationale: נִדָּה bezeichnet rituelle Unreinheit, besonders Menstruationsunreinheit, und die damit verbundene Absonderung. „Unrein“ bewahrt hier die kultisch-soziale Bildwelt, ohne sie unnötig einzuengen.
- source_word: מְכַבְּדֶיהָ
  choice: die sie ehrten
  rationale: Das Partizip von כבד bezeichnet Menschen, die Jerusalem Ehre und Ansehen erwiesen; der Vergangenheitsbezug macht den Gegensatz zur gegenwärtigen Verachtung deutlich.
- source_word: הִזִּילוּהָ
  choice: verachten sie
  rationale: Die Verbform drückt aus, dass Jerusalem geringgeachtet beziehungsweise als wertlos behandelt wird. „Verachten“ bildet den scharfen Gegensatz zu „ehrten“ knapp ab.
- source_word: עֶרְוָתָהּ
  choice: ihre Blöße
  rationale: Das Substantiv bezeichnet wörtlich Nacktheit beziehungsweise entblößte Scham. „Blöße“ erhält sowohl das konkrete Bild als auch den Gedanken öffentlicher Beschämung.
- source_word: נֶאֶנְחָה
  choice: seufzt
  rationale: Das Verb bezeichnet hörbares Klagen unter Leid. „Seufzt“ ist würdig, verständlich und verlangt keine stärkere emotionale Festlegung als der hebräische Ausdruck.
- source_word: וַתָּשָׁב אָחוֹר
  choice: weicht zurück
  rationale: Wörtlich heißt die Wendung, dass sie sich nach hinten beziehungsweise zurück wendet. „Weicht zurück“ gibt die Bewegung und das beschämte Sich-Zurückziehen idiomatisch wieder.
- source_word: גַּם הִיא
  choice: Auch sie selbst
  rationale: „Auch“ gibt גַּם wieder, während „sie selbst“ die ausdrückliche, hervorgehobene Nennung des Pronomens הִיא bewahrt.
theological_decisions:
- issue: Das Bild der Unreinheit in Jerusalems Gericht
  choice: לְנִידָה im Haupttext mit „unrein geworden“ wiedergeben
  alternative: „wie eine menstruell Unreine geworden“ oder „zu etwas Unreinem geworden“
  rationale: Der Text beschreibt Jerusalems Beschämung und Ausgrenzung durch die Bildwelt ritueller Unreinheit. Die Hauptfassung bewahrt diese Spannung, während die Fußnote die konkretere mögliche Bedeutung offenlegt, ohne eine Aussage über Menstruation über den Vers hinaus abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Das feminine Pronomen für Jerusalem bleibt erhalten. „Blöße“ wahrt die konkrete und beschämende Bildsprache; „Auch sie selbst“ erhält die hebräische Hervorhebung, ohne den Satz unnötig auszubauen.
