base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: de
  text: Bedeutet euch das nichts, alle, die ihr vorüberzieht? Schaut hin und seht, ob es einen Schmerz gibt wie meinen, der mir zugefügt wurde, mit dem Jahwe mich am Tag seines glühenden Zorns geplagt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bedeutet euch das nichts?“ Der hebräische Anfang ist elliptisch, wörtlich etwa: „nicht zu euch“. Auch: „Schmerz“ kann „Leid“ oder „Kummer“ bedeuten; „der mir angetan wurde“ ist eine mögliche Wiedergabe der ersten Relativwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוא אֲלֵיכֶם
  choice: Bedeutet euch das nichts
  rationale: Die hebräische Eröffnung ist elliptisch, wörtlich etwa „nicht zu euch“. Als rhetorischer Appell fragt sie die Vorübergehenden, ob das Leiden sie unberührt lässt. Die deutsche Formulierung bewahrt Ellipse und Dringlichkeit in natürlicher Sprache.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: ihr alle, die ihr des Weges zieht
  rationale: Die Wendung bezeichnet alle, die auf dem Weg vorüberziehen. „Des Weges zieht“ hält das konkrete Wegmotiv fest und passt zum würdevollen Klagegesang.
- source_word: הַבִּיטוּ וּרְאוּ
  choice: Schaut her und seht
  rationale: Die beiden Imperative steigern den eindringlichen Aufruf. „Schaut her und seht“ gibt beide Verben klar und ohne altertümliches „siehe“ wieder.
- source_word: אִם יֵשׁ
  choice: ob es ... gibt
  rationale: אִם leitet nach den Imperativen eine indirekte Frage ein; „ob es ... gibt“ entspricht dem natürlichen deutschen Satzbau.
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: Schmerz ... wie meinen Schmerz
  rationale: מַכְאוֹב umfasst körperlichen oder seelischen Schmerz und Leid. „Schmerz“ bewahrt diese Breite sowie die auffällige Wiederholung des hebräischen Wortes.
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: der mir zugefügt wurde
  rationale: Die Formulierung beschreibt hartes, leidbringendes Handeln. Das Passiv hält den Fokus zunächst auf dem erlittenen Schmerz, bevor der folgende Relativsatz Jahwe ausdrücklich nennt.
- source_word: אֲשֶׁר הוֹגָה
  choice: mit dem ... mich bedrückt hat
  rationale: Der Hifil von יגה bedeutet Kummer bereiten, betrüben oder bedrücken. „Bedrückt“ vermeidet eine unbeholfene Wiederholung von „zufügen“ und erhält den Sinn verursachten Leids.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: am Tag seines glühenden Zorns
  rationale: חֲרוֹן אַף bezeichnet wörtlich brennenden Zorn. „Glühender Zorn“ bewahrt das Bild und die Intensität idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Jahwe als Handelnder im Leiden Zions
  choice: mit dem Jahwe mich ... bedrückt hat
  alternative: der mir zugefügt wurde, als Jahwe mich ... bedrückte
  rationale: Der zweite Relativsatz nennt Jahwe als denjenigen, der das Leid verursacht. Die Übersetzung lässt diese theologische Spannung ausdrücklich stehen und schwächt die göttliche Urheberschaft nicht ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem eindringlichen Rhythmus eines Klagegesangs. Die Wiederholung von „Schmerz“ bildet die hebräische Wiederholung ab; die Gottesbezeichnung „Jahwe“ folgt dem Eigennamen im Ausgangstext.
