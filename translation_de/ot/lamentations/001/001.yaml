id: LAM.1.1
reference: Lamentations 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: de
  text: Wie einsam sitzt sie da, die Stadt, die einst voller Menschen war! Sie ist wie eine Witwe geworden. Sie, die groß war unter den Völkern, eine Fürstin unter den Provinzen, ist zum Frondienst gezwungen worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist tributpflichtig geworden“. Das hebräische Wort מַס kann sowohl den von einem Eroberer auferlegten Tribut als auch Frondienst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie
  rationale: Leitet einen klagenden Ausruf des Erstaunens ein, keine echte Informationsfrage; „Wie“ bewahrt die prägnante Klageformel.
- source_word: יָשְׁבָה בָדָד
  choice: Wie einsam sitzt sie da
  rationale: Das Perfekt schildert den gegenwärtigen Zustand anschaulich. „Sitzt sie da“ gibt das Bild der verlassenen Stadt natürlich wieder; „einsam“ drückt ihre Verlassenheit aus.
- source_word: הָעִיר רַבָּתִי עָם
  choice: die Stadt, die einst voller Menschen war
  rationale: „Die Stadt“ bleibt wie im Hebräischen unbenannt; „einst voller Menschen“ verdeutlicht den Gegensatz zwischen früherer Bevölkerungsfülle und jetziger Verödung.
- source_word: הָיְתָה כְּאַלְמָנָה
  choice: Sie ist wie eine Witwe geworden
  rationale: „Geworden“ hebt den Zustandswechsel hervor, während „wie“ den ausdrücklich vergleichenden Charakter des Bildes wahrt.
- source_word: רַבָּתִי בַגּוֹיִם
  choice: groß war unter den Völkern
  rationale: Bewahrt die Aussage über ihre frühere Größe und Stellung; „Völker“ ist hier eine natürliche deutsche Entsprechung für גּוֹיִם.
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: eine Fürstin unter den Provinzen
  rationale: „Fürstin“ gibt den weiblichen Herrschafts- und Rangtitel wieder; „Provinzen“ bezeichnet die politischen beziehungsweise administrativen Gebiete.
- source_word: הָיְתָה לָמַס
  choice: ist zum Frondienst gezwungen worden
  rationale: מַס kann Zwangsarbeit oder auferlegten Tribut bezeichnen. Die Hauptfassung wählt den Arbeitssinn und macht die demütigende Umkehr von der Fürstin zur Unterworfenen verständlich.
