source:
  edition: WLC
  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: de
  text: Ihre Unreinheit war an ihren Säumen; sie dachte nicht an ihr Ende.[a] So sank sie auf erschütternde Weise hinab;[b] sie hatte keinen Tröster. Sieh, Jahwe, mein Elend, denn der Feind hat sich großgemacht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie dachte nicht an ihre Zukunft“ oder „sie bedachte nicht, wie es mit ihr enden würde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische lautet wörtlich etwa: „sie stieg auf außergewöhnliche, erschütternde Weise hinab“; gemeint ist ein bestürzender Niedergang.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn der Feind hat sich erhoben“ beziehungsweise „großgetan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  choice: ihre Unreinheit
  rationale: Der Ausdruck kann rituelle wie moralische Verunreinigung bezeichnen. „Unreinheit“ bewahrt diese Spannweite, ohne sie auf eine bestimmte Art der Befleckung festzulegen.
- source_word: בְּשׁוּלֶיהָ
  choice: an ihren Rocksäumen
  rationale: שׁוּל bezeichnet die unteren Ränder beziehungsweise Säume eines Gewandes. „Rocksäume“ erhält das konkrete Bild der anhaftenden Verunreinigung und ist im Deutschen klar verständlich.
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: sie dachte nicht an ihr Ende
  rationale: זכר bedeutet wörtlich „sich erinnern/gedenken“, kann hier aber das bewusste Bedenken bezeichnen. אַחֲרִית umfasst Ende, Ausgang oder Zukunft; „ihr Ende“ wahrt die knappe, mehrdeutige Formulierung.
- source_word: וַתֵּרֶד פְּלָאִים
  choice: So sank sie erschreckend tief
  rationale: ירד beschreibt ein Hinabgehen oder -sinken; פְּלָאִים bezeichnet hier etwas Außerordentliches und Bestürzendes. Die Wiedergabe vermittelt den schockierenden Absturz, ohne das Bild des Hinabsinkens aufzugeben.
- source_word: אֵין מְנַחֵם לָהּ
  choice: sie hatte keinen Tröster
  rationale: Das substantivierte Partizip bezeichnet einen Tröstenden. „Keinen Tröster“ bewahrt die für das Klagelied wichtige wiederkehrende Formulierung.
- source_word: רְאֵה יְהוָה
  choice: Sieh, Jahwe
  rationale: Der Imperativ ist eine dringliche Bitte um Gottes Zuwendung; „Sieh“ passt zum würdevollen Klagegebet. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עָנְיִי
  choice: mein Elend
  rationale: עֳנִי kann Bedrängnis, Not, Leiden oder Elend bezeichnen. „Elend“ ist im Deutschen natürlich, knapp und dem Klagekontext angemessen.
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: denn der Feind hat sich großgemacht
  rationale: Das objektlose Hifil von גדל kann selbstherrliches Großtun oder Sich-Erheben ausdrücken. „Hat sich großgemacht“ erhält sowohl den Größenanspruch als auch den triumphierenden Hochmut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der in טֻמְאָתָהּ bezeichneten Unreinheit
  choice: nicht näher bestimmte „Unreinheit“
  alternative: kultische Unreinheit oder sittliche Befleckung
  rationale: Der Kontext lässt kultische, körperliche und moralische Anklänge ineinandergreifen. Die Übersetzung legt sich nicht auf nur eine theologische Deutung fest.
translation_notes:
  register: Modernes, würdiges Klage- und Gebetsregister. Die Personifikation Jerusalems und der Wechsel von der Rede über sie zur Ich-Rede bleiben erhalten. „Rocksäume“, „Ende“, „Tröster“ und „hinabsinken“ bewahren die konkreten Bilder und wiederkehrenden Motive des hebräischen Textes.
