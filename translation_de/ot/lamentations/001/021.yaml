source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: de
  text: Sie haben gehört, dass ich gestöhnt habe; niemand tröstet mich. Alle meine Feinde haben von meinem Unglück gehört; sie freuen sich, dass du es getan hast. Du hast den Tag herbeigeführt, den du angekündigt hast; sie sollen wie ich werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie werden wie ich sein.“ Die hebräische Verbform kann als Wunsch oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי
  choice: Sie haben gehört, dass ich seufze
  rationale: Das Qal-Perfekt bezeichnet das bereits erfolgte Hören mit gegenwärtiger Bedeutung. אנח wird als „seufzen“ wiedergegeben, ein im Deutschen natürlicher Ausdruck hörbarer Klage.
- source_word: אֵין מְנַחֵם לִי
  choice: niemand tröstet mich
  rationale: Die knappe deutsche Form bewahrt die Aussage, dass kein Tröstender vorhanden ist.
- source_word: רָעָתִי
  choice: mein Unglück
  rationale: רעה bezeichnet hier nicht moralische Bosheit, sondern das über die Sprecherin gekommene Unheil. „Unglück“ ist verständlich und lässt sowohl Leid als auch Katastrophe anklingen.
- source_word: שָׂשׂוּ כִּי אַתָּה עָשִׂיתָ
  choice: Sie freuen sich, dass du es getan hast
  rationale: Der Objektsatz gibt den naheliegenden Bezug von כִּי wieder; das ungenannte Objekt von עשׂה bleibt wie im Hebräischen offen.
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: Bring den Tag herbei, den du angekündigt hast
  rationale: Die masoretische Konsonantenfolge הֵבֵאתָ kann ohne Änderung als Perfekt oder, bei anderer Vokalisierung, als Imperativ verstanden werden. Der folgende Wunsch gegen die Feinde und die Parallele zu 1,22 sprechen hier für die Aufforderung. קרא bedeutet in diesem Zusammenhang „ankündigen/ausrufen“.
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: damit sie werden wie ich
  rationale: Das Präfixverb kann einen Wunsch oder eine erwartete Zukunft ausdrücken. Im Klagekontext liegt ein Wunsch nahe; „damit“ verbindet ihn natürlich mit der Bitte um das Kommen des angekündigten Tages.
theological_decisions:
- issue: Göttliches Handeln am Unglück Jerusalems
  choice: „dass du es getan hast“
  alternative: Eine abschwächende Formulierung, die Gottes Urheberschaft offenlässt
  rationale: Der hebräische Text redet Gott unmittelbar an und schreibt ihm das Geschehen ausdrücklich zu. Diese Spannung wird nicht gemildert.
- issue: Perfekt oder Imperativ in הֵבֵאתָ
  choice: „Bring den Tag herbei“
  alternative: „Du hast den Tag herbeigeführt“
  rationale: Die überlieferten Konsonanten erlauben bei anderer Vokalisierung einen Imperativ. Der anschließende Wunsch, die Feinde sollten Jerusalems Schicksal teilen, sowie die ähnliche Bitte in Vers 22 stützen die imperativische Lesart; die masoretische Perfektvokalisierung bleibt in der Fußnote sichtbar.
- issue: Wunsch oder Zukunftsaussage in וְיִהְיוּ
  choice: „damit sie werden wie ich“
  alternative: „und sie werden sein wie ich“
  rationale: Die Verbform ist formal mehrdeutig. Der imprekatorische Zusammenhang begünstigt die Wiedergabe als Wunsch, ohne die Zukunftslesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Sätzen. Die weiblich personifizierte Stadt spricht in der ersten Person; geschlechtsspezifische Formen sind in diesem Vers nicht erforderlich. „Seufzen“, „trösten“, „Unglück“ und „herbeibringen“ sind allgemein verständlich und bewahren den Klagecharakter.
