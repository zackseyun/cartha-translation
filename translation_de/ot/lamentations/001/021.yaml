revisions:
- from: Sie haben gehört, dass ich seufze; niemand tröstet mich. Alle meine Feinde haben von meinem Unglück gehört. Sie freuen sich, dass du es getan hast. Bring den Tag herbei, den du angekündigt hast,[a] damit sie werden wie ich.[b]
  to: Sie haben gehört, dass ich gestöhnt habe; niemand tröstet mich. Alle meine Feinde haben von meinem Unglück gehört; sie freuen sich, dass du es getan hast. Du hast den Tag herbeigeführt, den du angekündigt hast; sie sollen wie ich werden.[a]
  rationale: Die Revision stellt die masoretische Perfektform von הֵבֵאתָ im Haupttext wieder her und entfernt die dafür nicht tragfähige imperativische Umdeutung. Der abschließende Satz wird als eigenständiger Wunsch formuliert; die mögliche Zukunftslesart ist transparent in der Fußnote vermerkt. Die übrigen Entscheidungen bewahren die knappe Klagesprache, das Unglück als Gegenstand der Feindesfreude und die explizite göttliche Handlungsmacht.
