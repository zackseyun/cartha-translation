base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: de
  text: Juda ist wegen Elend und schwerer Knechtschaft ins Exil gegangen. Sie lebt unter den Völkern und findet keine Ruhe. Alle ihre Verfolger haben sie zwischen den Engpässen[a] eingeholt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen den Engstellen“. Die hebräische Wendung kann zugleich Bedrängnis anklingen lassen und Juda als eingeschlossen und ohne Ausweg darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  choice: ist … in die Verbannung gezogen
  rationale: Das Qal von גלה bezeichnet hier das Ins-Exil-Gehen. Die Formulierung erhält die aktive grammatische Gestalt, ohne auszuschließen, dass Juda gewaltsam vertrieben wurde.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der übliche deutsche Name; im Zusammenhang wird Juda als weibliche Gestalt personifiziert, was die Pronomen „sie“ aufnehmen.
- source_word: מֵעֹנִי
  choice: aus Elend
  rationale: עֹנִי umfasst Bedrängnis, Not und Elend. Das deutsche „aus“ bewahrt die Mehrdeutigkeit von מִן zwischen Herkunft beziehungsweise Zustand und ursächlichem Anlass besser als eine ausschließlich kausale Wiedergabe.
- source_word: וּמֵרֹב עֲבֹדָה
  choice: und schwerem Frondienst
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Zwangsdienst bezeichnen; רֹב hebt dessen großes beziehungsweise drückendes Ausmaß hervor. „Schwerer Frondienst“ macht den Zwangscharakter verständlich, ohne den Begriff auf rechtlich definierte Sklaverei zu verengen.
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: Nun lebt sie unter den Völkern
  rationale: ישׁב bedeutet sitzen, wohnen oder leben. „Lebt“ klingt im Deutschen natürlich und zeichnet Judas fortdauernden Aufenthalt inmitten fremder Völker nach; „nun“ verdeutlicht den resultierenden Zustand, ohne eine zusätzliche Aussage einzuführen.
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: findet keine Ruhe
  rationale: מָנוֹחַ kann Ruhe oder einen Ruheplatz meinen. Die knappe Formulierung lässt die körperliche, örtliche und existentielle Dimension offen.
- source_word: כָּל רֹדְפֶיהָ
  choice: Alle ihre Verfolger
  rationale: Das Partizip von רדף bezeichnet diejenigen, die Juda feindlich verfolgen; „Verfolger“ erhält das konkrete Verfolgungsbild.
- source_word: הִשִּׂיגוּהָ
  choice: haben sie … eingeholt
  rationale: Das Hifil von נשׂג bedeutet erreichen oder einholen. „Eingeholt“ bewahrt das Bild einer Verfolgungsjagd.
- source_word: בֵּין הַמְּצָרִים
  choice: zwischen den Engpässen
  rationale: Die Wendung bezeichnet wörtlich enge Stellen beziehungsweise Engpässe. Diese räumliche Wiedergabe vermittelt, dass Juda eingeschlossen und ohne Fluchtweg ist, während die mögliche Bedrängnis-Nuance in der Fußnote erhalten bleibt.
