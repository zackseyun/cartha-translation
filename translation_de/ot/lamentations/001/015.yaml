  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: de
  text: Der Herr hat alle meine Helden in meiner Mitte verworfen. Gegen mich hat er eine Versammlung einberufen[a], um meine jungen Männer zu zerschmettern. Der Herr hat die Jungfrau, die Tochter Juda, in der Kelter zertreten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegen mich hat er eine festgesetzte Zeit bestimmt.“ Das hebräische Wort מוֹעֵד kann eine festgesetzte Zeit oder eine einberufene Zusammenkunft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Keltertreten ist ein Bild für ein vernichtendes göttliches Gericht. Die Jungfrau, die Tochter Juda, ist dabei die vom Keltertreten Betroffene.
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: hat verworfen
  rationale: Das seltene Verb bezeichnet hier im Zusammenhang der militärischen Niederlage ein entschiedenes Verwerfen oder Verstoßen, nicht ein bloßes Erhöhen.
- source_word: אַבִּירַי
  choice: meine Helden
  rationale: אַבִּיר bezeichnet hier starke, kampffähige Männer. „Helden“ ist im Deutschen knapp, würdig und im militärischen Zusammenhang verständlich.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der hebräische Text hat den Gottestitel אֲדֹנָי, nicht den Gottesnamen יהוה. „Der Herr“ gibt den Titel wieder, ohne beide Formen gleichzusetzen.
- source_word: בְּקִרְבִּי
  choice: in meiner Mitte
  rationale: Die personifizierte Stadt spricht von den Männern, die sich innerhalb ihrer Gemeinschaft beziehungsweise ihres Stadtgebiets befinden; eine psychologische Bedeutung ist nicht gemeint.
- source_word: קָרָא עָלַי מוֹעֵד
  choice: Gegen mich hat er eine Versammlung einberufen
  rationale: מוֹעֵד kann sowohl eine festgesetzte Zeit als auch eine einberufene Zusammenkunft bezeichnen. Mit קָרָא gibt „Versammlung einberufen“ die mögliche Zusammenkunft zum Gericht natürlich wieder; die zeitliche Alternative bleibt in der Fußnote erhalten.
- source_word: לִשְׁבֹּר
  choice: um … zu zerschmettern
  rationale: Das Verb bedeutet wörtlich „brechen“; „zerschmettern“ vermittelt in diesem Gerichtskontext die gewaltsame Vernichtung.
- source_word: בַּחוּרַי
  choice: meine jungen Männer
  rationale: בָּחוּר bezeichnet junge Männer in der Blüte ihrer Kraft, hier wahrscheinlich im kampffähigen Alter.
- source_word: גַּת דָּרַךְ
  choice: hat die Kelter … getreten
  rationale: Die konkrete Keltermetapher des hebräischen Textes wird bewahrt; sie zeichnet das göttliche Gericht als gewaltsames Zertreten.
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: für die Jungfrau, die Tochter Juda
  rationale: Die Formulierung bewahrt die personifizierende Doppelbezeichnung. „Für“ gibt die Präposition ל wieder, kann im Deutschen jedoch missverständlich klingen; die Fußnote erläutert, dass Juda das vom Keltertreten betroffene Objekt ist.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel entspricht dem natürlichen deutschen Gebrauch für den göttlichen Titel. Die Wiedergabe vermeidet, אֲדֹנָי mit dem im Vers nicht stehenden Tetragramm gleichzusetzen.
- issue: Bild des Keltertretens als göttliches Gericht
  choice: Die Metapher bleibt im Haupttext unaufgelöst erhalten.
  alternative: Der Herr hat die Tochter Juda zertreten.
  rationale: Die konkrete Bildsprache gehört zur theologischen Spannung des Verses. Eine Auflösung würde den Sinn erläutern, aber das drastische Kelterbild des Originals beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Personifikation Jerusalems beziehungsweise Judas und die harte Keltermetapher bleiben sichtbar. „Helden“ und „zerschmettern“ erhalten den militärischen Klang, ohne altertümliche Satzformen zu erzwingen.
