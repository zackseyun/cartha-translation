  variant: modern standard German
source:
  edition: WLC
  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: de
  text: Lass all ihre Bosheit vor dich kommen[a], und verfahre mit ihnen, wie du mit mir verfahren bist[b], wegen all meiner Vergehen. Denn zahlreich sind meine Seufzer[c], und mein Herz ist krank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all ihr Unheil“. Das hebräische Wort kann sowohl moralisch Böses als auch Unheil bezeichnen; hier liegt wegen des folgenden Vergleichs mit dem Gericht über die eigenen Vergehen wahrscheinlich „Bosheit“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Tu ihnen, wie du mir getan hast.“ Im Hebräischen steht in beiden Satzteilen dasselbe Verb.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mein Stöhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: Lass … kommen
  rationale: Das Qal-Imperfekt hat im Gebetszusammenhang auffordernden beziehungsweise wünschenden Sinn. Die Formulierung gibt die Bitte in natürlichem modernem Deutsch wieder.
- source_word: רָעָתָם
  choice: all ihre Bosheit
  rationale: רָעָה kann moralisches Böses oder Unheil bezeichnen. Der Vergleich mit Zions Gericht wegen ihrer Vergehen legt hier die schuldhafte Bosheit der Feinde nahe; zugleich bleibt die mögliche Alternative in der Fußnote sichtbar.
- source_word: לְפָנֶיךָ
  choice: vor dich
  rationale: Die Wendung bezeichnet, dass etwas in Gottes Gegenwart und vor seine Wahrnehmung beziehungsweise sein Gericht gelangt. „Vor dich kommen“ bewahrt das hebräische Bild knapp und verständlich.
- source_word: וְעוֹלֵל לָמוֹ … כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: und verfahre mit ihnen, wie du mit mir verfahren bist
  rationale: Die Wiederholung von עלל in beiden Satzteilen wird durch die Wiederholung von „verfahren“ abgebildet. Die Wendung bezeichnet hier Gottes entsprechendes, gerichtliches Handeln, ohne dieses über den Text hinaus auszumalen.
- source_word: עַל כָּל פְּשָׁעָי
  choice: wegen all meiner Vergehen
  rationale: פשע bezeichnet schuldhafte Übertretung beziehungsweise Auflehnung. „Vergehen“ ist gegenwärtig, gewichtig und vermeidet eine unnötig konfessionell geprägte Festlegung.
- source_word: רַבּוֹת אַנְחֹתַי
  choice: zahlreich sind meine Seufzer
  rationale: אַנְחָה bezeichnet das Seufzen oder Stöhnen aus tiefem Leid. „Seufzer“ ist im Deutschen idiomatisch und wahrt den klagenden Ton.
- source_word: לִבִּי דַוָּי
  choice: mein Herz ist krank
  rationale: דַוָּי bezeichnet Kranksein, Schwäche oder schmerzliche Angegriffenheit. Die wörtliche Herzmetapher bringt das innere Leiden eindringlich zum Ausdruck.
theological_decisions:
- issue: Art des erbetenen Gerichts über die Feinde
  choice: Der Vers bleibt eine Bitte an Gott, die Bosheit der Feinde vor sich kommen zu lassen und mit ihnen entsprechend seinem Gericht über Zion zu verfahren.
  alternative: Man könnte die Aussage stärker als ausdrücklichen Vergeltungswunsch oder schwächer nur als Bitte um göttliche Kenntnisnahme formulieren.
  rationale: Der hebräische Text verbindet die Wahrnehmung der Bosheit mit der Bitte um entsprechendes Handeln. Die Übersetzung bewahrt diesen gerichtlichen Appell, ohne ihn zu verschärfen oder abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. Die leicht gehobene Satzstellung „zahlreich sind meine Seufzer“ erhält den poetischen Ton, ohne altertümlich zu wirken. Die Wiederholung von „verfahren“ bildet die auffällige hebräische Verbwiederholung ab.
