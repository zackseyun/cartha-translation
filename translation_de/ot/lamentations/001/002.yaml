base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: de
  text: Bitterlich weint sie in der Nacht, ihre Tränen sind auf ihren Wangen. Unter all ihren Liebhabern[a] hat sie keinen Tröster. Alle ihre Gefährten[b] haben treulos an ihr gehandelt; sie sind ihr zu Feinden geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter all ihren Verbündeten“. Das hebräische Wort „Liebhaber“ bewahrt die Darstellung der Stadt als Frau und kann zugleich politische Bündnispartner meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle ihre Freunde“ beziehungsweise „alle ihre Verbündeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: Bitterlich weint sie
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt den Vorgang des Weinens. „Bitterlich weint sie“ gibt diese Eindringlichkeit in natürlichem, poetischem Deutsch wieder.
- source_word: בַּלַּיְלָה
  choice: in der Nacht
  rationale: Die Zeitangabe wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: und ihre Tränen liegen auf ihren Wangen
  rationale: Die hebräischen Singularformen können kollektiv verstanden werden. Der Plural bewahrt das Bild in natürlichem Deutsch, während „liegen auf“ die sichtbare, anhaltende Trauer ausdrückt.
- source_word: אֵין לָהּ מְנַחֵם
  choice: hat sie keinen Tröster
  rationale: Die Existenzverneinung mit Partizip bezeichnet das Fehlen eines Menschen, der Trost spendet. „Tröster“ erhält die substantivische Form und den knappen poetischen Ausdruck.
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: unter all ihren Liebhabern
  rationale: „Liebhaber“ bewahrt die Personifikation der Stadt als Frau und lässt zugleich die mögliche Anspielung auf politische Bündnispartner bestehen. „Unter“ gibt den Sinn wieder, dass sich in diesem ganzen Kreis niemand findet, der sie tröstet.
- source_word: כָּל רֵעֶיהָ
  choice: alle ihre Gefährten
  rationale: רֵעַ kann Freunde, Gefährten oder Verbündete bezeichnen. „Gefährten“ passt zum poetischen Register und wahrt die persönliche wie politische Bedeutungsbreite.
- source_word: בָּגְדוּ בָהּ
  choice: haben treulos an ihr gehandelt
  rationale: בגד bezeichnet Treulosigkeit oder Verrat in einer Beziehung. Die Formulierung erhält diesen starken relationalen Beiklang.
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: sie sind ihr zu Feinden geworden
  rationale: Die Konstruktion bezeichnet einen Wandel der Beziehung. Die gewählte Formulierung macht diesen Übergang deutlich und bewahrt den gehobenen poetischen Ton.
theological_decisions:
- issue: Bildliche Darstellung Jerusalems beziehungsweise Zions als Frau mit „Liebhabern“
  choice: Die Beziehungsmetapher wird mit „Liebhabern“ beibehalten.
  alternative: Verbündete; Freunde
  rationale: Der Zusammenhang personifiziert die Stadt als Frau; zugleich kann die prophetische Bildsprache politische oder religiöse Bindungen anklingen lassen. „Liebhaber“ bewahrt diese Spannung, ohne die Stelle auf eine ausschließlich politische Deutung festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die weibliche Personifikation der Stadt und die relational-politische Mehrdeutigkeit werden erhalten. Die Intensivierung des Weinens wird idiomatisch statt mechanisch wörtlich wiedergegeben.
