source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: de
  text: 'Gerecht ist Jahwe, denn gegen sein Wort habe ich mich aufgelehnt. Hört doch, ihr Völker alle, und seht meinen Schmerz: meine jungen Frauen[a] und meine jungen Männer sind in die Gefangenschaft gegangen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meine Jungfrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das prädikative Adjektiv bezeichnet Jahwes moralische Gerechtigkeit in seinem Gericht; „gerecht“ bewahrt sowohl den rechtlichen als auch den theologischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פִיהוּ
  choice: sein Wort
  rationale: Wörtlich steht „sein Mund“; metonymisch ist damit das von Jahwe Gesagte beziehungsweise Gebotene gemeint. „Sein Wort“ gibt das Bild idiomatisch und genau wieder.
- source_word: מָרִיתִי
  choice: gegen … habe ich mich aufgelehnt
  rationale: מרה bezeichnet widerspenstigen Widerstand gegen eine Autorität; die reflexive Formulierung ist im Deutschen natürlich und bewahrt die moralische Schärfe.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der Imperativ mit נָא trägt hier einen eindringlich-bittenden Ton, den „doch“ in natürlichem Deutsch wiedergibt.
- source_word: כָל עמים
  choice: ihr Völker alle
  rationale: עמים bezeichnet Völker beziehungsweise Volksgruppen; die Anredeform macht den hebräischen Vokativ im Deutschen deutlich.
- source_word: מַכְאֹבִי
  choice: meinen Schmerz
  rationale: Das Substantiv bezeichnet körperlichen oder seelischen Schmerz und passt in seiner knappen, konkreten Form zum Klageton.
- source_word: בְּתוּלֹתַי
  choice: meine jungen Frauen
  rationale: בְּתוּלוֹת kann Jungfrauen oder unverheiratete junge Frauen bezeichnen. „Junge Frauen“ ist im modernen Deutschen natürlich, ohne den sozialen Bezug unnötig festzulegen; die engere Alternative steht in der Fußnote.
- source_word: וּבַחוּרַי
  choice: meine jungen Männer
  rationale: Die Bezeichnung meint junge Männer und steht parallel zu den jungen Frauen.
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: sind in die Gefangenschaft gegangen
  rationale: Die Formulierung bewahrt das einfache Verb „gehen“ und macht zugleich das Ziel beziehungsweise den Zustand der Verschleppung deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Metonymie in פִיהוּ
  choice: sein Wort
  alternative: seinen Mund
  rationale: „Sein Mund“ ist die formale Entsprechung, bezeichnet hier jedoch das von Gott ausgesprochene Wort oder Gebot. Die idiomatische Wiedergabe vermeidet im Deutschen eine missverständliche Körpermetapher, ohne den Sinn enger auf ein einzelnes Gebot festzulegen.
- issue: Bezeichnung בְּתוּלֹתַי
  choice: meine jungen Frauen
  alternative: meine Jungfrauen
  rationale: Das Wort kann den Status als Jungfrau hervorheben, kann aber im kollektiven Parallelismus auch die jungen Frauen Jerusalems bezeichnen. Der Haupttext wahrt die natürliche Kollektivbezeichnung; die engere Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Klagesprache. „Hört doch“ bewahrt den bittenden Nachdruck, während die Satzstellung „gegen sein Wort habe ich mich aufgelehnt“ den Gegensatz zwischen Jahwes Gerechtigkeit und Jerusalems Bekenntnis hervorhebt.
