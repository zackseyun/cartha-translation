  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: de
  text: Das Joch meiner Vergehen ist von seiner Hand festgebunden[a]. Sie sind miteinander verflochten[b]; sie haben sich auf meinen Nacken gelegt. Er hat meine Kraft versagen lassen. Der Herr hat mich in Hände gegeben[c], aus denen ich nicht wieder aufstehen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird von seiner Hand bewacht“. Das hebräische Verb ist selten und schwer zu deuten; im Zusammenhang liegt die Bedeutung „festbinden“ oder „befestigen“ näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie sind miteinander verwoben“ beziehungsweise „ineinander verschlungen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in Hände“. Wer damit gemeint ist, bleibt im Hebräischen unbestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: ist … festgebunden
  rationale: Das seltene und schwierige Verb wird im Zusammenhang mit dem Joch und dem Nacken am ehesten als Befestigen oder Binden verstanden. „Festgebunden“ wahrt das konkrete Bild, ohne die Unsicherheit des hebräischen Ausdrucks zu verschweigen.
- source_word: עֹל
  choice: Joch
  rationale: „Joch“ ist die natürliche deutsche Entsprechung und bewahrt das zentrale Bild von Last und Unterwerfung.
- source_word: פְּשָׁעַי
  choice: meiner Vergehen
  rationale: פשע bezeichnet schuldhafte Auflehnung beziehungsweise Übertretung. „Vergehen“ ist im modernen Deutsch verständlich und behält das moralische Gewicht, ohne unnötig fachsprachlich zu wirken.
- source_word: בְּיָדוֹ
  choice: von seiner Hand
  rationale: Die Formulierung bewahrt das hebräische Bild der Hand und bezeichnet zugleich den Handelnden.
- source_word: יִשְׂתָּרְגוּ
  choice: Sie sind miteinander verflochten
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein Verschlingen, Verflechten oder Verweben. „Miteinander verflochten“ passt zu den Vergehen, die zu einem bedrückenden Joch verbunden werden.
- source_word: עָלוּ עַל צַוָּארִי
  choice: mir auf den Nacken gestiegen
  rationale: Die Wiedergabe erhält die aufsteigende Bewegung des hebräischen Verbs und das körperliche Bild des auf dem Nacken lastenden Jochs.
- source_word: הִכְשִׁיל כֹּחִי
  choice: Er hat meine Kraft versagen lassen
  rationale: Die Kausativform von כשל bedeutet wörtlich, etwas zum Straucheln zu bringen. In Verbindung mit „Kraft“ drückt „versagen lassen“ den idiomatischen Sinn verständlich aus.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: „Der Herr“ ist die übliche und angemessene deutsche Wiedergabe des hier als Gottesbezeichnung verwendeten Titels.
- source_word: בִּידֵי
  choice: in Hände
  rationale: Der artikellose Plural lässt die Unterdrücker unbestimmt. Das ungewöhnliche, aber verständliche „in Hände“ bewahrt diese Offenheit.
- source_word: לֹא אוּכַל קוּם
  choice: sodass ich nicht aufstehen kann
  rationale: קום bezeichnet hier das Aufstehen beziehungsweise Sich-wieder-Erheben aus der Erniedrigung. Der Folgesatz macht den Zusammenhang mit der Auslieferung deutlich, ohne bestimmte Gegner einzuführen.
theological_decisions:
- issue: Bezug der maskulinen Singularformen in der ersten Vershälfte
  choice: Die Formen werden auf Gott, den später ausdrücklich genannten Herrn, als richtenden Handelnden bezogen.
  alternative: Die erste Form könnte unpersönlicher verstanden oder teilweise auf das Joch bezogen werden.
  rationale: Der Vers mündet in die ausdrückliche Aussage, dass der Herr die Sprecherin ausgeliefert hat; auch der Kontext führt Jerusalems Not auf Gottes Gericht zurück. Die personale Wiedergabe erhält diesen Zusammenhang, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dichte Bildsprache von Joch, Verflechtung, Nacken und versagender Kraft bleibt erhalten. Kurze Hauptsätze folgen dem klagenden Rhythmus des Hebräischen; seltene oder mehrdeutige Ausdrücke werden in Fußnoten offengelegt.
