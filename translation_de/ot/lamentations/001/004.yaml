id: LAM.1.4
reference: Lamentations 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: de
  text: Die Wege Zions trauern, weil niemand zum Fest[a] kommt. Alle ihre Tore liegen verödet, ihre Priester seufzen, ihre Jungfrauen[b] sind betrübt, und ihr selbst ist bitter zumute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zur festgesetzten Versammlung; das hebräische Wort kann auch eine festgesetzte Zeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ihre jungen Frauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: Die Wege Zions
  rationale: Der Plural von דֶּרֶךְ bezeichnet hier die Wege, auf denen einst die Festbesucher nach Zion kamen. „Wege“ ist im Deutschen natürlich, poetisch und bewahrt die Personifikation.
- source_word: אֲבֵלוֹת
  choice: trauern
  rationale: Die feminine Pluralform beschreibt die Wege als trauernd und führt die poetische Personifikation unmittelbar fort.
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: weil niemand zum Fest kommt
  rationale: מִבְּלִי bezeichnet das Fehlen von etwas, בָּאֵי die Kommenden und מוֹעֵד hier im Zusammenhang mit Zion sehr wahrscheinlich ein kultisches Fest. Die Formulierung gibt den Sinn natürlich wieder, ohne ausdrücklich „Pilger“ in den Text einzutragen.
- source_word: כָּל שְׁעָרֶיהָ שׁוֹמֵמִין
  choice: Alle ihre Tore liegen verödet
  rationale: שׁוֹמֵמִין beschreibt Leere und Verwüstung. „liegen verödet“ wahrt sowohl den Zustand als auch den feierlich-klagenden Ton.
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: ihre Priester seufzen
  rationale: נֶאֱנָחִים bezeichnet hörbaren Ausdruck von Leid. „seufzen“ ist direkt, idiomatisch und entspricht dem Trauerton.
- source_word: בְּתוּלֹתֶיהָ נּוּגוֹת
  choice: ihre Jungfrauen sind betrübt
  rationale: בְּתוּלֹתֶיהָ wird lexikalisch transparent als „ihre Jungfrauen“ wiedergegeben; נּוּגוֹת beschreibt sie als von Kummer oder Bedrängnis betroffen.
- source_word: וְהִיא מַר לָהּ
  choice: und ihr selbst ist bitter zumute
  rationale: וְהִיא ist emphatisch und bezieht sich auf das weiblich personifizierte Zion. Die deutsche Wendung „ihr ist bitter zumute“ bringt bitteres inneres Leid zum Ausdruck, ohne die missverständliche Bedeutung von „verbittert“ nahezulegen.
theological_decisions:
- issue: Weibliche Personifikation Zions
  choice: 'Zion wird durchgehend als Frau dargestellt: „ihre“ und „ihr selbst“.'
  alternative: Die Stadt sachlich mit „seine“ beziehungsweise „ihm selbst“ wiederzugeben.
  rationale: Die femininen Formen und das betonte וְהִיא gestalten Zion im Hebräischen ausdrücklich als weibliche Person. Diese Personifikation prägt die Bildwelt des gesamten Klagelieds und sollte nicht eingeebnet werden.
- issue: Bedeutungsumfang von מוֹעֵד
  choice: Im Haupttext „Fest“, mit Hinweis auf die weiteren Bedeutungen.
  alternative: „festgesetzte Zeit“ oder „festgesetzte Versammlung“.
  rationale: Der Zusammenhang von Zion, Toren und Priestern legt ein Wallfahrts- beziehungsweise Kultfest nahe. Da מוֹעֵד jedoch auch eine bestimmte Zeit oder Versammlung bezeichnen kann, bleibt die lexikalische Offenheit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die kurzen Satzglieder spiegeln den klagenden Rhythmus; die weibliche Personifikation Zions bleibt erhalten. „Bitter zumute“ vermeidet sowohl eine hölzerne Wiedergabe als auch die Deutung, Zion sei im Sinne von Groll verbittert.
