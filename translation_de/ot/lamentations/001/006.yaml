  text: וַ/יֵּצֵ֥א מן בת צִיּ֖וֹן כָּל הֲדָרָ֑/הּ הָי֣וּ שָׂרֶ֗י/הָ כְּ/אַיָּלִים֙ לֹא מָצְא֣וּ מִרְעֶ֔ה וַ/יֵּלְכ֥וּ בְ/לֹא כֹ֖חַ לִ/פְנֵ֥י רוֹדֵֽף־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: de
  text: Von der Tochter Zion ist all ihre Pracht gewichen[a]. Ihre Fürsten sind wie Hirsche geworden, die keine Weide finden[b]. Kraftlos zogen sie vor dem Verfolger her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von der Tochter Zion ist all ihre Hoheit gewichen«; wörtlicher: »All ihre Pracht ist von der Tochter Zion ausgegangen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder entsprechend der hebräischen Vergangenheitsform: »wie Hirsche, die keine Weide fanden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ist … gewichen
  rationale: Das Verb bedeutet wörtlich »ging hinaus«. Mit Zions Pracht als Subjekt bezeichnet es hier idiomatisch deren Verlust; »ist gewichen« bewahrt zugleich das Bild des Fortgehens.
- source_word: מן בת ציון
  choice: Von der Tochter Zion
  rationale: Die Formulierung erhält die poetische Personifikation der Stadt als Tochter. Der bestimmte Artikel ist im Deutschen für die natürliche Wendung erforderlich.
- source_word: כָּל הֲדָרָהּ
  choice: all ihre Pracht
  rationale: הָדָר kann Pracht, Hoheit oder Schönheit bezeichnen. »Pracht« erfasst die sichtbare Würde Zions, ohne den Ausdruck unnötig theologisch aufzuladen.
- source_word: שָׂרֶיהָ
  choice: ihre Fürsten
  rationale: שַׂר bezeichnet Fürsten, Herrscher oder führende Amtsträger. »Fürsten« passt zum poetischen und königlich-nationalen Zusammenhang.
- source_word: כְּאַיָּלִים
  choice: wie Hirsche
  rationale: אַיָּלִים bezeichnet Hirsche beziehungsweise männliche Tiere der Hirschart. »Hirsche« ist im Deutschen natürlich und hält das Tierbild fest.
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: die keine Weide finden
  rationale: מִרְעֶה ist eine Weide oder ein Weideplatz. Das Präsens macht den vergleichenden Bildsatz im Deutschen anschaulich; die hebräische Vergangenheitsform bleibt in der Fußnote sichtbar.
- source_word: וַיֵּלְכוּ
  choice: zogen sie
  rationale: הלך bedeutet allgemein »gehen«. »zogen« ist im poetischen Zusammenhang natürlich, ohne das nicht ausdrücklich genannte »fliehen« einzutragen.
- source_word: בְלֹא כֹחַ
  choice: Kraftlos
  rationale: Die knappe Wiedergabe entspricht »ohne Kraft« und vermittelt körperliche Erschöpfung und Wehrlosigkeit.
- source_word: לִפְנֵי רוֹדֵף
  choice: vor dem Verfolger her
  rationale: Die Wendung beschreibt, dass sie dem Verfolger voraus und von ihm getrieben ziehen. Der Singular »Verfolger« bleibt als kollektive oder repräsentative Bezeichnung erhalten.
