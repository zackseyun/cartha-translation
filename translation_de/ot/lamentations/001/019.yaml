base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: de
  text: Ich rief nach meinen Liebhabern[a]; sie täuschten mich. Meine Priester und meine Ältesten kamen in der Stadt um, während sie Nahrung für sich suchten, um sich am Leben zu erhalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Liebhabern“ sind bildlich wahrscheinlich Jerusalems politische Verbündete oder andere Gegenstände seines fehlgeleiteten Vertrauens gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „um ihr Leben zurückzubringen“. Die hebräische Verknüpfung kann auch kausal verstanden werden: „Denn sie suchten Nahrung für sich, um sich am Leben zu erhalten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי לַמְאַהֲבַי
  choice: Ich rief nach meinen Liebhabern
  rationale: קרא mit ל bezeichnet hier den Hilferuf an die Angeredeten. „Liebhaber“ bewahrt die auffällige Beziehungsmetapher des Hebräischen, statt sie im Haupttext vorschnell als „Verbündete“ aufzulösen.
- source_word: הֵמָּה רִמּוּנִי
  choice: doch sie täuschten mich
  rationale: Das Piel von רמה bedeutet „täuschen, hintergehen“. „Doch“ gibt den scharfen Gegensatz zwischen Hilferuf und enttäuschter Erwartung natürlich wieder.
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: meine Priester und meine Ältesten
  rationale: Die Possessivformen werden direkt wiedergegeben; זקנים bezeichnet hier wahrscheinlich die Ältesten als führende Repräsentanten der Gemeinschaft.
- source_word: בָּעִיר גָּוָעוּ
  choice: kamen in der Stadt um
  rationale: גוע bezeichnet das Sterben beziehungsweise Aushauchen des Lebens. „Kamen … um“ passt zur Katastrophensituation und klingt in modernem Deutsch würdevoll und natürlich.
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: als sie Nahrung für sich suchten
  rationale: כִּי lässt hier eine kausale oder umstandsbezogene Deutung zu. „Als“ gibt den Zusammenhang im Haupttext flüssig wieder, ohne die Kausalität stark festzulegen.
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: um am Leben zu bleiben
  rationale: Wörtlich geht es darum, ihre נֶפֶשׁ, hier ihr Leben beziehungsweise ihre Lebenskraft, zurückzubringen. Die idiomatische deutsche Formulierung vermittelt den Zweck der Nahrungssuche, ohne נֶפֶשׁ als immaterielle „Seele“ misszuverstehen.
theological_decisions:
- issue: Identität der „Liebhaber“
  choice: Die Metapher bleibt im Haupttext erhalten.
  alternative: „Verbündete“ oder „die mich liebten“
  rationale: Der Kontext legt politische Verbündete oder andere Gegenstände fehlgesetzten Vertrauens nahe, doch der hebräische Ausdruck benennt dies nicht ausdrücklich. Die bildhafte und theologisch spannungsreiche Sprache soll daher nicht stillschweigend vereindeutigt werden.
- issue: Bedeutung von נַפְשָׁם
  choice: als Bezeichnung ihres bedrohten Lebens verstanden
  alternative: „ihre Seele zurückzubringen“
  rationale: Im Kontext von Hunger und Tod bezeichnet נֶפֶשׁ das Leben beziehungsweise die Lebenskraft, nicht notwendig eine vom Körper getrennte Seele.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Klang. Die personifizierte Stimme Jerusalems und die markante Liebhaber-Metapher bleiben erhalten; die hebräische Wendung mit נֶפֶשׁ wird idiomatisch, aber in einer Fußnote auch formnäher wiedergegeben.
