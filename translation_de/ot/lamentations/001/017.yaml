  text: פֵּֽרְשָׂ֨ה צִיּ֜וֹן בְּ/יָדֶ֗י/הָ אֵ֤ין מְנַחֵם֙ לָ֔/הּ צִוָּ֧ה יְהוָ֛ה לְ/יַעֲקֹ֖ב סְבִיבָ֣י/ו צָרָ֑י/ו הָיְתָ֧ה יְרוּשָׁלִַ֛ם לְ/נִדָּ֖ה בֵּינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: de
  text: Zion hat ihre Hände ausgestreckt; niemand tröstet sie. Jahwe hat hinsichtlich Jakobs angeordnet, dass seine Feinde ihn ringsum umgeben. Jerusalem ist unter ihnen zur Unreinheit geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet besonders Menstruationsunreinheit und kann auch kultische Unreinheit oder etwas Abstoßendes meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: Zion breitet ihre Hände aus
  rationale: Das Qal von פרשׂ bezeichnet das Ausbreiten oder Ausstrecken. Das deutsche Präsens vergegenwärtigt die Klage und gibt die verzweifelte Gebärde natürlich wieder, ohne sie ausdrücklich als Gebet zu deuten.
- source_word: אֵין מְנַחֵם לָהּ
  choice: niemand tröstet sie
  rationale: Die knappe deutsche Form wahrt die existentielle Aussage und erhält das für die Klagelieder zentrale Motiv des Tröstens.
- source_word: צִוָּה יְהוָה לְיַעֲקֹב
  choice: Jahwe hat über Jakob befohlen
  rationale: צוה wird direkt mit „befehlen“ wiedergegeben. „Über Jakob“ lässt die genaue Funktion von ל offen und bezeichnet Jakob als den von dem Befehl Betroffenen, ohne die Präposition unnötig auf „gegen“ festzulegen.
- source_word: סְבִיבָיו צָרָיו
  choice: dass seine Feinde ihn rings umgeben
  rationale: Die elliptische hebräische Fügung wird als deutscher Inhaltssatz ausgedrückt. „rings umgeben“ bewahrt das Bild feindlicher Einschließung.
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה בֵּינֵיהֶם
  choice: Jerusalem ist unter ihnen zu etwas Unreinem geworden
  rationale: „ist ... geworden“ bezeichnet den eingetretenen Zustand. נִדָּה trägt kultische und insbesondere menstruationsbezogene Unreinheitsvorstellungen; die Haupttextformulierung bleibt verständlich, während die spezifische Bildwelt in der Fußnote erläutert wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Genauigkeit der Bildsprache von נִדָּה
  choice: etwas Unreines
  alternative: eine menstruierende Frau / Menstruationsunreinheit
  rationale: Der Haupttext vermittelt Jerusalems kultische Unreinheit und abstoßende Stellung in natürlichem Deutsch. Die wahrscheinlich spezifisch menstruationsbezogene Konnotation wird nicht verschwiegen, sondern in einer Fußnote bewahrt.
- issue: Bezug der Präposition לְ in לְיַעֲקֹב
  choice: über Jakob
  alternative: gegen Jakob
  rationale: Die Präposition kennzeichnet hier den von Jahwes Befehl Betroffenen. „Über“ bewahrt die semantische Offenheit besser als das eindeutig feindselige „gegen“, während der folgende Satzinhalt das Gericht erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Personifikation Zions und Jerusalems bleibt erhalten; kultische Bildsprache wird im Haupttext verständlich und in der Fußnote genauer wiedergegeben.
