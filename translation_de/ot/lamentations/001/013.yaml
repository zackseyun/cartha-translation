  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: de
  text: Aus der Höhe sandte er Feuer in meine Knochen[a], und es bezwang sie. Er spannte meinen Füßen ein Netz; er drängte mich zurück. Er machte mich zur Einöde, den ganzen Tag krank[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und unterwarf sie“; das hebräische Verb kann herrschen, unterwerfen oder bezwingen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „matt“, „leidend“ oder „dahinsiechend“ den ganzen Tag; das hebräische Wort bezeichnet Krankheit, Schwäche oder Erschöpfung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: Aus der Höhe
  rationale: Bewahrt die räumliche Bildsprache des Hebräischen, ohne die im Vers nicht ausdrücklich genannte Deutung „vom Himmel“ einzutragen.
- source_word: שָׁלַח אֵשׁ בְּעַצְמֹתַי
  choice: sandte er Feuer in meine Gebeine
  rationale: Gibt das eindringende Feuerbild knapp und würdevoll wieder; „Gebeine“ passt zum poetischen Register und bezeichnet mehr als einzelne Knochen.
- source_word: וַיִּרְדֶּנָּה
  choice: und bezwang sie
  rationale: רדה kann herrschen, unterwerfen oder bezwingen bedeuten. Der feminine Singular verweist wahrscheinlich auf das Feuer, während das Suffix sich auf die Gebeine bezieht; die deutsche Form wahrt diesen Bezug.
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: Er spannte meinen Füßen ein Netz
  rationale: Erhält das konkrete Bild einer ausgelegten Falle und klingt im Deutschen natürlich-poetisch.
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: er drängte mich zurück
  rationale: Gibt die kausative Bewegung des Hifil von שוב wieder und vermittelt erzwungenen Rückzug.
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: Er machte mich einsam und verlassen
  rationale: שֹׁמֵמָה bezeichnet einen Zustand der Verödung, Verlassenheit oder des Entsetzens. Die Wendung überträgt die auf die personifizierte Stadt bezogene Verwüstung idiomatisch.
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: den ganzen Tag siech
  rationale: דָּוָה kann krank, kraftlos, leidend oder dahinsiechend bezeichnen. „Siech“ bewahrt die körperlich-seelische Entkräftung in knapper poetischer Form.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Das Subjekt wird durchgehend mit „er“ wiedergegeben, ohne es im Vers ausdrücklich als Gott oder den HERRN zu benennen.
  alternative: Das Subjekt ausdrücklich mit „der HERR“ identifizieren.
  rationale: Die maskulinen Singularformen setzen ein aus dem Zusammenhang erschließbares Subjekt voraus. Deutsch verlangt ein Pronomen; ein Gottesname steht in diesem Vers jedoch nicht.
- issue: Bezugsverhältnisse in וַיִּרְדֶּנָּה
  choice: Das Feuer wird als handelndes Subjekt verstanden, das die Gebeine bezwingt.
  alternative: Das Verb allgemeiner als Wirkung des von Gott gesandten Feuers wiedergeben oder abweichend vokalisieren/deuten.
  rationale: Die feminine Verbform lässt sich auf אֵשׁ beziehen; das Objektsuffix kann kollektiv auf die Gebeine zurückweisen. Wegen der ungewöhnlichen Form wird die lexikalische Spannweite in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. „Gebeine“ und „siech“ sind bewusst gehoben, aber verständlich und tragen den knappen Rhythmus der Klage. Die kurzen Hauptsätze bewahren die Folge der göttlichen Gerichtshandlungen; echte lexikalische Mehrdeutigkeiten werden nicht dogmatisch aufgelöst.
