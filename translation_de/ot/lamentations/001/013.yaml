  to: Aus der Höhe sandte er Feuer in meine Knochen[a], und es bezwang sie. Er spannte meinen Füßen ein Netz; er drängte mich zurück. Er machte mich zur Einöde, den ganzen Tag krank[b].
  rationale: Die Revision ersetzt die semantisch zu enge Beschreibung „einsam und verlassen“ durch das Verwüstungsbild „zur Einöde“. Sie modernisiert „siech“ zu „krank“ und ordnet die dazugehörige lexikalische Fußnote korrekt der Schlusswendung zu. „Knochen“ ist gegenüber „Gebeine“ die natürlichere moderne Bezeichnung, ohne den hebräischen Sinn zu verändern. Die knappe Satzfolge, das nicht näher bestimmte „er“ und die schwierige Bezugnahme des Feuers auf die Knochen bleiben erhalten.
