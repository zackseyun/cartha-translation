  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: de
  text: Darüber weine ich; aus meinem Auge, aus meinem Auge fließt Wasser herab, denn fern von mir ist ein Tröster, der mein Leben wiederherstellt.[a] Meine Kinder sind verwüstet, denn der Feind hat die Oberhand gewonnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mich wiederherstellt“; wörtlich: „der mein Leben/Ich zurückbringt“. Das hebräische Wort נֶפֶשׁ kann je nach Zusammenhang auch „Selbst“ oder „Seele“ bedeuten.'
    reason: lexikalische Bedeutungsbreite von נֶפֶשׁ sowie die idiomatische und kontextbezogene Wiedergabe von מֵשִׁיב נַפְשִׁי
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: Darüber
  rationale: Die Wendung bezeichnet den Anlass beziehungsweise Gegenstand der Klage. „Darüber“ ist im Deutschen knapp, idiomatisch und lässt die genaue Nuance zwischen Ursache und Gegenstand offen.
- source_word: בוֹכִיָּה
  choice: weine ich
  rationale: Das feminine Partizip beschreibt das fortdauernde Weinen der personifizierten Stadt; das Präsens gibt dies im Deutschen natürlich wieder.
- source_word: עֵינִי עֵינִי
  choice: mein Auge, mein Auge
  rationale: Die auffällige Wiederholung des Singulars wird als poetische Intensivierung bewahrt, statt sie zu „meine Augen“ zu glätten.
- source_word: יֹרְדָה מַּיִם
  choice: fließt über von Wasser
  rationale: Die Übersetzung bewahrt das konkrete hebräische Bild des Wassers und gibt die ungewöhnliche Verbindung verständlich wieder, ohne ausdrücklich „Tränen“ einzusetzen.
- source_word: מְנַחֵם
  choice: ein Tröster
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der tröstet. Der hebräische Text hat keinen Artikel; „ein Tröster“ bewahrt diese grammatische Offenheit.
- source_word: מֵשִׁיב נַפְשִׁי
  choice: der mir neue Lebenskraft gibt
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang von Trost und Erholung das belebte Selbst beziehungsweise die Lebenskraft. Die Formulierung ist natürlich und vermeidet eine unnötige Verengung auf eine vom Körper getrennte Seele.
- source_word: רָחַק מִמֶּנִּי
  choice: fern von mir ist
  rationale: Die vorangestellte Entfernungsangabe wahrt die poetische Gewichtung und bezeichnet die schmerzliche Abwesenheit.
- source_word: בָנַי
  choice: Meine Kinder
  rationale: Obwohl die Form wörtlich „meine Söhne“ lauten kann, bezeichnet sie im Mund der personifizierten Stadt ihre Bevölkerung beziehungsweise Nachkommen insgesamt.
- source_word: שׁוֹמֵמִים
  choice: sind verwüstet
  rationale: Das Wortfeld umfasst Verwüstung, Verödung und Entsetzen. „Verwüstet“ passt zum Zustand der Kinder nach der feindlichen Katastrophe, ohne eine einzelne Bedeutungsnuance zu überbetonen.
- source_word: גָבַר אוֹיֵב
  choice: der Feind hat die Oberhand gewonnen
  rationale: גבר bezeichnet hier das Starkwerden beziehungsweise Überlegen-Sein des Feindes. Die deutsche Wendung gibt dessen tatsächliche Vorherrschaft idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von נַפְשִׁי im Klagekontext
  choice: mir neue Lebenskraft gibt
  alternative: meine Seele wiederherstellt / mich wieder aufleben lässt
  rationale: נֶפֶשׁ kann Leben, Selbst, Person, Kehle oder Seele bezeichnen. Im Zusammenhang mit dem fehlenden Tröster steht die Wiederbelebung der ganzen Person im Vordergrund; „Lebenskraft“ wahrt diese Breite und vermeidet eine dogmatisch verengte Anthropologie.
translation_notes:
  register: Moderne, würdevolle Klagesprache mit bewahrter hebräischer Wiederholung („mein Auge, mein Auge“) und konkretem Wasserbild. Die Syntax ist leicht poetisch markiert, bleibt aber für heutige Leser verständlich.
