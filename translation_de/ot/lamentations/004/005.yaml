base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
translation:
  language: de
  text: Die einst Köstlichkeiten aßen, verkümmern auf den Straßen[a]; die auf kostbarem Scharlach großgezogen wurden, umarmen Abfallhaufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind auf den Straßen verödet“; das hebräische Verb kann in diesem Zusammenhang auch Bestürzung oder Entsetzen andeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Aschenhaufen“, „Unrathaufen“ oder „Misthaufen“. Gemeint sind Orte, an denen Abfall abgelagert wurde; das Bild drückt äußerste Erniedrigung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים לְמַעֲדַנִּים
  choice: die früher Köstlichkeiten aßen
  rationale: Das substantivierte Partizip bezeichnet Menschen, deren bisherige Gewohnheit im scharfen Gegensatz zu ihrer jetzigen Not steht. „Früher“ macht diesen im Kontext vorausgesetzten Umschwung im Deutschen natürlich deutlich.
- source_word: נָשַׁמּוּ
  choice: sind nun … verelendet
  rationale: Das Verb bezeichnet einen Zustand der Verödung oder Verwüstung und kann auch Bestürzung anklingen lassen. Auf Menschen bezogen gibt „verelendet“ die erschütternde Verwüstung ihrer Lebenslage idiomatisch wieder, ohne sie allein auf körperliches Verhungern zu verengen.
- source_word: בַּחוּצוֹת
  choice: auf den Straßen
  rationale: Das Wort bezeichnet die öffentlichen Bereiche der Stadt; „auf den Straßen“ ist im Deutschen die natürliche und anschauliche Wiedergabe.
- source_word: הָאֱמֻנִים
  choice: die … großgezogen wurden
  rationale: Das passive Partizip von אמן spricht hier vom Aufziehen und behüteten Heranwachsen, nicht von moralischer Treue.
- source_word: עֲלֵי תוֹלָע
  choice: auf Scharlachstoffen
  rationale: תּוֹלָע bezeichnet metonymisch den kostbaren, mit Kermes gefärbten scharlachroten Stoff. Der Plural „Scharlachstoffe“ verdeutlicht, dass luxuriöse Textilien und nicht bloß eine Farbe gemeint sind, während die Präposition „auf“ erhalten bleibt.
- source_word: חִבְּקוּ
  choice: umklammern
  rationale: Das konkrete Verb bedeutet „umarmen“. „Umklammern“ bewahrt das körperliche Bild und wirkt bei Abfallhaufen im Deutschen eindringlich, ohne die bittere Umkehr zu glätten.
- source_word: אַשְׁפַּתּוֹת
  choice: Abfallhaufen
  rationale: Der Ausdruck bezeichnet Ablageplätze für Abfall und kann je nach Beschaffenheit Aschen- oder Misthaufen meinen. „Abfallhaufen“ bildet den Oberbegriff ab; die konkreteren Möglichkeiten bleiben in der Fußnote erhalten.
