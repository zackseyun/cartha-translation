  text: בְּנֵ֤י צִיּוֹן֙ הַ/יְקָרִ֔ים הַ/מְסֻלָּאִ֖ים בַּ/פָּ֑ז אֵיכָ֤ה נֶחְשְׁבוּ֙ לְ/נִבְלֵי חֶ֔רֶשׂ מַעֲשֵׂ֖ה יְדֵ֥י יוֹצֵֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: de
  text: Die kostbaren Söhne Zions[a], mit Feingold aufgewogen – wie werden sie zu Tongefäßen[b] gerechnet, zu einem Werk der Hände eines Töpfers!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Söhne Zions, die Feingold wert sind“, „die mit Feingold vergleichbar sind“ oder „die wie Feingold geschätzt werden“. Der hebräische Ausdruck kann eher die Wertschätzung als das konkrete Wiegen betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „irdenen Krügen“ oder „Gefäßen aus Ton“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: die Söhne Zions
  rationale: Die wörtliche, poetische Formulierung bewahrt das maskuline בְּנֵי; im Zusammenhang können damit die Bewohner Zions insgesamt gemeint sein.
- source_word: הַיְקָרִים
  choice: die kostbaren
  rationale: „Kostbar“ gibt sowohl den hohen Wert als auch den emotionalen Ton der Klage wieder.
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: mit Feingold aufgewogen
  rationale: Die Wendung bewahrt das mögliche konkrete Bild des Wiegens beziehungsweise Aufwiegens, ohne die ebenfalls mögliche Bedeutung einer bloßen Wertschätzung auszuschließen.
- source_word: פָּז
  choice: Feingold
  rationale: „Feingold“ bezeichnet hochwertiges, reines Gold und passt zum gehobenen poetischen Register.
- source_word: אֵיכָה
  choice: wie
  rationale: „Wie“ bringt den klagenden Ausruf des hebräischen Textes knapp und würdig zum Ausdruck.
- source_word: נֶחְשְׁבוּ
  choice: sind ... gleichgeachtet
  rationale: Die Form bezeichnet ein Angesehen- oder Gerechnetwerden; „gleichgeachtet“ bewahrt den Vergleich und den wertenden Gegensatz zum Gold.
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: irdenen Krügen
  rationale: „Irden“ bezeichnet Gefäße aus gebranntem Ton; „Krüge“ ist konkret und bewahrt den scharfen Gegensatz zwischen Gold und gewöhnlicher Töpferware.
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: dem Werk der Hände eines Töpfers
  rationale: Die Formulierung erhält die konkrete hebräische Erwähnung der Hände und bezeichnet die Gefäße ausdrücklich als Töpferarbeit.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Satzstellung und der Gedankenstrich erhalten den klagenden Kontrast des Hebräischen; das abschließende Ausrufezeichen macht den durch אֵיכָה eröffneten Klageruf im Deutschen erkennbar.
