  text: חָשַׁ֤ךְ מִ/שְּׁחוֹר֙ תָּֽאֳרָ֔/ם לֹ֥א נִכְּר֖וּ בַּ/חוּצ֑וֹת צָפַ֤ד עוֹרָ/ם֙ עַל עַצְמָ֔/ם יָבֵ֖שׁ הָיָ֥ה כָ/עֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: de
  text: Ihr Aussehen ist dunkler als Ruß[a]; auf den Straßen erkennt man sie nicht. Ihre Haut ist über ihren Knochen zusammengeschrumpft[b]; sie ist trocken geworden wie Holz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dunkler als Schwärze«. Das hebräische Wort kann allgemein Schwärze bezeichnen; »Ruß« gibt das Bild konkret wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ihre Haut klebt an ihren Knochen.« Das hebräische Verb kann so verstanden werden, dass sich die Haut eng über den Knochen zusammenzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר
  choice: ist dunkler als Ruß
  rationale: Das Qal-Perfekt beschreibt hier den eingetretenen dunklen Zustand; das komparative מִן wird mit „dunkler als“ wiedergegeben. „Ruß“ bietet ein konkretes, im Deutschen natürliches Bild, während die allgemeinere Bedeutung „Schwärze“ in der Fußnote erhalten bleibt.
- source_word: תָּאֳרָם
  choice: ihr Aussehen
  rationale: תֹּאַר bezeichnet die sichtbare Gestalt beziehungsweise Erscheinung. „Aussehen“ ist modern, verständlich und passt zum folgenden Nichterkennen.
- source_word: לֹא נִכְּרוּ בַּחוּצוֹת
  choice: auf den Straßen erkennt man sie nicht
  rationale: Die unpersönliche aktive Formulierung gibt den passiven Sinn des Niphal idiomatisch wieder. חוּצוֹת sind hier die Straßen beziehungsweise öffentlichen Bereiche der Stadt.
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  choice: ihre Haut ist über ihren Knochen zusammengeschrumpft
  rationale: צָפַד beschreibt das Zusammenziehen beziehungsweise Schrumpfen der Haut infolge der Auszehrung. „Über ihren Knochen“ bewahrt das räumliche Bild von עַל, ohne das mögliche enge Anliegen der Haut auszuschließen.
- source_word: יָבֵשׁ הָיָה כָעֵץ
  choice: sie ist trocken geworden wie Holz
  rationale: Das feminine Pronomen bezieht sich im Deutschen sinngemäß auf „Haut“. Die Zustandsveränderung wird mit „trocken geworden“ ausgedrückt; עֵץ bezeichnet im Vergleich am natürlichsten trockenes, lebloses Holz.
