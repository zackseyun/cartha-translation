  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: de
  text: Zu Ende ist deine Strafe[a], Tochter Zion; er wird dich nicht noch einmal in die Verbannung führen. Er hat deine Schuld geahndet[b], Tochter Edom; er hat deine Sünden aufgedeckt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zu Ende ist deine Schuld« oder »Zu Ende ist deine Verfehlung«. Das hebräische Wort kann eine Verfehlung, die daraus erwachsende Schuld oder deren Strafe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Er hat deine Schuld heimgesucht«; gemeint ist, dass er sie im Gericht zur Rechenschaft gezogen hat.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »offengelegt« beziehungsweise »enthüllt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם
  choice: ist zu Ende
  rationale: Das Qal-Perfekt bezeichnet das Vollendet- oder Zu-Ende-Sein. Die vorangestellte Wendung wahrt den poetischen Nachdruck des Hebräischen und klingt zugleich natürlich.
- source_word: עֲוֺנֵךְ (erste Stelle)
  choice: deine Strafe
  rationale: עָוֹן kann Verfehlung, Schuld oder die daraus folgende Strafe bezeichnen. Der anschließende Hinweis auf das Ende der Verbannung legt hier die Bedeutungsnuance »Strafe« nahe.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die personifizierende Anrede der Stadt und ihres Volkes bleibt erhalten, statt sie erklärend aufzulösen.
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: er wird dich nicht noch einmal in die Verbannung führen
  rationale: יסף mit Infinitiv bezeichnet die Wiederholung oder Fortsetzung einer Handlung. »Nicht noch einmal« gibt diese Bedeutung idiomatisch wieder; »in die Verbannung führen« macht das Exil ausdrücklich.
- source_word: פָּקַד עֲוֺנֵךְ
  choice: er hat deine Schuld geahndet
  rationale: פקד hat ein breites Bedeutungsspektrum. Im Gerichtszusammenhang bezeichnet es das Einschreiten gegen Schuld beziehungsweise deren Ahndung.
- source_word: בַּת אֱדוֹם
  choice: Tochter Edom
  rationale: Wie bei Zion bleibt die poetische Personifikation des Landes und Volkes bewahrt.
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: er hat deine Sünden aufgedeckt
  rationale: Das Piel von גלה bedeutet hier aufdecken oder offenlegen. »Aufgedeckt« bewahrt das Bild der Bloßlegung; die Präposition עַל wird im Deutschen idiomatisch nicht eigens wiedergegeben.
- source_word: חַטֹּאתָיִךְ
  choice: deine Sünden
  rationale: Die Pluralform bezeichnet Sünden beziehungsweise Verfehlungen; »Sünden« ist die klare und direkte Wiedergabe.
theological_decisions:
- issue: Bedeutung von עָוֹן in der ersten Vershälfte
  choice: Als »Strafe« wiedergegeben
  alternative: »Schuld« oder »Verfehlung«
  rationale: Der folgende Satz deutet das Ende der Verbannung an und stützt daher die konsekutive Bedeutung »Strafe«. Die lexikalische Mehrdeutigkeit wird in einer Fußnote offengelegt.
- issue: Nicht ausdrücklich genannter Handelnder bei יוֹסִיף, פָּקַד und גִּלָּה
  choice: Mit dem Pronomen »er« wiedergegeben
  alternative: Den Handelnden ausdrücklich als »der HERR« benennen
  rationale: Der göttliche Handelnde ist aus dem Zusammenhang erschließbar, wird in diesem Vers jedoch nicht ausdrücklich genannt. Das Pronomen wahrt diese Zurückhaltung des hebräischen Textes.
- issue: Gerichtsaussage über Edom
  choice: »Er hat deine Schuld geahndet«
  alternative: 'Wörtlicher: »Er hat deine Schuld heimgesucht« beziehungsweise »Er hat sich deiner Schuld angenommen«'
  rationale: Die Wiedergabe bringt den gerichtlichen Sinn von פקד verständlich zum Ausdruck, ohne zusätzliche Angaben über Art oder Umfang des Gerichts einzuführen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper poetischer Satzstellung. Die traditionellen Personifikationen »Tochter Zion« und »Tochter Edom« bleiben erhalten. Veraltete Gerichtssprache wird im Haupttext vermieden und nur zur Erläuterung in der Fußnote genannt.
