  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: de
  text: Sie verfolgten unsere Schritte[a], sodass wir nicht durch unsere Straßen gehen konnten. Unser Ende rückte näher[c]; unsere Tage waren erfüllt[b], denn unser Ende war gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie spürten unsere Schritte auf“ oder: „Sie lauerten auf unsere Schritte.“ Das hebräische Verb bezeichnet feindliches Verfolgen oder Nachstellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Unsere Tage waren voll.“ Gemeint ist, dass die zugemessene Zeit vollständig abgelaufen war.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „Unser Untergang rückte näher.“ Das hebräische Wort bedeutet „Ende“ und bezeichnet hier im Zusammenhang den drohenden Untergang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוּ
  choice: sie verfolgten
  rationale: Das Verb bezeichnet hier feindliches Nachstellen oder Jagen. „Verfolgten“ klingt im modernen Deutschen natürlich und bewahrt die bedrohliche Bewegung, ohne eine bestimmte Vorgehensweise festzulegen.
- source_word: צְעָדֵינוּ
  choice: unsere Schritte
  rationale: 'Die wörtliche Bildsprache bleibt erhalten: Nicht nur die Personen, sondern jede ihrer Bewegungen steht unter feindlicher Beobachtung und Verfolgung.'
- source_word: מִלֶּכֶת
  choice: sodass wir nicht … gehen konnten
  rationale: Die Verbindung von מִן mit dem Infinitiv drückt hier Verhinderung aus. Der deutsche Folgesatz gibt diesen Sinn klar und idiomatisch wieder.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: durch unsere Straßen
  rationale: רְחֹבוֹת kann breite Straßen, Plätze oder öffentliche Freiräume einer Stadt bezeichnen. „Straßen“ passt zum städtischen Zusammenhang; „durch“ entspricht dem deutschen Sprachgebrauch bei einer Bewegung innerhalb dieses Raums.
- source_word: קָרַב קִצֵּינוּ
  choice: Unser Ende rückte näher
  rationale: Die Wiedergabe bewahrt sowohl die Grundbedeutung „Ende“ als auch die bedrohliche Annäherung.
- source_word: מָלְאוּ יָמֵינוּ
  choice: unsere Tage waren erfüllt
  rationale: Die Formulierung hält sich eng an das hebräische Bild von voll gewordenen Tagen und vermittelt zugleich, dass die zugemessene Zeit abgelaufen war.
- source_word: כִּי בָא קִצֵּינוּ
  choice: denn unser Ende war gekommen
  rationale: כִּי begründet die vorherige Aussage. Die Wiederholung von „unser Ende“ bildet die Wiederholung von קִצֵּינוּ im Hebräischen ab.
theological_decisions:
- issue: Bedeutung von קֵץ im Gerichtskontext
  choice: Ende
  alternative: Untergang
  rationale: „Ende“ entspricht dem Grundsinn und bewahrt die Offenheit des Ausdrucks; der Zusammenhang lässt die Bedeutung des drohenden Untergangs erkennen, ohne sie ausdrücklich in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „unser Ende“ und das konkrete Bild der verfolgten „Schritte“ bleiben erhalten; die verhindernde Funktion der hebräischen Konstruktion wird in einem natürlichen deutschen Folgesatz ausgedrückt.
