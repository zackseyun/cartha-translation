source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: de
  text: 'Der Hauch unseres Lebens[a], der Gesalbte Jahwes, wurde in ihren Gruben[b] gefangen genommen – er, von dem wir sagten: »In seinem Schatten werden wir unter den Völkern leben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Atem unserer Nasenlöcher«.'
    reason: Die hebräische Wendung ist eine Körpermetapher für den lebensnotwendigen Atem bzw. das Leben.
  - marker: b
    text: 'Oder: »in ihren Fallen« oder »in ihren Schlingen«.'
    reason: Das hebräische Wort kann sowohl Gruben als auch zerstörerische Fallen bzw. Schlingen bezeichnen.
lexical_decisions:
- source_word: רוּחַ אַפֵּינוּ
  choice: der Atem unserer Nasen
  rationale: Die konkrete hebräische Körpermetapher wird bewahrt. רוּחַ bezeichnet hier den Lebensatem, während אַפֵּינוּ wörtlich auf die Nasen bzw. Nasenlöcher verweist; eine Wiedergabe als „unser Leben“ würde das Bild auflösen.
- source_word: מְשִׁיחַ יְהוָה
  choice: der Gesalbte Jahwes
  rationale: מְשִׁיחַ bezeichnet den gesalbten König. „Der Gesalbte Jahwes“ erhält den königlich-theologischen Titel, ohne den Vers unmittelbar als Aussage über den endzeitlichen Messias festzulegen.
- source_word: נִלְכַּד
  choice: wurde … gefangen
  rationale: Das Nifal bezeichnet das Gefangen- oder Ergriffenwerden und passt zum Untergang des Königs im militärisch-politischen Zusammenhang.
- source_word: בִּשְׁחִיתוֹתָם
  choice: in ihren Gruben
  rationale: Das Substantiv kann Gruben sowie zum Verderben dienende Fallen bezeichnen. „Gruben“ bewahrt das konkrete Bild; weitere mögliche Bedeutungen stehen in der Fußnote.
- source_word: אֲשֶׁר אָמַרְנוּ
  choice: er, von dem wir sagten
  rationale: Die Formulierung macht den Rückbezug des Relativsatzes auf den Gesalbten im Deutschen klar und bleibt nah an der hebräischen Syntax.
- source_word: בְּצִלּוֹ
  choice: in seinem Schatten
  rationale: Die Schutzmetapher wird nicht erklärend zu „unter seinem Schutz“ aufgelöst.
- source_word: נִחְיֶה
  choice: werden wir … leben
  rationale: Die direkte Bedeutung „leben“ bleibt erhalten; der Kontext kann zugleich Überleben und gesichertes Dasein einschließen.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier die fremden Nationen, unter denen Juda zu leben hoffte. „Völker“ ist im Deutschen natürlich und vermeidet eine neutestamentlich gefärbte Wiedergabe wie „Heiden“.
theological_decisions:
- issue: Bezeichnet מְשִׁיחַ יְהוָה hier unmittelbar den endzeitlichen Messias?
  choice: „der Gesalbte Jahwes“ als Bezeichnung des historischen davidischen Königs
  alternative: „der Messias Jahwes“
  rationale: Der unmittelbare Zusammenhang handelt vom gefangenen König Judas. Die Übersetzung erhält den bedeutungsvollen Titel „Gesalbter“, macht daraus aber keine ausdrückliche messianische Weissagung und lässt weiterführende kanonische Bezüge offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten poetischen Bildern. Der Gedankenstrich hebt den nachgestellten Relativsatz hervor. Die ungewöhnliche Wendung „Atem unserer Nasen“ ist bewusst bildnah; „Lebensatem“ wäre geläufiger, würde jedoch die Körpermetapher abschwächen.
