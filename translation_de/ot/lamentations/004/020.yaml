  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Bilder des Hebräischen insgesamt zutreffend wieder: Der Gesalbte JHWHs wird als lebensnotwendig für das Volk beschrieben, gefangen in den Gruben/Fallen der Gegner; die Hoffnung auf Leben unter den Völkern steht unter seinem Schatten. „Atem unserer Nasen“ ist jedoch im modernen Deutschen keine natürliche Genitivverbindung und kann unbeabsichtigt komisch wirken. Der idiomatische Sinn des hebräischen Ausdrucks wird mit „Hauch unseres Lebens“ angemessen wiedergegeben; die wörtliche Körpermetapher wird in einer Fußnote gesichert.'
