base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: de
  text: Noch immer verzehrten sich unsere Augen, als wir vergeblich nach Hilfe Ausschau hielten; in unserem Warten warteten wir auf eine Nation, die nicht retten konnte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In unserem Warten warteten wir auf eine Nation, die nicht rettete.“ Das hebräische Verb kann ein erwartungsvolles Ausschauen oder Warten bezeichnen; der letzte Satzteil kann entweder Unfähigkeit oder das tatsächliche Ausbleiben der Rettung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: Noch immer
  rationale: Die Wendung bezeichnet das Fortdauern eines Zustands. „Noch immer“ gibt diese anhaltende, quälende Erwartung natürlich wieder.
- source_word: תִּכְלֶינָה עֵינֵינוּ
  choice: verzehrten sich unsere Augen
  rationale: כלה beschreibt hier Augen, die durch langes, vergebliches Warten erschöpft werden. Die deutsche Wendung bewahrt das kräftige poetische Bild.
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: als wir vergeblich nach Hilfe Ausschau hielten
  rationale: Die hebräische Fügung ist stark verdichtet. „Vergeblich“ gibt הבל in seiner Aussage von Nichtigkeit und Nutzlosigkeit wieder; „nach Hilfe Ausschau hielten“ wahrt die Blickrichtung von אֶל und verbindet sie mit dem Bild der Augen.
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: in unserem Warten warteten wir
  rationale: Die Wiederholung „Warten/warteten“ bildet die hebräische figura etymologica nach und bleibt im Deutschen verständlich und feierlich. Das erwartungsvolle Ausschauen ist bereits im vorangehenden Satzteil ausdrücklich enthalten.
- source_word: גּוֹי
  choice: ein Volk
  rationale: גּוֹי bezeichnet hier eine auswärtige politische Macht. „Volk“ ist im Deutschen natürlich und lässt die politische Bedeutung im Kontext offen.
- source_word: לֹא יוֹשִׁעַ
  choice: das nicht retten konnte
  rationale: Die Form bezeichnet das Ausbleiben von Rettung. Im Rückblick des Klagelieds bringt „nicht retten konnte“ die praktische Unfähigkeit der erhofften auswärtigen Macht zum Ausdruck, ohne den Grund näher festzulegen.
theological_decisions:
- issue: Unfähigkeit oder tatsächliches Ausbleiben der Rettung in לֹא יוֹשִׁעַ
  choice: das nicht retten konnte
  alternative: das nicht rettete
  rationale: Der Haupttext folgt der modalen Deutung, die im Zusammenhang die Untauglichkeit der erhofften politischen Hilfe betont. Da die hebräische Form ebenso als Feststellung des tatsächlichen Ausbleibens verstanden werden kann, wird die Alternative in der Fußnote bewahrt.
