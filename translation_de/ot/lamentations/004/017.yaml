  register: Moderne, würdige Klagesprache mit bewahrtem Augenbild und hörbarer hebräischer Wortwiederholung. Die verdichtete Syntax wird behutsam entfaltet, ohne die Mehrdeutigkeit des Schlusses zu beseitigen.
