  text: זַכּ֤וּ נְזִירֶ֨י/הָ֙ מִ/שֶּׁ֔לֶג צַח֖וּ מֵ/חָלָ֑ב אָ֤דְמוּ עֶ֨צֶם֙ מִ/פְּנִינִ֔ים סַפִּ֖יר גִּזְרָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: de
  text: Ihre Geweihten[a] waren reiner als Schnee, weißer als Milch; ihre Körper waren röter als Korallen[b], ihre Gestalt war wie Saphir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Nasiräer“; möglicherweise sind hier auch Jerusalems Vornehme oder Fürsten gemeint. Das hebräische Wort bezeichnet Menschen, die abgesondert oder geweiht sind.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet einen kostbaren Stoff, ist aber nicht eindeutig; möglich sind auch Rubine, Perlen oder ein anderer rötlicher Edelstoff.
    reason: lexical_alternative
  - marker: c
    text: Mit dem antiken „Saphir“ kann Lapislazuli gemeint sein, nicht unbedingt der heute so bezeichnete Edelstein.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: ihre Geweihten
  rationale: Das Substantiv bezeichnet zunächst Menschen, die abgesondert oder geweiht sind, besonders Nasiräer. Im Zusammenhang können damit auch Jerusalems herausgehobene Würdenträger gemeint sein; „Geweihte“ wahrt die Grundbedeutung, ohne die umstrittene soziale Zuordnung im Haupttext festzulegen.
- source_word: זַכּוּ
  choice: waren reiner
  rationale: Das Verb bezeichnet Reinheit oder Lauterkeit; mit מִן und „Schnee“ liegt ein poetischer Vergleich vor.
- source_word: צַחוּ
  choice: weiß(er)
  rationale: Das Verb kann hell, glänzend oder weiß sein. Im Vergleich mit Milch gibt „weißer“ das Bild natürlich wieder.
- source_word: עֶצֶם
  choice: ihr Leib
  rationale: Obwohl das Wort gewöhnlich „Knochen“ bedeutet, kann es poetisch die leibliche Substanz oder den Körperbau bezeichnen. Der kollektive Singular des Hebräischen wird beibehalten.
- source_word: פְּנִינִים
  choice: Korallen
  rationale: Der genaue Edelstoff ist unsicher. Wegen des unmittelbar vorausgehenden Verbs „rot sein“ sind rote Korallen hier eine plausible Wiedergabe; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: גִּזְרָתָם
  choice: ihre Gestalt
  rationale: Das Wort bezeichnet Form, Gestalt oder Umriss. „Gestalt“ bewahrt die knappe poetische Aussage.
- source_word: סַפִּיר
  choice: Saphir
  rationale: Die traditionelle Edelsteinbezeichnung bleibt im Haupttext erhalten; wahrscheinlich konnte das antike Wort auch Lapislazuli bezeichnen.
theological_decisions:
- issue: Identität der mit נְזִירֶיהָ bezeichneten Menschen
  choice: Geweihte
  alternative: Nasiräer; Vornehme oder Fürsten
  rationale: Der Text lässt offen, ob kultisch durch ein Gelübde Abgesonderte oder im weiteren Sinn herausgehobene Angehörige der Jerusalemer Oberschicht gemeint sind. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Knappe, würdige Bildsprache mit parallelen Steigerungsvergleichen. „Geweihte“ wahrt die lexikalische Offenheit; „ihr Leib“ und „ihre Gestalt“ ergeben im modernen Deutsch ein verständliches körperliches Porträt, ohne die poetische Fremdheit völlig zu glätten.
