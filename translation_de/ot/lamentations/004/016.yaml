source:
  edition: WLC
  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: de
  text: Das Angesicht Jahwes hat sie zerstreut[a]; Jahwe wird sie nicht länger ansehen. Sie achteten die Priester nicht[b] und erwiesen den Ältesten keine Gnade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Gegenwart Jahwes hat sie verteilt/zerstreut.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Sie erhoben das Angesicht der Priester nicht«; eine Wendung dafür, jemandem keine Achtung oder Gunst zu erweisen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Sie hatten kein Erbarmen mit den Ältesten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: das Angesicht Jahwes
  rationale: פְּנֵי bedeutet wörtlich »Angesicht«, kann aber auch die Gegenwart bezeichnen. »Angesicht« bewahrt das konkrete poetische und anthropomorphe Bild des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: חִלְּקָם
  choice: hat sie zerstreut
  rationale: Das Piel von חלק kann »teilen«, »verteilen« oder im Zusammenhang einer Vertreibung »zerstreuen« bedeuten. Der Kontext des Gerichts legt hier »zerstreut« nahe.
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: wird sie nicht länger ansehen
  rationale: יסף mit Infinitiv und Verneinung bedeutet »nicht weiter/nicht länger«, während נבט das Ansehen oder Hinblicken bezeichnet. Die Formulierung bleibt nahe am Bild, ohne dessen Beziehungs- oder Gerichtsdimension auszudeuten.
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: Sie achteten die Priester nicht
  rationale: Die Wendung נשא פנים, wörtlich »das Angesicht erheben«, bezeichnet das Erweisen von Achtung, Rücksicht oder Gunst. »achten« gibt den idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: זקנים
  choice: Älteste
  rationale: זקנים kann alte Menschen oder die Ältesten einer Gemeinschaft bezeichnen. In der Parallele zu den Priestern ist die gesellschaftliche Gruppe der Ältesten wahrscheinlich, ohne dass der Altersaspekt ausgeschlossen wird.
- source_word: לֹא חָנָנוּ
  choice: erwiesen ... keine Gnade
  rationale: חנן umfasst gnädiges, wohlwollendes oder barmherziges Handeln. »keine Gnade erweisen« wahrt die zentrale Wortbedeutung und den Parallelismus.
theological_decisions:
- issue: Anthropomorphe Rede vom göttlichen Handeln
  choice: »Das Angesicht Jahwes« wird als konkretes Bild beibehalten.
  alternative: »Die Gegenwart Jahwes« oder schlicht »Jahwe«
  rationale: Das Hebräische verwendet bewusst die anschauliche Rede vom Angesicht. Ihre Beibehaltung erhält die poetische Kraft, ohne daraus eine Aussage über eine körperliche Gestalt Gottes abzuleiten.
- issue: Nicht ausdrücklich genanntes Subjekt in den letzten beiden Teilsätzen
  choice: Das im Hebräischen enthaltene unbestimmte »sie« bleibt stehen.
  alternative: Die handelnde Gruppe ausdrücklich als Feinde, Fremde oder Völker bestimmen
  rationale: Der Vers selbst benennt das Subjekt der Pluralverben nicht ausdrücklich. Eine nähere Identifizierung würde eine kontextuelle Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Bildsprache wird bewahrt, während die hebräische Redewendung über das Erheben des Angesichts im Haupttext idiomatisch wiedergegeben wird. Die Satzstruktur bleibt knapp und klagend.
