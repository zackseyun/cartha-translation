  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: de
  text: Die Zunge des Säuglings klebt vor Durst an seinem Gaumen[a]. Kleine Kinder bitten um Brot, doch niemand bricht ihnen Brot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seinem Munddach“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Es ist keiner für sie, der [Brot] bricht.“ Gemeint ist, dass niemand ihnen Brot bricht oder austeilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  choice: klebt
  rationale: Das Verb bezeichnet festes Haften; „klebt“ gibt das körperliche Bild knapp und unmittelbar wieder.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die direkte Körperteilbezeichnung ist auch im Deutschen natürlich und präzise.
- source_word: יוֹנֵק
  choice: Säuglings
  rationale: Das Wort bezeichnet ein noch gestilltes Kind; „Säugling“ ist modern, verständlich und bewahrt die besondere Hilflosigkeit.
- source_word: אֶל חכּוֹ
  choice: an seinem Gaumen
  rationale: חֵךְ bezeichnet den Gaumen beziehungsweise die obere Mundhöhle; „Gaumen“ ist im Deutschen die natürliche anatomische Bezeichnung.
- source_word: בַּצָּמָא
  choice: vor Durst
  rationale: Die Präposition bezeichnet hier Ursache oder Begleitumstand; die feste deutsche Wendung „vor Durst“ drückt den kausalen Sinn anschaulich aus.
- source_word: עוֹלָלִים
  choice: Kleine Kinder
  rationale: Das Substantiv bezeichnet kleine beziehungsweise junge Kinder; die nähere Bestimmung erhält diese Altersnuance.
- source_word: שָׁאֲלוּ
  choice: bitten um
  rationale: Das Verb bedeutet grundsätzlich „fragen/bitten“; mit Brot als Gegenstand ist „um Brot bitten“ idiomatisch, ohne die Intensität ausdrücklich zu „betteln“ zu steigern.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Speisebezeichnung wird beibehalten und nicht zum allgemeineren „Nahrung“ erweitert.
- source_word: פֹּרֵשׂ
  choice: bricht es
  rationale: Das Partizip bezeichnet im Kontext das Brechen und damit Austeilen von Brot; „bricht es ihnen“ wahrt das konkrete Bild und die knappe Ellipse.
- source_word: אֵין לָהֶם
  choice: niemand ... ihnen
  rationale: Die hebräische Existenzverneinung mit dem Partizip wird im Deutschen natürlich als „niemand“ mit finitem Verb ausgedrückt.
