source:
  edition: WLC
  text: מֵֽ/חַטֹּ֣את נְבִיאֶ֔י/הָ עֲוֺנ֖וֹת כֹּהֲנֶ֑י/הָ הַ/שֹּׁפְכִ֥ים בְּ/קִרְבָּ֖/הּ דַּ֥ם צַדִּיקִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: de
  text: Wegen der Sünden ihrer Propheten, der Vergehen ihrer Priester, die mitten in ihr das Blut der Gerechten vergossen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blut Unschuldiger vergossen“. Das hebräische Wort bezeichnet wörtlich „Gerechte“, kann hier aber besonders ihre Unschuld gegenüber dem erlittenen Blutvergießen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: Wegen der Sünden
  rationale: Die Präposition מִן bezeichnet hier im Zusammenhang am natürlichsten die Ursache. „Wegen“ gibt diesen kausalen Sinn im Deutschen klar wieder.
- source_word: נְבִיאֶיהָ
  choice: ihrer Propheten
  rationale: Die Form enthält ein Suffix der 3. Person Singular feminin, das sich auf die als weiblich gedachte Stadt bezieht.
- source_word: עֲוֺנוֹת
  choice: der Vergehen
  rationale: עָוֹן bezeichnet schuldhaftes Unrecht und kann sowohl Tat als auch Schuld umfassen. „Vergehen“ unterscheidet den Ausdruck von חַטֹּאת, ohne ihn unnötig dogmatisch festzulegen.
- source_word: כֹּהֲנֶיהָ
  choice: ihrer Priester
  rationale: Direkte Wiedergabe des Nomens mit dem auf die Stadt bezogenen femininen Suffix.
- source_word: הַשֹּׁפְכִים
  choice: die … vergossen
  rationale: Das Partizip kennzeichnet die Propheten und Priester als Täter. Bei דָּם ist „Blut vergießen“ im Deutschen zugleich idiomatisch und bildtreu.
- source_word: בְּקִרְבָּהּ
  choice: mitten in ihr
  rationale: Die Form bezeichnet das Innere der Stadt; „mitten in ihr“ bewahrt die räumliche Vorstellung und den femininen Bezug.
- source_word: דַּם
  choice: das Blut
  rationale: Direktes Objekt des Partizips; die feste deutsche Verbindung lautet „Blut vergießen“.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Die substantivierte Bezeichnung bewahrt die moralisch-theologische Kategorie des Hebräischen und verengt sie nicht auf bloße juristische Unschuld.
theological_decisions:
- issue: Ob צַדִּיקִים als umfassende moralische Bezeichnung oder lediglich als juristische Unschuld wiederzugeben ist
  choice: der Gerechten
  alternative: der Unschuldigen
  rationale: „Der Gerechten“ erhält den weiteren ethischen und möglicherweise bundestheologischen Gehalt des hebräischen Ausdrucks. „Der Unschuldigen“ ist im Kontext möglich, wäre aber enger und deutender.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wie im Hebräischen und im unmittelbaren Kontext fragmentarisch beziehungsweise an den vorausgehenden Vers gebunden; der abschließende Punkt dient der deutschen Versdarstellung.
