source:
  edition: WLC
  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: de
  text: Denn die Schuld der Tochter meines Volkes ist größer geworden als die Sünde Sodoms[a], das in einem Augenblick umgestürzt wurde, und keine Hände mühten sich an ihm ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn die Schuld der Tochter meines Volkes ist größer als die Schuld Sodoms.« Das hebräische Wort kann die Verfehlung, die daraus entstehende Schuld oder auch deren Strafe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlussklausel ist im Hebräischen schwierig. Sie kann auch etwa bedeuten: »und keine Hände rangen um es« oder »und keine Hände kamen über es«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: ist größer geworden
  rationale: Die Form von גדל bezeichnet ein Groß- beziehungsweise Größerwerden. Die Wiedergabe bewahrt den verbalen Vorgang und den ausdrücklich vergleichenden Sinn.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Strafe bezeichnen. Im Vergleich mit der Sünde Sodoms liegt hier der moralische Sinn nahe; „Schuld“ hält zugleich die Verbindung von Tat und Verantwortlichkeit offen.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die personifizierende Klageformel für Jerusalem beziehungsweise Juda wird als Bild bewahrt und nicht erklärend aufgelöst.
- source_word: מֵחַטַּאת סְדֹם
  choice: als die Sünde Sodoms
  rationale: מִן markiert den Vergleich; חַטָּאת bezeichnet hier im Kontext am natürlichsten die Sünde Sodoms.
- source_word: הַהֲפוּכָה
  choice: das … umgestürzt wurde
  rationale: Die passive Form erinnert an den Untergang Sodoms in Genesis. „Umgestürzt“ bewahrt diese sprachliche und intertextuelle Verbindung besser als das allgemeinere „zerstört“.
- source_word: כְמוֹ רָגַע
  choice: in einem Augenblick
  rationale: Die Wendung drückt die Plötzlichkeit des Untergangs aus und wird idiomatisch, aber eng am zeitlichen Sinn wiedergegeben.
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: ohne dass Hände sich gegen es mühten
  rationale: Die schwierige, verdichtete Klausel wird zurückhaltend als fehlende länger dauernde menschliche Einwirkung verstanden. Die ungewöhnliche Rede von „Händen“ bleibt erhalten; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von עָוֹן im Vergleich mit Sodom
  choice: moralische Schuld beziehungsweise Verfehlung
  alternative: Strafe für die Schuld
  rationale: Der unmittelbare Vergleich mit חַטַּאת „Sünde“ spricht eher für einen moralischen Vergleich. Da עָוֹן jedoch auch die Folge oder Strafe der Schuld bezeichnen kann, wird diese Möglichkeit in der Fußnote offengehalten.
- issue: Deutung der Schlussklausel
  choice: Sodom wurde plötzlich und ohne länger dauernde menschliche Einwirkung umgestürzt
  alternative: Keine Hände wurden über ihm gerungen; keine Hände kamen über es
  rationale: Der hebräische Wortlaut ist knapp und mehrdeutig. Die gewählte Fassung lässt den wahrscheinlichen Gegensatz zur langwierigen Verwüstung Jerusalems erkennen, ohne die Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Klagebildlichkeit. Das feminine Suffix im Hebräischen bezieht sich auf die als Stadt gedachte Größe Sodom; im Deutschen verlangt der Ortsname in dieser Konstruktion das Neutrum „das/es“. Die schwer verständliche Schlussklausel bleibt bewusst leicht fremdartig und wird durch eine Fußnote abgesichert.
