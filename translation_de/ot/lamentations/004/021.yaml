  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: de
  text: Freue dich und sei fröhlich, Tochter Edom, die du im Land Uz wohnst! Auch zu dir wird der Becher gelangen[a]; du wirst betrunken werden und dich entblößen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch zu dir wird der Becher kommen.“ Gemeint ist der Becher des Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und bloßgestellt werden“. Das Hebräische bezeichnet hier schmachvolle Nacktheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: Freue dich und sei fröhlich
  rationale: Die beiden femininen Singularimperative werden als verstärkende Parallelformulierung wiedergegeben. Die Aufforderung klingt im Zusammenhang ironisch, doch diese Wirkung wird nicht ausdrücklich in die Übersetzung eingetragen.
- source_word: בַּת אֱדוֹם
  choice: Tochter Edom
  rationale: Bewahrt die prophetische Personifikation Edoms und stimmt mit der femininen Anrede des Verses überein.
- source_word: יֹשַׁבְתִּי בְּאֶרֶץ עוּץ
  choice: die du im Land Uz wohnst
  rationale: Das feminine Partizip wird als natürliche deutsche Relativkonstruktion wiedergegeben; der geografische Name Uz bleibt erhalten.
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: Auch zu dir wird der Becher hinübergehen
  rationale: Das Verb עבר und die Gerichtssymbolik des Bechers bleiben bildhaft erhalten. „Hinübergehen“ macht die Bewegung zu Edom im Deutschen deutlich, ohne sie als bloßes Kommen zu paraphrasieren.
- source_word: תִּשְׁכְּרִי
  choice: du wirst betrunken werden
  rationale: Gibt die eintretende Trunkenheit als Wirkung des Bechers sachlich und würdig wieder.
- source_word: וְתִתְעָרִי
  choice: und dich entblößen
  rationale: Bewahrt die reflexive Form und das Bild schmachvoller Nacktheit, ohne die mögliche Ergebnisnuance des Bloßgestelltwerdens auszuschließen.
theological_decisions:
- issue: Bild des Bechers
  choice: Der Becher und sein Hinübergehen werden als Metapher beibehalten.
  alternative: Auch über dich wird das Gericht kommen.
  rationale: Der Becher ist ein bedeutendes prophetisches Gerichtsbild. Eine erklärende Paraphrase würde die literarische und theologische Bildsprache abschwächen.
- issue: Ironischer Charakter der Freudeaufforderung
  choice: Die Imperative werden ohne erklärenden Zusatz übersetzt.
  alternative: Freue dich nur und sei fröhlich.
  rationale: Der folgende Gerichtsankündigung lässt den spöttisch-ironischen Ton erkennen; ein eingefügtes „nur“ würde diese Deutung stärker festlegen, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-prophetischen Bilder „Tochter Edom“ und „Becher“ bleiben erhalten; Semikolon und Gedankenführung machen den scharfen Umschlag von der Freudeaufforderung zur Gerichtsankündigung deutlich.
