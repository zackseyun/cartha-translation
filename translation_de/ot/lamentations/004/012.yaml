  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: de
  text: Die Könige der Erde glaubten es nicht, und keiner der Bewohner der Welt, dass ein Bedränger und ein Feind durch die Tore Jerusalems eindringen würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Tore Jerusalems kommen würden“. Das hebräische Verb bedeutet „kommen“; im Zusammenhang ist das Eindringen in die Stadt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הֶאֱמִינוּ
  choice: hätten es nicht geglaubt
  rationale: Der Hifil von אמן bezeichnet hier, etwas für glaubhaft zu halten. Der deutsche Konjunktiv II gibt im rückblickenden Klagekontext die als undenkbar empfundene Möglichkeit natürlich wieder.
- source_word: מַלְכֵי אֶרֶץ
  choice: die Könige der Erde
  rationale: Im Parallelismus mit den Bewohnern der Welt ist אֶרֶץ universal und nicht nur als einzelnes Land zu verstehen.
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: auch keiner von allen Bewohnern der Welt
  rationale: Unter der vorausgehenden Verneinung bedeutet die koordinierte Wendung, dass niemand aus der Gesamtheit der Weltbewohner es glaubte; die Formulierung bewahrt zugleich das hebräische כָל.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was nicht geglaubt wurde.
- source_word: יָבֹא
  choice: kommen könnte
  rationale: בוא bedeutet unmittelbar „kommen“. In Verbindung mit den Toren bezeichnet es ein feindliches Gelangen in den Stadtbereich; „könnte“ bringt die empfundene Undenkbarkeit im Deutschen zum Ausdruck, während die Fußnote eine stärker ereignisbezogene Wiedergabe nennt.
- source_word: צַר
  choice: ein Bedränger
  rationale: „Bedränger“ wahrt die Nuance von צַר als jemandem, der bedrängt oder in die Enge treibt, und unterscheidet das Wort von אוֹיֵב.
- source_word: וְאוֹיֵב
  choice: und ein Feind
  rationale: „Feind“ ist die gewöhnliche Bedeutung von אוֹיֵב; das „und“ bewahrt das betonte hebräische Begriffspaar.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: in die Tore Jerusalems
  rationale: Nach einem Bewegungsverb kann ב ingressiv verstanden werden. Die etwas konkrete Formulierung bewahrt das Bild der Tore als Zugang zur Stadt.
theological_decisions: []
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. „Bedränger“ erhält die Unterscheidung der beiden hebräischen Feindbezeichnungen. Der Konjunktiv vermittelt die rückblickend geschilderte Unglaublichkeit, ohne die Aussage dogmatisch auszudeuten.
