  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: de
  text: Die Hände barmherziger Frauen kochten ihre eigenen Kinder[a]; sie wurden ihnen zur Speise im Zusammenbruch der Tochter meines Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »siedeten ihre Kinder«. Das hebräische Verb bezeichnet Kochen, häufig durch Sieden.'
    reason: lexical_alternative
  - marker: b
    text: »Die Tochter meines Volkes« ist eine hebräische poetische Personifikation für mein Volk; im Zusammenhang kann sie besonders Jerusalem/Zion in seiner Verwüstung bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי נָשִׁים רַחֲמָנִיּוֹת
  choice: Die Hände barmherziger Frauen
  rationale: Die konkrete Wendung mit »Hände« bewahrt das erschütternde Bild des Hebräischen. »Barmherzig« gibt die mitfühlende, erbarmende Haltung wieder und hält den beabsichtigten Gegensatz zur folgenden Tat aufrecht.
- source_word: בִּשְּׁלוּ
  choice: kochten
  rationale: Das Verb bezeichnet das Kochen, häufig genauer das Sieden. »Kochten« ist im Deutschen natürlich und lässt die mögliche engere Bedeutung offen.
- source_word: יַלְדֵיהֶן
  choice: ihre eigenen Kinder
  rationale: »Eigenen« hebt idiomatisch die bereits im hebräischen Possessivsuffix enthaltene, für den Schrecken der Aussage entscheidende Beziehung hervor.
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: sie wurden ihnen zur Speise
  rationale: Die Formulierung gibt sowohl den resultierenden Zustand als auch die Bestimmung zur Nahrung wieder. Das gehobene, aber geläufige »zur Speise« passt zum poetischen Klagekontext.
- source_word: בְּשֶׁבֶר
  choice: als … zusammenbrach
  rationale: Das Substantiv bezeichnet Bruch, Zusammenbruch oder Zerstörung. Die verbale deutsche Fassung stellt den katastrophalen Vorgang natürlich dar, ohne ihn näher auszudeuten.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die wörtliche Wiedergabe erhält die prophetisch-poetische Personifikation, statt sie auf eine bloße Bezeichnung Jerusalems oder des Volkes zu reduzieren.
theological_decisions:
- issue: Bewahrung der Personifikation בַּת עַמִּי
  choice: die Tochter meines Volkes
  alternative: mein Volk; Jerusalem
  rationale: Die hebräische Metapher bleibt bestehen, weil sie die Klage literarisch und theologisch prägt. Eine eindeutige Gleichsetzung mit Jerusalem würde die im Ausdruck verbleibende Weite vorschnell auflösen.
- issue: Direktheit der Darstellung des Kannibalismus
  choice: kochten ihre eigenen Kinder; sie wurden ihnen zur Speise
  alternative: bereiteten ihre Kinder als Nahrung zu
  rationale: Der hebräische Text spricht erschreckend direkt. Die Übersetzung darf diese Härte nicht durch eine allgemeinere Umschreibung mildern.
- issue: Bedeutungsumfang von בִּשְּׁלוּ
  choice: kochten
  alternative: siedeten
  rationale: »Siedeten« ist als engere Bedeutung möglich, doch »kochten« wahrt den Bedeutungsumfang des Verbs und vermeidet eine nicht sicher erforderliche Präzisierung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltener poetischer Bildhaftigkeit. Die ungewöhnliche Wendung »Die Hände … kochten« folgt der anschaulichen hebräischen Ausdrucksweise; »zur Speise« trägt dem hohen Klage-Ton Rechnung, ohne altertümlich zu wirken.
