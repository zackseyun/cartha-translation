source:
  edition: WLC
  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: de
  text: Wie ist das Gold matt geworden, wie hat sich das edle Gold verändert! Die heiligen Steine[a] sind am Anfang jeder Straße[b] ausgeschüttet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die geweihten Steine“ oder „die Steine des Heiligtums“. Der hebräische Ausdruck kann sich auf geweihte Tempelsteine oder auf kostbare heilige Steine in bildhafter Sprache beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „am Kopf jeder Straße“; gemeint sein können auch die Straßeneingänge oder Straßenecken.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie
  rationale: Leitet den klagenden Ausruf ein und bewahrt den charakteristischen Ton des Klagelieds.
- source_word: יוּעַם
  choice: ist matt geworden
  rationale: Die Hophal-Form bezeichnet das Dunkel- oder Glanzloswerden. „Matt geworden“ gibt den verlorenen Glanz des Goldes natürlich wieder, ohne ausdrücklich Korrosion vorauszusetzen.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: יִשְׁנֶא
  choice: hat sich verändert
  rationale: Das Verb beschreibt hier eine Veränderung des Zustands oder Erscheinungsbilds und bleibt bewusst allgemein.
- source_word: הַכֶּתֶם הַטּוֹב
  choice: das edle Gold
  rationale: כֶּתֶם bezeichnet kostbares beziehungsweise geläutertes Gold; הַטּוֹב hebt dessen Qualität hervor. „Edles Gold“ ist poetisch, verständlich und unterscheidet die Wendung vom allgemeinen זָהָב.
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: sind … hingeschüttet
  rationale: Die Form vermittelt das Bild des Ausgießens oder Ausschüttens. Das deutsche Resultativ beschreibt anschaulich, dass die Steine ungeordnet auf den Straßen liegen.
- source_word: אַבְנֵי קֹדֶשׁ
  choice: die heiligen Steine
  rationale: Die wörtliche Wiedergabe bewahrt die Mehrdeutigkeit zwischen Tempelsteinen, geweihten kostbaren Steinen und einer möglichen bildlichen Bezeichnung von Menschen.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: am Anfang jeder Straße
  rationale: בְּרֹאשׁ bedeutet wörtlich „am Kopf“ und kann im städtischen Zusammenhang den Anfang, Eingang oder die Ecke einer Straße bezeichnen. Die gewählte Fassung bleibt dem Bild nahe und ist im Deutschen verständlich.
theological_decisions:
- issue: Bezug der „heiligen Steine“
  choice: Die Formulierung wird wörtlich und ohne Festlegung des Bezugs wiedergegeben.
  alternative: Tempelsteine, heilige Edelsteine oder bildlich die kostbaren Bewohner Zions
  rationale: Der hebräische Ausdruck ist poetisch mehrdeutig. Eine ausdrückliche Deutung im Haupttext würde die literarische und theologische Spannung vorwegnehmen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit klagend-poetischem Rhythmus. Die Wiederholung von „wie“ macht den Parallelismus im Deutschen hörbar; die Fußnoten stehen unmittelbar bei den jeweils erklärten Ausdrücken.
