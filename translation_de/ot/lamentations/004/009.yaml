  text: טוֹבִ֤ים הָיוּ֙ חַלְלֵי חֶ֔רֶב מֵֽ/חַלְלֵ֖י רָעָ֑ב שֶׁ֣/הֵ֤ם יָז֨וּבוּ֙ מְדֻקָּרִ֔ים מִ/תְּנוּבֹ֖ת שָׂדָֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: de
  text: 'Den vom Schwert Erschlagenen erging es besser als den vom Hunger Erschlagenen[a]: Sie siechen dahin, durchbohrt aus Mangel an den Erträgen des Feldes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als den vom Hunger Erschlagenen, die dahinsiechen, durchbohrt, weil es keinen Ertrag vom Feld gibt.« Der hebräische Wortlaut dieses Satzteils ist schwierig. Das betrifft besonders das mit »dahinsiechen« wiedergegebene Verb und die Bedeutung der Präposition vor »Erträgen des Feldes«, die auch mit »von« wiedergegeben werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: erging es besser
  rationale: Die idiomatische Vergleichsform bezeichnet hier keine moralische Güte, sondern ein im Verhältnis weniger schlimmes Los.
- source_word: חַלְלֵי חֶרֶב
  choice: die vom Schwert Erschlagenen
  rationale: חָלָל bezeichnet gewöhnlich einen Erschlagenen; »vom Schwert« gibt die instrumentale Bedeutung der Konstruktverbindung natürlich wieder.
- source_word: מֵחַלְלֵי רָעָב
  choice: als die vom Hunger Erschlagenen
  rationale: Das Präfix מִן markiert den Vergleich. »Hunger« bewahrt den unmittelbaren Gegensatz zwischen einem raschen Tod durch das Schwert und dem qualvollen Verhungern.
- source_word: שֶׁהֵם
  choice: Sie
  rationale: Die durch שֶׁהֵם eingeleitete Aussage beschreibt die vom Hunger Getöteten. Ein neuer deutscher Hauptsatz vermeidet einen schwerfälligen Relativsatz, ohne den Bezug zu verändern.
- source_word: יָזוּבוּ
  choice: siechen dahin
  rationale: Das schwierige Verb vermittelt im Zusammenhang ein langsames Vergehen oder Auszehren. »Siechen dahin« ist verständlich und bewahrt den Vorgang des qualvollen Verfalls.
- source_word: מְדֻקָּרִים
  choice: durchbohrt
  rationale: Das passive Partizip von דקר bedeutet wörtlich »durchbohrt«. Die bildhafte Härte bleibt erhalten, ohne sie auf eine konkrete Waffenverletzung festzulegen.
- source_word: מִתְּנוּבֹת שָׂדָי
  choice: aus Mangel an den Erträgen des Feldes
  rationale: 'מִן wird im Kontext privativ beziehungsweise kausal verstanden: Die Menschen vergehen, weil ihnen die Feldfrüchte fehlen. »Erträge des Feldes« gibt תְּנוּבוֹת שָׂדַי natürlich wieder.'
