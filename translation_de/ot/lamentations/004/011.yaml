id: LAM.4.11
reference: Lamentations 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: de
  text: 'Jahwe hat seinen Grimm erschöpft[a],

    er hat seinen glühenden Zorn ausgegossen[b].

    Er entfachte ein Feuer in Zion,

    und es verzehrte ihre Grundfesten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Grimm vollendet“ beziehungsweise „seinen Grimm vollständig aufgebraucht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Glut seines Zorns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: hat … erschöpft
  rationale: Das Verb bezeichnet hier, etwas bis zum Ende zu führen oder vollständig aufzubrauchen. „Erschöpft“ bewahrt die Vorstellung, dass der Grimm sein volles Maß erreicht und sich ganz ausgewirkt hat.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֲמָתוֹ
  choice: seinen Grimm
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm. „Grimm“ ist gewichtig und unterscheidet diesen Ausdruck vom parallelen חֲרוֹן אַפּוֹ.
- source_word: שָׁפַךְ
  choice: ausgegossen
  rationale: Die konkrete Metapher des Ausgießens wird im Deutschen beibehalten.
- source_word: חֲרוֹן אַפּוֹ
  choice: seinen glühenden Zorn
  rationale: Die Wendung enthält das Bild von Hitze beziehungsweise Aufflammen und bezeichnet heftigen Zorn. „Glühender Zorn“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: וַיַּצֶּת אֵשׁ
  choice: Er entfachte ein Feuer
  rationale: Die Formulierung gibt das aktive Anzünden oder Entfachen des Feuers präzise und idiomatisch wieder.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Die Präposition bezeichnet hier den Ort, an dem das Feuer entfacht wird.
- source_word: וַתֹּאכַל
  choice: es verzehrte
  rationale: „Verzehren“ ist eine natürliche deutsche Beschreibung der zerstörerischen Wirkung von Feuer und bewahrt zugleich das bildhafte hebräische Verb „essen“.
- source_word: יְסוֹדֹתֶיהָ
  choice: ihre Grundfesten
  rationale: Das feminine Suffix bezieht sich auf das personifizierte Zion. „Grundfesten“ bringt die tiefsten tragenden Fundamente der Stadt zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Eigennamen Gottes. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Parallele Ausdrücke für den göttlichen Zorn
  choice: „Grimm“ und „glühender Zorn“ als zwei parallele Wendungen bewahren
  alternative: Beide Ausdrücke einheitlich mit „Zorn“ wiedergeben oder zusammenziehen
  rationale: Der hebräische Vers steigert die Gerichtsaussage durch zwei verwandte, aber nicht identische Ausdrücke. Ihre Unterscheidung bewahrt die poetische Intensität, ohne die Spannung zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Zeilenbau. Die Bilder des Ausgießens, der Zornesglut und des verzehrenden Feuers bleiben erhalten; Zion wird durch „ihre“ weiterhin als weiblich personifizierte Stadt dargestellt.
