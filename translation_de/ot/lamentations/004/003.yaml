translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetisch-poetischer Personifikation. Das einleitende „Selbst“ hebt den beschämenden Gegensatz hervor; „Doch“ macht ihn im Deutschen klar, ohne die Aussage inhaltlich aufzulösen.
