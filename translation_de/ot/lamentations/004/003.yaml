  text: גַּם תנין חָ֣לְצוּ שַׁ֔ד הֵינִ֖יקוּ גּוּרֵי/הֶ֑ן בַּת עַמִּ֣/י לְ/אַכְזָ֔ר כי ענים בַּ/מִּדְבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
translation:
  language: de
  text: Selbst die Schakale[a] geben ihren Jungen die Brust und säugen sie. Doch die Tochter meines Volkes ist grausam geworden wie die Strauße[b] in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meerungeheuer“ oder „Drachen“. Hier sind wahrscheinlich Schakale gemeint, weil das Bild vom Säugen der Jungen und der Vergleich mit Wüstentieren dafür sprechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Eulen“. Das hebräische Wort wird traditionell als „Strauße“ verstanden, besonders im Licht von Ijob 39,13–17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תנין
  choice: Schakale
  rationale: Der Zusammenhang beschreibt Landsäugetiere, die ihre Jungen säugen. Daher ist hier die kontextuell anerkannte Bedeutung „Schakale“ gegenüber „Meerungeheuer“ oder „Drachen“ vorzuziehen.
- source_word: חָלְצוּ שַׁד
  choice: reichen die Brust
  rationale: Die Wendung bezeichnet das Freimachen beziehungsweise Darbieten der Brust zum Säugen. „Reichen die Brust“ gibt das konkrete mütterliche Bild in natürlichem Deutsch wieder.
- source_word: הֵינִיקוּ
  choice: säugen
  rationale: Der Hifil von ינק bezeichnet das Säugen, also das Trinkenlassen der Jungen.
- source_word: גּוּרֵיהֶן
  choice: ihre Jungen
  rationale: Die allgemeine Bezeichnung für tierischen Nachwuchs vermeidet eine übermäßig artspezifische Festlegung.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die wörtliche Wiedergabe bewahrt die poetische Personifikation des Volkes und ihre emotionale Wirkung.
- source_word: לְאַכְזָר
  choice: ist grausam geworden
  rationale: Die Konstruktion bezeichnet einen eingetretenen Zustand und bringt die erschütternde Veränderung unter der Notlage zum Ausdruck.
- source_word: כִּי עֲנִים
  choice: wie die Strauße
  rationale: Die traditionelle und kontextuell passende Deutung versteht ענים als Strauße, deren vermeintliche Härte gegenüber ihren Jungen auch in Ijob 39,13–17 anklingt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Im Zusammenhang mit Straußen und der lebensfeindlichen Umgebung ist „Wüste“ im modernen Deutschen treffend und poetisch knapp.
