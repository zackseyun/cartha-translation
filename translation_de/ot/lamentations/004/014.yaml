  source_fidelity: 'Der deutsche Haupttext gibt die hebräische Abfolge und Mehrdeutigkeit eng wieder: נָעוּ ist treffend mit „irrten“ wiedergegeben, עִוְרִים mit dem poetisch-prädikativen „Blind“, und נְגֹאֲלוּ בַּדָּם wahrt mit „mit Blut verunreinigt“ sowohl die Blutbezug- als auch die Unreinheitsnuance. Die pluralische Lesart von יִגְּעוּ als Fortführung des Subjekts wird im Haupttext beibehalten, ohne die textlich mögliche unpersönliche Deutung zu verschweigen.'
