base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
translation:
  language: de
  text: Blind irrten sie durch die Straßen[a], mit Blut verunreinigt[b], sodass sie ihre Kleider nicht berühren konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie Blinde irrten sie durch die Straßen“. Im Hebräischen steht kein ausdrückliches Vergleichswort.'
    reason: alternative_reading
  - marker: b
    text: '„Verunreinigt“ bezeichnet wahrscheinlich nicht nur sichtbare Blutflecken, sondern auch Unreinheit durch Blut. Der letzte Satzteil ist im Hebräischen stark verkürzt; auch möglich: „sodass niemand ihre Kleider berühren konnte“.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: נָעוּ
  choice: irrten sie
  rationale: Das Verb bezeichnet ein unstetes, orientierungsloses Umhergehen oder Schwanken. „Irrten“ gibt die Bewegung in diesem Klagekontext natürlich und prägnant wieder.
- source_word: עִוְרִים
  choice: blind
  rationale: Das Wort bedeutet wörtlich „Blinde“ beziehungsweise „blind“. Die prädikative Wiedergabe bewahrt das Bild, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Vergleich einzufügen.
- source_word: בַּחוּצוֹת
  choice: durch die Straßen
  rationale: חוּצוֹת bezeichnet Straßen oder öffentliche Plätze einer Stadt; „durch die Straßen“ verbindet den Ort idiomatisch mit der beschriebenen Bewegung.
- source_word: נְגֹאֲלוּ
  choice: verunreinigt
  rationale: Der Nifal von גאל bezeichnet hier Verunreinigung und trägt wahrscheinlich kultische Unreinheitsvorstellungen mit; „verunreinigt“ ist daher treffender als bloß „befleckt“.
- source_word: בַּדָּם
  choice: mit Blut
  rationale: Die Präposition bezeichnet hier das Mittel oder den Stoff der Verunreinigung. „Mit Blut“ ist im Deutschen klar und natürlich.
- source_word: בְּלֹא יֽוּכְלוּ
  choice: sodass sie … nicht … konnten
  rationale: Die knappe hebräische Konstruktion drückt Unvermögen beziehungsweise eine daraus folgende Unmöglichkeit aus. Die Wiedergabe folgt zunächst dem grammatisch naheliegenden gleichen Pluralsubjekt, ohne die syntaktische Schwierigkeit zu verdecken.
- source_word: יִגְּעוּ
  choice: berühren
  rationale: נגע bedeutet gewöhnlich „berühren“; dies passt besonders zum Zusammenhang von Blut und Verunreinigung.
- source_word: בִּלְבֻשֵׁיהֶם
  choice: ihre Kleider
  rationale: Das Wort bezeichnet ihre Kleidung. „Kleider“ ist in modernem Deutsch verständlich und wahrt den würdigen poetischen Ton.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יִגְּעוּ
  choice: „sie … konnten“ als Fortführung des vorangehenden Pluralsubjekts
  alternative: 'Unpersönlich: „sodass niemand ihre Kleider berühren konnte“'
  rationale: Die Verbform ist pluralisch, doch der stark verdichtete hebräische Satz lässt offen, ob dieselben Personen gemeint sind oder ob die Aussage unpersönlich auf andere Menschen zielt. Der Haupttext wahrt die grammatisch unmittelbare Lesart; die alternative Deutung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Die ungewöhnliche Aussage des hebräischen Haupttextes bleibt erhalten; mögliche Vergleichs- und Subjektdeutungen werden nicht stillschweigend festgelegt, sondern in den Fußnoten ausgewiesen.
