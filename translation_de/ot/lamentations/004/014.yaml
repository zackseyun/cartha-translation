  terminology: „Verunreinigt“ ist hier gegenüber einem rein äußerlichen „blutbefleckt“ angemessen, da die kultisch-rituelle Dimension von נְגֹאֲלוּ nicht nivelliert wird. Die Fußnoten behandeln sowohl die mögliche Vergleichskraft von עִוְרִים als auch die umstrittene Subjektzuweisung der Schlussklausel ausgewogen und ohne diese im Haupttext zu entscheiden.
