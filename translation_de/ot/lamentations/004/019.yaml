source:
  edition: WLC
  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: de
  text: Unsere Verfolger waren schneller als die Adler des Himmels[a]; auf den Bergen jagten sie uns, in der Wüste lauerten sie uns auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als die Geier des Himmels“; das hebräische Wort נֶשֶׁר kann je nach Zusammenhang einen Adler oder einen Geier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  choice: schneller
  rationale: Die Präposition מִן kennzeichnet hier den Vergleich; „schneller“ gibt ihn im Deutschen klar und natürlich wieder.
- source_word: רֹדְפֵינוּ
  choice: unsere Verfolger
  rationale: Die substantivische Wiedergabe entspricht der Form und bewahrt das konkrete Bild einer Verfolgungsjagd, ohne es zu „Feinde“ oder „Bedränger“ zu verallgemeinern.
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: als die Adler am Himmel
  rationale: „Adler“ bewahrt das traditionelle Geschwindigkeitsbild; „am Himmel“ gibt die hebräische Verbindung idiomatisch und zugleich poetisch wieder. Die mögliche Bedeutung „Geier“ wird in der Fußnote offengehalten.
- source_word: עַל הֶהָרִים
  choice: auf den Bergen
  rationale: Direkte und natürliche Ortsangabe, die das topografische Bild erhält.
- source_word: דְּלָקֻנוּ
  choice: jagten sie uns
  rationale: דלק bezeichnet ein heftiges, entschlossenes Verfolgen. „jagten“ vermittelt diese Intensität und vermeidet eine schwerfällige Wiederholung von „Verfolger/verfolgten“.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige deutsche Wiedergabe von מִדְבָּר und kann auch unbewohntes, trockenes Wildnisgebiet bezeichnen.
- source_word: אָרְבוּ לָנוּ
  choice: lauerten sie uns auf
  rationale: Die idiomatische deutsche Wendung gibt das verborgene Warten mit feindlicher Absicht präzise wieder.
