base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: de
  text: '»Weicht aus! Unrein!«, rief man ihnen zu. »Weicht aus, weicht aus, fasst niemanden an!« Denn sie sind geflohen[a], ja, sie irren umher. Unter den Völkern sagte man: »Sie werden nicht länger bleiben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie sind vertrieben worden«; das hebräische Verb ist selten, und seine genaue Bedeutung an dieser Stelle ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie werden nicht länger als Fremde wohnen«; das hebräische Verb bezeichnet den Aufenthalt als Fremder beziehungsweise Schutzbürger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Weicht aus
  rationale: Der pluralische Imperativ ist ein zugerufener Befehl, Abstand zu halten. „Weicht aus“ bewahrt die räumliche Bedeutung und die Wiederholung des Hebräischen.
- source_word: טָמֵא
  choice: Unrein
  rationale: Das Wort bezeichnet kultische beziehungsweise soziale Unreinheit und steht hier als ausgerufene Kennzeichnung.
- source_word: קָרְאוּ לָמוֹ
  choice: rief man ihnen zu
  rationale: Die unbestimmte deutsche Konstruktion gibt die nicht ausdrücklich benannte Gruppe der Rufenden natürlich wieder; לָמוֹ kennzeichnet die Angeredeten.
- source_word: אַל תִּגָּעוּ
  choice: fasst sie nicht an
  rationale: נגע bedeutet wörtlich „berühren, anfassen“. Das ergänzte Objekt „sie“ ist im Deutschen aus dem Kontext erforderlich und bezeichnet die als unrein Ausgerufenen.
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine begründende beziehungsweise erläuternde Fortführung ein, ohne den logischen Zusammenhang stärker festzulegen.
- source_word: נָצוּ
  choice: sie sind geflohen
  rationale: Das seltene und umstrittene Verb bezeichnet hier wahrscheinlich Flucht beziehungsweise Vertreibung. Die aktive Wiedergabe passt zum parallelen Umherirren; die passive Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: גַּם נָעוּ
  choice: ja, sie irren umher
  rationale: נוע kann schwanken oder unstet umherziehen bedeuten. Im Zusammenhang Vertriebener ist „umherirren“ passend; גַּם wird steigernd mit „ja“ wiedergegeben.
- source_word: אָמְרוּ בַּגּוֹיִם
  choice: Unter den Völkern sagte man
  rationale: Die unpersönliche Wiedergabe lässt offen, wer genau spricht, und versteht בַּגּוֹיִם als den Bereich, in dem das Urteil geäußert wird.
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: Sie dürfen hier nicht länger als Fremde wohnen
  rationale: גור bezeichnet den Aufenthalt als Fremder oder Schutzbürger. Im Kontext gibt der Satz wahrscheinlich die verweigerte weitere Aufnahme unter den Völkern wieder; „dürfen“ bringt dieses kontextuelle Verbot idiomatisch zum Ausdruck, während „als Fremde wohnen“ die lexikalische Eigenart bewahrt.
