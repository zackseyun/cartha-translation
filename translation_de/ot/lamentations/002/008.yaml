source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: de
  text: Jahwe beschloss, die Mauer der Tochter Zion[a] zu zerstören. Er spannte die Messschnur aus und zog seine Hand nicht vom Verschlingen zurück[b]. Wall und Mauer ließ er trauern; gemeinsam siechen sie dahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Mauer der Tochter Zions“. Zion beziehungsweise Jerusalem wird als Tochter personifiziert.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er ließ seine Hand nicht vom Verschlingen zurückkehren.“ Das Bild beschreibt die Zerstörung als ein Verschlingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁב
  choice: beschloss
  rationale: Das Verb bezeichnet hier Jahwes wohlüberlegte, feste Absicht zum Gericht. „Beschloss“ ist im Deutschen natürlich und gibt mehr als ein bloßes Erwägen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: לְהַשְׁחִית
  choice: zu zerstören
  rationale: Der Hifil-Infinitiv bezeichnet aktives Verderben beziehungsweise Zerstören und wird direkt wiedergegeben.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: die Mauer der Tochter Zion
  rationale: Die hebräische Genitivverbindung und die poetische Personifikation Zions als Tochter bleiben erhalten.
- source_word: נָטָה קָו
  choice: spannte die Messschnur aus
  rationale: „Messschnur“ verdeutlicht die konkrete Bildsprache einer planmäßig abgemessenen Zerstörung, ohne sie aufzulösen.
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: zog seine Hand nicht vom Verschlingen zurück
  rationale: Die Wendung vom Zurückziehen der Hand und das drastische Bild des Verschlingens werden möglichst eng bewahrt.
- source_word: וַיַּאֲבֶל
  choice: ließ ... trauern
  rationale: 'Die Form wird kausativ verstanden: Jahwes Handeln versetzt die personifizierten Befestigungen in Trauer.'
- source_word: חֵל
  choice: Wall
  rationale: Das Wort bezeichnet eine der eigentlichen Mauer zugeordnete äußere Befestigung; „Wall“ bewahrt die Unterscheidung knapp und anschaulich.
- source_word: וְחוֹמָה
  choice: Mauer
  rationale: Die einfache Wiedergabe erhält die poetische Paarung mit „Wall“.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet den gemeinsamen Zustand beider Befestigungswerke.
- source_word: אֻמְלָלוּ
  choice: siechen sie dahin
  rationale: Das Verb schildert Entkräftung und Verfall. „Dahinsiechen“ passt zur Personifikation und zum Trauerton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Charakter eines Eigennamens statt ihn durch einen Titel zu ersetzen.
- issue: Urheber der Trauer von Wall und Mauer
  choice: Jahwe ließ sie trauern
  alternative: Wall und Mauer trauerten
  rationale: Die masoretische Form lässt sich hier am ehesten kausativ verstehen. Da eine nichtkausative Wiedergabe sprachlich erwogen werden kann, wird sie in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Klagelied-Bildsprache. Die Satzfolge bleibt knapp und parataktisch. „Messschnur“, „Verschlingen“, „trauern“ und „dahinsiechen“ erhalten die Personifikation und die Härte des hebräischen Gerichtsbildes.
