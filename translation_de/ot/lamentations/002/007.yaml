source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: de
  text: Der Herr hat seinen Altar verworfen, sein Heiligtum verschmäht. Die Mauern ihrer Paläste hat er in die Hand des Feindes gegeben.[a] Sie erhoben im Haus Jahwes ein Geschrei wie an einem Festtag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand des Feindes«; gemeint ist: in die Gewalt des Feindes. »Paläste« kann hier auch befestigte Prachtbauten oder Zitadellen bezeichnen.'
    reason: Erläutert das hebräische Machtidiom und wahrt die Bedeutungsbreite von אַרְמוֹן.
  - marker: b
    text: 'Oder: »wie am Tag eines festgesetzten Festes«.'
    reason: Bewahrt die kultische und zeitliche Nuance von מוֹעֵד.
lexical_decisions:
- source_word: זָנַח
  choice: verworfen
  rationale: Gibt die entschiedene Zurückweisung im Gerichtskontext wieder, ohne notwendig eine endgültige Aufgabe zu behaupten.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Natürliche und etablierte deutsche Wiedergabe des göttlichen Titels Adonaj.
- source_word: מִזְבְּחוֹ
  choice: seinen Altar
  rationale: Direkte Wiedergabe des Singulars mit Possessivsuffix.
- source_word: נִאֵר
  choice: verschmäht
  rationale: Bewahrt gegenüber זָנַח die stärkere Nuance von Geringschätzung und Verachtung.
- source_word: מִקְדָּשׁוֹ
  choice: sein Heiligtum
  rationale: Im Tempelkontext die natürliche deutsche Entsprechung für den heiligen Bereich.
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: in die Hand des Feindes gegeben
  rationale: Erhält das hebräische Machtbild; gemeint ist die Auslieferung an die Gewalt des Feindes.
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: die Mauern ihrer Paläste
  rationale: Bewahrt die feminine Stadtpersonifikation und die konstruktionsnahe Bedeutung; אַרְמוֹן kann je nach Kontext auch befestigte Bauten bezeichnen.
- source_word: קוֹל נָתְנוּ
  choice: erhoben sie Geschrei
  rationale: Idiomatiche deutsche Wiedergabe des wörtlichen Ausdrucks »eine Stimme/einen Laut geben« und passend zum feindlichen Lärm.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt sowohl das Quellbild »Haus« als auch den im Text stehenden Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Gottesnamen wieder statt es durch einen Titel zu ersetzen.
- source_word: כְּיוֹם מוֹעֵד
  choice: wie an einem Festtag
  rationale: מוֹעֵד bezeichnet hier am natürlichsten einen festgesetzten kultischen Festtermin; die knappe Form erhält die bittere Gegenüberstellung von Festjubel und Feindeslärm.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Namensform bewahrt den Unterschied zum Titel אֲדֹנָי am Versanfang.
- issue: Verhältnis von זָנַח und נִאֵר
  choice: verworfen / verschmäht
  alternative: beide Verben mit »verworfen« oder נִאֵר mit »aufgegeben« wiedergeben
  rationale: Zwei unterschiedliche deutsche Verben erhalten die poetische Steigerung; »verschmäht« bringt die stärkere Geringschätzung von נִאֵר zum Ausdruck, ohne eine zusätzliche theologische Behauptung einzutragen.
- issue: Subjekt von קוֹל נָתְנוּ
  choice: sie, das heißt die Feinde
  alternative: 'unpersönlich: »Geschrei erscholl«'
  rationale: Der maskuline Plural greift sinngemäß die feindlichen Angreifer auf, obwohl אוֹיֵב zuvor grammatisch im Singular steht; die deutsche Pluralform bewahrt diese Quellgestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch knapper Satzführung. Die Gegenüberstellung von Gottes Gericht und dem festähnlichen Lärm der Feinde bleibt erhalten; »der Herr« für אֲדֹנָי und »Jahwe« für יְהוָה werden bewusst unterschieden.
