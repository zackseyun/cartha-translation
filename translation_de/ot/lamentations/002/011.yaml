source:
  edition: WLC
  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: de
  text: Meine Augen sind vom Weinen erschöpft; mein Innerstes ist aufgewühlt. Meine Leber ist auf die Erde ausgegossen[a] wegen des Zusammenbruchs der Tochter meines Volkes[b], weil Kleinkind und Säugling auf den Plätzen der Stadt verschmachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Meine Leber ist auf die Erde ausgegossen.“ Die Leber steht hier als körperliches Bild für tiefsten Schmerz und völligen Zusammenbruch.'
    reason: cultural_note
  - marker: b
    text: „Die Tochter meines Volkes“ ist eine hebräische poetische Personifikation des eigenen Volkes beziehungsweise seiner Stadt.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: Meine Augen sind vom Weinen erschöpft
  rationale: כָּלוּ bezeichnet das Aufgebraucht- oder Erschöpftsein. „Vom Weinen“ gibt die durch Tränen verursachte Erschöpfung im Deutschen natürlich wieder und bewahrt das konkrete Körperbild.
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: mein Innerstes ist aufgewühlt
  rationale: Das seltene Verb bezeichnet eine heftige innere, körperlich empfundene Erregung. „Innerstes“ wahrt die viszerale Bildwelt, ohne das heute leicht ablenkende „Eingeweide“ zu verwenden.
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: Meine Leber ist zur Erde hingeschüttet
  rationale: „Leber“ wird als bewusst fremdartiges, konkretes Organbild tiefer Trauer beibehalten. „Zur Erde hingeschüttet“ wahrt Passivform und Abwärtsbewegung.
- source_word: עַל שֶׁבֶר
  choice: über den Zusammenbruch
  rationale: שֶׁבֶר kann Bruch, Zusammenbruch oder Zerstörung bezeichnen. „Zusammenbruch“ passt zur umfassenden Katastrophe und bewahrt zugleich die Bildidee des Zerbrechens.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die hebräische poetische Personifikation wird wörtlich erhalten, statt sie vereindeutigend durch „mein Volk“ oder „Jerusalem“ zu ersetzen.
- source_word: בְּעָטֵף
  choice: weil … verschmachten
  rationale: Das Verb beschreibt das kraftlose Dahinsinken der Kinder, wahrscheinlich infolge von Hunger und Entbehrung. Die kausale Fügung entspricht dem Zusammenhang; „verschmachten“ vermittelt den fortschreitenden Kräfteverfall.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: Kleinkind und Säugling
  rationale: עוֹלֵל bezeichnet ein sehr junges Kind, יוֹנֵק ein noch gestilltes Kind. Die deutsche Wortwahl ist knapp, verständlich und unterscheidet beide Bezeichnungen.
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: auf den Plätzen der Stadt
  rationale: רְחֹבוֹת bezeichnet hier die breiten öffentlichen Räume beziehungsweise Plätze der Stadt, nicht lediglich moderne Straßen.
theological_decisions:
- issue: Bezug der Wendung „Tochter meines Volkes“
  choice: Die poetische Personifikation bleibt im Haupttext stehen.
  alternative: „mein Volk“ oder ausdrücklich „Jerusalem“
  rationale: Der hebräische Text personifiziert die betroffene Gemeinschaft, ohne den Ausdruck hier vollständig aufzulösen. Die Übersetzung bewahrt diese poetische und theologische Spannung.
- issue: Deutung des Organbildes כְּבֵדִי
  choice: „meine Leber“
  alternative: „mein Herz“ oder „mein ganzes Inneres“
  rationale: Eine Verallgemeinerung würde die auffällige hebräische Körpermetaphorik beseitigen. Die Fußnote erläutert das Bild, ohne es im Text konfessionell oder psychologisch festzulegen.
translation_notes:
  register: Moderne, würdige Klagesprache mit bewusst bewahrter Körperbildlichkeit. „Aufgewühlt“ und „verschmachten“ sind allgemein verständlich; das ungewöhnliche Leberbild und die Personifikation werden nicht geglättet, sondern durch Fußnoten erschlossen.
