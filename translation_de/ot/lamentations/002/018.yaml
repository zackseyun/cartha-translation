  text: צָעַ֥ק לִבָּ֖/ם אֶל אֲדֹנָ֑/י חוֹמַ֣ת בַּת צִ֠יּוֹן הוֹרִ֨ידִי כַ/נַּ֤חַל דִּמְעָה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אַֽל תִּתְּנִ֤י פוּגַת֙ לָ֔/ךְ אַל תִּדֹּ֖ם בַּת עֵינֵֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: de
  text: 'Ihr Herz schrie zum Herrn[a]: O Mauer der Tochter Zion, lass Tränen wie ein Bach[b] Tag und Nacht herabströmen! Gönn dir keine Pause; dein Auge soll nicht zur Ruhe kommen[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr Herz schrie zum Herrn.“ Der Singular „Herz“ mit einem Pluralsuffix ist wahrscheinlich kollektiv gemeint; sinngemäß auch: „Ihre Herzen schrien zum Herrn.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann einen Bach, einen zeitweise wasserführenden Talgrund oder einen reißenden Wasserlauf bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Die Tochter deines Auges soll nicht still sein.“ Die hebräische Wendung bezeichnet die Pupille beziehungsweise das Auge und meint hier, dass das Weinen nicht aufhören soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק לִבָּם
  choice: Ihr Herz schrie
  rationale: Das Hebräische hat das Substantiv „Herz“ im Singular mit einem Pluralsuffix. Die deutsche Wiedergabe bewahrt diese kollektive Vorstellung und gibt צעק als eindringliches Schreien wieder.
- source_word: אֶל אֲדֹנָי
  choice: zum Herrn
  rationale: אֲדֹנָי bezeichnet hier den göttlichen Herrn. „Zum Herrn“ ist im Deutschen die natürliche Richtungsangabe nach „schrie“.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: Mauer der Tochter Zion
  rationale: Die Wortfolge wird als direkte Anrede verstanden. „Mauer“ gibt חוֹמָה schlicht wieder; „Tochter Zion“ erhält die personifizierende Redeweise des Hebräischen.
- source_word: הוֹרִידִי כַנַּחַל דִּמְעָה
  choice: lass Tränen wie einen Bach herabströmen
  rationale: Der feminine Hifil-Imperativ richtet sich an die personifizierte Mauer beziehungsweise Tochter Zion. Der kollektive Singular „Träne“ wird im Deutschen idiomatisch als „Tränen“ wiedergegeben; „herabströmen“ bewahrt Bewegung und Bildkraft.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die feste Wortverbindung bezeichnet ununterbrochene Dauer und lässt sich unmittelbar und natürlich übertragen.
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: Gönn dir keine Pause
  rationale: פוּגָה bezeichnet eine Unterbrechung oder Atempause. Die Formulierung ist gegenwärtiges, natürliches Deutsch und beschränkt den Sinn nicht auf Schlaf.
- source_word: אַל תִּדֹּם בַּת עֵינֵךְ
  choice: dein Auge soll nicht zur Ruhe kommen
  rationale: Die wörtliche „Tochter deines Auges“ bezeichnet das Auge beziehungsweise die Pupille. Die gewählte Formulierung macht das unablässige Weinen verständlich, ohne das Bild unnötig klinisch auszudrücken.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: mein Herr
  rationale: Im Zusammenhang ist Israels Gott gemeint. Der bestimmte Titel „der Herr“ vermeidet eine im hebräischen Text hier nicht ausgedrückte Ich-Perspektive und unterscheidet den göttlichen Bezug von einer menschlichen Höflichkeitsanrede.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative erhalten die Dringlichkeit der Klage. Die ungewöhnliche Anrede „Mauer der Tochter Zion“ bleibt als poetische Personifikation stehen; erklärungsbedürftige Hebraismen werden in Fußnoten erschlossen.
