source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: de
  text: Der Herr hat alle Wohnstätten Jakobs verschlungen[a], ohne Mitleid; in seinem Zorn hat er die Festungen der Tochter Juda niedergerissen; er hat sie zu Boden gestürzt; er hat das Königreich und seine Fürsten entweiht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Weideplätze Jakobs“. Das hebräische Wort kann Weideplätze oder Wohnstätten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat das Königreich und seine Fürsten geschändet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: hat … verschlungen
  rationale: Bewahrt die kräftige Metapher des hebräischen Verbs, das wörtlich „verschlingen“ bedeutet.
- source_word: אֲדֹנָי
  choice: Der Herr
  rationale: Die Vorlage hat den Gottestitel Adonaj, nicht das Tetragramm; daher wird der Titel übersetzt.
- source_word: לֹא חָמַל
  choice: ohne Mitleid
  rationale: Gibt die fehlende Schonung beziehungsweise das fehlende Erbarmen knapp und eindringlich wieder.
- source_word: נְאוֹת יַעֲקֹב
  choice: alle Wohnstätten Jakobs
  rationale: נָאוֹת kann Weideplätze oder Wohnstätten bezeichnen. Im Zusammenhang mit Festungen und Königreich liegt die Bedeutung „Wohnstätten/Siedlungen“ näher; die konkrete Alternative bleibt in der Fußnote erhalten.
- source_word: הָרַס
  choice: niedergerissen
  rationale: Entspricht dem Bild vom Abbrechen oder Einreißen befestigter Orte.
- source_word: בְּעֶבְרָתוֹ
  choice: in seinem Zorn
  rationale: Natürliches, gewichtiges Deutsch für den heftigen göttlichen Zorn.
- source_word: מִבְצְרֵי
  choice: die Festungen
  rationale: Bezeichnet befestigte Orte und erhält den militärischen Sinn.
- source_word: בַת יְהוּדָה
  choice: der Tochter Juda
  rationale: Bewahrt die poetische Personifikation, klingt im Deutschen jedoch natürlicher als eine artikellose Nachbildung.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: zu Boden gestürzt
  rationale: 'Gibt die kausative Aussage idiomatisch wieder: Die zuvor genannten Festungen werden bis auf den Boden gebracht.'
- source_word: חִלֵּל
  choice: entweiht
  rationale: Bewahrt den Gedanken der Profanierung oder Schändung, ohne ihn bloß als politische Zerstörung wiederzugeben.
- source_word: מַמְלָכָה
  choice: das Königreich
  rationale: Bezeichnet hier am ehesten das politische Reich; die Verbindung mit seinen Fürsten stützt diese Lesart.
- source_word: וְשָׂרֶיהָ
  choice: und seine Fürsten
  rationale: Erhält den gehobenen politischen und monarchischen Sprachgebrauch.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Der Herr
  alternative: Herr
  rationale: Die Quelle verwendet Adonaj und nicht JHWH. Der Titel wird daher als „Herr“ übersetzt, ohne die besondere Schreibkonvention für das Tetragramm zu verwenden.
- issue: Bedeutung von חִלֵּל für Königreich und Fürsten
  choice: entweiht
  alternative: geschändet
  rationale: Das Verb trägt die Bedeutung des Profanierens beziehungsweise Entweihens. Die ungewöhnliche Verbindung mit politischen Größen wird nicht durch eine rein politische Deutung geglättet.
translation_notes:
  register: Poetisch, würdevoll und in modernem Standarddeutsch. Die drastischen Bilder „verschlungen“, „niedergerissen“ und „entweiht“ bleiben erhalten; die Satzstruktur folgt den parallelen Klageaussagen des Hebräischen, ohne unnatürlich zu wirken.
