base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: de
  text: 'Sieh, Jahwe, und schau: Wem hast du so etwas angetan? Sollen Frauen ihre eigenen Kinder[a] essen, die kleinen Kinder, die sie liebevoll umsorgt haben[b]? Sollen Priester und Prophet im Heiligtum des Herrn getötet werden?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihre Frucht«, das heißt ihre eigenen Kinder.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ihre zärtlich aufgezogenen Kinder« oder »die Kinder, die sie auf den Armen getragen haben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Sieh ... und schau
  rationale: Die beiden Imperative werden getrennt wiedergegeben und bewahren so die eindringliche Doppelaufforderung; die Formulierung ist gegenwärtig und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und von אֲדֹנָי am Versende unterschieden.
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: Wem hast du so etwas angetan?
  rationale: Die Wendung bewahrt den Adressatenbezug von לְמִי und bringt den schädigenden Sinn des Verbs im Deutschen natürlich zum Ausdruck.
- source_word: אִם תֹּאכַלְנָה
  choice: Sollen ... essen?
  rationale: אִם leitet hier angesichts des Kontextes eine entsetzte rhetorische Frage ein, keine gewöhnliche Bedingung.
- source_word: פִּרְיָם
  choice: ihre Leibesfrucht
  rationale: Die Wahl erhält das hebräische Bild der »Frucht« und macht zugleich verständlich, dass die eigenen Kinder gemeint sind.
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: die kleinen Kinder, die sie liebevoll umsorgt haben
  rationale: עֹלֲלִים bezeichnet kleine Kinder; טִפֻּחִים verweist auf zärtliches Aufziehen, Tragen oder Umsorgen. Die Übersetzung gibt den Sinn verständlich wieder, ohne eine unsichere Einzelnuance festzulegen.
- source_word: אִם יֵהָרֵג
  choice: Sollen ... getötet werden?
  rationale: Wie zuvor wird die Form als erschrockene rhetorische Frage wiedergegeben; das Passiv des Hebräischen bleibt erhalten.
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  choice: im Heiligtum des Herrn
  rationale: מִקְדָּשׁ bezeichnet den heiligen Bereich beziehungsweise das Heiligtum; אֲדֹנָי ist hier ein Titel und wird von Jahwe unterschieden.
theological_decisions:
- issue: Zwei verschiedene Gottesbezeichnungen im selben Vers
  choice: יְהוָה als »Jahwe«, אֲדֹנָי als »der Herr«
  alternative: Beide Bezeichnungen als »Herr« wiedergeben
  rationale: Die Unterscheidung folgt den beiden unterschiedlichen hebräischen Formen, ohne sie theologisch anzugleichen.
- issue: Zuschreibung des Unheils an Gott
  choice: »Wem hast du so etwas angetan?«
  alternative: »Gegen wen hast du so gehandelt?«
  rationale: Die direkte Klage an Jahwe und ihre theologische Spannung werden nicht abgeschwächt oder erklärend aufgelöst.
translation_notes:
  register: Modernes Standarddeutsch mit eindringlichem, würdigem Klageton. Die parallelen Aufforderungen und rhetorischen Fragen bleiben erhalten. »Leibesfrucht« ist leicht gehoben, aber allgemein verständlich und bewahrt das Bild des Ausgangstextes.
