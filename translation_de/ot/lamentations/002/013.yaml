base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: de
  text: Was kann ich dir bezeugen?[a] Womit kann ich dich vergleichen, Tochter Jerusalem? Womit kann ich dich gleichstellen, um dich zu trösten, jungfräuliche Tochter Zion? Denn dein Bruch ist so groß wie das Meer;[b] wer kann dich heilen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was kann ich über dich sagen?“ Das hebräische Verb gehört zum Wortfeld des Zeugnisgebens. Die Wendung ist schwierig und kann auch im Sinn von „Was kann ich als Zeugnis anführen?“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Wunde“, „dein Zusammenbruch“, „deine Verwüstung“ oder „dein Unheil“. Das hebräische Wort bezeichnet einen Bruch oder Zusammenbruch und kann auch dessen verheerende Folgen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  choice: Was kann ich für dich bezeugen?
  rationale: Die schwierige hebräische Wendung wird mit ihrem Zeugnisgedanken wiedergegeben. „Für dich“ lässt den möglichen Bezug auf ein zu Jerusalems Trost angeführtes Zeugnis erkennen, ohne die Unsicherheit des Ausdrucks zu verdecken.
- source_word: מָה אֲדַמֶּה לָּךְ
  choice: Womit kann ich dich vergleichen
  rationale: Die Frage sucht nach einer vergleichbaren Größe oder einem vergleichbaren Schicksal. „Womit“ ist im modernen Deutschen natürlich und hält den direkten Vergleich fest.
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: Tochter Jerusalem
  rationale: Die personifizierende Anrede der Stadt bleibt ohne einen im Hebräischen nicht vorhandenen Zusatz erhalten.
- source_word: מָה אַשְׁוֶה לָּךְ
  choice: Wem kann ich dich gleichstellen
  rationale: „Gleichstellen“ bewahrt die zweite, nahezu synonyme Vergleichsformulierung und bildet die rhetorische Häufung ab, statt beide Fragen gleich zu übersetzen.
- source_word: וַאֲנַחֲמֵךְ
  choice: um dich zu trösten
  rationale: 'Die Infinitivkonstruktion gibt den im Zusammenhang naheliegenden Zweck wieder: Ein passender Vergleich könnte Trost ermöglichen.'
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: jungfräuliche Tochter Zion
  rationale: Die traditionelle Stadtpersonifikation und der gewöhnliche lexikalische Sinn von בְּתוּלָה werden bewahrt.
- source_word: גָדוֹל כַּיָּם שִׁבְרֵךְ
  choice: dein Bruch ist groß wie das Meer
  rationale: „Bruch“ hält das konkrete Bild von Zerbrechen oder Zusammenbruch fest; „groß wie das Meer“ bewahrt den schlichten Größenvergleich des Hebräischen.
- source_word: מִי יִרְפָּא לָךְ
  choice: wer kann dich heilen?
  rationale: „Heilen“ entspricht רפא und führt das Bild einer schweren Verletzung weiter. „Kann“ bringt den rhetorischen Zweifel angesichts ihres Ausmaßes idiomatisch zum Ausdruck.
