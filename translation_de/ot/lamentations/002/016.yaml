base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: de
  text: 'Alle deine Feinde reißen den Mund gegen dich auf; sie zischen und knirschen mit den Zähnen. Sie sagen: »Wir haben sie verschlungen! Ja, das ist der Tag, auf den wir gehofft haben; wir haben ihn gefunden, wir haben ihn gesehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּצוּ עָלַיִךְ פִּיהֶם
  choice: reißen den Mund gegen dich auf
  rationale: Die Wendung bewahrt das anschauliche weite Öffnen des Mundes und gibt mit »gegen dich« die feindselige Ausrichtung wieder.
- source_word: כָּל אֹיְבַיִךְ
  choice: alle deine Feinde
  rationale: Direkte, natürliche Wiedergabe der Gesamtheit.
- source_word: שָׁרְקוּ
  choice: zischen
  rationale: Das Verb kann Pfeifen oder Zischen als Ausdruck von Spott und Verachtung bezeichnen; im feindseligen Zusammenhang trifft »zischen« die Geste klar.
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: knirschen mit den Zähnen
  rationale: Geläufige deutsche Entsprechung für die Geste von Wut und Bosheit; der hebräische Singular »Zahn« wird idiomatisch im Plural wiedergegeben.
- source_word: בִּלָּעְנוּ
  choice: Wir haben dich verschlungen
  rationale: »Verschlingen« erhält das drastische Bild völliger Vernichtung. Das feminine Objekt ist zwar im Verb nicht ausdrücklich markiert, wird aber aus der direkten Anrede Zions als »dich« erschlossen.
- source_word: אַךְ זֶה הַיּוֹם
  choice: Ja, das ist der Tag
  rationale: »Ja« gibt die emphatische Bekräftigung natürlich wieder; »das ist der Tag« verweist auf den erwarteten Tag.
- source_word: שֶׁקִּוִּינֻהוּ
  choice: auf den wir gehofft haben
  rationale: קוה verbindet Erwartung und Hoffnung; hier bezeichnet es die schadenfrohe Erwartung der Feinde.
- source_word: מָצָאנוּ
  choice: wir haben ihn erlebt
  rationale: Wörtlich bedeutet das Verb »wir haben gefunden«. Bezogen auf einen ersehnten Tag klingt »ihn erlebt« im Deutschen natürlicher und drückt aus, dass dieser Tag eingetroffen ist.
- source_word: רָאִינוּ
  choice: wir haben ihn gesehen
  rationale: Die schlichte, steigernde Schlussaussage und die Parallelität zum vorausgehenden Verb bleiben erhalten.
