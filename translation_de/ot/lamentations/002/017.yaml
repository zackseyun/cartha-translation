base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: de
  text: Jahwe hat getan, was er geplant hatte; er hat sein Wort ausgeführt[a], das er vor langer Zeit angeordnet hat.[b] Er hat niedergerissen und kein Mitleid gezeigt. Er hat den Feind über dich jubeln lassen und das Horn deiner Bedränger erhoben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollstreckt“ beziehungsweise „zu Ende geführt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von den Tagen der Vorzeit an“.'
    reason: lexical_alternative
  - marker: c
    text: Das „Horn“ ist ein biblisches Bild für Stärke, Macht oder Ansehen.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: זָמָם
  choice: geplant hatte
  rationale: Bezeichnet Jahwes zuvor gefasste Absicht und passt zum nachfolgenden Vollzug.
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: sein Wort vollstreckt
  rationale: בצע bezeichnet hier das vollständige Ausführen eines angekündigten Gerichtswortes; „vollstreckt“ bewahrt dessen ernsten, gerichtlichen Klang.
- source_word: אֲשֶׁר צִוָּה מִימֵי קֶדֶם
  choice: das er vor langer Zeit geboten hatte
  rationale: Gibt das Verb צוה direkt wieder und überträgt die zeitliche Wendung מימי קדם verständlich in heutiges Deutsch.
- source_word: הָרַס וְלֹא חָמָל
  choice: Er hat niedergerissen und kein Mitleid gezeigt
  rationale: Bewahrt sowohl das Bild des Abbruchs als auch die ausdrücklich verneinte Schonung beziehungsweise Anteilnahme.
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: Er hat den Feind über dich jubeln lassen
  rationale: Gibt die kausative Verbform und den Triumph des Feindes über die feminin singular angeredete Stadt natürlich wieder.
- source_word: הֵרִים קֶרֶן צָרָיִךְ
  choice: das Horn deiner Bedränger erhoben
  rationale: Erhält das biblische Hornbild und gibt den Plural צָרַיִךְ mit „Bedränger“ wieder.
theological_decisions:
- issue: Göttliches Handeln bei der Zerstörung Jerusalems
  choice: Jahwe bleibt ausdrückliches Subjekt des Planens, Vollstreckens und Niederreißens sowie des feindlichen Triumphs.
  alternative: Das Handeln lediglich als göttliche Zulassung wiederzugeben.
  rationale: Die hebräischen Verbformen schreiben Jahwe das Handeln unmittelbar zu. Diese theologische Spannung wird nicht abgeschwächt.
- issue: Bedeutung von אֶמְרָתוֹ
  choice: „sein Wort“ wird als zuvor ergangenes, nun vollstrecktes Gerichtswort offengehalten.
  alternative: „seine Verheißung“ oder „sein Urteil“
  rationale: „Verheißung“ wäre im Deutschen zu positiv verengt, „Urteil“ stärker interpretierend; „Wort“ wahrt die semantische Breite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Prägnanz. Kurze Hauptsätze spiegeln die Wucht der hebräischen Verbfolge. Das traditionelle biblische Hornbild bleibt erhalten und wird in einer Fußnote erklärt.
