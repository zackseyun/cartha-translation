  text: סָֽפְק֨וּ עָלַ֤יִ/ךְ כַּפַּ֨יִם֙ כָּל עֹ֣בְרֵי דֶ֔רֶךְ שָֽׁרְקוּ֙ וַ/יָּנִ֣עוּ רֹאשָׁ֔/ם עַל בַּ֖ת יְרוּשָׁלִָ֑ם הֲ/זֹ֣את הָ/עִ֗יר שֶׁ/יֹּֽאמְרוּ֙ כְּלִ֣ילַת יֹ֔פִי מָשׂ֖וֹשׂ לְ/כָל הָ/אָֽרֶץ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: de
  text: 'Alle, die auf dem Weg vorüberziehen, schlagen die Hände über dir zusammen. Sie zischen[a] und schütteln den Kopf über die Tochter Jerusalem[b]: »Ist das die Stadt, von der man sagte: ›Vollendung der Schönheit[c], Freude der ganzen Erde‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie pfeifen“. Das hebräische Verb kann einen schrillen Laut des Spotts bezeichnen, der als Zischen oder Pfeifen wiedergegeben werden kann.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Tochter Jerusalem“; die Stadt wird poetisch als Frau personifiziert.
    reason: cultural_note
  - marker: c
    text: 'Oder: „von vollkommener Schönheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: schlagen ... die Hände zusammen
  rationale: Die hebräische Wendung bezeichnet das Zusammenschlagen der Hände, hier als Geste des Spotts. Die Formulierung ist im Deutschen verständlich und bewahrt das konkrete Bild.
- source_word: עָלַיִךְ
  choice: über dich
  rationale: Die Präposition richtet die höhnische Geste gegen die personifizierte Stadt. „Über dich“ erhält zugleich den räumlich-bildhaften und feindseligen Sinn.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: Alle, die auf dem Weg vorüberziehen
  rationale: Die Übersetzung gibt sowohl das Vorübergehen als auch den ausdrücklich genannten Weg wieder und klingt dabei natürlich.
- source_word: שָׁרְקוּ
  choice: zischen
  rationale: Das Verb kann ein Pfeifen oder Zischen bezeichnen. Im Zusammenhang des öffentlichen Spotts vermittelt „zischen“ die Verachtung treffend; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: schütteln den Kopf
  rationale: Die geläufige deutsche Wendung gibt die Geste des Spotts oder entsetzten Staunens natürlich wieder.
- source_word: בַּת יְרוּשָׁלָם
  choice: die Tochter Jerusalem
  rationale: Die wörtlich-poetische Personifikation der Stadt wird erhalten, statt sie erklärend aufzulösen.
- source_word: הֲזֹאת הָעִיר שֶׁיֹּאמְרוּ
  choice: Ist das die Stadt, von der man sagte
  rationale: Die rhetorische Frage und Jerusalems früherer Ruf werden in idiomatischem Deutsch wiedergegeben. Das unpersönliche „man“ entspricht dem nicht näher bestimmten Subjekt.
- source_word: כְּלִילַת יֹפִי
  choice: Vollendung der Schönheit
  rationale: Die nominale Formulierung bewahrt die Vorstellung vollkommener beziehungsweise umfassender Schönheit und die poetische Erhabenheit des Hebräischen.
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: Freude der ganzen Erde
  rationale: Die knappe substantivische Wendung und ihre umfassende Aussage werden eng am Hebräischen wiedergegeben.
