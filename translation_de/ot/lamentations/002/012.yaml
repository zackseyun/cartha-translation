base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: de
  text: 'Sie sagen zu ihren Müttern: »Wo sind Getreide und Wein?«, während sie wie Erschlagene[a] auf den Plätzen der Stadt dahinschwinden, während ihr Leben[b] in den Schoß ihrer Mütter[c] ausgegossen wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie Verwundete« oder »wie Durchbohrte«. Das hebräische Wort kann einen Erschlagenen, Durchbohrten oder tödlich Verwundeten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort נֶפֶשׁ, oft mit »Seele« wiedergegeben, bezeichnet hier wahrscheinlich das entweichende Leben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »in die Arme ihrer Mütter« oder »auf den Schoß ihrer Mütter«. Wörtlich steht ein Ausdruck für Brust oder Schoß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: zu ihren Müttern
  rationale: Die Präposition לְ kennzeichnet hier die Adressatinnen; der Plural mit Possessivsuffix wird im Deutschen natürlich mit »ihren Müttern« wiedergegeben.
- source_word: יֹאמְרוּ
  choice: sagen sie
  rationale: Das Imperfekt schildert die Szene anschaulich und fortlaufend. Das deutsche Präsens bewahrt diese Unmittelbarkeit.
- source_word: אַיֵּה דָּגָן וָיָיִן
  choice: Wo sind Getreide und Wein?
  rationale: דָּגָן bezeichnet Getreide beziehungsweise Getreideerzeugnisse, וָיָיִן Wein. Die konkreten Grundnahrungsmittel bleiben erhalten.
- source_word: בְּהִתְעַטְּפָם
  choice: während sie … dahinschwinden
  rationale: Die Hitpael-Form von עטף beschreibt hier ein Entkräften, Verschmachten oder Ohnmächtigwerden. »Dahinschwinden« passt zum fortschreitenden Sterben der Kinder und zur gehobenen Klagesprache.
- source_word: כֶּחָלָל
  choice: wie tödlich Verwundete
  rationale: חָלָל kann einen Erschlagenen, Durchbohrten oder tödlich Verwundeten bezeichnen. Die Wiedergabe bewahrt das Bild von Kriegsopfern, ohne die Kinder vorzeitig ausdrücklich als bereits tot zu bezeichnen.
- source_word: בִּרְחֹבוֹת עִיר
  choice: auf den Plätzen der Stadt
  rationale: רְחֹבוֹת bezeichnet breite, offene Straßenräume oder Plätze. »Plätze der Stadt« gibt den öffentlichen Schauplatz konkret und idiomatisch wieder.
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: während sich ihr Leben … ergießt
  rationale: נֶפֶשׁ bedeutet hier das Leben, das beim Sterben entweicht. Das Verb »sich ergießen« erhält das hebräische Bild des Ausgegossenwerdens.
- source_word: אֶל חֵיק אִמֹּתָם
  choice: in den Schoß ihrer Mütter
  rationale: חֵיק kann Brust, Schoß oder den bergenden Bereich der Arme bezeichnen. »Schoß« bewahrt das körperlich nahe und erschütternde Mutter-Kind-Bild.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Klagesprache mit anschaulichen Bildern. »Dahinschwinden« ist bewusst leicht gehoben, aber allgemein verständlich. Die parallelen »während«-Sätze spiegeln den fortdauernden Verlauf der Szene; die Mehrdeutigkeit von חָלָל und חֵיק wird in Fußnoten offengehalten.
