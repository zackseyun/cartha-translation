source:
  edition: WLC
  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: de
  text: Steh auf, klage laut in der Nacht, zu Beginn der Nachtwachen! Schütte dein Herz aus wie Wasser vor dem Angesicht des Herrn! Hebe deine Hände zu ihm empor für das Leben deiner kleinen Kinder, die vor Hunger an jeder Straßenecke[a] entkräftet sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Kopf jeder Straße“; auch als „an jeder Straßenkreuzung“ zu verstehen.'
    reason: Die hebräische Ortsangabe ist bildhaft und kann Straßenecken beziehungsweise Kreuzungen bezeichnen. Die Fußnote bewahrt die wörtliche Form und die räumliche Alternative.
lexical_decisions:
- source_word: ק֣וּמִי
  choice: Steh auf
  rationale: Der feminine Singular des Imperativs richtet sich an die personifizierte Tochter Zion beziehungsweise Jerusalem. „Steh auf“ ist gegenwärtiges, natürliches Deutsch und bewahrt den dringlichen Aufruf.
- source_word: רֹ֣נִּי
  choice: klage laut
  rationale: Das Verb bezeichnet einen laut vernehmbaren Ruf und kann je nach Zusammenhang auch Jubel ausdrücken. Im Klagekontext ist „klage laut“ sachgemäß, ohne einen freudigen Gesang nahezulegen.
- source_word: ב/ליל
  choice: in der Nacht
  rationale: Die schlichte Zeitangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: לְ/רֹאשׁ אַשְׁמֻרוֹת
  choice: wenn die Nachtwachen beginnen
  rationale: רֹאשׁ bezeichnet hier den Anfang, אַשְׁמֻרוֹת die Abschnitte beziehungsweise Wachen der Nacht. Die Wiedergabe vermeidet das im Deutschen missverständliche „am Kopf der Wachen“ und lässt den wiederholten nächtlichen Aufruf erkennen.
- source_word: שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ
  choice: Schütte dein Herz aus wie Wasser
  rationale: Die konkrete Metapher eines ungehemmten Ausgießens wird vollständig bewahrt und ist auch im Deutschen verständlich.
- source_word: נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י
  choice: vor dem Angesicht des Herrn
  rationale: Die Wendung bezeichnet die unmittelbare Gegenwart des Herrn. „Vor dem Angesicht“ erhält das anschauliche hebräische Bild.
- source_word: שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ
  choice: Hebe deine Hände zu ihm empor
  rationale: Die Gebärde erhobener Hände beim Gebet wird natürlich und richtungsbezogen wiedergegeben.
- source_word: עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ
  choice: für das Leben deiner kleinen Kinder
  rationale: עַל bezeichnet hier das Eintreten für jemanden; נֶפֶשׁ meint in diesem Zusammenhang das bedrohte Leben, und עוֹלָלִים bezeichnet sehr junge Kinder.
- source_word: הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב
  choice: die vor Hunger … verschmachten
  rationale: Das Partizip beschreibt ein durch Hunger verursachtes Ermatten oder Zusammenbrechen. „Verschmachten“ verbindet körperliche Schwäche mit akuter Lebensgefahr.
- source_word: בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת
  choice: an jeder Straßenecke
  rationale: Wörtlich steht „am Kopf jeder Straße“. Gemeint sind die exponierten Anfänge, Ecken oder Kreuzungen der Straßen; „an jeder Straßenecke“ gibt den räumlichen Sinn idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי
  choice: der Herr
  alternative: mein Herr
  rationale: Im Text steht אֲדֹנָי und nicht das Tetragramm. „Der Herr“ gibt den göttlichen Titel wieder, ohne die für JHWH übliche typografische Konvention zu übernehmen oder den möglichen Suffixwert als ausdrückliches „mein“ unnötig hervorzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede und imperativischer Dringlichkeit. Die Bildsprache des Herzens, das wie Wasser ausgegossen wird, und des Angesichts des Herrn bleibt erhalten; ungewöhnliche hebräische Ortsidiomatik wird im Text verständlich und in der Fußnote transparent gemacht.
