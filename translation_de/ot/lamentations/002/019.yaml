    rationale: לְרֹאשׁ אַשְׁמֻרוֹת bedeutet wörtlich etwa „zu Beginn der Wachen“. Eine nominale Wiedergabe bewahrt besser, ob die einzelnen Nachtwachen distributiv gemeint sind.
  - severity: low
    issue: „Verschmachten“ kann ein weiter fortgeschrittenes Verhungern ausdrücken als das hebräische Partizip.
    rationale: הָעֲטוּפִים beschreibt vom Hunger verursachtes Ermatten bzw. Schwachwerden. „Entkräftet“ trifft dies genauer, ohne den Ernst der Lage abzuschwächen.
