  verdict: revise
  source_fidelity: Die Übersetzung gibt die Imperative, die Gebetsgeste, das Bild vom ausgeschütteten Herzen und die Fürbitte für die Kinder insgesamt zuverlässig wieder. „Wenn die Nachtwachen beginnen“ kann jedoch den Beginn der Nachtwachen als Gesamtvorgang nahelegen, während die hebräische Pluralform die zeitliche Angabe bei den Wachen offen hält. „Zu Beginn der Nachtwachen“ ist näher am Ausdruck und bewahrt diese Offenheit. Für הָעֲטוּפִים bezeichnet „entkräftet“ das durch Hunger verursachte Ermatten genauer als das etwas weitergehende „verschmachten“.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die geringfügig angepasste Zeitangabe ist klar und flüssig; „vor Hunger entkräftet sind“ ist idiomatisch und präzise.
  terminology: „Der Herr“ gibt אֲדֹנָי angemessen wieder. „Kleine Kinder“ für עוֹלָלַיִךְ, „Herz“ für לֵב und „Hände“ für כַּפַּיִךְ sind passend. Die Fußnote zu „Straßenecke“ wahrt die bildhafte hebräische Ortsangabe und benennt die mögliche Alternative.
