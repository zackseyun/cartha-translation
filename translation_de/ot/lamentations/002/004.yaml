source:
  edition: WLC
  text: דָּרַ֨ךְ קַשְׁתּ֜/וֹ כְּ/אוֹיֵ֗ב נִצָּ֤ב יְמִינ/וֹ֙ כְּ/צָ֔ר וַֽ/יַּהֲרֹ֔ג כֹּ֖ל מַחֲמַדֵּי עָ֑יִן בְּ/אֹ֨הֶל֙ בַּת צִיּ֔וֹן שָׁפַ֥ךְ כָּ/אֵ֖שׁ חֲמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: de
  text: Er spannte seinen Bogen wie ein Feind; seine Rechte stand bereit wie ein Gegner. Im Zelt der Tochter Zion tötete er alles, was dem Auge lieb war.[a] Er goss seinen Zorn aus wie Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die dem Auge lieb waren“. Der hebräische Ausdruck kann geliebte Menschen meinen, aber auch allgemeiner alles, was schön oder kostbar war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: spannte seinen Bogen
  rationale: דָּרַךְ bezeichnet beim Bogen dessen Spannen beziehungsweise Bereitmachen zum Schuss. „Den Bogen spannen“ ist im modernen Deutsch die natürliche militärische Wendung.
- source_word: כְּאוֹיֵב
  choice: wie ein Feind
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich. Die direkte Wiedergabe bewahrt das erschütternde Bild, ohne es abzuschwächen.
- source_word: נִצָּב יְמִינוֹ
  choice: seine Rechte stand bereit
  rationale: נִצָּב beschreibt ein festes Stehen oder Aufgestelltsein. „Stand bereit“ gibt im Kampfzusammenhang die zum Angriff bereite Haltung wieder; „seine Rechte“ bewahrt die poetische Körpermetonymie.
- source_word: כְּצָר
  choice: wie ein Gegner
  rationale: צָר bezeichnet einen Widersacher oder Feind. „Gegner“ erhält den feindlichen Sinn und vermeidet eine unmittelbare Wiederholung von „Feind“.
- source_word: וַיַּהֲרֹג
  choice: Er tötete
  rationale: Das häufige Verb הרג bezeichnet direkt das Töten; die Wiedergabe ist klar, modern und nicht beschönigend.
- source_word: כֹּל מַחֲמַדֵּי עָיִן
  choice: alles, was dem Auge lieb war
  rationale: Die hebräische Wendung kann Schönes, Kostbares oder geliebte Menschen bezeichnen. Die sachlich offene Formulierung mit „alles“ erhält diese Mehrdeutigkeit, während „lieb“ auch den möglichen personalen Bezug zulässt.
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: Im Zelt der Tochter Zion
  rationale: „Tochter Zion“ erhält die poetische Personifikation; „Zelt“ gibt das konkrete Bild des Wohn- und Lebensraums wieder.
- source_word: שָׁפַךְ כָּאֵשׁ חֲמָתוֹ
  choice: goss er seinen Zorn aus wie Feuer
  rationale: Die feste Verbindung „Zorn ausgießen“ entspricht שָׁפַךְ חֲמָה; „wie Feuer“ bewahrt den ausdrücklichen Vergleich und die Intensität des Gerichtsbildes.
theological_decisions:
- issue: Gott handelt gegenüber Zion „wie ein Feind“ und „wie ein Gegner“.
  choice: Die beiden Vergleiche werden unverhüllt im Haupttext wiedergegeben.
  alternative: Die Aussagen durch „als wäre er ein Feind“ oder „er schien ein Feind zu sein“ abzuschwächen.
  rationale: Der hebräische Text stellt Gottes feindlich wirkendes Handeln in erschütternder Direktheit dar. Diese theologische Spannung gehört zur Klage und darf nicht erklärend aufgelöst werden.
- issue: Personifikation בַּת־צִיּוֹן
  choice: Tochter Zion
  alternative: Zion oder Jerusalem
  rationale: Die Personifikation ist ein tragendes poetisches und theologisches Bild des Klageliedes und wird daher nicht eingeebnet.
- issue: Möglicher personaler oder sachlicher Bezug von מַחֲמַדֵּי עָיִן
  choice: Eine grammatisch offene Formulierung im Haupttext mit Erläuterung in der Fußnote.
  alternative: Eindeutig „alle schönen Menschen“ oder ausschließlich „alle Kostbarkeiten“ zu übersetzen.
  rationale: Ob vor allem geliebte Menschen oder allgemeiner alles Schöne und Kostbare gemeint ist, lässt sich lexikalisch nicht sicher entscheiden. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die martialischen Bilder, die Personifikation „Tochter Zion“ und die Härte der Gottesdarstellung bleiben erhalten; veraltete Formen werden vermieden.
