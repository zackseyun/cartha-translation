language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: טָבְע֤וּ בָ/אָ֨רֶץ֙ שְׁעָרֶ֔י/הָ אִבַּ֥ד וְ/שִׁבַּ֖ר בְּרִיחֶ֑י/הָ מַלְכָּ֨/הּ וְ/שָׂרֶ֤י/הָ בַ/גּוֹיִם֙ אֵ֣ין תּוֹרָ֔ה גַּם נְבִיאֶ֕י/הָ לֹא מָצְא֥וּ חָז֖וֹן מֵ/יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: de
  text: Ihre Tore sind in die Erde gesunken; er hat ihre Riegel vernichtet und zerbrochen. Ihr König und ihre Fürsten sind unter den Völkern; Weisung gibt es nicht.[a] Auch ihre Propheten haben keine Vision von Jahwe gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gesetz; auch: Tora. Das hebräische Wort bezeichnet Gesetz, Weisung oder Lehre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: sind in die Erde gesunken
  rationale: Die Formulierung bewahrt das konkrete poetische Bild versinkender Stadttore; „in die Erde“ gibt bei diesem Bewegungsverb das Ergebnis natürlich wieder.
- source_word: שְׁעָרֶיהָ
  choice: ihre Tore
  rationale: Gemeint sind die Tore der personifiziert als Frau dargestellten Stadt.
- source_word: אִבַּד וְשִׁבַּר
  choice: hat … vernichtet und zerbrochen
  rationale: Die beiden starken Verben werden unterschieden wiedergegeben; „zerbrochen“ erhält beim zweiten Verb das konkrete Bild der zerstörten Riegel.
- source_word: בְּרִיחֶיהָ
  choice: ihre Riegel
  rationale: „Riegel“ bezeichnet natürlich die Querbalken oder Verschlüsse, mit denen Stadttore gesichert wurden.
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: Ihr König und ihre Fürsten
  rationale: „Fürsten“ bewahrt den politischen und gesellschaftlichen Rang von שָׂרִים besser als die allgemeineren Wörter „Amtsträger“ oder „Anführer“.
- source_word: בַגּוֹיִם
  choice: unter den Völkern
  rationale: Die Wiedergabe bleibt beim üblichen alttestamentlichen Sinn von גּוֹיִם, ohne „im Exil“ ausdrücklich in den Text einzutragen.
- source_word: אֵין תּוֹרָה
  choice: Weisung gibt es nicht
  rationale: תּוֹרָה bezeichnet nicht nur kodifiziertes Gesetz, sondern auch maßgebliche göttliche Unterweisung. „Weisung“ wahrt diese Breite im Deutschen; die Alternativen werden in der Fußnote genannt.
- source_word: גַּם נְבִיאֶיהָ
  choice: Auch ihre Propheten
  rationale: „Auch“ führt die prophetische Verstummung als zusätzliche Dimension des Zusammenbruchs ein, ohne die Steigerung stärker festzulegen, als es גַּם verlangt.
- source_word: לֹא מָצְאוּ חָזוֹן מֵיְהוָה
  choice: haben keine Vision von Jahwe gefunden
  rationale: Die Wiedergabe erhält sowohl das Verb „finden“ als auch den Begriff „Vision“ und nennt den Gottesnamen entsprechend dem hebräischen Text.
theological_decisions:
- issue: Unausgesprochenes Subjekt von אִבַּד und וְשִׁבַּר
  choice: Das Subjekt bleibt mit „er“ unausgesprochen bestimmt.
  alternative: „Jahwe hat ihre Riegel vernichtet und zerbrochen.“
  rationale: Der Zusammenhang weist stark auf Jahwe als Handelnden, doch in diesem Satzteil nennt der hebräische Text das Subjekt nicht ausdrücklich. Das Pronomen bewahrt diese formale Offenheit.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Im Haupttext steht „Weisung“.
  alternative: „Gesetz“ oder „Tora“
  rationale: Im Zusammenhang kann das Wort göttliche Unterweisung, verbindliches Gesetz oder die Tora bezeichnen. „Weisung“ bildet den weiteren Bedeutungsumfang ab, ohne die mögliche rechtliche Dimension auszuschließen.
- issue: חָזוֹן als prophetischer Offenbarungsbegriff
  choice: „Vision von Jahwe“
  alternative: „Offenbarung von Jahwe“ oder „Schauung von Jahwe“
  rationale: „Vision“ bewahrt den konkreten prophetischen Begriff, während „Offenbarung“ ihn verallgemeinern und „Schauung“ im heutigen Deutsch unnötig altertümlich wirken würde.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Die weiblichen Possessivformen führen die Personifikation Jerusalems fort. „Jahwe“ gibt den ausdrücklich stehenden Gottesnamen wieder; die Bildsprache und die nicht ausdrücklich benannte Täterschaft im ersten Satz bleiben erhalten.
