base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: de
  text: Der Herr ist wie ein Feind geworden; er hat Israel verschlungen. Er hat all ihre Paläste verschlungen, seine Festungen[a] zerstört und in der Tochter Juda Trauer und Klage vermehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem hebräischen Text: „seine Festungen“. Manche Übersetzungen gleichen dies an „ihre Paläste“ an und schreiben „ihre Festungen“; der masoretische Text hat jedoch ein maskulines Singularsuffix.'
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die übliche und im Deutschen verständliche Wiedergabe des göttlichen Herrentitels; hier bezeichnet er Gott als den Handelnden im Gericht.
- source_word: הָיָה ... כְּאוֹיֵב
  choice: ist wie ein Feind geworden
  rationale: Die Vergleichspartikel כְּ wird ausdrücklich mit „wie“ wiedergegeben. Das Perfekt „ist … geworden“ lässt im Klagekontext den Wandel in Gottes Auftreten erkennen, ohne den Vergleich in eine Wesensaussage umzudeuten.
- source_word: בִּלַּע
  choice: hat … verschlungen
  rationale: „Verschlingen“ bewahrt das drastische Bild des hebräischen Verbs für umfassende Vernichtung und ist zugleich in modernem Deutsch verständlich.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner etablierten deutschen Form beibehalten.
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: all ihre Paläste
  rationale: אַרְמוֹן kann einen Palast oder eine palastartige Zitadelle bezeichnen. „Paläste“ passt zum üblichen Sinn und bewahrt das feminine Suffix der personifizierten Stadt beziehungsweise des Landes.
- source_word: שִׁחֵת
  choice: zerstört
  rationale: Eine klare, kräftige Wiedergabe des Verbs im Zusammenhang der Verwüstung.
- source_word: מִבְצָרָיו
  choice: seine Festungen
  rationale: מִבְצָר bezeichnet befestigte Orte oder Festungen. Das maskuline Singularsuffix des masoretischen Textes wird als „seine“ bewahrt und nicht an das vorangehende feminine „ihre Paläste“ angeglichen.
- source_word: וַיֶּרֶב
  choice: vermehrt
  rationale: Die kausative Form von רבה bezeichnet das Vermehren beziehungsweise Anwachsenlassen. „Vermehrt“ gibt diese Kraft knapp und unmittelbar wieder.
- source_word: בְּבַת יְהוּדָה
  choice: bei der Tochter Juda
  rationale: „Tochter Juda“ erhält die poetische Personifikation. „Bei“ bezeichnet idiomatisch den Bereich beziehungsweise die betroffene Gemeinschaft, in der Trauer und Klage zunehmen.
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: Trauer und Klage
  rationale: Die beiden sinnverwandten Substantive steigern gemeinsam den Ausdruck des Leids; „Trauer und Klage“ erhält diese poetische Doppelung in natürlichem Deutsch.
theological_decisions:
- issue: Ob der Herr als Feind bezeichnet oder mit einem Feind verglichen wird
  choice: Der Herr ist wie ein Feind geworden
  alternative: Der Herr ist ein Feind geworden / Der Herr war ein Feind
  rationale: 'Das Hebräische enthält ausdrücklich die Vergleichspartikel כְּ („wie“). Daher bleibt die theologische Spannung bestehen: Gottes Gericht erscheint feindlich, doch der Text setzt den Herrn nicht ohne Vergleich mit einem Feind gleich.'
- issue: Bezug des maskulinen Suffixes in מִבְצָרָיו
  choice: seine Festungen
  alternative: ihre Festungen
  rationale: Der masoretische Text hat ein maskulines Singularsuffix, obwohl zuvor von „ihren Palästen“ die Rede ist. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt ihn stillschweigend zu glätten; denkbar ist ein Bezug auf das personifizierte oder kollektiv gedachte Israel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Bildsprache. Das zweimalige „verschlungen“ spiegelt die eindringliche Wiederholung des Hebräischen. „Tochter Juda“ bleibt als personifizierende Klageformel erhalten; ungewöhnliche grammatische Spannungen des Ausgangstextes werden nicht eingeebnet.
