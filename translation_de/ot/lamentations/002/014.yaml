source:
  edition: WLC
  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: de
  text: Deine Propheten schauten für dich Trug und Torheit. Sie deckten deine Schuld nicht auf, um dein Geschick[a] zu wenden; vielmehr schauten sie für dich falsche Weissagungen[b] und Irreführungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch konkreter verstanden werden: „um deine Gefangenschaft zu wenden“ oder „um deine Gefangenen zurückzubringen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „trügerische Orakel“; traditionell auch: „falsche Lastsprüche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: deine Propheten
  rationale: Der maskuline Plural mit Suffix der 2. Person feminin Singular bezeichnet die Propheten Zions beziehungsweise Jerusalems.
- source_word: חָזוּ / וַיֶּחֱזוּ
  choice: schauten
  rationale: Das Verb bezeichnet im prophetischen Zusammenhang visionäres Schauen; „schauten“ bewahrt dieses Bild und klingt im Deutschen würdig.
- source_word: שָׁוְא וְתָפֵל
  choice: Trug und Torheit
  rationale: שָׁוְא bezeichnet Falsches oder Täuschendes; das seltene תָפֵל etwas Gehaltloses oder Absurdes. Die Paarung gibt den klanglichen und inhaltlichen Parallelismus knapp wieder.
- source_word: גִלּוּ עַל עֲוֺנֵךְ
  choice: deckten deine Schuld nicht auf
  rationale: Die Wendung beschreibt das Offenlegen von Verfehlung. „Schuld“ wahrt sowohl die sündhafte Tat als auch ihre belastende Folge.
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: um dein Geschick zu wenden
  rationale: Die hebräische Wiederherstellungsformel kann Gefangenschaft, Heimkehr oder allgemeiner die Umkehr einer Notlage bezeichnen. Diese Formulierung bleibt natürlich und lässt den Umfang offen.
- source_word: מַשְׂאוֹת שָׁוְא
  choice: falsche Weissagungen
  rationale: מַשָּׂא bezeichnet hier prophetische Aussprüche, während שָׁוְא sie als falsch und trügerisch kennzeichnet.
- source_word: מַדּוּחִים
  choice: Irreführungen
  rationale: Das Wort bezeichnet Dinge, die wegführen oder in die Irre leiten. Das substantivische „Irreführungen“ vermeidet eine unbelegte Festlegung auf Visionen oder Täuschungszustände.
theological_decisions:
- issue: Bedeutung von לְהָשִׁיב שְׁבִיתֵךְ
  choice: um dein Geschick zu wenden
  alternative: um deine Gefangenschaft zu wenden / um deine Gefangenen zurückzubringen
  rationale: Die feste Wendung kann konkret auf Gefangenschaft bezogen oder als umfassendere Wiederherstellungsformel verstanden werden. Der Haupttext wahrt den breiteren Sinn; die konkreteren Lesarten werden in der Fußnote genannt.
- issue: Wiedergabe von מַשְׂאוֹת
  choice: Weissagungen
  alternative: Lastsprüche
  rationale: Im prophetischen Sprachgebrauch bezeichnet מַשָּׂא einen Ausspruch oder ein Orakel. „Weissagungen“ ist verständlich; „Lastsprüche“ bewahrt die traditionelle, wörtlichere Deutung.
- issue: Zusammenhang zwischen Schuldaufdeckung und Wiederherstellung
  choice: Finalsatz ohne zusätzliche Erklärung
  alternative: explizite Aussage, dass Umkehr die Wiederherstellung bewirkt hätte
  rationale: Der hebräische Text nennt das Ziel des Aufdeckens, entfaltet aber keinen vollständigen theologischen Kausalzusammenhang. Die Übersetzung fügt diesen nicht hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Anrede Jerusalems bleibt durch „deine“ erkennbar. Der Parallelismus und das zweimalige prophetische Schauen werden bewahrt; seltene oder mehrdeutige Begriffe werden nicht konfessionell vereindeutigt.
