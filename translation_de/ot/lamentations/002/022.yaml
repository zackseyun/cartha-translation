base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: de
  text: Wie zu einem Festtag riefst du meine Schrecken[a] von allen Seiten herbei. Am Tag des Zorns Jahwes gab es weder Entkommene noch Übriggebliebene. Die ich gehegt und großgezogen hatte – mein Feind hat sie vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie an einem bestimmten Tag“. Das hebräische Wort kann eine festgesetzte Zeit oder eine Festversammlung bezeichnen; hier wird das Herbeirufen der Schrecken bitter mit einer Festversammlung verglichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרָא
  choice: Du riefst … zusammen
  rationale: Das Qal Imperfekt 2. Person Singular richtet sich an Jahwe. Im Zusammenhang ist nicht bloß ein Rufen, sondern das Zusammenrufen der ringsum lauernden Schrecken gemeint.
- source_word: כְיוֹם מוֹעֵד
  choice: wie zu einem Festtag
  rationale: מוֹעֵד bezeichnet eine festgesetzte Zeit beziehungsweise Festversammlung. Die Wiedergabe macht den bitteren Vergleich mit dem Zusammenkommen an einem Festtag im Deutschen unmittelbar verständlich.
- source_word: מְגוּרַי מִסָּבִיב
  choice: meine Schrecken von ringsum
  rationale: מְגוּרַי wird hier kontextgemäß als das, wovor die Sprecherin sich fürchtet, verstanden; מִסָּבִיב vermittelt das Bild der Umzingelung. Die mögliche personenbezogene Deutung wird in der Fußnote bewahrt.
- source_word: בְּיוֹם אַף יְהוָה
  choice: Am Tag des Zorns Jahwes
  rationale: אַף bezeichnet hier Zorn. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben und die hebräische Genitivverbindung natürlich ins Deutsche übertragen.
- source_word: פָּלִיט וְשָׂרִיד
  choice: weder einen Entkommenen noch einen Überlebenden
  rationale: 'Die beiden Bezeichnungen werden unterschieden: פָּלִיט ist jemand, der entkommt, שָׂרִיד jemand, der übrig bleibt beziehungsweise überlebt. Die weder-noch-Konstruktion drückt zusammen mit der hebräischen Verneinung die restlose Vernichtung idiomatisch aus.'
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: die ich gehegt und großgezogen hatte
  rationale: Die Verben schildern fürsorgliches Aufziehen, wohl von Kindern. „Gehegt und großgezogen“ bewahrt Zärtlichkeit und Klage in natürlichem Deutsch.
- source_word: אֹיְבִי כִלָּם
  choice: mein Feind hat sie vernichtet
  rationale: Der Singular mit Suffix wird als „mein Feind“ bewahrt; כלה im Piel bezeichnet hier das vollständige Vernichten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn im modernen deutschen Bibelregister unmittelbar wieder, ohne den Namen durch einen Titel zu ersetzen.
- issue: Identität der Sprecherin und der Aufgezogenen
  choice: grammatisch offen gelassen
  alternative: ausdrückliche Identifizierung als Jerusalem und seine Kinder
  rationale: Der Kontext legt die personifizierte Stadt und ihre Kinder nahe, doch der Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt daher die Bildsprache, ohne die Referenten im Haupttext ergänzend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Syntax. Der Gedankenstrich hebt den schmerzlichen Umschlag von fürsorglichem Aufziehen zur Vernichtung hervor. Die Fußnotenmarker [a] und [b] stehen beide im Haupttext; [b] ist an das Versende gesetzt, weil sie die frühere Wendung „meine Schrecken von ringsum“ erläutert, ohne den Lesefluss dort mit zwei unmittelbar benachbarten Markierungen zu belasten.
