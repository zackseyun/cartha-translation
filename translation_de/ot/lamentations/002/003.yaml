  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: de
  text: In glühendem Zorn schlug er jedes Horn Israels ab[a]; er zog seine rechte Hand dem Feind gegenüber zurück[b]. Er brannte in Jakob wie ein flammendes Feuer, das ringsum alles verzehrte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Horn“ ist im Hebräischen ein Bild für Kraft, Macht oder erhöhte Stellung.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er zog seine rechte Hand vor dem Feind zurück.“ Das Bild bezeichnet wahrscheinlich, dass Gott seine Macht oder seinen Schutz angesichts des Feindes zurücknahm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: schlug … ab
  rationale: Das Verb bezeichnet ein gewaltsames Ab- oder Niederhauen. In Verbindung mit dem Horn gibt „abschlagen“ das konkrete Bild natürlich und kräftig wieder.
- source_word: בָּחֳרִי אַף
  choice: in glühendem Zorn
  rationale: חֳרִי bezeichnet Glut oder Hitze, אַף den Zorn. „Glühender Zorn“ bewahrt die Hitze- und Feuerbildlichkeit des Verses.
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: jedes Horn Israels
  rationale: Das hebräische Bild des Horns als Zeichen von Kraft, Macht oder erhöhter Stellung wird im Haupttext bewahrt und in einer Fußnote erläutert.
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: zog er seine rechte Hand zurück
  rationale: Die Formulierung erhält das körperliche Bild vom Zurücknehmen der wirksamen Macht oder des Schutzes Gottes.
- source_word: מִפְּנֵי אוֹיֵב
  choice: vor dem Feind
  rationale: Die knappe Wiedergabe lässt sowohl die räumliche Vorstellung „angesichts des Feindes“ als auch den Zusammenhang mit dem Rückzug der schützenden Hand erkennen.
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: In Jakob brannte er
  rationale: בער bezeichnet das Brennen; בְּ lokalisiert das zerstörerische Wirken in Jakob. Die ungewöhnliche, aber verständliche Personifikation wird nicht aufgelöst.
- source_word: כְּאֵשׁ לֶהָבָה
  choice: wie ein flammendes Feuer
  rationale: Die Wiedergabe bewahrt die verstärkende Verbindung von Feuer und Flamme in idiomatischem Deutsch.
- source_word: אָכְלָה סָבִיב
  choice: das ringsum alles verzehrte
  rationale: „Verzehren“ entspricht dem häufigen Bild des fressenden Feuers; „alles“ macht den umfassenden Sinn von סָבִיב im Deutschen natürlich deutlich.
theological_decisions:
- issue: Bildsprache des göttlichen Gerichts
  choice: Die Bilder „Horn“, „rechte Hand“ und „flammendes Feuer“ bleiben im Haupttext erhalten.
  alternative: Die Bilder unmittelbar als „Kraft“, „Schutz“ und „Vernichtung“ auszudeuten.
  rationale: Der hebräische Text entfaltet das Gericht durch mehrere aufeinanderfolgende Metaphern. Ihre Beibehaltung wahrt die poetische und theologische Spannung, ohne Gottes Handeln begrifflich zu verengen.
- issue: Gottes zurückgezogene rechte Hand
  choice: Der Text spricht vom Zurückziehen der rechten Hand und erläutert in der Fußnote nur die naheliegende Bildbedeutung.
  alternative: Im Haupttext ausdrücklich zu sagen, Gott habe Israel seine Macht oder seinen Schutz entzogen.
  rationale: Das Bild kann Macht, Eingreifen und Schutz zugleich umfassen. Eine ausdeutende Haupttextfassung würde diese Bedeutungsbreite unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzfolge. Das Präteritum entspricht dem erzählenden Rückblick des Klagelieds; die markanten hebräischen Metaphern bleiben erhalten und werden nur dort erläutert, wo sie modernen Lesern missverständlich sein könnten.
