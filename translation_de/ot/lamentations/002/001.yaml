source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: de
  text: Wie hat der Herr in seinem Zorn die Tochter Zion mit einer Wolke verhüllt![a] Er hat die Pracht Israels[b] vom Himmel auf die Erde hinabgeworfen und an dem Tag seines Zorns nicht an seinen Fußschemel[c] gedacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verdunkelt“ oder „mit Wolken bedeckt“. Das hebräische Verb ruft das Bild einer Wolke hervor, die etwas bedeckt oder verdunkelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Herrlichkeit Israels“ oder „die Schönheit Israels“.'
    reason: lexical_alternative
  - marker: c
    text: „Sein Fußschemel“ kann sich auf Zion, den Tempel oder die Bundeslade beziehen, die mit Gottes irdischer Gegenwart verbunden sind.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie
  rationale: Leitet einen klagenden Ausruf ein, keine Informationsfrage. Das knappe „Wie“ bewahrt die poetische Form.
- source_word: יָעִיב
  choice: mit Wolken bedeckt
  rationale: Gibt das Bild des Verdunkelns oder Verhüllens durch eine Wolke wieder, ohne es interpretierend aufzugeben.
- source_word: בְּאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bezeichnet idiomatisch Zorn; die Wiedergabe ist klar, würdevoll und bewahrt das wiederholte Motiv.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Das hebräische Hoheitsprädikat wird als geläufiger deutscher Gottestitel wiedergegeben.
- source_word: בַּת צִיּוֹן
  choice: die Tochter Zion
  rationale: Bewahrt die Personifikation Zions und klingt im Deutschen zugleich natürlich und poetisch.
- source_word: הִשְׁלִיךְ
  choice: hinabgeworfen
  rationale: Drückt die gewaltsame Bewegung aus und verdeutlicht innerhalb des deutschen Satzes den Gegensatz zwischen Himmel und Erde.
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: vom Himmel auf die Erde
  rationale: Bewahrt den dramatischen Abstieg von der Höhe in die Erniedrigung.
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: die Pracht Israels
  rationale: תפארת umfasst Pracht, Herrlichkeit und Schönheit. „Pracht“ erhält den poetischen Sinn, ohne den konkreten Bezug festzulegen.
- source_word: וְלֹא זָכַר
  choice: und … nicht an … gedacht
  rationale: Die deutsche Wendung „an etwas denken“ gibt זכר direkt wieder und bewahrt dessen möglichen theologischen Nachklang.
- source_word: הֲדֹם רַגְלָיו
  choice: seinen Fußschemel
  rationale: Bewahrt das metaphorische Bild, ohne vorschnell Zion, Tempel oder Bundeslade als einzigen Bezug festzulegen.
- source_word: בְּיוֹם אַפּוֹ
  choice: an dem Tag seines Zorns
  rationale: Erhält die Zeitangabe und die bewusste Wiederholung des Zornmotivs.
theological_decisions:
- issue: Bezug von „seinem Fußschemel“
  choice: Das Bild „seinen Fußschemel“ bleibt im Haupttext unaufgelöst.
  alternative: Eine ausdrückliche Deutung als Zion, Tempel oder Bundeslade.
  rationale: Der hebräische Text nennt den Bezug nicht eindeutig. Die bildhafte Form bewahrt die mögliche Mehrdeutigkeit hinsichtlich des Ortes von Gottes irdischer Gegenwart.
- issue: Bezug von „die Pracht Israels“
  choice: Der Ausdruck bleibt ohne konkrete Identifizierung stehen.
  alternative: Ausdrückliche Gleichsetzung mit Jerusalem, dem Tempel oder Israels geehrtem Zustand.
  rationale: תִּפְאֶרֶת יִשְׂרָאֵל lässt sowohl einen konkreten als auch einen umfassenderen poetischen Bezug zu; der Vers entscheidet dies nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Satzführung. Die Personifikation „Tochter Zion“, das Wolkenbild und der „Fußschemel“ bleiben erhalten; unklare Bezüge werden nicht dogmatisch festgelegt. Die Fußnotenmarker stehen jeweils unmittelbar bei dem erläuterten Ausdruck.
