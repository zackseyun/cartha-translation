source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: de
  text: Er verwüstete seine Hütte wie einen Garten[a], zerstörte seine Versammlungsstätte[b]. Jahwe ließ in Zion Festzeit[c] und Sabbat in Vergessenheit geraten; im Grimm seines Zorns verwarf er König und Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Laube“ oder „sein Schutzdach“. Der genaue Bezug des hebräischen Ausdrucks ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen festgesetzten Versammlungsort“; möglicherweise „sein Zelt der Begegnung“. Es ist dasselbe hebräische Wort wie das anschließend als „Festzeit“ wiedergegebene, hier jedoch in einer Form mit der Bedeutung „sein Versammlungsort“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „festgesetzte Zeit“ oder „Fest“. Zusammen mit „Sabbat“ sind hier wahrscheinlich die festgelegten Festzeiten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: verwüstete
  rationale: Das Piel von חמס bezeichnet hier gewaltsames Verderben. „Verwüstete“ gibt die zerstörerische Gewalt natürlich und prägnant wieder.
- source_word: כַּגַּן
  choice: wie einen Garten
  rationale: Die ausdrückliche Vergleichspartikel wird bewahrt, ohne das schwierige Bild erklärend aufzulösen.
- source_word: שֻׂכּוֹ
  choice: seine Hütte
  rationale: Der Ausdruck bezeichnet eine Hütte, Laube oder einen Schutzbau. „Hütte“ bewahrt das konkrete, vergängliche Bild und vermeidet eine vorschnelle technische Gleichsetzung mit der Stiftshütte.
- source_word: שִׁחֵת
  choice: zerstörte
  rationale: Im Zusammenhang der Verwüstung Zions bezeichnet das Verb konkrete Vernichtung.
- source_word: מוֹעֲדוֹ
  choice: seine Versammlungsstätte
  rationale: 'Als Objekt von „zerstörte“ ist hier wahrscheinlich die räumliche Bedeutung gemeint: der festgesetzte Ort der Zusammenkunft. Zugleich bleibt die Wortverbindung zum folgenden מוֹעֵד erkennbar.'
- source_word: שִׁכַּח
  choice: ließ ... in Vergessenheit geraten
  rationale: Die kausative Form wird im Deutschen idiomatisch wiedergegeben und drückt aus, dass Jahwes Gericht die gottesdienstliche Begehung zum Erliegen brachte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Direkte lokative Wiedergabe.
- source_word: מוֹעֵד
  choice: Festzeit
  rationale: In der Verbindung mit „Sabbat“ liegt die zeitlich-kultische Bedeutung nahe. „Festzeit“ bewahrt sowohl den festgesetzten Zeitpunkt als auch den festlichen Charakter.
- source_word: וְשַׁבָּת
  choice: und Sabbat
  rationale: Schlichte, im Deutschen geläufige Wiedergabe des kultischen Ruhetags.
- source_word: וַיִּנְאַץ
  choice: verwarf
  rationale: Das Verb bezeichnet verächtliche Zurückweisung. „Verwarf“ ist würdig, verständlich und trägt den Aspekt entschiedener Ablehnung.
- source_word: בְּזַעַם אַפּוֹ
  choice: im Grimm seines Zorns
  rationale: Die Verbindung zweier Zornesausdrücke wird als verstärkende Wendung erhalten, ohne sie einzuebnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen.
- issue: Deutung von מוֹעֲדוֹ im ersten Halbvers
  choice: 'räumlich: „seine Versammlungsstätte“'
  alternative: 'zeitlich: „seine Festzeit“; kultisch-technisch: „sein Zelt der Begegnung“'
  rationale: Das Verb „zerstören“ und die folgende, gesonderte Nennung von מוֹעֵד neben dem Sabbat sprechen hier für einen Ort der Zusammenkunft. Die Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Referenz von שֻׂכּוֹ
  choice: 'allgemein-kultisch: „seine Hütte“'
  alternative: sein Schutzdach; seine Laube; seine Stiftshütte
  rationale: Der genaue Bezug ist umstritten. Die Übersetzung bewahrt das konkrete Bild, ohne den Ausdruck dogmatisch oder institutionell zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Verdichtung. Das schwierige Gartenbild und das Wortspiel zwischen Versammlungsstätte und Festzeit bleiben erhalten; semantische Unsicherheiten werden durch Fußnoten sichtbar gemacht.
