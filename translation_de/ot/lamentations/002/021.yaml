  variant: modern standard German
source:
  edition: WLC
  text: שָׁכְב֨וּ לָ/אָ֤רֶץ חוּצוֹת֙ נַ֣עַר וְ/זָקֵ֔ן בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י נָפְל֣וּ בֶ/חָ֑רֶב הָרַ֨גְתָּ֙ בְּ/י֣וֹם אַפֶּ֔/ךָ טָבַ֖חְתָּ לֹ֥א חָמָֽלְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: de
  text: Jung und Alt liegen auf dem Boden in den Straßen; meine jungen Frauen[a] und meine jungen Männer sind durch das Schwert gefallen. Du hast sie am Tag deines Zorns getötet, hast sie abgeschlachtet, ohne sie zu verschonen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „meine Jungfrauen“; gemeint sein können unverheiratete junge Frauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne Mitleid“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ חוּצוֹת
  choice: liegen auf dem Boden in den Straßen
  rationale: Das hebräische Perfekt beschreibt hier anschaulich den eingetretenen Zustand der Toten. „Auf dem Boden“ gibt die konkrete Lage wieder; חוּצוֹת bezeichnet die öffentlichen Straßen oder Plätze der Stadt.
- source_word: נַעַר וְזָקֵן
  choice: Jung und Alt
  rationale: Die idiomatische Paarformel umfasst Menschen unterschiedlichen Alters und wird im Deutschen natürlich als „Jung und Alt“ wiedergegeben.
- source_word: בְּתוּלֹתַי
  choice: meine jungen Frauen
  rationale: בְּתוּלָה kann eine Jungfrau beziehungsweise unverheiratete junge Frau bezeichnen. „Junge Frauen“ ist im heutigen Deutsch natürlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: וּבַחוּרַי
  choice: meine jungen Männer
  rationale: בָּחוּר bezeichnet hier junge Männer in der Blüte ihrer Kraft.
- source_word: נָפְלוּ בֶחָרֶב
  choice: sind durch das Schwert gefallen
  rationale: Die geläufige Wendung für gewaltsamen Tod wird mit ihrem konkreten Schwertbild bewahrt.
- source_word: הָרַגְתָּ
  choice: Du hast sie ... getötet
  rationale: Die zweite Person Singular richtet die Anklage unmittelbar an Gott. Das Objekt „sie“ ergibt sich aus dem Zusammenhang und ist im Deutschen zur Klarheit ergänzt.
- source_word: בְּיוֹם אַפֶּךָ
  choice: am Tag deines Zorns
  rationale: אַף bezeichnet hier heftigen Zorn. Die traditionelle, aber weiterhin verständliche Wendung bewahrt den gewichtigen Ton des Klagelieds.
- source_word: טָבַחְתָּ
  choice: hast sie abgeschlachtet
  rationale: Das starke Verb steigert gegenüber „getötet“ die Darstellung der Gewalt; „abgeschlachtet“ wahrt diese Härte.
- source_word: לֹא חָמָלְתָּ
  choice: ohne sie zu verschonen
  rationale: Das Verb חמל kann hier das Nichtverschonen oder fehlendes Mitleid ausdrücken. Die gewählte Fassung folgt eng der verbalen Aussage.
theological_decisions:
- issue: Unmittelbare Zuschreibung des Tötens an Gott
  choice: „Du hast sie ... getötet, hast sie abgeschlachtet“
  alternative: Eine passive oder unpersönliche Formulierung, die Gottes unmittelbare Täterschaft abschwächt
  rationale: Der hebräische Text redet Gott direkt als Handelnden an. Diese theologische Spannung der Klage wird nicht geglättet.
- issue: Bedeutungsnuance von לֹא חָמָלְתָּ
  choice: „ohne sie zu verschonen“
  alternative: „ohne Mitleid“
  rationale: Beide Nuancen sind sprachlich möglich. Der Haupttext gibt das konkrete Nichtverschonen wieder; die emotionale Nuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen und erschütternden Bildsprache des Klagelieds. Die direkte Anrede Gottes und die Steigerung von „getötet“ zu „abgeschlachtet“ bleiben erhalten.
