id: LAM.2.10
reference: Lamentations 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: de
  text: Die Ältesten der Tochter Zion[a] sitzen schweigend auf der Erde; sie haben Staub auf ihr Haupt gestreut und Sacktuch angelegt; die Jungfrauen Jerusalems[b] haben ihr Haupt zur Erde gesenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tochter Zion“ ist eine poetische Personifikation Zions beziehungsweise Jerusalems.
    reason: cultural_note
  - marker: b
    text: 'Oder: „die jungen unverheirateten Frauen Jerusalems“. Das hebräische Wort bezeichnet hier Jungfrauen als eine gesellschaftliche Gruppe in der Trauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ
  choice: sitzen auf der Erde
  rationale: Die Verbindung bezeichnet in dieser Trauerszene konkret das Sitzen auf dem Boden. „Erde“ bewahrt zugleich die Wiederholung von לָאָרֶץ im letzten Versglied.
- source_word: יִדְּמוּ
  choice: schweigend
  rationale: Das Verb bezeichnet hier Schweigen beziehungsweise reglose Stille aus Trauer. Die adverbiale Wiedergabe ist im Deutschen natürlich und legt nicht mehr fest als der Kontext.
- source_word: זִקְנֵי
  choice: die Ältesten
  rationale: „Älteste“ erfasst sowohl das Alter als auch die mögliche gesellschaftliche Stellung, ohne die Männer ausschließlich als Amtsträger zu deuten.
- source_word: בַת צִיּוֹן
  choice: Tochter Zion
  rationale: Die poetische Personifikation Zions beziehungsweise Jerusalems bleibt erhalten und wird nicht durch eine erklärende Paraphrase ersetzt.
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: sie haben Staub auf ihr Haupt gestreut
  rationale: Die Formulierung gibt die konkrete Trauergeste verständlich wieder. Das kollektiv gebrauchte Singularwort „Haupt“ entspricht der hebräischen Bildsprache.
- source_word: חָגְרוּ שַׂקִּים
  choice: Sacktuch angelegt
  rationale: Wörtlich wird das Sacktuch umgegürtet; „angelegt“ ist eine natürliche deutsche Wiedergabe der Kleidungshandlung und bewahrt den traditionellen Ausdruck für das Trauergewand.
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: haben ihr Haupt zur Erde gesenkt
  rationale: Die Wendung bewahrt die körperliche Bewegung und das Bild tiefer Trauer und Demütigung, ohne den Sinn durch „sich verbeugen“ einzuengen.
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: die Jungfrauen Jerusalems
  rationale: „Jungfrauen“ gibt die spezifische Grundbedeutung von בְּתוּלוֹת wieder; die mögliche kontextuelle Wiedergabe als junge unverheiratete Frauen wird in der Fußnote genannt.
theological_decisions:
- issue: Poetische Personifikation Zions
  choice: „Tochter Zion“ wird wörtlich bewahrt.
  alternative: „die Stadt Zion“ oder „Jerusalem“
  rationale: Der hebräische Text personifiziert Zion. Eine Auflösung in den Stadtnamen würde die poetische Spannung und das Bild einer trauernden weiblichen Gestalt abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter poetischer Bildsprache. Die dreigliedrige Satzform und die Wiederholung von „Erde“ spiegeln den hebräischen Aufbau; „Haupt“ erhält den feierlich-poetischen Ton, ohne altertümliche Verbformen zu verwenden.
