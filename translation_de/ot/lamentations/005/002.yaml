  text: Our inheritance has been turned over to strangers[a], our houses to foreigners.
translation:
  language: de
  text: Unser Erbbesitz ist an Fremde übergegangen[a], unsere Häuser an Ausländer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Unser Erbbesitz ist zu Fremden hin gewendet worden, unsere Häuser zu Ausländern.“ Das hebräische Verb bezeichnet ein Gewendet- oder Verändertwerden; im Zusammenhang ist wahrscheinlich gemeint, dass der Besitz in fremde Hände überging.'
