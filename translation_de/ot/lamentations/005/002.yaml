lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: unser Erbbesitz
  rationale: „Erbbesitz“ bewahrt sowohl den Gedanken des Erbes als auch den konkreten Bezug auf den zugeteilten Landbesitz.
- source_word: נֶהֶפְכָה
  choice: ist … übergegangen
  rationale: Das Nifal von הפך bezeichnet ein Gewendet- oder Verändertwerden. Im Zusammenhang mit Land und Häusern gibt „übergegangen“ den eingetretenen Besitzwechsel natürlich wieder, ohne einen menschlichen Urheber ausdrücklich zu nennen.
- source_word: לְזָרִים
  choice: an Fremde
  rationale: זָרִים bezeichnet Menschen außerhalb der eigenen Gemeinschaft. „Fremde“ ist im Deutschen verständlich und lässt die soziale wie ethnische Abgrenzung offen.
- source_word: בָּתֵּינוּ
  choice: unsere Häuser
  rationale: „Häuser“ entspricht der konkreten Grundbedeutung und erhält den poetischen Parallelismus.
- source_word: לְנָכְרִים
  choice: an Ausländer
  rationale: נָכְרִים betont die fremde Herkunft. „Ausländer“ unterscheidet den Ausdruck vom vorausgehenden „Fremde“ und bildet damit den hebräischen Wortwechsel ab.
