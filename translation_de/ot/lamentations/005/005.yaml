  yaml_path: translation/ot/lamentations/005/005.yaml
  text: We are pursued at our necks[a]; we are weary[b]; no rest is given to us.
translation:
  language: de
  text: Man sitzt uns im Nacken[a]; wir sind erschöpft; Ruhe wird uns nicht gewährt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Auf unseren Nacken werden wir verfolgt.« Das Hebräische bewahrt ein eindringliches Nackenbild und schildert die Verfolger als unmittelbar bedrängend.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Man lässt uns keine Ruhe« oder »Keine Ruhe wird uns gelassen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  choice: Man sitzt uns im Nacken
  rationale: Die deutsche Wendung bewahrt das konkrete Bild vom Nacken und vermittelt natürlich den feindlichen Druck einer unmittelbar nachsetzenden Verfolgung. Das unbestimmte „man“ gibt die passive Form wieder, ohne die Verfolger näher zu bestimmen.
- source_word: נִרְדָּפְנוּ
  choice: sitzt uns … im Nacken
  rationale: Das Niphal von רדף bezeichnet das Verfolgtwerden. Zusammen mit עַל צַוָּארֵינוּ wird dies im Deutschen idiomatisch als ein bedrängendes Nachsetzen ausgedrückt.
- source_word: יָגַעְנוּ
  choice: wir sind erschöpft
  rationale: יגע bezeichnet hier den durch unablässige Bedrängnis entstandenen Zustand der Ermüdung. „Erschöpft“ ist in diesem Zusammenhang natürlich und kräftig, ohne einen bloßen Arbeitsvorgang zu unterstellen.
- source_word: לֹא הוּנַח לָנוּ
  choice: Ruhe wird uns nicht gegönnt
  rationale: Das Hophal von נוח drückt aus, dass keine Ruhe gewährt oder ermöglicht wird. „Nicht gegönnt“ gibt die passive, von äußeren Bedrängern bestimmte Lage prägnant wieder.
