  register: Modernes, würdiges Standarddeutsch. Die idiomatische Formulierung „im Nacken sitzen“ erhält das hebräische Körperbild und die unmittelbare Bedrängnis; die Fußnote dokumentiert die ungewöhnlichere, formnähere Wortstellung. Die kurzen Hauptsätze entsprechen dem knappen Klagecharakter des Verses.
