  text: Because of this our heart has become sick[a]; because of these things our eyes have grown dim.
translation:
  language: de
  text: Darum ist unser Herz krank geworden[a]; darum sind unsere Augen dunkel geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum wurde unser Herz matt; darum wurden unsere Augen dunkel.“'
