lexical_decisions:
- source_word: עַל זֶה
  choice: Darum
  rationale: Die Präposition עַל mit זֶה bezeichnet hier den Grund. „Darum“ gibt diesen kausalen Bezug knapp und natürlich wieder und bewahrt zugleich den Bezug auf das zuvor beklagte Unheil.
- source_word: הָיָה דָוֶה
  choice: ist … krank geworden
  rationale: היה mit dem prädikativen Adjektiv דָוֶה beschreibt einen eingetretenen und fortbestehenden Zustand. Das deutsche Perfekt erfasst Ergebnis und Gegenwartsbezug; „krank“ bewahrt die körperlich-seelische Metaphorik.
- source_word: לִבֵּנוּ
  choice: unser Herz
  rationale: „Herz“ entspricht dem hebräischen Bild für das innere Erleben und ist im Deutschen unmittelbar verständlich.
- source_word: עַל אֵלֶּה
  choice: deswegen
  rationale: Die Wiederholung von עַל setzt den kausalen Parallelismus fort. „Deswegen“ verweist natürlich auf die zuvor genannten Ereignisse, ohne dem Hebräischen zusätzliche Inhalte hinzuzufügen.
- source_word: חָשְׁכוּ
  choice: sind … trübe geworden
  rationale: Das Verb bezeichnet wörtlich ein Dunkelwerden. Bei Augen gibt „trübe geworden“ das Bild idiomatisch wieder, ohne eindeutig zwischen Trauer, Erschöpfung und nachlassender Sehkraft zu entscheiden.
- source_word: עֵינֵינוּ
  choice: unsere Augen
  rationale: Die wörtliche Wiedergabe erhält die parallele körperliche Bildsprache des Verses.
theological_decisions: []
