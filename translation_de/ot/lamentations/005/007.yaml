  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Kontrast des Hebräischen zuverlässig wieder: „Unsere Väter“ entspricht אֲבֹתֵינוּ, „haben gesündigt“ dem Perfekt חָטְאוּ, und „doch wir“ erhält den hervorgehobenen Gegensatz durch אֲנַחְנוּ. „Sie sind nicht mehr da“ gibt אֵינָם kontextgerecht wieder, ohne die Aussage stärker als nötig auf den Tod festzulegen. „Wir tragen ihre Schuld“ bewahrt das Lastbild von סבל und die bewusst mehrdeutige Semantik von עָוֹן.'
