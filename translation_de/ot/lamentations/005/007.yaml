  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: de
  text: Unsere Väter haben gesündigt; sie sind nicht mehr da, doch wir tragen ihre Schuld.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir tragen die Strafe beziehungsweise die Folgen ihrer Vergehen.“ Das hebräische Wort kann das Vergehen selbst, die daraus entstehende Schuld oder deren belastende Folgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: Unsere Väter
  rationale: אָבוֹת bezeichnet wörtlich die Väter und kann zugleich frühere Generationen bzw. Vorfahren einschließen. „Unsere Väter“ bewahrt die familiäre und gemeinschaftliche Aussage des Hebräischen.
- source_word: חָטְאוּ
  choice: haben gesündigt
  rationale: Das Qal Perfekt von חטא bezeichnet begangene Sünde. Das deutsche Perfekt klingt hier natürlich und stellt die vergangene Tat mit ihrer fortwirkenden Bedeutung heraus.
- source_word: אֵינָם
  choice: sie sind nicht mehr da
  rationale: Die Form bedeutet wörtlich „sie sind nicht“ und besagt im Zusammenhang idiomatisch, dass die Väter nicht mehr leben bzw. nicht mehr gegenwärtig sind. „Sie sind nicht mehr da“ ist klar, würdig und lässt die genaue Nuance offen.
- source_word: אֲנַחְנוּ
  choice: wir
  rationale: Das selbstständige Pronomen hebt die gegenwärtige Generation kontrastiv hervor. Dieser Gegensatz wird im Deutschen durch „doch wir“ deutlich wiedergegeben.
- source_word: עֲוֺנֹתֵיהֶם
  choice: ihre Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus erwachsende Strafe bzw. Last bezeichnen. Das kollektive deutsche „Schuld“ ist idiomatischer als eine künstliche Pluralbildung und bewahrt einen erheblichen Teil dieser Bedeutungsbreite; die Fußnote nennt die weiteren Möglichkeiten.
- source_word: סָבָלְנוּ
  choice: wir tragen
  rationale: סבל bedeutet eine Last tragen oder erdulden. „Wir tragen“ erhält das konkrete Lastbild und passt natürlich zu „Schuld“.
theological_decisions:
- issue: Ob der Vers eine unmittelbare Übertragung der Schuld oder das Tragen der Folgen früherer Sünden aussagt
  choice: „wir tragen ihre Schuld“
  alternative: „wir tragen die Strafe bzw. die Folgen ihrer Schuld“
  rationale: Das hebräische עָוֹן kann Tat, Schuld und deren belastende Folgen umfassen. Die Hauptzeile legt sich daher nicht darauf fest, ob ererbte Schuld, Strafe oder geschichtliche Folgen gemeint sind, sondern bewahrt die Spannung des Klagewortes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klage-Ton. Das Perfekt und „nicht mehr da“ vermeiden unnötige Altertümlichkeit; das Semikolon und „doch“ machen den starken Generationenkontrast natürlich sichtbar.
