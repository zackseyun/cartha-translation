  terminology: '„Väter“, „sündigen“ und „Schuld tragen“ sind sachgerecht und registerstimmig. Das deutsche Kollektivsingular „Schuld“ ist bei dem mehrdeutigen hebräischen Plural עֲוֹנֹתֵיהֶם vertretbar: Es kann Schuld bzw. Schuldlast bezeichnen, ohne zwischen Vergehen, Schuld und Folgen dogmatisch zu entscheiden. Die Fußnote erläutert diese Breite angemessen.'
