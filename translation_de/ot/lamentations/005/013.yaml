lexical_decisions:
- source_word: בַּחוּרִים
  choice: Junge Männer
  rationale: Bezeichnet junge erwachsene Männer in der Kraft ihrer Jugend. „Junge Männer“ ist im modernen Deutschen natürlich und legt keine genauere Altersstufe fest.
- source_word: טְחוֹן
  choice: Mahlsteine
  rationale: Das Wort gehört zum Bedeutungsfeld des Mahlens. In Verbindung mit „tragen“ liegt ein Mahlgerät beziehungsweise dessen schwere Steine nahe; die mögliche Bedeutung „Mahlarbeit“ bleibt in der Fußnote erhalten.
- source_word: נָשָׂאוּ
  choice: trugen
  rationale: Das Verb bedeutet „heben, tragen, eine Last auf sich nehmen“. Das schlichte „trugen“ bewahrt das konkrete Lastmotiv, ohne einen Zwang ausdrücklich in das Verb einzutragen.
- source_word: וּנְעָרִים
  choice: und Jungen
  rationale: Die Bezeichnung unterscheidet diese Gruppe wahrscheinlich von den zuvor genannten jungen Männern und lässt an jüngere männliche Personen denken. „Jungen“ gibt diesen Kontrast klar und gegenwärtig wieder.
- source_word: בָּעֵץ
  choice: unter Holzlasten
  rationale: Wörtlich steht eine Präpositionalverbindung mit „Holz“. Im Zusammenhang bezeichnet sie wahrscheinlich die Last des getragenen Holzes. „Unter Holzlasten“ macht das Bild im Deutschen verständlich, während die wörtlicheren Möglichkeiten in der Fußnote genannt werden.
- source_word: כָּשָׁלוּ
  choice: taumelten
  rationale: Das Verb bezeichnet Straucheln oder Kraftloswerden. „Taumelten“ vermittelt das körperliche Wanken unter der Last, ohne bereits ein vollständiges Zusammenbrechen zu behaupten.
