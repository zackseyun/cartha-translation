translation:
  language: de
  text: Junge Männer trugen Mahlsteine[a], und Jungen taumelten unter Holz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Junge Männer verrichteten Mahlarbeit“ oder „Junge Männer trugen einen Mahlstein“. Das hebräische Wort ist mit dem Mahlen verbunden und kann die Arbeit oder ein Mahlgerät bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „strauchelten am/mit dem Holz“. Wahrscheinlich beschreibt dies Jungen, die unter getragenem Holz ins Taumeln gerieten.'
