  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Servants rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: de
  text: Sklaven herrschen über uns; niemand entreißt uns ihrer Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: Das Wort kann sowohl Diener als auch Sklaven bezeichnen. Hier bringt „Sklaven“ die beklagte soziale Umkehrung und Erniedrigung am deutlichsten zum Ausdruck.
- source_word: מָשְׁלוּ בָנוּ
  choice: herrschen über uns
  rationale: משׁל mit ב bezeichnet die Ausübung von Herrschaft über jemanden. Die deutsche Wendung ist natürlich und bewahrt den bedrückenden Sinn.
- source_word: פֹּרֵק
  choice: entreißt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der aus fremder Gewalt befreit. „Entreißt“ gibt die aktive Befreiung wieder und passt zur anschließenden Hand-Metapher.
- source_word: אֵין
  choice: niemand
  rationale: Die verneinte Existenz eines Befreiers lässt sich im Deutschen knapp und idiomatisch mit „niemand“ ausdrücken.
- source_word: מִיָּדָם
  choice: ihrer Hand
  rationale: „Hand“ bezeichnet bildhaft Macht oder Gewalt. Das Bild bleibt im Deutschen verständlich und wird daher bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und das drastische Bild sozialer Erniedrigung bleiben erhalten.
