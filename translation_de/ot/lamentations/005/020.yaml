  text: לָ֤/מָּה לָ/נֶ֨צַח֙ תִּשְׁכָּחֵ֔/נוּ תַּֽעַזְבֵ֖/נוּ לְ/אֹ֥רֶךְ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: de
  text: Warum vergisst du uns für immer? Warum lässt du uns so lange im Stich?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „für die Länge von Tagen“, eine Wendung für eine lange Zeit oder viele Tage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Das Frageadverb leitet die klagende Frage unmittelbar und natürlich ein.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Präposition ל mit נֶצַח bezeichnet eine unbegrenzte Dauer; „für immer“ wahrt die rhetorische Schärfe der Klage.
- source_word: תִּשְׁכָּחֵנוּ
  choice: vergisst du uns
  rationale: Das Qal-Imperfekt der 2. Person Singular mit Objekt der 1. Person Plural wird im Zusammenhang als gegenwärtig andauernde Klage wiedergegeben; eine futurische Nuance bleibt grundsätzlich möglich.
- source_word: תַּעַזְבֵנוּ
  choice: verlässt du uns
  rationale: עזב bedeutet hier „verlassen, im Stich lassen“. „Verlassen“ ist natürliches, würdevolles Deutsch und bewahrt den ernsten Ton, ohne unnötig altertümlich zu wirken.
- source_word: לְאֹרֶךְ יָמִים
  choice: so lange
  rationale: Wörtlich „für die Länge von Tagen“; die idiomatische deutsche Wiedergabe „so lange“ drückt die schmerzlich empfundene lange Dauer knapp und natürlich aus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klagecharakter. Die parallelen Fragen und der Wechsel von „für immer“ zu „so lange“ bewahren sowohl die Steigerung als auch die konkrete Dauerangabe des Hebräischen.
