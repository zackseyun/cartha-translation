source:
  edition: WLC
  text: אַתָּ֤ה יְהוָה֙ לְ/עוֹלָ֣ם תֵּשֵׁ֔ב כִּסְאֲ/ךָ֖ לְ/דֹ֥ר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: de
  text: Du aber, Jahwe, thronst[a] für immer; dein Thron bleibt von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „du sitzt“; auch möglich: „du bleibst“. Im Zusammenhang mit dem Thron hat das Verb hier königlichen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: Du aber
  rationale: Das selbstständige, vorangestellte Pronomen ist betont und bildet im Zusammenhang einen Kontrast. „Du aber“ gibt diese Hervorhebung im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier unbegrenzte Dauer; „für immer“ ist modern, klar und poetisch angemessen.
- source_word: תֵּשֵׁב
  choice: thronst
  rationale: Das Verb bedeutet wörtlich „sitzen“ und kann auch „bleiben/wohnen“ bedeuten. Durch den parallelen Hinweis auf Gottes Thron tritt hier der königliche Sinn hervor.
- source_word: כִּסְאֲךָ
  choice: dein Thron
  rationale: Direkte Wiedergabe des Substantivs mit dem Suffix der 2. Person Singular.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die hebräische Paarformel bezeichnet ununterbrochene Dauer über alle aufeinanderfolgenden Generationen hinweg.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Königlicher Sinn von ישׁב
  choice: thronst
  alternative: bleibst
  rationale: „Thron“ im parallelen zweiten Versglied legt den königlichen Sinn nahe. Die Fußnote bewahrt zugleich die wörtliche Bedeutung und die mögliche Nuance des Bleibens.
- issue: Fehlendes ausdrückliches Verb im zweiten Versglied
  choice: besteht
  alternative: ist
  rationale: Im Hebräischen ist das zweite Versglied nominal formuliert. Das im Deutschen ergänzte „besteht“ macht die ausgesagte fortdauernde Geltung des Thrones natürlich verständlich, ohne ein eigenständiges hebräisches Verb vorzutäuschen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Parallelstruktur. „Thronen“ erhält das königliche Bild; „von Generation zu Generation“ bewahrt die hebräische Wiederholungsformel.
