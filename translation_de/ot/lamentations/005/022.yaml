translation:
  language: de
  text: es sei denn, du hast uns völlig verworfen und bist überaus zornig auf uns[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wenn du uns völlig verworfen hast und überaus zornig auf uns bist …“ Dann wird die Zeile als bedingte Begründung verstanden und nicht als Ausnahme von der Bitte im vorhergehenden Vers.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „gegen uns“ oder „über uns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Die Verbindung kann im Anschluss an die Bitte in Vers 21 eine Ausnahme oder Einschränkung einleiten. „Es sei denn“ gibt diesen offenen, spannungsvollen Satzanschluss im Deutschen natürlich wieder.
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: du hast uns völlig verworfen
  rationale: Der absolute Infinitiv neben der finiten Form desselben Verbs verstärkt die Aussage. „Völlig verworfen“ bewahrt sowohl die Intensivierung als auch den im Klage- und Bundeszusammenhang passenden Sinn von מאס.
- source_word: קָצַפְתָּ
  choice: bist … zornig
  rationale: Das Qatal bezeichnet hier einen eingetretenen und fortwirkenden Zustand. Die deutsche Zustandsformulierung „bist zornig“ klingt natürlich und passt zum abschließenden Klageruf.
- source_word: עָלֵינוּ
  choice: auf uns
  rationale: Bei Zorn bezeichnet על die Zielrichtung. „Zornig auf uns“ ist im modernen Standarddeutsch idiomatisch und bleibt näher an der hebräischen Präposition als „zornig über uns“.
- source_word: עַד מְאֹד
  choice: überaus
  rationale: Die Wendung verstärkt den Zorn stark. „Überaus“ erhält den gehobenen poetischen Ton, ohne unverständlich oder übermäßig altertümlich zu wirken.
theological_decisions:
- issue: Ob der Vers als Ausnahme zur Bitte in Vers 21 oder als eigenständige Feststellung zu verstehen ist
  choice: 'Ausnahmesatz: „es sei denn, du hast uns völlig verworfen …“'
  alternative: 'Begründende oder eigenständige Aussage: „Denn du hast uns völlig verworfen …“ beziehungsweise „Doch du hast uns völlig verworfen …“'
  rationale: כִּי אִם lässt hier eine exceptive Deutung zu, die den Gedanken von Vers 21 fortführt. Diese Wiedergabe bewahrt die offene theologische Spannung am Ende des Buches, ohne endgültige Verwerfung zu behaupten oder auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. Der unvollständige, offene Charakter des hebräischen Schlusses bleibt durch den einleitenden Ausnahmesatz erhalten; die Interpunktion folgt der Vorlage als Abschluss des Gedichts.
