  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: de
  text: Führe uns zu dir zurück, Jahwe, und wir kehren zurück[a]; erneuere unsere Tage wie in früherer Zeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir zurückkehren“; auch möglich: „und wir werden zurückkehren“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „wie früher“ oder „wie in alter Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: Führe uns zurück
  rationale: Der Hifil-Imperativ von שׁוב mit dem Suffix der 1. Person Plural bezeichnet ein Veranlassen zur Rückkehr. „Führe uns zurück“ bewahrt das Bewegungsbild und klingt als Bitte natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל mit Suffix bezeichnet die Richtung auf Gott hin; „zu dir“ gibt dies direkt und idiomatisch wieder.
- source_word: וְנָשׁוּב
  choice: dann kehren wir zurück
  rationale: Das mit וְ angeschlossene Imperfekt kann die Folge der erbetenen göttlichen Handlung ausdrücken. „Dann“ bewahrt diesen Zusammenhang, ohne ihn eindeutig als Zweck oder Verheißung festzulegen.
- source_word: חַדֵּשׁ
  choice: erneuere
  rationale: Der Piel-Imperativ von חדש bedeutet „erneuern“ oder „wieder neu machen“; „erneuere“ ist direkt und im poetischen Gebet angemessen.
- source_word: יָמֵינוּ
  choice: unsere Tage
  rationale: Die konkrete hebräische Wendung wird beibehalten, auch wenn sie umfassender auf die Lebensverhältnisse bezogen sein kann.
- source_word: כְּקֶדֶם
  choice: wie in früherer Zeit
  rationale: Die Wendung verweist auf die frühere Zeit beziehungsweise den einstigen Zustand. Die gewählte Formulierung ist klar, würdig und modern.
theological_decisions:
- issue: Verhältnis zwischen Gottes Handeln und der menschlichen Rückkehr in וְנָשׁוּב
  choice: „dann kehren wir zurück“ als Folge der erbetenen Rückführung
  alternative: „damit wir zurückkehren“ oder „und wir werden zurückkehren“
  rationale: Der hebräische Anschluss lässt sowohl eine koordinierte Aussage als auch eine Folge- oder Zweckbeziehung zu. Die Hauptfassung stellt Gottes vorausgehendes Handeln heraus, während die Fußnote die engere Zweckdeutung offenhält, ohne die Spannung dogmatisch aufzulösen.
translation_notes:
  register: Moderne, würdige Gebetssprache mit parallelem Satzbau. Das konkrete Bild von Rückkehr und die poetische Wendung „unsere Tage“ bleiben erhalten.
