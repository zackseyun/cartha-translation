  yaml_path: translation/ot/lamentations/005/009.yaml
  text: At the risk of our lives we get our bread[b][a], because of the sword in the wilderness.
translation:
  language: de
  text: Unter Lebensgefahr beschaffen wir unser Brot[a], wegen des Schwertes der Wüste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bringen wir unser Brot“. Das hebräische Verb kann „bringen“ oder in diesem Zusammenhang allgemeiner „beschaffen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen des Schwertes in der Wüste“. Die hebräische Formulierung lautet wörtlich „Schwert der Wüste“ und kann eine von bewaffneten Angreifern in der Wüste ausgehende Gefahr bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: Unter Lebensgefahr
  rationale: Die Wendung mit נֶפֶשׁ bezeichnet hier die tödliche Gefahr, der die Sprechenden beim Beschaffen ihrer Nahrung ausgesetzt sind. „Unter Lebensgefahr“ gibt das im heutigen Deutsch natürlich und prägnant wieder.
- source_word: נָבִיא
  choice: beschaffen wir
  rationale: Der Hifil von בוא bedeutet grundsätzlich „bringen/herbeibringen“, kann im Zusammenhang mit Brot aber das Beschaffen bzw. Einholen der Nahrung bezeichnen. „beschaffen“ bewahrt diese Bedeutungsbreite besser als das allgemeinere „bekommen“.
- source_word: לַחְמֵנוּ
  choice: unser Brot
  rationale: לֶחֶם bedeutet wörtlich „Brot“ und steht zugleich für die grundlegende Nahrung. Die konkrete Bildsprache bleibt erhalten.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund beziehungsweise die auslösende Bedrohung. „wegen“ ist knapp und idiomatisch.
- source_word: חֶרֶב
  choice: des Schwertes
  rationale: Die wörtliche Wiedergabe bewahrt das eindringliche Bild gewaltsamer Bedrohung, ohne die Deutung im Haupttext auszuweiten.
- source_word: הַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, ungeschütztes Land und häufig Wüstengebiet. „Wüste“ ist hier natürlich und verbindet sich im Deutschen sinnvoll mit der räumlichen Deutung der hebräischen Genitivverbindung.
theological_decisions:
- issue: Zuordnung von הַמִּדְבָּר in חֶרֶב הַמִּדְבָּר
  choice: „das Schwert in der Wüste“ im Haupttext
  alternative: „das Schwert der Wüste“
  rationale: Die hebräische Status-constructus-Verbindung ist formal „Schwert der Wüste“, kann aber eine in der Wüste drohende, schwerttragende Gefahr bezeichnen. Die räumliche Wiedergabe ist im Deutschen verständlicher; die formale Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bildhaft; „Brot“ und „Schwert“ bewahren die konkrete Sprache des Hebräischen. Die beiden echten lexikalisch-syntaktischen Mehrdeutigkeiten werden durch Fußnoten offengehalten.
