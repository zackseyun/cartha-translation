  yaml_path: translation/ot/lamentations/005/015.yaml
  text: The joy of our heart has ceased[a]; our dancing has turned to mourning.
translation:
  language: de
  text: Die Freude unseres Herzens ist zu Ende; unser Tanzen hat sich in Trauer verwandelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: ist verstummt
  rationale: Das Qal-Perfekt bezeichnet das Aufhören. In Verbindung mit der Freude gibt „ist verstummt“ den resultativen Sinn poetisch und im Deutschen natürlich wieder.
- source_word: מְשׂוֹשׂ
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohlocken; „Freude“ ist klar, würdig und passt zum Klagekontext.
- source_word: לִבֵּנוּ
  choice: unseres Herzens
  rationale: Der kollektive Singular des Hebräischen bleibt erhalten und bewahrt das gemeinsame Herz als poetisches Bild.
- source_word: נֶהְפַּךְ
  choice: hat sich verwandelt
  rationale: Das Nifal-Perfekt beschreibt einen eingetretenen Zustandswechsel; die reflexive deutsche Form gibt diesen ohne unnötige Festlegung auf einen ausdrücklich genannten Handelnden wieder.
- source_word: לְאֵבֶל
  choice: in Trauer
  rationale: אֵבֶל bezeichnet Trauer beziehungsweise Klage, besonders bei persönlichem oder gemeinschaftlichem Verlust. „In Trauer“ bildet im Deutschen die natürliche Ergänzung zu „sich verwandeln“.
- source_word: מְחֹלֵנוּ
  choice: unser Reigen
  rationale: Das Wort bezeichnet einen festlichen Tanz. „Reigen“ bewahrt das konkrete poetische Bild und den Gegensatz zur Trauer.
