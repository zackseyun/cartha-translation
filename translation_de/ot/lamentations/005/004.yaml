translation:
  language: de
  text: Unser Wasser trinken wir gegen Geld[a]; unser Holz erhalten wir gegen Bezahlung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für/mit Silber«. Silber dient hier als Zahlungsmittel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »unser Holz kommt gegen einen Preis«. Das hebräische Verb steht im Plural: »sie kommen«; die deutsche Wiedergabe beschreibt idiomatisch, dass das Holz nur gegen Zahlung erhältlich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: unser Wasser
  rationale: Die hebräische Pluralform mit Suffix bedeutet wörtlich »unsere Wasser«. Im Deutschen ist »unser Wasser« als Stoffbezeichnung natürlich; der wichtige Besitzanspruch bleibt erhalten.
- source_word: בְּכֶסֶף
  choice: für Geld
  rationale: כֶּסֶף bezeichnet wörtlich »Silber«, kann aber als Zahlungsmittel auch »Geld« bedeuten. »Für Geld« gibt den Zahlungssinn in natürlichem modernem Deutsch wieder; die konkrete Alternative »für Silber« wird in der Fußnote bewahrt.
- source_word: שָׁתִינוּ
  choice: trinken wir
  rationale: Die hebräische Perfektform beschreibt im Zusammenhang der Klage am besten einen gegenwärtig erfahrenen, fortdauernden Zustand. Das deutsche Präsens erhält diese Unmittelbarkeit.
- source_word: עֵצֵינוּ
  choice: unser Holz
  rationale: Das Hebräische sagt allgemein »unser Holz«. Die Wiedergabe vermeidet die nicht zwingende Einengung auf Brennholz oder Bauholz.
- source_word: בִּמְחִיר
  choice: gegen Bezahlung
  rationale: Die Wendung bezeichnet den Preis, zu dem das Holz erhältlich ist. »Gegen Bezahlung« ist idiomatisch und betont, dass selbst dieses eigene Gut nicht frei verfügbar ist.
- source_word: יָבֹאוּ
  choice: kommt ... zu uns
  rationale: Das Verb bedeutet wörtlich »sie kommen«. Da »Holz« im Deutschen als Stoffbezeichnung im Singular steht, ist singularische Kongruenz natürlich. »Zu uns« verdeutlicht die Zielrichtung, ohne die mögliche passive Bedeutung festzuschreiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellten Besitzangaben »unser Wasser« und »unser Holz« bewahren den klagenden Nachdruck des hebräischen Satzbaus. Die parallele Struktur und die knappe wirtschaftliche Bildsprache bleiben erhalten.
