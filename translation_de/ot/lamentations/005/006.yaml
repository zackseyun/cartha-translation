  text: מִצְרַ֨יִם֙ נָתַ֣נּוּ יָ֔ד אַשּׁ֖וּר לִ/שְׂבֹּ֥עַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/006.yaml
  text: We have given the hand to Egypt and to Assyria[a], to get enough bread.
translation:
  language: de
  text: Wir haben Ägypten und Assur die Hand gegeben[a], um genug Brot zu bekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wir haben Ägypten und Assur die Hand gegeben.« Gemeint sein kann, dass wir uns ihnen unterworfen, ein Bündnis mit ihnen gesucht oder sie um Hilfe gebeten haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: נָתַנּוּ
  choice: haben … gereicht
  rationale: Das Qal-Perfekt 1. Person Plural bezeichnet eine vollzogene Handlung, deren Folgen in der gegenwärtigen Not fortbestehen. Zusammen mit יָד bildet es die Wendung »die Hand reichen/geben«.
- source_word: יָד
  choice: die Hand
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten. Die Wendung kann je nach Zusammenhang Unterwerfung, Bündnissuche oder ein Hilfegesuch ausdrücken; diese Offenheit wird in der Fußnote bewahrt.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: »Assur« ist die gebräuchliche deutsche biblische Bezeichnung für das assyrische Reich und entspricht dem hebräischen Eigennamen.
- source_word: לִשְׂבֹּעַ
  choice: um genug … zu bekommen
  rationale: Der Infinitiv von שבע bezeichnet das Sattwerden beziehungsweise das Erlangen ausreichender Nahrung. Die deutsche Zweckangabe gibt dies natürlich und verständlich wieder.
- source_word: לָחֶם
  choice: Brot
  rationale: Die konkrete Bedeutung »Brot« wird beibehalten, auch wenn das Wort zugleich Nahrung allgemein bezeichnen kann.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Hand-Metapher bleibt im Haupttext erkennbar, wird jedoch mit dem im Deutschen natürlicheren Verb »reichen« formuliert; die nicht eindeutig festgelegte politische Bedeutung wird in der Fußnote erläutert.
