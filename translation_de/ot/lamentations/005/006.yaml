  source_fidelity: Die Ortsnamen, das Perfekt und die Zweckangabe werden grundsätzlich treffend wiedergegeben. Die Formulierung „die Hand reichen“ ist jedoch im heutigen Deutschen eine eigenständige, überwiegend positiv verstandene Geste der Hilfe oder Versöhnung und kann daher die hebräische Wendung נתן יד semantisch verschieben. „Die Hand geben“ bewahrt das Bild und lässt dessen im Kontext nicht näher festgelegte Bedeutung offen.
  naturalness: „Wir haben Ägypten und Assur die Hand gegeben“ ist verständliches, würdevolles Standarddeutsch. „um genug Brot zu bekommen“ ist eine natürliche Wiedergabe von לִשְׂבֹּעַ לָחֶם.
  terminology: „Ägypten“, „Assur“ und „Brot“ sind angemessen. Die Fußnote soll die Mehrdeutigkeit der Hand-Wendung erläutern, ohne eine der möglichen politischen Deutungen als alleinige Bedeutung festzulegen.
