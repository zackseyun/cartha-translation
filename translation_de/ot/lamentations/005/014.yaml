  text: זְקֵנִים֙ מִ/שַּׁ֣עַר שָׁבָ֔תוּ בַּחוּרִ֖ים מִ/נְּגִינָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/014.yaml
  text: The elders have ceased from the gate[a], the young men from their music.
translation:
  language: de
  text: Die Ältesten halten sich nicht mehr am Tor auf; die jungen Männer machen keine Musik[a] mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Musik“ bzw. „ihr Spiel“; das hebräische Wort kann musikalische Darbietung bezeichnen, häufig Instrumentalmusik, möglicherweise aber auch Gesang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: die Ältesten
  rationale: Die Bezeichnung meint ältere Männer und kann im Zusammenhang des Stadttores zugleich ihre gesellschaftliche Rolle als angesehene Gemeindeleiter anklingen lassen.
- source_word: מִשַּׁעַר
  choice: am Tor
  rationale: Das Stadttor war der übliche öffentliche Ort der Ältesten. Im Deutschen gibt „sich nicht mehr am Tor aufhalten“ die mit מִן bezeichnete Trennung von diesem Ort natürlich wieder.
- source_word: שָׁבָתוּ
  choice: halten sich nicht mehr … auf / machen … nicht mehr
  rationale: Das Verb bedeutet „aufhören, nicht länger tun“. Die zwei idiomatischen deutschen Formulierungen geben das eine hebräische Verb wieder, das sinngemäß für beide parallelen Satzglieder gilt.
- source_word: בַּחוּרִים
  choice: die jungen Männer
  rationale: Das Substantiv bezeichnet junge Männer im kräftigen Jugendalter und bildet den sozialen Gegensatz zu den Ältesten.
- source_word: מִנְּגִינָתָם
  choice: machen keine Musik mehr
  rationale: נְגִינָה bezeichnet musikalische Betätigung, häufig instrumentales Spiel. „Musik machen“ bleibt natürlich und lässt die genaue Art der Darbietung offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der knappe poetische Parallelismus bleibt durch die zwei aufeinander bezogenen Gruppen und das wiederholte „nicht mehr“ erkennbar; die im Hebräischen mögliche Auslassung des Verbs im zweiten Satzglied wird zugunsten klarer, natürlicher deutscher Syntax aufgelöst.
