source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: de
  text: Denk daran, Jahwe, was uns widerfahren ist! Schau hin und sieh unsere Schmach[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Schande“; das hebräische Wort kann auch die Schmähung bezeichnen, die andere über uns bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der Imperativ von זכר fordert Jahwe auf, sich der Not seines Volkes wirksam zuzuwenden. „Denk daran“ ist im heutigen Deutsch natürlich und meint hier mehr als bloßes Erinnern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: מֶה הָיָה לָנוּ
  choice: was uns widerfahren ist
  rationale: Die Wendung bezeichnet das, was über das Volk gekommen ist. „Widerfahren“ wahrt den klagenden, würdevollen Ton und ist zugleich verständlich.
- source_word: הביט
  choice: Schau hin
  rationale: Der Imperativ von נבט bildet mit dem folgenden ראה eine eindringliche Doppelaufforderung. „Schau hin“ bewahrt beide Verben und betont die erbetene Zuwendung.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Die einfache Wiedergabe erhält die Parallelität und Dringlichkeit der beiden Aufforderungen „Schau hin“ und „sieh“.
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: unsere Schmach
  rationale: חֶרְפָּה bezeichnet öffentlich erfahrene Entehrung, Schande oder Schmähung. „Schmach“ bringt diesen äußeren Ehrverlust prägnant zum Ausdruck; die Bedeutungsalternativen werden in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung der Aufforderung זְכֹר an Gott
  choice: Denk daran
  alternative: Erinnere dich
  rationale: Die Bitte unterstellt nicht, dass Gott etwas vergessen hätte, sondern ruft ihn im Gebet dazu auf, die Not wahrzunehmen und entsprechend zu handeln. Die knappe Form lässt diese gebetstheologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Imperative und die Doppelung „Schau hin und sieh“ erhalten die eindringliche Gebetssprache und den Parallelismus des Hebräischen.
