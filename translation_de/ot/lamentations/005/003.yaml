source:
  edition: WLC
  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: de
  text: Wir sind zu Waisen[a] geworden, ohne Vater; unsere Mütter sind wie Witwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vaterlose“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוֹמִים
  choice: Waisen
  rationale: Das Substantiv bezeichnet elternlose beziehungsweise besonders des väterlichen Schutzes beraubte Kinder. „Waisen“ ist im modernen Deutschen die natürliche Wiedergabe; „Vaterlose“ bleibt als engere Alternative in der Fußnote erhalten.
- source_word: הָיִינוּ
  choice: sind … geworden
  rationale: Das Qatal von היה kann „waren“ bedeuten, beschreibt hier im Zusammenhang der Katastrophe jedoch plausibel einen eingetretenen Zustand. „Sind … geworden“ bringt diesen Übergang natürlich zum Ausdruck.
- source_word: אֵין אָב
  choice: ohne Vater
  rationale: Die negative Existenzkonstruktion bedeutet wörtlich „kein Vater ist da“. „Ohne Vater“ bewahrt knapp und idiomatisch den Gedanken des Verlusts väterlicher Gegenwart und Fürsorge.
- source_word: אִמֹּתֵינוּ
  choice: unsere Mütter
  rationale: Direkte Wiedergabe des femininen Plurals mit Suffix der ersten Person Plural.
- source_word: כְּאַלְמָנוֹת
  choice: wie Witwen
  rationale: Das Präfix כְּ kennzeichnet ausdrücklich einen Vergleich. „Wie Witwen“ erhält das Bild, ohne zu behaupten, sämtliche Mütter seien im wörtlichen Sinn verwitwet.
theological_decisions:
- issue: Aussagekraft des Vergleichs bei den Müttern
  choice: „unsere Mütter sind wie Witwen“ als ausdrücklichen Vergleich beibehalten
  alternative: „unsere Mütter sind Witwen“
  rationale: Das hebräische כְּ markiert „wie/als“. Die Vergleichsform bewahrt die rhetorische Spannung zwischen tatsächlichem Verlust und einer witwengleichen Lage der Schutzlosigkeit, ohne eine historisch stärkere Behauptung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe parallele Satzstruktur des hebräischen Klagelieds wird bewahrt; der Vergleich „wie Witwen“ bleibt bewusst unabgeschwächt und zugleich nicht zur Identitätsaussage umgedeutet.
