base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
translation:
  language: de
  text: Frauen wurden in Zion geschändet[a], Jungfrauen in den Städten Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vergewaltigt«. Das hebräische Verb kann allgemeiner Erniedrigung oder Misshandlung bezeichnen; im Zusammenhang mit Frauen und Jungfrauen ist hier jedoch wahrscheinlich sexuelle Gewalt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: Frauen
  rationale: Der Plural kann »Frauen« oder kontextabhängig »Ehefrauen« bedeuten. Der Parallelismus mit »Jungfrauen« spricht hier allgemein von weiblichen Opfern, nicht eigens von verheirateten Frauen.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Die Präposition bezeichnet den Ort des Geschehens; »in Zion« ist im Deutschen natürlich und präzise.
- source_word: עִנּוּ
  choice: wurden geschändet
  rationale: Das Piel von ענה kann Erniedrigung oder Misshandlung bezeichnen und meint im Zusammenhang mit weiblichen Opfern häufig sexuelle Gewalt. »Geschändet« gibt diesen wahrscheinlichen Sinn wieder, ohne die lexikalische Breite des Verbs völlig auf »vergewaltigt« einzuengen.
- source_word: בְּתֻלֹת
  choice: Jungfrauen
  rationale: Das Substantiv bezeichnet Jungfrauen beziehungsweise unverheiratete junge Frauen. »Jungfrauen« ist die direkte Entsprechung und bewahrt den im Hebräischen hervorgehobenen Status.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Konstruktverbindung bedeutet wörtlich »in den Städten Judas« und erhält die örtliche Parallele zu »in Zion«.
