  text: נָֽפְלָה֙ עֲטֶ֣רֶת רֹאשֵׁ֔/נוּ אֽוֹי נָ֥א לָ֖/נוּ כִּ֥י חָטָֽאנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/016.yaml
  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
translation:
  language: de
  text: Die Krone ist von unserem Haupt gefallen.[a] Wehe uns![b] Denn wir haben gesündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Krone unseres Hauptes ist gefallen.« So lautet die poetische Konstruktverbindung im Hebräischen wörtlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Ach, wehe uns!« Der Ausdruck ist ein Klageruf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה
  choice: ist … gefallen
  rationale: Das Qal-Perfekt, 3. Person Singular feminin, stimmt mit עֲטֶרֶת überein. Das deutsche Perfekt bezeichnet das abgeschlossene Geschehen und bewahrt zugleich dessen gegenwärtige Wirkung in der Klage.
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: Die Krone ist von unserem Haupt gefallen
  rationale: Die hebräische Konstruktverbindung lautet wörtlich »die Krone unseres Hauptes«. Die gewählte deutsche Fassung gibt das Bild natürlich wieder, ohne es auf eine bestimmte politische oder kultische Bedeutung festzulegen; die wörtlichere Struktur steht in der Fußnote.
- source_word: רֹאשֵׁנוּ
  choice: unserem Haupt
  rationale: Der Singular mit Suffix der 1. Person Plural wird als kollektiver Singular bewahrt. »Haupt« passt zum poetischen Bild der Krone und hat im Deutschen einen würdigen, aber verständlichen Klang.
- source_word: אֽוֹי נָא לָנוּ
  choice: Wehe uns!
  rationale: אוי ist ein Klageruf; נא verstärkt hier den Ausruf. »Wehe uns!« ist knapp, idiomatisch und bringt die erschütterte Klage zum Ausdruck.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung des Klagerufs ein und bewahrt so den kausalen Zusammenhang.
- source_word: חָטָאנוּ
  choice: wir haben gesündigt
  rationale: Das Qal-Perfekt, 1. Person Plural, bezeichnet ausdrücklich gemeinschaftliche Sünde. »Wir haben gesündigt« ist klar, sachlich und theologisch nicht paraphrasierend.
theological_decisions:
- issue: Gemeinschaftliches Schuldbekenntnis und Verantwortlichkeit
  choice: »Denn wir haben gesündigt« wird als gemeinschaftliches Eingeständnis von Schuld wiedergegeben.
  alternative: Eine rein situationsbezogene Klage, bei der das Bekenntnis nicht als Begründung hervorgehoben wird.
  rationale: Das Hebräische nennt die gemeinschaftliche Sünde ausdrücklich als Grund für den Klageruf. Die Übersetzung erhält diesen Zusammenhang zwischen Verlust, Klage und eingestandener Schuld, ohne ihn über den Vers hinaus auszudeuten.
- issue: Bedeutung der Krone
  choice: Das Bild »Krone« bleibt ohne nähere Bestimmung stehen.
  alternative: Eine ausdrückliche Deutung als Königtum, Ehre, Tempel oder nationale Würde.
  rationale: Der poetische Zusammenhang lässt mehrere miteinander verbundene Bedeutungsnuancen zu. Die Übersetzung wahrt diese Offenheit, statt eine einzelne theologische oder historische Deutung festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Klang. »Haupt« bewahrt den kollektiven Singular und passt zum Kronenbild; »Kopf« wäre alltäglicher, klänge in dieser Verbindung jedoch weniger natürlich. Die kurzen Ausrufe und Sätze entsprechen dem eindringlichen Rhythmus der hebräischen Klage.
