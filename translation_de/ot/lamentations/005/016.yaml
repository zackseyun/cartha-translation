  source_fidelity: 'Die Übersetzung gibt die hebräische Syntax und Aussage zuverlässig wieder: נָפְלָה wird passend als abgeschlossenes Geschehen („ist … gefallen“) wiedergegeben, die Konstruktverbindung עֲטֶרֶת רֹאשֵׁנוּ wird idiomatisch als „Die Krone ist von unserem Haupt gefallen“ entfaltet, und der kollektive Singular bleibt in „unserem Haupt“ erkennbar. „Denn wir haben gesündigt“ bewahrt die kausale Aussage von כִּי und das gemeinschaftliche Schuldbekenntnis von חָטָאנוּ.'
  naturalness: „Die Krone ist von unserem Haupt gefallen. Wehe uns! Denn wir haben gesündigt.“ ist verständliches, modernes Deutsch in angemessen würdig-poetischem Register. „Haupt“ ist hier keine unnatürliche Archaisierung, sondern unterstützt das Bildfeld von Krone und bewahrt den poetischen Kollektivsingular.
  terminology: „Krone“, „Wehe“ und „gesündigt“ sind präzise und registergerecht. Die Fassung legt die Krone weder einseitig als Königsherrschaft noch als Tempel- oder Ehrenmetapher aus. Die Fußnoten entsprechen ihren Ankern und geben tatsächlich mögliche, textnahe Alternativen beziehungsweise Erläuterungen.
