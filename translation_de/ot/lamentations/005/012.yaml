base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/012.yaml
  text: Princes were hung up by their hands[b][a]; the faces of elders were not honored.
translation:
  language: de
  text: Fürsten wurden an ihren Händen aufgehängt[a]; den Ältesten erwies man keine Ehre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Fürsten wurden an ihren Händen aufgehängt.« Die Formulierung bezeichnet wahrscheinlich die Hände als den Körperteil, an dem sie aufgehängt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Die Gesichter der Ältesten wurden nicht geehrt.« Das ist eine hebräische Ausdrucksweise dafür, dass man den Ältesten die ihnen gebührende Achtung verweigerte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Das Wort bezeichnet Herrscher, hohe Amtsträger oder vornehme Führungspersonen. »Fürsten« bewahrt hier den sozialen Rang und den traditionellen Klang, ohne die Bedeutung auf eine bestimmte Amtsform einzuengen.
- source_word: בְּיָדָם
  choice: an ihren Händen
  rationale: Die Präposition ב mit »Hand« und dem Suffix der 3. Person Plural bezeichnet im Zusammenhang mit נִתְלוּ am ehesten den Körperteil, an dem die Betroffenen aufgehängt wurden. Der Plural »Händen« entspricht natürlichem Deutsch.
- source_word: נִתְלוּ
  choice: wurden aufgehängt
  rationale: Die Nifalform bedeutet »wurden aufgehängt/aufgehängt gehalten«. Die Formulierung gibt die gewaltsame Aufhängung wieder, ohne von sich aus festzulegen, ob sie unmittelbar der Hinrichtung oder der öffentlichen Misshandlung diente.
- source_word: פְּנֵי זְקֵנִים
  choice: den Ältesten
  rationale: Wörtlich steht »die Gesichter der Ältesten«. Im Hebräischen bezeichnet »Gesicht« hier metonymisch die Personen in ihrer Würde; natürliches Deutsch gibt den Sinn mit »den Ältesten« wieder und erläutert das Bild in einer Fußnote.
- source_word: לֹא נֶהְדָּרוּ
  choice: erwies man keine Ehre
  rationale: Das Nifal von הדר drückt aus, dass jemandem Ehre, Würde oder Achtung nicht zuerkannt wurde. Die unpersönliche deutsche Wendung ist idiomatisch und bewahrt den Sinn des hebräischen Passivs.
