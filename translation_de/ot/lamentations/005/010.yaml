  text: Unsere Haut ist heiß wie ein Ofen wegen der Glut der Hungersnot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsere Haut ist wie ein Ofen versengt wegen der Glut der Hungersnot.“ Das hebräische Verb und das Wort für „Glut“ sind selten; sie können starke Erhitzung oder Versengung bezeichnen und möglicherweise auch ein Geschwärztsein andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: Unsere Haut
  rationale: עוֹר bezeichnet Haut oder Fell; bei Menschen ist „Haut“ die natürliche und sachlich passende Wiedergabe.
- source_word: כְתַנּוּר נִכְמָרוּ
  choice: glüht wie ein Ofen
  rationale: Die Vergleichspartikel mit תַנּוּר und das seltene Verb כמר beschreiben einen Zustand intensiver Erhitzung oder Versengung. „Glüht wie ein Ofen“ gibt Bild und Wirkung in natürlichem Deutsch wieder, ohne eine Hautverfärbung festzulegen.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier die Ursache des beschriebenen körperlichen Zustands.
- source_word: זַלְעֲפוֹת
  choice: sengende Hitze
  rationale: Das seltene Wort kann brennende Hitze, Glut oder einen fieberartigen Zustand bezeichnen. „Sengende Hitze“ bewahrt die körperliche Intensität, ohne ausdrücklich Fieber einzutragen.
- source_word: רָעָב
  choice: Hunger
  rationale: רָעָב kann Hunger oder Hungersnot bezeichnen. Im unmittelbaren Ausdruck steht die körperliche Wirkung im Vordergrund; „des Hungers“ ist deshalb idiomatisch und hält zugleich den Zusammenhang der Hungersnot offen.
