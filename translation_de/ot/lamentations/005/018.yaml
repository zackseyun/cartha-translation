  text: because Mount Zion lies desolate[a]; foxes walk on it.
translation:
  language: de
  text: weil der Berg Zion verödet daliegt und Füchse[a] auf ihm umhergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakale“. Das hebräische Wort kann in manchen Zusammenhängen weiter gefasst sein; hier ist „Füchse“ die naheliegende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: weil
  rationale: Im Zusammenhang führt עַל den Grund der vorausgehenden Klage ein. „Weil“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: הַר צִיּוֹן
  choice: der Berg Zion
  rationale: Die feste deutsche Wiedergabe bewahrt sowohl die Bezeichnung als Berg als auch den Eigennamen Zion.
- source_word: שֶׁשָּׁמֵם
  choice: verwüstet daliegt
  rationale: Die Form beschreibt den fortdauernden Zustand Zions. „Verwüstet daliegt“ ist idiomatisch und wahrt den Klagecharakter, ohne ausdrücklich ein vorausgehendes Werden hinzuzufügen.
- source_word: שׁוּעָלִים
  choice: Füchse
  rationale: „Füchse“ ist die direkte Standardbedeutung; je nach Kontext kann das hebräische Wort auch Schakale oder kleinere wild lebende Hundeartige bezeichnen.
- source_word: הִלְּכוּ
  choice: streifen um
  rationale: Das Verb bezeichnet hier das Umhergehen auf der verlassenen Stätte. „Streifen um“ klingt im Deutschen natürlich, ohne die zusätzliche Raubtiernuance von „schleichen“ oder „lauern“ einzutragen.
- source_word: בּוֹ
  choice: auf ihm
  rationale: Das Suffix bezieht sich auf den Berg Zion; bei einem Berg ist „auf ihm“ im Deutschen die passende räumliche Wiedergabe.
