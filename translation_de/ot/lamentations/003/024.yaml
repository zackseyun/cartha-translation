  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: de
  text: „Jahwe ist mein Anteil[a]“, sagt meine Seele; „darum hoffe ich auf ihn[b].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Teil“ oder „mein Erbteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „darum warte ich auf ihn“ oder „darum warte ich erwartungsvoll auf ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: mein Anteil
  rationale: חֵלֶק bezeichnet einen Anteil, ein zugeteiltes Teil oder auch ein Erbteil. „Mein Anteil“ ist im modernen Deutsch verständlich und bewahrt die poetische Aussage, dass Jahwe selbst das dem Sprecher Zugehörige und Genügende ist, ohne die rechtliche Bedeutung von „Erbteil“ festzuschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָמְרָה
  choice: sagt
  rationale: Das hebräische Qatal kann in dieser Einleitung direkter Rede eine gegenwärtig geltende Bekenntnisaussage ausdrücken. „Sagt“ gibt diesen fortdauernden Sinn natürlich wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ bezeichnet hier das eigene innere Selbst. „Meine Seele“ erhält die poetische Ausdrucksweise, ohne eine weitergehende anthropologische Definition aufzuzwingen.
- source_word: עַל־כֵּן
  choice: darum
  rationale: Die Wendung kennzeichnet die Folgerung aus dem vorausgehenden Bekenntnis. „Darum“ ist knapp, natürlich und logisch eindeutig.
- source_word: אוֹחִיל
  choice: hoffe ich
  rationale: Die Hifil-Form von יחל umfasst hoffendes, erwartungsvolles Warten. „Hoffe ich“ ist im Deutschen idiomatisch; die Bedeutungsnuance des Wartens bleibt in der Fußnote sichtbar.
- source_word: לוֹ
  choice: auf ihn
  rationale: Bei „hoffen“ verlangt modernes Deutsch idiomatisch die Verbindung „auf ihn hoffen“. Sie bezeichnet das persönliche Vertrauen, das auf Jahwe gerichtet ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חֶלְקִי
  choice: mein Anteil
  alternative: mein Erbteil
  rationale: „Anteil“ lässt sowohl die Vorstellung des zugeteilten Besitzes als auch den umfassenderen poetisch-theologischen Sinn bestehen. „Erbteil“ würde die rechtliche beziehungsweise landbezogene Nuance stärker festlegen, als es der Kontext verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. „Meine Seele“ erhält das personifizierte innere Selbst des hebräischen Textes; „Anteil“ und „hoffen“ vermeiden unnötige konfessionelle Festlegungen.
