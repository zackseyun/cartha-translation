lexical_decisions:
- source_word: פָּצוּ
  choice: haben … aufgerissen
  rationale: Das Qal-Perfekt von פצה bezeichnet mit „Mund“ ein weites Öffnen und trägt hier im Klagekontext eine feindselige oder höhnische Färbung. „Aufgerissen“ gibt diese Bildhaftigkeit natürlich wieder, ohne den unausgesprochenen Inhalt der Rede zu ergänzen.
- source_word: עָלֵינוּ
  choice: gegen uns
  rationale: עַל hat in Verbindung mit der feindseligen Handlung hier adversative Bedeutung; „gegen uns“ ist daher gegenüber einer räumlichen Wiedergabe vorzuziehen.
- source_word: פִּיהֶם
  choice: ihren Mund
  rationale: Der hebräische Text verwendet den Singular „ihr Mund“ bei einem pluralischen Subjekt. Der kollektive Singular lässt sich im Deutschen natürlich bewahren und erhält die formale Gestalt des Bildes.
- source_word: כָּל
  choice: Alle
  rationale: כָּל bezeichnet vor „unsere Feinde“ die Gesamtheit der Gruppe und wird idiomatisch mit „alle“ wiedergegeben.
- source_word: אֹיְבֵינוּ
  choice: unsere Feinde
  rationale: Die direkte Standardentsprechung für אֹיֵב mit dem Suffix der ersten Person Plural passt zum Sprachgebrauch der Klage.
