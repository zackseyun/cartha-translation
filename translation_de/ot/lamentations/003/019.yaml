base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
translation:
  language: de
  text: Denke an mein Elend und mein Umherirren[a], an Wermut und Gift[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Heimatlosigkeit“. Das hebräische Wort bezeichnet unstetes Umherziehen oder ein Leben ohne festen Ort.'
    reason: lexical_alternative
  - marker: b
    text: „Wermut und Gift“ sind konkrete Bilder für Bitterkeit und Schädliches; zusammen können sie auch äußerstes bitteres Leid bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  choice: Denke an
  rationale: Der Qal-Imperativ 2. Person maskulin Singular ist eine direkte Bitte. Im Deutschen gibt „Denke an“ die Verbindung von זכר mit dem folgenden Gegenstand natürlich wieder.
- source_word: עָנְיִי
  choice: mein Elend
  rationale: Der Ausdruck bezeichnet Bedrängnis, Not oder Elend. „Elend“ ist verständlich, gewichtig und lässt offen, welche konkreten Leiden gemeint sind.
- source_word: מְרוּדִי
  choice: mein Umherirren
  rationale: Das Substantiv bezeichnet unstetes Umherziehen oder Heimatlosigkeit. „Umherirren“ bewahrt das Bewegungsbild, ohne die Bedeutung vorschnell auf Obdachlosigkeit festzulegen.
- source_word: לַעֲנָה
  choice: Wermut
  rationale: Der konkrete Pflanzenname bleibt erhalten; zugleich trägt Wermut im poetischen Zusammenhang die Bildbedeutung äußerster Bitterkeit.
- source_word: וָרֹאשׁ
  choice: Gift
  rationale: רֹאשׁ kann eine giftige Pflanze beziehungsweise Gift bezeichnen. „Gift“ wahrt neben dem Wermutbild den Aspekt des Schädlichen und ist im modernen Deutschen klarer als „Galle“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung von „an“ verdeutlicht die deutsche Syntax, ohne die Bildsprache oder die Mehrdeutigkeit des Hebräischen aufzulösen.
