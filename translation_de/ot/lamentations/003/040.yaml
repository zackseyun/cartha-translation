  variant: modern standard German
source:
  edition: WLC
  text: נַחְפְּשָׂ֤ה דְרָכֵ֨י/נוּ֙ וְֽ/נַחְקֹ֔רָה וְ/נָשׁ֖וּבָה עַד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/040.yaml
  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: de
  text: Lasst uns unsere Wege prüfen und erforschen und zu Jahwe zurückkehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: Lasst uns … prüfen
  rationale: Der Kohortativ der ersten Person Plural ist eine gemeinsame Aufforderung. „Prüfen“ gibt hier die sorgfältige, auf das eigene Leben gerichtete Suche natürlich wieder.
- source_word: דְרָכֵינוּ
  choice: unsere Wege
  rationale: „Wege“ bewahrt das hebräische Bild für Lebensführung und Verhalten, ohne es vorschnell auf den abstrakten Begriff „Lebenswandel“ zu verengen.
- source_word: וְנַחְקֹרָה
  choice: und erforschen
  rationale: Der zweite Kohortativ verstärkt den ersten durch den Gedanken gründlichen Nachforschens. Das Objekt „unsere Wege“ gilt im Deutschen ohne Wiederholung auch für dieses Verb.
- source_word: וְנָשׁוּבָה
  choice: und … zurückkehren
  rationale: שׁוב bezeichnet grundlegend Umkehr beziehungsweise Rückkehr. „Zurückkehren“ erhält das räumlich-relationale Bild und lässt den im Zusammenhang enthaltenen Gedanken der Buße bestehen, ohne ihn zum alleinigen Sinn zu machen.
- source_word: עַד
  choice: zu
  rationale: In Verbindung mit שׁוב bezeichnet die Präposition das Ziel der Rückkehr; „zu“ ist dafür im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt, dass im hebräischen Text das Tetragramm und nicht ein Titel steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. „Jahwe“ gibt ihn wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁוב
  choice: zurückkehren
  alternative: umkehren / Buße tun
  rationale: „Zurückkehren“ bewahrt die Grundbedeutung und die relationale Ausrichtung auf Jahwe. Die sittlich-geistliche Umkehr ist im Kontext eingeschlossen, wird aber nicht als ausschließlich innerer Vorgang festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache gemeinsame Aufforderung der hebräischen Kohortative wird durch „Lasst uns“ mit koordinierten Infinitiven knapp und natürlich wiedergegeben; das Bild der „Wege“ bleibt erhalten.
