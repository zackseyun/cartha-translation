base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/043.yaml
  text: You covered yourself with anger and pursued us[b][a]; you killed without pity.
translation:
  language: de
  text: Du hast dich in Zorn gehüllt[a] und uns verfolgt; du hast getötet und nicht verschont.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast dich mit Zorn umhüllt.“ Das hebräische Verb bedeutet „bedecken, umhüllen“; ein ausdrückliches Wort für „dich“ steht nicht da, wird aber aus dem Zusammenhang ergänzt.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „du hast kein Erbarmen gehabt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכֹּתָה
  choice: du hast dich … gehüllt
  rationale: Das Verb סכך bezeichnet ein Bedecken oder Umhüllen. Das reflexive Verständnis ergibt sich aus dem Zusammenhang und bewahrt das Bild, ohne es sachlich aufzulösen.
- source_word: בָאַף
  choice: in Zorn
  rationale: אַף bedeutet wörtlich „Nase“, ist hier jedoch die geläufige hebräische Bezeichnung für Zorn. „In Zorn“ verbindet sich im Deutschen natürlich mit dem Bild des Sich-Hüllens.
- source_word: וַתִּרְדְּפֵנוּ
  choice: und uns verfolgt
  rationale: רדף bedeutet hier „verfolgen, nachjagen“. „Verfolgt“ ist direkt und verlangt keine speziellere Bedeutung wie religiöse Verfolgung.
- source_word: הָרַגְתָּ
  choice: du hast getötet
  rationale: הרג ist das gewöhnliche Verb für „töten“. Die uneingeschränkte Formulierung erhält die Härte der Klage; ein Objekt wird im Hebräischen hier nicht ausdrücklich wiederholt.
- source_word: לֹא חָמָלְתָּ
  choice: und kein Erbarmen gehabt
  rationale: חמל kann sowohl „Erbarmen haben“ als auch „verschonen“ bedeuten. Die Hauptfassung gibt den Mitgefühlsaspekt wieder und lässt die Alternative in der Fußnote sichtbar.
theological_decisions:
- issue: Direkte Anrede Gottes in einer Klage über das göttliche Gericht
  choice: Die unmittelbare Zuschreibung „du hast … verfolgt; du hast getötet“ bleibt ungemildert stehen.
  alternative: Abschwächende Wiedergaben wie „du hast zugelassen, dass wir verfolgt wurden“ oder „du schienst ohne Erbarmen zu töten“.
  rationale: Der hebräische Text schreibt die Handlungen dem Angeredeten unmittelbar zu. Die kühne Sprache der Klage und ihre theologische Spannung dürfen nicht durch eine erklärende Paraphrase entschärft werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das Bild des Umhüllens und die schroffe Anklage der Klage bleiben erhalten; altertümliche Wörter wie „erschlagen“ oder „Mitleid üben“ werden vermieden.
