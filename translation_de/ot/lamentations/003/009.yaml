source:
  edition: WLC
  text: גָּדַ֤ר דְּרָכַ/י֙ בְּ/גָזִ֔ית נְתִיבֹתַ֖/י עִוָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
translation:
  language: de
  text: Er hat meine Wege mit behauenen Steinen vermauert[a]; meine Pfade hat er krumm gemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat meine Wege mit behauenen Steinen abgesperrt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Pfade hat er verdreht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: vermauert
  rationale: Das Verb bezeichnet das Ummauern, Einhegen oder Absperren. Zusammen mit „behauenen Steinen“ gibt „vermauert“ das konkrete Bild einer bewusst errichteten, massiven Blockade natürlich wieder.
- source_word: דְּרָכַי
  choice: meine Wege
  rationale: דֶּרֶךְ kann einen Weg oder eine Straße und bildlich den Lebensweg bzw. Verlauf bezeichnen. „Meine Wege“ bewahrt diese Bedeutungsbreite und den poetischen Parallelismus.
- source_word: בְּגָזִית
  choice: mit behauenen Steinen
  rationale: גָּזִית bezeichnet behauenen bzw. zugerichteten Stein. Der Plural ist im Deutschen bei der Vorstellung eines Mauerwerks idiomatisch und macht die massive, gezielt errichtete Sperre anschaulich.
- source_word: נְתִיבֹתַי
  choice: meine Pfade
  rationale: נְתִיבָה bezeichnet einen Pfad oder eine Bahn. „Meine Pfade“ ist knapp, verständlich und steht poetisch parallel zu „meine Wege“.
- source_word: עִוָּה
  choice: hat er krumm gemacht
  rationale: Das Verb bedeutet verdrehen, verbiegen oder krumm machen. Die Formulierung erhält das Wegbild und vermeidet eine unbeabsichtigte moralische Deutung wie bei „verkehrt gemacht“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. „Vermauert“ verbindet das Verb eng mit dem Bild behauener Steine; die alternative Wiedergabe „abgesperrt“ wird in der Fußnote genannt. Die markierte Satzgrenze der masoretischen Überlieferung (ס) wird nicht eigens wiedergegeben.
