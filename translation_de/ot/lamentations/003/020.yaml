  - severity: medium
    issue: Die Fußnote erklärt die syntaktische Mehrdeutigkeit nicht.
    rationale: Da die alternative Zuordnung des Verbs in Übersetzung und Auslegung vorkommt, sollte sie knapp genannt werden, statt eine umstrittene Lesart als alleinigen hebräischen Wortlaut auszugeben.
