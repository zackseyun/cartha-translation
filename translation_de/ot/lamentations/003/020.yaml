base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/020.yaml
  text: My soul continually remembers and is bowed down within me[a].
translation:
  language: de
  text: Du wirst gewiss daran denken, und meine Seele beugt sich in mir nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gewiss wirst du daran denken, und meine Seele beugt sich auf mir nieder.“ Die Wiederholung von „gedenken“ verstärkt die Aussage. Die hebräische Form „du wirst gedenken“ kann für sich genommen auch mit „meine Seele“ als Subjekt verstanden werden; im Zusammenhang mit der Anrede in Vers 19 ist die Anrede an Gott naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: erinnert sich immer wieder daran
  rationale: Der Infinitivus absolutus vor dem Imperfekt verstärkt den Verbalgedanken. „Immer wieder“ gibt die nachdrückliche beziehungsweise fortdauernde Erinnerung natürlich wieder; das ergänzte „daran“ nimmt im Deutschen den Inhalt aus Vers 19 auf.
- source_word: וְתָשִׁיחַ
  choice: und sinkt nieder
  rationale: Die Form bezeichnet ein Niedersinken beziehungsweise Erniedrigtwerden. „Sinkt nieder“ bewahrt das konkrete poetische Bild und vermeidet die stärker deutende Wiedergabe „ist niedergeschlagen“.
- source_word: עָלַי
  choice: in mir
  rationale: Wörtlich steht „auf/über mir“. Im Zusammenhang mit „meine Seele“ bezeichnet die Wendung die innere Niedergeschlagenheit; „in mir“ gibt dieses hebräische Idiom im Deutschen verständlich wieder.
- source_word: נַפְשִׁי
  choice: Meine Seele
  rationale: נפשׁ kann das Selbst oder innere Leben bezeichnen. „Meine Seele“ erhält die poetische und anthropologische Ausdrucksweise des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildhaftigkeit. Die ungewöhnliche hebräische Verstärkung wird idiomatisch durch „immer wieder“ wiedergegeben; die wörtliche Form und die Präposition werden in der Fußnote sichtbar gehalten.
