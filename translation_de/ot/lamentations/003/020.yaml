  source_fidelity: 'Die deutsche Fassung folgt der im englischen Audit bevorzugten Lesart, übersieht aber eine wesentliche grammatische und kontextuelle Möglichkeit des Hebräischen. תִּזְכּוֹר kann formal zwar auch mit dem nachgestellten femininen Subjekt „meine Seele“ verbunden werden, ist im Zusammenhang mit dem an Gott gerichteten Imperativ in V. 19 jedoch naheliegend als 2. Person maskulin zu verstehen: „Du wirst gewiss daran denken.“ Die bisherige Fußnote legt die andere Lesart fälschlich als wörtlich fest.'
  naturalness: „Meine Seele erinnert sich immer wieder daran und sinkt in mir nieder“ ist verständlich und poetisch, aber die Zuordnung von „erinnert sich“ zu „meine Seele“ ist nicht die kontextuell naheliegendste. „Du wirst gewiss daran denken, und meine Seele beugt sich in mir nieder“ ist modernes, würdiges Deutsch und bewahrt das Bild.
  terminology: „Seele“ ist für נַפְשִׁי angemessen. „Beugt sich ... nieder“ gibt die Metapher von ותשיח besser wieder als das etwas unbestimmtere „sinkt nieder“. Die Präposition עָלַי wird idiomatisch mit „in mir“ wiedergegeben und in der Fußnote transparent gemacht.
  issues:
