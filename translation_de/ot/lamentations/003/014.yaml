  source_fidelity: 'Der Entwurf gibt die beiden hebräischen Satzglieder präzise wieder: Das Perfekt הָיִיתִי ist als fortdauernder Ergebniszustand („bin … geworden“) angemessen erfasst; שְׂחוֹק wird idiomatisch als „zum Gespött“ wiedergegeben. „Meinem ganzen Volk“ wahrt sowohl den Possessivsuffix als auch die Totalität von לְכָל עַמִּי. Die zweite Aussage entspricht נְגִינָתָם כָּל־הַיּוֹם, einschließlich der zeitlichen Bestimmung.'
