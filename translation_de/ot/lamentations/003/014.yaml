  text: הָיִ֤יתִי שְּׂחֹק֙ לְ/כָל עַמִּ֔/י נְגִינָתָ֖/ם כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/014.yaml
  text: I have become a laughingstock to all my people[a], their song all day long.
translation:
  language: de
  text: Ich bin meinem ganzen Volk zum Gespött geworden; den ganzen Tag lang bin ich ihr Lied.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Spottlied“ oder „ihr Hohnlied“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: Ich bin … geworden
  rationale: Das Qal Perfekt in der Klage bezeichnet hier passend einen eingetretenen Zustand, der bis in die Gegenwart anhält.
- source_word: שְּׂחֹק
  choice: zum Gespött
  rationale: Die deutsche Wendung gibt idiomatisch wieder, dass der Sprecher zum Gegenstand des Lachens und der Verhöhnung geworden ist.
- source_word: לְכָל עַמִּי
  choice: meinem ganzen Volk
  rationale: Die Konstruktion mit לְ wird im Deutschen natürlich durch den Dativ in der Wendung „jemandem zum Gespött werden“ wiedergegeben; der Possessivsuffix bleibt als „meinem“ erhalten.
- source_word: נְגִינָתָם
  choice: ihr Lied
  rationale: „Lied“ bewahrt die lexikalische Offenheit des hebräischen Nomens; der Kontext legt ein Spott- oder Hohnlied nahe, ohne dass diese Nuance zwingend in den Haupttext aufgenommen werden muss.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag lang
  rationale: Dies ist eine natürliche moderne deutsche Wiedergabe der hebräischen Zeitangabe.
