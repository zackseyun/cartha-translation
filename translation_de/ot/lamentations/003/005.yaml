  yaml_path: translation/ot/lamentations/003/005.yaml
  text: He has built against me and surrounded me with bitterness and hardship[a][b].
translation:
  language: de
  text: Er hat gegen mich gebaut und mich mit Gift und Mühsal umringt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bitterkeit und Mühsal“. Das mit „Gift“ übersetzte Wort kann eine giftige oder bittere Substanz bezeichnen; traditionell wird es auch mit „Galle“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er hat gegen mich gebaut“; die Formulierung erinnert wahrscheinlich an Belagerungswerke.'
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה עָלַי
  choice: hat gegen mich gebaut
  rationale: Bewahrt die ungewöhnliche Baummetapher des Hebräischen und gibt עָלַי in diesem feindlichen Zusammenhang mit „gegen mich“ wieder; vermutlich klingt das Errichten von Belagerungswerken an.
- source_word: וַיַּקַּף
  choice: hat mich … umringt
  rationale: Das Verb bezeichnet ein Umgeben oder Umringen. Das im Hebräischen unausgesprochene Objekt „mich“ ergibt sich aus dem Zusammenhang.
- source_word: רֹאשׁ
  choice: Gift
  rationale: Das Substantiv bezeichnet hier wahrscheinlich eine giftige, bitter schmeckende Substanz. „Gift“ erhält den konkreten Bildgehalt; „Bitterkeit“ bleibt als mögliche übertragene Wiedergabe in der Fußnote erhalten.
- source_word: תְלָאָה
  choice: Mühsal
  rationale: Das Wort kann Mühsal, Beschwernis oder Erschöpfung bezeichnen. „Mühsal“ ist in einer poetischen Klage verständlich und würdevoll, ohne den Sinn auf ein bloßes Gefühl zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter poetischer Härte. Die ungewöhnliche Wendung „gegen mich gebaut“ bleibt stehen, damit das Belagerungsbild nicht durch eine rein deutende Übersetzung geglättet wird.
