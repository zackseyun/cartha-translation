base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/010.yaml
  text: He is a bear lying in wait for me[a], a lion in hiding places.
translation:
  language: de
  text: Er ist ein Bär, der mir auflauert, ein Löwe in Verstecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב
  choice: ein Bär
  rationale: Das Substantiv bezeichnet eindeutig einen Bären; der unbestimmte Artikel entspricht der prädikativen Bildaussage im Deutschen.
- source_word: אֹרֵב
  choice: der auf Beute lauert
  rationale: Das Partizip von ארב bezeichnet gezieltes Auflauern beziehungsweise einen Hinterhalt. Die Formulierung gibt das räuberische Bild natürlich wieder.
- source_word: הוּא
  choice: Er ist
  rationale: Das ausdrückliche Personalpronomen bildet das Subjekt des verblosen hebräischen Satzes; im Deutschen wird die Kopula ergänzt.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition bezeichnet hier den Sprecher als Ziel des Auflauerns; zusammen mit »lauern« ist »für mich« idiomatisch und bewahrt die feindliche Ausrichtung.
- source_word: אַרְיֵה
  choice: ein Löwe
  rationale: Das Substantiv bezeichnet einen Löwen und steht parallel zu »ein Bär«.
- source_word: בְּמִסְתָּרִים
  choice: in seinem Versteck
  rationale: Der Plural bezeichnet verborgene Orte beziehungsweise Verstecke. Der distributiv-kollektive Singular klingt im deutschen Raubtierbild natürlich, ohne die Vorstellung des Verborgenseins aufzugeben.
theological_decisions:
- issue: Identität des mit »er« bezeichneten Handelnden
  choice: Das Pronomen bleibt unbestimmt und wird nicht ausdrücklich als »Gott« wiedergegeben.
  alternative: Gott ist für mich ein Bär …
  rationale: Der Vers selbst enthält nur das Pronomen הוּא. Der Zusammenhang lässt den Bezug erkennen, doch eine explizite Benennung würde die Aussage interpretierend verdeutlichen.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die parallelen Raubtierbilder und der Eindruck eines gezielten Hinterhalts bleiben erhalten.
