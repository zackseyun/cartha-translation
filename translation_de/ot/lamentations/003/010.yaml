    issue: Zusatz „auf Beute“
    rationale: Das hebräische Partizip אֹרֵב bezeichnet Auflauern, nennt aber keine „Beute“. Der Zusatz verschiebt zudem die Zielrichtung von לִי („mir/für mich“) hin zu einem allgemeinen Jagdobjekt.
  - severity: medium
    issue: „in seinem Versteck“ statt pluralischer, nicht-possessiver Ortsangabe
    rationale: בְּמִסְתָּרִים steht im Plural und enthält kein Possessivsuffix. Der Singular mit „seinem“ verengt und ergänzt das Bild.
  revised_text: Er ist ein Bär, der mir auflauert, ein Löwe in Verstecken.
