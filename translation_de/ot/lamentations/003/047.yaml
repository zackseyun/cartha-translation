  source_fidelity: 'Die Übersetzung gibt die viergliedrige hebräische Katastrophenreihe zuverlässig wieder: פַּחַד als „Schrecken“, פַחַת konkret als „Fallgrube“, הַשֵּׁאת als „Verwüstung“ und הַשָּׁבֶר als „Zusammenbruch“. „Sind über uns gekommen“ gibt הָיָה לָנוּ idiomatisch und ohne zusätzliche Deutung wieder.'
