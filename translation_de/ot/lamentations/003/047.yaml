  text: Terror and pitfall have come upon us, devastation and destruction.
translation:
  language: de
  text: Schrecken und Fallgrube sind über uns gekommen, Verwüstung und Zusammenbruch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: Schrecken
  rationale: Gibt die starke Furcht beziehungsweise das Entsetzen im Kontext knapp und würdig wieder.
- source_word: פַחַת
  choice: Fallgrube
  rationale: Bezeichnet konkret eine Grube als Falle und bewahrt das hebräische Klangspiel mit פַּחַד so weit, wie es im Deutschen natürlich möglich ist.
- source_word: הַשֵּׁאת
  choice: Verwüstung
  rationale: Das seltene Substantiv bezeichnet hier Unheil beziehungsweise Verwüstung; die Wahl passt zur parallelen Katastrophensprache.
- source_word: הַשָּׁבֶר
  choice: Zusammenbruch
  rationale: Bewahrt das Bild des Brechens und kann sowohl den umfassenden Ruin als auch die erlittene Katastrophe ausdrücken.
