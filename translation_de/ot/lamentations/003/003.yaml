  yaml_path: translation/ot/lamentations/003/003.yaml
  text: Surely against me he turns his hand again and again all day long[a].
translation:
  language: de
  text: Gewiss, gegen mich wendet er seine Hand immer wieder, den ganzen Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „Gewiss, gegen mich kehrt er zurück; den ganzen Tag wendet er seine Hand.“ Im Hebräischen stehen zwei aufeinanderfolgende Verben („zurückkehren/sich wieder wenden“ und „wenden/umwenden“), die entweder formaler oder im Sinn einer wiederholten Handlung wiedergegeben werden können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die Klage. „Ja“ gibt diesen nachdrücklichen, nicht einschränkenden Sinn im Deutschen natürlich wieder.
- source_word: בִּי
  choice: gegen mich
  rationale: Im Zusammenhang feindlichen Handelns hat die Präposition adversative Bedeutung; „gegen mich“ macht diese Stoßrichtung deutlich.
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: wendet ... immer wieder
  rationale: Die Folge der beiden Verben („zurückkehren/sich wieder wenden“ und „wenden/umwenden“) kann eine wiederholte Handlung ausdrücken. Die Formulierung bewahrt den Sinn, ohne die hebräische Verbfolge unnatürlich nachzubilden.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Das konkrete Bild der Hand als Ausdruck von Macht und Handeln bleibt erhalten und wird nicht durch eine Deutung wie „Schlag“ ersetzt.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der ununterbrochenen zeitlichen Dauer.
