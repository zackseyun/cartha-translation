base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/039.yaml
  text: Why should a living man complain, a man, about his sins?
translation:
  language: de
  text: Warum sollte ein lebender Mensch, ein Mann, über seine Sünden klagen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Lesung lautet „seine Sünden“; die Schreibung des Textes hat „seine Sünde“.
    reason: Kennzeichnet die im hebräischen Text überlieferte Ketiv/Qere-Differenz, ohne eine der beiden Lesungen auszublenden.
lexical_decisions:
- source_word: מַה יִּתְאוֹנֵן
  choice: Warum beklagt sich
  rationale: Das interrogative מַה hat hier den Sinn von „warum/wozu“, und das reflexive Verb bezeichnet Klagen oder Sichbeklagen.
- source_word: אָדָם חָי
  choice: ein Mensch, solange er lebt
  rationale: Wörtlich „ein lebender Mensch“. Die temporale Formulierung gibt den Gedanken in natürlichem Deutsch wieder, ohne den Bezug auf das noch vorhandene Leben aufzugeben.
- source_word: גֶּבֶר
  choice: ein Mann
  rationale: Bewahrt den Wechsel vom allgemeinen אָדָם zum spezifischeren גֶּבֶר und damit die parallele, nachdrückliche Form des Hebräischen.
- source_word: עַל חטאו
  choice: über seine Sünden
  rationale: עַל kann hier den Gegenstand der Klage bezeichnen. Die ketiv-nahe Form wird entsprechend der masoretischen Lesetradition als „seine Sünde(n)“ verstanden; im Kontext ist der deutsche Plural idiomatisch.
theological_decisions:
- issue: Bezug von „über seine Sünden“
  choice: Die Formulierung bleibt als Gegenstand der Klage stehen.
  alternative: „wegen der Strafe für seine Sünden“ oder „angesichts seiner Sünde“
  rationale: Der hebräische Text nennt ausdrücklich nur חטאו und nicht Strafe oder Folgen. Eine solche Ergänzung würde die theologische Spannung des Kontextes erklärend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die knappe, elliptische Parallelstruktur ab; „ein Mann“ bleibt bewusst stehen, obwohl die Wiederholung im Deutschen markiert wirkt.
