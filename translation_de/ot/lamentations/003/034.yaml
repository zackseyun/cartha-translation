lexical_decisions:
- source_word: לְדַכֵּא
  choice: zu zermalmen
  rationale: Der Infinitiv mit לְ führt einen der in V. 34–36 genannten Unrechtstaten an. דכא bezeichnet ein Niederdrücken oder Zermalmen; „zermalmen“ bewahrt das starke, konkrete Bild.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition ist hier räumlich gebraucht und bezieht sich unmittelbar auf „seinen Füßen“.
- source_word: רַגְלָיו
  choice: seinen Füßen
  rationale: Die hebräische Form ist Plural mit einem Suffix der 3. Person Singular maskulin; der deutsche Dativ folgt auf „unter“ bei der dargestellten Lage.
- source_word: כֹּל
  choice: alle
  rationale: „Alle“ gibt den umfassenden, kollektiven Sinn vor dem pluralischen Ausdruck natürlich wieder.
- source_word: אֲסִירֵי
  choice: Gefangenen
  rationale: Das Substantiv bezeichnet Gefangene oder Gefesselte. „Gefangene“ ist im modernen Deutsch natürlich und passt zum Zusammenhang ungerechter Behandlung.
- source_word: אָרֶץ
  choice: der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. „Erde“ erhält hier den weiten poetischen Aussageumfang; die mögliche engere Wiedergabe wird in einer Fußnote festgehalten.
