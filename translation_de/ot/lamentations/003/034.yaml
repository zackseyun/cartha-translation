  language: de
  text: alle Gefangenen der Erde unter seinen Füßen zu zermalmen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Gefangenen des Landes“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
