  text: תִּרְדֹּ֤ף בְּ/אַף֙ וְ/תַשְׁמִידֵ֔/ם מִ/תַּ֖חַת שְׁמֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: de
  text: Du wirst sie im Zorn verfolgen und sie aus der Welt unter dem Himmel Jahwes vernichten[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Bitte: „Verfolge sie im Zorn und vernichte sie.“ Die hebräischen Imperfektformen können hier im Zusammenhang des Gebets auffordernden Charakter haben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „von unter den Himmeln Jahwes“; das poetische Bild bezeichnet ihre vollständige Beseitigung aus der Welt unter Gottes Himmel.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  choice: Du wirst sie … verfolgen
  rationale: Das Qal-Imperfekt der 2. Person Singular richtet sich an Gott. Das Futur bewahrt die bestimmte, zukunftsgerichtete Formulierung; die im Gebetszusammenhang mögliche Aufforderung wird in Fußnote [a] ausgewiesen.
- source_word: בְּאַף
  choice: im Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch Zorn. „Im Zorn“ gibt die durch בְּ markierte Art und Weise natürlich und würdig wieder.
- source_word: וְתַשְׁמִידֵם
  choice: und sie … vernichten
  rationale: Das Hifil-Imperfekt von שׁמד mit Objektsuffix bedeutet, jemanden zu vernichten oder zu beseitigen. „Vernichten“ bewahrt die Stärke des Verbs, ohne zusätzliche moderne Spezialbedeutungen einzutragen.
- source_word: מִתַּחַת
  choice: unter … hinweg
  rationale: מִן mit תַּחַת drückt eine Entfernung von unterhalb eines Bereichs aus. Die Verbindung „unter … hinweg“ erhält sowohl die räumliche Bildsprache als auch den Gedanken vollständiger Beseitigung.
- source_word: שְׁמֵי
  choice: Himmel
  rationale: Der hebräische Plural steht in einer poetischen Genitivverbindung. Im natürlichen modernen Deutsch bezeichnet „Himmel“ denselben umfassenden Bereich; der wörtliche Plural wird in Fußnote [b] genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageweise der hebräischen Imperfektformen im Gebetszusammenhang
  choice: 'Futurische Aussage: „Du wirst … verfolgen und … vernichten“'
  alternative: 'Bitte bzw. Aufforderung: „Verfolge sie … und vernichte sie“'
  rationale: Die Imperfektformen können als zukunftsgerichtete Aussage oder im Zusammenhang des Gebets volitiv verstanden werden. Der Haupttext folgt der formal futurischen Lesart, während Fußnote [a] die echte Gebetsnuance offenhält.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Das Futur erhält die Mehrdeutigkeit der hebräischen Imperfektformen, während die Fußnote die mögliche Bitte ausdrücklich nennt. „Unter Jahwes Himmel hinweg“ ist bewusst poetisch, bleibt aber im Deutschen verständlich.
