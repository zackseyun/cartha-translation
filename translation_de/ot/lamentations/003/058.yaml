  text: רַ֧בְתָּ אֲדֹנָ֛/י רִיבֵ֥י נַפְשִׁ֖/י גָּאַ֥לְתָּ חַיָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/058.yaml
  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
translation:
  language: de
  text: Du hast meine Rechtssache[a] vertreten, Herr; du hast mein Leben erlöst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du hast die Rechtsfälle meiner Seele geführt“; auch möglich: „Du hast die Sache meiner Seele vertreten“ oder „Du hast für mein Leben gestritten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  choice: hast … geführt
  rationale: Das Qal von ריב bezeichnet hier zusammen mit רִיבֵי das Führen beziehungsweise Vertreten eines Rechtsstreits. Die Formulierung bewahrt das Rechtsbild und klingt im Deutschen natürlich.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier die ehrfürchtige Gottesbezeichnung und zugleich direkte Anrede. „Herr“ gibt beides im üblichen deutschen Bibelregister wieder.
- source_word: רִיבֵי
  choice: meinen Rechtsstreit
  rationale: Der Plural kann hier kollektiv beziehungsweise intensiv den gesamten Rechtsfall des Sprechers bezeichnen. Der Singular „Rechtsstreit“ ist im Deutschen idiomatisch und erhält den juridischen Sinn.
- source_word: נַפְשִׁי
  choice: meinen
  rationale: Die Zugehörigkeit zu נַפְשִׁי wird idiomatisch in „meinen Rechtsstreit“ aufgenommen. Gemeint ist der Rechtsfall, der die eigene Person beziehungsweise das eigene Leben betrifft; eine Fußnote weist auf die wörtlichere Fassung hin.
- source_word: גָּאַלְתָּ
  choice: hast … erlöst
  rationale: 'גאל bezeichnet das Handeln eines Lösers: befreien, zurückfordern oder erlösen. „Erlöst“ bewahrt das eigenständige Erlösungsbild des zweiten Halbverses.'
- source_word: חַיָּי
  choice: mein Leben
  rationale: Die morphologische Mehrzahl bezeichnet idiomatisch das Leben. „Mein Leben“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Unterscheidung zwischen Rechts- und Erlösungsbild in den beiden Halbversen
  choice: Im ersten Halbvers bleibt die Rechtssprache („Rechtsstreit geführt“), im zweiten die Erlösungssprache („Leben erlöst“) erhalten.
  alternative: Beide Aussagen allgemein als Hilfe oder Rettung wiederzugeben.
  rationale: Die beiden verschiedenen hebräischen Wortfelder ריב und גאל sollen nicht zu einer einzigen allgemeinen Rettungsaussage eingeebnet werden.
- issue: Bedeutungsumfang von נַפְשִׁי
  choice: Im Haupttext idiomatisch als Besitzbezug in „meinen Rechtsstreit“ wiedergegeben, mit wörtlicherer Alternative in der Fußnote.
  alternative: „den Rechtsstreit meiner Seele“ oder „den Rechtsstreit um mein Leben“.
  rationale: נפש kann Seele, Leben, Selbst oder Person bezeichnen. Die idiomatische Hauptfassung legt keine enge anthropologische Deutung fest; die Fußnote bewahrt die genuine Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Perfekt entspricht dem rückblickenden hebräischen Sprechen; die direkte Anrede „Herr“ bleibt knapp und natürlich. Der Fußnotenmarker steht nach dem vollständigen Vers, weil er die mehrdeutige Wendung des ersten Halbverses erläutert.
