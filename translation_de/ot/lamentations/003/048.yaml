  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
translation:
  language: de
  text: Ströme von Wasser fließen aus meinen Augen herab über den Zusammenbruch der Tochter meines Volkes[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über den Untergang« oder »über die Zerrüttung der Tochter meines Volkes«.'
    reason: lexical_alternative
  - marker: b
    text: »Die Tochter meines Volkes« ist eine hebräische poetische Wendung, die das Volk – häufig Zion oder Juda – als Tochter personifiziert.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: Wasserbäche
  rationale: פֶּלֶג bezeichnet einen Wasserlauf, Bach oder Kanal. »Wasserbäche« bewahrt das eindringliche poetische Bild, ohne es durch »Fluten« unnötig zu steigern.
- source_word: תֵּרַד
  choice: fließen … herab
  rationale: ירד bedeutet wörtlich »hinabgehen« oder »herabsteigen«. In Verbindung mit Wasser und Augen gibt »fließen … herab« die Bewegung natürlich und anschaulich wieder.
- source_word: עֵינִי
  choice: meinen Augen
  rationale: Die hebräische Form steht morphologisch im Singular, kann hier aber kollektiv für die Augen gebraucht sein. Der deutsche Plural entspricht dem natürlichen Sprachgebrauch.
- source_word: עַל
  choice: wegen
  rationale: Die Präposition bezeichnet hier am wahrscheinlichsten den Anlass oder Grund der Klage. »Wegen« macht diesen kausalen Bezug im Deutschen klar, ohne den Gegenstand der Trauer näher auszudeuten.
- source_word: שֶׁבֶר
  choice: Zusammenbruch
  rationale: שֶׁבֶר kann Bruch, Zusammenbruch, Verderben oder Zerstörung bezeichnen. »Zusammenbruch« erhält das Bild des Zerbrechens und bezeichnet zugleich die umfassende Katastrophe des Volkes.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die wörtlich bewahrte hebräische Personifikation gehört zur Bildsprache der Klagelieder. Eine erläuternde Fußnote verhindert, dass die Wendung als Bezeichnung einer einzelnen Frau missverstanden wird.
theological_decisions:
- issue: Identität der »Tochter meines Volkes«
  choice: Die poetische Wendung wird im Haupttext beibehalten und nur allgemein als Personifikation des Volkes erklärt.
  alternative: Die Wendung unmittelbar mit »Zion«, »Juda« oder »mein Volk« wiedergeben.
  rationale: Der Vers selbst nennt die personifizierte Gemeinschaft nicht ausdrücklich Zion oder Juda. Die Übersetzung bewahrt daher die Bildsprache und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Klagesprache. Das konkrete Bild der aus den Augen herabfließenden Wasserbäche und die hebräische Personifikation bleiben erhalten; ungebräuchliche altertümliche Formulierungen werden vermieden.
