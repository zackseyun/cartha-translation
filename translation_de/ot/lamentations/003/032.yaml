base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: de
  text: Denn wenn er Kummer bereitet[a], wird er sich doch nach der Fülle seiner treuen Liebe[b] erbarmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn obwohl er Kummer bereitet, wird er sich doch nach der Fülle seiner treuen Liebe erbarmen.“ Die hebräische Formulierung kann im Zusammenhang konzessiv verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort ḥesed kann je nach Zusammenhang auch mit „beständige Liebe“, „Güte“, „Bundesliebe“ oder „Barmherzigkeit“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: „Denn“ bewahrt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang; „wenn“ gibt אִם konditional wieder. Die im Kontext mögliche konzessive Nuance wird durch „doch“ im Hauptsatz angedeutet und in der Fußnote ausdrücklich offengehalten.
- source_word: הוֹגָה
  choice: er Kummer bereitet
  rationale: Die Hifil-Form bezeichnet das Verursachen von Betrübnis oder Leid. „Kummer bereiten“ wahrt die kausative Bedeutung und passt zum emotionalen Sprachfeld der Klagelieder.
- source_word: וְרִחַם
  choice: erbarmt er sich doch
  rationale: רחם bezeichnet mitfühlendes Erbarmen. „Doch“ macht den Gegensatz der beiden Vershälften in natürlichem Deutsch hörbar, ohne das verbindende וְ als bloße zeitliche Folge auszulegen.
- source_word: כְּרֹב
  choice: gemäß der Fülle
  rationale: כְּ mit רֹב bezeichnet hier Maß beziehungsweise Entsprechung. Die Wendung gibt diese Beziehung relativ formnah und verständlich wieder.
- source_word: חסדו
  choice: seiner treuen Liebe
  rationale: חסד umfasst beständige, verlässliche Liebe, Güte und Barmherzigkeit. „Treue Liebe“ bewahrt den Beziehungs- und Loyalitätsaspekt und bleibt zugleich von רחם („sich erbarmen“) unterscheidbar.
theological_decisions:
- issue: Verhältnis von רחם und חסד
  choice: רחם wird mit „sich erbarmen“, חסד mit „treue Liebe“ wiedergegeben.
  alternative: Beide Ausdrücke könnten mit Wörtern aus dem Bedeutungsfeld „Barmherzigkeit“ wiedergegeben werden.
  rationale: 'Die unterschiedliche Wiedergabe erhält die hebräische Bedeutungsstruktur: Die erbarmende Handlung entspringt der Fülle von Gottes beständiger, verlässlicher Liebe, ohne beide eng verwandten Begriffe gleichzusetzen.'
- issue: Konditionale oder konzessive Deutung von כִּי אִם
  choice: Der Haupttext bleibt mit „Denn wenn … doch“ formal konditional und lässt zugleich einen konzessiven Klang zu.
  alternative: „Obwohl er Kummer bereitet, erbarmt er sich doch …“
  rationale: Die hebräische Verbindung kann im Zusammenhang konditional oder konzessiv gehört werden. Die gewählte Form vermeidet eine unnötig eindeutige Festlegung; die Alternative wird dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kummer bereiten“ ist allgemein verständlich und erhält den emotionalen Ton; „gemäß der Fülle“ bewahrt die maßbezogene Aussage des Hebräischen. Die Satzspannung zwischen verursachtem Kummer und anschließendem Erbarmen bleibt bestehen.
