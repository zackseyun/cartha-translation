  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
translation:
  language: de
  text: 'die Lippen derer, die sich gegen mich erheben,[a]

    und ihr Murmeln[b] gegen mich den ganzen Tag lang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Worte derer, die sich gegen mich erheben“. Im Hebräischen stehen die „Lippen“ konkret für das Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Sinnen“ oder „ihr Flüstern“. Das hebräische Wort kann inneres Nachsinnen oder leises Reden bezeichnen; der feindselige Zusammenhang spricht hier für „Murmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: die Lippen derer
  rationale: Die konkrete Metonymie „Lippen“ wird bewahrt; gemeint ist das, was die Gegner sagen.
- source_word: קָמַי
  choice: die sich gegen mich erheben
  rationale: Gibt die substantivische Form von קום mit Suffix eng am Hebräischen und im feindseligen Zusammenhang verständlich wieder.
- source_word: הֶגְיוֹנָם
  choice: ihr Murmeln
  rationale: Der Ausdruck kann inneres Sinnen oder leises Äußern bezeichnen. Im feindseligen Kontext passt „Murmeln“, ohne den Sinn zu „Pläne schmieden“ zu verengen.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition bedeutet wörtlich „über/auf mich“, bezeichnet bei feindseliger Rede hier aber idiomatisch deren Ausrichtung gegen den Sprecher.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche deutsche Wiedergabe der fortdauernden Zeitangabe.
