  text: סַכּ֤וֹתָה בֶֽ/עָנָן֙ לָ֔/ךְ מֵ/עֲב֖וֹר תְּפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/044.yaml
  text: You have covered yourself with a cloud so that prayer cannot pass through[a].
translation:
  language: de
  text: Du hast dich mit einer Wolke verhüllt, sodass kein Gebet hindurchdringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du hast dich mit einer Wolke verhüllt, damit Gebet nicht hindurchgeht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכּוֹתָה
  choice: du hast dich … verhüllt
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit paragogischem ה bezeichnet hier zusammen mit לָךְ idiomatisch ein Sich-Verhüllen. Das Perfekt wird im Deutschen natürlich mit dem Perfekt wiedergegeben.
- source_word: בֶעָנָן
  choice: mit einer Wolke
  rationale: בְּ bezeichnet hier am ehesten das Mittel oder das umhüllende Medium. Der Singular des hebräischen Substantivs bleibt erhalten.
- source_word: לָךְ
  choice: dich
  rationale: Formal bedeutet לָךְ „für dich/dir“, ergänzt hier aber סַכּוֹתָה zu einer reflexiven beziehungsweise benefaktiven Wendung. Im Deutschen wird dies idiomatisch durch das Reflexivpronomen ausgedrückt.
- source_word: מֵעֲבוֹר
  choice: sodass … nicht hindurchdringt
  rationale: מִן mit dem Infinitiv von עבר drückt Abhalten oder Ausschluss aus. Ein deutscher Folge- beziehungsweise Verhinderungssatz gibt den Sinn natürlich wieder.
- source_word: תְּפִלָּה
  choice: Gebet
  rationale: Der Singular ist generisch gebraucht. „Gebet“ bewahrt diesen allgemeinen Sinn und ist im modernen Deutschen natürlich.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes als derjenige, der Gebet abweist
  choice: 'Die direkte Anrede und das Bild bleiben erhalten: Gott verhüllt sich mit einer Wolke, sodass Gebet nicht hindurchdringt.'
  alternative: Das Bild abschwächen, etwa mit „Du hast dich in einer Wolke verborgen“, oder die Barriere unpersönlich darstellen.
  rationale: Der hebräische Text redet Gott unmittelbar an und zeichnet ein bewusst scharfes Klagebild. Die Übersetzung bewahrt die Spannung von Gottes Verborgenheit und Gericht, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verhüllt“ bewahrt die Bildhaftigkeit von סכך; „hindurchdringt“ formuliert die verhinderte Bewegung des Gebets idiomatisch und klar.
