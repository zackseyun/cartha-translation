  text: It is good for a man that he bear the yoke in his youth[a][b].
translation:
  language: de
  text: Gut ist es für einen Mann, dass er in seiner Jugend ein Joch trägt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für einen Menschen“; im Hebräischen steht das maskuline Singularwort „Mann“, hier in einer allgemein formulierten Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Joch auf sich nimmt“ beziehungsweise „erträgt“; das Bild bezeichnet das Tragen und Aushalten einer Last oder Disziplin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Gut ist es
  rationale: Das prädikative Adjektiv eröffnet den Satz. „Gut ist es“ bewahrt die hervorgehobene Anfangsstellung und klingt zugleich würdig und verständlich.
- source_word: לַגֶּבֶר
  choice: für einen Mann
  rationale: גֶּבֶר bezeichnet einen Mann und steht hier in einer allgemein formulierten Weisheitsaussage. Die konkrete maskuline Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: כִּי
  choice: wenn
  rationale: כִּי kann hier die Situation bezeichnen, in der die Aussage „gut“ gilt. „Wenn“ ergibt im Deutschen einen natürlichen Satz und lässt gegenüber einem rein inhaltlichen „dass“ eine echte syntaktische Mehrdeutigkeit bestehen.
- source_word: יִשָּׂא
  choice: trägt
  rationale: נשׂא bedeutet unter anderem heben, tragen und ertragen. Zusammen mit „Joch“ gibt „trägt“ das konkrete Bild wieder und schließt das geduldige Ertragen mit ein.
- source_word: עֹל
  choice: ein Joch
  rationale: עֹל bezeichnet wörtlich ein Joch und bildlich eine auferlegte Last oder Zucht. Der unbestimmte Artikel entspricht dem artikellosen Hebräisch und erhält das Bild.
- source_word: בִּנְעוּרָיו
  choice: in seiner Jugend
  rationale: Die Form bezeichnet mit dem Possessivsuffix die Lebenszeit der Jugend; „in seiner Jugend“ ist präzise und idiomatisch.
theological_decisions:
- issue: Generische Reichweite der maskulinen Formulierung
  choice: für einen Mann … in seiner Jugend
  alternative: für einen Menschen … in jungen Jahren
  rationale: Der hebräische Text verwendet ausdrücklich גֶּבֶר sowie maskuline Verb- und Suffixformen. Obwohl die Weisheitsaussage über ihren unmittelbaren grammatischen Referenten hinaus anwendbar sein kann, wird diese mögliche Reichweite nicht durch eine geschlechtsneutrale Wiedergabe in den Haupttext eingetragen.
- issue: Bedeutung des Jochbildes
  choice: ein Joch trägt
  alternative: eine Last oder Zucht erduldet
  rationale: Der Text benennt nicht ausdrücklich, worin das Joch besteht. Die bildhafte, theologisch offene Formulierung bleibt daher stehen, statt sie auf Leiden, Erziehung, Gehorsam oder göttliche Zucht festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, weisheitlicher und würdiger Satzform. Die Voranstellung „Gut ist es“ spiegelt die hebräische Hervorhebung. „Joch“ wird als bewusst offenes Bild beibehalten.
