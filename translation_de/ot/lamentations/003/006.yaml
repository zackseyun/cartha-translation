  revision_rationale: Die Revision verdeutlicht die kausative Aussage des Hifil, glättet die deutsche Syntax und gibt die zeitliche Ferne von עוֹלָם mit „Vorzeit“ wieder. Sie vermeidet eine Festlegung auf „ewig“ und bewahrt die alternative Nuance in der Fußnote.
