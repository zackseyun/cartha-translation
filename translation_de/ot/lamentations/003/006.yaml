  text: בְּ/מַחֲשַׁכִּ֥ים הוֹשִׁיבַ֖/נִי כְּ/מֵתֵ֥י עוֹלָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: de
  text: Er hat mich in Finsternis wohnen lassen wie die Toten der Vorzeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat mich in dunkle Orte gesetzt wie seit langem Tote.“'
    reason: „Dunkle Orte“ gibt den Plural von מַחֲשַׁכִּים räumlicher wieder; עוֹלָם kann bei den Toten ferner Vorzeit auch eine lange Dauer andeuten.
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: in Finsternis
  rationale: Der mit בְּ eingeleitete Plural bezeichnet den Bereich dunkler Orte beziehungsweise tiefer Dunkelheit. „In Finsternis“ ist im Deutschen natürlich und bewahrt das düstere Raumbild.
- source_word: הוֹשִׁיבַנִי
  choice: Er ließ mich … wohnen
  rationale: Der Hifil von ישׁב mit Suffix der 1. Person Singular bedeutet, jemanden sitzen oder wohnen zu lassen beziehungsweise an einen Ort zu setzen. Im Zusammenhang erzwungener, anhaltender Einschließung gibt „ließ mich wohnen“ den Kausativ natürlich wieder.
- source_word: כְּמֵתֵי
  choice: wie die Toten
  rationale: כְּ markiert den Vergleich; der Konstruktplural von מֵת bezeichnet Tote. Die Formulierung hält das Bild unmittelbar und verständlich.
- source_word: עוֹלָם
  choice: längst vergangener Zeiten
  rationale: עוֹלָם kann hier zeitliche Ferne, also Vorzeit oder lange vergangene Zeit, ausdrücken. Zusammen mit „die Toten“ ist nicht zwingend metaphysische Ewigkeit gemeint.
theological_decisions:
- issue: Zeitliche Bedeutung von עוֹלָם bei den Toten
  choice: längst vergangener Zeiten
  alternative: die ewig Toten
  rationale: Der Kontext legt lange zurückliegende Zeit beziehungsweise Vorzeit näher als eine Aussage über einen ewigen Zustand der Toten. Die Fußnote bewahrt die knappere und formal nähere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Finsternis- und Todesmetaphorik bleibt erhalten; die deutsche Formulierung vermeidet unnötige Archaismen.
