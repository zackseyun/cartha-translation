  text: חֲדָשִׁים֙ לַ/בְּקָרִ֔ים רַבָּ֖ה אֱמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/023.yaml
  text: They are new every morning[a]; great is your faithfulness.
translation:
  language: de
  text: Jeden Morgen sind sie neu[a]; groß ist deine Treue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie ist jeden Morgen neu“, wenn das unausgesprochene Subjekt aus der vorherigen Zeile kollektiv aufgefasst wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: neu
  rationale: Das pluralische Adjektiv bedeutet „neu“ oder „frisch“. „Neu“ ist im Deutschen natürlich und nimmt als ergänztes Subjekt am ehesten die im vorigen Vers genannten Erbarmungen auf.
- source_word: לַבְּקָרִים
  choice: jeden Morgen
  rationale: Die Zeitangabe mit ל und dem pluralisch gebrauchten בֹּקֶר bezeichnet die regelmäßige Wiederkehr; „jeden Morgen“ gibt diesen iterativen Sinn idiomatisch wieder.
- source_word: רַבָּה
  choice: groß
  rationale: Das Adjektiv bezeichnet hier im Prädikat zu einem Abstraktum Größe beziehungsweise Fülle; „groß“ entspricht der knappen und würdevollen Aussage des Hebräischen.
- source_word: אֱמוּנָתֶךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet Festigkeit, Verlässlichkeit und Treue. Auf Gott bezogen gibt „Treue“ seine zuverlässige Beständigkeit wieder, ohne den Ausdruck unnötig einzuengen.
theological_decisions:
- issue: Unausgesprochenes Subjekt aus dem vorherigen Vers
  choice: „sie“ als pluralisches Subjekt, bezogen auf die Erbarmungen in 3,22
  alternative: „Sie ist jeden Morgen neu“, wenn der vorausgehende Gedanke kollektiv beziehungsweise singularisch aufgefasst wird
  rationale: Der hebräische Vers beginnt mit dem pluralischen Adjektiv חֲדָשִׁים, ohne das Subjekt ausdrücklich zu nennen. Der unmittelbare Zusammenhang legt die zuvor genannten Erbarmungen als Bezug nahe; „sie“ bewahrt zudem den grammatischen Plural. Die alternative kollektive Auffassung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzgestalt. Die traditionelle und theologisch prägnante Wendung „groß ist deine Treue“ bleibt erhalten; die Wortstellung folgt zugleich der pointierten hebräischen Aussage.
