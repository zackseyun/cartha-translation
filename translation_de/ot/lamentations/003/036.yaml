  text: to deny a man justice in his case—the Lord does not approve[a][b].
translation:
  language: de
  text: einem Menschen in seinem Rechtsstreit das Recht zu beugen[a] – der Herr sieht es nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „einen Menschen in seiner Rechtssache zu benachteiligen“ oder „das Recht eines Menschen in seinem Prozess zu verdrehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Herr sieht nicht“. Gemeint sein kann auch: „Der Herr billigt es nicht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  choice: um sein Recht zu bringen
  rationale: Das Piel von עוה bezeichnet hier das Verdrehen oder Beugen des Rechts. Zusammen mit בְּרִיבוֹ gibt die idiomatische deutsche Wendung den rechtlichen Sinn klar wieder.
- source_word: אָדָם
  choice: einen Menschen
  rationale: Das singularische אָדָם bezeichnet hier eine einzelne Person in einer Rechtssache; „einen Menschen“ ist im Deutschen natürlich und wahrt den allgemeinmenschlichen Bezug.
- source_word: בְּרִיבוֹ
  choice: in seinem Rechtsstreit
  rationale: רִיב kann einen Streit, eine Rechtssache oder einen Prozess bezeichnen. „Rechtsstreit“ macht den forensischen Zusammenhang deutlich.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der als Gottesbezeichnung gebrauchte Titel und wird konventionell mit „der Herr“ wiedergegeben.
- source_word: לֹא רָאָה
  choice: sieht es nicht
  rationale: Die Wiedergabe bewahrt das hebräische Verb „sehen“ und lässt dessen mögliche evaluative Bedeutung offen. Das Perfekt kann im Zusammenhang eine allgemeine Aussage ausdrücken.
theological_decisions:
- issue: Ob לֹא רָאָה Wahrnehmung, Missbilligung oder eine rhetorische Frage ausdrückt
  choice: der Herr sieht es nicht
  alternative: der Herr billigt es nicht; sollte der Herr es nicht sehen?
  rationale: Der Haupttext bewahrt die konkrete Bildsprache des hebräischen Verbs und löst die Spannung nicht vorschnell auf. Die evaluative Bedeutung „billigen“ sowie die mögliche rhetorische Auffassung werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als drittes Glied der in Vers 34 begonnenen Infinitivreihe syntaktisch fragmentarisch. Die Rechtsmetaphorik ist klar, während die Mehrdeutigkeit von „sehen“ erhalten bleibt.
