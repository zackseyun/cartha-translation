  text: רָאִ֨יתָה֙ כָּל נִקְמָתָ֔/ם כָּל מַחְשְׁבֹתָ֖/ם לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/060.yaml
  text: You have seen all their vengeance[a], all their schemes against me.
translation:
  language: de
  text: Du hast all ihre Rache gesehen, all ihre Pläne gegen mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Du hast … gesehen
  rationale: Das Qal Perfekt 2. Person Singular richtet sich an Gott. Das deutsche Perfekt gibt die vollendete Wahrnehmung mit ihrer fortdauernden Bedeutung im Klagekontext natürlich wieder.
- source_word: כָּל
  choice: all
  rationale: Das zweimalige כָּל bezeichnet jeweils die Gesamtheit; „all“ ist im Deutschen direkt und idiomatisch.
- source_word: נִקְמָתָם
  choice: ihre Rache
  rationale: נְקָמָה bezeichnet Rache beziehungsweise Vergeltung. „Ihre Rache“ bewahrt die Schärfe des Ausdrucks und gibt das Pluralsuffix wieder.
- source_word: מַחְשְׁבֹתָם
  choice: ihre Pläne
  rationale: מַחֲשָׁבוֹת kann Gedanken, Absichten oder Pläne bezeichnen. „Pläne“ erhält die lexikalische Offenheit besser als das bereits wertende „Anschläge“; die feindliche Ausrichtung ergibt sich aus dem Kontext und aus „gegen mich“.
- source_word: לִי
  choice: gegen mich
  rationale: לְ kann eine Beziehung oder Ausrichtung bezeichnen. Im Zusammenhang mit Rache und feindlichen Absichten ist „gegen mich“ die natürliche kontextuelle Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die parallele Satzstruktur des Hebräischen bleibt erhalten; „Pläne“ vermeidet eine unnötige zusätzliche Wertung, während „gegen mich“ die im Kontext erkennbare Feindschaft ausdrückt.
