source:
  edition: WLC
  text: קָרָ֤אתִי שִׁמְ/ךָ֙ יְהוָ֔ה מִ/בּ֖וֹר תַּחְתִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/055.yaml
  text: I called on your name[a], O Yahweh, from the depths of the pit.
translation:
  language: de
  text: Ich rief deinen Namen an, Jahwe, aus der tiefsten Grube.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »aus der Grube der Tiefen«; auch möglich: »aus den Tiefen der Grube« oder »aus der untersten Grube«.'
    reason: Die Verbindung בּוֹר תַּחְתִּיּוֹת lässt sich als tiefste beziehungsweise unterste Grube oder als Grube der Tiefen verstehen.
lexical_decisions:
- source_word: קָרָאתִי
  choice: Ich rief … an
  rationale: Das Qal Perfekt 1. Person Singular von קרא bezeichnet mit »deinen Namen« als Ergänzung das anrufende Gebet. Die deutsche Wendung »den Namen anrufen« gibt dieses Idiom natürlich und quellennah wieder.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die wörtliche Formulierung bleibt erhalten. Der Name steht hier für die angerufene Person, ohne dass diese hebräische Ausdrucksweise zu »dich« vereinfacht wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel »HERR« ersetzt. »Jahwe« ist die geläufige deutsche Wiedergabe.
- source_word: מִבּוֹר
  choice: aus der … Grube
  rationale: בּוֹר kann Grube, Zisterne oder ein grubenartiges Gefängnis bezeichnen. »Grube« bewahrt hier sowohl das konkrete Bild als auch seinen bildhaften Klang.
- source_word: תַּחְתִּיּוֹת
  choice: tiefsten
  rationale: Die feminine Pluralform von תחת bezeichnet unterste Bereiche oder Tiefen. In Verbindung mit בּוֹר gibt »tiefste Grube« die Vorstellung eines äußersten, todnahen Tiefenortes in natürlichem Deutsch wieder; die formale Mehrdeutigkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Wiedergabe »Jahwe« wahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die direkte Anrede »Jahwe« nahe beim angerufenen Namen; »aus der tiefsten Grube« klingt natürlich und bewahrt die eindringliche Tiefenmetaphorik.
