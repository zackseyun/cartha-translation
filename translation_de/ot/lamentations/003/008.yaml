  text: גַּ֣ם כִּ֤י אֶזְעַק֙ וַ/אֲשַׁוֵּ֔עַ שָׂתַ֖ם תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: de
  text: Auch wenn[a] ich aufschreie und um Hilfe rufe, lässt er mein Gebet nicht durch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Obwohl.'
    reason: גַּם כִּי kann hier sowohl konditional-konzessiv („auch wenn“) als auch rein konzessiv („obwohl“) verstanden werden.
lexical_decisions:
- source_word: גַּם כִּי
  choice: Auch wenn
  rationale: 'Die Verbindung hat hier konzessive Kraft: Trotz des Hilferufs bleibt die geschilderte Reaktion bestehen. „Auch wenn“ ist natürliches modernes Deutsch und bewahrt diese Spannung.'
- source_word: אֶזְעַק
  choice: ich aufschreie
  rationale: זעק bezeichnet einen eindringlichen Schrei aus Not. „Aufschreien“ gibt diese Intensität wieder und bleibt von dem folgenden ausdrücklichen Hilferuf unterscheidbar.
- source_word: וַאֲשַׁוֵּעַ
  choice: und um Hilfe rufe
  rationale: שׁוע bezeichnet hier den dringenden Ruf nach Beistand. Die Wiedergabe macht das erbetene Ziel deutlich, ohne beide parallelen Verben gleich zu übersetzen.
- source_word: שָׂתַם
  choice: wehrt … ab
  rationale: Das Verb bedeutet „verstopfen, verschließen, blockieren“. In Verbindung mit „mein Gebet“ drückt „abwehren“ idiomatisch aus, dass dem Gebet der Zugang versperrt wird, ohne ein nicht genanntes Bild wie Ohren oder einen Weg einzufügen.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: Die direkte und kontextgemäße Bedeutung ist „mein Gebet“.
theological_decisions:
- issue: Unausgesprochenes Subjekt von שָׂתַם
  choice: Das maskuline Singularpronomen „er“ bleibt stehen, ohne den Handelnden ausdrücklich als Gott oder den HERRN zu benennen.
  alternative: 'Den Handelnden ausdrücklich als Gott benennen oder passiv formulieren: „Mein Gebet wird abgewehrt.“'
  rationale: Die Verbform ist maskulin Singular, doch in diesem Satz wird das Subjekt nicht ausdrücklich genannt. Der Zusammenhang macht den Bezug verständlich; „er“ bewahrt die knappe Form des Hebräischen und fügt keinen Gottesnamen hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufschreien“ und „um Hilfe rufen“ erhalten die Intensität und zugleich die Unterscheidung der beiden hebräischen Verben; „wehrt … ab“ vermeidet eine schwer verständliche wörtliche Formulierung.
