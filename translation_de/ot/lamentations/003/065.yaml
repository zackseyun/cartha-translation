    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: Du wirst geben
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular von נתן ist an Gott gerichtet. Die Zukunftsform bewahrt den feierlichen Charakter der Bitte, ohne die ebenfalls mögliche Wunschbedeutung festzuschreiben.
- source_word: מְגִנַּת לֵב
  choice: ein verhärtetes Herz
  rationale: Wörtlich bezeichnet die seltene Wendung wohl eine »Bedeckung/Abschirmung des Herzens«. Im Zusammenhang mit dem Fluch ist wahrscheinlich eine negative innere Verfassung gemeint; »ein verhärtetes Herz« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: תַּאֲלָתְךָ
  choice: dein Fluch
  rationale: Das Substantiv bezeichnet hier einen Fluch beziehungsweise Schwurfluch. »Dein Fluch« ist die klare und sachgemäße deutsche Wiedergabe.
- source_word: לָהֶם ... לָהֶם
  choice: ihnen ... über sie
  rationale: Die Wiederholung kennzeichnet nachdrücklich dieselben Empfänger. Die zweite Präposition wird idiomatisch mit »über sie« wiedergegeben.
theological_decisions:
- issue: Gebet beziehungsweise Verwünschung oder Vorhersage
  choice: Du wirst ihnen ... geben; dein Fluch wird über sie kommen.
  alternative: Gib ihnen ein verhärtetes Herz, deinen Fluch über sie.
  rationale: Das Imperfekt kann als Zukunftsaussage oder als wunschhaft-auffordernde Verwünschung verstanden werden. Der Haupttext wahrt die Form als feierliche Zukunftsaussage; die mögliche Gebetsform wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene hebräische Wendung wird verständlich und zugleich durch eine Fußnote transparent wiedergegeben; die Spannung zwischen Vorhersage und Verwünschungsgebet bleibt erhalten.
