  text: You will give them hardness of heart[b][a]; your curse will be upon them.
translation:
  language: de
  text: Du wirst ihnen ein verhärtetes Herz geben[b][a]; dein Fluch gilt ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Bitte beziehungsweise Verwünschung: »Gib ihnen ein verhärtetes Herz; dein Fluch gelte ihnen.« Das hebräische Imperfekt kann hier wunschhaft verstanden werden.'
    reason: alternative_reading
  - marker: b
