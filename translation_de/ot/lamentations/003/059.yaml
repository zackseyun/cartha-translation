  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
translation:
  language: de
  text: Du hast, Jahwe, das Unrecht gesehen, das mir angetan wurde[a]; sprich Recht in meiner Sache[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „meine Rechtsbeugung“; gemeint sein kann das gegen den Sprecher verübte Unrecht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Entscheide meinen Rechtsstreit“; sinngemäß: „Verschaffe mir Recht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Du hast … gesehen
  rationale: Das Qal Perfekt 2. Person maskulin Singular von ראה bezeichnet Gottes bereits erfolgtes Wahrnehmen mit gegenwärtiger Bedeutung für die Bitte. Das deutsche Perfekt klingt in der direkten Anrede natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „HERR“ ersetzt. „Jahwe“ ist die im modernen Standarddeutsch geläufige Form.
- source_word: עַוָּתָתִי
  choice: das Unrecht …, das mir angetan wurde
  rationale: Das Substantiv kann Verdrehung, Rechtsbeugung oder Unrecht bezeichnen. Im Zusammenhang klagt der Sprecher erlittenes Unrecht an; die objektive Wiedergabe vermeidet das Missverständnis, er bekenne eigenes Fehlverhalten.
- source_word: שָׁפְטָה
  choice: sprich Recht
  rationale: Der Imperativ von שׁפט ruft Jahwe zu richterlichem Handeln auf. „Recht sprechen“ bewahrt das Rechtsbild und ist im Deutschen natürlicher als das isolierte „richte“.
- source_word: מִשְׁפָּטִי
  choice: in meiner Sache
  rationale: מִשְׁפָּט kann Urteil, Recht, Rechtsanspruch oder Rechtsfall bedeuten. Zusammen mit שׁפט bezeichnet es hier die Rechtssache, die Gott entscheiden soll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von עַוָּתָתִי
  choice: das Unrecht, das mir angetan wurde
  alternative: mein Unrecht
  rationale: Der Klage- und Gerichtszusammenhang spricht dafür, dass der Beter erlittene Rechtsbeugung vor Gott bringt. Die formale Mehrdeutigkeit der Suffixverbindung wird in einer Fußnote kenntlich gemacht.
- issue: Tragweite der Bitte שָׁפְטָה מִשְׁפָּטִי
  choice: sprich Recht in meiner Sache
  alternative: verschaffe mir Recht
  rationale: Die Hauptfassung bewahrt die gerichtliche Ausdrucksweise, ohne das erbetene Urteil ausdrücklich vorwegzunehmen. Die kontextuell naheliegende Bitte um Rechtfertigung bzw. Rechtsschutz wird als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetsanrede. Die juristische Bildwelt des Hebräischen bleibt erhalten; zugleich werden schwer verständliche wörtliche Wendungen idiomatisch formuliert.
