base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/052.yaml
  text: My enemies hunted me like a bird[a], without cause.
translation:
  language: de
  text: Meine Feinde jagten mich[a] wie einen Vogel, ohne Grund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird das Verb „jagen“ durch einen vorangestellten absoluten Infinitiv verstärkt, wörtlich etwa: „Jagen jagten sie mich.“ Möglich ist daher auch: „Meine Feinde machten regelrecht Jagd auf mich wie auf einen Vogel, ohne Grund.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֥וֹד צָד֛וּנִי
  choice: jagten mich
  rationale: Die Wortwurzel צוד bezeichnet das Jagen oder Fangen von Beute. Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt die Aussage; im Haupttext bleibt die natürliche deutsche Formulierung stehen, während die Betonung in der Fußnote erläutert wird.
- source_word: כַּצִּפּוֹר
  choice: wie einen Vogel
  rationale: צִפּוֹר ist hier eine allgemeine Bezeichnung für einen Vogel, nicht für eine bestimmte Art. Der Akkusativ ist im Deutschen idiomatisch, weil das Ich als gejagte Beute mit einem Vogel verglichen wird.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Die direkte und allgemein verständliche Entsprechung bewahrt die persönliche Feindschaft des Ausgangstextes.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: חִנָּם bezeichnet hier grundlose, unverschuldete Verfolgung, nicht eine Handlung ohne Bezahlung. „Ohne Grund“ ist knapp, natürlich und moralisch nicht überdeutend.
theological_decisions: []
