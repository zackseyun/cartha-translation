  text: 'You heard my voice: do not hide your ear from my plea for relief[a], from my cry for help.'
translation:
  language: de
  text: Du hast meine Stimme gehört. Verschließ dein Ohr nicht vor meinem Flehen um Erleichterung[a], vor meinem Hilferuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit anderer Deutung der schwierigen hebräischen Wendung: „Verschließ dein Ohr nicht vor meinem Aufatmen, vor meinem Hilferuf.“ Das hebräische Wort kann „Erleichterung“, „Aufatmen“ oder „Atemholen“ bedeuten; auch der Anschluss der beiden Präpositionalgruppen ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: קוֹל bezeichnet hier die Stimme des Beters; die konkrete persönliche Formulierung passt zum Gebetskontext.
- source_word: שָׁמָעְתָּ
  choice: du hast … gehört
  rationale: Das Qal-Perfekt 2. Person maskulin Singular bezeichnet ein vollzogenes Hören. Das deutsche Perfekt klingt in gegenwärtiger Standardsprache natürlich.
- source_word: אַל תַּעְלֵם אָזְנְךָ
  choice: Verschließ dein Ohr nicht
  rationale: Die negative Bitte wird direkt wiedergegeben. Obwohl עלם eigentlich ein Verbergen bezeichnet, ist „das Ohr verschließen“ im Deutschen die natürliche bildhafte Entsprechung und vermeidet das unverständliche „das Ohr verbergen“.
- source_word: לְרַוְחָתִי
  choice: vor meinem Flehen um Erleichterung
  rationale: רַוְחָה kann Erleichterung, Aufatmen oder freien Raum bezeichnen. Die schwierige elliptische Wendung wird im Zusammenhang mit dem parallelen Hilferuf als Flehen um Erleichterung verstanden, ohne die Unsicherheit zu verschweigen.
- source_word: לְשַׁוְעָתִי
  choice: vor meinem Hilferuf
  rationale: שַׁוְעָה bezeichnet einen dringenden Schrei um Hilfe. „Hilferuf“ ist knapp, idiomatisch und wahrt die Dringlichkeit.
theological_decisions:
- issue: Bezug der beiden ל-Präpositionalgruppen
  choice: 'Sie werden mit der negativen Bitte verbunden: Das Ohr soll nicht vor dem Flehen beziehungsweise Hilferuf verschlossen werden.'
  alternative: Sie können mit „auf meine Erleichterung, auf meinen Hilferuf“ oder stärker wörtlich mit „bei meinem Aufatmen“ wiedergegeben werden.
  rationale: Die hebräische Konstruktion ist schwierig. Der Haupttext bietet eine verständliche syntaktische Deutung; die Fußnote bewahrt die echte Mehrdeutigkeit, ohne eine theologische Folgerung einzutragen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Parallelismus bleibt erhalten; ein Punkt statt Doppelpunkt sorgt im Deutschen für einen natürlichen poetischen Rhythmus. Die Fußnotenmarke [a] steht unmittelbar bei der strittigen Wendung.
