  text: נַ֤חְנוּ פָשַׁ֨עְנוּ֙ וּ/מָרִ֔ינוּ אַתָּ֖ה לֹ֥א סָלָֽחְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/042.yaml
  text: We have transgressed and rebelled[a]; you have not forgiven.
translation:
  language: de
  text: Wir haben uns schuldig gemacht und rebelliert; du hast nicht vergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחְנוּ
  choice: Wir
  rationale: Das selbstständige Personalpronomen der ersten Person Plural wird ausdrücklich wiedergegeben, um die hervorgehobene Gegenüberstellung »wir …; du …« zu bewahren.
- source_word: פָשַׁעְנוּ
  choice: haben uns vergangen
  rationale: פשע bezeichnet schuldhafte Übertretung beziehungsweise Auflehnung. »Uns vergangen« gibt den moralischen Verstoß natürlich wieder, ohne die Bedeutung mit dem folgenden, ausdrücklich auf Rebellion zielenden Verb zusammenfallen zu lassen.
- source_word: וּמָרִינוּ
  choice: und rebelliert
  rationale: מרה bedeutet »widerspenstig sein, rebellieren«. Die verbale Wiedergabe wahrt die Parallelität und die Steigerung gegenüber פשע.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten, weil es Gott direkt anspricht und den Kontrast zum vorangehenden »wir« betont.
- source_word: לֹא
  choice: nicht
  rationale: Die einfache Verneinung bezieht sich unmittelbar auf das folgende Verb.
- source_word: סָלָחְתָּ
  choice: hast nicht vergeben
  rationale: סלח ist der übliche Ausdruck für Vergebung, besonders für Gottes Vergebung. Das deutsche Perfekt klingt in gegenwärtigem Standarddeutsch natürlich und bewahrt die im Klagezusammenhang fortwirkende Aussage.
theological_decisions:
- issue: Gottes Nichtvergeben in der Klage
  choice: du hast nicht vergeben
  alternative: du vergabst nicht / du hast nicht verziehen
  rationale: Die direkte Aussage des hebräischen Textes wird weder abgeschwächt noch theologisch aufgelöst. So bleibt die Spannung der Klage bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Zweiteilung und die betonte Gegenüberstellung »Wir …; du …« bleiben erhalten. Kein Fußnotenmarker ist nötig, da »vergeben« die gewöhnliche und genaue deutsche Entsprechung von סלח ist.
