revisions:
- from: Wir haben uns vergangen und rebelliert; du hast nicht vergeben.
  to: Wir haben uns schuldig gemacht und rebelliert; du hast nicht vergeben.
  rationale: Die Revision ersetzt allein die im Deutschen unvollständige beziehungsweise unnatürliche Wendung »uns vergangen« durch »uns schuldig gemacht«. Die knappe Satzstruktur, der Kontrast zwischen »wir« und »du«, die Unterscheidung von schuldhafter Übertretung und Rebellion sowie die uneingeschränkte Aussage des Nichtvergebens bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:14Z'
review_pass:
  verdict: revise
  source_fidelity: Die Struktur und die hervorgehobene Gegenüberstellung »Wir …; du …« entsprechen dem Hebräischen. »Rebelliert« gibt וּמָרִינוּ treffend wieder, und »du hast nicht vergeben« gibt סָלָחְתָּ angemessen und ohne theologische Abschwächung wieder. Das objektlos gebrauchte »haben uns vergangen« ist jedoch im modernen Standarddeutsch unidiomatisch bzw. lässt gewöhnlich eine Ergänzung wie »gegen dich« erwarten.
  naturalness: Eine leichte idiomatische Korrektur ist nötig. »Wir haben uns schuldig gemacht« ist modernes, natürliches Deutsch und wahrt die von פָּשַׁע ausgedrückte schuldhafte Übertretung, ohne mit dem folgenden »rebelliert« zusammenzufallen.
  terminology: »Sich schuldig machen« ist hier eine angemessene allgemeine Wiedergabe für פָּשַׁעְנוּ; »rebelliert« bewahrt die eigenständige Nuance von מָרִינוּ. »Vergeben« ist die übliche und präzise deutsche Entsprechung von סלח.
  issues:
  - severity: medium
    issue: Objektloses »Wir haben uns vergangen«
    rationale: »Sich vergehen« wird im heutigen Standarddeutsch normalerweise mit einer Ergänzung gebraucht (etwa »sich an jemandem vergehen« oder »sich gegen etwas vergehen«). Da der hebräische Text kein Objekt ergänzt, ist eine idiomatische objektlose Formulierung vorzuziehen.
  revised_text: Wir haben uns schuldig gemacht und rebelliert; du hast nicht vergeben.
  revised_footnotes: []
