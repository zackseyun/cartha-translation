base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/053.yaml
  text: They silenced my life in the pit[a], and threw a stone at me.
translation:
  language: de
  text: Sie machten meinem Leben in der Grube ein Ende und warfen einen Stein nach mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und warfen einen Stein auf mich“. Das kann möglicherweise auch das Bild meinen, dass sie die Grube mit einem Stein verschlossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  choice: brachten … zum Schweigen
  rationale: Das Verb kann ‚beenden‘, ‚vernichten‘ oder ‚zum Schweigen bringen‘ bedeuten. Die gewählte Formulierung bewahrt die Bildsprache des Hebräischen, ohne eindeutig festzulegen, ob der Tod bereits eingetreten ist.
- source_word: בַבּוֹר
  choice: in der Grube
  rationale: בּוֹר bezeichnet eine Grube und kann je nach Zusammenhang auch eine Zisterne oder ein grabartiges Gefängnis meinen. ‚Grube‘ hält diese Bedeutungsbreite weitgehend offen.
- source_word: חַיַּי
  choice: mein Leben
  rationale: Die formal plurale Form mit Suffix wird idiomatisch für das Leben einer Person gebraucht; ‚mein Leben‘ ist im Deutschen natürlich und inhaltlich präzise.
- source_word: וַיַּדּוּ
  choice: warfen
  rationale: Das Verb bedeutet ‚werfen‘ oder ‚schleudern‘. ‚Warfen‘ ist klar, gegenwärtig und nicht unnötig dramatisierend.
- source_word: אֶבֶן
  choice: einen Stein
  rationale: Der singularische Ausdruck wird im Deutschen nach ‚werfen‘ idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: בִּי
  choice: auf mich
  rationale: Die Präposition ב kann hier Kontakt beziehungsweise eine Bewegung auf die Person hin ausdrücken. ‚Auf mich‘ lässt sowohl einen gegen die Person geworfenen Stein als auch einen über der Grube angebrachten Verschlussstein zu.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Verbindung „mein Leben … zum Schweigen“ wurde bewusst erhalten, weil sie die hebräische Bildsprache und ihre Spannung zwischen Todesnähe und endgültiger Vernichtung wahrt.
