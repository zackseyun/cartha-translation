- from: Sie brachten mein Leben in der Grube zum Schweigen und warfen einen Stein auf mich.[a]
  to: Sie machten meinem Leben in der Grube ein Ende und warfen einen Stein nach mir.[a]
  rationale: Die Revision ersetzt die im Deutschen sperrige Umschreibung „mein Leben zum Schweigen bringen“ durch eine natürliche Wiedergabe des Abschneidens bzw. Beendens des Lebens. Sie setzt die idiomatische Zielrichtung des Steinwerfens in den Haupttext und bewahrt die aufgrund von ב mögliche Kontakt- oder Verschlusslesart in der Fußnote. Die Fußnote vermeidet die zusätzliche, im Text nicht ausdrücklich festgelegte Vorstellung einer Steinigung.
