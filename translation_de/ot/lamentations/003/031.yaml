base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/031.yaml
  text: For the Lord will not reject forever[a].
translation:
  language: de
  text: Denn der Herr verwirft nicht für immer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verstößt“ oder „gibt preis“. Das hebräische Verb kann Verwerfen, Verstoßen oder Preisgeben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den Gedanken im unmittelbaren Zusammenhang ein und bewahrt zugleich die mögliche erklärende Nuance, ohne sie stärker festzulegen.
- source_word: לֹא
  choice: nicht
  rationale: Gibt die unmittelbare Verneinung des Verbs schlicht und genau wieder.
- source_word: יִזְנַח
  choice: verwirft
  rationale: זנח bezeichnet das Verwerfen, Verstoßen oder Preisgeben. „Verwirft“ ist im modernen Deutschen klar, würdevoll und lässt die relationale Aussage offen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Bezeichnet hier eine unbegrenzte Dauer; zusammen mit der Verneinung wird ausgesagt, dass das Verwerfen nicht endgültig ist.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den göttlichen Hoheitstitel אֲדֹנָי wieder, nicht den Gottesnamen JHWH. Der Artikel entspricht natürlichem deutschem Sprachgebrauch.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels
  choice: der Herr
  alternative: Herr
  rationale: Der hebräische Text hat אֲדֹנָי als Hoheitstitel. „Der Herr“ ist im deutschen Satz idiomatisch und führt keine Unterscheidung ein, die über den Ausgangstext hinausgeht.
- issue: Dauer des göttlichen Verwerfens
  choice: nicht für immer
  alternative: nicht auf ewig
  rationale: Die Formulierung bewahrt die Aussage, dass das Verwerfen nicht endgültig ist, ohne daraus abzuleiten, wie lange es dauert oder auf welche Weise es endet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Satzstruktur des Hebräischen bleibt erhalten.
