id: LAM.3.29
reference: Lamentations 3:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִתֵּ֤ן בֶּֽ/עָפָר֙ פִּ֔י/הוּ אוּלַ֖י יֵ֥שׁ תִּקְוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: de
  text: Er lege seinen Mund in den Staub – vielleicht gibt es Hoffnung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild, den Mund in den Staub zu legen, kann tiefe Demut, Erniedrigung oder schweigende Unterwerfung ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Er lege
  rationale: Die Jussivform von נתן hat im Zusammenhang der Aufforderungen in V. 27–30 einen auffordernden Sinn. Der deutsche Konjunktiv I »er lege« gibt diesen knapp und würdig wieder.
- source_word: בֶּעָפָר
  choice: in den Staub
  rationale: עָפָר bezeichnet Staub oder lockere Erde. Wegen der mit נתן ausgedrückten Bewegung ist im Deutschen »in den Staub« natürlich und bewahrt zugleich das konkrete biblische Bild.
- source_word: פִּיהוּ
  choice: seinen Mund
  rationale: Die wörtliche Körperbezeichnung samt Suffix der 3. Person Singular bleibt erhalten; die mögliche Bedeutung von Schweigen, Erniedrigung oder Unterwerfung wird nicht in den Haupttext hineingedeutet.
- source_word: אוּלַי
  choice: vielleicht
  rationale: Das Wort drückt eine zurückhaltende Möglichkeit aus. »Vielleicht« ist im modernen Standarddeutsch natürlich und bewahrt die Unsicherheit der Hoffnung.
- source_word: יֵשׁ
  choice: gibt es
  rationale: Die Existenzpartikel wird direkt wiedergegeben; die Einschränkung liegt bereits in »vielleicht«.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: »Hoffnung« ist die naheliegende Entsprechung und passt zum Kontext möglicher Rettung oder Wiederherstellung, ohne deren Inhalt näher festzulegen.
theological_decisions:
- issue: Bildhafte Haltung der Demut und Unterwerfung
  choice: Das konkrete Bild »seinen Mund in den Staub« bleibt im Haupttext erhalten.
  alternative: Sich demütig niederbeugen; erniedrigt schweigen; sich unterwerfen.
  rationale: Das Hebräische deutet durch eine körperliche Handlung tiefe Demut, Erniedrigung oder schweigende Unterwerfung an, legt die genaue Nuance aber nicht ausdrücklich fest. Eine ausdeutende Paraphrase würde diese Offenheit unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffordernde Konjunktiv »Er lege« entspricht dem jussiven Zusammenhang; Gedankenstrich und knapper Nachsatz bewahren Rhythmus und Spannung des hebräischen Verses.
