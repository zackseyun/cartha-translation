  text: אוֹתִ֥/י נָהַ֛ג וַ/יֹּלַ֖ךְ חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: de
  text: Er hat mich getrieben und mich in Finsternis gehen lassen, nicht ins Licht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat mich geführt und mich in Finsternis gehen lassen, nicht ins Licht.“'
    reason: Das Verb נָהַג kann sowohl „treiben“ als auch neutraler „führen“ bedeuten.
lexical_decisions:
- source_word: אוֹתִי
  choice: mich
  rationale: Die Objektpartikel mit dem Suffix der 1. Person Singular wird im Deutschen natürlich durch „mich“ wiedergegeben.
- source_word: נָהַג
  choice: hat mich getrieben
  rationale: Das Verb kann „führen“, „treiben“ oder „leiten“ bedeuten. Im Zusammenhang der Klage bringt „getrieben“ den bedrängenden, zwingenden Charakter am besten zum Ausdruck.
- source_word: וַיֹּלַךְ
  choice: hat mich gehen lassen
  rationale: 'Die Hifil-Form von הלך hat kausative Bedeutung: Er bewirkte, dass der Sprecher ging. „Mich gehen lassen“ bewahrt diese Kausalität, ohne das im Deutschen missverständliche „mich laufen lassen“ zu verwenden.'
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ gibt das konkrete und zugleich poetisch gewichtige חֹשֶׁךְ in einem würdigen, gut verständlichen Register wieder.
- source_word: וְלֹא אוֹר
  choice: und nicht im Licht
  rationale: Die knappe Gegenüberstellung des Hebräischen wird weitgehend bewahrt; die Ergänzung von „im“ macht die Wendung im Deutschen verständlich und parallel zu „in Finsternis“.
theological_decisions:
- issue: Agens des Handelns
  choice: Das männliche Pronomen „Er“ wird ohne ausdrückliche Identifizierung wiedergegeben.
  alternative: „Gott“ ausdrücklich einsetzen.
  rationale: Der hebräische Vers nennt das Subjekt nur implizit durch die Verbformen. Eine ausdrückliche Benennung Gottes würde die vom Text an dieser Stelle bewahrte Referenz überdeutlich machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. Die harte Gegenüberstellung von Finsternis und Licht sowie die mögliche Zwangskomponente des ersten Verbs bleiben erhalten.
