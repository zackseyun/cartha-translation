revisions:
- from: Er hat mich getrieben und mich gehen lassen in Finsternis und nicht im Licht.[a]
  to: Er hat mich getrieben und mich in Finsternis gehen lassen, nicht ins Licht.[a]
  rationale: Die Revision beseitigt die im Deutschen naheliegende Lesart, dass der Sprecher lediglich die Erlaubnis zum Weggehen erhalten habe, indem das Gehen ausdrücklich auf „in Finsternis“ bezogen wird. Zugleich bleibt die kausative Struktur von וַיּוֹלַךְ, die poetische Knappheit und die scharfe Antithese zu „Licht“ erhalten.
