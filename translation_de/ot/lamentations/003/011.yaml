  yaml_path: translation/ot/lamentations/003/011.yaml
  text: He turned my paths aside and tore me apart[a]; he made me desolate.
translation:
  language: de
  text: Meine Wege lenkte er um und riss mich in Stücke[a]; er machte mich zur Einöde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zerfleischte mich“. Das seltene Verb bezeichnet wahrscheinlich gewaltsames Zerreißen; im Zusammenhang kann das Bild eines angreifenden Tieres mitschwingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכַי
  choice: meine Pfade
  rationale: Der Plural mit Suffix der 1. Person Singular wird bewahrt; „Pfade“ erhält zudem das konkrete Wegbild.
- source_word: סוֹרֵר
  choice: hat er abgelenkt
  rationale: Das Verb bezeichnet hier ein Abwenden oder Umlenken. Mit „meine Pfade“ als Objekt gibt „abgelenkt“ die richtungsverändernde Wirkung natürlich wieder, ohne ausdrücklich „krumm gemacht“ festzulegen.
- source_word: וַיְפַשְּׁחֵנִי
  choice: und mich zerfleischt
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein gewaltsames Zerreißen. „Zerfleischt“ trägt die mögliche Raubtiermetaphorik des unmittelbaren Kontexts mit, ohne sie ausdrücklich zu benennen.
- source_word: שָׂמַנִי
  choice: er hat mich …
  rationale: שׂים steht mit einem resultativen Prädikativ. Im Deutschen lässt sich die resultierende Zustandsveränderung idiomatisch durch „hat mich verwüstet“ ausdrücken.
- source_word: שֹׁמֵם
  choice: verwüstet
  rationale: Die Form bezeichnet einen Zustand der Verödung beziehungsweise Verwüstung. „Verwüstet“ bewahrt hier das Motiv völliger Zerstörung und passt als persönlicher Zustand des Sprechers.
theological_decisions:
- issue: Das unausgesprochene Subjekt der drei Verbformen
  choice: Das maskuline Singularpronomen wird mit „er“ wiedergegeben.
  alternative: Das Subjekt ausdrücklich als Gott bezeichnen.
  rationale: Der Kontext identifiziert den Handelnden, doch der hebräische Vers nennt ihn nicht ausdrücklich. „Er“ bewahrt diese Textgestalt und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die vorangestellte Wortgruppe „Meine Pfade“ erhält die hebräische Hervorhebung und das Wegbild; die kräftigen Verben bewahren die Gewaltsamkeit und Trostlosigkeit des Verses.
