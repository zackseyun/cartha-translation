  - severity: low
    issue: „er hat mich verwüstet“ verschiebt die Konstruktion von einem resultativen Zustand zu einer aktiven Verwüstung.
    rationale: שָׂמַנִי שֹׁמֵם bedeutet wörtlich sinngemäß, dass er den Sprecher in einen Zustand der Verödung versetzte. „Er machte mich zur Einöde“ bewahrt diesen resultativen Bildausdruck.
