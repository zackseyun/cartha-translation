lexical_decisions:
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Der hebräische Text verwendet den Singular mit Suffix der 1. Person; die poetische Rede vom Auge als Quelle der Tränen bleibt erhalten.
- source_word: נִגְּרָה
  choice: strömt
  rationale: Das Verb נגר bezeichnet ein Fließen oder Herabströmen. „Strömt“ bewahrt das konkrete Bild, ohne die im Hebräischen unausgesprochenen Tränen ausdrücklich einzufügen.
- source_word: וְלֹא תִדְמֶה
  choice: und kommt nicht zur Ruhe
  rationale: דמה kann hier „still sein“, „ruhen“ oder „aufhören“ bedeuten. Die Formulierung ist im Deutschen natürlich und bewahrt sowohl den Gedanken des Nichtaufhörens als auch den der fehlenden Ruhe.
- source_word: מֵאֵין הֲפֻגוֹת
  choice: ohne Unterlass
  rationale: Die Wendung bezeichnet das völlige Fehlen einer Pause oder Atempause. „Ohne Unterlass“ gibt den fortdauernden Charakter knapp und poetisch wieder.
