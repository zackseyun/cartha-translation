  yaml_path: translation/ot/lamentations/003/035.yaml
  text: to deny a man justice before the face of the Most High—
translation:
  language: de
  text: das Recht eines Menschen vor dem Angesicht des Höchsten zu beugen—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: zu beugen
  rationale: Das Hifil von נטה bezeichnet hier das Abbiegen oder Verdrehen des Rechts. „Das Recht beugen“ ist im Deutschen idiomatisch und bewahrt das Bild des hebräischen Ausdrucks genauer als das stärker ausdeutende „Gerechtigkeit verweigern“.
- source_word: מִשְׁפַּט גָּבֶר
  choice: das Recht eines Menschen
  rationale: מִשְׁפַּט meint in diesem Zusammenhang den einem Menschen zustehenden Rechtsanspruch beziehungsweise ein gerechtes Urteil; גָּבֶר wird allgemein und natürlich mit „Mensch“ wiedergegeben.
- source_word: נֶגֶד פְּנֵי עֶלְיוֹן
  choice: vor dem Angesicht des Höchsten
  rationale: Die Wiedergabe erhält sowohl das räumlich-relationale נֶגֶד als auch die bildhafte Wendung פְּנֵי. עֶלְיוֹן ist als Gottesbezeichnung „der Höchste“.
theological_decisions:
- issue: Bedeutung der Aussage im fortlaufenden Satzgefüge
  choice: Infinitivische Fortsetzung mit Gedankenstrich
  alternative: Als selbstständiger Aussagesatz oder als ausdrückliches Verbot formulieren
  rationale: Vers 35 gehört syntaktisch zur Reihe der Infinitive in Vers 34–36 und wird erst durch Vers 37 in den größeren Aussagezusammenhang eingebunden. Die fragmentarische Form und theologische Spannung werden daher nicht durch ergänzte Wörter aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „das Recht beugen“ ist klar verständlich und zugleich quellennah; „vor dem Angesicht“ bewahrt bewusst den gehobenen biblischen Bildton.
