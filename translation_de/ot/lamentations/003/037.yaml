  text: מִ֣י זֶ֤ה אָמַר֙ וַ/תֶּ֔הִי אֲדֹנָ֖/י לֹ֥א צִוָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
translation:
  language: de
  text: Wer ist es, der spricht, und es geschieht,[a] ohne dass der Herr es befohlen hat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer ist es, der sprach, und es geschah?“ Das Hebräische verwendet Vergangenheitsformen in einer rhetorischen Aussage von allgemeiner Geltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn der Herr es nicht befohlen hat?“ Das mit „befohlen“ übersetzte Verb kann in diesem Zusammenhang auch als „angeordnet“ oder „bestimmt“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist es
  rationale: Die Verbindung aus Fragepronomen und Demonstrativpronomen bildet eine nachdrückliche rhetorische Frage. „Wer ist es“ gibt sie im heutigen Deutsch natürlich wieder.
- source_word: אָמַר
  choice: spricht
  rationale: Die hebräische Form ist formal Vergangenheit („sprach“), steht hier aber in einer rhetorischen Aussage von allgemeiner Geltung. Das deutsche Präsens bringt diesen Sinn klar zum Ausdruck, ohne die Vergangenheitsform in der Fußnote zu verschweigen.
- source_word: וַתֶּהִי
  choice: und es geschieht
  rationale: Das Verb היה bezeichnet hier das Eintreten eines nicht ausdrücklich genannten Geschehens. „Es geschieht“ bewahrt diese Offenheit und ist idiomatischer als „es wird“.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der Gottesname als Herrschaftstitel; „der Herr“ ist die geläufige und sachgerechte deutsche Wiedergabe.
- source_word: לֹא צִוָּה
  choice: ohne dass … es befohlen hat
  rationale: צוה bedeutet grundsätzlich „befehlen/gebieten“. Die mit „ohne dass“ wiedergegebene Umstandsbeziehung lässt die rhetorische Aussage im Deutschen natürlich erkennen, ohne ein stärker systematisch-theologisches Verb in den Haupttext einzutragen.
theological_decisions:
- issue: Göttliche Souveränität im Verb צוה
  choice: befohlen
  alternative: angeordnet / bestimmt
  rationale: Der Vers stellt rhetorisch infrage, dass ein ausgesprochenes Geschehen ohne den Befehl des Herrn eintreten könne. „Befohlen“ bleibt nahe am gewöhnlichen Wortsinn; „angeordnet“ oder „bestimmt“ würden die Aussage stärker als abstraktes Dekret auslegen.
- issue: Logische Beziehung des letzten Satzglieds
  choice: ohne dass der Herr es befohlen hat
  alternative: wenn der Herr es nicht befohlen hat
  rationale: Im Hebräischen fehlt eine ausdrückliche Konjunktion. „Ohne dass“ gibt die naheliegende Umstandsbedingung idiomatisch wieder, während „wenn … nicht“ als formal nähere Möglichkeit inhaltlich denselben rhetorischen Zusammenhang ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die knappe Satzstruktur des Hebräischen bleiben erhalten. Das Präsens verdeutlicht die allgemeine Geltung; die formale Vergangenheitsform und die mögliche konditionale Fassung werden in den Fußnoten dokumentiert.
