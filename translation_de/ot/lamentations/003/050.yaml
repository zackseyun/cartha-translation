  text: until Yahweh looks down and sees from heaven[a].
translation:
  language: de
  text: bis Jahwe vom Himmel herabschaut und sieht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „herabschaut und sieht“; die beiden Verben unterstreichen, dass Jahwe vom Himmel her aufmerksam hinsieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: bis
  rationale: Die Konjunktion bezeichnet den zeitlichen Endpunkt des im vorigen Vers geschilderten Zustands; „bis“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: יַשְׁקִיף
  choice: herabschaut
  rationale: Das Hifil von שׁקף bezeichnet häufig den Blick von einem erhöhten Ort hinab. Zusammen mit „vom Himmel“ bewahrt „herabschaut“ die räumliche Bildsprache.
- source_word: וְיֵרֶא
  choice: und sieht
  rationale: Das Qal von ראה bedeutet gewöhnlich „sehen“. Die eigenständige Wiedergabe erhält beide hebräischen Verben und ihre poetische Verstärkung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: מִשָּׁמָיִם
  choice: vom Himmel
  rationale: Obwohl שָׁמַיִם formal pluralisch ist, bezeichnet es hier idiomatisch den Himmel als Ort, von dem Jahwe herabschaut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt den Eigennamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Knappe, poetische und würdige Standardsprache. Der Satzanschluss mit „bis“ bleibt bewusst erhalten, da der Vers den Gedanken des vorherigen Verses fortsetzt.
