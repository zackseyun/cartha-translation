  text: הִשְׂבִּיעַ֥/נִי בַ/מְּרוֹרִ֖ים הִרְוַ֥/נִי לַעֲנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
translation:
  language: de
  text: Er hat mich mit Bitterkeit gesättigt; er hat mich mit Wermut getränkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: hat mich … gesättigt
  rationale: Der Hifil von שׂבע bedeutet »sättigen« oder »bis zur Fülle geben«. »Gesättigt« bewahrt das Bild einer aufgezwungenen Überfülle und wirkt durch das Objekt »Bitterkeit« eindeutig negativ.
- source_word: בַמְּרוֹרִים
  choice: mit Bitterkeit
  rationale: Der Plural von מָרוֹר bezeichnet Bitteres beziehungsweise Bitterkeit. Die abstrakte Wiedergabe ist im Deutschen natürlich und lässt den Bezug auf bitteres Leiden offen, ohne unbegründet bestimmte Bitterkräuter anzunehmen.
- source_word: הִרְוַנִי
  choice: hat mich … getränkt
  rationale: Der Hifil von רוה kann »zu trinken geben«, »tränken« oder »durchtränken« bedeuten. »Getränkt« erhält das konkrete Trinkbild, den poetischen Parallelismus und die mögliche Nuance reichlicher Zufuhr.
- source_word: לַעֲנָה
  choice: mit Wermut
  rationale: לַעֲנָה bezeichnet Wermut, eine für ihre Bitterkeit bekannte Pflanze. »Wermut« bewahrt das hebräische Bild und seine biblischen Anklänge, statt es zu »Bitterkeit« oder »Galle« zu verallgemeinern.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die parallelen Verben »gesättigt« und »getränkt« bilden die erzwungene Fülle des Hebräischen ab; das wiederholte »mit« macht den Parallelismus im Deutschen hörbar.
