lexical_decisions:
- source_word: הֵבִיא
  choice: ließ … dringen
  rationale: Der Hifil von בוא bezeichnet hier ein verursachtes Eindringen. Die Formulierung gibt die gewaltsame Bewegung der Pfeile natürlich wieder, ohne ein zusätzliches Verb wie „schießen“ in den Text einzutragen.
- source_word: בְּכִלְיוֹתָי
  choice: in meine Nieren
  rationale: כִּלְיָה bedeutet wörtlich „Niere“ und kann übertragen das Innerste bezeichnen. Im Bild eindringender Pfeile steht die konkrete körperliche Bedeutung im Vordergrund.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die wörtliche Wiedergabe bewahrt das markante hebräische Bild. Eine Fußnote erläutert, dass damit die Pfeile gemeint sind.
- source_word: אַשְׁפָּתוֹ
  choice: seines Köchers
  rationale: אַשְׁפָּה bezeichnet einen Köcher; „Köcher“ ist die übliche und natürliche deutsche Entsprechung.
