  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: de
  text: 'Da sagte ich: »Meine Ausdauer ist dahin[a] und meine Hoffnung von Jahwe her.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Glanz ist dahin“, wenn נִצְחִי hier im Sinn von Glanz oder Hoheit statt von Ausdauer verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen knapp: „meine Hoffnung von Jahwe“. Gemeint sein kann die Hoffnung, die von Jahwe kommt, oder die Hoffnung, die auf Jahwe gerichtet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Die mit ו eingeleitete Verbform führt die Schlussfolgerung des Sprechers im Fortgang der Klage ein. „Da sagte ich“ ist natürliches Deutsch und bewahrt die zeitlich-folgernde Bewegung.
- source_word: אָבַד
  choice: ist dahin
  rationale: אבד bezeichnet das Verlorengehen oder Schwinden. Die idiomatische Wendung „ist dahin“ gibt den starken Eindruck eines vollständigen Verlusts wieder und passt zum Klagecharakter.
- source_word: נִצְחִי
  choice: meine Ausdauer
  rationale: נֵצַח kann Dauerhaftigkeit beziehungsweise Durchhaltevermögen, in anderen Zusammenhängen aber auch Glanz oder Hoheit bezeichnen. Im Zusammenhang mit dem Zusammenbruch des Sprechers und dem Verlust seiner Hoffnung ist „Ausdauer“ die naheliegende Lesart; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: וְתוֹחַלְתִּי
  choice: und ebenso meine Hoffnung
  rationale: תּוֹחֶלֶת bedeutet Hoffnung oder Erwartung. „Hoffnung“ ist im Kontext der Klage die natürliche deutsche Entsprechung; „ebenso“ macht die im Hebräischen knappe, elliptische Zuordnung zum Verb verständlich.
- source_word: מֵיְהוָה
  choice: von Jahwe her
  rationale: מִן bedeutet zunächst „von“ und kann hier die Quelle der Hoffnung bezeichnen. „Von Jahwe her“ bewahrt diese Formulierung, ohne die mögliche Beziehung als auf Jahwe gerichtete Hoffnung stillschweigend auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text verwendete Eigenname erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נִצְחִי im Kontext
  choice: meine Ausdauer
  alternative: mein Glanz; meine Kraft
  rationale: Der Zusammenhang legt den Verlust des Durchhaltevermögens nahe, doch der mögliche Sinn „Glanz“ lässt sich lexikalisch nicht völlig ausschließen und wird deshalb in einer Fußnote genannt.
- issue: Beziehung der Hoffnung zu Jahwe in מֵיְהוָה
  choice: meine Hoffnung von Jahwe her
  alternative: meine Hoffnung auf Jahwe
  rationale: Die hebräische Präposition bezeichnet am unmittelbarsten die Herkunft, während die knappe Formulierung auch als auf Jahwe gerichtete Hoffnung verstanden werden kann. Die Übersetzung wahrt diese Spannung, statt sie auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ist dahin“ hält den Ton der Klage eindringlich, ohne altertümlich zu wirken. Die elliptische hebräische Form wird durch „ebenso“ lesbar gemacht; „von Jahwe her“ bewahrt bewusst die Mehrdeutigkeit der Präposition.
