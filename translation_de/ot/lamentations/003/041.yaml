  text: נִשָּׂ֤א לְבָבֵ֨/נוּ֙ אֶל כַּפָּ֔יִם אֶל אֵ֖ל בַּ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: de
  text: Lasst uns unser Herz zusammen mit unseren Händen zu Gott im Himmel erheben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  choice: Lasst uns … erheben
  rationale: Der Kohortativ drückt eine gemeinsame Aufforderung aus; „erheben“ bewahrt zugleich die körperliche und geistliche Bildsprache.
- source_word: לְבָבֵנוּ
  choice: unser Herz
  rationale: Die hebräische Form steht im Singular mit einem Suffix der 1. Person Plural und bezeichnet das gemeinsame innere Wesen der Sprechenden.
- source_word: אֶל־כַּפָּיִם
  choice: mit unseren Händen
  rationale: Wörtlich steht „zu den Handflächen/Händen“. Im Zusammenhang bezeichnet die Wendung die Hände als begleitende äußere Gebärde beim Erheben des Herzens; „mit“ ist im Deutschen verständlich, ohne Herz und Hände lediglich als zwei gleichgeordnete Objekte wiederzugeben.
- source_word: אֶל־אֵל בַּשָּׁמָיִם
  choice: zu Gott im Himmel
  rationale: Gibt Ziel und Ortsangabe knapp und natürlich wieder; der hebräische Plural „Himmel“ wird entsprechend deutschem Sprachgebrauch singularisch formuliert.
theological_decisions:
- issue: Verhältnis von innerer Umkehr und äußerer Gebärde
  choice: „unser Herz mit unseren Händen“
  alternative: „unser Herz und unsere Hände“
  rationale: 'Die Übersetzung bewahrt die ungewöhnliche Verknüpfung des hebräischen Textes: Die Hände begleiten das zu Gott erhobene Herz. Sie macht daraus weder zwei voneinander unabhängige Handlungen noch löst sie die poetische Spannung auf.'
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch unmittelbar verständlich. Der kollektive Singular „unser Herz“ wurde bewusst erhalten.
