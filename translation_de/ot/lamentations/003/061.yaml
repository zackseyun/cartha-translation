base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: de
  text: Du hast ihr Schmähen gehört, Jahwe, und all ihre Anschläge gegen mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all ihre Gedanken über mich“. Das hebräische Wort kann Gedanken, Absichten oder Pläne bezeichnen; im Zusammenhang sind wahrscheinlich feindselige Anschläge gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: Du hast … gehört
  rationale: Das Qal Perfekt 2. Person maskulin Singular richtet sich an Jahwe. Das deutsche Perfekt gibt die abgeschlossene Wahrnehmung mit ihrer fortdauernden Bedeutung im Gebetszusammenhang natürlich wieder.
- source_word: חֶרְפָּתָם
  choice: ihr Schmähen
  rationale: חֶרְפָּה bezeichnet Schmähung, Hohn oder entehrende Beschimpfung. „Ihr Schmähen“ bewahrt sowohl den verbalen Angriff als auch dessen entehrenden Charakter und klingt im Deutschen natürlicher als „ihre Schmähung“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: כָּל
  choice: all
  rationale: כָּל umfasst hier die Gesamtheit der nachfolgenden feindseligen Gedanken beziehungsweise Pläne.
- source_word: מַחְשְׁבֹתָם
  choice: ihre Anschläge
  rationale: Das Substantiv kann Gedanken, Absichten oder Pläne bezeichnen. Im feindseligen Kontext gibt „Anschläge“ die gegen den Sprecher gerichtete Planung treffend wieder, ohne die allgemeinere Bedeutung in der Fußnote zu verschweigen.
- source_word: עָלָי
  choice: gegen mich
  rationale: In Verbindung mit feindseligem Planen hat עַל hier am wahrscheinlichsten adversative Bedeutung. „Gegen mich“ ist deshalb die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Charakter der מַחְשְׁבוֹת
  choice: feindselige Anschläge
  alternative: neutrale Gedanken über den Sprecher
  rationale: Der Zusammenhang von Schmähung und עָלַי legt feindselige Pläne nahe. Da das hebräische Wort jedoch auch neutral „Gedanken“ heißen kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; „ihr Schmähen“ vermeidet eine unnötige Festlegung auf eine einzelne Form des Spotts.
