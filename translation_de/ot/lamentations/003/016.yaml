  yaml_path: translation/ot/lamentations/003/016.yaml
  text: He has ground my teeth with gravel[b][a]; he has pressed me down into the ashes.
translation:
  language: de
  text: Er zermalmte meine Zähne mit Kies[a]; er drückte mich in die Asche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er zerbrach meine Zähne mit Kieselsteinen.«'
    reason: lexical_alternative
  - marker: b
    text: Das mit »drückte mich in die Asche« wiedergegebene Verb ist selten und kann auch im Sinn von »ließ mich in der Asche kauern«, »demütigte mich« oder ähnlich als »brachte mich in der Asche zu Boden« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: zermalmte
  rationale: Das Verb bezeichnet ein Zermalmen, Zerquetschen oder Zerbrechen. »Zermalmte« bewahrt die drastische Körperlichkeit des hebräischen Bildes und verbindet sich verständlich mit »meine Zähne«.
- source_word: בֶּחָצָץ
  choice: mit Kies
  rationale: חָצָץ bezeichnet kleine Steine beziehungsweise Kies. »Kies« gibt das raue Material knapp und idiomatisch wieder; »Kieselsteine« ist als mögliche Konkretisierung in der Fußnote genannt.
- source_word: שִׁנָּי
  choice: meine Zähne
  rationale: Die hebräische Form ist ein Plural mit Suffix der ersten Person Singular und wird direkt wiedergegeben.
- source_word: הִכְפִּישַׁנִי
  choice: drückte mich nieder
  rationale: Das seltene und in seiner genauen Bedeutung unsichere Verb beschreibt hier wahrscheinlich ein gewaltsames Erniedrigen oder Niederdrücken. Die Formulierung erhält sowohl die körperliche als auch die demütigende Dimension, ohne die lexikalische Unsicherheit zu verdecken.
- source_word: בָּאֵפֶר
  choice: in die Asche
  rationale: אֵפֶר bedeutet »Asche«. Der Akkusativ nach »in« bringt zusammen mit »niederdrücken« die Bewegung in die Asche zum Ausdruck.
theological_decisions: []
