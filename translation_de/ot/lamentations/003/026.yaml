  yaml_path: translation/ot/lamentations/003/026.yaml
  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: de
  text: Gut ist es, still auf die Rettung Jahwes[a] zu warten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gut ist es, auf Jahwes Rettung zu hoffen und zu schweigen.“ Das hebräische Verb kann hoffnungsvolles Warten bezeichnen; „still“ kann auch mit „schweigend“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Gut ist es
  rationale: Das prädikativ gebrauchte Adjektiv eröffnet den nominalen Satz betont. „Gut ist es“ klingt im Deutschen würdig und bewahrt diese Hervorhebung.
- source_word: יָחִיל
  choice: zu warten
  rationale: Das Verb יחל bezeichnet ein hoffnungsvolles, erwartungsvolles Warten. Im Zusammenhang mit Jahwes Rettung gibt „warten“ die Grundhaltung knapp wieder; die mögliche Nuance „hoffen“ wird in der Fußnote erhalten.
- source_word: וְדוּמָם
  choice: still
  rationale: דוּמָם bezeichnet Schweigen oder regungsvolle Stille. „Still“ verbindet sich natürlich mit „warten“ und wahrt die knappe Form des Hebräischen; „schweigend“ ist ebenfalls möglich.
- source_word: לִתְשׁוּעַת
  choice: auf die Rettung
  rationale: תְּשׁוּעָה kann Rettung, Befreiung oder Hilfe bezeichnen. „Rettung“ wahrt sowohl den konkreten als auch den umfassenderen theologischen Sinn; die Präposition ל wird bei „warten“ idiomatisch mit „auf“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Der Genitiv entspricht der hebräischen Verbindung „Rettung Jahwes“ und bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutungsumfang von יחל
  choice: warten
  alternative: hoffen
  rationale: Das Verb verbindet Warten und Hoffnung. Der Haupttext entscheidet sich kontextgerecht für „warten“, ohne die hoffnungsvolle Dimension zu leugnen; die echte lexikalische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-knapper Satzform. Die Voranstellung „Gut ist es“ spiegelt die hebräische Betonung, ohne unnatürlich altertümlich zu wirken.
