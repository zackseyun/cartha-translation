  text: מִ/פִּ֤י עֶלְיוֹן֙ לֹ֣א תֵצֵ֔א הָ/רָע֖וֹת וְ/הַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
translation:
  language: de
  text: Gehen nicht aus dem Mund des Höchsten Unglück[a] und Gutes hervor?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Böses“ oder „Unheil“; das hebräische Wort kann allgemein Schädliches oder Widriges bezeichnen und muss hier nicht moralisch Böses meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּי
  choice: aus dem Mund
  rationale: Bewahrt das hebräische Bild vom Mund als Ursprung eines Ausspruchs oder Befehls; zusammen mit „hervorgehen“ ist die Formulierung auch im Deutschen verständlich.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: Geläufige und würdevolle Wiedergabe des göttlichen Titels; der bestimmte Artikel ist in der substantivierten deutschen Form enthalten.
- source_word: לֹא תֵצֵא
  choice: Gehen nicht … hervor?
  rationale: Die Verneinung wird im Zusammenhang als rhetorische Frage wiedergegeben. „Hervorgehen“ entspricht der Grundbedeutung des Verbs und passt zum Bild des Mundes als Quelle.
- source_word: הָרָעוֹת
  choice: Unglück
  rationale: Bezeichnet hier nach dem Kontext widrige, leidvolle Geschehnisse. „Unglück“ vermeidet eine unnötige Festlegung auf moralisch Böses, während eine Fußnote die weitere Bedeutungsbreite offenhält.
- source_word: וְהַטּוֹב
  choice: und Gutes
  rationale: Das substantivisch gebrauchte Adjektiv wird breit und ohne Einschränkung auf materielles Wohlergehen wiedergegeben.
theological_decisions:
- issue: Ob הָרָעוֹת moralisch Böses oder widerfahrendes Unheil bezeichnet
  choice: „Unglück“ im Haupttext, mit „Böses“ und „Unheil“ als Fußnotenalternativen
  alternative: „Böses“ oder „Unheil“ im Haupttext
  rationale: Im Klagekontext liegt widriges Geschehen nahe. Zugleich wird die echte Bedeutungsbreite des hebräischen Ausdrucks nicht verschwiegen, sondern in der Fußnote kenntlich gemacht.
- issue: Ob der Satz als Aussage mit Verneinung oder als rhetorische Frage zu verstehen ist
  choice: 'Rhetorische Frage: „Gehen nicht … hervor?“'
  alternative: 'Aussage: „Aus dem Mund des Höchsten gehen Unglück und Gutes nicht hervor.“'
  rationale: Der unmittelbare Zusammenhang in Klagelieder 3,37–39 stützt eine rhetorische Frage, die bekräftigt, dass sowohl Widriges als auch Gutes der Herrschaft des Höchsten unterstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache „aus dem Mund … hervorgehen“ bleibt bewusst erhalten; die rhetorische Form klingt natürlich und bewahrt die Spannung des Ausgangstextes.
