source:
  edition: WLC
  text: ט֤וֹב יְהוָה֙ לְ/קוָֹ֔/ו לְ/נֶ֖פֶשׁ תִּדְרְשֶֽׁ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: de
  text: Yahweh ist gut zu denen, die auf ihn warten[a], zu der Seele, die ihn sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf ihn hoffen“; das hebräische Verb bezeichnet ein Warten voller Erwartung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: gut
  rationale: Die direkte und im Deutschen natürliche Entsprechung bewahrt die breite Aussage über Yahwehs Wesen und sein Handeln, ohne sie auf bloße Freundlichkeit zu verengen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְקֹוָו
  choice: zu dem, der auf ihn wartet
  rationale: Das Verb קוה bezeichnet ein erwartungsvolles Warten und kann auch mit Hoffen wiedergegeben werden. Die singularische Form und der Bezug auf die folgende נֶפֶשׁ werden im Deutschen bewahrt.
- source_word: לְנֶפֶשׁ
  choice: zu dem Menschen
  rationale: נֶפֶשׁ bezeichnet hier die ganze Person. „Mensch“ gibt den Sinn in modernem Deutsch natürlich wieder, ohne eine besondere anthropologische Lehre in das Wort „Seele“ hineinzulesen.
- source_word: תִּדְרְשֶׁנּוּ
  choice: der ihn sucht
  rationale: דרש bezeichnet bei Gott als Objekt ein ernsthaftes, auf Beziehung gerichtetes Suchen. Die Form stimmt grammatisch mit dem femininen נֶפֶשׁ überein; im Deutschen richtet sich das Relativpronomen nach „Mensch“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Yahweh“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Bedeutungsnuance von קוה
  choice: auf ihn wartet
  alternative: auf ihn hofft
  rationale: קוה verbindet geduldiges Warten mit erwartungsvoller Hoffnung. Im Zusammenhang der Klagelieder tritt das Ausharren hervor; die ebenfalls echte Hoffnungsnuance wird in der Fußnote genannt.
- issue: Wiedergabe von נֶפֶשׁ
  choice: Mensch
  alternative: Seele
  rationale: Hier steht נֶפֶשׁ für die suchende Person als Ganze. „Mensch“ vermeidet eine unbeabsichtigte Verengung auf einen vom Körper getrennten inneren Teil.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. Der Singular des hebräischen Textes bleibt erhalten; „Mensch“ gibt נֶפֶשׁ idiomatisch und ohne unnötige anthropologische Festlegung wieder.
