  source_fidelity: 'Die erste Klausel gibt die jussivisch-auffordernde Folge und das Bild von Wange und Schläger treffend wieder. In der zweiten Klausel ist „er lasse sich … sättigen“ jedoch nicht quellentreu genug: Es kann bedeuten, dass er zulässt, von jemandem gesättigt zu werden, während יִשְׂבַּע ein intransitives „satt/erfüllt werden“ ausdrückt.'
  naturalness: „Die Wange hinhalten“ ist im modernen Standarddeutsch idiomatisch und in diesem Kontext angemessen. „von Schmach satt werden“ ist verständlich, bewahrt das Bild des Sattwerdens und vermeidet die unpassende permissive Konstruktion „sich sättigen lassen“.
  terminology: „Schmach“ gibt חֶרְפָּה als öffentliche Demütigung bzw. Verachtung prägnant und würdevoll wieder. „Wange“ ist für לֶחִי im Kontext passend.
