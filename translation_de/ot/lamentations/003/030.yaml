  text: יִתֵּ֧ן לְ/מַכֵּ֛/הוּ לֶ֖חִי יִשְׂבַּ֥ע בְּ/חֶרְפָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: de
  text: Er halte dem, der ihn schlägt, die Wange hin; er werde von Schmach satt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתֵּן
  choice: er halte … hin
  rationale: Das Qal-Imperfekt steht im mahnenden Zusammenhang jussivisch. Die deutsche Wendung „die Wange hinhalten“ gibt נתן mit לֶחִי natürlich wieder.
- source_word: לְמַכֵּהוּ
  choice: dem, der ihn schlägt
  rationale: ל mit dem Hifil-Partizip von נכה und dem Suffix der 3. Person Singular bezeichnet denjenigen, der ihn schlägt; die partizipiale Aussage bleibt erhalten.
- source_word: לֶחִי
  choice: die Wange
  rationale: לֶחִי bezeichnet Wange oder Kiefer. „Wange“ passt hier zur Handlung des Erduldens körperlicher Gewalt und öffentlicher Demütigung.
- source_word: יִשְׂבַּע
  choice: er lasse sich … sättigen
  rationale: שׂבע bedeutet wörtlich „satt werden, gesättigt sein“. Die reflexive Formulierung bewahrt hier die bildhafte Sprache und den mahnend-jussivischen Charakter.
- source_word: בְּחֶרְפָּה
  choice: mit Schmach
  rationale: חֶרְפָּה umfasst Schmach, Beschimpfung und öffentliche Entehrung. „Schmach“ ist würdig, verständlich und erhält die sozial-moralische Dimension.
theological_decisions: []
