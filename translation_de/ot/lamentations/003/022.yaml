id: LAM.3.22
reference: Lamentations 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/022.yaml
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
translation:
  language: de
  text: Wegen Jahwes treuer Liebe sind wir nicht zugrunde gegangen[a], denn sein Erbarmen nimmt kein Ende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige hebräische Handschriften und die alten Übersetzungen stützen die andere Lesart: »Jahwes treue Liebe hört niemals auf.« Dabei ist die treue Liebe das Subjekt, und das erste Verb wird anders gelesen.'
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: Jahwes treue Liebe
  rationale: Der Plural kann die wiederholten Erweise von Jahwes verlässlicher, bundestreuer Liebe bezeichnen. Die abstrakte Einzahl ist im Deutschen natürlich und bewahrt den Bedeutungsgehalt.
- source_word: כִּי לֹא תָמְנוּ
  choice: Wegen … sind wir nicht zugrunde gegangen
  rationale: In der Vokalisierung des WLC ist תָמְנוּ die 1. Person Plural. Die Übersetzung folgt dieser masoretischen Lesart und gibt כִּי kausal wieder.
- source_word: כִּי לֹא כָלוּ
  choice: denn … nimmt kein Ende
  rationale: Das zweite כִּי begründet die erste Aussage; die verneinte Verbform besagt, dass Jahwes Erbarmen nicht erschöpft ist oder endet.
- source_word: רַחֲמָיו
  choice: sein Erbarmen
  rationale: Die hebräische Mehrzahl kann die Fülle und Wiederholung göttlichen Mitgefühls ausdrücken. Das kollektive deutsche Singularwort ist natürlicher als „Erbarmungen“.
theological_decisions:
- issue: Subjekt und Syntax des ersten Satzteils
  choice: Wegen Jahwes treuer Liebe sind wir nicht zugrunde gegangen.
  alternative: Jahwes treue Liebe hört niemals auf.
  rationale: Die punktierte masoretische Form תָמְנוּ ist 1. Person Plural und bestimmt daher den Haupttext. Die durch einige hebräische Handschriften und alte Übersetzungen bezeugte Lesart macht dagegen Jahwes treue Liebe zum Subjekt; diese bedeutsame Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zugrunde gegangen“ gibt die erste Person Plural verständlich wieder, während „sein Erbarmen nimmt kein Ende“ die poetische Parallelität natürlich bewahrt.
