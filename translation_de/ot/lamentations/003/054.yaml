base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/054.yaml
  text: Waters closed over my head[a]; I said[b], “I am cut off.”
translation:
  language: de
  text: 'Das Wasser schlug über meinem Kopf zusammen[a]; ich sagte: »Ich bin abgeschnitten.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Wasser stieg über meinen Kopf« oder »Das Wasser strömte über meinen Kopf hinweg.«'
    reason: lexical_alternative
  - marker: b
    text: 'Das kann auch bedeuten: »Ich bin verloren« oder »Ich bin vernichtet.« Wörtlich steht im Hebräischen: »Ich bin abgeschnitten.« Damit bleibt das Bild erhalten, vom Leben oder von jeder Hoffnung abgeschnitten zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוּ
  choice: schlug … zusammen
  rationale: Das Verb bezeichnet hier Wasser, das über dem Sprecher aufsteigt beziehungsweise ihn bedeckt. Die deutsche Wendung »über jemandem zusammenschlagen« gibt das Bild des völligen Versinkens natürlich und eindringlich wieder, ohne die Bildsprache aufzulösen.
- source_word: מַיִם
  choice: das Wasser
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, wird Wasser im modernen Deutschen in diesem Zusammenhang idiomatisch als singularisches Stoffwort gebraucht.
- source_word: עַל רֹאשִׁי
  choice: über meinem Kopf
  rationale: Die konkrete Körpermetapher und die Vorstellung des Ertrinkens beziehungsweise völligen Überwältigtseins bleiben direkt erhalten.
- source_word: אָמַרְתִּי
  choice: ich sagte
  rationale: Die Wiedergabe folgt der Grundbedeutung von אמר und lässt offen, ob die Aussage hörbar ausgesprochen oder als inneres Selbstgespräch formuliert wurde.
- source_word: נִגְזָרְתִּי
  choice: Ich bin abgeschnitten
  rationale: Die Form bezeichnet ein Abgeschnitten- oder Ausgeschlossenwerden. Die wörtliche Bildsprache bleibt erhalten und wird nicht vorschnell als »verloren« oder »vernichtet« gedeutet.
theological_decisions:
- issue: Reichweite von נִגְזָרְתִּי
  choice: Ich bin abgeschnitten
  alternative: Ich bin verloren / vernichtet
  rationale: Der hebräische Text benennt nicht ausdrücklich, wovon der Sprecher abgeschnitten ist. Die Übersetzung bewahrt diese Offenheit sowie die mögliche Beziehung zu Leben, Hoffnung oder Rettung.
translation_notes:
  register: Moderne, würdige poetische Prosa. »Schlug über meinem Kopf zusammen« ist im Deutschen ein natürliches und anschauliches Bild für das Versinken; »abgeschnitten« bewahrt bewusst die knappe, harte und nicht vollständig aufgelöste Metapher des Hebräischen.
