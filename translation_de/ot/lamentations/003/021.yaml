  text: This I call to mind[a]; therefore I have hope.
translation:
  language: de
  text: Dies rufe ich mir ins Gedächtnis[a]; darum habe ich Hoffnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: „Dies rufe ich wieder in mein Herz zurück; darum hoffe ich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Dies
  rationale: Das feminine Demonstrativpronomen verweist offen auf den Inhalt, den der Sprecher sich vergegenwärtigt; „Dies“ bewahrt diese Offenheit.
- source_word: אָשִׁיב
  choice: rufe ich … ins Gedächtnis
  rationale: Der Hifil von שוב bedeutet wörtlich „zurückbringen/zurückkehren lassen“. Zusammen mit אֶל־לִבִּי bezeichnet er idiomatisch das bewusste Erinnern.
- source_word: אֶל לִבִּי
  choice: mir ins Gedächtnis
  rationale: Das hebräische „zu meinem Herzen“ umfasst Denken, Erinnern und innere Besinnung. Die deutsche Wendung gibt hier den kognitiven Sinn natürlich wieder.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die Wendung kennzeichnet die Folgerung aus dem zuvor ins Gedächtnis Gerufenen; „darum“ ist präzise und idiomatisch.
- source_word: אוֹחִיל
  choice: habe ich Hoffnung
  rationale: Der Hifil von יחל kann hoffendes, erwartungsvolles Warten bezeichnen. „Habe ich Hoffnung“ drückt im Klagekontext eine neu gewonnene Zuversicht aus, ohne den Gegenstand der Hoffnung vorwegzunehmen.
theological_decisions:
- issue: Anthropologische Redeweise לֵב („Herz“)
  choice: Die Wendung wird idiomatisch mit „mir ins Gedächtnis rufen“ wiedergegeben.
  alternative: „Dies bringe ich zu meinem Herzen zurück; darum hoffe ich.“
  rationale: Im Hebräischen ist das Herz auch Ort des Denkens, Erinnerns und Entschlusses. Die idiomatische Wiedergabe vermeidet das moderne Missverständnis, es gehe ausschließlich um Gefühle, ohne die innere Dimension zu leugnen.
- issue: Bedeutung von יחל zwischen Hoffen und erwartungsvollem Warten
  choice: „habe ich Hoffnung“
  alternative: „warte ich voller Hoffnung“
  rationale: Der unmittelbare Zusammenhang betont das Wiederaufleben der Hoffnung. Die Übersetzung bewahrt diesen Sinn, während die mögliche Nuance des Wartens in der lexikalischen Begründung festgehalten wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Das Semikolon erhält die enge Folgerungsbeziehung der beiden Teilsätze.
