base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/004.yaml
  text: He has worn away my flesh and my skin[a]; he has broken my bones.
translation:
  language: de
  text: Er hat mein Fleisch und meine Haut aufgerieben; er hat meine Knochen zerbrochen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּלָּה
  choice: ließ … verfallen
  rationale: Das Piel von בלה bezeichnet hier, dass etwas verschleißt beziehungsweise dahinschwindet. „Ließ … verfallen“ gibt den körperlichen Verfall natürlich wieder, ohne das Verb als vollständiges Vernichten zu überzeichnen.
- source_word: בְשָׂרִי
  choice: mein Fleisch
  rationale: „Fleisch“ entspricht בשר unmittelbar und bewahrt die eindringliche körperliche Bildsprache.
- source_word: וְעוֹרִי
  choice: und meine Haut
  rationale: „Haut“ ist die direkte, im Deutschen natürliche Entsprechung und erhält die Verbindung mit „Fleisch“.
- source_word: שִׁבַּר
  choice: zerbrach
  rationale: „Zerbrach“ gibt שבר präzise wieder und passt idiomatisch zum Objekt „Knochen“, ohne die Aussage übermäßig zu verstärken.
- source_word: עַצְמוֹתָי
  choice: meine Knochen
  rationale: Die direkte Wiedergabe erhält die konkrete körperliche Metaphorik und die poetische Intensität.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die drastische körperliche Bildsprache des Hebräischen bleiben erhalten; das wiederholte Possessivpronomen wird entsprechend dem Ausgangstext bewahrt.
