  source_fidelity: 'Der Haupttext gibt die hebräische Syntax und Semantik zuverlässig wieder: תָּשִׁיב לָהֶם גְּמוּל wird idiomatisch mit „Du wirst ihnen vergelten“ erfasst, der Dativ „ihnen“ entspricht לָהֶם, und „nach dem Werk ihrer Hände“ gibt כְּמַעֲשֵׂה יְדֵיהֶם samt konkreter Metonymie angemessen wieder. Die mögliche volitive Nuance des Yiqtol wird nicht im Haupttext erzwungen, sondern sachgerecht in der Anmerkung erhalten.'
