  text: תָּשִׁ֨יב לָ/הֶ֥ם גְּמ֛וּל יְהוָ֖ה כְּ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
translation:
  language: de
  text: Du wirst ihnen vergelten[a], Jahwe, nach dem Werk ihrer Hände.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vergilt ihnen, Jahwe.“ Die hebräische Verbform kann hier sowohl als zuversichtliche Zukunftsaussage als auch als Bitte verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Das Werk ihrer Hände“ ist eine hebräische Wendung für das, was sie getan haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב
  choice: Du wirst … vergelten
  rationale: Der Hifil von שׁוב bedeutet hier zusammen mit גְּמוּל, etwas als entsprechende Folge zurückzugeben. „Vergelten“ gibt diesen Sinn im Deutschen prägnant wieder. Das Yiqtol kann sowohl zukünftig als auch gebetsartig-volitiv gehört werden; der Haupttext wahrt die zuversichtliche Zukunftsaussage, die Fußnote nennt die mögliche Bitte.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition לְ kennzeichnet die Empfänger der Vergeltung. Der deutsche Dativ „ihnen“ entspricht dieser Funktion unmittelbar.
- source_word: גְּמוּל
  choice: vergelten
  rationale: Das Substantiv bezeichnet Gegenleistung, Vergeltung oder das, was jemandem für sein Tun widerfährt. Im natürlichen Deutschen wird sein Gehalt zusammen mit תָּשִׁיב durch das Verb „vergelten“ ausgedrückt, statt wörtlich und schwerfällig „eine Vergeltung zurückgeben“ zu formulieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift, statt den Namen durch den Titel „der HERR“ zu ersetzen.
- source_word: כְּמַעֲשֵׂה
  choice: nach dem Werk
  rationale: 'כְּ bezeichnet hier Entsprechung beziehungsweise Maßstab: Die Vergeltung entspricht ihrem Tun. מַעֲשֶׂה steht im Singular und kann kollektiv das gesamte Handeln bezeichnen; „Werk“ erhält diese Form und Aussage.'
- source_word: יְדֵיהֶם
  choice: ihrer Hände
  rationale: Die Hände stehen als anschauliche Metonymie für das, was die Betreffenden getan haben. Die konkrete hebräische Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Modalität von תָּשִׁיב im Gebetszusammenhang
  choice: Du wirst ihnen vergelten
  alternative: Vergilt ihnen / Mögest du ihnen vergelten
  rationale: Das hebräische Yiqtol lässt sich als Ausdruck zuversichtlicher Erwartung oder als gebetsartiger Wunsch verstehen. Der Haupttext formuliert die Zukunftsaussage; die Fußnote bewahrt die mögliche volitive Lesart, sodass die Spannung nicht vorschnell aufgelöst wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und das konkrete Bild von den Händen folgen dem Hebräischen, ohne unnatürlich zu wirken. Die Anrede „Jahwe“ bleibt unmarkiert; das im Englischen mögliche „O“ wird nicht übernommen, da es im heutigen Deutschen altertümlich klänge.
