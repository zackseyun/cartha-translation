base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/063.yaml
  text: Look at their sitting down and their rising up[a]; I am their song.
translation:
  language: de
  text: 'Sieh dir an, wie sie dasitzen und aufstehen: Ich bin ihr Lied.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Spottlied« bzw. »das Lied, mit dem sie mich verspotten«. Das hebräische Wort kann »Lied« oder »Musik« bedeuten; in diesem Zusammenhang ist wahrscheinlich gemeint, dass sie spöttisch über den Sprecher singen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְתָּם
  choice: wie sie dasitzen
  rationale: Gibt das substantivierte »ihr Sitzen« in natürlichem Deutsch wieder und bewahrt zusammen mit »aufstehen« das konkrete hebräische Begriffspaar, das ihre gesamte Tätigkeit umschreibt.
- source_word: וְקִימָתָם
  choice: und aufstehen
  rationale: Bewahrt als Gegenstück zu »dasitzen« die meristische Verbindung von Sitzen und Aufstehen, ohne sie vorschnell als allgemeines Verhalten auszudeuten.
- source_word: הַבִּיטָה
  choice: Sieh dir an
  rationale: Gibt den an Gott gerichteten Imperativ direkt, gegenwärtig und idiomatisch wieder.
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt die Betonung des Sprechers.
- source_word: מַנְגִּינָתָם
  choice: ihr Lied
  rationale: Bewahrt die Grundbedeutung »Lied/Musik« und die knappe, zugespitzte Aussage des Hebräischen; die im Klagekontext naheliegende Bedeutung eines Spottliedes wird in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Art des Liedes
  choice: Die Mehrdeutigkeit bleibt im Haupttext mit »ihr Lied« bestehen.
  alternative: »ihr Spottlied« oder »das Thema ihres Spottliedes«
  rationale: Der Zusammenhang legt spöttisches Singen über den Sprecher nahe, doch מַנְגִּינָה bezeichnet zunächst Lied oder Musik. Eine ausdrücklich spöttische Bedeutung oder die Umschreibung als Gegenstand des Liedes wäre stärker interpretierend.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klage-Ton. Das konkrete Paar »dasitzen und aufstehen« sowie die knappe Schlussaussage bleiben erhalten; der Doppelpunkt bildet die zugespitzte Folgerung ab.
