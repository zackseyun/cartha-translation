  text: קָרַ֨בְתָּ֙ בְּ/י֣וֹם אֶקְרָאֶ֔/ךָּ אָמַ֖רְתָּ אַל תִּירָֽא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: de
  text: 'Du kamst mir nahe, als ich zu dir rief; du sagtest: „Fürchte dich nicht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: Du kamst mir nahe
  rationale: Das Qal Perfekt 2. Person Maskulin Singular bezeichnet im Gebetskontext Gottes Annäherung. „Kamst mir nahe“ gibt die konkrete Nähe natürlich wieder; das im Deutschen nötige „mir“ ist aus der Beziehung zwischen Sprecher und Angeredetem erschlossen.
- source_word: בְּיוֹם
  choice: als
  rationale: בְּיוֹם leitet hier eine Zeitangabe ein. Das idiomatische deutsche „als“ bewahrt den zeitlichen Sinn, ohne die im Deutschen schwerfällige Formulierung „an dem Tag, an dem“ zu erzwingen.
- source_word: אֶקְרָאֶךָּ
  choice: ich zu dir rief
  rationale: קרא mit dem Suffix der 2. Person Maskulin Singular bezeichnet das Rufen zu Gott. „Rief“ lässt die Intensität offen und passt zur rückblickenden Erzählung.
- source_word: אָמַרְתָּ
  choice: du sagtest
  rationale: Direkte und idiomatische Wiedergabe des Qal Perfekts von אמר.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: אַל mit der folgenden Verbform drückt eine verneinte Aufforderung aus. Die traditionelle, weiterhin verständliche Wendung gibt den hebräischen Wortlaut knapp und würdig wieder.
theological_decisions:
- issue: Identität des Angeredeten
  choice: 'Die Verben werden als direkte Anrede Gottes wiedergegeben: „Du kamst … du sagtest“.'
  alternative: Ein unbestimmtes oder unpersönliches Subjekt.
  rationale: Die Verbformen stehen eindeutig in der 2. Person Maskulin Singular; im umgebenden Gebet ist Gott der Angeredete. Weitere theologische Aussagen werden nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. Der hebräische Ausdruck בְּיוֹם wird idiomatisch temporal mit „als“ wiedergegeben; die direkte Rede bleibt erhalten.
