source:
  edition: WLC
  text: עֵינִ/י֙ עֽוֹלְלָ֣ה לְ/נַפְשִׁ֔/י מִ/כֹּ֖ל בְּנ֥וֹת עִירִֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/051.yaml
  text: My eye causes grief to my soul because of all the daughters of my city.
translation:
  language: de
  text: Mein Auge bereitet meiner Seele Kummer wegen all der Töchter meiner Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mehr als alle Töchter meiner Stadt«.'
    reason: מִכֹּל kann kausal (»wegen all der«) oder vergleichend (»mehr als alle«) verstanden werden; die kausale Lesart passt hier besser zum Zusammenhang.
lexical_decisions:
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Bewahrt das konkrete Bild und die auffällige Personifizierung des hebräischen Textes, statt es erklärend zu »Was ich sehe« aufzulösen.
- source_word: עוֹלְלָה לְנַפְשִׁי
  choice: bereitet meiner Seele Kummer
  rationale: עוֹלֵל bezeichnet hier ein schädigendes oder quälendes Einwirken. Die Formulierung gibt die Verursachungsbeziehung natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: בְּנוֹת עִירִי
  choice: Töchter meiner Stadt
  rationale: Die hebräische Metapher bleibt erhalten; gemeint sein können die weiblichen Bewohnerinnen beziehungsweise jungen Frauen der Stadt, doch der Text benennt sie poetisch als ihre Töchter.
theological_decisions:
- issue: Beziehung zwischen dem Sehen und dem inneren Leiden
  choice: Die Aussage lässt das Auge der Seele Kummer bereiten.
  alternative: Was ich sehe, quält mich.
  rationale: Die Übersetzung bewahrt die poetische Spannung zwischen Auge und Seele und legt nicht ausdrücklich fest, ob allein der Anblick oder das Schicksal der Frauen den Kummer hervorruft.
- issue: Funktion von מִן in מִכֹּל
  choice: wegen all der
  alternative: mehr als alle
  rationale: 'Im Zusammenhang ist eine kausale Bedeutung am wahrscheinlichsten: Der Kummer entsteht angesichts beziehungsweise wegen der Töchter der Stadt. Die formal mögliche vergleichende Lesart wird in der Fußnote offengehalten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. »Kummer bereiten« ist natürlich verständlich und gibt das schädigende Wirken des Verbs wieder, ohne die mehrdeutige Bildrede auszuerklären.
