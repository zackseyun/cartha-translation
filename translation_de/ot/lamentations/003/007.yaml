  text: גָּדַ֧ר בַּעֲדִ֛/י וְ/לֹ֥א אֵצֵ֖א הִכְבִּ֥יד נְחָשְׁתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/007.yaml
  text: He has walled me in so that I cannot get out[a]; he has made my chain heavy.
translation:
  language: de
  text: Er hat mich ummauert, sodass ich nicht herauskomme; er hat meine Fessel schwer gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine bronzene Fessel“ oder „meine Kette“. Das Hebräische lautet wörtlich etwa „mein Bronze/Kupfer“ und bezeichnet hier wahrscheinlich eine metallene Fessel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: hat mich eingemauert
  rationale: Das Verb bezeichnet das Ummauern, Einzäunen oder Einschließen. „Eingemauert“ bewahrt das konkrete Bild völliger Einschließung und ist im Deutschen natürlich verständlich.
- source_word: בַּעֲדִי
  choice: mich
  rationale: In Verbindung mit גָּדַר bezeichnet die Präposition mit Suffix die vom Einschließen betroffene Person; die deutsche Verbform „mich eingemauert“ gibt dies idiomatisch wieder.
- source_word: וְלֹא אֵצֵא
  choice: sodass ich nicht herauskomme
  rationale: Wörtlich steht „und ich gehe/komme nicht hinaus“. Im Zusammenhang drückt die Form die Folge der Einschließung aus; „nicht herauskomme“ wahrt die Möglichkeit, ohne unnötig ausdrücklich „kann“ zu ergänzen.
- source_word: הִכְבִּיד
  choice: hat … schwer gemacht
  rationale: Der Hifil von כבד bedeutet hier „schwer machen“. Die konkrete Formulierung erhält das Bild einer belastenden Fessel.
- source_word: נְחָשְׁתִּי
  choice: meine Fessel
  rationale: Das seltene Wort hängt mit „Bronze/Kupfer“ zusammen und bezeichnet wahrscheinlich metonymisch eine metallene Fessel oder Kette. „Fessel“ passt zum Bild der Gefangenschaft, ohne das unsichere Material als sicher auszugeben; die Wortbeziehung wird in der Fußnote erläutert.
