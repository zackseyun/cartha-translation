  source_fidelity: Der Entwurf gibt die betonte Selbstbezeichnung אֲנִי הַגֶּבֶר angemessen mit „Ich bin der Mann“ wieder. „der Elend gesehen hat“ bewahrt das Bildfeld von רָאָה, ohne es durch „erlebt“ auszudeuten. „Elend“ deckt die hier gemeinte Bedrängnis/Not (עֳנִי) gut ab. „unter der Rute seines Zorns“ erhält sowohl die Strafmetaphorik von שֵׁבֶט als auch den im Hebräischen lediglich pronominal ausgedrückten Bezug von עֶבְרָתוֹ.
