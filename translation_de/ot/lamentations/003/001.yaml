source:
  edition: WLC
  text: אֲנִ֤י הַ/גֶּ֨בֶר֙ רָאָ֣ה עֳנִ֔י בְּ/שֵׁ֖בֶט עֶבְרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/001.yaml
  text: I am the man who has seen affliction under the rod of his wrath[a][b].
translation:
  language: de
  text: Ich bin der Mann, der Elend gesehen hat unter der Rute seines Zorns[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Rute seines Zorns“. Die hebräische Präposition lässt mehrere Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: „Elend“ kann auch mit „Not“ oder „Leiden“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen steht betont am Versanfang. In Verbindung mit der verblosen Selbstbezeichnung gibt „Ich bin“ diese Hervorhebung im natürlichen Deutschen wieder.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: גֶּבֶר bezeichnet einen erwachsenen Mann und kann Stärke mitschwingen lassen; hier ist „der Mann“ die sachlichste Wiedergabe der bestimmten Selbstbezeichnung.
- source_word: רָאָה
  choice: gesehen hat
  rationale: Die Perfektform beschreibt eine erlittene Vergangenheit, die die gegenwärtige Selbstbeschreibung prägt. „Gesehen“ bewahrt das konkrete hebräische Verb, ohne es deutend durch „erlebt“ zu ersetzen.
- source_word: עֳנִי
  choice: Elend
  rationale: עֳנִי umfasst Bedrängnis, Not und Leiden. „Elend“ bewahrt diese Bedeutungsbreite und verengt den Ausdruck nicht auf Armut.
- source_word: בְּשֵׁבֶט
  choice: unter der Rute
  rationale: שֵׁבֶט bezeichnet eine Rute, einen Stab oder ein Zepter; im Zusammenhang steht das Bild strafender Gewalt im Vordergrund. „Unter der Rute“ gibt die Unterworfenheit wieder, während die Präposition ב auch instrumental verstanden werden kann.
- source_word: עֶבְרָתוֹ
  choice: seines Zorns
  rationale: עֶבְרָה bezeichnet heftigen Zorn oder Grimm. „Zorn“ ist im Deutschen würdevoll und klar; das maskuline Suffix der dritten Person bleibt als Pronomen erhalten.
theological_decisions:
- issue: Bezug des Pronomens in „seines Zorns“
  choice: Das hebräische Pronomen wird als „seines“ beibehalten, ohne im Haupttext „Gottes“ oder „des HERRN“ zu ergänzen.
  alternative: „unter der Rute des Zorns des HERRN“ oder „unter der Rute des Zorns Gottes“
  rationale: Der unmittelbare hebräische Wortlaut enthält nur ein maskulines Suffix der dritten Person. Der weitere Zusammenhang weist auf Gott als Bezugsgröße, doch eine ausdrückliche Benennung würde mehr sagen als dieser Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildsprache. Der leicht feierliche Ausdruck „Rute seines Zorns“ entspricht dem poetischen Klagekontext, ohne den göttlichen Bezug ausdrücklich zu ergänzen.
