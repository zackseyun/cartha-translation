  terminology: „Mann“, „Elend“, „Rute“ und „Zorn“ sind terminologisch treffend. Insbesondere wird der göttliche Referent nicht entgegen dem Wortlaut explizit ergänzt. Die Fußnoten bieten sachgerechte lexikalische beziehungsweise präpositionale Alternativen, ohne den Haupttext zu überfrachten.
