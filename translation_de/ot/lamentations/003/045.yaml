  text: סְחִ֧י וּ/מָא֛וֹס תְּשִׂימֵ֖/נוּ בְּ/קֶ֥רֶב הָ/עַמִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/045.yaml
  text: You have made us scum and refuse in the midst of the peoples[a][b].
translation:
  language: de
  text: Du hast uns inmitten der Völker zu Abschaum und Unrat gemacht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Kehricht und Unrat“; die beiden seltenen Substantive drücken zusammen äußerste Verachtung und Erniedrigung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter den Nationen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְחִי
  choice: Abschaum
  rationale: Das seltene Substantiv bezeichnet etwas Abstoßendes oder Weggeschabtes. „Abschaum“ ist im modernen Deutsch anschaulich und bringt die erfahrene äußerste Verachtung zum Ausdruck.
- source_word: וּמָאוֹס
  choice: und Unrat
  rationale: Das Wort hängt mit Verwerfen beziehungsweise Verabscheuen zusammen und bezeichnet etwas Weggeworfenes, Widerwärtiges. „Unrat“ bildet mit „Abschaum“ ein kräftiges, natürliches Wortpaar.
- source_word: תְּשִׂימֵנוּ
  choice: du hast uns zu … gemacht
  rationale: שׂים bedeutet wörtlich „setzen/stellen“, hat hier mit Objekt und Prädikatsbezeichnung aber den Sinn „zu etwas machen“. Das Perfekt wird als vollzogene Handlung mit gegenwärtiger Folge wiedergegeben.
- source_word: בְּקֶרֶב
  choice: inmitten
  rationale: Die Wiedergabe bewahrt die räumlich-soziale Vorstellung, dass die Erniedrigten mitten unter einer größeren Gruppe stehen.
- source_word: הָעַמִּים
  choice: der Völker
  rationale: Der Plural עַמִּים bezeichnet Völker beziehungsweise Volksgruppen. „Völker“ ist formal präzise; kontextuell ist auch „Nationen“ möglich.
theological_decisions: []
