  text: יֵשֵׁ֤ב בָּדָד֙ וְ/יִדֹּ֔ם כִּ֥י נָטַ֖ל עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: de
  text: Er soll allein sitzen und schweigen[a], denn er hat es ihm auferlegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sei still“. Im Hebräischen bleiben sowohl das Subjekt („er“) als auch das Objekt („es“) unausgesprochen; „eine Last“ ist eine mögliche kontextuelle Ergänzung.'
    reason: Lexikalische Alternative und Bewahrung der grammatischen Mehrdeutigkeit.
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Er soll … sitzen
  rationale: Das Qal-Imperfekt der 3. Person Singular hat im Zusammenhang der umgebenden Aufforderungen jussivischen Sinn. „Er soll sitzen“ gibt diese Aufforderung in natürlichem modernem Deutsch wieder.
- source_word: בָּדָד
  choice: allein
  rationale: Das Wort bezeichnet Abgesondertheit oder Einsamkeit. „Allein“ ist klar und bewahrt die emotionale Wirkung ohne unnötige Zuspitzung.
- source_word: וְיִדֹּם
  choice: und schweigen
  rationale: דמם kann Schweigen oder Stillsein bezeichnen. Im Zusammenhang des stillen Erduldens ist „schweigen“ naheliegend; die mögliche Nuance des Stillhaltens bleibt im Kontext erhalten.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier am natürlichsten die Begründung der Aufforderung ein.
- source_word: נָטַל
  choice: hat … auferlegt
  rationale: Das Verb bedeutet grundsätzlich „heben, tragen, nehmen“, kann mit עַל jedoch das Auflegen einer Last ausdrücken. „Auferlegt“ vermittelt diesen kontextuellen Sinn idiomatisch.
- source_word: עָלָיו
  choice: ihm
  rationale: Die deutsche Dativkonstruktion mit „auferlegen“ gibt die Bedeutung von „auf ihn“ natürlich wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt und Objekt von נָטַל
  choice: „denn er hat es ihm auferlegt“; weder der Handelnde noch das Auferlegte wird ausdrücklich benannt
  alternative: „denn der HERR hat es ihm auferlegt“ oder „denn er hat ihm eine Last auferlegt“
  rationale: Der hebräische Satz nennt das Subjekt nicht ausdrücklich und lässt auch das Objekt unausgesprochen. Das deutsche Pronomen „es“ ermöglicht einen verständlichen Satz, ohne Gott ausdrücklich als Subjekt einzusetzen oder die auferlegte Sache als bestimmte Last festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Soll-Konstruktion gibt den jussivischen Charakter verständlich wieder; die Pronomen bewahren die im Hebräischen nicht aufgelöste Mehrdeutigkeit.
