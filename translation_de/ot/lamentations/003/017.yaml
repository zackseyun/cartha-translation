base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
translation:
  language: de
  text: Du hast meine Seele aus dem Frieden verstoßen[a]; ich habe das Gute vergessen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wenn die Verbform als 3. Person feminin verstanden wird: „Meine Seele ist des Friedens beraubt.“ Das hebräische Wort für „Frieden“ kann auch Wohlergehen und Unversehrtheit bezeichnen.'
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: 'Oder: „Gutes“; das Wort kann auch Wohlergehen, Glück oder Wohlstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנַח ... נַפְשִׁי
  choice: Meine Seele ist … beraubt
  rationale: 'Die Verbform kann als 3. Person feminin mit dem nachgestellten נַפְשִׁי als Subjekt verstanden werden: Die Seele ist vom Frieden ausgeschlossen bzw. seiner beraubt. Diese Deutung entspricht der masoretischen Vokalisierung und vermeidet es, ohne Not eine direkte Anrede Gottes einzutragen.'
- source_word: מִשָּׁלוֹם
  choice: des Friedens
  rationale: שָׁלוֹם bezeichnet Frieden, Unversehrtheit und umfassendes Wohlergehen. „Frieden“ bewahrt den zentralen Begriff und passt zum poetischen Zusammenhang.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Meine Seele“ erhält das poetische Bild und die innere Dimension der Klage.
- source_word: נָשִׁיתִי
  choice: ich habe vergessen
  rationale: Das Perfekt der 1. Person Singular wird direkt wiedergegeben; ein kausatives „du hast mich vergessen lassen“ ist grammatisch nicht erforderlich.
- source_word: טוֹבָה
  choice: was Wohlergehen ist
  rationale: Das feminine Abstraktum bezeichnet Gutes, Wohlergehen oder Glück. Die idiomatische Wendung bringt zum Ausdruck, dass dem Sprecher die Erfahrung des Wohlergehens völlig abhandengekommen ist, ohne den Sinn auf materiellen Wohlstand zu verengen.
theological_decisions:
- issue: Subjekt von וַתִּזְנַח
  choice: „Meine Seele“ als grammatisches Subjekt
  alternative: „Du hast meine Seele vom Frieden verstoßen“ mit Gott als angeredetem Subjekt
  rationale: Die Form תִּזְנַח kann formal sowohl 3. Person feminin als auch 2. Person maskulin Singular sein. Das ausdrücklich folgende feminine נַפְשִׁי legt hier die erste Analyse nahe; die mögliche direkte Anrede bleibt in der Fußnote erhalten.
translation_notes:
  register: Poetisch und würdevoll, aber in modernem Standarddeutsch verständlich. „Des Friedens beraubt“ bewahrt die starke Aussage des hebräischen Verbs; die zweite Halbzeile wird idiomatisch formuliert, während die wörtlichere Fassung in der Fußnote steht.
