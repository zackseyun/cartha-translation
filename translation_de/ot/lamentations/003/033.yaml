base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/033.yaml
  text: For he does not afflict from his heart or grieve the sons of men[a][b].
translation:
  language: de
  text: Denn er bedrückt und betrübt die Menschenkinder nicht aus seinem Herzen heraus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus freien Stücken“ oder „gern“; wörtlich: „aus seinem Herzen heraus“.'
    reason: lexical_alternative
  - marker: b
    text: „Menschenkinder“ ist eine hebräische Ausdrucksweise für Menschen im Allgemeinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und passt natürlich in den deutschen Zusammenhang.
- source_word: לֹא
  choice: nicht
  rationale: Gibt die klare Verneinung direkt wieder.
- source_word: עִנָּה
  choice: bedrückt
  rationale: Das Verb bezeichnet hier das Zufügen von Leid oder Bedrängnis. „Bedrückt“ bewahrt den ernsten, weiten Sinn, ohne ihn auf Demütigung oder Unterdrückung zu verengen.
- source_word: מִלִּבּוֹ
  choice: aus seinem Herzen heraus
  rationale: Bewahrt das konkrete hebräische Bild und macht im Deutschen deutlich, dass das Handeln nicht Gottes innerstem Wollen oder Verlangen entspringt.
- source_word: וַיַּגֶּה
  choice: und betrübt sie
  rationale: Gibt das Verursachen von Kummer oder Trauer wieder. Das ergänzte Pronomen macht im Deutschen deutlich, dass „die Menschenkinder“ gemeinsames Objekt beider Verben sind.
- source_word: בְנֵי אִישׁ
  choice: die Menschenkinder
  rationale: „Menschenkinder“ ist eine verständliche, würdige deutsche Entsprechung der hebräischen Wendung und bezeichnet Menschen allgemein, ohne den bildhaften Ausdruck vollständig einzuebnen.
theological_decisions:
- issue: Anthropomorphe Aussage über Gottes innere Haltung
  choice: aus seinem Herzen heraus
  alternative: willig / gern
  rationale: Die bildhafte Rede wird im Haupttext erhalten. Sie besagt, dass Bedrücken und Betrüben nicht Gottes innerstem Verlangen entspringen, ohne die Spannung zwischen seinem Handeln und seiner Haltung aufzulösen.
- issue: Bedeutungsumfang von בְנֵי אִישׁ
  choice: Menschenkinder
  alternative: Menschen
  rationale: Die bildhafte, kollektiv auf alle Menschen bezogene Ausdrucksweise bleibt erhalten; eine Fußnote erläutert ihren umfassenden Sinn.
- issue: Verhältnis der beiden Verben
  choice: und
  alternative: oder
  rationale: Das hebräische ו verbindet die Verben grundsätzlich koordinierend. „Und“ bewahrt diese normale Verknüpfung, während das gemeinsame Objekt durch „sie“ verdeutlicht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Herz-Metapher und die bildhafte Bezeichnung „Menschenkinder“ bleiben erhalten; die Satzstellung wurde für natürliche Verständlichkeit im Deutschen behutsam geordnet.
