base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/012.yaml
  text: He bent his bow and set me up as a target for the arrow[a].
translation:
  language: de
  text: 'Er spannte seinen Bogen

    und stellte mich als Ziel für den Pfeil auf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er zog seinen Bogen und stellte mich wie eine Zielscheibe für den Pfeil hin.“'
    reason: Lexikalische Alternativen bei דָּרַךְ („spannen/ziehen“), כ („als/wie“) und der Wiedergabe von יצב.
lexical_decisions:
- source_word: דָּרַךְ
  choice: spannte
  rationale: In Verbindung mit קֶשֶׁת bezeichnet das Verb das Spannen beziehungsweise Schussbereitmachen eines Bogens. „Spannte“ ist im Deutschen die natürliche und bildgetreue Wiedergabe.
- source_word: קַשְׁתּוֹ
  choice: seinen Bogen
  rationale: Das Substantiv mit Suffix der 3. Person maskulin Singular wird direkt als „seinen Bogen“ wiedergegeben.
- source_word: וַיַּצִּיבֵנִי
  choice: und stellte mich … auf
  rationale: Die Form von יצב bedeutet „hinstellen, aufstellen, positionieren“. „Stellte mich … auf“ wahrt das feindliche Bild einer gezielten Positionierung.
- source_word: כַּמַּטָּרָא
  choice: als Ziel
  rationale: כ markiert hier einen Vergleich beziehungsweise eine zugeschriebene Rolle; מַטָּרָא bezeichnet das Ziel oder die Zielscheibe. „Als Ziel“ ist knapp und natürlich.
- source_word: לַחֵץ
  choice: für den Pfeil
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise Bestimmung. Der Singular und die Determination des Hebräischen bleiben in „für den Pfeil“ erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengliederung. Das martialische Einzelbild von Bogen, Ziel und Pfeil sowie der Sprecherwechsel in die erste Person bleiben erhalten.
