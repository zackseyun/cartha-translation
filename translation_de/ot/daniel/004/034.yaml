  text: כְּעַ֞ן אֲנָ֣ה נְבוּכַדְנֶצַּ֗ר מְשַׁבַּ֨ח וּ/מְרוֹמֵ֤ם וּ/מְהַדַּר֙ לְ/מֶ֣לֶךְ שְׁמַיָּ֔/א דִּ֤י כָל מַעֲבָד֨וֹ/הִי֙ קְשֹׁ֔ט וְ/אֹרְחָתֵ֖/הּ דִּ֑ין וְ/דִי֙ מַהְלְכִ֣ין בְּ/גֵוָ֔ה יָכִ֖ל לְ/הַשְׁפָּלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: de
  text: Nun lobe, erhebe und ehre ich, Nebukadnezar, den König des Himmels; denn alle seine Werke sind Wahrheit und seine Wege sind Recht. Und die in Hochmut einhergehen, kann er erniedrigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: Nun
  rationale: Das aramäische Zeit- und Übergangswort ist ausdrücklich vorhanden und wird knapp mit „Nun“ wiedergegeben.
- source_word: מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר
  choice: lobe, erhebe und ehre
  rationale: Die dreigliedrige Aussage wird in ihrer Steigerung und Parallelität bewahrt.
- source_word: קְשֹׁט
  choice: Wahrheit
  rationale: Die nominale Aussage des Aramäischen wird formal bewahrt; gemeint ist, dass Gottes Werke wahr und zuverlässig sind.
- source_word: דִּין
  choice: Recht
  rationale: „Recht“ gibt hier die Vorstellung gerechten Urteilens beziehungsweise rechtmäßigen Handelns prägnant wieder.
- source_word: מַהְלְכִין בְּגֵוָה
  choice: die in Hochmut einhergehen
  rationale: Das Bild des Wandelns beziehungsweise Einhergehens in Stolz wird beibehalten und zugleich idiomatisch formuliert.
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: kann er erniedrigen
  rationale: Die im Ausgangstext ausgesagte Fähigkeit wird ausdrücklich bewahrt, ohne sie als bloße Möglichkeit abzuschwächen oder als zwangsläufige Handlung zu verschärfen.
theological_decisions:
- issue: Gottes Werke und Wege
  choice: „alle seine Werke sind Wahrheit und seine Wege sind Recht“
  alternative: „alles, was er tut, ist wahr, und seine Wege sind gerecht“
  rationale: Die nominale, feierliche Form des aramäischen Bekenntnisses bleibt erhalten, ohne die Aussage konfessionell auszudeuten.
- issue: Gottes Macht über die Hochmütigen
  choice: „kann er erniedrigen“
  alternative: „erniedrigt er“
  rationale: Das aramäische Verb bezeichnet ausdrücklich Gottes Vermögen; die Übersetzung bewahrt diese modale Aussage und macht daraus keine allgemeine Behauptung über den Zeitpunkt oder die Ausnahmslosigkeit seines Handelns.
translation_notes:
  register: Feierliches, aber modernes Standarddeutsch. Die dreifache Lobformel und die Parallelität der Aussagen bleiben hörbar. „Nun“ folgt dem ausdrücklich vorhandenen aramäischen כְּעַן.
