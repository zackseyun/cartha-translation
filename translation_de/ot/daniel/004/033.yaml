  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: de
  text: Zu dieser Zeit kehrte mein Verstand zu mir zurück[a]. Und zur Ehre meines Königtums kehrten meine Majestät und mein Glanz zu mir zurück. Meine Ratgeber und meine Großen suchten mich auf[b]. Ich wurde wieder über mein Königreich eingesetzt[c], und noch mehr Größe wurde mir hinzugefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Einsicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Meine Ratgeber und meine Würdenträger suchten mich.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ich wurde wieder über mein Königreich bestätigt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Zu dieser Zeit
  rationale: Gibt die aramäische Zeitangabe natürlich und ohne unnötige Zuspitzung auf einen einzelnen Augenblick wieder.
- source_word: מַנְדְּעִי
  choice: mein Verstand
  rationale: Bezeichnet hier im Zusammenhang mit Nebukadnezars Genesung sein wiedergewonnenes Denk- und Urteilsvermögen; „Verständnis“ bleibt als mögliche Alternative erhalten.
- source_word: יְתוּב עֲלַי
  choice: kehrte zu mir zurück
  rationale: Bewahrt die konkrete Rückkehrformulierung sowie ihre Wiederholung im ersten und zweiten Satz.
- source_word: לִיקַר מַלְכוּתִי
  choice: zur Ehre meines Königtums
  rationale: Gibt לִיקַר relational beziehungsweise resultativ wieder und wahrt den Bezug zur königlichen Würde; „Königtum“ bezeichnet Stellung und Herrschaft, nicht lediglich das Staatsgebiet.
- source_word: הַדְרִי וְזִוִי
  choice: meine Majestät und mein Glanz
  rationale: Das Begriffspaar beschreibt die wiederhergestellte königliche Würde und Ausstrahlung.
- source_word: הַדָּבְרַי
  choice: meine Ratgeber
  rationale: Bezeichnet die beratenden Amtsträger des Königs in klarem modernem Deutsch.
- source_word: רַבְרְבָנַי
  choice: meine Großen
  rationale: Die relativ formnahe Wiedergabe bezeichnet hochrangige Männer beziehungsweise Würdenträger und erhält die breitere Bedeutung gegenüber dem engeren „Adligen“.
- source_word: יְבַעוֹן
  choice: suchten mich auf
  rationale: Im Zusammenhang der erneuten Anerkennung seiner Herrschaft ist damit nicht bloß eine Suche, sondern das erneute Herantreten der Amtsträger an den König gemeint.
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: Ich wurde wieder über mein Königreich eingesetzt
  rationale: Gibt die Wiederherstellung und Festigung seiner Stellung als Herrscher wieder, ohne den Handelnden ausdrücklich zu benennen.
- source_word: רְבוּ יַתִּירָה
  choice: noch größere Macht
  rationale: רְבוּ kann Größe beziehungsweise Macht bezeichnen; im königlichen Zusammenhang meint die Wendung einen zusätzlichen Zuwachs an Herrschermacht. Die Steigerung gibt יַתִּירָה idiomatisch wieder.
- source_word: הוּסְפַת לִי
  choice: wurde mir hinzugefügt
  rationale: Die passive Formulierung wahrt sowohl den Wortlaut als auch die unausgesprochene Urheberschaft.
theological_decisions:
- issue: Göttliche Urheberschaft der Wiederherstellung
  choice: Die passiven und intransitiven Formulierungen bleiben ohne ausdrückliche Nennung Gottes stehen.
  alternative: „Gott setzte mich wieder ein“ beziehungsweise „Gott gab mir noch größere Macht“.
  rationale: Der Zusammenhang schreibt die Wiederherstellung dem Höchsten zu, doch dieser Vers benennt den Handelnden nicht ausdrücklich. Die Übersetzung macht daher die implizite Urheberschaft nicht explizit.
- issue: Bedeutung von רְבוּ im königlichen Zusammenhang
  choice: „Macht“
  alternative: „Größe“ oder „Hoheit“
  rationale: „Macht“ macht den Bezug auf die gesteigerte königliche Stellung verständlich, ohne eine geistliche oder moralische Größe hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „kehrte … zurück“ bildet die aramäische Struktur ab. „Königtum“ im ersten Satz bezeichnet die königliche Stellung und Würde, „Königreich“ im zweiten den Herrschaftsbereich. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
