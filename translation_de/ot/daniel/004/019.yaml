base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: de
  text: Du bist der König, der groß und stark geworden ist. Deine Größe ist groß geworden und hat bis an den Himmel gereicht, und deine Herrschaft bis ans Ende der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis an die Enden der Erde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה הוּא מַלְכָּא
  choice: Das bist du, König
  rationale: Die betonte Pronomenverbindung identifiziert Nebukadnezar mit dem zuvor beschriebenen Baum; מַלְכָּא ist im Kontext am natürlichsten als Anrede wiederzugeben.
- source_word: רְבַית וּתְקֵפְתְּ
  choice: Du bist groß und stark geworden
  rationale: Die beiden Verben beschreiben das Anwachsen zu Größe und Stärke. Die deutsche Formulierung bewahrt sowohl den Vorgang als auch die parallele Struktur.
- source_word: וּרְבוּתָךְ רְבָת
  choice: Deine Größe ist gewaltig geworden
  rationale: Die Formulierung erhält die Wiederholung des Wortfelds ‚groß/Größe‘, vermeidet aber das im Deutschen schwerfällige ‚deine Größe ist groß geworden‘.
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: und hat bis an den Himmel gereicht
  rationale: Das Verb bezeichnet ein Erreichen; ‚bis an den Himmel‘ gibt die räumliche Steigerung natürlich und bildhaft wieder.
- source_word: וְשָׁלְטָנָךְ
  choice: und deine Herrschaft
  rationale: ‚Herrschaft‘ bezeichnet sowohl die ausgeübte Regierungsgewalt als auch deren Reichweite und passt zum königlichen Kontext.
- source_word: לְסוֹף אַרְעָא
  choice: bis ans Ende der Erde
  rationale: Die singularische Form des Aramäischen wird eng nachgebildet; die mögliche idiomatische Mehrzahl wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite der königlichen Herrschaft
  choice: bis ans Ende der Erde
  alternative: bis an die Enden der Erde
  rationale: Die königliche Universalsprache bleibt ohne Festlegung darauf stehen, ob sie streng global oder als antike Herrscherüberhöhung zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Identifikation mit dem Traumbaum wird durch »Das bist du« deutlich gemacht; die wiederholte Wurzel רבה bleibt durch »groß/Größe« hörbar. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
