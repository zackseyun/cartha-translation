base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: de
  text: Und von mir erging ein Befehl, alle Weisen Babylons vor mich zu bringen, damit sie mir die Deutung des Traumes mitteilen sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנִּי
  choice: Und von mir
  rationale: 'Die Präposition מן mit dem Suffix der 1. Person Singular bezeichnet den Ausgangspunkt: Der Befehl ging vom König aus. „Von mir“ bewahrt diese Bildrichtung im Deutschen.'
- source_word: שִׂים טְעֵם
  choice: erging ein Befehl
  rationale: Die aramäische Verwaltungsformel bezeichnet das Erlassen beziehungsweise Ausgeben einer königlichen Anordnung. „Ein Befehl erging“ ist würdig, idiomatisch und bewahrt die unpersönliche Konstruktion.
- source_word: לְהַנְעָלָה קָדָמַי
  choice: vor mich zu bringen
  rationale: Der Kausativinfinitiv bezeichnet das Herbeibringen, und קָדָמַי die Gegenwart des Königs. Die Wendung gibt beides knapp und natürlich wieder.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: alle Weisen Babylons
  rationale: Die Konstruktverbindung bezeichnet die babylonischen Hofweisen beziehungsweise Experten. „Weise“ ist verständlich und entspricht der etablierten Begrifflichkeit im Danielbuch.
- source_word: דִּי
  choice: damit
  rationale: Die Partikel leitet hier den Zweck der königlichen Anordnung ein.
- source_word: פְשַׁר חֶלְמָא
  choice: die Deutung des Traumes
  rationale: פְשַׁר ist im Danielbuch der technische Ausdruck für die Deutung eines Traumes oder Geheimnisses. Der emphatische Status von חֶלְמָא wird ohne ergänztes Possessivpronomen wiedergegeben.
- source_word: יְהוֹדְעֻנַּנִי
  choice: sie mir … bekannt machten
  rationale: Die Kausativform von ידע mit dem Objekt der 1. Person Singular bedeutet wörtlich „sie ließen mich wissen“. Im abhängigen Zwecksatz entspricht „bekannt machten“ der Form und klingt natürlich.
