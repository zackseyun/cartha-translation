source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: de
  text: Dies ist der Traum, den ich, König Nebukadnezar, gesehen habe. Und du, Beltschazzar, sage, was er bedeutet; denn alle Weisen meines Königreichs können mir seine Deutung nicht bekannt machen. Du aber kannst es, denn der Geist der heiligen Götter ist in dir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Geist des heiligen Gottes ist in dir«. Die aramäischen Formen stehen im Plural, werden aber von manchen als singularischer Verweis verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  choice: Dies ist der Traum
  rationale: Das Demonstrativpronomen und der bestimmte aramäische Ausdruck werden in natürlichem Deutsch mit ergänzter Kopula wiedergegeben.
- source_word: חֲזֵית אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: den ich, König Nebukadnezar, gesehen habe
  rationale: Das Perfekt bezeichnet die zurückliegende Traumschau; die appositionelle königliche Selbstbezeichnung bleibt erhalten.
- source_word: וְאַנתָּה בֵּלְטְשַׁאצַּר
  choice: Und du, Beltschazzar
  rationale: Die einfache Verbindung und die betonte direkte Anrede werden bewahrt; der Name folgt der geläufigen deutschen Bibelschreibung.
- source_word: פִּשְׁרֵא אֱמַר
  choice: sage, was er bedeutet
  rationale: Wörtlich steht ein Imperativ mit „Deutung“. Die idiomatische Formulierung macht den Bezug auf den Traum eindeutig, ohne den Sinn zu erweitern.
- source_word: כָּל־קֳבֵל דִּי
  choice: denn
  rationale: Die aramäische Wendung führt die Begründung für die Aufforderung ein.
- source_word: כָּל חַכִּימֵי מַלְכוּתִי
  choice: alle Weisen meines Königreichs
  rationale: „Weise“ bezeichnet hier die sachkundigen Männer am Königshof; „Königreich“ gibt den Herrschaftsbereich wieder.
- source_word: לָא יָכְלִין פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: können mir seine Deutung nicht bekannt machen
  rationale: Die Unfähigkeit sowie die kausative Bedeutung „bekannt machen“ werden ausdrücklich wiedergegeben; „seine“ verweist auf den Traum.
- source_word: וְאַנתָּה כָּהֵל
  choice: Du aber kannst es
  rationale: Das formal verbindende ו erhält im Deutschen wegen des deutlichen Gegensatzes die natürliche kontrastive Wiedergabe „aber“.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין בָּךְ
  choice: der Geist der heiligen Götter ist in dir
  rationale: Die morphologisch pluralischen Formen und der babylonische Sprecherkontext sprechen für „heilige Götter“; die mögliche singularische Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Deutung von רוּחַ אֱלָהִין קַדִּישִׁין in Nebukadnezars Rede
  choice: der Geist der heiligen Götter
  alternative: der Geist des heiligen Gottes
  rationale: אֱלָהִין und קַדִּישִׁין sind formal pluralisch, und die Aussage stammt aus dem Mund des babylonischen Königs. Die Hauptfassung bewahrt daher die wahrscheinlich polytheistische Redeweise; die traditionell mögliche singularische Auffassung bleibt als echte Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax ist gut verständlich, bewahrt aber die feierliche königliche Rede. Die theologisch bedeutsame Mehrdeutigkeit am Versende wird nicht stillschweigend aufgelöst.
