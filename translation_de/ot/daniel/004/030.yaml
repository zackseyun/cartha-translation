source:
  edition: WLC
  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: de
  text: In diesem Augenblick erfüllte sich das Wort gegen Nebukadnezar. Er wurde aus der Gemeinschaft der Menschen vertrieben und fraß Gras wie die Rinder. Sein Körper wurde vom Tau des Himmels durchnässt, bis sein Haar so lang wie Adlerfedern[a] wurde und seine Nägel wie Vogelkrallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Geierfedern“. Das aramäische Wort kann auch andere große Greif- oder Aasvögel bezeichnen; traditionell wird es mit „Adler“ wiedergegeben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: In diesem Augenblick
  rationale: Die aramäische Zeitangabe bedeutet wörtlich „in jener Stunde/zu jener Zeit“; die gewählte Formulierung ist natürlich und bewahrt die Unmittelbarkeit.
- source_word: מִלְּתָא סָפַת עַל נְבוּכַדְנֶצַּר
  choice: erfüllte sich das Wort gegen Nebukadnezar
  rationale: מִלְּתָא kann „Wort“, „Sache“ oder im Zusammenhang „Urteilsspruch“ bedeuten. „Wort“ wahrt die lexikalische Offenheit; „erfüllte sich“ gibt den Eintritt des zuvor Angekündigten wieder.
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: Er wurde aus der Gemeinschaft der Menschen vertrieben
  rationale: Die Wendung bezeichnet den Ausschluss aus der menschlichen Gesellschaft. „Gemeinschaft“ verdeutlicht dieses räumlich-soziale „aus der Mitte von“, ohne den Sinn auf Männer zu beschränken.
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: und fraß Gras wie die Rinder
  rationale: עִשְׂבָּא bezeichnet Gras bzw. Pflanzenwuchs, תוֹרִין Rinder. „Fraß“ ist bei dem tiergleichen Verhalten im Deutschen idiomatisch und bildkräftig.
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: Sein Körper wurde vom Tau des Himmels durchnässt
  rationale: Die Passivform beschreibt, dass sein Körper nass bzw. durchtränkt wurde. „Tau des Himmels“ bewahrt das konkrete biblische Bild.
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: sein Haar wie Adlerfedern wuchs
  rationale: רבה bedeutet hier, dass das Haar stark bzw. lang wuchs. נשר kann Adler oder allgemeiner einen großen Greif- beziehungsweise Aasvogel bezeichnen; die traditionelle Haupttextform wird beibehalten und die Alternative vermerkt.
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: seine Nägel wie Vogelkrallen wurden
  rationale: טפר bezeichnet Nägel oder Krallen. Im Vergleich mit Vögeln vermittelt „Vogelkrallen“ das gemeinte Bild im Deutschen klar.
theological_decisions:
- issue: Bedeutungsumfang von אֲנָשָׁא
  choice: Menschen
  alternative: Menschheit; Leute; Männer
  rationale: Gemeint ist die menschliche Gesellschaft im Gegensatz zu Nebukadnezars tiergleichem Zustand, nicht ausschließlich eine Gruppe männlicher Personen.
- issue: Charakter des angekündigten מִלְּתָא
  choice: Wort
  alternative: Urteilsspruch; Beschluss; Sache
  rationale: „Wort“ lässt die Mehrdeutigkeit des aramäischen Ausdrucks bestehen und verweist zugleich auf die zuvor ausgesprochene göttliche Ankündigung, ohne deren gerichtlichen Charakter zu leugnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge bleibt nah am aramäischen Erzählstil, wird jedoch durch deutsche Zeichensetzung und idiomatische Wortwahl geglättet.
