id: DAN.4.21
reference: Daniel 4:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּנָ֥ה פִשְׁרָ֖/א מַלְכָּ֑/א וּ/גְזֵרַ֤ת עלי/א הִ֔יא דִּ֥י מְטָ֖ת עַל מרא/י מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/021.yaml
  text: 'This is the interpretation[a], O king, and it is a decree of the Most High that has come upon my lord the king:'
translation:
  language: de
  text: 'Dies ist die Deutung, König, und es ist ein Beschluss des Höchsten[a], der über meinen Herrn, den König, ergangen ist:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Allerhöchsten“. Der aramäische Titel bezeichnet Gott als den, der über allen Herrschern steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Dies ist
  rationale: Das Demonstrativpronomen leitet Daniels Erklärung ein; im Deutschen wird die Kopula ausdrücklich ergänzt.
- source_word: פִשְׁרָא
  choice: die Deutung
  rationale: Der aramäische Ausdruck bezeichnet im Zusammenhang die Deutung eines Traums; „Deutung“ ist im modernen Deutschen präzise und natürlich.
- source_word: מַלְכָּא
  choice: König
  rationale: Die erste Verwendung ist eine direkte Anrede. Der Verzicht auf „o“ bewahrt die Würde, klingt aber gegenwärtiger.
- source_word: וּגְזֵרַת
  choice: und es ist ein Beschluss
  rationale: Der Ausdruck bezeichnet eine verbindliche Entscheidung oder Verfügung. „Beschluss“ gibt den königlich-göttlichen Urteilskontext wieder, ohne zusätzliche Härte einzutragen.
- source_word: עִלָּיָא
  choice: des Höchsten
  rationale: Der etablierte deutsche Gottesname bringt Gottes Vorrang über alle irdischen Herrscher zum Ausdruck.
- source_word: דִּי
  choice: der
  rationale: Das Relativpronomen leitet den Satz ein, der den Beschluss näher bestimmt.
- source_word: מְטָת עַל
  choice: über … ergangen ist
  rationale: Diese deutsche Wendung gibt das Eintreffen beziehungsweise Wirksamwerden eines richterlichen Beschlusses über einer Person idiomatisch und feierlich wieder.
- source_word: מָרִי מַלְכָּא
  choice: meinen Herrn, den König
  rationale: Die Formulierung bewahrt Daniels respektvolle höfische Anrede; „den König“ steht erklärend zu „meinen Herrn“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens עִלָּיָא
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „Der Höchste“ entspricht dem aramäischen Titel unmittelbar und betont Gottes höchste Stellung, ohne eine zusätzliche Steigerungsform einzutragen.
- issue: Charakter von גְזֵרַת
  choice: Beschluss
  alternative: Urteilsspruch
  rationale: „Beschluss“ lässt offen, ob der Schwerpunkt auf Verfügung, Entscheidung oder Gerichtsurteil liegt, und bewahrt damit die Bedeutungsbreite des aramäischen Wortes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischem Ton. Die direkte Anrede „König“ bleibt knapp; „über … ergangen“ trägt dem feierlichen Gerichts- und Herrschaftskontext Rechnung.
