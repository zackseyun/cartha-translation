  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: de
  text: Ich, Nebukadnezar, war in meinem Haus in Ruhe[a] und in meinem Palast blühend[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sicher“. Das aramäische Wort kann Ruhe, Ungestörtheit oder Sicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gedeihend“ oder „wohlhabend“. Das Wort bezeichnet Frische, Lebenskraft und gedeihliches Wohlergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: Ich
  rationale: Das selbstständige Personalpronomen eröffnet die Aussage und steht appositionell vor dem Eigennamen; im Deutschen genügt das natürliche „Ich“.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nebukadnezar
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: שְׁלֵה
  choice: unbesorgt
  rationale: Das aramäische Adjektiv bezeichnet einen Zustand der Ruhe, Ungestörtheit oder Sicherheit. „Unbesorgt“ ist natürliches modernes Deutsch und legt materiellen Wohlstand nicht vorschnell fest.
- source_word: הֲוֵית
  choice: lebte
  rationale: Die Form dient hier dazu, Nebukadnezars damaligen Zustand auszudrücken. Zusammen mit „unbesorgt“ gibt „lebte“ die durative Aussage im Deutschen idiomatisch wieder.
- source_word: בְּבֵיתִי
  choice: in meinem Haus
  rationale: Die konkrete Ortsangabe und der Parallelismus mit „in meinem Palast“ bleiben erhalten.
- source_word: וְרַעְנַן
  choice: und gedieh
  rationale: Das Adjektiv vermittelt Frische, Lebenskraft und gutes Ergehen. Die verbale Wiedergabe „gedieh“ klingt im Deutschen natürlich und bewahrt das Bild kräftigen Wohlergehens.
- source_word: בְּהֵיכְלִי
  choice: in meinem Palast
  rationale: הֵיכַל kann Palast, Tempel oder große Halle bezeichnen; beim sprechenden König ist „Palast“ kontextuell sachgerecht und vermeidet einen kultischen Fehlsinn.
theological_decisions: []
