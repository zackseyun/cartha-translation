id: DAN.4.31
reference: Daniel 4:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: de
  text: Als die bestimmte Zeit vorüber war, erhob ich, Nebukadnezar, meine Augen zum Himmel, und mein Verstand kehrte zu mir zurück.[a] Da pries ich den Höchsten; ich lobte und ehrte den, der ewig lebt. Denn seine Herrschaft ist eine ewige Herrschaft, und sein Reich besteht von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Einsicht kehrte zu mir zurück“. Das aramäische Wort kann Erkenntnis, Einsicht oder Verstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: Als die bestimmte Zeit vorüber war
  rationale: Die aramäische Wendung bezeichnet hier den Ablauf der zuvor festgesetzten Frist. Diese Wiedergabe vermittelt den idiomatischen Sinn natürlicher als das missverständliche wörtliche „am Ende der Tage“.
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: erhob ich ... meine Augen zum Himmel
  rationale: Bewahrt das körperliche Bild und zugleich die angedeutete Hinwendung zu Gott.
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: mein Verstand kehrte zu mir zurück
  rationale: מַנְדַּע kann Erkenntnis, Einsicht oder Verstand bezeichnen; im Erzählzusammenhang geht es um die Wiederherstellung der geistigen Klarheit. Die Fußnote hält die lexikalische Spannweite offen.
- source_word: לעליא
  choice: den Höchsten
  rationale: Die im Deutschen etablierte und sachlich genaue Wiedergabe des göttlichen Hoheitstitels.
- source_word: בָּרְכֵת
  choice: pries ich
  rationale: Im doxologischen Zusammenhang gibt „preisen“ das Segnen Gottes idiomatisch wieder; die folgenden Verben werden mit „lobte und ehrte“ davon unterschieden.
- source_word: לְחַי עָלְמָא
  choice: den, der ewig lebt
  rationale: Gibt die persönliche Bezeichnung Gottes als des auf ewig Lebenden klar und natürlich wieder.
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: lobte und ehrte
  rationale: Bewahrt die beiden verwandten, aber unterscheidbaren Handlungen, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: seine Herrschaft ist eine ewige Herrschaft
  rationale: Erhält die emphatische Wiederholung des aramäischen Nomens und den königlich-politischen Wortschatz Daniels.
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: sein Reich besteht von Generation zu Generation
  rationale: Die verblosen Worte bezeichnen den Fortbestand des Reiches durch die aufeinanderfolgenden Generationen; „besteht“ macht diesen im Kontext liegenden Sinn im Deutschen verständlich.
theological_decisions:
- issue: Persönliche Bezeichnung Gottes in Nebukadnezars Lobpreis
  choice: ich lobte und ehrte den, der ewig lebt
  alternative: ich lobte und ehrte ihn, der ewig lebt
  rationale: Die substantivierte Formulierung ist natürliches Deutsch und bewahrt den persönlichen, doxologischen Bezug auf Gott, ohne eine zusätzliche Deutung einzutragen.
- issue: Art der wiederhergestellten geistigen Fähigkeit
  choice: mein Verstand kehrte zu mir zurück
  alternative: meine Einsicht kehrte zu mir zurück
  rationale: Der Kontext legt die Rückkehr geistiger Klarheit nahe, doch der aramäische Begriff ist weiter. Deshalb wird die mögliche Wiedergabe „Einsicht“ in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers folgt dem aramäischen Satzgang, gliedert die lange Aussage jedoch behutsam für gute Lesbarkeit. Keine konfessionell geprägte Terminologie wurde hinzugefügt.
