source:
  edition: WLC
  text: בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶֽ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֤ל שְׁמַיָּ/א֙ יִצְטַבַּ֔ע וְ/עִם חֵיוְתָ֥/א חֲלָקֵ֖/הּ בַּ/עֲשַׂ֥ב אַרְעָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: de
  text: Doch lasst den Wurzelstock in der Erde zurück, mit einer Fessel[a] aus Eisen und Bronze, im Gras des Feldes. Er soll vom Tau des Himmels durchnässt werden, und sein Anteil soll bei den Tieren sein, im Gras der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Band aus Eisen und Bronze“. Das aramäische Wort kann eine Bindung oder eine Fessel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Doch
  rationale: Die adversative Partikel markiert die Ausnahme vom vorausgehenden Befehl, den Baum zu fällen. „Doch“ ist im Deutschen knapp, würdig und natürlich.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: den Wurzelstock
  rationale: Die Wendung bezeichnet den im Boden verbleibenden, verwurzelten unteren Teil des gefällten Baumes. „Wurzelstock“ gibt dies im Deutschen präzise und idiomatisch wieder.
- source_word: בְּאַרְעָא
  choice: in der Erde
  rationale: Gemeint ist hier örtlich der Boden, in dem der Wurzelstock verbleibt. „In der Erde“ bewahrt zugleich die konkrete Bildsprache.
- source_word: שְׁבֻקוּ
  choice: lasst … zurück
  rationale: Der aramäische Pluralimperativ ist als direkte Aufforderung wiedergegeben. Die trennbare deutsche Verbform klingt in diesem Zusammenhang natürlich.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: mit einer Fessel aus Eisen und Bronze
  rationale: אֱסוּר bezeichnet eine Bindung oder Beschränkung. „Fessel“ erhält die mögliche Vorausdeutung auf den Menschen, ohne die konkrete Vorstellung einer Umschließung auszuschließen; „Bronze“ entspricht der antiken Metallbezeichnung besser als „Messing“.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: im Gras des Feldes
  rationale: Die Wendung bezeichnet den Bewuchs des offenen Feldes. Die knappe Wiedergabe erhält das ländliche Bild und die Verbindung zum später genannten Gras.
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: Er soll vom Tau des Himmels durchnässt werden
  rationale: „Durchnässt werden“ gibt die intensive passive beziehungsweise reflexive Verbform anschaulich wieder. Das Personalpronomen bewahrt den auffälligen Übergang vom Baum zum dargestellten Menschen.
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: sein Anteil soll bei den Tieren sein
  rationale: חֲלָק bezeichnet Anteil, Teil oder Los. „Anteil“ wahrt den formellen Klang des Erlasses; „Tiere“ ist im heutigen Standarddeutsch unmarkiert und umfasst hier die Tiere des Feldes.
- source_word: בַּעֲשַׂב אַרְעָא
  choice: im Gras der Erde
  rationale: Die weitgehend formale Wiedergabe bewahrt die Wiederholung der Gras-Metaphorik und unterscheidet אַרְעָא („Erde/Land“) vom zuvor genannten בָרָא („Feld/offenes Land“).
theological_decisions:
- issue: Übergang vom Baumbild zur bezeichneten Person
  choice: Der Wechsel wird mit „Er“ und „sein Anteil“ ausdrücklich beibehalten.
  alternative: Das Baumbild durchgehend unpersönlich mit „es“ fortführen.
  rationale: Der aramäische Text wechselt bewusst von der Baumsymbolik zum männlichen persönlichen Bezug. Die Übersetzung erhält diese Spannung, ohne den König an dieser Stelle erklärend in den Text einzusetzen.
- issue: Bedeutung der eisernen und bronzenen Bindung
  choice: „Fessel“ bleibt offen für eine tatsächliche Umschließung des Wurzelstocks und für das vorausgedeutete Gebundensein des Menschen.
  alternative: „Band“ würde die konkrete Baumvorstellung stärker betonen; „Kette“ würde eine bestimmte Art der Fesselung festlegen.
  rationale: Der aramäische Ausdruck bezeichnet allgemein eine Bindung oder Beschränkung. Eine mehrdeutige Wiedergabe vermeidet es, die Bild- und Sachebene vorschnell voneinander zu trennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener Erlassstruktur. Die ungewöhnliche Bewegung vom Wurzelstock zu „Er“ ist bewusst nicht geglättet. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, den die Fußnote erläutert.
