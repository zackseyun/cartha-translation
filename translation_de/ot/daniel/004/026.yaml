  text: לִ/קְצָ֥ת יַרְחִ֖ין תְּרֵֽי עֲשַׂ֑ר עַל הֵיכַ֧ל מַלְכוּתָ֛/א דִּ֥י בָבֶ֖ל מְהַלֵּ֥ךְ הֲוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/026.yaml
  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
translation:
  language: de
  text: Am Ende von zwölf Monaten ging er auf dem königlichen Palast in Babylon[a] umher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Palast des Königreichs von Babylon“. Gemeint sein kann das Dach oder ein oberer Bereich des Palastes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/קְצָת
  choice: Nach Ablauf von
  rationale: Die Zeitangabe bezeichnet das Ende eines Zeitraums. „Nach Ablauf von“ ist im Deutschen natürlich und gibt den zeitlichen Abschluss präzise wieder.
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: zwölf Monaten
  rationale: יַרְחִין bedeutet ausdrücklich „Monate“. Eine Wiedergabe mit „einem Jahr“ wäre eine unnötige Zusammenfassung.
- source_word: עַל הֵיכַל
  choice: auf dem Dach des … Palastes
  rationale: עַל bedeutet „auf“, und הֵיכַל bezeichnet hier im königlichen Zusammenhang einen Palast. Das Dach beziehungsweise der obere Palastbereich ist im Kontext als Ort des Umhergehens naheliegend, wird aber durch eine Fußnote als erschließende Wiedergabe kenntlich gemacht.
- source_word: מַלְכוּתָא דִּי בָבֶל
  choice: Königspalastes von Babylon
  rationale: Wörtlich steht „des Königreichs Babylon“. Im Zusammenhang bestimmt die Wendung den Palast als königlichen Palast Babylons; die natürliche deutsche Formulierung wird gewählt, während die wörtliche Struktur in der Fußnote erhalten bleibt.
- source_word: מְהַלֵּךְ הֲוָה
  choice: ging er … umher
  rationale: Partizip und הֲוָה drücken eine andauernde Handlung in der Vergangenheit aus. „ging … umher“ bildet diese durative Bedeutung idiomatisch ab.
