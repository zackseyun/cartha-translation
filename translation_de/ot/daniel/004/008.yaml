base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/008.yaml
  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
translation:
  language: de
  text: Der Baum wurde groß und stark, seine Höhe reichte bis an den Himmel, und er war bis ans Ende der ganzen Erde sichtbar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sein Anblick reichte bis ans Ende der ganzen Erde“. Das aramäische Substantiv kann sowohl das Aussehen beziehungsweise die Erscheinung als auch das Gesehenwerden bezeichnen; im Zusammenhang liegt die Bedeutung „sichtbar“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה אִילָנָא וּתְקִף
  choice: Der Baum wurde groß und stark
  rationale: רְבָה und תְקִף beschreiben die zunehmende Größe und Stärke des im Traum gesehenen Baumes. Die koordinierte deutsche Formulierung ist natürlich und bewahrt den Entwicklungsgedanken.
- source_word: וְרוּמֵהּ
  choice: seine Höhe
  rationale: Das Substantiv bezeichnet die Höhe beziehungsweise Erhebung des Baumes; „seine Höhe“ ist die direkte und idiomatische Wiedergabe.
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: reichte bis an den Himmel
  rationale: Das Verb bedeutet „erreichen, gelangen“. „Bis an den Himmel reichen“ gibt die hoch aufragende Bildsprache im natürlichen Deutschen wieder; der aramäische Plural שְׁמַיָּא wird im Deutschen idiomatisch mit dem Kollektivsingular „Himmel“ ausgedrückt.
- source_word: וַחֲזוֹתֵהּ
  choice: er war … sichtbar
  rationale: חֲזוֹת kann sowohl „Aussehen/Erscheinung“ als auch das Gesehenwerden bezeichnen. Im Zusammenhang mit der Ausdehnung „bis ans Ende der ganzen Erde“ ist Sichtbarkeit die wahrscheinlichere Bedeutung.
- source_word: לְסוֹף כָּל אַרְעָא
  choice: bis ans Ende der ganzen Erde
  rationale: Die Wendung bezeichnet die äußerste Ausdehnung der Erde beziehungsweise des Landes. Die umfassende Traumvision spricht hier für „die ganze Erde“.
