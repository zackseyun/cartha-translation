id: DAN.4.4
reference: Daniel 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: de
  text: Da kamen die Magier, Beschwörer, Chaldäer[a] und Wahrsager herein. Ich trug ihnen den Traum vor, doch sie gaben mir seine Deutung nicht bekannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Chaldäer“ kann hier nicht nur eine Volksgruppe, sondern auch eine Gruppe babylonischer Hofgelehrter bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Doch sie konnten mir seine Deutung nicht bekannt geben.“ Im Aramäischen heißt es unmittelbar, dass sie die Deutung nicht bekannt gaben; ihre Unfähigkeit dazu ergibt sich möglicherweise aus dem Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet den nächsten Vorgang ein. „Da“ gibt die zeitliche Abfolge im Deutschen natürlich und knapp wieder.
- source_word: עללין
  choice: kamen … herein
  rationale: Das Verb bezeichnet das Eintreten beziehungsweise Hereinkommen; die Formulierung passt natürlich zur höfischen Szene.
- source_word: חַרְטֻמַיָּא
  choice: Magier
  rationale: Bezeichnet eine Gruppe babylonischer Hofgelehrter, die mit Geheimwissen und mantischen Künsten verbunden war. „Magier“ ist verständlich und vermeidet die moderne Assoziation eines bloßen Unterhaltungskünstlers, die „Zauberer“ wecken könnte.
- source_word: אָשְׁפַיָּא
  choice: Beschwörer
  rationale: Der Ausdruck bezeichnet eine weitere Gruppe von Spezialisten für magisch-mantische Praktiken und bleibt von den übrigen Gruppen der Aufzählung unterscheidbar.
- source_word: כַּשְׂדָּיָא
  choice: Chaldäer
  rationale: Die direkte Bezeichnung des Ausgangstextes bleibt erhalten. Im höfischen Zusammenhang kann sie zugleich eine Berufsgruppe babylonischer Gelehrter bezeichnen; dies wird in einer Fußnote erläutert.
- source_word: גָזְרַיָּא
  choice: Wahrsager
  rationale: Im Kontext sind Praktiker der Weissagung beziehungsweise Deutung gemeint. „Wahrsager“ ist im modernen Deutsch klar und treffend.
- source_word: חֶלְמָא
  choice: den Traum
  rationale: Die bestimmte Form verweist auf Nebukadnezars konkreten Traum.
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: Ich trug ihnen den Traum vor
  rationale: Die Wendung bedeutet wörtlich, den Traum vor ihnen auszusprechen. „Vortragen“ bewahrt den Gedanken der Darlegung in ihrer Gegenwart und klingt zugleich natürlich.
- source_word: וּפִשְׁרֵהּ
  choice: seine Deutung
  rationale: Das Substantiv bezeichnet in Daniel regelmäßig die Deutung eines Traums oder Geheimnisses. „Deutung“ ist idiomatischer als „Interpretation“ und bewahrt den fachlichen Sinn.
- source_word: לָא מְהוֹדְעִין לִי
  choice: sie gaben mir seine Deutung nicht bekannt
  rationale: Die Kausativform bedeutet „bekannt machen“. Die Übersetzung gibt die ausdrücklich ausgesagte Nichtbekanntgabe wieder, ohne eine bloß aus dem Zusammenhang erschlossene Unfähigkeit in den Haupttext einzutragen.
theological_decisions:
- issue: Ob der Schlusssatz Unfähigkeit oder lediglich die ausbleibende Bekanntgabe ausdrückt
  choice: sie gaben mir seine Deutung nicht bekannt
  alternative: sie konnten mir seine Deutung nicht bekannt geben
  rationale: Der aramäische Text verneint unmittelbar das Bekanntmachen, nennt aber kein eigenes Modalverb für Unfähigkeit. Eine solche Unfähigkeit kann der Zusammenhang nahelegen, wird jedoch nicht stillschweigend in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung der höfischen Fachgruppen bleibt differenziert; „vortragen“ gibt die öffentliche Darlegung des Traums idiomatisch wieder. Die Fußnotenmarker wurden den sachlich zugehörigen Stellen zugeordnet.
