  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר הֲ/לָ֥א דָא הִ֖יא בָּבֶ֣ל רַבְּתָ֑/א דִּֽי אֲנָ֤ה בֱנַיְתַ/הּ֙ לְ/בֵ֣ית מַלְכ֔וּ בִּ/תְקַ֥ף חִסְנִ֖/י וְ/לִ/יקָ֥ר הַדְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: de
  text: 'Der König antwortete und sagte: „Ist das nicht das große Babylon[a], das ich selbst zum Königssitz[b] erbaut habe – durch die Stärke meiner Macht und zum Ruhm meiner Majestät?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylon die Große“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „zu einem Haus des Königtums“; auch: „zur königlichen Residenz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: ergriff das Wort und sagte
  rationale: Die aramäische Erzählformel enthält zwei Verben. Diese deutsche Wendung bewahrt beide, ohne unnatürlich zu klingen.
- source_word: הֲלָא
  choice: Ist das nicht
  rationale: Die Formulierung erhält die rhetorische Frage, die Zustimmung erwartet, statt sie in eine Aussage umzudeuten.
- source_word: בָּבֶל רַבְּתָא
  choice: das große Babylon
  rationale: Die beschreibende Verbindung aus Ortsname und nachgestelltem Adjektiv wird in natürlichem Deutsch wiedergegeben; der prahlerische Nachdruck bleibt erhalten.
- source_word: אֲנָה
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen betont den König als vermeintlichen Urheber, ohne die Ausschließlichkeit von „ich allein“ einzutragen.
- source_word: לְבֵית מַלְכוּ
  choice: zum Königssitz
  rationale: Die Wendung bedeutet wörtlich etwa „zu einem Haus des Königtums“. „Königssitz“ bezeichnet Babylon verständlich als Zentrum königlicher Herrschaft, ohne den Sinn auf einen einzelnen Palast zu verengen.
- source_word: בִּתְקַף חִסְנִי
  choice: durch die Stärke meiner Macht
  rationale: Die absichtsvoll gesteigerte und leicht redundante Ausdrucksweise des königlichen Prahlens wird bewahrt.
- source_word: וְלִיקָר הַדְרִי
  choice: und zur Ehre meiner Herrlichkeit
  rationale: Die beiden Begriffe für Ehre beziehungsweise Herrlichkeit oder Pracht bleiben unterscheidbar und geben die Selbstverherrlichung des Königs wieder.
theological_decisions:
- issue: Charakter von Nebukadnezars Aussage über Babylon
  choice: das große Babylon
  alternative: Babylon, die Große
  rationale: Der Ausdruck ist zunächst eine emphatische Beschreibung und muss nicht als feststehender Titel verstanden werden. Die Alternative hält die mögliche titelartige Lesart offen.
- issue: Bedeutungsumfang von בֵית מַלְכוּ
  choice: zum Königssitz
  alternative: zu einem Haus des Königtums
  rationale: Die gewählte Fassung bezeichnet die Stadt als Zentrum der Königsherrschaft. Die wörtlichere Alternative ist möglich, im heutigen Deutsch jedoch schwer verständlich und könnte fälschlich nur an ein Gebäude denken lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die beiden prahlerischen Zweck- und Mittelangaben hervor. Die gesteigerte Sprache bleibt bewusst erhalten, wird aber nicht künstlich archaisiert.
