    rationale: „Zur Ehre meiner Herrlichkeit“ ist im Deutschen semantisch schwerfällig und vermischt die Funktionen der beiden Begriffe. „Zum Ruhm meiner Majestät“ ist natürlich und gibt לִיקָר als Ruhm/Ehre sowie הַדְרִי als Majestät wieder.
