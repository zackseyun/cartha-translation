source:
  edition: WLC
  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: de
  text: Beltschazar[a], Oberster der Magier, ich weiß, dass der Geist der heiligen Götter in dir ist und dass kein Geheimnis dir zu schwer ist. Erzähle mir die Visionen meines Traums, die ich gesehen habe, und seine Deutung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Geist des heiligen Gottes“; auch möglich: „ein Geist der heiligen Götter“.'
    reason: Die aramäische Wendung kann trotz ihrer pluralischen Form unterschiedlich verstanden werden; die Hauptübersetzung folgt der im Kontext naheliegenden pluralischen Lesart.
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  choice: Oberster der Magier
  rationale: רַב bezeichnet den Obersten bzw. Leiter; חַרְטֻמַיָּא benennt in Daniel eine Gruppe babylonischer Hofgelehrter, die im Deutschen herkömmlich und verständlich als „Magier“ bezeichnet wird.
- source_word: ר֣וּחַ אֱלָהִין קַדִּישִׁין
  choice: der Geist der heiligen Götter
  rationale: Die Pluralform אֱלָהִין mit dem pluralischen Adjektiv קַדִּישִׁין legt im Mund Nebukadnezars die Wiedergabe „heilige Götter“ nahe. „Geist“ bleibt großgeschrieben, ohne damit die alternative singularische Deutung auszuschließen.
- source_word: וְכָל רָז
  choice: und dass kein Geheimnis
  rationale: רָז bezeichnet in Daniel regelmäßig ein verborgenes, der Deutung bedürftiges Geheimnis. Die verneinte Aussage wird im Deutschen natürlich mit „kein Geheimnis“ wiedergegeben.
- source_word: לָא אָנֵס לָךְ
  choice: zu schwierig für dich ist
  rationale: Die Wendung besagt im Kontext, dass kein Geheimnis Daniels Fähigkeit zur Deutung übersteigt.
- source_word: חֶזְוֵי חֶלְמִי
  choice: die Visionen meines Traums
  rationale: Der Plural חֶזְוֵי wird bewahrt und bezeichnet die im Traum gesehenen visionären Inhalte, statt pauschal nur „meinen Traum“ zu sagen.
- source_word: דִי חֲזֵית
  choice: den ich hatte
  rationale: Wörtlich steht „den ich sah“. Im modernen Deutschen ist „einen Traum haben“ idiomatischer; der Gedanke des Sehens ist bereits in „Visionen“ enthalten.
- source_word: וּפִשְׁרֵהּ
  choice: und seine Deutung
  rationale: פִּשְׁרֵהּ ist Daniels geläufiger Ausdruck für die Deutung eines Traums oder Geheimnisses. Das Suffix bezieht sich grammatisch am ehesten auf den Traum.
- source_word: אֱמַר
  choice: Sage mir
  rationale: Der Imperativ fordert Daniel auf, die Visionen und ihre Deutung mitzuteilen. „Sage mir“ ist direkt, würdig und natürlich.
theological_decisions:
- issue: Ist רוּחַ אֱלָהִין קַדִּישִׁין pluralisch als heidnische Rede oder singularisch als Bezug auf den heiligen Gott zu verstehen?
  choice: der Geist der heiligen Götter
  alternative: der Geist des heiligen Gottes; ein Geist der heiligen Götter
  rationale: Die Pluralmorphologie von אֱלָהִין und קַדִּישִׁין sowie Nebukadnezars Sprecherperspektive stützen die pluralische Hauptlesart. Da אֱלָהִין in bestimmten Zusammenhängen auch auf den einen Gott bezogen werden kann, wird die singularische Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird durch einen eigenen Ausruf gegliedert, damit der lange aramäische Satz im Deutschen klar bleibt. „Beltschazar“ folgt der etablierten deutschen Namensform; „Magier“ ist verständlicher und kontextnäher als fachsprachliche Alternativen.
