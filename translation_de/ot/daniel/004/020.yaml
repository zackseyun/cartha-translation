id: DAN.4.20
reference: Daniel 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: de
  text: 'Und dass der König einen Wächter[a], einen Heiligen, vom Himmel herabkommen und sagen sah: »Fällt den Baum und vernichtet ihn! Doch lasst den Wurzelstock in der Erde, mit einer Fessel aus Eisen und Bronze, im Gras des Feldes. Er soll vom Tau des Himmels durchnässt werden, und sein Los soll bei den Tieren des Feldes sein, bis sieben Zeiten[b] über ihn vergangen sind« —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen wachsamen Hüter«; das aramäische Wort bezeichnet ein himmlisches Wesen, das durch sein Wachen charakterisiert ist.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »sieben Zeiten« sind sieben Zeitabschnitte gemeint; ihre genaue Dauer wird hier nicht angegeben.
    reason: source_ambiguity
lexical_decisions:
- source_word: עִיר
  choice: Wächter
  rationale: Das aramäische Wort bezeichnet hier ein himmlisches Wesen, das als wachend charakterisiert wird. »Wächter« bewahrt die Eigenbezeichnung, ohne das Wesen näher als Engel oder Mitglied eines himmlischen Rates einzuordnen.
- source_word: וְקַדִּישׁ
  choice: einen Heiligen
  rationale: Die zweite Bezeichnung steht appositionell zu »einen Wächter« und beschreibt dieselbe himmlische Gestalt.
- source_word: נָחִת מִן שְׁמַיָּא
  choice: vom Himmel herabkommen
  rationale: Die Infinitivkonstruktion nach »sah« gibt den wahrgenommenen Vorgang in natürlichem Deutsch wieder.
- source_word: גֹּדּוּ
  choice: Fällt
  rationale: Der Imperativ Plural fordert mehrere nicht näher bezeichnete Handelnde dazu auf, den Baum zu Fall zu bringen.
- source_word: וְחַבְּלוּהִי
  choice: vernichtet ihn
  rationale: Das Verb bezeichnet schwere Beschädigung oder Zerstörung; »vernichten« gibt die Stärke des Befehls wieder.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: den Wurzelstock
  rationale: Gemeint ist der verwurzelte, nach dem Fällen verbleibende Stock. »Wurzelstock« ist prägnant und sachlich treffend.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: mit einer Fessel aus Eisen und Bronze
  rationale: אֱסוּר kann ein Band oder eine Fessel bezeichnen. »Fessel« erhält die mögliche Vorstellung des Gebundenseins; נְחָשׁ bezeichnet im Metallkontext Bronze beziehungsweise Kupfer.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: im Gras des Feldes
  rationale: Die Wendung bezeichnet die Vegetation des offenen Feldes und lässt sich so klar und knapp wiedergeben.
- source_word: יִצְטַבַּע
  choice: soll ... durchnässt werden
  rationale: Die passive Verbform bezeichnet ein starkes Benetzt- oder Durchtränktwerden.
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: sein Los soll bei den Tieren des Feldes sein
  rationale: חֲלָק bezeichnet Anteil, Teil oder Los. »Los« ist in diesem Zusammenhang idiomatisch und bewahrt den übertragenen Sinn.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sieben Zeiten
  rationale: Der Text nennt sieben Zeitabschnitte, legt aber ihre genaue Dauer beziehungsweise Einheit nicht ausdrücklich fest.
theological_decisions:
- issue: Identität des »Wächters, eines Heiligen«
  choice: Die aramäischen Bezeichnungen werden beibehalten, ohne eine genauere himmlische Rangordnung festzulegen.
  alternative: Engel; Mitglied des himmlischen Rates
  rationale: Der Ausgangstext bestimmt die Gestalt nur durch diese beiden Bezeichnungen. Eine präzisere Einordnung würde mehr sagen als der Text.
- issue: Wechsel vom Baum zu einer Person
  choice: Das maskuline Pronomen wird mit »er/ihn/sein« sichtbar wiedergegeben.
  alternative: Durchgehend sachlich auf den Baum beziehungsweise Wurzelstock beziehen
  rationale: Der aramäische Text wechselt zu maskulinen Suffixen und bereitet damit die Deutung des Baumes als König vor; diese Spannung soll erhalten bleiben.
- issue: Dauer der sieben Zeiten
  choice: »sieben Zeiten« ohne Festlegung einer konkreten Zeiteinheit
  alternative: sieben Jahre
  rationale: עִדָּנִין bezeichnet Zeitabschnitte, nennt hier jedoch nicht ausdrücklich Jahre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange aramäische Satzperiode bleibt erkennbar, wird innerhalb der direkten Rede jedoch durch klare deutsche Zeichensetzung gegliedert. Der Wechsel vom grammatisch sächlichen Baum zum männlichen Bezug wird bewusst bewahrt.
