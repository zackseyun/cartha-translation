id: DAN.4.14
reference: Daniel 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: de
  text: Der Spruch ergeht durch den Beschluss der Wächter[a], und die Forderung ergeht durch das Wort der Heiligen[b], damit die Lebenden erkennen, dass der Höchste über das Reich der Menschen herrscht[c], es gibt, wem er will, und den Niedrigsten unter den Menschen darüber einsetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wächter“ ist die wörtliche Wiedergabe eines besonderen Ausdrucks im Buch Daniel für himmlische Wesen; häufig werden sie als Engel verstanden.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Bitte“ oder „Gesuch“. Das aramäische Wort שְׁאֵלְתָא kann „Forderung“, „Bitte“ oder „Gesuch“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „im Reich der Menschen herrscht“; sinngemäß auch: „die Herrschaft über das Reich der Menschen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְזֵרַת
  choice: auf Beschluss
  rationale: Die Wendung bewahrt den förmlichen, rechtlichen Sinn von גְזֵרָה und gibt das aramäische בְּ in natürlichem Deutsch als Grundlage bzw. Veranlassung des Spruchs wieder.
- source_word: עִירִין
  choice: Wächter
  rationale: Die wörtliche Wiedergabe erhält den besonderen danielischen Ausdruck für himmlische Wesen, ohne ihn deutend mit „Engel“ gleichzusetzen.
- source_word: פִּתְגָמָא
  choice: Spruch
  rationale: Im Zusammenhang bezeichnet das Wort einen verkündeten, verbindlichen Ausspruch. „Spruch“ wahrt sowohl den rechtlichen Klang als auch die knappe, feierliche Form.
- source_word: וּמֵאמַר קַדִּישִׁין
  choice: auf das Wort der Heiligen hin
  rationale: מֵאמַר bezeichnet hier das maßgebliche Wort bzw. die Äußerung der Heiligen. Die Formulierung bildet eine natürliche deutsche Parallele zu „auf Beschluss der Wächter“.
- source_word: שְׁאֵלְתָא
  choice: Forderung
  rationale: Das Nomen kann „Bitte“, „Gesuch“ oder „Forderung“ bedeuten. „Forderung“ passt zur Autorität der himmlischen Gerichtsszene, während die echte lexikalische Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: עַד דִּבְרַת דִּי
  choice: damit
  rationale: Die Konstruktion führt Zweck oder Ergebnis ein; „damit“ ist im modernen Deutsch klar und idiomatisch.
- source_word: חַיַּיָּא
  choice: die Lebenden
  rationale: Die substantivierte Form bewahrt den umfassenden und knappen Ausdruck des Aramäischen.
- source_word: שַׁלִּיט עִלָּיָא
  choice: der Höchste … herrscht
  rationale: עִלָּיָא wird als Gottesbezeichnung „der Höchste“ wiedergegeben; שַׁלִּיט bezeichnet seine tatsächliche Herrschaftsgewalt.
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: über das Reich der Menschen
  rationale: „Reich der Menschen“ gibt den kollektiven menschlichen Herrschaftsbereich natürlich wieder. Das deutsche Verb „herrschen“ verlangt hier idiomatisch „über“; die formnähere Lesart mit „in“ wird in der Fußnote genannt.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: es gibt, wem er will
  rationale: Die knappe Formulierung bewahrt die uneingeschränkte Freiheit des Höchsten bei der Vergabe des Reiches.
- source_word: וּשְׁפַל אֲנָשִׁים
  choice: den Niedrigsten unter den Menschen
  rationale: 'Der Singular mit dem pluralischen Bezugsbereich ist eine superlativische Wendung: Gemeint ist ein Mensch vom niedrigsten Rang.'
- source_word: יְקִים עֲלַהּ
  choice: darüber einsetzt
  rationale: Die Wiedergabe bezeichnet die Einsetzung in eine Herrschaftsstellung und nimmt mit „darüber“ das zuvor genannte Reich auf.
theological_decisions:
- issue: Identität der „Wächter“ und „Heiligen“
  choice: Die himmlische Gerichtssprache wird als „Wächter“ und „Heilige“ beibehalten.
  alternative: Engel; himmlische Wesen
  rationale: So bleibt die besondere Bild- und Begriffswelt Daniels sichtbar, ohne die beiden Bezeichnungen vorschnell in eine allgemeinere Kategorie aufzulösen.
- issue: Verhältnis des göttlichen Herrschens zum Beschluss der himmlischen Wesen
  choice: Die Wächter und Heiligen werden als Urheber des Spruchs bzw. der Forderung genannt, während der Höchste ausdrücklich als Herrscher und Verleiher des Reiches erscheint.
  alternative: Den Beschluss unmittelbar als alleinigen Beschluss Gottes umformulieren
  rationale: Die Übersetzung bewahrt die im Text stehende Spannung zwischen dem himmlischen Ratsgeschehen und der uneingeschränkten Herrschaft des Höchsten, statt sie systematisch aufzulösen.
- issue: Bedeutung von שְׁאֵלְתָא
  choice: Im Haupttext steht „Forderung“.
  alternative: Bitte; Gesuch; Begehren
  rationale: „Forderung“ entspricht dem autoritativen Kontext, doch die Wortbedeutung ist nicht eindeutig; deshalb werden die zurückhaltenderen Möglichkeiten ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, förmlicher Gerichtssprache. „Wächter“ und „Heilige“ erhalten die eigentümliche himmlische Ratsbildwelt des aramäischen Textes. Die Satzstruktur bleibt eng am Parallelismus des Originals, wird aber durch idiomatische deutsche Präpositionen verständlich gemacht.
