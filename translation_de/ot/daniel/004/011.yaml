  text: קָרֵ֨א בְ/חַ֜יִל וְ/כֵ֣ן אָמַ֗ר גֹּ֤דּוּ אִֽילָנָ/א֙ וְ/קַצִּ֣צוּ עַנְפ֔וֹ/הִי אַתַּ֥רוּ עָפְיֵ֖/הּ וּ/בַדַּ֣רוּ אִנְבֵּ֑/הּ תְּנֻ֤ד חֵֽיוְתָ/א֙ מִן תַּחְתּ֔וֹ/הִי וְ/צִפְּרַיָּ֖/א מִן עַנְפֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: de
  text: 'Er rief mit lauter Stimme und sprach: »Fällt den Baum[a] und schlagt seine Äste ab; streift sein Laub ab und zerstreut seine Früchte! Die Tiere sollen unter ihm wegfliehen[b] und die Vögel von seinen Ästen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Haut den Baum um.«'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist im Aramäischen verkürzt; sinngemäß sollen auch die Vögel von seinen Ästen fliehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: Er rief mit lauter Stimme
  rationale: Die Wendung bezeichnet ein kraftvolles, lautes Rufen; die deutsche Formulierung ist natürlich und bewahrt die Intensität.
- source_word: וְכֵן אָמַר
  choice: und sprach
  rationale: כֵן leitet hier den Inhalt des Rufs ein. Im Deutschen erfüllt der folgende Doppelpunkt diese Funktion, sodass ein zusätzliches „so“ unnötig und steif wäre.
- source_word: גֹּדּוּ אִילָנָא
  choice: Fällt den Baum
  rationale: Das Verb fordert das Niederhauen des bestimmten Baumes. „Fällen“ ist dafür im Deutschen präzise und anschaulich.
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: und schlagt seine Äste ab
  rationale: קצץ bezeichnet das Abtrennen; „Äste abschlagen“ wahrt die kräftige Bildsprache und unterscheidet den Befehl vom Fällen des Baumes.
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: streift sein Laub ab
  rationale: Die Wendung bezeichnet das Entfernen des Blattwerks. „Laub“ gibt die kollektive Bedeutung von עָפְיֵהּ idiomatisch wieder.
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: und zerstreut seine Früchte
  rationale: בדר bedeutet zerstreuen oder auseinanderstreuen; der Plural „Früchte“ ist im Deutschen für den Fruchtbestand eines Baumes natürlich.
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: Die Tiere sollen unter ihm wegfliehen
  rationale: Das Verb bezeichnet das Fortbewegen oder Fliehen. Die Soll-Konstruktion gibt die jussive Kraft wieder, ohne einen ausdrücklichen Imperativ hinzuzufügen.
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: und die Vögel von seinen Ästen
  rationale: Die aramäische Schlussklausel ist elliptisch und übernimmt sinngemäß die Aufforderung zum Fortfliehen aus der vorangehenden Klausel.
theological_decisions:
- issue: Imperativische beziehungsweise jussive Kraft der Verkündigung
  choice: Die Befehle direkt wiedergeben und die elliptische Schlussklausel von der Soll-Aussage abhängig lassen
  alternative: 'In der letzten Klausel das Verb ausdrücklich wiederholen: „und die Vögel sollen von seinen Ästen wegfliegen“'
  rationale: Das Aramäische enthält mehrere Imperative, danach eine jussive Verbform und schließlich eine parallele Klausel ohne eigenes Verb. Die deutsche Fassung bleibt verständlich und bewahrt zugleich die Ellipse des Originals.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftigen Befehle der Vision werden anschaulich wiedergegeben; die aramäische Ellipse am Versende bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
