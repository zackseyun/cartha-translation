  terminology: »Bewohner der Erde«, »gelten wie nichts«, »nach seinem Willen« und »Heer des Himmels« sind angemessen. Der Ausdruck »Heer des Himmels« lässt offen, welche himmlischen Wesen oder Größen umfasst sind, wie es der aramäische Text verlangt.
