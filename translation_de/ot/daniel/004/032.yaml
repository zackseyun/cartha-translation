  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: de
  text: 'Und alle Bewohner der Erde gelten wie nichts. Er handelt nach seinem Willen unter dem Heer des Himmels[a] und unter den Bewohnern der Erde. Niemand kann seiner Hand wehren[b] oder zu ihm sagen: »Was hast du getan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die Heerschar des Himmels«. Der Ausdruck legt nicht fest, ob himmlische Wesen, Gestirne oder die himmlische Gesamtheit gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seine Hand schlagen«. Die Wendung bedeutet, seinem Handeln zu widerstehen, es zu hindern oder zurückzuhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: die Bewohner der Erde
  rationale: Die aramäische Partizipialfügung bezeichnet die auf der Erde Wohnenden. Diese Wiedergabe ist im modernen Deutschen natürlich und bewahrt den universalen Bezug.
- source_word: כְּלָה חֲשִׁיבִין
  choice: gelten wie nichts
  rationale: Die Wendung bezeichnet eine Bewertung oder Anrechnung. »Gelten wie nichts« bewahrt den Vergleich und behauptet nicht, die Erdbewohner existierten nicht.
- source_word: וּכְמִצְבְּיֵהּ
  choice: nach seinem Willen
  rationale: Das Substantiv kann Wille, Wunsch oder Wohlgefallen bezeichnen. Die gewählte Formulierung ist klar, würdig und eng am Sinn des Aramäischen.
- source_word: עָבֵד
  choice: er handelt
  rationale: Das häufige Verb bedeutet tun oder handeln. »Er handelt« klingt hier im Deutschen natürlicher als das isolierte »er tut«.
- source_word: בְּחֵיל שְׁמַיָּא
  choice: im Heer des Himmels
  rationale: חֵיל bezeichnet Kraft, Streitmacht oder Heer. »Heer des Himmels« erhält das militärische Bild, ohne festzulegen, ob Engel, Gestirne oder die himmlische Gesamtheit gemeint sind.
- source_word: וְלָא אִיתַי דִּי
  choice: Niemand kann
  rationale: Die Existenzkonstruktion verneint, dass irgendjemand zu der folgenden Handlung fähig ist. Die knappe deutsche Form gibt diesen Nachdruck idiomatisch wieder.
- source_word: יְמַחֵא בִידֵהּ
  choice: ihm auf die Hand schlagen
  rationale: Die bildhafte Wendung wird im Haupttext nahezu wörtlich bewahrt; im Zusammenhang bedeutet sie, in sein Handeln einzugreifen oder ihn zurückzuhalten.
- source_word: מָה עֲבַדְתְּ
  choice: Was hast du getan?
  rationale: Das Perfekt wird als direkte, rückblickende Anfrage wiedergegeben und erhält die rhetorische Herausforderung des Ausgangstextes.
theological_decisions:
- issue: Bezug der souverän handelnden Person
  choice: Das Pronomen »er« bleibt stehen; der Zusammenhang identifiziert den Höchsten als Handelnden.
  alternative: Den Gottesnamen oder »Gott« ausdrücklich einsetzen.
  rationale: Der aramäische Vers verwendet ein Pronomen. Die Übersetzung lässt den unmittelbaren Kontext den Bezug bestimmen und fügt keine ausdrückliche Bezeichnung hinzu.
- issue: Umfang des Ausdrucks בְּחֵיל שְׁמַיָּא
  choice: »Heer des Himmels« bleibt als umfassender Ausdruck unbestimmt.
  alternative: Den Ausdruck ausdrücklich auf Engel oder auf Himmelskörper beziehen.
  rationale: Der aramäische Ausdruck lässt den genauen Umfang offen. Eine engere Identifikation würde eine echte Mehrdeutigkeit auflösen, die der Text nicht selbst auflöst.
- issue: Bildsprache von יְמַחֵא בִידֵהּ
  choice: Das Bild »ihm auf die Hand schlagen« steht im Haupttext; seine idiomatische Bedeutung wird in einer Fußnote erläutert.
  alternative: Im Haupttext deutend »seine Hand zurückhalten« oder »ihn hindern« schreiben.
  rationale: Die konkrete Bildsprache des Aramäischen wird bewahrt, ohne den verständlichen übertragenen Sinn vorzuenthalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bilden die feierliche Aussage klar ab. »Heer des Himmels« bewahrt die militärische Metapher; »auf die Hand schlagen« erhält das aramäische Bild und wird durch die Fußnote erläutert.
