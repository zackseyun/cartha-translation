  terminology: „Beltschazar“ entspricht der üblichen deutschen Namensform. „Geist der heiligen Götter“ bewahrt die plurale, aus Nebukadnezars Perspektive formulierte Gottesrede, ohne sie theologisch zu harmonisieren. Die Fußnote sollte die tatsächlich relevante singularische Alternative nennen, nicht zusätzlich eine nicht durch den englischen Audit-Vermerk gestützte indefinite Form behaupten.
