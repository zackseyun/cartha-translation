  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: de
  text: 'Schließlich trat Daniel vor mich – dessen Name Beltschazar war, nach dem Namen meines Gottes, und in ihm ist der Geist der heiligen Götter[a] – und ich erzählte ihm den Traum:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Geist des heiligen Gottes“. Das Aramäische lässt unterschiedliche Deutungen zu; in der Rede des Königs liegt jedoch am ehesten seine heidnische Sichtweise nahe: „der Geist der heiligen Götter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: Zuletzt
  rationale: Die aramäische Zeitangabe bezeichnet den abschließenden beziehungsweise verspäteten Eintritt Daniels. „Zuletzt“ ist knapp, natürlich und wahrt den zeitlichen Sinn.
- source_word: עַל קָדָמַי
  choice: trat … vor mich
  rationale: Die Wendung bezeichnet das Kommen vor die anwesende Person. „Vor mich treten“ gibt zugleich die Bewegung und den höfischen Rahmen idiomatisch wieder.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Der Personenname folgt der etablierten deutschen Form.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: er heißt Beltschazar
  rationale: Der Relativsatz nennt Daniels babylonischen Namen. Das historische Präsens „heißt“ entspricht dem aramäischen Nominalsatz und klingt im Deutschen natürlich.
- source_word: כְּשֻׁם אֱלָהִי
  choice: nach dem Namen meines Gottes
  rationale: Die Präposition mit „Name“ drückt die Benennung in Entsprechung zum Namen des Gottes des Königs aus. Die Formulierung bleibt nahe am Aramäischen, ohne den nicht genannten Gottesnamen zu ergänzen.
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: und in ihm ist der Geist der heiligen Götter
  rationale: Die Formulierung bewahrt die Aussageperspektive des babylonischen Königs und die grammatisch plurale Verbindung von „Götter“ und „heilig“. „Geist“ wird nicht als eindeutige Bezeichnung des Heiligen Geistes festgelegt.
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: und ich erzählte ihm den Traum
  rationale: Das Verb bedeutet „sagen/erzählen“, während die Präpositionalform Daniels Gegenwart bezeichnet. Im Deutschen gibt der Dativ „ihm“ den Sinn klar und natürlich wieder.
theological_decisions:
- issue: Deutung von רוּחַ אֱלָהִין קַדִּישִׁין in der Rede Nebukadnezars
  choice: der Geist der heiligen Götter
  alternative: der Geist des heiligen Gottes; ein Geist des heiligen Gottes
  rationale: Das Substantiv אֱלָהִין und das dazugehörige Adjektiv קַדִּישִׁין stehen formal im Plural, und der heidnische König spricht von „meinem Gott“. Daher bleibt die polytheistische Redeweise im Haupttext erhalten. Die sprachlich beziehungsweise kontextuell erwogenen singularischen Deutungen werden in der Fußnote genannt, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich fasst die nähere Bestimmung Daniels übersichtlich ein; der Doppelpunkt wahrt den Übergang zur anschließenden Traumrede. Die Übersetzung bleibt quellennah, vermeidet jedoch unnötig steife Wendungen.
