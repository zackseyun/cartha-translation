base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: de
  text: Sein Laub war schön, und es trug reichlich Frucht. In ihm war Nahrung für alle. Unter ihm fanden die Tiere des Feldes Schatten, in seinen Zweigen wohnten die Vögel des Himmels, und von ihm wurde alles Fleisch[a] ernährt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Lebewesen“. Wörtlich steht im Aramäischen „alles Fleisch“, eine biblische Redeweise für alle belebten Geschöpfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: sein Laub
  rationale: Das aramäische Kollektiv bezeichnet die Blätter beziehungsweise das Laubwerk des Baumes. „Laub“ ist im Deutschen natürlich und quellennah.
- source_word: שַׁפִּיר
  choice: schön
  rationale: Die direkte, allgemein verständliche Wiedergabe bewahrt die positive Beschreibung des Baumes.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: es trug reichlich Frucht
  rationale: Wörtlich ist seine Frucht „groß/viel“. Die verbale deutsche Form gibt den kollektiven Sinn natürlich wieder, ohne die Aussage zu verstärken.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: An ihm war Nahrung für alle
  rationale: „Nahrung“ entspricht dem Gedanken von Speise und Unterhalt; „an ihm“ bezeichnet den Baum als Träger und Quelle dieser Nahrung und ist im Deutschen anschaulicher als „in ihm“.
- source_word: תַּטְלֵל
  choice: fanden … Schatten
  rationale: Das Verb bezeichnet das Verweilen beziehungsweise Schutzfinden im Schatten. Die gewählte Form ist idiomatisch und wahrt das Bild.
- source_word: חֵיוַת בָּרָא
  choice: die Tiere des Feldes
  rationale: Die traditionelle, weiterhin verständliche biblische Wendung bildet den aramäischen Ausdruck genauer ab als das enger deutende „Wildtiere“.
- source_word: בְעַנְפוֹהִי
  choice: in seinen Zweigen
  rationale: „Zweige“ ist eine natürliche Wiedergabe für die Verästelungen des Baumes und passt zum Aufenthalt der Vögel.
- source_word: ידרון
  choice: wohnten
  rationale: Das Verb meint wohnen, sich aufhalten oder lagern. „Wohnten“ wahrt die allgemeine Bedeutung, ohne ausdrücklich Nester vorauszusetzen.
- source_word: כָּל בִּשְׂרָא
  choice: alles Fleisch
  rationale: Die wörtliche biblische Redeweise bleibt erhalten und bewahrt ihre intertextuelle Weite; eine verständlichere Bedeutungsangabe steht in der Fußnote.
- source_word: יִתְּזִין
  choice: ernährte sich
  rationale: Die passive beziehungsweise mediale Verbform beschreibt, dass alle Lebewesen vom Baum Nahrung erhielten. „Ernährte sich“ ist natürlich und erhält den Baum als Quelle.
theological_decisions:
- issue: Wiedergabe der biblischen Redeweise כָּל בִּשְׂרָא
  choice: alles Fleisch
  alternative: alle Lebewesen
  rationale: Die wörtliche Form bewahrt die theologisch und intertextuell bedeutsame biblische Ausdrucksweise, ohne den Bezug nur auf Menschen oder nur auf Tiere einzuengen. Die Fußnote erläutert den umfassenden Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Baum- und Schutzbilder bleiben konkret; altertümliche Formen werden vermieden. Das Tempus folgt der erzählenden Rückschau.
