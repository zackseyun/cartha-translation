source:
  edition: WLC
  text: חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י וַ/אֲלוּ֙ עִ֣יר וְ/קַדִּ֔ישׁ מִן שְׁמַיָּ֖/א נָחִֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
translation:
  language: de
  text: 'Ich schaute in den Visionen meines Kopfes, während ich auf meinem Bett lag, und siehe: ein Wächter[a], ein Heiliger, kam vom Himmel herab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein himmlischer Wächter«. Das Aramäische lautet wörtlich: »ein Wächter, ein Heiliger«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Ich schaute
  rationale: Das Partizip mit dem Verb »sein« bezeichnet ein andauerndes Wahrnehmen in der Vergangenheit. »Ich schaute« gibt diesen Verlauf natürlich wieder, ohne den Satz in eine bloße Einleitung umzudeuten.
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: in den Visionen meines Kopfes
  rationale: Die Wiedergabe bewahrt das konkrete aramäische Idiom und bezeichnet die inneren Traumbilder, ohne es interpretierend zu »in Gedanken« oder »in meinem Geist« zu glätten.
- source_word: עַל מִשְׁכְּבִי
  choice: während ich auf meinem Bett lag
  rationale: Die temporale Formulierung ist modernes, natürliches Deutsch und erhält den Schauplatz der nächtlichen Vision.
- source_word: וַאֲלוּ
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Wendung markiert den plötzlichen Wechsel der Aufmerksamkeit und entspricht dem hervorhebenden aramäischen Ausdruck.
- source_word: עִיר
  choice: ein Wächter
  rationale: Der besondere aramäische Ausdruck bezeichnet wörtlich einen »Wächter« als himmlisches Wesen. Die Übersetzung vermeidet die spezifischere Identifikation als Engel.
- source_word: וְקַדִּישׁ
  choice: ein Heiliger
  rationale: 'Das Adjektiv wird substantivisch und appositionell verstanden: Der Wächter wird zugleich als Heiliger bezeichnet. Die parallele Nominalform bleibt sichtbar.'
- source_word: מִן שְׁמַיָּא
  choice: vom Himmel
  rationale: Obwohl die aramäische Form formal pluralisch ist, ist »vom Himmel« hier die übliche und idiomatische deutsche Entsprechung.
- source_word: נָחִת
  choice: kam ... herab
  rationale: Das Verb bezeichnet eine Abwärtsbewegung. »Kam ... herab« entspricht der irdischen Erzählperspektive und klingt natürlicher als »stieg herab«.
theological_decisions:
- issue: Identität von עִיר וְקַדִּישׁ
  choice: »Ein Wächter, ein Heiliger« ohne nähere Identifikation
  alternative: »ein Engel« oder »ein himmlischer Bote«
  rationale: Der Vers verwendet nicht das allgemeine Wort für einen Engel, sondern eine besondere Bezeichnung. Die wörtliche Wiedergabe erhält diese Eigenart und legt die genaue Art des himmlischen Wesens nicht über den Text hinaus fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Visionen meines Kopfes« und die Bezeichnung »Wächter« bleiben wegen ihrer besonderen Bildkraft erhalten; die Satzgliederung sorgt dennoch für gute Verständlichkeit.
