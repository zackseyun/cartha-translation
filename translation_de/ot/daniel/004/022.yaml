id: DAN.4.22
reference: Daniel 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: de
  text: Man wird dich aus der Gemeinschaft der Menschen vertreiben, und deine Wohnstätte wird bei den Tieren des Feldes sein. Man wird dich Gras fressen lassen wie die Rinder, und vom Tau des Himmels wirst du durchnässt werden. Sieben Zeiten[a] werden über dich hinweggehen, bis du erkennst, dass der Höchste über das Reich der Menschen[b] herrscht und es gibt, wem er will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Zeitabschnitte“; häufig werden darunter sieben Jahre verstanden.'
    reason: Das aramäische עִדָּנִין bestimmt die genaue Länge der Zeiträume nicht.
  - marker: b
    text: „Reich der Menschen“ kann die menschliche Herrschaft oder den Herrschaftsbereich der Menschheit bezeichnen.
    reason: Die Wendung מַלְכוּת אֲנָשָׁא lässt beide eng verbundenen Bedeutungsnuancen zu.
lexical_decisions:
- source_word: טָרְדִין מִן אֲנָשָׁא
  choice: Man wird dich aus der Gemeinschaft der Menschen vertreiben
  rationale: Die aramäische aktive Pluralform mit unbestimmtem Subjekt wird im Deutschen idiomatisch mit „man“ wiedergegeben. „Aus der Gemeinschaft der Menschen“ verdeutlicht den im Kontext gemeinten Ausschluss aus der menschlichen Gesellschaft, ohne die Tier-Mensch-Gegenüberstellung aufzugeben.
- source_word: חֵיוַת בָּרָא
  choice: die Tiere des Feldes
  rationale: Die Wendung bezeichnet frei lebende Landtiere. „Tiere des Feldes“ bewahrt das konkrete Bild und den würdevollen biblischen Ton, ohne das heute stark wertende Wort „Bestien“ zu verwenden.
- source_word: מְדֹרָךְ
  choice: deine Wohnstätte
  rationale: „Wohnstätte“ gibt den Ort des Aufenthalts konkret wieder und passt zum gehobenen, aber verständlichen Register.
- source_word: וְעִשְׂבָּא כְתוֹרִין לָךְ יְטַעֲמוּן
  choice: Man wird dich Gras fressen lassen wie die Rinder
  rationale: Die Kausativform wird durch „fressen lassen“ bewahrt; das Geschehen wird Nebukadnezar auferlegt. „Rinder“ bezeichnet die bovinen Tiere ohne die unnötige geschlechtliche Festlegung von „Ochsen“.
- source_word: מִטַּל שְׁמַיָּא לָךְ מְצַבְּעִין
  choice: vom Tau des Himmels wirst du durchnässt werden
  rationale: Die passive Form gibt das unbestimmte handelnde Subjekt wieder. „Durchnässt“ bewahrt die kräftige Vorstellung längerer Aussetzung im Freien.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sieben Zeiten
  rationale: עִדָּנִין bezeichnet Zeitabschnitte, legt deren genaue Dauer aber nicht fest. „Zeiten“ bewahrt diese Mehrdeutigkeit besser als die interpretierende Wiedergabe „Jahre“.
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: werden über dich hinweggehen
  rationale: Die Formulierung bewahrt sowohl das Vergehen der Zeit als auch den persönlichen, über Nebukadnezar kommenden Vollzug des Gerichts.
- source_word: עַד דִּי תִנְדַּע
  choice: bis du erkennst
  rationale: „Erkennen“ gibt hier nicht nur Kenntnis, sondern das durch Erfahrung gewonnene Eingeständnis der göttlichen Herrschaft wieder.
- source_word: שַׁלִּיט עִלָּיָא בְּמַלְכוּת אֲנָשָׁא
  choice: dass der Höchste über das Reich der Menschen herrscht
  rationale: „Der Höchste“ ist die natürliche Gottesbezeichnung; „herrscht über“ drückt souveräne Gewalt idiomatisch aus. „Reich der Menschen“ lässt die mögliche Bedeutung als menschlicher Herrschaftsbereich bestehen.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: und es gibt, wem er will
  rationale: Das Pronomen „es“ bezieht sich auf das Reich beziehungsweise die Herrschaft. „Wem er will“ bewahrt knapp und deutlich Gottes souveränen Willen.
theological_decisions:
- issue: Dauer der „sieben Zeiten“
  choice: sieben Zeiten
  alternative: sieben Jahre; sieben Zeitabschnitte
  rationale: Das Aramäische nennt keine eindeutige kalendarische Einheit. Die Übersetzung lässt die Dauer deshalb offen und nennt die verbreitete Präzisierung als Jahre nur in der Fußnote.
- issue: Bedeutung von מַלְכוּת אֲנָשָׁא
  choice: Reich der Menschen
  alternative: menschliche Herrschaft; Herrschaftsbereich der Menschheit
  rationale: Die Formulierung kann sowohl den Bereich menschlichen Regierens als auch die Menschenwelt unter Herrschaft bezeichnen. Der Haupttext bewahrt das traditionelle Bild; die Fußnote erläutert den Bedeutungsumfang.
- issue: Ziel des erzwungenen Erkennens
  choice: bis du erkennst
  alternative: bis du anerkennst; bis du einsiehst
  rationale: Die Grundbedeutung „erkennen/wissen“ bleibt erhalten, während der Zusammenhang eine durch Gericht bewirkte Anerkennung der Herrschaft des Höchsten erkennen lässt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, allgemein verständlichem Bibelton. Unbestimmte aramäische Pluralsubjekte werden wechselnd durch „man“ und eine deutsche Passivkonstruktion wiedergegeben. Die genaue Dauer der Zeiten und der Bedeutungsumfang von „Reich der Menschen“ bleiben bewusst offen; sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
