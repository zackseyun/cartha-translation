base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: de
  text: 'Darum, König, lass dir meinen Rat gefallen: Brich mit deinen Sünden, indem du das Rechte tust, und mit deinen Verfehlungen, indem du den Armen Barmherzigkeit erweist.[a] Vielleicht wird dadurch dein Wohlergehen verlängert.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Löse deine Sünden durch Gerechtigkeit und deine Verfehlungen durch Barmherzigkeit gegenüber den Armen.“ Das aramäische Verb kann „abbrechen/mit etwas brechen“, aber auch „losmachen, befreien, erlösen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Vielleicht wird es eine Verlängerung für deine Ruhe/deinen Frieden geben.“ Das aramäische Wort kann auch „Sicherheit“, „Ungestörtheit“ oder „Wohlergehen“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: Darum
  rationale: Die aramäische Folgerungspartikel leitet Daniels Schluss aus der Traumdeutung ein; „Darum“ ist im Deutschen natürlich und prägnant.
- source_word: מַלְכָּא
  choice: König
  rationale: Der bestimmte Ausdruck steht hier als direkte, höfische Anrede; im heutigen Deutschen wirkt „König“ würdig, ohne das veraltete „O König“ zu benötigen.
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: lass dir meinen Rat gefallen
  rationale: Gibt die höflich-deferente Bitte idiomatisch wieder und bewahrt das Motiv des Gefallens bzw. Gutheißens.
- source_word: וְחֲטָיָךְ בְּצִדְקָה פְרֻק
  choice: Brich mit deinen Sünden, indem du das Rechte tust
  rationale: „Brich mit“ erfasst den Aufruf zur entschiedenen Abkehr; „indem du das Rechte tust“ gibt צִדְקָה hier als konkrete gerechte Lebensführung natürlich wieder.
- source_word: וַעֲוָיָתָךְ
  choice: deinen Verfehlungen
  rationale: Bewahrt als nahe Bedeutungsparallele zu „Sünden“ eine gewisse lexikalische Unterscheidung und bleibt für heutige Leser verständlich.
- source_word: בְּמִחַן עֲנָיִן
  choice: indem du den Armen Barmherzigkeit erweist
  rationale: Macht den handlungsbezogenen Sinn der Wendung deutlich; עֲנָיִן kann Arme oder Bedrängte bezeichnen, hier passt „die Armen“ gut zum sozialen Appell.
- source_word: הֵן
  choice: Vielleicht
  rationale: Bewahrt die vom Kontext geforderte Möglichkeit bzw. Bedingtheit, ohne einen sicheren Ausgang zu behaupten.
- source_word: תֶּהֱוֵא אַרְכָה לִשְׁלֵוְתָךְ
  choice: wird dann dein Wohlergehen noch eine Zeit lang anhalten
  rationale: Gibt die Verlängerung von Ruhe, Sicherheit oder Wohlergehen in natürlichem Deutsch wieder; „Wohlergehen“ lässt politische und persönliche Sicherheit mitschwingen.
theological_decisions:
- issue: Ob Daniels Aufforderung eine durch gute Werke bewirkte Sühne lehrt oder zur Umkehr in gerechtem und barmherzigem Handeln aufruft
  choice: Aufruf, entschieden mit der Sünde zu brechen und die Umkehr durch rechtes sowie barmherziges Handeln zu verwirklichen
  alternative: „Löse/erkaufe deine Sünden durch Gerechtigkeit“, möglicherweise im Sinn sühnender Almosen
  rationale: פְרֻק kann „losmachen/befreien“ und kontextabhängig auch „erlösen“ bedeuten. Die Wiedergabe „Brich mit“ passt zur ethischen Mahnung, ohne eine im Aramäischen nicht eindeutig festgelegte Lehre verdienstlicher Sühne einzutragen; die alternative Deutung bleibt in der Fußnote sichtbar.
- issue: Grad der Gewissheit einer Verlängerung des königlichen Wohlergehens
  choice: Eine mögliche, nicht garantierte Verlängerung
  alternative: Eine sichere Folge der Umkehr
  rationale: הֵן markiert hier eine vorsichtige Möglichkeit; „Vielleicht“ erhält diese theologische und rhetorische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter höfischer Anrede. Die Satzstruktur ist gegenüber dem Aramäischen behutsam geglättet; „indem“ verdeutlicht die instrumentale Beziehung, ohne die konkreten Forderungen abzuschwächen. Beide Fußnotenmarker stehen im Haupttext.
