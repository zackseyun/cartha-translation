base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: de
  text: Ich hatte einen Traum, und er erschreckte mich; die Gedanken auf meinem Bett und die Visionen in meinem Kopf versetzten mich in Angst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Überlegungen auf meinem Bett und die Visionen in meinem Kopf beunruhigten mich.«'
    reason: Lexikalische Alternative für הַרְהֹרִין und יְבַהֲלֻנַּנִי; die Wiedergabe »Visionen« hält den Sinn von חֶזְוֵי ausdrücklich fest.
lexical_decisions:
- source_word: חֵלֶם חֲזֵית
  choice: Ich hatte einen Traum
  rationale: Wörtlich steht »ich sah einen Traum«. Im modernen Deutschen ist »einen Traum haben« die natürliche Ausdrucksweise und gibt den Sinn direkt wieder.
- source_word: וִידַחֲלִנַּנִי
  choice: und er erschreckte mich
  rationale: Das singularische Verb bezieht sich am natürlichsten auf den Traum; das Pronomen macht diesen Bezug im Deutschen deutlich.
- source_word: וְהַרְהֹרִין
  choice: Die Gedanken
  rationale: Das aramäische Substantiv bezeichnet Gedanken, Überlegungen oder innere Vorstellungen. »Gedanken« ist klar und bewahrt die Parallelität zum folgenden Ausdruck.
- source_word: עַל מִשְׁכְּבִי
  choice: auf meinem Bett
  rationale: Die räumliche Formulierung des Ausgangstextes bleibt erhalten und bezeichnet zugleich die Situation, in der der König lag.
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: und die Bilder in meinem Kopf
  rationale: Wörtlich etwa »die Visionen meines Kopfes«. »Bilder in meinem Kopf« ist im heutigen Deutsch verständlich, bewahrt den körperbezogenen Ausdruck und bezeichnet die innerlich gesehenen Traumbilder.
- source_word: יְבַהֲלֻנַּנִי
  choice: versetzten mich in Angst
  rationale: Das Verb bezeichnet heftiges Erschrecken, Beunruhigen oder Verstören. Die Formulierung wahrt gegenüber dem ersten Verb eine gewisse Steigerung, ohne eine übermäßig moderne oder psychologisierende Wendung zu verwenden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz wird idiomatisch wiedergegeben; im zweiten bleiben Bett und Kopf als konkrete Bilder des aramäischen Textes erhalten. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die Alternative bezieht.
