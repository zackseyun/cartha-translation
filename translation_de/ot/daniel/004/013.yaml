  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: de
  text: Sein Herz soll nicht mehr das eines Menschen sein, und ihm soll das Herz eines Tieres gegeben werden. Sieben Zeiten[a] sollen über ihm vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Zeitabschnitte“ oder „sieben festgesetzte Zeiten“. Das aramäische Wort bezeichnet Zeiten oder Zeiträume; ihre genaue Dauer wird hier nicht angegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ מִן אֱנוֹשָׁא
  choice: sein Menschenherz
  rationale: לְבַב bezeichnet das Herz als Sitz von Denken und innerer Haltung; die kompakte deutsche Verbindung „Menschenherz“ gibt den Gegensatz zum Tierherzen natürlich wieder, ohne „Herz“ deutend durch „Verstand“ zu ersetzen.
- source_word: יְשַׁנּוֹן
  choice: soll verwandelt werden
  rationale: Der aramäische Plural hat hier unbestimmt-unpersönliche Bedeutung. Das deutsche Passiv bewahrt dies, ohne einen Handelnden ausdrücklich einzuführen.
- source_word: וּלְבַב חֵיוָה
  choice: das Herz eines Tieres
  rationale: חֵיוָה bezeichnet ein Tier beziehungsweise wildes Tier. „Tier“ ist im heutigen Deutsch natürlich und wahrt den bildhaften Gegensatz zum Menschen.
- source_word: יִתְיְהִב לֵהּ
  choice: ihm … gegeben werden
  rationale: Die passive Form wird direkt und ohne nähere Bestimmung des Gebers wiedergegeben.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sieben Zeiten
  rationale: עִדָּן bezeichnet festgesetzte Zeiten oder Zeitabschnitte. „Zeiten“ erhält die im Vers bestehende Unbestimmtheit ihrer genauen Dauer.
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: sollen über ihm vergehen
  rationale: Die Formulierung gibt sowohl das Verstreichen der Zeit als auch ihren Bezug auf ihn wieder und entspricht natürlichem, gehobenem Deutsch.
theological_decisions:
- issue: Art der beschriebenen Verwandlung
  choice: Die Bildsprache von Menschenherz und Tierherz bleibt bestehen.
  alternative: Auslegung als wörtliche körperliche Verwandlung oder ausdrücklich als geistige Verwirrung beziehungsweise Wahnsinn.
  rationale: Der aramäische Text spricht von der Verwandlung des Herzens und der Gabe eines Tierherzens, entscheidet in diesem Vers aber nicht ausdrücklich zwischen körperlicher Verwandlung und einem tierähnlichen inneren Zustand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität von Menschenherz und Tierherz wird bewahrt; „Tier“ vermeidet das im heutigen Deutsch stärker wertende oder altertümliche „Bestie“.
