  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: de
  text: 'Da erstarrte Daniel, der Beltschazar hieß, etwa eine Stunde lang, und seine Gedanken erschreckten ihn. Der König ergriff das Wort und sagte: „Beltschazar, lass dich von dem Traum und seiner Deutung nicht in Schrecken versetzen!“ Beltschazar antwortete: „Mein Herr, möge der Traum denen gelten, die dich hassen, und seine Deutung deinen Feinden!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Leitet den nächsten Vorgang in der Erzählung ein und gibt den aramäischen Diskursmarker in natürlichem modernem Deutsch wieder.
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: Daniel, der Beltschazar hieß
  rationale: Die Relativkonstruktion erklärt Daniels babylonischen Namen im höfischen Zusammenhang.
- source_word: אֶשְׁתּוֹמַם
  choice: war wie erstarrt
  rationale: Das Verb bezeichnet ein bestürztes, sprachloses Verharren. Die Formulierung bewahrt sowohl den Schock als auch das zeitweilige Verstummen, ohne die Bedeutung unnötig einzuengen.
- source_word: כְּשָׁעָה חֲדָה
  choice: ungefähr eine Stunde lang
  rationale: Die Vergleichspartikel כְּ bezeichnet hier eine ungefähre Zeitspanne; die Wiedergabe bewahrt die ausdrücklich genannte Stunde.
- source_word: וְרַעְיֹנֹהִי יְבַהֲלֻנֵּהּ
  choice: und seine Gedanken versetzten ihn in Schrecken
  rationale: רַעְיוֹן bezeichnet Gedanken oder innere Überlegungen; בהל drückt heftige Beunruhigung oder Schrecken aus.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Der König ergriff das Wort und sagte
  rationale: Gibt die semitische Doppelungsformel idiomatisch wieder, ohne einen vorausgehenden ausdrücklichen Gesprächsbeitrag vorauszusetzen.
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: lass dich von dem Traum und seiner Deutung nicht in Schrecken versetzen
  rationale: Bewahrt die Wiederholung derselben Wurzel בהל und versteht beide koordinierten Substantive als Ursache des möglichen Schreckens.
- source_word: מָרִי
  choice: Mein Herr
  rationale: Angemessene respektvolle Anrede an den König; im Kontext handelt es sich um einen menschlichen Hoheitstitel.
- source_word: לְשָׂנְאָיִךְ ... לְעָרָיִךְ
  choice: denen, die dich hassen ... deinen Feinden
  rationale: Die Präposition לְ bezeichnet hier diejenigen, auf die Traum und Deutung nach Daniels Wunsch zutreffen sollen.
- source_word: פִּשְׁרֵהּ
  choice: seine Deutung
  rationale: Das Wort bezeichnet die Auslegung eines Traums und wird daher präziser mit „Deutung“ als nur mit „Bedeutung“ wiedergegeben.
theological_decisions:
- issue: Daniels Anrede מָרִי an Nebukadnezar
  choice: Mein Herr
  alternative: Mein Gebieter; Herr
  rationale: Die Anrede drückt höfische Ehrerbietung gegenüber einem menschlichen König aus und ist hier kein Gottesprädikat.
- issue: Daniels Wunschformel über Traum und Deutung
  choice: möge der Traum denen gelten, die dich hassen, und seine Deutung deinen Feinden
  alternative: der Traum sei für die, die dich hassen, und seine Deutung für deine Feinde
  rationale: Die Wunschform bewahrt Daniels Loyalität gegenüber dem König, ohne festzulegen, ob er eine Übertragung des Traums oder nur dessen Erfüllung an den Feinden wünscht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Anrede bleibt erhalten; semitische Redeformeln werden verständlich, aber quellennah wiedergegeben. Die Wiederholung des Schreckensmotivs wird lexikalisch sichtbar gehalten.
