  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: de
  text: Und weil sie sagten, man solle den Wurzelstock des Baumes mit seinen Wurzeln stehen lassen, wird dein Königtum dir erhalten bleiben von dem Zeitpunkt an, an dem du erkennst, dass der Himmel[a] herrscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Himmel herrschen.« Das Aramäische gebraucht »Himmel« hier als ehrfürchtige Bezeichnung für Gottes souveräne Herrschaft.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִי
  choice: Und weil
  rationale: Die Verbindung aus Konjunktion und Relativpartikel leitet hier eine erklärende, kausal gefärbte Aussage ein.
- source_word: אֲמַרוּ
  choice: sie sagten
  rationale: Die aktive Pluralform bleibt erhalten; der folgende deutsche Nebensatz mit „man solle“ gibt den Inhalt der Anordnung natürlich wieder.
- source_word: לְמִשְׁבַּק
  choice: stehen lassen
  rationale: שבק bedeutet hier „lassen, übrig lassen“; beim Bild eines gefällten Baumes ist „stehen lassen“ im Deutschen anschaulich und idiomatisch.
- source_word: עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: den Wurzelstock des Baumes mit seinen Wurzeln
  rationale: Die Wiedergabe bezeichnet den verbleibenden Stock samt Wurzelsystem und bewahrt das Baumbild verständlich.
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: wird dein Königtum dir erhalten bleiben
  rationale: קַיָּמָה bezeichnet Fortbestand beziehungsweise Bestandhaben; „dir erhalten bleiben“ gibt zugleich das ausdrücklich wiederholte Pronomen לָךְ wieder.
- source_word: מִן דִּי
  choice: von dem Zeitpunkt an, an dem
  rationale: Die Formulierung wahrt den Ausgangspunkt, den die aramäische Zeitangabe markiert, statt ihn nur mit „wenn“ wiederzugeben.
- source_word: תִנְדַּע
  choice: du erkennst
  rationale: Das Verb bedeutet „wissen, erkennen“; im Zusammenhang geht es um ein zur Einsicht gelangendes Anerkennen der himmlischen Herrschaft.
- source_word: שַׁלִּטִן
  choice: herrscht
  rationale: Die prädikative Form drückt souveräne Herrschaft aus; „herrscht“ ist knapp, würdig und idiomatisch.
- source_word: שְׁמַיָּא
  choice: der Himmel
  rationale: Der aramäische Ausdruck kann als ehrfürchtige Umschreibung für Gottes Hoheit dienen. Der deutsche Singular „der Himmel“ bewahrt diese Metonymie, ohne sie zu „Gott“ aufzulösen.
theological_decisions:
- issue: Ob שְׁמַיָּא wörtlich als „die Himmel“ oder als ehrfürchtige metonymische Bezeichnung „der Himmel“ wiederzugeben ist
  choice: der Himmel herrscht
  alternative: die Himmel herrschen
  rationale: Im Kontext Daniels bezeichnet „der Himmel“ Gottes souveräne Autorität, ohne Gott unmittelbar zu nennen. Die Hauptfassung erhält diese ehrfürchtige Redeweise; die Fußnote bewahrt die formale Mehrzahl des Aramäischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Aramäischen, wird jedoch durch „man solle“ und die explizite Zeitformulierung natürlich lesbar gemacht. Der Fußnotenmarker steht unmittelbar bei der sachlich betroffenen Wendung „der Himmel“.
