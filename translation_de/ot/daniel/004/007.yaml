  text: וְ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י חָזֵ֣ה הֲוֵ֔ית וַ/אֲל֥וּ אִילָ֛ן בְּ/ג֥וֹא אַרְעָ֖/א וְ/רוּמֵ֥/הּ שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/007.yaml
  text: 'These were the visions of my head as I lay on my bed: and behold[a], a tree in the midst of the earth, and its height was great.'
translation:
  language: de
  text: 'Dies waren die Visionen[a], die ich auf meinem Bett sah: Siehe, ein Baum in der Mitte der Erde, und seine Höhe war groß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Visionen meines Hauptes“. Die aramäische Wendung bezeichnet das, was Nebukadnezar im Traum sah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: die Bilder, die ich … vor meinem inneren Auge sah
  rationale: Die aramäische Wendung bedeutet wörtlich „die Visionen meines Hauptes“ und bezeichnet die innerlich wahrgenommenen Traumbilder. Die Übersetzung gibt den Sinn in natürlichem modernem Deutsch wieder; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: עַל מִשְׁכְּבִי
  choice: auf meinem Bett
  rationale: Die Präpositionalverbindung bezeichnet den Ort beziehungsweise die Situation, in der Nebukadnezar die Vision hatte.
- source_word: חָזֵה הֲוֵית
  choice: sah
  rationale: Partizip plus הוה bildet eine umschreibende Verlaufsform, wörtlich etwa „war sehend“. Das einfache „sah“ ist im Deutschen natürlich und bewahrt den Vorgang des Schauens.
- source_word: וַאֲלוּ
  choice: Und siehe
  rationale: Der deiktische Ausruf lenkt die Aufmerksamkeit auf das auffällige Hauptbild der Vision und behält den feierlichen Erzählton bei.
- source_word: אִילָן
  choice: ein Baum
  rationale: Direkte Wiedergabe des aramäischen Substantivs; der unbestimmte Artikel entspricht der ersten Erwähnung.
- source_word: בְּגוֹא אַרְעָא
  choice: mitten auf der Erde
  rationale: בְּגוֹא bezeichnet die Mitte; אַרְעָא kann „Erde“ oder „Land“ bedeuten. Der universale Horizont der Vision spricht hier für „Erde“.
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: und seine Höhe war gewaltig
  rationale: רוּם mit Suffix bezeichnet die Höhe des Baumes; שַׂגִּיא drückt bedeutende Größe aus. „Gewaltig“ vermittelt die außergewöhnliche Höhe, ohne eine zusätzliche Steigerungsstufe einzuführen.
