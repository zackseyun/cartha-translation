  source_fidelity: 'Die Grundstruktur wird richtig erfasst: Nebukadnezar berichtet von Visionen auf seinem Bett, gefolgt vom Bild eines außergewöhnlich hohen Baumes. „Bilder, die ich … vor meinem inneren Auge sah“ entfaltet jedoch die aramäische idiomatische Wendung stärker als nötig und verteilt ihren Inhalt auf eine deutsche Relativkonstruktion. „Gewaltig“ ist gegenüber שַׂגִּיא („groß“) leicht verstärkend. Außerdem gibt „mitten auf der Erde“ im Deutschen eher eine Lage auf der Erdoberfläche wieder als die Mitte der Erde.'
  naturalness: Die revidierte Fassung ist modernes, verständliches Hochdeutsch und behält mit „Siehe“ den gehobenen visionären Erzählton. Die knappe Nominalwendung nach dem Doppelpunkt ist als visionäre Darstellung natürlich genug; „in der Mitte der Erde“ ist idiomatischer und semantisch genauer als „mitten auf der Erde“.
  terminology: „Visionen“ ist für חֶזְוֵי präziser als „Bilder“ und wahrt zugleich den wiederkehrenden Sprachgebrauch Daniels. Die Fußnote dokumentiert die wörtliche, im Deutschen sonst unübliche Wendung ohne sie interpretativ zu „innerem Auge“ auszubauen. „groß“ gibt שַׂגִּיא ohne zusätzliche Intensivierung wieder.
