base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: de
  text: Sein Laub war schön, und seine Frucht war reichlich; in ihm war Nahrung für alle. Unter ihm lebten die Tiere des Feldes, und in seinen Zweigen wohnten die Vögel des Himmels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Vögel der Himmel“; gemeint ist der Himmel beziehungsweise der Himmelsraum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: sein Laub
  rationale: Das aramäische Sammelwort bezeichnet die Belaubung beziehungsweise das Blätterwerk des Baumes. „Laub“ gibt diesen kollektiven Sinn im Deutschen natürlich wieder.
- source_word: שַׁפִּיר
  choice: schön
  rationale: Das Adjektiv bezeichnet Schönheit oder ansprechendes Aussehen; „schön“ ist direkt, modern und würdevoll.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: seine Frucht reichlich
  rationale: „Frucht“ bewahrt den kollektiven Singular des Aramäischen; „reichlich“ gibt die große Menge idiomatisch wieder.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: an ihm war Nahrung für alle
  rationale: Die Formulierung bewahrt sowohl die örtliche Beziehung zum Baum als auch die Aussage, dass Nahrung für alle vorhanden war. „Nahrung“ passt zum erhöhten, aber heutigen Register.
- source_word: תְּחֹתוֹהִי תְּדוּר חֵיוַת בָּרָא
  choice: unter ihm lebten die Tiere des Feldes
  rationale: „Unter ihm“ entspricht der räumlichen Angabe; „lebten“ gibt das Wohnen oder Verweilen natürlich wieder. „Tiere des Feldes“ bewahrt die konkrete aramäische Wendung, ohne sie auf ausschließlich wilde Tiere einzuengen.
- source_word: וּבְעַנְפוֹהִי יִשְׁכְּנָן
  choice: und in seinen Zweigen wohnten
  rationale: „Zweige“ ist die geläufige deutsche Bezeichnung. „Wohnten“ bewahrt die Vorstellung dauernden Aufenthalts, ohne das spezifischere „nisteten“ in den Text einzutragen.
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: die Vögel des Himmels
  rationale: Die traditionelle und verständliche Wendung entspricht wörtlich den „Vögeln des Himmels“; im Kontext ist der sichtbare Himmel gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Bildsprache. Der Parallelismus der beiden Ortsangaben „unter ihm“ und „in seinen Zweigen“ bleibt erhalten; unnötig altertümliche Wörter wurden vermieden.
