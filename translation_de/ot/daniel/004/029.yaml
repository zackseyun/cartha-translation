reference: Daniel 4:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: de
  text: Man wird dich aus der Gemeinschaft der Menschen[a] vertreiben, und du wirst bei den Tieren des Feldes wohnen. Man wird dich Gras fressen lassen wie die Rinder, und sieben Zeiten[b] werden über dir vergehen, bis du erkennst, dass der Höchste über das Reich der Menschen herrscht und es gibt, wem er will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Menschen“ bezeichnet hier die menschliche Gemeinschaft im Gegensatz zu den Tieren.
    reason: lexical_alternative
  - marker: b
    text: Aramäisch „sieben Zeiten“; möglicherweise sind sieben Jahre oder allgemeiner sieben Zeitabschnitte gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: טָרְדִין
  choice: man wird dich … vertreiben
  rationale: Die aktive Form ist wörtlich „sie werden dich vertreiben“. Das unpersönliche „man“ gibt sowohl die Form als auch den nicht genannten Handlungsträger natürlich wieder.
- source_word: אֲנָשָׁא
  choice: Menschen
  rationale: Der kollektive Ausdruck bezeichnet die menschliche Gemeinschaft im Gegensatz zu den Tieren und wird im modernen Deutschen inklusiv und präzise mit „Menschen“ wiedergegeben.
- source_word: מְדֹרָךְ
  choice: du wirst … wohnen
  rationale: Das nominale „deine Wohnstätte wird sein“ wird als natürliche deutsche Verbalkonstruktion wiedergegeben, ohne den Sinn zu verändern.
- source_word: חֵיוַת בָּרָא
  choice: Tiere des Feldes
  rationale: Die Wendung bezeichnet die außerhalb menschlicher Gemeinschaft lebenden Landtiere und bewahrt in dieser Form das biblische Bild.
- source_word: עִשְׂבָּא
  choice: Gras
  rationale: Im Zusammenhang mit dem Fressen der Rinder ist „Gras“ die konkrete und natürliche Wiedergabe.
- source_word: כְתוֹרִין
  choice: wie den Rindern
  rationale: 'Der aramäische Plural bezeichnet Rinder beziehungsweise bovine Tiere. Der deutsche Dativ ergibt sich aus der elliptischen Vergleichskonstruktion: So wie man Rindern Gras gibt, wird man es ihm geben.'
- source_word: יְטַעֲמוּן
  choice: man wird dir … zu essen geben
  rationale: Die Kausativform bedeutet, dass andere ihn essen lassen beziehungsweise ihm zu essen geben. Die Wiedergabe erhält den auferlegten Charakter des Gerichts.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sieben Zeiten
  rationale: עִדָּנִין bezeichnet Zeitabschnitte, legt deren genaue Länge hier aber nicht ausdrücklich fest. „Zeiten“ bewahrt diese Offenheit.
- source_word: יַחְלְפוּן עֲלָךְ
  choice: werden über dir vergehen
  rationale: Die Formulierung bezeichnet das Verstreichen der Zeit, während der das Urteil die angesprochene Person trifft; sie ist zugleich verständlich und bildnah.
- source_word: תִנְדַּע
  choice: bis du erkennst
  rationale: Das Verb bezeichnet Wissen beziehungsweise ein Zum-Wissen-Kommen. „Erkennen“ bringt hier die durch Erfahrung gewonnene Einsicht zum Ausdruck, ohne zusätzlich ein Bekenntnis einzutragen.
- source_word: שַׁלִּיט עִלָּיָא
  choice: der Höchste … herrscht
  rationale: Titel und Prädikat betonen die tatsächlich ausgeübte Oberherrschaft des Höchsten. „Herrscht“ ist klar und wahrt das königliche Motiv.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: über das Reich der Menschen
  rationale: „Reich der Menschen“ bewahrt den kollektiven Bezug auf menschliche Herrschaft; „über … herrschen“ ist die natürliche deutsche Rektion.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: und es gibt, wem er will
  rationale: Das Pronomen bezieht sich auf das Reich. Die knappe Form wahrt sowohl Gottes freie Verfügung als auch den Wortlaut, ohne den Empfänger näher zu bestimmen.
theological_decisions:
- issue: Dauer der sieben עִדָּנִין
  choice: sieben Zeiten
  alternative: sieben Jahre; sieben Zeitabschnitte
  rationale: Der Kontext kann an Jahre denken lassen, doch der aramäische Ausdruck selbst bestimmt die Dauer nicht so genau. Der Haupttext lässt diese Spannung bestehen; die Fußnote nennt die möglichen Deutungen.
- issue: Bedeutung von אֲנָשָׁא
  choice: Menschen
  alternative: Menschheit; Leute
  rationale: Gemeint sind Menschen als menschliche Gemeinschaft im Gegensatz zu den Tieren. „Menschen“ drückt dies im heutigen Deutschen ohne unnötige geschlechtliche Verengung aus.
- issue: Art der Herrschaft des Höchsten
  choice: herrscht über das Reich der Menschen und gibt es, wem er will
  alternative: ist Herrscher im Königtum der Menschen
  rationale: Die Wiedergabe erhält die Aussage von der souveränen Herrschaft und Vergabe des menschlichen Reiches, ohne eine bestimmte politische oder konfessionelle Systematik einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das unpersönliche „man“ bewahrt die aktive aramäische Form mit ungenanntem Handlungsträger. Die Wiederholung von „Menschen“ und das Herrschaftsmotiv bleiben erhalten; die zeitliche Angabe wird nicht überpräzisiert.
