source:
  edition: WLC
  text: ע֗וֹד מִלְּתָ/א֙ בְּ/פֻ֣ם מַלְכָּ֔/א קָ֖ל מִן שְׁמַיָּ֣/א נְפַ֑ל לָ֤/ךְ אָֽמְרִין֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א מַלְכוּתָ֖/ה עֲדָ֥ת מִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: de
  text: 'Noch war das Wort im Mund des Königs, da fiel eine Stimme vom Himmel herab: »Dir wird gesagt, König Nebukadnezar: Die Königsherrschaft ist von dir gewichen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Königsherrschaft ist dir genommen worden.“'
    reason: 'Lexikalische Alternative: Das aramäische Verb kann im Zusammenhang auch als Wegnahme der Herrschaft verstanden und entsprechend passiv wiedergegeben werden.'
lexical_decisions:
- source_word: עוֹד
  choice: Noch war …
  rationale: עוֹד bezeichnet hier den noch andauernden Augenblick, in den die himmlische Stimme hineinbricht.
- source_word: מִלְּתָא
  choice: das Wort
  rationale: Das Substantiv bezieht sich auf die gerade geäußerten Worte des Königs; „Wort“ wahrt die knappe, feierliche Ausdrucksweise.
- source_word: בְּפֻם מַלְכָּא
  choice: im Mund des Königs
  rationale: Die bildhafte aramäische Wendung wird bewusst erhalten und macht deutlich, dass der König noch sprach.
- source_word: קָל
  choice: eine Stimme
  rationale: Die anschließende direkte Rede zeigt, dass eine vernehmbare Stimme und nicht nur ein Geräusch gemeint ist.
- source_word: מִן שְׁמַיָּא
  choice: vom Himmel
  rationale: Im Zusammenhang des göttlichen Gerichtswortes bezeichnet die Wendung den himmlischen Bereich.
- source_word: נְפַל
  choice: fiel … herab
  rationale: Die Wiedergabe bewahrt das anschauliche Bild des aramäischen Verbs „fallen“; „herab“ macht die Richtung im Deutschen natürlich verständlich.
- source_word: לָךְ אָמְרִין
  choice: Dir wird gesagt
  rationale: Der pluralische Ausdruck hat hier unpersönliche, passivähnliche Bedeutung und leitet eine förmliche Verkündigung ein.
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: König Nebukadnezar
  rationale: Die im Deutschen übliche Titelstellung erhält die direkte Anrede.
- source_word: מַלְכוּתָה
  choice: die Königsherrschaft
  rationale: Das Wort kann Reich, Königtum oder königliche Herrschaft bezeichnen. „Königsherrschaft“ passt besonders zur Aussage, dass Nebukadnezar persönlich die Herrschaft verliert, ohne zu behaupten, das Staatsgebiet verschwinde.
- source_word: עֲדָת
  choice: ist … gewichen
  rationale: Das Verb bezeichnet ein Weggehen oder Entferntwerden. Die gewählte Form bleibt nahe am aktiven Bild und lässt die im Kontext mögliche göttliche Wegnahme erkennen, ohne sie grammatisch ausdrücklich zu machen.
- source_word: מִנָּךְ
  choice: von dir
  rationale: Die Präposition bezeichnet die Trennung der Königsherrschaft von Nebukadnezar.
theological_decisions:
- issue: Bedeutung des Himmels in der Verkündigung
  choice: vom Himmel
  alternative: vom Himmelraum / vom Firmament
  rationale: Der Zusammenhang kennzeichnet die Stimme als göttliches Gerichtswort; „Himmel“ bewahrt diese Bedeutung, ohne die Wendung auf ein Wetterphänomen zu reduzieren.
- issue: Art des Verlusts der Königsherrschaft
  choice: ist von dir gewichen
  alternative: ist dir genommen worden
  rationale: Die aktive Form entspricht unmittelbar dem aramäischen Verb und bewahrt zugleich die Spannung zur kontextuell naheliegenden göttlichen Wegnahme.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhaften Wendungen „im Mund“ und „eine Stimme … fiel … herab“ bewahren die Anschaulichkeit des Aramäischen; „Königsherrschaft“ vermeidet die mögliche Fehlvorstellung, das geografische Reich selbst sei verschwunden.
