  text: אִֽילָנָ/א֙ דִּ֣י חֲזַ֔יְתָ דִּ֥י רְבָ֖ה וּ/תְקִ֑ף וְ/רוּמֵ/הּ֙ יִמְטֵ֣א לִ/שְׁמַיָּ֔/א וַ/חֲזוֹתֵ֖/הּ לְ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: de
  text: Der Baum, den du gesehen hast, der groß und stark wurde, dessen Höhe bis an den Himmel reichte und der auf der ganzen Erde[a] zu sehen war –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Wort kann auch »Land« bedeuten; hier entspricht »Erde« dem weltweiten Umfang des Traumbildes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  choice: der Baum
  rationale: Das bestimmte aramäische Substantiv bezeichnet den konkreten Baum aus dem Traum.
- source_word: דִּי חֲזַיְתָ
  choice: den du gesehen hast
  rationale: Die Relativpartikel und das Perfekt der 2. Person Singular werden unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: רְבָה וּתְקִף
  choice: der groß wurde und stark
  rationale: Die beiden Verben beschreiben, wie der Baum groß und stark wurde. Die knappe Parallelstruktur des Aramäischen bleibt erhalten, ohne das zweite »wurde« unnötig zu wiederholen.
- source_word: וְרוּמֵהּ
  choice: dessen Höhe
  rationale: רוּם bezeichnet hier die Höhe des Baumes; »dessen Höhe« ist lexikalisch genauer als »dessen Spitze«.
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: bis an den Himmel reichte
  rationale: Das Verb bezeichnet das Erreichen eines Ziels. Obwohl die aramäische Form morphologisch pluralisch ist, entspricht »der Himmel« hier dem natürlichen deutschen biblischen Sprachgebrauch.
- source_word: וַחֲזוֹתֵהּ
  choice: und der … zu sehen war
  rationale: Die substantivische Wendung zur Sichtbarkeit wird im Deutschen idiomatisch verbal ausgedrückt.
- source_word: לְכָל אַרְעָא
  choice: auf der ganzen Erde
  rationale: אַרְעָא kann »Erde« oder »Land« bedeuten. Die universale Größenordnung des Traumbildes spricht hier für »Erde«.
theological_decisions:
- issue: Reichweite von אַרְעָא im königlichen Traumbild
  choice: Erde
  alternative: Land
  rationale: Das Bild eines bis an den Himmel reichenden und überall sichtbaren Baumes hat einen bewusst umfassenden Horizont. »Erde« bewahrt diesen Umfang, ohne eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Relativsätze und der abschließende Gedankenstrich bewahren den Charakter des Verses als noch nicht abgeschlossene Beschreibung.
