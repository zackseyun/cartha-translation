  yaml_path: translation/ot/daniel/004/025.yaml
  text: All this came upon King Nebuchadnezzar[a].
translation:
  language: de
  text: Dies alles traf König Nebukadnezar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies alles kam über König Nebukadnezar.“'
    reason: Lexikalische Alternative für מְּטָא עַל, die das räumlich geprägte aramäische Idiom formnäher wiedergibt.
lexical_decisions:
- source_word: כֹּלָּא
  choice: Dies alles
  rationale: Die aramäische Gesamtbezeichnung verweist auf die zuvor angekündigten Ereignisse zurück. „Dies alles“ gibt den umfassenden Sinn natürlich und präzise wieder.
- source_word: מְּטָא עַל
  choice: traf
  rationale: Das Verb מְטָא („gelangen, erreichen, eintreffen“) bildet mit עַל eine Wendung für etwas, das über eine Person kommt beziehungsweise sie ereilt. „traf“ ist im Deutschen knapp, idiomatisch und lässt den Gerichtscharakter aus dem Kontext hervorgehen.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nebukadnezar
  rationale: Der Personenname wird nach der etablierten deutschen Bibel- und Sprachkonvention wiedergegeben.
- source_word: מַלְכָּא
  choice: König
  rationale: Der bestimmte beziehungsweise emphatische Titel steht beim Eigennamen; die natürliche deutsche Form lautet „König Nebukadnezar“.
theological_decisions: []
