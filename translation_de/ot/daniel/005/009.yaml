base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/009.yaml
  text: Then King Belshazzar became greatly alarmed[a], his color changed[b], and his nobles were perplexed.
translation:
  language: de
  text: Da geriet König Belsazar in große Angst. Seine Gesichtsfarbe veränderte sich[a], und seine Würdenträger waren verwirrt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sein Glanz“ oder „sein Aussehen veränderte sich an ihm.“ Die Wendung kann im Zusammenhang mit Angst eine sichtbare Veränderung der Gesichtsfarbe, etwa Erblassen, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Großen“. Gemeint sind die führenden Amtsträger und hochrangigen Männer am Königshof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt die unmittelbar folgende Reaktion ein; „Da“ gibt den zeitlichen und folgernden Zusammenhang im Deutschen natürlich wieder.
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: König Belsazar
  rationale: Die im Deutschen übliche Stellung des Titels vor dem Eigennamen entspricht der Funktion der aramäischen Wortgruppe.
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: geriet … in große Angst
  rationale: Das Partizip von בהל bezeichnet starke Beunruhigung oder Erschrecken; שַׂגִּיא verstärkt die Aussage. Die Formulierung gibt sowohl den Eintritt der Reaktion als auch ihre Intensität in natürlichem Deutsch wieder.
- source_word: וְזִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: Seine Gesichtsfarbe veränderte sich
  rationale: זִיו kann Glanz, Aussehen oder die sichtbare Erscheinung des Gesichts bezeichnen. Im Zusammenhang mit Angst beschreibt die Wendung eine äußerlich erkennbare Veränderung; „Gesichtsfarbe“ macht das Idiom verständlich, ohne die körperliche Reaktion näher festzulegen.
- source_word: וְרַבְרְבָנוֹהִי
  choice: seine Würdenträger
  rationale: Das Wort bezeichnet die Großen des Reiches beziehungsweise hochrangige Amtsträger am Hof. „Würdenträger“ ist im Deutschen klarer und kontextgerechter als das missverständliche „Herren“.
- source_word: מִשְׁתַּבְּשִׁין
  choice: waren völlig verwirrt
  rationale: Das Partizip bezeichnet Verwirrung, Bestürzung oder einen Zustand der Desorientierung. „Völlig verwirrt“ bewahrt die starke Wirkung und klingt in modernem Deutsch natürlich.
