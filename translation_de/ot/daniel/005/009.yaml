  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die erste Satzgrenze hebt Belsazars unmittelbare Angst hervor; die anschließenden sichtbaren und höfischen Folgen bleiben eng verbunden. Die aramäische Mehrdeutigkeit von זִיו wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
