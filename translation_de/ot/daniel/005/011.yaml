    rationale: רוּחַ steht ohne bestimmenden Artikel in einer Konstruktion mit „heilige Götter“. „der Geist der heiligen Götter“ legt im Deutschen einen bestimmten, identifizierten Geist nahe. „ein Geist heiliger Götter“ wahrt die unbestimmte Form und die pluralische Perspektive.
