  - severity: low
    issue: Formulierung der Alternativlesart in Fußnote a
    rationale: „der eine wahre Gott“ ist eine theologisch wertende Formulierung, die über die textliche Alternative hinausgeht. Eine neutrale Angabe der monotheistischen Deutung genügt.
