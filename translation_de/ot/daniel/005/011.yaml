revisions:
- from: Es gibt einen Mann in deinem Königreich, in dem der Geist der heiligen Götter[a] ist. Schon zur Zeit deines Vaters fanden sich bei ihm Erleuchtung, Einsicht und Weisheit, die der Weisheit der Götter gleichkam. König Nebukadnezar, dein Vater, setzte ihn als Obersten der Zeichendeuter, Beschwörer, Chaldäer und Wahrsager ein – dein Vater[b], der König.
  to: Es gibt einen Mann in deinem Königreich, in dem ein Geist heiliger Götter[a] ist. Schon zur Zeit deines Vaters fanden sich in ihm Licht, Einsicht und Weisheit wie die Weisheit der Götter. König Nebukadnezar, dein Vater, setzte ihn als Obersten der Zeichendeuter, Beschwörer, Chaldäer und Wahrsager ein – dein Vater[b], der König.
  rationale: Die Revision stellt die unbestimmte Form von „Geist“ wieder her, ersetzt die stärker deutende „Erleuchtung“ durch das quellennahe „Licht“ und formuliert die Fußnote zur alternativen Deutung neutraler. Bedeutung, Register, rhetorische Wiederaufnahme und sämtliche Fußnotenanker bleiben erhalten.
