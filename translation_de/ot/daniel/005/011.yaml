  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: de
  text: Es gibt einen Mann in deinem Königreich, in dem ein Geist heiliger Götter[a] ist. Schon zur Zeit deines Vaters fanden sich in ihm Licht, Einsicht und Weisheit wie die Weisheit der Götter. König Nebukadnezar, dein Vater, setzte ihn als Obersten der Zeichendeuter, Beschwörer, Chaldäer und Wahrsager ein – dein Vater[b], der König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Geist des heiligen Gottes« beziehungsweise »ein Geist des heiligen Gottes«. Im Aramäischen steht »Götter« im Plural; manche deuten die Worte der Königin dennoch als Bezug auf den einen Gott.'
    reason: alternative_reading
  - marker: b
    text: »Dein Vater« kann in diesem höfisch-dynastischen Zusammenhang auch »dein Vorfahr« oder »dein Vorgänger« bedeuten.
    reason: cultural_note
lexical_decisions:
- source_word: אִיתַי גְּבַר בְּמַלְכוּתָךְ
  choice: Es gibt einen Mann in deinem Königreich
  rationale: Gibt die aramäische Existenzformel direkt und in natürlichem modernem Deutsch wieder.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: der Geist der heiligen Götter
  rationale: Die aramäischen Formen für „Götter“ und „heilig“ sind pluralisch; der bestimmte Artikel entspricht dem im Deutschen idiomatischen Ausdruck und lässt die Art des Geistes im babylonischen Hofsprachgebrauch erkennen.
- source_word: נַהִירוּ
  choice: Erleuchtung
  rationale: Bewahrt die Lichtmetaphorik, bezeichnet hier aber verständlich geistige Klarheit.
- source_word: שָׂכְלְתָנוּ
  choice: Einsicht
  rationale: Bezeichnet geistiges Verständnis und Urteilsvermögen und unterscheidet sich passend von der folgenden Weisheit.
- source_word: כְּחָכְמַת אֱלָהִין
  choice: die der Weisheit der Götter gleichkam
  rationale: Gibt den Vergleich natürlich wieder und bewahrt den morphologischen Plural sowie die Perspektive der babylonischen Sprecherin.
- source_word: רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין
  choice: als Obersten der Zeichendeuter, Beschwörer, Chaldäer und Wahrsager
  rationale: „Oberster“ gibt רַב als Amtsrang wieder; die Gruppenbezeichnungen bleiben unterscheidbar, wobei „Chaldäer“ hier die babylonische Gelehrtenklasse bezeichnet.
- source_word: אֲבוּךְ
  choice: dein Vater
  rationale: Bewahrt die wörtliche dynastische Anrede; die mögliche weitere Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Deutung von אֱלָהִין קַדִּישִׁין und אֱלָהִין
  choice: 'Plural: „der Geist der heiligen Götter“ und „die Weisheit der Götter“'
  alternative: 'Singular: „der Geist des heiligen Gottes“ beziehungsweise „die Weisheit Gottes“'
  rationale: Die aramäischen Formen sind pluralisch und stehen in der Rede einer Angehörigen des babylonischen Hofes. Der Haupttext wahrt diese Erzählperspektive, während die monotheistische Deutung als echte Auslegungsalternative in der Fußnote erhalten bleibt.
- issue: Verhältnis Nebukadnezars zu Belsazar bei אֲבוּךְ
  choice: „dein Vater“ im Haupttext
  alternative: „dein Vorfahr“ oder „dein Vorgänger“
  rationale: Der aramäische Text wiederholt ausdrücklich „dein Vater“. Im altorientalischen dynastischen Sprachgebrauch kann das Wort auch einen Vorfahren oder Amtsvorgänger bezeichnen; diese Möglichkeit wird erklärt, nicht in den Haupttext hineingedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem Aramäischen behutsam gegliedert, damit die Aufzählung verständlich bleibt. Der markierte Nachtrag „dein Vater, der König“ bleibt als rhetorische Wiederaufnahme erhalten.
