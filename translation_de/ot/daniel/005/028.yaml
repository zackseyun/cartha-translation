base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/028.yaml
  text: 'Peres: your kingdom has been divided and given to the Medes and Persians[a].'
translation:
  language: de
  text: 'Peres: Dein Königreich ist geteilt und den Medern und Persern gegeben worden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Inschriftenwort »Peres« klingt ähnlich wie das Verb für »teilen« und zugleich wie die Bezeichnung für Persien beziehungsweise die Perser. So bleibt Daniels Wortspiel in der Deutung erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: Peres
  rationale: Das Wort der Inschrift wird transkribiert, weil Daniel hier das geschriebene Zeichenwort auslegt. So bleibt sein Anklang an das folgende Verb und an »Perser« erkennbar.
- source_word: פְּרִיסַת
  choice: ist geteilt
  rationale: Das Verb aus derselben Wurzel wie פְּרֵס bezeichnet das Teilen. Das deutsche Zustandspassiv gibt das feststehende, bereits vollzogene Gerichtsurteil knapp und natürlich wieder.
- source_word: מַלְכוּתָךְ
  choice: dein Königreich
  rationale: »Königreich« bezeichnet hier am natürlichsten den Herrschaftsbereich Belsazars; »Königtum« würde stärker das Amt betonen.
- source_word: וִיהִיבַת
  choice: gegeben worden
  rationale: Die Form wird passivisch und resultativ als Übertragung des Königreichs an neue Machthaber wiedergegeben.
- source_word: לְמָדַי
  choice: den Medern
  rationale: Die Bezeichnung wird als Volksname verstanden und parallel zu »Persern« wiedergegeben.
- source_word: וּפָרָס
  choice: und Persern
  rationale: Die Form bezeichnet im Zusammenhang die Perser. Zugleich klingt sie an פְּרֵס und פְּרִיסַת an; dieser Wortklang wird in der Fußnote erläutert.
