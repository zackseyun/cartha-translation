source:
  edition: WLC
  text: אֱדַ֤יִן מַלְכָּ/א֙ זִיוֺ֣/הִי שְׁנ֔וֹ/הִי וְ/רַעיֹנֹ֖/הִי יְבַהֲלוּנֵּ֑/הּ וְ/קִטְרֵ֤י חַרְצֵ/הּ֙ מִשְׁתָּרַ֔יִן וְ/אַ֨רְכֻבָּתֵ֔/הּ דָּ֥א לְ/דָ֖א נָֽקְשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/006.yaml
  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
translation:
  language: de
  text: Da wechselte die Gesichtsfarbe des Königs[a], und seine Gedanken versetzten ihn in Schrecken. Seine Hüftgelenke gaben nach[b], und seine Knie schlugen aneinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sein Glanz veränderte sich.“ Die aramäische Wendung bezeichnet hier eine sichtbare Veränderung seines Aussehens oder seiner Gesichtsfarbe aus Angst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Verbindungen seiner Lenden lösten sich.“ Die Wendung beschreibt körperliche Schwäche oder ein Zusammenbrechen vor Schrecken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Das aramäische Zeitadverb führt das unmittelbar folgende Geschehen ein; „Da“ ist im deutschen Erzählstil natürlich und prägnant.
- source_word: מַלְכָּא
  choice: der König
  rationale: Die emphatische Form bezeichnet den im Zusammenhang bekannten König.
- source_word: זִיוֹהִי שְׁנוֹהִי
  choice: seine Gesichtsfarbe wechselte
  rationale: Wörtlich ist von seinem „Glanz“ oder „Aussehen“ die Rede; im Kontext bezeichnet die Wendung die sichtbare Veränderung seines Gesichts vor Angst.
- source_word: רַעְיוֹנֹהִי
  choice: seine Gedanken
  rationale: Die direkte Wiedergabe bewahrt den inneren, gedanklichen Auslöser seiner Angst.
- source_word: יְבַהֲלוּנֵּהּ
  choice: versetzten ihn in Schrecken
  rationale: Das Verb bezeichnet heftige Bestürzung oder Angst; die Formulierung entspricht der Intensität der beschriebenen körperlichen Reaktion.
- source_word: קִטְרֵי חַרְצֵהּ
  choice: seine Hüftgelenke
  rationale: Die schwierige Wendung bezeichnet Verbindungen beziehungsweise Gelenke im Hüft- oder Lendenbereich. „Hüftgelenke“ vermittelt das körperliche Bild verständlich, ohne es weiter auszudeuten.
- source_word: מִשְׁתָּרַיִן
  choice: gaben nach
  rationale: Die Form beschreibt ein Sichlösen oder Schlaffwerden; „gaben nach“ ist eine natürliche deutsche Wiedergabe der angstbedingten körperlichen Schwäche.
- source_word: אַרְכֻבָּתֵהּ
  choice: seine Knie
  rationale: Das Substantiv bezeichnet die Knie.
- source_word: דָּא לְדָא נָקְשָׁן
  choice: schlugen aneinander
  rationale: Die reziproke Wendung bedeutet wörtlich, dass das eine gegen das andere schlug; „schlugen aneinander“ gibt das Bild idiomatisch wieder.
