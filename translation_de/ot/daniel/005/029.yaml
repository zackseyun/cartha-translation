  text: בֵּ/אדַ֣יִן אֲמַ֣ר בֵּלְשַׁאצַּ֗ר וְ/הַלְבִּ֤ישׁוּ לְ/דָֽנִיֵּאל֙ אַרְגְּוָנָ֔/א ו/המונכ/א דִֽי דַהֲבָ֖/א עַֽל צַוְּארֵ֑/הּ וְ/הַכְרִ֣זֽוּ עֲל֔וֹ/הִי דִּֽי לֶהֱוֵ֥א שַׁלִּ֛יט תַּלְתָּ֖א בְּ/מַלְכוּתָֽ/א׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: de
  text: Darauf gab Belsazar den Befehl. Sie kleideten Daniel in Purpur[a], legten ihm eine goldene Kette um den Hals und ließen öffentlich ausrufen, dass er der dritte Herrscher im Königreich sein sollte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Wort kann purpurfarbene Kleidung oder Purpurstoff als Zeichen königlicher Ehre bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Dritter im Königreich herrschen sollte“. Gemeint ist ein hoher Rang innerhalb des Königreichs; die genaue Amtsordnung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Darauf
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; „Darauf“ gibt den zeitlichen und narrativen Anschluss natürlich wieder.
- source_word: אֲמַר
  choice: gab … den Befehl
  rationale: Das Verb bedeutet wörtlich „sagte“, hat hier angesichts der anschließenden Ausführung durch andere jedoch die Funktion eines königlichen Befehls.
- source_word: בֵּלְשַׁאצַּר
  choice: Belsazar
  rationale: Die im Deutschen herkömmliche und unmittelbar erkennbare Form des Personennamens.
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: Sie kleideten Daniel in Purpur
  rationale: Die Wendung bezeichnet das Anlegen purpurfarbener Kleidung oder eines Purpurgewands als Zeichen königlicher Ehrung; „in Purpur kleiden“ ist im Deutschen klar und würdevoll.
- source_word: ו/המונכא דִי דַהֲבָא
  choice: eine goldene Kette
  rationale: Gemeint ist ein goldener Halsschmuck als Ehrenzeichen. „Goldene Kette“ ist die natürliche deutsche Wiedergabe.
- source_word: עַל צַוְּארֵהּ
  choice: um den Hals
  rationale: Bei einer Kette entspricht dies der natürlichen deutschen Ortsangabe, auch wenn die Präposition wörtlich „auf/an“ bedeutet.
- source_word: וְהַכְרִזוּ עֲלֹוהִי
  choice: ließen öffentlich ausrufen
  rationale: Das Verb bezeichnet eine öffentliche Bekanntmachung. Die kausative deutsche Form passt zum höfischen Vorgang und vermeidet die schwerfällige Formulierung „verkündeten über ihn“.
- source_word: דִּי לֶהֱוֵא
  choice: dass er … sein sollte
  rationale: Die Konstruktion gibt den Inhalt der Proklamation mit Ernennungs- bzw. Sollensnuance wieder.
- source_word: שַׁלִּיט תַּלְתָּא
  choice: der dritte Herrscher
  rationale: Die knappe Wiedergabe erhält die Rangbezeichnung, ohne ausdrücklich festzulegen, ob damit der dritte Amtsträger oder der dritthöchste Rang gemeint ist.
- source_word: בְּמַלְכוּתָא
  choice: im Königreich
  rationale: „Königreich“ gibt den politischen Herrschaftsbereich unmittelbar und konsistent wieder.
theological_decisions:
- issue: Bedeutung des Rangs „der dritte Herrscher“
  choice: Die wörtliche Rangangabe bleibt im Haupttext erhalten.
  alternative: „der dritthöchste Machthaber im Königreich“
  rationale: Der aramäische Ausdruck bezeichnet einen dritten Rang oder eine dritte Herrschaftsposition, legt aber die genaue Verwaltungsstruktur nicht ausdrücklich dar. Die Übersetzung soll diese historische Unschärfe nicht vorschnell auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der erste lange aramäische Satz wird nach dem königlichen Befehl geteilt, damit die Abfolge der Handlungen klar bleibt. Die unbestimmten Vollstrecker werden mit „sie“ wiedergegeben.
