source:
  edition: WLC
  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: de
  text: Er wurde von den Menschen vertrieben, und sein Herz wurde dem der Tiere gleich[a]; bei den Wildeseln hatte er seine Wohnung. Man ließ ihn Gras fressen wie die Rinder, und sein Körper wurde vom Tau des Himmels durchnässt, bis er erkannte, dass Gott, der Höchste, über das Reich der Menschen herrscht und darüber einsetzt, wen er will[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Herz wurde dem der Tiere gleich“; „Herz“ kann hier auch den Verstand oder die innere Verfassung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über das Königtum der Menschen herrscht und darüber einsetzt, wen er will“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרִיד
  choice: wurde … vertrieben
  rationale: Die passive bzw. resultative Bedeutung bezeichnet Nebukadnezars gewaltsame Entfernung aus der menschlichen Gesellschaft. „Vertrieben“ gibt dies in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: בְּנֵי אֲנָשָׁא
  choice: die Menschen
  rationale: Die aramäische Wendung lautet wörtlich „Menschensöhne“, meint hier jedoch Menschen allgemein und bildet den Gegensatz zu den Tieren. Die idiomatische deutsche Wiedergabe vermeidet eine irreführende Beschränkung auf Männer.
- source_word: לִבְבֵהּ עִם חֵיוְתָא שוי
  choice: sein Herz wurde dem der Tiere gleich
  rationale: „Herz“ bewahrt das Bild des Ausgangstextes und kann das Denken, Wollen und die innere Verfassung umfassen. „Dem der Tiere gleich“ gibt die knappe aramäische Konstruktion verständlich wieder, ohne sie rein psychologisch festzulegen.
- source_word: עֲרָדַיָּא
  choice: Wildesel
  rationale: Das Wort bezeichnet wilde Esel bzw. Onager. „Wildesel“ ist die genaue und allgemein verständliche moderne Bezeichnung.
- source_word: מְדוֹרֵהּ
  choice: hatte er seine Wohnung
  rationale: Dies bildet das Substantiv „Wohnung/Wohnstätte“ ab und klingt im Satzzusammenhang natürlich, ohne die Aussage zu verstärken.
- source_word: יְטַעֲמוּנֵּהּ
  choice: Man ließ ihn … fressen
  rationale: 'Die Verbform ist kausativ: Unbestimmte Handelnde ließen ihn Gras essen bzw. gaben es ihm zu essen. Das unpersönliche „man“ bewahrt diese Unbestimmtheit besser als ein ausdrücklich passives „er wurde gefüttert“.'
- source_word: כְתוֹרִין
  choice: wie die Rinder
  rationale: Der Begriff bezeichnet Rinder, insbesondere Ochsen oder Stiere. Der Plural „Rinder“ ist im Deutschen natürlich und wahrt den konkreten Tiervergleich.
- source_word: יִצְטַבַּע
  choice: wurde … durchnässt
  rationale: Die Form bezeichnet ein gründliches Nasswerden. „Durchnässt“ bewahrt die Intensität stärker als bloßes „nass“.
- source_word: אֱלָהָא עִלָּאָה
  choice: Gott, der Höchste
  rationale: Die appositionelle Wiedergabe ist im Deutschen würdig und klar und erhält sowohl „Gott“ als auch den Hoheitstitel „der Höchste“.
- source_word: יְהָקֵים עֲלַהּ
  choice: darüber einsetzt
  rationale: Das Verb bedeutet hier, jemanden über ein Herrschaftsgebiet einzusetzen. „Einsetzt“ bewahrt Gottes aktives Bestimmen des Herrschers.
theological_decisions:
- issue: Aussage über Gottes Herrschaft und Einsetzung menschlicher Herrscher
  choice: dass Gott, der Höchste, über das Reich der Menschen herrscht und darüber einsetzt, wen er will
  alternative: dass der höchste Gott im Königtum der Menschen Macht hat und darüber aufrichtet, wen er will
  rationale: Die gewählte Fassung gibt Gottes aktive Herrschaft und sein Einsetzen von Herrschern unmittelbar wieder, ohne die Aussage durch spätere systematisch-theologische Begriffe auszuweiten.
- issue: Bedeutungsumfang von „Herz“
  choice: sein Herz wurde dem der Tiere gleich
  alternative: sein Verstand wurde dem der Tiere gleich
  rationale: Das aramäische „Herz“ kann Denken und innere Verfassung einschließen. Die wörtlichere Bildsprache lässt diesen Bedeutungsumfang offen, statt ihn auf den Verstand zu verengen.
- issue: Generische Bedeutung von אֲנָשָׁא
  choice: Menschen
  alternative: Männer
  rationale: Der Ausdruck bezeichnet die Menschheit bzw. Menschen allgemein, nicht ausschließlich männliche Personen. Die Wiedergabe ist daher sachlich inklusiv, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Folge des Aramäischen wurde leicht gegliedert, ohne den Ablauf zu verändern. „Das dauerte“ macht den zeitlichen Anschluss von עַד דִּי idiomatisch deutlich. Fachsprachliche oder konfessionell geprägte Formulierungen wurden vermieden.
