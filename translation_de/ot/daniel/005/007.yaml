  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: de
  text: 'Der König rief laut, man solle die Beschwörer, die Chaldäer[a] und die Wahrsager hereinbringen. Der König sagte zu den Weisen Babylons: »Jeder[b], der diese Schrift liest und mir ihre Deutung mitteilt, soll in Purpur gekleidet werden, eine goldene Kette um den Hals tragen und als Dritter[c] im Königreich herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Astrologen“. „Chaldäer“ kann hier außer der Volkszugehörigkeit auch eine Klasse babylonischer Hofgelehrter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„Jeder“ gibt eine grammatisch männliche Einzahl wieder, die hier allgemein gemeint ist: jeder Mensch beziehungsweise jeder, der dazu imstande ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der dritte Herrscher im Königreich sein“. Gemeint ist wahrscheinlich der dritte Rang in der Herrschaft.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: rief laut
  rationale: Die aramäische Wendung bezeichnet einen kraftvollen, weithin hörbaren Ruf; „rief laut“ ist natürlich und bewahrt die Intensität.
- source_word: לְהֶעָלָה
  choice: man solle ... hereinbringen
  rationale: Der Kausativ bezeichnet hier das Herbeiholen der Hofgelehrten in die Gegenwart des Königs.
- source_word: אָשְׁפַיָּא
  choice: Beschwörer
  rationale: Der Ausdruck bezeichnet eine bestimmte Gruppe kultisch-magischer Spezialisten und bleibt so von der umfassenderen Bezeichnung „Weise“ unterschieden.
- source_word: כשדיא
  choice: Chaldäer
  rationale: Die Wiedergabe wahrt die mögliche ethnische wie auch berufsständische Bedeutung; die alternative Bedeutung als Klasse von Hofastrologen wird in der Fußnote genannt.
- source_word: גָזְרַיָּא
  choice: Wahrsager
  rationale: Das Wort bezeichnet Spezialisten für die Bestimmung beziehungsweise Verkündigung von Vorzeichen und Deutungen.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Dann wandte sich der König ... und sagte
  rationale: Die idiomatische deutsche Form gibt die semitische Redeeinleitung natürlich wieder, ohne ein sachlich nicht vorhandenes Antworten auf eine vorausgehende Rede nahezulegen.
- source_word: לְחַכִּימֵי בָבֶל
  choice: an die Weisen Babylons
  rationale: Dies gibt die Bezeichnung der babylonischen Hofgelehrten knapp und unmittelbar wieder.
- source_word: כָל אֱנָשׁ
  choice: Jeder
  rationale: Die grammatisch maskuline Einzahl ist hier generisch; „Jeder“ wahrt die Form, während die Fußnote den umfassenden Sinn erläutert.
- source_word: יִקְרֵה כְּתָבָה דְנָה
  choice: diese Schrift liest
  rationale: „Schrift“ bezeichnet hier das an der Wand Geschriebene, ohne es stärker als formelle Inschrift festzulegen.
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: mir ihre Deutung mitteilt
  rationale: Die Formulierung bewahrt sowohl den Begriff der Deutung als auch den Gedanken des Bekanntmachens.
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: soll in Purpur gekleidet werden
  rationale: Die Formulierung folgt dem aramäischen Ausdruck eng und lässt den Purpur als Zeichen königlicher Ehrung erkennen.
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא עַל צַוְּארֵהּ
  choice: eine goldene Kette um den Hals tragen
  rationale: Dies ist eine natürliche deutsche Wiedergabe des als Auszeichnung verliehenen goldenen Halsschmucks.
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: als Dritter im Königreich herrschen
  rationale: Die Wendung bezeichnet wahrscheinlich den dritten Rang in der Herrschaft; die mögliche Wiedergabe „der dritte Herrscher“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung von „als Dritter herrschen“
  choice: als Dritter im Königreich herrschen
  alternative: der dritte Herrscher im Königreich sein
  rationale: Der aramäische Ausdruck lässt offen, ob eine Rangstellung oder eine numerisch bestimmte Mitregentschaft betont wird. Die Hauptfassung bewahrt diese Spannung möglichst knapp; die Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und öffentlich-feierlich gehalten. Semitische Formeln werden dort idiomatisch geglättet, wo eine wörtliche Wiedergabe im Deutschen einen falschen Gesprächszusammenhang nahelegen würde; sachliche und lexikalische Mehrdeutigkeiten bleiben durch Fußnoten erhalten.
