  text: בֵּ/אדַ֨יִן֙ מִן קֳדָמ֔וֹ/הִי שְׁלִ֖יַחַ פַּסָּ֣/א דִֽי יְדָ֑/א וּ/כְתָבָ֥/א דְנָ֖ה רְשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: de
  text: Daraufhin wurde die Handfläche einer Hand aus seiner Gegenwart[a] gesandt, und diese Schrift wurde geschrieben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor ihm“; gemeint ist der Ursprung aus der Gegenwart des zuvor Genannten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und diese Inschrift wurde geschrieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Daraufhin
  rationale: Der aramäische Erzählmarker führt das nächste Geschehen in der zeitlichen Folge ein. „Daraufhin“ ist im modernen Deutschen natürlich und etwas würdevoller als ein bloßes „Dann“.
- source_word: מִן קֳדָמוֹהִי
  choice: aus seiner Gegenwart
  rationale: Die Wendung lautet wörtlich „von vor ihm“ und bezeichnet den Ursprung aus der Gegenwart des zuvor genannten göttlichen Gegenübers. Die Übersetzung bewahrt diese Gegenwartsnuance, ohne Gott als Subjekt ausdrücklich in den Text einzufügen.
- source_word: שְׁלִיחַ
  choice: wurde … gesandt
  rationale: Die Passivform des Verbs „senden“ wird direkt wiedergegeben; das Passiv lässt den Handelnden wie im Aramäischen unausgesprochen.
- source_word: פַּסָּא דִי יְדָא
  choice: die Fläche einer Hand
  rationale: פַּסָּא bezeichnet hier die Handfläche beziehungsweise einen Teil oder das äußerste Stück der Hand. „Die Fläche einer Hand“ wahrt die anatomische Bildsprache und vermeidet, das Wort einfach mit der ganzen „Hand“ gleichzusetzen.
- source_word: וּכְתָבָא דְנָה
  choice: und diese Schrift
  rationale: כְתָבָא bezeichnet das Geschriebene beziehungsweise die Inschrift; das Demonstrativ דְנָה weist auf die unmittelbar folgende Botschaft hin.
- source_word: רְשִׁים
  choice: wurde eingezeichnet
  rationale: Das Verb kann „schreiben“, „einzeichnen“ oder „einritzen“ bedeuten. „Eingezeichnet“ passt zur Schrift an der Wand, ohne ein Einritzen in ein bestimmtes Material vorauszusetzen.
theological_decisions:
- issue: Bezug der Herkunftsangabe „von vor ihm“
  choice: „aus seiner Gegenwart“, mit Bezug auf den zuvor genannten Höchsten
  alternative: schlichter „von ihm“ oder formal-wörtlich „von vor ihm“
  rationale: Der unmittelbare Zusammenhang nennt den höchsten Gott als Ursprung des Geschehens. Die Übersetzung erhält zugleich die aramäische Bildsprache der Gegenwart und ergänzt kein ausdrückliches göttliches Subjekt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der knappen aramäischen Erzählweise; das göttliche Handeln bleibt durch die Passivform zurückhaltend ausgedrückt. Die ungewöhnliche anatomische Formulierung wird bewusst nicht zur bloßen „Hand“ geglättet.
