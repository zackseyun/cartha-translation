    issue: „die Fläche einer Hand“
    rationale: Die deutsche Wortgruppe ist anatomisch und idiomatisch unnatürlich. Sie gibt die im Aramäischen als Substantiv bezeichnete Handfläche/den Handteil weniger präzise wieder als „die Handfläche einer Hand“.
  - severity: medium
    issue: „wurde eingezeichnet“ für רְשִׁים
    rationale: „Einzeichnen“ bezeichnet im Deutschen eher das Eintragen oder Zeichnen von Linien. Der aramäische Grundsinn „schreiben/inskribieren“ wird mit „wurde geschrieben“ neutraler und quellennäher wiedergegeben.
