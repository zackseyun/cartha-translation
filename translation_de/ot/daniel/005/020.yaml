source:
  edition: WLC
  text: וּ/כְ/דִי֙ רִ֣ם לִבְבֵ֔/הּ וְ/רוּחֵ֖/הּ תִּֽקְפַ֣ת לַ/הֲזָדָ֑ה הָנְחַת֙ מִן כָּרְסֵ֣א מַלְכוּתֵ֔/הּ וִֽ/יקָרָ֖/ה הֶעְדִּ֥יוּ מִנֵּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: de
  text: Doch als sich sein Herz erhob und sein Geist sich im Übermut verhärtete[a], wurde er von seinem Königsthron abgesetzt, und seine Herrlichkeit[b] wurde ihm genommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Geist erstarkte in Vermessenheit«; oder: »sein Geist wurde überheblich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Ehre«; oder: »seine Hoheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: Doch als
  rationale: Die aramäische Verbindung leitet den zeitlichen Umstand ein und steht zugleich im Gegensatz zum vorausgehenden Bericht über Nebukadnezars Größe.
- source_word: רִם לִבְבֵהּ
  choice: sich sein Herz erhob
  rationale: Bewahrt das Bild des erhobenen Herzens und lässt dessen Bedeutung als Stolz erkennen, ohne die Metapher aufzulösen.
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: sein Geist sich im Übermut verhärtete
  rationale: Gibt sowohl das Stark- beziehungsweise Hartwerden des Geistes als auch die vermessene, hochmütige Haltung wieder. Die Fußnote bewahrt weniger bildhafte und stärker wörtliche Alternativen.
- source_word: הָנְחַת
  choice: wurde ... gestürzt
  rationale: Der kontextuell passive beziehungsweise kausative Sinn bezeichnet die Erniedrigung und Absetzung des Königs. Das Passiv nennt keinen Handelnden, wie auch der Vers selbst Gott hier nicht ausdrücklich nennt.
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: von seinem Königsthron
  rationale: Natürliche deutsche Wiedergabe von Thron und Königtum beziehungsweise Königsherrschaft.
- source_word: וִיקָרֵהּ
  choice: seine Herrlichkeit
  rationale: יְקָר kann Herrlichkeit, Ehre, Hoheit oder Würde bezeichnen. »Herrlichkeit« wahrt die königliche Größe und lässt die Bedeutungsbreite in einer Fußnote erkennen.
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: wurde ihm genommen
  rationale: Die aramäische Pluralform hat hier einen unbestimmten Handelnden; das deutsche Passiv vermeidet es, einen im Satz nicht genannten Akteur einzuführen.
theological_decisions:
- issue: Urheber von Nebukadnezars Erniedrigung
  choice: Die Erniedrigung wird im Passiv beschrieben, ohne Gott in diesem Vers ausdrücklich als Handelnden einzusetzen.
  alternative: Ein ausdrücklich auf Gott bezogenes Passiv oder die Formulierung »Gott stürzte ihn«.
  rationale: Der weitere Zusammenhang stellt Gottes Handeln heraus, doch die Formen dieses Verses lassen den Handelnden ungenannt. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher vom sich erhebenden Herzen bleibt erhalten; »Königsthron« und die passiven Wendungen sind klar und natürlich. Der Marker [b] steht bei »Herrlichkeit«, da sich die zugehörige lexikalische Fußnote auf יְקָר bezieht.
