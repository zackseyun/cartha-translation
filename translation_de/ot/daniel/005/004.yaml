source:
  edition: WLC
  text: אִשְׁתִּ֖יו חַמְרָ֑/א וְ֠/שַׁבַּחוּ לֵֽ/אלָהֵ֞י דַּהֲבָ֧/א וְ/כַסְפָּ֛/א נְחָשָׁ֥/א פַרְזְלָ֖/א אָעָ֥/א וְ/אַבְנָֽ/א׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/004.yaml
  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
translation:
  language: de
  text: Sie tranken den Wein und priesen die Götter aus Gold und Silber, Bronze[a], Eisen, Holz und Stein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer. Das aramäische Wort kann Kupfer oder Bronze bezeichnen; in dieser Aufzählung von Werkstoffen für Götterbilder ist „Bronze“ wahrscheinlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: Sie tranken
  rationale: Das Peal Perfekt 3. Person Plural erzählt die Handlung als Teil der Ereignisfolge; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: חַמְרָא
  choice: den Wein
  rationale: Der bestimmte Singular bezeichnet den konkreten Wein des Festmahls.
- source_word: וְשַׁבַּחוּ
  choice: und priesen
  rationale: Das Verb bezeichnet das Rühmen oder Preisen. „Priesen“ ist im Deutschen würdevoll, verständlich und passt zum kultischen Zusammenhang.
- source_word: לֵאלָהֵי
  choice: die Götter aus
  rationale: Die Präposition ל kennzeichnet das Ziel des Preisens; idiomatisches Deutsch verwendet nach „preisen“ den Akkusativ. „Aus“ bezeichnet natürlich das Material der dargestellten Gottheiten beziehungsweise Götterbilder.
- source_word: דַּהֲבָא
  choice: Gold
  rationale: Das Materialwort wird als erstes Glied der Aufzählung direkt wiedergegeben.
- source_word: וְכַסְפָּא
  choice: und Silber
  rationale: Direkte Wiedergabe des zweiten Materials; im Deutschen wird die Konjunktion innerhalb der zusammengehörigen ersten Wortgruppe beibehalten.
- source_word: נְחָשָׁא
  choice: Bronze
  rationale: Der aramäische Ausdruck kann Kupfer oder Bronze bezeichnen; in der herkömmlichen Aufzählung von Werkstoffen für Götterbilder ist „Bronze“ wahrscheinlich.
- source_word: פַרְזְלָא
  choice: Eisen
  rationale: Die übliche und eindeutige deutsche Entsprechung.
- source_word: אָעָא
  choice: Holz
  rationale: Die übliche deutsche Bezeichnung des Materials.
- source_word: וְאַבְנָא
  choice: und Stein
  rationale: Im Zusammenhang mit Götterbildern ist „Stein“ die natürliche Entsprechung.
theological_decisions:
- issue: Ob אֱלָהֵי hier mit „Götter“ oder „Gott“ wiederzugeben ist
  choice: Götter
  alternative: Gott
  rationale: Die Pluralform und die anschließende Aufzählung verschiedener Materialien weisen eindeutig auf heidnische Gottheiten beziehungsweise deren Bilder hin, nicht auf den Gott Israels.
- issue: Ob die Materialbeziehung mit „Götter aus“ oder „Götter von“ ausgedrückt wird
  choice: Götter aus
  alternative: Götter von
  rationale: „Aus“ macht im modernen Deutsch verständlich, dass die genannten Gottheiten in materiellen Bildern verehrt wurden, ohne die polemische Gleichsetzung von Gottheiten und Bildern im Text aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präteritum trägt die Erzählung weiter. Die kompakte Materialliste und ihre polemische Wirkung bleiben erhalten; die echte lexikalische Mehrdeutigkeit bei נְחָשָׁא wird in der Fußnote ausgewiesen.
