  yaml_path: translation/ot/daniel/005/030.yaml
  text: In that very night Belshazzar[a], the Chaldean king, was killed.
translation:
  language: de
  text: In jener Nacht wurde Belsazar, der König der Chaldäer, getötet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: Noch in derselben Nacht
  rationale: Die aramäische Verbindung bezeichnet idiomatisch genau jene Nacht. „Noch in derselben Nacht“ ist im modernen Deutschen natürlich und bringt zugleich den unmittelbaren zeitlichen Zusammenhang mit dem vorausgehenden Geschehen zum Ausdruck.
- source_word: קְטִיל
  choice: wurde ... getötet
  rationale: Die Form hat passiven beziehungsweise resultativen Sinn. „Wurde getötet“ wahrt diese Aussage klar und ohne den altertümlichen Klang von „wurde erschlagen“.
- source_word: בֵּלְאשַׁצַּר
  choice: Belsazar
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: מַלְכָּא כשדיא
  choice: der König der Chaldäer
  rationale: Diese Wiedergabe bildet die aramäische Zuordnung transparent ab und ist im Deutschen natürlicher und eindeutiger als „der chaldäische König“.
theological_decisions: []
translation_notes:
