source:
  edition: WLC
  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: de
  text: Du aber, sein Sohn[a], Belschazzar, hast dein Herz nicht gedemütigt, obwohl du dies alles wusstest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Wort für „Sohn“ kann hier auch „Nachkomme“ oder „Nachfolger“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַנְתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen stellt Belsazar nachdrücklich Nebukadnezar gegenüber; „Du aber“ gibt diesen Gegensatz in natürlichem, würdigem Deutsch wieder.
- source_word: בְּרֵהּ
  choice: sein Sohn
  rationale: Die direkte Wiedergabe bewahrt den aramäischen Verwandtschafts- beziehungsweise Dynastiebegriff; dessen mögliche weitere Bedeutung wird in der Fußnote offengehalten.
- source_word: בֵּלְשַׁאצַּר
  choice: Belsazar
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לָא הַשְׁפֵּלְתְּ לִבְבָךְ
  choice: hast dein Herz nicht gedemütigt
  rationale: Die Formulierung erhält das biblische Bild des Herzens als Zentrum von Willen, Einsicht und Haltung und gibt das Verb als bewusstes Sich-Demütigen wieder.
- source_word: כָּל־קֳבֵל דִּי
  choice: obwohl
  rationale: 'Im Kontext bezeichnet die Wendung einen Gegensatz: Belsazar demütigte sich nicht, obwohl er von den vorausgegangenen Ereignissen wusste.'
- source_word: כָל־דְּנָה יְדַעְתָּ
  choice: du dies alles wusstest
  rationale: Die Übersetzung verweist knapp und natürlich auf die zuvor geschilderten Ereignisse um Nebukadnezar.
theological_decisions:
- issue: Bedeutung von „sein Sohn“ im Verhältnis zwischen Nebukadnezar und Belsazar
  choice: „sein Sohn“ im Haupttext beibehalten
  alternative: „sein Nachkomme“ oder „sein Nachfolger“
  rationale: Das aramäische Wort kann außer einem leiblichen Sohn auch einen Nachkommen oder dynastischen Nachfolger bezeichnen. Der Haupttext bewahrt die Ausgangsformulierung, ohne die historische Beziehung stillschweigend festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem biblischem Register. Die Satzstellung „Du aber“ trägt den starken Kontrast; „obwohl“ macht den konzessiven Zusammenhang klar, ohne ihn zu überdeuten.
