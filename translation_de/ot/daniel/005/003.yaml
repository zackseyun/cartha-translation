base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: de
  text: Da brachte man die goldenen Gefäße herein, die man aus dem Tempel, dem Haus Gottes in Jerusalem, herausgebracht hatte.[a] Der König und seine Würdenträger, seine Frauen[b] und seine Nebenfrauen tranken daraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie aus dem Tempel, dem Haus Gottes in Jerusalem, herausgebracht hatten“. Das aramäische Verb ist aktiv; die Handelnden werden jedoch nicht näher bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: Das aramäische Wort kann königliche Gemahlinnen bezeichnen; manche übersetzen „Königinnen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis in der Handlung ein; „Da“ ist im Deutschen natürlich und wahrt die zeitliche Abfolge.
- source_word: הַיְתִיו
  choice: brachte man ... herein
  rationale: Mit den goldenen Gefäßen als Objekt bezeichnet das Verb ihr Hereinbringen. Das unpersönliche „man“ gibt den nicht genannten Handlungsträger wieder.
- source_word: מָאנֵי דַהֲבָא
  choice: die goldenen Gefäße
  rationale: „Gefäße“ passt zu den für den Tempeldienst bestimmten Gegenständen und ist präziser als das allgemeinere „Gegenstände“.
- source_word: דִּי הַנְפִּקוּ
  choice: die man ... weggenommen hatte
  rationale: Die aktive Verbform wird als unpersönliche Handlung wiedergegeben, da der aramäische Text keinen bestimmten Täter nennt. Das Plusquamperfekt markiert die Vorzeitigkeit.
- source_word: מִן הֵיכְלָא דִּי בֵית אֱלָהָא דִּי בִירוּשְׁלֶם
  choice: aus dem Tempel, dem Haus Gottes in Jerusalem
  rationale: „Tempel“ gibt הֵיכְלָא im Jerusalemer Kontext klar wieder; „dem Haus Gottes“ bleibt als erklärende Apposition erhalten, und die Ortsangabe wird natürlich angeschlossen.
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: tranken daraus
  rationale: Die Präposition bezeichnet hier den Gebrauch der Gefäße als Trinkgefäße; „daraus trinken“ ist die natürliche deutsche Formulierung.
- source_word: רַבְרְבָנוֹהִי
  choice: seine Würdenträger
  rationale: Der Ausdruck bezeichnet hochrangige Männer oder Amtsträger am Königshof; „Würdenträger“ ist verständlich, würdevoll und kontextgerecht.
- source_word: שֵׁגְלָתֵהּ
  choice: seine Frauen
  rationale: Der Ausdruck bezeichnet königliche Ehefrauen beziehungsweise Gemahlinnen. „Frauen“ ist transparent und vermeidet die mögliche Engführung von „Königinnen“ auf eine oder mehrere Hauptköniginnen.
- source_word: וּלְחֵנָתֵהּ
  choice: seine Nebenfrauen
  rationale: Der Ausdruck bezeichnet Frauen von nachgeordnetem ehelichem beziehungsweise höfischem Status. „Nebenfrauen“ ist in modernem Deutsch verständlicher als „Konkubinen“, ohne den Rangunterschied zu verwischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die kultische Bezeichnung „Gefäße“ und die Apposition „Haus Gottes“ bleiben erhalten. Der nicht genannte Handlungsträger wird idiomatisch durch „man“ wiedergegeben.
