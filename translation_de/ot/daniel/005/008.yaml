id: DAN.5.8
reference: Daniel 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱדַ֨יִן֙ עללין כֹּ֖ל חַכִּימֵ֣י מַלְכָּ֑/א וְ/לָֽא כָהֲלִ֤ין כְּתָבָ/א֙ לְ/מִקְרֵ֔א ו/פשר/א לְ/הוֹדָעָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/008.yaml
  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: de
  text: Da kamen alle Weisen des Königs herein; aber sie konnten die Schrift[a] weder lesen noch dem König ihre Deutung[b] mitteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Inschrift“. Der aramäische Ausdruck kann das Geschriebene beziehungsweise die schriftliche Botschaft selbst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Bedeutung“. Das aramäische Wort für „Deutung“ wird im Buch Daniel wiederholt für die Erklärung einer geheimnisvollen Botschaft oder eines Traums gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das nächste Ereignis ein; „Da“ wahrt den natürlichen Erzählfluss.
- source_word: עללין
  choice: kamen ... herein
  rationale: Die Pluralform bezeichnet das Eintreten der Weisen, wahrscheinlich vor den König; „kamen herein“ ist im Deutschen natürlich.
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: alle Weisen des Königs
  rationale: Die Status-constructus-Verbindung bezeichnet die Gesamtheit der dem König zugeordneten Weisen.
- source_word: וְלָא כָהֲלִין
  choice: aber sie konnten ... weder ... noch
  rationale: Die verneinte Form drückt Unvermögen aus; „aber“ gibt den Gegensatz zwischen ihrem Eintreten und ihrem Scheitern wieder. Die deutsche weder-noch-Konstruktion verbindet beide unerfüllten Aufgaben klar.
- source_word: כְּתָבָא לְמִקְרֵא
  choice: die Schrift zu lesen
  rationale: כְּתָבָא kann das Geschriebene, die Schrift oder die Inschrift bezeichnen. „die Schrift“ bleibt relativ breit und passt zum sichtbaren Schriftzeichen an der Wand.
- source_word: וּפִשְׁרָא
  choice: ihre Deutung
  rationale: פְּשַׁר ist in Daniel ein wiederkehrender Ausdruck für die Deutung eines geheimnisvollen Traums oder einer Botschaft. Das Pronomen bezieht die Deutung auf die Schrift.
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: dem König ... mitteilen
  rationale: Der Kausativinfinitiv von ידע bedeutet „wissen lassen/bekannt machen“. „mitteilen“ ist idiomatisch, würdig und erhält den Sinn der Bekanntgabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am aramäischen Ablauf, während „weder ... noch“ das zweifache Unvermögen idiomatisch ausdrückt. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
