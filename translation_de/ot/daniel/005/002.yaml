  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: de
  text: Als Belsazar den Wein kostete,[a] befahl er, die goldenen und silbernen Gefäße herbeizubringen, die Nebukadnezar, sein Vater,[b] aus dem Tempel in Jerusalem weggenommen hatte, damit der König, seine Würdenträger, seine Frauen und seine Nebenfrauen daraus trinken sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als der Wein auf ihn wirkte«; die aramäische Wendung lautet wörtlich »beim Geschmack des Weines«.'
    reason: lexical_alternative
  - marker: b
    text: Aramäisch »sein Vater«; im königlichen Sprachgebrauch kann damit auch »sein Vorfahr« oder »sein Vorgänger« gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: befahl
  rationale: Das Verb bedeutet grundsätzlich »sagen«, leitet hier jedoch mit לְהַיְתָיָה eine Anweisung ein. »Befahl« gibt diese performative Funktion im Deutschen knapp und natürlich wieder.
- source_word: בִּטְעֵם חַמְרָא
  choice: als er den Wein kostete
  rationale: Die Wendung lautet wörtlich »beim Geschmack des Weines«. Die Übersetzung bewahrt das konkrete Bild und lässt offen, ob zugleich ein Einfluss des Weines gemeint ist; diese Möglichkeit wird in der Fußnote genannt.
- source_word: לְהַיְתָיָה
  choice: herbeizubringen
  rationale: Die Kausativform bezeichnet das Veranlassen, dass die Gefäße an den Ort des Festmahls gebracht werden. »Herbeibringen« ist im Zusammenhang idiomatisch.
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: die goldenen und silbernen Gefäße
  rationale: מָאנֵי ist eine breite Bezeichnung für Gefäße oder Geräte. »Gefäße« wahrt den kultischen Zusammenhang, ohne den Ausdruck vorschnell auf Trinkbecher einzuengen.
- source_word: הַנְפֵּק
  choice: weggenommen hatte
  rationale: Das Verb bedeutet »hinausbringen« oder »herausnehmen«. »Weggenommen hatte« macht im Deutschen deutlich, dass die Tempelgefäße aus Jerusalem entfernt worden waren.
- source_word: אֲבוּהִי
  choice: sein Vater
  rationale: Die Übersetzung hält am wörtlichen Verwandtschaftsausdruck fest. Dessen mögliche weitere Bedeutung im königlichen Sprachgebrauch wird in einer Fußnote erläutert.
- source_word: הֵיכְלָא
  choice: Tempel
  rationale: Im ausdrücklichen Bezug auf Jerusalem ist »Tempel« die klare und übliche Bedeutung.
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: damit … daraus tranken
  rationale: Der Imperfekt bezeichnet hier den mit dem Herbeibringen beabsichtigten Zweck. Ein deutscher damit-Satz gibt diesen Zusammenhang natürlich wieder.
- source_word: רַבְרְבָנוֹהִי
  choice: seine Großen
  rationale: Der Ausdruck bezeichnet hochrangige Männer beziehungsweise Würdenträger am Hof. »Seine Großen« ist würdig, verständlich und weniger institutionell festgelegt als »Adlige«.
- source_word: שֵׁגְלָתֵהּ
  choice: seine Frauen
  rationale: Das Wort bezeichnet die königlichen Frauen oder Gemahlinnen. »Frauen« ist breit genug und behauptet nicht, jede habe den formalen Rang einer Königin getragen.
- source_word: לְחֵנָתֵהּ
  choice: seine Nebenfrauen
  rationale: Gemeint sind Frauen des königlichen Haushalts mit einem niedrigeren Status als die Hauptfrauen. »Nebenfrauen« ist im modernen Deutschen verständlicher als das fachsprachlichere »Konkubinen«.
theological_decisions:
- issue: Königliche Verwandtschaftsbezeichnung für Nebukadnezar
  choice: Die wörtliche Wiedergabe »sein Vater« bleibt im Haupttext stehen.
  alternative: »sein Vorfahr« oder »sein Vorgänger«
  rationale: Das Aramäische verwendet den gewöhnlichen Ausdruck für »Vater«, der im königlichen Sprachgebrauch auch weiter gefasst sein kann. Der Haupttext bewahrt die Formulierung der Quelle, während die Fußnote die historische und idiomatische Spannweite offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem aramäischen Zweckzusammenhang, bleibt aber flüssig. Die Fußnotenmarker stehen jeweils unmittelbar bei der sprachlich erklärten Stelle; damit werden die im englischen Konsultationstext offenbar vertauschten Marker nicht übernommen.
