  text: דְּנָ֖ה פְּשַֽׁר מִלְּתָ֑/א מְנֵ֕א מְנָֽה אֱלָהָ֥/א מַלְכוּתָ֖/ךְ וְ/הַשְׁלְמַֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: de
  text: 'Dies ist die Deutung der Botschaft[b]: MENE[a] – Gott hat dein Königreich gezählt und ihm ein Ende gesetzt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Wort MENE klingt wie das Verb mit der Bedeutung „gezählt“ oder „abgezählt“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Wortes“, „der Sache“ oder „der Inschrift“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Dies ist
  rationale: Das aramäische Demonstrativpronomen leitet Daniels Erklärung ein; die im Nominalsatz fehlende Kopula wird im Deutschen natürlich ergänzt.
- source_word: פְּשַׁר
  choice: Deutung
  rationale: Das Wort bezeichnet im Danielbuch regelmäßig die Auslegung rätselhafter Träume oder Schriftzeichen. „Deutung“ ist hier natürlich und präzise.
- source_word: מִלְּתָא
  choice: Botschaft
  rationale: Der Ausdruck kann „Wort“, „Sache“ oder hier die Schrift beziehungsweise Inschrift bezeichnen. „Botschaft“ gibt den Sinn der Wandinschrift als bedeutungstragende Mitteilung verständlich wieder; die sachlichen Alternativen bleiben in Fußnote [b] sichtbar.
- source_word: מְנֵא
  choice: MENE
  rationale: Das zu deutende Schriftwort bleibt als Transliteration stehen, damit die anschließende Wortdeutung erkennbar ist.
- source_word: מְנָה
  choice: hat … gezählt
  rationale: Das Verb erklärt MENE durch ein aramäisches Wortspiel. „Gezählt“ gibt die Grundbedeutung idiomatisch wieder; Fußnote [a] macht die im Deutschen nicht hörbare Lautverbindung deutlich.
- source_word: אֱלָהָא
  choice: Gott
  rationale: Die determinierte Form bezeichnet im Kontext Gott als Handelnden und wird im Deutschen ohne Artikel natürlich wiedergegeben.
- source_word: מַלְכוּתָךְ
  choice: dein Königreich
  rationale: Der Ausdruck kann Königsherrschaft, Regierungszeit oder Reich bezeichnen. „Königreich“ wahrt die konkrete politische und königliche Dimension, ohne sie auf die Regierungsdauer einzuengen.
- source_word: וְהַשְׁלְמַהּ
  choice: und ihm ein Ende gesetzt
  rationale: Das Verb bedeutet „vollenden, beenden“. Im Gerichtskontext bezeichnet es die Beendigung des Königreichs; „ihm ein Ende gesetzt“ vermeidet die im Deutschen mögliche positive Färbung von „vollendet“.
theological_decisions:
- issue: Art des göttlichen Handelns bei der Deutung von MENE
  choice: Gott hat das Königreich gezählt und ihm ein Ende gesetzt
  alternative: Gott hat die Tage des Königreichs gezählt und es beendet
  rationale: Der Text nennt ausdrücklich das Königreich, nicht dessen Tage. Die Übersetzung bewahrt daher das Bild des Zählens und die souveräne göttliche Gerichtsentscheidung, ohne ein nicht ausdrücklich genanntes Objekt einzufügen.
- issue: Bedeutungsumfang von מַלְכוּתָךְ
  choice: dein Königreich
  alternative: deine Königsherrschaft / deine Regierungszeit
  rationale: 'Die weitere Bedeutung bleibt erhalten: Das Urteil kann Herrschaft und Reich betreffen. Eine Festlegung allein auf Belsazars Regierungsdauer würde die Aussage unnötig verengen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und feierlich. MENE wird als Schriftwort großgeschrieben; der Gedankenstrich trennt die Inschrift von ihrer Deutung. Beide Fußnotenmarker stehen entsprechend der Vorgabe im Haupttext.
