source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: de
  text: Denn in Daniel, dem der König den Namen Beltschazzar gegeben hatte, fanden sich ein außergewöhnlicher Geist[a], Erkenntnis und Einsicht sowie die Fähigkeit, Träume zu deuten, Rätsel zu erklären und schwierige Probleme zu lösen[b]. Nun soll Daniel gerufen werden; er wird die Deutung bekannt geben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein überragender Geist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Knoten lösen« – ein Bild für das Bewältigen schwieriger Fragen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »er wird die Deutung aufzeigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: Denn
  rationale: Gibt den kausalen Anschluss an die vorausgehende Empfehlung natürlich und knapp wieder.
- source_word: רוּחַ יַתִּירָה
  choice: ein außergewöhnlicher Geist
  rationale: Bewahrt die Aussage eines herausragenden Geistes beziehungsweise einer außergewöhnlichen Befähigung, ohne ausdrücklich den Geist Gottes festzulegen.
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: Erkenntnis und Einsicht
  rationale: Hält die beiden aufeinanderfolgenden Weisheitsbegriffe unterscheidbar und klingt im modernen Deutschen natürlich.
- source_word: מְפַשַּׁר חֶלְמִין
  choice: Träume deuten
  rationale: Entspricht der üblichen und idiomatischen deutschen Ausdrucksweise.
- source_word: אַחֲוָיַת אֲחִידָן
  choice: Rätsel erklären
  rationale: Gibt das Bekanntmachen beziehungsweise Erhellen schwer verständlicher Aussagen im höfischen Weisheitskontext verständlich wieder.
- source_word: מְשָׁרֵא קִטְרִין
  choice: schwierige Probleme lösen
  rationale: Überträgt die wörtliche Metapher vom Lösen von Knoten idiomatisch, ohne ihren Sinn auf bloße Alltagsprobleme zu verengen.
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: dem der König den Namen Beltschazzar gegeben hatte
  rationale: Natürliches Deutsch für die aramäische Wendung, der König habe seinen Namen als Beltschazzar festgesetzt.
- source_word: יִתְקְרֵי
  choice: soll Daniel gerufen werden
  rationale: Bewahrt den passivisch-jussivischen Sinn und ist in modernem Deutsch klar.
- source_word: פִשְׁרָה יְהַחֲוֵה
  choice: er wird die Deutung bekannt geben
  rationale: Gibt das Kausativverb als Bekanntmachen der Deutung präzise und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von „Geist“ in der Beschreibung Daniels
  choice: außergewöhnlicher Geist, ohne nähere Bestimmung seiner Quelle
  alternative: ausdrücklicher Bezug auf den Geist Gottes
  rationale: Der Vers bezeichnet Daniels außergewöhnliche Befähigung, identifiziert diesen Geist hier jedoch nicht ausdrücklich als den Geist Gottes. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung rückt Daniel früh ins Zentrum und vermeidet eine im Deutschen schwer verständliche Häufung abstrakter Substantive. Der Name wird in der geläufigen deutschen Form »Beltschazzar« wiedergegeben.
