base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: de
  text: Dir, König, gab der höchste Gott Nebukadnezar, deinem Vater[a], Königtum, Größe, Ehre und Majestät.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „deinem Vorfahren“ oder „deinem Vorgänger“. Das aramäische Wort bedeutet wörtlich „deinem Vater“, kann in der Sprache königlicher Abstammung und Nachfolge aber weiter gefasst sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: אנתה מַלְכָּא
  choice: Du, König
  rationale: Das vorangestellte selbstständige Pronomen betont den Angesprochenen; die knappe Anrede wahrt diesen Nachdruck und den höfischen Rahmen, ohne das im heutigen Deutsch altertümliche „o König“.
- source_word: אֱלָהָא עִלָּיָא
  choice: der höchste Gott
  rationale: Gibt den aramäischen Gottestitel idiomatisch und würdevoll wieder.
- source_word: מַלְכוּתָא
  choice: Königtum
  rationale: Bezeichnet hier die Nebukadnezar persönlich verliehene Königsherrschaft beziehungsweise Königswürde, nicht vorrangig ein Herrschaftsgebiet.
- source_word: רְבוּתָא
  choice: Größe
  rationale: Bewahrt die allgemeine Bedeutung von Größe und hohem Rang innerhalb der Reihe königlicher Gaben.
- source_word: וִיקָרָא
  choice: Ehre
  rationale: Der Ausdruck kann Ehre, Herrlichkeit oder Ansehen bezeichnen; im königlichen Zusammenhang ist „Ehre“ natürlich und hält ihn vom folgenden Begriff der Majestät unterscheidbar.
- source_word: וְהַדְרָה
  choice: Majestät
  rationale: Gibt die Vorstellung königlicher Pracht und Hoheit in gehobenem, verständlichem Deutsch wieder.
- source_word: יְהַב
  choice: gab
  rationale: Entspricht dem schlichten aramäischen Verb des Gebens unmittelbar.
- source_word: לִנְבֻכַדְנֶצַּר
  choice: Nebukadnezar
  rationale: Verwendet die im Deutschen geläufige Namensform.
- source_word: אֲבוּךְ
  choice: deinem Vater
  rationale: Bewahrt den wörtlichen Verwandtschaftsbegriff; dessen mögliche weitere dynastische Bedeutung wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung von „deinem Vater“ in königlich-dynastischer Sprache
  choice: Die wörtliche Wendung „deinem Vater“ bleibt im Haupttext erhalten.
  alternative: „deinem Vorfahren“ oder „deinem Vorgänger“
  rationale: Der Ausgangstext verwendet den gewöhnlichen Ausdruck für „Vater“, der in dynastischer Sprache jedoch auch einen Vorfahren oder königlichen Vorgänger bezeichnen kann. Die Übersetzung löst diese historische und genealogische Spannung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der betonten Anrede macht die aramäische Voranstellung natürlich erkennbar. Die Reihung „Königtum, Größe, Ehre und Majestät“ bewahrt den feierlichen höfischen Klang.
