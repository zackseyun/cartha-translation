base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: de
  text: 'Darauf wurde Daniel vor den König gebracht. Der König antwortete und sagte zu Daniel: »Bist du jener Daniel, einer von den Verschleppten aus Juda, den der König, mein Vater[a], aus Juda weggeführt hat?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Vorgänger“. Im königlichen Sprachgebrauch kann „Vater“ einen Vorfahren oder einen früheren König bezeichnen, nicht nur den unmittelbaren leiblichen Vater.'
    reason: Kulturgeschichtliche Erläuterung zum weiteren Gebrauch der königlichen Verwandtschaftsbezeichnung.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Darauf
  rationale: Der aramäische Erzählmarker leitet das nächste Geschehen in der Abfolge ein. „Darauf“ gibt diesen Anschluss in natürlichem modernem Deutsch wieder.
- source_word: הֻעַל
  choice: wurde … gebracht
  rationale: Die passive Kausativform zeigt, dass andere Daniel in die Gegenwart des Königs bringen. Im Deutschen genügt zusammen mit „vor den König“ die natürliche Formulierung „wurde … gebracht“.
- source_word: קֳדָם מַלְכָּא
  choice: vor den König
  rationale: Die Wendung bezeichnet das Erscheinen in der Gegenwart des Königs und wird im Deutschen knapp und idiomatisch mit „vor den König“ wiedergegeben.
- source_word: עָנֵה ... וְאָמַר
  choice: ergriff das Wort und sagte
  rationale: Die beiden Verben der semitischen Redeformel bleiben sinngemäß erkennbar, ohne die im heutigen Deutsch schwerfällige Wendung „antwortete und sprach“ zu verwenden.
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: Bist du Daniel
  rationale: Der Zusammenhang verlangt eine identifizierende Frage. Das Deutsche drückt sie natürlich durch die Wortstellung der Entscheidungsfrage aus; ein zusätzliches „jener“ wäre unnötig distanzierend.
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: einer von den Verschleppten aus Juda
  rationale: Wörtlich steht „von den Söhnen/Angehörigen der Verbannung Judas“. „Verschleppte“ bezeichnet verständlich die deportierte judäische Gemeinschaft, ohne die Wendung unnatürlich zu verengen.
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: den der König, mein Vater, aus Juda weggeführt hat
  rationale: Die Übersetzung bewahrt die Bezeichnung „mein Vater“ und die Quellenangabe „aus Juda“. „Weggeführt“ bringt den Zusammenhang der Deportation klar zum Ausdruck.
theological_decisions:
- issue: Bedeutung von אַבִי („mein Vater“) in königlicher Rede
  choice: „mein Vater“ bleibt im Haupttext erhalten.
  alternative: „mein Vorgänger“
  rationale: Der aramäische Text sagt ausdrücklich „mein Vater“. In königlichem Sprachgebrauch kann „Vater“ auch einen Vorfahren oder früheren König bezeichnen; diese historische Spannung wird nicht durch eine interpretierende Ersetzung im Haupttext aufgelöst, sondern in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Erzählformel wird natürlich wiedergegeben; die Deportationsterminologie bleibt für heutige Leser verständlich. Die direkte Rede wahrt den identifizierenden Fragecharakter und die historisch mehrdeutige Bezeichnung „mein Vater“.
