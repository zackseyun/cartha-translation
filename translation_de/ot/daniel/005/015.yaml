id: DAN.5.15
reference: Daniel 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/כְעַ֞ן הֻעַ֣לּוּ קָֽדָמַ֗/י חַכִּֽימַיָּ/א֙ אָֽשְׁפַיָּ֔/א דִּֽי כְתָבָ֤/ה דְנָה֙ יִקְר֔וֹן וּ/פִשְׁרֵ֖/הּ לְ/הוֹדָעֻתַ֑/נִי וְ/לָֽא כָהֲלִ֥ין פְּשַֽׁר מִלְּתָ֖/א לְ/הַחֲוָיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: de
  text: Und nun wurden die Weisen, die Beschwörer, vor mich gebracht, damit sie diese Schrift lesen und mir ihre Deutung mitteilen; doch sie waren nicht imstande, die Deutung der Sache darzulegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכִּימַיָּא
  choice: die Weisen
  rationale: Die übliche und kontextgerechte Bezeichnung für die gelehrten Weisen am babylonischen Hof.
- source_word: אָשְׁפַיָּא
  choice: die Beschwörer
  rationale: Gibt die Bezeichnung für ritualkundige Beschwörer präziser wieder als das weiter gefasste „Zauberer“.
- source_word: כְתָבָה דְנָה
  choice: diese Schrift
  rationale: Bewahrt den konkreten Bezug auf das Geschriebene an der Wand; „Schrift“ ist hier natürlich und würdevoll.
- source_word: פִשְׁרֵהּ
  choice: ihre Deutung
  rationale: Das aramäische Wort bezeichnet die erschließende Deutung beziehungsweise Auslegung der Schrift.
- source_word: פְּשַׁר מִלְּתָא
  choice: die Deutung der Sache
  rationale: מִלְּתָא kann „Wort“, „Angelegenheit“ oder „Sache“ bedeuten. „Sache“ wahrt die Offenheit und vermeidet eine unnötige Festlegung auf „Botschaft“.
- source_word: לְהַחֲוָיָה
  choice: darzulegen
  rationale: Gibt das Zeigen beziehungsweise Offenlegen der Deutung idiomatisch wieder und unterscheidet es stilistisch vom vorherigen „mitteilen“.
theological_decisions:
- issue: Art der gesuchten Deutung
  choice: Deutung
  alternative: Auslegung
  rationale: „Deutung“ lässt offen, ob es um sprachliche Entzifferung, prophetische Bedeutung oder beides geht, und erhält damit die Spannung des Kontexts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem aramäischen Gedankengang, ohne im Deutschen schwerfällig zu wirken; die höfische und erzählerische Diktion bleibt erhalten.
