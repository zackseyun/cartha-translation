  text: בֵּלְשַׁאצַּ֣ר מַלְכָּ֗/א עֲבַד֙ לְחֶ֣ם רַ֔ב לְ/רַבְרְבָנ֖וֹ/הִי אֲלַ֑ף וְ/לָ/קֳבֵ֥ל אַלְפָּ֖/א חַמְרָ֥/א שָׁתֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: de
  text: König Belsazar veranstaltete für tausend seiner Würdenträger ein großes Festmahl, und in Gegenwart der Tausend trank er Wein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und trank vor den Tausend Wein«. Die aramäische Wendung heißt wörtlich »vor«; hier meint sie wahrscheinlich, dass er öffentlich in Gegenwart der tausend Gäste trank.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: König
  rationale: Der bestimmte Status steht appositionell beim Eigennamen. Im Deutschen ist die natürliche Form »König Belsazar«.
- source_word: עֲבַד
  choice: veranstaltete
  rationale: Das Verb bedeutet grundsätzlich »tun/machen«; in Verbindung mit einem Festmahl gibt »veranstaltete« den kontextuellen Sinn natürlich und präzise wieder.
- source_word: לְחֶם רַב
  choice: ein großes Festmahl
  rationale: לְחֶם bezeichnet wörtlich Brot beziehungsweise Speise, kann im Kontext jedoch ein Festmahl bezeichnen. »Großes Festmahl« bewahrt das Adjektiv רַב und passt zum höfischen Anlass.
- source_word: לְרַבְרְבָנֹוהִי
  choice: für tausend seiner Würdenträger
  rationale: Das Wort bezeichnet hochrangige Männer beziehungsweise Amtsträger. »Würdenträger« ist modern, verständlich und vermeidet eine unnötig feudale Festlegung.
- source_word: אֲלַף
  choice: tausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: וְלָקֳבֵל
  choice: und vor den Augen der
  rationale: Die Wendung bedeutet »vor«, »gegenüber« oder »in Gegenwart von«. Hier vermittelt »vor den Augen« sowohl die räumliche Grundbedeutung als auch das öffentliche Trinken in Gegenwart der Gäste.
- source_word: חַמְרָא
  choice: Wein
  rationale: Die übliche deutsche Entsprechung des aramäischen Wortes.
- source_word: שָׁתֵה
  choice: trank
  rationale: Das Partizip beschreibt die Handlung als im Gang befindlich. Im deutschen Erzählstil kann das Präteritum diesen Verlauf natürlich ausdrücken, ohne eine künstliche Verlaufsform zu verwenden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Festmahl« und »Würdenträger« geben das höfische Umfeld verständlich wieder; die Wortstellung hält den Bezug von »tausend« eindeutig bei den Gästen. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen präpositionalen Wendung.
