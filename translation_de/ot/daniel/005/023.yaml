source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: de
  text: Du aber hast dich gegen den Herrn des Himmels[a] erhoben. Die Gefäße seines Hauses wurden vor dich gebracht, und du, deine Würdenträger, deine Frauen und deine Nebenfrauen habt Wein daraus getrunken. Die Götter aus Silber und Gold, Bronze, Eisen, Holz und Stein, die weder sehen noch hören noch wissen, hast du gepriesen. Aber den Gott, in dessen Hand dein Atem[b] ist und dem alle deine Wege gehören, hast du nicht geehrt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gebieter des Himmels“.'
    reason: lexical_alternative
  - marker: b
    text: „Atem“ kann hier den Lebensatem und damit das Leben selbst bezeichnen.
    reason: semantic_clarification
  - marker: c
    text: 'Oder: „verherrlicht“ beziehungsweise „ihm keine Ehre gegeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: der Herr des Himmels
  rationale: מָרֵא bezeichnet einen Herrn oder Gebieter. „Herr des Himmels“ ist im Deutschen ein natürlicher, erhabener Gottestitel und bewahrt den Singular des Ausdrucks.
- source_word: הִתְרוֹמַמְתָּ
  choice: hast dich … erhoben
  rationale: Der reflexive Stamm bezeichnet selbstüberhebliches Sich-Erheben; die Verbindung mit „über“ gibt zugleich die gegen Gott gerichtete Anmaßung wieder.
- source_word: מָאנַיָּא דִי בַיְתֵהּ
  choice: die Gefäße seines Hauses
  rationale: Die konkrete Bedeutung „Gefäße“ und die wörtliche Bezeichnung des Tempels als Gottes „Haus“ bleiben erhalten.
- source_word: רַבְרְבָנַיִךְ
  choice: deine Würdenträger
  rationale: Gemeint sind hochgestellte Männer am Königshof. „Würdenträger“ ist präzise und in modernem Standarddeutsch verständlich.
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: deine Frauen und deine Nebenfrauen
  rationale: Die beiden Ausdrücke unterscheiden königliche Ehefrauen beziehungsweise Gemahlinnen von Frauen niedrigeren ehelichen Ranges; „Nebenfrauen“ ist klarer und weniger historisch belastet als „Konkubinen“.
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: habt Wein daraus getrunken
  rationale: Das Partizip beschreibt die im Festgeschehen vollzogene Handlung. Das deutsche Perfekt ist hier natürlich; „daraus“ gibt den instrumentalen Bezug auf die Gefäße wieder.
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: die Götter aus Silber und Gold, Bronze, Eisen, Holz und Stein
  rationale: „Aus“ macht im Deutschen natürlich deutlich, dass die genannten Stoffe das Material der Götzenbilder sind.
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: die weder sehen noch hören noch erkennen
  rationale: Die dreigliedrige Aussage über die Ohnmacht der Götzen bleibt erhalten. „Erkennen“ gibt יְדַע hier idiomatisch wieder, ohne es auf bloßes intellektuelles Wissen zu verengen.
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: den Gott, in dessen Hand dein Atem ist
  rationale: Die konkrete Metapher der göttlichen Verfügung über das Leben wird ohne erklärende Erweiterung bewahrt.
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: dem alle deine Wege gehören
  rationale: Die aramäische Dativkonstruktion drückt Zugehörigkeit beziehungsweise Verfügungsgewalt aus. „Wege“ bewahrt die Bildsprache und ihre mögliche Spannweite von Lebensführung bis Lebensgeschick.
- source_word: לָא הַדַּרְתָּ
  choice: hast du nicht geehrt
  rationale: Das Verb kann ehren oder verherrlichen bedeuten. „Geehrt“ ist direkt, natürlich und vermeidet eine unnötige kultische Verengung.
theological_decisions:
- issue: Göttlicher Titel מָרֵא
  choice: Herr des Himmels
  alternative: Gebieter des Himmels
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Herr“ bezeichnet hier angemessen Gottes Souveränität, ohne eine weitergehende christologische Festlegung in den Text einzutragen.
- issue: Gottes Herrschaft über menschliches Leben
  choice: „in dessen Hand dein Atem ist“ und „dem alle deine Wege gehören“ konkret beibehalten
  alternative: „der über dein Leben und dein Schicksal verfügt“
  rationale: Die Übersetzung bewahrt die beiden unterschiedlichen Bilder des Ausgangstextes und lässt offen, ob „Wege“ vor allem Verhalten, Lebenslauf oder Geschick bezeichnet.
- issue: Gegensatz zwischen Götzen und Gott
  choice: Die Götzen können weder sehen, hören noch erkennen; Gott hält den Atem und verfügt über die Wege des Königs
  alternative: Die Götzen als „leblos“ zusammenfassend bezeichnen
  rationale: Die ausdrücklich gestufte Polemik des Verses bleibt erhalten und wird nicht zu einer theologischen Zusammenfassung geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die kultische Bildwelt („Gefäße“, „Haus“) und die konkreten Metaphern („Atem“, „Wege“) wurden bewahrt; historisch schwer verständliche Hofbegriffe wurden behutsam als „Würdenträger“ und „Nebenfrauen“ wiedergegeben.
