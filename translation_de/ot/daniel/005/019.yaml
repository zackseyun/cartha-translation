source:
  edition: WLC
  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: de
  text: Und wegen der Größe, die er ihm verliehen hatte,[a] zitterten alle Völker, Nationen und Sprachen und fürchteten sich vor ihm. Wen er wollte, tötete er; wen er wollte, ließ er am Leben; wen er wollte, erhöhte er; und wen er wollte, erniedrigte er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „er ihm verliehen hatte“ ist Gott, auf den der vorhergehende Vers zurückverweist.
    reason: cross_reference
lexical_decisions:
- source_word: רְבוּתָא
  choice: Größe
  rationale: Das aramäische Substantiv bezeichnet Größe, Hoheit oder hohen Rang. „Größe“ wahrt die Breite des Ausdrucks und passt zur von Gott verliehenen königlichen Macht.
- source_word: יְהַב לֵהּ
  choice: die er ihm verliehen hatte
  rationale: Die aktive Form mit indirektem Objekt wird beibehalten. „Verliehen“ klingt bei königlicher Größe natürlich; das Plusquamperfekt ordnet die Gabe zeitlich vor der beschriebenen Reaktion ein.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: Völker, Nationen und Sprachen
  rationale: Die für Daniel typische Dreierformel bleibt vollständig erhalten. „Sprachen“ bezeichnet metonymisch die nach ihren Sprachen unterschiedenen Menschengruppen, ohne das Bild aufzulösen.
- source_word: זאעין וְדָחֲלִין
  choice: zitterten … und fürchteten sich
  rationale: Beide Partizipien werden wiedergegeben, damit die verstärkende Doppelung des Aramäischen erhalten bleibt.
- source_word: מִן קֳדָמוֹהִי
  choice: vor ihm
  rationale: Dies ist die knappe und idiomatische deutsche Wiedergabe für die Furcht in seiner Gegenwart beziehungsweise angesichts seiner Macht.
- source_word: דִּי הֲוָה צָבֵא
  choice: wen er wollte
  rationale: Die vierfache Wiederholung bildet den Nachdruck auf dem persönlichen Willen des Königs im Deutschen natürlich und prägnant ab.
- source_word: קָטֵל
  choice: tötete er
  rationale: Die direkte Wiedergabe erhält die Härte der Aussage.
- source_word: מַחֵא
  choice: ließ er am Leben
  rationale: Im Gegensatz zu „tötete“ bezeichnet das Kausativ das Erhalten beziehungsweise Gewähren des Lebens. „Ließ am Leben“ ist im Deutschen natürlich und bewahrt diese Gegenüberstellung.
- source_word: מָרִים
  choice: erhöhte er
  rationale: Das Verb bezeichnet wörtlich ein Erheben und hier die Erhöhung von Rang oder Stellung. „Erhöhte“ erhält zugleich den Gegensatz zu „erniedrigte“.
- source_word: מַשְׁפִּיל
  choice: erniedrigte er
  rationale: Das Verb bedeutet, jemanden niedrig zu machen oder herabzusetzen. „Erniedrigte“ ist modern, klar und bildet das Gegenstück zu „erhöhte“.
theological_decisions:
- issue: Handelndes Subjekt bei der Verleihung der Größe
  choice: Das Pronomen „er“ bleibt im Haupttext stehen; eine Fußnote identifiziert den Rückbezug auf Gott aus Vers 18.
  alternative: Im Haupttext ausdrücklich „die Gott ihm verliehen hatte“ zu schreiben.
  rationale: Im aramäischen Satz ist das Subjekt nicht erneut genannt, ergibt sich aber aus dem vorherigen Vers. So bleibt die grammatische Gestaltung des Quelltexts sichtbar, ohne den Bezug für Leser unklar zu lassen.
- issue: Umfang der königlichen Willkür
  choice: Die vier parallelen Aussagen werden ohne abschwächende Zusätze wiedergegeben.
  alternative: Die Aussagen ausdrücklich als nur von Gott zugelassene Handlungen zu qualifizieren.
  rationale: Der Vers schildert die tatsächlich ausgeübte Macht Nebukadnezars; eine ausdrückliche theologische Begrenzung innerhalb dieses Verses wäre ein Zusatz, auch wenn der Kontext die Macht als von Gott verliehen darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die vierfache Wiederholung von „wen er wollte“ bewahren den eindringlichen Rhythmus des aramäischen Textes. Die Dreierformel „Völker, Nationen und Sprachen“ bleibt bewusst formal erhalten.
