source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: de
  text: Aber ich habe über dich gehört, dass du Deutungen geben und schwierige Fragen lösen kannst.[a] Wenn du nun die Schrift lesen und mir ihre Deutung mitteilen kannst, wirst du in Purpur gekleidet werden, eine goldene Kette wird dir um den Hals gelegt werden, und du wirst als Dritter im Königreich herrschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Knoten lösen“; eine aramäische Redewendung für das Lösen schwieriger Probleme oder verworrener Fragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der dritte Herrscher im Königreich sein“. Gemeint ist wahrscheinlich der dritte Rang im Reich.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  choice: Aber ich
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen setzt einen persönlichen, leicht kontrastierenden Übergang in Belschazzars Rede.
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: Deutungen geben
  rationale: Die aramäische Verbindung aus Substantiv und Verb bezeichnet idiomatisch das Darlegen von Deutungen; die Mehrzahl bleibt erhalten.
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: Knoten lösen
  rationale: Die wörtliche Metapher ist auch im Deutschen verständlich und bewahrt das anschauliche aramäische Idiom; die Fußnote erläutert dessen Sinn.
- source_word: כְּתָבָא
  choice: die Schrift
  rationale: Gemeint ist die geheimnisvolle Schrift an der Wand. „Schrift“ ist prägnant und entspricht dem Erzählzusammenhang.
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: mir ihre Deutung mitteilen
  rationale: Diese Formulierung gibt sowohl den Inhalt „Deutung“ als auch das Bekanntmachen natürlich und würdig wieder.
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: du wirst in Purpur gekleidet werden
  rationale: Die passive Formulierung betont die Verleihung eines königlichen Ehrenzeichens und bewahrt „Purpur“ als Rangsymbol.
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: du wirst als Dritter im Königreich herrschen
  rationale: Die Wiedergabe wahrt die Rangangabe und die verbale Aussage des Herrschens, ohne die genaue Verwaltungsstruktur übermäßig festzulegen.
theological_decisions:
- issue: Bedeutung der Stellung als „Dritter“
  choice: als Dritter im Königreich herrschen
  alternative: der dritthöchste Herrscher im Königreich sein
  rationale: Der aramäische Ausdruck bezeichnet wahrscheinlich den dritten Rang, lässt aber offen, wie dieses Amt institutionell genau ausgestaltet war. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer bewusst beibehaltenen, anschaulichen Redewendung. Der höfische Ton der Verheißung wird durch die Futur- und Passivformen gewahrt.
