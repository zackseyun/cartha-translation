  text: וּ/דְנָ֥ה כְתָבָ֖/א דִּ֣י רְשִׁ֑ים מְנֵ֥א מְנֵ֖א תְּקֵ֥ל וּ/פַרְסִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/025.yaml
  text: 'And this is the inscription that was written: MENE[a], MENE, TEKEL[b], and PARSIN.'
translation:
  language: de
  text: 'Und dies ist die Schrift, die geschrieben wurde: MENE[a], MENE, TEKEL und PARSIN.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die aramäischen Wörter bleiben in Umschrift stehen, weil Daniel sie in den folgenden Versen durch Wortspiele deutet: MENE wird mit „gezählt“, TEKEL mit „gewogen“ und PARSIN beziehungsweise PERES mit „geteilt“ verbunden; PARSIN/PERES spielt zugleich auf die Perser an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְנָה
  choice: Und dies ist
  rationale: Bewahrt sowohl die aramäische Verknüpfung durch ו als auch die hinweisende Kraft von דְנָה und ergibt eine natürliche deutsche Einleitung.
- source_word: כְתָבָא
  choice: die Inschrift
  rationale: Bezeichnet hier die an der Wand sichtbar angebrachte Schriftbotschaft. „Inschrift“ ist kontextgemäß präziser als das allgemeinere „Schrift“ oder „Geschriebene“.
- source_word: דִּי רְשִׁים
  choice: die geschrieben wurde
  rationale: Gibt die Relativpartikel und die passive Verbform direkt und verständlich wieder, ohne die Aussage durch „eingraviert“ oder „aufgezeichnet“ zu verengen.
- source_word: מְנֵא מְנֵא
  choice: MENE, MENE
  rationale: Die Umschrift erhält die rätselhafte Form, die Wiederholung und das in den Folgeversen erklärte Wortspiel; eine sofortige Übersetzung würde der erzählten Deutung vorgreifen.
- source_word: תְּקֵל
  choice: TEKEL
  rationale: Die Umschrift bewahrt den Zusammenhang mit dem nachfolgenden Wortspiel um Wiegen und zugleich den möglichen Anklang an eine Gewichtseinheit.
- source_word: וּפַרְסִין
  choice: und PARSIN
  rationale: Das ausdrückliche ו wird mit „und“ wiedergegeben. PARSIN erhält die Form dieses Verses und bewahrt das Wortspiel mit Teilen sowie den Anklang an die Perser.
theological_decisions:
- issue: Deutung der rätselhaften Wörter
  choice: Die aramäischen Wörter werden unübersetzt in Umschrift wiedergegeben.
  alternative: Sie als „gezählt, gezählt, gewogen und geteilt“ oder als Gewichtseinheiten übersetzen.
  rationale: Der Text selbst lässt Daniel die Wörter anschließend durch Wortspiele deuten. Eine eindeutige Übersetzung an dieser Stelle würde die erzählerische Spannung beseitigen und ihre semantische Mehrdeutigkeit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und die feierliche Aufzählung bleiben erhalten. Die Schreibweise in Großbuchstaben kennzeichnet die überlieferte Inschrift und entspricht ihrer rätselhaften, formelhaften Wirkung.
