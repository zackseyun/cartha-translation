base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: de
  text: In diesem Augenblick kamen die Finger einer Menschenhand[a] hervor und schrieben gegenüber dem Leuchter[b] auf den Putz[c] der Wand des Königspalasts[d]. Der König sah die Handfläche[e], die schrieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Finger der Hand eines Mannes«. Das aramäische אֱנָשׁ kann »Mann« oder allgemeiner »Mensch« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor dem Leuchter«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »auf den Kalkputz« beziehungsweise »auf die Tünche« der Wand.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »im Saal des Königs«. Das aramäische Wort kann einen Palast oder einen großen Saal darin bezeichnen.'
    reason: lexical_alternative
  - marker: e
    text: Möglicherweise ist allgemeiner nur »die Hand« gemeint; die genaue Bedeutung von פַּס ist umstritten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: In diesem Augenblick
  rationale: Die aramäische Zeitangabe bezeichnet den unmittelbaren Zeitpunkt; die Formulierung ist natürlich und bewahrt die Plötzlichkeit.
- source_word: נפקו
  choice: kamen ... hervor
  rationale: Die Wiedergabe hält an der konkreten Bedeutung des Heraus- oder Hervorkommens fest und vermeidet das stärker deutende „erschienen“.
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: die Finger einer Menschenhand
  rationale: Die Konstruktverbindung wird idiomatisch wiedergegeben; „Menschenhand“ wahrt den Bezug auf etwas Menschliches, ohne unnötig einen bestimmten Mann vorauszusetzen.
- source_word: וְכָתְבָן
  choice: und schrieben
  rationale: Der Plural entspricht dem Subjekt „Finger“ und fügt sich in die erzählende Abfolge ein.
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: gegenüber dem Leuchter
  rationale: לָקֳבֵל bezeichnet eine Position gegenüber oder vor etwas; „gegenüber“ ist räumlich klar. נֶבְרַשְׁתָּא wird als Leuchter wiedergegeben.
- source_word: עַל גִּירָא
  choice: auf den Putz
  rationale: Das Substantiv bezeichnet den Kalkputz beziehungsweise die verputzte oder gekalkte Oberfläche; „Putz“ ist im Haupttext klar und geläufig.
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: der Wand im Palast des Königs
  rationale: Die Zugehörigkeitskette wird in natürlichem Deutsch ausgedrückt. הֵיכְלָא kann einen Palast oder einen großen Saal bezeichnen; der Haupttext wählt im königlichen Kontext „Palast“.
- source_word: וּמַלְכָּא חָזֵה
  choice: Der König sah
  rationale: Das historische Präsens beziehungsweise Partizip wird dem deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: פַּס יְדָה
  choice: die Handfläche der Hand
  rationale: Die ungewöhnliche und in ihrer genauen Bedeutung umstrittene Wendung bleibt sichtbar; „Handfläche“ gibt die häufig angenommene konkrete Bedeutung von פַּס wieder.
- source_word: דִּי כָתְבָה
  choice: die schrieb
  rationale: Der Relativsatz zeigt die Hand beim Schreiben; die knappe Form entspricht dem aramäischen Satzbau und ist im Deutschen natürlich.
