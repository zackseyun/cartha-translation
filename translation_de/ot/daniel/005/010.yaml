translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischem Erzählton. Die semitische Doppelwendung beim Redeauftakt wird sinngemäß, aber nicht überdeutet wiedergegeben. Beim letzten Satz bleibt die im Aramäischen vorhandene Offenheit zwischen allgemeiner Veränderung des Aussehens und konkretem Erbleichen erhalten.
