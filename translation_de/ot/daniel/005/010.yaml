base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: de
  text: 'Wegen der Worte des Königs und seiner Würdenträger kam die Königin in den Festsaal. Die Königin sagte[a]: »König, lebe ewig! Deine Gedanken sollen dich nicht erschrecken, und dein Aussehen soll sich nicht verändern[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »antwortete und sagte«. Die aramäische Wendung kann sowohl eine Antwort als auch allgemein den Beginn einer Äußerung einleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dein Glanz soll sich nicht verändern«. Gemeint ist die sichtbare Erscheinung beziehungsweise das Gesicht; im Zusammenhang kann eine durch Angst verursachte Veränderung der Gesichtsfarbe gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל
  choice: wegen
  rationale: Die Präposition bezeichnet hier am natürlichsten den Anlass oder Grund ihres Eintretens; »wegen« bewahrt diesen Zusammenhang knapp und direkt.
- source_word: מִלֵּי
  choice: Worte
  rationale: Der Plural bezeichnet im Kontext die Äußerungen beziehungsweise den hörbaren Aufruhr des Königs und seiner Würdenträger.
- source_word: רַבְרְבָנוֹהִי
  choice: seiner Würdenträger
  rationale: Das Wort bezeichnet hochrangige Männer am Hof. »Würdenträger« gibt Rang und Funktion in modernem, nicht archaischem Deutsch wieder.
- source_word: לְבֵית מִשְׁתְּיָא
  choice: in den Festsaal
  rationale: Wörtlich ist vom »Haus des Trinkgelages/Festes« die Rede; »Festsaal« bezeichnet den Ort des königlichen Banketts natürlich.
- source_word: עללת
  choice: kam ... in
  rationale: Das Verb bedeutet hineingehen oder eintreten. Die deutsche Wortstellung »kam ... in den Festsaal« ist flüssig und wahrt die Bewegungsrichtung.
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: ergriff das Wort und sagte
  rationale: Die aramäische Doppelwendung kann eine Antwort oder allgemein den Beginn einer Äußerung einleiten. »Ergriff das Wort und sagte« bewahrt den Redeauftakt, ohne zwingend eine direkte Frage an die Königin vorauszusetzen.
- source_word: לְעָלְמִין חֱיִי
  choice: O König, lebe ewig!
  rationale: Die übliche höfische Segensformel wird in würdigem und verständlichem Deutsch wiedergegeben.
- source_word: רַעְיוֹנָךְ
  choice: deine Gedanken
  rationale: Das Substantiv bezeichnet Gedanken oder innere Überlegungen; ihre erschreckende Wirkung wird gesondert durch das Verb ausgedrückt.
- source_word: יְבַהֲלוּךְ
  choice: sollen dich nicht erschrecken
  rationale: Das Verb bezeichnet heftiges Beunruhigen oder Erschrecken. Die Soll-Form gibt die verneinte Wunsch- beziehungsweise Aufforderungsform natürlich wieder.
- source_word: זִיוָיךְ
  choice: dein Aussehen
  rationale: Das Wort bedeutet wörtlich Glanz oder Erscheinung und bezieht sich hier idiomatisch auf das sichtbare Aussehen, besonders das Gesicht.
- source_word: יִשְׁתַּנּוֹ
  choice: soll sich nicht verändern
  rationale: Die Wiedergabe folgt dem Grundsinn »sich verändern« und vermeidet die mögliche, aber engere Festlegung auf Erbleichen.
