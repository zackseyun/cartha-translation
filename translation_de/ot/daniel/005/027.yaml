  naturalness: „Du bist auf der Waage gewogen und für zu leicht befunden worden“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „Waage/gewogen“ ist im Rahmen der bewusst beibehaltenen Bildsprache nicht störend, sondern prägnant.
