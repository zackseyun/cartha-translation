source:
  edition: WLC
  text: תְּקֵ֑ל תְּקִ֥ילְתָּה בְ/מֹֽאזַנְיָ֖/א וְ/הִשְׁתְּכַ֥חַתְּ חַסִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/027.yaml
  text: 'Tekel: you have been weighed in the balances and found lacking[a][b][c].'
translation:
  language: de
  text: 'Tekel: Du bist auf der Waage gewogen und für zu leicht befunden worden.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramäisch Tekel ist das Schriftwort, das Daniel deutet; es hängt mit dem Gedanken des Wiegens zusammen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den Waagschalen gewogen und als unzulänglich befunden worden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: Tekel
  rationale: Das aramäische Schriftwort wird als Eigenform des rätselhaften Zeichens bewahrt; die anschließende Deutung stellt den Bezug zum Wiegen her.
- source_word: תְּקִילְתָּה
  choice: Du bist … gewogen
  rationale: Die passive Form richtet sich an Belsazar. Das deutsche Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Bedeutung im Gerichtszusammenhang natürlich wieder.
- source_word: בְמֹאזַנְיָא
  choice: auf der Waage
  rationale: Die Wendung bezeichnet ein Wiegegerät. Der deutsche Singular ist idiomatisch und bewahrt das anschauliche Bild; auch „auf den Waagschalen“ ist möglich.
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: und … befunden worden
  rationale: Die Form bezeichnet das Ergebnis einer Prüfung. „Befunden worden“ passt im Deutschen zur wertenden und gerichtlichen Bildsprache.
- source_word: חַסִּיר
  choice: zu leicht
  rationale: Im Zusammenhang des Wiegens drückt „zu leicht“ den festgestellten Mangel anschaulich und idiomatisch aus, ohne die Metapher durch eine dogmatische Erklärung zu ersetzen.
theological_decisions:
- issue: Art der Gerichtsmetapher
  choice: Das göttliche Werturteil wird durch das Bild des Wiegens und des festgestellten Mangels ausgedrückt.
  alternative: Ausdeutende Wiedergabe wie „Gott hat dich gerichtet und für schuldig befunden“.
  rationale: Der Ausgangstext lässt die Bildsprache selbst sprechen. Die Übersetzung erklärt sie nicht zu einer umfassenderen dogmatischen Aussage aus.
- issue: Bedeutungsumfang von חַסִּיר
  choice: „zu leicht“ verbindet Mangel und Wiegebild.
  alternative: „mangelhaft“, „als unzulänglich“ oder „zu gering“.
  rationale: Die Wahl wahrt die Spannung zwischen konkretem Untergewicht und übertragenem moralisch-königlichem Ungenügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Du“ entspricht dem aramäischen Singular. „Auf der Waage gewogen“ ist bewusst bildhaft und allgemein verständlich; „zu leicht befunden“ erhält sowohl das Wiegebild als auch das Urteil über einen festgestellten Mangel.
