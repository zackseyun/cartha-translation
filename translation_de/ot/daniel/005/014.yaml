id: DAN.5.14
reference: Daniel 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: de
  text: Und ich habe über dich gehört, dass der Geist der Götter in dir ist[a] und dass Licht[b], Einsicht und außergewöhnliche Weisheit bei dir zu finden sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Geist Gottes« beziehungsweise »Gottes Geist«. Wörtlich steht im Aramäischen »der Geist der Götter«; dies entspricht der Ausdrucksweise des Königs.'
    reason: alternative_reading
  - marker: b
    text: '»Licht« meint hier bildlich geistige Klarheit; auch: »Erleuchtung« oder »Helligkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  choice: Und ich habe über dich gehört
  rationale: Das Perfekt berichtet, was dem König zu Ohren gekommen ist; das deutsche Perfekt passt zum mündlichen Zusammenhang. »Über dich« gibt עֲלָיִךְ natürlich wieder.
- source_word: דִּי
  choice: dass
  rationale: Die Partikel leitet hier den Inhalt dessen ein, was der König gehört hat.
- source_word: רוּחַ אֱלָהִין
  choice: der Geist der Götter
  rationale: אֱלָהִין ist formal Plural, und die Wiedergabe bewahrt die babylonische Ausdrucksweise des Königs. Die mögliche singularische Deutung wird in der Fußnote genannt.
- source_word: בָּךְ
  choice: in dir ist
  rationale: Direkte und natürliche Wiedergabe der lokalen Aussage.
- source_word: נַהִירוּ
  choice: Licht
  rationale: Das Substantiv bedeutet wörtlich Licht oder Helligkeit und bezeichnet hier bildlich geistige Klarheit; »Licht« bewahrt das Bild.
- source_word: שָׂכְלְתָנוּ
  choice: Einsicht
  rationale: »Einsicht« bezeichnet Verständnis und Urteilsvermögen und bleibt von »Weisheit« unterscheidbar.
- source_word: חָכְמָה יַתִּירָה
  choice: außergewöhnliche Weisheit
  rationale: יַתִּירָה kennzeichnet eine das gewöhnliche Maß übersteigende Weisheit.
- source_word: הִשְׁתְּכַחַת בָּךְ
  choice: bei dir zu finden sind
  rationale: Das Verb bedeutet »gefunden werden/vorhanden sein«; die deutsche Pluralform bezieht sich natürlich auf die aufgezählten Eigenschaften.
theological_decisions:
- issue: Singularische oder pluralische Wiedergabe von אֱלָהִין in der Rede des heidnischen Königs
  choice: der Geist der Götter
  alternative: der Geist Gottes / der Geist von Gott
  rationale: Die morphologisch plurale Form und die babylonische Sprecherperspektive sprechen für »Götter«. Die Fußnote bewahrt die traditionelle monotheistische Deutungsmöglichkeit, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext bleibt nahe an der aramäischen Bildsprache und wahrt zugleich einen natürlichen deutschen Satzbau. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
