source:
  edition: WLC
  text: בֵּ/אדַ֜יִן עָנֵ֣ה דָנִיֵּ֗אל וְ/אָמַר֙ קֳדָ֣ם מַלְכָּ֔/א מַתְּנָתָ/ךְ֙ לָ֣/ךְ לֶֽהֶוְיָ֔ן וּ/נְבָ֥זְבְּיָתָ֖/ךְ לְ/אָחֳרָ֣ן הַ֑ב בְּרַ֗ם כְּתָבָ/א֙ אֶקְרֵ֣א לְ/מַלְכָּ֔/א וּ/פִשְׁרָ֖/א אֲהוֹדְעִנֵּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: de
  text: 'Da antwortete Daniel und sagte vor dem König: »Deine Geschenke sollen dir bleiben, und deine Belohnungen gib einem anderen. Doch die Inschrift werde ich dem König vorlesen und ihm ihre Deutung bekannt machen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet die unmittelbar folgende Reaktion ein; »Da« wahrt den natürlichen Erzählfluss im Deutschen.
- source_word: עָנֵה ... וְאָמַר
  choice: antwortete ... und sagte
  rationale: Beide Verben des semitischen Erzählpaares bleiben sichtbar, ohne altertümlich zu klingen.
- source_word: קֳדָם מַלְכָּא
  choice: vor dem König
  rationale: Die Wendung bezeichnet Daniels Sprechen in der Gegenwart des Königs und bewahrt die höfische Szenerie.
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: Deine Geschenke sollen dir bleiben
  rationale: Die idiomatische deutsche Formulierung gibt sowohl den Besitzbezug als auch Daniels Ablehnung der angebotenen Gaben klar wieder.
- source_word: נְבָזְבְּיָתָךְ
  choice: deine Belohnungen
  rationale: Das Wort bezeichnet königliche Zuwendungen beziehungsweise Belohnungen und passt zum unmittelbaren Kontext.
- source_word: לְאָחֳרָן הַב
  choice: gib einem anderen
  rationale: Der substantivisch gebrauchte Singular wird entsprechend als »einem anderen« wiedergegeben.
- source_word: בְּרַם
  choice: Doch
  rationale: Die Konjunktion markiert den Gegensatz zwischen der Ablehnung der Belohnung und Daniels Bereitschaft, die Schrift zu deuten.
- source_word: כְּתָבָא
  choice: die Inschrift
  rationale: Im Kontext ist die rätselhafte Schrift an der Wand gemeint; »Inschrift« ist präzise und vermeidet eine mögliche Verwechslung mit der Heiligen Schrift.
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: werde ich dem König vorlesen
  rationale: »Vorlesen« gibt das Lesen für den König in natürlichem Deutsch wieder und erhält den ausdrücklich genannten Empfänger.
- source_word: פִשְׁרָא
  choice: ihre Deutung
  rationale: Der technische Ausdruck für die Auslegung einer rätselhaften Mitteilung wird mit »Deutung« wiedergegeben; das Pronomen stellt den Bezug zur Inschrift her.
- source_word: אֲהוֹדְעִנֵּהּ
  choice: ihm ... bekannt machen
  rationale: Die kausative Bedeutung »wissen lassen« und der pronominale Bezug auf den König bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die semitische Doppelung »antwortete ... und sagte« wurde aus formaler Rücksicht auf den Ausgangstext beibehalten; ansonsten ist der Satz idiomatisch und gut verständlich formuliert.
