  text: 'Then Daniel spoke with the king: “O king[a], live forever!”'
translation:
  language: de
  text: 'Da sagte Daniel zum König: »Der König lebe ewig!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Das aramäische Erzähladverb kennzeichnet die zeitliche Abfolge. »Da« ist im Deutschen ein natürlicher, würdiger Anschluss.
- source_word: דָּנִיֶּאל
  choice: Daniel
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bedeutet wörtlich »mit« und bezeichnet bei einem Verb des Sprechens den Angesprochenen. »sprach … mit dem König« bewahrt diese Formulierung.
- source_word: מַלְכָּא
  choice: dem König
  rationale: Das erste Vorkommen bezeichnet den Gesprächspartner und wird als bestimmtes Substantiv wiedergegeben.
- source_word: מַלִּל
  choice: sprach
  rationale: Das Peal-Perfekt bedeutet »sprechen/sagen«. »sprach« passt natürlich zur Präposition »mit«, ohne ein im Vers nicht ausdrücklich vorhandenes »antwortete« einzufügen.
- source_word: מַלְכָּא
  choice: O König
  rationale: Das zweite Vorkommen ist eine direkte Anrede. »O König« erhält den feierlichen Ton der königlichen Anrede.
- source_word: לְעָלְמִין
  choice: ewig
  rationale: Der Ausdruck bezeichnet eine unbegrenzt fortdauernde Zeit und gehört hier zu einer herkömmlichen königlichen Segensformel.
- source_word: חֱיִי
  choice: lebe
  rationale: Die Verbform ist Teil einer Segens- beziehungsweise Wunschformel. Der Imperativ »lebe« bewahrt die Form des Aramäischen; gemeint ist ein Wunsch.
