  source_fidelity: Der Entwurf gibt die Abfolge, Daniel als Sprecher, den König als Adressaten und die königliche Lebenswunschformel grundsätzlich zutreffend wieder. Das aramäische עִם kann bei einem Sprechverb den Adressaten bezeichnen; idiomatisches deutsches »zum König« bildet diese Funktion angemessen ab. Die Schlussformel ist im Aramäischen eine konventionelle Segens- bzw. Akklamationsformel.
  naturalness: »Da sprach Daniel mit dem König« klingt im modernen Standarddeutsch unnatürlich, zumal anschließend nur Daniels direkte Rede folgt; »sagte Daniel zum König« ist klar und idiomatisch. »O König, lebe ewig!« ist zwar nah an der Form, wirkt aber deutlich altertümlich. Die deutsche Formel »Der König lebe ewig!« gibt den höfischen Wunschcharakter natürlich und würdig wieder.
  terminology: »König« und »ewig leben« sind angemessen. Die Fußnote sollte nach der Umstellung nicht länger eine Haupttextform als Alternative ausgeben, sondern die wörtlichere Anredeform und den Formelcharakter erläutern.
