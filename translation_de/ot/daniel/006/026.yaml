id: DAN.6.26
reference: Daniel 6:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ/אדַ֜יִן דָּרְיָ֣וֶשׁ מַלְכָּ֗/א כְּ֠תַב לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: de
  text: Dann schrieb König Darius an alle Völker, Nationen und Sprachen, die auf der ganzen Erde wohnen:[a] »Euer Friede möge sich mehren!«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Auf der ganzen Erde« entspricht dem aramäischen Wortlaut; im Zusammenhang ist damit der gesamte Herrschaftsbereich des Darius gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Euer Wohlergehen möge zunehmen!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Dann
  rationale: Der aramäische Erzählmarker leitet das nächste Geschehen ein; »Dann« wahrt den natürlichen Erzählfluss.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: König Darius
  rationale: Die im Deutschen übliche Stellung des Herrschertitels vor dem Namen gibt den Sinn natürlich wieder.
- source_word: כְּתַב
  choice: schrieb
  rationale: Das Verb bezeichnet schlicht das Schreiben. Der Kontext ist zwar eine königliche Bekanntmachung, doch der Ausgangstext verwendet hier keinen spezielleren Ausdruck für einen Erlass.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: an alle Völker, Nationen und Sprachen
  rationale: Die feste Dreierformel bezeichnet die gesamte Vielfalt der Untertanen. »Sprachen« bleibt bewusst wörtlich, statt deutend zu »Sprachgruppen« erweitert zu werden.
- source_word: דִּי דארין
  choice: die … wohnen
  rationale: Der Relativsatz beschreibt die angesprochenen Gruppen. »Wohnen« ist verständlich und bewahrt den leicht gehobenen Ton einer königlichen Botschaft.
- source_word: בְּכָל אַרְעָא
  choice: auf der ganzen Erde
  rationale: אַרְעָא kann »Erde« oder »Land« bedeuten. Die Übersetzung bewahrt die umfassende Formulierung des aramäischen Textes, ohne sie im Haupttext auf das Reich einzuengen.
- source_word: שְׁלָמְכוֹן
  choice: Euer Friede
  rationale: Das Substantiv kann Frieden, Wohlergehen oder Heilsein bezeichnen. »Euer Friede« erhält das Possessivpronomen und passt zur Grußformel.
- source_word: יִשְׂגֵּא
  choice: möge sich mehren
  rationale: Das Verb bedeutet groß oder zahlreich werden beziehungsweise zunehmen. Die Wunschform gibt die königliche Grußformel natürlich und zugleich quellennah wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Ton passend zu einer königlichen Proklamation. Die imperiale Dreierformel und die umfassende Wendung »auf der ganzen Erde« bleiben erhalten; die Grußformel wird verständlich, aber nicht umgangssprachlich wiedergegeben.
