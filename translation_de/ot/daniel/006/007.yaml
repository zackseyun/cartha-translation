  text: אֱ֠דַיִן סָרְכַיָּ֤/א וַ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ אִלֵּ֔ן הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/כֵן֙ אָמְרִ֣ין לֵ֔/הּ דָּרְיָ֥וֶשׁ מַלְכָּ֖/א לְ/עָלְמִ֥ין חֱיִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: de
  text: 'Da traten diese obersten Beamten und Satrapen gemeinsam vor den König[a] und sagten zu ihm: »König Darius, lebe ewig!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »versammelten sich vor dem König«, »kamen einmütig zum König« oder »drängten sich zum König«. Die aramäische Wendung hebt das gemeinsame, abgestimmte Vorgehen hervor und kann im Zusammenhang eine verschwörerische Absicht anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »lebe für Zeitalter«. Dies ist eine übliche höfische Huldigung, keine Aussage, der König sei tatsächlich unsterblich.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Leitet in natürlichem deutschem Erzählstil den nächsten Vorgang zeitlich und folgerichtig ein.
- source_word: סָרְכַיָּא
  choice: obersten Beamten
  rationale: Bezeichnet hochrangige Amtsträger; die Wiedergabe macht ihren Rang verständlich, ohne einen modernen oder traditionsgebundenen Amtstitel einzutragen.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Der im Deutschen etablierte historische Fachbegriff bewahrt den persischen Verwaltungskontext.
- source_word: אִלֵּן
  choice: diese
  rationale: Das Demonstrativpronomen verweist auf die unmittelbar genannten Amtsträger.
- source_word: הַרְגִּשׁוּ עַל
  choice: traten … gemeinsam vor
  rationale: Bewahrt sowohl die gemeinsame, abgestimmte Annäherung als auch die höfische Situation, ohne eine lärmende oder verschwörerische Absicht im Haupttext festzulegen.
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: und sagten zu ihm
  rationale: Gibt die Redeeinleitung natürlich und vollständig wieder; das in וְכֵן enthaltene „so/folgendermaßen“ wird durch den anschließenden Doppelpunkt idiomatisch ausgedrückt.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: König Darius
  rationale: Im deutschen Vokativ steht der königliche Titel natürlich vor dem Namen.
- source_word: לְעָלְמִין חֱיִי
  choice: lebe ewig
  rationale: Natürliche deutsche Form der konventionellen höfischen Akklamation; die wörtliche Mehrzahlidee „für Zeitalter“ wird in der Fußnote erläutert.
