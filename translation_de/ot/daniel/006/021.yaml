  text: וּ/כְ/מִקְרְבֵ֣/הּ לְ/גֻבָּ֔/א לְ/דָ֣נִיֵּ֔אל בְּ/קָ֥ל עֲצִ֖יב זְעִ֑ק עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל דָּֽנִיֵּאל֙ עֲבֵד֙ אֱלָהָ֣/א חַיָּ֔/א אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א הַ/יְכִ֥ל לְ/שֵׁיזָבוּתָ֖/ךְ מִן אַרְיָוָתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: de
  text: 'Als er sich der Grube näherte, rief er Daniel mit bekümmerter Stimme zu. Der König sprach zu Daniel: »Daniel, Diener des lebendigen Gottes! Hat dein Gott, dem du beständig dienst, dich vor den Löwen retten können?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ
  choice: Als er sich … näherte
  rationale: Die Verbindung leitet einen temporalen Nebensatz ein; »sich nähern« gibt die konkrete Bewegung natürlich und genau wieder.
- source_word: גֻבָּא
  choice: Grube
  rationale: Das aramäische Wort bezeichnet eine Grube beziehungsweise Vertiefung. »Grube« bewahrt die räumliche Vorstellung des Erzählkontexts; »Löwengrube« wäre ebenfalls idiomatisch, ergänzt aber die Löwen bereits vor ihrer ausdrücklichen Nennung.
- source_word: בְּקָל עֲצִיב
  choice: mit bekümmerter Stimme
  rationale: עֲצִיב bezeichnet Kummer, Schmerz oder Betrübnis. »Bekümmert« ist im Deutschen natürlich und bringt die hörbare Sorge des Königs zum Ausdruck.
- source_word: זְעִק
  choice: rief … nach Daniel
  rationale: Das Verb bezeichnet lautes, dringliches Rufen. Die deutsche Verbindung »nach Daniel rufen« ist hier idiomatischer als eine starre Wiedergabe mit »zu Daniel«.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Der König sprach zu Daniel
  rationale: Die aramäische Redeformel wird in natürlichem Deutsch gestrafft. »Antwortete und sagte« könnte fälschlich eine unmittelbar vorausgehende Äußerung Daniels voraussetzen.
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: Diener des lebendigen Gottes
  rationale: עֲבֵד kann Diener oder Sklave bedeuten; hier steht die ehrenvolle, loyale Gottesbeziehung Daniels im Vordergrund.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: dem du beständig dienst
  rationale: פָּלַח bezeichnet besonders religiösen Dienst und kann auch »verehren« bedeuten. »Dienen« bewahrt den weiteren Bedeutungsumfang und die Verbindung mit »Diener«; בִּתְדִירָא bezeichnet fortgesetzte, regelmäßige Treue.
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: Hat … dich … retten können?
  rationale: Die Perfektform fragt nach der inzwischen erwiesenen Fähigkeit Gottes; das deutsche Perfekt mit Modalverb passt zum Zeitpunkt der Frage. »Retten« bezeichnet die konkrete Befreiung aus Lebensgefahr.
- source_word: מִן אַרְיָוָתָא
  choice: vor den Löwen
  rationale: Bei »retten« ist im Deutschen »vor den Löwen retten« idiomatisch und entspricht funktional dem aramäischen מן.
theological_decisions:
- issue: Daniels Verhältnis zu Gott in עֲבֵד אֱלָהָא
  choice: Diener des lebendigen Gottes
  alternative: Sklave des lebendigen Gottes
  rationale: Obwohl עֲבֵד beide Bedeutungen tragen kann, fungiert die Bezeichnung hier als Ausdruck treuer Zugehörigkeit und ehrenvollen Dienstes; der soziale Rechtsstatus eines Sklaven wird nicht hervorgehoben.
- issue: Bedeutungsumfang von פָּלַח
  choice: dem du beständig dienst
  alternative: den du beständig verehrst
  rationale: »Dienen« lässt sowohl tätige Loyalität als auch religiöse Verehrung anklingen und erhält die lexikalische Beziehung zu »Diener«, ohne den Ausdruck auf kultische Handlungen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede wird durch einen Ausruf abgesetzt, wodurch die emotionale Dringlichkeit der Frage natürlich hörbar wird. Keine Fußnoten sind nötig, da die wesentlichen Bedeutungsbreiten im Haupttext angemessen offenbleiben.
