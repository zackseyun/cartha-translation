  variant: modern standard German
source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: de
  text: 'Darauf sagten diese Männer: »Wir werden gegen diesen Daniel keinen Anklagegrund[a] finden, es sei denn, wir finden einen gegen ihn im Gesetz seines Gottes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: keinen Anlass zur Anklage.'
    reason: Lexikalische Alternative für כָּל עִלָּא; die Wendung kann sowohl den rechtlichen Grund als auch den Anlass zu einer Beschuldigung bezeichnen.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Darauf
  rationale: Das temporale beziehungsweise folgernde Adverb führt den nächsten Schritt der Erzählung ein; „Darauf“ gibt den Zusammenhang natürlich und knapp wieder.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer
  rationale: Die wörtliche Bezeichnung bleibt erhalten, ohne aus dem weiteren Kontext die spezifischere Amtsstellung einzutragen.
- source_word: אָמְרִין
  choice: sagten
  rationale: Das narrative Redeverb wird im Deutschen idiomatisch im Präteritum wiedergegeben.
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: Wir werden … nicht finden
  rationale: Der aramäische Imperfekt bezeichnet hier das von ihnen erwartete Ergebnis ihrer Suche.
- source_word: לְדָנִיֵּאל דְּנָה
  choice: gegen diesen Daniel
  rationale: Die Präposition hat im rechtlichen Zusammenhang adversative Bedeutung; der Demonstrativ bleibt mit seinem möglicherweise abschätzigen Unterton erhalten.
- source_word: כָּל עִלָּא
  choice: keinen Anklagegrund
  rationale: עִלָּא bezeichnet hier einen Anlass oder eine rechtliche Grundlage für eine Beschuldigung. „Anklagegrund“ ist im Deutschen präzise und verständlich.
- source_word: לָהֵן
  choice: es sei denn
  rationale: Die Konjunktion führt die einzige Ausnahme von der vorangehenden Feststellung ein.
- source_word: הַשְׁכַּחְנָה
  choice: wir finden einen
  rationale: Die Wiederholung des Verbs „finden“ bildet die Wiederholung derselben aramäischen Wurzel ab; „einen“ nimmt den Anklagegrund auf.
- source_word: עֲלוֹהִי
  choice: gegen ihn
  rationale: Die Wendung bezeichnet im Kontext einen gegen Daniel gerichteten Anklagegrund.
- source_word: בְּדָת אֱלָהֵהּ
  choice: im Gesetz seines Gottes
  rationale: דָת bezeichnet Gesetz oder Vorschrift; die Formulierung bewahrt sowohl die Präposition als auch die Zugehörigkeitsangabe des Ausgangstextes.
theological_decisions:
- issue: Großschreibung von אֱלָהֵהּ
  choice: seines Gottes
  alternative: seines Gottes / seines Gottes im generischen Sinn; orthografisch ist im Deutschen bei der Gottesbezeichnung ebenfalls Großschreibung üblich
  rationale: Im Erzählzusammenhang ist Daniels Gott als bestimmte Gottheit gemeint. Die Großschreibung entspricht zugleich der deutschen Orthografie und fügt keine weitergehende dogmatische Aussage hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht pointierte Formulierung „diesen Daniel“ und die Wiederholung von „finden“ wurden bewusst bewahrt; die rechtliche Aussage bleibt klar, ohne die Männer ausdrücklich als Amtsträger zu bezeichnen.
