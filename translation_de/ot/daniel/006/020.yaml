  text: Then the king arose at dawn[a], at first light[b], and in haste went to the den of the lions.
translation:
  language: de
  text: Da stand der König bei Tagesanbruch, sobald es hell wurde[a], auf und ging in großer Eile[b] zur Löwengrube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bei Tagesanbruch … als es hell wurde“. Der Vers verwendet zur Betonung zwei eng verwandte Ausdrücke für die Morgendämmerung.'
    reason: lexical_alternative
  - marker: b
    text: Der aramäische Ausdruck kann neben Hast auch Bestürzung oder angstvolle Dringlichkeit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מַלְכָּא
  choice: der König
  rationale: Die emphatische Form ist bestimmt und wird entsprechend mit dem bestimmten Artikel wiedergegeben.
- source_word: בִּשְׁפַּרְפָּרָא
  choice: beim Anbruch des Tages
  rationale: Die Wendung bezeichnet die frühe Morgendämmerung beziehungsweise den Tagesanbruch und bleibt von der folgenden Lichtangabe unterscheidbar.
- source_word: יְקוּם
  choice: stand ... auf
  rationale: Das Verb bezeichnet das Aufstehen oder Sich-Erheben; „stand auf“ ist im modernen Deutschen natürlich und bewahrt den erzählerischen Sinn.
- source_word: בְּנָגְהָא
  choice: im ersten Morgenlicht
  rationale: Der Ausdruck ist mit Licht beziehungsweise Helligwerden verbunden. Die eigenständige Wiedergabe erhält die emphatische Häufung zweier nah verwandter Zeitangaben.
- source_word: וּבְהִתְבְּהָלָה
  choice: und eilte voller Unruhe
  rationale: Das Substantiv kann Hast, Bestürzung oder aufgeregte Unruhe ausdrücken. Die Formulierung bewahrt sowohl die schnelle Bewegung als auch den möglichen emotionalen Unterton.
- source_word: לְגֻבָּא
  choice: zur Löwengrube
  rationale: Im Kontext bezeichnet der Ausdruck die Grube beziehungsweise das Gehege der Löwen; das deutsche Kompositum ist prägnant und etabliert.
- source_word: דִי
  choice: Löwen- (Kompositumsbeziehung)
  rationale: Die Relativpartikel verbindet die Grube mit den Löwen. Im Deutschen gibt ein Kompositum diese Beziehung am natürlichsten wieder.
- source_word: אַרְיָוָתָא
  choice: Löwen
  rationale: Die emphatische Pluralform verweist auf die aus dem Kontext bekannten Löwen; im Kompositum wird im Deutschen kein Artikel gesetzt.
- source_word: אֲזַל
  choice: eilte ... zur
  rationale: Das Verb bedeutet grundsätzlich „gehen“. Zusammen mit der vorangehenden Angabe von Hast beziehungsweise Unruhe ist „eilte“ eine natürliche kontextuelle Wiedergabe der Gesamtfügung.
