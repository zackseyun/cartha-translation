translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählsyntax. Die doppelte Zeitangabe des aramäischen Textes bleibt erhalten; „voller Unruhe“ lässt neben der Eile auch die mögliche Bestürzung des Königs anklingen, ohne sie stärker festzulegen, als es die Quelle erlaubt.
