base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
translation:
  language: de
  text: Da geriet der König, als er diese Sache hörte, in große Bestürzung[a]. Er nahm sich vor, Daniel zu retten, und bis zum Sonnenuntergang bemühte er sich unablässig, ihn zu befreien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war sehr ungehalten über sich selbst“ oder „war sehr betrübt über sich selbst“; die aramäische Wendung kann eine gegen den König selbst gerichtete Betroffenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; „Da“ ist im deutschen Erzählstil natürlich und prägnant.
- source_word: מַלְכָּא
  choice: der König
  rationale: Der emphatische Status bezeichnet den aus dem Zusammenhang bekannten König bestimmt.
- source_word: כְּדִי ... שְׁמַע
  choice: als er ... hörte
  rationale: כְּדִי leitet hier einen temporalen Nebensatz ein; die deutsche Präteritalform wahrt den Erzählfluss.
- source_word: מִלְּתָא
  choice: diese Worte
  rationale: Das Wort kann „Wort, Äußerung, Angelegenheit“ bedeuten. „Diese Worte“ verweist natürlich auf die unmittelbar zuvor ausgesprochene Feststellung, ohne sie bereits als formellen Urteilsspruch festzulegen.
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: geriet ... in große Bestürzung
  rationale: Die ungewöhnliche Wendung beschreibt starke innere Erregung oder Missstimmung. Die Hauptfassung gibt die sichere emotionale Grundbedeutung wieder; eine mögliche gegen sich selbst gerichtete Nuance bleibt in der Fußnote erhalten.
- source_word: וְעַל דָּנִיֵּאל שָׂם בָּל
  choice: Er nahm sich vor, Daniel ...
  rationale: Die idiomatische Wendung „das Herz setzen“ bezeichnet eine bewusste Ausrichtung oder einen festen Entschluss; „nahm sich vor“ klingt modern und wahrt den Willensaspekt.
- source_word: לְשֵׁיזָבוּתֵהּ
  choice: zu retten
  rationale: Das Verb bezeichnet die Befreiung aus drohender Gefahr; „retten“ ist im Kontext klar und natürlich.
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: und bis zum Sonnenuntergang
  rationale: Die aramäische Zeitangabe bezeichnet den Untergang der Sonne; das deutsche Kompositum ist idiomatisch und bewahrt das Bild.
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: bemühte er sich unablässig
  rationale: Die periphrastische Konstruktion drückt fortdauernde intensive Anstrengung aus. „Unablässig“ macht den durativen Sinn sichtbar.
- source_word: לְהַצָּלוּתֵהּ
  choice: ihn zu befreien
  rationale: Auch der zweite Ausdruck gehört zum Bedeutungsfeld von Rettung und Befreiung. „Befreien“ vermeidet im Deutschen eine schwerfällige Wiederholung, ohne einen sachlichen Unterschied zu behaupten.
