source:
  edition: WLC
  text: בֵּ/אדַ֜יִן מַלְכָּ֣/א אֲמַ֗ר וְ/הַיְתִיו֙ לְ/דָ֣נִיֵּ֔אל וּ/רְמ֕וֹ לְ/גֻבָּ֖/א דִּ֣י אַרְיָוָתָ֑/א עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר לְ/דָנִיֵּ֔אל אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א ה֖וּא יְשֵׁיזְבִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: de
  text: 'Da gab der König den Befehl, und man brachte Daniel und warf ihn in die Löwengrube. Der König sagte zu Daniel: »Dein Gott, dem du beständig dienst, er wird dich retten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Wunsch: »Möge er dich retten.«'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; »Da« gibt den zeitlich-folgernden Übergang im Deutschen knapp und natürlich wieder.
- source_word: מַלְכָּא אֲמַר
  choice: der König gab den Befehl
  rationale: אֲמַר bedeutet wörtlich »sagte«, bezeichnet hier aber einen königlichen Befehl, auf den unmittelbar die Ausführung folgt.
- source_word: וְהַיְתִיו
  choice: man brachte
  rationale: Die Kausativform von »kommen« bedeutet hier »bringen«. Das unpersönliche »man« ist natürlich und vermeidet eine im Text nicht näher bezeichnete Tätergruppe.
- source_word: וּרְמוֹ
  choice: warf
  rationale: Das Verb bezeichnet ein Werfen oder Hineinwerfen und bewahrt die gewaltsame Handlung deutlicher als »legte« oder »brachte«.
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: in die Löwengrube
  rationale: Wörtlich »in die Grube der Löwen«; »Löwengrube« ist die geläufige, präzise und würdevolle deutsche Entsprechung.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Der König sagte
  rationale: Die semitische Formel lautet wörtlich »der König antwortete und sagte«. Da keine eigentliche Frage vorausgeht, gibt das natürliche deutsche »sagte« ihre Funktion angemessen wieder.
- source_word: אֱלָהָךְ
  choice: Dein Gott
  rationale: Die Form enthält das Possessivsuffix der zweiten Person Singular und wird direkt wiedergegeben.
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: dem du … dienst
  rationale: פלח bezeichnet den Dienst an einer Gottheit und kann Anbetung einschließen. »dienen« bewahrt die weitere Bedeutung, ohne sie vorschnell auf kultische Verehrung zu verengen.
- source_word: בִּתְדִירָא
  choice: beständig
  rationale: Das Wort bezeichnet fortdauernde beziehungsweise regelmäßige Hingabe; »beständig« klingt in modernem Deutsch natürlich und würdevoll.
- source_word: הוּא יְשֵׁיזְבִנָּךְ
  choice: er wird dich retten
  rationale: Das selbstständige Pronomen הוּא wird durch das ausdrücklich wiederholte »er« bewahrt. Das Verb bedeutet aus Gefahr retten oder befreien; »retten« ist im unmittelbaren Kontext klar und idiomatisch.
theological_decisions:
- issue: Aussagekraft der Schlussworte des Königs
  choice: 'Aussage des Vertrauens: »er wird dich retten«'
  alternative: 'Wunsch: »möge er dich retten«'
  rationale: Die aramäische Verbform lässt sich unmittelbar als indikativische Zukunftsaussage beziehungsweise als Ausdruck der Zuversicht verstehen. Eine Wunschform ist kontextuell möglich und wird deshalb in der Fußnote genannt, aber nicht anstelle der naheliegenden Aussage in den Haupttext gesetzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle Wendung »Löwengrube« bleibt erhalten, weil sie zugleich idiomatisch und quellennah ist. Die schwerfällige semitische Redeeinleitung wurde natürlich deutsch gefasst; die emphatische Wiederaufnahme »er« bleibt bestehen.
