  source_fidelity: 'Der Text gibt die aramäische Ereignisfolge und die zentralen Verben angemessen wieder: königlicher Befehl, Herbeibringen Daniels, Hineinwerfen in die Löwengrube sowie die direkte Anrede des Königs. »Löwengrube« entspricht גֻּבָּא דִּי אַרְיָוָתָא idiomatisch und quellennah. »Er wird dich retten« gibt die naheliegende indikativische Lesart von הוּא יְשֵׁיזְבִנָּךְ wieder, ohne die mögliche Wunschlesart auszuschließen.'
  naturalness: Modernes Standarddeutsch mit angemessen würdigem Erzählton. Das unpersönliche »man« ist bei den nicht benannten Ausführenden natürlich. Die verkürzte Wiedergabe der Formel »antwortete und sagte« durch »sagte« ist im Deutschen flüssig und verursacht keinen Bedeutungsverlust.
  terminology: »Dein Gott«, »dienen«, »beständig« und »retten« sind sachgerecht. Besonders »dienen« bewahrt bei פלח den weiteren Bereich religiösen Dienstes, statt ihn einseitig als »anbeten« festzulegen. Die Fußnote dokumentiert angemessen die mögliche Wunschlesart.
