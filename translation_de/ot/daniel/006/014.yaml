source:
  edition: WLC
  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: de
  text: 'Da antworteten sie und sagten vor dem König: »Daniel, einer von den Verschleppten aus Juda, nimmt weder auf dich, o König, noch auf das Verbot, das du unterzeichnet hast,[b] Rücksicht.[a] Und dreimal am Tag bringt er seine Bitte vor.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine aramäische Wendung, die bedeutet, jemandem keine Beachtung oder Achtung zu schenken.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die bindende Anordnung“ beziehungsweise „den Erlass“. Gemeint ist ein rechtlich verbindliches Verbot.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Er sucht seine Bitte.“ Gemeint ist, dass er weiterhin bittend betet. Der Empfänger wird in diesem Satz nicht ausdrücklich genannt; aus dem Zusammenhang ist jedoch Daniels Gott gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das nächste Geschehen ein; „Da“ bewahrt den zeitlich-folgernden Erzählfluss in natürlichem Deutsch.
- source_word: עֲנוֹ וְאָמְרִין
  choice: antworteten sie und sagten
  rationale: Die zweigliedrige semitische Redeformel bleibt erhalten, statt auf ein einziges Verb verkürzt zu werden.
- source_word: קֳדָם מַלְכָּא
  choice: vor dem König
  rationale: Die Wendung bezeichnet das Reden in der Gegenwart des Königs und bewahrt den formellen Hofkontext.
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: einer von den Verschleppten aus Juda
  rationale: Die idiomatische Wendung bezeichnet Angehörige der deportierten Gemeinschaft. „Verschleppte“ gibt den unfreiwilligen politischen Hintergrund präziser wieder als das allgemeinere „Exilierte“.
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: nimmt ... auf dich ... keine Rücksicht
  rationale: Das aramäische Idiom spricht davon, auf jemanden keine Beachtung oder Rücksicht zu setzen. Die deutsche Wendung gibt den Vorwurf klar und natürlich wieder.
- source_word: מַלְכָּא
  choice: o König
  rationale: Die ausdrückliche Anrede wird beibehalten; das „o“ kennzeichnet den Vokativ in würdigem, aber verständlichem Deutsch.
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: noch auf das Verbot, das du unterzeichnet hast
  rationale: אֱסָרָא bezeichnet hier eine rechtlich bindende Untersagung. „Unterzeichnet“ entspricht im Kontext dem formellen Inkraftsetzen des schriftlichen Erlasses.
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: Dreimal am Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der wiederholten täglichen Handlung.
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: bringt er sein Anliegen vor
  rationale: Die Verb-Substantiv-Verbindung bezeichnet das Äußern einer Bitte. Die Formulierung wahrt den Bittcharakter, ohne einen im Satz nicht ausdrücklich genannten Empfänger einzufügen.
theological_decisions:
- issue: Soll der Empfänger von Daniels Bitte ausdrücklich als Gott bezeichnet werden?
  choice: 'Der Empfänger bleibt unausgesprochen: „bringt er sein Anliegen vor“.'
  alternative: „betet er zu seinem Gott“ oder „bringt er Gott seine Bitte vor“
  rationale: Der unmittelbare aramäische Satz nennt den Empfänger nicht ausdrücklich, auch wenn er aus dem Zusammenhang hervorgeht. Die Übersetzung ergänzt daher keinen im Vers fehlenden Gottesbezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelle Hofszene und die anklagende Bezeichnung Daniels als Angehöriger der Verschleppten bleiben erkennbar. Die semitische Redeformel wird bewusst nicht geglättet; unnötig altertümliche oder konfessionell geprägte Sprache wird vermieden.
