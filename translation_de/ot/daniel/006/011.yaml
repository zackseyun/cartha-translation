  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: de
  text: Als Daniel erfuhr, dass das Schriftstück unterzeichnet worden war,[a] ging er nach Hause. In seinem oberen Zimmer standen die Fenster nach Jerusalem hin offen. Dreimal am Tag kniete er nieder,[b] betete und dankte vor seinem Gott, wie er es auch zuvor getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass der Erlass unterzeichnet worden war“. Gemeint ist ein amtliches Schriftstück, das durch die Unterzeichnung rechtskräftig wurde.'
    reason: lexical_alternative
  - marker: b
    text: Die aramäische Formulierung nennt ausdrücklich seine Knie und beschreibt hier seine Gebetshaltung.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדִי יְדַע
  choice: Als Daniel erfahren hatte
  rationale: Die zeitliche Einleitung und Daniels Kenntnisnahme werden in natürlichem deutschem Erzählstil wiedergegeben, ohne besondere Unmittelbarkeit festzulegen.
- source_word: רְשִׁים כְּתָבָא
  choice: das Schriftstück unterzeichnet worden war
  rationale: Die Wendung bezeichnet ein amtliches Schriftstück, das durch Unterzeichnung rechtskräftig gemacht wurde; die Fußnote hält die mögliche Wiedergabe als Erlass fest.
- source_word: עַל לְבַיְתֵהּ
  choice: ging er in sein Haus
  rationale: Die im Kontext bezeichnete Bewegung nach Hause wird idiomatisch und ohne unnötige Präzisierung wiedergegeben.
- source_word: כַוִּין פְּתִיחָן
  choice: die Fenster ... waren ... offen
  rationale: Gibt den beschriebenen Zustand der Fenster wieder und vermeidet die unbelegte Annahme, Daniel habe sie erst jetzt geöffnet.
- source_word: בְּעִלִּיתֵהּ
  choice: in seinem Obergemach
  rationale: Bezeichnet einen Raum im oberen Teil des Hauses; „Obergemach“ ist knapp, würdevoll und im biblischen Kontext verständlich.
- source_word: נֶגֶד יְרוּשְׁלֶם
  choice: nach Jerusalem hin
  rationale: Bewahrt die räumliche Ausrichtung der Fenster, ohne ausdrücklich festzulegen, dass Daniels Körperhaltung beschrieben wird.
- source_word: זִמְנִין תְּלָתָה בְיוֹמָא
  choice: Dreimal am Tag
  rationale: Direkte und natürliche deutsche Entsprechung.
- source_word: בָּרֵךְ עַל בִּרְכֹוהִי
  choice: kniete er nieder
  rationale: Die aramäische Wendung beschreibt hier eindeutig die Gebetshaltung; die im Deutschen redundante Form „auf seinen Knien“ wird in einer Fußnote erläutert.
- source_word: מְצַלֵּא וּמְוֹדֵא
  choice: betete und dankte
  rationale: Gibt die fortgesetzten Gebetshandlungen knapp wieder; מוֹדֵא bezeichnet in diesem Zusammenhang am natürlichsten das Danken.
- source_word: קֳדָם אֱלָהֵהּ
  choice: vor seinem Gott
  rationale: Bewahrt die relationale und räumlich-metaphorische Formulierung des Aramäischen.
- source_word: כָּל קֳבֵל דִּי הֲוָא עָבֵד מִן קַדְמַת דְּנָה
  choice: wie er es auch zuvor getan hatte
  rationale: Betont entsprechend dem Ausgangstext die Kontinuität seiner bisherigen Gewohnheit.
theological_decisions:
- issue: Daniels Verhalten angesichts des königlichen Erlasses
  choice: Die Übersetzung beschreibt nüchtern, dass Daniel seine bisherige Gebetspraxis fortsetzte.
  alternative: Sein Handeln ausdrücklich als Trotz, Widerstand oder Protest gegen den König zu bezeichnen.
  rationale: Der Vers lässt den Konflikt erkennen, bewertet Daniels Handlung hier aber nicht ausdrücklich als politische Demonstration. Die Formulierung bewahrt diese Zurückhaltung.
- issue: Ausrichtung nach Jerusalem
  choice: Die Fenster werden als „nach Jerusalem hin“ offen beschrieben.
  alternative: Daniel selbst habe „mit dem Gesicht nach Jerusalem“ gebetet.
  rationale: נֶגֶד יְרוּשְׁלֶם kann eine Ausrichtung auf Jerusalem bezeichnen, bezieht sich syntaktisch zunächst jedoch auf die offenen Fenster. Eine stärkere Festlegung wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. „Obergemach“ wahrt den architektonischen und biblischen Ton, ohne altertümliche Satzstellung. Die Partizipialformen des Aramäischen werden als wiederkehrende Handlungen wiedergegeben.
