  terminology: „Erlass“ ist als Alternative für das amtliche Schriftstück passend. „Vor seinem Gott“, „betete“ und „dankte“ treffen die religiöse Terminologie sachlich und ohne konfessionelle Zuspitzung. Die Orientierung nach Jerusalem wird zutreffend den Fenstern zugeordnet.
