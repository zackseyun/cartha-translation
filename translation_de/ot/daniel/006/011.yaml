  source_fidelity: 'Der Entwurf gibt den Sinn des aramäischen Textes insgesamt zuverlässig wieder: Daniel erfährt von der Unterzeichnung, begibt sich in sein Haus, und die offenen Fenster seines oberen Raumes sind nach Jerusalem ausgerichtet. Seine fortgesetzte Praxis des dreimaligen knienden Betens und Dankens vor seinem Gott wird ohne übertragene Deutung wiedergegeben. Die Fußnote b bezeichnet die zugrunde liegende Wendung jedoch unzutreffend als „ging er auf seine Knie“; dieses Verb steht im Aramäischen nicht.'
