id: DAN.6.12
reference: Daniel 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ הַרְגִּ֔שׁוּ וְ/הַשְׁכַּ֖חוּ לְ/דָנִיֵּ֑אל בָּעֵ֥א וּ/מִתְחַנַּ֖ן קֳדָ֥ם אֱלָהֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: de
  text: Daraufhin kamen diese Männer gemeinsam[a] und fanden Daniel, wie er vor seinem Gott betete und flehte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kamen einmütig zusammen“; möglicherweise auch: „stürmten gemeinsam herbei“. Das aramäische Verb kann ein gemeinsames, abgestimmtes Vorgehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie er vor seinem Gott Bitten vorbrachte und flehte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Daraufhin
  rationale: Das aramäische Zeitadverb führt das nächste Ereignis der Erzählung ein. „Daraufhin“ gibt die zeitliche und folgernde Verbindung natürlich wieder.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer
  rationale: Die Verbindung aus Substantiv und Demonstrativ verweist auf die unmittelbar zuvor genannten Verschwörer.
- source_word: הַרְגִּשׁוּ
  choice: kamen … gemeinsam
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich ein gemeinsames, abgestimmtes Vorgehen. Die Wiedergabe wahrt diesen Sinn, ohne die mögliche Nebenbedeutung eines stürmischen Auftretens zum Haupttext zu erheben.
- source_word: וְהַשְׁכַּחוּ
  choice: und fanden
  rationale: Das Verb bezeichnet, dass die Männer Daniel bei der beschriebenen Handlung antrafen.
- source_word: לְדָנִיֵּאל
  choice: Daniel
  rationale: Gebräuchliche deutsche Form des Eigennamens.
- source_word: בָּעֵא וּמִתְחַנַּן
  choice: betete und flehte
  rationale: Die beiden Partizipien beschreiben Daniels Bitten und inständiges Flehen. „Betete und flehte“ ist im Deutschen natürlich, würdevoll und bringt den Gebetszusammenhang zum Ausdruck, ohne einen im Satz nicht genannten Gegenstand der Bitte einzufügen.
- source_word: קֳדָם
  choice: vor
  rationale: Die Präposition bedeutet „vor“ beziehungsweise „in der Gegenwart von“ und ist auch im Deutschen in Gebetssprache verständlich.
- source_word: אֱלָהֵהּ
  choice: seinem Gott
  rationale: Die Form enthält das Suffix der dritten Person Singular und bezeichnet Daniels Gott.
theological_decisions:
- issue: Wiedergabe von Daniels Gebetssprache ohne dogmatische Präzisierung
  choice: betete und flehte vor seinem Gott
  alternative: brachte vor seinem Gott Bitten vor und flehte
  rationale: Die Übersetzung bewahrt sowohl den Gebetscharakter als auch die Eindringlichkeit der beiden aramäischen Partizipien. Sie nennt weder einen Gegenstand der Bitte noch eine besondere Gebetsform, die im Ausgangstext nicht ausdrücklich angegeben ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfügung „fanden Daniel, wie er …“ bildet das Antreffen bei einer laufenden Handlung natürlich ab. Die Fußnoten erhalten die lexikalische Spannweite des seltenen Verbs הַרְגִּשׁוּ und der beiden Gebetspartizipien.
