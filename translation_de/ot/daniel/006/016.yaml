  text: בֵּ/אדַ֨יִן֙ גֻּבְרַיָּ֣/א אִלֵּ֔ךְ הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/אָמְרִ֣ין לְ/מַלְכָּ֗/א דַּ֤ע מַלְכָּ/א֙ דִּֽי דָת֙ לְ/מָדַ֣י וּ/פָרַ֔ס דִּֽי כָל אֱסָ֥ר וּ/קְיָ֛ם דִּֽי מַלְכָּ֥/א יְהָקֵ֖ים לָ֥א לְ/הַשְׁנָיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: de
  text: 'Da drängten diese Männer[a] gemeinsam auf den König ein und sagten zu ihm: »Wisse, König: Nach dem Gesetz der Meder und Perser darf kein Verbot und keine Verordnung, die der König erlässt, geändert werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da kamen diese Männer gemeinsam zum König.« Das aramäische Verb kann ein abgestimmtes, nachdrückliches Vorgehen gegen den König ausdrücken, nicht nur ein schlichtes Herantreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das nächste Geschehen ein; »Da« wahrt den natürlichen Erzählfluss im Deutschen.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer
  rationale: Die Wendung bezeichnet die bereits genannten, feindlich handelnden Männer und wird unmittelbar und geschlechtsgenau wiedergegeben.
- source_word: הַרְגִּשׁוּ עַל
  choice: kamen gemeinsam zum
  rationale: Das seltene aramäische Verb bezeichnet hier offenbar ein koordiniertes, nachdrückliches Zusammenkommen; »gemeinsam« bewahrt diesen Aspekt, ohne eine bloß körperliche Bedrängung festzuschreiben.
- source_word: וְאָמְרִין לְמַלְכָּא
  choice: und sagten zu ihm
  rationale: Das Pronomen vermeidet im Deutschen die schwerfällige unmittelbare Wiederholung von »zum König … zum König«, ohne den Bezug zu verändern.
- source_word: דַּע מַלְכָּא
  choice: Wisse, König
  rationale: Imperativ und Anrede bleiben erhalten; die würdevolle, aber im heutigen Deutsch natürliche Form vermeidet das altertümliche »o König«.
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: Nach dem Gesetz der Meder und Perser
  rationale: Die Formulierung gibt den Rechtsmaßstab idiomatisch wieder und bewahrt die feste Verbindung der beiden Völkernamen.
- source_word: כָל אֱסָר וּקְיָם
  choice: kein Verbot und keine Verordnung
  rationale: »Verbot« bezeichnet die bindende Untersagung, »Verordnung« die festgesetzte rechtliche Anordnung; die Paarung wahrt die unterscheidbaren Rechtsbegriffe.
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: die der König erlässt
  rationale: »Erlassen« ist bei Verboten und Verordnungen die natürliche deutsche Rechtsformulierung für das Inkraftsetzen.
- source_word: לָא לְהַשְׁנָיָה
  choice: darf … nicht geändert werden
  rationale: Die Wendung bringt die rechtliche Unabänderlichkeit klar zum Ausdruck, ohne eine metaphysische Unmöglichkeit zu behaupten.
