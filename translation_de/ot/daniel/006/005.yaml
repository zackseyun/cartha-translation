  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: de
  text: Daraufhin versuchten die hohen Beamten und Satrapen, in Angelegenheiten des Königreichs einen Grund zur Anklage gegen Daniel zu finden. Doch sie konnten weder einen Anklagegrund noch Korruption finden, denn er war vertrauenswürdig[a]; weder Nachlässigkeit[b] noch Korruption ließ sich gegen ihn feststellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »treu« oder »zuverlässig«; das Aramäische bezeichnet hier Daniels Verlässlichkeit im Amt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fehler«, »Versäumnis« oder »Unachtsamkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Daraufhin
  rationale: Kennzeichnet den zeitlichen und folgerichtigen Fortgang der Erzählung in gehobenem, aber modernem Deutsch.
- source_word: סָרְכַיָּא
  choice: hohen Beamten
  rationale: Gibt den aramäischen Verwaltungstitel verständlich wieder, ohne eine unsichere spezifische Amtsstruktur vorauszusetzen.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Der etablierte historische Ausdruck bewahrt den persischen Verwaltungskontext.
- source_word: בָעַיִן ... לְהַשְׁכָּחָה
  choice: versuchten ... zu finden
  rationale: Gibt die fortgesetzte Suche samt Infinitiv idiomatisch wieder.
- source_word: עִלָּה
  choice: Grund zur Anklage / Anklagegrund
  rationale: Bezeichnet einen Anlass oder eine Grundlage für eine Beschuldigung, nicht notwendig eine bereits erhobene formelle Anklage.
- source_word: מִצַּד מַלְכוּתָא
  choice: in Angelegenheiten des Königreichs
  rationale: Bewahrt den Bezug auf Daniels königlichen beziehungsweise staatlichen Amtsbereich, ohne ihn unnötig auszudeuten.
- source_word: שְׁחִיתָה
  choice: Korruption
  rationale: Passt zum administrativen Kontext und bezeichnet korruptes oder schädigendes Fehlverhalten.
- source_word: מְהֵימַן
  choice: vertrauenswürdig
  rationale: Betont Daniels Zuverlässigkeit im Amt und vermeidet eine unnötige Verengung auf ausdrücklich religiöse Treue.
- source_word: שָׁלוּ
  choice: Nachlässigkeit
  rationale: Bezeichnet hier ein dienstliches Versäumnis, einen Fehler oder eine Unachtsamkeit.
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: ließ sich gegen ihn feststellen
  rationale: Gibt die forensische Ausrichtung der Präposition und die erfolglose Untersuchung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Art von Daniels Treue beziehungsweise Zuverlässigkeit
  choice: vertrauenswürdig
  alternative: treu; zuverlässig
  rationale: Der unmittelbare Zusammenhang betrifft Daniels untadelige Amtsführung. Die Formulierung wahrt die moralische Aussage, ohne darüber hinaus eine spezifisch theologische Bedeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historischen Amtsbezeichnungen werden teils verständlich umschrieben und teils als etablierter Fachbegriff beibehalten. Die Wiederholung der Begriffe für Anklage und Korruption folgt der rhetorischen Struktur des Aramäischen.
