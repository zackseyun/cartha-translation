base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
translation:
  language: de
  text: Da ging der König in seinen Palast und verbrachte die Nacht fastend; keine Unterhaltung wurde ihm dargeboten[a], und der Schlaf floh von ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keine Musiker wurden ihm vorgeführt.“ Der aramäische Ausdruck ist unsicher und kann sich genauer auf Unterhaltungskünstler oder Zerstreuungen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählanschluss führt das nächste Geschehen ein; „Da“ ist im Deutschen natürlich und würdevoll.
- source_word: אֲזַל
  choice: ging
  rationale: Das gewöhnliche Bewegungsverb bezeichnet hier die Rückkehr des Königs zu seiner Residenz.
- source_word: מַלְכָּא
  choice: der König
  rationale: Die bestimmte aramäische Form wird direkt wiedergegeben.
- source_word: לְהֵיכְלֵהּ
  choice: in seinen Palast
  rationale: הֵיכַל kann Palast, Halle oder Tempel bezeichnen; im Kontext ist die königliche Residenz gemeint.
- source_word: וּבָת טְוָת
  choice: verbrachte die Nacht fastend
  rationale: Die idiomatische deutsche Form gibt sowohl das Übernachten als auch die begleitende Enthaltung wieder.
- source_word: וְדַחֲוָן
  choice: Unterhaltung
  rationale: Das seltene und unsichere Wort kann auf Musiker, Unterhaltung oder andere Zerstreuungen weisen. Der Oberbegriff vermeidet eine unbegründete Präzisierung.
- source_word: לָא הַנְעֵל קָדָמוֹהִי
  choice: wurde nicht vor ihn gebracht
  rationale: Die kausative Verbform bezeichnet, dass man nichts Entsprechendes in die Gegenwart des Königs bringen ließ; die deutsche Passivform bewahrt den ereignisbezogenen Ausdruck.
- source_word: וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי
  choice: und der Schlaf floh von ihm
  rationale: Die bildhafte Personifikation und die Bewegung weg vom König werden eng am Aramäischen wiedergegeben.
