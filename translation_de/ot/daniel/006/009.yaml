id: DAN.6.9
reference: Daniel 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּעַ֣ן מַלְכָּ֔/א תְּקִ֥ים אֱסָרָ֖/א וְ/תִרְשֻׁ֣ם כְּתָבָ֑/א דִּ֣י לָ֧א לְ/הַשְׁנָיָ֛ה כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: de
  text: Nun, König, setze das Verbot in Kraft und unterzeichne das Schriftstück, sodass es nicht geändert werden darf[a] – gemäß dem Gesetz der Meder und Perser, das nicht aufgehoben werden kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sodass es nicht geändert werden kann“. Gemeint ist, dass eine Änderung rechtlich ausgeschlossen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das nicht vergeht“; gemeint ist die rechtliche Unaufhebbarkeit.'
    reason: idiom
lexical_decisions:
- source_word: כְּעַן
  choice: Nun
  rationale: Das aramäische Diskursadverb leitet die dringliche Aufforderung ein. „Nun“ bewahrt die Unmittelbarkeit, ohne einen stärkeren Folgerungszusammenhang festzulegen.
- source_word: מַלְכָּא
  choice: König
  rationale: Das Substantiv steht als direkte Anrede. Im modernen Deutschen wirkt „König“ würdevoll und natürlicher als „o König“.
- source_word: תְּקִים אֱסָרָא
  choice: setze das Verbot in Kraft
  rationale: Das Verb bezeichnet das Aufrichten oder rechtskräftige Festsetzen; אֱסָרָא meint hier die im Kontext vorgeschlagene bindende Untersagung. Die Wendung gibt den rechtlich-administrativen Sinn idiomatisch wieder.
- source_word: וְתִרְשֻׁם כְּתָבָא
  choice: und unterzeichne das Schriftstück
  rationale: Das Verb kann „aufschreiben/eintragen“ bedeuten, bezeichnet in diesem Rechtszusammenhang aber die formelle schriftliche Bestätigung durch den König. „Schriftstück“ wahrt den ausdrücklichen Bezug auf das geschriebene Dokument.
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: sodass es nicht geändert werden darf
  rationale: Die Konstruktion bezeichnet das Schriftstück als nicht zur Änderung bestimmt. „Darf“ bringt die rechtliche Unzulässigkeit zum Ausdruck, ohne sie als sachliche Unmöglichkeit misszuverstehen.
- source_word: כְּדָת מָדַי וּפָרַס
  choice: gemäß dem Gesetz der Meder und Perser
  rationale: דָּת bezeichnet hier verbindliches Recht beziehungsweise Gesetz; die Völkernamen werden als „Meder und Perser“ wiedergegeben.
- source_word: דִּי לָא תֶעְדֵּא
  choice: das nicht aufgehoben werden kann
  rationale: Wörtlich heißt die Wendung, dass das Gesetz „nicht vergeht“. Im juristischen Zusammenhang bezeichnet dies seine Unaufhebbarkeit; die deutsche Formulierung gibt dieses Idiom verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die direkte Anrede bleibt knapp; „o König“ wird als heute unnötig altertümlich vermieden. Der Gedankenstrich verdeutlicht, dass die abschließende Rechtsformel die verlangte Unveränderlichkeit begründet.
