  source_fidelity: 'Die Übersetzung gibt die aramäische Aufforderung präzise wieder: כְּעַן als dringliches „Nun“, die direkte Anrede „König“, die rechtliche Festsetzung des אֱסָרָא sowie die geforderte schriftliche Bestätigung. „sodass es nicht geändert werden darf“ trifft die rechtlich normierende Zielbestimmung von דִּי לָא לְהַשְׁנָיָה. Die abschließende Formel ist mit „gemäß dem Gesetz der Meder und Perser, das nicht aufgehoben werden kann“ idiomatisch und sachgerecht wiedergegeben.'
