reference: Daniel 6:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: de
  text: Darauf gab der König den Befehl. Die Männer, die Daniel böswillig beschuldigt hatten[a], wurden herbeigebracht und in die Löwengrube geworfen – sie selbst, ihre Söhne und ihre Frauen. Noch bevor sie den Boden der Grube erreichten, überwältigten die Löwen sie und zermalmten alle ihre Knochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine aramäische Redewendung: „die Daniels Stücke gegessen hatten“; gemeint ist, dass sie ihn verleumdet oder böswillig angeklagt hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר מַלְכָּא
  choice: Darauf gab der König den Befehl
  rationale: Das Verb bedeutet wörtlich „sagen“, leitet hier aber einen königlichen Vollstreckungsbefehl ein. „Darauf“ gibt den Fortgang der Erzählung wieder, ohne über den Kontext hinauszugehen.
- source_word: וְהַיְתִיו
  choice: wurden herbeigebracht
  rationale: Die Kausativform bezeichnet, dass man die Männer kommen ließ beziehungsweise herbeibrachte. Die passive Formulierung bewahrt den Fokus des aramäischen Satzes.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: Die Männer
  rationale: Die bestimmte, demonstrativ bezeichnete Gruppe sind die zuvor genannten Ankläger Daniels; im Deutschen genügt in diesem Zusammenhang der bestimmte Artikel.
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: die Daniel böswillig beschuldigt hatten
  rationale: Die aramäische Wendung bedeutet, jemanden verleumderisch anzuklagen oder gegen ihn Anzeige zu erstatten. „Böswillig beschuldigt“ erhält sowohl den feindseligen als auch den forensischen Bezug.
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: in die Löwengrube geworfen
  rationale: גּוֹב bezeichnet eine Grube; „Löwengrube“ ist im Deutschen die natürliche und im Kapitel etablierte Wiedergabe. „Geworfen“ entspricht der gewaltsamen Handlung.
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: sie selbst, ihre Söhne und ihre Frauen
  rationale: „Sie selbst“ gibt das hervorgehobene Pronomen wieder. „Söhne“ ist genauer als das allgemeinere „Kinder“.
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי
  choice: Noch bevor sie den Boden der Grube erreichten
  rationale: Die negative temporale Konstruktion besagt, dass der Angriff bereits vor dem Erreichen des Grubenbodens erfolgte.
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: überwältigten die Löwen sie
  rationale: Das Verb bezeichnet Herrschaft oder Gewalt über jemanden; „überwältigten“ ist hier präzise und natürlich.
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: und zermalmten alle ihre Knochen
  rationale: Das Verb drückt ein Zertrümmern oder Zermalmen aus. „Zermalmten“ bewahrt die drastische Stärke, „alle“ die umfassende Aussage.
theological_decisions:
- issue: Kollektive Bestrafung der Familien der Ankläger
  choice: Die ausdrückliche Nennung „sie selbst, ihre Söhne und ihre Frauen“ bleibt ohne Abschwächung oder moralischen Zusatz erhalten.
  alternative: „ihre Kinder“ verallgemeinern, die Angehörigen auslassen oder die Handlung kommentierend rechtfertigen beziehungsweise verurteilen
  rationale: Der aramäische Text nennt die Familienangehörigen ausdrücklich. Die Übersetzung gibt die Härte des berichteten königlichen Urteils wieder, ohne eine nicht ausgesprochene theologische Bewertung einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die drastische Sprache des Ausgangstextes und die ausdrückliche Einbeziehung der Familien bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der idiomatischen Wendung, die er erläutert.
