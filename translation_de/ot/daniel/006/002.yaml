source:
  edition: WLC
  text: שְׁפַר֙ קֳדָ֣ם דָּרְיָ֔וֶשׁ וַ/הֲקִים֙ עַל מַלְכוּתָ֔/א לַ/אֲחַשְׁדַּרְפְּנַיָּ֖/א מְאָ֣ה וְ/עֶשְׂרִ֑ין דִּ֥י לֶהֱוֺ֖ן בְּ/כָל מַלְכוּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/002.yaml
  text: It seemed good to Darius to appoint over the kingdom one hundred and twenty satraps[a], who would be throughout the whole kingdom.
translation:
  language: de
  text: Darius hielt es für gut, über das Königreich hundertzwanzig Satrapen[a] einzusetzen, die im ganzen Königreich verteilt sein sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Provinzstatthalter«; gemeint sind hohe persische Verwaltungsbeamte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַר קֳדָם דָּרְיָוֶשׁ
  choice: Darius hielt es für gut
  rationale: Die aramäische Wendung bezeichnet, dass Darius die Maßnahme als gut oder angemessen ansah. Die deutsche Formulierung ist natürlich und bewahrt den wertenden Sinn.
- source_word: וַהֲקִים
  choice: einzusetzen
  rationale: Im administrativen Zusammenhang meint das Verb die Einsetzung von Personen in ein Amt, nicht ein räumliches Aufstellen.
- source_word: עַל מַלְכוּתָא
  choice: über das Königreich
  rationale: Die Präposition bezeichnet hier den Zuständigkeitsbereich der Amtsträger.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Der historisch präzise und im Deutschen etablierte Begriff bezeichnet hohe persische Verwaltungsbeamte; eine verständlichere Umschreibung steht in der Fußnote.
- source_word: מְאָה וְעֶשְׂרִין
  choice: hundertzwanzig
  rationale: Die Zahl wird im fortlaufenden deutschen Text ausgeschrieben.
- source_word: דִּי לֶהֱוֺן
  choice: die … sein sollten
  rationale: Relativpartikel und Imperfekt drücken die vorgesehene Funktion beziehungsweise Verteilung der eingesetzten Amtsträger aus.
- source_word: בְּכָל מַלְכוּתָא
  choice: im ganzen Königreich verteilt
  rationale: Die Wendung beschreibt eine Verteilung über das gesamte Reich. Das ergänzte „verteilt“ macht diesen administrativen Sinn im Deutschen deutlich.
