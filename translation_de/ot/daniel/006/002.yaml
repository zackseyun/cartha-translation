  source_fidelity: Der Text gibt die aramäische Wendung שְׁפַר קֳדָם („es erschien/gefiel Darius gut“) treffend wieder. „einzusetzen“ entspricht וַהֲקִים im Verwaltungskontext, und „über das Königreich“ bewahrt den Zuständigkeitsbereich. Die Zahl sowie die prospektive Bestimmung der Satrapen sind vollständig wiedergegeben. „Im ganzen Königreich verteilt“ ist eine zulässige idiomatische Explikation von בְּכָל מַלְכוּתָא und fügt keine sachlich abweichende Behauptung hinzu.
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch mit angemessen würdigem Register. „Satrapen“ ist als historischer Verwaltungstitel verständlich, und die Fußnote unterstützt Leserinnen und Leser ohne den Haupttext zu überladen.
  terminology: „Satrapen“ ist historisch und lexikalisch präzise für אֲחַשְׁדַּרְפְּנַיָּא. Die Fußnotenalternative „Provinzstatthalter“ ist sinnvoll, und die Erklärung als hohe persische Verwaltungsbeamte ist neutral und zutreffend.
