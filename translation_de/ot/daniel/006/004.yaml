  variant: modern standard German
source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: de
  text: Da zeichnete sich dieser Daniel vor den obersten Beamten und den Satrapen aus, weil ein außergewöhnlicher Geist in ihm war.[a] Und der König beabsichtigte, ihn über das ganze Königreich einzusetzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil ein hervorragender Geist in ihm war“. Die Wendung kann allgemein auf Daniels außergewöhnliche innere Haltung, Weisheit oder Wesensart hinweisen.'
    reason: Lexikalische Alternative; die genaue Bedeutung und Reichweite von רוּחַ יַתִּירָא bleibt offen.
  - marker: b
    text: 'Oder: „Der König hatte vor, ihn über das ganze Königreich einzusetzen.“'
    reason: Alternative idiomatische Wiedergabe der königlichen Absicht.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Das temporale Folgewort führt die nächste Entwicklung der Erzählung ein; „Da“ ist im Deutschen knapp und natürlich.
- source_word: דָּנִיֵּאל דְּנָה
  choice: dieser Daniel
  rationale: Das Demonstrativpronomen wird beibehalten, weil die aramäische Formulierung Daniel hervorgehoben bezeichnet.
- source_word: הֲוָא מִתְנַצַּח
  choice: zeichnete sich … aus
  rationale: Die Verbindung beschreibt Daniels fortdauernde oder charakteristische Überlegenheit; die deutsche Wendung gibt dies idiomatisch wieder.
- source_word: עַל
  choice: vor
  rationale: In Verbindung mit „sich auszeichnen“ bezeichnet „vor“ den Vergleich mit den anderen Amtsträgern, nicht bereits eine Amtsgewalt über sie.
- source_word: סָרְכַיָּא
  choice: die obersten Beamten
  rationale: Der Ausdruck bezeichnet hochrangige Amtsträger der Reichsverwaltung; diese Wiedergabe ist verständlich, ohne eine unsichere moderne Amtsbezeichnung festzulegen.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: die Satrapen
  rationale: „Satrapen“ ist die etablierte historische Bezeichnung für dieses persische Verwaltungsamt und bewahrt dessen Besonderheit.
- source_word: כָּל־קֳבֵל דִּי
  choice: weil
  rationale: Die aramäische Verbindung nennt den Grund für Daniels Hervortreten.
- source_word: רוּחַ יַתִּירָא
  choice: ein außergewöhnlicher Geist
  rationale: Die Wiedergabe bewahrt das Bildwort „Geist“ und bezeichnet zugleich dessen herausragende Qualität, ohne diese auf Begabung, Charakter oder göttliches Wirken einzuengen.
- source_word: בֵּהּ
  choice: in ihm war
  rationale: Die Formulierung gibt die innere, Daniel kennzeichnende Gegenwart dieses außergewöhnlichen Geistes unmittelbar wieder.
- source_word: וּמַלְכָּא עֲשִׁית
  choice: Und der König beabsichtigte
  rationale: Die Wendung drückt Absicht oder Entschluss aus, nicht eine bereits vollzogene Handlung.
- source_word: לַהֲקָמוּתֵהּ
  choice: ihn … einzusetzen
  rationale: Der Kausativ bedeutet wörtlich, jemanden aufzustellen, und bezeichnet hier idiomatisch seine Einsetzung in eine leitende Stellung.
- source_word: עַל כָּל מַלְכוּתָא
  choice: über das ganze Königreich
  rationale: Die Wendung bezeichnet Zuständigkeit beziehungsweise Herrschaftsgewalt über den gesamten königlichen Herrschaftsbereich.
theological_decisions:
- issue: Bedeutung des außergewöhnlichen „Geistes“ in Daniel
  choice: Das Wort „Geist“ bleibt stehen, ohne näher festzulegen, worin seine außergewöhnliche Qualität bestand.
  alternative: Deutender mit „außergewöhnliche Begabung“, „hervorragender Charakter“ oder ausdrücklich als Wirken des Heiligen Geistes übersetzen.
  rationale: Der aramäische Text nennt einen außergewöhnlichen Geist in Daniel, erklärt hier aber nicht ausdrücklich, ob damit seine Haltung, Weisheit, Begabung oder göttliche Befähigung gemeint ist. Die offene Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Historisch spezifische Amtsbezeichnungen werden dort bewahrt, wo sie etabliert sind („Satrapen“); weniger eindeutige Verwaltungstitel werden verständlich wiedergegeben. Die Satzstruktur folgt dem aramäischen Erzählfluss, ohne unnatürlich wörtlich zu werden.
