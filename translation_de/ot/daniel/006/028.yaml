  text: מְשֵׁיזִ֣ב וּ/מַצִּ֗ל וְ/עָבֵד֙ אָתִ֣ין וְ/תִמְהִ֔ין בִּ/שְׁמַיָּ֖/א וּ/בְ/אַרְעָ֑/א דִּ֚י שֵׁיזִ֣יב לְ/דָֽנִיֵּ֔אל מִן יַ֖ד אַרְיָוָתָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/028.yaml
  text: who rescues and delivers, and works signs and wonders in heaven and on earth—he who rescued Daniel from the power of the lions.
translation:
  language: de
  text: der rettet und befreit, Zeichen und Wunder im Himmel und auf der Erde vollbringt – er, der Daniel aus der Gewalt der Löwen gerettet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  choice: der rettet und befreit
  rationale: Die beiden aramäischen Partizipien werden parallel und präsentisch wiedergegeben; so bleiben ihre eng verwandten, aber nicht völlig identischen Bedeutungen erhalten.
- source_word: וְעָבֵד
  choice: und … vollbringt
  rationale: Das Partizip bezeichnet fortgesetztes bzw. charakteristisches Handeln; „vollbringt“ klingt im Deutschen bei Zeichen und Wundern natürlich und würdig.
- source_word: אָתִין וְתִמְהִין
  choice: Zeichen und Wunder
  rationale: Die etablierte deutsche Wortverbindung bildet das aramäische Begriffspaar prägnant ab.
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  choice: am Himmel und auf der Erde
  rationale: Die räumliche Gegenüberstellung wird direkt bewahrt; der Singular „Himmel“ entspricht hier der aramäischen Form und ist idiomatisch.
- source_word: מִן יַד אַרְיָוָתָא
  choice: aus der Gewalt der Löwen
  rationale: „Hand“ ist idiomatisch als Macht oder Gewalt zu verstehen; eine wörtliche Wiedergabe wäre im Deutschen missverständlich.
theological_decisions:
- issue: Bezug des abschließenden Relativsatzes
  choice: – er, der Daniel … gerettet hat
  alternative: der Daniel … gerettet hat
  rationale: Das ausdrücklich wiederaufgenommene „er“ macht den Rückbezug auf Gott klar, ohne dem Text eine zusätzliche theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-proklamatorische Reihung bleibt erhalten; der Gedankenstrich markiert die nachdrückliche Konkretisierung durch Daniels Rettung.
