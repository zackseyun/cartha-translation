  source_fidelity: Die drei aramäischen Partizipien sind zutreffend als charakteristische Gegenwartshandlungen wiedergegeben. „aus der Gewalt der Löwen“ erschließt מִן־יַד („aus der Hand/Macht“) idiomatisch und sachgerecht. Für בִּשְׁמַיָּא ist im vorliegenden kosmischen Gegensatz zu „auf der Erde“ jedoch „im Himmel“ treffender als „am Himmel“, das im heutigen Deutsch eher den sichtbaren Himmel meint.
