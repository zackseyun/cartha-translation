id: DAN.6.1
reference: Daniel 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/דָרְיָ֨וֶשׁ֙ מָֽדָיָ֔/א קַבֵּ֖ל מַלְכוּתָ֑/א כְּ/בַ֥ר שְׁנִ֖ין שִׁתִּ֥ין וְ/תַרְתֵּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
translation:
  language: de
  text: Und Darius, der Meder, empfing das Königreich[a], als er etwa zweiundsechzig Jahre alt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übernahm die Herrschaft“. Das aramäische Verb kann weiter gefasst wiedergegeben werden; „empfing“ entspricht jedoch enger dem Wortlaut und legt die Art seines Herrschaftsantritts nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: Und Darius
  rationale: Die Konjunktion וְ wird schlicht mit „Und“ wiedergegeben und bewahrt so die narrative Verknüpfung, ohne das Verhältnis zum vorhergehenden Satz näher festzulegen.
- source_word: מָדָיָא
  choice: der Meder
  rationale: Das Gentiliz bezeichnet Darius als Angehörigen der Meder; „der Meder“ ist die natürliche deutsche Wiedergabe.
- source_word: קַבֵּל
  choice: empfing
  rationale: Das aramäische Verb bedeutet gewöhnlich „empfangen“ beziehungsweise „annehmen“. „Empfing“ bleibt eng am Wortlaut und legt nicht fest, auf welche Weise Darius zur Herrschaft gelangte.
- source_word: מַלְכוּתָא
  choice: das Königreich
  rationale: „Königreich“ gibt den königlichen Herrschaftsbereich hier natürlich wieder; je nach Akzent wären auch „Königsherrschaft“ oder „Herrschaft“ möglich.
- source_word: כְּבַר שְׁנִין
  choice: als er etwa … Jahre alt war
  rationale: Die aramäische Altersformel, wörtlich ungefähr „wie ein Sohn von … Jahren“, wird idiomatisch wiedergegeben; כְּ bewahrt dabei die ungefähre Altersangabe.
- source_word: שִׁתִּין וְתַרְתֵּין
  choice: zweiundsechzig
  rationale: Die Zahl wird in der üblichen modernen deutschen Form wiedergegeben.
theological_decisions:
- issue: Art des Herrschaftsantritts von Darius
  choice: empfing das Königreich
  alternative: nahm das Königreich ein / übernahm die Herrschaft
  rationale: „Empfing“ entspricht dem üblichen Sinn des aramäischen Verbs und lässt offen, ob Darius das Reich durch Eroberung, Übertragung, Erbschaft oder auf andere Weise erhielt. Historische und theologische Streitfragen werden dadurch nicht vorentschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Altersangabe ist idiomatisch formuliert, während „empfing das Königreich“ die knappe und bewusst offene Aussage des aramäischen Textes bewahrt.
