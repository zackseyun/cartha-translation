  text: וְ/עֵ֤לָּא מִנְּ/הוֹן֙ סָרְכִ֣ין תְּלָתָ֔א דִּ֥י דָנִיֵּ֖אל חַֽד מִנְּ/ה֑וֹן דִּֽי לֶהֱוֺ֞ן אֲחַשְׁדַּרְפְּנַיָּ֣/א אִלֵּ֗ין יָהֲבִ֤ין לְ/הוֹן֙ טַעְמָ֔/א וּ/מַלְכָּ֖/א לָֽא לֶהֱוֵ֥א נָזִֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: de
  text: Über ihnen standen drei hohe Beamte, von denen Daniel einer war. Die Satrapen sollten ihnen Rechenschaft ablegen[a], damit der König keinen Verlust erleiden sollte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen Bericht erstatten“. Die aramäische Wendung kann im Verwaltungskontext sowohl das Ablegen von Rechenschaft als auch das Erstatten eines Berichts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit der König keinen Schaden erleiden sollte“. Gemeint ist wahrscheinlich ein administrativer oder finanzieller Verlust für den König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: Über ihnen standen
  rationale: Die Wendung bezeichnet eine übergeordnete Verwaltungsebene. „Über ihnen“ bewahrt das hierarchische Verhältnis und klingt im Deutschen natürlich.
- source_word: סָרְכִין תְּלָתָא
  choice: drei hohe Beamte
  rationale: Der Ausdruck bezeichnet leitende Amtsträger über den Satrapen. „Hohe Beamte“ gibt Rang und Verwaltungsfunktion wieder, ohne einen modernen politischen Titel einzutragen.
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: von denen Daniel einer war
  rationale: Die Relativkonstruktion kennzeichnet Daniel eindeutig als einen der drei und wird idiomatisch wiedergegeben.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: „Satrapen“ ist die etablierte historische Bezeichnung für diese persischen Amtsträger und bewahrt den kulturellen Kontext.
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: Ihnen sollten die Satrapen Rechenschaft ablegen
  rationale: טְעֵם kann in einem Verwaltungskontext einen Bericht, Bescheid oder eine Rechenschaft bezeichnen. „Rechenschaft ablegen“ hebt die Verantwortlichkeit gegenüber den drei hohen Beamten hervor.
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: damit der König keinen Verlust erlitt
  rationale: נזק bezeichnet hier wahrscheinlich eine Schädigung der königlichen Interessen, insbesondere einen finanziellen oder administrativen Verlust. Die Formulierung wahrt den weiteren Begriff „Verlust“, ohne ihn unnötig zu präzisieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwaltungsrangordnung wird klar ausgedrückt; der historische Titel „Satrapen“ bleibt erhalten. Die beiden lexikalischen Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern in Fußnoten kenntlich gemacht.
