id: DAN.6.13
reference: Daniel 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: de
  text: 'Da traten sie heran und sprachen vor dem König über das Verbot des Königs: „Hast du nicht ein Verbot unterzeichnet, wonach jeder, der innerhalb von dreißig Tagen an irgendeinen Gott oder Menschen eine Bitte richtet – außer an dich, König –, in die Löwengrube geworfen werden soll?“ Der König antwortete: „Die Sache steht fest nach dem Gesetz der Meder und Perser, das nicht aufgehoben werden kann.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das nicht geändert werden kann“ beziehungsweise „das nicht widerrufen werden kann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; „Da“ wahrt den fortlaufenden, würdevollen Erzählstil.
- source_word: קְרִיבוּ
  choice: traten sie heran
  rationale: Gibt die konkrete Annäherung im höfischen Umfeld natürlich wieder.
- source_word: וְאָמְרִין קֳדָם מַלְכָּא
  choice: und sprachen vor dem König
  rationale: Bewahrt sowohl den Sprechakt als auch die formelle Situation in der Gegenwart des Königs.
- source_word: אֱסָר
  choice: Verbot
  rationale: Das Wort bezeichnet hier nicht bloß einen allgemeinen Erlass, sondern eine bindende Untersagung; „Verbot“ ist im modernen Deutsch klar und genau.
- source_word: רְשַׁמְתָּ
  choice: unterzeichnet
  rationale: Im rechtlichen Zusammenhang geht es um die schriftliche Inkraftsetzung durch den König.
- source_word: כָל אֱנָשׁ
  choice: jeder
  rationale: Das maskuline Singularwort hat in der Rechtsformel generische Bedeutung; „jeder“ bildet Form und Funktion natürlich ab.
- source_word: יִבְעֵה מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: an irgendeinen Gott oder Menschen eine Bitte richtet
  rationale: Die Wendung bezeichnet das Stellen einer Bitte; „an ... eine Bitte richten“ ist idiomatisches Deutsch und erhält den formellen Ton.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: innerhalb von dreißig Tagen
  rationale: Die Präposition עַד kann die festgelegte Frist bzw. den Zeitraum bis zu dreißig Tagen markieren; diese Wiedergabe passt zur Verbotsfrist.
- source_word: יִתְרְמֵא לְגוֹב אַרְיָותָא
  choice: in die Löwengrube geworfen werden soll
  rationale: Bewahrt das Passiv und die verbindliche Rechtsfolge, ohne unnötig archaisch zu klingen.
- source_word: יַצִּיבָא מִלְּתָא
  choice: Die Sache steht fest
  rationale: Gibt die Bestätigung als rechtlich verbindlich und sicher in natürlichem Deutsch wieder.
- source_word: דִּי לָא תֶעְדֵּא
  choice: das nicht aufgehoben werden kann
  rationale: Das Verb bezeichnet hier das Nichtbeseitigen bzw. Nichtwiderrufen des Gesetzes; „aufgehoben“ ist rechtssprachlich klar.
theological_decisions:
- issue: Generisches Maskulinum אֱנָשׁ in der Rechtsformel
  choice: jeder / Menschen
  alternative: jede Person / irgendjemanden
  rationale: Die Übersetzung erhält die grammatisch maskuline Ausdrucksweise und ihre generische Rechtsfunktion, ohne den Anwendungsbereich künstlich einzuschränken.
- issue: Bedeutung von אֱסָר
  choice: Verbot
  alternative: Erlass / Verfügung
  rationale: Der Kontext verlangt eine bindende Untersagung. „Verbot“ hält den restriktiven Sinn fest, während „Erlass“ weiter gefasst wäre.
- issue: Unveränderlichkeit des medisch-persischen Gesetzes
  choice: nicht aufgehoben werden kann
  alternative: nicht geändert werden kann / nicht widerrufen werden kann
  rationale: Die Formulierung wahrt die rechtliche Endgültigkeit, ohne eine weitergehende theologische Aussage über absolute Unveränderlichkeit einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht formellem Hof- und Rechtsregister. Die direkte Anrede „König“ folgt dem Aramäischen, ohne das heute altertümliche „o König“. Der einzige Fußnotenmarker [a] steht unmittelbar nach der betreffenden Aussage.
