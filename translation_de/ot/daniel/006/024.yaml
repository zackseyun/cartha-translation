source:
  edition: WLC
  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א שַׂגִּיא֙ טְאֵ֣ב עֲל֔וֹ/הִי וּ/לְ/דָ֣נִיֵּ֔אל אֲמַ֖ר לְ/הַנְסָקָ֣ה מִן גֻּבָּ֑/א וְ/הֻסַּ֨ק דָּנִיֵּ֜אל מִן גֻּבָּ֗/א וְ/כָל חֲבָל֙ לָא הִשְׁתְּכַ֣ח בֵּ֔/הּ דִּ֖י הֵימִ֥ן בֵּ/אלָהֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: de
  text: Da freute sich der König sehr über ihn und befahl, Daniel aus der Grube heraufzuholen. Daniel wurde aus der Grube[a] heraufgeholt, und man fand keinen Schaden an ihm, weil er seinem Gott vertraut hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Grube“ ist hier die Löwengrube. Das aramäische Wort bezeichnet eine grubenartige Einfriedung.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil er an seinen Gott geglaubt hatte“. Das aramäische Verb kann sowohl „glauben“ als auch „vertrauen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; „Da“ ist im Deutschen natürlich und wahrt den narrativen Zusammenhang.
- source_word: שַׂגִּיא טְאֵב עֲלֹוהִי
  choice: freute sich der König sehr über ihn
  rationale: Die Verbindung drückt starke Freude aus, deren Anlass Daniel ist. „Sich sehr über ihn freuen“ gibt dies idiomatisch wieder.
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: befahl, Daniel ... heraufzuholen
  rationale: Obwohl אֲמַר grundsätzlich „sagen“ bedeutet, zeigt der Infinitiv des Heraufbringens hier den befehlenden Sinn. Die deutsche Formulierung macht diesen syntaktischen Zusammenhang natürlich verständlich.
- source_word: גֻּבָּא
  choice: Grube
  rationale: Das Substantiv bezeichnet eine grubenartige Einfriedung. „Grube“ bewahrt die räumliche Vorstellung und passt zum wiederholten Heraufholen; der Kontext identifiziert sie als Löwengrube.
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: man fand keinerlei Verletzung an ihm
  rationale: חֲבָל bezeichnet hier körperlichen Schaden beziehungsweise eine Verletzung. Die unpersönliche aktive Wendung ist natürliches Deutsch und bewahrt die Vorstellung einer feststellbaren Unversehrtheit.
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: weil er seinem Gott vertraut hatte
  rationale: הֵימִן kann „glauben“ oder „vertrauen“ bedeuten. Im Zusammenhang der Rettung betont „vertrauen“ die persönliche Zuversicht; der Dativ nach „vertrauen“ ist idiomatisches Deutsch.
theological_decisions:
- issue: Grund für Daniels Bewahrung
  choice: weil er seinem Gott vertraut hatte
  alternative: weil er an seinen Gott geglaubt hatte
  rationale: Der ausdrücklich kausale Zusammenhang des aramäischen Textes bleibt erhalten, ohne zu erklären, ob oder auf welche Weise dieses Vertrauen als Verdienst oder Mittel zu verstehen wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bezeichnung „Grube“ erhält das Bild des Heraufholens; „Löwengrube“ wird in der Fußnote kontextuell erläutert. Die Vergangenheitsfolge wird mit Plusquamperfekt im Begründungssatz natürlich wiedergegeben.
