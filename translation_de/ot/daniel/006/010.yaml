lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Daraufhin
  rationale: Die aramäische Wendung bezeichnet hier die aus dem Vorangehenden folgende Reaktion. „Daraufhin“ gibt diesen folgernden Zusammenhang im Deutschen natürlich und knapp wieder.
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: König Darius
  rationale: Titel und Personenname stehen so in der üblichen deutschen Reihenfolge.
- source_word: רְשַׁם
  choice: unterzeichnete
  rationale: Das Verb kann „aufschreiben/eintragen“ bedeuten; im rechtlich-administrativen Zusammenhang bezeichnet es hier die schriftliche Bestätigung, durch die der König die Regelung in Kraft setzt.
- source_word: כְּתָבָא
  choice: das Schriftstück
  rationale: Das Substantiv bezeichnet etwas schriftlich Abgefasstes. „Schriftstück“ ist verständlich und wahrt den Bezug auf das konkrete Rechtsdokument, ohne es vorschnell mit dem darin enthaltenen Verbot gleichzusetzen.
- source_word: וֶאֱסָרָא
  choice: mit dem Verbot
  rationale: Das Wort bezeichnet eine bindende Untersagung. Die koordinierte aramäische Formulierung wird idiomatisch als Inhalt beziehungsweise rechtlicher Bestandteil des Schriftstücks wiedergegeben; die Fußnote bewahrt die formale Alternative.
