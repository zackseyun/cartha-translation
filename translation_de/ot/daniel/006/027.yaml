source:
  edition: WLC
  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: de
  text: Hiermit erlasse ich den Befehl, dass man im gesamten Herrschaftsgebiet meines Königreichs vor dem Gott Daniels zittern und sich fürchten soll.[a] Denn er ist der lebendige Gott und besteht in Ewigkeit. Sein Königreich wird nicht zerstört werden, und seine Herrschaft währt bis ans Ende.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aramäische Wortpaar kann auch im Sinn von „erbeben und Ehrfurcht haben“ verstanden werden; es bezeichnet starke, ehrfürchtige Furcht.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und seine Herrschaft bis zum Ende“; auch möglich: „seine Herrschaft besteht bis ans Ende“. Welches „Ende“ gemeint ist, wird nicht näher bestimmt.'
    reason: ambiguity
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: Hiermit erlasse ich den Befehl
  rationale: Die aramäische Verwaltungsformel bezeichnet eine vom König ausgehende verbindliche Anordnung. Die aktive deutsche Fassung gibt Urheber und amtlichen Charakter natürlich wieder.
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: im gesamten Herrschaftsgebiet meines Königreichs
  rationale: שָׁלְטָן bezeichnet hier den Macht- oder Herrschaftsbereich; die Formulierung bewahrt sowohl die räumlich-politische Reichweite als auch den Bezug auf das Königreich des Sprechers.
- source_word: זאעין וְדָחֲלִין
  choice: zittern und sich fürchten
  rationale: Das Wortpaar drückt starke Furcht und ehrfürchtiges Erschrecken aus. Die Übersetzung erhält beide Ausdrücke und schwächt sie nicht zu bloßer Verehrung ab.
- source_word: אֱלָהֵהּ דִּי דָנִיֵּאל
  choice: der Gott Daniels
  rationale: Die knappe Genitivverbindung gibt die aramäische Zuordnung natürlich und eindeutig wieder.
- source_word: אֱלָהָא חַיָּא
  choice: der lebendige Gott
  rationale: Die Wendung bezeichnet Daniels Gott als lebendig und steht im Kontext als bestimmte, bekenntnishafte Aussage.
- source_word: וְקַיָּם לְעָלְמִין
  choice: und besteht in Ewigkeit
  rationale: קַיָּם kann fortdauerndes Bestehen, Beständigkeit oder Bleiben ausdrücken. „Besteht in Ewigkeit“ wahrt die zeitliche Dauer ohne zusätzliche Deutung.
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: Sein Königreich wird nicht zerstört werden
  rationale: Das Verb bezeichnet hier das Zugrunde-Richten oder Zerstören; die passive Form und die Aussage von der Unzerstörbarkeit bleiben erhalten.
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: und seine Herrschaft währt bis ans Ende
  rationale: שָׁלְטָן meint Herrschaft oder Herrschergewalt. „Währt bis ans Ende“ macht die im Aramäischen knappe Dauerangabe in natürlichem Deutsch verständlich, ohne das nicht näher bestimmte Ende auszudeuten.
theological_decisions:
- issue: Die vom Erlass verlangte Haltung gegenüber dem Gott Daniels
  choice: vor dem Gott Daniels zittern und sich fürchten
  alternative: den Gott Daniels ehrfürchtig fürchten
  rationale: Die zwei starken aramäischen Ausdrücke werden nicht zu einer allgemeineren religiösen Haltung zusammengezogen. So bleibt die Spannung zwischen Schrecken und Ehrfurcht erhalten.
- issue: Gottes Fortbestand und die Unzerstörbarkeit seines Königreichs
  choice: er ist der lebendige Gott und besteht in Ewigkeit. Sein Königreich wird nicht zerstört werden
  alternative: er ist der lebendige und ewig beständige Gott; sein Reich ist unvergänglich
  rationale: Die gewählte Fassung folgt den einzelnen Aussagen des aramäischen Textes und vermeidet es, sie durch abstraktere dogmatische Begriffe zu erweitern.
- issue: Das nicht näher bestimmte Ende der göttlichen Herrschaft
  choice: seine Herrschaft währt bis ans Ende
  alternative: seine Herrschaft hat kein Ende
  rationale: Der Ausgangstext sagt wörtlich „bis zum Ende“, nicht ausdrücklich „ohne Ende“. Die Übersetzung bewahrt diese offene Formulierung, auch wenn der Zusammenhang dauerhafte Herrschaft betont.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit amtlichem Ton für den königlichen Erlass. Die Satzstruktur ist lesbar gegliedert; starke Furchtsprache und die knappe, offene Zeitangabe des Aramäischen bleiben erhalten.
