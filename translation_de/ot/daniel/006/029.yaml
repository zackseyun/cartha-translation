id: DAN.6.29
reference: Daniel 6:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: de
  text: Und dieser Daniel hatte Erfolg unter der Herrschaft des Darius und unter der Herrschaft des Persers Kyrus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: „unter der Herrschaft des Darius, das heißt unter der Herrschaft des Persers Kyrus“, falls beide Namen denselben Herrscher bezeichnen.'
    reason: Alternative Deutung der Verbindung zwischen den beiden Herrschaftsangaben.
lexical_decisions:
- source_word: דְּנָה
  choice: dieser
  rationale: Das Demonstrativpronomen hebt den zuvor genannten Daniel nochmals ausdrücklich hervor; „dieser Daniel“ bewahrt diese wiederaufnehmende Betonung.
- source_word: הַצְלַח
  choice: hatte Erfolg
  rationale: Das Verb bezeichnet Gelingen oder erfolgreiches Vorankommen. „Hatte Erfolg“ ist im modernen Deutschen natürlich und verengt die Aussage nicht auf materiellen Wohlstand.
- source_word: בְּמַלְכוּת
  choice: unter der Herrschaft
  rationale: Der Ausdruck kann wörtlich „im Königtum/Königreich“ bedeuten, bezeichnet hier aber vor allem den Zeitraum beziehungsweise die Herrschaft des jeweiligen Königs.
- source_word: דָּרְיָוֶשׁ
  choice: Darius
  rationale: Übliche deutsche Namensform.
- source_word: וּבְמַלְכוּת
  choice: und unter der Herrschaft
  rationale: Die wiederholte Präpositionalverbindung wird beibehalten, damit Struktur und Nachdruck des aramäischen Textes erkennbar bleiben.
- source_word: כּוֹרֶשׁ
  choice: Kyrus
  rationale: Übliche deutsche Namensform.
- source_word: פרסי
  choice: des Persers
  rationale: Die Herkunftsbezeichnung kennzeichnet Kyrus ethnisch beziehungsweise politisch; die Genitivform fügt sich natürlich in „unter der Herrschaft des Persers Kyrus“ ein.
theological_decisions:
- issue: Verhältnis zwischen Darius und Kyrus in diesem Vers
  choice: Beide Herrschaftsangaben werden als eigenständige, mit „und“ verbundene Wendungen wiedergegeben, ohne die Identität oder zeitliche Beziehung der Herrscher festzulegen.
  alternative: „unter der Herrschaft des Darius, das heißt unter der Herrschaft des Persers Kyrus“, falls beide Namen denselben Herrscher bezeichnen
  rationale: Der Wortlaut nennt Darius und Kyrus, erklärt aber nicht, ob es sich um aufeinanderfolgende Herrscher oder um zwei Bezeichnungen für denselben Herrscher handelt. Die Übersetzung lässt diese Spannung bestehen; die mögliche erläuternde Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung bleibt nah an der aramäischen Satzstruktur, ohne unnatürlich wörtlich zu wirken.
