  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: de
  text: 'Alle hohen Beamten des Königreichs – die Präfekten und Satrapen, die Räte und Statthalter – haben sich miteinander beraten[a], eine königliche Satzung[b] zu erlassen und ein Verbot rechtsverbindlich zu machen: Wer dreißig Tage lang von irgendeinem Gott oder Menschen etwas erbittet[c], außer von dir, König, soll in die Löwengrube geworfen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben sich miteinander verständigt“. Das aramäische Verb kann sowohl die gemeinsame Beratung als auch die daraus hervorgehende Einigung betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine königliche Verfügung“. Die aramäischen Rechtsbegriffe überschneiden sich in den Bedeutungsfeldern Satzung, Erlass und verbindliche Anordnung.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht eine Verbindung aus dem Verb „bitten“ und dem Substantiv „Bitte“. Gemeint ist, etwas von jemandem zu erbitten; der Ausdruck ist nicht auf religiöses Beten beschränkt.
    reason: source_clarity
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: haben sich miteinander beraten
  rationale: Das reziproke Ithpael bezeichnet gemeinsames Beraten beziehungsweise Sich-Verständigen. Die Formulierung wahrt den Beratungsaspekt, ohne ein formelles einstimmiges Beschlussergebnis ausdrücklich in den Text einzutragen.
- source_word: סָרְכֵי מַלְכוּתָא
  choice: die hohen Beamten des Königreichs
  rationale: Der Ausdruck bezeichnet ranghohe königliche Amtsträger. Die moderne Sammelbezeichnung passt zu der anschließenden Aufzählung.
- source_word: סִגְנַיָּא
  choice: die Präfekten
  rationale: Der historische Verwaltungstitel wird mit dem im Deutschen geläufigen Fachwort wiedergegeben.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Dies ist die etablierte historische Bezeichnung für persische Provinzverwalter.
- source_word: הַדָּבְרַיָּא
  choice: die Räte
  rationale: Die knappe Amtsbezeichnung gibt die beratende Funktion wieder und bleibt im Kontext einer Liste von Würdenträgern natürlich.
- source_word: פַחֲוָתָא
  choice: Statthalter
  rationale: Der Begriff bezeichnet Provinz- oder Regionalverwalter; „Statthalter“ ist historisch passend und unterscheidet das Amt von den übrigen Titeln.
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: eine königliche Satzung zu erlassen
  rationale: Die Verbindung von Verb und stammverwandtem Rechtsbegriff bezeichnet das verbindliche Inkraftsetzen einer königlichen Rechtsnorm. „Erlassen“ ist im modernen deutschen Rechts- und Verwaltungssprachgebrauch idiomatisch.
- source_word: וּלְתַקָּפָה אֱסָר
  choice: ein Verbot rechtsverbindlich zu machen
  rationale: Die Wendung meint, ein Verbot beziehungsweise eine Untersagung verbindlich zu befestigen. Die Übersetzung erhält sowohl den Verbotscharakter als auch die rechtliche Bindungswirkung.
- source_word: יִבְעֵה בָעוּ
  choice: etwas erbittet
  rationale: Die figura etymologica bezeichnet das Vorbringen einer Bitte. „Etwas erbittet“ ist im Deutschen natürlich und vermeidet die Verengung auf kultisches Beten.
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: von irgendeinem Gott oder Menschen
  rationale: Die Präposition מִן wird direkt mit „von“ wiedergegeben; zusammen mit „etwas erbittet“ entsteht zugleich idiomatisches Deutsch.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: innerhalb von dreißig Tagen
  rationale: Die Wendung bezeichnet den begrenzten Geltungszeitraum der Anordnung. „Innerhalb von dreißig Tagen“ ist knapp und verständlich, ohne einen über den Text hinausgehenden Anfangstermin auszuschreiben.
- source_word: לָהֵן מִנָּךְ
  choice: außer von dir
  rationale: Die alleinige Ausnahme wird präzise ausgedrückt; „von“ entspricht sowohl der aramäischen Konstruktion als auch dem deutschen Verb „erbitten“.
- source_word: לְגֹב אַרְיָוָתָא
  choice: in die Löwengrube
  rationale: Die traditionelle und allgemein verständliche deutsche Bezeichnung gibt die Grube beziehungsweise den Verschlag der Löwen treffend wieder.
theological_decisions:
- issue: Umfang der untersagten Bitte
  choice: „etwas erbittet“ statt „betet“
  alternative: „betet“ oder „eine Bitte richtet“
  rationale: Das Aramäische umfasst Bitten an einen Gott ebenso wie an einen Menschen. Die Übersetzung darf das Verbot daher nicht stillschweigend auf religiöses Gebet beschränken.
- issue: Beratung oder ausdrückliche Einigung der Amtsträger
  choice: „haben sich miteinander beraten“
  alternative: „sind gemeinsam übereingekommen“
  rationale: Das Verb kann gemeinsame Beratung bis hin zur Verständigung bezeichnen. Die gewählte Fassung bewahrt die lexikalische Offenheit und vermeidet, Einstimmigkeit stärker zu behaupten, als es die Verbform zwingend verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verwaltungssprache. Historische Amtstitel wie „Präfekten“ und „Satrapen“ bleiben erhalten; unnötig altertümliche Wendungen werden vermieden. Die Gedankenstriche gliedern die lange Ämterliste, ohne ihre Zugehörigkeit zum Satz zu verändern.
