base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: de
  text: Mein Gott hat seinen Engel gesandt und den Rachen der Löwen verschlossen[a], und sie haben mir keinen Schaden zugefügt; denn vor ihm wurde ich für unschuldig befunden[b]. Und auch dir gegenüber, König, habe ich kein Unrecht begangen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Boten“. Das aramäische Wort kann einen menschlichen oder himmlischen Boten bezeichnen; hier spricht der wunderhafte Zusammenhang für „Engel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Vor ihm wurde Unschuld (oder: Lauterkeit) bei mir gefunden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Und auch vor dir, König, habe ich nichts Schädliches getan.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: Mein Gott
  rationale: Gibt die bestimmte persönliche Beziehung der aramäischen Possessivform natürlich und würdig wieder.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: hat seinen Engel gesandt
  rationale: Das Perfekt bezeichnet die vollendete Rettungstat; מַלְאָךְ kann Bote oder Engel bedeuten, doch der wunderhafte Zusammenhang spricht hier für einen himmlischen Engel.
- source_word: וּסֲגַר פֻּם אַרְיָוָתָא
  choice: und den Rachen der Löwen verschlossen
  rationale: Die aramäische Wendung steht formal im Singular („Maul/Rachen der Löwen“). „Rachen“ ist im Deutschen bei Raubtieren natürlich und bewahrt den kollektiven Ausdruck.
- source_word: וְלָא חַבְּלוּנִי
  choice: sodass sie mir nichts antaten
  rationale: Das pluralische Verb bezieht sich auf die Löwen. „Nichts antun“ gibt das Ausbleiben von Verletzung idiomatisch wieder; „sodass“ macht den resultativen Zusammenhang mit dem Verschließen ihres Rachens deutlich.
- source_word: כָּל־קֳבֵל דִּי
  choice: denn
  rationale: Leitet den Grund für Daniels Bewahrung ein und klingt in direkter Rede natürlich.
- source_word: קָדָמוֹהִי זָכוּ הִשְׁתְּכַחַת לִי
  choice: vor ihm wurde ich für unschuldig befunden
  rationale: Bewahrt die gerichtliche Perspektive von „vor ihm“ und die passive Feststellung der זָכוּ, formuliert die aramäische Besitzkonstruktion aber in natürlichem Deutsch.
- source_word: וְאַף קֳדָמָיךְ מַלְכָּא
  choice: Und auch dir gegenüber, König
  rationale: Bezeichnet den zweiten Bezugsbereich von Daniels Unschuld. Der bloße Vokativ „König“ ist im modernen Deutschen würdevoller und natürlicher als „o König“.
- source_word: חֲבוּלָה לָא עַבְדֵת
  choice: habe ich kein Unrecht begangen
  rationale: Gibt die Aussage über eine schädigende oder unrechte Tat in ihrem moralisch-rechtlichen Sinn wieder.
theological_decisions:
- issue: Identität von מַלְאֲכֵהּ
  choice: seinen Engel
  alternative: seinen Boten
  rationale: Das Wort kann sowohl einen Boten als auch einen Engel bezeichnen. Im Zusammenhang der wunderhaften Rettung ist „Engel“ die naheliegende Lesart, ohne die Identität dieses Engels näher festzulegen.
- issue: Umfang von Daniels Unschuld
  choice: vor ihm wurde ich für unschuldig befunden
  alternative: Reinheit wurde bei mir vor ihm gefunden
  rationale: Die Aussage bezeichnet Daniels Unschuld hinsichtlich der gegen ihn erhobenen Sache und seiner Treue zu Gott; sie wird nicht zu einer Behauptung allgemeiner Sündlosigkeit ausgeweitet.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt klar und mündlich; gerichtliche Formulierungen wie „vor ihm“ und „für unschuldig befunden“ bewahren die rechtlich-moralische Spannung des aramäischen Textes.
