  text: וְ/הֵיתָ֨יִת֙ אֶ֣בֶן חֲדָ֔ה וְ/שֻׂמַ֖ת עַל פֻּ֣ם גֻּבָּ֑/א וְ/חַתְמַ֨/הּ מַלְכָּ֜/א בְּ/עִזְקְתֵ֗/הּ וּ/בְ/עִזְקָת֙ רַבְרְבָנ֔וֹ/הִי דִּ֛י לָא תִשְׁנֵ֥א צְב֖וּ בְּ/דָנִיֵּֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: de
  text: Dann wurde ein Stein herbeigebracht und auf die Öffnung der Grube gelegt. Der König versiegelte ihn mit seinem Siegelring und mit den Siegelringen seiner Würdenträger, damit an Daniels Angelegenheit nichts geändert würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit der Beschluss über Daniel nicht geändert würde“. Das aramäische Wort kann eine Angelegenheit, Absicht, Willensäußerung oder Entscheidung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיתָיִת אֶבֶן חֲדָה
  choice: Dann wurde ein Stein herbeigebracht
  rationale: Die aramäische Erzählform führt das nächste Geschehen ein. חֲדָה bedeutet wörtlich „ein/eins“; im Deutschen gibt der unbestimmte Artikel den idiomatischen Sinn natürlich wieder, ohne einen nicht geforderten Kontrast durch „ein einziger“ zu erzeugen.
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: und auf die Öffnung der Grube gelegt
  rationale: פֻּם heißt wörtlich „Mund“, bezeichnet hier aber idiomatisch die Öffnung. „Öffnung der Grube“ ist im modernen Deutschen klar und wahrt das konkrete Bild hinreichend; גֻּבָּא wird grundnah als „Grube“ wiedergegeben.
- source_word: וְחַתְמַהּ מַלְכָּא
  choice: Der König versiegelte ihn
  rationale: Das Verb bedeutet „versiegeln“. Das maskuline Pronomen bezieht sich im Deutschen natürlich auf den Stein, wobei sachlich die verschlossene Öffnung gegen Eingriffe gesichert wird.
- source_word: בְּעִזְקְתֵהּ וּבְעִזְקָת רַבְרְבָנוֹהִי
  choice: mit seinem Siegelring und mit den Siegelringen seiner Würdenträger
  rationale: עִזְקָה bezeichnet hier einen zum Siegeln verwendeten Ring. רַבְרְבָנִין meint hochgestellte Männer bzw. Amtsträger; „Würdenträger“ passt zum höfischen Zusammenhang und ist weniger erblich-ständisch als „Adlige“.
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְּדָנִיֵּאל
  choice: damit an der Angelegenheit Daniels nichts geändert würde
  rationale: צְבוּ kann Sache, Angelegenheit, Absicht, Wille oder Entscheidung bezeichnen. „Angelegenheit Daniels“ bewahrt die sachliche Unbestimmtheit besser als eine Festlegung auf Plan, Urteil oder Schicksal.
theological_decisions:
- issue: Reichweite von צְבוּ in Bezug auf Daniel
  choice: Angelegenheit Daniels
  alternative: Beschluss über Daniel / Daniels Schicksal
  rationale: Der Kontext legt eine amtlich festgelegte Lage nahe, doch das aramäische Wort bestimmt nicht eindeutig, ob ein Beschluss, eine Absicht oder die gesamte Angelegenheit gemeint ist. Die Übersetzung vermeidet daher eine theologische oder rechtliche Überpräzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Öffnung“ vermeidet das im Deutschen auffällige „Mund der Grube“; „Siegelring“ macht das verwendete Siegelinstrument verständlich. Der Fußnotenmarker steht unmittelbar nach dem mehrdeutigen Satzteil.
