id: DAN.8.15
reference: Daniel 8:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: de
  text: 'Und es geschah, als ich, Daniel, die Vision gesehen hatte und nach Verständnis suchte: Siehe, da stand mir gegenüber jemand, der wie ein Mann aussah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie die Erscheinung eines Mannes“.'
    reason: Die hebräische Formulierung כְּמַרְאֵה גָבֶר bezeichnet vergleichend das sichtbare Erscheinungsbild; die Hauptübersetzung gibt dies in natürlichem Deutsch wieder.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Gibt die hebräische narrative Weiterführung würdig und ohne unnötige Archaisierung wieder.
- source_word: בִּרְאֹתִי
  choice: als ich … gesehen hatte
  rationale: Der Infinitiv mit בְּ bildet einen Temporalsatz; das Plusquamperfekt verdeutlicht, dass auf das Sehen das Suchen nach Verständnis folgt.
- source_word: אֲנִי דָנִיֵּאל
  choice: ich, Daniel
  rationale: Bewahrt die ausdrückliche, leicht betonte Selbstbezeichnung.
- source_word: הֶחָזוֹן
  choice: die Vision
  rationale: Bezeichnet im Kontext Daniels die visionär geschaute Offenbarung und entspricht dem üblichen modernen deutschen Sprachgebrauch.
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: und nach Verständnis suchte
  rationale: Bewahrt das Bild des Suchens und gibt בִּינָה als Verständnis beziehungsweise Einsicht wieder, ohne bloß ein erfolgreiches Verstehen zu behaupten.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Erhält die aufmerksamkeitslenkende und feierliche Wirkung von הִנֵּה; der Doppelpunkt macht den Übergang im Deutschen lesbar.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: da stand mir gegenüber jemand
  rationale: Gibt die sichtbare Stellung der Gestalt vor beziehungsweise gegenüber Daniel natürlich wieder; „da“ unterstützt die präsentierende Funktion des Satzes.
- source_word: כְּמַרְאֵה גָבֶר
  choice: der wie ein Mann aussah
  rationale: Bewahrt den vergleichenden, phänomenologischen Charakter der Aussage und identifiziert die Gestalt nicht über den Wortlaut hinaus.
- source_word: גָבֶר
  choice: Mann
  rationale: Hier bezeichnet das Wort einen männlichen Menschen in der wahrgenommenen Erscheinung; mögliche Kraftkonnotationen sind im Kontext nicht vorrangig.
theological_decisions:
- issue: Wesen der Gestalt in כְּמַרְאֵה גָבֶר
  choice: Die Gestalt wird nur als jemand beschrieben, der wie ein Mann aussah.
  alternative: Die Gestalt ausdrücklich als Engel, wirklichen Menschen oder vorinkarnierte göttliche Gestalt bestimmen.
  rationale: Der Vers beschreibt lediglich die wahrgenommene Erscheinung. Die Übersetzung wahrt den Vergleich und lässt die genauere Identität offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ erhält den feierlichen, visionären Ton; die übrige Syntax bleibt für heutige Leser verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterten Wendung.
