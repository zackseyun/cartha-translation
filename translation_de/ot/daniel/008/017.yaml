  edition: WLC
  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: de
  text: 'Da kam er zu mir, wo ich stand. Als er herankam, geriet ich in Schrecken und fiel mit dem Gesicht zu Boden. Da sagte er zu mir: „Begreife, Menschensohn[a]: Die Vision gilt für die Zeit des Endes.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „Menschenkind“ oder „Sterblicher“. Hebräisch: ben-ʾadam, wörtlich „Sohn eines Menschen“ bzw. „Menschensohn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Vision betrifft den Zeitpunkt des Endes.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: nahe an die Stelle, wo ich stand
  rationale: אֵצֶל bezeichnet räumliche Nähe. Die Formulierung gibt Daniels Standort idiomatisch und ohne unnötige Ergänzung wieder.
- source_word: נִבְעַתִּי
  choice: geriet ich in Schrecken
  rationale: Das Nifal von בעת beschreibt heftiges Erschrecken oder Entsetzen. „Geriet ich in Schrecken“ wahrt die Intensität in natürlichem, würdigem Deutsch.
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: fiel mit dem Gesicht zu Boden
  rationale: Die hebräische Wendung bezeichnet ein Niederfallen auf das Gesicht. Die deutsche Fassung vermittelt die Körperhaltung klar und vermeidet das heute steife „auf mein Angesicht“.
- source_word: הָבֵן
  choice: Begreife
  rationale: Der Hifil-Imperativ von בין fordert Daniel auf, den Sinn der Offenbarung zu erfassen. „Begreife“ ist direkt und etwas nachdrücklicher als bloßes Wahrnehmen.
- source_word: בֶּן אָדָם
  choice: Menschensohn
  rationale: Die wörtliche und im Buch Daniel klanglich bedeutsame Anrede bleibt erhalten; eine Fußnote nennt idiomatische Möglichkeiten.
- source_word: לְעֵת קֵץ
  choice: für die Zeit des Endes
  rationale: Die Wiedergabe bleibt nahe am Hebräischen und bezeichnet einen Endzeitpunkt beziehungsweise eine Zeit der Vollendung, ohne ein bestimmtes eschatologisches System einzutragen.
- source_word: הֶחָזוֹן
  choice: die Vision
  rationale: Der bestimmte Ausdruck verweist auf die zuvor geschilderte Offenbarung. „Die Vision“ ist im Deutschen eindeutig und sachgerecht.
theological_decisions:
- issue: Wiedergabe von בֶּן אָדָם im apokalyptischen Zusammenhang
  choice: Menschensohn
  alternative: Menschenkind; Sterblicher
  rationale: „Menschensohn“ bewahrt die konkrete Formulierung und ihre innerbiblischen Anklänge. Die Fußnote macht zugleich deutlich, dass die Anrede hier Daniels Menschlichkeit hervorheben kann, ohne die Bedeutung vorschnell festzulegen.
- issue: Bedeutung von לְעֵת קֵץ
  choice: Die Vision gilt für die Zeit des Endes
  alternative: Die Vision betrifft den Zeitpunkt des Endes
  rationale: Die Hauptfassung wahrt die zeitliche Zuordnung und vermeidet eine detaillierte endzeitliche Deutung. Die Alternative zeigt, dass die Wendung auch stärker auf den Endzeitpunkt bezogen verstanden werden kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Menschensohn“ bleibt wegen der quellensprachlichen und literarischen Bedeutung stehen; ansonsten werden unnötig altertümliche Wendungen vermieden.
