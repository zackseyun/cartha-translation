  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: de
  text: Es wuchs bis zum Heer des Himmels[a] empor. Einige aus dem Heer und einige von den Sternen warf es zur Erde hinab und zertrat sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Heerschar des Himmels“. Der Ausdruck kann bildlich himmlische Wesen, Gottes Volk oder kosmische Mächte bezeichnen; das Hebräische lässt das Bild offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: Es wuchs
  rationale: Das Qal-Wayyiqtol von גדל beschreibt ein Zunehmen an Größe oder Ausmaß. „Es wuchs“ gibt das Bild natürlich wieder, ohne die nicht ausdrücklich reflexive Deutung „es erhob sich selbst“ einzutragen.
- source_word: עַד
  choice: bis ... empor
  rationale: Die Präposition bezeichnet hier die Ausdehnung bis in den himmlischen Bereich. Die geteilte Formulierung „bis ... empor“ macht die vertikale Bewegung im Deutschen deutlich.
- source_word: צְבָא הַשָּׁמַיִם
  choice: das Heer des Himmels
  rationale: צָבָא kann ein Heer oder eine große Schar bezeichnen. „Heer des Himmels“ bewahrt die Mehrdeutigkeit zwischen Gestirnen, himmlischen Wesen und einer symbolisch dargestellten Gemeinschaft.
- source_word: וַתַּפֵּל
  choice: warf ... hinab
  rationale: 'Der Hifil von נפל ist kausativ: „zu Fall bringen“. „Hinabwerfen“ gibt die gewaltsame Handlung und ihre Richtung idiomatisch wieder.'
- source_word: אַרְצָה
  choice: zur Erde
  rationale: Die Richtungsform von אֶרֶץ bezeichnet eine Bewegung erdwärts. „Zur Erde“ passt zum kosmischen Bild des Verses.
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: einige aus dem Heer und einige von den Sternen
  rationale: מִן ist hier am natürlichsten partitiv zu verstehen. Das ergänzte „einige“ verdeutlicht, dass nicht notwendig das gesamte Heer und alle Sterne hinabgeworfen werden.
- source_word: הַכּוֹכָבִים
  choice: die Sterne
  rationale: Die direkte Bedeutung bleibt erhalten; mögliche symbolische Bezugspunkte werden nicht in den Haupttext eingetragen.
- source_word: וַתִּרְמְסֵם
  choice: und zertrat sie
  rationale: רמס bedeutet „zertreten, niedertrampeln“. „Zertrat sie“ ist knapp und kraftvoll; das maskuline Pluralsuffix bezieht sich auf die zuvor Hinabgeworfenen.
theological_decisions:
- issue: Sind mit dem „Heer des Himmels“ und den „Sternen“ Engel, Gottes Volk oder Himmelskörper gemeint?
  choice: Die Bildsprache „Heer des Himmels“ und „Sterne“ bleibt im Haupttext unaufgelöst.
  alternative: Engel; Gottes Volk beziehungsweise die Heiligen; Himmelskörper als Sinnbilder von Herrschern oder Mächten
  rationale: Der apokalyptische Zusammenhang legt eine symbolische Bedeutung nahe, doch der hebräische Vers bestimmt die Bezugspunkte nicht ausdrücklich. Die Übersetzung bewahrt deshalb die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Heer des Himmels“ erhält bewusst die biblisch-apokalyptische Bildsprache; Satzbau und Verben bleiben zugleich für heutige Leser klar.
