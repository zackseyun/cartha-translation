source:
  edition: WLC
  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: de
  text: Und ein Heer wurde zusammen mit[b] dem regelmäßigen Opfer[a] wegen des Frevels preisgegeben. Und es warf die Wahrheit zu Boden[c]; es handelte und hatte Erfolg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich auch „das Beständige“; gemeint ist im Zusammenhang das regelmäßig dargebrachte Tempelopfer. Möglich sind daher auch „das tägliche Opfer“ oder „das beständige Opfer“.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Konstruktion ist schwierig. Statt „zusammen mit“ ist auch die Wiedergabe „gegen das regelmäßige Opfer“ möglich.
    reason: alternative_reading
  - marker: c
    text: Die hebräischen Verben stehen im Femininum Singular. Ihr genauer Bezug bleibt in der verdichteten Bildsprache offen und kann auf die zuvor dargestellte feindliche Macht weisen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: ein Heer
  rationale: צָבָא bezeichnet ein Heer oder eine Heerschar. „Ein Heer“ wahrt den kollektiven und militärischen Sinn, ohne genauer festzulegen, wer damit gemeint ist.
- source_word: תִּנָּתֵן
  choice: wurde … preisgegeben
  rationale: Der Nifal von נתן ist passiv. „Preisgegeben“ bringt im feindlichen Zusammenhang zum Ausdruck, dass etwas fremder Gewalt überlassen wird.
- source_word: עַל
  choice: zusammen mit
  rationale: Die Präposition ist hier syntaktisch schwierig. „Zusammen mit“ verbindet das Heer und das regelmäßige Opfer, ohne die ebenfalls mögliche gegnerische Bedeutung stillschweigend festzuschreiben.
- source_word: הַתָּמִיד
  choice: das regelmäßige Opfer
  rationale: תָּמִיד bezeichnet in diesem kultischen Zusammenhang das regelmäßig dargebrachte Tempelopfer. „Regelmäßiges Opfer“ ist verständlich und vermeidet eine nicht ausdrücklich im Wort enthaltene Festlegung auf „Brandopfer“.
- source_word: בְּפָשַׁע
  choice: wegen des Frevels
  rationale: Die Präposition ב wird kausal verstanden. „Frevel“ gibt den bewussten, aufrührerischen Charakter von פֶּשַׁע wieder, ohne festzulegen, wessen Frevel gemeint ist.
- source_word: וְתַשְׁלֵךְ
  choice: und es warf
  rationale: שלך bedeutet „werfen“ oder „schleudern“. Das unpersönliche „es“ lässt den in der Vision verdichteten Bezug offen.
- source_word: אֱמֶת
  choice: die Wahrheit
  rationale: אֱמֶת kann Wahrheit oder Treue bedeuten. Hier bewahrt „Wahrheit“ die breite moralisch-religiöse Aussage.
- source_word: אַרְצָה
  choice: zu Boden
  rationale: Die Richtungsform von אֶרֶץ bedeutet idiomatisch „zur Erde/zu Boden“; „zu Boden“ ist im Deutschen die natürliche Wendung.
- source_word: וְעָשְׂתָה
  choice: es handelte
  rationale: עשה ist ein allgemeines Verb für Tun oder Handeln. Da kein Objekt genannt wird, bewahrt „handelte“ die knappe Formulierung.
- source_word: וְהִצְלִיחָה
  choice: hatte Erfolg
  rationale: Der Hifil von צלח bedeutet hier „Erfolg haben“ oder „gelingen“. „Hatte Erfolg“ ist modernes, klares Deutsch und bezeichnet keinen moralisch guten Ausgang.
theological_decisions:
- issue: Bezug und Handlungsträger der femininen Singularformen
  choice: Die Verben werden mit dem unbestimmten Pronomen „es“ wiedergegeben.
  alternative: „Sie warf die Wahrheit zu Boden“ oder ausdrücklich „das Horn warf die Wahrheit zu Boden“.
  rationale: Die hebräischen Verben stehen im Femininum Singular, doch ihr genauer Bezug bleibt in der gedrängten Bildsprache unklar. „Es“ vermeidet es, das kleine Horn, das Heer oder eine andere Größe ausdrücklich zum Handlungsträger zu erklären.
- issue: Bedeutung von הַתָּמִיד
  choice: „das regelmäßige Opfer“
  alternative: „das tägliche Opfer“, „das beständige Opfer“ oder „das regelmäßige Brandopfer“
  rationale: Der Ausdruck verweist im Zusammenhang auf den regelmäßigen Tempeldienst. Die gewählte Form ist verständlich, kultisch eindeutig genug und legt die im Einzelwort nicht ausgesprochene Opferart nicht unnötig fest.
- issue: Verhältnis von Heer und regelmäßigem Opfer
  choice: Beide werden durch „zusammen mit“ als gemeinsam preisgegeben dargestellt.
  alternative: „Ein Heer wurde gegen das regelmäßige Opfer eingesetzt“ oder „über das regelmäßige Opfer gestellt“.
  rationale: Die Konstruktion mit עַל ist schwierig. Der Haupttext folgt der möglichen Vorstellung eines gemeinsamen Geschicks; die gegnerische Deutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzfolge. „Frevel“ wahrt das Gewicht von פֶּשַׁע; „hatte Erfolg“ ist natürlicher als das heute leicht wirtschaftlich klingende „gedieh“. Die Fußnoten machen die drei wesentlichen Unsicherheiten sichtbar, ohne sie im Haupttext konfessionell oder historisch festzulegen.
