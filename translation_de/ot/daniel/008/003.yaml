  text: וָ/אֶשָּׂ֤א עֵינַ/י֙ וָ/אֶרְאֶ֔ה וְ/הִנֵּ֣ה אַ֣יִל אֶחָ֗ד עֹמֵ֛ד לִ/פְנֵ֥י הָ/אֻבָ֖ל וְ/ל֣/וֹ קְרָנָ֑יִם וְ/הַ/קְּרָנַ֣יִם גְּבֹה֗וֹת וְ/הָ/אַחַת֙ גְּבֹהָ֣ה מִן הַ/שֵּׁנִ֔ית וְ/הַ֨/גְּבֹהָ֔ה עֹלָ֖ה בָּ/אַחֲרֹנָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: de
  text: 'Da erhob ich meine Augen und sah: Siehe, ein Widder stand vor dem Kanal[a] und hatte zwei Hörner. Die Hörner waren hoch, doch das eine war höher als das andere, und das höhere kam später hervor.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bach“ oder „Fluss“. Das hebräische Wort bezeichnet einen Wasserlauf und meint in Daniel wahrscheinlich einen Kanal.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und das höhere entstand später“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Da erhob ich meine Augen
  rationale: Die hebräische Wendung bezeichnet das bewusste Richten des Blicks. Die relativ formale Wiedergabe ist im Deutschen verständlich und bewahrt den visionären Erzählton.
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'und sah: Siehe'
  rationale: וְהִנֵּה lenkt die Aufmerksamkeit lebhaft auf das nun Wahrgenommene. „Siehe“ bewahrt diese deiktische Kraft und den gehobenen Ton.
- source_word: אַיִל אֶחָד
  choice: ein einzelner Widder
  rationale: אַיִל bezeichnet spezifisch einen Widder. „Ein einzelner“ gibt אֶחָד ausdrücklich wieder und hebt die eine symbolische Gestalt hervor.
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: stand vor dem Kanal
  rationale: Das Partizip עֹמֵד beschreibt die Stellung des Widders. אֻבָל bezeichnet einen Wasserlauf und meint in Daniel wahrscheinlich einen Kanal; mögliche weitere Wiedergaben werden in der Fußnote genannt.
- source_word: וְלוֹ קְרָנָיִם
  choice: und hatte zwei Hörner
  rationale: Die hebräische Besitzkonstruktion, wörtlich „und ihm waren zwei Hörner“, wird im Deutschen natürlich mit „hatte“ wiedergegeben.
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: Die Hörner waren hoch
  rationale: גְּבֹהוֹת bezeichnet die sichtbare Höhe der Hörner. „Hoch“ ist direkt und erhält die lexikalische Verbindung zum folgenden Vergleich.
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: doch das eine war höher als das andere
  rationale: „Das andere“ ist im Deutschen natürlicher als das wörtliche „das zweite“. „Doch“ macht den im Zusammenhang liegenden Gegensatz deutlich, ohne ihn interpretierend auszubauen.
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: und das höhere wuchs zuletzt empor
  rationale: עֹלָה beschreibt hier wahrscheinlich das Hervorkommen beziehungsweise Wachstum des Horns. „Zuletzt“ bewahrt die zeitliche Aussage von בָּאַחֲרֹנָה; eine alternative Formulierung steht in der Fußnote.
theological_decisions:
- issue: Symbolische Tierbilder in der apokalyptischen Vision
  choice: Die konkrete Bildsprache mit Widder und Hörnern bleibt ohne Deutung im Vers erhalten.
  alternative: Die Symbole bereits im Vers durch die später genannten Reiche oder Herrscher erklären.
  rationale: Die Deutung folgt erst später im Kapitel. Eine interpretierende Erweiterung an dieser Stelle würde die Spannung und Entfaltung der Vision vorwegnehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. „Siehe“ wurde als bewusst gehobenes, aber geläufiges Signalwort beibehalten; Satzbau und Besitzkonstruktion wurden natürlich deutsch gestaltet.
