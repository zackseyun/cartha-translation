  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: de
  text: Und ich sah, wie er sich dem Widder näherte[a]. Er geriet gegen ihn in Wut[b], schlug den Widder und zerbrach seine beiden Hörner. Der Widder hatte keine Kraft, ihm standzuhalten[c]. Er warf ihn zu Boden und zertrampelte ihn, und niemand konnte den Widder aus seiner Gewalt retten[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie er an den Widder herankam“. Das hebräische Verb kann ein Näherkommen oder Erreichen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Er erbitterte sich gegen ihn.“ Der hebräische Ausdruck vermittelt erbitterte Wut und heftige Feindseligkeit.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor ihm zu stehen“. Im Kampfzusammenhang bedeutet dies, ihm Widerstand zu leisten.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „aus seiner Hand“. Die Hand steht hier für Macht oder Gewalt.'
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו
  choice: Und ich sah, wie er
  rationale: Das erste-personige Perfekt mit maskulinem Objektsuffix setzt Daniels Visionsbericht fort; das Pronomen bezieht sich im Kontext auf den Ziegenbock.
- source_word: מַגִּיעַ אֵצֶל
  choice: sich dem Widder näherte
  rationale: Das Partizip von נגע mit אֵצֶל bezeichnet das Herankommen beziehungsweise Erreichen; „sich nähern“ gibt die Bewegung natürlich wieder, ohne ein tatsächliches Berühren vorauszusetzen.
- source_word: הָאַיִל
  choice: der Widder
  rationale: אַיִל bezeichnet in dieser TierVision eindeutig den Widder.
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: Er wurde von Zorn gegen ihn erfüllt
  rationale: Der Hitpael von מרר vermittelt erbitterte, intensive Feindseligkeit. Die Formulierung bewahrt die emotionale Aussage, ohne sie in eine bloße Angriffsbewegung umzudeuten.
- source_word: וַיַּךְ
  choice: stieß
  rationale: נכה bedeutet schlagen beziehungsweise treffen. „Stieß“ passt zum Angriff des gehörnten Ziegenbocks und bleibt gegenüber dem genauen Einsatz der Hörner zurückhaltend.
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: und zerbrach seine beiden Hörner
  rationale: שבר bedeutet „brechen/zerbrechen“; das Suffix verweist auf die beiden Hörner des Widders.
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל
  choice: Der Widder hatte keine Kraft
  rationale: כֹּחַ bezeichnet hier im unmittelbaren Kampfgeschehen Kraft oder Widerstandskraft.
- source_word: לַעֲמֹד לְפָנָיו
  choice: ihm standzuhalten
  rationale: Wörtlich „vor ihm zu stehen“; im Konfliktzusammenhang ist die idiomatische Bedeutung „ihm standzuhalten“ im Deutschen klarer.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: Er warf ihn zu Boden
  rationale: השליך bezeichnet Werfen oder Schleudern, und אַרְצָה die Bewegung hinab zur Erde beziehungsweise zum Boden.
- source_word: וַיִּרְמְסֵהוּ
  choice: und zertrat ihn
  rationale: רמס bezeichnet gewaltsames Treten oder Niedertrampeln; „zertrat“ ist knapp und bildkräftig.
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: und niemand konnte den Widder aus seiner Gewalt retten
  rationale: מַצִּיל bezeichnet einen Retter oder Befreier. Das hebräische „aus seiner Hand“ ist hier idiomatisch als Befreiung aus Macht oder Gewalt wiedergegeben.
