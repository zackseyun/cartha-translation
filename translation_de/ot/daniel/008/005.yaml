source:
  edition: WLC
  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: de
  text: Während ich noch nachdachte, siehe, da kam ein Ziegenbock vom Westen her über die ganze Erde, ohne den Boden zu berühren.[a] Der Bock hatte ein auffälliges Horn zwischen seinen Augen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und es gab kein Berühren der Erde“ – ein Bild außergewöhnlicher Geschwindigkeit.'
    reason: Die Fußnote gibt die Konstruktion mit אין und Partizip wieder, ohne fälschlich ein im Hebräischen nicht ausdrücklich gesetztes Subjekt als wörtlichen Wortlaut auszugeben.
  - marker: b
    text: 'Oder: „ein markantes“ oder „ein hervorstechendes Horn“.'
    reason: חָזוּת bezeichnet die auffällige beziehungsweise markante Erscheinung des Horns; die genaue Nuance bleibt unsicher.
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: während ich noch darüber nachdachte
  rationale: Die Verbindung von היה mit dem Partizip bezeichnet einen fortdauernden Vorgang. מֵבִין meint hier das aufmerksame Durchdenken der Vision; „noch“ unterstreicht den Verlauf im Erzählzusammenhang.
- source_word: וְהִנֵּה
  choice: 'sieh: Da'
  rationale: Die Wendung führt anschaulich und überraschend ein neues Element der Vision ein. „Sieh“ bewahrt den visionären Hinweischarakter, während „Da“ den deutschen Satz natürlich weiterführt.
- source_word: צְפִיר הָעִזִּים
  choice: ein Ziegenbock
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich ein männliches Tier. „Ziegenbock“ ist im modernen Deutschen eindeutig und idiomatisch.
- source_word: מִן הַמַּעֲרָב
  choice: vom Westen her
  rationale: מַעֲרָב bezeichnet die Himmelsrichtung Westen; „vom Westen her“ gibt Richtung und Bewegung natürlich wieder.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: über die ganze Erde hinweg
  rationale: Die Formulierung bewahrt den umfassenden räumlichen Eindruck von עַל־פְּנֵי, ohne die hebräische Wendung „über das Angesicht“ unnatürlich nachzubilden.
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: ohne den Erdboden zu berühren
  rationale: Die idiomatische deutsche Formulierung gibt das Bild einer Bewegung wieder, die den Boden nicht berührt und dadurch außergewöhnliche Geschwindigkeit andeutet.
- source_word: קֶרֶן חָזוּת
  choice: ein auffälliges Horn
  rationale: קֶרֶן ist das konkrete und später symbolisch ausgelegte „Horn“. Das seltene חָזוּת hebt hier dessen sichtbare, markante Erscheinung hervor; „auffällig“ bewahrt diese Bedeutung, ohne die spätere Deutung vorwegzunehmen.
- source_word: בֵּין עֵינָיו
  choice: zwischen seinen Augen
  rationale: Die räumliche Angabe wird wörtlich und verständlich wiedergegeben. Das grammatische Maskulinum entspricht dem zuvor genannten Bock.
theological_decisions:
- issue: Symbolische Tierbilder der apokalyptischen Vision
  choice: Die konkreten Bilder „Ziegenbock“ und „Horn“ bleiben unaufgelöst stehen.
  alternative: Die Bilder bereits hier als Reich und Herrscher wiederzugeben.
  rationale: Der Vers schildert zunächst nur die Vision; ihre geschichtliche Deutung folgt erst später. Eine interpretierende Übersetzung würde die literarische Abfolge vorwegnehmen.
- issue: Reichweite von כָל הָאָרֶץ
  choice: „die ganze Erde“
  alternative: „das ganze Land“
  rationale: Beides kann lexikalisch möglich sein. Der weiträumige visionäre Zusammenhang und die Bewegung aus dem Westen sprechen hier für „Erde“, ohne damit eine bestimmte kosmografische oder historische Deutung festzulegen.
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. „Sieh: Da“ erhält die Anschaulichkeit von וְהִנֵּה, ohne das heute steife „siehe, da“ vollständig zu übernehmen. Die Bildsprache bleibt konkret und wird nicht durch ihre spätere Auslegung ersetzt.'
