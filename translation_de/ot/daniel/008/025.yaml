source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: de
  text: Durch seine Klugheit wird er Betrug erfolgreich einsetzen. In seinem Herzen wird er sich selbst groß machen. Während sie sich sicher fühlen, wird er viele vernichten. Er wird sich gegen den Fürsten der Fürsten erheben; doch ohne Hand[a] wird er zerbrochen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne Hand“; wahrscheinlich: nicht durch gewöhnliche menschliche Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: seine Klugheit
  rationale: Das Wort bezeichnet Einsicht, Verstand oder kluges Vorgehen. Im feindseligen Zusammenhang erhält „Klugheit“ einen moralisch zwiespältigen Klang, ohne die negative Wertung durch „Gerissenheit“ stärker auszudrücken, als der hebräische Ausdruck selbst es tut.
- source_word: וְהִצְלִיחַ מִרְמָה
  choice: wird er den Betrug … gelingen lassen
  rationale: 'Der Hifil von צלח ist kausativ, und מִרְמָה ist sein Objekt: Er bewirkt, dass der Betrug Erfolg hat.'
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Die Formulierung bewahrt das hebräische Bild und kann sowohl seine Wirksamkeit als auch seinen Macht- und Verfügungsbereich bezeichnen.
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: In seinem Herzen wird er sich selbst groß machen
  rationale: Das reflexive Objekt ist im Hebräischen nur sinngemäß enthalten. Die Wiedergabe bewahrt sowohl das innere Geschehen im Herzen als auch das Bild des Sich-groß-Machens.
- source_word: וּבְשַׁלְוָה
  choice: Während man sich sicher fühlt
  rationale: שַׁלְוָה bezeichnet Ruhe, Sorglosigkeit oder Sicherheit. Die Formulierung bringt die arglose Lage zum Ausdruck, in der die Vielen vernichtet werden, ohne sie unnötig als bestimmten Zeitraum festzulegen.
- source_word: יַשְׁחִית רַבִּים
  choice: wird er viele vernichten
  rationale: Der Hifil von שׁחת bedeutet hier am natürlichsten „vernichten“ oder „ins Verderben bringen“; „vernichten“ ist im apokalyptisch-politischen Zusammenhang klar und prägnant.
- source_word: שַׂר שָׂרִים
  choice: den Fürsten der Fürsten
  rationale: Die Status-constructus-Verbindung bezeichnet den höchsten Fürsten beziehungsweise Herrscher. Die wörtlich transparente Titelform bleibt erhalten.
- source_word: וְעַל … יַעֲמֹד
  choice: wird sich gegen … erheben
  rationale: עמד mit עַל drückt hier feindlichen Widerstand aus. „Sich gegen … erheben“ ist idiomatisch und bewahrt die konfrontative Bildsprache.
- source_word: וּבְאֶפֶס יָד
  choice: ohne das Zutun einer Hand
  rationale: Die elliptische Wendung wird bildnah wiedergegeben, bleibt im Deutschen aber verständlicher als das bloße „ohne Hand“. Sie lässt im Haupttext offen, welche nichtmenschliche Macht den Sturz herbeiführt.
- source_word: יִשָּׁבֵר
  choice: wird er zerbrochen werden
  rationale: Der Nifal von שׁבר ist passiv. „Zerbrochen werden“ erhält die Metapher und nennt den Handelnden nicht.
theological_decisions:
- issue: Referent und Großschreibung von שַׂר שָׂרִים
  choice: Fürst der Fürsten
  alternative: Fürst der Fürsten als nicht näher bestimmter höchster Herrscher beziehungsweise „Fürst der Fürsten“ ohne Verständnis als Titel
  rationale: Im Zusammenhang des Danielbuches bezeichnet die Wendung einen höchsten, transzendenten Herrscher. Die Großschreibung behandelt sie als Titel, ohne den Referenten über die Aussage des Verses hinaus ausdrücklich zu bestimmen.
- issue: Bedeutung von וּבְאֶפֶס יָד
  choice: ohne das Zutun einer Hand
  alternative: ohne menschliches Zutun
  rationale: Das Hebräische nennt „menschlich“ nicht ausdrücklich. Die bildnahe Haupttextfassung bewahrt diese Kürze und Spannung; die Fußnote erläutert die wahrscheinlich gemeinte nichtmenschliche beziehungsweise nicht gewöhnlich menschliche Einwirkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde leicht gegliedert, um die dichte hebräische Reihung verständlich wiederzugeben. Bildhafte Ausdrücke wie „in seiner Hand“, „sich selbst groß machen“ und „zerbrochen werden“ bleiben erhalten; erklärende Präzisierungen wurden nicht in den Haupttext eingetragen.
