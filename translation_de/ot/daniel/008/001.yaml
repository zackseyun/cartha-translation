  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת בֵּלְאשַׁצַּ֣ר הַ/מֶּ֑לֶךְ חָז֞וֹן נִרְאָ֤ה אֵלַ/י֙ אֲנִ֣י דָנִיֵּ֔אל אַחֲרֵ֛י הַ/נִּרְאָ֥ה אֵלַ֖/י בַּ/תְּחִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: de
  text: Im dritten Jahr der Herrschaft des Königs Belsazar erschien mir, Daniel, eine Vision nach dem, was mir am Anfang[a] erschienen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »am Anfang«. Die Wendung kann sich auf eine frühere Erscheinung beziehungsweise Vision beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: Im dritten Jahr
  rationale: Die hebräische Datierungsformel verwendet die Kardinalzahl idiomatisch mit ordinaler Bedeutung; »im dritten Jahr« ist die natürliche deutsche Wiedergabe.
- source_word: לְמַלְכוּת בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: der Herrschaft König Belsazars
  rationale: מַלְכוּת bezeichnet hier die Regierungszeit. Die deutsche Fügung bewahrt sowohl den Eigennamen als auch den ausdrücklich genannten Königstitel, ohne die unnatürliche hebräische Wortstellung nachzuahmen.
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: erschien mir … eine Vision
  rationale: Das Nifal von ראה bezeichnet im Visionszusammenhang ein Erscheinen. Die deutsche Wortstellung klingt natürlich und bewahrt die Vision als Subjekt des Erscheinens.
- source_word: אֲנִי דָנִיֵּאל
  choice: mir, Daniel
  rationale: Die ausdrückliche Selbstbezeichnung wird als Apposition wiedergegeben; dadurch bleiben Identifikation und leichter Nachdruck erhalten.
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי
  choice: nach jener, die mir … erschienen war
  rationale: »Jener« nimmt die zuvor genannte Vision auf, ohne das Substantiv unnötig zu wiederholen. Das Plusquamperfekt kennzeichnet im Deutschen das frühere Erscheinen.
- source_word: בַּתְּחִלָּה
  choice: zuerst
  rationale: Im Zusammenhang verweist die Wendung auf die frühere beziehungsweise erste Vision in der Abfolge. »Zuerst« ist verständliches, idiomatisches Deutsch; die wörtlichere Möglichkeit wird in der Fußnote erhalten.
theological_decisions: []
