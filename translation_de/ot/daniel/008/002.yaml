id: DAN.8.2
reference: Daniel 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָֽ/אֶרְאֶה֮ בֶּ/חָזוֹן֒ וַ/יְהִי֙ בִּ/רְאֹתִ֔/י וַ/אֲנִי֙ בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֔ה אֲשֶׁ֖ר בְּ/עֵילָ֣ם הַ/מְּדִינָ֑ה וָ/אֶרְאֶה֙ בֶּֽ/חָז֔וֹן וַ/אֲנִ֥י הָיִ֖יתִי עַל אוּבַ֥ל אוּלָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: de
  text: Und ich sah in der Vision. Als ich hinsah, befand ich mich in Susa, der Zitadelle, die in der Provinz Elam liegt. Und ich sah in der Vision, dass ich am Ulai-Kanal[a] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ulai-Fluss“ beziehungsweise „Ulai-Bach“. Das hebräische Wort bezeichnet allgemein einen Wasserlauf; „Kanal“ passt wahrscheinlich am besten zur Umgebung Susas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Und ich sah
  rationale: Die Form erzählt ein vergangenes Geschehen. „Ich sah“ gibt beide Vorkommen natürlich wieder; beim zweiten Satz wird ראה zur Vermeidung unnötiger Schwerfälligkeit mit „hinsah“ ausgedrückt.
- source_word: בֶּחָזוֹן
  choice: in der Vision
  rationale: Die Präposition bezeichnet den visionären Wahrnehmungsrahmen. Der bestimmte Ausdruck passt zu Daniels konkreter, bereits eingeführter Vision.
- source_word: וַיְהִי בִּרְאֹתִי
  choice: Als ich hinsah
  rationale: Die hebräische Wendung leitet einen temporalen Nebensatz ein. Das unpersönliche וַיְהִי muss im Deutschen nicht eigens mit „es geschah“ wiedergegeben werden.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: in Susa, der Zitadelle
  rationale: „Susa“ ist die im Deutschen übliche Namensform. בִּירָה bezeichnet hier den befestigten königlichen beziehungsweise administrativen Komplex; „Zitadelle“ wahrt diesen Sinn besser als das engere „Palast“.
- source_word: אֲשֶׁר בְּעֵילָם הַמְּדִינָה
  choice: die in der Provinz Elam liegt
  rationale: Der Relativsatz ordnet Susa geografisch ein. „Provinz“ gibt den administrativen Gebietsausdruck מְדִינָה idiomatisch wieder.
- source_word: וַאֲנִי הָיִיתִי
  choice: dass ich … war
  rationale: Nach dem wiederholten „ich sah in der Vision“ bezeichnet die Wendung den Inhalt der Wahrnehmung. Das im Deutschen ergänzte „dass“ verdeutlicht diesen Zusammenhang.
- source_word: עַל
  choice: am
  rationale: Bei einem Gewässer bezeichnet עַל die Lage an oder bei ihm, nicht notwendig eine Position darauf.
- source_word: אוּבַל
  choice: Kanal
  rationale: Das Wort bezeichnet einen Wasserlauf oder Wasserkanal. „Kanal“ passt gut zur wahrscheinlichen Umgebung Susas, ohne die breitere lexikalische Möglichkeit in der Fußnote zu verschweigen.
- source_word: אוּלָי
  choice: Ulai
  rationale: Der Eigenname des Wasserlaufs wird nach der üblichen deutschen Form transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „ich sah in der Vision“ bleibt als Merkmal des hebräischen Textes erhalten; lediglich die temporale Wendung wird idiomatisch gestrafft.
