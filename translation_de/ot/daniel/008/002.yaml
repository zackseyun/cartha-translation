  terminology: „Susa“, „Zitadelle“, „Provinz Elam“, „Ulai“ und „Kanal“ sind sachgerecht. Die Fußnote markiert zutreffend, dass אוּבַל ein weiter gefasster Begriff für einen Wasserlauf sein kann, während „Kanal“ im Kontext eine plausible Wahl bleibt.
