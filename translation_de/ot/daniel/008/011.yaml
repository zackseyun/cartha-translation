id: DAN.8.11
reference: Daniel 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: de
  text: Es erhob sich sogar bis zum Fürsten der Heerschar[a]. Von ihm[b] wurde das regelmäßige Opfer[c] weggenommen, und die Stätte seines Heiligtums[d] wurde niedergeworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heerschar“ kann ein Heer oder die himmlische Heerschar bezeichnen; die Identität ihres Fürsten wird hier nicht ausdrücklich genannt.
    reason: Mehrdeutigkeit des Titels und seines Bezugs
  - marker: b
    text: Wörtlich „von ihm“; worauf sich das Pronomen bezieht, ist umstritten.
    reason: Unklarer Pronomenbezug
  - marker: c
    text: Auch „das beständige Opfer“ oder „das tägliche Opfer“; im Tempelzusammenhang bezeichnet der Ausdruck den regelmäßigen Opferdienst, traditionell das regelmäßige Brandopfer.
    reason: Lexikalische Alternative und kultischer Kontext
  - marker: d
    text: Auch „das Fundament seines Heiligtums“. Das hebräische Wort kann eine Stätte, einen festen Standort oder ein Fundament bezeichnen.
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: וְעַד
  choice: sogar bis zu
  rationale: עַד bezeichnet die erreichte Grenze („bis zu“); וְ führt die Aussage fort, und „sogar“ bringt die steigernde, überraschende Zuspitzung im Zusammenhang zum Ausdruck.
- source_word: שַׂר הַצָּבָא
  choice: Fürst der Heerschar
  rationale: שַׂר kann „Fürst“, „Herrscher“ oder „Befehlshaber“ bedeuten. „Fürst“ bewahrt den erhabenen Titel, während „Heerschar“ die mögliche himmlische oder militärische Bedeutung von צָבָא offenhält.
- source_word: הִגְדִּיל
  choice: erhob sich
  rationale: Der Hifil von גדל bezeichnet hier im Zusammenhang die anmaßende Selbsterhöhung des Horns. „Erhob sich“ ist im Deutschen natürlich und bewahrt die reflexive Aussage, ohne die Identität des angegriffenen Fürsten auszudeuten.
- source_word: וּמִמֶּנּוּ
  choice: von ihm
  rationale: Das Suffix ist maskulin Singular. Die wörtliche Wiedergabe bewahrt den umstrittenen Bezug des Pronomens.
- source_word: הרים
  choice: wurde weggenommen
  rationale: Im Zusammenhang mit הַתָּמִיד bezeichnet die Form die Beseitigung des regelmäßigen Opferdienstes. Die passive Wiedergabe folgt der überlieferten Lesart und vermeidet eine unbegründete Festlegung des handelnden Subjekts.
- source_word: הַתָּמִיד
  choice: das regelmäßige Opfer
  rationale: תָּמִיד bedeutet „beständig, regelmäßig“ und steht im Tempelzusammenhang elliptisch für den fortlaufenden Opferdienst, traditionell besonders für das regelmäßige Brandopfer. „Regelmäßiges Opfer“ macht den kultischen Bezug verständlich, ohne „Brand-“ ausdrücklich in den Haupttext einzutragen.
- source_word: וְהֻשְׁלַךְ
  choice: wurde niedergeworfen
  rationale: Der Hofal ist passiv und vermittelt ein gewaltsames Niederwerfen. Die deutsche Form bewahrt dieses Bild.
- source_word: מְכוֹן
  choice: Stätte
  rationale: מָכוֹן kann eine feste Stätte, einen Standort oder ein Fundament bezeichnen. „Stätte“ passt idiomatisch zum Heiligtum und lässt die bauliche Bedeutung „Fundament“ als mögliche Alternative offen.
- source_word: מִקְדָּשׁוֹ
  choice: seines Heiligtums
  rationale: מִקְדָּשׁ bezeichnet einen heiligen Ort beziehungsweise ein Heiligtum. „Heiligtum“ bewahrt den kultischen Sinn, ohne den Ausdruck unnötig auf den gesamten Tempelkomplex einzuengen.
theological_decisions:
- issue: Identität des „Fürsten der Heerschar“
  choice: Der Titel bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Möglich sind unter anderem Gott selbst, ein himmlischer Fürst, ein Hoherpriester oder in bestimmten Auslegungstraditionen der Messias.
  rationale: Der hebräische Titel ist erhaben, bestimmt seinen Träger aber nicht ausdrücklich. Eine neutrale Wiedergabe bewahrt die theologische und historische Spannung.
- issue: Bezugswort von וּמִמֶּנּוּ („von ihm“)
  choice: Das maskuline Pronomen wird wörtlich als „von ihm“ wiedergegeben.
  alternative: Je nach syntaktischer Deutung kann der Bezug beim Fürsten, beim Horn oder bei einem anderen zuvor genannten maskulinen Ausdruck gesehen werden; manche Übersetzungen deuten sinngemäß um.
  rationale: Der hebräische Text lässt den Bezug im Diskurs umstritten. Der Haupttext soll diese Mehrdeutigkeit nicht stillschweigend auflösen.
- issue: Umfang von הַתָּמִיד
  choice: „das regelmäßige Opfer“
  alternative: „das beständige Opfer“, „das tägliche Opfer“ oder umfassender „der regelmäßige Opferdienst“
  rationale: Der Ausdruck bezeichnet im Kultzusammenhang den regelmäßig fortgesetzten Dienst, nennt hier jedoch das Brandopfer nicht ausdrücklich. Die gewählte Form ist verständlich und bleibt lexikalisch zurückhaltend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch einen Punkt übersichtlich gegliedert. „Heerschar“, „Heiligtum“ und „niedergeworfen“ bewahren den erhöhten prophetischen Ton, ohne unnötig altertümlich zu wirken.
