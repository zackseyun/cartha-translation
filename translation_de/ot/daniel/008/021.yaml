base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: de
  text: Und der zottige Ziegenbock[a] ist der König von Griechenland[b], und das große Horn zwischen seinen Augen ist der erste König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der haarige Ziegenbock“; kürzer auch: „der Ziegenbock“. Der hebräische Ausdruck hebt anschaulich das zottige oder haarige Fell des männlichen Tieres hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Jawan“, womit hier Griechenland beziehungsweise der griechische Machtbereich gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: der zottige Ziegenbock
  rationale: Die Wortverbindung bezeichnet einen männlichen Ziegenbock und hebt zugleich sein zottiges beziehungsweise haariges Fell hervor. Die Wiedergabe bewahrt beide Elemente des anschaulichen hebräischen Ausdrucks.
- source_word: מֶלֶךְ יָוָן
  choice: der König von Griechenland
  rationale: יָוָן bezeichnet in diesem Zusammenhang Griechenland beziehungsweise den griechischen Machtbereich. Da מֶלֶךְ im Singular steht und eine Person bezeichnet, wird „König“ statt „Königreich“ gewählt.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: das große Horn
  rationale: Diese Wiedergabe erhält das Symbolbild und gibt sowohl Größe als auch herausragende Bedeutung des Horns natürlich wieder.
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: zwischen seinen Augen
  rationale: Die knappe deutsche Fügung gibt den Inhalt des Relativsatzes natürlich wieder. „Seinen“ entspricht dem maskulinen Singularsuffix und bezieht sich auf den Ziegenbock.
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: ist der erste König
  rationale: רִאשׁוֹן bezeichnet hier den ersten in einer Abfolge. „König“ wahrt die lexikalische Entsprechung zu מֶלֶךְ im ersten Satzteil.
theological_decisions:
- issue: Bezug des symbolischen Ziegenbocks und des großen Horns
  choice: Der Ziegenbock wird als König von Griechenland und das große Horn als der erste König wiedergegeben.
  alternative: Der Ziegenbock kann kollektiv für das griechische Königreich beziehungsweise die griechische Macht stehen.
  rationale: Der hebräische Text verwendet ausdrücklich מֶלֶךְ יָוָן („König von Griechenland“) und identifiziert anschließend das Horn als „den ersten König“. Die Übersetzung bewahrt diese Spannung zwischen einem persönlichen König und seiner möglichen repräsentativen Funktion, ohne eine spätere historische Identifizierung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markante Formulierung „zottige Ziegenbock“ bewahrt die Bildhaftigkeit des Hebräischen; Satzbau und Symbolbegriffe bleiben nah am Ausgangstext.
