  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: de
  text: Und gegen Ende ihrer Herrschaft, wenn die Übertreter das Maß vollgemacht haben, wird ein König auftreten, der ein hartes Gesicht hat und Rätsel versteht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der dunkle Aussprüche versteht“; im Zusammenhang möglicherweise auch: „der sich auf Ränke versteht“.'
    reason: Lexikalische und kontextuelle Bedeutungsbreite von חִידוֹת.
lexical_decisions:
- source_word: וּבְאַחֲרִית מַלְכוּתָם
  choice: Und gegen Ende ihrer Herrschaft
  rationale: אַחֲרִית bezeichnet den späteren Abschnitt beziehungsweise das Ende einer Zeitspanne. מַלְכוּת steht im Singular mit einem Suffix der 3. Person Plural; „ihre Herrschaft“ gibt diese kollektive Zuordnung natürlich wieder, ohne den Singular zu unbegründeten „Königreichen“ zu erweitern.
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: wenn die Übertreter das Maß vollgemacht haben
  rationale: תמם drückt Vollendung oder das Erreichen eines Endpunkts aus. Die idiomatische Wendung macht deutlich, dass die Übertretung ihr volles Maß erreicht, nicht notwendigerweise, dass die betreffenden Menschen aufhören zu existieren. „Übertreter“ bewahrt den rebellisch-moralischen Gehalt von פשׁע.
- source_word: יַעֲמֹד מֶלֶךְ
  choice: wird ein König auftreten
  rationale: עמד kann im politischen Zusammenhang das Auftreten oder Emporkommen eines Herrschers bezeichnen. „Auftreten“ ist im Deutschen natürlich und präzise.
- source_word: עַז פָּנִים
  choice: mit hartem Gesicht
  rationale: Die Wendung bedeutet wörtlich etwa „stark/hart von Gesicht“ und beschreibt Härte, Dreistigkeit oder Unerbittlichkeit. „Mit hartem Gesicht“ bewahrt das hebräische Bild, ohne eine einzelne Charakterdeutung übermäßig festzulegen.
- source_word: וּמֵבִין חִידוֹת
  choice: und einer, der Rätsel versteht
  rationale: Die Wiedergabe bleibt nahe bei בין („verstehen“) und חידות („Rätsel“, „dunkle beziehungsweise rätselhafte Aussprüche“). Eine mögliche Bedeutung im Sinn politischer Verschlagenheit wird nicht in den Haupttext hineingelesen, sondern in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Deutung von וּמֵבִין חִידוֹת
  choice: der Rätsel versteht
  alternative: der sich auf Ränke versteht / der dunkle Aussprüche versteht
  rationale: Der hebräische Ausdruck kann die Fähigkeit bezeichnen, Rätsel oder dunkle Aussprüche zu verstehen, im Kontext aber auch auf Scharfsinn und Verschlagenheit hindeuten. Der Haupttext wahrt das konkrete hebräische Bild; die Fußnote erhält die kontextuelle Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Maß vollmachen“ ist eine geläufige gehobene Wendung; die sonstige Syntax bleibt klar und allgemein verständlich. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
