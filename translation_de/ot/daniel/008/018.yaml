  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י נִרְדַּ֥מְתִּי עַל פָּנַ֖/י אָ֑רְצָ/ה וַ/יִּ֨גַּע בִּ֔/י וַ/יַּֽעֲמִידֵ֖/נִי עַל עָמְדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: de
  text: Während er mit mir redete, fiel ich mit dem Gesicht zur Erde in einen tiefen Schlaf.[a] Da berührte er mich und brachte mich wieder zum Stehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde ich von tiefem Schlaf überwältigt“. Das hebräische Wort kann tiefen Schlaf oder einen Zustand der Benommenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „stellte mich auf meinen Stand“. Die ungewöhnliche Wendung kann bedeuten, dass er Daniel wieder aufrichtete oder ihn an seinem Platz zum Stehen brachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Während er mit mir redete
  rationale: ב mit dem Infinitivus constructus bezeichnet hier den gleichzeitigen Vorgang; עִם wird seinem üblichen Sinn entsprechend mit „mit“ wiedergegeben.
- source_word: נִרְדַּמְתִּי
  choice: fiel ich … in tiefen Schlaf
  rationale: Das Nifal von רדם bezeichnet das Hineinfallen in tiefen Schlaf beziehungsweise einen schlafähnlichen Stupor. Die Formulierung bewahrt den einsetzenden Charakter, ohne einen technischen Begriff wie „Trance“ einzuführen.
- source_word: עַל־פָּנַי אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die räumliche Wendung bedeutet wörtlich ungefähr „auf meinem Gesicht, erdwärts“ und beschreibt Daniels Körperhaltung knapp und natürlich.
- source_word: וַיִּגַּע בִּי
  choice: Da berührte er mich
  rationale: נגע mit ב bedeutet hier schlicht „berühren“; ein stärkeres Verb ist vom Kontext nicht gefordert.
- source_word: וַיַּעֲמִידֵנִי עַל־עָמְדִי
  choice: brachte mich wieder zum Stehen
  rationale: Die Hifil-Form gibt das Veranlassen des Stehens wieder. Die idiomatische deutsche Formulierung wahrt die Wiederherstellung von Daniels stehender Haltung, ohne das ungewöhnliche hebräische Substantivgefüge hölzern nachzubilden.
theological_decisions:
- issue: Art von Daniels Zustand während der Vision
  choice: tiefer Schlaf
  alternative: Trance oder visionäre Ekstase
  rationale: רדם bezeichnet tiefen Schlaf oder einen schlafähnlichen Stupor, legt aber keinen technisch-theologischen Begriff für Ekstase fest. Die Übersetzung lässt die genaue Natur des Zustands offen.
- issue: Bedeutung von עַל־עָמְדִי
  choice: Wiederherstellung einer stehenden Haltung
  alternative: Rückkehr an den vorherigen Standort
  rationale: Die Wendung kann wörtlich auf Daniels „Stehen“ beziehungsweise seinen Stand verweisen. Im Zusammenhang ist die körperliche Aufrichtung sicher, während ein bestimmter Standort weniger eindeutig ist; die Fußnote bewahrt diese Möglichkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält das gleichzeitige Reden und Einsinken in Schlaf zusammen; „Da“ führt die unmittelbar folgende Berührung ein. Keine konfessionell oder technisch-theologisch festgelegte Deutung wird ergänzt.
