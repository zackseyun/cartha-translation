base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: de
  text: Der Ziegenbock wurde überaus mächtig. Doch als er auf der Höhe seiner Kraft war, zerbrach das große Horn. An seiner Stelle[a] wuchsen vier weithin sichtbare Hörner[b] empor, zu den vier Winden des Himmels hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter ihr“ (bezogen auf das Horn); hier im Sinn von „an seiner Stelle“ oder „anstelle von ihm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vier auffällige Hörner“. Im Hebräischen steht ungewöhnlich „vier Sichtbare/Auffällige“; „Hörner“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: der Ziegenbock
  rationale: Die Wortverbindung bezeichnet ausdrücklich einen männlichen Ziegenbock; die knappe deutsche Bezeichnung ist präzise und natürlich.
- source_word: הִגְדִּיל עַד מְאֹד
  choice: wurde überaus mächtig
  rationale: Die Form von גדל bezeichnet hier ein außerordentliches Anwachsen an Macht oder Bedeutung. „Mächtig“ passt im Deutschen zum visionären Herrschaftsbild besser als das räumlich missverständliche „groß“.
- source_word: וּכְעָצְמוֹ
  choice: als er auf der Höhe seiner Kraft war
  rationale: Die Wendung beschreibt den Zeitpunkt seiner Stärke. Diese Wiedergabe erhält den zeitlichen Bezug und macht deutlich, dass das Horn gerade bei voller Kraft zerbricht.
- source_word: נִשְׁבְּרָה
  choice: zerbrach
  rationale: Das hebräische Nifal bezeichnet das Gebrochenwerden beziehungsweise Zerbrechen; im Deutschen gibt „zerbrach“ den Vorgang knapp und anschaulich wieder, ohne einen Handelnden zu ergänzen.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: das große Horn
  rationale: Die wörtliche Bildsprache bleibt erhalten; „groß“ kann sowohl Ausmaß als auch Bedeutung ausdrücken.
- source_word: וַתַּעֲלֶנָה
  choice: wuchsen … empor
  rationale: עלה beschreibt hier das Hervorkommen beziehungsweise Aufsteigen der neuen Hörner. „Emporwachsen“ entspricht dem Bild eines Horns und klingt im Deutschen natürlich.
- source_word: חָזוּת אַרְבַּע
  choice: vier weithin sichtbare Hörner
  rationale: חָזוּת bezeichnet hier wohl Sichtbarkeit oder auffällige Erscheinung. „Hörner“ wird aus dem unmittelbaren Zusammenhang ergänzt; „weithin sichtbar“ bewahrt den visuellen Charakter, ohne die Hörner bereits historisch auszudeuten.
- source_word: תַּחְתֶּיהָ
  choice: an seiner Stelle
  rationale: Wörtlich steht „unter ihm/ihr“; in diesem Ersetzungskontext bezeichnet die Wendung idiomatisch die Stelle des zerbrochenen Horns.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: den vier Winden des Himmels entgegen
  rationale: Die traditionelle kosmische Richtungsmetapher bleibt erhalten. Die Präposition ל wird als Ausrichtung der vier Hörner auf die vier Himmelsrichtungen verstanden.
theological_decisions:
- issue: Symbolische Bilder im Haupttext oder historische Auslegung
  choice: „Horn“ und „vier Winde des Himmels“ bleiben als Bilder der Vision stehen.
  alternative: Die Hörner unmittelbar als Könige oder Reiche und die Winde als bloße Himmelsrichtungen wiedergeben.
  rationale: Der Vers selbst schildert die Vision bildhaft; ihre historische Deutung soll nicht vorwegnehmend in die Übersetzung eingetragen werden.
- issue: Mehrdeutigkeit von חָזוּת אַרְבַּע
  choice: „vier weithin sichtbare Hörner“ mit erläuternder Fußnote
  alternative: „vier auffällige“ beziehungsweise „vier ansehnliche Hörner“
  rationale: Der ungewöhnliche hebräische Ausdruck hebt Sichtbarkeit oder Hervortreten hervor. Die gewählte Fassung hält diese visuelle Nuance fest, ohne eine dogmatische Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher apokalyptischer Bildsprache. Die Satzfolge wurde leicht gegliedert, damit der starke Gegensatz zwischen höchster Kraft und plötzlichem Zerbrechen klar hervortritt. Alle Ergänzungen aus dem Kontext werden durch Fußnoten transparent gemacht.
