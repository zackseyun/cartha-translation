  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: de
  text: 'Und was das zerbrochene Horn betrifft, an dessen Stelle vier auftraten: Vier Königreiche werden aus diesem Volk hervorgehen, jedoch nicht mit seiner Macht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Suffix ist maskulin Singular und kann sich auf den ersten König beziehen. Im Bildzusammenhang wird es auch als Bezug auf die Macht des zerbrochenen Horns beziehungsweise des ursprünglichen Reiches verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: was das zerbrochene Horn betrifft
  rationale: Das feminine substantivierte Partizip bezieht sich auf das feminine קֶרֶן („Horn“) aus Vers 21. Das Bezugswort wird zur Klarheit ergänzt; die Wendung gibt den erklärenden Übergang natürlich wieder.
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: an dessen Stelle vier auftraten
  rationale: עמד bezeichnet hier das Auftreten beziehungsweise Entstehen politischer Mächte. תַּחְתֶּיהָ verweist auf das Horn und bedeutet „an seiner Stelle“.
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: vier Königreiche
  rationale: מַלְכוּת kann Königtum, Herrschaft oder Reich bedeuten. Im Kontext der vier aus einem Volk hervorgehenden Nachfolgemächte ist „Königreiche“ die klare und natürliche Wiedergabe.
- source_word: מִגּוֹי
  choice: aus diesem Volk
  rationale: גּוֹי bezeichnet ein Volk oder eine Nation. „Dieses Volk“ macht den Rückbezug auf das zuvor genannte griechische Herrschaftsgebilde verständlich, ohne den Text historisch weiter festzulegen.
- source_word: יַעֲמֹדְנָה
  choice: werden … hervorgehen
  rationale: Das erneute עמד bezeichnet hier das Entstehen der vier Herrschaftsgebilde. „Hervorgehen“ verbindet sich im Deutschen idiomatisch mit „aus diesem Volk“.
- source_word: וְלֹא בְכֹחוֹ
  choice: jedoch nicht mit seiner Macht
  rationale: כֹּחַ bedeutet „Kraft“ oder „Macht“. Der maskuline Singularsuffix kann sich auf den ersten König beziehen, während König und Horn im Bild eng verbunden sind. Das deutsche „seiner“ bewahrt den maskulinen Bezug, lässt aber ohne Fußnote offen, ob der König oder ein zuvor vorausgesetzter Herrschaftsträger gemeint ist.
theological_decisions:
- issue: Bezugswort des Suffixes in וְלֹא בְכֹחוֹ
  choice: „nicht mit seiner Macht“, mit möglichem Bezug auf den ersten König
  alternative: „nicht mit deren Macht“, mit Bezug auf die Macht des zerbrochenen Horns beziehungsweise des ursprünglichen Reiches
  rationale: Der hebräische Suffix ist maskulin Singular und legt im Deutschen zunächst „seiner“ nahe. Da die Vision König und Horn symbolisch miteinander verknüpft, bleibt der sachliche Bezug mehrdeutig. Die alternative symbolisch-sächliche Deutung wird deshalb in einer Fußnote erhalten, ohne einen historischen Namen in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem erklärenden Charakter der Deutung, vermeidet aber unnötig altertümliche Wendungen. „Volk“ gibt גּוֹי hier natürlicher wieder als das politisch enger wirkende „Nation“.
