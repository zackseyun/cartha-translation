source:
  edition: WLC
  text: וָ/אֶשְׁמְעָ֥/ה אֶֽחָד קָד֖וֹשׁ מְדַבֵּ֑ר וַ/יֹּאמֶר֩ אֶחָ֨ד קָד֜וֹשׁ לַ/פַּֽלְמוֹנִ֣י הַֽ/מְדַבֵּ֗ר עַד מָתַ֞י הֶ/חָז֤וֹן הַ/תָּמִיד֙ וְ/הַ/פֶּ֣שַׁע שֹׁמֵ֔ם תֵּ֛ת וְ/קֹ֥דֶשׁ וְ/צָבָ֖א מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: de
  text: 'Da hörte ich einen Heiligen reden. Ein Heiliger sagte zu dem, der sprach[a]: „Wie lange gilt die Vision vom regelmäßigen Brandopfer[b] und vom verwüstenden Frevel[c] und davon, dass das Heiligtum und die Heerschar[d] der Zertretung preisgegeben werden?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „zu Palmoni, der sprach“, falls לַפַּלְמוֹנִי als Eigenname oder Titel und nicht als unbestimmte Bezeichnung verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „das tägliche Opfer“. Das hebräische תָּמִיד bezeichnet das regelmäßig fortlaufende Opfer im Tempeldienst.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Frevel, der Verwüstung bringt“.'
    reason: lexical_alternative
  - marker: d
    text: „Heerschar“ kann die mit dem Heiligtum verbundenen Menschen, ein Heer oder eine andere geschlossene Gruppe bezeichnen; das Hebräische legt den Bezug hier nicht eindeutig fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: Heiliger
  rationale: Das substantivierte Adjektiv bezeichnet im Zusammenhang der Vision ein heiliges himmlisches Wesen. „Heiliger“ bildet die hebräische Form transparent ab, ohne ausdrücklich „Engel“ einzusetzen.
- source_word: לַפַּלְמוֹנִי
  choice: zu dem
  rationale: Die seltene und schwierige Form bezeichnet wahrscheinlich einen nicht näher bestimmten beziehungsweise bestimmten Gesprächspartner. Die knappe Wiedergabe im Haupttext vermeidet eine unbegründete Festlegung; die mögliche Auffassung als Name oder Titel steht in der Fußnote.
- source_word: הַמְדַבֵּר
  choice: der sprach
  rationale: Das Partizip kennzeichnet den Angesprochenen als den gerade Redenden. Die Formulierung ist im Deutschen natürlich und bleibt nah am Hebräischen.
- source_word: הֶחָזוֹן
  choice: die Vision vom … und davon
  rationale: Die folgenden Ausdrücke benennen den Inhalt der Vision. Die deutsche Konstruktion macht diesen Zusammenhang verständlich, ohne die syntaktischen Beziehungen stärker als nötig festzulegen.
- source_word: הַתָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: Der substantivierte Ausdruck bezeichnet im Kultzusammenhang das regelmäßig dargebrachte Opfer, traditionell das tägliche Brandopfer. Die Wiedergabe benennt diesen Bezug klarer als „das Beständige“.
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: der verwüstende Frevel
  rationale: „Frevel“ bringt den Sinn von Übertretung beziehungsweise Auflehnung zum Ausdruck; „verwüstend“ wahrt die kompakte Verbindung mit der verheerenden Wirkung, ohne sie zu einer späteren technischen Formel zu machen.
- source_word: תֵּת
  choice: dass … preisgegeben werden
  rationale: Der Infinitiv bezeichnet das Ausliefern beziehungsweise Preisgeben von Heiligtum und Heerschar. Die finite deutsche Konstruktion ist idiomatisch und bewahrt die passive Ergebnisperspektive.
- source_word: קֹדֶשׁ
  choice: das Heiligtum
  rationale: Im Zusammenhang der Tempelvision ist ein konkreter heiliger Ort gemeint; „Heiligtum“ gibt dies besser wieder als das abstrakte „Heiligkeit“.
- source_word: צָבָא
  choice: die Heerschar
  rationale: Das Wort kann ein Heer, eine Schar oder eine andere geordnete Gesamtheit bezeichnen. „Heerschar“ erhält diese Breite, ohne den Bezug eindeutig auf Menschen oder himmlische Wesen festzulegen.
- source_word: מִרְמָס
  choice: der Zertretung
  rationale: Das Nomen bezeichnet das Zertreten beziehungsweise Niedertrampeln. Die nominale Wiedergabe folgt der hebräischen Form und drückt Entweihung und Erniedrigung aus.
theological_decisions:
- issue: Identität der Heiligen
  choice: Im Haupttext als „Heiliger“ bezeichnet, im Visionszusammenhang als himmlisches heiliges Wesen verstanden
  alternative: menschlicher Heiliger; ausdrücklich „Engel“
  rationale: Der visionäre Zusammenhang spricht für himmlische Gestalten. Dennoch setzt der hebräische Text nicht das Wort „Engel“, weshalb die Übersetzung die allgemeinere Bezeichnung bewahrt.
- issue: Bezug von צָבָא
  choice: als „Heerschar“ ohne nähere Bestimmung wiedergegeben
  alternative: das Volk Gottes; das himmlische Heer; eine irdische Armee
  rationale: Der Bezug ist im Kontext umstritten. Die allgemeinere Wiedergabe erhält die exegetische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage bleibt syntaktisch dicht und orientiert sich an der hebräischen Reihung; zugleich sorgen „vom … und davon, dass …“ sowie „preisgegeben werden“ für einen natürlichen deutschen Satzfluss. Sämtliche textkritisch oder lexikalisch relevanten Alternativen werden an den markierten Stellen offengehalten.
