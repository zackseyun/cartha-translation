  text: וַ/יֹּ֣אמֶר אֵלַ֔/י עַ֚ד עֶ֣רֶב בֹּ֔קֶר אַלְפַּ֖יִם וּ/שְׁלֹ֣שׁ מֵא֑וֹת וְ/נִצְדַּ֖ק קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Bis 2.300 Abende und Morgen[a] vergangen sind; dann wird das Heiligtum in den rechten Zustand versetzt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis Abend–Morgen, 2.300«. Die Wendung kann entweder 2.300 volle Tage oder 2.300 Abend- und Morgenopfer bezeichnen, also etwa 1.150 Tage.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »dann wird das Heiligtum gereinigt«, »in sein Recht gesetzt« oder »gerechtfertigt«. Das hebräische Verb bedeutet wörtlich, dass etwas ins Recht beziehungsweise in Ordnung gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Die Erzählform von אמר führt die Antwort in fortlaufender Erzählung ein; אֵלַי bezeichnet den Empfänger der Rede eindeutig als »zu mir«.
- source_word: עַד
  choice: Bis
  rationale: עַד markiert hier als Antwort auf die Frage nach der Dauer den zeitlichen Endpunkt und wird im Deutschen unmittelbar mit »bis« wiedergegeben.
- source_word: עֶרֶב בֹּקֶר
  choice: Abende und Morgen
  rationale: Die beiden hebräischen Substantive bleiben erkennbar, ohne die umstrittene Frage zu entscheiden, ob volle Tage oder einzelne Abend- und Morgenopfer gezählt werden.
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: '2.300'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise mit Tausenderpunkt wiedergegeben.
- source_word: וְנִצְדַּק
  choice: wird wieder in den rechten Zustand versetzt werden
  rationale: Das Nifal von צדק bezeichnet hier, dass etwas ins Recht beziehungsweise wieder in Ordnung gebracht wird. Die Formulierung wahrt die Bedeutungsbreite besser als das enger kultische »gereinigt«.
- source_word: קֹדֶשׁ
  choice: das Heiligtum
  rationale: Im Zusammenhang von Daniel 8 bezeichnet קֹדֶשׁ am natürlichsten den heiligen Ort beziehungsweise das Heiligtum.
theological_decisions:
- issue: Bedeutung von וְנִצְדַּק קֹדֶשׁ
  choice: das Heiligtum wird wieder in den rechten Zustand versetzt werden
  alternative: das Heiligtum wird gereinigt / gerechtfertigt / in sein Recht eingesetzt werden
  rationale: Der hebräische Text verwendet צדק und nicht das üblichere טהר für »reinigen«. Die Hauptfassung gibt daher das umfassendere In-Ordnung-Bringen wieder; mögliche engere Deutungen stehen in der Fußnote.
- issue: Zeitliche Bedeutung von עֶרֶב בֹּקֶר
  choice: 2.300 Abende und Morgen
  alternative: 2.300 volle Tage oder 2.300 Abend- und Morgenopfer, entsprechend etwa 1.150 Tagen
  rationale: Die Übersetzung bewahrt die auslegungsrelevante Offenheit der hebräischen Wendung und legt die Chronologie nicht im Haupttext fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während »wieder in den rechten Zustand versetzt« die seltene und theologisch offene Verbwahl verständlich wiedergibt. Beide Fußnotenmarker stehen im Haupttext.
