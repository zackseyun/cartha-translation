revisions:
- from: 'Und er sagte zu mir: »Bis 2.300 Abende und Morgen[a]; dann wird das Heiligtum wieder in den rechten Zustand versetzt werden.[b]«'
  to: 'Und er sagte zu mir: »Bis 2.300 Abende und Morgen[a] vergangen sind; dann wird das Heiligtum in den rechten Zustand versetzt.[b]«'
  rationale: Die Revision korrigiert die deutsche Syntax der elliptischen Zeitangabe und glättet die Passivkonstruktion. Sie erhält die Quelltextambiguität zu „Abend–Morgen“ sowie die bewusst nicht auf kultische Reinigung verengte Wiedergabe von וְנִצְדַּק vollständig.
