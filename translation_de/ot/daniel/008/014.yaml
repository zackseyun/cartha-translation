  verdict: revise
  source_fidelity: Die Übersetzung gibt עַד, die Zahl und die offene Wendung עֶרֶב בֹּקֶר grundsätzlich zutreffend wieder. Für וְנִצְדַּק wird mit „in den rechten Zustand versetzt“ der Sinn des Ins-Recht-/In-Ordnung-Gebrachtwerdens angemessen bewahrt. Die Ergänzung „vergangen sind“ macht die im Hebräischen elliptische Zeitangabe im Deutschen grammatisch vollständig, ohne die umstrittene Zählweise festzulegen.
  naturalness: „Bis 2.300 Abende und Morgen“ ist als selbstständige deutsche Zeitangabe unvollständig und wirkt syntaktisch abgebrochen. „Bis 2.300 Abende und Morgen vergangen sind“ ist modernes, würdiges Standarddeutsch. Die Straffung von „versetzt werden“ zu „versetzt“ vermeidet ein unnötig schweres doppeltes Passiv.
  terminology: „Heiligtum“ ist im Kontext treffend. „In den rechten Zustand versetzt“ ist gegenüber „gereinigt“ nicht voreingenommen und wahrt die weitere Bedeutung von צדק. In der Fußnote ist „in sein Recht gesetzt“ die idiomatischere deutsche Alternative als „in sein Recht eingesetzt“.
  issues:
  - severity: medium
    issue: Unvollständige Zeitkonstruktion im Haupttext
    rationale: Die Verbindung „Bis 2.300 Abende und Morgen“ benötigt im Deutschen ein prädikatives Element. „… vergangen sind“ expliziert nur die in der Antwort auf die Dauerfrage vorausgesetzte Ellipse und entscheidet weder zwischen Tagen noch Opferterminen.
  - severity: low
    issue: Schwerfällige doppelte Passivform
    rationale: „wird … versetzt werden“ ist zwar verständlich, aber unnötig schwerfällig. „wird … versetzt“ ist dieselbe Vorgangspassiv-Aussage in natürlicherer Form.
  - severity: low
    issue: Unidiomatische Fußnotenalternative
    rationale: „In sein Recht eingesetzt“ kann im Deutschen eine Einsetzung in ein Amt nahelegen. „In sein Recht gesetzt“ gibt die gemeinte Alternative klarer wieder.
