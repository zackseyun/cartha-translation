source:
  edition: WLC
  text: הָ/אַ֥יִל אֲשֶׁר רָאִ֖יתָ בַּ֣עַל הַ/קְּרָנָ֑יִם מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: de
  text: Der Widder, den du gesehen hast und der die beiden Hörner hat[a] – das sind die Könige von Medien und Persien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Besitzer der beiden Hörner“. Der hebräische Satz enthält kein ausdrückliches Wort für „sind“.'
    reason: Die Anmerkung dokumentiert die wörtliche Bedeutung von בַּעַל und die verblos formulierte Identifikation.
lexical_decisions:
- source_word: הָאַיִל
  choice: der Widder
  rationale: אַיִל bezeichnet einen männlichen Schafbock; „Widder“ ist im Deutschen die natürliche und präzise Bezeichnung im Zusammenhang dieser Vision.
- source_word: אֲשֶׁר רָאִיתָ
  choice: den du gesehen hast
  rationale: Das Relativpronomen gibt אֲשֶׁר wieder; das Perfekt רָאִיתָ (Qal, 2. Person maskulin Singular) wird im Rückblick auf die Vision idiomatisch mit dem deutschen Perfekt ausgedrückt.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: der mit den beiden Hörnern
  rationale: בַּעַל bedeutet wörtlich „Besitzer/Herr von“, bezeichnet in dieser attributiven Verbindung aber idiomatisch ein Wesen, das die Hörner hat. Der Dual קְּרָנַיִם wird mit „beiden Hörnern“ wiedergegeben.
- source_word: מַלְכֵי
  choice: die Könige von
  rationale: מַלְכֵי ist der Konstruktplural von מֶלֶךְ. Die Übersetzung bewahrt den Plural „Könige“ und deutet ihn nicht stillschweigend als „Königreiche“ um.
- source_word: מָדַי וּפָרָס
  choice: Medien und Persien
  rationale: Dies sind die herkömmlichen deutschen Formen der Namen; die Verbindung mit „von“ gibt die hebräische Konstruktverbindung natürlich wieder.
theological_decisions:
- issue: Verbloser Identifikationssatz mit singularischem Symbol und pluralischem Bezugswort
  choice: – das sind die Könige von Medien und Persien
  alternative: steht für die Könige von Medien und Persien
  rationale: Im Hebräischen fehlt eine ausdrückliche Kopula. Die resumptive deutsche Formulierung „das sind“ bewahrt die unmittelbare Identifikation des Symbols mit seiner Deutung und vermeidet zugleich die grammatisch harte Form „der Widder ist die Könige“. „Steht für“ wäre verständlich, würde die Symbolbeziehung jedoch stärker ausdeuten.
- issue: Referenz von מַלְכֵי
  choice: Könige
  alternative: Königreiche
  rationale: Der masoretische Text hat ausdrücklich den Plural „Könige“. Obwohl im visionären Zusammenhang politische Reiche mitgemeint sein können, wird diese mögliche metonymische Spannung nicht durch eine Umdeutung im Haupttext beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert den Übergang vom gesehenen Symbol zu seiner Deutung. Die Formulierung bleibt verständlich, ohne den pluralischen Ausdruck „Könige“ zu „Königreiche“ zu harmonisieren.
