  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des hebräischen Textes zuverlässig wieder: das Sehen, das Stoßen/Vordringen des Widders in drei Richtungen, seine Unwiderstehlichkeit, das Fehlen eines Retters aus seiner Hand, sein Handeln nach eigenem Willen und sein Großwerden. »Vorstieß« ist als natürliche Wiedergabe von מְנַגֵּחַ im Bewegungs- und Machtkontext vertretbar, ohne nicht ausdrücklich genannte Hörner einzutragen. Die Wiedergabe »aus seiner Hand« bewahrt treffend das hebräische Machtbild und lässt, wie die Vorlage, das Objekt des Rettens offen.'
