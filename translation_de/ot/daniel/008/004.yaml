  terminology: »Widder« entspricht אַיִל präzise. »Tier« ist im visionären Zusammenhang eine angemessene Wiedergabe von חַיּוֹת. Die Fußnote zu וְהִגְדִּיל bewahrt sachgerecht die mögliche Nuance zwischen Großwerden und Sich-groß-Machen, ohne eine auslegende Wertung festzulegen.
