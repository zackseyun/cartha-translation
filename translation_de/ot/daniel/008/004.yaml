source:
  edition: WLC
  text: רָאִ֣יתִי אֶת הָ/אַ֡יִל מְנַגֵּחַ֩ יָ֨מָּ/ה וְ/צָפ֜וֹנָ/ה וָ/נֶ֗גְבָּ/ה וְ/כָל חַיּוֹת֙ לֹֽא יַֽעַמְד֣וּ לְ/פָנָ֔י/ו וְ/אֵ֥ין מַצִּ֖יל מִ/יָּד֑/וֹ וְ/עָשָׂ֥ה כִ/רְצֹנ֖/וֹ וְ/הִגְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: de
  text: Ich sah, wie der Widder nach Westen, nach Norden und nach Süden vorstieß. Kein Tier konnte ihm standhalten, und niemand konnte aus seiner Hand retten. Er tat, was ihm gefiel, und wurde groß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »machte sich groß« oder »wurde immer größer«. Das Hebräische kann sowohl ein Großwerden als auch ein Sich-groß-Machen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Qal Perfekt 1. Person Singular von ראה dient hier der fortlaufenden Schilderung der Vision und wird schlicht mit der deutschen Vergangenheitsform wiedergegeben.
- source_word: הָאַיִל
  choice: der Widder
  rationale: אַיִל bezeichnet einen männlichen Schafbock; der bestimmte Artikel kennzeichnet das bereits in der Vision eingeführte Tier.
- source_word: מְנַגֵּחַ
  choice: vorstieß
  rationale: Das Partizip von נגח beschreibt den kraftvollen, mit den Hörnern ausgeführten Angriff eines Tieres. »Vorstieß« klingt im modernen Deutschen natürlich und lässt sowohl die Angriffsbewegung als auch das räumliche Vordringen erkennen, ohne die im Hebräischen nur impliziten Hörner eigens einzufügen.
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: nach Westen, nach Norden und nach Süden
  rationale: Die Richtungsendung ה zeigt eine Bewegung auf die jeweilige Himmelsrichtung zu an; »nach« gibt dies im Deutschen klar wieder.
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  choice: Kein Tier konnte ihm standhalten
  rationale: חַיּוֹת meint im Zusammenhang der Tiergestalten Tiere. Die Verneinung wird im Deutschen idiomatisch mit »kein« ausgedrückt; »ihm standhalten« bewahrt den Sinn des hebräischen Ausdrucks für erfolgreiche Gegenwehr.
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: und niemand konnte aus seiner Hand retten
  rationale: Das Hifil-Partizip von נצל bezeichnet einen Retter beziehungsweise das Retten. »Aus seiner Hand« bewahrt das hebräische Machtbild; der Gegenstand der Rettung bleibt wie im Ausgangstext unausgesprochen.
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: Er tat, was ihm gefiel
  rationale: Die Wendung bezeichnet freies Handeln nach dem eigenen Willen. Diese Formulierung ist gegenwärtig, verständlich und vermeidet unnötig abstrakte Sprache.
- source_word: וְהִגְדִּיל
  choice: und wurde groß
  rationale: Das Hifil von גדל kann hier resultativ das Großwerden oder reflexiv das Sich-groß-Machen ausdrücken. Die Hauptfassung gibt die Zunahme an Größe beziehungsweise Macht wieder, ohne die reflexive und möglicherweise wertende Deutung festzuschreiben.
theological_decisions:
- issue: Ob וְהִגְדִּיל reflexiv als Selbsterhöhung oder allgemein als Zunahme an Größe und Macht zu verstehen ist
  choice: und wurde groß
  alternative: und machte sich groß; und wurde immer größer
  rationale: Ein ausdrückliches Reflexivpronomen fehlt, während der Zusammenhang den Erfolg und die wachsende Macht des Widders schildert. Die Hauptfassung hält die Aussage allgemein; die Fußnote bewahrt die echte lexikalische und theologisch relevante Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze entsprechen der entschiedenen Bewegung des hebräischen Berichts. Das Bild »aus seiner Hand« bleibt bewusst erhalten; die ungewöhnliche, aber verständliche Ellipse vermeidet einen im Ausgangstext nicht genannten Gegenstand der Rettung.
