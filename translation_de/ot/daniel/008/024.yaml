  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: de
  text: Seine Macht wird mächtig werden, aber nicht durch seine eigene Macht. Er wird auf außergewöhnliche Weise Verderben anrichten; er wird Erfolg haben und handeln. Er wird die Mächtigen und das Volk der Heiligen[a] vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das heilige Volk“; auch: „das Volk der heiligen Wesen“.'
    reason: Die Konstruktverbindung עַם קְדֹשִׁים lässt sowohl eine formal plurale als auch eine idiomatische Deutung zu.
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: Seine Macht wird stark werden
  rationale: עָצַם bezeichnet hier das Stark- oder Mächtigwerden. Die verbale Formulierung bewahrt die prädikative Dynamik des Hebräischen.
- source_word: וְלֹא בְכֹחוֹ
  choice: aber nicht durch seine eigene Macht
  rationale: בְּ bezeichnet das Mittel beziehungsweise die wirkende Kraft. „Eigene“ verdeutlicht den Kontrast, ohne die nicht genannte Quelle seiner Macht festzulegen.
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: Er wird auf außergewöhnliche Weise Verderben anrichten
  rationale: נִפְלָאוֹת bezeichnet Außergewöhnliches oder Erstaunliches; zusammen mit שׁחת beschreibt es ein erschreckendes, ungewöhnliches Maß beziehungsweise eine außergewöhnliche Art der Verwüstung. Die adverbiale Wiedergabe ist im Deutschen natürlich und wahrt den negativen Zusammenhang.
- source_word: וְהִצְלִיחַ וְעָשָׂה
  choice: er wird Erfolg haben und handeln
  rationale: Die Hifil-Form von צלח bedeutet „Erfolg haben“ oder „gelingen“ und enthält keine moralische Billigung. עשה bleibt bewusst allgemein als „handeln“, da „nach Belieben handeln“ im Text nicht ausdrücklich steht.
- source_word: וְהִשְׁחִית עֲצוּמִים
  choice: Er wird die Mächtigen … vernichten
  rationale: שׁחת bezeichnet im gewaltsamen Kontext Vernichtung; עֲצוּמִים ist ein substantiviertes Adjektiv und meint mächtige beziehungsweise starke Personen.
- source_word: וְעַם קְדֹשִׁים
  choice: das Volk der Heiligen
  rationale: Die Konstruktverbindung lautet formal „Volk der Heiligen/heiligen Wesen“. Diese Wiedergabe erhält den Plural קְדֹשִׁים und die syntaktische Beziehung, während eine Fußnote die idiomatische Deutung als „das heilige Volk“ nennt.
theological_decisions:
- issue: Referenz und Bedeutung von וְעַם קְדֹשִׁים
  choice: das Volk der Heiligen
  alternative: das heilige Volk; das Volk der heiligen Wesen
  rationale: Der hebräische Plural קְדֹשִׁים kann „Heilige“ beziehungsweise „heilige Wesen“ bezeichnen; die ganze Verbindung kann zugleich idiomatisch auf Gottes heiliges Volk zielen. Der Haupttext bewahrt die formale Mehrdeutigkeit, die Fußnote nennt die möglichen Lesarten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder bleiben eng am hebräischen Ablauf; ein Semikolon und ein neuer Satz machen die Abfolge der Handlungen verständlich, ohne zusätzliche Motive oder Deutungen einzutragen.
