  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: de
  text: Und die Erscheinung von Abend und Morgen, die genannt wurde, ist wahr. Du aber verschließe die Vision, denn sie bezieht sich auf viele Tage in der Zukunft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn für viele Tage«. Die knappe hebräische Wendung kann auf einen weit in der Zukunft liegenden Zeitraum hinweisen.'
    reason: Die Fußnote ist an der Zeitangabe verankert und erläutert deren knappe, nicht näher datierte Formulierung, ohne eine bestimmte Dauer oder Frist festzulegen.
lexical_decisions:
- source_word: מַרְאֵה
  choice: Erscheinung
  rationale: Unterscheidet den mit Abend und Morgen verbundenen Offenbarungsinhalt von חָזוֹן im zweiten Satzteil und gibt den visuellen Charakter des hebräischen Wortes wieder.
- source_word: הָעֶרֶב וְהַבֹּקֶר
  choice: Abend und Morgen
  rationale: Bewahrt die konkrete Formulierung des Hebräischen und ihren Bezug auf die zuvor genannte Zeitangabe, ohne sie hier interpretierend zu paraphrasieren.
- source_word: אֱמֶת הוּא
  choice: ist wahr
  rationale: Gibt die Aussage über Wahrheit beziehungsweise Zuverlässigkeit direkt und natürlich wieder.
- source_word: סְתֹם
  choice: verschließen
  rationale: Das Verb bedeutet hier, die Vision verschlossen beziehungsweise unzugänglich zu halten; die Übersetzung vermeidet die mögliche Überpräzisierung »versiegeln«.
- source_word: הֶחָזוֹן
  choice: die Vision
  rationale: Ein geläufiger deutscher Ausdruck für eine prophetische Schau; zugleich wird der Wechsel von מַרְאֵה zu חָזוֹן sichtbar gehalten.
- source_word: לְיָמִים רַבִּים
  choice: fernen Tagen
  rationale: Die Wendung bezeichnet viele beziehungsweise weit entfernte Tage; im Zusammenhang ist der zeitliche Abstand gemeint, ohne eine genauere Frist festzulegen.
theological_decisions:
- issue: Zeitbezug von לְיָמִים רַבִּים
  choice: denn sie gilt fernen Tagen
  alternative: denn sie betrifft viele Tage von jetzt an
  rationale: Das Hebräische nennt keinen ausdrücklichen Ausgangspunkt wie »von jetzt an«. »Fernen Tagen« bewahrt den Zukunfts- und Distanzbezug, ohne zusätzliche Zeitangaben einzutragen.
- issue: Bedeutung des Verschließens der Vision
  choice: verschließen
  alternative: versiegeln
  rationale: Die Übersetzung lässt offen, ob Schutz, Geheimhaltung oder Bewahrung im Vordergrund steht, statt eine bestimmte theologische Funktion festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am Hebräischen, wird aber für heutige Leser geglättet. Die beiden unterschiedlichen hebräischen Wörter מַרְאֵה und חָזוֹן werden als »Erscheinung« und »Vision« unterschieden.
