source:
  edition: WLC
  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: de
  text: Ich, Daniel, war erschöpft und tagelang krank. Dann stand ich auf und verrichtete die Arbeit des Königs. Ich war über die Vision entsetzt, und niemand verstand sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich verstand sie nicht“. Die hebräische Wendung ist knapp und kann entweder unpersönlich („niemand verstand sie“) oder auf Daniel selbst bezogen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: war erschöpft
  rationale: Das Verb bezeichnet hier im Zusammenhang mit der belastenden Vision einen eingetretenen Zustand. „War erschöpft“ gibt Daniels Zusammenbruch beziehungsweise Entkräftung wieder, ohne eine Ohnmacht ausdrücklich festzulegen.
- source_word: וְנֶחֱלֵיתִי יָמִים
  choice: lag tagelang krank
  rationale: Der Nifal von חלה bezeichnet Krank- oder Schwachwerden; יָמִים nennt eine unbestimmte Dauer. „Tagelang“ bewahrt diese Unbestimmtheit und klingt im modernen Deutsch natürlich.
- source_word: וָאָקוּם
  choice: Dann stand ich auf
  rationale: Die Erzählform führt die Handlung weiter. „Dann“ verdeutlicht die zeitliche Folge, während „stand ich auf“ die konkrete Bewegung und Daniels Wiederaufnahme seiner Tätigkeit offenhält.
- source_word: וָאֶעֱשֶׂה אֶת מְלֶאכֶת הַמֶּלֶךְ
  choice: verrichtete die Arbeit des Königs
  rationale: מְלָאכָה kann Arbeit, Aufgabe oder Dienst bezeichnen. Die Formulierung bleibt nah am Hebräischen und macht deutlich, dass Daniel seine königlichen Aufgaben erfüllte, ohne weitere Einzelheiten einzutragen.
- source_word: וָאֶשְׁתּוֹמֵם
  choice: war ich entsetzt
  rationale: Die Form beschreibt eine starke, verstörende Reaktion und mehr als bloßes Erstaunen. „Entsetzt“ gibt die erschütternde Wirkung der Vision prägnant wieder.
- source_word: הַמַּרְאֶה
  choice: die Vision
  rationale: Im Kontext Daniels bezeichnet das Wort das visionär Geschaute beziehungsweise die Offenbarung, nicht nur ein äußeres Erscheinungsbild.
- source_word: וְאֵין מֵבִין
  choice: und niemand verstand sie
  rationale: Die knappe hebräische Wendung nennt kein ausdrückliches Subjekt. Die existentielle Wiedergabe „niemand verstand sie“ entspricht der Form am unmittelbarsten; die mögliche persönliche Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Subjekt von וְאֵין מֵבִין
  choice: 'Existentielle beziehungsweise unpersönliche Lesart: „niemand verstand sie“'
  alternative: 'Persönliche Lesart: „ich verstand sie nicht“'
  rationale: Im masoretischen Text fehlt ein ausdrückliches Subjekt der ersten Person. Daher bildet die existentielle Lesart die hebräische Form direkter ab. Da der unmittelbare Zusammenhang Daniel als den Betroffenen nennt, bleibt die persönliche Deutung jedoch möglich und wird nicht ausgeschlossen, sondern in einer Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. „Tagelang krank“ ist idiomatisch, ohne die im Hebräischen unbestimmte Dauer zu präzisieren. Die starke emotionale Wirkung der Vision und die Mehrdeutigkeit des Schlusssatzes bleiben erhalten.
