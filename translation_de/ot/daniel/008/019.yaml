source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הִנְ/נִ֣י מוֹדִֽיעֲ/ךָ֔ אֵ֥ת אֲשֶׁר יִהְיֶ֖ה בְּ/אַחֲרִ֣ית הַ/זָּ֑עַם כִּ֖י לְ/מוֹעֵ֥ד קֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: de
  text: 'Dann sagte er: »Sieh, ich lasse dich wissen, was in der letzten Zeit des Zorns geschehen wird; denn für das Ende ist eine Zeit festgesetzt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: Bewahrt das aufmerksamkeitslenkende הִנֵּה in natürlichem, würdigem Deutsch und verbindet es mit der folgenden Ich-Aussage.
- source_word: מוֹדִיעֲךָ
  choice: lasse dich wissen
  rationale: 'Gibt die kausative Bedeutung des Hifil-Partizips von ידע wieder: Der Sprecher teilt Daniel etwas mit.'
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: am Ende des Zorns
  rationale: אַחֲרִית bezeichnet hier den letzten Abschnitt beziehungsweise Ausgang des Zorns; die knappe Wiedergabe wahrt die zeitliche Offenheit.
- source_word: לְמוֹעֵד קֵץ
  choice: das Ende kommt zur festgesetzten Zeit
  rationale: Gibt מוֹעֵד als festgesetzten Zeitpunkt wieder. Das im Deutschen ergänzte »kommt« macht den elliptischen hebräischen Satz verständlich, ohne den Zeitpunkt näher zu bestimmen.
theological_decisions:
- issue: Bezug und Bedeutung von הַזַּעַם
  choice: des Zorns
  alternative: des Strafgerichts / der Empörung
  rationale: »Zorn« bewahrt die theologisch und historisch offene Ausdrucksweise des Hebräischen, ohne den Träger oder konkreten Gegenstand des Zorns festzulegen.
- issue: Elliptische Schlussklausel כִּי לְמוֹעֵד קֵץ
  choice: denn das Ende kommt zur festgesetzten Zeit
  alternative: denn es gilt für die festgesetzte Zeit des Endes
  rationale: Die gewählte Fassung nimmt קֵץ als Subjekt und מוֹעֵד als festgesetzten Zeitpunkt, bewahrt aber die Aussage, dass das Ende zeitlich bestimmt ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Aufforderung »Sieh« entspricht dem hebräischen Diskursmarker, ohne altertümliches »Siehe«.
