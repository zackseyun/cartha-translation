  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
translation:
  language: de
  text: Und aus einem von ihnen[a] kam ein kleines Horn hervor. Es wurde überaus groß nach Süden, nach Osten und zum Land der Zierde hin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „einem“ ist feminin. Es kann sich auf die zuvor genannten vier Winde beziehen; wahrscheinlicher bezieht es sich auf eines der vier Hörner.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Auch: „zum herrlichen Land“ oder „zum schönen Land“. Der hebräische Ausdruck ist ein beschreibender Ehrentitel und meint wahrscheinlich das Land Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: Und aus einem von ihnen
  rationale: Die doppelte מִן-Konstruktion bezeichnet Herkunft bzw. Hervorgehen aus einer Gruppe. Das grammatisch feminine אַחַת bezieht sich wahrscheinlich auf eines der zuvor genannten Hörner; im Deutschen ist wegen des sächlichen Bezugsworts „Horn“ die Form „einem“ erforderlich.
- source_word: יָצָא
  choice: kam … hervor
  rationale: Das Verb bezeichnet ein Heraus- oder Hervorgehen. „Kam … hervor“ ist natürliches Deutsch und bewahrt die Entstehungsbewegung des Bildes.
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  choice: ein kleines Horn
  rationale: קֶרֶן bleibt als apokalyptisches Bild wörtlich „Horn“. מִצְּעִירָה bezeichnet geringe Größe; „klein“ ist im heutigen Deutsch klar und ungekünstelt. Die Zahl „eins“ wird idiomatisch durch den unbestimmten Artikel wiedergegeben.
- source_word: וַתִּגְדַּל יֶתֶר
  choice: Es wurde überaus groß
  rationale: גדל bezeichnet das Großwerden, während יתר den Grad verstärkt. „Wurde überaus groß“ gibt beides wieder, ohne die Art der Machtausbreitung näher auszudeuten.
- source_word: אֶל הַנֶּגֶב
  choice: nach Süden
  rationale: In der Folge geografischer Richtungsangaben bezeichnet נגב am wahrscheinlichsten die Himmelsrichtung Süden und nicht eigens den Negev.
- source_word: וְאֶל הַמִּזְרָח
  choice: nach Osten
  rationale: מזרח bedeutet hier im geografischen Zusammenhang „Osten“; die wörtliche Grundvorstellung des Sonnenaufgangs muss im Deutschen nicht entfaltet werden.
- source_word: וְאֶל הַצְּבִי
  choice: nach dem Land der Zierde hin
  rationale: צְבִי bezeichnet Zierde, Schönheit oder Herrlichkeit. „Land der Zierde“ bewahrt den beschreibenden Ehrentitel und vermeidet, das wahrscheinlich gemeinte Land Israel ausdrücklich in den Haupttext einzusetzen.
theological_decisions:
- issue: Deutung des apokalyptischen Symbols „Horn“
  choice: Das Symbol bleibt im Haupttext als „Horn“ stehen.
  alternative: König, Macht oder Reich
  rationale: Der hebräische Text nennt an dieser Stelle ein Horn. Eine unmittelbare Ersetzung durch den symbolischen Bezug würde eine Auslegung in die Übersetzung eintragen.
- issue: Referenz und Bedeutung von הַצְּבִי
  choice: Der bildhafte Ausdruck wird als „Land der Zierde“ wiedergegeben.
  alternative: 'das herrliche Land; das schöne Land; ausdrücklich: das Land Israel'
  rationale: Der Ausdruck ist ein beschreibender Titel und bezieht sich wahrscheinlich auf das Land Israel. Die Übersetzung bewahrt jedoch die Bildsprache und lässt den konkreten Bezug in einer Fußnote erläutern.
- issue: Bezugswort des femininen Ausdrucks אַחַת
  choice: „einem von ihnen“ wird auf eines der vier Hörner aus dem Kontext bezogen.
  alternative: aus einer von ihnen, bezogen auf die vier Winde
  rationale: Das feminine Hebräisch lässt formal einen Bezug auf die zuvor genannten Winde zu; syntaktisch und bildlich ist jedoch das Hervorgehen eines Horns aus einem der Hörner die naheliegende Lesart. Die grammatische Mehrdeutigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache bleibt erhalten; ungewöhnliche, aber verständliche Formulierungen wie „Land der Zierde“ spiegeln bewusst den bildhaften hebräischen Ausdruck. Die dreifache Richtungsangabe wird knapp und rhythmisch wiedergegeben.
