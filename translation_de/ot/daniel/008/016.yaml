id: DAN.8.16
reference: Daniel 8:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֥ע קוֹל אָדָ֖ם בֵּ֣ין אוּלָ֑י וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר גַּבְרִיאֵ֕ל הָבֵ֥ן לְ/הַלָּ֖ז אֶת הַ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: de
  text: 'Und ich hörte die Stimme eines Mannes zwischen den Ufern des Ulai[a]. Er rief und sagte: »Gabriel, mach diesem da die Vision verständlich.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen Ulai«; gemeint sein kann der Raum zwischen den Seiten beziehungsweise Ufern des Wasserlaufs.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Bring diesen da dazu, die Vision zu verstehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Und ich hörte
  rationale: Das Qal-Wayyiqtol der 1. Person Singular führt die Erzählung weiter; »Und ich hörte« bewahrt diesen Anschluss, ohne die zeitliche Nuance stärker festzulegen.
- source_word: קוֹל אָדָם
  choice: die Stimme eines Mannes
  rationale: קוֹל bezeichnet hier eine Stimme, אָדָם einen Menschen beziehungsweise Mann. Im konkreten szenischen Zusammenhang ist »eines Mannes« natürlich und sachgerecht.
- source_word: בֵּין אוּלָי
  choice: zwischen den Ufern des Ulai
  rationale: בֵּין bedeutet »zwischen«; beim als Wasserlauf verstandenen Eigennamen Ulai sind dessen beide Seiten beziehungsweise Ufer sinngemäß mitzudenken. Die Ergänzung macht die räumliche Angabe im Deutschen verständlich und wird in einer Fußnote offengelegt.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: Er rief und sagte
  rationale: Die Übersetzung gibt beide Verben wieder und bewahrt damit die nachdrückliche Redeeinleitung.
- source_word: גַּבְרִיאֵל
  choice: Gabriel
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הָבֵן לְהַלָּז
  choice: mach diesem da … verständlich
  rationale: Der Hifil-Imperativ von בין hat kausative Bedeutung. »Mach … verständlich« bringt diese im heutigen Deutsch natürlich zum Ausdruck; »diesem da« bewahrt die deiktische, leicht distanzierende Kraft von הַלָּז, ohne ausdrücklich ein weiteres Substantiv einzufügen.
- source_word: אֶת הַמַּרְאֶה
  choice: die Vision
  rationale: מַרְאֶה kann »Erscheinung« oder »Vision« bedeuten; im apokalyptischen Zusammenhang bezeichnet es die Vision, deren Sinn Gabriel vermitteln soll.
theological_decisions:
- issue: Konkrete oder allgemeine Wiedergabe von אָדָם
  choice: »die Stimme eines Mannes«
  alternative: »eine menschliche Stimme« / »die Stimme eines Menschen«
  rationale: Der Kontext beschreibt eine konkrete männlich erscheinende Gestalt. »Mann« wahrt diese Referenz, ohne eine weitergehende Identifizierung vorzunehmen.
- issue: Referenz und kausative Bedeutung von הָבֵן לְהַלָּז
  choice: »mach diesem da die Vision verständlich«
  alternative: »lass diesen da die Vision verstehen« / »erkläre diesem Mann die Vision«
  rationale: Die gewählte Fassung bewahrt den kausativen Sinn und die demonstrative Referenz, ohne das im Ausdruck הַלָּז nicht ausdrücklich stehende Wort »Mann« zu ergänzen. Sie legt auch nicht fest, dass nur eine Erklärung und nicht umfassenderes Verstehen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Formulierung »diesem da« erhält die deiktische Besonderheit des seltenen hebräischen Demonstrativs; die kausative Wendung wird zugleich idiomatisch wiedergegeben.
