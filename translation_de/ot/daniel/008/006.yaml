source:
  edition: WLC
  text: וַ/יָּבֹ֗א עַד הָ/אַ֨יִל֙ בַּ֣עַל הַ/קְּרָנַ֔יִם אֲשֶׁ֣ר רָאִ֔יתִי עֹמֵ֖ד לִ/פְנֵ֣י הָ/אֻבָ֑ל וַ/יָּ֥רָץ אֵלָ֖י/ו בַּ/חֲמַ֥ת כֹּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
translation:
  language: de
  text: Er kam zu dem Widder mit den beiden Hörnern, den ich vor dem Kanal[a] hatte stehen sehen, und rannte in der Wut seiner Kraft[b] auf ihn zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wasserlauf“. Das hebräische Wort אוּבָל bezeichnet einen Wasserlauf; „Kanal“ passt hier wahrscheinlich am besten zum Schauplatz in Daniel 8.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Grimm seiner Stärke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד הָאַיִל
  choice: Er kam zu dem Widder
  rationale: בוא mit עַד bezeichnet die Bewegung bis an den Widder heran. „Kam zu“ gibt dies im Deutschen natürlich wieder, ohne ein zusätzliches Bewegungsdetail einzutragen.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: mit den beiden Hörnern
  rationale: בעל bedeutet wörtlich „Besitzer von“; bei einem Tier ist die attributive Wiedergabe mit „mit“ idiomatisch. Der Dual קְּרָנַיִם wird durch „beide Hörner“ bewahrt.
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: den ich … hatte stehen sehen
  rationale: Die Formulierung bezieht sich auf den zuvor gesehenen Widder. Das deutsche Plusquamperfekt macht diese zeitliche Rückschau klar und bewahrt zugleich das Partizip „stehend“ durch die Konstruktion „stehen sehen“.
- source_word: לִפְנֵי הָאֻבָל
  choice: vor dem Kanal
  rationale: אוּבָל bezeichnet einen Wasserlauf. „Kanal“ passt zum Schauplatz in Daniel 8; die mögliche allgemeinere Wiedergabe wird in einer Fußnote genannt.
- source_word: וַיָּרָץ אֵלָיו
  choice: und rannte … auf ihn zu
  rationale: רוץ bedeutet „rennen/laufen“. Im feindseligen Zusammenhang drückt „auf ihn zu“ die gegen den Widder gerichtete Bewegung natürlich aus.
- source_word: בַּחֲמַת כֹּחוֹ
  choice: in der Wut seiner Kraft
  rationale: 'Die Wiedergabe erhält beide Substantive: חמה als „Wut“ und כח als „Kraft“. Die ungewöhnliche Verbindung des Hebräischen wird nicht zu einer glatten, aber deutenderen Umschreibung aufgelöst.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem erzählenden Ablauf des Hebräischen; die markante Wendung „in der Wut seiner Kraft“ bleibt bewusst erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
