base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: de
  text: Diese großen Tiere, vier an der Zahl, sind vier Könige, die aus der Erde[a] hervorgehen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land“. Das aramäische Wort kann sowohl „Erde“ als auch „Land“ bedeuten. Wegen des weiten apokalyptischen Horizonts des Kapitels steht im Haupttext „Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִלֵּין חֵיוָתָא רַבְרְבָתָא
  choice: Diese großen Tiere
  rationale: Das aramäische Demonstrativum verweist auf die unmittelbar zuvor geschauten Tiere. „Tiere“ gibt חֵיוָתָא natürlich wieder; „groß“ bewahrt sowohl die Vorstellung von Größe als auch von Bedeutung, ohne die Symbolik auszudeuten.
- source_word: דִּי אִנִּין אַרְבַּע
  choice: vier an der Zahl
  rationale: Die idiomatische deutsche Wendung verdeutlicht, dass der Relativsatz die Zahl der Tiere nennt, und vermeidet die schwerfällige Formulierung „die vier sind“.
- source_word: אַרְבְּעָה מַלְכִין
  choice: vier Könige
  rationale: מַלְכִין bezeichnet ausdrücklich Könige, nicht Königreiche. Die Übersetzung erhält diese lexikalische Form und lässt die weitergehende symbolische Zuordnung offen.
- source_word: יְקוּמוּן
  choice: werden sich erheben
  rationale: Das Verb קום bedeutet „aufstehen, sich erheben“. Im Zusammenhang des Auftretens von Herrschern ist „sich erheben“ natürlich und bewahrt zugleich das Bild des aramäischen Ausdrucks.
- source_word: מִן אַרְעָא
  choice: aus der Erde
  rationale: אַרְעָא kann „Erde“ oder „Land“ bedeuten. Im umfassenden apokalyptischen Horizont des Kapitels und gegenüber der himmlischen Szenerie ist „Erde“ im Haupttext vorzuziehen; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
theological_decisions:
- issue: Symbolischer Bezug der vier Könige
  choice: Im Haupttext steht entsprechend dem aramäischen Wortlaut „vier Könige“.
  alternative: „vier Königreiche“ als interpretierende Wiedergabe
  rationale: Der Ausgangstext verwendet מַלְכִין („Könige“). Eine Ersetzung durch „Königreiche“ würde die Symbolik harmonisierend auslegen und die Spannung zu anderen Aussagen des Kapitels vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vier an der Zahl“ bildet die erklärende Konstruktion idiomatisch ab; „sich erheben“ wahrt den prophetisch-apokalyptischen Ton, ohne unnötig altertümlich zu wirken.
