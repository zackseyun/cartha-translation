  terminology: „Hörner“, „emporstieg“, „große Dinge“ und „Gefährten“ wahren den symbolischen und würdigen Registerton. Die Fußnote sollte die naheliegende Nuance ausdrücklich als „prahlerisch“ bezeichnen, ohne sie im Haupttext festzulegen.
