source:
  edition: WLC
  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: de
  text: und über die zehn Hörner auf seinem Kopf und über das andere Horn, das emporstieg und vor dem drei fielen – jenes Horn, das Augen und einen Mund hatte, der große Dinge redete,[a] und dessen Aussehen größer war als das seiner Gefährten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „prahlerische Dinge“; auch: „große Prahlereien“.'
    reason: 'Lexikalische Alternative: Der Kontext erlaubt eine ausdrücklich auf Prahlerei oder Anmaßung zugespitzte Wiedergabe von רַבְרְבָן, während der Haupttext die wörtlichere Formulierung „große Dinge“ beibehält.'
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: die zehn Hörner
  rationale: Die aramäische Bildsprache wird unverändert bewahrt; die Hörner werden nicht auf ihre mögliche symbolische Bedeutung hin ausgedeutet.
- source_word: בְרֵאשַׁהּ
  choice: auf seinem Kopf
  rationale: Das Suffix bezieht sich auf das zuvor genannte Tier. „Auf seinem Kopf“ ist im Deutschen räumlich klar und natürlich.
- source_word: אָחֳרִי דִּי סִלְקַת
  choice: das andere Horn, das emporstieg
  rationale: „Das andere Horn“ hebt es von den zehn bereits genannten Hörnern ab, ohne אָחֳרִי einseitig zeitlich zu deuten. „Emporsteigen“ erhält die anschauliche Bewegung des aramäischen Verbs.
- source_word: וּנְפַלוּ מִן קֳדָמַהּ תְּלָת
  choice: vor dem drei ausfielen
  rationale: Die Formulierung wahrt sowohl den Bezug auf das Horn als auch das Bild, dass drei in seiner Gegenwart beziehungsweise vor ihm fallen. Aus dem Zusammenhang sind drei Hörner gemeint, doch das im Satz elliptische Substantiv wird nicht unnötig ergänzt.
- source_word: וְקַרְנָא דִכֵּן
  choice: jenes Horn
  rationale: Die resumptive aramäische Wendung greift das betreffende Horn nach dem Einschub erneut auf. „Jenes Horn“ bildet diese Hervorhebung idiomatisch nach.
- source_word: וְעַיְנִין לַהּ
  choice: das Augen ... hatte
  rationale: Die konkrete, auffällige Eigenschaft des Horns wird ohne symbolische Erklärung wiedergegeben.
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: einen Mund ..., der große Dinge redete
  rationale: „Große Dinge“ entspricht der unmittelbaren lexikalischen Gestalt und lässt offen, ob Größe, Anmaßung oder Prahlerei im Vordergrund steht. Die stärker deutende Wiedergabe steht in der Fußnote.
- source_word: וְחֶזְוַהּ רַב מִן חַבְרָתַהּ
  choice: dessen Aussehen größer war als das seiner Gefährten
  rationale: „Aussehen“ bezeichnet die sichtbare Erscheinung. „Größer“ bewahrt die mögliche Spannung zwischen körperlicher Größe und hervortretender Bedeutung; „Gefährten“ erhält den relationalen Ausdruck für die übrigen Hörner.
theological_decisions:
- issue: Ob רַבְרְבָן ausdrücklich als prahlerische oder überhebliche Rede wiederzugeben ist
  choice: große Dinge
  alternative: überhebliche Dinge; große Prahlereien
  rationale: Der Kontext legt anmaßende Rede nahe, doch der aramäische Wortlaut bezeichnet zunächst „große Dinge“. Der Haupttext erhält diese Offenheit; die interpretative Nuance wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt wie im Zusammenhang syntaktisch an die Bitte um Auskunft in Vers 19 angeschlossen. Die dichte Wiederaufnahme mit „jenes Horn“ bewahrt die aramäische Schwerpunktsetzung, während die Zeichensetzung den langen Satz für heutige Leser gliedert.
