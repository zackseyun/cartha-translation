source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: de
  text: Ich betrachtete aufmerksam die Hörner, und siehe, ein anderes, kleines Horn stieg unter ihnen empor. Drei der früheren Hörner wurden vor ihm entwurzelt. Und siehe, dieses Horn hatte Augen wie die Augen eines Menschen[a] und einen Mund, der große Dinge redete[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Augen wie Menschenaugen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Mund, der prahlerische Worte redete“ beziehungsweise „einen Mund, der große Prahlereien äußerte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: Ich betrachtete aufmerksam
  rationale: Partizip mit Hilfsverb bezeichnet eine andauernde Handlung in der Vergangenheit; „betrachtete aufmerksam“ gibt sowohl das fortgesetzte Schauen als auch Daniels prüfende Aufmerksamkeit natürlich wieder.
- source_word: בְּקַרְנַיָּא
  choice: die Hörner
  rationale: Der bestimmte Plural entspricht der determinierten aramäischen Form und dem unmittelbaren Zusammenhang.
- source_word: וַאֲלוּ
  choice: und siehe
  rationale: Die Wendung markiert einen lebhaften Übergang innerhalb der Vision und bewahrt den würdevollen apokalyptischen Ton.
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: ein anderes, kleines Horn
  rationale: Die Formulierung bildet sowohl „ein anderes“ als auch „klein“ ab, ohne aus dem Ausdruck vorschnell einen theologischen Fachbegriff zu machen.
- source_word: סִלְקָת בֵּינֵיהוֹן
  choice: stieg zwischen ihnen empor
  rationale: „Emporsteigen“ veranschaulicht das Hervorkommen des Horns; „zwischen ihnen“ gibt die räumliche Beziehung präzise wieder.
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: Drei von den früheren Hörnern
  rationale: קַדְמָיָתָא bezeichnet die zuvor vorhandenen beziehungsweise früheren Hörner; „früheren“ ist im Deutschen natürlicher und vermeidet die mögliche Rangbedeutung von „ersten“.
- source_word: אֶתְעֲקַרוּ
  choice: wurden ... ausgerissen
  rationale: Das Passiv des Verbs für das Ausreißen beziehungsweise Entwurzeln wird mit „wurden ausgerissen“ bildhaft und idiomatisch wiedergegeben.
- source_word: מִן קֳדָמֵיהּ
  choice: vor ihm
  rationale: Die Wendung kann räumlich „vor ihm“ beziehungsweise „aus seiner Gegenwart weg“ bedeuten; die knappe Übersetzung erhält diese Offenheit.
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: Augen wie die Augen eines Menschen
  rationale: Die ausdrückliche Vergleichsform und der Singular אֲנָשָׁא bleiben erhalten; die idiomatischere Alternative „wie Menschenaugen“ steht in der Fußnote.
- source_word: בְּקַרְנָא דָא
  choice: dieses Horn hatte
  rationale: Die wörtliche Ortsangabe „in diesem Horn“ wird im Deutschen als Besitzkonstruktion natürlich wiedergegeben, ohne das visionäre Bild zu verändern.
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: und einen Mund, der große Dinge redete
  rationale: „Große Dinge“ entspricht der formalen Bedeutung und bewahrt die Mehrdeutigkeit zwischen eindrucksvoller und anmaßender Rede; die kontextuelle Deutung als Prahlen wird in der Fußnote genannt.
theological_decisions:
- issue: Ob רַבְרְבָן ausdrücklich als anmaßende oder prahlerische Rede übersetzt werden soll
  choice: große Dinge
  alternative: prahlerische Worte; große Prahlereien
  rationale: Die aramäische Formulierung bedeutet zunächst „große Dinge“; ihr hochmütiger Charakter ergibt sich aus dem Kontext. Der Haupttext bewahrt diese Spannung, während die Fußnote die naheliegende kontextuelle Deutung nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. „Und siehe“ erhält bewusst die markierende Funktion des aramäischen Diskurspartikels. Die Satzstruktur wurde für natürliche deutsche Lesbarkeit leicht gegliedert, ohne Bildfolge oder Mehrdeutigkeit aufzulösen.
