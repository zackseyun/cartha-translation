id: DAN.7.12
reference: Daniel 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: de
  text: 'Was aber die übrigen Tiere betrifft: Ihnen wurde die Herrschaft genommen; doch ihr Leben wurde für eine Zeit und eine Frist[a] verlängert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu einer Zeit und einer Frist“. Der aramäische Ausdruck kann die Grenze der ihnen gewährten Lebensverlängerung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: Was aber die übrigen Tiere betrifft
  rationale: Die Wendung markiert den kontrastierenden Übergang vom zuvor genannten Tier zu den übrigen Tieren. „Tiere“ ist im Deutschen die natürliche Bezeichnung für die symbolischen Tiere der Vision.
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: Ihnen wurde die Herrschaft genommen
  rationale: Die unbestimmte aktive Verbform wird idiomatisch als Passiv wiedergegeben, ohne den Handelnden ausdrücklich zu bestimmen. „Herrschaft“ bezeichnet ihre politische beziehungsweise königliche Macht.
- source_word: וְאַרְכָה בְחַיִּין יְהִיבַת לְהוֹן
  choice: doch ihr Leben wurde … verlängert
  rationale: 'Die adversative Wiedergabe von וְ hebt den Gegensatz hervor: Die Herrschaft endet, das Leben bleibt jedoch noch eine begrenzte Zeit bestehen. Die verbale deutsche Form gibt die aramäische Nominalkonstruktion natürlich wieder.'
- source_word: עַד זְמַן וְעִדָּן
  choice: für eine Zeit und eine Frist
  rationale: Die beiden Zeitbegriffe bleiben unterschieden und bezeichnen eine begrenzte Dauer, ohne eine bestimmte endzeitliche Berechnung in den Wortlaut einzutragen.
theological_decisions:
- issue: Zeitangabe für das Fortbestehen der Tiere nach dem Verlust ihrer Herrschaft
  choice: für eine Zeit und eine Frist
  alternative: bis zu einer Zeit und einer Frist
  rationale: עַד kann hier die Dauer beziehungsweise deren Grenze ausdrücken. Der Haupttext betont die begrenzte Lebensverlängerung; die Fußnote bewahrt die stärker auf den Endpunkt bezogene Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Konstruktion macht den Themenwechsel deutlich; der zweite Satzteil bleibt verständlich und wahrt zugleich die zeitliche Mehrdeutigkeit des Aramäischen.
