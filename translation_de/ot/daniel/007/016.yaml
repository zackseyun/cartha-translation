  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: de
  text: Ich trat an einen von denen heran, die dastanden, und bat ihn um zuverlässige Auskunft über all das.[a] Da antwortete er mir und machte mir die Deutung der Worte bekannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um die Wahrheit über all das“. Das aramäische Wort kann bezeichnen, was fest, gewiss oder wahr ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Deutung der Worte“. „Worte“ kann hier den Inhalt oder die Sache meinen, um die es in der Vision geht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: Ich trat … heran
  rationale: Die erste Person Singular des aramäischen Verbs קרב bezeichnet die Annäherung. „An jemanden herantreten“ ist im modernen Deutschen natürlich und bewahrt die räumliche Bewegung.
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: an einen von denen …, die dastanden
  rationale: Die Wendung bezeichnet einen aus der Gruppe der dort Stehenden, ohne seine Identität näher festzulegen.
- source_word: וְיַצִּיבָא אֶבְעֵא מִנֵּהּ עַל כָּל דְּנָה
  choice: und fragte ihn nach der Gewissheit über all das
  rationale: יַצִּיבָא bezeichnet hier das Feste, Gewisse oder Wahre. Die Formulierung gibt Daniels Bitte um verlässliche Auskunft wieder und erhält die lexikalische Spannung durch eine Fußnote.
- source_word: וַאֲמַר לִי
  choice: Da antwortete er mir
  rationale: Wörtlich steht „da sagte er zu mir“. Im Zusammenhang folgt eine Antwort auf Daniels Frage; „antwortete“ ist im Deutschen vollständig und natürlich, ohne zusätzlichen Inhalt einzuführen.
- source_word: וּפְשַׁר מִלַּיָּא
  choice: die Deutung der Worte
  rationale: פשר bedeutet „Deutung“ oder „Auslegung“, מִלַּיָּא wörtlich „die Worte“. Die formal nähere Wiedergabe bleibt im Haupttext stehen; der mögliche Bezug auf die Sache beziehungsweise den Inhalt der Vision wird in der Fußnote erläutert.
- source_word: יְהוֹדְעִנַּנִי
  choice: ließ mich … erkennen
  rationale: Die Kausativform von ידע bedeutet „wissen lassen, bekannt machen“. „Ließ mich … erkennen“ bewahrt diese kausative Bedeutung in würdigem, verständlichem Deutsch.
theological_decisions: []
