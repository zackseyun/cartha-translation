base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/006.yaml
  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
translation:
  language: de
  text: 'Danach sah ich weiter, und siehe: ein anderes Tier, wie ein Leopard. Es hatte vier Vogelflügel auf seinem Rücken[a]. Das Tier hatte vier Köpfe, und ihm wurde Herrschaft gegeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf seinen Seiten“; der aramäische Ausdruck kann den Rücken oder allgemeiner den oberen Körperbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Danach
  rationale: Die aramäische Zeitangabe führt das nächste Bild der Vision ein; „Danach“ gibt die zeitliche Abfolge knapp und idiomatisch wieder.
- source_word: חָזֵה הֲוֵית
  choice: sah ich weiter
  rationale: Partizip und Hilfsverb bezeichnen einen andauernden Vorgang in der Vergangenheit. „Sah ich weiter“ bewahrt diesen durativen Sinn und passt zum Fortgang der Vision.
- source_word: וַאֲרוּ
  choice: und siehe
  rationale: Die deiktische Interjektion vergegenwärtigt das neu auftretende Visionsbild; „und siehe“ erhält ihren lebhaften und zugleich würdevollen Erzählton.
- source_word: אָחֳרִי
  choice: ein anderes Tier
  rationale: Das Adjektiv verweist im Zusammenhang auf ein weiteres Tier. Die Ergänzung „Tier“ macht den Bezug im Deutschen eindeutig, ohne zusätzliche Deutung einzutragen.
- source_word: כִּנְמַר
  choice: wie ein Leopard
  rationale: Das Präfix kennzeichnet einen Vergleich. „Leopard“ ist die präzise moderne Bezeichnung für נְמַר.
- source_word: גַּפִּין אַרְבַּע דִּי עוֹף
  choice: vier Vogelflügel
  rationale: Das deutsche Kompositum gibt die Genitivverbindung natürlich und knapp wieder und unterscheidet diese Flügel ausdrücklich als die eines Vogels.
- source_word: עַל גבי/ה
  choice: auf seinem Rücken
  rationale: גַּב kann den Rücken beziehungsweise die obere Körperfläche bezeichnen. „Auf seinem Rücken“ ist im Bildzusammenhang die naheliegendste Wiedergabe; die räumliche Unschärfe wird in einer Fußnote bewahrt.
- source_word: וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא
  choice: Das Tier hatte vier Köpfe
  rationale: Die deutsche Besitzkonstruktion gibt den aramäischen Nominalsatz klar und natürlich wieder.
- source_word: שָׁלְטָן
  choice: Herrschaft
  rationale: Der Ausdruck bezeichnet Herrschafts- oder Regierungsgewalt. „Herrschaft“ wahrt den politischen und apokalyptischen Klang des Zusammenhangs.
- source_word: יְהִיב לַהּ
  choice: ihm wurde … gegeben
  rationale: Die Passivform bleibt erhalten und nennt den Geber nicht ausdrücklich, wie auch der aramäische Text an dieser Stelle.
theological_decisions:
- issue: Nicht genannter Geber der Herrschaft
  choice: ihm wurde Herrschaft gegeben
  alternative: Gott gab ihm Herrschaft
  rationale: Der Vers sagt, dass dem Tier Herrschaft gegeben wurde, nennt den Handelnden aber nicht. Die passive Form bewahrt diese theologische Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. „Und siehe“ bewahrt bewusst die eindringliche Erzählweise des aramäischen Textes; Satzteilung und deutsche Besitzkonstruktionen sorgen für natürliche Lesbarkeit.
