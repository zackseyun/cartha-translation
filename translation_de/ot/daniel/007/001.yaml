source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: de
  text: Im ersten Jahr Belsazars, des Königs von Babel, sah Daniel einen Traum und Visionen in seinem Inneren, während er auf seinem Bett lag. Dann schrieb er den Traum auf und gab den wesentlichen Inhalt wieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er schrieb den Traum auf; das Haupt der Worte sagte er.“ Die aramäische Wendung bezeichnet wahrscheinlich die Hauptpunkte oder den wesentlichen Inhalt des Berichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה
  choice: Im ersten Jahr
  rationale: Die aramäische Datierungsformel verwendet die Kardinalzahl idiomatisch als Ordinalzahl; „im ersten Jahr“ ist im Deutschen natürlich und präzise.
- source_word: לְבֵלְאשַׁצַּר מֶלֶךְ בָּבֶל
  choice: Belsazars, des Königs von Babel
  rationale: Die Präposition bezeichnet den Herrscher, nach dessen Regierungszeit das Jahr gerechnet wird. Die Apposition gibt sein Amt wieder; „Babel“ entspricht der traditionellen und weiterhin verständlichen deutschen Ortsbezeichnung.
- source_word: חֵלֶם חֲזָה
  choice: sah Daniel einen Traum
  rationale: Die wörtliche Wendung „einen Traum sehen“ bewahrt den visionären Akzent des aramäischen Verbs, auch wenn im Deutschen „einen Traum haben“ geläufiger wäre.
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: und Visionen in seinem Inneren
  rationale: Wörtlich steht „Visionen seines Kopfes“. Gemeint sind innere, geistig wahrgenommene Bilder; „in seinem Inneren“ ist natürliches Deutsch, ohne sie bloß auf Gedanken zu reduzieren.
- source_word: עַל מִשְׁכְּבֵהּ
  choice: während er auf seinem Bett lag
  rationale: Die Ortsangabe bezeichnet die Situation des Träumenden. Die verbale deutsche Fassung macht den Zusammenhang flüssig, ohne den Sinn zu erweitern.
- source_word: בֵּאדַיִן
  choice: Dann
  rationale: Das häufige aramäische Erzähladverb leitet den nächsten Handlungsschritt ein.
- source_word: חֶלְמָא כְתַב
  choice: schrieb er den Traum auf
  rationale: „Aufschreiben“ gibt die konkrete schriftliche Aufzeichnung im Deutschen idiomatisch wieder.
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: und gab den wesentlichen Inhalt wieder
  rationale: Die schwerfällige wörtliche Form „das Haupt der Worte sagte er“ bezeichnet wahrscheinlich die Hauptpunkte beziehungsweise die Zusammenfassung des Traumberichts. Die Fußnote bewahrt die formale und semantische Offenheit.
