base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: de
  text: 'Was die zehn Hörner betrifft: Aus diesem Königreich werden zehn Könige hervorgehen. Nach ihnen wird noch ein anderer auftreten. Er wird anders sein als die früheren, und drei Könige wird er erniedrigen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: demütigen; niederwerfen.'
    reason: Lexikalische Alternativen für das aramäische Verb, das ein Niedrigmachen oder Herabsetzen bezeichnet.
lexical_decisions:
- source_word: וְקַרְנַיָּא עֲשַׂר
  choice: Was die zehn Hörner betrifft
  rationale: Die apokalyptische Bildsprache der »Hörner« bleibt erhalten, da der Vers selbst sie als Könige deutet. Die Formulierung gibt die einleitende Themenangabe natürlich wieder, ohne ein im Aramäischen nicht ausdrücklich vorhandenes »bedeuten« einzufügen.
- source_word: מִנַּהּ מַלְכוּתָה
  choice: Aus diesem Königreich
  rationale: Das feminine Suffix bezieht sich im Zusammenhang auf das durch das Tier dargestellte Königreich. »Aus diesem Königreich« ist im Deutschen idiomatisch und bewahrt die Herkunftsangabe.
- source_word: עַשְׂרָה מַלְכִין יְקֻמוּן
  choice: werden zehn Könige hervorgehen
  rationale: קום bezeichnet hier das Aufkommen von Herrschern. »Hervorgehen« verbindet die Vorstellung ihres Auftretens passend mit der Herkunft aus dem Königreich.
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: Nach ihnen wird noch ein anderer auftreten
  rationale: »Ein anderer« nimmt den königlichen Bezug aus dem Kontext auf; »auftreten« gibt das Aufkommen eines weiteren Herrschers in natürlichem Deutsch wieder.
- source_word: וְהוּא יִשְׁנֵא מִן קַדְמָיֵא
  choice: Er wird anders sein als die früheren
  rationale: Das Verb bezeichnet im Kontext Verschiedenheit oder Andersartigkeit. Die Wiedergabe beschreibt den Unterschied, ohne dessen Art oder theologische Bedeutung näher festzulegen.
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: und drei Könige wird er erniedrigen
  rationale: Der Haphel von שׁפל bedeutet wörtlich, niedrig zu machen beziehungsweise zu erniedrigen. Die Formulierung bewahrt das Bild des Herabsetzens und legt die konkrete politische Maßnahme nicht fest.
theological_decisions:
- issue: Art der Andersartigkeit des späteren Herrschers
  choice: Er wird anders sein als die früheren
  alternative: Er wird sich von den früheren unterscheiden
  rationale: Der Text stellt eine Andersartigkeit fest, erklärt aber weder deren genaue Form noch die Identität des Herrschers. Die Übersetzung vermeidet es daher, ein bestimmtes endzeitliches Deutungssystem einzutragen.
- issue: Vorgehen gegen die drei Könige
  choice: drei Könige wird er erniedrigen
  alternative: drei Könige wird er niederwerfen
  rationale: Das aramäische Verb lässt offen, wie das Herabsetzen geschieht. Die Übersetzung bewahrt diese Offenheit und präzisiert nicht unnötig, ob Entmachtung, Unterwerfung oder Vernichtung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Themenwechsel wird ausdrücklich, aber ohne interpretierenden Zusatz wiedergegeben. Die Satzstellung im letzten Teilsatz hebt entsprechend dem Aramäischen die drei Könige hervor.
