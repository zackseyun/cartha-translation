source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: de
  text: Da schaute ich weiter wegen des Klangs der großen Worte[a], die das Horn sprach. Ich schaute weiter, bis das Tier getötet wurde, sein Leib vernichtet und dem brennenden Feuer übergeben wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »prahlerische«, »anmaßende« oder »überhebliche Worte«; wörtlich: »große Worte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Ich sah weiter hin
  rationale: Das Partizip mit Hilfsverb bezeichnet ein andauerndes Sehen in der Vergangenheit; die Formulierung gibt den durativen Charakter in natürlichem Deutsch wieder.
- source_word: בֵּאדַיִן מִן קָל
  choice: wegen des Klangs
  rationale: מִן bezeichnet hier den Anlass oder Grund des weiteren Hinschauens; קָל wird als wahrnehmbarer Klang der Rede wiedergegeben.
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: die großen Worte
  rationale: Die lexikalisch nahe Wiedergabe bewahrt die im Aramäischen angelegte Offenheit; der Kontext legt prahlerische oder anmaßende Rede nahe, ohne dass dies ausdrücklich im Haupttext festgelegt werden muss.
- source_word: קַרְנָא מְמַלֱּלָה
  choice: die das Horn redete
  rationale: Das visionäre Symbol des Horns bleibt erhalten; das Partizip drückt fortdauerndes Reden aus.
- source_word: קְטִילַת חֵיוְתָא
  choice: das Tier getötet
  rationale: Die passive Verbform wird direkt und in modernem Deutsch wiedergegeben.
- source_word: וְהוּבַד גִּשְׁמַהּ
  choice: sein Leib vernichtet
  rationale: גִּשְׁמַהּ bezeichnet den Leib des Tieres; וְהוּבַד drückt dessen Vernichtung aus. „Leib“ passt zum würdevollen visionären Register.
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: dem brennenden Feuer übergeben wurde
  rationale: Die passive Übergabe in das Feuergericht wird bewahrt; „brennendes Feuer“ gibt die aramäische Konstruktion verständlich und bildhaft wieder.
theological_decisions:
- issue: Bedeutung der „großen Worte“
  choice: Die wörtlichere Formulierung „große Worte“ steht im Haupttext.
  alternative: prahlerische, anmaßende oder überhebliche Worte
  rationale: Der Kontext deutet Hochmut an, doch die aramäische Wendung bezeichnet zunächst „große Worte“. Die Fußnote macht die kontextuelle Bedeutung sichtbar, ohne sie als einzig mögliche Übersetzung festzuschreiben.
- issue: Deutung der visionären Symbole
  choice: „Horn“, „Tier“ und „Leib“ werden als Bildsprache beibehalten.
  alternative: Eine unmittelbare Deutung als Herrscher, Reich oder abstraktes Gericht
  rationale: Der Vers schildert die Vision selbst. Eine Auflösung ihrer Symbole würde eine bestimmte Auslegung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die Wiederholung von „Ich sah weiter hin“ bildet die fortdauernde Schau und die Wiederaufnahme im aramäischen Text ab.
