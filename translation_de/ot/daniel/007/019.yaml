  text: אֱדַ֗יִן צְבִית֙ לְ/יַצָּבָ֔א עַל חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א דִּֽי הֲוָ֥ת שָֽׁנְיָ֖ה מִן כל/הון דְּחִילָ֣ה יַתִּ֗ירָה שני/ה דִּֽי פַרְזֶל֙ וְ/טִפְרַ֣י/הּ דִּֽי נְחָ֔שׁ אָֽכְלָ֣ה מַדֲּקָ֔ה וּ/שְׁאָרָ֖/א בְּ/רַגְלַ֥י/הּ רָֽפְסָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: de
  text: Dann wollte ich Gewissheit über das vierte Tier[a] erlangen, das sich von allen anderen unterschied und überaus furchterregend war. Es hatte eiserne Zähne und bronzene Klauen[b]; es fraß und zermalmte und zertrat das Übriggebliebene mit seinen Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wollte ich über das vierte Tier sichere Auskunft erhalten.“ Der aramäische Ausdruck bezeichnet das Verlangen, etwas mit Gewissheit zu erfahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bronzene Nägel“. Das aramäische Wort kann Klauen oder Nägel bezeichnen; „Klauen“ passt hier zur Darstellung eines Tieres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Dann
  rationale: Zeitliches Gliederungssignal, das den nächsten Schritt in Daniels Nachfrage einleitet.
- source_word: צְבִית לְיַצָּבָא עַל
  choice: wollte ich Gewissheit über
  rationale: Gibt sowohl Daniels Verlangen als auch den auf Gewissheit zielenden aramäischen Ausdruck knapp und idiomatisch wieder.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: das vierte Tier
  rationale: Direkte und im Deutschen für Daniels Vision geläufige Wiedergabe der Nominalgruppe.
- source_word: דִּי הֲוָת שָׁנְיָה מִן כלהון
  choice: das sich von allen anderen unterschied
  rationale: Bewahrt den Vergleich und macht den Bezug auf die übrigen Tiere im Deutschen ausdrücklich.
- source_word: דְּחִילָה יַתִּירָה
  choice: überaus furchterregend
  rationale: Erhält die starke Intensivierung und klingt zugleich gegenwärtig und würdevoll.
- source_word: שני/ה דִּי פַרְזֶל
  choice: eiserne Zähne
  rationale: Natürliche deutsche Entsprechung der Stoffangabe ‚Zähne aus Eisen‘.
- source_word: וְטִפְרַי/הּ דִּי נְחָשׁ
  choice: bronzene Klauen
  rationale: ‚Klauen‘ passt zur Tiermetaphorik; נְחָשׁ bezeichnet hier Bronze beziehungsweise Kupfer.
- source_word: אָכְלָה מַדֲּקָה
  choice: fraß und zermalmte
  rationale: Bewahrt die Folge zweier gewaltsamer Handlungen; ‚zermalmte‘ gibt das Zerbrechen oder Zerkleinern kräftig wieder.
- source_word: וּשְׁאָרָא
  choice: das Übriggebliebene
  rationale: Bezeichnet konkret den Rest nach dem Fressen und Zermalmen und erhält die bildhafte Wirkung.
- source_word: בְּרַגְלַי/הּ רָפְסָה
  choice: zertrat ... mit seinen Füßen
  rationale: Direkte Wiedergabe der abschließenden Gewalthandlung samt Instrumentalangabe.
