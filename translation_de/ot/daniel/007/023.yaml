base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: de
  text: 'So sagte er: „Das vierte Tier wird ein viertes Königreich auf der Erde sein, das anders sein wird als alle Königreiche[a]; und es wird die ganze Erde verschlingen, sie zertreten und zermalmen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das sich von allen Königreichen unterscheiden wird“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie in Stücke brechen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: So sagte er
  rationale: Gibt die einleitende aramäische Wendung knapp und in modernem, würdigem Deutsch als Fortsetzung der Erklärung wieder.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: das vierte Tier
  rationale: „Tier“ ist im Deutschen die natürliche Bezeichnung für die bedrohliche visionäre Gestalt und bewahrt den apokalyptischen Bildcharakter.
- source_word: מַלְכוּ רביעיא
  choice: ein viertes Königreich
  rationale: מַלְכוּ bezeichnet hier aufgrund der ausdrücklichen Deutung des Tieres ein politisches Königreich; die prädikative Form wird idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: בְאַרְעָא
  choice: auf der Erde
  rationale: Der weltweite imperial-apokalyptische Zusammenhang spricht für „Erde“ statt für das örtlich begrenztere „Land“.
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: das anders sein wird als alle Königreiche
  rationale: Bewahrt den vergleichenden Sinn des Verbs und die ausdrückliche Mehrzahl „alle Königreiche“ in natürlichem Deutsch.
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: Es wird die ganze Erde verschlingen
  rationale: „Verschlingen“ erhält die gewaltsame Tiermetaphorik; „die ganze Erde“ gibt den umfassenden Geltungsbereich wieder.
- source_word: וּתְדוּשִׁנַּהּ
  choice: sie zertreten
  rationale: Das Verb bezeichnet das Treten beziehungsweise Niedertrampeln und wird prägnant wiedergegeben.
- source_word: וְתַדְּקִנַּהּ
  choice: und zermalmen
  rationale: „Zermalmen“ bringt die gegenüber dem Zertreten gesteigerte, vollständige Zerstörung kräftig und verständlich zum Ausdruck.
theological_decisions:
- issue: Deutung des vierten Tieres
  choice: Das vierte Tier wird ausdrücklich als ein viertes Königreich bezeichnet.
  alternative: Das Tier könnte in der Übersetzung politisch weniger eindeutig bleiben.
  rationale: Der aramäische Text selbst setzt das Tier in der Deutung mit einem Königreich gleich; diese innertextliche Identifizierung darf nicht abgeschwächt werden.
- issue: Reichweite von אַרְעָא
  choice: Erde
  alternative: Land
  rationale: Die Aussage über das Verschlingen der ganzen אַרְעָא und der universale Horizont der Vision legen die umfassende Bedeutung „Erde“ nahe, ohne eine konkrete historische Identifizierung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Erzählton. Die gewaltsame Bildsprache des aramäischen Textes bleibt durch „verschlingen“, „zertreten“ und „zermalmen“ erhalten; eine konkrete historische oder konfessionelle Identifizierung des Reiches wird nicht ergänzt.
