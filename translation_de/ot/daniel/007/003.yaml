  text: וְ/אַרְבַּ֤ע חֵיוָן֙ רַבְרְבָ֔ן סָלְקָ֖ן מִן יַמָּ֑/א שָׁנְיָ֖ן דָּ֥א מִן דָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/003.yaml
  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: de
  text: Und vier gewaltige Tiere stiegen aus dem Meer[a] empor, eines anders als das andere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Meer her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבַּע
  choice: Und vier
  rationale: Die einfache Verbindung führt das nächste Element der Vision ein, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: חֵיוָן
  choice: Tiere
  rationale: Das aramäische Wort bezeichnet tierartige Lebewesen. „Tiere“ ist im Deutschen natürlich und lässt den folgenden Kontext ihre unheimliche und symbolische Gestalt entfalten, ohne sie vorwegnehmend zu deuten.
- source_word: רַבְרְבָן
  choice: gewaltige
  rationale: Das Adjektiv bezeichnet Größe oder Mächtigkeit. „Gewaltige“ bewahrt in diesem visionären Zusammenhang sowohl die körperliche Größe als auch die eindrucksvolle, bedrohliche Wirkung.
- source_word: סָלְקָן
  choice: stiegen … empor
  rationale: Die Form schildert die aufwärtsgerichtete Bewegung der Tiere. Das deutsche Präteritum gibt die fortlaufend erzählte Vision natürlich wieder; „empor“ hält die Bewegungsrichtung ausdrücklich fest.
- source_word: מִן יַמָּא
  choice: aus dem Meer
  rationale: Die Präposition bezeichnet den Ausgangspunkt. „Aus dem Meer“ ist idiomatisches Deutsch und macht deutlich, dass die Tiere aus dem Meer hervorkommen; „vom Meer her“ bleibt als mögliche Wiedergabe vermerkt.
- source_word: שָׁנְיָן
  choice: anders
  rationale: Hier bezeichnet das Wort die Verschiedenheit der Tiere untereinander. „Anders“ ist in der gewählten Vergleichsformel klar und natürlich.
- source_word: דָּא מִן דָּא
  choice: eines anders als das andere
  rationale: Die aramäische Wendung drückt die wechselseitige Verschiedenheit der vier Tiere aus. Die deutsche Formulierung bewahrt diesen Vergleich idiomatisch.
theological_decisions:
- issue: Symbolische Aussagekraft von חֵיוָן im apokalyptischen Zusammenhang
  choice: Als „Tiere“ wiedergegeben
  alternative: „Bestien“ oder „Lebewesen“
  rationale: „Tiere“ entspricht zunächst der lexikalischen Bedeutung und vermeidet eine übermäßig deutende Vorentscheidung. Ihre außergewöhnliche und bedrohliche Rolle ergibt sich aus der Vision und ihrer späteren Auslegung; „gewaltige“ trägt hier bereits zur unheimlichen Wirkung bei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und bildkräftig; „gewaltige Tiere“ wahrt die Größe und bedrohliche Wirkung, während die Deutung der Tiere nicht vorweggenommen wird.
