source:
  edition: WLC
  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: de
  text: bis der Hochbetagte kam, das Urteil zugunsten der Heiligen[b] des Höchsten erging[a], die Zeit herankam und die Heiligen das Königreich in Besitz nahmen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Den Heiligen des Höchsten wurde das Gericht übertragen.“ Die aramäische Präposition kann hier einen Begünstigten („zugunsten von“) oder einen Empfänger („den Heiligen“) bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „der heiligen Wesen des Höchsten“. Die Bezeichnung kann, je nach Verständnis des Zusammenhangs, auch himmlische Wesen meinen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und die Heiligen besaßen das Königreich“. Das aramäische Verb kann sowohl die Inbesitznahme als auch den Besitz ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד דִּי
  choice: bis
  rationale: Die aramäische Verbindung bezeichnet die zeitliche Grenze der zuvor geschilderten Bedrängnis; „bis“ ist im Deutschen knapp und natürlich.
- source_word: אֲתָה
  choice: kam
  rationale: Das Verb bezeichnet das Kommen oder Eintreffen und behält hier seine erzählerische Kraft.
- source_word: עַתִּיק יוֹמַיָּא
  choice: der Hochbetagte
  rationale: Die würdige, im Deutschen verständliche Titelwiedergabe bringt das Bild ehrwürdigen Alters zum Ausdruck, ohne die Gestalt näher zu bestimmen.
- source_word: וְדִינָא יְהִב
  choice: das Urteil … erging
  rationale: דִּינָא kann Gericht, Urteil oder Recht bezeichnen. Die idiomatische deutsche Formulierung bewahrt den forensischen Sinn der wörtlich passivartigen Wendung „wurde gegeben“.
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: zugunsten der Heiligen des Höchsten
  rationale: 'Das לְ wird im Kontext als benefaktiv verstanden: Das Urteil ergeht zugunsten der Bedrängten. Die grammatisch mögliche Auffassung als indirektes Objekt bleibt in Fußnote [a] erhalten.'
- source_word: וְזִמְנָא מְטָה
  choice: die Zeit kam
  rationale: Die Wendung bezeichnet das Eintreffen des entscheidenden Zeitpunkts. „Bestimmte Zeit“ wäre möglich, doch „bestimmt“ steht nicht ausdrücklich im Aramäischen.
- source_word: וּמַלְכוּתָא
  choice: das Königreich
  rationale: Das Substantiv bezeichnet hier das Königreich beziehungsweise die königliche Herrschaft; „Königreich“ passt zum Zusammenhang von Daniel 7 und bleibt konkret.
- source_word: הֶחֱסִנוּ
  choice: nahmen … in Besitz
  rationale: Das Verb kann das Erlangen oder Besitzen ausdrücken. „In Besitz nahmen“ hebt den Übergang zur tatsächlichen Inbesitznahme hervor.
- source_word: קַדִּישִׁין / קַדִּישֵׁי
  choice: die Heiligen
  rationale: „Die Heiligen“ ist eine natürliche deutsche Bezeichnung für die Gott Zugehörigen und legt ihre genaue Identität nicht enger fest, als es der Text tut.
theological_decisions:
- issue: Sinn von וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: das Urteil erging zugunsten der Heiligen des Höchsten
  alternative: den Heiligen des Höchsten wurde das Gericht übertragen
  rationale: Der Kontext spricht für die gerichtliche Rechtfertigung der zuvor bedrängten Heiligen. Da die Präposition לְ jedoch auch ein indirektes Objekt kennzeichnen und damit die Übertragung richterlicher Befugnis nahelegen kann, wird diese Spannung in Fußnote [a] bewahrt.
- issue: Identität der קַדִּישִׁין
  choice: die Heiligen
  alternative: die heiligen Wesen / die Heiligen des Höchsten
  rationale: Die Wiedergabe lässt die Bezeichnung so weit, wie der aramäische Text sie lässt, und vermeidet eine vorschnelle Festlegung auf eine ausschließlich menschliche oder himmlische Gruppe.
- issue: Bedeutung von הֶחֱסִנוּ
  choice: nahmen das Königreich in Besitz
  alternative: besaßen das Königreich
  rationale: Die Hauptfassung gibt den möglichen ingressiven Sinn wieder; die Zustandsbedeutung „besaßen“ bleibt als echte lexikalische Möglichkeit in Fußnote [c] sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng an der aramäischen Reihung, während „das Urteil erging“ statt einer unnatürlichen wörtlichen Formulierung („das Gericht wurde gegeben“) verwendet wird. Der Titel „der Hochbetagte“ ist verständlich und bewahrt das Altersbild.
