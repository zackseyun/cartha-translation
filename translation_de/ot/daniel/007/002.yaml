  text: עָנֵ֤ה דָנִיֵּאל֙ וְ/אָמַ֔ר חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוִ֖/י עִם לֵֽילְיָ֑/א וַ/אֲר֗וּ אַרְבַּע֙ רוּחֵ֣י שְׁמַיָּ֔/א מְגִיחָ֖ן לְ/יַמָּ֥/א רַבָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: de
  text: 'Daniel ergriff das Wort und sagte: „Ich schaute in meiner Vision bei Nacht, und siehe: Die vier Winde[a] des Himmels wühlten das große Meer auf.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vier Geister des Himmels“. Das aramäische Wort kann sowohl „Winde“ als auch „Geister“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: hob an und sagte
  rationale: Die aramäische Erzählformel leitet Daniels Rede ein, ohne zwingend eine vorausgehende Frage vorauszusetzen. „Hob an und sagte“ bewahrt den formelhaften Charakter und klingt im Deutschen würdevoll.
- source_word: חָזֵה הֲוֵית
  choice: ich sah
  rationale: Die Verbindung aus Partizip und Hilfsverb bezeichnet ein andauerndes Sehen in der Vergangenheit. Im natürlichen Deutschen kann das Präteritum diesen Verlauf im Kontext wiedergeben; „ich war sehend“ wäre unidiomatisch.
- source_word: בְּחֶזְוִי עִם לֵילְיָא
  choice: in meinem nächtlichen Gesicht
  rationale: „Gesicht“ bezeichnet hier eine visionäre Schau, nicht das menschliche Antlitz. Die Verbindung mit „nächtlich“ gibt sowohl den persönlichen Visionsbezug als auch die Zeitangabe knapp und natürlich wieder.
- source_word: וַאֲרוּ
  choice: Siehe
  rationale: Der Aufmerksamkeitsmarker führt das visionäre Bild lebhaft ein und bewahrt den feierlich-apokalyptischen Ton.
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: die vier Winde des Himmels
  rationale: Im unmittelbaren Bild des aufgewühlten Meeres ist „Winde“ die naheliegende Bedeutung. Die ebenfalls mögliche Bedeutung „Geister“ bleibt in einer Fußnote erhalten.
- source_word: מְגִיחָן
  choice: wühlten ... auf
  rationale: Das Partizip schildert fortdauernde, kraftvolle Einwirkung auf das Meer. „Aufwühlen“ gibt die sichtbare Wirkung der Winde idiomatisch und anschaulich wieder.
- source_word: לְיַמָּא רַבָּא
  choice: das große Meer
  rationale: Dies entspricht der aramäischen Wendung direkt und lässt offen, ob ein bestimmtes Meer oder die symbolische Weite des Meeres gemeint ist.
theological_decisions:
- issue: רוּחֵי im apokalyptischen Gesicht
  choice: Winde
  alternative: Geister
  rationale: Das Meeresszenario spricht zunächst für kosmische Winde, doch das aramäische Wort kann auch „Geister“ bedeuten. Die alternative Deutung wird deshalb nicht ausgeschlossen, sondern ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem visionärem Signalwort „Siehe“. „Gesicht“ wird im etablierten biblischen Sinn von „Vision“ gebraucht; die Satzgestaltung bleibt verständlich und knapp.
