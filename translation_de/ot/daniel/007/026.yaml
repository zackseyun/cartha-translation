source:
  edition: WLC
  text: וְ/דִינָ֖/א יִתִּ֑ב וְ/שָׁלְטָנֵ֣/הּ יְהַעְדּ֔וֹן לְ/הַשְׁמָדָ֥ה וּ/לְ/הוֹבָדָ֖ה עַד סוֹפָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: de
  text: Doch der Gerichtshof wird sich setzen[a], und seine Herrschaft[b] wird weggenommen werden, um sie endgültig[c] zu vernichten und zu beseitigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch das Gericht wird tagen“ beziehungsweise „Doch das Urteil wird ergehen“. Das Aramäische kann das Gericht als Gremium, seine Sitzung oder den richterlichen Vorgang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Macht“ beziehungsweise „seine Herrschaftsgewalt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „bis zum Ende“. Die Wendung kann die endgültige oder vollständige Aufhebung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: der Gerichtshof
  rationale: Das aramäische Substantiv kann sowohl das Gericht als richterliches Gremium beziehungsweise dessen Sitzung als auch das Gerichtsurteil bezeichnen. Zusammen mit „wird sich setzen“ liegt hier vorrangig der zusammentretende himmlische Gerichtshof nahe.
- source_word: יִתִּב
  choice: wird sich setzen
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Sichsetzens und bezeichnet im gerichtlichen Zusammenhang zugleich den Beginn der Sitzung.
- source_word: שָׁלְטָנֵהּ
  choice: seine Herrschaft
  rationale: Das Wort bezeichnet Herrschaftsgewalt oder Machtbereich. „Herrschaft“ ist im königlich-apokalyptischen Zusammenhang natürlich und hält den Bezug des singularischen Suffixes offen.
- source_word: יְהַעְדּוֹן
  choice: wird weggenommen werden
  rationale: Der aramäische Plural hat hier unpersönliche Bedeutung. Das deutsche Passiv gibt das Ergebnis wieder, ohne ein im Ausgangstext nicht ausdrücklich genanntes handelndes Subjekt einzuführen.
- source_word: לְהַשְׁמָדָה
  choice: um sie zu vernichten
  rationale: Die Infinitivform bezeichnet Zweck oder Folge der Wegnahme. Das Pronomen „sie“ nimmt eindeutig „Herrschaft“ auf.
- source_word: וּלְהוֹבָדָה
  choice: und … zu beseitigen
  rationale: Das zweite Verb verstärkt zusammen mit dem ersten die vollständige Aufhebung der Herrschaft. „Beseitigen“ ist kräftig, aber vermeidet die mögliche ontologische Überdeutung von „auslöschen“ oder „annihilieren“.
- source_word: עַד סוֹפָא
  choice: bis zum Ende
  rationale: Die Wendung wird formal bewahrt und bringt die Endgültigkeit des Gerichts zum Ausdruck, ohne sie ausschließlich als adverbiales „vollständig“ auszulegen.
theological_decisions:
- issue: Bezug von „seine Herrschaft“
  choice: Das singularische Pronomen bleibt ohne nähere Identifizierung stehen und verweist im unmittelbaren Zusammenhang auf den zuvor beschriebenen vermessenen Herrscher beziehungsweise das kleine Horn.
  alternative: Es kann weiter gefasst die Herrschaft des vierten Tieres insgesamt bezeichnen.
  rationale: Horn und tierisches Reich sind in der Vision eng verbunden. Die Übersetzung wahrt deshalb den Singular des Textes, ohne den Bezug dogmatisch oder historisch genauer festzulegen.
- issue: Träger des Gerichtsakts
  choice: Die Wegnahme wird im Passiv formuliert.
  alternative: „Sie werden seine Herrschaft wegnehmen“ oder „der Gerichtshof wird seine Herrschaft wegnehmen“.
  rationale: Der aramäische Plural kann unpersönlich gebraucht sein. Das Passiv vermeidet, den Gerichtshof oder eine andere Gruppe ausdrücklich zum handelnden Subjekt zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Gerichtsszene. „Der Gerichtshof wird sich setzen“ hält die konkrete Bildsprache des Aramäischen fest, während die Fußnote natürlichere und abstraktere Deutungsmöglichkeiten nennt. Die beiden Vernichtungsverben bleiben als steigernde Paarung erhalten.
