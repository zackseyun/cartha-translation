  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: de
  text: Und ihm wurden Herrschaft, Ehre und Königsherrschaft gegeben, damit ihm alle Völker, Nationen und Sprachgruppen dienen.[a] Seine Herrschaft ist eine ewige Herrschaft, die nicht vergehen wird, und seine Königsherrschaft wird nicht zerstört werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm huldigten“ oder „ihn verehrten“. Das aramäische Verb kann Dienst einschließlich religiösen Dienstes bezeichnen; daher kann mehr als politische Unterordnung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִיב
  choice: wurden … gegeben
  rationale: Die passive Wiedergabe entspricht der aramäischen Konstruktion und lässt den Geber wie im Ausgangstext unausgesprochen.
- source_word: שָׁלְטָן
  choice: Herrschaft
  rationale: „Herrschaft“ bezeichnet die verliehene königliche Regierungsgewalt und wahrt die Wiederholung des Wortes im zweiten Satz.
- source_word: וִיקָר
  choice: Ehre
  rationale: Das Wort bezeichnet Ehre, Würde oder Herrlichkeit. „Ehre“ ist hier natürlich, feierlich und lässt offen, ob stärker an erwiesene Ehre oder sichtbare Herrlichkeit gedacht ist.
- source_word: מַלְכוּ / מַלְכוּתֵהּ
  choice: Königsherrschaft
  rationale: Der Begriff kann sowohl Königtum beziehungsweise Herrschaft als auch Königreich bezeichnen. „Königsherrschaft“ passt zur verliehenen Regierungsgewalt und kann im letzten Satz als etwas Unzerstörbares bezeichnet werden, ohne den Sinn auf ein Territorium zu verengen.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: Völker, Nationen und Sprachgruppen
  rationale: Die dreigliedrige Universalformel bleibt erhalten. „Sprachgruppen“ gibt die metonymische Bedeutung von „Sprachen“ im Deutschen verständlich wieder, da nicht die Sprachen selbst dienen.
- source_word: יִפְלְחוּן
  choice: dienten
  rationale: Das aramäische Verb kann allgemeinen, politischen oder religiösen Dienst bezeichnen. „Dienten“ wahrt diese Bedeutungsbreite und löst die theologische Spannung nicht einseitig als Anbetung auf.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: Seine Herrschaft ist eine ewige Herrschaft
  rationale: Die emphatische Wiederholung von „Herrschaft“ wird bewahrt; „ewig“ bringt die dauerhafte, unbegrenzte Geltung im Kontrast zu den vergänglichen Reichen zum Ausdruck.
- source_word: יֶעְדֵּה
  choice: nicht vergehen wird
  rationale: Die Formulierung gibt das Vergehen beziehungsweise Weggenommenwerden idiomatisch wieder und erhält den Zukunftsbezug.
- source_word: תִתְחַבַּל
  choice: nicht zerstört werden
  rationale: Im Zusammenhang mit Königsherrschaften bezeichnet das Verb Zerstörung oder Vernichtung; die passive Form entspricht dem aramäischen Text.
theological_decisions:
- issue: Bedeutung von יִפְלְחוּן gegenüber der menschenähnlichen Gestalt
  choice: dienten ihm
  alternative: ihn verehrten / ihm huldigten
  rationale: In Daniel kann das Verb religiösen Dienst bezeichnen, doch es zwingt nicht in jedem Kontext zur eindeutigen Übersetzung „anbeten“. „Dienten ihm“ bewahrt sowohl den politischen als auch den möglichen kultisch-religiösen Sinn.
- issue: Bedeutung von מַלְכוּ als Herrschaft oder Reich
  choice: Königsherrschaft
  alternative: Königreich / Reich
  rationale: Die Vision spricht zugleich von verliehener königlicher Macht und ihrer unvergänglichen Dauer. „Königsherrschaft“ wahrt diese Verbindung, ohne den Begriff ausschließlich räumlich oder territorial zu verstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „Herrschaft“ wurden zur Wahrung des visionär-feierlichen Tons beibehalten; „Sprachgruppen“ vermeidet im Deutschen die missverständliche Vorstellung, Sprachen selbst würden dienen.
