id: DAN.7.21
reference: Daniel 7:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: de
  text: 'Ich sah weiter zu: Dieses Horn führte Krieg gegen die Heiligen[a] und gewann die Oberhand über sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Heiligen“. Gemeint sein können auch „die heiligen Wesen“ oder „Gottes heiliges Volk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Ich sah weiter zu
  rationale: Die Verbindung aus Partizip und Seinsverb bezeichnet eine andauernde Handlung in der Vergangenheit. Die Formulierung gibt den fortlaufenden Charakter der Vision natürlich wieder.
- source_word: וְקַרְנָא דִכֵּן
  choice: Dieses Horn
  rationale: דִכֵּן verweist demonstrativ auf das zuvor beschriebene Horn. „Dieses Horn“ ist im Deutschen ein natürlicher anaphorischer Rückverweis.
- source_word: עָבְדָה קְרָב
  choice: führte Krieg
  rationale: Die aramäische Wendung bedeutet wörtlich etwa „Krieg/Kampf machen“. „Krieg führen“ ist die entsprechende natürliche deutsche Wendung und passt zur fortdauernden visionären Szene.
- source_word: עִם
  choice: gegen
  rationale: עִם bedeutet formal „mit“, bezeichnet in der Wendung für Kriegführen jedoch die feindliche Gegenpartei. Im Deutschen verlangt die natürliche Formulierung „Krieg führen gegen“.
- source_word: קַדִּישִׁין
  choice: die Heiligen
  rationale: Das substantivierte Adjektiv bedeutet wörtlich „die Heiligen“ beziehungsweise „die heiligen Wesen/Menschen“. Die knappe Wiedergabe bewahrt die Offenheit hinsichtlich der genauen Gruppe.
- source_word: וְיָכְלָה לְהוֹן
  choice: und gewann die Oberhand über sie
  rationale: Das Verb kann „fähig sein“, „sich als überlegen erweisen“ oder „überwältigen“ bedeuten. Die Wendung bezeichnet hier den Erfolg des Horns, ohne zwingend einen endgültigen Sieg auszudrücken.
theological_decisions:
- issue: Bezug von קַדִּישִׁין
  choice: die Heiligen
  alternative: die heiligen Wesen; Gottes heiliges Volk
  rationale: Der Ausdruck kann im Zusammenhang auf Gottes geheiligtes Volk zielen, lässt aber die genaue Identität der „Heiligen“ sprachlich offen. Die Übersetzung legt daher weder ausschließlich Menschen noch ausschließlich himmlische Wesen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den Übergang von Daniels fortgesetztem Zuschauen zum Inhalt der beobachteten Szene ab. „Gewann die Oberhand“ ist idiomatisch und lässt den im Kontext nur zeitweiligen Erfolg des Horns erkennen, ohne diese zeitliche Begrenzung ausdrücklich in den Vers hineinzutragen.
