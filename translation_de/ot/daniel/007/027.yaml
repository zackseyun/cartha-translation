reference: Daniel 7:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַלְכוּתָ֨/ה וְ/שָׁלְטָנָ֜/א וּ/רְבוּתָ֗/א דִּ֚י מַלְכְוָת֙ תְּח֣וֹת כָּל שְׁמַיָּ֔/א יְהִיבַ֕ת לְ/עַ֖ם קַדִּישֵׁ֣י עֶלְיוֹנִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/כֹל֙ שָׁלְטָ֣נַיָּ֔/א לֵ֥/הּ יִפְלְח֖וּן וְ/יִֽשְׁתַּמְּעֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: de
  text: Und das Königtum, die Herrschaft und die Größe der Königreiche unter dem ganzen Himmel werden dem Volk der Heiligen des Höchsten gegeben werden.[a] Sein Königtum wird ein ewiges Königtum sein,[b] und alle Herrschaften werden ihm dienen[c] und gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Volk der heiligen Wesen des Höchsten“; auch möglich: „dem heiligen Volk des Höchsten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Aramäischen stehen singularische Formen: „Sein Königtum … ihm dienen und gehorchen.“ Das kann auf den zuvor in der Vision dargestellten einzelnen Herrscher hinweisen, obwohl das Königtum den Heiligen gegeben wird.'
    reason: alternative_reading
  - marker: c
    text: „Dienen“ kann im Danielbuch, wenn der Dienst einer Gottheit gilt, auch den Sinn „verehren“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתָה
  choice: das Königtum
  rationale: מַלְכוּת bezeichnet sowohl das Reich als auch die Königsherrschaft. In der Dreierreihe mit Herrschaft und Größe hebt „Königtum“ die übertragene Herrschaftsmacht hervor und lässt zugleich den politischen Bereich mitklingen.
- source_word: שָׁלְטָנָא
  choice: die Herrschaft
  rationale: Das Wort bezeichnet souveräne Herrschaft oder Herrschaftsgewalt. „Herrschaft“ ist im modernen Deutschen würdig und bewahrt die Verbindung zum Plural später im Vers.
- source_word: רְבוּתָא
  choice: die Größe
  rationale: Die direkte Wiedergabe wahrt den umfassenden Sinn von Größe und Bedeutung, ohne ihn auf Pracht oder Majestät einzuengen.
- source_word: דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  choice: der Königreiche unter dem ganzen Himmel
  rationale: Die Formulierung gibt die weltweite Reichweite der Herrschaft idiomatisch wieder. Der Singular „Himmel“ entspricht hier natürlichem deutschen Sprachgebrauch.
- source_word: יְהִיבַת
  choice: werden ... gegeben werden
  rationale: Obwohl formal ein Perfekt vorliegt, beschreibt es im Zusammenhang der apokalyptischen Vision das angekündigte Ergebnis; das deutsche Futur gibt diese Funktion klar wieder.
- source_word: לְעַם
  choice: dem Volk
  rationale: עַם ist ein Kollektivbegriff. „Volk“ ist prägnant und vermeidet die moderne staatsrechtliche Färbung von „Nation“.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: der Heiligen des Höchsten
  rationale: „Heilige“ bewahrt die substantivische Form und die mögliche Mehrdeutigkeit zwischen heiligen Menschen und „heiligen Wesen“; eine Fußnote nennt die wesentlichen Alternativen.
- source_word: מַלְכוּתֵהּ
  choice: sein Königtum
  rationale: Das aramäische Suffix steht ausdrücklich im maskulinen Singular. Diese Form wird beibehalten, statt sie zugunsten des zuvor genannten Volkes zu pluralisieren oder unpersönlich zu machen.
- source_word: מַלְכוּת עָלַם
  choice: ein ewiges Königtum
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „Ewig“ ist im Deutschen natürlich, gewichtig und semantisch offen genug.
- source_word: שָׁלְטָנַיָּא
  choice: alle Herrschaften
  rationale: Der Plural kann Herrschaftsbereiche oder Herrschaftsmächte bezeichnen. „Herrschaften“ erhält diese Offenheit und den lexikalischen Zusammenhang mit שָׁלְטָנָא.
- source_word: יִפְלְחוּן
  choice: ihm dienen
  rationale: Das Verb kann allgemeinen Dienst und im Danielbuch auch kultische Verehrung bezeichnen. „Dienen“ ist die breiteste passende Wiedergabe; die mögliche Bedeutung „verehren“ wird vermerkt.
- source_word: וְיִשְׁתַּמְּעוּן
  choice: und gehorchen
  rationale: Das Verb beruht auf dem Gedanken des Hörens, bezeichnet im Herrschaftskontext aber Gehorsam. Das einmal gesetzte „ihm“ gilt im Deutschen natürlich für beide Verben.
theological_decisions:
- issue: Bezug der singularischen Formen in der zweiten Satzhälfte
  choice: 'Den Singular beibehalten: „Sein Königtum ... ihm dienen und gehorchen“.'
  alternative: Sinngemäß pluralisieren („ihr Königtum ... ihnen“) oder unpersönlich auf das Königtum beziehen.
  rationale: Der aramäische Text verwendet maskuline Singularformen, obwohl das Königtum zuvor dem Volk der Heiligen gegeben wird. Daniel 7 verbindet die Herrschaft sowohl mit dem Menschensohnähnlichen als auch mit den Heiligen. Die Übersetzung wahrt diese Spannung, ohne den Bezug festzulegen.
- issue: Identität der קַדִּישִׁין
  choice: „das Volk der Heiligen des Höchsten“
  alternative: „das heilige Volk des Höchsten“ oder „das Volk der heiligen Wesen des Höchsten“
  rationale: Die substantivische Übersetzung wahrt die grammatische Gestalt und lässt offen, ob die Bezeichnung primär Gottes heiliges Volk oder heilige Wesen meint. Die Alternativen werden in einer Fußnote transparent gemacht.
- issue: Bedeutungsumfang von יִפְלְחוּן
  choice: „dienen“ im Haupttext
  alternative: „verehren“
  rationale: Im Danielbuch kann das Verb kultischen Dienst an einer Gottheit bezeichnen, doch das allgemeinere „dienen“ vermeidet eine vorschnelle theologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Herrschaftsformel bleibt erhalten. „Königtum“ wurde gegenüber „Königreich“ bevorzugt, weil hier übertragene Königsherrschaft im Vordergrund steht und so der Singular „sein Königtum“ natürlich anschließt. Die aramäischen Singularformen und die Mehrdeutigkeit von „Heilige“ und „dienen“ werden nicht harmonisiert.
