id: DAN.7.4
reference: Daniel 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: de
  text: Das erste Tier war wie ein Löwe und hatte Adlerflügel. Ich beobachtete weiter, bis ihm die Flügel ausgerissen[a] wurden. Es wurde von der Erde emporgehoben und wie ein Mensch auf zwei Füße gestellt[b], und ihm wurde ein menschliches Herz[c] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „abgerissen“ oder „ausgerupft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf Füße wie ein Mensch gestellt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „das Herz eines Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: das erste Tier
  rationale: Das feminine Ordinal bezeichnet das erste der zuvor genannten Tiere. „Tier“ wird zur eindeutigen und natürlichen Bezugnahme aus dem Kontext ergänzt.
- source_word: כְאַרְיֵה
  choice: war wie ein Löwe
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich, keine Gleichsetzung.
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: und hatte Adlerflügel
  rationale: Die aramäische Besitzkonstruktion lautet wörtlich etwa „Adlerflügel waren ihm“; im Deutschen ist „hatte Adlerflügel“ natürlich und genau.
- source_word: חָזֵה הֲוֵית
  choice: Ich beobachtete weiter
  rationale: Partizip und Hilfsverb drücken einen andauernden Vorgang in der Vergangenheit aus.
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: ihm die Flügel ausgerissen wurden
  rationale: Das Verb bezeichnet ein gewaltsames Aus- oder Abreißen; „ausgerissen“ bewahrt die Anschaulichkeit, ohne die Art des Vorgangs enger festzulegen.
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: Es wurde von der Erde emporgehoben
  rationale: Die passive Form beschreibt, dass das Tier von der Erde weggehoben wird. „Erde“ erhält die mögliche räumliche und symbolische Weite von אַרְעָא besser als das engere „Boden“.
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: und wie ein Mensch auf zwei Füße gestellt
  rationale: Die Kausativform bedeutet, dass das Tier zum Stehen gebracht wird. „Zwei“ macht im Deutschen die durch die Körperteilform und den menschlichen Vergleich naheliegende Vorstellung idiomatisch deutlich; die wörtlichere Form steht in der Fußnote.
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: und ihm wurde ein menschliches Herz gegeben
  rationale: Die Wendung bezeichnet ein einem Menschen eigenes Herz beziehungsweise Inneres. „Menschliches Herz“ bewahrt die Bildsprache und legt sie nicht ausdrücklich als Verstand, Gesinnung oder Charakter aus.
theological_decisions:
- issue: Anthropologische Sprache beim Übergang von tierischen zu menschlichen Merkmalen
  choice: „wie ein Mensch“ und „ein menschliches Herz“
  alternative: „wie ein Mann“ und „das Herz eines Menschen“
  rationale: אֱנָשׁ bezeichnet hier den Menschen im Gegensatz zum Tier, nicht ausdrücklich eine männliche Person. Die gewählte Form gibt diesen Gegensatz natürlich wieder, ohne das „Herz“ interpretierend auf Verstand oder Moral zu verengen.
- issue: Bedeutung des gegebenen Herzens
  choice: Die konkrete Metapher „menschliches Herz“ bleibt stehen.
  alternative: Deutende Wiedergaben wie „menschlicher Verstand“ oder „menschliche Gesinnung“
  rationale: Das aramäische לְבַב kann das innere Denken, Wollen und Empfinden umfassen. Eine eindeutige Festlegung auf nur eine dieser Seiten würde die genuine Bedeutungsbreite und mögliche theologische Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Bildsprache. Der fortlaufende Beobachtungsvorgang wird natürlich ausgedrückt; die Tier-Mensch-Kontraste und die unbestimmte Bedeutung des „Herzens“ bleiben erhalten.
