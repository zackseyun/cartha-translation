base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: de
  text: 'Ich, Daniel: Mein Geist war in seiner Hülle[a] tief beunruhigt, und die Visionen in meinem Kopf versetzten mich in Schrecken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in meinem Körper. Das seltene aramäische Wort wird meist als „Hülle“ oder „Scheide“ verstanden und kann hier bildhaft den Körper bezeichnen, der den Geist umschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: war … tief beunruhigt
  rationale: Das aramäische Verb bezeichnet einen schmerzlichen inneren Aufruhr. „Tief beunruhigt“ gibt die Intensität natürlich wieder, ohne das mögliche Bild des Durchbohrtwerdens ungesichert zu konkretisieren.
- source_word: רוּחִי
  choice: in meinem Geist
  rationale: רוּחַ bezeichnet hier Daniels inneren Geist, nicht Wind oder Atem. Die Wiedergabe bewahrt den anthropologischen Bezug des Ausgangstextes.
- source_word: בְּגוֹא נִדְנֶה
  choice: in seiner Hülle
  rationale: נִדְנֶה ist ein seltenes aramäisches Wort für eine Hülle oder Scheide und bezeichnet bildhaft den Körper, der den Geist umschließt. Die Formulierung bewahrt das ungewöhnliche Bild; die verständlichere Deutung steht in der Fußnote.
- source_word: חֶזְוֵי
  choice: die Visionen
  rationale: Im apokalyptischen Zusammenhang sind damit visionär wahrgenommene Erscheinungen gemeint. „Visionen“ ist im heutigen Deutsch klar und kontextgerecht.
- source_word: רֵאשִׁי
  choice: in meinem Kopf
  rationale: Wörtlich steht „meines Kopfes“. Die idiomatische deutsche Wendung „in meinem Kopf“ wahrt den körperlichen Bezug, ohne auf das heute gehobene oder altertümlich wirkende „Haupt“ auszuweichen.
- source_word: יְבַהֲלֻנַּנִי
  choice: versetzten mich in Schrecken
  rationale: Das Verb drückt starke Bestürzung und Angst aus. Die gewählte Formulierung erhält diese Intensität in würdigem, natürlichem Deutsch.
theological_decisions:
- issue: Verhältnis von Geist und Körper im Bild der „Hülle“
  choice: Das Bild wird als „mein Geist, in seiner Hülle“ bewahrt.
  alternative: „Mein Geist war in meinem Innern tief beunruhigt“ oder „mein Geist war in meinem Körper tief beunruhigt“.
  rationale: Der seltene Ausdruck lässt ein Bild vom Körper als Hülle des Geistes erkennen. Die Übersetzung bewahrt diese Spannung, ohne daraus eine ausgearbeitete Lehre über die Zusammensetzung des Menschen abzuleiten; die körperbezogene Deutung wird als Alternative erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Hüllenmetapher des Aramäischen bleibt sichtbar, wird jedoch durch eine knappe Fußnote erschlossen. „In meinem Kopf“ ist bewusst natürlicher als „meines Hauptes“, während „versetzten mich in Schrecken“ die starke emotionale Wirkung wahrt.
