id: DAN.7.25
reference: Daniel 7:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִלִּ֗ין לְ/צַ֤ד עלי/א יְמַלִּ֔ל וּ/לְ/קַדִּישֵׁ֥י עֶלְיוֹנִ֖ין יְבַלֵּ֑א וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת וְ/יִתְיַהֲב֣וּן בִּ/ידֵ֔/הּ עַד עִדָּ֥ן וְ/עִדָּנִ֖ין וּ/פְלַ֥ג עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: de
  text: Er wird Worte gegen den Höchsten reden und die Heiligen des Höchsten zermürben. Er wird darauf sinnen, Zeiten[a] und Gesetz zu ändern. Sie werden in seine Hand gegeben werden[b] für eine Zeit, Zeiten und eine halbe Zeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „festgesetzte Zeiten“; gemeint sein könnten festgelegte Jahreszeiten oder Festzeiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie werden ihm ausgeliefert werden.“ Das unausgesprochene Subjekt bezieht sich am ehesten auf die Heiligen.'
    reason: alternative_reading
  - marker: c
    text: 'Die Formel lautet wörtlich: „für eine Zeit, Zeiten und eine halbe Zeit“. Sie kann einen begrenzten Zeitraum bezeichnen und wird oft als dreieinhalb Zeiten beziehungsweise Jahre verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִלִּין לְצַד עֶלְיָא יְמַלִּל
  choice: Er wird Worte gegen den Höchsten reden
  rationale: „Worte“ gibt מִלִּין direkt wieder; לְצַד hat hier im Zusammenhang adversative Bedeutung. „Der Höchste“ bewahrt den Gottesnamen als Titel.
- source_word: וּלְקַדִּישֵׁי עֶלְיוֹנִין יְבַלֵּא
  choice: und die Heiligen des Höchsten zermürben
  rationale: „Die Heiligen“ ist eine knappe, traditionsnahe Wiedergabe von קַדִּישֵׁי, ohne im Haupttext ausdrücklich zwischen Gottes Volk und himmlischen Wesen zu entscheiden. „Zermürben“ erfasst das fortgesetzte Aufreiben und Erschöpfen von יְבַלֵּא in natürlichem Deutsch.
- source_word: וְיִסְבַּר לְהַשְׁנָיָה
  choice: Er wird darauf sinnen, … zu ändern
  rationale: יִסְבַּר bezeichnet Denken, Beabsichtigen oder Planen. „Darauf sinnen“ drückt die Absicht aus, ohne zu behaupten, dass die Änderung tatsächlich gelingt.
- source_word: זִמְנִין וְדָת
  choice: Zeiten und Gesetz
  rationale: זִמְנִין kann allgemein „Zeiten“ oder speziell „festgesetzte Zeiten“ bezeichnen; die offenere Wiedergabe steht im Haupttext, die engere Möglichkeit in der Fußnote. דָת bedeutet hier am ehesten „Gesetz“, kann aber auch einen Erlass bezeichnen.
- source_word: וְיִתְיַהֲבוּן בִּידֵהּ
  choice: Sie werden in seine Hand gegeben werden
  rationale: Die passive Verbform ist pluralisch, ihr Subjekt bleibt unausgesprochen. Der Kontext legt die zuvor genannten Heiligen nahe. „In seine Hand“ bewahrt das aramäische Machtbild.
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: für eine Zeit, Zeiten und eine halbe Zeit
  rationale: Die formelhafte apokalyptische Zeitangabe wird nicht in Jahre umgerechnet. So bleiben sowohl eine zahlenmäßige als auch eine symbolische Deutung möglich.
theological_decisions:
- issue: Bezug der „Heiligen des Höchsten“
  choice: Die quelltextnahe Bezeichnung bleibt ohne erläuternden Zusatz im Haupttext stehen.
  alternative: „das heilige Volk des Höchsten“ oder „die himmlischen Heiligen“
  rationale: Daniel 7 verbindet die Heiligen eng mit denen, die das Königreich empfangen; dennoch soll die Übersetzung die mögliche Spannung zwischen Gottes heiligem Volk und himmlischen Wesen nicht durch eine ausdrückliche Festlegung beseitigen.
- issue: Unausgesprochenes Subjekt von „sie werden gegeben werden“
  choice: Das Pronomen „sie“ bleibt stehen; eine Fußnote nennt die Heiligen als wahrscheinlichsten Bezug.
  alternative: 'Explizit: „Die Heiligen werden in seine Hand gegeben werden“'
  rationale: Der aramäische Text nennt in diesem Satzglied kein Substantiv. Die Übersetzung bewahrt diese grammatische Offenheit, während sie die naheliegende kontextuelle Zuordnung erläutert.
- issue: Bedeutung der abschließenden Zeitformel
  choice: Die Formel „eine Zeit, Zeiten und eine halbe Zeit“ wird wörtlich bewahrt.
  alternative: „dreieinhalb Jahre“ oder „eine begrenzte symbolische Zeit“
  rationale: Der Quelltext selbst legt weder eine bestimmte Kalendereinheit noch eine ausschließlich symbolische Deutung ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zermürben“ macht die anhaltende bedrückende Wirkung idiomatisch verständlich; „darauf sinnen“ erhält den gehobenen prophetischen Ton, ohne altertümlich zu wirken. Die apokalyptische Zeitformel und das Bild „in seine Hand“ bleiben bewusst quelltextnah.
