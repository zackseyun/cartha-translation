  variant: modern standard German
source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: de
  text: 'Ich schaute weiter in den Visionen der Nacht, und siehe: Mit den Wolken des Himmels[a] kam einer wie ein Menschensohn heran.[b] Er gelangte bis zu dem Alten an Tagen,[c] und man führte ihn vor ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „auf den Wolken des Himmels“. Die aramäische Präposition bedeutet hier wörtlich „mit“ und kann eine Begleitung bezeichnen, ohne ausdrücklich zu sagen, dass die Gestalt sich auf den Wolken bewegt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einer wie ein Mensch“ beziehungsweise „wie ein menschliches Wesen“. Das Aramäische lautet wörtlich „wie ein Menschensohn“; diese Wendung kann eine menschliche Gestalt bezeichnen und wurde in der späteren biblischen Auslegung zu einem bedeutsamen messianischen Titel.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der Alte an Tagen“. Der aramäische Ausdruck ist ein besonderer Titel und bezeichnet eine ehrfurchtgebietende, uralte Gestalt.'
    reason: literal_rendering
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Ich schaute weiter
  rationale: Die Verbindung aus Partizip und הוה bezeichnet ein andauerndes Geschehen in der Vergangenheit. „Ich schaute weiter“ gibt diesen durativen Sinn natürlich wieder.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: in den Visionen der Nacht
  rationale: Die Wiedergabe bewahrt sowohl den Plural „Visionen“ als auch die Genitivverbindung mit „Nacht“.
- source_word: וַאֲרוּ
  choice: und siehe
  rationale: Die Wendung führt eine auffällige neue Szene ein und erhält den lebendigen, visionären Ton.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: mit den Wolken des Himmels
  rationale: עִם bedeutet „mit“. Die Übersetzung vermeidet daher die interpretierende Festlegung auf eine Bewegung „auf“ den Wolken.
- source_word: כְּבַר אֱנָשׁ
  choice: einer wie ein Menschensohn
  rationale: Die Formulierung bewahrt den Vergleich durch כְּ und die traditionsreiche, theologisch bedeutsame Wendung „Menschensohn“, ohne die Gestalt über den Wortlaut hinaus zu bestimmen.
- source_word: אָתֵה הֲוָה
  choice: kam
  rationale: Im Deutschen lässt sich der im Aramäischen durative Vorgang innerhalb dieser Bewegungsszene knapp und natürlich mit „kam“ ausdrücken; der vorausgehende visionäre Rahmen trägt den Verlaufscharakter mit.
- source_word: וְעַד עַתִּיק יוֹמַיָּא מְטָה
  choice: Er gelangte bis zu dem Hochbetagten
  rationale: „Gelangte bis zu“ bildet das erreichte Ziel der Annäherung ab. „Der Hochbetagte“ gibt den Titel in verständlichem, würdigem Deutsch wieder; seine wörtlichere Form wird in der Fußnote genannt.
- source_word: וּקְדָמוֹהִי הַקְרְבוּהִי
  choice: und man führte ihn vor ihn
  rationale: Das unbestimmte deutsche „man“ entspricht dem nicht näher bezeichneten pluralischen Subjekt. „Führte ... vor ihn“ bewahrt sowohl das Heranbringen als auch die Vorstellung vor dem Hochbetagten.
theological_decisions:
- issue: Wiedergabe von כְּבַר אֱנָשׁ in einer messianisch bedeutsamen Vision
  choice: einer wie ein Menschensohn
  alternative: einer wie ein Mensch / einer wie ein menschliches Wesen
  rationale: Die Übersetzung erhält sowohl den ausdrücklichen Vergleich als auch die für die spätere biblische Rezeption wichtige Wendung. Sie identifiziert die Gestalt nicht ausdrücklich mit einer späteren Deutung.
- issue: Verhältnis der Gestalt zu den Himmelswolken
  choice: mit den Wolken des Himmels
  alternative: auf den Wolken des Himmels
  rationale: Die aramäische Präposition עִם bedeutet „mit“. Damit bleibt offen, ob die Wolken die Gestalt begleiten oder als Träger ihrer Bewegung gedacht sind.
- issue: Wiedergabe des Titels עַתִּיק יוֹמַיָּא
  choice: der Hochbetagte
  alternative: der Alte an Tagen / der Alte der Tage
  rationale: „Der Hochbetagte“ ist im modernen Deutschen verständlich und würdig. Eine Fußnote bewahrt die auffällige wörtliche Gestalt des aramäischen Titels, ohne zusätzliche dogmatische Bestimmungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst visionärem Klang. „Und siehe“ erhält den apokalyptischen Szenenwechsel; ungewöhnliche oder theologisch gewichtige aramäische Wendungen werden im Haupttext bewahrt und in den Fußnoten erläutert.
