source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: de
  text: Ein Feuerstrom floss und ging vor ihm hervor. Tausend mal Tausend dienten ihm, und zehntausend mal zehntausend standen vor ihm. Das Gericht nahm Platz[a], und die Bücher[b] wurden geöffnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das Gericht setzte sich«; die Wendung bezeichnet den Beginn der Gerichtssitzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Schriftrollen« beziehungsweise »die Schriftstücke«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: Feuerstrom
  rationale: Die aramäische Genitivverbindung bezeichnet einen Strom oder Fluss aus Feuer. »Feuerstrom« bewahrt das kraftvolle Bild und klingt im Deutschen natürlich.
- source_word: נָגֵד וְנָפֵק
  choice: floss und ging ... aus
  rationale: Die beiden Verbformen schildern fortdauerndes Fließen und Hervorgehen. Die koordinierte Wiedergabe erhält beide Aspekte, ohne den deutschen Satz unnötig zu beschweren.
- source_word: מִן קֳדָמוֹהִי
  choice: von ihm aus
  rationale: Wörtlich steht »von vor ihm«. Im Deutschen gibt »von ihm aus« die räumliche Herkunft verständlich wieder, ohne sie lediglich zur abstrakten »Gegenwart« umzudeuten.
- source_word: אֶלֶף אלפים
  choice: Tausendmal Tausende
  rationale: Die Formulierung erhält die gestufte Zahlenvorstellung des Aramäischen und ist zugleich verständlicher als das hölzerne »tausend Tausende«.
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: dienten ihm
  rationale: Das Verb bezeichnet Dienen beziehungsweise Aufwarten. »Dienten ihm« ist weit genug, um keine besondere kultische Funktion einzutragen.
- source_word: וְרִבּוֹ רבון
  choice: zehntausendmal Zehntausende
  rationale: Die Wiedergabe bewahrt die gesteigerte Zahlenbildlichkeit und vermittelt die unübersehbare Größe der himmlischen Schar.
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: standen vor ihm
  rationale: Im Gerichtshofbild bezeichnet das Verb das Stehen vor dem Thron. Das deutsche Präteritum führt die erzählte Vision natürlich fort.
- source_word: דִּינָא יְתִב
  choice: Das Gericht nahm Platz
  rationale: Wörtlich lautet die Wendung etwa »das Gericht/Urteil setzte sich«. Gemeint ist, dass das himmlische Gericht zur Sitzung zusammentritt; »nahm Platz« bewahrt das Bild des Sichsetzens.
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: und die Bücher wurden geöffnet
  rationale: סִפְרִין kann Bücher, Schriftstücke oder Schriftrollen bezeichnen. »Bücher« ist im gerichtlichen Zusammenhang klar und traditionsnah; die mögliche konkretere Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Gerichtsidiom דִּינָא יְתִב
  choice: Das Gericht nahm Platz
  alternative: Das Gericht setzte sich; Das Urteil setzte sich
  rationale: Die Übersetzung macht das Zusammentreten des himmlischen Gerichts verständlich, ohne den Ausdruck zu einem bereits ergangenen Urteil umzudeuten. »nahm Platz« erhält zugleich die Sitzmetaphorik.
- issue: Zahlenangaben für die himmlischen Diener
  choice: Tausendmal Tausende ... zehntausendmal Zehntausende
  alternative: Tausende und Abertausende ... Myriaden über Myriaden
  rationale: Die Hauptfassung bewahrt die konkreten und gesteigerten Zahlenbilder, ohne festzulegen, ob sie exakt arithmetisch oder als Ausdruck unermesslicher Größe zu verstehen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das apokalyptische Zahlenbild und die Gerichtsszene bleiben formal erkennbar; schwer verständliche aramäische Idiomatik wird behutsam naturalisiert. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
