  text: וַ/אֲר֣וּ חֵיוָה֩ אָחֳרִ֨י תִנְיָנָ֜ה דָּמְיָ֣ה לְ/דֹ֗ב וְ/לִ/שְׂטַר חַד֙ הֳקִמַ֔ת וּ/תְלָ֥ת עִלְעִ֛ין בְּ/פֻמַּ֖/הּ בֵּ֣ין שני/ה וְ/כֵן֙ אָמְרִ֣ין לַ֔/הּ ק֥וּמִֽי אֲכֻ֖לִי בְּשַׂ֥ר שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
translation:
  language: de
  text: 'Und siehe, ein anderes Tier, ein zweites, das einem Bären glich. Es war auf einer Seite aufgerichtet[a], und drei Rippen[b] waren in seinem Maul zwischen seinen Zähnen. Und man sagte zu ihm: »Steh auf, friss viel Fleisch!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einer Flanke aufgerichtet“. Die schwierige Wendung hebt möglicherweise die ungleichmäßige Haltung des Tieres hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise: „drei Hauer“. „Rippen“ passt jedoch besser zu der Angabe, dass sie sich zwischen seinen Zähnen befanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוּ
  choice: Und siehe
  rationale: Die aramäische Schauformel führt ein neues Bild der Vision lebhaft ein. „Und siehe“ bewahrt ihre hinweisende Kraft und passt zum würdevollen Erzählton.
- source_word: חֵיוָה
  choice: Tier
  rationale: Im Deutschen bezeichnet „Tier“ natürlich ein Geschöpf dieser Art und trägt im Kontext die bedrohliche Symbolik, ohne eine zusätzliche Wertung einzuführen.
- source_word: אָחֳרִי תִנְיָנָה
  choice: ein anderes Tier, ein zweites
  rationale: Die Übersetzung erhält sowohl den Gedanken eines weiteren Tieres als auch seine Stellung als zweites Tier.
- source_word: דָּמְיָה לְדֹב
  choice: das einem Bären glich
  rationale: Die Form drückt Ähnlichkeit aus; „glich“ gibt den Vergleich knapp und natürlich wieder.
- source_word: וְלִשְׂטַר חַד הֳקִמַת
  choice: Es war auf einer Seite aufgerichtet
  rationale: Die schwierige Wendung wird resultativ-passiv wiedergegeben und wahrt das Bild einer ungleichmäßigen, auf einer Seite erhöhten Haltung.
- source_word: וּתְלָת עִלְעִין
  choice: drei Rippen
  rationale: „Rippen“ ist im Zusammenhang die wahrscheinlichste Bedeutung und passt zu ihrer Lage im Maul zwischen den Zähnen; die seltenere Deutung „Hauer“ bleibt in einer Fußnote erhalten.
- source_word: בְּפֻמַּהּ בֵּין שניּה
  choice: waren in seinem Maul zwischen seinen Zähnen
  rationale: 'Beide Ortsangaben werden ausdrücklich bewahrt: im Maul und genauer zwischen den Zähnen.'
- source_word: וְכֵן אָמְרִין לַהּ
  choice: Und man sagte zu ihm
  rationale: Das unbestimmte pluralische Subjekt wird im Deutschen idiomatisch mit „man“ wiedergegeben, ohne die nicht genannten Sprecher zu bestimmen.
- source_word: קוּמִי
  choice: Steh auf
  rationale: Der Imperativ wird in modernem, würdigem Deutsch unmittelbar wiedergegeben.
- source_word: אֲכֻלִי בְּשַׂר שַׂגִּיא
  choice: friss viel Fleisch
  rationale: Für ein Tier ist „fressen“ die natürliche deutsche Entsprechung von „essen“; „viel Fleisch“ bewahrt die konkrete und mengenbezogene Bildsprache, ohne ein stärkeres Verb wie „verschlingen“ hinzuzufügen.
theological_decisions:
- issue: Identität des zweiten Tieres und Deutung seiner Merkmale
  choice: Keine geschichtliche oder reichssymbolische Identifikation in den Vers aufgenommen
  alternative: Das Tier und seine Merkmale ausdrücklich einem bestimmten Reich oder Ereignis zuordnen
  rationale: Der Vers selbst beschreibt nur das visionäre Bild. Eine konkrete Identifikation wäre Auslegung und würde die im Text verbleibende Deutungsoffenheit einschränken.
- issue: Nicht genannte Sprecher des Befehls
  choice: Mit dem unbestimmten „man“ wiedergegeben
  alternative: Die Sprecher als göttliche Wesen, Menschen oder Mächte bestimmen
  rationale: Das aramäische Verb steht im Plural, doch das Subjekt wird nicht genannt. Die Übersetzung soll diese Unbestimmtheit nicht theologisch auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem visionärem Ton. Kurze, anschauliche Sätze bewahren die Abfolge des aramäischen Textes. „Und siehe“ ist bewusst als geläufige biblische Schauformel beibehalten; sonst wird archaische Sprache vermieden.
