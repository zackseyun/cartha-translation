source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: de
  text: 'Danach sah ich weiter in den Visionen der Nacht, und siehe, ein viertes Tier: furchterregend und schrecklich und überaus stark. Es hatte große eiserne Zähne; es fraß und zermalmte, und was übrig blieb, zertrat es mit seinen Füßen. Es unterschied sich von allen Tieren, die vor ihm gewesen waren, und es hatte zehn Hörner.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und natürlich wieder.
- source_word: חָזֵה הֲוֵית
  choice: sah ich weiter
  rationale: Die Verbindung von Partizip und Hilfsverb bezeichnet einen fortdauernden Vorgang; „sah ich weiter“ bewahrt diesen durativen Sinn in natürlichem Deutsch.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: in den Visionen der Nacht
  rationale: Nahe und zugleich verständliche Wiedergabe der aramäischen Genitivverbindung.
- source_word: וַאֲרוּ
  choice: Da war
  rationale: Markiert das plötzliche Auftreten innerhalb der Vision, ohne das im heutigen Deutsch oft altertümlich wirkende „siehe“ zu erzwingen.
- source_word: חֵיוָה רביעיה
  choice: ein viertes Tier
  rationale: „Tier“ passt zur symbolischen Bildwelt von Daniel 7 und vermeidet eine vorweggenommene historische Deutung.
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: furchterregend und schrecklich
  rationale: Bewahrt die doppelte, steigernde Beschreibung des Schreckens, ohne beide Ausdrücke zusammenzuziehen.
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: überaus stark
  rationale: Gibt Adjektiv und Intensivierung prägnant und würdig wieder.
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: Es hatte große eiserne Zähne
  rationale: Bewahrt Material und Größe der Zähne in natürlicher deutscher Wortstellung.
- source_word: אָכְלָה וּמַדֱּקָה
  choice: es fraß und zermalmte
  rationale: Erhält die Tiermetaphorik und die gewaltsame Bedeutung des zweiten Verbs.
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: und was übrig blieb, zertrat es mit seinen Füßen
  rationale: Gibt שְׁאָרָא idiomatisch wieder und bewahrt durch die Voranstellung den Kontrast zum zuvor Gefressenen und Zermalmten.
- source_word: מְשַׁנְּיָה
  choice: Es unterschied sich
  rationale: Drückt die Andersartigkeit gegenüber den vorausgehenden Tieren klar aus.
- source_word: וְקַרְנַיִן עֲשַׂר לַהּ
  choice: und es hatte zehn Hörner
  rationale: Direkte, eindeutige Wiedergabe des abschließenden Merkmals.
theological_decisions:
- issue: Identität des vierten Tieres
  choice: Die symbolische Tiergestalt wird ohne historische Identifizierung wiedergegeben.
  alternative: Das Tier im Text ausdrücklich mit Rom, einem hellenistischen Reich oder einem endzeitlichen Reich gleichsetzen.
  rationale: Der Vers selbst nennt kein bestimmtes Reich. Eine solche Zuordnung gehört in die Auslegung, nicht in die Übersetzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung „furchterregend und schrecklich und überaus stark“ bewahrt die eindringliche aramäische Kumulation. Auf Fußnoten wurde verzichtet, da die wichtigsten Bedeutungsnuancen im Haupttext ohne unnatürliche Formulierungen darstellbar sind.
