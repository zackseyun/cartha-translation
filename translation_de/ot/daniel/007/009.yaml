id: DAN.7.9
reference: Daniel 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: de
  text: Ich schaute weiter, bis Throne aufgestellt wurden[a] und der Hochbetagte[b] Platz nahm. Sein Gewand war weiß wie Schnee, und sein Haupthaar war wie reine Wolle. Sein Thron bestand aus Feuerflammen; dessen Räder waren loderndes Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Throne wurden hingestellt.“ Die traditionelle Wiedergabe „Throne wurden umgestürzt“ ist hier weniger wahrscheinlich, weil unmittelbar danach das himmlische Gericht zusammentritt.'
    reason: alternative_reading
  - marker: b
    text: 'Aramäisch wörtlich etwa: „der an Tagen Alte“; eine ehrfurchtsvolle Bezeichnung, die unermessliches Alter und ewige Majestät hervorhebt.'
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Ich schaute weiter
  rationale: Das Partizip mit Hilfsverb bezeichnet ein andauerndes Geschehen in der Vergangenheit. „Ich schaute weiter“ gibt diesen fortdauernden Blick innerhalb der Vision natürlich wieder.
- source_word: עַד דִּי
  choice: bis
  rationale: Die Verbindung bezeichnet hier den Zeitpunkt, bis zu dem Daniel weiterschaute.
- source_word: כָרְסָוָן
  choice: Throne
  rationale: Gemeint sind königliche beziehungsweise richterliche Throne, nicht gewöhnliche Sitzplätze; so bleibt die Szenerie des himmlischen Gerichts erhalten.
- source_word: רְמִיו
  choice: aufgestellt wurden
  rationale: Im Zusammenhang mit der Einberufung des himmlischen Gerichts bezeichnet das Verb am ehesten das Aufstellen oder Platzieren der Throne. Die ebenfalls mögliche Bedeutung „hingeworfen“ passt weniger gut zur Szene.
- source_word: וְעַתִּיק יוֹמִין
  choice: und der Hochbetagte
  rationale: „Der Hochbetagte“ bewahrt den feierlichen Charakter der aramäischen Bezeichnung und ist im modernen Deutschen verständlicher als eine starre Wiedergabe wie „der Alte an Tagen“.
- source_word: יְתִב
  choice: Platz nahm
  rationale: Das Verb bezeichnet das Sitzen beziehungsweise Sichsetzen; „Platz nahm“ passt natürlich zur Thron- und Gerichtsszene.
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: Sein Gewand war weiß wie Schnee
  rationale: Die Formulierung gibt den Singular und den Vergleich eng und zugleich idiomatisch wieder.
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: und sein Haupthaar war wie reine Wolle
  rationale: נְקֵא bezeichnet Reinheit beziehungsweise Sauberkeit. „Reine Wolle“ bewahrt dies, ohne die im Parallelbild nur nahegelegte Farbe ausdrücklich in das Wort einzutragen.
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: Sein Thron bestand aus Feuerflammen
  rationale: שְׁבִיבִין kann Flammen oder feurige Funken bezeichnen. „Feuerflammen“ erhält das intensive, erhabene Bild und die plurale Form.
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: dessen Räder waren loderndes Feuer
  rationale: Das Bezugswort des Suffixes ist der Thron. „Dessen Räder“ macht diesen Bezug im Deutschen eindeutig, ohne die Räder dem Hochbetagten selbst zuzuschreiben; „loderndes Feuer“ gibt die brennende Bewegung lebendig wieder.
theological_decisions:
- issue: Wiedergabe von עַתִּיק יוֹמִין als göttliche Bezeichnung
  choice: der Hochbetagte
  alternative: der an Tagen Alte; ein Hochbetagter
  rationale: Die Wendung fungiert in der himmlischen Gerichtsszene als ehrfurchtsvolle Bezeichnung. „Der Hochbetagte“ bewahrt ihren Titelcharakter, ohne die Identität der Gestalt über den aramäischen Wortlaut hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Bildsprache. Die Satzstruktur folgt der fortschreitenden Vision, ohne aramäische Idiomatik unnötig nachzuahmen. Die Feuer- und Thronbilder bleiben bewusst konkret und spannungsvoll.
