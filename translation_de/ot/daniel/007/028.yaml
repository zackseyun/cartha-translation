source:
  edition: WLC
  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: de
  text: 'Hier endet die Sache[a]. Was mich, Daniel, betrifft: Meine Gedanken versetzten mich in großen Schrecken, und mein Aussehen veränderte sich[b]. Doch ich bewahrte die Sache in meinem Herzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hier ist der Abschluss der Sache.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Gesichtsausdruck veränderte sich“; auch „mein Glanz veränderte sich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד כָּה סוֹפָא דִי מִלְּתָא
  choice: Hier endet die Sache
  rationale: Die aramäische Wendung bezeichnet den End- oder Schlusspunkt des Berichts. Die deutsche Fassung gibt diesen Sinn natürlich wieder, ohne die Konstruktion mit עַד כָּה unverständlich wörtlich nachzubilden; מִלְּתָא bleibt als „Sache“ erhalten.
- source_word: אֲנָה דָנִיֵּאל
  choice: Was mich, Daniel, betrifft
  rationale: Das selbstständige Pronomen mit dem Eigennamen ist betont. Die gewählte Form bewahrt diese Hervorhebung in natürlichem Deutsch.
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  choice: Meine Gedanken versetzten mich in großen Schrecken
  rationale: רַעְיוֹנַי bezeichnet Daniels Gedanken oder Überlegungen; שַׂגִּיא verstärkt die heftige Wirkung des Verbs בהל. „In großen Schrecken versetzen“ wahrt die Intensität, ohne den Gedanken selbst zusätzliche Eigenschaften zuzuschreiben.
- source_word: וְזִיוַי יִשְׁתַּנּוֹן עֲלַי
  choice: und mein Aussehen veränderte sich
  rationale: זִיו kann Glanz, Erscheinung oder Gesichtsausdruck bezeichnen. Im Zusammenhang ist „Aussehen“ die natürliche, hinreichend offene Wiedergabe. עֲלַי gehört zur aramäischen Ausdrucksweise und muss im Deutschen nicht mit einem eigenen Kausalzusatz wiedergegeben werden.
- source_word: וּמִלְּתָא בְּלִבִּי נִטְרֵת
  choice: Doch ich bewahrte die Sache in meinem Herzen
  rationale: נטר bedeutet bewahren, behalten oder hüten. „Bewahrte“ passt zum inneren Festhalten der Offenbarung. Das einleitende „Doch“ macht den Gegensatz zwischen der sichtbaren Erschütterung und Daniels innerem Bewahren deutlich; „Herz“ erhält die biblische Sprache für das Innere des Menschen.
theological_decisions:
- issue: Anthropologische Bedeutung von בְּלִבִּי
  choice: in meinem Herzen
  alternative: in meinem Inneren / in meinem Sinn
  rationale: „Herz“ bewahrt die breite biblische Vorstellung vom inneren Menschen und verengt die Aussage nicht auf einen rein verstandesmäßigen Vorgang.
- issue: Offenheit der Bedeutung von זִיו
  choice: mein Aussehen
  alternative: mein Gesichtsausdruck / mein Glanz
  rationale: Das Lexem kann sowohl äußere Erscheinung beziehungsweise Gesichtsausdruck als auch Glanz bezeichnen. „Aussehen“ lässt die im Kontext verbleibende Bedeutungsbreite stehen; die engeren Möglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die betonte Selbstnennung Daniels, die Intensität seines Schreckens und das Bild vom Herzen bleiben erhalten; ungewöhnlich wörtliche aramäische Wendungen werden idiomatisch wiedergegeben.
