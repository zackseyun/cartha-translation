  source_fidelity: Die Übersetzung gibt den aramäischen Abschlussvermerk עַד־כָּה סוֹפָא דִּי מִלְּתָא idiomatisch als „Hier endet die Sache“ wieder. Die betonte Selbstnennung Daniels, die starke Beunruhigung durch seine Gedanken, die Veränderung seines äußeren Erscheinens sowie das Bewahren der Sache „im Herzen“ sind sachgerecht wiedergegeben. Die nicht völlig festlegbare Nuance von זִיו bleibt mit „Aussehen“ offen.
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen zurückhaltendem biblischem Ton. „Was mich, Daniel, betrifft“ ist etwas formeller, aber idiomatisch und bildet die Hervorhebung des aramäischen Pronomens mit Namen gut ab. Die Satzfolge ist klar und natürlich.
  terminology: „Sache“ bewahrt die Wiederaufnahme von מִלְּתָא; „Herzen“ erhält die biblische Bildsprache von לֵב. „Aussehen“ ist für זִיו kontextgerecht und weniger einengend als ausschließlich „Gesicht“ oder „Glanz“. Die Fußnoten benennen echte mögliche Nuancen, ohne sie in den Haupttext einzutragen.
