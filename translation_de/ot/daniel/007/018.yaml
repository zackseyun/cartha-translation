base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: de
  text: Aber die Heiligen des Höchsten werden das Reich empfangen und das Reich besitzen bis in Ewigkeit, ja, bis in alle Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Wesen des Höchsten“. Der aramäische Ausdruck kann Gottes heiliges Volk bezeichnen; manche verstehen ihn in diesem Zusammenhang auch als Hinweis auf himmlische Wesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: werden … empfangen
  rationale: Das Peal-Imperfekt von קבל bedeutet hier schlicht „empfangen“ oder „annehmen“. „Empfangen“ vermeidet sowohl den Gedanken gewaltsamer Aneignung als auch eine im Verb nicht ausdrücklich formulierte Passivkonstruktion.
- source_word: מַלְכוּתָא
  choice: das Reich
  rationale: Das Substantiv kann sowohl Königsherrschaft als auch Herrschaftsbereich bezeichnen. „Das Reich“ ist im Zusammenhang von Daniel 7 natürlich und bewahrt beide Bedeutungsaspekte weitgehend.
- source_word: קַדִּישֵׁי
  choice: die Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet „Heilige“ beziehungsweise „heilige Wesen“. Die knappe Wiedergabe legt nicht fest, ob Menschen oder himmlische Wesen gemeint sind.
- source_word: עֶלְיוֹנִין
  choice: des Höchsten
  rationale: Der Ausdruck dient in Daniel als Gottesbezeichnung. „Der Höchste“ gibt den superlativischen Sinn und den Titelcharakter idiomatisch wieder.
- source_word: וְיַחְסְנוּן
  choice: und … besitzen
  rationale: Das Verb חסן bezeichnet hier dauerhaften Besitz beziehungsweise das Innehaben von Herrschaft. „Besitzen“ wahrt den Gegensatz zwischen dem Empfangen und dem anschließenden dauerhaften Besitz.
- source_word: עַד עָלְמָא
  choice: bis in Ewigkeit
  rationale: Die aramäische Wendung bezeichnet unbegrenzte Dauer. Die deutsche Formulierung ist idiomatisch und erhält zugleich die Präposition עַד („bis“).
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: ja, bis in alle Ewigkeit
  rationale: Die gesteigerte Wiederholung unterstreicht die Endlosigkeit. „Ja“ macht die verstärkende Fortführung natürlich verständlich, während „bis in alle Ewigkeit“ die emphatische Schlussformel wiedergibt.
theological_decisions:
- issue: Identität der קַדִּישֵׁי עֶלְיוֹנִין
  choice: Allgemein als „die Heiligen des Höchsten“ wiedergegeben, ohne den Bezug auf Gottes Volk oder auf himmlische Wesen festzulegen.
  alternative: „die heiligen Wesen des Höchsten“ beziehungsweise ausdrücklich „das heilige Volk des Höchsten“
  rationale: Die Identität der Bezeichneten ist in Daniel 7 umstritten und wird durch diesen Vers allein nicht eindeutig entschieden. Die Übersetzung bewahrt diese theologische Spannung; die Fußnote nennt die wesentlichen Verständnismöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „das Reich“ und die gesteigerte Ewigkeitsformel bleiben erhalten, um Nachdruck und Struktur des aramäischen Textes abzubilden.
