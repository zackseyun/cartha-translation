reference: Daniel 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: de
  text: Ganz Israel hat dein Gesetz übertreten und ist davon abgewichen, ohne auf deine Stimme zu hören. Darum wurden der Fluch und der Schwur[a], die im Gesetz des Mose, des Dieners Gottes, geschrieben stehen, über uns ausgegossen; denn wir haben gegen ihn gesündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der beschworene Fluch“. Im Hebräischen steht wörtlich „der Fluch und der Schwur“; wahrscheinlich sind die im Gesetz des Mose beschworenen Bundessanktionen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Ganz Israel
  rationale: כָל bezeichnet mit dem Eigennamen Israel das Volk in seiner Gesamtheit. „Ganz Israel“ ist im modernen Deutschen natürlich und bewahrt den korporativen Umfang des Bekenntnisses.
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: hat dein Gesetz übertreten
  rationale: עבר bezeichnet mit תּוֹרָה die Übertretung der Bundesweisung. „Gesetz“ passt hier zu den konkreten Bundesbestimmungen; der Singular behandelt Israel als korporative Einheit.
- source_word: וְסוֹר
  choice: und ist davon abgewichen
  rationale: סור bezeichnet das Abweichen oder Sich-Entfernen vom gebotenen Weg. „Davon“ stellt im Deutschen den Bezug auf Gottes Gesetz her, ohne die Wegmetapher unnötig auszubauen.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: ohne auf deine Stimme zu hören
  rationale: Die negative Infinitivkonstruktion beschreibt das unterlassene Hören. Die Formulierung wahrt das hebräische Bild der Stimme und vermeidet die stärkere Deutung „sich weigern“.
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: wurden … über uns ausgegossen
  rationale: נתך bezeichnet hier das Ausgießen eines Gerichts. Die deutsche Passivkonstruktion macht Fluch und Schwur zu den grammatischen Subjekten und bewahrt das konkrete Bild.
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: der Fluch und der Schwur
  rationale: אָלָה ist der Bundesfluch; שְׁבוּעָה bedeutet wörtlich „Schwur/Eid“. Beide Begriffe bleiben getrennt stehen, statt sie deutend zu einem einzigen Ausdruck zu verschmelzen.
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: die im Gesetz des Mose … geschrieben stehen
  rationale: Die feminine Singularform כְּתוּבָה kann sich formal auf אָלָה beziehen, während der Zusammenhang Fluch und Schwur gemeinsam umfasst. Im Deutschen ist der Pluralbezug auf beide vorangehenden Substantive am natürlichsten.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: des Dieners Gottes
  rationale: עֶבֶד ist hier ein Ehrentitel für Mose. Die Genitivfügung gibt die Beziehung knapp und würdig wieder.
- source_word: כִּי חָטָאנוּ לוֹ
  choice: denn wir haben gegen ihn gesündigt
  rationale: חטא mit ל bezeichnet hier das Sündigen gegen jemanden. Der Wechsel von der direkten Anrede „dein“ zu „ihn“ wird entsprechend dem hebräischen Text bewahrt.
theological_decisions:
- issue: Korporative Schuld und Numerus
  choice: Israel wird als korporative Einheit im Singular bezeichnet; anschließend schließt Daniel sich mit „wir“ in das Schuldbekenntnis ein.
  alternative: Pluralische Wiedergabe wie „Alle Israeliten haben …“
  rationale: Der hebräische Plural stellt die Angehörigen Israels gemeinsam als handelndes Volk dar. „Ganz Israel hat“ bewahrt zugleich die nationale Einheit und den Übergang zum einschließenden „wir“.
- issue: Bedeutung von שְׁבוּעָה im Bundeszusammenhang
  choice: „Schwur“ bleibt neben „Fluch“ als eigener Ausdruck im Haupttext stehen.
  alternative: Deutende Zusammenfassung als „beschworener Fluch“
  rationale: Der Kontext verweist wahrscheinlich auf die beschworenen Bundessanktionen des mosaischen Gesetzes. Die getrennte Wiedergabe wahrt jedoch die Wortgestalt und ihre mögliche Spannung, ohne das Verhältnis beider Begriffe festzulegen.
- issue: Wechsel von zweiter zu dritter Person bei Gott
  choice: „dein … deine“ und anschließend „gegen ihn“
  alternative: Angleichung zu „gegen dich“
  rationale: Der auffällige Personenwechsel steht im hebräischen Text. Ihn beizubehalten schützt eine echte textliche Eigenheit vor stillschweigender Harmonisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ganz Israel“, „auf deine Stimme hören“ und „über uns ausgegossen“ sind verständlich, bewahren aber die korporative, akustische und bildhafte Sprache des Hebräischen. Der Fußnotenmarker steht unmittelbar nach „der Fluch und der Schwur“, auf den sich die Alternative tatsächlich bezieht.
