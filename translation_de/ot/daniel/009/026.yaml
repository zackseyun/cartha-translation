id: DAN.9.26
reference: Daniel 9:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: de
  text: Und nach den zweiundsechzig Wochen wird ein Gesalbter[a] abgeschnitten werden, und er wird nichts haben[b]. Das Volk des kommenden Herrschers[c] wird die Stadt und das Heiligtum zerstören. Sein Ende wird mit einer Flut kommen[d], und bis zum Ende wird Krieg sein; Verwüstungen sind beschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Messias«. Das Hebräische lautet wörtlich »ein Gesalbter«; es ist umstritten, ob hier ausdrücklich der Messias gemeint ist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und nichts wird für ihn da sein« beziehungsweise »und niemand wird zu ihm halten«. Die hebräische Wendung ist äußerst knapp und mehrdeutig.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das Volk eines Herrschers, der kommen wird« beziehungsweise »das Volk eines kommenden Fürsten«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »Das Ende davon wird mit einer Flut kommen.« Worauf sich das hebräische Possessivsuffix an »Ende« bezieht, ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: nach den zweiundsechzig Wochen
  rationale: Die Zeitangabe wird direkt wiedergegeben. »Wochen« ist die herkömmliche und lexikalisch vertretbare Übersetzung, lässt aber den für Daniel charakteristischen Sinn von Siebener-Einheiten offen.
- source_word: יִכָּרֵת
  choice: wird … ausgerottet werden
  rationale: Das Nifal von כרת bezeichnet hier ein gewaltsames Abgeschnitten- oder Beseitigtwerden. »Ausgerottet werden« bewahrt im Deutschen den ernsten, gewaltsamen Charakter besser als eine rein bildliche Wiedergabe.
- source_word: מָשִׁיחַ
  choice: ein Gesalbter
  rationale: Das Substantiv steht ohne Artikel und kann allgemein einen Gesalbten bezeichnen. Die Wiedergabe vermeidet es, die umstrittene Identität bereits im Haupttext festzulegen.
- source_word: וְאֵין לוֹ
  choice: und er wird nichts haben
  rationale: Die knappe hebräische Wendung bezeichnet einen Mangel, lässt aber offen, ob Besitz, Unterstützung, Anspruch oder etwas anderes gemeint ist.
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: die Stadt und das Heiligtum
  rationale: »Heiligtum« bezeichnet hier passend den heiligen Tempelbereich und bildet die sachgerechte Parallele zur Stadt.
- source_word: יַשְׁחִית
  choice: wird … zerstören
  rationale: Das Hifil von שׁחת bezeichnet die vernichtende Handlung gegen Stadt und Heiligtum; »zerstören« ist klar und idiomatisch.
- source_word: עַם נָגִיד הַבָּא
  choice: das Volk des kommenden Herrschers
  rationale: נָגִיד bezeichnet einen politischen Führer oder Herrscher. Die attributive Wiedergabe von הַבָּא als »kommenden« bewahrt die knappe Struktur.
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: Sein Ende wird mit einer Flut kommen
  rationale: Das maskuline Singularsuffix wird formal durch »sein« bewahrt, ohne sein umstrittenes Bezugswort festzulegen. »Mit einer Flut« erhält das möglicherweise bildhafte Flutmotiv.
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: und bis zum Ende wird Krieg sein
  rationale: Die Wiedergabe bewahrt den andauernden Krieg bis zum bezeichneten Ende und klingt zugleich natürlich und feierlich.
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: Verwüstungen sind beschlossen
  rationale: Das passive נֶחֱרֶצֶת drückt eine feste Bestimmung aus; שֹׁמֵמוֹת bezeichnet Verwüstungen beziehungsweise Zustände der Verödung.
theological_decisions:
- issue: Ob מָשִׁיחַ im Haupttext ausdrücklich als »Messias« wiederzugeben ist
  choice: ein Gesalbter
  alternative: Messias
  rationale: Da der Ausdruck keinen Artikel trägt und seine konkrete Identität umstritten ist, bleibt der Haupttext lexikalisch transparent. Die messianische Deutung wird in der Fußnote ausdrücklich erhalten.
- issue: Bedeutung der knappen Wendung וְאֵין לוֹ
  choice: und er wird nichts haben
  alternative: und nichts wird für ihn da sein; und niemand wird zu ihm halten
  rationale: Die gewählte Fassung wahrt die Aussage eines völligen Mangels, ohne zwischen Verlust, Verlassenheit und fehlendem Anspruch zu entscheiden.
- issue: Bezugswort des Suffixes in וְקִצּוֹ
  choice: Sein Ende
  alternative: Das Ende davon
  rationale: Die formale Wiedergabe erhält das hebräische Possessivsuffix, während eine Fußnote offenlegt, dass dessen Bezug auf den Herrscher, sein Volk, das Heiligtum beziehungsweise das Zerstörungsgeschehen unterschiedlich verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Ungebräuchliche Archaismen wurden vermieden; die knappen und theologisch umstrittenen Formulierungen des Hebräischen bleiben bewusst offen.
