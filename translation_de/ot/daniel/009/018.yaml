  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: de
  text: Neige dein Ohr, mein Gott, und höre! Öffne deine Augen und sieh unsere Verwüstungen und die Stadt, die nach deinem Namen genannt ist[a]. Denn nicht aufgrund unserer gerechten Taten[b] bringen wir unsere Bitten vor dich, sondern aufgrund deines reichen Erbarmens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »über der dein Name ausgerufen ist«; die hebräische Wendung bezeichnet die Stadt als Gott zugehörig und mit seinem Namen verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »unsere Gerechtigkeiten«; gemeint sind wahrscheinlich gerechte Taten oder eigene Ansprüche auf Gerechtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Neige dein Ohr
  rationale: Bewahrt den konkreten, gehobenen Gebetsausdruck und den Singular des hebräischen Bildes; im modernen Deutschen verständlich.
- source_word: שֹׁמְמֹתֵינוּ
  choice: unsere Verwüstungen
  rationale: Gibt den Plural wieder und lässt sowohl verwüstete Orte als auch den verwüsteten Zustand des Volkes im Blick.
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: über der dein Name ausgerufen ist
  rationale: Bildet die hebräische Wendung relativ eng ab und bewahrt ihre Aussage von Zugehörigkeit und göttlichem Anspruch; eine natürlichere Alternative wäre »die deinen Namen trägt«.
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: bringen wir unsere Bitten vor dich
  rationale: Gibt die hebräische Redewendung sinngemäß und in natürlichem Deutsch wieder; ein wörtliches »lassen ... fallen« wäre missverständlich.
- source_word: צִדְקֹתֵינוּ
  choice: unsere gerechten Taten
  rationale: Der hebräische Plural bezeichnet hier wahrscheinlich eigene Gerechtigkeitserweise oder Ansprüche; »gerechte Taten« ist verständlicher als das im Deutschen unübliche »Gerechtigkeiten«.
- source_word: רַחֲמֶיךָ הָרַבִּים
  choice: deine große Barmherzigkeit
  rationale: Natürliches deutsches Kollektiv für den hebräischen Plural und רבּים; die Fülle des göttlichen Erbarmens bleibt ausgedrückt.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Ohr und Augen
  choice: Die körperlichen Bilder werden direkt beibehalten.
  alternative: Paraphrase wie »höre aufmerksam zu und nimm wahr«
  rationale: Die Bildsprache prägt Dringlichkeit und Haltung des Gebets und soll nicht erklärend aufgelöst werden.
- issue: Grundlage der Bitte
  choice: Der eigene Anspruch aufgrund gerechter Taten wird verneint; Gottes Barmherzigkeit ist die Grundlage.
  alternative: Allgemeine Paraphrase über menschliche Unwürdigkeit
  rationale: Der ausdrückliche Gegensatz des hebräischen Textes zwischen צִדְקֹתֵינוּ und רַחֲמֶיךָ bleibt erhalten, ohne zusätzliche Lehrbegriffe einzuführen.
- issue: Bedeutung der Namensformel über der Stadt
  choice: Die nahe, mehrdeutige Formulierung »über der dein Name ausgerufen ist« bleibt im Text.
  alternative: »die deinen Namen trägt«
  rationale: Die gewählte Fassung bewahrt Zugehörigkeit, Benennung und göttlichen Anspruch, ohne die hebräische Formel auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Imperative bewahren die Dringlichkeit des Gebets. Die Fußnotenmarker [a] und [b] stehen unmittelbar an den erklärungsbedürftigen Wendungen.
