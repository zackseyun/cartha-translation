  to: Neige dein Ohr, mein Gott, und höre! Öffne deine Augen und sieh unsere Verwüstungen und die Stadt, die nach deinem Namen genannt ist[a]. Denn nicht aufgrund unserer gerechten Taten[b] bringen wir unsere Bitten vor dich, sondern aufgrund deines reichen Erbarmens.
