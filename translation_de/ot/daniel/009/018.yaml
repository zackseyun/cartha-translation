  verdict: revise
  source_fidelity: Die Imperative, die anthropomorphe Bildsprache, der Plural »unsere Verwüstungen«, die Verneinung einer Berufung auf eigene Gerechtigkeit und die Begründung mit Gottes Erbarmen sind im Kern zutreffend wiedergegeben. Die Namensformel wird jedoch mit »ausgerufen« im Deutschen semantisch zu eng bzw. missverständlich erfasst; sie bezeichnet die Stadt als nach Gottes Namen genannt bzw. seinem Namen zugeordnet. »Große Barmherzigkeit« glättet zudem den Plural und die Aussage von רבּים stärker als nötig.
