base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: de
  text: 'Er gab mir Verständnis[a], redete mit mir und sagte: »Daniel, jetzt bin ich hervorgegangen[b], um dir Einsicht und Verständnis zu geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ließ mich verstehen.« Das hebräische Verb hat hier kausativen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bin ich ausgegangen«; aus Daniels Blickrichtung auch: »bin ich gekommen«. Das hebräische Verb bedeutet wörtlich »hinausgehen, herauskommen«; Ausgangspunkt und Blickrichtung bleiben unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Er ließ mich verstehen
  rationale: 'Die Form wird im Zusammenhang am besten kausativ verstanden: Der Bote bewirkte, dass Daniel verstand. Die Wiedergabe bleibt nah an der hebräischen Verbform.'
- source_word: וַיְדַבֵּר עִמִּי
  choice: redete mit mir
  rationale: Das ausdrückliche עִם wird mit »mit mir« wiedergegeben; dies ist zugleich natürliches Deutsch.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Übliche erzählende Form zur Einführung direkter Rede.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Gebräuchliche deutsche Form des Eigennamens.
- source_word: עַתָּה
  choice: jetzt
  rationale: Gibt das Zeitadverb knapp und idiomatisch wieder.
- source_word: יָצָאתִי
  choice: bin ich ausgegangen
  rationale: Bewahrt die räumlich offene Grundbedeutung von יצא, ohne den Ausgangspunkt oder die Blickrichtung stillschweigend festzulegen.
- source_word: לְהַשְׂכִּילְךָ
  choice: um dir Einsicht ... zu geben
  rationale: 'Gibt den kausativen Sinn wieder: Daniel soll zu Einsicht gebracht werden.'
- source_word: בִינָה
  choice: Verständnis
  rationale: Eine klare und natürliche Entsprechung für בינה; zusammen mit »Einsicht« bleibt die im Hebräischen vorhandene begriffliche Paarung erhalten.
theological_decisions:
- issue: Ausgangspunkt und Blickrichtung von יָצָאתִי
  choice: jetzt bin ich ausgegangen
  alternative: jetzt bin ich gekommen / hervorgegangen
  rationale: Der Vers nennt den Ausgangspunkt nicht ausdrücklich. Die Übersetzung bewahrt deshalb die deiktische Offenheit des hebräischen Verbs und deutet die Sendung des Sprechers nicht näher aus, als der Text es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Erzählstil; »Einsicht und Verständnis« erhält die begriffliche Doppelung des Ausgangstextes.
