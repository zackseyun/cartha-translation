source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֤כֶת בְּ/תֽוֹרֹתָי/ו֙ אֲשֶׁ֣ר נָתַ֣ן לְ/פָנֵ֔י/נוּ בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: de
  text: Und wir haben nicht auf die Stimme Jahwes, unseres Gottes, gehört und nicht nach seinen Weisungen gelebt, die er uns durch seine Diener, die Propheten, vorgelegt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand seiner Diener, der Propheten“; „durch die Hand“ ist eine hebräische Wendung für Vermittlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: auf die Stimme … gehört
  rationale: Die Verbindung שׁמע בקול bezeichnet ein Hören, das Gehorsam einschließt. Die deutsche Wendung bewahrt sowohl das Bild der Stimme als auch den Zusammenhang mit dem folgenden unterlassenen Lebenswandel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Wörtliche und natürliche Wiedergabe des Substantivs mit dem Suffix der ersten Person Plural.
- source_word: לָלֶכֶת בְּתוֹרֹתָיו
  choice: und sind nicht nach seinen Weisungen gelebt
  rationale: Das hebräische Bild des Gehens bezeichnet die Lebensführung. Im Deutschen gibt „nach … leben“ dieses Bild idiomatisch wieder; „Weisungen“ wahrt die Breite von תּוֹרָה besser als das engere „Gesetze“.
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: die er uns … vorgelegt hat
  rationale: Das Hebräische bedeutet wörtlich, etwas vor jemanden zu geben; „vorlegen“ vermittelt das zugängliche und verbindliche Darbieten.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: durch seine Diener, die Propheten
  rationale: ביד ist hier ein Idiom für Vermittlung oder Beauftragung. „Durch“ ist im modernen Deutsch klar; die wörtliche Form wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutungsumfang des Plurals תּוֹרֹתָיו
  choice: seine Weisungen
  alternative: seine Gesetze
  rationale: תּוֹרָה kann Gesetz, Unterweisung oder Weisung bezeichnen. Der Plural meint hier die durch die Propheten vermittelten göttlichen Vorgaben; „Weisungen“ lässt diesen Umfang offen, ohne den verpflichtenden Charakter abzuschwächen.
- issue: Verhältnis des Infinitivs לָלֶכֶת zum Nicht-Hören
  choice: als koordinierte Folge des Ungehorsams wiedergegeben
  alternative: „um nach seinen Weisungen zu leben“
  rationale: Der Infinitiv erläutert, worin das Hören beziehungsweise Gehorchen hätte bestehen sollen. Die koordinierte deutsche Form macht den negativen Sinn eindeutig, ohne eine bloße Zweckangabe zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auf die Stimme hören“ bewahrt die persönliche Dimension des hebräischen Ausdrucks; „nach seinen Weisungen leben“ gibt die Metapher des Gehens natürlich wieder. Der Fußnotenmarker steht am Satzende, da sich die Erläuterung auf die abschließende Vermittlungsformel bezieht.
