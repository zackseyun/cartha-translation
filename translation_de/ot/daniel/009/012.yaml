  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: de
  text: Er hat seine Worte erfüllt, die er gegen uns und gegen unsere Richter, die uns richteten,[a] gesprochen hatte, indem er großes Unheil über uns gebracht hat, wie es unter dem ganzen Himmel nie geschehen war, wie es Jerusalem widerfahren ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Herrscher, die über uns herrschten“, oder: „unsere Regierenden, die uns regierten“. Die hebräischen Wörter können neben richterlicher Tätigkeit auch allgemein die Ausübung staatlicher Herrschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Er hat … wahr gemacht
  rationale: Das Hifil von קום bezeichnet bei Worten deren Bestätigung beziehungsweise Erfüllung. „Wahr gemacht“ drückt natürlich aus, dass das angekündigte Gericht tatsächlich eintrat.
- source_word: דבריו
  choice: seine Worte
  rationale: Der Plural mit Suffix wird formal und verständlich als „seine Worte“ wiedergegeben.
- source_word: דִּבֶּר עָלֵינוּ
  choice: gegen uns … gesprochen hatte
  rationale: דבר mit על hat hier im Gerichtskontext adversative Bedeutung; „gegen uns“ bewahrt diese Stoßrichtung.
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: unsere Richter, die über uns richteten
  rationale: Die Wiedergabe erhält die hebräische Wortwiederholung und lässt durch „über uns“ zugleich die mögliche Bedeutung amtlicher Herrschaft anklingen.
- source_word: לְהָבִיא עָלֵינוּ
  choice: indem er … über uns brachte
  rationale: Der Infinitiv kann die Art und Weise beziehungsweise das Mittel bezeichnen, durch das Gottes Worte wahr wurden.
- source_word: רָעָה גְדֹלָה
  choice: großes Unheil
  rationale: רעה bezeichnet in diesem Gerichtszusammenhang nicht moralische Bosheit, sondern schweres Unheil oder eine Katastrophe.
- source_word: אֲשֶׁר לֹא נֶעֶשְׂתָה
  choice: wie es … noch nie geschehen war
  rationale: Die Formulierung gibt den vergleichenden Sinn und die behauptete Einzigartigkeit des Unheils in idiomatischem Deutsch wieder.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: unter dem ganzen Himmel
  rationale: Die hebräische Wendung wird traditionsnah und im Deutschen verständlich als umfassende Ortsangabe wiedergegeben.
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: so wie es in Jerusalem geschehen ist
  rationale: Das unpersönliche „es“ nimmt das zuvor genannte Unheil auf und gibt die passive hebräische Form natürlich wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verses
  choice: Das Pronomen „Er“ bezeichnet Gott, ohne den Namen ausdrücklich einzufügen.
  alternative: „Gott hat seine Worte wahr gemacht“
  rationale: Der Gebetskontext weist eindeutig auf Gott als Handelnden, doch der hebräische Vers nennt ihn an dieser Stelle nicht ausdrücklich. Das Pronomen bewahrt diese Textgestalt.
- issue: Bedeutungsumfang von שפט
  choice: „Richter, die über uns richteten“ im Haupttext, mit breiterer Amtsbedeutung in der Fußnote
  alternative: „Herrscher, die über uns herrschten“
  rationale: Die hebräische Wortwurzel kann sowohl richterliches als auch allgemeineres regierendes Handeln bezeichnen. Haupttext und Fußnote bewahren diese Mehrdeutigkeit, ohne sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Hebräischen, wird aber durch idiomatische Verbformen geglättet. Die bewusste Wiederholung bei „Richter/richteten“ hält die lexikalische Spannung des Ausgangstextes fest.
