  terminology: „Großes Unheil“ ist für רָעָה גְדֹלָה im Kontext treffend. „Richter, die uns richteten“ bewahrt die hebräische Wortwiederholung; die Fußnote erläutert angemessen, dass die Begriffe auch umfassendere Amtsträger bezeichnen können.
