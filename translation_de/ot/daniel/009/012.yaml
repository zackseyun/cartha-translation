revisions:
- from: Er hat seine Worte wahr gemacht, die er gegen uns und gegen unsere Richter, die über uns richteten,[a] gesprochen hatte, indem er großes Unheil über uns brachte, wie es unter dem ganzen Himmel noch nie geschehen war, so wie es in Jerusalem geschehen ist.
  to: Er hat seine Worte erfüllt, die er gegen uns und gegen unsere Richter, die uns richteten,[a] gesprochen hatte, indem er großes Unheil über uns gebracht hat, wie es unter dem ganzen Himmel nie geschehen war, wie es Jerusalem widerfahren ist.
  rationale: Die Revision stellt das direkte Objekt in der Wiederholung von „Richter/richteten“ wieder her, glättet die Tempusführung und ersetzt die schwerfällige Schlusswiederholung durch die im Deutschen natürliche Wendung „Jerusalem widerfahren ist“. Dabei bleiben Gottes unausgesprochenes Subjekt, die Wiederholung der Wurzel שפט, der Sinn von רָעָה als Unheil und die außergewöhnliche Schwere des Geschehens erhalten.
