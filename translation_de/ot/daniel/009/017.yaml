source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: de
  text: Und nun höre, unser Gott, auf das Gebet deines Dieners und auf sein Flehen um Erbarmen, und lass dein Angesicht leuchten über deinem Heiligtum, das verwüstet daliegt – um des Herrn willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um deiner selbst willen, Herr“. Im Hebräischen steht innerhalb der direkten Anrede wörtlich „um des Herrn willen“, wobei der Gottestitel in der dritten Person gebraucht wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlich-folgernden Übergang zur erneuten Bitte.
- source_word: שְׁמַע אֱלֹהֵינוּ
  choice: höre, unser Gott
  rationale: Gibt die direkte Gebetsanrede schlicht und würdig wieder.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: das Gebet deines Dieners
  rationale: Bewahrt die hebräische Genitivverbindung und den demütigen Selbstausdruck Daniels.
- source_word: תַּחֲנוּנָיו
  choice: sein Flehen um Erbarmen
  rationale: Vermittelt sowohl die Eindringlichkeit der Bitten als auch deren Ausrichtung auf göttliche Gnade.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: lass dein Angesicht leuchten
  rationale: Bewahrt das biblische Segensbild göttlicher Zuwendung in natürlichem, gehobenem Deutsch.
- source_word: עַל מִקְדָּשְׁךָ הַשָּׁמֵם
  choice: über deinem Heiligtum, das verwüstet daliegt
  rationale: „Heiligtum“ erhält die Breite von מִקְדָּשׁ; der Relativsatz bringt den Zustand des verwüsteten Heiligtums klar zum Ausdruck.
- source_word: לְמַעַן אֲדֹנָי
  choice: um des Herrn willen
  rationale: Bewahrt die auffällige Gottesbezeichnung in der dritten Person innerhalb der direkten Anrede, statt sie stillschweigend zu glätten.
theological_decisions:
- issue: Göttliche Selbstreferenz in לְמַעַן אֲדֹנָי
  choice: um des Herrn willen
  alternative: um deiner selbst willen, Herr
  rationale: Der hebräische Wortlaut verwendet אֲדֹנָי als Titel in der dritten Person. Der Haupttext erhält diese rhetorische Besonderheit; die im Deutschen naheliegende direkte Anrede wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute biblische Wendung „dein Angesicht leuchten lassen“ bleibt erhalten; „Flehen um Erbarmen“ ist verständlicher als das fachsprachliche „Flehrufe“ oder „Bittgebete“.
