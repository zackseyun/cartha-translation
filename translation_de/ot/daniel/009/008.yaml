source:
  edition: WLC
  text: יְהוָ֗ה לָ֚/נוּ בֹּ֣שֶׁת הַ/פָּנִ֔ים לִ/מְלָכֵ֥י/נוּ לְ/שָׂרֵ֖י/נוּ וְ/לַ/אֲבֹתֵ֑י/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: de
  text: HERR, Schande liegt auf uns[a] – auf unseren Königen, auf unseren Würdenträgern und auf unseren Vorfahren[b] –, weil wir gegen dich gesündigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schande des Gesichts“; eine hebräische Wendung für sichtbare Beschämung oder öffentliche Demütigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unseren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ wiedergegeben; im Gebetszusammenhang steht er als direkte Anrede.
- source_word: לָנוּ
  choice: liegt auf uns
  rationale: Die Präposition mit Suffix bezeichnet hier die Zuordnung der Schande zum Volk. „Liegt auf uns“ gibt diese nominale Aussage im Deutschen klar und natürlich wieder.
- source_word: בֹּשֶׁת הַפָּנִים
  choice: Schande
  rationale: Die wörtliche Wendung „Schande des Gesichts“ bezeichnet sichtbare Beschämung beziehungsweise öffentliche Demütigung. Im Haupttext steht die natürliche deutsche Entsprechung; das konkrete hebräische Bild bleibt in der Fußnote erhalten.
- source_word: לִמְלָכֵינוּ
  choice: auf unseren Königen
  rationale: Die wiederholte Präposition ordnet dieselbe Schande auch den Königen zu; die Wiederholung von „auf“ bewahrt die parallele Struktur.
- source_word: לְשָׂרֵינוּ
  choice: auf unseren führenden Männern
  rationale: שָׂרִים bezeichnet hochgestellte politische oder militärische Führer. „Führende Männer“ ist im Zusammenhang verständlich und vermeidet die im heutigen Deutsch enger dynastische Bedeutung von „Fürsten“.
- source_word: וְלַאֲבֹתֵינוּ
  choice: und auf unseren Vorfahren
  rationale: אָבוֹת bedeutet wörtlich „Väter“, bezeichnet hier aber die früheren Generationen. „Vorfahren“ gibt den gemeinten Bezug natürlich wieder; die wörtliche Form wird in einer Fußnote genannt.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort leitet hier den Grund für die Schande ein und wird daher kausal wiedergegeben.
- source_word: חָטָאנוּ
  choice: wir gesündigt haben
  rationale: Das hebräische Perfekt fasst die begangene Schuld als feststehende, gegenwärtig relevante Tatsache zusammen; das deutsche Perfekt passt zum Bekenntnisgebet.
- source_word: לָךְ
  choice: gegen dich
  rationale: Bei חטא bezeichnet ל die von der Sünde betroffene Person; idiomatisches Deutsch verlangt „gegen jemanden sündigen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: „HERR“ folgt der etablierten deutschen Bibelkonvention für den Gottesnamen, ohne eine unsichere Rekonstruktion seiner Aussprache in den Haupttext zu setzen.
- issue: Kollektives Schuldbekenntnis
  choice: „weil wir gegen dich gesündigt haben“ bleibt uneingeschränkt kollektiv formuliert
  alternative: Einschränkung der Schuld auf Könige, Führungspersonen oder Vorfahren
  rationale: Der hebräische Text verbindet alle genannten Gruppen durch das gemeinsame „wir“ und löst die Spannung zwischen persönlicher und gemeinschaftlicher Verantwortung nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „auf“ bildet die hebräische Reihung ab, ohne steif zu wirken. Der Gedankenstrich markiert die eingeschobene Aufzählung; die Aussage bleibt als Gebetsanrede unmittelbar und feierlich.
