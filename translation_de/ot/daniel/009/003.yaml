  rationale: Die Revision glättet ausschließlich die deutsche Ausdrucksweise der abschließenden Umstandsangabe und verwendet mit „in Sack und Asche“ die natürliche, zugleich quellennah bildhafte Formulierung. Die explizite Bezugnahme auf Gott als Ziel des Suchens bleibt bestehen, da sie im Kontext begründet und im Deutschen zur klaren Satzführung hilfreich ist.
