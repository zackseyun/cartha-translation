base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: de
  text: Da wandte ich mein Angesicht Gott, dem Herrn, zu[a], um ihn mit Gebet und Flehen um Erbarmen zu suchen, mit Fasten, in Sack[b] und Asche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da richtete/setzte ich mein Angesicht auf Gott, den Herrn.“ Die hebräische Wendung bezeichnet eine entschlossene Hinwendung.'
    reason: lexical_alternative
  - marker: b
    text: '„Sack“ bezeichnet ein grobes Trauergewand, das als Zeichen von Trauer, Demütigung oder Buße getragen wurde; auch: „Sacktuch“.'
    reason: cultural_clarification
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי אֶל
  choice: Da wandte ich mein Angesicht … zu
  rationale: Die Wendung bedeutet wörtlich, das eigene Angesicht auf jemanden zu richten, und drückt bewusste, entschlossene Hinwendung aus. Die konkrete Bildsprache bleibt erhalten, während „zuwenden“ im Deutschen natürlich klingt.
- source_word: אֲדֹנָי הָאֱלֹהִים
  choice: Gott, dem Herrn
  rationale: Die Wiedergabe bewahrt beide Gottesbezeichnungen. „Herr“ steht hier für אֲדֹנָי, nicht für den Gottesnamen JHWH; deshalb wird kein typografisch hervorgehobenes „HERR“ verwendet.
- source_word: לְבַקֵּשׁ
  choice: um ihn … zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck der Hinwendung. Das im Hebräischen nicht eigens ausgedrückte Objekt ergibt sich aus dem unmittelbar vorausgehenden Bezug auf Gott; im Deutschen vermeidet „ihn“ die missverständliche Aussage, Daniel habe nach einem Gebet gesucht.
- source_word: תְּפִלָּה
  choice: Gebet
  rationale: Das allgemeine Wort für Gebet wird schlicht und verständlich wiedergegeben.
- source_word: וְתַחֲנוּנִים
  choice: Flehen um Erbarmen
  rationale: Der Plural bezeichnet inständige Bitten um Gunst oder Erbarmen. Die Formulierung vermittelt sowohl Demut als auch Dringlichkeit.
- source_word: בְּצוֹם
  choice: unter Fasten
  rationale: Die Präposition bezeichnet hier einen begleitenden Umstand; die Formulierung fügt sich natürlich in die Reihe der Zeichen von Buße und Demütigung ein.
- source_word: וְשַׂק
  choice: in Sacktuch
  rationale: „Sacktuch“ bezeichnet den groben Stoff beziehungsweise das daraus gefertigte Buß- und Trauergewand und bewahrt die konkrete kulturelle Bildsprache.
- source_word: וָאֵפֶר
  choice: und Asche
  rationale: Asche ist hier Zeichen der Trauer, Demütigung und Buße; der deutsche Singular ist in der festen Verbindung „Sacktuch und Asche“ idiomatisch.
theological_decisions:
- issue: Gottesbezeichnung אֲדֹנָי הָאֱלֹהִים
  choice: Gott, dem Herrn
  alternative: dem Herrn, Gott
  rationale: Die Wortfolge wird für natürliches Deutsch umgestellt, ohne einen der beiden Titel auszulassen. Da אֲדֹנָי und nicht JHWH steht, wäre „der HERR“ sachlich irreführend.
- issue: Nicht ausdrücklich genanntes Objekt von לְבַקֵּשׁ
  choice: um ihn … zu suchen
  alternative: um mit Gebet und Flehen zu suchen
  rationale: Grammatisch kann die knappe hebräische Konstruktion formal ohne ausgedrücktes Objekt wiedergegeben werden. Im Zusammenhang ist Gott jedoch das Ziel der Suche; das Pronomen macht diese implizite Beziehung im Deutschen verständlich, ohne einen zusätzlichen theologischen Gehalt einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. „Angesicht“ und „Sacktuch“ sind leicht gehoben, bleiben aber verständlich und tragen die konkrete Ausdrucksweise des Hebräischen besser als rein abstrakte Umschreibungen.
