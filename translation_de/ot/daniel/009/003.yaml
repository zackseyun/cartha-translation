  source_fidelity: 'Die Grundbedeutung wird getroffen: Daniel richtet sich entschlossen an Adonai, den Gott, und tut dies mit Gebet, inständigem Flehen sowie den begleitenden Zeichen Fasten, Sack und Asche. Das ergänzte „ihn“ ist als kontextuell impliziertes Objekt vertretbar. Die Wiedergabe der Gebetsmittel mit „mit“ ist jedoch näher an der hebräischen Reihung als die uneinheitliche Konstruktion „unter …, in … und …“.'
  naturalness: „Unter Fasten, in Sacktuch und Asche“ klingt im modernen Standarddeutsch syntaktisch uneinheitlich und weniger idiomatisch. „Mit Fasten, in Sack und Asche“ ist klar, würdig und als feste biblische Ausdrucksweise geläufig. Auch „Sack“ ist hier die übliche deutsche Bezeichnung für das Trauergewand; „Sacktuch“ bezeichnet eher das Material.
  terminology: „Herr“ für אֲדֹנָי ist sachgerecht und darf nicht als „HERR“ (JHWH-Konvention) gesetzt werden. „Gebet und Flehen um Erbarmen“ gibt die Abstufung von תְּפִלָּה und תַּחֲנוּנִים angemessen wieder. „Sack und Asche“ bewahrt die konkreten rituellen Zeichen ohne konfessionelle Ausdeutung.
