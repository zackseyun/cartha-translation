  text: בִּ/שְׁנַ֣ת אַחַ֗ת לְ/דָרְיָ֛וֶשׁ בֶּן אֲחַשְׁוֵר֖וֹשׁ מִ/זֶּ֣רַע מָדָ֑י אֲשֶׁ֣ר הָמְלַ֔ךְ עַ֖ל מַלְכ֥וּת כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
translation:
  language: de
  text: Im ersten Jahr des Darius, des Sohnes Ahasveros, der medischer Abstammung war und über das Reich der Chaldäer[a] zum König eingesetzt wurde –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Babylonier«. »Chaldäer« entspricht der hebräischen Bezeichnung, kann hier aber das babylonische Reich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  choice: Im ersten Jahr
  rationale: Die Zeitangabe mit der Kardinalzahl bezeichnet idiomatisch das erste Regierungsjahr; diese Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: לְדָרְיָוֶשׁ
  choice: des Darius
  rationale: Das Präfix לְ kennzeichnet in dieser Datierungsformel die Zuordnung des Jahres zu Darius.
- source_word: בֶּן אֲחַשְׁוֵרוֹשׁ
  choice: des Sohnes des Ahasveros
  rationale: בֶּן bezeichnet hier unmittelbar die Sohnschaft; die Namen werden in ihrer gebräuchlichen deutschen Bibelform wiedergegeben.
- source_word: מִזֶּרַע מָדָי
  choice: der von medischer Abstammung war
  rationale: זֶרַע bezeichnet hier Herkunft beziehungsweise Abstammung, nicht wörtlich Samen oder einzelne Nachkommen. Die deutsche Formulierung gibt den genealogisch-ethnischen Sinn natürlich wieder.
- source_word: הָמְלַךְ
  choice: zum König … eingesetzt worden war
  rationale: Die Hofal-Form ist kausativ-passiv und besagt, dass Darius die Königsherrschaft übertragen wurde; „eingesetzt“ bewahrt diese Nuance.
- source_word: עַל מַלְכוּת
  choice: über das Reich
  rationale: מַלְכוּת bezeichnet hier das beherrschte Reich, während עַל den Herrschaftsbereich markiert.
- source_word: כַּשְׂדִּים
  choice: der Chaldäer
  rationale: Die Hauptübersetzung bewahrt die hebräische Volksbezeichnung; im Kontext kann sie zugleich das babylonische Reich bezeichnen.
