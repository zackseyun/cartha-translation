base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: de
  text: Wir haben gesündigt und Unrecht getan[a], wir haben böse gehandelt und uns aufgelehnt; wir sind von deinen Geboten und deinen Rechtsbestimmungen[b] abgewichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: uns schuldig gemacht. Das hebräische Verb kann verkehrtes, schuldhaftes oder verdrehtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: deinen Urteilen. Das hebräische Wort kann Urteile, Rechtssätze oder verbindliche Ordnungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Wir haben gesündigt
  rationale: Das Qal Perfekt 1. Person Plural von חטא ist das übliche Verb für moralisches Sündigen. Das deutsche Perfekt gibt den rückblickenden Charakter des Bekenntnisses natürlich wieder.
- source_word: וְעָוִינוּ
  choice: und Unrecht getan
  rationale: Das Verb עוה bezeichnet schuldhaftes, verkehrtes oder verdrehtes Handeln. „Unrecht getan“ ist gegenwärtiges, verständliches Deutsch und bleibt vom allgemeineren „gesündigt“ unterscheidbar.
- source_word: וְהִרְשַׁעְנוּ
  choice: wir haben gottlos gehandelt
  rationale: Die Hifil-Form von רשע bezeichnet böses oder frevelhaftes Handeln. „Gottlos gehandelt“ bewahrt den aktiven verbalen Sinn und passt zum Gebetskontext, ohne die vorhergehenden Bekenntniswörter einzuebnen.
- source_word: וּמָרָדְנוּ
  choice: und uns aufgelehnt
  rationale: מרד bedeutet „sich auflehnen, rebellieren“. Die reflexive deutsche Wendung ist natürlich und bringt den bewussten Widerstand gegen Gott zum Ausdruck.
- source_word: וְסוֹר
  choice: wir sind … abgewichen
  rationale: Die Form von סור führt das Bekenntnis mit dem Gedanken des Abweichens fort. Ein eigener deutscher Hauptsatz nach dem Semikolon gibt den Sinn idiomatisch wieder.
- source_word: מִמִּצְוֺתֶיךָ
  choice: von deinen Geboten
  rationale: מִצְוָה bezeichnet ein Gebot. „Gebote“ bewahrt den bundesbezogenen und schriftgemäßen Sprachklang und ist allgemein verständlich.
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: und deinen Rechtsbestimmungen
  rationale: מִשְׁפָּט kann Urteile, Rechtssätze oder verbindliche Bestimmungen bezeichnen. „Rechtsbestimmungen“ wahrt den rechtlichen Gehalt und klingt im modernen Deutschen natürlicher als „Rechtssprüche“.
theological_decisions:
- issue: Die gehäufte Folge verschiedener Bekenntnisverben
  choice: 'Jedes Glied wird eigens wiedergegeben: gesündigt, Unrecht getan, gottlos gehandelt, sich aufgelehnt, abgewichen.'
  alternative: Die Folge zu einer kürzeren Aussage wie „Wir haben gesündigt, Böses getan und uns gegen dich aufgelehnt“ zusammenziehen.
  rationale: Der hebräische Text häuft verwandte, aber nicht identische Begriffe an und steigert so das Schuldbekenntnis. Diese rhetorische und theologische Spannung soll nicht durch eine glättende Zusammenfassung verloren gehen.
- issue: Bedeutungsbreite von מִשְׁפָּטִים
  choice: Rechtsbestimmungen
  alternative: Urteile; Rechtssprüche; Satzungen
  rationale: Der Ausdruck hat rechtliche und richterliche Bedeutungsanteile. „Rechtsbestimmungen“ lässt den rechtlichen Charakter erkennen, ohne die Bedeutung ausschließlich auf einzelne Gerichtsurteile festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch für ein gemeinschaftliches Schuldbekenntnis. Die Wiederholung von „wir haben“ und der Einschnitt durch das Semikolon erhalten die feierliche Häufung, ohne altertümlich zu klingen.
