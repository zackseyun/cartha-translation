  text: וָֽ/אֶתְפַּֽלְלָ֛/ה לַ/יהוָ֥ה אֱלֹהַ֖/י וָ/אֶתְוַדֶּ֑ה וָ/אֹֽמְרָ֗/ה אָנָּ֤א אֲדֹנָ/י֙ הָ/אֵ֤ל הַ/גָּדוֹל֙ וְ/הַ/נּוֹרָ֔א שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: de
  text: 'Und ich betete zu Yahweh, meinem Gott, bekannte meine Schuld und sagte: „Bitte, Herr, du großer und furchtgebietender Gott,[a] der den Bund und die beständige Liebe[b] denen bewahrt, die ihn lieben und seine Gebote halten,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet jemanden, der ehrfürchtige Furcht hervorruft; auch: „Ehrfurcht gebietender Gott“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bundestreue“ beziehungsweise „Güte“. Das hebräische חֶסֶד bezeichnet hier verlässliche Liebe, Barmherzigkeit und Treue im Rahmen des Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: Und ich betete
  rationale: Das Wayyiqtol führt die Erzählfolge fort; das deutsche Präteritum gibt die abgeschlossene Handlung natürlich wieder.
- source_word: לַיהוָה אֱלֹהַי
  choice: zu Yahweh, meinem Gott
  rationale: Die Präposition bezeichnet den Adressaten des Gebets; der Gottesname und das ausdrückliche Possessivsuffix werden bewahrt.
- source_word: וָאֶתְוַדֶּה
  choice: bekannte meine Schuld
  rationale: Das Hitpael von ידה bezeichnet hier im Bußgebet ein Sündenbekenntnis. Das ergänzte Objekt macht diesen Sinn im Deutschen klar, ohne den Inhalt auf einzelne Sünden einzuengen.
- source_word: אָנָּא אֲדֹנָי
  choice: Ach, Herr
  rationale: אָנָּא ist eine eindringliche Bitte beziehungsweise flehentliche Anrede. „Ach“ klingt in einem feierlichen Gebet natürlicher als das wörtlichere „bitte“.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: du großer und furchtgebietender Gott
  rationale: Die direkte Anrede wird mit „du“ idiomatisch gestaltet. „Furchtgebietend“ bewahrt den Sinn ehrfürchtiger Furcht und vermeidet die umgangssprachliche Abschwächung von „großartig“.
- source_word: שֹׁמֵר הַבְּרִית
  choice: der den Bund … bewahrt
  rationale: Das Partizip beschreibt Gottes bleibendes, kennzeichnendes Handeln. „Bewahren“ passt sowohl zum Bund als auch zur parallel verbundenen Liebe.
- source_word: הַחֶסֶד
  choice: die beständige Liebe
  rationale: חֶסֶד umfasst hier verlässliche, bundestreue Liebe und Güte; „beständige Liebe“ hält die relationale und die treuebezogene Dimension zusammen.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: denen, die ihn lieben und seine Gebote halten
  rationale: Die beiden substantivierten Partizipialgruppen werden als natürlicher deutscher Relativsatz wiedergegeben; die Parallelität bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Transliteration wahrt den persönlichen Bundesnamen und unterscheidet ihn von אֲדֹנָי, das unmittelbar danach mit „Herr“ wiedergegeben wird.
- issue: Bedeutungsumfang von חֶסֶד im Bundeskontext
  choice: beständige Liebe
  alternative: Bundestreue / Güte
  rationale: Die Formulierung bewahrt sowohl den Beziehungscharakter der Liebe als auch ihre Verlässlichkeit. Eine Fußnote weist auf die ebenfalls vorhandenen Nuancen von Bundestreue und Güte hin.
- issue: Adressaten von Bund und חֶסֶד
  choice: denen … bewahrt
  alternative: gegenüber denen er … bewahrt
  rationale: Die Präposition ל kann den Personenkreis bezeichnen, dem Gottes Bundestreue gilt. Die knappe Form wahrt die hebräische Konstruktion, ohne eine weitergehende systematische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. Der Satz bleibt wie im hebräischen Kontext offen, da das Gebet im folgenden Vers weitergeht. Die Gottesbezeichnungen „Yahweh“ und „Herr“ werden entsprechend der Unterscheidung zwischen יהוה und אֲדֹנָי getrennt wiedergegeben.
