  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder; „mein Gott“ und „heiliger Berg“ sind treffend. „Flehen“ und „bekannte“ passen zum gehobenen, aber modernen Register. Die Fußnoten erläutern sowohl das hebräische Bild als auch den historischen Bezug, ohne ihn dem Haupttext aufzuzwingen.
