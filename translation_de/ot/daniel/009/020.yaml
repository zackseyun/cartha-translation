source:
  edition: WLC
  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: de
  text: Während ich noch redete und betete, meine Sünde und die Sünde meines Volkes Israel bekannte und mein Flehen vor Jahwe, meinem Gott, für den heiligen Berg meines Gottes vorbrachte[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mein Flehen vor Jahwe fallen ließ“. Gemeint ist, dass Daniel sein Flehen oder seine Bitte vor Gott bringt.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „heiligen Berg meines Gottes“ ist Zion beziehungsweise Jerusalem gemeint, der Ort des Heiligtums Gottes.
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר וּמִתְפַּלֵּל
  choice: Während ich noch redete und betete
  rationale: Die temporale Wendung gibt die noch andauernde Handlung der hebräischen Partizipien in natürlichem Deutsch wieder.
- source_word: וּמִתְוַדֶּה חַטָּאתִי
  choice: meine Sünde … bekannte
  rationale: Das Hitpael von ידה bezeichnet mit „Sünde“ als Objekt das Bekennen; „bekannte“ wahrt den gehobenen, aber verständlichen Ton.
- source_word: וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: und die Sünde meines Volkes Israel
  rationale: Die Konstruktion und die Apposition „Israel“ werden unmittelbar und natürlich wiedergegeben.
- source_word: וּמַפִּיל תְּחִנָּתִי לִפְנֵי
  choice: und mein Flehen vor … vorbrachte
  rationale: Wörtlich wird das Flehen „vor“ Gott „fallen gelassen“; „vorbringen“ gibt diese Gebetswendung idiomatisch wieder, während die Fußnote das Sprachbild festhält.
- source_word: יְהוָה אֱלֹהַי
  choice: Jahwe, meinem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „meinem Gott“ steht als Apposition nach der von „vor“ geforderten Dativform.
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: für den heiligen Berg meines Gottes
  rationale: עַל bezeichnet hier den Gegenstand beziehungsweise das Anliegen des Flehens. „Für“ ist im deutschen Gebetskontext natürlich, ohne den Berg mit Jerusalem/Zion bereits im Haupttext auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diesen Unterschied gegenüber אֱלֹהַי („mein Gott“).
- issue: Bezug des „heiligen Berges“
  choice: im Haupttext nicht ausdrücklich als Zion/Jerusalem identifiziert
  alternative: für Zion beziehungsweise Jerusalem
  rationale: Der historische Bezug ist sehr wahrscheinlich, steht aber nicht ausdrücklich im Vers. Daher bleibt die Formulierung im Haupttext erhalten und wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die asyndetisch fortlaufende Satzstruktur und das abschließende Komma bleiben erhalten, weil der Satz im folgenden Vers weitergeführt wird. Gedankenstriche grenzen die abschließende Zweck- beziehungsweise Bezugsangabe lesefreundlich ab.
