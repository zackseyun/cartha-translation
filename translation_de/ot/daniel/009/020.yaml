  rationale: Die Gedankenstriche wurden entfernt, weil die Angabe „für den heiligen Berg meines Gottes“ eine reguläre Ergänzung zu „mein Flehen ... vorbrachte“ ist. Die Fußnotenanker wurden ans Satzende gesetzt, damit Fußnote a die Gebetswendung und Fußnote b den heiligen Berg jeweils eindeutig erläutern. Inhalt und fortlaufende Satzverbindung zum folgenden Vers bleiben erhalten.
