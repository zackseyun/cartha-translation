  source_fidelity: Der Entwurf gibt die Abfolge der hebräischen Partizipien, das Bekenntnis der eigenen und der Volkssünde, die Gebetsidiomatik von מַפִּיל תְּחִנָּה לִפְנֵי sowie den doppelten Bezug „Jahwe, mein Gott“ zuverlässig wieder. „Für den heiligen Berg“ ist als Wiedergabe von עַל möglich und wahrt, dass der Berg Gegenstand des Flehens ist.
