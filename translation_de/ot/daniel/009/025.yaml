source:
  edition: WLC
  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: de
  text: 'So erkenne und verstehe: vom Ergehen des Wortes, Jerusalem wiederherzustellen und aufzubauen, bis zu einem Gesalbten[a], einem Fürsten, sind es sieben Wochen[b]. Zweiundsechzig Wochen lang wird sie wiederhergestellt und aufgebaut werden, mit Platz und Graben[c], doch in bedrängten Zeiten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bis zum Messias, einem Fürsten“ oder „bis zum Messias, dem Fürsten“. Wörtlich steht im Hebräischen „Gesalbter, Fürst/Herrscher“.'
    reason: alternative_reading
  - marker: b
    text: „Sieben Wochen“ kann auch „sieben Siebener“ bedeuten; entsprechend kann „zweiundsechzig Wochen“ als „zweiundsechzig Siebener“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „breiter Platz und Graben“ oder „Straße und Graben“. Die Bedeutung des mit „Graben“ übersetzten hebräischen Wortes ist unsicher; möglicherweise ist ein Einschnitt, Schutzgraben oder eine andere Befestigungsanlage gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  choice: So erkenne und verstehe
  rationale: Die beiden Verbformen haben hier auffordernden Sinn. „Erkenne und verstehe“ gibt das Paar ידע und שכל klar und würdig wieder.
- source_word: מִן מֹצָא דָבָר
  choice: vom Ergehen des Wortes
  rationale: מֹצָא bezeichnet das Ausgehen oder Ergehen; דָבָר bleibt bewusst als „Wort“ wiedergegeben, statt es im Haupttext enger als amtlichen „Erlass“ festzulegen.
- source_word: לְהָשִׁיב וְלִבְנוֹת יְרוּשָׁלַם
  choice: Jerusalem wiederherzustellen und aufzubauen
  rationale: Im Bezug auf die Stadt bezeichnet השיב ihre Wiederherstellung; בנה wird mit „aufbauen“ wiedergegeben, ohne unnötige Spezifizierung einzelner Baumaßnahmen.
- source_word: עַד מָשִׁיחַ נָגִיד
  choice: bis zu einem Gesalbten, einem Fürsten
  rationale: מָשִׁיחַ bedeutet zunächst „Gesalbter“ und ist hier nicht grammatisch als eindeutiger Eigenname markiert. נָגִיד bezeichnet einen führenden Herrscher oder Fürsten; die Apposition wahrt die knappe hebräische Form.
- source_word: שָׁבֻעִים שִׁבְעָה / שָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: sieben Wochen / zweiundsechzig Wochen
  rationale: שָׁבֻעִים bezeichnet Siebenerperioden und kann herkömmlich mit „Wochen“ übersetzt werden. Die offenere Wiedergabe „Siebener“ wird in der Fußnote genannt.
- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: wird sie wiederhergestellt und aufgebaut werden
  rationale: Die femininen Singularformen beziehen sich auf Jerusalem. Die deutsche Wiedergabe macht diesen Bezug mit „sie“ deutlich und drückt sowohl Erneuerung als auch Bau aus.
- source_word: רְחוֹב וְחָרוּץ
  choice: Platz und Graben
  rationale: רְחוֹב bezeichnet einen breiten öffentlichen Raum oder Platz. חָרוּץ ist in diesem Zusammenhang unsicher und wird zurückhaltend als „Graben“ wiedergegeben.
- source_word: וּבְצוֹק הָעִתִּים
  choice: doch in bedrängten Zeiten
  rationale: צוֹק bezeichnet Bedrängnis oder Not. „In bedrängten Zeiten“ ist natürliches modernes Deutsch; „doch“ bringt den sachlichen Gegensatz zwischen Wiederaufbau und widrigen Umständen zum Ausdruck.
theological_decisions:
- issue: Ob מָשִׁיחַ im Haupttext als feststehender Titel „Messias“ wiederzugeben ist
  choice: „ein Gesalbter“ im Haupttext
  alternative: „der Messias“ oder „Messias, der Fürst“
  rationale: Das hebräische Wort bezeichnet lexikalisch einen Gesalbten und legt an dieser Stelle allein dessen Identität nicht eindeutig fest. Die Übersetzung bewahrt deshalb die Offenheit, während die traditionelle messianische Wiedergabe in der Fußnote genannt wird.
- issue: Wie שָׁבֻעִים in der Zeitangabe zu verstehen ist
  choice: „Wochen“ im Haupttext, „Siebener“ in der Fußnote
  alternative: „Siebener“ oder ausdrücklich „Jahrwochen“
  rationale: Der Ausdruck bezeichnet Einheiten von sieben, bestimmt aber für sich genommen nicht ausdrücklich Jahre. „Jahrwochen“ würde eine chronologische Deutung in den Haupttext eintragen; „Wochen“ wahrt die traditionelle Form, ergänzt durch die wörtlichere Alternative.
- issue: Gliederung der sieben und der zweiundsechzig Wochen
  choice: Die sieben Wochen werden mit dem Kommen des Gesalbten verbunden; der Wiederaufbau wird im folgenden Satz den zweiundsechzig Wochen zugeordnet.
  alternative: Beide Zahlen zu einer ununterbrochenen Spanne bis zum Gesalbten zusammenziehen
  rationale: Die masoretische Akzentuierung setzt bei „sieben Wochen“ einen deutlichen Einschnitt. Die Satzgliederung folgt diesem überlieferten Textevidenzsignal, ohne weitergehende chronologische Identifizierungen vorzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wortwahl vermeidet konfessionell festgelegte Identifizierungen. Der Punkt nach den sieben Wochen bildet den starken masoretischen Einschnitt ab; die Zeitangabe „Während zweiundsechzig Wochen“ bleibt dennoch flüssig und verständlich.
