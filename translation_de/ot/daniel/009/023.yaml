  text: בִּ/תְחִלַּ֨ת תַּחֲנוּנֶ֜י/ךָ יָצָ֣א דָבָ֗ר וַ/אֲנִי֙ בָּ֣אתִי לְ/הַגִּ֔יד כִּ֥י חֲמוּד֖וֹת אָ֑תָּה וּ/בִין֙ בַּ/דָּבָ֔ר וְ/הָבֵ֖ן בַּ/מַּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: de
  text: Zu Beginn deines Flehens ging ein Wort aus[a], und ich bin gekommen, es dir mitzuteilen; denn du bist sehr geliebt[b]. Darum bedenke das Wort und verstehe die Vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eine Botschaft erging.« Das hebräische »ein Wort ging aus« kann eine Botschaft oder eine ergangene Anordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du bist besonders kostbar« oder »du bist hoch geschätzt«. Der hebräische Ausdruck bezeichnet Daniel als besonders wertvoll bzw. geliebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: Zu Beginn deines Flehens
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem Daniels inständiges Bitten einsetzte. „Flehen“ gibt die Intensität des hebräischen Plurals idiomatisch und würdig wieder.
- source_word: יָצָא דָבָר
  choice: ging ein Wort aus
  rationale: Die weitgehend formale Wiedergabe bewahrt die Mehrdeutigkeit von דָבָר als Wort, Botschaft oder ergangene Anordnung.
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: und ich bin gekommen, es dir mitzuteilen
  rationale: „Es“ nimmt sinngemäß das zuvor genannte Wort auf; „dir“ bezeichnet den aus dem Zusammenhang eindeutigen Adressaten. Das Perfekt mit Gegenwartsbezug wird im Deutschen natürlich wiedergegeben.
- source_word: כִּי חֲמוּדוֹת אָתָּה
  choice: denn du bist hoch geschätzt
  rationale: Die hebräische intensive Wendung bezeichnet Daniel als besonders kostbar und wertgeschätzt. Die Formulierung vermeidet die im Deutschen möglicherweise romantisch klingende Aussage „sehr geliebt“, ohne die persönliche Wertschätzung abzuschwächen.
- source_word: וּבִין בַּדָּבָר
  choice: Darum achte auf das Wort
  rationale: בין fordert hier zu einsichtigem Erfassen auf. „Achte auf“ ist natürliches Deutsch und unterscheidet den ersten Imperativ vom folgenden ausdrücklichen „verstehe“.
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: und verstehe die Vision
  rationale: מַרְאֶה bezeichnet im Danielbuch eine visionäre Schau; „Vision“ ist hier die klare, etablierte Kontextbedeutung.
theological_decisions:
- issue: Daniels Stellung in חֲמוּדוֹת אָתָּה
  choice: du bist hoch geschätzt
  alternative: du bist sehr geliebt; du bist kostbar
  rationale: Die Übersetzung wahrt den Gedanken besonderer göttlicher Wertschätzung, ohne daraus eine weitergehende Lehrbestimmung abzuleiten. Eine Fußnote hält die relationale Alternative offen.
- issue: Bezug und Art des ausgehenden דָבָר
  choice: ein Wort ging aus
  alternative: eine Botschaft erging; ein Befehl erging
  rationale: Der Haupttext legt nicht fest, ob primär eine Mitteilung, Antwort oder Anordnung gemeint ist, und erhält dadurch die Spannweite des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildrede „ein Wort ging aus“ bleibt zur Wahrung der hebräischen Mehrdeutigkeit erhalten; die übrige Syntax ist für heutige Leser geglättet.
