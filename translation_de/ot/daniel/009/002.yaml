  variant: modern standard German
source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: de
  text: 'Im ersten Jahr seiner Herrschaft erkannte ich, Daniel, aus den Schriften[a] die Zahl der Jahre, über die das Wort Jahwes an den Propheten Jeremia ergangen war: dass für die Verwüstungen Jerusalems siebzig Jahre voll werden sollten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus den Schriftrollen. Das hebräische Wort kann allgemein schriftliche Dokumente bezeichnen; „Schriften“ benennt ihren Inhalt, „Schriftrollen“ deutlicher ihre damalige Form.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְמָלְכוֹ
  choice: Im ersten Jahr seiner Herrschaft
  rationale: Die Kardinalzahl אַחַת hat in dieser Zeitangabe ordinalen Sinn. „Herrschaft“ gibt das Regieren idiomatisch wieder, ohne den nicht genannten Herrscher im Vers zu identifizieren.
- source_word: בִּינֹתִי
  choice: erkannte ich
  rationale: Das Verb בין bezeichnet hier ein durch Nachdenken oder Studium gewonnenes Verstehen. „Erkannte“ ist natürlich und bewahrt diesen Erkenntnisvorgang.
- source_word: בַּסְּפָרִים
  choice: aus den Schriften
  rationale: Die Präposition ב wird instrumental beziehungsweise als Angabe der Quelle verstanden. סְפָרִים bezeichnet schriftliche Dokumente; „Schriften“ ist im Deutschen sachgerecht und weniger an die moderne Buchform gebunden als „Bücher“.
- source_word: מִסְפַּר הַשָּׁנִים
  choice: die Zahl der Jahre
  rationale: Die Konstruktion bezeichnet die bestimmte, in der prophetischen Aussage genannte Gesamtzahl.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמִיָה הַנָּבִיא
  choice: über die das Wort Jahwes an den Propheten Jeremia ergangen war
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die Jahre. Das Plusquamperfekt kennzeichnet die Offenbarung an Jeremia als zeitlich vorausliegend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם שִׁבְעִים שָׁנָה
  choice: Für die Verwüstungen Jerusalems sollten siebzig Jahre voll werden
  rationale: Die Formulierung gibt das Vollwerden der siebzig Jahre wieder und lässt die ungewöhnliche Verbindung zwischen diesem Zeitraum und Jerusalems Verwüstungen bestehen, ohne einen nicht ausdrücklich genannten Handelnden einzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration bewahrt den Charakter als Eigenname; die deutsche Standardform lautet „Jahwe“.
- issue: Bezug und Nuance von לְמַלֹּאות
  choice: Für die Verwüstungen Jerusalems sollten siebzig Jahre voll werden
  alternative: um die Verwüstungen Jerusalems zu erfüllen
  rationale: Die gewählte Fassung stellt die zeitliche Vollendung in den Vordergrund, ohne festzulegen, wer oder was die Verwüstungen „erfüllt“. So bleibt die syntaktische und theologische Spannung des Hebräischen erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am prophetisch-berichtenden Stil des Hebräischen, wird aber durch den Doppelpunkt und einen eigenständigen Schlusssatz lesbar gegliedert.
