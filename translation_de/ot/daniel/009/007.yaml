source:
  edition: WLC
  text: לְ/ךָ֤ אֲדֹנָ/י֙ הַ/צְּדָקָ֔ה וְ/לָ֛/נוּ בֹּ֥שֶׁת הַ/פָּנִ֖ים כַּ/יּ֣וֹם הַ/זֶּ֑ה לְ/אִ֤ישׁ יְהוּדָה֙ וּ/לְ/יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם וּֽ/לְ/כָל יִשְׂרָאֵ֞ל הַ/קְּרֹבִ֣ים וְ/הָ/רְחֹקִ֗ים בְּ/כָל הָֽ/אֲרָצוֹת֙ אֲשֶׁ֣ר הִדַּחְתָּ֣/ם שָׁ֔ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֥ר מָֽעֲלוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: de
  text: 'Dir, Herr, gebührt Gerechtigkeit, uns aber Scham auf dem Gesicht[a], wie es heute der Fall ist: den Männern von Juda[b], den Einwohnern Jerusalems und ganz Israel, den Nahen und den Fernen, in all den Ländern, in die du sie vertrieben hast, wegen ihres Treuebruchs[c], den sie dir gegenüber begangen haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Scham des Gesichts“; gemeint ist sichtbare oder öffentliche Beschämung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedem Mann von Juda“. Das Hebräische verwendet hier eine maskuline Singularform in distributivem Sinn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wegen ihrer Untreue“, „wegen ihrer Treulosigkeit“ oder „wegen ihres Verrats“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Direkte Gebetsanrede an Gott. Das Wort ist hier אֲדֹנָי und nicht der Gottesname JHWH; das deutsche „Herr“ gibt die ehrerbietige Anrede natürlich wieder.
- source_word: הַצְּדָקָה
  choice: Gerechtigkeit
  rationale: Bezeichnet in diesem Bekenntnis Gottes gerechtes Handeln und sein Rechtbehalten gegenüber dem schuldig gewordenen Volk. „Gerechtigkeit“ wahrt den umfassenderen Sinn besser als das engere „Rechtsprechung“.
- source_word: בֹּשֶׁת הַפָּנִים
  choice: die Scham im Gesicht
  rationale: Die hebräische Wendung bezeichnet sichtbare beziehungsweise öffentliche Beschämung. Die Formulierung bewahrt das Bild vom Gesicht und bleibt durch die deutsche Konstruktion „steht ... im Gesicht“ verständlich.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Verweist auf die gegenwärtig sichtbare Lage. Die Wiedergabe ist modernes Deutsch und bewahrt den demonstrativen Gegenwartsbezug, ohne ein nicht ausdrücklich bezeichnetes „bis heute“ einzutragen.
- source_word: לְאִישׁ יְהוּדָה
  choice: den Männern von Juda
  rationale: אִישׁ steht im maskulinen Singular mit distributiver beziehungsweise kollektiver Funktion. Der Plural gibt diese Funktion im Deutschen verständlich wieder und wahrt die maskuline Form des Ausgangstextes.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: den Einwohnern Jerusalems
  rationale: Natürliche und knappe Wiedergabe der substantivierten Partizipialform für die in Jerusalem Wohnenden.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bezeichnet das Bundesvolk als Ganzes und wird durch die nachfolgende Gegenüberstellung von Nahen und Fernen näher bestimmt.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: den Nahen und den Fernen
  rationale: Bewahrt die knappe räumliche Gegenüberstellung und schließt sowohl die näher Wohnenden als auch die weit Zerstreuten ein.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: in all den Ländern
  rationale: Der Plural verweist auf die verschiedenen Gebiete der Zerstreuung; „Länder“ vermeidet eine unnötig moderne politische Präzisierung.
- source_word: הִדַּחְתָּם
  choice: du sie vertrieben hast
  rationale: Der Hifil von נדח betont, dass Gott sie fortgetrieben beziehungsweise in die Zerstreuung gebracht hat. „Vertrieben“ wahrt diese göttliche Handlungsmacht.
- source_word: בְּמַעֲלָם ... אֲשֶׁר מָעֲלוּ בָךְ
  choice: wegen ihres Treuebruchs, durch den sie dir die Treue gebrochen haben
  rationale: מעל bezeichnet einen schuldhaften Bruch von Treue. Die Wiedergabe erhält das Possessivsuffix „ihres“, den persönlichen Bezug auf Gott und die im Hebräischen durch Nomen und Verb erzeugte Wiederholung desselben Wortstamms.
theological_decisions:
- issue: Gottes Gerechtigkeit im Gegensatz zur Scham Israels
  choice: „Dir, Herr, gebührt Gerechtigkeit“ stellt Gottes gerechtes Rechtbehalten der sichtbaren Beschämung des Volkes gegenüber.
  alternative: „Du, Herr, bist im Recht“ oder eine primär richterliche Wiedergabe mit „Recht“
  rationale: Die Nominalform הַצְּדָקָה ist breiter als bloße richterliche Gerechtigkeit. Die Übersetzung wahrt den bekenntnishaften Gegensatz, ohne Aussagen über Verdienst, Selbstrechtfertigung oder das Fehlen göttlicher Barmherzigkeit hinzuzufügen.
- issue: Maskuline Kollektivsprache in לְאִישׁ יְהוּדָה
  choice: „den Männern von Juda“
  alternative: „dem Volk von Juda“ oder „allen aus Juda“
  rationale: Die hebräische Form ist maskulin und distributiv gebraucht. Die gewählte Fassung erhält diese Form, während die Alternativen sie neutralisieren würden.
- issue: Göttliche Verantwortung für die Vertreibung und menschliche Schuld
  choice: Sowohl Gottes Vertreiben als auch der Treuebruch des Volkes werden ausdrücklich benannt.
  alternative: Die Vertreibung lediglich unpersönlich als Zerstreuung zu beschreiben
  rationale: 'Der Vers hält beide Aussagen spannungsvoll zusammen: Gott hat sie vertrieben, und Anlass dafür war ihr Treuebruch. Diese Zuordnung wird nicht abgeschwächt oder weiter dogmatisch erklärt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gebetssprachlicher Direktheit. Der Parallelismus zwischen Gottes Gerechtigkeit und der Scham des Volkes bleibt erkennbar. Das hebräische Gesichtsidiom wird in einer verständlichen deutschen Wendung bewahrt; sperrige Nominalketten und unnötig archaische Formen werden vermieden.
