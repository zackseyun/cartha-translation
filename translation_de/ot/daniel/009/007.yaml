    issue: Unpassende logische Verknüpfung „durch den“
    rationale: Der Ausdruck בְּמַעֲלָם bezeichnet den Anlass bzw. Grund der Vertreibung. Das Relativpronomen kann den Treuebruch erläutern, sollte aber nicht nahelegen, der Treuebruch sei das Mittel, durch das sie Gott die Treue brachen. „den sie dir gegenüber begangen haben“ wahrt den Bezug und liest sich klar.
  - severity: low
    issue: Unidiomatische Wendung „die Scham im Gesicht steht“
    rationale: Das hebräische Idiom darf bildhaft bleiben, sollte aber im modernen Standarddeutsch natürlich formuliert sein. „Scham auf dem Gesicht“ bewahrt das Bild und vermeidet eine ungebräuchliche Verbindung.
