review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Bezüge des Hebräischen zuverlässig wieder: Gottes Gerechtigkeit steht der Schande des Volkes gegenüber; Juda, Jerusalem und ganz Israel einschließlich Nahen und Fernen sind umfasst; Gott ist als Handelnder der Zerstreuung genannt; der Treuebruch richtet sich gegen ihn. Die Präposition בְּ vor מַעֲלָם bezeichnet jedoch am natürlichsten den Grund („wegen/aufgrund ihres Treuebruchs“), nicht das Mittel. Deshalb ist „durch den“ im anschließenden Relativsatz semantisch weniger passend als eine Wiederaufnahme mit „den sie ... begangen haben“.'
  naturalness: „Die Scham im Gesicht steht“ ist im Deutschen zwar verständlich, aber keine natürliche feste Wendung. „Scham auf dem Gesicht“ ist als bildnahe, moderne Formulierung idiomatischer. Die übrige Syntax ist würdevoll und gut verständlich.
  terminology: „Herr“, „Gerechtigkeit“, „Treuebruch“ und „die Treue brechen“ sind angemessen. Die Wiederholung des Wortfeldes Treuebruch/Treue brechen bildet die hebräische Wiederholung von מעל sinnvoll ab. Die Fußnoten sind korrekt verankert und inhaltlich passend.
  issues:
