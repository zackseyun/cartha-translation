revisions:
- from: 'Dir, Herr, gebührt Gerechtigkeit, uns aber steht die Scham im Gesicht[a] – wie es heute der Fall ist: den Männern von Juda[b], den Einwohnern Jerusalems und ganz Israel, den Nahen und den Fernen, in all den Ländern, in die du sie vertrieben hast, wegen ihres Treuebruchs[c], durch den sie dir die Treue gebrochen haben.'
  to: 'Dir, Herr, gebührt Gerechtigkeit, uns aber Scham auf dem Gesicht[a], wie es heute der Fall ist: den Männern von Juda[b], den Einwohnern Jerusalems und ganz Israel, den Nahen und den Fernen, in all den Ländern, in die du sie vertrieben hast, wegen ihres Treuebruchs[c], den sie dir gegenüber begangen haben.'
  rationale: Die Revision verbessert zwei sichere Punkte des modernen deutschen Ausdrucks, ohne die Bildsprache, den Parallelismus, die maskuline Kollektivform oder die theologische Spannung des Ausgangstextes zu verändern. „Scham auf dem Gesicht“ ist idiomatischer; „den sie dir gegenüber begangen haben“ gibt die Wiederaufnahme von מעל sowie den persönlichen Bezug בָּךְ klar wieder, ohne die kausale Präposition als Mittelbeziehung umzudeuten.
