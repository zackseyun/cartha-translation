  variant: modern standard German
source:
  edition: WLC
  text: שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם חטאות וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: de
  text: 'Siebzig Wochen[a] sind über dein Volk und über deine heilige Stadt beschlossen: um dem Frevel ein Ende zu setzen, die Sünden zu versiegeln[b], Schuld zu sühnen, ewige Gerechtigkeit herbeizuführen, Vision und Prophet zu versiegeln[c] und ein Allerheiligstes zu salben[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „siebzig Siebener“; vielfach werden darunter siebzig Jahrwochen verstanden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Sünden ein Ende zu setzen“.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „Vision und Prophet“; manche verstehen die Wendung im Sinn von „Vision und Prophetie“.
    reason: alternative_reading
  - marker: d
    text: 'Oder: „einen Hochheiligen zu salben“. Die hebräische Wendung kann den heiligsten Ort oder eine höchst heilige Sache bezeichnen; manche beziehen sie auf eine Person.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: Siebzig Wochen
  rationale: שָׁבֻעִים bezeichnet Wochen beziehungsweise Siebener-Einheiten. „Siebzig Wochen“ gibt die hebräische Form natürlich wieder; die verbreitete Deutung als Jahrwochen wird nicht in den Haupttext eingetragen, sondern in einer Fußnote genannt.
- source_word: נֶחְתַּךְ
  choice: sind ... beschlossen
  rationale: Das Nifal bezeichnet hier eine feste Bestimmung oder Verfügung. „Beschlossen“ ist im Deutschen klar und bewahrt den Gedanken einer verbindlichen Festsetzung, ohne das etymologisch mögliche, hier aber missverständliche „abgeschnitten“ zu verwenden.
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: über dein Volk und über deine heilige Stadt
  rationale: עַל markiert den Bereich, auf den sich der Beschluss bezieht. „Über“ ist eine natürliche, formal nahe deutsche Wiedergabe.
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: um dem Frevel ein Ende zu setzen
  rationale: Die Wendung bezeichnet das Beenden beziehungsweise Vollenden des bestimmten Frevels. „Dem Frevel ein Ende setzen“ ist idiomatischer als „den Frevel vollenden“ und lässt den Zielgedanken deutlich hervortreten.
- source_word: וְלַחְתֹּם חטאות
  choice: die Sünden zu versiegeln
  rationale: חתם bedeutet wörtlich „versiegeln“. Die Metapher bleibt im Haupttext erhalten; die mögliche Deutung „den Sünden ein Ende setzen“ steht in der Fußnote.
- source_word: וּלְכַפֵּר עָוֺן
  choice: Schuld zu sühnen
  rationale: כפר bezeichnet hier das Sühnen beziehungsweise die Bewirkung von Sühne. „Schuld“ gibt עָוֺן mit seinem Gewicht moralischer Verfehlung und ihrer Belastung natürlich wieder.
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: ewige Gerechtigkeit herbeizuführen
  rationale: Die Kombination von בוא im Hifil mit צֶדֶק beschreibt das Herbeibringen oder Herbeiführen von Gerechtigkeit. עֹלָמִים verleiht ihr dauerhafte, ewige Geltung.
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: Vision und Prophet zu versiegeln
  rationale: Der masoretische Text hat ausdrücklich נָבִיא, „Prophet“, nicht das abstrakte Substantiv „Prophetie“. Die ungewöhnliche Formulierung wird daher bewahrt; eine geläufigere alternative Auffassung wird in der Fußnote erklärt.
- source_word: וְלִמְשֹׁחַ
  choice: zu salben
  rationale: משׁח ist das gewöhnliche Verb für rituelles Salben und bedarf keiner erläuternden Erweiterung im Haupttext.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: ein Allerheiligstes
  rationale: Die status-constructus-artige Intensivform bezeichnet etwas höchst Heiliges und wird häufig auf einen heiligen Ort oder Gegenstand bezogen. Der unbestimmte Ausdruck „ein Allerheiligstes“ wahrt besser als „das Allerheiligste“ die fehlende Bestimmtheit und die offene Referenz; eine mögliche persönliche Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von קֹדֶשׁ קָדָשִׁים
  choice: ein Allerheiligstes
  alternative: einen Hochheiligen beziehungsweise einen höchst heiligen Menschen
  rationale: Die hebräische Wendung bezeichnet regelmäßig etwas höchst Heiliges, besonders einen heiligen Bereich oder Gegenstand, benennt den Referenten hier aber nicht ausdrücklich. Die sachliche Wiedergabe im Haupttext vermeidet eine voreilige personale oder messianische Festlegung; die personale Möglichkeit bleibt in der Fußnote erhalten.
- issue: Art der שָׁבֻעִים in der Weissagung
  choice: Wochen
  alternative: Siebener beziehungsweise Jahrwochen
  rationale: Das hebräische Wort bezeichnet eine aus sieben Einheiten bestehende Periode, nennt in diesem Vers jedoch nicht ausdrücklich Jahre. Darum bleibt der Haupttext bei „Wochen“, während die verbreitete Deutung als Jahrwochen in der Fußnote erscheint.
- issue: Bedeutung von חתם bei Sünden sowie Vision und Prophet
  choice: versiegeln
  alternative: abschließen beziehungsweise ein Ende setzen; bestätigen
  rationale: Das Bild des Versiegelns kann je nach Zusammenhang Abschluss, Verschluss oder Beglaubigung andeuten. Der Haupttext erhält die Metapher und legt ihre theologische Funktion nicht einseitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Reihe der sechs Infinitivziele bleibt erkennbar. Ungewöhnliche hebräische Bilder wie „versiegeln“ und „Vision und Prophet“ werden nicht geglättet; echte lexikalische und theologische Mehrdeutigkeiten stehen in knappen Fußnoten.
