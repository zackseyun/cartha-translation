  text: וְ/ע֛וֹד אֲנִ֥י מְדַבֵּ֖ר בַּ/תְּפִלָּ֑ה וְ/הָ/אִ֣ישׁ גַּבְרִיאֵ֡ל אֲשֶׁר֩ רָאִ֨יתִי בֶ/חָז֤וֹן בַּ/תְּחִלָּה֙ מֻעָ֣ף בִּ/יעָ֔ף נֹגֵ֣עַ אֵלַ֔/י כְּ/עֵ֖ת מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: de
  text: Während ich noch im Gebet redete, kam der Mann Gabriel, den ich am Anfang in der Vision gesehen hatte, in schnellem Flug[a] zu mir und berührte mich, etwa zur Zeit des Abendopfers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »ermüdet« bzw. »in Erschöpfung«. Die hebräische Wendung ist schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: Während ich noch im Gebet redete
  rationale: Die fortdauernde Handlung wird im Deutschen natürlich als gleichzeitiger Vorgang wiedergegeben. »Im Gebet redete« bewahrt sowohl den Sprechakt als auch den Gebetszusammenhang.
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: der Mann Gabriel
  rationale: אִישׁ bedeutet gewöhnlich »Mann«. Die bewusst konkrete Beschreibung der menschlich erscheinenden Gestalt wird beibehalten, obwohl Gabriel ein himmlischer Bote ist.
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: den ich zu Anfang in der Vision gesehen hatte
  rationale: Das Plusquamperfekt kennzeichnet die frühere Sichtung Gabriels; »zu Anfang« gibt בַּתְּחִלָּה eng wieder, ohne den zeitlichen Bezug stärker festzulegen als der Ausgangstext.
- source_word: מֻעָף בִּיעָף
  choice: in schnellem Flug
  rationale: Die traditionelle und im Zusammenhang gut passende Deutung beschreibt Gabriels rasche Bewegung. Da die hebräische Wendung schwierig ist und auch mit Ermüdung verbunden wurde, wird diese Alternative in einer Fußnote genannt.
- source_word: נֹגֵעַ אֵלַי
  choice: kam ... zu mir
  rationale: נגע kann »berühren« oder »erreichen« bedeuten. Im Zusammenhang schildert die Wendung Gabriels Ankunft bei Daniel; »kam zu mir« ist dafür natürliches Deutsch, ohne eine körperliche Berührung zu behaupten.
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: etwa zur Zeit des Abendopfers
  rationale: כְּעֵת bezeichnet eine ungefähre zeitliche Entsprechung. »Abendopfer« lässt offen, ob מִנְחָה hier materiell als Speisopfer oder als Bezeichnung der regelmäßigen Opferzeit verstanden wird.
theological_decisions:
- issue: Art von Gabriels Bewegung in מֻעָף בִּיעָף
  choice: Gabriel kommt in schnellem Flug.
  alternative: Gabriel kommt erschöpft beziehungsweise von Müdigkeit überwältigt.
  rationale: Die schwierige hebräische Wendung ist unterschiedlich gedeutet worden. Der Zusammenhang seiner unvermittelten Ankunft während Daniels Gebet und die herkömmliche Auslegung sprechen für eine Bewegungsangabe; die mögliche Ermüdungsdeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem zeitlichen Ablauf des Hebräischen, bleibt aber flüssig; die markante Bezeichnung »der Mann Gabriel« und die echte Unsicherheit der schwierigen Bewegungsformel werden bewahrt.
