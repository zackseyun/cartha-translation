source:
  edition: WLC
  text: וְ/הִגְבִּ֥יר בְּרִ֛ית לָ/רַבִּ֖ים שָׁב֣וּעַ אֶחָ֑ד וַ/חֲצִ֨י הַ/שָּׁב֜וּעַ יַשְׁבִּ֣ית זֶ֣בַח וּ/מִנְחָ֗ה וְ/עַ֨ל כְּנַ֤ף שִׁקּוּצִים֙ מְשֹׁמֵ֔ם וְ/עַד כָּלָה֙ וְ/נֶ֣חֱרָצָ֔ה תִּתַּ֖ךְ עַל שֹׁמֵֽם׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: de
  text: Und er wird einen Bund mit den Vielen eine Woche lang bekräftigen[a]. Eine halbe Woche lang wird er Schlachtopfer und Speiseopfer aufhören lassen[b]. Und auf dem Flügel von Gräueln[c] kommt einer, der Verwüstung bringt[d], bis das beschlossene Ende über den Verwüster ausgegossen wird[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Bund … stärken“, „bestätigen“ oder „zur Geltung bringen“. Das hebräische Verb bedeutet, etwas stark zu machen oder ihm Durchsetzungskraft zu verleihen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nahe: „Schlachtopfer und Speiseopfer“. Das zweite Wort kann auch allgemeiner „Gabe“ oder „Opfergabe“ bedeuten, bezeichnet im kultischen Zusammenhang jedoch häufig das Speise- beziehungsweise Getreideopfer.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf dem Flügel von Gräueln“. Die Wendung ist schwierig; möglich sind unter anderem „auf der Zinne der Gräuel“ oder „auf einem Flügel von Gräueln“.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „ein Verwüster“ beziehungsweise „einer, der Verwüstung verursacht“. Das Verb „kommt“ steht nicht ausdrücklich im Hebräischen, sondern ist für den deutschen Satz ergänzt.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „über den Verwüsteten“ beziehungsweise „über die verwüstete Stätte“. Der Wortlaut ist überliefert, doch die Syntax des letzten Satzteils ist schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: wird … bekräftigen
  rationale: Das Hifil von גבר bezeichnet hier ein Starkmachen oder Zur-Geltung-Bringen. „Bekräftigen“ ist im Deutschen knapp und verständlich; die Fußnote hält offen, ob ein bestehender Bund bestätigt, gestärkt oder wirksam gemacht wird.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ bewahrt das gewichtige und theologisch offene Bedeutungsfeld von בְּרִית besser als „Abkommen“ oder „Vertrag“.
- source_word: לָרַבִּים
  choice: mit den Vielen
  rationale: Die Wiedergabe erhält die kollektive Bestimmtheit von רַבִּים. Die Präposition ל ist hier mehrdeutig; im Zusammenhang mit בְּרִית ist „mit“ im Deutschen idiomatisch.
- source_word: שָׁבוּעַ אֶחָד
  choice: eine Woche lang
  rationale: שָׁבוּעַ bezeichnet im Kontext die Siebenerperiode. „Eine Woche lang“ gibt zugleich die Zeitdauer natürlich wieder, ohne deren symbolische oder chronologische Deutung festzulegen.
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: Eine halbe Woche lang
  rationale: Diese Wiedergabe folgt der Formulierung „Hälfte der Woche“ und vermeidet die interpretierende Festlegung auf einen einzelnen Zeitpunkt „in der Mitte der Woche“.
- source_word: יַשְׁבִּית
  choice: wird … aufhören lassen
  rationale: 'Die Form ist kausativ: Er bewirkt, dass die Opfer aufhören. „Aufhören lassen“ erhält diese Aussage deutlicher als ein bloßes „beenden“.'
- source_word: זֶבַח וּמִנְחָה
  choice: Schlachtopfer und Speiseopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer; מִנְחָה steht im kultischen Zusammenhang gewöhnlich für das Speise- beziehungsweise Getreideopfer. Die spezifischen deutschen Kultbegriffe bilden das Wortpaar präzise ab.
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: Und auf dem Flügel von Gräueln
  rationale: כָּנָף bedeutet wörtlich „Flügel“. Die bewusst nahe Wiedergabe bewahrt die schwierige Metapher, statt sie ohne sichere Grundlage architektonisch als „Zinne“ oder „Gipfel“ aufzulösen.
- source_word: מְשֹׁמֵם
  choice: kommt einer, der Verwüstung bringt
  rationale: Das Partizip bezeichnet jemanden oder etwas, das Verwüstung verursacht. „Kommt“ ist zur Bildung eines verständlichen deutschen Satzes ergänzt; „einer, der Verwüstung bringt“ erhält den verbalen Charakter.
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: bis das beschlossene Ende
  rationale: Die Wortgruppe verbindet das Ende beziehungsweise die vollständige Vernichtung mit dem Gedanken des Festbeschlossenen. Die knappe Form lässt den genauen Umfang des Endes offen.
- source_word: תִּתַּךְ
  choice: ausgegossen wird
  rationale: נתך bezeichnet das Ausgießen. Das Passiv entspricht der hebräischen Form und vermeidet es, den im Vers nicht genannten Handelnden einzufügen.
- source_word: עַל שֹׁמֵם
  choice: über den Verwüster
  rationale: Die maskuline singularische Partizipialform lässt sich am unmittelbarsten als handelnde Person verstehen. Wegen der syntaktischen Schwierigkeit werden passive und örtliche Deutungen in der Fußnote bewahrt.
theological_decisions:
- issue: Identität des mit „er“ bezeichneten Handelnden
  choice: Das Pronomen bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Der Gesalbte, der kommende Fürst, Antiochus IV., Titus oder ein endzeitlicher Widersacher.
  rationale: Der hebräische Vers nennt den Bezug des Pronomens nicht ausdrücklich. Eine Benennung würde eine umstrittene historische oder eschatologische Deutung in den Text eintragen.
- issue: Bedeutung von כְּנַף שִׁקּוּצִים
  choice: „auf dem Flügel von Gräueln“
  alternative: „auf der Zinne der Gräuel“, „am äußersten Rand der Gräuel“ oder eine Verbindung mit gräuelhaften Dingen.
  rationale: Wortlaut und Syntax sind schwierig. Die wörtlichere Fassung bewahrt die Spannung zwischen metaphorischen und architektonischen Auslegungen.
- issue: Referent des abschließenden שֹׁמֵם
  choice: „der Verwüster“
  alternative: „der Verwüstete“ oder „die verwüstete Stätte“
  rationale: Die Form legt am ehesten einen verursachenden Handelnden nahe, entscheidet die syntaktisch schwierige Stelle aber nicht zweifelsfrei; deshalb stehen die Alternativen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater Nähe zur hebräischen Satzstruktur. Ungewohnte Bilder wie „Flügel von Gräueln“ bleiben bewusst erhalten; strittige historische und endzeitliche Identifizierungen werden nicht in den Haupttext aufgenommen.
