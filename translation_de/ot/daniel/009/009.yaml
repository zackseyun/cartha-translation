source:
  edition: WLC
  text: לַֽ/אדֹנָ֣/י אֱלֹהֵ֔י/נוּ הָ/רַחֲמִ֖ים וְ/הַ/סְּלִח֑וֹת כִּ֥י מָרַ֖דְנוּ בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
translation:
  language: de
  text: Dem Herrn, unserem Gott, gehören Erbarmen und Vergebung[a], denn wir haben uns gegen ihn aufgelehnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erweise des Erbarmens und der Vergebung“. Im Hebräischen stehen beide Begriffe im Plural; dieser kann Fülle ausdrücken oder wie ein abstrakter Begriff gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי
  choice: Dem Herrn gehören
  rationale: Das vorangestellte ל bezeichnet hier Zugehörigkeit bzw. Besitz. Im Deutschen wird die verblosen hebräische Aussage natürlich mit „gehören“ wiedergegeben.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Form bezeichnet „unser Gott“ und steht als nähere Bestimmung zu „dem Herrn“.
- source_word: הָרַחֲמִים
  choice: Erbarmen
  rationale: Obwohl die hebräische Form morphologisch ein Plural ist, kann sie als Abstraktplural eine reiche Fülle des Erbarmens ausdrücken. „Erbarmen“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: וְהַסְּלִחוֹת
  choice: Vergebung
  rationale: Auch hier steht im Hebräischen ein Plural. Das deutsche Abstraktum „Vergebung“ gibt den Sinn idiomatisch wieder; die Formfrage wird in der Fußnote kenntlich gemacht.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine begründende bzw. erklärende Aussage ein. „Denn“ bewahrt diesen Zusammenhang, ohne ihn stärker auszudeuten.
- source_word: מָרַדְנוּ
  choice: wir haben uns aufgelehnt
  rationale: מרד bezeichnet Auflehnung oder Rebellion, nicht bloß allgemeines Sündigen. Das Perfekt mit „haben“ stellt die vergangene Tat mit ihrer fortdauernden Bedeutung im Bekenntnis dar.
- source_word: בּוֹ
  choice: gegen ihn
  rationale: In Verbindung mit מרד bezeichnet ב die Person, gegen die sich die Auflehnung richtet; idiomatisches Deutsch verlangt „gegen ihn“.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche und ehrerbietige Wiedergabe des göttlichen Titels in diesem Gebetszusammenhang. „Gebieter“ wäre lexikalisch möglich, würde hier aber eine zusätzliche Nuance hervorheben.
- issue: Verhältnis zwischen Gottes Erbarmen und Israels Auflehnung
  choice: denn
  alternative: obwohl
  rationale: Die kausale bzw. erklärende Grundbedeutung von כִּי bleibt erhalten. Eine konzessive Übersetzung mit „obwohl“ würde die theologische Spannung ausdrücklich auflösen, obwohl der hebräische Wortlaut dies nicht erzwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die hervorgehobene Voranstellung Gottes als desjenigen, dem Erbarmen und Vergebung gehören. „Sich auflehnen“ ist allgemein verständlich und erhält die gezielte Bedeutung von מרד.
