id: DAN.9.15
reference: Daniel 9:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: de
  text: 'Und nun, Herr, unser Gott, der du dein Volk mit starker Hand[a] aus dem Land Ägypten herausgeführt und dir einen Namen gemacht[b] hast, wie es noch heute der Fall ist[c]: Wir haben gesündigt; wir haben gottlos gehandelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit mächtiger Hand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Du hast dir Ansehen und Ruhm erworben.'
    reason: idiom_explanation
  - marker: c
    text: 'Wörtlicher: „wie an diesem Tag“; auch möglich: „bis auf den heutigen Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt den Übergang zur gegenwärtigen Bitte beziehungsweise zum nächsten Gebetsabschnitt knapp und unmittelbar wieder.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Herr, unser Gott
  rationale: Natürliche deutsche Anrede im Gebetskontext; „Herr“ gibt den göttlichen Titel אֲדֹנָי wieder.
- source_word: הוֹצֵאתָ אֶת־עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: der du dein Volk aus dem Land Ägypten herausgeführt hast
  rationale: „Herausgeführt“ entspricht dem Hifil von יצא und bewahrt zusammen mit „Land Ägypten“ die Exodusformel.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Bewahrt das hebräische Bild und die feste Exodusformulierung; „mit mächtiger Hand“ ist ebenfalls möglich.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: dir einen Namen gemacht hast
  rationale: Die verständliche deutsche Wendung erhält das Bild des Hebräischen; gemeint ist, dass Gott sich Ansehen beziehungsweise Ruhm verschafft hat.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es noch heute der Fall ist
  rationale: Gibt die bis zur Gegenwart fortbestehende öffentliche Geltung des göttlichen Namens natürlich wieder, ohne die zeitliche Wendung auf einen bloßen Zeitpunkt zu verengen.
- source_word: חָטָאנוּ
  choice: Wir haben gesündigt
  rationale: Das Perfekt passt zum Sündenbekenntnis und drückt die gegenwärtige Relevanz der eingestandenen Schuld aus.
- source_word: רָשָׁעְנוּ
  choice: wir haben gottlos gehandelt
  rationale: Unterscheidet das zweite Verb von „gesündigt“ und gibt dessen moralisch-religiöse Schärfe als Handlung wieder.
theological_decisions:
- issue: Exodusanklang und Gottes Name beziehungsweise Ansehen
  choice: Die Exodusformel und das Bild, dass Gott sich einen Namen gemacht hat, bleiben erhalten.
  alternative: 'Dynamischer: „der du dein Volk machtvoll aus Ägypten befreit und dir Ruhm erworben hast“.'
  rationale: Die relativ formale Wiedergabe erhält den heilsgeschichtlichen Rückbezug und das biblische Motiv des öffentlich bekannten Namens Gottes, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Zeitliche Wendung כַּיּוֹם הַזֶּה
  choice: wie es noch heute der Fall ist
  alternative: wie an diesem Tag; bis auf den heutigen Tag
  rationale: Die gewählte Fassung bringt die fortdauernde Geltung idiomatisch zum Ausdruck; die Fußnote bewahrt die formnähere und alternative zeitliche Lesart.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Anrede mit anschließendem Relativsatz wird im Deutschen durch „der du“ natürlich gestaltet. Der Doppelpunkt markiert den Übergang vom Rückblick auf Gottes Handeln zum Schuldbekenntnis.
