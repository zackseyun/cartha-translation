source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: de
  text: Herr, höre! Herr, vergib! Herr, merke auf und handle! Zögere nicht, um deiner selbst willen, mein Gott! Denn dein Name ist über deiner Stadt und deinem Volk ausgerufen worden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „Deine Stadt und dein Volk sind nach deinem Namen genannt.“'
    reason: Alternative idiomatische Wiedergabe der hebräischen Formel, die Zugehörigkeit und Identifikation mit Gott ausdrückt.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Anrede bezeichnet Gott als Herrn; im natürlichen deutschen Gebetsstil steht der Titel ohne das Possessivpronomen „mein“.
- source_word: שְׁמָעָה
  choice: höre
  rationale: Der Imperativ bewahrt sowohl den Grundsinn als auch den eindringlichen Ton der Bitte.
- source_word: סְלָחָה
  choice: vergib
  rationale: Im Zusammenhang des Bußgebets ist dies die klare und geläufige deutsche Entsprechung.
- source_word: הַקֲשִׁיבָה
  choice: merke auf
  rationale: Die Form bezeichnet aufmerksames Hinhören und steigert die vorausgehende Bitte „höre“; „merke auf“ ist würdevoll und weiterhin verständlich.
- source_word: וַעֲשֵׂה
  choice: und handle
  rationale: Das allgemeine Verb „tun/machen“ fordert hier Gottes wirksames Eingreifen; „handle“ gibt dies knapp wieder.
- source_word: אַל תְּאַחַר
  choice: Zögere nicht
  rationale: Die verneinte Verbform bittet darum, die erbetene Handlung nicht aufzuschieben.
- source_word: לְמַעַנְךָ
  choice: um deiner selbst willen
  rationale: Die Wendung begründet die Bitte mit Gottes eigener Ehre und bewahrt den nachdrücklichen Bezug auf ihn selbst.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die possessive Anrede wird direkt und persönlich wiedergegeben.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung der Bitte ein; „denn“ passt natürlich zum gehobenen Gebetston.
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: dein Name ist über … ausgerufen
  rationale: Diese Wiedergabe bewahrt die passive hebräische Bildsprache mit עַל („über“) und lässt Zugehörigkeit, öffentliche Benennung und Anrufung anklingen, ohne die Wendung vorschnell auf nur eine Deutung festzulegen.
- source_word: עִירְךָ
  choice: deiner Stadt
  rationale: Die einfache Possessivform bezieht sich im Kontext auf Jerusalem.
- source_word: עַמֶּךָ
  choice: deinem Volk
  rationale: Die einfache Possessivform bezeichnet das zu Gott gehörende Volk.
theological_decisions:
- issue: Bundes- und Zugehörigkeitsformel שִׁמְךָ נִקְרָא עַל
  choice: dein Name ist über deiner Stadt und deinem Volk ausgerufen
  alternative: deine Stadt und dein Volk tragen deinen Namen
  rationale: Die Hauptfassung erhält die ungewöhnliche Bildgestalt des Hebräischen und damit ihre theologische Spannung zwischen Gottes Eigentumsanspruch, Identifikation und Anrufung. Die Fußnote bietet die geläufigere deutsche Sinnwiedergabe, ohne sie in den Haupttext einzusetzen.
translation_notes:
  register: Moderner, würdevoller Gebetsstil mit kurzen, eindringlichen Imperativen. Die dreifache Anrede „Herr“ und die Steigerung von „höre“ zu „merke auf und handle“ bleiben erhalten. Der Schluss bewahrt bewusst die fremdartigere hebräische Namensformel; die idiomatische Deutung steht in der Fußnote.
