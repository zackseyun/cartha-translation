source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: de
  text: Wir haben nicht auf deine Diener, die Propheten, gehört[a], die in deinem Namen zu unseren Königen, unseren Oberen, unseren Vätern[b] und zum ganzen Volk des Landes gesprochen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht gehorcht“. Das hebräische Verb kann ein Hören bezeichnen, das eine entsprechende Reaktion einschließt, nicht nur das akustische Wahrnehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unseren Vorfahren“. Wörtlich: „unseren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ אֶל
  choice: auf ... gehört
  rationale: שׁמע mit אֶל bedeutet, auf jemanden zu hören bzw. ihm Folge zu leisten. „Auf ... gehört“ bewahrt im Deutschen sowohl den Vorgang des Hörens als auch den mitschwingenden Gedanken des Gehorsams.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: deine Diener, die Propheten
  rationale: עבד bezeichnet hier ehrenvoll Menschen im Dienst Gottes; die Propheten stehen appositionell zu „Diener“.
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: in deinem Namen ... gesprochen haben
  rationale: Die Wendung bezeichnet autorisiertes und stellvertretendes Reden. „In deinem Namen“ ist im Deutschen natürlich und bleibt nah am hebräischen Ausdruck.
- source_word: שָׂרֵינוּ
  choice: unsere führenden Männer
  rationale: שׂרים meint hochgestellte politische oder administrative Führungspersonen. „Führende Männer“ gibt Funktion und maskuline Form wieder, ohne erblichen Adel vorauszusetzen.
- source_word: אֲבֹתֵינוּ
  choice: unsere Väter
  rationale: Die wörtliche maskuline Bezeichnung wird bewahrt; im Zusammenhang kann sie frühere Generationen bzw. Vorfahren einschließen.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: עַם ist ein kollektiver Singular; „Volk des Landes“ bewahrt die hebräische Ausdrucksweise, ohne zwischen Land, Gebiet oder Staat unnötig festzulegen.
theological_decisions:
- issue: Bezeichnet שׁמע hier nur das Hören oder ausdrücklich den Gehorsam?
  choice: nicht auf ... gehört
  alternative: nicht ... gehorcht
  rationale: Im Sündenbekenntnis ist fehlender Gehorsam deutlich mitgemeint. Die Hauptfassung lässt jedoch die größere Bedeutungsbreite des hebräischen Verbs bestehen, statt sie auf „gehorchen“ zu verengen.
- issue: Soll אֲבֹתֵינוּ als „Väter“ oder verallgemeinernd als „Vorfahren“ wiedergegeben werden?
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: „Väter“ entspricht der maskulinen Form und bewahrt das konkrete biblische Sprachbild; eine Fußnote nennt die im Kontext mögliche weitere Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Bekenntnis, wird jedoch durch natürliche deutsche Wortstellung geglättet. „Führende Männer“ ist verständlicher als das historisch enger wirkende „Fürsten“ und bewahrt zugleich die maskuline Referenzform.
