source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: de
  text: Darum wachte Jahwe[b] über das Unheil[a] und brachte es über uns, denn Jahwe, unser Gott, ist gerecht in allem, was er getan hat, und wir haben nicht auf seine Stimme gehört.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Unglück“. Das hebräische Wort kann außerdem „das Böse“ bedeuten; hier bezeichnet es das Unheil des Gerichts, das über das Volk kam.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „wachte über“ wiedergegebene Verb kann auch „war wachsam in Bezug auf“ oder stärker deutend „beschleunigte“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Auf seine Stimme hören“ bedeutet hier auch, dem Gesagten zu gehorchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: wachte über
  rationale: Das Verb שׁקד bezeichnet Wachsamkeit und aufmerksames Wachen. „Wachte über“ bewahrt das hebräische Bild; eine Fußnote nennt die stärker deutende Möglichkeit „eilte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet hier im Gerichtszusammenhang das hereinbrechende Unheil, nicht moralisch böses Handeln Gottes. „Unheil“ erhält zugleich die Schwere des Ausdrucks.
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: und brachte es über uns
  rationale: Die feminine Objektendung verweist auf das Unheil zurück. Die Formulierung gibt das aktive Herbeiführen und עָלֵינוּ knapp und natürlich wieder.
- source_word: כִּי צַדִּיק יְהוָה אֱלֹהֵינוּ
  choice: denn Jahwe, unser Gott, ist gerecht
  rationale: כִּי begründet die vorausgehende Aussage; צַדִּיק wird mit dem etablierten biblischen und ethischen Begriff „gerecht“ wiedergegeben.
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: in allem, was er getan hat
  rationale: Die natürliche deutsche Formulierung gibt עַל hier als Bezugsangabe wieder und vermeidet die im Deutschen schwerfällige Wiederholung „bei allen seinen Taten, die er getan hat“.
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: und wir haben nicht auf seine Stimme gehört
  rationale: Die Wiedergabe bewahrt sowohl die koordinierende Konjunktion als auch das hebräische Stimmenbild. Im Zusammenhang schließt „hören“ gehorsames Befolgen ein.
theological_decisions:
- issue: Bedeutung von רָעָה als Gegenstand von Gottes Handeln
  choice: das Unheil
  alternative: das Böse; das Unglück
  rationale: Im Kontext des Bundesgerichts bezeichnet רָעָה eine verhängte Katastrophe. „Unheil“ vermeidet die unbegründete Aussage, Gott habe moralisch Böses getan, ohne abzuschwächen, dass er das Gericht aktiv über das Volk brachte.
- issue: Zusammenhang zwischen Gottes Gerechtigkeit und dem Gericht
  choice: Gottes Gerechtigkeit gilt „in allem, was er getan hat“
  alternative: Gottes Gerechtigkeit nur allgemein festzustellen
  rationale: Die Präpositionalphrase bezieht die ausgesagte Gerechtigkeit ausdrücklich auf sein gesamtes Handeln, einschließlich des soeben genannten Unheils; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber durch Kommas und Semikolon lesbar gegliedert. „Jahwe“ folgt der üblichen deutschen Form des göttlichen Namens; das traditionelle Stimmenbild und die Wachsamkeitsmetapher bleiben erhalten.
