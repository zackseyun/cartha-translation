  source_fidelity: 'Die Grundbedeutung wird gut getroffen: Das im mosaischen Gesetz angekündigte Unheil ist eingetreten, und das Volk hat Yahweh nicht um Gunst angefleht. Die beiden לְ-Infinitive geben jedoch am besten den Zielinhalt der unterlassenen Bitte wieder. »Indem wir« verschiebt dies zur Art und Weise des Flehens. Außerdem ist »von unserer Schuld umkehren« im heutigen Deutsch weniger idiomatisch und glättet den hebräischen Plural unnötig.'
  naturalness: Die Fassung ist insgesamt würdig und gut lesbar. »Um Gunst anflehen« ist möglich; die Umstellung zu »Yahweh, unseren Gott, nicht um Gunst angefleht« bleibt verständlich. »Uns von unseren Verfehlungen abzuwenden« ist moderner und idiomatischer als »von unserer Schuld umzukehren«.
  terminology: »Gesetz des Mose«, »Unheil« und »Yahweh, unseren Gott« sind treffend. »Verfehlungen« gibt עֲוֹנוֹתֵינוּ angemessen wieder, ohne die spezifische moralische Schuld zu verharmlosen. »In deiner Wahrheit Einsicht zu gewinnen« wahrt die Verbindung von השׂכיל mit בַּאֲמִתֶּךָ und lässt die in der Fußnote genannte Deutung von אמת als Treue offen.
