id: DAN.9.13
reference: Daniel 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: de
  text: Ganz so, wie es im Gesetz des Mose geschrieben steht, ist all dieses Unheil über uns gekommen.[a] Dennoch haben wir Yahweh, unseren Gott, nicht um Gunst angefleht, um uns von unseren Verfehlungen abzuwenden und in deiner Wahrheit Einsicht zu gewinnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all dieses Unglück«; das hebräische Wort kann in einem Gerichtszusammenhang Unheil oder Unglück bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine Wahrheit verstehen« beziehungsweise »in deiner Wahrheit verständig handeln«. »Wahrheit« kann hier auch den Sinn von »Treue« oder »Zuverlässigkeit« haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: Ganz so, wie es geschrieben steht
  rationale: Gibt die vergleichende Entsprechung zwischen der schriftlichen Tora-Warnung und dem eingetretenen Gericht wieder; die deutsche Wendung klingt natürlich und nachdrücklich.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: im Gesetz des Mose
  rationale: תּוֹרָה kann »Weisung« bedeuten, bezeichnet hier aber den mosaischen Gesetzes- und Bundesrahmen.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: all dieses Unheil
  rationale: רָעָה bezeichnet hier das im Gericht eintretende Unglück, nicht moralisch Böses; »Unheil« wahrt die Schwere und die Bedeutungsbreite.
- source_word: בָּאָה עָלֵינוּ
  choice: ist über uns gekommen
  rationale: Bewahrt die hebräische Gerichtsidiomatik in geläufigem Deutsch.
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: Dennoch haben wir … nicht um Gunst angefleht
  rationale: Die feste Verbindung חלה את פני bedeutet, jemanden inständig um Gunst oder Erbarmen zu bitten. »Dennoch« macht den konzessiven Zusammenhang deutlich.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, unseren Gott
  rationale: Gibt den Gottesnamen direkt und die Bundesbezeichnung mit Possessivbezug vollständig wieder.
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: indem wir von unserer Schuld umkehrten
  rationale: עָוֹן kann Schuld, Vergehen und deren Folgen bezeichnen. Der Singular »unsere Schuld« entspricht der morphologischen Form und funktioniert im Deutschen kollektiv.
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: und auf deine Wahrheit achteten
  rationale: Der Hifil von שׂכל umfasst verständiges Erfassen und entsprechend kluges Beachten. Mit בְּ und אֱמֶת ist »auf deine Wahrheit achten« idiomatisch und lässt sowohl Erkenntnis als auch verantwortliches Handeln anklingen.
theological_decisions:
- issue: Bedeutung von רָעָה im Gerichtskontext
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Der Kontext spricht vom eingetretenen Bundesgericht. »Unheil« vermeidet die sachlich irreführende Aussage, Gott habe moralisch Böses getan, ohne die Härte des Ausdrucks abzuschwächen.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Umschrift bewahrt diese Unterscheidung.
- issue: Verhältnis von Umkehr und Bitte um Gunst
  choice: indem wir … umkehrten und … achteten
  alternative: um … umzukehren und … zu verstehen
  rationale: Die Infinitive können Ziel oder näheren Inhalt beziehungsweise Vollzug des Flehens ausdrücken. Die gewählte Fassung versteht sie als konkrete Weise, in der die nicht erfolgte Hinwendung zu Gott hätte sichtbar werden sollen, ohne eine verdienstliche Bedingung zu formulieren.
- issue: Bedeutung von אֱמֶת
  choice: Wahrheit
  alternative: Treue; Zuverlässigkeit
  rationale: »Wahrheit« ist im Zusammenhang mit verständigem Erfassen gut begründet, doch das hebräische Wort kann zugleich Gottes Treue und Verlässlichkeit bezeichnen; diese Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch »Dennoch« und idiomatische Verbverbindungen flüssig lesbar. Die ungewöhnliche Anredeverschiebung von »Yahweh, unseren Gott« zu »deine Wahrheit« bleibt wie im Gebetstext erhalten.
