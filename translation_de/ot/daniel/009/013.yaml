    rationale: Das Hebräische hat den Plural עֲוֹנוֹתֵינוּ. Die Umschreibung »uns von unseren Verfehlungen abzuwenden« ist idiomatisches modernes Deutsch und gibt die Abkehr von schuldhaften Taten wieder.
