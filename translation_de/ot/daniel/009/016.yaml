  variant: modern standard German
source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: de
  text: Herr, lass doch gemäß all deinen gerechten Taten[a] deinen Zorn und deinen Grimm von deiner Stadt Jerusalem, deinem heiligen Berg, weichen! Denn durch unsere Sünden und die Verfehlungen unserer Vorfahren[b] sind Jerusalem und dein Volk allen rings um uns her zur Schmach geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Taten der Gerechtigkeit“ oder „deiner Gerechtigkeit“. Im Hebräischen steht der Plural, der wahrscheinlich auf konkrete gerechte Taten Gottes verweist.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Vorfahren“ sind die früheren Generationen des Volkes gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die übliche deutsche Wiedergabe des Gottestitels in direkter Anrede; die Anredefunktion wird durch die Satzstellung und das Komma deutlich.
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: nach all deinen gerechten Taten
  rationale: כְּ bezeichnet hier den Maßstab des erbetenen Handelns. Der hebräische Plural legt konkrete Erweise von Gottes Gerechtigkeit nahe.
- source_word: יָשָׁב נָא
  choice: lass doch ... weichen
  rationale: Der Jussiv mit נָא formuliert eine dringliche Bitte. Bei Zorn und Grimm als Subjekt gibt „weichen“ die Abwendung idiomatisch wieder.
- source_word: אַפְּךָ וַחֲמָתְךָ
  choice: deinen Zorn und deinen Grimm
  rationale: Die beiden Ausdrücke bezeichnen gemeinsam Gottes heftigen Unwillen; „Zorn“ und „Grimm“ bewahren die Steigerung und den würdevollen Ton.
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: von deiner Stadt Jerusalem, deinem heiligen Berg
  rationale: Jerusalem und der heilige Berg stehen appositionell; die deutsche Form bewahrt diese enge Zuordnung.
- source_word: כִּי בַחֲטָאֵינוּ
  choice: Denn durch unsere Sünden
  rationale: כִּי leitet die Begründung ein; בְּ kann hier die ursächliche beziehungsweise vermittelnde Rolle der Sünden ausdrücken.
- source_word: וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: und die Verfehlungen unserer Vorfahren
  rationale: עָוֹן bezeichnet schuldhafte Verfehlung. אבות meint in diesem Zusammenhang frühere Generationen beziehungsweise Ahnen; „Vorfahren“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: לְחֶרְפָּה
  choice: zum Gespött geworden
  rationale: Die לְ-Konstruktion bezeichnet den eingetretenen Schmachzustand. „Zum Gespött geworden“ ist natürliches Deutsch und bringt die öffentliche Entehrung zum Ausdruck.
- source_word: לְכָל סְבִיבֹתֵינוּ
  choice: allen, die rings um uns wohnen
  rationale: Die substantivierte Wendung bezeichnet die Menschen beziehungsweise Völker in der Umgebung; die explizite Formulierung vermeidet das unnatürliche „allen rings um uns“.
theological_decisions:
- issue: Bedeutung des Plurals צִדְקֹתֶיךָ
  choice: deine gerechten Taten
  alternative: deine Gerechtigkeit; deine Rechtstaten
  rationale: Der Plural weist wahrscheinlich auf konkrete Taten hin, in denen sich Gottes Gerechtigkeit erweist. Die Übersetzung verengt den Ausdruck weder auf eine abstrakte Eigenschaft noch ausschließlich auf richterliche Rechtsprechung.
- issue: Gemeinschaftliche und generationenübergreifende Schuld
  choice: unsere Sünden und die Verfehlungen unserer Vorfahren
  alternative: unsere Sünden und die Schuld unserer Väter
  rationale: Der Text bekennt ausdrücklich die Schuld der gegenwärtigen Gemeinschaft und früherer Generationen. „Vorfahren“ gibt die kontextuelle Referenz verständlich wieder, ohne die generationenübergreifende Dimension abzuschwächen.
- issue: Resultierender Schmachzustand Jerusalems und des Volkes
  choice: sind ... zum Gespött geworden
  alternative: sind ... ein Gegenstand der Schmach
  rationale: Die Formulierung wahrt die resultative Kraft der לְ-Konstruktion, obwohl der hebräische Satz kein ausdrückliches Verb enthält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bitte bleibt eindringlich, aber nicht altertümlich. Der Parallelismus „Zorn und Grimm“ sowie die appositionelle Verbindung Jerusalems mit dem heiligen Berg werden bewahrt.
