  variant: modern standard German
source:
  edition: WLC
  text: וּ/זְרֹעִ֖ים מִמֶּ֣/נּוּ יַעֲמֹ֑דוּ וְ/חִלְּל֞וּ הַ/מִּקְדָּ֤שׁ הַ/מָּעוֹז֙ וְ/הֵסִ֣ירוּ הַ/תָּמִ֔יד וְ/נָתְנ֖וּ הַ/שִּׁקּ֥וּץ מְשׁוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: de
  text: Und Streitkräfte von ihm werden sich erheben[a]. Sie werden das Heiligtum, die Festung[b], entweihen, das regelmäßige Brandopfer wegnehmen[c] und den Gräuel aufstellen, der Verwüstung bringt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Arme«; hier im Sinn von bewaffneten oder militärischen Kräften.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »das Heiligtum, die Festung«; möglich ist auch: »das befestigte Heiligtum« oder »die Heiligtumsfestung«.'
    reason: alternative_reading
  - marker: c
    text: 'Hebräisch: »das Regelmäßige« oder »das Beständige«; gemeint ist das regelmäßig dargebrachte Opfer.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: »den Gräuel, der Verwüstung verursacht«; das zugrunde liegende Wort kann daneben die Vorstellung des Entsetzens oder Erstarrens enthalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  choice: Streitkräfte
  rationale: Das Wort bedeutet wörtlich »Arme«, bezeichnet in diesem militärisch-politischen Zusammenhang aber bewaffnete Kräfte. »Streitkräfte« gibt den idiomatischen Sinn im modernen Deutschen klar wieder.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das Suffix verweist im Zusammenhang am ehesten auf die zuvor genannte Herrschergestalt. Die knappe Form wahrt den Personenbezug und lässt die genaue Art der Beauftragung offen.
- source_word: יַעֲמֹדוּ
  choice: werden sich erheben
  rationale: עמד bedeutet grundsätzlich »stehen« bzw. »sich hinstellen«; hier geht es um das Hervortreten oder Antreten militärischer Kräfte. »Sich erheben« bewahrt die Bildlichkeit und passt zur zukünftigen Handlung.
- source_word: וְחִלְּלוּ
  choice: sie werden … entweihen
  rationale: Das Piel von חלל bezeichnet, etwas Heiliges profan zu machen oder zu schänden. »Entweihen« ist im Deutschen präzise, natürlich und dem Heiligtumskontext angemessen.
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  choice: das Heiligtum, die Festung
  rationale: Die beiden bestimmten Substantive stehen unmittelbar nebeneinander. Die appositionelle Wiedergabe hält beide Begriffe sichtbar und löst ihre genaue syntaktische Beziehung nicht stillschweigend auf.
- source_word: וְהֵסִירוּ
  choice: wegnehmen
  rationale: Das Hiphil von סור bedeutet »entfernen« oder »wegnehmen«. Die Wahl beschreibt die Beseitigung, ohne über deren Dauer zu entscheiden.
- source_word: הַתָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: תמיד heißt wörtlich »das Regelmäßige/Beständige«, dient in Daniels Kultsprache jedoch als Kurzbezeichnung für das regelmäßig dargebrachte Opfer. »Brandopfer« macht den impliziten kultischen Bezug verständlich.
- source_word: וְנָתְנוּ
  choice: und … aufstellen
  rationale: נתן bedeutet wörtlich »geben, setzen, hinstellen«. Bei der Anbringung oder Installation des Gräuels ist »aufstellen« die natürliche deutsche Entsprechung.
- source_word: הַשִּׁקּוּץ
  choice: den Gräuel
  rationale: שקוץ bezeichnet etwas Abscheuliches, häufig einen götzendienerischen Gegenstand. »Gräuel« ist knapp, sachlich passend und in diesem biblischen Zusammenhang verständlich.
- source_word: מְשׁוֹמֵם
  choice: der Verwüstung bringt
  rationale: 'Das Partizip kann aktiv-kausativ verstanden werden: etwas, das verwüstet oder Verwüstung verursacht. Die Relativkonstruktion gibt diese Kraft natürlich wieder, ohne den möglichen Bedeutungsumfang zu verengen.'
theological_decisions:
- issue: Verhältnis von »Heiligtum« und »Festung« (הַמִּקְדָּשׁ הַמָּעוֹז)
  choice: das Heiligtum, die Festung
  alternative: das befestigte Heiligtum; die Heiligtumsfestung
  rationale: Das Hebräische verbindet die beiden bestimmten Substantive ohne ausdrückliches Bindewort. Die Apposition bewahrt diese gedrängte Mehrdeutigkeit, statt »Festung« eindeutig als bloßes Attribut festzulegen.
- issue: Bedeutung von הַתָּמִיד
  choice: das regelmäßige Brandopfer
  alternative: das regelmäßige Opfer; das Beständige
  rationale: Im kultischen Zusammenhang Daniels bezeichnet der substantivierte Ausdruck das regelmäßig dargebrachte Opfer. Die Ergänzung schafft Verständlichkeit; die Fußnote weist aus, dass im Hebräischen nur »das Regelmäßige/Beständige« steht.
- issue: Stimme und Wirkung von מְשׁוֹמֵם
  choice: der Verwüstung bringt
  alternative: der verwüstet; der Entsetzen hervorruft
  rationale: Die aktive beziehungsweise kausative Deutung passt zur Partizipialform und zum Kontext. Da die Wurzel auch Erstarrung oder Entsetzen ausdrücken kann, wird diese Nuance in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden zur besseren Lesbarkeit auf zwei Sätze verteilt. Kultische Schlüsselbegriffe bleiben erkennbar; kompakte oder mehrdeutige hebräische Konstruktionen werden im Haupttext beziehungsweise in den Fußnoten offengehalten.
