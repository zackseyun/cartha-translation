  text: וּ/מִן הִֽתְחַבְּר֥וּת אֵלָ֖י/ו יַעֲשֶׂ֣ה מִרְמָ֑ה וְ/עָלָ֥ה וְ/עָצַ֖ם בִּ/מְעַט גּֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: de
  text: Und nach dem Bündnis mit ihm wird er betrügerisch handeln; er wird aufsteigen und mit einem kleinen Volk[a] stark werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit nur wenigen Leuten“. Die knappe hebräische Wendung בִּמְעַט גּוֹי kann entweder ein kleines Volk oder eine geringe Zahl von Menschen bezeichnen, wodurch er stark wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הִתְחַבְּרוּת אֵלָיו
  choice: Und seit dem Bündnis mit ihm
  rationale: Die Verbindung aus מִן und dem Verbalnomen הִתְחַבְּרוּת bezeichnet den Ausgangspunkt seines Handelns. „Seit dem Bündnis mit ihm“ gibt den politischen Zusammenhang idiomatisch wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Wort für „Zeit“ einzufügen.
- source_word: יַעֲשֶׂה מִרְמָה
  choice: wird er betrügerisch handeln
  rationale: Die wörtliche Verbindung „Betrug tun“ wird in natürlichem Deutsch als „betrügerisch handeln“ wiedergegeben; מִרְמָה umfasst Täuschung und Arglist.
- source_word: וְעָלָה
  choice: er wird aufsteigen
  rationale: עלה kann „hinaufgehen“ oder „aufsteigen“ bedeuten. Hier passt „aufsteigen“ zum politischen Machtzuwachs und bleibt zugleich nahe am Bild des hebräischen Verbs.
- source_word: וְעָצַם
  choice: mächtig werden
  rationale: Das Verb bezeichnet das Erstarken beziehungsweise Mächtigwerden. Die Formulierung bewahrt den eintretenden Machtzuwachs.
- source_word: בִּמְעַט גּוֹי
  choice: mit einem kleinen Volk
  rationale: Die knappe hebräische Wendung lässt sich auf die geringe Größe eines Volkes oder auf eine geringe Zahl von Menschen beziehen. Im Haupttext bleibt „Volk“ als mögliche politische Größe erhalten; die alternative Zahlbedeutung wird in der Fußnote genannt.
