id: DAN.11.39
reference: Daniel 11:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: de
  text: Mit einem fremden Gott[b] wird er gegen die stärksten Festungen[a] vorgehen. Diejenigen, die er anerkennt[c], wird er hoch ehren; er wird sie über viele herrschen lassen und Land gegen Bezahlung zuteilen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen befestigte Bollwerke« beziehungsweise »für die Festungen der Bollwerke«. Die hebräische Wendung ist knapp und kann etwas unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mithilfe eines fremden Gottes«. Das Wort »mit« kann sowohl Begleitung als auch das eingesetzte Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »diejenigen, die ihn anerkennen«. Die hebräische Formulierung kann anders bezogen werden; die Verbform spricht jedoch am ehesten für »die er anerkennt«.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: »Land für einen Preis verteilen« beziehungsweise »Land als Belohnung zuteilen«. Die Wendung beschreibt eine Zuteilung gegen eine Gegenleistung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: wird … vorgehen
  rationale: עָשָׂה ist weit gefasst („tun, handeln“). Im militärisch-politischen Zusammenhang gibt „vorgehen“ die gegen die Festungen gerichtete Handlung natürlich wieder, ohne ihre konkrete Art näher festzulegen.
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: gegen die stärksten Festungen
  rationale: מִבְצָר bezeichnet eine befestigte Stätte oder Festung, מָעוֹז Stärke beziehungsweise einen starken Zufluchtsort. Die Verbindung lässt sich als verstärkender Ausdruck verstehen; לְ wird im Kontext als Richtung beziehungsweise feindliche Ausrichtung aufgefasst.
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: mit einem fremden Gott
  rationale: עִם bedeutet gewöhnlich „mit“. Die Formulierung lässt offen, ob der fremde Gott als Begleiter oder als Mittel seines Vorgehens gedacht ist.
- source_word: אֲשֶׁר הִכִּיר
  choice: Diejenigen, die er anerkennt
  rationale: Das Hifil von נכר bedeutet „erkennen, anerkennen“. Die Verbform in der 3. Person Singular legt den König als Subjekt nahe; die so bezeichneten Personen werden anschließend durch das Pluralsuffix in הִמְשִׁילָם wieder aufgenommen.
- source_word: יַרְבֶּה כָבוֹד
  choice: wird er hoch ehren
  rationale: Die knappe Wendung beschreibt ein Vermehren beziehungsweise reichliches Gewähren von Ehre. „hoch ehren“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: er wird sie über viele herrschen lassen
  rationale: Das Hifil von משל bedeutet „herrschen lassen, zum Herrscher machen“; בָּרַבִּים bezeichnet hier am wahrscheinlichsten die vielen Menschen, über die sie Macht erhalten.
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: Land gegen Bezahlung zuteilen
  rationale: אֲדָמָה bedeutet „Land, Boden“, das Piel von חלק „teilen, zuteilen“ und מְחִיר „Preis, Bezahlung“. Die Wiedergabe bewahrt den geschäftlichen beziehungsweise gegenleistungsbezogenen Charakter, ohne die Art der Zahlung festzulegen.
theological_decisions:
- issue: Bezug der anerkannten Personen
  choice: Der König erkennt bestimmte Personen an und belohnt sie mit Ehre und Herrschaft.
  alternative: Gemeint sein könnten Personen, die den fremden Gott oder den König anerkennen.
  rationale: 'Die hebräische Verbform nimmt am natürlichsten den König als Subjekt: „diejenigen, die er anerkennt“. So wird keine weitergehende Aussage darüber eingeführt, wen diese Personen religiös oder politisch anerkennen.'
- issue: Rolle des fremden Gottes
  choice: „Mit einem fremden Gott“ bleibt hinsichtlich Begleitung oder Mittel offen.
  alternative: „Mithilfe eines fremden Gottes“ würde ausdrücklich Instrumentalität ausdrücken.
  rationale: Die Präposition עִם erlaubt im Zusammenhang mehr als eine Nuance. Die offene Formulierung bewahrt die theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht den stark verdichteten hebräischen Satz lesbar, ohne die Mehrdeutigkeit der Präposition bei dem fremden Gott, des Festungsausdrucks oder der Anerkennungsformel aufzulösen.
