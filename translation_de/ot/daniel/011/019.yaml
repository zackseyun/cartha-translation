  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: de
  text: Dann wird er sein Gesicht den Festungen seines Landes zuwenden[a]. Doch er wird straucheln und fallen, und er wird nicht zu finden sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Bollwerken seines Landes“. Das hebräische Wort bezeichnet allgemein Orte der Stärke, des Schutzes oder der Verteidigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er wird nicht gefunden werden“. Die Formulierung besagt indirekt, dass er aus dem Geschehen verschwindet, ohne die Art oder den Grund dafür zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב
  choice: Dann wird er … zuwenden
  rationale: שׁוב bezeichnet hier mit פָּנָיו eine Richtungsänderung. „Dann“ gibt den erzählerischen Anschluss wieder; „zuwenden“ formuliert die Wendung im Deutschen natürlich.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: Die wörtliche Bildsprache bleibt erhalten und ist auch im Deutschen als Ausdruck der Ausrichtung verständlich.
- source_word: לְמָעוּזֵּי
  choice: den Festungen
  rationale: מָעוֹז bezeichnet einen Ort der Stärke, des Schutzes oder der Verteidigung. Im militärisch-politischen Zusammenhang passen „Festungen“; die breitere Alternative wird in der Fußnote genannt.
- source_word: אַרְצוֹ
  choice: seines Landes
  rationale: אֶרֶץ bezeichnet hier sein Land beziehungsweise Herrschaftsgebiet. Das possessive Suffix wird ohne die im Hebräischen nicht ausdrücklich vorhandene Verstärkung „eigenen“ wiedergegeben.
- source_word: וְנִכְשַׁל
  choice: Doch er wird straucheln
  rationale: Das Nifal von כשל bewahrt mit „straucheln“ die Bildsprache. „Doch“ macht den im Zusammenhang erkennbaren Gegensatz zwischen seiner Ausrichtung und seinem Scheitern deutlich.
- source_word: וְנָפַל
  choice: und fallen
  rationale: נפל bedeutet unmittelbar „fallen“ und bildet zusammen mit „straucheln“ die hebräische Abfolge ab.
- source_word: וְלֹא יִמָּצֵא
  choice: und er wird nicht zu finden sein
  rationale: Die passive Formulierung wahrt die indirekte Aussage des Hebräischen. Sie deutet sein Verschwinden aus dem Geschehen an, ohne Tod oder Sturz ausdrücklich festzulegen.
theological_decisions:
- issue: Art seines endgültigen Verschwindens
  choice: Die indirekte Formulierung „nicht zu finden sein“ bleibt bestehen.
  alternative: „Er wird umkommen“ oder „er wird beseitigt werden“.
  rationale: Der hebräische Text legt die konkrete Todes- oder Sturzart nicht ausdrücklich fest; eine eindeutigere Aussage würde die vorhandene Zurückhaltung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „sein Gesicht … zuwenden“ erhält bewusst das hebräische Bild; „straucheln und fallen“ bewahrt die knappe Steigerung des Ausgangstextes.
