  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Bedeutungen des Hebräischen zuverlässig wieder: Schiffe/Kittim kommen gegen ihn, er wird entmutigt, kehrt um, wütet gegen den heiligen Bund, handelt und richtet anschließend seine Aufmerksamkeit auf dessen Verlassende. Die zweimalige Wiedergabe von וְשָׁב mit „umkehren“ bewahrt die Struktur. Die offene Bedeutung von וְעָשָׂה bleibt zu Recht unergänzt.'
