  terminology: „Kittim“, „der heilige Bund“ und „die den heiligen Bund verlassen“ sind terminologisch sachgerecht. Die Fußnote zu Kittim erläutert die geographische beziehungsweise weitere maritime Bedeutung ohne historische Festlegung. Fußnote b markiert zutreffend die semantische Bandbreite von וְיָבֵן עַל.
