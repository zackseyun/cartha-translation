  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: de
  text: Denn Schiffe aus Kittim[a] werden gegen ihn kommen, und er wird den Mut verlieren. Dann wird er umkehren, gegen den heiligen Bund wüten und handeln. Er wird umkehren und sein Augenmerk auf die richten[b], die den heiligen Bund verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schiffe von Kittim“. Kittim kann Zypern oder allgemeiner westliche Seemächte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich denen zuwenden“ beziehungsweise „denen Beachtung schenken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: Schiffe aus Kittim
  rationale: צִיִּים bezeichnet im Kontext Seeschiffe oder Seestreitkräfte; כִּתִּים kann Kittim beziehungsweise Zypern und darüber hinaus westliche Seemächte bezeichnen. Die Wiedergabe wahrt den geografischen Ausdruck, ohne ihn vorschnell historisch festzulegen.
- source_word: וְנִכְאָה
  choice: und er wird den Mut verlieren
  rationale: Das Verb beschreibt, dass jemand entmutigt, eingeschüchtert oder gedemütigt wird. Die gewählte Formulierung passt zum militärisch-politischen Rückschlag und behauptet keine völlige Niederlage.
- source_word: וְשָׁב
  choice: er wird umkehren
  rationale: שׁוּב bezeichnet hier eine Umkehr beziehungsweise Kursänderung nach dem Rückschlag. „Umkehren“ ist im Deutschen knapp und anschaulich.
- source_word: וְזָעַם עַל
  choice: gegen … wüten
  rationale: Das Verb drückt heftigen Zorn oder feindselige Entrüstung gegen jemanden oder etwas aus. „Wüten“ gibt die aggressive Stoßrichtung natürlich wieder.
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: der heilige Bund
  rationale: Die direkte und etablierte Wiedergabe lässt offen, welche Aspekte des Bundes im Kontext besonders gemeint sind.
- source_word: וְעָשָׂה
  choice: und handeln
  rationale: Das allgemeine Verb bedeutet „tun, machen, handeln“. Die knappe Wiedergabe bewahrt die auffällige Unbestimmtheit des hebräischen Satzes und ergänzt kein unausgesprochenes Objekt.
- source_word: וְיָבֵן עַל
  choice: sein Augenmerk auf … richten
  rationale: Die Wendung kann bedeuten, jemanden zu beachten, zu berücksichtigen oder ihm verständnisvolle beziehungsweise wohlwollende Aufmerksamkeit zu schenken. Die Haupttextfassung bleibt bewusst relativ weit.
- source_word: עֹזְבֵי
  choice: die … verlassen
  rationale: Das Partizip bezeichnet Menschen, die den Bund aufgeben oder verlassen. Die Formulierung ist verständlich und vermeidet einen späteren theologischen Fachbegriff wie „Abtrünnige“.
theological_decisions:
- issue: Bezug des Ausdrucks „der heilige Bund“
  choice: Der Ausdruck bleibt ohne nähere Bestimmung als „der heilige Bund“ stehen.
  alternative: „der Bund Gottes mit Israel“ oder „der jüdische Bund“
  rationale: Der Zusammenhang weist auf den Bund hin, der mit dem heiligen Volk und seinem Gottesdienst verbunden ist; der hebräische Wortlaut nimmt die genauere Bestimmung hier jedoch nicht ausdrücklich vor.
- issue: Haltung gegenüber denen, die den Bund verlassen
  choice: „sein Augenmerk auf die richten“ wahrt die semantische Offenheit von וְיָבֵן עַל.
  alternative: „denen Beachtung schenken“, „für sie Verständnis zeigen“ oder „sich ihnen zuwenden“
  rationale: Im Kontext ist wahrscheinlich eine gezielte, womöglich wohlwollende Hinwendung gemeint. Die Übersetzung soll diese Möglichkeit erkennen lassen, aber die Haltung nicht eindeutiger als der Ausgangstext als Unterstützung oder Bündnis festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt der knappen Abfolge des Hebräischen, wird aber durch „Dann“ und eine natürliche deutsche Wortstellung lesbar gehalten. Die Wiederholung „Er wird umkehren“ bleibt erhalten, weil sie die Struktur des Ausgangstextes prägt.
