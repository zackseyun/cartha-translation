  text: וְ/עָמַ֖ד מֶ֣לֶךְ גִּבּ֑וֹר וּ/מָשַׁל֙ מִמְשָׁ֣ל רַ֔ב וְ/עָשָׂ֖ה כִּ/רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/003.yaml
  text: Then a mighty king will arise[a], and he will rule with great dominion and do as he pleases.
translation:
  language: de
  text: Dann wird ein mächtiger König aufstehen. Er wird mit großer Macht herrschen und tun, was ihm gefällt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמַד
  choice: Dann wird ... aufstehen
  rationale: עמד bezeichnet hier im Zusammenhang der prophetischen Abfolge das Auftreten eines Herrschers. „Aufstehen“ bewahrt das hebräische Bild und ist im Deutschen verständlich; וְ wird dem Fortgang entsprechend mit „Dann“ wiedergegeben.
- source_word: מֶלֶךְ גִּבּוֹר
  choice: ein mächtiger König
  rationale: גִּבּוֹר bezeichnet Stärke, Macht oder besondere Tatkraft. „Mächtig“ lässt sowohl die politische als auch die militärische Dimension offen.
- source_word: וּמָשַׁל
  choice: Er wird ... herrschen
  rationale: משׁל bezeichnet die Ausübung von Herrschaft. „Herrschen“ ist hier natürlich und führt die Aussage über die königliche Macht angemessen fort.
- source_word: מִמְשָׁל רַב
  choice: mit großer Macht
  rationale: Das mit משׁל verwandte Substantiv מִמְשָׁל bezeichnet Herrschaft beziehungsweise Herrschaftsgewalt. „Mit großer Macht“ gibt die Reichweite und Stärke seiner Herrschaft in natürlichem modernem Deutsch wieder, ohne zwingend ein Herrschaftsgebiet anzunehmen.
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: und tun, was ihm gefällt
  rationale: Die Wendung bezeichnet Handeln nach dem eigenen Willen oder Belieben und lässt ungehinderte Entscheidungsfreiheit erkennen. Die deutsche Formulierung ist idiomatisch und wahrt diese Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die inhaltliche Abfolge zu verändern. Es wird kein historischer Herrscher ausdrücklich identifiziert, da der Vers selbst keinen Namen nennt.
