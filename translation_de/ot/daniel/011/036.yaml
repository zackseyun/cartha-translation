source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: de
  text: Der König wird tun, was ihm gefällt. Er wird sich über jeden Gott erheben und großmachen. Gegen den Gott der Götter wird er Erstaunliches[a] reden. Er wird Erfolg haben, bis der Zorn zu Ende ist[b]; denn was beschlossen ist, wird ausgeführt werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Außergewöhnliches“ oder „Wunderbares“. Das hebräische Wort bezeichnet Staunenerregendes oder Außerordentliches; hier lässt der Zusammenhang an anmaßende, unerhörte Worte denken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis der Grimm vollständig vorüber ist“. Gemeint ist wahrscheinlich der göttliche Zorn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn das Festgesetzte wird geschehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: wird tun, was ihm gefällt
  rationale: Die Wendung bedeutet wörtlich, dass er nach seinem eigenen Willen handelt. Die gewählte Formulierung gibt diesen selbstbestimmten Anspruch in natürlichem modernem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck wird ohne eine nicht im Hebräischen enthaltene nähere Identifizierung wiedergegeben.
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  choice: wird sich selbst erhöhen und sich … großmachen
  rationale: Beide reflexiven Verben und ihre rhetorische Steigerung bleiben erhalten. „Sich selbst erhöhen“ und „sich großmachen“ bringen seine Selbstüberhebung klar zum Ausdruck.
- source_word: עַל כָּל אֵל
  choice: über jeden Gott
  rationale: Bei den Verben der Selbsterhöhung bezeichnet עַל hier bildlich eine beanspruchte Überlegenheit.
- source_word: וְעַל אֵל אֵלִים
  choice: gegen den Gott der Götter
  rationale: Beim Reden bezeichnet עַל die feindliche Ausrichtung der Worte. Der konstruktusartige Ausdruck wird als Titel des höchsten Gottes verstanden.
- source_word: יְדַבֵּר נִפְלָאוֹת
  choice: wird er Erstaunliches reden
  rationale: נִפְלָאוֹת bezeichnet Außergewöhnliches oder Staunenerregendes. „Erstaunliches“ bewahrt die lexikalische Weite, während der Zusammenhang den anmaßenden Charakter erkennen lässt.
- source_word: וְהִצְלִיחַ
  choice: wird Erfolg haben
  rationale: Die Form bezeichnet Gelingen oder Erfolg. „Erfolg haben“ ist im heutigen Deutsch natürlicher als „gedeihen“ und macht zugleich deutlich, dass dieser Erfolg nur vorläufig ist.
- source_word: עַד כָּלָה זַעַם
  choice: bis der Zorn zu Ende ist
  rationale: זַעַם kann Zorn oder Grimm, besonders göttlichen Zorn, bezeichnen. Die Übersetzung wahrt den wahrscheinlich göttlichen Bezug, ohne den Träger des Zorns ausdrücklich hinzuzufügen.
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: denn was beschlossen ist, wird ausgeführt werden
  rationale: Die Formulierung bewahrt sowohl die feststehende Entscheidung als auch deren tatsächliche Vollstreckung. Das unpersönliche „was“ entspricht der knappen, nicht näher bestimmten Aussage des Hebräischen.
theological_decisions:
- issue: Bezug und Großschreibung von אֵל אֵלִים
  choice: „der Gott der Götter“ als Bezeichnung des höchsten Gottes
  alternative: „der Gott der Götter“ als rein allgemeiner Gattungsausdruck
  rationale: Der König erhebt sich zunächst über jeden Gott und richtet dann seine Worte gegen den höchsten Gott. Die deutsche Großschreibung entspricht diesem wahrscheinlichen Bezug, ohne die Wendung weiter auszudeuten.
- issue: Bedeutung von זַעַם
  choice: „der Zorn“, mit wahrscheinlich göttlichem Bezug
  alternative: allgemeiner oder menschlicher Zorn
  rationale: Im prophetisch-apokalyptischen Zusammenhang Daniels liegt ein fest begrenzter Zeitraum göttlichen Zorns nahe. Der Haupttext nennt jedoch keinen Besitzer des Zorns und bewahrt damit die formale Offenheit des Hebräischen.
- issue: Vorläufiger Erfolg des Königs und feststehender Ausgang
  choice: Sein Erfolg dauert nur bis zum festgesetzten Ende; der Beschluss wird ausgeführt
  alternative: Sein Erfolg sei uneingeschränkt oder der Beschluss nur eine Möglichkeit
  rationale: Die Verbindung von עַד mit der abschließenden Begründung begrenzt den Erfolg ausdrücklich und stellt die Ausführung des Beschlossenen als gewiss dar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Satzführung. Die parallelen Verben der Selbstüberhebung und die Spannung zwischen zeitweiligem Erfolg und festgesetztem Ende bleiben erhalten. Nicht ausdrücklich genannte Referenten werden im Haupttext nicht ergänzt.
