source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: de
  text: Und in jenen Zeiten werden sich viele gegen den König des Südens erheben, und Gewalttätige aus deinem Volk[a] werden sich selbst erhöhen[b], um die Vision zu verwirklichen[c]; doch sie werden scheitern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „die Söhne der Gewalttätigen deines Volkes“; auch möglich: „Gesetzlose aus deinem Volk“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sich erheben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „um die Vision aufzurichten“; auch möglich: „um die Vision zu erfüllen“ oder „zu bestätigen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: Und in jenen Zeiten
  rationale: Der Plural עִתִּים bezeichnet Zeitabschnitte innerhalb des geschichtlichen Ablaufs; „in jenen Zeiten“ bewahrt diese zeitliche Rahmung natürlich.
- source_word: רַבִּים יַעַמְדוּ עַל
  choice: werden sich viele gegen … erheben
  rationale: עמד על bezeichnet hier im Konfliktzusammenhang feindliches Auftreten oder Widerstand; „sich gegen … erheben“ gibt dies idiomatisch wieder.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: den König des Südens
  rationale: נֶגֶב dient in Daniel 11 als geopolitische Richtungsbezeichnung und meint nicht bloß die Landschaft Negev.
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: Auch gewalttätige Leute aus deinem Volk
  rationale: Die schwierige Konstruktion lautet wörtlich etwa „Söhne der Gewalttätigen deines Volkes“. Die Wiedergabe bezeichnet eine durch Gewalttätigkeit beziehungsweise Gesetzesbruch charakterisierte Gruppe, ohne sie näher zu identifizieren.
- source_word: יִנַּשְּׂאוּ
  choice: werden sich erheben
  rationale: Die reflexive Verbform kann Selbstüberhebung oder selbstbewusstes Aufbegehren ausdrücken. „Sich erheben“ bewahrt das Bild und passt zum politischen Zusammenhang.
- source_word: לְהַעֲמִיד חָזוֹן
  choice: um die Vision zu verwirklichen
  rationale: העמיד bedeutet wörtlich „zum Stehen bringen, aufrichten, bestätigen“. Im Zusammenhang einer Vision bezeichnet die Wendung wahrscheinlich den Versuch, das Geschaute eintreten zu lassen; die wörtlichere Alternative bleibt in der Fußnote erhalten.
- source_word: וְנִכְשָׁלוּ
  choice: doch sie werden scheitern
  rationale: כשל bedeutet wörtlich „stolpern“ und kann übertragen das Misslingen oder den Untergang bezeichnen. „Scheitern“ ist hier im Deutschen natürlich; das Bild wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Identität und Charakterisierung von וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: gewalttätige Leute aus deinem Volk
  alternative: Söhne der Gewalttätigen deines Volkes; Gesetzlose aus deinem Volk
  rationale: Die Übersetzung wahrt die negative Charakterisierung, legt die Gruppe aber nicht auf eine spätere religiöse oder politische Identifikation fest.
- issue: Bedeutung von לְהַעֲמִיד חָזוֹן
  choice: die Vision zu verwirklichen
  alternative: die Vision aufzurichten / zu bestätigen
  rationale: Die Zielrichtung kann das Herbeiführen dessen meinen, was die Vision ankündigt, während der hebräische Ausdruck wörtlicher vom Aufrichten spricht. Die Fußnote hält diese Spannung offen.
- issue: Ergebnis von וְנִכְשָׁלוּ
  choice: sie werden scheitern
  alternative: sie werden stolpern / zu Fall kommen
  rationale: Die kontextuelle Wiedergabe bezeichnet das Misslingen, ohne auszuschließen, dass das hebräische Bild zugleich ihren Fall oder Untergang andeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit. „Vision“ bewahrt Daniels prophetische Terminologie; die schwierigen hebräischen Wendungen werden im Haupttext lesbar wiedergegeben und in den Fußnoten transparent gehalten.
