id: DAN.11.13
reference: Daniel 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁב֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/הֶעֱמִ֣יד הָמ֔וֹן רַ֖ב מִן הָ/רִאשׁ֑וֹן וּ/לְ/קֵ֨ץ הָֽ/עִתִּ֤ים שָׁנִים֙ יָ֣בוֹא ב֔וֹא בְּ/חַ֥יִל גָּד֖וֹל וּ/בִ/רְכ֥וּשׁ רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: de
  text: Dann wird der König des Nordens zurückkehren und eine größere Streitmacht als die frühere aufstellen[a]. Nach Ablauf der Zeiten, nach Jahren[b], wird er ganz gewiss mit einem großen Heer und umfangreicher Ausrüstung[c] kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Menge, größer als die frühere“. Das hebräische הָמוֹן bezeichnet eine Menge oder Masse; im Zusammenhang ist eine Streitmacht gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Am Ende der festgesetzten Zeiten, nach Jahren“. Die hebräische Zeitangabe ist gedrängt formuliert und kann den Ablauf eines festgesetzten Zeitraums betonen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit umfangreichen Vorräten“ beziehungsweise „mit großem Besitz“. Das hebräische Wort bezeichnet allgemein Besitz, Güter oder Ressourcen, die das Heer begleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Dann wird ... zurückkehren
  rationale: שׁוּב bedeutet im Qal gewöhnlich „zurückkehren“. Das וְ führt die Handlung fort; „Dann“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: der König des Nordens
  rationale: Die formnahe Wiedergabe bewahrt die im Kapitel etablierte Richtungsbezeichnung des Königs.
- source_word: וְהֶעֱמִיד
  choice: wird ... aufstellen
  rationale: Der Hifil von עמד bezeichnet hier das Bereitstellen oder Aufbieten einer Streitmacht. „Aufstellen“ ist im militärischen Zusammenhang idiomatisch und bleibt nahe am Bild des Grundworts.
- source_word: הָמוֹן רַב
  choice: eine größere Streitmacht
  rationale: הָמוֹן bezeichnet eine große Menschenmenge oder Masse und hat hier militärischen Bezug. Das Adjektiv רַב wird zusammen mit dem folgenden Vergleich מִן הָרִאשׁוֹן als „größer ... als“ wiedergegeben.
- source_word: מִן הָרִאשׁוֹן
  choice: als die frühere
  rationale: Das vergleichende מִן bezieht die neue Streitmacht auf die vorherige. „Die frühere“ macht den im Hebräischen elliptischen Bezug im Deutschen verständlich.
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: Nach Ablauf der Zeiten, nach Jahren
  rationale: Die gedrängte Formulierung wird bewusst nicht zu einer einzigen Zeitangabe eingeebnet. קֵץ bezeichnet das Ende beziehungsweise den Ablauf, עִתִּים Zeiten oder festgesetzte Zeiten, und שָׁנִים Jahre.
- source_word: יָבוֹא בּוֹא
  choice: wird er ganz gewiss ... kommen
  rationale: Infinitivus absolutus und finites Verb desselben Stammes verstärken die Aussage. „Ganz gewiss“ bildet diese Hervorhebung im Deutschen deutlich ab.
- source_word: בְּחַיִל גָּדוֹל
  choice: mit einem großen Heer
  rationale: חַיִל kann Kraft, Vermögen oder Heer bedeuten; der Feldzugskontext spricht hier für „Heer“.
- source_word: וּבִרְכוּשׁ רָב
  choice: und umfangreicher Ausrüstung
  rationale: רְכוּשׁ bezeichnet Besitz, Güter oder materielle Ressourcen. „Ausrüstung“ passt zum militärischen Kontext, ohne den Ausdruck auf Reichtum zu beschränken.
