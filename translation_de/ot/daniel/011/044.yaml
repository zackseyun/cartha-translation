source:
  edition: WLC
  text: וּ/שְׁמֻע֣וֹת יְבַהֲלֻ֔/הוּ מִ/מִּזְרָ֖ח וּ/מִ/צָּפ֑וֹן וְ/יָצָא֙ בְּ/חֵמָ֣א גְדֹלָ֔ה לְ/הַשְׁמִ֥יד וּֽ/לְ/הַחֲרִ֖ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: de
  text: Doch Nachrichten aus dem Osten und aus dem Norden werden ihn in Bestürzung versetzen[a], und er wird mit großem Zorn ausziehen, um viele zu vernichten und der Vernichtung zu weihen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden ihn erschrecken“ oder „werden ihn beunruhigen“. Für „Nachrichten“ sind auch „Meldungen“ oder „Gerüchte“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann „mit dem Bann belegen“ oder „der Vernichtung weihen“ bedeuten; es ist stärker und spezifischer als das vorhergehende „vernichten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: Nachrichten
  rationale: Der Plural bezeichnet Gehörtes, hier eintreffende Nachrichten oder Meldungen. „Nachrichten“ ist modern und neutral; „Gerüchte“ wäre ebenfalls möglich, würde aber einen unsicheren Wahrheitsgehalt stärker hervorheben.
- source_word: יְבַהֲלֻהוּ
  choice: werden ihn in Bestürzung versetzen
  rationale: Der Piel von בהל drückt verursachte plötzliche Unruhe, Bestürzung oder Schrecken aus. Die Formulierung gibt die kausative und intensive Wirkung wieder, ohne volle Todesangst vorauszusetzen.
- source_word: מִמִּזְרָח
  choice: aus dem Osten
  rationale: Die Richtungsangabe mit מן wird im Deutschen natürlich mit „aus dem Osten“ wiedergegeben.
- source_word: וּמִצָּפוֹן
  choice: und aus dem Norden
  rationale: Die Wiedergabe bewahrt die Parallelität zur vorhergehenden Richtungsangabe.
- source_word: וְיָצָא
  choice: Dann wird er ... ausziehen
  rationale: יצא bedeutet grundsätzlich hinausgehen; „ausziehen“ ist im vorliegenden militärischen Zusammenhang natürlich, ohne eine bestimmte Marschbewegung hinzuzufügen. „Dann“ macht den erzählerischen Fortgang des וְ idiomatisch deutlich.
- source_word: בְּחֵמָא גְדֹלָה
  choice: in großem Zorn
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm. „In großem Zorn“ ist würdig, verständlich und bewahrt die Intensität.
- source_word: לְהַשְׁמִיד
  choice: zu vernichten
  rationale: Der Hifil-Infinitiv von שׁמד bedeutet zerstören oder vernichten. „Vernichten“ passt zum militärischen Zusammenhang und lässt dennoch Raum für die stärkere, besondere Nuance des folgenden חרם.
- source_word: וּלְהַחֲרִים
  choice: und dem Untergang zu weihen
  rationale: Der Hifil von חרם kann bedeuten, jemanden dem Bann beziehungsweise der Vernichtung zu weihen. Die Formulierung erhält den besonderen Weihe- und Bannaspekt und setzt das Wort nicht einfach mit dem vorhergehenden „vernichten“ gleich.
- source_word: רַבִּים
  choice: viele
  rationale: Die substantivierte Pluralform wird direkt und natürlich mit „viele“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חרם in einem militärischen Gerichtskontext
  choice: dem Untergang weihen
  alternative: völlig vernichten; mit dem Bann belegen
  rationale: Der hebräische Text unterscheidet לְהַשְׁמִיד von וּלְהַחֲרִים. Daher bleibt im Deutschen ein Bedeutungsunterschied erhalten. „Dem Untergang weihen“ bringt den besonderen Bann- beziehungsweise Weiheaspekt zum Ausdruck, ohne eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht den Handlungsfortgang gut verständlich. „In Bestürzung versetzen“ wahrt die Intensität des Verbs, und „dem Untergang weihen“ erhält die besondere Nuance von חרם, ohne altertümlich unverständlich zu werden.
