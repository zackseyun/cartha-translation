base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: de
  text: Und wenn die Menge hinweggerissen wird[a], wird er überheblich werden[b]. Er wird Zehntausende zu Fall bringen, aber nicht erstarken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Menge wird emporgehoben/weggenommen.“ Das hebräische Verb kann „emporgehoben“, „fortgetragen“ oder „weggenommen“ bedeuten; im militärischen Zusammenhang liegt die Deutung nahe, dass die Menge fortgeführt oder weggenommen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Herz wird sich erheben“ – eine hebräische Wendung für Stolz oder Überheblichkeit.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „aber er wird sich nicht durchsetzen.“ Das Hebräische kann entweder fehlende Stärke beziehungsweise Festigung oder ausbleibenden Erfolg betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: Und wenn ... weggerafft ist
  rationale: Das Nifal von נשׂא kann „emporgehoben“, „fortgetragen“ oder „weggenommen“ bedeuten. Im militärischen Zusammenhang bezeichnet es am ehesten die Beseitigung beziehungsweise Niederlage der Menge. Die zeitliche Wiedergabe mit „wenn“ bildet den Zusammenhang der Satzfolge natürlich ab.
- source_word: הֶהָמוֹן
  choice: die Menge
  rationale: הָמוֹן bezeichnet eine große Menschenmenge oder Masse. Obwohl hier wohl ein Heer gemeint ist, wahrt „die Menge“ die lexikalische Breite.
- source_word: ירום לְבָבוֹ
  choice: sein Herz wird überheblich werden
  rationale: Die Wendung „sein Herz erhebt sich“ bezeichnet Stolz oder Hochmut. „Sein Herz wird überheblich werden“ bewahrt das Herzmotiv und vermittelt den idiomatischen Sinn in verständlichem Deutsch.
- source_word: וְהִפִּיל
  choice: er wird ... zu Fall bringen
  rationale: Das Hifil von נפל bedeutet „fallen lassen“ beziehungsweise „zu Fall bringen“. Diese Formulierung wahrt den kausativen Sinn und passt zum militärischen Kontext.
- source_word: רִבֹּאוֹת
  choice: Zehntausende
  rationale: Der Plural רִבֹּאוֹת bezeichnet Zehntausende oder Myriaden. „Zehntausende“ ist im modernen Deutschen klar und bildet die Mehrzahl ab.
- source_word: וְלֹא יָעוֹז
  choice: aber nicht erstarken
  rationale: Das Verb kann „stark sein“, „stark werden“ oder kontextuell „sich durchsetzen“ bedeuten. „Nicht erstarken“ bleibt nahe an der Grundbedeutung und lässt offen, ob fehlende Kraft, Konsolidierung oder letztlicher Erfolg gemeint ist.
theological_decisions:
- issue: Ergebnis seines militärischen Erfolgs
  choice: aber nicht erstarken
  alternative: aber sich nicht durchsetzen
  rationale: Die Übersetzung vermeidet es, die offene Bedeutung des Verbs vorschnell auf endgültigen Sieg oder bloße Machtausweitung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache bleibt erhalten; „weggerafft“ verdeutlicht die Niederlage, ohne הֶהָמוֹן ausdrücklich als Heer festzulegen. Alle Alternativen mit wesentlicher lexikalischer Mehrdeutigkeit werden in Fußnoten ausgewiesen.
