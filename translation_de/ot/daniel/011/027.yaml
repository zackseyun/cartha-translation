base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: de
  text: Beide Könige haben Böses im Sinn. Am selben Tisch werden sie Falsches reden[a]. Doch es wird nicht gelingen[b], denn das Ende ist noch für die festgesetzte Zeit bestimmt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sie Lügen reden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Doch es wird keinen Erfolg haben.“ Das hebräische Verb steht in der weiblichen Einzahl und bezieht sich wahrscheinlich unpersönlich auf ihr Vorhaben oder dessen Ausgang.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn das Ende steht noch für die festgesetzte Zeit aus“. Die Formulierung betont, dass der Ausgang weiterhin an einen bestimmten Zeitpunkt gebunden ist.'
    reason: clarification
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: Beide Könige
  rationale: Die Wortgruppe bezeichnet die beiden bereits im Zusammenhang genannten Herrscher. Das einleitende וּ kann im Deutschen unmarkiert bleiben; „Beide Könige“ gibt den Bezug knapp und natürlich wieder.
- source_word: לְבָבָם לְמֵרָע
  choice: haben Böses im Sinn
  rationale: Die hebräische Wendung beschreibt ihre innere, feststehende böse Absicht. Die deutsche Redewendung bewahrt diesen Sinn in natürlicher Gegenwartssprache, ohne die Absicht näher auszudeuten.
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: Am selben Tisch
  rationale: Die Formulierung erhält das konkrete Bild eines gemeinsamen Tisches und gibt אֶחָד im gegebenen Zusammenhang idiomatisch als „demselben“ wieder.
- source_word: כָּזָב יְדַבֵּרוּ
  choice: werden sie Falsches reden
  rationale: כָּזָב bezeichnet Lüge oder Falschheit. „Falsches reden“ wahrt die sprachliche Form des Hebräischen und lässt offen, ob vor allem gegenseitige Täuschung oder allgemein unwahre Rede gemeint ist.
- source_word: וְלֹא תִצְלָח
  choice: Doch es wird nicht gelingen
  rationale: Das feminine Singularverb steht wahrscheinlich unpersönlich und bezieht sich sinngemäß auf ihr Vorgehen, ihren Plan oder dessen Ausgang. Das unbestimmte „es“ vermeidet, einen im Hebräischen nicht ausdrücklich genannten Bezug festzulegen.
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: denn das Ende kommt erst zur festgesetzten Zeit
  rationale: Die Wiedergabe drückt verständlich aus, dass der Ausgang noch aussteht und an einen bestimmten Zeitpunkt gebunden ist. „Festgesetzte Zeit“ gibt מוֹעֵד hier als bestimmten Termin wieder, nicht als Festversammlung.
theological_decisions:
- issue: Göttliche Souveränität in der festgesetzten Zeit des Endes
  choice: Die zeitliche Festsetzung wird bewahrt, ohne Gott ausdrücklich als den Handelnden zu nennen.
  alternative: „denn das Ende kommt erst zu der von Gott festgesetzten Zeit“
  rationale: Der weitere Zusammenhang des Danielbuches legt Gottes Herrschaft über den geschichtlichen Ablauf nahe; in diesem Satz wird Gott jedoch nicht ausdrücklich genannt. Die Übersetzung macht die Folgerung daher nicht expliziter als der Ausgangstext.
- issue: Bezug des nicht gelingenden Vorhabens
  choice: Unpersönliches „es“
  alternative: „Doch ihr Plan wird nicht gelingen“
  rationale: Das feminine Singularverb kann sich sinngemäß auf Plan, Täuschung oder Ausgang beziehen, doch kein entsprechendes Bezugswort steht ausdrücklich im hebräischen Satz. Das unpersönliche „es“ erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze machen den Gegensatz zwischen gemeinsamer böser Absicht, gegenseitiger Falschheit und dem ausbleibenden Erfolg klar. Die Übersetzung vermeidet altertümliche Ausdrücke und ergänzt weder einen ausdrücklich genannten Plan noch Gott als grammatisches Subjekt.
