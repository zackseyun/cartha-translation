source:
  edition: WLC
  text: וְ/עָמַ֤ד עַל כַּנּ/וֹ֙ נִבְזֶ֔ה וְ/לֹא נָתְנ֥וּ עָלָ֖י/ו ה֣וֹד מַלְכ֑וּת וּ/בָ֣א בְ/שַׁלְוָ֔ה וְ/הֶחֱזִ֥יק מַלְכ֖וּת בַּ/חֲלַקְלַקּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: de
  text: An seiner Stelle wird ein Verachteter auftreten, dem man die königliche Würde nicht verliehen hatte. Er wird in aller Ruhe[a] kommen und die Königsherrschaft durch Schmeicheleien[b] an sich bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbehelligt“ beziehungsweise „in Sicherheit“ (בְשַׁלְוָה). Das Wort kann eine Lage der Ruhe oder Sicherheit ebenso bezeichnen wie ein unauffälliges, nicht offen gewaltsames Vorgehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch Ränke“ (בַּחֲלַקְלַקּוֹת). Wörtlich liegt die Vorstellung von „glatten“ Worten oder Handlungen zugrunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: An seiner Stelle wird … auftreten
  rationale: Die Wendung bezeichnet im Zusammenhang die Nachfolge in der Stellung des Vorgängers; „auftreten“ gibt עמד in diesem politischen Nachfolgekontext natürlich und mit zukünftigem Sinn wieder.
- source_word: נִבְזֶה
  choice: ein Verachteter
  rationale: Das Wort bezeichnet einen Menschen, der geringgeschätzt oder verachtet wird. Die substantivierte Form bewahrt den passiven Bedeutungsakzent, ohne zusätzliche moralische Wertungen einzutragen.
- source_word: וְלֹא נָתְנוּ עָלָיו הוֹד מַלְכוּת
  choice: dem man die königliche Würde nicht verliehen hatte
  rationale: הוֹד מַלְכוּת meint die Würde oder Hoheit des Königtums. Das unbestimmte deutsche „man“ gibt das nicht näher bezeichnete pluralische Subjekt idiomatisch wieder; das Plusquamperfekt macht deutlich, dass keine ordnungsgemäße Verleihung vorausging.
- source_word: וּבָא בְשַׁלְוָה
  choice: Er wird in aller Ruhe kommen
  rationale: שַׁלְוָה kann Ruhe, Sicherheit oder Sorglosigkeit bezeichnen. „In aller Ruhe“ lässt offen, ob eine friedliche Lage, ein unauffälliges Vorgehen oder scheinbare Sicherheit gemeint ist.
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: die Königsherrschaft … an sich bringen
  rationale: Die Hifilform von חזק bezeichnet hier das Erlangen beziehungsweise feste Ergreifen der Herrschaft. „An sich bringen“ passt zu einer nicht regulär verliehenen Machtübernahme, ohne notwendig offene Gewalt vorauszusetzen.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: durch Schmeicheleien
  rationale: Das Wort beruht auf dem Bild des Glatten und bezeichnet glatte, täuschende Rede oder entsprechende Machenschaften. „Schmeicheleien“ erhält dieses konkrete sprachliche Mittel; die breitere politische Deutung wird in der Fußnote genannt.
