id: DAN.11.40
reference: Daniel 11:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/עֵ֣ת קֵ֗ץ יִתְנַגַּ֤ח עִמּ/וֹ֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יִשְׂתָּעֵ֨ר עָלָ֜י/ו מֶ֣לֶךְ הַ/צָּפ֗וֹן בְּ/רֶ֨כֶב֙ וּ/בְ/פָ֣רָשִׁ֔ים וּ/בָ/אֳנִיּ֖וֹת רַבּ֑וֹת וּ/בָ֥א בַ/אֲרָצ֖וֹת וְ/שָׁטַ֥ף וְ/עָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: de
  text: Zur Zeit des Endes wird der König des Südens mit ihm[a] zusammenstoßen[b], und der König des Nordens wird mit Streitwagen, Reitern und vielen Schiffen gegen ihn heranstürmen[c]. Er wird in die Länder[d] eindringen, sie überfluten und hindurchziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auf wen sich „ihm“ und das folgende „ihn“ beziehen, wird im hebräischen Text nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: b
    text: Wörtlich schwingt das Bild des Stoßens oder Hornstoßens mit; gemeint ist ein feindlicher Zusammenprall.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird wie ein Sturm gegen ihn heranbrausen“. Das Verb bezeichnet ein heftiges, sturmartiges Heranstürmen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Gebiete“ beziehungsweise „Ländereien“. Der hebräische Plural kann mehrere Länder oder Territorien bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: Zur Zeit des Endes
  rationale: Die Wendung bezeichnet die abschließende beziehungsweise bestimmte Endzeit, ohne deren genaue zeitliche Einordnung festzulegen.
- source_word: יִתְנַגַּח עִמּוֹ
  choice: wird mit ihm zusammenstoßen
  rationale: Das Hitpael von נגח erinnert wörtlich an das Stoßen mit Hörnern und bezeichnet hier bildhaft einen feindlichen Zusammenprall. „Zusammenstoßen“ bewahrt dieses Bild besser als das allgemeinere „angreifen“.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: der König des Südens
  rationale: Die wiederkehrende geopolitische Bezeichnung in Daniel 11 wird richtungsbezogen und verständlich wiedergegeben.
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: wird gegen ihn heranstürmen
  rationale: Das Verb bezeichnet ein heftiges, sturmartiges Heranbrausen. „Heranstürmen“ gibt sowohl die Gewalttätigkeit als auch die Bewegungsrichtung natürlich wieder.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: der König des Nordens
  rationale: Die wiederkehrende geopolitische Bezeichnung wird parallel zu „König des Südens“ übersetzt.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: mit Streitwagen, Reitern und vielen Schiffen
  rationale: Der kollektive Singular רֶכֶב wird im Deutschen natürlich als Plural wiedergegeben; פָרָשִׁים bezeichnet berittene Kämpfer.
- source_word: וּבָא בָאֲרָצוֹת
  choice: Er wird in die Länder eindringen
  rationale: אֲרָצוֹת kann Länder, Gebiete oder Territorien bezeichnen. „Eindringen“ entspricht im militärischen Zusammenhang der Bewegung in diese Länder, ohne sie genauer zu bestimmen.
- source_word: וְשָׁטַף וְעָבָר
  choice: sie überfluten und hindurchziehen
  rationale: שׁטף bewahrt das Bild einer überwältigenden Flut, während עבר die anschließende Bewegung durch die Gebiete hindurch bezeichnet.
theological_decisions:
- issue: Bezug der Pronomen „ihm“ und „ihn“
  choice: Die Pronomen bleiben ohne ausdrückliche Identifizierung ihres Bezugs stehen.
  alternative: Den Bezug als den zuvor beschriebenen Herrscher oder als eine bestimmte endzeitliche Gestalt ausdrücklich benennen.
  rationale: Der hebräische Vers nennt an dieser Stelle nur das Pronomen. Eine ausdrückliche Identifizierung würde eine umstrittene kontextuelle beziehungsweise eschatologische Deutung in den Text eintragen.
- issue: Bedeutung von „Zeit des Endes“
  choice: Die offene zeitliche Formulierung bleibt erhalten.
  alternative: Die Wendung ausdrücklich als letzte Weltzeit oder als Abschluss eines bestimmten historischen Zeitraums deuten.
  rationale: Der Ausdruck trägt Endzeitcharakter, bestimmt hier aber nicht für sich allein Art, Umfang oder genaue Chronologie dieses Endes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Bildsprache. Die wiederkehrenden Titel „König des Südens“ und „König des Nordens“ werden parallel formuliert; strittige Bezüge und die genaue endzeitliche Einordnung bleiben offen.
