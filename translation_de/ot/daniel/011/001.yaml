revisions:
- from: Und ich stand im ersten Jahr des Meders Darius auf, um ihn zu stärken und ihm eine Schutzwehr zu sein.[a]
  to: Und ich stand im ersten Jahr des Darius, des Meders, um ihn zu stärken und ihm eine Festung zu sein.[a]
  rationale: Die Revision ersetzt den weniger natürlichen und semantisch verengenden Ausdruck „Schutzwehr“ durch „Festung“ und gibt עמדתי ohne die zusätzliche Nuance von „aufstehen“ wieder. Die Satzstellung mit „Darius, des Meders“ entspricht geläufigem modernem Standarddeutsch und lässt die historische Bezeichnung klar erkennen. Die Anmerkung bleibt als sachgerechter Hinweis auf die abweichende Verseinteilung erhalten.
