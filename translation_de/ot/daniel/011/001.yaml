source:
  edition: WLC
  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: de
  text: Und ich stand im ersten Jahr des Darius, des Meders, um ihn zu stärken und ihm eine Festung zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers gehört in der hebräischen Überlieferung zu Daniel 11,1; andere Verseinteilungen verbinden ihn ganz oder teilweise mit dem Abschluss von Kapitel 10.
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich
  rationale: Die Konjunktion und das selbstständige Pronomen markieren den Anschluss und betonen den Sprecher leicht. „Und ich“ ist im Deutschen natürlich und bewahrt den Zusammenhang mit dem vorangehenden Abschnitt.
- source_word: בִּשְׁנַת אַחַת
  choice: im ersten Jahr
  rationale: Bei der Datierung nach Regierungsjahren bezeichnet die Wendung idiomatisch das erste Jahr.
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: des Meders Darius
  rationale: Die Präposition bezeichnet bei dieser Datierungsform den Herrscher, dessen Regierungsjahr gemeint ist. „Der Meder“ wird als Bezeichnung der Herkunft wiedergegeben.
- source_word: עָמְדִי
  choice: stand ... auf
  rationale: עמד bedeutet „stehen“ beziehungsweise „sich hinstellen/auftreten“. Im Kontext aktiver Hilfe gibt „stand ... auf“ die Handlung angemessen wieder, ohne eine weitergehende Identifizierung des Sprechers einzutragen.
- source_word: לְמַחֲזִיק
  choice: um ihn zu stärken
  rationale: Der Infinitiv der Hifil-Form von חזק bezeichnet das Stärken oder Festigen. Das Objekt „ihn“ nimmt den folgenden pronominalen Bezug im natürlichen Deutschen vorweg.
- source_word: וּלְמָעוֹז לוֹ
  choice: und ihm eine Schutzwehr zu sein
  rationale: מָעוֹז ist ein Substantiv und bezeichnet eine befestigte Zuflucht, Festung oder Schutzwehr. Die Wiedergabe bewahrt die nominale Metapher und das לֹו im Sinn von „für/zu seinen Gunsten“.
theological_decisions:
- issue: Bezug des Sprechers und des Pronomens
  choice: Der Sprecher setzt seine Rede aus dem vorhergehenden Zusammenhang fort; „ihn/ihm“ bezieht sich am naheliegendsten auf Darius den Meder.
  alternative: Eine andere Abschnitts- oder Verseinteilung kann den Vers enger als Abschluss des vorangehenden Kapitels erscheinen lassen; außerdem könnte der pronominale Bezug diskutiert werden.
  rationale: Die Übersetzung folgt dem unmittelbaren syntaktischen Zusammenhang, ohne den Sprecher genauer zu identifizieren oder spekulative Aussagen über Darius einzutragen.
- issue: Bildhafte Bedeutung von מָעוֹז
  choice: Die substantivische Metapher wird mit „eine Schutzwehr sein“ erhalten.
  alternative: Funktional wäre auch „ihn schützen“ möglich; wörtlicher kommen „ihm eine Festung/ein starker Halt sein“ infrage.
  rationale: Die hebräische Form bezeichnet nicht unmittelbar die Tätigkeit des Schützens, sondern etwas, das Stärke und Schutz bietet. Die bildhafte Spannung sollte nicht stillschweigend in ein Verb aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist zugunsten natürlicher deutscher Lesbarkeit angepasst; „Schutzwehr“ erhält das konkrete Festungsbild des hebräischen Substantivs, ohne altertümlich zu klingen.
