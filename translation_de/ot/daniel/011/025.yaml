  text: וְ/יָעֵר֩ כֹּח֨/וֹ וּ/לְבָב֜/וֹ עַל מֶ֣לֶךְ הַ/נֶּגֶב֮ בְּ/חַ֣יִל גָּדוֹל֒ וּ/מֶ֣לֶךְ הַ/נֶּ֗גֶב יִתְגָּרֶה֙ לַ/מִּלְחָמָ֔ה בְּ/חַֽיִל גָּד֥וֹל וְ/עָצ֖וּם עַד מְאֹ֑ד וְ/לֹ֣א יַעֲמֹ֔ד כִּֽי יַחְשְׁב֥וּ עָלָ֖י/ו מַחֲשָׁבֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: de
  text: Er wird seine Kraft und seinen Mut gegen den König des Südens aufbieten und mit einem großen Heer gegen ihn ziehen. Der König des Südens aber wird mit einem überaus großen und starken Heer in den Kampf ziehen; doch er wird nicht standhalten[a], denn sie werden Pläne gegen ihn schmieden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „er wird nicht stehen“; auch: „er wird sich nicht behaupten“ oder „seine Stellung nicht halten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „sie werden gegen ihn intrigieren“. Im Hebräischen steht eine verwandte Wortverbindung, wörtlich etwa: „sie werden Gedanken gegen ihn denken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  choice: Er wird seine Kraft und seinen Mut … aufbieten
  rationale: Das Hifil von עור bezeichnet hier das Mobilisieren oder Aufbieten; לֵבָב meint im militärischen Zusammenhang die innere Entschlossenheit bzw. den Mut. Die Wiedergabe ist natürliches Deutsch und bewahrt beide Aspekte der Wendung.
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: gegen den König des Südens
  rationale: נֶגֶב ist in Daniel 11 eine geopolitische Richtungsbezeichnung; „Süden“ ist daher klarer als „Negev“.
- source_word: בְּחַיִל גָּדוֹל
  choice: mit einem großen Heer gegen ihn ziehen
  rationale: חַיִל bezeichnet hier ein Heer bzw. eine Streitmacht. „Gegen ihn ziehen“ macht die durch עַל bezeichnete militärische Ausrichtung im Deutschen deutlich, ohne das Bild unnötig auszubauen.
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: wird sich … zum Krieg rüsten
  rationale: Das Hitpael von גרה beschreibt, dass sich jemand zum Kampf anspornt oder auf einen Krieg einlässt. „Sich zum Krieg rüsten“ gibt die aktive Vorbereitung in idiomatischem Deutsch wieder.
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: mit einem überaus großen und starken Heer
  rationale: Die Formulierung erhält sowohl Größe als auch Stärke des Heeres und gibt die intensive Wendung עַד מְאֹד mit „überaus“ wieder.
- source_word: וְלֹא יַעֲמֹד
  choice: doch er wird nicht standhalten
  rationale: Das wörtliche „nicht stehen“ bezeichnet in diesem Zusammenhang, dass er sich nicht behaupten bzw. seine Stellung nicht halten kann. „Nicht standhalten“ bewahrt das Bild und ist zugleich verständlich.
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: sie werden Pläne gegen ihn schmieden
  rationale: Die hebräische figura etymologica bedeutet, feindliche Pläne gegen jemanden zu ersinnen. Das unbestimmte „sie“ bewahrt, dass die Urheber im Vers nicht ausdrücklich identifiziert werden.
theological_decisions:
- issue: Bezug des männlichen Singularpronomens in וְלֹא יַעֲמֹד und עָלָיו
  choice: Das Pronomen bleibt als „er/ihn“ stehen und bezieht sich im natürlichen Satzverlauf auf den König des Südens.
  alternative: Den Bezug durch die ausdrückliche Wiederholung „der König des Südens“ eindeutig machen.
  rationale: Der hebräische Text verwendet lediglich das Pronomen. Die Übersetzung wahrt diese Form und vermeidet eine über den Wortlaut hinausgehende Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärische Begriffe sind klar und allgemein verständlich; die nicht näher bestimmten Verschwörer bleiben durch „sie“ bewusst unbenannt.
