source:
  edition: WLC
  text: וְ/יָבֹא֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/יִשְׁפֹּךְ֙ סֽוֹלֲלָ֔ה וְ/לָכַ֖ד עִ֣יר מִבְצָר֑וֹת וּ/זְרֹע֤וֹת הַ/נֶּ֨גֶב֙ לֹ֣א יַעֲמֹ֔דוּ וְ/עַם֙ מִבְחָרָ֔י/ו וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: de
  text: Dann wird der König des Nordens kommen, einen Belagerungswall aufschütten und eine befestigte Stadt einnehmen. Die Streitkräfte[a] des Südens werden nicht standhalten, auch seine ausgewählten Truppen[b] nicht; denn es wird keine Kraft da sein, standzuhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Arme des Südens“; „Arme“ ist hier ein Bild für militärische Macht oder Streitkräfte.
    reason: lexical_alternative
  - marker: b
    text: Oder „seine auserwählten Leute“. Im Zusammenhang sind wahrscheinlich die ausgewählten oder besonders kampfstarken Truppen des Königs des Südens gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: Dann wird ... kommen
  rationale: Das mit waw verbundene Imperfekt führt die prophetisch erzählte Abfolge weiter; „Dann“ gibt diesen zeitlich-folgernden Sinn im Deutschen natürlich wieder.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: der König des Nordens
  rationale: Die Genitivfügung bewahrt die in Daniel 11 wiederkehrende Gegenüberstellung von Norden und Süden.
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: einen Belagerungswall aufschütten
  rationale: Die Wendung bezeichnet das Errichten eines aufgeschütteten Belagerungswerks; die deutsche Formulierung gibt den militärischen Sachverhalt klar und idiomatisch wieder.
- source_word: וְלָכַד
  choice: und ... einnehmen
  rationale: Das mit waw verbundene Perfekt setzt in diesem Zusammenhang die zukünftig dargestellte Abfolge fort; „einnehmen“ ist bei einer befestigten Stadt die natürliche militärische Bezeichnung.
- source_word: עִיר מִבְצָרוֹת
  choice: eine befestigte Stadt
  rationale: Die Constructusverbindung mit dem Plural מִבְצָרוֹת beschreibt idiomatisch eine stark befestigte Stadt, ohne eine bestimmte Stadt ausdrücklich zu identifizieren.
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: die Streitkräfte des Südens
  rationale: „Arme“ steht hier als Bild für militärische Macht beziehungsweise Truppen. „Streitkräfte“ vermittelt den kontextuellen Sinn, während die Fußnote das Bild des Ausgangstextes erhält.
- source_word: לֹא יַעֲמֹדוּ
  choice: werden nicht standhalten
  rationale: עמד bedeutet wörtlich „stehen“; im militärischen Zusammenhang bezeichnet es das Behaupten gegen einen Angriff. „Standhalten“ ist im Deutschen klar und bewahrt das Bild.
- source_word: וְעַם מִבְחָרָיו
  choice: auch seine ausgewählten Truppen nicht
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung wahrscheinlich die ausgesuchte Truppe des Königs des Südens. „Auch ... nicht“ führt die Verneinung des vorigen Satzglieds natürlich fort; die mögliche wörtlichere Deutung bleibt in der Fußnote sichtbar.
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: denn es wird keine Kraft da sein, standzuhalten
  rationale: Die Formulierung bewahrt sowohl כֹּחַ als „Kraft“ als auch die Wiederaufnahme von עמד. „Denn“ macht die begründende Funktion des Satzteils im Deutschen deutlich.
