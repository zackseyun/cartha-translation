  terminology: „Königreich Griechenland“ gibt מַלְכוּת יָוָן angemessen wieder. „Siehe“ bewahrt den prophetisch-deiktischen Akzent von הִנֵּה. Die Fußnote zum Schlusssatz muss jedoch die alternative Konstruktion nicht als unidiomatisches deutsches Zitat, sondern als sachliche syntaktische Alternative formulieren.
