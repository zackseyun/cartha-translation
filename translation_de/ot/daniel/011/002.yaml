source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: de
  text: 'Und nun will ich dir die Wahrheit sagen: Siehe, noch drei Könige werden für Persien auftreten[a]. Der vierte aber wird sehr reich werden, reicher als alle anderen[b]. Wenn er durch seinen Reichtum mächtig geworden ist, wird er alle gegen das Königreich Griechenland aufbieten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Noch drei Könige werden für Persien aufstehen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Der vierte wird großen Reichtum erlangen, mehr als alle.“'
    reason: lexical_alternative
  - marker: c
    text: Die genaue syntaktische Beziehung von „das Königreich Griechenland“ ist umstritten. Wenn אֵת als Objektmarker verstanden wird, kann der Ausdruck auch das zum Aufgerüttelten gehörende Königreich Griechenland bezeichnen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעַתָּה אֱמֶת אַגִּיד לָךְ
  choice: Und nun will ich dir die Wahrheit sagen
  rationale: Die Wendung bewahrt sowohl den fortführenden Anschluss von וְ als auch die zeitliche Markierung עַתָּה; אַגִּיד לָךְ wird in natürlichem modernem Deutsch mit „will ich dir … sagen“ wiedergegeben.
- source_word: הִנֵּה
  choice: Siehe
  rationale: „Siehe“ erhält die hinweisende und feierlich-prophetische Kraft des hebräischen Ausdrucks, ohne ihn auszudeuten.
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים עֹמְדִים לְפָרַס
  choice: noch drei Könige werden in Persien auftreten
  rationale: עוֹד bezeichnet die zusätzliche Zahl; עמד beschreibt hier das Auftreten beziehungsweise Erstehen von Königen. „In Persien“ ist im Deutschen die natürliche kontextuelle Wiedergabe der durch לְ bezeichneten Zuordnung, während die formal nähere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: wird sehr reich werden, reicher als alle anderen
  rationale: Die Verbindung des Hifil-Verbs mit dem stammverwandten Substantiv verstärkt die Aussage über den Reichtum; der Vergleich mit מִכֹּל wird klar und idiomatisch ausgedrückt.
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: Sobald er durch seinen Reichtum mächtig geworden ist
  rationale: כְ wird temporal beziehungsweise begleitend verstanden; בְ bezeichnet hier plausibel das Mittel oder die Grundlage seiner Macht. Die Formulierung wahrt den Zusammenhang zwischen Reichtum und Stärke.
- source_word: יָעִיר הַכֹּל
  choice: wird er alle … aufbieten
  rationale: Das Hifil von עור kann „wecken“, „aufrütteln“ oder „aufbieten“ bedeuten. Im politisch-militärischen Zusammenhang gibt „aufbieten“ eine umfassende Mobilisierung wieder; הַכֹּל bleibt mit „alle“ bewusst knapp.
- source_word: אֵת מַלְכוּת יָוָן
  choice: gegen das Königreich Griechenland
  rationale: Im Zusammenhang wird die Zielrichtung der Mobilisierung adversativ verstanden. מַלְכוּת bezeichnet das Königreich beziehungsweise Herrschaftsgebiet, יָוָן Griechenland.
theological_decisions:
- issue: Historisch-politischer Sinn des Schlusssatzes
  choice: Der reiche vierte König mobilisiert alle gegen das griechische Königreich.
  alternative: Er rüttelt alles auf, wobei das Königreich Griechenland als direktes Objekt oder als einbezogener Teil verstanden wird.
  rationale: Die gewählte Lesart folgt dem Zusammenhang der politischen und militärischen Voraussage, ohne den König namentlich zu identifizieren. Da אֵת gewöhnlich auch den bestimmten direkten Gegenstand markiert, wird die syntaktische Spannung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Siehe“ wurde als bewusst feierliches Textelement beibehalten; ansonsten wurden unnötige Archaismen vermieden. Die drei Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
