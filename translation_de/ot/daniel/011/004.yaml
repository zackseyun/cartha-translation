  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: de
  text: Wenn er sich erhoben hat, wird sein Königreich zerbrochen und zu den vier Winden des Himmels hin aufgeteilt werden[a], jedoch nicht an seine Nachkommen[b] und nicht entsprechend der Macht, mit der er geherrscht hat. Denn sein Königreich wird ausgerissen und anderen als diesen überlassen werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »vier Winde des Himmels« stehen bildhaft für die vier Himmelsrichtungen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »nicht für sein Ende« beziehungsweise »nicht für seine Zukunft«. Im Zusammenhang ist seine dynastische Nachkommenschaft gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Worauf »diesen« genau zurückweist, wird im Hebräischen nicht ausdrücklich gesagt.
    reason: ambiguity_note
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: Wenn er sich erhoben hat
  rationale: Die Wendung bezeichnet hier im Zusammenhang das Aufstehen beziehungsweise den Aufstieg des Königs zur Macht. Die Übersetzung wahrt das Bild des hebräischen Verbs, ohne eine rein körperliche Bewegung nahezulegen.
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: wird sein Königreich zerbrochen
  rationale: Das Nifal von שׁבר bezeichnet das passive Zerbrechen. מַלְכוּת meint hier das politische Königreich, das anschließend aufgeteilt wird.
- source_word: וְתֵחָץ
  choice: und … aufgeteilt werden
  rationale: Das Verb bezeichnet die Teilung in mehrere Teile; „aufgeteilt“ ist in diesem politischen Zusammenhang natürlich und klar.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: nach den vier Winden des Himmels hin
  rationale: Die bildhafte hebräische Richtungsangabe bleibt erhalten; sie verweist auf eine Verteilung in alle vier Himmelsrichtungen.
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: jedoch nicht unter seine Nachkommen
  rationale: אַחֲרִית bezeichnet wörtlich das Nachfolgende oder spätere Ende. Im Zusammenhang dynastischer Nachfolge sind die nach ihm Kommenden, also seine Nachkommen, gemeint; die Grundbedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: und nicht entsprechend der Macht, mit der er geherrscht hat
  rationale: Die Wiedergabe erhält den Zusammenhang zwischen Herrschaftsmacht und ausgeübtem Herrschen, vermeidet im Deutschen aber eine schwerfällige Wiederholung desselben Wortstamms.
- source_word: תִנָּתֵשׁ
  choice: wird ausgerissen
  rationale: Das Nifal von נתש vermittelt das gewaltsame Herausreißen beziehungsweise Entwurzeln. „Ausgerissen“ bewahrt das starke Bild und passt zu einem Königreich, das seinem bisherigen Träger entzogen wird.
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: und anderen überlassen werden, die nicht zu diesen gehören
  rationale: Im Hebräischen ist bei „anderen“ kein Verb wiederholt; „überlassen werden“ macht den gemeinten Übergang im Deutschen verständlich. Die Umschreibung bewahrt zugleich die Abgrenzung „außer diesen“, ohne den Bezug von „diesen“ im Haupttext festzulegen.
theological_decisions:
- issue: Historische Identifizierung des Königs und der Reichsteile
  choice: Im Vers werden keine historischen Namen ergänzt.
  alternative: Den König mit Alexander und die Teilungen mit bestimmten Nachfolgereichen identifizieren.
  rationale: Solche historischen Zuordnungen gehören in die Auslegung. Der hebräische Vers selbst beschreibt Aufstieg, Zerbrechen und Weitergabe des Königreichs, ohne hier Namen zu nennen.
- issue: Bezug von „diesen“ in מִלְּבַד אֵלֶּה
  choice: Der unbestimmte Rückverweis bleibt im Haupttext erhalten.
  alternative: „Diese“ ausdrücklich nur auf die Nachkommen oder nur auf die vier Reichsteile beziehen.
  rationale: Der knappe hebräische Ausdruck legt den Bezug nicht ausdrücklich fest. Eine eindeutige Festlegung würde eine mögliche Mehrdeutigkeit stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem prophetischen Zukunftsbezug des Hebräischen, wahrt zentrale Bilder wie das Erheben, die vier Winde und das Ausreißen und löst unklare Rückbezüge nicht unnötig auf.
