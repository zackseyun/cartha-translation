  to: 'In einer Zeit der Sicherheit wird er in die reichsten Gebiete der Provinz kommen[a] und tun, was weder seine Väter noch die Väter seiner Väter getan haben: Raub, Beute und Besitz wird er unter ihnen ausstreuen[b]. Gegen Festungen wird er seine Pläne schmieden[c], doch nur bis zu einer Zeit.'
