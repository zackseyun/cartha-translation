  naturalness: „In sicherer Ruhe“ klingt im modernen Standarddeutsch etwas unidiomatisch. „In einer Zeit der Sicherheit“ ist klar, würdevoll und wahrt die offene Nuance. Die übrige Satzführung ist natürlich.
  terminology: „Raub, Beute und Besitz“, „Festungen“ und die ausdrücklich wiederholte Formel „seine Väter ... die Väter seiner Väter“ sind angemessen. „Pläne schmieden“ bildet die hebräische Verb-Substantiv-Verbindung gut ab.
  issues:
