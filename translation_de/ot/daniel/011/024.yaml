    rationale: „Bestimmt“ kann im Deutschen einen festgelegten oder näher spezifizierten Zeitpunkt implizieren. Der hebräische Ausdruck lautet lediglich „bis zu/einer Zeit“; eine Deutung als festgesetzte Zeit sollte in der Fußnote bleiben.
  - severity: low
