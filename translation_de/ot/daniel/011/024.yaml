source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: de
  text: 'In einer Zeit der Sicherheit wird er in die reichsten Gebiete der Provinz kommen[a] und tun, was weder seine Väter noch die Väter seiner Väter getan haben: Raub, Beute und Besitz wird er unter ihnen ausstreuen[b]. Gegen Festungen wird er seine Pläne schmieden[c], doch nur bis zu einer Zeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Friedlich“ oder „unerwartet wird er in die reichsten Gebiete der Provinz kommen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Raub, Beute und Besitz wird er an sie verteilen.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Er wird gegen Festungen Pläne entwerfen“; am Versende auch: „bis zur festgesetzten Zeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: in sicherer Ruhe
  rationale: שַׁלְוָה bezeichnet Ruhe, Sorglosigkeit oder Sicherheit. „In sicherer Ruhe“ bewahrt sowohl den ruhigen Zustand als auch den politischen Beiklang einer vermeintlich sicheren Lage, ohne eindeutig „friedlich“ oder „unerwartet“ festzulegen.
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: in die reichsten Gebiete der Provinz
  rationale: מִשְׁמַנִּים bezeichnet wörtlich die „fetten“, idiomatisch die ertragreichsten oder wohlhabendsten Gegenden. מְדִינָה wird in seinem gewöhnlichen administrativen Sinn mit „Provinz“ wiedergegeben.
- source_word: יָבוֹא
  choice: wird er ... eindringen
  rationale: בוא bedeutet grundsätzlich „kommen/hineingehen“. „Eindringen“ gibt hier die Bewegung in ein Gebiet und den militärisch-politischen Kontext natürlich wieder, ohne ausdrücklich eine offene Invasion zu behaupten.
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: und tun, was ... nicht getan haben
  rationale: Die schlichte Wiedergabe erhält den betonten Vergleich mit den Vorgängern.
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: seine Väter noch die Väter seiner Väter
  rationale: Die ausdrückliche Wiederholung des Hebräischen bleibt erhalten und wird nicht zum allgemeineren „Vorfahren“ eingeebnet.
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: Raub, Beute und Besitz
  rationale: Die drei einander nahestehenden Begriffe bleiben als Dreierreihe erhalten. „Besitz“ gibt רְכוּשׁ als Eigentum beziehungsweise Vermögensgüter wieder.
- source_word: לָהֶם יִבְזוֹר
  choice: wird er unter ihnen ausstreuen
  rationale: בזר bedeutet „ausstreuen, zerstreuen“. Die Formulierung erhält das anschauliche Bild, während die Fußnote die kontextuell naheliegende Bedeutung „verteilen“ nennt.
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: Gegen Festungen wird er seine Pläne schmieden
  rationale: Die Verbindung aus dem Verb חשב und dem verwandten Substantiv מַחֲשָׁבוֹת bezeichnet das Ausdenken von Plänen. „Pläne schmieden“ ist im Deutschen natürlich und erhält den überlegten, gegen Festungen gerichteten Charakter.
- source_word: וְעַד עֵת
  choice: doch nur bis zu einer bestimmten Zeit
  rationale: עֵת bedeutet „Zeit/Zeitpunkt“. Der unbestimmte Artikel vermeidet die stärkere Deutung „bis zur festgesetzten Zeit“, während „bestimmten“ den zeitlichen Endpunkt idiomatisch ausdrückt; die noch wörtlichere Alternative steht in der Fußnote.
theological_decisions:
- issue: Ob die zeitliche Begrenzung ausdrücklich als göttlich festgesetzt bezeichnet werden soll
  choice: doch nur bis zu einer bestimmten Zeit
  alternative: doch nur bis zu einer Zeit; bis zur festgesetzten Zeit
  rationale: Im hebräischen עַד עֵת steht kein ausdrückliches Wort für „festgesetzt“. Daher macht der Haupttext die göttliche Festsetzung nicht ausdrücklich, wahrt aber die klare zeitliche Begrenzung. Die Fußnote nennt sowohl die wörtlichere als auch die stärker deutende Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung „seine Väter ... die Väter seiner Väter“ sowie das Bild des Ausstreuens wurden bewusst bewahrt. Die Fußnotenmarker erscheinen jeweils unmittelbar an der betreffenden Textstelle.
