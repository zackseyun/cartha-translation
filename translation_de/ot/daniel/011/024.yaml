    issue: „eindringen“ für יָבוֹא
    rationale: Das hebräische Verb bedeutet zunächst „kommen/hineinkommen“. Der militärische Kontext kann ein gewaltsames Vorgehen nahelegen, doch „eindringen“ behauptet es bereits im Verb und ist daher unnötig enger.
