id: DAN.11.17
reference: Daniel 11:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָשֵׂ֣ם פָּ֠נָי/ו לָ/ב֞וֹא בְּ/תֹ֧קֶף כָּל מַלְכוּת֛/וֹ וִ/ישָׁרִ֥ים עִמּ֖/וֹ וְ/עָשָׂ֑ה וּ/בַ֤ת הַ/נָּשִׁים֙ יִתֶּן ל֣/וֹ לְ/הַשְׁחִיתָ֔/הּ וְ/לֹ֥א תַעֲמֹ֖ד וְ/לֹא ל֥/וֹ תִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: de
  text: Er wird sich fest vornehmen, mit der Macht seines ganzen Königreichs zu kommen; und er wird mit ihm gerechte Bedingungen vereinbaren[a] und handeln. Er wird ihm die Tochter der Frauen[b] geben, um sie zugrunde zu richten.[c] Doch sie wird keinen Bestand haben,[d] und sie wird nicht für ihn sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist an dieser Stelle schwierig. Möglich ist auch: „und Rechtschaffene werden mit ihm sein“ oder: „und gerechte Bedingungen werden mit ihm sein“.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „die Tochter der Frauen“. Wahrscheinlich ist eine vornehme oder königliche Tochter gemeint, die zur Besiegelung eines politischen Bündnisses verheiratet wird.
    reason: cultural_note
  - marker: c
    text: Das hebräische Suffix ist feminin Singular. Es kann sich auf die Frau beziehen, sein Bezug kann jedoch auch anders verstanden werden.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Doch es wird keinen Bestand haben“ beziehungsweise „doch sie wird keinen Erfolg haben“. Die feminine Verbform kann sich auf die Frau oder auf einen sachlichen Bezug beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: Er wird sich fest vornehmen
  rationale: Die hebräische Wendung bedeutet, sein Angesicht entschlossen auf ein Ziel zu richten. Die deutsche Wiedergabe bewahrt den Nachdruck der festen Absicht, ohne die im Deutschen weniger natürliche Körpermetapher wörtlich nachzubilden.
- source_word: לָבוֹא
  choice: zu kommen
  rationale: בוא ist allgemein und bezeichnet das Kommen oder Eintreten. Eine militärisch spezifische Wiedergabe wie „einzufallen“ wäre im Zusammenhang möglich, aber lexikalisch enger als der Ausgangstext.
- source_word: בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: mit der Macht seines ganzen Königreichs
  rationale: תֹּקֶף bezeichnet Stärke, Macht oder Gewalt. „Macht“ passt zum politisch-militärischen Zusammenhang; „seines ganzen Königreichs“ gibt den umfassenden Einsatz seiner Herrschaftsmittel wieder.
- source_word: וִישָׁרִים עִמּוֹ
  choice: Aufrichtige Vereinbarungen wird er mit ihm treffen
  rationale: יְשָׁרִים bedeutet wörtlich „Aufrichtige/Gerade“ und ist hier syntaktisch und sachlich schwierig. Im diplomatischen Zusammenhang ist ein Bezug auf redliche oder gerechte Abmachungen plausibel; die mögliche Deutung als rechtschaffene Personen bleibt in der Fußnote erhalten.
- source_word: וְעָשָׂה
  choice: und er wird handeln
  rationale: עשה ist semantisch weit. Die offene Formulierung „handeln“ vermeidet die unbelegte Festlegung, ob er die Vereinbarung ausführt oder ein anderes Vorhaben vollbringt.
- source_word: וּבַת הַנָּשִׁים
  choice: die Tochter der Frauen
  rationale: Die ungewöhnliche hebräische Bezeichnung wird formal bewahrt. Eine direkte Paraphrase als „Königstochter“ wäre historisch plausibel, steht aber nicht ausdrücklich im Wortlaut.
- source_word: יִתֶּן לוֹ
  choice: Er wird ihm … geben
  rationale: Dies ist eine unmittelbare und natürliche Wiedergabe der Übergabeformulierung.
- source_word: לְהַשְׁחִיתָהּ
  choice: um sie zugrunde zu richten
  rationale: Das feminine Suffix kann sich oberflächlich auf die Tochter beziehen, möglicherweise aber auch auf eine feminine Größe wie Herrschaft, Reichsordnung oder einen Plan. Der Haupttext folgt dem nächsten femininen Bezug, während die Mehrdeutigkeit in der Fußnote offengelegt wird.
- source_word: וְלֹא תַעֲמֹד
  choice: Doch sie wird keinen Bestand haben
  rationale: Das feminine Verb kann sich auf die Frau oder auf das Vorhaben beziehen. „Keinen Bestand haben“ bildet עמד ab und wahrt stärker als „keinen Erfolg haben“ die Offenheit zwischen persönlichem und sachlichem Bezug.
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: und sie wird nicht für ihn sein
  rationale: 'Die knappe relationale Aussage bleibt bewusst offen: Gemeint sein können Zugehörigkeit, Loyalität oder Nutzen. Engere Formulierungen wie „nicht auf seiner Seite stehen“ würden diese Spannung auflösen.'
theological_decisions:
- issue: Bezug der femininen Formen in der zweiten Vershälfte
  choice: Der Haupttext bezieht sie grammatisch zunächst auf die Tochter, lässt die Aussage jedoch sachlich offen.
  alternative: Die Formen können sich auf die beabsichtigte politische Zerstörung, eine Herrschaft oder das Bündnisvorhaben beziehen.
  rationale: Der hebräische Text verwendet feminine Singularformen, ohne den Bezug eindeutig festzulegen. Die Übersetzung vermeidet daher eine historische oder theologische Vorentscheidung und dokumentiert die Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „Tochter der Frauen“ und die knappe Aussage „nicht für ihn sein“ bleiben erhalten, weil eine glättende Paraphrase historische Einzelheiten oder den Bezug der Pronomen vorschnell festlegen würde. Die schwierige Formulierung וִישָׁרִים עִמּוֹ wird im Haupttext diplomatisch verstanden; ihre personale und stärker wörtliche Deutung ist ausdrücklich vermerkt.
