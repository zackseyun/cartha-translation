source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: de
  text: Auch ihre Götter samt ihren gegossenen Bildern und ihren kostbaren Gefäßen aus Silber und Gold wird er als Beute nach Ägypten bringen. Er wird sich einige Jahre vom König des Nordens fernhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird den König des Nordens um einige Jahre überdauern“, oder: „Er wird dem König des Nordens gegenüber jahrelang überlegen bleiben.“ Der hebräische Satz ist stark verdichtet und kann vergleichend statt im Sinn einer Enthaltung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֱלֹהֵיהֶם
  choice: Auch ihre Götter
  rationale: וְגַם hat additive beziehungsweise verstärkende Kraft; „auch“ gibt sie knapp wieder. אֱלֹהֵיהֶם bezeichnet unmittelbar die Götter der Besiegten, ohne dass „Götzen“ interpretierend ergänzt werden muss.
- source_word: נְסִכֵיהֶם
  choice: ihre gegossenen Bilder
  rationale: Das Substantiv bezeichnet durch Gießen hergestellte Bilder. „Gegossene Bilder“ ist im heutigen Deutsch verständlich und bewahrt den Herstellungsaspekt.
- source_word: כְּלֵי חֶמְדָּתָם
  choice: ihre kostbaren Gefäße
  rationale: כְּלֵי kann Geräte, Gegenstände oder Gefäße bezeichnen; im Zusammenhang von Tempel- oder Königsschätzen passt „Gefäße“. חֶמְדָּתָם hebt deren Kostbarkeit hervor.
- source_word: כֶּסֶף וְזָהָב
  choice: aus Silber und Gold
  rationale: Die Materialangabe wird im Deutschen natürlich mit „aus“ an die kostbaren Gefäße angeschlossen.
- source_word: בַּשְּׁבִי
  choice: als Beute
  rationale: Bei geraubten Götterbildern und Wertgegenständen bezeichnet der Ausdruck Kriegsbeute; „als Beute“ ist sachlich und idiomatisch.
- source_word: יָבִא מִצְרָיִם
  choice: wird er nach Ägypten bringen
  rationale: Der Hifil von בוא bedeutet „bringen“. Der Beutekontext macht die gewaltsame Wegführung bereits deutlich, sodass das natürliche deutsche „nach Ägypten bringen“ genügt.
- source_word: שָׁנִים
  choice: einige Jahre
  rationale: Der unbestimmte Plural bezeichnet eine nicht näher angegebene Zeitspanne; „einige Jahre“ ist idiomatisch, ohne eine genaue Zahl festzulegen.
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: wird er sich vom König des Nordens fernhalten
  rationale: Die Verbindung von עמד mit מן kann Distanz oder Enthaltung ausdrücken. „Sich fernhalten“ bewahrt diesen Sinn, ohne die spezifischere Deutung „nicht angreifen“ in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung von וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: Er wird sich einige Jahre vom König des Nordens fernhalten.
  alternative: 'Er wird den König des Nordens um einige Jahre überdauern; oder: Er wird dem König des Nordens gegenüber jahrelang standhalten beziehungsweise überlegen bleiben.'
  rationale: Die hebräische Wendung ist stark verdichtet. מן kann trennend oder vergleichend verstanden werden, und עמד lässt mehrere kontextuelle Nuancen zu. Der Haupttext folgt der Distanz- beziehungsweise Enthaltungsdeutung; die plausiblen komparativen Lesarten bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der hebräischen Aufzählung, ohne unnötig altertümliche Begriffe zu verwenden. Die umstrittene Schlussklausel wird im Haupttext lesbar wiedergegeben; ihre echte Mehrdeutigkeit wird durch die Fußnote bewahrt.
