source:
  edition: WLC
  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: de
  text: Diejenigen, die gegen den Bund freveln, wird er mit glatten Worten[a] zur Gottlosigkeit verleiten. Aber das Volk, das seinen Gott kennt, wird standhaft bleiben und handeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Schmeicheleien“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird stark sein und handeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: Diejenigen, die sich am Bund schuldig machen
  rationale: Das Partizip von רשע bezeichnet schuldhaft oder frevelhaft Handelnde. Die Formulierung gibt die Beziehung zum Bund wieder, ohne eine bestimmte Art des Bundesbruchs vorauszusetzen.
- source_word: יַחֲנִיף
  choice: zum Frevel verführen
  rationale: Der Hifil von חנף kann ein Verleiten zu gottlosem oder frevelhaftem Handeln ausdrücken. Die Wiedergabe bewahrt die moralisch-religiöse Dimension und passt zu den glatten Worten als Mittel.
- source_word: בַּחֲלַקּוֹת
  choice: mit glatten Worten
  rationale: Das Substantiv bezeichnet wörtlich Glattes und idiomatisch schmeichelnde, verführerische Rede. „Glatte Worte“ bewahrt das Bild in verständlichem Deutsch.
- source_word: וְעַם
  choice: Aber das Volk
  rationale: Das Waw ist formal verbindend, markiert hier jedoch deutlich den Gegensatz zwischen den am Bund Schuldigen und dem Gott treuen Volk.
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: das seinen Gott kennt
  rationale: Das Partizip bezeichnet fortdauernde, relationale Kenntnis. Das maskuline Singularsuffix entspricht grammatisch dem singularischen Kollektiv „Volk“.
- source_word: יַחֲזִקוּ
  choice: wird standhaft bleiben
  rationale: 'Der Hifil von חזק hat hier wahrscheinlich resultative beziehungsweise intransitive Bedeutung: stark oder fest sein. „Standhaft bleiben“ gibt die Widerstandskraft im Kontext natürlich wieder.'
- source_word: וְעָשׂוּ
  choice: und handeln
  rationale: עשה ist semantisch weit und bedeutet hier schlicht handeln oder tätig werden. „Handeln“ wahrt diese Offenheit besser als die traditionelle, stärker ausdeutende Wiedergabe „Heldentaten vollbringen“.
theological_decisions:
- issue: Art der Reaktion des treuen Volkes im Schlusssatz
  choice: Das Volk bleibt standhaft und handelt.
  alternative: Das Volk ist stark und handelt beziehungsweise vollbringt Taten.
  rationale: Der Text stellt die Verführten dem Volk gegenüber, das seinen Gott kennt. Die Übersetzung bringt Treue und entschlossenes Handeln zum Ausdruck, ohne Art oder Erfolg dieses Handelns näher zu bestimmen.
- issue: Wirkung des Herrschers auf die am Bund Schuldigen
  choice: Er verführt sie zum Frevel.
  alternative: Er verdirbt sie oder macht sie gottlos.
  rationale: Der Kausativ und das Mittel der glatten Worte sprechen für moralisch-religiöse Verführung. Die Formulierung vermeidet zugleich die Behauptung, dass hier zwingend eine technisch definierte Form des Abfalls gemeint sei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glatte Worte“ erhält das hebräische Bild; „sich am Bund schuldig machen“ ist präzise und allgemein verständlich. Der knappe Schlusssatz bewahrt die Offenheit von עשה.
