- from: Diejenigen, die sich am Bund schuldig machen, wird er mit glatten Worten[a] zum Frevel verführen. Aber das Volk, das seinen Gott kennt, wird standhaft bleiben und handeln.[b]
  to: Diejenigen, die gegen den Bund freveln, wird er mit glatten Worten[a] zur Gottlosigkeit verleiten. Aber das Volk, das seinen Gott kennt, wird standhaft bleiben und handeln.[b]
  rationale: Die Revision ersetzt allein die unklare Verbindung „sich am Bund schuldig machen“ durch eine aktive, idiomatische Formulierung für treuloses Handeln gegen den Bund und vermeidet die unmittelbare Wiederholung von „Frevel“. Der adversative Übergang, die bildhafte Rede von glatten Worten, die relationale Gotteskenntnis sowie die offene Aussage über standhaftes Handeln bleiben erhalten. Die Fußnotenanker stehen jeweils unmittelbar bei den betreffenden Ausdrücken.
