id: DAN.11.33
reference: Daniel 11:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: de
  text: Und die Einsichtigen unter dem Volk[a] werden die Vielen zur Einsicht bringen[b]. Doch durch Schwert und Flamme, durch Gefangenschaft[d] und Plünderung werden sie zu Fall kommen[c] – eine Zeit lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Weisen des Volkes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden viele unterweisen“ oder „werden vielen Verständnis vermitteln“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „werden sie straucheln“; das hebräische Bild kann Niederlage, Zusammenbruch oder Tod in der Verfolgung bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „indem sie in Gefangenschaft geraten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: die Einsichtigen unter dem Volk
  rationale: Die Wendung bezeichnet Menschen aus dem Volk, die Einsicht und Urteilsvermögen besitzen. „Unter dem Volk“ gibt die Zugehörigkeit im Deutschen natürlicher wieder als das missverständliche „die Einsichtigen des Volkes“.
- source_word: יָבִינוּ לָרַבִּים
  choice: werden die Vielen zur Einsicht bringen
  rationale: Der Hifil von בין hat hier bei לָרַבִּים eine bewirkende beziehungsweise unterweisende Bedeutung. Die Formulierung bewahrt sowohl diesen kausativen Sinn als auch die substantivische Bestimmtheit von רַבִּים.
- source_word: וְנִכְשְׁלוּ
  choice: doch ... werden sie zu Fall kommen
  rationale: כשל beschreibt ein Straucheln oder Zu-Fall-Kommen und kann hier Niederlage, Zusammenbruch oder Tod in der Verfolgung umfassen. „Zu Fall kommen“ bewahrt diese Bedeutungsbreite besser als eine eindeutige Festlegung auf den Tod.
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: durch Schwert und Flamme
  rationale: Das wiederholte בְּ bezeichnet hier Mittel oder Ursache. „Flamme“ erhält das konkrete Bild von לֶהָבָה.
- source_word: בִּשְׁבִי וּבְבִזָּה
  choice: durch Gefangenschaft und Plünderung
  rationale: Die parallele Wiedergabe mit „durch“ erhält die Reihung der Leiden. שְׁבִי bezeichnet Gefangenschaft, בִּזָּה Plünderung beziehungsweise Beute.
- source_word: יָמִים
  choice: eine Zeit lang
  rationale: Der bloße Plural „Tage“ wird adverbial zur Angabe einer unbestimmten Dauer gebraucht. „Eine Zeit lang“ ist im modernen Deutschen natürlich und legt keine genaue Zeitspanne fest.
theological_decisions:
- issue: Ob נִכְשְׁלוּ als endgültige Vernichtung oder als breiteres Bild des Zu-Fall-Kommens wiederzugeben ist
  choice: werden sie zu Fall kommen
  alternative: werden sie straucheln; werden sie fallen
  rationale: Die Übersetzung lässt offen, ob jeweils Niederlage, Zusammenbruch oder Tod gemeint ist, und bewahrt damit die Spannung des hebräischen Bildes innerhalb der geschilderten Verfolgung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzführung. Die leicht gehobenen Ausdrücke „die Einsichtigen“ und „die Vielen“ erhalten zentrale Formen und den feierlichen Charakter des Ausgangstextes, ohne altertümlich zu wirken.
