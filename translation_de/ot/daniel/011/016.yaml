id: DAN.11.16
reference: Daniel 11:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: de
  text: Der aber gegen ihn heranzieht, wird tun, was ihm gefällt, und niemand wird ihm standhalten. Er wird im Land der Schönheit[a] Stellung beziehen, und Vernichtung wird in seiner Hand sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »im herrlichen Land«. Der hebräische Ausdruck bezeichnet ein Land von Schönheit oder Pracht und meint hier das Land Israel beziehungsweise Juda.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist knapp und mehrdeutig. Möglich ist auch: »und es wird durch seine Hand völlig zugrunde gerichtet werden«. Sie kann entweder die Vernichtungsmacht in seiner Hand oder die Verwüstung des Landes hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּא אֵלָיו
  choice: der aber gegen ihn heranzieht
  rationale: Das wörtliche »zu ihm Kommende« hat im militärischen Zusammenhang eine feindliche Richtung. »Heranzieht« gibt den Feldzug natürlich wieder, ohne den Handelnden näher zu bestimmen.
- source_word: כִּרְצוֹנוֹ
  choice: wird tun, was ihm gefällt
  rationale: Die Wendung bedeutet wörtlich »nach seinem Willen/Begehren« und bezeichnet hier uneingeschränkte Handlungsfreiheit.
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: und niemand wird ihm standhalten
  rationale: Das militärische Idiom »vor ihm stehen« meint Widerstand leisten; »standhalten« vermittelt diesen Sinn im heutigen Deutsch.
- source_word: וְיַעֲמֹד
  choice: Er wird ... Stellung beziehen
  rationale: עמד bedeutet grundsätzlich »stehen«; im Feldzugskontext bezeichnet es das Einnehmen oder Behaupten einer Position.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: im Land der Schönheit
  rationale: צְבִי bezeichnet Schönheit, Zierde oder Pracht. Die formnahe Wendung wahrt den bildhaften geografischen Titel und lässt dessen Bezug im Haupttext unausgedeutet.
- source_word: וְכָלָה בְיָדוֹ
  choice: und Vernichtung wird in seiner Hand sein
  rationale: Die knappe, elliptische Wendung verbindet כָלָה, »Ende/Vollendung/Vernichtung«, mit »in seiner Hand«. Die Übersetzung bewahrt sowohl das Bild der verfügbaren Macht als auch die mögliche destruktive Bedeutung, ohne ein ausdrückliches Objekt zu ergänzen.
theological_decisions:
- issue: Bezug des »Landes der Schönheit«
  choice: Bildhafter geografischer Titel im Haupttext; Bezug auf Israel/Juda in der Fußnote erläutert
  alternative: »das herrliche Land« oder eine ausdrückliche Wiedergabe als »Land Israel/Juda«
  rationale: Im Zusammenhang von Daniel bezeichnet die Wendung Israel/Juda. Der bildhafte Titel sollte jedoch übersetzt und nicht durch eine explizite Identifikation ersetzt werden.
- issue: Sinn der Schlusswendung וְכָלָה בְיָדוֹ
  choice: Vernichtung als in seiner Hand befindlich
  alternative: Das Land wird durch seine Hand völlig zugrunde gerichtet
  rationale: Der hebräische Satz ist elliptisch und lässt offen, ob die Vernichtungsmacht oder das zugrunde gerichtete Land im Vordergrund steht. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die alternative Auffassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärische Zusammenhänge werden idiomatisch wiedergegeben; die Bildsprache und die Mehrdeutigkeit der elliptischen Schlusswendung bleiben erhalten.
