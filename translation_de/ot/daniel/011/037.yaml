  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: de
  text: Er wird weder die Götter seiner Väter[a] noch das Verlangen der Frauen[b] noch irgendeinen Gott beachten; denn er wird sich über alles erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Gott seiner Väter«. Die hebräische Form ist pluralisch (»Götter seiner Väter«), wird jedoch von manchen als die geläufige Bezeichnung für den Gott Israels verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »das Verlangen der Frauen«. Gemeint sein kann, was Frauen begehren, oder der von Frauen Begehrte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: die Götter seiner Väter
  rationale: Die hebräische Konstruktform ist formal pluralisch. Der Zusammenhang erwähnt zudem ausdrücklich »irgendeinen Gott«, sodass die plurale Wiedergabe naheliegt. »Väter« bewahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: לֹא יָבִין
  choice: nicht beachten
  rationale: בין bedeutet grundsätzlich »verstehen« oder »bedenken«, hat mit עַל hier jedoch den idiomatischen Sinn, jemandem oder etwas Beachtung beziehungsweise Achtung zu schenken.
- source_word: חֶמְדַּת נָשִׁים
  choice: das Verlangen der Frauen
  rationale: Die knappe Genitivverbindung ist mehrdeutig. Diese Wiedergabe bleibt nahe an der Formulierung des Ausgangstextes und legt nicht fest, ob das Verlangen der Frauen selbst oder das von ihnen Begehrte gemeint ist.
- source_word: כָּל אֱלוֹהַּ
  choice: irgendeinen Gott
  rationale: כָּל mit dem singularischen אֱלוֹהַּ ist hier distributiv zu verstehen. »Irgendeinen Gott« gibt den umfassenden Sinn im Deutschen natürlich wieder.
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: denn er wird sich über alles erheben
  rationale: Der Hitpael von גדל bezeichnet Selbsterhöhung. »Sich über alles erheben« wahrt sowohl den reflexiven Sinn als auch den durch עַל ausgedrückten Vergleich.
theological_decisions:
- issue: Deutung von חֶמְדַּת נָשִׁים
  choice: Die mehrdeutige Formulierung »das Verlangen der Frauen« bleibt im Haupttext stehen.
  alternative: Möglich sind unter anderem »was Frauen begehren« und »der von Frauen Begehrte«; auch eine bestimmte Gottheit oder Gestalt wurde vorgeschlagen.
  rationale: Der hebräische Ausdruck entscheidet nicht eindeutig zwischen subjektivem und objektivem Genitiv. Eine konkrete historische oder lehrmäßige Identifizierung würde mehr festlegen als der Text selbst.
- issue: Numerus von אֱלֹהֵי אֲבֹתָיו
  choice: 'Plural: »die Götter seiner Väter«.'
  alternative: 'Singular: »der Gott seiner Väter«.'
  rationale: Die Form ist morphologisch pluralisch und der unmittelbare Zusammenhang spricht allgemein von Gottheiten. Die bekannte singularische biblische Wendung bleibt dennoch als bedeutsame alternative Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Reihung mit »weder … noch … noch« bildet die wiederholte hebräische Präposition natürlich ab. Das Semikolon markiert den begründenden Schlusssatz, ohne die enge syntaktische Verbindung aufzulösen.
