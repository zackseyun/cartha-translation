id: DAN.11.35
reference: Daniel 11:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: de
  text: Und einige von den Verständigen werden straucheln[a], damit sie unter ihnen[b] geläutert, gereinigt und weiß gemacht werden[c], bis zur Zeit des Endes; denn der festgesetzte Zeitpunkt steht noch aus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden fallen“ beziehungsweise „werden zu Fall kommen“. Das hebräische Verb bewahrt das Bild des Strauchelns und kann einen Zusammenbruch infolge von Verfolgung oder Prüfung meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „an ihnen“ oder „durch sie“. Die knappe hebräische Wendung kann besagen, dass die Läuterung innerhalb dieser Gruppe oder durch das geschieht, was ihnen widerfährt.'
    reason: lexical_alternative
  - marker: c
    text: „Weiß gemacht“ gibt das hebräische Bild wörtlich wieder; gemeint ist Reinigung oder Läuterung.
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „denn es ist noch bis zum festgesetzten Zeitpunkt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: Und einige von den Einsichtigen
  rationale: 'מִן ist hier partitiv: Gemeint sind einige aus der Gruppe der Verständigen. „Einsichtige“ bewahrt den partizipialen Sinn und klingt im Deutschen natürlich.'
- source_word: יִכָּשְׁלוּ
  choice: werden straucheln
  rationale: „Straucheln“ erhält das Bild des hebräischen Verbs כשל, ohne festzulegen, ob ein körperlicher Sturz, eine Niederlage oder ein Zusammenbruch unter Verfolgung gemeint ist.
- source_word: לִצְרוֹף
  choice: damit sie … geläutert … werden
  rationale: צרף bezeichnet das Läutern von Metall. Die mit ל eingeleitete Infinitivfolge wird im Zusammenhang am besten als Zweck oder Ergebnis des Strauchelns wiedergegeben.
- source_word: בָּהֶם
  choice: unter ihnen
  rationale: Die knappe Präpositionalverbindung ist mehrdeutig. „Unter ihnen“ folgt einer möglichen lokalen beziehungsweise gruppenbezogenen Deutung, ohne die Alternativen „an ihnen“ oder „durch sie“ auszuschließen.
- source_word: וּלְבָרֵר
  choice: gereinigt
  rationale: ברר kann das Reinigen oder Ausscheiden durch Trennung bezeichnen. „Gereinigt“ passt zur parallelen Folge der Läuterungsbilder.
- source_word: וְלַלְבֵּן
  choice: weiß gemacht
  rationale: Die Hifil-Form von לבן bedeutet wörtlich „weiß machen“. Die konkrete Metapher wird beibehalten und nicht lediglich mit „rein gemacht“ erklärt.
- source_word: עַד עֵת קֵץ
  choice: bis zur Zeit des Endes
  rationale: Die Formulierung bleibt nahe an der für Daniel charakteristischen Wendung und ist zugleich verständliches Standarddeutsch.
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: denn es dauert noch bis zum festgesetzten Zeitpunkt
  rationale: Die natürliche deutsche Formulierung gibt die knappe hebräische Aussage wieder, dass die Vollendung weiterhin an den festgesetzten Zeitpunkt gebunden ist.
theological_decisions:
- issue: Zweck oder Ergebnis des Leidens der Einsichtigen
  choice: Das Straucheln dient ihrer Läuterung und Reinigung, ohne daraus eine umfassende Lehre über Leiden abzuleiten.
  alternative: Die Infinitive könnten ausschließlich eine Folge statt eines beabsichtigten Zwecks bezeichnen.
  rationale: Die Infinitivfolge nach יִכָּשְׁלוּ lässt Zweck oder Ergebnis zu. „Damit“ gibt die enge Zielbeziehung wieder, ohne über den Vers hinauszugehen.
- issue: Bezug von בָּהֶם
  choice: „unter ihnen“ lässt die Läuterung innerhalb der genannten Gruppe geschehen.
  alternative: Möglich sind auch „an ihnen“ oder „durch sie“, wonach die Betroffenen selbst Mittel oder Schauplatz der Läuterung sind.
  rationale: Die hebräische Präposition ב ist hier syntaktisch knapp und semantisch nicht eindeutig; diese Spannung wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei parallelen Läuterungsbegriffe und das konkrete Bild des Weißmachens bleiben erhalten. Der abschließende hebräische Ellipsensatz wird verständlich formuliert, ohne den festgesetzten Zeitpunkt näher zu deuten.
