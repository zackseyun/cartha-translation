  text: וְ/עָמַ֛ד מִ/נֵּ֥צֶר שָׁרָשֶׁ֖י/הָ כַּנּ֑/וֹ וְ/יָבֹ֣א אֶל הַ/חַ֗יִל וְ/יָבֹא֙ בְּ/מָעוֹז֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/עָשָׂ֥ה בָ/הֶ֖ם וְ/הֶחֱזִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: de
  text: Ein Spross aus ihren Wurzeln[a] wird an seiner Stelle auftreten. Er wird gegen das Heer ziehen und in die Festung des Königs des Nordens[b] eindringen; er wird gegen sie vorgehen[c] und die Oberhand gewinnen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Schössling aus ihren Wurzeln“, das heißt aus ihrer Familienlinie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in das Bollwerk des Königs des Nordens eindringen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit ihnen verfahren“ beziehungsweise „unter ihnen handeln“; die hebräische Wendung ist weit gefasst.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Stärke zeigen“ beziehungsweise „sich durchsetzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: wird … auftreten
  rationale: עמד bezeichnet in diesem prophetischen Nachfolgekontext das Hervortreten eines neuen Herrschers, nicht bloß körperliches Stehen.
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: einer aus einem Spross ihrer Wurzeln
  rationale: נֵצֶר ist ein Spross oder Schössling. Die Wurzelmetapher verweist hier auf ihre Abstammungslinie; die bildhafte Sprache bleibt erhalten.
- source_word: כַּנּוֹ
  choice: an seiner Stelle
  rationale: Die Wendung drückt Stellvertretung oder Nachfolge aus, lässt aber den Bezug des männlichen Pronomens wie im Hebräischen offen.
- source_word: הַחַיִל
  choice: das Heer
  rationale: חַיִל bezeichnet im militärischen Zusammenhang die Streitmacht, nicht Reichtum oder Tüchtigkeit.
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: in die Festung des Königs des Nordens eindringen
  rationale: מָעוֹז bezeichnet einen befestigten Ort oder ein Bollwerk. Mit dem Bewegungsverb lässt sich ב als Bewegung hinein verstehen; „eindringen“ macht den feindlichen militärischen Zusammenhang natürlich verständlich, ohne das Ziel näher zu bestimmen.
- source_word: וְעָשָׂה בָהֶם
  choice: er wird gegen sie vorgehen
  rationale: עשה ב ist eine breite Wendung für Handeln oder Verfahren mit beziehungsweise gegen jemandem. Der militärische Kontext stützt „gegen sie vorgehen“, doch die Fußnote bewahrt die größere Bedeutungsbreite.
- source_word: וְהֶחֱזִיק
  choice: und die Oberhand gewinnen
  rationale: Das Hifil von חזק kann Stärke zeigen, stark werden oder sich durchsetzen bedeuten. Im Kampfzusammenhang gibt „die Oberhand gewinnen“ den Erfolg idiomatisch wieder.
