source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: de
  text: Dann wird er mit großem Reichtum[a] in sein Land zurückkehren. Sein Herz aber wird gegen den heiligen Bund gerichtet sein[b]; er wird handeln und in sein Land zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit großem Besitz; das hebräische Wort kann Besitz, Habe, Güter oder Reichtum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Präposition kann je nach Zusammenhang verschiedene Beziehungen ausdrücken; hier legt der Zusammenhang eine feindliche Ausrichtung nahe.
    reason: lexical_note
lexical_decisions:
- source_word: וְיָשֹׁב אַרְצוֹ
  choice: Dann wird er … in sein Land zurückkehren
  rationale: Das Qal-Imperfekt von שׁוב bezeichnet die Rückkehr; „Dann“ gibt den Fortgang der prophetischen Darstellung in natürlichem Deutsch wieder. אֶרֶץ wird im geopolitischen Zusammenhang angemessen mit „Land“ übersetzt.
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: mit großem Reichtum
  rationale: רְכוּשׁ kann Besitz, Habe, Güter oder Reichtum bezeichnen. „Reichtum“ ist idiomatisch und vermeidet die nicht ausdrücklich genannte Festlegung auf Beute.
- source_word: וּלְבָבוֹ עַל
  choice: Sein Herz aber wird gegen … gerichtet sein
  rationale: לֵבָב bezeichnet hier die innere Haltung; עַל gibt deren Ausrichtung an und ist im Kontext feindlich zu verstehen. „Aber“ macht den inhaltlichen Gegensatz im Deutschen deutlich.
- source_word: בְּרִית קֹדֶשׁ
  choice: den heiligen Bund
  rationale: בְּרִית bedeutet „Bund“, während קֹדֶשׁ die Heiligkeit dieses Bundes kennzeichnet. Die Wendung bleibt ohne interpretierende Eingrenzung erhalten.
- source_word: וְעָשָׂה
  choice: er wird handeln
  rationale: עשׂה ist ohne genanntes Objekt bewusst unspezifisch. „Handeln“ bewahrt diese Kürze, ohne eine konkrete Tat oder eigenmächtiges Handeln in den Text einzutragen.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: und in sein Land zurückkehren
  rationale: Die Wiederholung von שׁוב im Hebräischen wird auch im Deutschen beibehalten und markiert die abschließende Rückkehr nach dem dazwischen genannten Handeln.
theological_decisions:
- issue: Bezug des „heiligen Bundes“
  choice: Die Bundesbezeichnung wird ohne erklärende Erweiterung beibehalten.
  alternative: die jüdische Religion; Gottes Bundesvolk oder Bundesordnung
  rationale: Der Ausdruck kann im Zusammenhang auf die mit Gottes heiligem Volk verbundene Bundesordnung zielen, doch der hebräische Text spricht ausdrücklich vom Bund. Eine engere Deutung wird daher nicht in den Haupttext aufgenommen.
- issue: Ausrichtung seines Herzens
  choice: Die im Kontext naheliegende feindliche Ausrichtung wird mit „gegen“ wiedergegeben.
  alternative: Sein Herz wird auf den heiligen Bund gerichtet sein.
  rationale: עַל kann allgemein eine Ausrichtung anzeigen; der Zusammenhang legt jedoch Gegnerschaft nahe. Eine Fußnote wahrt die formal mögliche, weniger bestimmte Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und inhaltlich offene Formulierung „er wird handeln“ sowie die zweimalige Nennung seiner Rückkehr bewahren die auffällige Struktur des Hebräischen.
