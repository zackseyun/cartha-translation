  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: de
  text: Dann wird an seiner Stelle einer auftreten, der einen Abgabeneintreiber[a] durch den Glanz des Königreichs[b] ziehen lässt. Doch in wenigen Tagen wird er zerbrochen werden – nicht im Zorn[c] und nicht im Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Steuereintreiber“ oder „einen Bedrücker“. Das hebräische Wort bezeichnet jemanden, der Abgaben oder Zahlungen eintreibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Herrlichkeit des Königreichs“. Die Wendung kann den prächtigsten Teil des Reiches oder allgemeiner die Majestät des Königreichs meinen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht durch Zorn“ oder „nicht durch einen Zornesausbruch“. Der hebräische Ausdruck ist knapp und lässt den genauen Zusammenhang offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: Dann wird … einer auftreten
  rationale: עמד bezeichnet in der Abfolge von Daniel 11 das Auftreten des nächsten Herrschers; „Dann“ gibt den erzählerischen Fortgang durch וְ wieder.
- source_word: עַל כַּנּוֹ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet hier die Stellung beziehungsweise Nachfolge des vorigen Herrschers.
- source_word: מַעֲבִיר
  choice: ziehen lässt
  rationale: Das Hifil-Partizip von עבר bedeutet, dass jemand den genannten Beamten durch ein Gebiet ziehen lässt; diese Wiedergabe bewahrt das Bewegungsbild des Hebräischen.
- source_word: נוֹגֵשׂ
  choice: Abgabeneintreiber
  rationale: Das Wort bezeichnet jemanden, der Abgaben oder Zahlungen eintreibt. Die Wahl ist im Deutschen verständlich, ohne die Funktion enger als der hebräische Ausdruck festzulegen.
- source_word: הֶדֶר מַלְכוּת
  choice: die Pracht des Königreichs
  rationale: הדר kann Pracht, Herrlichkeit oder Majestät bezeichnen. Die Genitivverbindung bleibt erhalten und lässt offen, ob der prächtigste Teil des Reiches oder seine Herrlichkeit allgemein gemeint ist.
- source_word: וּבְיָמִים אֲחָדִים
  choice: Doch nach wenigen Tagen
  rationale: Die Wendung bezeichnet eine kurze Zeitspanne; „nach wenigen Tagen“ ist natürlich und bleibt nah am Wortlaut.
- source_word: יִשָּׁבֵר
  choice: wird er zerbrochen werden
  rationale: Das Nifal von שבר beschreibt bildhaft seinen Untergang. „Zerbrochen werden“ erhält dieses Bild und vermeidet eine genauere historische Festlegung.
- source_word: וְלֹא בְאַפַּיִם
  choice: nicht im Zorn
  rationale: אַפַּיִם bezeichnet idiomatisch Zorn. Die knappe Formulierung wahrt die Unbestimmtheit darüber, wessen Zorn gemeint ist und wie dieser mit dem Untergang zusammenhängt.
- source_word: וְלֹא בְמִלְחָמָה
  choice: und nicht im Kampf
  rationale: מלחמה kann Krieg oder Kampf bedeuten; „im Kampf“ passt zur Aussage über die Art seines Untergangs.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auftreten“ bildet die dynastische Nachfolge natürlich ab; „Abgabeneintreiber“ ist allgemein verständlich. Die ungewöhnliche Bildsprache „zerbrochen werden“ und die knappe Aussage „nicht im Zorn“ bleiben bewusst erhalten, um die Mehrdeutigkeit des Hebräischen nicht aufzulösen.
