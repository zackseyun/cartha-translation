source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: de
  text: Seine Söhne werden sich zum Kampf rüsten und eine gewaltige Menge an Truppen zusammenziehen. Er wird ganz gewiss kommen, überfluten und hindurchziehen[a]. Dann wird er zurückkehren und bis zu seiner Festung[b] Krieg führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wechselt hier von „seine Söhne“ zum Singular „er“, ohne diesen näher zu identifizieren.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis zu seiner Schutzburg“ oder „bis zu seinem starken Ort“. Das Hebräische sagt nicht ausdrücklich, wem die Festung gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָיו
  choice: Seine Söhne
  rationale: בנים bezeichnet im Zusammenhang des dynastischen Konflikts die männlichen Nachkommen des Königs; „Söhne“ ist daher genauer als das allgemeinere „Kinder“.
- source_word: יִתְגָּרוּ
  choice: werden sich zum Kampf rüsten
  rationale: Der Hitpael von גרה bezeichnet hier ein Sich-Erheben beziehungsweise Sich-Rüsten zum Konflikt. Die Formulierung bewahrt den reflexiven Zug und macht den militärischen Zusammenhang natürlich verständlich.
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: und eine gewaltige Menge an Truppen zusammenziehen
  rationale: הֲמוֹן bezeichnet eine große Menge, חֲיָלִים im Kontext Truppen oder Streitkräfte. „Zusammenziehen“ gibt das militärische Sammeln idiomatisch wieder.
- source_word: וּבָא בּוֹא
  choice: Einer von ihnen wird ganz gewiss heranrücken
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. Der Wechsel vom Plural zu einem nicht näher bezeichneten Singular wird mit „Einer von ihnen“ sichtbar gemacht, ohne den Sohn historisch zu identifizieren.
- source_word: וְשָׁטַף
  choice: wie eine Flut alles überschwemmen
  rationale: שטף zeichnet den überwältigenden Vormarsch als Flut. Der Vergleich macht das im Deutschen verständlich, ohne das militärische Bild aufzulösen.
- source_word: וְעָבָר
  choice: und hindurchziehen
  rationale: עבר setzt das Bild der Bewegung durch ein Gebiet fort; „hindurchziehen“ gibt diese räumliche Bewegung knapp wieder.
- source_word: וְיָשֹׁב
  choice: Dann wird er zurückkehren
  rationale: שוב bezeichnet die Rückkehr beziehungsweise Umkehr. „Dann“ verdeutlicht lediglich die Abfolge der hebräischen Verbformen.
- source_word: וְיִתְגָּרֶה
  choice: und … Krieg führen
  rationale: Die erneute Form von גרה bezeichnet hier das Eintreten in den Kampf. „Krieg führen“ gibt den militärischen Sinn natürlich wieder.
- source_word: עַד מָעֻזֹּה
  choice: bis zu seiner Festung
  rationale: מָעוֹז bezeichnet eine Festung oder einen befestigten Zufluchtsort. Das maskuline Singularsuffix wird mit „seiner“ bewahrt; wessen Festung gemeint ist, bleibt offen.
theological_decisions:
- issue: Bezug des singularischen Handelnden nach „seine Söhne“
  choice: Der Wechsel zum Singular wird als „Einer von ihnen“ ausdrücklich wiedergegeben, ohne den betreffenden Sohn zu benennen.
  alternative: „Er wird ganz gewiss heranrücken“ oder die historische Identität eines bestimmten Sohnes in den Text aufnehmen.
  rationale: Der hebräische Text wechselt vom Plural zum Singular, nennt den einzelnen Sohn jedoch nicht. Die Übersetzung bewahrt sowohl den Wechsel als auch die fehlende Identifizierung.
- issue: Bezug von „seiner Festung“
  choice: Das singularische Possessivpronomen bleibt stehen, sein Bezug wird nicht festgelegt.
  alternative: „ihre Festung“ oder die ausdrückliche Zuordnung zu einer bestimmten historischen Person.
  rationale: Der hebräische Suffix ist maskulin und singularisch, doch sein Bezugswort ist kontextuell umstritten. Eine eindeutige Zuordnung würde die im Text verbleibende Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Militärische Fachsprache wird vermieden, soweit sie für das Verständnis nicht nötig ist. Das Flutbild des hebräischen Textes sowie die grammatischen Mehrdeutigkeiten beim singularischen Handelnden und beim Besitzer der Festung bleiben erhalten.
