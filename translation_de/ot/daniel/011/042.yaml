  text: וְ/יִשְׁלַ֥ח יָד֖/וֹ בַּ/אֲרָצ֑וֹת וְ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א תִהְיֶ֖ה לִ/פְלֵיטָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/042.yaml
  text: He will stretch out his hand against the countries[a], and the land of Egypt will not escape.
translation:
  language: de
  text: Er wird seine Hand gegen die Länder ausstrecken, und das Land Ägypten wird nicht entkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird nicht zum Entrinnen sein“; auch möglich: „wird keinen Ausweg haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁלַח יָדוֹ
  choice: Er wird seine Hand … ausstrecken
  rationale: Die Verbindung von שׁלח mit „Hand“ beschreibt bildhaft das Ausüben von Macht oder einen Angriff. „Seine Hand ausstrecken“ bewahrt dieses hebräische Bild und ist im Deutschen verständlich.
- source_word: בַּאֲרָצוֹת
  choice: gegen die Länder
  rationale: בְּ wird im militärischen Zusammenhang als gegen gerichtet verstanden; der Plural אֲרָצוֹת bezeichnet mehrere Länder beziehungsweise Gebiete.
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: und auch das Land Ägypten
  rationale: Die ausdrückliche Wendung „Land Ägypten“ wird zur Wahrung des geografischen Akzents beibehalten. „Auch“ gibt hier natürlich wieder, dass Ägypten in die zuvor genannten Länder einbezogen und besonders hervorgehoben wird.
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: wird nicht entkommen
  rationale: Die wörtliche Konstruktion „wird nicht zum Entrinnen sein“ besagt idiomatisch, dass Ägypten seinem Zugriff nicht entgehen wird. „Wird nicht entkommen“ ist prägnant und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache der ausgestreckten Hand und die ausdrückliche Bezeichnung „Land Ägypten“ bleiben erhalten.
