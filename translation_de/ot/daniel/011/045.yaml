source:
  edition: WLC
  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: de
  text: Er wird die Zelte seines königlichen Pavillons[a] zwischen den Meeren und dem prächtigen heiligen Berg[b] aufschlagen. Doch er wird an sein Ende kommen, und niemand wird ihm helfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zelte seines Palastes“, „seine königlichen Zelte“ oder „seinen königlichen Pavillon“. Das seltene Wort bezeichnet wahrscheinlich eine königliche Residenz oder einen repräsentativen Pavillon.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem herrlichen heiligen Berg“ oder „dem Berg der heiligen Pracht“. Gemeint ist wahrscheinlich der heilige Berg bei Zion beziehungsweise Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: wird … aufschlagen
  rationale: נטע bedeutet wörtlich „pflanzen“; mit Zelten als Objekt bezeichnet es idiomatisch deren Aufschlagen. Die deutsche Wendung ist natürlich und bewahrt das konkrete Bild.
- source_word: אָהֳלֵי אַפַּדְנוֹ
  choice: seine Palastzelte
  rationale: Der Plural „Zelte“ bleibt erhalten. Das seltene Lehnwort אַפֶּדֶן bezeichnet wahrscheinlich einen Palast, eine königliche Residenz oder einen Staatspavillon; „Palastzelte“ gibt im Kontext eines Herrscherlagers die Verbindung knapp wieder, ohne einen festen Steinbau vorauszusetzen.
- source_word: בֵּין יַמִּים
  choice: zwischen den Meeren
  rationale: Die hebräische Pluralform wird bewahrt und als natürliche geografische Wendung wiedergegeben.
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: und dem prächtigen heiligen Berg
  rationale: Nach בֵּין bildet לְ das zweite Glied der Konstruktion „zwischen … und …“. צְבִי kann Schönheit, Pracht oder Zierde bezeichnen; „prächtig“ wahrt den positiven Glanzbegriff, ohne den mutmaßlichen Bezug auf Zion/Jerusalem ausdrücklich in den Text einzutragen.
- source_word: וּבָא עַד קִצּוֹ
  choice: Doch er wird an sein Ende kommen
  rationale: „An sein Ende kommen“ entspricht dem Hebräischen eng und klingt im Deutschen idiomatisch. „Doch“ bringt den kontextuellen Gegensatz zwischen seiner machtvollen Lagergründung und seinem bevorstehenden Ende zum Ausdruck.
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: und niemand wird ihm helfen
  rationale: Die Formulierung gibt das Fehlen jedes Helfers klar und natürlich wieder.
theological_decisions:
- issue: Identität des in Daniel 11,45 genannten Herrschers
  choice: Der Bezug bleibt wie im Hebräischen durch „er“ unausgesprochen.
  alternative: Antiochus IV. Epiphanes; eine endzeitliche antichristliche Gestalt; ein zusammengesetzter oder typologischer Herrscher
  rationale: Der Vers identifiziert die Gestalt nicht ausdrücklich. Eine bestimmte historische oder eschatologische Deutung wird daher nicht in den Übersetzungstext aufgenommen.
- issue: Geografische Bestimmung des heiligen Berges
  choice: Die Bezeichnung „der prächtige heilige Berg“ bleibt im Haupttext stehen.
  alternative: Ausdrückliche Wiedergabe als Zion oder Jerusalem
  rationale: Zion beziehungsweise Jerusalem ist wahrscheinlich gemeint, wird im hebräischen Wortlaut aber nicht namentlich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Form „Palastzelte“ erhält den ungewöhnlichen Charakter des hebräischen Ausdrucks, während die Fußnote die wichtigsten Deutungsmöglichkeiten nennt. Der Satzbau bleibt klar und gut vorlesbar.
