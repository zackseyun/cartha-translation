id: DAN.11.29
reference: Daniel 11:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/מּוֹעֵ֥ד יָשׁ֖וּב וּ/בָ֣א בַ/נֶּ֑גֶב וְ/לֹֽא תִהְיֶ֥ה כָ/רִאשֹׁנָ֖ה וְ/כָ/אַחֲרֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
translation:
  language: de
  text: Zur festgesetzten Zeit wird er zurückkehren und in den Süden ziehen. Doch es wird nicht so sein wie beim ersten und beim letzten Mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Doch es wird nicht sein wie zuvor und wie danach.“ Der hebräische Vergleich ist knapp und lässt unausgesprochen, was genau miteinander verglichen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: Zur festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet hier einen bestimmten, festgesetzten Zeitpunkt. Die Wiedergabe bewahrt die zeitliche Bestimmtheit, ohne ein Fest oder eine Zusammenkunft anzunehmen.
- source_word: יָשׁוּב
  choice: wird er zurückkehren
  rationale: Das Qal von שׁוּב bedeutet gewöhnlich „zurückkehren“ oder „umkehren“; im Zusammenhang eines erneuten Feldzugs ist „zurückkehren“ natürlich und präzise.
- source_word: וּבָא
  choice: und … ziehen
  rationale: בוא bedeutet grundsätzlich „kommen“ oder „hineingehen“. Deutsch verwendet bei einer militärischen Bewegung in ein Gebiet idiomatisch „in den Süden ziehen“, ohne den Bewegungsaspekt zu verändern.
- source_word: בַנֶּגֶב
  choice: in den Süden
  rationale: נֶגֶב kann den Negev bezeichnen, doch der geopolitische Gegensatz von Norden und Süden in Daniel 11 spricht hier für das südliche Reich beziehungsweise Gebiet.
- source_word: וְלֹא תִהְיֶה
  choice: Doch es wird nicht so sein
  rationale: Die feminine Singularform verweist wahrscheinlich unausgesprochen auf den Feldzug oder dessen Verlauf. Die unpersönliche deutsche Form lässt diesen Bezug wie das Hebräische offen.
- source_word: כָרִאשֹׁנָה וְכָאַחֲרֹנָה
  choice: wie beim ersten und beim letzten Mal
  rationale: Die substantivisch gebrauchten femininen Adjektive bedeuten „die erste/frühere“ und „die letzte/spätere“. „Mal“ macht den knappen Vergleich im Deutschen verständlich, während offenbleibt, welches Ereignis genau verglichen wird; das verbindende וְ wird als „und“ wiedergegeben.
theological_decisions:
- issue: Bezug des elliptischen Vergleichs
  choice: Der Haupttext belässt offen, ob Feldzüge, Verläufe oder Ergebnisse miteinander verglichen werden.
  alternative: Den Satz ausdrücklich auf den Erfolg oder Ausgang des Feldzugs beziehen.
  rationale: Das Hebräische nennt den Gegenstand des Vergleichs nicht. Eine ausdrückliche Deutung als Erfolg, Niederlage oder Feldzug würde die im Ausgangstext vorhandene Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In den Süden ziehen“ ist im militärisch-geopolitischen Zusammenhang natürlicher als das wörtlichere „in den Süden kommen“. Der zweite Satz bewahrt bewusst die elliptische Ausdrucksweise des Hebräischen.
