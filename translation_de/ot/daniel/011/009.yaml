  text: וּ/בָ֗א בְּ/מַלְכוּת֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/שָׁ֖ב אֶל אַדְמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: de
  text: Dann wird er in das Reich des Königs des Südens kommen und in sein eigenes Land zurückkehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: Dann wird er … kommen
  rationale: Das mit וְ verbundene Perfekt setzt in der prophetischen Erzählfolge die Handlung fort. „Dann“ gibt diese Abfolge im Deutschen natürlich wieder, während „kommen“ die Grundbedeutung von בוא bewahrt.
- source_word: בְּמַלְכוּת
  choice: in das Reich
  rationale: מַלְכוּת bezeichnet hier den territorial-politischen Herrschaftsbereich. Bei „kommen“ kann בְ eine gerichtete Bewegung ausdrücken, daher „in das Reich“.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: des Königs des Südens
  rationale: Die Wendung ist in Daniel 11 die wiederkehrende geopolitische Bezeichnung für den südlichen Herrscher. „Süden“ passt deshalb besser als der Ortsname „Negev“.
- source_word: וְשָׁב
  choice: und … zurückkehren
  rationale: שׁוב bedeutet hier „zurückkehren“. Das vorangestellte וְ wird seinem normalen Verknüpfungswert entsprechend mit „und“ wiedergegeben; ein ausdrücklich adversatives „aber“ steht im Hebräischen nicht.
- source_word: אֶל אַדְמָתוֹ
  choice: in sein eigenes Land
  rationale: אֲדָמָה bezeichnet in diesem politischen Zusammenhang das eigene Land. „Eigenes“ verdeutlicht den hebräischen Possessivsuffix idiomatisch, ohne einen zusätzlichen Gegensatz einzuführen.
