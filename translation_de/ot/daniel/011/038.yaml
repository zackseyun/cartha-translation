source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: de
  text: Stattdessen wird er einen Gott der Festungen[a] an seiner Stelle[b] ehren. Einen Gott, den seine Väter nicht kannten, wird er mit Gold und Silber, mit Edelsteinen und Kostbarkeiten[c] ehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Gott der befestigten Orte“ beziehungsweise „einen Gott der Zufluchtsstätten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auf seinem Sockel“ oder „auf seiner Basis“; die schwierige Wendung kann auch „anstelle seiner“ bedeuten.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „begehrenswerte Dinge“ beziehungsweise „Schätze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ
  choice: Stattdessen wird er einen Gott
  rationale: Die Verbindung aus Konjunktion und לְ leitet im Zusammenhang einen Gegensatz zum vorher Gesagten ein. „Stattdessen“ gibt diese Diskursfunktion natürlich wieder, ohne die Gottheit näher zu bestimmen.
- source_word: מָעֻזִּים
  choice: Festungen
  rationale: Der Plural bezeichnet befestigte Orte beziehungsweise Stätten der Stärke. „Festungen“ ist im militärisch-politischen Zusammenhang verständlich und nah am hebräischen Ausdruck.
- source_word: עַל־כַּנּוֹ
  choice: an seiner Stelle
  rationale: Die Wendung ist syntaktisch knapp und in ihrer Bedeutung umstritten. Die idiomatische Wiedergabe wahrt den wahrscheinlichen Stellvertretungs- oder Ortsbezug; die wörtlicheren räumlichen Möglichkeiten stehen in der Fußnote.
- source_word: יְכַבֵּד
  choice: wird er … ehren
  rationale: Das Piel von כבד bedeutet hier „ehren“ beziehungsweise „verherrlichen“. „Ehren“ ist präzise, natürlich und wird für beide Vorkommen einheitlich verwendet.
- source_word: אֲבֹתָיו
  choice: seine Väter
  rationale: Die wörtliche Wiedergabe bewahrt den Bezug auf die männliche Ahnenlinie; gemeint sind seine Vorväter beziehungsweise Vorfahren.
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: mit Gold und Silber
  rationale: Die Präposition בְּ bezeichnet hier das Mittel oder die Ausstattung, durch die der Gott geehrt wird. „Mit“ ist im Deutschen idiomatisch.
- source_word: וּבְאֶבֶן יְקָרָה
  choice: mit Edelsteinen
  rationale: Obwohl אֶבֶן grammatisch im Singular steht, kann die Sachbezeichnung kollektiv verstanden werden. Der deutsche Plural ist in dieser Aufzählung natürlich.
- source_word: וּבַחֲמֻדוֹת
  choice: und Kostbarkeiten
  rationale: Das Substantiv bezeichnet begehrte oder wertvolle Dinge. „Kostbarkeiten“ bewahrt die Breite des Ausdrucks besser als die engere Deutung „Schätze“.
theological_decisions:
- issue: Identität des „Gottes der Festungen“
  choice: Die Wendung bleibt eine unbestimmte, beschreibende Bezeichnung.
  alternative: Bestimmung als konkrete antike Gottheit, Kriegsgott oder als Personifikation militärischer Macht.
  rationale: Der Vers selbst bietet keine hinreichende Grundlage für eine eindeutige historische oder eschatologische Identifizierung. Die Übersetzung wahrt deshalb die sachliche und theologische Offenheit.
- issue: Bedeutung von עַל־כַּנּוֹ
  choice: „an seiner Stelle“
  alternative: „auf seinem Sockel“, „auf seinem Standort“ oder „anstelle seiner/seiner selbst“
  rationale: Die hebräische Wendung ist mehrdeutig und ihr Bezugswort nicht zweifelsfrei feststellbar. Die Hauptfassung gibt den wahrscheinlichen idiomatischen Sinn wieder, während die Fußnote den wörtlichen räumlichen Sinn und die mögliche Stellvertretungsbedeutung erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Einen Gott … wird er … ehren“ bildet die hebräische Wiederaufnahme nach und hält die beiden Beschreibungen eng zusammen. Die schwer deutbare Orts- beziehungsweise Stellvertretungsformel wird nicht dogmatisch vereindeutigt.
