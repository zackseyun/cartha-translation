source:
  edition: WLC
  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: de
  text: Nach Ablauf einiger Jahre werden sie sich verbünden. Dann wird die Tochter des Königs des Südens zum König des Nordens kommen, um einen Ausgleich herbeizuführen[a]. Doch sie wird die Kraft ihres Arms nicht bewahren, und auch er und sein Arm werden keinen Bestand haben; auch sie wird preisgegeben werden – zusammen mit denen, die sie gebracht haben, mit ihrem Erzeuger[b] und mit dem, der sie damals stärkte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Geradheiten/Gerechtigkeiten zu schaffen“; gemeint sein können gerechte Bedingungen, ein Ausgleich oder eine Vereinbarung.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Erzeuger“ folgt der maskulinen Form des hebräischen Partizips. Andere Übersetzungen geben die Stelle mit „ihr Kind“ oder „ihr Nachkomme“ wieder beziehungsweise nehmen einen anderen Bezug an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: Nach Ablauf einiger Jahre
  rationale: Die Wendung bezeichnet idiomatisch das Ende eines nicht näher bestimmten Zeitraums von Jahren. „Nach Ablauf einiger Jahre“ ist natürliches Deutsch und wahrt die zeitliche Unbestimmtheit.
- source_word: יִתְחַבָּרוּ
  choice: werden sie sich verbünden
  rationale: Der Hitpael von חבר bezeichnet hier im politischen Zusammenhang ein Sich-Zusammenschließen; „sich verbünden“ gibt diesen Sinn prägnant wieder.
- source_word: וּבַת מֶלֶךְ הַנֶּגֶב
  choice: die Tochter des Königs des Südens
  rationale: Die definite Konstruktverbindung und die in Daniel 11 etablierten politischen Richtungsbezeichnungen werden beibehalten.
- source_word: תָּבוֹא אֶל מֶלֶךְ הַצָּפוֹן
  choice: wird … zum König des Nordens kommen
  rationale: בוא kann je nach Perspektive „kommen“ oder „gehen“ bedeuten; „zum … kommen“ bildet die Bewegung zum nördlichen König angemessen ab.
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: um einen Ausgleich herbeizuführen
  rationale: מֵישָׁרִים bezeichnet wörtlich Geradheiten, Billigkeit oder gerechte Bedingungen. Im diplomatischen Kontext trifft „Ausgleich“ den Sinn, ohne ausschließlich einen formellen Vertrag vorauszusetzen.
- source_word: לֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: sie wird die Kraft ihres Arms nicht bewahren
  rationale: Die Metapher des Arms als Macht oder Stärke bleibt erhalten; עצר wird als Festhalten beziehungsweise Bewahren verstanden.
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: auch er und sein Arm werden keinen Bestand haben
  rationale: Der maskuline Singular wird als Bezug auf den König verstanden; zugleich bleibt der Arm als Bild für seine Macht oder Unterstützung sichtbar. „Bestand haben“ gibt עמד in diesem Zusammenhang idiomatisch wieder.
- source_word: וְתִנָּתֵן הִיא
  choice: sie wird preisgegeben werden
  rationale: Der Nifal von נתן ist passiv. „Preisgegeben werden“ bringt Übergabe und schutzlosen Verlust zum Ausdruck, ohne den nicht genannten Handelnden festzulegen.
- source_word: וּמְבִיאֶיהָ
  choice: denen, die sie gebracht haben
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet diejenigen, die sie brachten oder begleiteten; die direkte Wiedergabe vermeidet zusätzliche Spezifizierung.
- source_word: וְהַיֹּלְדָהּ
  choice: mit ihrem Erzeuger
  rationale: Die masoretische Form ist ein maskulines Partizip von ילד und weist daher auf denjenigen, der sie gezeugt hat. „Erzeuger“ bewahrt diese grammatische Aussage knapp; die textliche Unsicherheit wird in der Fußnote genannt.
- source_word: וּמַחֲזִקָהּ
  choice: mit dem, der sie … unterstützt hat
  rationale: Das Hifil-Partizip von חזק kann stärken, stützen oder unterstützen bedeuten. „Unterstützt“ lässt die genaue politische oder persönliche Funktion offen.
- source_word: בָּעִתִּים
  choice: in jener Zeit
  rationale: Der hebräische Plural kann einen Zeitabschnitt bezeichnen. Im Deutschen ist „in jener Zeit“ hier natürlicher als ein mechanischer Plural.
theological_decisions:
- issue: Bezug von וְלֹא יַעֲמֹד („er wird nicht bestehen“)
  choice: Der maskuline Singular wird im Haupttext auf den König des Nordens bezogen.
  alternative: Das Verb könnte allgemeiner auf die zuvor genannte Macht beziehungsweise den „Arm“ oder auf einen anderen männlichen Bezugsträger im Zusammenhang bezogen werden.
  rationale: Der nächstliegende ausdrücklich männliche persönliche Bezugsträger ist der König des Nordens. Die Formulierung „er und sein Arm“ folgt der masoretischen Syntax, ohne die historische Identifikation auszudeuten.
- issue: Identität des in וְהַיֹּלְדָהּ genannten Mannes
  choice: Die maskuline Form wird mit „ihrem Erzeuger“ wiedergegeben.
  alternative: Manche Überlieferungen oder Übersetzungen verstehen die Stelle als „ihr Kind/Nachkomme“ oder setzen einen anderen Bezug voraus.
  rationale: Die Übersetzung folgt zunächst dem konsonantischen und vokalisierten masoretischen Text, macht aber die vorhandene Auslegungs- und Textunsicherheit in der Fußnote transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die politischen Titel „König des Südens“ und „König des Nordens“ werden konsistent beibehalten. Die Arm-Metapher bleibt bewusst sichtbar; schwer verständliche Hebraismen werden durch idiomatische Satzführung und knappe Fußnoten erschlossen.
