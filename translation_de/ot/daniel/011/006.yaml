  to: Nach Ablauf einiger Jahre werden sie sich verbünden. Dann wird die Tochter des Königs des Südens zum König des Nordens kommen, um einen Ausgleich herbeizuführen[a]. Doch sie wird die Kraft ihres Arms nicht bewahren, und auch er und sein Arm werden keinen Bestand haben; auch sie wird preisgegeben werden – zusammen mit denen, die sie gebracht haben, mit ihrem Erzeuger[b] und mit dem, der sie damals stärkte.
