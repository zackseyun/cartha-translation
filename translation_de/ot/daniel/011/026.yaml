  text: וְ/אֹכְלֵ֧י פַת בָּג֛/וֹ יִשְׁבְּר֖וּ/הוּ וְ/חֵיל֣/וֹ יִשְׁט֑וֹף וְ/נָפְל֖וּ חֲלָלִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
translation:
  language: de
  text: Diejenigen, die von seiner Speise essen[a], werden ihn brechen[b]. Sein Heer wird überströmen[c], und viele werden erschlagen fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diejenigen, die seine Speise essen“. Die Wendung kann Menschen bezeichnen, die von den Vorräten eines Herrschers versorgt werden, etwa Vertraute oder Abhängige an seinem Hof.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden ihn zugrunde richten“. Das Hebräische lautet wörtlich „werden ihn brechen“ und beschreibt bildlich seinen Ruin.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Verb ist aktiv und ruft das Bild einer Flut hervor: „sein Heer wird überströmen“. Je nach Verständnis des Zusammenhangs wird es auch im Sinn eines überwältigenden militärischen Vormarschs erklärt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  choice: die von seinem Brot essen
  rationale: Die Wendung bezeichnet Menschen, die aus den Vorräten des Königs versorgt werden, also enge Vertraute oder Abhängige. „Von seinem Brot essen“ bewahrt das konkrete Bild und klingt im Deutschen zugleich idiomatisch.
- source_word: יִשְׁבְּר֖וּהוּ
  choice: werden ihn brechen
  rationale: שׁבר bedeutet wörtlich „brechen“ und kann bildlich den Ruin oder Sturz einer Person bezeichnen. Die Übersetzung erhält das markante Bild, ohne die Art seines Untergangs genauer festzulegen.
- source_word: חֵילוֹ
  choice: sein Heer
  rationale: חַיִל kann Kraft, Vermögen oder Streitmacht bedeuten. Im militärischen Zusammenhang ist „Heer“ die klare und passende Wiedergabe.
- source_word: יִשְׁטוֹף
  choice: wird hinweggeschwemmt
  rationale: Das Verb שטף beschreibt das Überströmen oder Fortreißen durch eine Flut. Die passive deutsche Form gibt im Zusammenhang die Niederlage des Heeres natürlich wieder und bewahrt zugleich das Flutbild.
- source_word: וְנָפְלוּ חֲלָלִים רַבִּים
  choice: und viele Erschlagene werden fallen
  rationale: חֲלָלִים bezeichnet tödlich Getroffene oder Erschlagene. Die Wiedergabe hält an der knappen, eindringlichen Formulierung des Hebräischen fest.
