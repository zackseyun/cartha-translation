id: DAN.11.5
reference: Daniel 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֶחֱזַ֥ק מֶֽלֶךְ הַ/נֶּ֖גֶב וּ/מִן שָׂרָ֑י/ו וְ/יֶחֱזַ֤ק עָלָי/ו֙ וּ/מָשָׁ֔ל מִמְשָׁ֥ל רַ֖ב מֶמְשַׁלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: de
  text: Dann wird der König des Südens mächtig werden. Doch einer seiner Befehlshaber wird mächtiger werden als er[a] und herrschen; seine Herrschaft wird eine gewaltige Herrschaft sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Und einer von seinen Obersten wird mächtig werden über ihn.“ Die hebräische Formulierung kann Überlegenheit ausdrücken; der Haupttext gibt diesen vergleichenden Sinn in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: wird mächtig werden
  rationale: Das Qal-Imperfekt von חזק bezeichnet hier das Erlangen oder Entfalten politischer und militärischer Macht; die Zukunftsform entspricht dem prophetischen Zusammenhang.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: der König des Südens
  rationale: Die feste Richtungs- und Herrscherbezeichnung wird formal bewahrt und kann im weiteren Kapitel einheitlich verwendet werden.
- source_word: וּמִן שָׂרָיו
  choice: Doch einer seiner Befehlshaber
  rationale: מִן mit dem Plural und Suffix bezeichnet hier einen aus dem Kreis seiner שׂרים. „Befehlshaber“ passt zum politischen und militärischen Kontext; „doch“ macht den im Folgenden liegenden Gegensatz im Deutschen deutlich.
- source_word: וְיֶחֱזַק עָלָיו
  choice: wird mächtiger werden als er
  rationale: חזק mit עַל drückt im Zusammenhang die Überlegenheit gegenüber dem zuvor genannten König aus. Die komparative Wiedergabe ist natürliches Deutsch, ohne die Aussage inhaltlich zu erweitern.
- source_word: וּמָשָׁל
  choice: und herrschen
  rationale: Das Qal-Perfekt mit ו setzt in der prophetischen Darstellung die zukünftige Handlungsfolge fort. „Herrschen“ gibt משל prägnant wieder.
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: seine Herrschaft wird eine gewaltige Herrschaft sein
  rationale: Die Wiederholung von „Herrschaft“ bildet den hebräischen Gleichklang und die Betonung zwischen מִמְשָׁל und מֶמְשָׁלָה nach. „Gewaltig“ bezeichnet hier großen Umfang und große Macht.
theological_decisions: []
