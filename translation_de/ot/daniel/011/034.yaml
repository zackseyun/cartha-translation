  text: וּ/בְ/הִכָּ֣שְׁלָ֔/ם יֵעָזְר֖וּ עֵ֣זֶר מְעָ֑ט וְ/נִלְו֧וּ עֲלֵי/הֶ֛ם רַבִּ֖ים בַּ/חֲלַקְלַקּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/034.yaml
  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
translation:
  language: de
  text: Wenn sie straucheln, wird ihnen wenig Hilfe zuteilwerden, und viele werden sich ihnen mit glatten Worten[a] anschließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Schmeicheleien“ bzw. „durch Schmeicheleien“. Das Hebräische spricht wörtlich von „glatten Dingen“; gemeint ist hier wohl schmeichelnde, möglicherweise irreführende Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: Wenn sie straucheln
  rationale: Der mit בְּ eingeleitete Infinitiv constructus des Niphal bezeichnet hier den zeitlichen Umstand. „Straucheln“ bewahrt das Bild, ohne einen endgültigen Sturz oder völligen Untergang festzulegen.
- source_word: יֵעָזְרוּ
  choice: wird ihnen geholfen werden
  rationale: Der Niphal-Imperfekt von עזר stellt die Betroffenen als Empfänger der Hilfe dar. Die deutsche Passivkonstruktion gibt dies unmittelbar wieder.
- source_word: עֵזֶר מְעָט
  choice: ein wenig geholfen
  rationale: Die Formulierung bringt den begrenzten Umfang der Hilfe natürlich zum Ausdruck, ohne ihre Art näher zu bestimmen.
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: werden sich ihnen anschließen
  rationale: Die Wendung bezeichnet das Sich-Anschließen oder Sich-Angliedern an eine Gruppe. Das Reflexivpronomen bewahrt diese Nuance im Deutschen.
- source_word: רַבִּים
  choice: viele
  rationale: Dies ist die direkte und im modernen Standarddeutsch natürliche Wiedergabe der Mengenangabe.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: mit glatten Worten
  rationale: Die Wiedergabe erhält das hebräische Bild der „glatten Dinge“ und lässt zugleich die kontextuelle Bedeutung schmeichelnder oder täuschender Rede erkennen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Straucheln und glatten Worten bleibt erhalten; die begrenzte Hilfe und die möglicherweise unaufrichtige Art des Anschlusses werden nicht überdeutet.
