  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Bedeutungen des Hebräischen zutreffend wieder: zeitliches Straucheln, begrenzte Hilfe, das Anschließen vieler und die dabei genannte „glatte“ bzw. schmeichlerische Rede. „Wenig Hilfe zuteilwerden“ bildet עֵזֶר מְעָט als begrenzte Hilfe präziser und idiomatischer ab als die doppelte Passivkonstruktion.'
