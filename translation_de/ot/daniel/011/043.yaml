id: DAN.11.43
reference: Daniel 11:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מָשַׁ֗ל בְּ/מִכְמַנֵּי֙ הַ/זָּהָ֣ב וְ/הַ/כֶּ֔סֶף וּ/בְ/כֹ֖ל חֲמֻד֣וֹת מִצְרָ֑יִם וְ/לֻבִ֥ים וְ/כֻשִׁ֖ים בְּ/מִצְעָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: de
  text: Und er wird über die verborgenen Schätze an Gold und Silber[a] und über alle Kostbarkeiten Ägyptens verfügen; Libyer und Kuschiten werden seinen Schritten folgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Schatzkammern mit Gold und Silber“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Libyer und Kuschiten werden in seinem Gefolge sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: Und er wird … verfügen
  rationale: Das Verb bezeichnet hier die Ausübung von Herrschaft oder Kontrolle. In Verbindung mit Schätzen und Kostbarkeiten gibt „über … verfügen“ den gemeinten tatsächlichen Zugriff im Deutschen natürlich wieder.
- source_word: בְּמִכְמַנֵּי
  choice: über die verborgenen Schätze
  rationale: מִכְמָן bezeichnet verborgene oder verwahrte Vorräte beziehungsweise Schätze. „Verborgene Schätze“ bewahrt sowohl den Wert- als auch den Verbergungsaspekt.
- source_word: הַזָּהָב וְהַכֶּסֶף
  choice: an Gold und Silber
  rationale: Die gewöhnlichen Stoffbezeichnungen werden direkt wiedergegeben; „Schätze an Gold und Silber“ ist idiomatisches modernes Deutsch.
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: und über alle Kostbarkeiten Ägyptens
  rationale: חֲמֻדוֹת bezeichnet begehrenswerte, wertvolle Dinge. „Kostbarkeiten“ drückt ihren Wert aus, ohne sie ausschließlich auf Geld oder Edelmetalle einzugrenzen.
- source_word: לֻבִים
  choice: Libyer
  rationale: Das Ethnonym wird mit der im Deutschen üblichen historischen Bezeichnung wiedergegeben.
- source_word: כֻשִׁים
  choice: Kuschiten
  rationale: „Kuschiten“ erhält die historische und geografische Bezeichnung Kusch und vermeidet eine vorschnelle Gleichsetzung mit dem modernen Staat Äthiopien.
- source_word: בְּמִצְעָדָיו
  choice: werden seinen Schritten folgen
  rationale: Der Ausdruck beruht auf dem Wort für Schritt, Gang oder Marsch. Die Übersetzung bewahrt dieses Bild und lässt offen, ob Begleitung, Gefolgschaft oder Unterordnung im Vordergrund steht.
theological_decisions:
- issue: Verhältnis der Libyer und Kuschiten zum Herrscher
  choice: werden seinen Schritten folgen
  alternative: werden in seinem Gefolge sein
  rationale: Der hebräische Ausdruck legt Gefolgschaft nahe, bestimmt aber nicht ausdrücklich, ob sie freiwillig, militärisch erzwungen oder administrativ untergeordnet ist. Die bildhafte Wiedergabe vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „verfügen über“ den Zugriff auf die ägyptischen Reichtümer idiomatisch ausdrückt. Die historischen Volksnamen werden ohne moderne nationale Gleichsetzungen wiedergegeben.
