revisions:
- from: Die flutenden Streitkräfte werden vor ihm hinweggespült und zerschmettert werden, ebenso der Fürst des Bundes.[a][b]
  to: Die flutartigen Streitkräfte[a] werden vor ihm hinweggespült und zerschlagen, ebenso der Fürst des Bundes[b].
  rationale: Die Revision präzisiert das Flutbild, wahrt die syntaktische Zuordnung des abschließenden „Fürsten des Bundes“ zu beiden vorangehenden Verben und verbessert die Positionierung der Fußnotenanker. Sie nimmt keine Identifikation des Bundesfürsten vor und erhält die interpretative Offenheit des hebräischen Textes.
