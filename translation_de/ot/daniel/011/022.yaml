  variant: modern standard German
source:
  edition: WLC
  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: de
  text: Die flutartigen Streitkräfte[a] werden vor ihm hinweggespült und zerschlagen, ebenso der Fürst des Bundes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Arme der Flut«; vermutlich eine bildhafte Bezeichnung für überwältigende militärische Kräfte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Anführer des Bundes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: die flutenden Streitkräfte
  rationale: Wörtlich steht hier »Arme der Flut«. Im militärisch-politischen Zusammenhang bezeichnet זְרֹעוֹת bewaffnete Macht oder Streitkräfte; הַשֶּׁטֶף bewahrt dabei das Bild einer überwältigenden Flut.
- source_word: יִשָּׁטְפוּ
  choice: werden ... hinweggespült werden
  rationale: Der Nifal wird passiv verstanden. »Hinweggespült« nimmt das Flutbild des vorangehenden Ausdrucks auf.
- source_word: מִלְּפָנָיו
  choice: vor ihm
  rationale: Die knappe räumlich-konfrontative Formulierung gibt wieder, dass die Streitkräfte aus seinem Weg beziehungsweise aus seiner Gegenwart beseitigt werden.
- source_word: וְיִשָּׁבֵרוּ
  choice: und zerschmettert werden
  rationale: שבר im Nifal bedeutet »zerbrochen« oder »zerschmettert werden«; im militärischen Kontext drückt »zerschmettert« die Niederlage natürlich und deutlich aus.
- source_word: וְגַם
  choice: ebenso
  rationale: Der Ausdruck fügt den Bundesfürsten als weiteres von denselben Verben betroffenes Satzglied hinzu.
- source_word: נְגִיד בְּרִית
  choice: der Fürst des Bundes
  rationale: נְגִיד kann einen Fürsten, Anführer oder Herrscher bezeichnen. Die traditionelle, gehobene Wiedergabe »Fürst« identifiziert die Person nicht näher; בְּרִית wird im Kontext bestimmt verstanden.
theological_decisions:
- issue: Identität und Bestimmtheit des »Fürsten des Bundes«
  choice: Die Wendung wird als Titel wiedergegeben, ohne die betreffende Person zu identifizieren.
  alternative: Möglich sind insbesondere eine Deutung auf den Hohen Priester Onias III., allgemeiner auf einen mit dem Bund verbundenen Herrscher oder – in diesem Kontext weniger wahrscheinlich – auf eine messianische Gestalt.
  rationale: Der hebräische Text nennt keine historische Identität. Die Übersetzung bewahrt diese Offenheit und vermeidet eine strittige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Flutbild bleibt im Haupttext erkennbar; die ungewöhnliche wörtliche Wendung wird in der Fußnote dokumentiert. Die Identität des Bundesfürsten bleibt bewusst offen.
