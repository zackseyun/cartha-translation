base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: de
  text: Dann wird er sein Angesicht den Küstenländern[a] zuwenden und viele erobern. Doch ein Befehlshaber wird seiner Schmähung gegen ihn ein Ende setzen; ja, er wird ihm seine Schmähung vergelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Inseln“. Das hebräische Wort kann sowohl Inseln als auch allgemeiner Küsten- und Seegebiete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Wortlaut der letzten Satzteile ist schwierig. Möglich ist auch die Auffassung, dass ein Befehlshaber der Schmähung ein Ende setzt, ohne dass die Schmähung auf ihn selbst zurückfällt.
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: wird er sein Angesicht … zuwenden
  rationale: Die hebräische Wendung wird bildhaft und zugleich in natürlichem Deutsch wiedergegeben; sie bezeichnet die Ausrichtung auf ein neues Ziel.
- source_word: לאיים
  choice: den Küstenländern
  rationale: אִיִּים kann Inseln oder allgemeiner Küsten- und Seegebiete bezeichnen. „Küstenländer“ wahrt die geografische Breite, ohne nur buchstäbliche Inseln vorauszusetzen.
- source_word: ולכד רבים
  choice: und viele erobern
  rationale: לכד bezeichnet im militärischen Zusammenhang das Einnehmen oder Erobern. Das substantivisch gebrauchte „viele“ bleibt wie im Hebräischen hinsichtlich Personen, Orte oder Gebiete offen.
- source_word: קצין
  choice: ein Befehlshaber
  rationale: קָצִין bezeichnet einen führenden Amtsträger beziehungsweise militärischen Anführer; der kriegerische Kontext legt „Befehlshaber“ nahe.
- source_word: והשבית ... חרפתו
  choice: wird seiner Schmähung … ein Ende setzen
  rationale: Der Hifil von שבת bedeutet hier, etwas zum Aufhören zu bringen. „Schmähung“ gibt חֶרְפָּה als beleidigende Herabsetzung wieder.
- source_word: בלתי חרפתו ישיב לו
  choice: ja, er wird ihm seine Schmähung vergelten
  rationale: Die gedrängte und schwierige Klausel wird mit emphatischem בִּלְתִּי und יָשִׁיב im Sinn von Zurückgeben beziehungsweise Vergelten verstanden. Die Pronomen bleiben bewusst ohne historische Identifizierung.
theological_decisions:
- issue: Bezug und Syntax der beiden Schlussklauseln
  choice: Ein Befehlshaber beendet die Schmähung des Königs gegen ihn und vergilt sie ihm.
  alternative: Ein Befehlshaber beendet die Schmähung, ohne dass seine eigene Schmähung auf ihn zurückfällt.
  rationale: Die Konstruktion ist syntaktisch umstritten. Die gewählte Fassung versteht den Befehlshaber als Subjekt beider Verben und בִּלְתִּי emphatisch. Durch die beibehaltenen Pronomen wird keine bestimmte historische Identifizierung in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sein Angesicht … zuwenden“ bewahrt das hebräische Bild; „Küstenländer“ und die substantivische Form „viele“ erhalten die sachliche Offenheit des Ausgangstextes. Die schwer verständlichen Schlussklauseln werden lesbar formuliert, ihre Unsicherheit aber in einer Fußnote kenntlich gemacht.
