  text: וְ/יִתְמַרְמַר֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יָצָ֕א וְ/נִלְחַ֥ם עִמּ֖/וֹ עִם מֶ֣לֶךְ הַ/צָּפ֑וֹן וְ/הֶעֱמִיד֙ הָמ֣וֹן רָ֔ב וְ/נִתַּ֥ן הֶ/הָמ֖וֹן בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: de
  text: Dann wird der König des Südens in Zorn geraten, ausziehen und gegen ihn, den König des Nordens, kämpfen.[a] Es wird eine große Streitmacht aufgestellt,[b] doch die Streitmacht wird in seine Hand übergeben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerät in heftige Erregung“ oder „wird erbittert“. Das hebräische Verb bezeichnet starke innere Erregung oder Verbitterung, die zum Handeln führt.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt den Handelnden bei „eine große Streitmacht aufstellen“ nicht erneut. Im Zusammenhang ist wahrscheinlich der König des Nordens gemeint.
    reason: ambiguity_note
  - marker: c
    text: '„In seine Hand übergeben“ bedeutet: seiner Gewalt ausgeliefert. Der Bezug von „seine“ wird im Hebräischen nicht ausdrücklich wiederholt; im Zusammenhang ist wahrscheinlich die Hand des Königs des Südens gemeint.'
    reason: cultural_and_ambiguity_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  choice: Da wird … erbittert
  rationale: Das Hitpael von מרר/מרמר bezeichnet eine starke innere Erregung oder Verbitterung, die zum Handeln führt. „Erbittert“ bewahrt sowohl den Zorn als auch den Beiklang innerer Bitterkeit.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: der König des Südens
  rationale: Die feste Richtungsbezeichnung wird entsprechend dem wiederkehrenden Sprachgebrauch in Daniel 11 beibehalten.
- source_word: וְיָצָא
  choice: ausziehen
  rationale: Im militärischen Zusammenhang gibt „ausziehen“ die Grundbedeutung von יצא natürlich und prägnant wieder.
- source_word: וְנִלְחַם עִמּוֹ עִם מֶלֶךְ הַצָּפוֹן
  choice: gegen ihn, den König des Nordens, kämpfen
  rationale: Obwohl עם wörtlich „mit“ bedeutet, bezeichnet die Verbindung mit נלחם hier einen Kampf gegen jemanden. Die Apposition „den König des Nordens“ bleibt erhalten.
- source_word: וְהֶעֱמִיד
  choice: aufstellen
  rationale: Das Hifil von עמד bedeutet hier, eine Streitmacht aufzustellen beziehungsweise kampfbereit antreten zu lassen.
- source_word: הָמוֹן רָב
  choice: eine große Streitmacht
  rationale: המון bezeichnet eine große Menge oder Masse; im eindeutig militärischen Zusammenhang vermittelt „Streitmacht“ die gemeinte Art der Menge verständlich, ohne ihre Größe abzuschwächen.
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  choice: doch die Streitmacht wird in seine Hand gegeben werden
  rationale: Das Passiv von נתן bezeichnet die Auslieferung. Die Wendung „in seine Hand“ bewahrt das hebräische Bild; „doch“ macht den im Zusammenhang naheliegenden Gegensatz kenntlich.
theological_decisions:
- issue: Bezug der unausgedrückten beziehungsweise pronominalen Subjekte und Besitzanzeiger
  choice: Die Pronomen „er“ und „seine“ bleiben im Haupttext stehen und werden in Fußnoten erläutert.
  alternative: 'Die Könige ausdrücklich wiederholen: „Der König des Nordens … in die Hand des Königs des Südens“.'
  rationale: Der hebräische Wortlaut nennt die Handelnden in der zweiten Satzhälfte nicht erneut. Der Zusammenhang legt nahe, dass der König des Nordens die Streitmacht aufstellt und sie in die Gewalt des Königs des Südens gerät; eine ausdrückliche Einsetzung der Namen würde jedoch die grammatische Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Situation wird durch „ausziehen“, „Streitmacht“ und „aufstellen“ klar ausgedrückt. Die pronominale Mehrdeutigkeit des Hebräischen bleibt im Haupttext erhalten und wird knapp in den Fußnoten erläutert.
