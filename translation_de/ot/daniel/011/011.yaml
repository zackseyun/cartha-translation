    rationale: „Erbittert“ wird hier nicht idiomatisch als prädikatives Ergebnisverb verwendet, und die Reihung ist schwer lesbar. Eine verbale Formulierung wie „in Zorn geraten“ gibt den Sinn klar wieder.
