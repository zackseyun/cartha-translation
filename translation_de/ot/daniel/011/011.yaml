- from: Da wird der König des Südens erbittert[a], ausziehen und gegen ihn, den König des Nordens, kämpfen. Und er[b] wird eine große Streitmacht aufstellen; doch die Streitmacht wird in seine Hand[c] gegeben werden.
  to: Dann wird der König des Südens in Zorn geraten, ausziehen und gegen ihn, den König des Nordens, kämpfen.[a] Es wird eine große Streitmacht aufgestellt,[b] doch die Streitmacht wird in seine Hand übergeben.[c]
  rationale: Die Überarbeitung korrigiert die unnatürliche deutsche Verbfügung und verhindert, dass das deutsche Pronomen „er“ einen wahrscheinlich unzutreffenden Referenten nahelegt. Die aktive hebräische Aussage wird wegen der nicht erneut genannten und im Kontext erschlossenen Referenz unpersönlich wiedergegeben; die Fußnoten erläutern die wahrscheinlichen Bezüge, ohne sie als textlich ausdrücklich auszugeben. Die Abfolge und der Gegensatz der hebräischen Aussagen bleiben erhalten.
