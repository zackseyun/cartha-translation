  source_fidelity: 'Die Grundbegriffe sind zutreffend wiedergegeben: Der König des Südens gerät in heftige Erregung, zieht zum Kampf gegen den König des Nordens aus, eine große militärische Menge wird aufgestellt, und diese wird in die Hand eines der Beteiligten übergeben. Der Entwurf erzeugt jedoch durch „Und er“ einen im Deutschen naheliegenden, aber kontextuell wahrscheinlich falschen Bezug auf den König des Südens, während die Fußnote selbst den König des Nordens als wahrscheinliches Subjekt nennt. Eine unpersönliche Formulierung bewahrt die im Hebräischen nicht erneut ausgedrückten Bezüge besser.'
  naturalness: „Da wird der König des Südens erbittert, ausziehen und … kämpfen“ ist im heutigen Standarddeutsch syntaktisch und idiomatisch holprig. „Dann wird … in Zorn geraten, ausziehen und … kämpfen“ ist klar und würdig. „Es wird eine große Streitmacht aufgestellt“ ist hier eine sachgerechte Möglichkeit, den nicht ausdrücklich wiederaufgenommenen Handelnden nicht künstlich festzulegen.
  terminology: „König des Südens/Nordens“, „ausziehen“, „Streitmacht“ und „in seine Hand übergeben“ passen zum Register und zum militärischen Kontext. „In Zorn geraten“ gibt die intensive Erregung des Verbs natürlicher wieder als das im Prädikat ungebräuchliche „wird erbittert“.
