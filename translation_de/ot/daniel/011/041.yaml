  text: וּ/בָא֙ בְּ/אֶ֣רֶץ הַ/צְּבִ֔י וְ/רַבּ֖וֹת יִכָּשֵׁ֑לוּ וְ/אֵ֨לֶּה֙ יִמָּלְט֣וּ מִ/יָּד֔/וֹ אֱד֣וֹם וּ/מוֹאָ֔ב וְ/רֵאשִׁ֖ית בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
translation:
  language: de
  text: 'Er wird in das herrliche Land[a] einziehen, und viele werden zu Fall kommen. Doch diese werden seiner Hand entkommen: Edom, Moab und der führende Teil der Ammoniter[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das prächtige Land“ oder „das begehrenswerte Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der erste Teil der Söhne Ammons“; auch möglich: „die Vornehmsten unter den Ammonitern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא בְּאֶרֶץ
  choice: Er wird in … einziehen
  rationale: בוא mit בְּ und einer Gebietsangabe bezeichnet hier das Hineinkommen bzw. Einziehen in ein Land; „einziehen“ ist im militärisch-politischen Zusammenhang natürlich und präzise.
- source_word: הַצְּבִי
  choice: das herrliche Land
  rationale: צְבִי kann Schönheit, Pracht oder Begehrenswürdigkeit bezeichnen. „Herrlich“ bewahrt die wertende Bildsprache, ohne die geografische Bezeichnung ausdrücklich als Israel aufzulösen.
- source_word: וְרַבּוֹת
  choice: und viele
  rationale: Das feminine Pluraladjektiv steht substantivisch, doch das Bezugswort fehlt. „Viele“ erhält diese im Hebräischen vorhandene Unbestimmtheit.
- source_word: יִכָּשֵׁלוּ
  choice: werden zu Fall kommen
  rationale: Das Nifal von כשל kann „straucheln“ oder „fallen“ bedeuten. „Zu Fall kommen“ wahrt das Bild und passt zum militärisch-politischen Zusammenhang, ohne ausdrücklich „vernichtet“ oder „besiegt“ einzutragen.
- source_word: וְאֵלֶּה יִמָּלְטוּ מִיָּדוֹ
  choice: Doch diese werden seiner Hand entkommen
  rationale: Das וְ hat hier kontrastive Kraft. „Seiner Hand entkommen“ erhält das konkrete hebräische Machtbild und ist im Deutschen verständlich.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Edom, Moab
  rationale: Gebräuchliche deutsche Formen der Eigennamen.
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  choice: und die Vornehmsten unter den Ammonitern
  rationale: רֵאשִׁית kann den ersten, führenden oder vornehmsten Teil bezeichnen. Der Plural „die Vornehmsten“ gibt die mögliche kollektive Bedeutung idiomatisch wieder; die wörtlichere Struktur wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von „das herrliche Land“
  choice: Die titelartige geografische Bezeichnung bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: „das Land Israel/Juda“
  rationale: Im Kontext ist Israel/Juda naheliegend, doch der hebräische Text nennt diesen Namen hier nicht. Die Übersetzung vermeidet daher eine interpretierende Einfügung.
- issue: Bezug des substantivischen וְרַבּוֹת
  choice: „viele“ ohne ergänztes Bezugswort
  alternative: „viele Länder“ oder „viele Menschen“
  rationale: Das Hebräische lässt offen, was genau gemeint ist. Diese sachlich bedeutsame Mehrdeutigkeit wird bewahrt.
- issue: Bedeutung von רֵאשִׁית בְּנֵי עַמּוֹן
  choice: „die Vornehmsten unter den Ammonitern“
  alternative: „der führende Teil der Söhne Ammons“ oder „die Ersten der Ammoniter“
  rationale: רֵאשִׁית bezeichnet hier wahrscheinlich den führenden bzw. vornehmsten Teil, kann aber auch stärker kollektiv verstanden werden. Die Fußnote hält die wörtlichere Form zugänglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, bleibt aber idiomatisch. Bildhafte Wendungen wie „seiner Hand entkommen“ werden bewahrt; nicht ausdrücklich genannte Bezugswörter werden nicht ergänzt.
