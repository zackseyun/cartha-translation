  text: וַ/יְהִ֥י בָ/הֶ֖ם מִ/בְּנֵ֣י יְהוּדָ֑ה דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/006.yaml
  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
translation:
  language: de
  text: 'Unter ihnen befanden sich Söhne Judas: Daniel, Hananja, Mischaël und Asarja.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“ beziehungsweise „Angehörige des Volkes Juda“. Wörtlich steht im Hebräischen: „Söhne Judas“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: waren
  rationale: Die narrative Form von היה wird im Deutschen hier natürlich als Existenz- bzw. Kopulaussage wiedergegeben; die Satzstellung bewahrt den Anschluss an den vorigen Zusammenhang.
- source_word: בָהֶם
  choice: unter ihnen
  rationale: ב bezeichnet mit dem Pronominalsuffix hier die Zugehörigkeit zu der zuvor genannten Gruppe; „unter ihnen“ ist idiomatisch und präzise.
- source_word: מִבְּנֵי יְהוּדָה
  choice: von den Söhnen Judas
  rationale: Die Formulierung gibt das hebräische בני יהודה formal wieder und bewahrt die mögliche stammes- bzw. volksbezogene Bedeutung. Natürlichere Deutungen werden in der Fußnote genannt.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Gebräuchliche deutsche Bibelnamensform, die den hebräischen Namen erkennbar wiedergibt.
- source_word: מִישָׁאֵל
  choice: Mischaël
  rationale: Deutsche Umschrift des hebräischen Personennamens; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: וַעֲזַרְיָה
  choice: und Asarja
  rationale: Die Konjunktion verbindet den letzten Namen mit der Aufzählung; „Asarja“ ist die gebräuchliche deutsche Bibelnamensform.
theological_decisions:
- issue: Bezug von „Söhne Judas“
  choice: Die wörtlich-nahe Formulierung bleibt im Haupttext erhalten.
  alternative: „Judäer“ oder „Angehörige des Stammes/Volkes Juda“
  rationale: Der hebräische Ausdruck kann Abstammung oder Volkszugehörigkeit bezeichnen. Der Haupttext legt sich nicht unnötig auf eine engere Deutung fest; die Fußnote erschließt die idiomatischen Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen geläufigen deutschen Bibelformen. Die wörtlich-nahe Wendung „Söhne Judas“ bewahrt die Ausdrucksweise und Mehrdeutigkeit des Hebräischen; eine erklärende Fußnote verhindert Missverständnisse.
