  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Die Aufforderung zur Gegenüberstellung des Aussehens beider Gruppen, die königliche Verpflegung und die anschließende Entscheidung nach eigener Beobachtung des Aufsehers bleiben erhalten. »Sieh dir … an« ist eine idiomatische deutsche Wiedergabe des passivischen Jussivs וְיֵרָאוּ לְפָנֶיךָ und transportiert den im Kontext gemeinten Augenschein, ohne die stärkere Deutung »prüfen« einzuführen.'
