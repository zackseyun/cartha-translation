id: DAN.1.13
reference: Daniel 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: de
  text: Dann sieh dir unser Aussehen und das Aussehen der jungen Männer an, die von der Speise des Königs[a] essen; und verfahre mit deinen Dienern nach dem, was du siehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von der königlichen Ration« beziehungsweise »von den Delikatessen des Königs«. Das hebräische Wort bezeichnet die königliche Verpflegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרָאוּ
  choice: Dann sieh dir … an
  rationale: Die passive bzw. mediale Jussivform fordert dazu auf, das Aussehen sichtbar werden zu lassen und zu beurteilen. Die aktive deutsche Wendung gibt diese Aufforderung natürlich wieder, ohne das Ergebnis der Prüfung vorwegzunehmen.
- source_word: לְפָנֶיךָ
  choice: dir
  rationale: Die hebräische Wendung bedeutet hier, dass der Aufseher das Aussehen selbst in Augenschein nehmen soll. Im Deutschen ist dies in »sieh dir … an« idiomatisch enthalten.
- source_word: מַרְאֵינוּ
  choice: unser Aussehen
  rationale: מַרְאֶה bezeichnet die sichtbare äußere Erscheinung; »Aussehen« ist präzise und gegenwärtig.
- source_word: וּמַרְאֵה הַיְלָדִים
  choice: und das Aussehen der jungen Männer
  rationale: יְלָדִים bezeichnet in diesem höfischen Ausbildungskontext keine kleinen Kinder, sondern junge Männer.
- source_word: הָאֹכְלִים
  choice: die … essen
  rationale: Das Partizip beschreibt ihre fortdauernde beziehungsweise übliche Ernährung.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: von der Speise des Königs
  rationale: Das persische Lehnwort bezeichnet königliche Verpflegung oder eine zugeteilte königliche Speise. »Speise des Königs« bleibt verständlich und vermeidet die interpretierende Festlegung auf Luxusgerichte.
- source_word: וְכַאֲשֶׁר תִּרְאֶה
  choice: nach dem, was du siehst
  rationale: Die weitere Behandlung soll sich unmittelbar nach der eigenen Beobachtung des Aufsehers richten.
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: verfahre mit deinen Dienern
  rationale: Die Wendung עשה עם bedeutet, mit jemandem zu handeln oder zu verfahren. »Diener« wahrt hier die ehrerbietige höfische Selbstbezeichnung.
theological_decisions:
- issue: Wiedergabe von עֲבָדֶיךָ
  choice: deinen Dienern
  alternative: deinen Sklaven
  rationale: Daniel spricht in ehrerbietiger Hofsprache mit dem Aufseher. Der soziale Status der jungen Männer wird hier nicht eigens hervorgehoben; deshalb ist »Diener« kontextuell angemessener, ohne eine Aussage über ihren rechtlichen Status zu erzwingen.
- issue: Grad der Beurteilung in וְיֵרָאוּ
  choice: sieh dir … an
  alternative: sollen … geprüft werden
  rationale: Der Kontext legt einen Vergleich nahe, doch das Verb selbst bedeutet zunächst »sehen«. Die Übersetzung wahrt dies und fügt keine ausdrückliche Prüfungsterminologie hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Ehrerbietung bleibt in »deinen Dienern« erhalten; Satzbau und Wortwahl sind für heutige Leser unmittelbar verständlich.
