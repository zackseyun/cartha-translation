source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֑ה בָּ֣א נְבוּכַדְנֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל יְרוּשָׁלִַ֖ם וַ/יָּ֥צַר עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/001.yaml
  text: In the third year of the reign of Jehoiakim king of Judah[b][a], Nebuchadnezzar king of Babylon came to Jerusalem and besieged it.
translation:
  language: de
  text: Im dritten Regierungsjahr Jojakims, des Königs von Juda, kam Nebukadnezar, der König von Babel, nach Jerusalem und belagerte die Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת
  choice: Im dritten Regierungsjahr
  rationale: Die Wendung ist eine übliche Datierungsformel. „Im dritten Regierungsjahr“ gibt sie im Deutschen präzise und natürlich wieder.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: מֶֽלֶךְ יְהוּדָ֑ה
  choice: des Königs von Juda
  rationale: Die Apposition wird in die deutsche Datierungsformel grammatisch natürlich als Genitivattribut eingebunden.
- source_word: בָּ֣א
  choice: kam
  rationale: Die schlichte Wiedergabe wahrt die Bedeutung von בוא, ohne die militärische Bewegung interpretierend als „zog“ oder „marschierte“ auszuweiten.
- source_word: נְבוּכַדְנֶאצַּ֧ר
  choice: Nebukadnezar
  rationale: Dies ist die etablierte deutsche Form des hier bezeugten Königsnamens.
- source_word: מֶֽלֶךְ בָּבֶ֛ל
  choice: der König von Babel
  rationale: Die Apposition bezeichnet Amt und Herrschaftsgebiet; der bestimmte Artikel entspricht natürlichem Deutsch.
- source_word: יְרוּשָׁלִַ֖ם
  choice: Jerusalem
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: וַ/יָּ֥צַר עָלֶֽי/הָ
  choice: und belagerte die Stadt
  rationale: צור mit על bezeichnet im militärischen Zusammenhang das Belagern. „Die Stadt“ macht den femininen Rückverweis auf Jerusalem im Deutschen eindeutig und vermeidet das unnatürliche beziehungsweise potenziell missverständliche „es“.
