  text: וַֽ/יְהִי֙ דָּֽנִיֵּ֔אל עַד שְׁנַ֥ת אַחַ֖ת לְ/כ֥וֹרֶשׁ הַ/מֶּֽלֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/021.yaml
  text: And Daniel remained until the first year of King Cyrus[a].
translation:
  language: de
  text: Und Daniel blieb bis zum ersten Jahr des Königs Kyrus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Daniel war bis zum ersten Jahr des Königs Kyrus da.“ Das hebräische Verb bedeutet wörtlich „war“, bezeichnet hier aber wahrscheinlich seine fortdauernde Anwesenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: blieb
  rationale: Das Verb bedeutet wörtlich „und er war“. Mit der Zeitangabe עַד bezeichnet es hier idiomatisch Daniels fortdauernde Anwesenheit; „blieb“ gibt dies im Deutschen natürlich wieder.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: עַד
  choice: bis
  rationale: Die Präposition markiert den zeitlichen Endpunkt einer fortdauernden Situation.
- source_word: שְׁנַת אַחַת
  choice: zum ersten Jahr
  rationale: Die Verbindung aus „Jahr“ und der Kardinalzahl „eins“ hat in dieser Regierungsdatierung ordinale Bedeutung.
- source_word: לְכוֹרֶשׁ
  choice: des ... Kyrus
  rationale: Das לְ kennzeichnet in der Regierungsdatierung den Herrscher, dessen Regierungsjahr gemeint ist; Deutsch verwendet dafür den Genitiv.
- source_word: הַמֶּלֶךְ
  choice: Königs
  rationale: Der ausdrücklich vorhandene Königstitel wird bewahrt. „des Königs Kyrus“ ist eine natürliche und würdige deutsche Datierungsformel.
theological_decisions: []
