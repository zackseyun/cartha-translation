  text: וּ/מִ/קְצָת֙ יָמִ֣ים עֲשָׂרָ֔ה נִרְאָ֤ה מַרְאֵי/הֶם֙ ט֔וֹב וּ/בְרִיאֵ֖י בָּשָׂ֑ר מִן כָּל הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֥ג הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/015.yaml
  text: And at the end of ten days, their appearance seemed better, and they were healthier in flesh than all the youths who were eating the king’s food.
translation:
  language: de
  text: Nach den zehn Tagen sahen sie besser und wohlgenährter aus als alle jungen Männer, die von der Speise des Königs aßen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִקְצָת יָמִים עֲשָׂרָה
  choice: Nach den zehn Tagen
  rationale: Gibt die zeitliche Wendung idiomatisch und genau als Abschluss des festgelegten zehntägigen Zeitraums wieder.
- source_word: נִרְאָה מַרְאֵיהֶם טוֹב
  choice: sahen sie besser ... aus
  rationale: Die Konstruktion bezeichnet ihr sichtbares Erscheinungsbild; der Komparativ ergibt sich aus dem anschließenden Vergleich mit den anderen jungen Männern.
- source_word: וּבְרִיאֵי בָּשָׂר
  choice: und wohlgenährter
  rationale: בְּרִיאֵי בָּשָׂר meint hier ein kräftiges, gut genährtes körperliches Aussehen. Die deutsche Formulierung ist natürlich und bewahrt den sichtbaren körperlichen Vergleich.
- source_word: הַיְלָדִים
  choice: jungen Männer
  rationale: Im Kontext sind damit die für den königlichen Dienst ausgewählten männlichen Jugendlichen beziehungsweise jungen Männer gemeint; „Kinder“ wäre im modernen Deutschen irreführend.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: Speise des Königs
  rationale: Bezeichnet die vom König bestimmte beziehungsweise aus seiner Tafel stammende Kost; „Speise“ wahrt den gehobenen erzählerischen Ton.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der hebräische Wahrnehmungsausdruck wird nicht zusätzlich durch „schienen“ abgeschwächt; „sahen ... aus“ gibt die Feststellung ihres Erscheinungsbildes natürlich wieder.
