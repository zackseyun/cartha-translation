  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: de
  text: Doch Daniel nahm sich in seinem Herzen vor, sich weder mit der Speise des Königs noch mit dem Wein, den der König trank, zu verunreinigen. Er bat den Obersten der Eunuchen[a] um die Erlaubnis, sich nicht zu verunreinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Obersten der Hofbeamten“; das hebräische Wort kann sowohl Eunuchen im eigentlichen Sinn als auch hohe königliche Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: nahm sich in seinem Herzen vor
  rationale: Die hebräische Wendung bedeutet wörtlich, etwas auf sein Herz zu setzen, und bezeichnet einen inneren, willentlichen Entschluss. Die gewählte Formulierung bewahrt das Herzmotiv und klingt zugleich natürlich auf Deutsch.
- source_word: יִתְגָּאַל
  choice: sich verunreinigen
  rationale: Das Hitpael bezeichnet hier eine Verunreinigung mit religiöser beziehungsweise bundestheologischer Tragweite. Die Wiedergabe legt nicht fest, worin diese Verunreinigung genau bestanden hätte.
- source_word: פַּתְבַּג
  choice: Speise
  rationale: Das Wort bezeichnet die dem König zugeordneten beziehungsweise von ihm zugeteilten Lebensmittel. „Speise des Königs“ ist prägnant und vermeidet die nicht ausdrücklich gesicherte Zuspitzung auf Delikatessen.
- source_word: יֵין מִשְׁתָּיו
  choice: der Wein, den der König trank
  rationale: Die Konstruktion bedeutet wörtlich etwa „Wein seines Trinkens“. Die ausdrückliche Wiederaufnahme des Königs beseitigt im Deutschen eine unnötige Pronomenunklarheit, ohne den Sinn zu erweitern.
- source_word: שַׂר הַסָּרִיסִים
  choice: der Oberste der Eunuchen
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen hohen Hofbeamten bezeichnen. Der Haupttext wahrt die konkrete lexikalische Bedeutung; die weitere mögliche Amtsbezeichnung wird in der Fußnote genannt.
- source_word: וַיְבַקֵּשׁ
  choice: bat ... um die Erlaubnis
  rationale: Das Verb bedeutet „suchen, erbitten“. Im Zusammenhang richtet Daniel an den zuständigen Obersten die Bitte, von den königlichen Speisen ausgenommen zu werden; „um die Erlaubnis bitten“ gibt diese pragmatische Bedeutung natürlich wieder.
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: sich nicht verunreinigen zu müssen
  rationale: Der Satz bezeichnet Inhalt beziehungsweise Ziel der Bitte. Die Infinitivkonstruktion schließt im Deutschen idiomatisch an „um die Erlaubnis“ an und bewahrt die Wiederholung des Verunreinigungsmotivs.
theological_decisions:
- issue: Grund für Daniels Ablehnung der königlichen Verpflegung
  choice: Die Sorge wird allgemein als mögliche Verunreinigung wiedergegeben.
  alternative: Ausdrückliche Festlegung auf kultische Unreinheit, einen Verstoß gegen Speisegebote oder eine Verbindung mit Götzenopfern.
  rationale: Der hebräische Vers nennt den genauen Grund nicht. Die offene Formulierung bewahrt diese exegetische und theologische Spannung.
- issue: Bedeutung von סָרִיסִים
  choice: Im Haupttext steht „Eunuchen“, mit „Hofbeamte“ als Fußnotenalternative.
  alternative: Oberster der Hofbeamten beziehungsweise Palastbeamten.
  rationale: Der Ausdruck kann sowohl wörtlich Eunuchen als auch allgemein königliche Amtsträger bezeichnen. Haupttext und Fußnote halten beide sachlich möglichen Bedeutungen transparent.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „sich verunreinigen“ folgt bewusst dem hebräischen Text. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, den die Anmerkung erläutert.
