source:
  edition: WLC
  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
translation:
  language: de
  text: junge Männer, die keinerlei Makel hatten, von gutem Aussehen, einsichtig in jeder Art von Weisheit, kenntnisreich und verständig in Erkenntnis, und die imstande waren, im Palast des Königs zu stehen[a]. Sie sollten in der Schriftkunde[b] und der Sprache der Chaldäer[c] unterrichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Palast des Königs zu dienen“ beziehungsweise „am Hof des Königs aufzuwarten“; wörtlich: „im Palast des Königs zu stehen“.'
    reason: lexical_alternative
  - marker: b
    text: „Schriftkunde“ gibt ein Wort wieder, das wörtlicher „Schrift“, „Buch“ oder die dazugehörige Schreibergelehrsamkeit bezeichnen kann.
    reason: lexical_alternative
  - marker: c
    text: „Chaldäer“ kann hier im weiteren Sinn die Babylonier bezeichnen; im Hebräischen steht jedoch ausdrücklich „Chaldäer“.
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  choice: junge Männer
  rationale: Im Zusammenhang der Auswahl für den Königsdienst bezeichnet das Wort männliche Jugendliche oder junge Erwachsene; „junge Männer“ ist natürlich und vermeidet das zu kindliche „Jungen“.
- source_word: אֵין בָּהֶם כָּל מְאוּם
  choice: an denen keinerlei Makel war
  rationale: Die Wendung bezeichnet das völlige Fehlen eines körperlichen Fehlers; „Makel“ bewahrt den konkreten Sinn, ohne hier unnötig kultische Sprache einzutragen.
- source_word: טוֹבֵי מַרְאֶה
  choice: von gutem Aussehen
  rationale: Eine direkte und natürliche Wiedergabe der positiven Beurteilung ihrer äußeren Erscheinung.
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  choice: einsichtig in jeder Art von Weisheit
  rationale: Das Partizip kann Einsicht, Klugheit und Befähigung ausdrücken. Die Formulierung gibt die geistige Eignung wieder und versteht כָּל idiomatisch distributiv.
- source_word: יֹדְעֵי דַעַת
  choice: reich an Kenntnis
  rationale: Die wörtliche Wortwiederholung „Kenntnis kennend“ wäre im Deutschen unnatürlich; die gewählte Wendung bewahrt den Gedanken vorhandenen Wissens.
- source_word: מְבִינֵי מַדָּע
  choice: verständig und lernfähig
  rationale: Die Verbindung betont Auffassungs- und Verständnisvermögen. „Lernfähig“ bringt im Bildungskontext den Wissensbezug von מַדָּע zur Geltung, ohne eine hölzerne Wiedergabe zu erzeugen.
- source_word: כֹּחַ בָּהֶם
  choice: die imstande waren
  rationale: כֹּחַ bezeichnet hier die Fähigkeit beziehungsweise Eignung für den Dienst am Hof, nicht lediglich körperliche Kraft.
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: im Palast des Königs zu stehen
  rationale: Die konkrete hebräische Ausdrucksweise bleibt im Haupttext erhalten; der darin liegende Sinn des Dienens oder Aufwartens wird in einer Fußnote erläutert.
- source_word: הֵיכַל
  choice: Palast
  rationale: Im königlichen babylonischen Zusammenhang ist der Palast, nicht ein Tempel, gemeint.
- source_word: לְלַמְּדָם
  choice: Man sollte sie … unterrichten
  rationale: Der Infinitiv drückt den Zweck beziehungsweise den vorgesehenen Unterricht aus. Die neue Satzkonstruktion ist im Deutschen klar und bewahrt den Bezug auf die ausgewählten jungen Männer.
- source_word: סֵפֶר
  choice: Schriftkunde
  rationale: סֵפֶר kann Schrift, Buch oder schriftgelehrte Bildung bezeichnen. „Schriftkunde“ passt zum Ausbildungskontext und lässt den Umfang des Lehrstoffs offen.
- source_word: לְשׁוֹן כַּשְׂדִּים
  choice: Sprache der Chaldäer
  rationale: Direkte Wiedergabe des hebräischen Ausdrucks; die ethnische Bezeichnung wird nicht stillschweigend zu „Babylonier“ verallgemeinert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der geistigen Eigenschaften wurde idiomatisch formuliert, ohne die gehäufte Aussage über Weisheit, Kenntnis und Verständnis einzuebnen. Die wörtliche Wendung „im Palast … zu stehen“ bleibt erhalten und wird erläutert.
