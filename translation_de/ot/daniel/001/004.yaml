  to: junge Männer, die keinerlei Makel hatten, von gutem Aussehen, einsichtig in jeder Art von Weisheit, kenntnisreich und verständig in Erkenntnis, und die imstande waren, im Palast des Königs zu stehen[a]. Sie sollten in der Schriftkunde[b] und der Sprache der Chaldäer[c] unterrichtet werden.
