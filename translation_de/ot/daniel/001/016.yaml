  text: וַ/יְהִ֣י הַ/מֶּלְצַ֗ר נֹשֵׂא֙ אֶת פַּתְבָּגָ֔/ם וְ/יֵ֖ין מִשְׁתֵּי/הֶ֑ם וְ/נֹתֵ֥ן לָ/הֶ֖ם זֵרְעֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/016.yaml
  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
translation:
  language: de
  text: Da nahm der Aufseher ihnen fortan ihre erlesenen Speisen und den Wein weg, den sie trinken sollten, und gab ihnen pflanzliche Kost[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemüse und Hülsenfrüchte“. Das hebräische Wort bezeichnet Nahrung aus Pflanzen oder Samen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְצַר
  choice: der Aufseher
  rationale: Der Ausdruck bezeichnet hier den mit der Versorgung der jungen Männer betrauten Amtsträger. „Aufseher“ gibt seine verantwortliche Funktion natürlich wieder, ohne einen zu engen speziellen Amtstitel vorauszusetzen.
- source_word: נֹשֵׂא
  choice: nahm ... weiterhin ... weg
  rationale: Das Partizip in der Konstruktion וַיְהִי + Partizip beschreibt eine fortgesetzte beziehungsweise regelmäßig wiederholte Handlung.
- source_word: פַּתְבָּגָם
  choice: ihre erlesenen Speisen
  rationale: Das Lehnwort bezeichnet die ihnen zugeteilte gehobene Speise vom königlichen Tisch. „Erlesene Speisen“ ist verständlich und bewahrt den Gedanken besonderer Kost.
- source_word: יֵין מִשְׁתֵּיהֶם
  choice: den Wein, den sie trinken sollten
  rationale: Die hebräische Fügung bezeichnet den für ihren Verzehr bestimmten Wein; die Relativkonstruktion gibt dies in modernem Deutsch idiomatisch wieder.
- source_word: וְנֹתֵן
  choice: und gab ihnen weiterhin
  rationale: Auch dieses Partizip bezeichnet eine fortgesetzte beziehungsweise regelmäßig wiederholte Handlung.
- source_word: זֵרְעֹנִים
  choice: pflanzliche Kost
  rationale: Das Wort bezeichnet aus Samen Gewachsenes beziehungsweise Nahrung aus Pflanzen oder Samen, wahrscheinlich Gemüse und Hülsenfrüchte. „Pflanzliche Kost“ wahrt die Bedeutungsbreite besser als das engere „Gemüse“.
