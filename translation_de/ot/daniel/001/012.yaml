  text: נַס נָ֥א אֶת עֲבָדֶ֖י/ךָ יָמִ֣ים עֲשָׂרָ֑ה וְ/יִתְּנוּ לָ֜/נוּ מִן הַ/זֵּרֹעִ֛ים וְ/נֹאכְלָ֖ה וּ/מַ֥יִם וְ/נִשְׁתֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/012.yaml
  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
translation:
  language: de
  text: »Prüfe deine Diener doch zehn Tage lang. Man gebe uns pflanzliche Nahrung[a] zu essen und Wasser zu trinken.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »(Nahrung) von Samen/Saaten«. Gemeint sind allgemein pflanzliche Speisen, die aus Gesätem hervorgehen; möglich ist auch: »Gemüse«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַס
  choice: stell ... auf die Probe
  rationale: Der Imperativ von נסה fordert hier einen zeitlich begrenzten Versuch beziehungsweise Test; die deutsche Wendung ist natürlich und bewahrt den prüfenden Sinn.
- source_word: נָא
  choice: doch
  rationale: Die Modalpartikel gibt die höfliche Abschwächung der Aufforderung im heutigen Deutsch passend wieder.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Daniel bezeichnet sich und seine Gefährten gegenüber dem Vorgesetzten respektvoll als dessen Diener; »Sklaven« würde hier die höfische Selbstbezeichnung unnötig verengen.
- source_word: יָמִים עֲשָׂרָה
  choice: zehn Tage lang
  rationale: Die Zeitdauer wird im Deutschen idiomatisch mit »lang« ausgedrückt.
- source_word: וְיִתְּנוּ לָנוּ
  choice: Man soll uns ... geben
  rationale: Der Jussiv der dritten Person Plural bezeichnet eine Bitte an nicht näher genannte Personen. Die unpersönliche Form mit »man« erhält dies klarer als ein deutsches Passiv.
- source_word: מִן הַזֵּרֹעִים
  choice: etwas von den Samengewächsen
  rationale: Die Formulierung hält den ausdrücklichen Bezug zur Wurzel »säen/Samen« fest und bezeichnet breit pflanzliche Nahrung aus Gesätem; die partitive Präposition מן wird mit »etwas von« wiedergegeben.
- source_word: וְנֹאכְלָה
  choice: zu essen
  rationale: Im Anschluss an »geben« bringt der deutsche Infinitiv den beabsichtigten Verzehr natürlich zum Ausdruck.
- source_word: וּמַיִם וְנִשְׁתֶּה
  choice: und Wasser zu trinken
  rationale: Die parallele Infinitivkonstruktion ist im Deutschen flüssig und gibt die erbetene einfache Kost wieder.
