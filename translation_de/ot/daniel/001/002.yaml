id: DAN.1.2
reference: Daniel 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: de
  text: Und der Herr gab Jojakim, den König von Juda, in seine Hand[a], dazu einen Teil der Geräte des Hauses Gottes. Er brachte sie ins Land Schinar[b], in das Haus seines Gottes[c]; und die Geräte brachte er in die Schatzkammer seines Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lieferte Jojakim, den König von Juda, in seine Hand aus“; gemeint ist: in seine Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: Schinar ist eine alte Bezeichnung für Babylonien.
    reason: cultural_note
  - marker: c
    text: 'Oder: „in den Tempel seines Gottes“. Das Hebräische verwendet dasselbe Wort für das „Haus Gottes“ und das „Haus seines Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der Konsonantentext lautet אֲדֹנָי und nicht der Gottesname JHWH. „Der Herr“ gibt die Anrede bzw. den Titel direkt wieder, ohne die für JHWH vorbehaltene Schreibweise zu verwenden.
- source_word: וַיִּתֵּן
  choice: gab
  rationale: נתן bedeutet grundlegend „geben“. Hier bezeichnet es die wirksame Auslieferung in die Gewalt eines anderen; „gab“ bewahrt zugleich die schlichte und theologisch gewichtige Aussage des Hebräischen.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Die konkrete hebräische Wendung wird beibehalten. Sie bezeichnet hier zugleich Gewalt und Verfügungsgewalt, ohne das Bild durch eine rein abstrakte Wiedergabe zu ersetzen.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jojakim, den König von Juda
  rationale: „Jojakim“ ist die geläufige deutsche Namensform. Der königliche Titel wird als Apposition natürlich ins Deutsche übertragen.
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: dazu einen Teil der Geräte des Hauses Gottes
  rationale: מִקְצָת bezeichnet einen Teil bzw. eine Auswahl. כְּלֵי meint die kultischen Gegenstände oder Geräte. „Haus Gottes“ bewahrt die Wortwahl und den literarischen Gegensatz zum Haus des babylonischen Gottes.
- source_word: וַיְבִיאֵם
  choice: Er brachte sie
  rationale: Das Suffix ist pluralisch und greift die zuvor genannten Objekte gesammelt auf. Das Pronomen „sie“ bewahrt diesen Bezug, ohne ihn ausdrücklich auf nur eines der genannten Elemente einzuengen.
- source_word: אֶרֶץ שִׁנְעָר
  choice: ins Land Schinar
  rationale: אֶרֶץ wird ausdrücklich als „Land“ wiedergegeben; der alte Ortsname Schinar bleibt transliteriert.
- source_word: בֵּית אֱלֹהָיו
  choice: in das Haus seines Gottes
  rationale: בֵּית bedeutet wörtlich „Haus“. Die formale Wiedergabe erhält die beabsichtigte Parallele zwischen dem Haus Gottes und dem Haus der babylonischen Gottheit.
- source_word: וְאֶת הַכֵּלִים הֵבִיא בֵּית אוֹצַר אֱלֹהָיו
  choice: und die Geräte brachte er in die Schatzkammer seines Gottes
  rationale: אוֹצָר ist eine Schatzkammer oder ein Vorratshaus. „Schatzkammer“ passt zum Kontext der erbeuteten Tempelgeräte. Die Wiederholung von „brachte“ und „Geräte“ spiegelt die markante Wiederaufnahme im Hebräischen.
theological_decisions:
- issue: Göttliche Souveränität bei der Niederlage Jerusalems
  choice: Der Herr gab Jojakim in die Hand des Eroberers.
  alternative: Der Herr ließ lediglich zu, dass Jojakim besiegt wurde.
  rationale: Mit Gott als Subjekt stellt נתן ein aktives göttliches Handeln dar. Die Übersetzung schwächt diese Aussage nicht zu bloßer Zulassung ab und erklärt zugleich nicht weiter, wie sie sich zur menschlichen Verantwortung verhält.
- issue: Bezeichnung der babylonischen Gottheit
  choice: „seines Gottes“ in gewöhnlicher Schreibweise
  alternative: „seines Gottes“ mit einer erläuternden Benennung der Gottheit
  rationale: Der hebräische Text nennt die Gottheit hier nicht beim Namen. Die Übersetzung wahrt diese Unbestimmtheit und fügt keine Identifikation hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener hebräischer Bildsprache. „Haus Gottes“ und „Haus seines Gottes“ bleiben parallel; „Schatzkammer“ ist idiomatisch, ohne den kultischen Zusammenhang zu verwischen. Das Semikolon macht die wiederholende Schlussaussage lesbar, ohne sie zu glätten.
