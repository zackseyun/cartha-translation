source:
  edition: WLC
  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: de
  text: Diesen vier jungen Männern gab Gott Wissen und Einsicht in allem Schrifttum[a] und in aller Weisheit. Daniel aber besaß Verständnis für jede Vision und alle Träume.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in jedem Buch“ oder „in jeder Schrift“; der hebräische Ausdruck meint hier wahrscheinlich umfassender schriftliche Bildung oder Schrifttum.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Daniel aber verstand jede Vision und alle Träume.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים הָאֵלֶּה אַרְבַּעְתָּם
  choice: diesen vier jungen Männern
  rationale: יְלָדִים bezeichnet Kinder oder Jugendliche. Im Zusammenhang der höfischen Ausbildung gibt „junge Männer“ ihr jugendliches Alter natürlich und würdig wieder; Demonstrativpronomen und Zahl werden idiomatisch zusammengezogen.
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: gab Gott
  rationale: Die schlichte Formulierung bewahrt Gott ausdrücklich als Geber ihrer Fähigkeiten.
- source_word: מַדָּע
  choice: Wissen
  rationale: מַדָּע bezeichnet Wissen beziehungsweise erworbene Bildung; „Wissen“ ist hier die klare und natürliche Entsprechung.
- source_word: הַשְׂכֵּל
  choice: Einsicht
  rationale: Die Form von שכל bezeichnet verständige Einsicht oder Urteilsfähigkeit. „Einsicht“ unterscheidet den Ausdruck vom späteren הֵבִין, ohne seinen kognitiven Sinn abzuschwächen.
- source_word: בְּכָל סֵפֶר
  choice: in allem Schrifttum
  rationale: סֵפֶר bedeutet wörtlich „Buch“ oder „Schrift“, bezeichnet hier aber wahrscheinlich umfassender den Bereich schriftlicher Bildung. „Schrifttum“ bewahrt diesen Bezug, ohne einzelne Buchbände nahezulegen.
- source_word: וְחָכְמָה
  choice: und in aller Weisheit
  rationale: חָכְמָה wird mit dem üblichen „Weisheit“ wiedergegeben. Die wiederholte Präposition sorgt im Deutschen für Klarheit und verbindet Weisheit als weiteren Bereich mit den verliehenen Fähigkeiten.
- source_word: הֵבִין
  choice: besaß Verständnis
  rationale: Der Hifil von בין kann „verstand“ oder „besaß Verständnis/Einsicht“ bedeuten. Die statische Formulierung passt zur Beschreibung der verliehenen Befähigungen und vermeidet eine unnötige Festlegung auf einen einzelnen Deutungsakt.
- source_word: בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: für alle Visionen und Träume
  rationale: Die Wendung beschreibt Daniels besondere Befähigung in Bezug auf Visionen und Träume. Der deutsche Plural gibt die generische Gesamtheit natürlich wieder.
theological_decisions:
- issue: Gottes Wirken bei den Fähigkeiten der jungen Männer
  choice: Gott wird ausdrücklich als Geber von Wissen und Einsicht genannt.
  alternative: Die Fähigkeiten werden als rein natürliche oder ausschließlich durch Ausbildung erworbene Entwicklung verstanden.
  rationale: Das Subjekt הָאֱלֹהִים beim Verb נָתַן schreibt die Gabe unmittelbar Gott zu; die Übersetzung bewahrt diese Aussage unverändert.
- issue: Art von Daniels Verständnis für Visionen und Träume
  choice: Daniel besitzt eine besondere Befähigung in Bezug auf Visionen und Träume, ohne dass näher bestimmt wird, ob damit vor allem Deutung, Einordnung oder ein umfassenderes Verstehen gemeint ist.
  alternative: Daniel empfing selbst jede Vision und jeden Traum; oder er war lediglich in babylonischer Traumliteratur ausgebildet.
  rationale: Der hebräische Wortlaut spricht von Verständnis in Bezug auf Visionen und Träume. Die Übersetzung lässt dessen genaue Ausprägung bewusst offen und legt weder den Empfang aller Offenbarungen noch bloße Fachbildung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schrifttum“ ist leicht gehoben, aber allgemein verständlich und bildet den Bereich schriftlicher Bildung präziser ab als das missverständliche „jedes Buch“. Die Satzstruktur wahrt die Hervorhebung Daniels durch „aber“.
