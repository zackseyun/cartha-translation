  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit in zwei Sätze gegliedert. Der höfische Ausdruck „vor dem König stehen“ bleibt erhalten und wird erläutert; seltene oder möglicherweise luxuriös konnotierte Speisebezeichnungen werden nicht überpräzisiert.
