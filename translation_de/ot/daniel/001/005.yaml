base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: de
  text: Der König bestimmte ihnen täglich einen Anteil von den Speisen des Königs und von dem Wein, den er trank,[a] um sie drei Jahre lang heranzuziehen. Nach Ablauf dieser Zeit[b] sollten sie vor dem König stehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann auch mit „von den erlesenen Speisen des Königs“ oder „von der üppigen Kost des Königs“ wiedergegeben werden. Gemeint ist Verpflegung von der königlichen Tafel, möglicherweise besonders kostbare Speisen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an ihrem Ende“, das heißt am Ende der drei Jahre.'
    reason: lexical_alternative
  - marker: c
    text: „Vor dem König stehen“ ist eine Ausdrucksweise des Hofes und kann bedeuten, zum königlichen Dienst anzutreten oder dem König persönlich aufzuwarten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: bestimmte für sie
  rationale: Das Verb bezeichnet hier die königliche Anordnung beziehungsweise Zuweisung der Versorgung; „bestimmte für sie“ gibt den administrativen Vorgang natürlich wieder.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: als tägliche Zuteilung
  rationale: Die Wendung meint die für jeden Tag festgesetzte Ration. „Tägliche Zuteilung“ bewahrt sowohl den zeitlichen als auch den konkreten Zuweisungsaspekt.
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: etwas von den Speisen des Königs
  rationale: Der seltene Ausdruck bezeichnet Speisen beziehungsweise Verpflegung von der königlichen Tafel und kann erlesene Kost meinen. Die Hauptfassung bleibt zurückhaltend; die mögliche Luxusnuance wird in der Fußnote genannt.
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: von dem Wein, den er trank
  rationale: Die Formulierung hält den persönlichen Bezug zum König fest und gibt die hebräische Wendung in natürlichem Deutsch wieder.
- source_word: וּלְגַדְּלָם
  choice: ließ sie … heranbilden
  rationale: Das kausative Verb beschreibt ihr Heranwachsen beziehungsweise ihre Heranbildung während der festgelegten Zeit. „Heranbilden“ lässt körperliche Versorgung und Vorbereitung auf den Hofdienst offen, ohne den Sinn auf Unterricht zu verengen.
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: drei Jahre lang
  rationale: Eine natürliche deutsche Wiedergabe der angegebenen Dauer.
- source_word: וּמִקְצָתָם
  choice: Nach Ablauf dieser Zeit
  rationale: Das Suffix bezieht sich auf die drei Jahre. Die Wiedergabe macht den Bezug im Deutschen eindeutig, während die wörtlichere Form in der Fußnote erhalten bleibt.
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: sollten sie vor dem König stehen
  rationale: Die formelhafte Hofsprache wird im Haupttext bewahrt; sie kann das Erscheinen zum königlichen Dienst oder zur persönlichen Aufwartung bezeichnen.
