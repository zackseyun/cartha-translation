base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/014.yaml
  text: So he listened to them in this matter and tested them for ten days[a].
translation:
  language: de
  text: Da ging er in dieser Sache auf sie ein und stellte sie zehn Tage lang auf die Probe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da hörte er in dieser Sache auf sie“; das hebräische Verb kann sowohl das Hören als auch das daraus folgende Eingehen auf eine Bitte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ging … auf sie ein
  rationale: שׁמע mit לְ kann hier „auf jemanden hören“, „jemanden erhören“ oder „eingehen“ bedeuten. Der Kontext zeigt, dass der Aufseher Daniels Vorschlag annimmt; „ging … auf sie ein“ gibt dieses zustimmende Hören im natürlichen Deutschen wieder, ohne ein hierarchisch unpassendes „gehorchte“ zu verwenden.
- source_word: לָהֶם
  choice: auf sie
  rationale: Das pronominale לָהֶם wird entsprechend der deutschen Verbindung „auf jemanden eingehen“ wiedergegeben.
- source_word: לַדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: דָּבָר bezeichnet hier die zuvor vorgetragene Bitte beziehungsweise Angelegenheit. „In dieser Sache“ ist präzise und bewahrt die allgemeinere Bedeutung, statt ausdrücklich „Vorschlag“ einzusetzen.
- source_word: וַיְנַסֵּם
  choice: stellte sie … auf die Probe
  rationale: נסה im Piel bedeutet „prüfen, erproben“. „Auf die Probe stellen“ passt zur zeitlich begrenzten Erprobung der vorgeschlagenen Ernährung und klingt im Deutschen natürlich.
- source_word: יָמִים עֲשָׂרָה
  choice: zehn Tage lang
  rationale: Die adverbiale Akkusativangabe bezeichnet die Dauer der Erprobung; „zehn Tage lang“ macht diese Funktion idiomatisch deutlich.
