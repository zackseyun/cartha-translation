base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: de
  text: Der König sprach mit ihnen, und unter ihnen allen fand sich keiner wie Daniel, Hananja, Mischaël und Asarja. So standen sie vor dem König.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Als höfische Wendung kann dies Dienst in der Gegenwart des Königs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: sprach mit ihnen
  rationale: דבר mit אֵת bezeichnet hier ein direktes Gespräch. „Sprach mit ihnen“ gibt den hebräischen Ausdruck schlicht wieder, ohne ihn kontextuell zu „prüfte“ oder „befragte“ zu erweitern.
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: unter ihnen allen fand sich keiner
  rationale: Das Nifal von מצא wird idiomatisch mit „fand sich“ wiedergegeben; מִכֻּלָּם bezeichnet die Vergleichsgruppe.
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: wie Daniel, Hananja, Mischaël und Asarja
  rationale: כְּ kennzeichnet den Vergleich. Die Personennamen werden in ihren gebräuchlichen deutschen Transliterationen wiedergegeben.
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: So traten sie in den Dienst des Königs
  rationale: Wörtlich heißt die Wendung „sie standen vor dem König“. Im höfischen Zusammenhang bezeichnet sie jedoch das Dienen beziehungsweise den Dienstantritt in königlicher Gegenwart. Die idiomatische Haupttextfassung macht diese Funktion im heutigen Deutsch verständlich; die Fußnote bewahrt das konkrete hebräische Bild.
