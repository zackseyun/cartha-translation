  verdict: revise
  source_fidelity: 'Die Zeitformel bezeichnet das Ende eines festgelegten Zeitraums. Der Entwurf trifft dies grundsätzlich, doch „nach der der König befohlen hatte“ macht die Bezugsrelation im Deutschen missverständlich: Es klingt, als habe der König erst nach der Zeit befohlen. Die Revision stellt klar, dass die Vorführung für das Ende des vom König genannten Zeitraums angeordnet war. „Der oberste der Hofbeamten“ gibt die Leitungsfunktion von שַׂר הַסָּרִיסִים genauer wieder und wahrt mit der Fußnote die mögliche Bedeutung „Eunuchen“.'
  naturalness: Die revidierte Satzfügung ist modernes, würdiges Standarddeutsch und vermeidet den unidiomatischen beziehungsweise semantisch verschobenen Relativanschluss des Entwurfs.
  terminology: Nebukadnezar ist die übliche deutsche Namensform. Die funktionale Wiedergabe „der oberste der Hofbeamten“ ist im Text vertretbar, sofern die engere lexikalische Bedeutung „Eunuchen“ deutlich in der Fußnote erhalten bleibt.
