base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: de
  text: Als die Zeit zu Ende war, nach deren Ablauf der König angeordnet hatte, sie vorzuführen, brachte der oberste der Hofbeamten[a] sie vor Nebukadnezar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Oberste der Eunuchen. Das hebräische Wort kann einen Eunuchen oder allgemeiner einen königlichen Hofbeamten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: Als die Zeit zu Ende war
  rationale: Die Wendung bezeichnet das Ende eines festgelegten Zeitraums. Natürliches modernes Deutsch gibt den Sinn mit „als die Zeit zu Ende war“ wieder, ohne das im Deutschen missverständliche „Ende der Tage“ zu verwenden.
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ
  choice: nach der der König befohlen hatte
  rationale: אָמַר bedeutet grundsätzlich „sagen“, bezeichnet hier aber im Rückbezug auf die königliche Anordnung aus Vers 5 ein verbindliches Befehlen. Das Plusquamperfekt wahrt die zeitliche Abfolge.
- source_word: לַהֲבִיאָם
  choice: sie vorführen zu lassen
  rationale: Der Hifil von בוא bedeutet „bringen lassen/bringen“. Im höfischen Zusammenhang und angesichts des folgenden לִפְנֵי gibt „vorführen“ die beabsichtigte Vorstellung beim König idiomatisch wieder.
- source_word: וַיְבִיאֵם
  choice: brachte ... sie
  rationale: Die einfache Wiedergabe „brachte“ bildet den Hifil von בוא ab; das Ziel folgt mit „vor Nebukadnezar“.
- source_word: שַׂר הַסָּרִיסִים
  choice: der oberste Hofbeamte
  rationale: סָרִיס kann einen Eunuchen, aber auch allgemeiner einen königlichen Hofbeamten bezeichnen. Da die körperliche Bedeutung im Kontext nicht sicher ist, steht die funktionale Amtsbezeichnung im Text; die engere Möglichkeit wird in der Fußnote bewahrt.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier das Erscheinen in der Gegenwart des Königs; „vor“ ist knapp und idiomatisch.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nebukadnezar
  rationale: Der Name wird nach der üblichen deutschen Bibeltradition wiedergegeben.
