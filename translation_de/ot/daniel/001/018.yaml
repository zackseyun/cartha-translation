  - severity: low
    issue: Leitungsfunktion bei שַׂר הַסָּרִיסִים zu wenig explizit
    rationale: „der oberste Hofbeamte“ ist möglich, aber „der oberste der Hofbeamten“ spiegelt die Konstruktion „Oberster von/über den ...“ und den Plural besser.
  revised_text: Als die Zeit zu Ende war, nach deren Ablauf der König angeordnet hatte, sie vorzuführen, brachte der oberste der Hofbeamten[a] sie vor Nebukadnezar.
