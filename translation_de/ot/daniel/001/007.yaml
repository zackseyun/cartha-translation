source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם לָ/הֶ֛ם שַׂ֥ר הַ/סָּרִיסִ֖ים שֵׁמ֑וֹת וַ/יָּ֨שֶׂם לְ/דָֽנִיֵּ֜אל בֵּ֣לְטְשַׁאצַּ֗ר וְ/לַֽ/חֲנַנְיָה֙ שַׁדְרַ֔ךְ וּ/לְ/מִֽישָׁאֵ֣ל מֵישַׁ֔ךְ וְ/לַ/עֲזַרְיָ֖ה עֲבֵ֥ד נְגֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
translation:
  language: de
  text: 'Und der Oberste der Eunuchen[a] gab ihnen Namen: Daniel gab er den Namen Beltschazar, Hananja den Namen Schadrach, Mischaël den Namen Meschach und Asarja den Namen Abed-Nego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Oberste der Hofbeamten. Das hebräische Wort kann einen Eunuchen oder, in erweitertem Sinn, einen königlichen Hofbeamten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לָהֶם שֵׁמוֹת
  choice: gab ihnen Namen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass ihnen Namen »gesetzt« wurden. »Gab ihnen Namen« gibt die Zuweisung neuer Namen im Deutschen natürlich wieder, ohne das im Ausgangstext nicht ausdrücklich vorhandene Adjektiv »neue« einzufügen.
- source_word: שַׂר הַסָּרִיסִים
  choice: der Oberste der Eunuchen
  rationale: שַׂר bezeichnet hier den leitenden Amtsträger, סָרִיסִים kann sowohl Eunuchen als auch königliche Hofbeamte meinen. Die Übersetzung folgt der konkreten Grundbedeutung und weist in der Fußnote auf die mögliche Amtsbezeichnung hin.
- source_word: וַיָּשֶׂם
  choice: Daniel gab er den Namen …
  rationale: Die vorangestellte Person und das Pronomen »er« bilden im Deutschen eine klare distributive Konstruktion. Die einmal gesetzte Formulierung »den Namen« wird bei allen vier Personen wiederholt, um die parallele Zuordnung eindeutig wiederzugeben.
- source_word: בֵּלְטְשַׁאצַּר / שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: Beltschazar / Schadrach / Meschach / Abed-Nego
  rationale: Die babylonischen Namen werden nach geläufigen deutschen Bibelkonventionen transliteriert. Der Bindestrich in »Abed-Nego« macht die zweiteilige Form lesbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Namenszuweisung bleibt vollständig und klar; die Mehrdeutigkeit der Amtsbezeichnung wird nicht im Haupttext aufgelöst, sondern in der Fußnote dokumentiert.
