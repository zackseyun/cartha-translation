  - severity: low
    issue: Partitive Formulierung ist unnötig umständlich.
    rationale: „Einige von den Israeliten“ ist zwar verständlich, aber „einige Israeliten“ drückt die beabsichtigte Auswahl im Deutschen ebenso aus und ist stilistisch glatter.
