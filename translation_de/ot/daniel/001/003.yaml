  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben. Die drei Herkunftsangaben werden jedoch im Deutschen klarer und näher am Hebräischen als parallele Präpositionalgruppen formuliert: „aus königlichem Geschlecht und aus dem Adel“. Damit wird weder nahegelegt, jede ausgewählte Person müsse zugleich zwei unterschiedliche Kategorien erfüllen, noch wird זֶרַע unnötig auf die konkrete Bezeichnung „Nachkommen“ eingeschränkt.'
  naturalness: „Einige Israeliten“ ist im modernen Standarddeutsch idiomatischer als „einige von den Israeliten“. Die revidierte Koordination ist zudem flüssiger als „und zwar sowohl Nachkommen des Königshauses als auch Angehörige des Adels“.
  terminology: „Aschpenas“ entspricht der geläufigen deutschen Namensform. „Oberster seiner Hofbeamten“ gibt רַב סָרִיסָיו angemessen wieder; die Fußnote bewahrt die mögliche Lesart „Eunuchen“. „Königliches Geschlecht“ und „Adel“ sind für זֶרַע הַמְּלוּכָה bzw. פַּרְתְּמִים sachgerecht und vermeiden eine überpräzise soziale oder genealogische Deutung.
