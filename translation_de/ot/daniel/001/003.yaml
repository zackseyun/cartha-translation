  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ לְ/אַשְׁפְּנַ֖ז רַ֣ב סָרִיסָ֑י/ו לְ/הָבִ֞יא מִ/בְּנֵ֧י יִשְׂרָאֵ֛ל וּ/מִ/זֶּ֥רַע הַ/מְּלוּכָ֖ה וּ/מִן הַֽ/פַּרְתְּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: de
  text: Dann wies der König Aschpenas, den Obersten seiner Hofbeamten[a], an, einige Israeliten herzubringen, aus königlichem Geschlecht und aus dem Adel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Obersten seiner Eunuchen“. Das hebräische Wort kann sowohl wörtlich Eunuchen als auch allgemeiner hohe königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann wies ... an
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Wies ... an“ gibt die durch den folgenden Infinitiv ausgedrückte Aufforderung im Deutschen natürlich wieder, ohne das Verb unnötig zu „befahl“ zu verstärken.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte und idiomatische Wiedergabe des bestimmten Substantivs.
- source_word: לְאַשְׁפְּנַז
  choice: Aschpenas
  rationale: Der Personenname wird nach geläufiger deutscher Laut- und Schreibkonvention wiedergegeben.
- source_word: רַב סָרִיסָיו
  choice: den Obersten seiner Hofbeamten
  rationale: רַב bezeichnet den Leiter oder höchsten Amtsträger. סָרִיס kann einen Eunuchen, aber auch allgemeiner einen königlichen Hofbeamten bezeichnen; die mögliche engere Bedeutung wird in der Fußnote bewahrt.
- source_word: לְהָבִיא
  choice: herzubringen
  rationale: Der Hifil-Infinitiv von בוא bedeutet hier, Personen kommen beziehungsweise bringen zu lassen; „herzubringen“ passt natürlich zur Anweisung des Königs.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: einige von den Israeliten
  rationale: Die partitive Präposition מִן verlangt im Deutschen sinngemäß „einige von“. בְּנֵי יִשְׂרָאֵל bezeichnet hier Angehörige des Volkes Israel; „Israeliten“ ist dafür die natürliche moderne Wiedergabe.
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: sowohl Nachkommen des Königshauses
  rationale: זֶרַע bezeichnet Herkunft beziehungsweise Nachkommenschaft. Die Formulierung bewahrt den Abstammungsgedanken, ohne das im Deutschen missverständliche wörtliche „Samen“ zu verwenden.
- source_word: וּמִן הַפַּרְתְּמִים
  choice: als auch Angehörige des Adels
  rationale: Das seltene Wort bezeichnet wahrscheinlich hochrangige Adlige. „Angehörige des Adels“ gibt die soziale Gruppe klar wieder und verbindet sich natürlich mit der parallelen Herkunftsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „wies ... an“ bildet den Sprechakt mit folgendem Infinitiv natürlich ab. „Und zwar sowohl ... als auch“ verdeutlicht die parallelen Herkunftsgruppen, ohne über den hebräischen Text hinauszugehen.
