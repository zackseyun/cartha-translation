  text: וְ/כֹ֗ל דְּבַר֙ חָכְמַ֣ת בִּינָ֔ה אֲשֶׁר בִּקֵּ֥שׁ מֵ/הֶ֖ם הַ/מֶּ֑לֶךְ וַֽ/יִּמְצָאֵ֞/ם עֶ֣שֶׂר יָד֗וֹת עַ֤ל כָּל הַֽ/חַרְטֻמִּים֙ הָֽ/אַשָּׁפִ֔ים אֲשֶׁ֖ר בְּ/כָל מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: de
  text: Bei jeder Frage, die Weisheit und Einsicht betraf und die der König ihnen stellte, fand er sie allen Magiern und Beschwörern[b] in seinem ganzen Reich zehnfach überlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zehn Hände über«. Die hebräische Redewendung bezeichnet eine außerordentlich große Überlegenheit.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung der beiden Bezeichnungen für babylonische Hofspezialisten ist unsicher. Andere übersetzen etwa »Zauberer und Sterndeuter«.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: Und in jeder Frage
  rationale: דָּבָר bezeichnet hier einen Gegenstand der Befragung oder Prüfung. „Frage“ gibt den Zusammenhang natürlich wieder; וְ verbindet den Satz mit dem Vorhergehenden.
- source_word: חָכְמַת בִּינָה
  choice: die Weisheit und Verständnis erforderte
  rationale: Die beiden Begriffe bleiben unterschieden. Die attributive Formulierung macht im Deutschen verständlich, dass es um Fragen aus diesem Erkenntnisbereich geht, ohne die Wendung auf bloß theoretisches Wissen einzuengen.
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: über die der König sie befragte
  rationale: בקשׁ mit מן bezeichnet hier das Erfragen beziehungsweise Einholen einer Antwort. „befragte“ passt zum Prüfungskontext und ist idiomatischer als „von ihnen suchte“.
- source_word: וַיִּמְצָאֵם
  choice: fand er sie
  rationale: Die Formulierung bewahrt das Urteil des Königs als Ergebnis seiner eigenen Prüfung.
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: zehnfach überlegen
  rationale: Wörtlich steht „zehn Hände über“. Die deutsche Vergleichsformel gibt die ausgeprägte, numerisch zugespitzte Überlegenheit prägnant wieder.
- source_word: הַחַרְטֻמִּים
  choice: Wahrsagepriester
  rationale: Der Ausdruck bezeichnet höfische Spezialisten sakraler beziehungsweise okkulter Deutungskünste. „Wahrsagepriester“ wahrt diesen institutionellen Hintergrund besser als das im heutigen Deutsch leicht missverständliche „Zauberer“.
- source_word: הָאַשָּׁפִים
  choice: Beschwörer
  rationale: Die genaue Funktion dieser babylonischen Gruppe ist unsicher; wahrscheinlich bestand ein Bezug zu Beschwörungen. Die Wiedergabe bleibt deshalb allgemein und wird durch eine Fußnote als unsicher gekennzeichnet.
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: in seinem ganzen Reich
  rationale: Die Wendung beschreibt die gesamte Ausdehnung des Herrschaftsgebiets und lässt sich im Deutschen knapp und unmittelbar so wiedergeben.
theological_decisions:
- issue: Bezeichnung der babylonischen Hofgelehrten ohne konfessionelle oder anachronistisch präzise Festlegung
  choice: Wahrsagepriester und Beschwörer
  alternative: Zauberer und Sterndeuter
  rationale: Die beiden hebräischen Fachbegriffe bezeichnen unterschiedliche Gruppen höfischer Deutungs- und Ritualspezialisten, sind aber nicht in allen Einzelheiten sicher bestimmbar. Die gewählte Fassung macht den religiös-okkulten Hofkontext sichtbar, ohne beide Gruppen gleichzusetzen oder die zweite sicher als Astrologen festzulegen.
- issue: Art der Überlegenheit Daniels und seiner Gefährten
  choice: zehnfach überlegen
  alternative: zehnmal besser
  rationale: Der Vers berichtet das Ergebnis der königlichen Prüfung, nicht eine absolute Aussage über den Wert der Personen in jeder Hinsicht. „überlegen“ hält den Bezug auf Weisheit und Verständnis fest; „zehnfach“ bewahrt die starke hebräische Zahlenwendung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist gegenüber der hebräischen Wortfolge behutsam umgestellt, damit Prüfungsgegenstand, Befragung und Ergebnis klar erkennbar bleiben. Die Fachbegriffe für die babylonischen Hofgelehrten werden verständlich wiedergegeben, ihre lexikalische Unsicherheit jedoch nicht verschwiegen.
