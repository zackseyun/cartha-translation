  text: וַ/יֹּ֜אמֶר שַׂ֤ר הַ/סָּרִיסִים֙ לְ/דָ֣נִיֵּ֔אל יָרֵ֤א אֲנִי֙ אֶת אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁ֣ר מִנָּ֔ה אֶת מַאֲכַלְ/כֶ֖ם וְ/אֶת מִשְׁתֵּי/כֶ֑ם אֲשֶׁ֡ר לָ/מָּה֩ יִרְאֶ֨ה אֶת פְּנֵי/כֶ֜ם זֹֽעֲפִ֗ים מִן הַ/יְלָדִים֙ אֲשֶׁ֣ר כְּ/גִֽילְ/כֶ֔ם וְ/חִיַּבְתֶּ֥ם אֶת רֹאשִׁ֖/י לַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: de
  text: 'Doch der Oberste der Hofbeamten[a] sagte zu Daniel: »Ich fürchte meinen Herrn, den König, der euch Speise und Trank zugeteilt hat. Warum sollte er sehen, dass ihr schlechter ausseht[b] als die jungen Männer in eurem Alter? Dann würdet ihr meinen Kopf beim König aufs Spiel setzen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Oberste der Eunuchen«. Das hebräische Wort kann einen Eunuchen oder allgemeiner einen königlichen Hofbeamten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dass eure Gesichter düster« oder »bekümmert aussehen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Dann würdet ihr meinen Kopf beim König haftbar machen«; gemeint ist, dass sein Leben gefährdet wäre.'
    reason: idiom_explanation
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: der Oberste der Hofbeamten
  rationale: סָרִיס kann sowohl einen Eunuchen als auch allgemein einen königlichen Hofbeamten bezeichnen. Im Deutschen ist »Oberster der Hofbeamten« im höfischen Zusammenhang natürlich und wahrt die mögliche Amtsbedeutung; die engere Wiedergabe steht in der Fußnote.
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: Ich fürchte meinen Herrn, den König
  rationale: Die Formulierung bewahrt sowohl die gegenwärtige Furcht als auch den respektvollen höfischen Titel אֲדֹנִי.
- source_word: מִנָּה
  choice: zugeteilt hat
  rationale: Das Verb bezeichnet das Bestimmen oder Zuweisen einer Versorgung; »zugeteilt« passt idiomatisch zu Speise und Trank.
- source_word: מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: euch Speise und Trank
  rationale: Die Paarformel ist würdig und knapp. מִשְׁתֶּה wird nicht unnötig auf Wein verengt.
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: dass ihr schlechter ausseht
  rationale: Wörtlich sind die Gesichter düster, missmutig oder beeinträchtigt. Im Vergleich mit Gleichaltrigen bezeichnet die Wendung hier wahrscheinlich ein sichtbar schlechteres Erscheinungsbild; die wörtlichere Spannweite wird angemerkt.
- source_word: הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: die jungen Männer in eurem Alter
  rationale: יְלָדִים bezeichnet in diesem Ausbildungs- und Hofkontext junge Männer; כְּגִילְכֶם stellt sie als gleichaltrig dar.
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: Dann würdet ihr meinen Kopf beim König aufs Spiel setzen
  rationale: Die Wiedergabe erhält das anschauliche »meinen Kopf«, vermittelt aber zugleich idiomatisch die drohende Haftung beziehungsweise Lebensgefahr vor dem König.
