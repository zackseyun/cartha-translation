source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּנִיֵּ֖אל אֶל הַ/מֶּלְצַ֑ר אֲשֶׁ֤ר מִנָּה֙ שַׂ֣ר הַ/סָּֽרִיסִ֔ים עַל דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: de
  text: 'Da sagte Daniel zu dem Aufseher, den der Oberste der Eunuchen[a] über Daniel, Hananja, Mischaël und Asarja eingesetzt hatte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Oberste der Hofbeamten“; das hier mit „Eunuchen“ übersetzte hebräische Wort kann in manchen Zusammenhängen allgemeiner königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung zeitlich weiter; „Da“ gibt diese Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: הַמֶּלְצַר
  choice: der Aufseher
  rationale: Der wahrscheinlich entlehnte Amtstitel bezeichnet hier den unmittelbar für die jungen Männer und ihre Versorgung zuständigen Bediensteten; „Aufseher“ gibt seine Funktion verständlich wieder, ohne eine präzisere Amtsstellung vorzutäuschen.
- source_word: אֲשֶׁר מִנָּה
  choice: den … eingesetzt hatte
  rationale: Der Relativsatz kennzeichnet den Aufseher durch seine bereits zuvor erfolgte Einsetzung; das Plusquamperfekt macht die zeitliche Abfolge im Deutschen klar.
- source_word: שַׂר הַסָּרִיסִים
  choice: der Oberste der Eunuchen
  rationale: Die Wendung bezeichnet wörtlich den ranghöchsten Verantwortlichen über die Eunuchen. Da סָרִיס auch allgemeiner einen königlichen Hofbeamten bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit einer Einsetzung bezeichnet die Präposition den zugewiesenen Aufsichtsbereich; „über“ bleibt knapp und quellennah.
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Daniel, Hananja, Mischaël und Asarja
  rationale: Die im hebräischen Text verwendeten Namen werden in ihren üblichen deutschen Formen wiedergegeben; die babylonischen Namen werden an dieser Stelle nicht eingesetzt.
