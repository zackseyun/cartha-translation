source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
translation:
  language: de
  text: Und Gott ließ Daniel bei dem Obersten der Eunuchen[a] Gunst und Mitgefühl finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Hofbeamten“ oder „der Palastbeamten“; der hebräische Ausdruck kann sowohl wörtlich Eunuchen als auch allgemeiner königliche Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ließ … finden
  rationale: Die Konstruktion mit נתן und den folgenden לְ-Ausdrücken beschreibt, dass Gott bewirkte, dass Daniel Gunst und Mitgefühl zuteilwurden. „ließ … finden“ gibt diesen Sinn im Deutschen natürlich wieder und hält Gott als handelnde Ursache fest.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang bezeichnet das Wort den wahren Gott. Da hier nicht der Gottesname JHWH steht, ist „Gott“ die sachgemäße Wiedergabe.
- source_word: אֶת דָּנִיֵּאל
  choice: Daniel
  rationale: Die Akkusativpartikel אֶת hat im Deutschen keine eigene Entsprechung; der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: לְחֶסֶד
  choice: Gunst
  rationale: חֶסֶד bezeichnet hier die wohlwollende Haltung des ranghöheren Beamten gegenüber Daniel. „Gunst“ passt zum höfischen Zusammenhang und vermeidet, den Ausdruck unnötig auf Bundesloyalität festzulegen.
- source_word: וּלְרַחֲמִים
  choice: Mitgefühl
  rationale: Der Plural רַחֲמִים bezeichnet hier erbarmendes, mitfühlendes Verhalten. „Mitgefühl“ ist gegenwärtiges, würdevolles Deutsch und verbindet sich natürlich mit „Gunst finden“.
- source_word: לִפְנֵי
  choice: bei
  rationale: Wörtlich bedeutet לִפְנֵי „vor“ beziehungsweise „im Angesicht von“. In dieser Wendung drückt es aus, in wessen Augen Daniel Gunst fand; das deutsche „bei“ gibt diese Beziehung idiomatisch wieder.
- source_word: שַׂר
  choice: Oberster
  rationale: שַׂר bezeichnet einen ranghohen Amtsträger oder Vorgesetzten. Im Konstrukt mit הַסָּרִיסִים bringt „Oberster“ seine leitende Stellung knapp und klar zum Ausdruck.
- source_word: הַסָּרִיסִים
  choice: der Eunuchen
  rationale: סָרִיס kann einen Eunuchen im wörtlichen Sinn oder allgemeiner einen königlichen Hofbeamten bezeichnen. Die direkte lexikalische Wiedergabe bleibt im Haupttext stehen; die institutionelle Deutung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von סָרִיסִים im babylonischen Hofkontext
  choice: Eunuchen
  alternative: Hofbeamten oder Palastbeamten
  rationale: Der hebräische Ausdruck kann sowohl wörtlich Eunuchen als auch in einem weiteren Sinn königliche Amtsträger bezeichnen. Da der Kontext keine der Möglichkeiten sicher ausschließt, steht die direkte Bedeutung im Haupttext, während die sachlich mögliche weitere Bedeutung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Gunst und Mitgefühl finden“ ist idiomatisch und bildet zugleich die göttliche Veranlassung sowie die wohlwollende Haltung des Hofbeamten ab.
