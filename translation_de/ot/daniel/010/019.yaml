  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: de
  text: 'Und er sagte: »Fürchte dich nicht, du hochgeschätzter Mann[a]! Friede sei dir. Sei stark, ja, sei stark!« Als er mit mir redete, wurde ich gestärkt und sagte: »Mein Herr möge reden, denn du hast mich gestärkt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Mann der Kostbarkeiten«; auch möglich: »vielgeliebter Mann« oder »Mann, an dem man großes Gefallen hat«. Die hebräische Wendung bezeichnet besondere Wertschätzung und Gunst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: du hochgeschätzter Mann
  rationale: Die Wendung bezeichnet Daniel idiomatisch als einen Menschen von besonderer Kostbarkeit oder Wertschätzung. „Hochgeschätzt“ ist im modernen Deutschen natürlich, bewahrt den ehrenden Charakter und vermeidet eine unnötige Festlegung darauf, von wem Daniel geliebt wird.
- source_word: שָׁלוֹם לָךְ
  choice: Friede sei mit dir
  rationale: Die Formulierung gibt den Segens- oder Zuspruchscharakter der hebräischen Wendung wieder und klingt zugleich würdig und idiomatisch.
- source_word: חֲזַק וַחֲזָק
  choice: Sei stark, ja, sei stark
  rationale: Die Wiederholung des Imperativs dient der Verstärkung. „Ja“ macht diese emphatische Wiederholung im Deutschen natürlich hörbar und erhält zugleich den Wortstammzusammenhang mit den folgenden Formen von חזק.
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Als er mit mir redete
  rationale: Die Präposition mit Infinitivkonstrukt hat hier temporalen Sinn. „Als“ fügt sich natürlich in den erzählenden Ablauf ein.
- source_word: הִתְחַזַּקְתִּי
  choice: wurde ich gestärkt
  rationale: Im Zusammenhang bezeichnet die Hitpael-Form das Eintreten in einen gestärkten Zustand infolge der Worte des Sprechers. Die passive deutsche Form korrespondiert zudem mit Daniels anschließender Aussage.
- source_word: יְדַבֵּר אֲדֹנִי
  choice: Mein Herr möge reden
  rationale: Der Imperfekt hat hier höflich auffordernden beziehungsweise permissiven Sinn. „Möge reden“ bewahrt die respektvolle Zurückhaltung der Bitte.
- source_word: כִּי חִזַּקְתָּנִי
  choice: denn du hast mich gestärkt
  rationale: „Denn“ gibt den begründenden Zusammenhang wieder; „gestärkt“ erhält die auffällige lexikalische Verbindung zu den übrigen Formen von חזק im Vers.
theological_decisions:
- issue: Wiedergabe von אֲדֹנִי als Anrede an den Sprecher
  choice: mein Herr
  alternative: mein Gebieter; mein Herr (als göttlicher Titel verstanden)
  rationale: Die Form ist eine ehrerbietige Anrede im Singular. Die Schreibung „Herr“ entspricht der deutschen Anredekonvention, während das Possessivpronomen und der Kontext erkennen lassen, dass nicht der Gottesname wiedergegeben wird. Die Übersetzung legt die Identität des himmlischen Sprechers nicht weiter fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Syntax. Die dreifache Verbindung über „stark/gestärkt“ bleibt erhalten. Die ehrerbietige Anrede wird nicht zu einer ausdrücklichen Identifikation des Sprechers mit Gott ausgeweitet.
