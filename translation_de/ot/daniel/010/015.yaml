  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה נָתַ֧תִּי פָנַ֛/י אַ֖רְצָ/ה וְ/נֶאֱלָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: de
  text: Während er so mit mir sprach, wandte ich mein Gesicht zur Erde und verstummte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: Als er … redete
  rationale: Die Präposition בְּ mit Infinitivus constructus und Suffix hat hier temporale Bedeutung. „Als er … redete“ ist natürliches Deutsch und lässt offen, ob Daniels Reaktion während oder unmittelbar nach dem Reden einsetzte.
- source_word: עִמִּי
  choice: mit mir
  rationale: עִם bedeutet gewöhnlich „mit“. Die Formulierung bewahrt die hebräische Ausdrucksweise und ist im Deutschen verständlich, ohne sie zu „zu mir“ umzudeuten.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten; im unmittelbaren Zusammenhang einer Rede ist „diese Worte“ am treffendsten.
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: senkte ich mein Gesicht zur Erde
  rationale: Die Wiedergabe bewahrt das Bild von der Ausrichtung des Gesichts nach unten, klingt aber im modernen Deutschen natürlicher als die wörtliche Form „gab/setzte ich mein Gesicht“. „Zur Erde“ gibt die Richtungsendung von אַרְצָה wieder.
- source_word: וְנֶאֱלָמְתִּי
  choice: und verstummte
  rationale: Der Nifal von אלם bezeichnet hier das Eintreten der Sprachlosigkeit. „Verstummte“ ist knapp und würdevoll und legt weder dauerhafte körperliche Stummheit noch ausdrücklich äußeren Zwang fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „senkte ich mein Gesicht“ das hebräische Idiom natürlich wiedergibt. Die echte Bedeutungsbreite von וְנֶאֱלָמְתִּי wird durch „verstummte“ ohne unnötige Festlegung bewahrt.
