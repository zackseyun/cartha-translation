  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: de
  text: Wie kann denn dieser Diener meines Herrn[a] mit diesem meinem Herrn reden?[b] Ich jedenfalls habe jetzt[c] keine Kraft mehr, und kein Atem ist mir geblieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meines Gebieters“; ebenso beim zweiten Vorkommen von „meinem Herrn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische wiederholt „dieser/diesem“: „dieser Diener meines Herrn … mit diesem meinem Herrn“. Dadurch werden Sprecher und angesprochener Herr in der unmittelbaren Begegnung hervorgehoben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von jetzt an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: Wie kann denn
  rationale: Gibt die an den vorherigen Vers anschließende rhetorische Frage samt Fähigkeitsverb in natürlichem Deutsch wieder; „denn“ nimmt den folgernden Zusammenhang auf.
- source_word: עֶבֶד אֲדֹנִי זֶה
  choice: dieser Diener meines Herrn
  rationale: „Diener“ entspricht der höfischen Selbstbezeichnung der Demut, ohne unnötig ein Besitzverhältnis im Sinn von „Sklave“ hervorzuheben. „Dieser“ bewahrt den deiktischen Selbstbezug.
- source_word: לְדַבֵּר עִם אֲדֹנִי זֶה
  choice: mit meinem Herrn hier reden
  rationale: „Mit … reden“ bewahrt עִם („mit“). „Hier“ gibt die unmittelbare, deiktische Kraft des zweiten זֶה idiomatisch wieder; die ungewöhnliche Wiederholung wird in der Fußnote dokumentiert.
- source_word: וַאֲנִי
  choice: Ich jedenfalls
  rationale: Hebt den ausdrücklichen Wechsel zu Daniels eigenem Zustand hervor.
- source_word: מֵעַתָּה
  choice: jetzt
  rationale: Im Zusammenhang bezeichnet der Ausdruck Daniels unmittelbar gegenwärtigen Zustand. Die stärker fortdauernde Wiedergabe „von jetzt an“ bleibt als Alternative in der Fußnote erhalten.
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: habe … keine Kraft mehr
  rationale: Gibt die hebräische Wendung, dass keine Kraft in ihm Bestand hat, in klarem gegenwärtigem Deutsch wieder.
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: und kein Atem ist mir geblieben
  rationale: נְשָׁמָה bezeichnet hier im Zusammenhang körperlicher Entkräftung am ehesten den Atem beziehungsweise Lebensatem; „ist mir geblieben“ bildet das Verbleiben eng nach.
theological_decisions:
- issue: Wiedergabe von אֲדֹנִי bei der Anrede einer erhabenen Gestalt
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Der Ausdruck ist nicht der Gottesname JHWH. „Mein Herr“ wahrt die ehrerbietige Anrede und den erhöhten Ton, ohne die Gestalt durch die Übersetzung ausdrücklich mit JHWH gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung bleibt sichtbar, während die im Deutschen schwerfällige Wiederholung des Demonstrativpronomens im Haupttext idiomatisch und in der Fußnote formal genauer wiedergegeben wird.
