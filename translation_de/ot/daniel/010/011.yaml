source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: de
  text: 'Und er sagte zu mir: „Daniel, du hochgeschätzter Mann[a], versteh die Worte, die ich zu dir rede, und stell dich aufrecht hin[b], denn jetzt bin ich zu dir gesandt worden.“ Und während er dieses Wort[c] zu mir sprach, stand ich zitternd da.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du vielgeliebter Mann“. Wörtlich bezeichnet der hebräische Ausdruck einen Mann von Kostbarkeit oder Begehrtheit; hier ist er eine ehrende Anrede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tritt an deinen Standort“. Wörtlich: „steh auf deinem Stand/Platz“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „diese Botschaft“ beziehungsweise „diese Sache“. Das hebräische Wort kann außer „Wort“ auch eine Mitteilung oder Angelegenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: du hochgeschätzter Mann
  rationale: Die Wendung bezeichnet wörtlich einen Mann, der von Kostbarkeit oder Begehrtheit geprägt ist, und dient hier als ehrende Anrede. „Hochgeschätzt“ klingt im Deutschen natürlich und lässt offen, ob besonders Wertschätzung oder Zuneigung im Vordergrund steht.
- source_word: הָבֵן
  choice: versteh
  rationale: Der Imperativ fordert Daniel auf, den Sinn der folgenden Rede zu erfassen. „Versteh“ gibt dies direkt und verständlich wieder.
- source_word: בַּדְּבָרִים
  choice: die Worte
  rationale: דבר kann Worte, Dinge oder Angelegenheiten bezeichnen. Durch den anschließenden Bezug auf das Reden des Boten steht hier die sprachliche Bedeutung im Vordergrund.
- source_word: דֹבֵר אֵלֶיךָ
  choice: die ich zu dir rede
  rationale: Das Partizip bezeichnet das gegenwärtige beziehungsweise unmittelbar bevorstehende Reden. Die Formulierung ist gegenwartsnah und würdevoll.
- source_word: וַעֲמֹד עַל־עָמְדֶךָ
  choice: stell dich an deinen Platz
  rationale: Die hebräische Wendung lautet wörtlich etwa „steh auf deinem Stand/Platz“. Die Übersetzung bewahrt sowohl den körperlichen Befehl zum Stehen als auch den möglichen Bezug auf Daniels zugewiesenen Standort.
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: ich bin zu dir gesandt worden
  rationale: Das passive Perfekt bezeichnet die erfolgte Sendung mit unmittelbarer Bedeutung für die gegenwärtige Begegnung.
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה
  choice: während er dieses Wort zu mir sprach
  rationale: Die Infinitivkonstruktion bezeichnet eine gleichzeitige Handlung. „Zu mir sprach“ ist im Deutschen natürlicher als das formal mögliche „mit mir sprach“; „Wort“ bewahrt die Einzahl des Hebräischen.
- source_word: מַרְעִיד
  choice: zitternd
  rationale: Das Partizip beschreibt sichtbares körperliches Zittern und wird im Deutschen knapp und anschaulich wiedergegeben.
theological_decisions:
- issue: Ehrende Bezeichnung Daniels in der Anrede des himmlischen Boten
  choice: du hochgeschätzter Mann
  alternative: du vielgeliebter Mann
  rationale: „Hochgeschätzt“ gibt die ehrende Funktion wieder, ohne die mehrdeutige Wendung ausschließlich als Aussage persönlicher Liebe festzulegen.
- issue: Bedeutung des Befehls וַעֲמֹד עַל־עָמְדֶךָ
  choice: stell dich an deinen Platz
  alternative: stell dich aufrecht hin
  rationale: Die gewählte Fassung hält die Spannung zwischen körperlichem Aufstehen und dem Einnehmen eines bestimmten Standorts aufrecht, statt die Wendung auf nur einen dieser Aspekte zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Anrede verwendet die natürliche Imperativform „versteh“ und „stell dich“. Mehrdeutige hebräische Wendungen werden im Haupttext nicht unnötig aufgelöst; relevante Alternativen stehen in den Fußnoten.
