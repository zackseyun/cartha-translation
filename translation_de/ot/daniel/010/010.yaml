lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die lebhafte, aufmerksamkeitslenkende Funktion des hebräischen Erzählmarkers in einer verständlichen, würdigen Form.
- source_word: יָד
  choice: eine Hand
  rationale: Die unbestimmte Wiedergabe entspricht dem artikellosen hebräischen Substantiv und bewahrt zunächst die Ungewissheit, wessen Hand es ist.
- source_word: נָגְעָה בִּי
  choice: berührte mich
  rationale: Gibt die gewöhnliche Bedeutung von נגע und den hier geschilderten körperlichen Kontakt unmittelbar wieder.
- source_word: וַתְּנִיעֵנִי
  choice: brachte mich
  rationale: Im Zusammenhang mit עַל und den genannten Körperteilen bezeichnet die Form, dass Daniel in diese Stellung versetzt beziehungsweise bewegt wird; die mögliche Nuance des Schüttelns oder Zitterns wird in der Fußnote offengehalten.
- source_word: עַל בִּרְכַּי וְכַפּוֹת יָדָי
  choice: auf meine Knie und Handflächen
  rationale: Gibt die resultierende Körperhaltung knapp wieder und bewahrt mit „Handflächen“ die konkrete Bedeutung von כַּפּוֹת יָדַי.
