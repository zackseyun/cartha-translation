  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: de
  text: 'Da erhob ich meine Augen und sah: Siehe, ein Mann, in Leinen gekleidet, mit Gold aus Ufas um die Hüften gegürtet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Feingold aus Ufas“. Der hebräische Ausdruck kann neben der Herkunft auch die besondere Qualität des Goldes hervorheben.'
    reason: Lexikalische Alternative bei כֶּתֶם אוּפָז.
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: Da erhob ich meine Augen
  rationale: Die hebräische Wendung mit נשׂא und „Augen“ wird als bewusstes Richten des Blicks wiedergegeben. Die leicht feierliche Formulierung bewahrt das Bild, ohne es zu „ich blickte auf“ zu verkürzen.
- source_word: וָאֵרֶא
  choice: und sah
  rationale: ראה bezeichnet hier das Wahrnehmen der anschließenden Erscheinung. „Sah“ bewahrt die Abfolge von erhobenem Blick und Wahrnehmung und ist im Deutschen trotz der Nähe zur ersten Wendung natürlich.
- source_word: וְהִנֵּה
  choice: Siehe, da war
  rationale: „Siehe“ erhält die hinweisende, visionär-feierliche Kraft von הִנֵּה; „da war“ bindet die folgende Gestalt idiomatisch in den deutschen Satz ein.
- source_word: אִישׁ אֶחָד
  choice: ein Mann
  rationale: Die Wendung bezeichnet eine einzelne männliche Gestalt. „Ein Mann“ ist im Deutschen natürlicher als „ein Mann, einer“ oder „ein gewisser Mann“ und nimmt keine Deutung seiner Identität vorweg.
- source_word: לָבוּשׁ בַּדִּים
  choice: in Leinen gekleidet
  rationale: בַּדִּים bezeichnet Leinen beziehungsweise leinene Kleidung. Die Wiedergabe bleibt knapp und legt keine bestimmte Art des Gewandes fest.
- source_word: מָתְנָיו
  choice: seine Hüften
  rationale: Das Wort bezeichnet den Hüft- oder Lendenbereich. „Hüften“ ist gegenwärtiges, verständliches Deutsch und vermeidet das altertümliche „Lenden“.
- source_word: חֲגֻרִים
  choice: waren … umgürtet
  rationale: Die passive Form beschreibt den umgürteten Hüftbereich. „Umgürtet“ erhält die feierliche Bildsprache und gibt den Zustand genauer wieder als eine freie Formulierung mit „trug einen Gürtel“.
- source_word: בְּכֶתֶם אוּפָז
  choice: mit Gold aus Ufas
  rationale: כֶּתֶם bezeichnet kostbares beziehungsweise geläutertes Gold; אוּפָז wird als Eigenname „Ufas“ wiedergegeben. Der Haupttext bewahrt die mögliche Herkunftsangabe, während die Qualitätsnuance in der Fußnote genannt wird.
theological_decisions:
- issue: Identität der visionären Gestalt
  choice: Neutral als „ein Mann“ wiedergegeben
  alternative: Deutung als Engelwesen, Messias oder Gotteserscheinung
  rationale: Der Vers beschreibt Aussehen und Kleidung, identifiziert die Gestalt jedoch nicht ausdrücklich. Die Übersetzung wahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener visionärer Signalformel „Siehe“. Die Satzstruktur ist lesbar gegliedert; altertümliche Wörter wie „Lenden“ werden vermieden, während „umgürtet“ wegen seiner präzisen und feierlichen Bildwirkung erhalten bleibt.
