  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: de
  text: Doch ich werde dir mitteilen, was in der Schrift der Wahrheit[a] aufgezeichnet ist. Und niemand steht mir gegen diese[b] bei außer Michael, eurem Fürsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was in der Schrift der Wahrheit geschrieben steht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der mir in diesen Angelegenheiten beisteht«. Der hebräische Ausdruck kann ein starkes Eintreten an der Seite eines anderen bezeichnen; »diese« kann sich entweder auf feindliche Mächte oder auf die besprochenen Angelegenheiten beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבָל
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum Vorhergehenden in natürlichem, würdigem Deutsch.
- source_word: אַגִּיד לְךָ
  choice: ich werde dir mitteilen
  rationale: Gibt den Hifil von נגד als Ankündigung einer Mitteilung wieder und bewahrt den Zukunftsbezug.
- source_word: הָרָשׁוּם
  choice: was … aufgezeichnet ist
  rationale: Der passive Partizipialausdruck bezeichnet etwas schriftlich Festgehaltenes oder Verzeichnetes.
- source_word: בִּכְתָב אֱמֶת
  choice: in der Schrift der Wahrheit
  rationale: כְּתָב bezeichnet eine Schrift beziehungsweise ein Schriftstück; „Schrift der Wahrheit“ wahrt die Genitivverbindung, ohne vorschnell ein Buch als Gegenstand festzulegen.
- source_word: וְאֵין אֶחָד
  choice: Und niemand
  rationale: Natürliche deutsche Wiedergabe der verneinten Existenzkonstruktion mit אֶחָד.
- source_word: מִתְחַזֵּק עִמִּי
  choice: steht mir … zur Seite
  rationale: Der Hitpael von חזק mit עִמִּי beschreibt hier ein starkes Eintreten an der Seite des Sprechers; die deutsche Wendung gibt die unterstützende und standhafte Komponente idiomatisch wieder.
- source_word: עַל אֵלֶּה
  choice: gegen diese
  rationale: Im Konfliktzusammenhang ist עַל wahrscheinlich adversativ und bezieht sich auf gegnerische Mächte; die Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: כִּי אִם
  choice: außer
  rationale: Die Konstruktion bildet nach der Verneinung eine Ausnahme.
- source_word: מִיכָאֵל
  choice: Michael
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: שַׂרְכֶם
  choice: eurem Fürsten
  rationale: שַׂר bezeichnet hier einen himmlischen Fürsten. Die Pluralform des Suffixes wird durch „eurem“ bewahrt und weist über Daniel als Einzelperson hinaus auf sein Volk.
theological_decisions:
- issue: Identität und Funktion Michaels
  choice: Michael wird ausschließlich mit dem versinternen Titel „euer Fürst“ bezeichnet.
  alternative: Michael ausdrücklich als Erzengel oder symbolischen Repräsentanten Israels bestimmen.
  rationale: Der Vers selbst nennt Michael שַׂרְכֶם, erläutert seine genauere Identität aber nicht. Die Übersetzung vermeidet deshalb spätere dogmatische Festlegungen.
- issue: Bezug von עַל אֵלֶּה
  choice: „gegen diese“ als wahrscheinlicher Bezug auf gegnerische Mächte
  alternative: „in diesen Angelegenheiten“ als neutraler Bezug auf die besprochenen Dinge
  rationale: Der unmittelbare Kampfkontext stützt die adversative Lesart, doch die hebräische Formulierung lässt auch einen sachlichen Bezug zu; diese Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schrift der Wahrheit“ bleibt näher am hebräischen כְּתָב als „Buch der Wahrheit“. Das pluralische „eurem“ gibt das hebräische Suffix genau wieder und bezeichnet Michael als Fürsten des Volkes, zu dem Daniel gehört.
