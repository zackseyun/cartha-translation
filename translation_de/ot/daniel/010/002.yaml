  text: בַּ/יָּמִ֖ים הָ/הֵ֑ם אֲנִ֤י דָֽנִיֵּאל֙ הָיִ֣יתִי מִתְאַבֵּ֔ל שְׁלֹשָׁ֥ה שָׁבֻעִ֖ים יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/002.yaml
  text: In those days[a], I, Daniel, was mourning for three weeks of days.
translation:
  language: de
  text: In jenen Tagen trauerte ich, Daniel, drei volle Wochen lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „drei Wochen, Tage“; gemeint sind drei gewöhnliche Wochen aus Tagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die Wendung ist eine übliche Zeitangabe. „In jenen Tagen“ bildet den Plural und den rückverweisenden Charakter des Hebräischen natürlich ab.
- source_word: אֲנִי דָנִיֵּאל
  choice: ich, Daniel
  rationale: Das selbstständige Pronomen mit dem Eigennamen dient der betonten Selbstbezeichnung; die deutsche Apposition gibt dies klar und natürlich wieder.
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: trauerte
  rationale: Die Verbindung von היה mit dem Hitpael-Partizip bezeichnet einen andauernden Zustand beziehungsweise Vorgang in der Vergangenheit. Zusammen mit „drei volle Wochen lang“ ist die Dauer im Deutschen eindeutig.
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: drei volle Wochen lang
  rationale: Wörtlich steht „drei Wochen, Tage“. Der Zusatz „Tage“ verdeutlicht gewöhnliche, aus Tagen bestehende Wochen; „drei volle Wochen“ vermittelt diese Abgrenzung in natürlichem Deutsch, während „drei Wochen von Tagen“ missverständlich und unidiomatisch wäre.
theological_decisions:
- issue: Verhältnis zu den symbolischen „Wochen“ im Danielbuch
  choice: Die Wendung wird als drei gewöhnliche Wochen wiedergegeben.
  alternative: Die ungewöhnliche Formulierung „drei Wochen von Tagen“ wörtlich beibehalten.
  rationale: Der ausdrücklich hinzugefügte Begriff „Tage“ legt reale Wochen nahe, ohne darüber hinaus eine bestimmte Auslegung des Zusammenhangs festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung wahrt Daniels betonte Selbstbezeichnung; „lang“ macht den Zeitraum idiomatisch deutlich.
