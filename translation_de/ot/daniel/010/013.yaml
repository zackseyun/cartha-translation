id: DAN.10.13
reference: Daniel 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: de
  text: Doch der Fürst des Königreichs Persien stellte sich mir einundzwanzig Tage lang entgegen. Und siehe, Michael, einer der obersten Fürsten[a], kam mir zu Hilfe, und ich blieb dort bei den Königen von Persien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer der ersten Fürsten“; oder: „einer der vornehmsten Fürsten“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der Plural „die Könige von Persien“; manche Übersetzungen glätten ihn zu „der König von Persien“.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר
  choice: Fürst
  rationale: „Fürst“ wahrt im Kontext Daniels die Mehrdeutigkeit zwischen politischem und himmlischem Rang und entspricht zugleich der Bezeichnung Michaels.
- source_word: מַלְכוּת פָּרַס
  choice: das Königreich Persien
  rationale: Die Wiedergabe erhält die hebräische Genitivverbindung und ordnet den Fürsten ausdrücklich dem persischen Herrschaftsbereich zu.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: stellte sich mir entgegen
  rationale: Die Formulierung gibt das anhaltende widerständige Gegenüberstehen idiomatisch und mit klarer gegnerischer Bedeutung wieder.
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: einundzwanzig Tage lang
  rationale: „Tage lang“ kennzeichnet die Zeitspanne in natürlichem modernem Deutsch.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Wendung bewahrt das Aufmerksamkeitssignal und die feierliche Lebendigkeit des hebräischen Ausdrucks.
- source_word: מִיכָאֵל
  choice: Michael
  rationale: Der Personenname folgt der im Deutschen etablierten Form.
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: einer der obersten Fürsten
  rationale: „Obersten“ gibt den wahrscheinlich gemeinten Vorrang im Rang natürlich wieder, ohne die möglichen Bedeutungen „ersten“ oder „vornehmsten“ auszuschließen.
- source_word: בָּא לְעָזְרֵנִי
  choice: kam mir zu Hilfe
  rationale: Dies ist eine direkte und natürliche Wiedergabe der Bewegung mit dem Zweck des Helfens.
- source_word: נוֹתַרְתִּי
  choice: ich blieb
  rationale: Das Niphal kann „übriggelassen werden“ oder „bleiben“ bedeuten. „Ich blieb“ ist im Deutschen klar und bewahrt die kontextuelle Offenheit besser als eine erklärende Paraphrase.
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: bei den Königen von Persien
  rationale: „Bei“ entspricht der räumlich-assoziativen Grundbedeutung von אֵצֶל; der im Hebräischen stehende Plural „Könige“ bleibt erhalten.
theological_decisions:
- issue: Identität des „Fürsten des Königreichs Persien“ und der „obersten Fürsten“
  choice: Die Bezeichnung „Fürst“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Eine ausdrückliche Deutung als Engelwesen, menschlicher Herrscher oder Verbindung beider Ebenen.
  rationale: Der Zusammenhang legt einen übermenschlichen Konflikt nahe, doch der hebräische Text sagt שַׂר und nicht „Engel“. Die Übersetzung soll diese Spannung nicht vorentscheiden.
- issue: Plural מַלְכֵי פָרָס
  choice: „die Könige von Persien“
  alternative: „der König von Persien“ oder eine erklärende dynastische Umschreibung.
  rationale: Der masoretische Text hat eindeutig den Plural. Ob damit mehrere Herrscher, eine Dynastie oder königliche Mächte gemeint sind, wird nicht durch die Übersetzung festgelegt.
- issue: Bedeutung von נוֹתַרְתִּי
  choice: „ich blieb“
  alternative: „ich wurde dort zurückgelassen“ oder „ich blieb dort zurück“.
  rationale: Die Verbform lässt sowohl ein Verbleiben als auch ein Zurückgelassenwerden anklingen. Die knappe Fassung vermeidet es, den Ablauf über den Wortlaut hinaus zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Und siehe“ wurde als bewusst feierliches Aufmerksamkeitssignal beibehalten. Die Satzstruktur folgt dem Hebräischen eng, ohne im Deutschen steif zu wirken.
