  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: de
  text: Wieder berührte mich einer, der wie ein Mensch aussah, und stärkte mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einer von menschlicher Gestalt“; wörtlich etwa: „wie das Aussehen eines Menschen“. Das Hebräische beschreibt die sichtbare Ähnlichkeit, ohne die Gestalt ausdrücklich als bloßen Menschen zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: Wieder
  rationale: יסף mit folgendem finiten Verb bezeichnet hier die Wiederholung einer Handlung. „Wieder“ gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: וַיִּגַּע בִּי
  choice: berührte mich
  rationale: נגע mit ב bezeichnet in diesem visionären Zusammenhang körperlichen Kontakt. „Berührte mich“ entspricht dem unmittelbaren Wortsinn und passt zur anschließenden Stärkung.
- source_word: כְּמַרְאֵה אָדָם
  choice: einer, der wie ein Mensch aussah
  rationale: מַרְאֶה bezeichnet die sichtbare Erscheinung oder Gestalt; כ markiert einen Vergleich. Die Formulierung ist im Deutschen natürlich und beschreibt nur das Aussehen, ohne das Wesen als bloßen Menschen zu bestimmen.
- source_word: וַיְחַזְּקֵנִי
  choice: stärkte mich
  rationale: Das Piel von חזק bedeutet „stärken“ oder „kräftigen“. „Stärkte mich“ bewahrt die körperliche und seelische Weite der Aussage.
theological_decisions:
- issue: Identität der Gestalt mit menschlichem Aussehen
  choice: Die Gestalt wird ausschließlich nach ihrem Aussehen beschrieben.
  alternative: Sie ausdrücklich als Engel oder als präexistenten Christus identifizieren.
  rationale: Der hebräische Text nennt keine eindeutige Identität, sondern beschreibt nur die sichtbare Ähnlichkeit mit einem Menschen. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und verständlich; „einer“ macht das im Hebräischen aus dem Zusammenhang erschlossene Subjekt idiomatisch sichtbar, ohne dessen Identität festzulegen.
