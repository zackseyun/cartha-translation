- from: Im dritten Jahr des Perserkönigs Kyrus wurde Daniel, der Beltschazar genannt wurde, eine Botschaft offenbart. Die Botschaft war wahr und handelte von einem großen Kampf[a]. Er verstand die Botschaft und gewann Einsicht in die Vision.
  to: Im dritten Jahr des Perserkönigs Kyrus wurde Daniel, der Beltschazar genannt wurde, eine Botschaft offenbart. Die Botschaft war wahr und handelte von einem großen Kampf[a]. Er verstand die Botschaft und hatte Verständnis für die Vision.
  rationale: Die Änderung im Schlusssatz vermeidet die nicht im Hebräischen ausgedrückte Nuance eines erst eintretenden Erkenntnisgewinns und gibt die Beziehung des Verständnisses zur Vision idiomatisch wieder. Die Fußnote bewahrt die relevante militärische Alternative, ohne eine weniger naheliegende Deutung zu übergewichten.
