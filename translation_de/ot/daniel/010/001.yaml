review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von דָּבָר als „Botschaft“, נִגְלָה als „wurde ... offenbart“ und der Namensform „Beltschazar“ ist sachgerecht. „Großer Kampf“ ist für וְצָבָא גָדוֹל im Kontext eine vertretbare, nicht überbestimmende Wiedergabe. Der Schlusssatz sollte jedoch die statische hebräische Aussage, dass Daniel Verständnis hinsichtlich der Vision hatte, nicht als den Vorgang des Erlangens von Einsicht wiedergeben.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Einsicht in die Vision gewinnen“ ist zwar verständlich, klingt aber etwas konstruiert und verschiebt den Sinn. „Verständnis für die Vision haben“ ist idiomatischer und präziser.
  terminology: Die konsequente Wiederaufnahme von „Botschaft“ bildet die Wiederholung von דָּבָר gut ab. Die Fußnote sollte die militärische Lesemöglichkeit von צָבָא nennen, aber die nur schwach begründete Alternative „Mühsal“ nicht als gleichrangige Deutungsmöglichkeit ausgeben.
  issues:
  - severity: medium
    issue: „gewann Einsicht in die Vision“
    rationale: וּבִינָה לוֹ בַּמַּרְאֶה ist eine nominale Aussage über vorhandenes bzw. ihm zukommendes Verständnis; „gewann“ fügt einen Erwerbsvorgang hinzu. „hatte Verständnis für die Vision“ gibt den Sinn ohne diesen Zusatz wieder.
  - severity: low
    issue: Fußnote nennt „große Mühsal“ als mögliche Bedeutung
    rationale: Für צָבָא sind „Heer“, „Kriegsdienst/Kriegsführung“ und daraus „Kampf/Konflikt“ die naheliegenden Optionen. „Mühsal“ sollte hier nicht als eigenständige lexikalische Alternative hervorgehoben werden.
