source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: de
  text: Im dritten Jahr des Perserkönigs Kyrus wurde Daniel, der Beltschazar genannt wurde, eine Botschaft offenbart. Die Botschaft war wahr und handelte von einem großen Kampf[a]. Er verstand die Botschaft und hatte Verständnis für die Vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ein großer Krieg“. Das hebräische Wort kann ein Heer, Kriegsdienst oder Kampf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר
  choice: Botschaft
  rationale: Das Wort bezeichnet hier den offenbarten Inhalt. „Botschaft“ ist im Deutschen natürlicher als „Wort“ und lässt sich bei der Wiederaufnahme durch הַדָּבָר konsequent wiederholen.
- source_word: נִגְלָה
  choice: wurde … offenbart
  rationale: Der Nifal von גלה bezeichnet hier das Offenbarwerden beziehungsweise die Offenbarung einer göttlichen Botschaft.
- source_word: נִקְרָא שְׁמוֹ
  choice: der … genannt wurde
  rationale: Die deutsche Form gibt die passive Namensgebung idiomatisch wieder.
- source_word: בֵּלְטְשַׁאצַּר
  choice: Beltschazar
  rationale: Der babylonische Name wird in einer im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: וֶאֱמֶת הַדָּבָר
  choice: Die Botschaft war wahr
  rationale: Die Formulierung bewahrt die Wiederholung von דָּבָר und bekräftigt die Zuverlässigkeit des Offenbarten.
- source_word: וְצָבָא גָדוֹל
  choice: handelte von einem großen Kampf
  rationale: צָבָא kann Heer, Kriegsdienst oder Kampf bezeichnen. Im Zusammenhang von Daniel 10–12 liegt ein großer Konflikt nahe; „handelte von“ macht die Beziehung zur Botschaft im Deutschen verständlich, ohne die militärische Bedeutung völlig aufzugeben.
- source_word: וּבִין אֶת הַדָּבָר
  choice: Er verstand die Botschaft
  rationale: בין bezeichnet hier das Erfassen oder Verstehen des offenbarten Inhalts.
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: und gewann Einsicht in die Vision
  rationale: Die Wendung mit בִּינָה und לּוֹ drückt aus, dass Daniel Einsicht besaß beziehungsweise erlangte. „Einsicht in die Vision“ ist natürliches Deutsch und wahrt den Zusammenhang mit der Offenbarung.
theological_decisions:
- issue: Bedeutung von וְצָבָא גָדוֹל in der apokalyptischen Offenbarung
  choice: handelte von einem großen Kampf
  alternative: und es war ein großer Krieg / eine große Mühsal
  rationale: Die knappe hebräische Nominalwendung ist mehrdeutig. Der weitere Zusammenhang beschreibt himmlische und irdische Auseinandersetzungen; daher ist „großer Kampf“ plausibel. Die Fußnote bewahrt die stärker militärische und die auf Bedrängnis zielende Lesart.
- issue: Verhältnis von Verstehen und Vision im Schlusssatz
  choice: gewann Einsicht in die Vision
  alternative: und Einsicht wurde ihm durch das Gesicht zuteil
  rationale: Die hebräische Formulierung lässt offen, ob die Einsicht als Besitz, Empfang oder Ergebnis der Vision akzentuiert wird. Die gewählte Fassung bleibt verständlich, ohne die Art der Vermittlung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde leicht geglättet, die Wiederholung von „Botschaft“ jedoch als Merkmal des hebräischen Textes beibehalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
