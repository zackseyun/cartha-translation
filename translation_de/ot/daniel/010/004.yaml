source:
  edition: WLC
  text: וּ/בְ/י֛וֹם עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַ/אֲנִ֗י הָיִ֛יתִי עַ֣ל יַ֧ד הַ/נָּהָ֛ר הַ/גָּד֖וֹל ה֥וּא חִדָּֽקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: de
  text: Am vierundzwanzigsten Tag des ersten Monats befand ich mich am Ufer des großen Stromes, nämlich des Tigris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Hiddekel, der übliche hebräische Name für den Tigris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: Am vierundzwanzigsten Tag
  rationale: Die hebräische Datumsformel verwendet eine Kardinalzahl; im natürlichen Deutschen steht bei Datumsangaben die entsprechende Ordinalzahl. Das einleitende ו wird im Deutschen nicht eigens wiedergegeben.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: des ersten Monats
  rationale: Der Genitiv entspricht einer üblichen deutschen Datumsformel und gibt die Zuordnung des Tages zum Monat klar wieder.
- source_word: וַאֲנִי הָיִיתִי
  choice: befand ich mich
  rationale: היה bezeichnet hier Daniels Aufenthalt an einem Ort. „Befand ich mich“ ist idiomatisch und behält den berichtenden Ton bei.
- source_word: עַל יַד הַנָּהָר
  choice: am Ufer des … Stromes
  rationale: Die Wendung עַל יַד bedeutet „an der Seite von/bei“. Im Zusammenhang mit einem Strom gibt „am Ufer“ die räumliche Aussage natürlich und eindeutig wieder.
- source_word: הַגָּדוֹל
  choice: großen
  rationale: Die direkte Bedeutung des Adjektivs wird bewahrt; „großer Strom“ ist eine natürliche und würdevolle deutsche Formulierung.
- source_word: הוּא חִדָּקֶל
  choice: nämlich des Tigris
  rationale: הוּא kennzeichnet hier die nähere Bestimmung des zuvor genannten Stromes. Für חִדָּקֶל wird die im Deutschen übliche geografische Bezeichnung „Tigris“ verwendet.
