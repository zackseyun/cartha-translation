  text: לֶ֣חֶם חֲמֻד֞וֹת לֹ֣א אָכַ֗לְתִּי וּ/בָשָׂ֥ר וָ/יַ֛יִן לֹא בָ֥א אֶל פִּ֖/י וְ/ס֣וֹךְ לֹא סָ֑כְתִּי עַד מְלֹ֕את שְׁלֹ֥שֶׁת שָׁבֻעִ֖ים יָמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: de
  text: Ich aß keine erlesenen Speisen[a]. Fleisch und Wein kamen nicht in meinen Mund, und ich salbte mich überhaupt nicht, bis drei volle Wochen[b] vergangen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brot der begehrenswerten Dinge«; gemeint sind besonders gute oder angenehme Speisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »drei Wochen an Tagen«; das heißt drei volle Wochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: erlesene Speisen
  rationale: Wörtlich bezeichnet die Wendung ein »Brot der Kostbarkeiten/Begehrlichkeiten«. Im Zusammenhang ist damit nicht nur Brot, sondern besonders gute oder angenehme Nahrung gemeint; »erlesene Speisen« gibt den idiomatischen Sinn natürlich wieder.
- source_word: בָשָׂר
  choice: Fleisch
  rationale: Im Zusammenhang mit dem Essen ist »Fleisch« die direkte und idiomatische deutsche Entsprechung.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und im Kontext eindeutige Wiedergabe.
- source_word: לֹא בָא אֶל־פִּי
  choice: kamen nicht in meinen Mund
  rationale: Die hebräische Ausdrucksweise wird eng bewahrt und ist im Deutschen verständlich; gemeint ist, dass Daniel davon nichts zu sich nahm.
- source_word: סוֹךְ ... סָכְתִּי
  choice: ich salbte mich überhaupt nicht
  rationale: Das Verb bezeichnet das Einreiben beziehungsweise Salben des Körpers mit Öl, gewöhnlich zur Pflege oder Erfrischung. »Überhaupt nicht« gibt die nachdrückliche Verneinung wieder.
- source_word: עַד מְלֹאת
  choice: bis ... vergangen waren
  rationale: Die Konstruktion bezeichnet das vollständige Ablaufen des genannten Zeitraums. Die deutsche Formulierung ist natürlich und wahrt diesen zeitlichen Sinn.
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: drei volle Wochen
  rationale: Wörtlich steht »drei Wochen an Tagen« beziehungsweise »drei Wochen von Tagen«. »Drei volle Wochen« bringt idiomatisch zum Ausdruck, dass es sich um einen vollständig abgelaufenen Zeitraum handelt.
theological_decisions: []
