source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: de
  text: 'Und sieh: Etwas wie eine menschliche Gestalt[a] berührte meine Lippen. Da öffnete ich meinen Mund, redete und sagte zu dem, der vor mir stand: »Mein Herr, wegen der Erscheinung haben mich Schmerzen überfallen[b], und mir ist keine Kraft geblieben[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Gestalt von Menschen“. Die hebräische Formulierung ist ungewöhnlich vielschichtig und bezeichnet eine menschenähnliche Erscheinung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „haben mich Qualen überfallen“; auch „Wehen“ ist möglich. Der Ausdruck beschreibt heftige Schmerzen oder Bedrängnis.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und ich behielt keine Kraft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: etwas wie eine menschliche Gestalt
  rationale: Die Vergleichspartikel, דְּמוּת („Gestalt, Abbild, Ähnlichkeit“) und die allgemeine Menschenbezeichnung בְּנֵי אָדָם werden erkennbar wiedergegeben, ohne daraus den Titel „Menschensohn“ zu machen. Die Formulierung bewahrt zugleich die Unbestimmtheit der visionären Wahrnehmung.
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: berührte meine Lippen
  rationale: נגע mit עַל bezeichnet hier eine Berührung. Das Partizip wird im erzählenden Zusammenhang idiomatisch als abgeschlossene Handlung wiedergegeben.
- source_word: וָאֶפְתַּח פִּי וָאֲדַבְּרָה וָאֹמְרָה
  choice: Da öffnete ich meinen Mund, redete und sagte
  rationale: Alle drei Aussagen des Hebräischen bleiben erhalten; „Da“ verdeutlicht die zeitliche Folge, ohne den Inhalt zu erweitern.
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: dem, der vor mir stand
  rationale: לְנֶגֶד bezeichnet eine Position vor beziehungsweise gegenüber Daniel; „vor mir“ ist im Deutschen natürlich und kontextgerecht.
- source_word: אֲדֹנִי
  choice: Mein Herr
  rationale: Die respektvolle Anrede gilt der himmlischen Gestalt und ist nicht der Gottesname. „Mein Herr“ wahrt die Ehrerbietung, ohne die Gestalt ausdrücklich mit JHWH gleichzusetzen.
- source_word: בַּמַּרְאָה
  choice: wegen der Erscheinung
  rationale: Die Präposition בְּ wird im Zusammenhang kausal verstanden. מַרְאָה kann eine Vision oder Erscheinung bezeichnen; „Erscheinung“ passt zur geschauten Gestalt und lässt den Bezug auf das visionäre Erlebnis offen.
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: haben mich Schmerzen überfallen
  rationale: צִירִים bezeichnet heftige Schmerzen, Wehen oder Qualen. Die Wiedergabe beschreibt verständlich, wie die Schmerzen Daniel überwältigen, ohne die körperliche Art zu eng festzulegen.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: und mir ist keine Kraft geblieben
  rationale: 'Die idiomatische deutsche Formulierung gibt das Ergebnis des hebräischen Ausdrucks wieder: Daniel konnte keinerlei Kraft zurück- oder festhalten.'
theological_decisions:
- issue: Bedeutung von בְּנֵי אָדָם in der visionären Beschreibung
  choice: allgemeine Bezeichnung menschlicher Gestalt
  alternative: titelhafte Wiedergabe als „Menschensohn“
  rationale: Die pluralische allgemeine Menschenbezeichnung steht innerhalb einer mehrgliedrigen Vergleichsformel. Der Text kennzeichnet eine menschenähnliche Erscheinung, ohne hier ausdrücklich einen messianischen Titel zu verwenden.
- issue: Anrede אֲדֹנִי
  choice: Mein Herr
  alternative: mein Herr und Gott / der HERR
  rationale: אֲדֹנִי ist hier eine ehrerbietige Anrede, nicht der Bundesname JHWH. Die Übersetzung vermeidet daher eine nicht ausdrücklich ausgesagte Identifizierung der Gestalt mit Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und sieh“ erhält den aufmerksamkeitslenkenden Charakter von וְהִנֵּה; die direkte Rede bleibt feierlich, aber verständlich. Die ungewöhnliche Bildsprache wird im Haupttext lesbar wiedergegeben und in den Fußnoten näher am Wortlaut dokumentiert.
