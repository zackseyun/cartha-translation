id: DAN.10.20
reference: Daniel 10:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: de
  text: 'Da sagte er: „Weißt du, warum ich zu dir gekommen bin? Und nun kehre ich zurück, um gegen den Fürsten von Persien zu kämpfen. Wenn ich fortgehe[a], sieh: Der Fürst[b] von Griechenland[c] kommt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich gehe fort“. Die hebräische Wendung ist knapp; sie kann eine einfache Abreise bezeichnen oder zeitlich verstanden werden: „wenn ich fortgehe“.'
    reason: lexical_alternative
  - marker: b
    text: „Fürst“ bezeichnet hier wahrscheinlich einen übernatürlichen Herrscher, der einem Volk oder Reich zugeordnet ist; ausdrücklich gesagt wird das in diesem Vers jedoch nicht.
    reason: alternative_reading
  - marker: c
    text: Hebräisch Jawan, eine Bezeichnung, die gewöhnlich Griechenland oder den griechischen Machtbereich meint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Weißt du
  rationale: Die Fragepartikel mit ידע fragt danach, ob Daniel den Grund für das Kommen des Sprechers kennt oder versteht. „Weißt du“ ist knapp, natürlich und kontextgerecht.
- source_word: לָמָּה
  choice: warum
  rationale: Das gewöhnliche Fragewort nach dem Grund wird im Deutschen am natürlichsten mit „warum“ wiedergegeben.
- source_word: בָּאתִי אֵלֶיךָ
  choice: ich zu dir gekommen bin
  rationale: Das deutsche Perfekt bringt die abgeschlossene, für das gegenwärtige Gespräch weiterhin bedeutsame Ankunft idiomatisch zum Ausdruck.
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert den Fortgang der Rede; „Und nun“ bewahrt diesen Übergang in würdigem, heutigem Deutsch.
- source_word: אָשׁוּב
  choice: kehre ich zurück
  rationale: Das Imperfekt ist hier zukunftsbezogen. „Zurückkehren“ weist darauf, dass der Sprecher den zuvor erwähnten Kampf wieder aufnimmt.
- source_word: לְהִלָּחֵם עִם
  choice: um gegen … zu kämpfen
  rationale: Der Infinitiv von לחם mit עִם bezeichnet das Eintreten in einen Kampf; die deutsche Fügung gibt den gegnerischen Sinn eindeutig und natürlich wieder.
- source_word: שַׂר פָּרָס
  choice: der Fürst von Persien
  rationale: שַׂר kann einen Fürsten, Obersten oder Machthaber bezeichnen. „Fürst“ wahrt den erhöhten Sprachton und legt die Art des Wesens nicht ausdrücklich fest.
- source_word: וַאֲנִי יוֹצֵא
  choice: Wenn ich fortgehe
  rationale: Die knappe hebräische Wendung kann als einfache Aussage des Fortgehens oder als zeitliche Einleitung verstanden werden. Die temporale Wiedergabe ergibt im Deutschen einen natürlichen Satzfluss; die Alternative wird in der Fußnote bewahrt.
- source_word: וְהִנֵּה
  choice: sieh
  rationale: Die Aufmerksamkeitspartikel hebt das unmittelbar Folgende hervor. „Sieh“ bewahrt den feierlichen Ton, ohne das altertümlichere „siehe“ zu verlangen.
- source_word: שַׂר יָוָן
  choice: der Fürst von Griechenland
  rationale: יָוָן bezeichnet in diesem Zusammenhang Griechenland beziehungsweise den griechischen Machtbereich. „Griechenland“ macht den Bezug heutigen Lesern unmittelbar verständlich.
- source_word: בָּא
  choice: kommt
  rationale: Das Partizip bezeichnet ein gegenwärtiges oder unmittelbar bevorstehendes Kommen. Im Deutschen kann das Präsens beide Nuancen natürlich tragen.
theological_decisions:
- issue: Identität des „Fürsten von Persien“ und des „Fürsten von Griechenland“
  choice: Im Haupttext steht ohne weitere Festlegung „Fürst“.
  alternative: Ein übernatürlicher, einem Reich zugeordneter Herrscher; alternativ ein menschlicher politischer Machthaber.
  rationale: Der weitere Zusammenhang deutet stark auf übernatürliche Wesen, doch der hebräische Wortlaut dieses Verses bezeichnet sie nicht ausdrücklich als Engel oder Dämonen. „Fürst“ bewahrt diese Spannung und überlässt die nähere Bestimmung dem Kontext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die Satzstruktur bleibt eng am Hebräischen, wird aber dort idiomatisch geglättet, wo eine wörtliche Koordination im Deutschen schwerfällig wäre. „Fürst“ und „sieh“ erhalten die feierliche Bildsprache, ohne unnötig altertümlich zu wirken.
