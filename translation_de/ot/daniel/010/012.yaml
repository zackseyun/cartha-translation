  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: de
  text: 'Da sagte er zu mir: „Fürchte dich nicht, Daniel! Denn vom ersten Tag an, an dem du dein Herz darauf gerichtet hast, zu verstehen und dich vor deinem Gott zu demütigen[a], wurden deine Worte erhört. Und ich bin wegen deiner Worte gekommen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich selbst zu kasteien“. Das hebräische Verb kann in einem religiösen Zusammenhang freiwillige Selbstkasteiung oder demütige Selbstbeugung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf deine Worte hin“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die knappe Verbotsform bewahrt den feierlichen Ton der Zusicherung und ist zugleich in modernem Deutsch gut verständlich.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: vom ersten Tag an
  rationale: Die Wendung gibt den zeitlichen Ausgangspunkt unmittelbar und idiomatisch wieder.
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: du dein Herz darauf gerichtet hast
  rationale: Die Formulierung bewahrt das hebräische Bild und umfasst sowohl innere Entschlossenheit als auch bewusste Aufmerksamkeit.
- source_word: לְהָבִין
  choice: zu verstehen
  rationale: Dies ist die klare, direkte Wiedergabe des Hifil-Infinitivs von בין in diesem Zusammenhang.
- source_word: וּלְהִתְעַנּוֹת
  choice: dich … zu demütigen
  rationale: Die Wiedergabe bezeichnet Daniels freiwillige demütige Haltung vor Gott, ohne eine bestimmte asketische Praxis festzulegen; die mögliche Bedeutung des Sich-Kasteiens oder der Selbstentsagung wird in der Fußnote erhalten.
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: vor deinem Gott
  rationale: Die geläufige deutsche Wendung entspricht dem räumlich-relationalen Ausdruck und passt zum Andachtskontext.
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: wurden deine Worte erhört
  rationale: „Erhört“ macht im Deutschen deutlich, dass es um Gottes Wahrnehmen von Daniels an ihn gerichteten Worten geht, ohne „Worte“ interpretierend durch „Gebete“ zu ersetzen.
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: Und ich bin wegen deiner Worte gekommen
  rationale: „Wegen“ wahrt den im Präfix ב liegenden kausalen beziehungsweise reaktiven Zusammenhang; die responsive Nuance wird als Alternative in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von וּלְהִתְעַנּוֹת als geistliche Handlung Daniels
  choice: dich vor deinem Gott zu demütigen
  alternative: dir vor deinem Gott Entbehrungen aufzuerlegen / dich selbst zu kasteien
  rationale: Der Haupttext beschreibt die geistliche Haltung, ohne eine eng bestimmte Form der Askese vorauszusetzen. Die leiblich-entsagende Bedeutung bleibt in der Fußnote sichtbar.
- issue: Bedeutung von בִּדְבָרֶיךָ am Versende
  choice: wegen deiner Worte
  alternative: auf deine Worte hin
  rationale: Die gewählte Form wahrt den ursächlichen Zusammenhang zwischen Daniels Worten und dem Kommen des Boten, ohne den genauen Ablauf des göttlichen oder angelischen Handelns weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle „Fürchte dich nicht“ und das Herz-Bild bleiben wegen ihres prägnanten und allgemein verständlichen Charakters erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
