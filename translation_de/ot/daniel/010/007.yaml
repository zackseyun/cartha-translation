revisions:
- from: Nur ich, Daniel, sah die Erscheinung; die Männer, die bei mir waren, sahen die Erscheinung nicht. Doch ein großer Schrecken[a] überfiel sie, sodass sie flohen, um sich zu verstecken.[b]
  to: Nur ich, Daniel, sah die Vision; die Männer, die bei mir waren, sahen die Vision nicht. Doch ein großer Schrecken[a] überfiel sie, und sie flohen, um sich zu verstecken.[b]
  rationale: „Vision“ ersetzt „Erscheinung“, um die Kontextbedeutung von מַרְאָה und die wiederholte Gegenüberstellung zwischen Daniel und seinen Begleitern präzise abzubilden. Der zweite Satzteil wird mit koordinierendem „und“ an den hebräischen Erzählfortgang angepasst. Die lexikalische Spannweite von חֲרָדָה und die syntaktische Offenheit des Infinitivs bleiben in den Fußnoten erhalten.
