  text: וְ/רָאִיתִי֩ אֲנִ֨י דָנִיֵּ֤אל לְ/בַדִּ/י֙ אֶת הַ/מַּרְאָ֔ה וְ/הָ/אֲנָשִׁים֙ אֲשֶׁ֣ר הָי֣וּ עִמִּ֔/י לֹ֥א רָא֖וּ אֶת הַ/מַּרְאָ֑ה אֲבָ֗ל חֲרָדָ֤ה גְדֹלָה֙ נָפְלָ֣ה עֲלֵי/הֶ֔ם וַֽ/יִּבְרְח֖וּ בְּ/הֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: de
  text: Nur ich, Daniel, sah die Vision; die Männer, die bei mir waren, sahen die Vision nicht. Doch ein großer Schrecken[a] überfiel sie, und sie flohen, um sich zu verstecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein starkes Zittern“. Das hebräische Wort kann Schrecken, Angst oder Zittern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie flohen und versteckten sich“ beziehungsweise „sie flohen in ein Versteck“. Die hebräische Form kann den Zweck oder die Art ihres Fliehens ausdrücken.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: Nur ich, Daniel, sah
  rationale: Die Stellung von לְבַדִּי hebt hervor, dass ausschließlich Daniel die Erscheinung sah. „Nur ich“ gibt diese Betonung im Deutschen natürlicher wieder als „ich allein“ an späterer Satzposition.
- source_word: הַמַּרְאָה
  choice: die Erscheinung
  rationale: מַרְאָה kann eine Vision, einen Anblick oder eine sichtbare Erscheinung bezeichnen. Im unmittelbaren Zusammenhang ist eine übernatürliche Gestalt zu sehen; „Erscheinung“ bewahrt diese konkrete Bedeutung und lässt den visionären Charakter offen.
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: die Männer, die bei mir waren
  rationale: אֲנָשִׁים bezeichnet hier die männlichen Begleiter Daniels; die schlichte Wiedergabe wahrt Numerus und Bezug.
- source_word: אֲבָל
  choice: Doch
  rationale: Die adversative Konjunktion betont, dass die Begleiter trotz fehlender Sichtwahrnehmung heftig reagierten.
- source_word: חֲרָדָה גְדֹלָה
  choice: ein großer Schrecken
  rationale: חֲרָדָה umfasst Schrecken, Angst und das dadurch ausgelöste Zittern. „Großer Schrecken“ ist im modernen Deutschen natürlich und bewahrt die emotionale Wucht.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: überfiel sie
  rationale: Das hebräische Bild eines Schreckens, der auf Menschen fällt, wird mit „überfiel sie“ idiomatisch und zugleich kraftvoll wiedergegeben.
- source_word: וַיִּבְרְחוּ בְּהֵחָבֵא
  choice: sodass sie flohen, um sich zu verstecken
  rationale: וַיִּבְרְחוּ führt die Handlung fort; der Infinitiv בְּהֵחָבֵא kann Zweck oder begleitende Art des Fliehens ausdrücken. Die Formulierung gibt primär den Zweck wieder, ohne die andere Möglichkeit zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „die Erscheinung“ erhält den deutlichen Gegensatz zwischen Daniel und seinen Begleitern. „Nur ich“ macht die im Hebräischen hervorgehobene Exklusivität unmittelbar verständlich.
