  variant: modern standard German
source:
  edition: WLC
  text: וּ/גְוִיָּת֣/וֹ כְ/תַרְשִׁ֗ישׁ וּ/פָנָ֞י/ו כְּ/מַרְאֵ֤ה בָרָק֙ וְ/עֵינָי/ו֙ כְּ/לַפִּ֣ידֵי אֵ֔שׁ וּ/זְרֹֽעֹתָי/ו֙ וּ/מַרְגְּלֹתָ֔י/ו כְּ/עֵ֖ין נְחֹ֣שֶׁת קָלָ֑ל וְ/ק֥וֹל דְּבָרָ֖י/ו כְּ/ק֥וֹל הָמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: de
  text: Sein Leib war wie ein Tarschisch-Stein[a], sein Gesicht sah aus wie ein Blitz, seine Augen waren wie Feuerfackeln, seine Arme und Füße wie der Glanz polierter Bronze[b], und der Klang seiner Worte war wie das Tosen einer Menschenmenge[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Beryll“, „Topas“, „Chrysolith“ oder ein anderer Edelstein; welcher Stein mit dem hebräischen Wort tarschisch genau gemeint ist, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Oder „wie das Aussehen von blank polierter Bronze“.
    reason: lexical_alternative
  - marker: c
    text: Oder „wie der Lärm einer großen Menge“ beziehungsweise „wie das Brausen einer Menge“.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: sein Leib
  rationale: גְוִיָּה bezeichnet den Körper oder die körperliche Gestalt. „Leib“ ist in einer würdigen visionären Beschreibung natürlich und vermeidet die mögliche moderne Engführung von „Körper“.
- source_word: כְתַרְשִׁישׁ
  choice: wie ein Tarschisch-Stein
  rationale: תַּרְשִׁישׁ bezeichnet hier einen Edelstein, dessen genaue mineralogische Bestimmung unsicher ist. Die transliterierende Wiedergabe bewahrt diese Unsicherheit; mögliche Identifizierungen stehen in der Fußnote.
- source_word: פָנָיו
  choice: sein Gesicht
  rationale: Im Zusammenhang einer Beschreibung sichtbarer Körpermerkmale bedeutet פָּנִים hier am natürlichsten „Gesicht“.
- source_word: כְמַרְאֵה בָרָק
  choice: sah aus wie ein Blitz
  rationale: מַרְאֶה bezeichnet das sichtbare Aussehen. Die Formulierung gibt diesen Aspekt idiomatisch wieder, ohne das Bild abzuschwächen.
- source_word: כְלַפִּידֵי אֵשׁ
  choice: wie Feuerfackeln
  rationale: לַפִּיד bezeichnet eine Fackel oder einen brennenden Feuerbrand. „Feuerfackeln“ bewahrt die konkrete und intensive Bildsprache.
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: seine Arme und Füße
  rationale: זְרוֹעוֹת bezeichnet die Arme; מַרְגְּלוֹת kann Füße beziehungsweise untere Gliedmaßen meinen. „Füße“ ist die naheliegende konkrete Wiedergabe.
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: wie der Glanz polierter Bronze
  rationale: עֵין bezeichnet in dieser Wendung Aussehen oder Glanz; נְחֹשֶׁת ist Bronze beziehungsweise Kupfer, und קָלָל deutet wahrscheinlich auf poliertes, blankes oder glänzendes Metall.
- source_word: קוֹל דְּבָרָיו
  choice: der Klang seiner Worte
  rationale: Die Wiedergabe bewahrt die hebräische Verbindung von קוֹל, „Klang/Stimme“, und דְּבָרִים, „Worte“.
- source_word: כְקוֹל הָמוֹן
  choice: wie das Tosen einer Menschenmenge
  rationale: הָמוֹן kann eine Menge und zugleich deren gewaltiges, unruhiges Geräusch bezeichnen. „Tosen einer Menschenmenge“ vermittelt beide Seiten des Bildes; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Identität der beschriebenen Gestalt
  choice: Die Gestalt wird ausschließlich anhand ihrer visionären Erscheinung beschrieben und im Übersetzungstext nicht näher identifiziert.
  alternative: Deutung als Engel, Theophanie oder vorinkarnierte Erscheinung Christi.
  rationale: Der Vers selbst beschreibt die Gestalt, benennt ihre Identität jedoch nicht ausdrücklich. Die Übersetzung lässt diese theologische Deutungsfrage daher offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher visionärer Bildsprache. Die Satzstruktur folgt der Folge der hebräischen Vergleiche, wird aber idiomatisch formuliert. Fachlich unsichere Edelstein- und Metallbegriffe werden nicht überpräzisiert; alle Fußnotenmarker erscheinen im Haupttext.
