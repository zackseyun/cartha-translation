base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: de
  text: Da hörte ich den Klang seiner Worte[a]. Und als ich den Klang seiner Worte hörte, sank ich in einen tiefen Schlaf, mit dem Gesicht nach unten, zur Erde gerichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Stimme seiner Worte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf meinem Gesicht«; für »sank ich in einen tiefen Schlaf« auch: »lag ich in tiefem Schlaf« oder »war ich wie betäubt eingeschlafen«. Das hebräische Wort bezeichnet einen tiefen, schweren Schlaf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Da hörte ich
  rationale: Das Qal-Wayyiqtol von שׁמע führt die Erzählung weiter; „Da hörte ich“ gibt diese Abfolge in natürlichem, würdigem Deutsch wieder.
- source_word: קוֹל דְּבָרָיו
  choice: den Klang seiner Worte
  rationale: קוֹל kann „Stimme“ oder „Klang“ bedeuten, דְּבָרָיו heißt „seine Worte“. Die Formulierung bewahrt die hebräische Verbindung und ihre leichte Redundanz.
- source_word: וּכְשָׁמְעִי
  choice: Und als ich … hörte
  rationale: כ mit der entsprechenden Verbalform und Suffix hat hier temporalen Sinn; „als ich hörte“ ist klar und idiomatisch.
- source_word: נִרְדָּם
  choice: sank ich in tiefen Schlaf
  rationale: Die Niphal-Form von רדם bezeichnet tiefen, schweren Schlaf. „Sank … in tiefen Schlaf“ bringt den Eintritt in diesen überwältigten Zustand natürlich zum Ausdruck, ohne einen technischen Trancebegriff einzuführen.
- source_word: עַל פָּנַי
  choice: mit dem Gesicht nach unten
  rationale: Die räumliche Wendung bedeutet wörtlich „auf meinem Gesicht“. Die deutsche Formulierung beschreibt verständlich die bäuchlings beziehungsweise vornüber liegende Haltung.
- source_word: וּפָנַי אָרְצָה
  choice: und dem Gesicht zur Erde
  rationale: אָרְצָה ist direktional, „zur Erde/zum Boden“. Die Wiedergabe erhält die nachdrückliche Wiederholung von „Gesicht“ im Hebräischen.
theological_decisions:
- issue: Art von Daniels Zustand während der Vision
  choice: Überwältigtes Niedersinken in tiefen Schlaf
  alternative: Ekstatische Trance
  rationale: נִרְדָּם bezeichnet am natürlichsten tiefen oder schweren Schlaf. Der Vers schildert Daniels körperliche Überwältigung, ohne eindeutig einen technischen Zustand der Ekstase zu benennen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die auffällige Wiederholung von „den Klang seiner Worte“ sowie die Wiederholung von „Gesicht“ bleiben als Merkmale des hebräischen Textes erhalten; die Syntax wird zugleich für heutige Leser verständlich gestaltet.
