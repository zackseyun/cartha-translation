  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: de
  text: Und ich bin gekommen, um dir verständlich zu machen, was deinem Volk in späteren Tagen[a] geschehen wird; denn die Vision bezieht sich auf eine noch künftige Zeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den letzten Tagen“. Der hebräische prophetische Ausdruck verweist auf eine spätere zukünftige Zeit, ohne deren genaue Reichweite festzulegen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „denn die Vision gilt noch für viele Tage“ oder „für ferne Tage“. Der hebräische Ausdruck verweist auf eine noch ausstehende Zeit, ohne deren Dauer eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: Und ich bin gekommen
  rationale: Das Qal-Perfekt 1. Person Singular mit vorangestelltem ו beschreibt die vollzogene Ankunft mit gegenwärtiger Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: לַהֲבִינְךָ
  choice: um dir verständlich zu machen
  rationale: Der Hifil-Infinitiv von בין mit Suffix der 2. Person maskulin Singular hat kausative Bedeutung. Die Formulierung bewahrt diesen Sinn und klingt im modernen Deutschen natürlicher als „dich verstehen zu lassen“.
- source_word: אֵת אֲשֶׁר
  choice: was
  rationale: Objektmarker und Relativpartikel führen den Inhalt dessen ein, was Daniel verstehen soll; „was“ ist die natürliche deutsche Entsprechung.
- source_word: יִקְרָה לְעַמְּךָ
  choice: deinem Volk … geschehen wird
  rationale: קרה mit ל bezeichnet hier, was eine betroffene Personengruppe künftig erlebt. „Geschehen“ bleibt neutraler als das stärker unheilvoll klingende „widerfahren“.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  rationale: Die Wiedergabe erhält die bildhafte prophetische Zeitangabe und deren offene Reichweite, ohne sie auf ein bestimmtes endzeitliches Lehrsystem festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine begründende beziehungsweise erläuternde Aussage ein.
- source_word: עוֹד חָזוֹן לַיָּמִים
  choice: die Vision betrifft noch kommende Tage
  rationale: Die knappe hebräische Nominalkonstruktion ordnet die Vision einer noch ausstehenden Zeit zu. Die deutsche Formulierung macht den zeitlichen Bezug verständlich, ohne eine im Ausdruck nicht eindeutig genannte Dauer festzulegen.
theological_decisions:
- issue: Zeitliche und eschatologische Reichweite von בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  alternative: in der letzten Zeit / in den letzten Tagen
  rationale: Der hebräische prophetische Ausdruck bezeichnet den künftigen Abschluss beziehungsweise Zielpunkt von Entwicklungen, bestimmt aber für sich allein kein detailliertes Endzeitschema. Die wörtlich-nahe Wendung bewahrt diese Spannung.
- issue: Zeitbezug von עוֹד חָזוֹן לַיָּמִים
  choice: die Vision betrifft noch kommende Tage
  alternative: die Vision gilt noch für ferne Tage / für viele Tage
  rationale: Der Satz weist die Vision einer noch künftigen Zeit zu. Ob dabei besonders die zeitliche Ferne oder eine lange Dauer betont wird, bleibt sprachlich offen und wird deshalb nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausative Aussage wird idiomatisch wiedergegeben; die beiden prophetischen Zeitangaben bleiben bewusst offen und werden durch Fußnoten gegen eine vorschnelle zeitliche oder konfessionelle Festlegung abgesichert.
