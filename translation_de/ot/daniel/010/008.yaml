  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: de
  text: Da blieb ich allein zurück und sah diese große Vision[a]. Keine Kraft blieb in mir; mein Glanz wurde an mir zur Entstellung[b], und ich behielt keine Kraft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese große Erscheinung« oder »diesen großen Anblick«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mein Aussehen wurde zur Entstellung«; möglicherweise: »meine Lebenskraft wurde zunichte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: blieb ich allein zurück
  rationale: Gibt sowohl das Zurückbleiben nach dem Fortgehen der anderen als auch die Betonung durch לְבַדִּי natürlich und präzise wieder.
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: diese große Vision
  rationale: מַרְאָה kann eine Erscheinung oder einen Anblick bezeichnen; im Offenbarungskontext von Daniel 10 ist »Vision« die naheliegende Wiedergabe, ohne die lexikalischen Alternativen auszuschließen.
- source_word: כֹּחַ
  choice: Kraft
  rationale: In beiden Vorkommen bezeichnet das Wort Daniels verlorene körperliche Fähigkeit oder Stärke. »Kraft« ist im Deutschen idiomatisch und wahrt die Wiederholung.
- source_word: וְלֹא נִשְׁאַר בִּי כֹּחַ
  choice: Keine Kraft blieb in mir
  rationale: Bewahrt das Bild einer im Inneren verbliebenen Kraft und gibt die vollständige Entkräftung knapp wieder.
- source_word: הוֹדִי
  choice: meine Pracht
  rationale: הוֹד bezeichnet Pracht, Hoheit oder strahlende Erscheinung. »Pracht« erhält den unmittelbaren lexikalischen Gehalt; im Kontext ist Daniels sichtbares, gesundes Erscheinungsbild mitgemeint.
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: verwandelte sich an mir in Verfall
  rationale: Die Wiedergabe hält die Bewegung von נֶהְפַּךְ, den persönlichen Bezug von עָלַי und den zerstörerischen Zustand von מַשְׁחִית fest, ohne die ungewöhnliche Formulierung zu einer eindeutigen medizinischen oder rein äußerlichen Aussage zu glätten.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: und ich behielt keine Kraft
  rationale: עצר bezeichnet hier das Festhalten oder Bewahren von Kraft. Die Formulierung unterscheidet diese aktive Konstruktion von der vorherigen Aussage, dass keine Kraft in ihm blieb.
theological_decisions:
- issue: Bedeutung von הַמַּרְאָה im apokalyptischen Zusammenhang
  choice: Vision
  alternative: Erscheinung oder Anblick
  rationale: Der weitere Zusammenhang ist offenbarend und visionär; dennoch werden die allgemeineren visuellen Bedeutungen in der Fußnote offengehalten.
- issue: Bedeutung von הוֹדִי für Daniels Zustand
  choice: meine Pracht
  alternative: mein Aussehen oder meine Lebenskraft
  rationale: Die Übersetzung wahrt den Grundgedanken von Pracht beziehungsweise strahlender Würde. Dass konkret das Aussehen oder die körperliche Spannkraft gemeint sein kann, bleibt als Alternative sichtbar.
- issue: Art der Veränderung durch לְמַשְׁחִית
  choice: in Verfall
  alternative: ins Verderben oder zu etwas Entstelltem
  rationale: Der hebräische Ausdruck beschreibt einen zerstörerischen oder ruinierten Zustand, ohne dessen genaue körperliche Erscheinungsform festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Kraft« und die ungewöhnliche Spannung in der Wendung über Daniels »Pracht« werden bewusst bewahrt; die Zeichensetzung gliedert die drei Folgen der Vision klar.
