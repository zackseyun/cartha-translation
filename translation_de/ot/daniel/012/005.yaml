source:
  edition: WLC
  text: וְ/רָאִ֨יתִי֙ אֲנִ֣י דָנִיֵּ֔אל וְ/הִנֵּ֛ה שְׁנַ֥יִם אֲחֵרִ֖ים עֹמְדִ֑ים אֶחָ֥ד הֵ֨נָּה֙ לִ/שְׂפַ֣ת הַ/יְאֹ֔ר וְ/אֶחָ֥ד הֵ֖נָּה לִ/שְׂפַ֥ת הַ/יְאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: de
  text: 'Da sah ich, Daniel, und siehe: Zwei andere standen da, der eine diesseits am Ufer des Flusses und der andere jenseits am Ufer des Flusses.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der eine hier am Ufer des Flusses und der andere hier am Ufer des Flusses“; im Zusammenhang sind offenbar die beiden Seiten beziehungsweise Ufer gemeint.'
    reason: Die hebräische Fassung wiederholt in beiden Satzteilen dasselbe Ortsadverb; die Übersetzung gibt dessen kontextuell kontrastive Funktion wieder, ohne die formale Auffälligkeit zu verschweigen.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Da sah ich
  rationale: Das Waw mit der Perfektform führt die Erzählung weiter. „Da sah ich“ gibt sowohl die zeitliche Folge als auch den Sehakt natürlich wieder.
- source_word: אֲנִי דָנִיֵּאל
  choice: ich, Daniel
  rationale: Das ausdrücklich gesetzte Pronomen zusammen mit dem Namen dient der betonten Selbstidentifikation; die deutsche Apposition bewahrt diesen Akzent.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Aufmerksamkeitsformel hebt den neu ins Blickfeld tretenden Anblick hervor. „Und siehe“ bewahrt die anschauliche, feierliche Wirkung.
- source_word: שְׁנַיִם אֲחֵרִים
  choice: zwei andere
  rationale: Die beiden werden von der bereits im Zusammenhang gegenwärtigen Gestalt unterschieden, ohne ihre Identität näher festzulegen.
- source_word: עֹמְדִים
  choice: standen da
  rationale: Das Partizip beschreibt eine andauernde Haltung innerhalb der geschauten Szene; „standen da“ klingt im Deutschen natürlich und szenisch.
- source_word: הֵנָּה
  choice: diesseits … jenseits
  rationale: Die wiederholte Ortsangabe wird durch die parallele Anordnung an den Flussufern kontrastiv verstanden. „Diesseits … jenseits“ macht die gegenüberliegenden Standorte knapp und idiomatisch sichtbar; die ungewöhnliche Wiederholung im Hebräischen wird in der Fußnote vermerkt.
- source_word: לִשְׂפַת הַיְאֹר
  choice: am Ufer des Flusses
  rationale: שָׂפָה bezeichnet hier den Rand beziehungsweise das Ufer. יְאֹר wird kontextgemäß allgemein als „Fluss“ wiedergegeben, ohne ihn unbegründet mit dem Nil gleichzusetzen.
theological_decisions:
- issue: Identität der „zwei anderen“
  choice: neutral als „zwei andere“ wiedergeben
  alternative: „zwei andere Engel“ oder „zwei andere himmlische Wesen“
  rationale: Der hebräische Vers bezeichnet die Gestalten nicht ausdrücklich als Engel oder himmlische Wesen. Eine genauere Identifikation würde mehr festlegen, als der Text selbst sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischer Aufmerksamkeitsformel „und siehe“. Die Satzstruktur bleibt nah am Hebräischen, wird jedoch durch Doppelpunkt und idiomatische Ortsangaben für heutige Leser klar gegliedert.
