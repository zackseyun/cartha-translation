source:
  edition: WLC
  text: אַשְׁרֵ֥י הַֽ/מְחַכֶּ֖ה וְ/יַגִּ֑יעַ לְ/יָמִ֕ים אֶ֕לֶף שְׁלֹ֥שׁ מֵא֖וֹת שְׁלֹשִׁ֥ים וַ/חֲמִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/012.yaml
  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: de
  text: Glücklich ist, wer wartet und 1.335 Tage erreicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesegnet ist, wer ausharrt und bis zu den 1.335 Tagen gelangt.“'
    reason: Lexikalische und idiomatische Alternative zu אַשְׁרֵי, הַמְחַכֶּה und וְיַגִּיעַ לְיָמִים.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die Wendung bezeichnet einen beneidenswerten, von Gottes Wohl geprägten Zustand. „Glücklich ist“ ist im heutigen Deutsch verständlich und bewahrt die Form eines Weisheits- oder Segensspruchs, ohne ausdrücklich eine im Hebräischen nicht genannte Segenshandlung einzuführen.
- source_word: הַמְחַכֶּה
  choice: wer wartet
  rationale: Das Partizip bezeichnet fortdauerndes, erwartungsvolles Warten. Die deutsche Konstruktion mit „wer“ gibt den verallgemeinernden Singular natürlich wieder.
- source_word: וְיַגִּיעַ
  choice: und … erreicht
  rationale: Die Hifil-Form von נגע bedeutet hier, an einen zeitlichen Punkt zu gelangen. „Erreicht“ verbindet sich im Deutschen idiomatisch mit einer Anzahl von Tagen.
- source_word: לְיָמִים
  choice: … Tage
  rationale: Die Präposition לְ markiert zusammen mit dem Verb den erreichten zeitlichen Endpunkt. Im Deutschen wird diese Beziehung natürlich ohne eigene Präposition ausgedrückt.
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: '1.335'
  rationale: Die hebräische Zahlenfolge ergibt 1.335. Die Schreibweise mit Punkt entspricht der deutschen Konvention für Tausendergliederung.
theological_decisions:
- issue: Bedeutung des Glückwunsches innerhalb des apokalyptischen Zeitplans
  choice: Die zeitliche Aussage bleibt ohne Deutung der 1.335 Tage als wörtlicher oder symbolischer Zeitraum stehen.
  alternative: Die Zahl als streng chronologische Zeitspanne oder als symbolische apokalyptische Größe auslegen.
  rationale: Der Vers erklärt den für glücklich, der bis zu dem genannten Zeitpunkt wartet; er erläutert jedoch nicht, wie die Zahl auszulegen ist. Diese Spannung wird in der Übersetzung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form eines Glückwunsches bleibt erhalten; die Fußnote bietet eine stärker traditionelle und formnähere Wiedergabe.
