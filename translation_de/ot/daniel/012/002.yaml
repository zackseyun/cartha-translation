source:
  edition: WLC
  text: וְ/רַבִּ֕ים מִ/יְּשֵׁנֵ֥י אַדְמַת עָפָ֖ר יָקִ֑יצוּ אֵ֚לֶּה לְ/חַיֵּ֣י עוֹלָ֔ם וְ/אֵ֥לֶּה לַ/חֲרָפ֖וֹת לְ/דִרְא֥וֹן עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: de
  text: 'Und viele von denen, die im Staub der Erde schlafen, werden erwachen[a]: die einen zum ewigen Leben, die anderen zu Schmach[b], zu ewigem Abscheu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Scharen von denen, die im Staub der Erde schlafen«. Im Hebräischen steht »viele«, nicht ausdrücklich »alle«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »zu Schande« beziehungsweise »zu Schmähungen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zu ewiger Verachtung«. Vergleiche Jesaja 66,24, wo dasselbe seltene Wort in einem Gerichtszusammenhang steht.'
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: viele
  rationale: Die direkte lexikalische Bedeutung ist »viele«. Die Wiedergabe wahrt die mögliche Spannung hinsichtlich des Umfangs der Auferstehung und erweitert den Ausdruck nicht zu »alle«.
- source_word: מִיְּשֵׁנֵי
  choice: von denen, die ... schlafen
  rationale: Die partizipiale Form bezeichnet Schlafende. Die Formulierung erhält das Bild des Schlafes für den Tod, ohne es auslegend zu ersetzen.
- source_word: אַדְמַת עָפָר
  choice: im Staub der Erde
  rationale: Die Wendung bezeichnet staubigen Erdboden. »Im Staub der Erde« ist im Deutschen natürlich, würdevoll und bewahrt die Bildwelt von Grab und Vergänglichkeit.
- source_word: יָקִיצוּ
  choice: werden erwachen
  rationale: Das Verb bedeutet hier »erwachen«. So bleibt die Entsprechung zum vorausgehenden Schlafbild erhalten; »auferstehen« wäre stärker auslegend.
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: die einen ... die anderen
  rationale: Die idiomatische deutsche Gegenüberstellung gibt den hebräischen Kontrast »diese ... und diese« klar wieder, ohne die Gruppen näher zu bestimmen.
- source_word: לְחַיֵּי עוֹלָם
  choice: zum ewigen Leben
  rationale: »Ewiges Leben« ist eine natürliche und etablierte deutsche Wiedergabe. Die Wiederholung von עוֹלָם wird durch »ewig/ewigem« in beiden Aussagen sichtbar gehalten.
- source_word: חֲרָפוֹת
  choice: Schmach
  rationale: Das pluralische hebräische Wort bezeichnet Schmähungen, Schande oder Entehrung. Das deutsche Kollektivwort »Schmach« gibt die soziale Dimension der Entehrung knapp und idiomatisch wieder.
- source_word: דִרְאוֹן
  choice: Abscheu
  rationale: Das seltene Substantiv bezeichnet Abscheu oder verachtende Abneigung. »Abscheu« bewahrt die starke affektive Bedeutung und passt zur Parallele in Jesaja 66,24.
- source_word: עוֹלָם
  choice: ewig
  rationale: Die Wiedergabe bezeichnet fortdauernde, unbegrenzte Dauer und wahrt durch dieselbe deutsche Wortfamilie die Parallelität beider Vorkommen.
theological_decisions:
- issue: Umfang der mit »viele« bezeichneten Auferstehung
  choice: רַבִּים wird als »viele« wiedergegeben.
  alternative: »alle« als interpretierende inklusive Bedeutung oder »Scharen« zur Betonung der großen Zahl
  rationale: Der hebräische Wortlaut sagt »viele« und legt nicht ausdrücklich »alle« fest. Die Übersetzung bewahrt diese Spannung, statt die Frage nach einer allgemeinen Auferstehung systematisch zu entscheiden.
- issue: Art des negativen Geschicks
  choice: Die beiden Ausdrücke werden getrennt als »zu Schmach, zu ewigem Abscheu« wiedergegeben.
  alternative: »zu Schande und ewiger Verachtung« oder eine Zusammenziehung zu nur einem negativen Begriff
  rationale: Der hebräische Text nennt zwei verbundene, aber unterscheidbare Begriffe. Beide werden erhalten, ohne spätere dogmatische Einzelheiten in den Vers einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Das Schlaf-Erwachen-Bild und die Parallelität der beiden Ausgänge bleiben erhalten. »Die einen ... die anderen« ist gegenüber einem hölzernen »diese ... und diese« idiomatischer. Sämtliche Fußnotenmarker stehen im Haupttext.
