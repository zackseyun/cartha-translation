  source_fidelity: Die Übersetzung gibt die beiden Imperative סְתֹם und חֲתֹם angemessen als „verschließe“ und „versiegle“ wieder. „die Worte“, „das Buch“, „bis zur Zeit des Endes“ sowie „die Erkenntnis wird zunehmen“ entsprechen dem hebräischen Wortlaut und seiner Bildsprache. „Viele werden umherstreifen“ wahrt bei יְשֹׁטְטוּ רַבִּים die bewusst offene Bedeutung zwischen Umherziehen und suchendem Durchforschen.
