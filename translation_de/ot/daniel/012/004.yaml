id: DAN.12.4
reference: Daniel 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: de
  text: Du aber, Daniel, verschließe die Worte und versiegle das Buch[a] bis zur Zeit des Endes. Viele werden umherstreifen[b], und die Erkenntnis wird zunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schriftrolle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Viele werden hin und her laufen“. Das Hebräische kann auch ein suchendes Durchforschen andeuten; dann wäre der Sinn: „Viele werden darin forschen, und die Erkenntnis wird zunehmen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: verschließe
  rationale: Der Imperativ bezeichnet das Verschließen bzw. Unzugänglichmachen. „Verschließe“ bewahrt das konkrete Bild, ohne vollständige Geheimhaltung ausdrücklich vorauszusetzen.
- source_word: הַדְּבָרִים
  choice: die Worte
  rationale: דבר kann „Wort“ oder „Sache“ bedeuten; hier verweist der Ausdruck am ehesten auf die Daniel mitgeteilte Offenbarung.
- source_word: חֲתֹם
  choice: versiegle
  rationale: Der Imperativ bezeichnet das Versiegeln eines Schriftstücks; die konkrete Dokumentmetapher bleibt erhalten.
- source_word: הַסֵּפֶר
  choice: das Buch
  rationale: ספר kann ein Buch, eine Schriftrolle oder allgemein ein Schriftstück bezeichnen. „Buch“ ist im Deutschen die geläufige, hinreichend weite Wiedergabe; „Schriftrolle“ wird in der Fußnote genannt.
- source_word: עַד עֵת קֵץ
  choice: bis zur Zeit des Endes
  rationale: Die formnahe Wendung gibt den zeitlichen Zielpunkt wieder, ohne ihn näher auszudeuten.
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: Viele werden umherstreifen
  rationale: שוטט bezeichnet ein Hin-und-her-Gehen oder Umherziehen und kann im Zusammenhang auch ein suchendes Durchforschen nahelegen. „Umherstreifen“ hält den Grundsinn offen; weitere Möglichkeiten stehen in der Fußnote.
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: und die Erkenntnis wird zunehmen
  rationale: רבה bezeichnet hier eine Zunahme, דעת Wissen oder Erkenntnis. „Erkenntnis“ lässt sowohl allgemeines Wissen als auch ein vertieftes Verstehen zu.
theological_decisions:
- issue: Deutung von יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת
  choice: 'Eine bewusst offene Aussage: Viele werden umherstreifen, und die Erkenntnis wird zunehmen.'
  alternative: Viele laufen buchstäblich hin und her und das allgemeine Wissen wächst; oder viele durchforschen die Offenbarung und ihr Verständnis davon wächst.
  rationale: Der hebräische Wortlaut lässt körperliche Bewegung, suchendes Durchforschen und verschiedene Bezüge von „Erkenntnis“ zu. Die Übersetzung legt weder modernen technischen Fortschritt noch ausschließlich das Studium der Prophetie in den Text hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative „verschließe“ und „versiegle“ bewahren die konkrete Bildsprache. Der Fußnotenmarker [a] steht beim sachlich zugehörigen Ausdruck „Buch“.
