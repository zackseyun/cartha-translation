source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: de
  text: Viele werden sich reinigen, sich weiß machen und geläutert werden[a]. Die Gottlosen aber werden gottlos handeln; keiner von den Gottlosen wird verstehen, doch die Einsichtigen[b] werden verstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Viele werden gereinigt, weiß gemacht und geläutert werden.“ Die ersten beiden hebräischen Verben können auch passiv verstanden werden, obwohl ihre Formen ebenso die im Haupttext wiedergegebene reflexive Nuance zulassen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Weisen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: werden sich reinigen
  rationale: Das Hitpael von ברר lässt eine reflexive beziehungsweise mediale Bedeutung zu. „Sich reinigen“ gibt diese Beteiligung des Subjekts natürlich wieder, ohne eine ausschließlich menschliche oder ausschließlich göttliche Verursachung festzulegen.
- source_word: יִתְלַבְּנוּ
  choice: sich weiß machen
  rationale: Das Hitpael von לבן bewahrt hier das konkrete Bild des Weißwerdens beziehungsweise Weißmachens. Die Form kann reflexiv oder medial-passiv verstanden werden.
- source_word: יִצָּרְפוּ
  choice: geläutert werden
  rationale: Das Niphal von צרף bezeichnet das Läutern wie bei Metall und kann übertragen Reinigung durch Prüfung ausdrücken. Die passive Form entspricht der hebräischen Stammform und erhält das Bild.
- source_word: רַבִּים
  choice: Viele
  rationale: Das substantivierte Adjektiv bezeichnet eine unbestimmte große Mehrzahl; „Viele“ ist knapp und idiomatisch.
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: die Gottlosen werden gottlos handeln
  rationale: Die Wiedergabe erhält die nachdrückliche Verbindung des Verbs und der Personenbezeichnung aus derselben hebräischen Wortwurzel.
- source_word: לֹא יָבִינוּ כָּל רְשָׁעִים
  choice: keiner von den Gottlosen wird verstehen
  rationale: Die hebräische Gesamtheit mit verneintem Verb wird im Deutschen idiomatisch als vollständige Verneinung wiedergegeben.
- source_word: הַמַּשְׂכִּלִים
  choice: die Einsichtigen
  rationale: Das Partizip von שכל bezeichnet Menschen mit Einsicht oder Urteilsvermögen. „Die Einsichtigen“ wahrt den Bezug zum anschließenden Verstehen.
- source_word: יָבִינוּ
  choice: werden verstehen
  rationale: בין bedeutet hier „verstehen“ beziehungsweise „Einsicht haben“; die direkte Wiedergabe macht den Kontrast zwischen Gottlosen und Einsichtigen deutlich.
theological_decisions:
- issue: Ob die ersten drei Verben als passives göttliches Handeln oder als reflexiver beziehungsweise selbstbeteiligter Vorgang wiederzugeben sind
  choice: Die ersten beiden Verben werden im Haupttext reflexiv, das dritte passiv wiedergegeben.
  alternative: Viele werden gereinigt, weiß gemacht und geläutert werden.
  rationale: Die ersten beiden Verben stehen im Hitpael und erlauben reflexive oder mediale Nuancen; das dritte steht im Niphal und ist natürlicherweise passiv beziehungsweise medial. Die Übersetzung bildet diese unterschiedliche grammatische Gestalt ab, ohne einen ungenannten Handelnden ausdrücklich einzusetzen.
- issue: Ob הַמַּשְׂכִּלִים allgemein als „die Weisen“ oder enger als Menschen mit Einsicht bezeichnet werden soll
  choice: die Einsichtigen
  alternative: die Weisen
  rationale: „Die Einsichtigen“ hält die lexikalische Verbindung zum Verb „verstehen“ aufrecht und vermeidet es, den Ausdruck vorschnell einer umfassenderen Weisheitskategorie zuzuordnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Bild des Weißmachens und die Läuterungsmetapher bleiben erhalten. Die bewusst wiederholte Wortwurzel in „Gottlosen … gottlos“ bildet den Nachdruck des Hebräischen ab.
