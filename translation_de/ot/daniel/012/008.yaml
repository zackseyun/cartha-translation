id: DAN.12.8
reference: Daniel 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: de
  text: 'Ich hörte es zwar, verstand es aber nicht. Da fragte ich: »Mein Herr, was wird das Ende von all dem sein?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich
  rationale: Das selbstständige Pronomen hebt Daniels eigene Perspektive hervor. Im Deutschen vermittelt »Ich hörte es zwar …« den leichten Kontrast idiomatisch, ohne ein schwerfälliges »Was mich betrifft«.
- source_word: שָׁמַעְתִּי
  choice: hörte es
  rationale: Das Qal von שׁמע bedeutet hier »hören«. Das ergänzte »es« stellt im Deutschen den Bezug auf das zuvor Gesagte natürlich her.
- source_word: וְלֹא אָבִין
  choice: verstand es aber nicht
  rationale: בין bezeichnet Verstehen oder Erfassen. Die Konstruktion »zwar … aber« bildet den sachlichen Gegensatz zwischen Hören und Nichtverstehen ab.
- source_word: וָאֹמְרָה
  choice: Da fragte ich
  rationale: Wörtlich steht »da sagte ich«. Da die folgende Äußerung eine direkte Frage ist, gibt »fragte ich« die Sprechhandlung in natürlichem Deutsch genau wieder; »da« wahrt den Fortgang der Erzählung.
- source_word: אֲדֹנִי
  choice: Mein Herr
  rationale: Die Form ist eine respektvolle Anrede an die himmlische Gestalt. »Mein Herr« bewahrt die Höflichkeit, ohne die Anrede ausdrücklich mit dem Gottesnamen gleichzusetzen.
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: was wird das Ende von all dem sein?
  rationale: אַחֲרִית kann »Ende«, »Ausgang« oder »Ergebnis« bezeichnen. »das Ende von all dem« bleibt nahe an der apokalyptischen, zeitlich ausgerichteten Formulierung und ist zugleich verständliches heutiges Deutsch.
theological_decisions:
- issue: Bezug von אֲדֹנִי
  choice: 'Respektvolle Anrede an die himmlische Gestalt: »Mein Herr«'
  alternative: 'Direkte Anrede Gottes: »Herr«'
  rationale: Der unmittelbare Zusammenhang legt eine Anrede an den offenbarenden Gesprächspartner nahe, bestimmt dessen Identität aber nicht ausdrücklich. Die Wiedergabe vermeidet daher eine stärkere theologische Festlegung.
- issue: Bedeutung von אַחֲרִית
  choice: »Ende« als zeitlicher Abschluss bzw. endgültiger Ausgang
  alternative: »Ausgang« oder »Ergebnis«
  rationale: »Ende« bewahrt sowohl die zeitliche als auch die zielbezogene Spannung des hebräischen Begriffs, ohne den Vers auf bloße Folgen oder ein bestimmtes Endzeitschema festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung »zwar … aber« macht den im Hebräischen kontextuell angelegten Gegensatz natürlich sichtbar. »Mein Herr« bleibt als respektvolle, nicht ausdrücklich göttliche Anrede erhalten.
