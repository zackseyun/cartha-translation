id: DAN.12.11
reference: Daniel 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מֵ/עֵת֙ הוּסַ֣ר הַ/תָּמִ֔יד וְ/לָ/תֵ֖ת שִׁקּ֣וּץ שֹׁמֵ֑ם יָמִ֕ים אֶ֖לֶף מָאתַ֥יִם וְ/תִשְׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: de
  text: Und von der Zeit an, da das regelmäßige Opfer[a] beseitigt und der Gräuel, der Verwüstung bringt,[b] aufgestellt wird, sind es 1.290 Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „das tägliche Opfer“. Das hebräische תָּמִיד ist hier eine kultische Kurzbezeichnung für das regelmäßige oder fortwährende Tempelopfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der Gräuel der Verwüstung“ oder „der verwüstende Gräuel“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: Und von der Zeit an
  rationale: Die Präposition מִן mit עֵת bezeichnet den zeitlichen Ausgangspunkt; das vorangestellte וּ verbindet den Satz mit dem vorherigen Zusammenhang.
- source_word: הוּסַר
  choice: beseitigt
  rationale: Der Hofal von סור bezeichnet ein passives Entfernen. „Beseitigt“ ist im Zusammenhang mit der Aufhebung des regelmäßigen Tempelopfers klar und angemessen.
- source_word: הַתָּמִיד
  choice: das regelmäßige Opfer
  rationale: תָּמִיד steht hier als kultische Kurzbezeichnung für das regelmäßig beziehungsweise fortwährend dargebrachte Tempelopfer. Die Wiedergabe vermeidet die im Hebräischen nicht ausdrücklich enthaltene nähere Bestimmung als Brandopfer.
- source_word: וְלָתֵת
  choice: und … aufgestellt wird
  rationale: Wörtlich steht ein Infinitiv mit der Bedeutung „und zu geben/setzen“. Im Deutschen wird die zum ersten Zeitausdruck parallele Handlung idiomatisch als passives Aufstellen wiedergegeben.
- source_word: שִׁקּוּץ שֹׁמֵם
  choice: der Gräuel, der Verwüstung bringt
  rationale: שִׁקּוּץ bezeichnet etwas Abscheuliches, besonders im Zusammenhang mit Götzendienst oder Entweihung. Die Relativsatzkonstruktion gibt die wirkende Kraft des Partizips שֹׁמֵם verständlich wieder.
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: sind es 1.290 Tage
  rationale: 'Das Hebräische nennt knapp die Zeitspanne: „Tage, eintausendzweihundertneunzig“. „Sind es“ vervollständigt den deutschen Satz, ohne die Aussage näher auszudeuten.'
theological_decisions:
- issue: Wiedergabe von הַתָּמִיד im apokalyptischen Tempelkontext
  choice: das regelmäßige Opfer
  alternative: das tägliche Opfer; das beständige Brandopfer
  rationale: Der hebräische Ausdruck ist elliptisch und verweist auf den fortlaufenden Tempeldienst. „Das regelmäßige Opfer“ bewahrt diesen Bezug, ohne eine im Vers nicht ausdrücklich genannte Opferart festzulegen. Die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Wiedergabe von שִׁקּוּץ שֹׁמֵם
  choice: der Gräuel, der Verwüstung bringt
  alternative: der Gräuel der Verwüstung; der verwüstende Gräuel
  rationale: Das Partizip שֹׁמֵם kann als wirkende oder charakterisierende Bestimmung zu שִׁקּוּץ verstanden werden. Der Relativsatz wahrt diese aktive Kraft; die traditionsreiche Genitivform und die knappe adjektivische Form bleiben als Alternativen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung wahrt den Anschluss an den vorherigen Zusammenhang und bleibt zugleich gut verständlich. Die traditionsreichen Formulierungen werden in den Fußnoten erhalten, ohne die Mehrdeutigkeit des Hebräischen im Haupttext vorschnell festzulegen.
