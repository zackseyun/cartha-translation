source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: de
  text: 'Da hörte ich den Mann, der in Leinen gekleidet war und sich über dem Wasser des Stromes befand. Er erhob seine rechte und seine linke Hand zum Himmel und schwor bei dem, der ewig lebt: Es wird eine Zeit, Zeiten und eine halbe Zeit dauern[a]. Wenn die Zerschmetterung der Macht des heiligen Volkes abgeschlossen ist[b], werden alle diese Dinge vollendet sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „eine festgesetzte Zeit, festgesetzte Zeiten und eine Hälfte“. Viele verstehen dies als „ein Jahr, zwei Jahre und ein halbes Jahr“.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: „die Hand des heiligen Volkes“. „Hand“ bezeichnet hier wahrscheinlich Macht oder Kraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: in Leinen gekleidet
  rationale: Gibt die passive Partizipialkonstruktion natürlich wieder und bewahrt das konkrete Bild des Leinengewandes.
- source_word: הַיְאֹר
  choice: der Strom
  rationale: Bezeichnet hier das große Gewässer der Vision, ohne es unnötig mit dem Nil gleichzusetzen; „Strom“ passt zudem zum gehobenen visionären Register.
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: Er erhob seine rechte und seine linke Hand
  rationale: Bewahrt die ausdrückliche Nennung beider Hände und damit die feierliche Schwurgeste.
- source_word: בְּחֵי הָעוֹלָם
  choice: bei dem, der ewig lebt
  rationale: Gibt die hebräische Schwurformel verständlich und würdevoll wieder, ohne den göttlichen Bezug weiter auszudeuten.
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: eine Zeit, Zeiten und eine halbe Zeit
  rationale: Bewahrt die rätselhafte apokalyptische Zeitformel und legt keine bestimmten chronologischen Einheiten fest.
- source_word: וּכְכַלּוֹת
  choice: Sobald ... vollständig ... ist
  rationale: Gibt den temporalen Sinn des Infinitivs mit כְּ wieder; „vollständig“ bringt die Bedeutung des Vollendens beziehungsweise Zu-Ende-Bringens zum Ausdruck.
- source_word: נַפֵּץ יַד
  choice: die Macht ... vollständig zerschmettert
  rationale: „Hand“ steht metonymisch für Macht oder Kraft; „zerschmettert“ bewahrt die Gewalt des Verbs נַפֵּץ.
- source_word: עַם קֹדֶשׁ
  choice: das heilige Volk
  rationale: Ist eine direkte, verständliche Wiedergabe für das Gott geweihte Volk.
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: wird dies alles vollendet sein
  rationale: Drückt aus, dass die angekündigten Geschehnisse ihr bestimmtes Ende beziehungsweise ihre Vollendung erreichen.
theological_decisions:
- issue: Deutung der apokalyptischen Zeitformel לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: „eine Zeit, Zeiten und eine halbe Zeit“ ohne Festlegung auf genaue Zeiteinheiten
  alternative: „eine festgesetzte Zeit, festgesetzte Zeiten und eine Hälfte“ oder „ein Jahr, zwei Jahre und ein halbes Jahr“
  rationale: Der hebräische Wortlaut bestimmt die Einheiten an dieser Stelle nicht ausdrücklich. Die formnahe Wiedergabe erhält die genuine Mehrdeutigkeit.
- issue: Metonymische Bedeutung von יַד in נַפֵּץ יַד עַם קֹדֶשׁ
  choice: „die Macht des heiligen Volkes“
  alternative: „die Hand des heiligen Volkes“ oder „die Kraft des heiligen Volkes“
  rationale: „Macht“ vermittelt die hebräische Metonymie im modernen Deutschen, während „zerschmettert“ die Härte der Aussage über das Leiden des Volkes bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit visionär-feierlichem Ton. Die Satzfolge wurde für gute deutsche Lesbarkeit leicht gegliedert; rätselhafte Zeitangabe und theologische Spannung bleiben erhalten.
