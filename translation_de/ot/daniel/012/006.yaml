  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: de
  text: 'Und er sagte zu dem in Leinen gekleideten Mann, der über dem Wasser des Flusses war: „Wie lange noch bis zum Ende der Wunder[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der außergewöhnlichen Ereignisse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. „Und“ bewahrt die hebräische Verknüpfung, ohne eine genauere zeitliche Beziehung einzutragen.
- source_word: לָאִישׁ לְבוּשׁ הַבַּדִּים
  choice: zu dem in Leinen gekleideten Mann
  rationale: Der Artikel kennzeichnet einen bereits bekannten Mann. לְבוּשׁ bezeichnet seinen bekleideten Zustand, und הַבַּדִּים verweist auf Leinen beziehungsweise Leinengewänder.
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: der über dem Wasser des Stromes war
  rationale: מִמַּעַל bezeichnet eine Lage oberhalb von etwas. „Strom“ passt zur visionären Szene und vermeidet die nicht erforderliche Festlegung von יְאֹר auf den Nil.
- source_word: עַד מָתַי
  choice: Wie lange noch bis
  rationale: Die knappe deutsche Frage gibt die verbleibende Dauer bis zu dem genannten Endpunkt natürlich wieder und bewahrt zugleich die elliptische Form des Hebräischen.
- source_word: קֵץ
  choice: Ende
  rationale: קֵץ bezeichnet hier den Abschluss oder Endpunkt der in den Blick genommenen Geschehnisse.
- source_word: הַפְּלָאוֹת
  choice: der außergewöhnlichen Ereignisse
  rationale: Das Wort bezeichnet staunenerregende, außerordentliche Vorgänge oder Taten. Die gewählte Formulierung ist im heutigen Deutsch verständlich und vermeidet den möglichen positiven Beiklang von „wunderbar“.
theological_decisions:
- issue: Identität des Sprechers und des in Leinen gekleideten Mannes
  choice: Die schlichte Bezugnahme „er“ und die Beschreibung „der in Leinen gekleidete Mann“ bleiben ohne weitere Identifizierung erhalten.
  alternative: Den Sprecher ausdrücklich als Engel oder den in Leinen gekleideten Mann als Christus beziehungsweise als eine andere bestimmte himmlische Gestalt identifizieren.
  rationale: Der Vers selbst benennt diese Gestalten nicht näher. Eine ausdrückliche Identifizierung würde eine theologische Deutung in den Text eintragen, die der hebräische Wortlaut offenlässt.
- issue: Charakter der הַפְּלָאוֹת
  choice: „außergewöhnliche Ereignisse“
  alternative: „Wundertaten“
  rationale: Der Ausdruck kann sowohl die erstaunlichen Geschehnisse insgesamt als auch machtvolle Wundertaten bezeichnen. Die Hauptübersetzung hält den Bezug weit; die Fußnote bewahrt die engere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Frageform bewahrt den visionären Ton und die Ellipse des hebräischen Satzes, ohne die beteiligten Gestalten oder die außergewöhnlichen Vorgänge über den Wortlaut hinaus zu bestimmen.
