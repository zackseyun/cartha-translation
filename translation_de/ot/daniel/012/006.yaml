- from: 'Und er sagte zu dem in Leinen gekleideten Mann, der über dem Wasser des Stromes war: „Wie lange noch bis zum Ende der außergewöhnlichen Ereignisse[a]?“'
  to: 'Und er sagte zu dem in Leinen gekleideten Mann, der über dem Wasser des Flusses war: „Wie lange noch bis zum Ende der Wunder[a]?“'
  rationale: Die Revision ersetzt die abschwächende, abstrakte Umschreibung von הַפְּלָאוֹת durch „Wunder“ und bewahrt deren mögliche weitere Bedeutung in der Fußnote. „Fluss“ ist gegenüber „Strom“ die neutralere, idiomatischere Wiedergabe von יְאֹר in dieser nicht auf den Nil festgelegten Vision. Alle Figurenreferenten und die zeitliche Frage bleiben bewusst offen.
