  rationale: Die Hauptfassung verwendet für מַצְדִּיקֵי הָרַבִּים die im Deutschen natürlichere, kontextuell passende kausative Wiedergabe „die die Vielen zur Gerechtigkeit führen“. Die Fußnote erhält die formnähere Lesart „gerecht machen“ sowie die mögliche deklarative Nuance, ohne eine dogmatische Deutung festzulegen. Alle übrigen Formulierungen und Fußnotenanker bleiben erhalten.
