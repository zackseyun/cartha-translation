  text: וְ/הַ֨/מַּשְׂכִּלִ֔ים יַזְהִ֖רוּ כְּ/זֹ֣הַר הָ/רָקִ֑יעַ וּ/מַצְדִּיקֵי֙ הָֽ/רַבִּ֔ים כַּ/כּוֹכָבִ֖ים לְ/עוֹלָ֥ם וָ/עֶֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: de
  text: Und die Einsichtigen[a] werden leuchten wie der Glanz des Himmelsgewölbes[b], und die, die die Vielen zur Gerechtigkeit führen[c], wie die Sterne für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Weisen“ beziehungsweise „die Verständigen“.'
    reason: lexical_alternative
  - marker: b
    text: Das „Himmelsgewölbe“ ist die weit ausgespannte Wölbung des Himmels; traditionell wird auch „Feste“ gesagt.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die die Vielen gerecht machen“ beziehungsweise „die die Vielen für gerecht erklären“. Das Hebräische kann auch im Sinn von „die die Vielen zur Gerechtigkeit führen“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: die Einsichtigen
  rationale: Das Partizip von שׂכל bezeichnet Menschen, die von Einsicht und Verständnis geprägt sind. „Die Einsichtigen“ bewahrt diesen Sinn knapp und in natürlichem modernem Deutsch.
- source_word: יַזְהִרוּ
  choice: werden leuchten
  rationale: Der Hifil von זהר bezeichnet hier das Leuchten oder Strahlen; „werden leuchten“ entspricht dem Bild und klingt idiomatisch.
- source_word: כְּזֹהַר
  choice: wie der Glanz
  rationale: זֹהַר bedeutet „Glanz“ oder „Strahlen“. „Glanz“ vermeidet eine unnötige Wiederholung von „leuchten“.
- source_word: הָרָקִיעַ
  choice: des Himmelsgewölbes
  rationale: רָקִיעַ bezeichnet die ausgebreitete Wölbung des Himmels. „Himmelsgewölbe“ ist verständlich, würdevoll und genauer als das allgemeinere „Himmel“.
- source_word: וּמַצְדִּיקֵי
  choice: die, die … gerecht machen
  rationale: Das Hifil-Partizip von צדק hat ursächliche Kraft und kann „gerecht machen“, „für gerecht erklären“ oder „zur Gerechtigkeit führen“ bedeuten. Die Hauptfassung gibt die Form möglichst unmittelbar wieder, ohne die Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: הָרַבִּים
  choice: die Vielen
  rationale: Der bestimmte Artikel wird beibehalten; „die Vielen“ wahrt zudem das besondere Gewicht der Wendung im apokalyptischen Zusammenhang.
- source_word: כַּכּוֹכָבִים
  choice: wie die Sterne
  rationale: Dies ist eine unmittelbare und natürliche Wiedergabe des Vergleichs.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste Doppelformel verstärkt die Vorstellung unbegrenzter Dauer; „für immer und ewig“ erhält diese Nachdrücklichkeit.
theological_decisions:
- issue: Bedeutung von מַצְדִּיקֵי הָרַבִּים
  choice: die, die die Vielen gerecht machen
  alternative: die, die die Vielen zur Gerechtigkeit führen; die, die die Vielen für gerecht erklären
  rationale: Die ursächliche Verbform lässt sowohl eine bewirkende beziehungsweise verwandelnde als auch eine erklärende oder anleitende Nuance zu. Die Hauptfassung bleibt nah an der hebräischen Formulierung; die Fußnote bewahrt die echte theologische und lexikalische Spannung, ohne sie konfessionell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem poetischen Parallelismus des Hebräischen. „Gerecht machen“ ist bewusst quellennah und wird wegen seiner semantischen und theologischen Mehrdeutigkeit durch eine Fußnote erläutert.
