id: DAN.12.13
reference: Daniel 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֖ה לֵ֣ךְ לַ/קֵּ֑ץ וְ/תָנ֛וּחַ וְ/תַעֲמֹ֥ד לְ/גֹרָלְ/ךָ֖ לְ/קֵ֥ץ הַ/יָּמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: de
  text: Du aber, geh dem Ende entgegen[a]. Du wirst ruhen[b] und am Ende der Tage[c] an dem dir zugelosten Platz stehen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geh bis zum Ende«.'
    reason: Die Präposition ל kann hier die Bewegung auf das Ende hin oder die zeitliche Erstreckung bis zum Ende ausdrücken.
  - marker: b
    text: Das Ruhen meint im Zusammenhang wahrscheinlich Daniels Tod vor der abschließenden Vollendung.
    reason: Die wahrscheinliche Implikation wird erläutert, ohne sie in den Haupttext einzutragen.
  - marker: c
    text: »Am Ende der Tage« ist eine endzeitliche Wendung; vergleiche Daniel 12,2.
    reason: Der Querverweis verdeutlicht den literarischen Zusammenhang.
  - marker: d
    text: 'Wörtlicher: »zu deinem Los stehen«. Gemeint sein kann, dass Daniel seinen zugelosten Anteil oder sein Erbteil erhält; im Zusammenhang kann »stehen« zugleich an die Auferstehung denken lassen.'
    reason: Die Fußnote bewahrt sowohl das Los-Bild als auch die mögliche Auferstehungsnuance, ohne eine davon dogmatisch festzuschreiben.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Das vorangestellte selbstständige Pronomen hebt Daniel gegenüber dem zuvor Gesagten hervor; »aber« gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: לֵךְ לַקֵּץ
  choice: geh dem Ende entgegen
  rationale: הלך ist die Aufforderung »geh«, und לַקֵּץ bezeichnet die Ausrichtung auf einen Endpunkt. »Dem Ende entgegen« bewahrt diese Bewegungsrichtung, ohne vorschnell festzulegen, ob ausschließlich Daniels Lebensende oder die endzeitliche Vollendung gemeint ist.
- source_word: וְתָנוּחַ
  choice: Du wirst ruhen
  rationale: נוח bedeutet »ruhen«. Der Zukunftssinn passt zur Abfolge nach dem Imperativ; der wahrscheinliche Bezug auf Daniels Tod bleibt als Implikation erhalten, wird aber nicht in den Wortlaut hineingetragen.
- source_word: וְתַעֲמֹד
  choice: stehen
  rationale: עמד bedeutet wörtlich »stehen«. Im Zusammenhang von Daniel 12 kann das Wort an Auferstehung und endgültige Bestätigung denken lassen; die Übersetzung bewahrt jedoch bewusst das hebräische Bild.
- source_word: לְגֹרָלְךָ
  choice: an dem dir zugelosten Platz
  rationale: גּוֹרָל bezeichnet zunächst das Los und daraus folgend den zugelosten Anteil oder Platz. Die Formulierung ist im Deutschen verständlich und verbindet das Stehen mit der von Gott zugeteilten Bestimmung, ohne sie näher zu definieren.
- source_word: לְקֵץ הַיָּמִין
  choice: am Ende der Tage
  rationale: Die Wendung entspricht eng dem hebräischen Wortlaut und wahrt ihren endzeitlichen Klang, ohne das bezeichnete Geschehen über den Text hinaus auszudeuten.
theological_decisions:
- issue: Bezeichnet וְתָנוּחַ ausdrücklich Daniels Tod?
  choice: Im Haupttext steht nur »Du wirst ruhen«.
  alternative: »Du wirst im Tod ruhen« oder »Du wirst sterben und ruhen«
  rationale: Der Zusammenhang legt Daniels Tod vor der abschließenden Vollendung nahe, doch das Verb selbst sagt lediglich »ruhen«. Die Deutung wird daher in der Fußnote genannt, nicht in den Haupttext eingefügt.
- issue: Bezeichnet וְתַעֲמֹד ausdrücklich die Auferstehung?
  choice: Das Verb wird mit »stehen« wiedergegeben.
  alternative: »auferstehen« oder »wieder aufstehen«
  rationale: Daniel 12,2 schafft einen deutlichen Auferstehungshorizont. Dennoch bedeutet עמד hier lexikalisch »stehen«; die mögliche Auferstehungsbedeutung soll hörbar bleiben, aber nicht zur einzigen ausdrücklich formulierten Lesart werden.
- issue: Was bezeichnet גֹרָלְךָ?
  choice: »der dir zugeloste Platz«
  alternative: »dein Los«, »dein zugeloster Anteil« oder »dein Erbteil«
  rationale: Das Wort kann einen durch das Los bestimmten Anteil, Platz oder ein Erbteil bezeichnen. »Zugeloster Platz« passt syntaktisch zu »stehen« und vermeidet eine zu enge Festlegung auf materiellen Besitz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze bewahren den feierlichen Abschlusscharakter. »Dem Ende entgegen« und »zugeloster Platz« sind verständlich, ohne die Mehrdeutigkeit des Hebräischen unnötig aufzulösen.
