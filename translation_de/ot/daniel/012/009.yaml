source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לֵ֣ךְ דָּנִיֵּ֑אל כִּֽי סְתֻמִ֧ים וַ/חֲתֻמִ֛ים הַ/דְּבָרִ֖ים עַד עֵ֥ת קֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/009.yaml
  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
translation:
  language: de
  text: 'Da sagte er: »Geh, Daniel! Denn die Worte sind verschlossen[a] und versiegelt bis zur Zeit des Endes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verborgen“. Im Hebräischen beschreiben zwei passive Partizipien die Worte als verschlossen und versiegelt und damit bis zur festgesetzten Zeit des Endes als unzugänglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da sagte er“ gibt die Abfolge im modernen Deutschen natürlich wieder.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך ist knapp und direkt. Im Deutschen trägt „Geh“ im Zusammenhang ausreichend den Sinn, dass Daniel seines Weges gehen soll.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für den vorausgehenden Befehl ein. „Denn“ bewahrt diesen kausalen Zusammenhang idiomatisch.
- source_word: סְתֻמִים
  choice: verschlossen
  rationale: Das passive Partizip von סתם bezeichnet die Worte als geschlossen und damit vorläufig unzugänglich. „Verschlossen“ bildet diese konkrete Bildsprache ab, ohne sie auf bloßes Nichtverstehen zu verengen.
- source_word: וַחֲתֻמִים
  choice: und versiegelt
  rationale: Das passive Partizip von חתם verwendet das Bild eines versiegelten Schriftstücks. „Versiegelt“ ist die direkte und im Deutschen natürliche Entsprechung.
- source_word: הַדְּבָרִים
  choice: die Worte
  rationale: דבר kann „Wort“ oder „Sache“ bedeuten. Hier verweist der Ausdruck auf die übermittelte Offenbarung; „die Worte“ wahrt die sprachliche Form und den Zusammenhang.
- source_word: עַד עֵת קֵץ
  choice: bis zur Zeit des Endes
  rationale: Die formnahe Wiedergabe erhält den für Daniel charakteristischen Ausdruck und lässt offen, wie diese Endzeit chronologisch näher zu bestimmen ist.
theological_decisions:
- issue: Eschatologische Bedeutung von עֵת קֵץ
  choice: Zeit des Endes
  alternative: Endzeit
  rationale: „Zeit des Endes“ bewahrt die markante hebräische Wortfügung und ihr eschatologisches Gewicht, ohne eine bestimmte Chronologie oder Lehrdeutung festzulegen.
- issue: Zugänglichkeit der Offenbarungsworte
  choice: verschlossen und versiegelt
  alternative: verborgen und versiegelt
  rationale: Die konkrete Doppelmetapher bleibt erhalten. Der Text sagt, dass die Worte bis zur Zeit des Endes verschlossen und versiegelt sind, ohne ausdrücklich festzulegen, ob dies nur ihre Deutung, ihre Bekanntmachung oder beides betrifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich; die zentrale Bildsprache des Verschließens und Versiegelns sowie die theologische Spannung des Ausdrucks „Zeit des Endes“ werden bewahrt.
