source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: de
  text: Und zu jener Zeit wird Michael, der große Fürst, der über den Söhnen deines Volkes steht[a], sich erheben. Es wird eine Zeit der Not[b] sein, wie sie seit dem Entstehen einer Nation bis zu jener Zeit nie dagewesen ist. Und zu jener Zeit wird dein Volk entkommen[c], jeder, der im Buch verzeichnet gefunden wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der für die Söhne deines Volkes einsteht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Zeit der Bedrängnis“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird gerettet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: wird sich erheben
  rationale: עמד bedeutet grundlegend „stehen“, kann hier aber das entschlossene Auftreten Michaels bezeichnen. „Sich erheben“ bewahrt die dynamische Nuance, ohne die Art seines Handelns näher festzulegen.
- source_word: הַשַּׂר הַגָּדוֹל
  choice: der große Fürst
  rationale: שׂר bezeichnet einen Fürsten, Herrscher oder ranghohen Amtsträger. „Fürst“ entspricht dem himmlisch-politischen Sprachgebrauch im Danielbuch.
- source_word: הָעֹמֵד עַל
  choice: der über … steht
  rationale: Die Wendung wird formal bildhaft wiedergegeben. Sie kann Aufsicht, Schutz oder stellvertretendes Eintreten ausdrücken; die Alternative „der für … einsteht“ wird in der Fußnote genannt.
- source_word: בְּנֵי עַמֶּךָ
  choice: den Söhnen deines Volkes
  rationale: Die wörtliche männliche Form „Söhne“ bleibt erhalten, obwohl die hebräische Wendung kollektiv Angehörige des Volkes bezeichnen kann.
- source_word: עֵת צָרָה
  choice: eine Zeit der Not
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Drangsal. „Not“ ist würdig, verständlich und ausreichend stark, ohne altertümlich zu wirken.
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי
  choice: wie es sie noch nie gegeben hat, seit es ein Volk gibt
  rationale: Die Formulierung folgt dem zeitlichen Vergleich des Hebräischen und vermeidet die interpretierende Verallgemeinerung „seit es Völker gibt“.
- source_word: יִמָּלֵט
  choice: wird … entkommen
  rationale: Das Nifal von מלט kann „entkommen“ oder „gerettet/befreit werden“ bedeuten. „Entkommen“ hält zunächst die konkrete Bedeutung fest; die passive Alternative wird als Fußnote bewahrt.
- source_word: כָּל הַנִּמְצָא כָּתוּב
  choice: jeder, der … verzeichnet gefunden wird
  rationale: „Verzeichnet“ gibt das Geschriebensein im Buch im Deutschen natürlich wieder, während „gefunden wird“ die hebräische Konstruktion sichtbar hält.
- source_word: בַּסֵּפֶר
  choice: im Buch
  rationale: סֵפֶר kann Buch oder Schriftrolle bedeuten. „Buch“ ist hier die übliche und kontextuell passende Wiedergabe.
theological_decisions:
- issue: Art von Michaels Handeln
  choice: Michael „wird sich erheben“ und tritt damit als himmlischer Fürst handelnd auf.
  alternative: Michael „wird dastehen“ oder „wird auftreten“.
  rationale: Der Kontext legt ein entschlossenes Eingreifen nahe, doch der Vers erklärt weder dessen genaue Form noch weitergehende angelologische Einzelheiten.
- issue: Bedeutung der Rettung in יִמָּלֵט
  choice: „wird entkommen“ stellt das Durchkommen aus der Not in den Vordergrund.
  alternative: „wird gerettet werden“ kann ein ausdrücklicheres göttliches Rettungshandeln bezeichnen.
  rationale: Beide Nuancen sind lexikalisch möglich. Der Haupttext vermeidet es, die konkrete Aussage vorschnell auf eine bestimmte soteriologische Deutung festzulegen.
- issue: Beziehung Michaels zum Volk
  choice: „der über den Söhnen deines Volkes steht“ bewahrt das räumlich-hierarchische Bild.
  alternative: „der für die Söhne deines Volkes einsteht“ betont Schutz oder Vertretung.
  rationale: Die hebräische Präposition על lässt im Zusammenhang Schutz und Zuständigkeit erkennen, ohne dass die genaue Beziehung ausdrücklich definiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „zu jener Zeit“ bildet die Struktur des Hebräischen ab. Das anfängliche וּ und das spätere וּ werden koordinierend wiedergegeben; vor dem abschließenden Satz steht „Doch“, um den inhaltlichen Gegensatz zwischen beispielloser Not und dem Entkommen des Volkes natürlich auszudrücken.
