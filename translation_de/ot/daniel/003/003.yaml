  register: Modernes, würdevolles Standarddeutsch. Die formelle Reihung der Verwaltungstitel und die Wiederholung am Versende bleiben erhalten. Seltene Amtstitel werden nicht durch vermeintlich präzisere moderne Funktionsbezeichnungen eingeebnet.
