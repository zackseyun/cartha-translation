id: DAN.3.3
reference: Daniel 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: de
  text: Da versammelten sich die Satrapen, Präfekten und Statthalter, die Räte, Schatzmeister, Richter und Magistrate sowie alle Amtsträger der Provinzen zur Einweihung des Standbildes[a], das König Nebukadnezar hatte aufstellen lassen. Sie stellten sich vor dem Standbild auf, das Nebukadnezar hatte aufstellen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bild“. Das aramäische Wort צַלְמָא kann ein Bild beziehungsweise eine bildliche Darstellung oder ein monumentales Standbild bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; „Da“ wahrt den knappen erzählerischen Fortgang.
- source_word: מִתְכַּנְּשִׁין
  choice: versammelten sich
  rationale: Die reflexiv-passive Form bezeichnet das Zusammenkommen der Amtsträger; im Deutschen ist die reflexive Wiedergabe natürlich und genau.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Die etablierte Bezeichnung bewahrt den spezifischen persischen Verwaltungstitel.
- source_word: סִגְנַיָּא
  choice: Präfekten
  rationale: Der Ausdruck bezeichnet eine besondere Klasse hoher Verwaltungsbeamter; „Präfekten“ hält sie von den benachbarten Ämtern unterscheidbar.
- source_word: פַחֲוָתָא
  choice: Statthalter
  rationale: Eine geläufige deutsche Entsprechung für diesen Verwaltungsrang, die keine Gleichsetzung mit den Satrapen nahelegt.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: Räte
  rationale: Die genaue Amtsfunktion ist unsicher; „Räte“ gibt den wahrscheinlich beratenden Charakter wieder, ohne größere Präzision vorzutäuschen.
- source_word: גְדָבְרַיָּא
  choice: Schatzmeister
  rationale: Der Titel wird gewöhnlich auf Beamte des Finanz- oder Schatzwesens bezogen.
- source_word: דְּתָבְרַיָּא
  choice: Richter
  rationale: Der Titel bezeichnet wahrscheinlich Amtsträger mit richterlicher Funktion; „Richter“ ist die klarste knappe Wiedergabe.
- source_word: תִּפְתָּיֵא
  choice: Magistrate
  rationale: Der seltene Titel ist nicht sicher bestimmt, gehört aber in den rechtlich-administrativen Bereich; „Magistrate“ bewahrt die Eigenständigkeit gegenüber „Richter“.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: alle übrigen Amtsträger der Provinzen
  rationale: „Amtsträger“ fasst die weiteren Herrschafts- und Verwaltungsorgane verständlich zusammen; „übrigen“ macht die zusammenfassende Funktion nach der Aufzählung idiomatisch deutlich.
- source_word: לַחֲנֻכַּת
  choice: zur Einweihung
  rationale: Das Wort bezeichnet die feierliche Indienstnahme oder Widmung; „Einweihung“ passt im Deutschen natürlich zu einem Monument.
- source_word: צַלְמָא
  choice: Standbild
  rationale: Der Kontext spricht von einem aufgerichteten monumentalen Bildwerk. „Standbild“ ist natürlich und wahrt zugleich den Bildcharakter; die breitere Alternative „Bild“ wird in der Fußnote genannt.
- source_word: הֲקֵים
  choice: hatte aufstellen lassen
  rationale: Das Verb bedeutet hier „aufrichten/aufstellen“. Die kausative deutsche Formulierung bringt plausibel zum Ausdruck, dass der König als Auftraggeber handelt, ohne eigenhändige Ausführung zu behaupten.
- source_word: וְקָאמִין לָקֳבֵל
  choice: Sie stellten sich vor ... auf
  rationale: Die Wendung beschreibt das Stehen beziehungsweise Aufgestelltsein gegenüber dem Standbild; die deutsche Formulierung gibt den Übergang in diese Position flüssig wieder.
theological_decisions: []
