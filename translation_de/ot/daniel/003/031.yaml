base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: de
  text: 'König Nebukadnezar an alle Völker, Nationen und Sprachen, die auf der ganzen Erde[a] wohnen: Möge euer Friede[b] zunehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Auf der ganzen Erde« ist eine übliche Wendung königlicher Erlasse und kann sinngemäß »im gesamten Reich« bedeuten.
    reason: cultural_note
  - marker: b
    text: »Friede« schließt hier auch Wohlergehen und Unversehrtheit ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: König
  rationale: Das Substantiv steht als Titel bei dem Eigennamen. Die im Deutschen natürliche Form der königlichen Überschrift lautet »König Nebukadnezar«.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: an alle Völker, Nationen und Sprachen
  rationale: Die feststehende Dreierformel umfasst die verschiedenartigen Bevölkerungsgruppen des Reiches. »Sprachen« bewahrt die konkrete metonymische Ausdrucksweise des Aramäischen, ohne sie vorschnell als »Sprachgemeinschaften« auszudeuten.
- source_word: דִּי דארין
  choice: die … wohnen
  rationale: Relativpartikel und Partizip bezeichnen die angesprochenen Gruppen als Bewohner. »Wohnen« passt zum würdevollen Stil einer königlichen Bekanntmachung und ist zugleich gegenwärtiges Standarddeutsch.
- source_word: בְּכָל אַרְעָא
  choice: auf der ganzen Erde
  rationale: אַרְעָא kann »Land« oder »Erde« bedeuten. Die imperiale Formel ist umfassend und rhetorisch universal; »auf der ganzen Erde« gibt diese Weite wieder, während die Fußnote ihren konventionellen Charakter erläutert.
- source_word: שְׁלָמְכוֹן
  choice: euer Friede
  rationale: Das Wort umfasst Frieden, Wohlergehen und Unversehrtheit. »Friede« erhält die semitische Grußformel und bleibt im Deutschen verständlich.
- source_word: יִשְׂגֵּא
  choice: möge … immer größer werden
  rationale: Das Verb bedeutet »groß werden, zunehmen«. Die Wunschform mit »möge« bildet den aramäischen Segenswunsch natürlich ab; die Steigerungsform gibt den Vorgang des Zunehmens wieder.
