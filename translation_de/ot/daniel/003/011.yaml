source:
  edition: WLC
  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד יִתְרְמֵ֕א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/011.yaml
  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: de
  text: Und wer nicht niederfällt und anbetet, soll mitten hinein in einen Ofen mit loderndem Feuer geworfen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Förmlicher: »soll in das Innere eines Ofens mit brennendem Feuer geworfen werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: Und wer
  rationale: 'מַן mit דִּי leitet hier eine unbestimmte Relativkonstruktion ein: »wer auch immer/wer«. Das vorangestellte וּ führt die Bestimmung des Erlasses fort und wird mit »Und« wiedergegeben.'
- source_word: לָא יִפֵּל
  choice: nicht niederfällt
  rationale: Im Zusammenhang der geforderten Huldigung bezeichnet נפל das Sich-Niederwerfen, nicht ein unbeabsichtigtes körperliches Fallen. »Niederfallen« wahrt den bildhaften Vorgang und klingt im gehobenen Gegenwartsdeutsch natürlich.
- source_word: וְיִסְגֻּד
  choice: und anbetet
  rationale: סגד bezeichnet verehrende Niederwerfung beziehungsweise Huldigung. Da die Körperbewegung schon durch »niederfällt« ausgedrückt ist, gibt »anbetet« die religiös-politische Bedeutung wieder, ohne bloße Wiederholung.
- source_word: יִתְרְמֵא
  choice: soll … geworfen werden
  rationale: Die passive Verbform bezeichnet im königlichen Erlass die festgesetzte Strafe. »Soll … geworfen werden« bewahrt den normativen Charakter in natürlichem Deutsch.
- source_word: לְגוֹא
  choice: mitten hinein in
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte. »Mitten hinein in« bewahrt die räumliche Eindringlichkeit und ist idiomatischer als »in das Innere von«.
- source_word: אַתּוּן
  choice: einen Ofen
  rationale: Das aramäische Substantiv bezeichnet einen Ofen oder Schmelzofen. »Ofen« ist hier verständlich und vermeidet eine nicht ausdrücklich im Wort enthaltene technische Festlegung.
- source_word: נוּרָא יָקִדְתָּא
  choice: mit loderndem Feuer
  rationale: Die Wortgruppe beschreibt brennendes, heftig entfachtes Feuer. »Loderndes Feuer« gibt die Intensität idiomatisch wieder und bezieht die nähere Bestimmung wie im Aramäischen auf das Feuer.
