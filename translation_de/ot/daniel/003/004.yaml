  yaml_path: translation/ot/daniel/003/004.yaml
  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
translation:
  language: de
  text: 'Und der Herold rief mit lauter Stimme[a]: »Euch wird verkündet[b], ihr Völker, Nationen und Sprachen:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Kraft« beziehungsweise »mit mächtiger Stimme«. Die aramäische Wendung spricht wörtlich von Stärke und bezeichnet hier die Kraft oder Lautstärke des Rufens.'
    reason: lexical_alternative
  - marker: b
    text: 'Aramäisch steht formal: »sie sagen«. Die Form dient hier als unpersönliche amtliche Bekanntmachungsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרוֹזָא
  choice: der Herold
  rationale: Bezeichnet einen amtlichen öffentlichen Ausrufer. »Herold« wahrt den förmlichen höfischen Rahmen und ist im Deutschen gut verständlich.
- source_word: קָרֵא
  choice: rief
  rationale: Das Verb bezeichnet lautes Rufen; der Inhalt folgt als direkte Rede.
- source_word: בְחָיִל
  choice: mit lauter Stimme
  rationale: Wörtlich »mit Kraft/Stärke«; hier beschreibt die Wendung die Lautstärke oder Eindringlichkeit des Rufens.
- source_word: לְכוֹן
  choice: Euch
  rationale: Die Dativform der zweiten Person Plural bezeichnet die Angesprochenen und steht im Deutschen natürlich am Satzanfang.
- source_word: אָמְרִין
  choice: wird verkündet
  rationale: Formal »sie sagen«; im Zusammenhang dient die Form als unpersönliche amtliche Bekanntmachungsformel.
- source_word: עַמְמַיָּא
  choice: Völker
  rationale: Der Plural bezeichnet ethnische oder politische Volksgruppen und bleibt als eigener Bestandteil der dreigliedrigen Anrede erhalten.
- source_word: אֻמַּיָּא
  choice: Nationen
  rationale: Die Wiedergabe unterscheidet den Ausdruck vom vorausgehenden »Völker« und bewahrt die Reihung des Aramäischen.
- source_word: לִשָּׁנַיָּא
  choice: Sprachen
  rationale: Wörtlich »Zungen«; gemeint sind Sprachgemeinschaften beziehungsweise Sprachen. »Sprachen« ist im modernen Deutsch klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Hofsprache wird durch »Herold« und »wird verkündet« bewahrt; die direkte Anrede »ihr Völker, Nationen und Sprachen« gibt den vokativischen Charakter natürlich wieder.
