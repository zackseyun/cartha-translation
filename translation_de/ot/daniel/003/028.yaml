  to: 'Nebukadnezar ergriff das Wort und sagte: „Gepriesen sei der Gott Schadrachs, Meschachs und Abed-Negos, der seinen Engel[a] gesandt und seine Diener gerettet hat, die ihm vertraut, den Befehl des Königs missachtet[b] und ihre Leiber hingegeben haben, damit sie keinem Gott außer ihrem eigenen Gott dienen oder ihn anbeten[c].“'
