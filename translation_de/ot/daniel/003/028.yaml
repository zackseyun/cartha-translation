source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: de
  text: 'Nebukadnezar ergriff das Wort und sagte: „Gepriesen sei der Gott Schadrachs, Meschachs und Abed-Negos, der seinen Engel[a] gesandt und seine Diener gerettet hat, die ihm vertraut, den Befehl des Königs missachtet[b] und ihre Leiber hingegeben haben, damit sie keinem Gott außer ihrem eigenen Gott dienen oder ihn anbeten[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Boten“. Das aramäische Wort kann sowohl einen Engel als auch einen Boten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „änderten das Wort des Königs“; gemeint ist, dass sie sich seinem Befehl widersetzten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sich vor ihm niederwerfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: ergriff das Wort und sagte
  rationale: Die aramäische Erzählformel leitet eine feierliche Äußerung ein, auch wenn keine ausdrückliche Frage vorausgeht. Die deutsche Wendung gibt diese Diskursfunktion natürlich wieder.
- source_word: בְּרִיךְ
  choice: Gepriesen sei
  rationale: Die Form hat benediktorischen beziehungsweise doxologischen Charakter; „Gepriesen sei“ klingt im modernen Deutschen würdig und natürlich.
- source_word: אֱלָהֲהוֹן דִּי שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: der Gott Schadrachs, Meschachs und Abed-Negos
  rationale: Das Suffix wird durch die folgenden Namen näher bestimmt. Der deutsche Genitiv gibt diese Zugehörigkeit klar wieder.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: hat seinen Engel gesandt
  rationale: מַלְאָךְ kann „Engel“ oder „Bote“ bedeuten. Im Zusammenhang der übernatürlichen Rettung ist „Engel“ die naheliegende Hauptlesart; die allgemeinere Alternative bleibt in der Fußnote sichtbar.
- source_word: וְשֵׁיזִב לְעַבְדוֹהִי
  choice: und seine Diener gerettet
  rationale: Das Verb bezeichnet die Rettung aus Gefahr. „Diener“ passt zum Hof- und Gottesdienstkontext besser als das mögliche „Sklaven“.
- source_word: דִּי הִתְרְחִצוּ עֲלוֹהִי
  choice: Sie vertrauten ihm
  rationale: Die reflexive Form bezeichnet, dass sie ihr Vertrauen auf Gott setzten beziehungsweise sich auf ihn verließen.
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: setzten den Befehl des Königs außer Kraft
  rationale: Wörtlich ist vom Ändern des königlichen Wortes die Rede. Im Kontext bedeutet die Wendung, dass die Männer dessen Geltung für ihr eigenes Handeln zurückwiesen; die Fußnote bewahrt das konkrete Sprachbild.
- source_word: וִיהַבוּ גשמי/הון
  choice: gaben ihren Leib hin
  rationale: Die Wendung beschreibt die Bereitschaft, den eigenen Körper der Gefahr beziehungsweise dem Tod preiszugeben. Der distributive Singular ist im Deutschen idiomatisch und bewahrt das körperliche Bild.
- source_word: לָא יִפְלְחוּן וְלָא יִסְגְּדוּן
  choice: keinem Gott ... zu dienen oder ihn anzubeten
  rationale: Das erste Verb bezeichnet den Dienst an einer Gottheit; das zweite wörtlich das Niederwerfen und im Kontext die Anbetung.
- source_word: לָהֵן
  choice: außer
  rationale: Die Partikel kennzeichnet hier eindeutig eine Ausnahme.
theological_decisions:
- issue: Identität von מַלְאֲכֵהּ im Rettungsbericht
  choice: seinen Engel
  alternative: seinen Boten; eine genauer bestimmte theophanische oder christologische Gestalt
  rationale: Der aramäische Ausdruck selbst bedeutet „Engel“ oder „Bote“. Der Vers verlangt keine weitergehende Identifizierung; daher bleibt die Übersetzung bei „Engel“ und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Satzstruktur. Die traditionelle Namensform „Abed-Nego“ und die doxologische Wendung „Gepriesen sei“ wahren den biblischen Ton, ohne altertümlich zu wirken. Die Fußnotenmarker [a], [b] und [c] stehen jeweils unmittelbar bei der betreffenden Wendung.
