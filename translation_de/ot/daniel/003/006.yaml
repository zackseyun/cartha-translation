  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד בַּ/הּ שַׁעֲתָ֣/א יִתְרְמֵ֔א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/006.yaml
  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: de
  text: Und wer nicht niederfällt und anbetet, wird in derselben Stunde mitten in einen Ofen mit loderndem Feuer geworfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramäisch: „in jener Stunde“; die Wendung kann „sofort“ oder „unverzüglich“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: Und wer
  rationale: Die unbestimmte Relativfügung formuliert eine allgemein geltende Bedingung; „wer“ gibt sie im Deutschen knapp und natürlich wieder.
- source_word: לָא יִפֵּל
  choice: nicht niederfällt
  rationale: Das Verb bedeutet wörtlich „fallen“, bezeichnet hier aber das Niederfallen als körperliche Gebärde der Verehrung. „Niederfallen“ bewahrt Bild und Kontext.
- source_word: וְיִסְגֻּד
  choice: und anbetet
  rationale: Das Verb kann Niederwerfung, Huldigung oder kultische Verehrung bezeichnen. Da das Niederfallen bereits ausdrücklich genannt und ein Standbild verehrt wird, trifft „anbeten“ den religiösen Sinn.
- source_word: בַּהּ שַׁעֲתָא
  choice: noch in derselben Stunde
  rationale: Die Wendung lautet eng am Aramäischen „in jener/derselben Stunde“ und drückt im Zusammenhang unverzügliche Vollstreckung aus. Die Formulierung wahrt das Zeitbild, ohne es nur mit „sofort“ zu ersetzen.
- source_word: יִתְרְמֵא
  choice: wird … geworfen
  rationale: Die Passivform bezeichnet das Hineinwerfen. „Wird geworfen“ ist gegenwärtiges, klares Deutsch und vermeidet das altertümlichere „wird geworfen werden“ beziehungsweise „wird geschleudert“.
- source_word: לְגוֹא
  choice: mitten in
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte. „Mitten in“ bewahrt die anschauliche Vorstellung, dass der Betroffene in das Innere des Ofens geworfen wird.
- source_word: אַתּוּן
  choice: einen Ofen
  rationale: Das Wort bezeichnet einen großen Brenn- oder Schmelzofen. Im unmittelbaren Zusammenhang macht der Zusatz vom lodernden Feuer die gemeinte Art des Ofens eindeutig.
- source_word: נוּרָא יָקִדְתָּא
  choice: mit loderndem Feuer
  rationale: Die aramäische Verbindung bedeutet wörtlich etwa „Feuer, brennendes“. „Loderndes Feuer“ gibt die verstärkende, anschauliche Wirkung in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Gebärde („niederfällt“) und ihre religiöse Bedeutung („anbetet“) bleiben nebeneinander stehen; die aramäische Zeitwendung wird im Haupttext bewahrt und in der Fußnote erläutert.
