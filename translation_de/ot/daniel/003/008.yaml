id: DAN.3.8
reference: Daniel 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֤ל דְּנָה֙ בֵּ/הּ זִמְנָ֔/א קְרִ֖בוּ גֻּבְרִ֣ין כַּשְׂדָּאִ֑ין וַ/אֲכַ֥לוּ קַרְצֵי/ה֖וֹן דִּ֥י יְהוּדָיֵֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
translation:
  language: de
  text: Aus diesem Grund traten zu jener Zeit einige chaldäische Männer vor und klagten die Juden[a] böswillig an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Der aramäische Ausdruck kann sowohl die Menschen aus Juda in ethnisch-geografischem Sinn als auch die Juden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Aus diesem Grund
  rationale: Die aramäische Wendung bezeichnet einen begründenden Zusammenhang. „Aus diesem Grund“ gibt ihn klar und in natürlichem Deutsch wieder.
- source_word: בֵּהּ זִמְנָא
  choice: zu jener Zeit
  rationale: Die Zeitangabe bezeichnet den damaligen Anlass; „zu jener Zeit“ ist idiomatisch und würdevoll.
- source_word: קְרִבוּ
  choice: traten … vor
  rationale: Das Verb bedeutet „sich nähern, herantreten“. Im höfischen Zusammenhang gibt „vortraten“ die Bewegung und das öffentliche Auftreten treffend wieder.
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: einige chaldäische Männer
  rationale: Dies bewahrt das ausdrücklich genannte männliche Substantiv und die chaldäische Bezeichnung, ohne die Männer unbelegt als Beamte einzuordnen.
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: klagten … böswillig an
  rationale: Die wörtlich bildhafte aramäische Redewendung („ihre Stücke essen“) bezeichnet eine feindselige oder verleumderische Anschuldigung. Die gewählte Formulierung erhält sowohl den Anklagecharakter als auch die böswillige Absicht.
- source_word: דִּי יְהוּדָיֵא
  choice: die Juden
  rationale: Der Ausdruck kann ethnisch-geografisch „Judäer“ oder als Volksbezeichnung „Juden“ bedeuten. Im exilischen Kontext ist „die Juden“ verständlich und geläufig; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
theological_decisions: []
