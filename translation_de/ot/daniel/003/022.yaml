  text: כָּ/ל קֳבֵ֣ל דְּנָ֗ה מִן דִּ֞י מִלַּ֤ת מַלְכָּ/א֙ מַחְצְפָ֔ה וְ/אַתּוּנָ֖/א אֵזֵ֣ה יַתִּ֑ירָא גֻּבְרַיָּ֣/א אִלֵּ֗ךְ דִּ֤י הַסִּ֨קוּ֙ לְ/שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ קַטִּ֣ל הִמּ֔וֹן שְׁבִיבָ֖/א דִּ֥י נוּרָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: de
  text: Weil der Befehl des Königs hart war und der Ofen übermäßig stark geheizt worden war, tötete die Flamme des Feuers jene Männer, die Schadrach, Meschach und Abed-Nego hinaufgebracht hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: weil
  rationale: Die aramäische Kausalformel leitet hier den Grund für den Tod der Männer ein; im Deutschen gibt „weil“ den Zusammenhang natürlich und knapp wieder.
- source_word: מִלַּת מַלְכָּא מַחְצְפָה
  choice: der Befehl des Königs so streng
  rationale: מִלָּה bezeichnet hier den königlichen Befehl. מַחְצְפָה beschreibt dessen strenge beziehungsweise rücksichtslose Härte; „streng“ bewahrt diese Aussage, ohne eine bloße zeitliche Dringlichkeit einzutragen.
- source_word: אַתּוּנָא אֵזֵה יַתִּירָא
  choice: der Ofen übermäßig stark geheizt worden war
  rationale: Die Wendung besagt, dass der Ofen außergewöhnlich stark erhitzt worden war. Die deutsche Formulierung ist idiomatisch und erhält die Steigerung יַתִּירָא.
- source_word: הַסִּקוּ
  choice: hinaufgebracht hatten
  rationale: Die Kausativform bezeichnet das Hinaufbringen beziehungsweise Hinaufführen zum Ofen; die räumliche Perspektive des aramäischen Textes bleibt erhalten.
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: die Feuerflamme
  rationale: Die feste Verbindung meint die Flamme beziehungsweise den lodernden Ausbruch des Feuers; „Feuerflamme“ ist prägnant und quellenah.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen den im Deutschen vertrauten Formen Schadrach, Meschach und Abed-Nego. Der Satz bewahrt die kausale Verknüpfung und die erzählerische Ironie, dass das übermäßig erhitzte Feuer die ausführenden Männer tötet.
