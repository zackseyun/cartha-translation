  text: בֵּ/אדַ֜יִן גֻּבְרַיָּ֣/א אִלֵּ֗ךְ כְּפִ֨תוּ֙ בְּ/סַרְבָּלֵי/הוֹן֙ פטישי/הון וְ/כַרְבְּלָתְ/ה֖וֹן וּ/לְבֻשֵׁי/ה֑וֹן וּ/רְמִ֕יו לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
translation:
  language: de
  text: Da wurden diese Männer, noch in ihren Hosen, ihren Tuniken[a], ihren Mänteln und ihrer übrigen Kleidung, gefesselt und mitten in den glühenden Feuerofen[b] geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Kopfbedeckungen“. Das aramäische Wort ist selten; was für ein Kleidungsstück gemeint ist, lässt sich nicht sicher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Innere des Ofens des brennenden Feuers“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das unmittelbar folgende Geschehen ein; „Da“ gibt den zeitlich-folgernden Übergang knapp und natürlich wieder.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer
  rationale: Substantiv und Demonstrativpronomen verweisen auf die drei bereits genannten Judäer.
- source_word: כְּפִתוּ
  choice: wurden … gefesselt
  rationale: Die passive Form beschreibt, dass die Männer vor ihrer Hinrichtung gebunden wurden; „gefesselt“ passt zum ernsten erzählerischen Kontext.
- source_word: סַרְבָּלֵיהוֹן
  choice: ihren Hosen
  rationale: Das persische Lehnwort bezeichnet wahrscheinlich ein Kleidungsstück für den Unterkörper. „Hosen“ ist die wahrscheinlichste konkrete Wiedergabe, obwohl ältere Übersetzungen oft allgemeinere Oberbekleidung nennen.
- source_word: פטישיהון
  choice: ihren Tuniken
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher. „Tuniken“ bezeichnet verständlich ein von Hosen und Mänteln verschiedenes Kleidungsstück, ohne die mögliche Deutung als Kopfbedeckung im Haupttext festzuschreiben; diese steht in der Fußnote.
- source_word: כַרְבְּלָתְהוֹן
  choice: ihren Mänteln
  rationale: Das Wort bezeichnet wahrscheinlich einen Überwurf oder Mantel; „Mäntel“ ist dafür eine klare, gegenwärtige Entsprechung.
- source_word: לְבֻשֵׁיהוֹן
  choice: ihrer übrigen Kleidung
  rationale: Der allgemeine Ausdruck für Kleidung fasst nach den einzelnen Kleidungsstücken den verbleibenden Besitz an Kleidung zusammen.
- source_word: וּרְמִיו
  choice: und … geworfen
  rationale: Im Zusammenhang sind die Männer diejenigen, die von anderen in den Ofen geworfen werden. Die deutsche Passivkonstruktion hält den erzählerischen Fokus auf ihnen.
- source_word: לְגוֹא
  choice: mitten in
  rationale: Der Ausdruck bezeichnet das Innere beziehungsweise die Mitte und wird daher nicht auf das bloße „in“ reduziert.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: den glühenden Feuerofen
  rationale: Die aramäische Wendung häuft die Begriffe für Ofen, Feuer und Brennen. „Glühender Feuerofen“ bewahrt ihre Intensität in natürlichem, bildhaftem Deutsch; die wörtlichere Struktur wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eingeschobene Formulierung „noch in …“ verdeutlicht natürlich, dass die Männer vollständig bekleidet gefesselt wurden, ohne zusätzliche Sachinformation einzuführen. Die seltenen Kleidungsbegriffe werden lesbar wiedergegeben, während die echte lexikalische Unsicherheit in der Fußnote erhalten bleibt.
