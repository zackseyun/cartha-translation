  to: 'Und die Satrapen, die Präfekten, die Statthalter und die Räte des Königs versammelten sich und stellten bei diesen Männern fest, dass das Feuer keine Macht über ihre Körper hatte: Kein Haar auf ihrem Kopf war versengt, ihre Mäntel[a] waren unverändert, und kein Geruch nach Feuer haftete ihnen an.'
