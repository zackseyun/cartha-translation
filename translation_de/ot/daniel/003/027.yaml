  naturalness: „Sahen an diesen Männern, dass“ ist keine geläufige deutsche Konstruktion; entweder lautet sie „sahen diesen Männern an, dass“ oder sie wird besser als Feststellung bei den Männern formuliert. „Ihre Mäntel hatten sich nicht verändert“ klingt zudem weniger idiomatisch als eine Zustandsbeschreibung. „Kein Geruch nach Feuer haftete ihnen an“ ist eine direkte und natürliche Wiedergabe.
