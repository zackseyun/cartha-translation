  text: וּ֠/מִֽתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּ֞/א סִגְנַיָּ֣/א וּ/פַחֲוָתָ/א֮ וְ/הַדָּבְרֵ֣י מַלְכָּ/א֒ חָזַ֣יִן לְ/גֻבְרַיָּ֣/א אִלֵּ֡ךְ דִּי֩ לָֽא שְׁלֵ֨ט נוּרָ֜/א בְּ/גֶשְׁמְ/ה֗וֹן וּ/שְׂעַ֤ר רֵֽאשְׁ/הוֹן֙ לָ֣א הִתְחָרַ֔ךְ וְ/סָרְבָּלֵי/ה֖וֹן לָ֣א שְׁנ֑וֹ וְ/רֵ֣יחַ נ֔וּר לָ֥א עֲדָ֖ת בְּ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: de
  text: 'Und die Satrapen, die Präfekten, die Statthalter und die Räte des Königs versammelten sich und stellten bei diesen Männern fest, dass das Feuer keine Macht über ihre Körper hatte: Kein Haar auf ihrem Kopf war versengt, ihre Mäntel[a] waren unverändert, und kein Geruch nach Feuer haftete ihnen an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kleidungsstücke; die genaue Art des mit dem aramäischen Wort bezeichneten Kleidungsstücks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: versammelten sich
  rationale: Das aramäische Partizip von כנס bezeichnet das Zusammenkommen beziehungsweise Sichversammeln; die deutsche Erzählform gibt den Vorgang natürlich wieder.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Das persische Lehnwort bezeichnet einen historischen hohen Verwaltungsrang; der etablierte deutsche Titel wahrt diese Genauigkeit.
- source_word: סִגְנַיָּא
  choice: Präfekten
  rationale: Der Ausdruck bezeichnet hochrangige Amtsträger. „Präfekten“ unterscheidet dieses Amt von den übrigen genannten Verwaltungsrängen.
- source_word: פַחֲוָתָא
  choice: Statthalter
  rationale: Dies ist eine geläufige und sachlich passende deutsche Wiedergabe für provinziale Regierungsbeamte.
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: die Räte des Königs
  rationale: Der Ausdruck kann königliche Amtsträger oder Berater bezeichnen. „Räte“ passt zum Hofkontext, ohne das Amt unnötig zu präzisieren.
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ
  choice: sahen an diesen Männern
  rationale: Die Präposition לְ bezeichnet hier den Bezug der Wahrnehmung. Die Formulierung bleibt nahe an der aramäischen Konstruktion und ist im Deutschen natürlich.
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: das Feuer keine Macht über ihren Körper gehabt hatte
  rationale: שׁלט bezeichnet Herrschaft oder Macht, nicht bloß eine Wirkung. Die Wiedergabe bewahrt diese starke Aussage.
- source_word: שְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: Kein Haar auf ihrem Kopf war versengt
  rationale: Das Verb bezeichnet hier das Ansengen oder Versengen, besonders passend bei Haar; die deutsche Formulierung gibt zugleich die vollständige Unversehrtheit anschaulich wieder.
- source_word: סָרְבָּלֵיהוֹן
  choice: ihre Mäntel
  rationale: Das Wort bezeichnet ein Kleidungsstück, dessen genaue Art unsicher ist. „Mäntel“ ist eine plausible, traditionelle Wiedergabe; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: kein Brandgeruch haftete ihnen an
  rationale: Die idiomatische deutsche Wendung vermittelt präzise, dass nicht einmal der Geruch des Feuers an ihnen festzustellen war.
