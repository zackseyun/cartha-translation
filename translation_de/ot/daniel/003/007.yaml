source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָ֡ה בֵּ/הּ זִמְנָ֡/א כְּ/דִ֣י שָֽׁמְעִ֣ין כָּֽל עַמְמַיָּ֡/א קָ֣ל קַרְנָ/א֩ מַשְׁר֨וֹקִיתָ֜/א קיתרס שַׂבְּכָא֙ פְּסַנְטֵרִ֔ין וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א נָֽפְלִ֨ין כָּֽל עַֽמְמַיָּ֜/א אֻמַיָּ֣/א וְ/לִשָּׁנַיָּ֗/א סָֽגְדִין֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: de
  text: Darum fielen zu jener Zeit, als alle Völker den Klang von Horn, Flöte, Leier, Harfe[a] und Zither sowie jeder Art von Musik hörten, alle Völker, Nationen und Sprachen nieder und beteten das goldene Standbild an, das König Nebukadnezar aufgestellt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer hier genannter Instrumente ist unsicher. Die mit „Harfe“ und „Zither“ wiedergegebenen Wörter können andere Arten antiker Saiteninstrumente bezeichnet haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Darum
  rationale: Die aramäische Wendung kennzeichnet die Folge des königlichen Erlasses. „Darum“ gibt diesen Folgerungszusammenhang knapp und natürlich wieder.
- source_word: בֵּהּ זִמְנָא
  choice: zu jener Zeit
  rationale: Die Wendung bezeichnet den Zeitpunkt, zu dem der Befehl ausgeführt wurde; „zu jener Zeit“ entspricht dem erzählerischen Register.
- source_word: כְּדִי שָׁמְעִין
  choice: als … hörten
  rationale: Die Verbindung hat temporalen Sinn. „Als“ wahrt die zeitliche Abfolge, ohne eine im Ausdruck nicht zwingend enthaltene Unmittelbarkeit zu verstärken.
- source_word: כָּל עַמְמַיָּא
  choice: alle Völker
  rationale: Der Plural bezeichnet ethnische Gruppen und greift zugleich die wiederholte Aufzählung im zweiten Satzteil auf.
- source_word: קָל
  choice: Klang
  rationale: Gemeint ist der hörbare Klang der Instrumente, nicht eine Stimme.
- source_word: קַרְנָא
  choice: Horn
  rationale: „Horn“ ist eine sachlich breite Bezeichnung und vermeidet eine unbelegte nähere Bestimmung des Instruments.
- source_word: מַשְׁרוֹקִיתָא
  choice: Flöte
  rationale: Das Wort bezeichnet ein Blasinstrument; „Flöte“ ist im Deutschen verständlich, ohne eine konkrete historische Bauform festzulegen.
- source_word: קיתרס
  choice: Leier
  rationale: Das Lehnwort ist mit der griechischen kithara verwandt. „Leier“ ist eine geläufige, hinreichend breite deutsche Entsprechung.
- source_word: שַׂבְּכָא
  choice: Harfe
  rationale: Die genaue Art des Saiteninstruments ist unsicher. „Harfe“ bietet eine verständliche Oberbezeichnung; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: פְּסַנְטֵרִין
  choice: Zither
  rationale: Wahrscheinlich ist ein weiteres Saiteninstrument gemeint. „Zither“ ist eine verständliche Annäherung, ohne die historische Identifizierung als sicher auszugeben; die Fußnote wahrt die Unsicherheit.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: und jeder Art von Musik
  rationale: Die Sammelwendung schließt die Instrumentenliste ab und betont die Gesamtheit der Musikarten.
- source_word: נָפְלִין
  choice: fielen … nieder
  rationale: Die konkrete körperliche Bewegung des Niederfallens wird bewahrt; zusammen mit dem folgenden Verb beschreibt sie die kultische Niederwerfung.
- source_word: צֶלֶם דַּהֲבָא
  choice: das goldene Standbild
  rationale: „Standbild“ gibt das aufgerichtete Bildwerk natürlich wieder und passt zum wiederholten Motiv des Aufstellens.
theological_decisions:
- issue: Bezeichnung der Handlung gegenüber dem Standbild
  choice: beteten … an
  alternative: huldigten / warfen sich nieder vor
  rationale: In der vom König angeordneten kultischen Situation richtet sich die Handlung auf ein Bild und geht über bloße höfische Ehrerbietung hinaus. „Anbeten“ bewahrt diese religiöse Bedeutung, ohne eine zusätzliche dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die formelhafte Wiederholung von „alle Völker“ sowie die Dreierreihe „Völker, Nationen und Sprachen“ bleiben als Merkmale des aramäischen Textes erhalten.
