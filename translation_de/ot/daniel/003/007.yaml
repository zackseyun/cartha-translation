    rationale: 'Das Aramäische leitet unmittelbar die Reaktion der Gruppen ein: Deshalb/aus diesem Grund fielen sie zu jener Zeit nieder, als sie die Musik hörten. Das zusätzliche „geschah es“ hat keine textliche Entsprechung und erzeugt eine unnötige Satzlücke.'
  - severity: low
