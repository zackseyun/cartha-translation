  source_fidelity: 'Die Wiedergabe folgt dem aramäischen Text im Wesentlichen zuverlässig: die Folgerung, die Zeitangabe, die wiederholte Gesamtheit der Völkergruppen, das Niederfallen und die kultische Verehrung des Bildes sind erhalten. Die instrumentalen Einzelbezeichnungen bleiben, wie im Ausgangstext, teilweise unsicher und sind angemessen durch eine Anmerkung abgesichert. Allerdings fügt „Darum geschah es“ ein in der Vorlage nicht vorhandenes unpersönliches Ereignis ein und löst die Folgerungs- und Zeitangabe unnötig vom eigentlichen Prädikat.'
  naturalness: Der Satz ist grundsätzlich verständlich und im modernen Standarddeutsch angemessen. „Darum geschah es zu jener Zeit:“ wirkt jedoch formelhaft und syntaktisch unbefriedigend, weil offenbleibt, was genau „geschah“. Eine direkte Anbindung von „Darum“ und „zu jener Zeit“ an „fielen ... nieder“ ist zugleich natürlicher und quellennäher.
  terminology: „Nebukadnezar“, „goldenes Standbild“ und „beteten ... an“ sind im Kontext treffend. „Horn“, „Flöte“, „Leier“, „Harfe“ und „Zither“ sind als verständliche, vorsichtige Annäherungen vertretbar, sofern die Fußnote die unsichere Identifikation gerade der beiden zuletzt genannten Instrumente ausdrücklich wahrt. Die Dreierreihe „Völker, Nationen und Sprachen“ sollte bestehen bleiben.
