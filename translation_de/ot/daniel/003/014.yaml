  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: de
  text: 'Nebukadnezar antwortete ihnen: „Ist es wahr[a], Schadrach, Meschach und Abed-Nego, dass ihr meinem Gott nicht dient und euch vor dem goldenen Standbild, das ich aufgestellt habe, nicht niederwerft?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das aramäische Wort kann auch „absichtlich“ oder „mit voller Absicht“ bedeuten: „Handelt ihr absichtlich, Schadrach, Meschach und Abed-Nego, indem ihr meinem Gott nicht dient …?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: antwortete
  rationale: Die aramäische Doppelwendung ist eine übliche Redeeinleitung. Im modernen Deutschen gibt „antwortete“ ihre Funktion natürlich wieder, ohne das schwerfällige „antwortete und sagte“ nachzubilden.
- source_word: לְהוֹן
  choice: ihnen
  rationale: Das Pronomen der 3. Person Plural bezieht sich gemeinsam auf die drei Judäer.
- source_word: הַצְדָּא
  choice: Ist es wahr
  rationale: Die Wendung kann hier nach der Wahrheit der Anschuldigung fragen; daneben ist auch eine Deutung im Sinn von absichtlichem Handeln möglich, die in der Fußnote erhalten bleibt.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Namen folgen geläufigen deutschen Bibelschreibungen.
- source_word: לֵאלָהַי
  choice: meinem Gott
  rationale: Die Form ist hier morphologisch Singular mit Suffix der 1. Person Singular.
- source_word: פָּלְחִין
  choice: dient
  rationale: Das Verb bezeichnet kultischen Dienst. „Dienen“ wahrt den Unterschied zum folgenden Niederwerfen.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: vor dem goldenen Standbild
  rationale: „Standbild“ bezeichnet im Kontext natürlich das aufgerichtete Bild und passt zur körperlichen Handlung des Niederwerfens.
- source_word: דִּי הֲקֵימֶת
  choice: das ich aufgestellt habe
  rationale: Das Perfekt bezeichnet die bereits vollzogene, für die gegenwärtige Szene weiterhin relevante Aufstellung.
- source_word: סָגְדִין
  choice: euch ... niederwerft
  rationale: Das Verb bezeichnet körperliche Prostration beziehungsweise huldigendes Niederwerfen und bleibt so von „dienen“ unterschieden.
theological_decisions:
- issue: Unterscheidung der beiden Handlungen kultischen Dienens und körperlicher Huldigung
  choice: „dient“ und „euch ... niederwerft“ als getrennte Ausdrücke
  alternative: Eines oder beide Verben mit „anbeten“ wiedergeben
  rationale: Der aramäische Text verwendet zwei verschiedene Verben. Ihre Unterscheidung erhält die rhetorische und begriffliche Spannung des Satzes.
- issue: Deutung von הַצְדָּא
  choice: „Ist es wahr“ im Haupttext
  alternative: „Tut ihr das absichtlich?“ beziehungsweise „Ist es Absicht?“
  rationale: Im Zusammenhang der gemeldeten Anklage liegt die Wahrheitsfrage nahe. Da das Wort auch vorsätzlichen Trotz bezeichnen kann, wird diese echte Mehrdeutigkeit durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische aramäische Redeeinleitung wird knapp wiedergegeben; die beiden Verben für kultischen Dienst und Niederwerfung bleiben klar unterschieden. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
