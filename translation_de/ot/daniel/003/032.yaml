  text: אָֽתַיָּ/א֙ וְ/תִמְהַיָּ֔/א דִּ֚י עֲבַ֣ד עִמִּ֔/י אֱלָהָ֖/א עלי/א שְׁפַ֥ר קָֽדָמַ֖/י לְ/הַחֲוָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/032.yaml
  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
translation:
  language: de
  text: Es schien mir gut, die Zeichen und Wunder, die der höchste Gott an mir[b] getan hat, bekannt zu machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich hielt es für gut, ... bekannt zu machen«; die aramäische Wendung ist eine förmliche Ausdrucksweise königlicher Zustimmung oder Entschlossenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit mir getan«; gemeint ist, was Gott in Bezug auf Nebukadnezar beziehungsweise an ihm getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא
  choice: die Zeichen
  rationale: Das aramäische Substantiv bezeichnet »Zeichen«; zusammen mit »Wunder« verweist es auf die bekannten außergewöhnlichen Taten Gottes.
- source_word: וְתִמְהַיָּא
  choice: und Wunder
  rationale: Die geläufige Verbindung »Zeichen und Wunder« ist verständlich, würdevoll und gibt den Ausdruck für staunenerregende göttliche Taten natürlich wieder.
- source_word: דִּי
  choice: die
  rationale: Das Relativpronomen leitet den Nebensatz ein, der die Zeichen und Wunder näher bestimmt.
- source_word: עֲבַד
  choice: getan hat
  rationale: Das Verb bedeutet »tun, machen«; das deutsche Perfekt bezeichnet hier vergangene Taten mit gegenwärtiger Bedeutung.
- source_word: עִמִּי
  choice: an mir
  rationale: Wörtlich steht »mit mir«. »An mir« bewahrt stärker als »für mich« die relationale Offenheit und bezeichnet, was Gott im Erleben Nebukadnezars getan hat.
- source_word: אֱלָהָא עִלָּיָא
  choice: der höchste Gott
  rationale: Dies gibt den aramäischen Hoheitstitel unmittelbar und ohne zusätzliche dogmatische Festlegung wieder.
- source_word: שְׁפַר קֳדָמַי
  choice: will ich
  rationale: Die formelhafte Wendung bedeutet wörtlich, dass etwas vor dem König gut erschien, und drückt in diesem Erlass seine Zustimmung beziehungsweise seinen Entschluss aus. Im Deutschen gibt »will ich« diesen Entschluss natürlich wieder; die formale Nuance wird in einer Fußnote erhalten.
- source_word: לְהַחֲוָיָה
  choice: bekannt machen
  rationale: Der Infinitiv bedeutet »kundtun, bekannt machen, erklären«. »Bekannt machen« passt zur öffentlichen königlichen Verkündigung und bleibt allgemein verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens beziehungsweise Hoheitstitels אֱלָהָא עִלָּיָא
  choice: der höchste Gott
  alternative: Gott, der Höchste
  rationale: Die gewählte Form bewahrt den ausdrücklich erhobenen Gottes-Titel, ohne spätere Lehrformulierungen einzutragen.
- issue: Deutung von עִמִּי
  choice: an mir
  alternative: für mich; mit mir
  rationale: »An mir« lässt offen, ob der Schwerpunkt auf Gottes Wohltat, seinem Handeln gegenüber Nebukadnezar oder dessen persönlichem Erleben liegt, und vermeidet eine ausschließlich wohltätige Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Verkündigungston. Die Hauptsatzstellung ist im Deutschen natürlich und stellt zugleich den königlichen Entschluss heraus; die beiden Fußnoten bewahren die formale Idiomatik und die Mehrdeutigkeit der Präposition.
