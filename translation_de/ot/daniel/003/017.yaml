  rationale: Die Änderung von „kommt“ zu „ist“ beseitigt eine nicht ausdrücklich im Aramäischen enthaltene Zukunftsfestlegung. Die Fußnote zur Schlussform wird auf die tatsächlich einschlägige modale bzw. optative Alternative beschränkt. Im Übrigen ist die Übersetzung quellennah, idiomatisch und im Register angemessen.
