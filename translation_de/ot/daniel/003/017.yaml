source:
  edition: WLC
  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: de
  text: Wenn es so ist,[a] kann unser Gott, dem wir dienen, uns aus dem lodernden Feuerofen[b] retten; und er wird uns aus deiner Hand retten, König.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Wenn es [einen solchen Fall] gibt.“ Die aramäische Wendung verweist auf die vom König angedrohte Strafe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aus dem Ofen des brennenden Feuers“.'
    reason: lexical_alternative
  - marker: c
    text: 'Die aramäische Verbform kann auch modal oder als Wunsch verstanden werden: „er möge uns retten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: Wenn es so kommt
  rationale: Die aramäische Verbindung ist eine idiomatische, auf die angedrohte Strafe zurückverweisende Bedingungsformulierung. Die deutsche Wiedergabe ist natürlich und lässt den Situationsbezug erkennen.
- source_word: אֱלָהַנָא דִּי אֲנַחְנָא פָלְחִין
  choice: unser Gott, dem wir dienen
  rationale: „Dienen“ bewahrt den Grundsinn von פְּלַח; die kultische Verehrung ergibt sich aus dem Zusammenhang, ohne eigens in die Übersetzung eingetragen zu werden.
- source_word: יָכִל
  choice: kann
  rationale: Das gebräuchliche deutsche Modalverb gibt Gottes Fähigkeit klar und unmittelbar wieder.
- source_word: לְשֵׁיזָבוּתַנָא
  choice: uns … retten
  rationale: Das Verb bezeichnet die Rettung oder Befreiung aus unmittelbarer Gefahr. „Retten“ ist im modernen Deutschen natürlich und passt zum konkreten Zusammenhang.
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: aus dem lodernden Feuerofen
  rationale: Die kompakte deutsche Fügung bewahrt Ofen, Feuer und dessen brennende beziehungsweise lodernde Beschaffenheit, ohne eine unnatürliche Häufung von Attributen.
- source_word: וּמִן יְדָךְ
  choice: aus deiner Hand
  rationale: Die Metapher für Macht und Verfügungsgewalt wird entsprechend dem Aramäischen beibehalten.
- source_word: מַלְכָּא
  choice: König
  rationale: Die direkte Anrede bleibt erhalten; auf das im heutigen Deutsch altertümlich wirkende „o König“ wird verzichtet.
- source_word: יְשֵׁיזִב
  choice: er wird … retten
  rationale: Die Form wird im Haupttext als zuversichtliche Zukunftsaussage verstanden. Eine Fußnote wahrt die möglichen modalen beziehungsweise optativischen Deutungen.
theological_decisions:
- issue: Aussagekraft des abschließenden Imperfekts יְשֵׁיזִב
  choice: 'zuversichtliche Zukunftsaussage: „er wird uns retten“'
  alternative: „er kann uns retten“ oder „möge er uns retten“
  rationale: Der Zusammenhang erlaubt eine entschlossene Vertrauensaussage, erzwingt sie grammatisch jedoch nicht völlig. Die alternative modale beziehungsweise optativische Auffassung wird deshalb in einer Fußnote offengelegt; die Spannung zum folgenden Vers wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Satzführung. Die traditionelle, heute aber altertümlich klingende Anrede „o König“ wird vermieden. Das Bild „aus deiner Hand“ bleibt bewusst erhalten.
