source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: de
  text: Nun, wenn ihr bereit seid, beim Klang von Horn, Flöte, Leier, Trigon[a], Harfe[b] und Dudelsack[c] sowie jeder Art von Musik niederzufallen und das Standbild anzubeten, das ich gemacht habe – dann ist es gut.[d] Wenn ihr es aber nicht anbetet, werdet ihr noch in derselben Stunde mitten in den Ofen mit dem lodernden Feuer geworfen. Und welcher Gott ist es, der euch aus meiner Hand retten wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Dreiecksharfe“; welches Instrument mit שַׂבְּכָא genau gemeint ist, ist ungewiss.
    reason: lexical_alternative
  - marker: b
    text: Traditionell auch „Psalter“ für פְּסַנְתֵּרִין.
    reason: lexical_alternative
  - marker: c
    text: Möglicherweise „Doppelflöte“; die Bestimmung von סוּמְפֹּנְיָה ist umstritten. Die ältere Wiedergabe „Symphonie“ folgt der Wortform, bezeichnet hier aber kein modernes Orchester.
    reason: lexical_alternative
  - marker: d
    text: 'Das Aramäische bricht nach „das ich gemacht habe“ elliptisch ab. „Dann ist es gut“ ergänzt den im Zusammenhang vorausgesetzten Sinn: Wenn sie gehorchen, folgt keine Strafe.'
    reason: ellipsis
lexical_decisions:
- source_word: כְּעַן הֵן אִיתֵיכון עֲתִידִין
  choice: Nun, wenn ihr bereit seid
  rationale: Gibt den aramäischen Diskursanschluss, die Bedingung und die Bereitschaft zu sofortigem Handeln natürlich und zugleich eng am Wortlaut wieder.
- source_word: בְעִדָּנָא דִּי תִשְׁמְעוּן קָל
  choice: beim Klang
  rationale: Die Zeitangabe und das Hören des Instrumentenklangs werden im Deutschen knapp und idiomatisch zusammengefasst.
- source_word: קַרְנָא מַשְׁרוֹקִיתָא קיתרס
  choice: Horn, Flöte, Leier
  rationale: Verständliche, hinreichend breite deutsche Bezeichnungen für die ersten drei Instrumente, ohne ihre Bauart unnötig festzulegen.
- source_word: שַׂבְּכָא
  choice: Trigon
  rationale: Die genaue Bestimmung des Instruments ist unsicher. Der fachsprachliche Name bewahrt diese Unsicherheit; eine verständlichere mögliche Deutung steht in der Fußnote.
- source_word: פְּסַנְתֵּרִין
  choice: Harfe
  rationale: Bezeichnet ein Saiteninstrument; „Harfe“ ist modern verständlich, während die traditionelle Alternative in der Fußnote genannt wird.
- source_word: סוּמְפֹּנְיָה
  choice: Dudelsack
  rationale: Eine verbreitete moderne Identifizierung, jedoch nicht sicher; die mögliche Alternative „Doppelflöte“ wird deshalb vermerkt.
- source_word: כֹל זְנֵי זְמָרָא
  choice: jede Art von Musik
  rationale: Bewahrt die umfassende Bedeutung der aramäischen Wendung und klingt im modernen Deutschen natürlich.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: Ofen mit dem lodernden Feuer
  rationale: Gibt sowohl den Ofen als auch das ausdrücklich genannte brennende Feuer wieder, ohne die aramäische Ausdrucksfülle einzuebnen.
- source_word: יְשֵׁיזְבִנְכוֹן מִן יְדָי
  choice: euch aus meiner Hand retten wird
  rationale: „Aus meiner Hand“ erhält das Machtbild des Originals; das Futur bewahrt die Form und den herausfordernden Ton der Frage.
theological_decisions:
- issue: Wiedergabe von סגד im Zusammenhang mit dem Standbild
  choice: anbeten
  alternative: sich niederwerfen / huldigen
  rationale: Da das Niederfallen bereits eigens genannt wird und der Konflikt die religiöse Verehrung des Standbilds betrifft, bezeichnet „anbeten“ den beabsichtigten Akt am klarsten.
- issue: Wiedergabe von אֱלָהּ in Nebukadnezars trotziger Frage
  choice: der Gott
  alternative: ein Gott / welcher Gott
  rationale: Der bestimmte Ausdruck des Aramäischen wird bewahrt. Die Formulierung bleibt eine herausfordernde Frage des Königs und wird nicht als Glaubensbekenntnis umgedeutet; die im Deutschen obligatorische Großschreibung von „Gott“ entscheidet die theologische Referenz nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter königlicher Drohrede. Die Instrumentenliste bleibt formal erkennbar, während unsichere Identifizierungen in Fußnoten offengelegt werden. Die Ellipse wird lesbar ergänzt und ausdrücklich gekennzeichnet.
