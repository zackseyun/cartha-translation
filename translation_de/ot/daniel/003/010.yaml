id: DAN.3.10
reference: Daniel 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: de
  text: Du, König, hast verfügt, dass jeder Mensch[a], der den Klang von Horn, Flöte, Leier, Dreiecksharfe, Zither und Sackpfeife[b] sowie jede Art von Musik hört, sich niederwerfen und das goldene Standbild anbeten soll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „jeder Mann“ oder „jeder“; das Aramäische verwendet eine maskuline Singularform mit allgemeiner Bedeutung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Doppelflöte“; welches Instrument mit dem aramäischen Namen genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: Du, König
  rationale: Die selbstständige Anrede wird direkt und würdevoll wiedergegeben; ein zusätzliches „o“ wäre im heutigen Standarddeutsch unnötig altertümlich.
- source_word: שָׂמְתָּ טְּעֵם
  choice: hast verfügt
  rationale: Die aramäische Wendung bezeichnet das Erlassen einer verbindlichen Anordnung. „Verfügt“ wahrt den amtlich-rechtlichen Sinn und klingt natürlich.
- source_word: כָל אֱנָשׁ
  choice: jeder Mensch
  rationale: Das maskuline Singularwort hat hier generische Bedeutung. „Jeder Mensch“ bildet sowohl die Einzahl als auch den umfassenden Bezug ab.
- source_word: יִשְׁמַע קָל
  choice: den Klang … hört
  rationale: קָל bezeichnet den hörbaren Klang; die deutsche Wortstellung bindet die folgende Instrumentenreihe natürlich ein.
- source_word: קַרְנָא
  choice: Horn
  rationale: Der allgemeine Name eines Horninstruments wird ohne unbelegte Präzisierung wiedergegeben.
- source_word: מַשְׁרֹקִיתָא
  choice: Flöte
  rationale: Gemeint ist ein Blasinstrument; „Flöte“ ist eine verständliche, hinreichend vorsichtige Wiedergabe.
- source_word: קיתרס
  choice: Leier
  rationale: Das Lehnwort bezeichnet ein Saiteninstrument aus dem Umfeld der Kithara; „Leier“ ist im Deutschen zugänglich und vermeidet den unüblichen Fachausdruck „Kithara“.
- source_word: שַׂבְּכָא
  choice: Dreiecksharfe
  rationale: Die Bezeichnung wird traditionell mit einem dreieckigen Saiteninstrument verbunden. Die Übersetzung bleibt anschaulich, ohne das Instrument mit einer modernen Triangel zu verwechseln.
- source_word: פְסַנְתֵּרִין
  choice: Zither
  rationale: Das Wort bezeichnet ein weiteres Saiteninstrument. „Zither“ unterscheidet es verständlich von Leier und Dreiecksharfe; „Psalter“ könnte im heutigen Deutsch als Buch der Psalmen missverstanden werden.
- source_word: סִיפֹנְיָה
  choice: Sackpfeife
  rationale: „Sackpfeife“ ist die herkömmliche Deutung, doch die genaue Bestimmung des aramäischen Instrumentennamens bleibt unsicher und wird deshalb in einer Fußnote kenntlich gemacht.
- source_word: יִפֵּל וְיִסְגֻּד
  choice: sich niederwerfen und … anbeten
  rationale: 'Die beiden Verben werden getrennt bewahrt: körperliches Niederfallen und kultische Verehrung.'
- source_word: צֶלֶם דַּהֲבָא
  choice: das goldene Standbild
  rationale: „Standbild“ bezeichnet in diesem Zusammenhang ein aufgerichtetes dreidimensionales Kultbild präziser als das allgemeinere „Bild“.
theological_decisions:
- issue: Generische Bedeutung von כָל אֱנָשׁ
  choice: jeder Mensch
  alternative: jeder Mann / jeder
  rationale: Die Form ist grammatisch maskulin und singularisch, besitzt im Erlass aber umfassende, repräsentative Bedeutung. „Jeder Mensch“ erhält diese Allgemeingültigkeit, ohne den Kreis unbegründet auf Männer zu beschränken.
- issue: Religiöse Tragweite von וְיִסְגֻּד
  choice: anbeten
  alternative: huldigen / sich verneigen
  rationale: Das Handeln richtet sich in einem kultischen Zusammenhang auf das goldene Standbild. „Anbeten“ bewahrt daher die religiöse und theologische Spannung des Textes.
- issue: Modalität des königlichen Erlasses
  choice: soll
  alternative: muss / wird
  rationale: Der aramäische Satz formuliert den Inhalt einer verbindlichen Verfügung. „Soll“ drückt im Deutschen die angeordnete Verpflichtung aus, ohne die Verbform als bloße Zukunftsaussage zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Hofanrede bleibt erhalten, ohne altertümelndes „o“. Die Instrumentenliste verwendet verständliche deutsche Bezeichnungen; echte Unsicherheit wird bei סִיפֹנְיָה ausdrücklich in der Fußnote bewahrt.
