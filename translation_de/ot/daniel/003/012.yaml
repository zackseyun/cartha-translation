source:
  edition: WLC
  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: de
  text: 'Es gibt jüdische Männer, die du mit der Verwaltung der Provinz Babylon betraut hast: Schadrach, Meschach und Abed-Nego. Diese Männer haben dich, König, nicht beachtet[a]: Deinen Göttern dienen sie nicht[b], und das goldene Standbild, das du aufgestellt hast, beten sie nicht an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „haben dir, König, keine Beachtung geschenkt“ oder „haben keine Rücksicht auf dich genommen“. Die aramäische Wendung sagt wörtlich, dass sie keine Beachtung oder Rücksicht auf den König „gesetzt“ haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Aramäischen stehen hier zwei verschiedene Verben: Die Männer „dienen“ den Göttern des Königs nicht und „beten“ das goldene Standbild nicht „an“; das zweite Verb kann auch ihr Niederwerfen vor dem Bild bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: Es gibt jüdische Männer
  rationale: Die aramäische Existenzpartikel wird natürlich mit „Es gibt“ wiedergegeben. „Jüdische Männer“ bewahrt sowohl die ethnische Bezeichnung als auch das ausdrücklich männliche Substantiv, ohne das im Ausgangstext nicht eigens ausgedrückte „gewisse“ hinzuzufügen.
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: die du mit der Verwaltung der Provinz Babylon betraut hast
  rationale: מַנִּיתָ bezeichnet das Einsetzen oder Bestellen, עֲבִידַת im amtlichen Zusammenhang die Arbeit beziehungsweise Verwaltung. „Mit der Verwaltung betraut“ ist im Deutschen natürlich und gibt die amtliche Zuständigkeit wieder.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Namen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: Diese Männer
  rationale: Die demonstrative Wendung greift die eben genannten Männer nachdrücklich wieder auf.
- source_word: לָא שָׂמוּ עֲלַיִךְ מַלְכָּא טְעֵם
  choice: Diese Männer haben dich, König, nicht beachtet
  rationale: Die aramäische Wendung sagt wörtlich, dass sie gegenüber dem König keine Beachtung oder Rücksicht „gesetzt“ haben. „Nicht beachtet“ erhält den persönlichen Bezug auf den König, ohne טְעֵם vorschnell als ausdrücklichen Befehl festzulegen.
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: Deinen Göttern dienen sie nicht
  rationale: פְלַח bezeichnet hier den kultischen Dienst an einer Gottheit. „Dienen“ bewahrt die Unterscheidung zum folgenden Verb סְגַד.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: das goldene Standbild
  rationale: צֶלֶם bezeichnet ein Bild beziehungsweise eine Statue; im erzählerischen Zusammenhang ist „Standbild“ konkret und verständlich. „Golden“ gibt die aramäische Konstruktverbindung knapp wieder.
- source_word: דִּי הֲקֵימְתָּ
  choice: das du aufgestellt hast
  rationale: הֲקֵים bedeutet aufrichten oder aufstellen. „Aufgestellt“ entspricht dem wiederkehrenden Vorgang im Kapitel und klingt im Deutschen natürlich.
- source_word: לָא סָגְדִין
  choice: beten sie nicht an
  rationale: סְגַד bezeichnet Niederwerfen beziehungsweise verehrende Huldigung. Beim Standbild bringt „anbeten“ den kultischen Sinn klar zum Ausdruck, während die körperliche Nuance als mögliche Alternative bestehen bleibt.
theological_decisions:
- issue: Unterscheidung der beiden Verben für religiöses Handeln
  choice: פָלְחִין mit „dienen“ und סָגְדִין mit „anbeten“ wiedergeben
  alternative: Beide Verben mit „anbeten“ oder „verehren“ wiedergeben
  rationale: 'Der Vers verwendet bewusst zwei verschiedene aramäische Verben: eines für den kultischen Dienst an den Göttern und eines für das Niederwerfen beziehungsweise die Verehrung vor dem Standbild. Die unterschiedliche Wiedergabe bewahrt diese Spannung.'
- issue: Bezug der Missachtung auf den König oder seinen Befehl
  choice: „dich, König, nicht beachtet“
  alternative: „deinen Befehl nicht beachtet“
  rationale: Im überlieferten aramäischen Text ist der König selbst durch עֲלַיִךְ der ausdrückliche Bezugspunkt. Da טְעֵם sowohl Befehl als auch Beachtung beziehungsweise Rücksicht bezeichnen kann, wird kein nur impliziter Befehl zum direkten Objekt gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die direkte Anrede „König“ bewahrt den höfischen Rahmen, ohne das heute altertümliche „o König“. Die beiden religiösen Verben bleiben lexikalisch unterschieden.
