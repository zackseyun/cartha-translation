source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: de
  text: 'Da trat Nebukadnezar an die Öffnung des Ofens mit dem lodernden Feuer[a]. Er sagte: »Schadrach, Meschach und Abed-Nego, Diener des höchsten Gottes, kommt heraus und kommt her!« Da kamen Schadrach, Meschach und Abed-Nego mitten aus dem Feuer heraus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Ofens mit dem brennenden Feuer«; auch möglich: »des glühenden Feuerofens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; »Da« bewahrt den zeitlich-folgernden Erzählfluss in natürlichem Deutsch.
- source_word: קְרֵב ... לִתְרַע
  choice: trat ... an die Öffnung
  rationale: Das Verb bezeichnet körperliche Annäherung, und תְרַע kann Tür, Tor, Eingang oder Öffnung meinen. Bei einem Ofen ist »Öffnung« anschaulich und sachlich naheliegend.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: Ofen mit dem lodernden Feuer
  rationale: Die Wendung verbindet »Ofen« mit »Feuer« und »brennend/lodernd«. Die Formulierung gibt die emphatische Beschreibung würdig und verständlich wieder.
- source_word: עָנֵה וְאָמַר
  choice: Er begann zu sprechen und sagte
  rationale: Die feste aramäische Redeeinleitung ist wörtlich »er antwortete und sagte«, bezeichnet hier jedoch keine erkennbare Antwort auf eine Äußerung. Die gewählte Wiedergabe bewahrt die zweigliedrige Formel, ohne im Deutschen eine nicht vorhandene Gesprächssituation nahezulegen.
- source_word: עַבְדוֹהִי
  choice: Diener
  rationale: Das Wort kann Diener oder Sklaven bezeichnen. Hier steht die Zugehörigkeit zu und der Dienst für Gott im Vordergrund; »Diener« passt zum ehrerbietigen Kontext.
- source_word: אֱלָהָא עִלָּאָה
  choice: des höchsten Gottes
  rationale: Die Formulierung gibt den göttlichen Hoheitstitel idiomatisch und ohne zusätzliche dogmatische Auslegung wieder.
- source_word: פֻּקוּ וֶאֱתוֹ
  choice: kommt heraus und kommt her
  rationale: 'Die beiden Imperative werden getrennt erhalten: zuerst das Verlassen des Ofens, dann die Bewegung zum Sprecher hin.'
- source_word: מִן גּוֹא נוּרָא
  choice: mitten aus dem Feuer
  rationale: גּוֹא bezeichnet das Innere beziehungsweise die Mitte. »Mitten aus dem Feuer« erhält das eindrückliche Bild und klingt natürlich.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֱלָהָא עִלָּאָה
  choice: der höchste Gott
  alternative: Gott, der Höchste
  rationale: Die gewählte Form behandelt die Wendung als anerkennenden Hoheitstitel und bewahrt Nebukadnezars Aussage über Gottes Vorrang, ohne sie durch spätere dogmatische Kategorien zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Erzählton. Die Eigennamen folgen geläufigen deutschen Bibelschreibungen. Die eigentliche Textüberlieferung bietet an dieser Stelle keinen Anlass für eine zweite Fußnote; die im englischen Konsultationstext bei »Meschach« gesetzte Markierung scheint inhaltlich zur Ofenöffnung zu gehören und wurde daher nicht übernommen.
