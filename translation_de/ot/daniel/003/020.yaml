  terminology: „Starke Krieger“ trifft גִּבָּרֵי חַיִל im militärischen Kontext angemessen. „Heer“, „fesseln“ und „Feuerofen“ sind präzise. Die Namen Schadrach, Meschach und Abed-Nego entsprechen geläufiger deutscher Bibelschreibung. „Lodernden Feuerofen“ gibt die Häufung von Ofen, Feuer und Brennen sinnvoll wieder, ohne die traditionelle Formel erzwingen zu müssen.
