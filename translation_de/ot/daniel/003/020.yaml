source:
  edition: WLC
  text: וּ/לְ/גֻבְרִ֤ין גִּבָּֽרֵי חַ֨יִל֙ דִּ֣י בְ/חַיְלֵ֔/הּ אֲמַר֙ לְ/כַפָּתָ֔ה לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לְ/מִרְמֵ֕א לְ/אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: de
  text: Dann befahl er einigen starken Kriegern aus seinem Heer, Schadrach, Meschach und Abed-Nego zu fesseln und in den lodernden Feuerofen zu werfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: einigen starken Kriegern
  rationale: Die Wendung bezeichnet kräftige, kampferprobte Männer. „Starke Krieger“ gibt sowohl ihre körperliche Stärke als auch ihre militärische Funktion in natürlichem modernem Deutsch wieder.
- source_word: דִּי בְחַיְלֵהּ
  choice: aus seinem Heer
  rationale: חַיִל bezeichnet hier den militärischen Verband des Königs. „Aus seinem Heer“ drückt idiomatisch aus, dass die ausgewählten Männer zu diesem gehörten.
- source_word: אֲמַר
  choice: befahl er
  rationale: Das Verb bedeutet grundsätzlich „sagen“, hat hier aber durch die folgenden Infinitive eindeutig befehlenden Charakter.
- source_word: לְכַפָּתָה
  choice: zu fesseln
  rationale: Das Verb bezeichnet das Binden beziehungsweise Fesseln. „Fesseln“ passt präzise zur gewaltsamen Gefangennahme.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Eigennamen folgen geläufigen deutschen Bibelschreibungen; der Bindestrich macht die Namensglieder von Abed-Nego lesbar.
- source_word: לְמִרְמֵא
  choice: zu werfen
  rationale: „Werfen“ ist die direkte und gegenwärtig natürliche Wiedergabe des aramäischen Verbs.
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: in den lodernden Feuerofen
  rationale: „Feuerofen“ bewahrt sowohl אַתּוּן („Ofen“) als auch נוּרָא („Feuer“), während „lodernd“ die Bedeutung von יָקִדְתָּא („brennend“) natürlich wiedergibt.
theological_decisions: []
translation_notes:
