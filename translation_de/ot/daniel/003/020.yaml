  source_fidelity: 'Die Übersetzung gibt die aramäische Satzstruktur und die maßgeblichen Elemente zuverlässig wieder: der Befehl an ausgewählte kampfstarke Männer aus dem Heer, das Fesseln der drei Männer und das Hineinwerfen in den brennenden Feuerofen. „Dann“ ist als narrativer Anschluss für וּ angemessen.'
