  text: עָנֵ֣ה וְ/אָמַ֗ר הָֽא אֲנָ֨ה חָזֵ֜ה גֻּבְרִ֣ין אַרְבְּעָ֗ה שְׁרַ֨יִן֙ מַהְלְכִ֣ין בְּ/גֽוֹא נוּרָ֔/א וַ/חֲבָ֖ל לָא אִיתַ֣י בְּ/ה֑וֹן וְ/רֵוֵ/הּ֙ דִּ֣י רביעי/א דָּמֵ֖ה לְ/בַר אֱלָהִֽין־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: de
  text: 'Er antwortete und sagte: „Seht! Ich sehe vier Männer, die ungebunden mitten im Feuer umhergehen, und sie haben keinen Schaden genommen. Der vierte sieht aus wie ein Sohn der Götter.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach traditioneller christlicher Auslegung: „wie der Sohn Gottes“. Die aramäische Wendung lautet wörtlich „wie ein Sohn der Götter“ und gibt Nebukadnezars eigene Perspektive wieder.'
    reason: Bewahrt die verbreitete traditionelle Deutung, ohne die aus Sprecherperspektive naheliegende Bedeutung des aramäischen Wortlauts im Haupttext zu verdrängen.
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: Er antwortete und sagte
  rationale: Die aramäische Redeformel wird transparent wiedergegeben. Obwohl im Deutschen auch „Da sagte er“ möglich wäre, bewahrt diese Fassung den Wortlaut und den feierlichen Erzählton.
- source_word: הָא
  choice: Seht!
  rationale: Die deiktische Interjektion lenkt nachdrücklich und unvermittelt die Aufmerksamkeit auf die Beobachtung. „Seht!“ ist modern und weniger altertümlich als „Siehe!“.
- source_word: אֲנָה חָזֵה
  choice: Ich sehe
  rationale: Das Partizip bezeichnet die unmittelbare, gegenwärtige Wahrnehmung des Königs.
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: vier Männer
  rationale: גֻּבְרִין bezeichnet hier männliche Personen; die direkte Wiedergabe passt zum Zusammenhang der drei zuvor in den Ofen geworfenen Männer.
- source_word: שְׁרַיִן
  choice: ungebunden
  rationale: Das Wort steht im deutlichen Gegensatz dazu, dass die drei Männer zuvor gefesselt in den Ofen geworfen wurden. „Ungebunden“ bewahrt dieses konkrete Bild.
- source_word: מַהְלְכִין בְּגוֹא נוּרָא
  choice: mitten im Feuer umhergehen
  rationale: Die partizipiale Form schildert eine andauernde Bewegung; „umhergehen“ gibt den Vorgang idiomatisch wieder, während „mitten im Feuer“ die räumliche Aussage bewahrt.
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: und sie haben keinen Schaden genommen
  rationale: Die idiomatische deutsche Formulierung gibt die ausdrückliche Abwesenheit jeder Verletzung wieder, ohne den Sinn auszuweiten.
- source_word: רֵוֵהּ דִּי רביעיא
  choice: Der vierte sieht aus
  rationale: רֵוֵהּ bezeichnet die sichtbare Erscheinung oder Gestalt. Die Formulierung bezieht dies natürlich auf den vierten Mann und leitet den Vergleich ein.
- source_word: דָּמֵה לְבַר אֱלָהִין
  choice: wie ein Sohn der Götter
  rationale: דָּמֵה drückt Ähnlichkeit, nicht Identität aus. Die indefinite Wendung und der formal plurale Ausdruck אֱלָהִין werden aus der Perspektive Nebukadnezars am naheliegendsten mit „ein Sohn der Götter“ wiedergegeben.
theological_decisions:
- issue: Identität der vierten Gestalt in Nebukadnezars Beschreibung
  choice: wie ein Sohn der Götter
  alternative: wie der Sohn Gottes; wie ein göttliches Wesen
  rationale: Der Vers gibt zunächst Nebukadnezars staunende Wahrnehmung wieder. Das Aramäische erzwingt weder eine ausdrückliche messianische Identifizierung noch die bestimmte Form „der Sohn Gottes“. Eine traditionelle christologische Deutung bleibt möglich, wird aber nicht in den Wortlaut des Königs eingetragen; sie wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf „Seht!“ vermittelt die plötzliche Verwunderung; „ungebunden“ hält den erzählerischen Kontrast zu den zuvor gefesselten Männern fest. Die Schlussformulierung wahrt bewusst die beobachtende und theologisch nicht abschließend aufgelöste Perspektive des Königs.
