translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut lesbarem Erzählfluss. Die semitische Redeformel wird beim König teilweise bewahrt, bei der Antwort der Ratgeber jedoch idiomatisch verkürzt. Die Fußnotenmarker stehen bei den jeweils erläuterten Ausdrücken; damit werden die in der englischen Konsultationsfassung offenbar vertauschten Marker sachgerecht zugeordnet.
