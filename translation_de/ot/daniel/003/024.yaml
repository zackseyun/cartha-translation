base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: de
  text: 'Da erschrak König Nebukadnezar und stand hastig auf. Er wandte sich an seine Ratgeber[a] und fragte: »Haben wir nicht drei Männer gefesselt mitten in das Feuer[b] geworfen?« Sie antworteten dem König: »Gewiss, König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »an seine Beamten« beziehungsweise »an seine Amtsträger«; das aramäische Wort bezeichnet Männer im Dienst des königlichen Hofes.
    reason: lexical_alternative
  - marker: b
    text: Oder kürzer »ins Feuer«; im Aramäischen steht ausführlicher »in das Innere des Feuers«.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das unmittelbar folgende Geschehen ein; »Da« ist im Deutschen natürlich und wahrt den narrativen Fortgang.
- source_word: תְּוַהּ
  choice: erschrak
  rationale: Das Verb bezeichnet Bestürzung, Erstaunen oder Erschrecken. Im Zusammenhang mit der unerwarteten Wahrnehmung des Königs gibt »erschrak« die emotionale Reaktion prägnant wieder.
- source_word: בְּהִתְבְּהָלָה
  choice: hastig
  rationale: Der Ausdruck verbindet Eile mit innerer Erregung. »Hastig« bewahrt die Eile, während »erschrak« bereits die emotionale Bestürzung ausdrückt.
- source_word: עָנֵה וְאָמַר
  choice: Er ergriff das Wort und sagte
  rationale: Die semitische Redeformel wird erkennbar bewahrt, aber in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: לְהַדָּבְרוֹהִי
  choice: zu seinen Ratgebern
  rationale: Der Ausdruck bezeichnet Personen im königlichen Hof- und Verwaltungsdienst. »Ratgeber« passt zur Szene, ohne ihre genaue Amtsstellung stärker festzulegen, als der Text erlaubt.
- source_word: הֲלָא
  choice: Haben wir nicht
  rationale: Die Partikel eröffnet eine rhetorische Frage, die eine bestätigende Antwort erwartet.
- source_word: גֻבְרִין תְּלָתָא
  choice: drei Männer
  rationale: Direkte und kontextgerechte Wiedergabe der aramäischen Nominalgruppe.
- source_word: רְמֵינָא
  choice: geworfen
  rationale: Das Verb bedeutet »werfen« oder »schleudern«; »geworfen« ist präzise und in modernem Deutsch ungekünstelt.
- source_word: לְגוֹא נוּרָא
  choice: mitten ins Feuer
  rationale: Die Formulierung erhält die räumliche Aussage »ins Innere/in die Mitte des Feuers« in natürlichem Deutsch.
- source_word: מְכַפְּתִין
  choice: gefesselt
  rationale: Das Partizip beschreibt den Zustand der Männer beim Hineinwerfen; »gefesselt« ist knapp und genau.
- source_word: עָנַיִן וְאָמְרִין
  choice: Sie antworteten
  rationale: Im Deutschen genügt das einfache Redeverb; eine wörtliche Doppelung wie »sie antworteten und sagten« wäre unnötig schwerfällig.
- source_word: יַצִּיבָא
  choice: Gewiss
  rationale: Das Wort bestätigt die Aussage als wahr oder sicher. »Gewiss« ist eine knappe, würdige Antwort auf die rhetorische Frage.
