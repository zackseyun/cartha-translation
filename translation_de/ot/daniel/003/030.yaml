base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/030.yaml
  text: Then the king caused Shadrach[a], Meshach, and Abednego to prosper in the province of Babylon.
translation:
  language: de
  text: Daraufhin verhalf der König Schadrach, Meschach und Abed-Nego in der Provinz Babylon zu Erfolg[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der König beförderte Schadrach, Meschach und Abed-Nego in der Provinz Babylon.“ Das aramäische Verb kann bedeuten, jemanden erfolgreich zu machen oder gedeihen zu lassen; in diesem Zusammenhang kann dies auch einen amtlichen Aufstieg einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Daraufhin
  rationale: Der aramäische Erzählmarker führt die Folge des vorangehenden Geschehens ein; „Daraufhin“ gibt sowohl die zeitliche Abfolge als auch den resultativen Zusammenhang natürlich wieder.
- source_word: מַלְכָּא
  choice: der König
  rationale: Der bestimmte Ausdruck bedeutet „der König“. Nebukadnezar ist aus dem Kontext bekannt, wird hier im Ausgangstext aber nicht erneut namentlich genannt.
- source_word: הַצְלַח
  choice: ließ … Erfolg haben
  rationale: Die Kausativform bezeichnet, dass der König die Männer erfolgreich sein beziehungsweise gedeihen ließ. Diese Wiedergabe bewahrt die königliche Veranlassung und legt sich nicht vorschnell auf eine amtliche Beförderung fest.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Eigennamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben.
- source_word: בִּמְדִינַת בָּבֶל
  choice: in der Provinz Babylon
  rationale: מְדִינָה bezeichnet hier einen Verwaltungsbezirk beziehungsweise eine Provinz; „Provinz Babylon“ entspricht dem imperialen Kontext und ist im Deutschen verständlich.
