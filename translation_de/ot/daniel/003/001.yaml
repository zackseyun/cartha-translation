source:
  edition: WLC
  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: de
  text: König Nebukadnezar machte ein Standbild[a] aus Gold. Es war sechzig Ellen[b] hoch und sechs Ellen breit. Er stellte es in der Ebene von Dura in der Provinz Babylon auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Bildnis aus Gold«. Das aramäische Wort kann ein Bildnis oder eine Statue bezeichnen. Aufgrund des folgenden Zusammenhangs wäre auch »Götzenbild« denkbar; der Haupttext bewahrt jedoch die zunächst neutralere Ausdrucksweise dieses Verses.'
    reason: Lexikalische Alternative
  - marker: b
    text: Eine Elle war ein antikes Längenmaß, ungefähr die Entfernung vom Ellenbogen bis zu den Fingerspitzen.
    reason: Kulturgeschichtliche Erläuterung
lexical_decisions:
- source_word: מַלְכָּא
  choice: König
  rationale: 'In Verbindung mit dem Eigennamen ist das Wort als vorangestellter Titel natürlich wiederzugeben: »König Nebukadnezar«.'
- source_word: עֲבַד
  choice: ließ … anfertigen
  rationale: Das aramäische Verb bedeutet allgemein »machen«. Bei einem König und einem monumentalen Standbild ist die deutsche Kausativform idiomatisch, ohne eine eigenhändige Herstellung zu behaupten.
- source_word: צְלֵם
  choice: Standbild
  rationale: Der Begriff bezeichnet ein Bildnis beziehungsweise eine Statue. »Standbild« passt zu den angegebenen Maßen und bewahrt gegenüber »Götzenbild« die zunächst neutrale Benennung des Verses.
- source_word: דִּי דְהַב
  choice: aus Gold
  rationale: Die Materialangabe wird direkt wiedergegeben. Die Formulierung lässt sprachlich offen, ob das Standbild massiv oder lediglich mit Gold überzogen war.
- source_word: רוּמֵהּ אַמִּין שִׁתִּין
  choice: Es war sechzig Ellen hoch
  rationale: Die Maßangabe wird in natürlicher deutscher Form ausgedrückt; רוּם bezeichnet die Höhe.
- source_word: פְּתָיֵהּ אַמִּין שִׁת
  choice: sechs Ellen breit
  rationale: פְּתָי bezeichnet Breite; die prädikative Form ist im modernen Deutschen klar und knapp.
- source_word: אֲקִימֵהּ
  choice: Er stellte es … auf
  rationale: Das Verb bezeichnet das Aufrichten oder Aufstellen und wird hier konkret und idiomatisch wiedergegeben.
- source_word: בְּבִקְעַת
  choice: in der Ebene
  rationale: Das Substantiv kann eine Ebene oder Talebene bezeichnen. »Ebene« entspricht dem wahrscheinlich gemeinten weitläufigen, flachen Gelände.
- source_word: דּוּרָא
  choice: Dura
  rationale: Der Ortsname wird transliteriert und nicht übersetzt.
- source_word: בִּמְדִינַת בָּבֶל
  choice: in der Provinz Babylon
  rationale: מְדִינָה bezeichnet hier einen Verwaltungsbezirk; »Provinz Babylon« gibt die Konstruktverbindung direkt und verständlich wieder.
theological_decisions:
- issue: Ob צְלֵם ausdrücklich religiös wertend übersetzt werden soll
  choice: Standbild
  alternative: Götzenbild; Bildnis; Statue
  rationale: Der einzelne Vers beschreibt Gegenstand, Material, Maße und Standort, bezeichnet ihn jedoch noch nicht ausdrücklich als Götzen. »Standbild« wahrt diese narrative Zurückhaltung, während der folgende Zusammenhang seine kultische Funktion erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die langen aramäischen Satzglieder werden zur besseren Verständlichkeit auf drei deutsche Sätze verteilt. Die Maßangaben bleiben in Ellen stehen und werden in der Fußnote kulturgeschichtlich erläutert.
