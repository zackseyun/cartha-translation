source:
  edition: WLC
  text: וְ/הֵ֣ן לָ֔א יְדִ֥יעַ לֶהֱוֵא לָ֖/ךְ מַלְכָּ֑/א דִּ֤י ל/אלהי/ך לָא איתי/נא פָֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א נִסְגֻּֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: de
  text: 'Wenn aber nicht,[a] dann sollst du wissen, König: Wir werden deinen Göttern nicht dienen und uns nicht vor dem goldenen Standbild niederwerfen, das du aufgestellt hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch selbst wenn nicht“, im Sinne des vorausgehenden Verses: „selbst wenn er uns nicht rettet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵן לָא
  choice: Wenn aber nicht
  rationale: Die knappe aramäische Bedingungsformel bezeichnet den Gegenfall zu der in Vers 17 geäußerten Zuversicht. Die Ellipse bleibt erhalten; die Alternative „selbst wenn nicht“ macht den zugestandenen Gegenfall deutlicher.
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: sollst du wissen
  rationale: Die unpersönliche Wendung bedeutet wörtlich etwa „es sei dir bekannt“. Die gewählte Form ist im heutigen Deutsch natürlich, bestimmt und wahrt den feierlichen Erklärungston.
- source_word: מַלְכָּא
  choice: König
  rationale: Der bestimmte Ausdruck wird hier als direkte Anrede gebraucht. Im modernen Deutschen ist „König“ ohne altertümelndes „o“ würdevoll und klar.
- source_word: דִּי
  choice: ':'
  rationale: Die Partikel leitet den Inhalt dessen ein, was der König wissen soll. Im Deutschen gibt ein Doppelpunkt diese Funktion natürlicher wieder als ein ausdrücklich gesetztes „dass“.
- source_word: לֵאלָהָיִךְ
  choice: deinen Göttern
  rationale: Der Plural mit Possessivsuffix bezeichnet die Götter des Königs; die vom Verb verlangte Beziehung wird im Deutschen durch den Dativ ausgedrückt.
- source_word: לָא אִיתַנָא פָלְחִין
  choice: wir werden ... nicht dienen
  rationale: Die negierte Partizipialkonstruktion drückt in diesem Zusammenhang die feste, auf die Zukunft gerichtete Weigerung aus.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: und ... vor dem goldenen Standbild
  rationale: צֶלֶם bezeichnet hier ein aufgerichtetes Bildnis. „Standbild“ ist im Deutschen konkreter und natürlicher als „Bild“, ohne den Gegenstand unnötig genauer zu bestimmen; דַּהֲבָא wird attributiv als „goldenen“ wiedergegeben.
- source_word: דִּי הֲקֵימְתָּ
  choice: das du aufgestellt hast
  rationale: Der Relativsatz beschreibt die abgeschlossene Handlung des Königs; das Perfekt stellt ihren fortbestehenden Bezug zur gegenwärtigen Lage heraus.
- source_word: לָא נִסְגֻּד
  choice: uns nicht ... niederwerfen
  rationale: Das Verb bezeichnet die körperliche Niederwerfung als Huldigung. Die konkrete Handlung bleibt sichtbar, während ihre kultische Bedeutung aus dem Zusammenhang hervorgeht.
theological_decisions:
- issue: Wiedergabe der elliptischen Bedingungsformel am Versanfang
  choice: Wenn aber nicht
  alternative: Doch selbst wenn er uns nicht rettet
  rationale: Der vorausgehende Vers liefert den unausgesprochenen Bezug auf Gottes Rettung, doch der vorliegende Text nennt ihn nicht ausdrücklich. Die knappe Wiedergabe bewahrt sowohl die Ellipse als auch die Spannung zwischen Vertrauen auf Rettung und Treue unabhängig vom Ausgang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt entschlossen, ohne unnötig altertümliche Anredeformen. Der elliptische Versanfang wird bewusst nicht ergänzt; eine Fußnote erläutert die mögliche sinngemäße Lesart.
