base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/009.yaml
  text: They answered and said to King Nebuchadnezzar[a], “O king, live forever!”
translation:
  language: de
  text: 'Sie antworteten König Nebukadnezar und sagten: »O König, lebe ewig[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramäisch wörtlich: „für Zeitalter“. Die Wendung ist ein üblicher höfischer Huldigungsruf mit der Bedeutung „lebe ewig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: Sie antworteten
  rationale: Das Peal-Perfekt im Plural eröffnet die übliche aramäische Antwortformel. „Sie antworteten“ gibt sowohl den Erzähltempus als auch die formelhafte Wendung treffend wieder.
- source_word: וְאָמְרִין
  choice: und sagten
  rationale: Das Partizip übernimmt in dieser formelhaften Verbindung die Funktion eines finiten Erzählverbs. „Und sagten“ bewahrt die doppelte aramäische Redeformel, ohne im Deutschen unverständlich zu wirken.
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: König Nebukadnezar
  rationale: Die Präposition bezeichnet den Adressaten; מַלְכָּא steht als Titel beim Namen. Die im Deutschen natürliche Stellung lautet „König Nebukadnezar“.
- source_word: מַלְכָּא
  choice: O König
  rationale: Die zweite Nennung des Titels ist eine direkte, höfische Anrede. „O König“ erhält ihren feierlichen und formelhaften Charakter.
- source_word: לְעָלְמִין
  choice: ewig
  rationale: Die Pluralform bedeutet wörtlich etwa „für Zeitalter“, bezeichnet in der höfischen Akklamation aber idiomatisch eine unbegrenzte Lebensdauer.
- source_word: חֱיִי
  choice: lebe
  rationale: Der Imperativ Singular bildet zusammen mit לְעָלְמִין den höfischen Segens- und Huldigungsruf „lebe ewig“.
theological_decisions: []
