  text: וּ/נְבוּכַדְנֶצַּ֣ר מַלְכָּ֡/א שְׁלַ֡ח לְ/מִכְנַ֣שׁ לַֽ/אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ/א֩ גְדָ֨בְרַיָּ֤/א דְּתָבְרַיָּ/א֙ תִּפְתָּיֵ֔/א וְ/כֹ֖ל שִׁלְטֹנֵ֣י מְדִֽינָתָ֑/א לְ/מֵתֵא֙ לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: de
  text: Dann ließ König Nebukadnezar die Satrapen, Präfekten, Statthalter, Räte, Schatzmeister, Richter, Magistrate und alle Amtsträger der Provinzen zusammenrufen, damit sie zur Einweihung des Standbildes[a] kämen, das König Nebukadnezar aufgestellt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bild. Der aramäische Ausdruck kann allgemein ein Bild und in diesem Zusammenhang ein monumentales Standbild bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְמִכְנַשׁ
  choice: ließ … zusammenrufen
  rationale: Die Verbindung bezeichnet das Aussenden mit dem Ziel, Personen zu versammeln. Die gewählte deutsche Wendung gibt den königlichen Auftrag in natürlicher Verwaltungssprache wieder.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: Satrapen
  rationale: Der persische Verwaltungstitel wird als historischer Fachbegriff beibehalten und bewahrt den imperialen Kontext.
- source_word: סִגְנַיָּא
  choice: Präfekten
  rationale: Ein formeller Titel für hochrangige Verwaltungsbeamte; „Präfekten“ ist eine etablierte und unterscheidbare Wiedergabe.
- source_word: פַחֲוָתָא
  choice: Statthalter
  rationale: Die Bezeichnung meint Provinzverwalter; „Statthalter“ ist im historischen Kontext klar und vermeidet eine Doppelung mit „Satrapen“.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: Räte
  rationale: Die genaue Amtsfunktion ist unsicher. „Räte“ wahrt den wahrscheinlichen beratenden Charakter, ohne eine zu präzise moderne Behörde vorauszusetzen.
- source_word: גְדָבְרַיָּא
  choice: Schatzmeister
  rationale: Der Ausdruck wird gewöhnlich auf Beamte des Schatz- oder Finanzwesens bezogen.
- source_word: דְּתָבְרַיָּא
  choice: Richter
  rationale: Der Titel bezeichnet wahrscheinlich Amtsträger mit rechtsprechender Funktion; „Richter“ ist die direkte und verständliche Entsprechung.
- source_word: תִּפְתָּיֵא
  choice: Magistrate
  rationale: Die genaue Nuance des Titels ist umstritten. „Magistrate“ bewahrt den allgemeinen juristisch-administrativen Rang, ohne ihn enger festzulegen.
- source_word: וְכֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: und alle übrigen Amtsträger der Provinzen
  rationale: Die Sammelbezeichnung umfasst die provinziellen Machthaber beziehungsweise Beamten. „Übrigen“ macht im Deutschen deutlich, dass die Wendung die vorausgehende Ämterliste zusammenfassend ergänzt.
- source_word: לְמֵתֵא
  choice: Sie sollten … kommen
  rationale: Der Infinitiv bedeutet wörtlich „zu kommen“. Ein eigener deutscher Satz hält diesen Sinn fest und löst zugleich die lange aramäische Satzperiode lesefreundlich auf.
- source_word: חֲנֻכַּת
  choice: Einweihung
  rationale: Das Substantiv bezeichnet die feierliche Widmung oder Ingebrauchnahme; „Einweihung“ ist hierfür die natürliche deutsche Entsprechung.
- source_word: צַלְמָא
  choice: Standbild
  rationale: Das Wort kann allgemein ein Bild oder Abbild bezeichnen; angesichts des aufgerichteten monumentalen Gegenstands ist „Standbild“ im Kontext treffend, während die weitere Bedeutung in der Fußnote erhalten bleibt.
- source_word: הֲקֵים
  choice: aufgestellt hatte
  rationale: Das Verb bezeichnet hier das Errichten beziehungsweise Aufstellen des Standbildes; das Plusquamperfekt entspricht dem zeitlichen Verhältnis im deutschen Satz.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die historische Verwaltungsterminologie bleibt erhalten; die lange Ämterliste wird klar gegliedert. Die aramäische Satzperiode ist zur besseren Verständlichkeit in zwei deutsche Sätze aufgeteilt, ohne inhaltliche Elemente auszulassen.
