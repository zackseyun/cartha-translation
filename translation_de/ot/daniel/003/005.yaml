  variant: modern standard German
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: de
  text: Wenn ihr den Klang von Horn, Flöte, Leier, Trigon, Psalter, Sackpfeife[a] und von jeder Art von Musik hört, sollt ihr niederfallen und dem goldenen Standbild huldigen[b], das König Nebukadnezar aufgestellt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Identifizierung des hier mit »Sackpfeife« wiedergegebenen Instruments ist unsicher; vorgeschlagen wird auch »Doppelflöte«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »anbeten«. Das aramäische Verb bezeichnet eine ehrerbietige Niederwerfung und hat hier, da sie einem Standbild gilt, den Sinn götzendienerischer Verehrung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  choice: Sobald
  rationale: Die aramäische Zeitangabe bedeutet wörtlich »zu der Zeit, da«. Im Zusammenhang bezeichnet sie den Zeitpunkt, an dem das musikalische Signal ertönt; »sobald« gibt dies natürlich und präzise wieder.
- source_word: קָל
  choice: den Klang
  rationale: Das Wort bezeichnet hier das hörbare Signal der aufgezählten Instrumente. »Klang« ist im musikalischen Zusammenhang idiomatischer als »Stimme« oder »Geräusch«.
- source_word: קַרְנָא
  choice: Horn
  rationale: Die allgemeine Bezeichnung wahrt die Unbestimmtheit des aramäischen Ausdrucks und legt sich nicht unnötig auf ein Widderhorn oder ein bestimmtes historisches Instrument fest.
- source_word: מַשְׁרוֹקִיתָא
  choice: Flöte
  rationale: Gemeint ist ein Blasinstrument aus dem Bereich Flöte oder Pfeife. »Flöte« ist im modernen Deutschen verständlich, ohne eine allzu genaue Bauart zu behaupten.
- source_word: קיתרוס
  choice: Leier
  rationale: Das Lehnwort bezeichnet ein Saiteninstrument aus dem Bereich der Kithara beziehungsweise Leier. »Leier« bietet eine verständliche deutsche Entsprechung.
- source_word: סַבְּכָא
  choice: Trigon
  rationale: Die genaue Art des vermutlich dreieckigen Saiteninstruments ist unsicher. Der Fachname »Trigon« erhält die Unterscheidung von den anderen Instrumenten, ohne eine sichere Identifizierung vorzutäuschen.
- source_word: פְּסַנְתֵּרִין
  choice: Psalter
  rationale: »Psalter« ist die herkömmliche Bezeichnung für dieses Saiteninstrument und unterscheidet es in der Aufzählung von Leier und Trigon.
- source_word: סוּמְפֹּנְיָה
  choice: Sackpfeife
  rationale: Die Identifizierung des Instruments ist umstritten. »Sackpfeife« ist eine verbreitete Deutung; die Unsicherheit und eine wichtige Alternative werden in einer Fußnote kenntlich gemacht.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: und jeder Art von Musik
  rationale: Die Wendung fasst die musikalischen Klänge umfassend zusammen. Diese Formulierung bleibt nahe am Wortlaut und klingt zugleich natürlich.
- source_word: תִּפְּלוּן
  choice: sollt ihr niederfallen
  rationale: Der Imperfekt hat in der königlichen Anweisung befehlenden Sinn. »Sollt ihr« vermittelt diesen verbindlichen Charakter in gegenwärtigem Deutsch.
- source_word: וְתִסְגְּדוּן
  choice: huldigen
  rationale: Das Verb bezeichnet das Sich-Niederwerfen als Ehrbezeugung. »Huldigen« bewahrt diese Grundbedeutung, während der eindeutig götzendienerische Kontext bestehen bleibt.
- source_word: צֶלֶם דַּהֲבָא
  choice: dem goldenen Standbild
  rationale: צֶלֶם bezeichnet ein Bild beziehungsweise eine Statue. »Standbild« passt zur aufgerichteten monumentalen Darstellung und ist im Deutschen klarer als das allgemeinere »Bild«.
theological_decisions:
- issue: Wiedergabe von סגד im Zusammenhang mit Götzendienst
  choice: huldigen
  alternative: anbeten; sich niederwerfen vor
  rationale: Das Verb bezeichnet zunächst eine körperlich vollzogene Ehrbezeugung beziehungsweise Unterwerfung und kann im religiösen Zusammenhang Anbetung ausdrücken. Da die Huldigung hier einem Standbild gilt, ist der Vorgang im Erzählzusammenhang eindeutig götzendienerisch; dennoch sollte die Übersetzung den lexikalischen Gehalt nicht vorschnell ausschließlich mit »anbeten« festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bildet den feierlich-formelhaften königlichen Befehl klar ab. Weniger geläufige historische Instrumentennamen bleiben dort erhalten, wo eine präzisere moderne Identifizierung unsicher wäre. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
