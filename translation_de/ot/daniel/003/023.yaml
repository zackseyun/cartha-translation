base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: de
  text: Und diese drei Männer – Schadrach, Meschach und Abed-Nego – fielen[a] gefesselt mitten in den lodernden Feuerofen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker vom Zusammenhang her formuliert: »wurden gefesselt mitten in den lodernden Feuerofen geworfen«. Das aramäische Verb selbst lautet einfach »fielen«; aus dem vorausgehenden Zusammenhang geht jedoch hervor, dass man sie hineingeworfen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: diese drei Männer
  rationale: Die Wendung bezeichnet die drei unmittelbar genannten männlichen Personen. Die natürliche deutsche Wortfolge gibt Demonstrativpronomen, Zahl und Substantiv vollständig wieder.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Eigennamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben.
- source_word: נְפַלוּ
  choice: fielen
  rationale: Das aramäische Verb bedeutet schlicht »fallen«. Der weitere Zusammenhang zeigt zwar, dass die Männer hineingeworfen worden waren; diese Ursache wird jedoch nicht in das Verb dieses Verses eingetragen.
- source_word: לְגוֹא
  choice: mitten in
  rationale: Die Präposition mit dem Ausdruck für das Innere beziehungsweise die Mitte bezeichnet eine Bewegung ins Innere. »Mitten in« bewahrt die räumliche Anschaulichkeit und ist idiomatisches Deutsch.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: den lodernden Feuerofen
  rationale: Die aramäische Verbindung bezeichnet einen Ofen mit brennendem beziehungsweise loderndem Feuer. »Lodernder Feuerofen« bildet sowohl das Feuer als auch dessen Brennen natürlich und anschaulich ab.
- source_word: מְכַפְּתִין
  choice: gefesselt
  rationale: Das passive Partizip bezeichnet den Zustand des Gebundenseins. »Gefesselt« ist im Hinblick auf Personen in modernem Deutsch natürlich, ohne eine nicht ausdrücklich genannte Art der Fesselung hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einfache Erzählstruktur und das ausdrücklich verwendete Verb »fielen« bleiben erhalten; die Apposition mit Gedankenstrichen unterstützt die Lesbarkeit. Der Ausdruck »lodernder Feuerofen« vermeidet eine schwerfällige wörtliche Häufung, ohne das Feuermotiv abzuschwächen.
