  source_fidelity: 'Die Übersetzung gibt die aramäische Aussage zutreffend wieder: Die drei Männer antworten dem König Nebukadnezar und erklären, dass sie es in dieser Angelegenheit nicht für nötig halten, ihm zu erwidern. Die explizite Anrede des Königs bleibt erhalten; »in dieser Sache« deckt עַל־דְּנָה פִּתְגָם angemessen ab.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die Straffung von »antworteten und sagten« zu »antworteten« ist idiomatisch und verursacht keinen relevanten Bedeutungsverlust. »Wir haben es nicht nötig« vermittelt die entschlossene, aber nicht ausdrücklich beleidigende Haltung des aramäischen Textes.
  terminology: Die etablierten deutschen Namensformen Schadrach, Meschach, Abed-Nego und Nebukadnezar sind korrekt. »König« und die sachliche Umschreibung der fehlenden Notwendigkeit sind registergerecht und theologisch unauffällig.
