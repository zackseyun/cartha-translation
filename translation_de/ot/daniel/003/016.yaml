source:
  edition: WLC
  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: de
  text: 'Schadrach, Meschach und Abed-Nego antworteten dem König Nebukadnezar: »Wir haben es nicht nötig, dir in dieser Sache eine Antwort zu geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: antworteten
  rationale: Die aramäische Doppelwendung »antworteten und sagten« wird im natürlichen Deutschen knapp mit »antworteten« wiedergegeben, ohne Bedeutungsverlust.
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: Wir haben es nicht nötig
  rationale: חֲשַׁח bezeichnet hier das Nötighaben bzw. die Notwendigkeit; die Wendung drückt aus, dass keine Antwort erforderlich ist.
- source_word: עַל דְּנָה פִּתְגָם
  choice: in dieser Sache
  rationale: פִּתְגָם kann »Wort, Angelegenheit, Sache« bedeuten; im Kontext bezeichnet es die vorliegende Forderung bzw. Angelegenheit.
- source_word: לַהֲתָבוּתָךְ
  choice: dir ... eine Antwort zu geben
  rationale: Der Infinitiv mit pronominalem Suffix bezeichnet das Erwidern gegenüber dem König; die deutsche Formulierung bewahrt den Adressaten ausdrücklich.
theological_decisions:
- issue: Ton der Antwort gegenüber dem König
  choice: sachliche Feststellung fehlender Notwendigkeit
  alternative: »Wir weigern uns, dir zu antworten«
  rationale: Der aramäische Text erklärt, dass eine Antwort nicht nötig ist; er formuliert nicht ausdrücklich eine Verweigerung. Die Spannung zwischen Respekt und Entschlossenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitische Redundanz »antworteten und sagten« wurde idiomatisch gestrafft; Namen folgen geläufigen deutschen Bibelschreibungen.
