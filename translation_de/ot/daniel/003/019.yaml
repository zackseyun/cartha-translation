source:
  edition: WLC
  text: בֵּ/אדַ֨יִן נְבוּכַדְנֶצַּ֜ר הִתְמְלִ֣י חֱמָ֗א וּ/צְלֵ֤ם אַנְפּ֨וֹ/הִי֙ אשתנו עַל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ עָנֵ֤ה וְ/אָמַר֙ לְ/מֵזֵ֣א לְ/אַתּוּנָ֔/א חַ֨ד שִׁבְעָ֔ה עַ֛ל דִּ֥י חֲזֵ֖ה לְ/מֵזְיֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: de
  text: Da wurde Nebukadnezar von Zorn erfüllt, und sein Gesichtsausdruck gegenüber Schadrach, Meschach und Abed-Nego veränderte sich. Daraufhin befahl er, den Ofen siebenmal so stark[a] zu heizen, wie man ihn gewöhnlich heizte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „siebenfach“. Die aramäische Wendung bezeichnet eine Erhitzung auf das Siebenfache der üblichen beziehungsweise als angemessen geltenden Stärke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da / Daraufhin
  rationale: Der aramäische Erzählmarker führt das nächste Geschehen ein. Die beiden natürlichen deutschen Wiedergaben erhalten den zeitlichen und folgernden Zusammenhang, ohne schwerfällig zu wirken.
- source_word: הִתְמְלִי חֱמָא
  choice: wurde von Zorn erfüllt
  rationale: Die Wendung bezeichnet das völlige Ergriffenwerden von heftigem Zorn. Die passive Formulierung bewahrt Bild und Intensität des Aramäischen.
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  choice: sein Gesichtsausdruck … veränderte sich
  rationale: Wörtlich ist vom Bild oder Aussehen seines Gesichts die Rede. „Gesichtsausdruck“ gibt die sichtbare Veränderung idiomatisch und konkret wieder.
- source_word: עַל
  choice: gegenüber
  rationale: Die Präposition bezeichnet hier die Ausrichtung seines veränderten Gesichtsausdrucks auf die drei Männer. Der feindselige Sinn ergibt sich eindeutig aus Zorn und Kontext; „gegenüber“ vermeidet eine im Deutschen unnatürliche Verbindung mit „veränderte sich“.
- source_word: עָנֵה וְאָמַר
  choice: Daraufhin befahl er
  rationale: Die semitische Formel lautet wörtlich „er antwortete und sagte“. Da der folgende Infinitiv in diesem Zusammenhang einen Befehl ausdrückt, gibt „befahl“ die kommunikative Funktion in natürlichem Deutsch wieder.
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: den Ofen … zu heizen
  rationale: Die Infinitivverbindung bezeichnet das Erhitzen des Ofens und hängt vom vorausgehenden Befehl ab.
- source_word: חַד שִׁבְעָה
  choice: siebenmal so stark
  rationale: Die aramäische Wendung bezeichnet eine siebenfache Intensität. Diese Formulierung ist im modernen Deutsch klarer als das missverständliche „siebenmal stärker“.
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: wie man ihn gewöhnlich heizte
  rationale: Die idiomatische Wendung bedeutet wörtlich etwa „über das hinaus, was man für angemessen hielt, ihn zu heizen“. Gemeint ist die übliche beziehungsweise als angemessen geltende Heizstärke.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Eigennamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die konkrete Aussage über Zorn und Gesichtsausdruck bleibt erhalten; die semitische Redeeinleitung wird funktionsgerecht als Befehl wiedergegeben. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung zur siebenfachen Erhitzung.
