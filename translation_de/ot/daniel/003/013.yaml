base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: de
  text: Da befahl Nebukadnezar voller Zorn und Wut, Schadrach, Meschach und Abed-Nego herbeizubringen. Dann wurden diese Männer vor den König gebracht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da / Daraufhin
  rationale: Der aramäische Erzählmarker führt jeweils das nächste Geschehen ein. Die beiden natürlichen deutschen Wiedergaben erhalten die zeitlich-folgernde Erzählbewegung, ohne unnötig steif zu wirken.
- source_word: בִּרְגַז וַחֲמָה
  choice: voller Zorn und Wut
  rationale: Die beiden Substantive bezeichnen und verstärken Nebukadnezars heftigen Gemütszustand. „Voller“ gibt die präpositionale Wendung idiomatisch wieder, während „Zorn und Wut“ die rhetorische Doppelung bewahrt.
- source_word: אֲמַר לְהַיְתָיָה
  choice: befahl, … herbeizubringen
  rationale: „Sagen“ mit dem Infinitiv des kausativen Verbs hat hier Befehlsfunktion. Die Formulierung gibt sowohl den Befehl als auch das veranlasste Bringen klar und natürlich wieder.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Personennamen werden nach etablierten deutschen Bibelkonventionen transliteriert und nicht übersetzt.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer
  rationale: Die Wendung verweist unmittelbar auf die drei zuvor genannten Männer zurück; „diese Männer“ erhält diese deiktische Nähe.
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: wurden … vor den König gebracht
  rationale: Die Verbform ist im Kontext passiv-kausativ zu verstehen und bezeichnet nicht bloß ihr Kommen. „Vor den König“ ist eine natürliche deutsche Wiedergabe der höfischen Gegenwartsformel.
theological_decisions: []
