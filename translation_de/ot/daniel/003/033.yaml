  source_fidelity: 'Der deutsche Text gibt die aramäische Ausrufsstruktur und den Parallelismus zuverlässig wieder: אָתוֹהִי / תִמְהוֹהִי als „seine Zeichen“ / „seine Wunder“, die qualitativen Prädikate „groß“ und „mächtig“, sowie die wiederholte Reichs- und Herrschaftsaussage. „währt von Generation zu Generation“ ist eine idiomatische und sinnentsprechende Wiedergabe von עִם דָּר וְדָר, ohne die aramäische Wendung unnötig zu verengen.'
