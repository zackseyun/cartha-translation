  terminology: „Zeichen und Wunder“, „Königreich“ und „Herrschaft“ sind treffende, registergerechte Entsprechungen. „Ewiges Königreich“ gibt מַלְכוּת עָלַם sachlich wieder; die Alternative „immerwährendes Königreich“ ist als Fußnote sinnvoll. Die Pronomen bleiben zu Recht ohne zusätzlichen theologischen Kommentar.
