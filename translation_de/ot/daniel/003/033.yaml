language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָת֨וֹ/הִי֙ כְּ/מָ֣ה רַבְרְבִ֔ין וְ/תִמְה֖וֹ/הִי כְּ/מָ֣ה תַקִּיפִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/שָׁלְטָנֵ֖/הּ עִם דָּ֥ר וְ/דָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: de
  text: Wie groß sind seine Zeichen[a], und wie mächtig seine Wunder! Sein Königreich ist ein ewiges Königreich[b], und seine Herrschaft währt von Generation zu Generation.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Wunderzeichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein immerwährendes Königreich“.'
    reason: lexical_alternative
  - marker: c
    text: 'Aramäisch wörtlich: „mit Generation und Generation“; gemeint ist eine Herrschaft, die durch alle Generationen hindurch fortbesteht.'
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  choice: seine Zeichen
  rationale: Das biblisch-aramäische Wort bezeichnet Zeichen, besonders machtvolle oder wunderhafte Zeichen. „Zeichen“ ist im Deutschen klar und bildet mit „Wunder“ die vertraute, sachlich passende Wortverbindung.
- source_word: כְּמָה
  choice: wie
  rationale: Die Partikel leitet hier einen bewundernden Ausruf ein; „wie groß“ und „wie mächtig“ geben diese Funktion natürlich wieder.
- source_word: רַבְרְבִין
  choice: groß
  rationale: Im Lobkontext bezeichnet das Wort die Größe und Erhabenheit der Zeichen, nicht vorrangig ihre Anzahl.
- source_word: תִמְהוֹהִי
  choice: seine Wunder
  rationale: Gemeint sind erstaunliche Taten, die Staunen hervorrufen. „Wunder“ wahrt den gehobenen Ton und den Parallelismus mit „Zeichen“.
- source_word: תַקִּיפִין
  choice: mächtig
  rationale: Das Adjektiv hebt Kraft und Wirksamkeit der Wunder hervor; „mächtig“ ist prägnant und für einen Lobpreis angemessen.
- source_word: מַלְכוּתֵהּ
  choice: sein Königreich
  rationale: Die Form bezeichnet sein Reich beziehungsweise seine Königsherrschaft. „Königreich“ bewahrt das konkrete königliche Bild.
- source_word: מַלְכוּת עָלַם
  choice: ein ewiges Königreich
  rationale: Die Verbindung bezeichnet ein unbegrenzt fortbestehendes Reich. „Ewig“ ist natürliches modernes Deutsch und lässt die zeitliche Tragweite des aramäischen עָלַם stehen.
- source_word: שָׁלְטָנֵהּ
  choice: seine Herrschaft
  rationale: Das Wort bezeichnet ausgeübte Herrschaftsgewalt. „Herrschaft“ ist im Deutschen natürlicher als „Herrschaftsgewalt“ und erhält den königlichen Parallelismus.
- source_word: עִם דָּר וְדָר
  choice: währt von Generation zu Generation
  rationale: Wörtlich steht eine Verbindung „mit Generation und Generation“; idiomatisch ist die fortdauernde Geltung durch alle Generationen gemeint. Das ergänzte „währt“ ergibt einen vollständigen und natürlichen deutschen Satz.
theological_decisions:
- issue: Göttlicher Bezug der Pronomen in Nebukadnezars Lobpreis
  choice: Die Pronomen werden ohne erläuternden Zusatz auf Gott bezogen.
  alternative: Den Bezug im Haupttext ausdrücklich als „Gottes“ kennzeichnen.
  rationale: Der Bezug auf den höchsten Gott ist aus dem Kontext klar. Eine ausdrückliche Identifizierung würde mehr sagen als der Vers selbst und ist für das Verständnis nicht nötig.
- issue: Bedeutung von מַלְכוּת als Reich oder Königsherrschaft
  choice: „Königreich“ im ersten Ausdruck und „Herrschaft“ im parallelen zweiten Ausdruck.
  alternative: „Königsherrschaft“ beziehungsweise „Regentschaft“.
  rationale: „Königreich“ bewahrt die konkrete Bildsprache, während „Herrschaft“ den parallelen Gedanken der fortdauernden Regierungsgewalt wiedergibt, ohne eine bestimmte theologische Reichslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer doxologischer Parallelstruktur. Die elliptische zweite Ausrufzeile („und wie mächtig seine Wunder!“) wird beibehalten; im letzten Satzglied wird „währt“ zur natürlichen deutschen Wiedergabe des aramäischen Nominalsatzes ergänzt.
