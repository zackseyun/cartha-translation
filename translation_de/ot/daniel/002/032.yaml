base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
translation:
  language: de
  text: Dieses Standbild[a] – sein Kopf war aus feinem Gold[b], seine Brust und seine Arme aus Silber, sein Bauch und seine Oberschenkel aus Bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bild«. Das aramäische Wort צַלְמָא kann ein Bild oder eine Statue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »gutes Gold«, das heißt Gold von hoher Qualität; auch »reines Gold« ist möglich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Kupfer«. Das aramäische נְחָשׁ bezeichnet in diesem Zusammenhang gewöhnlich Bronze, doch die antiken Bezeichnungen für Kupfer und Kupferlegierungen können sich überschneiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמָא
  choice: Standbild
  rationale: Das aramäische Wort bezeichnet ein Bild beziehungsweise eine Statue. Im Zusammenhang mit den genannten Körperteilen ist »Standbild« im Deutschen anschaulich und natürlich; »Bild« bleibt als weitere Möglichkeit in der Fußnote erhalten.
- source_word: רֵאשֵׁהּ
  choice: sein Kopf
  rationale: Direkte Wiedergabe der Possessivkonstruktion mit Rückbezug auf das Standbild.
- source_word: דִּי
  choice: aus
  rationale: Die Relativpartikel verbindet hier die Körperteile mit dem jeweiligen Material. Im Deutschen gibt »aus« die Materialangabe knapp und idiomatisch wieder.
- source_word: דְהַב טָב
  choice: feines Gold
  rationale: Wörtlich steht »gutes Gold«; gemeint ist Gold von hoher Qualität. »Feines Gold« bewahrt diesen Sinn, ohne zwingend einen technisch bestimmten Reinheitsgrad zu behaupten.
- source_word: חֲדוֹהִי
  choice: seine Brust
  rationale: Das Wort bezeichnet den vorderen Brust- beziehungsweise Rumpfbereich. »Brust« passt zur anatomischen Aufzählung und ist im Deutschen klar.
- source_word: דְרָעוֹהִי
  choice: seine Arme
  rationale: Direkte Wiedergabe des pluralischen Körperteilbegriffs.
- source_word: כְסַף
  choice: Silber
  rationale: Eindeutige Bezeichnung des Materials.
- source_word: מְעוֹהִי
  choice: sein Bauch
  rationale: Das Wort bezeichnet den Bauch oder die Körpermitte. »Bauch« ist verständlich und entspricht der anatomischen Abfolge.
- source_word: יַרְכָתֵהּ
  choice: seine Oberschenkel
  rationale: Der Ausdruck kann die Oberschenkel-, Hüft- oder Lendengegend bezeichnen. In der Abfolge der Körperteile ist »Oberschenkel« die präziseste natürliche Wiedergabe.
- source_word: נְחָשׁ
  choice: Bronze
  rationale: In biblischen Metallaufzählungen wird der Begriff herkömmlich und kontextgemäß mit »Bronze« wiedergegeben; die antike Terminologie kann jedoch auch Kupfer einschließen.
- source_word: הוּא
  choice: Dieses
  rationale: Das Pronomen greift das bereits erwähnte Traumgebilde wieder auf. »Dieses Standbild« stellt den Rückbezug im Deutschen natürlich her.
theological_decisions: []
