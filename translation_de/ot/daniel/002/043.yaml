base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: de
  text: Wie du das Eisen mit lehmigem Ton vermischt gesehen hast, werden sie sich mit dem Samen des Menschen vermischen[a]. Doch sie werden nicht zusammenhalten, eines mit dem anderen[b], ebenso wenig wie sich Eisen mit Tonware[c] vermischt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die schwierige Wendung lautet wörtlich „mit dem Samen des Menschen“. Häufig wird sie im Sinn von Heiratsverbindungen verstanden; der aramäische Text legt diese Deutung jedoch nicht ausdrücklich fest.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dieses mit jenem“; auch: „eines am anderen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ton“, „Irdenware“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: du … gesehen hast
  rationale: Die 2. Person maskulin Singular verweist unmittelbar auf Nebukadnezars Vision; das deutsche Perfekt ist hier natürlich.
- source_word: פַּרְזְלָא
  choice: Eisen
  rationale: Die übliche und im Bild der Statue eindeutige Wiedergabe.
- source_word: חֲסַף טִינָא
  choice: lehmiger Ton
  rationale: Die Wortverbindung bezeichnet toniges beziehungsweise lehmiges Material. „Lehmiger Ton“ bewahrt beide Bestandteile, ohne bereits gebrannte Keramik vorauszusetzen.
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: sie werden sich … vermischen
  rationale: Die reflexiv beziehungsweise medial geprägte Konstruktion wird durch „sich vermischen“ wiedergegeben.
- source_word: בִּזְרַע אֲנָשָׁא
  choice: mit dem Samen der Menschen
  rationale: Die bildhafte und schwierige Wendung bleibt möglichst wörtlich erhalten; „der Menschen“ gibt den generischen Sinn natürlich wieder, ohne die Aussage auf Heiratsverbindungen festzulegen.
- source_word: דָּבְקִין
  choice: aneinanderhaften
  rationale: Das Verb bezeichnet Haften oder Aneinanderkleben und greift zugleich das Materialbild auf.
- source_word: דְּנָה עִם דְּנָה
  choice: aneinander
  rationale: Die Wendung bedeutet wörtlich etwa „dieses mit jenem“; „aneinander“ bringt die gegenseitige Verbindung im Deutschen knapp und idiomatisch zum Ausdruck.
- source_word: הֵא כְדִי
  choice: ebenso wenig wie
  rationale: Leitet den begründenden Vergleich ein und verbindet ihn natürlich mit der vorangehenden Verneinung.
- source_word: חַסְפָּא
  choice: Tonware
  rationale: Kann Ton, Irdenware oder Scherbenmaterial bezeichnen. „Tonware“ bewahrt gegenüber dem vorausgehenden lehmigen Ton die mögliche Nuance eines tönernen Gegenstands.
theological_decisions:
- issue: Deutung von „sie werden sich mit dem Samen der Menschen vermischen“
  choice: Die mehrdeutige Wendung und der unbestimmte Bezug von „sie“ bleiben im Haupttext erhalten.
  alternative: Sie werden untereinander heiraten; Herrscherhäuser werden sich durch Heirat verbinden; die Reiche werden sich mit gewöhnlichen Menschen vermischen.
  rationale: Der aramäische Text legt keine dieser historischen oder eschatologischen Deutungen ausdrücklich fest. Eine eindeutige Auslegung im Haupttext würde die genuine Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax folgt dem aramäischen Gedankengang, wird aber idiomatisch geglättet. Die ungewöhnliche Samen-Metapher bleibt bewusst sichtbar; Fußnoten dokumentieren die wesentlichen lexikalischen und interpretativen Alternativen.
