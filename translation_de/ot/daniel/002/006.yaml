source:
  edition: WLC
  text: וְ/הֵ֨ן חֶלְמָ֤/א וּ/פִשְׁרֵ/הּ֙ תְּֽהַחֲוֺ֔ן מַתְּנָ֤ן וּ/נְבִזְבָּה֙ וִ/יקָ֣ר שַׂגִּ֔יא תְּקַבְּל֖וּן מִן קֳדָמָ֑/י לָהֵ֕ן חֶלְמָ֥/א וּ/פִשְׁרֵ֖/הּ הַחֲוֺֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: de
  text: Wenn ihr mir aber den Traum und seine Deutung bekannt gebt[a], werdet ihr von mir Geschenke, eine Belohnung und große Ehre erhalten. Darum gebt mir den Traum und seine Deutung bekannt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitteilt“ bzw. „mir nennt“; so auch beim wiederholten aramäischen Verb am Ende des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵן
  choice: Wenn ... aber
  rationale: Die Verbindung leitet als Gegensatz zur vorausgehenden Drohung eine Bedingung ein; die deutsche Wortstellung gibt beides natürlich wieder.
- source_word: חֶלְמָא
  choice: den Traum
  rationale: Gemeint ist der bereits im Zusammenhang vorausgesetzte bestimmte Traum des Königs.
- source_word: וּפִשְׁרֵהּ
  choice: und seine Deutung
  rationale: פשר bezeichnet hier die Auslegung beziehungsweise Erklärung eines Traums; „Deutung“ ist im Deutschen präzise und idiomatisch.
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: bekannt gebt / gebt mir ... bekannt
  rationale: Der Haphel von חוה bedeutet „bekannt machen, mitteilen“. Die wiederholte Wendung wahrt die Wiederholung des aramäischen Verbs und klingt zugleich natürlich.
- source_word: מַתְּנָן
  choice: Geschenke
  rationale: Der Plural bezeichnet wertvolle Gaben, die vom König verliehen werden.
- source_word: וּנְבִזְבָּה
  choice: eine Belohnung
  rationale: Das singularische aramäische Substantiv bezeichnet eine königliche Belohnung oder Zuwendung; der Singular des Quelltexts wird bewahrt.
- source_word: וִיקָר שַׂגִּיא
  choice: und große Ehre
  rationale: יקָר bezeichnet Ehre oder Ansehen, שַׂגִּיא verstärkt dies als „groß“.
- source_word: תְּקַבְּלוּן
  choice: werdet ihr ... erhalten
  rationale: Der Imperfekt hat im Bedingungsgefüge zukünftige Bedeutung; „erhalten“ passt idiomatisch zu königlichen Gaben und Ehre.
- source_word: מִן קֳדָמַי
  choice: von mir
  rationale: Die aramäische Wendung bezeichnet hier die Quelle der Zuwendungen, nämlich den König.
- source_word: לָהֵן
  choice: Darum
  rationale: Das Wort zieht aus der versprochenen Belohnung die Folgerung für die anschließende Aufforderung.
