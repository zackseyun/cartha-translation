  text: כָּ/ל קֳבֵ֣ל דְּנָ֗ה דָּֽנִיֵּאל֙ עַ֣ל עַל אַרְי֔וֹךְ דִּ֚י מַנִּ֣י מַלְכָּ֔/א לְ/הוֹבָדָ֖ה לְ/חַכִּימֵ֣י בָבֶ֑ל אֲזַ֣ל וְ/כֵ֣ן אֲמַר לֵ֗/הּ לְ/חַכִּימֵ֤י בָבֶל֙ אַל תְּהוֹבֵ֔ד הַעֵ֨לְ/נִי֙ קֳדָ֣ם מַלְכָּ֔/א וּ/פִשְׁרָ֖/א לְ/מַלְכָּ֥/א אֲחַוֵּֽא־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: de
  text: 'Darum ging Daniel zu Arjoch, den der König dazu bestimmt hatte, die Weisen von Babel umzubringen.[a] Er ging hin und sagte zu ihm: »Bring die Weisen von Babel nicht um! Führe mich vor den König, dann werde ich dem König die Deutung mitteilen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu vernichten«. Gemeint ist hier die Vollstreckung des Todesbefehls gegen sie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dann werde ich dem König die Deutung zeigen« beziehungsweise »bekannt machen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Darum
  rationale: Die aramäische kausale Folgerungsformel knüpft Daniels Handeln unmittelbar an die zuvor empfangene Offenbarung an; »Darum« ist knapp und natürlich.
- source_word: עַל עַל־אַרְיוֹךְ
  choice: ging Daniel zu Arjoch
  rationale: עַל kann im biblischen Aramäisch das Hingehen oder Eintreten bezeichnen. Im Zusammenhang ist die Bewegung zu Arjoch gemeint; eine ausdrückliche Raumangabe wäre unnötig eng.
- source_word: דִּי מַנִּי מַלְכָּא
  choice: den der König dazu bestimmt hatte
  rationale: מני bezeichnet hier die königliche Bestellung beziehungsweise Beauftragung Arjochs.
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: umzubringen / Bring … nicht um
  rationale: Der Kausativ von אבד bedeutet zugrunde richten oder vernichten; da es konkret um die Vollstreckung eines Todesbefehls an Menschen geht, gibt »umbringen« den Sinn im Deutschen eindeutig und natürlich wieder.
- source_word: לְחַכִּימֵי בָבֶל
  choice: die Weisen von Babel
  rationale: »Weise« ist die etablierte und im Kontext passende Bezeichnung für die babylonischen Hofgelehrten; »Babel« entspricht der traditionellen deutschen Ortsnamensform.
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: Er ging hin und sagte zu ihm
  rationale: Die Wiedergabe bewahrt die wiederholte Bewegungsangabe und leitet die direkte Rede idiomatisch ein; כֵן wird durch die folgende direkte Rede hinreichend ausgedrückt.
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: Führe mich vor den König
  rationale: Der Kausativ von על zusammen mit קֳדָם bezeichnet hier das Hineinführen in die Gegenwart des Königs. Die deutsche Wendung ist präzise und natürlich.
- source_word: וּפִשְׁרָא
  choice: die Deutung
  rationale: פשר ist in Daniel der feste Ausdruck für die Deutung eines Traums oder Geheimnisses; »Deutung« erhält diesen narrativen Fachsinn.
- source_word: אֲחַוֵּא
  choice: werde ich … mitteilen
  rationale: Das Verb umfasst »zeigen« und »bekannt machen«. Mit »Deutung« als Objekt klingt »mitteilen« im modernen Deutschen natürlich und bewahrt den Bekanntmachungsaspekt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und dringlich formuliert. »Arjoch« und »Babel« folgen geläufigen deutschen Bibelnamensformen.
