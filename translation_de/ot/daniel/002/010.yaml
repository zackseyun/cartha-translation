source:
  edition: WLC
  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: de
  text: 'Die Chaldäer antworteten dem König und sagten: »Es gibt keinen Menschen auf der Erde, der dem König die Sache kundtun könnte. Denn kein noch so großer und mächtiger König hat je von irgendeinem Wahrsagepriester, Beschwörer oder Chaldäer etwas Derartiges verlangt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל יַבֶּשְׁתָּא
  choice: auf der Erde
  rationale: Die aramäische Wendung bezeichnet die bewohnte Erde bzw. das Festland; die natürliche deutsche Entsprechung ist hier »auf der Erde«.
- source_word: מִלַּת מַלְכָּא
  choice: die Sache … dem König … kundtun
  rationale: מִלָּה kann »Wort«, »Angelegenheit« oder »Sache« bedeuten. Im Kontext geht es um die vom König geforderte Mitteilung; »die Sache« bewahrt die sachliche Breite.
- source_word: כָּל־קֳבֵל דִּי
  choice: Denn
  rationale: Die Verbindung leitet die Begründung für die behauptete Unmöglichkeit ein.
- source_word: כָּל מֶלֶךְ רַב וְשַׁלִּיט
  choice: kein noch so großer und mächtiger König
  rationale: Im negierten Satz hat כָּל idiomatisch den Sinn »kein … überhaupt«; »noch so« gibt die emphatische Allgemeingültigkeit natürlich wieder. שַׁלִּיט bezeichnet einen Herrscher mit Macht bzw. Autorität.
- source_word: חַרְטֹּם
  choice: Wahrsagepriester
  rationale: Der Titel bezeichnet einen gelehrten kultischen Spezialisten für Traumdeutung und mantische Praktiken; »Wahrsagepriester« ist genauer als das missverständliche »Magier«.
- source_word: אָשַׁף
  choice: Beschwörer
  rationale: Das Wort bezeichnet einen Spezialisten für Beschwörungen; diese Wiedergabe unterscheidet ihn vom חַרְטֹּם.
- source_word: מִלָּה כִדְנָה
  choice: etwas Derartiges
  rationale: Wörtlich »eine Sache wie diese«; die idiomatische Form wahrt den Rückverweis auf die außergewöhnliche Forderung.
theological_decisions:
- issue: Umfang der menschlichen Unmöglichkeit
  choice: »Es gibt keinen Menschen auf der Erde« als uneingeschränkte Behauptung der Chaldäer wiedergeben
  alternative: Durch »nach menschlichem Ermessen« oder ähnliche Zusätze relativieren
  rationale: Der Text legt den Chaldäern eine absolute Aussage in den Mund. Eine theologische Einordnung folgt erst im weiteren Zusammenhang und soll hier nicht vorweggenommen werden.
- issue: Bezeichnungen der babylonischen Fachleute
  choice: Die drei im Aramäischen unterschiedenen Gruppen getrennt benennen
  alternative: Alle Gruppen verallgemeinernd als »Weise« oder »Magier« zusammenfassen
  rationale: Die Aufzählung gehört zur Aussageabsicht und sollte weder konfessionell noch polemisch vereinheitlicht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert, bleibt aber eng an Syntax und Aussagegehalt des Reichsaramäischen. »Kundtun« bewahrt den feierlich-höfischen Ton, ohne altertümliche Satzformen zu übernehmen.
