base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: de
  text: Und das vierte Königreich wird stark sein wie Eisen[a], denn Eisen zermalmt und zerschlägt alles; und wie Eisen, das all dies zerbricht[b], wird es zermalmen und zerschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ein viertes Königreich“. Im Aramäischen fehlt der bestimmte Artikel; aus dem Zusammenhang ist jedoch klar, dass dieses Königreich das vierte in der Abfolge ist.'
    reason: lexical_alternative
  - marker: b
    text: „All dies“ bezieht sich wahrscheinlich auf die früheren Königreiche, die in der Vision durch Teile des Standbildes dargestellt werden.
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: Und das vierte Königreich
  rationale: מַלְכוּ bezeichnet ein Königreich, רביעיה ordnet es als viertes in die Abfolge ein, und וּ wird natürlich mit „und“ wiedergegeben. Der bestimmte Artikel ergibt sich im Deutschen aus dem eindeutigen Kontext; formal steht im Aramäischen jedoch kein Artikel.
- source_word: תֶּהֱוֵא תַקִּיפָה כְּפַרְזְלָא
  choice: wird stark sein wie Eisen
  rationale: Das Imperfekt von הוה bezeichnet hier den künftigen Zustand; תַקִּיפָה meint Stärke oder Gewalt, und כְ leitet den Vergleich ein.
- source_word: כָּל קֳבֵל דִּי
  choice: Denn
  rationale: Die Wendung begründet den vorausgehenden Vergleich. „Denn“ erhält den erklärenden Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  choice: zermalmt und zerschlägt alles
  rationale: Die beiden Verben schildern mit sich ergänzenden Ausdrücken die zerstörerische Wirkung des Eisens; „zermalmen“ und „zerschlagen“ bewahren die anschauliche Steigerung.
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע כָּל אִלֵּין
  choice: und wie Eisen, das all dies zerbricht
  rationale: מְרָעַע bezeichnet das Zerbrechen oder Zerschmettern. כָּל אִלֵּין bleibt mit „all dies“ knapp und lässt den kontextuellen Bezug auf die zuvor dargestellten Reiche beziehungsweise Materialien offen.
- source_word: תַּדִּק וְתֵרֹעַ
  choice: wird es zermalmen und zerschlagen
  rationale: Die zwei Verben drücken umfassende gewaltsame Zerstörung aus. Die Wiedergabe wahrt sowohl ihre Unterscheidung als auch den Rückbezug auf die unmittelbar zuvor beschriebene Wirkung des Eisens.
