  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: de
  text: Und nach dir wird ein anderes Königreich aufstehen, geringer als das deine[a]; und ein drittes Königreich aus Bronze wird über die ganze Erde herrschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »niedriger als du«. Die aramäische Formulierung ist schwierig; wahrscheinlich ist gemeint, dass das folgende Königreich an Rang oder Glanz hinter Nebukadnezars Königreich zurücksteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »über das ganze Land«. Das aramäische Wort kann sowohl »Erde« als auch »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: Nach dir
  rationale: Die Präpositionalverbindung bezeichnet die zeitliche und dynastische Abfolge nach Nebukadnezar; die deutsche Satzfolge gibt das aramäische Anschlusswort natürlich wieder.
- source_word: תְּקוּם
  choice: wird ... aufkommen
  rationale: Das Verb bedeutet wörtlich „aufstehen“ beziehungsweise „sich erheben“; bei einem Königreich bezeichnet „aufkommen“ dessen Entstehung oder Machtantritt, ohne eine konkrete historische Identifikation einzutragen.
- source_word: מַלְכוּ אָחֳרִי
  choice: ein anderes Königreich
  rationale: מַלְכוּ bezeichnet hier im Zusammenhang des Standbilds ein politisches Reich; אָחֳרִי kennzeichnet es als ein weiteres, vom ersten verschiedenes Reich.
- source_word: ארעא מִנָּךְ
  choice: geringer als deins
  rationale: Die schwierige aramäische Wendung wird kontextuell als Vergleich des folgenden Königreichs mit dem Nebukadnezars verstanden. „Deins“ stellt klar, dass das Königreich und nicht Nebukadnezars Person als solche verglichen wird.
- source_word: וּמַלְכוּ תליתיא אָחֳרִי
  choice: Danach kommt ein drittes Königreich
  rationale: Die Formulierung setzt die Abfolge fort. „Danach“ und „kommt“ ergeben im Deutschen eine flüssige, sachlich entsprechende Wiedergabe.
- source_word: דִּי נְחָשָׁא
  choice: aus Bronze
  rationale: Die Relativverbindung ordnet das dritte Königreich dem Bronzeteil des Standbilds zu. „Aus Bronze“ bewahrt das Materialbild klar und knapp.
- source_word: דִּי תִשְׁלַט
  choice: das ... herrschen wird
  rationale: Das Verb bezeichnet das Ausüben von Herrschaft oder Macht; „herrschen“ wahrt den politischen Sinn und passt zu einem Königreich als Subjekt.
- source_word: בְּכָל אַרְעָא
  choice: über die ganze Erde
  rationale: אַרְעָא kann „Erde“ oder „Land“ bedeuten. Die Übersetzung bewahrt die weitreichende imperiale Aussage; die mögliche engere Bedeutung wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Vergleichssinn von ארעא מִנָּךְ
  choice: geringer als deins
  alternative: niedriger als du / erdwärts von dir
  rationale: Die aramäische Formulierung ist ungewöhnlich. Der Vergleich mit dem vorherigen Königreich passt zur Abfolge der Metalle und macht keine spätere historische Reichszuordnung zum Bestandteil der Übersetzung. Die Fußnote wahrt die sprachliche Schwierigkeit.
- issue: Reichweite von בְּכָל אַרְעָא
  choice: über die ganze Erde
  alternative: über das ganze Land
  rationale: Der Ausdruck kann universal oder regional verstanden werden. Im Kontext imperialer Herrschaft ist „ganze Erde“ die naheliegende rhetorische Aussage, während die engere Möglichkeit ausdrücklich vermerkt bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzfolge. „Königreich“ hält die Verbindung zwischen Herrschaft und politischem Reich offen; die Fußnoten bewahren die beiden echten lexikalischen Mehrdeutigkeiten.
