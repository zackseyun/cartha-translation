base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: de
  text: Daniel bat den König darum, und dieser setzte Schadrach, Meschach und Abed-Nego über die Verwaltung der Provinz Babel ein. Daniel aber blieb am Tor des Königs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tor des Königs“. Die Wendung kann einen Ort königlicher Verwaltung und damit auch den königlichen Hof bezeichnen.'
    reason: Die wörtliche Ortsangabe ist für heutige Leser erklärungsbedürftig; die mögliche institutionelle Bedeutung wird als Deutung, nicht als Gewissheit, erläutert.
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: bat den König darum
  rationale: Das aramäische Verb bezeichnet ein Bitten oder Ersuchen. Die deutsche Formulierung ist im höfischen Zusammenhang natürlich; „darum“ verweist auf die aus dem Kontext erschließbare Bitte um die Ernennung seiner Gefährten.
- source_word: וּמַנִּי
  choice: und dieser setzte … ein
  rationale: Das Verb bezeichnet ein Einsetzen oder Ernennen. Sein unausgesprochenes Subjekt ist im Kontext der König; „dieser“ macht den Bezug im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: עַל עֲבִידְתָּא
  choice: über die Verwaltung
  rationale: Das Substantiv kann Arbeit, Dienst oder Amtsgeschäfte bezeichnen. Im Zusammenhang mit einer Provinz gibt „Verwaltung“ die amtliche Zuständigkeit angemessen wieder.
- source_word: דִּי מְדִינַת בָּבֶל
  choice: der Provinz Babel
  rationale: מְדִינָה bezeichnet hier einen Verwaltungsbezirk. „Provinz Babel“ ist im Deutschen klar und bewahrt die Unterscheidung zwischen Provinz und Stadt.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Schadrach, Meschach und Abed-Nego
  rationale: Die Namensformen folgen der im Deutschen etablierten biblischen Wiedergabe; das Präfix לְ kennzeichnet diejenigen, denen die Zuständigkeit übertragen wird.
- source_word: בִּתְרַע מַלְכָּא
  choice: am Tor des Königs
  rationale: Die Formulierung gibt das aramäische Bild formal wieder. Das Königstor war zugleich ein Ort königlicher Gegenwart und Verwaltung; diese mögliche institutionelle Bedeutung wird in der Fußnote erläutert.
- source_word: וְדָנִיֵּאל
  choice: Daniel aber
  rationale: 'Das aramäische וְ verbindet die Sätze, trägt hier jedoch im Zusammenhang einen Kontrast: Die drei Freunde übernehmen die Provinzverwaltung, während Daniel im unmittelbaren königlichen Bereich bleibt.'
