source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/מֶּ֖לֶךְ חֲל֣וֹם חָלָ֑מְתִּי וַ/תִּפָּ֣עֶם רוּחִ֔/י לָ/דַ֖עַת אֶֽת הַ/חֲלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/003.yaml
  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
translation:
  language: de
  text: 'Da sagte der König zu ihnen: »Ich habe einen Traum geträumt,[a] und mein Geist ist aufgewühlt,[b] weil ich den Traum verstehen will.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Einen Traum habe ich geträumt.“ Die hebräische Verbindung eines Substantivs mit einem stammverwandten Verb hebt die Aussage hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und mein Geist wurde unruhig“. „Mein Geist“ kann hier auch im Sinn von „mein Inneres“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַמֶּלֶךְ
  choice: Da sagte der König zu ihnen
  rationale: Die deutsche Erzählform mit „Da sagte“ gibt das Wayyiqtol natürlich wieder; לָהֶם bezeichnet eindeutig die Angesprochenen.
- source_word: חֲלוֹם חָלָמְתִּי
  choice: Ich habe einen Traum geträumt
  rationale: Die Verbindung aus Substantiv und stammverwandtem Verb wird im Deutschen bewahrt und gibt die Hervorhebung der hebräischen Wendung deutlicher wieder als das glattere „Ich hatte einen Traum“.
- source_word: וַתִּפָּעֶם
  choice: ist aufgewühlt
  rationale: Das Verb bezeichnet eine starke innere Unruhe oder Erregung. Das Präsens bringt den im Redemoment fortbestehenden Zustand idiomatisch zum Ausdruck, ohne die mögliche aspektuelle Nuance des Hebräischen dogmatisch festzulegen.
- source_word: רוּחִי
  choice: mein Geist
  rationale: „Geist“ wahrt den Ausdruck רוּחַ für das innere Selbst des Königs, statt ihn vorschnell auf „Verstand“ oder schlicht „ich“ zu reduzieren.
- source_word: לָדַעַת אֶת־הַחֲלוֹם
  choice: weil ich den Traum verstehen will
  rationale: ידע bedeutet grundsätzlich „wissen/erkennen“. Im Zusammenhang bezeichnet die Wendung das Verlangen, über den Traum Klarheit zu gewinnen; „verstehen“ ist dafür natürliches Deutsch, ohne festzulegen, ob nur Inhalt oder auch Bedeutung gemeint ist.
theological_decisions:
- issue: Umfang dessen, was der König über den Traum wissen will
  choice: den Traum verstehen
  alternative: den Traum kennen / den Traum deuten
  rationale: Der hebräische Ausdruck bleibt hinsichtlich Inhalt und Bedeutung des Traums relativ weit. „Verstehen“ erhält diese Offenheit besser als das spezifischere „deuten“ und klingt im Deutschen natürlicher als „den Traum wissen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Wiederholung bei „Traum“ bleibt erhalten; ungebräuchliche Wörtlichkeit wie „den Traum wissen“ wird zugunsten einer quellennahen, verständlichen Formulierung vermieden.
