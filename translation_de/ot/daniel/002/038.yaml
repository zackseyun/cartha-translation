  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: de
  text: Und überall, wo Menschen wohnen[a], hat er die Tiere des Feldes und die Vögel des Himmels in deine Hand gegeben und dich zum Herrscher über sie alle gemacht[b]. Du bist das Haupt aus Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Menschenkinder«.'
    reason: lexical_alternative
  - marker: b
    text: Das unausgesprochene Subjekt von »hat gegeben« und »zum Herrscher gemacht« ist Gott, wie aus Vers 37 hervorgeht.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל דִּי דארין בְּנֵי אֲנָשָׁא
  choice: Und überall, wo Menschen wohnen
  rationale: Die aramäische Verbindung bezeichnet jeden Ort, an dem Menschen wohnen. „Überall, wo“ gibt den lokativen Sinn natürlich wieder; „Menschen“ vermittelt die idiomatische Gesamtbedeutung von בְּנֵי אֲנָשָׁא im modernen Deutschen.
- source_word: חֵיוַת בָּרָא
  choice: die Tiere des Feldes
  rationale: Die Wendung meint die Tiere des offenen Landes. „Tiere des Feldes“ bewahrt das konkrete Bild und entspricht einem würdigen, verständlichen Bibelregister.
- source_word: וְעוֹף שְׁמַיָּא
  choice: die Vögel des Himmels
  rationale: Die wörtliche Himmelsbezeichnung wird beibehalten; sie ist im Deutschen verständlich und wahrt die Bildsprache.
- source_word: יְהַב בִּידָךְ
  choice: hat er ... in deine Hand gegeben
  rationale: „In die Hand geben“ bewahrt das aramäische Herrschaftsidiom und bezeichnet die Übertragung von Verfügungsgewalt.
- source_word: וְהַשְׁלְטָךְ בְּכָלְּהוֹן
  choice: und dich zum Herrscher über sie alle gemacht
  rationale: Die Kausativform bezeichnet die Einsetzung beziehungsweise Ermächtigung zum Herrschen. „Über sie alle“ nimmt die zuvor genannten Lebewesen auf.
- source_word: אַנְתְּה הוּא רֵאשָׁה דִּי דַהֲבָא
  choice: Du bist das Haupt aus Gold
  rationale: Die direkte Identifikation und die Stoffangabe des Bildes bleiben erhalten. „Haupt“ passt zum erhöhten Register und zur Statue besser als das alltäglichere „Kopf“.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt von „gegeben“ und „zum Herrscher gemacht“
  choice: Das im Aramäischen implizite Subjekt wird mit „er“ wiedergegeben und durch eine Fußnote als Gott aus Vers 37 erläutert.
  alternative: „Gott hat ... gegeben und ... gemacht“ ausdrücklich in den Haupttext einsetzen.
  rationale: Vers 37 nennt den Gott des Himmels als Geber der Herrschaft. Vers 38 lässt das Subjekt unausgesprochen; „er“ bewahrt diesen Textfluss, ohne den Zusammenhang zu verdunkeln.
- issue: Wiedergabe von בְּנֵי אֲנָשָׁא
  choice: „Menschen“ im Haupttext, mit der wörtlicheren Form in einer Fußnote.
  alternative: „Menschenkinder“ im Haupttext.
  rationale: Die aramäische Wendung bedeutet idiomatisch „Menschen“. Das natürliche moderne Deutsch steht im Haupttext, während die Fußnote die Form des Ausgangstextes transparent macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionellen Bildformulierungen „Vögel des Himmels“, „in deine Hand“ und „Haupt aus Gold“ wurden bewahrt, ohne veraltete Syntax zu verwenden.
