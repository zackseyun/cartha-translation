source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: de
  text: Du schautest zu, bis ein Stein abgetrennt wurde[a], nicht durch Menschenhände[b]; er traf die Statue[c] an ihren Füßen aus Eisen und Ton und zermalmte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: herausgehauen wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: nicht durch Hände. Gemeint ist: nicht durch menschliches Handeln.'
    reason: idiom_clarification
  - marker: c
    text: 'Oder: das Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: Du schautest hin
  rationale: Die Verbindung aus Partizip und הוה bezeichnet einen andauernden Vorgang in der Vergangenheit. „Du schautest hin“ gibt diesen durativen Sinn in natürlichem Deutsch wieder.
- source_word: עַד דִּי
  choice: bis
  rationale: Die aramäische Verbindung markiert den Zeitpunkt, bis zu dem das Hinschauen andauerte.
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: ein Stein herausgebrochen wurde
  rationale: Die Verbform beschreibt, dass der Stein abgetrennt beziehungsweise herausgebrochen wurde. Das Passiv wahrt, dass zunächst kein handelndes Subjekt genannt wird.
- source_word: דִּי לָא בִידַיִן
  choice: nicht von Menschenhand
  rationale: Die natürliche deutsche Wendung bewahrt das Bild der Hand und macht zugleich deutlich, dass der Stein nicht durch menschliches Handeln herausgebrochen wurde.
- source_word: וּמְחָת
  choice: Er traf
  rationale: Das feminine Singularverb bezieht sich im Aramäischen auf „Stein“. Wegen des maskulinen Genus im Deutschen wird das Bezugswort mit „Er“ aufgenommen; „traf“ gibt den heftigen Aufprall klar und würdig wieder.
- source_word: לְצַלְמָא
  choice: die Statue
  rationale: צְלֵם kann „Bild“ oder „Statue“ bedeuten. Im Traum handelt es sich um eine große menschlich gestaltete Figur; „Statue“ ist im Deutschen konkret und verständlich.
- source_word: עַל רַגְלוֹהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: an ihren Füßen aus Eisen und Ton
  rationale: Die Relativfügung bestimmt die Füße näher. Die kompakte deutsche Form gibt Material und Körperteil präzise wieder.
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: und zermalmte sie
  rationale: Das Verb bezeichnet ein Zerdrücken beziehungsweise Zermalmen. Das pluralische Pronomen nimmt die Füße auf; „zermalmte“ bewahrt die Stärke des aramäischen Ausdrucks.
theological_decisions:
- issue: Die Wendung für nichtmenschliches Handeln
  choice: nicht von Menschenhand
  alternative: 'ohne Zutun von Menschenhänden; wörtlich: nicht durch Hände'
  rationale: Die Formulierung lässt erkennen, dass der Stein nicht durch gewöhnliche menschliche Herstellung oder Kraft herausgebrochen wurde, ohne die im Vers nicht ausdrücklich genannte handelnde Macht festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fortlaufende aramäische Satz wurde nach der Angabe zur nichtmenschlichen Urheberschaft geteilt, damit die Bezüge im Deutschen klar bleiben. Die Bildsprache von Stein, Menschenhand, Eisen und Ton bleibt erhalten.
