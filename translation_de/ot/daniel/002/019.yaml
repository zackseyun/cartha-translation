id: DAN.2.19
reference: Daniel 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱדַ֗יִן לְ/דָנִיֵּ֛אל בְּ/חֶזְוָ֥/א דִֽי לֵילְיָ֖/א רָזָ֣/ה גֲלִ֑י אֱדַ֨יִן֙ דָּֽנִיֵּ֔אל בָּרִ֖ךְ לֶ/אֱלָ֥הּ שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: de
  text: Da wurde Daniel das Geheimnis in einem Nachtgesicht[a][b] offenbart. Da pries Daniel den Gott des Himmels.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer nächtlichen Vision“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die verborgene Sache“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „segnete Daniel den Gott des Himmels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker bezeichnet die zeitliche Folge. Die Wiederholung von „Da“ in beiden Sätzen bildet die Wiederholung der Vorlage natürlich und knapp ab.
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: in einem Nachtgesicht
  rationale: „Nachtgesicht“ gibt die nächtliche Vision in gehobenem, aber verständlichem biblischem Deutsch wieder und wahrt die knappe Bildsprache der aramäischen Wendung.
- source_word: רָזָה
  choice: das Geheimnis
  rationale: Das Wort bezeichnet hier die bisher verborgene Angelegenheit des königlichen Traums und seiner Bedeutung. „Geheimnis“ bewahrt den Gedanken einer nur durch Offenbarung zugänglichen Sache.
- source_word: גֲלִי
  choice: wurde … offenbart
  rationale: Die Passivform gibt wieder, dass Daniel das Verborgene nicht selbst erschloss, sondern dass es ihm enthüllt wurde, ohne den im Satz nicht ausdrücklich genannten Handelnden einzufügen.
- source_word: בָּרִךְ
  choice: pries
  rationale: Wenn Gott das Objekt von ברך ist, gibt „preisen“ die gemeinte menschliche Reaktion im heutigen Deutschen natürlich wieder. Die formal nähere Wiedergabe „segnen“ bleibt in der Fußnote sichtbar.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: den Gott des Himmels
  rationale: Die Formulierung bewahrt den bestimmten biblischen Hoheitstitel und entspricht natürlichem deutschem Sprachgebrauch.
- source_word: דָנִיֵּאל
  choice: Daniel
  rationale: Der Personenname folgt der im Deutschen etablierten Form.
theological_decisions:
- issue: Offenbarung der verborgenen Sache
  choice: das Geheimnis wurde Daniel offenbart
  alternative: die verborgene Sache wurde Daniel enthüllt
  rationale: „Offenbart“ wahrt den theologischen Klang göttlicher Mitteilung, ohne Gott als im aramäischen Passivsatz unausgesprochenen Handelnden ausdrücklich einzusetzen.
- issue: Daniels Reaktion auf Gott bei ברך
  choice: Daniel pries den Gott des Himmels
  alternative: Daniel segnete den Gott des Himmels
  rationale: „Pries“ vermittelt im modernen Deutsch klar die kontextuelle Bedeutung, während die lexikalisch formellere Möglichkeit „segnete“ als Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Struktur. Die zweimalige Verwendung von „Da“ spiegelt die Wiederholung von אֱדַיִן. „Nachtgesicht“ hält einen leicht biblischen Ton, bleibt aber allgemein verständlich.
