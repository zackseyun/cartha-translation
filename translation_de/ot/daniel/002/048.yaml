base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: de
  text: Daraufhin erhob der König Daniel zu hohem Rang[a] und gab ihm zahlreiche große Geschenke. Er setzte ihn als Herrscher über die ganze Provinz Babel und als obersten Präfekten[b] über alle Weisen Babels ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „machte Daniel groß“; gemeint ist seine Erhöhung oder Beförderung durch den König.'
    reason: lexical_alternative
  - marker: b
    text: Der hier mit „oberster Präfekt“ wiedergegebene Titel bezeichnet einen hochrangigen Amtsträger, der anderen Hofbeamten oder Verwaltern vorstand.
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Daraufhin
  rationale: Das aramäische Erzähladverb bezeichnet die zeitliche und folgerichtige Fortsetzung; „Daraufhin“ gibt beides natürlich wieder.
- source_word: מַלְכָּא
  choice: der König
  rationale: Die aramäische emphatische Form ist bestimmt und wird standardgemäß wiedergegeben.
- source_word: לְדָנִיֵּאל רַבִּי
  choice: erhob der König Daniel zu hohem Rang
  rationale: Die Kausativform von רבה bedeutet wörtlich „groß machen“ und bezeichnet hier im höfischen Zusammenhang Daniels königliche Erhöhung beziehungsweise Beförderung.
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב לֵהּ
  choice: und gab ihm viele kostbare Geschenke
  rationale: מַתְּנָן sind Geschenke; רַבְרְבָן und שַׂגִּיאָן kennzeichnen deren Größe beziehungsweise Fülle. „Viele kostbare Geschenke“ vermittelt Menge und hohen Wert in natürlichem Deutsch.
- source_word: וְהַשְׁלְטֵהּ
  choice: Er setzte ihn als Herrscher ... ein
  rationale: Die Kausativform von שלט bedeutet, jemanden herrschen zu lassen oder ihm Herrschaftsgewalt zu übertragen.
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: über die ganze Provinz Babel
  rationale: מְדִינָה bezeichnet im imperialen Zusammenhang eine Provinz; כָּל mit dem Singular meint die gesamte Provinz.
- source_word: וְרַב סִגְנִין
  choice: und als obersten Präfekten
  rationale: רַב bedeutet „Oberster“ oder „Haupt-“; סִגְנִין bezeichnet hochrangige Amtsträger. „Oberster Präfekt“ bewahrt den administrativen Titel, ohne seine genaue historische Funktion zu eng festzulegen.
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: über alle Weisen Babels
  rationale: חַכִּימִין bezeichnet hier die babylonischen Hofweisen beziehungsweise gelehrten Berater; „Weise“ entspricht dem etablierten Sprachgebrauch im Danielbuch.
