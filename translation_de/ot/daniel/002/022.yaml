  text: ה֛וּא גָּלֵ֥א עַמִּיקָתָ֖/א וּ/מְסַתְּרָתָ֑/א יָדַע֙ מָ֣ה בַ/חֲשׁוֹכָ֔/א ו/נהיר/א עִמֵּ֥/הּ שְׁרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: de
  text: Er offenbart Tiefes und Verborgenes[a]; er weiß, was in der Finsternis ist, und das Licht wohnt bei ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geheimnisse“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Licht ist bei ihm“. Das aramäische Verb kann hier auch statischer wiedergegeben werden; „wohnt“ erhält jedoch die Bildsprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא גָּלֵא
  choice: Er offenbart
  rationale: Das aramäische Partizip bezeichnet das Aufdecken beziehungsweise Bekanntmachen. „Offenbart“ ist im Deutschen natürlich, würdevoll und passt zum Kontext göttlicher Enthüllung.
- source_word: עַמִּיקָתָא
  choice: Tiefes
  rationale: Das substantivierte Adjektiv bezeichnet tiefe oder schwer zugängliche Dinge. „Tiefes“ bewahrt die knappe Metaphorik des Ausgangstextes.
- source_word: וּמְסַתְּרָתָא
  choice: und Verborgenes
  rationale: Der Ausdruck bezeichnet Verstecktes oder Verborgenes. „Verborgenes“ bildet mit „Tiefes“ ein natürliches deutsches Wortpaar, ohne den Sinn vorschnell auf Geheimnisse einzuengen.
- source_word: יָדַע מָה בַחֲשׁוֹכָא
  choice: er weiß, was in der Finsternis ist
  rationale: Die Wiedergabe folgt der aramäischen Satzstruktur und erhält die konkrete Bildsprache. „Finsternis“ trägt den gehobenen poetischen Ton besser als „Dunkelheit“, ohne altertümlich zu wirken.
- source_word: וּנְהִירָא
  choice: und das Licht
  rationale: Das Nomen bedeutet „Licht“. Der bestimmte Artikel ergibt im Deutschen einen klaren poetischen Gegensatz zu „der Finsternis“.
- source_word: עִמֵּהּ שְׁרֵא
  choice: wohnt bei ihm
  rationale: Das Verb bezeichnet Wohnen, Bleiben oder Ruhen. „Wohnt bei ihm“ bewahrt die bildhafte Personifizierung und ist zugleich verständlich und würdevoll.
theological_decisions:
- issue: Personifizierung des Lichts in seiner Beziehung zu Gott
  choice: das Licht wohnt bei ihm
  alternative: das Licht ist bei ihm
  rationale: שְׁרֵא vermittelt natürlicherweise die Vorstellung des Wohnens oder Bleibens. Die Übersetzung erhält diese poetische Spannung, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in knapper, poetischer und würdevoller Form. Die substantivierten Adjektive „Tiefes“ und „Verborgenes“ bewahren den Parallelismus; die Wiederholung von „er“ spiegelt die hervorgehobene göttliche Handlung und Erkenntnis.
