source:
  edition: WLC
  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: de
  text: 'Und dass du die Füße und Zehen gesehen hast, teils aus Töpferton und teils aus Eisen, bedeutet: Das Königreich wird geteilt sein. Doch etwas von der Festigkeit des Eisens wird in ihm sein[a], so wie du das Eisen mit schlammigem Ton vermischt gesehen hast[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »etwas von der Stärke des Eisens«. Das aramäische Wort kann Festigkeit, Stärke oder Stabilität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: »mit Tonschlamm«. Die aramäische Wortverbindung nennt sowohl Ton als auch Schlamm beziehungsweise nassen Lehm und hebt damit die Beschaffenheit der Mischung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: die Füße und Zehen
  rationale: Im Zusammenhang mit den Zehen bezeichnet רַגְלַיָּא die Füße der Statue, nicht allgemein die Beine.
- source_word: מנ/הון ... ו/מנ/הון
  choice: teils ... und teils
  rationale: Die wörtliche Verteilung »von ihnen ... und von ihnen« wird im Deutschen hinsichtlich der Materialzusammensetzung idiomatisch durch »teils ... teils« wiedergegeben.
- source_word: חֲסַף דִּי פֶחָר
  choice: Töpferton
  rationale: Die Verbindung bezeichnet Ton beziehungsweise irdenes Material eines Töpfers; »Töpferton« erhält beide Bestandteile knapp und natürlich.
- source_word: פַּרְזֶל
  choice: Eisen
  rationale: Die übliche und im Bildzusammenhang eindeutige Bezeichnung des Metalls.
- source_word: מַלְכוּ פְלִיגָה תֶּהֱוֵה
  choice: Das Königreich wird geteilt sein
  rationale: פְלִיגָה beschreibt den geteilten Zustand des im Kontext bestimmten Königreichs; die Formulierung bewahrt diese Zustandsaussage.
- source_word: וּמִן נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא בַהּ
  choice: Doch etwas von der Festigkeit des Eisens wird in ihm sein
  rationale: נִצְבְּתָא kann Festigkeit, Stärke oder Stabilität bezeichnen. »Festigkeit« bleibt beim konkreten Materialbild; »etwas von« gibt וּמִן angemessen wieder.
- source_word: כָּל־קֳבֵל דִּי
  choice: so wie
  rationale: Die Wendung stellt hier eine Entsprechung zwischen dem gesehenen Bild und seiner Deutung her, ohne eine ausschließlich kausale Lesart festzuschreiben.
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: mit schlammigem Ton vermischt
  rationale: »Vermischt« gibt das Partizip wieder; »schlammiger Ton« lässt sowohl חֲסַף (Ton) als auch טִינָא (Schlamm, nasser Lehm) erkennbar werden und klingt im Deutschen natürlicher als ein starres Nomenkompositum.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Bedeutet« macht die im Aramäischen durch die vorangestellte Sehklausel eingeleitete Deutung für heutige Leser syntaktisch klar, ohne den Aussagegehalt zu erweitern. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
