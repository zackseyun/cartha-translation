base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/016.yaml
  text: So Daniel went in and asked the king to give him time, so that he might make the interpretation known to the king.
translation:
  language: de
  text: Da ging Daniel hinein und bat den König, ihm Zeit zu geben, damit er dem König die Deutung mitteilen könne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: ging … hinein
  rationale: Das aramäische Verb bezeichnet hier Daniels Hineingehen beziehungsweise sein Vortreten zum König; die natürliche deutsche Wiedergabe erhält die Bewegung und den Zugang zum Herrscher.
- source_word: זְמָן
  choice: Zeit
  rationale: Die direkte Entsprechung gibt Daniels Bitte um einen zeitlichen Aufschub knapp und klar wieder.
- source_word: פִשְׁרָא
  choice: Deutung
  rationale: Im Zusammenhang mit dem Traum bezeichnet das Wort dessen erschlossene Bedeutung; „Deutung“ ist im Deutschen präzise und idiomatisch.
- source_word: לְהַחֲוָיָה
  choice: mitteilen
  rationale: Der Kausativinfinitiv bedeutet „wissen lassen/anzeigen“. „Mitteilen“ gibt den Sinn natürlich wieder, ohne über das bloße Bekanntmachen hinauszugehen.
theological_decisions:
- issue: Zweck oder bloße Folge der gewährten Zeit
  choice: damit er dem König die Deutung mitteilen könne
  alternative: und er werde dem König die Deutung mitteilen
  rationale: Die aramäische Konstruktion lässt hier am natürlichsten den Zweck von Daniels Bitte erkennen. Der Konjunktiv „könne“ wahrt, dass die Zeit erst gewährt werden soll und die Deutung zu diesem Zeitpunkt noch nicht mitgeteilt ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „dem König“ folgt der hervorgehobenen Wiederholung im aramäischen Text; „Da“ verbindet den Vers erzählerisch mit dem vorausgehenden Geschehen.
