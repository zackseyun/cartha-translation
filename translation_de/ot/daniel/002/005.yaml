  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר ל/כשדי/א מִלְּתָ֖/א מִנִּ֣/י אַזְדָּ֑א הֵ֣ן לָ֤א תְהֽוֹדְעוּנַּ֨/נִי֙ חֶלְמָ֣/א וּ/פִשְׁרֵ֔/הּ הַדָּמִין֙ תִּתְעַבְד֔וּן וּ/בָתֵּי/כ֖וֹן נְוָלִ֥י יִתְּשָׂמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: de
  text: 'Der König antwortete den Chaldäern: „Mein Wort steht fest[a]: Wenn ihr mir den Traum und seine Deutung nicht bekannt macht, werdet ihr in Stücke gehauen[b], und eure Häuser werden zu Misthaufen gemacht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Wort ist von mir ausgegangen.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „zu Gliedern gemacht“; gemeint ist die Zerstückelung des Körpers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: der König
  rationale: Die übliche und natürliche deutsche Entsprechung des aramäischen Königstitels.
- source_word: לכשדיא
  choice: den Chaldäern
  rationale: Bewahrt die ethnische beziehungsweise berufliche Bezeichnung des Ausgangstextes, statt sie deutend durch eine Funktionsbezeichnung zu ersetzen.
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  choice: Mein Wort steht fest
  rationale: Gibt die im Zusammenhang naheliegende Bedeutung einer festen, nicht mehr verhandelbaren königlichen Aussage in natürlichem Deutsch wieder; die echte lexikalische Alternative bleibt in Fußnote [a] erhalten.
- source_word: תְהוֹדְעוּנַּנִי
  choice: mir … bekannt macht
  rationale: Entspricht dem Kausativ von ידע und ist im Deutschen verständlich und würdevoll.
- source_word: חֶלְמָא וּפִשְׁרֵהּ
  choice: den Traum und seine Deutung
  rationale: „Deutung“ bewahrt den in Daniel üblichen technischen Sinn der Erklärung eines Traumes.
- source_word: הַדָּמִין תִּתְעַבְדוּן
  choice: werdet ihr in Stücke gehauen
  rationale: Drückt die angedrohte Zerstückelung idiomatisch und deutlich aus. Das zugrunde liegende Substantiv bezeichnet wörtlich Glieder oder Körperteile und wird in Fußnote [b] erläutert.
- source_word: וּבָתֵּיכוֹן נְוָלִי יִתְּשָׂמוּן
  choice: eure Häuser werden zu Schutthaufen gemacht
  rationale: Gibt die Vorstellung einer verwüsteten und entehrten Stätte in verständlichem modernem Deutsch wieder, ohne sich auf die engere traditionelle Wiedergabe „Misthaufen“ festzulegen.
theological_decisions:
- issue: Bedeutung von מִנִּי אַזְדָּא
  choice: Die königliche Aussage steht fest.
  alternative: Das Wort ist von mir ausgegangen.
  rationale: Die Wendung ist lexikalisch umstritten. Der Zusammenhang betont die Unwiderruflichkeit der Forderung; die alternative Auffassung wird deshalb nicht beseitigt, sondern in Fußnote [a] dokumentiert.
- issue: Bild der Strafe in הַדָּמִין
  choice: Die angedrohte Zerstückelung wird mit „in Stücke gehauen“ ausgedrückt.
  alternative: 'Wörtlicher: „zu Gliedern gemacht“.'
  rationale: Das Aramäische verwendet ein Wort für Glieder beziehungsweise Körperteile. Eine mechanisch wörtliche deutsche Formulierung wäre missverständlich; die gewaltsame Körperzerteilung wird im Haupttext natürlich ausgedrückt und die Körperglied-Metapher in Fußnote [b] offengelegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählerischem Register. Die einleitende Doppelung „antwortete und sagte“ wurde entsprechend natürlichem deutschen Erzählstil zu „antwortete“ verdichtet. Sämtliche Fußnotenmarker erscheinen im Haupttext.
