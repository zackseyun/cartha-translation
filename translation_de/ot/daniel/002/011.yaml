  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: de
  text: Und die Sache, die der König verlangt, ist schwer[a], und es gibt niemand anderen, der sie vor dem König kundtun könnte, außer den Göttern[b], deren Wohnung nicht bei Fleisch ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schwierig“; das Wort kann auch „selten“ oder „kostbar“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „außer den göttlichen Wesen, deren Wohnung nicht bei den Menschen ist“ oder „bei sterblichem Fleisch“. Wörtlich: „nicht bei Fleisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא
  choice: was
  rationale: Der Ausdruck bezeichnet hier die vom König verlangte Sache, nämlich die Offenlegung des Traums samt Deutung. Die substantivierte Formulierung „was der König verlangt“ ist im Deutschen natürlich und wahrt den Sachbezug.
- source_word: שָׁאֵל
  choice: verlangt
  rationale: Das Partizip bezeichnet die Forderung des Königs. Im bedrohlichen Hofkontext trifft „verlangt“ den pragmatischen Sinn besser als das schwächere „fragt“, ohne die Aussage unnötig zu verschärfen.
- source_word: יַקִּירָה
  choice: schwer
  rationale: Das Adjektiv kann etwas Kostbares, Seltenes oder Gewichtiges bezeichnen und bedeutet hier kontextuell „schwer, schwierig“. „Schwer“ ist knapp, idiomatisch und lässt die Nuance des Gewichtigen anklingen.
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: und es gibt niemand anderen
  rationale: Die Wendung verneint, dass es noch jemanden gibt, der die verlangte Offenbarung leisten könnte. Das personenbezogene „niemand anderen“ passt zum folgenden Relativsatz.
- source_word: יְחַוִּנַּהּ
  choice: der es ... kundtun könnte
  rationale: Das Verb bedeutet zeigen, mitteilen oder bekannt machen. „Kundtun“ passt zur feierlichen Hofszene; der Konjunktiv gibt die ausgesagte Fähigkeit im Relativsatz natürlich wieder.
- source_word: קֳדָם מַלְכָּא
  choice: dem König
  rationale: Wörtlich steht „vor dem König“, also in seiner Gegenwart. Mit „dem König kundtun“ wird dieselbe Beziehung im Deutschen idiomatisch ausgedrückt.
- source_word: לָהֵן
  choice: außer
  rationale: Die Partikel führt hier die einzige Ausnahme ein; „außer“ ist die klare und direkte deutsche Entsprechung.
- source_word: אֱלָהִין
  choice: den Göttern
  rationale: Die Form ist pluralisch und bezeichnet im Mund der babylonischen Weisen am natürlichsten die Götter. Der Plural und die pagane Sprechsituation bleiben erhalten.
- source_word: מְדָרְהוֹן
  choice: deren Wohnung
  rationale: Das Substantiv bezeichnet Wohnung oder Aufenthaltsort. „Wohnung“ gibt die konkrete Aussage schlicht und quellennah wieder.
- source_word: עִם בִּשְׂרָא
  choice: bei den Menschen aus Fleisch
  rationale: Wörtlich heißt es „mit Fleisch“. Die Formulierung macht den gemeinten menschlichen Bezug verständlich, bewahrt aber zugleich das konkrete Bild des Fleisches und die Spannung zwischen Göttern und leiblichen Menschen.
- source_word: לָא אִיתוֹהִי
  choice: nicht ... ist
  rationale: Die negierte Existenz- beziehungsweise Kopulaussage bezieht sich hier auf die Wohnung der Götter und lässt sich natürlich mit „nicht ... ist“ wiedergeben.
theological_decisions:
- issue: Bezug von אֱלָהִין
  choice: die Götter
  alternative: die göttlichen Wesen; Gott
  rationale: Die grammatische Pluralform und der babylonische Hofkontext sprechen für „die Götter“. Der Singular „Gott“ würde die israelitische Perspektive in die Rede der babylonischen Weisen eintragen; „göttliche Wesen“ wäre möglich, aber weniger direkt.
- issue: Wiedergabe von בִּשְׂרָא
  choice: Menschen aus Fleisch
  alternative: Fleisch; Sterbliche
  rationale: Das aramäische Wort lautet konkret „Fleisch“, bezeichnet hier aber die menschliche Sphäre. „Menschen aus Fleisch“ wahrt sowohl den Referenten als auch das Ausgangsbild, ohne eine weitergehende anthropologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton für die Hofrede. „Kundtun“ bewahrt den formellen Charakter, während Satzbau und Wortwahl für heutige Leser verständlich bleiben.
