  text: עָנֵ֣ה וְ/אָמַ֗ר לְ/אַרְיוֹךְ֙ שַׁלִּיטָ֣/א דִֽי מַלְכָּ֔/א עַל מָ֥ה דָתָ֛/א מְהַחְצְפָ֖ה מִן קֳדָ֣ם מַלְכָּ֑/א אֱדַ֣יִן מִלְּתָ֔/א הוֹדַ֥ע אַרְי֖וֹךְ לְ/דָנִיֵּֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: de
  text: 'Er antwortete und sagte zu Arjoch, dem Befehlshaber des Königs: „Warum ist der Erlass des Königs[b] so übereilt[a]?“ Darauf teilte Arjoch Daniel die Sache mit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „so scharf“, „so hart“ oder „so dringend“. Das seltene aramäische Wort kann sowohl Schärfe als auch drängende Eile bezeichnen; im Zusammenhang liegt besonders der Gedanke eines übereilt ergangenen Erlasses nahe.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „von vor dem König“, eine aramäische Ausdrucksweise dafür, dass der Erlass vom König beziehungsweise von seiner Autorität ausging.
    reason: cultural_note
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: Er antwortete und sagte
  rationale: Die semitische Erzählformel wird bewahrt; trotz leichter Wiederholung ist sie im Deutschen verständlich und gibt die Struktur des Ausgangstextes wieder.
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: dem Befehlshaber des Königs
  rationale: Die Wendung bezeichnet Arjoch als königlichen Amtsträger mit ausführender Befehlsgewalt. „Befehlshaber“ ist im Kontext präziser als das allgemeinere „Beamter“.
- source_word: עַל מָה
  choice: Warum
  rationale: Natürliche deutsche Wiedergabe der aramäischen Frageformel.
- source_word: דָתָא
  choice: der Erlass
  rationale: Gemeint ist hier eine verbindliche königliche Anordnung; „Erlass“ passt zum höfisch-rechtlichen Kontext.
- source_word: מְהַחְצְפָה
  choice: so streng
  rationale: Das seltene Wort bezeichnet hier die scharfe beziehungsweise drängende Beschaffenheit des Erlasses. „Streng“ gibt die belastende Härte natürlich wieder, ohne den möglichen Aspekt der Eile auszuschließen; Alternativen werden in der Fußnote genannt.
- source_word: מִן קֳדָם מַלְכָּא
  choice: des Königs
  rationale: Die aramäische Wendung bedeutet wörtlich „von vor dem König“ und bezeichnet hier Herkunft beziehungsweise Autorität. Der deutsche Genitiv gibt dies idiomatisch wieder.
- source_word: אֱדַיִן
  choice: Darauf
  rationale: Natürlicher deutscher Erzählanschluss, der die zeitliche Folge ausdrückt.
- source_word: מִלְּתָא
  choice: die Sache
  rationale: Der weit gefasste Ausdruck bezieht sich auf den Sachverhalt, den Arjoch Daniel erklärt; „die Sache“ bleibt entsprechend neutral.
- source_word: הוֹדַע
  choice: teilte … mit
  rationale: Die deutsche Wendung gibt den kausativen Sinn „wissen lassen/bekannt machen“ idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die semitische Doppelformel „antwortete und sagte“ bleibt als Merkmal des Ausgangstextes erhalten; höfische und rechtliche Begriffe werden ohne altertümliche Formulierungen wiedergegeben.
