  language: de
  text: seine Beine aus Eisen, seine Füße teils aus Eisen und teils aus Ton.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Töpferware“ beziehungsweise „Keramik“ für „Ton“ (aramäisch חֲסַף).'
