lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: seine Beine
  rationale: Das aramäische Wort bezeichnet hier die Beine beziehungsweise Unterschenkel der Statue. „Beine“ ist im Deutschen natürlich und wahrt den anatomischen Gegensatz zu den anschließend genannten Füßen.
- source_word: דִּי
  choice: aus
  rationale: Die aramäische Relativverbindung beschreibt das Material der Körperteile. Die deutsche Wendung „aus Eisen“ gibt dieses Verhältnis knapp und idiomatisch wieder.
- source_word: פַרְזֶל
  choice: Eisen
  rationale: Dies ist die eindeutige und übliche deutsche Entsprechung des aramäischen Metallnamens.
- source_word: רַגְלוֹהִי
  choice: seine Füße
  rationale: Der Ausdruck bezeichnet hier die Füße und ist vom vorausgehenden Wort für Beine zu unterscheiden; so bleibt die anatomische Abfolge der Statue erhalten.
- source_word: מנ/הון ... ו/מנ/הון
  choice: teils ... und teils
  rationale: Wörtlich etwa „von ihnen … und von ihnen“; im Zusammenhang wird damit die Verteilung der beiden Materialien auf die Füße bezeichnet. „Teils … und teils“ ist dafür die natürliche deutsche Formulierung.
- source_word: חֲסַף
  choice: Ton
  rationale: Das aramäische Wort kann Ton beziehungsweise daraus gefertigtes Töpfermaterial bezeichnen. „Ton“ passt unmittelbar zur Materialbeschreibung; mögliche konkretere Wiedergaben werden in der Fußnote bewahrt.
