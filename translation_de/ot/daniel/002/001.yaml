  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: de
  text: Im zweiten Jahr der Herrschaft Nebukadnezars träumte Nebukadnezar Träume[a]. Sein Geist wurde beunruhigt[b], und der Schlaf verließ ihn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfach: »hatte Träume«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sein Geist wurde aufgewühlt.«'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung ist schwierig; gemeint ist wohl: »Sein Schlaf war von ihm gewichen.«'
    reason: textual_clarity
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: Im zweiten Jahr
  rationale: Die einleitende Konjunktion muss im Deutschen nicht eigens mit »und« wiedergegeben werden; die Zeitangabe eröffnet den Satz natürlich und entspricht dem hebräischen Sinn.
- source_word: לְמַלְכוּת
  choice: der Herrschaft
  rationale: מַלְכוּת bezeichnet hier die Zeit beziehungsweise Ausübung der königlichen Herrschaft, nicht das beherrschte Reich.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im modernen deutschen Bibelgebrauch geläufige Namensform.
- source_word: חָלַם ... חֲלֹמוֹת
  choice: hatte ... Träume
  rationale: Die hebräische figura etymologica bedeutet wörtlich »träumte Träume«. Im natürlichen heutigen Deutsch gibt »hatte Träume« den Sinn klar wieder; die formale Ausdrucksweise bleibt in der Fußnote sichtbar.
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: Sein Geist geriet in Unruhe
  rationale: Die Formulierung bewahrt רוּחַ als »Geist« und gibt die starke innere Beunruhigung wieder, ohne den Ausdruck vorschnell auf »Verstand« oder »Gemüt« einzuengen.
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: der Schlaf verließ ihn
  rationale: Die schwierige hebräische Wendung bezeichnet im Kontext den Verlust des Schlafes. Die gewählte idiomatische Form ist klar und bewahrt das Bild des scheidenden Schlafes.
theological_decisions:
- issue: Bedeutung von רוּחַ bei Nebukadnezar
  choice: Geist
  alternative: Gemüt; Inneres
  rationale: »Geist« hält die semantische Offenheit des hebräischen רוּחַ aufrecht und vermeidet eine rein psychologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Namens folgt bewusst dem hebräischen Text. Die ungewöhnliche figura etymologica wird zugunsten natürlicher Lesbarkeit im Haupttext geglättet und in einer Fußnote dokumentiert.
