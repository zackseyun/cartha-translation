base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: de
  text: Dies ist der Traum, und seine Deutung werden wir vor dem König darlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das war der Traum; nun werden wir dem König seine Deutung darlegen.« Das Aramäische kann hier mit leicht abweichender zeitlicher Auffassung und Zeichensetzung wiedergegeben werden, ohne dass sich der Sinn wesentlich ändert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Das war
  rationale: Das aramäische Demonstrativpronomen weist auf den soeben erzählten Traum zurück. Im Deutschen ergibt das rückblickende Präteritum eine natürliche Zusammenfassung; eine präsentische Wiedergabe bleibt möglich.
- source_word: חֶלְמָא
  choice: der Traum
  rationale: Die bestimmte Form bezeichnet den konkreten Traum des Königs.
- source_word: וּפִשְׁרֵהּ
  choice: seine Deutung
  rationale: פִשְׁרָא ist in Daniel der Fachausdruck für die Deutung eines Traums oder Geheimnisses. Das Pronomen bezieht sich auf den Traum.
- source_word: נֵאמַר
  choice: wollen wir … sagen
  rationale: Die aramäische Form ist 1. Person Plural Imperfekt und kündigt die nun folgende Darlegung an. Die deutsche Fügung gibt diesen ankündigenden bzw. voluntativen Zukunftssinn natürlich wieder.
- source_word: קֳדָם
  choice: dem König
  rationale: Wörtlich bedeutet die Wendung „vor dem König“ bzw. „in Gegenwart des Königs“. Beim Verb „sagen“ ist der deutsche Dativ idiomatisch und bewahrt den Sinn der an den König gerichteten Darlegung.
- source_word: מַלְכָּא
  choice: dem König
  rationale: Die bestimmte Form wird als „der König“ wiedergegeben; der Kasus folgt der natürlichen deutschen Satzfügung.
