translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Bekannt machen“ bewahrt die kausative Ausdrucksweise des Aramäischen; „sagt mir“ im zweiten Satz vermeidet unnötige Schwerfälligkeit. Die Wiederholung von Traum, Bekanntmachen und Deutung bleibt als argumentativer Kern der königlichen Forderung erhalten.
