source:
  edition: WLC
  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: de
  text: Wenn ihr mir aber den Traum nicht bekannt macht, gibt es für euch nur ein Urteil[a]. Denn ihr habt euch darauf verständigt[b], vor mir lügnerische und verderbliche Worte zu reden, bis sich die Zeit ändert[c]. Darum sagt mir den Traum, dann werde ich wissen, dass ihr mir seine Deutung bekannt machen könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gibt es für euch nur einen Erlass“ beziehungsweise „nur eine Rechtsbestimmung“. Das aramäische Wort דָּת kann im Umfeld eines Königshofes einen Erlass, ein Gesetz oder ein gerichtliches Urteil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr habt vorbereitet“ beziehungsweise „ihr habt verabredet“, vor mir falsche und verderbliche Worte zu reden. Das Verb bezeichnet ein bewusstes Vorbereiten oder Vereinbaren.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bis die Zeiten sich ändern“; sinngemäß auch: „bis sich die Umstände ändern“. Im Aramäischen steht „Zeit“ im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: Wenn ... aber
  rationale: Gibt die bedingende Wendung wieder und wahrt zugleich den Gegensatz zum vorausgehenden Zusammenhang.
- source_word: חֶלְמָא
  choice: den Traum
  rationale: Der bestimmte Artikel passt zu dem bereits besprochenen, konkreten Traum des Königs.
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: mir ... nicht bekannt macht
  rationale: Bewahrt die kausative Bedeutung des Haphil von ידע natürlicher als ein schlichtes „nicht sagt“.
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: gilt für euch nur ein Urteil
  rationale: דָּת kann im königlichen Gerichtskontext Erlass, Rechtsbestimmung oder Urteil bedeuten. „Urteil“ bringt hier die angedrohte einheitliche Entscheidung idiomatisch zum Ausdruck.
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: lügnerische und verderbliche Worte
  rationale: Gibt beide negativen Kennzeichnungen wieder, ohne „Worte“ zu einer umfassenderen Aussage auszudeuten.
- source_word: הזמנתון
  choice: ihr habt euch darauf verständigt
  rationale: Das Verb bezeichnet ein Vorbereiten oder Verabreden; die reflexive Formulierung bringt im Kontext die gemeinsame, absichtliche Absprache zum Ausdruck.
- source_word: לְמֵאמַר קָדָמַי
  choice: vor mir ... zu reden
  rationale: Entspricht der räumlich-höfischen Wendung „vor mir“ und klingt im Deutschen natürlich.
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: bis sich die Zeit ändert
  rationale: Bewahrt den Singular des aramäischen עִדָּנָא und lässt offen, ob ein Zeitpunkt oder die Umstände gemeint sind.
- source_word: לָהֵן
  choice: Darum
  rationale: Kennzeichnet die Schlussfolgerung aus dem vorangehenden Vorwurf klar und idiomatisch.
- source_word: אֱמַרוּ לִי
  choice: sagt mir
  rationale: Natürliche deutsche Wiedergabe des Imperativs von אמר.
- source_word: וְאִנְדַּע
  choice: dann werde ich wissen
  rationale: Gibt die erwartete Folge wieder, ohne die Konstruktion ausdrücklich als Zweckbestimmung festzulegen.
- source_word: פִשְׁרֵהּ
  choice: seine Deutung
  rationale: „Deutung“ ist im Deutschen der passende wiederkehrende Fachausdruck für die Auslegung eines Traums.
