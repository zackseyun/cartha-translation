lexical_decisions:
- source_word: עֲנוֹ
  choice: Sie antworteten
  rationale: Das aramäische Peal-Perfekt, 3. Person Plural, wird im erzählenden Zusammenhang geradlinig mit dem deutschen Präteritum wiedergegeben.
- source_word: תִנְיָנוּת
  choice: ein zweites Mal
  rationale: Die Wiedergabe bewahrt die ausdrückliche ordinale Bedeutung des aramäischen Adverbs genauer als das allgemeinere »wieder«.
- source_word: וְאָמְרִין
  choice: und sagten
  rationale: Die Verbform leitet die direkte Rede ein; das deutsche Präteritum entspricht dem natürlichen Erzählstil.
- source_word: מַלְכָּא
  choice: der König
  rationale: Das Substantiv ist Subjekt des folgenden Verbs und keine Anrede.
- source_word: חֶלְמָא
  choice: den Traum
  rationale: Die bestimmte Form und die Funktion als Akkusativobjekt werden im Deutschen natürlich wiedergegeben.
- source_word: יֵאמַר
  choice: sage
  rationale: Der deutsche Konjunktiv I in der Aufforderung »Der König sage« bewahrt die jussivische beziehungsweise volitive Nuance und klingt würdevoll.
- source_word: לְעַבְדוֹהִי
  choice: seinen Dienern
  rationale: Im höfischen Kontext bezeichnet der Ausdruck die königlichen Diener beziehungsweise Hofbeamten in ehrerbietiger Selbstbezeichnung; »Diener« ist hier angemessener als »Sklaven«.
- source_word: וּפִשְׁרָה
  choice: die Deutung
  rationale: פשר bezeichnet im Zusammenhang eines Traums dessen Auslegung oder Deutung. »Deutung« ist im modernen Deutschen präzise und idiomatisch.
- source_word: נְהַחֲוֵה
  choice: werden wir ... kundtun
  rationale: Die Haphel-Form bedeutet »zeigen, bekannt machen«. »Kundtun« bewahrt den mitteilenden, kausativen Sinn und verbindet sich natürlich mit »Deutung«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält die höfische Rede von den königlichen Dienern über den König in der dritten Person. Der Konjunktiv »sage« gibt die Aufforderung knapp und formal wieder; »dann« macht den im Deutschen naheliegenden Zusammenhang zwischen Mitteilung des Traums und Bekanntgabe seiner Deutung deutlich.
