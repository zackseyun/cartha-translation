  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: de
  text: 'Sie antworteten ein zweites Mal und sagten[a]: »Der König sage seinen Dienern den Traum, und wir werden die Deutung kundtun[b].«'
  philosophy: optimal-equivalence
  footnotes:
