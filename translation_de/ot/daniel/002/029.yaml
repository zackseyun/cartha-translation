source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: de
  text: Dir, König, kamen auf deinem Bett Gedanken darüber, was danach geschehen würde. Und der, der Geheimnisse offenbart[a], hat dir kundgetan, was geschehen würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder titelartig: »der Offenbarer der Geheimnisse«. Die aramäische Partizipialform kann sowohl beschreibend als auch titelartig verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: Dir, König
  rationale: Das selbstständige Pronomen ist hervorgehoben und leitet die direkte Anrede ein. Die deutsche Voranstellung bewahrt diesen thematischen Nachdruck, ohne ein unnatürliches »Was dich betrifft« zu verwenden.
- source_word: רַעְיוֹנָךְ
  choice: Gedanken
  rationale: Das Substantiv bezeichnet Gedanken oder innere Überlegungen; »Gedanken« ist im heutigen Deutsch natürlich und inhaltlich offen.
- source_word: עַל מִשְׁכְּבָךְ
  choice: auf deinem Bett
  rationale: Die Ortsangabe wird unmittelbar wiedergegeben und erhält das konkrete Bild des wach liegenden Königs.
- source_word: סְלִקוּ
  choice: kamen dir
  rationale: Das Verb bezeichnet ein Aufsteigen oder Aufkommen. Die deutsche Wendung »Gedanken kamen dir« gibt dieses innere Aufkommen idiomatisch wieder.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: was nach diesem geschehen würde
  rationale: Die Formulierung bewahrt sowohl den Zukunftsbezug als auch das ausdrückliche »nach diesem« des aramäischen Textes.
- source_word: וְגָלֵא רָזַיָּא
  choice: Und der, der Geheimnisse offenbart
  rationale: Die substantivierte Partizipialkonstruktion wird beschreibend wiedergegeben, ohne sie unnötig zu einem festen Gottesnamen oder Titel zu machen.
- source_word: הוֹדְעָךְ
  choice: hat dir kundgetan
  rationale: Die Kausativform bedeutet »wissen lassen/bekannt machen«. »Kundgetan« entspricht dem würdigen höfischen Kontext und bleibt verständlich.
- source_word: מָה דִי לֶהֱוֵא
  choice: was geschehen würde
  rationale: Die Wiederholung der Zukunftsformulierung im Ausgangstext bleibt erhalten.
theological_decisions:
- issue: Wiedergabe der auf Gott bezogenen Partizipialform גָלֵא רָזַיָּא
  choice: der, der Geheimnisse offenbart
  alternative: der Offenbarer der Geheimnisse
  rationale: Der aramäische Text nennt Gott hier nicht ausdrücklich, sondern bezeichnet ihn durch sein Handeln. Die beschreibende Wiedergabe wahrt diese Form und vermeidet, einen festen Titel stärker zu markieren, als es die Grammatik verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Erzählton. Die markierte Anfangsstellung spiegelt den Nachdruck des aramäischen Pronomens; die Wiederholung am Versende bleibt bewusst erhalten.
