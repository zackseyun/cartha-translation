source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר מִן יַצִּיב֙ יָדַ֣ע אֲנָ֔ה דִּ֥י עִדָּנָ֖/א אַנְתּ֣וּן זָבְנִ֑ין כָּ/ל קֳבֵל֙ דִּ֣י חֲזֵית֔וֹן דִּ֥י אַזְדָּ֖א מִנִּ֥/י מִלְּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: de
  text: 'Der König antwortete und sagte: „Ich weiß mit Sicherheit, dass ihr Zeit gewinnen wollt, weil ihr gesehen habt, dass mir die Sache abhandengekommen ist.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wort ist von mir weggegangen“ oder „die Sache ist mir entfallen“. Die knappe aramäische Formulierung wird auch so verstanden, dass der Befehl des Königs feststeht. In diesem Zusammenhang sind mehrere Deutungen möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן יַצִּיב
  choice: mit Sicherheit
  rationale: Die aramäische Wendung drückt Gewissheit aus. „Mit Sicherheit“ ist im modernen Deutschen natürlich und bewahrt den Nachdruck des Königs.
- source_word: יָדַע אֲנָה
  choice: ich weiß
  rationale: Die schlichte, starke Wiedergabe entspricht dem Verb des Wissens in der ersten Person Singular.
- source_word: עִדָּנָא
  choice: Zeit
  rationale: Das Substantiv bezeichnet Zeit beziehungsweise eine Zeitspanne; die Bedeutung des Verzögerns ergibt sich aus der gesamten Wendung.
- source_word: אַנְתּוּן זָבְנִין
  choice: ihr Zeit gewinnen wollt
  rationale: Wörtlich ist vom Kaufen die Rede. „Zeit gewinnen“ gibt die im Zusammenhang gemeinte Absicht in natürlichem Deutsch wieder.
- source_word: כָּל־קֳבֵל דִּי
  choice: weil
  rationale: Die Verbindung leitet den Grund für die Feststellung des Königs ein.
- source_word: חֲזֵיתוֹן
  choice: ihr gesehen habt
  rationale: Das Perfekt bezeichnet eine abgeschlossene Wahrnehmung, die für die gegenwärtige Anschuldigung maßgeblich ist.
- source_word: אַזְדָּא מִנִּי
  choice: von mir ausgegangen ist
  rationale: Die Formulierung bleibt nahe an der räumlichen beziehungsweise ausgehenden Ausdrucksweise des Aramäischen und legt nicht eindeutig fest, ob etwas dem König entfallen oder als sein Wort ergangen beziehungsweise festgesetzt ist.
- source_word: מִלְּתָא
  choice: die Sache
  rationale: מִלְּתָא kann „Wort“, „Sache“, „Angelegenheit“ oder „Befehl“ bedeuten. „Die Sache“ lässt den Bezug bewusst offen.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Der König antwortete und sagte
  rationale: Die doppelte Erzählformel wird entsprechend dem Ausgangstext bewahrt und bleibt in würdigem biblischem Deutsch verständlich.
theological_decisions:
- issue: Mehrdeutigkeit von מִלְּתָא / אַזְדָּא מִנִּי
  choice: die Sache von mir ausgegangen ist
  alternative: die Sache ist mir entfallen; das Wort ist von mir ausgegangen; mein Befehl steht fest
  rationale: 'Die knappe aramäische Formulierung ist verschieden verstanden worden: als Hinweis darauf, dass der König den Traum nicht mehr weiß, oder darauf, dass sein Wort beziehungsweise Befehl ergangen und unabänderlich ist. Der Haupttext entscheidet diese Spannung nicht stillschweigend.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle Doppelverbformel wird bewahrt; unnötig altertümliche Wörter werden vermieden. Die ungewöhnliche Schlusswendung bleibt wegen der Mehrdeutigkeit des Ausgangstextes bewusst offen und wird durch die Fußnote erläutert.
