id: DAN.2.30
reference: Daniel 2:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: de
  text: 'Was aber mich betrifft: Nicht weil ich mehr Weisheit besäße als alle anderen Lebenden, ist mir dieses Geheimnis[a] offenbart worden, sondern damit dem König die Deutung bekannt gemacht wird und du die Gedanken deines Herzens[b] erkennst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Rätsel“. Das aramäische Wort bezeichnet eine verborgene Sache und trägt im Danielbuch häufig den Sinn eines von Gott enthüllten Geheimnisses.'
    reason: lexical_alternative
  - marker: b
    text: 'Das „Herz“ bezeichnet hier auch das innere Denken und Erwägen; sinngemäß: „die Gedanken in deinem Inneren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָה
  choice: Was aber mich betrifft
  rationale: Die selbstständige Pronominalform mit der Konjunktion markiert einen betonten, kontrastierenden Themenwechsel zu Daniels eigener Rolle.
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: Nicht weil ich mehr Weisheit besäße als alle anderen Lebenden
  rationale: Die Formulierung gibt den kausalen Gebrauch von ב und den Vergleich mit מִן in natürlichem Deutsch wieder. Der Konjunktiv verdeutlicht, dass Daniel eine solche überlegene Weisheit ausdrücklich verneint.
- source_word: רָזָא דְנָה
  choice: dieses Geheimnis
  rationale: „Geheimnis“ bezeichnet einen verborgenen Sachverhalt und kann im Danielbuch zugleich den Sinn einer von Gott enthüllten Wirklichkeit tragen.
- source_word: גֱּלִי לִי
  choice: ist mir … offenbart worden
  rationale: Die passive Wiedergabe hält fest, dass Daniel Empfänger und nicht Urheber der Enthüllung ist.
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: sondern damit
  rationale: Die Wendung führt nach der verneinten Begründung den Zweck der Offenbarung ein.
- source_word: פִשְׁרָא
  choice: die Deutung
  rationale: „Deutung“ ist im Deutschen die präzise und geläufige Bezeichnung für die Erklärung eines Traums und seines verborgenen Sinnes.
- source_word: לְמַלְכָּא יְהוֹדְעוּן
  choice: dem König … bekannt gemacht wird
  rationale: Die Pluralform lässt sich hier am besten unpersönlich beziehungsweise passiv verstehen; die deutsche Passivkonstruktion führt kein unbezeichnetes handelndes Subjekt ein.
- source_word: וְרַעְיוֹנֵי לִבְבָךְ
  choice: die Gedanken deines Herzens
  rationale: Die wörtliche Rede vom Herzen bewahrt die biblische Vorstellung des inneren Denkens und Erwägens, ohne sie auf den modernen Begriff „Verstand“ zu verengen.
- source_word: תִּנְדַּע
  choice: du … erkennst
  rationale: Im Zweckzusammenhang gibt „erkennst“ das Wissen um beziehungsweise das Verstehen der eigenen inneren Gedanken natürlich wieder.
theological_decisions:
- issue: Daniels Zurückweisung persönlicher Überlegenheit als Grund der Offenbarung
  choice: Daniel erklärt ausdrücklich, dass ihm das Geheimnis nicht wegen einer Weisheit offenbart wurde, durch die er allen anderen Lebenden überlegen wäre.
  alternative: Die Aussage könnte allgemeiner als bloße Verneinung eigener Weisheit formuliert werden.
  rationale: Der Vergleich מִן כָּל חַיַּיָּא gehört ausdrücklich zur Aussage und wahrt die Spannung zwischen menschlicher Weisheit und empfangener Offenbarung.
- issue: Anthropologische Rede vom Herzen
  choice: „Herz“ wird im Haupttext beibehalten.
  alternative: „Verstand“ oder „Inneres“
  rationale: Das Herz umfasst im biblisch-aramäischen Sprachgebrauch auch Denken und Erwägen. Die konkrete Quellmetapher soll nicht stillschweigend modernisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Doppelpunkt macht den betonten Themenwechsel sichtbar; die Satzstruktur bewahrt zugleich Verneinung, Gegensatz und Zweckangabe des aramäischen Textes.
