base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: de
  text: 'Daniel antwortete:


    „Gepriesen sei der Name Gottes

    von Ewigkeit zu Ewigkeit[a],


    denn Weisheit und Macht gehören ihm[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Zeitalter zu Zeitalter“; auch: „für immer und ewig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn Weisheit und Macht sind sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: ergriff das Wort und sagte
  rationale: Die aramäische Paarformel leitet Daniels Äußerung ein. „Ergriff das Wort und sagte“ gibt ihre Funktion in natürlichem, würdigem Deutsch wieder, ohne ein vorausgehendes Gespräch vorauszusetzen.
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: sei gepriesen
  rationale: Die Wunschform wird als doxologische Wendung wiedergegeben. „Sei gepriesen“ klingt im heutigen Deutsch natürlicher als das missverständliche „sei gesegnet“, wenn Gott Gegenstand des Lobpreises ist.
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: der Name Gottes
  rationale: Die Genitivverbindung wird unmittelbar wiedergegeben und bewahrt den biblischen Ausdruck für Gottes offenbarte Identität und Ehre.
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die Formulierung bewahrt die zeitliche Spannweite und den feierlichen Charakter des aramäischen Ausdrucks; mögliche Wiedergaben mit „Zeitalter“ oder „für immer“ werden in der Fußnote genannt.
- source_word: דִּי
  choice: denn
  rationale: Die Partikel führt hier den Grund für den Lobpreis ein.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: Weisheit und Macht
  rationale: „Weisheit“ gibt das erste Abstraktum direkt wieder; „Macht“ ist für גְבוּרְתָא im modernen Deutsch klar und wahrt den Gedanken von Kraft und Vermögen.
- source_word: דִּי לֵהּ הִיא
  choice: gehören ihm
  rationale: Die idiomatische deutsche Formulierung drückt den aramäischen Besitzsatz klar aus, ohne die im Text nicht ausdrücklich bezeichnete Ausschließlichkeit hinzuzufügen.
theological_decisions:
- issue: Doxologische Formel und göttliche Eigenschaften
  choice: Gottes Name wird gepriesen, weil Weisheit und Macht ihm gehören.
  alternative: 'Wörtlicher: „Der Name Gottes sei gesegnet … denn Weisheit und Macht sind sein.“'
  rationale: Die Wiedergabe behandelt den Vers als Lobpreis und nicht als abstrakte Definition. Sie bewahrt sowohl die Segens- beziehungsweise Preisformel als auch die Zuschreibung der beiden Eigenschaften, ohne weitergehende Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die traditionelle doxologische Prägung bleibt erhalten, während unnötig altertümliche Formen wie „sprach“ oder „von Äon zu Äon“ vermieden werden.
