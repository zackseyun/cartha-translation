id: DAN.2.31
reference: Daniel 2:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א חָזֵ֤ה הֲוַ֨יְתָ֙ וַ/אֲל֨וּ צְלֵ֥ם חַד֙ שַׂגִּ֔יא צַלְמָ֨/א דִּכֵּ֥ן רַ֛ב וְ/זִיוֵ֥/הּ יַתִּ֖יר קָאֵ֣ם לְ/קָבְלָ֑/ךְ וְ/רֵוֵ֖/הּ דְּחִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: de
  text: 'Du, König, schautest, und siehe: Da war ein einziges gewaltiges Standbild[a]. Dieses Standbild war riesig, und sein Glanz war außergewöhnlich; es stand vor dir, und sein Anblick war furchterregend[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bild“. Das aramäische Wort bezeichnet ein Bild oder Standbild; hier ist eine große, aufrecht stehende Gestalt gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Aussehen war schrecklich“. Die aramäische Formulierung beschreibt einen Anblick, der Furcht hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: Du, König
  rationale: Bewahrt das ausdrücklich gesetzte Personalpronomen und die direkte Anrede; „König“ klingt im modernen Deutschen würdevoll, ohne das altertümliche „o König“ zu erzwingen.
- source_word: חָזֵ֤ה הֲוַ֨יְתָ֙
  choice: schautest
  rationale: Die Verbindung aus Partizip und Hilfsverb bezeichnet einen andauernden Vorgang in der Vergangenheit. Das deutsche Präteritum ist hier natürlich; der fortlaufende Charakter ergibt sich aus der geschilderten Traumszene.
- source_word: וַאֲל֨וּ
  choice: und siehe
  rationale: Gibt den deiktischen Ausruf wieder, der das plötzlich sichtbar werdende Traumbild einführt.
- source_word: צְלֵ֥ם חַד֙ שַׂגִּ֔יא
  choice: ein einziges gewaltiges Standbild
  rationale: צְלֵם kann „Bild“ oder „Standbild“ bedeuten; der Zusammenhang beschreibt eine große, aufrecht stehende Gestalt. חַד wird ausdrücklich durch „ein einziges“ wiedergegeben, שַׂגִּיא durch „gewaltig“.
- source_word: צַלְמָ֨א דִּכֵּ֥ן רַ֛ב
  choice: Dieses Standbild war riesig
  rationale: דִּכֵּן nimmt das zuvor genannte Standbild demonstrativ wieder auf; רַב verstärkt erneut dessen enorme Größe.
- source_word: וְזִיוֵ֥הּ יַתִּ֖יר
  choice: und sein Glanz war außergewöhnlich
  rationale: זִיו bezeichnet Glanz, Helligkeit oder strahlende Pracht; יַתִּיר hebt deren außerordentliches, überragendes Maß hervor.
- source_word: קָאֵ֣ם לְקָבְלָ֑ךְ
  choice: es stand vor dir
  rationale: Gibt die stehende Position und לְקָבְלָךְ als „vor dir“ idiomatisch und quellennah wieder.
- source_word: וְרֵוֵ֖הּ דְּחִֽיל
  choice: und sein Anblick war furchterregend
  rationale: רֵו bezeichnet Erscheinung oder Anblick; דְּחִיל beschreibt etwas, das Furcht hervorruft.
theological_decisions: []
