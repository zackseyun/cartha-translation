  source_fidelity: 'Die Übersetzung gibt die aramäische Satzfolge und alle wesentlichen Aussagen zuverlässig wieder: die direkte Anrede, das andauernde Sehen in der Vergangenheit, die deiktische Einführung, das große Standbild, dessen außergewöhnlichen Glanz, seine Stellung vor dem König und seinen Furcht erregenden Anblick. Die zweimalige Größenbeschreibung wird sinnvoll abgestuft als „gewaltig“ und „riesig“ wiedergegeben.'
