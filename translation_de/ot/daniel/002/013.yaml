  yaml_path: translation/ot/daniel/002/013.yaml
  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
translation:
  language: de
  text: Da erging der Erlass[a], und die Weisen wurden getötet[b]; Daniel und seine Gefährten suchte man, um sie zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ging der Erlass hinaus«; gemeint ist, dass er amtlich bekannt gemacht wurde.'
    reason: lexical_alternative
  - marker: b
    text: Die aramäische Form deutet darauf hin, dass die Hinrichtungen bereits im Gang waren.
    reason: aspectual_nuance
lexical_decisions:
- source_word: דָתָא
  choice: Erlass
  rationale: Das aramäische Wort bezeichnet hier eine amtliche, königliche Anordnung. »Erlass« ist im Deutschen für diesen Hof- und Rechtskontext natürlich und präzise.
- source_word: נֶפְקַת
  choice: erging
  rationale: Wörtlich heißt das Verb »ging hinaus«. In Verbindung mit einem königlichen Erlass bezeichnet es dessen Bekanntgabe oder Inkraftsetzung; »erging« bewahrt das Bild in idiomatischem Deutsch.
- source_word: חַכִּימַיָּא
  choice: die Weisen
  rationale: Dies ist in Daniel die übliche Bezeichnung für die gelehrten Berater am Königshof. »Die Weisen« ist verständlich und wahrt den wiederkehrenden Ausdruck.
- source_word: מִתְקַטְּלִין
  choice: wurden getötet
  rationale: Die Partizipialform stellt die Tötungen als laufenden Vorgang dar. Die deutsche Verlaufsbedeutung wird im Haupttext schlicht wiedergegeben und in der Fußnote ausdrücklich erläutert.
- source_word: וּבְעוֹ
  choice: suchte man
  rationale: Das Verb bedeutet hier »suchen«. Das unbestimmte »man« gibt die nicht näher genannten Vollstrecker im natürlichen deutschen Satzbau wieder.
- source_word: חַבְרוֹהִי
  choice: seine Gefährten
  rationale: Der Ausdruck bezeichnet Daniels eng verbundene Mitangehörige am Hof. »Gefährten« ist würdig und weniger umgangssprachlich als »Freunde«.
- source_word: לְהִתְקְטָלָה
  choice: um sie zu töten
  rationale: Der Infinitiv bezeichnet den Zweck der Suche. Das ergänzte Pronomen »sie« macht im Deutschen eindeutig, dass Daniel und seine Gefährten getötet werden sollten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper erzählerischer Syntax. Die markierte Wortstellung »Auch Daniel und seine Gefährten suchte man« hält den Anschluss eng und hebt die nun ebenfalls Betroffenen hervor.
