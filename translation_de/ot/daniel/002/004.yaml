base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: de
  text: 'Da sprachen die Chaldäer auf Aramäisch[a] zum König: »O König, lebe ewig![b] Erzähle deinen Dienern den Traum, dann werden wir die Deutung kundtun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »auf Aramäisch« beginnt der aramäische Abschnitt, der bis Daniel 7,28 reicht.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Mögest du ewig leben!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Da sprachen
  rationale: Die Erzählfolge wird im Deutschen natürlich mit »Da« wiedergegeben; zugleich bleibt die fortschreitende Funktion der waw-Verbindung erhalten.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die ethnisch beziehungsweise standesartige Bezeichnung wird beibehalten, statt sie deutend als »Astrologen« wiederzugeben.
- source_word: לַמֶּלֶךְ
  choice: zum König
  rationale: Gibt die Präpositionalphrase und den Adressaten direkt wieder.
- source_word: אֲרָמִית
  choice: auf Aramäisch
  rationale: Natürliche deutsche Bezeichnung der Sprache; zugleich markiert sie den Übergang zum aramäischen Textabschnitt.
- source_word: מַלְכָּא
  choice: O König
  rationale: Bewahrt die feierliche, höfische Anredeform.
- source_word: לְעָלְמִין חֱיִי
  choice: lebe ewig
  rationale: Gibt die herkömmliche königliche Huldigungsformel knapp wieder; sie kann als Wunschformel verstanden werden.
- source_word: אֱמַר
  choice: Erzähle
  rationale: Im Zusammenhang soll der König den Inhalt seines Traums wiedergeben; »erzählen« ist hierfür natürlich und präzise.
- source_word: חֶלְמָא
  choice: den Traum
  rationale: Die bestimmte Form wird ohne ergänzendes Possessivpronomen wiedergegeben, da der Bezug aus dem Kontext klar ist.
- source_word: לְעַבְדָךְ
  choice: deinen Dienern
  rationale: Die höfische Selbstbezeichnung am Königshof steht im Vordergrund; »Sklaven« würde hier den rechtlichen Status unnötig betonen.
- source_word: וּפִשְׁרָא
  choice: die Deutung
  rationale: »Deutung« ist im Deutschen der geläufige Fachausdruck für die Auslegung eines Traums oder einer Vision.
- source_word: נְחַוֵּא
  choice: werden wir ... kundtun
  rationale: Das Verb bedeutet zeigen beziehungsweise bekannt machen; »kundtun« bewahrt den förmlichen Hofstil und gibt das Bekanntmachen der Deutung wieder.
