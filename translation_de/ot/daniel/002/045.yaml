revisions:
- from: Ganz so, wie du gesehen hast, dass sich vom Berg ein Stein löste, nicht durch Hände[a], und das Eisen, die Bronze, den Ton, das Silber und das Gold zermalmte, hat der große Gott dem König kundgetan, was danach geschehen wird. Der Traum steht fest, und seine Deutung ist zuverlässig.
  to: Wie du gesehen hast, dass ein Stein aus dem Berg herausgehauen wurde – nicht durch Menschenhand[a] – und Eisen, Bronze, Ton, Silber und Gold zermalmte, so hat der große Gott dem König kundgetan, was danach geschehen wird. Der Traum steht fest, und seine Deutung ist zuverlässig.
  rationale: Die Revision ersetzt die zu schwache Umschreibung „löste“ durch „herausgehauen wurde“, die den Vorgang des Abtrennens genauer abbildet. Zugleich wird die idiomatisch schwer verständliche Wendung „nicht durch Hände“ im Haupttext als „nicht durch Menschenhand“ natürlich deutsch wiedergegeben; die wörtliche Form und Alternativen bleiben in der Fußnote dokumentiert. Satzanfang und Aufzählung werden behutsam geglättet, ohne Sinn, Reihenfolge oder theologische Offenheit zu verändern.
