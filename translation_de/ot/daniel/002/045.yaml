  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: de
  text: Wie du gesehen hast, dass ein Stein aus dem Berg herausgehauen wurde – nicht durch Menschenhand[a] – und Eisen, Bronze, Ton, Silber und Gold zermalmte, so hat der große Gott dem König kundgetan, was danach geschehen wird. Der Traum steht fest, und seine Deutung ist zuverlässig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht durch Hände“; auch: „ohne Hände“ oder „nicht mit Händen“. Die aramäische Wendung besagt, dass der Stein nicht durch menschliches Wirken herausgehauen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: Ganz so, wie
  rationale: Die aramäische Wendung knüpft die Erklärung an das entsprechende Traumbild an; die vergleichende Wiedergabe ist im Deutschen natürlich und vermeidet eine vorschnelle rein kausale Festlegung.
- source_word: מִטּוּרָא אִתְגְּזֶרֶת אֶבֶן
  choice: sich vom Berg ein Stein löste
  rationale: Das passive aramäische Verb bezeichnet das Abtrennen beziehungsweise Herausschneiden. Die deutsche Formulierung gibt den Vorgang natürlich wieder und lässt, zusammen mit dem folgenden Zusatz, die nichtmenschliche Verursachung offen hervortreten.
- source_word: דִּי לָא בִידַיִן
  choice: nicht durch Hände
  rationale: Die nahezu wörtliche Wiedergabe bewahrt das aramäische Bild und dessen Aussage nichtmenschlicher Wirksamkeit, ohne sie im Haupttext ausdrücklich auszudeuten.
- source_word: וְהַדֶּקֶת
  choice: und ... zermalmte
  rationale: Das Verb bezeichnet ein Zermalmen oder Zertrümmern. „Zermalmte“ ist bildkräftig und entspricht dem vollständigen Zerschlagen der Materialien.
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: das Eisen, die Bronze, den Ton, das Silber und das Gold
  rationale: Die Reihenfolge des aramäischen Textes bleibt erhalten. „Bronze“ passt im antiken Sachkontext besser als „Messing“.
- source_word: אֱלָהּ רַב
  choice: der große Gott
  rationale: Die bestimmte und schlichte Formulierung entspricht der aramäischen Nominalverbindung, ohne zusätzliche dogmatische Präzisierung.
- source_word: הוֹדַע לְמַלְכָּא
  choice: hat der große Gott dem König kundgetan
  rationale: Die Kausativform bedeutet „bekannt machen“. „Kundgetan“ ist würdevoll, verständlich und bewahrt den formellen Ton der Rede.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: was danach geschehen wird
  rationale: Die Formulierung gibt die zukünftige Aussage klar und idiomatisch wieder.
- source_word: וְיַצִּיב חֶלְמָא
  choice: Der Traum steht fest
  rationale: יַצִּיב bezeichnet etwas Festes, Gewisses oder Beständiges. „Steht fest“ ist natürliches modernes Deutsch und erhält zugleich die Bildlichkeit.
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: und seine Deutung ist zuverlässig
  rationale: מְהֵימַן bezeichnet Verlässlichkeit beziehungsweise Vertrauenswürdigkeit; „zuverlässig“ ist hier idiomatisch und klar.
theological_decisions:
- issue: Urheberschaft beim Lösen des Steins
  choice: Die Wendung „nicht durch Hände“ bleibt im Haupttext unaufgelöst.
  alternative: „nicht durch Menschenhand“ oder „ohne menschliches Zutun“
  rationale: Der aramäische Ausdruck weist auf nichtmenschliche und im Zusammenhang göttliche Wirksamkeit hin. Die bildhafte Formulierung bewahrt jedoch die theologische Spannung und mögliche intertextuelle Bezüge besser als eine erklärende Erweiterung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Aufbau des Aramäischen nahe, wird aber für flüssige Lesbarkeit behutsam geglättet. Das seltenere „kundgetan“ wahrt den feierlichen Redeton, ohne unverständlich zu sein.
