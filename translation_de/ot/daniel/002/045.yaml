  terminology: „Bronze“, „Ton“, „Deutung“ und „zuverlässig“ sind angemessen. „Der große Gott“ gibt אֱלָהּ רַב sachgerecht wieder. Die Formulierung „nicht durch Menschenhand“ erläutert die aramäische idiomatische Pluralform nur in dem Maße, das für natürliches Deutsch erforderlich ist, ohne eine weitergehende theologische Deutung festzulegen.
