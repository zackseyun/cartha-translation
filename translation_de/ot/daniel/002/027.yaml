  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: de
  text: 'Daniel antwortete vor dem König und sagte: »Das Geheimnis[a], nach dem der König fragt, können weder Weise noch Beschwörer[b] noch Magier noch Wahrsager dem König kundtun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die geheime Sache«. Das aramäische Wort bezeichnet hier den verborgenen Traum und seine Bedeutung, die nur Gott enthüllen kann.'
    reason: lexical_alternative
  - marker: b
    text: Der genaue Sinn dieser Fachbezeichnung ist unsicher; traditionell wird auch »Astrologen« übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: antwortete
  rationale: Das gewöhnliche aramäische Erzählverb leitet Daniels Erwiderung ein; »antwortete« bewahrt den formellen Dialogstil.
- source_word: קֳדָם
  choice: vor
  rationale: Die Präposition bedeutet »vor, in Gegenwart von« und hält mit »vor dem König« den höfischen Rahmen knapp fest.
- source_word: רָזָה
  choice: Geheimnis
  rationale: Das Wort bezeichnet in diesem Kapitel eine verborgene Sache, die nur durch göttliche Offenbarung bekannt wird. »Geheimnis« bewahrt dieses wiederkehrende Motiv, ohne schon näher zu bestimmen, worin es besteht.
- source_word: שָׁאֵל
  choice: nach dem … fragt
  rationale: Die deutsche Verbindung »nach etwas fragen« gibt die gegenwärtige Anfrage des Königs natürlich wieder.
- source_word: חַכִּימִין
  choice: Weise
  rationale: Dies ist die übliche Bezeichnung für die gelehrten Ratgeber am Hof und entspricht der etablierten Kategorie im Danielbuch.
- source_word: אָשְׁפִין
  choice: Beschwörer
  rationale: Der genaue technische Sinn ist unsicher. »Beschwörer« bezeichnet vorsichtig eine besondere Gruppe babylonischer Fachleute für okkulte Praktiken und unterscheidet sie von den anderen genannten Gruppen.
- source_word: חַרְטֻמִּין
  choice: Magier
  rationale: Das Wort bezeichnet eine bekannte Gruppe ägyptischer beziehungsweise babylonischer Kult- und Zauberkundiger; »Magier« ist im Deutschen klar und kontextgerecht.
- source_word: גָּזְרִין
  choice: Wahrsager
  rationale: Im Danielbuch bezeichnet der Ausdruck Fachleute, die Verborgenes beziehungsweise Zukünftiges ermitteln oder verkünden. »Wahrsager« gibt diese Funktion verständlich wieder.
- source_word: יָכְלִין
  choice: können
  rationale: Das Verb drückt Fähigkeit aus; die deutsche Modalverbkonstruktion ist natürlich und genau.
- source_word: לְהַחֲוָיָה
  choice: kundtun
  rationale: Der Kausativ bedeutet »wissen lassen, offenbaren«. »Kundtun« bewahrt den gehobenen Ton der Hofrede und den Gedanken der Mitteilung, ohne eine zusätzliche Deutung einzutragen.
- source_word: לְמַלְכָּא
  choice: dem König
  rationale: Der Ausdruck bezeichnet den Empfänger der Mitteilung und wird daher als Dativ wiedergegeben, unterschieden vom früheren »vor dem König«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper höfischer Erzählform. Die Reihung mit »weder … noch« macht die umfassende Verneinung idiomatisch deutlich. Die Fachbezeichnungen bleiben voneinander unterschieden, obwohl ihre genauen historischen Bedeutungen teilweise unsicher sind.
