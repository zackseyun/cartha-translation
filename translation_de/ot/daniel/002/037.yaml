reference: Daniel 2:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: de
  text: Du, König, bist der König der Könige, dem der Gott des Himmels das Königtum, die Macht, die Stärke und die Herrlichkeit[a] gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehre“ oder „Glanz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתְּה
  choice: Du
  rationale: Das selbstständige Personalpronomen der 2. Person Singular eröffnet die direkte, betonte Anrede; im Deutschen genügt „Du“, da „König“ die Anrede unmittelbar fortsetzt.
- source_word: מַלְכָּא
  choice: König
  rationale: Der determinierte Singular steht als direkte Anrede. „Du, König“ gibt die aramäische Wortfolge würdig und im modernen Deutschen verständlich wieder.
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: der König der Könige
  rationale: Die Status-constructus-Verbindung bezeichnet einen König über andere Könige beziehungsweise einen höchsten König; die traditionelle, direkte Wiedergabe bewahrt die königliche Titulatur.
- source_word: דִּי
  choice: dem
  rationale: Die Relativpartikel leitet den Satz über Gottes Gabe ein. Das deutsche Relativpronomen im Dativ nimmt den Empfänger des Verbs „geben“ natürlich auf.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: der Gott des Himmels
  rationale: Dies ist die natürliche deutsche Form des biblischen Titels und wahrt die bestimmte Form des aramäischen Ausdrucks.
- source_word: מַלְכוּתָא
  choice: das Königtum
  rationale: Der Ausdruck kann Königsherrschaft, Herrschergewalt oder Reich bezeichnen. „Königtum“ passt hier zur persönlich verliehenen königlichen Stellung und vermeidet eine unnötige Verengung auf ein Staatsgebiet.
- source_word: חִסְנָא
  choice: die Macht
  rationale: Das Wort bezeichnet Stärke oder Macht. „Macht“ ist im königlichen Zusammenhang idiomatisch und lässt sich vom folgenden Ausdruck unterscheiden, obwohl die Bedeutungsfelder einander überlappen.
- source_word: תָקְפָּא
  choice: die Stärke
  rationale: Der Ausdruck bezeichnet Kraft, Stärke oder Gewalt. „Stärke“ bewahrt zusammen mit „Macht“ die bewusst gehäufte, teilweise parallele Ausdrucksweise des Originals.
- source_word: וִיקָרָא
  choice: die Herrlichkeit
  rationale: Das Wort umfasst Herrlichkeit, Ehre und Glanz. „Herrlichkeit“ wahrt den erhabenen Ton; die echten lexikalischen Alternativen werden in einer Fußnote genannt.
- source_word: יְהַב לָךְ
  choice: dir gegeben hat
  rationale: Das Peal-Perfekt bezeichnet Gottes vollzogene Gabe an den angesprochenen König. Im Relativsatz wird das aramäische לָךְ durch den vorangestellten Dativ „dem“ wiedergegeben.
theological_decisions:
- issue: Ursprung von Nebukadnezars königlicher Herrschaft
  choice: Königtum, Macht, Stärke und Herrlichkeit werden ausdrücklich als Gabe des Gottes des Himmels dargestellt.
  alternative: Nebukadnezar besitzt seine Herrschaft aus eigener Kraft, durch Eroberung oder allein aufgrund seines Ranges.
  rationale: Das Verb „geben“ mit Gott als Handelndem und dem König als Empfänger schreibt dessen Herrschaft und Größe ausdrücklich göttlicher Verleihung zu, ohne über diese Aussage hinauszugehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter königlicher Anrede. Die Reihung der vier verliehenen Größen und ihre teilweise semantische Überlappung bleiben erhalten; „Königtum“ gibt die königliche Herrschaft hier breiter wieder als das stärker territorial klingende „Königreich“.
