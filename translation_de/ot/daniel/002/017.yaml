  source_fidelity: 'Der Entwurf gibt die aramäische Satzfolge und die wesentlichen Elemente zuverlässig wieder: die narrative Folge (אֱדַיִן), Daniels Gang zu seinem Haus, die Mitteilung der Angelegenheit und die drei namentlich genannten Gefährten. „in sein Haus“ ist als Zielangabe korrekt; „teilte ... die Sache mit“ bildet הוֹדַע idiomatisch und sinngetreu ab.'
