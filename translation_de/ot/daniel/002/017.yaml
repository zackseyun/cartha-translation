source:
  edition: WLC
  text: אֱדַ֥יִן דָּֽנִיֵּ֖אל לְ/בַיְתֵ֣/הּ אֲזַ֑ל וְ֠/לַ/חֲנַנְיָה מִֽישָׁאֵ֧ל וַ/עֲזַרְיָ֛ה חַבְר֖וֹ/הִי מִלְּתָ֥/א הוֹדַֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
translation:
  language: de
  text: Dann ging Daniel in sein Haus und teilte seinen Gefährten[a] Hananja, Mischaël und Asarja die Sache mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Freunden“ beziehungsweise „Vertrauten“. Der aramäische Ausdruck kann eng mit jemandem verbundene Gefährten oder Verbündete bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Dann
  rationale: Das aramäische Adverb kennzeichnet die zeitliche Abfolge der Erzählung; „Dann“ gibt dies im modernen Deutsch natürlich wieder.
- source_word: לְבַיְתֵהּ
  choice: in sein Haus
  rationale: Die Präposition mit „Haus“ und dem Suffix der 3. Person Singular bezeichnet das Ziel der Bewegung. „In sein Haus“ bleibt nah an der Formulierung des Ausgangstextes.
- source_word: אֲזַל
  choice: ging
  rationale: Das häufige aramäische Verb bezeichnet hier schlicht das Gehen; „ging“ ist die natürliche kontextgemäße Entsprechung.
- source_word: חַבְרוֹהִי
  choice: seinen Gefährten
  rationale: Das Wort bezeichnet eng mit Daniel verbundene Personen oder Genossen. „Gefährten“ bewahrt diesen Beziehungssinn, ohne ihn eindeutig auf persönliche Freundschaft einzuengen.
- source_word: מִלְּתָא
  choice: die Sache
  rationale: Im Zusammenhang bezeichnet das Substantiv die zuvor behandelte Angelegenheit. „Die Sache“ ist idiomatisch und wahrt die semantische Breite des aramäischen Ausdrucks.
- source_word: הוֹדַע
  choice: teilte … mit
  rationale: Die Kausativform bedeutet wörtlich „wissen lassen/bekannt machen“. „Mitteilte“ gibt diese Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Hananja, Mischaël und Asarja
  rationale: Die Personennamen werden in etablierten deutschen Transliterationen wiedergegeben. Der Dativ wird bereits durch „seinen Gefährten“ und die Konstruktion mit „mitteilen“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich deutsch, während Erzählfolge, Zielangabe und die appositionelle Zuordnung der drei Namen zu Daniels Gefährten erhalten bleiben.
