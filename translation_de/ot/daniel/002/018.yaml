  variant: modern standard German
source:
  edition: WLC
  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: de
  text: und sie sollten den Gott des Himmels wegen dieses Geheimnisses[a] um Erbarmen bitten, damit Daniel und seine Gefährten nicht zusammen mit den übrigen Weisen Babylons umkämen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dieser verborgenen Sache. Das aramäische Wort bezeichnet etwas Verborgenes, das offenbart werden muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין
  choice: um Erbarmen
  rationale: Der aramäische Plural bezeichnet idiomatisch Erbarmen oder Barmherzigkeit. Im Deutschen ist „um Erbarmen bitten“ natürlich und gibt die Bitte um göttliches Mitgefühl treffend wieder.
- source_word: לְמִבְעֵא
  choice: bitten
  rationale: Der Infinitiv setzt Daniels Anweisung aus dem vorherigen Vers fort. Zusammen mit „Erbarmen“ entspricht „bitten“ dem deutschen Sprachgebrauch besser als das wörtlichere „suchen“.
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: den Gott des Himmels … um … bitten
  rationale: מִן קֳדָם bedeutet wörtlich „von vor/aus der Gegenwart von“. Die deutsche Konstruktion bewahrt die Ausrichtung der Bitte an Gott, ohne eine unnatürliche Formulierung zu erzeugen.
- source_word: עַל רָזָה דְּנָה
  choice: wegen dieses Geheimnisses
  rationale: עַל bezeichnet hier den Gegenstand beziehungsweise Anlass der Bitte. „Geheimnis“ gibt eine verborgene Sache wieder, die göttlicher Offenbarung bedarf.
- source_word: דִּי לָא יְהֹבְדוּן
  choice: damit … nicht … umkämen
  rationale: Die Verbindung drückt Zweck oder beabsichtigte Folge aus. Das Haphil von אבד bezeichnet das Zugrundegehenlassen; im Kontext ist „umkämen“ natürlich und lässt sowohl Hinrichtung als auch Verderben anklingen.
- source_word: וְחַבְרוֹהִי
  choice: seine Gefährten
  rationale: Der Ausdruck bezeichnet Daniels eng verbundene Mitstreiter. „Gefährten“ ist würdevoll, verständlich und kontextgemäß.
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: zusammen mit den übrigen Weisen Babylons
  rationale: Die Wendung schließt Daniel und seine Gefährten in die größere, vom Tod bedrohte Gruppe ein. „Weise Babylons“ ist die geläufige Bezeichnung für die Hofgelehrten.
theological_decisions:
- issue: Bedeutung von רָז im aramäischen Hofbericht
  choice: Geheimnis
  alternative: verborgene Sache; Geheimnis/Geheimsache
  rationale: Das Wort bezeichnet hier etwas, das menschlichem Wissen entzogen ist und von Gott offenbart werden muss. „Geheimnis“ bewahrt diese Offenbarungsdimension, ohne das Wort auf einen späteren theologischen Fachgebrauch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die finite Form „sie sollten … bitten“ macht die vom vorherigen Vers abhängige aramäische Infinitivkonstruktion verständlich. „Babylon“ wurde statt des traditionelleren „Babel“ gewählt, weil es für heutige Leser die Stadt und das Reich im Erzählzusammenhang eindeutig bezeichnet.
