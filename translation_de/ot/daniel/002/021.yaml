base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: de
  text: Er verändert Zeiten und Fristen[a]; er setzt Könige ab und setzt Könige ein; er gibt den Weisen Weisheit und denen Erkenntnis, die Einsicht besitzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „festgesetzte Zeiten“ statt „Fristen“. Das aramäische Wortpaar kann sowohl Zeiten allgemein als auch ihre passenden oder festgesetzten Zeitpunkte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „denen, die Einsicht kennen“; die aramäische Wendung lautet sinngemäß „den Kennern der Einsicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: verändert
  rationale: Das Partizip bezeichnet ein bewirkendes Verändern; „verändert“ gibt den fortdauernden, aktiven Sinn natürlich wieder.
- source_word: עִדָּנַיָּא
  choice: Zeiten
  rationale: Der aramäische Plural bezeichnet Zeiten oder Zeitabschnitte; „Zeiten“ ist direkt und im Deutschen idiomatisch.
- source_word: זִמְנַיָּא
  choice: Fristen
  rationale: In Verbindung mit עִדָּנַיָּא bezeichnet das Wort bestimmte oder passende Zeitpunkte. „Fristen“ wahrt eine gewisse Unterscheidung zu „Zeiten“, ohne die Bedeutung auf Jahreszeiten einzuengen.
- source_word: מְהַעְדֵּה
  choice: setzt … ab
  rationale: Bei Königen gibt „absetzen“ das verursachte Entfernen aus der Herrschaft natürlich wieder. Es bleibt bei der politischen Aussage des Kontexts, ohne eine gewaltsame Tötung anzudeuten.
- source_word: מַלְכִין
  choice: Könige
  rationale: Dies ist die direkte und sachlich passende Wiedergabe des pluralischen Substantivs.
- source_word: מְהָקֵים
  choice: setzt … ein
  rationale: Das Verb bedeutet aufrichten oder einsetzen. Im Gegensatz zu „Könige absetzen“ bezeichnet „Könige einsetzen“ im Deutschen klar die Übertragung von Herrschaft.
- source_word: יָהֵב
  choice: gibt
  rationale: „Gibt“ ist die schlichte und direkte Entsprechung des häufigen aramäischen Verbs.
- source_word: חָכְמְתָא
  choice: Weisheit
  rationale: „Weisheit“ ist die übliche und kontextgemäße Wiedergabe.
- source_word: לְחַכִּימִין
  choice: den Weisen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet weise Menschen; „den Weisen“ bewahrt die knappe, gehobene Form.
- source_word: מַנְדְּעָא
  choice: Erkenntnis
  rationale: „Erkenntnis“ hält den Begriff von der nachfolgenden „Einsicht“ auseinander und passt zum würdevollen Register.
- source_word: לְיָדְעֵי בִינָה
  choice: denen, die Einsicht besitzen
  rationale: Die wörtlich semitische Form „Kenner der Einsicht“ wird in natürliches Deutsch übertragen, wobei sowohl die Personengruppe als auch der Begriff „Einsicht“ erhalten bleiben.
theological_decisions:
- issue: Gottes Souveränität über politische Herrscher
  choice: Die unmittelbare Aussage bleibt bestehen, dass Gott Könige absetzt und einsetzt.
  alternative: Gott lässt Könige aufsteigen und fallen oder beeinflusst politische Veränderungen.
  rationale: Der Vers schreibt Gott beide Handlungen direkt zu. Die Übersetzung bewahrt diese starke Aussage, ohne sie zu einem weitergehenden deterministischen System auszubauen oder zu einer bloßen Erlaubnis abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzrhythmus. Die parallelen Verben und die direkte Zuschreibung an Gott bleiben erhalten; unnötige konfessionelle Festlegungen werden vermieden.
