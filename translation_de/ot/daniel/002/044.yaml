  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: de
  text: Und in den Tagen jener Könige[a] wird der Gott des Himmels ein Königreich errichten, das niemals zerstört werden wird. Dieses Königreich wird keinem anderen Volk überlassen werden. Es wird alle diese Königreiche[b] zerschmettern und ihnen ein Ende machen; selbst aber wird es ewig bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jene Könige“ verweist auf die im Traum Nebukadnezars dargestellten Könige beziehungsweise Königreiche. Auf welchen geschichtlichen Bezug der Ausdruck genau zielt, wird unterschiedlich verstanden.
    reason: alternative_reading
  - marker: b
    text: Gemeint sind die im Traum dargestellten Königreiche.
    reason: referent_clarification
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: Und in den Tagen jener Könige
  rationale: Die Formulierung bewahrt den erzählerischen Anschluss, den zeitlichen Sinn und den rückverweisenden Charakter des Demonstrativs, ohne den genauen historischen Bezug festzulegen.
- source_word: יְקִים
  choice: wird ... errichten
  rationale: „Errichten“ gibt das Aufrichten beziehungsweise Etablieren eines Königreichs natürlich und würdevoll wieder.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: der Gott des Himmels
  rationale: Dies ist die natürliche deutsche Wiedergabe des aramäischen Gottestitels.
- source_word: מַלְכוּ
  choice: ein Königreich
  rationale: Der unbestimmte Ausdruck führt das von Gott errichtete Königreich neu ein.
- source_word: דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: das niemals zerstört werden wird
  rationale: Die Wiedergabe bringt die dauerhafte Unzerstörbarkeit der negierten Aussage klar zum Ausdruck.
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: Dieses Königreich wird keinem anderen Volk überlassen werden
  rationale: „Dieses Königreich“ nimmt den vorherigen Ausdruck eindeutig auf; „überlassen“ bewahrt den passiven Sinn, dass es nicht in den Besitz eines anderen Volkes übergeht.
- source_word: תַּדִּק
  choice: Es wird ... zerschmettern
  rationale: „Zerschmettern“ gibt die starke Bedeutung des Zermalmens oder Zerbrechens wieder und passt zum Steinbild des Zusammenhangs.
- source_word: וְתָסֵיף
  choice: und ihnen ein Ende machen
  rationale: 'Die Formulierung wahrt den vom vorherigen Verb unterschiedenen kausativen Sinn: Diese Königreiche werden beendet.'
- source_word: כָּל אִלֵּין מַלְכְוָתָא
  choice: alle diese Königreiche
  rationale: Das Demonstrativ verweist auf die im Traum dargestellten Königreiche.
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: selbst aber wird es ewig bestehen
  rationale: „Bestehen“ gibt קום in seinem Sinn dauerhaften Fortbestands idiomatisch wieder; „selbst aber“ verdeutlicht den im Satz angelegten Gegensatz, ohne eine zusätzliche inhaltliche Aussage einzuführen.
theological_decisions:
- issue: Wesen und Identität des endgültigen Königreichs
  choice: Die Übersetzung nennt seinen göttlichen Ursprung, seine Unzerstörbarkeit, seinen Sieg und seinen ewigen Bestand, ohne es im Haupttext ausdrücklich christologisch oder konfessionell zu identifizieren.
  alternative: Das Königreich ausdrücklich als messianisches Reich Christi bezeichnen oder es lediglich als allgemeine zukünftige Gottesherrschaft umschreiben.
  rationale: Der aramäische Text selbst beschreibt Gottes ewiges Königreich, benennt hier aber keine weitergehende dogmatische Identifikation. Diese Spannung bleibt erhalten.
- issue: Bezug von „jener Könige“
  choice: Der rückverweisende Ausdruck bleibt ohne historische Präzisierung stehen.
  alternative: Den Ausdruck ausdrücklich auf alle vier Reiche, nur auf die Herrscher des geteilten Reiches oder auf eine bestimmte Endphase beziehen.
  rationale: Der Kontext stellt einen Bezug zu den im Traum dargestellten Königen beziehungsweise Königreichen her, lässt den genauen Umfang an dieser Stelle jedoch offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelregister. „Königreich“ erhält die konkrete Reichsbildsprache; „zerschmettern“ und „ewig bestehen“ bewahren die kräftigen Kontraste des aramäischen Textes. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar am einschlägigen Ausdruck.
