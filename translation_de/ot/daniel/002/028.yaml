base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: de
  text: 'Doch es gibt einen Gott im Himmel[a], der Geheimnisse offenbart, und er hat König Nebukadnezar wissen lassen, was in den letzten Tagen geschehen wird[b]. Dein Traum und die Visionen in deinem Kopf, als du auf deinem Bett lagst[c], waren diese:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die aramäische Wendung kann auch mit „Gott im Himmel“ oder „der Gott im Himmel“ wiedergegeben werden. Sie ist der Form nach nicht bestimmt, meint im Zusammenhang aber eindeutig den wahren Gott.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in späteren Tagen“ beziehungsweise „am Ende der Tage“. Die Wendung kann eine zukünftige entscheidende Zeit bezeichnen, ohne ein bestimmtes endzeitliches Schema festzulegen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Visionen deines Kopfes auf deinem Bett“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Doch
  rationale: Die adversative Partikel setzt Gottes Offenbarungskraft der Unfähigkeit der babylonischen Weisen entgegen; „Doch“ gibt diesen Kontrast knapp und würdig wieder.
- source_word: אִיתַי אֱלָהּ בִּשְׁמַיָּא
  choice: es gibt einen Gott im Himmel
  rationale: Die Existenzform wird idiomatisch mit „es gibt“ wiedergegeben. „Einen Gott“ bewahrt die formal nicht determinierte aramäische Ausdrucksweise und bezeichnet im Kontext eindeutig den wahren Gott.
- source_word: גָּלֵא רָזִין
  choice: der Geheimnisse offenbart
  rationale: Das Partizip kennzeichnet Gottes fortdauerndes beziehungsweise charakteristisches Handeln. „Geheimnisse“ gibt verborgene, nur durch göttliche Offenbarung zugängliche Sachverhalte natürlich wieder.
- source_word: וְהוֹדַע
  choice: und er hat … wissen lassen
  rationale: Die kausative Bedeutung „zu wissen geben“ bleibt gegenüber „offenbaren“ lexikalisch unterscheidbar; das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtiger Bedeutung.
- source_word: מָה דִּי לֶהֱוֵא
  choice: was … geschehen wird
  rationale: Die Formulierung gibt die Zukunftsaussage in natürlichem modernem Deutsch wieder, ohne sie unnötig zu präzisieren.
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: in den letzten Tagen
  rationale: Dies ist eine transparente Wiedergabe der zeitlichen Wendung und lässt deren mögliche endzeitliche Tragweite offen.
- source_word: חֶלְמָךְ
  choice: Dein Traum
  rationale: Entspricht dem Substantiv mit dem Suffix der zweiten Person maskulin Singular.
- source_word: וְחֶזְוֵי רֵאשָׁךְ
  choice: und die Bilder, die dir im Kopf kamen
  rationale: Die aramäische Wendung lautet wörtlich „Gesichte/Bilder deines Kopfes“. Die gewählte Form ist natürliches Deutsch und bewahrt sowohl den visuellen Charakter als auch den Bezug zum Kopf.
- source_word: עַל מִשְׁכְּבָךְ
  choice: als du auf deinem Bett lagst
  rationale: Die situative Bedeutung wird in modernem Deutsch klar ausgedrückt, ohne den Inhalt über den Kontext hinaus zu erweitern.
- source_word: דְּנָה הוּא
  choice: waren diese
  rationale: Die einleitende Formel verweist voraus auf die nun folgende Wiedergabe des Traums; der Numerus richtet sich im Deutschen natürlich nach „Traum und Bilder“.
theological_decisions:
- issue: Nicht determinierte Gottesbezeichnung אֱלָהּ in monotheistischem Zusammenhang
  choice: einen Gott im Himmel
  alternative: Gott im Himmel; den Gott im Himmel
  rationale: Die gewählte Fassung bewahrt die formal nicht determinierte aramäische Form und die rhetorische Situation am heidnischen Hof. Großschreibung und Kontext machen deutlich, dass Israels wahrer Gott gemeint ist, ohne eine ausdrücklichere Bestimmung in den Text einzutragen.
- issue: Zeitliche Wendung בְּאַחֲרִית יוֹמַיָּא
  choice: in den letzten Tagen
  alternative: in späteren Tagen; am Ende der Tage
  rationale: Die Wendung kann einen zukünftigen Höhepunkt oder eine endzeitliche Epoche bezeichnen. Die Übersetzung erhält diese Spannung, ohne ein bestimmtes eschatologisches System festzulegen.
- issue: Bildhafte Wendung חֶזְוֵי רֵאשָׁךְ
  choice: die Bilder, die dir im Kopf kamen
  alternative: die Gesichte deines Kopfes; die Bilder in deinem Kopf
  rationale: Die dynamische Formulierung ist für heutige Leser verständlich und gibt die innere visuelle Erfahrung wieder; eine Fußnote bewahrt die wörtliche Struktur.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Doch“ markiert den starken Gegensatz zum vorhergehenden Vers. „Wissen lassen“ vermeidet die Wiederholung von „offenbaren“. Die ungewöhnlichen aramäischen Formulierungen zur Gottesbezeichnung, Zeitangabe und inneren Schau werden im Haupttext natürlich wiedergegeben und in den Fußnoten transparent gemacht.
