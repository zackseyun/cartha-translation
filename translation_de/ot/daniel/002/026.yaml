  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר לְ/דָנִיֵּ֔אל דִּ֥י שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר ה/איתי/ך כָּהֵ֗ל לְ/הוֹדָעֻתַ֛/נִי חֶלְמָ֥/א דִֽי חֲזֵ֖ית וּ/פִשְׁרֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: de
  text: 'Der König antwortete und sagte zu Daniel, dessen Name Beltschazar war: „Bist du imstande, mir den Traum, den ich gesehen habe, und seine Deutung bekannt zu machen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Der König antwortete und sagte
  rationale: Die für das biblische Aramäisch typische Doppelwendung wird beibehalten, obwohl im heutigen Deutsch ein einzelnes Redeverb genügen könnte.
- source_word: לְדָנִיֵּאל
  choice: zu Daniel
  rationale: Die Präposition kennzeichnet den Adressaten; „zu Daniel“ ist in Verbindung mit „sagte“ natürliches Standarddeutsch.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: dessen Name Beltschazar war
  rationale: Die aramäische Wendung wird als Relativsatz wiedergegeben; das Präteritum fügt sich in den Erzählrahmen ein.
- source_word: הֲאִיתָךְ כָּהֵל
  choice: Bist du imstande
  rationale: Die Verbindung fragt unmittelbar nach Daniels Fähigkeit; „imstande“ ist natürlich und bewahrt den Sinn von Können beziehungsweise Befähigung.
- source_word: לְהוֹדָעֻתַנִי
  choice: mir … bekannt zu machen
  rationale: Die Kausativform von ידע bedeutet, jemanden wissen zu lassen. „Bekannt zu machen“ bildet diesen kausativen Gehalt genauer ab als das schlichtere „zu sagen“.
- source_word: חֶלְמָא דִי חֲזֵית
  choice: den Traum, den ich gesehen habe
  rationale: Der bestimmte Traum wird durch einen Relativsatz näher bezeichnet; das Perfekt klingt in direkter Rede im modernen Deutsch natürlich.
- source_word: וּפִשְׁרֵהּ
  choice: und seine Deutung
  rationale: פשר bezeichnet in Daniel regelmäßig die Auslegung eines Traums oder Geheimnisses. „Deutung“ bewahrt diesen fachlichen Sinn und bezieht das Possessivpronomen eindeutig auf den Traum.
