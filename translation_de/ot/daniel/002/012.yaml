  terminology: „Weisen Babylons“ ist als Bezeichnung der babylonischen Hofweisen passend. „König“ und „befahl“ treffen Register und Kontext. Für לְהוֹבָדָה ist „töten zu lassen“ im unmittelbaren Kontext eines gegen Personen gerichteten Befehls präziser als das potenziell umfassendere „vernichten“, ohne eine darüber hinausgehende theologische oder historische Deutung einzutragen.
