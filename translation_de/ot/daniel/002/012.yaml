lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Aus diesem Grund
  rationale: Die aramäische Wendung bezeichnet ausdrücklich den Grund beziehungsweise die Folgerung. „Aus diesem Grund“ klingt im modernen Deutschen natürlich und bewahrt den kausalen Bezug.
- source_word: מַלְכָּא
  choice: der König
  rationale: Die bestimmte emphatische Form wird direkt und idiomatisch mit „der König“ wiedergegeben.
- source_word: בְּנַס
  choice: wurde ... zornig
  rationale: Das Verb bezeichnet das Entbrennen oder Eintreten von Zorn. Die Formulierung bewahrt den Vorgangscharakter, ohne die Intensivierung des folgenden Ausdrucks vorwegzunehmen.
- source_word: וּקְצַף שַׂגִּיא
  choice: und geriet in großen Grimm
  rationale: קְצַף bezeichnet heftigen Zorn beziehungsweise Grimm; שַׂגִּיא verstärkt ihn. Die Wiedergabe erhält die Häufung zweier Zornausdrücke und bleibt in würdigem, verständlichem Deutsch.
- source_word: וַאֲמַר
  choice: Er befahl
  rationale: Wörtlich bedeutet das Verb „er sagte“. Im Kontext leitet es jedoch einen königlichen Tötungsbefehl ein; „befahl“ gibt seine pragmatische Funktion natürlich wieder.
- source_word: לְהוֹבָדָה
  choice: zu vernichten
  rationale: Der Kausativ von אבד bedeutet hier, jemanden zugrunde gehen zu lassen beziehungsweise zu vernichten. Der Infinitiv fügt sich unmittelbar an „befahl“ an.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: alle Weisen Babylons
  rationale: Die Konstruktion bezeichnet die Gesamtheit der babylonischen Hofweisen. „Weise“ ist hier als substantivierte Gruppenbezeichnung idiomatisch und vermeidet eine unnötige geschlechtliche Festlegung über den Ausdruck hinaus.
