base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: de
  text: Da befahl[a] der König, die Magier, die Beschwörer, die Zauberer und die Chaldäer[b] rufen zu lassen, damit sie ihm seine Träume mitteilten. Da kamen sie und traten vor den König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der König sagte, ... zu rufen«; die hebräische Wendung bedeutet hier, dass er ihre Herbeirufung befahl.'
    reason: lexical_alternative
  - marker: b
    text: »Chaldäer« kann das chaldäische Volk bezeichnen oder hier eine Gruppe babylonischer Hofgelehrter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: befahl ... rufen zu lassen
  rationale: Wörtlich steht hier »der König sagte, ... zu rufen«. In Verbindung mit dem Infinitiv hat וַיֹּאמֶר jedoch befehlenden Sinn; die gewählte Formulierung gibt sowohl den königlichen Auftrag als auch das Herbeirufen natürlich wieder.
- source_word: חַרְטֻמִּים
  choice: Magier
  rationale: Der Ausdruck bezeichnet am Hof tätige magisch-religiöse Fachleute. »Magier« ist verständlich, ausreichend weit und vermeidet eine unbelegte Spezialisierung.
- source_word: אַשָּׁפִים
  choice: Beschwörer
  rationale: Die genaue Funktion dieser Gruppe ist umstritten. »Beschwörer« wahrt die Zugehörigkeit zum Bereich okkulter Praktiken und unterscheidet sie von den übrigen genannten Gruppen, ohne sie vorschnell als Astrologen festzulegen.
- source_word: מְכַשְּׁפִים
  choice: Zauberer
  rationale: Das Wort bezeichnet Menschen, die Zauberei betreiben. »Zauberer« ist im modernen Deutschen klar und bewahrt hier den ernsten, okkulten Sinn.
- source_word: כַּשְׂדִּים
  choice: Chaldäer
  rationale: Die Wiedergabe erhält die Bezeichnung des Ausgangstextes und damit die mögliche ethnische wie auch berufsständische Bedeutung; eine Fußnote erläutert die Mehrdeutigkeit.
- source_word: לְהַגִּיד ... חֲלֹמֹתָיו
  choice: damit sie dem König seine Träume nannten
  rationale: לְהַגִּיד bedeutet mitteilen, kundtun oder nennen, nicht ausdrücklich »deuten«. »Seine Träume nannten« passt zum Erzählzusammenhang und vermeidet es, die Traumdeutung bereits in den Wortlaut hineinzutragen.
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: Da kamen sie und traten vor den König
  rationale: Die Formulierung gibt die beiden aufeinanderfolgenden Erzählverben wieder. »Vor den König treten« ist im Deutschen eine natürliche höfische Wendung für das Erscheinen vor einem Herrscher.
theological_decisions:
- issue: 'Aufgabe der Hofgelehrten: Traum nennen oder deuten'
  choice: seine Träume nannten
  alternative: seine Träume deuteten
  rationale: Der hebräische Vers verwendet לְהַגִּיד (»mitteilen/nennen«), nicht das übliche Wort für »deuten«. Die Übersetzung bewahrt diese für den Fortgang der Erzählung wichtige Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der vier Gruppen bleibt erhalten; die nicht völlig sicher bestimmbaren Amtsbezeichnungen werden verständlich, aber ohne unnötige Präzisierung wiedergegeben. »Da« führt beide Erzählabschnitte knapp und bibelsprachlich vertraut fort.
