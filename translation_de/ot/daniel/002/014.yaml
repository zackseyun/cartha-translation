source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּנִיֵּ֗אל הֲתִיב֙ עֵטָ֣א וּ/טְעֵ֔ם לְ/אַרְי֕וֹךְ רַב טַבָּחַיָּ֖/א דִּ֣י מַלְכָּ֑/א דִּ֚י נְפַ֣ק לְ/קַטָּלָ֔ה לְ/חַכִּימֵ֖י בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: de
  text: Da antwortete Daniel Arjoch[a], dem Obersten der königlichen Scharfrichter, mit Rat und Besonnenheit. Dieser war ausgezogen, um die Weisen von Babel zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Obersten der königlichen Leibwache“. Der aramäische Titel bedeutet wörtlich „Oberster der Schlachtenden“ und kann im königlichen Umfeld Scharfrichter oder die Leibwache bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; „Da“ wahrt den gehobenen Erzählton und den zeitlichen Fortgang.
- source_word: הֲתִיב
  choice: antwortete
  rationale: Das Verb bezeichnet hier eine sprachliche Reaktion; „antwortete“ entspricht dem üblichen biblisch-aramäischen Sprachgebrauch.
- source_word: עֵטָא וּטְעֵם
  choice: mit Rat und Besonnenheit
  rationale: Die beiden Substantive bezeichnen Rat sowie Urteilsvermögen beziehungsweise taktvolle Umsicht. Die Wiedergabe erhält beide Begriffe, ohne ein im Ausgangstext fehlendes Adjektiv hinzuzufügen.
- source_word: לְאַרְיוֹךְ
  choice: Arjoch
  rationale: Der Personenname wird in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: dem Obersten der königlichen Scharfrichter
  rationale: Der Titel bedeutet wörtlich den Obersten der Schlachtenden; angesichts des unmittelbaren Auftrags, die Weisen zu töten, bezeichnet „Scharfrichter“ die Funktion treffend. Die mögliche Bedeutung als Leibwache wird in der Fußnote bewahrt.
- source_word: דִּי נְפַק
  choice: Dieser war ausgezogen
  rationale: Die Relativkonstruktion nimmt Arjoch wieder auf. Das Plusquamperfekt verdeutlicht natürlich, dass sein Ausziehen Daniels Antwort vorausging.
- source_word: לְקַטָּלָה
  choice: um … zu töten
  rationale: Die Infinitivkonstruktion gibt den Zweck des Ausziehens an; „töten“ wahrt die direkte Härte des aramäischen Ausdrucks.
- source_word: לְחַכִּימֵי בָּבֶל
  choice: die Weisen von Babel
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Bezeichnung für die Weisen am babylonischen Hof.
