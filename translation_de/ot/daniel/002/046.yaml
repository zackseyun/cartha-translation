  variant: modern standard German
source:
  edition: WLC
  text: בֵּ֠/אדַיִן מַלְכָּ֤/א נְבֽוּכַדְנֶצַּר֙ נְפַ֣ל עַל אַנְפּ֔וֹ/הִי וּ/לְ/דָנִיֵּ֖אל סְגִ֑ד וּ/מִנְחָה֙ וְ/נִ֣יחֹחִ֔ין אֲמַ֖ר לְ/נַסָּ֥כָה לֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: de
  text: Da fiel König Nebukadnezar mit dem Gesicht zur Erde und huldigte Daniel[a]. Er befahl, ihm eine Opfergabe und Räucherwerk[c] darzubringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete Daniel an“ beziehungsweise „warf sich vor Daniel nieder“. Das aramäische Verb kann Niederwerfung oder ehrerbietige Huldigung, aber auch kultische Verehrung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Das mit „darzubringen“ wiedergegebene Verb bezeichnet genauer das Ausgießen, besonders einer Trankspende.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Wohlgerüche“ oder „angenehme Düfte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; „Da“ ist im Deutschen natürlich und wahrt den narrativen Fortgang.
- source_word: מַלְכָּא נְבוּכַדְנֶצַּר
  choice: König Nebukadnezar
  rationale: Titel und Name werden im Deutschen idiomatisch in dieser Reihenfolge wiedergegeben.
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: fiel … mit dem Gesicht zur Erde
  rationale: Die körperlich anschauliche Wendung bleibt erhalten, klingt aber natürlicher als das wörtlichere „fiel auf sein Gesicht“.
- source_word: סְגִד
  choice: huldigte
  rationale: Das Verb kann Niederwerfung, ehrerbietige Huldigung oder kultische Verehrung bezeichnen. „Huldigte“ bewahrt die starke Ehrerbietung, ohne eindeutig göttliche Anbetung festzulegen.
- source_word: מִנְחָה
  choice: eine Opfergabe
  rationale: Der Ausdruck kann Gabe, Abgabe oder Opfergabe bezeichnen. Der Zusammenhang mit Räucherwerk und Darbringung legt hier die kultisch gefärbte, aber nicht näher bestimmte „Opfergabe“ nahe.
- source_word: נִיחֹחִין
  choice: Räucherwerk
  rationale: Der Plural bezeichnet wörtlicher wohlriechende beziehungsweise angenehme Düfte im Zusammenhang einer Opferdarbringung; „Räucherwerk“ gibt dies knapp und idiomatisch wieder.
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: Er befahl, ihm … darzubringen
  rationale: אֲמַר hat in dieser Konstruktion befehlenden Sinn. „Darbringen“ verbindet sich im Deutschen natürlich mit beiden genannten Opfergaben; das zugrunde liegende Verb נְסַךְ weist enger auf Ausgießen beziehungsweise ein Trankopfer hin.
theological_decisions:
- issue: Ob סְגִד gegenüber Daniel ausdrücklich als göttliche Anbetung wiederzugeben ist
  choice: huldigte Daniel
  alternative: betete Daniel an; warf sich vor Daniel nieder
  rationale: Das Aramäische lässt sowohl ehrerbietige Niederwerfung als auch kultisch verstandene Verehrung zu. „Huldigte“ lässt die auffallend starke Ehrung bestehen, ohne Daniel durch die Übersetzung ausdrücklich zum Empfänger göttlicher Anbetung zu erklären.
- issue: Wie der kultische Charakter der für Daniel bestimmten Gaben wiederzugeben ist
  choice: Opfergabe und Räucherwerk
  alternative: Gabe und Wohlgerüche
  rationale: Der Wortlaut besitzt deutliche kultische Anklänge, obwohl die genaue Art der Gaben nicht vollständig bestimmt ist. Die gewählte Fassung bewahrt diesen befremdlichen Zug und schwächt ihn nicht zu bloßen höfischen Geschenken ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Körperhaltung und die kultische Spannung des Verses bleiben erhalten; unnötig altertümliche Formulierungen wie „auf sein Angesicht“ werden vermieden.
