  text: וְ/אֶצְבְּעָת֙ רַגְלַיָּ֔/א מנ/הון פַּרְזֶ֖ל ו/מנ/הון חֲסַ֑ף מִן קְצָ֤ת מַלְכוּתָ/א֙ תֶּהֱוֵ֣ה תַקִּיפָ֔ה וּ/מִנַּ֖/הּ תֶּהֱוֵ֥ה תְבִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: de
  text: Und wie die Zehen der Füße teils aus Eisen und teils aus Ton[a] waren, so wird das Königreich zum Teil stark und zum Teil brüchig[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Töpferware“ bzw. „Keramik“ für den hier mit „Ton“ wiedergegebenen aramäischen Ausdruck.
    reason: lexical_alternative
  - marker: b
    text: Oder „zerbrechlich“ bzw. „leicht zerbrechbar“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: die Zehen der Füße
  rationale: Die konstruktusartige Verbindung bezeichnet wörtlich die Zehen der Füße. Obwohl „Zehen“ im Deutschen bereits die Füße voraussetzt, bewahrt die vollständige Wendung die Bildsprache und die Verbindung zur Statue.
- source_word: מנ/הון ... ו/מנ/הון
  choice: teils ... und teils
  rationale: Die wiederholte Präposition mit Pronominalsuffix bedeutet wörtlich „von ihnen“, bezeichnet hier aber idiomatisch die unterschiedliche stoffliche Zusammensetzung.
- source_word: פַּרְזֶל
  choice: Eisen
  rationale: Dies ist die übliche und im Bild der Statue eindeutige Bezeichnung des Metalls.
- source_word: חֲסַף
  choice: Ton
  rationale: Das aramäische Wort bezeichnet hier keramisches Material. „Ton“ bildet im Deutschen einen natürlichen Gegensatz zu Eisen; mögliche Alternativen werden in der Fußnote genannt.
- source_word: מִן קְצָת
  choice: zum Teil
  rationale: Die Wendung kennzeichnet einen Teilaspekt des Königreichs und leitet den Gegensatz seiner beiden Eigenschaften ein.
- source_word: מַלְכוּתָא
  choice: das Königreich
  rationale: Das Substantiv bezeichnet das durch Füße und Zehen dargestellte Reich. „Königreich“ ist die klare und kontextgemäße Wiedergabe.
- source_word: תֶּהֱוֵה
  choice: wird ... sein
  rationale: Das Verb „sein“ beschreibt hier den zukünftigen Zustand des Königreichs; die deutsche Futurform gibt dies verständlich wieder.
- source_word: תַקִּיפָה
  choice: stark
  rationale: Das Adjektiv bezeichnet Stärke oder Festigkeit. „Stark“ entspricht direkt dem durch Eisen vermittelten Bild.
- source_word: וּ/מִנַּהּ
  choice: und zum Teil
  rationale: Das feminine Suffix verweist auf das Königreich zurück. Die Wiedergabe macht den gegensätzlichen Anteil idiomatisch deutlich.
- source_word: תְבִירָה
  choice: brüchig
  rationale: Das Adjektiv kann Gebrochenheit oder Zerbrechlichkeit bezeichnen. Im Gegensatz von Eisen und Ton beschreibt „brüchig“ passend die strukturelle Schwäche, ohne zwingend zu behaupten, das Reich sei bereits zerbrochen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vergleichende Satzstruktur „wie … so“ bewahrt die enge Verbindung zwischen den Zehen der Statue und der Beschaffenheit des Königreichs; „teils … teils“ und „zum Teil … zum Teil“ geben die wiederholte Teilungsstruktur natürlich wieder.
