review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn wird im Wesentlichen richtig wiedergegeben: Arjoch bringt Daniel unverzüglich vor den König und meldet, dass dieser die Deutung bekannt machen könne. Die Zuordnung von „aus Juda“ zu den „Verschleppten“ ist jedoch im Deutschen weniger präzise als die aramäische Kennzeichnung der Exilierten als Judäer/Judäer aus Juda.'
  naturalness: „Eilends“ ist verständlich, wirkt im modernen Standarddeutsch aber merklich literarisch. „Eilig“ ist natürlicher und bewahrt die Dringlichkeit. Die Formulierung „unter den judäischen Verschleppten“ ist zugleich idiomatisch und klarer als „unter den Verschleppten aus Juda“.
  terminology: „Deutung“ gibt פִּשְׁרָא als Daniel-typischen Fachausdruck angemessen wieder. „Judäisch“ ist hier eine historisch-geographische Volksbezeichnung und vermeidet eine unangebrachte Einengung auf spätere Konnotationen von „jüdisch“.
  issues:
  - severity: low
    issue: Die Verbindung „Verschleppte aus Juda“ ist semantisch etwas unbestimmt.
    rationale: Das Aramäische bezeichnet die Exilierten selbst als zu Juda gehörig. „Judäische Verschleppte“ bildet diese Zuordnung unmittelbarer ab.
  - severity: low
    issue: „Eilends“ ist stilistisch leicht veraltet bzw. gehoben.
    rationale: Für modernes Standarddeutsch ist „eilig“ die unmarkiertere Wiedergabe von בְּהִתְבְּהָלָה; die Dringlichkeit bleibt erhalten.
  - severity: low
    issue: Die Fußnotenalternative „einen Judäer“ passt nicht unmittelbar als Alternative zu „aus Juda“.
    rationale: Sie wechselt von einer Gruppenkennzeichnung zu einer Bezeichnung des einzelnen Mannes. Die Fußnote sollte Alternativen für die Gruppenbezeichnung bieten.
  revised_text: 'Dann brachte Arjoch Daniel eilig vor den König und sagte zu ihm: „Ich habe unter den judäischen Verschleppten einen Mann gefunden, der dem König die Deutung bekannt machen wird.“'
  revised_footnotes:
  - marker: a
    text: Oder „unter den Verschleppten aus Juda“ oder „unter den jüdischen Verschleppten“. Das Aramäische kennzeichnet Daniel als Angehörigen der aus Juda stammenden exilierten Bevölkerung.
    reason: lexical_alternative
  revision_rationale: Die Überarbeitung präzisiert die historische Zugehörigkeitsbezeichnung im Satz selbst, modernisiert die leicht altertümliche Adverbwahl und richtet die Fußnote syntaktisch sowie semantisch auf die tatsächlich übersetzte Gruppenbezeichnung aus. Der technische Ausdruck „Deutung“ und die zurückhaltende Wiedergabe von „bekannt machen“ bleiben erhalten.
