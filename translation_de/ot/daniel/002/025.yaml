  text: אֱדַ֤יִן אַרְיוֹךְ֙ בְּ/הִתְבְּהָלָ֔ה הַנְעֵ֥ל לְ/דָנִיֵּ֖אל קֳדָ֣ם מַלְכָּ֑/א וְ/כֵ֣ן אֲמַר לֵ֗/הּ דִּֽי הַשְׁכַּ֤חַת גְּבַר֙ מִן בְּנֵ֤י גָֽלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י פִשְׁרָ֖/א לְ/מַלְכָּ֥/א יְהוֹדַֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: de
  text: 'Dann brachte Arjoch Daniel eilig vor den König und sagte zu ihm: „Ich habe unter den judäischen Verschleppten einen Mann gefunden, der dem König die Deutung bekannt machen wird.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das nächste Ereignis ein; „Da“ wahrt den natürlichen Erzählfluss.
- source_word: בְּהִתְבְּהָלָה
  choice: eilends
  rationale: Die Wendung bezeichnet Eile oder Dringlichkeit. „Eilends“ ist knapp, würdig und vermeidet die weniger wahrscheinliche Nuance „bestürzt“.
- source_word: הַנְעֵל
  choice: brachte
  rationale: Der Kausativ bezeichnet das Hinein- oder Hinaufführen; mit „vor den König“ ist „brachte“ im Deutschen idiomatisch.
- source_word: קֳדָם מַלְכָּא
  choice: vor den König
  rationale: Dies ist die natürliche deutsche Wiedergabe der höfischen Wendung für das Erscheinen in der Gegenwart des Königs.
- source_word: וְכֵן אֲמַר לֵהּ
  choice: und sagte zu ihm
  rationale: Die Formel leitet direkte Rede ein; ein ausdrückliches „so“ wäre im Deutschen unnötig schwerfällig.
- source_word: הַשְׁכַּחַת
  choice: Ich habe ... gefunden
  rationale: Das Perfekt berichtet einen abgeschlossenen Fund mit unmittelbarer Bedeutung für die gegenwärtige Situation.
- source_word: גְּבַר
  choice: einen Mann
  rationale: Das Substantiv bezeichnet spezifisch einen männlichen Menschen; „Mann“ gibt dies genau wieder.
- source_word: מִן בְּנֵי גָלוּתָא
  choice: unter den Verschleppten
  rationale: Die idiomatische Wendung meint Angehörige der deportierten Bevölkerung. „Verschleppte“ macht den historischen Zwangskontext deutlicher als das allgemeinere „Exilierte“.
- source_word: דִּי יְהוּד
  choice: aus Juda
  rationale: Die Formulierung bezeichnet die Zugehörigkeit beziehungsweise Herkunft aus Juda im Kontext der Verschleppung und bleibt eng am Aramäischen.
- source_word: פִשְׁרָא
  choice: die Deutung
  rationale: Das Wort ist in Daniel ein wiederkehrender Fachausdruck für die Deutung von Träumen und Geheimnissen.
- source_word: יְהוֹדַע
  choice: bekannt geben wird
  rationale: Der Kausativ bedeutet „wissen lassen/bekannt machen“. Die Wiedergabe bewahrt die Aussage, ohne mit „offenbaren“ eine stärkere theologische Nuance einzutragen.
theological_decisions:
- issue: Historisch-ethnische Bezeichnung דִּי יְהוּד
  choice: aus Juda
  alternative: von den Juden; ein Judäer
  rationale: Im exilischen Hofbericht geht es um Herkunft und Volkszugehörigkeit. „Aus Juda“ bleibt transparent und legt die Bezeichnung nicht vorschnell auf eine spätere ethnoreligiöse Terminologie fest; die möglichen Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höfische Sprache bleibt knapp; „eilends“ setzt einen leicht gehobenen, aber noch geläufigen Akzent.
