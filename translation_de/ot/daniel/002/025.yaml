- from: 'Da brachte Arjoch Daniel eilends vor den König und sagte zu ihm: „Ich habe unter den Verschleppten aus Juda[a] einen Mann gefunden, der dem König die Deutung bekannt geben wird.“'
  to: 'Dann brachte Arjoch Daniel eilig vor den König und sagte zu ihm: „Ich habe unter den judäischen Verschleppten einen Mann gefunden, der dem König die Deutung bekannt machen wird.“'
  rationale: Die Überarbeitung präzisiert die historische Zugehörigkeitsbezeichnung im Satz selbst, modernisiert die leicht altertümliche Adverbwahl und richtet die Fußnote syntaktisch sowie semantisch auf die tatsächlich übersetzte Gruppenbezeichnung aus. Der technische Ausdruck „Deutung“ und die zurückhaltende Wiedergabe von „bekannt machen“ bleiben erhalten.
