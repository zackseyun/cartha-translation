  text: לָ֣/ךְ אֱלָ֣הּ אֲבָהָתִ֗/י מְהוֹדֵ֤א וּ/מְשַׁבַּח֙ אֲנָ֔ה דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א יְהַ֣בְתְּ לִ֑/י וּ/כְעַ֤ן הֽוֹדַעְתַּ֨/נִי֙ דִּֽי בְעֵ֣ינָא מִנָּ֔/ךְ דִּֽי מִלַּ֥ת מַלְכָּ֖/א הוֹדַעְתֶּֽ/נָא׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: de
  text: 'Dir, Gott meiner Väter[a], danke ich und lobe dich, denn du hast mir Weisheit und Kraft gegeben. Und nun hast du mir kundgetan, worum wir dich gebeten haben: Du hast uns die Angelegenheit des Königs kundgetan[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott meiner Vorfahren“. Wörtlich steht im Aramäischen „Gott meiner Väter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Wort des Königs“ beziehungsweise „die Sache des Königs“. Der aramäische Ausdruck hat ein breites Bedeutungsspektrum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: Gott meiner Väter
  rationale: Bewahrt die wörtliche familiäre und heilsgeschichtliche Wendung; „Vorfahren“ ist im Deutschen ebenfalls möglich.
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: danke ich und lobe dich
  rationale: Gibt beide koordinierten Handlungen natürlich und würdig wieder; das ergänzte „dich“ macht den deutschen Satz idiomatisch und bezieht beide Verben klar auf Gott.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: Weisheit und Kraft
  rationale: „Kraft“ deckt die von גְבוּרְתָא bezeichnete Stärke oder Macht in natürlichem modernem Deutsch ab, ohne sie auf körperliche Stärke zu verengen.
- source_word: יְהַבְתְּ לִי
  choice: du hast mir ... gegeben
  rationale: Das Perfekt bezeichnet die vollzogene Gabe mit fortdauernder Bedeutung im Gebetszusammenhang.
- source_word: וּכְעַן
  choice: Und nun
  rationale: Markiert klar den Übergang zur gegenwärtigen Offenbarung.
- source_word: הוֹדַעְתַּנִי
  choice: du hast mir kundgetan
  rationale: Gibt den Kausativ von ידע als „bekannt machen“ wieder und ermöglicht die erkennbare Wiederholung desselben Verbstamms am Versende.
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: worum wir dich gebeten haben
  rationale: Bewahrt die erste Person Plural und formuliert die Bitte im Deutschen idiomatisch; „was wir von dir erbeten haben“ bleibt als Alternative möglich.
- source_word: מִלַּת מַלְכָּא
  choice: die Angelegenheit des Königs
  rationale: מִלָּה kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. Hier bleibt „Angelegenheit“ hinreichend weit und legt Traum und Deutung nicht ausdrücklich in den Vers hinein.
- source_word: הוֹדַעְתֶּנָא
  choice: du hast uns ... kundgetan
  rationale: Bewahrt ausdrücklich das aramäische Pluralsuffix und damit den gemeinschaftlichen Bezug auf Daniel und seine Gefährten.
theological_decisions:
- issue: Bundesgeschichtlich geprägte Anrede Gottes
  choice: Gott meiner Väter
  alternative: Gott meiner Vorfahren
  rationale: Die traditionelle Wendung erhält die familiäre Kontinuität mit früheren Generationen Israels, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Wechsel von Singular zu Plural
  choice: mir ... wir ... uns
  alternative: durchgehend singularische Wiedergabe
  rationale: Der aramäische Text wechselt ausdrücklich vom Singular zum Plural. Die Übersetzung erhält diese Spannung und den gemeinschaftlichen Zusammenhang des Gebets.
- issue: Semantische Breite von מִלַּת מַלְכָּא
  choice: die Angelegenheit des Königs
  alternative: das Wort des Königs
  rationale: Die breitere Wiedergabe bezeichnet die vom König vorgelegte Sache, ohne ihren Inhalt an dieser Stelle interpretierend auszuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kundtun“ ist leicht gehoben, aber allgemein verständlich und bewahrt die auffällige Wiederholung des aramäischen Verbs. Die Satzteilung verhindert einen überladenen deutschen Periodensatz.
