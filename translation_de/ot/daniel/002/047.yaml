  source_fidelity: 'Die Übersetzung gibt die aramäische Aussage vollständig und sachgerecht wieder: die erzählerische Doppelung „antwortete … und sagte“, die Bekräftigung מִן־קְשֹׁט, das pluralische Suffix in „euer Gott“, die Hoheitstitel sowie den kausalen Abschluss. „Denn du konntest“ hält dabei treffend die Spannung zwischen der Anrede an Daniel allein und dem zuvor pluralischen „euer“ fest. Die finite Form „er offenbart Geheimnisse“ gibt das prädikative Partizip idiomatisch wieder, ohne den Sinn zu verändern.'
