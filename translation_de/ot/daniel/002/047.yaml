  text: עָנֵה֩ מַלְכָּ֨/א לְ/דָנִיֵּ֜אל וְ/אָמַ֗ר מִן קְשֹׁט֙ דִּ֣י אֱלָהֲ/כ֗וֹן ה֣וּא אֱלָ֧הּ אֱלָהִ֛ין וּ/מָרֵ֥א מַלְכִ֖ין וְ/גָלֵ֣ה רָזִ֑ין דִּ֣י יְכֵ֔לְתָּ לְ/מִגְלֵ֖א רָזָ֥/ה דְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: de
  text: 'Der König antwortete Daniel und sagte: „In Wahrheit: Euer Gott ist der Gott der Götter und der Herr der Könige, und er offenbart Geheimnisse[a]; denn du konntest dieses Geheimnis offenbaren.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verborgene Dinge“. Das aramäische Wort bezeichnet allgemein etwas Verborgenes; „Geheimnisse“ bewahrt jedoch die wiederkehrende Sprache Daniels für Dinge, die Gott offenbart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: antwortete ... und sagte
  rationale: Die aramäische Erzählformel enthält beide Verben. Die Wiedergabe bewahrt sie, bleibt im Deutschen verständlich und führt natürlich in die direkte Rede.
- source_word: מִן קְשֹׁט
  choice: In Wahrheit
  rationale: Die Wendung bekräftigt die folgende Aussage. „In Wahrheit“ ist würdevoll, verständlich und gibt den emphatischen Sinn wieder.
- source_word: אֱלָהֲכוֹן
  choice: euer Gott
  rationale: Das Suffix ist pluralisch und bezieht Daniel und seine Gefährten ein. Daher wird nicht zum singularischen „dein Gott“ verengt.
- source_word: אֱלָהּ אֱלָהִין
  choice: der Gott der Götter
  rationale: Die Status-constructus-Verbindung bezeichnet höchste Hoheit. Der bestimmte Artikel ergibt sich im Deutschen natürlich aus der Aussage über „euer Gott“.
- source_word: וּמָרֵא מַלְכִין
  choice: und der Herr der Könige
  rationale: מָרֵא kann „Herr“ oder „Gebieter“ bedeuten. „Herr“ bewahrt den gehobenen königlich-theologischen Titel.
- source_word: וְגָלֵה רָזִין
  choice: und er offenbart Geheimnisse
  rationale: Das Partizip beschreibt Gottes kennzeichnendes Handeln. Die finite deutsche Form ist natürlich und bewahrt den Aussagegehalt.
- source_word: רָזִין / רָזָה
  choice: Geheimnisse / Geheimnis
  rationale: רָז bezeichnet verborgene Sachverhalte, die durch göttliche Offenbarung bekannt werden. „Geheimnis“ bewahrt zugleich Daniels wiederkehrende Offenbarungssprache.
- source_word: דִּי יְכֵלְתָּ
  choice: denn du konntest
  rationale: דִּי leitet hier den Grund für das Bekenntnis des Königs ein. „Denn“ gibt diesen kausalen Zusammenhang knapp und natürlich wieder.
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: dieses Geheimnis offenbaren
  rationale: Die Wiederholung von „offenbaren“ entspricht der Wiederholung der Wurzel גלה und verweist auf den konkreten Traum samt seiner Deutung.
theological_decisions:
- issue: Ob Nebukadnezars Aussage als vollständige monotheistische Bekehrung oder als begrenzte Anerkennung von Gottes höchster Hoheit wiederzugeben ist
  choice: 'Ein starkes Bekenntnis zur Hoheit von Daniels Gott: „der Gott der Götter und der Herr der Könige“'
  alternative: Eine stärkere, ausschließliche Paraphrase wie „euer Gott allein ist Gott“ oder eine abschwächende polytheistische Wiedergabe
  rationale: Der aramäische Text erkennt Daniels Gott mit höchsten Titeln an, sagt aber nicht ausdrücklich, dass Nebukadnezar alle anderen Götter verworfen hat. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt quellennah, ohne unnötig altertümlich zu wirken. Das pluralische „euer“ wird gegenüber dem englischen Konsultationstext präzisiert, weil der aramäische Suffix pluralisch ist. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
