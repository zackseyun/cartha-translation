source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: de
  text: Da wurden das Eisen, der Ton, die Bronze, das Silber und das Gold alle zugleich[a] zermalmt. Sie wurden zu Spreu[b] von den Tennen im Sommer, und der Wind trug sie fort, sodass kein Ort mehr für sie zu finden war. Der Stein aber, der das Standbild getroffen hatte, wurde zu einem großen Berg und erfüllte die ganze Erde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammen“ oder „alle auf einmal“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie Staub“; das aramäische Bild bezeichnet leichtes Dreschgut, das der Wind fortträgt.'
    reason: lexical_alternative
  - marker: c
    text: „Erde“ kann auch mit „Land“ wiedergegeben werden; der umfassende Horizont der Vision spricht hier für „Erde“.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker leitet das unmittelbar folgende Geschehen ein; „Da“ ist im Deutschen knapp, natürlich und würdevoll.
- source_word: דָּקוּ
  choice: wurden zermalmt
  rationale: Das passive Verb beschreibt die vollständige Zerkleinerung der Materialien und passt zum anschließenden Vergleich mit Spreu.
- source_word: כַחֲדָה
  choice: alle zugleich
  rationale: Die Wendung bezeichnet gemeinsames beziehungsweise gleichzeitiges Geschehen; „alle zugleich“ wahrt beide Aspekte, ohne unnötig plötzliche Wirkung einzutragen.
- source_word: חַסְפָּא
  choice: der Ton
  rationale: Im Zusammenhang mit dem Standbild bezeichnet das Wort dessen spröden Bestandteil; „Ton“ ist die unmittelbar verständliche deutsche Entsprechung.
- source_word: נְחָשָׁא
  choice: die Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen; in der Abfolge der Werkstoffe des Standbilds ist „Bronze“ kontextuell angemessen.
- source_word: וַהֲווֹ כְּעוּר
  choice: Sie wurden wie Spreu
  rationale: Das Bild meint leichtes Dreschgut, das vom Wind fortgetragen wird; „Spreu“ erschließt den landwirtschaftlichen Zusammenhang präzise.
- source_word: אִדְּרֵי קַיִט
  choice: sommerliche Tennen
  rationale: Die Genitivverbindung bezeichnet Tennen in der trockenen Sommerzeit; „sommerliche Tennen“ gibt sie knapp und bildhaft wieder.
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: und der Wind trug sie fort
  rationale: Der Wind ist das Subjekt und entfernt die zermalmten Stoffe; „trug sie fort“ wahrt das Bild ohne Verstärkung.
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: sodass keine Spur mehr von ihnen zu finden war
  rationale: Wörtlich wird kein Ort für sie gefunden. Die idiomatische deutsche Wendung drückt ihr restloses Verschwinden aus, ohne den Sinn zu verändern.
- source_word: וּמְלָת כָּל אַרְעָא
  choice: und erfüllte die ganze Erde
  rationale: Das Verb bezeichnet das Ausfüllen; „die ganze Erde“ entspricht dem umfassenden Horizont der Vision.
theological_decisions:
- issue: Bedeutungsumfang von אַרְעָא
  choice: Erde
  alternative: Land
  rationale: Beides ist lexikalisch möglich. Der universale Horizont der Königreichsvision spricht hier für „Erde“, ohne die Symbolik weiter auszudeuten.
- issue: Konjunktion vor dem Stein
  choice: Der Stein aber
  alternative: Und der Stein
  rationale: Die aramäische Konjunktion ist formal additiv, doch der Gegensatz zwischen dem verschwundenen Standbild und dem wachsenden Stein wird im Deutschen natürlich mit „aber“ ausgedrückt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit. „Tennen“ bewahrt das konkrete Dreschbild; „keine Spur mehr“ gibt die aramäische Ortsformel idiomatisch wieder. Sämtliche Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
