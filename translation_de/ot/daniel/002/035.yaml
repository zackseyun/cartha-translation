  naturalness: Der Ton ist modern und würdig. „Sommerliche Tennen“ ist verständlich, aber „Tennen im Sommer“ ist im heutigen Deutsch natürlicher und transparenter. Die revidierte Fassung vermeidet außerdem die holprige Prädikativkonstruktion „wurden wie Spreu“.
  terminology: „Ton“, „Bronze“, „Standbild“, „Spreu“, „Tennen“, „Berg“ und „Erde“ sind kontextuell angemessen. Die Fußnote zu כַחֲדָה sollte keine nicht idiomatische deutsche Alternative wie „wie eines“ anbieten. Die Marker werden unmittelbar an den jeweils erläuterten Ausdruck gesetzt.
