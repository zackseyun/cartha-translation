  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Volk“ und die Begründungsstruktur des Hebräischen bleiben erhalten; schwerfällige Wiederholungen von „Klang“ werden im Haupttext maßvoll geglättet und in der Fußnote formnäher wiedergegeben.
