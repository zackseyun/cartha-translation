source:
  edition: WLC
  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: de
  text: Und das Volk konnte den Klang des Jubelgeschreis nicht vom Klang des Weinens des Volkes unterscheiden[a]; denn das Volk erhob ein gewaltiges Jubelgeschrei[b], und der Klang war bis in die Ferne zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „konnte den Klang des Freudenschreis nicht vom Klang des Weinens des Volkes unterscheiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie erhoben einen großen Schrei“; auch: „sie stießen einen gewaltigen Jubelruf aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: konnte … nicht … unterscheiden
  rationale: Der Hifil von נכר bezeichnet hier die Unfähigkeit, die beiden zugleich hörbaren Äußerungen auseinanderzuhalten.
- source_word: קוֹל
  choice: Klang
  rationale: קוֹל bezeichnet hier ein hörbares Phänomen; „Klang“ lässt sich natürlich sowohl auf den Jubel als auch auf das Weinen beziehungsweise auf den Gesamtklang beziehen.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: Klang des Jubelrufs
  rationale: תְּרוּעָה bezeichnet einen lauten Ruf; zusammen mit הַשִּׂמְחָה ist ein freudiger Jubelruf gemeint. „Klang des Jubelrufs“ bewahrt zudem den ausdrücklichen Bezug auf קוֹל.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: vom lauten Weinen des Volkes
  rationale: בְּכִי bezeichnet Weinen; „lautes Weinen“ gibt im Deutschen den hörbaren Charakter wieder, ohne das wiederholte קוֹל schwerfällig mit „Klang des Weinens“ abzubilden.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung dafür ein, weshalb die beiden Äußerungen nicht zu unterscheiden waren.
- source_word: מְרִיעִים
  choice: jubelte
  rationale: Der Hifil von רוע bezeichnet hier das Erheben eines lauten Jubelrufs. „jubelte“ ist natürliches modernes Deutsch und passt zum freudigen Kontext.
- source_word: תְּרוּעָה גְדוֹלָה
  choice: mit großem Jubel
  rationale: Die Formulierung erhält die figura etymologica mit מְרִיעִים teilweise und gibt גְדוֹלָה unmittelbar wieder; eine Fußnote nennt die formnähere Alternative.
- source_word: נִשְׁמַע
  choice: war … zu hören
  rationale: Diese idiomatische deutsche Passivwendung entspricht dem Nifal von שׁמע.
- source_word: עַד לְמֵרָחוֹק
  choice: bis in die Ferne
  rationale: Die Wendung beschreibt die große Entfernung, bis zu der der Klang reichte; „bis in die Ferne“ bildet עַד ausdrücklich ab.
theological_decisions: []
