  naturalness: Die revidierte Fassung ist flüssiges modernes Standarddeutsch. Die Zweckkonstruktion mit „um … zu bringen“ ist direkter und vermeidet die unnötige finite Vergangenheitsform „brachten“.
  terminology: „Steinmetzen“, „Handwerkern“, „Sidoniern“, „Tyrern“, „Zedernholz“, „Jafo“ und „Kyrus“ sind angemessen. „Genehmigung“ gibt רִשְׁיוֹן neutral und verständlich wieder.
