revisions:
- from: So gaben sie den Steinmetzen und den Handwerkern Geld[a] und den Sidoniern und den Tyrern Lebensmittel, Getränke und Öl, damit sie Zedernholz vom Libanon auf dem Seeweg nach Jafo brachten[b] – gemäß der Genehmigung, die ihnen der persische König Kyrus erteilt hatte.[c]
  to: Sie gaben den Steinmetzen und den Handwerkern Geld[a] und den Sidoniern und den Tyrern Lebensmittel, Getränke und Öl, um Zedernholz vom Libanon bis ans Meer bei Jafo zu bringen[b] – gemäß der ihnen von Kyrus, dem König von Persien, erteilten Genehmigung.[c]
  rationale: Die Ortsangabe wurde ohne die nicht im Ausgangstext genannte Festlegung auf einen Transport „auf dem Seeweg“ wiedergegeben. Die Zweckbeziehung des Infinitivs לְהָבִיא wird mit „um … zu bringen“ klar und idiomatisch ausgedrückt. Die Fußnotenanker wurden an die jeweils erläuterten Ausdrücke gesetzt und die Fußnote zur Genehmigung an die deutsche Satzstruktur angepasst.
  reviewer_model: gpt-5.6-terra
