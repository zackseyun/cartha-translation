  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: de
  text: Sie gaben den Steinmetzen und den Handwerkern Geld[a] und den Sidoniern und den Tyrern Lebensmittel, Getränke und Öl, um Zedernholz vom Libanon bis ans Meer bei Jafo zu bringen[b] – gemäß der ihnen von Kyrus, dem König von Persien, erteilten Genehmigung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Silber“. Das hebräische Wort kann sowohl das Edelmetall selbst als auch Geld in einem Zahlungsvorgang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Meer von Jafo“; möglicherweise ist der Hafen von Jafo gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gemäß der Bewilligung des Kyrus, des Königs von Persien, für sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: So gaben sie
  rationale: Das Wayyiqtol führt die Erzählung fort; „So“ gibt den folgernden und fortschreitenden Zusammenhang im Deutschen natürlich wieder.
- source_word: כֶסֶף
  choice: Geld
  rationale: כֶסֶף bezeichnet zwar Silber, dient im Zahlungskontext aber gewöhnlich als Ausdruck für Geld.
- source_word: לַחֹצְבִים
  choice: den Steinmetzen
  rationale: Das Partizip von חצב bezeichnet hier Arbeiter, die Steine brechen oder behauen; „Steinmetzen“ ist im Baukontext verständlich und prägnant.
- source_word: וְלֶחָרָשִׁים
  choice: und den Handwerkern
  rationale: חָרָשׁ bezeichnet einen fachkundigen Handwerker, ohne hier das bearbeitete Material näher festzulegen.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: Lebensmittel, Getränke und Öl
  rationale: Die drei Begriffe bezeichnen Versorgungsgüter. Der Plural „Getränke“ ist in einer deutschsprachigen Aufzählung natürlicher als das abstrakte „Trank“.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: den Sidoniern und den Tyrern
  rationale: Die Gentilizia bezeichnen die Menschen aus Sidon und Tyrus.
- source_word: לְהָבִיא
  choice: damit sie … brachten
  rationale: Der Infinitiv drückt den Zweck der Bezahlung und Versorgung aus. Die deutsche Konstruktion nennt dabei die Sidonier und Tyrer als naheliegendes Subjekt.
- source_word: עֲצֵי אֲרָזִים
  choice: Zedernholz
  rationale: Die Konstruktion bezeichnet für den Tempelbau bestimmtes Zedernholz, ohne die Form als Balken oder Stämme ausdrücklich festzulegen.
- source_word: מִן הַלְּבָנוֹן
  choice: vom Libanon
  rationale: Gibt die geografische Herkunft des Zedernholzes direkt wieder.
- source_word: אֶל יָם יָפוֹא
  choice: auf dem Seeweg nach Jafo
  rationale: Wörtlich steht „zum Meer von Jafo“. Im Zusammenhang des Holztransports bezeichnet die Wendung plausibel den Transport über das Meer nach Jafo; die Fußnote bewahrt die formnähere Alternative.
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: gemäß der Genehmigung, die ihnen der persische König Kyrus erteilt hatte
  rationale: רִשְׁיוֹן bezeichnet eine Genehmigung oder Bewilligung. Die Relativsatzkonstruktion gibt das idiomatische עֲלֵיהֶם in natürlichem Deutsch als auf sie bezogene königliche Erlaubnis wieder.
