translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert; historische Orts- und Personennamen erscheinen als Jafo, Tyrus und Kyrus. Die nicht ganz eindeutigen Wendungen für den Seeweg beziehungsweise Hafen und die königliche Genehmigung werden in Fußnoten transparent gehalten.
