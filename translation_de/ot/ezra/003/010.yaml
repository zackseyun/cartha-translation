source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: de
  text: Als die Bauleute das Fundament des Tempels Jahwes legten, stellten sie die Priester, in Gewänder gekleidet, mit Trompeten auf und die Leviten, die Söhne Asafs, mit Zimbeln, um Jahwe nach der Anordnung Davids, des Königs von Israel,[a] zu loben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Davids, des Königs von Israel“; gemeint ist wahrscheinlich eine von David ausgehende Anordnung oder Weisung.'
    reason: Die hebräische Wendung עַל־יְדֵי ist bildhaft und kann sowohl Vermittlung beziehungsweise Urheberschaft als auch eine entsprechende Anordnung ausdrücken.
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: Als die Bauleute das Fundament … legten
  rationale: יסד bezeichnet hier das Legen eines Gebäudefundaments; die substantivierte Partizipialform הבנים wird natürlich mit „die Bauleute“ wiedergegeben.
- source_word: הֵיכַל יְהוָה
  choice: Tempel Jahwes
  rationale: היכל bezeichnet im kultischen Zusammenhang den Tempel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיַּעֲמִידוּ
  choice: stellte man … auf
  rationale: Das Hifil von עמד bezeichnet hier das Aufstellen beziehungsweise Einnehmenlassen liturgischer Plätze. Das unpersönliche „man“ bewahrt, dass das nicht ausdrücklich genannte Subjekt im Deutschen nicht vorschnell mit den Bauleuten gleichgesetzt wird.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: die Priester in ihren Gewändern
  rationale: מלבשים bedeutet wörtlich „bekleidet“. „In ihren Gewändern“ ist im zeremoniellen Zusammenhang natürlich, ohne über den Text hinaus eine genauere Art der Kleidung festzulegen.
- source_word: בַּחֲצֹצְרוֹת
  choice: mit Trompeten
  rationale: חצצרות sind die im Kult verwendeten geraden Metalltrompeten; „Trompeten“ ist die geläufige deutsche Bezeichnung.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: und die Leviten, die Söhne Asafs
  rationale: Die Apposition wird bewahrt und bezeichnet die zu Asaf gehörende Abstammungs- beziehungsweise Sängergruppe.
- source_word: בַּמְצִלְתַּיִם
  choice: mit Zimbeln
  rationale: מצלתים bezeichnet paarweise geschlagene Kultinstrumente; „Zimbeln“ ist präziser als das mögliche, aber allgemeinere „Becken“.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: um Jahwe … zu loben
  rationale: Der Infinitiv mit ל drückt hier den Zweck der liturgischen Aufstellung aus.
- source_word: עַל יְדֵי דָּוִיד
  choice: nach der Anordnung Davids
  rationale: Die Wendung bedeutet wörtlich „durch die Hand Davids“, kann im Kontext aber eine von David ausgehende Anordnung oder Weisung bezeichnen. Die funktionale Wiedergabe ist im Deutschen klar; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Der Königstitel wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen als in der deutschen Bibelwissenschaft übliche Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עַל יְדֵי דָּוִיד
  choice: nach der Anordnung Davids
  alternative: durch die Hand Davids; gemäß Davids Weisung
  rationale: Der Kontext legt eine davidische Regelung der Tempelmusik nahe. Da die hebräische Wendung zugleich sprachlich die Vorstellung von Davids Hand beziehungsweise Vermittlung bewahrt, wird ihre wörtliche Gestalt in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, wird jedoch durch „Als“ und eine klare Zweckangabe natürlich gestaltet. „Man“ vermeidet eine nicht gesicherte Identifizierung des unausgesprochenen Subjekts von וַיַּעֲמִידוּ.
