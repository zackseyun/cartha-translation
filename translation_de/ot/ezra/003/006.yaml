base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: de
  text: Vom ersten Tag des siebten Monats an begannen sie, Jahwe Brandopfer darzubringen, und das Fundament des Tempels Jahwes war noch nicht gelegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch das Fundament des Tempels Jahwes war noch nicht gelegt«; auch konzessiv: »obwohl das Fundament … noch nicht gelegt war«. Die hebräische Konjunktion kann additiv, adversativ oder konzessiv verstanden werden. Sie begannen jedenfalls, Brandopfer darzubringen, bevor das Tempelfundament gelegt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Vom ersten Tag des siebten Monats an
  rationale: מִן bezeichnet hier den zeitlichen Ausgangspunkt. Die Wendung bewahrt diesen Sinn natürlicher als bloß »am ersten Tag«.
- source_word: הֵחֵלּוּ
  choice: begannen sie
  rationale: Die Hifil-Form bezeichnet den Beginn einer Handlung und wird in modernem Standarddeutsch klar und unmittelbar wiedergegeben.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: Brandopfer darzubringen
  rationale: Die hebräische Opferwendung bedeutet wörtlich, Brandopfer »aufsteigen zu lassen«; »darbringen« gibt den kultischen Sinn idiomatisch und würdig wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen übliche Form.
- source_word: הֵיכַל יְהוָה
  choice: Tempel Jahwes
  rationale: הֵיכָל kann Palast oder Heiligtum bezeichnen; im Zusammenhang des Wiederaufbaus ist »Tempel« eindeutig und natürlich.
- source_word: לֹא יֻסָּד
  choice: das Fundament … noch nicht gelegt war
  rationale: Das passive Verb יסד bezeichnet hier die Gründung beziehungsweise Fundamentlegung. Das im Hebräischen vorausgesetzte »Fundament« wird für idiomatisches Deutsch ausdrücklich genannt.
- source_word: וְ
  choice: obwohl
  rationale: 'Die Konjunktion wird im Zusammenhang konzessiv verstanden: Die Opfer wurden bereits vor der Fundamentlegung dargebracht. Ihre einfachere additive oder adversative Bedeutung bleibt in der Fußnote sichtbar.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar. Die Wiedergabe als »Jahwe« erhält seinen Charakter als Eigenname, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Verhältnis zwischen Opferbeginn und Tempelbau
  choice: obwohl
  alternative: und / doch
  rationale: Der Kontext legt einen konzessiven Gegensatz nahe, doch die breite Bedeutung der hebräischen Konjunktion wird nicht als eindeutig ausgegeben und deshalb in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Darbringen« bewahrt den kultischen Sprachgebrauch, ohne altertümlich zu wirken. Die Satzstellung folgt natürlichem Deutsch und erhält zugleich den zeitlichen Ausgangspunkt sowie die Spannung zwischen Opferdienst und noch ausstehender Fundamentlegung.
