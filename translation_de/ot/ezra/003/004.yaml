  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: de
  text: Sie feierten das Laubhüttenfest, wie es vorgeschrieben ist, und brachten Tag für Tag Brandopfer in der vorgeschriebenen Anzahl dar, wie es für jeden einzelnen Tag bestimmt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: Laubhüttenfest
  rationale: Die im Deutschen eingebürgerte und verständliche Bezeichnung für das biblische Fest; sie gibt den Bezug auf die Hütten wieder.
- source_word: כַּכָּתוּב
  choice: wie es vorgeschrieben ist
  rationale: Wörtlich „wie geschrieben“; im Kontext bezeichnet die Formulierung die schriftlich festgelegte Weisung. Die deutsche Wiedergabe macht diese Funktion natürlich deutlich.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: und brachten Tag für Tag Brandopfer … dar
  rationale: Das Verb „darbringen“ wird aus וַיַּעֲשׂוּ sinngemäß mitgeführt. „Tag für Tag“ bewahrt die distributive Zeitangabe, während der deutsche Plural den wiederkehrenden Opfern entspricht.
- source_word: בְּמִסְפָּר כְּמִשְׁפַּט
  choice: in der vorgeschriebenen Anzahl
  rationale: מִסְפָּר bezeichnet die festgelegte Anzahl, מִשְׁפָּט hier die maßgebliche Ordnung bzw. Vorschrift. Die kompakte Formulierung vermeidet im Deutschen eine schwerfällige Dopplung.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: wie es für jeden einzelnen Tag bestimmt war
  rationale: Die idiomatische Wiedergabe wahrt den Sinn, dass jeder Festtag sein eigenes vorgeschriebenes Opferpensum hatte.
theological_decisions:
- issue: Bezug der schriftlichen Vorschrift
  choice: „wie es vorgeschrieben ist“ ohne ausdrückliche Nennung eines bestimmten Gesetzestextes
  alternative: „wie geschrieben steht“ oder „wie es im Gesetz des Mose geschrieben steht“
  rationale: Der hebräische Text nennt an dieser Stelle weder Mose noch das Gesetz ausdrücklich. Die Übersetzung kennzeichnet die normative Schriftgrundlage, ohne zusätzliche Identifikation einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Laubhüttenfest“ und „Brandopfer“ bleiben erhalten; die stark repetitive hebräische Syntax wird klar und natürlich wiedergegeben.
