source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: de
  text: Im zweiten Monat des zweiten Jahres nach ihrer Ankunft am Haus Gottes in Jerusalem machten sich Serubbabel, der Sohn Schealtiëls, Jeschua, der Sohn Jozadaks, und die übrigen ihrer Brüder, die Priester und Leviten, sowie alle, die aus der Gefangenschaft[a] nach Jerusalem gekommen waren, daran. Sie setzten die Leviten von zwanzig Jahren an und darüber ein, um die Arbeiten am Haus Jahwes zu beaufsichtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Exil“.'
    reason: Lexikalische Alternative zu מֵהַשְּׁבִי; beide Wiedergaben bezeichnen die babylonische Gefangenschaft beziehungsweise das Exil.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: nach ihrer Ankunft
  rationale: Die Infinitivkonstruktion mit לְ und Suffix wird hier temporal gebraucht. „Nach ihrer Ankunft“ gibt dies in natürlichem Deutsch wieder.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die formnahe Wiedergabe bewahrt die Ausdrucksweise des Hebräischen; „Tempel“ wäre an dieser Stelle eine erklärende Präzisierung.
- source_word: הֵחֵלּוּ
  choice: nahmen … die Arbeit auf
  rationale: Das hebräische Verb „begannen“ lässt das Ergänzungsglied unausgesprochen. Die deutsche Formulierung macht den aus dem unmittelbaren Zusammenhang erschließbaren Sinn idiomatisch deutlich, ohne eine bestimmte Einzelarbeit festzulegen.
- source_word: וַיַּעֲמִידוּ
  choice: setzten … dazu ein
  rationale: Der Hifil von עמד bezeichnet hier das Einsetzen in eine verantwortliche Aufgabe.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: im Alter von zwanzig Jahren an aufwärts
  rationale: Die Altersgrenze wird nah am hebräischen Schwellenformular und zugleich verständlich wiedergegeben.
- source_word: לְנַצֵּחַ
  choice: zu beaufsichtigen
  rationale: Im Zusammenhang des Bauvorhabens bezeichnet das Verb leitende beziehungsweise aufsichtführende Verantwortung.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: die Arbeiten am Haus Jahwes
  rationale: מְלָאכָה bezeichnet hier die auszuführenden Arbeiten; „am Haus“ macht den baulichen Bezug im Deutschen natürlich deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: אֲחֵיהֶם
  choice: ihre … Brüder
  rationale: Die ausdrücklich maskuline Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des Hebräischen bleibt erhalten.
- source_word: מֵהַשְּׁבִי
  choice: aus der Gefangenschaft
  rationale: Die Formulierung bleibt nah am hebräischen Substantiv; die geläufige Alternative „aus dem Exil“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diesen Unterschied gegenüber dem Titel „Herr“.
- issue: Unausgesprochene Ergänzung zu הֵחֵלּוּ („sie begannen“)
  choice: nahmen … die Arbeit auf
  alternative: begannen
  rationale: Das Hebräische lässt offen, was genau begonnen wurde. Die deutsche Fassung ergänzt nur den allgemein aus dem Kontext hervorgehenden Arbeitsbeginn und legt keine spezielle Bauhandlung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange hebräische Satzperiode wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Personen- und Gottesnamen folgen geläufigen deutschen Transkriptionsformen; „Haus Gottes“ bleibt als formnahe Bezeichnung erhalten.
