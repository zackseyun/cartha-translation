  to: Im zweiten Monat des zweiten Jahres nach ihrer Ankunft am Haus Gottes in Jerusalem machten sich Serubbabel, der Sohn Schealtiëls, Jeschua, der Sohn Jozadaks, und die übrigen ihrer Brüder, die Priester und Leviten, sowie alle, die aus der Gefangenschaft[a] nach Jerusalem gekommen waren, daran. Sie setzten die Leviten von zwanzig Jahren an und darüber ein, um die Arbeiten am Haus Jahwes zu beaufsichtigen.
