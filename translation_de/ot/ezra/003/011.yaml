  naturalness: „Sie antworteten einander mit Lob und Dank für Jahwe“ ist im Deutschen sowohl semantisch als auch in der Rektion unglücklich. Die revidierte Fassung ist modernes, würdiges Standarddeutsch und bildet den liturgischen Charakter klar ab.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Beständige Liebe“ ist für חֶסֶד vertretbar und verständlich. „Lauter Jubelruf“ gibt die Verstärkung der figura etymologica natürlich wieder.
