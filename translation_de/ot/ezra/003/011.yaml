revisions:
- from: 'Und sie antworteten einander mit Lob und Dank für Jahwe: »Denn er ist gut, denn seine beständige Liebe zu Israel währt ewig.«[a] Und das ganze Volk brach in großen Jubel aus und lobte Jahwe, weil der Grund für das Haus Jahwes gelegt worden war.[b]'
  to: 'Und sie sangen im Wechsel, indem sie Jahwe lobten und ihm dankten: »Denn er ist gut, denn seine beständige Liebe zu Israel währt ewig.«[a] Und das ganze Volk stieß einen lauten Jubelruf aus, während sie Jahwe lobten, weil das Haus Jahwes gegründet worden war.[b]'
  rationale: Die Revision beseitigt die unzutreffende Gegenseitigkeit von „einander“, stellt die Beziehung von Lob und Dank zu Jahwe idiomatisch dar und bewahrt in der Schlussklausel den Wortlaut des hebräischen Passivs. Die kontextuelle Deutung als Grundlegung bleibt als erläuternde Fußnote erhalten.
