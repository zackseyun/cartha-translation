  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: de
  text: 'Und sie sangen im Wechsel, indem sie Jahwe lobten und ihm dankten: »Denn er ist gut, denn seine beständige Liebe zu Israel währt ewig.«[a] Und das ganze Volk stieß einen lauten Jubelruf aus, während sie Jahwe lobten, weil das Haus Jahwes gegründet worden war.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie antworteten«. Das hebräische Verb kann in diesem liturgischen Zusammenhang ein responsorisches oder wechselndes Einsetzen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »weil das Haus Jahwes gegründet worden war«. Im Zusammenhang ist die Grundlegung des Tempels gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: sie antworteten einander
  rationale: Das Verb ענה bedeutet grundsätzlich „antworten“; im liturgischen Zusammenhang ist wahrscheinlich ein wechselweises oder responsorisches Antworten gemeint. „Einander“ macht diesen Zusammenhang verständlich, ohne ausdrücklich Gesang in den Text einzutragen.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: mit Lob und Dank
  rationale: Die beiden Formen bezeichnen die begleitenden gottesdienstlichen Handlungen des Lobens und Dankens. Die substantivische deutsche Wendung ist natürlich und bewahrt beide Aspekte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי טוֹב
  choice: Denn er ist gut
  rationale: Die im Hebräischen knappe Bekenntnisformel wird durch das im Deutschen notwendige Pronomen und Verb idiomatisch wiedergegeben.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: denn seine beständige Liebe zu Israel währt ewig
  rationale: חסד bezeichnet hier verlässliche, bleibende Zuwendung; „beständige Liebe“ gibt diese Bedeutungsbreite in gegenwärtigem Deutsch wieder. עַל יִשְׂרָאֵל wird als Bezug beziehungsweise Ausrichtung „zu Israel“ verstanden.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: brach in großen Jubel aus
  rationale: Die hebräische figura etymologica verstärkt den lauten Jubelruf. Die deutsche Formulierung gibt dessen Intensität natürlich wieder, ohne eine schwerfällige Wortwiederholung.
- source_word: בְּהַלֵּל לַיהוָה
  choice: und lobte Jahwe
  rationale: Die Wendung charakterisiert den Jubel als Lob für Jahwe; die koordinierte Verbform ist im Deutschen klar und flüssig.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: weil der Grund für das Haus Jahwes gelegt worden war
  rationale: Der Hophal von יסד bezeichnet das Gegründetwerden. Im unmittelbaren Baukontext ist damit die Grundlegung des Tempels gemeint; „der Grund ... gelegt“ wahrt den Vorgang, ohne zu behaupten, das Gebäude sei bereits errichtet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. „Jahwe“ bewahrt ihn als Namen und folgt der vorgegebenen terminologischen Ausrichtung.
- issue: Bedeutung von חֶסֶד in der liturgischen Bekenntnisformel
  choice: beständige Liebe
  alternative: Gnade / Bundestreue
  rationale: „Beständige Liebe“ verbindet liebevolle Zuwendung mit Verlässlichkeit und Dauer, ohne den vielschichtigen Begriff ausschließlich auf Gnade oder eine technische Bundeskategorie festzulegen.
- issue: Bezug von עַל יִשְׂרָאֵל
  choice: seine beständige Liebe zu Israel währt ewig
  alternative: seine beständige Liebe währt ewig über Israel
  rationale: Die gewählte Stellung liest עַל als Angabe der Ausrichtung der Liebe. Die alternative Zuordnung zur Dauerformel bleibt sprachlich möglich und wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die liturgische Feierlichkeit bleibt erhalten; unnötig altertümliche Wendungen und konfessionell festgelegte Fachbegriffe werden vermieden. Die mögliche responsorische Ausführung und die syntaktische Mehrdeutigkeit bei עַל יִשְׂרָאֵל werden nicht dogmatisch vereindeutigt.
