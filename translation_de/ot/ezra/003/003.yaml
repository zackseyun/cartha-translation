  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: de
  text: Sie errichteten den Altar auf seinen Fundamenten[a], denn sie hatten Angst vor den Völkern der Länder[b]. Auf ihm brachten sie Jahwe Brandopfer dar, Brandopfer am Morgen und am Abend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf seinem Sockel“ oder „an seinem festen Platz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Furcht lag auf ihnen von den Völkern der Länder“; gemeint ist wahrscheinlich Furcht vor beziehungsweise wegen dieser Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: sie stellten … auf
  rationale: Der Hifil von כון bezeichnet hier das feste Aufstellen beziehungsweise Herrichten des Altars; „aufstellen“ ist im Deutschen natürlich und passt zu den Fundamenten.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Die übliche und sachlich genaue Wiedergabe von מִזְבֵּחַ im Opferkontext.
- source_word: עַל מְכֹנוֹתָיו
  choice: auf seinen Fundamenten
  rationale: מְכוֹנוֹת kann Fundamente, Sockel oder festen Standort bezeichnen. Die gewählte Fassung bewahrt das konkrete Bild und lässt die Alternativen in einer Fußnote erkennen.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: denn wegen der Völker der Länder lag Furcht auf ihnen
  rationale: Die Wiedergabe erhält sowohl die bildhafte hebräische Konstruktion „Furcht lag auf ihnen“ als auch die mögliche kausale Bedeutung von מִן. „Völker der Länder“ bewahrt den ungewöhnlichen Plural des Ausgangstextes.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: Darauf brachten sie … Brandopfer dar
  rationale: עלה im Hifil mit עֹלוֹת ist die feste Wendung für das Darbringen von Brandopfern. „Darauf“ nimmt idiomatisch den Altar als Ort des Opfers auf.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: Brandopfer am Morgen und am Abend
  rationale: Die Wiederholung von עֹלוֹת bleibt erhalten; die Zeitangaben werden in natürlichem Deutsch als die regelmäßigen morgendlichen und abendlichen Opfer ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt es als persönlichen Gottesnamen wieder, ohne es durch einen Titel zu ersetzen.
- issue: Bezug und Funktion der Furcht
  choice: wegen der Völker der Länder lag Furcht auf ihnen
  alternative: Schrecken vor den Völkern der Länder hatte sie erfasst
  rationale: Die gewählte Fassung löst die Furcht nicht theologisch als Motiv oder Schutzwirkung auf, sondern bewahrt die im Hebräischen ausgedrückte Furcht vor beziehungsweise aufgrund der umliegenden Bevölkerungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht fremdartige Formulierung „Völker der Länder“ und das Bild „Furcht lag auf ihnen“ bewahren bewusst Struktur und Mehrdeutigkeit des Hebräischen, bleiben aber verständlich.
