  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: de
  text: Da standen Jeschua, seine Söhne und seine Brüder, Kadmiël und seine Söhne, die Söhne Judas[a], sowie die Söhne Henadads, ihre Söhne und ihre Brüder, die Leviten, einmütig zusammen, um diejenigen zu beaufsichtigen, die die Arbeit im Haus Gottes verrichteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Söhne Judas“. Einige alte Übersetzungen und moderne Bibelübersetzungen lesen: „die Söhne Hodawjas“.'
    reason: Textvariante
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Da traten … zusammen
  rationale: עמד bedeutet wörtlich „stehen“ oder „sich hinstellen“. In Verbindung mit כְּאֶחָד bezeichnet es hier, dass die genannten Leviten gemeinsam ihre Aufsichtsfunktion übernahmen. „Da traten … zusammen“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Der Personenname wird nach seiner hebräischen Form wiedergegeben; „Jeschua“ ist die im Deutschen für diese Gestalt in Esra übliche Form.
- source_word: בָּנָיו וְאֶחָיו
  choice: seine Söhne und seine Brüder
  rationale: Die ausdrücklich männlichen Verwandtschaftsbezeichnungen des Hebräischen werden direkt und verständlich wiedergegeben.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: Kadmiël und seine Söhne
  rationale: Die zweite Familiengruppe steht parallel zu Jeschua und seinen Angehörigen. Die Trema-Schreibung „Kadmiël“ macht die getrennte Aussprache der Vokale deutlich.
- source_word: בְּנֵי יְהוּדָה
  choice: die Söhne Judas
  rationale: Der vorliegende masoretische Text liest eindeutig „Juda“. Die alternative Überlieferung „Hodawja“ wird wegen der Textunsicherheit in einer Fußnote genannt.
- source_word: כְּאֶחָד
  choice: geschlossen zusammen
  rationale: Die Wendung betont gemeinsames, einmütiges Handeln. „Geschlossen zusammen“ gibt diese Einheit in natürlichem modernem Deutsch wieder.
- source_word: לְנַצֵּחַ
  choice: zu beaufsichtigen
  rationale: Das Piel von נצח bezeichnet hier in der Konstruktion mit עַל die leitende Aufsicht über die Arbeitenden, nicht musikalische Leitung.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: diejenigen …, die … arbeiteten
  rationale: Das substantivierte Partizip ist grammatisch singularisch, hat aber kollektiven Sinn. Die deutsche Relativkonstruktion bewahrt den Tätigkeitsaspekt, ohne die Personengruppe näher zu bestimmen.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: am Haus Gottes
  rationale: Bei Bauarbeiten bezeichnet בְּ den Ort beziehungsweise Gegenstand der Tätigkeit. „Am Haus Gottes“ ist hier idiomatischer als „im Haus Gottes“ und bewahrt die Tempelbezeichnung „Haus Gottes“.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: Mit ihnen waren die Söhne Henadads, deren Söhne und Brüder, die Leviten
  rationale: Der abschließende Ausdruck nennt eine weitere beteiligte levitische Gruppe. Ein eigener kurzer Satz macht ihre Zugehörigkeit verständlich, ohne die appositionale Kennzeichnung „die Leviten“ aufzugeben.
theological_decisions:
- issue: Textkritische Unsicherheit bei בְּנֵי יְהוּדָה
  choice: Der masoretische Text wird als „die Söhne Judas“ übersetzt.
  alternative: „die Söhne Hodawjas“
  rationale: Die WLC-Vorlage bietet „Juda“ und hat als Ausgangstext Vorrang. Da alte Übersetzungen und einige moderne Übersetzungen eine abweichende Namensform bezeugen, wird diese Möglichkeit offengelegt und nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsstruktur und die männlichen Verwandtschaftsbezeichnungen des Hebräischen bleiben erhalten; zugleich wird der lange hebräische Satz zur besseren Verständlichkeit behutsam in zwei Sätze gegliedert.
