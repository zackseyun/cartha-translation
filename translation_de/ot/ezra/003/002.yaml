  source_fidelity: 'Die Übersetzung bildet die hebräische Aussage vollständig und in der richtigen Abfolge ab: Jeschua und die Priester, Serubbabel und seine Brüder sowie der Bau des Altars zum Darbringen von Brandopfern gemäß der schriftlichen Tora des Mose. „Machten sich … ans Werk“ ist eine vertretbare idiomatische Wiedergabe des handlungseröffnenden וַיָּקָם, ohne einen nicht belegten Wiederaufbau zu behaupten. Der Bezug von „darauf“ auf den Altar und von „des Mannes Gottes“ auf Mose ist klar und zutreffend.'
