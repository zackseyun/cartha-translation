id: EZR.3.2
reference: Ezra 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: de
  text: Da machten sich Jeschua, der Sohn Jozadaks, und seine Brüder, die Priester,[a] sowie Serubbabel, der Sohn Schealtiëls, und seine Brüder ans Werk. Sie bauten den Altar des Gottes Israels, um darauf Brandopfer darzubringen, wie es in der Weisung des Mose,[b] des Mannes Gottes, geschrieben steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „seine Brüder“; das hebräische Wort kann je nach Zusammenhang auch Verwandte oder Gefährten bezeichnen. Bei Jeschua kennzeichnet der Zusatz „die Priester“ seine Gruppe näher.
    reason: lexical_alternative
  - marker: b
    text: „Weisung“ gibt das hebräische Wort Tora wieder, das hier auch mit „Gesetz“ übersetzt werden kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machten sich … ans Werk
  rationale: Das Verb קום leitet hier entschlossenes gemeinsames Handeln ein. Die idiomatische deutsche Wendung gibt diese narrative Funktion wieder, ohne bloßes körperliches Aufstehen zu unterstellen.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Der nachexilische hebräische Personenname wird nach geläufiger deutscher Transliteration wiedergegeben.
- source_word: וְאֶחָיו
  choice: seine Brüder
  rationale: Die Grundbedeutung von אָח bleibt erhalten; im ersten Fall bestimmt die Apposition „die Priester“ die Gruppe näher. Der Ausdruck kann kontextuell auch Verwandte oder Gefährten bezeichnen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe der Apposition, die Jeschuas Gruppe näher bezeichnet.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: שְׁאַלְתִּיאֵל
  choice: Schealtiël
  rationale: Transliteration der hebräischen Namensform; die Trema-Schreibung verdeutlicht die getrennte Aussprache der Vokale.
- source_word: וַיִּבְנוּ
  choice: sie bauten
  rationale: בנה bedeutet schlicht „bauen“. Obwohl historisch ein Wiederaufbau denkbar ist, wird dieser Zusatz vom Verb selbst nicht ausgedrückt.
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: den Altar des Gottes Israels
  rationale: Formale und zugleich natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: um darauf Brandopfer darzubringen
  rationale: Die Hifil-Form von עלה mit עֹלוֹת ist eine kultische Wendung für das Darbringen von Brandopfern; „darauf“ bewahrt den ausdrücklichen Bezug auf den Altar.
- source_word: כַּכָּתוּב
  choice: wie es … geschrieben steht
  rationale: Natürliche deutsche Wiedergabe der Formel, die die Übereinstimmung mit einer schriftlichen Vorschrift ausdrückt.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: in der Weisung des Mose
  rationale: תּוֹרָה bezeichnet hier eine schriftliche, verbindliche Opferanweisung. „Weisung“ bewahrt die semantische Breite des Wortes, ohne seinen normativen Charakter aufzuheben.
theological_decisions:
- issue: Bedeutung des Verwandtschaftsbegriffs אחים bei repräsentativen Gruppen
  choice: seine Brüder
  alternative: seine Verwandten / seine Gefährten
  rationale: Die wörtliche männliche Verwandtschaftsbezeichnung wird bewahrt. Zugleich wird in einer Fußnote offengehalten, dass das hebräische Wort erweitert auch Verwandte oder Gefährten bezeichnen kann.
- issue: Wiedergabe von תּוֹרָה in einer kultisch-rechtlichen Bezugnahme
  choice: die Weisung des Mose
  alternative: das Gesetz des Mose / die Tora des Mose
  rationale: „Weisung“ gibt den weiteren Bedeutungsumfang von תּוֹרָה wieder und passt dennoch zur hier gemeinten schriftlichen Opferbestimmung. Die traditionell geläufige Alternative „Gesetz“ wird in der Fußnote genannt.
- issue: Bezug von אִישׁ הָאֱלֹהִים
  choice: Mose, des Mannes Gottes
  alternative: keine sachlich abweichende Lesart
  rationale: Die Apposition wird eindeutig auf Mose bezogen, wie es Syntax und Wortfolge nahelegen, ohne den Ehrentitel auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Machten sich … ans Werk“ bildet den handlungseröffnenden Charakter von קום idiomatisch ab. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge oder Zuordnung der hebräischen Aussage zu verändern.
