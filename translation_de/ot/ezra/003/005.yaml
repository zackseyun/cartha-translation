  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: de
  text: Danach brachten sie das regelmäßige Brandopfer[a] dar, dazu die Opfer an den Neumonden[b] und an allen geheiligten Festzeiten[c] Jahwes sowie die freiwilligen Opfer all derer, die Jahwe aus freien Stücken etwas darbrachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »das beständige Brandopfer« oder »das tägliche Brandopfer«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die heiligen Neumondtage am Beginn jedes Monats.
    reason: cultural_note
  - marker: c
    text: 'Auch: »festgesetzten Zeiten« oder »Festen« Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Gibt die zeitliche Fortsetzung knapp und idiomatisch wieder; das hebräische וְ verbindet den Satz mit dem vorhergehenden Geschehen.
- source_word: עֹלַת תָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; תָּמִיד hebt seine beständige, regelmäßig wiederkehrende Darbringung hervor, ohne im Haupttext enger als nötig auf „täglich“ festgelegt zu werden.
- source_word: וְלֶחֳדָשִׁים
  choice: die Opfer an den Neumonden
  rationale: חֹדֶשׁ bezeichnet hier die kultischen Neumondtage am Monatsanfang. „Die Opfer“ ist aus dem elliptischen Zusammenhang ergänzt.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: an allen Festzeiten Jahwes
  rationale: מוֹעֵד bezeichnet festgesetzte heilige Zeiten beziehungsweise Feste; „Festzeiten“ bewahrt beide Bedeutungsanteile.
- source_word: הַמְקֻדָּשִׁים
  choice: geheiligten
  rationale: Das passive Partizip beschreibt diese Festzeiten als für den heiligen Gebrauch ausgesondert.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: sowie die freiwilligen Opfer all derer, die … aus freien Stücken etwas darbrachten
  rationale: Die Formulierung bewahrt sowohl den freiwilligen Charakter der gebenden Personen als auch den kultischen Begriff נְדָבָה, vermeidet dabei aber eine unnatürliche deutsche Wortwiederholung.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den ausdrücklich im hebräischen Text stehenden Gottesnamen יְהוָה als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt den Charakter als persönlicher Bundesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Elliptisch fehlendes Verb und fehlende Opferbezeichnung
  choice: „brachten sie … dar“ und „die Opfer“ werden aus dem Kontext ergänzt
  alternative: Eine formal unvollständige Aufzählung ohne Ergänzungen
  rationale: Der hebräische Satz setzt die Opferhandlung aus dem unmittelbaren Zusammenhang voraus. Die Ergänzungen machen den Sinn im Deutschen verständlich, ohne eine neue inhaltliche Behauptung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Brandopfer“, „Neumond“ und „Festzeiten“ bleiben erkennbar; notwendige Ergänzungen aufgrund der hebräischen Ellipse sind natürlich in den Satz eingefügt. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
