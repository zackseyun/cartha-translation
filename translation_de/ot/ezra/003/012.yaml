revisions:
- from: Doch viele von den Priestern, den Leviten und den Oberhäuptern der Sippen[a] – die alten Männer, die das frühere Haus[b] gesehen hatten – weinten laut, als dieses Haus vor ihren Augen gegründet wurde[c]; viele andere dagegen erhoben ihre Stimme zu lautem Jubel.
  to: Doch viele von den Priestern, den Leviten und den Oberhäuptern der Sippen[a] – die alten Männer, die das erste Haus[b] gesehen hatten – weinten laut, als vor ihren Augen das Fundament dieses Hauses gelegt wurde[c], während viele mit Freudenjubel ihre Stimme erhoben.
  rationale: Die Revision rückt die grundlegende Bedeutung von יסד („das Fundament legen“) in den Haupttext, bewahrt „erste“ als unmittelbare Wiedergabe von הָרִאשׁוֹן und entfernt die nicht ausdrücklich im Hebräischen stehende Ergänzung „andere“. Die alternative, weiter gefasste Formulierung mit „gegründet“ bleibt als Fußnote erhalten.
