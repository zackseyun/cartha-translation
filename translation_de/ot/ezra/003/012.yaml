  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: de
  text: Doch viele von den Priestern, den Leviten und den Oberhäuptern der Sippen[a] – die alten Männer, die das erste Haus[b] gesehen hatten – weinten laut, als vor ihren Augen das Fundament dieses Hauses gelegt wurde[c], während viele mit Freudenjubel ihre Stimme erhoben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Oberhäupter der Väter“; gemeint sind Leiter von Abstammungsgruppen oder Sippen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „das erste Haus“; gemeint ist der frühere Tempel.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als dieses Haus vor ihren Augen gegründet wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Doch viele
  rationale: Das וְ verbindet mit dem Vorhergehenden, markiert hier aber zugleich den Gegensatz zum Jubel in Vers 11; „doch“ gibt diesen Zusammenhang natürlich wieder.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: von den Priestern, den Leviten und den Oberhäuptern der Sippen
  rationale: מִן ist partitiv („viele von“). רָאשֵׁי הָאָבוֹת bezeichnet die Leiter von Abstammungs- beziehungsweise Sippenverbänden; „Oberhäupter der Sippen“ ist verständlich und wahrt die soziale Struktur.
- source_word: הַזְּקֵנִים
  choice: die alten Männer
  rationale: Im Zusammenhang steht das Lebensalter im Vordergrund, da sie das frühere Haus noch gesehen hatten; „Älteste“ könnte fälschlich vor allem ein Amt bezeichnen.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: die das frühere Haus gesehen hatten
  rationale: הָרִאשׁוֹן kann hier kontextuell das frühere, zuerst bestehende Haus bezeichnen. „Haus“ bewahrt die hebräische Bezeichnung, deren Referent der frühere Tempel ist.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: als dieses Haus ... gegründet wurde
  rationale: Die Infinitivkonstruktion von יסד bezeichnet das Gründen beziehungsweise Legen des Fundaments. Die Formulierung wahrt die mögliche Beziehung auf das Haus als Ganzes; die präzisierende Alternative steht in der Fußnote.
- source_word: בְּעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Gängige und anschauliche deutsche Wiedergabe des hebräischen Idioms für unmittelbares Miterleben.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: weinten laut
  rationale: Das Partizip beschreibt die andauernde Handlung; „laut“ gibt בְּקוֹל גָּדוֹל in natürlichem modernem Deutsch wieder.
- source_word: וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: viele andere dagegen erhoben ihre Stimme zu lautem Jubel
  rationale: Die zweite Gruppe steht gleichzeitig im Kontrast zur ersten. תְּרוּעָה und שִׂמְחָה bezeichnen hier einen lauten Freudenruf; לְהָרִים קוֹל wird mit dem Bild des Erhebens der Stimme wiedergegeben.
