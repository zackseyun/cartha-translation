base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: de
  text: Als der siebte Monat kam und die Söhne Israels[a] in den Städten waren, kam das Volk wie ein Mann[b] nach Jerusalem zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräische Redewendung für gemeinsames, einmütiges Handeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: kam
  rationale: נגע bedeutet wörtlich „berühren/erreichen“; bei einer Zeitangabe bezeichnet es idiomatisch deren Eintreffen. „Der Monat kam“ ist im Deutschen natürlich und knapp.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: der siebte Monat
  rationale: Die formnahe Wiedergabe bewahrt die biblische Monatszählung, ohne einen späteren Monatsnamen einzusetzen.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wendung gibt die hebräische Form transparent wieder; die im Zusammenhang mögliche kollektive Bedeutung „die Israeliten“ wird in einer Fußnote genannt.
- source_word: בֶּעָרִים
  choice: in den Städten waren
  rationale: Die hebräische Ortsangabe steht prädikativ; das Deutsche benötigt hier die ergänzte Kopula „waren“. Ein Besitzpronomen ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: וַיֵּאָסְפוּ
  choice: versammelte sich
  rationale: Der Niphal von אסף bezeichnet hier das Zusammenkommen der Gemeinschaft. Der deutsche Singular richtet sich nach dem Kollektivsubstantiv „das Volk“.
- source_word: הָעָם
  choice: das Volk
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des Kollektivbegriffs העם.
- source_word: כְּאִישׁ אֶחָד
  choice: wie ein Mann
  rationale: Die wörtlich-nahe Wiedergabe erhält das markante hebräische Bild für geschlossenes, einmütiges Handeln.
- source_word: אֶל יְרוּשָׁלִָם
  choice: nach Jerusalem
  rationale: אֶל bezeichnet hier die Bewegung auf das Ziel Jerusalem zu; bei Städtenamen ist „nach“ idiomatisches Deutsch.
theological_decisions:
- issue: Geschlechtlich markierte kollektive Sprache in בְּנֵי יִשְׂרָאֵל und כְּאִישׁ אֶחָד
  choice: „Söhne Israels“ und „wie ein Mann“ im Haupttext beibehalten
  alternative: „Israeliten“ und „wie einer/einmütig“
  rationale: Die maskulinen hebräischen Formen werden transparent wiedergegeben, ohne ihre kollektive Funktion zu bestreiten. Fußnoten erläutern die idiomatische Bedeutung, statt die Bildsprache im Haupttext zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Ablauf, während „nach Jerusalem“ und die ergänzte Kopula „waren“ idiomatisches Deutsch gewährleisten.
