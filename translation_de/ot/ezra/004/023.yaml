source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: de
  text: Sobald die Abschrift des Briefes von König Artaxerxes Rehum und Schimschai, dem Schreiber, und ihren Amtsgenossen vorgelesen worden war, eilten sie nach Jerusalem zu den Juden[a] und zwangen sie mit Gewalt und Macht aufzuhören.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Juden“. Die aramäische Präposition kann hier eine feindliche Bewegung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und brachten sie mit Gewalt und Macht zum Aufhören“.'
    reason: translation_clarity
lexical_decisions:
- source_word: אֱדַיִן
  choice: Sobald
  rationale: Leitet den unmittelbar anschließenden Erzählvorgang ein; zusammen mit dem vorzeitigen Nebensatz gibt „Sobald“ den engen zeitlichen Zusammenhang natürlich wieder.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: die Abschrift des Briefes
  rationale: פַּרְשֶׁגֶן bezeichnet eine Abschrift beziehungsweise Wiedergabe, נִשְׁתְּוָנָא ein amtliches Schreiben.
- source_word: קֱרִי קֳדָם
  choice: vorgelesen worden war
  rationale: Die Form bezeichnet hier das Lesen in Gegenwart der Beamten; das deutsche „vorlesen“ gibt קֳדָם idiomatisch mit wieder.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Rehum, dem Schreiber Schimschai und ihren Amtsgenossen
  rationale: סָפְרָא wird als traditionell verständlicher Amtstitel „Schreiber“ wiedergegeben; כְנָוָתְהוֹן meint ihre Kollegen oder Amtsgenossen.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: eilten sie
  rationale: Die Verbindung aus Bewegungsverb und dem Ausdruck für Eile wird knapp und natürlich durch „eilen“ wiedergegeben.
- source_word: עַל יְהוּדָיֵא
  choice: zu den Juden
  rationale: עַל kann nach einem Bewegungsverb sowohl das Ziel als auch eine feindliche Bewegung bezeichnen; die Hauptübersetzung bleibt offen, während der Zusammenhang die Feindseligkeit erkennen lässt.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: zwangen sie …, die Arbeit einzustellen
  rationale: Die Kausativform bedeutet, dass sie die Juden zum Aufhören brachten. „Die Arbeit“ ist aus dem unmittelbaren Zusammenhang ergänzt und macht den deutschen Bezug klar.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: mit Gewalt und Macht
  rationale: Die Wendung bezeichnet gewaltsamen Zwang durch überlegene Macht; die beiden Begriffe bleiben in der Übersetzung unterscheidbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt erzählerisch flüssig; amtliche Titel und die gewaltsame Beendigung der Bauarbeit werden klar benannt. Die mögliche feindliche Bedeutung von עַל wird nicht stillschweigend festgelegt, sondern in einer Fußnote bewahrt.
