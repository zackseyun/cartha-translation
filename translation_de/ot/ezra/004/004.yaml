  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: de
  text: Da entmutigte die Bevölkerung des Landes das Volk von Juda immer wieder[a] und schreckte es immer wieder vom Bauen ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ die Hände des Volkes von Juda erschlaffen“; ein hebräisches Bild für Entmutigung und das Schwächen der Entschlossenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und jagte ihm Angst vor dem Bauen ein“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Da
  rationale: Die Form führt das nächste Geschehen der Erzählung ein. „Da“ gibt den Fortgang in natürlichem, knappem Deutsch wieder.
- source_word: עַם הָאָרֶץ
  choice: die Bevölkerung des Landes
  rationale: Die Wendung bezeichnet hier die ansässige Bevölkerung, die den Rückkehrern Widerstand leistete. Diese Wiedergabe ist verständlicher als das im Deutschen missverständliche „Volk des Landes“.
- source_word: מְרַפִּים יְדֵי
  choice: entmutigte … immer wieder
  rationale: Das hebräische Bild vom Erschlaffenlassen der Hände bedeutet, jemandem Kraft und Entschlossenheit zu nehmen. Die Partizipialform bezeichnet ein fortgesetztes Vorgehen, das durch „immer wieder“ ausgedrückt wird.
- source_word: עַם יְהוּדָה
  choice: das Volk von Juda
  rationale: Die Konstruktion bezeichnet die judäische Gemeinschaft, die am Wiederaufbau beteiligt war.
- source_word: וּמְבַלְהִים
  choice: und schreckte
  rationale: Das Verb bezeichnet das Versetzen in Schrecken oder Bestürzung; „schreckte … ab“ verbindet diesen Sinn natürlich mit dem folgenden Infinitiv.
- source_word: אוֹתָם
  choice: es
  rationale: Das Pronomen bezieht sich auf das im Deutschen singularische Kollektiv „Volk von Juda“ und wird deshalb mit „es“ wiedergegeben.
- source_word: לִבְנוֹת
  choice: vom Bauen ab
  rationale: Der Infinitiv bezeichnet die Tätigkeit, von der die Judäer durch Einschüchterung abgehalten werden sollten. Die deutsche Verbindung „vom Bauen abschrecken“ gibt diesen Zusammenhang idiomatisch wieder.
