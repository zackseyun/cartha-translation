  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche hebräische Redewendung wird im Haupttext sinngemäß wiedergegeben und in der Fußnote wörtlich erläutert; der fortgesetzte Charakter der Handlungen bleibt durch „immer wieder“ erhalten.
