  - severity: low
    issue: Der iterative Charakter von וּמְבַלְהִים wird im Haupttext nicht ausdrücklich markiert.
    rationale: „immer wieder“ steht nur bei „entmutigte“, während beide Partizipien ein anhaltendes Vorgehen schildern. Die Ergänzung bei der zweiten Handlung macht dies transparent, ohne den Sinn zu verändern.
