review_pass:
  verdict: revise
  source_fidelity: Die Begründungsstruktur und die Hofloyalitätsformel sind grundsätzlich zutreffend erfasst. „mitanzusehen“ fügt jedoch ein nicht ausdrücklich vorhandenes Moment des Miterlebens hinzu. Außerdem gibt „diese Nachricht gesandt“ die zwei aramäischen Verben „gesandt und mitgeteilt/in Kenntnis gesetzt“ nicht vollständig wieder.
  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. „Da wir“ ist als begründender Anschluss natürlicher und weniger umgangssprachlich-resignativ als „Weil wir nun einmal“. Die vorgeschlagene Schlussformulierung ist in einem amtlichen Briefregister idiomatisch.
  terminology: „Salz des Palastes“ bewahrt die bildhafte Loyalitäts- bzw. Versorgungsformel. „Schande des Königs“ ist für עַרְוַת מַלְכָּא angemessen und lässt die Nuance von Entehrung bzw. Bloßstellung offen.
  issues:
