revisions:
- from: Weil wir nun einmal das Salz des Palastes essen und es sich für uns nicht gehört, die Schande des Königs mitanzusehen, haben wir dem König diese Nachricht gesandt.
  to: Da wir das Salz des Palastes essen und es uns nicht zusteht, die Schande des Königs anzusehen, haben wir dem König Nachricht gesandt und ihn davon in Kenntnis gesetzt.
  rationale: Die Revision bewahrt die bildhafte Hofdienstformel und die offene Bedeutung von „Schande“, vermeidet die zusätzliche Nuance von „mitanzusehen“ und bildet beide abschließenden Verben ausdrücklich ab. Der begründende Anschluss bleibt ohne ein unnötig zeitliches oder umgangssprachliches „nun einmal“ erhalten.
