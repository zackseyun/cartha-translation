  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: de
  text: Da wir das Salz des Palastes essen und es uns nicht zusteht, die Schande des Königs anzusehen, haben wir dem König Nachricht gesandt und ihn davon in Kenntnis gesetzt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: nun einmal
  rationale: Das aramäische Adverb kann hier den Folgerungs- bzw. Begründungszusammenhang markieren; „nun einmal“ ergibt im Deutschen einen natürlichen Anschluss, ohne ein rein zeitliches „jetzt“ zu erzwingen.
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: wir das Salz des Palastes essen
  rationale: Die wörtliche Hofdienst- und Loyalitätsformel bleibt erhalten; „Palast“ passt im Kontext zum Königshof.
- source_word: עַרְוַת מַלְכָּא
  choice: die Schande des Königs
  rationale: עַרְוָה bezeichnet hier die Bloßstellung bzw. Entehrung des Königs; „Schande“ bewahrt die Bildkraft und die mögliche objektive wie reputative Bedeutung.
- source_word: לְמֶחֱזֵא
  choice: mitanzusehen
  rationale: Gibt das Sehen als tatenloses Miterleben idiomatisch wieder, ohne die Aussage zu einer bloßen Kenntnisnahme abzuschwächen.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא לְמַלְכָּא
  choice: haben wir dem König diese Nachricht gesandt
  rationale: Im Deutschen bündelt diese Formulierung das Senden und Bekanntmachen natürlich; „diese Nachricht“ erschließt das implizite Mitteilungsobjekt aus dem Briefkontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatische Loyalitätsformel bleibt bewusst bildhaft; der Satz klingt wie die Begründung innerhalb eines amtlichen Schreibens.
