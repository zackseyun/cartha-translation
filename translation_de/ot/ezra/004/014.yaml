    issue: „mitanzusehen“
    rationale: Das Präfix „mit-“ legt ein gemeinsames oder passives Miterleben nahe, das לְמֶחֱזֵא („sehen“) nicht ausdrücklich enthält.
  - severity: medium
    issue: Die abschließende Doppelhandlung ist zusammengezogen.
    rationale: שְׁלַחְנָא וְהוֹדַעְנָא bezeichnet sowohl das Senden als auch das Informieren. „Diese Nachricht gesandt“ macht das Informieren nur implizit und ergänzt zugleich das Demonstrativum „diese“.
  - severity: low
    issue: „nun einmal“ ist stärker pragmatisch gefärbt als der Ausgangstext.
    rationale: כְּעַן leitet hier die Begründung bzw. Folgerung ein; „Da“ gibt diese Funktion neutral und idiomatisch wieder.
