base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: de
  text: 'Dies ist die Abschrift des Briefes, den sie an König Artaxerxes sandten: »Deine Diener, die Männer aus dem Gebiet jenseits des Stromes[a], und nun[b] —«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jenseits des Stromes“. Gemeint ist die persische Provinz westlich des Euphrat, die auch „Trans-Euphrat“ genannt wird.'
    reason: Die geografisch-administrative Bedeutung der wörtlichen Wendung ist heutigen Lesern nicht ohne Weiteres erkennbar.
  - marker: b
    text: Eine formelhafte aramäische Briefwendung; traditionell auch mit „und zu solcher Zeit“ wiedergegeben oder im Sinn von „und so weiter“ verstanden. Der Brieftext wird im nächsten Vers fortgesetzt.
    reason: Die knappe Formel ist mehrdeutig und besitzt keine eindeutige, natürliche deutsche Entsprechung.
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן
  choice: Dies ist die Abschrift
  rationale: Die aramäische Einleitungsformel stellt den folgenden Wortlaut als Wiedergabe eines amtlichen Schreibens vor; „Abschrift“ bezeichnet eine schriftliche Kopie präzise und natürlich.
- source_word: אִגַּרְתָּא
  choice: des Briefes
  rationale: Gemeint ist ein amtliches Schreiben; „Brief“ ist im modernen Deutschen die geläufigste Entsprechung.
- source_word: דִּי שְׁלַחוּ
  choice: den sie … sandten
  rationale: Das Relativpronomen bezieht sich auf „Brief“; „sandten“ wahrt den würdigen erzählerischen Ton.
- source_word: עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: an König Artaxerxes
  rationale: Die Präpositionalfügung bezeichnet hier den Empfänger des Briefes. Titel und Name stehen nach natürlichem deutschem Sprachgebrauch zusammen.
- source_word: עַבְדָיךְ
  choice: Deine Diener
  rationale: Die wörtliche höfische Selbstbezeichnung wahrt das Unterordnungsverhältnis gegenüber dem König, ohne sie interpretierend als „Beamte“ festzulegen.
- source_word: אֱנָשׁ עֲבַר נַהֲרָה
  choice: die Männer aus dem Gebiet jenseits des Stromes
  rationale: „Männer“ gibt das kollektiv gebrauchte אֱנָשׁ wieder. Die Ergänzung „Gebiet“ macht verständlich, dass die Wendung eine persische Provinzbezeichnung meint; „aus“ gibt die Zugehörigkeit beziehungsweise Herkunft idiomatisch wieder.
- source_word: וּכְעֶנֶת
  choice: Und nun
  rationale: Die Wendung ist eine aramäische Briefformel. „Und nun“ erhält ihren formelhaften Übergangscharakter; ihre genaue Funktion wird in der Fußnote erläutert.
