  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die amtliche Briefform und die abrupte Fortsetzung in Vers 12 bleiben erkennbar; genuine Mehrdeutigkeit der Schlussformel wird nicht im Haupttext vereindeutigt.
