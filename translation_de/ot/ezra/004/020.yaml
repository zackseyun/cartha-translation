  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: de
  text: Und mächtige Könige herrschten über Jerusalem und übten ihre Herrschaft über das ganze Gebiet jenseits des Stromes aus[a]; Tribut, Steuer und Zoll wurden ihnen entrichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stromes“ war eine amtliche Bezeichnung für das persische Verwaltungsgebiet westlich des Euphrat.
    reason: cultural_note
  - marker: b
    text: 'Die drei aramäischen Begriffe bezeichnen verschiedene Arten staatlicher Einnahmen; möglich ist auch: „Abgaben, Steuern und Zölle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: mächtige Könige
  rationale: Die Verbindung bezeichnet Könige von großer Macht; die natürliche deutsche Wortfolge wahrt den politischen Sinn.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: herrschten über Jerusalem
  rationale: Das Verb des Seins und die Präposition עַל drücken hier im Zusammenhang königliche Autorität aus, nicht bloß Aufenthalt.
- source_word: שַׁלִּיטִין
  choice: übten ihre Herrschaft … aus
  rationale: Die partizipiale Form bezeichnet fortdauernde Herrschaftsausübung; die verbale deutsche Fassung ist klar und würdevoll.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: über das ganze Gebiet jenseits des Stromes
  rationale: Die Wendung ist eine persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat. „Gebiet“ macht diese Funktion verständlich, während „jenseits des Stromes“ die historische Perspektive bewahrt.
- source_word: מִדָּה בְלוֹ וַהֲלָךְ
  choice: Abgaben, Steuern und Zölle
  rationale: Die drei Begriffe bezeichnen unterschiedliche Arten staatlicher Einnahmen. Die deutsche Dreierformel erhält diese Unterscheidung, ohne eine unsichere technische Präzisierung zu erzwingen.
- source_word: מִתְיְהֵב לְהוֹן
  choice: wurden ihnen entrichtet
  rationale: Die Passivform bezeichnet die Abführung der genannten Leistungen; „entrichtet“ ist im Steuerzusammenhang idiomatisch.
