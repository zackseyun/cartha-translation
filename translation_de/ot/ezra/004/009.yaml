base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: de
  text: 'Damals: Rehum, der Befehlshaber[a], Schimschai, der Schreiber, und die übrigen ihrer Genossen – die Dinäer[b], die Apharsatkäer[c], die Tarpeläer, die Perser, die Leute aus Erech, die Babylonier und die Leute aus Susa, das heißt die Elamiter –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Kanzler“ beziehungsweise „der hohe Beamte“. Die genaue Funktion der aramäischen Amtsbezeichnung ist nicht sicher.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Richter“. Die aramäische Form kann als Gruppenname oder als Amtsbezeichnung verstanden werden; im Zusammenhang der Herkunftsgruppen steht hier die Umschrift im Haupttext.'
    reason: alternative_reading
  - marker: c
    text: Die Bedeutung dieser aramäischen Bezeichnung ist unsicher. Sie wird meist als Name einer Volks- oder Herkunftsgruppe aufgefasst; möglicherweise bezeichnet sie jedoch Beamte.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: אֱדַיִן
  choice: Damals
  rationale: Das aramäische Zeit- und Folgeadverb leitet den nächsten Abschnitt ein. „Damals“ ist im Deutschen natürlich und lässt offen, ob vor allem zeitliche Einordnung oder erzählerische Abfolge gemeint ist.
- source_word: רְחוּם
  choice: Rehum
  rationale: Personenname, in geläufiger deutscher Umschrift wiedergegeben.
- source_word: בְּעֵל טְעֵם
  choice: der Befehlshaber
  rationale: Die umstrittene Amtsbezeichnung kennzeichnet Rehum als ranghohen Verantwortungsträger. „Befehlshaber“ ist verständlich, ohne die historisch nicht sicher bestimmbare Funktion zu eng festzulegen; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: שִׁמְשַׁי
  choice: Schimschai
  rationale: Personenname, nach deutscher Laut- und Schreibkonvention umschrieben.
- source_word: סָפְרָא
  choice: der Schreiber
  rationale: Das Wort bezeichnet einen Schreiber beziehungsweise Verwaltungssekretär. „Schreiber“ ist unmittelbar quellentreu und im biblischen Verwaltungskontext verständlich.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: ihre übrigen Amtsgenossen
  rationale: Gemeint sind die weiteren Angehörigen oder Kollegen derselben amtlichen Gruppe. „Amtsgenossen“ bringt sowohl die Zusammengehörigkeit als auch den Verwaltungskontext zum Ausdruck.
- source_word: דִּינָיֵא
  choice: die Dinäer
  rationale: Innerhalb der Reihe von Herkunfts- und Volksbezeichnungen ist die Wiedergabe als Gruppenname syntaktisch und kontextuell naheliegend. Da die Form auch als „Richter“ verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote genannt.
- source_word: אֲפַרְסַתְכָיֵא
  choice: die Apharsatkäer
  rationale: Die genaue Bedeutung und Identität der Bezeichnung ist unsicher. Eine behutsame Umschrift vermeidet, eine nicht gesicherte Deutung als Amtsbezeichnung in den Haupttext einzutragen.
- source_word: טַרְפְּלָיֵא
  choice: die Tarpeläer
  rationale: Wahrscheinlich eine Gruppen- oder Herkunftsbezeichnung unbekannter genauer Identität; daher Umschrift.
- source_word: אֲפָרְסָיֵא
  choice: die Perser
  rationale: Klare Volksbezeichnung für Perser.
- source_word: ארכוי
  choice: die Leute aus Erech
  rationale: Die Form bezeichnet Menschen aus Erech (Uruk). Die aufgelöste Wiedergabe ist im Deutschen klarer als ein ungebräuchliches Ethnikon.
- source_word: בָבְלָיֵא
  choice: die Babylonier
  rationale: Klare Herkunfts- beziehungsweise Volksbezeichnung.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: die Leute aus Susa, das heißt die Elamiter
  rationale: Die aramäische Apposition setzt die Leute aus Susa mit den Elamitern in Beziehung. „Das heißt“ gibt die erläuternde Funktion natürlich wieder, ohne über die genaue politische oder ethnische Zuordnung hinauszugehen.
