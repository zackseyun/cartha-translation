base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: de
  text: 'Nun sei dem König mitgeteilt: Wenn diese Stadt wieder aufgebaut und ihre Mauern vollendet werden, wird man weder Abgaben noch Steuern noch Zoll entrichten; schließlich wird dies den Königen Schaden zufügen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und schließlich wird es den Einnahmen der Könige schaden.“ Die aramäische Formulierung ist knapp; die Deutung des Schadens als Einnahmeausfall ergibt sich aus dem Zusammenhang mit den nicht entrichteten Abgaben, Steuern und Zöllen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Nun
  rationale: Das aramäische Gesprächs- und Übergangswort leitet in diesem amtlichen Schreiben die Warnung ein; „Nun“ bewahrt diese Funktion ohne eine streng folgernde Bedeutung festzulegen.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: sei dem König mitgeteilt
  rationale: Die förmliche aramäische Mitteilungsformel wird in einem natürlichen, würdigen deutschen Verwaltungsstil wiedergegeben.
- source_word: דִּי הֵן
  choice: Wenn
  rationale: Die Verbindung führt den Inhalt der Mitteilung als Bedingungssatz ein; nach dem Doppelpunkt genügt im Deutschen „Wenn“.
- source_word: קִרְיְתָא דָךְ תִּתְבְּנֵא
  choice: diese Stadt wieder aufgebaut wird
  rationale: Das Demonstrativum wird mit „diese“ wiedergegeben; im Baukontext bezeichnet das Verb die Wiedererrichtung der Stadt.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: und ihre Mauern vollendet werden
  rationale: „Ihre“ verdeutlicht den Bezug zur Stadt, während „vollendet“ den Gedanken des Fertigstellens sachlich wiedergibt.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: Abgaben noch Steuern noch Zoll
  rationale: Die drei Begriffe bezeichnen unterschiedliche persische Fiskalleistungen. Die deutsche Dreierreihe wahrt ihre Unterscheidung, ohne eine unsichere verwaltungstechnische Präzision vorzutäuschen.
- source_word: לָא יִנְתְּנוּן
  choice: wird man weder … entrichten
  rationale: Das wörtliche „geben“ bedeutet im fiskalischen Zusammenhang „entrichten“; das unpersönliche „man“ entspricht dem nicht ausdrücklich genannten pluralischen Subjekt.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: am Ende wird dies den Einnahmen der Könige schaden
  rationale: Die Wiedergabe folgt dem fiskalischen Zusammenhang, lässt aber wegen der knappen und schwierigen aramäischen Formulierung in einer Fußnote die allgemeinere Deutung als Verlust für die Könige erkennen.
