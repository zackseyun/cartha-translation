base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: de
  text: Daraufhin erließ ich einen Befehl. Man forschte nach und stellte fest, dass sich diese Stadt seit alters gegen Könige erhoben hat[a] und dass in ihr Rebellion und Aufruhr verübt worden sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich gegenüber Königen selbst überhöht hat«. Das aramäische Verb kann eine Selbstüberhebung bezeichnen; hier meint es ein Sich-Erheben gegen die königliche Herrschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dass in ihr Rebellion und Aufstand verübt worden sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Daraufhin erließ ich einen Befehl
  rationale: Die aramäische Verwaltungsformel bedeutet wörtlich etwa »von mir wurde ein Befehl erlassen«. Die aktive deutsche Form klingt natürlich und erhält den König als Urheber.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: Man forschte nach und stellte fest
  rationale: Die unbestimmte Wiedergabe passt zu einer amtlichen Nachforschung in den Archiven; »stellte fest« bezeichnet deren Ergebnis idiomatisch.
- source_word: קִרְיְתָא דָךְ
  choice: diese Stadt
  rationale: Der Ausdruck verweist auf die im Schreiben behandelte Stadt.
- source_word: מִן יוֹמָת עָלְמָא
  choice: seit alters
  rationale: Die knappe, würdevolle Wendung gibt die Bedeutung »seit längst vergangenen Tagen« wieder.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: sich gegen Könige erhoben hat
  rationale: Die reflexive Form kann Selbstüberhebung oder ein feindliches Sich-Erheben bezeichnen. Im politischen Zusammenhang wahrt diese Formulierung beide Aspekte, ohne sie mit dem folgenden »Aufruhr« gleichzusetzen.
- source_word: וּמְרַד
  choice: Aufruhr
  rationale: Bezeichnet offenen Widerstand beziehungsweise Rebellion gegen die königliche Herrschaft.
- source_word: וְאֶשְׁתַּדּוּר
  choice: Empörung
  rationale: Ein weiterer politischer Begriff aus dem Bedeutungsfeld von Aufstand und Widersetzlichkeit; die Wortwahl hält ihn vom vorangehenden Begriff unterscheidbar.
- source_word: מִתְעֲבֶד בַּהּ
  choice: in ihr ... angezettelt worden sind
  rationale: Die passive Form bezeichnet Handlungen, die in der Stadt betrieben oder ausgeführt wurden. »Angezettelt« passt zum politischen Kontext und ist natürliches Deutsch.
