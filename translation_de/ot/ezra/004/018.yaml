  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: de
  text: Das Schreiben, das ihr uns geschickt habt, wurde in meiner Gegenwart deutlich vorgelesen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Brief, den ihr uns geschickt habt, wurde in meiner Gegenwart deutlich vorgelesen.“'
    reason: „Brief“ ist als engere lexikalische Alternative zu נִשְׁתְּוָנָא möglich; die Alternative bewahrt die Aussage von קָדָמָי und die natürliche deutsche Formulierung.
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: das Schreiben
  rationale: Der reichsaramäische Ausdruck bezeichnet eine amtliche schriftliche Mitteilung. „Schreiben“ klingt im Deutschen natürlich und wahrt den Verwaltungscharakter, ohne die Form zu eng als Brief festzulegen.
- source_word: דִּי
  choice: das
  rationale: Das Relativpronomen leitet den Nebensatz ein, der „Schreiben“ näher bestimmt.
- source_word: שְׁלַחְתּוּן
  choice: ihr geschickt habt
  rationale: Die aramäische Perfektform der zweiten Person maskulin Plural bezeichnet eine abgeschlossene Handlung; das deutsche Perfekt passt natürlich zur Antwort auf das zuvor eingegangene Schreiben.
- source_word: עֲלֶינָא
  choice: uns
  rationale: 'Im brieflich-administrativen Zusammenhang bezeichnet die Präposition am ehesten die Empfänger: Das Schreiben wurde an den Königshof gesandt.'
- source_word: מְפָרַשׁ
  choice: deutlich
  rationale: Das Wort bezeichnet eine klare beziehungsweise verständliche Darbietung. „Deutlich“ bewahrt diese Aussage, ohne ausdrücklich eine Übersetzung oder Auslegung anzunehmen.
- source_word: קֱרִי
  choice: wurde … vorgelesen
  rationale: Im Zusammenhang eines königlichen Antwortschreibens ist öffentliches beziehungsweise hörbares Vorlesen gemeint. Das Passiv entspricht der aramäischen Aussage.
- source_word: קָדָמָי
  choice: in meiner Gegenwart
  rationale: Die höfische Wendung bezeichnet eine Handlung vor dem König, also in seiner Gegenwart.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sachlich-administrativem Ton. „Schreiben“ ist allgemein verständlich und zugleich für eine königliche Korrespondenz angemessen; „in meiner Gegenwart“ gibt die höfische Formel natürlich wieder.
