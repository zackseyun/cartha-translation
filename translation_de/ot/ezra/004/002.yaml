  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: de
  text: 'Da traten sie an Serubbabel und die Oberhäupter der Sippen heran und sagten zu ihnen: „Wir wollen mit euch bauen, denn ebenso wie ihr suchen wir euren Gott[a] und bringen ihm seit den Tagen Asar-Haddons, des Königs von Assyrien, Opfer dar[b], der uns hierher gebracht hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wir verehren euren Gott“ beziehungsweise „wir befragen euren Gott“. Das hebräische Verb für „suchen“ kann hier einen religiösen Sinn haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Konsonantentext lautet wörtlich: „und nicht wir bringen Opfer dar“. Das masoretische Qere und der Zusammenhang lesen jedoch „und ihm bringen wir Opfer dar“.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Da traten sie … heran
  rationale: Die Erzählform bezeichnet die Annäherung an Serubbabel und die führenden Männer; „herantreten“ ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Sippen
  rationale: Die hebräische Wendung bezeichnet die Leiter verwandtschaftlich geordneter Großfamilien beziehungsweise Vaterhäuser. „Oberhäupter der Sippen“ gibt die soziale Struktur verständlich wieder.
- source_word: נִבְנֶה עִמָּכֶם
  choice: Wir wollen mit euch bauen
  rationale: Der Imperfekt der ersten Person Plural hat hier auffordernden beziehungsweise vorschlagenden Sinn. Die Formulierung klingt im modernen Deutschen natürlicher als „Lasst uns mit euch bauen“.
- source_word: כִּי כָכֶם
  choice: denn … ebenso wie ihr
  rationale: Die Vergleichsformel begründet das Angebot zur Zusammenarbeit und wird im Deutschen sinnvoll mit dem folgenden Verb verbunden.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: wir suchen euren Gott
  rationale: דרשׁ mit ל kann im religiösen Zusammenhang „suchen“, „befragen“ oder „verehren“ bedeuten. „Suchen“ bewahrt die Bildlichkeit und Bedeutungsbreite des Hebräischen.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: und bringen ihm … Opfer dar
  rationale: Der geschriebene Konsonantentext enthält לֹא („nicht“), während Zusammenhang und traditionelle Lesung לֹו („ihm“) einen bejahenden Sinn nahelegen. Der Haupttext gibt den kontextuell wahrscheinlichen Sinn wieder; die Schwierigkeit wird in einer Fußnote offengelegt.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: seit den Tagen Asar-Haddons
  rationale: מִן mit „Tagen“ bezeichnet den Ausgangspunkt eines bis zur Gegenwart reichenden Zeitraums; „seit den Tagen“ ist idiomatisches Deutsch.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: Er hat uns hierhergebracht
  rationale: Das Partizip bezeichnet den assyrischen König als denjenigen, der die Sprecher dort ansiedelte. „Hierhergebracht“ gibt Kausativ und Zielrichtung natürlich wieder, ohne ein im Deutschen missverständliches räumliches „hinauf“ zu erzwingen.
theological_decisions:
- issue: Religiöse Selbstdarstellung der Ansiedler
  choice: Ihre Behauptung wird neutral als „wir suchen euren Gott“ und „bringen ihm … Opfer dar“ wiedergegeben.
  alternative: „Wir verehren euren Gott“ beziehungsweise eine Formulierung, die ihre Behauptung ausdrücklich als wahr oder als unaufrichtig bewertet.
  rationale: Der Vers berichtet die Aussage der Gruppe, ohne an dieser Stelle ihre Aufrichtigkeit oder Rechtgläubigkeit abschließend zu beurteilen. Die Spannung zum weiteren Erzählzusammenhang bleibt bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt natürlich; altertümliche Wendungen werden vermieden. Die textliche Schwierigkeit und die Mehrdeutigkeit des religiösen Verbs werden nicht stillschweigend eingeebnet, sondern in Fußnoten kenntlich gemacht.
