revisions:
- from: 'Da traten sie an Serubbabel und die Oberhäupter der Sippen heran und sagten zu ihnen: „Wir wollen mit euch bauen, denn wir suchen euren Gott ebenso wie ihr[a] und bringen ihm seit den Tagen Asar-Haddons, des Königs von Assyrien, Opfer dar[b]. Er hat uns hierhergebracht.“'
  to: 'Da traten sie an Serubbabel und die Oberhäupter der Sippen heran und sagten zu ihnen: „Wir wollen mit euch bauen, denn ebenso wie ihr suchen wir euren Gott[a] und bringen ihm seit den Tagen Asar-Haddons, des Königs von Assyrien, Opfer dar[b], der uns hierher gebracht hat.“'
  rationale: Die Revision schließt die Aussage über das Herbringen der Sprecher als Relativsatz an Asar-Haddon an und korrigiert die Schreibung von „hierher gebracht“. Die Stellung von „ebenso wie ihr“ wurde zur klareren deutschen Satzführung angepasst. Die Fußnote zur schwierigen Form wurde mit der präzisen Bezeichnung des masoretischen Qere ergänzt; der Haupttext und die Fußnoten bewahren weiterhin die textkritische und lexikalische Offenheit.
