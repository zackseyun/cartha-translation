source:
  edition: WLC
  text: וּ/בְ/מַלְכוּת֙ אֲחַשְׁוֵר֔וֹשׁ בִּ/תְחִלַּ֖ת מַלְכוּת֑/וֹ כָּתְב֣וּ שִׂטְנָ֔ה עַל יֹשְׁבֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: de
  text: Und unter der Herrschaft des Ahasveros, zu Beginn seiner Herrschaft, schrieben sie eine Anklage[a] gegen die Bewohner Judas und Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine Beschwerde“ beziehungsweise „eine feindselige Anklage“. Das hebräische Wort bezeichnet Widerstand, der in Form einer schriftlichen Beschuldigung vorgebracht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: Und unter der Herrschaft
  rationale: Die Verbindung aus Konjunktion, Präposition und מַלְכוּת setzt den zeitlichen Rahmen. „Unter der Herrschaft“ ist im Deutschen natürlich und bewahrt den Bezug auf die Regierungszeit des Königs.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Der hebräische Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben, ohne ihn durch die historische Gleichsetzung „Xerxes“ zu ersetzen.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: zu Beginn seiner Herrschaft
  rationale: Die Konstruktverbindung bezeichnet die Anfangszeit seiner Regierung. Die Wiederholung von „Herrschaft“ entspricht der Wiederholung von מַלְכוּת im Hebräischen.
- source_word: כָּתְבוּ
  choice: schrieben sie
  rationale: Das Verb bedeutet schlicht „schreiben“. Das im Hebräischen nicht näher bezeichnete Subjekt der dritten Person Plural bleibt auch im Deutschen unbestimmt.
- source_word: שִׂטְנָה
  choice: eine Anklage
  rationale: Das Substantiv bezeichnet hier eine schriftlich vorgebrachte, feindselige Beschuldigung. „Anklage“ wahrt den sachlich-rechtlichen Klang, ohne die genaue Gattung des Schreibens festzulegen.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang mit der Anklage bezeichnet die Präposition deren Ziel beziehungsweise die davon betroffenen Personen.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: die Bewohner Judas und Jerusalems
  rationale: Das substantivierte Partizip bezeichnet die dort Wohnenden. Die Genitivform ist im Deutschen knapp und eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die bewusste Wiederholung von „Herrschaft“ und das unbestimmte „sie“ bewahren Merkmale des Ausgangstextes.
