    rationale: Das Partizip steht im Kontext dessen, was die Gegner hörten, und beschreibt den Tempelbau als im Gang befindlich. Eine explizite deutsche Verlaufsform ist hier ohne Bedeutungszuwachs möglich.
  - severity: medium
    issue: Die Fußnote ergänzt „mit ihnen verbundenen Nachkommen“.
    rationale: בְנֵי הַגּוֹלָה ist eine etablierte Gruppenbezeichnung; der Ausdruck verpflichtet jedoch nicht zu einer ausdrücklichen Aussage über Nachkommen. Diese Ergänzung sollte vermieden werden, um die historische Referenz nicht enger zu bestimmen als der Text.
  revised_text: Die Gegner Judas und Benjamins hörten, dass die Exilgemeinschaft dabei war, einen Tempel für Jahwe, den Gott Israels, zu bauen.
