source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: de
  text: Die Gegner Judas und Benjamins hörten, dass die Exilgemeinschaft dabei war, einen Tempel für Jahwe, den Gott Israels, zu bauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: hörten
  rationale: Das Narrativpräteritum gibt ein schlichtes vergangenes Ereignis wieder; „hörten“ übersetzt שׁמע direkt, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Zeitmarker hinzuzufügen.
- source_word: צָרֵי
  choice: die Gegner
  rationale: Der Konstruktplural bezeichnet feindlich gesinnte Gegenspieler. „Gegner“ bewahrt diesen Sinn, ohne militärische Feindschaft überzubestimmen.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Judas und Benjamins
  rationale: Im Deutschen stehen die Namen nach „Gegner“ idiomatisch im Genitiv; Juda erhält dabei die Genitivform „Judas“.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Gegner hörten, nicht eine Begründung.
- source_word: בְנֵי הַגּוֹלָה
  choice: die Gemeinschaft der Weggeführten
  rationale: Die hebräische Wendung bezeichnet die Gemeinschaft derjenigen, die von der Wegführung geprägt beziehungsweise ihr zugehörig waren. Die Wiedergabe ist im modernen Deutsch verständlich; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
- source_word: בּוֹנִים
  choice: baute
  rationale: Das Partizip bezeichnet eine im Gang befindliche Bautätigkeit. Wegen des kollektiven Singulars „Gemeinschaft“ steht das Verb im Singular; „baute“ ist im deutschen Nebensatz natürlich und bezeichnet hier den fortschreitenden Vorgang, ohne ausdrücklich „wiederaufbauen“ hinzuzufügen.
- source_word: הֵיכָל
  choice: einen Tempel
  rationale: Obwohl הֵיכָל auch einen Palast bezeichnen kann, macht die Bestimmung für Jahwe, den Gott Israels, hier die Bedeutung „Tempel“ eindeutig.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier den Empfänger beziehungsweise die Widmung des Tempelbaus. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Apposition identifiziert Jahwe als Israels Gott; der Akkusativ folgt der deutschen Appositionskongruenz nach „für Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität von בְנֵי הַגּוֹלָה
  choice: Gemeinschaft der Weggeführten
  alternative: aus der Verbannung Zurückgekehrte
  rationale: Die gewählte Formulierung bewahrt die gemeinschaftliche Identität der hebräischen Wendung, ohne das im Ausdruck selbst nicht ausdrücklich enthaltene „zurückgekehrt“ in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der klaren Erzählstruktur des Hebräischen, ohne ein einleitendes „Nun“ zu ergänzen. Die weniger natürliche wörtliche Wendung „Söhne der Wegführung“ wird zugunsten einer verständlichen Haupttextform in die Fußnote verlegt.
