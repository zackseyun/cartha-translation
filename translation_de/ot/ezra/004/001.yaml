  source_fidelity: Der Satz gibt Subjekt, Inhaltsklausel, Tempel und die Gottesbezeichnung zutreffend wieder. Das hebräische Partizip בּוֹנִים bezeichnet jedoch eine laufende Tätigkeit; „baute“ kann dies im Deutschen zwar kontextuell tragen, macht es aber nicht erkennbar. Die Fußnote sollte außerdem nicht ausdrücklich von „Nachkommen“ sprechen, da dies über die idiomatische Gemeinschaftsbezeichnung hinausgeht.
  naturalness: „Exilgemeinschaft“ ist modernes, natürliches Standarddeutsch und bezeichnet die im Kontext gemeinte Gemeinschaft knapp. „Dabei war, ... zu bauen“ gibt den andauernden Vorgang idiomatisch wieder.
  terminology: „Gegner“, „Juda und Benjamin“, „Tempel“, „Jahwe“ und „der Gott Israels“ sind sachgerecht. Die Fußnote bewahrt die wörtliche hebräische Formulierung, ohne deren genaue soziale Reichweite unnötig festzulegen.
