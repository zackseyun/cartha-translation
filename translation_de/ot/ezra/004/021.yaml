  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: de
  text: 'Nun erlasst einen Befehl: Sie sollen diese Männer ihre Tätigkeit einstellen lassen[a]. Diese Stadt darf nicht wieder aufgebaut werden, bis von mir ein Befehl ergeht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »diese Männer zum Aufhören bringen«; das Verb bezeichnet, sie zum Einstellen zu veranlassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bis ich einen Befehl erlasse«. Wörtlich etwa: »bis von mir eine Anordnung festgesetzt wird«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Nun
  rationale: Leitet den unmittelbar geltenden königlichen Auftrag ein und gibt die Dringlichkeit natürlich wieder.
- source_word: שִׂימוּ טְּעֵם
  choice: erlasst einen Befehl
  rationale: Die aramäische Verwaltungswendung bedeutet wörtlich etwa »setzt eine Anordnung fest«; »einen Befehl erlassen« entspricht dem königlich-administrativen Zusammenhang.
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  choice: diese Männer zur Einstellung der Arbeit zu zwingen
  rationale: Das Verb bezeichnet das Aufhörenlassen bzw. Stilllegen. Die Ergänzung »der Arbeit« verdeutlicht im Deutschen den kontextuell gemeinten Baustopp, ohne die Männer selbst als Gegenstand einer Aufhebung erscheinen zu lassen.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: Diese Stadt darf nicht wieder aufgebaut werden
  rationale: Bewahrt das Passiv und gibt die administrative Untersagung in natürlichem, bestimmtem Deutsch wieder.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: bis von mir ein Befehl ergeht
  rationale: Erhält die unpersönlich-passive Struktur und macht deutlich, dass die künftige Anordnung vom König ausgehen muss.
