id: EZR.4.24
reference: Ezra 4:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: de
  text: Da kam die Arbeit am Haus Gottes in Jerusalem zum Stillstand[a], und sie blieb eingestellt[b] bis zum zweiten Regierungsjahr des Darius, des Königs von Persien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde die Arbeit am Haus Gottes in Jerusalem eingestellt“. Das aramäische Verb kann das Aufhören der Arbeit oder ihr Eingestelltwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und sie war stillgelegt“. Die Formulierung bezeichnet einen fortdauernden Zustand, nicht nur eine Wiederholung des zuvor genannten Stillstands.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Das aramäische Erzähladverb bezeichnet die zeitliche Folge zum vorhergehenden Geschehen; „Da“ ist im Deutschen natürlich und stellt den narrativen Anschluss her.
- source_word: בְּטֵלַת
  choice: kam … zum Stillstand
  rationale: Die Wurzel בטל bedeutet „aufhören, zum Stillstand kommen, eingestellt werden“. Die Form lässt offen, ob der Vorgang aktiv oder passiv akzentuiert wird; die deutsche Wendung wahrt diese Offenheit.
- source_word: עֲבִידַת
  choice: die Arbeit
  rationale: Das Konstruktstatus-Substantiv bezeichnet Arbeit bzw. Tätigkeit; der Kontext bestimmt sie als Arbeit am Tempel, ohne dass „Bau“ ausdrücklich ergänzt werden muss.
- source_word: בֵּית אֱלָהָא
  choice: am Haus Gottes
  rationale: „Haus Gottes“ gibt die aramäische Wendung formal transparent wieder; „Tempel“ wäre eine zutreffende, aber stärker deutende Wiedergabe.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: in Jerusalem
  rationale: Die Lageangabe ist im Deutschen unmittelbar an „Haus Gottes“ angeschlossen; ein ausdrückliches Relativpronomen ist nicht erforderlich.
- source_word: וַהֲוָת בָּטְלָא
  choice: und sie blieb eingestellt
  rationale: Die Verbindung aus „sein“ und der Form von בטל bezeichnet einen andauernden Zustand nach dem anfänglichen Stillstand. „Blieb eingestellt“ hebt diese Dauer hervor.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: bis zum zweiten … Jahr
  rationale: Dies ist die idiomatische deutsche Wiedergabe der aramäischen Jahresangabe.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: bis zum zweiten Regierungsjahr des Darius
  rationale: Die Präposition mit „Königtum/Herrschaft“ dient der Datierung nach Regierungsjahren; das deutsche Kompositum ist knapp und eindeutig.
- source_word: מֶלֶךְ פָּרָס
  choice: des Königs von Persien
  rationale: Die appositionelle Herrscherbezeichnung folgt dem Sinn und bewahrt die formelle Würde des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Gottes“ bewahrt die Bildsprache des aramäischen Textes; die beiden unterschiedlichen Formulierungen „kam … zum Stillstand“ und „blieb eingestellt“ unterscheiden Eintritt und Fortdauer des Zustands.
