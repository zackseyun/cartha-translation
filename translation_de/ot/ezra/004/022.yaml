  text: וּ/זְהִירִ֥ין הֱו֛וֹ שָׁל֖וּ לְ/מֶעְבַּ֣ד עַל דְּנָ֑ה לְ/מָה֙ יִשְׂגֵּ֣א חֲבָלָ֔/א לְ/הַנְזָקַ֖ת מַלְכִֽין־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: de
  text: Und seht zu, dass ihr dies nicht nachlässig ausführt.[a] Warum sollte der Schaden zum Nachteil der Könige zunehmen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und seid gewarnt, bei der Ausführung dieser Sache nicht nachlässig zu sein.«'
    reason: lexical_alternative
  - marker: b
    text: Der Plural »Könige« entspricht dem aramäischen Text und kann allgemein die königlichen Interessen oder das Königshaus bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: hütet euch davor
  rationale: Die aramäische Verbindung aus Adjektiv und Hilfsverb hat auffordernden Warncharakter. Die deutsche Formulierung gibt Wachsamkeit und Warnung natürlich wieder.
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: dies nachlässig auszuführen
  rationale: שָׁלוּ bezeichnet Nachlässigkeit oder Säumnis; לְמֶעְבַּד und עַל דְּנָה beziehen sich auf die Ausführung der zuvor erteilten Anordnung.
- source_word: לְמָה יִשְׂגֵּא
  choice: Warum sollte … zunehmen?
  rationale: Die Formulierung bewahrt die rhetorische Frage und gibt das Verb mit seiner Bedeutung »größer werden, zunehmen« wieder.
- source_word: חֲבָלָא
  choice: der Schaden
  rationale: Das Wort bezeichnet Schaden oder Unheil und passt zum amtlich-politischen Zusammenhang.
- source_word: לְהַנְזָקַת
  choice: zum Nachteil
  rationale: Die Wendung bezeichnet die schädliche Folge beziehungsweise Beeinträchtigung und wird in natürlichem Verwaltungsdeutsch wiedergegeben.
- source_word: מַלְכִין
  choice: der Könige
  rationale: Der im Aramäischen ausdrücklich stehende Plural bleibt erhalten und wird nicht zum Singular geglättet.
