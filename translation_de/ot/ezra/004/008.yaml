base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: de
  text: 'Rehum, der hohe Beamte,[a] und Schimschai, der Schreiber, verfassten an König Artaxerxes ein Schreiben gegen Jerusalem. Es lautete wie folgt:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Kanzler“ oder „der Befehlshaber“. Die genaue Bedeutung dieser aramäischen Amtsbezeichnung im persischen Verwaltungswesen ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: der hohe Beamte
  rationale: Die aramäische Amtsbezeichnung verbindet wörtlich Vorstellungen von Vollmacht und Befehl beziehungsweise Ratschluss. Da ihr genaues persisches Verwaltungsäquivalent unsicher ist, gibt „hoher Beamter“ die amtliche Autorität wieder, ohne ein bestimmtes Amt zu behaupten.
- source_word: סָפְרָא
  choice: der Schreiber
  rationale: Der Ausdruck bezeichnet einen Schreib- oder Sekretärsbeamten. „Schreiber“ bewahrt den lexikalischen Bezug und ist im biblisch-historischen Zusammenhang verständlich.
- source_word: כְּתַבוּ
  choice: verfassten
  rationale: Im Zusammenhang mit einem amtlichen Schreiben ist „verfassten“ natürlich und gibt den einfachen Vorgang des Schreibens wieder.
- source_word: אִגְּרָה חֲדָה
  choice: ein Schreiben
  rationale: חֲדָה kann „eins“ bedeuten, dient hier aber wahrscheinlich der Einführung eines unbestimmten einzelnen Schreibens. Das deutsche „ein Schreiben“ gibt beides natürlich wieder, ohne die Zahl unnötig zu betonen.
- source_word: עַל יְרוּשְׁלֶם
  choice: gegen Jerusalem
  rationale: Der Zusammenhang ist anklagend und feindselig; „gegen“ gibt diese kontextuelle Bedeutung besser wieder als das neutrale „über“.
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: an König Artaxerxes
  rationale: Diese Wortstellung entspricht natürlichem modernem Deutsch und bewahrt Titel und Namen.
- source_word: כְּנֵמָא
  choice: 'Es lautete wie folgt:'
  rationale: Die Wendung leitet den im nächsten Vers folgenden Wortlaut des Schreibens ein; die deutsche Formulierung macht diese Textfunktion deutlich.
- source_word: רְחוּם
  choice: Rehum
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שִׁמְשַׁי
  choice: Schimschai
  rationale: Der Personenname wird nach deutscher Laut- und Schreibkonvention transliteriert.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artaxerxes
  rationale: Der Königsname wird in seiner etablierten deutschen Form wiedergegeben.
