  text: מְהוֹדְעִ֤ין אֲנַ֨חְנָה֙ לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן לָ/קֳבֵ֣ל דְּנָ֔ה חֲלָק֙ בַּ/עֲבַ֣ר נַהֲרָ֔/א לָ֥א אִיתַ֖י לָֽ/ךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: de
  text: 'Wir teilen dem König mit: Wenn diese Stadt wieder aufgebaut und ihre Mauern vollendet werden, wirst du deshalb keinen Anteil[a] im Gebiet jenseits des Stromes[b] haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Anteil“ kann hier auch einen politischen Anspruch oder, im Verwaltungskontext, Einnahmen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: „Jenseits des Stromes“ war die persische Bezeichnung für das Verwaltungsgebiet westlich des Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: Wir teilen dem König mit
  rationale: Die aramäische partizipiale Briefformel wird in natürlichem, zugleich amtlichem Deutsch wiedergegeben.
- source_word: דִּי הֵן
  choice: Wenn
  rationale: Die Partikelfolge leitet innerhalb der Mitteilung eine reale Bedingung ein; der Doppelpunkt macht die Inhaltseinleitung im Deutschen deutlich.
- source_word: קִרְיְתָא דָךְ
  choice: diese Stadt
  rationale: Gibt das deiktische Demonstrativum unmittelbar wieder.
- source_word: תִּתְבְּנֵא
  choice: wieder aufgebaut
  rationale: Der passive Imperfekt bezeichnet im Kontext die mögliche Wiederherstellung der Stadt.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: und ihre Mauern vollendet werden
  rationale: „Ihre“ verdeutlicht den Bezug auf die Stadt; das Verb bezeichnet das Fertigstellen der Befestigungen.
- source_word: לָקֳבֵל דְּנָה
  choice: deshalb
  rationale: Die knappe deutsche Folgerung gibt den kausalen Rückbezug auf den genannten Wiederaufbau wieder.
- source_word: חֲלָק
  choice: Anteil
  rationale: „Anteil“ bewahrt die breite Bedeutung von Teil, Anspruch oder Beteiligung, ohne sie vorschnell auf Besitz oder Steuereinnahmen festzulegen.
- source_word: בַּעֲבַר נַהֲרָא
  choice: am Gebiet jenseits des Stromes
  rationale: Die Wendung bezeichnet das persische Verwaltungsgebiet westlich des Euphrat; „Gebiet“ macht den politischen Bezug verständlich, ohne „Provinz“ in den Haupttext einzutragen.
- source_word: לָא אִיתַי לָךְ
  choice: wirst du … keinen … haben
  rationale: Die aramäische Existenzkonstruktion mit Dativ wird als idiomatische deutsche Besitz- beziehungsweise Anspruchsaussage formuliert.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Brief- und Verwaltungsstil. Die Aussage bleibt bewusst bei dem mehrdeutigen „Anteil“ und legt nicht eindeutig fest, ob Herrschaftsanspruch, Besitz oder Einkünfte gemeint sind.
