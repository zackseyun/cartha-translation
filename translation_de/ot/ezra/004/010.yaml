base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: de
  text: und die übrigen Völker, die der große und erhabene Osnappar[a] deportiert und in der Stadt Samaria sowie die übrigen Völker im Gebiet Jenseits des Stromes[b] angesiedelt hat. Und nun:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Osnappar wird häufig mit dem assyrischen König Assurbanipal gleichgesetzt; hier bleibt jedoch die im aramäischen Text überlieferte Namensform stehen.
    reason: cross_reference
  - marker: b
    text: „Jenseits des Stromes“ war eine persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
  - marker: c
    text: Der letzte Ausdruck ist eine aramäische Briefformel. Möglich sind auch die Wiedergaben „und so weiter“ oder „zu dieser Zeit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: die übrigen Völker
  rationale: Die Wendung bezeichnet die noch verbleibenden Volksgruppen in der fortlaufenden Aufzählung. „Die übrigen Völker“ ist natürlich und bewahrt den kollektiven ethnischen Sinn.
- source_word: הַגְלִי
  choice: deportiert
  rationale: Das Verb bezeichnet die zwangsweise Wegführung ins Exil. „Deportiert“ gibt den historischen Vorgang imperialer Umsiedlung knapp und deutlich wieder.
- source_word: אָסְנַפַּר
  choice: Osnappar
  rationale: Der im aramäischen Text überlieferte Name wird transliteriert und nicht durch die häufig angenommene historische Identifizierung mit Assurbanipal ersetzt.
- source_word: רַבָּא וְיַקִּירָא
  choice: der große und erhabene
  rationale: Das Adjektivpaar sind ehrende Herrschertitel. „Erhaben“ gibt יַקִּירָא in diesem höfischen Zusammenhang als hoch angesehen bzw. von besonderer Würde wieder.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: und … angesiedelt hat
  rationale: Die Kausativform bezeichnet die gezielte Ansiedlung der Deportierten. Im Deutschen verbindet „deportiert und … angesiedelt“ beide Verwaltungsakte klar.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: in der Stadt Samaria
  rationale: Der masoretische Text hat das Singularwort „Stadt“. Diese Form wird ohne die kontextuelle Glättung zu „Städte Samarias“ bewahrt.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: sowie im übrigen Gebiet jenseits des Stromes
  rationale: „Jenseits des Stromes“ bezeichnet aus persischer Sicht das Gebiet westlich des Euphrat. „Im übrigen Gebiet“ lässt שְׁאָר auf die verbleibende Region bezogen natürlich deutsch erscheinen, ohne einen im Satz nicht ausgedrückten neuen Personenkreis einzuführen.
- source_word: וּכְעֶנֶת
  choice: 'Und nun:'
  rationale: Die aramäische Briefformel leitet zum eigentlichen Inhalt des Schreibens über. Der Doppelpunkt macht diese Übergangsfunktion im Deutschen sichtbar.
