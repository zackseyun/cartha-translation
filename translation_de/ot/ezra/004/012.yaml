base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: de
  text: 'Dem König sei bekannt: Die Juden[a], die von dir zu uns heraufgekommen sind, sind nach Jerusalem gekommen. Sie bauen die rebellische und böse Stadt wieder auf, vollenden die Mauern und setzen die Fundamente instand.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Der aramäische Ausdruck kann sowohl die Menschen aus Juda beziehungsweise Judäa als auch die Juden im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „legen“ beziehungsweise „setzen die Fundamente“. Die aramäische Wendung ist nicht eindeutig und kann sich auf die Ausbesserung vorhandener Fundamente oder auf deren Anlegung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Dem König sei bekannt
  rationale: Bewahrt die formelle aramäische Briefformel und gibt den Empfänger im Deutschen idiomatisch im Dativ an.
- source_word: יְהוּדָיֵא
  choice: die Juden
  rationale: Die Bezeichnung kann ethnisch-religiös „Juden“ oder regional „Judäer“ meinen. „Juden“ ist im Deutschen die geläufige Wiedergabe; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: die von dir zu uns heraufgezogen sind
  rationale: סלק bezeichnet eine Aufwärtsbewegung; „heraufgezogen“ wahrt sowohl dieses Bild als auch die Perspektive der Absender.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: sind nach Jerusalem gekommen
  rationale: Die zweite Bewegungsangabe benennt das konkrete Ziel. Das Perfekt entspricht natürlichem modernem Deutsch und betont die gegenwärtige Relevanz.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: die rebellische und böse Stadt
  rationale: Die beiden abwertenden Adjektive gehören zur anklagenden Sprache des Briefes. „Rebellisch“ wahrt den politischen Vorwurf, „böse“ die starke negative Wertung.
- source_word: בָּנַיִן
  choice: Sie bauen … wieder auf
  rationale: Das Verb bedeutet „bauen“; da die bereits bestehende, zerstörte Stadt wiederhergestellt wird, bringt „wieder aufbauen“ den Kontext natürlich zum Ausdruck.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: vollenden die Mauern
  rationale: Die Wendung bezeichnet das Fertigstellen beziehungsweise Vervollständigen der Stadtmauern.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: setzen die Fundamente instand
  rationale: Die schwierige Wendung bezeichnet Arbeiten an den baulichen Grundlagen. „Instand setzen“ passt zum Wiederaufbau, ohne die lexikalische Unsicherheit zu verschweigen.
theological_decisions: []
