source:
  edition: WLC
  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: de
  text: 'Der König sandte eine Antwort an Rehum, den Amtsvorsteher[a], an Schimschai, den Schreiber, an ihre übrigen Amtsgenossen, die in Samaria wohnen, und an die Übrigen jenseits des Stromes[b]: »Frieden[c]! Und nun –«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Kanzler« beziehungsweise »den leitenden Beamten«. Die genaue Amtsbezeichnung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: »Jenseits des Stromes« war die persische Bezeichnung für das Verwaltungsgebiet westlich des Euphrat.
    reason: cultural_note
  - marker: c
    text: 'Oder als brieflicher Gruß: »Gruß!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: eine Antwort
  rationale: Das Wort bezeichnet hier eine amtliche schriftliche Mitteilung. Da der König auf das zuvor eingegangene Schreiben reagiert, gibt »Antwort« den Zusammenhang treffend wieder, ohne den Text als förmlichen Erlass zu überbestimmen.
- source_word: בְּעֵל טְעֵם
  choice: Amtsvorsteher
  rationale: Der Titel bedeutet wörtlich etwa »Herr des Rates/Urteilsvermögens«, seine genaue persische Amtsfunktion ist jedoch unsicher. »Amtsvorsteher« wahrt die leitende Verwaltungsfunktion, ohne eine präzise institutionelle Zuordnung vorzutäuschen.
- source_word: סָפְרָא
  choice: Schreiber
  rationale: Dies ist die übliche Bezeichnung für einen schriftkundigen Verwaltungsbeamten und im biblischen Sprachgebrauch verständlich.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: ihre übrigen Amtsgenossen
  rationale: Der Ausdruck bezeichnet die mit den genannten Beamten verbundenen Personen. »Amtsgenossen« passt zum Verwaltungskontext und bleibt hinsichtlich ihrer genauen Stellung offen.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: die in Samaria wohnen
  rationale: Die Partizipialform bezeichnet ihren Wohn- oder Ansiedlungsort; »wohnen« ist natürlich und präzise.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: und an die Übrigen jenseits des Stromes
  rationale: Der Ausgangstext nennt keine ausdrückliche »Provinz«. Die Formulierung bewahrt daher den Wortlaut und lässt eine Fußnote den persischen Verwaltungsbezug erklären.
- source_word: שְׁלָם
  choice: Frieden
  rationale: Das Wort dient als brieflicher Gruß, dessen wörtlicher Gehalt »Frieden« lautet. Die Übersetzung bewahrt diesen Gehalt; idiomatisch ist auch »Gruß« möglich.
- source_word: וּכְעֶת
  choice: Und nun –
  rationale: Die Formel leitet den Hauptteil des königlichen Schreibens ein. Der Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Briefsituation bleibt erkennbar, ohne altertümliche Kanzleisprache. Die getrennte Nennung der in Samaria Wohnenden und der Übrigen jenseits des Euphrat folgt der aramäischen Satzstruktur; die genaue Bedeutung des Amtstitels wird nicht überpräzisiert.
