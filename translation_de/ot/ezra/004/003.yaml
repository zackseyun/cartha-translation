source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: de
  text: 'Doch Serubbabel, Jeschua und die übrigen Oberhäupter der Sippen Israels sagten zu ihnen: »Ihr habt keinen Anteil daran, mit uns unserem Gott ein Haus[a] zu bauen; denn wir allein[b] werden es für Jahwe, den Gott Israels, bauen, wie König Kyrus, der König von Persien, uns befohlen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus« ist hier der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »wir gemeinsam werden bauen«; im Zusammenhang bezeichnet »gemeinsam« offenbar die israelitische Gruppe selbst, ohne die angebotenen Partner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagten
  rationale: Das hebräische Verb steht grammatisch im Singular, obwohl mehrere Personen als Subjekt folgen; im natürlichen Deutschen richtet sich das Verb nach dem mehrteiligen Subjekt und steht daher im Plural.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Serubbabel, Jeschua
  rationale: Die Namen werden nach geläufigen deutschen Transkriptionskonventionen wiedergegeben; »Jeschua« entspricht der hier verwendeten hebräischen Namensform.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: und die übrigen Oberhäupter der Sippen Israels
  rationale: Die Wendung bezeichnet die führenden Männer der väterlich organisierten Großfamilien beziehungsweise Sippen. »Oberhäupter der Sippen« wahrt die soziale Struktur und bleibt im modernen Deutschen verständlich.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Ihr habt keinen Anteil mit uns daran
  rationale: Die knappe hebräische Wendung verneint ein gemeinsames Recht oder eine gemeinsame Beteiligung. Die deutsche Formulierung gibt diese ausschließende Kraft idiomatisch wieder.
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: unserem Gott ein Haus zu bauen
  rationale: »Haus« gibt בַּיִת formal wieder; aus dem Zusammenhang ist der Tempel gemeint, was in einer Fußnote erläutert wird.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: vielmehr werden wir allein es … bauen
  rationale: יַחַד bedeutet wörtlich »gemeinsam/zusammen«. Im Kontrast zu den abgewiesenen Partnern bezeichnet es hier die israelitische Führungsgruppe, die ohne sie bauen wird. »allein« bringt diese kontextuelle Aussage zum Ausdruck, während die wörtliche Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext ausdrücklich stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Direkte und im Deutschen geläufige Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: wie … uns befohlen hat
  rationale: Die Formulierung bewahrt sowohl den Vergleichs- beziehungsweise Entsprechungssinn von כַּאֲשֶׁר als auch die amtliche Verbindlichkeit des Befehls.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: König Kyrus, der König von Persien
  rationale: Die appositionelle Wiederholung des Königstitels wird entsprechend dem Hebräischen beibehalten und klingt im Deutschen feierlich, aber verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet den Gottesnamen ausdrücklich. »Jahwe« macht diesen Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Ausschluss der angebotenen Mitwirkung am Tempelbau
  choice: Ihr habt keinen Anteil mit uns daran … vielmehr werden wir allein … bauen
  alternative: Es ist nicht an euch und uns, … denn wir werden gemeinsam bauen
  rationale: Die erste Klausel weist eine gemeinsame Beteiligung eindeutig zurück. Zugleich wird die lexikalische Grundbedeutung von יַחַד nicht verschwiegen, sondern wegen ihrer kontextabhängigen Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt bestimmt und ausschließend, ohne sie sprachlich zu verschärfen. »Oberhäupter der Sippen« vermittelt die alte Familien- und Führungsstruktur verständlicher als das sehr wörtliche »Häupter der Väterhäuser«.
