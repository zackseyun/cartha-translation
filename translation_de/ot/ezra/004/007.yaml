base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: de
  text: Und zur Zeit des Artaxerxes schrieben Bischlam, Mitredat, Tabeel und die übrigen seiner Gefährten[a] an Artaxerxes, den König von Persien. Der Wortlaut des Schreibens war in aramäischer Schrift geschrieben und auf Aramäisch abgefasst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die übrigen ihrer Gefährten“. Das Suffix bei „Gefährten“ ist der Form nach singularisch, kann sich hier aber auf die genannte Gruppe beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräisch-aramäische Formulierung ist schwierig. Möglich ist auch: „Der Wortlaut des Schreibens war auf Aramäisch geschrieben und ins Aramäische übersetzt.“ Umstritten ist, ob zwischen Schrift und Sprache oder zwischen Schreiben und Übersetzen unterschieden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Und zur Zeit des
  rationale: Die zeitliche Wendung bedeutet wörtlich „und in den Tagen von“. „Und zur Zeit des“ ist im modernen Deutschen natürlich und bewahrt die Verknüpfung mit dem vorhergehenden Bericht, ohne sie als technische Regierungsformel festzulegen.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Artaxerxes
  rationale: Gebräuchliche deutsche Wiedergabe des persischen Königsnamens.
- source_word: כָּתַב
  choice: schrieben
  rationale: Das Verb bedeutet schlicht „schreiben“. Die Mehrzahl entspricht dem zusammengesetzten Subjekt; ein Gegenstand wie „Anklage“ wird nicht aus dem Kontext ergänzt.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bischlam, Mitredat, Tabeel
  rationale: Die Personennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben.
- source_word: וּשְׁאָר כנותו
  choice: und die übrigen seiner Gefährten
  rationale: שְׁאָר bezeichnet den verbleibenden Teil; das schwierige כנותו wird plausibel als „Gefährten/Mitarbeiter“ verstanden. Der formal singularische Suffixbezug bleibt mit „seiner“ sichtbar, während eine kollektive Deutung in der Fußnote genannt wird.
- source_word: עַל
  choice: an
  rationale: Bei כתב bezeichnet die Präposition in diesem Verwaltungskontext plausibel den Adressaten. „An“ ist idiomatisch und trägt nicht vorschnell die mögliche Bedeutung „gegen“ ein.
- source_word: מֶלֶךְ פָּרָס
  choice: den König von Persien
  rationale: Apposition zur Identifizierung des Artaxerxes; der deutsche Kasus richtet sich nach „an“.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Der Wortlaut des Schreibens
  rationale: כְתָב bezeichnet Schrift beziehungsweise Text; das seltene Lehnwort נשתון ein Schriftstück oder Schreiben. Die Wiedergabe macht deutlich, dass nun dessen sprachliche Gestalt beschrieben wird.
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: war in aramäischer Schrift geschrieben und auf Aramäisch abgefasst
  rationale: Die schwierige Doppelwendung unterscheidet wahrscheinlich aramäische Schrift von aramäischer Sprache. „Abgefasst“ gibt מתרגם hier vorsichtig als sprachliche Darbietung wieder, ohne eine Übersetzung aus einer nicht genannten Ausgangssprache zu behaupten; die alternative Analyse wird ausdrücklich vermerkt.
