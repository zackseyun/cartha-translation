source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: de
  text: Und sie engagierten Berater gegen sie, um ihren Plan zu vereiteln[a], von der gesamten Regierungszeit des Kyrus, des Königs von Persien, bis zur Regierungszeit des Darius, des Königs von Persien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihren Rat zunichtezumachen“. Das hebräische Wort עֵצָה kann „Rat“, „Plan“ oder „Vorhaben“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: Und sie warben … an
  rationale: Das Partizip von שׂכר bezeichnet hier die entgeltliche Verpflichtung von Personen. „anwerben“ gibt dies im Deutschen natürlich wieder, ohne die im Kontext nicht ausdrücklich belegte Bedeutung „bestechen“ einzutragen.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: Im feindseligen Zusammenhang und zusammen mit dem Zweck des Vereitelns hat עַל adversative Bedeutung.
- source_word: יוֹעֲצִים
  choice: Berater
  rationale: Das Wort aus der Wurzel יעץ bezeichnet Personen, die Rat geben. „Berater“ ist im modernen Deutschen verständlich und passt zum politisch-administrativen Zusammenhang.
- source_word: לְהָפֵר
  choice: um … zu vereiteln
  rationale: הפר kann „brechen“, „aufheben“ oder „vereiteln“ bedeuten. Bei einem Plan als Objekt bezeichnet „vereiteln“ die beabsichtigte Behinderung idiomatisch und präzise.
- source_word: עֲצָתָם
  choice: ihren Plan
  rationale: עֵצָה kann „Rat“, „Plan“ oder „Vorhaben“ bedeuten. Im Zusammenhang des Wiederaufbaus ist „Plan“ klar und bewahrt zugleich die sachliche Offenheit des Ausdrucks; die Alternative wird in der Fußnote genannt.
- source_word: כָּל יְמֵי
  choice: während der ganzen Regierungszeit
  rationale: Wörtlich bedeutet die Wendung „alle Tage“. In Verbindung mit einem König bezeichnet sie hier idiomatisch die gesamte Dauer seiner Herrschaft.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Kyrus, des Königs von Persien
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben, der Herrschertitel übersetzt.
- source_word: וְעַד
  choice: bis
  rationale: Die Verbindung markiert die zeitliche Erstreckung von der Herrschaft des Kyrus bis zur Herrschaft des Darius. Das deutsche „bis“ drückt dies knapp und natürlich aus.
- source_word: מַלְכוּת
  choice: Regierungszeit
  rationale: In dieser Zeitangabe meint מַלְכוּת die Periode königlicher Herrschaft, nicht das Herrschaftsgebiet. „Regierungszeit“ ist hier eindeutiger als „Königtum“ oder „Reich“.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Darius, des Königs von Persien
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben, der Herrschertitel übersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „Berater … anwerben“ vermittelt den entgeltlichen Einsatz gegen die Rückkehrer, ohne unbelegt eine Bestechung zu behaupten. Der Gedankenstrich macht die lange Zeitangabe gut lesbar; die Appositionen zu Kyrus und Darius bleiben ausdrücklich erhalten.
