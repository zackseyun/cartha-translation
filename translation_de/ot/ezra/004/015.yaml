revisions:
- from: Es soll im Chronikbuch deiner Vorgänger[a] nachgeforscht werden. Dann wirst du im Chronikbuch finden und erkennen, dass diese Stadt eine rebellische Stadt ist, die Königen und Provinzen Schaden zufügt, und dass in ihr seit alters Aufruhr gestiftet worden ist[b]. Deshalb wurde diese Stadt verwüstet.
  to: Damit man im Buch der Aufzeichnungen deiner Väter[a] nachforscht und du im Buch der Aufzeichnungen findest und erkennst, dass diese Stadt eine rebellische Stadt ist, die Königen und Provinzen Schaden zufügt, und dass in ihr seit alters Aufruhr getrieben wird[b]. Deshalb wurde diese Stadt verwüstet.
  rationale: Die Revision ersetzt das missverständliche „Chronikbuch“ durch „Buch der Aufzeichnungen“ und gibt die Wendung über Aufruhr weniger abgeschlossen und näher an ihrer allgemeinen bzw. fortdauernden Anschuldigung wieder. Die syntaktische Abfolge von Nachforschung, Auffinden und Erkenntnis sowie der amtlich-polemische Registerton bleiben erhalten.
