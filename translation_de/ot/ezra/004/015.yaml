  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: de
  text: Damit man im Buch der Aufzeichnungen deiner Väter[a] nachforscht und du im Buch der Aufzeichnungen findest und erkennst, dass diese Stadt eine rebellische Stadt ist, die Königen und Provinzen Schaden zufügt, und dass in ihr seit alters Aufruhr getrieben wird[b]. Deshalb wurde diese Stadt verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deiner Väter«; gemeint sein können deine Vorfahren oder, im Zusammenhang, frühere Herrscher.'
    reason: lexical_alternative
  - marker: b
    text: Die schwierige aramäische Wendung bezeichnet das Betreiben oder Anstiften von Aufruhr beziehungsweise Rebellion innerhalb der Stadt.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: es soll … nachgeforscht werden
  rationale: Die unpersönliche Formulierung gibt den auffordernden Sinn im höflich-amtlichen Stil des Schreibens wieder.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: Chronikbuch
  rationale: Die Wendung bezeichnet ein amtliches Erinnerungs- oder Urkundenbuch; „Chronikbuch“ bewahrt das konkrete Bild eines schriftlichen Registers.
- source_word: אֲבָהָתָךְ
  choice: deiner Vorgänger
  rationale: Wörtlich steht „deiner Väter“, doch im Zusammenhang sind die früheren Herrscher der imperialen Linie gemeint. Die kontextgerechte Bedeutung steht im Haupttext, die wörtliche Alternative in der Fußnote.
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: Dann wirst du … finden und erkennen
  rationale: Die beiden Verben bezeichnen das Auffinden in den Akten und die daraus folgende Erkenntnis; die Zukunftsform ist im Deutschen nach der Aufforderung natürlich.
- source_word: קִרְיָא מָרָדָא
  choice: eine rebellische Stadt
  rationale: Die Formulierung bewahrt die Anklage, die Stadt sei gegenüber der Staatsgewalt aufrührerisch.
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: die Königen und Provinzen Schaden zufügt
  rationale: Das Partizip beschreibt fortgesetztes Schädigen; „Schaden zufügen“ ist präzise und im amtlichen Zusammenhang idiomatisch.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: Aufruhr gestiftet worden ist
  rationale: Die schwierige aramäische Verbindung bezeichnet das Betreiben oder Anstiften von Aufruhr beziehungsweise Rebellion. Die passive Form bewahrt den unbestimmten Handlungsträger.
- source_word: מִן יוֹמָת עָלְמָא
  choice: seit alters
  rationale: Die idiomatische Wendung verweist auf weit zurückliegende Zeiten, nicht auf metaphysische Ewigkeit.
- source_word: הָחָרְבַת
  choice: wurde … verwüstet
  rationale: Das Passiv bezeichnet die Zerstörung beziehungsweise Verödung der Stadt; „verwüstet“ bewahrt die passive Aussage ohne einen Täter hinzuzufügen.
