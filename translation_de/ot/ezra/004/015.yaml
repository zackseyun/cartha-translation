  terminology: „Buch der Aufzeichnungen“ gibt den Charakter eines amtlichen Register- oder Archivbuchs angemessen wieder. „Väter“ bleibt im Text als wörtliche und traditionsnahe Bezeichnung erhalten; die Fußnote erläutert den möglichen Bezug auf Vorfahren beziehungsweise frühere Herrscher. „Aufruhr“ ist als sachliche Wiedergabe der schwierigen aramäischen Wendung geeignet.
