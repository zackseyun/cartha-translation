translation:
  language: de
  text: und zwanzig goldene Schalen im Wert von tausend Dareiken[a] sowie zwei Gefäße aus feiner, glänzender Bronze[b], kostbar wie Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwanzig goldene Schalen im Gesamtwert von tausend Dareiken“. Das Hebräische kann die tausend Dareiken ausdrücklich als Gesamtwert der Schalen angeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zwei Gefäße aus guter, polierter Bronze“. Der seltene hebräische Ausdruck beschreibt wahrscheinlich besonders hochwertige Bronze mit glänzender Oberfläche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי זָהָב
  choice: goldene Schalen
  rationale: כְפֹרֵי bezeichnet schalenartige Gefäße; „Schalen“ ist im Inventarkontext natürlich und hinreichend genau. זָהָב bezeichnet Gold.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: im Wert von tausend Dareiken
  rationale: אֲדַרְכֹנִים bezeichnet persische Dareiken; das vorangestellte ל wird hier plausibel als Wertangabe verstanden. Die historische Münzbezeichnung bleibt erhalten.
- source_word: וּכְלֵי
  choice: sowie ... Gefäße
  rationale: כְּלֵי ist eine breite Sachbezeichnung; bei Tempelgerät passt „Gefäße“. „Sowie“ verbindet die beiden Inventarposten natürlich.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Bei kunstvoll gefertigten Gefäßen ist „Bronze“ kontextuell wahrscheinlich.
- source_word: מֻצְהָב טוֹבָה
  choice: feiner, glänzender
  rationale: Die seltene und schwierige Verbindung beschreibt wahrscheinlich hochwertige Bronze mit glänzender oder polierter Erscheinung. Die Übersetzung vermeidet die ungesicherte Aussage, die Gefäße seien vergoldet.
- source_word: שְׁנַיִם
  choice: zwei
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: kostbar wie Gold
  rationale: חֲמוּדֹת bezeichnet hier Begehrtheit beziehungsweise hohen Wert; כַּזָּהָב setzt die Gefäße ausdrücklich mit Gold in Vergleich.
