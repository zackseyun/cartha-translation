base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: de
  text: Da ließ ich Elieser, Ariël, Schemaja, Elnatan, Jarib, Elnatan, Natan, Sacharja und Meschullam, die Oberhäupter[a], sowie Jojarib und Elnatan, Männer mit Einsicht[b], rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Köpfe“; gemeint sind führende Männer oder Leiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „verständige Männer“ oder „kundige Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Da ließ ich … rufen
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein. Im Kontext bedeutet שׁלח mit den durch ל bezeichneten Personen, dass Esra sie zu sich rufen ließ; diese deutsche Wendung gibt den Sinn natürlich wieder.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: Eliëser … sowie … Elnatan
  rationale: Das wiederholte ל kennzeichnet die Personen, an die der Ruf gerichtet ist. Bei „rufen lassen“ braucht es im Deutschen keine wiederholte Präposition.
- source_word: רָאשִׁים
  choice: Oberhäupter
  rationale: Das Substantiv bedeutet wörtlich „Köpfe“ und bezeichnet hier Männer in leitender Stellung. „Oberhäupter“ bewahrt das hebräische Bild besser als das allgemeinere „Leiter“ und ist im Deutschen verständlich.
- source_word: מְבִינִים
  choice: Männer mit Einsicht
  rationale: Das Partizip von בין bezeichnet verständige beziehungsweise einsichtige Menschen. Die Wiedergabe vermeidet die nicht ausdrücklich belegte Festlegung auf ein Amt wie „Lehrer“.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: sowie Jojarib und Elnatan, Männer mit Einsicht
  rationale: Die abschließende Apposition bezieht sich am natürlichsten auf die beiden unmittelbar vorangehenden Namen und unterscheidet sie von der als רָאשִׁים bezeichneten Gruppe.
- source_word: יוֹיָרִיב
  choice: Jojarib
  rationale: Diese Umschrift entspricht der hebräischen Namensform im vorliegenden Text und gängigen deutschen Bibelnamenskonventionen.
- source_word: אֶלְנָתָן
  choice: Elnatan
  rationale: Der dreimal vorkommende Name wird jedes Mal beibehalten; die Wiederholung gehört zum Quelltext und kann verschiedene gleichnamige Personen bezeichnen.
theological_decisions: []
