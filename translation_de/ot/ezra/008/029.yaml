source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: de
  text: Gebt sorgfältig acht und bewacht sie[a], bis ihr sie in Jerusalem vor den führenden Priestern, den Leviten und den Oberhäuptern der Sippen Israels[b] in den Räumen des Hauses Jahwes[c] abwiegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Seid wachsam und bewahrt sie.“ Die beiden hebräischen Befehlsformen betonen die sorgfältige Aufsicht über das anvertraute Gut.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Oberhäupter der Vaterhäuser Israels“; gemeint sind die Leiter angestammter Großfamilien oder Sippen.'
    reason: cultural_note
  - marker: c
    text: Das „Haus Jahwes“ ist hier der Tempel.
    reason: clarification
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Gebt sorgfältig acht und bewacht sie
  rationale: שׁקד fordert zu wachsamer Sorgfalt auf, שׁמר zum schützenden Bewahren. Das aus dem Zusammenhang ergänzte „sie“ bezieht sich auf die anvertrauten Wertgegenstände.
- source_word: עַד תִּשְׁקְלוּ
  choice: bis ihr sie … abwiegt
  rationale: שׁקל bezeichnet hier das kontrollierte Wiegen der anvertrauten Wertgegenstände zur Übergabe und Rechenschaft.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: die führenden Priester
  rationale: שׂרים bezeichnet Leiter oder Vorsteher. „Führende Priester“ gibt ihren Rang wieder, ohne den späteren Fachbegriff „Hohepriester“ einzutragen.
- source_word: וְהַלְוִיִּם
  choice: die Leviten
  rationale: Die herkömmliche deutsche Bezeichnung gibt die ethnisch-kultische Gruppe direkt wieder.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: die Oberhäupter der Sippen Israels
  rationale: Die hebräische Wendung bezeichnet die Leiter väterlicher beziehungsweise angestammter Großfamilienverbände. „Sippen“ ist im Deutschen verständlicher als eine wörtliche Wiedergabe mit „Vaterhäusern“ und bewahrt den sozialen Umfang besser als bloß „Familien“.
- source_word: הַלִּשְׁכוֹת
  choice: die Räume
  rationale: לשכות sind Kammern oder Räume innerhalb des Tempelkomplexes. „Räume“ bleibt natürlich und legt ihre besondere Nutzung nicht unnötig als Lager fest.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die hebräische Benennung „Haus JHWHs“ wird formal bewahrt; im Kontext ist damit der Tempel gemeint. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der priesterlichen Leiter
  choice: führende Priester
  alternative: Oberpriester
  rationale: Die Übersetzung wahrt die allgemeine Leitungsbezeichnung שׂרים und vermeidet eine mögliche Gleichsetzung mit späteren institutionellen oder neutestamentlichen Ämtern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem Übergabevorgang, ohne die dichte hebräische Aufzählung unnötig aufzulösen. „Führende Priester“ und „Sippen“ vermeiden missverständliche Fachsprache; „Haus Jahwes“ erhält das biblische Bild.
