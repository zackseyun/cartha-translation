  register: Modernes, gehobenes Standarddeutsch. Die hebräische Satzstellung wurde behutsam umgeordnet, damit eindeutig bleibt, dass die Menschen – nicht das Geschlechtsregister – aus Babylon heraufzogen. Der Doppelpunkt eröffnet die anschließende Namensliste.
