  text: וְ/אֵ֛לֶּה רָאשֵׁ֥י אֲבֹתֵי/הֶ֖ם וְ/הִתְיַחְשָׂ֑/ם הָ/עֹלִ֣ים עִמִּ֗/י בְּ/מַלְכ֛וּת אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ מִ/בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: de
  text: 'Dies sind die Sippenoberhäupter derer, die unter der Herrschaft des Königs Artaxerxes mit mir aus Babylon heraufzogen, samt ihrer Eintragung ins Geschlechtsregister[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „samt ihrem Geschlechtsverzeichnis“ oder „samt den nach ihrer Abstammung Eingetragenen“. Der hebräische Ausdruck bezeichnet eine genealogische Erfassung oder deren Verzeichnis, nicht lediglich die Abstammung an sich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Leitet die folgende Liste ein. Das deutsche „Dies sind“ gibt die demonstrative Einführung natürlich wieder; das vorangestellte וְ benötigt hier kein eigenes „und“.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: die Sippenoberhäupter derer
  rationale: Wörtlich steht eine Verbindung aus „Oberhäupter“ und „Väter“. Im genealogisch-administrativen Zusammenhang sind die führenden Vertreter der väterlichen Sippen beziehungsweise Großfamilien gemeint. „Sippenoberhäupter“ ist im modernen Deutsch verständlich und würdevoll.
- source_word: וְהִתְיַחְשָׂם
  choice: samt ihrer Eintragung ins Geschlechtsregister
  rationale: Der Ausdruck bezeichnet genealogische Erfassung oder Registrierung, nicht nur Abstammung im abstrakten Sinn. „Samt“ bindet die Angabe natürlich an die genannten Rückkehrer an.
- source_word: הָעֹלִים
  choice: die … heraufzogen
  rationale: עלה ist die übliche Bezeichnung für den Aufbruch hinauf nach Juda beziehungsweise Jerusalem. Das Präteritum entspricht dem erzählten vergangenen Geschehen.
- source_word: עִמִּי
  choice: mit mir
  rationale: Gibt Präposition und Suffix der ersten Person Singular direkt wieder und bewahrt Esras Ich-Perspektive.
- source_word: בְּמַלְכוּת
  choice: unter der Herrschaft
  rationale: Bezeichnet hier die Regierungszeit beziehungsweise Königsherrschaft. Die Formulierung ist natürlich und lässt beide Aspekte anklingen.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: des Königs Artaxerxes
  rationale: Verwendet die im modernen Deutschen geläufige Namensform und stellt den Titel entsprechend deutscher Syntax voran.
- source_word: מִבָּבֶל
  choice: aus Babylon
  rationale: Gibt den Ausgangsort des Heraufziehens direkt wieder.
