base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: de
  text: 'Dann sonderte ich von den führenden Priestern zwölf aus: Scherebja, Haschabja und mit ihnen zehn ihrer Brüder.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung ist syntaktisch ungewöhnlich. Die Aufzählung kann die zwölf Ausgesonderten bezeichnen; möglich ist auch, die genannten Männer zusätzlich zu den zwölf zu verstehen.
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: „Brüder“ kann hier weiter gefasst Verwandte oder Angehörige derselben Gruppe bezeichnen; im Hebräischen steht der männliche Verwandtschaftsbegriff.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Dann sonderte ich … aus
  rationale: Der Hifil von בדל bezeichnet ein Trennen oder Aussondern. „Aussondern“ bewahrt den Gedanken einer bewussten Auswahl für eine besondere Aufgabe; „Dann“ gibt die erzählerische Abfolge wieder.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: von den führenden Priestern
  rationale: שַׂר bezeichnet einen Obersten, Leiter oder führenden Amtsträger. Die partitive Präposition מִן wird mit „von den“ wiedergegeben.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: dazu Scherebja, Haschabja
  rationale: Die Personennamen werden nach geläufiger deutscher Bibelschreibung transliteriert. Das לְ vor Scherebja ist syntaktisch auffällig; „dazu“ gibt im Zusammenhang die wahrscheinlich additive Beziehung wieder, ohne Scherebja und Haschabja gegen den hebräischen Wortlaut eindeutig zu den zwölf Priestern zu rechnen.
- source_word: וְעִמָּהֶם
  choice: und mit ihnen
  rationale: Die Konjunktion und die Präpositionalphrase werden ausdrücklich beibehalten.
- source_word: מֵאֲחֵיהֶם
  choice: ihrer Brüder
  rationale: אָח bezeichnet wörtlich einen Bruder, kann im Plural jedoch auch Verwandte oder Angehörige derselben Gruppe meinen. Die Hauptübersetzung wahrt den familiären Ausdruck des Hebräischen.
- source_word: עֲשָׂרָה
  choice: zehn
  rationale: Direkte Wiedergabe der Kardinalzahl.
theological_decisions:
- issue: Verhältnis der zwölf führenden Priester zu Scherebja, Haschabja und den zehn Brüdern
  choice: Die genannten Männer werden mit „dazu“ als zusätzliche Gruppe dargestellt.
  alternative: Scherebja, Haschabja und ihre zehn Brüder können als die zwölf zuvor genannten führenden Priester verstanden werden.
  rationale: Der masoretische Text setzt nach „zwölf“ einen deutlichen Einschnitt und hat vor Scherebja die Präposition לְ statt einer klaren Appositionsmarkierung. Zudem erscheinen Scherebja und Haschabja im Kontext als Leviten. Die ungewöhnlich knappe Syntax lässt jedoch die appositionelle traditionelle Deutung zu; deshalb wird sie in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aussondern“ ist etwas gehobener, bleibt aber verständlich und trägt den besonderen Auftrag mit. Die Syntax ist bewusst klar, während die echte Unsicherheit über die Zusammensetzung der Gruppe in Fußnote [a] erhalten bleibt.
