source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י עַזְגָּ֔ד יוֹחָנָ֖ן בֶּן הַ/קָּטָ֑ן וְ/עִמּ֕/וֹ מֵאָ֥ה וַ/עֲשָׂרָ֖ה הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: de
  text: 'Und von den Nachkommen Asgads: Johanan, der Sohn Hakkatans[a], und mit ihm 110 männliche Personen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Johanan, der Sohn des Jüngeren«; הַקָּטָן kann hier statt als Name auch beschreibend verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Von den Nachkommen
  rationale: בְּנֵי bezeichnet in dieser Sippenliste eine weiter gefasste Abstammungsgruppe. »Nachkommen« gibt den gemeinten Familienverband im heutigen Deutsch natürlicher und eindeutiger wieder als das wörtliche »Söhne«; die einleitende Konjunktion muss im isolierten Vers nicht eigens mit »und« wiedergegeben werden.
- source_word: עַזְגָּד
  choice: Asgad
  rationale: Der Personen- beziehungsweise Sippenname wird in einer im Deutschen gebräuchlichen, quellenahen Form wiedergegeben.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Quellennahe und im Deutschen geläufige Wiedergabe des Eigennamens.
- source_word: בֶּן הַקָּטָן
  choice: der Sohn Hakkatans[a]
  rationale: Im Zusammenhang der Namensliste wird הַקָּטָן am ehesten als Eigenname beziehungsweise Beiname Hakkatan verstanden. Die alternative beschreibende Deutung bleibt in einer Fußnote erhalten.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Gibt die wiederkehrende Listenformel und die hebräische Konjunktion direkt wieder.
- source_word: מֵאָה וַעֲשָׂרָה
  choice: '110'
  rationale: Die Zahl bedeutet einhundertzehn; Ziffern sind in einer modernen Aufzählung übersichtlich.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: זְכָרִים bezeichnet ausdrücklich Personen männlichen Geschlechts, ohne zwingend nur erwachsene Männer zu meinen. »Männliche Personen« bewahrt diese Genauigkeit in natürlichem, sachlichem Deutsch.
theological_decisions:
- issue: Deutung von הַקָּטָן
  choice: als Eigenname bzw. Beiname »Hakkatan«
  alternative: »der Jüngere« beziehungsweise »der Kleine«
  rationale: Die Listenstruktur legt eine patronymische Namensangabe nahe, doch die Form kann sprachlich auch beschreibend verstanden werden. Diese echte Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Knappes, würdevolles Listendeutsch. »Nachkommen« macht die Sippenbedeutung von בְּנֵי für heutige Leser unmittelbar verständlich. Die geschlechtsspezifische Zählung wird ausdrücklich beibehalten.
