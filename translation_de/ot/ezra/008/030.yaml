base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: de
  text: Da nahmen die Priester und die Leviten die abgewogene Menge an Silber, Gold und Geräten[a] in Empfang, um sie nach Jerusalem[b] in das Haus unseres Gottes zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gewicht an Silber, Gold und Geräten“. Das hebräische Wort kann das Gewicht selbst oder die nach Gewicht bestimmte Menge bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Tempel unseres Gottes“. Wörtlich: „in das Haus unseres Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: So nahmen … in Empfang
  rationale: Das Qal Perfekt bezeichnet hier die Übernahme der zuvor abgewogenen Kostbarkeiten in die eigene Obhut. „In Empfang nehmen“ gibt den Übergabe- und Verantwortungszusammenhang natürlich wieder; das einleitende וְ wird im Erzählfluss mit „So“ wiedergegeben.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Direkte und im Deutschen etablierte Wiedergabe der beiden bestimmten Pluralformen.
- source_word: מִשְׁקַל
  choice: die abgewogene Menge
  rationale: מִשְׁקַל kann das Gewicht oder die nach Gewicht bestimmte Menge bezeichnen. Im Kontext der zuvor genau abgewogenen Wertgegenstände drückt „abgewogene Menge“ die Quantifizierung aus, ohne den Ausdruck auf einen bloßen Wiegevorgang zu reduzieren.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: an Silber, Gold und Geräten
  rationale: כסף und זהב werden als die Edelmetalle „Silber“ und „Gold“ wiedergegeben. כֵּלִים ist ein weiter Begriff für Gegenstände beziehungsweise Gerätschaften; „Geräte“ ist hier verständlich und passt zum kultischen Zusammenhang, ohne die Gegenstände genauer festzulegen als der hebräische Text.
- source_word: לְהָבִיא
  choice: um sie … zu bringen
  rationale: Der Infinitiv mit לְ bezeichnet den Zweck. Das Pronomen „sie“ nimmt im Deutschen natürlich die genannten Kostbarkeiten und Geräte auf.
- source_word: לִירוּשָׁלַם
  choice: nach Jerusalem
  rationale: Die Zielrichtung wird bei Städten im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: in das Haus unseres Gottes
  rationale: Die Formulierung bewahrt das hebräische Bild „Haus unseres Gottes“. Wegen der Bewegung auf ein Ziel hin ist „in das Haus“ im Deutschen natürlicher als „zu dem Haus“; „Tempel“ wäre eine sachlich passende, aber stärker deutende Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bewahrt die administrative Genauigkeit des Kontexts und die wörtliche Bezeichnung „Haus unseres Gottes“, ohne durch unnötig sakrale oder altertümliche Wortwahl schwer verständlich zu werden.
