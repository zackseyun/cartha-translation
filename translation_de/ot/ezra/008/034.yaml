  text: בְּ/מִסְפָּ֥ר בְּ/מִשְׁקָ֖ל לַ/כֹּ֑ל וַ/יִּכָּתֵ֥ב כָּֽל הַ/מִּשְׁקָ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/034.yaml
  text: Everything was counted by number and by weight, and the total weight was recorded at that time.
translation:
  language: de
  text: Alles wurde nach Anzahl und Gewicht erfasst[a], und das Gesamtgewicht wurde zu jener Zeit schriftlich festgehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nach Zahl, nach Gewicht, für alles; und das ganze Gewicht wurde zu jener Zeit aufgeschrieben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: nach Anzahl
  rationale: מִסְפָּר bezeichnet Zahl oder Anzahl. Zusammen mit בְּמִשְׁקָל beschreibt die Wendung die geordnete Bestandsaufnahme der übergebenen Kostbarkeiten.
- source_word: בְּמִשְׁקָל
  choice: nach Gewicht
  rationale: מִשְׁקָל bedeutet „Gewicht“. Die Übersetzung bewahrt die parallele Struktur der beiden Präpositionalangaben.
- source_word: לַכֹּל
  choice: Alles wurde … erfasst
  rationale: Die Wendung zeigt, dass die Zählung und Wägung die gesamte Übergabe umfasste. Im Deutschen wird dieser Gesamtbezug idiomatisch durch das vorangestellte „Alles“ wiedergegeben.
- source_word: וַיִּכָּתֵב
  choice: wurde schriftlich festgehalten
  rationale: Die Niphal-Form von כתב ist passiv („wurde geschrieben“). Im Verwaltungskontext gibt „schriftlich festgehalten“ den Vorgang natürlich und genau wieder.
- source_word: כָּל הַמִּשְׁקָל
  choice: das Gesamtgewicht
  rationale: Wörtlich steht „alles/das ganze Gewicht“. „Das Gesamtgewicht“ bezeichnet im Deutschen klar die vollständig ermittelte und dokumentierte Gewichtsmenge.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Die Formulierung bewahrt sowohl den Zeitbezug als auch die demonstrative Nuance von הַהִיא.
