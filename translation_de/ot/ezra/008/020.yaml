revisions:
- from: Dazu kamen 220 Tempeldiener[a] aus der Gruppe, die David und die führenden Männer zur Unterstützung der Leviten bei ihrem Dienst bestimmt hatten. Sie alle waren namentlich benannt.[b]
  to: Und von den Tempeldienern[a], die David und die führenden Männer für den Dienst der Leviten bestimmt hatten, waren es 220 Tempeldiener; sie alle waren namentlich verzeichnet.[b]
  rationale: Die Revision wahrt die offene Beziehung der Netinim zum „Dienst der Leviten“, ohne eine bloße Unterstützungsfunktion festzulegen. Zugleich gibt „namentlich verzeichnet“ die formale Erfassung durch Namen im Kontext genauer und idiomatischer wieder. Zahl, technische Bezeichnung und Fußnotenanker bleiben erhalten.
