  - severity: low
    issue: „waren namentlich benannt“ ist weniger präzise und stilistisch schwerfälliger.
    rationale: נִקְּבוּ בְשֵׁמוֹת bezeichnet hier die ausdrückliche namentliche Erfassung bzw. Auflistung. „Namentlich verzeichnet“ gibt diesen administrativen Sinn natürlich wieder.
  revised_text: Und von den Tempeldienern[a], die David und die führenden Männer für den Dienst der Leviten bestimmt hatten, waren es 220 Tempeldiener; sie alle waren namentlich verzeichnet.[b]
