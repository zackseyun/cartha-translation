source:
  edition: WLC
  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: de
  text: Und von den Tempeldienern[a], die David und die führenden Männer für den Dienst der Leviten bestimmt hatten, waren es 220 Tempeldiener; sie alle waren namentlich verzeichnet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Netinim, ein Fachbegriff für eine bestimmte Gruppe von Tempeldienern.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Sie alle waren namentlich benannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: Tempeldiener
  rationale: Der technische Ausdruck bezeichnet eine fest umrissene Gruppe, die dem Tempeldienst zugeordnet war. »Tempeldiener« gibt ihre Funktion verständlich wieder; die traditionelle Bezeichnung »Netinim« wird in der Fußnote genannt.
- source_word: שֶׁנָּתַן
  choice: bestimmt hatten
  rationale: Das Verb bedeutet wörtlich »gegeben hatten«, bezeichnet hier aber die Zuweisung von Personen zu einer bestimmten Aufgabe.
- source_word: וְהַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet ranghohe Verantwortliche. Diese Wiedergabe ist natürlich und wahrt den sozialen Rang, ohne das im Deutschen missverständliche »Fürsten« zu verwenden.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: zur Unterstützung der Leviten bei ihrem Dienst
  rationale: Die Formulierung macht die funktionale Zuordnung zum Dienst der Leviten deutlich, ohne die Tempeldiener mit den Leviten gleichzusetzen.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Die Ziffernschreibung entspricht modernem deutschem Gebrauch und bewahrt die genaue Zahl.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Formulierung erhält die umfassende Betonung des hebräischen Ausdrucks.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: waren namentlich benannt
  rationale: Die Wendung bezeichnet die ausdrückliche Identifizierung jedes Einzelnen; ob dabei besonders eine schriftliche Liste gemeint ist, bleibt offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde für natürliche deutsche Lesbarkeit neu gegliedert. Die funktionale Bedeutung des technischen Begriffs wird im Haupttext wiedergegeben, während die hebräische Bezeichnung in der Fußnote erhalten bleibt.
