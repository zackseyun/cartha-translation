  timestamp: '2026-07-15T16:19:50Z'
review_pass:
  verdict: revise
  source_fidelity: Die Zahl und die technische Gruppe der נְתִינִים sind zutreffend wiedergegeben. Die Formulierung „zur Unterstützung der Leviten bei ihrem Dienst“ legt jedoch eine unterstützende Tätigkeit stärker fest, als לַעֲבֹדַת הַלְוִיִּם verlangt. „für den Dienst der Leviten“ bewahrt die syntaktische und sachliche Offenheit des Hebräischen. Für נִקְּבוּ בְשֵׁמוֹת ist „namentlich verzeichnet“ im administrativen Kontext idiomatischer und genauer als „namentlich benannt“.
  naturalness: Der Satz ist insgesamt verständlich und modern. Die revidierte Fassung vermeidet die etwas erklärende Umschreibung „zur Unterstützung ... bei ihrem Dienst“ und verwendet mit „namentlich verzeichnet“ eine natürliche deutsche Verwaltungsformulierung.
  terminology: „Tempeldiener“ gibt den technischen Status der Netinim angemessen wieder; die Fußnote bewahrt die hebräische Bezeichnung. „führende Männer“ ist als Wiedergabe von שָׂרִים möglich. „Dienst der Leviten“ ist gegenüber einer konkretisierenden Unterstützungsformulierung vorzuziehen.
  issues:
