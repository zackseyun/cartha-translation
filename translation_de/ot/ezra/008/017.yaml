  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: de
  text: 'Und ich sandte sie zu Iddo, dem Obersten, am Ort Kasifja. Ich gab ihnen Worte mit, die sie zu Iddo und seinen Brüdern, den Tempeldienern[a] am Ort Kasifja, sagen sollten: „Bringt uns Diener[b] für das Haus unseres Gottes!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Netinim“; so hieß eine an den Dienst am Heiligtum gebundene Gruppe.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Menschen, die im Tempel Dienst tun, nicht notwendigerweise Inhaber eines später festgelegten religiösen Amtes.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: Und ich sandte
  rationale: Der Hifil von יצא bedeutet hier im Zusammenhang mit der Beauftragung von Abgesandten idiomatisch „senden“.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Iddo, dem Obersten
  rationale: הָרֹאשׁ bezeichnet den Verantwortlichen oder Leiter; „der Oberste“ bewahrt den Titelcharakter, ohne eine genauere Amtsform festzulegen.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: an dem Ort Kasifja
  rationale: Die Wiedergabe erhält ausdrücklich מָקוֹם („Ort“) und bleibt im Deutschen verständlich.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: Ich legte ihnen Worte in den Mund
  rationale: Die hebräische Redewendung für eine vorgegebene Botschaft wird bildhaft und zugleich verständlich wiedergegeben.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: zu Iddo und seinen Brüdern
  rationale: Der Plural des folgenden Partizips stützt die kollektive Lesart „seine Brüder“; gemeint sind Iddo und die mit ihm verbundene Gruppe.
- source_word: הַנְּתוּנִים
  choice: den Tempeldienern
  rationale: Der Ausdruck bezeichnet in Esra-Nehemia eine an den Heiligtumsdienst gebundene Personengruppe; die Funktionsbezeichnung ist für heutige Leser transparent.
- source_word: מְשָׁרְתִים
  choice: Diener
  rationale: Das Wort bezeichnet Personen, die Dienst verrichten, hier für das Haus Gottes. „Diener“ vermeidet die moderne kirchenamtliche Konnotation von „Amtsträger“.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: für das Haus unseres Gottes
  rationale: Diese Formulierung bewahrt die hebräische Ausdrucksweise und ihre religiöse Bedeutung.
theological_decisions:
- issue: Wiedergabe von הַנְּתוּנִים als besondere Gruppe im Tempeldienst
  choice: Tempeldiener
  alternative: Netinim
  rationale: Die funktionale Übersetzung macht die historische Rolle verständlich; die traditionelle Bezeichnung wird in der Fußnote genannt, ohne eine spätere kirchliche Amtsstruktur einzutragen.
- issue: Verhältnis von הַנְּתוּנִים und מְשָׁרְתִים
  choice: Tempeldiener für die benannte Gruppe; Diener für die gesuchten Dienstleistenden
  alternative: beide Male „Diener“ oder מְשָׁרְתִים als „Amtsträger“
  rationale: Die unterschiedliche Wortwahl wahrt die lexikalische Unterscheidung. Zugleich wird nicht behauptet, מְשָׁרְתִים bezeichne ein später formalisiertes religiöses Amt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit leicht gegliedert; das hebräische Bild „Worte in den Mund legen“ sowie „Haus unseres Gottes“ bleiben erhalten. Die beiden Fußnotenmarker [a] und [b] stehen an den jeweils erläuterten Ausdrücken.
