source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: de
  text: Am zwölften Tag des ersten Monats brachen wir vom Fluss Ahawa auf, um nach Jerusalem zu ziehen. Die Hand unseres Gottes war über uns, und er rettete uns aus der Hand des Feindes und vor denen, die uns unterwegs auflauerten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und vor einem Hinterhalt unterwegs“. Das hebräische Partizip kann denjenigen bezeichnen, der auflauert, oder sinngemäß die Gefahr eines Hinterhalts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: brachen wir ... auf
  rationale: נסע bezeichnet hier das Aufbrechen zu einer Reise, ursprünglich das Abbrechen des Lagers. „Aufbrechen“ ist natürlich und wahrt die erzählerische Bewegung.
- source_word: מִנְּהַר אֲהֲוָא
  choice: vom Fluss Ahawa
  rationale: נָהָר bedeutet „Fluss“; der Ortsname wird in einer dem Hebräischen entsprechenden deutschen Form wiedergegeben.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: Am zwölften Tag des ersten Monats
  rationale: Das im Hebräischen unausgesprochene „Tag“ wird entsprechend dem deutschen Datumsidiom ergänzt.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: um nach Jerusalem zu ziehen
  rationale: Der Infinitiv bezeichnet den Zweck des Aufbruchs. „Ziehen“ passt zu einer Reisegruppe und vermeidet die Wiederholung von „aufbrechen“.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: Die Hand unseres Gottes war über uns
  rationale: Das wiederkehrende Bild von Gottes Hand wird bewahrt; „über uns“ gibt עַל natürlich und verständlich wieder und bezeichnet hier Gottes wirksamen Beistand.
- source_word: וַיַּצִּילֵנוּ
  choice: und er rettete uns
  rationale: נצל bezeichnet die Rettung beziehungsweise Befreiung aus konkreter Gefahr. „Retten“ ist im modernen Deutsch klar und würdevoll.
- source_word: מִכַּף אוֹיֵב
  choice: aus der Hand des Feindes
  rationale: כַּף bezeichnet wörtlich die Handfläche beziehungsweise Hand und bildlich Gewalt oder Zugriff. Die wörtliche Bildsprache schafft zudem einen bewussten Kontrast zur Hand Gottes.
- source_word: וְאוֹרֵב
  choice: und vor denen, die uns ... auflauerten
  rationale: Das substantivierte Partizip bezeichnet am unmittelbarsten einen oder mehrere Auflauernde. Die deutsche Relativkonstruktion ist natürlicher als „vor dem Auflauernden“ und bewahrt den Personenbezug.
- source_word: עַל הַדָּרֶךְ
  choice: unterwegs
  rationale: Wörtlich „auf dem Weg“; „unterwegs“ verbindet die Gefahr idiomatisch mit der Reise.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Schutz
  choice: Das Bild „Die Hand unseres Gottes war über uns“ bleibt im Haupttext erhalten.
  alternative: Unser Gott beschützte uns.
  rationale: Der hebräische Text verwendet ausdrücklich das in Esra-Nehemia wiederkehrende Motiv der Hand Gottes. Eine reine Bedeutungsparaphrase würde diese literarische und theologische Verbindung abschwächen.
- issue: Singularische Form אוֹיֵב
  choice: „des Feindes“ im Singular
  alternative: „der Feinde“
  rationale: Die kollektive oder generische singularische Ausdrucksweise des Hebräischen wird erhalten, ohne festzulegen, ob nur ein einzelner Gegner gemeint ist.
- issue: Referenz von וְאוֹרֵב
  choice: Personenbezogene Wiedergabe im Haupttext
  alternative: „vor einem Hinterhalt“ als Bezeichnung der Gefahr
  rationale: Die Form ist ein Partizip und bezeichnet formal jemanden, der auflauert; zugleich kann die Wendung idiomatisch auf die Gefahr eines Hinterhalts zielen. Diese Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache der „Hand“ wird erhalten; Satzbau und Reisevokabular bleiben für heutige Leser unmittelbar verständlich. Der Fußnotenmarker [a] steht nach der betreffenden Wendung.
