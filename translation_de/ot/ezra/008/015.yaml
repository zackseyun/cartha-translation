  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: de
  text: Ich versammelte sie am Fluss, der nach Ahawa führt[a], und wir lagerten dort drei Tage. Dann prüfte ich das Volk und die Priester, und von den Söhnen Levis[b] fand ich dort keinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Kanal, der nach Ahawa führt“. Das hebräische Wort kann in diesem Umfeld sowohl einen Fluss als auch einen künstlich angelegten Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: von den Leviten.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Ich versammelte sie
  rationale: קבץ bezeichnet das Sammeln oder Versammeln; die Form bewahrt Esras aktive Rolle und klingt im Deutschen natürlich.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: am Fluss, der nach Ahawa führt
  rationale: נָהָר bedeutet gewöhnlich „Fluss“, kann in diesem mesopotamischen Umfeld aber auch einen Kanal bezeichnen. „führt“ gibt die räumliche Beziehung von בוא idiomatisch wieder, ohne die Richtung stärker festzulegen als nötig.
- source_word: וַנַּחֲנֶה
  choice: wir lagerten
  rationale: חנה bedeutet lagern beziehungsweise ein Lager aufschlagen; „lagerten“ ist knapp, modern und dem Reisezusammenhang angemessen.
- source_word: יָמִים שְׁלֹשָׁה
  choice: drei Tage
  rationale: Direkte Wiedergabe der Zeitangabe in natürlicher deutscher Wortstellung.
- source_word: וָאָבִינָה
  choice: Dann musterte ich
  rationale: בין bezeichnet hier ein aufmerksames Prüfen oder Erfassen der versammelten Gruppe. „mustern“ vermittelt die konkrete Überprüfung ihrer Zusammensetzung.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: das Volk und die Priester
  rationale: Die beiden Gruppen werden entsprechend der hebräischen Koordination unmittelbar genannt; „Volk“ und „Priester“ sind die üblichen sachgerechten Entsprechungen.
- source_word: וּמִבְּנֵי לֵוִי
  choice: von den Söhnen Levis
  rationale: Die wörtliche genealogische Wendung „Söhne Levis“ bleibt erhalten; die Präposition מִן wird mit „von“ wiedergegeben und bezeichnet die Gruppe, aus der niemand angetroffen wurde.
- source_word: לֹא מָצָאתִי שָׁם
  choice: fand ich dort keinen
  rationale: Die im Hebräischen aus dem Kontext ergänzte Personengruppe wird im Deutschen durch „keinen“ aufgenommen; so bleibt die Aussage knapp und eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am hebräischen Satzbau, wird jedoch durch „führt“, „lagerten“ und „musterte“ idiomatisch lesbar. Die genealogische Bezeichnung „Söhne Levis“ bleibt im Haupttext erhalten; die geläufige Gruppenbezeichnung steht in der Fußnote.
