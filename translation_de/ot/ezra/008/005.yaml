  text: מִ/בְּנֵ֥י שְׁכַנְיָ֖ה בֶּן יַחֲזִיאֵ֑ל וְ/עִמּ֕/וֹ שְׁלֹ֥שׁ מֵא֖וֹת הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/005.yaml
  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: de
  text: Von den Söhnen Schechanjas, des Sohnes Jahasiëls, und mit ihm dreihundert männliche Personen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Männer“. Das Hebräische bezeichnet ausdrücklich Personen männlichen Geschlechts und legt weder ihr Alter noch ihren gesellschaftlichen Status fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Söhnen
  rationale: Die Verbindung aus מִן und בְּנֵי leitet eine Gruppe innerhalb der Aufzählung ein. Die genealogische Listenformel „Söhne“ bleibt erhalten.
- source_word: שְׁכַנְיָה
  choice: Schechanja
  rationale: Der Personenname wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben.
- source_word: בֶּן יַחֲזִיאֵל
  choice: der Sohn Jahasiëls
  rationale: בֶּן bezeichnet hier den Sohn beziehungsweise Vertreter der genannten Sippe. Der hebräische Text nennt vor „Sohn Jahasiëls“ keinen weiteren Eigennamen; diese auffällige Form wird nicht ergänzt oder stillschweigend geglättet.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Die koordinierte Wendung setzt den Listeneintrag fort und bezeichnet die Begleitgruppe des genannten Mannes.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: dreihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: זְכָרִים bezeichnet ausdrücklich Personen männlichen Geschlechts. „Männliche Personen“ ist im Deutschen präziser und natürlicher als das substantivierte „Männliche“ und legt kein Erwachsenenalter fest.
theological_decisions: []
